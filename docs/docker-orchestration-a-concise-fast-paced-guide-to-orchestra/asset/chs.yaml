- "# Docker 编排入门\n\n最初，互联网服务运行在硬件上，生活还算可以。为了扩展服务以处理峰值容量，需要购买足够的硬件来处理负载。当不再需要负载时，硬件会闲置或未充分利用，但随时准备服务。未使用的硬件是资源的浪费。此外，由于每次新安装时我们所做的细微变化，配置漂移的威胁始终存在。\n\
  \n接着是虚拟机（VM），生活变得美好。VM 可以根据需要进行扩展，且不会过度。多个 VM 可以在同一硬件上运行。如果需求增加，可以在任何有空间的物理服务器上启动新的\
  \ VM。可以在更少的硬件上完成更多工作。更棒的是，需要时可以在几分钟内启动新的 VM，负载减轻时销毁它们。甚至可以将硬件外包给 Amazon、Google 和\
  \ Microsoft 等公司。因此，弹性计算诞生了。\n\nVM 也有自身的问题。每个 VM 都需要分配额外的内存和存储空间来支持操作系统。此外，每个虚拟化平台都有自己的做事方式。与一个系统配合工作的自动化必须完全重新调整才能与另一个系统配合工作。供应商锁定成为一个问题。\n\
  \n然后 Docker 出现了。VM 对硬件所做的，Docker 对 VM 也同样如此。服务可以跨多个服务器甚至多个提供商启动。部署后，容器可以在几秒钟内启动，而无需承载完整\
  \ VM 的资源开销。更棒的是，在 Docker 中开发的应用程序可以以构建时完全相同的方式部署，最大限度地减少配置漂移和包维护的问题。\n\n问题是：如何实现？这个过程称为\
  \ **编排**，就像管弦乐队一样，构建一个工作集群需要多个组件。在接下来的章节中，我将展示几种将这些组件组合在一起的方法，以构建可扩展、可靠的服务，并实现更快速、更一致的部署。\n\
  \n让我们快速回顾一下基础知识，以便大家步调一致。以下主题将被介绍：\n\n- 了解如何在 **Amazon Web Services (AWS)**、**Google\
  \ Compute Engine (GCE)**、Microsoft Azure 和使用 `docker-machine` 的通用 Linux 主机上安装 Docker\
  \ Engine\n- Docker 特定发行版（包括 CoreOS、RancherOS 和 Project Atomic）简介\n- 使用 Docker 启动、停止和检查容器\n\
  - 管理 Docker 镜像\n\n## 安装 Docker Engine\n\nDocker Engine 是实际在每个 Docker 主机上运行和控制容器的进程。它是让集群工作的引擎。它提供运行和管理容器的守护进程、各种工具用于与\
  \ Docker 交互的 API，以及命令行界面。\n\nDocker Engine 很容易使用 Docker 提供的脚本进行安装。Docker 项目建议通过\
  \ `sh` 管道下载：\n\n```\n$ wget -qO - https://get.docker.com/ | sh\n```\n\n我无法过分强调这种做法有多危险。如果\
  \ `https://www.docker.com/` 被攻破，您下载的脚本可能会攻破您的系统。相反，请将文件下载到本地并对其进行审查，以确保您对脚本的操作感到满意。审查后，您可以将其加载到本地\
  \ Web 服务器以便轻松访问，或使用 Puppet、Chef 或 Ansible 等配置管理工具将其推送出去：\n\n```\n$ wget -qO install-docker.sh\
  \ https://get.docker.com/\n```\n\n\n\n查看脚本后，运行它：\n\n```\n$ sh install-docker.sh\n\
  ```\n\n运行安装脚本的用户需要是 root 用户，或具有使用 su 或 sudo 的能力。\n\n如果你运行的是受支持的 Linux 发行版，脚本将准备你的系统并安装\
  \ Docker。安装完成后，Docker 将由本地包管理系统更新，例如 Debian 和 Ubuntu 上的 `apt` 或 CentOS 和 **红帽企业\
  \ Linux (RHEL)** 上的 `yum`。`install` 命令会启动 Docker 并将其配置为随系统启动。\n\n受支持的操作系统、发行版和云提供商列表位于\
  \ https://docs.docker.com/engine/installation/。\n\n默认情况下，任何在本地使用 Docker 的人都需要 root\
  \ 权限。你可以通过将其添加到由安装包创建的 `docker` 组来更改这一点。他们将能够在下次登录后无需 root 即可使用 Docker。\n\n## 使用\
  \ Docker Machine 进行安装\n\nDocker 提供了一个非常实用的工具，用于便利地在各种云服务和 Linux 主机上部署和管理 Docker\
  \ 主机，该工具名为 **Docker Machine**。Docker Machine 作为 Docker Toolbox 的一部分安装，但也可以单独安装。完整说明可在\
  \ https://github.com/docker/machine/releases/ 中找到。\n\nDocker Machine 支持许多不同的云服务，包括\
  \ AWS、Microsoft Azure 和 GCE。它还可以配置为连接到任何现有的受支持 Linux 服务器。`docker-machine` 使用的驱动程序由\
  \ `--driver` 标志定义。每个驱动程序都有自己特定的标志，用于控制 `docker-machine` 与服务的交互方式。\n\n### 在 AWS 上启动主机\n\
  \nAWS 是运行 Docker 主机的绝佳方式，而 `docker-machine` 使启动和管理它们变得容易。你可以使用 **弹性负载均衡 (ELB)**\
  \ 将流量发送到特定主机上运行的容器，或在多个主机之间进行负载均衡。\n\n首先，你需要从 AWS 获取访问凭据。有几种使用方式。首先，你可以在运行 docker-machine\
  \ 时将其包含在命令行中：\n\n```\n$ docker-machine create --driver amazonec2 --amazonec2-access-key\
  \ AK*** --amazonec2-secret-key DM*** ...\n```\n\n其次，你可以将其添加到 ~/.aws/credentials。将凭据放在凭据文件中意味着你每次使用\
  \ docker-machine 处理 AWS 时都不需要在命令行中包含它们。它还可以使你的凭据不出现在命令行和进程列表中。以下示例将假设你已创建凭据文件，以避免命令行混乱：\n\
  \n```\n[default]\naws_access_key_id = AK***\naws_secret_access_key = DM***\n```\n\
  \n使用 create 子命令创建新的 Docker 主机。你可以使用 --amazonec2-region 标志指定区域。默认情况下，主机将在 us-east-1\
  \ 区域启动。命令行上的最后一项是实例名称，本例中为 dm-aws-test：\n\n```\n$ docker-machine create --driver\
  \ amazonec2 --amazonec2-region us-west-2 dm-aws-test\nCreating CA: /home/user/.docker/machine/certs/ca.pem\n\
  Creating client certificate:\n/home/user/.docker/machine/certs/cert.pem\nRunning\
  \ pre-create checks...\nCreating machine...\n(dm-aws-test) Launching instance...\n\
  Waiting for machine to be running, this may take a few minutes...\nDetecting operating\
  \ system of created instance...\nWaiting for SSH to be available...\nDetecting the\
  \ provisioner...\nProvisioning with ubuntu(systemd)...\nInstalling Docker...\nCopying\
  \ certs to the local machine directory...\nCopying certs to the remote machine...\n\
  Setting Docker configuration on the remote daemon...\nChecking connection to Docker...\n\
  Docker is up and running!\nTo see how to connect your Docker Client to the Docker\
  \ Engine running on\nthis virtual machine, run: docker-machine env dm-aws-test\n\
  ```\n\n![](img/02bead9c8ff4515f78dac0eb33163961_25_0.png)\n\n该命令运行需要几分钟，但完成后，你将拥有一个功能齐全的\
  \ Docker 主机，准备好运行容器。`ls` 子命令将显示 `docker-machine` 知道的所有主机：\n\n```\n$ docker-machine\
  \ ls\nNAME                ACTIVE   DRIVER       STATE     URL                  \
  \       SWARM\nDOCKER              ERRORS\ndm-aws-test         -        amazonec2\
  \    Running   tcp://52.43.71.87:2376\n                        v1.12.1\n```\n\n\
  主机的 IP 地址列在 `docker-machine ls` 的输出中，但你也可以通过运行 `docker-machine ip` 获取它。要开始使用新主机，请通过运行\
  \ `eval $(docker-machine env dm-aws-test)` 设置环境。现在当你运行 Docker 时，它将与运行在 AWS 上的实例通信。甚至可以使用\
  \ `docker-machine` 通过 `ssh` 登录到服务器：\n\n```\n$ docker-machine ssh dm-aws-test\nWelcome\
  \ to Ubuntu 15.10 (GNU/Linux 4.2.0-18-generic x86_64)\n\n * Documentation:  https://help.ubuntu.com/\n\
  \ Get cloud support with Ubuntu Advantage Cloud Guest:\n http://www.ubuntu.com/business/services/cloud\n\
  \nNew release '16.04.1 LTS' available.\nRun 'do-release-upgrade' to upgrade to it.\n\
  ```\n\n```\n*** System restart required ***\nubuntu@dm-aws-test:~$\n```\n\n使用完实例后，可以使用\
  \ docker-machine stop 停止它，并使用 docker-machine rm 删除它：\n\n```\n$ docker-machine stop\
  \ dm-aws-test\nStopping \"dm-aws-test\" ...\nMachine \"dm-aws-test\" was stopped.\n\
  ```\n\n```\n$ docker-machine rm dm-aws-test\nAbout to remove dm-aws-test\nAre you\
  \ sure? (y/n): y\nSuccessfully removed dm-aws-test\n```\n\n> 可以向 docker-machine\
  \ create 传递多个选项，包括用于使用自定义 AMI、实例类型或卷大小的选项。完整文档可在 https://docs.docker.com/machine/drivers/aws/\
  \ 中找到。\n\n### 在 GCE 上启动主机\n\nGCE 是云计算领域的另一大参与者。其 API 使在 Google 高性能基础架构上启动新主机变得非常容易。如果你已经在使用其他\
  \ Google Cloud 服务，Google 托管 Docker 主机是一个绝佳选择。\n\n你需要在 GCE 为容器创建一个项目。身份验证通过 Google\
  \ 应用程序默认凭据 (ADC) 进行。这意味着如果你在 GCE 主机上运行 docker-machine，身份验证将自动进行。如果你从自己的计算机运行 docker-machine，则需要使用\
  \ gcloud 工具进行身份验证。gcloud 工具需要 Python 2.7，可从以下网站下载：https://cloud.google.com/sdk/。\n\
  \n```\n$ gcloud auth login\n```\n\ngcloud 工具将打开一个网页浏览器以使用 OAuth 2 进行身份验证。选择你的帐户，然后在下一页点击\
  \ Allow。你将被重定向到显示已通过身份验证的页面。现在，进入有趣的部分：\n\n```\n$ docker-machine create --driver\
  \ google \\\n--google-project docker-test-141618 \\\n--google-machine-type f1-micro\
  \ \\\ndm-gce-test\n```\n\n![](img/02bead9c8ff4515f78dac0eb33163961_27_0.png)\n\n\
  完成所需时间取决于你选择的映像大小，可能需要几分钟。完成后，你将拥有一个在 GCE 上运行的 Docker 主机。现在，你可以像之前在 AWS 上一样使用 ls、ssh\
  \ 和 ip 子命令。完成后，运行 docker-machine stop 和 docker-machine rm 来停止和删除映像。\n\n> 可以向 docker-machine\
  \ 传递多个选项，包括用于设置区域、映像和机器时间的选项。完整文档可在 https://docs.docker.com/machine/drivers/gce/\
  \ 中找到。\n\n### 在 Microsoft Azure 上启动主机\n\nMicrosoft 是云服务领域相对较新的参与者，但他们构建了一项令人印象深刻的服务。Azure\
  \ 支撑着多个大型系统，包括 Xbox Live。\n\nAzure 使用订阅 ID 进行身份验证。你将获得一个访问代码，并被引导到 https://aka.ms/device/login\
  \ 输入它。选择 Continue，选择你的帐户，然后点击 Accept。完成后，可以关闭浏览器窗口：\n\n```\n$ docker-machine create\
  \ --driver azure --azure-subscription-id 30*** dm-azure-test\n```\n\n![](img/02bead9c8ff4515f78dac0eb33163961_28_0.png)\n\
  \n同样，完成需要一些时间。完成后，你将能够在新主机上运行容器。一如既往，你可以使用 docker-machine 管理新主机。在 Azure 上删除主机时，输出中有一条重要通知。值得确保一切都已清理干净：\n\
  \n```\n$ docker-machine rm dm-azure-test\nAbout to remove dm-azure-test\nAre you\
  \ sure? (y/n): y\n(dm-azure-test) NOTICE: Please check Azure portal/CLI to make\
  \ sure you have no\nleftover resources to avoid unexpected charges.\n(dm-azure-test)\
  \ Removing Virtual Machine resource. name=\"dm-azure-test\"\n(dm-azure-test) Removing\
  \ Network Interface resource. name=\"dm-azure-test-nic\"\n(dm-azure-test) Removing\
  \ Public IP resource. name=\"dm-azure-test-ip\"\n(dm-azure-test) Removing Network\
  \ Security Group resource.\n```\n\n\n```\nname=\"dm-azure-test-firewall\"\n(dm-azure-test)\
  \ Attempting to clean up Availability Set resource...\nname=\"docker-machine\"\n\
  (dm-azure-test) Removing Availability Set resource... name=\"docker-machine\"\n\
  (dm-azure-test) Attempting to clean up Subnet resource... name=\"docker-machine\"\
  \n(dm-azure-test) Removing Subnet resource... name=\"docker-machine\"\n(dm-azure-test)\
  \ Attempting to clean up Virtual Network resource...\nname=\"docker-machine-vnet\"\
  \n(dm-azure-test) Removing Virtual Network resource... name=\"docker-machine-vnet\"\
  \nSuccessfully removed dm-azure-test\n```\n\n> Azure 驱动程序有许多选项，包括用于选择镜像、VM 大小、位置，甚至主机上需要开放哪些端口的选项。有关完整文档，请参阅\
  \ https://docs.docker.com/machine/drivers/azure/。\n\n## 在运行 Linux 的主机上安装\n\n你也可以使用\
  \ docker-machine 的通用驱动程序在运行受支持 Linux 发行版的现有主机上安装和管理 Docker。需要牢记几点。首先，主机必须已经在运行。Docker\
  \ 可以预先安装。如果你正在将 Docker 安装作为主机构建过程的一部分，这很有用。其次，如果 Docker 正在运行，它将被重新启动。这意味着任何正在运行的容器都会被停止。第三，你需要已有\
  \ SSH 密钥对。\n\n以下命令将使用 SSH 通过 --generic-ssh-key 标识的密钥和使用 --generic-ssh-user 设置的用户，连接到由\
  \ --generic-ip-address 标志指定的服务器。对于 SSH 用户，有两点需要牢记。首先，用户必须能够在不提示密码的情况下使用 sudo。其次，公钥必须位于用户\
  \ $HOME/.ssh/ 目录中的 authorized_keys 文件中：\n\n```\n$ docker-machine create --driver\
  \ generic --generic-ip-address 52.40.113.7 --generic-ssh-key ~/.ssh/id_rsa --generic-ssh-user\
  \ ubuntu dm-ubuntu-test\n```\n\n此过程需要几分钟时间。它将比云服务上的创建更快，因为那些服务也需要预配置 VM。完成后，你可以使用\
  \ docker-machine 管理主机并开始运行容器。\n\n通用驱动程序与其他云驱动程序之间的唯一区别是 `stop` 子命令不起作用。这意味着停止通用\
  \ Docker 主机必须在主机上完成。\n\n完整文档可在此处找到：\nhttps://docs.docker.com/machine/drivers/generic/.\n\
  \n## 介绍 Docker 特定的发行版\n\n使用 Docker 运行服务的一大好处是服务器发行版不再重要。如果你的应用程序需要 CentOS 工具，它可以在基于\
  \ CentOS 的容器中运行。Ubuntu 也是如此。事实上，基于不同发行版的容器中的服务可以并排运行而不会出现问题。这促使人们推动非常精简的、Docker\
  \ 特定的发行版。\n\n这些发行版只有一个目的：运行 Docker 容器。因此，它们非常小巧，且开箱即用的功能非常有限。这对云端管理人员来说是巨大的好处。工具越少，更新越少，正常运行时间越长。这也意味着主机\
  \ OS 的攻击面要小得多，从而为你提供更大的安全性。\n\n他们对 Docker 的关注是一大优势，但也可能成为弱点。如果你需要主机上不可用的特定内容，可能会发现自己遇到了困难。积极的一面是，许多默认安装中可能不可用的工具可以从容器中运行。\n\
  \n### CoreOS\n\nCoreOS (https://coreos.com) 是最早的 Docker 特定发行版之一。此后，他们启动了名为 **rkt**\
  \ 的自有容器项目，但仍然包含 Docker。它在所有主要云提供商上都受支持，包括 Amazon EC2、Microsoft Azure 和 GCE，并可以在裸机或本地云环境中本地安装。\n\
  \nCoreOS 使用 Google 在其 Chromebook 上用于管理更新的同一系统。如果更新导致问题，可以轻松回滚到之前的版本。这可以帮助你维护稳定可靠的服务。\n\
  \nCoreOS 旨在自动更新系统，这一点非常独特。其理念是自动更新操作系统是维护基础设施安全性的最佳方式。默认情况下，此过程可以配置为确保 CoreOS 集群中同一时间只有一个主机在重新启动。它还可以配置为仅在维护窗口期间更新或完全关闭。在决定手动关闭之前，请记住，配置得当的编排系统即使在运行服务的主机正在重新启动时，也会保持服务运行。\n\
  \nCoreOS 包含 Docker 但未启用它。CoreOS 文档中的以下示例展示了如何在引导时启用 Docker。这是通过 cloud-init 创建新的\
  \ systemd 单元文件来完成的。在 AWS 上，此内容放置在用户数据实例配置中：\n\n```\n#cloud-config\n\ncoreos:\n \
  \ units:\n    - name: docker-tcp.socket\n      command: start\n      enable: true\n\
  \      content: |\n        [Unit]\n        Description=Docker Socket for the API\n\
  \n        [Socket]\n        ListenStream=2375\n        BindIPv6Only=both\n     \
  \   Service=docker.service\n\n        [Install]\n        WantedBy=sockets.target\n\
  ```\n\nCoreOS 使用默认 core 用户。可以通过 cloud-config 文件添加用户：\n\n```\n#cloud-config\nusers:\n\
  \  - name: \"demo\"\n    passwd: \"$6$HpqJOCs8XahT$mSgRYAn...\"\n    groups:\n \
  \   - \"sudo\"\n    - \"docker\"\n```\n\n还可以使用 `users` 块中的 `ssh-authorized-keys`\
  \ 选项添加 SSH 密钥。可以为每个用户添加任意数量的密钥：\n\n```\n#cloud-config\nusers:\n- default\n- name:\
  \ \"demo\"\n  ssh-authorized-keys:\n- \"ssh-rsa AAAAB3Nz...\"\n```\n\nCoreOS 还支持\
  \ `sssd` 用于针对 LDAP 和 **活动目录 (AD)** 进行身份验证。与 Docker 类似，它通过 `cloud-config` 启用：\n\n\
  ```\n#cloud-config\ncoreos:\nunits:\n- name: \"sssd.service\"\ncommand: \"start\"\
  \nenable: true\n```\n\n`sssd` 的配置位于 `/etc/sssd/sssd.conf`。与 CoreOS 的其他部分一样，配置可以添加到\
  \ `cloud-config`：\n\n```\n#cloud-config\nwrite_files:\n- path: \"/etc/sssd/sssd.conf\"\
  \npermissions: \"0644\"\nowner: \"root\"\ncontent: |\nconfig_file_version = 2\n\
  ...\n```\n\n> `sssd` 的完整配置超出了本书的范围。完整文档位于以下网站：\n> https://jhrozek.fedorapeople.org/sssd/1.13.1/man/sssd.conf.5.html\n\
  \n### RancherOS\n\nRancher (http://rancher.com) 是从头开始设计用于运行 Docker 容器的。它支持多种编排工具，包括\
  \ Kubernetes、Mesos 和 Docker Swarm。有可用于安装到硬件的 ISO 以及适用于 Amazon EC2、GCE 或 OpenStack\
  \ 的镜像。你甚至可以在 Raspberry Pi 上安装 RancherOS！\n\nRancherOS 非常独特；即使是系统工具也在 Docker 中运行。因此，管理员可以选择适合其习惯的控制台。支持的控制台包括\
  \ CentOS、Debian、Fedora、Ubuntu 或默认的基于 BusyBox 的控制台。\n\nRancher 提供了一个非常友好的 Web 界面来管理容器和集群。它还使运行多个环境（包括多种编排工具套件）变得容易。Rancher\
  \ 将在第 7 章“使用更简单的编排工具 – Fleet 和 Cattle”中详细介绍。\n\n`cloud-init` 软件包用于配置 RancherOS。你可以将其配置为在引导时启动容器、格式化持久磁盘或执行各种其他酷炫操作。它无法做的一件事是添加其他用户。其理念是，一旦\
  \ Docker 安装并配置完成，很少有理由登录到主机。但是，你可以向默认 rancher 用户添加 SSH 密钥，以允许不同用户进行唯一登录：\n\n```\n\
  #cloud-config\nssh_authorized_keys:\n- ssh-rsa AAAAB3Nz...\n```\n\n如果需要向 Docker\
  \ 添加选项，请使用 `cloud-init` 设置：\n\n```\n#cloud-config\nrancher:\ndocker:\nargs: [daemon,\
  \ ...]\n```\n\n### Project Atomic / RHEL Atomic\n\nProject Atomic (http://projectatomic.io)\
  \ 起源于 Fedora 项目，但现在支持 CentOS、Fedora 和 RHEL。适用于 Linux KVM 和基于 Xen 的虚拟化平台以及 Amazon\
  \ EC2 和裸机安装的镜像均可用。\n\n它使用 OSTree 和 `rpm-OSTree` 来提供原子更新。换句话说，每个包都会在同一时间、以一个整体进行更新。你不必担心某个包的更新失败会导致系统保留较旧的包。它还提供了在更新导致问题时轻松回滚的功能。\n\
  \nProject Atomic 预装了 Docker 和 Kubernetes。（Kubernetes 在第 5 章“使用 Kubernetes 部署和管理服务”中有详细介绍。）这使其成为基于\
  \ Kubernetes 的集群的理想基础。添加 SELinux 增加了额外的安全级别，以防正在运行的容器被攻破。\n\n\n\n\n\n使用 cloud-init，几乎可以在任何本地云系统或\
  \ EC2 上更轻松地进行部署。cloud-init 软件包可让你在引导时自动配置 Atomic 主机，从而即时扩展你的 Kubernetes 集群。\n\n\
  你可以使用 cloud-init 为默认用户设置密码并启用 SSH 登录：\n\n```\n#cloud-config\npassword: c001-pa$$word\n\
  ssh_pwauth: True\n```\n\n你还可以将 SSH 密钥添加到默认用户的 authorized_keys 文件中：\n\n```\n#cloud-config\n\
  ssh_authorized_keys:\n  - ssh-rsa AAAAB3Nz...\n  - ssh-rsa AAAAB3Nz...\n```\n\n\
  > 默认用户的名称取决于你使用的 Atomic 版本。对于 Fedora，用户名是 fedora，对于 CentOS 它是 centos，而对于 RHEL 它是\
  \ cloud-user。\n\n## 运行单容器应用程序\n\n在深入了解 Docker 编排的细节之前，让我们先快速了解在 Docker 中运行单个应用程序的基础知识。鉴于这是一本技术书籍，第一个示例总是\
  \ Hello World 的某个变体，本例也不例外。\n\n> 默认情况下，docker 必须以 root 用户身份运行或使用 sudo。或者，你可以将用户添加到\
  \ docker 组，从而在无需 root 权限的情况下运行容器。\n\n```\n$ docker run --rm ubuntu echo \"Hello\
  \ World\"\n```\n\n这个示例非常简单。它会下载 ubuntu Docker 镜像，并使用该镜像来运行 echo \"Hello World\"\
  \ 命令。简单，对吧？在深入编排之前，你实际上需要了解这里发生了很多事情。\n\n首先，请注意该命令中 `ubuntu` 这个词。它告诉 Docker 你想要使用\
  \ `ubuntu` 镜像。默认情况下，Docker 将从 Docker Hub 下载镜像。有大量的镜像，大部分由社区上传，但也有多个项目的官方镜像，其中 `ubuntu`\
  \ 就是其中之一。这些镜像几乎可以作为任何应用程序的基础。\n\n其次，请特别注意 `--rm` 标志。当 `docker` 运行时，它会为容器创建一个包含对基础镜像的任何更改的镜像。只要容器存在，这些更改就会保留，即使容器已停止。`--rm`\
  \ 标志告诉 `docker` 在容器停止运行后立即删除容器及其镜像。当你开始使用编排工具自动化容器时，通常会希望在容器停止时将其删除。我将在下一部分中详细说明。\n\
  \n最后，来看看 `echo` 命令。没错，它确实是一个 `echo` 命令，并且会输出 `Hello World`，这正如你所预期的。这里有两个重要点。首先，该命令可以是镜像中的任何内容，其次，它必须存在于镜像中。例如，如果你尝试在该命令中运行\
  \ `nginx`，Docker 会抛出类似于以下内容的错误：\n\n```\n$ sudo docker run --rm ubuntu nginx\nexec:\
  \ \"nginx\": executable file not found in $PATH\nError response from daemon: Cannot\
  \ start container\n821fcd4e8ae76668d8c508190b338e166247dc46cb6bc2582731566e7f2c705a:\
  \ [8]\nSystem error: exec: \"nginx\": executable file not found in $PATH\n```\n\n\
  “Hello World” 示例固然不错，但如果你想做一些真正有用的事情怎么办？引用旧 iPhone 广告的话；_“有相应的应用”_。Docker Hub 上有许多官方应用程序可用。让我们继续使用\
  \ `nginx` 并启动一个运行 `nginx` 的容器来提供一个简单的网站：\n\n```\n$ docker run --rm -p 80:80 --name\
  \ nginx nginx\n```\n\n此命令基于 `nginx` 镜像启动一个新容器，在需要时下载该镜像，并指示 `docker` 将 TCP 端口 80\
  \ 转发到镜像中的端口 80。现在你可以访问 `http://localhost` 并看到一个非常欢迎的网站：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_36_0.png)\n\
  \n欢迎人们使用 Nginx 固然不错，但显然，你会想做更多事情。这将在 *第 2 章：使用 Docker Compose 构建多容器应用程序* 中更详细地介绍。目前，默认设置就足够了。\n\
  \n如果你运行前面的示例，会发现控制台似乎挂起了。这是因为 `docker` 在前台启动进程。你看到的 `nginx` 正在等待请求。如果你访问 `http://localhost`，则应该看到\
  \ `nginx` 访问日志中的消息打印到控制台。另一个选择是向 `run` 命令添加 `-d`。这将使进程从控制台分离：\n\n```\n$ docker run\
  \ -d -p 80:80 --name nginx nginx\n```\n\n> `-d` 和 `--rm` 选项是互斥的。\n\n停止容器有多种方法。第一种方法是结束容器中运行的进程。对于短期运行的进程，这会自动发生。在启动前面示例中类似\
  \ `nginx` 的容器时，在会话中按下 `Ctrl + C` 将停止 `nginx` 和容器。另一种方法是使用 `docker stop`。它需要容器的镜像\
  \ ID 或名称。例如，要停止先前启动的容器，你可以运行 `docker stop nginx`。\n\n让我们花点时间来看看 Docker 如何处理远程镜像。请记住，当你第一次使用\
  \ `ubuntu` 或 `nginx` 镜像运行 `docker run` 时，`docker` 必须先从 Docker Hub 下载镜像。当你再次运行它们时，Docker\
  \ 将使用已下载的镜像。你可以使用 `docker images` 命令查看 Docker 知道的镜像：\n\n| 仓库 | 标签 | 镜像 ID | 创建时间\
  \ | 虚拟大小 |\n|---|---|---|---|---|\n| ubuntu | latest | ae81bbda2b6c | 5 小时前 | 126.6\
  \ MB |\n| nginx | latest | bfdd4ced794e | 3 天前 | 183.4 MB |\n\n可以使用 `docker rmi`\
  \ 命令删除不需要的镜像：\n\n```\n$ docker rmi ubuntu\n```\n\n哎呀！如果你删除了一个镜像但仍然需要它，该怎么办？你有两个选择。首先，你可以运行一个使用该镜像的容器。这可行，但如果运行容器会更改数据或与正在运行的某个内容冲突，则可能会比较麻烦。幸运的是，有\
  \ `docker pull` 命令：\n\n```\n$ docker pull ubuntu\n```\n\n此命令将从 Docker Hub 上的仓库拉取\
  \ `ubuntu` 镜像的默认版本。可以通过在命令中指定特定版本来拉取特定版本：\n\n```\n$ docker pull ubuntu:trusty\n\
  ```\n\n`docker pull` 也用于更新之前下载的镜像。例如，`ubuntu` 镜像会定期更新安全修复和其他补丁。如果你不拉取更新，主机上的 `docker`\
  \ 将继续使用旧镜像。只需再次运行 `docker pull` 命令，任何镜像更新都将被下载。\n\n让我们快速跑个偏，并考虑当你开始编排 Docker 时，这对你的主机意味着什么。除非你或你的工具更新主机上的镜像，否则你会发现一些主机在运行旧镜像，而另一些主机在运行崭新的镜像。这可能会使你的系统面临间歇性故障或安全漏洞。大多数现代工具会为你处理此问题，或者至少提供强制在部署前拉取的选项。其他工具可能不会，在查看编排工具和策略时请牢记这一点。\n\
  \n### 正在运行什么？\n\n到了某个时刻，你会想查看特定主机上正在运行哪些容器。你的编排工具会对此提供帮助，但有时你需要直接从源头入手来排查问题。为此，有\
  \ `docker ps` 命令。为了演示，启动几个容器：\n\n```\n$ for i in {1..4}; do docker run -d --name\
  \ nginx$i nginx ; done\n```\n\n现在运行 `docker ps`：\n\n```\n$ sudo docker ps\nCONTAINER\
  \ ID        IMAGE               COMMAND                  CREATED             STATUS\
  \                         PORTS               NAMES\ne5b302217aeb        nginx \
  \            \"nginx -g 'daemon off\"   About a minute ago   Up About a minute \
  \             80/tcp, 443/tcp     nginx4\ndc9d9e1e1228        nginx            \
  \ \"nginx -g 'daemon off\"   About a minute ago   Up About a minute            \
  \  80/tcp, 443/tcp     nginx3\n6009967479fc        nginx             \"nginx -g\
  \ 'daemon off\"   About a minute ago   Up About a minute              80/tcp, 443/tcp\
  \     nginx2\n67ac8125983c        nginx             \"nginx -g 'daemon off\"   About\
  \ a minute ago   Up About a minute              80/tcp, 443/tcp     nginx1\n```\n\
  \n你应该能看到刚刚启动的容器以及任何其他正在运行的容器。如果你停止容器，它们将从 `docker ps` 中消失：\n\n```\n$ for i in {1..4};\
  \ do docker stop nginx$i ; done\nnginx1\nnginx2\nnginx3\nnginx4\n```\n\n如你所见，如果你运行\
  \ `docker ps`，容器就不见了：\n\n```\n$ docker ps\nCONTAINER ID        IMAGE           \
  \    COMMAND             CREATED             STATUS              PORTS         \
  \      NAMES\n```\n\n但是，由于未使用 `--rm` 标志，`docker` 仍然知道它们并且可以重新启动它们：\n\n```\n$ docker\
  \ ps -a\nCONTAINER ID        IMAGE               COMMAND                  CREATED\
  \             STATUS                     PORTS               NAMES\ne5b302217aeb\
  \        nginx             \"nginx -g 'daemon off\"   3 minutes ago       Exited\
  \ (0) About a minute ago                        nginx4\ndc9d9e1e1228        nginx\
  \             \"nginx -g 'daemon off\"   3 minutes ago                         \
  \ nginx3\n```\n\n\nminutes ago       Exited (0) About a minute ago\nnginx3\n6009967479fc\
  \      nginx   \"nginx -g 'daemon off'\"   3\nminutes ago       Exited (0) About\
  \ a minute ago\nnginx2\n67ac8125983c      nginx   \"nginx -g 'daemon off'\"   3\n\
  minutes ago       Exited (0) About a minute ago\nnginx1\n\n这些都是已停止的 nginx 容器。`docker\
  \ rm` 命令将删除这些容器：\n\n```\n$ for i in {1..4}; do docker rm nginx$i ; done\nnginx1\n\
  nginx2\nnginx3\nnginx4\n```\n\nUntil a container is removed, all the data is still\
  \ available. You can restart the container and it will chug along quite happily\
  \ with whatever data existed when the container was stopped. Once the container\
  \ is removed, all the data within that container is removed right along with it.\
  \ In many cases, you might not care but, in others, that data might be important.\
  \ How you deal with that data will be an important part of planning out your orchestration\
  \ system. In Chapter 3, Cluster Building Blocks – Registry, Overlay Networks, and\
  \ Shared Storage, I will show you how you can move your data into shared storage\
  \ to keep it safe.\n\n移除容器之前，所有数据仍然可用。你可以重新启动容器，它会非常愉快地继续运行，使用容器停止时存在的任何数据。一旦容器被移除，容器内的所有数据也会随之删除。在许多情况下，你可能不在乎，但在其他情况下，这些数据可能很重要。你如何处理这些数据将是规划编排系统的重要部分。在第\
  \ 3 章“集群构建模块 – 注册表、覆盖网络和共享存储”中，我将向你展示如何将数据移入共享存储以保持其安全。\n\n## 检查你的容器\n\nThere comes\
  \ a time in the life of anyone working with containers when you will need to jump\
  \ into a running container and see what is going on. Fortunately, Docker has just\
  \ the tool for you in the form of docker exec. The exec subcommand takes two arguments,\
  \ the name of the container, and the command to run:\n\n在使用容器的任何人的职业生涯中，总会有一天你需要进入正在运行的容器查看发生了什么。幸运的是，Docker\
  \ 正好有你需要的工具，即 `docker exec`。exec 子命令接受两个参数：容器名称和要运行的命令：\n\n```\n$ docker exec -it\
  \ nginx bash\n```\n\nI slipped an option in there that is important if you are starting\
  \ an interactive process. The --it option tells Docker that you have an interactive\
  \ process and that you want a new TTY. This is essential if you want to start a\
  \ shell:\n\n我在那里加入了一个选项，如果你要启动交互式进程，这个选项很重要。`--it` 选项告诉 Docker 你有一个交互式进程，并且你想要一个新的\
  \ TTY。如果你想启动一个 shell，这是必不可少的：\n\n```\n$ sudo docker exec -it nginx bash\nroot@fd8533fa2eda:/#\
  \ ps ax\nPID TTY          STAT TIME COMMAND\n1 ?        Ss     0:00 nginx: master\
  \ process nginx -g daemon off;\n6 ? S 0:00 nginx: worker process\n13 ? Ss 0:00 bash\n\
  18 ? R+ 0:00 ps ax\nroot@fd8533fa2eda:/# exit\n```\n\nIn the preceding example,\
  \ I connected to the container and ran `ps ax` to see every process that the container\
  \ knew about. Getting a shell in the container can be invaluable when debugging.\
  \ You can verify that files were added correctly or that internal scripts are properly\
  \ handling environment variables passed in through `docker`.\n\n在前面的示例中，我连接到容器并运行了\
  \ `ps ax` 以查看容器所知的每个进程。在容器中获得 shell 在调试时非常有价值。你可以验证文件是否正确添加，或者内部脚本是否正在正确处理通过 `docker`\
  \ 传递的环境变量。\n\nIt's also possible to run non-interactive programs. Let's use the\
  \ same `ps` example as earlier:\n\n也可以运行非交互式程序。让我们使用与之前相同的 `ps` 示例：\n\n```\n$ sudo\
  \ docker exec nginx ps ax\nPID TTY STAT TIME COMMAND\n1 ? Ss 0:00 nginx: master\
  \ process nginx -g daemon off;\n6 ? S 0:00 nginx: worker process\n19 ? Rs 0:00 ps\
  \ ax\n```\n\nAs you might expect, there's not much to see here, but it should give\
  \ you an idea of what is possible. I often use them when debugging and I do not\
  \ need a full shell.\n\n如你所料，这里没什么可看的，但它应该能让你了解可能的情况。我在调试时经常使用它们，而不需要一个完整的 shell。\n\
  \n## Summary\n\nIn this chapter you have learned the basics of using Docker. You\
  \ saw how to quickly install Docker on AWS, GCE, Azure, and a generic Linux host.\
  \ You were introduced to a few Docker-specific distributions and saw a little bit\
  \ of how to configure them. Finally, we reviewed the basics of using the `docker`\
  \ command. In the next chapter, I will walk you through using Docker Compose to\
  \ build new single and multi-container applications.\n\n## 总结\n\n在本章中，你学习了使用 Docker\
  \ 的基础知识。你了解了如何在 AWS、GCE、Azure 和通用 Linux 主机上快速安装 Docker。你被介绍了几个 Docker 特定的发行版，并了解了一点如何配置它们。最后，我们回顾了使用\
  \ `docker` 命令的基础知识。在下一章中，我将指导你使用 Docker Compose 构建新的单容器和多容器应用程序。\n\n# Building Multi-Container\
  \ Applications with Docker Compose\n\nModern applications have a lot of moving parts.\
  \ A web application almost always uses a database such as MySQL or MongoDB to store\
  \ data. There may be a load balancer or SSL proxy. Often there are tasks scheduled\
  \ to run regularly that perform routine maintenance or backups. On a traditional\
  \ server, these tasks might all be installed on a single server or spread across\
  \ numerous hosts. The challenge faced by system administrators is how are all these\
  \ parts deployed consistently and reliably?\n"
- "# 使用 Docker Compose 构建多容器应用程序\n\n现代应用程序有很多活动部件。Web 应用程序几乎总是使用 MySQL 或 MongoDB 等数据库来存储数据。可能有负载均衡器或\
  \ SSL 代理。通常会有定期运行的任务来执行例行维护或备份。在传统服务器上，这些任务可能全部安装在一台服务器上，或分布在许多主机上。系统管理员面临的挑战是如何以一致且可靠的方式部署所有这些部件？\n\
  \nRather than having a single container that does everything, you can split your\
  \ application into smaller chunks. Each container has a specific task and does only\
  \ that task. For example, you might have one image that is a Perl-based web application;\
  \ a second that runs MySQL; a third that runs HAProxy to load balance and provide\
  \ SSL termination for the Perl application. Each separate container can be run,\
  \ upgraded, and tested independent of each other. Your developers can work on the\
  \ web code all they want, and you do not have to worry about what they might do\
  \ to your database install.\n\n与其有一个什么都做的单个容器，不如将你的应用程序拆分成更小的块。每个容器都有一个特定任务并且只执行该任务。例如，你可能有一个是基于\
  \ Perl 的 Web 应用程序的镜像；第二个运行 MySQL；第三个运行 HAProxy 来为 Perl 应用程序提供负载均衡和 SSL 终止。每个独立容器可以相互独立地运行、升级和测试。你的开发人员可以随心所欲地处理\
  \ Web 代码，而你不必担心他们可能对你的数据库安装做什么。\n\nThis chapter will show you how that is done.\
  \ The process starts with a single image, defined by a `Dockerfile`. It then proceeds\
  \ to build a small multi-container application using both custom images and images\
  \ from the Docker Hub. Along the way, you will see how to use Docker Compose to\
  \ define your application; how networks can be used to isolate your data; and how\
  \ volumes can keep your data safe.\n\n本章将向你展示如何做到这一点。该过程从一个由 `Dockerfile` 定义的单个镜像开始。然后继续使用自定义镜像和来自\
  \ Docker Hub 的镜像构建一个小型多容器应用程序。在此过程中，你将了解如何使用 Docker Compose 定义你的应用程序；如何使用网络隔离你的数据；以及如何使用卷保持数据安全。\n\
  \nThe following topics will be covered in this chapter:\n\n本章将涵盖以下主题：\n\n- Building\
  \ an image from a `Dockerfile` with Docker Engine\n- Installing Docker Compose\n\
  - Using Docker Compose to build single and multi-container applications\n- Using\
  \ environment files to change how your application runs\n- Extending Docker Compose\
  \ files\n- Controlling the container start order\n- Using named networks for data\
  \ isolation\n- Using volumes for data persistence\n\n- 使用 Docker Engine 从 `Dockerfile`\
  \ 构建镜像\n- 安装 Docker Compose\n- 使用 Docker Compose 构建单容器和多容器应用程序\n- 使用环境文件更改应用程序的运行方式\n\
  - 扩展 Docker Compose 文件\n- 控制容器启动顺序\n- 使用命名网络进行数据隔离\n- 使用卷实现数据持久化\n\n## Building\
  \ an image with Docker Engine\n\nThey say the longest journey begins with a single\
  \ step. In this case, an application begins with a single image. More often than\
  \ not, existing images will not be perfect fits. This will certainly be the case\
  \ if you are deploying your own services.\n\n## 使用 Docker Engine 构建镜像\n\n话说最长的旅程始于第一步。在此情况下，应用程序始于一个单一镜像。更多时候，现有镜像并不完全合适。如果你在部署自己的服务，情况肯定就是这样。\n\
  \nIt all starts with a `Dockerfile`. This file provides detailed instructions to\
  \ Docker for building an image. There are a lot of things that can be done in a\
  \ `Dockerfile`. Specific operating system packages or language libraries can be\
  \ installed; configuration files can be put into place; and a default command can\
  \ be set. It is best to base a new image for an application off an official image,\
  \ when possible. For example, an application written in Ruby should be based off\
  \ of the official `ruby` image. A full reference of the `Dockerfile` directives\
  \ can be found at https://docs.docker.com/engine/reference/builder/.\n\n一切都始于 `Dockerfile`。此文件为构建镜像向\
  \ Docker 提供详细指令。在 `Dockerfile` 中可以完成很多事情：可以安装特定的操作系统软件包或语言库；可以放置配置文件；还可以设置默认命令。尽可能在可能时，基于官方镜像为应用程序构建新镜像是最佳选择。例如，用\
  \ Ruby 编写的应用程序应基于官方 `ruby` 镜像。`Dockerfile` 指令的完整参考可在 https://docs.docker.com/engine/reference/builder/\
  \ 找到。\n\n## Building from a Dockerfile\n\nBack in Chapter 1, Getting Started with\
  \ Docker Orchestration, we started with a container that ran Nginx and displayed\
  \ the default welcome page. This time, let us add a custom website to the container.\
  \ Start by creating an empty directory somewhere. In that directory, download the\
  \ examples from the GitLab repository for this book:\n\n## 从 Dockerfile 构建\n\n回到第\
  \ 1 章“开始使用 Docker 编排”，我们使用了一个运行 Nginx 并显示默认欢迎页面的容器。这次，让我们向容器添加一个自定义网站。首先在某处创建一个空目录。在该目录中，下载本书的\
  \ GitLab 仓库中的示例：\n\n```\n$ git clone https://gitlab.com/perlstalker/docker-orchestration-examples\n\
  $ cd docker-orchestration-examples/ch02\n```\n\nThen, create a file named `Dockerfile`\
  \ with the following content:\n\n然后，创建一个名为 `Dockerfile` 的文件，内容如下：\n\n```\nFROM nginx:1.10\n\
  COPY sample-website /usr/share/nginx/html\n```\n\nThis is a simple file but there\
  \ are two important pieces here. First is the FROM command, which tells Docker that\
  \ your container extends the nginx image that was used before. Basing your custom\
  \ images on the existing images can save a lot of time and hassle. They may not\
  \ be perfect out of the box but often it only takes a few changes to get what you\
  \ need.\n\n这是一个简单的文件，但这里有两个重要部分。第一个是 FROM 命令，它告诉 Docker 你的容器扩展了之前使用的 nginx 镜像。将自定义镜像基于现有镜像可以节省大量时间和麻烦。它们开箱即用可能并不完美，但通常只需做一些更改就能得到你需要的东西。\n\
  \nSecond, there is the ADD command. The nginx container uses /usr/share/nginx/html\
  \ within the container as the document root. The ADD command places the content\
  \ of the website directory in /usr/share/nginx/html when the container is built.\n\
  \n第二个是 ADD 命令。nginx 容器在容器内使用 /usr/share/nginx/html 作为文档根目录。ADD 命令在构建容器时将网站目录的内容放入\
  \ /usr/share/nginx/html。\n\nThe ADD command can add single files, directories, or\
  \ tarballs. The TAR files will be unpacked in the directory that you specify. The\
  \ TAR file can be compressed with gzip, bzip2, or xz. The ADD command can also take\
  \ a URL. The file pointed to by ADD will be downloaded and placed in the given directory\
  \ in your image. A tarball added via URL will not be unpacked.\n\nADD 命令可以添加单个文件、目录或\
  \ tarball。TAR 文件将在你指定的目录中解包。TAR 文件可以用 gzip、bzip2 或 xz 压缩。ADD 命令还可以接受 URL。ADD 指向的文件将被下载并放置在镜像中的给定目录。通过\
  \ URL 添加的 tarball 不会被解包。\n\nIn addition to the ADD command, there is a command called\
  \ COPY. It simply adds the given files or directories with any of the automated\
  \ unpacking that ADD does. The COPY command is preferred when adding simple files\
  \ or directories to an image.\n\n除了 ADD 命令，还有一个名为 COPY 的命令。它只是添加给定的文件或目录，而不执行 ADD\
  \ 所做的任何自动解包。当将简单文件或目录添加到镜像时，COPY 命令更受推荐。\n\nNow, it is time to build the container.\
  \ Change to the directory with your Dockerfile and website directory and run docker\
  \ build. When the build completes, you will have an image named website ready to\
  \ use with docker run:\n\n现在是构建容器的时候了。切换到包含 Dockerfile 和网站目录的目录，然后运行 docker build。构建完成后，你将拥有一个名为\
  \ website 的镜像，可以与 docker run 一起使用：\n\n```\n$ docker build -t website .\n```\n\n\
  ## Tagging the image\n\n## 为镜像打标签\n\nThe -t flag allows you to give your image a\
  \ name. The name may include a : followed by a tag. The most common way of using\
  \ this is as a version number. It might also be a date, Git tag, or something else\
  \ that makes sense in your environment. For example, the official ubuntu image has\
  \ tags for releases such as ubuntu:trusty or ubuntu:xenial, which refer to the appropriate\
  \ Ubuntu release:\n\n-t 标志允许你为镜像命名。名称可以包含一个跟随标签的 :。最常见的用法是作为版本号。它也可能是日期、Git 标签或你环境中有意义的其他东西。例如，官方\
  \ ubuntu 镜像有针对发行版（如 ubuntu:trusty 或 ubuntu:xenial）的标签，它们引用适当的 Ubuntu 发行版：\n\n```\n\
  $ docker build -t website:0.1 .\n```\n\nImage versioning will be important going\
  \ forward. At some point, you will be deploying an updated version of your service.\
  \ It is possible to reuse a name and version, which may be fine while you develop\
  \ the application, but different versions will make it easy to roll back to a previous,\
  \ known good image in the event of a failure. It also allows you or your QA team\
  \ to test an image without overwriting the image your production services are started\
  \ from.\n\n镜像版本控制在今后将非常重要。在某个时候，你将部署服务的更新版本。可以重复使用名称和版本，在开发应用程序时这可能没问题，但不同版本将使在发生故障时轻松回滚到之前已知良好的镜像。它还允许你或你的\
  \ QA 团队测试镜像，而不会覆盖生产服务启动所用的镜像。\n\n\n\n\n构建镜像后，还可以为其添加其他标签。你可以把这看作是一个别名。镜像标签是识别特定状态镜像的好方法。例如，在构建网站后，你可以为其打上标签以显示它已准备好进行测试，使用\
  \ `docker tag website:testing website:0.1`。测试后，镜像可以被标记为 `website:latest` 或 `website:production`，以表明该镜像已准备好投入生产。随着每个新镜像通过开发流程，重复此过程。保持一致的镜像名称将使开发人员更容易知道下载哪个镜像。使用版本号将使更容易看到正在使用哪个版本的镜像。它还允许在新版本出现问题时轻松回滚应用程序。\n\
  \n### 跳过构建缓存\n\n另一个有用的标志是 `--no-cache`。通常，Docker 会尽可能重复使用现有镜像。这会加快构建过程，但可能会导致构建出现问题。当向镜像添加软件包时，这是一个常见的示例。以这个小型\
  \ `Dockerfile` 为例。它基于最新的 Ubuntu 镜像。它只是更新 `apt` 并安装 `nginx`：\n\n```\nFROM ubuntu:16.04\n\
  RUN apt-get update\nRUN apt-get -y install nginx && apt-get clean\n```\n\n由于 Docker\
  \ 会缓存每个步骤，后续构建不会再运行 `apt-get update`。然后 APT 会尝试基于缓存中的内容安装 `nginx`。镜像想要安装的版本可能不再存在于镜像站中，导致安装失败。当你更改要安装的软件包列表时，这种情况最常发生。`apt-get\
  \ install` 命令会被重新运行，但 `apt-get update` 不会。在这种情况下，添加 `--no-cache` 将强制 Docker 重新运行每个步骤，而不是使用缓存。\n\
  \n我还要指出的另一个标志是 `--pull` 标志。它告诉 Docker 下载所使用的任何镜像的较新版本。如果你想确保拥有应用了所有安全补丁的最新版本，这一点很重要。然而，这可能意味着更新的库，这可能会给你的应用程序带来问题。好消息是，通过版本化构建，你不会破坏生产环境中运行的任何内容：\n\
  \n```\n$ docker build --no-cache --pull -t website:0.1 .\n```\n\n## 运行镜像\n\n构建镜像后，你可以使用以下命令运行镜像来启动容器：\n\
  \n```\n$ docker run --rm -p 80:80 website:0.1\n```\n\n这应该非常熟悉。这一次，Docker 不是运行 nginx\
  \ 镜像，而是运行你新构建的镜像，其中包含示例网站。启动后，你可以在网页浏览器中打开该网站。如果容器在你的桌面上运行，请访问 http://localhost/\
  \ 查看新网站：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_45_0.png)\n\n## 安装 Docker Compose\n\
  \n构建镜像后，你需要告诉 Docker 如何运行它们。Docker Engine 在定义容器如何协同工作方面存在局限性。Docker 项目提供了一个名为 Docker\
  \ Compose 的解决方案。Docker Compose 是一个出色的工具，可用于测试部署、定义容器如何交互或需要什么外部存储，甚至可作为轻量级编排工具。\n\
  \n安装 Docker Compose 很容易。对于 Windows 和 OS X 用户，docker-compose 作为 Docker Toolbox 和\
  \ Docker for Mac and Windows 的一部分进行安装。对于 Linux 用户，docker-compose 可以从 GitHub 上的 Docker\
  \ 仓库下载。Docker Compose 文档中的以下命令向你展示了如何操作：\n\n```\n### curl -L\nhttps://github.com/docker/compose/releases/download/1.8.0\
  \  /docker-compose-\n`uname -s`-`uname -m`  > /usr/local/bin/docker-compose\nchmod\
  \ +x /usr/local/bin/docker-compose\n```\n\n- 如所示，curl 命令必须以 root 权限运行，才有权将文件写入 /usr/local/bin。\n\
  - 编写本文档以来，版本号几乎肯定已经更改。请相应更新命令。最新版本可在 https://github.com/docker/compose/releases/\
  \ 找到。\n\n## 编写 Docker Compose 文件\n\nDocker Compose 文件定义了应用程序的所有内容。服务、卷、网络和依赖项都可以在同一个位置定义。该配置可以在本地用于启动开发环境，插入到现有的持续集成或持续部署系统中，甚至可以在服务器上用于启动生产服务。后续章节将展示更好的方法来管理运行中的服务。\n\
  \nDocker Compose 在当前目录中查找名为 `docker-compose.yml` 的文件。可以使用 `-f` 选项指定备用文件。该文件采用 YAML\
  \ 格式，因此可以在任何文本编辑器中编辑。\n\n让我们从一个非常简单的 compose 文件开始，该文件启动一个监听 80 端口的单个 nginx 容器。这相当于使用\
  \ `docker run -p 80:80 nginx` 启动的容器。`image` 的值可以是服务器或注册表上的任何镜像，就像 `docker run` 命令中一样：\n\
  \n```\nversion: '2'\nservices:\n  web:\n    image: nginx\n    ports:\n      - \"\
  80:80\"\n```\n\n在 Docker Compose 文件中定义的应用程序使用 `docker-compose up` 命令启动。与 `docker\
  \ run` 类似，你可以使用 `docker-compose` 的 `-d` 选项在后台启动应用程序：\n\n```\n$ docker-compose up\
  \ -d\nStarting singleservice_web_1\n```\n\n应用程序已启动并在后台运行。如果在网页浏览器中打开 http://localhost，你将看到\
  \ Nginx 欢迎页面。你可以使用 `docker ps` 查看正在运行的容器，但 `docker-compose ps` 提供了更友好的视图：\n\n| 名称\
  \ | 命令 | 状态 | 端口 |\n|---|---|---|---|\n| singleservice_web_1 | nginx -g daemon off;\
  \ Up 443/tcp, | 0.0.0.0:80->80/tcp | |\n\n`singleservice` 前缀是应用程序的命名空间。默认情况下，它基于包含\
  \ `docker-compose.yml` 文件的目录名称。在你的系统上可能不同。可以通过向 `docker-compose` 传递 `-p` 标志来指定命名空间：\n\
  \n```\n$ docker-compose -p mynamespace up\n```\n\n完成后，可以通过运行 `docker-compose stop`\
  \ 停止应用程序。要停止并删除 `docker-compose` 为当前上下文创建的所有资源，请使用 `docker-compose down`。在 `docker-compose.yml`\
  \ 中创建的任何卷都不会被删除：\n\n```\n$ docker-compose down\nStopping singleservice_web_1 ...\
  \ done\nRemoving singleservice_web_1 ... done\nRemoving network singleservice_default\n\
  ```\n\n查看应用程序中容器的输出通常很有用。可以使用 `docker-compose logs` 命令完成此操作。添加 `-f` 标志将导致 `docker-compose`\
  \ `follow` 日志并在消息出现时打印它们。\n\n## 多容器应用程序\n\n前一部分的示例很有趣，但与直接使用 docker 命令相比并没有真正给我们带来什么好处。大多数\
  \ Internet 应用程序都由多个部分组成。最常见的示例是从数据库加载数据的 Web 应用程序。\n\n在 docker-orchestration-examples\
  \ 仓库的 ch02/web-db 中，有一个非常简单的应用程序，它从 MySQL 加载作者和书籍列表，并在网页上显示它们。以下是定义该应用程序的 docker-compose.yml：\n\
  \n```\nversion: '2'\n\nservices:\n    web:\n        image: web-db:0.1\n        build:\
  \ .\n        ports:\n            - 80:5000\n        env_file:\n            - db.env\n\
  \        entrypoint: ./start.pl --init --command shotgun\n    db:\n        image:\
  \ mysql:5.7\n        env_file:\n            - db.env\n```\n\n首先要注意的是，这里定义了两个服务。第一个是\
  \ web，即 Web 应用程序。第二个是 db，即 MySQL 容器。让我们逐一查看它们。\n\n`build` 键告诉 docker-compose，该服务将从与\
  \ `docker-compose.yml` 相同的目录中的 Dockerfile 构建。这里可以定义子目录，例如 `build: ./myapp`。如果你需要构建多个自定义镜像来支持应用程序，这很常见。\n\
  \n要构建的镜像名称由 `image` 键设置。这与你传递给 `docker build` 的 `-t` 标志是同一回事。镜像构建完成后，你会在 `docker\
  \ images` 中看到该名称。你可以使用 `docker run` 单独运行容器，或将其推送到注册表。\n\n> docker-compose.yml 规范的旧版本不允许在同一服务中同时使用\
  \ `build` 和 `image`。\n\n\n\n\n\n`ports` 键与 `docker run` 的 `-p` 标志相同。在此示例中，docker-compose\
  \ 会将主机端口 80 转发到容器中的端口 5000。`ports` 键接受一个列表，因此如果需要，您可以指定多个端口进行转发。以下示例将主机上的端口 80 和\
  \ 443 分别转发到容器中的端口 5000 和 5001：\n\n```\nports:\n  - 80:5000\n  - 443:5001\n```\n\n\
  让我们先跳过 `env_file` 键，转而介绍 `entrypoint` 键。`entrypoint` 键允许您覆盖镜像 Dockerfile 中定义的 entrypoint。这与在\
  \ `docker run` 中使用 `--entrypoint` 相同。我将在本章后面解释您可能希望设置它的原因。\n\n`db` 服务启动 MySQL。与\
  \ `web` 服务类似，`image` 选项定义要使用的镜像。不过在此示例中，docker-compose 不会从 Dockerfile 构建镜像，而是会从\
  \ Docker Hub 下载官方 `mysql` 镜像。\n\n敏锐的读者可能会注意到 `db` 服务的另一点。没有设置端口。同一 docker-compose\
  \ 命名空间中的服务可以连接到其他容器在其 Dockerfile 中使用 EXPOSE 命令定义的端口。无需将端口提供给其他人或容器。更好的是，docker-compose\
  \ 为集群中的每个容器提供名称解析，以便它们可以相互查找。在此示例中，Web 应用程序可以使用服务名称 `db` 连接到 MySQL。网络将在本章稍后详细讨论。\n\
  \n## 使用环境文件\n\n现在让我们来看看那个神秘的 `env_file` 选项。`env_file` 选项允许您提供一个或多个环境文件。这些文件设置环境变量，并在服务启动时将其传递给服务。这与使用\
  \ `docker run` 的 `-e` 标志设置环境变量相同。同一文件可以传递给 `docker run` 的 `--env-file` 选项。`mysql`\
  \ 镜像使用环境变量来配置要创建的数据库名称（如果不存在）、root 密码、应用程序用户名和密码以及许多其他内容。这个特定的 `env_file` 包含 MySQL\
  \ 用户信息：\n\n```\nMYSQL_DATABASE=db\nMYSQL_USER=myapp\nMYSQL_PASSWORD=password\nMYSQL_ROOT_PASSWORD=root-password\n\
  ```\n\n将这些信息放在 `env_file` 中，可以让您将相同的变量传递给 Web 应用程序。Web 服务 entrypoint 中定义的 `./start.pl`\
  \ 脚本读取这些环境变量，并为应用程序写入配置文件。\n\n将这些信息放在环境变量中，而不是放在 Web 镜像本身中，可以在密码更改时更轻松地更新正在运行的服务。您只需更新环境文件并重新启动使用它的任何容器即可。与更新镜像配置、重新构建，然后将镜像重新部署到集群中的所有\
  \ Docker 主机相比，这将节省大量时间。\n\n环境文件的另一个主要用例是为开发和生产环境提供不同的设置。例如，在像前面那样的应用程序中，您可以有一个定义开发数据库帐户凭据的文件，还有一个用于生产环境的文件。\n\
  \n还有一点需要注意的是，`env_file` 接受一个列表。您可以指定所需的任意数量的不同文件。例如，您可能有一组常见的环境变量，以及另一组特定于此应用程序的变量。在此情况下，您的\
  \ `env_file` 可能类似于以下示例。后续文件中的变量会覆盖早期文件中设置的变量：\n\n```\nenv_file:\n  - common.env\n\
  \  - myapp.env\n```\n\n## 扩展 Compose 文件\n\n我们已经讨论过使用环境文件来更改应用程序的行为。另一种方法是使用多个 Docker\
  \ Compose 文件。每个文件都基于前一个文件，扩展它并可能覆盖选项。这可以在开发应用程序或将其调整以适应不同环境时为您提供极大的灵活性。这可以通过以下两种方式之一完成：\n\
  \n- 第一种方法是将覆盖项放在名为 docker-compose.override.yml 的文件中。此文件由 docker-compose 自动读取。`docker-compose.yml`\
  \ 中的选项首先应用，然后应用 `docker-compose.override.yml` 中的选项。\n\n- 第二种方法是使用 `docker-compose`\
  \ 的 `-f` 标志。您可以包含任意数量的 Compose 文件。它们将按从左到右的顺序应用。例如，在命令 `docker-compose -f docker-compose.yml\
  \ -f docker-compose-prod.yml` 中，首先读取 `docker-compose.yml`，然后读取 `docker-compose-prod.yml`。\n\
  \n让我们回到示例 Web 应用程序。默认的 `docker-compose.yml` 为 `web` 服务定义了一个 `entrypoint`，它使用 Plack\
  \ 的 Shotgun 加载器。这是一个调试的绝佳工具，但速度很慢，因为它在每次页面加载时都会重新编译应用程序。要将其投入生产，需要性能更好的东西。因此，让我们使用预fork加载器\
  \ Starman。\n\n以下是 `docker-compose.yml` 文件的相关部分：\n\n```\nservices:\n  web:\n    image:\
  \ web-db\n    build: .\n    ports:\n      - 80:5000\n    env_file:\n      - db.env\n\
  \    entrypoint: ./start.pl --init --command shotgun\n```\n\n现在创建一个名为 `docker-compose-prod.yml`\
  \ 的文件来覆盖 `entrypoint`：\n\n```\nversion: '2'\n\nservices:\n  web:\n    entrypoint:\
  \ ./start.pl --init --command starman\n```\n\n使用 `docker-compose` 启动应用程序：\n\n```\n\
  $ docker-compose -f docker-compose.yml -f docker-compose-prod.yml up\n```\n\n启动时，您应该在日志中看到此消息：\n\
  \n```\nweb_1 | Command: starman\nweb_1 | Waiting 60 seconds for mysql\nweb_1 | Initializing\
  \ database\nweb_1 | Starting the app\nweb_1 | 2016/09/08-13:11:35 Starman::Server\
  \ (type Net::Server::PreFork)\nstarting! pid(1)\nweb_1 | Resolved [*]:5000 to [0.0.0.0]:5000,\
  \ IPv4\nweb_1 | Binding to TCP port 5000 on host 0.0.0.0 with IPv4\nweb_1 | Setting\
  \ gid to \"0 0\"\n```\n\n如果停止应用程序并在不使用 `docker-compose-prod.yml` 文件的情况下再次运行它，您应该看到它重新使用\
  \ Shotgun：\n\n```\nweb_1 | Command: shotgun\nweb_1 | Waiting 60 seconds for mysql\n\
  web_1 | Initializing database\nweb_1 | Starting the app\nweb_1 | HTTP::Server::PSGI:\
  \ Accepting connections at http://0.0.0.0:5000/\n```\n\n使用多个 Compose 文件非常有用，但也可能有点令人困惑。您可能会发现自己处于这样的境地：正在调试应用程序配置，并自问，“docker-compose\
  \ 为什么使用那个选项？”在这种情况下，运行 `docker-compose config` 可能会有所帮助，以查看合并后的配置：\n\n```\n$ docker-compose\
  \ -f docker-compose.yml -f docker-compose-prod.yml config\nnetworks: {}\nservices:\n\
  \  db:\n    environment:\n      MYSQL_DATABASE: db\n      MYSQL_PASSWORD: password\n\
  \      MYSQL_ROOT_PASSWORD: root-password\n      MYSQL_USER: myapp\n    image: mysql\n\
  \  web:\n    build:\n      context: /home/user/examples/ch02/web-db\n      entrypoint:\
  \ ./start.pl --init --command starman\n      environment:\n        MYSQL_DATABASE:\
  \ db\n        MYSQL_PASSWORD: password\n        MYSQL_ROOT_PASSWORD: root-password\n\
  \        MYSQL_USER: myapp\n    image: web-db\n    ports:\n      - 80:5000\nversion:\
  \ '2.0'\nvolumes: {}\n```\n\n由此，您可以看到 docker-compose 确实采用了我们对 entrypoint 的覆盖。您还可以看到通过\
  \ env_files 选项添加的所有环境变量。如果您看到一个看起来不正确的选项，可以开始在 Compose 文件中查找该特定选项。最可能是顺序问题。\n\n\
  ## 控制启动顺序\n\n与几乎所有使用数据库的应用程序一样，如果前面的示例应用程序无法连接到数据库，它将无法工作。要实现这一点，数据库需要先启动。Docker\
  \ Compose 提供了一个名为 `depends_on` 的选项来帮助实现这一点：\n\n```\nversion: '2'\nservices:\n  web:\n\
  \    image: web-db\n    build: .\n    depends_on:\n      - db\n  db:\n    image:\
  \ mysql\n    ...\n```\n\n在前面的示例中，`docker-compose` 会先启动 `db` 服务，然后启动 `web` 服务。如果您尝试使用\
  \ `docker-compose up web` 单独启动 `web` 服务，它也会启动 `db` 服务。您可以定义服务所需的任意数量的其他依赖项。\n\n\
  这里有一点需要注意。Docker Compose 会先启动所需的服务，但在启动依赖于它的服务之前，不会等待它准备好接受连接。在此示例中，`docker-compose`\
  \ 会启动 `db`，然后立即启动 `web`。不幸的是，MySQL 需要一点时间才能启动。如果 Web 应用程序立即尝试连接，MySQL 可能尚未准备好，您的应用程序可能无法启动。\n\
  \n处理此问题的方法有几种。第一种，也是通常最好的选择是让您的应用程序不断尝试连接。最终，数据库将准备就绪，您的应用程序就可以正常运作了。我喜欢这种选择的原因是，故障经常发生。在大型\
  \ Docker 环境中，故障通常是一种特性。容器设计为快速启动，并且在部署新版本服务时通常会被快速替换。自愈服务意味着管理集群的团队会更少头疼。\n\n另一种选择是在应用程序的启动命令周围使用一个包装器。包装器可以反复轮询数据库，当它发现数据库准备就绪时，启动您的应用程序。示例应用程序中的\
  \ `start.pl` 脚本采用了更简单的方法，它只是休眠 60 秒，给数据库留出启动时间。\n\n> Docker 文档指向两个名为 `wait-for-it`\
  \ 和 `dockerize` 的工具。任一工具都可以用于在另一服务准备就绪之前延迟应用程序的启动。它们分别可在 https://github.com/vishnubob/wait-for-it\
  \ 和 https://github.com/jwilder/dockerize 上找到。\n\n\n\n\n\n## 使用 Docker 网络\n\nDocker\
  \ 支持虚拟网络的概念。Docker Compose 使用它们来提供应用程序之间的网络隔离。默认情况下，使用 Docker Compose 启动的每个应用程序都有自己的虚拟网络，其名称以应用程序的命名空间命名。这意味着，如果您使用\
  \ docker-compose 启动两个不同的应用程序，它们将无法相互访问。\n\n在应用程序的命名空间内，docker-compose 创建的网络提供 DNS\
  \ 服务发现。在示例多容器应用程序中，为 web 和 db 服务分别创建了名为 web 和 db 的 DNS 条目。在 web 应用程序的配置中（MyApp/config.yml.in），数据库连接配置为连接到名为\
  \ db 的主机。Docker 通过确保 db 主机名指向 db 服务来完成其余工作。\n\n![](img/02bead9c8ff4515f78dac0eb33163961_54_0.png)\n\
  \n当服务重新启动时，它将获得新的 IP 地址，但保留相同的主机名。请确保您的应用程序可以处理这种情况。\n\n最初，Docker 中的网络功能非常有限。最新版本创建了一个可插拔的网络堆栈，可以根据需要简单或复杂。Docker\
  \ Compose 允许您使用 networks 选项进行配置：\n\n```\nversion: '2'\n\nservices:\n  web:\n   \
  \ image: web-db\n    build: .\n    ports:\n      - 80:5000\n    env_file:\n    \
  \  - db.env\n    entrypoint: ./start.pl --init --command shotgun\n    networks:\n\
  \      - frontend\n      - backend\n  db:\n    image: mysql\n    env_file:\n   \
  \   - db.env\n    networks:\n      - backend\nnetworks:\n  frontend:\n    driver:\
  \ bridge\n  backend:\n    driver: bridge\n```\n\n此示例基于前面部分中的简单多容器应用程序。这次，定义了两个网络，名为\
  \ frontend 和 backend，它们使用标准的 Docker 网桥网络。使用 docker-compose up 启动应用程序：\n\n```\n$\
  \ docker-compose -f docker-compose-networks.yml up\n```\n\n```\n$ docker-compose\
  \ exec web /bin/bash\nroot@2bae616b5cf1:/var/www# ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1\n link/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\n inet 127.0.0.1/8 scope host lo\n valid_lft forever preferred_lft\
  \ forever\n inet6 ::1/128 scope host\n valid_lft forever preferred_lft forever\n\
  \ 505: eth0@if506: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state\
  \ UP group default\n link/ether 02:42:ac:13:00:03 brd ff:ff:ff:ff:ff:ff link-netnsid\
  \ 0\n inet 172.19.0.3/16 scope global eth0\n valid_lft forever preferred_lft forever\n\
  \ inet6 fe80::42:acff:fe13:3/64 scope link\n valid_lft forever preferred_lft forever\n\
  \ 507: eth1@if508: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state\
  \ UP group default\n link/ether 02:42:ac:12:00:02 brd ff:ff:ff:ff:ff:ff link-netnsid\
  \ 0\n inet 172.18.0.2/16 scope global eth1\n valid_lft forever preferred_lft forever\n\
  \ inet6 fe80::42:acff:fe12:2/64 scope link\n valid_lft forever preferred_lft forever\n\
  ```\n\n数据库容器仍然只有一个 NIC。请注意，web 容器中分配给 eth1 的地址与两个容器中分配给 eth0 的地址处于不同的子网：\n\n```\n\
  $ docker-compose exec db bash\nroot@cc883ceac1f3:/# ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1\n link/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\n inet 127.0.0.1/8 scope host lo\n valid_lft forever preferred_lft\
  \ forever\n inet6 ::1/128 scope host\n valid_lft forever preferred_lft forever\n\
  \ 503: eth0@if504: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state\
  \ UP group default\n link/ether 02:42:ac:13:00:02 brd ff:ff:ff:ff:ff:ff\n inet 172.19.0.2/16\
  \ scope global eth0\n valid_lft forever preferred_lft forever\n inet6 fe80::42:acff:fe13:2/64\
  \ scope link\n valid_lft forever preferred_lft forever\n```\n\n`networks` 选项使您可以轻松隔离应用程序中的服务。例如，您可能在\
  \ `frontend` 网络中有一个服务，例如 SSL 终止代理，它可以响应来自 Internet 的请求，但您不希望该服务能够连接到数据库。它还可用于连接以前使用\
  \ `docker network create` 创建的网络。当您开始使用多主机集群时，这尤其有用。这将在 `Chapter 3, Cluster Building\
  \ Blocks – Registry, Overlay Networks, and Shared Storage` 中更详细地介绍。\n\n## 在卷中保持数据安全\n\
  \n将数据直接添加到容器镜像对于在应用程序运行时不希望更改的应用程序非常有效。您的应用程序代码通常属于此类。对于需要定期更新数据的任务，最好将数据放在卷上。卷还提供了一定程度的数据持久性，因为它们在容器删除后仍然存在。\n\
  \n卷是编排的关键之一。将容器数据放在外部卷中有助于促进容器更新并在多个主机上运行容器。使用网络共享存储将在 `Chapter 3, Cluster Building\
  \ Blocks – Registry, Overlay Networks, and Shared Storage` 中介绍。\n\n让我们回到 Web 数据库示例。正如本章开头配置的那样，数据库在应用程序启动时创建，在应用程序停止时销毁。这对于示例有效，但在实际生活中并不十分实用。相反，让我们重新配置应用程序以将数据库放在卷上：\n\
  \n```\nversion: '2'\nservices:\n  web:\n    image: web-db\n    build: .\n    ports:\n\
  \      - 80:5000\n    env_file:\n      - db.env\n    entrypoint: ./start.pl --init\
  \ --command shotgun\n    depends_on:\n      - db\n  db:\n    image: mysql\n    env_file:\n\
  \      - db.env\n    volumes:\n      - ./mysql:/var/lib/mysql\n```\n\n此示例将把 MySQL\
  \ 数据放在与 docker-compose.yml 同一目录下名为 mysql 的目录中。应用程序启动后，您应该看到 MySQL 数据文件：\n\n```\n\
  $ ls mysql\ndb  mysql  performance_schema  sys  auto.cnf  ib_buffer_pool  ibdata1\n\
  ib_logfile0  ib_logfile1\n```\n\n![](img/02bead9c8ff4515f78dac0eb33163961_57_0.png)\n\
  \n如果您运行了前面的示例，可能需要使用 docker-compose rm 删除容器，然后才能使用卷目录。\n\n现在，当您使用 docker-compose\
  \ rm 删除应用程序时，您可以看到数据仍在 mysql 目录中。如果重新启动应用程序，MySQL 容器将看到卷中的数据并从中断处继续。您可以在示例中以两种方式看到这一点。首先，将显示一条警告，指出表\
  \ 'author' 已存在。其次，将出现重复条目。这是因为 start.pl 是使用 --init 标志运行的，它在启动时会盲目尝试创建数据库并插入示例作者和书籍条目。\n\
  \n可以配置 Docker 支持的任何卷驱动程序。为此，docker-compose.yml 中需要一个单独的 volumes 条目。此块将允许您配置驱动程序所需的任何选项：\n\
  \n```\nversion: '2'\n\nservices:\n  web:\n    ...\n  db:\n    image: mysql\n   \
  \ env_file:\n      - db.env\n    volumes:\n      - dbvol:/var/lib/mysql\n\nvolumes:\n\
  \  dbvol:\n    driver: \"driver-name\"\n    driver_opts:\n      - opt1: \"foo\"\n\
  \      - opt2: \"bar\"\n```\n\n在此示例中，定义了一个名为 `dbvol` 的卷。`driver` 键告诉 Docker 使用哪个驱动程序。驱动程序所需的任何选项均通过\
  \ `driver_opts` 键设置。\n\n要在服务中使用卷，请像以前一样使用 `volumes` 选项。这次，第一部分是卷名而不是本地路径，在此示例中为\
  \ `dbvol`。第二部分仍然是容器内挂载卷的路径。\n\n> Docker 的可插拔架构支持大量插件，可支持多种存储系统。现有的插件包括 Azure File\
  \ Storage、Ceph、Gluster 和 VMware vSphere。您喜欢的搜索引擎可以帮助您找到更多。Docker 维护了一个不完整的列表，网址为\
  \ https://docs.docker.com/engine/extend/legacy_plugins/。\n\n## 摘要\n\n在本章中，您学习了如何构建新的\
  \ Docker 镜像以及如何使用 Docker Compose 定义和控制应用程序。您还学习了如何使用网络隔离容器之间的流量以及如何使用卷保护数据安全。在下一章中，将为多主机\
  \ Docker 集群打下基础，包括使用注册表、覆盖网络和网络存储。\n\n\n\n"
- "# 集群构建模块 – 注册表、覆盖网络和共享存储\n\n前两章介绍了使用 Docker 的基础知识。现在是时候开始着手构建 Docker 集群了。在构建新集群之前，需要先打好基础。本章将介绍注册表、覆盖网络和共享存储。每个组件对于\
  \ Docker 集群中容器的平稳运行都是必不可少的。\n\nDocker 是一个高度可插拔的系统。也就是说，每个组件都有多种选择。每种选择都有其自身的优势和劣势。有些可能比其他选择更适合您的环境。本章将为每个组件提供几个示例，并说明如何使用它们。\n\
  \n好消息是，无论您做出什么选择，都不会被锁定。Docker 的插件系统使得使用您需要的任何组件变得很容易，通常可以按容器为基础。例如，您可以先使用一种共享存储系统，然后决定另一种更适合您的需求。新容器可以立即开始使用新存储，而旧容器则继续使用旧系统。\n\
  \n本章将涵盖以下主题：\n\n- 注册表\n- 使用注册表\n- Docker Hub\n- Docker Cloud\n- Docker Datacenter\
  \ 和 Docker Trusted Registry\n- GitLab 注册表\n- 自行构建\n- 覆盖网络\n- 原生 Docker 覆盖网络\n- Flannel\n\
  - Weave\n- 共享存储\n- 存储驱动\n- Ceph\n\n## 创建 Docker 注册表\n\n**注册表** 只是存储镜像的地方。在本书中，您已经使用过\
  \ Docker 注册表。在 *第1章 使用 Docker 进行编排* 中，有一个启动 `nginx` 容器的示例：\n\n```\n$ docker run\
  \ --name webserver -p 80:80 nginx\n```\n\n`docker` 命令包含要使用的镜像名称，在此示例中为 `nginx`。Docker\
  \ 首先在本地查找该镜像，但如果本地未找到该镜像，Docker 会连接到 Docker Hub 上的默认注册表。如果镜像存在于注册表中，则会下载该镜像，您的容器将启动。\n\
  \n想想拥有注册表有多么强大。注册表使您可以轻松地将任何镜像快速部署到集群中的任何节点。如果没有注册表，您必须先在每台机器上手动构建镜像。在我最初使用 Docker\
  \ 的日子里，我就是这样做的，而且一点也不有趣。每次构建镜像时，库的变更都有可能导致我的应用程序崩溃。使用注册表可以让您在整个集群中获得一致的部署。\n\n###\
  \ 使用 Docker Hub\n\n迄今为止，开箱即用最容易使用的注册表是 Docker Hub。大多数项目的官方 Docker 镜像都托管在那里。您可以免费创建帐户，并托管您需要的任何数量的公共镜像。私有仓库需要付费。要创建帐户，请访问\
  \ https://hub.docker.com。\n\n### 登录\n\n拥有帐户后，就可以使用 `docker login` 登录到注册表了。默认情况下，Docker\
  \ 会尝试将您登录到 Docker Hub。登录后，您将有权拉取私有镜像并将新镜像推送到仓库：\n\n```\n$ docker login\nUsername:\
  \ username\nPassword:\nEmail: username@example.com\nWARNING: login credentials saved\
  \ in /home/user/.docker/config.json\nLogin Succeeded\n```\n\n请注意输出中的警告。您的注册表登录凭据将保存在\
  \ `$HOME/.docker/config.json` 中。此文件可以推送到集群服务器以自动执行注册表操作：\n\n```\n$ cat ~/.docker/config.json\n\
  {\n  \"auths\": {\n    \"https://index.docker.io/v1/\": {\n      \"auth\": \"cG...\"\
  ,\n      \"email\": \"username@example.com\"\n    }\n  }\n}\n```\n\n登录并保存凭据后，您可以再次登录而无需指定密码。还可以使用\
  \ `-p` 选项在命令行上传递密码：\n\n```\n$ docker login -u username\nWARNING: login credentials\
  \ saved in /home/user/.docker/config.json\nLogin Succeeded\n```\n\n显然，即使密码已被哈希处理，四处留下密码凭据也有点可怕。至少，请确保\
  \ `$HOME/.docker/config.json` 仅对您的用户可读。完成后，可以通过运行 `docker logout` 从 `config.json`\
  \ 中删除凭据。\n\n当您开始编排集群时，如果使用私有仓库，将需要从服务器自动化注册表登录。服务器需要能够从注册表拉取镜像。如果无法做到，您的服务将无法运行。在可能的情况下，您应该有一个单独的只读用户，该用户可以从仓库拉取镜像但无法更新它。在\
  \ Docker Hub 中可以实现这一点，但需要几个步骤来设置：\n\n1. 单击“组织”，然后单击“创建组织”。\n2. 单击“创建团队”按钮，填写团队名称和描述字段，然后单击“添加”：\n\
  \  ![](img/02bead9c8ff4515f78dac0eb33163961_62_0.png)\n3. 从列表中单击团队，并将只读用户添加到团队。\n\
  4. 创建一个仓库，或单击组织中现有的仓库。\n5. 单击“协作者”。从下拉菜单中选择团队。选择“读取”，然后单击“添加团队”：\n  ![](img/02bead9c8ff4515f78dac0eb33163961_63_0.png)\n\
  \n添加到该组的任何用户都将能够从仓库拉取镜像，但无法向其推送。您可以根据需要将只读团队添加到尽可能多的仓库中。这在仍然允许编排工具在需要时从仓库拉取镜像的同时，提供了一定的安全性。\n\
  \n### 使用仓库\n\n在使用仓库之前，不需要先创建仓库。但是，如果仓库将是私有的，应事先创建。这样可以确保推送到仓库的镜像不可见。您可以根据需要创建尽可能多的仓库：\n\
  \n1. 登录 Docker Hub 并单击“创建仓库”。\n2. 从列表中选择您的命名空间。这将是您的用户名或组织名称。\n3. 为您的仓库输入一个名称。该名称在命名空间中必须唯一。\n\
  4. 如有需要，添加简短描述和完整描述。\n5. 选择您的可见性（公共或私有），然后单击“创建”。\n\n现在是时候将镜像上传到 Docker Hub 了。您必须先使用\
  \ `docker build` 构建镜像。镜像名称必须与您要推送的名称相同。使用 Docker Hub 时，镜像名称由用户名或组织名称以及镜像名称组成，中间用斜杠分隔。例如，如果您的组织是\
  \ `domemoorg`，镜像名为 `test`，则镜像名称为 `domemoorg/test`。可选地，还可以包含标签，例如 `domemoorg/test:0.1`。构建完成后，将镜像推送到\
  \ Docker Hub：\n\n```\n$ docker build -t domemoorg/test .\n[output omitted]\n$ docker\
  \ push domemoorg/test\nThe push refers to a repository [docker.io/domemoorg/test]\n\
  2a2c642ec5d1: Pushed\n45d6c44ca123: Pushed\n07066ce72cdd: Pushed\ne4c7c26cda75:\
  \ Pushed\n0cad5e07ba33: Mounted from library/ubuntu\n48373480614b: Mounted from\
  \ library/ubuntu\n055757a19384: Mounted from library/ubuntu\nc6f2b330b60c: Mounted\
  \ from library/ubuntu\nc8a75145fcc4: Mounted from library/ubuntu\nlatest: digest:\
  \ sha256:f1af9d37d7792490f571a572bb17a21936b512b22a2d8650c11a3424f9192033\nsize:\
  \ 2198\n```\n\n该镜像现在可在 Docker Hub 上使用。如果仓库是公共的，任何人都可以下载和使用该镜像。出于此原因，请不要在镜像中包含密码。在可能的情况下，请使用环境变量，如在\
  \ `Chapter 2, Building Multi-Container Applications with Docker Compose` 中讨论的那样，以保持密码的机密性。\n\
  \n从 Docker Hub 下载镜像有两种方法。首先，您可以简单地运行一个容器，例如 `docker run domemoorg/test`。如果服务器上不存在该镜像，它将自动下载。请注意，`docker\
  \ run` 不会检查 Docker Hub 上的镜像是否有变化。要强制系统下载镜像，请使用 `docker pull`：\n\n```\n$ docker pull\
  \ domemoorg/test\n```\n\n在某些情况下，在准备部署之前使用 `docker pull` 下载镜像可能很有用。例如，您可能有一个正在运行容器正在使用的现有镜像的新版本。运行\
  \ `docker pull` 可确保在升级之前一切就绪。这将最大限度地减少新容器启动时的潜在停机时间。\n\n\n\n\n## 自动化使用 Docker Hub\
  \ 构建镜像\n\nDocker Hub 具有一项功能，可根据托管在 GitHub 或 Bitbucket 上的 Git 分支更新自动构建新镜像。要创建自动化构建，请从\
  \ **创建** 菜单中选择 **创建自动化构建**。如果您尚未关联，系统会提示您关联 GitHub 或 Bitbucket 帐户。\n\n请注意，关联的 GitHub\
  \ 或 Bitbucket 帐户只能关联到一个 Docker Hub 帐户。\n\n向导将引导您完成新仓库的创建。系统会要求您为仓库提供名称和描述。创建仓库后，请转到\
  \ **构建设置** 来配置自动化构建。Docker Hub 可以跟踪 Git 仓库中的多个分支，并在该分支每次更新时构建一个新的带标签镜像。\n\n您还可以配置\
  \ Docker Hub，以便在上游容器更新时重建您的镜像。例如，假设您的容器基于 `ubuntu` 镜像，换句话说，您在 `Dockerfile` 顶部使用了\
  \ `From ubuntu`。每当 `ubuntu` 镜像重建时，也会触发您的镜像重建。这是确保您的镜像始终拥有来自上游镜像的最新安全更新的一种方法。\n\n\
  自动化构建是开始使用 **持续集成 (CI)** 和 **持续部署 (CD)** 的好方法。它不具备 **GitLab** 或 **Jenkins** 那样的镜像测试功能，但您仍然可以构建自动化测试流程。例如，当开发人员准备测试其应用程序时，他们可以将更改推送到\
  \ GitHub 上的测试分支。此推送将触发 Docker Hub 上的构建，从而构建一个新镜像。一个进程可以在您的某台服务器上运行，定期拉取测试分支，针对其运行测试套件，并向您的团队发送构建报告。如果测试成功，团队随后可以将代码推送到\
  \ `master` 分支并触发生产构建。\n\nCI/CD 工具是确保部署过程稳定性和可靠性的一种方法。*第 9 章，使用持续集成来构建、测试和部署容器，*\
  \ 将向您展示如何使用 GitLab 中内置的 Docker Registry 来自动化测试和部署。\n\n## 与 Docker Cloud 集成\n\nDocker\
  \ 提供了一个名为 Docker Cloud 的完全云端托管的 Docker 管理平台。Docker Cloud 使用 Docker Hub 提供注册表服务。这意味着，除了与管理环境的紧密集成外，您还可以获得与直接在\
  \ Docker Hub 上可用的相同自动化构建服务。除了自动化构建外，Docker Cloud 还提供自动化测试框架。这将在第 9 章“使用持续集成来构建、测试和部署容器”中进一步介绍。\n\
  \nDocker Cloud 对私有仓库的另一项功能是能够对镜像执行安全扫描。它会扫描镜像的每一层以查找已知漏洞，并提供报告。扫描在镜像推送时或触发自动化构建时运行。生成的报告可能会显示您的镜像所基于的镜像中存在漏洞。在这种情况下，您将不得不使用较新版本的基础镜像重建，或自行解决漏洞。\n\
  \n## 使用 GitLab 容器注册表\n\nGitLab 是一款一体化开发套件。它提供 Git 仓库、问题跟踪、CI 和 Docker 注册表。GitLab\
  \ 中 Git、问题跟踪和 Docker 注册表之间的紧密集成使其成为应用程序开发的理想解决方案。GitLab 是开源的，可以本地安装。企业托管也可在 gitlab.com\
  \ 上获得。\n\n使用 GitLab 最简单的方式是通过其云端服务，但本地安装也很简单。就我的经验而言，安装 GitLab 的最佳方式是使用 Omnibus\
  \ 安装程序。它会安装 GitLab 所需的所有软件并管理所有更新。Omnibus 软件包适用于 Ubuntu、Debian、CentOS 和 Raspberry\
  \ Pi。\n\n有一个可用的 Docker 镜像，但使用起来稍微困难一些。我建议以 gitlab/gitlab-ce 为基础创建自己的镜像，以放置软件包配置和\
  \ SSL 证书。GitLab Docker 镜像文档位于 https://docs.gitlab.com/omnibus/docker/。\n\n### 在\
  \ Ubuntu 上安装 GitLab\n\n在安装 GitLab 之前，需要安装许多依赖项。Postfix 是可选的。如果您选择不使用它，则需要将 GitLab\
  \ 配置为使用另一台服务器发送电子邮件：\n\n```\n$ sudo apt-get install curl openssh-server ca-certificates\
  \ postfix\n```\n\nGitLab 是另一个希望您下载脚本并直接通过 sudo 管道运行的项目。我再次强调，这样做非常危险。相反，请下载脚本，查看它，如果看起来没问题，则运行它：\n\
  \n```\n$ wget -qO script.deb.sh\nhttps://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh\n\
  $ sudo bash script.deb.sh\n$ sudo apt-get install gitlab-ce\n```\n\nGitLab 配置在 /etc/gitlab/gitlab.rb\
  \ 中。有关所有选项的完整指南超出了本书范围。相反，让我们专注于配置 Docker Registry 所需的内容：\n\n```\nregistry['enable']\
  \ = true\nregistry_external_url 'https://registry.example.com'\ngitlab_rails['registry_path']\
  \ = \"/var/opt/gitlab/gitlab-rails/shared/registry\"\nregistry_nginx['ssl_certificate']\
  \ = \"/etc/gitlab/ssl/registry.example.com.crt\"\nregistry_nginx['ssl_certificate_key']\
  \ = \"/etc/gitlab/ssl/registry.example.com.key\"\ngitlab_rails['lfs_enabled'] =\
  \ true\n```\n\n第一行在 GitLab 中启用注册表服务。第二行设置注册表的 URL。它可以使用与 GitLab 其余部分相同的地址，但使用不同的端口。也可以使注册表在单独的主机名上可用。第三行设置注册表在文件系统上的位置。\n\
  \n第四行和第五行定义 SSL 证书和密钥文件。注册表使用的证书必须受客户端信任，否则 Docker 会抛出错误。如果您使用的证书包含中间证书，则需要将证书链添加到证书文件中：\n\
  \n```\n$ cat intermediate.pem your_certificate.pem > registry.pem\n```\n\n> 不推荐在没有证书的情况下使用\
  \ GitLab Docker 注册表，但这是可行的。将 --insecure-registry 和您的注册表地址添加到 Docker 守护进程的启动命令中。完整详情可在\
  \ https://docs.docker.com/registry/insecure/ 上找到。\n\n最后一行启用 Git 大文件存储 (LFS)。这并非严格必要，但它确实允许将大文件添加到镜像的\
  \ Git 仓库中。例如，我有需要 Oracle Instant Client 的服务。客户端的 ZIP 文件很大，但构建镜像时需要它们。LFS 允许轻松地将客户端添加到\
  \ Git。LFS 必须在客户端上安装并配置才能使用。\n\n对 `gitlab.rb` 所做的更改后，需要重新配置 GitLab。这是通过运行 `sudo gitlab-ctl\
  \ reconfigure` 完成的。升级后也会运行此命令以更新数据库。\n\n> 有关配置 GitLab 容器注册表的完整详情，请参阅：\n> https://docs.gitlab.com/ce/administration/container_registry.htm\n\
  \n## 在项目中启用 Docker 注册表\n\n可以为在 GitLab 中创建的任何项目启用 Docker 注册表。单击右上角的齿轮图标并选择 **编辑项目**。向下滚动到\
  \ **功能** 部分，启用 **容器注册表**，然后单击 **保存更改**：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_68_0.png)\n\
  \n启用后，拥有仓库访问权限的用户可以使用其 GitLab 凭据通过 `docker login` 登录。用户可能对仓库具有读取或写入权限，具体取决于其项目访问权限。登录后，镜像可以照常推送或拉取。请注意，镜像名称以注册表地址开头：\n\
  \n```\n$ docker pull registry.example.com/namespace/project\n$ docker push registry.example.com/namespace/project\n\
  ```\n\nGitLab CI 有能力自动构建、测试甚至部署镜像。这将在第 9 章“使用持续集成来构建、测试和部署容器”中详细介绍。\n\n> 有关在项目中使用\
  \ GitLab 容器注册表的完整文档，请参阅：\n> https://docs.gitlab.com/ce/user/project/container_registry.html\n\
  \n## 介绍 Docker Trusted Registry 和 Docker Datacenter\n\nDocker Trusted Repository\
  \ (DTR) 是 Docker Universal Control Plane (UCP) 可用的应用程序，也是 Docker Datacenter 的一部分。Docker\
  \ Datacenter 提供了一个本地或基于云的集群管理工具，具备基于角色的访问控制 (RBAC)、LDAP 和 AD 身份验证，以及对 Docker 主机的监控。实际上，Docker\
  \ Datacenter 是 Docker Cloud，DTR 充当在您自己的网络上运行的 Docker Hub 的角色。\n\nDocker Datacenter\
  \ 支持带有完整 CI/CD 的镜像自动化构建或测试。它还内置了对高可用性和镜像安全性的支持。Docker Datacenter 使用集成的 Docker Content\
  \ Trust 对镜像进行数字签名和验证。这确保您获得的镜像就是您想要的镜像。\n\n### 自己构建\n\n如果这些选项都不适合您，还有自己构建的选项。这将允许您根据特定需求自定义注册表，但实现可能需要大量工作。它在较小的环境中也效果良好，这些环境不需要\
  \ GitLab 的复杂性或 Docker Datacenter 的费用，但仍然需要私有仓库。\n\n\n\n\n就像 Docker 世界中的许多事情一样，新注册表只需一个\
  \ `docker run` 命令即可搞定：\n\n```\n$ docker run -d -p 5000:5000 --name registry registry:2\n\
  ```\n\n此命令将启动一个新的 `registry` 容器，可立即使用，但需注意一些事项。首先，镜像数据存储在容器中。删除容器也会删除所有镜像。最简单的解决方案是使用卷将本地文件系统中的目录挂载到\
  \ `/var/lib/registry`。如需更大灵活性，建议考虑使用共享存储而非本地目录：\n\n```\n$ docker run -d -p 5000:5000\
  \ -v /data/registry:/var/lib/registry --name registry registry:2\n```\n\n其次，除非 Docker\
  \ 已配置为使用非安全注册表，否则这仅适用于 localhost 上的 `docker` 命令。这是因为 `docker` 要求为与注册表的 TLS 连接提供有效证书。你可以将包含证书的目录挂载到容器中，并指定环境变量来告诉注册表从哪里读取证书：\n\
  \n```\n$ docker run -d -p 5000:5000 \\\n-v /data/registry:/var/lib/registry \\\n\
  -v /data/certs:/etc/certs \\\n-e REGISTRY_HTTP_TLS_CERTIFICATE=/etc/certs/registry.pem\
  \ \\\n-e REGISTRY_HTTP_TLS_KEY=/etc/certs/registry.key \\\n--name registry registry:2\n\
  ```\n\n关于证书的同样警告也适用于此。如果你的证书由中间证书签名，则完整的证书链必须包含在证书文件中。\n\nDocker Registry 原生支持基本身份验证。如果你想实现更复杂的功能，需要在注册表前运行代理或使用令牌服务器。代理更简单，但令牌服务器能让你以更精细的粒度控制访问权限。完整详情、代理示例以及运行注册表的\
  \ Docker Compose 文件可在 https://github.com/docker/docker.github.io/blob/master/registry/deploying.md\
  \ 中找到。\n\n## 使用 overlay 网络连接容器\n\n启动 Docker 容器时，会为其分配一个私有 IP 地址。这样可以避免与网络上可能已使用的地址冲突，并允许同一主机上的容器相互通信。这是一个不错的系统，只不过不同主机上运行的容器无法相互通信，除非它们在主机上被暴露出来。为了解决这个问题，包括\
  \ Docker 在内的各种项目都开发了 overlay 网络。\n\nOverlay 网络是一种叠加在现有 IP 网络之上的私有网络，用于允许多台主机上的容器相互通信。连接到\
  \ overlay 网络的容器仍会分配私有地址，且无法从网络外部访问。端口可以像往常一样使用 `docker run` 的 `-p` 选项公开。\n\nDocker\
  \ 的可插拔网络基础设施导致 overlay 插件数量增长。它还允许容器使用多个 overlay 网络。使用多个网络可提供网络隔离和分段，并最大限度地降低被攻破的容器嗅探不应看到的网络流量的风险。\n\
  \n### 使用 Docker 原生 overlay 网络\n\nDocker 的原生 overlay 网络是该领域的相对新进入者。它提供 **DNS 服务发现\
  \ (DNS-SD)** 和使用多个 overlay 的功能。与 Docker Swarm 结合使用时，它提供跨集群连接。后来进入生态系统的优势在于你可以从该领域的其他条目中学习。Docker\
  \ 肯定已经做到了这一点。\n\n本节中描述的功能在很大程度上依赖 Docker Swarm，这将在第 4 章《使用 Docker Swarm 进行编排》中详细介绍。目前，可以通过运行\
  \ `docker swarm init` 创建单节点 swarm：\n\n```\n$ docker swarm init\n```\n\n> 使用 Docker\
  \ Swarm 需要 Docker 1.12 或更高版本。\n\n让我们从创建容器将使用的网络开始。Docker Swarm 确保此网络对连接到 swarm 节点的所有主机均可用：\n\
  \n```\n$ docker network create --driver overlay external\n```\n\n--driver 选项告诉 Docker\
  \ 此网络使用 swarm 原生 overlay 驱动程序。末尾是 overlay 网络的名称。在此示例中为 external。这将是服务定义中用于配置所用网络的名称。\n\
  \n--opt encrypted 选项是可选的。如果指定，它告诉 Docker 加密不同节点上容器之间的连接。为此，Docker Swarm 将自动在连接到该网络的容器的任何节点之间构建\
  \ IPSEC 隧道。加密密钥会每十二小时自动更新一次。\n\n如果你拥有跨越多个提供商的网络，或者希望简化容器间安全性，使用加密的 overlay 网络尤其有用。例如，MySQL\
  \ 支持使用 TLS 进行连接。然而，很少有容器为 MySQL 启用了 TLS。使用加密的 overlay 网络可在与数据库通信时提供所需的加密，而无需担心证书分发或是否支持\
  \ TLS。\n\n### 使用 DNS-SD\n\n容器的一个问题是每次启动时都会分配新 IP 地址。这使得配置相互连接的容器变得非常困难。当容器运行在不同主机上时，情况会更加困难。幸运的是，Docker\
  \ overlay 网络具有使用 DNS 的内置服务发现功能。DNS 条目作为 swarm 服务的一部分创建，这些服务将在第 4 章《使用 Docker Swarm\
  \ 进行编排》中介绍。\n\n考虑以下命令：\n\n```\n$ docker service create --network external --name\
  \ nginx --replicas 2 -p 80:80 nginx 8m2vwm3n9w990kh77vf556k7i\n```\n\n此命令使用 Docker\
  \ Swarm 创建一个名为 nginx 且具有两个副本的服务。当服务启动时，Docker 会为 nginx 创建一个 DNS 记录，该记录解析为启动的两个容器。网络上的任何其他容器都可以使用名称\
  \ nginx 连接到该服务。让我们创建一个 busybox 容器进行测试：\n\n```\n$ docker service create --name shell\
  \ --network external busybox sleep 6000 191qi81lvvpnah3eqq8cvaxft4n\n```\n\n```\n\
  $ docker service ps nginx\nID NAME IMAGE NODE DESIRED STATE CURRENT STATE ERROR\n\
  da3hba7mokh0o0qr39eov9n9p nginx.1 nginx swarm-host2 Running\nRunning 30 seconds\
  \ ago\n4vzfcgjnujawjy6m7ngmbyiwv nginx.2 nginx swarm-master Running\nRunning 30\
  \ seconds ago\n$ docker service ps shell\nID NAME IMAGE NODE DESIRED STATE CURRENT\
  \ STATE ERROR\ncbcbx21b5hs0ax06jfaeqzfjrq shell.1 busybox swarm-host1 Running\n\
  Running 24 seconds ago\n```\n\n这表明 nginx 容器正在名为 swarm-master 和 swarm-host2 的两个主机上运行。busybox\
  \ shell 服务在 swarm-host1 上启动。使用 docker exec，可以连接到 shell 容器并验证连接性。\n\n首先，使用 docker\
  \ ps 在主机上获取容器名称：\n\n```\n$ docker ps\nCONTAINER ID IMAGE COMMAND CREATED STATUS\
  \ PORTS NAMES\n1148d48d5720 nginx:latest \"nginx -g 'daemon off'\" 2 minutes ago\
  \ Up 2 minutes 80/tcp, 443/tcp nginx.1.2t914z7ogcdb5nohrujd1tltln\n0bc68f9957b1\
  \ busybox:latest \"sleep 6000\" 2 minutes ago Up 2 minutes shell.1.3wul50smhsjjhzpctnnsbeurd\n\
  ```\n\n```\n$ docker exec -it shell.1.3wul50smhsjjhzpctnnsbeurd sh\n/ # wget -O\
  \ - nginx\nConnecting to nginx (10.255.0.6:80)\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>Welcome to nginx!</title>\n...\n```\n\nwget 命令正在向名为 nginx 的主机请求网页。该请求会被转发到\
  \ nginx 服务并在屏幕上打印出来。\n\n## 使用网格路由模式发布服务\n\nDocker overlay 网络支持另一个名为 **网格路由** 的有用功能。在创建服务时使用\
  \ `--publish` 或 `-p` 选项时，此功能会自动启用。路由器会将请求转发到集群中任意主机上监听请求端口的容器或服务，即使该服务未在接收到请求的主机上运行。在前面的示例中，启动了一个名为\
  \ `nginx` 的服务，并使用 `-p` 标志将主机上的端口 80 发送到容器中的端口 80。对任何 Docker 主机上的端口 80 的请求都会导致两个\
  \ `nginx` 容器中的一个响应请求。\n\n网格路由会在服务中的所有容器之间负载均衡请求。你可以为诸如 `www.example.com` 之类的主机名设置循环\
  \ DNS 条目，该条目包含主机地址，或者指向 swarm 中 Docker 主机地址的外部负载均衡器。后者将允许你将 Docker 节点保留在私有地址上。\n\
  \nDocker Swarm 中网格路由的缺点是，公开的端口必须在整个集群中唯一。换句话说，你不能同时拥有 `web1` 和 `web2` 服务并尝试公开端口\
  \ 80。其中一个必须使用不同端口。\n\n## 使用 Weave\n\nWeave Net 由 Weaveworks 开发，旨在为 Docker 提供具有弹性和安全性的\
  \ overlay 网络。Weave 节点形成网格，即使某个节点故障，集群中的流量仍能继续流动。网格可以加密，以安全地保持跨越其的数据流动。Weave 网络甚至可以跨云提供商，连接运行在\
  \ Amazon EC2、Microsoft Azure 或甚至本地 Docker Datacenter 上的容器。Weave 还支持 DNS-SD，允许容器按名称相互通信，即使位于不同主机上。\n\
  \n> 有关 Weave Net 的完整文档可在 `https://www.weave.works/docs/net/latest/using-weave/`\
  \ 中找到。\n\n\n\n\n### 安装 Weave\n\n第一步是将 `weave` 工具安装到你的桌面或其他管理系统中。`weave` 工具只是一个 shell\
  \ 脚本。weave 的核心功能在 Docker 容器中运行。该脚本也应直接安装在 Docker 节点本身：\n\n```\n$ wget -O weave git.io/weave\n\
  $ chmod +x weave; cp weave /usr/local/bin/\n```\n\n以下示例假设一个三节点集群，节点名称为 `swarm-master`、`swarm-host1`\
  \ 和 `swarm-host2`。节点可以使用 Docker Machine 创建，如 *第 1 章，开始使用 Docker 编排* 中所述。可以向集群添加任意数量的主机。网格越大，在发生节点故障时的弹性就越强。\n\
  \n下一步是初始化 Weave。首先使用 Docker Machine 切换到第一台服务器。`consensus` 标志告诉 weave 最初将有三台服务器。以后可以添加更多：\n\
  \n```\n$ eval $(docker-machine env swarm-master)\n$ weave launch --ipalloc-init\
  \ consensus=3\n```\n\n这将在 `swarm-master` 上下载并启动三个容器。如果要加密网格，请将 `--password` 标志添加到\
  \ `weave launch`。密码在连接的每个节点上必须相同：\n\n```\n$ weave launch --password XXXX ...\n```\n\
  \n你可以使用 `docker ps` 验证它们是否正在运行：\n\n```\n$ docker ps\nCONTAINER ID        IMAGE \
  \                              COMMAND                   NAMES\nCREATED        \
  \     STATUS    PORTS\nb645e00cde8d        weaveworks/plugin:1.6.1         \"/home/weave/plugin\"\
  \      weaveplugin\n42 seconds ago      Up 41 seconds\n\ne0bc711a0972        weaveworks/weaveexec:1.6.1\
  \        \"/home/weave/weavepro\"    weaveproxy\n44 seconds ago      Up 43 seconds\n\
  \n89897514f42d        weaveworks/weave:1.6.1            \"/home/weave/weave --\"\
  \    weave\n45 seconds ago      Up 44 seconds\n```\n\n接下来，在第二台主机上安装 weave 并将其连接到第一台：\n\
  \n```\n$ eval $(docker-machine env swarm-host1)\n$ weave launch --ipalloc-init consensus=3\n\
  $ weave connect 10.128.0.2\n```\n\n最后一条命令中的 IP 地址是主节点的 IP 地址。通常可以在那里使用 `$(docker-machine\
  \ ip swarm-master)`。如果你在 GCE 等服务上运行主机，则希望使用那里的内部 IP 地址，因为它不会改变。\n对第三台主机重复此过程：\n\n\
  ```\n$ eval $(docker-machine env swarm-host2)\n$ weave launch --ipalloc-init consensus=3\n\
  $ weave connect 10.128.0.2\n```\n\n一旦 weave 在所有三个节点上安装并运行，使用 weave status 检查网络状态：\n\
  \n```\n$ weave status\nVersion: 1.6.1 (up to date; next check at 2016/09/16 23:30:55)\n\
  Service: router\nProtocol: weave 1..2\nName: 22:b6:71:6d:9c:d2 (swarm-host2)\nEncryption:\
  \ disabled\nPeerDiscovery: enabled\nTargets: 1\nConnections: 2 (2 established)\n\
  Peers: 3 (with 6 established connections)\nTrustedSubnets: none\nService: ipam\n\
  Status: idle\nRange: 10.32.0.0/12\nDefaultSubnet: 10.32.0.0/12\nService: dns\nDomain:\
  \ weave.local.\nUpstream: 169.254.169.254\nTTL: 1\nEntries: 0\nService: proxy\n\
  Address: tcp://104.197.144.79:12375\nService: plugin\nDriverName: weave\n```\n\n\
  ### 将容器连接到 Weave\n\n既然网络已经设置好，是时候启动使用它的容器了。容器将使用启动 weave 时创建的 weave 网络。本示例将启动名为\
  \ shell11 和 shell12 的两个容器。shell11 容器将在后台运行：\n\n```\n$ docker run --net=weave -h\
  \ shell1.weave.local $(weave dns-args) -tdi weaveworks/ubuntu\n```\n\n```\n$ docker\
  \ run --net=weave -h shell2.weave.local $(weave dns-args) -ti \\\nweaveworks/ubuntu\n\
  ```\n\n为了让 DNS-SD 工作，需要在 `docker` `run` 中使用 `--dns` 和 `--dns-search` 选项。weave 提供一个名为\
  \ `weave dns-args` 的帮助命令，它将适当地设置这些选项。\n\n执行第二条命令后，你将留在 `shell12` 容器的命令提示符处。从那里，你应该能够\
  \ ping `shell11`：\n\n```\nroot@shell12:/# ping shell11\nPING shell11 (10.40.0.0)\
  \ 56(84) bytes of data.\n64 bytes from 89d43b8ac937.weave (10.40.0.0): icmp_seq=1\
  \ ttl=64\ntime=0.180 ms\n\n64 bytes from 89d43b8ac937.weave (10.40.0.0): icmp_seq=2\
  \ ttl=64\ntime=0.099 ms\n\n64 bytes from 89d43b8ac937.weave (10.40.0.0): icmp_seq=3\
  \ ttl=64\ntime=0.069 ms\n\n64 bytes from 89d43b8ac937.weave (10.40.0.0): icmp_seq=4\
  \ ttl=64\ntime=0.104 ms\n^C\n--- shell11 ping statistics ---\n4 packets transmitted,\
  \ 4 received, 0% packet loss, time 3000ms\nrtt min/avg/max/mdev = 0.069/0.113/0.180/0.040\
  \ ms\n```\n\n## 使用 Flannel\n\nFlannel 是由 CoreOS 开发的覆盖网络。它使用 `etcd` 作为数据存储并进行网络同步。Flannel\
  \ 缺少 Docker overlay 和 weave 支持的一些功能。没有加密或 DNS-SD 的选项。但是，一旦配置完成，它使用起来非常简单。\n\n###\
  \ 配置 etcd 和 Flannel\n\nCoreOS 通过 `cloud-config` 配置。`cloud-config` 文件是一个 YAML 文件，通过用户数据选项传递给主机。文件必须以\
  \ `#cloud-config` 开头，CoreOS 才能识别它。\n\n在开始之前，必须为 `etcd` 生成一个新令牌。`size` 参数是集群的初始大小。以后可以添加和删除节点：\n\
  \n```\n$ wget -qO - 'https://discovery.etcd.io/new?size=3'\nhttps://discovery.etcd.io/c37921aac12231bf487a3ed82c464a4f\n\
  ```\n\n发现 URL 可以接受其他选项。有关详细信息，请参阅 https://coreos.com/etcd/docs/latest/clustering.html。\n\
  \n生成的令牌将在 cloud-config 文件的 coreos > etcd2 > discovery 选项中使用。你需要为集群中的每个主机使用相同的令牌。每个集群都必须生成一个新令牌：\n\
  \n```\n#cloud-config\n\ncoreos:\netcd2:\ndiscovery: https://discovery.etcd.io/<token>\n\
  advertise-client-urls:\nhttp://$private_ipv4:2379,http://$private_ipv4:4001\ninitial-advertise-peer-urls:\
  \ http://$private_ipv4:2380\nlisten-client-urls:\nhttp://0.0.0.0:2379,http://0.0.0.0:4001\n\
  listen-peer-urls: http://$private_ipv4:2380\nflannel:\npublic_ip: $private_ipv4\n\
  etcd_endpoints: http://$private_ipv4:2379\nfleet:\npublic_ip: $private_ipv4\nunits:\n\
  - name: etcd2.service\ncommand: start\n- name: fleet.service\ncommand: start\n-\
  \ name: flanneld.service\ncommand: start\ndrop-ins:\n- name: 50-networking-config.conf\n\
  content: |\n[Service]\nExecStartPre=/usr/bin/etcdctl set\n/coreos.com/network\n\
  config '{\"Network\":\"10.42.0.0/16\"}'\n- name: docker.service\ncommand: start\n\
  drop-ins:\n- name: 40-flannel.conf\ncontent: |\n[Unit]\nRequires=flanneld.service\n\
  After=flanneld.service\n```\n\n此示例展示了如何在 CoreOS 上使用 Flannel。它假设你的 CoreOS 主机有两个网络接口；一个连接到公共网络，一个连接到专用网络。$private_ipv4\
  \ 变量将被云提供商分配的专用 IP 地址替换。这受到 Amazon EC2、GCE、Microsoft Azure 和 OpenStack 的支持。\n\n\
  Flannel 将其配置以 JSON 格式存储在 etcd 的 /coreos.com/network/config 路径中。在 Flannel 启动之前，必须将配置写入\
  \ etcd。由于 CoreOS 使用 systemd 来管理服务，因此可以创建一个 drop-in 文件，在 Flannel 启动之前将配置添加到 etcd。\n\
  \n前面的示例具有 Flannel 所需的最低限度配置。它所做的只是设置将用于为每个容器分配 IP 地址的网络。你应该将其更改为与你的环境中任何内容都不冲突的内容。如果\
  \ Docker 已经在运行，则需要重新启动 Docker。Flannel 文档中提供了完整的选项列表，网址为 https://github.com/coreos/flannel。\n\
  \n### 使用 Flannel 启动 CoreOS 集群\n\n以下命令在 GCE 上启动三台 CoreOS alpha 服务器。--can-ip-forward\
  \ 标志是 Flannel 正确转换运行中容器的流量所必需的。主机的 cloud-config 文件通过 --metadata-from-file 选项设置：\n\
  \n```\n$ gcloud compute instances create core1 core2 core3 --image-project coreos-cloud\
  \ --image-family coreos-alpha \\\n--zone us-central1-a --machine-type g1-small --can-ip-forward\
  \ --scopes compute-rw --metadata-from-file \\\nuser-data=coreos-user-data.yml\n\
  ```\n\n确保 sshd 已启动：\n\n```\n$ gcloud compute instances get-serial-port-output core1\
  \ | grep\nStarting.*sshd\nStarting Generate sshd host keys...\n```\n\n一旦主机启动，登录到其中一台以验证\
  \ etcd 是否健康。由于 Flannel 依赖于 etcd，如果它不起作用，Flannel 也不会起作用：\n\n```\n$ gcloud compute\
  \ ssh --zone us-central1-a core@core1\nX11 forwarding request failed\nLast login:\
  \ Sat Sep 17 21:34:41 2016 from 162.220.127.20 core@core1 ~ $\netcdctl cluster-health\n\
  member 9817b5cb6db4b548 is healthy: got healthy result from\nhttp://10.128.0.4:2379\n\
  member aa7418b2c3e34652 is healthy: got healthy result from\n```\n\n\n\n\n\nhttp://10.128.0.2:2379\n\
  成员 d9402f140b10154d 运行正常：已从\nhttp://10.128.0.3:2379\n获取运行正常的结果\n集群运行正常\n\n如果 etcd\
  \ 显示运行正常，可以使用 sudo systemctl status flanneld 检查 Flannel 的状态。\n\n当 Flannel 启动时，它会创建一个名为\
  \ /run/flannel_docker_opts.env 的环境文件。该文件由 docker.service 单元文件加载，用于配置 Docker 的网络以使用\
  \ Flannel。由于 Docker 守护进程已配置为使用 Flannel，因此在使用 docker run 时无需指定任何特殊网络选项。\n\n现在，验证\
  \ Docker 是否已由 Flannel 正确配置以使用其 Docker 网桥的子网：\n\n```\n$ sudo systemctl status docker.service\n\
  ● docker.service - Docker Application Container Engine\n   Loaded: loaded (/usr/lib64/systemd/system/docker.service;\
  \ disabled; vendor preset: disabled)\n   Active: active (running) since Sun 2016-10-30\
  \ 05:27:48 UTC; 22s ago\n     Docs: http://docs.docker.com\n   Main PID: 1881 (docker)\n\
  \      Tasks: 6\n      Memory: 14.1M\n      CPU: 205ms\n   CGroup: /system.slice/docker.service\n\
  \            └─1881 docker daemon --host=fd:// --exec-opt native.cgroupdriver=systemd\
  \ --bip=10.42.88.1/24 --mtu=1432 --ip-masq=false --selinux-enabled\n```\n\n> 初次运行\
  \ Flannel 时，Docker 可能无法读取环境文件。在这种情况下，请使用 sudo systemctl restart docker.service 重启\
  \ Docker 或重新启动系统。之后 Docker 应该可以正常工作。\n\n### 连接到 Flannel\n\n将容器连接到 Flannel 与 docker\
  \ run 一样简单。首先在 core1 上启动一个 busybox 容器并获取其 IP 地址。如果分配的地址不在 Flannel 配置中设置的子网内，则表示\
  \ Docker 未读取 Flannel 创建的环境文件：\n\n```\ncore@core1 ~ $ docker run -it -d --name test1\
  \ busybox\nee06605271b8301d27a03a6b4e7aa32d4fc3f558888087e2047eaedd0241c7d\ncore@core1\
  \ ~ $ docker exec test1 -4 ip addr | grep inet\ninet 127.0.0.1/8 scope host lo\n\
  inet 10.42.88.2/24 scope global eth0\n```\n\n接下来，在 core2 上启动另一个 `busybox` 容器。这次，在前台运行容器以便获得命令提示符：\n\
  \n```\ncore@core2 ~ $ docker run -it --rm --name test2 busybox / # ip -4 addr |\
  \ grep inet\ninet 127.0.0.1/8 scope host lo\ninet 10.42.3.2/24 scope global eth0\n\
  ```\n\n如你所见，此容器也分配到了 Flannel 子网中的 IP。现在 ping 在 core1 上启动的容器：\n\n```\n/ # ping 10.42.88.2\n\
  PING 10.42.88.2 (10.42.88.2): 56 data bytes\n64 bytes from 10.42.88.2: seq=0 ttl=60\
  \ time=1.491 ms\n64 bytes from 10.42.88.2: seq=1 ttl=60 time=0.528 ms\n```\n\n成功！请注意一件事。使用\
  \ IP 地址而不是容器名称进行 ping 是有原因的。Flannel 不支持 DNS-SD。如果你尝试按名称 ping 容器，`ping` 将会报告错误：\n\
  \n```\n/ # ping test1\nping: bad address 'test1'\n```\n\n缺乏服务发现乍看之下可能是个弱点，但实际上并非如此。能够将\
  \ Flannel 用作覆盖网络的编排工具（例如 Kubernetes）通常提供自己的服务发现：\n\n```\n$ gcloud compute instances\
  \ delete core1 core2 core3\n```\n\n将删除以下实例。配置为自动删除的附加磁盘将被删除，除非它们挂载到任何其他实例。删除磁盘是不可逆的，磁盘上的任何数据都将丢失：\n\
  \n- [core1] 在 [asia-east1-a]\n- [core2] 在 [asia-east1-a]\n- [core3] 在 [asia-east1-a]\n\
  是否要继续 (Y/n)? y\n\n## 使用共享网络存储作为 Docker 卷\n\n运行 Docker 集群时最大的挑战之一是决定如何处理数据。Docker\
  \ 支持使用 **卷** 来存储数据。默认情况下，卷在 Docker 主机上存储数据。如果该容器在另一台主机上启动会怎样？将无法使用任何数据。对于大多数应用程序来说，这是一个问题。\n\
  \nDocker 通过创建可插拔存储系统解决了这个问题。可以创建连接到各种存储系统的卷。这些系统可以是从传统网络存储（例如 **网络文件系统 (NFS)** 和\
  \ **Internet 小型计算机系统接口 (iSCSI)**）到云服务（例如 Amazon S3）或集群存储系统（例如 Gluster 或 Ceph）的任何内容。\n\
  \n每种存储选项都有其优缺点。有些可能更适合某些工作负载。幸运的是，你可以按容器为基础选择最佳解决方案。公共 Web 服务器可能在 Amazon EC2 上运行并需要那里的存储，而本地文件服务器则连接到本地\
  \ Ceph 集群。\n\n卷使用 `docker volume create` 命令创建。以下示例使用名为 `foo` 的虚构驱动程序创建名为 `vol1`\
  \ 的卷：\n\n```\n$ docker volume create --driver foo --name vol1 --opt bar=1 --opt\
  \ baz=2\n```\n\n卷使用的驱动程序由 `--driver` 标志定义。每个驱动程序都有自己的选项集，通过添加一个或多个 `--opt` 标志来设置。请务必阅读选择使用的每个存储驱动程序的文档。\n\
  \n## 介绍 Ceph\n\nCeph 是由 Red Hat 开发的分布式集群存储解决方案。它提供对象存储、块存储和共享文件系统。Ceph 还可以通过 RADOS\
  \ 网关提供与 Amazon S3 和 OpenStack Swift 的兼容性。还支持多个存储池和存储分层。当集群中出现问题时，它还可以自我修复，因此是为网络服务提供存储的绝佳选择。\n\
  \n设置 Ceph 集群时有两个值得注意的组件。第一个组件是 Ceph Monitor。监视器跟踪集群运行状况和 **可控复制与可扩展哈希 (CRUSH)**\
  \ 映射，该映射告诉集群如何在集群中查找数据。第二个是 Ceph OSD。这些是实际控制存储的守护进程。最佳实践是为集群中将使用的每个磁盘运行一个 OSD。有关\
  \ Ceph 的更多详细信息，请参阅 *Learning Ceph, Karan Singh*，由 Packt Publishing 出版，或访问 http://www.ceph.com/。\n\
  \n### 将 Ceph 与 Docker 配合使用\n\nDocker 可以通过多种存储驱动程序之一使用 Ceph 作为卷。某些编排系统（例如 Kubernetes）内置了\
  \ Ceph 支持。一如既往，请自行研究以查看哪个插件适合你的环境。此演示将使用来自 `contiv` 的 `volplugin` 驱动程序，可从以下网址获取：https://github.com/contiv/volplugin。\n\
  \n`volplugin` 驱动程序使用许多守护进程。你可以手动安装它们，但最简单的方法是在 Docker 容器中运行它们：\n\n```\n$ sudo docker\
  \ run -it -v /var/run/docker.sock:/var/run/docker.sock contiv/volplugin-autorun\n\
  ```\n\n请注意，Docker 套接字作为卷被传递到容器中。这正是允许启动脚本注册并运行所需容器的原因。\n\n初始安装将创建名为 `policy1` 的策略，该策略将在\
  \ `rbd` 存储池中创建新镜像。如果你使用的是另一个存储池、设置了不同的默认大小或在镜像上使用了不同的文件系统，可以创建其他策略。这些策略通过 `volcli`\
  \ 工具管理，该工具可通过 `volplugin` 镜像获得：\n\n```\n$ sudo docker exec volplugin volcli policy\
  \ get policy1\n{\"name\":\"policy1\",\"create\":{\"size\":\"10MB\",\"filesystem\"\
  :\"\"},\"runtime\":{\"snapshots\":true,\"snapshot\":{\"frequency\":\"30m\",\"keep\"\
  :20},\"rate-limit\":{\"write-iops\":0,\"read-iops\":0,\"write-bps\":0,\"read-bps\"\
  :0},\"driver\":{\"pool\":\"rbd\"},\"filesystems\":{\"ext4\":\"mkfs.ext4 -m0\"},\"\
  backends\":{\"crud\":\"ceph\",\"mount\":\"ceph\",\"snapshot\":\"ceph\"}}\n```\n\n\
  此示例展示了如何使用 volcli 获取 policy1 的配置。请注意 docker exec 的使用，它允许 volplugin 工具连接到正在运行的守护进程。\n\
  \n## 创建 Docker 卷\n\nvolplugin 运行后，可以使用它来创建 Docker 卷。卷的名称以正在使用的策略开头，后跟斜杠，然后是镜像名称：\n\
  \n```\n$ sudo docker volume create -d volplugin --name policy1/test\n```\n\n在 Ceph\
  \ 中，新的 rbd 在存储池中创建。请注意名称差异。Ceph 不允许镜像名称中包含斜杠，因此斜杠已更改为点：\n\n```\n$ sudo rbd info\
  \ policy1.test\nrbd image 'policy1.test':\n    size 10240 kB in 3 objects\n    order\
  \ 22 (4096 kB objects)\n    block_name_prefix: rbd_data.372d8625e32\n    format:\
  \ 2\n    features: layering\n    flags:\n```\n\n现在卷可以与正在运行的容器一起使用。它的工作方式与挂载本地目录完全相同，只是使用卷名称而不是本地路径：\n\
  \n```\n$ sudo docker run --rm -v policy1/test:/mnt busybox\n```\n\n此命令启动一个新的 busybox\
  \ 容器，并将 Ceph rbd 镜像挂载到 /mnt。请注意，由于它是新文件系统，/mnt 中只有 lost+found 目录。为了用简单示例演示卷的强大功能，让我们在\
  \ /mnt 中创建一个新文件：\n\n```\n/ # touch /mnt/example\n/ # ls /mnt\nexample  lost+found\n\
  ```\n\n由于此容器是使用 --rm 启动的，容器在退出时将被删除。但是，存储在卷上的数据将保留以供下一个容器使用。如果你启动使用相同卷的新容器，数据仍然会存在：\n\
  \n```\n$ sudo docker run --rm -v policy1/test:/mnt -it busybox\n/ # ls /mnt\nexample\
  \  lost+found\n```\n\n\n\n\n\n使用 Ceph 这样的系统作为卷的强大之处在于，你可以在集群中的任何主机上启动容器，你的数据将在那里等着你。也就是说，容器在集群中的哪里启动或某个特定主机是否运行，都无关紧要。\n\
  \n警告一下。Ceph rbd 镜像是块设备，就像主机可用的任何其他块设备一样。如果你使用 iSCSI、OpenStack Cinder 或来自云提供商的存储，情况也是如此。也就是说，关于多个主机尝试挂载同一文件系统的标准警告也适用。多个主机挂载同一个\
  \ Ext4 或类似文件系统进行写入，不可避免地会导致数据丢失。这是一件坏事。\n\n如果你需要多个主机访问同一文件系统，请考虑使用 NFS 或 SMB 作为中间层。你也可以使用运行集群感知文件系统（如\
  \ OCFS2）的容器，但这会给日益复杂的环境增加更多复杂性。\n\n### 其他共享存储插件\n\n如前所述，有很多存储插件。几乎每个主要存储系统都有一个插件。以下是一些更有趣的插件：\n\
  \n- **Azure 文件存储**：由微软开发的开源插件，用于支持 Azure。参考 `https://github.com/Azure/azurefile-dockervolumedriver`。\n\
  - **GlusterFS**：支持来自 Red Hat 的 GlusterFS 集群存储系统。参考 `https://github.com/calavera/docker-volume-glusterfs`。\n\
  - **REX-Ray**：由 Dell EMC 开发，用于支持 Docker 和 Mesos 的 ScaleIO 和 Isilon。参考 `https://github.com/emccode/rexray`。\n\
  - **Kubernetes**：Kubernetes 编排工具原生支持 iSCSI、NFS、Ceph 以及许多其他系统。\n\n### 总结\n\n在本章中，你了解了\
  \ Docker 集群所需的基础构建块。无论使用哪种编排工具，都需要一个用于存储镜像的仓库、用于容器间通信的覆盖网络以及网络存储，以便你的容器无论在集群中的哪里启动都能访问其数据。每个角色都有许多选择。虽然解决方案的选择很重要，但如果需要，在系统之间切换也很容易。有些方案在特定环境和工作负载下表现更好。下一章将深入探讨使用\
  \ Docker Swarm 编排 Docker 集群。\n"
- "# 4 使用 Docker Swarm 进行编排\n\nDocker Swarm 是 Docker 的原生编排工具。它与 Docker 1.12 版一起被集成到核心\
  \ Docker 套件中。最简单来说，使用 Docker Swarm 就像使用 Docker 一样。所有已介绍的工具仍然有效。Docker Swarm 添加了一些功能，使服务的部署和更新变得非常出色。你在\
  \ `Chapter 3, Cluster Building Blocks – Registry, Overlay Networks, and Shared Storage`\
  \ 中一窥了它们的面貌，该章介绍了 Docker 覆盖网络。现在是时候深入细节了。\n\n本章将涵盖以下主题：\n\n- 创建 swarm\n- 添加和删除节点\n\
  - 更改节点可用性\n- Swarm 灾难恢复\n- 使用标签对节点进行分组\n- 创建和停止服务\n- 创建副本\n- 使用全局服务\n- 使用约束\n- 使用滚动更新实现零停机升级\n\
  - 与 swarm 一起使用 Docker Compose\n- 使用 Docker Datacenter\n\n## 设置 swarm\n\n运行 swarm\
  \ 的第一步是准备好若干已安装 Docker 的主机。无论你是使用 get.docker.com 的安装脚本还是使用 Docker Machine 都无关紧要。你还需要确保服务器之间打开了几个端口，如下所示：\n\
  \n- 2377 TCP 端口用于集群管理\n- 7946 TCP 和 UDP 端口用于节点通信\n- 4789 TCP 和 UDP 端口用于覆盖网络\n\n\
  花点时间为将成为 swarm 管理器的主机获取或分配静态 IP 地址。每个管理器都必须有静态 IP 地址，以便工作节点知道如何连接到它们。工作节点地址可以是动态的，但管理器的\
  \ IP 必须是静态的。\n\n在规划 swarm 时，花点时间决定需要多少个管理器。在保持容错能力的同时运行所需的最小数量是三个。对于更大的集群，你可能需要五个或七个。很少情况下需要比这更多。无论如何，管理器的数量应该是奇数。只要\
  \ 50% + 1 的管理器在运行，Docker Swarm 就可以维持法定人数。拥有两个或四个管理器并不比拥有一个或三个提供额外的容错能力。\n\n如果可能，你应该分散部署管理器，以免单点故障导致整个\
  \ swarm 瘫痪。例如，确保它们不全运行在同一个 VM 主机上或连接到同一个交换机。整个重点是拥有多个管理器，以便在管理器发生故障时保持 swarm 运行。不要允许其他地方出现单点故障来破坏你的努力，从而导致\
  \ swarm 瘫痪。\n\n## 初始化 swarm\n\n如果你是从桌面安装，最好使用 Docker Machine 连接到主机，因为这将设置必要的 TLS\
  \ 密钥。运行 `docker swarm init` 命令来初始化 swarm。`--advertise-addr` 标志是可选的。默认情况下，它会猜测主机上的一个地址。这可能不正确。为了确保正确，请将其设置为管理器主机的静态\
  \ IP 地址：\n\n```\n$ docker swarm init --advertise-addr 172.31.26.152\nSwarm initialized:\
  \ current node (6d6e6kxlyj9u9vb9w1uug95zh) is now a\nmanager.\nTo add a worker to\
  \ this swarm, run the following command:\ndocker swarm join \\\n--token\nSWMTKN-1-0061dt2qjsdr4gabxryrksqs0b8fnhwg6bjhs8cxzen7tmarbi-89mmok3p\n\
  f6dsa5n33fb60tx0m \\\n172.31.26.152:2377\nTo add a manager to this swarm, run 'docker\
  \ swarm join-token manager' and\nfollow the instructions.\n```\n\n`init` 命令的输出中包含在每个工作节点主机上运行的命令。如果你已将环境设置为使用工作节点主机，也可以从桌面运行它。你可以将命令保存在某处，但也可以随时通过运行\
  \ `docker swarm join-token manager` 再次获取它。\n\n作为加入过程的一部分，Docker Swarm 将创建 TLS 密钥，用于加密管理器与主机之间的通信。但是，它不会加密容器之间的网络流量。证书每三个月更新一次。可以通过运行\
  \ `docker swarm update --cert-expiry duration` 来更新时间段。持续时间以小时和分钟数指定。例如，将持续时间设置为\
  \ `1000h` 将告诉 Docker Swarm 每 1000 小时重置一次证书。\n\n## 管理 swarm\n\n在编排 Docker 时，最容易被忽略的部分之一是如何管理集群本身。在本节中，你将了解如何管理\
  \ swarm，包括添加和删除节点、更改其可用性以及备份和恢复。在 *第 10 章，为什么止步于容器？自动化你的基础设施* 中，我们将深入了解自动化节点部署。\n\
  \n### 添加节点\n\n新的工作节点可以随时添加。安装 Docker，然后运行 `docker swarm join-token worker` 以获取 `docker\
  \ swarm join` 命令，将主机加入 swarm。添加后，工作节点将可用于运行任务。请注意，加入集群的命令是一致的。这使得将其添加到主机配置脚本并在引导时加入\
  \ swarm 变得很容易。\n\n你可以通过在管理节点上运行 `docker node ls` 来获取 swarm 中所有节点的列表：\n\n```\n$ docker\
  \ node ls\nID                                     HOSTNAME   STATUS   AVAILABILITY\
  \   MANAGER STATUS\nii3wtacdjz5p509bu313qfbei             worker1   Ready    Active\
  \         Reachable\n3f2t4wwthgcahs9089b8przv              worker2   Ready    Active\
  \         Reachable\n6d6e6kxlyjuo9vb9w1uug95zh *           manager   Ready    Active\
  \         Leader\n```\n\n该列表不仅会显示机器，还会显示它们在 swarm 中是否活跃以及是否是管理器。标记为 `Leader` 的节点是\
  \ swarm 的主节点。它协调管理器。\n\n### 提升和降级节点\n\n在 Docker Swarm 中，就像现实生活中一样，管理员也是工作节点。这意味着管理器可以运行任务。这也意味着工作节点可以被提升为管理器。这对于快速替换故障管理器或无缝增加管理器数量非常有用。以下命令将名为\
  \ `worker1` 的节点提升为管理器。以下命令必须在已经是管理器的节点上运行：\n\n```\n$ docker node promote worker1\n\
  Node worker1 promoted to a manager in the swarm.\n```\n\n管理器也可以降级为普通工作节点。在管理节点即将停用之前应执行此操作。以下命令将\
  \ `worker1` 降级回普通工作节点：\n\n```\n$ docker node demote worker1\nManager worker1 demoted\
  \ in the swarm.\n```\n\n无论你出于什么理由提升或降级节点，完成后请确保管理器的数量为奇数。\n\n### 更改节点可用性\n\nDocker\
  \ Swarm 节点具有可用性概念。节点的可用性决定是否可以在该节点上调度任务。使用 `docker node update --availability <state>\
  \ <node-id>` 命令设置可用性状态。可以设置三种可用性状态——pause、drain 和 active。\n\n\n\n\n\n### 暂停节点\n\n\
  将节点的可用性设置为 `pause` 将阻止调度程序向该节点分配新任务。现有任务将继续运行。这对于排查节点上的负载问题或防止向已过载的节点分配新任务很有用。以下命令将暂停\
  \ `worker2`：\n\n```\n$ docker node update --availability pause worker2\nworker2\n\
  ```\n\n| ID | 主机名 | 状态 | 可用性 | 管理器状态 |\n|---|---|---|---|---|\n| 1i3wtacdjz5p509bu313qfbei\
  \ | worker1 | 就绪 | 活动 | 可访问 |\n| 3f2t4wwvthgcahs9089b8przv | worker2 | 就绪 | 已暂停\
  \ | 可访问 |\n| 6d6e6kxlyjguo9vbw91uug95zh * | manager | 就绪 | 活动 | 领导者 |\n\n不要依赖使用\
  \ `pause` 来处理过载问题。更好的做法是对服务设置合理的资源限制，并让调度程序自行处理。你可以使用 `pause` 来帮助确定资源限制应为多少。例如，你可以在节点上启动一个任务，然后暂停该节点，以防止新任务运行，同时监控资源使用情况。\n\
  \n### 排空节点\n\n与 `pause` 类似，将节点的可用性设置为 `drain` 将阻止调度程序向该节点分配新任务。此外，`drain` 将停止任何正在运行的任务，并将其重新调度到群集中的其他位置运行。`drain`\
  \ 模式有两种常见用途。\n\n首先，它对于为节点升级做准备非常有用。容器将以有序的方式停止和重新调度。然后可以应用更新，并在必要时重启节点，而不会造成进一步的中断。更新完成后，可以将节点重新设置为\
  \ `active`。\n\n请记住，在排空节点时，运行中的容器必须停止并在其他位置重新启动。如果你的应用程序不是为处理故障而构建的，这可能会造成中断。容器的好处在于它们启动速度很快，但某些服务（例如\
  \ MySQL）需要几秒钟来初始化。\n\ndrain 的第二种用途是防止服务在管理节点上被调度。管理节点的处理非常依赖于消息及时传递。在管理节点上运行的不受约束的任务可能会导致节点拒绝服务中断，从而给你的集群带来问题。将管理节点长期保持在\
  \ drain 状态并不罕见。以下命令将排空名为 manager 的节点：\n\n```\n$ docker node update --availability\
  \ drain manager\nmanager\n```\n\n| ID | 主机名 | 状态 | 可用性 | 管理器状态 |\n|---|---|---|---|---|\n\
  | 1i3wtacdjz5p509bu313qfbei | worker1 | 就绪 | 活动 | 可访问 |\n| 3f2t4wwvthgcahs9089b8przv\
  \ | worker2 | 就绪 | 活动 | 可访问 |\n| 6d6e6kxlyjguo9vbw91uug95zh * | manager | 就绪 | 排空\
  \ | 领导者 |\n\n### 激活节点\n\n当节点准备好再次接受任务时，将状态设置为 active。如果节点没有立即填满容器，请不要担心。只有在发生新的调度事件时（例如启动服务）才会分配任务。以下命令将重新激活\
  \ worker2 节点：\n\n```\n$ docker node update --availability active worker2\nworker2\n\
  ```\n\n| ID | 主机名 | 状态 | 可用性 | 管理器状态 |\n|---|---|---|---|---|\n| 1i3wtacdjz5p509bu313qfbei\
  \ | worker1 | 就绪 | 活动 | 可访问 |\n| 3f2t4wwvthgcahs9089b8przv | worker2 | 就绪 | 活动 |\
  \ 可访问 |\n| 6d6e6kxlyjguo9vbw91uug95zh * | manager | 就绪 | 活动 | 领导者 |\n\n### 移除节点\n\
  \n出于各种原因，可能需要移除节点，包括升级、故障，或只是消除不再需要的容量。例如，构建新节点而不是在旧节点上执行更新，升级节点可能更容易。新节点将被添加，旧节点将被移除。\n\
  \n对于健康节点，第一步是将 --availability 状态设置为 drain。这将确保所有计划任务都已停止并移至群集中的其他节点。\n\n第二步是从将要离开群集的节点上运行\
  \ `docker swarm leave`。这将把节点状态分配为 Down。在以下示例中，`worker2` 已离开群集：\n\n| ID | 主机名 | 状态\
  \ | 可用性 | 管理器状态 |\n|---|---|---|---|---|\n| 1i3wtacdjz5p509bu313qfbei | worker1\
  \ | 就绪 | 活动 | 可访问 |\n| 3f2t4wwvthgcahs9089b8przv | worker2 | 已停止 | 活动 | |\n| 6d6e6kxlyjguo9vbw91uug95zh\
  \ * | manager | 就绪 | 活动 | 领导者 |\n\n如果要移除的节点是管理节点，则必须先按前文所述将其降级为工作节点，然后再运行 `docker\
  \ swarm leave`。移除管理节点时，要注意不要丢失法定人数，否则你的集群将停止工作。\n\n一旦节点被标记为 Down，就可以将其从群集中移除。从管理节点，使用\
  \ `docker node rm` 将节点从群集中移除：\n\n```\n$ docker node rm worker2\n```\n\n在某些情况下，你想要移除的节点无法访问，因此无法运行\
  \ `docker swarm leave`。发生这种情况时，请使用 `--force` 选项：\n\n```\n$ docker node rm --force\
  \ worker2\n```\n\n已移除的节点可以使用 `docker swarm join` 重新添加。\n\n## 从灾难中恢复\n\n在大型集群中，故障是经常发生的。硬盘会故障，服务器会故障，甚至整个数据中心也会断电。将服务迁移到\
  \ AWS 和 Azure 等云平台有所帮助，但即使它们也曾出现整个区域宕机的情况。使用容器可能会使你的应用程序更能抵抗故障，但运行这些容器的主机仍然会受到各种因素的影响。经过合理设计，你的集群应该能够应对灾难。以下是一些需要牢记的事项，以保持集群安全。\n\
  \n## 重启整个集群\n\n可能有时需要关闭整个群集。希望有足够的时间正确关闭正在运行的服务和主机。在关闭主机时，先关闭工作节点，再关闭管理节点。在重新启动集群时，先启动管理节点，再启动工作节点。确保管理节点拥有相同的\
  \ IP 地址，否则你的节点将启动但无法重新连接到群集。\n\n## 备份和恢复\n\n仅因为 Docker Swarm 对故障具有恢复能力，并不意味着你应该忽视备份。良好的备份可能是在恢复服务和遭遇毁灭性事件之间的区别。需要备份的两个主要组件是群集状态数据和应用程序数据。\n\
  \n## 备份群集\n\n每个管理节点将集群信息保存在 `/var/lib/docker/swarm/raft`。如果出于某种原因，你需要完全重建集群，则需要这些数据。确保至少有一份\
  \ `raft` 数据目录的良好备份。从哪个管理节点拉取备份无关紧要。从几个管理节点拉取备份可能是明智的，以防其中一个损坏。\n\n## 恢复群集\n\n在大多数情况下，丢失故障的管理节点是一个容易解决的问题。重启故障的管理节点，一切应该都会好起来。可能需要构建新的管理节点，或将现有工作节点提升为管理节点。在大多数情况下，这将使你的集群恢复健康状态。\n\
  \n如果丢失足够多的管理节点导致丢失法定人数，恢复将变得更加复杂。第一步是启动足够数量的管理节点以恢复法定人数。数据应同步到新的管理节点，一旦恢复法定人数，集群也就恢复了。如果这不起作用，你将不得不重建群集。这就是备份派上用场的地方。\n\
  \n如果你选择用于重建的管理节点具有健康的 raft 数据库，可以从那里开始。如果不是，或者你正在全新的节点上重建，请停止 Docker 并将 raft 数据复制回\
  \ /var/lib/docker/swarm/raft。将 raft 数据放置到位后，确保 Docker 正在运行，并运行以下命令：\n\n```\n$ docker\
  \ swarm init --force-new-cluster --advertise-addr manager\n```\n\n使用 --advertise-addr\
  \ 设置的地址与最初创建群集时使用的含义相同。这里的关键是 --force-new-cluster 选项。该选项将忽略 raft 数据库中的群集成员数据，但会记住诸如工作节点列表、运行中的服务和任务等内容。\n\
  \n## 备份服务\n\n服务信息作为 raft 数据库的一部分进行备份，但你应该制定计划，以防数据库损坏而重建它们。备份 docker swarm ls 的输出是一个好的开始。应用程序信息（包括网络和卷）可以从\
  \ Docker Compose 文件中获取，这些文件应该被备份。容器配置（包括 Dockerfile 和构建容器所需的一切）以及你的应用程序应放在版本控制中并进行备份。\n\
  \n最重要的是，不要忘记你的数据。如果你有 Dockerfile 和应用程序代码，即使注册表丢失，也可以重建应用程序。在某些情况下，不备份注册表是一个合法的选择，因为镜像可能可以重建。然而，数据通常无法重建。为适合你环境的备份数据制定策略。我建议为每个部署的应用程序创建一个容器，并能够正确备份该应用程序的数据。Docker\
  \ Swarm 没有原生的计划任务选项，但你可以在工作节点上配置 cron，按计划运行各种备份容器。\n\npause 可用性选项在此可能很有帮助。配置一个工作节点作为拉取备份的指定主机。将可用性设置为\
  \ pause，以便不会在该节点上启动其他容器，并可用资源来执行备份。\n\n\n\n\n使用 `pause` 表示容器可以在后台启动，并且在节点暂停后将继续运行，从而让它们正常完成。然后\
  \ `cron` 可以运行一个类似下面这样的脚本。`run-backup-containers` 的内容留给读者作为练习：\n\n```\n#!/bin/bash\n\
  docker node update --availability active backupworker\nrun-backup-containers\ndocker\
  \ node update --availability pause\n```\n\n你还可以添加标签来指定多个节点用于备份，并安排服务忽略这些节点；或者，在备份容器的情况下，在这些节点上运行。标签将在下一节中更深入地介绍。\n\
  \n## 使用标签分组节点\n\n将节点分组通常很有用。例如，你可能有一组拥有外部 IP 地址的节点，以及另一组仅拥有私有 IP 地址的节点。前端服务（如 Web\
  \ 服务器）应部署在公共节点上，而后端服务（如数据库）应部署在拥有私有地址的节点上。在另一种情况下，你可能有一组配备 SSD 的节点，而另一组拥有较慢的磁盘。Docker\
  \ Swarm 通过标签实现这种分组。\n\n**标签**使用 `docker node update` 添加到节点。标签可以单独添加，也可以作为键/值对添加。一次可以设置一个或多个标签：\n\
  \n```\n$ docker node update --label-add frontend worker1\n$ docker node update --label-add\
  \ backend --label-add env=prod worker2\n```\n\n`docker node inspect` 命令会显示节点的所有信息，包括标签。默认情况下，它以\
  \ JSON 格式输出。为了更易于阅读，请使用 `--pretty` 标志：\n\n```\n$ docker node inspect --pretty worker2\n\
  ID: 0c9wmu7elqs8zkxe6k103k1t3\nLabels:\n- backend =\n- env = prod\nHostname: worker2\n\
  Joined at: 2016-09-23 04:19:32.236213766 +0000 UTC\nStatus:\nState: Ready\nAvailability:\
  \ Active\nManager Status:\nAddress: 172.31.26.153:2377\nRaft Status: Reachable\n\
  Leader: No\nPlatform:\nOperating System: linux\nArchitecture: x86_64\nResources:\n\
  CPUs: 1\nMemory: 990.7 MiB\nPlugins:\nNetwork: bridge, host, null, overlay\nVolume:\
  \ local\nEngine Version: 1.12.1\nEngine Labels:\n- provider = generic\n```\n\n可以通过将\
  \ Go 模板传递给 `--format` 标志，仅输出标签。该模板使用 JSON 输出中的键名：\n\n```\n$ docker node inspect\
  \ --format '{{ .Spec.Labels }}' worker2\nmap[backend: env:prod]\n```\n\n使用 `docker\
  \ node update` 的 `--label-rm` 标志可以删除标签。与 `--label-add` 类似，可以通过多次指定 `--label-rm`\
  \ 一次删除多个标签：\n\n```\n$ docker node update --label-rm backend worker1\n```\n\n节点标签可以用作服务的约束，以将服务限制在特定节点上。约束将在本章后面部分详细介绍。\n\
  \n## 管理服务\n\n既然 Swarm 已经启动并运行，现在是时候来了解服务了。服务是一个或多个执行特定功能的任务的集合。每个任务都是在 Swarm 中某个位置运行的容器。由于服务可能由多个任务组成，因此有不同的工具来管理它们。在大多数情况下，这些命令将是\
  \ `docker service` 的子命令。\n\n在 Swarm 中将容器作为服务运行具有多种好处。如下所示：\n\n- 服务可以快速且轻松地扩展。\n\
  - Swarm 可以执行零停机升级，即在添加新版本镜像的同时移除旧版本。\n- 轻松创建覆盖网络来连接运行在多个主机上的容器。（覆盖网络在第 3 章“集群构建模块\
  \ – 注册表、覆盖网络和共享存储”中已详细介绍。）\n\n### 运行服务\n\n使用 Docker Swarm 运行任务与在普通 Docker 下运行任务略有不同。不使用\
  \ `docker run`，而使用 `docker service create` 命令：\n\n```\n$ docker service create --name\
  \ web nginx\n```\n\n服务启动时，Swarm 管理器会将任务调度到 Swarm 中的活动工作节点上运行。默认情况下，Swarm 会将运行中的容器分布到\
  \ Swarm 中的所有活动主机上。\n\n向 Internet 提供服务需要使用 `-p` 标志发布端口。通过多次指定 `-p` 可以打开多个端口。使用 Swarm\
  \ 覆盖网络时，你还会获得入口网格路由，这在第 3 章“集群构建模块 – 注册表、覆盖网络和共享存储”中有所描述。无论服务运行在哪里，该网格都会将集群中任何主机的连接路由到该服务。端口发布还会对多个容器进行负载均衡：\n\
  \n```\n$ docker service create --name web -p 80 -p 443 nginx\n```\n\n### 创建副本\n\n\
  服务可以使用 `--replicas` 选项以多个容器启动。该值为所需副本的数量。启动所有所需副本可能需要一点时间：\n\n```\n$ docker service\
  \ create --replicas 2 --name web -p 80 -p 443 nginx\n```\n\n此示例在服务名称 `web` 下启动两个\
  \ `nginx` 容器的副本。好消息是，你可以随时更改副本数量：\n\n```\n$ docker service update --replicas 3 web\n\
  ```\n\n更棒的是，服务可以进行扩容或缩容。此示例将服务扩容到三个容器。当副本不再需要时，以后可以将数量缩减。\n\n使用 `docker service\
  \ ls` 查看运行中服务及其副本数量的摘要：\n\n| ID | 名称 | 副本 | 镜像 | 命令 |\n|---|---|---|---|---|\n|\
  \ 4i3jsbsohkxj | web | 3/3 | nginx | |\n\n如果需要查看服务的详细信息，包括任务运行的位置，请使用 `docker service\
  \ ps` 命令。它以服务名称为参数。此示例显示了属于服务 `web` 的三个 `nginx` 任务：\n\n| ID | 名称 | 镜像 | 节点 | 期望状态\
  \ | 当前状态 | 错误 |\n|---|---|---|---|---|---|---|\n| d993z8o6ex6wz00xtbrv647uq | web.1\
  \ | nginx | worker2 | 运行中 | 运行中 31 分钟前 | |\n| eueui4hw33eonsin9hfgqcvd7 | web.2\
  \ | nginx | worker1 | 运行中 | 准备中 4 秒前 | |\n| djg5542upalvq4z0ycz8blgfo | web.3 |\
  \ nginx | worker2 | 运行中 | 运行中 2 秒前 | |\n\n请注意任务的名称。如果你连接到 `worker1` 并尝试使用 `docker\
  \ exec` 访问 `web.2` 容器，将会收到错误：\n\n```\n$ docker exec -it web.2 bash\nError response\
  \ from daemon: No such container: web.2\n```\n\n使用 `docker service` 命令启动的任务，其名称由服务名称、数字和任务\
  \ ID 组成，中间用点分隔。在 `worker1` 上使用 `docker ps`，你可以看到 `web.2` 容器的实际名称：\n\n| 容器 ID | 镜像\
  \ | 命令 | 创建时间 | 状态 | 端口 | 名称 |\n|---|---|---|---|---|---|---|\n| b71ad831eb09 |\
  \ nginx:latest | \"nginx -g 'daemon off'\" | 2 天前 | 已运行 2 天 | 80/tcp, 443/tcp |\
  \ web.2.eueui4hw33eonsin9hfgqcvd7 |\n\n### 运行全局服务\n\n有时你可能希望在 Swarm 中的每个活动节点上运行任务。这对于监控工具很有用：\n\
  \n```\n$ docker service create --mode global --name monitor nginx\n```\n\n| ID |\
  \ 名称 | 镜像 | 节点 | 期望状态 | 当前状态 | 错误 |\n|---|---|---|---|---|---|---|\n| daxkqywp0y8bhip0f4ocpl5v1\
  \ | monitor | nginx | worker2 | 运行中 | 运行中 6 秒前 | |\n| a45opnrj3dcvz4skgwd8vamx8\
  \ | _ monitor | nginx | worker1 | 运行中 | 运行中 4 秒前 | |\n\n需要强调的是，全局服务仅在活动节点上运行。任务不会在可用性设置为\
  \ pause 或 drain 的节点上启动。如果将暂停或排空的节点设置为 active，全局服务将立即在该节点上启动：\n\n```\n$ docker node\
  \ update --availability active manager\nmanager\n```\n\n| ID | 名称 | 镜像 | 节点 | 期望状态\
  \ | 当前状态 | 错误 |\n|---|---|---|---|---|---|---|\n| 0mpe2zb0mn3z6fa2ioybjhqr3 | monitor\
  \ | nginx | manager | 运行中 | 准备中 3 秒前 | |\n| daxkqywp0y8bhip0f4ocpl5v1 | _ monitor\
  \ | nginx | worker2 | 运行中 | 运行中 3 分钟前 | |\n| a45opnrj3dcvz4skgwd8vamx8 | _ monitor\
  \ | nginx | worker1 | 运行中 | 运行中 3 分钟前 | |\n\n\n\n\n## Setting constraints\n\n设置限制往往很有用，用来限制服务可以在哪些节点上运行。例如，依赖于快速磁盘的服务可能仅限于运行在配备\
  \ SSD 的节点上。可以通过 `--constraint` 标志将限制添加到 `docker service create` 命令中。可以添加多个限制。结果将是所有限制的交集。\n\
  \n在这个示例中，假设有一个包含三个节点的 swarm —— manager、worker1 和 worker2。worker1 和 worker2 节点具有\
  \ env=prod 标签，而 manager 节点具有 env=dev 标签。如果以 env 为 dev 的限制启动服务，则该服务的任务将仅在 manager\
  \ 节点上运行：\n\n```\n$ docker service create --constraint \"node.labels.env == dev\"\
  \ --name web-dev --replicas 2 nginx\n913jm3v2ytrpxejpvtdkzrfjz\n```\n\n```\n$ docker\
  \ service ps web-dev\nID                         NAME         IMAGE   NODE     \
  \ DESIRED STATE\nCURRENT STATE              ERROR\n5e93f110k9x6kq013ffotd1wf  web-dev.1\
  \    nginx   manager   Running\nRunning 6 seconds ago\n5skcigjackl6b8snptgcjbu12\
  \  web-dev.2    nginx   manager   Running\nRunning 5 seconds ago\n```\n\n尽管 swarm\
  \ 中有另外两个节点，但该服务仅在 manager 上运行，因为它是唯一带有 env=dev 标签的节点。如果以 env 为 prod 的限制启动另一个服务，则任务将在\
  \ worker 节点上启动：\n\n```\n$ docker service create --constraint \"node.labels.env ==\
  \ prod\" --name web-prod --replicas 2 nginx\n88kfmfbwskl1khg92f4fkcpwx\n```\n\n\
  ```\n$ docker service ps web-prod\nID                         NAME          IMAGE\
  \   NODE      DESIRED STATE\nCURRENT STATE              ERROR\n5f4s2536g0bmm9j7wc02s963\
  \   web-prod.1    nginx   worker2   Running\nRunning 3 seconds ago\n5ogcsvmv2bguwpbulndn4i9q65\
  \ web-prod.2    nginx   worker1   Running\nRunning 3 seconds ago\n```\n\n如果对服务进行扩缩容，则会遵守限制。无论请求多少个副本，容器都将仅在与限制匹配的节点上运行：\n\
  \n```\n$ docker service update --replicas 3 web-prod\nweb-prod\n```\n\n```\n$ docker\
  \ service ps web-prod\nID NAME IMAGE NODE DESIRED STATE\nCURRENT STATE ERROR\n5f4s2536g0bmm9j7wc02s963\
  \ web-prod.1 nginx worker2 Running\nRunning about a minute ago\n5ogcsvmv2bguwpbulndn4i9q65\
  \ web-prod.2 nginx worker1 Running\nRunning about a minute ago\nen15vh1d7819hag4xp1qkerae\
  \ web-prod.3 nginx worker1 Running\nRunning 2 seconds ago\n```\n\n如示例所示，容器都在 `worker1`\
  \ 和 `worker2` 上运行。这引出了一个重要点。如果无法满足限制，服务将启动但不会实际运行任何容器：\n\n```\n$ docker service\
  \ create --constraint \"node.labels.env == testing\" --name web-test --replicas\
  \ 2 nginx\n6tfeocf8g4rwk8p5erno8nyia\n```\n\n```\n$ docker service ls\nID NAME REPLICAS\
  \ IMAGE COMMAND\n6tfeocf8g4rw web-test 0/2 nginx\n88kfmfbwkskl web-prod 3/3 nginx\n\
  913jm3v2ytrp web-dev 2/2 nginx\n```\n\n请注意，请求的副本数为 2，但运行中的容器数为 0。Swarm 找不到合适的节点，因此不启动容器。如果添加带有\
  \ `env=testing` 标签的节点，或者将该标签添加到现有节点，swarm 将立即调度任务：\n\n```\n$ docker node update\
  \ --label-add env=testing worker1\nworker1\n```\n\n```\n$ docker service ps web-test\n\
  ID NAME IMAGE NODE DESIRED STATE\nCURRENT STATE ERROR\n7hsjsqo0pqblb6x68qos19olb0\
  \ web-test.1 nginx worker1 Running\nRunning 18 seconds ago\ndqajwyqrah6zv83dsfqgene3qa\
  \ web-test.2 nginx worker1 Running\nRunning 18 seconds ago\n```\n\n在这个示例中，`worker1`\
  \ 上的 env 标签已从 `prod` 更改为 `testing`。由于现在有满足 `web-test` 服务限制的节点，swarm 在 `worker1`\
  \ 上启动了容器。但是，限制仅在调度任务时检查。尽管 `worker1` 不再具有设置为 `prod` 的 `env` 标签，但 `web-prod` 服务的现有容器仍在运行：\n\
  \n```\n$ docker node ps worker1\n\nID NAME IMAGE NODE DESIRED STATE\nCURRENT STATE\
  \ ERROR\n7hsjs0q0pqlb6x68qs19olb0 web-test.1 nginx worker1 Running\nRunning 5 minutes\
  \ ago\ndaqjwyqrah6zv83dsfqgene3qa web-test.2 nginx worker1 Running\nRunning 5 minutes\
  \ ago\n5ogcsmv2bquwpbulnd4n1q965 web-prod.2 nginx worker1 Running\nRunning 21 minutes\
  \ ago\nen15vhl7d7819hag4xp1qkerae web-prod.3 nginx worker1 Running\nRunning 20 minutes\
  \ ago\n```\n\n## Stopping services\n\n万物皆有终结，运行在 swarm 中的服务也不例外。当不再需要某个服务时，可以使用\
  \ `docker service rm` 将其删除。删除服务后，与该服务关联的所有任务都会停止，容器也会从运行它们的节点中移除。下面的示例删除名为 `web`\
  \ 的服务：\n\n```\n$ docker service rm web\n```\n\nDocker 假设只有在不再需要服务时才会停止服务。因此，没有与\
  \ `docker stop` 命令对应的 Docker 服务命令。由于服务可以轻松重新创建，这可能不是问题。尽管如此，我遇到过需要暂时停止服务进行测试，但又不知道如何重新创建它的情况。\n\
  \n解决方案很简单，但不一定显而易见。与其停止服务并重新创建它，不如将副本数设置为 0。这将停止所有运行中的任务，并在需要时随时准备重新启动：\n\n```\n\
  $ docker service update --replicas 0 web\nweb\n```\n\n```\n$ docker service ls\n\
  \nID NAME REPLICAS IMAGE COMMAND\n5gdgmb7afupd web 0/0 nginx\n```\n\n任务的容器已停止，但仍保留在节点上。`docker\
  \ service ps` 命令将显示服务的所有任务都处于 `Shutdown` 状态。如果需要，可以检查节点上的容器：\n\n```\n$ docker service\
  \ ps web\nID                         NAME      IMAGE       NODE      DESIRED STATE\
  \       CURRENT STATE               ERROR\n68v6trav6cf2qgj8pg8wgcbmhu web.1    \
  \ nginx       worker1   Shutdown            Shutdown 3 seconds ago\n060wax426mtqdx79g0ulwu25r\
  \  web.2     nginx       manager   Shutdown            Shutdown 2 seconds ago\n\
  79uidx4t5rz4o7an9wtya1456  web.3     nginx       worker2   Shutdown            Shutdown\
  \ 3 seconds ago\n```\n\n当需要恢复服务时，请使用 `docker service update` 将副本数设置回所需的数量。Swarm\
  \ 将像使用 `docker service create` 一样在 swarm 中启动容器。\n\n## Upgrading a service with rolling\
  \ updates\n\n运行在 swarm 中的服务很可能需要升级。传统的升级过程涉及停止服务、执行升级，然后重新启动服务。如果一切顺利，服务将按预期启动并运行，停机时间将降至最低。否则，管理员和开发人员调试问题并恢复服务可能会导致长时间停机。\n\
  \nDocker 使在部署前测试新镜像变得容易，可以确信服务在生产环境中的表现与测试期间一样。问题是，如何在不引起用户明显停机的情况下部署升级后的服务？对于繁忙的服务，即使是几秒钟的停机也可能成问题。Docker\
  \ Swarm 提供了一种在后台更新服务的方法，实现零停机。\n\n有三个选项传递给 `docker service create` 以控制滚动更新的应用方式。这些选项也可以在创建服务后使用\
  \ `docker service update` 更改。选项如下：\n\n- `--update-delay`：此选项设置每次容器升级之间的延迟。\n  延迟由表示小时、分钟和秒的数字后跟\
  \ `h`、`m` 或 `s` 来定义。例如，30 秒的延迟写作 `30s`。1 小时 30 分钟 12 秒的延迟写作 `1h30m12s`。\n\n\n\n\n\
  \n- --update-failure-action: 这告诉 swarm 如何处理升级失败。默认情况下，如果容器升级失败，Docker Swarm 会暂停升级。你可以配置\
  \ swarm 即使任务升级失败也继续。允许的值为 pause 和 continue。\n\n- --update-parallelism: 这告诉 swarm\
  \ 一次升级多少个任务。默认情况下，Docker Swarm 每次只会升级一个任务。如果将其设置为 0（零），所有运行中的容器都会一次性升级。\n\n本示例中，使用\
  \ nginx:1.10 镜像启动了名为 web 的服务，并设置了六个副本。该服务配置为每次更新两个任务，并在更新之间等待 30 秒。docker service\
  \ ps 列出的任务显示，所有六个任务都在运行，并且都运行着 nginx:1.10 镜像：\n\n```\n$ docker service create --name\
  \ web --update-delay 30s --update-parallelism 2 --replicas 6 nginx:1.10\n```\n\n\
  ```\n$ docker service ps web\n\nID                                         NAME\
  \   IMAGE         NODE      DESIRED STATE\nCURRENT STATE               ERROR\n83p4vi4ryw9x6kbevmplgjrp4\
  \  web.1  nginx:1.10   worker2  Running\nRunning 20 seconds ago\n\n2ybltchas244tmnrpfyzik5jw\
  \  web.2  nginx:1.10   worker1  Running\nRunning 20 seconds ago\n\nf4g3nayyx5yk6x5k8xn31x8klk\
  \  web.3  nginx:1.10   worker2  Running\nRunning 20 seconds ago\n\n6axpogx5rqlg96bqt9qn822rx\
  \  web.4  nginx:1.10   worker1  Running\nRunning 20 seconds ago\n\n2d7n5nhja0efka7qy2boke813\
  \  web.5  nginx:1.10   manager  Running\nRunning 16 seconds ago\n\n5sprz723zv3z779o3zcyj28p1\
  \  web.6  nginx:1.10   manager  Running\nRunning 16 seconds ago\n```\n\n已使用 docker\
  \ service update 命令并指定新镜像启动了更新。在这种情况下，服务将从 nginx:1.10 升级到 nginx:1.11。滚动更新通过停止由 --update-parallelism\
  \ 定义的若干任务，并基于新镜像启动新任务来工作。随后，Swarm 会等待 --update-delay 设置的延迟时间过去后，再升级下一批任务：更新开始时，每次会更新两个任务。如果节点上未找到该镜像，则会从注册表拉取，这会减慢更新速度。你可以通过在运行更新之前编写脚本在每个节点上拉取新镜像来加快此过程。\n\
  \n可以通过运行 `docker service inspect` 或 `docker service ps` 来监控更新过程：\n\n```\n$ docker\
  \ service inspect --pretty web\nID: 4a6ov04ux70qdf0fzyf3s93er\nName: web\nMode:\
  \ Replicated\nReplicas: 6\nUpdate status:\nState: updating\nStarted: about a minute\
  \ ago\nMessage: update in progress\nPlacement:\nUpdateConfig:\nParallelism: 2\n\
  Delay: 30s\nOn failure: pause\nContainerSpec:\nImage: nginx:1.11\nResources:\n```\n\
  \n```\n$ docker service ps web\nID NAME IMAGE NODE DESIRED STATE\nCURRENT STATE\
  \ ERROR\n83p4vi4ryw9x6kbevmplgjrp4 web.1 nginx:1.10 worker2 Running\nRunning 35\
  \ seconds ago\n29qok95xdrb0whcdy7abvji2p web.2 nginx:1.11 manager Running\nPreparing\
  \ 2 seconds ago\n2ybltchas244tmnrpfyzik5jw \\_ web.2 nginx:1.10 worker1 Shutdown\n\
  Shutdown 2 seconds ago\nf4g3nayyx5yk6kx58xn31x8k1k web.3 nginx:1.10 worker2 Running\n\
  Running 35 seconds ago\n6axpogx5rqlg96bqt9qn822rx web.4 nginx:1.10 worker1 Running\n\
  Running 35 seconds ago\n3z6ees2748tqsoacy114ol183 web.5 nginx:1.11 worker1 Running\n\
  Running less than a second ago\n2d7n5nhja0efka7qy2boke813 \\_ web.5 nginx:1.10 manager\
  \ Shutdown\nShutdown 1 seconds ago\n5sprz723zv3z779o3zcyj28p1 web.6 nginx:1.10 manager\
  \ Running\nRunning 30 seconds ago\n```\n\n随着升级开始，web.2 和 web.3 任务已更新并现在运行 `nginx:1.11`。其他任务仍在运行旧版本。每\
  \ 30 秒，将再升级两个任务，直到整个服务都运行 `nginx:1.11`。\n\nDocker Swarm 不在意镜像标签使用的版本。这意味着你也可以同样轻松地降级服务。在这种情况下，如果在升级后运行\
  \ `docker service update --image nginx:1.10 web` 命令，swarm 将经历相同的更新过程，直到所有任务都运行 `nginx:1.10`。如果升级没有按预期工作，这会非常有帮助。\n\
  \n还需要注意的是，没有什么规定新镜像必须与旧镜像使用相同的基础。你可以通过运行 `docker service update --image httpd web`\
  \ 决定运行 Apache 而不是 Nginx。Swarm 会很乐意将所有运行 nginx 镜像的 web 任务替换为运行 `httpd` 镜像的任务。\n\n\
  滚动更新要求你的服务能够并行运行多个容器。这可能不适用于某些服务，例如 SQL 数据库。某些更新可能需要与旧版本不兼容的架构更改。无论哪种情况，滚动更新可能都不适用于该服务。在这种情况下，你可以设置\
  \ `--update-parallelism 0` 来强制所有任务一次性更新，或手动重新创建服务。如果你运行大量副本，应预先拉取镜像以减轻注册表的负载。\n\n\
  ## 将 Docker Compose 与 Swarm 一起使用\n\nDocker Compose 可以与 Docker Swarm 一起用于构建多容器应用程序。你可以配置环境以使用\
  \ swarm 中的任何节点，然后像与单个 Docker 主机通信一样使用 `docker-compose`。目前使用它存在一些严重问题。\n\n### 构建镜像\n\
  \n问题之一是镜像构建。可以使用 `docker-compose build`，但镜像只会出现在 `docker-compose` 用于构建镜像的那个节点上。在单个主机上运行时这没问题，但由于你正在运行\
  \ swarm，这可能不是你想要的。为规避此问题，有必要使用 `docker build` 手动构建镜像并将其推送到注册表。\n\n### 启动应用程序\n\n\
  使用 `docker-compose up` 和 swarm 启动应用程序与在单个主机上运行完全相同。不幸的是，Docker Compose 不使用 swarm\
  \ 来调度容器。事实上，当你尝试时，它会打印一条警告：\n\n```\n$ docker-compose up -d\nWARNING: The Docker\
  \ Engine you're using is running in swarm mode.\nCompose does not use swarm mode\
  \ to deploy services to multiple nodes in a swarm.\nAll containers will be scheduled\
  \ on the current node.\nTo deploy your application across the swarm, use the bundle\
  \ feature of the\nDocker experimental build.\nMore info:\nhttps://docs.docker.com/compose/bundles\n\
  Starting webdb_web_1\nRecreating webdb_db_1\n```\n\n容器在 swarm 节点上启动，就像你使用单个 Docker\
  \ 节点一样。使用 `docker-compose scale` 在应用程序内扩展服务也有效，但同样，额外的容器会在同一个 swarm 节点上启动。\n\n###\
  \ 打包应用程序\n\nDocker **分布式应用程序包 (DAB)** 和栈是一项实验性功能。使用 `docker-compose` 构建包的功能是在 Docker\
  \ Compose 1.8 和 Docker 1.12 中添加的。在撰写本文时，只能使用 Docker Engine 的实验版本来使用包和栈。因此，在发布之前，用于处理包的工具可能会发生重大变化。\n\
  \n构建包就像运行 `docker-compose bundle` 一样简单。将创建一个与应用程序命名空间对应的 `.dab` 文件。例如，带有 `webdb`\
  \ 命名空间的应用程序将创建名为 `webdb.dab` 的包文件。创建包文件后，可以使用它来创建栈。\n\n### 部署栈\n\n栈是在 swarm 上运行的服务和资源的集合。部署到\
  \ swarm 时，所有所需的服务都会在 swarm 节点上调度和启动。部署后，可以使用 `docker service ls` 显示运行中的服务列表：\n\n\
  ```\n$ docker deploy stackname\n```\n\n前面的命令将部署名为 `stackname` 的栈。由 `docker deploy`\
  \ 启动的所有服务都带有栈名称前缀。默认情况下，`docker deploy` 会查找与栈名称匹配的 `.dab` 文件。例如，名为 `webdb` 的栈将查找名为\
  \ `webdb.dab` 的 `.dab` 文件。可以使用 `--file` 选项指定不同的文件：\n\n```\n$ docker deploy --file\
  \ webdb.dab mystack\n```\n\n## 介绍 Docker Datacenter\n\nDocker Datacenter 是 Docker\
  \ 的商业应用程序。它由商业支持的 Docker Engine、UCP 和 DTR 组成。UCP 提供了一个基于 Web 的界面，用于在集群上运行容器和 Docker\
  \ Compose 应用程序。\n\nDocker Datacenter 不能叠加在现有的 swarm 上。相反，每个节点的添加方式类似于加入 swarm。从新集群的第一个节点，运行以下命令：\n\
  \n```\n$ docker run --rm -it --name ucp -v /var/run/docker.sock:/var/run/docker.sock\
  \ docker/ucp install -i --host-address <public ip>\n```\n\n此命令使用 `docker/ucp` 镜像执行安装。Docker\
  \ 套接字作为卷传入，以允许安装脚本启动所需的容器。`--host-address` 是用于访问 UCP 的公共 IP 地址。交互式安装会提示你输入管理密码，以便你可以登录\
  \ Web 界面。\n\n\n\n\n应用可以像使用 Docker Swarm 一样使用 Docker Compose 运行。不幸的是，与普通 swarm 类似，这里也适用类似的限制。容器都在同一节点上启动。你不会像使用\
  \ Docker Swarm 那样获得特殊的调度。你能得到的是一个很好的界面，用于查看集群状态、管理卷和网络，以及运行单个容器和完整的应用程序。\n\n创建新容器非常简单。从仪表板中，单击\
  \ **Containers** 和 **Deploy Container**。将出现一个表单，允许你设置容器名称、镜像以及容器可能需要的任何其他选项。也可以使用标准\
  \ Docker 命令行工具启动容器：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_109_0.png)\n\nDocker\
  \ Datacenter 也支持使用 Docker Compose 运行应用程序。要运行应用程序，请转到 **Applications** 并单击 **Compose\
  \ Application**。系统会提示你输入应用程序名称和 compose 文件。compose 文件可以粘贴到框中，或从桌面上的文件上传。你也可以从桌面或管理服务器使用\
  \ `docker-compose up` 来启动应用程序：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_110_0.png)\n\
  \n运行中的应用程序会显示在 **Applications** 页面。在那里，你可以缩放服务、重启容器，甚至可以访问正在运行的容器的控制台：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_111_0.png)\n\
  \n## 摘要\n\n在本章中，你了解了如何使用 Docker Swarm 来编排 Docker 集群。与单节点使用的相同工具也可以与 swarm 一起使用。swarm\
  \ 可用的其他工具允许轻松地扩展服务和滚动更新，几乎没有停机时间。在下一章中，你将了解如何使用 Kubernetes 来编排集群。\n"
- "# 使用 Kubernetes 部署和管理服务\n\nKubernetes 最初由 Google 启动，用于管理容器，并于 2014 年 6 月作为开源软件发布。其他公司也迅速加入。Kubernetes\
  \ 是 Red Hat OpenShift 3、Deis Workflow 和 fabric8 的平台即服务（PaaS）产品的后端。每天，越来越多的组织正在部署\
  \ Kubernetes 来编排其服务。\n\nKubernetes 是一个巨大的项目；无法在单个章节中涵盖其所有内容。本章将介绍你使用 Kubernetes\
  \ 开始编排容器所需的一切。完整文档可在 http://kubernetes.io/docs/ 上找到。\n\n本章将涵盖以下主题：\n\n- 安装 Kubernetes\n\
  - 运行 Pod\n- 管理部署\n- 使用滚动更新在零停机时间的情况下升级部署\n- 使用服务和负载均衡器将应用程序暴露到 Internet\n- 使用持久卷来保留容器数据\n\
  \n## 了解 Kubernetes\n\nKubernetes 是一个复杂的软件。因此，管理员需要了解许多组件。有些组件每天都会使用，而其他组件则会在后台静默工作，以保持一切正常运行。\n\
  \n## 命令行工具\n\n以下是命令行工具：\n\n- kubeadm：此工具是在 Kubernetes 1.4 中添加的，截至撰写本文时，仍被视为 alpha\
  \ 工具。它是 Linux 主机上 Kubernetes 的新安装程序。\n\n- kubectl：这是用于与运行中的集群交互的主要工具。它用于添加 Pod 和服务、执行滚动更新等。几乎所有与\
  \ Kubernetes 交互的人都会使用 kubectl。\n\n### Master 组件\n\n这些组件运行在 Master 节点上。它们负责集群的所有高级控制。以下是\
  \ Master 组件：\n\n- etcd：Kubernetes 在这里保存其集群配置。请确保对此进行备份，否则在完全重建的情况下你将无法恢复集群。\n\n\
  - kube-apiserver：API 服务器是所有与集群交互的内容的主要接入点。kubectl 工具使用它来管理服务，控制器使用它进行配置，等等。kube-apiserver\
  \ 组件是 Master 上唯一需要能够从集群外部访问的组件。它也是唯一需要连接到 etcd 的组件。\n\n- kube-controller-manager：不出所料，这管理正在运行的控制器。这包括复制控制器、节点控制器、第三方控制器和服务帐户。\n\
  \n- kube-scheduler：这调度 Pod 在集群中运行。每当新 Pod 启动或缩放时，调度器会确定在哪些节点上运行它们。\n\n### Node 组件\n\
  \nNode 组件运行在 Worker 节点上。它们控制正在运行的容器、网络和其他服务。它们如下：\n\n- **kubelet**：这是每个节点上的主处理守护程序。它负责启动容器、挂载卷、下载密钥，并保持节点作为集群的一部分。\n\
  \n- **kube-proxy**：这负责维护网络规则，并将网络请求转发到正确的位置。\n\n## 安装 Kubernetes\n\nKubernetes 可以安装在大多数云服务上，或者在你自己的硬件或虚拟机上本地安装。不出所料，由于\
  \ Kubernetes 是 Google 项目，它在 GCE 上运行效果最好，新功能倾向于首先在那里得到支持。\n\n此外，Google 推出了一项名为 **Google\
  \ Container Engine (GKE)** 的服务，它是一种预配置的 Kubernetes 服务。Google 维护 Kubernetes Master，并使添加新节点到集群变得容易。你只需要关心容器。这是开始使用\
  \ Kubernetes 的最简单方式。\n\n对于本地安装，有几种选择。第一个是随 Kubernetes 1.4 作为 Beta 工具发布的新 `kubeadm`\
  \ 工具。第二个是 `kube-up.sh` 脚本，它是 Kubernetes 发布包的一部分，可以在各种平台上安装 Kubernetes。\n\n还有其他两个值得考虑的选项。RHEL\
  \ 有一个可用的 `kubernetes` 软件包，可以使用 `yum` 安装。Rancher 容器管理套件有一个选项可自动部署 Kubernetes 环境。\n\
  \n### 使用 kubeadm 安装\n\n`kubeadm` 工具是在 Kubernetes 1.4 中引入的。目标是提供一种在任何平台上安装 Kubernetes\
  \ 的简便方法。目前，它仅支持 CentOS 7 和 Ubuntu 16.04。使用 `kubeadm` 进行安装仍然有点混乱，但这是一个令人兴奋的开始。有关更多详细信息，请参阅\
  \ http://kubernetes.io/docs/getting-started-guides/kubeadm/。\n\n### 使用 kube-up.sh\
  \ 安装\n\nGCE 是运行 Kubernetes 最受完整支持的方式。在 GCE 上运行 Kubernetes 与在任何其他地方运行之间唯一的严重区别在于外部服务如何映射到正在运行的\
  \ Pod。GCE 还会为你完成大量繁琐的工作，例如管理防火墙设置以及向集群注册新节点：\n\n```\n$ export KUBERNETES_PROVIDER=gce;\
  \ wget -O - https://get.k8s.io | bash\n```\n\n如果你不喜欢将下载的脚本直接管道到 Bash 的安全风险，或者你想更改安装选项，可以下载最新版本，解压它，然后手动运行\
  \ kube-up.sh：\n\n```\n$ cd kubernetes/cluster/\n$ export KUBERNETES_PROVIDER=gce;\
  \ ./kube-up.sh\n```\n\n该脚本将创建一个新的 Kubernetes Master 和若干 Worker 节点。完成后，它将在 ~/.kube/config\
  \ 中创建一个 kubeconfig 文件。然后你将能够使用 kubectl 与集群交互。\n\nkube-up.sh 还支持安装多个其他云提供商，包括 AWS、Azure\
  \ 和 GKE。它还可以使用 Vagrant 安装测试集群以供本地测试。有关完整列表以及如何为你的环境调整 kube-up.sh 的说明，请参阅 http://kubernetes.io/docs/getting-started-guides/binary_release/。\n\
  \n### 安装附加组件\n\nKubernetes 支持使用附加组件来扩展集群功能。最常见的是 kube-dns 和 kube-ui 附加组件，它们分别提供\
  \ DNS-SD 和集群的图形化视图。附加组件还可以用于安装不同的工具，例如用于覆盖网络的 Weave Net。可用附加组件列表可在以下网址找到：http://kubernetes.io/docs/admin/addons/。\n\
  \n## 管理资源\n\nKubernetes 中的每个资源都定义在 JSON 或 YAML 格式的文件中。这两种格式完全可以互换。YAML 通常更易于人类阅读。可以将一些资源定义在\
  \ YAML 中，其他资源定义在 JSON 中。作为最佳实践，选择一种格式并坚持使用。\n\n\n\n\n### 创建资源\n\n所有资源至少将具有两个字段：\n\
  \n- apiVersion: 这是正在使用的 API 版本。随着新功能的添加，版本可能会更改。\n- kind: 这是资源的类型。这会告知 Kubernetes\
  \ 正在创建什么类型的资源。\n\n每个资源可以定义在单独的文件中。在某些情况下，将资源合并到一个文件中是有价值的。例如，在与其暴露的服务同一文件中定义 ingress\
  \ 对象是有意义的。在这种情况下，使用单独一行上的三个短线（---）来分隔资源。以下示例演示了如何执行此操作：\n\n```\napiVersion: v1\n\
  kind: Service\nmetadata:\n  name: wp-service\n  labels:\n    app: wordpress\nspec:\n\
  \  ports:\n    - port: 443\n      name: https\n  selector:\n    app: wordpress\n\
  ---\napiVersion: extensions/v1beta1\nkind: Ingress\nmetadata:\n  name: wp-ingress\n\
  spec:\n  backend:\n    serviceName: wp-service\n    servicePort: 80\n```\n\n定义资源后，通过运行\
  \ kubectl create 将其添加到 Kubernetes。-f 标志告诉 kubectl 从给定文件读取资源定义。如果文件名是短线（-），则从 stdin\
  \ 读取资源：\n\n```\n$ kubectl create -f multi-deployment.yml\ndeployment \"multi-deploy\"\
  \ created\n```\n\n还可以通过添加 `-R` 标志并将 `-f` 设置为目录名，来指示 `kubectl create` 读取目录中的所有文件。这样可以轻松地将特定应用程序的所有资源放在一个目录中并一次性加载它们。\n\
  \nKubernetes 项目创建了一个名为 Helm 的工具，可用于打包预配置的资源。有关更多信息，请参阅 https://github.com/kubernetes/helm。\n\
  \n### 删除资源\n\n资源使用 `kubectl delete` 命令删除。最简单情况下，`kubectl delete` 使用要删除的资源的类型和名称来调用：\n\
  \n```\n$ kubectl delete service wp-service\nservice \"wp-service\" deleted\n```\n\
  \n与 `create` 命令一样，`delete` 可以使用 `-f` 标志来传入文件。文件中定义的每个资源都将被删除。`-R` 标志也可以用于删除目录中定义的每个资源。\n\
  \n### 运行 Pod\n\nKubernetes 将容器组织为 Pod。每个 Pod 是一个或多个容器的集合。Pod 可以独立于集群中运行的其他 Pod 进行复制、缩放和更新。每个\
  \ Pod 都分配了一个 IP 地址，用于连接到 Pod 中运行的容器的公开端口。必须注意确保 Pod 中的服务不尝试使用相同的端口，但这比管理 Docker\
  \ Swarm 中的端口使用要容易协调得多。\n\n### 定义 Pod\n\n**Pod** 定义一个或多个容器以及容器所需的所有卷。容器作为一个单元运行。它们一起启动和停止。它们也可以通过\
  \ localhost 相互通信。Pod 使用 YAML 或 JSON 定义并传递给 `kubectl create`。以下是一个简单的 Pod 定义：\n\n\
  ```\napiVersion: v1\nkind: Pod\nmetadata:\n name: simple\nspec:\ncontainers:\n -\
  \ name: web\n image: nginx\n ports:\n - containerPort: 80\n - containerPort: 443\n\
  ```\n\n前面的 YAML 文件定义了一个运行单个 nginx 容器的简单 Pod。name 字段设置 Pod 的名称。在此示例中，Pod 名为 simple。generateName\
  \ 字段可以代替 name 字段使用，它采用用于自动生成名称的前缀。如果您需要运行多个独立的 Pod 副本，这很有用。\n\nspec 字段是定义 Pod 容器和卷的位置。containers\
  \ 字段接受一个或多个容器的列表。前面的示例创建了一个名为 web 的单个容器。容器镜像通过 image 字段设置。这是容器仅有的两个必填字段。\n\nports\
  \ 字段定义将在 Pod IP 地址上公开的端口。这是容器中的端口，而不是将要公开的端口。设置外部端口将在本章后面的服务资源中介绍。\n\nports 字段默认使用\
  \ TCP。协议可以设置为 UDP 作为端口的附加字段。以下代码片段显示了它的样子：\n\n```\nports:\n - containerPort: 53\n\
  \ protocol: UDP\n```\n\nPod 还有很多内容无法在一章中全部介绍。有关完整详细信息，请参阅 Pod 规范：http://kubernetes.io/docs/api-reference/v1/definitions/#_v1_podspec。\n\
  \n将 Pod 规范写入文件后，可以使用 kubectl create 将其添加到 Kubernetes：\n\n```\n$ kubectl create -f\
  \ simple-pod.yml\npod \"simple\" created\n```\n\n## 查看 Pod\n\n运行 `kubectl get pods`\
  \ 可获取运行中的 Pod 列表。添加 `-o wide` 将显示 Pod 的 IP 地址以及 Pod 所在的节点：\n\n```\n$ kubectl get\
  \ pods\nNAME        READY     STATUS    RESTARTS   AGE\nsimple      1/1       Running\
  \   0          12s\n$ kubectl get pods -o wide\nNAME        READY     STATUS   \
  \ RESTARTS   AGE       IP            NODE\nsimple      1/1       Running   0   \
  \       1m        10.246.46.5   kubernetes-node-1\n```\n\nPod 的详细信息可使用 `kubectl\
  \ describe pod` 命令获取。关于运行中 Pod 的所有所需信息都显示在 `describe` 的输出中。以下命令显示名为 `simple` 的 Pod\
  \ 的详细信息：\n\n```\n$ kubectl describe pod simple\nName:               simple\nNamespace:\
  \          default\nNode:               kubernetes-node-1/10.245.1.3\nStart Time:\
  \         Wed, 05 Oct 2016 18:55:46 -0600\nLabels:             <none>\nStatus: \
  \            Running\nIP:                 10.246.46.5\nControllers:        <none>\n\
  Containers:\n  web:\n  Container ID:     docker://6460c3565b2c0d7cb356f0da2ea5e12f58017e881fb91176eaafb65b5a46bc31\n\
  \  Image:            nginx\n  Image ID:         docker://sha256:ba6bed934df2e644ffdd34e9d324c80f3c615544ee9a93e4ce3cfddfcbf84bdbdc2\n\
  \  Ports:            80/TCP, 443/TCP\n  Requests:\n    cpu:            100m\n  State:\
  \            Running\n  Started:          Wed, 05 Oct 2016 18:55:48 -0600\n  Ready:\
  \            True\n  Restart Count:    0\n  Volume Mounts:    /var/run/secrets/kubernetes.io/serviceaccount\
  \ from default-token-dlmur (ro)\n  Environment Variables: <none>\nConditions:\n\
  \  Type              Status\n  Initialized       True\n  Ready             True\n\
  PodScheduled  True\nVolumes:\n default-token-dlmur:\n  Type:  Secret (a volume populated\
  \ by a Secret)\n  SecretName:  default-token-dlmur\nQoS Class:  Burstable\nTolerations:\
  \  <none>\nEvents:\n  FirstSeen    LastSeen    Count   From                   SubobjectPath\
  \  Type      Reason          Message\n  ---------    --------    -----   ----  \
  \                 --------------  --------  ------          -------\n  7s      \
  \     7s          1       {default-scheduler }                      Normal   Scheduled\
  \    Successfully assigned simple to kubernetes-node-1\n  ...\n```\n\n## 环境变量\n\n\
  许多容器使用环境变量来配置其运行方式。`mysql` 镜像使用环境变量来初始化数据库并设置用户密码。`wordpress` 镜像使用环境变量来配置 MySQL\
  \ 数据库的位置，并在配置中设置相应的凭据。\n\n以下是一个运行 `mysql` 镜像并设置两个环境变量的 Pod 示例。第一个，`MYSQL_ROOT_PASSWORD`，设置\
  \ root 用户的密码。第二个，`MYSQL_DATABASE`，配置容器创建名为 `wordpress` 的数据库：\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: mysql\n  labels:\n    app: mysql\nspec:\n  containers:\n\
  \  - name: db\n    image: mysql:5.7\n    ports:\n    - containerPort: 3306\n   \
  \ env:\n    - name: MYSQL_ROOT_PASSWORD\n      value: password\n    - name: MYSQL_DATABASE\n\
  \      value: wordpress\n```\n\n## 多容器 Pod\n\n可以定义运行多个容器的 Pod。在将旧版应用程序迁移到 Docker\
  \ 和 Kubernetes 时，这尤其有用。\n\nPod 的一大好处是，Pod 中的每个容器都可以通过 localhost 连接到 Pod 中的任何其他容器。这使得将旧版应用程序迁移到\
  \ Kubernetes 变得相当简单。使用独立 Docker 时，每个容器都分配了自己的随机 IP 地址。除非安装了 DNS-SD 工具，否则容器可能很难相互发现。更糟糕的是，由于每个容器都有不同的\
  \ IP，必须使用单独的组件（例如 HAProxy）将它们统一在一个 IP 地址下供最终用户使用。\n\n例如，假设你有一个带 Web 界面和 SFTP 服务器的\
  \ Samba 文件服务器，用于异地访问。每个服务都通过 localhost 与其他服务通信，并可从相同的 IP 地址和主机名访问。无论用户希望使用哪个服务来访问其文件，都可以指示用户连接到\
  \ myfiles.example.com，这非常方便。\n\n通过将这些服务合并到一个 Pod 中，该应用程序几乎可以像在单个主机上一样处理。它们仍然通过 localhost\
  \ 相互通信，并且仍然可以从单个 IP 地址访问。稍后，在解耦组件并将其变为多个 Pod 的过程中，它们仍然可以统一在一个服务下。该服务被分配了单个 IP 地址，主机名可以映射到该\
  \ IP 地址。服务将在本章后面介绍。\n\n让我们来看一个启动带有 MySQL 数据库的 WordPress 的多容器 Pod 示例。此示例创建名为 multi\
  \ 的 Pod。这一次，containers 字段列出了两个容器。第一个名为 wordpress，运行官方 wordpress 镜像。第二个名为 db，运行 mysql\
  \ 镜像：\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: multi\n  labels:\n \
  \   app: wordpress\nspec:\n  containers:\n  - name: wordpress\n    image: wordpress\n\
  \    ports:\n    - containerPort: 80\n    - containerPort: 443\n    env:\n```\n\n\
  \n\n```\n- name: WORDPRESS_DB_HOST\n  value: 127.0.0.1\n- name: WORDPRESS_DB_USER\n\
  \  value: wordpress\n- name: WORDPRESS_DB_PASSWORD\n  value: password\n- name: db\n\
  \  image: mysql\n  env:\n    - name: MYSQL_ROOT_PASSWORD\n      value: password\n\
  \    - name: MYSQL_DATABASE\n      value: wordpress\n    - name: MYSQL_USER\n  \
  \    value: wordpress\n    - name: MYSQL_PASSWORD\n      value: password\n```\n\n\
  需要注意的是，本示例有几点：\n\n- 首先，`wordpress` 容器配置为在 `127.0.0.1`（即本地主机）上查找 MySQL。\n- 其次，`db`\
  \ 容器未定义任何端口。这是因为数据库不需要在 pod 的 IP 地址上暴露。\n\n唯一能连接到数据库的容器是同一个 pod 中的容器。\n\n## 使用密钥\n\
  \n上一节中的 WordPress 示例非常精彩，但所有注重安全的管理员可能都会因 pod 定义中的明文密码而心脏病发作。好消息是，Kubernetes 使将应保密的内容分离到特殊\
  \ `Secret` 类型中成为可能。密钥可用于将密码等内容排除在 pod 定义之外，也可用于在不同命名空间中提供不同的密码、SSL 证书或 SSH 密钥，而无需更改\
  \ pod 定义。\n\n## 创建密钥\n\n密钥是经过 base64 编码的字符串。在 Linux 上，可以使用 base64 工具对字符串进行编码。字符串编码后，可以将其添加到定义密钥的\
  \ YAML 或 JSON 文件中：\n\n```\n$ echo -n \"root-password\" | base64\ncm9vd2dlC1wYXNzd29yZA==\n\
  ```\n\n以下示例为前面的 WordPress 应用程序的 root 和 wordpress 用户定义了两个密码：\n\n```\napiVersion:\
  \ v1\nkind: Secret\nmetadata:\n  name: mysql-passwords\ntype: Opaque\ndata:\n  root:\
  \ cm9vd2dlC1wYXNzd29yZA==\n  wordpress: d29yZHByZXNzTmV3LXhBcmN3N3J3J3Jk\n```\n\n\
  YAML 定义了一个名为 mysql-passwords 的新密钥。密钥位于 data 部分。root 和 wordpress 键将用于从节点定义中引用密码。\n\
  \n可以使用 `kubectl describe secret` 显示密钥。呃，几乎可以。会显示带有关联标签和密钥列表的密钥对象，但密钥本身被隐藏了：\n\n\
  ```\n$ kubectl describe secret mysql-passwords\nName:         mysql-passwords\n\
  Namespace:    default\nLabels:       <none>\nAnnotations:  <none>\nType:  Opaque\n\
  Data\n====\nwordpress:  18 bytes\nroot:       13 bytes\n```\n\n需要注意的是，未加密的密钥相当容易获取。使用\
  \ `kubectl describe secret` 描述密钥时，它们会被隐藏，但拥有适当访问权限的用户可以登录使用密钥的正在运行的容器并将其打印出来。不要依赖密钥来保护密码和其他敏感信息。有关更多详细信息，请参阅\
  \ http://kubernetes.io/docs/user-guide/secrets/。\n\n### 在环境变量中使用密钥\n\n将密钥导入容器有两种方法。第一种是通过环境变量。以下是再次给出的\
  \ WordPress pod 定义。这次密码是从 mysql-passwords 密钥对象中检索的。`key` 选项指定使用 mysql-passwords\
  \ 密钥对象中的哪个密钥。相关部分已突出显示。在容器中，`*_PASSWORD` 环境变量将包含解码后的值：\n\n```\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: multi-secrets\n  labels:\n    app: wordpress\nspec:\n\
  \  containers:\n  - name: wordpress\n    image: wordpress\n    ports:\n    - containerPort:\
  \ 80\n    - containerPort: 443\n    env:\n    - name: WORDPRESS_DB_HOST\n      value:\
  \ 127.0.0.1\n    - name: WORDPRESS_DB_USER\n      value: wordpress\n    - name:\
  \ WORDPRESS_DB_PASSWORD\n      valueFrom:\n        secretKeyRef:\n          name:\
  \ mysql-passwords\n          key: wordpress\n  - name: db\n    image: mysql\n  \
  \  env:\n    - name: MYSQL_ROOT_PASSWORD\n      valueFrom:\n        secretKeyRef:\n\
  \          name: mysql-passwords\n          key: root\n    - name: MYSQL_DATABASE\n\
  \      value: wordpress\n    - name: MYSQL_USER\n      value: wordpress\n    - name:\
  \ MYSQL_PASSWORD\n      valueFrom:\n        secretKeyRef:\n          name: mysql-passwords\n\
  \          key: wordpress\n```\n\n### 在文件中使用密钥\n\n另一种选择是将密钥作为文件在容器中提供。这是通过 **卷**\
  \ 完成的。将创建一个卷，其中包含以密钥命名的文件中的解码密钥值。这对于将 SSL 证书和 SSH 密钥添加到容器很有用。应用程序可以配置为使用挂载的密钥卷，或者一个小的包装器脚本可以将文件复制到应用程序可以找到的位置。\n\
  \n以下是运行 `nginx` 的简单 pod。它创建了一个挂载到容器中 `/etc/secrets` 的卷。此示例使用与前面示例相同的 `mysql-passwords`\
  \ 密钥：\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx-secrets\nspec:\n\
  \  containers:\n  - name: nginx\n    image: nginx\n    volumeMounts:\n    - name:\
  \ secrets\n      mountPath: \"/etc/secrets\"\n      readOnly: true\n  volumes:\n\
  \  - name: secrets\n    secret:\n      secretName: mysql-passwords\n```\n\n在容器中，解码后的密钥在\
  \ `/etc/secrets` 中可用。每个密钥都存储在卷中的文件中：\n\n```\n### cd /etc/secrets/\n### ls\nroot\
  \ wordpress\n### cat root\nroot-password\n```\n\n## 登录到容器\n\n登录到容器以排查问题通常是必要的。与\
  \ `docker exec` 相同的功能在 Kubernetes 中作为 `kubectl exec` 提供。如预期，`kubectl exec` 略有不同，以考虑\
  \ pod 的概念：\n\n```\n$ kubectl exec multi-secrets -c wordpress -it bash\nroot@multi-secrets:/var/www/html#\n\
  ```\n\n此示例在 `multi-secrets` pod 的 `wordpress` 容器中启动一个 bash shell。`-i` 和 `-t` 标志的工作方式与\
  \ `docker exec` 相同，它们指示 `exec` 从 stdin 获取输入并创建一个新的 TTY。\n\n如果要运行的命令带有标志，可以在命令前加上两个破折号\
  \ (--) 。以下示例在 `multi-secrets` pod 的 `db` 容器中打开一个 MySQL shell：\n\n```\n$ kubectl\
  \ exec multi-secrets -c db -it -- mysql -u root -p\nEnter password:\nWelcome to\
  \ the MySQL monitor.  Commands end with ; or \\g.\nYour MySQL connection id is 3\n\
  Server version: 5.7.15 MySQL Community Server (GPL)\nCopyright (c) 2000, 2016, Oracle\
  \ and/or its affiliates. All rights\nreserved.\nOracle is a registered trademark\
  \ of Oracle Corporation and/or its\naffiliates. Other names may be trademarks of\
  \ their respective owners.\nType 'help;' or '\\h' for help. Type '\\c' to clear\
  \ the current input\nstatement.\nmysql>\n```\n\n如果 pod 只有一个容器，或者要连接到 pod 中的第一个容器，可以省略\
  \ `-c` 标志。即使 pod 只有一个容器，也可以使用 `-c` 以避免混淆。\n\n### 删除 pod\n\n当不再需要 pod 时，可以使用 `kubectl\
  \ delete pod` 将其删除。以下示例删除名为 `simple` 的 pod：\n\n```\n$ kubectl delete pod simple\n\
  pod \"simple\" deleted\n```\n\n## 使用部署\n\n**部署**是具有一个或多个副本的 pod 集合。它负责确保请求的 pod\
  \ 数量正在运行并在必要时重新启动它们。部署使扩展 pod 和稍后更新它们变得容易。部署取代了 `ReplicationController` 资源。\n\n\
  ### 创建单容器部署\n\nDocker 的乐趣之一是能够快速轻松地启动容器。Kubernetes 可能很复杂，但启动单个容器仍然很简单：\n\n```\n\
  $ kubectl run web --image=nginx:1.11 --replicas=2 --port=80\ndeployment \"web\"\
  \ created\n```\n\n前面的命令创建了一个名为 `web` 的新部署，运行两个 `nginx` 镜像。`--replicas` 标志可用于设置所需的副本数量。如果省略，只启动一个\
  \ pod。`--port` 标志告诉 Kubernetes 公开端口 80。`--port` 标志可以多次使用以公开其他端口。\n\n`kubectl get\
  \ deployments` 命令将显示集群中所有当前部署。在此示例中，它显示两个 pod 副本均在运行、最新且可用：\n\n```\n$ kubectl get\
  \ deployments\nNAME DESIRED CURRENT UP-TO-DATE AVAILABLE AGE\nweb 2 2 2 2 12s\n\
  ```\n\n可以使用 `kubectl get pods` 命令获取正在运行的 pod 列表。`-l` 标志将显示限制为带有给定标签的 pod。使用 `run`\
  \ 命令时，pod 会自动获得 `run=<name>` 标签，其中 `<name>` 是部署的名称。要将列表限制为仅来自名为 `web` 的 `run` 的\
  \ pod，请使用以下命令：\n\n```\n$ kubectl get pods -l run=web\nNAME READY STATUS RESTARTS\
  \ AGE\nweb-4291803130-haisr 1/1 Running 0 13m\nweb-4291803130-j7y51 1/1 Running\
  \ 0 13m\n```\n\n两个副本均在运行并准备好提供网页服务。\n\n\n\n\n\n### 创建多容器部署\n\n多容器部署要求部署定义在 YAML\
  \ 或 JSON 中。该文件指定部署名称、副本数量和 pod 规范。此相同格式也可用于单容器部署：\n\n```\napiVersion: extensions/v1beta1\n\
  kind: Deployment\nmetadata:\n  name: multi-deploy\nspec:\n  replicas: 2\n  template:\n\
  \    metadata:\n      labels:\n        app: web-deploy\n    spec:\n      containers:\n\
  \        - name: nginx\n          image: nginx:1.10.4\n        - name: mysql\n \
  \         image: mysql:5.5\n          env:\n            - name: MYSQL_ROOT_PASSWORD\n\
  \              value: password\n```\n\n该示例创建带有两个容器（nginx 和 mysql）的两个 pod。Pod 在部署定义的\
  \ template 部分中定义。它的工作方式与本章已介绍的 pod 相同。最大的区别是省略了 pod 名称。Pod 名称将基于部署名称。\n\n请注意 apiVersion。Deployment\
  \ 是一个新功能，官方仍处于 beta 阶段。规范在后续版本中可能会更改。\n\n## 扩缩部署\n\nKubernetes 使得使用 scale 命令轻松增加或减少部署中的副本数量。以下命令将名为\
  \ web 的部署扩缩至三个副本：\n\n```\n$ kubectl scale --replicas=3 deployment/web\ndeployment\
  \ \"web\" scaled\n```\n\n部署可以根据需要随意扩缩。调度器将确保在集群中启动所需的 pod。\n\n## 滚动更新\n\nKubernetes\
  \ 中的 Deployment 具有一个功能，允许部署中的所有 pod 自动更新。每当部署模板部分的 pod 规范的一部分发生更改时，都会触发更新。\n\n###\
  \ 更新部署\n\n请考虑以下包含两个容器的部署。第一个名为 web，是 nginx:1.10.1 镜像。第二个名为 db，是 mysql:5.5 镜像：\n\n\
  ```\napiVersion: extensions/v1beta1\nkind: Deployment\nmetadata:\n  name: update-deploy\n\
  spec:\n  replicas: 2\n  template:\n    metadata:\n      labels:\n        app: update-deploy\n\
  \    spec:\n      containers:\n        - name: web\n          image: nginx:1.10.1\n\
  \        - name: db\n          image: mysql:5.5\n          env:\n            - name:\
  \ MYSQL_ROOT_PASSWORD\n              value: password\n```\n\n两个容器都在运行其镜像的较旧版本。让我们先升级\
  \ web 容器：\n\n```\n$ kubectl set image deployment/update-deploy web=nginx:1.11.4\n\
  deployment \"update-deploy\" image updated\n```\n\n此命令将 update-deploy 部署中 web 容器的\
  \ image 属性设置为 nginx:1.11.4。运行该命令后立即，Kubernetes 会启动带有更新镜像的新 pod。新 pod 就绪后，会停止一个现有\
  \ pod。此过程重复，直到所有副本都更新。\n\n警告。在更新部署之前，请确保您的容器可以安全地多次运行。默认情况下，Kubernetes 执行更新所使用的机制与扩缩\
  \ pod 相同。如果您的应用程序无法运行多个副本，可以在部署定义中将更新策略类型设置为 Recreate。Kubernetes 将在启动新 pod 之前停止现有\
  \ pod。以下摘录显示如何设置部署策略：\n\n```\napiVersion: extensions/v1beta1\nkind: Deployment\n\
  metadata:\n  name: update-deploy\nspec:\n  strategy:\n    type: \"Recreate\"\n...\n\
  ```\n\n### 获取滚动更新历史\n\nKubernetes 会记住对部署所做的更改。可以通过运行 `kubectl rollout history deploy/<name>`\
  \ 命令查看修订历史记录，其中 `<name>` 是部署的名称：\n\n```\n$ kubectl rollout history deployment/update-deploy\n\
  deployments \"update-deploy\"\nREVISION          CHANGE-CAUSE\n1               \
  \  <none>\n2                 <none>\n```\n\n向历史命令添加 `--revision=N`（其中 N 是修订号）即可查看部署的完整详细信息。在以下输出中，您可以看到\
  \ `web` 容器的镜像已更新为 `nginx:1.11.4`：\n\n```\n$ kubectl rollout history deployment/update-deploy\
  \ --revision=2 deployments\n\"update-deploy\" with revision #2\nLabels:        \
  \ app=update-deploy\n                pod-template-hash=1680774371\nContainers:\n\
  web:\n  Image:        nginx:1.11.4\n  Port:\n  Volume Mounts: <none>\n  Environment\
  \ Variables: <none>\ndb:\n  Image:        mysql:5.5\n  Port:\n  Volume Mounts: <none>\n\
  \  Environment Variables:\n  MYSQL_ROOT_PASSWORD:  password\nNo volumes.\n```\n\n\
  ### 回滚更新\n\n您可能会发现，更新后出了严重问题，需要回滚更新。幸运的是，有一个非常方便的 `undo` 命令：\n\n```\n$ kubectl rollout\
  \ undo deploy/update-deploy\ndeployment \"update-deploy\" rolled back\n```\n\n不带选项时，该命令会将指定的部署回滚到历史记录中的上一个版本。`--to-revision=N`\
  \ 标志会将部署回滚到历史记录中的修订版本 `N`。\n\n### 删除部署\n\n请记住，部署的作用是确保运行所需数量的 pod。尝试通过删除 pod 来删除部署，就像西西弗斯试图将石头推上山一样。Kubernetes\
  \ 会以删除 pod 的同样速度重新创建它们。当不再需要部署时，可以使用 `kubectl delete deployment` 将其删除。请确认您要继续，因为这将删除部署中所有运行的\
  \ pod：\n\n```\n$ kubectl delete deployment web\ndeployment \"web\" deleted\n```\n\
  \n可以使用 `--cascade=false` 标志删除部署而保留 pod 运行。剩余的 pod 需要手动删除。\n\n## 使用 DaemonSets 在每个节点上运行\
  \ pod\n\n**DaemonSet** 是一种资源类型，用于确保 pod 或一组 pod 在集群中的每个节点上运行。该资源的格式与部署非常相似。`template`\
  \ 部分是一个 pod 规范，与部署一样：\n\n```\napiVersion: extensions/v1beta1\nkind: DaemonSet\n\
  metadata:\n  name: daemon\nspec:\n  template:\n    ...\n```\n\nDaemonSets 适用于运行日志记录或监控等服务。例如，您可能有类似\
  \ collectd 的服务，用于将性能数据发送到监控解决方案。\n\n还可以将 DaemonSet 限制为仅在与给定选择器匹配的一组节点上运行。例如，您的本地\
  \ Kubernetes 集群可能混合了 HP 和 Dell 的服务器硬件。您可以创建一个 DaemonSet，在硬件标签设置为 dell 的节点上运行 Dell\
  \ OpenManage 工具：\n\n```\napiVersion: extensions/v1beta1\nkind: DaemonSet\nmetadata:\n\
  \  name: omsa\nspec:\n  template:\n    spec:\n      nodeSelector:\n        hardware:\
  \ dell\n...\n```\n\n## 介绍定时作业\n\nKubernetes 1.4 引入了定时作业。这些是按计划运行的一组容器。它们类似于 Linux\
  \ 中的 Cron 作业，甚至在规范中使用 Cron 时间格式。定时作业仍被视为 alpha 版本，除非在 API 服务器启动时添加 `--runtime-config=batch/v2alpha1`\
  \ 标志，否则不可用。有关详细信息，请参阅 http://kubernetes.io/docs/user-guide/jobs/。\n\n## 使用标签\n\n\
  Kubernetes 中的几乎每个资源都可以分配标签。标签是一种组织资源的方式，但不会改变它们的操作方式。它们完全是任意的，应选择以适应您的环境。例如，您可能希望按应用程序对资源进行分组，标记当前正在测试的\
  \ pod，或指示某些 pod 只能在前端节点上运行。\n\n标签在资源的 `metadata` 部分中设置。它们是一系列键/值对。在以下示例中，pod 设置了四个标签。`app`\
  \ 标签用于表示该 pod 是 `wordpress` 应用程序的一部分。`tier` 标签表示该 pod 应在后端节点上运行。该 pod 仍在测试中，因此 `env`\
  \ 标签设置得当。最后，此示例中的 `hero` 标签用于展示标签的任意性：\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: mysql\n  labels:\n    app: wordpress\n    tier: backend\n    env: testing\n\
  \    hero: darkwing-duck\n...\n```\n\n标签本身不执行任何操作。创建资源时，Kubernetes 会记录标签并开始在集群中的某个位置调度资源。\n\
  \n### 使用选择器查找资源\n\n列出资源的所有工具都可以带 `-l` 标志使用选择器，以将列表限制为具有匹配标签的资源。本章前面已使用此方法查看由部署启动的\
  \ pod 列表：\n\n```\n$ kubectl get pods -l 'app=update-deploy'\nNAME READY STATUS RESTARTS\
  \ AGE\nupdate-deploy-1680774371-9x8qd 2/2 Running 0 23h\nupdate-deploy-1680774371-y0tbf\
  \ 2/2 Running 0 23h\n```\n\n此示例列出所有带有 `app` 键和 `update-deploy` 值的 pod。可以使用几种不同的比较运算符。将选择器用单引号括起来，以确保\
  \ shell 正确处理空格和特殊字符：\n\n| 运算符 | 描述 | 示例 |\n|---|---|---|\n| =, == | 键的值必须匹配。 | `env\
  \ = production` |\n| != | 键的值必须不匹配。 | `env != production` |\n| in | 值在一组值中。 | `env\
  \ in (testing, development)` |\n\n\n\n\n\n| 操作符 | 描述 | 示例 |\n|---|---|---|\n| notin\
  \ | 值不在一组值中。 | env notin (testing, development) |\n| label | 资源是否有该标签？值被忽略。 | app\
  \ |\n| !label | 没有给定标签的资源。值被忽略。 | !app |\n| ,（逗号） | 连接多个查询。所有查询都必须匹配。 | env in (production,\
  \ testing), app=website |\n\nKubernetes 中有一些资源使用标签。例如，服务资源会将与选择器匹配的 Pod 分组，以实现负载均衡和外部访问。每当创建与服务所查找内容匹配的\
  \ Pod 时，它会自动被添加到该组中。\n\n> 有关使用标签和选择器的完整详细信息，请参阅 http://kubernetes.io/docs/user-guide/labels/。\n\
  \n## 使用命名空间\n\nKubernetes 使用 **命名空间** 作为运行中的 Pod 组及其关联卷、服务和控制器之间的逻辑分隔。默认情况下，Kubernetes\
  \ 有两个命名空间：\n\n- kube-system：用于运行 Kubernetes 服务和插件的容器\n- default：其他所有内容都运行在此处\n\n\
  命名空间可用于为开发和生产环境、两个业务单元甚至多个客户提供不同的环境。还可以为每个命名空间定义资源限制。\n\n### 查看命名空间\n\n可以列出当前配置的命名空间。使用\
  \ kubectl get namespaces 命令：\n\n```\n$ kubectl get namespaces\nNAME\t\tSTATUS\t\
  AGE\ndefault\t\tActive\t3h\nkube-system\tActive\t3h\n```\n\n可以使用 kubectl describe\
  \ namespace 显示特定命名空间的详细信息。这包括命名空间的总配额以及各个实体的资源限制：\n\n```\n$ kubectl describe namespace\
  \ default\nName: default\nLabels: <none>\nStatus: Active\nNo resource quota.\nResource\
  \ Limits\nType Resource Min Max Default Request Default\nLimit Max Limit/Request\
  \ Ratio\n-------------------------\nContainer cpu - - 100m -\n-\n```\n\n### 创建命名空间\n\
  \n新命名空间在 YAML 文件中定义。此示例创建名为 production 的命名空间：\n\n```\napiVersion: v1\nkind: Namespace\n\
  metadata:\n  name: production\n```\n\n然后将命名空间定义文件传递给 kubectl create：\n\n```\n$ kubectl\
  \ create -f production-ns.yml\nnamespace \"production\" created\n```\n\n### 切换命名空间\n\
  \n创建命名空间后，可以对该命名空间执行操作。对于一次性更改，可以将 `--namespace` 选项传递给 `kubectl`：\n\n```\n$ kubectl\
  \ --namespace=kube-system get pods\nNAME                              READY   STATUS\
  \    RESTARTS   AGE\nheapster-v1.2.0-3649594813-4zdoy   0/4     Pending   0    \
  \      4h\nkube-dns-v19-zmals                  3/3     Running   0          4h\n\
  kube-proxy-kubernetes-node-1        1/1     Running   0          3h\nkubernetes-dashboard-v1.4.0-pbhe2\
  \   1/1     Running   0          4h\nmonitoring-influxdb-grafana-v4-zc7x4 2/2  \
  \ Running   0          4h\n```\n\n如果计划在一个命名空间中做大量工作，最好创建一个上下文。此示例创建一个名为 `production`\
  \ 的上下文，它使用 `production` 命名空间：\n\n```\n$ kubectl config set-context production --namespace=production\n\
  context \"production\" set.\n```\n\n如果集群和用户名不同，可以使用 `--cluster` 和 `--user` 标志为上下文设置集群和用户名。设置上下文后，需要时可以轻松切换到它。以下示例切换到\
  \ `production` 上下文。现在，使用 `kubectl` 运行的每个命令都将在 production 命名空间中：\n\n```\n$ kubectl\
  \ config use-context production\nswitched to context \"production\".\n```\n\n###\
  \ 删除命名空间\n\n命名空间可以是临时沙箱，也可以是长期运行的环境。无论你使用命名空间做什么，可能都需要删除一个。以下命令将删除 `production`\
  \ 命名空间：\n\n```\n$ kubectl delete namespace production\nnamespace \"production\"\
  \ deleted\n```\n\n在删除命名空间之前，请深呼吸。这样做会销毁该命名空间中的所有内容，包括 Pod、服务和卷。在删除之前，请确保命名空间中没有任何重要内容。\n\
  \n## 网络\n\nKubernetes 中的网络与直接使用 Docker 不同，IP 地址是按 Pod 而非按容器分配的。这允许 Pod 内的容器通过 localhost\
  \ 相互连接。它还允许它们作为一个服务运行。这与传统服务器模型更为相似，而大多数 Docker 工具则不然。此外，Kubernetes 为应用程序提供自动负载均衡工具，并可以与大多数云提供商合作，使用其现有的负载均衡器提供外部访问。\n\
  \nKubernetes 需要使用覆盖网络来允许 Pod 在集群之间通信。它支持 GCE、Weave、Flannel、OpenVSwitch 等，无论是开箱即用还是通过插件。DNS-SD\
  \ 也可以通过 kube-dns 插件开箱即用，但可以使用其他服务代替。\n\n### 服务\n\nKubernetes 为每个 Pod 分配一个 IP 地址，但每次重启\
  \ Pod 时该地址都会更改。此外，分配给 Pod 的 IP 是私有地址，集群外部无法访问。如果要使应用程序公开，这两者都没有帮助。解决方案是服务。\n\n服务提供负载均衡，并在服务存在期间维护静态\
  \ IP 地址。Pod 可以重启、更新或缩放，服务将跟踪它们并适当路由流量。这是通过选择器实现的。\n\n### 创建服务\n\n如前所述，Pod 和 Deployment\
  \ 可以分配标签。服务使用这些标签来确定将流量发送到哪些 Pod。让我们来看一个示例：\n\n```\napiVersion: extensions/v1beta1\n\
  kind: Deployment\nmetadata:\n  name: wp\nspec:\n  replicas: 1\n  template:\n   \
  \ metadata:\n      labels:\n        app: wordpress\n    spec:\n      containers:\n\
  \      - name: wordpress\n        image: wordpress\n        ports:\n          -\
  \ containerPort: 80\n          - containerPort: 443\n...\n```\n\n这是用于 WordPress\
  \ 安装的精简 Deployment。请注意，标签 `app` 已设置为 `wordpress`。现在，让我们看看此应用程序的服务：\n\n```\napiVersion:\
  \ v1\nkind: Service\nmetadata:\n  name: wp-service\n  labels:\n    app: wordpress\n\
  spec:\n  type: LoadBalancer\n  ports:\n    - port: 80\n      name: http\n    - port:\
  \ 443\n      name: https\n  selector:\n    app: wordpress\n```\n\n这里有几点需要注意。`ports`\
  \ 部分列出了此服务将暴露的所有端口。如果端口与使用 `containerPort` 设置的端口匹配，则无需其他操作。否则，可以将 `targetPort` 字段添加到\
  \ `port` 条目中，指定容器正在监听的端口。以下示例展示如何将服务中的端口 80 发送到 Pod 中的端口 5000：\n\n```\nports:\n\
  \  - port: 80\n    name: http\n    targetPort: 5000\n```\n\n`selector` 字段是配置服务以了解要为哪些\
  \ Pod 提供服务的地方。在此示例中，服务正在查找 `app` 标签设置为 `wordpress` 的 Pod 或 Deployment。命名空间中出现的任何与选择器匹配的新\
  \ Pod 都会自动添加到服务中。\n\n> 确保服务的选择器不重叠。重叠将是 *糟糕* 的。如果重叠，将会发生争用，并且你的应用程序可能会出现在多个服务中。例如，你的\
  \ WordPress 服务可能会突然显示你的会计应用程序。\n\nType 字段告诉 Kubernetes 如何暴露此服务：\n\n- **ClusterIP**：这是默认类型。它从预配置池中为服务分配一个\
  \ IP。该地址几乎总是私有的，仅可从集群内部访问。如果你的服务只为 Kubernetes 中的其他应用程序提供服务，请使用此类型。\n- **NodePort**：这会在集群中的每个节点上分配一个\
  \ 30,000 到 32,767 之间的随机端口。发送到该节点的任何请求都将转发到服务针对的 Pod。可以在端口条目上使用 `nodePort` 选项设置特定端口。该端口必须仍在配置范围内。如果你想运行自己的负载均衡器，`NodePort`\
  \ 类型很有用。\n- **LoadBalancer**：这将启动云特定的负载均衡器来处理服务的流量。\n\n服务的内容远多于此处所能涵盖的。有关更多详细信息，请参阅\
  \ `http://kubernetes.io/docs/user-guide/services/`。\n\n### 列出服务\n\n运行 `kubectl get\
  \ service` 可获取服务列表。列表将显示服务、集群 IP 和外部 IP 地址（如果已分配）：\n\n```\n$ kubectl get service\n\
  NAME            CLUSTER-IP    EXTERNAL-IP   PORT(S)          AGE\nkubernetes   \
  \   10.3.240.1    <none>        443/TCP          2h\nwp-service      10.3.242.67\
  \   104.154.253.227 80/TCP, 443/TCP  1h\n```\n\n还可以运行 `kubectl describe service`\
  \ 并指定服务名称来获取服务的详细描述。描述包括集群 IP、端口列表和入口端口：\n\n```\n$ kubectl describe service wp-service\n\
  Name:                     wp-service\nNamespace:                default\nLabels:\
  \                   app=wordpress\nSelector:                 app=wordpress\nType:\
  \                     LoadBalancer\nIP:                       10.3.242.67\nLoadBalancer\
  \ Ingress:     104.154.253.227\nPort:                     http    80/TCP\nNodePort:\
  \                 http    31342/TCP\nEndpoints:                10.0.2.3:80\nPort:\
  \                     https   443/TCP\n```\n\n\n\n\n\nNodePort:           https\
  \ 30763/TCP\nEndpoints:         10.0.2.3:443\nSession Affinity:  None\nNo events.\n\
  \n### 介绍 DNS-SD\n\nKubernetes 自带一个名为 kube-dns 的插件，用于提供 DNS-SD。在 Kubernetes 的近期版本中，此功能默认启用。服务会被分配名称。预期如果\
  \ Pod 需要相互通信，它们将通过服务来进行。\n\n生成的主机名采用 `service_name.namespace.svc.cluster.local`\
  \ 形式，其中 `service_name` 是服务的名称，`namespace` 是服务所在的命名空间。例如，在 `prod` 命名空间中名为 `wordpress`\
  \ 的服务将拥有一条 `wordpress.prod.svc.cluster.local` 的 A 记录。\n\n## 使用卷\n\n与原生 Docker 类似，Kubernetes\
  \ 支持卷。主要区别在于 Kubernetes 在 Pod 级别支持卷。这意味着在 Pod 中配置的卷对 Pod 中的每个容器均可用，并可用于读写。其次，Kubernetes\
  \ 卷可同时使用多种不同类型的网络存储。\n\n卷分为两种形式，第一种是 **临时卷**，它仅在使用它的 Pod 存在期间保留。当 Pod 被删除时，卷也会随之删除。第二种是\
  \ **持久卷**，即使 Pod 被删除，它也能持久保留数据。\n\n### 使用普通卷\n\nKubernetes 中的卷行为与原生 Docker 中的卷非常相似。它们预计仅在使用它们的\
  \ Pod 存在期间保留。Pod 中的每个容器都可以挂载该卷，并且可以在相同或不同的位置挂载。唯一限制是卷不能挂载在从其他卷挂载的文件系统上。换句话说，卷不能嵌套：\n\
  \n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: web\nspec:\n  volumes:\n\
  \    - name: test\n      gcePersistentDisk:\n        pdName: test-pd\n        fsType:\
  \ ext4\n  containers:\n    - name: nginx\n      image: nginx\n      volumeMounts:\n\
  \        - mountPath: /mnt\n          name: test\n```\n\n这是一个使用名为 test-pd 的 GCE\
  \ 持久磁盘的简单 Pod。卷在 volumes 部分定义。可以在那里定义所需数量的卷。nginx 容器将卷挂载在 /mnt。volumeMounts 中的名称必须与\
  \ volumes 中的名称匹配。\n\n卷的选项将根据磁盘类型而有所不同。请注意，许多类型的网络存储必须在作为卷使用之前已存在。有关更多详细信息，请参阅 http://kubernetes.io/docs/user-guide/volumes/。\n\
  \n### 在持久卷中存储长期数据\n\n顾名思义，持久卷是持久的。它们设计为在 Pod 被删除后仍然保留，并可由另一个 Pod 再次使用。通常，数据库及类似系统使用持久卷来存储数据。无论出于何种原因（例如更新后）重启\
  \ Pod，数据都会在那里等待它。\n\n持久卷分为两部分。第一部分是 PersistentVolume 对象，它存储正在使用的物理存储的连接详细信息。第二部分是\
  \ PersistentVolumeClaim，它告诉 Kubernetes 将来会有某物想要使用该存储。带有声明的 Pod 基本上有权使用那块存储。\n\n\
  你可以将其类比为剧院的门票。PersistentVolume 对象是剧院中的一个座位。PersistentVolumeClaim 对象是允许进入剧院并坐在座位上的门票。\n\
  \n持久卷还允许一定程度地将卷与 Pod 抽象分离。PersistentVolume 对象存储访问物理存储的所有详细信息。Pod 无需关心这些信息。它只需使用\
  \ PersistentVolumeClaim 对象来访问存储。\n\n### 创建 PersistentVolume\n\n让我们先创建一个 `PersistentVolume`\
  \ 对象。它使用与前面卷示例相同的 GCE 持久磁盘：\n\n```yaml\napiVersion: v1\nkind: PersistentVolume\n\
  metadata:\n  name: test-pd\n  labels:\n    name: test-pd\nspec:\n  capacity:\n \
  \   storage: 10Gi\n  accessModes:\n    - ReadWriteOnce\n  persistentVolumeReclaimPolicy:\
  \ Retain\n  gcePersistentDisk:\n    pdName: test-pd\n    fsType: ext4\n```\n\n`spec`\
  \ 部分中发生的有趣事情如下：\n\n- 如果一个 Pod 对已经有写入声明的持久卷声明写入访问权限，则第二个声明将被拒绝。如果尝试对仅允许只读访问的卷获取写入访问权限，声明也会被拒绝。\n\
  - 接下来，`accessModes` 决定 Pod 允许声明的访问类型。继续使用剧院类比，这就像说 Pod 可以在主楼层或阳台获得门票。可设置三种模式：\n\
  \  - ReadWriteOnce：仅单个节点可以以读写方式挂载此存储\n  - ReadOnlyMany：多个节点可以以只读方式挂载此存储\n  - ReadWriteMany：多个节点可以以读写方式挂载此存储\n\
  - 首先，定义存储容量；在此示例中为 10 GiB。可以预先创建多个不同大小的存储块，并让 Pod 声明其所需大小。\n- 第三是 `persistentVolumeReclaimPolicy`。此设置决定在声明释放时对卷执行什么操作。有三个可能的值。请注意，并非每种存储类型都支持每种回收策略：\n\
  \  - Retain：对卷不执行任何操作。如果不再需要卷，由集群管理员将其删除。\n  - Recycle：物理存储保留，但 Kubernetes 会在再次使其可用之前对卷尝试\
  \ `rm -rf *`。\n  - Delete：当声明释放时，卷将被删除。\n\n最后一个字段配置存储。在此示例中，为名为 `test-pd` 的 GCE\
  \ 持久磁盘。这将根据正在使用的存储而有所不同。\n\n### 创建 PersistentVolumeClaim 资源\n\n在任何 Pod 可以使用 `PersistentVolume`\
  \ 资源之前，必须先创建 `PersistentVolumeClaim` 资源：\n\n```yaml\napiVersion: v1\nkind: PersistentVolumeClaim\n\
  metadata:\n  name: test-pd-pvc\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n\
  \    requests:\n      storage: 10Gi\n  selector:\n    matchLabels:\n      name:\
  \ test-pd\n```\n\n此示例创建一个名为 `test-pd-pvc` 的声明。`accessModes` 规范告诉 Kubernetes 此声明仅用于此\
  \ Pod 的写入访问权限。`resources` 部分表示此声明正在查找至少 10 GiB 的卷。实际映射到此声明的卷可能更大，但不会更小。最后，`selector`\
  \ 匹配 `PersistentVolume` 上的标签。在此示例中，声明正在查找名称标签为 `test-pd` 的持久卷。\n\n声明可能匹配多个卷。如果是这种情况，Kubernetes\
  \ 确定提供的最接近匹配的卷将被使用。如果你试图连接到特定卷，请在持久卷上使用声明可以匹配的唯一标签。\n\n### 将 PersistentVolumeClaim\
  \ 用作卷\n\n当 Pod 想要使用持久卷时，声明会列在 Pod 规范的 volumes 部分中。以下是之前的 nginx Pod。这次，它使用 PersistentVolumeClaim\
  \ 来访问卷：\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: web-pvc\nspec:\n\
  \  volumes:\n    - name: test-pd\n      persistentVolumeClaim:\n        claimName:\
  \ test-pd-pvc\n  containers:\n    - name: nginx\n      image: nginx:1.11\n     \
  \ volumeMounts:\n        - mountPath: /mnt\n          name: test-pd\n```\n\n卷类型是\
  \ persistentVolumeClaim。claimName 属性必须与先前创建的 PersistentVolumeClaim 匹配。与之前的普通卷一样，Pod\
  \ 中的卷名称（此处为 test-pd）在容器定义中用于将存储挂载到容器中。\n\n![](img/02bead9c8ff4515f78dac0eb33163961_144_0.png)\n\
  \n> 使用 PersistentVolumes 还可以做很多其他事情，包括为 Pod 动态配置卷。有关更多详细信息，请参阅：http://kubernetes.io/docs/user-guide/persistent-volumes/。\n\
  \n\n\n\n## 进一步阅读\n\n无论本章多么详尽，它只是触及了 Kubernetes 能力的表面。以下是未涵盖的一些功能列表：\n\n- **Ingress\
  \ 资源**：Ingress 资源是一种与服务协同工作的新型负载均衡器抽象。它为 Web 应用程序提供了更精细的路由，包括基于主机和基于路径的路由。参阅 http://kubernetes.io/docs/user-guide/ingress/。\n\
  \n- **Kubernetes 控制面板**：Kubernetes 随附 kube-ui 插件，该插件提供了一个用于查看集群和快速创建新 Pod 及其他资源的控制面板。参阅\
  \ http://kubernetes.io/docs/user-guide/ui/。\n\n- **Pod 资源限制**：可以在命名空间级别设置每个 Pod\
  \ 和每个容器的 CPU 和内存限制。参阅 http://kubernetes.io/docs/admin/limitrange/。\n\n- **配额**：配额可以在项目级别应用，以确保\
  \ Pod 的总数或资源用量不超过限制。参阅 http://kubernetes.io/docs/admin/resourcequota/。\n\n- **批处理作业**：Job\
  \ 是一种预期会运行并终止的资源类型。多个作业可以并行运行。参阅 http://kubernetes.io/docs/user-guide/jobs/。\n\n\
  - **健康检查**：Kubernetes 有能力针对容器运行健康检查，以验证其是否正常运行。参阅 http://kubernetes.io/docs/user-guide/liveness/。\n\
  \n## 摘要\n\n在本章中，你学习了如何安装 Kubernetes 和创建资源。你学习了如何创建 Pod 以及如何将其与 Deployment 配合使用以实现复制和更新。讨论了\
  \ DNS-SD 和服务等网络功能，并展示了如何创建负载均衡器以使服务可通过 Internet 访问。最后，讨论了卷，你学习了如何使用 PersistentVolume\
  \ 使数据跨 Pod 可用。下一章将探讨如何使用 Apache Mesosphere 作为 Docker 编排平台。\n"
- "# 使用 Mesosphere\n\nApache Mesos 是一个分布式内核。它允许你在一组服务器上工作，就像它们是一个单一资源一样。Mesosphere\
  \ 和 DC/OS 在此基础上构建，为运行任何工作负载（包括 Docker 容器）提供了一个强大的系统。对 Cassandra 和 Jenkins 等分布式工作负载以及\
  \ Docker 的原生支持，构成了一个强大的组合。\n\nMicrosoft 的 Azure 容器服务（ACS）基于 DC/OS。2016 年 3 月，Mesosphere\
  \ 将 DC/OS 开源，使入门比以往任何时候都更容易。\n\n本章将探讨使用 Mesosphere 来管理和部署基于 Docker 的应用程序。它将涵盖部署、缩放和升级新应用程序。它还将展示如何使用带有\
  \ Marathon 负载均衡功能的内置覆盖网络。最后，本章将介绍使用卷来持久化数据以及如何使用私有镜像仓库。\n\n本章将涵盖以下主题：\n\n- 安装 Mesos\
  \ 和 DC/OS\n- 管理容器和应用程序\n- 缩放应用程序\n- 使用健康检查\n- 缩放应用程序\n- 使用零停机升级更新应用程序\n- 连接到 Mesos\
  \ 覆盖网络\n- 使用虚拟 IP 和 Marathon 负载均衡器\n- 使用本地卷和外部卷\n- 使用私有镜像仓库\n\n## 开始使用 DC/OS\n\n\
  安装 DC/OS 是一个在此处不予详述的复杂过程，且说明因环境而异。在开始此过程之前，请务必阅读文档。有些功能（例如主节点的数量或外部持久存储）必须在安装时启用，以后若不重新安装便无法更改。安装说明可在\
  \ https://dcos.io/docs/1.8/administration/installing/ 查阅。\n\n让 Mesosphere 运行起来最简单的方法是在\
  \ AWS 上使用堆栈安装，或使用运行 Mesosphere 的 ACS。\n\n如果你是手动安装或在本地硬件上安装，需要注意以下几点：\n\n- 节点必须至少拥有两个内核或虚拟处理器。\n\
  - DC/OS 节点必须运行 CoreOS 7、RHEL 7 或 CoreOS。\n- 集群中的所有节点必须启用 NTP。NTP 服务器在 /etc/systemd/timesyncd.conf\
  \ 中设置。设置 NTP 服务器后，运行 systemctl enable systemd-timedated.service 和 systemctl start\
  \ systemd-timedated.service 以启用并启动 systemd 内部 NTP 客户端。以下是用于 GCE 的 timesyncd.conf\
  \ 示例：\n\n```\n[Time]\nNTP=time1.google.com time2.google.com\ntime3.google.com time4.google.com\n\
  FallbackNTP=0.pool.ntp.org 1.pool.ntp.org\n0.fr.pool.ntp.org\n```\n\n## 登录 Web 界面\n\
  \n安装 DC/OS 后，即可使用 Web 界面登录。Mesosphere 使用 OAuth 进行 Google、GitHub 或 Microsoft 账户身份验证。登录后，你将被引导至\
  \ Mesosphere **控制面板**。在那里，你可以开始管理应用程序或安装命令行客户端 `dcos`：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_148_0.png)\n\
  \n## 安装 DC/OS 客户端\n\n安装 DC/OS 后，登录网站。在左下角，弹出菜单中有一个标记为 **安装 CLI** 的链接。点击此链接后打开的窗口中有适用于\
  \ Windows、OS X 和 Linux 的客户端安装说明：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_149_0.png)\n\
  \n客户端也可以手动安装。在 Linux 上，安装命令如下：\n\n```\n$ wget -O dcos\nhttps://downloads.dcos.io/binaries/cli/linux/x86-64/dcos-1.8/dcos\n\
  $ chmod +x dcos\n$ sudo cp dcos /usr/local/bin/\n$ dcos config set core.dcos_url\
  \ https://m1.dcos\n```\n\n将 URL 中的版本号更改为与主服务器版本匹配的版本。在本示例中，它是 1.8。最后一条命令配置 DC/OS\
  \ 主服务器的位置。将传递给 `dcos config` 的 URL 更改为适合你环境的适当地址。如果你没有有效的 SSL 证书，`dcos` 可以配置为忽略验证：\n\
  \n```\n$ dcos config set core.ssl_verify false\n```\n\n安装 dcos 后，即可登录：\n\n```\n\
  $ dcos auth login\n```\n\n现在在浏览器中访问以下链接：\n\n```\nhttps://m1.dcos/login?redirect_uri=urn:ietf:wg:oauth:2.0:oob\n\
  ```\n\n输入身份验证令牌：\n\n转到指示的 URL。DC/OS 将尝试通过 https://auth0.com/ 使用 OAuth 2 对你进行身份验证。复制令牌并将其粘贴到\
  \ shell 中。你现在应该已登录并准备好使用命令行。\n\n## 管理应用程序\n\nMesos 集群使用 dcos 工具和 Web 界面进行管理。Mesos\
  \ 中的应用程序由 Marathon 调度器处理，并以 JSON 格式定义。\n\n### 运行简单应用程序\n\n让我们从运行 Nginx 的简单容器开始。创建一个名为\
  \ nginx.json 的文件，包含以下定义：\n\n```\n{\n    \"id\" : \"simple-nginx\",\n    \"instances\"\
  \ : 1,\n    \"cpus\" : 0.25,\n    \"mem\" : 64.0,\n    \"container\" : {\n     \
  \   \"type\" : \"DOCKER\",\n        \"docker\" : {\n            \"image\" : \"nginx:1.11\"\
  ,\n            \"network\" : \"HOST\"\n        }\n    }\n}\n```\n\nid 标签是服务的名称。它在服务列表中显示。instances\
  \ 标签告诉 Marathon 只需要一个实例。以后可以根据需要增加或减少。\n\n`cpus` 和 `mem` 标签是 Marathon 所需 CPU 百分比和\
  \ RAM 用量的提示。它们不会在 Docker 中实际设置资源限制。但是，Marathon 可能会终止使用超过分配资源的任务。在此示例中，应用程序请求 25%\
  \ 的 CPU 和 64 MB 的 RAM。在应用程序创建后，若不重新部署应用程序，则无法更改这些设置。\n\n`container` 标签是定义 Docker\
  \ 容器的位置。因为这是 Docker 容器，`type` 标签设置为 `DOCKER`。镜像在 `image` 标签中设置。这与将传递给 `docker run`\
  \ 的镜像名称相同。\n\n最后，`network` 标签设置为 `HOST`，这告诉 Docker 引擎使用主机网络。本章后面将使用其他网络类型，但目前这足够了。\n\
  \n使用 `dcos marathon app add nginx.json` 启动服务。如果一切顺利，该命令不会产生任何输出。否则，将显示错误。使用 `dcos\
  \ marathon app list` 验证应用程序是否正在运行：\n\n```\n$ dcos marathon app list\nID        \
  \        MEM   CPUS   TASKS   HEALTH  DEPLOYMENT  CONTAINER  CMD\n/simple-nginx\
  \     64    0.25   1/1     ---     ---         DOCKER     None\n```\n\nNginx 正在运行，但你如何访问它呢？由于使用了主机网络，你可以将\
  \ Web 浏览器指向容器运行所在节点的外部 IP 地址。主机地址可在 Web 界面的服务详细信息中查看，或通过运行 `dcos marathon app show\
  \ simple-nginx` 获取。\n\n### 停止应用程序\n\n可以使用 `dcos marathon app stop` 命令停止服务而不将其从 Marathon\
  \ 中移除。Marathon 将创建一个部署，将服务缩放为零个任务。Web 界面将此称为**挂起**应用程序：\n\n```\n$ dcos marathon\
  \ app stop simple-nginx\nCreated deployment e5be6896-f593-4a32-852f-30bd98551a0e\n\
  $ dcos marathon app list\nID                MEM   CPUS   TASKS   HEALTH  DEPLOYMENT\
  \  CONTAINER  CMD\n/simple-nginx     64    0.25   0/0     ---     ---         DOCKER\
  \     None\n```\n\n\n\n\n## 删除应用程序\n\n当服务不再需要时，可以使用 `dcos marathon app remove` 将其移除。应用程序不必停止即可移除。Marathon\
  \ 会停止运行中的容器，并从列表中移除应用程序：\n\n```\n$ dcos marathon app remove simple-nginx\n```\n\n\
  ## 强制 Marathon 拉取镜像\n\n在集群中运行容器时最大的问题之一，就是确保正在运行的镜像是最新的。请记住，Docker 缓存的镜像是从注册表下载的。如果容器使用\
  \ `nginx` 镜像启动，而发布了修复安全漏洞的新版本，该主机上的容器将继续运行存在漏洞的版本。\n\nMarathon 提供 `forcePullImage`\
  \ 选项，强制节点在每次启动应用程序时都拉取新镜像。它位于容器规范的 `docker` 部分中。以下示例演示其工作原理：\n\n```\n\"docker\"\
  \ : {\n    \"image\" : \"nginx:latest\",\n    \"forcePullImage\" : true\n}\n```\n\
  \n确保您的注册表能够处理负载。如果有大量拉取镜像的应用程序启动，则可能会使注册表不堪重负。\n\n## 使用环境变量\n\n某些 Docker 镜像需要使用环境变量才能运行。例如，官方\
  \ MySQL 镜像使用它们来设置初始 root 密码。Marathon 使用 `env` 标签将环境变量传递给任务。在此示例中，正在设置环境变量 `MYSQL_ROOT_PASSWORD`\
  \ 和 `MYSQL_DATABASE`：\n\n```\n{\n    \"id\": \"/mysql\",\n    \"instances\": 1,\n\
  \    \"cpus\": 1,\n    \"mem\": 1024,\n    \"env\": {\n        \"MYSQL_ROOT_PASSWORD\"\
  : \"password\",\n        \"MYSQL_DATABASE\": \"mydb\"\n    },\n    \"container\"\
  : {\n        \"docker\": {\n            \"image\": \"mysql:5.7\",\n            \"\
  forcePullImage\": true,\n            \"network\": \"HOST\"\n        }\n    }\n}\n\
  ```\n\n## 缩放应用程序\n\nMarathon 使调整应用程序任务数量变得非常容易。这不仅允许扩展以应对增加的负载，还允许进行蓝绿部署，这将在本章后面介绍。\n\
  \n假设有一个名为 nginx 的应用程序正在运行一个实例。要将其增加到两个实例，只需运行 dcos marathon app update：\n\n```\n\
  $ dcos marathon app update nginx instances=2\nCreated deployment 8dbf3d16-44d3-4478-9366-9743658dcfcd\n\
  ```\n\n此示例将实例数设置为两个。同样，应用程序也可以扩展或缩减。Marathon 会尝试启动或停止所需的实例数量，以满足新要求。\n\n请确保您的应用程序支持运行多个实例。特别是数据库，对其他进程更改其文件的反应不佳。\n\
  \n## 检查应用程序健康状况\n\nMarathon 与 Kubernetes 非常相似，支持为服务设置一个或多个健康检查选项，以确保其在可用于处理请求之前运行正常。有运行自定义检查命令、检查\
  \ TCP 连接或检查特定路径 HTTP 状态的选项。\n\n### 使用 TCP 和 HTTP 检查\n\n以下是 MySQL 的 TCP 检查示例。`protocol`\
  \ 选项指示这是 TCP 检查。`portNumber` 定义要连接的端口。或者，可以将其替换为 `portIndex`，它将检查应用程序定义中 `ports`\
  \ 或 `portDefinition` 列表的索引。索引从零开始，因此第一个条目是 0，第二个条目是 1，依此类推：\n\n```\n\"healthChecks\"\
  : [\n{\n\"protocol\": \"TCP\",\n\"portNumber\": 3306,\n\"gracePeriodSeconds\": 300,\n\
  \"intervalSeconds\": 60,\n\"timeoutSeconds\": 20,\n\"maxConsecutiveFailures\": 3\n\
  }\n]\n```\n\n有许多可用于每种检查类型的设置，如下所示：\n\n- `gracePeriodSeconds`: 在抛出错误前等待的秒数。它允许 MySQL\
  \ 等需要启动时间的容器在抛出错误前完成初始化。如果在宽限期结束前检查通过，应用程序会立即标记为健康。\n- `intervalSeconds`: 检查之间等待的秒数。\n\
  - `timeoutSeconds`: 如果在指定的秒数内没有响应，则检查失败。\n- `maxConsecutiveFailures`: 如果健康检查连续失败指定次数且没有成功，则任务会被终止并重启。\n\
  - `taskKillGracePeriodSeconds`: 当任务失败次数过多时，Marathon 会发送 `SIGTERM` 信号。如果在经过指定秒数后任务仍未停止，Marathon\
  \ 将发送 `SIGKILL` 任务。默认为三秒。\n\nHTTP 和 HTTPS 协议检查给定路径的 HTTP 状态码。可以设置 `path` 选项，它定义要测试的路径。默认值为\
  \ /。HTTP 和 HTTPS 检查还使用前面描述的 `portNumber` 和 `portIndex` 选项。HTTPS 协议用于检查启用 SSL 的网站。它不检查\
  \ SSL 证书的有效性。\n\n默认情况下，只有 200-399 范围内的状态码被视为健康。您可以通过将 `ignoreHttp1xx` 设置为 `true`\
  \ 来配置检查以忽略 100-199 的状态码。其他所有状态码都被视为失败。\n\n### 使用命令检查\n\n也可以使用自定义命令检查健康状态。如果命令以真值退出，则检查被视为成功，通常在\
  \ sh 中为 0。其他任何情况都被视为失败。以下示例向应用程序添加命令检查：\n\n```\n{\n  \"id\" : \"nginx-health\",\n\
  \  \"instances\" : 1,\n  \"cpus\" : 0.25,\n  \"mem\" : 64.0,\n  \"labels\" : {\n\
  \    \"HAPROXY_GROUP\" : \"external\"\n  },\n  \"container\" : {\n    \"type\" :\
  \ \"DOCKER\",\n    \"docker\" : {\n      \"image\" : \"nginx\",\n      \"network\"\
  \ : \"BRIDGE\",\n      \"portMappings\" : [\n        {\n          \"hostPort\" :\
  \ 0,\n          \"containerPort\" : 80,\n          \"servicePort\" : 80,\n     \
  \     \"name\" : \"web\"\n        }\n      ]\n    }\n  },\n  \"upgradeStrategy\"\
  \ : {\n    \"minimumHealthCapacity\" : 1,\n    \"maximumOverCapacity\" : 1\n  },\n\
  \  \"healthChecks\" : [\n    {\n      \"protocol\" : \"COMMAND\",\n      \"command\"\
  \ : {\n        \"value\" : \"your_check_health_command.sh\"\n      }\n    }\n  ]\n\
  }\n```\n\n命令传递给 /bin/sh -c \"”。命令中的任何双引号都必须转义。为使事情更加复杂，转义字符（\\）也必须转义。包含双引号组件的命令类似于以下内容：\n\
  \n```\n\"healthChecks\" : [\n  {\n    \"protocol\" : \"COMMAND\",\n    \"command\"\
  \ : {\n      \"value\" : \"your_check_health_command.sh \"Foo\"\"\n    }\n  }\n\
  ]\n```\n\n## 部署滚动更新\n\n现有应用程序使用 dcos marathon update 进行更新。此命令之前用于调整应用程序实例数量。它也可用于更新应用程序以使用新镜像：\n\
  \n```\n{\n  \"id\" : \"nginx\",\n  \"instances\" : 1,\n  \"cpus\" : 0.25,\n  \"\
  mem\" : 64.0,\n  \"container\" : {\n    \"type\" : \"DOCKER\",\n    \"docker\" :\
  \ {\n      \"image\" : \"nginx:1.10\",\n      \"network\" : \"HOST\"\n    }\n  }\n\
  }\n```\n\n这是一个简单的 Nginx 应用程序。\n\n请注意，镜像标签设置为 nginx:1.10。碰巧 1.11 已发布，现在是时候更新应用程序了。有两种方法可以做到这一点。\n\
  \n最简单的方法是在 Web 界面中编辑应用程序。在 **容器设置** 中，将 **容器镜像** 改为 `nginx:1.11` 并单击 **部署更改**。将创建一个新部署，该部署将创建运行\
  \ `nginx:1.11` 镜像的新任务并结束旧任务：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_157_0.png)\n\
  \n第二种方法是使用 `dcos marathon update`。如果应用程序已在 JSON 文件中定义，此方法效果最佳。创建新文件或编辑定义 Nginx 应用程序的现有文件。将镜像标签更改为\
  \ `nginx:1.11`：\n\n```\n{\n  \"id\" : \"nginx\",\n  \"instances\" : 1,\n  \"cpus\"\
  \ : 0.25,\n  \"mem\" : 64.0,\n  \"container\" : {\n    \"type\" : \"DOCKER\",\n\
  \    \"docker\" : {\n      \"image\" : \"nginx:1.11\",\n      \"network\" : \"HOST\"\
  \n    }\n  }\n}\n```\n\n\n文件更改后，可以将其传递给 `dcos`：\n\n```\n$ dcos marathon app update\
  \ nginx < nginx-1.11.json\nCreated deployment 2c28f5db-0fcd-4605-9d5b-b1abd5986579\n\
  ```\n\n同样，Marathon 将使用更新后的镜像替换旧任务。部署完成后，可以验证应用程序是否正在运行新镜像：\n\n```\n$ dcos marathon\
  \ app show nginx | grep image\n\"image\": \"nginx:1.11\",\n```\n\n## 设置升级策略\n\n\
  应用程序可以定义升级策略以控制如何替换应用程序任务。默认情况下，Marathon 会在停止旧任务之前启动所有新任务。这可能会出于两个原因造成问题：\n\n- 首先，如果应用程序无法处理多个任务向同一卷写入数据，则更新可能会损坏数据\n\
  - 其次，您需要有足够的容量来运行所有这些额外任务\n\n为解决此问题，Marathon 允许为应用程序设置 `upgradeStrategy`：\n\n```\n\
  \"upgradeStrategy\": {\n\"minimumHealthCapacity\": 1\n}\n```\n\n`minimumHealthCapacity`\
  \ 选项是 0 到 1 之间的值。设置为 1 时，新实例在停止旧实例之前启动。设置为 0 时，所有旧实例在新实例启动之前停止。这解决了第一个问题。从技术上讲，它也解决了第二个问题，但当实例数量过低，无法为尝试访问它的客户端提供服务时，可能会出现明显的停机时间。\n\
  \n为在尽量减少对客户端影响的情况下平滑更新应用程序，`minimumHealthCapacity` 可以设置为 0 到 1 之间的分数。此值表示将应用程序缩减到的运行实例百分比。例如，如果有十个实例且\
  \ `minimumHealthCapacity` 设置为 `0.4`（40% 容量），应用程序将缩减到四个实例，并启动六个新实例。超过 `0.5` 的任何值意味着升级需要额外容量。如果新实例没有错误，其余旧实例将关闭，新实例将启动以取代它们。\n\
  \n## 使用蓝绿部署测试更新\n\n内置更新机制非常适合自动部署应用程序的新版本。但是，在某些情况下，可能需要更缓慢地推出更新以验证不会对最终用户产生影响。如果更新带来重大变化，这尤其有用。\n\
  \n蓝绿部署是用新版本（称为绿色）缓慢替换旧应用程序（称为蓝色）。在 Marathon 中，此手动过程是通过创建使用更新镜像的新应用程序来完成的。为新应用程序指定一个标题，使其明显是新应用程序。\n\
  \n绿色应用程序启动少量任务，通常只有一个。一旦健康检查显示一切就绪，绿色应用程序将被添加到服务的负载均衡器。假设有较多数量的旧蓝色任务正在运行，大多数请求将发送到那里。不过，少量请求将发送到绿色应用程序。\n\
  \n一旦请求开始发送到绿色应用程序，就可以监控可能需要回滚的错误或其他问题。随着测试通过，绿色应用程序可以扩展，蓝色应用程序可以缩减。这是一个可以花费所需时间的手动过程。在选择扩展绿色应用程序之前，等待数小时或数天并不罕见。如果出现问题，绿色应用程序可以缩减或完全从负载均衡器中删除。\n\
  \n当您确信绿色应用程序已完全准备好投入生产时，绿色应用程序可以扩展到所需的任务数量，蓝色应用程序可以缩减到零并从负载均衡器中删除。此时，应用程序已完全升级。一旦明确不再需要蓝色应用程序进行回滚，就可以将其从系统中删除。\n\
  \n有关蓝绿部署及其脚本化的更多信息可在此处查阅：https://mesosphere.github.io/marathon/docs/blue-green-deploy.htm\
  \ 1.\n\n## 介绍 Pod\n\n随着 1.9 版本的发布，DC/OS 引入了 Pod。DC/OS 和 Marathon 中的 Pod 与 Kubernetes\
  \ 中的 Pod 非常相似。它们允许将多个容器分组到单个对象中。所有容器可以共享卷并通过 localhost 相互通信。\n\n## 使用网络服务和负载均衡\n\
  \nMesosphere 提供多种网络服务，使编排更加容易。这些服务为运行中的应用程序提供服务发现和负载均衡。\n\n## 使用 DNS 发现服务\n\n创建的每个服务都会在\
  \ Mesos DNS 中分配一个主机名。条目为 service-name.marathon.mesos，其中 service-name 是 id 字段中的服务名称。以下片段来自\
  \ id 设置为 simple-nginx 的服务。Mesos DNS 将创建名为 simple-nginx.marathon.mesos 的记录：\n\n```\n\
  {\n  \"id\" : \"simple-nginx\",\n  ...\n}\n```\n\n因为服务直接翻译为 DNS 主机名，存在一些限制，如下所示：\n\
  \n- 首先，名称只能包含字母、数字和短划线 (-)。\n- 其次，名称必须短于 24 个字符。较长的名称会被缩短。如果两个服务最终具有相同的主机名，这可能会导致问题。一个服务中运行的任务可能会被返回给另一个服务。\n\
  \n还可以使用 REST API 通过 HTTP 查询 DNS 服务。条目以 JSON 格式返回。以下示例获取 simple-nginx 服务的 IP 信息：\n\
  \n```\n$ curl http://master.mesos:8123/v1/hosts/simple-nginx.marathon.mesos\n[\n\
  \  {\n    \"host\": \"simple-nginx.marathon.mesos.\",\n    \"ip\": \"10.128.0.4\"\
  \n  }\n]\n```\n\n## 连接到覆盖网络\n\n迄今，示例使用了主机网络。DC/OS 在安装时创建 Docker 覆盖网络。将应用程序连接到覆盖网络可启用负载均衡以及跨网络连接其他服务的功能：\n\
  \n```\n{\n\"id\" : \"nginx-overlay\",\n\"instances\" : 1,\n\"cpus\" : 0.25,\n\"\
  mem\" : 64.0,\n\"container\" : {\n\"type\" : \"DOCKER\",\n\"docker\" : {\n\"image\"\
  \ : \"nginx\",\n\"network\" : \"USER\"\n}\n},\n\"ipAddress\":{\n\"networkName\"\
  :\"dcos\"\n}\n}\n```\n\n前面的示例创建了一个名为 nginx-overlay 的服务，该服务连接到覆盖网络。network 标签设置为\
  \ USER，networkName 标签设置为覆盖网络的名称，在此例中为 dcos。\n\n## 使用虚拟 IP\n\nMarathon 可以将基于名称的虚拟\
  \ IP 分配给服务。虚拟 IP 为其附加的服务提供四层负载均衡。集群中的任务随后可以使用虚拟 IP 访问服务。\n\n若要添加虚拟 IP，请在 Web 界面中单击服务，然后单击\
  \ **编辑** 按钮。转到 **网络** 部分。选择 **虚拟网络**。这与将服务连接到覆盖网络相同。输入 **容器端口**、**名称** 和 **协议**，然后单击\
  \ **负载均衡** 旁边的复选框。如果需要更多端口，请单击 **添加端点** 链接。完成后，单击 **部署更改**：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_162_0.png)\n\
  \n服务将被分配一个如 `service-name.marathon.14lb.thisdcos.discovery` 的名称，其中 `service-name`\
  \ 是服务的名称。对于名为 `nginx` 的服务，名称是 `nginx.marathon.14lb.thisdcos.discovery`。随后可以在集群中的任何位置使用虚拟\
  \ IP 访问该服务：\n\n```\n$ curl nginx.marathon.14lb.thisdcos.discovery:80\n<!DOCTYPE\
  \ html>\n<html>\n...\n```\n\n## 使用 Marathon 负载均衡器\n\nMarathon 提供名为 Marathon-LB 的第二个负载均衡器。它是基于\
  \ HAProxy 的服务，可以处理多个服务，并可根据 Web 服务的主机名进行代理。Marathon-LB 是通过 DC/OS 包管理器安装的插件：\n\n\
  ```\n$ dcos package install marathon-lb\nWe recommend a minimum of 0.5 CPUs and\
  \ 256 MB of RAM available for the\nMarathon-LB DC/OS Service.\nContinue installing?\
  \ [yes/no] yes\nInstalling Marathon app for package [marathon-lb] version [1.4.1]\n\
  Marathon-lb DC/OS Service has been successfully installed!\nSee https://github.com/mesosphere/marathon-lb\
  \ for documentation.\n```\n\n`dcos` 命令将安装 Marathon-LB。默认情况下，安装配置为提供外部请求。负载均衡器在 DC/OS\
  \ 中显示为名为 marathon-lb 的服务。\n\n将新服务添加到负载均衡器非常简单。以下是运行 nginx 的服务：\n\n```\n{\n  \"id\"\
  \ : \"nginx-mlb\",\n  \"instances\" : 1,\n  \"cpus\" : 0.25,\n  \"mem\" : 64.0,\n\
  \  \"labels\" : {\n    \"HAPROXY_GROUP\" : \"external\"\n  },\n  \"container\" :\
  \ {\n    \"type\" : \"DOCKER\",\n    \"docker\" : {\n      \"image\" : \"nginx\"\
  ,\n      \"network\" : \"BRIDGE\",\n      \"portMappings\" : [\n        {\n    \
  \      \"hostPort\" : 0,\n          \"containerPort\" : 80,\n          \"servicePort\"\
  \ : 10001,\n          \"name\" : \"web\"\n        }\n      ]\n    }\n  },\n  \"\
  upgradeStrategy\": {\n    \"minimumHealthCapacity\": 1,\n```\n\n\n\n```\n\"maximumOverCapacity\"\
  : 1\n}\n}\n```\n\nHAPROXY_GROUP 标签告诉 Marathon，该服务将使用外部 HAProxy 组，该组由 marathon-lb\
  \ 服务提供。\n\n其他重要设置位于 portMappings 列表中。此示例定义了一个要通过负载均衡器公开的单个端口。containerPort 是容器正在监听的端口。hostPort\
  \ 是容器将在主机上监听的端口。如果缺失或设置为 0，容器将被分配一个随机端口。即使设置为 0，也需要 hostPort，以便在集群外部提供容器的服务。\n\n\
  最后，servicePort 是负载均衡器上将为该应用程序提供服务的端口。在此示例中，外部客户端将通过端口 10001 连接到负载均衡器以访问此应用程序。在实践中，将使用外部负载均衡器（例如\
  \ AWS 上的 ELB）来提供从标准端口到负载均衡器中配置的端口的映射。\n\n默认情况下，Marathon-LB 配置为使用服务端口 10000 到 10100、80\
  \ 和 443。任何将使用此负载均衡器的服务都必须从这些端口中为 servicePort 选择一个可用端口。请确保端口不重叠。\n\n可以运行多个负载均衡器。但是，负载均衡器在节点上以主机模式运行，这意味着只能运行与工作节点数量相同的负载均衡器。\n\
  \n运行其他负载均衡器非常简单。首先，创建一个名为 options.json 的文件，包含以下内容：\n\n```\n{\n\"marathon-lb\": {\n\
  \t\"name\": \"marathon-lb-internal\",\n\t\"haproxy-group\": \"internal\",\n\t\"\
  bind-http-https\": false,\n\t\"role\": \"\"\n}\n}\n```\n\nname 选项是新服务的名称。haproxy-group\
  \ 选项设置 HAProxy 组。此组是要放入服务中的 HAPROXY_GROUP 标签。Marathon 将使用与组匹配的任意负载均衡器。通过运行以下命令创建新的负载均衡器：\n\
  \n```\n$ dcos package install --options=lb-options.json marathon-lb\nWe recommend\
  \ a minimum of 0.5 CPUs and 256 MB of RAM available for the\nMarathon-LB DCOS Service.\n\
  Continue installing? [yes/no] yes\n```\n\n如果有可用资源，负载均衡器将启动并准备好处理请求。\n\n## 提供持久存储\n\
  \n运行像这样的临时容器固然很好，但更复杂的工作负载需要某种形式的额外存储。DC/OS 和 Marathon 提供了两个选项。第一个是本地存储，它仅在任务启动的节点上可用。第二个是外部卷，它们在集群中的任何位置都可用。\n\
  \n> 在撰写本文时，卷被视为实验性功能。该功能可能会更改。\n\n## 使用本地卷\n\n本地持久卷是分配在节点上的数据块，在应用程序升级和重启后仍然存在。由于卷位于单个节点上，应用程序固定到该节点，并始终在该节点上启动。这意味着数据始终可用于应用程序，但也意味着如果该节点消失，应用程序将无法启动。以下示例演示如何添加本地卷：\n\
  \n```\n{\n \"id\" : \"nginx-volume\",\n \"instances\" : 1,\n \"cpus\" : 0.25,\n\
  \ \"mem\" : 64.0,\n \"container\" : {\n \"type\" : \"DOCKER\",\n \"docker\" : {\n\
  \ \"image\" : \"nginx\",\n \"network\" : \"USER\"\n },\n \"volumes\" : [\n {\n \"\
  containerPath\" : \"website\",\n \"mode\" : \"RW\",\n \"persistent\" : {\n \"size\"\
  \ : 20\n }\n }\n ],\n \"ipAddress\" : {\n \"networkName\" : \"dcos\"\n },\n \"residency\"\
  : {\n \"taskLostBehavior\": \"WAIT_FOREVER\"\n }\n }\n```\n\n此示例创建一个具有本地持久卷的应用程序。卷在容器定义中使用\
  \ `volumes` 块创建。卷的路径由 `containerPath` 设置。路径不能包含正斜杠 (`/`) 。在容器内，卷将在 `/mnt/mesos/sandbox/containerPath`\
  \ 中可用。在此示例中，`website` 卷将是 `/mnt/mesos/sandbox/website`。\n\n`mode` 选项只能是 `RW`，它赋予容器对卷的读写访问权限。随着卷功能的开发，可能会添加其他模式。`persistent`\
  \ 块仅有 `size` 选项，用于定义要分配的空间大小（以 MiB 为单位）。\n\n最后，必须定义一个 `residency` 块，并将 `taskLostBehavior`\
  \ 设置为 `WAIT_FOREVER`。这向 Marathon 表明该应用程序是有状态的。\n\n某些应用程序不允许更改数据所在的路径。这对 MySQL 等应用程序可能是个问题。由于无法指定特定路径，Marathon\
  \ 有解决办法。诀窍是指定第二个卷：\n\n```\n{\n\"id\" : \"nginx-volume\",\n\"instances\" : 1,\n\"\
  cpus\" : 0.25,\n\"mem\" : 64.0,\n\"container\" : {\n\"type\" : \"DOCKER\",\n\"docker\"\
  \ : {\n\"image\" : \"nginx\",\n\"network\" : \"USER\"\n},\n\"volumes\" : [\n{\n\
  \    \"containerPath\" : \"website\",\n    \"mode\" : \"RW\",\n    \"persistent\"\
  \ : {\n        \"size\" : 20\n    }\n},\n{\n    \"containerPath\" : \"/var/lib/www\"\
  ,\n    \"mode\" : \"RW\",\n    \"hostPath\" : \"website\"\n}\n],\n\"ipAddress\"\
  \ : {\n    \"networkName\" : \"dcos\"\n},\n\"residency\" : {\n    \"taskLostBehavior\"\
  \ : \"WAIT_FOREVER\"\n}\n}\n```\n\n此示例扩展了前一个示例，将 `website` 卷挂载到 `/var/lib/www`。\n\
  第二个卷使用 `hostPath`，它与持久卷的 `containerPath` 匹配。由于使用了 `hostPath`，`containerPath` 可以指向容器文件系统中的任何位置。存储在卷上的数据同时可用于\
  \ `/mnt/mesos/sandbox/website` 和 `/var/lib/www`。\n\n### 使用外部卷\n\n本地持久卷最大的缺点是数据被困在单个节点上。如果该节点失败，数据将不再可访问。外部卷允许应用程序在运行应用程序的节点之外存储数据。应用程序可以在集群中的任何位置启动，并仍然访问其数据。\n\
  \nMesosphere 使用 REX-Ray 来管理对外部存储的访问。REX-Ray 支持 Amazon EC2、GCE、OpenStack 等。支持的存储驱动程序的完整列表可在\
  \ `https://rexray.readthedocs.io/en/v0.3.3/user-guide/storage-providers/` 上查看。\n\
  \n安装 Mesosphere 时必须启用外部存储。配置在安装包的 `genconf/config.yaml` 中启用。具体细节将取决于使用的驱动程序。以下是\
  \ GCE 的示例：\n\n```\nrexray_config:\n  rexray:\n    loglevel: info\n    modules:\n\
  \      default-admin:\n        host: tcp://127.0.0.1:61003\n    storageDrivers:\n\
  \      - gce\n    gce:\n      keyfile: /path/to/gce-auth.json\n```\n\n可以在 `storageDrivers`\
  \ 部分中设置多个存储驱动程序。每个存储驱动程序将有自己的配置部分。对于 GCE，`keyfile` 是 API 门户中的 JSON 格式凭据。\n\n以下示例展示如何使用外部卷。provider\
  \ 的唯一选项是 `dvdi`，并将 `dvdi/driver` 选项设置为 `rexray`。`name` 的值是存储提供商中卷的名称。在以下示例中，`testpd`\
  \ 卷将从存储提供商加载：\n\n```\n{\n  \"id\" : \"nginx-volume\",\n  \"instances\" : 1,\n  \"\
  cpus\" : 0.25,\n  \"mem\" : 64.0,\n  \"container\" : {\n    \"type\" : \"DOCKER\"\
  ,\n    \"docker\" : {\n      \"image\": [\"nginx\"],\n      \"network\" : \"USER\"\
  \n    }\n  },\n  \"volumes\" : [\n    {\n      \"containerPath\" : \"website\",\n\
  \      \"mode\" : \"RW\",\n      \"external\" : {\n        \"size\" : 200,\n   \
  \     \"name\" : \"testpd\",\n        \"provider\" : \"dvdi\",\n        \"options\"\
  \ : {\n          \"dvdi/driver\" : \"rexray\"\n        }\n      }\n    }\n  ]\n\
  }\n],\n\"ipAddress\" : {\n\"networkName\" : \"dcos\"\n},\n\"residency\": {\n\"taskLostBehavior\"\
  : \"WAIT_FOREVER\"\n}\n}\n```\n\n本地卷的卷命名规则也适用于外部卷。如果卷要挂载到特定路径，则必须使用第二个卷，如前面所示。\n\
  \nMesosphere 只允许应用程序的单个实例挂载特定外部卷。任务可以缩减到零。卷将持续存在，并在应用程序重新扩展时准备好使用。\n\n使用外部持久卷时，还需牢记以下几点：\n\
  \n- 销毁关联的集群时，卷不会被销毁。您需要负责卷清理。\n- 对于某些提供程序，在特定区域或区中创建的映像仅可供在同一区域或区中运行的主机使用。\n- 确保卷名称是唯一的，以避免冲突。\n\
  - 请确保使用兼容版本的 Docker。REX-Ray 文档建议使用 Docker 1.10.2 或更高版本。\n\n## 使用私有注册表\n\nMesosphere\
  \ 有能力使用私有 Docker Registry 来存放镜像。镜像可以从本地注册表中拉取，方法与使用 Docker 相同；使用注册表地址后跟镜像名称。例如，要使用\
  \ registry.example.com 上的 myapp 镜像，您将镜像设置为 registry.example.com/myapp。\n\n也可以在 Mesosphere\
  \ 集群上托管私有注册表。注册表可以使用主机网络设置，也可以将 VIP 或 Marathon-LB 用作负载均衡器。以下示例创建了一个使用 Marathon-LB\
  \ 的不安全注册表：\n\n\n\n {\n  \"id\" : \"registry\",\n  \"cpus\" : 0.5,\n  \"mem\" : 128,\n\
  \  \"instances\" : 1,\n  \"labels\" : {\n    \"HAPROXY_GROUP\" : \"external\"\n\
  \  },\n  \"container\" : {\n    \"type\" : \"DOCKER\",\n    \"docker\" : {\n   \
  \   \"network\" : \"BRIDGE\",\n      \"image\" : \"registry:2\",\n      \"portMappings\"\
  \ : [\n        {\n          \"containerPort\" : 5000,\n          \"hostPort\" :\
  \ 0,\n          \"servicePort\" : 10003\n        }\n      ]\n    },\n    \"volumes\"\
  \ : [\n      {\n        \"containerPath\" : \"registry\",\n        \"mode\" : \"\
  RW\",\n        \"persistent\" : {\n          \"size\" : 2048\n        }\n      }\n\
  \    ]\n  },\n  \"env\" : {\n    \"STORAGE_PATH\" : \"/mnt/mesos/sandbox/registry\"\
  \n  },\n  \"residency\" : {\n    \"taskLostBehavior\": \"WAIT_FOREVER\"\n  }\n }\n\
  \n本示例不使用 TLS 密钥来保护注册表。如需使用它们，必须使用 --insecure-registry 标志配置 Docker 守护进程。证书可以通过卷添加。然后可以使用\
  \ REGISTRY_HTTP_TLS_CERTIFICATE 和 REGISTRY_HTTP_TLS_KEY 环境变量分别设置证书和密钥的路径。\n\n在前面的示例中，注册表存储在卷上。STORAGE_PATH\
  \ 环境变量用于配置注册表使用该位置。虽然本示例使用本地持久卷，但应为注册表设置外部卷。注册表不应依赖于在特定节点上运行。\n\n有关运行私有注册表的更多详细信息，请参阅\
  \ DC/OS 文档以及位于 https://dcos.io/docs/1.8/usage/tutorials/registry/ 和 https://hub.docker.com/_/registry/\
  \ 的注册表文档。\n\n## Summary\n\n本章介绍了使用 Mesosphere 管理应用程序的基础知识。演示了如何创建应用程序、对其进行扩展、在不停机的情况下进行升级以及删除它们。还展示了如何使用内置负载均衡器以及如何运行私有注册表。下一章将介绍其他不太知名的编排工具，包括\
  \ CoreOS Fleet 和 Rancher Cattle。\n"
- "# 使用更简单的编排工具 – Fleet 和 Cattle\n\nDocker Swarm、Kubernetes 和 Mesosphere 是 Docker\
  \ 编排领域的主要参与者，但远非唯一选择。在某些情况下，它们过于复杂。本章将介绍另外两种选择——Fleet 和 Cattle。每种工具都有其自身的优势和劣势。Fleet\
  \ 是一种低级别工具，非常适合小型环境或作为其他工具的基础。Cattle 是一套功能齐全的编排工具集，比 Kubernetes 或 Mesosphere 更简单易用。\n\
  \n本章将涵盖以下主题：\n\n- 使用 Fleet\n  - 安装 Fleet\n  - 使用 `fleetctl` 启动、停止和移除服务\n  - 使用 Fleet\
  \ 单元文件中的环境变量来配置容器\n  - 为高可用性设置服务亲和性和反亲和性\n  - 使用 sidekick 服务\n  - 运行全局服务\n- 使用 Rancher\
  \ Cattle\n  - 安装 Rancher Server、代理和客户端\n  - 使用 `rancher-compose` 管理应用程序堆栈\n  - 执行零停机升级\n\
  \  - 配置运行状况检查\n  - 使用内置的 DNS 发现和负载均衡服务\n\n## 使用 Fleet\n\nFleet 由 CoreOS 公司开发，用于管理\
  \ CoreOS 集群中的容器。它是一种低级别工具，其他工具可以在此基础上构建。Fleet 的限制大约为 100 个节点和 1,000 个服务。话虽如此，对于小型集群，它可以提供足够的编排来满足组织的需求。它还可以为构建内部流程提供坚实基础。\n\
  \n像所有 Docker 编排工具一样，Fleet 需要一个覆盖网络。CoreOS 预安装了 Flannel，但可以使用任何 Docker 覆盖网络。这包括 Docker\
  \ 原生覆盖网络和 Weave Net。覆盖网络在第 3 章“集群构建块 – 注册表、覆盖网络和共享存储”中有所描述。需要注意的是，Flannel 和 Fleet\
  \ 均不提供任何形式的服务发现。如果需要该功能，可以改用提供服务发现的覆盖网络，例如 Weave Net。\n\n### 启动 Fleet\n\n由于 Fleet\
  \ 是由 CoreOS 开发的，因此使用它是最简单的方法。如第 1 章“使用 Docker 编排入门”中所述，CoreOS 的 Linux Container\
  \ 是专门为运行容器而设计的 Linux 发行版。它在启动时使用 Cloud-Init 配置整个系统。这包括 Fleet。\n\nFleet 使用 etcd 来存储集群配置并进行通信。第\
  \ 3 章“集群构建块 – 注册表、覆盖网络和共享存储”介绍了如何在 CoreOS 上为 Flannel 覆盖网络设置 etcd。Fleet 使用完全相同的过程。所需要做的就是确保在\
  \ cloud-config 文件中启用了 Fleet：\n\n```\n#cloud-config\n\ncoreos:\n  etcd2:\n    discovery:\
  \ https://discovery.etcd.io/<token>\n    advertise-client-urls:\n    http://$private_ipv4:2379,http://$private_ipv4:4001\n\
  \    initial-advertise-peer-urls: http://$private_ipv4:2380\n    listen-client-urls:\n\
  \    http://0.0.0.0:2379,http://0.0.0.0:4001\n    listen-peer-urls: http://$private_ipv4:2380\n\
  \  flannel:\n    public_ip: $private_ipv4\n    etcd_endpoints: http://$private_ipv4:2379\n\
  \  fleet:\n    public_ip: $private_ipv4\n    etcd_servers: http://$private_ipv4:2379\n\
  \    units:\n    - name: etcd2.service\n      command: start\n    - name: fleet.service\n\
  \      command: start\n    - name: flanneld.service\n      command: start\n    drop-ins:\n\
  \    - name: 50-networking-config.conf\n      content: |\n        [Service]\n  \
  \      ExecStartPre=/usr/bin/etcdctl set\n        /coreos.com/network/config\n \
  \       '{\"Network\":\"10.42.0.0/16\"}'\n    - name: docker.service\n      command:\
  \ start\n      drop-ins:\n      - name: 40-flannel.conf\n        content: |\n  \
  \      [Unit]\n        Requires=flanneld.service\n        After=flanneld.service\n\
  ```\n\n这是第 3 章“集群构建块 – 注册表、覆盖网络和共享存储”中的示例 cloud-config 文件，其中配置了确保 CoreOS 启动时启动 fleet\
  \ 服务的部分，已加以突出显示。\n\n对于新集群，请将 <token> 替换为由 `wget -qO - 'https://discovery.etcd.io/new?size=3'`\
  \ 生成的令牌，其中 size 是集群中的初始主机数量。如果要添加主机，请使用集群中原始主机所用的相同令牌。\n\n### 验证集群\n\n节点启动后，有两个命令可用于验证所有节点是否正在正常通信。首先，使用\
  \ etcdctl cluster-health 确保 etcd 可以看到集群中的所有节点：\n\n```\n$ etcdctl cluster-health\n\
  member 577728b97424518 is healthy: got healthy result from\nhttp://172.17.8.103:2379\n\
  member 82f8a69dac8afeb3 is healthy: got healthy result from\nhttp://172.17.8.102:2379\n\
  member d263b74b628b0458 is healthy: got healthy result from\nhttp://172.17.8.101:2379\n\
  cluster is healthy\n```\n\n本示例来自一个三节点集群。etcdctl 的输出将列出集群中的每个主机及其状态。重要的是最后一行，它显示集群状态正常。\n\
  \n另一个命令是 fleetctl list-machines。此命令将列出集群中的每台机器以及已在其上设置的任何元数据：\n\n```\n$ fleetctl\
  \ list-machines\nMACHINE\t\tIP\t\tMETADATA\n86bceaea...\t172.17.8.103\t-\n9c07271b...\t\
  172.17.8.102\t-\nabc0cfa4...\t172.17.8.101\t-\n```\n\nfleetctl 工具使用 SSH 与集群中的其他节点通信。请确保你的公钥位于每个服务器上的\
  \ ~/.core/.ssh/authorized_keys 中。它还要求你运行一个 SSH-agent。你可以通过将 -A 传递给 ssh 命令，使用自己桌面上现有的代理。例如，ssh\
  \ -A core@core-01 将以 core 用户身份连接到 core-01 服务器，并将现有代理转发到服务器。这样就可以使用自己的 SSH 密钥，而无需将私钥复制到所有\
  \ Fleet 节点。请注意，这是一个潜在的安全漏洞。\n\nFleet 中的服务由 systemd 单元文件定义。这些文件的工作方式与 systemd 中的任何其他单元文件相同，但有一些\
  \ Fleet 特定的扩展，允许跨集群调度服务。让我们从一个简单的 nginx 服务开始。\n\n在当前工作目录中创建名为 nginx.service 的文件，内容如下：\n\
  \n```\n[Unit]\nDescription=Nginx\nAfter=docker.service\nRequires=docker.service\n\
  \n[Service]\nTimeoutStartSec=infinity\nExecStartPre=-/usr/bin/docker kill nginx\n\
  ExecStartPre=-/usr/bin/docker rm nginx\nExecStartPre=-/usr/bin/docker pull nginx\n\
  ```\n\n\n\n\n\n```\nExecStart=/usr/bin/docker run --name nginx -p 80:80 nginx\n\
  ExecStop=/usr/bin/docker stop nginx\n```\n\n[Unit] 部分设置服务的描述和一些元信息。Description 选项是对服务的简短、自由形式的描述。After\
  \ 选项\n告诉 Fleet 该服务必须在 Docker 之后启动。因为在没有 Docker 的情况下运行 Docker 容器没有意义，因此设置了 Requires\
  \ 选项。对于 After 和\nRequires，值均为 systemd 单元的名称。可以通过添加更多 After 或 Requires 行，或向现有行添加更多单元（用空格分隔）来向两者添加其他单元。\n\
  \n[Service] 部分中设置的启动服务所需的步骤。TimeoutStartSec 选项是等待服务启动的秒数。如果服务在超时窗口内未完成启动，Fleet 会假设服务失败并将其终止。\n\
  \n每个 ExecStartPre 行共同组成一个在启动实际服务之前运行的脚本。在命令前加上减号 (-) 告诉 systemd 允许此步骤失败。否则，任何以非零错误代码退出的命令都将阻止服务启动。\n\
  \n第一条命令终止现有的 nginx 容器。如果容器未运行，该命令会失败，但这没关系。终止服务可能看起来有点极端。如果服务干净地停止，则运行中的容器将处于停止状态，kill\
  \ 命令将不执行任何操作。如果服务未干净停止，docker kill 可确保服务停止，以便可以重新启动。\n\n第二条命令从 Docker 中删除容器。如果同名容器已存在，则容器无法启动。删除容器可确保以后使用所有正确选项重新创建容器。\n\
  \n第三条也是最后一条 ExecStartPre 行会拉取镜像的新副本。这可确保服务不会运行过时的镜像。有人可能会认为，如果该命令失败，应阻止服务启动。允许其失败意味着，即使注册表宕机（前提是镜像已下载），服务仍可启动。\n\
  \n`ExecStart` 命令是实际启动服务的命令。可以指定多行，但在使用 Docker 容器时，这样做意义不大。重要的是不要将 `-d` 标志传递给 `docker\
  \ run`。如果传递了，Fleet 将丢失对容器的跟踪并停止服务。\n\n最后，`ExecStop` 是用于停止服务的命令。请记住，`docker stop`\
  \ 会保留容器。这就是为什么需要在 `ExecStartPre` 中使用 `docker rm` 的原因。你也可以在此处删除容器。保留容器可以方便在出现问题时进行故障排除：\n\
  \n```\n$ fleetctl start nginx.service\nUnit nginx.service inactive\nUnit nginx.service\
  \ launched on 86bceaea.../172.17.8.103\n```\n\n上述命令会加载指定的单元文件并启动它。在此示例中，`nginx.service`\
  \ 文件位于当前目录中。\n\n可以使用 `fleetctl submit` 命令将单元文件添加到 Fleet 注册表中而无需立即启动。服务可以稍后使用 `fleetctl\
  \ start` 启动：\n\n```\n$ fleetctl submit nginx.service\nUnit nginx.service inactive\n\
  ```\n\n## 监控服务\n\n检查服务状态有两种方法。第一种是使用相同的 `fleetctl list-units` 命令，它还会显示单元名称、分配的机器以及每个单元的当前状态：\n\
  \n```\n$ fleetctl list-units\nUNIT MACHINE ACTIVE SUB\nnginx.service 86bceaea.../172.17.8.103\
  \ active running\n```\n\n另一种方法是使用 `fleetctl status`。它不仅会显示容器的状态，还会显示服务的最新日志条目以及\
  \ `ExecStartPre` 命令的状态代码：\n\n```\n$ fleetctl status nginx.service\n● nginx.service\
  \ - Nginx\nLoaded: loaded (/run/fleet/units/nginx.service;\nlinked-runtime; vendor\
  \ preset\nActive: active (running) since Fri 2016-10-21 02:59:31\nUTC; 1min 24s\
  \ ago\nProcess: 3947 ExecStartPre=/usr/bin/docker pull nginx\n(code=exited, status=0/SUCCESS\n\
  Process: 3942 ExecStartPre=/usr/bin/docker rm nginx\n(code=exited, status=0/SUCCESS\n\
  Process: 3933 ExecStartPre=/usr/bin/docker kill nginx\n(code=exited, status=1/FAILURE\n\
  Main PID: 3953 (docker)\n    Tasks: 7\n    Memory: 3.7M\n    CPU: 40ms\nCGroup:\
  \ /system.slice/nginx.service\n    └─3953 /usr/bin/docker run --name nginx -p\n\
  \        80:80 nginx\n\nOct 21 02:59:27 core-03 systemd[1]: Starting Nginx...\n\
  Oct 21 02:59:27 core-03 docker[3933]: Error response\nfrom daemon: Cannot kill container\n\
  Oct 21 02:59:27 core-03 docker[3942]: nginx\nOct 21 02:59:28 core-03 docker[3947]:\
  \ Using default\ntag: latest\nOct 21 02:59:31 core-03 docker[3947]: latest: Pulling\n\
  from library/nginx\nOct 21 02:59:31 core-03 docker[3947]: Digest:\nsha256:e40499ca855c9edfb212e1c3ee1\n\
  Oct 21 02:59:31 core-03 docker[3947]: Status: Image is\nup to date for nginx:latest\n\
  Oct 21 02:59:31 core-03 systemd[1]: Started Nginx.\n```\n\n## 查看服务日志\n\n可以使用 fleetctl\
  \ journal 查看单元的日志来查看服务的日志。该命令接受感兴趣的单元名称。标记为来自 Docker 的行既包括 docker 命令的输出，也包括 docker\
  \ logs 的输出。可以添加 -f 标志以在添加新条目时跟踪日志：\n\n```\n$ fleetctl journal nginx.service\n--\
  \ Logs begin at Thu 2016-10-20 00:35:44 UTC, end at Fri 2016-10-21\n03:12:36 UTC.\
  \ --\nOct 21 02:56:45 core-03 systemd[1]: Stopped Nginx.\nOct 21 02:59:27 core-03\
  \ systemd[1]: Starting Nginx...\nOct 21 02:59:27 core-03 docker[3933]: Error response\n\
  from daemon: Cannot kill container nginx: Container\n816e993ec3de47cf48f5ab19900db4a162905a133078f4fbc3bd91b27b5c24b\
  \ is not\nrunning\nOct 21 02:59:27 core-03 docker[3942]: nginx\nOct 21 02:59:28\
  \ core-03 docker[3947]: Using default tag: latest\nOct 21 02:59:31 core-03 docker[3947]:\
  \ latest: Pulling from library/nginx\nOct 21 02:59:31 core-03 docker[3947]: Digest:\n\
  sha256:e40499ca855c9edfb212e1c3ee1a6ba8b2d873a294d897b4840d49f94d20487c\nOct 21\
  \ 02:59:31 core-03 docker[3947]: Status: Image is up to date for\nnginx:latest\n\
  Oct 21 02:59:31 core-03 systemd[1]: Started Nginx.\nOct 21 03:12:32 core-03 docker[3953]:\
  \ 172.16.69.1 - - [21/Oct/2016:03:12:32\n+0000] \"GET / HTTP/1.1\" 200 612 \"-\"\
  \ \"Wget/1.18 (linux-gnu)\" \"-\"\n```\n\n## 停止服务\n\n运行中的服务使用 `fleetctl stop` 停止。它以服务名称作为唯一参数：\n\
  \n```\n$ fleetctl stop nginx.service\nUnit nginx.service loaded on 86bceaea.../172.17.8.103\n\
  ```\n\n`stop` 命令会停止运行中的容器，但它仍保留在集群节点上的调度状态。重新启动服务时，它将在之前运行的同一节点上启动。\n\n要取消调度服务，请使用\
  \ `fleetctl unload` 命令。这将从活动单元列表中删除该服务。它将保留在 Fleet 注册表中，并可以使用 `fleetctl start` 再次启动：\n\
  \n```\n$ fleetctl unload nginx.service\nUnit nginx.service inactive\n```\n\n服务可以使用\
  \ `fleetctl destroy` 命令从集群中永久删除：\n\n```\n$ fleetctl destroy nginx.service\nDestroyed\
  \ nginx.service\n```\n\n更改单元时也会使用 `destroy` 命令。必须先使用 `fleetctl destroy` 删除服务，然后才能按所需更改重新创建它。\n\
  \n## 使用环境变量\n\n许多 Docker 镜像使用环境变量进行配置并控制其运行方式。Fleet 可以使用 `Environment` 选项在服务的单元文件中定义这些变量：\n\
  \n```\n[Unit]\nDescription=MySQL\nAfter=docker.service\nRequires=docker.service\n\
  \n[Service]\nEnvironment=MYSQL_ROOT_PASSWORD=password\nEnvironment=MYSQL_DATABASE=myapp\n\
  TimeoutStartSec=infinity\nExecStartPre=-/usr/bin/docker kill mysql\nExecStartPre=-/usr/bin/docker\
  \ rm mysql\nExecStartPre=-/usr/bin/docker pull mysql\nExecStart=/usr/bin/docker\
  \ run --name mysql -e MYSQL_ROOT_PASSWORD -e MYSQL_DATABASE -p 3306:3306 mysql\n\
  ExecStop=/usr/bin/docker stop mysql\n```\n\n此示例启动 MySQL 镜像并定义 MySQL 根密码和初始数据库。变量的值无需在\
  \ `docker run` 命令中定义。Docker 将使用 `Environment` 行中设置的值。\n\n与之前在单元中指定所有环境变量不同，可以将它们全部放入\
  \ `EnvironmentFile` 中。变量及其值按每行一个定义：\n\n```\nMYSQL_ROOT_PASSWORD=password\nMYSQL_DATABASE=myapp\n\
  ```\n\n然后在单元的 `[Service]` 部分的 `EnvironmentFile` 选项中指定该文件：\n\n```\n...\n[Service]\n\
  EnvironmentFile=/etc/mysql.env\n...\n```\n\n该文件必须存在于服务可能运行的集群中的每个节点上。如果不存在，服务将无法启动。\n\
  \n## 使用亲和性调度服务\n\n通常希望确保服务与另一服务运行在同一主机上。相反，最好强制服务运行在不同主机上。此过程称为亲和性，在单元文件的特殊 `[X-Fleet]`\
  \ 部分中配置。\n\n\n\n\n\n### 设置正向亲和性\n\n有两个选项控制容器之间的亲和性。第一个，`MachineOf`，是 Fleet 中的单元文件名称。Fleet\
  \ 会尝试将带有 `MachineOf` 选项的单元放置在运行名为该服务的同一节点上。\n\n例如，假设上一节中描述的 MySQL 服务正在 Fleet 集群的某个位置运行。出于性能原因，理想的做法是在同一节点上运行使用该数据库的某个\
  \ Web 应用程序。在本示例中，`nginx` 将是 Web 应用程序：\n\n```\n[Unit]\nDescription=Nginx Affinity\n\
  After=docker.service\nRequires=docker.service\nRequires=mysql.service\n\n[Service]\n\
  TimeoutStartSec=infinity\nExecStartPre=-/usr/bin/docker kill nginx\nExecStartPre=-/usr/bin/docker\
  \ rm nginx\nExecStartPre=-/usr/bin/docker pull nginx\nExecStart=/usr/bin/docker\
  \ run --name nginx -p 80:80 nginx\nExecStop=/usr/bin/docker stop nginx\n\n[X-Fleet]\n\
  MachineOf=mysql.service\n```\n\n这是本章前面定义的同一基本 `nginx` 服务。这里有两点需要注意。首先，添加了一个 `Requires`\
  \ 选项以确保 `mysql.service` 正在运行。如果它未运行且已定义，Fleet 将启动它。其次是 `[X-Fleet]` 节和 `MachineOf`\
  \ 选项，它确保 Fleet 会尝试在与 `mysql.service` 相同的主机上运行 `nginx.service`。\n\n需要牢记的是，亲和性定义应始终是单向的。如果不是，就会出现竞态条件。在此示例中，如果\
  \ `mysql.service` 也具有 `MachineOf=nginx.service`，Fleet 将无法启动任何一项服务。无法确定在何处启动第一项服务，因为另一项服务尚未启动。\n\
  \n### 使用反向亲和性\n\n有时确保两个服务永远不会在同一节点上运行非常重要。通常，这是出于冗余和高可用性的原因。Fleet 提供了 `Conflicts`\
  \ 选项以用于此类情况。`Conflicts` 选项可以精确匹配单元名称，也可以使用 glob 匹配匹配一组服务。\n\n使用 glob 匹配时，星号 (*)\
  \ 用于匹配零个或多个字符。例如，要匹配任何以 `nginx` 开头的服务，模式将是 `nginx*`。以下代码片段显示了一个配置为不会在运行以 `nginx`\
  \ 开头的服务的任何节点上启动的单元：\n\n```\n[Unit]\nDescription=Nginx Affinity\nAfter=docker.service\n\
  Requires=docker.service\n...\n[X-Fleet]\nConflicts=nginx*\n```\n\n## 高可用性\n\n如前所述，反向亲和性通常用于高可用性。Fleet\
  \ 使用 systemd 模板单元，这使得启动多个相同的服务变得容易。要开始，创建名为 `nginxha@.service` 的文件：\n\n```\n[Unit]\n\
  Description=Nginx HA\nAfter=docker.service\nRequires=docker.service\n\n[Service]\n\
  TimeoutStartSec=infinity\nExecStartPre=-/usr/bin/docker kill nginx\nExecStartPre=-/usr/bin/docker\
  \ rm nginx\nExecStartPre=-/usr/bin/docker pull nginx\nExecStart=/usr/bin/docker\
  \ run --name nginx -p 80:80 nginx\nExecStop=/usr/bin/docker stop nginx\n\n[X-Fleet]\n\
  Conflicts=nginxha@*.service\n```\n\n大部分情况下，这与之前使用的 `nginx.service` 单元相同。`Conflicts`\
  \ 选项已设置，以确保使用此模板的任何单元。\n\n模板的每个实例都命名为 nginxha@id.service，其中 id 是对服务有意义的任何内容。通常，id\
  \ 是一个数字，但不必是：\n\n```\n$ fleetctl start nginxha@1.service\nUnit nginxha@1.service\
  \ inactive\nUnit nginxha@1.service launched on 86bceaea.../172.17.8.103\n$ fleetctl\
  \ start nginxha@2.service\nUnit nginxha@2.service inactive\nUnit nginxha@2.service\
  \ launched on 9c07271b.../172.17.8.102\n$ fleetctl start nginxha@3.service\nUnit\
  \ nginxha@3.service inactive\nUnit nginxha@3.service launched on acbccfa4.../172.17.8.101\n\
  ```\n\n```\n$ fleetctl list-units\nUNIT                      MACHINE           \
  \              ACTIVE      SUB\nnginxha@1.service         86bceaea.../172.17.8.103\
  \        active      running\nnginxha@2.service         9c07271b.../172.17.8.102\
  \        active      running\nnginxha@3.service         acbccfa4.../172.17.8.101\
  \        active      running\n```\n\n在此示例中，启动了 nginxha@.service 模板的三个实例。它们分别命名为\
  \ nginxha@1、nginxha@2 和 nginxha@3。请注意，它们都在不同的机器上启动。随后可以使用负载均衡器将负载分布到所有实例上。如果任何单元失败，整体服务将保持运行。\n\
  \n## 辅助服务\n\n大多数服务之所以不知道集群中其他正在发生的事情，是出于设计考虑。服务如何让其他事物知道它已启动并准备好响应请求？为此，会启动一个名为\
  \ sidekick 的单独服务。sidekick 将通知其他服务容器已启动或停止。具体内容会因环境而异。例如，它可能会向外部负载均衡器发出 API 调用。\n\
  \nFleet 没有原生方式来通知其他服务已有新单元启动。它拥有的是 etcd。etcd 键值存储正是为此类消息传递而设计的。以下示例是一个简单的 sidekick，在\
  \ nginx.service 启动时更新 etcd：\n\n```\n[Unit]\nDescription=Nginx Sidekick\nBindsTo=nginx.service\n\
  After=nginx.service\n\n[Service]\nExecStart=/bin/sh -c \"while [ true ]; do etcdctl\
  \ set\n/services/websites/nginx '{ \"host\": \"%H\", \"port\": 80 }' --ttl 60; sleep\
  \ 50;\ndone\"\nExecStop=/usr/bin/etcdctl rm /services/websites/nginx\n\n[X-Fleet]\n\
  MachineOf=nginx.service\n```\n\n`BindsTo` 选项的工作方式类似于 `Requires`，但它告诉 Fleet，如果 nginx.service\
  \ 因任何原因停止，则停止 sidekick。`ExecStart` 选项运行一个无限循环，用 JSON 片段更新 etcd 中的 /services/websites/nginx\
  \ 键。使用 --ttl 标志为键添加了 TTL，以确保 sidekick 失败时该键会消失。`sleep` 命令在再次更新键前等待 50 秒。时间可以根据环境需求进行调整，但\
  \ `sleep` 应始终小于 TTL 减去更新 etcd 所需的时间。\n\nJSON 中的 %H 变量将被替换为运行 nginx-sidekick.service\
  \ 的节点的主机名。如果 sidekick 与 nginx.service 启动在不同主机上，这可能会有问题。但是，Fleet 亲和性选项 MachineOf\
  \ 确保 Fleet 始终将 sidekick 调度到与 nginx.service 相同的主机上。\n\n另一项服务可以监控 etcd 树中的特定文件或目录，并根据树的更新采取行动。Confd\
  \ 工具正是如此，它可以根据树的内容更新配置模板并重启服务。Confd 的实现留给读者作为练习。Confd 可在 https://github.com/kelseyhightower/confd\
  \ 上获得。\n\n## 启动全局单元\n\n通常希望在集群中的每个节点上运行日志或监控容器。Fleet 通过 [X-Fleet] 中的 Global 选项实现此功能：\n\
  \n```\n[Unit]\nDescription=Monitor\nAfter=docker.service\nRequires=docker.service\n\
  \n[Service]\nTimeoutStartSec=infinity\nExecStartPre=-/usr/bin/docker kill monitor\n\
  ExecStartPre=-/usr/bin/docker rm monitor\nExecStartPre=/usr/bin/docker pull monitor\n\
  ExecStartPre=mkdir -p /var/lib/monitor\nExecStart=/usr/bin/docker run -v /var/lib/monitor:/var/www/rrd\
  \ --net=host --name=monitor hyper/host-monitor\nExecStop=/usr/bin/docker stop monitor\n\
  \n[X-Fleet]\nGlobal=true\n```\n\n此示例启动一个简单的容器，用于创建绘制 CPU、内存和网络数据的 RRD 文件和图像。Global\
  \ 选项告诉 Fleet 在集群中的每个节点上启动该服务的副本：\n\n```\n$ fleetctl start monitor.service\nUnit\
  \ monitor.service Triggered global unit monitor.service start\n```\n\n```\n$ fleetctl\
  \ list-units\nUNIT MACHINE ACTIVE SUB\nmonitor.service 86bcea....../172.17.8.103\
  \ active running\nmonitor.service 9c07271b....../172.17.8.102 active running\nmonitor.service\
  \ acbccfa4....../172.17.8.101 active running\n```\n\n就是这样。集群中的每个节点都有一个 monitor.service。可以根据需要为所需数量的全局服务执行此操作。\n\
  \n## 使用 Rancher Cattle\n\n标题中的“Simpler”一词用于 Rancher Cattle 时有点名不副实。Cattle 是 Rancher\
  \ 提供的功能齐全的编排系统。它比 Kubernetes 或 Mesosphere 更容易设置。它也更易于使用，因为它拥有强大的 Web 界面和基于 Docker\
  \ Compose 的命令行工具。如果您已经使用过 Docker Compose，那么使用 Cattle 可能会感觉非常自如。\n\n### 安装 Rancher\n\
  \nRancher 及其组件在 Docker 容器中运行。这使得几乎在任何地方安装都非常容易。\n\n\n\n\n\n### 安装 Rancher 服务器\n\n\
  Rancher 服务器可以添加到任何现有的 Docker 集群中。唯一要求是运行 Docker 1.10.3 或更高版本。测试用的快速安装只需运行 `docker\
  \ run -d -p 8080:8080 rancher/server` 即可。之后，Web 界面将可在 Docker 主机的 8080 端口上访问。\n\n\
  对于永久性方案，Rancher 数据需要存储在卷中，或连接到外部 MySQL 数据库。卷可以是任何 Docker 卷，包括主机服务器上的目录。以下示例将 MySQL\
  \ 数据存储在 `/var/lib/rancherdb` 中：\n\n```\n$ docker run -d -v /var/lib/rancherdb:/var/lib/mysql\
  \ -p 8080:8080\nrancher/server\n```\n\n对于外部数据库，创建包含连接信息的环境文件。CATTLE_DB_CATTLE_MYSQL_NAME\
  \ 中设置的数据库必须已创建，CATTLE_DB_CATTLE_USERNAME 中设置的用户必须已被授予 Cattle 数据库的所有权限。如果架构不存在，Rancher\
  \ 将自动创建它：\n\n```\nCATTLE_DB_CATTLE_MYSQL_HOST=mysql-host\nCATTLE_DB_CATTLE_MYSQL_PORT=3306\n\
  CATTLE_DB_CATTLE_MYSQL_NAME=cattle\nCATTLE_DB_CATTLE_USERNAME=cattle\nCATTLE_DB_CATTLE_PASSWORD=cattle-password\n\
  ```\n\nRancher Server 可以使用环境文件启动。在本示例中，它名为 `cattle.env`：\n\n```\n$ docker run -d\
  \ --env-file cattle.env --name rancher-server -p 8080:8080\nrancher/server\n```\n\
  \n![](img/02bead9c8ff4515f78dac0eb33163961_186_0.png)\n\nRancher Server 可以安装在多个节点上以实现高可用性。有关更多信息，请参阅\
  \ http://docs.rancher.com/rancher/v1.2/en/installing-rancher/installing-server/。\n\
  \n### 安装 Rancher 代理\n\nRancher 启动后，可以使用 `docker-machine` 支持的任何上游提供商创建新主机。登录 Web\
  \ UI，在基础架构菜单中转到 **主机**，然后单击 **添加主机**。向导将指导您将主机添加到云环境中：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_187_0.png)\n\
  \n也可以手动添加代理。在 **添加主机** 中选择 **自定义** 选项。将显示一个 Docker 命令，需要在每个添加到集群的 Docker 主机上运行。它看起来将类似于此处列出的命令：\n\
  \n```\nsudo docker run -d --privileged -v\n/var/run/docker.sock:/var/run/docker.sock\
  \ -v\n/var/lib/rancher:/var/lib/rancher rancher/agent:v1.0.2\nhttp://172.17.8.101:8080/v1/scripts/781E07FE518B7181D563:1477180800000:N3gz\n\
  UQgoo3mFPcGkqEimBoNExFC\n```\n\n![](img/02bead9c8ff4515f78dac0eb33163961_188_0.png)\n\
  \nRancher 代理在环境中所有主机之间创建 IPSEC 链接，以提供安全的覆盖网络。它还会监听 Docker 事件，并将有关运行容器和性能统计信息的定期更新发送到\
  \ Rancher 服务器。\n\n### 安装 Rancher Compose\n\n在 Rancher 中创建和管理服务所需的几乎所有操作都可以通过 Web\
  \ 界面完成。但是，还有一个名为 `rancher-compose` 的命令行工具可供使用。它适用于 Windows、OS X 和 Linux。要安装 Rancher\
  \ Compose，请执行以下步骤：\n\n- 1. 要下载它，请单击 Web 界面右下角的 **下载 CLI**，并选择您的操作系统。\n- 2. 解压下载的存档，并将\
  \ `rancher-compose` 工具放置在您的路径中。\n- 3. Rancher Compose 需要 API 密钥来对 Rancher 服务器进行身份验证。可以在页面顶部的\
  \ API 部分中为环境或特定用户创建新密钥。\n- 4. 单击 **添加环境 API 密钥** 或 **添加帐户 API 密钥** 以创建相应的密钥。您将看到访问密钥和密钥。\n\
  - 5. 将它们复制到安全位置。创建后无法获取密钥：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_189_0.png)\n\
  \n访问密钥、密钥和 Rancher URL 将分别使用 `--access-key`、`--secret-key` 和 `--url` 标志传递给 `rancher-compose`：\n\
  \n```\n$ rancher-compose --url http://rancher:8080/ --access-key=CA... --secret-key=C4G...\n\
  ```\n\n也可以使用 `RANCHER_ACCESS_KEY`、`RANCHER_SECRET_KEY` 和 `RANCHER_URL` 环境变量设置密钥和\
  \ URL。将它们添加到客户端系统中 `.bash_profile` 的等效文件中：\n\n```\nexport RANCHER_URL=http://rancher:8080/\n\
  export RANCHER_ACCESS_KEY=CA...\nexport RANCHER_SECRET_KEY=C4G...\n```\n\n### 介绍环境\n\
  \nRancher 支持运行多个环境。安装后，将创建一个名为 `default` 的环境，它运行 Cattle 编排套件。可根据需要创建其他环境。环境彼此隔离。这样可以轻松地为开发、测试、生产或不同业务单元创建环境。\n\
  \n尽管 Cattle 是默认编排工具，Rancher 还能够创建运行 Docker Swarm、Kubernetes 和 Mesosphere 的新环境。这可能是在本地环境中安装这些系统的最简单方法。创建新环境后，添加新主机。环境的服务（例如\
  \ `kubectl` 或 Swarm 代理）将自动添加。\n\n有关使用 Docker Swarm 的更多信息，请参阅第 4 章，使用 Docker Swarm\
  \ 进行编排；有关 Kubernetes 的更多信息，请参阅第 5 章，使用 Kubernetes 部署和管理服务；有关 Mesosphere 的更多信息，请参阅第\
  \ 6 章，使用 Mesosphere。\n\n### 管理服务\n\nCattle 使用 Docker Compose 文件定义服务。自 1.1.4 版起，仅支持\
  \ Docker Compose 规范的版本 1。Rancher 1.2 正在添加对版本 2 的支持。\n\nRancher Compose 在标准 `docker-compose.yml`\
  \ 文件的基础上有两种扩展方式。首先，可以向服务添加特殊标签以定义亲和性等内容。其次，可以使用名为 `rancher-compose.yml` 的另一个文件来定义\
  \ Rancher 特定设置（如运行状况检查）。\n\n> > 以下部分介绍如何使用 Rancher CLI。所有以下操作也可以通过 Web 界面完成。\n\n\
  ### 启动堆栈\n\n从设计上讲，`rancher-compose` 工具与 `docker-compose` 非常相似。**堆栈** 是在 `docker-compose.yml`\
  \ 文件和可选的 `rancher-compose.yml` 文件中定义的服务集合。Rancher 目录中有许多应用程序的预构建堆栈。除了快速部署服务外，它们还可以作为构建您自己的堆栈的绝佳示例。\n\
  \n要创建自己的堆栈，请为包含 docker-compose.yml 文件的应用程序创建一个目录。堆栈名称源自目录名称，但可以使用 -s 标志覆盖。创建 compose\
  \ 文件后，在目录中运行 rancher-compose up。以下是启动 WordPress 堆栈的 docker-compose.yml 文件：\n\n```\n\
  wordpress:\n  image: wordpress\n  env_file:\n    - db.env\ndb:\n  image: mysql:5.6\n\
  \  env_file:\n    - db.env\nlb:\n  image: rancher/load-balancer-service\n  ports:\n\
  \    - 80:80\n  links:\n    - wordpress:wordpress\n```\n\n此示例启动三个服务。第一个 wordpress\
  \ 启动 WordPress 应用程序。第二个 db 是 MySQL 数据库。两个服务都使用 db.env 环境文件来加载启动所需的环境变量。环境文件在第 2\
  \ 章，使用 Docker Compose 构建多容器应用程序中已介绍。\n\nlb 服务为此应用程序配置 Rancher 负载均衡器服务。负载均衡器将在本章后面更详细地介绍。目前，只需知道它被配置为将端口\
  \ 80 发送到 wordpress 服务即可。\n\n与 docker-compose 类似，可以使用 -f 标志在命令行上指定多个 docker-compose.yml\
  \ 文件。还可以设置 -d 标志在后台启动堆栈：\n\n```\n$ rancher-compose up -f docker-compose.yml -f production.yml\
  \ -d\n```\n\n### 停止堆栈\n\n服务使用 rancher-compose stop 停止。这必须在包含 docker-compose.yml\
  \ 文件的同一目录中运行。默认情况下，rancher-compose 将停止所有运行中的服务：\n\n\n\n$ rancher-compose stop\n\
  INFO[0000] [0/3] [lb]: Stopping\nINFO[0000] [0/3] [db]: Stopping\nINFO[0000] [0/3]\
  \ [wordpress]: Stopping\nINFO[0001] [0/3] [lb]: Stopped\nINFO[0001] [0/3] [db]:\
  \ Stopped\nINFO[0001] [0/3] [wordpress]: Stopped\n\n可以通过在命令行中指定服务名来单独停止某个服务：\n\n\
  ```\n$ rancher-compose stop wordpress\nINFO[0000] [0/3] [wordpress]: Stopping\n\
  INFO[0001] [0/3] [wordpress]: Stopped\n```\n\n### 移除栈\n\n可以使用 `rancher-compose rm`\
  \ 移除服务。可以通过在命令行中指定服务名来移除单个服务。以下命令用于移除 `lb` 服务：\n\n```\n$ rancher-compose rm lb\n\
  INFO[0000] [0/3] [lb]: Deleting\nINFO[0000] [0/3] [lb]: Deleted\n```\n\n移除整个栈需要在命令行中添加\
  \ `--force` 标志。如果未包含 `--force`，`rancher-compose` 将退出并报错，提示添加它：\n\n```\n$ rancher-compose\
  \ rm --force\nINFO[0000] [0/3] [lb]: Deleting\nINFO[0000] [0/3] [wordpress]: Deleting\n\
  INFO[0000] [0/3] [db]: Deleting\nINFO[0000] [0/3] [db]: Deleted\nINFO[0000] [0/3]\
  \ [wordpress]: Deleted\nINFO[0000] [0/3] [lb]: Deleted\n```\n\n### 升级栈\n\n升级栈有两种方式。第一种是\
  \ **服务内升级**，第二种是 **滚动升级**。两种方式都可实现零停机升级。服务内升级会替换栈中运行的服务，但不更改服务名称。在 WordPress 示例中，`wordpress`\
  \ 服务仍保持为 `wordpress`。滚动升级需要定义新服务，这需要更改 `docker-compose.yml` 中的服务名称。Rancher 推荐使用服务内升级，且这是通过\
  \ Web 界面提供的唯一升级选项。\n\n服务内升级使用 rancher-compose up --upgrade 执行：\n\n```\n$ rancher-compose\
  \ up --upgrade -d\nINFO[0006] [0/3] [db]: Starting\nINFO[0006] [0/3] [wordpress]:\
  \ Starting\nINFO[0009] [1/3] [db]: Started\nINFO[0009] Updating wordpress\nINFO[0011]\
  \ Upgrading wordpress\nINFO[0029] [2/3] [wordpress]: Started\nINFO[0029] [2/3] [lb]:\
  \ Starting\nINFO[0034] [3/3] [lb]: Started\n```\n\n对现有服务的任何更改都会应用。如果升级需要更改运行中的服务，则会先停止容器，再启动该服务的新容器。此行为通过\
  \ rancher-compose.yml 中的 upgrade_strategy 选项按服务单独控制。以下示例配置 Rancher 在停止旧服务前先启动新的\
  \ wordpress 服务。运行 MySQL 的 `db` 服务将继续使用默认行为，即在启动新容器前先停止旧容器：\n\n```\nwordpress:\n\
  \  upgrade_strategy:\n    start_first: true\n```\n\nrancher-compose 还提供一些常用于升级的其他标志。第一个是\
  \ `--pull` 标志，它会强制 Rancher 拉取镜像的新副本，即使本地已有该镜像。如果你为镜像使用了 `latest` 标签，并且需要确保可用最新副本，这会特别有用。\n\
  \n第二个标志是 `--force-upgrade` 标志。即使 `docker-compose.yml` 和 `rancher-compose.yml` 文件未更改，它也会强制\
  \ Rancher 执行升级。与 `--pull` 标志结合使用时，可用于将栈中所有容器升级至其运行的镜像标签的最新版本。同样，这在使用 `latest` 标签或会随点版本更新的标签时最为有用。\n\
  \n默认情况下，rancher-compose 会跟踪栈中所有服务的日志。`-d` 标志会在后台执行升级且不显示日志。\n\n### 回滚和确认升级\n\n在此过程中，仍有机会回滚升级。如果升级出现问题，可以通过运行\
  \ `rancher-compose up --upgrade --rollback` 来回滚。只要升级尚未确认，随时都可以执行回滚。\n\n确认升级成功后，可以通过运行\
  \ `rancher-compose up --upgrade --confirm-upgrade` 来确认升级。请记住，一旦升级已确认，便无法回滚：\n\n\
  ```\n$ rancher-compose up --upgrade -d --confirm-upgrade\nINFO[0005] [0/3] [db]:\
  \ Starting\nINFO[0005] [0/3] [wordpress]: Starting\nINFO[0009] [1/3] [db]: Started\n\
  INFO[0013] [2/3] [wordpress]: Started\nINFO[0013] [2/3] [lb]: Starting\nINFO[0016]\
  \ [3/3] [lb]: Started\n```\n\n在这两种情况下，rancher-compose 都会跟踪栈中服务的日志。可以通过向 rancher-compose\
  \ 传递 `-d` 标志来禁止此行为：\n\n### 检查服务健康状态\n\nRancher 支持为服务添加健康检查。检查可以配置为查询 TCP 端口或发出 HTTP\
  \ 请求。对于 TCP，服务只需接受连接即可。对于 HTTP，请求必须返回 200 到 399 之间的状态码。其他任何情况都会触发错误。以下是一个 `rancher-compose.yml`\
  \ 文件示例，为 WordPress 定义 HTTP 检查，为 MySQL 定义 TCP 检查：\n\n```\nwordpress:\n  upgrade_strategy:\n\
  \    start_first: true\n  health_check:\n    port: 80\n    request_line: GET / HTTP/1.0\n\
  \    interval: 3000\n    initializing_timeout: 60000\n    unhealthy_threshold: 3\n\
  \    strategy: recreate\n    response_timeout: 2000\ndb:\n  health_check:\n    port:\
  \ 3306\n    interval: 3000\n    initializing_timeout: 60000\n    unhealthy_threshold:\
  \ 3\n    strategy: recreate\n    response_timeout: 2000\n```\n\n对于 HTTP 检查，必须设置\
  \ request_line。如果为空或未设置，检查将仅测试 TCP 连接。initializing_timeout 选项定义了等待服务启动的时间（毫秒）。检查之间的间隔时间（毫秒）由\
  \ interval 设置定义。如果在 response_timeout 定义的毫秒数内检查未成功，则检查将失败。\n\nunhealthy_threshold\
  \ 选项设置了 Rancher 采取措施之前的失败次数。采取什么措施由 strategy 选项定义。如示例中设置为 recreate 时，Rancher 会重建服务。strategy\
  \ 还有另外两个选项。第一个选项是 none，表示 Rancher 不执行任何操作。第二个是 recreateOnQuorum，表示当服务中达到给定数量的健康容器时，Rancher\
  \ 会重启该服务。该数量在 recreate_on_quorum_strategy_config 部分中定义。示例如下：\n\n```\nrecreate_on_quorum_strategy_config:\n\
  \  quorum: 1\n```\n\n可以通过使用 rancher-compose up --upgrade 升级栈来更新健康检查。\n\n### 调度与亲和性\n\
  \nRancher 支持手动将服务调度到特定主机上、在环境中的所有主机上全局运行服务，或设置服务亲和性/反亲和性。Rancher 通过 docker-compose.yml\
  \ 中服务上的标签来实现此功能。可用于调度的标签完整列表可参阅 http://docs.rancher.com/rancher/v1.2/en/cattle/scheduling/。\n\
  \n### 使用网络服务\n\nRancher 提供几个有用的服务。首先，Rancher 使用 IPSEC 为集群中运行的服务创建安全的覆盖网络。其次，它为栈内服务提供\
  \ DNS-SD，并支持跨栈引用服务。最后，Rancher 可以创建负载均衡器，可将请求分发到服务中的容器，或根据 HTTP 请求信息重定向流量。\n\n###\
  \ 服务发现\n\nRancher 为集群中运行的所有服务提供 DNS-SD。在栈内，所有服务均可通过服务名访问。在前面的 WordPress 示例中，wordpress\
  \ 容器可以通过 `db` 主机名访问 MySQL 服务。其他栈中运行的服务可通过 `<service name>.<stack name>` 访问。例如，如果前面的\
  \ WordPress 栈命名为 wordpress，则 MySQL 服务为 `db.wordpress`。\n\n每个服务都可以使用 `links` 选项指定别名来引用另一个服务。在以下示例中，wordpress\
  \ 服务中创建了一个别名。该链接使 `db` 服务可通过 `mysql` 名称访问：\n\n```yaml\nwordpress:\n  image: wordpress\n\
  \  env_file:\n    - db.env\n  links:\n    - db:mysql\ndb:\n  ...\n```\n\n### 负载均衡器\n\
  \nRancher 提供基于 HAProxy 的负载均衡器。它可以在四层通过简单转发连接到相应端口来代理，也可以在七层根据 HTTP 信息路由流量。负载均衡器还可以为任何服务提供\
  \ SSL 终止。\n\n\n\n\n\n创建负载均衡器的最简单方法是通过 Web 界面。单击 **Add Service** 旁边的下拉箭头并选择 **Add\
  \ Load Balancer**。将打开一个窗口，提供配置选项：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_197_0.png)\n\
  \n如果负载均衡器提供 SSL 终止，则必须在 **基础架构 | SSL** 中创建证书。可为 Web 服务配置多个证书。负载均衡器将根据请求的服务器名称使用\
  \ SNI 提供正确的证书。\n\n如前述 WordPress 示例所示，负载均衡器可作为 `docker-compose.yml` 文件的一部分创建。在该示例中，创建了一个简单的负载均衡器，用于将端口\
  \ 80 上的 HTTP 连接代理到 `wordpress` 服务的端口 80。要使用纯 TCP，请在目标端口号后附加 `/tcp`。例如，要将端口 25 转发到容器上的\
  \ TCP 端口 25，端口条目应为 `25:25/tcp`。\n\n> Web 界面中的所有负载均衡器设置也可以通过 `docker-compose.yml`\
  \ 实现。有关更多详细信息，请参阅 http://docs.rancher.com/rancher/v1.2/en/cattle/adding-load-balancers/。\n\
  \n### 进一步阅读\n\n本章和前三章仅展示了市面上编排平台中的少数几个。还有许多其他平台，而且似乎每天都会推出一个新平台。以下是一些值得关注的其他编排工具：\n\
  \n- Google、Amazon 和 Microsoft 均在其云产品中提供容器服务。这些通常是在云中使用容器的最简便方式。\n- Red Hat OpenShift\
  \ 是构建在 Kubernetes 之上的 PaaS 平台。它可作为托管平台使用，也可在本地安装。还有一个名为 OpenShift Origin 的开源变体。有关更多详细信息，请参阅\
  \ https://www.openshift.com/。\n- Panamax 是由 CenturyLink 基于 Fleet 和 CoreOS 开发的开源项目。它提供易于使用的\
  \ Web 界面来管理应用程序。有关更多详细信息，请参阅 http://panamax.io/。\n- Modera Cloud 是一个与 Docker Swarm\
  \ 配合使用的开源软件包。它自称为“由开发者为开发者打造”。它使用命令行界面管理应用程序。有关更多详细信息，请参阅 https://mcloud.io/。\n\
  - Microsoft Azure Stack 将容器管理与本地云的其他部分统一管理。Windows Server 2016 发布时带有容器支持，与 Docker\
  \ 兼容。Windows Server 能够在轻量级 VM 中运行基于 Windows 的容器以及基于 Linux 的容器。截至撰写本文时，Azure Stack\
  \ 仍处于技术预览阶段。有关更多详细信息，请参阅 https://azure.microsoft.com/en-us/overview/azure-stack/。\n\
  \n### 总结\n\n本章介绍了两种不同的工具——Fleet 和 Rancher。Fleet 是一个较低级别的系统，非常适合小型环境或作为更高级别工具的基础。本章展示了如何启动和停止服务、设置服务亲和性、运行高可用服务以及跨集群运行全局服务。\n\
  \nRancher 使使用不同编排工具（包括 Docker Swarm、Kubernetes、Mesos 和 Rancher Cattle）运行多个环境变得容易。本章还展示了如何使用\
  \ rancher-compose 管理应用程序、创建运行状况检查以及负载均衡服务。\n\n下一章将介绍 Docker 集群的日志记录和监控。\n\n# 监控您的集群\n\
  \n为 Docker 集群设置编排只是战斗的一半。还需要对集群有可见性。数据检索为何缓慢？是磁盘还是网络问题？Web 服务器为某个应用程序记录了什么日志？某个应用程序使用了多少内存？迟早会出现这些或类似的问题，作为管理员，您将负责提供这些答案。\n\
  \n本章将介绍可用于协助监控和故障排除的不同工具。有些工具（如 Kibana）可以提供集群运行状况摘要，而其他工具（如 Sysdig）可以提供有关应用程序或单个容器的深入信息。\n\
  \n本章将介绍以下主题：\n\n- Docker 日志驱动程序\n- 不向标准输出或标准错误发送日志的容器的日志记录\n- 使用 ELK 堆栈记录和查看日志\n\
  - 将远程日志记录与 Kubernetes、Mesosphere 和 Docker Datacenter 配合使用\n- 收集性能指标\n- 使用 Kibana\
  \ 和 Grafana 绘制指标图表\n- 日志记录和故障排除注意事项\n- 使用 Sysdig 实时查看容器指标\n\n## 使用容器进行日志记录\n\n几乎每个应用程序都会生成某种日志。它们可能跟踪使用情况（例如\
  \ Web 服务器访问日志），也可能仅显示启动或错误消息。无论哪种情况，日志都有其用途，而无法查看日志可能是一个严重问题。\n\nDocker 中的日志记录是一门奇怪的学问。容器在设计上是短暂的。它们被设计为经常创建和销毁。这对应用程序日志构成问题，因为日志文件会随着容器一起被删除。\n\
  \n解决此问题的方法分两方面。首先，Docker 提供日志插件系统，将应用程序打印到标准输出或标准错误的所有内容记录到某个位置。其次，需要一个地方来存放这些日志。换句话说，需要一个日志聚合服务器。\n\
  \n## 使用 Docker 日志插件\n\nDocker 假设打印到标准输出或标准错误的所有内容都是日志。可以通过运行 `docker logs <container\
  \ name>` 访问这些日志，其中 `<container name>` 是容器的名称。不幸的是，这些日志仅在容器存在期间才有效。Docker 通过创建日志插件系统解决了此问题，该系统允许管理员配置\
  \ Docker 将这些日志发送到其他位置。\n\n在编排环境中，日志应发送到日志聚合服务器。如果日志保存在本地，在需要时查找日志将成为一项挑战。有多种远程日志记录选项可供使用。以下是其中几个选项：\n\
  \n- syslog：这是 Unix 和 Linux 系统上经过验证的远程日志记录解决方案。如果已有远程 Syslog 基础设施，这是一个不错的解决方案。最大的缺点是\
  \ Syslog 日志未格式化，这使得从日志中自动挖掘有用数据变得困难。\n- gelf：Graylog 扩展日志格式 (GELF) 由 Graylog 项目开发，旨在通过提供结构化日志格式来克服\
  \ Syslog 的不足。它与 NoSQL 风格的数据库配合使用，可根据 GELF 条目中的键自动索引和搜索。\n- fluentd：这一概念将结构化日志进一步推进，使将不同日志发送到不同日志和分析服务（包括\
  \ Elasticsearch、MySQL 和 Nagios）变得容易。无论环境如何，Fluentd 都可能与其兼容。\n- awslogs 和 gcplogs：这些插件分别将日志发送到\
  \ Amazon CloudWatch 和 Google Cloud Logging。如果 Docker 集群专用于 AWS 或 GCE 运行，这些插件是不错的选择。\n\
  - etwlogs：此仅限 Windows 的插件将 Docker 日志发送到 **Windows 事件跟踪 (ETW)**。之后，可以使用标准 Windows\
  \ 工具（如 **System Center Operations Manager (SCOM)**）根据日志进行聚合和告警。\n\n日志驱动程序及其设置的完整列表可在\
  \ https://docs.docker.com/engine/admin/logging/overview/ 上找到。\n\n可以使用 `--log-driver`\
  \ 标志为 Docker 守护进程指定日志驱动程序。该驱动程序适用于服务器上启动的任何容器。还可以将 `--log-driver` 作为参数传递给 `docker\
  \ run` 以覆盖该容器的日志选项。\n\n每个日志驱动程序都有特定于该驱动程序的若干选项。例如，`syslog` 驱动程序具有远程 Syslog 服务器地址、日志设备和\
  \ TLS 选项的选项。以下示例配置 Docker 守护进程使用 `gelf` 驱动程序将日志发送到 Graylog 服务器。地址名称通过 `gelf-address`\
  \ 选项设置：\n\n```\n$ docker daemon --log-driver=gelf --log-opt gelf-address=udp://graylog:12201\
  \ ...\n```\n\n为特定容器设置日志驱动程序的方式相同。此示例对容器使用 `syslog` 驱动程序：\n\n```\n$ docker run --log-driver=syslog\
  \ ...\n```\n\n几乎所有日志插件都禁止使用 `docker logs` 命令。查看这些容器日志的唯一方式是通过聚合服务器。在容器测试期间，将日志驱动程序设置为默认\
  \ `json-file` 驱动程序可能会有所帮助。\n\n> 警告：容器的所有输出都会发送到日志服务器。这包括运行 shell 的容器（例如 `docker\
  \ run -it busybox`）的所有命令输出。通过 `docker exec` 运行的命令输出不包括在内。如果运行的命令将输出不应出现在日志中的敏感信息，请指定本地日志驱动程序。\n\
  \n## 遵循常规之外的容器日志记录\n\n有时候，容器中的应用程序不会向标准输出或标准错误输出日志。对于正在迁移到容器中运行的传统应用程序，这种情况很常见。根据应用程序，处理日志有几种选择。\n\
  \n\n\n\n\n第一个选项是在容器内运行 Logstash 或 Filebeat 等服务。Logstash 被配置为监视应用程序的日志文件并将它们发送到适当的服务器。像\
  \ `supervisord` 这样的服务控制器在 `Dockerfile` 中用作 `entrypoint` 来启动应用程序和 Logstash。要小心，因为日志服务可能会停止且不会被重启。\n\
  \n第二个选项是在 `Dockerfile` 中为日志配置一个卷。然后可以在辅助容器中运行 Logstash 来读取日志并将它们发送到聚合服务器。如果服务在 Kubernetes\
  \ 集群中运行，可以使用 pod 来对容器进行分组。总体来说，这是一个更好的选项，因为它让日志工具与应用程序分离，从而更容易升级或替换其中每一个。\n\n##\
  \ 使用 ELK 堆栈进行日志记录\n\nElasticsearch、Logstash 和 Kibana 的组合构成了 ELK 堆栈。每个组件构成整体的一部分。Elasticsearch\
  \ 是数据库。所有日志信息最终都会到这里。Logstash 是将日志放入（或缓存到）Elasticsearch 的工具。Logstash 有许多输入插件，包括\
  \ `gelf` 和 `syslog`。最后，Kibana 提供了一种简单的方法来搜索日志并根据日志信息创建仪表板。\n\n### 启动 Elasticsearch\n\
  \nElasticsearch 是一种 NoSQL 风格的数据库，可被多种工具使用。它非常快速，从设计之初就为了能够在多主环境中运行。以下示例启动一个新的 Elasticsearch\
  \ 容器：\n\n```\n$ docker run -d --name es -p 9200:9200 -p 9300:9300 elasticsearch\
  \ -E \n node.name=\"Node1\"\n```\n\n可以使用 `-E` 标志设置单个配置项。`node.name` 的值是 Elasticsearch\
  \ 集群中该节点的名称。如果计划运行多个 Elasticsearch 容器，还需要两个选项。第一个是 `cluster.name`，即集群的名称，所有节点必须相同。第二个是\
  \ `discovery.zen.ping.unicast.hosts`，它包含要连接的主机列表。它也可以是解析为多个主机的 DNS 名称。这是使用覆盖网络 DNS-SD\
  \ 中主机名的好地方。\n\n如果需要更复杂的配置，可以将配置设置添加到容器中的 /usr/share/elasticsearch/config，可以是通过卷，也可以通过构建新镜像。以下\
  \ Dockerfile 演示了如何实现。这样做的优势在于，你可以构建一个内置配置的镜像，并为集群中的更受控部署对镜像进行版本控制：\n\n```\nFROM\
  \ elasticsearch:5.0\nCOPY config /usr/share/elasticsearch/config\n```\n\nelasticsearch\
  \ 镜像将其数据存储在 /usr/share/elasticsearch/data 中。这应该是一个持久的网络卷。卷的具体配置将取决于用于共享存储的内容。\n\n\
  ### 启动 Logstash\n\nLogstash 是一个从各种来源获取日志并将其存储在 Elasticsearch 中的工具。在 Docker 中使用它的最简单方法是将其配置为监听\
  \ GELF 日志。配置将类似于这里所示：\n\n```\ninput {\n  gelf { }\n}\noutput {\n  elasticsearch\
  \ {\n    hosts => [ 'es.weave.local' ]\n  }\n}\n```\n\ngelf 块告诉 Logstash 监听 GELF\
  \ 日志。elasticsearch 块告诉 Logstash 输出将发送到 Elasticsearch。hosts 选项是逗号分隔的主机列表。它也可以是返回一个或多个\
  \ IP 地址的 DNS 条目：\n\n```\n$ docker run -d --name logstash -p 9200:9200 -p 12201:12201/udp\
  \ logstash -f /config/logstash.conf\n```\n\n要使用的配置文件通过 -f 标志设置。此文件可以作为卷添加到容器中，也可以添加到自定义\
  \ logstash 镜像中。将配置添加到镜像可以防止配置漂移，并确保每个 Logstash 服务都在做同一件事：\n\n```\nFROM logstash:5.0\n\
  COPY logstash.conf /config/logstash.conf\n```\n\n在 Docker 中使用 Logstash 有两个选项：\n\n\
  - 第一个是在每个 Docker 主机都使用的中央 Logstash 服务中运行。\n- 第二个选项是在每个主机上运行 Logstash 并配置 Docker\
  \ 将日志发送到本地 Logstash 容器。此选项在大型集群中扩展性更好。\n\n以下示例展示了如何配置 Docker 守护进程将 GELF 日志发送到运行在\
  \ localhost 上的服务。如果改用中央 Logstash 服务器，请将 localhost 替换为服务器的地址：\n\n```\n$ docker daemon\
  \ --log-driver=gelf --log-opt gelf-address=udp://localhost:12201\n```\n\n### 使用\
  \ Kibana 查看日志\n\n将日志发送到远程服务器很好，但如果没有查看方式，就没有任何好处。这就是 Kibana 派上用场的地方。Kibana 提供了一个界面来查看和搜索\
  \ Elasticsearch 中的日志。它还可以根据 Elasticsearch 数据库中的任何信息创建图表和图形。\n\n开始使用 Kibana 的最简单方法是使用官方\
  \ Docker 镜像。以下示例展示了如何运行它。ELASTICSEARCH_URL 的值是 Elasticsearch API 服务的地址：\n\n```\n\
  $ docker run -d --name kibana:5.0 -e ELASTICSEARCH_URL=http://elasticsearch:9200\
  \ -p 5601:5601 kibana\n```\n\nKibana 运行后，你可以连接到运行 Kibana 的 Docker 主机。例如，如果 Kibana\
  \ 运行在 172.17.8.101 上，则 Web 界面的地址是 http://172.17.8.101:5601。默认情况下没有身份验证：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_205_0.png)\n\
  \n首次登录时，系统会提示你输入 Kibana 将针对其运行分析的索引。Logstash 的日志可在 `logstash-*` 索引下使用。在配置索引之前，所选索引中必须存在条目。**时间字段名称**\
  \ 字段必须设置为 `@timestamp`。\n\n配置索引模式后，可以在 **发现** 页面上查看日志。当大量来自大量服务的日志开始到达时，一次查看所有日志变得徒劳无功。幸运的是，Elasticsearch\
  \ 在搜索方面非常出色。例如，可以使用 `container_name:<container>` 查询查看单个容器的日志，其中 `<container>` 是容器的名称。也可以在查询中使用\
  \ `image_name:<name>` 根据镜像名称进行搜索。\n\n> 如果使用不同的日志驱动程序将日志添加到 Elasticsearch，字段名称 `container_name`\
  \ 和 `image_name` 可能会不同。\n\n![](img/02bead9c8ff4515f78dac0eb33163961_206_0.png)\n\
  \n单个日志由多个字段组成。每个字段都可以用作查询术语。这样就可以深入到确切所需的内容。以下截图显示了来自 Docker 的单个日志的字段：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_207_0.png)\n\
  \n对于 Docker 日志，更有用的字段如下：\n\n- `container_name`: 这是由 `docker run` 的 `--name` 标志指定的容器名称。\n\
  - `container_id`: 这是容器的完整 ID。如果多个容器使用相同的名称运行，这将特别有用。\n- `image_name`: 这是正在使用的镜像名称。这样就可以查找运行特定镜像的所有容器的日志。\n\
  - `host`: 这是容器正在运行的主机的名称。\n- `message`: 这是实际的日志消息。这是 `docker logs` 命令将打印的任何内容。\n\
  \nKibana 中的查询是使用 Elasticsearch 语法构建的。文档可在 https://www.elastic.co/guide/en/elasticsearch/reference/5.0/query-dsl-query-string-query.html#query-string-syntax\
  \ 找到。\n\n可以保存搜索查询。这样可以轻松重新运行经常需要的查询。保存的搜索也可以添加到仪表板，以将多组日志整合到单个视图中。\n\n## Docker\
  \ Datacenter 中的远程日志记录\n\n由 Docker Datacenter 管理的 Docker 主机可以配置为使用日志驱动程序，就像任何其他 Docker\
  \ 主机一样。Docker Datacenter 本身支持将日志记录到远程 Syslog 服务器。转到 Settings，然后转到 LOGS。从那里，可以设置远程\
  \ Syslog 服务器、协议和日志级别。完成后，单击 Enable Remote Logging：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_208_0.png)\n\
  \n## Kubernetes 日志记录\n\nKubernetes 的设计初衷就是集中式日志记录。它可以将日志发送到 Google Cloud Logging\
  \ 或作为 Kubernetes 服务运行的 Elasticsearch。Kibana 也已启动，以提供访问发送到 Elasticsearch 的日志的简便方法。要在安装时启用\
  \ Elasticsearch，请在运行 kube-up.sh 之前将 KUBE_LOGGING_DESTINATION 环境变量设置为 elasticsearch：\n\
  \n```\n$ KUBE_LOGGING_DESTINATION=elasticsearch kube-up.sh\n```\n\n有关完整详细信息，请参阅\
  \ http://kubernetes.io/docs/getting-started-guides/。\n\n\n\n\n\n## Logging from\
  \ Mesosphere\n\nMesosphere 通过 Marathon Web 界面提供每个运行服务的日志。不幸的是，一次访问多个服务的日志可能很麻烦。没有原生方法将服务日志发送到聚合服务器。\n\
  \n有几种方法可以绕过这个问题。第一种方法是如前所述，配置 Docker 守护进程使用 GELF 日志驱动程序将日志发送到 Elasticsearch。另一种方法是使用\
  \ Logstash 或 Elastic Filebeat 直接读取服务日志并将其发送到 Elasticsearch。\n\n要使用 Filebeat，请从 Elastic\
  \ 的 yum 仓库在每个主机上安装它。然后将以下内容添加到 `/etc/filebeat/filebeat.yml`。请务必更改 `hosts` 键中 Elasticsearch\
  \ 主机的名称：\n\n```\nfilebeat.prospectors:\n- input_type: log\n paths:\n - /var/lib/mesos/slave/slaves/*/frameworks/*\n\
  \ /executors/*/runs/latest/stdout\n - /var/lib/mesos/slave/slaves/*/frameworks/*\n\
  \ /executors/*/runs/latest/stderr\noutput.elasticsearch:\n hosts: [\"elasticsearch:9200\"\
  ]\n```\n\n## Logging your Docker hosts\n\n请记住，集群日志应包括 Docker 主机以及 Docker 本身。在考虑\
  \ Docker 的日志解决方案时，值得确保主机的日志也可以发送到那里。例如，Logstash 有一个选项可以充当 Syslog 服务器。可以将每个主机配置为通过\
  \ Logstash 发送日志，Logstash 会将它们添加到 Elasticsearch 中。\n\n将 Docker 主机的日志添加到与 Docker 相同的日志解决方案中，将有助于故障排除和根本原因分析。Kibana\
  \ 之类的查看器成为 *单一玻璃窗*，用于查看集群中发生的一切。想象一下，收到警告某些容器无法与数据库通信的警报，并在与 Docker 日志相同的视图中看到 Docker\
  \ 主机上的某个接口已断开连接的日志消息。问题发现得越快，服务恢复得就越快。\n\n## Collecting and graphing performance\
  \ data\n\n日志很棒，但有时真正需要的是系统性能摘要。\n快速查看性能图通常比浏览数百或数千条日志条目能告诉管理员更多信息。诸如“为什么此应用程序运行缓慢？”之类的简单问题，通常需要查看存储节点上的磁盘、每个存储节点之间以及存储与\
  \ Docker 主机之间的网络利用率、内存和 CPU 利用率以及主机磁盘性能的数据。这甚至还不包括数据库速度和应用程序低效等因素。好消息是，所有这些数据都可以收集和绘制成图。\n\
  \n### Collecting data with collectd\n\ncollectd 守护进程是一个强大的工具，可以从许多不同的来源收集数据并将数据发送到多个数据库。其中两个数据库是\
  \ Elasticsearch 和 InfluxDB。使用 Elasticsearch 意味着数据可供 Kibana 构建可视化并包含在仪表板中。InfluxDB\
  \ 是一个专为存储时间序列数据而设计的高速数据库。有许多工具可以从 InfluxDB 创建图表和图形，包括 Grafana，稍后将讨论。\n\n有时，关于用于存储集群指标的数据库应该使用哪一个这个问题，正确答案是\
  \ _两者都用_。Elasticsearch 和 InfluxDB 各有优势和劣势，但它们互补性很好。试着同时运行它们一段时间。以后随时可以停止向其中一个发送数据。\n\
  \n### Running collectd\n\n大多数主要 Linux 发行版都有 collectd 的软件包。在 Debian 和 Ubuntu 中，安装只需\
  \ `apt-get install collectd`。其他发行版的软件包和安装说明可在 https://collectd.org/download.shtml\
  \ 上找到。\n\n`collectd` 守护进程可以从命令行手动运行，如下例所示。`-f` 标志将使 `collectd` 保持在前台。`-C` 标志用于提供配置文件路径：\n\
  \n```\n$ collectd -f -C /etc/collectd/collectd.conf\n```\n\ncollectd 没有官方 Docker\
  \ 容器。某些插件做出的假设使得在容器中运行它变得有问题。例如，内存插件将 /proc 硬编码为内存信息的来源。在容器中，/proc 仅包含容器的信息，而不是整个系统的信息。\n\
  \n由于为容器创建的虚拟接口，在容器中运行 collectd 时接口数据会很奇怪。可以通过在 docker run 中使用 --net=host 来解决这个问题。\n\
  \n### Configuring collectd\n\n数据通过一系列插件收集。每个插件使用 LoadPlugin 选项加载。如果插件有选项，则使用 <Plugin\
  \ name> 块进行设置，其中 name 是插件的名称。带有插件选项链接的完整插件列表可在 collectd.conf (5) 手册页或 https://collectd.org/wiki/index.php/Table_of_Plugins\
  \ 上找到。\n\n以下示例显示了读取 CPU 使用率指标、负载平均值和磁盘使用情况的基本配置：\n\n```\nBaseDir \"/var/lib/collectd\"\
  \nPIDFile \"/run/collectd.pid\"\nInterval 10.0\n\nLoadPlugin cpu\nLoadPlugin load\n\
  LoadPlugin disk\n```\n\nInterval 选项是数据收集运行之间的秒数。请确保不要将其设置得太低以至于使服务器不堪重载。可以使用 <LoadPlugin>\
  \ 标签为每个插件设置间隔，并在此处指定 Interval 选项：\n\n```\n<LoadPlugin foo>\n Interval 60\n</LoadPlugin>\n\
  ```\n\n前面的基本示例读取数据但不做任何处理。在集群环境中，数据很可能会发送到数据库。网络插件可以配置为将收集的数据发送到一个或多个服务器。以下片段加载网络插件并配置\
  \ collectd 将数据发送到两个服务器。IP 地址后面的数字是 UDP 端口号：\n\n```\nLoadPlugin network\n<Plugin\
  \ network>\n    Server \"172.17.8.102\" \"25826\"\n    Server \"172.17.8.101\" \"\
  12203\"\n</Plugin>\n```\n\n## Storing performance data in Elasticsearch\n\ncollectd\
  \ 守护进程数据通过 Logstash 添加到 Elasticsearch。以下示例将 UDP 输入插件添加到 input 块。Logstash 将在 port\
  \ 选项指定的端口上侦听 collectd 连接。buffer_size 选项设置最大数据包大小。出于性能原因，应将其设置得足够小以适应单个网络帧。\n\ncodec\
  \ 选项告诉 Logstash 传入数据包采用 collectd 的二进制网络格式。为了正确映射数据类型，Logstash 需要 collectd 的 types.db\
  \ 副本。collectd 守护进程通常将 types.db 安装在 /usr/share/collectd/ 中。\n\n此示例最后做了一件事。它为每个输入插件设置类型。这样可以通过在查询中添加\
  \ _type:log 来轻松在 Kibana 中仅查看日志：\n\n```\ninput {\n  gelf {\n    type => log\n  }\n\
  \  udp {\n    port => 12203\n    buffer_size => 1452\n    codec => collectd {\n\
  \      typesdb => [ '/usr/share/collectd/types.db' ]\n    }\n    type => perf\n\
  \  }\n}\n```\n\n如果打算在容器中运行 Logstash，请创建一个添加 `types.db` 的自定义镜像。示例 Dockerfile 如下所示：\n\
  \n```\nFROM logstash:5.0\nCOPY types.db /usr/share/collectd/types.db\n```\n\n##\
  \ Storing performance data in InfluxDB\n\nInfluxDB 是从头开始构建用于处理时间序列数据的。它非常快，并有多种高可用性选项。最棒的是，有官方\
  \ Docker 容器可用。启动 InfluxDB 就像运行以下命令一样简单：\n\n```\ndocker run -d -p 8083:8083 -p 8086:8086\
  \ -p 25826:25826/udp --name influxdb \\\n-v /usr/share/collectd/types.db:/usr/share/collectd\
  \ /types.db:ro \\\n-e INFLUXDB_COLLECTD_ENABLED=true \\\n-e INFLUXDB_COLLECTD_port=25826\
  \ \\\n-e INFLUXDB_COLLECTD_DATABASE=collectd_db \\\n-e INFLUXDB_COLLECTD_TYPESDB=/usr/share/collectd/types.db\\\
  \ninfluxdb\n```\n\n环境变量按以下顺序配置 InfluxDB：\n\n- 启用 collectd 支持\n- 在 UDP 端口 25826 上侦听\
  \ collectd 连接\n- 将 collectd 数据的数据库设置为 `collectd_db`\n- 将容器内的路径设置为 collectd `types.db`\n\
  \n`influxdb` 镜像将数据库存储在 `/var/lib/influxdb` 中。在生产环境中运行时，这应位于外部卷上。\n\n## Graphing\
  \ data with Kibana\n\n**可视化** 页面提供创建 Elasticsearch 中数据图表和图形的选项。创建的可视化可以保存以供以后查看，或组合到仪表板中，以提供集群或服务的更完整视图。\n\
  \n\n\n\n\n### 创建新图表\n\n要创建新图表，单击 Visualize，选择图表类型，然后选择索引名称。Logstash 数据将位于匹配 logstash-*\
  \ 模式的索引中。随后将被引导至创建图表的页面：\n\n- 1. 单击 Y-Axis 旁边的箭头以显示选项。\n- 2. 选择聚合方法。Average 方法在大多数情况下效果良好。\n\
  - 3. 选择一个字段。显然，这将取决于正在绘制的数据。\n- 4. 可选：为轴设置自定义标签。\n- 5. 可以添加更多指标：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_214_0.png)\n\
  \n- 6. 在桶部分，单击 X-Axis 旁边的箭头。\n- 7. 选择聚合方法。在大多数情况下，这将是 Date Histogram。\n- 8. 除非设置了自定义时间戳字段，否则字段应为\
  \ @timestamp：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_215_0.png)\n\n- 9. 单击配置面板顶部的箭头以应用更改并查看图表。\n\
  - 10. 单击页面顶部菜单中的 Save 以保存图表。\n\n默认情况下，Kibana 会将所选字段的所有数据聚合到图表中。通常，根据主机或其他元数据来查看细分数据更有意义。为此，单击\
  \ Add sub-buckets。然后单击 Split Lines 或 Split Chart。Split Lines 为每个子桶显示一条线。Split Chart\
  \ 为每个子桶创建单独的图表。如果绘制了许多指标，Split Chart 更适合。\n\n要按主机名细分数据，将子聚合设置为 Significant Terms，将字段设置为\
  \ host.keyword，将大小设置为 1。单击顶部的箭头以应用任何更改并查看图表效果。\n\n### 将图表添加到仪表板\n\n仪表板提供了一种在一个位置一起显示保存的图表和搜索的方式。要创建新仪表板，请按照此处提到的步骤操作：\n\
  \n- 1. 单击左侧菜单中的 Dashboard，然后单击顶部菜单中的 New。单击页面顶部的 Add 以向仪表板添加新面板。\n- 2. 单击保存的可视化或搜索，它将被添加到仪表板：\n\
  \n![](img/02bead9c8ff4515f78dac0eb33163961_216_0.png)\n\n面板可以调整大小并在仪表板上移动，以以最合理的方式呈现信息。仪表板准备就绪后，单击页面顶部的\
  \ **保存** 选项。为仪表板命名，然后单击 **保存** 按钮。之前保存的仪表板可以通过单击页面顶部菜单中的 **打开** 选项打开。\n\n## 使用 Grafana\
  \ 绘制数据\n\nGrafana 是一款非常强大的数据绘图工具。它可以使用 Elasticsearch 和 InfluxDB 作为数据源，但 InfluxDB\
  \ 提供更多查询选项来处理数据。\n\nGrafana 的最大功能之一是能够创建仪表板模板，从而构建数据集分组以便于显示。例如，可以选择仅显示 Web 服务器、数据库服务器，或标记为\
  \ *前端* 的所有服务器。有关更多详细信息，请参阅 http://docs.grafana.org/reference/templating/。\n\n###\
  \ 安装 Grafana\n\nGrafana 项目创建了一个 Docker 镜像以简化 Grafana 部署。入门的基本命令如下。默认用户名和密码均为 admin。\n\
  \n```\n$ docker run -d -p 3000:3000 --name grafana grafana/grafana\n```\n\n默认情况下，Grafana\
  \ 使用 SQLite 在 /var/lib/grafana 中存储数据库和会话信息。可以将其配置为使用 MySQL 或 PostgreSQL。如果选择继续使用\
  \ SQLite，请确保 /var/lib/grafana 被挂载为外部卷。完整的配置文档可在 http://docs.grafana.org/installation/configuration/\
  \ 中找到。\n\n### 添加数据源\n\n在使用 Grafana 绘制数据之前，它必须知道数据所在的位置。要添加新数据源，请从左上角的下拉菜单中选择 Data\
  \ Sources。单击 Add new 按钮。具体内容将取决于使用 Type 选项选择的数据源。完成数据源连接信息的设置后，单击 Save & Test。Grafana\
  \ 将尝试连接到数据源，如果有问题，会打印警告。单个图表中可以添加和使用多个数据源：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_218_0.png)\n\
  \n### 创建新仪表板\n\n可以通过从下拉菜单中选择 Dashboard 并选择 +New 选项来创建新仪表板。新仪表板将是空白的，行左侧有一个非常小的弹出菜单。从该弹出菜单中，可以添加新面板。示例仪表板上的菜单如下所示：\n\
  \n![](img/02bead9c8ff4515f78dac0eb33163961_219_0.png)\n\n### 创建图表\n\n打开行的弹出菜单，先进入\
  \ Add Panel，再进入 Graph。随后将显示图表编辑器。选项很多。不用担心。大多数选项都很简单，功能明显。最复杂的是 Metrics 选项卡。这是选择要在图表上显示的指标的地方。\n\
  \n单击标有 **选择指标** 的按钮，选择要用于此图表的指标。在以下屏幕截图中，已选择 **load_shortterm** 指标。可以使用 **添加查询**\
  \ 按钮向图表添加更多指标：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_220_0.png)\n\n提供许多选项，包括用于处理所选指标的选项。一个有用的选项是按标签对指标进行分组的功能。单击\
  \ **GROUP BY** 行中的加号，选择 **tag(host)**，以便将每个主机拆分为单独的行。\n\n图表完成后，单击 **返回仪表板** 返回仪表板。单击顶部的磁盘图标或按\
  \ **Ctrl + S** 保存仪表板。仪表板将可从页面顶部的下拉菜单中访问。\n\n## 在 Kubernetes 中使用 Heapster\n\nHeapster\
  \ 是一种 Kubernetes 服务，用于收集节点和 Pod 指标，并通过 InfluxDB 和 Grafana 或 Google Cloud Monitoring\
  \ 提供这些指标。使用 `kube-up.sh` 安装 Kubernetes 时，默认会安装它。有关从 Heapster 访问指标的完整详细信息可在 http://kubernetes.io/docs/user-guide/monitoring/\
  \ 中找到。\n\nHeapster 的功能之一是按 Pod 对容器指标进行分组。它会根据 Pod 中设置的标签为指标添加标签。这使得在 Grafana 中轻松创建专注于单个\
  \ Pod 或由多个 Pod 组成的单个应用程序的图表。\n\n## 监控系统运行状况的注意事项\n\n系统管理员职业生涯早期学到的事情之一是，在客户或老板注意到之前发现问题并修复问题更好。在故障排除方面，日志收集和性能图表至关重要。然而，很少有人会监控每条日志消息和每一条性能数据。信息量实在太大，有些管理员甚至在办公室之外也有生活。幸运的是，计算机非常擅长筛选大量数据，而且很少请假。\n\
  \n大多数多年来用于监控服务器和服务运行状况的工具仍然适用。然而，与旧的独立服务器模型相比，完全编排的环境提供了一些独特的挑战。例如，服务不运行在单个主机上。它可能在集群中的任何位置运行。此外，能够通过\
  \ AWS、GCE，甚至本地数据中心中的 VM 快速向 Docker 集群添加或删除容量，使得向监控套件中添加特定主机成为一项挑战。\n\n变化太多，无法提供适用于所有情况的特定解决方案，但以下是一些一般准则。\n\
  \n### 监控服务\n\n请记住，客户使用您的服务时最关心的是：“它是否可用？”。对于管理员来说，问题不仅仅是：“它是否正常运行？”，而是：“我如何保持这种状态？”。可以采取多种措施，以确保管理员在客户之前了解存在问题。\n\
  \n- **使用运行状况检查**：Kubernetes 等一些编排工具可以运行检查来监控服务的运行状况。使用它们并使其有意义。仅仅知道 Web 服务器正在接受\
  \ 80 端口上的连接是不够的。您还需要知道它是否返回良好的状态码并显示预期的内容。\n- **监控所有移动部分**：Web 应用程序通常不仅仅是 Web 服务器。是否存在数据库，并且它是否正常响应？不要害怕编写一个使用\
  \ Web 应用程序的凭据登录数据库并执行查询的运行状况检查。\n\n\n\n\n\n- **不要忘记网络**：在本地运行集群时，很容易忽略或视若理所当然地对待网络基础架构。在可行的情况下，将网络协议栈添加到监控中。一些组织将网络和服务器运维团队分开，这可能会使将网络协议栈添加到\
  \ Docker 监控中在政治上存在问题。在这种情况下，与网络团队成为朋友。\n\n- **创建有用的仪表板**：能够在同一位置查看相关组件的日志和指标可以简化故障排除。诀窍在于知道什么值得查看，什么不值得。过多信息与信息过少一样成问题。\n\
  \n### 使用 Sysdig 实时监控服务\n\nSysdig 是一种实时命令行监控工具。它可以监控大多数主机组件，并支持报告容器统计信息。它还支持查看基于\
  \ Kubernetes Pod、复制控制器、服务等的指标。\n\n在可能的情况下，Sysdig 应直接安装并运行在主机上。这样可以使其对系统拥有最大可见性。Debian\
  \ 和基于 Red Hat 的系统提供了安装包。安装说明可在 http://www.sysdig.org/install/ 找到。\n\n也可以在容器中运行 Sysdig。如果\
  \ Docker 主机运行的 Linux 发行版不受直接支持，或者像 CoreOS 这样在容器中运行所有内容的系统，这尤其有用。启动容器的命令如下：\n\n```\n\
  $ docker run -it --rm --name=sysdig --privileged=true \\\n--volume=/var/run/docker.sock:/host/var/run/docker.sock\
  \ \\\n--volume=/dev:/host/dev \\\n--volume=/proc:/host/proc:ro \\\n--volume=/boot:/host/boot:ro\
  \ \\\n--volume=/lib/modules:/host/lib/modules:ro \\\n--volume=/usr:/host/usr:ro\
  \ \\\nsysdig/sysdig\n```\n\n需要注意以下几点：\n\n- 首先，在容器中运行 `sysdig` 需要使用 `--privileged`\
  \ 标志。它需要此权限才能加载 `sysdig` 内核模块并访问所有所需信息。\n- 第二，该命令映射了多个重要的文件系统，例如 `/proc`，以实现可见性。\n\
  - 第三，/var/run/docker.sock 被映射到容器中，以便 sysdig 可以检索正在运行的 Docker 容器的信息。\n\n安装 sysdig\
  \ 后，运行命令 `cysdig` 启动 curses 界面。这提供了一个类似 top 的界面，让你查看服务器上正在发生的事情。使用 F2 切换视图。`-pc`\
  \ 标志将容器信息添加到许多可用视图中：\n\n```\n$ cysdig -pc\n```\n\n![](img/02bead9c8ff4515f78dac0eb33163961_223_0.png)\n\
  \nSysdig 在实时排查系统问题时非常有价值。每个视图都有深入选项，可以查看特定事物的更多信息，该事物可以是容器、网络连接、主机进程或其他许多项目。\n\n\
  ## 摘要\n\n本章介绍了如何将 Docker 日志和指标发送到远程服务。它展示了如何使用 Kibana 查看存储在 Elasticsearch 中的日志，以及如何使用\
  \ Kibana 和 Grafana 基于存储在 Elasticsearch 和 InfluxDB 中的指标构建图表和仪表板，以快速提供有用信息。还介绍了一些监控\
  \ Docker 集群中服务的一般提示。最后，介绍了 Sysdig，它可以提供对主机和容器的实时监控。下一章将介绍如何使用持续集成来构建、测试和部署容器。\n"
- "# 使用持续集成构建、测试和部署容器\n\n运行容器最重要的部分之一是构建容器所基于的镜像。毕竟，没有镜像就没有容器。一个挑战是确保 Docker 镜像不仅能够构建，而且在部署\
  \ *之前* 也能正常工作。\n\n本章将演示如何使用 GitLab 为 Docker 镜像实施 **持续集成**（CI）。它将展示如何自动构建镜像、针对其运行测试套件、将新镜像推送到\
  \ Docker Registry，甚至将新镜像部署到 Docker 集群。\n\n本章将涵盖以下主题：\n\n- 使用 CI 的重要性\n- 在 GitLab\
  \ 中为 CI 设置项目\n- 自动构建新镜像\n- 针对镜像运行测试\n- 发布经过测试的镜像\n- 自动部署镜像\n- 使用 GitLab CI 创建 DAB\
  \ 文件\n- 使用 Docker Cloud 进行镜像测试\n\n## 使用 CI 的重要性\n\n值得牢记如何定义 Docker 应用程序。在最基本的层面上，Docker\
  \ 应用程序实际上与任何软件项目没有区别。它只是一个 `Dockerfile`，而镜像所需的资源很可能存储在版本控制中。它是软件。\n\n将 Docker 应用程序视为代码意味着管理员或管理员团队可以从软件开发方法论的所有进步中受益。其中之一就是项目的自动构建和测试。这个过程称为\
  \ CI。每当对应用程序进行更改时，无论是配置文件的小改动还是对实际应用程序的升级，都可以自动重新构建和测试镜像，以确保部署时镜像能按预期工作。\n\n我经常开玩笑说，作为系统管理员，我的工作是让其他人或事物为我工作。现实是，我能让组织中其他人获得多少权力，我们就能变得多么高效。例如，想象一个正在开发\
  \ Web 应用程序的开发团队。在传统模型中，这些开发人员必须等待管理员将任何更改部署到测试和生产环境，并希望在这个过程中不会出任何问题。使用合适的 CI 工作流意味着，无论开发人员何时准备好部署，CI\
  \ 工具都可以安全地部署应用程序，而无需等待管理员抽出时间。最终结果是更快、更一致、更可靠的部署。\n\n## 使用 GitLab 进行 CI\n\nGitLab\
  \ 是 Docker 镜像和服务 CI 与部署的绝佳工具。它将 Git 与问题跟踪、Docker Registry 和 CI 相结合，提供统一的体验。然而，此过程并非\
  \ GitLab 特有。本节所学的经验无论使用什么系统都应该适用。\n\n## 为 CI 设置 GitLab\n\nGitLab CI 作为 GitLab.com\
  \ 提供服务的一部分免费提供。也可以付费购买提供更多资源的企业版许可证。GitLab 的免费社区版和商业企业版也可以本地安装。在第 3 章“集群构建块 – Registry、Overlay\
  \ Networks 和 Shared Storage”中，我们展示了如何安装 GitLab 以及如何启用 Docker Registry。\n\n**Registry**\
  \ 是使 CI 工作的重要部分。它为成品镜像在集群中使用提供存储位置。可以使用其他 Registry 代替 GitLab。例如，组织可以选择使用 Docker\
  \ Hub 或 Docker Datacenter 中的安全 Registry。\n\n从 GitLab 8.0 开始，GitLab CI 已完全集成到主程序包中。除了一个例外外，在\
  \ GitLab 中无需再安装或启用其他内容即可使用这些功能。最后需要的组件是 GitLab Runner。\n\n## 在 Ubuntu 上安装 GitLab\
  \ Runner\n\nGitLab Runner 的工作是执行实际的镜像构建。每个构建都会排队并依次处理。可以使用多个 Runner 来允许并行执行多个构建。Runner\
  \ 可以打标签以运行特定任务，例如构建 Docker 镜像或为 Microsoft Windows 构建应用程序。\n\nGitLab.com 提供了一个可用于构建镜像的共享\
  \ Runner。这对于较小的项目或测试非常有用。较大的组织应考虑购买企业版许可证或在本地安装自己的 Runner。如果镜像测试包含敏感信息，或者需要连接到无法从\
  \ Internet 访问的资源，也可能希望使用本地 Runner。\n\n运行 GitLab Runner 的首选方法是将其原生安装在 Debian、Ubuntu、RHEL\
  \ 或 CentOS 上。但是，也有官方 Docker 镜像。有关使用该镜像的详细信息，请参阅 https://gitlab.com/gitlab-org/gitlab-ci-multi-runner/blob/master/docs/install/docker.md。\n\
  \n\n\n\n安装用于构建 Docker 镜像的 runner 的第一步是安装 Docker。构建过程需要能够拉取镜像、构建新镜像，并将构建完成的镜像推送到仓库中。\n\
  \nGitLab 提供了一个脚本，用于将其 apt 仓库添加到服务器中。下载该脚本，仔细检查它是否会按预期执行，然后运行它。出于安全考虑，请不要将下载内容直接通过管道传输给\
  \ sudo bash：\n\n```\n$ wget -O script.deb.sh\nhttps://packages.gitlab.com/install/repositories/runner/gitlab-ci-multi-runner/script.deb.sh\n\
  $ sudo bash script.deb.sh\n```\n\n该脚本将 GitLab 的 GPG 密钥添加到 apt 密钥环，添加仓库，并运行 apt-get\
  \ update。完成后，即可安装 runner：\n\n```\n$ apt-get install gitlab-ci-multi-runner\n```\n\
  \nrunner 不必部署在 GitLab 服务器上。如果负载是问题，runner 可以安装在多个服务器或云服务提供商上。GitLab 还可以根据 Docker\
  \ Machine 支持的任何提供商自动扩展 runner 数量。详情请参阅 https://docs.gitlab.com/runner/install/autoscaling.html。\n\
  \n### 注册 runner\n\n安装 runner 后，必须将其注册到 GitLab。有两种方法。第一种是为单个项目注册。在这种情况下，runner 仅针对特定项目的构建运行。另一种选项是全局注册。这将使\
  \ runner 可用于 GitLab 中的每个项目。两种方法都有优缺点，但它们并非互斥。可以配置一个或多个全局 runner 用于通用目的，以及专门用于某个项目的其他\
  \ runner。\n\n在将 runner 注册到 GitLab 之前，需要注册令牌。对于项目特定的 runner，请转到项目的 Runner 设置页面。特定\
  \ Runner 部分将显示注册 runner 时使用的 URL 和令牌：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_228_0.png)\n\
  \n对于共享 runner，以管理员身份登录后，注册令牌位于 **管理区域** 中的 **Runner** 页面（扳手图标）。URL 与项目特定 runner\
  \ 的 URL 相同：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_229_0.png)\n\n有多种方法可以创建可用于构建\
  \ Docker 镜像的 runner。最简单的是使用 shell 执行器。它旨在运行任何 shell 命令来构建项目。它适用于几乎任何类型的项目，包括 Docker。`gitlab-runner`\
  \ 用户必须在 `docker` 组中，或否则拥有运行 `docker` 的权限。\n\n以下命令用于注册 runner。将 `$GITLAB_URL` 替换为项目\
  \ **Runner** 页面上列出的 GitLab 安装的 CI URL。如果使用 `GitLab.com`，URL 将是 `https://gitlab.com/ci`。`$REGISTRATION_TOKEN`\
  \ 令牌是项目特定或全局 **Runner** 页面上的令牌：\n\n```\n$ sudo gitlab-ci-multi-runner register -n\
  \ \\\n--url $GITLAB_URL \\\n--registration-token $REGISTRATION_TOKEN \\\n--executor\
  \ shell \\\n--description \"Shell Runner\"\n```\n\n另一种选项是运行 docker-in-docker 执行器。该执行器在包含\
  \ Docker 和 Docker Compose 的 Docker 容器中构建项目：\n\n```\n$ sudo gitlab-ci-multi-runner\
  \ register -n \\\n  --url $GITLAB_URL \\\n  --registration-token $REGISTRATION_TOKEN\
  \ \\\n  --executor docker \\\n  --description \"Docker Runner\" \\\n  --docker-image\
  \ \"docker:latest\" \\\n  --docker-privileged\n```\n\nrunner 容器必须以特权模式运行，才能运行构建容器。\n\
  \n## 启用 Docker 仓库\n\n在开始构建过程之前，下一步是启用 Docker Registry。GitLab 提供了一个可以按项目启用的注册表服务。设置说明在第\
  \ 3 章，集群构建模块 – 注册表、覆盖网络和共享存储。如果已经设置好或正在使用 GitLab.com，请转到编辑项目，并确保勾选容器注册表旁边的框。\n\n\
  GitLab 注册表是一个不错的选择，因为它与 GitLab 和 CI 流程集成。如果需要，也可以使用其他注册表。如果使用其他注册表，请为 runner 设置一个具有权限将新镜像推送到注册表的帐户。\n\
  \n## 将项目添加到仓库\n\n最后，需要将项目添加到 GitLab 中的 Git 仓库。这可以使用标准 git 命令完成。以下是基本脚本。如果 Docker\
  \ 配置已经在 Git 中，只需要最后两个命令。请务必更改远程仓库的 URL 以匹配您的仓库：\n\n```\n$ git init\n$ git add .\n\
  $ git commit -m 'initial commit'\n$ git remote add origin http://gitlab.example.com/project/repo\n\
  $ git push -u origin master\n```\n\n以下示例将使用一个非常简单的 Docker 镜像。它是带有单页网站的 Nginx Web\
  \ 服务器。以下是 Dockerfile：\n\n```\nFROM nginx:1.10\nCOPY index.html /usr/share/nginx/html/\n\
  ```\n\n本节描述的 CI 流程的完整示例可在 GitLab 上获得。每个分支都是每个步骤的完整示例。从 https://gitlab.com/perlstalker/ci-demo\
  \ 下载示例。\n\n## 创建 .gitlab-ci.yml\n\nCI 通过存储库根目录中名为 .gitlab-ci.yml 的文件进行配置。此 YAML\
  \ 文件定义了构建、测试和部署镜像所需的构建阶段、变量和作业。可以定义任意数量的作业，并且作业可以并行运行。有关 .gitlab-ci.yml 中可用选项的完整详细信息，请参阅\
  \ https://docs.gitlab.com/ce/ci/yaml/README.html。\n\n以下 .gitlab-ci.yml 示例是一个简单配置，可以构建镜像并将其推送到注册表。此示例使用\
  \ docker-in-docker 执行器。在使用带本地 runner 的 shell 执行器时，可以省略前三行：\n\n```\nimage: docker:latest\n\
  services:\n  - docker:dind\n\nstages:\n  - build\n  - test\n  - release\n  - deploy\n\
  \nvariables:\n  DOCKER_CI_IMAGE: registry.gitlab.com/perlstalker/ci-demo:$CI_BUILD_REF_NAME\n\
  \nbefore_script:\n  - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN registry.gitlab.com\n\
  \nbuild-image:\n  stage: build\n  tags:\n    - docker\n  script:\n    - docker build\
  \ --pull -t $DOCKER_CI_IMAGE .\n    - docker push $DOCKER_CI_IMAGE\n```\n\n`stages`\
  \ 选项定义作业可以配置为在其中运行的阶段列表。可以定义任意数量的阶段以满足项目需求。这里列出的四个阶段，`build`、`test`、`release` 和\
  \ `deploy`，是典型的。每个阶段按列出的顺序运行。先运行 `build` 阶段的作业，然后是 `test`，依此类推。如果每个阶段中有多个作业，则它们并行运行。\n\
  \n`variables` 选项允许定义用于其余构建过程的变量。在示例中，名为 `$DOCKER_CI_IMAGE` 的变量设置为将要构建的镜像名称。镜像名称包含\
  \ `$CI_BUILD_REF_NAME` 变量，这是一个内置变量，设置为分支或标签名称。应为特定项目更改 `$DOCKER_CI_IMAGE` 的值。\n\n\
  使用 `$CI_BUILD_REF_NAME` 非常有用，尤其是在测试新镜像或准备新版本时。在测试期间，创建新分支意味着生成的镜像将标记为分支名称。例如，如果创建名为\
  \ `foo` 的分支，则新镜像将是 `image:foo`。\n\nGitLab 提供了一系列可在 CI 配置中使用的有用变量。完整列表可在 https://docs.gitlab.com/ce/ci/variables/README.html\
  \ 上找到。\n\nGit 标签也会生成带有该标签的镜像。例如，如果将 `1.1` 标签添加到提交，则会创建名为 `image:1.1` 的新镜像。这样可以轻松创建用于部署的版本化镜像。请记住，使用\
  \ `image:version` 而不是 `image:latest` 可以更轻松地跟踪集群上运行的确切内容，并在发生故障时轻松回滚到之前的镜像版本。\n\n\
  `before_script` 选项包含一组命令列表，用于在每个作业之前准备环境。在此示例中，它使用特殊 CI 帐户和构建令牌登录到 GitLab Docker\
  \ 注册表。构建令牌暂时授予构建者触发构建的用户的权限。如果使用不同的注册表，则将使用该注册表的登录凭据。\n\n最后一个块是名为 `build-image`\
  \ 的作业。`stage` 选项指示此作业将在哪个阶段运行。在此情况下，`build-image` 作业在 `build` 阶段运行。如果在同一阶段中定义了多个作业，则它们并行运行。\n\
  \n\n\n\n作业可以定义一个 `tags` 列表，用于指定使用哪个运行器。在前面的示例中，镜像将由带有 `docker` 标签的运行器构建。如果设置了多个标签，运行器必须匹配所有标签才能被使用。这使得可以创建能够构建某些类型项目而不能构建其他项目的运行器。\n\
  \n最后，`script` 选项是用于构建项目的命令列表。每个命令必须在下一个命令运行之前成功。如果其中任何一个失败，构建将停止并标记为失败。命令可以是示例中的常规系统命令，也可以是来自仓库的脚本。\n\
  \n在此示例中，运行器先构建镜像。`--pull` 标志与 `docker build` 一起使用，以确保使用基础镜像的最新副本来构建新镜像。如果构建成功，新镜像将被推回仓库。可用镜像列表可在项目页面的\
  \ **镜像仓库** 部分中查看：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_233_0.png)\n\n当前构建以及之前构建的状态可在项目的\
  \ **流水线** 部分中查看。点击任何构建可深入查看每个构建阶段的状态。点击阶段将显示该阶段的构建日志。失败构建生成的任何错误都将显示在那里：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_234_0.png)\n\
  \n## 测试镜像\n\nCI 之所以在软件开发者中如此受欢迎，原因之一是它提供了一种方式，可以自动针对新构建运行测试套件，以确保其正常工作。测试提供了一种安全保障，确保无论开发者做出了哪些更改，都不会破坏软件的功能。这对于将要部署到潜在成百上千台服务器的\
  \ Docker 镜像同样有价值。\n\n实现测试有多种方式：\n\n- 第一种方法是将测试包含在 `git` 仓库中，但不将其添加到镜像中。这样可以保持镜像较小，但要求运行器上安装了测试所需的所有工具。某些运行器（例如\
  \ docker-in-docker 执行器）可能不包含运行测试所需的工具。\n\n- 第二种方法是将测试包含在 Docker 镜像中。然后可以使用 `docker\
  \ run` 或 `docker exec` 从容器内运行测试。这会导致镜像更大，但确保了测试镜像所需的所有工具都可用。它还使得可以随时在运行中的镜像上运行测试。如果某些问题仅在镜像在生产环境中运行时才会出现，这可能会很有用。\n\
  \n- 第三种选择是创建一个包含验证镜像所需所有测试的单独镜像。该镜像可以由 GitLab 在测试阶段下载并运行，以测试应用程序镜像。这种方法的好处是，随着新测试用例的出现，测试和测试镜像可以独立更新。\n\
  \n让我们看看本示例中使用的非常简单的网页：\n\n```\n<html>\n<head><title>Docker Orchestration</title></head>\n\
  <body>\n<h1>Docker Orchestration is fun!</h1>\n<p>Automate all the things!</p>\n\
  </body>\n</html>\n```\n\n老板决定网页必须始终宣称 Docker 编排有多么有趣。为此，创建了一个测试以确保它始终有趣。在此示例中，它位于\
  \ tests 目录中，并命名为 run-tests.sh：\n\n```\n#!/bin/sh\ncurl -s http://localhost | grep\
  \ 'fun!</h1>' > /dev/null\n```\n\n此测试非常简单。它访问网页并检查 fun! 是否是标题中的最后一项。为了简化，测试将被添加到镜像中。更新后的\
  \ Dockerfile 如下。它做了两件事。首先，它添加了测试所需的 curl。其次，它将测试添加到镜像中的 /tests 目录：\n\n```\nFROM\
  \ nginx:1.11\nRUN apt-get update && apt-get install -y curl && apt-get clean\nCOPY\
  \ index.html /usr/share/nginx/html/\nCOPY tests /tests\n```\n\n要运行测试，需要在 .gitlab-ci.yml\
  \ 中添加一个新作业。以下代码片段显示了该作业。一旦 .gitlab-ci.yml 在仓库中更新，未来的提交将运行测试：\n\n```\ntest-image:\n\
  \  stage: test\n  tags:\n    - docker\n  script:\n    - docker pull $DOCKER_CI_IMAGE\n\
  \    - docker run -d -P --name $CI_BUILD_ID $DOCKER_CI_IMAGE\n    - docker run --rm\
  \ --network container:$CI_BUILD_ID --name $CI_BUILD_ID-test\n      --entrypoint\
  \ /tests/run-tests.sh $DOCKER_CI_IMAGE\n    - docker stop $CI_BUILD_ID; docker rm\
  \ -f $CI_BUILD_ID\n```\n\nstage 选项被设置，以便作业将在 test 阶段运行。如果构建阶段失败，此作业不会运行。它还包含 Docker\
  \ 标签，因此 GitLab 将使用也标记为 Docker 的运行器。\n\nscript 部分列出了用于测试镜像的命令。前两个命令下载镜像并在后台运行它。容器名称设置为\
  \ $CI_BUILD_ID，这是 GitLab 分配给构建的唯一构建 ID。设置名称很重要，因为运行测试时会用到它。\n\nscript 块中的第三个条目运行实际测试。它启动一个新容器，该容器共享目标容器的网络。这样测试就可以连接到\
  \ localhost 上的 Web 服务器。测试容器运行前面显示的测试脚本。如果脚本中的模式未匹配，grep 将失败，测试将返回非零退出码，GitLab 将其解释为失败。如果脚本中找到了该模式，测试成功，流程继续。\n\
  \n最后一行停止目标容器并将其删除。运行测试的容器在测试完成后会自动删除，因为启动它时使用了 --rm。\n\n## 清理作业\n\n前面的测试作业在测试成功时效果很好，但当测试失败时，它可能会让测试容器继续运行。当使用\
  \ GitLab.com 上的共享运行器时，这不是问题，因为每个测试都会启动一个新 VM，并在构建过程完成后立即将其删除。但是，当使用本地运行器时，这可能会成为问题。在这种情况下，可能需要一个作业在测试后进行清理。\n\
  \n首先，创建一个新的 `cleanup_test` 阶段，并定义一个名为 `cleanup_tests` 的作业在 `cleanup_test` 阶段中运行。通常，如果\
  \ `test` 阶段中的作业失败，之后的作业都不会运行。`cleanup_tests` 作业通过使用 `when` 选项来绕过这一限制。将其设置为 `always`，无论\
  \ `test` 阶段中发生什么，作业都会运行。`when` 选项还可以设置为 `on_success` 或 `on_failure`，以便仅在作业成功或失败时分别运行该作业。还有一个第四个选项\
  \ `manual`，将在本章后面介绍。以下代码片段展示了如何创建一个在 CI 过程完成后进行清理的作业：\n\n```\nstages:\n  - build\n\
  \  - test\n  - cleanup_test\n  - release\n  - deploy\n\n...\n\ntest-image:\n  stage:\
  \ test\n  tags:\n    - docker\n  script:\n    - docker pull $DOCKER_CI_IMAGE\n \
  \   - docker run -d -P --name $CI_BUILD_ID $DOCKER_CI_IMAGE\n    - sh tests/run-tests.sh\
  \ $CI_BUILD_ID\n\ncleanup_tests:\n  stage: cleanup_test\n  script:\n    - docker\
  \ stop $CI_BUILD_ID; docker rm -f $CI_BUILD_ID\n  when: always\n```\n\n## 发布镜像\n\
  \n`build-image` 作业每次将更改推送到 `git` 仓库时都会创建一个更新的镜像。让我们更仔细地看看创建了什么。示例中的 `docker build`\
  \ 命令正在创建名为 `registry.gitlab.com/perlstalker/ci-demo:$CI_BUILD_REF_NAME` 的镜像。`$CI_BUILD_REF_NAME`\
  \ 变量是分支或标签的名称。这意味着，到目前为止，唯一创建的镜像是 `registry.gitlab.com/perlstalker/ci-demo:master`。没有\
  \ `:latest` 镜像。如果有人尝试运行 `docker run registry.gitlab.com/perlstalker/ci-demo`，该命令将失败，因为带有隐含\
  \ `latest` 标签的镜像不存在。\n\n\n\n\nGitLab 不会自动为镜像打上 `latest` 标签，这是一个特性。其理念是在 `.gitlab-ci.yml`\
  \ 的 CI 计划中显式地为镜像打标签。这通过创建一个新作业来实现。`.gitlab-ci.yml` 的片段如下：\n\n```yaml\nvariables:\n\
  \  DOCKER_CI_IMAGE: registry.gitlab.com/perlstalker/ci-demo:${CI_BUILD_REF_NAME}\n\
  \  DOCKER_RELEASE_IMAGE: registry.gitlab.com/perlstalker/ci-demo:latest\n...\nrelease-image:\n\
  \  stage: release\n  tags:\n  - docker\n  script:\n  - docker pull $DOCKER_CI_IMAGE\n\
  \  - docker tag $DOCKER_CI_IMAGE $DOCKER_RELEASE_IMAGE\n  - docker push $DOCKER_RELEASE_IMAGE\n\
  \  only:\n  - master\n```\n\n第一个区别是添加了一个名为 `$DOCKER_RELEASE_IMAGE` 的新变量，用于指定发布镜像的名称。\n\
  \n![](img/02bead9c8ff4515f78dac0eb33163961_238_0.png)\n\n请注意，镜像标签是 `latest`。\n\n\
  与往常一样，工作在 `script` 块中完成。第一步是拉取该分支的最新镜像副本。接下来，`docker tag` 使用发布镜像名称对该镜像打标签。具体来说，它被赋予了\
  \ `latest` 标签。最后，`docker push` 命令将新打标签的镜像推送回仓库。\n\n`only` 块很重要。它告诉 GitLab，此作业仅在构建列出的某个分支时才能运行。在此例中，是\
  \ `master`。如果没有 `only` 块，任何分支构建的任何新镜像都将替换 `latest` 镜像。\n\n此配置的好处是，可以在不同分支中处理新镜像，并为这些分支创建镜像。这些镜像可以分别运行、测试和调试，而无需修改已发布的镜像。当更改准备就绪时，开发分支可以合并回\
  \ `master` 分支，并创建一个新的 `latest` 镜像。\n\n## 部署镜像\n\n让我们停下来看看当前进度。此时，每当更改推送到 GitLab\
  \ 中的 Git 仓库时，项目的新 Docker 镜像都会自动构建。正在针对新镜像运行测试套件，以确保其按预期工作。如果更改推送到 `master` 分支，则会创建一个新的发布镜像。剩下的唯一工作就是将镜像部署到集群。\n\
  \n镜像的部署方式将取决于所选的编排套件。在大多数情况下，只需运行执行服务滚动更新的命令即可。自动化部署作业的片段如下：\n\n```yaml\ndeploy-to-dev:\n\
  \  stage: deploy\n  tags:\n    - docker\n  environment: development\n  script:\n\
  \    - ./deploy.sh $DOCKER_CI_IMAGE development\n  only:\n    - master\n```\n\n\
  此处有几点需要注意。首先，`stage` 设置为 `deploy`。仅当 `build`、`test` 和 `release` 阶段均成功完成时，作业才会运行；`environment`\
  \ 是可选的。项目中 **流水线** 部分下的 **环境** 页面可以轻松跟踪不同环境的部署：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_240_0.png)\n\
  \n片段中的 `deploy.sh` 脚本是一个占位符。脚本可以包含在你的环境中部署镜像所需的任何内容。脚本也可以直接包含在 `script` 块中。本章后面将展示如何将镜像部署到\
  \ Kubernetes 集群。\n\n> **提示** 在部署的 `only` 部分中，考虑使用 `tags` 关键字而不是分支名称。这样将仅限制对已打标签的提交进行部署。这将确保所有部署的镜像都使用该标签。根据镜像上的标签，更容易判断容器正在运行哪个版本的镜像。\n\
  \n## 手动部署镜像\n\n将镜像自动部署到集群很令人兴奋。也许太令人兴奋了。不是所有人都希望服务自动更新。这并不意味着 GitLab 不能用于部署。GitLab\
  \ 提供了一种配置作业手动运行的方式。构建过程将照常运行，但当遇到手动作业时，它将等待，直到有人告诉 GitLab 可以继续。这既提供了自动化部署的一致性，又允许人工决定是否执行部署。\n\
  \n以下 .gitlab-ci.yml 片段展示了如何创建带有手动触发器的作业。它基本上与前面的自动化部署相同。唯一的功能变化是 `when` 标签：\n\n\
  ```yaml\ndeploy-to-prod:\n  stage: deploy\n  tags:\n    - docker\n  environment:\
  \ production\n  script:\n    - ./deploy.sh $DOCKER_CI_IMAGE production\n  only:\n\
  \    - master\n  when: manual\n```\n\n将 `when` 设置为 `manual` 将暂停构建和部署过程，直到有人进入 Pipelines，点击构建，然后点击部署。以下截图显示了构建管道：\n\
  \n![](img/02bead9c8ff4515f78dac0eb33163961_241_0.png)\n\n请注意，所有作业都已成功。只有 `deploy-to-prod`\
  \ 作业未成功。三角形播放按钮显示 `deploy-to-prod` 作业正在等待 `manual` 操作。点击该按钮时，部署将开始。\n\n可以定义任意数量的部署作业以满足各种需求。例如，完全自动化的作业可以将新镜像部署到开发环境。然后，手动作业可以触发部署到\
  \ QA 或金丝雀环境。最后，另一个手动作业可以将镜像完全部署到生产环境。这可以通过如图所示的并行作业，或作为单独的构建阶段来完成。使用单独的阶段可确保每个先前的部署在最终推送到生产环境之前均已完成。\n\
  \n## 部署到 Kubernetes\n\n前面的示例使用了一个虚拟部署脚本。让我们看看如何使用 GitLab CI 将新镜像部署到 Kubernetes。在第\
  \ 5 章《使用 Kubernetes 部署和管理服务》中，我们介绍了在 Kubernetes 中管理部署。\n\n以下 .gitlab-ci.yml 片段做出了几个假设：\n\
  \n- 首先，runner 机器上安装了 kubectl，且 gitlab-runner 用户有权修改 Kubernetes 集群\n- 其次，已创建一个将由构建过程更新的部署：\n\
  \n```yaml\nvariables:\n  DOCKER_CI_IMAGE: registry.gitlab.com/perlstalker/ci-demo:$CI_BUILD_REF_NAME\n\
  \  DOCKER_RELEASE_IMAGE: registry.gitlab.com/perlstalker/ci-demo:latest\nDEPLOYMENT:\
  \ ci-demo\nCONTAINER: web\n...\ndeploy-to-kube:\n  stage: deploy\n  tags:\n    -\
  \ kubectl\n  environment: production\n  script:\n    - kubectl set image deployment/$DEPLOYMENT\n\
  \      $CONTAINER=$DOCKER_CI_IMAGE\n  only:\n    - tags\n  when: manual\n```\n\n\
  配置中添加了两个新变量，DEPLOYMENT 和 CONTAINER。它们分别包含要更新的部署名称以及该部署中的容器名称。\n\n例如，作业上设置了 kubectl\
  \ 标签。预期是有一个带有 kubectl 标签的 runner 可用，其 kubectl 已配置为管理集群。这使得创建仅用于部署且不用于其他构建作业的 runner\
  \ 变得容易。\n\n脚本仅包含更新部署中镜像的命令。不需要在 runner 上对镜像做任何操作。运行该部署的 Kubernetes 节点将根据 pod 的部署策略对容器执行更新。\n\
  \n最后，`only` 块告诉 GitLab 仅在构建设置了 git 标签时才运行此作业。这将确保构建的镜像具有与之前运行的不同标签。如果镜像名称与部署当前使用的相同，Kubernetes\
  \ 将不知道需要更新镜像。\n\n## 构建 DAB 文件\n\nDocker Swarm 正在转向使用分布式应用程序包 (DAB) 来定义部署堆栈。可以使用\
  \ GitLab CI 为项目自动构建 DAB 文件。以下片段假设 docker-compose.yml 位于项目的根目录中：\n\n```yaml\nbuild-dab:\n\
  \  stage: release\n  tags:\n    - docker\n  script:\n    - docker-compose bundle\n\
  \  artifacts:\n    paths:\n      - *.dab\n    name: \"${PROJECT_NAME}-${CI_BUILD_REF_NAME}\"\
  \n```\n\n`script` 块运行 `docker-compose bundle`，这将生成 .dab 文件。如果需要，可以向命令添加其他选项。`artifacts`\
  \ 块告诉 GitLab，构建过程生成了重要文件。在此示例中，如果构建成功，将保存 .dab 文件。路径列表中匹配的所有文件都将添加到 artifacts 存档文件中。\n\
  \n\n\n最后，name 选项提供 artifact 存档的名称。在此示例中，它是存档名称与构建引用名称，中间用连字符分隔。例如，如果项目名为 ci-demo\
  \ 且正在构建 master 分支，则名称将为 ci-demo-master。artifact 存档文件将命名为 ci-demo-master.zip。\n\n\
  ## 使用 Docker Cloud 进行 CI\n\nDocker Hub 和 Docker Cloud 可在关联的 Git 仓库更新时自动更新镜像。如果 GitLab\
  \ 对于此项工作来说过于复杂，这可以用于轻量级 CI。无论哪种情况，都可以编写自定义工具来针对测试套件运行新生成的镜像，也可以手动运行和测试它们。\n\nDocker\
  \ Cloud, in particular, can be useful for testing images. It can auto build an image\
  \ every time the project is updated in GitHub or Bitbucket. Once the image is built,\
  \ it can be started as a service in a test cluster from the web interface.\n\nTo\
  \ start, click on the Repositories link and click on Create to create a new repository.\
  \ Link the new repository to GitLab or Bitbucket by clicking on the appropriate\
  \ icon at the bottom of the creation page. When everything is ready, click on Create:\n\
  \n![](img/02bead9c8ff4515f78dac0eb33163961_244_0.png)\n\n### Enabling autobuilds\n\
  \nAutobuilds can be created any time after a repository is created by selecting\
  \ the repository from the **Repositories** page and clicking on the **Builds** tab.\
  \ Configure the build settings and click on **Save** to save the settings or **Save\
  \ and Build** to save and immediately build the project.\n\n![](img/02bead9c8ff4515f78dac0eb33163961_245_0.png)\n\
  \nBy default, a new build will be generated every time a commit is pushed to the\
  \ `master` branch. Additional build rules can be created to fit the needs of the\
  \ project. For example, whenever a new version tag is pushed to Git, Docker Cloud\
  \ can build a new image that uses that version for the image label.\n\n### Testing\
  \ the image\n\nOnce a repository has an image, it can be deployed as a service in\
  \ the following steps:\n\n- Click on the Launch Service button from the General\
  \ tab and a new page will load with all of the deployment options. That page allows\
  \ one to set nearly any option that is available with `docker run`.\n- When all\
  \ of the settings are ready, click on Create & Deploy. Docker Cloud will run the\
  \ service on any nodes that have been configured:\n\n![](img/02bead9c8ff4515f78dac0eb33163961_246_0.png)\n\
  \nOnce the service has started, the list of containers will be available in the\
  \ Containers list or in the details of the service in the Services section.\n\n\
  - To log in to the container's console, click on the container and go to the Terminal\
  \ tab. The tests can be run from there:\n\n![](img/02bead9c8ff4515f78dac0eb33163961_247_0.png)\n\
  \n### Summary\n\nThis chapter showed how to use CI with Docker. It showed how to\
  \ use GitLab to automatically build, test, release, and deploy new images. It also\
  \ showed how to use Docker Cloud to automatically build images and run them for\
  \ testing. In the next chapter, you will learn how to automate the infrastructure\
  \ that the cluster runs on.\n"
- "# Why Stop at Containers? Automating Your Infrastructure\n\nThe last nine chapters\
  \ have talked a lot about automating Docker. That is what this book is about, after\
  \ all. It is important to remember that there is more to a Docker cluster than just\
  \ Docker. There is the registry, shared storage, overlay networks, and the actual\
  \ orchestration tool, be it Swarm, Kubernetes, Mesos, or something else. There is\
  \ one last, very important piece to the puzzle. The servers that all of that run\
  \ on. Whether those servers are hardware or part of a public cloud, they too need\
  \ to be managed. After all, what good is it if the Docker orchestration tool can\
  \ quickly scale an image out if it takes hours to deploy a new Docker host?\n\n\
  This chapter will look at strategies and tools that can be used to automate the\
  \ server-side of a Docker cluster. It will start by examining the servers themselves,\
  \ then move on to options for running those machines in the cluster. Finally, it\
  \ will look at options for removing servers from the cluster.\n\nThe following topics\
  \ will be covered:\n\n- Using configuration management on the server\n- Configuring\
  \ a server on boot with Cloud-Init\n- Using and building specialized server images\n\
  - Deploying new servers on AWS and Azure\n- Using Terraform to orchestrate cloud\
  \ servers\n- Deploying a new cluster with Docker Cloud\n- Removing servers from\
  \ the cluster\n\n## Configuring Docker hosts\n\nIn many ways, Docker abstracts the\
  \ server away from the application. It no longer matters which Linux distribution\
  \ a server is running. A Docker application can be based on any distribution available.\
  \ Multiple applications can run on the same server and use different base images.\
  \ Despite that, without the server, nothing runs.\n\nIn Chapter 9, Using Continuous\
  \ Integration to Build, Test, and Deploy Containers, we discussed the importance\
  \ of having a consistent build process for Docker images because doing so provides\
  \ consistency and reliability. The same is true for the servers those applications\
  \ run on. If the servers are not consistent, it could cause problems for the containers\
  \ running on them. This section will discuss different ways of ensuring that the\
  \ server images are consistent.\n\n## Using configuration management\n\nConfiguration\
  \ management has been around on servers in many forms for decades. Sometimes it\
  \ was as simple as mounting /usr from a remote server or using rcp, scp, or rsync\
  \ to keep configurations in sync. Later, more powerful tools, such as CFEngine,\
  \ Puppet, Chef, and Ansible, came along that managed everything from configuration\
  \ files and installed applications, to managing local users and running services.\n\
  \nConfiguration management is an important and powerful tool for any orchestrated\
  \ cluster. It can perform two important tasks for a server. First, it can set up\
  \ a server from just the base operating system. It ensures that everything is installed,\
  \ configured, and running. Second, it makes sure that everything that was installed,\
  \ configured, and running remains so.\n\nFirst things first. Puppet needs to be\
  \ installed on the host:\n\n![](img/02bead9c8ff4515f78dac0eb33163961_249_0.png)\n\
  \n> Note that this is a manual step on an existing server.\n\n```\n$ sudo apt-get\
  \ install puppet\n```\n\nNow that Puppet is installed, a manifest can be created\
  \ to install Docker. The following sample installs Docker on an Ubuntu server and\
  \ ensures that the `docker` service is running:\n\n```\nnode default {\n exec {\
  \ 'install docker' :\n command => \"/usr/bin/wget -O - http://get.docker.com |\n\
  \ /bin/bash\",\n creates => '/etc/apt/sources.list.d/docker.list',\n }\n}\n\npackage\
  \ { \"docker-engine\" :\n ensure => \"installed\",\n require => Exec['install docker']\n\
  \ }\n\nservice { \"docker\" :\n ensure => \"running\",\n require => Package['docker-engine']\n\
  \ }\n}\n```\n\nThis manifest defines a default node. This means that this manifest\
  \ will be applied to any node that does not match a more specific node definition.\
  \ Puppet best practice is to only use modules in node definitions. This example\
  \ breaks that practice in favor of brevity and simplicity.\n\nThe `exec` resource\
  \ checks to see if `/etc/apt/sources.list.d/docker.list` exists, and if not, runs\
  \ the install script from `get.docker.com`. The script will create `docker.list`\
  \ and install Docker. This example uses the security nightmare of downloading the\
  \ script and piping it directly to bash. In a production environment, the verified\
  \ script should be added to the server as a puppet resource.\n\nThe `package` resource\
  \ ensures that the `docker-engine` package is installed. If, for some reason, `docker-engine`\
  \ is uninstalled, Puppet will re-install it on the next run. The `require` option\
  \ tells Puppet that the `install docker` resource must have happened first.\n\n\
  Finally, the `service` resource ensures that the `docker` service is running. If\
  \ the service is stopped, Puppet will attempt to restart it. This resource requires\
  \ that the `docker-engine` package is installed before it tries to start the service.\n\
  \n> There is a very useful module from Puppetlabs to manage Docker, images, and\
  \ containers on a host. For more details, refer to https://forge.puppet.com/puppetlabs/docker_platform.\n\
  \n\n\n\n\n当清单准备就绪后，如果在无主模式下运行，可以使用 `puppet apply` 将其应用到服务器，或者在使用 Puppet Server 时使用\
  \ puppet agent：\n\n```\n$ puppet apply docker-host.pp\nNotice: Compiled catalog\
  \ for ubuntu in environment production in 0.43 seconds\nNotice: /Stage[main]/Main/Node[default]/Exec[install\
  \ docker]/returns:\nexecuted successfully\nNotice: Finished catalog run in 31.86\
  \ seconds\n```\n\nPuppet Server 为向集群中的服务器分发清单提供了便捷方式。关于配置 Puppet Server 的文档可在 https://docs.puppet.com/puppetserver/latest/services_master_puppetserver.html\
  \ 上找到。\n\n此配置所做的一切就是安装 Docker。将其添加到集群是另一回事。应编写检查以查看主机是否属于集群，如果不是，则运行适当的命令加入集群。这些脚本将根据所使用的编排工具而有所不同。\n\
  \n以下代码片段中的 `exec` 资源运行 `docker swarm join`，如果成功，则触碰 `/root/swarm-joined` 文件：\n\n\
  ```\nexec { 'join swarm' :\n  command => \"/usr/bin/docker swarm join --token SWMTKN-...\
  \ manager:2377\n&& /usr/bin/touch /root/swarm-joined\",\n  creates => '/root/swarm-joined'\n\
  }\n```\n\n每次运行 `puppet apply` 时，它都会检查 `/root/swarm-joined` 是否存在。如果不存在，Puppet 将重新运行加入\
  \ swarm 的命令。这是一个过于简单的检查，因为它不会尝试重新建立与 swarm 的连接。但是，如果节点之前已成功加入，它将尝试自行重新加入。\n\n##\
  \ 引导时配置服务器\n\n使用配置管理来配置主机很棒，但这也存在一个问题。第一次需要手动安装 Puppet 并运行 `puppet apply`。在自动化环境中，手动步骤越少，出现遗漏或执行不一致的可能性就越小。\n\
  \n有一个名为 **Cloud-Init** 的解决方案，它对运行在云环境中的服务器效果非常好。Cloud-Init 是专门为处理在 AWS 和类似服务中启动的服务器配置问题而创建的。基础镜像初始使用没问题，但在服务器启动时，用户账户和应用程序等内容需要添加或运行，而且人们不想手动登录到每台机器来添加它们。\n\
  \nCloud-Init 在本书中已经出现过好几次。*第 1 章，Docker 编排入门* 展示了如何使用它为 CoreOS、RancherOS 和 Project\
  \ Atomic 主机添加登录凭据。它在 *第 3 章，集群构建模块 – 注册表、覆盖网络和共享存储* 和 *第 7 章，使用更简单的编排工具 – Fleet\
  \ 和 Cattle* 中再次出现，用于在 CoreOS 上启用 Flannel 和 Fleet。Ubuntu、RHEL、Fedora 和 CentOS 的云镜像均支持\
  \ Cloud-Init。\n\nCloud-Init 的配置文件是一个 YAML 文件，第一行以 `#cloud-config` 开头。它通常通过名为 `user-data`\
  \ 的字段添加到新服务器实例中。它也可以通过挂载的磁盘（例如 CD-ROM）来提供。完整文档可在 https://cloudinit.readthedocs.io/en/latest/index.html\
  \ 上找到。\n\n首先假设要启动的镜像需要安装 Docker 并加入 Docker Swarm。以下示例展示了如何同时完成这两项工作。它首先下载并运行 Docker\
  \ 安装脚本。然后 Cloud-Init 将运行加入 Docker Swarm 的命令：\n\n```\n#cloud-config\nruncmd:\n- \"\
  /usr/bin/wget -O - http://get.docker.com | /bin/bash\",\n- ['/usr/bin/docker', 'swarm',\
  \ 'join', '--token', 'SWMTKN-...',\n'manager:2377']\n```\n\nruncmd 模块接受在实例首次启动时要运行的命令列表。每个命令可以是字符串或列表。\n\
  \nCloud-Init 还可以设置并运行 Puppet。以下示例将安装 Puppet 并在引导时运行它：\n\n```\npuppet:\ninstall:\
  \ true\nconf:\nserver: \"puppet.example.com\"\ncertname: \"%i.%f\"\n```\n\nconf\
  \ 部分包含键/值对，它们将被添加到客户端 /etc/puppet/puppet.conf 的 [puppetd] 部分中。server 选项是 Puppet\
  \ 服务器的地址。certname 选项设置客户端用于身份验证的证书名称。%i 和 %f 变量分别是实例 ID 和完全限定域名。\n\n## 使用自定义镜像\n\
  \n使用配置管理或 Cloud-Init 安装和配置应用程序的问题是，这可能导致已安装软件的版本出现细微差异。此外，在服务器首次启动时安装和配置所有内容还需要额外的时间。更快且更一致的解决方案是使用专为该任务构建的自定义镜像。CoreOS\
  \ 和 Project Atomic 是两个专为运行 Docker 容器（且几乎不运行其他内容）而构建的发行版。也可以构建一个预安装了所有所需软件的自定义镜像。\n\
  \n## 使用 Packer 构建新镜像\n\nHashiCorp 创建了一个名为 Packer 的工具，可用于为 OpenStack、AWS、Azure、GCE\
  \ 和 VMWare 创建自定义镜像。它还可以为 Xen、Linux KVM 创建镜像，甚至可以通过 cobbler 部署到硬件上。\n\nPacker 配置是一个\
  \ JSON 文件。有三个主要部分，如下所示：\n\n- builders 部分是一个列表，包含要构建的镜像类型列表。\n- provisioners 部分是用于配置镜像的任务列表。这包括运行脚本、上传文件和运行配置管理。\n\
  - 最后，post-processors 部分包含构建完成后要执行的任务列表。\n\n这些任务可以生成清单、运行本地命令，或将镜像上传到 VMWare vSphere\
  \ 或 Amazon S3。\n\n可以从同一配置文件构建多个镜像。每个镜像都会在 `builders` 列表中有一个条目。这允许使用相同的 `provisioners`\
  \ 并行构建多个镜像。例如，这可以用于构建一个新镜像，以部署到 Amazon、Azure 和本地的 OpenStack。\n\n> Packer 的完整文档可在\
  \ https://www.packer.io/docs/ 上找到。\n\n### 准备 Ubuntu 云镜像\n\n此示例使用 `qemu` 构建器以便在本地\
  \ Linux 机器上轻松测试。`qemu` 构建器从基础镜像工作。默认情况下，新镜像是从 ISO 安装程序安装的，但也可以从现有磁盘镜像克隆。此示例使用 Ubuntu\
  \ 云镜像。这是大多数云提供商提供的同一基本镜像。该镜像可在 https://cloud-images.ubuntu.com 获取。\n\n云镜像是一个很好的起点，因为它是一个非常最小的服务器安装。在它可以与\
  \ Packer 一起使用之前，有两个问题需要修复。首先，`qemu` 构建器使用 SSH 登录到系统进行配置。不幸的是，没有可用的登录账户。其次，`qemu`\
  \ 构建器只能使用用户名和密码登录，但 SSH 守护进程被配置为拒绝密码身份验证。以下脚本修复了这两个问题。它必须以 root 权限运行，以便挂载镜像并进行必要的更改：\n\
  \n```bash\n#!/bin/bash\n\nIMAGES=/packer/images\nBASE=xenial-server-cloudimg-amd64-disk1.img\n\
  NEW=xenial-server-cloudimg-amd64-prep.img\nMNT=/mnt\n\ncd $IMAGES\ncp $BASE $NEW\n\
  \nmodprobe nbd max_part=16\nqemu-nbd -c /dev/nbd0 $NEW\npartprobe /dev/nbd0\nmount\
  \ /dev/nbd0p1 $MNT\nsed -i 's/^PermitRootLogin .*$/PermitRootLogin yes/'\n$MNT/etc/ssh/sshd_config\n\
  sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/'\n$MNT/etc/ssh/sshd_config\n\
  chroot $MNT sh -c 'echo \"root:s3cret-s@uce\" | /usr/sbin/chpasswd'\numount $MNT\n\
  qemu-nbd -d /dev/nbd0\nmd5sum $NEW > $NEW.md5sum\n```\n\n脚本将原始镜像复制到新文件并挂载新文件。然后它重新配置\
  \ sshd 以允许一般密码登录和特定的 root 登录。接下来，它在 chroot 中使用 chpasswd 设置 root 密码。最后，它卸载镜像并创建校验和文件。\n\
  \n与使用 root 用户不同，可以将单独的构建用户添加到镜像中。为了简化构建过程，应配置镜像以允许构建用户无需密码即可使用 sudo。然后可以在构建过程结束时删除该用户。\n\
  \n## 构建镜像\n\n既然镜像已准备就绪，可以使用它来构建新镜像。以下是一个 Packer 配置，它将构建一个新镜像，安装所有可用更新并安装 Docker：\n\
  \n```\n{\n\"builders\" : [\n{\n\"type\" : \"qemu\",\n\"iso_urls\" : [\"file:///packer/images/xenial-server-cloudimg-amd64-prep.img\"\
  \n],\n\"iso_checksum_url\" : \"file:///packer/images/xenial-server-cloudimg-amd64-prep.img.md5sum\"\
  ,\n\"iso_checksum_type\" : \"md5\",\n\"disk_image\" : true,\n\"output_directory\"\
  \ : \"/packer/images/xenial-cloudimg\",\n\"vm_name\" : \"xenial-cloudimg-amd64-custom.img\"\
  ,\n\"shutdown_command\" : \"shutdown -P now\",\n\"format\" : \"qcow2\",\n\"disk_size\"\
  \ : 20000,\n\"headless\" : true,\n\"ssh_username\" : \"root\",\n\"ssh_password\"\
  : \"s3cret-s@uce\",\n\"ssh_wait_timeout\": \"10m\"\n}\n],\n\"provisioners\" : [\n\
  {\n\"type\" : \"shell\",\n\"scripts\" : [\n```\n\n\n\n\n\n\n\"/packer/scripts/install-updates.sh\"\
  ,\n\"/packer/scripts/install-docker.sh\"\n  ]\n}\n]\n}\n\n首先是 builders 部分。唯一的条目是\
  \ qemu 构建器，由 type 设置指定。iso_* 设置指定要使用的镜像 URL、用于验证镜像的校验和文件以及校验和类型。在此例中，只有一个单独的镜像文件。由于镜像是磁盘镜像而非\
  \ ISO，因此 disk_image 设置必须设置为 true。\n\nformat 设置将输出格式设置为 qcow2。format 也可以设置为 raw。disk_size\
  \ 设置以 MB 为单位设置新磁盘镜像的大小。这设置了磁盘的大小但不会更改文件系统。当使用磁盘镜像启动 VM 时，Cloud-Init 会调整根文件系统的大小。输出目录和生成的镜像名称分别在\
  \ output_directory 和 vm_name 选项中设置。output_directory 中设置的路径可以是绝对路径，也可以是相对于运行 Packer\
  \ 的位置的相对路径。\n\n默认情况下，qemu 构建器将使用 SDL 控制台启动 VM。只有在可用 X11 时才有效。在大多数情况下，headless 设置应设置为\
  \ true。在预配置过程中，控制台可通过 VNC 访问以查看控制台。\n\nssh_* 设置控制 qemu 构建器如何为预配置连接到 VM。ssh_username\
  \ 和 ssh_password 设置设置登录 VM 所需的凭据。在此例中，它配置为使用 root 用户和准备镜像时设置的密码。VM 启动后，qemu 构建器将不断尝试连接到\
  \ SSH，但在 ssh_wait_timeout 指定的时间后会放弃。确保超时时间为 VM 启动提供足够的时间。\n\nprovisioners 部分是用于预配置镜像的预配置器列表。此示例中有一个\
  \ shell 预配置器，它在 VM 上运行 scripts 部分中指定的脚本。install-updates.sh 脚本只是运行 apt-get update\
  \ && apt-get dist-upgrade -y。第二个脚本 install-docker.sh 是来自 get.docker.com 的安装脚本。\n\
  \n配置就绪后，可以通过运行 `packer build <config>` 来构建镜像，其中 `<config>` 是配置文件的名称。此处给出了一个示例。为简洁起见，大部分输出已被删除：\n\
  \n```\n$ packer build xenial-cloudimg.json\nqemu output will be in this color.\n\
  ```\n\n```\n==> qemu: Downloading or copying ISO\nqemu: Downloading or copying:\
  \ file:///packer/images/xenial-server-cloudimg-amd64-prep.img\n==> qemu: Copying\
  \ hard drive...\n==> qemu: Resizing hard drive...\n==> qemu: Found port for communicator\
  \ (SSH, WinRM, etc): 3475.\n==> qemu: Looking for available port between 5900 and\
  \ 6000 on 127.0.0.1\n==> qemu: Starting VM, booting disk image\nqemu: The VM will\
  \ be run headless, without a GUI. If\nyou want to\nqemu: view the screen of the\
  \ VM, connect via VNC without a password to\nqemu: 127.0.0.1:5983\n==> qemu: Waiting\
  \ 10s for boot...\n==> qemu: Connecting to VM via VNC\n==> qemu: Typing the boot\
  \ command over VNC...\n==> qemu: Waiting for SSH to become available...\n==> qemu:\
  \ Connected to SSH!\n==> qemu: Provisioning with shell script: /packer/scripts/install-updates.sh\n\
  ==> qemu: Provisioning with shell script: /packer/scripts/install-docker.sh\n==>\
  \ qemu: Gracefully halting virtual machine...\n==> qemu: Converting hard drive...\n\
  Build 'qemu' finished.\n\n==> Builds finished. The artifacts of successful builds\
  \ are:\n--> qemu: VM files in directory: /packer/images/xenial-cloudimg\n```\n\n\
  ![](img/02bead9c8ff4515f78dac0eb33163961_257_0.png)\n\n使用 `qemu` 构建器时，请确保运行 Packer\
  \ 的用户有权使用 KVM。如果用户没有所需的访问权限，Qemu 可能会抛出权限拒绝错误。在 Ubuntu 上，用户需要加入 `kvm` 组。\n\n运行需要几分钟，假设一切正常，新镜像将放置在\
  \ `output_directory` 设置的目录中。除非设置了 `-force` 选项以避免意外删除构建镜像，否则如果输出目录已存在，Packer 不会运行。\n\
  \n## 将 Puppet 与 Packer 结合使用\n\n如果需要的更改相对简单，使用脚本预配置新镜像有效。更复杂的更改需要更复杂的脚本。配置管理工具非常适合此任务，可用于预配置新镜像。Ansible、Chef、Puppet\
  \ 和 Salt 均受支持。\n\n使用配置管理工具预配置镜像的额外好处是，可以使用相同的配置来确保服务器运行时保持正确配置。具体做法会因所使用的工具而异。\n\
  \n以下 Packer 代码片段使用 Puppet 的无主模式来配置镜像。与“使用配置管理”部分中使用的相同 Puppet 清单在此处也被使用。不应包含加入 Docker\
  \ 集群的命令。在集群中启动新实例后，可以运行加入集群的命令：\n\n```\n\"provisioners\" : [\n{\n\t\"type\" : \"\
  shell\",\n\t\"scripts\" : [\n\t\t\"/packer/scripts/install-updates.sh\",\n\t\t\"\
  /packer/scripts/install-puppet.sh\"\n\t]\n},\n{\n\t\"type\" : \"puppet-masterless\"\
  ,\n\t\"manifest_file\" : \"/packer/puppet/docker-host.pp\"\n}\n]\n```\n\n第一个区别是\
  \ install-docker.sh 脚本被 install-puppet.sh 取代，后者运行 apt-get install -y puppet。第二个是带有\
  \ puppet-masterless 类型的新预配置器块。manifest_file 选项指定将用于配置镜像的清单；也可以使用目录。在这种情况下，所有清单都将应用于节点。\n\
  \n## 将基础架构视为代码\n\n让我们停下来考虑一下刚才所做的事情。服务器已完全在一个或多个文件中定义，并具有可脚本化的构建过程。我们刚刚将服务器变成了代码。\n\
  \n服务器镜像可以通过 CI 过程构建。与在运行中的服务器上执行更新不同，可以构建包含更新的新镜像。镜像在部署前可以通过测试套件进行全面测试。在部署到生产环境之前，可以在测试环境中对它们进行全面审查。甚至部署过程也可以通过\
  \ CI 过程来控制，就像 Docker 镜像一样。\n\n这种方法的另一个好处是回滚更新非常容易。如果发现问题，可以在先前可用的镜像上启动新服务器以快速恢复服务。有问题的镜像可以离线或在不同环境中进行测试和调试。\n\
  \n基本上，这是运行版本化容器的相同方法。从故障排除角度来看，重要的是日志等重要数据不存储在服务器上。相反，它们应存储在网络存储上或发送到 Elasticsearch\
  \ 和 Kibana 等服务。\n\n## 构建后配置\n\n使用自定义镜像并不能消除对启动时和持续配置管理的需求。启动时配置可以最小化为主机名或加入集群等简单事项。在多区域或多云环境中运行时，Cloud-Init\
  \ 会设置特定于区域的信息。\n\n对运行中的系统进行配置管理仍然很重要。它可以确保构建服务器时所做的配置保持不变。它还可以进行简单的更改，例如更新管理员 SSH\
  \ 密钥，而无需完全重建镜像。\n\n## 自动化主机部署\n\n自动化 Docker 主机部署有很多种方式。具体细节，如往常一样，取决于编排系统。例如，向在\
  \ Amazon EC2 上运行的 Docker Swarm 集群添加新主机，就像运行类似下面的内容一样简单：\n\n```\n$ docker-machine\
  \ create --driver amazonec2\n$ docker swarm join --token ABC... manager\n```\n\n\
  对于 Azure 或 GCE，也是同样的操作。只需更改驱动程序，并将相应的驱动程序特定标志传递给 docker-machine 即可。\n\n\n\n\n本节将介绍几种可用于管理\
  \ Docker 集群主机的不同工具。首先是 Terraform，它几乎可以与所有东西配合使用。接下来是 Docker 自己的云管理工具 Docker Cloud。最后，将介绍两个处于公测阶段的工具，Docker\
  \ for AWS 和 Docker for Azure。\n\n如果您计划在 AWS、GCE 或 Azure 上运行，请考虑使用各提供商提供的容器托管服务。使用每种服务时，创建和管理主机的任务由服务来处理。管理员只需关注容器即可。\n\
  \n## 使用 Terraform 部署主机\n\nTerraform 是一种多云部署工具。它使用配置文件来定义集群应具有的样子。然后根据配置构建创建或更新集群的计划。计划让管理员在操作发生前有机会审查将要执行的内容。如果计划看起来良好，Terraform\
  \ 将执行计划，使集群符合配置。\n\nTerraform 完全与云提供商无关。它支持 AWS、GCE、Microsoft Azure、OpenStack 等。它可以与\
  \ cobble 结合使用，以管理运行在本地硬件上的主机。它甚至对 Docker 有有限的支持。更好的是，它可以同时用于配置多个云。\n\n### 创建 Terraform\
  \ 配置\n\n让我们看一个 Terraform 配置示例。此示例在 Amazon EC2 上创建两个新实例。文件可以命名为任何名称，但必须以 `.tf` 结尾。Terraform\
  \ 的完整文档可在 https://www.terraform.io/docs/index.html 上找到。\n\n```\nprovider \"aws\"\
  \ {\n  access_key = \"ACCESS_KEY\"\n  secret_key = \"SECRET_KEY\"\n  region = \"\
  us-west-2\"\n}\n\nresource \"aws_instance\" \"docker-hosts\" {\n  count = 2\n  ami\
  \ = \"ami-a9d276c9\"\n  instance_type = \"t2.micro\"\n  user_data = \"${file(\"\
  cloud-init.yml\") }\"\n  key_name = \"aws-key\"\n  vpc_security_group_ids = [ \"\
  sg-ID\" ]\n}\n\ntags {\n  Name = \"docker${count.index}\"\n }\n}\n```\n\n每个 provider\
  \ 块指定一个云服务。在此示例中，provider 是 aws。access_key 和 secret_key 选项是用于管理 EC2 服务的相应密钥。region\
  \ 选项指定将启动这些实例的区域。可以为将启动实例的每个区域指定一个 provider 块。\n\nresource 块定义将在 provider 上启动的资源。Terraform\
  \ 将资源与相应的提供者类型匹配。类型为 aws_instances 的资源（如本例所示）将在 aws 提供者上启动。\n\ncount 选项指定要启动的相同资源的数量。默认值为\
  \ 1。以后可以更改此值以扩大或缩小集群。\n\nami 选项设置此实例要使用的 AMI。这可以是公共 AMI，例如本示例中的 Ubuntu Xenial 云映像。也可以使用私有\
  \ AMI。例如，Packer 可以构建新镜像并将其作为 AMI 提供。instance_type 是要启动的实例类型。\n\n> 特定的 AMI 将取决于镜像的版本以及它将运行的区域。Ubuntu\
  \ 云映像的完整 AMI 列表位于 https://cloud-images.ubuntu.com/locator/ec2/。\n\n可以为每个资源指定一个 Cloud-Init\
  \ 文件，使用 user_data 选项。最简单的方法是使用 file() 函数指定文件。路径相对于运行 Terraform 的位置。创建实例时，配置将被编码并添加到实例中。\n\
  \nkey_name 指定要添加到默认用户的 SSH 密钥。密钥必须已存在于 EC2 中。可以使用 vpc_security_group_ids 选项设置 VPC\
  \ 安全组列表。安全组必须存在，此示例才能工作。请确保安全组允许 SSH 访问，否则您可能会发现自己被锁定在实例之外。\n\nTerraform 可用于创建 VPC、安全组以及可能需要的任何其他内容。完整文档可在\
  \ https://www.terraform.io/docs/providers/aws/index.html 上找到。\n\n最后，tags 选项提供了一种在实例上设置标签的方法。此示例设置\
  \ Name 标签。如果从同一资源创建多个实例，${count.index} 变量是当前计数。在此示例中，这两个实例名为 docker0 和 docker1。\n\
  \n### 运行 Terraform\n\n使用 Terraform 创建或更新集群分两步进行。第一步是生成计划，虽然并非严格必要，但计划会显示 Terraform\
  \ 将要做的确切事情，这样就不会有意外。要查看计划，请在带有配置的目录中运行 `terraform plan`。它将从目录中的 `.tf` 文件读取配置并创建一个计划：\n\
  \n```\n$ terraform plan\nRefreshing Terraform state in-memory prior to plan...\n\
  The refreshed state will be used to calculate this plan, but will not be\npersisted\
  \ to local or remote state storage.\nThe Terraform execution plan has been generated\
  \ and is shown below.\nResources are shown in alphabetical order for quick scanning.\
  \ Green resources\nwill be created (or destroyed and then created if an existing\
  \ resource\nexists), yellow resources are being changed in-place, and red resources\n\
  will be destroyed. Cyan entries are data sources to be read.\nNote: You didn't specify\
  \ an \"-out\" parameter to save this plan, so when\n\"apply\" is called, Terraform\
  \ can't guarantee this is what will execute.\n+ aws_instance.docker-hosts.0\n  \
  \  ami:                       \"ami-a9d276c9\"\n    associate_public_ip_address:\
  \ \"<computed>\"\n    availability_zone:         \"<computed>\"\n    ebs_block_device.#:\
  \        \"<computed>\"\n    ephemeral_block_device.#:  \"<computed>\"\n    instance_state:\
  \            \"<computed>\"\n    instance_type:             \"t2.micro\"\n    key_name:\
  \                  \"aws-key\"\n    network_interface_id:      \"<computed>\"\n\
  \    placement_group:           \"<computed>\"\n    private_dns:               \"\
  <computed>\"\n    private_ip:                \"<computed>\"\n    public_dns:   \
  \             \"<computed>\"\n    public_ip:                 \"<computed>\"\n  \
  \  root_block_device.#:       \"<computed>\"\n    security_groups.#:           \
  \ \"<computed>\"\n    source_dest_check:            \"true\"\n    subnet_id:   \
  \                 \"<computed>\"\n    tags.%:                       \"1\"\n    tags.Name:\
  \                    \"docker0\"\n    tenancy:                      \"<computed>\"\
  \n    user_data:\n      \"23845b687111f6870657ecb38214e6a8f18b231e\"\n    vpc_security_group_ids.#:\
  \     \"1\"\n    vpc_security_group_ids.839449168: \"sg-...\"\n+ aws_instance.docker-hosts.1:\n\
  \  ami:                        \"ami-a9d276c9\"\n  associate_public_ip_address:\
  \ \"<computed>\"\n  availability_zone:          \"<computed>\"\n  ebs_block_device.#:\
  \         \"<computed>\"\n  ephemeral_block_device.#:   \"<computed>\"\n  instance_state:\
  \             \"<computed>\"\n  instance_type:              \"t2.micro\"\n  key_name:\
  \                   \"aws-key\"\n  network_interface_id:       \"<computed>\"\n\
  \  placement_group:            \"<computed>\"\n  private_dns:                \"\
  <computed>\"\n  private_ip:                 \"<computed>\"\n  public_dns:      \
  \           \"<computed>\"\n  public_ip:                  \"<computed>\"\n  root_block_device.#:\
  \        \"<computed>\"\n  security_groups.#:          \"<computed>\"\n  source_dest_check:\
  \          \"true\"\n  subnet_id:                  \"<computed>\"\n  tags.%:   \
  \                  \"1\"\n  tags.Name:                  \"docker1\"\n  tenancy:\
  \                    \"<computed>\"\n  user_data:\n    \"23845b687111f6870657ecb38214e6a8f18b231e\"\
  \n  vpc_security_group_ids.#:   \"1\"\n  vpc_security_group_ids.839449168: \"sg-...\"\
  \n```\n\n```\nPlan: 2 to add, 0 to change, 0 to destroy.\n```\n\n如果计划看起来良好，可以通过运行\
  \ `terraform apply` 将其付诸实行。以下输出为了简洁已被精简：\n\n```\n$ terraform apply\naws_instance.docker-hosts.1:\
  \ Creating...\n  ami:        \"\" => \"ami-a9d276c9\"\n...\naws_instance.docker-hosts.0:\
  \ Creating...\n  ami:        \"\" => \"ami-a9d276c9\"\n...\n\naws_instance.docker-hosts.1:\
  \ Still creating... (10s elapsed)\naws_instance.docker-hosts.0: Still creating...\
  \ (10s elapsed)\naws_instance.docker-hosts.1: Still creating... (20s elapsed)\n\
  aws_instance.docker-hosts.0: Still creating... (20s elapsed)\naws_instance.docker-hosts.0:\
  \ Creation complete\naws_instance.docker-hosts.1: Creation complete\nApply complete!\
  \ Resources: 2 added, 0 changed, 0 destroyed.\nThe state of your infrastructure\
  \ has been saved to the path below. This state is required to modify and destroy\
  \ your infrastructure, so keep it safe. To inspect the complete state use the `terraform\
  \ show` command.\nState path: terraform.tfstate\n```\n\n生成的 terraform.tfstate 文件很重要。它提供了从配置中定义的资源到实际运行内容的映射。任何在同一\
  \ Terraform 集群上操作的人都必须使用相同的 terraform.tfstate 文件。状态文件足够小，可以存储在版本控制中，但这可能会导致合并冲突。相反，Terraform\
  \ 有一个选项可以将状态远程存储。支持多种后端，包括 S3、Azure 和 etcd。包括后端列表在内的完整文档可在 https://www.terraform.io/docs/state/remote/index.html\
  \ 上找到。\n\n要更新集群，只需更改配置并再次运行 terraform plan 和 terraform apply。请求的更改将在整个集群中进行。请注意，某些更改将要求\
  \ Terraform 删除并重新创建运行中的实例。有可能足够多的实例将被停止，以至于影响服务。\n\n## 显示集群状态\n\n查看集群处于什么状态可能很有用。要查看状态，请运行\
  \ terraform show。输出可能很长，具体取决于集群的大小。以下示例显示可用的信息类型。特别值得注意的是私有和公有 IP 地址：\n\n```\n$\
  \ terraform show\naws_instance.docker-hosts.0:\n  id = i-0095dceada25205bf\n  ami\
  \ = ami-a9d276c9\n  associate_public_ip_address = true\n  availability_zone = us-west-2c\n\
  \  disable_api_termination = false\n  ebs_block_device.# = 0\n  ebs_optimized =\
  \ false\n  ephemeral_block_device.# = 0\n  iam_instance_profile =\n  instance_state\
  \ = running\n  instance_type = t2.micro\n```\n\n\n\n```\nkey_name = aws-key\nmonitoring\
  \ = false\nnetwork_interface_id = eni-44e0df15\nprivate_dns = ip-172-31-12-31.us-west-2.compute.internal\n\
  private_ip = 172.31.12.31\npublic_dns = ec2-35-164-109-235.us-west-2.compute.amazonaws.com\n\
  public_ip = 35.164.109.235\nroot_block_device.# = 1\nroot_block_device.0.delete_on_termination\
  \ = true\nroot_block_device.0.iops = 100\nroot_block_device.0.volume_size = 8\n\
  root_block_device.0.volume_type = gp2\nsecurity_groups.# = 0\nsource_dest_check\
  \ = true\nsubnet_id = subnet-7160dc29\ntags.% = 1\ntags.Name = dock0\ntenancy =\
  \ default\nuser_data = 23845b687111f6870657ecb38214e6a8f18b231e\nvpc_security_group_ids.#\
  \ = 1\nvpc_security_group_ids.839449168 = sg-...\naws_instance.docker-hosts.1:\n\
  id = i-08eb6ebb75b788823\n...\n```\n\n## 使用 Docker Cloud 部署主机\n\nDocker Cloud 是一个用于管理各种云服务上\
  \ Docker Swarm 的出色工具。它可以轻松创建新集群，并根据集群上运行的服务的需求进行扩展或缩减。\n\n要创建新集群，请单击节点集群，然后单击创建。将弹出一个窗口，要求提供诸如集群名称、云提供商、磁盘大小和初始节点数等信息。配置完成后，单击启动节点集群。新节点将启动，几分钟后即可准备运行容器：\n\
  \n![](img/02bead9c8ff4515f78dac0eb33163961_266_0.png)\n\n添加新节点非常简单。单击 **节点集群** 并选择要添加节点的集群。页面右上角有一个滑块，可用于扩展节点数量。调整滑块并单击\
  \ **缩放** 链接。将添加其他节点，它们将准备好运行容器：\n\n![](img/02bead9c8ff4515f78dac0eb33163961_267_0.png)\n\
  \n## Docker for AWS 和 Docker for Azure 简介\n\nDocker for AWS 是一个使用 CloudFormation\
  \ 在 AWS 上自动构建 Docker Swarm 的过程。该过程为 Swarm 创建一个新 VPC，包括子网和安全组。还创建了两个 Auto Scaling\
  \ 组；一个用于管理节点，一个用于工作节点。可以通过更改相应 Auto Scaling 组中的实例数量来调整每个组的数量。新实例将自动加入 Swarm。\n\n\
  Docker for Azure 为运行在 Azure 上的集群提供类似服务。它会自动创建运行 Docker Swarm 所需的所有服务。它与 Azure 的缩放功能集成，以便轻松扩展主节点和工作节点的数量。\n\
  \n更多信息可在以下位置找到：\n\n- 适用于 AWS 的 Docker: https://beta.docker.com/docs/aws/\n- 适用于\
  \ Azure 的 Docker: https://beta.docker.com/docs/azure/\n\n## 缩减节点\n\n云计算的好处之一是在不再需要主机时能够缩减主机数量。例如，网上商店可能在圣诞购物季增加主机数量，然后在\
  \ 1 月份缩减。这将如何发生，同样取决于所选的编排解决方案及其运行的平台。\n\n大多数编排系统都有一个命令，可关闭特定节点上的容器并将其重新调度到集群中的其他位置。这使编排工具有机会在删除节点之前干净地在集群中移动服务。Docker\
  \ Cloud 和 GKE 等服务会自动处理此操作。\n\n可将更改节点可用性的命令添加到关机脚本中。但是，必须注意确保在系统关闭之前所有容器都已停止。在大多数情况下，需要运行另一个命令才能将节点永久从集群中删除。同样，具体命令将取决于所使用的编排工具。\n\
  \n## 总结\n\n本章探讨了用于运行 Docker 集群的基础设施自动化的不同方法。它研究了在节点运行时使用配置管理、使用 Cloud-Init 在引导时配置节点，以及使用\
  \ Packer 构建自定义镜像。我们还介绍了使用 Terraform 和 Docker Cloud 管理集群。最后，分享了一些在不再需要节点时取消配置的技巧。\n\
  \n接下来去哪里取决于你。本书使用多种工具介绍了 Docker 编排。成功运行 Docker 集群需要多种不同的服务，包括注册表、覆盖网络、共享存储、编排工具本身、日志和资源监控以及持续集成。特定工具和工作流程会因集群而异。本书只能触及可能性的表面。希望您能将在这里学到的知识应用于使用\
  \ Docker 为您的组织构建可扩展、可靠的服务。\n"
