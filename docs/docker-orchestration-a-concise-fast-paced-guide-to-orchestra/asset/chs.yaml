  \ 书籍和电子书的独家折扣和优惠。\n\n![](img/02bead9c8ff4515f78dac0eb33163961_6_0.png)\n\nhttps://www.packtpub.com/mapt\n\
  \n通过 Mapt 获取最热门的软件技能。Mapt 让您完全访问所有 Packt 图书和视频课程，以及行业领先的工具，帮助您规划个人发展并推进职业生涯。\n\n\
  # 为什么要订阅？\n\n- 可在 Packt 出版的每本书中进行全面搜索\n- 复制粘贴、打印和书签内容\n- 按需通过网络浏览器访问\n\n# 客户反馈\n\
  \n感谢您购买这本 Packt 图书。我们非常认真地对待改进内容和产品以满足您需求的承诺——这就是为什么您的反馈如此宝贵。无论您对购买有何感受，请考虑在此书的\
  \ Amazon 页面上留下评论。这不仅能帮助我们，更重要的是，它还能帮助社区中的其他人对其投资于学习的资源做出明智的决定。\n\n您还可以通过加入我们的审稿俱乐部定期为我们撰写评论。如果您有兴趣加入，或想了解我们提供的更多福利，请联系我们：customerreviews@packtpub.com。\n\
  \n# 前言\n\nDocker 容器是构建和部署服务的一项强大工具，可以保持一致性和可靠性。随着容器数量的增加，管理它们也成为一个问题。当容器在多个主机上运行时，这个问题会更加严重。本书将向您展示如何通过编排来消除混乱，带来秩序。\n\
  \n本书首先向您展示如何开始使用 Docker，然后深入探讨 Docker 集群所需的构建块。它将向您展示如何使用“三大”编排工具——Docker Swarm、Kubernetes\
  \ 和 Mesosphere。它还将介绍另外两种工具，Fleet 和 Cattle，这些工具使用和安装可能更简单，但功能非常强大。\n\n最后，您将了解到使集群管理人员和创建将要运行的镜像的开发人员生活更加简单的工具。您将探索监控集群的工具并查看性能瓶颈所在。您将看到如何使用持续集成来一致且可靠地构建、测试和部署\
  \ Docker 镜像。最后，本书将向您展示如何将相同的原则应用于 Docker 运行所在的主机。\n\n# 本书内容概要\n\n- 第 1 章，Docker\
  \ 编排入门，将帮助您开始使用 Docker。它将向您展示如何在本地以及 Amazon Web Services、Google Compute Engine 和\
  \ Microsoft Azure 等流行的云服务上安装 Docker。\n- 第 2 章，使用 Docker Compose 构建多容器应用程序，介绍了如何使用\
  \ Docker Compose 构建多容器应用程序。它还展示了如何使用命名网络进行数据隔离以及使用数据卷共享数据。\n- 第 3 章，集群构建块 – 镜像仓库、覆盖网络和共享存储，描述了\
  \ Docker 集群所需的构建块。您将探索镜像仓库、覆盖网络和共享存储，并了解它们为何必要。\n- 第 4 章，使用 Docker Swarm 进行编排，向您展示如何使用\
  \ Docker Swarm 创建和管理集群。您将学习如何管理服务、以多个副本运行服务以及执行“零停机”升级。\n- 第 5 章，使用 Kubernetes 部署和管理服务，探讨了使用\
  \ Kubernetes 编排 Docker 集群的基础知识。您将看到如何创建由多个容器提供的服务，如何为这些服务提供负载均衡，以及如何无缝升级它们。最后，您将看到如何创建持久卷以在容器之间共享数据。\n\
  - 第 6 章，使用 Mesosphere，深入探讨了使用 Mesosphere 和 DC/OS 进行编排。您将学习如何创建和管理容器、对它们进行负载均衡以及提供持久存储。您还将看到如何创建健康检查以确保服务正常运行，以及如何执行“零停机”升级。\n\
  - 第 7 章，使用更简单的编排工具 – Fleet 和 Cattle，介绍了 Fleet 和 Cattle。Fleet 是一种低级工具，可用于构建自定义管理工具。Cattle\
  \ 是 Rancher 提供的一种功能强大但易于使用的编排工具。您将看到如何使用每种工具来管理容器和服务。\n- 第 8 章，监控您的集群，探讨了确保集群及其中运行的容器行为正常的重要任务。您将学习如何在\
  \ Elasticsearch 中汇总所有容器的日志并在 Kibana 中查看它们。您还将学习如何使用 collectd、InfluxDB 和 Grafana\
  \ 收集性能数据。\n- 第 9 章，使用持续集成构建、测试和部署容器，解释了如何在 GitLab 中使用持续集成来构建、测试甚至部署容器。这有助于确保镜像以一致且可靠的方式构建。\n\
  - 第 10 章，为何止步于容器？自动化您的基础架构，超越容器，展示了构建和编排 Docker 容器所用的相同原则也可应用于容器运行所在的主机。您将看到如何使用配置管理来配置主机并确保其保持配置状态。本章还将向您展示如何使用\
  \ Packer 构建可在本地或云服务上部署的主机镜像。最后，它将介绍 Terraform，可用于从头开始创建整个 Docker 集群。\n\n# 本书所需内容\n\
  \n您需要一个运行 Docker 主机的位置。这可以是 OpenStack 等本地集群，也可以是 Amazon EC2、Google Compute Engine\
  \ 或 Microsoft Azure 等云托管提供商。第 1 章将向您展示如何在 Linux 上安装 Docker，本书其余部分假设工具从 Linux 运行。目前，Ubuntu、CentOS\
  \ 和 Red Hat Enterprise Linux 支持最好。\n\n\n\n\n需要文本编辑器（例如 Emacs），因为大多数编排工具都将配置存储在文本文件中。本书中描述的许多工具和示例都需要网页浏览器来访问。\n\
  \n# 本书适用人群\n\n本书面向具备 Docker 基础知识、现在希望跨多台主机部署和管理容器的开发人员和系统管理员。\n\n# 约定\n\n本书中，您将看到多种文本样式，用于区分不同类型的信息。以下是这些样式的示例及其含义。\n\
