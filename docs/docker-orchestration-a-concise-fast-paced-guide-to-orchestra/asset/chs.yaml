  - Kirk D'Penha\n\n- **技术编辑**\n- Bhagyashree Rai\n\n- **制作协调员**\n- Melwyn Dsa\n\n\
  # 关于作者\n\n**Randall Smith** 是 Adams State University 的高级系统管理员。他自 1999 年起一直管理 Windows、Linux\
  \ 和 BSD 系统。\n\n他积极帮助其他系统管理员解决线上和线下问题。他在 Colorado Higher Ed Computing Organization\
  \ 和 Educause 会议上就包括 Linux KVM 和 Ceph 在内的主题进行过演讲。\n\n在业余时间，Randall 在 YouTube 和 Twitch\
  \ 的 Music Free Gaming 上直播 Let's Play 游戏视频。\n\n我要感谢我的家人，在我写书期间长时间消失在卧室里，他们给予了支持和理解。我要感谢\
  \ Adams State University 提供用于测试的服务器，以及让我们有机会接触 Docker 等非常酷的软件。最后，我要感谢审稿人和 Packt\
  \ 的所有人，是他们让这本书得以出版。\n\n我想特别向所有开源本书中描述的工具的开发者和公司致谢。你们让我们其余的人完成工作变得容易得多。非常感谢大家。\n\n\
  # 关于审稿人\n\n**Vincent De Smet** 是一位 Docker Captain，在越南和新加坡分别担任 IT 顾问和 DevOps 工程师。他还是\
