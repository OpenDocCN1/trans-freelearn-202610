    6 ? S 0:00 nginx: worker process

    13 ? Ss 0:00 bash

    18 ? R+ 0:00 ps ax

    root@fd8533fa2eda:/# exit

    ```


    In the preceding example, I connected to the container and ran `ps ax` to see
    every process that the container knew about. Getting a shell in the container
    can be invaluable when debugging. You can verify that files were added correctly
    or that internal scripts are properly handling environment variables passed in
    through `docker`.


    It''s also possible to run non-interactive programs. Let''s use the same `ps`
    example as earlier:


    ```

    $ sudo docker exec nginx ps ax

    PID TTY STAT TIME COMMAND

    1 ? Ss 0:00 nginx: master process nginx -g daemon off;

    6 ? S 0:00 nginx: worker process

    19 ? Rs 0:00 ps ax

    ```


    As you might expect, there''s not much to see here, but it should give you an
    idea of what is possible. I often use them when debugging and I do not need a
    full shell.


    # ## Summary


    In this chapter you have learned the basics of using Docker. You saw how to quickly
    install Docker on AWS, GCE, Azure, and a generic Linux host. You were introduced
    to a few Docker-specific distributions and saw a little bit of how to configure
    them. Finally, we reviewed the basics of using the `docker` command. In the next
    chapter, I will walk you through using Docker Compose to build new single and
    multi-container applications.'
