- pgno: 21
  md: '# Getting Started with Docker Orchestration


    Initially, Internet services ran on hardware and life was okay. To scale services
    to handle peak capacity, one needed to buy enough hardware to handle the load.
    When the load was no longer needed, the hardware sat unused or underused but ready
    to serve. Unused hardware is a waste of resources. Also, there was always the
    threat of configuration drift because of the subtle changes we made with each
    new install.


    Then came VMs and life was good. VMs could be scaled to the size that was needed
    and no more. Multiple VMs could be run on the same hardware. If there was an increase
    in demand, new VMs could be started on any physical server that had room. More
    work could be done on less hardware. Even better, new VMs could be started in
    minutes when needed, and destroyed when the load slackened. It was even possible
    to outsource the hardware to companies such as Amazon, Google, and Microsoft.
    Thus elastic computing was born.


    VMs, too, had their problems. Each VM required that additional memory and storage
    space be allocated to support the operating system. In addition, each virtualization
    platform had its own way of doing things. Automation that worked with one system
    had to be completely retooled to work with another. Vendor lock-in became a problem.


    Then came Docker. What VMs did for hardware, Docker does for the VM. Services
    can be started across multiple servers and even multiple providers. Once deployed,
    containers can be started in seconds without the resource overhead of a full VM.
    Even better, applications developed in Docker can be deployed exactly as they
    were built, minimizing the problems of configuration drift and package maintenance.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'The question is: how does one do it? That process is called **orchestration**,
    and like an orchestra, there are a number of pieces needed to build a working
    cluster. In the following chapters, I will show a few ways of putting those pieces
    together to build scalable, reliable services with faster, more consistent deployments.


    Let''s go through a quick review of the basics so that we are all on the same
    page. The following topics will be covered:


    +   - How to install Docker Engine on **Amazon Web Services (AWS)**, **Google
    Compute Engine (GCE)**, Microsoft Azure, and a generic Linux host with `docker-machine`

    +   - An introduction to Docker-specific distributions including CoreOS, RancherOS,
    and Project Atomic

    +   - Starting, stopping, and inspecting containers with Docker

    +   - Managing Docker images


    # Installing Docker Engine


    Docker Engine is the process that actually runs and controls containers on each
    Docker host. It is the engine that makes your cluster work. It provides the daemon
    that runs and manages the containers, an API that the various tools use to interact
    with Docker, and a command-line interface.


    Docker Engine is easy to install with a script provided by Docker. The Docker
    project recommends that you pipe the download through `sh`:


    ```

    $ wget -qO - https://get.docker.com/ | sh

    ```


    I cannot state strongly enough how dangerous that practice is. If `https://www.docker.com/`
    is compromised, the script that you download could compromise your systems. Instead,
    download the file locally and review it to ensure that you are comfortable with
    what the script is doing. After you have reviewed it, you could load it to a local
    web server for easy access or push it out with a configuration management tool
    such as Puppet, Chef, or Ansible:


    ```

    $ wget -qO install-docker.sh https://get.docker.com/

    ```'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'After you have reviewed the script, run it:


    ```

    $ sh install-docker.sh

    ```


    The user that runs the install script needs to be root or have the ability to
    use su or sudo.


    If you are running a supported Linux distribution, the script will prepare your
    system and install Docker. Once installed, Docker will be updated by the local
    package system, such as `apt` on Debian and Ubuntu or `yum` on CentOS and **Red
    Hat Enterprise Linux (RHEL)**. The `install` command starts Docker and configures
    it to start on system boot.


    A list of supported operating systems, distributions, and cloud providers is located
    at https://docs.docker.com/engine/installation/.


    By default, anyone using Docker locally will need root privileges. You can change
    that by adding them to the `docker` group which is created by the install packages.
    They will be able to use Docker without root, starting with their next login.


    # Installing with Docker Machine


    Docker provides a very nice tool to facilitate deployment and management of Docker
    hosts on various cloud services and Linux hosts called **Docker Machine**. Docker
    Machine is installed as part of the Docker Toolbox but can be installed separately.
    Full instructions can be found at https://github.com/docker/machine/releases/.


    Docker Machine supports many different cloud services including AWS, Microsoft
    Azure, and GCE. It can also be configured to connect to any existing supported
    Linux server. The driver `docker-machine` uses is defined by the `--driver` flag.
    Each driver has its own specific flags that control how `docker-machine` works
    with the service.


    # Starting a host on AWS


    AWS is a great way to run Docker hosts and `docker-machine` makes it easy to start
    and manage them. You can use the **Elastic Load Balancer (ELB)** to send traffic
    to containers running on a specific host or load balance among multiple hosts.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'First of all, you will need to get your access credentials from AWS. You can
    use them in a couple of ways. First, you can include them on the command line
    when you run docker-machine:


    ```

    $ docker-machine create --driver amazonec2 ---amazonec2-access-key AK*** ---amazonec2-secret-key
    DM*** ...

    ```


    Second, you can add them to ~/.aws/credentials. Putting your credentials in a
    credential file means that you will not have to include them on the command line
    every time you use docker-machine to work with AWS. It also keeps your credentials
    off of the command line and out of the process list. The following examples will
    assume that you have created a credentials file to keep from cluttering the command
    line:


    ```

    [default]

    aws_access_key_id = AK***

    aws_secret_access_key = DM***

    ```


    A new Docker host is created with the create subcommand. You can specify the region
    using the ---amazonec2-region flag. By default, the host will be started in the
    us-east-1 region. The last item on the command line is the name of the instance,
    in this case dm-aws-test:


    ```

    $ docker-machine create --driver amazonec2 ---amazonec2-region

    us-west-2 dm-aws-test

    Creating CA: /home/user/.docker/machine/certs/ca.pem

    Creating client certificate:

    /home/user/.docker/machine/certs/cert.pem

    Running pre-create checks...

    Creating machine...

    (dm-aws-test) Launching instance...

    Waiting for machine to be running, this may take a few minutes...

    Detecting operating system of created instance...

    Waiting for SSH to be available...

    Detecting the provisioner...

    Provisioning with ubuntu(systemd)...

    Installing Docker...

    Copying certs to the local machine directory...

    Copying certs to the remote machine...

    Setting Docker configuration on the remote daemon...

    Checking connection to Docker...

    Docker is up and running!

    To see how to connect your Docker Client to the Docker Engine running on

    this virtual machine, run: docker-machine env dm-aws-test

    ```'
  merge: -1
