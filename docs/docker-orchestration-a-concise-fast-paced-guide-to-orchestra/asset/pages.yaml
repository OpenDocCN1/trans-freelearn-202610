- pgno: 106
  md: 'As the upgrade starts, the web .2 and web .3 tasks have been updated and are
    now running `nginx:1.11`. The others are still running the old version. Every
    30 seconds, two more tasks will be upgraded until the entire service is running
    `nginx:1.11`.


    Docker Swarm does not care about the version that is used on the image tag. This
    means that you can just as easily downgrade the service. In this case, if the
    `docker service update --image nginx:1.10 web` command were to be run after the
    upgrade, swarm will go through the same update process until all tasks are running
    `nginx:1.10`. This can be very helpful if an upgrade does work as it was supposed
    to.


    It is also important to note that there is nothing that says that the new image
    has to be the same base as the old one. You can decide to run Apache instead of
    Nginx by running `docker service update --image httpd web`. Swarm will happily
    replace all the web tasks which were running an nginx image with one running the
    `httpd` image.


    Rolling updates require that your service is able to run multiple containers in
    parallel. This may not work for some services, such as SQL databases. Some updates
    may require a schema change that is incompatible with the older version. In either
    case, rolling updates may not work for the service. In those cases, you can set
    `--update-parallelism 0` to force all tasks to update at once or manually recreate
    the service. If you are running a lot of replicas, you should pre-pull your image
    to ease the load on your registry.


    # # Using Docker Compose with swarm


    Docker Compose can be used with Docker Swarm to build multi-container applications.
    You can configure your environment to use any node in the swarm and then use `docker-compose`
    just as you would when talking to a single Docker host. There are some serious
    issues using it for now.


    # # Building images


    One of the issues is image building. It is possible to use `docker-compose build`
    but the image will only appear on the node that `docker-compose` used to build
    the image. This is fine when running on a single host, but probably not what you
    want since you are running a swarm. To work around this, it is necessary to build
    your image manually with `docker build` and push it into a registry.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Starting an application


    Starting an application with `docker-compose up` and swarm is exactly the same
    as running it with a single host. Unfortunately, Docker Compose does not use swarm
    to schedule containers. In fact, it prints a warning when you try:


    ```

    $ docker-compose up -d

    WARNING: The Docker Engine you''re using is running in swarm mode.

    Compose does not use swarm mode to deploy services to multiple nodes in a swarm.

    All containers will be scheduled on the current node.

    To deploy your application across the swarm, use the bundle feature of the

    Docker experimental build.

    More info:

    https://docs.docker.com/compose/bundles

    Starting webdb_web_1

    Recreating webdb_db_1

    ```


    The containers are started on the swarm node just as they would be if you were
    using a

    single Docker node. Scaling services within the application with `docker-compose
    scale`

    also works, but again, the additional containers are started on the same swarm
    node.


    # Bundling an application


    Docker **Distributed Application Bundle (DAB)** and stacks are an experimental
    feature. The

    ability to build a bundle with `docker-compose` was added in Docker Compose 1.8
    and

    Docker 1.12. At the time of writing, it is only possible to use bundles and stacks
    with an

    experimental version of Docker Engine. As such, the tools to work with bundles
    may

    change considerably before they are released.


    Building a bundle is as simple as running `docker-compose bundle`. A `.dab` file
    will be

    created that corresponds to the namespace of the application. For example, an
    application

    with the `webdb` namespace will create a bundle file named `webdb.dab`. Once a
    bundle file is

    created, it can be used to create a stack.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# # Deploying a stack


    Stacks are the collection of services and resources that are run on a swarm. When
    deployed to a swarm, all the required services are scheduled and started on swarm
    nodes. Once deployed, the list of running services can be shown with `docker service
    ls`:


    ```

    ```bash

    $ docker deploy stackname

    ```

    ```


    The preceding command will deploy a stack named `stackname`. All services started
    by `docker deploy` are prefixed with the stack name. By default, `docker deploy`
    will look for a `.dab` file that matches the stack name. For example, a stack
    named `webdb` will look for a `.dab` file named `webdb.dab`. A different file
    can be specified with the `--file` option:


    ```

    ```bash

    $ docker deploy --file webdb.dab mystack

    ```

    ```


    # # Introducing Docker Datacenter


    Docker Datacenter is a commercial application from Docker. It is composed of the
    commercially supported Docker Engine, the UCP, and the DTR. The UCP provides a
    web-based interface to run containers and Docker Compose applications on a cluster.


    Docker Datacenter cannot be layered on an existing swarm. Instead, each node is
    added in a similar manner to joining a swarm. From the first node in the new cluster,
    run the following command:


    ```

    ```bash

    $ docker run --rm -it --name ucp -v

    /var/run/docker.sock:/var/run/docker.sock docker/ucp install -i --host-

    address <public ip>

    ```

    ```


    This command uses the `docker/ucp` image to perform the installation. The Docker
    socket is passed in as a volume to allow the install script to start the needed
    containers. The `--host-address` is the public IP address that will be used to
    access UCP. The interactive install will prompt you for an administrative password
    so that you can log in to the web interface.'
  merge: -1
  img_proc: true
- pgno: 109
