  md: '# # Setting constraints


    It is often useful to limit which nodes a service can run on. For example, a service
    that might be dependent on a fast disk might be limited to nodes that have SSDs.
    Constraints are added to the docker service create command with the `--constraint`
    flag. Multiple constraints can be added. The result will be the intersection of
    all of the constraints.


    For this example, assume that there is a swarm with three nodes – manager, worker1,
    and worker2. The worker1 and worker2 nodes have the env=prod label while manager
    has the env=dev label. If a service is started with the constraint that env is
    dev, it will only run service tasks on the manager node:


    ```

    $ docker service create --constraint "node.labels.env == dev" --name web-dev --replicas
    2 nginx

    913jm3v2ytrpxejpvtdkzrfjz

    ```


    ```

    $ docker service ps web-dev

