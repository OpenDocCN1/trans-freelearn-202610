- pgno: 94
  md: 'If the manager node you choose to rebuild on has an otherwise healthy raft
    database, you can start there. If not, or if you are rebuilding on a brand new
    node, stop Docker and copy the raft data back to /var/lib/docker/swarm/raft. After
    the raft data is in place, ensure that Docker is running and run the following
    command:


    ```

    $ docker swarm init --force-new-cluster --advertise-addr manager

    ```


    The address set in with --advertise-addr has the same meaning as what was used
    to create the swarm initially. The magic here is the --force-new-cluster option.
    This option will ignore the swarm membership data that is the raft database, but
    will remember things such as the worker node list, running services, and tasks.


    # # Backing up services


    Service information is backed up as part of the raft database, but you should
    have a plan to rebuild them in case the database becomes corrupted. Backing up
    the output of docker swarm ls is a start. Application information, including networks,
    and volumes may be sourced for Docker Compose files, which should be backed up.
    The container configuration, which includes the Dockerfile and everything needed
    to build the container, and your application should be in version control and
    backed up.


    Most importantly, do not forget your data. If you have your Dockerfile and the
    application code, the applications can be rebuilt even if the registry is lost.
    In some cases, it is a valid choice to not back up the registry since the images
    can, potentially, be rebuilt. The data, however, usually cannot be. Have a strategy
    in place for backing up the data that works for your environment. I suggest creating
    a container for each application that is deployed and can properly back up data
    for the application. Docker Swarm does not have a native scheduled task option,
    but you can configure cron on a worker node that runs the various backup containers
    on a schedule.


    The pause availability option can be helpful here. Configure a worker node that
    will be your designated host to pull backups. Set the availability to pause so
    that other containers are not started on the node and resources are available
    to perform the backups.'
  merge: -1
  img_proc: true
- pgno: 95
  md: "Using `pause` means that containers can be started in the background and will\
    \ continue to run after the node is paused, allowing them to finish normally.\
    \ Then `cron` can run a script that looks something like the following one. The\
    \ contents of `run-backup-containers` is left as an exercise for the reader:\n\
    \n```\n#!/bin/bash\ndocker node update --availability active backupworker\nrun-backup-containers\n\
    docker node update --availability pause\n```\n\nYou can also label to designate\
    \ multiple nodes for backups and schedule services to ignore those nodes, or in\
    \ the case of backup containers, run on them. Labels are covered in more depth\
    \ in the next section.\n\nMany network storage solutions provide options such\
    \ as snapshots that may augment your backup strategy.\n\n# # Grouping nodes with\
    \ labels\n\nIt is often useful to group your nodes. For example, you may have\
    \ a set of nodes that have external IP addresses and another set that only has\
    \ private IP addresses. Frontend services, such as web servers, should be on the\
    \ public nodes while backend services such as databases should be on the nodes\
    \ with private addresses. In another case, you might have a set of nodes with\
    \ SSDs while another has slower disks. Docker Swarm accomplishes this grouping\
    \ with labels.\n\n**Labels** are added to a node with `docker node update`. A\
    \ label can be added by itself or as key/value pair. One or more labels can be\
    \ set at one time:\n\n```\n$ docker node update --label-add frontend worker1\n\
    $ docker node update --label-add backend --label-add env=prod worker2\n```\n\n\
    The `docker node inspect` command will show you everything about a node including\
    \ the labels. By default, it outputs in JSON format. To make it easier to read,\
    \ use the `--pretty` flag:\n\n```\n$ docker node inspect --pretty worker2\nID:\
    \ 0c9wmu7elqs8zkxe6k103k1t3\nLabels:\n - backend =\n - env = prod\nHostname: worker2\n\
    ```"
