    ExecStart=/usr/bin/docker run --name nginx -p 80:80 nginx

    ExecStop=/usr/bin/docker stop nginx

    ```


    The [Unit] section sets the description and some meta information about the service.

    The Description option is a short, freeform description of the service. The After
    option

    tells Fleet that this service must start after Docker. Since it does not make
    sense to run a

    Docker container without Docker, the Requires option is set. For both After and

    Requires, the value is the name of a systemd unit. Additional units can be added
    to both

    by adding additional After or Requires lines or by adding additional units to
    the existing

    lines, separated by spaces.


    The steps needed to start a service that is set in the [Service] section. The

    TimeoutStartSec option is the number of seconds to wait for a service to start.
    If the

    service does not complete start up within the timeout window, Fleet assumes the
    service

    failed and kills it.


    Each ExecStartPre line combines to form a script that runs prior to starting the
    actual

    service. Prefixing a command with a minus (-) tells systemd that it is okay for
    this step to

    fail. Otherwise, any command that exits with a non-zero error code will prevent
    the service

    from starting.


    The first command kills the existing nginx is container. If it is not running,
    this command

    will fail, but that is just fine. Killing the service might seem a little extreme.
    If the service

    stops cleanly, then the running container will be in a stopped state and kill
    will do nothing.

    If the service did not stop cleanly, docker kill ensures that the service is stopped
    so that

    it can be restarted.


    The second command removes the container from Docker. A container cannot start
    if a

    container with the same name already exists. Removing the container ensures that
    the

    container will be recreated with all the right options later.


    The third and final ExecStartPre line pulls a new copy of the image. This ensures
    that the

    service is not running a stale image. One might think that this would be a command
    that

    should prevent the service from starting if it fails. Letting it fail means that
    the service can

    still start if the registry is down, assuming that the image has already been
    downloaded.'
