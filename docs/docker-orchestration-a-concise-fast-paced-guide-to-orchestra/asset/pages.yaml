    # Introducing the Docker Trusted Registry and Docker Datacenter


    The Docker Trusted Repository (DTR) is an application that is available for the
    Docker Universal Control Plane (UCP) and is part of Docker Datacenter. Docker
    Datacenter provides an on-site or cloud-based cluster management tool with Role-Based
    Access Control (RBAC), LDAP, and AD authentication, and monitoring of your Docker
    hosts. In effect, Docker Datacenter is Docker Cloud with DTR filling the role
    of Docker Hub running on your own network.


    Docker Datacenter supports automated builds or testing of images with full CI/CD.
    It also has built-in support for high availability and image security. Docker
    Datacenter uses the integrated Docker Content Trust to digitally sign and verify
    images. This ensures that the image you get is the one you want.


    # Building it yourself


    If none of those options work for you, there is the option to build it yourself.
    This will allow you to customize the registry for your specific needs but may
    require significantly more work to implement. It also works well in smaller environments
    that do not need the complexity of GitLab or expense of Docker Datacenter but
    still need a private repository.'
