- pgno: 172
  md: '# # Using Simpler Orchestration Tools – Fleet and Cattle


    Docker Swarm, Kubernetes, and Mesosphere are the big players in Docker orchestration,
    but they are hardly the only ones. In some cases, they are overkill. This chapter
    will look at two of the other options—Fleet and Cattle. Each tool has its own
    strengths and weaknesses. Fleet is a lower-level tool that is great for small
    environments or as a base for other tools. Cattle is a fully featured orchestration
    suite that is simpler to use than Kubernetes or Mesosphere.


    This chapter will cover the following topics:


    +   - Using Fleet

    +     - Installing Fleet

    +     - Using `fleetctl` to start, stop, and remove services

    +     - Using environment variables with Fleet unit files to configure containers

    +     - Setting service affinity and anti-affinity for high availability

    +     - Using sidekick services

    +     - Running global services

    +   - Using Rancher Cattle

    +     - Installing Rancher Server, agents, and clients

    +     - Managing application stacks with `rancher-compose`

    +     - Perform zero downtime upgrades

    +     - Configuring health checks

    +     - Using the built-in DNS discovery and load balancing services'
  merge: -1
  img_proc: true
- pgno: 173
  md: "# # Using Fleet\n\nFleet was developed by the CoreOS company as a way of managing\
    \ containers in CoreOS clusters. It is a low-level tool that other tools can build\
    \ upon. Fleet has limits of approximately 100 nodes and 1,000 services. Having\
    \ said that, for a small cluster, it can be just enough orchestration to meet\
    \ the needs of your organization. It can also provide a solid base to build in-house\
    \ processes.\n\nLike all Docker orchestration tools, Fleet requires an overlay\
    \ network. CoreOS ships with Flannel installed, but any Docker overlay network\
    \ can be used. This includes the Docker native overlay and Weave Net. Overlay\
    \ networks were described in Chapter 3, Cluster Building Blocks – Registry, Overlay\
    \ Networks, and Shared Storage. It is important to note that neither Flannel nor\
    \ Fleet provide any sort of service discovery. If that feature is needed, an overlay\
    \ network which provides service discovery, such as Weave Net, may be used instead.\n\
