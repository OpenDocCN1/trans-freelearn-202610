    # ## Summary


    In this chapter, you have seen how to use Docker Swarm to orchestrate a Docker
    cluster. The same tools that are used with a single node can be used with a swarm.
    Additional tools available through swarm, allow for easy scale out of services
    and rolling updates with little to no downtime. In the next chapter, you will
    look at how to use Kubernetes to orchestrate your cluster.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# # Deploying and Managing Services with Kubernetes


    Kubernetes was started at Google as a way for them to manage containers and was
    released as open source on June 2014. Other companies quickly jumped on board.
    Kubernetes is the backend for Red Hat OpenShift 3, Deis Workflow, and fabric8’s
    Platform as a Service (PaaS) products. Everyday, more and more organizations are
    deploying Kubernetes to orchestrate their services.


    Kubernetes is a huge project; there is no way to cover everything about it in
    a single chapter. This chapter will cover everything you need to get started orchestrating
    containers using Kubernetes. The full documentation can be found at http://kubernetes.io/docs/.


    The following topics are covered in this chapter:


    +   * Installing Kubernetes

    +   * Running pods

    +   * Managing deployments

    +   * Using rolling updates to upgrade a deployment with zero downtime

    +   * Using services and load balancers to expose your application to the Internet

    +   * Using persistent volumes to preserve container data'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# # Getting to know Kubernetes


    Kubernetes is a complicated piece of software. As such, there are a number of
    components that an administrator needs to be aware of. Some will be used everyday
    while others will work quietly in the background to keep everything running.


    # # Command-line tools


    Following are the command-line tools:


    +   • kubeadm: This tool was added in Kubernetes 1.4, as of this writing, still
    considered an alpha tool. It is the new installer for Kubernetes on Linux hosts.


    +   • kubectl: This is the main tool used to interact with a running cluster.
    It is used to add pods and services, perform rolling updates, and much more. Nearly
    everyone who interacts with Kubernetes will use kubectl.


    # # Master components


    These components run on the master node. They are responsible for all of the high
    level controls of the cluster. Following are the master components:


    +   • etcd: This is where Kubernetes keeps its cluster configuration. Make sure
    this is backed up or you will be unable to recover your cluster in the event of
    a total rebuild.


    +   • kube-apiserver: The API server is the main point of contact for everything
    that interacts with the cluster. The kubectl tool uses it to manage services,
    the controllers use it for configuration, and much more. The kube-apiserver component
    is the only component on the master that needs to be accessible outside the cluster.
    It is also the only component that needs to connect to etcd.


    +   • kube-controller-manager: Unsurprisingly, this manages the running controllers.
    This includes replication controllers, node controllers, third-party controllers,
    and service accounts.


    +   • kube-scheduler: This schedules pods to run in the cluster. Any time new
    pods are started or scaled, the scheduler determines which nodes to run them on.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# # Node components


    Node components run on the worker nodes. They control running containers, networking,
    and other services. They are as follows:


    +   - **kubelet**: This is the main processing daemon on each node. It is responsible
    for starting containers, mounting volumes, downloading secrets, and keeping the
    node part of the cluster.

    +   - **kube-proxy**: This is responsible for maintaining the network rules and
    forwards network requests to the correct location.


    # # Installing Kubernetes


    Kubernetes can be installed on most cloud services or locally on your own hardware
    or virtual machines. Unsurprisingly, since Kubernetes is a Google project, it
    runs best on GCE and new features tend to be supported there first.


    In addition, Google has rolled out a service called **Google Container Engine
    (GKE)**, which is a pre-rolled Kubernetes service. Google maintains the Kubernetes
    master and makes it easy to add new nodes to the cluster. You only need to worry
    about the containers. This is the easiest way to get started with Kubernetes.


    For local installations, there are several options. The first is the new `kubeadm`
    tool which was released as a beta tool with Kubernetes 1.4. Second, there is the
    `kube-up.sh` script which is part of the Kubernetes release package which can
    install Kubernetes on a variety of platforms.


    There are two other options worth considering. RHEL has a `kubernetes` package
    available which is installable with `yum`. The Rancher container management suite
    has an option to automatically deploy Kubernetes environments.


    # # Installing with kubeadm


    The `kubeadm` tool was introduced in Kubernetes 1.4. The goal is to provide an
    easy way to install Kubernetes on any platform. For now, it only supports CentOS
    7 and Ubuntu 16.04. Installation using `kubeadm` is still a little messy but it
    is an exciting start. For more details, refer to http://kubernetes.io/docs/getting-started-guides/kubeadm/.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# # Installing with kube-up.sh


    GCE is the most fully supported way of running Kubernetes. The only serious difference
    between running Kubernetes on GCE compared to anywhere else is how external services
    are mapped to running pods. GCE also does a lot of the grunt work for you such
    as managing firewall settings and registering new nodes with the cluster:


    ```

    $ export KUBERNETES_PROVIDER=gce; wget -O - https://get.k8s.io | bash

    ```


    If you do not like the security risks of piping a downloaded script directly to
    bash or if you want to make changes to the install options, you can download the
    latest release, unpack it, and run kube-up.sh manually:


    ```

    $ cd kubernetes/cluster/

    $ export KUBERNETES_PROVIDER=gce; ./kube-up.sh

    ```


    The script will create a new Kubernetes master and a number of worker nodes. When
    it is done, it will create a kubeconfig file in ~/.kube/config. You will then
    be able to interact with the cluster using kubectl.


    A number of other cloud providers are available for installation with kube-up.sh
    including AWS, Azure, and GKE. It can also install a test cluster using Vagrant
    for local testing. For a full list and instructions on adapting kube-up.sh for
    your environment, refer to http://kubernetes.io/docs/getting-started-guides/binary_release/.


    # # Installing add-ons


    Kubernetes supports using add-ons to extend the functionality of the cluster.
    Most common are the kube-dns and kube-ui add-ons, which provide DNS-SD and a graphical
    view of the cluster, respectively. Add-ons can also be used to install different
    tools, such as Weave Net, for overlay networks. A list of available add-ons can
    be found at: http://kubernetes.io/docs/admin/addons/.


    # # Managing resources


    Every resource in Kubernetes is defined in a file in either JSON or YAML format.
    The two formats are completely interchangeable. YAML is usually easier for a human
    to read. It is possible to have some resources defined in YAML and others in JSON.
    As a best practice, pick a format and stick to it.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# # Creating resources\n\nAll resources will have at least two fields:\n\n\
    +   - apiVersion: This is the version of the API that is being used. As new features\
    \ are added, the version may change.\n+   - kind: This is the type of resource.\
    \ This tells Kubernetes what type of resource is being created.\n\nEach resource\
    \ may be defined in a separate file. In some cases, it is worth combining resources\
    \ into a single file. For example, it makes sense to define an ingress object\
    \ in the same file as the service that it exposes. In that case, separate the\
    \ resources with three dashes, ---, alone on a line. Following is an example showing\
    \ how to do this:\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n  name: wp-service\n\
    \  labels:\n    app: wordpress\nspec:\n  ports:\n    - port: 443\n      name:\
    \ https\n  selector:\n    app: wordpress\n---\napiVersion: extensions/v1beta1\n\
    kind: Ingress\nmetadata:\n  name: wp-ingress\nspec:\n  backend:\n    serviceName:\
    \ wp-service\n    servicePort: 80\n```\n\nOnce the resource is defined, it is\
    \ added to Kubernetes by running kubectl create. The -f flag tells kubectl to\
    \ read the resource definition from the given file. If the file name is a dash\
    \ (-), the resource is read from stdin:\n\n```\n$ kubectl create -f multi-deployment.yml\n\
    deployment \"multi-deploy\" created\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "It is also possible to tell `kubectl create` to read all of the files in a\
    \ directory by adding the `-R` flag and setting `-f` to a directory name. This\
    \ makes it easy to put all of the resources for a specific application in a directory\
    \ and load them all at once.\n\nThe Kubernetes project has created a tool called\
    \ Helm which can be used to package pre-configured resources. For more information\
    \ see https://github.com/kubernetes/helm.\n\n# Deleting resources\n\nResources\
    \ are deleted with the `kubectl delete` command. At its simplest, `kubectl delete`\
    \ is called with the type and name of the resource to delete:\n\n```\n$ kubectl\
    \ delete service wp-service\nservice \"wp-service\" deleted\n```\n\nLike the `create`\
    \ command, `delete` can use the `-f` flag to pass in a file. Every resource defined\
    \ in the file will be deleted. The `-R` flag can also be used to delete every\
    \ resource defined in a directory.\n\n# Running pods\n\nKubernetes organizes containers\
    \ into pods. Each pod is a collection of one or more containers. A pod can be\
    \ replicated, scaled, and updated independently of other pods running in the cluster.\
    \ Each pod is assigned an IP address, which is used to connect to the exposed\
    \ ports of containers running in the pod. Care must be taken to ensure that services\
    \ within a pod do not try to use the same port, but that is much easier to coordinate\
    \ than managing port usage across a Docker Swarm.\n\n# Defining a pod\n\n**Pods**\
    \ define one or more containers as well as all of the volumes that the containers\
    \ need. The containers operate as a single unit. They are all started and stopped\
    \ together. They can also communicate with each other on localhost. The pod is\
    \ defined using YAML or JSON and passed to `kubectl create`. Following is a simple\
    \ pod definition:\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n name: simple\n\
    spec:\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "```\ncontainers:\n - name: web\n image: nginx\n ports:\n - containerPort: 80\n\
    \ - containerPort: 443\n```\n\nThe preceding YAML file defines a simple pod that\
    \ runs a single nginx container. The name field sets the name of the pod. In this\
    \ case, the pod is named simple. The generateName field may be used instead of\
    \ the name field, this takes a prefix for an automatically generated name. This\
    \ is useful if you need to run multiple, independent copies of the pod.\n\nThe\
    \ spec field is where the pod's containers and volumes are defined. The containers\
    \ field takes a list of one or more containers. The preceding example creates\
    \ a single container named web. The container image is set with the image field.\
    \ These are the only two required fields for containers.\n\nThe ports field defines\
    \ the ports that will be exposed on the pod's IP address. This is the port in\
    \ the container, not the port that will be made public. Setting the external port\
    \ will be covered with service resources later in this chapter.\n\nThe ports field\
    \ uses TCP by default. The protocol can be set to UDP as an additional field to\
    \ the port. The following snippet shows what it would look like:\n\n```\nports:\n\
    \ - containerPort: 53\n protocol: UDP\n```\n\nThere is a lot more to pods than\
    \ can be covered in one chapter. For full details, refer to the pod specification\
    \ at: http://kubernetes.io/docs/api-reference/v1/definitions/#_v1_podspec.\n\n\
    Once the pod specification is written to a file, the pod can be added to Kubernetes\
    \ with kubectl create:\n\n```\n$ kubectl create -f simple-pod.yml\npod \"simple\"\
    \ created\n```"
  merge: -1
  img_proc: true
- pgno: 119
  md: "# Viewing pods\n\nA list of running pods is available by running `kubectl get\
    \ pods`. Adding `-o wide` will show the pod's IP address and the node that the\
    \ pod is running on:\n\n```\n$ kubectl get pods\nNAME        READY     STATUS\
    \    RESTARTS   AGE\nsimple      1/1       Running   0          12s\n$ kubectl\
    \ get pods -o wide\nNAME        READY     STATUS    RESTARTS   AGE       IP  \
    \          NODE\nsimple      1/1       Running   0          1m        10.246.46.5\
    \   kubernetes-node-1\n```\n\nThe details of a pod are available using the `kubectl\
    \ describe pod` command. Everything you need to know about a running pod is displayed\
    \ in the output of `describe`. The following command displays the details for\
    \ a pod named `simple`:\n\n```\n$ kubectl describe pod simple\nName:         \
    \      simple\nNamespace:          default\nNode:               kubernetes-node-1/10.245.1.3\n\
    Start Time:         Wed, 05 Oct 2016 18:55:46 -0600\nLabels:             <none>\n\
    Status:             Running\nIP:                 10.246.46.5\nControllers:   \
    \     <none>\nContainers:\n  web:\n  Container ID:     docker://6460c3565b2c0d7cb356f0d\n\
    \                    a2eaSe12f58017e881fb91176eaafb65b5a46bc31\n  Image:     \
    \       nginx\n  Image ID:         docker://sha256:ba6bed934df2e644ffdd34\n  \
    \                  e9d324c80f3c615544ee9a93e4ce3cfddfcbf84bdbdc2\n  Ports:   \
    \         80/TCP, 443/TCP\n  Requests:\n    cpu:            100m\n  State:   \
    \         Running\n  Started:          Wed, 05 Oct 2016 18:55:48 -0600\n  Ready:\
    \            True\n  Restart Count:    0\n  Volume Mounts:    /var/run/secrets/kubernetes.io/\n\
    \                    serviceaccount from default-token-dlmur (ro)\n  Environment\
    \ Variables: <none>\nConditions:\n  Type              Status\n  Initialized  \
    \     True\n  Ready             True\n```"
  merge: -1
  img_proc: true
- pgno: 120
  md: "```\nPodScheduled  True\nVolumes:\n default-token-dlmur:\n  Type:  Secret (a\
    \ volume populated by a Secret)\n  SecretName:  default-token-dlmur\nQoS Class:\
    \  Burstable\nTolerations:  <none>\nEvents:\n  FirstSeen    LastSeen    Count\
    \   From                   SubobjectPath  Type      Reason          Message\n\
    \  ---------    --------    -----   ----                   --------------  --------\
    \  ------          -------\n  7s           7s          1       {default-scheduler\
    \ }                      Normal   Scheduled    Successfully assigned simple to\n\
    \                                                                      kubernetes-node-1\n\
    \  ...\n```\n\n# # Environment\n\nMany containers use environment variables to\
    \ configure how they run. The `mysql` image uses environment variables to initialize\
    \ a database and set user passwords. The `wordpress` image uses environment variables\
    \ to configure the location of a MySQL database and set the appropriate credentials\
    \ in the configuration.\n\nHere is an example pod that runs the `mysql` image\
    \ and sets two environment variables. The first, `MYSQL_ROOT_PASSWORD`, sets the\
    \ password for the root user. The second, `MYSQL_DATABASE`, configures the container\
    \ to create a database named `wordpress`:\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: mysql\n  labels:\n    app: mysql\nspec:\n  containers:\n  -\
    \ name: db\n    image: mysql:5.7\n    ports:\n    - containerPort: 3306\n    env:\n\
    \    - name: MYSQL_ROOT_PASSWORD\n      value: password\n    - name: MYSQL_DATABASE\n\
    \      value: wordpress\n```"
  merge: -1
  img_proc: true
- pgno: 121
  md: "# Multi-container pods\n\nIt is possible to define pods that run multiple containers.\
    \ This is especially useful when migrating legacy applications into Docker and\
    \ Kubernetes.\n\nOne of the great things about pods is that every container in\
    \ a pod can connect to any other container within the pod on localhost. This makes\
    \ it fairly straightforward to migrate legacy applications into Kubernetes. With\
    \ standalone Docker, each container is assigned its own random IP address. That\
    \ can make it difficult for the containers to find each other unless a DNS-SD\
    \ tool is installed. Even worse, because each container gets a different IP, a\
    \ separate component such as HAProxy must be used to unify them under a single\
    \ IP address for end users.\n\nFor example, suppose you had a Samba file server\
    \ with a web interface and SFTP server for off-site access. Every service communicates\
    \ with the others on localhost and are accessible from the same IP address and\
    \ hostname. It is very convenient to be able to tell users to connect to myfiles.example.com\
    \ no matter which service they wish to use to access their files.\n\nBy combining\
    \ those services into a single pod, the application can be treated almost the\
    \ same way it would as if it were on a single host. They still communicate with\
    \ each other on localhost and are still available from a single IP address. Later,\
    \ as work is done to decouple components and make them multiple pods, they can\
    \ still be united under a single service. This service is assigned the single\
    \ IP to which the hostname can be mapped. Services will be covered later in this\
    \ chapter.\n\nLet's look at an example multi-container pod that starts WordPress\
    \ with a MySQL database. This example creates a pod named multi. This time, the\
    \ containers field lists two containers. The first is named wordpress and runs\
    \ the official wordpress image. The second is named db and runs the mysql image:\n\
    \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: multi\n  labels:\n    app:\
    \ wordpress\nspec:\n  containers:\n  - name: wordpress\n    image: wordpress\n\
    \    ports:\n    - containerPort: 80\n    - containerPort: 443\n    env:\n```"
  merge: -1
  img_proc: true
- pgno: 122
  md: "```\n- name: WORDPRESS_DB_HOST\n  value: 127.0.0.1\n- name: WORDPRESS_DB_USER\n\
    \  value: wordpress\n- name: WORDPRESS_DB_PASSWORD\n  value: password\n- name:\
    \ db\n  image: mysql\n  env:\n    - name: MYSQL_ROOT_PASSWORD\n      value: password\n\
    \    - name: MYSQL_DATABASE\n      value: wordpress\n    - name: MYSQL_USER\n\
    \      value: wordpress\n    - name: MYSQL_PASSWORD\n      value: password\n```\n\
    \nThere are a couple of things to note with this example:\n\n+   - First, the\
    \ `wordpress` container is configured to look for MySQL on `127.0.0.1` which is\
    \ localhost.\n+   - Second, the `db` container has no ports defined. This is because\
    \ the database does not need to be exposed on the pod's IP address.\n\nThe only\
    \ containers that can connect to the database are the ones in the same pod.\n\n\
    # Using secrets\n\nThe WordPress example in the previous section is pretty exciting,\
    \ but all of your security conscious administrators are probably having a small\
    \ heart attack over the plain text passwords in the pod definition. The good news\
    \ is that Kubernetes makes it possible to separate out things that should be secret\
    \ into a special `Secret` type. Secrets can be used to keep things such as passwords\
    \ out of pod definitions or they can be used to provide different passwords, SSL\
    \ certificates, or SSH keys in different namespaces without needing to change\
    \ the pod definitions."
  merge: -1
  img_proc: true
- pgno: 123
  md: "# Creating secrets\n\nSecrets are base64 encoded strings. On Linux, the strings\
    \ can be encoded with the base64 tool. Once the string is encoded, it can be added\
    \ to the YAML or JSON file that defines the secret:\n\n```\n$ echo -n \"root-password\"\
    \ | base64\ncm9vd2dlC1wYXNzd29yZA==\n```\n\nFollowing is an example that defines\
    \ two secret passwords for the root and wordpress users for the preceding WordPress\
    \ application:\n\n```\napiVersion: v1\nkind: Secret\nmetadata:\n  name: mysql-passwords\n\
    type: Opaque\ndata:\n  root: cm9vd2dlC1wYXNzd29yZA==\n  wordpress: d29yZHByZXNzTmV3LXhBcmN3N3J3J3Jk\n\
    ```\n\nYAML defines a new secret named mysql-passwords. The secrets are in the\
    \ data section. The root and wordpress keys will be used to reference the passwords\
    \ from the node definition.\n\nSecrets can be displayed with kubectl describe\
    \ secret. Well, almost. The secret object with its associated labels and a list\
    \ of keys is displayed, but the keys themselves are hidden:\n\n```\n$ kubectl\
    \ describe secret mysql-passwords\nName:         mysql-passwords\nNamespace: \
    \   default\nLabels:       <none>\nAnnotations:  <none>\nType:  Opaque\nData\n\
    ====\nwordpress:  18 bytes\nroot:       13 bytes\n```"
  merge: -1
  img_proc: true
- pgno: 124
  md: "It is important to note that the secrets that are not encrypted are fairly\
    \ easy to get. They are hidden when the secret is described with kubectl describe\
    \ secret, however, a user with the appropriate access can log in to a running\
    \ container that is using a secret and print it out. Do not rely on secrets to\
    \ keep your passwords and other sensitive secrets safe. For more details refer\
    \ to http://kubernetes.io/docs/user-guide/secrets/.\n\n# # Using secrets in environment\
    \ variables\n\nThere are two ways of getting the keys into the containers. The\
    \ first is through environment variables. Following is the WordPress pod definition\
    \ again. This time the passwords are retrieved from the mysql-passwords secret\
    \ object. The key option states which secret from the mysql-passwords secret object\
    \ is used. The relevant sections are highlighted. Inside the containers, the *_PASSWORD\
    \ environment variables will have the decoded values:\n\n```\napiVersion: v1\n\
    kind: Pod\nmetadata:\n  name: multi-secrets\n  labels:\n    app: wordpress\nspec:\n\
    \  containers:\n  - name: wordpress\n    image: wordpress\n    ports:\n    - containerPort:\
    \ 80\n    - containerPort: 443\n    env:\n    - name: WORDPRESS_DB_HOST\n    \
    \  value: 127.0.0.1\n    - name: WORDPRESS_DB_USER\n      value: wordpress\n \
    \   - name: WORDPRESS_DB_PASSWORD\n      valueFrom:\n        secretKeyRef:\n \
    \         name: mysql-passwords\n          key: wordpress\n  - name: db\n    image:\
    \ mysql\n    env:\n    - name: MYSQL_ROOT_PASSWORD\n      valueFrom:\n       \
    \ secretKeyRef:\n          name: mysql-passwords\n          key: root\n    - name:\
    \ MYSQL_DATABASE\n```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "```\n```yaml\nvalue: wordpress\n- name: MYSQL_USER\n  value: wordpress\n- name:\
    \ MYSQL_PASSWORD\n  valueFrom:\n    secretKeyRef:\n      name: mysql-passwords\n\
    \      key: wordpress\n```\n```\n\n# # Using secrets in files\n\nThe other option\
    \ is to have the secret available as files in the container. This is done through\
    \ **volumes**. A volume that contains the decoded secret values in files named\
    \ after the keys is created. This can be useful for adding SSL certificates and\
    \ SSH keys to a container. The application can be configured to use the mounted\
    \ secrets volume, or a small wrapper script can copy the file to a place the application\
    \ can find it.\n\nFollowing is a simple pod running `nginx`. It creates a volume\
    \ that is mounted in the container at `/etc/secrets`. This example uses the same\
    \ `mysql-passwords` secret as the previous example:\n\n```\n```yaml\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: nginx-secrets\nspec:\n  containers:\n  - name:\
    \ nginx\n    image: nginx\n    volumeMounts:\n    - name: secrets\n      mountPath:\
    \ \"/etc/secrets\"\n      readOnly: true\n  volumes:\n  - name: secrets\n    secret:\n\
    \      secretName: mysql-passwords\n```\n```\n\nIn the container, the decoded\
    \ secrets are available in `/etc/secrets`. Each secret is stored in a file in\
    \ the volume:\n\n```\n```bash\n# cd /etc/secrets/\n# ls\nroot wordpress\n# cat\
    \ root\nroot-password\n```\n```"
  merge: -1
  img_proc: true
- pgno: 126
  md: '# # Logging into a container


    It is often necessary to log in to a container to troubleshoot problems. The same
    functionality as `docker exec` is available in Kubernetes as `kubectl exec`. As
    one might expect, `kubectl exec` is a little bit different to account for the
    concept of pods:


    ```

    $ kubectl exec multi-secrets -c wordpress -it bash

    root@multi-secrets:/var/www/html#

    ```


    This example starts a bash shell in the `wordpress` container from the `multi-secrets`
    pod. The `-i` and `-t` flags work just like in `docker exec` by telling `exec`
    to take input from stdin and to create a new TTY.


    If the command that you want to run has flags, the command can be prefixed by
    two dashes (--). Following is an example that opens a MySQL shell in the `db`
    container in the `mysql-secrets` pod:


    ```

    $ kubectl exec multi-secrets -c db -it -- mysql -u root -p

    Enter password:

    Welcome to the MySQL monitor.  Commands end with ; or \g.

    Your MySQL connection id is 3

    Server version: 5.7.15 MySQL Community Server (GPL)

    Copyright (c) 2000, 2016, Oracle and/or its affiliates. All rights

    reserved.

    Oracle is a registered trademark of Oracle Corporation and/or its

    affiliates. Other names may be trademarks of their respective owners.

    Type ''help;'' or ''\h'' for help. Type ''\c'' to clear the current input

    statement.

    mysql>

    ```


    The `-c` flag can be omitted if the pod has only one container or if you want
    to connect to the first container in the pod. You can use `-c` even if the pod
    only has one container to avoid confusion.


    # # Deleting a pod


    When a pod is no longer needed, it can be deleted with `kubectl delete pod`. The
    following example deletes a pod named `simple`:


    ```

    $ kubectl delete pod simple

    pod "simple" deleted

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# # Using deployments


    A **deployment** is a set of pods with one or more replicas. It is responsible
    for ensuring that the requested number of pods are running and restarting them,
    if necessary. Deployments make it easy to scale out pods and update them later.
    Deployments supersede the `ReplicationController` resource.


    # # Creating a single container deployment


    One of the joys of Docker is the ability to start containers quickly and easily.
    Kubernetes can be complicated, but it is still easy to start a single container:


    ```

    $ kubectl run web --image=nginx:1.11 --replicas=2 --port=80

    deployment "web" created

    ```


    The preceding command creates a new deployment named `web` that is running two
    `nginx` images. The `--replicas` flag can be used to set the number of replicas
    desired. If omitted, only one pod is started. The `--port` flag tells Kubernetes
    to expose port 80. The `--port` flag may be used multiple times to expose additional
    ports.


    The `kubectl get deployments` command will show all of the current deployments
    in the cluster. In this case, it shows that both pod replicas are running, up
    to date, and available:


    ```

    $ kubectl get deployments

    NAME DESIRED CURRENT UP-TO-DATE AVAILABLE AGE

    web 2 2 2 2 12s

    ```


    A list of running pods is available from the `kubectl get pods` command. The `-l`
    flag limits the display to pods with the given label(s). When the `run` command
    is used, the pods are automatically given the `run=<name>` label, where `<name>`
    is the name of the deployment. To limit the list to only pods from the `run` named
    `web`, use the following command:


    ```

    $ kubectl get pods -l run=web

    NAME READY STATUS RESTARTS AGE web-4291803130-

    haisr 1/1 Running 0 13m web-4291803130-j7y51 1/1

    Running 0 13m

    ```


    Both replicas are running and ready to serve web pages.'
  merge: -1
  img_proc: true
- pgno: 128
  md: "# Creating a multi-container deployment\n\nMulti-container deployments require\
    \ that the deployment be defined in YAML or JSON. The file specifies the name\
    \ of the deployment, the number of replicas, and the pod specification. This same\
    \ format can also be used for single container deployments:\n\n```\napiVersion:\
    \ extensions/v1beta1\nkind: Deployment\nmetadata:\n  name: multi-deploy\nspec:\n\
    \  replicas: 2\n  template:\n    metadata:\n      labels:\n        app: web-deploy\n\
    \    spec:\n      containers:\n        - name: nginx\n          image: nginx:1.10.4\n\
    \        - name: mysql\n          image: mysql:5.5\n          env:\n         \
    \   - name: MYSQL_ROOT_PASSWORD\n              value: password\n```\n\nThe example\
    \ creates two pods with two containers—nginx and mysql. The pod is defined in\
    \ the template section of the deployment definition. It works just like the pods\
    \ already covered in this chapter. The biggest difference is that the pod name\
    \ is omitted. Pod names will be based on the deployment name.\n\nTake note of\
    \ apiVersion. Deployments are a new feature and still, officially, in beta. The\
    \ specification may change in later versions.\n\n# Scaling a deployment\n\nKubernetes\
    \ makes it easy to increase or decrease the number of replicas in a deployment\
    \ with the scale command. The following command scales the deployment named web\
    \ to three replicas:\n\n```\n$ kubectl scale --replicas=3 deployment/web\ndeployment\
    \ \"web\" scaled\n```\n\nA deployment can be scaled up or down as much as you\
    \ need. The scheduler will ensure that the required pods are started across the\
    \ cluster."
  merge: -1
  img_proc: true
- pgno: 129
  md: "# Rolling updates\n\nDeployments in Kubernetes have a feature that allows all\
    \ of the pods in a deployment to be updated automatically. Updates are triggered\
    \ whenever a part of the pod specification in the template section of a deployment\
    \ is changed.\n\n# Updating a deployment\n\nConsider the following deployment\
    \ which has two containers. The first, named web, is an nginx:1.10.1 image. The\
    \ second, named db, is a mysql:5.5 image:\n\n```\napiVersion: extensions/v1beta1\n\
    kind: Deployment\nmetadata:\n name: update-deploy\nspec:\n replicas: 2\n template:\n\
    \  metadata:\n   labels:\n    app: update-deploy\n  spec:\n   containers:\n  \
    \  - name: web\n     image: nginx:1.10.1\n    - name: db\n     image: mysql:5.5\n\
    \    env:\n     - name: MYSQL_ROOT_PASSWORD\n      value: password\n```\n\nBoth\
    \ containers are running older versions of their images. Let's start by upgrading\
    \ the web container:\n\n```\n$ kubectl set image deployment/update-deploy web=nginx:1.11.4\n\
    deployment \"update-deploy\" image updated\n```\n\nThis commands sets the image\
    \ attribute of the web container in the update-deploy deployment to nginx:1.11.4.\
    \ Immediately after that command is run, Kubernetes starts a new pod with the\
    \ updated image. When the new pod is ready, one of the existing pods is stopped.\
    \ This process is repeated until all of the replicas are updated.\n\nA word of\
    \ warning. Make sure that your container can run multiple times safely before\
    \ updating a deployment. By default, Kubernetes uses the same mechanism to perform\
    \ updates as it does to scale pods. If your application cannot run multiple copies,\
    \ you can set"
  merge: -1
  img_proc: true
- pgno: 130
  md: "the update strategy type to Recreate in the deployment definition. Kubernetes\
    \ will then stop the existing pods before starting new ones. The following excerpt\
    \ shows how to set the deployment strategy:\n\n```\napiVersion: extensions/v1beta1\n\
    kind: Deployment\nmetadata:\n  name: update-deploy\nspec:\n  strategy:\n    type:\
    \ \"Recreate\"\n...\n```\n\n# Getting the rollout history\n\nKubernetes remembers\
    \ the changes that have been made to the deployment. The revision history is available\
    \ by running the `kubectl rollout history deploy/<name>` command, where `<name>`\
    \ is the name of the deployment:\n\n```\n$ kubectl rollout history deployment/update-deploy\n\
    deployments \"update-deploy\"\nREVISION          CHANGE-CAUSE\n1             \
    \    <none>\n2                 <none>\n```\n\nFull details of the deployment are\
    \ available by adding `--revision=N` to the history command, where N is revision\
    \ number. In the following output, you can see that the image for the `web` container\
    \ was updated to `nginx:1.11.4`:\n\n```\n$ kubectl rollout history deployment/update-deploy\
    \ --revision=2 deployments\n\"update-deploy\" with revision #2\nLabels:      \
    \   app=update-deploy\n                pod-template-hash=1680774371\nContainers:\n\
    web:\n  Image:        nginx:1.11.4\n  Port:\n  Volume Mounts: <none>\n  Environment\
    \ Variables: <none>\ndb:\n  Image:        mysql:5.5\n  Port:\n  Volume Mounts:\
    \ <none>\n  Environment Variables:\n  MYSQL_ROOT_PASSWORD:  password\nNo volumes.\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 131
  md: "# # Rolling back an update\n\nYou may find that, after the update, something\
    \ has gone horribly wrong, and that the update needs to be rolled back. Fortunately,\
    \ there is a very convenient `undo` command:\n\n```\n$ kubectl rollout undo deploy/update-deploy\n\
    deployment \"update-deploy\" rolled back\n```\n\nWithout options, the command\
    \ will revert the named deployment to the previous one in the history. The `--to-revision=N`\
    \ flag will revert the deployment to revision `N` from the history.\n\n# # Deleting\
    \ a deployment\n\nRemember that the job of a deployment is to ensure that the\
    \ required number of pods are running. Trying to delete a deployment by deleting\
    \ the pods is like Sisyphus trying to roll a rock up a hill. Kubernetes will keep\
    \ recreating the pods as fast as they are deleted. When a deployment is no longer\
    \ needed, it can be deleted with `kubectl delete deployment`. Make sure that you\
    \ want to proceed because this will delete all running pods which are part of\
    \ the deployment:\n\n```\n$ kubectl delete deployment web\ndeployment \"web\"\
    \ deleted\n```\n\nIt is possible to delete a deployment while leaving the pods\
    \ running, using the `--cascade=false` flag. The leftover pods will have to be\
    \ deleted manually.\n\n# # Running pods on every node with DaemonSets\n\nA **DaemonSet**\
    \ is a type of resource that ensures a pod or set of pods runs on every node in\
    \ the cluster. The format of the resource is very similar to that of a deployment.\
    \ The `template` section is a pod specification just like a deployment:\n\n```\n\
    apiVersion: extensions/v1beta1\nkind: DaemonSet\nmetadata:\n  name: daemon\nspec:\n\
    \  template:\n    ...\n```"
  merge: -1
  img_proc: true
- pgno: 132
  md: "DaemonSets are useful for running services such as logging or monitoring. For\
    \ example, you might have a service such as collectd which sends performance data\
    \ to a monitoring solution.\n\nIt is also possible to limit a DaemonSet to only\
    \ run on a set of nodes that match a given selector. For example, your local Kubernetes\
    \ cluster may have a mix of server hardware from HP and Dell. You can create a\
    \ DaemonSet that runs the Dell OpenManage tools on nodes that have a hardware\
    \ label set to dell:\n\n```\napiVersion: extensions/v1beta1\nkind: DaemonSet\n\
    metadata:\n  name: omsa\nspec:\n  template:\n    spec:\n      nodeSelector:\n\
    \        hardware: dell\n...\n```\n\n# # Introducing scheduled jobs\n\nKubernetes\
    \ 1.4 introduced scheduled jobs. These are sets of containers that run on a schedule.\
    \ They are similar to Cron jobs in Linux and even use the Cron time format in\
    \ the specification. Scheduled jobs are still considered alpha and are not available\
    \ unless the `--runtime-config=batch/v2alpha1` flag is added to the API server\
    \ on startup. For more details refer to http://kubernetes.io/docs/user-guide/jobs/.\n\
    \n# # Using labels\n\nNearly every resource in Kubernetes can be assigned labels.\
    \ Labels are a way to organize your resources but do not change how they operate.\
    \ They are completely arbitrary and should be chosen to fit your environment.\
    \ For example, you may want to group resources by application, label pods that\
    \ are currently in testing, or signify that certain pods should only run on frontend\
    \ nodes."
  merge: -1
  img_proc: true
- pgno: 133
  md: "Labels are set in the `metadata` section of a resource. They are a series of\
    \ key/value pairs. In the following example, the pod has four labels set. The\
    \ `app` label is used to show that this pod is part of the `wordpress` application.\
    \ The `tier` label signifies that this pod should run on backend nodes. This pod\
    \ is still in testing so the `env` label is set appropriately. Finally, the `hero`\
    \ label exists in this example to show how arbitrary labels are:\n\n```\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: mysql\n  labels:\n    app: wordpress\n   \
    \ tier: backend\n    env: testing\n    hero: darkwing-duck\n...\n```\n\nBy themselves,\
    \ labels do nothing. When a resource is created, Kubernetes notes the labels and\
    \ goes about scheduling the resource somewhere in the cluster.\n\n# Using selectors\
    \ to find resources\n\nAll of the tools that list resources can take a selector\
    \ with the `-l` flag to limit the list to resources with labels that match. This\
    \ was used earlier in the chapter to see the list of pods started by a deployment:\n\
    \n```\n$ kubectl get pods -l 'app=update-deploy'\nNAME READY STATUS RESTARTS AGE\n\
    update-deploy-1680774371-9x8qd 2/2 Running 0 23h\nupdate-deploy-1680774371-y0tbf\
    \ 2/2 Running 0 23h\n```\n\nThis example lists all of the pods with the `app`\
    \ key and the `update-deploy` value. There are several different comparison operators\
    \ that can be used. Wrap the selector in single quotes to ensure that the shell\
    \ handles spaces and special characters properly:\n\n| Operator | Description\
    \ | Example |\n|---|---|---|\n| =, == | The value of the key must match. | `env\
    \ = production` |\n| != | The value of the key must not match. | `env != production`\
    \ |\n| in | The value is in a set of values. | `env in (testing, development)`\
    \ |"
  merge: -1
  img_proc: true
- pgno: 134
  md: '| notin | The value is not in a set of values. | env notin (testing,

    development) |

    | label | Does the resource have the label? The value is ignored. | app |

    | !label | Resources without the given label. The value is ignored. | !app |

    | , (comma) | Joins multiple queries. All queries must match. | env in (production,

    testing), app=website |


    There are a few resources in Kubernetes that use labels. The service resource,
    for example, groups pods that match a selector for load balancing and external
    access. Every time a pod that matches what the service is looking for is created,
    it is automatically added to the group.


    > Full details on using labels and selectors may be found at http://kubernetes.io/docs/user-guide/labels/.


    # Using namespaces


    Kubernetes uses **namespaces** as a logical separation between groups of running
    pods and their associated volumes, services, and controllers. By default, Kubernetes
    has two namespaces:


    +   * kube-system: This is used for containers running Kubernetes services and
    add-ons

    +   * default: This is where everything else runs


    Namespaces can be used as a way of providing different environments for development
    and production, between two business units, or even multiple customers. It is
    also possible to define resource limits per namespace.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "# Viewing namespaces\n\nIt is possible to list the currently configured namespaces.\
    \ Use the kubectl get namespaces command:\n\n```\n$ kubectl get namespaces\nNAME\t\
    \tSTATUS\tAGE\ndefault\t\tActive\t3h\nkube-system\tActive\t3h\n```\n\nDetails\
    \ of a specific namespace can be displayed with kubectl describe namespace. This\
    \ includes the overall quota on the namespace as well as resource limits on individual\
    \ entities:\n\n```\n$ kubectl describe namespace default\nName: default\nLabels:\
    \ <none>\nStatus: Active\nNo resource quota.\nResource Limits\nType Resource Min\
    \ Max Default Request Default\nLimit Max Limit/Request Ratio\n-------------------------\n\
    Container cpu - - 100m -\n-\n```\n\n# Creating namespaces\n\nA new namespace is\
    \ defined in a YAML file. This example creates a namespace named production:\n\
    \n```\napiVersion: v1\nkind: Namespace\nmetadata:\n name: production\n```\n\n\
    Then pass the namespace definition file to kubectl create:\n\n```\n$ kubectl create\
    \ -f production-ns.yml\nnamespace \"production\" created\n```"
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Switching namespaces


    Once a namespace is created, it is possible to take actions on that namespace.
    For one off changes, the `--namespace` option can be passed to `kubectl`:


    ```

    ```

    $ kubectl --namespace=kube-system get pods

    NAME                              READY   STATUS    RESTARTS   AGE

    heapster-v1.2.0-3649594813-4zdoy   0/4     Pending   0          4h

    kube-dns-v19-zmals                  3/3     Running   0          4h

    kube-proxy-kubernetes-node-1        1/1     Running   0          3h

    kubernetes-dashboard-v1.4.0-pbhe2   1/1     Running   0          4h

    monitoring-influxdb-grafana-v4-zc7x4 2/2   Running   0          4h

    ```

    ```


    If you plan on doing a lot of work in a namespace, it is best to create a context.
    This example creates a context named `production` that uses the `production` namespace:


    ```

    ```

    $ kubectl config set-context production --namespace=production

    context "production" set.

    ```

    ```


    The flags `--cluster` and `--user` can be used to set the cluster and username
    for the context, if they are different. Once a context is set, it is easy to switch
    to it whenever you need to. The following example switches to the `production`
    context. Now every command that is run with `kubectl` will be in the production
    namespace:


    ```

    ```

    $ kubectl config use-context production

    switched to context "production".

    ```

    ```


    # # Deleting a namespace


    A namespace may be a temporary sandbox or a long running environment. Whatever
    you use namespaces for, you may need to delete one. The following command will
    delete the `production` namespace:


    ```

    ```

    $ kubectl delete namespace production

    namespace "production" deleted

    ```

    ```


    Take a deep breath before deleting a namespace. Doing so will destroy anything
    in that namespace including pods, services, and volumes. Make sure there is nothing
    important in the namespace before you delete it.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Networking\n\nNetworking in Kubernetes is different from straight Docker,\
    \ in that, IP addresses are assigned per pod rather than per container. This allows\
    \ containers within a pod to connect to each other on localhost. It also allows\
    \ them to act as one service. This is more akin to the traditional server model\
    \ than most Docker tools. In addition, Kubernetes provides tools for doing automatic\
    \ load balancing for applications and can work with most cloud providers to use\
    \ their existing load balancers to provide external access.\n\nKubernetes requires\
    \ the use of an overlay network to allow pods to communicate across the cluster.\
    \ It supports GCE, Weave, Flannel, OpenVSwitch, and others either out-of-the-box\
    \ or with an add-on. DNS-SD is also available out-of-the-box through the kube-dns\
    \ add-on, but other services can be used instead.\n\n# Services\n\nKubernetes\
    \ assigns each pod an IP address, but that address will change every time the\
    \ pod is restarted. In addition, the IP assigned to the pod is a private address\
    \ that is not accessible outside of the cluster. Neither is helpful if you want\
    \ to make the application public. The solution is a service.\n\nServices provide\
    \ load balancing and maintain a static IP address for as long as the service exists.\
    \ Pods can be restarted, updated, or scaled and the service will keep track of\
    \ them and route traffic appropriately. This is done using selectors.\n\n# Creating\
    \ a service\n\nAs discussed previously, pods and deployments can have labels assigned.\
    \ A service uses those labels to determine which pods to send traffic to. Let’s\
    \ look at an example:\n\n```\napiVersion: extensions/v1beta1\nkind: Deployment\n\
    metadata:\n  name: wp\nspec:\n  replicas: 1\n  template:\n    metadata:\n    \
    \  labels:\n        app: wordpress\n    spec:\n      containers:\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: "```\n- name: wordpress\n  image: wordpress\n  ports:\n    - containerPort:\
    \ 80\n    - containerPort: 443\n...\n```\n\nThis is an abbreviated deployment\
    \ for a WordPress install. Notice that the label `app` has been set to `wordpress`.\
    \ Now, let's take a look at a service for this application:\n\n```\napiVersion:\
    \ v1\nkind: Service\nmetadata:\n  name: wp-service\n  labels:\n    app: wordpress\n\
    spec:\n  type: LoadBalancer\n  ports:\n    - port: 80\n      name: http\n    -\
    \ port: 443\n      name: https\nselector:\n  app: wordpress\n```\n\nThere are\
    \ a couple of things to note here. The `ports` section lists all of the ports\
    \ that this service will expose. If the ports match the ports set with `containerPort`,\
    \ then there is nothing more to do. If not, the `targetPort` field can be added\
    \ to the `port` entry with the port that the container is listening on. The following\
    \ example shows how to send port 80 in the service to port 5000 in the pod:\n\n\
    ```\nports:\n  - port: 80\n    name: http\n    targetPort: 5000\n```\n\nThe `selector`\
    \ field is where the service is configured to know which pods to serve. In this\
    \ case, the service is looking for pods or deployments with the `app` label set\
    \ to `wordpress`. Any new pod that shows up in the namespace that matches the\
    \ selector will be automatically added to the service.\n\n> Make sure that the\
    \ selectors for services do not overlap. It would be *bad*. If they do overlap,\
    \ there will be contention and the possibility that your applications will appear\
    \ in multiple services. Your WordPress service, for example, might suddenly be\
    \ showing your accounting application."
  merge: -1
  img_proc: true
- pgno: 139
  md: 'The Type field tells Kubernetes how this service will be exposed:


    +   - **ClusterIP**: This is the default type. It assigns the service an IP from
    a pre-configured pool. This address is almost always private and only accessible
    from within the cluster. Use this if your service is only servicing other applications
    in Kubernetes.

    +   - **NodePort**: This allocates a random port from 30,000 to 32,767 on every
    node in the cluster. Any request to that node will be sent to the pods targeted
    by the service. A specific port can be set with the `nodePort` option on a port
    entry. The port must still be within the configured range. The `NodePort` type
    is useful if you want to run your own load balancer.

    +   - **LoadBalancer**: This will start a cloud-specific load balancer to handle
    traffic for the service.


    There is much more to services than can be covered here. For more details refer
    to `http://kubernetes.io/docs/user-guide/services/`.


    # Listing services


    The list of services is available by running `kubectl get service`. The list will
    show the services, cluster IP and the external IP address if one has been assigned:


    ```

    $ kubectl get service

    NAME            CLUSTER-IP    EXTERNAL-IP   PORT(S)          AGE

    kubernetes      10.3.240.1    <none>        443/TCP          2h

    wp-service      10.3.242.67   104.154.253.227 80/TCP, 443/TCP  1h

    ```


