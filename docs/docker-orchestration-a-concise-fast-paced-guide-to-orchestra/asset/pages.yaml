  md: 'GitLab is another one of those projects that wants you to download a script
    and pipe it directly through sudo. Again, I cannot state strongly enough how dangerous
    that is. Instead, download the script, review it, and if it looks okay to you,
    then run it:


    ```

    $ wget -qO script.deb.sh

    https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.de

    b.sh

    $ sudo bash script.deb.sh

    $ sudo apt-get install gitlab-ce

    ```


    GitLab is configured in /etc/gitlab/gitlab.rb. A full guide to all of the options
    is beyond the scope of this book. Let''s, instead, focus on what is needed to
    configure the Docker Registry:


    ```

    registry[''enable''] = true

    registry_external_url ''https://registry.example.com''

    gitlab_rails[''registry_path''] = "/var/opt/gitlab/gitlab-rails/shared/registry"

    registry_nginx[''ssl_certificate''] =

    " /etc/gitlab/ssl/registry.example.com.crt"

    registry_nginx[''ssl_certificate_key''] =

    " /etc/gitlab/ssl/registry.example.com.key"

    gitlab_rails[''lfs_enabled''] = true

    ```


    The first line enables the registry service in GitLab. The second line sets the
    URL for the registry. It can use the same address as the rest of GitLab on a different
    port. It is also possible to make the registry available on a separate hostname.
    The third line sets the location of the registry on the filesystem.


    The fourth and fifth lines define the SSL certificate and key files. The certificate
    used for the registry must be trusted by the clients or Docker will throw an error.
    If the certificate you are using has an intermediate certificate, the certificate
    chain will need to be added to the certificate file:


    ```

    $ cat intermediate.pem your_certificate.pem > registry.pem

    ```


    > Using GitLab Docker registry without a certificate is possible but not recommended.
    Add --insecure-registry with the address of your registry to the startup command
    for the Docker daemon. Full details are available at https://docs.docker.com/registry/insecure/.'
