- pgno: 53
  md: "```\nversion: '2'\nservices:\n  web:\n    image: web-db\n    build: .\n   \
    \ depends_on:\n      - db\n  db:\n    image: mysql\n    ...\n```\n\nIn the preceding\
    \ example, `docker-compose` will start the `db` service first, then start the\
    \ `web` service. It will also start the `db` service if you try to start the `web`\
    \ service separately with `docker-compose up web`. You can define as many additional\
    \ dependencies as the service needs.\n\nThere is an important point to note here.\
    \ Docker Compose will start the required service first, but it will not wait for\
    \ it to be ready to accept connections before starting the services that depend\
    \ on it. In this case, `docker-compose` will start `db` and then `web` immediately\
    \ after. Unfortunately, MySQL takes a little time to get started. If the web application\
    \ tries to connect right away, MySQL might not be ready and your application could\
    \ fail to start.\n\nThere are a few ways to deal with this problem. The first,\
    \ and usually the best option is for your application to keep trying to connect.\
    \ Eventually, the database will be ready and your application can go about its\
    \ business. The reason I like this option is because failures happen often. In\
    \ large Docker environments, failure is often a feature. Containers are designed\
    \ to start quickly and are often replaced quickly as new versions of services\
    \ are deployed. A self-healing service means fewer headaches for the team managing\
    \ the cluster.\n\nAnother option is to use a wrapper around your application's\
    \ start up command. The wrapper could repeatedly poll the database, and when it\
    \ sees that the database is ready, start your application. The `start.pl` script\
    \ in the example application takes a much simpler approach, it just sleeps for\
    \ 60 seconds to give the database time to start.\n\n> The Docker documentation\
    \ points to two tools called `wait-for-it` and `dockerize`. Either can be used\
    \ to delay the start of your application until another service is ready. They\
    \ are available at https://github.com/vishnubob/wait-for-it and https://github.com/jwilder/dockerize,\
    \ respectively."
  merge: -1
  img_proc: true
- pgno: 54
  md: "# # Using Docker networks\n\nDocker supports the concept of virtual networks.\
    \ Docker Compose uses them to provide network isolation between applications.\
    \ By default, every application started with Docker Compose has its own virtual\
    \ network named after the application's namespace. That means, if you start two\
    \ different applications with docker-compose, they will not be able to see each\
    \ other.\n\nWithin an application's namespace, the network created by docker-compose\
    \ provides DNS service discovery. In the case of the example multi-container application,\
    \ there were DNS entries created for the web and database services called web\
    \ and db, respectively. In the configuration for the web application (MyApp/config.yml.in),\
    \ the database connection is configured to connect to a host named db. Docker\
    \ does the rest by making sure that the db hostname points to the db service.\n\
    \n![](img/02bead9c8ff4515f78dac0eb33163961_54_0.png)\n\nWhen a service is restarted,\
    \ it will get a new IP address but keeps the same hostname. Make sure your application\
    \ can handle this situation.\n\nOriginally, networking in Docker was very limited.\
    \ Recent releases have created a pluggable network stack that can be as simple\
    \ or complicated as you need. Docker Compose lets you configure that with the\
    \ networks option:\n\n```\nversion: '2'\n\nservices:\n  web:\n    image: web-db\n\
    \    build: .\n    ports:\n      - 80:5000\n    env_file:\n      - db.env\n  \
    \  entrypoint: ./start.pl --init --command shotgun\n    networks:\n      - frontend\n\
    \      - backend\n  db:\n    image: mysql\n    env_file:\n      - db.env\n   \
    \ networks:\n      - backend\n```"
  merge: -1
  img_proc: true
