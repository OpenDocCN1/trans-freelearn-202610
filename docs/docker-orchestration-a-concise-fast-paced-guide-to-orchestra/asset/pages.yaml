  md: '# # About the Author


    **Randall Smith** is a senior systems administrator at Adams State University.
    He has been administering Windows, Linux, and BSD systems since 1999.


    He has been active in helping other sysadmins solve problems online and off. He
    has presented at the Colorado Higher Ed Computing Organization and Educause conferences
    on topics including Linux KVM and Ceph.


    In his spare time, Randall streams Let''s Play gaming videos at Music Free Gaming
    on YouTube and Twitch.


    I would like to thank my family for their support and understanding as I disappeared
    into my bedroom for hours at a time to write this book. I would like to thank
