- pgno: 256
  md: "```\n\"/packer/scripts/install-updates.sh\",\n\"/packer/scripts/install-docker.sh\"\
    \n  ]\n}\n]\n}\n```\n\nFirst is the builders section. The only entry is the qemu\
    \ builder which is specified by the type setting. The iso_* settings specify the\
    \ URLs of the images to use, a checksum file to verify the images, and the type\
    \ of the checksum. In this case, there is only a single image file. Since the\
    \ image is a disk image rather than an ISO, the disk_image setting must be set\
    \ to true.\n\nThe format setting sets the output format to qcow2. The format can\
    \ also be set to raw. The disk_size setting sets the size of the new disk image\
    \ in MB. This sets the size of the disk but does not change the file system. Cloud-Init\
    \ will resize the root filesystem when the VM is booted with the disk image. The\
    \ output directory and the name of the generated image are set in the output_directory\
    \ and vm_name options, respectively. The path set in output_directory may be absolute\
    \ or relative to the location where Packer is run.\n\nBy default, the qemu builder\
    \ will start a VM using the SDI console. This will only work if X11 is available.\
    \ In most cases, the headless setting should be set to true. The console is available\
    \ via VNC to watch the console during the provisioning process.\n\nThe ssh_* settings\
    \ control how the qemu builder connects to the VM for provisioning. The ssh_username\
    \ and ssh_password settings set the credentials needed to log in to the VM. In\
    \ this case, it is configured to use the root user and the password set when the\
    \ image was prepared. The qemu builder will continually try to connect to SSH\
    \ after the VM starts, but will give up after the amount of time specified in\
    \ ssh_wait_timeout. Ensure that the timeout provides enough time for the VM to\
    \ boot.\n\nThe provisioners section is a list of provisioners that are to be used\
    \ to provision the image. This example has a single shell provisioner, which runs\
    \ the scripts specified in the scripts section on the VM. The install-updates.sh\
    \ script simply runs apt-get update && apt-get dist-upgrade -y. The second script,\
    \ install-docker.sh, is the install script from get.docker.com."
  merge: -1
  img_proc: true
