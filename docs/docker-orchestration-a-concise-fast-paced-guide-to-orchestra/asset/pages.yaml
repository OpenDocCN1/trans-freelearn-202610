    5skcigjackl6b8snptgcjbu12  web-dev.2    nginx   manager   Running

    Running 5 seconds ago

    ```


    Even though there are two other nodes in the swarm, the service is only running
    on the manager because it is the only node with the env=dev label. If another
    service was started with the constraint that env is prod, the tasks will start
    on the worker nodes:


    ```

    $ docker service create --constraint "node.labels.env == prod" --name web-prod
    --replicas 2 nginx

