- pgno: 258
  md: "# # Using Puppet with Packer\n\nProvisioning a new image with scripts works\
    \ if the needed changes are relatively simple. More complicated changes require\
    \ more complicated scripts. Configuration management tools are ideally suited\
    \ to the task and can be used to provision the new image. Ansible, Chef, Puppet,\
    \ and Salt are all supported.\n\nAn added benefit to using a configuration management\
    \ tool to provision an image is that the same configuration can be used to ensure\
    \ that it stays properly configured while the server is running. The exact process\
    \ to do that will vary depending on the tool being used.\n\nThe following Packer\
    \ snippet uses Puppet in the masterless mode to configure the image. The same\
    \ Puppet manifest that was used in the Using configuration management section\
    \ is used here as well. A command to join the Docker cluster should not be included.\
    \ The command to join the cluster can be run after a new instance is started in\
    \ the cluster:\n\n```\n\"provisioners\" : [\n{\n\t\"type\" : \"shell\",\n\t\"\
    scripts\" : [\n\t\t\"/packer/scripts/install-updates.sh\",\n\t\t\"/packer/scripts/install-puppet.sh\"\
    \n\t]\n},\n{\n\t\"type\" : \"puppet-masterless\",\n\t\"manifest_file\" : \"/packer/puppet/docker-host.pp\"\
    \n}\n]\n```\n\nThe first difference is that the install-docker.sh script was replaced\
    \ by install-puppet.sh which runs apt-get install -y puppet. Second is the new\
    \ provisioner block with a type of puppet-masterless. The manifest_file option\
    \ specifies the manifest that will be used to configure the image; a directory\
    \ may also be used. In that case, all of the manifests will be applied to the\
    \ node.\n\n# # Treating infrastructure like code\n\nLet’s pause for a moment and\
    \ consider what was just done. The server has been completely defined in one or\
    \ more files with a scriptable build process. We have just turned our servers\
    \ into code."
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The server images can be built through a CI process. Rather than performing
    updates on the running servers, new images can be built that incorporate the updates.
    The images can be fully tested through a test suite before being deployed. They
    can be fully vetted in a test environment before being deployed into production.
    Even the deployment process can be controlled through the CI process, just like
    the Docker images.


    The other benefit of this approach is that it is very easy to roll back updates.
    If a problem is discovered, new servers can be started on the previous, working
    image to restore services quickly. The broken image can be tested and debugged
    offline or in a different environment.


    This is, basically, the same approach to running versioned containers. The important
    thing from a troubleshooting perspective is that important data, such as logs,
    are not stored on the server. Instead, they should be stored on network storage
    or shipped to services such as Elasticsearch and Kibana.


    # ## Post-build configuration


    Using a custom image does not eliminate the need for boot-time and ongoing configuration
    management. Boot-time configuration can be minimized to simple things like the
    hostname or joining a cluster. When running in multiregion or multicloud environments,
    Cloud-Init sets information specific to the region.


    Configuration management of a running system is still important. It can ensure
    that the configurations that were put in place when the server was built, remain
    in place. It can also make simple changes such as updating administrators'' SSH
    keys without needing to fully rebuild the image.


    # ## Automating host deployment


    There are many ways to automate the deployment of Docker hosts. The specifics,
    as always, depend on the orchestration system. For example, adding new hosts to
    a Docker Swarm cluster running on Amazon EC2 is as easy as running something like
    the following:


    ```

    ```

    $ docker-machine create --driver amazonec2

    $ docker swarm join --token ABC... manager

    ```

    ```


    For Azure or GCE, it would be the same. Simply replace the driver and pass the
    appropriate driver specific flags to docker-machine.'
  merge: -1
  img_proc: true
- pgno: 260
  md: "This section will look at a couple of different tools that can be used to manage\
    \ the hosts for a Docker cluster. The first is Terraform which works with just\
    \ about everything. Next is Docker's own cloud management tool, Docker Cloud.\
    \ Finally, it will introduce two tools which are in public beta, Docker for AWS\
    \ and Docker for Azure.\n\nIf you plan on running on AWS, GCE, or Azure, consider\
    \ using the container hosting services that each of them offers. With each service,\
    \ the tasks of creating and managing hosts is taken care of by the service. Administrators\
    \ only need to concern themselves with the containers.\n\n# # Deploying hosts\
    \ with Terraform\n\nTerraform is a multicloud deployment tool. It uses a configuration\
    \ file to define what the cluster should look like. It then builds a plan for\
    \ creating or updating the cluster based on the configuration. The plan gives\
    \ the administrator a chance to review what is going to be done before it happens.\
    \ If the plan looks good, Terraform will execute the plan to bring the cluster\
    \ into compliance with the configuration.\n\nTerraform is completely cloud agnostic.\
    \ It works with AWS, GCE, Microsoft Azure, OpenStack, and others. It can be used\
    \ in combination with cobble to manage hosts running on local hardware. It even\
    \ has limited support for Docker. Even better, it can be used to configure multiple\
    \ clouds at the same time.\n\n# # Creating a Terraform configuration\n\nLet's\
    \ look at an example Terraform configuration. This example creates two new instances\
    \ on Amazon EC2. The file can be named anything but must end in `.tf`. Full documentation\
    \ for Terraform may be found at https://www.terraform.io/docs/index.html.\n\n\
    ```\nprovider \"aws\" {\n  access_key = \"ACCESS_KEY\"\n  secret_key = \"SECRET_KEY\"\
    \n  region = \"us-west-2\"\n}\n\nresource \"aws_instance\" \"docker-hosts\" {\n\
    \  count = 2\n  ami = \"ami-a9d276c9\"\n  instance_type = \"t2.micro\"\n  user_data\
    \ = \"${file(\"cloud-init.yml\") }\"\n  key_name = \"aws-key\"\n  vpc_security_group_ids\
    \ = [ \"sg-ID\" ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 261
  md: "```\ntags {\n  Name = \"docker${count.index}\"\n }\n}\n```\n\nEach provider\
    \ block specifies a cloud service. In this case, the provider is aws. The access_key\
    \ and secret_key options are the appropriate keys to manage the EC2 service. The\
    \ region option specifies the region to where these instances are going to be\
    \ started. A provider block can be specified for each region that instances will\
    \ be started in.\n\nThe resource block defines a resource that will be started\
    \ on a provider. Terraform matches resources to the appropriate provider type.\
    \ A resources with a type of aws_instances, as in this case, will be started on\
    \ an aws provider.\n\nThe count option specifies the number of identical resources\
    \ to start. The default is one. This can be changed later to scale the cluster\
    \ up or down.\n\nThe ami option sets the AMI to use for this instance. This can\
    \ be a public AMI such as the Ubuntu Xenial cloud image, as in this example. Private\
    \ AMIs can also be used. For example, Packer can build a new image and make it\
    \ available as an AMI. The instance_type is the type of instance to start.\n\n\
    > The specific AMI will depend on the version of image and the region it will\
    \ run in. A complete list of APIs for Ubuntu cloud images is at https://cloud-images.ubuntu.com/locator/ec2/.\n\
    \nA Cloud-Init file can be specified for each resource with the user_data option.\
    \ The easiest way to do it is to specify a file using the file() function. The\
    \ path is relative to the location that Terraform is run from. The configuration\
    \ will be encoded and added to the instance when it is created.\n\nThe key_name\
    \ specifies the SSH key to add to the default user. The key must already exist\
    \ in EC2. A list of VPC security groups may be set with the vpc_security_group_ids\
    \ option. The security groups must exist for this example to work. Make sure that\
    \ the security group allows SSH access or you may find yourself locked out of\
    \ the instance."
  merge: -1
  img_proc: true
- pgno: 262
  md: "Terraform can be used to create the VPC, security groups, and anything else\
    \ that might be needed. Full documentation is available at https://www.terraform.io/docs/providers/aws/index.html.\n\
    \nFinally, the tags option provides a way to set tags on the instance. This example\
    \ sets the Name tag. The ${count.index} variable is the current count if multiple\
    \ instances are created from the same resource. In this case, the two instances\
    \ are named dock0 and dock1.\n\n# Running Terraform\n\nCreating or updating a\
    \ cluster with Terraform happens in two steps. The first step is to generate a\
    \ plan, while not strictly necessary, the plan shows exactly what Terraform is\
    \ going to do; that way there are no surprises. To see the plan, run `terraform\
    \ plan` in the directory with your configuration. It will read the configuration\
    \ from the `.tf` files in the directory and create a plan:\n\n```\n$ terraform\
    \ plan\nRefreshing Terraform state in-memory prior to plan...\nThe refreshed state\
    \ will be used to calculate this plan, but will not be\npersisted to local or\
    \ remote state storage.\nThe Terraform execution plan has been generated and is\
    \ shown below.\nResources are shown in alphabetical order for quick scanning.\
    \ Green resources\nwill be created (or destroyed and then created if an existing\
    \ resource\nexists), yellow resources are being changed in-place, and red resources\n\
    will be destroyed. Cyan entries are data sources to be read.\nNote: You didn't\
    \ specify an \"-out\" parameter to save this plan, so when\n\"apply\" is called,\
    \ Terraform can't guarantee this is what will execute.\n+ aws_instance.docker-hosts.0\n\
    \    ami:                       \"ami-a9d276c9\"\n    associate_public_ip_address:\
    \ \"<computed>\"\n    availability_zone:         \"<computed>\"\n    ebs_block_device.#:\
    \        \"<computed>\"\n    ephemeral_block_device.#:  \"<computed>\"\n    instance_state:\
    \            \"<computed>\"\n    instance_type:             \"t2.micro\"\n   \
    \ key_name:                  \"aws-key\"\n    network_interface_id:      \"<computed>\"\
    \n    placement_group:           \"<computed>\"\n    private_dns:            \
