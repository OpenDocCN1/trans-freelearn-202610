    # Starting a host on GCE


    GCE is another big player in cloud computing. Their APIs make it very easy to
    start up new hosts running on Google''s high power infrastructure. Google is an
    excellent choice to host your Docker hosts, especially if you are already using
    other Google Cloud services.


    You will need to create a project in GCE for your containers. Authentication happens
    through Google Application Default Credentials (ADC). This means that authentication
    will happen automatically if you run docker-machine from a host on GCE. If you
    are running docker-machine from your own computer, you will need to authenticate
    using the gcloud tool. The gcloud tool requires Python 2.7 and can be downloaded
    from the following site: https://cloud.google.com/sdk/.


    ```

    $ gcloud auth login

    ```


    The gcloud tool will open a web browser to authenticate using OAuth 2. Select
    your account then click Allow on the next page. You will be redirected to a page
    that shows that you have been authenticated. Now, on to the fun stuff:


    ```

    $ docker-machine create --driver google \

    --google-project docker-test-141618 \

    --google-machine-type f1-micro \

    dm-gce-test

    ```'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/02bead9c8ff4515f78dac0eb33163961_27_0.png)


    It will take a few minutes to complete depending on the size of image you choose.
    When it is done, you will have a Docker host running on GCE. You can now use the
    ls, ssh, and ip subcommands just like the preceding AWS. When you are done, run
    docker-machine stop and docker-machine rm to stop and remove the image.


    > There are a number of options that can be passed to docker-machine including
    options to set the zone, image, and machine time. Complete documentation is available
    at https://docs.docker.com/machine/drivers/gce/.


    # Starting a host on Microsoft Azure


    Microsoft is a relative newcomer to the cloud services game but they have built
    an impressive service. Azure underpins several large systems including Xbox Live.'
