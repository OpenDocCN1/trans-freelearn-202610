    \ -f docker-compose.yml -f docker-compose-prod.yml config\nnetworks: {}\nservices:\n\
    \  db:\n    environment:\n      MYSQL_DATABASE: db\n      MYSQL_PASSWORD: password\n\
    \      MYSQL_ROOT_PASSWORD: root-password\n      MYSQL_USER: myapp\n    image:\
    \ mysql\n  web:\n    build:\n      context: /home/user/examples/ch02/web-db\n\
    \      entrypoint: ./start.pl --init --command starman\n      environment:\n \
    \       MYSQL_DATABASE: db\n        MYSQL_PASSWORD: password\n        MYSQL_ROOT_PASSWORD:\
    \ root-password\n        MYSQL_USER: myapp\n    image: web-db\n    ports:\n  \
    \    - 80:5000\nversion: '2.0'\nvolumes: {}\n```\n\nFrom this, you can see that\
    \ docker-compose did pick up our override of entrypoint. You can also see all\
    \ of the environment variables that were added via the env_files options. If you\
    \ see an option that does not look right, you can start hunting through your compose\
    \ files for that specific option. Most likely, you will have an ordering problem.\n\
    \n# Controlling start order\n\nLike almost every application that uses a database,\
    \ the preceding sample application will not work if it cannot connect to the database.\
    \ For this to happen, the database needs to be started first. Docker Compose provides\
    \ an option called `depends_on` that helps with this:"
