    # Using Rancher Cattle


    The word “Simpler” in the title is a bit of a misnomer when applied to Rancher
    Cattle. Cattle is a full featured orchestration system available with Rancher.
    It is simpler to set up than Kubernetes or Mesosphere. It is also easier to use
    due to a robust web interface and command-line tool based on Docker Compose. If
    you have already used Docker Compose, you may be quite comfortable with Cattle.


    # Installing Rancher


    Rancher and its components run in Docker containers. This makes it very easy to
    install almost anywhere.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Installing Rancher server


    The Rancher server can be added to any existing Docker cluster. The only requirement
    is that it is running Docker 1.10.3 or higher. A quick and dirty install for testing
    is as simple as running `docker run -d -p 8080:8080 rancher/server`. The web interface
    will then be available at port 8080 on your Docker host.


    For a permanent solution, the Rancher data will need to be stored in a volume
    or connected to an external MySQL database. The volume can be any Docker volume
    including a directory on the host server. The following example will store the
    MySQL data in `/var/lib/rancherdb`:


    ```

    $ docker run -d -v /var/lib/rancherdb:/var/lib/mysql -p 8080:8080

    rancher/server

    ```


    For an external database, create an environment file that contains the connection
    information. The database set in CATTLE_DB_CATTLE_MYSQL_NAME must have already
    been created and the user set in CATTLE_DB_CATTLE_USERNAME must have been granted
    all rights to the Cattle database. The schema will be created automatically by
    Rancher if it does not already exist:


    ```

    CATTLE_DB_CATTLE_MYSQL_HOST=mysql-host

    CATTLE_DB_CATTLE_MYSQL_PORT=3306

    CATTLE_DB_CATTLE_MYSQL_NAME=cattle

    CATTLE_DB_CATTLE_USERNAME=cattle

    CATTLE_DB_CATTLE_PASSWORD=cattle-password

    ```


    The Rancher Server can be started with the environment file. In this example,
    it is named `cattle.env`:


    ```

    $ docker run -d --env-file cattle.env --name rancher-server -p 8080:8080

    rancher/server

    ```


    ![](img/02bead9c8ff4515f78dac0eb33163961_186_0.png)


    The Rancher Server can be installed on multiple nodes for high availability. For
    more information, refer to http://docs.rancher.com/rancher/v1.2/en/installing-rancher/installing-server/.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Installing Rancher agents


    Once Rancher has been started, it can create new hosts using any upstream provider
    that is supported by `docker-machine`. Log in to the web UI, go to **Hosts** in
    the INFRASTRUCTURE menu, and click on **Add Host**. A wizard will walk you through
    adding the host to the cloud environment:


    ![](img/02bead9c8ff4515f78dac0eb33163961_187_0.png)


    It is also possible to add the agent manually. Select the **Custom** option in
    **Add Host**. There will be a Docker command that will need to be run on each
    Docker host that is being added to the cluster. It will look something like the
    command listed here:


    ```

    sudo docker run -d --privileged -v

    /var/run/docker.sock:/var/run/docker.sock -v

    /var/lib/rancher:/var/lib/rancher rancher/agent:v1.0.2

    http://172.17.8.101:8080/v1/scripts/781E07FE518B7181D563:1477180800000:N3gz

    UQgoo3mFPcGkqEimBoNExFC

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: '![](img/02bead9c8ff4515f78dac0eb33163961_188_0.png)


    The Rancher agent creates IPSEC links between all the hosts in the environment
    to provide a secure overlay network. It also listens for Docker events and sends
    regular updates to the Rancher server with information on running containers and
    performance statistics.


    # Installing Rancher Compose


    Nearly anything that needs to be done to create and manage services in Rancher
    can be done through the web interface. However, there is a command-line tool called
    `rancher-compose` that can be used as well. It is available for Windows, OS X,
    and Linux. To install Rancher Compose follow these steps:


    +   1. To download it, click on **Download CLI** in the bottom right corner of
    the web interface and select your operating system.

    +   2. Unpack the downloaded archive and place the `rancher-compose` tool in your
    path.

    +   3. Rancher Compose requires an API key to authenticate the Rancher server.
    A new key for the environment or for a specific user can be created in the API
    section at the top of the page.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   4. Click on **Add Environment API Key** or **Add Account API Key** to create
    the appropriate key. You will be presented with an access key and a secret key.

    +   5. Copy them to a safe location. There is no way to get the secret key after
    it has been created:


    ![](img/02bead9c8ff4515f78dac0eb33163961_189_0.png)


    The access key, secret key, and Rancher URL are passed to `rancher-compose` using
    the `--access-key`, `--secret-key`, and `--url` flags, respectively:


    ```

    $ rancher-compose --url http://rancher:8080/ --access-key=CA... --secret-key=C4G...

    ```


    It is also possible to set the keys and URL with the `RANCHER_ACCESS_KEY`, `RANCHER_SECRET_KEY`,
    and `RANCHER_URL` environment variables. Add them to the equivalent of `.bash_profile`
    for your client system:


    ```

    export RANCHER_URL=http://rancher:8080/

    export RANCHER_ACCESS_KEY=CA...

    export RANCHER_SECRET_KEY=C4G...

    ```'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# ## Introducing environments


    Rancher supports running multiple environments. After installation, a single environment
    named `default` will be created that runs the Cattle orchestration suite. Additional
    environments can be created as needed. The environments are isolated from each
    other. This makes it easy to create environments for development, testing, production,
    or environments for different business units.


    While Cattle is the default orchestration tool, Rancher also has the ability to
    create new environments running Docker Swarm, Kubernetes, and Mesosphere. This
    is probably the easiest way to install either of those systems in a local environment.
    Once the new environment is created, add a new host. The services for the environment,
    such as `kubectl` or the Swarm agent, will be added automatically.


    For more information on using Docker Swarm refer to Chapter 4, Orchestration with
    Docker Swarm, for Kubernetes refer to Chapter 5, Deploying and Managing Services
    with Kubernetes, and for Mesosphere refer to Chapter 6, Working with Mesosphere.


    # ## Managing services


    Cattle uses Docker Compose files to define services. As of the 1.1.4 release,
    only version 1 of the Docker Compose specification is supported. Version 2 support
    is being added in Rancher 1.2.


    Rancher Compose builds on the standard `docker-compose.yml` file in two ways.
    First, special labels can be added to services to define things such as affinity.
    Second, another file called `rancher-compose.yml` can be used to define Rancher-specific
    settings such as health checks.


    > > The following sections discuss using the Rancher CLI. All of the following
    actions can also be done through the web interface.


    # ## Starting a stack


    By design, the `rancher-compose` tool is very similar to `docker-compose`. A **stack**
    is a collection of services defined in a `docker-compose.yml` file and an optional
    `rancher-compose.yml` file. There are pre-built stacks for many applications in
    the Rancher catalog. In addition to quickly deploying services, they can be great
    examples for building your own stacks.'
  merge: -1
  img_proc: true
- pgno: 191
  md: "To create your own stack, make a directory for your application that contains\
    \ the docker-compose.yml file. The stack name is derived from the directory name,\
    \ but may be overridden with the -s flag. When the compose files have been created,\
    \ run rancher-compose up in the directory. The following is a docker-compose.yml\
    \ file that starts a WordPress stack:\n\n```\nwordpress:\n  image: wordpress\n\
    \  env_file:\n    - db.env\ndb:\n  image: mysql:5.6\n  env_file:\n    - db.env\n\
    lb:\n  image: rancher/load-balancer-service\n  ports:\n    - 80:80\n  links:\n\
    \    - wordpress:wordpress\n```\n\nThis example starts three services. The first,\
    \ wordpress, starts the WordPress application. The second, db, is a MySQL database.\
    \ Both services use the db.env environment file to load the environment variables\
    \ needed to start. Environment files were covered in Chapter 2, Building Multi-Container\
    \ Applications with Docker Compose.\n\nThe lb service configures a Rancher load\
    \ balancer service for this application. Load balancers will be covered in more\
    \ detail later in this chapter. For now, it is enough to know that it is configured\
    \ to send port 80 to the wordpress service.\n\nAs with docker-compose, multiple\
    \ docker-compose.yml files may be specified on the command line with the -f flag.\
    \ The -d flag can also be set to start the stack in the background:\n\n```\n$\
    \ rancher-compose up -f docker-compose.yml -f production.yml -d\n```\n\n# Stopping\
    \ a stack\n\nServices are stopped with rancher-compose stop. This must be run\
    \ in the same directory that contains the docker-compose.yml file. By default,\
    \ rancher-compose will stop all running services:"
  merge: -1
  img_proc: true
- pgno: 192
  md: '```

    $ rancher-compose stop

    INFO[0000] [0/3] [lb]: Stopping

    INFO[0000] [0/3] [db]: Stopping

    INFO[0000] [0/3] [wordpress]: Stopping

    INFO[0001] [0/3] [lb]: Stopped

    INFO[0001] [0/3] [db]: Stopped

    INFO[0001] [0/3] [wordpress]: Stopped

    ```


    Individual services may be stopped by specifying the service name on the command
    line:


    ```

    $ rancher-compose stop wordpress

    INFO[0000] [0/3] [wordpress]: Stopping

    INFO[0001] [0/3] [wordpress]: Stopped

    ```


    # Removing a stack


    A service can be removed with `rancher-compose rm`. A single service can be removed
    by specifying the service name on the command line. The following command removes
    the `lb` service:


    ```

    $ rancher-compose rm lb

    INFO[0000] [0/3] [lb]: Deleting

    INFO[0000] [0/3] [lb]: Deleted

    ```


    Removing an entire stack requires that the `--force` flag be added to the command
    line. If `-force` is not included, `rancher-compose` will exit with an error and
    a reminder to add it:


    ```

    $ rancher-compose rm --force

    INFO[0000] [0/3] [lb]: Deleting

    INFO[0000] [0/3] [wordpress]: Deleting

    INFO[0000] [0/3] [db]: Deleting

    INFO[0000] [0/3] [db]: Deleted

    INFO[0000] [0/3] [wordpress]: Deleted

    INFO[0000] [0/3] [lb]: Deleted

    ```


    # Upgrading a stack


    There are two ways to upgrade a stack. The first is an **in-service** upgrade
    and the second is a **rolling upgrade**. Both options can provide zero-downtime
    upgrades. An in-service upgrade will replace the service running in a stack without
    changing the name of the service. In the WordPress example, the `wordpress` service
    remains `wordpress`. With a rolling upgrade, a new service must be defined which
    requires changing the service name in `docker-compose.yml`. In-service upgrades
    are recommended by Rancher and the only upgrade option available through the web
    interface.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "In-service upgrades are performed with rancher-compose up --upgrade:\n\n```\n\
    $ rancher-compose up --upgrade -d\nINFO[0006] [0/3] [db]: Starting\nINFO[0006]\
    \ [0/3] [wordpress]: Starting\nINFO[0009] [1/3] [db]: Started\nINFO[0009] Updating\
    \ wordpress\nINFO[0011] Upgrading wordpress\nINFO[0029] [2/3] [wordpress]: Started\n\
    INFO[0029] [2/3] [lb]: Starting\nINFO[0034] [3/3] [lb]: Started\n```\n\nAny changes\
    \ to existing services will be applied. If an upgrade requires a change to a running\
    \ service, the containers are stopped and then the new containers for the service\
    \ are started. This behavior is controlled on a per-service basis with the upgrade_strategy\
    \ option in rancher-compose.yml. The following example configures Rancher to start\
    \ new wordpress services before stopping the old ones. The db service, which runs\
    \ MySQL, continue to use the default behavior and will still stop the container\
    \ first before starting a new one:\n\n```\nwordpress:\n  upgrade_strategy:\n \
    \   start_first: true\n```\n\nThere are a couple of additional flags to rancher-compose\
    \ that are commonly used with upgrades. The first is the --pull flag, which forces\
    \ Rancher to pull a new copy of the image, even if it has it already. This is\
    \ especially useful if you are using the latest tag for an image and need to ensure\
    \ that the latest copy is available.\n\nThe second flag is the --force-upgrade\
    \ flag. This will force Rancher to perform an upgrade even if the docker-compose.yml\
    \ and rancher-compose.yml files have not changed. When combined with the --pull\
    \ flag, this can be used to upgrade all containers in the stack to the latest\
    \ version of whichever image tag they are running. Again, this is most useful\
    \ when using the latest tag or a tag that gets updated with point releases.\n\n\
    By default, rancher-compose will follow the logs of all the services in the stack.\
    \ The -d flag will perform the upgrade in the background without displaying the\
    \ logs."
  merge: -1
  img_proc: true
- pgno: 194
  md: "# # Rolling back and confirming upgrades\n\nAt this point in the process, there\
    \ is still an opportunity to rollback an upgrade. If the upgrade goes badly, it\
    \ can be rolled back by running `rancher-compose up --upgrade --rollback`. The\
    \ rollback can be done at any time as long as the update has not been confirmed.\n\
    \nOnce you are sure that the upgrade is successful, it can be confirmed by running\
    \ `rancher-compose up --upgrade --confirm-upgrade`. Remember that once an upgrade\
    \ has been confirmed, it cannot be rolled back:\n\n```\n```\n$ rancher-compose\
    \ up --upgrade -d --confirm-upgrade\nINFO[0005] [0/3] [db]: Starting\nINFO[0005]\
    \ [0/3] [wordpress]: Starting\nINFO[0009] [1/3] [db]: Started\nINFO[0013] [2/3]\
    \ [wordpress]: Started\nINFO[0013] [2/3] [lb]: Starting\nINFO[0016] [3/3] [lb]:\
    \ Started\n```\n```\n\nIn both cases, `rancher-compose` will follow the logs of\
    \ the services in the stack. This can be suppressed by passing the `-d` flag to\
    \ `rancher-compose`:\n\n# # Checking service health\n\nRancher supports adding\
    \ health checks to a service. A check can be configured to query a TCP port or\
    \ to make an HTTP request. For TCP, the service just needs to accept a connection.\
    \ For HTTP, the request must return a status code between 200 and 399. Anything\
    \ else will trigger an error. The following is a `rancher-compose.yml` file that\
    \ defines an HTTP check for WordPress and a TCP check for MySQL:\n\n```\n```\n\
    wordpress:\n  upgrade_strategy:\n    start_first: true\n  health_check:\n    port:\
    \ 80\n    request_line: GET / HTTP/1.0\n    interval: 3000\n    initializing_timeout:\
    \ 60000\n    unhealthy_threshold: 3\n    strategy: recreate\n    response_timeout:\
    \ 2000\ndb:\n  health_check:\n    port: 3306\n    interval: 3000\n```\n```"
  merge: -1
  img_proc: true
- pgno: 195
  md: '```

    initializing_timeout: 60000

    unhealthy_threshold: 3

    strategy: recreate

    response_timeout: 2000

    ```


    For an HTTP check, request_line must be set. If it is empty or absent, the check
    will only test the TCP connection. The initializing_timeout option defines the
    time in milliseconds to wait for a service to start. The number of milliseconds
    between checks is defined by the interval setting. If the check is not successful
    in the number of milliseconds defined in response_timeout, the check will fail.


    The unhealthy_threshold option sets the number of failures before Rancher does
    something about it. That something is defined by the strategy option. When set
    to recreate, as in the example, Rancher will recreate the service. There are two
    other options for strategy. The first option is none, which tells Rancher to do
    nothing. The second is recreateOnQuorum, which tells Rancher to restart the service
    if there is a given number of healthy containers in the service. The number is
    defined in the recreate_on_quorum_strategy_config section. An example is shown
    here:


    ```

    recreate_on_quorum_strategy_config:

    quorum: 1

    ```


    Health checks can be updated by upgrading the stack with rancher-compose up --upgrade.


    # Scheduling and affinity


    Rancher supports scheduling services manually on specific hosts, running them
    globally on all hosts in the environment, or setting service affinity or anti-affinity.
    Rancher does this with labels on the service in docker-compose.yml. A full list
    of the labels that can be used for scheduling is available at http://docs.rancher.com/rancher/v1.2/en/cattle/scheduling/.'
  merge: -1
  img_proc: true
- pgno: 196
  md: "# ## Using networking services\n\nRancher provides a couple of useful services.\
    \ First of all, Rancher uses IPSEC to create a secure overlay network for services\
    \ running on the cluster. Second, it provides DNS-SD for services within a stack\
    \ and for referencing services across stacks. Finally, Rancher can create load\
    \ balancers, which can spread the requests across containers in a service or redirect\
    \ traffic based on HTTP request information.\n\n# ## Discovering services\n\n\
    Rancher provides DNS-SD for all services running in the cluster. Within a stack,\
    \ all services are accessible by the service name. In the preceding WordPress\
    \ example, the wordpress container can access the MySQL service with the db hostname.\
    \ Services running other stacks are accessible with <service name>.<stack name>.\
    \ For example, if the preceding WordPress stack was named wordpress, the MySQL\
    \ service would be db.wordpress.\n\nEach service can specify an alias to refer\
    \ to another service using the links option. In the following example, an alias\
    \ is created in the wordpress service. That link makes the db service accessible\
    \ with the name mysql:\n\n```\n```yaml\nwordpress:\n  image: wordpress\n  env_file:\n\
    \    - db.env\n  links:\n    - db:mysql\ndb:\n  ...\n```\n```\n\n# ## Load balancer\n\
    \nRancher provides a HAproxy-based load balancer. It can proxy at layer four by\
    \ simply forwarding connections to the appropriate port or at layer seven, where\
    \ it can route traffic based on HTTP information. The load balancer can also provide\
    \ SSL termination for any service."
  merge: -1
  img_proc: true
- pgno: 197
  md: 'The easiest way to create a load balancer is through the web interface. Click
    on the down arrow next to **Add Service** and select **Add Load Balancer**. A
    window will open providing configuration options:


    ![](img/02bead9c8ff4515f78dac0eb33163961_197_0.png)


    If the load balancer is providing SSL termination, a certificate must be created
    in **INFRASTRUCTURE | SSL**. Multiple certificates can be configured for web services.
    The load balancer will use SNI to provide the correct certificate based on the
    requested server name.


    As seen in the preceding WordPress example, a load balancer may be created as
    part of a `docker-compose.yml` file. In that example, a simple load balancer is
    created that proxies HTTP connections on port 80 to port 80 in the `wordpress`
    service. To use plain TCP, append `/tcp` to the target port number. For example,
    to forward port 25 to TCP port 25 on a container, the port entry would be `25:25/tcp`.


    > All of the load balancer settings from the web interface are also possible through
    `docker-compose.yml`. For more details, refer to http://docs.rancher.com/rancher/v1.2/en/cattle/adding-load-balancers/.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Further reading


    This chapter and the preceding three showed just a few of the orchestration platforms
    out there. There are many others and it seems as if another one is released every
    day. Here are some other orchestration tools to look at:


    +   - Google, Amazon, and Microsoft all have container services as part of their
    cloud offerings. These are often the easiest ways to use containers in the cloud.

    +   - Red Hat OpenShift is a PaaS platform built on top of Kubernetes. It is available
    as a hosted platform or it can be installed on-site. There is also an open source
    variant called OpenShift Origin. For more details, refer to https://www.openshift.com/.

    +   - Panamax is an open source project developed by CenturyLink based on Fleet
    and CoreOS. It provides an easy to use web interface for managing applications.
    For more details, refer to http://panamax.io/.

    +   - Modera Cloud is an open source package that works with Docker Swarm. It
    bills itself as being, by developers for developers. It uses a command line interface
    to manage applications. For more details, refer to https://mcloud.io/.

    +   - Microsoft Azure Stack unifies management of containers with the rest of
    your on premise cloud. Windows Server 2016 released with container support, which
    is compatible with Docker. Windows Server is capable of running Windows-based
    containers as well as Linux-based containers in light weight VMs. As of this writing,
    Azure Stack is still a technical preview. For more details, refer to https://azure.microsoft.com/en-us/overview/azure-stack/.


    # Summary


    This chapter looked at two different tools—Fleet and Rancher. Fleet is a lower
    level system that is great for small environments or as a base for a higher level
    tool. It was shown how to start and stop services, set service affinity, run highly
    available services, and run global services across the cluster.


    Rancher makes it easy to run multiple environments using different orchestration
    tools, including Docker Swarm, Kubernetes, Mesos, and Rancher Cattle. This chapter
    also showed how to use rancher-compose to manage applications, create health checks,
    and load balance services.


    The next chapter will cover logging and monitoring of Docker clusters.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Monitoring Your Cluster


    Setting up orchestration for a Docker cluster is only half the battle. One also
    needs visibility into the cluster. Why is data retrieval slow? Is it disk or network?
    What is being logged by the web server for an application? How much memory is
    being used by an application? At some point, these or similar questions will come
    up and it will be up to you, as the administrator, to have the answers for these.


    This chapter will look at different tools that can be deployed to assist in monitoring
    and troubleshooting. Some, such as Kibana, can provide a summary of the cluster
    health while others, such as Sysdig, can provide deep dive information on applications
    or individual containers.


    This chapter will cover the following topics:


    +   - Docker logging drivers

    +   - Logging for containers that do not send logs to standard out or standard
    error

    +   - Logging and viewing logs with the ELK stack

    +   - Using remote logging with Kubernetes, Mesosphere, and Docker Datacenter

    +   - Collecting performance metrics

    +   - Graphing metrics with Kibana and Grafana

    +   - Considerations for logging and troubleshooting

    +   - Using Sysdig to view container metrics in real time


    # Logging with containers


    Nearly every application generates logs of some sort. They might track usage such
    as web server access logs or they may only show start up or error messages. In
    every case, logs have their use and not being able to see them can be a serious
    problem.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Logging in Docker is a strange beast. Containers are, by design, transient.
    They are designed to be created and destroyed often. This becomes a problem for
    application logs because log files are deleted right along with a container.


    The solution to the problem is two-fold. First, Docker provides a plugin system
    for logging, which takes everything an application prints to standard out or standard
    error and logs it somewhere. Second, a somewhere is needed for those logs to go
    to. In other words, a log aggregation server is needed.


    # Using Docker logging plugins


    Docker assumes that everything that is printed to standard out or standard error
    is a log. These logs can be accessed by running `docker logs <container name>`
    where `<container name>` is the name of the container. Unfortunately, these logs
    only exist as long as the container does. Docker solved this problem by creating
    a logging plugin system that allows an administrator to configure Docker to send
    those logs elsewhere.


    In an orchestrated environment, logs should be sent to a log aggregation server.
    If they are kept local, it becomes a challenge to find the logs when they are
    needed. There are several options for remote logging available. Following are
    a few of them:


    +   • syslog: This is the tried and true remote logging solution on Unix and Linux
    systems. This is a fine solution if a remote Syslog infrastructure is already
    available. The biggest drawback is that Syslog logs are unformatted making it
    difficult to automatically mine useful data from the logs.

    +   • gelf: The Graylog Extended Log Format (GELF) was developed by the Graylog
    project to overcome the deficiencies in Syslog by providing a structured log format.
    It works hand-in-hand with NoSQL style databases that can automatically index
    and search based on the keys in the GELF entry.

    +   • fluentd: This takes the concept of structured logs one step further by making
    it easy to send different logs to different logging and analytics services, including
    Elasticsearch, MySQL, and Nagios. No matter what the environment is, it is a good
    bet that Fluentd can work with it.

    +   • awslogs and gcplogs: These plugins send logs to Amazon CloudWatch and Google
    Cloud Logging, respectively. They are a great option if a Docker cluster is running
    exclusively on AWS or GCE.

    +   • etwlogs: This Windows-only plugin sends Docker logs to **Event Tracing for
    Windows (ETW)**. From there, standard Windows tools such as **System Center Operations
    Manager (SCOM)** can be used to aggregate and alert based on the logs.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'A complete list of logging drivers and their settings may be found at https://docs.docker.com/engine/admin/logging/overview/.


    A log driver may be specified for the Docker daemon with the `--log-driver` flag.
    The driver will apply to any containers started on the server. It is also possible
    to pass `--log-driver` as an argument to `docker run` to override the logging
    options for that container.


    Each logging driver takes a number of options specific to the driver. The `syslog`
    driver, for example, has options for the remote Syslog server address, log facility,
    and TLS options. The following example configures the Docker daemon to use the
    `gelf` driver to send logs to a Graylog server. The address name is set with the
    `gelf-address` option:


    ```

    $ docker daemon --log-driver=gelf --log-opt gelf-address=udp://graylog:12201 ...

    ```


    Setting the logging driver for a specific container works the same way. This example
    uses the `syslog` driver for a container:


    ```

    $ docker run --log-driver=syslog ...

    ```


    Nearly all of the logging plugins prevent the use of the `docker logs` command.
    The only way to see the logs for those containers will be through the aggregation
    server. During container testing, it may be helpful to set the log driver to the
    default `json-file` driver.


    > Warning: All output from a container is sent to the log server. This includes
    all of the command output from containers running a shell such as `docker run
    -it busybox`. The output of commands run through `docker exec` are not included.
    Specify a local logging driver if you are running commands that will output sensitive
    information that should not be in the logs.


    # # Logging containers that do not play by the rules


    There may be times when an application in a container does not output logs to
    standard output or standard error. This is common for traditional applications
    that are being transitioned to run in containers. There are a couple of options
    for handling the logs depending on the application.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "The first option is to run a service such as Logstash or Filebeat inside the\
    \ container. Logstash is configured to watch the application's log files and send\
    \ them to the appropriate server. A service controller such as `supervisord` is\
    \ used as the `entrypoint` in the `Dockerfile` to start the application and Logstash.\
    \ Be careful with this because it is possible that the logging service could stop\
    \ and not be restarted.\n\nA second option is to configure a volume in the `Dockerfile`\
    \ for the logs. Logstash could then be run in a sidekick container to read the\
    \ logs and send them to the aggregation server. If the service is running in a\
    \ Kubernetes cluster, a pod could be used to group the containers. This is a better\
    \ option, in general, because it keeps the logging tools separate from the application\
    \ making it easier to upgrade or replace each of them.\n\n# Logging with the ELK\
    \ stack\n\nThe combination of Elasticsearch, Logstash, and Kibana make up the\
    \ ELK stack. Each component makes up a single part of the whole. Elasticsearch\
    \ is the database. All log information will end up here. Logstash is what puts\
    \ (or stashes) the logs in Elasticsearch. Logstash has a number of input plugins\
    \ including `gelf` and `syslog`. Finally, Kibana provides a simple way to search\
    \ the logs and create dashboards based on the log information.\n\n# Starting Elasticsearch\n\
    \nElasticsearch is a NoSQL style database that can be used by a number of tools.\
    \ It is very fast and was designed from the beginning to be able to run in a multi-master\
    \ environment. The following example starts a new Elasticsearch container:\n\n\
    ```\n$ docker run -d --name es -p 9200:9200 -p 9300:9300 elasticsearch -E \n node.name=\"\
    Node1\"\n```\n\nSingle configuration settings can be set with the `-E` flag. The\
    \ value of `node.name` is the name of this node in the Elasticsearch cluster.\
    \ If you plan to run more than one Elasticsearch container, two more options are\
    \ needed. The first is `cluster.name` which is the name of the cluster and must\
    \ be the same for all nodes. The second is `discovery.zen.ping.unicast.hosts`\
    \ which contains a list of hosts to connect to. It may also be a DNS name that\
    \ resolves to multiple hosts. This is a good place to use the hostname from an\
    \ overlay network's DNS-SD."
  merge: -1
  img_proc: true
- pgno: 203
  md: "If a more involved configuration is needed, the configuration settings can\
    \ be added to /usr/share/elasticsearch/config in the container either as a volume\
    \ or by building a new image. The following Dockerfile shows how it might be done.\
    \ This has the advantage of letting you build an image with your configuration\
    \ baked in and allowing you to version your images for more controlled deployments\
    \ in the cluster:\n\n```\nFROM elasticsearch:5.0\nCOPY config /usr/share/elasticsearch/config\n\
    ```\n\nThe elasticsearch image stores its data in /usr/share/elasticsearch/data.\
    \ This should be a persistent, network volume. The exact configuration of the\
    \ volume will depend on what is being used for shared storage.\n\n# # Starting\
    \ Logstash\n\nLogstash is a tool that takes logs from various sources and stores\
    \ them in Elasticsearch. The simplest way to use it with Docker is to configure\
    \ it to listen for GELF logs. The configuration will look similar to the one shown\
    \ here:\n\n```\ninput {\n  gelf { }\n}\noutput {\n  elasticsearch {\n    hosts\
    \ => [ 'es.weave.local' ]\n  }\n}\n```\n\nThe gelf block tells Logstash to listen\
    \ for GELF logs. The elasticsearch block tells Logstash that output is going to\
    \ Elasticsearch. The hosts option is a comma delimited list of hosts. It can also\
    \ be a DNS entry that returns one or more IP addresses:\n\n```\n$ docker run -d\
    \ --name logstash -p 9200:9200 -p 12201:12201/udp logstash -f /config/logstash.conf\n\
    ```\n\nThe configuration file to use is set with the -f flag. This file can be\
    \ added to the container as a volume or added to a custom logstash image. Adding\
    \ the configuration to the image prevents configuration drift and ensures that\
    \ every Logstash service is doing the same thing:\n\n```\nFROM logstash:5.0\n\
    COPY logstash.conf /config/logstash.conf\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: 'There are two options for using Logstash with Docker:


    +   - The first is to run a central Logstash service that every Docker host uses.

    +   - The second option is to run Logstash on every host and configure Docker
    to send logs to the local Logstash container. This option will scale better on
    large clusters.


    The following example shows how to configure the Docker daemon to send GELF logs
    to a service running on localhost. If a central Logstash server is used instead,
    replace localhost with the address of the server:


    ```

    $ docker daemon --log-driver=gelf --log-opt gelf-address=udp://localhost:12201

    ```


    # Viewing the logs with Kibana


    Sending the logs to a remote server is great, but does not do any good unless
    there is a way to view them. This is where Kibana comes in. Kibana provides an
    interface to view and search the logs in Elasticsearch. It can also create graphs
    and charts based on any information in the Elasticsearch database.


    The easiest way to get started with Kibana is with the official Docker image.
    The following example shows how to run it. The value of ELASTICSEARCH_URL is the
    address of the Elasticsearch API service:


    ```

    $ docker run -d --name kibana:5.0 -e ELASTICSEARCH_URL=http://elasticsearch:9200
    -p 5601:5601 kibana

    ```


    Once Kibana is running, you can connect to the Docker host where Kibana is running.
    For example, if Kibana is running on 172.17.8.101, the address of the web interface
    is http://172.17.8.101:5601. There is no authentication, by default:'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/02bead9c8ff4515f78dac0eb33163961_205_0.png)


    The first time that you log in, you will be prompted for an index that Kibana
    will run analytics against. Logs from Logstash are available under the `logstash-*`
    index. Entries in the selected index must exist before an index can be configured.
    The **Time-field name** field must be set to `@timestamp`.


    Once the index pattern has been configured, the logs can be viewed on the **Discover**
    page. Once a lot of logs from a large number of services start arriving, viewing
    all of the logs at once becomes an exercise in futility. Fortunately, Elasticsearch
    is very good at searching. For example, one can see the logs for a single container
    with the `container_name:<container>` query, where `<container>` is the name of
    the container. It is also possible to search based on the image name using `image_name:<name>`
    in the query.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '> The field names `container_name` and `image_name` may be different if a different
    logging driver is used to add the logs to Elasticsearch.


    ![](img/02bead9c8ff4515f78dac0eb33163961_206_0.png)


    Individual logs are made up of a number of fields. Each field can be used as a
    query term. This makes it possible to drill down to exactly what is needed. The
    following screenshot shows the fields for a single log from Docker:'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/02bead9c8ff4515f78dac0eb33163961_207_0.png)


    Among the more useful fields for docker logs are the following:


    +   - `container_name`: This is the name of the container as specified by the
    `--name` flag to `docker run`.

    +   - `container_id`: This is the full ID of the container. This can be particularly
    useful if multiple containers are running with the same name.

    +   - `image_name`: This is the name of the image being used. This makes it possible
    to find logs for all containers running a specific image.

    +   - `host`: This is the name of the host that the container is running on.

    +   - `message`: This is the actual log message. This is whatever would have been
    printed by the `docker logs` command.


    Queries in Kibana are built using Elasticsearch syntax. Documentation may be found
    at https://www.elastic.co/guide/en/elasticsearch/reference/5.0/query-dsl-query-string-query.html#query-string-syntax.


    Search queries can be saved. This makes it easy to rerun queries that are needed
    often. Saved searches can also be added to dashboards to bring multiple sets of
    logs into a single view.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # Remote logging in Docker Datacenter


    Docker hosts managed by Docker Datacenter can be configured to use log drivers
    just like any other Docker host. Docker Datacenter, itself, supports logging to
    a remote Syslog server. Go to Settings and then to LOGS. From there, the remote
    Syslog server, protocol, and log level can be set. Click on Enable Remote Logging
    when you are done:


    ![](img/02bead9c8ff4515f78dac0eb33163961_208_0.png)


    # # Logging from Kubernetes


    Kubernetes was designed with centralized logging in mind. It can send logs to
    Google Cloud Logging or to Elasticsearch running as a Kubernetes service. Kibana
    is also started to provide an easy way to access logs sent to Elasticsearch. To
    enable Elasticsearch on installation, set the KUBE_LOGGING_DESTINATION environment
    variable to elasticsearch before running kube-up.sh:


    ```

    $ KUBE_LOGGING_DESTINATION=elasticsearch kube-up.sh

    ```


    For full details, refer to http://kubernetes.io/docs/getting-started-guides/.'
  merge: -1
  img_proc: true
- pgno: 209
  md: "# # Logging from Mesosphere\n\nMesosphere makes logs from every running service\
    \ available through the Marathon web interface. Unfortunately, it can be cumbersome\
    \ to access logs for more than one service at a time. There is no native way to\
    \ send service logs to an aggregation server.\n\nThere are a couple of options\
    \ to work around that. The first option is to configure the Docker daemon to send\
    \ logs to Elasticsearch using the GELF logging driver as described earlier. The\
    \ other option is to use Logstash or Elastic Filebeat to read the service logs\
    \ directly and send them to Elasticsearch.\n\nTo use Filebeat, install it on each\
    \ host from Elastic's yum repository. Then add the following to `/etc/filebeat/filebeat.yml`.\
    \ Be sure to change the name of the Elasticsearch hosts in the `hosts` key:\n\n\
    ```\nfilebeat.prospectors:\n- input_type: log\n paths:\n - /var/lib/mesos/slave/slaves/*/frameworks/*\n\
    \ /executors/*/runs/latest/stdout\n - /var/lib/mesos/slave/slaves/*/frameworks/*\n\
    \ /executors/*/runs/latest/stderr\noutput.elasticsearch:\n hosts: [\"elasticsearch:9200\"\
    ]\n```\n\n# # Logging your Docker hosts\n\nRemember that the cluster logs should\
    \ include the Docker hosts as well as Docker, itself. When considering a logging\
    \ solution for Docker, it is worth ensuring that logs from the hosts can be sent\
    \ there as well. Logstash, for example, has an option to act as a Syslog server.\
    \ Each host can be configured to send logs through Logstash which will add them\
    \ to Elasticsearch.\n\nAdding the logs from the Docker hosts to the same logging\
    \ solution as Docker will aid in troubleshooting and root cause analysis. A viewer\
    \ such as Kibana becomes the *single pane of glass* to see everything that is\
    \ happening in the cluster. Imagine getting alerts warning that certain containers\
    \ cannot talk to a database and seeing in the same view as the Docker logs, a\
    \ log message that an interface on a Docker host is disconnected. The faster problems\
    \ can be found, the faster services can be restored."
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Collecting and graphing performance data


    Logs are great, but sometimes what is really needed is a summary of system performance.

    A quick view of performance graphs can often tell an administrator much more than
    sifting

    through hundreds or thousands of log entries. A simple question such as “Why is
    this

    application slow?” can often require looking at performance data for the disks
    on the

    storage nodes, network utilization between each storage node and between the storage
    and

    the Docker host, memory and CPU utilization, and host disk performance. That does
    not

    even include things such as database speed and application inefficiencies. The
    good news is

    that all of this data can be collected and graphed.


    # Collecting data with collectd


    The collectd daemon is a powerful tool that can collect data from many different
    sources

    and send the data to a number of databases. Two of those databases are Elasticsearch
    and

    InfluxDB. Using Elasticsearch means that the data is available for Kibana to build

    visualizations and to include in dashboards. InfluxDB is a high-speed database
    designed

    specifically for storing time series data. There are a number of tools which can
    create graphs

    and charts from InfluxDB, including Grafana, which will be discussed a little
    later.


    Sometimes, the right answer to the question of which database to use to

    store cluster metrics is _both_. Elasticsearch and InfluxDB have their

    strengths and weaknesses but they compliment each other well. Try

    running them both for a while. It is always possible to stop sending data to

    one or the other at a later date.


    # Running collectd


    There are packages for collectd available for most major Linux distributions.
    In Debian and

    Ubuntu, installation is as simple as `apt-get install collectd`. Packages and

    installation instructions for other distributions are available at

    https://collectd.org/download.shtml.


    The `collectd` daemon can be run manually from the command line as in the following

    example. The `-f` flag will keep `collectd` in the foreground. The `-C` flag is
    used to provide

    a path to the configuration file:


    ```

    $ collectd -f -C /etc/collectd/collectd.conf

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: "There is no official Docker container for collectd. Some plugins make assumptions\
    \ that makes running it in a container problematic. For example, the memory plugin\
    \ hardcodes /proc as the source for memory information. In a container, /proc\
    \ only contains the information for the container rather than for the entire system.\n\
    \nInterface data is odd when collectd is run in a container because of the virtual\
    \ interfaces created for a container. This can be worked around using --net=host\
    \ with docker run.\n\n# Configuring collectd\n\nData is collected through a series\
    \ of plugins. Each plugin is loaded with the LoadPlugin option. If the plugin\
    \ has options, they are set using a <Plugin name> block, where name is the name\
    \ of the plugin. A complete list of plugins with links to their options is available\
    \ in the collectd.conf (5) man page or at https://collectd.org/wiki/index.php/Table_of_Plugins.\n\
    \nThe following example shows a basic configuration that reads CPU usage metrics,\
    \ load average, and disk usage:\n\n```\nBaseDir \"/var/lib/collectd\"\nPIDFile\
    \ \"/run/collectd.pid\"\nInterval 10.0\n\nLoadPlugin cpu\nLoadPlugin load\nLoadPlugin\
    \ disk\n```\n\nThe Interval option is the number of seconds between data collection\
    \ runs. Be sure that this is not set so low that it overwhelms the server. The\
    \ interval can be set per plugin using the <LoadPlugin> tag and specifying the\
    \ Interval option here:\n\n```\n<LoadPlugin foo>\n Interval 60\n</LoadPlugin>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 212
  md: "The preceding base example reads the data but does not do anything with it.\
    \ In a clustered environment, it is most likely that the data will be sent to\
    \ a database. The network plugin can be configured to send collected data to one\
    \ or more servers. The following snippet loads the network plugin and configures\
    \ collectd to send the data to two servers. The number after the IP address is\
    \ the UDP port number:\n\n```\nLoadPlugin network\n<Plugin network>\n    Server\
    \ \"172.17.8.102\" \"25826\"\n    Server \"172.17.8.101\" \"12203\"\n</Plugin>\n\
    ```\n\n# Storing performance data in Elasticsearch\n\nThe collectd daemon data\
    \ is added to Elasticsearch through Logstash. The following example adds a UDP\
    \ input plugin to the input block. Logstash will listen for collectd connections\
    \ on the port specified by the port option. The buffer_size option sets the maximum\
    \ packet size. For performance reasons, this should be set small enough to fit\
    \ in a single network frame.\n\nThe codec option tells Logstash that the incoming\
    \ packets are in binary network format of collectd. In order to properly map the\
    \ data types, Logstash needs a copy of types.db from collectd. The collectd daemon\
    \ usually installs types.db in /usr/share/collectd/.\n\nThis example does one\
    \ last thing. It sets the type for each input plugin. This makes it easy to see\
    \ only logs in queries in Kibana by adding _type:log to a query:\n\n```\ninput\
    \ {\n  gelf {\n    type => log\n  }\n  udp {\n    port => 12203\n    buffer_size\
    \ => 1452\n    codec => collectd {\n      typesdb => [ '/usr/share/collectd/types.db'\
    \ ]\n    }\n    type => perf\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 213
  md: 'If you are going to run Logstash in a container, create a custom image that
    adds `types.db`. An example Dockerfile is shown here:


    ```

    FROM logstash:5.0

    COPY types.db /usr/share/collectd/types.db

    ```


    # Storing performance data in InfluxDB


    InfluxDB was built from the ground up to handle time-series data. It is very fast
    with several options for high availability. Best of all, there is an official
    Docker container available. Starting InfluxDB is as simple as running the following
    command:


    ```

    docker run -d -p 8083:8083 -p 8086:8086 -p 25826:25826/udp --name influxdb \

    -v /usr/share/collectd/types.db:/usr/share/collectd /types.db:ro \

    -e INFLUXDB_COLLECTD_ENABLED=true \

    -e INFLUXDB_COLLECTD_port=25826 \

    -e INFLUXDB_COLLECTD_DATABASE=collectd_db \

    -e INFLUXDB_COLLECTD_TYPESDB=/usr/share/collectd/types.db\

    influxdb

    ```


    The environment variables configure InfluxDB to do the following in this order:


    +   • Enabling collectd support

    +   • Listening for collectd connections on UDP port 25826

    +   • Setting the database for collectd data to `collectd_db`

    +   • Setting the path within the container to the collectd `types.db`


    The `influxdb` image stores the database in `/var/lib/influxdb`. When run in production
    this should be on an external volume.


    # Graphing data with Kibana


    The **Visualize** page provides options for creating graphs and charts of data
    in Elasticsearch. Visualizations that are created can then be saved for later
    viewing, or combined on dashboards to provide a more complete view of a cluster
    or service.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# # Creating a new chart


    To create a new graph, click on Visualize, select the chart type, and then select
    the name of the index. Logstash data will be in the indices matching the logstash-*
    pattern. You will then be taken to a page to create the graph:


    +   1. Click on the arrow next to Y-Axis to show the options.

    +   2. Select the Aggregation method. The Average method works well in most cases.

    +   3. Select a Field. Obviously, this will vary depending on the data that is
    being graphed.

    +   4. Optionally, set the Custom Label for the axis.

    +   5. Additional metrics can be added:


    ![](img/02bead9c8ff4515f78dac0eb33163961_214_0.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   6. In the buckets section, click on the arrow next to X-Axis.

    +   7. Select the Aggregation method. In most cases this will be Date Histogram.

    +   8. The Field should be @timestamp unless there is a custom timestamp field
    set:


    ![](img/02bead9c8ff4515f78dac0eb33163961_215_0.png)


    +   9. Click on the arrow at the top of the configuration panel to apply the changes
    and see the graph.

    +   10. Click on Save from the menu at the top of the page to save the chart.


    By default, Kibana will aggregate all of the data for the chosen field into the
    graph. Often, it makes more sense to see the data broken out based on the host
    or other metadata. To do that, click on Add sub-buckets. Then click on Split Lines
    or Split Chart. Split Lines shows a line for each sub-bucket. Split Chart creates
    a separate chart for each sub-bucket. Split Chart is better if there are many
    metrics being graphed.


    To break the data out by hostname, set Sub Aggregation to Significant Terms, set
    Field to host.keyword, and Size to 1. Click on the arrow at the top to apply any
    changes and see what the graph looks like.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# # Adding charts to a dashboard


    Dashboards provide a way to show saved charts and searches together in one place.
    To create a new dashboard, follow the steps mentioned here:


    +   1. Click on Dashboard from the menu on the left and click on New from the
    menu at the top. Click on Add at the top of the page to add a new panel to the
    dashboard.

    +   2. Click on the saved visualization or search and it will be added to the
    dashboard:


    ![](img/02bead9c8ff4515f78dac0eb33163961_216_0.png)'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Panels can be resized and moved around the dashboard to present the information
    in a way that makes the most sense. When the dashboard is ready, click on the
    **Save** option at the top of the page. Give the dashboard a name and click on
    the **Save** button. Previously saved dashboards can be opened by clicking on
    the **Open** option from the menu at the top of the page.


    # # Graphing data with Grafana


    Grafana is a very powerful tool for graphing data. It can use Elasticsearch and
    InfluxDB as data sources, but InfluxDB has more query options for manipulating
    the data.


    One of Grafana''s biggest features is the ability to create dashboard templates
    that allow one to build groupings of datasets for easy display. For example, you
    could choose to display just web servers, database servers, or all servers tagged
    with *frontend*. For more details, refer to http://docs.grafana.org/reference/templating/.


    # # Installing Grafana


    The Grafana project has created a Docker image to make deploying Grafana easier.
    The basic command to get started is given here. The default username and password
    are both admin.


    ```

    $ docker run -d -p 3000:3000 --name grafana grafana/grafana

    ```


    By default, Grafana stores database and session information in /var/lib/grafana
    using SQLite. It can be configured to use MySQL or PostgreSQL instead. If you
    choose to stick with SQLite, make sure that /var/lib/grafana is mounted as an
    external volume. Full configuration documentation may be found at http://docs.grafana.org/installation/configuration/.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Adding data source


    Before Grafana can be used to graph data, it must know where the data is. To add
    a new data source select Data Sources from the drop-down menu at the top left.
    Click on the Add new button. The specifics will vary depending on the data source
    chosen with the Type option. When you are finished setting the connection information
    for the data source, click on Save & Test. Grafana will attempt to connect to
    the data source and will print a warning if there is a problem. Multiple data
    sources may be added and used within a single graph:


    ![](img/02bead9c8ff4515f78dac0eb33163961_218_0.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Creating a new dashboard


    A new dashboard can be created by selecting Dashboard from the drop-down menu
    and choosing the +New option. The new dashboard will be blank with a very small
    pop-out menu to the left of the row. From that pop-out menu, new panels can be
    added. The menu on an example dashboard is shown here:


    ![](img/02bead9c8ff4515f78dac0eb33163961_219_0.png)


    # Creating a graph


    Open the pop-out menu for a row and go first to Add Panel then to Graph. The graph
    editor will then be displayed. There are a lot of options. Do not panic. Most
    of them are simple with obvious functions. The most complicated is the Metrics
    tab. This is where the metrics are chosen to be displayed on the graph.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Click on the button that says **select metric** and choose the metric that
    will be used for this graph. In the following screenshot, the **load_shortterm**
    metric has been selected. Additional metrics can be added to the graph with the
    **Add query** button:


    ![](img/02bead9c8ff4515f78dac0eb33163961_220_0.png)


    A number of options are available including options to manipulate the chosen metric.
    One useful option is the ability to group the metric by a tag. Click on the plus
    sign in the **GROUP BY** row and select **tag(host)** to break each host out into
    its own line.


    When the graph is done, click on **Back to dashboard** to return to the dashboard.
    Click on the disk icon at the top or press **Ctrl + S** to save the dashboard.
    The dashboard will be available from the drop-down menu at the top of the page.


    # ## Using Heapster in Kubernetes


    Heapster is a Kubernetes service that collects node and pod metrics and makes
    them available through InfluxDB and Grafana or through Google Cloud Monitoring.
    It is installed by default when Kubernetes is installed with `kube-up.sh`. Full
    details on accessing metrics from Heapster are available at http://kubernetes.io/docs/user-guide/monitoring/.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'One of the things Heapster does is group container metrics by pod. It adds
    labels to the metrics based on the labels set in the pod. This makes it easy to
    create charts in Grafana that focus on a single pod or a single application made
    up of multiple pods.


    # ## Considerations for monitoring system health


    One of the things a system administrator learns early in his or her career is
    that it is better to find out about problems and fix them before the customer
    or the boss notices them. Log collection and performance graphs are essential
    when it comes to troubleshooting problems. Rarely, however, is someone watching
    every log message and every piece of performance data. There is just too much
    information and some administrators even have lives outside of the office. Fortunately,
    computers are very good at sifting through lots of data and rarely ask for time
    off.


    Most of the tools that have been used for years to monitor server and service
    health still apply. However, a fully orchestrated environment offers some unique
    challenges when compared to the old standalone server model. For example, a service
    does not live on a single host. It could run anywhere in the cluster. In addition,
    the ability to quickly add or remove capacity to the Docker cluster through AWS,
    GCE, or even a VM in a local data center makes adding specific hosts in a monitoring
    suite a challenge.


    There are too many variations to provide specific solutions that will work in
    all circumstances, but here are some general guidelines.


    # ## Monitor services


    Remember that the most important thing your clients care about when using your
    service is; “Does it work?”. For the administrator, the question is not just;
    “Is it up?”, but; “How can I keep it that way?”. There are several things that
    can be done to ensure that the administrators know that there are problems before
    the clients do:


    +   * **Use health checks**: Some orchestration tools, such as Kubernetes, can
    run checks to monitor the health of a service. Use them and make them meaningful.
    It is not enough to know that a web server is accepting connections on port 80.
    You also need to know if it is returning a good status code and showing what is
    expected.

    +   * **Monitor all of the moving parts**: A web application is usually more than
    a web server. Is there a database and is it responding properly? Do not be afraid
    to write a health check that logs into the database with the credentials of the
    web application and performs queries.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '+   - **Do not forget the network**: When running a cluster locally, it can
    be easy to overlook, or take for granted, the network infrastructure. Where feasible,
    add the networking stack to your monitoring. Some organizations split the network
    and server operations teams which may make adding the network stack to the Docker
    monitors politically problematic. In that case, make friends with the network
    team.

    +   - **Create useful dashboards**: Being able to see the logs and metrics from
    related components in one place can simplify troubleshooting. The trick is to
    know what is worth looking at and what is not. Too much information can be just
    as much a problem as too little.


    # # Watching services in real time with Sysdig


    Sysdig is a real-time command-line monitoring tool. It can monitor most host components
    and has support for reporting container statistics. It also has support for viewing
    metrics based on Kubernetes pods, replication controllers, services, and more.


    When possible, Sysdig should be installed and run directly on the host machine.
    This will provide it the most visibility into the system. Packages are available
    for Debian and Red Hat-based systems. Installation instructions may be found at
    http://www.sysdig.org/install/.


    It is also possible to run Sysdig in a container. This is especially useful if
    the Docker hosts are running a Linux distribution that is not directly supported
    or systems such as CoreOS which run everything in containers. The command to start
    the container is as follows:


    ```

    $ docker run -it --rm --name=sysdig --privileged=true \

    --volume=/var/run/docker.sock:/host/var/run/docker.sock \

    --volume=/dev:/host/dev \

    --volume=/proc:/host/proc:ro \

    --volume=/boot:/host/boot:ro \

    --volume=/lib/modules:/host/lib/modules:ro \

    --volume=/usr:/host/usr:ro \

    sysdig/sysdig

    ```


    There are a couple of things to note:


    +   - First of all, running `sysdig` in a container requires the use of the `--privileged`
    flag. It needs the access in order to load the `sysdig` kernel module and to be
    able to access all of the required information.

    +   - Second, the command maps through a number of important file systems such
    as `/proc` for visibility reasons.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '+   * Third, /var/run/docker.sock is mapped into the container so that sysdig
    can retrieve information about running Docker containers.


    Once sysdig has been installed, run the command cysdig to start the curses interface.
    This provides a top-like interface which lets you see what is happening on the
    server. Use F2 to switch views. The -pc flag adds container information to many
    of the views that are available:


    ```

    $ cysdig -pc

    ```


    ![](img/02bead9c8ff4515f78dac0eb33163961_223_0.png)


    Sysdig can be invaluable in troubleshooting a problem on a system in real time.
    Each view has options to drill down and see more information about a specific
    thing, which may be a container, network connection, host process, or any number
    of other items.


    # Summary


    This chapter showed how to send Docker logs and metrics to remote services. It
    showed how to use Kibana to view logs stored in Elasticsearch and how to use Kibana
    and Grafana to build charts and dashboards based on metrics stored in Elasticsearch
    and InfluxDB to provide useful information quickly. Some general tips were presented
    for monitoring services in a Docker cluster. Finally, Sysdig was introduced which
    can provide live monitoring of a host and containers. The next chapter will cover
    how to use continuous integration to build, test, and deploy containers.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Using Continuous Integration to Build, Test, and Deploy Containers


    One of the most important parts of running containers is building the images those
    containers are based on. After all, without an image, there is no container. One
    of the challenges is to ensure that the Docker images actually, not only build,
    but also work *before* being deployed.


    This chapter will demonstrate how to use GitLab to implement **Continuous Integration**
    (CI) for Docker images. It will show how to automatically build an image, run
    a test suite against it, push the new image into a Docker Registry, and even deploy
    the new image to a Docker cluster.


    The following topics will be covered in the chapter:


    +   • The importance of using CI

    +   • Setting up a project in GitLab for CI

    +   • Automatically building a new image

    +   • Running tests against an image

    +   • Releasing a tested image

    +   • Automatically deploying the image

    +   • Using GitLab CI to create DAB files

    +   • Using Docker Cloud for image testing'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# # The importance of using CI


    It is worth keeping in mind how a Docker application is defined. At its most basic
    level, a Docker application is really no different from any software project.
    It is simply a `Dockerfile` and the resources needed for the image are most likely
    stored in version control. It is software.


    Treating Docker applications like code means that an administrator or team of
    administrators can benefit from all of the advances in software development methodologies.
    One of those is the automated building and testing of a project. This process
    is called CI. Any time a change is made to an application, whether it is a small
    change to a configuration file or the upgrade of the actual application, the image
    can be automatically rebuilt and tested to ensure that the image will work as
    intended when it is deployed.


    I often joke that my job as a system administrator is to get other people or things
    to do my work for me. The reality is that the more I can empower other people
    in my organization, the more effective we can all be. For example, imagine a development
    team that is working on a web application. In a traditional model, these developers
    must wait for an administrator to deploy any changes into the testing and production
    environments and hope that nothing breaks in the process. Using a proper CI workflow
    means that whenever the developers are ready to deploy, the CI tools can safely
    deploy the application without waiting for an administrator to get around to it.
    The end result is faster, more consistent, and more reliable deployments.


    # # Using GitLab for CI


    GitLab is a wonderful tool for CI and deployment for Docker images and services.
    It combines Git with issue tracking, a Docker Registry, and CI to provide a unified
    experience. However, this process is not unique to GitLab. The lessons learned
    in this section should be applicable regardless of the systems used.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# # Setting up GitLab for CI


    GitLab CI is available for free as part of the offerings at GitLab.com. It is
    also possible to pay for an enterprise license which provides more resources.
    The free community and commercial enterprise editions of GitLab can also be installed
    locally. In Chapter 3, Cluster Building Blocks – Registry, Overlay Networks, and
    Shared Storage we showed how to install GitLab and how to enable the Docker Registry.


    A **registry** is an important part of making CI work. It provides a place for
    finished images to be stored for use in the cluster. Another registry could be
    used instead of GitLab. For example, an organization may choose to use the Docker
    Hub or the secure registry in Docker Datacenter.


    As of GitLab 8.0, GitLab CI is fully integrated into the main package. There is
    nothing else to install or enable in GitLab to make those features available,
    with one exception. The last component that is needed is a GitLab Runner.


    # # Installing the GitLab Runner on Ubuntu


    It is the job of the GitLab Runner to perform the actual image builds. Each build
    is queued up and processed in turn. It is possible to use multiple runners to
    allow multiple builds to be performed in parallel. Runners can be tagged to run
    specific tasks such as building Docker images or building an application for Microsoft
    Windows.


    The GitLab.com provides a shared runner that can be used to build images. This
    is great for smaller projects or for testing. Larger organizations should consider
    paying for an enterprise license or installing their own runner locally. A local
    runner may also be desired if the image tests contain sensitive information or
    if they need to connect to resources that are not accessible from the Internet.


    The preferred method of running the GitLab Runner is to install it natively on
    Debian, Ubuntu, RHEL, or CentOS. However, there is an official Docker image. For
    details on using the image, refer to https://gitlab.com/gitlab-org/gitlab-ci-multi-runner/blob/master/docs/install/docker.md.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The first step in installing a runner that will build Docker images is to have
    Docker installed. The build process will need to be able to pull images, build
    new ones, and push the completed build into the repository.


    GitLab provides a script to add their apt repository to the server. Download the
    script, double check that it will do what is expected, and then run it. For security
    reasons, do not pipe the download directly to sudo bash:


    ```

    $ wget -O script.deb.sh

    https://packages.gitlab.com/install/repositories/runner/gitlab-ci-multi-runner/script.deb.sh

    $ sudo bash script.deb.sh

    ```


    The script will add GitLab''s GPG key to the apt keyring, add the repository,
    and run apt-get update. When it is complete, the runner can be installed:


    ```

    $ apt-get install gitlab-ci-multi-runner

    ```


    The runner does not have to be on the GitLab server. If load is an issue, runners
    can be installed on multiple servers or on cloud providers. It is also possible
    to have GitLab automatically scale up the number runners on any provider supported
    by Docker Machine. For details, refer to https://docs.gitlab.com/runner/install/autoscaling.html.


    # # Registering a runner


    Once the runner is installed, it must be registered with GitLab. There are two
    ways to do it. The first is to register it for a single project. In that case,
    the runner will only run for the builds of the specific project. The other option
    is to register it globally. This will make the runner available for every project
    in GitLab. There are pros and cons to both approaches, but they are not mutually
    exclusive. It is possible to configure one or more global runners for general
    use and others specifically for a project.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'A registration token is needed before the runner can be registered with GitLab.
    For project specific runners, go to the Runners settings page of the project.
    The Specific Runners section will show the URL and token to use when registering
    a runner:


    ![](img/02bead9c8ff4515f78dac0eb33163961_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'For shared runners, the registration token is in the **Runners** page in the
    **Admin Area** (the wrench icon) when logged in as an administrator. The URL is
    the same as for the project specific runner:


    ![](img/02bead9c8ff4515f78dac0eb33163961_229_0.png)


    There are multiple ways of creating a runner that can be used to build Docker
    images. The simplest is to use the shell executor. It is designed to run any shell
    commands to build the project. It works well for almost any sort of project including
    Docker. The `gitlab-runner` user must be in the `docker` group or otherwise have
    rights to run `docker`.


    The following command is used to register the runner. Replace `$GITLAB_URL` with
    the CI URL for the GitLab install listed on the project''s **Runners** page. If
    you are using `GitLab.com`, the URL would be `https://gitlab.com/ci`. The `$REGISTRATION_TOKEN`
    token is the token from either the project specific or global **Runner** pages:


    ```

    $ sudo gitlab-ci-multi-runner register -n \

    --url $GITLAB_URL \

    --registration-token $REGISTRATION_TOKEN \

    --executor shell \

    --description "Shell Runner"

    ```'
  merge: -1
  img_proc: true
- pgno: 230
  md: "The other option is to run the docker-in-docker executor. This executor builds\
    \ the project in a Docker container which contains Docker and Docker Compose:\n\
    \n```\n$ sudo gitlab-ci-multi-runner register -n \\\n  --url $GITLAB_URL \\\n\
    \  --registration-token $REGISTRATION_TOKEN \\\n  --executor docker \\\n  --description\
    \ \"Docker Runner\" \\\n  --docker-image \"docker:latest\" \\\n  --docker-privileged\n\
    ```\n\nThe runner container must run in privileged mode in order to run the build\
    \ containers.\n\n# # Enabling a Docker Repository\n\nThe next thing to set up\
    \ before beginning the build process is to enable a Docker Registry. GitLab provides\
    \ a registry service that can be enabled on a per project basis. Instructions\
    \ for setting it up are in Chapter 3, Cluster Building Blocks – Registry, Overlay\
    \ Networks, and Shared Storage. If it is already set up or you are using GitLab.com,\
    \ go to Edit Project and ensure that the box next to Container Registry is checked.\n\
    \nThe GitLab registry is a great choice because of the integration with GitLab\
    \ and the CI process. Other registries can be used, if desired. If another registry\
    \ is used, set up an account for the runner that has rights to push new images\
    \ into the registry.\n\n# # Adding the project to the repository\n\nFinally, the\
    \ project needs to be added to the Git repository in GitLab. This is done with\
    \ standard git commands. Following is the basic script. If the Docker configuration\
    \ is already in Git, only the last two commands are needed. Be sure to change\
    \ the URL of the remote to match your repository:\n\n```\n$ git init\n$ git add\
    \ .\n$ git commit -m 'initial commit'\n$ git remote add origin http://gitlab.example.com/project/repo\n\
    $ git push -u origin master\n```\n\nThe following examples will use a very simple\
    \ Docker image. It is an Nginx web server with a single page website. Following\
    \ is the Dockerfile:\n\n```\nFROM nginx:1.10\nCOPY index.html /usr/share/nginx/html/\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 231
  md: "Full examples of the CI process described in this section are available on\
    \ GitLab. Each branch is a complete example for each step. Download the examples\
    \ from https://gitlab.com/perlstalker/ci-demo.\n\n# Creating .gitlab-ci.yml\n\n\
    CI is configured through a file named .gitlab-ci.yml in the root of the repository.\
    \ This YAML file defines the build stages, variables, and jobs needed to build,\
    \ test, and deploy the image. Any number of jobs can be defined and jobs can be\
    \ run in parallel. For full details on the options available in .gitlab-ci.yml,\
    \ refer to https://docs.gitlab.com/ce/ci/yaml/README.html.\n\nThe following .gitlab-ci.yml\
    \ example is a simple configuration that can build the image and push it into\
    \ the registry. This example uses the docker-in-docker executor. The first three\
    \ lines can be omitted when using the shell executor with a local runner:\n\n\
    ```\nimage: docker:latest\nservices:\n  - docker:dind\n\nstages:\n  - build\n\
    \  - test\n  - release\n  - deploy\n\nvariables:\n  DOCKER_CI_IMAGE: registry.gitlab.com/perlstalker/ci-demo:$CI_BUILD_REF_NAME\n\
    \nbefore_script:\n  - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN registry.gitlab.com\n\
    \nbuild-image:\n  stage: build\n  tags:\n    - docker\n  script:\n    - docker\
    \ build --pull -t $DOCKER_CI_IMAGE .\n    - docker push $DOCKER_CI_IMAGE\n```"
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The `stages` option defines the list of stages that jobs can be configured
    to run in. Any number of stages can be defined to fit the needs of the project.
    The four listed here, `build`, `test`, `release`, and `deploy`, are typical. Each
    stage is run in the order it is listed. Jobs for the `build` stage are run first,
    then `test`, and so on. If there are multiple jobs in each stage, they are run
    in parallel.


    The `variables` option allows one to define variables for use in the rest of the
    build process. In the example, a variable named `$DOCKER_CI_IMAGE` is set to the
    name of the image that will be built. The image name includes the `$CI_BUILD_REF_NAME`
    variable, which is a built-in variable that is set to the branch or tag name.
    The value of `$DOCKER_CI_IMAGE` should be changed for the specific project.


    Using `$CI_BUILD_REF_NAME` can be very helpful, especially when testing a new
    image or preparing a new release. During testing, creating a new branch means
    that the generated image will be tagged with the branch name. For example, if
    a branch named `foo` is created, the new image will be `image:foo`.


    GitLab provides a number of useful variables that can be used in the CI configuration.
    A full list is available at https://docs.gitlab.com/ce/ci/variables/README.html.


    Git tags will also generate an image with that tag. For example, if the `1.1`
    tag is added to a commit, a new image named `image:1.1` is created. This makes
    it easy to create versioned images for deployment. Remember that using `image:version`
    instead of `image:latest` makes it easier to track exactly what is running on
    the cluster and makes it easy to roll back to the previous image version in the
    event of a failure.


    The `before_script` option contains a list of commands to run to prepare the environment
    before each job. In this example, it logs into the GitLab Docker registry using
    a special CI account and build token. The build token temporarily gives the builder
    the rights of the user who triggered the build. If a different registry is being
    used, the login credentials for that registry would be used instead.


    The last block is a job named `build-image`. The `stage` option gives the stage
    at which this job will run. In this case, the `build-image` job runs in the `build`
    stage. If multiple jobs are defined in the same stage, they are run in parallel.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Jobs can define a list of `tags` which are used to define which runner is used.
    In the preceding example, the image will be built by a runner with the `docker`
    tag. If multiple tags are set, the runner must match all of them to be used. This
    makes it possible to create runners that can build certain types of projects and
    not others.


    Finally, the `script` option is a list of commands to run to build the project.
    Each command must succeed before the next command is run. If any of them fail,
    the build stops and it is marked as having failed. The commands can be regular
    system commands as in the example or scripts from the repository.


    In this example, the runner first builds the image. The `--pull` flag is used
    with `docker build` to ensure that the latest copy of the base image is used to
    build the new image. If the build succeeds, the new image is pushed back into
    the repository. A list of available images is available in the **Registry** section
    on the project page:


    ![](img/02bead9c8ff4515f78dac0eb33163961_233_0.png)'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'The status of the current build, as well as previous builds, is available in
    the **Pipelines** section of the project. Click on any build to drill down and
    see the status of each build stage. Clicking on the stage will show the build
    log for the stage. Any errors generated by a failed build will appear there:


    ![](img/02bead9c8ff4515f78dac0eb33163961_234_0.png)


    # # Testing the image


    One of the reasons that CI is so popular among software developers is that it
    provides a way to automatically run a test suite against the new build to ensure
    that it works properly. The tests provide a level of security in knowing that
    whatever changes the developers made, these did not break the functionality of
    the software. This is just as valuable for Docker images that are going to be
    deployed to, potentially, hundreds or thousands of servers.


    There are several ways of implementing the tests:


    +   • The first is to include the tests in the `git` repository, but not adding
    them to the image. This keeps the image small, but requires that all of the tools
    needed for testing are installed on the runner. Some runners, such as the docker-in-docker
    executor may not include the tools needed to run the tests.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '+   • The second way is to include the tests in the Docker image. The tests
    can then be run from within the container with either `docker run` or `docker
    exec`. This leads to a larger image, but ensures that all of the tools needed
    to test the image are available. It also makes it possible to run the tests on
    a running image at anytime. This could be useful if there are problems that only
    show up when the image is running in production.


    +   • A third option is to create a separate image that contains all of the tests
    needed to validate the image. This image can be downloaded and run by GitLab during
    the test stage to test the application image. The nice thing about this approach
    is that the tests and test image can be updated independently as new test cases
    come up.


    Let''s take a look at the very simple web page that is being used in this example:


    ```

    <html>

    <head><title>Docker Orchestration</title></head>

    <body>

    <h1>Docker Orchestration is fun!</h1>

    <p>Automate all the things!</p>

    </body>

    </html>

    ```


    The boss has decided that the web page must always proclaim how much fun Docker
    orchestration is. To this end, a test is created to ensure that it remains fun.
    In this example, it is placed in a tests directory and named run-tests.sh:


    ```

    #!/bin/sh

    curl -s http://localhost | grep ''fun!</h1>'' > /dev/null

    ```


    This test is very simple. It accesses the web page and checks to see if fun! is
    the last thing in the heading. To simplify things, the test will be added to the
    image. The updated Dockerfile is listed here. It does two things. First, it adds
    curl, which is needed for the test. Second, it adds the tests to the /tests directory
    in the image:


    ```

    FROM nginx:1.11

    RUN apt-get update && apt-get install -y curl && apt-get clean

    COPY index.html /usr/share/nginx/html/

    COPY tests /tests

    ```'
  merge: -1
  img_proc: true
- pgno: 236
  md: "To run the test, a new job needs to be added to .gitlab-ci.yml. The following\
    \ snippet shows the job. Once .gitlab-ci.yml is updated in the repository, future\
    \ commits will run the tests:\n\n```\ntest-image:\n  stage: test\n  tags:\n  \
    \  - docker\n  script:\n    - docker pull $DOCKER_CI_IMAGE\n    - docker run -d\
    \ -P --name $CI_BUILD_ID $DOCKER_CI_IMAGE\n    - docker run --rm --network container:$CI_BUILD_ID\
    \ --name $CI_BUILD_ID-test\n      --entrypoint /tests/run-tests.sh $DOCKER_CI_IMAGE\n\
    \    - docker stop $CI_BUILD_ID; docker rm -f $CI_BUILD_ID\n```\n\nThe stage option\
    \ is set so that the job will run in the test stage. This job will not run if\
    \ the build stage fails. It also includes the docker tag so that GitLab will use\
    \ a runner that is also tagged with docker.\n\nThe script section lists the commands\
    \ that are run to test the image. The first two commands download the image and\
    \ run it in the background. The container name is set to $CI_BUILD_ID, which is\
    \ the unique build ID assigned to the build by GitLab. It is important to set\
    \ the name because it will be needed when the test is run.\n\nThe third entry\
    \ in the script block runs the actual test. It starts a new container that shares\
    \ the target container's network. This allows the tests to connect to the web\
    \ server on localhost. The test container runs the test script which was shown\
    \ earlier. The grep in the script will fail if the pattern is not matched and\
    \ the test will return a non-zero exit code, which GitLab interprets as a failure.\
    \ If the pattern in the script is found, the test succeeds and the process moves\
    \ on.\n\nThe last line stops the target container and removes it. The container\
    \ running the tests is removed automatically when the test is done because --rm\
    \ was used when it was started.\n\n# Cleanup jobs\n\nThe preceding test job works\
    \ great when the tests succeed, but when it fails, it can leave the test container\
    \ running. This is not an issue when using the shared runner on GitLab.com because\
    \ a new VM is started for every test and removed immediately after the build process\
    \ has been completed. However, it could be a problem when using a local runner.\
    \ In that case, a job may be needed for cleanup after the test."
  merge: -1
  img_proc: true
- pgno: 237
  md: "To start, create a new `cleanup_test` stage and a job named `cleanup_tests`\
    \ is defined to run in the `cleanup_test` stage. Normally, if a job in the `test`\
    \ stage fails, nothing after it would run. The `cleanup_tests` job gets around\
    \ that using the `when` option. By setting it to `always`, the job will run no\
    \ matter what happens in the `test` stage. The `when` option can also be set to\
    \ `on_success` or `on_failure` to run the job only when the jobs succeed or fail,\
    \ respectively. There is a fourth option, `manual`, that will be covered later\
    \ in the chapter. The following snippet shows how to create a job that cleans\
    \ up after the CI process completes:\n\n```\nstages:\n  - build\n  - test\n  -\
    \ cleanup_test\n  - release\n  - deploy\n\n...\n\ntest-image:\n  stage: test\n\
    \  tags:\n    - docker\n  script:\n    - docker pull $DOCKER_CI_IMAGE\n    - docker\
    \ run -d -P --name $CI_BUILD_ID $DOCKER_CI_IMAGE\n    - sh tests/run-tests.sh\
    \ $CI_BUILD_ID\n\ncleanup_tests:\n  stage: cleanup_test\n  script:\n    - docker\
    \ stop $CI_BUILD_ID; docker rm -f $CI_BUILD_ID\n  when: always\n```\n\n# # Releasing\
    \ the image\n\nThe `build-image` job has been creating an updated image every\
    \ time changes are pushed to the `git` repository. Let's take a closer look at\
    \ what is being created. The `docker build` command in the example is creating\
    \ an image that is named `registry.gitlab.com/perlstalker/ci-demo:$CI_BUILD_REF_NAME`.\
    \ The `$CI_BUILD_REF_NAME` variable is the name of the branch or tag. This means\
    \ that, at this point, the only image that is created is `registry.gitlab.com/perlstalker/ci-demo:master`.\
    \ There is no `:latest` image. If someone were to try and run `docker run registry.gitlab.com/perlstalker/ci-demo`,\
    \ the command would fail because the image with its implied `latest` tag does\
    \ not exist."
  merge: -1
  img_proc: true
- pgno: 238
  md: "The fact that GitLab does not automatically tag the image with the `latest`\
    \ tag is a feature. The idea is for the CI plan in `.gitlab-ci.yml` to explicitly\
    \ tag the image. This is done by creating a new job. A snippet of `.gitlab-ci.yml`\
    \ is shown here:\n\n```\n```yaml\nvariables:\n  DOCKER_CI_IMAGE: registry.gitlab.com/perlstalker/ci-demo:\n\
    ${CI_BUILD_REF_NAME}\n  DOCKER_RELEASE_IMAGE: registry.gitlab.com/perlstalker/ci-demo:latest\n\
    ...\nrelease-image:\n  stage: release\n  tags:\n  - docker\n  script:\n  - docker\
    \ pull $DOCKER_CI_IMAGE\n  - docker tag $DOCKER_CI_IMAGE $DOCKER_RELEASE_IMAGE\n\
    \  - docker push $DOCKER_RELEASE_IMAGE\n  only:\n  - master\n```\n```\n\nThe first\
    \ difference is that a new variable, `$DOCKER_RELEASE_IMAGE`, was added with the\
    \ name of the release image.\n\n![](img/02bead9c8ff4515f78dac0eb33163961_238_0.png)\n\
    \nNote that the image tag is `latest`.\n\nAs always, the work is done in the `script`\
    \ block. The first step is to pull the latest copy of the image for this branch.\
    \ Next, `docker tag` tags that image with the release image name. Specifically,\
    \ it is given the `latest` tag. Finally, the `docker push` command pushes the\
    \ newly tagged image back into the registry.\n\nThe `only` block is important.\
    \ It tells GitLab that this job must only be run when building one of the listed\
    \ branches. In this case, `master`. Without the `only` block, any newly built\
    \ image from any branch would replace the `latest` image."
  merge: -1
  img_proc: true
- pgno: 239
  md: "The nice thing about this configuration is that new images can be worked on\
    \ in different branches and images for those branches will be created. Those images\
    \ can be individually run, tested, and debugged without modifying the released\
    \ image. When the changes are ready, the development branch can be merged back\
    \ into the `master` branch and a new `latest` image is created.\n\n# # Deploying\
    \ the image\n\nLet's take a moment and see where things stand. At this point,\
    \ new Docker images for a project are being automatically built any time changes\
    \ are pushed to the Git repository in GitLab. A test suite is being run against\
    \ the new image to ensure that it will function as expected. If the changes are\
    \ pushed to the `master` branch, a new release image is created. The only thing\
    \ left to do is to deploy the image to the cluster.\n\nHow the image is deployed\
    \ will depend on the orchestration suite chosen. In most cases, all that is needed\
    \ is to run the command that performs a rolling update of the service. A snippet\
    \ of an automated deployment job is as follows:\n\n```\n```yaml\ndeploy-to-dev:\n\
    \  stage: deploy\n  tags:\n    - docker\n  environment: development\n  script:\n\
    \    - ./deploy.sh $DOCKER_CI_IMAGE development\n  only:\n    - master\n```\n\
    ```\n\nThere are a couple of things to note here. First, the `stage` is set to\
    \ `deploy`. The job will only run if the `build`, `test`, and `release` stages\
    \ are completed successfully; `environment` is optional. The **Environments**\
    \ page in the **Pipelines** section in the project makes it easy to track deployments\
    \ to different environments:"
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/02bead9c8ff4515f78dac0eb33163961_240_0.png)


    The `deploy.sh` script in the snippet is a placeholder. The script can contain
    whatever is needed to deploy the image in your environment. The script could also
    be included directly in the `script` block. Later in the chapter, it will be shown
    how to deploy an image to a Kubernetes cluster.


    > > **TIP** Consider using the `tags` keyword instead of a branch name in the
    `only` section for deployments. This will limit deployments only to commits that
    have been tagged. It will ensure that all images that are deployed use the tag.
    It will be easier to tell which version of the image a container is running based
    on the tag on the image.


    # # Deploying the image manually


    Automatically deploying an image to the cluster is exciting. Perhaps too exciting.
    Not everyone wants services to be updated automatically. This does not mean that
    GitLab cannot be used for deployments. GitLab provides a way of configuring a
    job to run manually. The build process will run as it normally does, but when
    it gets to a manual job, it will wait until someone tells GitLab that it is okay
    to proceed. This provides the consistency of an automated deployment while still
    allowing a human to decide whether the deployment happens or not.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "The following .gitlab-ci.yml snippet shows how to create a job with a manual\
    \ trigger. It is basically the same as the preceding automated deployment. The\
    \ only functional change is the when tag:\n\n```\ndeploy-to-prod:\n  stage: deploy\n\
    \  tags:\n    - docker\n  environment: production\n  script:\n    - ./deploy.sh\
    \ $DOCKER_CI_IMAGE production\n  only:\n    - master\n  when: manual\n```\n\n\
    Setting when to manual will pause the build and deployment process until someone\
    \ goes to Pipelines, clicks on the build, and clicks on the deployment. The following\
    \ screenshot shows the build pipeline:\n\n![](img/02bead9c8ff4515f78dac0eb33163961_241_0.png)"
  merge: -1
  img_proc: true
- pgno: 242
  md: "Note that all of the jobs have succeeded. Only the `deploy-to-prod` job has\
    \ not. The triangle play button shows that the `deploy-to-prod` job is awaiting\
    \ `manual` action. When that button is pushed, the deployment will begin.\n\n\
    Any number of deployment jobs may be defined to fit a variety of needs. For example,\
    \ a fully automatic job could deploy new images to a development environment.\
    \ A manual job could then trigger the deployment to a QA or canary environment.\
    \ Finally, another manual job could deploy the image fully into production. This\
    \ could be done with parallel jobs as shown here or as separate build stages.\
    \ Using separate stages ensures that each previous deployment is done before finally\
    \ being pushed into production.\n\n# # Deploying to Kubernetes\n\nThe preceding\
    \ examples used a dummy deploy script. Let's a take a look at how one might use\
    \ GitLab CI to deploy a new image to Kubernetes. In Chapter 5, Deploying and Managing\
    \ Services with Kubernetes we covered managing deployments in Kubernetes.\n\n\
    The following .gitlab-ci.yml snippet makes a couple of assumptions:\n\n+   * First,\
    \ kubectl is installed on the runner machine and that the gitlab-runner user has\
    \ permissions to make changes to the Kubernetes cluster\n+   * Second, a deployment\
    \ has already been created which will be updated by the build process:\n\n```\n\
    variables:\nDOCKER_CI_IMAGE: registry.gitlab.com/perlstalker\n/ci-demo:$CI_BUILD_REF_NAME\n\
    DOCKER_RELEASE_IMAGE: registry.gitlab.com/perlstalker\n/ci-demo:latest\nDEPLOYMENT:\
    \ ci-demo\nCONTAINER: web\n...\ndeploy-to-kube:\n  stage: deploy\n  tags:\n  \
    \  - kubectl\n  environment: production\n  script:\n    - kubectl set image deployment/$DEPLOYMENT\n\
    \      $CONTAINER=$DOCKER_CI_IMAGE\n  only:\n    - tags\n```"
  merge: -1
  img_proc: true
- pgno: 243
  md: "```\nwhen: manual\n```\n\nTwo new variables, DEPLOYMENT and CONTAINER are added\
    \ to the configuration. They contain the name of the deployment and the container\
    \ within that deployment that will be updated, respectively.\n\nAs an example,\
    \ the kubectl tag is set on the job. The expectation is that a runner with the\
    \ kubectl tag is available, which has kubectl configured to manage the cluster.\
    \ This makes it easy to create a runner that is only used for deployments and\
    \ is not used for other build jobs.\n\nThe script contains only the command to\
    \ update an image in the deployment. It is not necessary to do anything with the\
    \ image in the runner. The Kubernetes nodes that are running the deployment will\
    \ perform the update on the container based on the deployment strategy of the\
    \ pod.\n\nFinally, the only block tells GitLab to only run this job if the build\
    \ has a git tag set. This will ensure that the built image has a different tag\
    \ than what was running previously. If the image name is the same as what the\
    \ deployment currently uses, Kubernetes will not know that the image needs to\
    \ be updated.\n\n# # Building DAB files\n\nDocker Swarm is moving to Distributed\
    \ Application Bundles (DAB) to define stacks for deployment. GitLab CI can be\
    \ used to automatically build DAB files for a project. The following snippet assumes\
    \ that docker-compose.yml is in the root directory of the project:\n\n```\nbuild-dab:\n\
    \  stage: release\n  tags:\n    - docker\n  script:\n    - docker-compose bundle\n\
    \  artifacts:\n    paths:\n      - *.dab\n    name: \"${PROJECT_NAME}-${CI_BUILD_REF_NAME}\"\
    \n```\n\nThe script block runs docker-compose bundle which will generate the .dab\
    \ file. Additional options can be added to the command, if needed. The artifacts\
    \ block tells GitLab that the build process generates files that are important.\
    \ In this example, the .dab files will be saved if the build is successful. All\
    \ of the files matching the entries in the path list will be added to the artifacts\
    \ archive file."
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Finally, the name option provides the name of the artifact archive. In this
    example, it is the name of the archive and the build reference name separated
    by a hyphen. For example, if the project is named ci-demo and the master branch
    is being built, the name would be ci-demo-master. The artifact archive file would
    be named ci-demo-master.zip.


    # Using Docker Cloud for CI


    Docker Hub and Docker Cloud can automatically update images when a linked Git
    repository is updated. This can be used for lightweight CI, if GitLab is too involved
    a tool for the job. In either case, custom tools could be written to run the newly
    generated images against a test suite or they could be run and tested by hand.


    Docker Cloud, in particular, can be useful for testing images. It can auto build
    an image every time the project is updated in GitHub or Bitbucket. Once the image
    is built, it can be started as a service in a test cluster from the web interface.


    To start, click on the Repositories link and click on Create to create a new repository.
    Link the new repository to GitLab or Bitbucket by clicking on the appropriate
    icon at the bottom of the creation page. When everything is ready, click on Create:


    ![](img/02bead9c8ff4515f78dac0eb33163961_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# # Enabling autobuilds


