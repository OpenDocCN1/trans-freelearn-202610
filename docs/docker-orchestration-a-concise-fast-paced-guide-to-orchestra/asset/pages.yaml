- pgno: 149
  md: '# # Installing the DC/OS client


    Once DC/OS is installed, log into the website. At the bottom-left corner, the
    popup menu has a link labeled **Install CLI**. The window that opens after clicking
    this link has instructions for client installation on Windows, OS X, and Linux:


    ![](img/02bead9c8ff4515f78dac0eb33163961_149_0.png)


    The client can also be installed manually. On Linux, the commands for installation
    looks like this:


    ```

    $ wget -0 dcos

    https://downloads.dcos.io/binaries/cli/linux/x86-64/dcos-1.8/dcos

    $ chmod +x dcos

    $ sudo cp dcos /usr/local/bin/

    $ dcos config set core.dcos_url https://m1.dcos

    ```


    Change the version number in the URL to match your master server version. In this
    example, it is 1.8. The last command configures the location of the DC/OS master.
    Change the URL passed to `dcos config` to the appropriate address for your environment.
    If you do not have a valid SSL certificate, `dcos` can be configured to ignore
    the verification:


    ```

    $ dcos config set core.ssl_verify false

    ```'
  merge: -1
  img_proc: true
- pgno: 150
  md: "Once dcos is installed, it is time to log in:\n\n```\n$ dcos auth login\n```\n\
    \nNow go to the following link in your browser:\n\n```\nhttps://m1.dcos/login?redirect_uri=urn:ietf:wg:oauth:2.0:oob\n\
    ```\n\nEnter the authentication token:\n\nGo to the indicated URL. DC/OS will\
    \ attempt to authenticate you with OAuth 2 via https://auth0.com/. Copy the token\
    \ and paste it into the shell. You should now be logged in and ready to use the\
    \ command line.\n\n# Managing applications\n\nA Mesos cluster is managed with\
    \ the dcos tool and the web interface. Applications in Mesos are handled by the\
    \ Marathon scheduler and are defined in JSON format.\n\n# Running a simple application\n\
    \nLet's start with a simple container that runs Nginx. Create a file named nginx.json\
    \ that contains the following definition:\n\n```\n{\n    \"id\" : \"simple-nginx\"\
    ,\n    \"instances\" : 1,\n    \"cpus\" : 0.25,\n    \"mem\" : 64.0,\n    \"container\"\
    \ : {\n        \"type\" : \"DOCKER\",\n        \"docker\" : {\n            \"\
    image\" : \"nginx:1.11\",\n            \"network\" : \"HOST\"\n        }\n   \
    \ }\n}\n```\n\nThe id tag is the name of the service. It is displayed in the service\
    \ list. The instances tag tells Marathon that only one instance is needed. It\
    \ can be increased or decreased as needed later."
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The `cpus` and `mem` tags are hints to Marathon as to what percentage of CPU
    and the amount of RAM is needed. They do not actually set resource limits in Docker.
    However, Marathon may kill tasks that use more than the allocated resources. In
    this case, the application is requesting 25 percent of a CPU and 64 MB of RAM.
    These settings cannot be changed after an application is created without redeploying
    the application.


    The `container` tag is where the Docker container is defined. Because this is
    a Docker container, the `type` tag is set to `DOCKER`. The image is set in the
    `image` tag. This is the same image name that will be passed to `docker run`.


    Finally, the `network` tag is set to `HOST`, which tells the Docker Engine to
    use host networking. Later in the chapter, other networking types will be used,
    but this will suffice for now.


    Start the service with `dcos marathon app add nginx.json`. If everything goes
    well, the command will produce no output. Otherwise, an error is displayed. Use
    `dcos marathon app list` to verify that the application is running:


    ```

    $ dcos marathon app list

    ID                MEM   CPUS   TASKS   HEALTH  DEPLOYMENT  CONTAINER  CMD

    /simple-nginx     64    0.25   1/1     ---     ---         DOCKER     None

    ```


    Nginx is running, but how do you get to it? Because host networking was used,
    you can point your web browser to the external IP address of the node the container
    is running on. The host address is available in the service details in the web
    interface or by running `dcos marathon app show simple-nginx`.


    # # Stopping an application


    A service may be stopped without removing it from Marathon with the `dcos marathon
    app stop` command. Marathon will create a deployment to scale the service to zero
    tasks. The web interface refers to this as **suspending** an application:


    ```

    $ dcos marathon app stop simple-nginx

    Created deployment e5be6896-f593-4a32-852f-30bd98551a0e

    $ dcos marathon app list

    ID                MEM   CPUS   TASKS   HEALTH  DEPLOYMENT  CONTAINER  CMD

    /simple-nginx     64    0.25   0/0     ---     ---         DOCKER     None

    ```'
  merge: -1
  img_proc: true
- pgno: 152
  md: "# # Removing an application\n\nWhen the service is no longer needed, it can\
    \ be removed with `dcos marathon app remove`. An application does not have to\
    \ be stopped to be removed. Marathon will stop the running containers and remove\
    \ the application from the list:\n\n```\n$ dcos marathon app remove simple-nginx\n\
    ```\n\n# # Forcing Marathon to pull images\n\nOne of the biggest problems with\
    \ running containers across a cluster is ensuring that the image being run is\
    \ up to date. Remember, Docker caches images are downloaded from the registry.\
    \ If a container is started with the `nginx` image and a new version is released\
    \ that fixes a security hole, containers on that host will continue to run the\
    \ vulnerable version.\n\nMarathon provides the `forcePullImage` option to force\
    \ the node to pull a new image every time the application is started. It goes\
    \ in the `docker` section of a container specification. The following example\
    \ shows how it works:\n\n```\n\"docker\" : {\n    \"image\" : \"nginx:latest\"\
    ,\n    \"forcePullImage\" : true\n}\n```\n\nEnsure that your registry can handle\
    \ the load. If a lot of applications that pull an image are started, there is\
    \ the possibility that they will overwhelm the registry.\n\n# # Using environment\
    \ variables\n\nSome Docker images require the use of environment variables to\
    \ run. The official MySQL image, for example, uses them to set the initial root\
    \ password. Marathon uses the `env` tag to pass environment variables to the task.\
    \ In this case, the environment variables `MYSQL_ROOT_PASSWORD` and `MYSQL_DATABASE`\
    \ are being set:\n\n```\n{\n    \"id\": \"/mysql\",\n    \"instances\": 1,\n \
    \   \"cpus\": 1,\n    \"mem\": 1024,\n    \"env\": {\n        \"MYSQL_ROOT_PASSWORD\"\
    : \"password\",\n        \"MYSQL_DATABASE\": \"mydb\"\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 153
  md: '```

    },

    "container": {

    "docker": {

    "image": "mysql:5.7",

    "forcePullImage": true,

    "network": "HOST"

    }

    }

    }

    ```


    # Scaling applications


    Marathon makes it very easy to scale up or down the number of tasks for an application.
    Not only does this allow one to scale out to meet increased load, it also allows
    for blue-green deployments, which will be covered a little later in the chapter.


    Assume that there is an application named nginx running with one instance. All
    that needs to be done to increase that to two instances is to run dcos marathon
    app update:


    ```

    $ dcos marathon app update nginx instances=2

    Created deployment 8dbf3d16-44d3-4478-9366-9743658dcfcd

    ```


    This example sets the number of instances to two. Applications can similarly be
    scaled up or down. Marathon will attempt to start or stop as many instances as
    needed to meet the new requirement.


    Make sure that your application can support running multiple instances. Databases,
    in particular, do not react well to other processes changing their files.


    # Checking application health


    Marathon, very similar to Kubernetes, supports the option of setting one or more
    health checks on a service to ensure it is running properly before making it available
    to handle requests. There are options to run a custom check command, check for
    TCP connectivity, or check the HTTP status for a specific path.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "# Using TCP and HTTP checks\n\nThis is an example of a TCP check for MySQL.\
    \ The `protocol` option says that this is a TCP check. The `portNumber` defines\
    \ the port to connect to. Instead, it can be replaced with `portIndex` which will\
    \ check the index into the `ports` or `portDefinition` lists in the application\
    \ definition. The index is zero based so the first entry is 0, the second is 1,\
    \ and so on:\n\n```\n\"healthChecks\": [\n{\n\"protocol\": \"TCP\",\n\"portNumber\"\
    : 3306,\n\"gracePeriodSeconds\": 300,\n\"intervalSeconds\": 60,\n\"timeoutSeconds\"\
    : 20,\n\"maxConsecutiveFailures\": 3\n}\n]\n```\n\nThere are a number of settings\
    \ that are usable for every check type. They are as follows:\n\n+   • `gracePeriodSeconds`:\
    \ This is the number of seconds to wait before throwing errors. It allows containers,\
    \ such as MySQL, that take time to start to finish initializing before throwing\
    \ errors. If the check passes before the grace period ends, the application is\
    \ immediately marked as healthy.\n+   \n+   • `intervalSeconds`: This is the number\
    \ of seconds to wait between checks.\n+   \n+   • `timeoutSeconds`: The check\
    \ fails if it does not respond in these many seconds.\n+   \n+   • `maxConsecutiveFailures`:\
    \ If a health check fails these many times in a row without a success, the task\
    \ is killed and restarted.\n+   \n+   • `taskKillGracePeriodSeconds`: When a task\
    \ has failed too many checks, Marathon will send a `SIGTERM` signal. If the task\
    \ has not stopped by the time these many seconds have elapsed, Marathon will send\
    \ the `SIGKILL` task. This defaults to three seconds.\n\nThe HTTP and HTTPS protocols\
    \ check the HTTP status code for a given path. The `path` option may be set, which\
    \ defines the path to test. It defaults to /. The HTTP and HTTPS checks also use\
    \ the `portNumber` and `portIndex` options described earlier. The HTTPS protocol\
    \ is used to check SSL enabled websites. It does not check the validity of the\
    \ SSL certificate.\n\nBy default, only status codes in the 200-399 range are considered\
    \ healthy. You can configure the check to ignore status codes from 100-199 by\
    \ setting `ignoreHttp1xx` to `true`. Every other status code is considered a failure."
  merge: -1
  img_proc: true
- pgno: 155
  md: "# Using command checks\n\nIt is also possible to check the health status using\
    \ a custom command. The check is considered successful if it exits with a true\
    \ value, usually 0 in sh. Anything else is considered a failure. The following\
    \ example adds a command check to an application:\n\n```\n{\n  \"id\" : \"nginx-health\"\
    ,\n  \"instances\" : 1,\n  \"cpus\" : 0.25,\n  \"mem\" : 64.0,\n  \"labels\" :\
    \ {\n    \"HAPROXY_GROUP\" : \"external\"\n  },\n  \"container\" : {\n    \"type\"\
    \ : \"DOCKER\",\n    \"docker\" : {\n      \"image\" : \"nginx\",\n      \"network\"\
    \ : \"BRIDGE\",\n      \"portMappings\" : [\n        {\n          \"hostPort\"\
    \ : 0,\n          \"containerPort\" : 80,\n          \"servicePort\" : 80,\n \
    \         \"name\" : \"web\"\n        }\n      ]\n    }\n  },\n  \"upgradeStrategy\"\
    \ : {\n    \"minimumHealthCapacity\" : 1,\n    \"maximumOverCapacity\" : 1\n \
    \ },\n  \"healthChecks\" : [\n    {\n      \"protocol\" : \"COMMAND\",\n     \
    \ \"command\" : {\n        \"value\" : \"your_check_health_command.sh\"\n    \
    \  }\n    }\n  ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: "The command is passed to /bin/sh -c \"\". Any double quotes in the command\
    \ must be escaped. To complicate matters, the escape character (\\) must also\
    \ be escaped. A command that includes a double quoted component looks something\
    \ like this:\n\n```\n\"healthChecks\" : [\n  {\n    \"protocol\" : \"COMMAND\"\
    ,\n    \"command\" : {\n      \"value\" : \"your_check_health_command.sh \"Foo\"\
    \"\n    }\n  }\n]\n```\n\n# Deploying rolling updates\n\nExisting applications\
