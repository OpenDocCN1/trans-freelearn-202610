- pgno: 71
  md: '# Connecting containers with overlay networks


    When Docker containers are started, they are assigned a private IP address. This
    avoids conflicts with addresses that may already be in use on the network and
    allows containers on the same host to talk to each other. It is a nice system
    except that containers running on different hosts cannot talk to each other unless
    they are exposed on the hosts. To solve this problem, various projects, including
    Docker, developed overlay networks.


    An overlay network is a private network that is layered on top of an existing
    IP network to allow containers on multiple hosts to talk to each other. Containers
    connected to an overlay network are still assigned private addresses and are not
    accessible from outside the network. Ports can be made public using the `-p` option
    to `docker run` as normal.


    Docker''s pluggable network infrastructure has led to a growth in the number of
    overlay plugins. It also allows for containers to use multiple overlays networks.
    Using multiple networks provides for network isolation and segmentation and minimizes
    the risk of a compromised container sniffing network traffic that it is not supposed
    to see.


    # Using Docker native overlays


    Docker''s native overlay networking is a relative newcomer to the space. It provides
    **DNS Service Discovery (DNS-SD)** and the ability to use multiple overlays. When
    combined with Docker Swarm, it provides cross cluster connectivity. The advantage
    to being later to the ecosystem is that you can learn from other entries in the
    space. Docker has certainly done that.


    The features described in this section rely heavily on Docker Swarm which will
    be covered in detail in Chapter 4, Orchestration with Docker Swarm. For now, a
    single node swarm can be created by running `docker swarm init`:


    ```

    $ docker swarm init

    ```


    > Docker 1.12 or higher is needed to use Docker Swarm.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Let us start by creating a network that our containers will use. Docker Swarm
    ensures that this network is available to all hosts connected to the swarm node:


    ```

    $ docker network create --driver overlay external

    ```


    The --driver option tells Docker that this network uses the swarm native overlay
    driver. At the end is the name of the overlay network. In this case, external.
    This is the name that will be used in service definitions to configure the network
    that will be used.


    The --opt encrypted option is optional. If specified, it tells Docker to encrypt
    the connections between the containers on different nodes. To do this, Docker
    Swarm will automatically build IPSEC tunnels between any nodes that have containers
    connected to that network. The encryption key is automatically updated every twelve
    hours.


    Using an encrypted overlay network is especially helpful if you have a network
    that spans providers or as a way to simplify inter-container security. For example,
    MySQL supports using TLS to connect. However, few containers have TLS enabled
    for MySQL. Using an encrypted overlay gives you the encryption that you might
    want when talking to the database without having to worry about certificate distribution
    or if TLS is supported at all.


    # Working with DNS-SD


    One of the problems with containers is that every time they start, they get a
    new IP address. That makes it really hard to configure containers that connect
    to each other. This gets even harder when the containers are running on different
    hosts. Fortunately, Docker overlay networks have built-in service discovery using
    DNS. DNS entries are created as part of the swarm services which are described
    in Chapter 4, Orchestration with Docker Swarm.


    Consider the following command:


    ```

    $ docker service create --network external --name nginx --replicas 2 -p 80:80
    nginx 8m2vwm3n9w990kh77vf556k7i

    ```


    This command uses Docker Swarm to create a service named nginx with two replicas.
    When the service starts, Docker creates a DNS record for nginx that resolves to
    the two containers that were started. Any other container on the network will
    be able to use the name nginx to connect to the service. Let us create a busybox
    container to test with:


    ```

    $ docker service create --name shell --network external busybox sleep 6000 191qi81lvvpnah3eqq8cvaxft4n

    ```


    ```

    $ docker service ps nginx ID NAME IMAGE NODE DESIRED STATE CURRENT STATE ERROR

    ```'
  merge: -1
  img_proc: true
