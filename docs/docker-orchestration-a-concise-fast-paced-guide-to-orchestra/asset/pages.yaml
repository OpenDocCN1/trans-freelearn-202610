- pgno: 79
  md: 'This example shows how to use Flannel on CoreOS. It assumes that your CoreOS
    hosts have two network interfaces; one on a public network and one on a private
    network. The $private_ipv4 variable is replaced with the private IP address assigned
    by the cloud provider. This is supported by Amazon EC2, GCE, Microsoft Azure,
    and OpenStack.


    Flannel stores its configuration in JSON format in etcd in the /coreos.com/network/config
    path. Before Flannel starts, the configuration must be written to etcd. Since
    CoreOS uses systemd to manage services, it is possible to create a drop-in file
    that adds the configuration to etcd before Flannel is started.


    The preceding example has the bare minimum needed for Flannel. All it does is
    set the network that will be used to assign IP addresses to each container. You
    should change this to something that does not conflict with anything in your environment.
    Docker will need to be restarted, if it is already running. A full list of options
    is available in the Flannel documentation at https://github.com/coreos/flannel.


    # Starting a CoreOS cluster with Flannel


    The following command starts three CoreOS alpha servers on GCE. The --can-ip-forward
    flag is required for Flannel to properly forward traffic for running containers.
    The cloud-config file for the hosts is set with the --metadata-from-file option:


    ```

    $ gcloud compute instances create core1 core2 core3 --image-project coreos-cloud
    --image-family coreos-alpha \

    --zone us-central1-a --machine-type g1-small --can-ip-forward --scopes compute-rw
    --metadata-from-file \

    user-data=coreos-user-data.yml

    ```


    Ensure sshd started:


    ```

    $ gcloud compute instances get-serial-port-output core1 | grep

    Starting.*sshd

    Starting Generate sshd host keys...

    ```


    Once the hosts have been started, log into one of them to verify that etcd is
    healthy. Since Flannel depends on etcd, if that does not work, neither will Flannel:


