    service ps` command will show that the tasks for the service are all in the `Shutdown`
    state. If needed, one can inspect the containers on the nodes:


    ```

    $ docker service ps web

    ID                         NAME      IMAGE       NODE      DESIRED STATE       CURRENT
    STATE               ERROR

    68v6trav6cf2qgj8pg8wgcbmhu web.1     nginx       worker1   Shutdown            Shutdown
    3 seconds ago

    060wax426mtqdx79g0ulwu25r  web.2     nginx       manager   Shutdown            Shutdown
    2 seconds ago

    79uidx4t5rz4o7an9wtya1456  web.3     nginx       worker2   Shutdown            Shutdown
    3 seconds ago

    ```


    When it is time to bring the service back, use `docker swarm update` to set the
    number of replicas back to what is needed. Swarm will start the containers across
    in the swarm just as if you had used `docker swarm create`.


    # Upgrading a service with rolling updates


    It is likely that services running in a swarm will need to be upgraded. Traditionally,
    upgrades involved stopping a service, performing the upgrade, then restarting
    the service. If everything goes well, the service starts and works as expected
    and the downtime is minimized. If not, there can be an extended outage as the
    administrator and developers debug what went wrong and restore the service.


    Docker makes it easy to test new images before they are deployed and one can be
    confident that the service will work in production just as it did during testing.
    The question is, how does one deploy the upgraded service without a noticeable
    downtime for the users? For busy services, even a few seconds of downtime can
    be problematic. Docker Swarm provides a way to update services in the background
    with zero downtime.


    There are three options which are passed to `docker service create` that control
    how rolling updates are applied. These options can also be changed after a service
    has been created with `docker service update`. The options are as follows:


    +   • `--update-delay`: This option sets the delay between each container upgrade.

    +   The delay is defined by a number of hours, minutes, and seconds indicated
    by a

    +   number followed by `h`, `m`, or `s`, respectively. For example, a 30 second
    delay will

    +   be written as `30s`. A delay of 1 hour, 30 minutes, and 12 seconds will be
    written

    +   as `1h30m12s`.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   • --update-failure-action: This tells swarm how to handle an upgrade failure.
    By default, Docker Swarm will pause the upgrade if a container fails to upgrade.
    You can configure swarm to continue even if a task fails to upgrade. The allowed
    values are pause and continue.


    +   • --update-parallelism: This tells swarm how many tasks to upgrade at one
    time. By default, Docker Swarm will only upgrade one task at a time. If this is
    set to 0 (zero), all running containers will be upgraded at once.


    For this example, a service named web is started with six replicas using the nginx:1.10
    image. The service is configured to update two tasks at a time and wait 30 seconds
    between updates. The list of tasks from docker service ps shows that all six tasks
    are running and that they are all running the nginx:1.10 image:


    ```

    $ docker service create --name web --update-delay 30s --update-parallelism 2 --replicas
    6 nginx:1.10

    ```


    ```

    $ docker service ps web


    ID                                         NAME   IMAGE         NODE      DESIRED
    STATE

    CURRENT STATE               ERROR

    83p4vi4ryw9x6kbevmplgjrp4  web.1  nginx:1.10   worker2  Running

    Running 20 seconds ago


    2ybltchas244tmnrpfyzik5jw  web.2  nginx:1.10   worker1  Running

    Running 20 seconds ago


    f4g3nayyx5yk6x5k8xn31x8klk  web.3  nginx:1.10   worker2  Running

    Running 20 seconds ago


    6axpogx5rqlg96bqt9qn822rx  web.4  nginx:1.10   worker1  Running

    Running 20 seconds ago


    2d7n5nhja0efka7qy2boke8l3  web.5  nginx:1.10   manager  Running

    Running 16 seconds ago


    5sprz723zv3z779o3zcyj28p1  web.6  nginx:1.10   manager  Running

    Running 16 seconds ago

    ```


    Updates have started using the docker service update command and specifying a
    new image. In this case, the service will be upgraded from nginx:1.10 to nginx:1.11.
    Rolling updates work by stopping a number of tasks defined by --update-parallelism
    and starting new tasks based on the new image. Swarm will then wait until the
    delay set by --update-delay elapses before upgrading the next tasks:


    ```

    $ docker service update --image nginx:1.11 web

    ```'
