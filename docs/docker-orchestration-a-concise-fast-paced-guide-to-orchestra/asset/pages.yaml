    # Stopping a service


    A running service is stopped with `fleetctl stop`. It takes the name of the service
    as the only argument:


    ```

    $ fleetctl stop nginx.service

    Unit nginx.service loaded on 86bceaea.../172.17.8.103

    ```


    The `stop` command stops the running container, but it leaves it scheduled on
    a node in the cluster. When the service is restarted, it will start on the same
    node that it was running on before.


    To unschedule a service, use the `fleetctl unload` command. This will remove the
    service from the list of active units. It will remain in the Fleet registry and
    can be started again with `fleetctl start`:


    ```

    $ fleetctl unload nginx.service

    Unit nginx.service inactive

    ```


    A service can be permanently removed from the cluster with the command `fleetctl
    destroy`:


    ```

    $ fleetctl destroy nginx.service

    Destroyed nginx.service

    ```


    The `destroy` command is also used when changing a unit. The service must be removed
    with `fleetctl destroy` then it can be recreated with the required changes.


    # Using environment variables


    Many Docker images use environment variables to configure them and control how
    they run. Fleet can define those variables in the unit file for the service, using
    the `Environment` option:'
  merge: -1
  img_proc: true
- pgno: 180
  md: '```

    [Unit]

    Description=MySQL

    After=docker.service

    Requires=docker.service


    [Service]

    Environment=MYSQL_ROOT_PASSWORD=password

    Environment=MYSQL_DATABASE=myapp

    TimeoutStartSec=infinity

    ExecStartPre=-/usr/bin/docker kill mysql

    ExecStartPre=-/usr/bin/docker rm mysql

    ExecStartPre=-/usr/bin/docker pull mysql

    ExecStart=/usr/bin/docker run --name mysql -e MYSQL_ROOT_PASSWORD -e MYSQL_DATABASE
    -p 3306:3306 mysql

    ExecStop=/usr/bin/docker stop mysql

    ```


    This example starts a MySQL image and defines the MySQL root password and an initial
    database. The values of the variables do not need to be defined in the `docker
    run` command. Docker will use the values set in the `Environment` lines.


    Rather than specifying all of the environment variables in the unit as was done
    earlier, they can all be placed into an `EnvironmentFile`. Variables and their
    values are defined, one per line:


    ```

    MYSQL_ROOT_PASSWORD=password

    MYSQL_DATABASE=myapp

    ```


    The file is then specified in the `EnvironmentFile` option in the `[Service]`
    section of the unit:


    ```

    ...

    [Service]

    EnvironmentFile=/etc/mysql.env

    ...

    ```


    The file must exist on every node in the cluster where the service may run. If
    it does not exist, the service will be unable to start.


    # # Scheduling services with affinity


    It is often desirable to ensure that a service runs on the same host as another
    service. Contrarily, it may be better to force services to run on separate hosts.
    This process, known as affinity, is configured in a special `[X-Fleet]` section
    of the unit file.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# # Setting positive affinity


    There are two options that control affinity between containers. The first, `MachineOf`,
    is the name of a unit file in Fleet. Fleet will attempt to place the unit with
    the `MachineOf` option on the same node that is running the named service.


    For example, let''s assume that the MySQL service described in the previous section
    is running somewhere in the Fleet cluster. For performance reasons, it is desirable
    to run a certain web application that uses the database on the same node. In this
    example, `nginx` will be the web application:


    ```

    [Unit]

    Description=Nginx Affinity

    After=docker.service

    Requires=docker.service

    Requires=mysql.service


    [Service]

    TimeoutStartSec=infinity

    ExecStartPre=-/usr/bin/docker kill nginx

    ExecStartPre=-/usr/bin/docker rm nginx

    ExecStartPre=-/usr/bin/docker pull nginx

    ExecStart=/usr/bin/docker run --name nginx -p 80:80 nginx

    ExecStop=/usr/bin/docker stop nginx


    [X-Fleet]

    MachineOf=mysql.service

    ```


    This is the same basic `nginx` service defined earlier in the chapter. There are
    two things to note here. First, a `Requires` option was added to ensure that `mysql.service`
    is running. If it is not running and is defined, Fleet will start it. Next is
    the `[X-Fleet]` section and the `MachineOf` option which ensures that Fleet will
    try to run `nginx.service` on the same host as `mysql.service`.


    It is important to keep in mind that affinity definitions should always be one
    way. If they are not, a race condition develops. In this example, if `mysql.service`
    also had `MachineOf=nginx.service`, Fleet would be unable to start either service.
    It would not be possible to determine where to start the first service because
    the other one has not been started yet.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Using negative affinity


    Sometimes it is important that two services never run on the same node. Generally,
    this is for redundancy and high availability reasons. Fleet provides the `Conflicts`
    option for those occasions. The `Conflicts` option can match an exact unit name
    or a group of services using glob-matching.


    With glob-matching, an asterisk (*) is used to match zero or more characters.
    For example, to match any service that starts with `nginx`, the pattern would
    be `nginx*`. The following snippet shows a unit that is configured not to start
    on any node that is running a service that starts with `nginx`:


    ```

    ```

    [Unit]

    Description=Nginx Affinity

    After=docker.service

    Requires=docker.service

    ...

    [X-Fleet]

    Conflicts=nginx*

    ```

    ```


    # High availability


    As mentioned earlier, negative affinity is often used for high availability. Fleet
    uses systemd template units, which make it easy to start multiple, identical services.
    To start, create a file named `nginxha@.service`:


    ```

    ```

    [Unit]

    Description=Nginx HA

    After=docker.service

    Requires=docker.service


    [Service]

    TimeoutStartSec=infinity

    ExecStartPre=-/usr/bin/docker kill nginx

    ExecStartPre=-/usr/bin/docker rm nginx

    ExecStartPre=-/usr/bin/docker pull nginx

    ExecStart=/usr/bin/docker run --name nginx -p 80:80 nginx

    ExecStop=/usr/bin/docker stop nginx


    [X-Fleet]

    Conflicts=nginxha@*.service

    ```

    ```


    For the most part, this is identical to the `nginx.service` unit that was used
    before. The `Conflicts` option is set to ensure that any unit that uses this template.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Each instance of the template is named nginxha@id.service, where id is whatever
    makes sense for the service. Usually, id is a number, but it does not have to
    be:


    ```

    $ fleetctl start nginxha@1.service

    Unit nginxha@1.service inactive

    Unit nginxha@1.service launched on 86bceaea.../172.17.8.103

    $ fleetctl start nginxha@2.service

    Unit nginxha@2.service inactive

    Unit nginxha@2.service launched on 9c07271b.../172.17.8.102

    $ fleetctl start nginxha@3.service

    Unit nginxha@3.service inactive

    Unit nginxha@3.service launched on acbccfa4.../172.17.8.101

    ```


    ```

    $ fleetctl list-units

    UNIT                      MACHINE                         ACTIVE      SUB

    nginxha@1.service         86bceaea.../172.17.8.103        active      running

    nginxha@2.service         9c07271b.../172.17.8.102        active      running

    nginxha@3.service         acbccfa4.../172.17.8.101        active      running

    ```


    In this example, three instances of the nginxha@.service template were started.
    They were named nginxha@1, nginxha@2, and nginxha@3. Notice; all of them were
    started on different machines. A load balancer could then be used to spread the
    load across all the instances. If any of the units fail, the overall service will
    remain up.


    # Sidekick services


    Most services are not aware of what else is happening in the cluster, by design.
    How does a service let other things know that it is up and ready to answer requests?
    To do that, a separate service called sidekick is started. The sidekick will notify
    the other services that the container has started or stopped. The specifics will
    vary depending on the environment. For example, it might issue API calls to an
    external load balancer.


    Fleet does not have a native way to inform other services that a new unit has
    started. What it does have is etcd. The etcd key value store is designed for exactly
    this sort of message passing. The following example is a simple sidekick that
    updates etcd when nginx.service starts:


    ```

    [Unit]

    Description=Nginx Sidekick

    BindsTo=nginx.service

    After=nginx.service

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: '```

    [Service]

    ExecStart=/bin/sh -c "while [ true ]; do etcdctl set

    /serivces/websites/nginx ''{ "host": "%H", "port": 80 }'' --ttl 60; sleep 50;

    done"

    ExecStop=/usr/bin/etcdctl rm /serivces/websites/nginx

    ```


    ```

    [X-Fleet]

    MachineOf=nginx.service

    ```


    The BindsTo option works like Requires, but it tells Fleet to stop the sidekick
    if

    nginx.service stops for any reason. The ExecStart option runs an infinite loop
    that

    updates the /serivces/websites/nginx key in etcd with a bit of JSON. A TTL is
    added

    to the key with the --ttl flag to ensure that it disappears if the sidekick fails.
    The sleep

    command waits 50 seconds before updating the key again. The times can be adjusted
    to the

    needs of the environment, but the sleep should always be less than the TTL minus
    the time

    it takes to update etcd.


    The %H variable in the JSON is replaced with the hostname of the node that nginx-

    sidekick.service is running on. This could be problematic if the sidekick were
    to be

    started on a different host from nginx.service. However, the Fleet affinity option,

    MachineOf, ensures that Fleet always schedules the sidekick on the same host as

    nginx.service.


    Another service can monitor the specific files or directories within the etcd
    tree and take

    actions based on updates to the tree. The Confd tool does exactly that, and based
    on the

    contents of the tree, can update a configuration template and restart a service.
    The

    implementation of Confd is left as an exercise for the reader. Confd is available
    at

    https://github.com/kelseyhightower/confd.


    # Starting global units


    There are often times when it is desirable to run containers for logging or monitoring
    on

    every node in the cluster. Fleet accomplishes this with the Global option in [X-Fleet]:


    ```

    [Unit]

    Description=Monitor

    After=docker.service

    Requires=docker.service

    ```


    ```

    [Service]

    TimeoutStartSec=infinity

    ExecStartPre=-/usr/bin/docker kill monitor

    ExecStartPre=-/usr/bin/docker rm monitor

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: '```

    ExecStartPre=/usr/bin/docker pull monitor

    ExecStartPre=mkdir -p /var/lib/monitor

    ExecStart=/usr/bin/docker run -v /var/lib/monitor:/var/www/rrd --net=host --name=monitor
    hyper/host-monitor

    ExecStop=/usr/bin/docker stop monitor


    [X-Fleet]

    Global=true

    ```


    This example starts a simple container that creates RRD files and images which
    chart CPU, memory, and network data. The Global option tells Fleet to start a
    copy of the service on every node in the cluster:


    ```

    $ fleetctl start monitor.service

