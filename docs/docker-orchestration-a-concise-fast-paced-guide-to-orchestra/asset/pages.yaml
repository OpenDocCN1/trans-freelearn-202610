    ![](img/02bead9c8ff4515f78dac0eb33163961_267_0.png)


    # # Introducing Docker for AWS and Docker for Azure


    Docker for AWS is a process that uses CloudFormation to automatically build a
    Docker Swarm on AWS. The process creates a new VPC for the Swarm including subnets
    and security groups. Two Auto Scaling groups are also created; one for the managers
    and one for the workers. The number of each can be adjusted by changing the number
    instances in the respective Auto Scaling groups. New instances will automatically
    join the swarm.


    Docker for Azure provides a similar service for clusters running on Azure. It
    automatically creates all of the services required to run a Docker Swarm. It ties
    into the scaling features of Azure to make it easy to scale up the number of masters
    and workers.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'More information is available at the following locations:


    +   - Docker for AWS: https://beta.docker.com/docs/aws/

    +   - Docker for Azure: https://beta.docker.com/docs/azure/


    # Scaling down nodes


    One of the benefits of cloud computing is the ability to scale down the number
    of hosts when they are no longer needed. For example, a web store may increase
    the number of hosts during the Christmas shopping season and then scale them down
    in January. How that happens will, again, depend on the orchestration solution
    chosen and the platform it is running on.


    Most orchestration systems have a command that will shut down containers on a
    specific node and reschedule them elsewhere in the cluster. This gives the orchestration
    tool a chance to cleanly move services around the cluster before a node is removed.
    Services such as Docker Cloud and GKE take care of that automatically.


    The command to change the node''s availability could be added to the shut down
    scripts. However, care must be made to ensure that all of the containers have
    stopped before the system is shutdown. In most cases, another command will need
    to be run to permanently remove a node from the cluster. Again, the specific command
    will vary depending on the orchestration tool being used.


    # Summary


    This chapter explored different ways to automate the infrastructure that is used
    to run a Docker cluster. It looked at using configuration management while a node
    is running, configuring a node at boot with Cloud-Init, and building custom images
    with Packer. We also covered using Terraform and Docker Cloud to manage a cluster.
    Finally, some tips were shared for deprovisioning nodes when they are no longer
    needed.


    Where you go next is up to you. This book has provided an introduction to Docker
    Orchestration using several tools. Successfully running a Docker cluster requires
    a number of different services including registries, overlay networks, shared
    storage, the orchestration tool itself, log and resource monitoring, and continuous
    integration. The specific tools and work flows will vary from cluster to cluster.
    This book was only able to scratch the surface of what is possible. Hopefully,
    you will be able to take what you have learned here and use it to build a scalable,
    reliable service for your organization using Docker.'
  merge: -1
  img_proc: true
