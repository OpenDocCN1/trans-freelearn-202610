    # Summary


    This chapter showed how to use CI with Docker. It showed how to use GitLab to
    automatically build, test, release, and deploy new images. It also showed how
    to use Docker Cloud to automatically build images and run them for testing. In
    the next chapter, you will learn how to automate the infrastructure that the cluster
    runs on.'
