  md: "```\nweb_1 | Starting the app\nweb_1 | HTTP::Server::PSGI: Accepting connections\
    \ at http://0.0.0.0:5000/\n```\n\nUsing multiple compose files can be of great\
    \ use, but it can also be a little confusing. You might find yourself in a situation\
    \ where you are trying to debug your application configuration and ask yourself,\
    \ “Why is docker-compose using that option?” In those cases, it may be helpful\
