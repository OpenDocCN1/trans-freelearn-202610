    # Managing services


    Now that the swarm is up and running, it is time to look at services. A service
    is a collection of one or more tasks that do something. Each task is a container
    running somewhere in the swarm. Since services are potentially composed of multiple
    tasks, there are different tools to manage them. In most cases, these commands
    will be a subcommand of `docker service`.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Running containers as services in a swarm offers a number of benefits. They
    are as follows:


    +   * Services can be scaled out quickly and easily.

    +   * Swarm can perform zero-downtime upgrades where updated versions of an image
    are added while old versions are removed.

    +   * Easily create overlay networks to connect containers running on multiple
    hosts. (Overlay networks were covered in detail in Chapter 3, Cluster Building
    Blocks – Registry, Overlay Networks, and Shared Storage.)


    # # Running services


    Running tasks with Docker Swarm is a little bit different than running them under
    plain Docker. Instead of using `docker run`, the command is `docker service create`:


    ```

    ```bash

    $ docker service create --name web nginx

    ```

    ```


    When a service starts, a swarm manager schedules the tasks to run on active workers
    in the swarm. By default, swarm will spread running containers across all of the
    active hosts in the swarm.


    Offering services to the Internet requires publishing ports with the `-p` flag.
    Multiple ports can be opened by specifying `-p` multiple times. When using the
    swarm overlay network, you also get ingress mesh routing, which was described
    in Chapter 3, Cluster Building Blocks – Registry, Overlay Networks, and Shared
    Storage. The mesh will route connections from any host in the cluster to the service
    no matter where it is running. Port publishing will also load balance across multiple
    containers:


    ```

    ```bash

    $ docker service create --name web -p 80 -p 443 nginx

    ```

    ```


    # # Creating replicas


    A service can be started with multiple containers using the `--replicas` option.
    The value is the number of desired replicas. It may take a moment to start all
    the desired replicas:


    ```

    ```bash

    $ docker service create --replicas 2 --name web -p 80 -p 443 nginx

    ```

    ```


    This example starts two copies of the `nginx` container under the service name
    `web`. The great news is that you can change the number of replicas at any time:


    ```

    ```bash

    $ docker service update --replicas 3 web

    ```

    ```'
  merge: -1
  img_proc: true
