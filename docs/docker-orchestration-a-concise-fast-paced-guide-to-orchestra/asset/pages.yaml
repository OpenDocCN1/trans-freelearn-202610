    # Installing on a running Linux host


    You can also use a generic driver of docker-machine to install and manage Docker
    on an existing host running a supported Linux distribution. There are a couple
    of things to keep in mind. First, the host must already be running. Docker can
    be pre-installed. This can be useful if you are installing Docker as part of your
    host build process. Second, if Docker is running, it will be restarted. This means
    that any running containers will be stopped. Third, you need to have an existing
    SSH key pair.


    The following command will use SSH to connect to the server specified by the --generic-ip-address
    flag using the key identified by --generic-ssh-key and the user set with --generic-ssh-user.
    There are two important things to keep in mind for the SSH user. First, the user
    must be able to use sudo without a password prompt. Second, the public key must
    be in the authorized_keys file in the user''s $HOME/.ssh/ directory:


    ```

    $ docker-machine create --driver generic --generic-ip-address 52.40.113.7 --generic-ssh-key
    ~/.ssh/id_rsa --generic-ssh-user ubuntu dm-ubuntu-test

    ```


    This process will take a couple of minutes. It will be faster than the creates
    on cloud services that also have to provision the VM. Once it is complete, you
    can manage the host with docker-machine and start running containers.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The only difference between the generic driver and the other cloud drivers
    is that the `stop` subcommand does not work. This means that stopping a generic
    Docker host has to be done from the host.


    Full documentation can be found at

    https://docs.docker.com/machine/drivers/generic/.


    # Introducing Docker-specific distributions


    One of the benefits of running services with Docker is that the server distribution
    no longer matters. If your application needs CentOS tools, it can run in a container
    based on CentOS. The same is true for Ubuntu. In fact, services running in containers
    based on different distributions can run side-by-side without issue. This has
    led to a push for very thin, Docker-specific distributions.


    These distributions have one purpose: to run Docker containers. As such, they
    are very small and very limited in what comes out of the box. This a huge benefit
    to cloud wranglers everywhere. Fewer tools mean fewer updates and more uptime.
    It also means that the host OS has a much smaller attack surface, giving you greater
    security.


    Their focus on Docker is a great strength, but it can also be a weakness. You
    may find yourself up against a wall if you need something specific on your host
    that is not available. On the positive side, many tools that might not be available
    in the default install can be run from a container.


    # CoreOS


    CoreOS (https://coreos.com) was one of the first Docker-specific distributions.
    They have since started their own container project called **rkt**, but still
    include Docker. It is supported on all major cloud providers including Amazon
    EC2, Microsoft Azure, and GCE and can be installed locally in bare-metal or in
    a local cloud environment.


    CoreOS uses the same system that Google uses on their Chromebooks to manage updates.
    If the updates cause a problem, they can be easily rolled back to the previous
    version. This can help you maintain stable and reliable services.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "CoreOS is designed to update the system automatically which is very unique.\
    \ The idea is that automatically updating the OS is the best way to maintain the\
    \ security of the infrastructure. This process can be configured, by default,\
    \ to ensure that only one host in a CoreOS cluster is rebooting at a time. It\
    \ can also be configured to only update during maintenance windows or turned off\
    \ completely. Before you decide to turn it off manually, remember that a properly\
    \ configured orchestration system will keep services up and running even when\
    \ the hosts they are running is on reboot.\n\nCoreOS includes Docker but does\
    \ not enable it. The following example from the CoreOS documentation shows how\
    \ to enable Docker on boot. This is done by creating a new systemd unit file through\
    \ cloud-init. On AWS, this is placed in the user data instance configuration:\n\
    \n```\n#cloud-config\n\ncoreos:\n  units:\n    - name: docker-tcp.socket\n   \
    \   command: start\n      enable: true\n      content: |\n        [Unit]\n   \
    \     Description=Docker Socket for the API\n\n        [Socket]\n        ListenStream=2375\n\
    \        BindIPv6Only=both\n        Service=docker.service\n\n        [Install]\n\
    \        WantedBy=sockets.target\n```\n\nCoreOS uses a default core user. Users\
    \ can be added through the cloud-config file:\n\n```\n#cloud-config\nusers:\n\
    \  - name: \"demo\"\n    passwd: \"$6$HpqJOCs8XahT$mSgRYAn...\"\n    groups:\n\
    \    - \"sudo\"\n    - \"docker\"\n```"
  merge: -1
  img_proc: true
- pgno: 32
  md: "As SSH key can also be added with the `ssh-authorized-keys` option in the `users`\
    \ block. You can add any number of keys to each user:\n\n```\n#cloud-config\n\
    users:\n- default\n- name: \"demo\"\n  ssh-authorized-keys:\n- \"ssh-rsa AAAAB3Nz...\"\
    \n```\n\nCoreOS also supports `sssd` for authentication against LDAP and **Active\
    \ Directory (AD)**. Like Docker, it is enabled through `cloud-config`:\n\n```\n\
    #cloud-config\ncoreos:\nunits:\n- name: \"sssd.service\"\ncommand: \"start\"\n\
    enable: true\n```\n\nThe `sssd` configuration is in `/etc/sssd/sssd.conf`. Like\
    \ the rest of CoreOS, the configuration can be added to `cloud-config`:\n\n```\n\
    #cloud-config\nwrite_files:\n- path: \"/etc/sssd/sssd.conf\"\npermissions: \"\
    0644\"\nowner: \"root\"\ncontent: |\nconfig_file_version = 2\n...\n```\n\n> Full\
    \ configuration of `sssd` is beyond the scope of this book. Full documentation\
    \ is at the following website:\n> https://jhrozek.fedorapeople.org/sssd/1.13.1/man/sssd.conf.5.html\n\
    > 1\n\n# RancherOS\n\nRancher (http://rancher.com) was designed from the ground\
    \ up to run Docker containers. It supports multiple orchestration tools including\
    \ Kubernetes, Mesos, and Docker Swarm. There are ISOs available for installation\
    \ to hardware and images for Amazon EC2, GCE, or OpenStack. You can even install\
    \ RancherOS on Raspberry Pi!"
  merge: -1
  img_proc: true
- pgno: 33
  md: 'RancherOS is so unique; even the system tools run in Docker. Because of this,
    the admin can choose a console that fits what they''re comfortable with. Supported
    consoles are CentOS, Debian, Fedora, Ubuntu, or the default BusyBox-based console.


    Rancher provides a very nice web interface for managing containers and clusters.
    It also makes it easy to run multiple environments including multiple orchestration
    suites. Rancher will be covered in more detail in Chapter 7, Using Simpler Orchestration
    Tools – Fleet and Cattle.


    The `cloud-init` package is used to configure RancherOS. You can configure it
    to start containers on boot, format persistent disks, or do all sorts of other
    cool things. One thing it cannot do is add additional users. The idea is that
    there is very little reason to log in to the host once Docker is installed and
    configured. However, you can add SSH keys to the default rancher user to allow
    unique logins for different users:


    ```

    #cloud-config

    ssh_authorized_keys:

    - ssh-rsa AAAAB3Nz...

    ```


    If you need to add options to Docker, set them with `cloud-init`:


    ```

    #cloud-config

    rancher:

    docker:

    args: [daemon, ...]

    ```


    # # Project Atomic / RHEL Atomic


    Project Atomic (http://projectatomic.io) grew out of the Fedora Project but now
    supports CentOS, Fedora, and RHEL. Images are available for Linux KVM and Xen-based
    virtualization platforms as well as Amazon EC2 and bare-metal installation.


    It uses OSTree and `rpm-OSTree` to provide atomic updates. In other words, every
    package is updated at the same time, in one chunk. You do not have to worry that
    one package might have failed updates and left the system with an older package.
    It also provides for easy rollback in case the updates cause problems.


    Project Atomic comes pre-installed with Docker and Kubernetes. (Kubernetes is
    covered in detail in Chapter 5, Deploying and Managing Services with Kubernetes.)
    This makes it an ideal base for Kubernetes-based clusters. The addition of SELinux
    adds an extra level of security in case one of the running containers is compromised.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "Deployment on almost any local cloud system or EC2 is made easier by the use\
    \ of cloud-init. The cloud-init package lets you configure your Atomic hosts automatically\
    \ on boot, instantly growing your Kubernetes cluster.\n\nYou can use cloud-init\
    \ to set the password and enable SSH logins for the default user:\n\n```\n#cloud-config\n\
    password: c001-pa$$word\nssh_pwauth: True\n```\n\nYou can also add SSH keys to\
    \ the default user's authorized_keys file:\n\n```\n#cloud-config\nssh_authorized_keys:\n\
    \  - ssh-rsa AAAAB3Nz...\n  - ssh-rsa AAAAB3Nz...\n```\n\n> The name of the default\
    \ user depends on which version of Atomic you use. For Fedora, the username is\
    \ fedora, for CentOS it is centos, and for RHEL it is cloud-user.\n\n# # Running\
    \ single container applications\n\nBefore we get into the nuts and bolts of Docker\
    \ orchestration, let's run through the basics of running single applications in\
    \ Docker. Seeing as this is a tech book, the first example is always some variant\
    \ of Hello World and this is no different.\n\n> By default, docker must be run\
    \ as the root user or with sudo. Instead, you could add your user to the docker\
    \ group and run containers without root.\n\n```\n$ docker run --rm ubuntu echo\
    \ \"Hello World\"\n```\n\nThis example is really simple. It downloads the ubuntu\
    \ Docker image and uses that image to run the echo \"Hello World\" command. Simple,\
    \ right? There is actually a lot going on here that you need to understand before\
    \ you get into orchestration."
  merge: -1
  img_proc: true
- pgno: 35
  md: 'First of all, notice the word `ubuntu` in that command. That tells Docker that
    you want to use the `ubuntu` image. By default, Docker will download images from
    the Docker Hub. There are a large number of images, most uploaded by the community,
    but there are also a number of official images of various projects of which `ubuntu`
    is one. These form a great base for almost any application.


    Second, take special note of the `--rm` flag. When `docker` runs, it creates an
    image for the container that contains any changes to the base image. Those changes
    persist as long as the container exists even if the container is stopped. The
    `--rm` flag tells `docker` to remove the container and its image as soon as it
    stops running. When you start automating containers with orchestration tools,
    you will often want to remove containers when they stop. I''ll explain more in
    the next section.


    Lastly, take a look at the `echo` command. Yes, it is an `echo` alright, and it
    outputs `Hello World` just like one would expect. There are two important points
    here. First, the command can be anything in the image, and second, it must be
    in the image. For example, if you tried to run `nginx` in that command, Docker
    will throw an error similar to the following:


    ```

    $ sudo docker run --rm ubuntu nginx

    exec: "nginx": executable file not found in $PATH

    Error response from daemon: Cannot start container

    821fcd4e8ae76668d8c508190b338e166247dc46cb6bc2582731566e7f2c705a: [8]

    System error: exec: "nginx": executable file not found in $PATH

    ```


    The "Hello World" examples are all good but what if you want to do something actually
    useful? To quote old iPhone ads; _There’s an app for that_. There are many official
    applications available on the Docker Hub. Let''s continue with `nginx` and start
    a container running `nginx` to serve a simple website:


    ```

    $ docker run --rm -p 80:80 --name nginx nginx

    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'This command starts a new container based on the `nginx` image, downloading
    it if needed, and telling `docker` to forward TCP port 80 to port 80 in the image.
    Now you can go to `http://localhost` and see a most welcoming website:


    ![](img/02bead9c8ff4515f78dac0eb33163961_36_0.png)


    Welcoming people to Nginx is all well and good, but obviously, you will want to
    do more than that. That will be covered in more detail in *Chapter 2, Building
    Multi-Container Applications with Docker Compose*. For now, the default will be
    sufficient.


    If you run the preceding example, you will notice that the console appears to
    hang. That''s because `docker` starts processes in the foreground. What you are
    seeing there is `nginx` waiting for a request. If you go to `http://localhost`,
    then you should see messages from the `nginx` access log printed to the console.
    Another option is to add `-d` to your `run` command. That will detach the process
    from the console:


    ```

    $ docker run -d -p 80:80 --name nginx nginx

    ```


    > The `-d` and `--rm` options are mutually exclusive.


    There are multiple ways to stop a container. The first way is to end the process
    running in the container. This will happen automatically for short running processes.
    When starting a container like `nginx` in the preceding example, pressing `Ctrl
    + C` in the session will stop `nginx` and the container. The other way is to use
    `docker stop`. It takes the image ID or name of the container. For example, to
    stop the container that was started earlier you would run `docker stop nginx`.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Let''s take a moment and look at how Docker deals with remote images. Remember,
    when you first ran `docker run` with the `ubuntu` or `nginx` images, `docker`
    had to first download the images from the Docker Hub. When you run them again,
    Docker will use the downloaded image. You can see the images Docker knows about
    with the `docker images` command:


    | REPOSITORY | TAG | IMAGE ID | CREATED | VIRTUAL SIZE |

    |---|---|---|---|---|

    | ubuntu | latest | ae81bbda2b6c | 5 hours ago | 126.6 MB |

    | nginx | latest | bfdd4ced794e | 3 days ago | 183.4 MB |


    Unwanted images can be deleted with the `docker rmi` command:


    ```

    $ docker rmi ubuntu

    ```


    Ack! What do you do if you deleted an image but you still need it? You have two
    options. First, you can run a container that uses the image. It works, but can
    be cumbersome if running a container changes data or conflicts with something
    that is already running. Fortunately, there is the `docker pull` command:


    ```

    $ docker pull ubuntu

    ```


    This command will pull the default version of the `ubuntu` image from the repository
    on Docker Hub. Specific versions can be pulled by specifying them in the command:


    ```

    $ docker pull ubuntu:trusty

    ```


    Docker pull is also used to update a previously downloaded image. For example,
    the `ubuntu` image is regularly updated with security fixes and other patches.
    If you do not pull the updates, `docker` on your host will continue to use the
    old image. Simply run the `docker pull` command again and any updates to the image
    will be downloaded.


    Let''s take a quick diversion and consider what this means for your hosts when
    you begin to orchestrate Docker. Unless you or your tools update the images on
    your hosts, you will find that some hosts are running old images while others
    are running the new, shiny image. This can open your systems up to intermittent
    failures or security holes. Most modern tools will take care of that for you or,
    at least, have an option to force a pull before deployment. Others may not, keep
    that in mind as you look at orchestration tools and strategies.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# # What is running?


    At some point, you will want to see what containers are running on a specific
    host. Your orchestration tools will help with that, but there will be times that
    you will need to go straight to the source to troubleshoot a problem. For that,
    there is the `docker ps` command. To demonstrate, start up a few containers:


    ```

    $ for i in {1..4}; do docker run -d --name nginx$i nginx ; done

    ```


    Now run `docker ps`:


    ```

    $ sudo docker ps

    CONTAINER ID        IMAGE               COMMAND                  CREATED             STATUS                         PORTS               NAMES

    e5b302217aeb        nginx             "nginx -g ''daemon off"   About a minute
    ago   Up About a minute              80/tcp, 443/tcp     nginxx4

    dc9d9e1e1228        nginx             "nginx -g ''daemon off"   About a minute
    ago   Up About a minute              80/tcp, 443/tcp     nginx3

    6009967479fc        nginx             "nginx -g ''daemon off"   About a minute
    ago   Up About a minute              80/tcp, 443/tcp     nginxx2

    67ac8125983c        nginx             "nginx -g ''daemon off"   About a minute
    ago   Up About a minute              80/tcp, 443/tcp     nginxx1

    ```


    You should see the containers that were just started as well as any others that
    you may have running. If you stop the containers, they will disappear from `docker
    ps`:


    ```

    $ for i in {1..4}; do docker stop nginx$i ; done

    nginxx1

    nginxx2

    nginxx3

    nginxx4

    ```


    As you can see if you run `docker ps`, the containers are gone:


    ```

    $ docker ps

    CONTAINER ID        IMAGE               COMMAND             CREATED             STATUS              PORTS               NAMES

    ```


    However, since the `--rm` flag was not used, `docker` still knows about them and
    could restart them:


    ```

    $ docker ps -a

    CONTAINER ID        IMAGE               COMMAND                  CREATED             STATUS                     PORTS               NAMES

    e5b302217aeb        nginx             "nginx -g ''daemon off"   3 minutes ago       Exited
    (0) About a minute ago                        nginxx4

    dc9d9e1e1228        nginx             "nginx -g ''daemon off"   3 minutes ago                          nginx3

    ```'
  merge: -1
