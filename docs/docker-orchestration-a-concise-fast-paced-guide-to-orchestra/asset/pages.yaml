- pgno: 59
  md: '# # Cluster Building Blocks – Registry, Overlay Networks, and Shared Storage


    The previous two chapters covered the basics of using Docker. Now it is time to
    start looking forward to building a Docker cluster. Before a new cluster can be
    built, a foundation needs to be laid. This chapter will cover the registry, overlay
    networks, and shared storage. Each component is essential for the smooth operation
    of containers in a Docker cluster.


    Docker is a highly pluggable system. Meaning, there are many options for each
    component. Each has its own strengths and weaknesses. Some may be better suited
    to your environment than others. This chapter will give a few examples of each
    component and explain how to use them.


    The good news is that no matter your choice, you are not locked in. Docker''s
    plugin system makes it easy to use whichever component you need, often on a per-container
    basis. You could start, for example, using one system for shared storage and decide
    that another fits your needs. New containers can start using the new storage immediately,
    while older ones continue to use the old system.


    The following topics will be covered in this chapter:


    +   - Registry

    +   - Using a registry

    +   - Docker Hub

    +   - Docker Cloud'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   - Docker Datacenter and Docker Trusted Registry

    +   - GitLab registry

    +   - Building it yourself

    +   - Overlay networks

    +   - Native Docker overlay networks

    +   - Flannel

    +   - Weave

    +   - Shared storage

    +   - Storage drivers

    +   - Ceph


    # # Creating a Docker Registry


    A **registry** is simply a place where images are stored. Already in this book,
    you have used a Docker Registry. In *Chapter 1, Getting Started with Docker Orchestration*,
    there was an example of starting an `nginx` container:


    ```

    $ docker run --name webserver -p 80:80 nginx

    ```


    The `docker` command includes the name of the image to use, in this case `nginx`.
    Docker first looks for that image locally, but if the image is not found locally,
    Docker connects to the default registry at the Docker Hub. If the image exists
    on the registry, it is downloaded and your container starts.


    Think of how powerful having a registry can be. A registry makes it easy to quickly
    deploy any image to any node in your cluster. Without one, you have to manually
    build your image on each and every machine first. In my early days of using Docker,
    I did that and it was not fun. Each time I built an image, there was a chance
    that a library change would break my application. Using a registry gives you consistent
    deployments across your cluster.


    # ## Using the Docker Hub


    By far, the easiest registry to use out of the box is Docker Hub. The official
    Docker images for most projects are hosted there. You can create an account for
    free and host as many public images as you need. Private repositories are available
    for a fee. To create an account, go to https://hub.docker.com.'
  merge: -1
  img_proc: true
- pgno: 61
  md: "# # Logging in\n\nOnce you have an account, it is time to log into the registry\
    \ with `docker login`. By default, Docker will attempt to log you into Docker\
    \ Hub. Once you are logged in, you will have rights to pull your private images\
    \ and push new images into the repository:\n\n```\n```\n$ docker login\nUsername:\
    \ username\nPassword:\nEmail: username@example.com\nWARNING: login credentials\
    \ saved in /home/user/.docker/config.json\nLogin Succeeded\n```\n```\n\nTake note\
    \ of the warning in the output. Your registry login credentials will be saved\
    \ in `$HOME/.docker/config.json`. This file can be pushed to your cluster servers\
    \ to automate registry actions:\n\n```\n```\n$ cat ~/.docker/config.json\n{\n\
    \  \"auths\": {\n    \"https://index.docker.io/v1/\": {\n      \"auth\": \"cG...\"\
    ,\n      \"email\": \"username@example.com\"\n    }\n  }\n}\n```\n```\n\nOnce\
    \ you have logged in and your credentials have been saved, you can log in again\
    \ without having to specify the password. It is also possible to pass the password\
    \ on the command line using the `-p` option:\n\n```\n```\n$ docker login -u username\n\
    WARNING: login credentials saved in /home/user/.docker/config.json\nLogin Succeeded\n\
    ```\n```\n\nObviously, leaving your password credentials around, even when they\
    \ are hashed, can be a bit scary. At the very least, make sure that `$HOME/.docker/config.json`\
    \ is only readable by your user. When you are done, you can remove your credentials\
    \ from `config.json` by running `docker logout`."
  merge: -1
  img_proc: true
- pgno: 62
  md: 'When you start orchestrating your cluster, you are going to have to automate
    registry logins from your servers if you are using private repositories. The servers
    will need to be able to pull the images from the registry. If they cannot, your
    services will not run. Whenever possible, you should have a separate, read-only
    user that can pull images from your repository but cannot update it. It is possible
    to do this in Docker Hub but takes a few steps to set up:


    +   1. Click on Organizations and then click on Create Organization.

    +   2. Click on the Create Team button, fill in the Team Name and Description
    fields, then click on Add:


    ![](img/02bead9c8ff4515f78dac0eb33163961_62_0.png)


    +   3. Click on the team from the list and add your read-only users to the team.

    +   4. Create a repository or click on an existing repository in your organization.

    +   5. Click on Collaborators. Select the team from the drop-down menu. Select
    Read and click on Add Team:'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/02bead9c8ff4515f78dac0eb33163961_63_0.png)


    Any users that you add to the group will be able to pull images from the repository
    but will not be able to push to it. You can add your read-only team to as many
    repositories as needed. This will provide a measure of safety while still allowing
    your orchestration tools to pull images from the repository when needed.


    # # Working with a repository


    It is not required that a repository be created before it can be used. However,
    if the repository is going to be private, it should be created ahead of time.
    That way it can be assured that images pushed to the repository are not visible.
    You can create as many repositories as you need:


    +   1. Log in to Docker Hub and click on Create Repository.

    +   2. Select your namespace from the list. This will either be your username
    or the name of an organization.

    +   3. Enter a name for your repository. This must be unique within the namespace.

    +   4. Add a short description and a full description, if desired.

    +   5. Select your Visibility, either public or private, and click on Create.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Now it is time to upload an image to Docker Hub. You must first build an image
    with `docker build`. The image name must be the same as the one you are pushing
    to. When using Docker Hub, images are named with either the username or the organization
    and the image name separated by a slash. For example, if your organization is
    `domemoorg` and the image is named `test`, the image name would be `domemoorg/test`.
    Optionally, a tag may also be included such as `domemomode/test:0.1`. When the
    build is complete, push the image up to Docker Hub:


    ```

    $ docker build -t domemoorg/test .

    [output omitted]

    $ docker push domemoorg/test

    The push refers to a repository [docker.io/domemoorg/test]

    2a2c642ec5d1: Pushed

    45d6c44ca123: Pushed

    07066ce72cdd: Pushed

    e4c7c26cda75: Pushed

    0cad5e07ba33: Mounted from library/ubuntu

    48373480614b: Mounted from library/ubuntu

    055757a19384: Mounted from library/ubuntu

    c6f2b330b60c: Mounted from library/ubuntu

    c8a75145fcc4: Mounted from library/ubuntu

    latest: digest: sha256:flaf9d37d7792490f571a572bb17a21936b512b22a2d8650c11a3424f9192033

    size: 2198

    ```


    The image is now available on Docker Hub. If the repository is public, anyone
    can download and use the image. For that reason, do not include passwords in your
    image. Whenever possible, use environment variables as discussed in `Chapter 2,
    Building Multi-Container Applications with Docker Compose`, to keep your passwords
    secret.


    Downloading your image from Docker Hub can be done in one of two ways. First,
    you could simply run a container such as `docker run domemoorg/test`. If the image
    does not exist on the server, it will be downloaded automatically. Note that `docker
    run` will not see if an image has changed on Docker Hub. To force your system
    to download the image use `docker pull`:


    ```

    $ docker pull domemoorg/test

    ```


    In some cases, it may be useful to use `docker pull` to download your images before
    you are ready to deploy it. For example, you may have a new version of an existing
    image that is already being used by a running container. Running `docker pull`
    will ensure that everything is in place before you upgrade. That will minimize
    potential downtime when the new container starts.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Automating image builds with Docker Hub


    Docker Hub has a feature that will automatically build a new image based on updates
    to a Git branch hosted on GitHub or Bitbucket. To create an automated build, select
    **Create Automated Build** from the **Create** menu. You will be prompted to link
    to an account on GitHub or Bitbucket, if you have not already done so.


    Note that a linked GitHub or Bitbucket account may only be linked to a single
    Docker Hub account.


    The wizard will walk you through the creation of a new repository. You will be
    asked for a name and description for the repository. Once the repository is created,
    go to **Build Settings** to configure the automated build. Docker Hub can track
    multiple branches from your Git repository and build a new tagged image every
    time that branch is updated.


    You can also configure Docker Hub to rebuild your image if an upstream container
    is updated. For example, let’s suppose that your container is based on the `ubuntu`
    image, in other words, you used `From ubuntu` at the top of your `Dockerfile`.
    Whenever the `ubuntu` image is rebuilt, it will trigger a rebuild of your image
    as well. This is one way to ensure that your images always have the latest security
    updates from the upstream image.


    Automated builds are a great way to get started with **Continuous Integration
    (CI)** and **Continuous Deployment (CD)**. It does not have the image testing
    capabilities that **GitLab** or **Jenkins** have, but you could still build an
    automated testing process. For example, when your developers are ready to test
    their application, they could push their changes to a testing branch in GitHub.
    That push will trigger a build on Docker Hub that builds a new image. A process
    could run on one of your servers that regularly pulls the testing branch, runs
    a test suite against it, and sends your team a build report. If the tests were
    successful, the team could then push their code to the `master` branch and trigger
    a build for production.


    CI/CD tools are one way to ensure stability and reliability in your deployment
    process. The *Chapter 9, Using Continuous Integration to Build, Test, and Deploy
    Containers,* will show you how you can use the built-in Docker Registry in GitLab
    to automate testing and deployment.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Integration with Docker Cloud


    Docker offers a completely cloud hosted Docker management platform called Docker
    Cloud. Docker Cloud uses Docker Hub to provide registry services. Meaning, in
    addition to the tight integration with the management environment, you also get
    the same automated build services that are available directly on Docker Hub. In
    addition to automated builds, Docker Cloud also provides an automated test framework.
    This will be covered more in Chapter 9, Using Continuous Integration to Build,
    Test, and Deploy Containers.


    Another feature of Docker Cloud for private repositories is the ability to perform
    security scans of your images. It scans each layer of your image for known vulnerabilities
    and provides a report. The scans are run on image push or when an automated build
    is triggered. The generated reports may show a vulnerability in an image that
    your image is based on. In that case, you will have to rebuild with a newer version
    of the base image or work around the vulnerability yourself.


    # Using the GitLab Container Registry


    GitLab is an all in one development suite. It provides Git repositories, issue
    tracking, CI, and a Docker Registry. The tight integration between Git, issue
    tracking, and Docker registries in GitLab make it an ideal solution for application
    development. GitLab is open source and can be installed locally. Enterprise hosting
    is also available at gitlab.com.


    The easiest way to use GitLab is through their cloud offering, but installing
    it locally is straightforward. In my experience, the best way to install GitLab
    is to use the Omnibus installer. It installs all the software GitLab needs and
    manages all of the updates. The Omnibus package is available for Ubuntu, Debian,
    CentOS, and Raspberry Pi.


    There is a Docker image available, but it is a little bit harder to work with.
    I recommend creating your own image using gitlab/gitlab-ce as a base to put the
    package configuration and SSL certificates in place. The GitLab Docker image documentation
    is at https://docs.gitlab.com/omnibus/docker/.


    # Installing GitLab on Ubuntu


    There are a number of dependencies that need to be installed before GitLab can
    be installed. Postfix is optional. If you choose not to use it, you will need
    to configure GitLab to use another server to send e-mail:


    ```

    $ sudo apt-get install curl openssh-server ca-certificates postfix

    ```'
