- pgno: 264
  md: "```\naws_instance.docker-hosts.1: Still creating... (10s elapsed)\naws_instance.docker-hosts.0:\
    \ Still creating... (10s elapsed)\naws_instance.docker-hosts.1: Still creating...\
    \ (20s elapsed)\naws_instance.docker-hosts.0: Still creating... (20s elapsed)\n\
    aws_instance.docker-hosts.0: Creation complete\naws_instance.docker-hosts.1: Creation\
    \ complete\nApply complete! Resources: 2 added, 0 changed, 0 destroyed.\nThe state\
    \ of your infrastructure has been saved to the path below. This state is required\
    \ to modify and destroy your infrastructure, so keep it safe. To inspect the complete\
    \ state use the `terraform show` command.\nState path: terraform.tfstate\n```\n\
    \nThe generated terraform.tfstate file is important. It provides a map from the\
    \ resources defined in the configuration to what is actually running. Anyone operating\
    \ on the same Terraform cluster must use the same terraform.tfstate file. The\
    \ state file is small enough that it can be stored in version control, but that\
    \ can cause merge conflicts. Instead, Terraform has a option to store the state\
    \ remotely. Several backends are supported including S3, Azure, and etcd. Full\
    \ documentation, including the list of backends, is available at https://www.terraform.io/docs/state/remote/index.html.\n\
    \nTo update the cluster, simply change the configuration and run terraform plan\
    \ and terraform apply again. The requested change will be made throughout the\
    \ cluster. Be advised that some changes will require Terraform to remove and recreate\
    \ running instances. It is possible that enough of the instances will be stopped\
    \ as to affect services.\n\n# Showing the cluster state\n\nIt can be useful to\
    \ see what state the cluster is in. To see the state, run terraform show. The\
    \ output is potentially long depending on how large the cluster is. The following\
    \ example shows the type of information that is available. Of special note are\
    \ the private and public IP addresses:\n\n```\n$ terraform show\naws_instance.docker-hosts.0:\n\
