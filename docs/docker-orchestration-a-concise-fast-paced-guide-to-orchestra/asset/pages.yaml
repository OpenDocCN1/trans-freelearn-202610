- pgno: 41
  md: '# Building Multi-Container Applications with Docker Compose


    Modern applications have a lot of moving parts. A web application almost always
    uses a database such as MySQL or MongoDB to store data. There may be a load balancer
    or SSL proxy. Often there are tasks scheduled to run regularly that perform routine
    maintenance or backups. On a traditional server, these tasks might all be installed
    on a single server or spread across numerous hosts. The challenge faced by system
    administrators is how are all these parts deployed consistently and reliably?


    Rather than having a single container that does everything, you can split your
    application into smaller chunks. Each container has a specific task and does only
    that task. For example, you might have one image that is a Perl-based web application;
    a second that runs MySQL; a third that runs HAProxy to load balance and provide
    SSL termination for the Perl application. Each separate container can be run,
    upgraded, and tested independent of each other. Your developers can work on the
    web code all they want, and you do not have to worry about what they might do
    to your database install.


    This chapter will show you how that is done. The process starts with a single
    image, defined by a `Dockerfile`. It then proceeds to build a small multi-container
    application using both custom images and images from the Docker Hub. Along the
    way, you will see how to use Docker Compose to define your application; how networks
    can be used to isolate your data; and how volumes can keep your data safe.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The following topics will be covered in this chapter:


    +   - Building an image from a `Dockerfile` with Docker Engine

    +   - Installing Docker Compose

    +   - Using Docker Compose to build single and multi-container applications

    +   - Using environment files to change how your application runs

    +   - Extending Docker Compose files

    +   - Controlling the container start order

    +   - Using named networks for data isolation

    +   - Using volumes for data persistence


    # # Building an image with Docker Engine


    They say the longest journey begins with a single step. In this case, an application
    begins with a single image. More often than not, existing images will not be perfect
    fits. This will certainly be the case if you are deploying your own services.


    It all starts with a `Dockerfile`. This file provides detailed instructions to
    Docker for building an image. There are a lot of things that can be done in a
    `Dockerfile`. Specific operating system packages or language libraries can be
    installed; configuration files can be put into place; and a default command can
    be set. It is best to base a new image for an application off an official image,
    when possible. For example, an application written in Ruby should be based off
    of the official `ruby` image. A full reference of the `Dockerfile` directives
    can be found at https://docs.docker.com/engine/reference/builder/.


    # # Building from a Dockerfile


    Back in Chapter 1, Getting Started with Docker Orchestration, we started with
    a container that ran Nginx and displayed the default welcome page. This time,
    let us add a custom website to the container. Start by creating an empty directory
    somewhere. In that directory, download the examples from the GitLab repository
    for this book:


    ```

    $ git clone https://gitlab.com/perlstalker/docker-orchestration-examples

    $ cd docker-orchestration-examples/ch02

    ```


    Then, create a file named `Dockerfile` with the following content:


    ```

    FROM nginx:1.10

    COPY sample-website /usr/share/nginx/html

    ```'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'This is a simple file but there are two important pieces here. First is the
    FROM command, which tells Docker that your container extends the nginx image that
    was used before. Basing your custom images on the existing images can save a lot
    of time and hassle. They may not be perfect out of the box but often it only takes
    a few changes to get what you need.


    Second, there is the ADD command. The nginx container uses /usr/share/nginx/html
    within the container as the document root. The ADD command places the content
    of the website directory in /usr/share/nginx/html when the container is built.


    The ADD command can add single files, directories, or tarballs. The TAR files
    will be unpacked in the directory that you specify. The TAR file can be compressed
    with gzip, bzip2, or xz. The ADD command can also take a URL. The file pointed
    to by ADD will be downloaded and placed in the given directory in your image.
    A tarball added via URL will not be unpacked.


    In addition to the ADD command, there is a command called COPY. It simply adds
    the given files or directories with any of the automated unpacking that ADD does.
    The COPY command is preferred when adding simple files or directories to an image.


    Now, it is time to build the container. Change to the directory with your Dockerfile
    and website directory and run docker build. When the build completes, you will
    have an image named website ready to use with docker run:


    ```

    $ docker build -t website .

    ```


    # Tagging the image


    The -t flag allows you to give your image a name. The name may include a : followed
    by a tag. The most common way of using this is as a version number. It might also
    be a date, Git tag, or something else that makes sense in your environment. For
    example, the official ubuntu image has tags for releases such as ubuntu:trusty
    or ubuntu:xenial, which refer to the appropriate Ubuntu release:


    ```

    $ docker build -t website:0.1 .

    ```


    Image versioning will be important going forward. At some point, you will be deploying
    an updated version of your service. It is possible to reuse a name and version,
    which may be fine while you develop the application, but different versions will
    make it easy to roll back to a previous, known good image in the event of a failure.
    It also allows you or your QA team to test an image without overwriting the image
    your production services are started from.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Additional tags can be added to an image after it has been built. You can think
    of this as an alias. Image tags are a good way to identify images that are in
    a certain state. For example, after you have built the website, you could tag
    it to show that it is ready for testing with `docker tag website:testing website:0.1`.
    After testing, the image can be tagged as `website:latest` or `website:production`
    to show that the image is ready for production. Repeat the process as each new
    image moves through the development process. Having a consistent image name will
    make it easier for developers to know which image to download. Using version numbers
    will make it easier to see which version of an image is being used. It also allows
    for easy rollbacks of an application in case the new version is broken.


    # ## Skipping the build cache


    Another useful flag is --no-cache. Normally, Docker will try to reuse existing
    images as much as possible. This will speed up the build process but might cause
    problems with your build. A common example is when adding packages to an image.
    Take this small `Dockerfile`, for example. It is based on the latest Ubuntu image.
    It simply updates `apt` and installs `nginx`:


    ```

    FROM ubuntu:16.04

    RUN apt-get update

    RUN apt-get -y install nginx && apt-get clean

    ```


    Because Docker caches each step, `apt-get update` will not be run on subsequent
    builds. APT will then attempt to install `nginx` based on what is in the cache.
    It is possible that the version the image wants to install no longer exists on
    the mirror and the install will fail. This happens most often if you are changing
    the list of packages to install. The `apt-get install` command is rerun but `apt-get
    update` is not. When that happens, adding `--no-cache` will force Docker to rerun
    every step rather than use the cache.


    There is one more flag that I want to point out – the `--pull` flag. It tells
    Docker to download a newer image of any images that are used. This is important
    if you want to be sure that you have the latest version with all security patches
    applied. However, that might mean updated libraries which could cause problems
    for your application. The good news is that with versioned builds, you will not
    break anything running in production:


    ```

    $ docker build --no-cache --pull -t website:0.1 .

    ```'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Running the image


    Once your image is built, you may run a container using the image with the following
    command:


    ```

    $ docker run --rm -p 80:80 website:0.1

    ```


    That should look very familiar. This time, instead of running the nginx image,
    Docker will run your newly built image complete with the sample website. Once
    started, you can then open the site in a web browser. If the container is running
    on your desktop, go to http://localhost/ and see the new site:


    ![](img/02bead9c8ff4515f78dac0eb33163961_45_0.png)


    # Installing Docker Compose


    Once your images are built, you need to tell Docker how to run them. Docker Engine
    is limited in allowing you to define how containers work together. The Docker
    project provides a solution called Docker Compose. Docker Compose is a great tool
    for testing out deployments, defining how containers will interact or what external
    storage they need, or even as a lightweight orchestration tool.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "Installing Docker Compose is easy. For Windows and OS X users, docker-compose\
    \ installs as part of the Docker Toolbox and Docker for Mac and Windows. For Linux\
    \ users, docker-compose can be downloaded from the Docker repository on GitHub.\
    \ The following command from the Docker Compose documentation shows you how:\n\
    \n```\n# curl -L\nhttps://github.com/docker/compose/releases/download/1.8.0  /docker-compose-\n\
    `uname -s`-`uname -m`  > /usr/local/bin/docker-compose\nchmod +x /usr/local/bin/docker-compose\n\
    ```\n\n+   * As shown, the curl command must be run as root in order to have the\
    \ permissions to write the file to /usr/local/bin.\n+   * The version number will\
    \ have almost certainly changed since the time of writing. Update the command\
    \ accordingly. The latest release can be found at https://github.com/docker/compose/releases/.\n\
    \n# # Writing a Docker Compose file\n\nA Docker Compose file defines everything\
    \ about an application. The services, volumes, networks, and dependencies can\
    \ all be defined in one place. The configuration can be used locally to stand\
    \ up a development environment, plugged into an existing continuous integration\
    \ or continuous deployment system, or even used on a server to start production\
    \ services. Later chapters will show better ways to manage running services.\n\
    \nDocker Compose looks for a file named docker-compose.yml in the current directory.\
    \ An alternate file can be specified with the -f option. The file is formatted\
    \ in YAML so it can be edited in any text editor.\n\nLet's start with a very simple\
    \ compose file that starts a single nginx container that listens on port 80. This\
    \ is an analogous container started with docker run -p 80:80 nginx. The value\
    \ for image can be any image on your server or on the registry just like in the\
    \ docker run command:\n\n```\nversion: '2',\nservices:\n  web:\n    image: nginx\n\
    \    ports:\n      - \"80:80\"\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Applications defined in Docker Compose files are started using the command
    `docker-compose up`. Like `docker run`, you can use the `-d` option of `docker-compose`
    to start your application in the background:


    ```

    $ docker-compose up -d

    Starting singleservice_web_1

    ```


    The application has been started and is now running in the background. If you
    opened http://localhost in your web browser, you would see the Nginx welcome page.
    You can use `docker ps` to see the running container, but `docker-compose ps`
    provides a little bit of a nicer view:


    ```

    $ docker-compose ps

    Name Command State Ports

    ---------------------------------------------

    singleservice_web_1 nginx -g daemon off; Up 443/tcp,

    0.0.0.0:80->80/tcp

    ```


    The `singleservice` prefix is the namespace for the application. By default, it
    is based on the directory name that contains your `docker-compose.yml` file. It
    may be different on your system. A namespace can be specified by passing the `-p`
    flag to `docker-compose`:


    ```

    $ docker-compose -p mynamespace up

    ```


    When you are done, the application can be stopped by running `docker-compose stop`.
    To stop, as well as remove all resources created by `docker-compose` for the current
    context, use `docker-compose down`. Any volumes created in `docker-compose.yml`
    will not be removed:


    ```

    $ docker-compose down

    Stopping singleservice_web_1 ... done

    Removing singleservice_web_1 ... done

    Removing network singleservice_default

    ```


    It''s often useful to see the output from the containers in your application.
    This can be done with the `docker-compose logs` command. Adding the `-f` flag
    will cause `docker-compose` to `follow` the log and print messages and they appear
    in the log.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# Multi-container applications\n\nThe example in the previous section was fun\
    \ but did not really gain us anything over using the docker command. Most Internet\
    \ applications have multiple pieces. The most common example is a web application\
    \ that loads data from a database.\n\nIn ch02/web-db of the docker-orchestration-examples\
    \ repository there is a very simple application that loads a list of authors and\
    \ books from MySQL and displays them on a web page. Here 's a docker-compose.yml\
    \ that defines the application:\n\n```\nversion: '2'\n\nservices:\n    web:\n\
    \        image: web-db:0.1\n        build: .\n        ports:\n            - 80:5000\n\
    \        env_file:\n            - db.env\n        entrypoint: ./start.pl --init\
    \ --command shotgun\n    db:\n        image: mysql:5.7\n        env_file:\n  \
    \          - db.env\n```\n\nThe first thing that you should notice is that there\
    \ are two services defined. The first, web, is the web application. The second,\
    \ db, is a MySQL container. Let's look at them one at a time.\n\nThe build key\
    \ tells docker-compose that this service will be built from a Dockerfile in the\
    \ same directory as docker-compose.yml. It is possible to define a subdirectory\
    \ here such as build: ./myapp. This is common if you have multiple custom images\
    \ to build to support your application.\n\nThe name of the image to build is set\
    \ with the image key. This is the same thing that you would pass to the -t flag\
    \ of docker build. Once the image is built, you will see that name listed in docker\
    \ images. You can run the container separately with docker run or push it into\
    \ a registry.\n\n> Older versions of the docker-compose.yml specification did\
    \ not allow you to use both build and image in the same service."
  merge: -1
  img_proc: true
- pgno: 49
  md: "The ports key is the same as the -p flag to docker run. In this case, docker-compose\
    \ will forward port 80 to 5000 in the container. The ports key takes a list so\
    \ you can specify multiple ports to forward, if desired. Following is an example\
    \ that forwards ports 80 and 443 on the host to ports 5000 and 5001 in the container,\
    \ respectively:\n\n```\nports:\n  - 80:5000\n  - 443:5001\n```\n\nLet's skip over\
    \ the env_file key for the moment and go to the entrypoint key. The entrypoint\
    \ key allows you to override entrypoint defined in the image's Dockerfile. It\
    \ is the same as using --entrypoint with docker run. I will explain why you might\
    \ want to set that later in the chapter.\n\nThe db service starts MySQL. Like\
    \ the web service, the image option defines the image to use. In this case, however,\
    \ rather than build one from a Dockerfile, docker-compose will download the official\
    \ mysql image from the Docker Hub.\n\nThe astute reader may notice something else\
    \ about the db service. There are no ports set. Services within a single docker-compose\
    \ namespace can connect to the ports the other containers define with the EXPOSE\
    \ command in their Dockerfile. There is no need to make the ports available to\
    \ other people or containers. Even better, docker-compose provides name resolution\
    \ for every container in the cluster so that they can find each other. In this\
    \ case, the web application can connect to MySQL using the name of the service\
    \ - db. Networking will be discussed in more detail a little later in this chapter.\n\
    \n# Using environment files\n\nNow let's turn to that mysterious env_file option.\
    \ The env_file option allows you to supply one or more environment files. These\
    \ files set environment variables which will be passed to the services when they\
    \ start. This is the same as setting environment variables using the -e flag to\
    \ docker run. The same file can be passed to the --env-file option to docker run.\
    \ The mysql image uses environment variables to configure the name of a database\
    \ to create if one does not exist, the root password, an application username\
    \ and password, and many other things. This particular env_file contains MySQL\
    \ user information:\n\n```\nMYSQL_DATABASE=db\nMYSQL_USER=myapp\nMYSQL_PASSWORD=password\n\
    MYSQL_ROOT_PASSWORD=root-password\n```"
  merge: -1
  img_proc: true
- pgno: 50
  md: "Putting that information in an env_file lets you pass those same variables\
    \ to the web application. The ./start.pl script defined in the web service's entrypoint\
    \ reads those environment variables and writes a configuration file for the application.\n\
    \nHaving that information in the environment variables rather than in the web\
    \ image itself makes it easier to update your running services in the event of\
    \ a password change. All you need to do is update the environment file and restart\
    \ any containers using it. This will save a lot of time over updating the image\
    \ configuration, rebuilding, and re-deploying the image to all of the Docker hosts\
    \ in the cluster.\n\nThe other major use case for environment files is to have\
    \ different settings for development and production. For example, in an application\
    \ like the preceding one, you could have one file that defines account credentials\
    \ for a development database and one for production.\n\nOne other thing to note\
    \ is that env_file takes a list. You can specify as many different files as you\
    \ might need. For example, you might have a set of common environment variables\
    \ and another set which is specific to this application. In this situation, your\
    \ env_file might look something like the following example. Variables in later\
    \ files override those set in the earlier ones:\n\n```\nenv_file:\n  - common.env\n\
    \  - myapp.env\n```\n\n# Extending compose files\n\nWe have already talked about\
    \ using environment files to change your application's behavior. Another way that\
    \ you can do that is to use multiple Docker Compose files. Each file builds on\
    \ the previous one, extending it and possibly overriding options. This can give\
    \ you great flexibility in developing your application or adjusting it to fit\
    \ different environments. This can be done in one of the following two ways:\n\
    \n+   The first way is to put your overrides in a file named docker-compose.override.yml.\
    \ This file is read automatically by docker-compose. The options in docker-compose.yml\
    \ are applied first and then the options in docker-compose.override.yml are applied.\n\
    \n+   The second option is to use the -f flag to docker-compose. You may include\
    \ as many compose files as you want. They will be applied in order from left to\
    \ right. For example, in the docker-compose -f docker-compose.yml -f docker-compose-prod.yml\
    \ command, docker-compose.yml is read first then docker-compose-prod.yml."
  merge: -1
  img_proc: true
- pgno: 51
  md: "Let's go back to the sample web application. The default `docker-compose.yml`\
    \ defined an `entrypoint` for the `web` service which uses the Shotgun loader\
    \ for Plack. That is a great tool for debugging but it is slow because it recompiles\
    \ the application on every page load. To put this into production, something that\
    \ has better performance is needed. Instead, let's use the preforking loader,\
    \ Starman.\n\nHere is the relevant portion of the `docker-compose.yml` file:\n\
    \n```\nservices:\n  web:\n    image: web-db\n    build: .\n    ports:\n      -\
    \ 80:5000\n    env_file:\n      - db.env\n    entrypoint: ./start.pl --init --command\
    \ shotgun\n```\n\nNow create a file named `docker-compose-prod.yml` that overrides\
    \ `entrypoint`:\n\n```\nversion: '2'\n\nservices:\n  web:\n    entrypoint: ./start.pl\
    \ --init --command starman\n```\n\nStart the application with `docker-compose`:\n\
    \n```\n$ docker-compose -f docker-compose.yml -f docker-compose-prod.yml up\n\
    ```\n\nWhen it starts up, you should see this message in the logs:\n\n```\nweb_1\
    \ | Command: starman\nweb_1 | Waiting 60 seconds for mysql\nweb_1 | Initializing\
    \ database\nweb_1 | Starting the app\nweb_1 | 2016/09/08-13:11:35 Starman::Server\
    \ (type Net::Server::PreFork)\nstarting! pid(1)\nweb_1 | Resolved [*]:5000 to\
    \ [0.0.0.0]:5000, IPv4\nweb_1 | Binding to TCP port 5000 on host 0.0.0.0 with\
    \ IPv4\nweb_1 | Setting gid to \"0 0\"\n```\n\nIf you stop the application and\
    \ run it again without the `docker-compose-prod.yml` file, you should see it go\
    \ back to using Shotgun:\n\n```\nweb_1 | Command: shotgun\nweb_1 | Waiting 60\
    \ seconds for mysql\nweb_1 | Initializing database\n```"
  merge: -1
