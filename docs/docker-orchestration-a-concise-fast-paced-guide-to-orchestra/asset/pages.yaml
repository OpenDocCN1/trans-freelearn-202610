- pgno: 74
  md: '# Publishing services with mesh routing mode


    Docker overlay networks support another useful feature called **mesh routing**.
    This is enabled automatically when the `--publish` or `-p` option is used upon
    service creation. The router will forward a request to any host in the cluster
    to the container or service listening on the requested port even if the service
    is not running on the host that received the request. In the preceding example,
    a service called `nginx` was started, and it used the `-p` flag to send port 80
    on the hosts to port 80 in the containers. A request to port 80 on any of the
    Docker hosts will result in one of the two `nginx` containers answering the request.


    Mesh routing load balances the requests across all the containers in the service.
    You could set up a round robin DNS entry for a hostname such as `www.example.com`
    that has the addresses of your hosts, or an external load balancer that points
    to the addresses of Docker hosts in your swarm. Doing the latter would allow you
    to keep your Docker nodes on private addresses.


    The drawback to mesh routing in Docker Swarm, that published ports must be unique
    across the cluster. In other words, you cannot have services `web1` and `web2`
    that both try to publish on port 80. One would have to be on a different port.


    # Using Weave


    Weave Net was developed by Weaveworks to provide a resilient and secure overlay
    network for Docker. Weave nodes form a mesh which allows traffic in the cluster
    to keep flowing even if a node goes down. The mesh can be encrypted to keep the
    data flowing across it securely. A Weave mesh can even spread between cloud providers
    connecting containers running on Amazon EC2, Microsoft Azure, or even locally
    in Docker Datacenter. Weave also supports DNS-SD allowing your containers to talk
    to each other by name, even on different hosts.


    > Full documentation on Weave Net is available at: `https://www.weave.works/docs/net/latest/using-weave/`.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Installing Weave


    Step one is to install the `weave` tool to your desktop or other management system.
    The `weave` tool is just a shell script. The real guts of weave run in Docker
    containers. The script should also be installed directly on the Docker nodes themselves:


    ```

    $ wget -O weave git.io/weave

    $ chmod +x weave; cp weave /usr/local/bin/

    ```


    The following examples assume a three node cluster with nodes names `swarm-master`,
    `swarm-host1`, and `swarm-host2`. The nodes can be created with Docker Machine
    as described in *Chapter 1, Getting Started with Docker Orchestration*. Any number
    of hosts can be added to the cluster. The greater the mesh, the more resilient
    it will be in the event of node failures.


    The next step is to initialize Weave. Start by using Docker Machine to switch
    to the first server. The `consensus` flag tells Weave that there will be initially
    three servers. More can be added later:


    ```

    $ eval $(docker-machine env swarm-master)

    $ weave launch --ipalloc-init consensus=3

    ```


    This will download and start three containers on `swarm-master`. Add the `--password`
    flag to `weave launch` if you want to encrypt your mesh. The password must be
    the same on every node that connects:


    ```

    $ weave launch --password XXXX ...

    ```


    You can verify that they are running with `docker ps`:


    ```

    $ docker ps

    CONTAINER ID        IMAGE                               COMMAND                   NAMES

    CREATED             STATUS    PORTS

    b645e00cde8d        weaveworks/plugin:1.6.1         "/home/weave/plugin"      weaveplugin

    42 seconds ago      Up 41 seconds


    e0bc711a0972        weaveworks/weaveexec:1.6.1        "/home/weave/weavepro"    weaveproxy

    44 seconds ago      Up 43 seconds


    89897514f42d        weaveworks/weave:1.6.1            "/home/weave/weave --"    weave

    45 seconds ago      Up 44 seconds

    ```


    Next, install Weave on the second host and connect it to the first:


    ```

    $ eval $(docker-machine env swarm-host1)

    $ weave launch --ipalloc-init consensus=3

    $ weave connect 10.128.0.2

    ```'
  merge: -1
  img_proc: true
- pgno: 76
