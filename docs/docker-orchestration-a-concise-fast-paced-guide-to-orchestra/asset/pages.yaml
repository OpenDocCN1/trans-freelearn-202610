- pgno: 70
  md: 'Like so many things in the world of Docker, a new registry is just a `docker
    run` away:


    ```

    ```

    $ docker run -d -p 5000:5000 --name registry registry:2

    ```

    ```


    This command will start up a new `registry` container and is ready to use with
    a few caveats. First, the image data is stored in the container. Removing the
    container will also remove all of your images. The simplest solution is to use
    a volume to mount a directory from the local filesystem to `/var/lib/registry`.
    For greater flexibility, you will want to consider using shared storage rather
    than a local directory:


    ```

    ```

    $ docker run -d -p 5000:5000 -v /data/registry:/var/lib/registry --name registry
    registry:2

    ```

    ```


    Second, this will only work with the `docker` command on the localhost unless
    Docker is configured to use an insecure registry. That is because `docker` requires
    a valid certificate for a TLS connection to the registry. You can mount a directory
    containing the certificates in the container and specify environment variables
    to tell the registry where to read the certificates from:


    ```

    ```

    $ docker run -d -p 5000:5000 \

    -v /data/registry:/var/lib/registry \

    -v /data/certs:/etc/certs \

    -e REGISTRY_HTTP_TLS_CERTIFICATE=/etc/certs/registry.pem \

    -e REGISTRY_HTTP_TLS_KEY=/etc/certs/registry.key \

    --name registry registry:2

    ```

    ```


    The same warning about certificates in GitLab applies here as well. If your certificate
    is signed by an intermediate certificate, the complete certificate chain must
    be included in the certificate file.


    Docker Registry supports basic authentication natively. If you want to do something
    more complex, you will need to run a proxy in front of your registry or use a
    token server. The proxy is simpler but a token server will give you the flexibility
    to control access to a minute level. Full details as well as proxy examples and
    a Docker Compose file to run a registry are available at https://github.com/docker/docker.github.io/blob/master/registry/deploying.md.'
  merge: -1
