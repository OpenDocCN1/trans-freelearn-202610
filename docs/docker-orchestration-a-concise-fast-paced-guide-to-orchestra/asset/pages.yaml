    # Using Flannel


    Flannel is an overlay network developed by CoreOS. It uses `etcd` as a data store
    and for network synchronization. Flannel lacks some of the features that Docker
    overlay and Weave support. There is no option for encryption or DNS-SD. It is,
    however, very simple to use once it is configured.


    # Configuring etcd and Flannel


    CoreOS is configured through `cloud-config`. A `cloud-config` file is a YAML file
    that is passed to the host through the user data option. The file must start with
    `#cloud-config` for CoreOS to recognize it.


    Before you begin, a new token must be generated for `etcd`. The `size` parameter
    is the initial size of your cluster. You will be able to add and remove nodes
    later:


    ```

    $ wget -qO - ''https://discovery.etcd.io/new?size=3''

    https://discovery.etcd.io/c37921aac12231bf487a3ed82c464a4f

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'The discovery URL can take additional options. For full details, see https://coreos.com/etcd/docs/latest/clustering.html.


    The generated token will be used in the coreos > etcd2 > discovery option in the
    cloud-config file. You will need to use the same token for every host in the cluster.
    A new token must be generated for each cluster:


    ```

    #cloud-config


    coreos:

    etcd2:

    discovery: https://discovery.etcd.io/<token>

    advertise-client-urls:

    http://$private_ipv4:2379,http://$private_ipv4:4001

    initial-advertise-peer-urls: http://$private_ipv4:2380

    listen-client-urls:

    http://0.0.0.0:2379,http://0.0.0.0:4001

    listen-peer-urls: http://$private_ipv4:2380

    flannel:

    public_ip: $private_ipv4

    etcd_endpoints: http://$private_ipv4:2379

    fleet:

    public_ip: $private_ipv4

    units:

    - name: etcd2.service

    command: start

    - name: fleet.service

    command: start

    - name: flanneld.service

    command: start

    drop-ins:

    - name: 50-networking-config.conf

    content: |

    [Service]

    ExecStartPre=/usr/bin/etcdctl set

    /coreos.com/network

    config ''{"Network":"10.42.0.0/16"}''

    - name: docker.service

    command: start

    drop-ins:

    - name: 40-flannel.conf

    content: |

    [Unit]

    Requires=flanneld.service

    After=flanneld.service

    ```'
  merge: -1
