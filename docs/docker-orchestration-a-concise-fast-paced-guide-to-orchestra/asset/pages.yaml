- pgno: 140
  md: "```\nNodePort:           https 30763/TCP\nEndpoints:         10.0.2.3:443\n\
    Session Affinity:  None\nNo events.\n```\n\n# Introducing DNS-SD\n\nKubernetes\
    \ ships with an add-on called kube-dns which provides DNS-SD. In recent versions\
    \ of Kubernetes, this is enabled by default. Names are assigned to services. It\
    \ is expected that if pods need to talk to each other, they will do it through\
    \ a service.\n\nGenerated hostnames are in the `service_name.namespace.svc.cluster.local`\
    \ form, where `service_name` is the name of the service and `namespace` is the\
    \ namespace the service is running in. For example, a service named `wordpress`\
    \ in the `prod` namespace would have an A record that is `wordpress.prod.svc.cluster.local`.\n\
    \n# Using volumes\n\nLike plain Docker, Kubernetes supports volumes. The main\
    \ difference is that Kubernetes supports them at the pod level. This means that\
    \ a volume configured in a pod is available and may be used by every container\
    \ in the pod for reading and writing. Second, Kubernetes volumes may use multiple\
    \ different types of network storage at the same time.\n\nVolumes come in two\
    \ forms, the first is an **ephemeral volume** that lives only as long as the pod\
    \ using it. When the pod is deleted, so is the volume. The second is a **persistent\
    \ volume** that persists data even when a pod is deleted.\n\n# Using plain volumes\n\
    \nVolumes in Kubernetes behave a lot like volumes do in plain Docker. They are\
    \ only expected to live as long as the pods using them. Every container in the\
    \ pod may mount the volume and they may mount in the same or different locations.\
    \ The only restriction is that volumes cannot be mounted on filesystems that are\
    \ mounted from other volumes. In other words, volumes may not nest:\n\n```\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: web\nspec:\n```"
  merge: -1
  img_proc: true
- pgno: 141
  md: "```\n```yaml\nvolumes:\n  - name: test\n    gcePersistentDisk:\n      pdName:\
    \ test-pd\n      fsType: ext4\n  containers:\n    - name: nginx\n      image:\
    \ nginx\n      volumeMounts:\n        - mountPath: /mnt\n          name: test\n\
    ```\n```\n\nThis is a simple pod that uses a GCE persistent disk named test-pd.\
    \ Volumes are defined in the volumes section. As many volumes as may be needed\
    \ can be defined there. The nginx container mounts the volume in /mnt. The name\
    \ in volumeMounts must match the name in volumes.\n\nThe options for the volume\
    \ will vary depending on the type of disk. Note that many types of networked storage\
    \ must exist before it can be used as a volume. For more details, refer to http://kubernetes.io/docs/user-guide/volumes/.\n\
    \n# # Storing long-lived data in persistent volumes\n\nPersistent volumes are,\
    \ as one might expect, persistent. They are designed to persist after a pod is\
    \ deleted and to be used again by another pod. Typically, databases and similar\
    \ systems use persistent volumes to store their data. Whenever the pod is restarted\
    \ for any reason, such as after an update, the data is there waiting for it.\n\
    \nPersistent volumes happen in two parts. The first is the PersistentVolume object,\
    \ which stores the connection details for physical storage that is being used.\
    \ The second is a PersistentVolumeClaim, which tells Kubernetes that at some point,\
    \ something is going to want to use that storage. A pod with a claim basically\
    \ has permission to use that piece of storage.\n\nYou can think of it like a ticket\
    \ to a theater. The PersistentVolume object is a seat in the theater. The PersistentVolumeClaim\
    \ object is the ticket that allows one to enter the theater and sit in the seat.\n\
    \nPersistent volumes also allow some measure of abstraction of the volume from\
    \ a pod. The PersistentVolume object stores all the details for accessing the\
    \ physical storage. The pod does not have to care about it. It simply uses a PersistentVolumeClaim\
    \ object to access the storage."
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Creating a PersistentVolume\n\nLet's start by creating a `PersistentVolume`\
    \ object. This uses the same GCE persistent disk as the preceding volume example:\n\
    \n```\napiVersion: v1\nkind: PersistentVolume\nmetadata:\n  name: test-pd\n  labels:\n\
    \    name: test-pd\nspec:\n  capacity:\n    storage: 10Gi\n  accessModes:\n  \
    \  - ReadWriteOnce\n  persistentVolumeReclaimPolicy: Retain\n  gcePersistentDisk:\n\
    \    pdName: test-pd\n    fsType: ext4\n```\n\nThe interesting things that happen\
    \ in the `spec` section are as follows:\n\n+   • If one pod claims write access\
    \ on a persistent volume that already has a write claim, the second claim will\
    \ be denied. A claim will also be denied if it tries to get write access on a\
    \ volume that is only allowing read-only access.\n\n+   • Next, `accessModes`\
    \ determine what sort of access pods are allowed to claim. To continue the theater\
    \ analogy, it is like saying that a pod can get a ticket on the main floor or\
    \ in the balcony. There are three modes that can be set:\n+     • ReadWriteOnce:\
    \ Only a single node may mount this storage read-write\n+     • ReadOnlyMany:\
    \ Many nodes may mount this storage for read-only access\n+     • ReadWriteMany:\
    \ Many nodes may mount this storage for read-write access\n\n+   • First, the\
    \ storage capacity is defined; in this case 10 GiB. It is possible to create multiple\
    \ storage chunks of varying sizes ahead of time and let a pod claim the size that\
    \ it needs."
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   - Third is `persistentVolumeReclaimPolicy`. This setting determines what
    will be done with the volume when the claim is released. There are three possible
    values. Note that not every storage type supports every reclaim policy:

    +     - Retain: Nothing is done with the volume. It is up to the cluster administrator
    to remove the volume if it is no longer needed.

    +     - Recycle: The physical storage remains, but Kubernetes attempts an `rm
    -rf *` on the volume before making it available again.

    +     - Delete: The volume will be deleted when the claim is released.


    The last field configures the storage. In this case, a GCE persistent disk named
    `test-pd`. This will vary depending on the storage that is being used.


    # Creating the PersistentVolumeClaim resource


    Before any pod can use a `PersistentVolume` resource, a `PersistentVolumeClaim`
    resource must be created:


    ```

    apiVersion: v1

    kind: PersistentVolumeClaim

    metadata:

    name: test-pd-pvc

    spec:

    accessModes:

    - ReadWriteOnce

    resources:

    requests:

    storage: 10Gi

    selector:

    matchLabels:

    name: test-pd

    ```


    This example creates a claim named `test-pd-pvc`. The `accessModes` specification
    tells Kubernetes that this claim is for write access for only this pod. The `resources`
    section means that this claim is looking for a volume that is at least 10 GiB.
    The volume that is actually mapped to this claim may be bigger but it will not
    be smaller. Finally, `selector` matches the labels on `PersistentVolume`. In this
    case, claim is looking for a persistent volume with a name label that is `test-pd`.'
  merge: -1
  img_proc: true
- pgno: 144
  md: "It is possible for a claim to match multiple volumes. If that is the case,\
    \ the volume that Kubernetes determines is the closest match provided. If you\
    \ are trying to connect to a specific volume, use a unique label on the persistent\
    \ volume that the claim can match.\n\n# Using a PersistentVolumeClaim as a volume\n\
    \nWhen a pod wants to use a persistent volume, a claim is listed in the volumes\
    \ section of the pod specification. Following is the nginx pod from before. This\
    \ time, it is using PersistentVolumeClaim to access the volume:\n\n```\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: web-pvc\nspec:\n  volumes:\n    - name: test-pd\n\
    \      persistentVolumeClaim:\n        claimName: test-pd-pvc\n  containers:\n\
    \    - name: nginx\n      image: nginx:1.11\n      volumeMounts:\n        - mountPath:\
    \ /mnt\n          name: test-pd\n```\n\nThe volume type is a persistentVolumeClaim.\
    \ The claimName attribute must match the PersistentVolumeClaim created earlier.\
    \ Like the plain volume before, the volume name in the pod, test-pd in this case,\
    \ is used in the container definition to mount the storage in the container.\n\
    \n![](img/02bead9c8ff4515f78dac0eb33163961_144_0.png)\n\n> There are number of\
    \ other things that can be done with PersistentVolumes including dynamic provisioning\
    \ of volumes for pods. For more details, refer to: http://kubernetes.io/docs/user-guide/persistent-volumes/."
  merge: -1
  img_proc: true
- pgno: 145
  md: '# # Further reading


    As long as this chapter is, it has only scratched the surface of what Kubernetes
    can do. The following is a list of a few features that were not covered:


    +   - **Ingress resources**: The Ingress resource is a new load balancer abstraction
    that works with services. It provides more granular routing for web applications
    including host-based and path-based routing. Refer to http://kubernetes.io/docs/user-guide/ingress/.


    +   - **Kubernetes Dashboard**: Kubernetes ships with the kube-ui add-on which
    provides a dashboard for viewing the cluster and quickly creating new pods and
    other resources. Refer to http://kubernetes.io/docs/user-guide/ui/.


    +   - **Pod resource limits**: It is possible to set per-pod and per-container
    CPU and memory limits at the namespace level. Refer to http://kubernetes.io/docs/admin/limitrange/.


    +   - **Quotas**: Quotas can be applied at a project level to ensure that the
    total number of pods or the amount of resources are not exceeded. Refer to http://kubernetes.io/docs/admin/resourcequota/.


    +   - **Batch jobs**: Jobs are a resource type that is expected to run and terminate.
    Multiple jobs can be run in parallel. Refer to http://kubernetes.io/docs/user-guide/jobs/.


    +   - **Health checks**: Kubernetes has the capability of running health checks
    against a container to verify that it is running properly. Refer to http://kubernetes.io/docs/user-guide/liveness/.


    # # Summary


    In this chapter, you saw how to install Kubernetes and create resources. You saw
    how to create pods and how to use them with deployments for replication and updates.
    Network features such as DNS-SD and services were discussed and it was shown how
    to create load balancers to make services available to the Internet. Finally,
    volumes were discussed and you saw how to use PersistentVolume to make data available
    across pods. The next chapter will examine how to use Apache Mesosphere as a Docker
    orchestration platform.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Working with Mesosphere


    Apache Mesos is a distributed kernel. It allows one to work on a cluster of servers
    as if they were a single resource. Mesosphere and DC/OS build on this to provide
    a robust system for running any workload, including Docker containers. Native
    support for distributed workloads such as Cassandra and Jenkins, as well as Docker,
    make for a powerful combination.


    Microsoft''s Azure Container Service (ACS) is based around DC/OS. In March 2016,
    Mesosphere open sourced DC/OS, making it easier than ever to get started.


    This chapter will look at using Mesosphere, to manage and deploy Docker-based
    applications. It will cover deploying, scaling, and upgrading new applications.
    It will also show how to use the built-in overlay with the load balancing features
    of Marathon. Finally, the chapter will cover the use of volumes to persist data
    and how to use a private registry.


    This chapter will cover the following topics:


    +   * Installing Mesos and DC/OS

    +   * Managing containers and applications

    +   * Scaling applications

    +   * Using health checks

    +   * Scaling applications

    +   * Updating applications with zero downtime upgrades

    +   * Connecting to the Mesos overlay network

    +   * Using virtual IPs and the Marathon load balancer

    +   * Using local and external volumes

    +   * Using a private registry'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Getting started with DC/OS


    Installing DC/OS is a complicated process to be covered here, and the instructions
    differ for each environment. Be sure to read through the documentation before
    you start this process. There are features, such as the number of masters or external
    persistent storage that must be enabled at install time and cannot be changed
    later without reinstalling. Installation instructions are available at https://dcos.io/docs/1.8/administration/installing/.


    The easiest way to get Mesosphere up and running is to use the stack install on
    AWS or use ACS which runs Mesosphere.


    There are a few things to be aware of if you are installing manually or on local
    hardware:


    +   - Nodes must have at least two cores or virtual processors.

    +   - DC/OS nodes must be running CoreOS 7, RHEL 7, or CoreOS.

    +   - All nodes in the cluster must have NTP enabled. NTP servers are set in /etc/systemd/timesyncd.conf.
    After the NTP servers have been set, run systemctl, enable systemd-timedated.service
    and systemctl, and start systemd-timedated.service to enable and start the systemd
    internal NTP client. Following is a sample timesyncd.conf for use on GCE:


    ```

    [Time]

    NTP=time1.google.com time2.google.com

    time3.google.com time4.google.com

    FallbackNTP=0.pool.ntp.org 1.pool.ntp.org

    0.fr.pool.ntp.org

    ```'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Logging into the web interface


    After DC/OS is installed, it will be possible to log in using the web interface.
    Mesosphere uses OAuth for authentication with Google, GitHub, or Microsoft accounts.
    After you have logged in, you will be directed to the Mesosphere **Dashboard**.
    From there you can start managing applications or install the command-line client,
    `dcos`:


    ![](img/02bead9c8ff4515f78dac0eb33163961_148_0.png)'
