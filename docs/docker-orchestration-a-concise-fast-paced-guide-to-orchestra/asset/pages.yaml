    # ## Stopping services


    All good things come to an end and this includes services running in a swarm.
    When a service is no longer needed, it can be removed with `docker service rm`.
    When a service is removed, all tasks associated with that service are stopped
    and the containers removed from the nodes they were running on. The following
    example removes a service named `web`:


    ```

    $ docker service rm web

    ```


    Docker makes the assumption that the only time services are stopped is when they
    are no longer needed. Because of this, there is no Docker service analog to the
    `docker stop` command. This might not be an issue since services are so easily
    recreated. That said, I have run into situations where I have needed to stop a
    service for a short time for testing and did not have the command at my fingertips
    to recreate it.


    The solution is very easy but not necessarily obvious. Rather than stopping the
    service and recreating it, set the number of replicas to zero. This will stop
    all running tasks and they will be ready to start up again when needed:


    ```

    $ docker service update --replicas 0 web

    web

    ```


    ```

    $ docker service ls


    ID NAME REPLICAS IMAGE COMMAND

    5gdgmb7afupd web 0/0 nginx

    ```'
  merge: -1
  img_proc: true
- pgno: 103
