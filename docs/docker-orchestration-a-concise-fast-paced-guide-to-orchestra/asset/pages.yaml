    ```\n\n```\nvolumes:\n  dbvol:\n    driver: \"driver-name\"\n    driver_opts:\n\
    \      - opt1: \"foo\"\n      - opt2: \"bar\"\n```\n\nIn this example, there is\
    \ a volume defined, named `dbvol`. The `driver` key tells Docker which driver\
    \ to use. Any options needed for the driver are set with the `driver_opts` key.\n\
    \nTo use the volume in one of your services, use the `volumes` option as before.\
    \ This time, the first part is the volume name rather than a local path, in this\
    \ case `dbvol`. The second part is still the path within the container to mount\
    \ the volume.\n\n> Docker's pluggable architecture has allowed for an explosion\
    \ of plugins supporting a wide variety of storage systems. Among those available\
    \ are Azure File Storage, Ceph, Gluster, and VMware vSphere. Your favorite search\
