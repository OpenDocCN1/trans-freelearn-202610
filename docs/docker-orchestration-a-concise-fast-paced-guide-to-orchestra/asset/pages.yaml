    These are all the stopped nginx containers. The docker rm command will remove
    the containers:


    ```

    $ for i in {1..4}; do docker rm nginx$i ; done

    nginx1

    nginx2

    nginx3

    nginx4

    ```


    Until a container is removed, all the data is still available. You can restart
    the container and it will chug along quite happily with whatever data existed
    when the container was stopped. Once the container is removed, all the data within
    that container is removed right along with it. In many cases, you might not care
    but, in others, that data might be important. How you deal with that data will
    be an important part of planning out your orchestration system. In Chapter 3,
    Cluster Building Blocks – Registry, Overlay Networks, and Shared Storage, I will
    show you how you can move your data into shared storage to keep it safe.


    # Inspecting your container


    There comes a time in the life of anyone working with containers when you will
    need to jump into a running container and see what is going on. Fortunately, Docker
    has just the tool for you in the form of docker exec. The exec subcommand takes
    two arguments, the name of the container, and the command to run:


    ```

    $ docker exec -it nginx bash

    ```


    I slipped an option in there that is important if you are starting an interactive
    process. The –it option tells Docker that you have an interactive process and
    that you want a new TTY. This is essential if you want to start a shell:


    ```

    $ sudo docker exec -it nginx bash

    root@fd8533fa2eda:/# ps ax

    PID TTY          STAT TIME COMMAND

    1 ?        Ss     0:00 nginx: master process nginx -g daemon off;

    ```'
  merge: -1
  img_proc: true
