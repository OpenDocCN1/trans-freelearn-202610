- pgno: 167
  md: "```\n```\n\"network\" : \"USER\"\n},\n\"volumes\" : [\n{\n    \"containerPath\"\
    \ : \"website\",\n    \"mode\" : \"RW\",\n    \"persistent\" : {\n        \"size\"\
    \ : 20\n    }\n},\n{\n    \"containerPath\" : \"/var/lib/www\",\n    \"mode\"\
    \ : \"RW\",\n    \"hostPath\" : \"website\"\n}\n],\n\"ipAddress\" : {\n    \"\
    networkName\" : \"dcos\"\n},\n\"residency\" : {\n    \"taskLostBehavior\" : \"\
    WAIT_FOREVER\"\n}\n}\n```\n```\n\nThis example extends the previous one to mount\
    \ the `website` volume in `/var/lib/www`.\nThe second volume uses `hostPath`,\
    \ which matches `containerPath` of the persistent\nvolume. Since `hostPath` is\
    \ being used, `containerPath` can point to any location in the\ncontainer's file\
    \ system. The data stored on the volume is available in both\n`/mnt/mesos/sandbox/website`\
    \ and `/var/lib/www`.\n\n# # Using external volumes\n\nThe biggest failing with\
    \ local persistent volumes is that the data is stuck on a single node. If\nthat\
    \ node fails, the data is no longer accessible. External volumes allow an application\
    \ to\nstore data off the node where the application is run. An application can\
    \ be started anywhere\nin the cluster and still access its data.\n\nMesosphere\
    \ uses REX-Ray to manage access to external storage. REX-Ray supports Amazon\n\
    EC2, GCE, OpenStack, and more. A complete list of supported storage drivers is\
    \ available at\n`https://rexray.readthedocs.io/en/v0.3.3/user-guide/storage-providers/`."
  merge: -1
  img_proc: true
- pgno: 168
  md: "External storage must be enabled when Mesosphere is installed. The configuration\
    \ is enabled in `genconf/config.yaml` in the installation package. The specifics\
    \ will depend on the driver used. Following is an example for GCE:\n\n```\nrexray_config:\n\
    \  rexray:\n    loglevel: info\n    modules:\n      default-admin:\n        host:\
    \ tcp://127.0.0.1:61003\n    storageDrivers:\n      - gce\n    gce:\n      keyfile:\
    \ /path/to/gce-auth.json\n```\n\nMultiple storage drivers can be set in the `storageDrivers`\
    \ section. Each storage driver will have its own section for configuration. In\
    \ the case of GCE, `keyfile` is the JSON formatted credentials from the API portal.\n\
    \nThe following example shows how one would use an external volume. The only option\
    \ for provider is `dvdi` with the `dvdi/driver` option set to `rexray`. The value\
    \ for `name` is the name of the volume from the storage provider. In the following\
    \ example, the `testpd` volume will be loaded from the storage provider:\n\n```\n\
    {\n  \"id\" : \"nginx-volume\",\n  \"instances\" : 1,\n  \"cpus\" : 0.25,\n  \"\
    mem\" : 64.0,\n  \"container\" : {\n    \"type\" : \"DOCKER\",\n    \"docker\"\
    \ : {\n      \"image\": [\"nginx\"],\n      \"network\" : \"USER\"\n    }\n  },\n\
    \  \"volumes\" : [\n    {\n      \"containerPath\" : \"website\",\n      \"mode\"\
    \ : \"RW\",\n      \"external\" : {\n        \"size\" : 200,\n        \"name\"\
    \ : \"testpd\",\n        \"provider\" : \"dvdi\",\n        \"options\" : {\n \
    \         \"dvdi/driver\" : \"rexray\"\n        }\n      }\n    }\n  ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 169
