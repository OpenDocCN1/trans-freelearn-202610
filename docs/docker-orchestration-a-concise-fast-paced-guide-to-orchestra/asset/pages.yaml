    \ an application to use a new image:\n\n```\n{\n  \"id\" : \"nginx\",\n  \"instances\"\
    \ : 1,\n  \"cpus\" : 0.25,\n  \"mem\" : 64.0,\n  \"container\" : {\n    \"type\"\
    \ : \"DOCKER\",\n    \"docker\" : {\n      \"image\" : \"nginx:1.10\",\n     \
    \ \"network\" : \"HOST\"\n    }\n  }\n}\n```\n\nThis is a simple Ngnix application.\n\
    \nNote that the image tag is set to nginx:1.10. It just so happens that 1.11 has\
    \ been released and now it is time to update the application. There are two ways\
    \ to do it."
