    Once again, Marathon will proceed to replace the old tasks with ones running the
    updated image. When the deployment finishes, you can verify that the application
    is running the new image:


    ```

    $ dcos marathon app show nginx | grep image

    "image": "nginx:1.11",

    ```


    # # Setting an upgrade strategy


    An application can define an upgrade strategy to control how application tasks
    are replaced. By default, Marathon will start all of the new tasks before stopping
    the old ones. This can be problematic for two reasons:


    +   - First, the update could corrupt data if the application cannot handle multiple
    tasks writing to the same volume

    +   - Second, you need to have enough capacity to run all of those extra tasks


    To solve this problem, Marathon allows one to set an `upgradeStrategy` for an
    application:


    ```

    "upgradeStrategy": {

    "minimumHealthCapacity": 1

    }

    ```


    The `minimumHealthCapacity` option is a value from zero to one. When set to 1,
    the new instances are started before the old ones have been stopped. When set
    to 0, all of the old instances are stopped before the new ones start. This solves
    the first problem. It also, technically, solves the second, but there could be
    noticeable downtime when the number instances gets too low to serve the clients
    trying to access it.


    To smoothly update the application while minimizing client impact, `minimumHealthCapacity`
    can be set to a fraction between 0 and 1. This value represents a percentage of
    running instances to scale the application down to. For example, if there are
    ten instances and `minimumHealthCapacity` is set to `0.4` (40 percent capacity),
    the application will be scaled down to four instances and six new instances will
    be started. Anything over `0.5` means that additional capacity will be needed
    for the upgrade. If the new instances have no errors, the rest of the old instances
    will be shut down and the new instances will be started to take their place.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Testing updates with blue-green deployments


    The built-in update mechanism is great for automatically deploying a new version
    of the application. In some cases, however, it may be desirable to roll out an
    update more slowly to verify that there is no impact on end users. This is especially
    useful if the updates make significant changes.


    A blue-green deployment slowly replaces the old application, called blue, with
    a new version, called green. In Marathon, this manual process is done by creating
    a new application which uses the updated image. Give the new application a title
    that makes it obvious that it is the new one.


    The green application is started with a small number of tasks; often just one.
    Once the health checks show that everything is ready, the green application is
    added to the load balancer for the service. Assuming there are a larger number
    of the old, blue tasks running, most of the requests will go there. A small number,
    however, will be sent to the green application.


    Once requests start going to the green application, one can watch for errors or
    other issues that might require a rollback. As tests pass, the green application
    can be scaled up and the blue application can be scaled down. This is a manual
    process that can take as much or as little time as needed. It is not unusual to
    wait hours or days before choosing to scale up the green application. If anything
    goes wrong, the green application can be scaled back down or removed from the
    load balancer completely.


    When you are satisfied that the green application is fully ready for production,
    the green application can be scaled up to the desired number of tasks and the
    blue application can be scaled to zero and removed from the load balancer. At
    that point, the application is fully upgraded. The blue application can be removed
    from the system once it is clear that it will no longer be needed for rollback.


    More information on blue-green deployments and how they may be scripted is available
    at https://mesosphere.github.io/marathon/docs/blue-green-deploy.htm 1.


    # Introducing pods


    With the 1.9 release, DC/OS introduces pods. Pods in DC/OS and Marathon are very
    similar to those found in Kubernetes. They allow multiple containers to be grouped
    together into a single object. All of the containers can share volumes and communicate
    with each other over localhost.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "# Using network services and load balancing\n\nMesosphere provides a number\
    \ of networking services that make orchestration easier.\nThese services provide\
    \ service discovery and load balancing for running applications.\n\n# Discovering\
    \ services with DNS\n\nEvery service that is created is assigned a hostname in\
    \ Mesos DNS. The entries are\nservice-name.marathon.mesos, where service-name\
    \ is the name of the service in the\nid field. The following snippet is from a\
    \ service with id set to simple-nginx. Mesos DNS\nwould create a record named\
    \ simple-nginx.marathon.mesos:\n\n```\n{\n  \"id\" : \"simple-nginx\",\n  ...\n\
    }\n```\n\nBecause the services are translated directly into DNS hostnames, there\
    \ are a few restrictions,\nas follows:\n\n+   • First, names must only contain\
    \ letters, numbers, and dash (-).\n+   • Second, the names must be shorter than\
    \ 24 characters. Longer names will be\n+   shortened. This can lead to problems\
    \ if two services end up with the same\n+   hostname. Tasks running in one service\
    \ may be returned for the other service.\n\nThe DNS service can also be queried\
    \ over HTTP using REST API. Entries are returned in\nJSON format. The following\
    \ example gets the IP information for the simple-nginx service:\n\n```\n$ curl\
    \ http://master.mesos:8123/v1/hosts/simple-nginx.marathon.mesos\n[\n  {\n    \"\
    host\": \"simple-nginx.marathon.mesos.\",\n    \"ip\": \"10.128.0.4\"\n  }\n]\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Connecting to the overlay network


    So far, the examples have used host networking. DC/OS creates a Docker overlay
    network when it is installed. Connecting applications to the overlay network enables
    the use of load balancing as well as the ability to connect to other services
    across the network:


    ```

    {

    "id" : "nginx-overlay",

    "instances" : 1,

    "cpus" : 0.25,

    "mem" : 64.0,

    "container" : {

    "type" : "DOCKER",

    "docker" : {

    "image" : "nginx",

    "network" : "USER"

    }

    },

    "ipAddress":{

    "networkName":"dcos"

    }

    }

    ```


    The preceding example creates a service named nginx-overlay that connects to an
    overlay network. The network tag is set to USER and the networkName tag is set
    to the name of the overlay network, in this case, dcos.


    # Using virtual IPs


    Marathon can assign a name-based virtual IP to a service. Virtual IPs provide
    layer four load balancing for the services they are attached to. Tasks across
    the cluster can then use the virtual IP to access the service.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'To add a virtual IP, click on the service in the web interface then click on
    the **Edit** button. Go to the **Network** section. Select **Virtual Network**.
    This is the same as connecting the service to an overlay network. Enter **Container
    Port**, **Name**, and **Protocol**, then click on the checkbox next to **Load
    Balanced**. If additional ports are needed, click on the **Add an endpoint** link.
    When you are done, click on **Deploy Changes**:


    ![](img/02bead9c8ff4515f78dac0eb33163961_162_0.png)


    The service will be assigned a name that looks like `service-name.marathon.14lb.thisdcos.discovery`
    where `service-name` is the name of the service. For a service named `nginx`,
    the name is `nginx.marathon.14lb.thisdcos.discovery`. The service can then be
    accessed with the virtual IP anywhere in the cluster:


    ```

    $ curl nginx.marathon.14lb.thisdcos.directory:80

    <!DOCTYPE html>

    <html>

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 163
  md: "# # Using the Marathon load balancer\n\nMarathon provides a second load balancer\
    \ by the name of Marathon-LB. It is a HAProxy-based service that can handle multiple\
    \ services as well as proxy based on the hostname for a web service. Marathon-LB\
    \ is an add-on installed with the DC/OS package manager:\n\n```\n$ dcos package\
    \ install marathon-lb\nWe recommend a minimum of 0.5 CPUs and 256 MB of RAM available\
    \ for the\nMarathon-LB DC/OS Service.\nContinue installing? [yes/no] yes\nInstalling\
    \ Marathon app for package [marathon-lb] version [1.4.1]\nMarathon-lb DC/OS Service\
    \ has been successfully installed!\nSee https://github.com/mesosphere/marathon-lb\
    \ for documentation.\n```\n\nThe `dcos` command will install Marathon-LB. By default,\
    \ the installation is configured to serve external requests. The load balancer\
    \ is visible in DC/OS as a service named marathon-lb.\n\nAdding a new service\
    \ to the load balancer is pretty easy. Following is a service that runs nginx:\n\
    \n```\n{\n  \"id\" : \"nginx-mlb\",\n  \"instances\" : 1,\n  \"cpus\" : 0.25,\n\
    \  \"mem\" : 64.0,\n  \"labels\" : {\n    \"HAPROXY_GROUP\" : \"external\"\n \
    \ },\n  \"container\" : {\n    \"type\" : \"DOCKER\",\n    \"docker\" : {\n  \
    \    \"image\" : \"nginx\",\n      \"network\" : \"BRIDGE\",\n      \"portMappings\"\
    \ : [\n        {\n          \"hostPort\" : 0,\n          \"containerPort\" : 80,\n\
    \          \"servicePort\" : 10001,\n          \"name\" : \"web\"\n        }\n\
    \      ]\n    }\n  },\n  \"upgradeStrategy\": {\n    \"minimumHealthCapacity\"\
    : 1,\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: "```\n\"maximumOverCapacity\": 1\n}\n}\n```\n\nThe HAPROXY_GROUP label tells\
    \ Marathon that this service will use the external HAProxy group, which is served\
    \ by the marathon-lb service.\n\nThe other important settings are in the portMappings\
    \ list. This example defines a single port to make available through the load\
    \ balancer. The containerPort is the port that the container is listening on.\
    \ hostPort is the port on the host that the container will listen on. If it is\
    \ missing or set to 0, the container is assigned a random port. A hostPort is\
    \ required, even if set to 0, to make the container's service available outside\
    \ the cluster.\n\nFinally, servicePort is the port on the load balancer that will\
    \ service this application. In this case, external clients will connect to the\
    \ load balancer on port 10001 to access this application. In practice, an external\
    \ load balancer, such as an ELB on AWS, will be used to provide mapping from a\
    \ standard port to the one configured in the load balancer.\n\nBy default, Marathon-LB\
    \ is configured to use service ports 10000 through 10100, 80, and 443. Any service\
    \ that will use this load balancer must select an available port from these for\
    \ servicePort. Make sure that the ports do not overlap.\n\nIt is possible to run\
    \ multiple load balancers. However, the load balancers run in the host mode on\
    \ the nodes, which means that it is only possible to run as many load balancers\
    \ as there are worker nodes.\n\nRunning an additional load balancer is straightforward.\
    \ First, create a file called options.json that contains the following:\n\n```\n\
    {\n\"marathon-lb\": {\n\t\"name\": \"marathon-lb-internal\",\n\t\"haproxy-group\"\
    : \"internal\",\n\t\"bind-http-https\": false,\n\t\"role\": \"\"\n}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 165
  md: "The name option is the name of the new service. The haproxy-group option sets\
    \ the HAProxy group. This group is what goes in the HAPROXY_GROUP label in the\
    \ service. Marathon will use whichever load balancer that matches the group. Create\
    \ the new load balancer by running the following command:\n\n```\n$ dcos package\
    \ install --options=lb-options.json marathon-lb\nWe recommend a minimum of 0.5\
    \ CPUs and 256 MB of RAM available for the\nMarathon-LB DCOS Service.\nContinue\
    \ installing? [yes/no] yes\n```\n\nIf there are resources available, the load\
    \ balancer will start and be ready to serve requests.\n\n# Providing persistent\
    \ storage\n\nRunning ephemeral containers like these is all well and good, but\
    \ more complicated workloads will require some form of additional storage. DC/OS\
    \ and Marathon provide two options. The first is local storage, which is only\
    \ available on the node that the task starts on. The second is external volumes,\
    \ which are available anywhere in the cluster.\n\n> As of this writing, volumes\
    \ are considered experimental. The functionality may change.\n\n# Using local\
    \ volumes\n\nLocal persistent volumes are blocks of data allocated on a node that\
    \ persists across application upgrades and restarts. Because the volume is located\
    \ on a single node, the application is pinned to that node and will always start\
    \ there. This means that the data will always be available for the application,\
    \ but it also means that if that node goes away, the application will not be able\
    \ to start. The following example shows how to add a local volume:\n\n```\n{\n\
    \ \"id\" : \"nginx-volume\",\n \"instances\" : 1,\n \"cpus\" : 0.25,\n \"mem\"\
    \ : 64.0,\n \"container\" : {\n \"type\" : \"DOCKER\",\n \"docker\" : {\n \"image\"\
    \ : \"nginx\",\n\n```"
  merge: -1
  img_proc: true
- pgno: 166
  md: '```

    "network" : "USER"

    },

    "volumes" : [

    {

    "containerPath" : "website",

    "mode" : "RW",

    "persistent" : {

    "size" : 20

    }

    }

    ],

    "ipAddress" : {

    "networkName" : "dcos"

    },

    "residency": {

    "taskLostBehavior": "WAIT_FOREVER"

    }

    }

    ```


    This example creates an application with a local persistent volume. Volumes are
    created with the `volumes` block within the container definition. The path of
    the volume is set by `containerPath`. The path may not contain forward slashes
    (`/`). Within the container, the volume will be available in `/mnt/mesos/sandbox/containerPath`.
    In this case, the `website` volume will be `/mnt/mesos/sandbox/website`.


    The `mode` option can only be `RW`, which gives the container read-write access
    to the volume. Other modes may be added as the volumes feature is developed. The
    `persistent` block only has the `size` option which defines the amount of space
    to be allocated in MiB.


    Finally, a `residency` block must be defined with `taskLostBehavior` set to `WAIT_FOREVER`.
    This signals Marathon that this application is stateful.


    Some applications do not allow you to change the path where the data lives. This
    could be a problem for applications such as MySQL. Since it is not possible to
    specify a specific path, Marathon has a workaround. The trick is to specify a
    second volume:


    ```

    {

    "id" : "nginx-volume",

    "instances" : 1,

    "cpus" : 0.25,

    "mem" : 64.0,

    "container" : {

    "type" : "DOCKER",

    "docker" : {

    "image" : "nginx",

    ```'
  merge: -1
