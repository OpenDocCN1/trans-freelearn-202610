- pgno: 82
  md: '# Using shared network storage for Docker volumes


    One of the biggest challenges with running a Docker cluster is figuring out what
    to do with the data. Docker supports using **volumes** to store data. By default,
    the volumes store data on the Docker host. What happens if that container is started
    on another host? None of the data is available. For most applications, this is
    a problem.


    Docker solved this problem by creating a pluggable storage system. Volumes can
    be created that connect to a wide variety of storage systems. Those systems can
    be anything from traditional network storage such as a **Network File System (NFS)**
    and **Internet Small Computer System Interface (iSCSI)** to cloud services such
    as Amazon S3 or clustered storage systems such as Gluster or Ceph.


    Each storage option has its pros and cons. Some may be better suited to some workloads
    than others. Fortunately, you can choose the best solution on a per-container
    basis. A public web server may run in Amazon EC2 and need storage there while
    a local file server connects to a local Ceph cluster.


    A volume is created using the `docker volume create` command. The following example
    creates a volume named `vol1` using a fictional driver named `foo`:


    ```

    $ docker volume create --driver foo --name vol1 --opt bar=1 --opt baz=2

    ```


    The driver a volume uses is defined by the `--driver` flag. Each driver has its
    own set of options that are set adding one or more `--opt` flags. Be sure to read
    the documentation for each storage driver you choose to use.


    # Introducing Ceph


    Ceph is a distributed, clustered storage solution developed by Red Hat. It provides
    an object store, block storage, and a shared filesystem. Ceph can also provide
    compatibility with Amazon S3 and OpenStack Swift with the RADOS Gateway. Multiple
    storage pools and storage tiering are also possible. It can also self-heal when
    there are problems in the cluster making it an excellent choice for providing
    storage for network services.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'There are two components of note when setting up a Ceph cluster. The first
    component is the Ceph Monitor. Monitors keep track of the cluster health and the
    **Controlled Replication Under Scalable Hashing (CRUSH)** map, which tells the
    cluster how to find data in the cluster. Second are the Ceph OSDs. These are the
    daemons that actually control the storage. A best practice is to run one OSD for
    each disk that will be used in the cluster. For more details about Ceph, refer
    to *Learning Ceph, Karan Singh*, published by Packt Publishing or http://www.ceph.com/.


    # # Using Ceph with Docker


    Docker can use Ceph for volumes through one of a number of storage drivers. Some
    orchestration systems, such as Kubernetes, have Ceph support built-in. As always,
    do your own research to see which plugin is right for your environment. This demonstration
    will use the `volplugin` driver from `contiv` which is available at: https://github.com/contiv/volplugin.


    The `volplugin` driver uses a number of daemons. You can install them manually
    but the easiest way is to run them in a Docker container:


    ```

    ```bash

    $ sudo docker run -it -v /var/run/docker.sock:/var/run/docker.sock

    contiv/volplugin-autorun

    ```

    ```


    Notice that the Docker socket is being passed in to the container as a volume.
    That is what allows the startup scripts to register and run the required containers.


    The initial installation will create a policy named `policy1` that will create
    new images in the `rbd` storage pool. You can create additional policies if you
    are using another storage pool, set a different default size, or use a different
    filesystem on the image. These are managed through the `volcli` tool which is
    available through the `volplugin` image:


    ```

    ```

    $ sudo docker exec volplugin volcli policy get policy1

    {"name":"policy1","create":{"size":"10MB","filesystem":""},"runtime":{"snapshots":true,"snapshot":{"frequency":"30m","keep":20},"rate-limit":{"write-iops":0,"read-iops":0,"write-bps":0,"read-bps":0},"driver":{"pool":"rbd"},"filesystems":{"ext4":"mkfs.ext4
    -m0"},"backends":{"crud":"ceph","mount":"ceph","snapshot":"ceph"}}

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 84
  md: "This example shows how to use the volcli to get the configuration for policy1.\
    \ Notice the use of docker exec, which allows the volplugin tool to connect to\
    \ the running daemon.\n\n# Creating a Docker volume\n\nOnce volplugin is running,\
    \ you can use it to create a Docker volume. The name of the volume starts with\
    \ the policy that is being used followed by a slash, then the image name:\n\n\
    ```\n$ sudo docker volume create -d volplugin --name policy1/test\n```\n\nIn Ceph,\
    \ a new rbd is created in the storage pool. Notice the name difference. Ceph does\
    \ not allow slashes in the image name so the slash is changed to a dot:\n\n```\n\
    $ sudo rbd info policy1.test\nrbd image 'policy1.test':\n    size 10240 kB in\
    \ 3 objects\n    order 22 (4096 kB objects)\n    block_name_prefix: rbd_data.372d8625e32\n\
    \    format: 2\n    features: layering\n    flags:\n```\n\nNow the volume can\
    \ be used with a running container. It works just the same as mounting a local\
    \ directory except that instead of a local path, the name of the volume is used:\n\
    \n```\n$ sudo docker run --rm -v policy1/test:/mnt busybox\n```\n\nThis command\
    \ starts a new busybox container with the Ceph rbd image mounted at /mnt. Notice\
    \ that since it is a new filesystem, the only thing in /mnt is the lost+found\
    \ directory. To demonstrate the power of volumes with a simple example, let's\
    \ create a new file in /mnt:\n\n```\n/ # touch /mnt/example\n/ # ls /mnt\nexample\
    \  lost+found\n```\n\nBecause this container was started with --rm, the container\
    \ will be deleted when it exits. The data stored on the volume, however, will\
    \ remain for use by the next container. If you start a new container that uses\
    \ the same volume, the data will still be there:\n\n```\n$ sudo docker run --rm\
    \ -v policy1/test:/mnt -it busybox\n/ # ls /mnt\nexample  lost+found\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: 'The power of using a system such as Ceph for your volumes is that you can start
    your container on any host in the cluster and your data will be there waiting
    for you. Meaning, it does not matter where in the cluster your container starts
    or that a particular host is running.


    A word of warning. Ceph rbd images are block devices just like any other that
    is available to a host. The same is true if you were to use iSCSI, OpenStack Cinder,
    or storage from your cloud provider. Meaning, the standard warnings about multiple
    hosts trying to mount the same filesystem apply. Multiple hosts mounting the same
    Ext4 or similar filesystem for writing will inevitably lead to data loss. That
    is a bad thing.


    If you need multiple hosts to have access to the same filesystem, consider using
    NFS or SMB as an intermediary layer. You could also use containers that run a
    cluster aware filesystem such as OCFS2, but that adds even more complexity to
    an increasingly complex environment.


    # Other shared storage plugins


    As mentioned previously, there are a lot of storage plugins. Nearly every major
    storage system has a plugin. Following are a few of the more interesting ones:


    +   - **Azure file storage**: An open source plugin developed by Microsoft to
    support Azure. Refer to `https://github.com/Azure/azurefile-dockervolumedriver`.

    +   - **GlusterFS**: Supports the clustered storage system GlusterFS from Red
    Hat. Refer to `https://github.com/calavera/docker-volume-glusterfs`.

    +   - **REX-Ray**: Developed by Dell EMC to support ScaleIO and Isilon for Docker
    and Mesos. Refer to `https://github.com/emccode/rexray`.

    +   - **Kubernetes**: The Kubernetes orchestration tool has native support for
    iSCSI, NFS, Ceph, and many others.


    # Summary


    In this chapter, you saw the building blocks that are needed for a Docker cluster.
    No matter what orchestration tool is used, there will be the need for a registry
    to store your images, an overlay network for inter-container communication, and
    network storage so that your containers can get at their data wherever in the
    cluster they start. There are many options to fill each role. While the choice
    of solution is important, it’s easy to switch between systems if needed. Some
    will be better in certain environments and workloads. The next chapter will dive
    into orchestrating a Docker cluster using Docker Swarm.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# # 4 Orchestration with Docker Swarm


    Docker Swarm is the native orchestration tool for Docker. It was rolled into the
    core Docker suite with version 1.12. At its simplest, using Docker Swarm is just
    like using Docker. All of the tools that have been covered still work. Docker
    Swarm adds a couple of features that make deploying and updating services very
    nice. You got a glimpse of them in `Chapter 3, Cluster Building Blocks – Registry,
    Overlay Networks, and Shared Storage`, which covered Docker overlay networks.
    Now it is time to dive into the details.


    The following topics are covered in this chapter:


    +   - Creating a swarm

    +   - Adding and removing nodes

    +   - Changing node availability

    +   - Swarm disaster recovery

    +   - Grouping nodes with labels

    +   - Creating and stopping services

    +   - Creating replicas

    +   - Using global services

    +   - Using constraints

    +   - Zero downtime upgrades with rolling updates

    +   - Using Docker Compose with swarm

    +   - Using Docker Datacenter'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # Setting up a swarm


    The first step for running a swarm is to have a number of hosts ready with Docker
    installed.

    It does not matter if you use the install script from get.docker.com or if you
    use Docker

    Machine. You also need to be sure that a few ports are open between the servers,
    as given

    here:


    +   - 2377 TCP port for cluster management

    +   - 7946 TCP and UDP port for node communication

    +   - 4789 TCP and UDP port for overlay network


    Take a moment to get or assign a static IP address to the hosts that will be the
    swarm

    managers. Each manager must have a static IP address so that workers know how
    to

    connect to them. Worker addresses can be dynamic but the IP of the manager must
    be static.


    As you plan your swarm, take a moment to decide how many managers you are going
    to

    need. The minimum number to run and still maintain fault tolerance is three. For
    larger

    clusters, you may need as many as five or seven. Very rarely will you need more
    than that.

    In any case, the number of managers should be odd. Docker Swarm can maintain a
    quorum

    as long as 50% + 1 managers are running. Having two or four managers provides
    no

    additional fault tolerance than one or three.


    If possible, you should spread your managers out so that a single failure will
    not take down

    your swarm. For example, make sure that they are not all running on the same VM
    host or

    connected to the same switch. The whole point is to have multiple managers to
    keep the

    swarm running in the event of a manager failure. Do not undermine your efforts
    by

    allowing a single point of failure somewhere else taking down your swarm.


    # # Initializing a swarm


    If you are installing from your desktop, it may be better to use Docker Machine
    to connect

    to the host as this will set up the necessary TLS keys. Run the `docker swarm
    init`

    command to initialize the swarm. The `--advertise-addr` flag is optional. By default,
    it

    will guess an address on the host. This may not be correct. To be sure, set it
    to the static IP

    address you have for the manager host:


    ```

    $ docker swarm init --advertise-addr 172.31.26.152

    Swarm initialized: current node (6d6e6kxlyj9u9vb9w1uug95zh) is now a

    manager.

    To add a worker to this swarm, run the following command:

    docker swarm join \

    --token

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: '```

    SWMTKN-1-0061dt2qjsdr4gabxryrksqs0b8fnhwg6bjhs8cxzen7tmarbi-89mmok3p

    f6dsa5n33fb60tx0m \

    172.31.26.152:2377

    To add a manager to this swarm, run ''docker swarm join-token manager'' and

    follow the instructions.

    ```


    Included in the output of the `init` command is the command to run on each worker
    host. It is also possible to run it from your desktop if you have set your environment
    to use the worker host. You can save the command somewhere, but you can always
    get it again by running `docker swarm join-token manager`.


    As part of the join process, Docker Swarm will create TLS keys, which will be
    used to encrypt communication between the managers and the hosts. It will not,
    however, encrypt network traffic between containers. The certificates are updated
    every three months. The time period can be updated by running `docker swarm update
    --cert-expiry duration`. The duration is specified as number of hours and minutes.
    For example, setting the duration to `1000h` will tell Docker Swarm to reset the
    certificate every 1,000 hours.


    # Managing a swarm


    One of the easiest pieces to overlook when it comes to orchestrating Docker is
    how to manage the cluster itself. In this section, you will see how to manage
    your swarm including adding and removing nodes, changing their availability, and
    backup and recovery. In *Chapter 10, Why Stop at Containers? Automating Your Infrastructure*,
    we will learn about automating node deployment in depth.


    # Adding a node


    New worker nodes can be added at any time. Install Docker, then run `docker swarm
    join-token worker` to get the `docker swarm join` command to join the host to
    the swarm. Once added, the worker will be available to run tasks. Take note that
    the command to join the cluster is consistent. This makes it easy to add to a
    host configuration script and join the swarm on boot.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'You can get a list of all of the nodes in the swarm by running `docker node
    ls` from a manager node:


    ```

    ```

    $ docker node ls

    ID                                     HOSTNAME   STATUS   AVAILABILITY   MANAGER
    STATUS

    ii3wtacdjz5p509bu313qfbei             worker1   Ready    Active         Reachable

    3f2t4wwthgcahs9089b8przv              worker2   Ready    Active         Reachable

    6d6e6kxlyjuo9vb9w1uug95zh *           manager   Ready    Active         Leader

    ```

    ```


    The list will not only show the machines but it will also show if they are active
    in the swarm and if they are a manager. The node marked as `Leader` is the master
    of the swarm. It coordinates the managers.


    # # Promoting and demoting nodes


    In Docker Swarm, just like in real life, managers are also workers. This means
    that managers can run tasks. It also means that workers can be promoted to become
    managers. This can be useful to quickly replace a failed manager or to seamlessly
    increase the number of managers. The following command promotes the node named
    `worker1` to be a manager. The following command must be run on a node that is
    already a manager:


    ```

    ```

    $ docker node promote worker1

    Node worker1 promoted to a manager in the swarm.

    ```

    ```


    Managers can also be demoted to become plain workers. This should be done before
    a manager node is going to be decommissioned. The following command demotes `worker1`
    back to a plain worker:


    ```

    ```

    $ docker node demote worker1

    Manager worker1 demoted in the swarm.

    ```

    ```


    Whatever your reasons for promoting or demoting node might be, make sure that
    when you are done, there are an odd number of managers.


    # # Changing node availability


    Docker Swarm nodes have a concept of availability. The availability of a node
    determines whether or not tasks can be scheduled on that node. Use the `docker
    node update --availability <state> <node-id>` command to set the availability
    state. There are three availability states that can be set—pause, drain, and active.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# # Pausing a node


    Setting a node''s availability to `pause` will prevent the scheduler from assigning
    new tasks to the node. Existing tasks will continue to run. This can be useful
    for troubleshooting load issues on a node or for preventing new tasks from being
    assigned to an already overloaded node. The following command pauses `worker2`:


    ```

    $ docker node update --availability pause worker2

    worker2

    ```


    ```

    $ docker node ls

    ID HOSTNAME STATUS AVAILABILITY MANAGER STATUS

    1i3wtacdjz5p509bu313qfbei worker1 Ready Active Reachable

    3f2t4wwvthgcahs9089b8przv worker2 Ready Pause Reachable

    6d6e6kxlyjguo9vbw91uug95zh * manager Ready Active Leader

    ```


    Do not rely on using `pause` to deal with overload issues. It is better to place
    reasonable resource limits on your services and let the scheduler figure things
    out for you. You can use `pause` to help determine what the resource limits should
    be. For example, you can start a task on a node, then pause the node to prevent
    new tasks from running while you monitor resource usage.


    # # Draining a node


    Like `pause`, setting a node''s availability to `drain` will stop the scheduler
    from assigning new tasks to the node. In addition, `drain` will stop any running
    tasks and reschedule them to run elsewhere in the swarm. The `drain` mode has
    two common purposes.


    First, it is useful for preparing a node for an upgrade. Containers will be stopped
    and rescheduled in an orderly fashion. Updates can then be applied and the node
    rebooted, if necessary, without further disruption. The node can be set to `active`
    again once the updates are complete.


    Remember that, when draining a node, running containers have to be stopped and
    restarted elsewhere. This can cause disruption if your applications are not built
    to handle failure. The great thing about containers is that they start quickly,
    but some services, such as MySQL, take a few seconds to initialize.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The second use of drain is to prevent services from being scheduled on manager
    nodes. Manager processing is very reliant on messages being passed in a timely
    manner. An unconstrained task running on a manager node can cause a denial of
    service outage for the node causing problems for your cluster. It is not uncommon
    to leave manager nodes in a drain state permanently. The following command will
    drain the node named manager:


    ```

    $ docker node update --availability drain manager

    manager

    ```


    | ID | HOSTNAME | STATUS | AVAILABILITY | MANAGER STATUS |

    |---|---|---|---|---|

    | i13wtadcjz5p509bu313qfbei | worker1 | Ready | Active | Reachable |

    | 3f2t4wwthgcahs9089b8przv | worker2 | Ready | Active | Reachable |

    | 6d6e6kxlyjuo9vb9w1uug95zh * | manager | Ready | Drain | Leader |


    # Activating a node


    When a node is ready to accept tasks again, set the state to active. Do not be
    concerned if the node does not immediately fill up with containers. Tasks are
    only assigned when a new scheduling event happens, such as starting a service.
    The following command will reactivate the worker2 node:


    ```

    $ docker node update --availability active worker2

    worker2

    ```


    | ID | HOSTNAME | STATUS | AVAILABILITY | MANAGER STATUS |

    |---|---|---|---|---|

    | i13wtadcjz5p509bu313qfbei | worker1 | Ready | Active | Reachable |

    | 3f2t4wwthgcahs9089b8przv | worker2 | Ready | Active | Reachable |

    | 6d6e6kxlyjuo9vb9w1uug95zh * | manager | Ready | Active | Leader |


    # Removing nodes


    Nodes may need to be removed for a variety of reasons including upgrades, failures,
    or simply eliminating capacity that is no longer needed. For example, it may be
    easier to upgrade nodes by building new ones rather than performing updates on
    the old nodes. The new node will be added and the old one removed.


    Step one for a healthy node is to set the --availability state to drain. This
    will ensure that all scheduled tasks have been stopped and moved to other nodes
    in the swarm.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Step two is to run `docker swarm leave` from the node that will be leaving
    the swarm. This will assign the node a Down status. In the following example,
    `worker2` has left the swarm:


    ```

    $ docker node ls


    ID                                            HOSTNAME    STATUS    AVAILABILITY   MANAGER
    STATUS

    1i3wtacdjz5p509bu313qcfbei    worker1     Ready     Active         Reachable

    3f2t4wwtthgcahs9089b8przv   worker2     Down      Active

    6d6e6kxlyjuo9vb9w1uug95zh *   manager     Ready     Active         Leader

    ```


    If the node that is being removed is a manager, it must first be demoted to a
    worker as described earlier before running `docker swarm leave`. When removing
    managers, take care that you do not lose quorum or your cluster will stop working.


    Once the node has been marked Down, it can be removed from the swarm. From a manager
    node, use `docker node rm` to remove the node from the swarm:


    ```

    $ docker node rm worker2

    ```


    In some cases, the node that you want to remove is unreachable so it is not possible
    to run `docker swarm leave`. When that happens, use the `--force` option:


    ```

    $ docker node rm --force worker2

    ```


    Nodes that have been removed can be re-added with `docker swarm join`.


    # Recovering from a disaster


    Failures are a regular occurrence in large clusters. Hard drives fail, servers
    fail, even full data centers will go dark. Shifting services to cloud platforms
    such as AWS and Azure have helped, but even they have had entire regions go down.
    Using containers may make your applications more resistant to failure, but the
    hosts running those containers are still affected by any number of things. Properly
    engineered, your cluster should be able to cope with disaster. Here are a few
    things to keep in mind to keep your cluster safe.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# # Restarting the full cluster


    There may be times when the entire swarm has to be shutdown. Hopefully, there
    will be time to properly shut down running services and the hosts. When the time
    comes to shutdown the hosts, start with the workers then shutdown the managers.
    When the cluster is started up again, start the managers first then the workers.
    Make sure that the managers have the same IP addresses or your nodes will come
    up and not be able to reconnect with the swarm.


    # # Backup and recovery


    Just because Docker Swarm is resilient to failure, does not mean that you should
    ignore backups. Good backups may be the difference between restoring services
    and a resume altering event. There are two major components to back up – the swarm
    state data and your application data.


    # # Backing up the swarm


    Each manager keeps the cluster information in `/var/lib/docker/swarm/raft`. If,
    for some reason, you need to completely rebuild your cluster, you will need this
    data. Make sure you have at least one good backup of the `raft` data directory.
    It does not matter which of the managers the backups are pulled from. It might
    be wise to pull backups from a couple of managers, just in case one is corrupted.


    # # Recovering a swarm


    In most cases, losing a failed manager is an easy fix. Restart the failed manager
    and everything should be good. It may be necessary to build a new manager or promote
    an existing worker to a manager. In most circumstances, this will bring your cluster
    back into a healthy state.


    If you lose enough managers to lose a quorum, recovery gets more complex. The
    first step is to start enough managers to restore quorum. The data should be synced
    to the new managers, and once quorum is recovered, so is the cluster. If that
    does not work, you will have to rebuild the swarm. This is where your backups
    come in.'
