    # Summary


    This chapter covered the basics of using Mesosphere to manage your applications.
    It showed how to create applications, scale them, upgrade them without downtime,
    and delete them. It also showed how to use the built-in load balancers and how
    to run a private registry. The next chapter will look at other less well-known
    orchestration tools, including CoreOS Fleet and Rancher Cattle.'
