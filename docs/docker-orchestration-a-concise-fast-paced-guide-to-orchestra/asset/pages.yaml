    }

    ]

    },

    "ipAddress" : {

    "networkName" : "dcos"

    },

    "residency": {

    "taskLostBehavior": "WAIT_FOREVER"

    }

    }

    ```


    The rules for volume names with local volumes also apply to external volumes as
    well. If the volume is to be mounted in a specific path, a second volume must
    be used as demonstrated earlier.


    Mesosphere only allows a single instance of an application to mount a specific
    external volume. A task may be scaled down to zero. The volume will persist and
    will be ready for use when the application is scaled back up.


    Here are a few other things to keep in mind when using external persistent volumes:


    +   - The volume will not be destroyed when the associated cluster is destroyed.
    You are responsible for volume clean up.


    +   - For some providers, images that are created in a certain zone or region
    are only available to hosts running in that same zone.


    +   - Ensure that your volume names are unique to avoid conflicts.


    +   - Make sure that a compatible version of Docker is used. The REX-Ray documentations
    recommends Docker 1.10.2 or higher.


    # # Using a private registry


    Mesosphere has the ability to use a private Docker Registry for images. Images
    can be pulled from a local registry in the same way one would with Docker; using
    the registry address followed by the image. For example, to use the myapp image
    that is on registry.example.com, you would set the image to registry.example.com/myapp.


    It is also possible to host a private registry on your Mesosphere cluster. The
    registry can be set up using host networking or with either VIP or Marathon-LB
    as the load balancer. The following example creates an insecure registry which
    uses Marathon-LB:'
  merge: -1
  img_proc: true
- pgno: 170
  md: "```\n{\n  \"id\" : \"registry\",\n  \"cpus\" : 0.5,\n  \"mem\" : 128,\n  \"\
    instances\" : 1,\n  \"labels\" : {\n    \"HAPROXY_GROUP\" : \"external\"\n  },\n\
    \  \"container\" : {\n    \"type\" : \"DOCKER\",\n    \"docker\" : {\n      \"\
    network\" : \"BRIDGE\",\n      \"image\" : \"registry:2\",\n      \"portMappings\"\
    \ : [\n        {\n          \"containerPort\" : 5000,\n          \"hostPort\"\
    \ : 0,\n          \"servicePort\" : 10003\n        }\n      ]\n    },\n    \"\
    volumes\" : [\n      {\n        \"containerPath\" : \"registry\",\n        \"\
    mode\" : \"RW\",\n        \"persistent\" : {\n          \"size\" : 2048\n    \
    \    }\n      }\n    ]\n  },\n  \"env\" : {\n    \"STORAGE_PATH\" : \"/mnt/mesos/sandbox/registry\"\
    \n  },\n  \"residency\" : {\n    \"taskLostBehavior\": \"WAIT_FOREVER\"\n  }\n\
    }\n```\n\nThis example does not use TLS keys to secure the registry. To use them,\
    \ the Docker daemon must be configured with the --insecure-registry flag. Certificates\
    \ can be added through a volume. The REGISTRY_HTTP_TLS_CERTIFICATE and REGISTRY_HTTP_TLS_KEY\
    \ environment variables can then be used to set the path to the certificate and\
    \ the key, respectively."
  merge: -1
