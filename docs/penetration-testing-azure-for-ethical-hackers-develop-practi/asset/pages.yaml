- pgno: 273
  md: '# # Exploiting Owner

    ## and Privileged Azure

    ## AD Role Permissions


    In the first chapter of this book, we made a distinction between the Azure AD
    roles and the Azure RBAC roles. We mentioned that Azure AD roles are used to manage
    access to Azure AD resources and operations, such as user accounts or group creation,
    and password resets, while Azure RBAC roles are used to manage access to Azure
    resources such as subscriptions, storage accounts, and SQL databases. For the
    most part, both services have separate scope boundaries. In general, an Azure
    AD role assignment does not grant access to manage Azure resources and an Azure
    RBAC role assignment does not grant access to manage Azure AD resources.


    Bridging the gap from subscription Owner up to the root management group, or an
    Azure AD administrative role, or to on-premises targets, can be a difficult task.
    Likewise, moving laterally from Azure AD to Azure subscription resources could
    be tricky. In this chapter, we will focus on different techniques that can be
    used to move laterally beyond the scope of a user''s existing permissions assignment
    within an environment.'
  merge: -1
  img_proc: true
- pgno: 274
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 275
  md: 'To prevent lateral movement, the best practice is to keep both planes (Azure
    AD and Azure resources) separate. This means that separate user accounts should
    be used to administer them. If this best practice is *not* followed, the compromise
    of an identity that has access to Azure AD can be leveraged to move laterally
    to Azure resources and vice versa.


    With that being said, there are other options that an attacker could look to exploit
    even if user accounts are kept separate for Azure AD and Azure resources. We will
    look at some of those options in the next sections.


    # Path 1 – Exploiting group membership


    An Azure AD account may not have default access to Azure resources, but if it
    has access to modify group memberships in Azure AD, we could exploit this to add
    our account to a group that has permission to Azure resources. *Figure 7.2* shows
    how this attack would work:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_275_0.png)


    *Figure 7.2 – Azure AD and subscription relationship*


    Let''s discuss the steps briefly:


    +   1. **User3** starts out with no access to Azure resources but has permissions
    to modify group membership in Azure AD.

    +   2. The **cloud-architects** group is assigned the Owner role for Azure resources.

    +   3. **User3** adds themself to the **cloud-architects** group in Azure AD,
    which happens to have permissions to Azure resources.

    +   4. **User3** now has permissions to Azure resources by virtue of the new group
    membership.'
  merge: -1
  img_proc: true
- pgno: 276
  md: "> **Important note**\n> \n> Even though our discussion in this chapter centers\
    \ on the Global Administrator role in Azure AD, there are other built-in roles\
    \ in Azure AD that could be used to perform this attack. This includes the following\
    \ roles: **User Administrator, Groups Administrator, and Directory Writers.**\
    \ Additionally, any Azure AD custom role with the following permission could be\
    \ exploited:\n> \n> `microsoft.directory/groups/members/update`.\n\nThis is a\
    \ very simple attack and we exploited something similar in a hands-on exercise\
    \ in *Chapter 4, Exploiting Reader Permissions*, but with a slight variation.\
    \ If a user already has rights in a subscription, it would be easy to identify\
    \ any privileged groups in the subscription, but what can we do if our Active\
    \ Directory user doesn't have any subscription rights? One way is by reviewing\
    \ the Azure AD sign-in log.\n\nThe Azure AD sign-in log automatically records\
    \ both interactive and non-interactive sign-in activities. From an offensive perspective,\
    \ the log contains a wealth of information that could give an attacker insight\
    \ on which users have access to each Azure AD application, which user accounts\
    \ or applications are easy targets, and information on how to evade defensive\
    \ configurations!\n\nIn our case, we could either log in through the Portal or\
    \ use Azure PowerShell to review the logs to see the users who have access to\
    \ Azure resources. We could then correlate that information with the group membership\
    \ of the users.\n\nTo use Azure PowerShell to review the sign-in logs, we first\
    \ need to install the AzureAD preview PowerShell module. At the time of writing,\
    \ this feature is only available in the preview version of the module. Some preview\
    \ features never make it to the generally available release, so this *might* not\
    \ be generally available in the future.\n\nNote that this module cannot be installed\
    \ side by side with the **Generally Available (GA)** version of the AzureAD module,\
    \ so we may first need to remove the GA version if we have it installed. Assuming\
    \ you have been following the examples, AzureADPreview should have been installed\
    \ as part of setting up PowerZure.\n\nIf the module is not set up, you can use\
    \ the following instructions to do this:\n\n```\n```powershell\n# Remove the GA\
    \ version if it is installed\nUninstall-Module AzureAD\n\n# Install the preview\
    \ version of the AzureAD module. Close and\n# re-open the PowerShell console afterwards\n\
    Install-Module AzureADPreview\n\n# Verify that the GA version of the module is\
    \ installed\n```\n```"
  merge: -1
  img_proc: true
- pgno: 277
  md: '```

    ```powershell

    Import-Module AzureADPreview

    Get-Module AzureADPreview | select Name,Version

    Name              Version

    ----              -------

    AzureADPreview 2.0.2.138

    ```

    ```


    To review the sign-in logs for interesting events, we can use the Get-AzureADAuditSignInLogs
    cmdlet as shown in the following commands (this command requires a native work/school
    Azure AD user account and not a Microsoft account). The following commands will
    filter the sign-in logs for successful Azure Portal or Azure PowerShell sign-ins
    in the time range specified (the date can be modified to the date before your
    current date to get the results for the past 24 hours). The output of these commands
    provides great information that we can use to verify the users of Azure management
    tools, which usually means that they have some level of access to Azure resources:


    ```

    ```powershell

    # First connect to Azure AD

    Connect-AzureAD


    # Get successful Azure Portal sign-ins in the time range

    # (greater than the specified date)

    Get-AzureADAuditSignInLogs -Filter "appDisplayName eq RAzure Portal'' and createdDateTime
    gt $((Get-Date).AddDays(-1).ToString(''yyyy-MM-dd'')) and status/errorCode eq
    0"


    # Get successful Azure PowerShell sign-ins in the time range

    # (greater than the specified date)

    Get-AzureADAuditSignInLogs -Filter "appDisplayName eq ''Microsoft Azure PowerShell''
    and createdDateTime gt $((Get-Date).AddDays(-1).ToString(''yyyy-MM-dd'')) and
    status/errorCode eq 0"

    ```

    ```


    We can filter this further to get the properties that are useful to show us the
    security configurations of the user accounts. This information can be useful if
    we need to look to bypass defenses:


    ```

    ```powershell

    # Get interesting authentication properties for successful

    # Azure Portal sign-ins

    Get-AzureADAuditSignInLogs -Filter "appDisplayName eq ''Azure Portal'' and createdDateTime
    gt $((Get-Date).AddDays(-1).ToString(''yyyy-MM-dd'')) and status/errorCode eq
    0" | Select-Object UserPrincipalName, MfaDetail, AppliedConditionalAccessPolicies

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Here is a sample output of this command:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_278_0.png)


    Figure 7.3 – PowerShell command results for sign-in auditing


    The following Azure AD built-in roles have the permissions needed to read this
    information: **Security Administrator**, **Security Reader**, and **Report Reader**.
    Additionally, any custom Azure AD role that has the following permissions could
    also be used:


    +   - `microsoft.directory/groups/allProperties/allTasks` – Grants permission
    to read and update group properties in Azure AD

    +   - `microsoft.directory/signInReports/allProperties/read` – Grants permission
    to read sign-in reports


    It is also worth noting that there are opportunities to move laterally from Azure
    AD to other cloud applications that may be using Azure AD as their identity provider
    if your pentest scope covers that. You can discover other applications that have
    a trust relationship with Azure AD by reviewing the **Enterprise Applications**
    in Azure AD. You can use this section to find out the users authorized for the
    applications and the groups that they belong to. If the access is granted via
    groups, you can add yourself to the groups to gain permissions to those cloud
    applications.


    # Path 2 – Resetting user passwords


    Another path that could be exploited to move laterally to another Azure subscription
    is to reset the password of a user who has permissions to another Azure subscription
    and logging in as that user. This path is less preferred as it impacts the existing
    access of a user and is more intrusive. It easily raises an alarm if a user is
    suddenly not able to log in to their account with the password that they have
    always used, and the audit logs reflect the recent password change event.'
  merge: -1
