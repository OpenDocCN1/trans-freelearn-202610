- pgno: 173
  md: 'You are now logged in as the service principal. Next, we will verify the permissions
    that this service principal has.


    +   5. Verify the role assignment and scope of the service principal using the
    following command. Replace `APP_ID` with the application ID that you made a note
    of in *Step 3*:


    ```

    ```bash

    root@PentestVM:~# az role assignment list --assignee APP_ID --include-groups --include-inherited
    --query ''[].{username:principalName, role:roleDefinitionName, usertype:principalType,
    scope:scope}''

    ```

    ```


    You can see that this service principal is assigned the Contributor role at the
    subscription scope. Awesome! We have found a route to a role assignment that gives
    us more permissions than that of the current user!


    ![](img/4fa338e84e0a590967a142dd798ba4e2_173_0.png)


    While the Reader roles (Global Reader in Azure AD and Reader in Azure RBAC) normally
    do not have ownership permissions on service principals, remember that member
    users in an Azure AD tenant have permission to register applications and they
    are automatically made the owner of applications that they registered. Also, there
    are occasional situations where ownership rights are given to users. Since these
    ownership rights could pop up at any role level, we thought it would be good to
    address them early on.


    One permission that is always available for the Reader role is the ability to
    connect to and pull images from **Azure Container Registry (ACR)**. These rights
    don''t allow readers to make changes to the images, but it does allow them to
    review the images.'
  merge: -1
  img_proc: true
