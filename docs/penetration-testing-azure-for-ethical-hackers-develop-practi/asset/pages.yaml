  md: '# Section 1:

    Understanding the Azure Platform and Architecture


    This section will cover the basics of the Azure ecosystem and explain the attacks
    that are available from an anonymous, internet-facing standpoint.


    This part of the book comprises the following chapters:


    +   - *Chapter 1, Azure Platform and Architecture Overview*

    +   - *Chapter 2, Building Your Own Environment*

    +   - *Chapter 3, Finding Azure Services and Vulnerabilities*'
