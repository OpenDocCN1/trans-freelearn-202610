- pgno: 150
  md: 'In the next exercise, we will use one of MicroBurst''s functions to perform
    a quick and comprehensive enumeration of an entire Azure environment.


    # Hands-on exercise – enumerating subscription information with MicroBurst


    We previously introduced the MicroBurst toolkit for anonymously enumerating Azure
    services in *Chapter 3, Finding Azure Services and Vulnerabilities*. In this exercise,
    we will use one of its functions to perform an authenticated enumeration of our
    Azure subscription. Here are the tasks that we will complete in this exercise:


    +   - **Task 1:** Import MicroBurst into the PowerShell session.

    +   - **Task 2:** Use the `Get-AzDomainInfo` MicroBurst function to enumerate
    the subscription using the reader permissions.

    +   - **Task 3:** Review the resource inventory collected by the function.

    +   - **Task 4:** Review the user list collected by the function.

    +   - **Task 5:** Review the list of privileged users for targeting.


    Let''s begin:


    +   1. In an authenticated Az module PowerShell session on your pentest VM, import
    the MicroBurst module using the following commands. If you get a non-fatal error
    about MSOnline, you can ignore it as that module is not installed on the VM because
    it is not used:


    ```

    ```powershell

    PS C:\> cd C:\Users\$env:USERNAME\MicroBurst

    PS C:\> Import-Module .\MicroBurst.psm1

    ```

    ```


    +   2. Create a folder to store the output of the function that we are about to
    run using the following command:


    ```

    ```powershell

    PS C:\> New-Item -Name "microburst-output" -ItemType "directory"

    ```

    ```


    +   3. Run the MicroBurst function to enumerate the Azure subscription using the
    following command. When a window opens displaying the subscription, click **OK**
    to proceed:


    ```

    ```powershell

    PS C:\> Get-AzDomainInfo -Verbose -Folder microburst-output

    ```

    ```'
  merge: -1
  img_proc: true
