- pgno: 290
  md: '# Path 2 – Exploiting service principals'' API permissions


    The Microsoft identity platform supports two types of permissions for service
    principals: delegated permissions and application permissions. Delegated permissions
    are used for interactive authentication flows, where a signed-in user is present.
    For this scenario, the user will need to consent to the permission at the time
    of access (or an administrator can consent on behalf of users).


    Application permissions are used by apps that run without any user interaction,
    which means no user is signed in to them. An administrator only needs to consent
    to the granted permissions once for the app. It is not uncommon for service principals
    to be granted permissions to perform sensitive operations on APIs such as the
    Microsoft Graph. These permissions can be exploited by an attacker to access the
    APIs that the app has been granted access to.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_290_0.png)


    Figure 7.18 – Service principal app permission


    For example, an app may not have any role assignments in Azure AD, but if it has
    app permissions to perform sensitive operations in Microsoft Graph, this could
    be used as an indirect way to access Azure AD. This style of attack is also becoming
    a popular phishing technique for attackers. By using an Azure AD consent grant
    URL (*Figure 7.19*), an attacker can use a legitimate Azure URL to send to a phishing
    victim. This URL uses the built-in Azure AD permissions approval flow to allow
    users to approve external applications.'
  merge: -1
  img_proc: true
