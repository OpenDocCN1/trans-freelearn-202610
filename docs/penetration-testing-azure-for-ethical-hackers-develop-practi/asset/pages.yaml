- pgno: 96
  md: "> **Note**\n> \n> Please note that the preceding commands are not part of the\
    \ hands-on exercises that we will walk through later, but if you have an Azure\
    \ environment where you want to try these, you can run them in Azure Cloud Shell.\n\
    \nIt is important to note that dynamically allocated addresses can change and,\
    \ if tested later, may no longer be assigned to the organization that you are\
    \ engaged with. For these situations, it might be worth targeting DNS host names,\
    \ as they will automatically update when the IP address changes. This will help\
    \ us avoid scanning the IP addresses of other Azure customers. Additionally, we\
    \ recommend running any public IP scans immediately after gathering the IPs.\n\
    \nFor learning purposes, we will show you how external adversaries anonymously\
    \ discover Azure targets using publicly available information. The Microsoft Azure\
    \ network team publishes a JSON file that contains the public IP address ranges\
    \ for all Azure regions and public services.\n\nThe file is also updated weekly\
    \ with new ranges as they are added. It is not unusual for an adversary to obtain\
    \ this list and parse it using a JSON tool such as **JQ**. The IP ranges can then\
    \ be scanned with another tool such as **Nmap** to determine the attack surface\
    \ area. We will be emulating this in the next set of exercises.\n\n> **Important\
    \ note**\n> \n> Microsoft strongly discourages scanning public IP ranges that\
    \ are not allocated to your Azure subscription, or that you do not have the authorization\
    \ of the owner to scan. The next exercise is for educational purposes only. **Do\
    \ not scan the addresses without the written legal permission of the assigned\
    \ owner!**\n\n# # Hands-on exercise – parsing Azure public IP addresses using\
    \ PowerShell\n\nThis exercise will walk you through how an external adversary\
    \ could use the published Azure public IP ranges to identify potential targets\
    \ that they can scan for vulnerabilities.\n\nHere are the tasks that we will complete\
    \ in this exercise:\n\n+   - **Task 1:** Download the published Azure public IP\
    \ ranges JSON file on our pentest VM.\n+   - **Task 2:** Parse the downloaded\
    \ file to identify potential targets using PowerShell."
