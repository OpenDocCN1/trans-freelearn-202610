- pgno: 24
  md: 'The organization structure in Azure consists of the following levels: **Azure
    AD Tenant, Root Management Group, Child Management Group, Subscription, Resource
    Group, and individual Resources.** These different levels are shown in the following
    diagram:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_24_0.png)


    Figure 1.1 – Azure resource hierarchy


    Here are the descriptions of each level from the top down:


    +   - **Azure AD Tenant:** In order to manage Azure subscriptions and resources,
    administrators need an identity directory to manage users that will have access
    to the resources. Azure AD is the identity store that facilitates the authentication
    and authorization for all users in an Azure tenant''s subscriptions.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "Every Azure subscription has a trust relationship with one Azure AD tenant\
    \ to manage access to the subscription. It is common for organizations to connect\
    \ their on-premises AD to Azure AD using a tool called **Azure AD Connect**, as\
    \ shown in the following diagram:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_25_0.png)\n\
    \n*Figure 1.2 – Using Azure AD Connect to synchronize objects to Azure AD*\n\n\
    As the core of authentication and authorization, Azure AD is a prime target for\
    \ information gathering, as well as different identity-based attacks. We will\
    \ be covering more of the authorization model for Azure subscriptions in the *Understanding\
    \ the Azure RBAC structure* section in this chapter.\n\n+   - **Root Management\
    \ Group**: This is the top of the Azure resource organization hierarchy, *if it’s\
    \ enabled*. By default, the root management group is not enabled for an organization\
    \ that is new to Azure, which means each subscription is managed as an individual\
    \ entity. However, managing subscriptions individually creates a governance model\
    \ that does not scale well. This is especially difficult for medium-to large-sized\
    \ organizations with multiple subscriptions to manage.\n+   \n+     Many production\
    \ Azure environments will have the root management group enabled. This is partly\
    \ because Microsoft recommends enabling it as part of their *Cloud Adoption Framework*\
    \ document (`https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/decision-guides/subscriptions/`).\
    \ This document describes some of the best practices for adopting the Azure cloud\
    \ and is a great source of information for those looking at building out an environment\
    \ in Azure.\n+   \n+   - **Child Management Group**: If an organization has enabled\
    \ the root management group, they could create child management groups under the\
    \ root to simplify the management of their subscriptions. Child management groups\
    \ allow organizations to group subscriptions together in a flexible structure,\
    \ mainly to centrally manage access and governance. Child management groups can\
    \ be nested and can support up to six levels of depth."
  merge: -1
  img_proc: true
- pgno: 26
  md: "+   - **Subscription:** To provision resources in Azure, we need an Azure subscription.\
    \ An Azure subscription is the logical container where resources are provisioned.\
    \ When we create a resource such as a **Structured Query Language (SQL)** database,\
    \ the first thing we usually do is specify the subscription where the resource\
    \ will be provisioned. The usage of that resource will also be billed to the subscription\
    \ that is selected.\n+   \n+     As noted in the **Child Management Group** description,\
    \ an organization will typically have multiple Azure subscriptions. It is quite\
    \ common for organizations to set up multiple subscriptions for separate environments,\
    \ such as development and production, or for separating application environments.\n\
    \n+   - **Resource Group:** Within subscriptions, there are resource groups. Resource\
    \ groups are logical containers that can be used to group and manage Azure resources\
    \ such as **virtual machines (VMs)**, storage accounts, and databases.\n+   \n\
    +     Resource groups are best used to collect and group resources that need to\
    \ be managed together or share the same life cycle. Depending on the subscription\
    \ architecture, this can result in large numbers of resource groups in individual\
    \ subscriptions.\n+   \n+     From an access perspective, resource groups also\
    \ allow us to segment access to different groups in the same subscription, but\
    \ we will cover that in more detail in the *Understanding the Azure RBAC structure*\
    \ section.\n\n+   - **Resources:** Resources are the individual instances of Azure\
    \ services that are deployed in an Azure subscription. The resource level is the\
    \ bottom of the organization hierarchy. Outside of services with specific access\
    \ policies (see the information about *key vaults*), we can't segment down the\
    \ resources hierarchy any further than this.\n\nWe will get into the specifics\
    \ of how access is managed using RBAC later in the chapter but in general, an\
    \ Azure AD account can have specified access to any of the resource organization\
    \ levels outlined previously. From a penetration-testing perspective, access granted\
    \ at a higher level gives wider scope for an attacker to discover vulnerabilities\
    \ in cloud-service configurations and to move laterally within the environment.\
    \ This concept will be more important when we discuss privilege escalation.\n\n\
    In the next section, we will cover an overview of some of the commonly utilized\
    \ Azure services. These individual instances of services fall under the **Resources**\
    \ category listed previously."
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # An overview of Azure services


    As we noted earlier in this chapter, there are over 200 services available in
    Azure. Even though this sounds like a lot of services, they can generally be grouped
    into five categories, outlined as follows:


    +   - **Services that are used to host applications:** These services provide
    a runtime environment that can be used to execute application code or run container
    images. Services such as **Azure App Service, Azure Virtual Machine (Azure VM),**
    and **Azure Kubernetes Service (AKS)** fall into this category. Organizations
    use them to host external and internal applications.

    +   - **Services that are used to store data for applications:** These services
    are used to store different kinds of application data. Services such as Storage
    accounts, Azure SQL, and Cosmos DB fall into this category.

    +   - **Services that are used to create applications:** These services are used
    to create workflows that run in the cloud. Services such as Logic Apps and Functions
    apps fall into this category.

    +   - **Services that are used to enhance applications:** These are typically
    **Software-as-a-Service (SaaS)**-type services in Azure that are used to provide
    extra capabilities to other applications. A service such as Azure Cognitive Services
    falls into this category. This is used by developers to add intelligence to their
    custom applications using pre-built and pre-trained machine learning algorithms.

    +   - **Services that are used to monitor or manage applications:** These are
    services that are used to manage or monitor other services or applications. Services
    such as Azure Automation, API Management, Application Insights, and Azure Monitor
    fall into this category. Additional security-focused services, such as Azure Sentinel
    and Azure Security Center, would also fall into this category. These services
    can also provide useful insights from a penetration-testing perspective.


    As we progress through the book, we will touch on many services, but the core
    resources that are important to understand are outlined here.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'This table outlines some of the most common Azure services that will be attacked
    in this book:


    | Service | Description |

    |---|---|

    | App Services | This service is inclusive of App Service and Function apps in
    Azure. These services can be used for "serverless" web application and API hosting.
    |

    | Storage Accounts | Storage accounts are used for most data storage operations
    in Azure. Files can be publicly or privately hosted, and files can be accessed
    through several protocols (**HyperText Transfer Protocol (HTTP)**, **Server Message
    Block (SMB)**, **Network File System (NFS)**). This service can also be used for
    static web content hosting. |

    | Automation Accounts | Another "serverless" code service, Automation accounts
    allow you to run scripting code (PowerShell and Python) from "runbooks" to automate
    processes in the subscription. There is a lot of surface area in this service,
    so we will return to it frequently throughout the book. |

    | Virtual Machines | One of the initial backbones of cloud services, these are
    VMs hosted in the cloud. There are multiple facets to deploying VMs in the cloud,
    so this service will also be a major focal point. |

    | Key Vaults | Azure key vaults are the primary credential store within Azure.
    This includes the storage of keys, secrets, and certificates. Aside from utilizing
    the standard **Identity and Access Management (IAM)** rights assignments, access
    policies can be applied to provide additional restrictions on Key Vault data.
    |

    | Azure SQL | This service is for hosting SQL databases in the cloud. Everything
    about the SQL database is managed by Microsoft, which can help simplify the usage
    of databases in Azure projects. |

    | Azure Container Registry/Azure Container Instances | As many environments start
    migrating to containerization, the usage of cloud container registries and cloud
    container instances is becoming more popular. Azure Container Registry holds the
    container images used as base images for containerization.\n\nWhile it is a relatively
    small part of a containerized environment, this service is a commonly targeted
    one, as the images frequently house sensitive information. |'
  merge: -1
  img_proc: true
- pgno: 29
  md: "As you can see from the preceding information, Microsoft was very practical\
    \ with the naming of Azure services. For the most part, the service names are\
    \ based on what the service does. For example, the Azure service used for hosting\
    \ VMs is called **Virtual Machines**. In contrast, the equivalent service in AWS\
    \ would be **Elastic Compute Cloud (EC2)**.\n\n> **Important note**\n> \n> For\
    \ anyone that is making the terminology transition from AWS to Azure, the following\
    \ Microsoft document may be helpful for matching up any of the confusing service\
    \ names: `https://docs.microsoft.com/en-us/azure/architecture/aws-professional/services`.\n\
    > \n> For those more familiar with GCP, Microsoft also has some helpful documentation\
    \ at `https://docs.microsoft.com/en-us/azure/architecture/gcp-professional/services`.\n\
    \nIn *Chapter 3, Finding Azure Services and Vulnerabilities*, we will discuss\
    \ how some of these services can be discovered anonymously using the Azure **Domain\
    \ Name System (DNS)** naming structure. In the next section, we will review how\
    \ access to Azure services is structured and managed using RBAC.\n\n# # Understanding\
    \ the Azure RBAC structure\n\n**RBAC** is an authorization system used to control\
    \ who has access to Azure resources, and the actions users can take against those\
    \ resources. At a high level, you can think of it as *granting security principals\
    \ (users, groups, and applications) access to Azure resources, by assigning roles\
    \ to the security principals*.\n\nFor example, RBAC can be used to grant a user\
    \ access to manage all VMs in a subscription, while another user is granted access\
    \ to manage all storage accounts in the same subscription. That would be an odd\
    \ choice for separation of duties in a subscription, but cloud environments tend\
    \ to foster *creative solutions* for making things work.\n\nRBAC concepts get\
    \ far more complex when we start introducing the different scopes of role assignments\
    \ (management groups, subscriptions, and so on), but keep the preceding description\
    \ in mind as we progress.\n\nAzure RBAC is made up of the following components—**security\
    \ principals, role definitions, and role assignment**. Let's look at each of these\
    \ components in detail."
  merge: -1
  img_proc: true
- pgno: 30
  md: "# Security principals\n\nA **security principal** is a fancy term to describe\
    \ *an Azure AD object that we want to assign privileges to*. This could be a user\
    \ account, a group, a service principal, or a managed identity. These are all\
    \ different types of identities that exist in Azure AD, as shown in the following\
    \ screenshot:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_30_0.png)\n\nFigure\
    \ 1.3 – Azure RBAC security principals\n\n> **Important note**\n> \n> Do not confuse\
    \ \"security principal\" with \"service principal.\" *Security principal* is an\
    \ overall term used to describe objects in Azure AD (including users, groups,\
    \ and service principals). *Service principal* is a specific type of security\
    \ principal.\n\nWhile there are many facets to a security principal, keep in mind\
    \ that every security principal has an **object ID** that uniquely identifies\
    \ it in Azure AD. This object ID is typically used as a reference when assigning\
    \ a role to the security principal. Next, we will cover the different types of\
    \ security principals.\n\n# User accounts\n\n*A user account is a standard user\
    \ identity in Azure AD.* These accounts can be internal to the Azure AD tenant,\
    \ or an external \"guest\" account. In either case, the general administration\
    \ of the users will occur at the Azure AD tenant level.\n\nInternal user accounts\
    \ are user identities created in the Azure AD tenant by an administrator. Additionally,\
    \ these may be user identities that are synchronized from an on-premises AD environment\
    \ to Azure AD (see *Figure 1.2*)."
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The accounts are commonly addressed by their **User Principal Name (UPN)**,
    which is typically an email address. For example, a user named `karl` in the Azure
    AD tenant, with a domain name of `azurepentesting.com`, will have a UPN of `karl@azurepentesting.com`.


    The following screenshot shows an internal user account in the Azure portal. Most
    Azure AD accounts that you interact with will fall under this category:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_31_0.png)


    *Figure 1.4 – Screenshot of an internal user account*


    External user accounts are user identities from other Azure AD tenants, or Microsoft
    accounts (`outlook.com`, `hotmail.com`, and so on) that are invited as guest users
    to an Azure AD tenant. The UPN format for external user accounts is shown here:


    ```

    `<alias>_<HomeTenant>#EXT#@domain.suffix`

    ```


    For example, if a user named `david`, from the `cloudsecnews.com` AD tenant, is
    invited as a guest user of the `globaladministratorazurepen.onmicrosoft.com` Azure
    AD tenant, the UPN will be `david_cloudsecnews.com#EXT#@globaladministratorazurepen.onmicrosoft.com`
    (see *Figure 1.5*).


    External accounts are typically used to grant access to vendors or third-party
    users that may be working on a subscription. The user accounts are not directly
    managed by the Azure AD tenant, so account policies (password length, **multi-factor
    authentication (MFA)**, and so on) would be out of the control of the Azure AD
    tenant.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/4fa338e84e0a590967a142dd798ba4e2_32_0.png)


    > Figure 1.5 – Screenshot of an external user account


    For both internal and external accounts, we will be targeting credentials for
    the accounts during an Azure penetration test to get access to resources in the
    Azure AD tenant. As we will see in later chapters, these accounts are a great
    place to get an initial foothold in an environment.


    # Service principal


    A **service principal** is an application identity in Azure AD. You can think
    of it as an Azure AD object representing an application that needs access to Azure
    resources. This is the preferred way to grant access to an application instead
    of creating a *dummy user account*.


    Service principals will be very important when we get to automation account attacks,
    but for now, just know that *applications* can be registered in Azure AD and they
    can also be granted permissions in the tenant. For example, you may have an automation
    account that runs maintenance scripts in a subscription, so you will want to have
    specific rights granted to the account that runs the scripts. These rights would
    be applied to the service principal that is created in the Azure AD tenant when
    the automation account is created.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Service principals can also be assigned certificates and secrets that can be
    used for authentication. These credentials will be important to note when we want
    to use the app registrations for privilege escalation, and/or persistence in the
    Azure AD tenant. The process of creating a service principal is called an **app
    registration**.


    In the following screenshot, we can see some basic information about an app registration
    in our sample tenant. As an attacker, we may have situations where it makes sense
    to create a new service principal that would allow us to persist in an environment.
    If we choose a generic display name (Backup Service) for creating a backdoor service
    principal, we may have a better chance of going undetected for longer in the tenant:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_33_0.png)


    Figure 1.6 – Screenshot of a service principal in Azure AD


    Finally, service principals can have owners set within Azure AD. The owners of
    the service principals can control the credentials associated with the accounts,
    so the owners are useful targets for escalation in an environment where service
    principals have elevated privileges.


    # Managed identity


    There are times that Azure services (VMs, AKS, applications, and so on) may need
    access to other Azure resources. The easiest way to grant this access is to enable
    a managed identity for the Azure service. A **managed identity** is an automatically
    created and managed service principal that is assigned to a supported Azure service.
    At the time of writing, there are 27 services that support managed identities
    in Azure.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "> **Important note**\n> \n> If you're interested in learning more about all\
    \ of the services that support managed identities in Azure, Microsoft has them\
    \ documented here:\n> \n> `https://docs.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/services-support-managed-identities`\n\
    \nA managed identity can either be **system-assigned** or **user-assigned**. A\
    \ system-assigned identity is tied directly to the resource that the identity\
    \ is created for. A user-assigned identity is first created in a subscription,\
    \ and then applied to resources. A user-managed identity can be shared by many\
    \ services, while a system-assigned identity cannot.\n\nIn later chapters, we\
    \ will see that these identities can be used to escalate privileges in a tenant.\
    \ The important thing to note for now is that anyone who has modification rights\
    \ on a resource with an assigned managed identity can potentially assume the rights\
    \ of that managed identity. This is service-dependent, but there are several services\
    \ (that we will review later) that can readily be used to generate tokens for\
    \ managed identities.\n\n# Groups\n\n**Groups** are used in Azure AD to organize\
    \ users and to make it easier to manage access to Azure resources. For example,\
    \ it is more effective to assign permissions to 200 users in a group than to 200\
    \ individual users. Once Azure resource access is granted to a group, future access\
    \ can then be granted—or revoked—through group memberships.\n\nSimilar to user\
    \ accounts, groups can either be created by administrators in Azure AD or synchronized\
    \ from an on-premises AD environment. There is also a third scenario, whereby\
    \ users can be allowed to create their own groups, or join existing public groups,\
    \ but those groups are typically associated with Microsoft 365 services.\n\nMuch\
    \ as with app registrations, groups can have owners (either user accounts or service\
    \ principals), and the owners do not have to be a member of the group. Group owners\
    \ can manage the group and its membership.\n\nAzure AD supports two main types\
    \ of groups: security groups that are primarily used to manage access to shared\
    \ resources, and Microsoft 365 groups that serve a similar function to email distribution\
    \ groups that you may be familiar with in AD. These can also be used to assign\
    \ access to Azure resources."
  merge: -1
  img_proc: true
- pgno: 35
  md: "Membership of an Azure AD group can either be **assigned** or **dynamic**.\
    \ Assigned memberships are direct user assignments by an administrator or group\
    \ owner. Dynamic group memberships use rules that are automatically evaluated\
    \ to determine group membership based on user or device attributes. The rules\
    \ for dynamic group membership can allow for soft matching, which could be abused\
    \ to escalate privileges. See the *Dynamic group membership* section in *Chapter\
    \ 1, Exploiting Reader Permissions*, for more information on this attack.\n\n\
    In Azure environments that sync with on-premises AD domains, the complexity of\
    \ organizing users can increase exponentially as there can be a large number of\
    \ groups that are imported from the on-premises domain. While there may be a limited\
    \ number of groups that are actually utilized in the Azure tenant, you may need\
    \ to deal with hundreds (or thousands) of groups that are in an Azure AD tenant.\
    \ This shouldn't cause any issues while assessing the Azure environment, but it\
    \ may complicate things as you begin to pivot to on-premises environments. We\
    \ will cover tools that help simplify assessing AD groups in *Chapter 7, Exploiting\
    \ Owner and Privileged Azure AD Role Permissions*.\n\n# Role definition\n\nAfter\
    \ security principals, the second component of Azure RBAC is a role definition.\
    \ This term describes *a collection of permissions*. A permission describes an\
    \ action that *may or may not* be performed on a resource, such as read, write,\
    \ and delete. We can examine the permissions under a default Azure role to see\
    \ what it allows us to do.\n\nHere are the permissions for the **Contributor**\
    \ role in Azure:\n\n```\n```json\n{\n  \"assignableScopes\": [\n    \"/\"\n  ],\n\
    \  \"description\": \"Grants full access to manage all resources, but does not\
    \ allow you to assign roles in Azure RBAC, manage assignments in Azure Blueprints,\
    \ or share image galleries.\",\n  \"id\": \"/subscriptions/{subscriptionId}/providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c\"\
    ,\n  \"name\": \"b24988ac-6180-42a0-ab88-20f7382dd24c\",\n  \"permissions\": [\n\
    \    {\n      \"actions\": [\n        \"*\"\n```\n```"
  merge: -1
  img_proc: true
- pgno: 36
  md: "```\n],\n\"notActions\": [ \n    \"Microsoft.Authorization/*/Delete\",\n  \
    \  \"Microsoft.Authorization/*/Write\",\n    \"Microsoft.Authorization/elevateAccess/Action\"\
    ,\n    \"Microsoft.Blueprint/blueprintAssignments/write\",\n    \"Microsoft.Blueprint/blueprintAssignments/delete\"\
    ,\n    \"Microsoft.Compute/galleries/share/action\"\n],\n\"dataActions\": [],\n\
    \"notDataActions\": []\n}\n],\n\"roleName\": \"Contributor\",\n\"roleType\": \"\
    BuiltInRole\",\n\"type\": \"Microsoft.Authorization/roleDefinitions\"\n}\n```\n\
    \nWe can see in the preceding permissions that a role definition supports two\
    \ types of operations, as follows:\n\n+   - Control-plane operations that describe\
    \ the management actions that the role can perform. These are defined in the `'actions':\
    \ [ ]` section. An example of a management action is the permission to create\
    \ a storage account.\n+   - Data-plane operations describe the data actions (within\
    \ a resource) that the role can perform. These are defined in the `'dataActions':\
    \ [ ]` section. An example of a data action is the permission to read the data\
    \ that is stored in a storage account.\n\nWe can also see in the preceding permissions\
    \ that certain operations can be excluded for a role. The `'notActions': [ ]`\
    \ section defines management actions that a role is restricted from performing.\
    \ The `'notDataActions': [ ]` section defines data actions that a role is restricted\
    \ from performing."
  merge: -1
  img_proc: true
- pgno: 37
  md: 'In the preceding example for the **Contributor** role, the role has the permission
    to perform all management (*) actions, but it is restricted (by the `notActions`
    definition) from performing authorization-related management actions, which means
    that the role cannot be used to assign permissions to others. Also, the role does
    not have the permissions to perform any data action.


    It should also be noted that this role definition also contains the `assignableScopes`:
    [`/`]` section, which denotes how the role can be applied in the tenant. `/` indicates
    that it can be applied at the root of the management group structure, but it can
    also be applied to any scopes (child management groups, subscriptions, and so
    on) under the root.


    # Default RBAC roles


    At the most basic level, there are three primary roles that are commonly applied
    in Azure: **Reader**, **Contributor**, and **Owner**. Beyond these three primitive
    roles, you will find service-specific roles that act as restricted versions of
    these base roles. These restricted roles are useful for reducing a user''s permissions
    in a specific subscription, but they can still allow for privilege escalation
    in the environment.


    For example, the **Virtual Machine Contributor** role (applied at the subscription
    level) *does not allow* an Azure AD user to be a contributor for all of the services
    in the subscription. However, the role does allow `Microsoft.Compute/virtualMachines/*`
    actions, which means it would allow the user to run commands on any of the VMs
    in the subscription.


    If this VM is configured with a privileged managed identity, that VM Contributor
    user could run commands on the VM to assume the rights of the managed identity
    and escalate their privileges. We will dive deeper into this concept in *Chapter
    5, Exploiting Contributor Permissions on IaaS Services*, where we learn about
    using contributor rights on VMs.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'An important point to note is that Azure resources and the Azure AD tenant
    have separate permission systems. This means that the roles used to grant access
    to Azure AD are different from the roles used to grant access to Azure resources,
    as depicted in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_38_0.png)


    Figure 1.7 – Azure AD roles versus Azure RBAC roles


    Azure AD roles are used to manage access to Azure AD resources and operations,
    such as user accounts and password resets, while Azure RBAC roles are used to
    manage access to Azure resources such as storage accounts, SQL databases, and
    so on.


    Both Azure AD and Azure resources have multiple built-in roles with predefined
    permissions that organizations may use to grant access to users and applications.
    Both support custom roles that are created by administrators. At the time of writing,
    there are currently 60 built-in Azure AD roles and over 220 Azure RBAC built-in
    roles.'
  merge: -1
  img_proc: true
