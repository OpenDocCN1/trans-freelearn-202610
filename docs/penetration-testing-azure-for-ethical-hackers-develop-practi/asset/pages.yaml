- pgno: 163
  md: "# # Exploiting App Service configurations\n\nAzure App Service is the Microsoft\
    \ service for hosting web applications and APIs in the cloud. While we covered\
    \ them at a high level in the last chapter, we will focus here on the specific\
    \ configurations available for a Reader role in a subscription.\n\nIn this section,\
    \ we will look at some important configuration items in both App Service and Function\
    \ apps to further attacks in these services.\n\n# ## Azure App Service apps\n\n\
    The anonymous enumeration of App Service apps was previously covered in *Chapter\
    \ 3, Finding Azure Services and Vulnerabilities*. In this section, we will go\
    \ over how we can find all of the applications using our Reader role access. This\
    \ full list of applications will give us a better surface area to work with and\
    \ may allow us to find an external entry point into the subscription.\n\nUsing\
    \ the portal, it's fairly easy to identify any available app services in the **App\
    \ Service** menu. However, it's much more convenient to gather all of the needed\
    \ information about the applications using PowerShell.\n\nTo gather this information,\
    \ we can use the Az PowerShell module and the following command:\n\n```\nPS C:\\\
    > Get-AzWebApp\n\nGitRemoteName             :\nGitRemoteUri              :\nGitRemoteUsername\
    \         :\nGitRemotePassword         :\nAzureStorageAccounts      :\nAzureStoragePath\
    \          :\nState                     : Running\nHostNames                 :\
    \ {azurepentesting-function.azurewebsites.net}\nRepositorySiteName        : azurepentesting-function\n\
    UsageState                : Normal\nEnabled                   : True\nEnabledHostNames\
    \          : {azurepentesting-function.\n                             azurewebsites.net,\
    \ azurepentesting-function.scm.azurewebsites.\n                             net}\n\
    \                             AvailabilityState\n                            \
    \ : Normal\n\n[Truncated]\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: <!-- no content -->
  merge: -1
