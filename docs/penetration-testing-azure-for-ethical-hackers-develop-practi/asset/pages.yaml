- pgno: 72
  md: "> **Important note**\n> \n> While we did not cover it here, we strongly recommend\
    \ adding **multi-factor authentication (MFA)** requirements for any of your privileged\
    \ Azure accounts. This can be done from the **My Microsoft account** section under\
    \ your user icon (top right of the portal). While we will be creating an intentionally\
    \ vulnerable environment, we would not want you to further put yourself at risk\
    \ by not protecting your administrator accounts. For more information on using\
    \ MFA for your accounts, here's Microsoft's documentation: `https://docs.microsoft.com/en-us/azure/active-directory/roles/security-planning#turn-on-multi-factor-authentication-and-register-all-other-highly-privileged-single-user-non-federated-admin-accounts`.\n\
    \nWe now have a proper administrator account configured in Azure AD, so we can\
    \ move on to setting up the VM that we will be using for the examples.\n\n# Deploying\
    \ a pentest VM in Azure\n\nNow that we have an Azure tenant to deploy resources\
    \ to, we will want to set up a VM to use for testing. This VM will allow us to\
    \ follow the exercises in this book and should provide a clean base for installing\
    \ tools, as compared to trying to install tools on existing systems. For anyone\
    \ looking to implement an Azure base image for automating their own internal team's\
    \ tooling, this should also be useful for that.\n\n# Hands-on exercise: Deploying\
    \ your pentest VM\n\nWe have prepared an **Azure Resource Manager (ARM)** template\
    \ in the GitHub repository of this book. The template will deploy a Windows Server\
    \ 2019 VM with the following applications installed: Git for Windows, **Visual\
    \ Studio Code (VS Code)**, and Docker Desktop."
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Important note


    ARM templates can be a great tool for deploying resources in an Azure environment.
    Since this is a book focusing on attacking (versus building) Azure environments,
    we won’t be covering ARM templates in depth. For more information on ARM templates,
    here’s Microsoft’s documentation: https://docs.microsoft.com/en-us/azure/azure-resource-manager/templates/.


    Here are the tasks that we will complete in this exercise:


    +   - **Task 1:** Initialize the template deployment in GitHub.

    +   - **Task 2:** Configure the parameters and deploy the template to Azure.


    Let’s start the process of deploying our VM, as follows:


    +   1. Open a web browser, and browse to https://bit.ly/azurepentestervm. This
    link will open the GitHub repository that has an ARM template to deploy the penetration
    test VM.

    +   2. In the GitHub repository that opens, click on **Deploy to Azure**, as illustrated
    in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_73_0.png)


    Figure 2.21 – Clicking to begin the deployment process'
  merge: -1
