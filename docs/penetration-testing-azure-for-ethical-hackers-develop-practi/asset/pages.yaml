- pgno: 198
  md: '+   6. Obtain the public IP of `winvm01` with the following command:


    ```

    Get-AzPublicIpAddress -Name winvm01* | Select IpAddress

    ```


    Remember that if a VM does not have a public IP or the RDP port is not open, you
    can always use the Contributor role permissions to expose the service on a public
    IP. This is a major state change in most environments and increases risk, so it
    is not recommended for most environments.


    Here is a screenshot of the command:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_198_0.png)


    Figure 5.11 – Listing the public IP of the VM


    +   7. Connect to the public IP over RDP and authenticate using the username `pentestuser`
    and the password `secretPass123`.


    Congratulations! You have successfully created a local administrator user on a
    VM using the Contributor role.


    This is a very handy feature, but it''s not always the most appropriate tool to
    use during an assessment. Let''s say that we want to be a little more covert in
    our actions during a test. Creating a new local administrator user on a system
    might trigger some alarms. As an alternative, we can use native Azure functionality
    to run commands directly on VMs, without the need for an additional account.


    # Exploiting the Run Command feature


    The Run Command feature of Azure VMs is a platform feature used to run scripts
    on VMs remotely using the VM agent. It can be used to run PowerShell scripts on
    Windows VMs and shell scripts on Linux VMs. It is generally used by administrators
    or developers to quickly diagnose and remediate VM access and network issues and
    get the VM back to a good state.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Here is some information to keep in mind when exploiting this feature:


    +   - Scripts run as the System account on Windows VMs and as an elevated user
    (typically root) on Linux VMs.

    +   - We can only run one script at a time through the feature.

    +   - Interactive scripts that prompt for user information are not supported.

    +   - Outbound connectivity from the VM to Azure public IP addresses on port 443
    is required to return the results of the script.


    The easiest way to get started with the Run Command functionality is from the
    **Virtual machine** blade in the portal (*Figure 5.12*). There are some prebuilt
    commands that can be run in the portal but for our use case, we will want to run
    our own custom commands:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_199_0.png)


    Figure 5.12 – Azure Run command menu'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'By selecting **RunPowerShellScript**, or **RunShellScript** for Linux, we can
    run our own custom commands on the VM. As a proof of concept, we will show the
    whoami command being run:


    Figure 5.13 – Azure Run Command "whoami" execution


    While this may be one of the easiest ways to run commands on a VM, it is not very
    scalable, and the portal is prone to issues in returning command execution results
    to the browser in a timely manner. This can result in truncated command results
    and session timeouts occurring prior to commands finishing execution.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "For example, the simple whoami command that was issued previously took 21 seconds\
    \ to return the output to the browser. While that is a significant amount of time\
    \ for such a simple command, a more complicated and processing-intensive command\
    \ could take much longer (minutes) to return.\n\n# Running commands from the Az\
    \ PowerShell module\n\nFor a more scalable command execution option, we can use\
    \ the Azure PowerShell module to queue up commands on multiple VMs through the\
    \ magic of the PowerShell pipeline. In an Azure-authenticated PowerShell session,\
    \ you can list out the running Windows VMs and cast them to the VMs variable with\
    \ the following command:\n\n```\nPS C:\\> $VMs = Get-AzVM -Status | where {($_.PowerState\
    \ -EQ \"VM running\") -and ($_.StorageProfile.OSDisk.OSType -eq \"Windows\")}\n\
    \nPS C:\\> $VMs | select ResourceGroupName,Name\nResourceGroupName      Name\n\
    -----------------      ----\nDEFAULT                RunCommandTestVM\n```\n\n\
    In the preceding example, we know that the system is running Windows, so we will\
    \ pass a PowerShell ps1 file to the host. We will need to enter our whoami command\
    \ into the ps1 file first:\n\n```\nPS C:\\> echo \"whoami\" > whoami.ps1\n```\n\
    \nTo execute commands, we will need to pass in the resource group and the name\
    \ of the VM that we are running the commands on. Thanks to the magic of the PowerShell\
    \ pipeline, we can pass the VMs variable to the Invoke-AzRunCommand function,\
    \ along with the local script:\n\n```\nPS C:\\> $VMs | Invoke-AzVMRunCommand -CommandId\
    \ 'RunPowerShellScript' -ScriptPath .\\whoami.ps1\n\nValue[0]        :\n    Code\
    \        : ComponentStatus/StdOut/succeeded\n    Level       : Info\n    DisplayStatus\
    \ : Provisioning succeeded\n    Message     : nt authority\\system\nValue[1] \
    \       :\n    Code        : ComponentStatus/StdErr/succeeded\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: '| Level | Info |

    |---|---|

    | DisplayStatus | Provisioning succeeded |

    | Message |  |

    | Status | Succeeded |

    | Capacity | 0 |

    | Count | 0 |


    While this approach is fine for our sample environment, this will attempt to run
    your PowerShell script on all VMs in the subscription. You may want to focus on
    individual VMs for command execution during a normal Azure penetration test.


    This can be done by specifying individual VMs and resource groups, or by using
    the indices of the VMs variable that we created earlier. Remembering that an index
    starts with 0 in PowerShell, we can pass $VMs[0] to our same Invoke-AzRunCommand
    function to run our command on the first VM in the list.


    # Running commands from the Azure REST APIs


    This may be the most difficult way to run commands on VMs, but thankfully there
    are scripts that we can use to make this process easier. Although it is a bit
    of a detour from our standard credentialed Contributor user, we may find ourselves
    in situations where we have access to a token for a managed identity, with the
    Contributor role.


    As covered in the previous chapter, if we have access to a VM that has a managed
    identity, we can generate an access token for that identity that can be used with
    the management APIs. This token can then be used with a script within MicroBurst
    to run commands on other VMs.


    Here is a sample command to obtain an access token that can be used to access
    the Azure management API endpoint:


    ```

    ```bash

    root@LinuxVM:~# curl -H Metadata:true -s \

    ''http://169.254.169.254/metadata/identity/oauth2/token?api-

    version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.

    com%2F'' | jq

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 203
  md: "Here is a screenshot of the command and its output:\n\n```\nroot@LinuxVM:~#\n\
    root@LinuxVM:~# curl -H Metadata:true -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
    \ | jq\n{\n  : \"eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsIn...\"\n}\n```\n\nFigure\
    \ 5.14 – Using curl to query the metadata service\n\nOnce a token is obtained,\
    \ the Invoke-AzVMCommandREST command from the REST section of the MicroBurst toolkit\
    \ can be leveraged to use the obtained token to run commands. The function will\
    \ prompt you to select a subscription and the VMs that you want to run the command\
    \ on. Since the command runs via the REST APIs, we will not be able to see the\
    \ results of the command. To see the direct results of the command, we will need\
    \ to force the VM to call back to us or create some evidence that we ran a command\
    \ on the machine (whoami > test.txt). Here is an example of how to use this method:\n\
    \n```\nPS C:\\> $mgmtToken = \"TOKEN GOES HERE\"\nPS C:\\> Invoke-AzVMCommandREST\
    \ -commandToExecute \"whoami > test.txt\" -managementToken $mgmtToken\n204cce89-27de-4669-a48b-04c27255e05e\n\
    Executing command on target VM: RunCommandTestVM\n```\n\nAfter running this command,\
    \ we can go to the VM and look for the test.txt file on the VM for proof that\
    \ the command ran. In a typical test, we may be more likely to use this method\
    \ of command execution to start a reverse shell connection from the VM.\n\nFrom\
    \ a practical penetration testing standpoint, this method of command execution\
    \ may be one of the most useful methods. As more organizations move their legacy\
    \ applications up into the cloud, there will be more opportunities to exploit\
    \ application servers and collect access tokens from VMs and App Service hosts."
  merge: -1
