- pgno: 300
  md: '# Summary


    In this chapter, we have reviewed the many ways that an attacker may be able to
    pivot up to privileged Azure AD roles in a tenant from a subscription Owner role.
    We also reviewed the ways that an attacker can use Azure AD access to gain rights
    on subscriptions within the tenant. While it''s not always necessary to do so
    in an Azure penetration test, moving between subscriptions and Azure AD can be
    one of the best ways to show the full impact of privilege escalation in an environment.


    In our next (and final) chapter, we will show how you can use this access to create
    persistence opportunities for yourself at all levels of the Azure tenant. From
    virtual machines up through Azure AD, we will review the available options for
    persisting access in an Azure tenant.'
  merge: -1
  img_proc: true
- pgno: 301
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Plan on getting caught


    For any situation where you want to persist in an environment, you should assume
    that your presence will be noticed and that your access will be removed. Your
    initial access vectors should always be considered *short-term resources* that
    allow you to set up additional persistence options. While you may be able to maintain
    access with those initial vectors, they are likely to be the first thing to get
    burned.


    # Have multiple channels ready


    By having multiple access options for an environment, not only do you give yourself
    options for restoring access that gets removed, but you also have multiple channels
    that can confuse anyone doing incident response on the environment. It may be
    easier to hide some of your activities within one account or service by making
    louder noises with a channel that you are willing to burn.


    Let''s take a look at some examples:


    +   - Direct VM command execution using the Run command function with an Azure
    AD user. This is a fairly obvious action that is easy to track back to a single
    user.

    +   - Indirect VM command execution via an Automation Account runbook using the
    Run command function, with the Run as account. This is masked by the Run as account
    and may be less obvious.


    Having both of these command execution options allows you to potentially mask
    your activities with other valid actions in the tenant. Either of these options
    could also be a red flag that could be used to distract the incident response
    team while you complete other actions.


    # Use long-term and short-term channels


    By using long-term persistence channels to create or recover access to your short-term
    channels, you can burn short-term resources, if needed. The long-term persistence
    methods should be privileged (subscription owner, AAD tenant permissions, and
    so on) and allow you to create new resources or assign new rights to the tenant.
    These will be the true persistence methods that help you keep, or recover, overall
    access to the tenant. The long-term channels should also be used sparingly as
    they are crucial for persistence. The less they are used, the less noise there
    will be.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "# Have multiple persistence options at multiple levels\n\nFor any of the persistence\
    \ channels that you create, it is a good idea to have multiple short-term and\
    \ long-term options at each level. This can include multiple resources, users,\
    \ scripts, executables, and any other tools that you might be using. By giving\
    \ yourself options at multiple levels, you will be able to reestablish access\
    \ at multiple levels if access is lost. The aim here is to be sticky with the\
    \ access so that attempts to remove your access are reversible.\n\n> **Important\
    \ Note**\n> \n> As with any good penetration test, documentation is key. Any persistence\
    \ options (or major state changes) that you add to a subscription need to be documented\
    \ as you are creating them. If access to an environment is lost totally, and you\
    \ have no way to clean up your persistence methods, you may end up with a very\
    \ angry environment owner who needs to do some cleanup. Additionally, the **Rules\
    \ of Engagement (RoE)** for the test should outline the tester's ability to make\
    \ any changes to an environment for escalation, persistence, or other purposes.\n\
    \nNow that we understand the general goals and methodology of persisting in an\
    \ Azure environment, let's look at our options for persisting in Azure subscriptions\
    \ and management groups.\n\n# Persisting in an Azure subscription\n\nPersistence\
    \ in an Azure subscription can be established in multiple different services across\
    \ the subscription. This is inclusive of Azure AD account access at the subscription\
    \ (or management group) level, all the way down to the resource level. Since access\
    \ to the broader subscription will be controlled by your identity (User Account,\
    \ Service Principal, Managed Identity), you will want to have options at multiple\
    \ levels to maintain (or regain) your access to these identities.\n\nFor starters,\
    \ we will be looking at how we can gather existing subscription tokens for authenticated\
    \ users. This can be a very practical way of keeping access through normal administrative\
    \ user sessions."
  merge: -1
  img_proc: true
- pgno: 304
  md: "# # Stealing credentials from a system\n\nDepending on what your scope is,\
    \ you may find yourself in an internal network environment or on an Azure VM,\
    \ looking to persist in the tenant. While we could easily make an argument to\
    \ escalate your privileges to a domain administrator account and compromise the\
    \ AD sync server, that may not always be a practical option.\n\nFor a stealthier\
    \ option, you may want to look at utilizing the system of an existing Azure user.\
    \ Once you are on an Azure user's system, you have a couple of options.\n\nIf\
    \ you have access to the actual user account, you may be able to make use of an\
    \ existing Azure portal session in the web browser. Alternatively, the system\
    \ may also be configured to use passthrough **single sign-on (SSO)**, so opening\
    \ `https://portal.azure.com` in Internet Explorer as the user could let you right\
    \ in.\n\n> **Important Note**\n> \n> The technique outlined here has been covered\
    \ on the Lares blog by the following post, written by *Lee Kagan*: `https://www.lares.com/blog/hunting-azure-admins-for-vertical-escalation/`.\
    \ Please refer to the post for additional information on this specific attack.\n\
    \nIf the user has some account restrictions, such as multi-factor authentication\
    \ or conditional access policies, your best bet is to export any existing authentication\
    \ tokens from the Az CLI and/or the Az PowerShell cmdlets. These tokens are typically\
    \ stored in the `c:\\Users\\%USERNAME%\\.Azure` directory on a Windows operating\
    \ system client. Keep in mind that the users that you are attacking may be clearing\
    \ up their cached credentials on their systems, so it's not a guarantee that a\
    \ specific user will have active Azure credentials stored on their system.\n\n\
    # ## Exporting PS/AZ credentials from an Admin system\n\nIf you do not have access\
    \ to the clear-text user account credentials, you can still look for existing\
    \ active tokens in the `.Azure` folder. This will most likely require you to have\
    \ local administrator access to the system, so keep that in mind:"
  merge: -1
  img_proc: true
- pgno: 305
