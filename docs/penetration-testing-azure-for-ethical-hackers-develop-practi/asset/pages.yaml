- pgno: 98
  md: "> **Note**\n> \n> The JSON file we've downloaded here is for the Azure public\
    \ cloud. There is a separate file for the Azure US Government cloud. The file\
    \ can be downloaded from `https://www.microsoft.com/en-us/download/details.aspx?id=57063`.\n\
    \n+   5. In the PowerShell console of your pentest VM, download the JSON file\
    \ using the following commands. Replace `<json_url>` with the URL that you obtained\
    \ in *Step 3*:\n\n```\ncd C:\\Users\\$env:USERNAME\\\\\nInvoke-WebRequest <json_url>\
    \ -O azure_ip_range.json\n```\n\n+   6. For our example, we will use PowerShell\
    \ to filter the public IP address ranges for all the services in the Azure UK\
    \ South region. This will return a list of IP ranges that an attacker could scan\
    \ to determine the open ports and the listening services on those ports:\n\n```\n\
    $jsonData = gc .\\azure_ip_range.json | ConvertFrom-Json\n($jsonData | select\
    \ -ExpandProperty values | where name -EQ AzureCloud.uksouth).properties.addressPrefixes\n\
    ```\n\n+   7. Next, try filtering the public IP address ranges used by a specific\
    \ service (Azure App Service instances) in the UK South region. An attacker could\
    \ obtain these IP ranges and scan them for web application vulnerabilities, as\
    \ Azure App Service resources are typically used to host web applications and\
    \ APIs:\n\n```\n($jsonData | select -ExpandProperty values | where name -EQ AppService.UKSouth).properties.addressPrefixes\n\
    ```\n\n+   8. An attacker could obtain the IP ranges and scan them for open ports\
    \ and listening services to understand the attack surface area. Using the examples\
    \ in *Steps 6 and 7*, try out other queries to identify the public IP ranges for\
    \ other Azure services and regions.\n\n> **Important note**\n> \n> To \"just make\
    \ things work,\" some Azure administrators/engineers may open up wide ranges of\
    \ IPs that have been assigned to different Azure regions to allow virtual machines\
    \ to communicate. This may also allow you to reach those same systems from a VM\
    \ in the right region. If you have authenticated access to the Azure environment,\
    \ keep an eye out for Azure IP ranges in the network security group rules that\
    \ you may be able to take advantage of."
