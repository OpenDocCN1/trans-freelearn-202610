    > Important note

    > Remember to double-check the resource names that you are working with in your
    exercises, to avoid attempting to access a resource that belongs to an Azure customer
    that you are not authorized to access.


    # Custom domains and IP ownership


    Some Azure services allow customers to use custom domains. Additionally, some
    hosts may have redirects or transparent proxies in place to obfuscate the fact
    that the services are hosted in Azure. As part of the penetration testing process,
    you will want to fully understand where your targets live, as it could make a
    major difference in your scope. For example, your external penetration test scope
    may include specific IPs and hostnames for the environment that you are authorized
    to attack. If these hosts end up being in Azure, that will influence how we go
    about attacking those specific resources.


    # Introducing Cloud IP Checker


    Cloud IP Checker is a Go-based tool for checking IP addresses against the published
    Azure IP ranges and service tags. If an IP matches the published range, it displays
    the service that the IP belongs to and its region. The tool can be a published
    API, or it can be self-hosted.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'There are other tools such as the AzureIPCheck tool (https://github.com/daddycocoaman/azureipcheck)
    by Leron Gray (Twitter: @mcohmi), which provides a similar functionality but works
    a bit differently since it''s a Python-based tool.


    **Cloud IP Checker Information**

    **Creator:** Dean Bryen (Twitter: @deanbryen)

    **Open Source or Commercial:** Open source project

    **GitHub Repository:** https://github.com/deanobalino/cloudipchecker

    **Language:** Go


    # Hands-on exercise – determining whether custom domain services are hosted in
    Azure


    In this exercise, we will use the book.azurepentesting.com host from our test
    subscription as our example. To see whether this host is an Azure-hosted system,
    let''s do some basic domain and IP reconnaissance:


    +   1. Within the pentest VM, open the PowerShell console. Use the nslookup command
    to identify the IP address(s) associated with our host:


    ```

    nslookup book.azurepentesting.com

    ```


    +   2. Make a note of the IPv4 address that is returned. Also, notice in the following
    screenshot that the host resolves to azurepentesting.z13.web.core.windows.net,
    which indicates the site is hosted in Azure:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_105_0.png)


    Figure 3.8 – Obtaining the IPv4 address'
  merge: -1
