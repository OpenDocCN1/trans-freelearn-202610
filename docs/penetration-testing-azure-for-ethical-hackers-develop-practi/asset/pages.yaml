    This is what it looks like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_147_0.png)


    Figure 4.13 – Initial import of the PowerZure module


    3. If you installed the Azure AD module, open a new PowerShell session and use
    the following commands to re-import PowerZure into the PowerShell console:


    ```

    ```powershell

    PS C:\> cd C:\Users\$env:USERNAME\PowerZure

    PS C:\> Import-Module .\PowerZure.ps1

    ```

    ```


    After the module is imported, it will list your current role (Reader) and available
    subscriptions. This is useful reconnaissance information:


    +   - **AADRoles:** Shows the role that the current user is assigned in Azure
    AD.

    +   - **AzureRoles:** Shows the Azure RBAC role assignments and scopes for the
    user.

    +   - **Available Subscriptions:** Shows the subscriptions that the user has some
    level of permission to. This information is useful to see whether there are opportunities
    to move laterally to other subscriptions using this user account:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_147_1.png)


    Figure 4.14 – Example PowerZure output'
