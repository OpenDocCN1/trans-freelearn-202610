    4. Finally, we can review the job output to recover the credentials. The certificates
    can be converted back to `pfx` files from the Base64 strings, and the stored credentials
    should be available in cleartext.


    By writing our output this way, we could be unintentionally exposing environment
    credentials to less privileged users. To combat this, the `Get-AzPasswords` function
    generates a certificate to use for encrypting the credentials during transit.
    This prevents any onlookers from retrieving the credentials in cleartext from
    the output logs.


    Let''s see how that process can be automated using the `Get-AzPasswords` function
    in MicroBurst for our next hands-on exercise.


    # Hands-on exercise – Creating a Run as account in the test Automation account


    Since a Run as account crosses the barrier of subscriptions and Azure AD, we are
    unable to programmatically create and attach the accounts to new Automation accounts.
    Thankfully, this process is really simple to complete. Here is the task that we
    will complete in this exercise:


    +   - **Task 1:** Create a Run as account for an Azure Automation account.


    Here are the steps to complete this task:


