- pgno: 225
  md: '# 6

    Exploiting Contributor Permissions on PaaS Services


    In the previous chapter, we explored how the Contributor role can be used to exploit
    Azure resources for **Infrastructure as a Service (IaaS)**-centered scenarios.
    We focused on how the Contributor role''s credentials can be leveraged to escalate
    permissions to the Azure RBAC Owner role, hunt for other credentials, and exfiltrate
    data from virtual machines. In this chapter, we will explore how to achieve similar
    objectives for **Platform as a Service (PaaS)** scenarios. There will be some
    overlap of the general concepts in this chapter, but we will be focusing on how
    these concepts differ as they apply to PaaS scenarios.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In this chapter, we are going to cover the following main topics:


    +   - Preparing for Contributor (PaaS) exploit scenarios

    +   - Attacking storage accounts

    +   - Pillaging keys, secrets, and certificates from key vaults

    +   - Leveraging web apps for lateral movement and escalation

    +   - Extracting credentials from automation accounts


    # Preparing for Contributor (PaaS) exploit scenarios


    To follow along with the exercises in this chapter, you will need to set up a
    user with Contributor permissions and some vulnerable workload configurations
    in your own Azure subscription. As in previous chapters, we have automated this
    using a PowerShell script that you can run from Azure Cloud Shell. Before proceeding,
    ensure that you have run the clean-up scripts to remove resources from previous
    chapters. This will help us avoid any script execution exceptions.


    Here are the tasks that we will complete in this exercise:


    +   - **Task 1:** Create a test user account with Contributor privileges.

    +   - **Task 2:** Deploy vulnerable workloads for all the scenarios.


    Let''s get started:


    +   1. Open a web browser and browse to the Azure portal at `https://portal.azure.com`.
    Sign in with your `azureadmin` credentials.

    +   2. In the Azure portal, click on the **Cloud Shell** icon in the top-right
    corner. Select **PowerShell**:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_226_0.png)


    Figure 6.1 – Click the icon to open Cloud Shell'
  merge: -1
  img_proc: true
- pgno: 227
  md: '+   3. In the PowerShell session within the Cloud Shell pane, run the following
    command to download a script to create a user account with Contributor permissions
    and set up the required vulnerable workloads. Verify the download by listing the
    contents of the directory:


    ```

    PS C:\> Invoke-WebRequest http://bit.ly/contributor-paas-scenarios -O contributor-paas-scenarios.ps1

    PS C:\> Get-ChildItem

    ```


    Here is the destination GitHub URL that the shortened URL points to: `https://raw.githubusercontent.com/PacktPublishing/Penetration-Testing-Azure-for-Ethical-Hackers/main/chapter-6/resources/contributor-paas-scenario.ps1`.


    Here is a screenshot of what it looks like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_227_0.png)


    Figure 6.2 – Download the Contributor PaaS scenario script


    +   4. Run the downloaded script to provision the objects and resources needed
    for the exercises in this chapter using the following command:


    ```

    PS C:\> ./contributor-paas-scenarios.ps1

    ```


    When prompted to enter a password, enter `myPassword123` and press *Enter*. Wait
    for the script deployment to complete. The deployment may take about eight minutes
    to complete:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_227_1.png)


    Figure 6.3 – Run the Contributor IaaS scenario script'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# What does the script do?


    The script creates a user account with Contributor permissions in the Azure subscription.
    The script also sets up the resources and objects shown in Figure 6.4:


    +   - A web app with an associated managed identity

    +   - Azure SQL Database and Azure Storage with firewall rules

    +   - Azure Key Vault with secrets, keys, and certificates

    +   - An Azure Automation account

    +   - An Ubuntu Linux VM:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_228_0.png)


    Figure 6.4 – Contributor PaaS exploits scenario


    5. After the script has finished, the key information that you will need for the
    rest of this exercise will be displayed in the output section. Copy the information
    into a Notepad document for later reference. There are four values that you will
    need from the output section:


    Azure Contributor User: This is the Azure administrator username with Contributor
    permissions to the Azure subscription.


    Azure Contributor User Password: This is the password of the Azure Contributor
    administrator user.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '**Linux VM FQDN:** The FQDN of the Linux VM that will be used to mount an image
    in one of the exercises. This is needed because WSL as implemented on the PentestVM
    does not yet support this.


    **Linux VM Password:** This is the password of the Linux VM that will be used
    to mount an image in one of the exercises:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_229_0.png)


    Figure 6.5 – Obtain the script output


    You have now successfully created the resources that we will work with in later
    exercises in this chapter. The first of the resources that we will explore in
    this chapter is storage accounts.


    # # Attacking storage accounts


    Azure storage accounts are the primary data storage solution in Azure. Other Azure
    services, such as App Service and Container Registry, rely on it for data storage
    in the backend. The solution itself offers five services that can be used to store
    different datasets, including unstructured application data objects (Azure Blob
    Storage), semi-structured application data in a NoSQL store (Azure Table Storage),
    managed file shares in the cloud (Azure Files), a messaging store for reliable
    messaging (Azure Queue Storage), and a data lake for big data workloads (Azure
    Data Lake Storage Gen2). As you can imagine, this service is a prime target for
    attackers! For our purposes in this chapter, we will focus on Azure Blob Storage
    and Azure Files.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_229_1.png)


    Figure 6.6 – Azure Storage'
  merge: -1
  img_proc: true
- pgno: 230
  md: "The Contributor role has permissions to read and modify any configuration on\
    \ the management plane of this service (except for assigning permissions to other\
    \ users) but it does not have inherent access to read or modify data in the data\
    \ plane based on RBAC permissions (Figure 6.7). This may sound confusing but note\
    \ that the Contributor role policy document does not specify any `dataActions`\
    \ permissions:\n\n```\n```json\n\"permissions\": [\n  {\n    \"actions\": [\n\
    \      \"*\"\n    ],\n    \"notActions\": [\n      \"Microsoft.Authorization/*/Delete\"\
    ,\n      \"Microsoft.Authorization/*/Write\",\n      \"Microsoft.Authorization/elevateAccess/Action\"\
    ,\n      \"Microsoft.Blueprint/blueprintAssignments/write\",\n      \"Microsoft.Blueprint/blueprintAssignments/delete\"\
    ,\n      \"Microsoft.Compute/galleries/share/action\"\n    ],\n    \"dataActions\"\
    : [],\n    \"notDataActions\": []\n  }\n]\n```\n```\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_230_0.png)\n\
    \nFigure 6.7 – Azure Contributor permissions\n\nAn Azure AD identity needs to\
    \ be granted additional `dataActions` permissions such as the ones listed in Figure\
    \ 6.8 to access the data plane with an Azure AD access token. As Microsoft moves\
    \ more toward this pattern of exposing service data plane access through Azure\
    \ RBAC, there will be more opportunities to exploit the data plane of services\
    \ in Azure without having to pivot to another option:\n\n| Role | Description\
    \ |\n|---|---|\n| Storage Blob Data Contributor | Allows for read, write and delete\
    \ access to Azure Storage blob containers and data |\n| Storage Blob Data Owner\
    \ | Allows for full access to Azure Storage blob containers and data, including\
    \ assigning POSIX access cont… |\n| Storage Blob Data Reader | Allows for read\
    \ access to Azure Storage blob containers and data |\n| Storage File Data SMB\
    \ Share Contributor | Allows for read, write, and delete access in Azure Storage\
    \ file shares over SMB |\n| Storage File Data SMB Share Elevated Contributor |\
    \ Allows for read, write, delete and modify NTFS permission access in Azure Storage\
    \ file shares over SMB |\n| Storage File Data SMB Share Reader | Allows for read\
    \ access to Azure File Share over SMB |\n| Storage Queue Data Contributor | Allows\
    \ for read, write, and delete access to Azure Storage queues and queue messages\
    \ |\n| Storage Queue Data Message Processor | Allows for peek, receive, and delete\
    \ access to Azure Storage queue messages |\n| Storage Queue Data Message Sender\
    \ | Allows for sending of Azure Storage queue messages |\n| Storage Queue Data\
    \ Reader | Allows for read access to Azure Storage queues and queue messages |\n\
    \nFigure 6.8 – Azure Storage-related roles"
  merge: -1
  img_proc: true
