- pgno: 80
  md: "In this exercise, you deployed a pentest VM in Azure. This is the VM we will\
    \ be using to initiate the attack scenarios that we will be covering in this book.\n\
    \n> **Important note**\n> \n> If you want to take additional steps to lock down\
    \ access to this VM, you can limit RDP access to the VM to your external **Internet\
    \ Protocol (IP)** address. This is considered a best practice and can be done\
    \ in the portal under the VM's **Networking** section in **Inbound security rules**.\
    \ This can also be accessed through the **Network security group** menu.\n\nIn\
    \ the next exercise, we will cover the installation of **Windows Subsystem for\
    \ Linux (WSL)** on the pentest VM.\n\n# Hands-on exercise: Installing WSL on your\
    \ pentest VM\n\nSome of the tools that we will be using for the attack scenarios\
    \ are Linux-based. To avoid having to set up two pentest systems for different\
    \ toolsets, we will be installing **WSL** on the pentest VM that we just deployed.\
    \ WSL will allow us to run a Linux environment directly on Windows without having\
    \ to deploy a traditional VM. Here are the tasks that we will complete in this\
    \ exercise:\n\n+   - **Task 1:** Verify that the Windows build supports WSL.\n\
    +   - **Task 2:** Enable WSL (and reboot the VM).\n+   - **Task 3:** Download\
    \ the Ubuntu 20.04 Linux distribution.\n+   - **Task 4:** Install the Ubuntu 20.04\
    \ Linux distribution.\n+   - **Task 5:** Launch the Linux distribution.\n\nLet's\
    \ install WSL by going through these tasks, as follows:\n\n+   1. Within the RDP\
    \ session to your pentest VM, right-click the **Start** button and click on **Windows\
    \ PowerShell (Admin)**, as illustrated in the following screenshot:"
  merge: -1
  img_proc: true
- pgno: 81
  md: <!-- no content -->
