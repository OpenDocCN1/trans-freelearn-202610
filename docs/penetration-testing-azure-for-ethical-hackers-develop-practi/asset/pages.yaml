- pgno: 106
  md: '+   3. In the PowerShell console, run the following command to determine whether
    an IP address is part of the Azure published IP ranges. Replace `<IP_ADDRESS>`
    with the IP address value that you noted in the previous step:


    ```

    Invoke-WebRequest https://cloudipchecker.azurewebsites.net/api/servicetags/manual?ip=<IP_ADDRESS>\n-UseBasicParsing
    | Select-Object -ExpandProperty Content

    ```


    +   4. As you can see from the preceding output, the IP belongs to an Azure IP
    range (Azure Storage service in the East US region), so we can deduce that the
    service access point is hosted in Azure:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_106_0.png)


    Figure 3.9 – Reviewing Cloud IP Checker results


    Now that we understand how domains and subdomains operate in Azure, let''s look
    at how they can be attacked with subdomain takeovers.


    # Subdomain takeovers


    Discussing Azure platform DNS enumeration would be incomplete without mentioning
    the issue of subdomain takeovers. When investigating applications that are hosted
    in Azure, you may note resource requests that go out to Azure subdomains that
    do not exist.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'This sometimes happens when an application is initially configured to pull
    content from an Azure endpoint, but then the content is changed to a different
    source, and the initial endpoint resource is deleted from the customer’s Azure
    subscription. In some cases, customer-managed DNS records that point to those
    endpoints are also not cleaned up.


    In practice, these are frequently JavaScript files or other similar web resources,
    as they are typically less impactful to displaying a page and not noticed. In
    these cases, an attacker may be able to recreate the affected resource in Azure
    and deliver the missing content through the affected website.


    This is as simple as recreating the endpoint resource in a new Azure account and
    claiming the subdomain for the missing resource:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_107_0.png)


    Figure 3.10 – Subdomain takeover example


    The impact here can be as simple as site defacement, or as impactful as stored
    cross-site scripting or site redirects to malicious content. This is a common
    issue that’s seen in bug bounties and is something to keep an eye out for. The
    most common services that are vulnerable to subdomain takeovers are Azure Blob,
    CDN, Traffic Manager, and App Services, but this could easily apply to other services
    with a public DNS suffix.


    Now that we have learned how custom domains are used in Azure, let’s look at the
    different types of vulnerabilities that we might find in those public-facing systems.'
  merge: -1
  img_proc: true
