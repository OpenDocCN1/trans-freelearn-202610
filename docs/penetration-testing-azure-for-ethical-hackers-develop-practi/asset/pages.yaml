    # Introducing PowerZure


    PowerZure is a PowerShell-based tool for enumerating resources and exploiting
    vulnerable configurations of services within Azure. It consists of multiple built-in
    functions that can be used to gather information about an Azure environment and
    to exploit discovered resources. We will be using some of the functions in this
