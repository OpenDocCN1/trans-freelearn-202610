    Now that we have seen how Cloud Shell can be abused, let''s look at how we can
    gather sensitive information from Azure Key Vaults.


    # Pillaging keys, secrets, and certificates from Key Vaults


    Azure Key Vault is a service for managing application secrets, keys, and certificates
    in the Azure platform (Figure 6.41). The primary use case of Key Vault is to provide
    a secure way for application developers to centrally store sensitive information
    that their code needs to use at runtime without making that information part of
    the code. The sensitive information that is commonly stored in Key Vault could
    be tokens, passwords, data store connection strings, API keys, and other secret
    types.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_251_1.png)


    Figure 6.41 – How applications access the Key Vault'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'As you could imagine, a service like Key Vault is usually a popular target
    for attackers, as it potentially contains information that can be used to move
    laterally in an attack chain or used to decrypt encrypted information.


    Access to a Key Vault resource is controlled through two planes (Figure 6.42)
    – the management plane, which has an endpoint of `management.azure.com`, and the
    data plane, which has an endpoint of `<vault-name>.vault.azure.com` (Figure 6.42).
    The **management plane** is the endpoint that administrators interact with to
    perform administrative operations, such as creating and deleting Key Vault instances,
    retrieving Key Vault properties, and updating access policies.


    The **data plane** is the interface that applications interact with to access
    the sensitive information stored in the vault (secrets, keys, and certificates).
    The operations that can be performed on this plane include reading, adding, deleting,
    or modifying keys, secrets, and certificates.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_252_0.png)


    Figure 6.42 – Management plane versus data plane access


    Both the management plane and the data plane use **Azure Active Directory (Azure
    AD)** for authentication but their authorization works differently. The management
    plane uses **Azure role-based access control (Azure RBAC)** management permissions,
    and the data plane uses a Key Vault access policy, but it can also use Azure RBAC
    data permissions (see the following note). Microsoft deliberately went for this
    approach to allow organizations to be able to separate roles that need management
    level permissions from roles that needs access to sensitive information. The thinking
    here is that access to the management plane should not necessarily give access
    to the data plane.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '> **Important Note**

    > At the time of this book''s writing, there is a newly released feature that
    allows Azure RBAC to be used to control authorization to the data plane. Microsoft
    has added nine new service level roles, including Key Vault Administrator, Key
    Vault Certificates Officer, and Key Vault Crypto Officer, that grant permissions
    to perform different levels of operations on the data plane. Keep these roles
    in mind during your recon activities.


    From an attack perspective, the Contributor role does not have any permissions
    to the data plane of Key Vault resources by default. However, we could leverage
    the permission that it has to update access policies to escalate privileges to
    the data plane – `Microsoft.KeyVault/vaults/accessPolicies/write`. Tools such
    as MicroBurst, PowerZure, and Lava exploit this functionality to dump out sensitive
    information in Key Vault resources.


    When reviewing key vaults, it is important to first look at the access policies
    to see if your current user account has rights to the vaults. If your user does
    not have rights to the vaults and you are attempting to stay under the radar,
    you may want to look at how you can access the vaults with other authorized security
    principals. In many cases, these rights are applied to automation `Run as` accounts
    (see later in this chapter), app registrations, and/or managed identities.


    Here are some options for using alternative principals to access key vaults:


    +   - **Automation accounts**: Create a new runbook that uses the `Run as` account
    to access the key vault.

    +   - **App registrations**: Authenticate as the app registration and access the
    key vault.

    +   - **Managed Identities**: Generate REST API tokens for the identity to access
    the key vault with.


    Each of these options have very different ways of allowing you to access the vaults,
    but they may be a stealthier option for accessing the vaults, compared to changing
    the access policies.


    In the next hands-on exercise, we will use MicroBurst to exploit Key Vault resources
    at scale using the Contributor role.'
  merge: -1
  img_proc: true
