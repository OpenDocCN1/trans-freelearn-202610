- pgno: 262
  md: "This interface is the Kudu (`https://github.com/projectkudu/kudu`) service,\
    \ which can allow for a number of different attack options. This interface has\
    \ CMD and PowerShell consoles, a file browser, and exports of all the environmental\
    \ settings and variables.\n\nAdditionally, this interface is available without\
    \ authenticating to Azure AD. By accessing the affected site on the `https://$APP_NAME.scm.azurewebsites.net/basicauth`\
    \ page, you can just enter the credentials from the publish profile. This is really\
    \ handy if you need to regain access to a subscription.\n\n> **Important Note**\n\
    > \n> While we have covered some of the lateral movement options in this chapter,\
    \ one of the authors has previously put together a blog post that goes into more\
    \ depth on some of these techniques: `https://blog.netspi.com/lateral-movement-azure-app-services/`.\n\
    \nAs a final note for this section, we will mention that App Service applications\
    \ frequently have managed identities attached to them. Since we previously covered\
    \ escalating privileges using managed identities (*Chapter 5, Exploiting Contributor\
    \ Permissions on IaaS Services*), we wanted to note it here as an option to look\
    \ out for when attacking App Service applications. The application created for\
    \ the chapter scenarios does have an attached managed identity, and while we don't\
    \ have an exercise for it, you can still practice your managed identity exploitation\
    \ skills with the example App Service app.\n\nMoving on to the final section of\
    \ this chapter, we will review Automation Accounts and how we can extract credentials\
    \ from them.\n\n# Extracting credentials from Automation Accounts\n\nOne of the\
    \ goals associated with many cloud environments is automation. This could be as\
    \ simple as automating system configuration changes and patch management, or as\
    \ complex as automatically rotating SSL certificates on web applications and storing\
    \ them in key vaults.\n\nThese actions may be accomplished by running code in\
    \ an Automation Account in a **runbook**. These runbooks are just code blocks\
    \ stored in the Automation Account. The code can be in PowerShell or Python (2\
    \ or 3), and the in-browser editor makes it really easy to integrate common Azure\
    \ management functions into the code."
