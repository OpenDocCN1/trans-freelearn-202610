- pgno: 40
  md: '# Azure portal


    The Azure portal is a web-based console for accessing and managing Azure resources.
    The URL for the Azure public cloud platform is `https://portal.azure.com`. As
    noted at the start of the chapter, the address is different for other Azure clouds,
    such as those for the US government, China, and Germany.


    A user has to first authenticate using an Azure AD user account to gain access
    to the portal. For those of you that are visual learners, the Azure portal will
    be the best starting point for understanding the resources in an Azure tenant.


    Within the portal, there are **blades** on the left-hand side of the site for
    each Azure service, as illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_40_0.png)


    Figure 1.8 – Azure portal navigation'
  merge: -1
  img_proc: true
- pgno: 41
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Depending on the tenants that your account has access to, you may see more
    than one directory here. These are the different Azure AD tenants that you have
    (direct membership or guest) access to. Once a directory is selected, you can
    navigate to the **Subscriptions** blade to see the subscriptions that you have
    access to, as illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_42_0.png)


    Figure 1.11 – Azure subscriptions list


    In the **Subscriptions** section, take note of the **My role** column, as this
    will let you know your current user''s RBAC role in the subscription. Within the
    individual subscriptions, you can also use the **IAM** blade to see the rights
    of other users in the subscription.


    # Cloud Shell


    Within the portal, there is a small PowerShell prompt >_ icon available to the
    right of the search bar. This icon activates the Azure Cloud Shell within the
    portal. This can also be accessed via `https://shell.azure.com` and is shown in
    the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_42_1.png)


    Figure 1.12 – Azure Cloud Shell portal link'
  merge: -1
  img_proc: true
- pgno: 43
  md: "If a Cloud Shell has not already been set up for your account, this will require\
    \ you to select a storage account to use for Cloud Shell storage. Once in the\
    \ Cloud Shell, your prompt should look like this:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_43_0.png)\n\
    \nFigure 1.13 – Azure Cloud Shell\n\nWhen setting up your Cloud Shell, you can\
    \ choose a Bash or PowerShell environment. Both environments have their benefits\
    \ and they both have the Az CLI ready to use in the shell.\n\nWhile the Azure\
    \ Cloud Shell is preloaded with all of tools you need to manage an Azure environment,\
    \ it also comes with some risks. We will see in later chapters how this service\
    \ can be used for privilege escalation attacks.\n\n# Azure CLI\n\nAnother popular\
    \ option for managing Azure environments is the Azure CLI. Installation of the\
    \ CLI is simple for Windows systems. Keep in mind that we will be installing the\
    \ CLI as part of the next chapter's exercises, but if you want to install the\
    \ CLI on another system, you can download the Microsoft installer for the latest\
    \ version here: `https://aka.ms/installazurecliwindows`.\n\n> **Important note**\n\
    > \n> Since the preceding link is for an executable, it's understandable if you're\
    \ not immediately rushing to open it. As a general note, we will be using more\
    \ of these links throughout the book to connect you with Microsoft resources.\n\
    > \n> The aka.ms links in the book should be safe to follow, as they are all managed\
    \ by Microsoft's internal short-link service."
  merge: -1
  img_proc: true
