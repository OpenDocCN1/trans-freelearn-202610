- pgno: 330
  md: 'To identify this event, security operations teams can look for the `Add application`
    or `Add service principal` activity types or operations in the Azure AD audit
    log (**Azure portal → Azure AD → Audit Logs**).


    # Inviting a Guest User Identity into the Tenant


    Another way to obtain a backdoor identity for an Azure AD tenant is to invite
    a guest user account. This can be trickier if the collaboration restrictions setting
    is set to the most restrictive option, as shown in the following screenshot. This
    setting can be found in **Azure portal → Azure AD → User settings → Manage external
    collaboration settings → Collaboration restrictions:**


    ![](img/4fa338e84e0a590967a142dd798ba4e2_330_0.png)


    Figure 8.28 – Verifying the external collaboration settings


    If this is the case, attempting to modify this option to add another domain is
    likely to trigger an alarm, as organizations that configure this option are most
    likely to be monitoring modifications to the list. Collaboration restriction modification
    events are logged as `Add policy` operations in the Azure AD audit log.


    If the setting has been configured for the most inclusive option, we could invite
    users from generic domains such as `outlook.com` and `gmail.com` into the tenant.
    By default, any user or guest user can be used to invite external identities into
    the tenant (*Figure 8.29*)!


    This setting can be found in **Azure portal → Azure AD → User settings → Manage
    external collaboration settings → Guest invite settings:**


    ![](img/4fa338e84e0a590967a142dd798ba4e2_330_1.png)


    Figure 8.29 – Verifying the guest invitation settings'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'One thing to be aware of is that organizations following good security practices
    could have an overall conditional access policy applied to all guest identities
    (*Figure 8.30*) to block them from accessing sensitive applications. If this is
    the case, we could look at options to bypass this, if we have sufficient permissions
    to modify conditional access policies. We will cover this later in this chapter:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_331_0.png)


    Figure 8.30 – Conditional access policy for external users


    As many organizations are likely to keep a closer eye on external identities in
    their tenants, this option may easily raise suspicions. To identify this event,
    security operations teams can look for the `Invite external user` activity type
    or operation in the Azure AD audit log (**Azure portal → Azure AD → Audit Logs**).


    # Modifying existing identities


    As an alternative option for obtaining a backdoor identity, we will look at modifying
    existing Azure AD identities that will persist in an account. Since changing a
    password for an existing active account is a pretty obvious change, we will start
    by changing the credentials of disabled user accounts.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Enabling a disabled user identity and resetting their password


    A less suspicious method to establish a backdoor identity for an Azure AD tenant
    is to look for existing identities that are disabled, enable them, and reset their
    passwords. To enable disabled user accounts, the permission highlighted in the
    following table is needed. The built-in roles listed in the **Azure AD Role**
    column have this permission. From a pentesting perspective, we need to be cautious
    as an identity could be disabled because it has been compromised previously:


    | Method | Permission Needed | Azure AD Role |

    |---|---|---|

    | Enable disabled user identity | `microsoft.directory/users/enable` | • User
    Administrator<br>• Global Administrator<br>• Custom roles cannot currently be
    used |


    Table 8.3 – Roles for enabling disabled user identities


    After enabling a user identity, password reset permissions in Azure AD depend
    on the role of the user that is being reset. These permissions are separated between
    administrator roles (global admin, authentication admin, and so on) and non-administrator
    user types.


    Here are the built-in roles that can reset user passwords in Azure AD listed in
    ascending order of privilege:


    +   - **Password Administrator:** Can reset passwords for non-administrators and
    other password administrators

    +   - **Helpdesk Administrator:** Can reset passwords for non-administrators,
    password administrators, and other helpdesk administrators

    +   - **Authentication Administrator:** Can reset passwords for non-administrators,
    password administrators, and other authentication administrators

    +   - **User Administrator:** Can reset passwords for non-administrators, groups
    administrators, helpdesk administrators, password administrators, and other user
    administrators

    +   - **Privileged Authentication Administrator:** Can reset passwords for all
    non-administrators and administrators

    +   - **Global Administrator:** Can reset passwords for all non-administrators
    and administrators'
  merge: -1
  img_proc: true
- pgno: 333
  md: "If you need temporary access to a privileged account to achieve your persistence\
    \ goals, keep in mind that you will need a privileged role to reset the credentials\
    \ of the targeted account. For example, you may want to use a long-term persistence\
    \ account to reset the password of a privileged user for short-term persistence\
    \ activities in the tenant. This path may allow temporary access to the resources\
    \ of the other account, but it should be pretty easy for defenders to trace the\
    \ account that initiated the password resets.\n\n> **Important Note**\n> \n> The\
    \ role descriptions that are listed here come from the following Microsoft documentation\
    \ page: `https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference#password-reset-permissions`.\
    \ This page has a very handy table that outlines which roles have rights to reset\
    \ the passwords of other roles in the Azure AD tenant.\n\n# Adding a secret to\
    \ an existing service principal\n\nAnother less suspicious way to establish a\
    \ backdoor identity for an Azure AD tenant is to add a password to an existing\
    \ service principal. This was one of the methods that you practiced in *Chapter\
    \ 4, Exploiting Reader Permissions*, using PowerZure. To perform this operation,\
    \ an account that owns the service principal is needed or an account that has\
    \ the permission highlighted in the following table. The built-in roles listed\
    \ in the Azure AD Role column have this permission:\n\n| Method | Permission Needed\
    \ | Azure AD Role |\n|---|---|---|\n| Add a secret to an existing service principal\
    \ | `microsoft.directory/servicePrincipals/credentials/update` | • Application\
    \ Administrator<br>• Hybrid Identity Administrator<br>• Global Administrator<br>•\
    \ Custom roles cannot currently be used |\n\nTable 8.4 – Roles for adding a secret\
    \ to service principals\n\nNow that we have established how to access identities\
    \ for persistence, let's look at how we can assign privileged roles to these identities."
  merge: -1
  img_proc: true
- pgno: 334
