    $Cert = $RunAsCert.Export(''pfx'',''CertificatePassword'')

    Set-Content -Value $Cert -Path $CertificatePath -Force

    -Encoding Byte | Write-Verbose

    $base64string = [Convert]::ToBase64String([IO.File]::ReadAllBytes(''$CertificatePath''))

