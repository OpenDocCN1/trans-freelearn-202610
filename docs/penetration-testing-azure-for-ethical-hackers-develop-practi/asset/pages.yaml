    # Hands-on exercise: Creating an Azure admin account


    To follow many of the hands-on exercises in this book, you will need to set up
    "vulnerable by design" users and services in your Azure tenant and subscription.
    To facilitate this, we will be providing scripts and templates that you will need
    to run from Azure Cloud Shell.'
