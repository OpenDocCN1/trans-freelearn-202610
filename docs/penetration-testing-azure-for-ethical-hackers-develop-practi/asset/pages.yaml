- pgno: 61
  md: 'Although the user used to set up the tenant will already have global administrator
    rights on the tenant, we will create a separate admin user (azureadmin) with access
    to Azure AD and the Azure tenant. This user will be a global administrator account,
    so make sure that you set a strong password! This username will also be kept consistent
    in the examples later in the book to allow us to standardize on one username.


    As a general rule, we would discourage the assignment of privileged roles to daily-use
    accounts in Azure, but for the purposes of our exercises, this will help us to
    exploit some future scenarios.


    Here are the tasks that you will complete in this exercise:


    +   - **Task 1:** Sign up for the Azure AD Premium P2 trial.

    +   - **Task 2:** Create a new user in Azure AD.

    +   - **Task 3:** Grant the user the **Owner** role assignment in your Azure subscription.


    Let''s create our Azure Admin account, as follows:


    +   1. Using the authenticated web browser session from the previous exercise,
    click the portal menu icon in the top-left corner and select **Azure Active Directory**,
    as illustrated in the following screenshot:


