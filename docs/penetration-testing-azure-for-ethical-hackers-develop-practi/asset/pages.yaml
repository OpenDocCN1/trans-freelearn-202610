    # Hands-on exercise – gathering subscription access information with PowerZure


    In this exercise, we will download PowerZure on the pentest VM and import it into
    our PowerShell session. Here are the tasks that we will complete in this exercise:


    +   - **Task 1:** Download PowerZure.

    +   - **Task 2:** Import the `Powerzurre.ps1` module.

    +   - **Task 3:** Run the `Get-AzureTargets` function to review user permissions.

    +   - **Task 4:** Review the gathered information.


    Let''s begin:


    +   1. In an Az PowerShell module-authenticated PowerShell session on your pentest
    VM, download PowerZure using the following commands:


    ```

    PS C:\> cd C:\Users\$env:USERNAME

    PS C:\> git clone https://github.com/hausec/PowerZure.git

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_146_1.png)


    Figure 4.12 – Cloning the PowerZure GitHub repository'
