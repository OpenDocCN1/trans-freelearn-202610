- pgno: 55
  md: '# 2


    # Building Your

    # Own Environment


    To fully follow the content of this book, you will need access to an Azure environment
    and a penetration testing **virtual machine (VM)** that you can use to simulate
    using the tools, techniques, and procedures for exploiting an Azure environment.
    By following along with the hands-on examples in the book, you will gain a valuable
    insight into practically exploiting vulnerabilities in a real-world environment.
    On the plus side, Microsoft is eager to have people try out Azure, so it''s easy
    to set up a free trial in Azure to help keep your costs down.


    This chapter will provide guidance on setting up your own Azure tenant and a penetration
    testing VM with the necessary tools installed.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "In this chapter, we will go through the following main topics:\n\n+   - Creating\
    \ a new Azure tenant\n+   - Deploying a pentest VM in Azure\n+   - Azure penetration\
    \ testing tools\n\nLet's get started!\n\n# Technical requirements\n\nWhile having\
    \ an Azure account is free, running resources within the account is not. Please\
    \ take note of any potential costs that may be incurred by running these test\
    \ resources in your subscription. At this time, Microsoft does offer a free trial\
    \ credit on new accounts and free tier services, but that may not cover all the\
    \ resource costs associated with running the examples. For more information on\
    \ the Azure free tier of products, visit Microsoft's site at https://azure.microsoft.com/en-us/free/free-account-faq/.\n\
    \n> **Important note**\n> \n> As an extra post-setup precaution, make sure that\
    \ you set alerts for your subscription to ensure that you do not overspend in\
    \ Azure. This can be done in the **Cost alerts** section under the **Subscription**\
    \ blade or through the **Cost Management + Billing** blade from the search bar.\
    \ This is particularly helpful for when the trial period ends and you may still\
    \ have services running.\n\nAt the time of writing, the VM template that's provided\
    \ in this chapter will cost about $5 (US Dollars/USD) per day to run. If you want\
    \ to maximize your trial credit or reduce your overall spend, make sure you pause\
    \ or shut down any running resources when you are not using them. But before we\
    \ start worrying about VMs and subscription costs, we will need to set up an Azure\
    \ tenant to store our subscriptions"
  merge: -1
  img_proc: true
