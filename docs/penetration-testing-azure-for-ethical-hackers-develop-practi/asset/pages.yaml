- pgno: 45
  md: "For starters, use the `az` command to list out the available options, as follows:\n\
    \n```\n```text\nPS C:\\ > az\n /\\\\\n /  \\\\    ______    __  ______  __\n /\
    \ /\\\\ \\\\ |__  / | | | | \\__/_/__\\\\\n/ ____ \\\\ / /| | | | | |  __/\n/_/\
    \    \\\\_/___| |___| \\____|\\\n\nWelcome to the cool new Azure CLI!\nUse `az\
    \ --version` to display the current version.\nHere are the base commands:\n  \
    \  account : Manage Azure subscription information.\n    acr : Manage private\
    \ registries with Azure Container\nRegistries.\n    ad : Manage Azure Active Directory\
    \ Graph entities needed\nfor Role Based Access Control.\n    advisor : Manage\
    \ Azure Advisor.\n    [Truncated]\n```\n```\n\nTypically, the commands that you\
    \ will run in the CLI will be related to the service name (acr, appservice, vm),\
    \ and then an action that you want to take.\n\nFor example, here's how you would\
    \ list out resources in your default subscription:\n\n```\n```text\nPS C:\\ >\
    \ az resource list\n```\n```\n\nIf you need ideas for options on the commands\
    \ that you might be able to run, use the `--help` flag to list out your available\
    \ options.\n\nThis is a powerful tool to use for managing Azure, and we will be\
    \ using it for a few of the book examples in future chapters. That being said,\
    \ most of our examples will be focused on the Azure PowerShell modules and on\
    \ tools that utilize them. Before we dive into the specific modules, we want to\
    \ make sure that we have a basic understanding of Microsoft's PowerShell programming\
    \ language."
  merge: -1
  img_proc: true
