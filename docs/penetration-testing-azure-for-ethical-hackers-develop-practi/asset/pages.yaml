- pgno: 91
  md: '# 3

    Finding Azure Services and Vulnerabilities


    As a penetration tester, you may be tasked with anonymously attacking an Azure
    tenant as part of your assessment. From a scope perspective, this can be tricky.
    Anyone can name an Azure service whatever they want, and it may be hard to find
    resources that are truly in scope. Regardless of whether you are chasing a bug
    bounty or shadow IT assets during a penetration test, anonymous Azure service
    discovery can be a helpful tool in identifying vulnerabilities in an environment.


    In this chapter, we will cover attacks for Azure that do not require any authentication
    to an Azure tenant. Additionally, these will be attacks that you can use to gain
    initial access to an Azure tenant. We will also touch on multiple open source
    toolkits that are currently available for assessing Azure services for vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "Specifically, in this chapter, we will be covering the following sections:\n\
    \n+   - Guidelines for Azure penetration testing\n+   - Anonymous service identification\n\
    +   - Identifying vulnerabilities in public-facing services\n+   - Finding Azure\
    \ credentials\n\n# Technical requirements\n\nFor this chapter, we will want to\
    \ make use of the virtual machine that we set up in *Chapter 2, Building Your\
    \ Own Environment*. If you did not set up your own environment, make sure that\
    \ you have local administrator access on a Windows system with PowerShell. While\
    \ you don’t absolutely need a Windows desktop to understand the content of this\
    \ chapter, the authors recommend spinning up an Azure virtual machine (as described\
    \ in the previous chapter) to test out the tools and techniques that we will introduce.\n\
    \n# Guidelines for Azure penetration testing\n\nFrom June 2017, *Microsoft no\
    \ longer requires organizations to obtain pre-approval to conduct a penetration\
    \ test against their Azure resources* (`https://docs.microsoft.com/en-us/azure/security/fundamentals/pen-testing`).\
    \ It is important to note that this exemption does not apply to other Microsoft\
    \ cloud services, such as Office 365. Even though you do not need to notify Microsoft\
    \ before you perform a penetration test, there are still stated *rules of engagement*\
    \ that you must always comply with, and you absolutely should not cross these\
    \ boundaries. Failure to comply could lead to a suspension or termination of your\
    \ Azure account, legal action brought against you by Microsoft, and financial\
    \ liability claims being made against you!\n\n> **Important note**\n> \n> As these\
    \ guidelines are occasionally updated, we recommend that you visit `https://www.microsoft.com/en-us/msrc/pentest-rules-of-engagement`\
    \ to review the latest information.\n\nThe following activities are prohibited:\n\
    \n+   - Scanning assets that belong to *other Azure customers*.\n+   - Gaining\
    \ access to any *data that is not yours*."
  merge: -1
  img_proc: true
- pgno: 93
  md: '+   - Performing any kind of denial of service testing is strictly forbidden
    as it may result in *unplanned downtime for other Azure customers.*

    +   - Attempting phishing or other social engineering attacks against Microsoft
    employees.


    The following activities are allowed:


    +   - Scanning your Azure endpoints to uncover application or configuration vulnerabilities

    +   - Port scanning and fuzz testing your Azure endpoints


    In general, any activity that could impact other Azure customers or the stability
    of the underlying Azure infrastructure is not allowed (including testing and accessing
    other customers'' data without permission). Testing your Azure endpoints and the
    applications hosted on them is encouraged.


    # Azure penetration test scopes


    Penetration tests in Azure can come in a variety of different scopes. Depending
    on how your organization determines the threats to the environment, and how they
    define a *penetration test*, there may be different goals for the test.


    Common Azure penetration test scopes include the following:


    +   - Anonymous external testing

    +   - Read-only configuration review

    +   - Internal network testing

    +   - Architecture review


    Many times, an Azure penetration test will consist of any combination of these
    scopes. In any case, we will want to get written legal approval from the owners
    of the Azure assets before we start testing. Like any other penetration test,
    *having a clearly defined scope and methodology is crucial to the success of the
    project.*


    For those that are approaching this content from a bug bounty standpoint, this
    chapter will provide you with plenty of options to go after Azure targets from
    an external perspective. Just like any other test, it is always good to make sure
    that the Azure targets fall within the scope of the bug bounty program that you
    are working on.


    In the rest of this chapter, we will start with anonymous enumeration and testing
    Azure services. Then, we will look at attack scenarios that can help us acquire
    an Azure Active Directory account in the tenant.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Anonymous service identification


    Now that we have a basic understanding of Azure infrastructure and the available
    scopes for an Azure penetration test, let''s get started with some practical attacks.
    In this section, we will cover how we can anonymously identify internet-facing
    services that are hosted in Azure. Given that many organizations are making use
    of Azure services, this will be applicable for any external test, regardless of
    the cloud.


    # Test at your own risk


    For the purposes of this book, we will have some real resources (that the authors
    are hosting) in the examples that you can use for testing these tools. All the
    examples in this book, unless noted otherwise, will point to resources that you
    are authorized to follow the examples with.


    > **Important note**

    > Do not run the tools or examples in this book against systems or services that
    you do not have authorization to test. Hopefully, we have made this abundantly
    clear by now.


    We will try to call out specific examples of *dangerous scope* for each attack.
    When in doubt, ask the owner of the resources that you are testing to see whether
    a resource that you have enumerated anonymously is owned by the organization.


    # Azure public IP address ranges


    Like other public cloud providers, Microsoft Azure allows organizations to assign
    internet-accessible IP addresses to Azure resources. A public IP address can be
    allocated to the following Azure resources: a virtual machine network interface,
    an internet-facing load balancer, a VPN gateway, an application gateway, or an
    Azure firewall instance (Figure 3.1).


    When public IP addresses are allocated, they can either be *static* or *dynamic*.
    Dynamic public IP addresses can change over the lifespan of the Azure resource,
    while static public IP addresses will not change over the lifespan of the Azure
    resource:'
  merge: -1
  img_proc: true
