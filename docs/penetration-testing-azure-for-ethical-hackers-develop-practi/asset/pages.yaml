- pgno: 306
  md: '# # Hands-on exercise – stealing and reusing tokens from an authenticated Azure
    admin system


    In this exercise, we will be exporting cached tokens from the system of an authenticated
    Azure admin user and reusing those tokens on our pentest VM. Here are the tasks
    that we will complete in this exercise:


    +   - **Task 1:** Authenticate to our Azure tenant with the Az PowerShell module.

    +   - **Task 2:** Confirm access (list subs).

    +   - **Task 3:** Use the `Save-AzContext` command.

    +   - **Task 4:** Copy the context files to another system for use elsewhere.


    Let''s get started:


    +   1. In the PowerShell session within the Cloud Shell pane, run the following
    commands to download and verify a script to provision the scenario for this exercise:


    ```

    Invoke-WebRequest -Uri http://bit.ly/admin-token-theft-scenario

    -OutFile admin-token-theft-scenario-windows.ps1


    Get-ChildItem

    ```


    The following screenshot shows the output:


