- pgno: 82
  md: 'Here''s what the output will look like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_82_0.png)


    Figure 2.31 – Verifying the Windows build version


    +   3. Enable WSL using the following command. When prompted to restart the VM,
    type **Y** and press *Enter*. Wait for a few minutes for the VM to restart, connect
    back to it using RDP, and open the PowerShell console as an administrator:


    ```

    ```powershell

    Enable-WindowsOptionalFeature -Online -FeatureName

    Microsoft-Windows-Subsystem-Linux

    ```

    ```


    Here is what the output will look like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_82_1.png)


    Figure 2.32 – Enabling WSL with PowerShell


    +   4. Change directories to your user''s directory (either `C:\Users\$env:USERNAME\`
    or `~` will work) and download the Ubuntu 20.04 distribution using the following
    command:


    ```

    ```powershell

    cd C:\Users\$env:USERNAME\

    Invoke-WebRequest -Uri https://aka.ms/wslubuntu2004

    -OutFile Ubuntu.appx -UseBasicParsing

    ```

    ```


    +   5. Verify the download using the following command:


    ```

    ```powershell

    Get-ChildItem

    ```

    ```


    Here is what the output will look like:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/4fa338e84e0a590967a142dd798ba4e2_83_0.png)


    Figure 2.33 – Verifying the downloaded Linux distribution


    6. Extract the downloaded distribution using the following commands:


    ```

    Rename-Item .\Ubuntu.appx .\Ubuntu.zip

    ```


    ```

    Expand-Archive .\Ubuntu.zip .\Ubuntu

    ```


    7. Install the extracted Linux distribution with the following commands. The installation
    will take a few minutes to complete:


    ```

    Set-Location .\Ubuntu\

    ```


    ```

    .\ubuntu2004.exe

    ```


    8. When prompted to enter credentials for the Linux installation, complete the
    following:


    +   - Enter new UNIX username: pentestadmin.

    +   - New password: To keep things simple, enter the same password that you used
    for your pentest VM.

    +   - Retype new password: Re-enter the same password.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'This is illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_84_0.png)


    Figure 2.34 – Configuring the credentials for WSL


    +   9. Apply updates to the Linux installation using the following command. Enter
    the password that you just configured when prompted:


    ```

    ```bash

    sudo apt update -y

    ```

    ```


    +   10. You can close the PowerShell console. To use WSL going forward, all you
    need to do is to type bash and press *Enter* in either the PowerShell console
    or the command-line console of your pentest VM.


    In this exercise, you enabled WSL on your pentest VM. In the following exercises,
    we will cover installing the Azure PowerShell modules and the Azure **command-line
    interface (CLI)** needed by other pentest tools we will be using in the book.


    # Hands-on exercise: Installing the Azure and Azure AD PowerShell modules on your
    pentest VM


    As mentioned in the first chapter, **Azure PowerShell** is a module that administrators
    and developers can add to PowerShell to connect to Azure subscriptions and manage
    Azure resources. **Azure AD PowerShell** is a module that IT professionals use
    to manage Azure AD. Both modules contain useful commands that penetration testers
    can use to perform enumeration of target environments. Azure-specific pentest
    tools such as **MicroBurst** and **PowerZure** also require these modules to be
    installed.


    In this exercise, we will install both modules on our pentest VM. Here are the
    tasks that we will be completing:


    +   - **Task 1:** Verifying that PowerShellGet is installed

    +   - **Task 2:** Configuring the PowerShell gallery as a trusted repository'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   - **Task 3:** Installing and verifying the Azure PowerShell module

    +   - **Task 4:** Installing and verifying the Azure AD PowerShell module


    Let’s install Azure PowerShell and Azure AD PowerShell, as follows:


    +   1. Open PowerShell as an administrator on your pentest VM.

    +   2. Verify that PowerShellGet is installed using the following command:


    ```

    Get-Module -ListAvailable PowerShellGet

    ```


    Here is what it will look like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_85_0.png)


    Figure 2.35 – Configuring the PowerShell gallery as a trusted repository


    +   3. Both modules that we will install will be downloaded from the PowerShell
    gallery repository. To avoid getting messages about the trust level of the repository,
    we can use the following command to configure it as a trusted repository. When
    prompted to install NuGet provider, type Y for yes and then press Enter:


    ```

    Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

    ```


    Here is what it looks like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_85_1.png)


    Figure 2.36 – Configuring the PowerShell gallery as a trusted repository'
  merge: -1
  img_proc: true
