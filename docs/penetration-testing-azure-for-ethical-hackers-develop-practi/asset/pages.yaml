- pgno: 217
  md: "As part of the execution and logging associated with the extensions, they store\
    \ the extension configuration files and logs on the VMs. These files can be parsed\
    \ for sensitive information, including credentials. One of the primary offenders\
    \ in this category is the domain join extension, which can end up storing the\
    \ credentials used to join a VM to the domain.\n\n> **Important note**\n> \n>\
    \ Watch out for domain join credentials. Not only can they be logged in the Run\
    \ Command extension logs, but they can also be seen floating around in improperly\
    \ shut down PowerShell ISE sessions.\n> \n> As the default local administrator\
    \ account on a VM, you can open the PowerShell ISE and see whether any scripts\
    \ are automatically recovered. The authors have seen many situations where an\
    \ administrator will join a VM to the domain via scripts executed in the ISE,\
    \ but due to an improper shutdown, the credentials can be recovered on the next\
    \ ISE session with the local administrator user.\n\nAs a local administrator on\
    \ a VM, we can use certificates on the VM to decrypt protected settings stored\
    \ by the VM extensions. To extract these data points from the extensions, we will\
    \ take the following steps:\n\n+   1. Open a PowerShell session as a local administrator\
    \ on a Windows VM.\n+   2. Import the `Get-AzureVMExtensionSettings` function\
    \ from the MicroBurst toolkit: `https://github.com/NetSPI/MicroBurst/blob/master/Misc/Get-AzureVMExtensionSettings.ps1`.\n\
    +   3. Run the `Get-AzureVMExtensionSettings` function and observe the results.\n\
    \nAs a result of this script, you should hopefully see multiple instances of `ProtectedSettingsDecrypted`\
    \ appearing in the output with sensitive extension information. If you followed\
    \ along with the command execution techniques previously, you should also see\
    \ the commands that you previously issued in the results.\n\n> **Important note**\n\
    > \n> Since Jake Karnes does a much better job of explaining the core issues that\
    \ allow us to read these files, take a look at his blog that explains the source\
    \ and exploitation of the issue: `https://blog.netspi.com/decrypting-azure-vm-extension-settings-with-get-azurevmextensionsettings/`."
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Now that we have covered the in-memory and on-disk options for extracting credentials,
    let''s take a look at a more static type of analysis with Azure disk exports.


    # Exploiting the Disk Export and Snapshot Export features


    Like on-premises VMs, Azure VMs have virtual disks attached to them for data storage.
    At a minimum, an Azure VM has an operating system disk attached to it, but it
    can also have additional data disks attached to it. These disks can contain useful
    information that a pentester can leverage at a later attack stage.


    The Azure platform has a feature called Disk Export that can be used to generate
    a temporary public Shared Access Signature (SAS) URL to download a VM disk. The
    purpose of this feature is to make it easier for administrators and developers
    to copy their disks from one Azure region to another, for situations such as disaster
    recovery. This feature can also be exploited by an attacker to exfiltrate data
    outside an organization!


    To use this feature from the Azure portal, you can go to the Disks blade in Azure,
    select a disk, click on the Disk Export option, and then click on the Generate
    URL button as highlighted in Figure 5.28:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_218_0.png)


    Figure 5.28 – URL generation for Disk Export'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'It should be noted that the Disk Export feature can only be used for disks
    that are not attached to running VMs. If the disk is attached to a running VM,
    we can first create a snapshot of the disk, and then use the similar Snapshot
    export feature (Figure 5.29) to generate a temporary SAS URL that we can use to
    download the snapshot from the internet:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_219_0.png)


    Figure 5.29 – Snapshot URL functionality


    For many reasons, these disks and snapshots can end up being stored in storage
    accounts. This can be additionally impactful when the files in those storage accounts
    are made publicly available.


    > **Important note**

    > When downloading a VHD file, keep in mind the size of the file. Typical HTTP
    web downloads from the Azure portal may struggle with large disks. Additionally,
    you may want to use an Azure VM, with sufficient disk space, for copying the VHD
    file. By using the Azure backplane network to copy to a VM disk, you may save
    significant time in the download process.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'As noted previously, downloading Azure virtual disks can have a significant
    bandwidth impact, so it may not be the most fun exercise in practice. Your patience
    can be rewarded during a pentest when you have access to all the files and password
    hashes on the disk. Additionally, we can even boot up the VHD file in Hyper-V.


    One other item to note is the encryption used on a disk. If the disk is encrypted
    with customer-managed keys (see the **Encryption** tab), you will need to get
    the key from the key vault to decrypt it. This is beyond the scope of the book,
    but something to keep in mind as you work with disks.


    # Hands-on exercise – exfiltrating VM disks using PowerZure


    In this exercise, we will exploit the Disk Export feature of Azure VMs to exfiltrate
    unattached or reserved VM disks. Here are the tasks that we will complete in this
    exercise:


    +   1. Open PowerShell on your pentest VM.

    +   2. Authenticate to Azure using the following command. When prompted, enter
    the credentials of the `contributoruser` account that was created as part of the
    scenario setup script earlier in this chapter:


    ```

    PS C:\> Connect-AzAccount

    ```


    +   3. In the PowerShell console, import the PowerZure module with the following
    commands:


    ```

    PS C:\> cd C:\Users\$env:USERNAME\PowerZure

    PS C:\> Import-Module .\PowerZure.ps1

    ```


    Here is a screenshot of the commands:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_220_0.png)


    Figure 5.30 – Importing PowerZure into the session


    +   4. Obtain a list of all unattached VM disks using the following command:


    ```

    PS C:\> Get-AzDisk | Where-Object {$_.DiskState -ne "Attached"} | Select Name,
    DiskState, Encryption

    ```'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Here is a screenshot of the command output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_221_0.png)


    Figure 5.31 – Disks available for export


    The output of the command should return all managed disks that are not currently
    attached to a running VM and their encryption status. In your output, you should
    see a disk that has a name starting with winvm02; make a note of the disk name
    as it will be needed in the next step.


    +   5. In the PowerShell console, use the following command to generate a publicly
    accessible URL to export the disk identified in the previous step. Replace the
    <DISK_NAME_FROM_STEP_4> placeholder with the name of the disk that was identified
    in the previous step:


    ```

    PS C:\> Get-AzureVMDisk -DiskName <DISK_NAME_FROM_STEP_4>

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_221_1.png)


    Figure 5.32 – Disk Export URL generation


    Get-AzureVMDisk is a PowerZure module that exploits the Disk Export feature to
    generate a link to download a VM''s disk. You should get a URL from the command
    output. Make a note of this URL as it will be needed in the next step.


    +   6. This final step is completely optional. If you want to save time, bandwidth,
    and disk space here, you can pause the exercise and keep the technique in mind
    for when you run into disks in future tests. Outside of doing some forensics on
    the disk to find files and hashes, there is not much for us to do with the disk
    at this point in the exercise.'
