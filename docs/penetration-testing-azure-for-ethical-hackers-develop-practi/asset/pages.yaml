- pgno: 171
  md: 'The Get-AzureAppOwner command is one of the functions of PowerZure. It recursively
    looks through each registered application in Azure AD and lists the owners. The
    output shows that readeruser is assigned ownership of an application called customapp.
    Ownership allows different permissions on the app, including adding a new secret.
    While this is not an inherent permission for the Reader role, application ownership
    rights can be assigned to any account:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_171_0.png)


    Figure 4.37 – Example app owned by the reader account


    +   3. Add a new secret to customapp to allow us to authenticate with the app
    using the following command. Remember that we are doing all this as a user that
    is assigned the Reader role:


    ```

    ```powershell

    PS C:\> Add-AzureSPSecret -ApplicationName customapp

    -Password myPassword456

    ```

    ```


    Awesome! The new secret was successfully added. This means that we can authenticate
    as this service principal with the secret that we just set and then explore its
    permissions. Make a note of the displayed application ID and the tenant ID as
    we will need both to authenticate as the service principal (both pointed out by
    arrows in Figure 4.38):


    ![](img/4fa338e84e0a590967a142dd798ba4e2_171_1.png)


    Figure 4.38 – Example output of Add-AzureSPSecret'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# **Important note**


    Although there is explicit monitoring for app registration modification, it can
    be difficult to detect using manual analysis especially in an environment with
    potentially thousands of service principals. Also, the adding of a credential
    does not impact the existing secrets configured for the service principal. This
    means that any application using the service principal’s existing secret will
    continue to work without interruptions.


    From a blue team or defense perspective, Azure AD audit logs will record these
    events with the activity type of **Update application – Certificates and secrets
    management**. Azure Resource Graph and Application Change Analysis can also be
    helpful when investigating.


    4. Switch to WSL and authenticate as the service principal using the following
    commands. Replace `APP_ID` with the application ID that you made a note of in
    *Step 3*. Replace `TENANT_ID` with the tenant ID that you made a note of in *Step
    3*. Press *Enter*:


    ```

    PS C:\> bash

    pentestadmin@PentestVM:~# sudo su -

    root@PentestVM:~# az login --service-principal --username APP_ID --password myPassword456
    --tenant TENANT_ID

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_172_0.png)


    Figure 4.39 – Example Az CLI login with the credentials'
