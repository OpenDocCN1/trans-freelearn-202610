- pgno: 156
  md: 'As we can see in the template parameters in *Figure 4.22*, the `adminUsername`
    parameter is set to `String` and is visible in the inputs of the deployment history
    shown below (*Figure 4.23*). The `adminPassword` parameter is set to a `SecureString`
    type and is not displayed in the input section of the deployment history:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_156_0.png)


    Figure 4.23 – Example deployment inputs in the portal


    The preceding configuration is the correct way to do things, but cloud engineers
    may misconfigure the parameter types in their templates, leading to sensitive
    information being exposed in cleartext. In practical engagement experiences, we
    have typically seen this happening with early deployments in a resource group.
    Once an engineer realizes the mistake in the template, they will correct it for
    future deployments, but they may forget to clean up previous deployments that
    have exposed sensitive information.


    The second main reason for information disclosure is that cloud engineers may
    accidentally include sensitive values in the output section of their templates.
    An Azure template deployment allows engineers to specify values that are returned
    post-deployment in the output section. These may be used to pass certain values
    to another external process in a series of automated tasks. Sensitive values such
    as account keys, passwords, or connection strings may accidentally be included
    in this section. It is worth noting that even `SecureString` parameter values
    can be output as plain text in the output section. You will see an example of
    this in the next hands-on exercise.


    As attackers, we can use the sensitive values that we find in deployment histories
    to progress an attack chain. Often, the deployment template will change to use
    secure strings, but the passwords remain the same. It should also be noted that
    an average Azure tenant is going to have a large number of resources deployed.
    In order to efficiently review these deployments, we will need to make use of
    automated tools and the Az PowerShell modules.'
  merge: -1
  img_proc: true
