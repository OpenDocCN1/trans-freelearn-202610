- pgno: 186
  md: 'Congratulations! You have completed all the exercise scenarios in this chapter
    and successfully removed the resources that were set up in your subscription.


    # Summary


    In this chapter, we learned about the many ways that a lesser-privileged Reader
    role can enumerate sensitive information in a subscription. As a penetration tester,
    we need to be prepared for any kind of situation, so having some escalation options
    in such a limited role can be very helpful.


    In the following chapter, we will go through the different ways that an attacker
    can utilize Azure IaaS services, as a subscription Contributor, to escalate their
    privileges in a tenant. This chapter will focus on the many ways that commands
    can be executed on VMs, and how to pivot through the infrastructure services.


    # Further reading


    Additional documentation of the PowerZure functions can be found at the following
    links:


    +   - Information-gathering functions: `https://powerzure.readthedocs.io/en/latest/functions/infogathering.html`

    +   - Operational functions: `https://powerzure.readthedocs.io/en/latest/functions/operational.html`'
