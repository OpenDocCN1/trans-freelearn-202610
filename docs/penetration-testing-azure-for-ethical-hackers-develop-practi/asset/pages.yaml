- pgno: 192
  md: "There are two key values that you will need from the output section:\n\n**Azure\
    \ Contributor User:** This is the Azure administrator username with Contributor\
    \ permissions to the Azure subscription.\n\n**Azure Contributor User Password:**\
    \ This is the password of the Azure Contributor administrator user:\n\n```\nTranscript\
    \ started, output file is contributor-iaas-scenario-output.txt\n################\n\
    # Script Output #\n################\nAzure Contributor Admin User: contributoruser@azurepentesting.com\n\
    Azure Contributor Admin User Password: myPassword123\n\nTranscript stopped, output\
    \ file is /home/azureadmin/contributor-iaas-scenario-output.txt\nDeployment Ended\
    \ 02/23/2021 18:44:44\n```\n\nFigure 5.5 – Example of the script output\n\nYou\
    \ have now successfully created the resources that we will be working with in\
    \ later exercises in this chapter. In the next section, we will cover the goals\
    \ that we are trying to achieve by exploiting the platform features available\
    \ to us at the IaaS Contributor level.\n\n# Understanding Contributor IaaS escalation\
    \ goals\n\nAs a *Contributor*, we want to eventually escalate our privileges up\
    \ to the Owner role on the subscription, and/or a privileged role in the Azure\
    \ AD tenant. With this role, we now have significantly more options than a Reader\
    \ for attempting to escalate our privileges in the environment. As part of this,\
    \ we will want to use our permissions on IaaS resources to potentially gather\
    \ higher-privileged credentials from those resources. Since we have control over\
    \ almost every aspect of the IaaS resources, we can now start diving deeper into\
    \ those resources.\n\n> **Important note**\n> \n> While the scenarios outlined\
    \ in this chapter assume that you have Contributor access on an IaaS resource,\
    \ that may not always be the case during an Azure pentest. You may be in a situation\
    \ where you have local or domain credentials that allow you to execute commands\
    \ on a VM, but no actual access to a subscription. The techniques that we will\
    \ outline in this chapter can easily be adapted for pivoting into the Azure subscription\
    \ from a VM that you have command execution on."
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Before we start randomly executing commands on Azure VMs, we will want to understand
    why we are running the commands. Assuming we have Contributor rights on all the
    VMs in the subscription, why would we care about running additional commands?


    The simple answer is "to find credentials that we can use to escalate permissions,"
    but there are multiple options for credentials that could lead to that escalation.
    We have tried to highlight the four primary goals that we would approach while
    attacking Azure VMs:


    +   - Local credential hunting

    +   - Domain credential hunting

    +   - Lateral network movement opportunities

    +   - Tenant credential hunting


    In the next few sections, we will cover these four goals in detail.


    # Local credential hunting


    Being able to run commands on Azure VMs, as a privileged user, presents a great
    opportunity to gather local credentials (hashed or cleartext) that may be the
    key to *pivoting to other systems, accounts, and subscriptions* in the tenant
    or even to connected *on-premises systems*. It is very common for administrators
    to reuse the same local credentials on multiple systems across different environments,
    as well as using the same credentials for domain accounts. This attack can apply
    to both Windows and Linux systems, and they may even share credentials across
    the different operating systems.


    # Domain credential hunting


    Azure VMs can be standalone systems, or they can be joined to a larger **Active
    Directory (AD)** domain. If the VM is domain-joined, there may be an even greater
    impact on collecting information from the VMs. Frequently, Azure AD users with
    privileged roles on the subscription will also be the same users that are logging
    in to the VMs.


    By gathering credentials from each VM, we may be able to gain access to cleartext
    credentials (or hashes) of more privileged users. It should be noted that domain
    credentials at this point can be cleartext, hashed, or cached credentials. Hashed
    or cached credentials can potentially be cracked to reveal the cleartext passwords.


    Gathering domain credentials could be a great step in working our way up to domain
    or enterprise administrator privileges. At that point, we would be able to dump
    all the password hashes for the domain or reset the passwords of privileged accounts
    that we would like to access.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # Lateral network movement opportunities


    Since VMs are deployed into customer-managed virtual networks in Azure, it is
    common for organizations to have connectivity from traditional networks in their
    organizations to Azure virtual networks. Being able to run commands on Azure VMs
    gives us the opportunity to discover services and resources in the networks that
    may be connected to them and to look for opportunities to exploit them.


    The ability to run commands can also present opportunities to bypass defenses.
    In some situations, there may be different **multifactor authentication (MFA)**
    requirements for on-premises Azure access and remote Azure access. The authors
    have seen environments that require MFA from the internet but do not require it
    for connections made from trusted internal on-premises IPs.


    After escalating privileges within an on-premises environment, dumping and cracking
    credentials for a tenant administrator account, it may be possible to directly
    log in to the Azure management interfaces from an on-premises system, or from
    an Azure VM.


    # ## Tenant credential hunting


    In some cases, organizations have privileged access workstations, or jump hosts,
    hosted in Azure. These are systems that administrators can use to perform privileged
    operations against their environments. We would look to gather cached access tokens
    or other credentials from these machines for reuse.


    Later in this chapter, we will be covering how to identify a managed identity
    on an Azure VM. These identities can also be used to escalate into the Azure tenant
    from the VM by generating tokens from the metadata service. The generated token
    can then be used for gathering sensitive information from other services that
    you may not have had access to.


    Now that we understand our goals, let''s look at different exploit scenarios for
    achieving these goals.


    # ## Exploiting Azure platform features with Contributor rights


    With access to the Contributor role, we have a rich set of platform-level features
    that we can use to manage VMs in the environment. Since we are approaching these
    features as penetration testers, our use cases for these features may be slightly
    different than your average user.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Exploiting the password reset feature


    The password reset feature for Azure VMs was intended to simplify the process
    of resetting the password of a local Azure VM user, using the VM agent that is
    installed on every Azure VM. However, this feature could be abused to create new
    local users with administrative privileges on both Windows and Linux VMs in Azure!


    This feature can be used from the Azure portal (Figure 5.6) or from Azure command-line
    tools. Exploit tools such as Lava can also leverage this feature to reset VM passwords
    at scale. This feature can be utilized by a pentester to move laterally from the
    Azure platform to IaaS workloads to progress in an attack chain:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_195_0.png)


    Figure 5.6 – Example password reset for a VM in the portal


    To use the feature to create a local user for a VM using the Azure CLI, we would
    use the following command:


    ```

    ```bash

    az vm user update -u username -p password -n <VM_Name> -g <Resource_Group>

    ```

    ```


    To use the feature to create a local user for a VM using Azure PowerShell, we
    could use the following command:


    ```

    ```powershell

    Set-AzVMAccessExtension -ResourceGroupName "<Resource_Group>" -Location "<Location>"
    -VMName "<VM_Name>" -Name "<Extension_Name>" -TypeHandlerVersion "2.4" -UserName
    "<Username>" -Password "<Password>"

    ```

    ```'
  merge: -1
  img_proc: true
