  \ DNS 名称\n\n8. 在客户端系统上，打开**远程桌面协议（RDP）**客户端，输入之前记下的 `pentest-vm-dns` 值，然后点击**连接**。这里的说明描述的是使用\
  \ Windows RDP 客户端。如果你使用的是其他 RDP 客户端，操作步骤可能会有所不同。\n\n要打开 Windows RDP 客户端，请在 Windows“运行”对话框中执行\
  \ `mstsc`，或在 Windows“开始”菜单中键入 `mstsc`。\n\n下面的截图显示了使用 RDP 连接到 pentest 虚拟机的过程：\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_77_0.png)\n\n图 2.26 – 使用 RDP 连接到 pentest\
  \ 虚拟机\n\n9. 当提示登录时，点击**更多选择** → **使用其他帐户**。输入以下内容：\n\n**用户名：** `pentestadmin`。\n\
  \n**密码：** 输入你在模板部署期间配置的密码。\n\n下面的截图展示了这一点：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_78_0.png)\n\
  \n图 2.27 – 使用 RDP 客户端进行身份验证\n\n10. 当收到证书警告提示时，勾选**不再询问我是否连接到此计算机**选项，然后点击**是**，如下面的截图所示：\n\
  \n图 2.28 – 跳过证书警告\n\n11. 现在，你应该已经获得了 pentest 虚拟机的 RDP 会话！下面的截图展示了这一过程的概览。请保持此会话打开，因为下一个练习需要用到它：\n\
