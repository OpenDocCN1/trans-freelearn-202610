- "# 道德黑客的Azure渗透测试：培养对Microsoft Azure环境执行渗透测试和风险评估的实用技能\n\n\n\n\n\n## 贡献者\n\n###\
  \ 关于作者\n\n**David Okeyode** 是 Palo Alto Networks 旗下 Prisma Cloud 团队的云安全架构师。在此之前，他是一名独立顾问，通过私人的专家级培训和评估帮助企业保护其云环境。他持有\
  \ Azure 和 AWS 平台的 15 项专业认证。\n\nDavid 在网络安全（咨询、设计和实施）方面拥有超过十年的经验。他曾与从初创公司到大型企业的各种组织合作，并经常在\
  \ Microsoft Future Decoded 和欧洲信息安全峰会等大型行业活动中就云安全发表演讲。\n\nDavid 娶了一位可爱的女孩，她能做出世界上最好吃的香蕉蛋糕，他们喜欢一起环游世界！\n\
  \n**Karl Fosaaen** 是 NetSPI 的实践总监。他目前领导 NetSPI 的云渗透测试服务线，并负责管理俄勒冈州波特兰办事处。Karl 拥有明尼苏达大学计算机科学学士学位，并在计算机安全行业拥有超过十年的咨询经验。Karl\
  \ 的大部分研究时间都集中在 Azure 安全方面，并为 NetSPI 博客撰稿。作为这项研究的一部分，Karl 创建了 MicroBurst 工具包，以收纳他用于测试\
  \ Azure 的许多 PowerShell 工具。\n\n### 关于审稿人\n\n**Jake Karnes** 拥有圣何塞州立大学计算机科学学士学位，并持有\
  \ GIAC 认证事件处理专家和道德黑客认证。他具有软件咨询背景，目前是 NetSPI 的管理顾问。Jake 专注于 Web 应用和云渗透测试，同时也为渗透测试团队的应用和工具开发做出贡献。他热爱在这个不断发展的领域工作，并乐于与他人分享自己的知识和经验。\n\
  \n> 我要感谢我的妻子 Halle，是她让我成为最好的自己。她的同情心和坚韧是我无尽的灵感来源。在波特兰阴云密布的日子里，她是我光与温暖的源泉。\n>\n>\
  \ 我还要感谢我的父母和兄弟，在我无数个小时坐在电脑前时，他们的耐心和支持。\n>\n> 最后，我要感谢我的叔叔 Pat 在生活和咨询方面给予我的指导。\n\n\
  **Thomas Elling** 是 NetSPI 的首席安全顾问和安全研究员。他专注于 Web 应用和云安全测试，并为科技行业的多个财富 500 强公司提供咨询。在业余时间，Thomas\
  \ 喜欢提升自己的编码技能、观看糟糕的动作片，以及和他的狗 Chunks 一起闲逛。\n\n> 感谢我的家人和伴侣给予我的所有支持。\n\n## 前言\n\n\
  欢迎阅读《面向道德黑客的 Azure 渗透测试》。本书将介绍在 Azure 环境渗透测试期间可以使用的各种技术和攻击。无论您是希望在云领域获得优势的经验丰富的渗透测试人员，还是刚刚进入渗透测试领域的新手，本书都能为您提供有价值的信息。\n\
  \n我们将从介绍 Azure 服务和平台的整体架构开始本书。第一部分将涵盖渗透测试期间常用的服务及其支持服务。我们将在此为本书其余的攻击奠定基础，因为攻击通常利用这些服务的架构和配置，这与更传统的协议和代码相关渗透测试攻击形成对比。\n\
  \n然后，我们将介绍如何创建和配置一个有漏洞的测试环境，以便您遵循书中的练习。对于有构建和维护订阅经验的人来说，这可能是一个复习章节，但请记住，这些初始信息将贯穿本书的其余内容。\n\
  \n本书的中间部分将介绍您在渗透测试期间会使用的攻击和技术。本部分特定攻击的实用性会因您而异，因为您在 *正常* 渗透测试中可能不会遇到我们涵盖的所有服务和配置。作为参与过数百个\
  \ Azure 订阅的渗透测试人员，我们希望能够在核心服务（公司正在使用的）以及容易受到攻击利用的服务方面，为您提供很好的参考。\n\n对于攻击部分，我们将根据订阅权限级别（读者、贡献者等）和拥有这些权限的单个服务可用的攻击来分解各个攻击。由于不同的权限允许不同的攻击，我们将从较基本的只读攻击开始，逐步转向更高级（更大权限）的攻击。\n\
  \n本书的最后一章重点介绍 Azure 环境中的持久化。在渗透测试期间，您可能会发现自己需要保持对 Azure 环境某些部分的访问权限。我们将回顾多种在 Azure\
  \ 环境中隐藏的技巧。\n\n\n\n\n\n## 充分利用本书\n\n本书通过大量动手练习来引导读者掌握相关内容。如果读者按照*第 2 章，构建你自己的环境*中概述的步骤设置一个测试\
  \ Azure 订阅和配套虚拟机，将受益匪浅。作者强烈建议读者使用 Microsoft 提供的新账户额度，以抵消运行云资源相关的运营成本。\n\n## 下载彩色图片\n\
  \n我们还提供了一个 PDF 文件，其中包含本书所用截图/图表的彩色图片。你可以在此处下载：`http://www.packtpub.com/sites/default/files/downloads/9781839212932_ColorImages.pdf`。\n\
  \n## 下载示例代码文件\n\n你可以从 GitHub 下载本书的示例代码文件：`https://github.com/PacktPublishing/Penetration-Testing-Azure-for-Ethical-Hackers`。\n\
  \n如果代码有更新，它会在现有 GitHub 仓库中更新。我们的图书和视频目录中还有其他丰富的代码包，可在 `https://github.com/PacktPublishing/`\
  \ 获取。快去看看吧！\n\n## 本书使用的约定\n\n本书通篇使用多种文本约定。\n\n`Code in text`：表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 用户名。例如：“在 Azure AD 租户中，域名为 `azurepentesting.com`，名为 `karl` 的用户的\
  \ UPN 为 `karl@azurepentesting.com`。”\n\n代码块如下所示：\n\n```json\n{\n  \"assignableScopes\"\
  : [\n    \"/\"\n  ],\n}\n```\n\n命令行输入或输出如下所示：\n\n```text\nPS C:\\> az login\n```\n\
  \n**粗体：**表示新术语、重要词或屏幕上看到的文字。例如，菜单或对话框中的文字在文本中如此显示。下面是一个示例：“在与 Pentest VM 的 RDP 会话中，右键单击**开始**按钮，并单击**Windows\
  \ PowerShell（管理员）**。”\n\n> **提示或重要说明**\n>\n> 如下所示。\n\n## 免责声明\n\n本书提供的所有信息纯粹用于教育目的。本书旨在作为学习渗透测试的起点。请自行斟酌使用本书提供的信息。作者和出版商对以恶意方式使用本书内容概不负责，也不对因本书内容造成的任何损害承担责任。\n\
  \n未经事先书面同意，对目标进行渗透测试或攻击是违法的，应不惜一切代价避免。读者有责任遵守其所有地方、州、联邦及国际法律。\n\n## 联系我们\n\n我们始终欢迎读者的反馈。\n\
