  \nVM 大小：保持默认设置。\n\n位置：保持默认设置。\n\n_artifacts Location：保持默认设置。\n\n_artifacts Location\
  \ Sas Token：保持默认设置。\n\n\n\n\n5. 点击**查看 + 创建**。\n\n这个过程在下面的截图中突出显示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_75_0.png)\n\
  \n图 2.23 – 配置模板参数\n\n6. 模板验证通过后，点击**创建**，如下面的截图所示。这将开始部署过程，大约需要 20 到 25 分钟才能完成。给自己拿杯饮料，等待部署完成：\n\
