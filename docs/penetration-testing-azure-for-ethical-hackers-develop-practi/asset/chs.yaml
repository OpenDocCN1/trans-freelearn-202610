  \n![](img/4fa338e84e0a590967a142dd798ba4e2_71_0.png)\n\n图 2.20 – 更新 azureadmin 用户帐户的密码\n\
  \n我们现在拥有一个 Azure 租户、一个获得许可的管理员用户，以及渴望深入了解 Azure 渗透测试的积极态度。让我们借助这种热情，继续设置我们的测试环境。\n\
  \n> **重要说明**\n> \n> 虽然这里没有涉及，但我们强烈建议为任何特权 Azure 帐户添加**多因素身份验证（MFA）**要求。这可以通过用户图标（门户右上角）下的**“我的\
  \ Microsoft 帐户”**部分完成。虽然我们将有意创建一个易受攻击的环境，但我们不希望您因为不保护管理员帐户而进一步将自己置于风险之中。有关为帐户使用\
  \ MFA 的更多信息，请参阅 Microsoft 文档：`https://docs.microsoft.com/en-us/azure/active-directory/roles/security-planning#turn-on-multi-factor-authentication-and-register-all-other-highly-privileged-single-user-non-federated-admin-accounts`。\n\
  \n我们现在已在 Azure AD 中配置了一个适当的管理员帐户，因此可以继续设置示例中将要使用的 VM。\n\n### 在 Azure 中部署渗透测试 VM\n\
  \n既然我们有了可以部署资源的 Azure 租户，我们就需要设置一台用于测试的 VM。与尝试在现有系统上安装工具相比，该 VM 将使我们能够完成本书中的练习，并应为安装工具提供一个干净的基础。对于任何希望实现\
  \ Azure 基础映像来自动化其内部团队工具的人来说，这同样有用。\n\n### 动手练习：部署渗透测试 VM\n\n我们在本书的 GitHub 仓库中准备了一个**Azure\
  \ 资源管理器（ARM）**模板。该模板将部署一台 Windows Server 2019 VM，并安装以下应用程序：Git for Windows、**Visual\
  \ Studio Code（VS Code）**和 Docker Desktop。\n\n### 重要说明\n\nARM 模板是在 Azure 环境中部署资源的绝佳工具。由于本书侧重于攻击（而非构建）Azure\
  \ 环境，我们不会深入介绍 ARM 模板。有关 ARM 模板的更多信息，请参阅 Microsoft 文档：https://docs.microsoft.com/en-us/azure/azure-resource-manager/templates/。\n\
  \n下面是我们将在本练习中完成的任务：\n\n- **任务 1：**在 GitHub 中初始化模板部署。\n- **任务 2：**配置参数并将模板部署到 Azure。\n\
  \n让我们开始部署 VM 的过程，如下所示：\n\n+   1. 打开 Web 浏览器，浏览到 https://bit.ly/azurepentestervm。此链接将打开包含用于部署渗透测试\
  \ VM 的 ARM 模板的 GitHub 仓库。\n+   2. 在打开的 GitHub 仓库中，点击**部署到 Azure**，如下面的截图所示：\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_73_0.png)\n\n图 2.21 – 点击开始部署过程\n\n3. 在“登录”窗口中，输入之前配置的\
  \ azureadmin 用户名和密码以对 Azure 订阅进行身份验证，如下面的截图所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_74_0.png)\n\
  \n图 2.22 – 向 Azure 进行身份验证\n\n4. 在“自定义部署”窗口中，配置以下参数：\n\n订阅：选择要部署渗透测试 VM 的订阅。\n\n\
  资源组：新建 → pentester-vm-rg → 确定。\n\n区域：选择离您较近的 Azure 区域。\n\n存储名称：保持默认设置。\n\nVM DNS：保持默认设置。\n\
