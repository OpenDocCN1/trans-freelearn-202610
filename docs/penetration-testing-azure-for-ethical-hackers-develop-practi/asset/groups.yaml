    # Hands-on exercise – Preparing for the Global Administrator/Owner exploit scenarios


    This hands-on exercise will prepare us for the rest of the exercises in this chapter.
    To follow along with the scenarios that we will cover in this chapter, you will
    need to set up a user with Global Administrator permissions in your Azure AD tenant
    and another user with the Owner permissions role in your Azure subscription. We
    have automated this using a PowerShell script that you can run from the Azure
    Cloud Shell. Here are the tasks that we will complete in this exercise:


    1. Open a web browser and browse to the Azure Portal (`https://portal.azure.com`).
    Sign in with the `azureadmin` credentials.


