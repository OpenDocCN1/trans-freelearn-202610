  - "[PAGE 88]\n\n> **Note**\n> \n> It is highly recommended to shut down the pentest\
    \ VM when you are not using it to save some costs. You can do this by stopping\
    \ the VM from the Azure portal.\n\n# # Azure penetration testing tools\n\nThroughout\
    \ the course of this book, we will be using different tools to emulate adversary\
    \ tactics and techniques. We can break these tools into different categories,\
    \ based on their typical usage.\n\nFirst, we have **Windows or Linux administration\
    \ tools**, outlined as follows:\n\n+   - Tools typically used by administrators\
    \ for general system administration\n+   - **Examples:** `JQ`, `httpie`, `wget`,\
    \ `curl`, `unzip`, and `PowerShell`\n\nNext up are the **general penetration testing\
    \ tools**, outlined as follows:\n\n+   - General service and vulnerability identification\
    \ tools\n+   - **Examples:** `gobuster`, `nmap`, `dnscan`, and `hydra`\n\nFinally,\
    \ we have **Azure-specific penetration testing tools**, outlined as follows:\n\
    \n+   - Penetration testing tools that are optimized to focus on Azure platform-related\
    \ vulnerabilities\n+   - **Examples:** MicroBurst, Lava, Koboko, PowerZure, Stormspotter,\
    \ and BloodHound\n\nThere are very few of these Azure-specific tools at the moment,\
    \ and most of them are open source. This often means that the creators and contributors\
    \ are releasing and updating these tools in their own time, so there's frequently\
    \ opportunities for others to contribute to the tools. The authors (and our technical\
    \ reviewers) for this book have all contributed to open source tools, including\
    \ some of the aforementioned tools, and our work is proof that if a tool or feature\
    \ you need doesn't exist, you can just write it yourself.\n\nOne important distinction\
    \ to note with these categories is the difference between general penetration\
    \ testing tools and Azure-specific tools. While many general penetration testing\
    \ tools can be used against Azure, they frequently need to be configured to focus\
    \ on Azure domains and services. The Azure-specific tools noted in this book are\
    \ either built to specifically scope to the Azure domains, or they are built around\
    \ existing Microsoft **application programming interfaces (APIs)**, PowerShell\
    \ modules, and libraries to directly integrate with Azure."
