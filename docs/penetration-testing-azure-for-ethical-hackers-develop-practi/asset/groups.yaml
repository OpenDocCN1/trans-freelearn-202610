    \ 3：** 在你的 Azure 订阅中授予该用户 **所有者** 角色分配。\n\n让我们按如下步骤创建我们的 Azure 管理员账户：\n\n1. 使用上一个练习中经过身份验证的\
    \ Web 浏览器会话，点击左上角的门户菜单图标，然后选择 **Azure Active Directory**，如下面的屏幕截图所示：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_61_0.png)\n\
    \n   *图 2.5 – 选择 Azure AD*\n\n2. 在 **“默认目录 | 概述”** 边栏选项卡中，查看 **“租户信息”** 部分中包含的信息。查看你当前\
    \ Azure AD 许可证的版本。\n\n   如果你当前的许可证是 **Premium**，则可以跳过本练习中的其余任务。如果你当前的版本是 **Free**，如以下屏幕截图所示，请继续执行后续步骤以激活试用高级许可证：\n\
    \n   ![](img/4fa338e84e0a590967a142dd798ba4e2_62_0.png)\n\n   *图 2.6 – 查看当前的 Azure\
    \ AD 许可证*\n\n3. 在左侧菜单中，点击 **“许可证”**，如下面的屏幕截图所示：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_63_0.png)\n\
    \n   *图 2.7 – Azure AD 许可证*\n\n4. 在 **“许可证 | 概述”** 边栏选项卡中，点击 **“所有产品”**，然后点击 **+\
    \ 尝试/购买** 选项，如下面的屏幕截图所示：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_63_1.png)\n\
    \n   *图 2.8 – 尝试 Azure AD Premium P2 许可证*\n\n"
