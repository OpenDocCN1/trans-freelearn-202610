    \ by default.\n\nThe great part about this attack is that the initial user doesn't\
    \ need any permissions on subscriptions to execute the attack. They only need\
    \ the ability to invite guest users. While it is helpful to see what the IAM permissions\
    \ are, any user in this situation can look at a dynamic group (`subscriptionOwners`)\
    \ and make some assumptions.\n\nAs a user with Azure portal access, we can invite\
    \ a new user that just happens to have admin in their email address:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_182_0.png)\n\
    \nFigure 4.51 – User invitation screen\n\nThis results in an invite email being\
    \ sent to the `admin@fosaaen.com` account, and the user can accept access to the\
    \ tenant.\n\nAn important step to note here is the need to use an existing Azure\
    \ account as the recipient of the invite. You can create the invite for a specific\
    \ email address, but that email needs to create an Azure user in another tenant\
    \ (Microsoft or otherwise) before it can officially be added to your victim tenant.\
    \ Additionally, the user needs to meet any MFA and conditional access requirements\
    \ that are pushed down from the victim tenant.\n\nOnce the guest account is added\
    \ and ready to go, we can see that the user now has the Owner role applied and\
    \ is a member of the dynamic group:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_183_0.png)\n\
    \nFigure 4.52 – Example of dynamic group membership\n\nFrom a practicality standpoint,\
    \ we will probably not see a ton of dynamic groups being used to grant rights\
    \ to Azure subscriptions. However, we have seen a wide variety of client environments\
    \ during consulting engagements and can attest to seeing weirder configurations\
    \ implemented in Azure AD.\n\n> **Important note**\n>\n> For additional information\
    \ on this attack, check out the original blog post for this technique on the Mnemonic\
    \ blog by Cody Burkard: https://www.mnemonic.no/blog/abusing-dynamic-groups-in-azure/.\n\
    \nAs for the remediation of this issue, we would recommend setting dynamic group\
    \ membership rules to operate off of parameters that users do not have control\
    \ over. Additionally, it would help to lock down guest account access to prevent\
    \ guest users from manipulating their own accounts.\n\n## Hands-on exercise –\
    \ cleaning up the Owner exploit scenarios\n\nIn this final exercise, we will use\
    \ a clean-up script to automate the removal of the resources that were set up\
    \ for the scenarios in this chapter. Here are the tasks that we will complete\
    \ in this exercise:\n\n- Download the cleanup script from GitHub.\n- Run the script\
    \ to remove the objects and resources created for the scenarios.\n\nHere are the\
    \ steps to complete these tasks:\n\n1. Open a web browser and browse to the Azure\
    \ portal at `https://portal.azure.com`. Sign in with the `azureadmin` credentials.\n\
    2. In the Azure portal, click on the Cloud Shell icon in the top-left corner.\
    \ Select **PowerShell**:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_184_0.png)\n\
    \nFigure 4.53 – Opening the Cloud Shell\n\n3. In the PowerShell session within\
    \ the Cloud Shell pane, run the following command to download a script to create\
    \ a user account with Reader permissions and set up the required vulnerable workloads.\
    \ Also verify the download:\n\n   ```powershell\n   PS C:\\> Invoke-WebRequest\
    \ http://bit.ly/reader-scenario-cleanup -O reader-scenario-cleanup.ps1\n   PS\
    \ C:\\> Get-ChildItem\n   ```\n\nHere is a screenshot of what it looks like:\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_185_0.png)\n\nFigure 4.54 – Results\
    \ of downloading the script\n\n4. Run the downloaded script to remove the objects\
