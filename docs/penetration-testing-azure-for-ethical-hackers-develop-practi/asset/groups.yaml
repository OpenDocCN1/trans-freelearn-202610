  mdcn: "\n既然我们已经获得了应用服务发布配置文件，我们接下来将了解这些凭据如何与该应用程序配合使用。\n\n## 在应用服务中的横向移动、权限提升和持久化\n\
    \n从应用服务发布配置文件获取凭据后，我们有几种选择来实现持久化、横向移动和/或提升权限。首先，我们要审查应用程序文件，以查找可能存储在先前的现有配置文件或应用程序代码中的任何凭据。最简单的方法是通过连接到与该应用程序关联的\
    \ FTP 服务器。你可以在 Azure 门户（应用服务 → 部署中心 → FTP 凭据）中获取 FTP 服务器端点。你也可以通过运行以下命令，使用 Azure\
    \ CLI 获取该端点：\n\n```\n```bash\naz webapp deployment list-publishing-profiles --name\
    \ <app-name> --resource-group <group-name> --query \"[? ends_with(profileName,\
    \ 'FTP')].{profileName: profileName, publishUrl: publishUrl}\"\n```\n```\n\n然后你可以使用\
    \ FTP 客户端进行连接。如果你没有偏好的 FTP 客户端，也可以使用带有 FTP:// 路径的 Windows 资源管理器。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_260_0.png)\n\
    \n此时，我们还可以上传一个 Web Shell，从而保持对应用服务器的持久访问，并允许我们运行命令来为任何关联的托管身份生成令牌。如果你选择这种方法，请确保使用你信任的\
    \ Web Shell，并为其设置密码保护，以防其他攻击者访问你的 Shell。\n\n该界面即为 Kudu（`https://github.com/projectkudu/kudu`）服务，它可以提供多种不同的攻击选项。该界面提供\
    \ CMD 和 PowerShell 控制台、文件浏览器以及所有环境设置和变量的导出。\n\n此外，该界面无需向 Azure AD 进行身份验证即可使用。通过访问受影响站点上的\
    \ `https://$APP_NAME.scm.azurewebsites.net/basicauth` 页面，你只需输入发布配置文件中的凭据即可。如果你需要重新获得对订阅的访问权限，这将非常方便。\n\
    \n> **重要说明**\n> \n> 虽然我们在本章中已经介绍了一些横向移动的选项，但其中一位作者之前撰写过一篇博客文章，更深入地探讨了其中一些技术：`https://blog.netspi.com/lateral-movement-azure-app-services/`。\n\
    \n作为本节的最后一点，我们要提到，应用服务应用经常附加托管身份。由于我们之前已经介绍了使用托管身份提升权限的方法（*第5章，利用 IaaS 服务上的参与者权限*），我们想在此指出，这是在攻击应用服务应用时值得关注的一个选项。本章场景创建的应用确实带有一个附加的托管身份，虽然我们没有为其提供练习，但你仍然可以使用示例应用服务应用来练习托管身份利用技能。\n\
    \n接下来进入本章的最后一节，我们将回顾自动化账户以及如何从它们中提取凭据。\n\n## 从自动化账户中提取凭据\n\n与许多云环境相关的目标之一是自动化。它可以简单到自动执行系统配置更改和补丁管理，也可以复杂到自动轮换\
    \ Web 应用上的 SSL 证书并将其存储在 Key Vault 中。\n\n这些操作可以通过在自动化账户中的**运行手册**中运行代码来完成。这些运行手册只是存储在自动化账户中的代码块。代码可以使用\
    \ PowerShell 或 Python（2 或 3）编写，而浏览器内编辑器使得将常见的 Azure 管理功能集成到代码中变得非常容易。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_263_0.png)\n\
    \n*图 6.55 – 创建运行手册的选项*\n\n在 Azure 中可以自动化的任务有成千上万种，但这些操作通常需要访问租户中的安全主体或外部服务的凭据。对于安全主体而言，可以在自动化账户中添加一个\
    \ Run as 账户。该账户可以在订阅或租户内被授予权限，运行手册可以使用该账户代表其进行操作。\n\n此外，还可以为 Run as 账户授予 Key Vault\
    \ 的访问策略权限。这样，该账户就可以从 Key Vault 中获取它可能需要的任何明文凭据，而不是将凭据存储在自动化账户中，或作为变量存储在运行手册代码本身中。\n\
    \n> > **重要说明**\n> >\n> > 由于在环境中经常使用自动化账户访问 Key Vault，MicroBurst 工具包中添加了一个函数，用于使用自动化账户运行手册自动提取\
