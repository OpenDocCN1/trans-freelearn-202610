    # Anonymous service identification


    Now that we have a basic understanding of Azure infrastructure and the available
    scopes for an Azure penetration test, let''s get started with some practical attacks.
    In this section, we will cover how we can anonymously identify internet-facing
    services that are hosted in Azure. Given that many organizations are making use
    of Azure services, this will be applicable for any external test, regardless of
    the cloud.


    # Test at your own risk


    For the purposes of this book, we will have some real resources (that the authors
    are hosting) in the examples that you can use for testing these tools. All the
    examples in this book, unless noted otherwise, will point to resources that you
    are authorized to follow the examples with.


    > **Important note**

    > Do not run the tools or examples in this book against systems or services that
    you do not have authorization to test. Hopefully, we have made this abundantly
    clear by now.


    We will try to call out specific examples of *dangerous scope* for each attack.
    When in doubt, ask the owner of the resources that you are testing to see whether
    a resource that you have enumerated anonymously is owned by the organization.


    # Azure public IP address ranges


    Like other public cloud providers, Microsoft Azure allows organizations to assign
    internet-accessible IP addresses to Azure resources. A public IP address can be
    allocated to the following Azure resources: a virtual machine network interface,
    an internet-facing load balancer, a VPN gateway, an application gateway, or an
    Azure firewall instance (Figure 3.1).


    When public IP addresses are allocated, they can either be *static* or *dynamic*.
    Dynamic public IP addresses can change over the lifespan of the Azure resource,
    while static public IP addresses will not change over the lifespan of the Azure
