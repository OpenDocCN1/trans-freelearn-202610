    \ in the following screenshot:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_84_0.png)\n\
    \nFigure 2.34 – Configuring the credentials for WSL\n\n9. Apply updates to the\
    \ Linux installation using the following command. Enter the password that you\
    \ just configured when prompted:\n\n```\nsudo apt update -y\n```\n\n10. You can\
    \ close the PowerShell console. To use WSL going forward, all you need to do is\
    \ to type bash and press *Enter* in either the PowerShell console or the command-line\
    \ console of your pentest VM.\n\nIn this exercise, you enabled WSL on your pentest\
    \ VM. In the following exercises, we will cover installing the Azure PowerShell\
    \ modules and the Azure **command-line interface (CLI)** needed by other pentest\
    \ tools we will be using in the book.\n\n## Hands-on exercise: Installing the\
    \ Azure and Azure AD PowerShell modules on your pentest VM\n\nAs mentioned in\
    \ the first chapter, **Azure PowerShell** is a module that administrators and\
