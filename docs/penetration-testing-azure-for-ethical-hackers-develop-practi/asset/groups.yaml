    \ recommend running any public IP scans immediately after gathering the IPs.\n\
    \nFor learning purposes, we will show you how external adversaries anonymously\
    \ discover Azure targets using publicly available information. The Microsoft Azure\
    \ network team publishes a JSON file that contains the public IP address ranges\
