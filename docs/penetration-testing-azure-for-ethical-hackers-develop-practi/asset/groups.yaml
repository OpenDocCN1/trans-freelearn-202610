    \ built-in roles in Azure AD that could be used to perform this attack. This includes\
    \ the following roles: **User Administrator, Groups Administrator, and Directory\
    \ Writers.** Additionally, any Azure AD custom role with the following permission\
    \ could be exploited:\n> \n> `microsoft.directory/groups/members/update`.\n\n\
    This is a very simple attack and we exploited something similar in a hands-on\
    \ exercise in *Chapter 4, Exploiting Reader Permissions*, but with a slight variation.\
    \ If a user already has rights in a subscription, it would be easy to identify\
    \ any privileged groups in the subscription, but what can we do if our Active\
    \ Directory user doesn't have any subscription rights? One way is by reviewing\
    \ the Azure AD sign-in log.\n\nThe Azure AD sign-in log automatically records\
    \ both interactive and non-interactive sign-in activities. From an offensive perspective,\
    \ the log contains a wealth of information that could give an attacker insight\
    \ on which users have access to each Azure AD application, which user accounts\
    \ or applications are easy targets, and information on how to evade defensive\
