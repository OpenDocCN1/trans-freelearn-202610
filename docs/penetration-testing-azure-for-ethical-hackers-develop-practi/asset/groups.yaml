    ## Azure penetration testing tools


    Throughout the course of this book, we will be using different tools to emulate
    adversary tactics and techniques. We can break these tools into different categories,
    based on their typical usage.


    First, we have **Windows or Linux administration tools**, outlined as follows:


    - Tools typically used by administrators for general system administration

    - **Examples:** `JQ`, `httpie`, `wget`, `curl`, `unzip`, and `PowerShell`


    Next up are the **general penetration testing tools**, outlined as follows:


    - General service and vulnerability identification tools

    - **Examples:** `gobuster`, `nmap`, `dnscan`, and `hydra`


    Finally, we have **Azure-specific penetration testing tools**, outlined as follows:


    - Penetration testing tools that are optimized to focus on Azure platform-related
    vulnerabilities

    - **Examples:** MicroBurst, Lava, Koboko, PowerZure, Stormspotter, and BloodHound


    There are very few of these Azure-specific tools at the moment, and most of them
    are open source. This often means that the creators and contributors are releasing
    and updating these tools in their own time, so there''s frequently opportunities
    for others to contribute to the tools. The authors (and our technical reviewers)
    for this book have all contributed to open source tools, including some of the
    aforementioned tools, and our work is proof that if a tool or feature you need
    doesn''t exist, you can just write it yourself.


    One important distinction to note with these categories is the difference between
    general penetration testing tools and Azure-specific tools. While many general
    penetration testing tools can be used against Azure, they frequently need to be
    configured to focus on Azure domains and services. The Azure-specific tools noted
    in this book are either built to specifically scope to the Azure domains, or they
    are built around existing Microsoft **application programming interfaces (APIs)**,
    PowerShell modules, and libraries to directly integrate with Azure.


    ## 3 Finding Azure Services and Vulnerabilities


    As a penetration tester, you may be tasked with anonymously attacking an Azure
    tenant as part of your assessment. From a scope perspective, this can be tricky.
    Anyone can name an Azure service whatever they want, and it may be hard to find
    resources that are truly in scope. Regardless of whether you are chasing a bug
    bounty or shadow IT assets during a penetration test, anonymous Azure service
    discovery can be a helpful tool in identifying vulnerabilities in an environment.


    In this chapter, we will cover attacks for Azure that do not require any authentication
    to an Azure tenant. Additionally, these will be attacks that you can use to gain
    initial access to an Azure tenant. We will also touch on multiple open source
    toolkits that are currently available for assessing Azure services for vulnerabilities.


    Specifically, in this chapter, we will be covering the following sections:


    - Guidelines for Azure penetration testing

    - Anonymous service identification

    - Identifying vulnerabilities in public-facing services

    - Finding Azure credentials


    ## Technical requirements


    For this chapter, we will want to make use of the virtual machine that we set
    up in *Chapter 2, Building Your Own Environment*. If you did not set up your own
    environment, make sure that you have local administrator access on a Windows system
    with PowerShell. While you don’t absolutely need a Windows desktop to understand
    the content of this chapter, the authors recommend spinning up an Azure virtual
    machine (as described in the previous chapter) to test out the tools and techniques
    that we will introduce.


    ## Guidelines for Azure penetration testing


    From June 2017, *Microsoft no longer requires organizations to obtain pre-approval
    to conduct a penetration test against their Azure resources* (`https://docs.microsoft.com/en-us/azure/security/fundamentals/pen-testing`).
    It is important to note that this exemption does not apply to other Microsoft
    cloud services, such as Office 365. Even though you do not need to notify Microsoft
    before you perform a penetration test, there are still stated *rules of engagement*
    that you must always comply with, and you absolutely should not cross these boundaries.
    Failure to comply could lead to a suspension or termination of your Azure account,
    legal action brought against you by Microsoft, and financial liability claims
    being made against you!


    > **Important note**

    >

    > As these guidelines are occasionally updated, we recommend that you visit `https://www.microsoft.com/en-us/msrc/pentest-rules-of-engagement`
    to review the latest information.


    The following activities are prohibited:


    - Scanning assets that belong to *other Azure customers*.

    - Gaining access to any *data that is not yours*.

    - Performing any kind of denial of service testing is strictly forbidden as it
    may result in *unplanned downtime for other Azure customers.*

    - Attempting phishing or other social engineering attacks against Microsoft employees.


    The following activities are allowed:


    - Scanning your Azure endpoints to uncover application or configuration vulnerabilities

    - Port scanning and fuzz testing your Azure endpoints


    In general, any activity that could impact other Azure customers or the stability
    of the underlying Azure infrastructure is not allowed (including testing and accessing
    other customers'' data without permission). Testing your Azure endpoints and the
    applications hosted on them is encouraged.


    ### Azure penetration test scopes


    Penetration tests in Azure can come in a variety of different scopes. Depending
    on how your organization determines the threats to the environment, and how they
    define a *penetration test*, there may be different goals for the test.


    Common Azure penetration test scopes include the following:


    - Anonymous external testing

    - Read-only configuration review

    - Internal network testing

    - Architecture review


    Many times, an Azure penetration test will consist of any combination of these
    scopes. In any case, we will want to get written legal approval from the owners
    of the Azure assets before we start testing. Like any other penetration test,
    *having a clearly defined scope and methodology is crucial to the success of the
    project.*


    For those that are approaching this content from a bug bounty standpoint, this
    chapter will provide you with plenty of options to go after Azure targets from
    an external perspective. Just like any other test, it is always good to make sure
    that the Azure targets fall within the scope of the bug bounty program that you
    are working on.


