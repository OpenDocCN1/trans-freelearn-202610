    # Lateral movement, escalation, and persistence in App Service


    After gathering credentials from an App Service publish profile, we have a few
    options for persisting, moving laterally, and/or escalating privileges. First
    things first, we will want to review the application files for any credentials
    that may be stored in existing configuration files or application code from previous
    deployments. The easiest way to do this is by connecting to the FTP server associated
    with the application. You can obtain the FTP server endpoint in the Azure portal
    (App Service → Deployment Center → FTP Credentials). You can also obtain the endpoint
    using the Azure CLI by running the following command:


    ```

    ```bash

    az webapp deployment list-publishing-profiles --name <app-name> --resource-group
    <group-name> --query "[? ends_with(profileName, ''FTP'')].{profileName: profileName,
    publishUrl: publishUrl}"

    ```

    ```


    You can then connect using an FTP client. If you don''t have a preferred FTP client,
    you can always use the Windows explorer with an FTP:// path.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_260_0.png)


    At this point, we can also upload a web shell that would allow persistent access
    to the application server, and it would allow us to run commands to generate tokens
    for any attached managed identities. If you go this route, make sure that you
    use a web shell that you trust and password-protect the web shell to prevent other
    attackers from getting access to your shell.'
