    \ AzureIPCheck 工具（https://github.com/daddycocoaman/azureipcheck），它提供类似功能，但由于是基于\
    \ Python 的工具，其工作方式略有不同。\n\n| Cloud IP Checker 信息 | |\n|---|---|\n| Creator: |\
    \ Dean Bryen（Twitter：@deanbryen） |\n| Open Source or Commercial: | 开源项目 |\n| GitHub\
    \ Repository: | https://github.com/deanobalino/cloudipchecker |\n| Language: |\
    \ Go |\n\n## 动手练习 – 确定自定义域名服务是否托管在 Azure\n\n在本练习中，我们将使用测试订阅中的 book.azurepentesting.com\
    \ 主机作为示例。要查看此主机是否为 Azure 托管系统，让我们进行一些基本的域名和 IP 侦察：\n\n1. 在渗透测试 VM 中，打开 PowerShell\
    \ 控制台。使用 `nslookup` 命令识别与我们主机关联的 IP 地址：\n\n   ```text\n   nslookup book.azurepentesting.com\n\
    \   ```\n\n2. 记录返回的 IPv4 地址。此外，请注意在以下截图中，主机解析为 `azurepentesting.z13.web.core.windows.net`，这表明该站点托管在\
    \ Azure 中：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_105_0.png)\n\n   *图\
    \ 3.8 – 获取 IPv4 地址*\n\n3. 在 PowerShell 控制台中，运行以下命令以确定 IP 地址是否属于 Azure 已发布 IP 范围。将\
    \ `<IP_ADDRESS>` 替换为你在上一步中记录的 IP 地址值：\n\n   ```text\n   Invoke-WebRequest https://cloudipchecker.azurewebsites.net/api/servicetags/manual?ip=<IP_ADDRESS>\
    \ -UseBasicParsing | Select-Object -ExpandProperty Content\n   ```\n\n4. 正如前述输出所示，该\
    \ IP 属于 Azure IP 范围（美国东部区域的 Azure Storage 服务），因此我们可以推断该服务访问点托管在 Azure 中：\n\n \
    \  ![](img/4fa338e84e0a590967a142dd798ba4e2_106_0.png)\n\n   *图 3.9 – 查看 Cloud\
    \ IP Checker 结果*\n\n现在我们了解了域名和子域名在 Azure 中的运作方式，让我们看看它们如何可以被进行子域名接管攻击。\n\n## 子域名接管\n\
    \n在讨论 Azure 平台 DNS 枚举时，不提及子域名接管问题是不完整的。在调查托管在 Azure 中的应用程序时，你可能会注意到向不存在的 Azure\
    \ 子域发出的资源请求。\n\n这种情况有时发生在应用程序最初配置为从 Azure 端点提取内容，但随后内容更改为不同来源，并且初始端点资源从客户的 Azure\
    \ 订阅中删除。在某些情况下，指向这些端点的客户管理的 DNS 记录也未被清理。\n\n在实践中，这些通常是 JavaScript 文件或其他类似的 Web\
    \ 资源，因为它们对页面显示的影响通常较小且不易被注意到。在这些情况下，攻击者可能能够在 Azure 中重新创建受影响的资源，并通过受影响的网站投递缺失内容。\n\
    \n这只需在新的 Azure 账户中重新创建端点资源并认领缺失资源的子域名即可：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_107_0.png)\n\
    \n*图 3.10 – 子域名接管示例*\n\n其影响可能仅限于网站篡改，也可能严重到存储型跨站脚本或将站点重定向到恶意内容。这是在漏洞赏金中常见的问题，也是需要留意的事项。最常容易受到子域名接管攻击的服务是\
    \ Azure Blob、CDN、Traffic Manager 和 App Services，但这也可能适用于其他具有公共 DNS 后缀的服务。\n\n\
    现在我们了解了自定义域名在 Azure 中的使用方式，让我们来看看在这些面向公众的系统中可能发现的不同类型漏洞。\n\n## 存储账户\n\n存储账户是 Azure\
    \ 在云中处理数据存储的方式。这些账户包含以下子服务：\n\n- **Blob 服务**：通用 HTTP/HTTPS 文件托管\n- **Files 服务**：附加数据存储（SMB/NFS）\n\
    - **Table 服务**：NoSQL 半结构化数据集\n- **Queue 服务**：HTTP/HTTPS 消息存储\n\n根据之前的子域名枚举任务输出，我们知道\
    \ azurepentesting 基础词产生了一个名为 `azurepentesting` 的存储账户。\n\n我们还可以看到以下子域名的 DNS 记录：\n\
    \n- **Blob 服务**：`azurepentesting.blob.core.windows.net`\n- **Files 服务**：`azurepentesting.file.core.windows.net`\n\
    - **Table 服务**：`azurepentesting.table.core.windows.net`\n- **Queue 服务**：`azurepentesting.queue.core.windows.net`\n\
    \n默认情况下，在创建存储账户时会分配这四个子域名。这并不一定意味着 Azure 客户正在使用全部四个服务进行数据存储，因此我们需要确定它们是否包含任何可匿名访问的数据。\n\
    \nFiles、Table 和 Queue 服务访问始终需要某种级别的身份验证（本章中我们不会关注它们）。相反，我们将关注 Blob 服务，管理员/开发人员可以为其配置匿名文件访问。\n\
    \n### Blob 存储账户权限概述\n\n存储账户中的 Blob 服务由 **容器** 组成。这些容器本质上是可用于存储对象/数据的目录。你可以通过 HTTP/HTTPS\
    \ 端点访问这些对象。URL 地址是存储账户名称、容器和对象名称的组合。\n\n如以下图所示，如果存储账户名称为 `azurepentesting`，容器名称为\
