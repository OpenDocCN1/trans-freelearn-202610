    ## 3 查找 Azure 服务与漏洞


    作为渗透测试人员，你可能会在评估过程中被要求对 Azure 租户进行匿名攻击。从范围的角度来看，这可能会很棘手。任何人都可以随意命名一个 Azure 服务，而且可能很难找到真正在范围内的资源。无论你是在追逐漏洞赏金，还是在渗透测试期间寻找影子
    IT 资产，匿名的 Azure 服务发现都可以成为识别环境中漏洞的有用工具。


    在本章中，我们将介绍不需要对 Azure 租户进行任何身份验证的攻击。此外，这些攻击还可以用于获得对 Azure 租户的初始访问权限。我们还将讨论目前可用于评估
    Azure 服务漏洞的多个开源工具包。


    具体来说，在本章中，我们将涵盖以下小节：


    - Azure 渗透测试指南

    - 匿名服务识别

    - 识别面向公共服务的漏洞

    - 查找 Azure 凭据


    ## 技术要求


    对于本章，我们将使用在 *第 2 章，构建你自己的环境* 中搭建的虚拟机。如果你没有搭建自己的环境，请确保你拥有带 PowerShell 的 Windows
    系统的本地管理员访问权限。虽然理解本章内容并不绝对需要 Windows 桌面环境，但作者建议（如前一章所述）启动一台 Azure 虚拟机来测试我们将要介绍的工具和技术。


    ## Azure 渗透测试指南


    自 2017 年 6 月起，*微软不再要求组织在对其 Azure 资源进行渗透测试前获得预先批准*（`https://docs.microsoft.com/en-us/azure/security/fundamentals/pen-testing`）。需要特别注意的是，此豁免不适用于其他微软云服务，例如
    Office 365。即使你在执行渗透测试前无需通知微软，但仍然有明确规定的 *交战规则*，你必须始终遵守，并且绝对不应跨越这些界限。不遵守规定可能会导致你的
    Azure 账户被暂停或终止、微软对你提起法律诉讼，以及向你提出财务赔偿责任索赔！


    > **重要说明**

    >

    > 由于这些指南会不时更新，我们建议你访问 `https://www.microsoft.com/en-us/msrc/pentest-rules-of-engagement`
    以查看最新信息。


    以下活动被禁止：


    - 扫描属于 *其他 Azure 客户* 的资产。

    - 访问任何 *不属于你的数据*。

    - 严禁执行任何形式的拒绝服务测试，因为这可能导致 *其他 Azure 客户遭遇计划外停机*。

    - 尝试对微软员工进行网络钓鱼或其他社会工程攻击。


    以下活动被允许：


    - 扫描你的 Azure 端点以发现应用程序或配置漏洞

    - 对你的 Azure 端点进行端口扫描和模糊测试


    一般来说，任何可能影响其他 Azure 客户或底层 Azure 基础设施稳定性的活动都是不允许的（包括未经许可测试和访问其他客户的数据）。测试你的 Azure
    端点及其上托管的应用程序是受到鼓励的。


    ### Azure 渗透测试范围


    Azure 中的渗透测试可以有多种不同的范围。根据你的组织如何确定对环境的威胁，以及他们如何定义 *渗透测试*，测试可能会有不同的目标。


    常见的 Azure 渗透测试范围包括以下内容：


    - 匿名外部测试

    - 只读配置审查

    - 内部网络测试

    - 架构审查


    很多时候，Azure 渗透测试会包含这些范围的任意组合。无论如何，在开始测试之前，我们都希望获得 Azure 资产所有者的书面法律批准。就像任何其他渗透测试一样，*拥有明确定义的范围和方法论对项目的成功至关重要*。


    对于那些从漏洞赏金角度看待本内容的人来说，本章将为你提供大量从外部角度攻击 Azure 目标的选项。就像任何其他测试一样，始终确保 Azure 目标在你所参与的漏洞赏金计划范围内是个好主意。


    在本章的其余部分，我们将从匿名枚举和测试 Azure 服务开始。然后，我们将研究可以帮助我们获取租户中 Azure Active Directory 账户的攻击场景。


