  - '[PAGE 160]


    While this is a test system in our environment, you may want to avoid adding additional
    tools to a system that you have compromised in a test. In this case, `jq` helps
    us to get a well-formatted JSON output. Here is a screenshot of the command and
    its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_160_0.png)


    Figure 4.27 – Example metadata service reply


    The output will contain information about the VM’s compute, network, disk, and
    other configurations.


    +   5. Check whether the VM has an associated managed identity using the following
    command. If one is used, an `access_token` will be returned and this could present
    an opportunity to escalate privileges:


    ```

    ```bash

    root@LinuxVM:~# curl -H Metadata:true -s ''http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F''
    | jq

    ```

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_160_1.png)


    Figure 4.28 – Example metadata token output'
  - '[PAGE 161]


    You can see here that we got an access token for the Azure management plane (Resource
    Manager). This token can now be used to interact with the Azure REST APIs. The
    MicroBurst toolset has a set of functions that can use these tokens to interact
    with the APIs to gather key vault secrets and storage account keys and even run
    commands on VMs. We will cover some of these features in the following chapter,
    but it''s good to know how to obtain the tokens.


    While we could use the access token with the Azure REST APIs, it''s much easier
    to use the Azure CLI to interact with the subscription. Since this is our testing
    environment (and not a client''s), let''s install the Azure CLI to check the permissions
    that this VM has.


    +   6. Install the Azure CLI on the Linux system using the following command:


    ```

    ```bash

    root@LinuxVM:~# curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

    ```

    ```


    +   7. Log in with the VM''s managed identity using the following command:


    ```

    ```bash

    root@LinuxVM:~# az login --identity

    ```

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_161_0.png)


    Figure 4.29 – Az CLI login with the managed identity'
