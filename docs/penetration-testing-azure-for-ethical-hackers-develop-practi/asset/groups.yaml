    +   - MicroBurst: `https://github.com/NetSPI/MicroBurst`

    +   - Lava: `https://github.com/mattrotlevi/lava`


    MicroBurst and PowerZure should already be installed on your pentest **virtual
    machine (VM)** from previous chapters, but Lava will be a new addition for this
    chapter. All the examples from this chapter can be executed using the pentest
    VM that we created in *Chapter 2, Building Your Own Environment*, or from an equivalently
    set up Windows desktop.


    # Reviewing the Contributor RBAC role


    As we mentioned briefly in the first chapter of this book, the built-in Contributor
    RBAC role grants full access to manage *all resources at the scope of assignment*
    (management group, subscription, or resource group), but it is restricted from
    assigning permissions to other users or identities.


    Given this role''s level of access, our focus will not only be on using the permissions
    but also on how to leverage them to exploit user misconfigurations, with the goals
    of escalating privileges and moving laterally. We will achieve this by exploiting
    Azure platform features that can be used to run operating system-level commands/scripts
    on IaaS workloads such as VMs and **virtual machine scale sets (VMSSes)**.'
  - '[PAGE 189]


    **Important note**

    For those with more experience in on-premises Windows environments, Contributor
    access is similar to having a domain account with a local administrator on most
    of the systems. You have rights to manage infrastructure and make changes, but
    you don’t have rights to add new users to the domain or make global changes at
    the domain administrator level.


    Here are some IaaS platform features that the Contributor role has permissions
    to use that we can abuse for this purpose:


    +   - Resetting local user passwords on VMs

    +   - Running commands, as a privileged user, on VMs

    +   - Installing and executing VM extensions

    +   - Exporting unencrypted operating system disks for analysis


    Note that these are potentially obvious state changes in the environment that
    may cause issues with the IaaS resources if done improperly. Proceed with attacks
    using these features with caution. We will cover these features in later sections
    of this chapter, but first, let’s walk through the process of setting up our Azure
    subscription for the upcoming exercises in this chapter.


