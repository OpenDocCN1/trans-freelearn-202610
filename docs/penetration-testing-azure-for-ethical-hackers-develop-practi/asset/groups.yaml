    BuiltInRole\",\n\"type\": \"Microsoft.Authorization/roleDefinitions\"\n}\n```\n\
    \nWe can see in the preceding permissions that a role definition supports two\
    \ types of operations, as follows:\n\n+   - Control-plane operations that describe\
    \ the management actions that the role can perform. These are defined in the `'actions':\
    \ [ ]` section. An example of a management action is the permission to create\
    \ a storage account.\n+   - Data-plane operations describe the data actions (within\
    \ a resource) that the role can perform. These are defined in the `'dataActions':\
    \ [ ]` section. An example of a data action is the permission to read the data\
    \ that is stored in a storage account.\n\nWe can also see in the preceding permissions\
    \ that certain operations can be excluded for a role. The `'notActions': [ ]`\
    \ section defines management actions that a role is restricted from performing.\
    \ The `'notDataActions': [ ]` section defines data actions that a role is restricted\
    \ from performing."
  - '[PAGE 37]


    In the preceding example for the **Contributor** role, the role has the permission
    to perform all management (*) actions, but it is restricted (by the `notActions`
    definition) from performing authorization-related management actions, which means
    that the role cannot be used to assign permissions to others. Also, the role does
    not have the permissions to perform any data action.


    It should also be noted that this role definition also contains the `assignableScopes`:
    [`/`]` section, which denotes how the role can be applied in the tenant. `/` indicates
    that it can be applied at the root of the management group structure, but it can
    also be applied to any scopes (child management groups, subscriptions, and so
    on) under the root.


    # Default RBAC roles


    At the most basic level, there are three primary roles that are commonly applied
    in Azure: **Reader**, **Contributor**, and **Owner**. Beyond these three primitive
    roles, you will find service-specific roles that act as restricted versions of
    these base roles. These restricted roles are useful for reducing a user''s permissions
    in a specific subscription, but they can still allow for privilege escalation
    in the environment.


    For example, the **Virtual Machine Contributor** role (applied at the subscription
    level) *does not allow* an Azure AD user to be a contributor for all of the services
    in the subscription. However, the role does allow `Microsoft.Compute/virtualMachines/*`
    actions, which means it would allow the user to run commands on any of the VMs
    in the subscription.


    If this VM is configured with a privileged managed identity, that VM Contributor
    user could run commands on the VM to assume the rights of the managed identity
    and escalate their privileges. We will dive deeper into this concept in *Chapter
    5, Exploiting Contributor Permissions on IaaS Services*, where we learn about
    using contributor rights on VMs.'
  - '[PAGE 38]


    An important point to note is that Azure resources and the Azure AD tenant have
    separate permission systems. This means that the roles used to grant access to
    Azure AD are different from the roles used to grant access to Azure resources,
    as depicted in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_38_0.png)


    Figure 1.7 – Azure AD roles versus Azure RBAC roles


    Azure AD roles are used to manage access to Azure AD resources and operations,
    such as user accounts and password resets, while Azure RBAC roles are used to
    manage access to Azure resources such as storage accounts, SQL databases, and
    so on.


    Both Azure AD and Azure resources have multiple built-in roles with predefined
    permissions that organizations may use to grant access to users and applications.
    Both support custom roles that are created by administrators. At the time of writing,
    there are currently 60 built-in Azure AD roles and over 220 Azure RBAC built-in
    roles.'
