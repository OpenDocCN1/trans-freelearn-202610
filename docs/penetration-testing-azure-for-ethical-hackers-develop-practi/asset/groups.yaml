    \nIt is also important to note that some DNS suffixes are regional, while others\
    \ are global. For example, if a customer creates a public IP resource with an\
    \ associated DNS label in the Azure UK South region, the FQDN of that resource\
    \ will be `<dns label>.<region>.cloudapp.azure.com`.\n\n> **Important note**\n\
