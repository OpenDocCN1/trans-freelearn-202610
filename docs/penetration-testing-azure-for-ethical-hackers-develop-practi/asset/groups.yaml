    # Plan on getting caught


    For any situation where you want to persist in an environment, you should assume
    that your presence will be noticed and that your access will be removed. Your
    initial access vectors should always be considered *short-term resources* that
    allow you to set up additional persistence options. While you may be able to maintain
    access with those initial vectors, they are likely to be the first thing to get
    burned.


    # Have multiple channels ready


    By having multiple access options for an environment, not only do you give yourself
    options for restoring access that gets removed, but you also have multiple channels
    that can confuse anyone doing incident response on the environment. It may be
    easier to hide some of your activities within one account or service by making
    louder noises with a channel that you are willing to burn.


    Let''s take a look at some examples:


    +   - Direct VM command execution using the Run command function with an Azure
    AD user. This is a fairly obvious action that is easy to track back to a single
    user.

    +   - Indirect VM command execution via an Automation Account runbook using the
    Run command function, with the Run as account. This is masked by the Run as account
    and may be less obvious.


    Having both of these command execution options allows you to potentially mask
    your activities with other valid actions in the tenant. Either of these options
    could also be a red flag that could be used to distract the incident response
    team while you complete other actions.


    # Use long-term and short-term channels


    By using long-term persistence channels to create or recover access to your short-term
    channels, you can burn short-term resources, if needed. The long-term persistence
    methods should be privileged (subscription owner, AAD tenant permissions, and
    so on) and allow you to create new resources or assign new rights to the tenant.
    These will be the true persistence methods that help you keep, or recover, overall
    access to the tenant. The long-term channels should also be used sparingly as
    they are crucial for persistence. The less they are used, the less noise there
    will be.'
