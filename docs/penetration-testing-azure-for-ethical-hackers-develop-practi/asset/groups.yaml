  - '[PAGE 275]


    To prevent lateral movement, the best practice is to keep both planes (Azure AD
    and Azure resources) separate. This means that separate user accounts should be
    used to administer them. If this best practice is *not* followed, the compromise
    of an identity that has access to Azure AD can be leveraged to move laterally
    to Azure resources and vice versa.


    With that being said, there are other options that an attacker could look to exploit
    even if user accounts are kept separate for Azure AD and Azure resources. We will
    look at some of those options in the next sections.


    # Path 1 – Exploiting group membership


    An Azure AD account may not have default access to Azure resources, but if it
    has access to modify group memberships in Azure AD, we could exploit this to add
    our account to a group that has permission to Azure resources. *Figure 7.2* shows
    how this attack would work:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_275_0.png)


    *Figure 7.2 – Azure AD and subscription relationship*


    Let''s discuss the steps briefly:


    +   1. **User3** starts out with no access to Azure resources but has permissions
    to modify group membership in Azure AD.

    +   2. The **cloud-architects** group is assigned the Owner role for Azure resources.

    +   3. **User3** adds themself to the **cloud-architects** group in Azure AD,
    which happens to have permissions to Azure resources.

    +   4. **User3** now has permissions to Azure resources by virtue of the new group
    membership.'
