    \ -OutFile Ubuntu.appx -UseBasicParsing\n```\n\n5. Verify the download using the\
    \ following command:\n\n```\nGet-ChildItem\n```\n\nHere is what the output will\
    \ look like:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_83_0.png)\n\nFigure 2.33\
    \ – Verifying the downloaded Linux distribution\n\n6. Extract the downloaded distribution\
    \ using the following commands:\n\n```\nRename-Item .\\Ubuntu.appx .\\Ubuntu.zip\n\
    ```\n\n```\nExpand-Archive .\\Ubuntu.zip .\\Ubuntu\n```\n\n7. Install the extracted\
    \ Linux distribution with the following commands. The installation will take a\
    \ few minutes to complete:\n\n```\nSet-Location .\\Ubuntu\\\n```\n\n```\n.\\ubuntu2004.exe\n\
    ```\n\n8. When prompted to enter credentials for the Linux installation, complete\
    \ the following:\n\n- Enter new UNIX username: pentestadmin.\n- New password:\
    \ To keep things simple, enter the same password that you used for your pentest\
