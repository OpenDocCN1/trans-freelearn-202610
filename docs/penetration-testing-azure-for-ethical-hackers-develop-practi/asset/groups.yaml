    \ This may also allow you to reach those same systems from a VM in the right region.\
    \ If you have authenticated access to the Azure environment, keep an eye out for\
    \ Azure IP ranges in the network security group rules that you may be able to\
    \ take advantage of.\n\nAlternatively, this list can also be used to validate\
