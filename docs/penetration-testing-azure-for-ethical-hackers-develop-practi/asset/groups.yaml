    \ for more information.\n\nWhile the list is always updating, and not comprehensive,\
    \ here is a list of some of the commonly found DNS domains and their associated\
    \ services:\n\n| DNS Suffix | Associated Azure Service |\n| --- | --- |\n| file.core.windows.net\
    \ | Storage Accounts – Files |\n| blob.core.windows.net | Storage Accounts – Blobs\
    \ |\n| azurewebsites.net | App Services and Functions app |\n| scm.azurewebsites.net\
    \ | App Services – Management |\n| database.windows.net | Databases – MSSQL |\n\
    | documents.azure.com | Databases – Cosmos DB |\n| cloudapp.azure.com | Customer-assigned\
    \ public IP DNS |\n| vault.azure.net | Key Vault |\n| azurecontainer.io | Container\
    \ Instances |\n| azurecr.io | Container Registry |\n\nSo, what does this information\
    \ have to do with anonymously enumerating Azure services? As a pentester, you\
    \ could use DNS resolution or brute-force techniques to enumerate hosts on these\
    \ subdomains, in order to discover active instances of resources that Azure customers\
