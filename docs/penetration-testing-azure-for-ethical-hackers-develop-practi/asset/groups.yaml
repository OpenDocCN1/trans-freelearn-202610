    # About the reviewers


    **Jake Karnes** has a BS in computer science from San Jose State University and
    holds the GIAC Certified Incident Handler and Certified Ethical Hacker certifications.
    With a background in software consulting, he is currently a managing consultant
    at NetSPI. Jake specializes in web application and cloud penetration testing and
    also contributes to the development of applications and tools for the penetration
    testing team. He loves working in an ever-evolving field and sharing his knowledge
    and experience with others.


    > > I''d like to thank my wife, Halle, for empowering me to be the best version
    of myself. Her compassion and fortitude are an unending source of inspiration.
    She is my source of light and warmth through cloudy Portland days.

    > >

    > > I''d also like to thank my parents and brother for their patience and support
    while I spent endless hours in front of a computer.

    > >

    > > Lastly, I''d like to thank my uncle Pat for mentoring me in life and consulting.


    **Thomas Elling** is a principal security consultant and security researcher at
    NetSPI. He specializes in web application and cloud security testing and has advised
    multiple Fortune 500 companies in the technology sector. In his spare time, Thomas
    enjoys improving his coding skills, watching bad action movies, and hanging out
    with his dog, Chunks.


    > > Thanks to my family and my partner for all of their support.'
