    To review the sign-in logs for interesting events, we can use the Get-AzureADAuditSignInLogs
    cmdlet as shown in the following commands (this command requires a native work/school
    Azure AD user account and not a Microsoft account). The following commands will
    filter the sign-in logs for successful Azure Portal or Azure PowerShell sign-ins
    in the time range specified (the date can be modified to the date before your
    current date to get the results for the past 24 hours). The output of these commands
    provides great information that we can use to verify the users of Azure management
    tools, which usually means that they have some level of access to Azure resources:


    ```

    ```powershell

    # First connect to Azure AD

    Connect-AzureAD


    # Get successful Azure Portal sign-ins in the time range

    # (greater than the specified date)

    Get-AzureADAuditSignInLogs -Filter "appDisplayName eq RAzure Portal'' and createdDateTime
    gt $((Get-Date).AddDays(-1).ToString(''yyyy-MM-dd'')) and status/errorCode eq
    0"


    # Get successful Azure PowerShell sign-ins in the time range

    # (greater than the specified date)

    Get-AzureADAuditSignInLogs -Filter "appDisplayName eq ''Microsoft Azure PowerShell''
    and createdDateTime gt $((Get-Date).AddDays(-1).ToString(''yyyy-MM-dd'')) and
    status/errorCode eq 0"

    ```

    ```


    We can filter this further to get the properties that are useful to show us the
    security configurations of the user accounts. This information can be useful if
    we need to look to bypass defenses:


    ```

    ```powershell

    # Get interesting authentication properties for successful

    # Azure Portal sign-ins

    Get-AzureADAuditSignInLogs -Filter "appDisplayName eq ''Azure Portal'' and createdDateTime
    gt $((Get-Date).AddDays(-1).ToString(''yyyy-MM-dd'')) and status/errorCode eq
    0" | Select-Object UserPrincipalName, MfaDetail, AppliedConditionalAccessPolicies

    ```

    ```'
