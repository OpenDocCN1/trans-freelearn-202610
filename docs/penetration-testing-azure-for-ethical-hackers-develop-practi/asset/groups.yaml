    # Azure platform DNS suffixes


    As noted in *Chapter 1, Azure Platform and Architecture Overview*, many Azure
    platform services use public DNS suffixes that are owned and managed by Microsoft.
    When an Azure customer creates an instance of a resource, Azure assigns it a subdomain
    of the associated DNS suffix in the format of `<resource instance name>.<service
    dns suffix name>`.


    For example, the public DNS suffix of the Azure Blob storage service is `blob.core.windows.net`.
    If an Azure customer creates an instance of a storage account named `azurepentesting`,
    the **fully qualified domain name (FQDN)** of that service instance will be `azurepentesting.blob.core.windows.net`.


    It is also important to note that some DNS suffixes are regional, while others
    are global. For example, if a customer creates a public IP resource with an associated
    DNS label in the Azure UK South region, the FQDN of that resource will be `<dns
    label>.<region>.cloudapp.azure.com`.


