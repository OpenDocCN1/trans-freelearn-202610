    +   - Finding Azure credentials\n\n# Technical requirements\n\nFor this chapter,\
    \ we will want to make use of the virtual machine that we set up in *Chapter 2,\
    \ Building Your Own Environment*. If you did not set up your own environment,\
    \ make sure that you have local administrator access on a Windows system with\
    \ PowerShell. While you don’t absolutely need a Windows desktop to understand\
    \ the content of this chapter, the authors recommend spinning up an Azure virtual\
    \ machine (as described in the previous chapter) to test out the tools and techniques\
    \ that we will introduce.\n\n# Guidelines for Azure penetration testing\n\nFrom\
    \ June 2017, *Microsoft no longer requires organizations to obtain pre-approval\
    \ to conduct a penetration test against their Azure resources* (`https://docs.microsoft.com/en-us/azure/security/fundamentals/pen-testing`).\
    \ It is important to note that this exemption does not apply to other Microsoft\
    \ cloud services, such as Office 365. Even though you do not need to notify Microsoft\
    \ before you perform a penetration test, there are still stated *rules of engagement*\
    \ that you must always comply with, and you absolutely should not cross these\
    \ boundaries. Failure to comply could lead to a suspension or termination of your\
    \ Azure account, legal action brought against you by Microsoft, and financial\
    \ liability claims being made against you!\n\n> **Important note**\n> \n> As these\
    \ guidelines are occasionally updated, we recommend that you visit `https://www.microsoft.com/en-us/msrc/pentest-rules-of-engagement`\
    \ to review the latest information.\n\nThe following activities are prohibited:\n\
    \n+   - Scanning assets that belong to *other Azure customers*.\n+   - Gaining\
    \ access to any *data that is not yours*."
