    \n  图 4.29 – 使用托管身份进行 Az CLI 登录\n\n## 利用 App Service 配置\n\nAzure App Service 是\
    \ Microsoft 提供的用于在云中托管 Web 应用程序和 API 的服务。虽然我们在上一章中从高层介绍了它们，但这里将重点介绍订阅中 Reader\
