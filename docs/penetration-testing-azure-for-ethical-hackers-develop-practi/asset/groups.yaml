    \n13. 使用以下命令下载并验证被窃取的上下文文件。将 `<blob_container_url>` 占位符替换为你从脚本输出中复制的**外泄存储位置**的值：\n\
    \n```powershell\nInvoke-WebRequest -Uri \"<blob_container_url>\" -OutFile azureprofile.zip\n\
    Get-ChildItem azureprofile.zip\n```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_314_1.png)\n\
    \n14. 使用以下命令解压已下载的文件，并验证解压后的文件：\n\n```\n7z e azureprofile.zip\n```\n\n```\nGet-ChildItem\
    \ -Filter azureprofile.*\n```\n\n以下是第一个命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_315_0.png)\n\
    \n图 8.15 – 解压已下载的压缩 ZIP 文件\n\n以下截图是第二个命令及其输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_315_1.png)\n\
    \n图 8.16 – 查看解压后的凭据\n\n15. 使用以下命令将身份验证上下文恢复到你的渗透测试 VM：\n\n```\nImport-AzContext\
    \ -Path .\\azureprofile.json\n```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_317_0.png)\n\
    \n图 8.19 – 下载清理脚本\n\n18. 使用以下命令运行下载的脚本，以清理为本练习创建的资源：\n\n```powershell\n./admin-token-theft-scenario-windows-cleanup.ps1\n\
    ```\n\n以下是该命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_317_1.png)\n\
    \n图 8.20 – 运行清理脚本\n\n> **脚本有什么作用？**\n> \n> 该脚本会移除并清理之前创建的以下对象和资源：\n> \n> a. 用于模拟管理员系统的\
    \ Windows 管理员 VM\n> \n> b. 包含 Blob 容器的存储帐户，该容器曾用于存储从 Windows 管理员 VM 窃取的凭据\n> \n\
    > c. 凭据被窃取的 `victimadminuser` 帐户\n\n至此，你已经成功地从管理员系统中窃取了一个 Azure 凭据，并将其导入到你的系统中。接下来，我们将介绍在一组单独的\
    \ Azure 服务中维持持久化的可用选项。这些服务可以在多个层面启用远程访问，并提供对资源和租户的持久访问。\n\n如果为了完成这种持久化而创建任何新资源，你应该利用现有的标记和资源命名结构，以与现有资源融为一体。一般来说，最好坚持使用订阅中的现有服务来融入其中，但具体取决于你的可用选项，你可能不得不创建一些可能超出租户正常基础设施范围的新资源。\n\
    \n## 通过虚拟机维持持久化\n\n首先，我们将了解如何利用**虚拟机（VM）**来维持对 Azure 环境的访问。由于虚拟机经常加入更大的 Active\
    \ Directory 域，因此它们可用于同时在 Azure 和 Active Directory 中维持持久化。\n\n作为入门，我们将简要介绍使用**命令与控制（C2）**植入程序在\
    \ Azure VM 中启动持久化。有许多商业和开源工具可用（如 Cobalt Strike、Covenant、PowerShell Empire 等），它们通常用于获取系统的初始访问权限。我们可以在\
    \ Azure VM 上使用这些初始植入可执行文件，以便在 VM 上开始进行持久化操作。\n\n> **重要说明**\n> \n> 请记住，许多*现成的*\
    \ C2 工具可能会被端点保护软件检测到。在将载荷部署到 VM 之前，你可能需要采取额外步骤来混淆载荷。\n\n这些植入程序可以通过以下几种方式部署到 VM\
    \ 上：\n\n- 使用 VM Run 命令功能\n- 作为自定义脚本扩展\n- 直接 RDP 访问系统\n- 使用 DSC 配置（我们稍后将介绍）\n\n\
    一旦在这些系统上建立了初始部署和持久化，这些植入程序将允许我们在系统上执行命令，并保持对 VM 本身的访问。这为我们提供了对宿主机操作系统级别的访问权限，但并不保证对域或\
    \ AAD 的访问。\n\n由于 C2 植入程序的执行很大程度上依赖于 VM，因此本章不会过多关注这一部分。但请将其视为一种可选方案，因为我们正在讨论不同的持久化方法，而这些方法可能允许在\
    \ VM 上执行命令。\n\n## 开放管理端口\n\n作为在虚拟机上使用 C2 植入程序的替代方案，我们可以向自己的 IP 地址开放管理端口，以便使用我们已知的凭据远程访问\
    \ VM。如前所述，有多种方法可以获取（或设置）VM 的本地管理员凭据，我们可以使用这些凭据远程管理系统。\n\n这并不是理想的解决方案，因为在渗透测试期间，向互联网开放端口通常是一种糟糕的做法。此外，向特定\
    \ IP 地址开放端口会让应急响应团队看到你的 IP 地址，从而让他们很容易追查到你的系统。这种方法也可以扩展到 Azure PaaS 服务（Azure SQL\
    \ 数据库、密钥保管库等），但这是一种特别容易暴露的维持访问的方法，因此我们建议除非确实需要，否则应避免使用。\n\n另一个不太容易暴露的选项是，在网络安全组中开放端口时，将\
    \ Azure 服务标记指定为源。服务标记让我们能够定义不那么可疑的后门。例如，修改网络安全组以允许来自 AzureCloud 服务标记或 AzureCloud.UKSouth\
    \ 服务标记的 RDP 或 SSH 流量，对安全运营团队来说可能看起来不那么可疑，同时仍然允许来自任何范围与指定源匹配的 Azure 节点的连接。\n\n\
    ## 添加托管标识\n\n通过向 VM 添加托管标识（系统分配或用户分配），我们有可能为自己授予对租户中其他 Azure 资源的访问权限，以实现持久化。这需要我们完成以下步骤：\n\
    \n1. 在 Azure 门户中导航到目标 VM。\n2. 为 VM 分配系统分配或用户分配的托管标识。\n3. 在订阅/管理组和/或 Azure AD 级别为托管标识分配额外权限。从渗透测试的角度来看，我们需要小心，不要添加可能使环境容易遭受更广泛攻击的权限。\n\
    \n这个过程将为我们留下一个托管标识，只要我们仍有权访问 VM 和所附加的托管标识，就可以使用该标识访问 Azure（以及潜在的 Azure AD）资源。如前所述，这可能是一个很好的机会，可以将你的长期选项分开，使用一个托管标识进行订阅管理，使用另一个托管标识访问\
    \ Azure AD：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_320_0.png)\n\n此外，使用一个现有的、已具备我们想要用于持久化的权限的用户分配托管标识，可能比使用系统分配的托管标识更不易暴露，因为系统分配的托管标识之后仍需要授予权限（图\
    \ 8.21）。\n\n还应注意，当虚拟机上没有预先存在的托管标识时，此方法效果最佳。作为测试人员，我们希望避免做出任何可能干扰现有标识分配的重大状态更改。使用托管标识进行持久化的方法同样适用于**平台即服务（PaaS）**服务（App\
    \ Service、AKS 等）。\n\n## 自动化帐户 DSC\n\n尽管这与我们下一节的内容有些契合，但自动化帐户服务中的**所需状态配置（DSC）**功能是一个我们可以用来在\
    \ Azure VM 上维持访问的功能。DSC 功能通常用于确保系统已配置为所需配置，如果该配置发生更改，DSC 将调整配置，使其处于所需状态。\n\n"
