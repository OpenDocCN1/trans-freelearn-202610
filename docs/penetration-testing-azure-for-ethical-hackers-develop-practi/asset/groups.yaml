    ## Attacking Cloud Shell storage files


    If you have been following along with the book’s examples, you should be very
    familiar with Azure Cloud Shell (the browser-based command-line interface). But
    what if we told you that by having you use this shell, we have set you up for
    failure? We know that you have put a lot of trust in us as authors, and we are
    truly sorry if we have betrayed that trust. So, let’s take a moment to learn from
    this situation by showing you how to exploit the vulnerable environment that you
    have created for yourself.


    The first time you used Cloud Shell as the azureadmin user, you were prompted
    to create a file share in the file service of a storage account. If you went with
    the default option, the platform would automatically create a dedicated storage
    account with a name prefix of cs to host the file share (Figure 6.20). You could
    also choose to use an existing storage account to host this share.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_238_0.png)


    Figure 6.20 – Example Cloud Shell storage account


    This file share service in the storage account is used to persist data across
    sessions. Once created, it will be automatically mounted as the clouddrive folder
    in the $Home directory of the user’s subsequent Cloud Shell sessions. You can
    verify this by running the ls command in Cloud Shell (either Bash or PowerShell)
    as shown in Figure 6.21:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_238_1.png)


    Figure 6.21 – Mounted file share in a Cloud Shell session


    But what about the file share behind this? This share stores an EXT2 filesystem
    as an .img file.


    The name of the share and the image filename usually indicate the Azure AD user
    that Cloud Shell is attached to. In Figure 6.22, we can see that the cs-azureadmin-azurepentesting-com-1003200107d764bc
    file share contains the acc_azureadmin.img file (under the .cloudconsole folder).
    This information can be correlated with the results of Azure AD/RBAC reconnaissance
    efforts to determine whether the user of the shell is assigned privileged permissions.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_239_0.png)


    Figure 6.22 – Example Cloud Shell file


    So, what is the attack scenario here? As we mentioned earlier, this IMG file is
    mounted to the home directory of the user''s Cloud Shell session every time it
    is launched. Because the Contributor role has permissions (through the storage
    account keys) to download this IMG file, we could use that access to download
    and mount the IMG file on a Linux system.


    At this point, we can read any sensitive information from the file, but we can
    also modify it to run commands the next time it is mounted by the target account.
    If we target the right account, this gives an opportunity to escalate privileges
    by running commands in the Cloud Shell session of a more privileged user, such
    as an Azure AD global administrator or a subscription Owner.


    **Important note**


    For a full write up of the original research on this attack, refer to the following
    NetSPI blog: https://www.netspi.com/blog/technical/cloud-penetration-testing/attacking-azure-cloud-shell/.


    For the next exercise, we are assuming that you have been running all the environment
    setup scripts (as instructed) from Cloud Shell. At a minimum, we will assume that
    you have already set up a Cloud Shell storage account for the azureadmin user
    account that you have been using.


    ### Hands-on exercise – Escalating privileges using the Cloud Shell account


    In this exercise, we will exploit a Cloud Shell volume image to run sensitive
    commands with the permissions of a privileged user when they use Cloud Shell.
    The process that we will cover will follow a four-step process as highlighted
    in Figure 6.23. First, we will download the Cloud Shell volume image of a higher
    privileged user, we will mount the image on the Linux VM that we deployed earlier,
    we will plant commands that we want to run and re-upload back into the Cloud Shell
    file share.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_240_0.png)


    Figure 6.23 – Example Cloud Shell file


    Here are the tasks that we will complete in this exercise:


    - **Task 1:** Scan Azure file shares at scale using Lava.

    - **Task 2:** Download files in Azure file shares using Lava.

    - **Task 3:** Exploit the Cloud Shell image and upload it back.

    - **Task 4:** Verify the privilege escalation exploit.


    Here are the steps to complete the tasks:


    - 1. In an RDP session to your Pentest Windows VM, open PowerShell as an administrator.


    - 2. In the PowerShell console, type the following commands to SSH into the pentest
    Linux VM that was created earlier. Replace <linux_FQDN> with the value of Linux
    VM FQDN from the output of the script earlier. When prompted about the authenticity,
    type yes and press Enter. When prompted for the password, enter the value of Linux
    VM Password from the output of the script earlier.


    ```

    ssh pentestadmin@<linux_FQDN>

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_241_0.png)


    Figure 6.24 – SSH into the Linux VM


    - 3. In the Bash shell of the pentest Linux VM, use the following command to switch
    to the root user:


    ```

    pentestadmin@ptlinuxvm:~# sudo su -

    ```


    - 4. Use the following command to authenticate to Azure as the Contributor user
    using the Azure CLI. Replace <domain_name> with your Azure AD domain name. Also,
    replace <contributor_user_password> with the password of the contributoruser account:


    ```

    az login -u contributoruser@<domain_name> -p <contributor_user_password>

    ```

