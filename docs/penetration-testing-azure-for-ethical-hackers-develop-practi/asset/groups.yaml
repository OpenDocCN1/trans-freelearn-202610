    +   3. Use the `Invoke-EnumerateAzureBlobs` function with a base word of `azurepentesting`
    to identify public storage accounts with containers that have the container access
    level configured:


    ```

    Invoke-EnumerateAzureBlobs -Base azurepentesting

    ```'
