  - '[PAGE 47]


    For starters, you will need to be able to enable PowerShell script execution on
    your system. Chances are good that you will have some PowerShell execution policy
    restrictions on your testing system. As noted in this blog post by one of this
    book''s technical reviewers, Scott Sutherland, these execution restrictions are
    easily bypassed (see https://blog.nets​pi.com/15-ways-to-bypass-the-powershell-execution-policy/).


    For the installation of PowerShell modules, we will primarily use the PowerShell
    Gallery packages. The PSGallery (https://www.powershellgallery.com/) is a trusted,
    Microsoft-managed resource for package management. This is one of the easiest
    ways to install modules, and the Microsoft packages required for the toolkits
    will all be listed in the gallery.


    Since we will walk through the installation of the Azure PowerShell modules in
    the second chapter of this book, the installation of these modules on your current
    system is not immediately needed.


    # The Az module


    The Az PowerShell Cmdlets are functions that interact with Azure to allow for
    the administration of Azure services. These functions allow functions for listing,
    creating, destroying, and modifying Azure resources. While some Azure services
    are not supported by the functions, most services that you interact with will
    be supported.


    +   1. In an elevated (**Run as Administrator**) PowerShell session, run the Az
    module installation command, as follows:


    ```

    PS C:\> Install-Module -Name Az

    ```


    +   2. After installation, you will want to authenticate to your Azure tenant.
    You can do this by running the following code:


    ```

    PS C:\> Connect-AzAccount

    ```'
