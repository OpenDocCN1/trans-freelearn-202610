    \ for the attack scenarios are Linux-based. To avoid having to set up two pentest\
    \ systems for different toolsets, we will be installing **WSL** on the pentest\
    \ VM that we just deployed. WSL will allow us to run a Linux environment directly\
    \ on Windows without having to deploy a traditional VM. Here are the tasks that\
    \ we will complete in this exercise:\n\n- **Task 1:** Verify that the Windows\
    \ build supports WSL.\n- **Task 2:** Enable WSL (and reboot the VM).\n- **Task\
    \ 3:** Download the Ubuntu 20.04 Linux distribution.\n- **Task 4:** Install the\
    \ Ubuntu 20.04 Linux distribution.\n- **Task 5:** Launch the Linux distribution.\n\
    \nLet's install WSL by going through these tasks, as follows:\n\n1. Within the\
    \ RDP session to your pentest VM, right-click the **Start** button and click on\
    \ **Windows PowerShell (Admin)**, as illustrated in the following screenshot:\n\
    \nHere's what the output will look like:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_82_0.png)\n\
    \nFigure 2.31 – Verifying the Windows build version\n\n3. Enable WSL using the\
    \ following command. When prompted to restart the VM, type **Y** and press *Enter*.\
    \ Wait for a few minutes for the VM to restart, connect back to it using RDP,\
    \ and open the PowerShell console as an administrator:\n\n```\nEnable-WindowsOptionalFeature\
    \ -Online -FeatureName Microsoft-Windows-Subsystem-Linux\n```\n\nHere is what\
    \ the output will look like:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_82_1.png)\n\
    \nFigure 2.32 – Enabling WSL with PowerShell\n\n4. Change directories to your\
    \ user's directory (either `C:\\Users\\$env:USERNAME\\` or `~` will work) and\
