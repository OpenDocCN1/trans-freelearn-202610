    3. In the PowerShell session within the Cloud Shell pane, run the following command
    to download a script to create a user account with Owner permissions, a second
    user with Global Administrator permissions, and set up the required vulnerable
    workloads:


    ```powershell

    PS C:\> Invoke-WebRequest https://bit.ly/owner-scenarios

    -O owner-scenarios.ps1

    PS C:\> Get-ChildItem

    ```


    # What does the script do?


    The script creates a user account with Global Administrator permissions in Azure
    AD and another user with Owner permissions in the Azure subscription. See *Figure
    7.10* for a diagram:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_284_0.png)


    Figure 7.10 – Global Administrator/Owner exploit scenario


    5. After the script has completed, the key information that you will need for
    the rest of this exercise will be displayed in the output section. Copy the information
    into a notepad document for later reference. There are four values that you will
    need from the output section:


