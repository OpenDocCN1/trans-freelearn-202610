    Figure 1.14 – Az PowerShell authentication prompt


    From here, any command that you will use will be based off of the Microsoft guidance
    for approved verbs for PowerShell functions (https://docs.microsoft.com/en-us/powershell/scripting/developer/cmdlet/approved-verbs-for-windows-powershell-commands).


    Most of the verbs that we will use are Get or Invoke, but this would be a good
    opportunity to try out the PowerShell tab completion.


    +   1. If the module is not already imported into your PowerShell session, import
    the Az module, as follows:


    ```

    ```powershell

    PS C:\> Import-Module Az

    ```

    ```'
