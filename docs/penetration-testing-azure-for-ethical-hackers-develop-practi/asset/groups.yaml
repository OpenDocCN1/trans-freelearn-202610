    \n作为具有 Reader 访问权限的攻击者，我们可以查看这段代码，以提取有关应用程序的有价值信息，并可能收集可用于横向移动的凭据。\n\n这里值得注意的是，能否读取\
    \ Function App 中的代码取决于所使用的开发方法和部署类型。例如，如果在本地（而非门户中）进行开发并使用 Web Deploy 部署，则代码将不可见。对于\
