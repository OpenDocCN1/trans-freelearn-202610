    \n![](img/4fa338e84e0a590967a142dd798ba4e2_227_1.png)\n\n图 6.3 – 运行 Contributor\
    \ PaaS 场景脚本\n\n### 该脚本的作用是什么？\n\n该脚本在 Azure 订阅中创建一个具有 Contributor 权限的用户帐户。该脚本还会设置图\
