    \ of the VM that we are running the commands on. Thanks to the magic of the PowerShell\
    \ pipeline, we can pass the VMs variable to the Invoke-AzRunCommand function,\
    \ along with the local script:\n\n```\nPS C:\\> $VMs | Invoke-AzVMRunCommand -CommandId\
    \ 'RunPowerShellScript' -ScriptPath .\\whoami.ps1\n\nValue[0]        :\n    Code\
    \        : ComponentStatus/StdOut/succeeded\n    Level       : Info\n    DisplayStatus\
    \ : Provisioning succeeded\n    Message     : nt authority\\system\nValue[1] \
    \       :\n    Code        : ComponentStatus/StdErr/succeeded\n```"
  md: "\n## Lateral network movement opportunities\n\nSince VMs are deployed into\
    \ customer-managed virtual networks in Azure, it is common for organizations to\
    \ have connectivity from traditional networks in their organizations to Azure\
    \ virtual networks. Being able to run commands on Azure VMs gives us the opportunity\
    \ to discover services and resources in the networks that may be connected to\
    \ them and to look for opportunities to exploit them.\n\nThe ability to run commands\
    \ can also present opportunities to bypass defenses. In some situations, there\
    \ may be different **multifactor authentication (MFA)** requirements for on-premises\
    \ Azure access and remote Azure access. The authors have seen environments that\
    \ require MFA from the internet but do not require it for connections made from\
    \ trusted internal on-premises IPs.\n\nAfter escalating privileges within an on-premises\
    \ environment, dumping and cracking credentials for a tenant administrator account,\
    \ it may be possible to directly log in to the Azure management interfaces from\
    \ an on-premises system, or from an Azure VM.\n\n### Tenant credential hunting\n\
    \nIn some cases, organizations have privileged access workstations, or jump hosts,\
    \ hosted in Azure. These are systems that administrators can use to perform privileged\
    \ operations against their environments. We would look to gather cached access\
    \ tokens or other credentials from these machines for reuse.\n\nLater in this\
    \ chapter, we will be covering how to identify a managed identity on an Azure\
    \ VM. These identities can also be used to escalate into the Azure tenant from\
    \ the VM by generating tokens from the metadata service. The generated token can\
    \ then be used for gathering sensitive information from other services that you\
    \ may not have had access to.\n\nNow that we understand our goals, let's look\
    \ at different exploit scenarios for achieving these goals.\n\n### Exploiting\
    \ Azure platform features with Contributor rights\n\nWith access to the Contributor\
    \ role, we have a rich set of platform-level features that we can use to manage\
    \ VMs in the environment. Since we are approaching these features as penetration\
    \ testers, our use cases for these features may be slightly different than your\
    \ average user.\n\n#### Exploiting the password reset feature\n\nThe password\
    \ reset feature for Azure VMs was intended to simplify the process of resetting\
    \ the password of a local Azure VM user, using the VM agent that is installed\
    \ on every Azure VM. However, this feature could be abused to create new local\
    \ users with administrative privileges on both Windows and Linux VMs in Azure!\n\
    \nThis feature can be used from the Azure portal (Figure 5.6) or from Azure command-line\
    \ tools. Exploit tools such as Lava can also leverage this feature to reset VM\
    \ passwords at scale. This feature can be utilized by a pentester to move laterally\
    \ from the Azure platform to IaaS workloads to progress in an attack chain:\n\n\
    ![](img/4fa338e84e0a590967a142dd798ba4e2_195_0.png)\n\nFigure 5.6 – Example password\
    \ reset for a VM in the portal\n\nTo use the feature to create a local user for\
    \ a VM using the Azure CLI, we would use the following command:\n\n```bash\naz\
    \ vm user update -u username -p password -n <VM_Name> -g <Resource_Group>\n```\n\
    \nTo use the feature to create a local user for a VM using Azure PowerShell, we\
    \ could use the following command:\n\n```powershell\nSet-AzVMAccessExtension -ResourceGroupName\
    \ \"<Resource_Group>\" -Location \"<Location>\" -VMName \"<VM_Name>\" -Name \"\
    <Extension_Name>\" -TypeHandlerVersion \"2.4\" -UserName \"<Username>\" -Password\
    \ \"<Password>\"\n```\n\nYou are now authenticated with the Contributor credentials.\n\
    \n4. Obtain a list of VMs in the subscription using the following command:\n\n\
    ```\nGet-AzVM\n```\n\nHere is a screenshot of the command output:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_0.png)\n\
    \nFigure 5.9 – Listing of available VMs\n\n5. Create a new local user on the winvm01\
    \ VM using the following command:\n\n```\nSet-AzVMAccessExtension -ResourceGroupName\
    \ \"PENTEST-RG\" -VMName \"winvm01\" -Credential (get-credential) -typeHandlerVersion\
    \ \"2.0\" -Name VMAccessAgent\n```\n\nWhen prompted, enter pentestuser as the\
    \ username and secretPass123 as the password, then click OK.\n\nHere is a screenshot\
    \ of this process:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_1.png)\n\n\
    Figure 5.10 – Example of the password reset function\n\n6. Obtain the public IP\
    \ of `winvm01` with the following command:\n\n```\nGet-AzPublicIpAddress -Name\
    \ winvm01* | Select IpAddress\n```\n\nRemember that if a VM does not have a public\
    \ IP or the RDP port is not open, you can always use the Contributor role permissions\
    \ to expose the service on a public IP. This is a major state change in most environments\
    \ and increases risk, so it is not recommended for most environments.\n\nHere\
    \ is a screenshot of the command:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_198_0.png)\n\
    \nFigure 5.11 – Listing the public IP of the VM\n\n7. Connect to the public IP\
    \ over RDP and authenticate using the username `pentestuser` and the password\
    \ `secretPass123`.\n\nCongratulations! You have successfully created a local administrator\
    \ user on a VM using the Contributor role.\n\nThis is a very handy feature, but\
    \ it's not always the most appropriate tool to use during an assessment. Let's\
    \ say that we want to be a little more covert in our actions during a test. Creating\
    \ a new local administrator user on a system might trigger some alarms. As an\
    \ alternative, we can use native Azure functionality to run commands directly\
    \ on VMs, without the need for an additional account.\n\n#### Exploiting the Run\
    \ Command feature\n\nThe Run Command feature of Azure VMs is a platform feature\
    \ used to run scripts on VMs remotely using the VM agent. It can be used to run\
    \ PowerShell scripts on Windows VMs and shell scripts on Linux VMs. It is generally\
    \ used by administrators or developers to quickly diagnose and remediate VM access\
    \ and network issues and get the VM back to a good state.\n\nHere is some information\
    \ to keep in mind when exploiting this feature:\n\n- Scripts run as the System\
    \ account on Windows VMs and as an elevated user (typically root) on Linux VMs.\n\
    - We can only run one script at a time through the feature.\n- Interactive scripts\
    \ that prompt for user information are not supported.\n- Outbound connectivity\
    \ from the VM to Azure public IP addresses on port 443 is required to return the\
    \ results of the script.\n\nThe easiest way to get started with the Run Command\
    \ functionality is from the **Virtual machine** blade in the portal (*Figure 5.12*).\
    \ There are some prebuilt commands that can be run in the portal but for our use\
    \ case, we will want to run our own custom commands:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_199_0.png)\n\
    \nFigure 5.12 – Azure Run command menu\n\nBy selecting **RunPowerShellScript**,\
    \ or **RunShellScript** for Linux, we can run our own custom commands on the VM.\
    \ As a proof of concept, we will show the whoami command being run:\n\nFigure\
    \ 5.13 – Azure Run Command \"whoami\" execution\n\nWhile this may be one of the\
    \ easiest ways to run commands on a VM, it is not very scalable, and the portal\
    \ is prone to issues in returning command execution results to the browser in\
    \ a timely manner. This can result in truncated command results and session timeouts\
    \ occurring prior to commands finishing execution. For example, the simple whoami\
    \ command that was issued previously took 21 seconds to return the output to the\
    \ browser. While that is a significant amount of time for such a simple command,\
    \ a more complicated and processing-intensive command could take much longer (minutes)\
    \ to return.\n\n##### Running commands from the Az PowerShell module\n\nFor a\
    \ more scalable command execution option, we can use the Azure PowerShell module\
    \ to queue up commands on multiple VMs through the magic of the PowerShell pipeline.\
    \ In an Azure-authenticated PowerShell session, you can list out the running Windows\
    \ VMs and cast them to the VMs variable with the following command:\n\n```powershell\n\
    PS C:\\> $VMs = Get-AzVM -Status | where {($_.PowerState -EQ \"VM running\") -and\
    \ ($_.StorageProfile.OSDisk.OSType -eq \"Windows\")}\n\nPS C:\\> $VMs | select\
    \ ResourceGroupName,Name\nResourceGroupName      Name\n-----------------     \
    \ ----\nDEFAULT                RunCommandTestVM\n```\n\nIn the preceding example,\
    \ we know that the system is running Windows, so we will pass a PowerShell ps1\
    \ file to the host. We will need to enter our whoami command into the ps1 file\
    \ first:\n\n```powershell\nPS C:\\> echo \"whoami\" > whoami.ps1\n```\n\nTo execute\
    \ commands, we will need to pass in the resource group and the name of the VM\
    \ that we are running the commands on. Thanks to the magic of the PowerShell pipeline,\
    \ we can pass the VMs variable to the Invoke-AzVMRunCommand function, along with\
    \ the local script:\n\n```powershell\nPS C:\\> $VMs | Invoke-AzVMRunCommand -CommandId\
    \ 'RunPowerShellScript' -ScriptPath .\\whoami.ps1\n\nValue[0]        :\n    Code\
    \        : ComponentStatus/StdOut/succeeded\n    Level       : Info\n    DisplayStatus\
    \ : Provisioning succeeded\n    Message     : nt authority\\system\nValue[1] \
    \       :\n    Code        : ComponentStatus/StdErr/succeeded\n```\n"
  mdcn: "\n\n## 横向网络移动机会\n\n由于 VM 部署在 Azure 中由客户管理的虚拟网络内，组织通常会在其传统网络与 Azure 虚拟网络之间建立连接。能够在\
    \ Azure VM 上运行命令，使我们有机会发现可能与这些 VM 相连的网络中的服务和资源，并寻找利用它们的机会。\n\n运行命令的能力也可能提供绕过防御的机会。在某些情况下，对本地\
    \ Azure 访问和远程 Azure 访问可能有着不同的**多因素身份验证（MFA）**要求。作者曾见过一些环境，要求来自互联网的连接执行 MFA，但不要求来自受信任的内部本地\
    \ IP 的连接执行 MFA。\n\n在本地环境中提升权限，并转储和破解租户管理员账户的凭据后，可能可以直接从本地系统或 Azure VM 登录 Azure\
    \ 管理界面。\n\n### 租户凭据搜寻\n\n在某些情况下，组织会在 Azure 中托管特权访问工作站或跳板机。这些系统可供管理员对其环境执行特权操作。我们会尝试从这些机器上收集缓存的访问令牌或其他凭据，以便再次使用。\n\
    \n在本章后面，我们将介绍如何识别 Azure VM 上的托管标识。这些标识也可通过从元数据服务生成令牌，用于从 VM 提升权限进入 Azure 租户。生成的令牌随后可用于从你可能原本无法访问的其他服务收集敏感信息。\n\
    \n现在我们已经了解了目标，接下来看看实现这些目标的不同利用场景。\n\n### 利用参与者权限调用 Azure 平台功能\n\n借助参与者角色，我们拥有一组丰富的平台级功能，可用于管理环境中的\
    \ VM。由于我们将这些功能用作渗透测试者，因此我们对这些功能的用例可能与普通用户略有不同。\n\n#### 利用密码重置功能\n\nAzure VM 的密码重置功能旨在简化使用安装在每个\
    \ Azure VM 上的 VM 代理重置本地 Azure VM 用户密码的过程。然而，此功能可能被滥用，在 Azure 中的 Windows 和 Linux\
    \ VM 上创建具有管理权限的新本地用户！\n\n此功能可从 Azure 门户（图 5.6）或 Azure 命令行工具中使用。Lava 等利用工具也可利用此功能大规模重置\
    \ VM 密码。渗透测试者可以使用此功能从 Azure 平台横向移动到 IaaS 工作负载，从而推进攻击链：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_195_0.png)\n\
    \n图 5.6 – 门户中 VM 的密码重置示例\n\n要使用 Azure CLI 通过此功能为 VM 创建本地用户，我们将使用以下命令：\n\n```bash\n\
    az vm user update -u username -p password -n <VM_Name> -g <Resource_Group>\n```\n\
    \n要使用 Azure PowerShell 通过此功能为 VM 创建本地用户，我们可以使用以下命令：\n\n```powershell\nSet-AzVMAccessExtension\
    \ -ResourceGroupName \"<Resource_Group>\" -Location \"<Location>\" -VMName \"\
    <VM_Name>\" -Name \"<Extension_Name>\" -TypeHandlerVersion \"2.4\" -UserName \"\
    <Username>\" -Password \"<Password>\"\n```\n\n你现在已使用参与者凭据完成身份验证。\n\n4. 使用以下命令获取订阅中的\
    \ VM 列表：\n\n```\nGet-AzVM\n```\n\n以下是命令输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_0.png)\n\
    \n图 5.9 – 可用 VM 列表\n\n5. 使用以下命令在 winvm01 VM 上创建新的本地用户：\n\n```\nSet-AzVMAccessExtension\
    \ -ResourceGroupName \"PENTEST-RG\" -VMName \"winvm01\" -Credential (get-credential)\
    \ -typeHandlerVersion \"2.0\" -Name VMAccessAgent\n```\n\n出现提示时，输入 pentestuser\
    \ 作为用户名，输入 secretPass123 作为密码，然后点击“确定”。\n\n以下是此过程的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_1.png)\n\
    \n图 5.10 – 密码重置功能示例\n\n6. 使用以下命令获取 `winvm01` 的公网 IP：\n\n```\nGet-AzPublicIpAddress\
    \ -Name winvm01* | Select IpAddress\n```\n\n请记住，如果 VM 没有公网 IP 或未打开 RDP 端口，你始终可以使用参与者角色权限在公网\
    \ IP 上公开该服务。在大多数环境中，这是一项重大状态变更并会增加风险，因此不建议在大多数环境中使用。\n\n以下是命令的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_198_0.png)\n\
    \n图 5.11 – 列出 VM 的公网 IP\n\n7. 通过 RDP 连接到公网 IP，并使用用户名 `pentestuser` 和密码 `secretPass123`\
    \ 进行身份验证。\n\n恭喜！你已成功使用参与者角色在 VM 上创建了本地管理员用户。\n\n这是一个非常方便的功能，但在评估过程中，它并不总是最合适的工具。假设我们希望在测试期间采取更隐蔽一些的行动。在系统上创建新的本地管理员用户可能会触发一些警报。作为一种替代方案，我们可以使用\
    \ Azure 原生功能直接在 VM 上运行命令，而无需额外的账户。\n\n#### 利用运行命令功能\n\nAzure VM 的运行命令功能是一种平台功能，可使用\
    \ VM 代理在 VM 上远程运行脚本。它可用于在 Windows VM 上运行 PowerShell 脚本，在 Linux VM 上运行 shell 脚本。管理员或开发人员通常使用它来快速诊断和修复\
    \ VM 访问与网络问题，使 VM 恢复正常状态。\n\n利用此功能时，需要记住以下信息：\n\n- 脚本在 Windows VM 上以系统账户身份运行，在\
    \ Linux VM 上以提升的用户（通常为 root）身份运行。\n- 此功能一次只能运行一个脚本。\n- 不支持提示用户信息的交互式脚本。\n- 需要从\
    \ VM 到 Azure 公共 IP 地址（端口 443）的出站连接才能返回脚本结果。\n\n开始使用运行命令功能的最简单方法是从门户中的 **虚拟机**\
    \ 边栏选项卡（*图 5.12*）开始。门户中有些预构建命令可以运行，但对于我们的用例，我们需要运行自己的自定义命令：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_199_0.png)\n\
    \n图 5.12 – Azure 运行命令菜单\n\n通过选择 **RunPowerShellScript**（对于 Linux，则为 **RunShellScript**），我们可以在\
    \ VM 上运行自己的自定义命令。作为概念验证，我们将展示运行 whoami 命令：\n\n图 5.13 – Azure 运行命令执行“whoami”\n\n\
    虽然这可能是在 VM 上运行命令的最简便方法之一，但它的可扩展性不强，并且门户在及时将命令执行结果返回给浏览器方面容易出现问题。这可能导致命令结果被截断，以及命令尚未执行完毕就发生会话超时。例如，之前发出的简单\
    \ whoami 命令花费了 21 秒才将输出返回给浏览器。虽然对这样一个简单命令来说，这时间相当长，但更复杂、处理密集的命令可能需要更长的时间（几分钟）才能返回。\n\
    \n##### 从 Az PowerShell 模块运行命令\n\n要获得更可扩展的命令执行选项，我们可以使用 Azure PowerShell 模块，通过\
    \ PowerShell 管道的威力在多个 VM 上排队命令。在已经过 Azure 身份验证的 PowerShell 会话中，可以使用以下命令列出正在运行的\
    \ Windows VM，并将它们赋给 VMs 变量：\n\n```powershell\nPS C:\\> $VMs = Get-AzVM -Status\
    \ | where {($_.PowerState -EQ \"VM running\") -and ($_.StorageProfile.OSDisk.OSType\
    \ -eq \"Windows\")}\n\nPS C:\\> $VMs | select ResourceGroupName,Name\nResourceGroupName\
    \      Name\n-----------------      ----\nDEFAULT                RunCommandTestVM\n\
    ```\n\n在前面的示例中，我们知道系统运行的是 Windows，因此我们将把一个 PowerShell ps1 文件传递给主机。我们首先需要将 whoami\
    \ 命令输入到 ps1 文件中：\n\n```powershell\nPS C:\\> echo \"whoami\" > whoami.ps1\n```\n\
    \n要执行命令，我们需要传入资源组以及我们要在其上运行命令的 VM 的名称。借助 PowerShell 管道的威力，我们可以将 VMs 变量与本地脚本一起传递给\
    \ Invoke-AzVMRunCommand 函数：\n\n```powershell\nPS C:\\> $VMs | Invoke-AzVMRunCommand\
    \ -CommandId 'RunPowerShellScript' -ScriptPath .\\whoami.ps1\n\nValue[0]     \
    \   :\n    Code        : ComponentStatus/StdOut/succeeded\n    Level       : Info\n\
    \    DisplayStatus : Provisioning succeeded\n    Message     : nt authority\\\
    system\nValue[1]        :\n    Code        : ComponentStatus/StdErr/succeeded\n\
    ```\n\n"
