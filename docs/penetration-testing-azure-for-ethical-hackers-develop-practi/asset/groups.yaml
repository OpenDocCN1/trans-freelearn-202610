    ![](img/4fa338e84e0a590967a142dd798ba4e2_263_0.png)


    *Figure 6.55 – Options for runbook creation*


    There are a million different tasks that can be automated in Azure, but these
    actions often require access to a security principal in the tenant or credentials
    for external services. In the case of a security principal, a Run as account can
    be added to the Automation Account. This account can be granted permissions within
    the subscription, or tenant, and the runbook can use the account to take actions
    on its behalf.


    Additionally, the Run as account can be granted access policy rights on key vaults.
    This would allow the account to pull any cleartext credentials that it may need
    from a key vault, versus storing the credentials in the automation account, or
    as variables in the runbook code itself.


    > > **Important Note**

    > >

    > > Due to the frequent usage of Automation accounts to access key vaults in environments,
    a function was added to the MicroBurst toolkit to automate the extraction of Key
    Vault values using Automation account runbooks. Take a look at this NetSPI blog
    to get a better understanding of the extraction process and how it resulted in
    the discovery of the CVE-2019-0962 vulnerability:

    > > https://www.netspi.com/blog/technical/cloud-penetration-testing/azure-automation-accounts-key-stores/.'
