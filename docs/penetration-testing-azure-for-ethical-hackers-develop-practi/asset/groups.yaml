    may include specific IPs and hostnames for the environment that you are authorized
    to attack. If these hosts end up being in Azure, that will influence how we go
    about attacking those specific resources.


    # Introducing Cloud IP Checker


    Cloud IP Checker is a Go-based tool for checking IP addresses against the published
    Azure IP ranges and service tags. If an IP matches the published range, it displays
    the service that the IP belongs to and its region. The tool can be a published
    API, or it can be self-hosted.'
