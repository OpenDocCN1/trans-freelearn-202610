    # # Exploiting dynamic group memberships


    The last section of this chapter covers manipulating Azure AD account details
    to qualify accounts for dynamic group membership. Currently, we often see dynamic
    groups used for device management and geographic groupings of accounts. As more
    organizations move their Active Directory management into Azure AD, these dynamic
    groups will become more popular.


    As mentioned in *Chapter 1, Azure Platform and Architecture Overview*, dynamic
    group membership is based on rules that are set for parameters associated with
    an Azure AD account. These could be as simple as adding all users from a specific
    city to a group. There are multiple different ways that the rules can be configured,
    so we may see some pretty interesting group membership logic in real-world scenarios.


    For this example scenario, we will look at the **Dynamic Admins** group in our
    azurepentesting tenant. This group has a rule to allow any user with the word
    admin in their email address to be a member of the group. This group also has
    the Owner role applied for the subscription. Here is what the dynamic rule looks
    like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_181_0.png)


    Figure 4.50 – Example dynamic group membership rule


    While the administrators of this Azure AD tenant may be thinking that this group
    is moderately locked down, there is an Achilles’ heel that they are not accounting
    for. In our sample tenant, we allow guest accounts. The organization needs to
    have some external collaboration options, so all our users have the ability to
    invite external guest accounts by default.'
  - '[PAGE 182]


    The great part about this attack is that the initial user doesn''t need any permissions
    on subscriptions to execute the attack. They only need the ability to invite guest
    users. While it is helpful to see what the IAM permissions are, any user in this
    situation can look at a dynamic group (`subscriptionOwners`) and make some assumptions.


    As a user with Azure portal access, we can invite a new user that just happens
    to have admin in their email address:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_182_0.png)


    Figure 4.51 – User invitation screen


    This results in an invite email being sent to the `admin@fosaaen.com` account,
    and the user can accept access to the tenant.


    An important step to note here is the need to use an existing Azure account as
    the recipient of the invite. You can create the invite for a specific email address,
    but that email needs to create an Azure user in another tenant (Microsoft or otherwise)
    before it can officially be added to your victim tenant. Additionally, the user
    needs to meet any MFA and conditional access requirements that are pushed down
    from the victim tenant.'
