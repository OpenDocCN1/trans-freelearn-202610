  - '[PAGE 165]


    As a Reader in the subscription, we have limited options with Function apps, but
    the available options can be quite impactful. There are two options that we will
    cover in this section:


    +   - **Reading Function app code**

    +   - **Reading app files**


    Reading Function app code is a pretty simple process. As a Reader, we can navigate
    to individual Function apps, enter the **Functions** section, and review the individual
    functions:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_165_0.png)


    Figure 4.31 — Accessing Function app Functions


    Once in the menu for the function, we can navigate to the **Code + Test** section,
    which allows us to review the source code for the function. Anyone that has done
    source code review in the past will know that developers often hide things in
    the code to get things working in the application. This can often result in comments,
    passwords, and very vulnerable functions being readily identified by anyone with
    access to the code.


    As attackers with Reader access, we can look at this code to extract valuable
    information about the application, and potentially gather credentials that can
    be used to pivot.'
  - '[PAGE 166]


    It is worth noting here that being able to read the code in the Function app depends
    on the development method and deployment type used. For example, if development
    is done locally (not in the portal) and deployed using web deploy, the code will
    not be visible. This is also the case for compiled languages such as C:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_166_0.png)


    Figure 4.32 – Example vulnerable function


    Another source of valuable information in Function apps is under the **App files**
    blade for the Function app. While most basic Function apps will just contain a
    `host.json` file, we have seen multiple instances of functions that expose more
    sensitive files in their function applications.


    In this example, we can see that there is an `appsettings.json` file available
    in the app files, and we are able to see a client ID and secret that can be used
    to authenticate as an Azure AD app registration:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_166_1.png)


    Figure 4.33 – Example vulnerable app file'
  - '[PAGE 167]


    Commonly, these credentials end up hardcoded into functions and settings files,
    as the developer may take shortcuts with the identity management aspect of the
    application. As a more secure option, the developer should look at using managed
    identities with the Function app.


    As attackers, we now have app registration credentials that we can use to authenticate
    to the Az PowerShell modules and the Azure CLI. This example is not in our test
    environment but is provided to give context on what you can do when you encounter
    these credentials.


    In the following example, we used the credentials discovered in a Function app
    to authenticate to a subscription:


    +   1. First, we will store the credentials gathered from the Function app as
    a variable using the following command. At the credential prompt, we enter the
    client ID and secret obtained from the Function app:


    ```

    ```powershell

    PS C:\> $credential = Get-Credential

    ```

    ```


    Here is what this will look like in PowerShell:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_167_0.png)


    Figure 4.34 – Example Get-Credential prompt'
