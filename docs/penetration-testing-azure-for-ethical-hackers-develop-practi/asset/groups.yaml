    \ can be deployed to the VMs in several ways:\n\n+   - Using the VM Run command\
    \ function\n+   - As a custom script extension\n+   - Direct RDP access to the\
    \ system\n+   - Using DSC configurations (we will cover this shortly)\n\nOnce\
    \ the initial deployment and persistence have been established on these systems,\
    \ these implants will allow us to execute commands on the systems and maintain\
    \ access to the VMs themselves. This gives us operating system-level access to\
