    umount /mnt

    ```


    16. 现在，我们将驱动器上传回存储帐户并覆盖现有版本。首先，我们将获取存储帐户的名称并将其存储在变量中。将<storage_acct_name>替换为原始Cloud
    Shell文件所下载的存储帐户的名称（以cs前缀开头）：


