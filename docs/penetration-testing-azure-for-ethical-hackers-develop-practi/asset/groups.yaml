    As a starter, we will touch on using **command and control (C2)** implants to\
    \ start persistence in an Azure VM. There are many commercial and open source\
    \ tools available (Cobalt Strike, Covenant, PowerShell Empire, and more) that\
    \ are commonly used for getting initial access to a system. We can use these initial\
