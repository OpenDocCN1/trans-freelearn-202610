    \n让我们看看在下一个动手练习中，如何使用 MicroBurst 中的 `Get-AzPasswords` 函数来自动化该过程。\n\n## 动手练习 –\
    \ 在测试自动化账户中创建 Run as 账户\n\n由于 Run as 账户跨越了订阅和 Azure AD 的边界，我们无法通过编程方式创建这些账户并将其附加到新的自动化账户。幸运的是，这个过程非常简单。下面是我们将在本练习中完成的任务：\n\
