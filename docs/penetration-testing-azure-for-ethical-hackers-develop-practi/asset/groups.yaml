    - 发现防御DDoS攻击的各种选项\n- 保护主机和容器免受不断演变的安全威胁\n- 使用云原生工具实现平台治理\n- 使用安全中心和Azure Sentinel监控安全操作\n\
    \n## Packt正在寻找像您一样的作者\n\n如果您有兴趣成为Packt的作者，请访问 authors.packtpub.com 并立即申请。我们与成千上万的开发人员和技术专业人员（如您一样）合作，帮助他们与全球技术社区分享见解。您可以进行一般申请，申请我们正在招募作者的具体热门主题，或提交自己的想法。\n\
    \n## 分享您的想法\n\n现在您已经完成了*《面向道德黑客的Azure渗透测试》*，我们很乐意听到您的想法！如果您从Amazon购买了这本书，请点击此处直接前往该书的Amazon评论页面，分享您的反馈，或者在您购买该书的网站上留下评论。\n\
    \n您的评论对我们和技术社区都很重要，并将帮助我们确保提供优质内容。\n"
