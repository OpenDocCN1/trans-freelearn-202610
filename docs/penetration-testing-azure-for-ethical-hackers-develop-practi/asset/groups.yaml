    \n图 6.5 – 获取脚本输出\n\n你现在已成功创建了将在本章后续练习中使用的资源。本章中我们将探索的第一个资源是存储帐户。\n\n## 攻击存储帐户\n\
    \nAzure 存储帐户是 Azure 中主要的数据存储解决方案。其他 Azure 服务（如 App Service 和 Container Registry）在后端依赖它进行数据存储。该解决方案本身提供五种服务，可用于存储不同的数据集，包括非结构化应用程序数据对象（Azure\
    \ Blob 存储）、NoSQL 存储中的半结构化应用程序数据（Azure 表存储）、云中的托管文件共享（Azure 文件）、用于可靠消息传递的消息存储（Azure\
    \ 队列存储），以及用于大数据工作负载的数据湖（Azure Data Lake Storage Gen2）。可以想象，这项服务是攻击者的主要目标！在本章中，我们将重点关注\
    \ Azure Blob 存储和 Azure 文件。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_229_1.png)\n\
    \n图 6.6 – Azure 存储\n\nContributor 角色拥有读取和修改此服务管理平面上的任何配置的权限（向其他用户分配权限除外），但根据 RBAC\
    \ 权限，它并不固有地拥有读取或修改数据平面数据的权限（图 6.7）。这听起来可能令人困惑，但请注意，Contributor 角色策略文档并未指定任何 `dataActions`\
    \ 权限：\n\n```json\n\"permissions\": [\n  {\n    \"actions\": [\n      \"*\"\n \
    \   ],\n    \"notActions\": [\n      \"Microsoft.Authorization/*/Delete\",\n \
    \     \"Microsoft.Authorization/*/Write\",\n      \"Microsoft.Authorization/elevateAccess/Action\"\
    ,\n      \"Microsoft.Blueprint/blueprintAssignments/write\",\n      \"Microsoft.Blueprint/blueprintAssignments/delete\"\
    ,\n      \"Microsoft.Compute/galleries/share/action\"\n    ],\n    \"dataActions\"\
    : [],\n    \"notDataActions\": []\n  }\n]\n```\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_230_0.png)\n\
    \n图 6.7 – Azure Contributor 权限\n\nAzure AD 标识需要被授予额外的 `dataActions` 权限（例如图 6.8\
    \ 中列出的权限），才能使用 Azure AD 访问令牌访问数据平面。随着 Microsoft 越来越多地采用通过 Azure RBAC 暴露服务数据平面访问权限的这种模式，在\
    \ Azure 中利用服务数据平面而无需转向其他选项的机会将会更多：\n\n| 角色 | 描述 |\n|---|---|\n| Storage Blob Data\
    \ Contributor | 允许对 Azure 存储 blob 容器和数据进行读取、写入和删除访问 |\n| Storage Blob Data Owner\
    \ | 允许对 Azure 存储 blob 容器和数据进行完全访问，包括分配 POSIX 访问控制。 |\n| Storage Blob Data Reader\
    \ | 允许对 Azure 存储 blob 容器和数据进行读取访问 |\n| Storage File Data SMB Share Contributor\
    \ | 允许通过 SMB 对 Azure 存储文件共享进行读取、写入和删除访问 |\n| Storage File Data SMB Share Elevated\
