  - '[PAGE 27]


    # # An overview of Azure services


    As we noted earlier in this chapter, there are over 200 services available in
    Azure. Even though this sounds like a lot of services, they can generally be grouped
    into five categories, outlined as follows:


    +   - **Services that are used to host applications:** These services provide
    a runtime environment that can be used to execute application code or run container
    images. Services such as **Azure App Service, Azure Virtual Machine (Azure VM),**
    and **Azure Kubernetes Service (AKS)** fall into this category. Organizations
    use them to host external and internal applications.

    +   - **Services that are used to store data for applications:** These services
    are used to store different kinds of application data. Services such as Storage
    accounts, Azure SQL, and Cosmos DB fall into this category.

    +   - **Services that are used to create applications:** These services are used
    to create workflows that run in the cloud. Services such as Logic Apps and Functions
    apps fall into this category.

    +   - **Services that are used to enhance applications:** These are typically
    **Software-as-a-Service (SaaS)**-type services in Azure that are used to provide
    extra capabilities to other applications. A service such as Azure Cognitive Services
    falls into this category. This is used by developers to add intelligence to their
    custom applications using pre-built and pre-trained machine learning algorithms.

    +   - **Services that are used to monitor or manage applications:** These are
    services that are used to manage or monitor other services or applications. Services
    such as Azure Automation, API Management, Application Insights, and Azure Monitor
    fall into this category. Additional security-focused services, such as Azure Sentinel
    and Azure Security Center, would also fall into this category. These services
    can also provide useful insights from a penetration-testing perspective.


    As we progress through the book, we will touch on many services, but the core
    resources that are important to understand are outlined here.'
  - '[PAGE 28]


    This table outlines some of the most common Azure services that will be attacked
    in this book:


    | Service | Description |

    |---|---|

    | App Services | This service is inclusive of App Service and Function apps in
    Azure. These services can be used for "serverless" web application and API hosting.
    |

    | Storage Accounts | Storage accounts are used for most data storage operations
    in Azure. Files can be publicly or privately hosted, and files can be accessed
    through several protocols (**HyperText Transfer Protocol (HTTP)**, **Server Message
    Block (SMB)**, **Network File System (NFS)**). This service can also be used for
    static web content hosting. |

    | Automation Accounts | Another "serverless" code service, Automation accounts
    allow you to run scripting code (PowerShell and Python) from "runbooks" to automate
    processes in the subscription. There is a lot of surface area in this service,
    so we will return to it frequently throughout the book. |

    | Virtual Machines | One of the initial backbones of cloud services, these are
    VMs hosted in the cloud. There are multiple facets to deploying VMs in the cloud,
    so this service will also be a major focal point. |

    | Key Vaults | Azure key vaults are the primary credential store within Azure.
    This includes the storage of keys, secrets, and certificates. Aside from utilizing
    the standard **Identity and Access Management (IAM)** rights assignments, access
    policies can be applied to provide additional restrictions on Key Vault data.
    |

    | Azure SQL | This service is for hosting SQL databases in the cloud. Everything
    about the SQL database is managed by Microsoft, which can help simplify the usage
    of databases in Azure projects. |

    | Azure Container Registry/Azure Container Instances | As many environments start
    migrating to containerization, the usage of cloud container registries and cloud
    container instances is becoming more popular. Azure Container Registry holds the
    container images used as base images for containerization.\n\nWhile it is a relatively
    small part of a containerized environment, this service is a commonly targeted
    one, as the images frequently house sensitive information. |'
  - "[PAGE 29]\n\nAs you can see from the preceding information, Microsoft was very\
    \ practical with the naming of Azure services. For the most part, the service\
    \ names are based on what the service does. For example, the Azure service used\
    \ for hosting VMs is called **Virtual Machines**. In contrast, the equivalent\
    \ service in AWS would be **Elastic Compute Cloud (EC2)**.\n\n> **Important note**\n\
    > \n> For anyone that is making the terminology transition from AWS to Azure,\
    \ the following Microsoft document may be helpful for matching up any of the confusing\
    \ service names: `https://docs.microsoft.com/en-us/azure/architecture/aws-professional/services`.\n\
    > \n> For those more familiar with GCP, Microsoft also has some helpful documentation\
    \ at `https://docs.microsoft.com/en-us/azure/architecture/gcp-professional/services`.\n\
    \nIn *Chapter 3, Finding Azure Services and Vulnerabilities*, we will discuss\
    \ how some of these services can be discovered anonymously using the Azure **Domain\
    \ Name System (DNS)** naming structure. In the next section, we will review how\
    \ access to Azure services is structured and managed using RBAC.\n\n# # Understanding\
    \ the Azure RBAC structure\n\n**RBAC** is an authorization system used to control\
    \ who has access to Azure resources, and the actions users can take against those\
    \ resources. At a high level, you can think of it as *granting security principals\
    \ (users, groups, and applications) access to Azure resources, by assigning roles\
    \ to the security principals*.\n\nFor example, RBAC can be used to grant a user\
    \ access to manage all VMs in a subscription, while another user is granted access\
    \ to manage all storage accounts in the same subscription. That would be an odd\
    \ choice for separation of duties in a subscription, but cloud environments tend\
    \ to foster *creative solutions* for making things work.\n\nRBAC concepts get\
    \ far more complex when we start introducing the different scopes of role assignments\
    \ (management groups, subscriptions, and so on), but keep the preceding description\
    \ in mind as we progress.\n\nAzure RBAC is made up of the following components—**security\
    \ principals, role definitions, and role assignment**. Let's look at each of these\
    \ components in detail."
