    \ always create a new VM in the appropriate virtual network or attach a network\
    \ interface to an existing VM.\n\nWith access to an on-premises network, and some\
    \ domain credentials, we will want to find any available options for escalating\
    \ our privileges in the domain. We will cover some common options and tools in\
    \ the following sections.\n\n## Identifying domain escalation paths\n\nSince we\
    \ are assuming that we have escalated to an Owner role, or to an account with\
    \ access to multiple subscriptions, we will assume that some domain credentials\
    \ were gathered at some point along the way. If not, we would recommend revisiting\
    \ previous chapters to review ways that we can extract domain credentials from\
    \ virtual machines and PaaS services.\n\nUsing these acquired domain credentials,\
    \ we will want to use tools to identify resources in the Active Directory domain\
    \ that can be used to escalate our privileges. In many environments, multiple\
    \ hops between systems will be required to gain access to domain administrator\
    \ rights.\n\nAs an example, here is a common domain escalation path for an Active\
    \ Directory domain (`ACME.local`) that is integrated with Azure resources:\n\n\
    - An attacker gathers domain credentials (Password Guessing, Network Protocol\
    \ Attacks, and so on) from Active Directory or an Azure VM.\n- The attacker uses\
    \ the credentials to get a Kerberos ticket in a crackable format as part of a\
    \ Kerberoasting attack.\n- The ticket is cracked, revealing the cleartext credentials\
    \ for the associated service account (`ACME\\SQLUser1`).\n- The service account\
    \ has local administrator rights on the AD servers computer group.\n- A server\
    \ in the group (`FileServer01`) has an active logon session for the `ACME\\kfosaaen-DA`\
    \ account, a Domain Administrator.\n- The attacker uses the SQLUser1 service account\
    \ credentials to log in to the `FileServer01` server as a local administrator,\
    \ and dumps the Domain Administrator credentials from the LSASS process with Mimikatz.\n"
  mdcn: "\n\n7. 运行以下命令，利用全局管理员角色修改 Azure 资源的权限：\n\n   ```bash\n   az rest --method\
    \ post --url \"/providers/Microsoft.Authorization/elevateAccess?api-version=2016-07-01\"\
    \n   ```\n\n   如果没有收到任何输出，则表示命令已成功完成。\n\n8. 退出登录，然后使用全局管理员凭据重新登录，以确认你现在已拥有 Azure\
    \ 订阅资源的权限：\n\n   ```bash\n   az logout\n   ```\n\n   ```bash\n   az login\n  \
    \ ```\n\n   以下是相关截图：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_288_0.png)\n\
    \n   *图 7.16 – 具有订阅访问权限的 AZ CLI 登录*\n\n9. 使用以下命令，为全局管理员账户分配订阅所有者角色：\n\n   ```bash\n\
    \   userPrincipalName=$(az ad signed-in-user show --query userPrincipalName -o\
    \ tsv)\n   az role assignment create --role \"Owner\" --assignee $userPrincipalName\n\
    \   ```\n\n这些命令将成功执行，证明你已利用提升后的全局管理员角色修改 Azure 资源的权限！以下是命令的输出：\n\n```\nroot@PentestVM:~#\
    \ userPrincipalName=$(az ad signed-in-user show --query userPrincipalName -o tsv)\n\
    root@PentestVM:~# az role assignment create --role \"Owner\" --assignee $userPrincipalName\n\
    {\n  \"canDelegate\": null,\n  \"condition\": null,\n  \"conditionVersion\": null,\n\
    \  \"description\": null,\n  \"id\": \"/subscriptions/204cce89-.../providers/Microsoft.Authorization/roleAssignments/5ac7db39-887b-40c6-a743-e562f2120a6a\"\
    ,\n  \"name\": \"5ac7db39-887b-40c6-a743-e562f2120a6a\",\n}\n```\n\n图 7.17 – 所有者角色分配\n\
    \n现在，我们已经从 Azure AD 修改了对 Azure 订阅的权限。接下来，让我们研究相反的场景，以及可以用于实现这一目标的技术。\n\n## 从订阅所有者提升到\
    \ Azure AD 角色\n\n作为渗透测试的一部分，你可能还会关注如何从 Azure 订阅转向 Azure AD。此目标可能属于某个攻击链，其目的是在\
    \ Azure AD 中建立后门以实现持久化。我们将在*第 8 章，在 Azure 环境中实现持久化*中介绍持久化这一主题。以下是一些可以用于实现这一目标的技术。\n\
    \n### 路径 1 – 利用高权限服务主体\n\n与用户账户类似，服务主体和托管标识也可以被分配 Azure AD 角色。许多攻击者认为服务主体和托管标识更容易成为攻击目标，因为它们通常不受条件访问和\
    \ MFA 等安全策略的约束。\n\n攻击者可以利用具有服务主体或托管标识权限的 Azure AD 账户的特权，从而访问具有安全权限的主体。这是一条可行的路径，但你可能很少遇到这种情况，尤其是在组织严格遵循按范围分离角色分配原则的情况下。\n\
    \n### 路径 2 – 利用服务主体的 API 权限\n\nMicrosoft 标识平台支持服务主体的两种权限：委派权限和应用程序权限。委派权限用于交互式身份验证流程，此时会有已登录的用户。在这种场景下，用户需要在访问时同意该权限（或者管理员可以代表用户同意）。\n\
    \n应用程序权限由无需任何用户交互即可运行的应用使用，这意味着没有用户登录这些应用。管理员只需代表应用对授予的权限同意一次。服务主体被授予权限，以便在 Microsoft\
    \ Graph 等 API 上执行敏感操作，这种情况并不少见。攻击者可以利用这些权限访问已授予该应用访问权限的 API。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_290_0.png)\n\
    \n图 7.18 – 服务主体应用权限\n\n例如，某个应用可能没有在 Azure AD 中分配任何角色，但如果它在 Microsoft Graph 中拥有执行敏感操作的应用程序权限，则可以将其作为间接访问\
    \ Azure AD 的方式。这种攻击方式也正逐渐成为攻击者常用的网络钓鱼技术。攻击者可以使用 Azure AD 同意授权 URL（*图 7.19*），将合法的\
    \ Azure URL 发送给网络钓鱼受害者。此 URL 利用内置的 Azure AD 权限审批流程，允许用户批准外部应用程序。\n\n由于在内部环境中进行权限提升存在许多潜在方式，因此我们将重点介绍一些通用概念，并利用这些概念从\
    \ Azure 转向本地系统。\n\n## 识别与本地网络的连接\n\n首先，我们将了解如何识别连接云环境与本地网络的网络连接。这些连接可以让我们转向其他网络，而这些网络可能有助于我们在整个\
    \ Active Directory 环境中实现权限提升。\n\n> **重要说明**\n>\n> 由于此场景的实验环境需要你设置与另一个网络的连接，因此我们不会在动手实践中介绍这一内容。但我们将说明如何查找这些连接。\n\
    \n在 Azure 门户中，查找本地连接是一项简单的任务。只需导航到**连接**页面，即可看到可用连接列表。这些连接可能是**站点到站点 VPN**或**ExpressRoute**连接。\n\
    \n### 站点到站点（IPsec）连接\n\n站点到站点连接依赖传统网络硬件（VPN 集中器、路由器等），在 Azure 与另一个网络之间建立 VPN 隧道。许多组织会选择此选项，因为它允许组织与现有技术集成。站点到站点连接的主要区别之一在于，其流量会通过公共互联网传输，而不是通过私有骨干网络连接传输。\n\
    \n### ExpressRoute 连接\n\n对于希望从其网络到 Azure 建立更专用（且更私密）连接的组织而言，ExpressRoute 连接是首选方案。此类连接通常由与\
    \ Microsoft 建立合作关系的服务提供商为组织创建。\n\n了解这些连接的工作原理基础知识固然有益，但我们真正关注的是如何利用这些连接攻击其他网络。由于会使用虚拟网关来创建这些连接，因此我们需要检查网关的设置，以确定哪些网络可以访问远程连接。\n\
    \n通常情况下，如果我们拥有订阅上的参与者（或所有者）角色，就应该能够访问虚拟网络中可访问该连接的虚拟机资源。在最坏的情况下，我们始终可以在适当的虚拟网络中创建新的虚拟机，或者将网络接口附加到现有虚拟机。\n\
    \n获得本地网络的访问权限以及一些域凭据后，我们需要寻找在域中提升权限的可用选项。接下来的章节将介绍一些常见的选项和工具。\n\n## 识别域权限提升路径\n\
    \n由于我们假设已经提升到所有者角色，或者拥有可访问多个订阅的账户，因此我们将假设在此过程中某个阶段已经收集到了一些域凭据。如果没有，我们建议返回前面的章节，复习如何从虚拟机和\
    \ PaaS 服务中提取域凭据。\n\n利用这些已获取的域凭据，我们需要使用工具来识别 Active Directory 域中的资源，并利用这些资源提升权限。在许多环境中，需要在多个系统之间进行多次跳转，才能获得域管理员权限。\n\
    \n例如，下面是一个与 Azure 资源集成的 Active Directory 域（`ACME.local`）中常见的域权限提升路径：\n\n- 攻击者从\
    \ Active Directory 或 Azure 虚拟机中收集域凭据（密码猜测、网络协议攻击等）。\n- 攻击者利用这些凭据，在 Kerberoasting\
    \ 攻击过程中获取可破解格式的 Kerberos 票据。\n- 票据被破解，暴露出关联服务账户（`ACME\\SQLUser1`）的明文凭据。\n- 该服务账户在\
    \ AD 服务器计算机组上拥有本地管理员权限。\n- 该组中的一台服务器（`FileServer01`）上存在账户 `ACME\\kfosaaen-DA`\
    \ 的活动登录会话，该账户是域管理员。\n- 攻击者使用 SQLUser1 服务账户凭据，以本地管理员身份登录 `FileServer01` 服务器，并使用\
    \ Mimikatz 从 LSASS 进程中转储域管理员凭据。\n\n"
