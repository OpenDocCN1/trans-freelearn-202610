    Azure platform features that can be used to run operating system-level commands/scripts
    on IaaS workloads such as VMs and **virtual machine scale sets (VMSSes)**.


    **Important note**


    For those with more experience in on-premises Windows environments, Contributor
    access is similar to having a domain account with a local administrator on most
    of the systems. You have rights to manage infrastructure and make changes, but
    you don’t have rights to add new users to the domain or make global changes at
    the domain administrator level.


    Here are some IaaS platform features that the Contributor role has permissions
    to use that we can abuse for this purpose:


    - Resetting local user passwords on VMs

    - Running commands, as a privileged user, on VMs

    - Installing and executing VM extensions

    - Exporting unencrypted operating system disks for analysis


    Note that these are potentially obvious state changes in the environment that
    may cause issues with the IaaS resources if done improperly. Proceed with attacks
    using these features with caution. We will cover these features in later sections
    of this chapter, but first, let’s walk through the process of setting up our Azure
    subscription for the upcoming exercises in this chapter.


    ## Hands-on exercise – preparing for the Contributor (IaaS) exploit scenarios


    This hands-on exercise will prepare us for the rest of the exercises in this chapter.
    To follow along with the scenarios that we will cover in this chapter, you will
    need to set up a user with Contributor permissions and some vulnerable workload
    configurations in your own Azure subscription. We have automated this using a
    PowerShell script that you can run from Azure Cloud Shell.


    Here are the tasks that we will complete in this exercise:


    1. Open a web browser and browse to the Azure portal at https://portal.azure.com.
    Sign in with the azureadmin credentials.

    2. In the Azure portal, click on the Cloud Shell icon in the top-right corner
    of the Azure portal. Select PowerShell:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_189_0.png)


    Figure 5.1 – Clicking the icon to open Cloud Shell


    ### What does the script do?


    The script creates a user account with Contributor permissions in the Azure subscription.
    The script also sets up the resources and objects shown in Figure 5.4:


    - A powered-on Windows VM called `winvm01`

    - A powered-off Windows VM called `winvm02`

    - A powered-on Linux VM called `linuxvm01`


    The following is a diagram of the resources that will be added to your testing
    subscription:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_191_0.png)


    *Figure 5.4 – Contributor IaaS exploits scenario*


    5. After the script has completed, the key information that you will need for
    the rest of the exercises will be displayed in the output section. Copy the information
    into a Notepad document for later reference.


    There are two key values that you will need from the output section:


    **Azure Contributor User:** This is the Azure administrator username with Contributor
    permissions to the Azure subscription.


    **Azure Contributor User Password:** This is the password of the Azure Contributor
    administrator user:


    ```

    Transcript started, output file is contributor-iaas-scenario-output.txt

    ################

    # Script Output #

    ################

    Azure Contributor Admin User: contributoruser@azurepentesting.com

    Azure Contributor Admin User Password: myPassword123


    Transcript stopped, output file is /home/azureadmin/contributor-iaas-scenario-output.txt

    Deployment Ended 02/23/2021 18:44:44

    ```


    Figure 5.5 – Example of the script output


    You have now successfully created the resources that we will be working with in
    later exercises in this chapter. In the next section, we will cover the goals
    that we are trying to achieve by exploiting the platform features available to
    us at the IaaS Contributor level.


    ## Understanding Contributor IaaS escalation goals


    As a *Contributor*, we want to eventually escalate our privileges up to the Owner
    role on the subscription, and/or a privileged role in the Azure AD tenant. With
    this role, we now have significantly more options than a Reader for attempting
    to escalate our privileges in the environment. As part of this, we will want to
    use our permissions on IaaS resources to potentially gather higher-privileged
    credentials from those resources. Since we have control over almost every aspect
    of the IaaS resources, we can now start diving deeper into those resources.


    > **Important note**

    >

    > While the scenarios outlined in this chapter assume that you have Contributor
    access on an IaaS resource, that may not always be the case during an Azure pentest.
    You may be in a situation where you have local or domain credentials that allow
    you to execute commands on a VM, but no actual access to a subscription. The techniques
    that we will outline in this chapter can easily be adapted for pivoting into the
    Azure subscription from a VM that you have command execution on.


    Before we start randomly executing commands on Azure VMs, we will want to understand
    why we are running the commands. Assuming we have Contributor rights on all the
    VMs in the subscription, why would we care about running additional commands?


    The simple answer is "to find credentials that we can use to escalate permissions,"
    but there are multiple options for credentials that could lead to that escalation.
    We have tried to highlight the four primary goals that we would approach while
    attacking Azure VMs:


    - Local credential hunting

    - Domain credential hunting

    - Lateral network movement opportunities

    - Tenant credential hunting


    In the next few sections, we will cover these four goals in detail.


    ## Local credential hunting


    Being able to run commands on Azure VMs, as a privileged user, presents a great
    opportunity to gather local credentials (hashed or cleartext) that may be the
    key to *pivoting to other systems, accounts, and subscriptions* in the tenant
    or even to connected *on-premises systems*. It is very common for administrators
    to reuse the same local credentials on multiple systems across different environments,
    as well as using the same credentials for domain accounts. This attack can apply
    to both Windows and Linux systems, and they may even share credentials across
    the different operating systems.


    ## Domain credential hunting


    Azure VMs can be standalone systems, or they can be joined to a larger **Active
    Directory (AD)** domain. If the VM is domain-joined, there may be an even greater
    impact on collecting information from the VMs. Frequently, Azure AD users with
    privileged roles on the subscription will also be the same users that are logging
    in to the VMs.


    By gathering credentials from each VM, we may be able to gain access to cleartext
    credentials (or hashes) of more privileged users. It should be noted that domain
    credentials at this point can be cleartext, hashed, or cached credentials. Hashed
    or cached credentials can potentially be cracked to reveal the cleartext passwords.


    Gathering domain credentials could be a great step in working our way up to domain
    or enterprise administrator privileges. At that point, we would be able to dump
    all the password hashes for the domain or reset the passwords of privileged accounts
    that we would like to access.

