    \ | 虚拟机规模集计数 |  |  |  | 1 |\n|  | 虚拟网络计数 |  |  |  | 35 |\n|  | 总计 |  |  |  | 589\
    \ |\n\n图 4.11 – Azure 资源汇总列表\n\n虽然门户是一个很好的可视化工具，但它并不总是收集配置信息的最有效方法。为此，我们需要使用能够通过脚本和\
    \ PowerShell 模块自动收集配置的工具。\n\n## 介绍 PowerZure\n\nPowerZure 是一个基于 PowerShell 的工具，用于枚举\
    \ Azure 中的资源并利用服务中的不安全配置。它由多个内置函数组成，可用于收集有关 Azure 环境的信息并利用已发现的资源。我们将在本章及后续章节中使用其中的一些函数。\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_146_0.png)\n\n接下来，我们将使用 PowerZure 来收集示例订阅的信息。\n\
    \n## 动手练习 – 使用 PowerZure 收集订阅访问信息\n\n在本练习中，我们将在渗透测试虚拟机上下载 PowerZure，并将其导入到我们的\
    \ PowerShell 会话中。本练习将完成以下任务：\n\n- **任务 1：** 下载 PowerZure。\n- **任务 2：** 导入 `PowerZure.ps1`\
    \ 模块。\n- **任务 3：** 运行 `Get-AzureTargets` 函数查看用户权限。\n- **任务 4：** 查看收集到的信息。\n\n\
    让我们开始：\n\n1. 在渗透测试虚拟机上，在已通过 Az PowerShell 模块进行身份验证的 PowerShell 会话中，使用以下命令下载 PowerZure：\n\
    \n```\nPS C:\\> cd C:\\Users\\$env:USERNAME\nPS C:\\> git clone https://github.com/hausec/PowerZure.git\n\
    ```\n\n下面是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_146_1.png)\n\n\
    图 4.12 – 克隆 PowerZure GitHub 仓库\n\n2. 使用以下命令将 PowerZure 模块导入到你的 PowerShell 会话中。如果提示安装\
    \ Azure AD 模块，请键入 Y 并按 *Enter*。关闭并重新打开 PowerShell 控制台：\n\n```powershell\nPS C:\\\
    > cd .\\PowerZure\\\nPS C:\\> Import-Module .\\PowerZure.ps1\n```\n\n其效果如下：\n\n\
    ![](img/4fa338e84e0a590967a142dd798ba4e2_147_0.png)\n\n图 4.13 – PowerZure 模块的初始导入\n\
    \n3. 如果你安装了 Azure AD 模块，请打开一个新的 PowerShell 会话，并使用以下命令将 PowerZure 重新导入到 PowerShell\
    \ 控制台中：\n\n```powershell\nPS C:\\> cd C:\\Users\\$env:USERNAME\\PowerZure\nPS\
    \ C:\\> Import-Module .\\PowerZure.ps1\n```\n\n模块导入后，它将列出你当前的角色（Reader）和可用的订阅。这是有用的侦察信息：\n\
    \n- **AADRoles：** 显示当前用户在 Azure AD 中被分配的角色。\n- **AzureRoles：** 显示用户的 Azure RBAC\
    \ 角色分配和作用域。\n- **可用订阅：** 显示用户拥有一定权限级别的订阅。此信息有助于判断是否可以使用此用户账号横向移动到其他订阅：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_147_1.png)\n\
    \n图 4.14 – PowerZure 输出示例\n\n这是输出的样子：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_149_0.png)\n\
    \n图 4.16 – PowerZure 输出示例\n\n虽然 PowerZure 的 Get-AzTargets 函数是了解用户访问范围及其可访问资源的绝佳方式，但\
    \ MicroBurst 也会将此信息收集到平面文件中，以便审查整个订阅。每种工具都有各自的优点，不同情况需要不同的工具。\n\n> **重要说明**\n\
    > \n> 值得注意的是，在启用了 Azure Defender 的 Azure 安全中心版本中，对 PowerZure 和 MicroBurst 都有默认检测。如果你的目标是在环境中保持隐蔽，这些自动化工具可能会暴露你的活动。有关可用\
    \ Azure 安全警报的更多信息，请参阅 Microsoft 文档 – `https://docs.microsoft.com/en-us/azure/security-center/alerts-reference`。\n\
    \n"
