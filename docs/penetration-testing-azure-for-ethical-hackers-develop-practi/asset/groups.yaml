    \ 上查找 `test.txt` 文件，以证明命令已经执行。在典型的测试中，我们更有可能使用这种命令执行方式来启动来自 VM 的反向 shell 连接。\n\
    \n从实际渗透测试的角度来看，这种命令执行方式可能是最有用的方法之一。随着越来越多的组织将其传统应用程序迁移到云端，将会有更多机会利用应用程序服务器并从 VM\
    \ 和 App Service 主机收集访问令牌。\n\n## Lava 简介\n\nLava 是一个基于 Python 的 Microsoft Azure\
    \ 利用框架。它内置了多个可用于利用 Azure 中各种错误配置的模块。本书的作者之一定期为该项目做贡献。在下一个动手练习中，我们将使用它来利用具有特权的\
    \ VM 进行角色提升。\n\n**Lava 信息**\n\n- **作者**：Matt Rotlevi（Twitter：@mattrotlevi）\n-\
    \ **开源或商业**：开源项目\n- **GitHub 仓库**：https://github.com/mattrotlevi/lava\n- **语言**：Python\n\
    \n## 动手练习 – 使用 Lava 利用特权 VM 资源\n\n在本练习中，我们将在渗透测试 VM 的 WSL 中下载 Lava，使用它查找 Azure\
