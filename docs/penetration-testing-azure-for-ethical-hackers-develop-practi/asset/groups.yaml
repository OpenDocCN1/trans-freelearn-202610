    \ VM 变量的索引来实现。请记住，在 PowerShell 中索引从 0 开始，因此我们可以将 `$VMs[0]` 传递给同一个 `Invoke-AzRunCommand`\
    \ 函数，以对列表中的第一台 VM 运行命令。\n\n## 从 Azure REST API 运行命令\n\n这可能是在 VM 上运行命令最困难的方式，但幸运的是，有一些脚本可以帮助我们简化此过程。虽然这有点偏离我们标准的已认证\
    \ Contributor 用户流程，但我们可能会遇到这样的情况：我们拥有某个托管标识的令牌，并且该标识具有 Contributor 角色。\n\n如前一章所述，如果我们能访问具有托管标识的\
    \ VM，就可以为该标识生成一个访问令牌，该令牌可用于管理 API。然后，可以将此令牌与 MicroBurst 中的脚本结合使用，以在其他 VM 上运行命令。\n\
    \n下面是一个示例命令，用于获取可访问 Azure 管理 API 端点的访问令牌：\n\n```bash\nroot@LinuxVM:~# curl -H\
    \ Metadata:true -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
    \ | jq\n```\n\n以下是命令及其输出的截图：\n\n```text\nroot@LinuxVM:~#\nroot@LinuxVM:~# curl\
    \ -H Metadata:true -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
    \ | jq\n{\n  \"access_token\": \"eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsIn...\"\n\
    }\n```\n\n图 5.14 – 使用 curl 查询元数据服务\n\n获取令牌后，可以利用 MicroBurst 工具包中 REST 部分的 `Invoke-AzVMCommandREST`\
    \ 命令，使用所获取的令牌来运行命令。该函数会提示你选择订阅以及要在其上运行命令的 VM。由于该命令通过 REST API 运行，因此我们无法看到命令的结果。要查看命令的直接结果，我们需要强制\
    \ VM 回调我们，或者创建一些证据来证明我们在该机器上运行了命令（例如 `whoami > test.txt`）。下面是一个使用此方法的示例：\n\n```powershell\n\
    PS C:\\> $mgmtToken = \"TOKEN GOES HERE\"\nPS C:\\> Invoke-AzVMCommandREST -commandToExecute\
    \ \"whoami > test.txt\" -managementToken $mgmtToken\n204cce89-27de-4669-a48b-04c27255e05e\n\
