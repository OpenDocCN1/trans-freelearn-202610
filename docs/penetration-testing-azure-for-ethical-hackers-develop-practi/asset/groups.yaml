    \ az login\n```\n\n5. 在提示时，输入你在本章第一个练习的脚本输出中获得的 Contributor 凭据：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_205_0.png)\n\
    \n图 5.15 – az login 密码提示\n\n你现在已使用 Contributor 凭据完成身份验证。\n\n6. 使用以下命令下载 Lava：\n\
    \n```bash\nroot@PentestVM:~# git clone https://github.com/mattrotlevi/lava.git\n\
    ```\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_205_1.png)\n\n\
    图 5.16 – 克隆 Lava GitHub 仓库\n\n7. 使用以下命令切换到 Lava 目录并运行它：\n\n```bash\nroot@PentestVM:~#\
    \ cd lava/\nroot@PentestVM:~# python3 lava.py\n```\n\n看起来如下：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_206_0.png)\n\
    \n图 5.17 – Lava 初始化截图\n\n8. 在 Lava 控制台中，使用 `whoami` 命令确认已认证用户：\n\n```text\nLava\
    \ $> whoami\n```\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_206_1.png)\n\
    \n图 5.18 – Lava whoami 命令的结果\n\n9. 使用以下命令列出 Lava 中的所有模块：\n\n```text\nLava $> ls\n\
    ```\n\n看起来如下：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_207_0.png)\n\n图 5.19\
    \ – Lava ls 命令的结果\n\nLava 有许多模块，可以在不同场景下利用资源，但在本章中，我们将使用两个主要模块：`vm_list_privileged`\
    \ 和 `vm_rce`。\n\n10. 使用 `vm_list_privileged` 模块检查订阅中是否有任何 VM 与特权托管标识关联。要在 Lava\
    \ 中执行模块，命令前需要加上 `exec` 关键字：\n\n```text\nexec vm_list_privileged\n```\n\n以下是命令及其输出的截图。从截图中可以看到，该模块找到了一台\
    \ VM，但该 VM 没有关联的托管标识（1）。你还可以看到，该模块找到了另一台与特权托管标识关联的 VM（2）。该模块还显示了分配给 VM 的角色以及角色分配范围（3）：\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_208_0.png)\n\n图 5.20 – Lava vm_list_privileged\
    \ 模块输出\n\n总的来说，该模块应列出两台具有特权角色分配的 VM（假设你已删除了上一章的 VM）：一台在订阅范围内具有 Owner 角色分配的 Linux\
    \ VM，以及一台具有 Contributor 角色分配的 Windows VM。请注意被发现具有 Owner 权限的 Linux VM 的名称（linuxvm01）和资源组（pentest-rg）。由于我们已经拥有分配了\
