    \ into frequent scenarios where users are provisioned a privileged Azure AD role,\
    \ but they never configure MFA for the account. Your mileage may vary, but it\
    \ may be worth a try.\n\nAlternatively, we can use the gathered domain credentials\
    \ (cleartext or hashes) for privileged users to use for accessing systems used\
    \ by Azure administrators. As previously mentioned, Azure tokens can be stored\
    \ on user workstations in the `.Azure` profile folders. By accessing the workstations\
    \ with one of the compromised privileged accounts, we may be able to assume the\
    \ token of the Azure admin user. We will cover this process in depth in the following\
    \ chapter as a method for obtaining persistence in the environment.\n\nFinally,\
    \ with administrative rights, we may have control over the MFA systems that are\
    \ in use for the Azure environment. If third-party (Okta, Duo, and so on) MFA\
    \ systems are in use, a privileged domain user may have control over the tokens\
    \ for other users. By cracking a Global Administrator's password and granting\
    \ them a new MFA token (on your device), you may be able to take over their Azure\
    \ account.\n"
  mdcn: "\n\n撰写本文时，这是一种可在 Active Directory 域中使用的常见提权路径。这是一条可通过收集一些基本域信息（服务主体、域组等）手动识别的路径，但也有工具可帮助自动化识别这些路径。我们将在下一节中介绍其中一些工具，以及有助于在系统之间进行横向移动的额外工具。\n\
    \n## 自动化识别提权路径\n\nBloodHound 工具的创建是为了简化 Active Directory 提权路径的识别。该工具允许域用户收集有关域中活动主机和用户会话的关键信息，以帮助将权限串联成一个图。该图随后可以被解析以找到到达所需权限的最直接路径：\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_294_0.png)\n\n图 7.20 – BloodHound 图示例\n\
    \n使用我们之前的示例，攻击者可以收集域数据，并通过使用 BloodHound 轻松找到从 Kerberoasting 攻击到域管理员权限的路径。\n\n\
    > **BloodHound 信息**\n> \n> **创建者：** Andrew Robbins (Twitter: @wald0)、Rohan Vazarkar\
    \ (Twitter: @CptJesus) 和 Will Schroeder (Twitter: @harmj0y)\n> \n> **开源或商业：**\
    \ 开源项目；提供商业选项\n> \n> **GitHub 仓库：** `https://github.com/BloodHoundAD/BloodHound`\n\
    > \n> **语言：** PowerShell, JavaScript\n\n得益于工具的最新更新，BloodHound 还支持查找本章中提到的许多 Azure\
    \ 攻击路径。绘制 Azure 角色和资源关系图的能力对于识别在 Azure 中横向移动和提权的方式非常有帮助。虽然我们不会介绍该工具的完整使用方法，但它是在攻击\
    \ Active Directory 时最强大的工具之一，强烈推荐用于 Active Directory 测试。\n\n> **重要说明**\n> \n>\
    \ 由于为 BloodHound 收集 Azure 数据而搭建实验室需要订阅中进行一些专门的资源分配，我们选择不为此工具提供实验。如果你想查看它收集的一些数据，请随意运行之前章节中的任何构建脚本，运行\
    \ AzureHound 收集工具，然后将数据导入 BloodHound。\n\n虽然这超出了本书的范围，但有大量工具可用于单独收集与 BloodHound\
    \ 收集的类似信息。如果操作得当，这种分块收集域信息的方式在渗透测试期间可能比 BloodHound 收集方法更不明显，但它需要对数据进行更多手动解释（以及对攻击路径的具体了解）才能识别出\
    \ BloodHound 找到的相同路径。\n\n## 用于沿提权路径进行横向移动的工具\n\n有了在本地环境中进行横向移动的明确路径，我们需要一些工具来帮助我们自动化此过程，使工作更轻松。值得庆幸的是，许多常见的提权操作可以从非域加入的系统完成，无需自定义工具。然而，在评估期间保持低调的最佳方法之一是通过\
    \ *利用现有资源* 使用原生系统管理工具（RDP、PS Remoting 等）。\n\n由于原生 Windows 工具没有对诸如凭据收集和进程迁移等功能的固有支持，可能需要额外的工具来完成我们的目标。由于这些工具中的每一个都可能有自己的专著，我们只在此简要介绍其中一些，并留给读者自行学习这些工具：\n\
    \n- Metasploit\n- CrackMapExec\n- Cobalt Strike\n- Empire\n- Red Team Toolkit\n\
    - Covenant\n\n这些工具都可用于域中的横向移动和提权。虽然工具并不总是必需，但它们可以帮助简化一些工作。\n\n虽然这始终会受到环境中可用路径的影响，但在提权期间在域环境中在系统之间进行横向移动时，我们通常会使用以下方法：\n\
    \n- 获取域或本地凭据。\n- 使用凭据或漏洞利用获得对系统的本地管理员访问权限。\n- 攻破系统上可用的凭据。\n- 识别可用于横向移动的额外目标。\n\
    - 横向移动到额外目标，并重新开始循环。\n\n一旦在上述过程中收集到域管理员凭据，我们就进入新阶段，在该阶段收集特权 Azure 用户的凭据并使用它们进入\
    \ Azure 租户。\n\n接下来，我们将介绍在域内完成提权后该怎么做。\n\n## 域提权和横向移动后的通用提示\n\n域管理员权限不应成为内部网络渗透测试的终点。在域管理员处停止只表明你对域有完全控制权，但没有展示这些权限的潜在影响。在内部渗透测试中，攻击者可以利用这些特权访问敏感数据存储，并强调攻击者提权后可能造成的危险。\n\
    \nAzure 渗透测试同样适用。获得域管理员权限实际上应该只是我们作为特权用户重新进入 Azure AD 环境的立足点。由于 Azure AD 环境与主要\
    \ Active Directory 环境紧密相连，因此有许多选择可以控制 Active Directory 账户，从而使我们能够进入 Azure。\n\n\
    获得域管理员权限后的第一步应该是从域控制器收集域 NTLM 哈希。这将为我们带来以下机会：\n\n- 破解收集到的哈希以获得明文凭据\n- 使用密码哈希进行\
    \ **Pass-the-Hash (PtH)** 攻击\n- 使用域 `krbtgt` 账户哈希通过黄金票据攻击在域中保持持久性\n\n由于转储所有域哈希可能会产生一些噪音，你可能希望针对特定账户（krbtgt、域/全局管理员等）进行哈希转储。此外，负责你的域的人员可能不希望重置每个域密码，因此在转储域哈希时做出合理的选择。\n\
    \n为了演示的目的，假设我们已经收集了 Azure 租户中 Global Administrator 账户的所有域 NTLM 哈希。如果我们能够破解其中任何一个哈希，我们可能能够使用明文凭据以特权角色进入\
    \ Azure 租户。\n\n你可能会认为所有这些特权账户都会受到 MFA 和条件访问策略的保护。这并不总是如此。虽然强制所有账户使用 MFA 变得越来越普遍，但作者经常遇到用户被授予特权\
    \ Azure AD 角色，但从未为该账户配置 MFA 的情况。你的实际情况可能有所不同，但尝试一下可能值得。\n\n或者，我们可以使用收集到的域凭据（明文或哈希）用于特权用户，以访问\
    \ Azure 管理员使用的系统。如前所述，Azure 令牌可以存储在用户工作站的 `.Azure` 配置文件文件夹中。通过使用其中一个被攻破的特权账户访问工作站，我们可能能够冒充\
    \ Azure 管理员用户的令牌。我们将在下一章深入介绍此过程，作为在环境中获得持久性的方式。\n\n最后，有了管理员权限，我们可能可以控制用于 Azure\
    \ 环境的 MFA 系统。如果使用第三方（Okta、Duo 等）MFA 系统，特权域用户可能可以控制其他用户的令牌。通过破解 Global Administrator\
    \ 的密码并为其授予新的 MFA 令牌（在你的设备上），你可能能够接管其 Azure 账户。\n\n"
