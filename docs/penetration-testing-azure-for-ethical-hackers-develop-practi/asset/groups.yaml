    \ **Azure 资源管理器 (ARM)** 的单一中心端点进行的。你可以将其视为 Azure 中资源管理的集中层（参见 *图 1.19*）。这种方法的优势在于，无论我们使用哪种工具，体验都是一致的。身份验证和访问都以相同的方式处理。\n\
    \n当我们使用前面描述的任何工具请求执行某个操作时，资源管理器会与执行我们所请求操作的“资源提供程序”进行通信，如下图所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_52_0.png)\n\
    \n资源提供程序是提供不同类型资源的服务。例如，网络资源提供程序负责网络资源（虚拟网络、网络接口等），而计算资源提供程序负责计算资源（虚拟机）。\n\n###\
    \ 小结\n\n虽然这可能是本书中最不激动人心的章节，但 Azure 平台基础知识将为我们接下来要学习的各种攻击奠定基础。在进入后续章节时，请牢记 Azure\
    \ 在资源和 RBAC 两个层面上的底层结构。\n\n在下一章中，我们将引导你设置一个 Azure 环境和一台渗透测试虚拟机，你可以用它来模拟本书其余部分将要介绍的\
    \ attack scenarios。\n\n### 延伸阅读\n\n以下是一篇很好的文章，可帮助您了解如何为 Azure 环境和服务实施安全措施：\n\n\
    - *《Microsoft Azure 安全技术认证及进阶》* 作者：David Okeyode\n\n## 2 构建你自己的环境\n\n要完全遵循本书的内容，你需要访问一个\
    \ Azure 环境和一台渗透测试**虚拟机 (VM)**，以便模拟使用这些工具、技术和流程来利用 Azure 环境。通过跟随书中的动手示例，你将获得在实际环境中实际利用漏洞的宝贵见解。有利的一面是，微软非常希望人们尝试\
    \ Azure，因此很容易在 Azure 中设置免费试用版来帮助你降低成本。\n\n在本章中，我们将讨论以下主要内容：\n\n- 创建新的 Azure 租户\n\
    - 在 Azure 中部署渗透测试虚拟机\n- Azure 渗透测试工具\n\n让我们开始吧！\n\n### 技术要求\n\n虽然拥有 Azure 账户是免费的，但在账户中运行资源并非免费。请注意，在你的订阅中运行这些测试资源可能会产生任何潜在费用。目前，微软确实为新账户提供免费试用额度和非免费层级服务，但这可能无法覆盖运行示例所涉及的所有资源成本。有关\
    \ Azure 免费层级产品的更多信息，请访问微软网站：https://azure.microsoft.com/en-us/free/free-account-faq/。\n\
    \n> **重要说明**\n>\n> 作为设置后的额外预防措施，请确保为你的订阅设置警报，以避免在 Azure 中超额支出。这可以通过 **“订阅”** 边栏选项卡下的\
    \ **“成本警报”** 部分完成，或者通过搜索栏中的 **“成本管理 + 计费”** 边栏选项卡完成。当试用期结束而你可能仍有服务在运行时，这一点尤其有用。\n\
    \n在撰写本书时，本章提供的虚拟机模板每天运行大约需要花费 5 美元（美元/USD）。如果你想最大化试用额度或减少总支出，请确保在不使用时暂停或关闭任何正在运行的资源。但在我们开始担心虚拟机和订阅成本之前，我们需要先设置一个\
    \ Azure 租户来存储我们的订阅。\n\n让我们从创建 Azure 租户开始。为此，请按以下步骤操作：\n\n1. 导航到 `https://portal.azure.com/`\
    \ 并创建一个新账户，如下面的屏幕截图所示。如果你已有 Microsoft 账户，也可以使用该账户：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_58_0.png)\n\
    \n   *图 2.1 – 登录 Azure*\n\n2. 身份验证完成后，选择 **“开始”** 以开始 Azure 免费试用，如下面的屏幕截图所示：\n\
    \n   **欢迎使用 Azure！**\n\n   没有订阅？请查看以下选项。\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_59_0.png)\n\
    \n   **开始 Azure 免费试用**\n\n   获取 200 美元可用于 Azure 产品和服务的免费额度，外加 12 个月的常用免费服务。\n\n\
    \   开始 · 了解更多\n\n   *图 2.2 – 开始免费试用*\n\n3. 填写个人资料信息。请确保使用正确的信息，因为这将用于计费账户。你可以在下面的屏幕截图中看到一个示例：\n\
    \n   ![](img/4fa338e84e0a590967a142dd798ba4e2_59_1.png)\n\n   *图 2.3 – 输入计费信息*\n\
    \n4. 完成设置 Azure 计费信息的步骤后，你将进入快速入门中心，如下面的屏幕截图所示：\n\n   ![](img/4fa338e84e0a590967a142dd798ba4e2_60_0.png)\n\
    \n   *图 2.4 – 访问新的 Azure 租户*\n\n恭喜！你刚刚创建了你的 Azure 租户。这是跟随示例操作的第一步，现在你离配置租户以托管示例实验漏洞和测试虚拟机又近了一步。\n\
    \n### 动手练习：创建 Azure 管理员账户\n\n要完成本书中的许多动手练习，你需要在 Azure 租户和订阅中设置“刻意设计的易受攻击”用户和服务。为此，我们将提供你需要从\
    \ Azure Cloud Shell 运行的脚本和模板。\n\n虽然用于设置租户的用户已拥有租户的全局管理员权限，但我们还将创建一个单独的管理员用户（azureadmin），该用户可访问\
    \ Azure AD 和 Azure 租户。此用户将是一个全局管理员账户，因此请务必设置一个强密码！在本书后续示例中，此用户名也会保持一致，以便我们统一使用一个用户名。\n\
    \n作为一般规则，我们不建议在 Azure 中将特权角色分配给日常使用的账户，但出于我们练习的目的，这将帮助我们利用一些未来的攻击场景。\n\n以下是你在本练习中将完成的任务：\n\
