    现在我们已经了解了如何保持对存储账户的连接，让我们转换思路，在存储账户内部攻击 Cloud Shell 存储文件以实现权限提升。


    ## 攻击 Cloud Shell 存储文件


    如果你一直按照书中的示例操作，你应该对 Azure Cloud Shell（基于浏览器的命令行界面）非常熟悉。但如果我们告诉你，通过让你使用此 shell，我们让你陷入了失败，你会怎么想？我们知道你作为作者对我们寄予了很大信任，如果我们辜负了这份信任，我们深表歉意。所以，让我们花点时间从这种情况中吸取教训，展示如何利用你为自己创造的易受攻击环境。


    你第一次以 azureadmin 用户身份使用 Cloud Shell 时，会被提示在存储账户的文件服务中创建一个文件共享。如果你选择默认选项，平台会自动创建一个以
    cs 为前缀的专用存储账户来托管文件共享（图 6.20）。你也可以选择使用现有存储账户来托管此共享。


    ![](img/4fa338e84e0a590967a142dd798ba4e2_238_0.png)


    图 6.20 – 示例 Cloud Shell 存储账户


    存储账户中的此文件共享服务用于在会话之间持久化数据。创建后，它将在用户后续 Cloud Shell 会话的 $Home 目录中自动挂载为 clouddrive
    文件夹。你可以通过在 Cloud Shell 中运行 ls 命令（Bash 或 PowerShell）来验证，如图 6.21 所示：


    ![](img/4fa338e84e0a590967a142dd798ba4e2_238_1.png)


    图 6.21 – Cloud Shell 会话中挂载的文件共享


    但这个文件共享背后是什么？此共享以 .img 文件的形式存储 EXT2 文件系统。


    共享的名称和映像文件名通常表示 Cloud Shell 所连接的 Azure AD 用户。在图 6.22 中，我们可以看到 cs-azureadmin-azurepentesting-com-1003200107d764bc
    文件共享包含 acc_azureadmin.img 文件（在 .cloudconsole 文件夹下）。此信息可以与 Azure AD/RBAC 侦察结果相关联，以确定
    shell 用户是否被分配了特权权限。


    ![](img/4fa338e84e0a590967a142dd798ba4e2_239_0.png)


    图 6.22 – 示例 Cloud Shell 文件


    那么，这里攻击场景是什么？正如我们之前提到的，此 IMG 文件在每次启动时都会挂载到用户 Cloud Shell 会话的主目录。因为 Contributor
    角色拥有通过存储账户密钥下载此 IMG 文件的权限，我们可以利用该访问权限在 Linux 系统上下载并挂载 IMG 文件。


    此时，我们可以读取文件中的任何敏感信息，但也可以对其进行修改，以便下次由目标账户挂载时运行命令。如果我们针对正确的账户，这就提供了通过在更特权用户的 Cloud
    Shell 会话中运行命令来提升权限的机会，例如 Azure AD 全局管理员或订阅 Owner。


    **重要说明**


    有关此攻击原始研究的完整说明，请参阅以下 NetSPI 博客：https://www.netspi.com/blog/technical/cloud-penetration-testing/attacking-azure-cloud-shell/。


