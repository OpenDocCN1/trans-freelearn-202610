  mdcn: "\n对于更喜欢视觉化学习的人来说，其结构如下所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_110_0.png)\n\
    \n图 3.11 – Azure Blob 服务端点 URL\n\n存储帐户可以包含多个容器，每个容器可以配置不同的公共访问级别。公共访问配置选项如下：\n\
    \n- **私有（Private）：** 不允许匿名访问。访问需要进行身份验证。\n- **Blob：** 允许匿名访问已知对象 URL。\n- **容器（Container）：**\
    \ 允许匿名列出和访问容器中的文件。\n\n虽然 **Blob** 容器权限可能会暴露敏感数据，但攻击者需要知道受影响文件的完整文件名才能访问它们。在应用程序以可预测的命名格式（如\
    \ Report-123.pdf、Report-124.pdf 等）以编程方式创建文件的情况下，攻击者在初步识别目标用户文件后，可能能够推断出存储帐户中其他文件的名称。这种文件名枚举通常称为**不安全直接对象引用**，简称\
    \ **IDOR**。PortSwigger 在其网站上对此问题做了很好的概述：https://portswigger.net/web-security/access-control/idor。\n\
    \n攻击者还可以使用诸如 Gobuster 之类的工具进行容器和对象名称猜测攻击，以查看是否返回对象。成功的可能性很小，但仍然存在。\n\n最令人担忧的公共访问级别是**容器**，因为它允许任何人列出并访问所有可用文件。这意味着，知道存储帐户和容器的攻击者将能够枚举所有可用文件。\n\
    \n利用我们之前的示例存储帐户 URL，我们知道存储帐户名为 `azurepentesting`，并且该容器是公共的。通过将 `?restype=container&comp=list`\
    \ 参数附加到容器 URL（https://azurepentesting.blob.core.windows.net/public/?restype=container&comp=list），我们可以列出该容器中存储的所有对象。这将返回有关可用文件的\
    \ XML 数据，然后我们可以利用这些数据访问对象！\n\n```\n<EnumerationResults ContainerName=\"https://azurepentesting.blob.core.windows.net/public/\"\
    >\n  <Blobs>\n    <Blob>\n      <Name>README.txt</Name>\n      <Url>https://azurepentesting.blob.core.windows.net/public/README.txt</Url>\n\
    \      <Properties>\n        <Last-Modified>Mon, 21 Dec 2020 00:47:51 GMT</Last-Modified>\n\
    \        <Etag>0x8DBA54A0BCC7C5C</Etag>\n        <Content-Length>123</Content-Length>\n\
    \        <Content-Type>text/plain</Content-Type>\n        <Content-Encoding/>\n\
    \        <Content-Language/>\n        <Content-MD5>P4Xiwn/SRng174UNmV1J2A==</Content-MD5>\n\
    \        <Cache-Control/>\n        <BlobType>BlockBlob</BlobType>\n        <LeaseStatus>unlocked</LeaseStatus>\n\
    \      </Properties>\n    </Blob>\n  </Blobs>\n  <NextMarker/>\n</EnumerationResults>\n\
    ```\n\n图 3.12 – Azure Blob 容器枚举输出\n\n从未经身份验证的角度来看，如果我们无法立即知道存储帐户中的任何容器，我们该怎么办？我们可以使用自动化工具猜测容器名称，检查它们是否允许容器权限，然后从中列出可用文件。\n\
    \n## 动手实验 – 使用 MicroBurst 识别配置错误的 Blob 容器\n\n在本实验中，我们将使用 MicroBurst 中的 `Invoke-EnumerateAzureBlobs`\
    \ 脚本来访问配置错误的 Azure Blob 存储服务中的数据。以下是本实验需要完成的任务：\n\n- **任务 1：** 使用 `Invoke-EnumerateAzureBlobs`\
    \ MicroBurst 模块，以 `azurepentesting` 为基础名称和内置的排列列表，匿名枚举存储帐户容器。\n- **任务 2：** 定义自定义容器列表，并使用它进一步枚举容器。\n\
    \n让我们开始：\n\n1. 在你的渗透测试虚拟机中，以管理员身份打开 PowerShell 控制台。\n\n2. 使用以下命令将目录路径更改为 MicroBurst\
    \ 目录，并导入 PowerShell 函数：\n\n    ```\n    cd .\\MicroBurst\\\n    Import-Module\
    \ .\\MicroBurst.psm1\n    ```\n\n    输出如下所示：\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_112_0.png)\n\
    \n    图 3.13 – 导入 MicroBurst PowerShell 模块\n\n3. 使用 `Invoke-EnumerateAzureBlobs`\
    \ 函数，以 `azurepentesting` 作为基础词，识别配置了容器访问级别的公共存储帐户：\n\n    ```\n    Invoke-EnumerateAzureBlobs\
    \ -Base azurepentesting\n    ```\n\n6. 使用以下命令读取下载的文件之一的内容。这将在记事本中打开该文件：\n\n  \
    \  ```\n    notepad .\\credentials.txt\n    ```\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_114_0.png)\n\
    \n    图 3.16 – 访问下载的文件\n\n7. 在我们于步骤 3 中使用的命令里，MicroBurst 使用常见的容器名称（如 private 和\
    \ public）枚举了存储帐户。除非在命令中另有指定，否则用于猜测容器名称的名称来自 MicroBurst 存储库中的 permutations.txt\
    \ 文件。MicroBurst 用于猜测的完整名称列表可以通过以下命令查看：\n\n    ```\n    Get-Content .\\Misc\\permutations.txt\n\
