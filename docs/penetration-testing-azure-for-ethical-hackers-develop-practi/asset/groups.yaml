    permissions in Azure AD.


    **Azure Global Admin User Password:** This is the password of the Global Administrator
    user.


    **Azure Owner User:** This is the administrator username with Owner permissions
    to Azure resources.


    **Azure Owner User Password:** This is the password of the Azure resource Owner
