    图 6.61 – 确认服务主体身份验证\n\n现在，我们已经获得了 Automation 帐户的明文凭据，以及一个可用于以 Run as 帐户身份进行身份验证的私有证书。由于默认情况下会为\
    \ Run as 帐户配置 Contributor 角色，这意味着我们很可能已经在订阅中拥有一个持久的 Contributor 帐户。\n\n> **重要提示**\n\
    > \n> 由于我们并不总是能够获得 Azure 中 Contributor 帐户的凭据，因此还可以使用 REST API 令牌来提取 Automation\
    \ 帐户的 Run as 凭据。请查看 MicroBurst 中的 `Get-AzAutomationAccountCredsREST` 函数，以了解如何使用令牌提取\
    \ Automation 帐户凭据：\n> \n> `https://github.com/NetSPI/MicroBurst/blob/master/REST/Get-AzAutomationAccountCredsREST.ps1`。\n\
    \n此外，如果 Run as 帐户被授予了超出默认 Contributor 角色的其他角色，我们或许可以利用这些凭据提升权限，或横向移动到其他订阅。\n\n\
    虽然这种情况并不常见，但作者曾见过被授予根管理组 Owner 权限的 Run as 帐户。在大多数情况下，这样做是为了允许 Automation 帐户同时自动化管理所有订阅中的更改。这样一来，任何拥有该\
    \ Automation 帐户 Contributor 访问权限的人，都可以继承根管理组角色，并接管所有订阅。\n\n## 实践练习 – 清理 Contributor（PaaS）利用场景\n\
    \n在最后一项练习中，我们将使用清理脚本，自动删除为本章场景设置的资源。以下是本练习中要完成的任务：\n\n- 从 GitHub 下载清理脚本。\n- 运行脚本，删除为这些场景创建的对象和资源。\n\
    \n完成这些任务的步骤如下：\n\n1. 打开 Web 浏览器，访问 Azure 门户 `https://portal.azure.com`。使用 `azureadmin`\
    \ 凭据登录。\n2. 在 Azure 门户中，单击右上角的 **Cloud Shell** 图标。选择 **PowerShell**：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_269_0.png)\n\
    \n图 6.62 – 打开 Cloud Shell\n\n3. 在 Cloud Shell 窗格中的 PowerShell 会话内，运行以下命令，下载并验证用于删除本章场景所创建资源的脚本：\n\
    \n```powershell\nPS C:\\> Invoke-WebRequest https://bit.ly/contributor-paas-scenarios-cleanup\
    \ -O contributor-paas-scenarios-cleanup.ps1\nPS C:\\> Get-ChildItem\n```\n\n以下是其显示效果的屏幕截图：\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_270_0.png)\n\n图 6.63 – 下载脚本的结果\n\n\
    4. 使用以下命令运行下载的脚本，删除本章练习所创建的对象和资源：\n\n```powershell\nPS C:\\> ./contributor-paas-scenarios-cleanup.ps1\n\
    ```\n\n## 延伸阅读\n\n如需进一步了解相关主题，请参阅以下资源：\n\n- Azure 控制平面和数据平面：\n  `https://docs.microsoft.com/en-us/azure/azure-resource-manager/management/control-plane-and-data-plane`\n\
    - Azure RBAC 内置角色：\n  `https://docs.microsoft.com/en-us/azure/role-based-access-control/built-in-roles`\n\
    - Key Vault RBAC 指南：\n  `https://docs.microsoft.com/en-us/azure/key-vault/general/rbac-guide`\n\
    \n## 利用 Owner 和特权 Azure AD 角色权限\n\n在本书第一章中，我们区分了 Azure AD 角色和 Azure RBAC 角色。我们提到过，Azure\
    \ AD 角色用于管理对 Azure AD 资源和操作的访问权限，例如用户帐户或组的创建，以及密码重置；而 Azure RBAC 角色用于管理对 Azure\
    \ 资源的访问权限，例如订阅、存储帐户和 SQL 数据库。大多数情况下，这两项服务具有相互独立的作用域边界。通常，为 Azure AD 分配的角色不会授予管理\
    \ Azure 资源的访问权限，而为 Azure RBAC 分配的角色也不会授予管理 Azure AD 资源的访问权限。\n\n从订阅 Owner 权限向上提升到根管理组、Azure\
    \ AD 管理角色或本地部署目标，可能是一项困难的任务。同样地，从 Azure AD 横向移动到 Azure 订阅资源也可能比较棘手。在本章中，我们将重点介绍一些不同的技术，用于在环境中超出用户现有权限分配的范围进行横向移动。\n\
    \n为了防止横向移动，最佳实践是将两个平面（Azure AD 和 Azure 资源）分开。这意味着应使用不同的用户帐户分别对其进行管理。如果不遵循这一最佳实践，那么入侵一个能够访问\
    \ Azure AD 的身份，就可能被利用来横向移动到 Azure 资源，反之亦然。\n\n话虽如此，即使 Azure AD 和 Azure 资源使用相互独立的用户帐户，攻击者仍有其他可利用的途径。我们将在接下来的章节中介绍其中一些选项。\n\
    \n## 路径 1 – 利用组成员身份\n\nAzure AD 帐户可能默认无法访问 Azure 资源，但如果它拥有修改 Azure AD 中组成员身份的权限，我们就可以利用这一点，将自己的帐户添加到某个拥有\
    \ Azure 资源权限的组中。*图 7.2* 展示了这种攻击的工作方式：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_275_0.png)\n\
    \n*图 7.2 – Azure AD 与订阅之间的关系*\n\n下面简要讨论具体步骤：\n\n1. **User3** 起初无法访问 Azure 资源，但拥有修改\
    \ Azure AD 中组成员身份的权限。\n2. **cloud-architects** 组被分配了 Azure 资源的 Owner 角色。\n3. **User3**\
    \ 将自己添加到 Azure AD 中的 **cloud-architects** 组，而该组恰好拥有 Azure 资源的权限。\n4. 凭借新的组成员身份，**User3**\
    \ 现在拥有了 Azure 资源的权限。\n\n> **重要提示**\n> \n> 尽管本章讨论的重点是 Azure AD 中的 Global Administrator\
    \ 角色，但 Azure AD 中还有其他内置角色也可以用来执行此攻击，包括以下角色：**User Administrator、Groups Administrator\
    \ 和 Directory Writers。**此外，任何拥有以下权限的 Azure AD 自定义角色也可能被利用：\n> \n> `microsoft.directory/groups/members/update`。\n\
    \n这是一个非常简单的攻击，我们在*第 4 章“利用 Reader 权限”*的实践练习中也利用过类似的方法，只是略有不同。如果用户已经拥有订阅中的权限，那么识别订阅中的任何特权组会很容易；但如果我们的\
    \ Active Directory 用户没有任何订阅权限，该怎么办？一种方法是查看 Azure AD 登录日志。\n\nAzure AD 登录日志会自动记录交互式和非交互式登录活动。从攻击角度来看，该日志包含大量信息，攻击者可以据此了解哪些用户能够访问每个\
    \ Azure AD 应用程序、哪些用户帐户或应用程序容易成为攻击目标，以及如何规避防御性配置等信息！\n\n在本例中，我们可以通过门户登录，或使用 Azure\
    \ PowerShell 查看日志，以确定哪些用户能够访问 Azure 资源。随后，我们可以将这些信息与用户的组成员身份关联起来。\n\n要使用 Azure\
    \ PowerShell 查看登录日志，我们首先需要安装 AzureAD 预览版 PowerShell 模块。在撰写本文时，此功能仅在该模块的预览版本中提供。一些预览功能最终可能不会进入正式发布版本，因此该功能将来*可能*不会正式提供。\n\
    \n请注意，该模块无法与 AzureAD 模块的**正式发布（GA）**版本并行安装，因此如果已安装 GA 版本，我们可能需要先将其删除。假设你一直在按照示例操作，那么在设置\
    \ PowerZure 时应该已经安装了 AzureADPreview。\n\n如果尚未设置该模块，可以按照以下说明进行操作：\n\n```powershell\n\
    # 如果已安装 GA 版本，则将其删除\nUninstall-Module AzureAD\n\n# 安装 AzureAD 模块的预览版本。随后关闭并\n\
    # 重新打开 PowerShell 控制台\nInstall-Module AzureADPreview\n\n# 验证模块的 GA 版本是否已安装\n```\n\
    \n"
