    +   - Az -> **<Subscription Name>** -> **Resources**

    +   - Az -> **<Subscription Name>** -> **VirtualMachines**


    The information can be parsed to obtain external targets that are provisioned
    in the subscription (App Service applications; storage accounts; public IP addresses
    and domains). The information can then be used to target hosted services for vulnerability
    assessments or misconfigurations:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_152_0.png)


    6. Review the contents of the file specified as follows. The content contains
    the user list collected by the function:


    **Az -> <Subscription Name> -> Users.csv**


    Useful information such as usernames, email addresses, account type, and account
    status can be obtained from this list. The information can be used to target credential
    guessing or phishing attacks, as we previously demonstrated in *Chapter 3, Finding
    Azure Services and Vulnerabilities*:'
