    ## Escalating privileges using a misconfigured service principal


    When looking for opportunities to escalate privileges, it is important to not
    just examine the role assignments of the existing users, but also focus on other
    misconfigurations that can be leveraged. An example of that is to see whether
    a user with the Reader role has ownership of a service principal that has more
    permissions than the Reader user has.


    *Figure 4.35* shows how this attack would work:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_169_0.png)


    Figure 4.35 – Exploiting a misconfigured service principal


    The following are the details:


    1. `readeruser` starts out with read-only permission to Azure resources.


    2. The user registers a service principal for an application that they are building
    (by default, all member users of an Azure AD tenant can register an application).
    Also, because the user registered the application, *they are automatically made
    the owner* (ownership rights on a service principal account allow users to set
    credentials (certificates and secrets) that can be used to authenticate, as we
    just demonstrated).


    3. An administrator with a higher privilege assigns the Contributor role or a
    higher-privileged role to the application that `readeruser` registered.


    4. This gives a route for `readeruser`''s credentials to be used to escalate privileges
    by adding a new secret to the app since they are the owner of the app.


    5. The app ID and new secret can then be used to escalate privileges.


    In the next hands-on exercise, we will use one of the powerful functions within
    PowerZure to identify the owners of app registrations and to add credentials to
    the apps. The Get-AzureAppOwner command is one of the functions of PowerZure.
    It recursively looks through each registered application in Azure AD and lists
    the owners. The output shows that readeruser is assigned ownership of an application
    called customapp. Ownership allows different permissions on the app, including
    adding a new secret. While this is not an inherent permission for the Reader role,
    application ownership rights can be assigned to any account:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_171_0.png)


    Figure 4.37 – Example app owned by the reader account


