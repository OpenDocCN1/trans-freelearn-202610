    \n在下一个动手练习中，我们将使用 MicroBurst 利用 Contributor 角色大规模利用 Key Vault 资源。\n\n以下是泄露信息的截图：\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_256_0.png)\n\n图 6.46 – Get-AzPasswords\
    \ 输出显示在 GridView 中\n\n值得注意的是，一些机密的值中会有关于它们所属资源的信息。例如，数据库或存储账户连接字符串。而其他机密只会是机密信息本身，没有其所属资源或服务的上下文。\n\
    \n一种了解机密被使用位置的方法是审查访问策略。这将允许我们看到哪些应用程序/资源正在使用这些敏感信息。例如，如果一个名为 app1 的托管标识对保管库中的机密具有读取访问策略分配，你可能会推断出分配了\
    \ app1 托管标识的资源会使用这些机密。你也可以审查资源的诊断日志（如果已启用并且你的凭据有权读取）以查看 API 调用来自何处。\n\n使用 Azure\
    \ Key Vault 和 Contributor 角色的另一种攻击模式是添加一个访问策略，允许我们在供应链攻击中生成受信任的证书。密钥保管库允许客户与受支持的第三方证书颁发机构集成，例如\
    \ DigiCert 和 GlobalSign，以简化组织受信任 TLS 证书的签发和管理（图 6.47）：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_256_1.png)\n\
    \n图 6.47 – Key Vault 证书生成流程\n\n请将本章加入书签，因为密钥保管库通常包含在 Azure 环境中提升权限所需的机密。除密钥保管库外，还有\
    \ Azure Web 应用，它们经常包含可用于权限提升和横向移动的凭据（和托管标识）。\n\n## 利用 Web 应用进行横向移动和提升权限\n\nAzure\
    \ Web 应用通常在订阅中用于托管 Web 应用程序和 API。虽然我们之前提到过滥用托管标识的利用，但我们尚未介绍应用程序通常如何被管理。\n\n应用程序代码可以通过多种不同的方式应用到\
    \ App Service 主机。部署中心可以与多种不同的代码存储库解决方案集成以与 CI/CD 管道同步，或代码可以通过手动部署推送。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_257_0.png)\n\
    \n图 6.48 – App Service 部署中心\n\n以下是完成此任务的步骤：\n\n- 1. 使用我们之前配置的 PowerShell 会话，使用\
    \ Get-AzPasswords 函数执行 App Service 的凭据转储：\n\n    ```\n    Get-AzPasswords -AutomationAccounts\
    \ N -StorageAccounts N -Keys N -ACR N -CosmosDB N -Verbose | Out-GridView\n  \
    \  ```\n\n- 2. 在提示选择 Azure 订阅时，选择你的测试 Azure 订阅并点击确定：\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_259_0.png)\n\
    \n    图 6.50 – 选择适当的订阅\n\n- 3. 在 resulting 输出中，你应该会看到从 App Service 配置中转储的凭据。\n\
    \n    ![](img/4fa338e84e0a590967a142dd798ba4e2_259_1.png)\n\n    图 6.51 – MicroBurst\
    \ App Service 输出\n\n"
