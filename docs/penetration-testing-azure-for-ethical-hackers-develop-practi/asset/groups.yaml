  - '[PAGE 24]


    The organization structure in Azure consists of the following levels: **Azure
    AD Tenant, Root Management Group, Child Management Group, Subscription, Resource
    Group, and individual Resources.** These different levels are shown in the following
    diagram:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_24_0.png)


    Figure 1.1 – Azure resource hierarchy


    Here are the descriptions of each level from the top down:


    +   - **Azure AD Tenant:** In order to manage Azure subscriptions and resources,
    administrators need an identity directory to manage users that will have access
    to the resources. Azure AD is the identity store that facilitates the authentication
    and authorization for all users in an Azure tenant''s subscriptions.'
  - "[PAGE 25]\n\nEvery Azure subscription has a trust relationship with one Azure\
    \ AD tenant to manage access to the subscription. It is common for organizations\
    \ to connect their on-premises AD to Azure AD using a tool called **Azure AD Connect**,\
    \ as shown in the following diagram:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_25_0.png)\n\
    \n*Figure 1.2 – Using Azure AD Connect to synchronize objects to Azure AD*\n\n\
    As the core of authentication and authorization, Azure AD is a prime target for\
    \ information gathering, as well as different identity-based attacks. We will\
    \ be covering more of the authorization model for Azure subscriptions in the *Understanding\
    \ the Azure RBAC structure* section in this chapter.\n\n+   - **Root Management\
    \ Group**: This is the top of the Azure resource organization hierarchy, *if it’s\
    \ enabled*. By default, the root management group is not enabled for an organization\
    \ that is new to Azure, which means each subscription is managed as an individual\
    \ entity. However, managing subscriptions individually creates a governance model\
    \ that does not scale well. This is especially difficult for medium-to large-sized\
    \ organizations with multiple subscriptions to manage.\n+   \n+     Many production\
    \ Azure environments will have the root management group enabled. This is partly\
    \ because Microsoft recommends enabling it as part of their *Cloud Adoption Framework*\
    \ document (`https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/decision-guides/subscriptions/`).\
    \ This document describes some of the best practices for adopting the Azure cloud\
    \ and is a great source of information for those looking at building out an environment\
    \ in Azure.\n+   \n+   - **Child Management Group**: If an organization has enabled\
    \ the root management group, they could create child management groups under the\
    \ root to simplify the management of their subscriptions. Child management groups\
    \ allow organizations to group subscriptions together in a flexible structure,\
    \ mainly to centrally manage access and governance. Child management groups can\
    \ be nested and can support up to six levels of depth."
