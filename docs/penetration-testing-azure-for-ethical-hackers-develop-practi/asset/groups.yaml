  mdcn: "\n\n- **订阅：** 要在 Azure 中配置资源，我们需要一个 Azure 订阅。Azure 订阅是资源被配置的逻辑容器。当我们创建资源（例如\
    \ **结构化查询语言 (SQL)** 数据库）时，我们通常做的第一件事是指定资源将被配置的订阅。所选订阅也将承担该资源的使用费用。\n\n如 **子管理组**\
    \ 描述中所述，组织通常会有多个 Azure 订阅。组织为不同的环境设置多个订阅是很常见的，例如开发和生产环境，或用于分离应用程序环境。\n\n- **资源组：**\
    \ 在订阅内部，有资源组。资源组是可用于对 Azure 资源（如 **虚拟机 (VM)**、存储账户和数据库）进行分组和管理的逻辑容器。\n\n资源组最适合用于收集和分组需要一起管理或共享相同生命周期的资源。根据订阅架构，这可能导致单个订阅中存在大量资源组。\n\
    \n从访问角度来看，资源组还允许我们在同一订阅中对不同组进行访问隔离，但我们将在 *了解 Azure RBAC 结构* 部分更详细地介绍这一点。\n\n-\
    \ **资源：** 资源是在 Azure 订阅中部署的 Azure 服务的单个实例。资源级别是组织层级的底部。除了具有特定访问策略的服务（请参阅有关 *密钥保管库*\
    \ 的信息）之外，我们无法再进一步细分资源层级。\n\n我们将在本章后面深入介绍如何使用 RBAC 管理访问的细节，但总的来说，Azure AD 账户可以对前面概述的任何资源组织级别拥有指定的访问权限。从渗透测试的角度来看，在更高级别授予的访问权限会为攻击者提供更广的范围来发现云服务配置中的漏洞，并在环境中横向移动。当我们讨论权限提升时，这一概念会变得更加重要。\n\
    \n在下一节中，我们将介绍一些常用 Azure 服务的概述。这些服务的单个实例属于前面列出的 **资源** 类别。\n\n## Azure 服务概述\n\n\
    正如我们在本章前面提到的，Azure 中有超过 200 项服务。尽管听起来服务很多，但它们通常可以分为以下五类：\n\n- **用于托管应用程序的服务：**\
    \ 这些服务提供可用于执行应用程序代码或运行容器镜像的运行时环境。**Azure 应用服务、Azure 虚拟机 (Azure VM)** 和 **Azure\
    \ Kubernetes 服务 (AKS)** 等服务属于此类。组织使用它们来托管外部和内部应用程序。\n- **用于存储应用程序数据的服务：** 这些服务用于存储不同类型的应用程序数据。存储账户、Azure\
    \ SQL 和 Cosmos DB 等服务属于此类。\n- **用于创建应用程序的服务：** 这些服务用于创建在云中运行的工作流。Logic Apps 和\
    \ Functions 应用等服务属于此类。\n- **用于增强应用程序的服务：** 这些通常是 Azure 中的 **软件即服务 (SaaS)** 类型服务，用于为其他应用程序提供额外功能。Azure\
    \ Cognitive Services 等服务就属于此类。开发人员使用它通过预构建和预训练的机器学习算法为其自定义应用程序添加智能。\n- **用于监控或管理应用程序的服务：**\
    \ 这些是用于管理或监控其他服务或应用程序的服务。Azure Automation、API 管理、Application Insights 和 Azure\
    \ Monitor 等服务属于此类。额外的安全重点服务，如 Azure Sentinel 和 Azure Security Center，也会归入此类。这些服务也可以从渗透测试角度提供有用的见解。\n\
    \n随着我们阅读本书的进展，我们将涉及许多服务，但这里概述的核心资源是需要理解的重要内容。\n\n下表列出了本书中将被攻击的最常见的一些 Azure 服务：\n\
    \n| 服务 | 描述 |\n|---|---|\n| 应用服务 | 该服务包括 Azure 中的 App Service 和 Function 应用。这些服务可用于“无服务器”Web\
    \ 应用程序和 API 托管。 |\n| 存储账户 | 存储账户用于 Azure 中大多数数据存储操作。文件可以公开或私有托管，并且文件可以通过多种协议访问（**超文本传输协议\
    \ (HTTP)**、**服务器消息块 (SMB)**、**网络文件系统 (NFS)**）。该服务还可用于静态 Web 内容托管。 |\n| 自动化账户 |\
    \ 另一种“无服务器”代码服务，自动化账户允许您从“运行手册”运行脚本代码（PowerShell 和 Python）以自动化订阅中的流程。该服务有很多攻击面，因此我们将在整本书中经常回到它。\
    \ |\n| 虚拟机 | 云服务的初始支柱之一，这些是在云中托管的 VM。在云中部署 VM 有多个方面，因此该服务也将成为主要关注点。 |\n| 密钥保管库\
    \ | Azure 密钥保管库是 Azure 内的主要凭据存储。这包括密钥、机密和证书的存储。除了利用标准的 **身份和访问管理 (IAM)** 权限分配外，还可以应用访问策略来提供对\
    \ Key Vault 数据的额外限制。 |\n| Azure SQL | 该服务用于在云中托管 SQL 数据库。SQL 数据库的全部内容都由 Microsoft\
    \ 管理，这有助于简化 Azure 项目中使用数据库的工作。 |\n| Azure 容器注册表/Azure 容器实例 | 随着许多环境开始迁移到容器化，云容器注册表和云容器实例的使用变得越来越流行。Azure\
    \ 容器注册表保存用作容器化基础镜像的容器镜像。\n\n虽然它在容器化环境中只占相对较小的一部分，但该服务是一个常见的攻击目标，因为镜像经常包含敏感信息。\
    \ |\n\n从上述信息可以看出，微软在命名 Azure 服务时非常务实。大多数情况下，服务名称基于服务的功能。例如，用于托管 VM 的 Azure 服务称为\
    \ **虚拟机**。相比之下，AWS 中的等效服务称为 **弹性计算云 (EC2)**。\n\n> **重要说明**\n> \n> 对于任何从 AWS 过渡到\
    \ Azure 的术语转换者，以下 Microsoft 文档可能有助于匹配任何令人困惑的服务名称：`https://docs.microsoft.com/en-us/azure/architecture/aws-professional/services`。\n\
    > \n> 对于更熟悉 GCP 的用户，Microsoft 还在 `https://docs.microsoft.com/en-us/azure/architecture/gcp-professional/services`\
    \ 提供了一些有用的文档。\n\n在 *第 3 章、查找 Azure 服务和漏洞* 中，我们将讨论如何使用 Azure **域名系统 (DNS)** 命名结构匿名发现其中一些服务。在下一节中，我们将回顾如何使用\
    \ RBAC 结构化和管理对 Azure 服务的访问。\n\n## 了解 Azure RBAC 结构\n\n**RBAC** 是一种授权系统，用于控制谁有权访问\
    \ Azure 资源，以及用户可以对这些资源执行的操作。从高层次来看，你可以将其视为 *通过向安全主体（用户、组和应用程序）分配角色来授予其对 Azure\
    \ 资源的访问权限*。\n\n例如，RBAC 可用于授予用户管理订阅中所有 VM 的权限，而另一用户则被授予管理同一订阅中所有存储账户的权限。这对于订阅中的职责分离来说是一个奇怪的选择，但云环境往往会催生出\
    \ *创造性解决方案* 来使事情正常运行。\n\n当我们开始引入角色分配的不同作用域（管理组、订阅等）时，RBAC 概念会变得更加复杂，但在我们继续进行时请记住上述描述。\n\
    \nAzure RBAC 由以下组件组成——**安全主体、角色定义和角色分配**。让我们详细了解这些组件。\n\n"
