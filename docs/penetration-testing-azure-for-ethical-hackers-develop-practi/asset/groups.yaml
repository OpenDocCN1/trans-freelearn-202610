  mdcn: "\n需要注意的一点是，遵循良好安全实践的组织可能会对所有来宾身份应用一个整体条件访问策略（*图8.30*），以阻止他们访问敏感应用程序。如果是这种情况，如果我们有足够的权限修改条件访问策略，我们可以考虑绕过此策略的选项。我们将在本章后面介绍这一点：\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_331_0.png)\n\n图8.30 – 外部用户的条件访问策略\n\
    \n由于许多组织可能会对租户中的外部身份保持更密切的关注，此选项很容易引起怀疑。要识别此事件，安全运营团队可以在Azure AD审核日志（**Azure门户\
    \ → Azure AD → 审核日志**）中查找`Invite external user`活动类型或操作。\n\n## 修改现有身份\n\n作为获取后门身份的替代选项，我们将研究修改现有的Azure\
    \ AD身份，这些身份将在账户中持久存在。由于更改现有活动账户的密码是一个非常明显的更改，我们将从更改禁用用户账户的凭据开始。\n\n## 启用禁用的用户身份并重置其密码\n\
    \n为Azure AD租户建立后门身份的一个不太可疑的方法是查找已禁用的现有身份，启用它们并重置其密码。要启用禁用的用户账户，需要下表中突出显示的权限。**Azure\
    \ AD角色**列中列出的内置角色具有此权限。从渗透测试的角度来看，我们需要谨慎，因为一个身份可能因先前已被入侵而被禁用：\n\n| 方法 | 所需权限 |\
    \ Azure AD角色 |\n|---|---|---|\n| 启用禁用的用户身份 | `microsoft.directory/users/enable`\
    \ | • 用户管理员<br>• 全局管理员<br>• 自定义角色目前无法使用 |\n\n表8.3 – 启用禁用用户身份的角色\n\n启用用户身份后，Azure\
    \ AD中的密码重置权限取决于被重置用户的角色。这些权限在管理员角色（全局管理员、身份验证管理员等）和非管理员用户类型之间进行了区分。\n\n以下是Azure\
    \ AD中可以重置用户密码的内置角色，按权限升序排列：\n\n- **密码管理员：** 可以为非管理员和其他密码管理员重置密码\n- **服务台管理员：**\
    \ 可以为非管理员、密码管理员和其他服务台管理员重置密码\n- **身份验证管理员：** 可以为非管理员、密码管理员和其他身份验证管理员重置密码\n- **用户管理员：**\
    \ 可以为非管理员、组管理员、服务台管理员、密码管理员和其他用户管理员重置密码\n- **特权身份验证管理员：** 可以为所有非管理员和管理员重置密码\n\
    - **全局管理员：** 可以为所有非管理员和管理员重置密码\n\n如果你需要临时访问特权账户以实现持久化目标，请记住，你需要一个特权角色来重置目标账户的凭据。例如，你可能希望使用长期持久化账户来重置特权用户的密码，以在租户中进行短期持久化活动。此路径可能允许临时访问其他账户的资源，但防御者应该很容易追踪发起密码重置的账户。\n\
    \n> **重要说明**\n> \n> 此处列出的角色描述来自以下Microsoft文档页面：`https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference#password-reset-permissions`。此页面有一个非常方便的表格，概述了哪些角色有权重置Azure\
    \ AD租户中其他角色的密码。\n\n## 向现有服务主体添加机密\n\n为Azure AD租户建立后门身份的另一种不太可疑的方法是向现有服务主体添加密码。这是你在*第4章，利用读取者权限*中使用PowerZure练习过的方法之一。要执行此操作，需要拥有该服务主体的账户，或具有下表中突出显示权限的账户。Azure\
    \ AD角色列中列出的内置角色具有此权限：\n\n| 方法 | 所需权限 | Azure AD角色 |\n|---|---|---|\n| 向现有服务主体添加机密\
    \ | `microsoft.directory/servicePrincipals/credentials/update` | • 应用程序管理员<br>•\
    \ 混合身份管理员<br>• 全局管理员<br>• 自定义角色目前无法使用 |\n\n表8.4 – 向服务主体添加机密的角色\n\n现在我们已经确定了如何访问身份以实现持久化，让我们看看如何为这些身份分配特权角色。\n\
    \n| 方法 | 所需权限 | Azure AD角色 |\n|---|---|---|\n| 更新可分配给Azure AD角色的组的成员身份和所有权。 |\
    \ `microsoft.directory/groupsAssign ableToRoles/allProperties/update` | • 特权角色管理员<br>•\
    \ 全局管理员<br>• 自定义角色目前无法使用 |\n| 更新安全组和Microsoft 365组的所有权。这不包括可分配给Azure AD角色的组。 |\
    \ `microsoft.directory/groups/owners/update` | • 目录写入者<br>• 组管理员<br>• 用户管理员<br>•\
    \ 全局管理员<br>• 自定义角色目前无法使用 |\n| 更新Azure AD中安全组的所有权。这不包括可分配给Azure AD角色的组。 | `microsoft.directory/groups.security/owners/update`\
    \ | • Intune管理员<br>• 知识管理者<br>• 知识管理员<br>• 自定义角色也可以分配此权限 |\n| 更新Azure AD中Microsoft\
    \ 365组的所有权。这不包括可分配给Azure AD角色的组。 | `microsoft.directory/groups.unified/owners/update`\
    \ | • Exchange管理员<br>• SharePoint管理员<br>• Teams管理员<br>• 自定义角色也可以分配此权限 |\n\n表8.5\
    \ – 修改组成员身份或所有权的角色\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_341_0.png)\n\n\
    ## Microsoft Azure安全技术认证与进阶\n\nDavid Okeyode\n\nISBN: 978-1-80056-265-3\n\n- 在Azure\
