  - "[PAGE 30]\n\n# Security principals\n\nA **security principal** is a fancy term\
    \ to describe *an Azure AD object that we want to assign privileges to*. This\
    \ could be a user account, a group, a service principal, or a managed identity.\
    \ These are all different types of identities that exist in Azure AD, as shown\
    \ in the following screenshot:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_30_0.png)\n\
    \nFigure 1.3 – Azure RBAC security principals\n\n> **Important note**\n> \n> Do\
    \ not confuse \"security principal\" with \"service principal.\" *Security principal*\
    \ is an overall term used to describe objects in Azure AD (including users, groups,\
    \ and service principals). *Service principal* is a specific type of security\
    \ principal.\n\nWhile there are many facets to a security principal, keep in mind\
    \ that every security principal has an **object ID** that uniquely identifies\
    \ it in Azure AD. This object ID is typically used as a reference when assigning\
    \ a role to the security principal. Next, we will cover the different types of\
    \ security principals.\n\n# User accounts\n\n*A user account is a standard user\
    \ identity in Azure AD.* These accounts can be internal to the Azure AD tenant,\
    \ or an external \"guest\" account. In either case, the general administration\
    \ of the users will occur at the Azure AD tenant level.\n\nInternal user accounts\
    \ are user identities created in the Azure AD tenant by an administrator. Additionally,\
    \ these may be user identities that are synchronized from an on-premises AD environment\
    \ to Azure AD (see *Figure 1.2*)."
  - '[PAGE 31]


    The accounts are commonly addressed by their **User Principal Name (UPN)**, which
    is typically an email address. For example, a user named `karl` in the Azure AD
    tenant, with a domain name of `azurepentesting.com`, will have a UPN of `karl@azurepentesting.com`.


    The following screenshot shows an internal user account in the Azure portal. Most
    Azure AD accounts that you interact with will fall under this category:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_31_0.png)


    *Figure 1.4 – Screenshot of an internal user account*


    External user accounts are user identities from other Azure AD tenants, or Microsoft
    accounts (`outlook.com`, `hotmail.com`, and so on) that are invited as guest users
    to an Azure AD tenant. The UPN format for external user accounts is shown here:


    ```

    `<alias>_<HomeTenant>#EXT#@domain.suffix`

    ```


    For example, if a user named `david`, from the `cloudsecnews.com` AD tenant, is
    invited as a guest user of the `globaladministratorazurepen.onmicrosoft.com` Azure
    AD tenant, the UPN will be `david_cloudsecnews.com#EXT#@globaladministratorazurepen.onmicrosoft.com`
    (see *Figure 1.5*).


    External accounts are typically used to grant access to vendors or third-party
    users that may be working on a subscription. The user accounts are not directly
    managed by the Azure AD tenant, so account policies (password length, **multi-factor
    authentication (MFA)**, and so on) would be out of the control of the Azure AD
    tenant.'
  - '[PAGE 32]


    ![](img/4fa338e84e0a590967a142dd798ba4e2_32_0.png)


    > Figure 1.5 – Screenshot of an external user account


    For both internal and external accounts, we will be targeting credentials for
    the accounts during an Azure penetration test to get access to resources in the
    Azure AD tenant. As we will see in later chapters, these accounts are a great
    place to get an initial foothold in an environment.


    # Service principal


    A **service principal** is an application identity in Azure AD. You can think
    of it as an Azure AD object representing an application that needs access to Azure
    resources. This is the preferred way to grant access to an application instead
    of creating a *dummy user account*.


    Service principals will be very important when we get to automation account attacks,
    but for now, just know that *applications* can be registered in Azure AD and they
    can also be granted permissions in the tenant. For example, you may have an automation
    account that runs maintenance scripts in a subscription, so you will want to have
    specific rights granted to the account that runs the scripts. These rights would
    be applied to the service principal that is created in the Azure AD tenant when
    the automation account is created.'
  - '[PAGE 33]


    Service principals can also be assigned certificates and secrets that can be used
    for authentication. These credentials will be important to note when we want to
    use the app registrations for privilege escalation, and/or persistence in the
    Azure AD tenant. The process of creating a service principal is called an **app
    registration**.


    In the following screenshot, we can see some basic information about an app registration
    in our sample tenant. As an attacker, we may have situations where it makes sense
    to create a new service principal that would allow us to persist in an environment.
    If we choose a generic display name (Backup Service) for creating a backdoor service
    principal, we may have a better chance of going undetected for longer in the tenant:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_33_0.png)


    Figure 1.6 – Screenshot of a service principal in Azure AD


    Finally, service principals can have owners set within Azure AD. The owners of
    the service principals can control the credentials associated with the accounts,
    so the owners are useful targets for escalation in an environment where service
    principals have elevated privileges.


    # Managed identity


    There are times that Azure services (VMs, AKS, applications, and so on) may need
    access to other Azure resources. The easiest way to grant this access is to enable
    a managed identity for the Azure service. A **managed identity** is an automatically
    created and managed service principal that is assigned to a supported Azure service.
    At the time of writing, there are 27 services that support managed identities
    in Azure.'
  - "[PAGE 34]\n\n> **Important note**\n> \n> If you're interested in learning more\
    \ about all of the services that support managed identities in Azure, Microsoft\
    \ has them documented here:\n> \n> `https://docs.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/services-support-managed-identities`\n\
    \nA managed identity can either be **system-assigned** or **user-assigned**. A\
    \ system-assigned identity is tied directly to the resource that the identity\
    \ is created for. A user-assigned identity is first created in a subscription,\
    \ and then applied to resources. A user-managed identity can be shared by many\
    \ services, while a system-assigned identity cannot.\n\nIn later chapters, we\
    \ will see that these identities can be used to escalate privileges in a tenant.\
    \ The important thing to note for now is that anyone who has modification rights\
    \ on a resource with an assigned managed identity can potentially assume the rights\
    \ of that managed identity. This is service-dependent, but there are several services\
    \ (that we will review later) that can readily be used to generate tokens for\
    \ managed identities.\n\n# Groups\n\n**Groups** are used in Azure AD to organize\
    \ users and to make it easier to manage access to Azure resources. For example,\
    \ it is more effective to assign permissions to 200 users in a group than to 200\
    \ individual users. Once Azure resource access is granted to a group, future access\
    \ can then be granted—or revoked—through group memberships.\n\nSimilar to user\
    \ accounts, groups can either be created by administrators in Azure AD or synchronized\
    \ from an on-premises AD environment. There is also a third scenario, whereby\
    \ users can be allowed to create their own groups, or join existing public groups,\
    \ but those groups are typically associated with Microsoft 365 services.\n\nMuch\
    \ as with app registrations, groups can have owners (either user accounts or service\
    \ principals), and the owners do not have to be a member of the group. Group owners\
    \ can manage the group and its membership.\n\nAzure AD supports two main types\
    \ of groups: security groups that are primarily used to manage access to shared\
    \ resources, and Microsoft 365 groups that serve a similar function to email distribution\
    \ groups that you may be familiar with in AD. These can also be used to assign\
    \ access to Azure resources."
