    \ the IP addresses that you are targeting to the ranges in this list to identify\
    \ any Azure-hosted resources. We will show you how to do this with the Cloud IP\
    \ Checker tool later in this chapter.\n\n## Azure platform DNS suffixes\n\nAs\
    \ noted in *Chapter 1, Azure Platform and Architecture Overview*, many Azure platform\
    \ services use public DNS suffixes that are owned and managed by Microsoft. When\
    \ an Azure customer creates an instance of a resource, Azure assigns it a subdomain\
