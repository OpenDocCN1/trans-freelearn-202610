    Cloud Shell 存储账户。


    ### 动手练习 – 利用 Cloud Shell 账户提升权限


    在本练习中，我们将利用 Cloud Shell 卷映像，在特权用户使用 Cloud Shell 时以其权限运行敏感命令。我们将涵盖的过程将遵循图 6.23
