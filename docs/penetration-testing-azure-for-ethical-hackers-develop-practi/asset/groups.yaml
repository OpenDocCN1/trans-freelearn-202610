    \   ```\n\nWait for the script to complete. It may take about 8 minutes to complete:\n\
    \n![](img/4fa338e84e0a590967a142dd798ba4e2_185_1.png)\n\nFigure 4.55 – Results\
    \ of running the cleanup script\n"
