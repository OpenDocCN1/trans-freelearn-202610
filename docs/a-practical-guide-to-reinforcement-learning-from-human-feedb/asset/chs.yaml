  \n# 基于人类反馈的强化学习\n\n在前一节中，我们看到，通过将在源环境（**6 x 6** 网格含 **3** 个障碍物）上预训练的 Q 值迁移至目标环境（**8\
  \ x 8** 网格含 **5** 个障碍物）来训练智能体，能有效加快学习进度。这里有一个重要的注意事项：环境应具有合理的相似性，才能从迁移的策略中受益。如果环境差异显著，甚至目标（或到达目标的奖励激励）相互冲突，迁移学习可能会失效。我建议你尝试使用与获取待迁移策略\
  \ Q 值时截然不同的障碍物和目标进行实验。在这种情况下如何加速训练？一种方法是将人类反馈纳入策略训练中。人类反馈可以采取多种形式，例如显式奖励、评估或期望行为的演示。\n\
  \n- **显式奖励：** 人类反馈根据智能体的动作提供显式的奖励或惩罚。例如，在 `gridworld` 场景中，人类可能会为朝目标移动分配正奖励，为撞击障碍物分配负奖励。\n\
  \n- **评估：** 人类评估智能体的动作或策略，并根据其表现提供反馈。例如，他们可能会给出“这是个好动作”或“你本该向左而不是向右”的反馈，客观的点赞或点踩，“是”或“否”。\n\
  \n- **演示：** 人类通过展示智能体如何在环境中解决任务来演示期望行为。这可以是通向成功结果的轨迹或动作序列形式。\n\n\n\n\n# Q 学习中的人类反馈\n\
  \n智能体利用人类反馈来改进其决策过程。这可能涉及各种专门设计用于有效整合人类反馈的学习算法。在网格世界示例中，如果智能体采取一个动作，人类可能会为好的动作提供正向反馈（奖励），为坏的动作提供负向反馈（惩罚）。智能体不再通过探索环境来学习该策略，而是利用人类提供的反馈来更新其策略。正向反馈鼓励智能体在类似情况下重复类似动作，而负向反馈则引导智能体避免这些动作。随着时间的推移，通过从人类反馈中迭代学习，智能体优化其策略，从而在网格世界中做出更好的决策。\n\
  \n为了演示人类反馈如何加速学习，我们继续使用网格世界问题。我们向 `GridWorld` 类添加了一个名为 `q_learning_with_human_feedback()`\
  \ 的新方法，这是对 `q_learning()` 方法的修改。额外的输入 `human_feedback` 提供了一个字典，包含人类针对从当前状态到下一状态的特定场景变化所分配的奖励。例如，如果智能体处于当前状态\
  \ `(2,2)` 而下一状态是 `(2,3)`，这更接近目标 `(5,5)`，人类会给予 `+1` 的奖励。相反，如果当前状态是 `(3,4)` 而智能体移动到下一状态\
  \ `(2,4)`，这离目标 `(5,5)` 更远，人类会给予 `-1` 的奖励。这种基于人类反馈的奖励会被加到 Q 学习算法中分配的奖励上。\n\n## 函数定义与初始化\n\
  \n我们首先定义函数并初始化必要的变量。请注意，它与 `q_learning()` 方法相似，但具有下面代码片段中所示的额外输入 `human_feedback`。\n\
  \n```\ndef q_learning_with_human_feedback(self, num_episodes=1000, learning_rate=0.1,\
  \ discount_factor=0.9, epsilon=0.1, policy_checkpoints=None, human_feedback=None):\n\
  ```\n\n由于该方法是对前一方法的修改且有大量重叠，请参阅前面讨论的 *Q-learning* 章节和代码片段。以下是具体的代码片段及其解释：\n1. **函数定义与初始化**\
  \ （此处修改）\n2. **回合循环**\n3. **动作选择**\n4. **状态转移与奖励分配**\n\n## 融入人类反馈\n\n在完成前面代码片段中讨论的奖励分配后，在第\
  \ 4 步 **状态转移与奖励分配** 中，我们到了通过融入人类反馈来更新奖励的环节。首先，代码检查是否提供了人类反馈。如果当前状态到下一状态的转移有可用的反馈，则相应地更新奖励。\n\
  \n```\nif human_feedback is not None:\n    if state in human_feedback and next_state\
  \ in human_feedback[state]:\n        reward += human_feedback[state][next_state]\n\
  ```\n\n这里，我们只是简单地将人类反馈加到奖励上，但融入人类反馈的方法有很多种，我们将在下一章中看到。更新奖励后，我们继续执行其余代码，这与 `q_learning()`\
  \ 类似，直到方法结束并返回输出。\n\n## 对比执行代码\n\n为了对比 Q 学习和带有人类反馈的 Q 学习，TL 章节中使用的绘图方法 `plot_reward_comparison()`\
  \ 和 `plot_comparison_metrics()` 被复用并添加到了 `GridWorld` 类中。标签和图例也相应更新。实例化并运行修改后的类、对比基于人类反馈的训练与仅使用\
  \ Q 学习从头训练的执行代码如下。在本例中，我们在一个字典中收集人类反馈，键为状态元组，值为映射下一状态到反馈值的字典。\n\n```\nobstacle_positions\
  \ = [(2, 3), (3, 1), (4, 3)]\ngrid_world = GridWorld(grid_size=(6, 6), obstacle_positions=obstacle_positions)\n\
  rewards, steps_per_episode, policy_progress = grid_world.q_learning(num_episodes=200,\
  \ learning_rate=0.1, discount_factor=0.95, epsilon=0.1)\ngrid_world.plot_policy_progress(policy_progress)\n\
  human_feedback = {\n    (2, 2): {(2, 3): 1},  # 从 (2, 2) 转移到 (2, 3) 的正向反馈\n    (2,\
  \ 3): {(2, 4): 1},  # 从 (2, 3) 转移到 (2, 4) 的正向反馈\n    (2, 4): {(2, 5): 1},  # 从 (2,\
  \ 4) 转移到 (2, 5) 的正向反馈\n    (3, 4): {(2, 4): -1},  # 从 (3, 4) 转移到 (2, 4) 的负向反馈\n\
  \    (4, 4): {(3, 4): -1},  # 从 (4, 4) 转移到 (3, 4) 的负向反馈\n    (4, 5): {(5, 5): 1},\
  \  # 从 (4, 5) 转移到 (5, 5) 的正向反馈\n}\nrewards_hf, steps_per_episode_hf, policy_progress_hf\
  \ = grid_world.q_learning_with_human_feedback(num_episodes=200, learning_rate=0.1,\
  \ discount_factor=0.95, epsilon=0.1, human_feedback=human_feedback)\ngrid_world.plot_policy_progress(policy_progress)\n\
  grid_world.plot_rewards_comparison(rewards_hf, rewards)\ngrid_world.plot_comparison_metrics(rewards_hf,\
  \ rewards, steps_per_episode_hf, steps_per_episode)\n```\n\n## 结果与图表\n\n**图 1.10**\
  \ 展示了智能体在导航 6×6 网格时特定回合的轨迹。策略在学习中不断进步，但在第 2 回合和第 20 回合，智能体仍在学习策略。在第 100 回合，我们看到了智能体遵循的最优路径，表明学习已发生。\n\
  \n![图 1.10 Q 学习在 6 × 6 网格中不同时期的智能体轨迹。](img/file13.png)\n\n*图 1.10 Q 学习在 6 × 6 网格中不同时期的智能体轨迹。*\n\
  \n通过网格上的策略进度对比 Q 学习与 Q 学习 + 人类反馈，**图 1.10** 和 **图 1.11** 显示，有了人类反馈，智能体已经采取了最优策略。\n\
  \n![图 1.11 带有人类反馈的 Q 学习在 6 × 6 网格中不同时期的智能体轨迹。](img/file14.png)\n\n*图 1.11 带有人类反馈的\
  \ Q 学习在 6 × 6 网格中不同时期的智能体轨迹。*\n\n为了更清晰地看到这一点，**图 1.12** 展示了各回合总奖励性能的对比。虽然仅用 Q 学习只需合理数量的回合即可达到可实现的奖励并收敛（橙色曲线），但加上\
  \ **人类反馈** 后，总奖励仅在第 *2* 回合就已收敛。请注意，在 **图 1.12** 中，总奖励经过平滑（滤波），以每 10 次迭代的平均值呈现。\n\
  \n![图 1.12 各回合平均总奖励，对比使用人类反馈训练的智能体（深色线）与从头开始的 Q 学习。](img/file15.png)\n\n*图 1.12\
  \ 各回合平均总奖励，对比使用人类反馈训练的智能体（深色线）与从头开始的 Q 学习。*\n\n下图对比了窗口大小为 10 个回合平滑后的每回合总奖励，对比使用人类反馈训练的智能体（深色线）与从头开始的\
  \ Q 学习。图表显示，带有人类反馈的基于 Q 学习的训练收敛更快：2 个回合对比 18 个回合。总训练奖励也更好：1022（有人类反馈）> -549（无人类反馈）。请注意，第\
  \ **0** 回合的初始策略未绘制。有人类反馈情况下的奖励是 Q 学习奖励与人类分配奖励（+1 或 -1）之和，智能体此处仍遵循探索与利用策略（epsilon-greedy\
  \ 方法）。\n\n在 **图 1.13** 的左图中，我们对比原始每回合总奖励，而右图显示智能体每回合到达目标所需的步数。\n\n![图 1.13 人类反馈\
  \ + Q 学习（蓝色/深色线）与仅 Q 学习的对比，通过原始每回合总奖励（左）和智能体每回合到达目标步数（右）展示。](img/file16.png)\n\n\
  \n\n图 1.13 人类反馈 + `Q-learning`（蓝色/深色平线）与仅 `Q-learning` 的对比，通过每回合原始总奖励（左）和智能体每回合到达目标所需步数（右）展示。\n\
  \n在这种情况下，人类反馈 + `Q-learning`（蓝色/深色平线）显示出学习效率的提升，能够几乎瞬间学会用更少步数到达目标状态。蓝色平坦曲线中的少数峰值和谷值表明存在一些遗忘或探索-利用策略在起作用，但平均而言，带有人类反馈的学习获得的奖励更高，到达目标所需的步数更少。\n\
  \n## 摘要\n\n在本章中，我们向您介绍了 `RL` 的主要概念，提供了一个简单的网格世界示例，利用基本算法 `Q-learning` 来帮助理解关键概念，然后演示了迁移学习和人类反馈如何帮助加速学习。虽然这适合入门，但也存在更复杂的示例，其中\
  \ `Q-values` 可能无法存储在表格中，而需要神经网络或类似的函数逼近器。当扩展到连续状态-动作空间时，`Q-learning` 可能变得不稳定，因此将需要其他策略学习算法。我们将在后续章节中介绍其中一些情况。还请注意，虽然我们利用人类的显性奖励反馈实现了学习加速，但在大规模应用中这可能成本高昂，因此可能需要适当的工具来收集人类反馈。后续章节将详细讨论这一点，但在讨论之前，我们将在下一章从总体角度开始了解人类反馈在\
  \ `RL` 中的作用。\n\n### 参考文献\n\n下面列出了有助于读者深入了解该主题的强化学习书籍、课程、论文和链接：\n\n*   Sutton & Barto\
  \ 著《强化学习导论》（incompleteideas.net）：[`http://incompleteideas.net/book/the-book-2nd.xhtml`](http://incompleteideas.net/book/the-book-2nd.xhtml)\n\
  \n*   教学 - David Silver：[`https://www.davidsilver.uk/teaching/`](https://www.davidsilver.uk/teaching/)\n\
  \n*   CS 285 (berkeley.edu)：[`https://rail.eecs.berkeley.edu/deeprlcourse/`](https://rail.eecs.berkeley.edu/deeprlcourse/)\n\
