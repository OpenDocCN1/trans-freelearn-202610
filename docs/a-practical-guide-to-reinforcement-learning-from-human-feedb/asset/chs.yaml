  *   `ipython == 8.27.0`\n*   `ipywidgets == 8.1.5`\n\n除了上述库和安装外，我们还将使用 `google colab`\
  \ 进行基于 GPU 的微调（详见微调一节）。要开始使用，请克隆此 `git` 仓库：[`github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback`](https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback)，并将目录切换到\
  \ `chapter 5`。\n\n## 语言模型简介\n\n传统上，**语言模型（LM）** 是概率模型，旨在根据句子中可用的前序输入词预测最可能的下一个词。预测文本中的下一个词在文本生成、翻译、摘要和情感分析等多种应用中非常有用。从更广泛的角度来看，它预测一个词序列的可能性，可用于估算给定句子的概率，或根据提示生成连贯的文本。\n\
  \n### 早期语言模型：N-gram\n\n最早的语言模型依赖 **N-gram** 方法，根据前面的 n-1 个词计算一个词的概率。例如，bigram 模型（n=2）会查看给定前一个词的情况下某词的概率。虽然简单且易于实现，但\
  \ N-gram 存在显著局限性：\n\n*   **稀疏性**：随着 n 的增大，可能的词组合数量呈指数级增长，导致数据稀疏问题。\n*   **上下文局限**：它们只能考虑有限的上下文（最近的\
  \ n-1 个词），这往往导致长文本中有意义的关系丢失。\n*   `<>`\n\n### 统计语言模型与神经语言模型\n\n为解决 N-gram 的局限性，研究者转向**统计语言模型**，采用**隐马尔可夫模型（HMM）**和**潜在狄利克雷分布（LDA）**等技术捕捉文本中更复杂的关系。然而，这些模型仍受限于对手工特征的依赖和对语言结构的假设。**神经网络**的引入标志着一个重要的转折点。早期的神经语言模型，如采用前馈架构的模型，开始引入嵌入（如\
  \ `Word2Vec`）将词表示为连续空间中的稠密向量。这种方法能够捕捉词之间的语义关系（例如，“king” - “man” + “woman” = “queen”）。\n\
  \n### 循环神经网络（RNN）\n\n**RNN** 及其进阶版本**长短期记忆（LSTM）**网络的开发旨在更好地处理序列数据。它们能维护隐藏状态以记住前序词汇，从而实现更具上下文感知的预测。然而，RNN\
  \ 因梯度消失等问题，难以处理长距离依赖。\n\n### Transformer 的出现\n\n2017 年 **Transformer 架构**的引入，正如\
  \ Vaswani 等人在论文 *Attention is All You Need* 中详述：[`arxiv.org/abs/1706.03762`](https://arxiv.org/abs/1706.03762)，彻底改变了语言建模。Transformer\
  \ 使用*自注意力机制*来衡量序列中不同词的重要性，无论它们之间的距离如何。这使它们能有效捕捉长距离依赖并并行化训练，显著加快了训练过程。\n\n### 大语言模型（LLMs）\n\
  \n基于 Transformer，`BERT`、`GPT-3` 等大语言模型应运而生。这些模型的特点在于：\n\n*   **规模**：它们在海量文本数据（通常达数百\
  \ GB）上训练，包含数十亿参数，能够学习语言中的复杂模式。\n*   **迁移学习**：许多 LLMs 在大量任务上预训练，再针对特定应用微调，使其能在各类\
  \ NLP 任务中良好泛化。\n*   **通用性**：它们能执行零样本或少样本学习，仅需极少示例即可适应新任务。\n\n鉴于 Transformer 模型是最先进的模型，并引领了\
  \ NLP 研究与实践的革命，我们将仅聚焦于此模型。在下一节中，我们将介绍 Transformer 架构及其组件，并展示实现片段。\n\n## Transformer\
  \ 架构\n\n\n\n\n# Transformer 架构：嵌入、位置编码与注意力机制\n\n## 简介\n\nTransformer 的出现源于处理序列数据中长距离依赖的需求，传统的**循环神经网络**（**RNN**）在这方面表现吃力，尤其是在**自然语言处理**（**NLP**）领域。Vaswani\
  \ 等人（2017 年）发表的里程碑式论文《*Attention is All You Need*》（前文已提及）介绍了 Transformer 架构，该架构用注意力机制取代了循环层。这一转变使得训练过程中的并行化更加高效，并提升了涉及大规模数据集任务的性能。Transformer\
  \ 是一种旨在理解和生成数据序列（如句子）的模型。它不再按顺序逐个处理单词，而是一次性查看所有单词。其核心思想是*自注意力*，这使得模型能够根据句子各部分之间的相关性，聚焦于句子的不同部分。\n\
  \n## 嵌入输入\n\n当 Transformer 处理文本时，它首先将单词转换为模型能理解的数字（向量）。这一步称为**嵌入**。例如，假设我们有一个单词序列：，其中每个`x_i`代表序列中的一个单词。由于单词被表示为独热向量（充满零的大向量，仅有一个\
  \ 1 表示该单词），我们使用**嵌入矩阵** `W_e` 将这些独热向量转换为稠密、有意义的向量。顺便提一下，出于实际考虑，每个 `x_i` 可以是一个 token（单词的一种定义好的分割方式）。但为了便于理解，我们这里将每个单词视为一个\
  \ token。数学上，如果 `W_e \\in \\mathbb{R}^{V \\times d_model}`，其中 `V` 是词汇表大小，`d_model`\
  \ 是模型的隐藏维度，则每个单词嵌入为：`z_i = W_e^T x_i`。结果是一个嵌入序列：`Z = (z_1, ..., z_n)`，其中每个 `z_i`\
  \ 是一个大小为 `d_model` 的稠密向量。**直观理解**：可以将嵌入视为一种捕捉单词含义的表示方式。含义相近的单词将拥有相似的嵌入，这有助于模型理解单词之间的关系。\n\
  \n![Figure 5.1 嵌入输入涉及使用嵌入模型将文本单词或 token 转换为数值向量。](img/file28.png)\n\n图 5.1 嵌入输入涉及使用嵌入模型将文本单词或\
  \ token 转换为数值向量。\n\n## 位置编码\n\nTransformer 并行处理整个序列，但这带来了一个挑战：模型如何知道句子中单词的顺序？例如，\"\
  The sun rises from the east\"（太阳从东方升起）在含义和语义上与 \"The east rises from the sun\"（东方从太阳升起）截然不同，尽管单词完全相同。为了解决这个问题，Transformer\
  \ 向每个单词嵌入添加了所谓的*位置编码*。这种编码注入了序列中每个单词位置的信息。每个位置 `t` 的位置编码在数学上定义为：`PE(t, 2i) = sin(t\
  \ / 10000^{2i/d_model})`，`PE(t, 2i+1) = cos(t / 10000^{2i/d_model})`。这为每个单词的位置创建了一个唯一的位置向量\
  \ `p_t`。模型随后将该向量加到单词嵌入上：`z_i' = z_i + p_i`。这个新序列现在成为 Transformer 编码器-解码器架构的输入，从自注意力层开始。架构的一个简单组件如下所示：\n\
  \n![Figure 5.2 向输入嵌入添加位置编码，输出一个新序列 Z，该序列考虑了单词或 token 相对于其他单词/token 的位置。](img/file29.png)\n\
  \n图 5.2 向输入嵌入添加位置编码，输出一个新序列 Z，该序列考虑了单词或 token 相对于其他单词/token 的位置。\n\n位置编码帮助模型知晓单词的顺序。如果没有它，模型会将\
  \ \"The sun rises from the east\" 和 \"The east rises from the sun\" 视为相同。使用 PyTorch\
  \ 可以按下面的代码片段所示实现：\n\n```python\nimport torch\nfrom torch import nn\n\nclass PositionalEncoding(nn.Module):\n\
  \    def __init__(self, d_model, dropout=0.1, max_len=5000):\n        super(PositionalEncoding,\
  \ self).__init__()\n        self.dropout = nn.Dropout(p=dropout)\n        pe = torch.zeros(max_len,\
  \ d_model)\n        position = torch.arange(0, max_len, dtype=torch.float).unsqueeze(1)\n\
  \        div_term = torch.exp(torch.arange(0, d_model, 2).float() * -(torch.log(torch.tensor(10000.0))\
  \ / d_model))\n        pe[:, 0::2] = torch.sin(position * div_term)\n        pe[:,\
  \ 1::2] = torch.cos(position * div_term)\n        pe = pe.unsqueeze(0)  # Shape\
  \ (1, max_len, d_model)\n        self.register_buffer('pe', pe)\n\n    def forward(self,\
  \ x):\n        x = x + self.pe[:, :x.size(1), :]\n        return self.dropout(x)\n\
  ```\n\n在上述片段中，我们创建了一个形状为 `(max_len, d_model)` 的零矩阵，以确保 `pe` 具有适当的维度。`d_model` 维度容纳了正弦和余弦两个分量，因此它是其参数\
  \ `position * div_term` 中项乘积的两倍。由于正弦和余弦分量内的参数都使用 `position` 作为第一项，其形状为 `(max_len,\
  \ 1)`。同样，第二个 `div_term` 形状为 `(d_model/2)`，加起来为 `d_model`，一半用于正弦，一半用于余弦。在 `d_model`\
  \ 中，正弦和余弦分别应用于偶数和奇数索引，正如 `pe[:, 0::2]` 和 `pe[:, 1::2]` 的实现方式所示。我们在 `PositionalEncoding`\
  \ 类的 `__init__` 方法中添加所有这些内容。`forward` 方法将位置编码加到输入张量上，并在应用 `dropout` 进行正则化以防止过拟合后返回。现在我们了解了如何将位置编码添加到输入嵌入中，并融入了单词位置的重要性，接下来我们将探讨将单词关系学习联系在一起的自注意力机制。\n\
  \n## 自注意力：学习单词关系\n\n**自注意力**机制是 Transformer 的核心。它允许模型在处理每个单词时，聚焦于句子中的不同单词。例如，在句子\
  \ \"The sun rises from the east\" 中，当模型处理 \"rises\" 时，它应同时关注 \"sun\"（主语）和 \"east\"\
  （宾语）以理解含义。对于每个单词，模型创建三个向量：\n\n*   一个**查询** `Q`，\n*   一个**键** `K`，\n*   一个**值** `V`。\n\
  \n这些向量通过将输入 `Z` 与学习到的权重矩阵相乘来计算：`Q = Z W_Q`，`K = Z W_K`，`V = Z W_V`。为了确定每个单词应给予其他单词多少注意力，模型计算一个单词的查询与所有单词的键之间的相似度分数。这通过点积和缩放完成：`scores\
  \ = (Q K^T) / sqrt(d_k)`。`softmax` 函数确保分数之和为 1，将其转换为概率。这给出了值向量的加权组合，更重要的单词获得更大的权重。自注意力让每个单词\"\
  审视\"句子中的其他单词，并聚焦于对理解含义最重要的那些。这就像为句子的每个部分高亮显示最重要的单词。\n\n![Figure 5.3 展示自注意力（缩放点积）和多头注意力的示意图。](img/file30.png)\n\
  \n图 5.3 展示自注意力（缩放点积）和多头注意力的示意图。\n\n## 多头注意力：从多视角观察\n\n\n\n\n# Transformer 多头注意力实现\n\
  \n## 多头注意力\n\nTransformer 不仅仅使用一种注意力机制，而是使用多个 `attention heads` 来捕捉词与词之间关系的不同方面。这被称为\
  \ `multi-head attention`。每个头使用不同的学习权重矩阵计算自己的自注意力。然后将所有头的输出拼接并投影回单个矩阵，作为 `multi-head\
  \ attention` 层的最终输出。每个头可能关注不同的关系，例如一个头关注词序关系，另一个关注同义词或语法角色。这有助于模型从多个角度理解词与词之间的关系。可以将\
  \ `multi-head attention` 想象为通过不同的透镜观察一个句子。每个透镜可能关注不同的关系，例如一个头关注主谓宾关系，而另一个关注形容词等修饰语。`multi-head\
  \ attention` 的输出被组合并传递给 `feed-forward network`。下面给出了读者可以如何实现这一点的代码片段。`MultiHeadAttention`\
  \ 类继承自 `torch.nn.Module`，后者是 PyTorch 中所有神经网络模块的基类。构造函数使用输入大小（`d_model`）和注意力头的数量（`num_heads`）初始化注意力机制。`dense`\
  \ 是每个头的维度，计算为 `d_model // num_heads`。这将整体嵌入大小分割成更小的部分，供每个注意力头使用。\n\n### MultiHeadAttention\
  \ 类\n\n```\nimport torch\nimport torch.nn as nn\nclass MultiHeadAttention(nn.Module):\n\
  \    def __init__(self, d_model, num_heads):\n        super(MultiHeadAttention,\
  \ self).__init__()\n        self.num_heads = num_heads\n        self.d_model = d_model\n\
  \        self.depth = d_model // num_heads\n        self.wq = nn.Linear(d_model,\
  \ d_model)\n        self.wk = nn.Linear(d_model, d_model)\n        self.wv = nn.Linear(d_model,\
  \ d_model)\n        self.dense = nn.Linear(d_model, d_model)\n```\n\n### 分头函数\n\n\
  `split_heads` 函数将输入张量重塑为多个头。它首先将嵌入维度（`d_model`）分割为大小为 `depth` 的多个头，以便进行并行注意力计算。然后，它置换维度以重新组织张量形状以进行多头处理：`(batch_size,\
  \ seq_len, d_model)` → `(batch_size, num_heads, seq_len, depth)`。实现 `split_heads`\
  \ 函数的片段如下。\n\n```\n    def split_heads(self, x, batch_size):\n        # Split the\
  \ embedding into multiple heads\n        x = x.view(batch_size, -1, self.num_heads,\
  \ self.depth)\n        return x.permute(0, 2, 1, 3)  # (batch_size, num_heads, seq_len,\
  \ depth)\n```\n\n### 前向方法\n\n`forward` 方法处理输入查询（`q`）、键（`k`）和值（`v`）。它还接受一个 `mask`，通常用于防止模型关注某些位置（例如序列中的填充标记）。它执行以下步骤：应用线性投影（`wq`、`wk`、`wv`）以计算查询、键和值。使用\
  \ `split_heads` 将结果分割为多个头。执行 `scaled dot-product attention`（详见下文）。使用 `view` 和 `dense`\
  \ 将头组合回单个张量。\n\n```\n    def forward(self, q, k, v, mask):\n        batch_size =\
  \ q.size(0)\n        # Linear projections\n        q = self.wq(q)\n        k = self.wk(k)\n\
  \        v = self.wv(v)\n        # Split heads\n        q = self.split_heads(q,\
  \ batch_size)\n        k = self.split_heads(k, batch_size)\n        v = self.split_heads(v,\
  \ batch_size)\n        # Scaled dot-product attention\n        scaled_attention,\
  \ _ = self.scaled_dot_product_attention(q, k, v, mask)\n        scaled_attention\
  \ = scaled_attention.permute(0, 2, 1, 3).contiguous()\n        concat_attention\
  \ = scaled_attention.view(batch_size, -1, self.d_model)\n        return self.dense(concat_attention)\n\
  ```\n\n### 缩放点积注意力\n\n上述调用的 `scaled_dot_product_attention` 方法构建如下。查询（`q`）与键的转置（`k.transpose(-2,\
  \ -1)`）相乘，得到查询和键之间的相似度分数。这生成一个形状为 `(batch_size, num_heads, seq_len, seq_len)` 的张量。相似度分数按\
  \ `dk`（键的维度）的平方根进行缩放，这有助于防止极大的值并稳定梯度。如果提供了 `mask`，则注意力 logits 中不应被关注的位置（如填充标记）会被分配一个非常大的负值，确保其\
  \ `softmax` 值接近零。`softmax` 函数沿最后一个维度（序列长度）应用于注意力 logits，将分数转换为总和为 1 的概率。最后，注意力权重用于加权值（`v`），产生注意力机制的输出。\n\
  \n```\n    def scaled_dot_product_attention(self, q, k, v, mask):\n        matmul_qk\
  \ = torch.matmul(q, k.transpose(-2, -1))  # (batch_size, num_heads, seq_len, seq_len)\n\
  \        dk = k.size(-1)\n        scaled_attention_logits = matmul_qk / torch.sqrt(torch.tensor(dk,\
  \ dtype=torch.float32))\n        if mask is not None:\n            scaled_attention_logits\
  \ += (mask * -1e9)\n        attention_weights = nn.functional.softmax(scaled_attention_logits,\
  \ dim=-1)\n        output = torch.matmul(attention_weights, v) \n        return\
  \ output, attention_weights\n```\n\n`scaled_dot_product_attention` 的输出为 `output`\
  \ 和 `attention_weights`，其中 output 的维度为 `(batch_size, num_heads, seq_len, depth)`。\n\
  \n## 前馈网络\n\n在注意力之后，模型对每个词的表示独立地应用一个 `feed-forward network`。该网络由两个线性变换组成，中间夹着一个\
  \ `ReLU` 激活函数。`FFN` 独立地作用于每个词，但有助于捕捉每个词来自注意力机制的更新表示中更复杂的交互。来自 `FFN` 的输出被传回 `multi-head\
  \ attention` 层进行额外的迭代。多层注意力和 `FFN` 堆叠在一起，以加深模型的理解。\n\n## 残差连接和层归一化\n\n为了帮助模型更有效地学习，Transformer\
  \ 使用了 `residual connections` 和 `layer normalization`。这些机制确保模型在每一步保留原始信息，并有助于稳定学习。为了帮助模型有效学习，Transformer\
  \ 在注意力层和 `feed-forward` 层周围添加了 `residual connections`。这意味着每一层的输入被加到该层的输出上。每当数据通过\
  \ `self-attention` 或 `feed-forward network` 时，输入都会被加回到输出中（`residual connection`），并对结果进行归一化。这保持了信息在网络中的流动，并有助于训练稳定性。`Residual\
  \ connections` 被添加在 `self-attention` 和 `feed-forward` 层周围以维护数据完整性。这些归一化后的输出在堆叠的每一层之间移动。带有\
  \ `feed-forward network` 和 `layer normalization` 的组合多头注意力可以按下面的片段类似地实现，其中 `self.fnn`\
  \ 是 `feed-forward network`，`self.layernorm1` 和 `self.layernorm2` 分别是注意力输出和前馈网络输出上的层归一化。\n\
  \n\n\n\n\n## 编码器-解码器结构\n\n### 编码器\n\n编码器处理输入句子，执行多层多头注意力和前馈网络，将输入转换为丰富的表示。\n\n###\
  \ 解码器\n\n解码器通过利用输出序列中之前的词以及编码器对输入的表示来生成输出句子（如翻译）。每个解码器层执行**自注意力**以关注迄今为止生成的输出序列，并执行**编码器-解码器注意力**以关注输入序列的编码。解码器持续这一过程，直到生成完整的输出序列。\n\
  \n通常，在输入传递给编码器层之前会应用位置编码。编码器类可以如下所示编写，集成了位置编码和 Transformer 编码器层：\n\n```python\n\
  class TransformerEncoderLayer(nn.Module):\n    def __init__(self, d_model, num_heads,\
  \ d_ff, dropout_rate=0.1):\n        super(TransformerEncoderLayer, self).__init__()\n\
  \        self.attention = MultiHeadAttention(d_model, num_heads)\n        self.ffn\
  \ = nn.Sequential(\n            nn.Linear(d_model, d_ff),\n            nn.ReLU(),\n\
  \            nn.Linear(d_ff, d_model)\n        )\n        self.layernorm1 = nn.LayerNorm(d_model)\n\
  \        self.layernorm2 = nn.LayerNorm(d_model)\n        self.dropout1 = nn.Dropout(dropout_rate)\n\
  \        self.dropout2 = nn.Dropout(dropout_rate)\n\n    def forward(self, x, mask):\n\
  \        attn_output = self.attention(x, x, x, mask)\n        out1 = self.layernorm1(x\
  \ + self.dropout1(attn_output))  # 残差连接\n        ffn_output = self.ffn(out1)\n \
  \       return self.layernorm2(out1 + self.dropout2(ffn_output))  # 残差连接\n```\n\n\
  ```python\nclass TransformerEncoder(nn.Module):\n    def __init__(self, d_model,\
  \ num_heads, d_ff, num_layers, dropout_rate=0.1):\n        super(TransformerEncoder,\
  \ self).__init__()\n        self.positional_encoding = PositionalEncoding(d_model,\
  \ dropout_rate)\n        self.enc_layers = nn.ModuleList([TransformerEncoderLayer(d_model,\
  \ num_heads, d_ff, dropout_rate) for _ in range(num_layers)])\n\n    def forward(self,\
  \ x, mask):\n        x = self.positional_encoding(x)\n        for layer in self.enc_layers:\n\
  \            x = layer(x, mask)\n        return x\n```\n\n以上代码片段仅旨在帮助读者了解如果仅使用 `PyTorch`\
  \ 从头构建 Transformer，我们该如何实现 Transformer 编码器。我们已提供构建编码器的所有片段，并添加到了 GitHub 仓库中，位于 `chapter5`\
  \ 目录下，文件名为 `transformer_encoder.py`。上述片段将帮助读者自行验证理解；下面的测试片段将帮助读者验证组件是否正常工作。\n\n\
  ```python\ndef test_transformer_components():\n    pos_encoding = PositionalEncoding(d_model=64)\n\
  \    sample_input = torch.randn(10, 50, 64)  # (batch_size, seq_len, d_model)\n\
  \    pos_encoded_output = pos_encoding(sample_input)\n    assert pos_encoded_output.shape\
  \ == sample_input.shape, \"Positional encoding test failed!\"\n    self_attn = MultiHeadAttention(d_model=64,\
  \ num_heads=8)\n    attn_output, _ = self_attn(sample_input, sample_input, sample_input)\n\
  \    assert attn_output.shape == sample_input.shape, \"Multi-head attention test\
  \ failed!\"\n    enc_layer = TransformerEncoderLayer(d_model=64, num_heads=8, d_ff=256)\n\
  \    encoder_output = enc_layer(sample_input, None)\n    assert encoder_output.shape\
  \ == sample_input.shape, \"Encoder layer test failed!\"\n    print(\"All tests passed!\"\
  )\n\ntest_transformer_components()\n```\n\n对于文本生成等任务，解码器层负责按顺序生成 Token。它使用掩码自注意力以确保未来的\
  \ Token 对模型不可见，从而保持自回归行为。解码器在结构上与编码器相似，但有关键区别：\n\n*   **`掩码多头注意力`**：这确保了在预测下一个 Token\
  \ 时，解码器只关注迄今为止生成的 Token，而不关注未来的 Token。这种掩码对于自回归任务至关重要，在该任务中你希望逐步生成序列。\n*   **`交叉注意力层`**：除了自注意力（类似于编码器）外，解码器还有一个额外的注意力层，用于关注来自编码器的输出。这使得解码器在生成输出时能够关注输入序列的相关部分。\n\
  \n在实践中，Transformer 实现使用分布式训练框架来提高训练效率，且实现可能非常复杂。然而，有几个库提供了 Transformer 实现，例如 `PyTorch`、`HuggingFace`\
  \ 和 `TensorFlow` 都有 Transformer 实现。在本章中，我们已在上文展示编码器和表示学习片段。解码器方面对于序列生成是必要的，我们将从现在开始使用\
  \ Transformer 库来简化实现，并更多地关注使用预训练模型进行微调，而不是从头训练语言模型。关于从头训练 Transformer 和生成式预训练 Transformer\
  \ (`GPT`) 模型的良好参考资料可在此阅读：https://mng.bz/M96o。虽然我们在本节讨论了 Transformer 如何构建及其架构组件，但我们现在将重点放在后续章节中通过实战示例将它们作为微调语言模型来使用。\n\
  \n## 微调语言模型\n\n在本节中，我们将首先了解如何加载预训练语言模型，然后逐步讲解微调过程。预训练语言模型是具有 Transformer 架构的模型，它们已经在大量数据（本例中为文本数据）上进行过训练。当我们试图解决可以利用先前学习到的技能或表示的类似问题时，这能显著节省时间。在预训练模型上进行微调还有助于减少碳足迹，因为训练大型模型需要大量能源。\n\
  \n我们现在将探索 `HuggingFace` Transformer 库，它为各种自然语言处理 (`NLP`) 任务（如文本分类、翻译和摘要）提供了多种预训练模型和工具。它是一个用于处理最先进\
  \ Transformer 模型的流行库。此外，它还支持跨多种模态（如文本、视觉和音频）执行任务。除了 Transformer 库，我们还将使用 `Hugging\
  \ Face` 的 `datasets` 库，它提供了对大量数据集的便捷访问以及用于数据处理的实用工具。使用 `datasets` 库简化了加载、转换和预处理数据集等任务，这些是训练机器学习模型工作流中的常见环节。这种简化将使我们能够专注于使用这些数据集从预训练模型进行推理，随后用特定数据对其进行微调。\n\
  \n与传统机器学习工作流不同，微调模型工作流涉及模型选择、微调和评估阶段，而不是训练和评估阶段。就数据准备阶段而言，它与 `ML` 工作流存在一些相似之处。在图\
  \ 4 中，我们可以看到工作流可分为三个阶段：1) 数据准备，包括收集、探索性分析和预处理，2) 模型选择、调优模型和评估，3) 部署、监控和维护。第一和第三阶段与传统机器学习工作负载相似，因此我们将主要依赖\
  \ `datasets` 库完成第一阶段，该库拥有各种数据集。\n\n![Figure 5. 4 Fine-tuning workflow showing various\
  \ phases.](img/file31.png)\n\n图 5. 4 显示各个阶段的微调工作流。\n\n\n\n\n\n## 设置\n\n具有合理规模的 Transformer\
  \ 模型需要配备图形处理单元（GPU）的硬件，才能在合理的时间内完成训练。虽然微调能减少训练时间，但它同样需要 GPU 来加速训练。对于本章的练习，我们将使用它们来减少训练时间开销。有几种使用\
  \ GPU 设置训练工作流的选项：\n\n*   获取一台配备 GPU 硬件的本地机器（台式机或笔记本电脑）并启用 GPU 访问。要查看 NVIDIA GPU\
  \ 详细信息，可以在命令行界面中运行此命令，具体取决于你使用的是 Windows 还是 Mac 操作系统：`nvidia-smi`。\n*   购买提供 GPU\
  \ 的云资源，如虚拟机 (VM) 或容器；主要的有 Azure、AWS 和 Google Cloud。\n*   Google Colab Pro、Lambda\
  \ Labs、Azure ML 服务和 Amazon SageMaker 等服务也是一种选择。\n\n认真投入开发工作流的读者可以尝试上述任何选项，并查阅相应的文档。对于学习和自我教育而言，使用任何云资源和/或服务的免费层级是一个很好的起点。为了本章的目的，我们将坚持采用一个最包容的选项；这意味着使用免费层级或低成本选项微调轻量级语言模型，以便学生和仅想尝试、自学的读者能够负担得起。其中一个选项是使用免费的\
  \ Google Colab 笔记本，或在需要时订阅月度会员。我们还将使用一些 Hugging Face `datasets` 库以及来自 `transformers`\
  \ 库的预训练模型。请注意，Google Colab 会预装一些基本的机器学习库，但像 `datasets` 这样的某些库需要使用类似 `!pip install\
  \ datasets` 的命令进行安装。在笔记本中，我们将首先安装和/或导入所有必需的库，如下所示。\n\n```\n# Import libraries\n\
  from transformers import AutoTokenizer, AutoModelForSequenceClassification, TrainingArguments,\
  \ Trainer\nfrom datasets import load_dataset\nimport torch\nimport numpy as np\n\
  from sklearn.metrics import accuracy_score, f1_score\n```\n\n### 数据集\n\n让我们了解一下使用\
  \ `datasets` 库进行数据准备的步骤。使用 `datasets` 库，我们可以轻松加载数据，从而简化数据收集步骤。为了在本章中演示如何微调以及它如何改进推理，我们将仅加载数据集的一个子集。我们现在将加载\
  \ \"imdb\" 数据集的一个子集（约 1000 个样本），它是来自流行的互联网电影数据库 (IMDB) 来源的 Hugging Face `datasets`\
  \ 库的一部分。然后，使用 `train_test_split` 方法将数据拆分为 80% 的训练数据和 20% 的测试数据。\n\n```\n# Load dataset\n\
  dataset = load_dataset(\"imdb\", split=\"train[:1000]\")  # Sample a subset to keep\
  \ it lightweight\ndataset = dataset.train_test_split(test_size=0.2)  # Split into\
  \ train and test\ntrain_dataset, test_dataset = dataset['train'], dataset['test']\n\
  ```\n\nHugging Face 的 `datasets` 库主要以 `Dataset` 对象的形式加载数据。当你加载数据集时，它会将多个分割（如 'train'、'validation'、'test'）组织成一个类字典结构，其中每个键对应一个特定的分割，值为\
  \ `Dataset` 对象。`DatasetDict` 是一个包含数据集分割的专用字典。`DatasetDict` 中的每个条目都是一个 `Dataset`\
  \ 对象，它提供对数据的高效访问，并具有映射、过滤和处理等功能。我们使用训练分割及其中的 1000 个样本，以保持训练的轻量级。接下来，我们将检查一些样本，并查看训练和测试数据集的大小。\n\
  \n```\n# EDA - Check some samples\nprint(\"Sample Data: \", train_dataset[0])\n\
  print(\"Training Data Size:\", len(train_dataset))\nprint(\"Testing Data Size:\"\
  , len(test_dataset))\n# Distribution of labels\nprint(\"Label Distribution: \",\
  \ train_dataset.features['label'].names)\n```\n\n我们可以看到电影评论的样本文本、数据大小以及基于情感的标签分布：\n\
  \n```\nSample Data: {'text': \"Holy freaking God all-freaking-mighty. This movie\
  \ was so bad, I thought I was on drugs. In a bad way... The character acting is\
  \ the poorest thing I've seen in quite some time. This movie was more akin to Lord\
  \ of the G-Strings, IMHO(it's a real movie). Most of the movie appeared to be done\
  \ on a horrible green screen. My favorite part was when they are in the carriage,\
  \ and you can tell there's no horse. They're fleeing from alien monsters, and going\
  \ about the same speed as a swift jog. Then it switches to a far-shot with a ridiculous\
  \ CG horse. And the CG in general seems to be sub-par to 1992's Beyond the Mind's\
  \ Eye. I mean, Come on, really. It felt like a horrible episode of Hercules, only\
  \ without Kevin Sorbo there to save the day. Worst. Movie. Ever.\", 'label': 0}\n\
  ```\n\n```\nTraining Data Size: 800\nTesting Data Size: 200\nLabel Distribution:\
  \  ['neg', 'pos']\n```\n\n如果你在单个单元格中加载数据集且不进行拆分，你将看到数据加载进度和以 `.parquet` 格式存储的文件。这种选择是为了其高效的列式存储，可加快数据加载速度并通过压缩减小文件大小。它们还支持模式演进，并能与大数据工具良好集成，从而提升整体性能和灵活性。\n\
  \n### 分词\n\n分词过程涉及使用特定的分词器类（如 `BertTokenizer` 或 `GPT2Tokenizer`），它们实现了诸如子词分词（例如\
  \ `WordPiece` 或 `Byte Pair Encoding`）等策略，以处理未知词汇并减小词表大小。分词器还会插入特殊标记（如用于分类的 `[CLS]`），并将文本转换为对应模型词表中标记的数字标识符。它们生成注意力掩码以指示应处理哪些标记，并生成片段标识符以区分输入片段。此外，分词器可以填充或截断序列以保持一致的输入长度，使从原始文本到模型就绪输入的转换对于各种\
  \ NLP 任务来说既高效又有效。在这里，我们将使用来自 `transformers` 库的一个特定分词类——`AutoTokenizer` 类，它允许你为指定模型加载分词器。对于这种特定情况，我们指定加载\
  \ `DistilBERT` 模型的分词器，这是 `BERT` 的一个更小、更快的版本，且为 uncased（即不区分大小写字母）。下面的代码片段展示了如何加载分词模型并将其应用于数据分词。\n\
  \n```\n# Load tokenizer\ntokenizer = AutoTokenizer.from_pretrained(\"distilbert-base-uncased\"\
  )\n# Tokenize the datasets\ndef tokenize_data(example):\n    return tokenizer(example['text'],\
  \ padding=\"max_length\", truncation=True)\ntrain_dataset = train_dataset.map(tokenize_data,\
  \ batched=True)\ntest_dataset = test_dataset.map(tokenize_data, batched=True)\n\
  # Set format for PyTorch\ntrain_dataset = train_dataset.rename_column(\"label\"\
  , \"labels\").with_format(\"torch\")\ntest_dataset = test_dataset.rename_column(\"\
  label\", \"labels\").with_format(\"torch\")\n```\n\n`tokenize_data` 函数使用加载的分词器，查找\
  \ `text` 字段中的文本值。参数 `padding=\"max_length\"` 和 `truncation=True` 确保所有分词输出长度一致，将较短序列填充至最大长度并截断较长序列。`dataset.map`\
  \ 方法以批处理方式将 `tokenize_data` 函数应用于整个数据集，意味着它一次处理多个示例。这很高效，并能加快分词过程。\n\n### 模型推理\n\
  \n\n\n\n\n## 模型选择与基线评估\n\n在将数据预处理为标记化数据集后，下一步涉及模型选择，并使用它进行推理和测试。我们将使用来自 `transformers`\
  \ 库的 `AutoModelForSequenceClassification` 类。该类允许您根据提供的模型名称（例如 `distilbert-base-uncased`）自动加载适合序列分类的模型。这提供了灵活性，可以轻松在不同模型之间切换，而无需担心底层架构。它还会自动获取与该模型关联的配置，其中包含输出类别数量等详细信息，并与相应的分词器无缝协作。模型的输出包括\
  \ `logits`，可以使用 `softmax` 函数将其转换为概率。这对于确定给定输入的预测类别概率很有用。模型加载主要是指定模型并使用 `AutoModel`\
  \ 方法。\n\n```\n# Load the pretrained model\nmodel = AutoModelForSequenceClassification.from_pretrained(\"\
  distilbert-base-uncased\", num_labels=2)\n```\n\n为了评估模型，我们编写一个函数来计算一些指标。这里我们将使用\
  \ `accuracy_score` 将预测输出与电影评论情感得分的 `labels` 进行核对，然后我们还使用加权平均 `f1_score` 来比较 `labels`\
  \ 和 `predictions`：\n\n```\n# Evaluation function\ndef compute_metrics(pred):\n \
  \   logits, labels = pred\n    predictions = np.argmax(logits, axis=-1)\n    accuracy\
  \ = accuracy_score(labels, predictions)\n    f1 = f1_score(labels, predictions,\
  \ average=\"weighted\")\n    return {\"accuracy\": accuracy, \"f1\": f1}\n```\n\n\
  在下面的代码片段中，我们对加载的 20% 测试集数据 `test_dataset` 进行推理。由于模型是预训练的，我们将仅使用基础模型进行推理，并将此评估视为基线评估，以便稍后与微调进行比较。从\
  \ `transformers` 库导入的 `TrainingArguments` 和 `Trainer` 方法用于指定预测参数。注意，我们禁用了向 `Weights\
  \ & Biases`（一个实验跟踪框架）记录日志。但是，读者可以移除 `report_to = 'none'` 这一行以启用默认的 Weights and Biases\
  \ 实验框架。使用实验框架将需要订阅密钥。还有其他开源版本，如 `Mlflow`，读者可以稍后探索。通常这在实际项目中很有帮助，您可能想跟踪实验进度，因为这涉及基于权重、\
  \ `batch size`、 `tokenization` 以及 `GPT` 类实验中的 prompts 进行 `hyperparameter tuning`。目前我们不需要它。\n\
  \n```\n# Trainer for evaluation\ntraining_args = TrainingArguments(\n    output_dir=\"\
  ./results\",\n    per_device_eval_batch_size=8,\n    report_to='none')         \
  \       # Disable logging to W&B)\ntrainer = Trainer(model=model, args=training_args,\
  \ eval_dataset=test_dataset, compute_metrics=compute_metrics)\n# Baseline evaluation\n\
  baseline_results = trainer.evaluate()\nprint(\"Baseline Results:\", baseline_results)\n\
  ```\n\n运行推理后，输出可能会包含一条消息，指示某些权重未从模型检查点初始化。目前可以忽略它。这主要用于从精确权重恢复训练的模型，但这不是我们这里的目标。输出将如下所示：\
  \ `DistilBertForSequenceClassification` 的某些权重未从 `distilbert-base-uncased` 的模型检查点初始化，而是新初始化的：\
  \ `['classifier.bias', 'classifier.weight', 'pre_classifier.bias', 'pre_classifier.weight']`。您可能应该在下游任务上\
  \ `TRAIN` 该模型，以便将其用于预测和推理。推理的输出 `baseline_results` 将显示如下内容：\n\n```\nBaseline Results:\
  \ {'eval_loss': 0.6827018857002258, 'eval_model_preparation_time': 0.0025, 'eval_accuracy':\
  \ 0.765, 'eval_f1': 0.8668555240793201, 'eval_runtime': 3.0755, 'eval_samples_per_second':\
  \ 65.03, 'eval_steps_per_second': 8.129}\n```\n\n我们稍后将使用这些结果，在使用训练数据微调模型后进行比较。\n\
  \n### 微调\n\n现在，我们在特定数据集上训练预训练的 Transformer 模型（本例中为前几节讨论的 `DistilBERT`），以提高其在目标任务上的性能，例如对来自\
  \ `IMDB` 的电影数据集进行情感分类。我们首先定义 `training arguments`，指定关键超参数，如 `learning rate`（模型更新的速度）、\
  \ `batch size`（每个训练步骤处理的样本数）、 `epochs` 数量（完整遍历数据集的次数）和 `weight decay`（防止过拟合）。接下来，我们初始化一个\
  \ `Trainer` 对象，它通过组合模型、训练参数、数据集和计算评估指标的函数来自动化微调过程。当我们调用 `trainer.train()` 时，它会以批次为单位遍历训练数据，使用\
  \ `loss function` 在每个批次上调整模型参数，逐步调整模型权重以更好地预测任务的标签。在此微调过程中，模型学习数据集特有的模式，这增强了其对同一类别中新样本进行分类的能力，并且预期该调整后的模型将比基线预训练版本表现更好。\n\
  \n```\n# Fine-tuning arguments\ntraining_args = TrainingArguments(\n    output_dir=\"\
  ./results\",\n    evaluation_strategy=\"epoch\",\n    learning_rate=2e-5,\n    per_device_train_batch_size=8,\n\
  \    per_device_eval_batch_size=8,\n    num_train_epochs=3,\n    weight_decay=0.01,\n\
  \    report_to='none'\n)\n# Trainer for fine-tuning\ntrainer = Trainer(\n    model=model,\n\
  \    args=training_args,\n    train_dataset=train_dataset,\n    eval_dataset=test_dataset,\n\
  \    compute_metrics=compute_metrics,\n)\n# Fine-tuning\ntrainer.train()\n```\n\n\
  该单元格的训练输出将如下所示：\n\n| Epoch | Training Loss | Validation Loss | Accuracy | F1 |\n\
  | --- | --- | --- | --- | --- |\n| 1 | No log | 0.001113 | 1.000000 | 1.000000 |\n\
  | 2 | No log | 0.000520 | 1.000000 | 1.000000 |\n| 3 | No log | 0.000415 | 1.000000\
  \ | 1.000000 |\n\n```\nTrainOutput(global_step=300, training_loss=0.01779682795206706,\
  \ metrics={'train_runtime': 134.3684, 'train_samples_per_second': 17.861, 'train_steps_per_second':\
  \ 2.233, 'total_flos': 317921756774400.0, 'train_loss': 0.01779682795206706, 'epoch':\
  \ 3.0})\n```\n\n### 评估\n\n评估训练好的模型是机器学习中必不可少的一步。微调模型也是如此。过程相似，但稍后我们将讨论一些大语言模型微调特有的挑战。对于上述微调模型的评估，我们使用刚才用于微调的\
  \ `trainer` 类的 `evaluate` 方法，并与 `baseline` 进行比较。\n\n```\n# Evaluation after fine-tuning\n\
  fine_tuned_results = trainer.evaluate()\nprint(\"Results after Fine-Tuning:\", fine_tuned_results)\n\
  # Compare baseline and fine-tuned results\nprint(\"Improvement in Accuracy:\", fine_tuned_results['eval_accuracy']\
  \ - baseline_results['eval_accuracy'])\nprint(\"Improvement in F1 Score:\", fine_tuned_results['eval_f1']\
  \ - baseline_results['eval_f1'])\n```\n\n微调结果输出以及微调模型与基线之间的准确率和 F1 分数差异如下所示：\n\n\
  ```\nResults after Fine-Tuning: {'eval_loss': 0.00041467114351689816, 'eval_accuracy':\
  \ 1.0, 'eval_f1': 1.0, 'eval_runtime': 3.3424, 'eval_samples_per_second': 59.837,\
  \ 'eval_steps_per_second': 7.48, 'epoch': 3.0}\nImprovement in Accuracy: 0.235\n\
  Improvement in F1 Score: 0.1331444759206799\n```\n\n注意，仅查看正向提升表明微调确实有帮助，但我们将查看百分比提升以了解微调的相对影响。\n\
  \n\n\n\n# 微调中的 RLHF\n\n```python\n# Calculate percentage improvement for accuracy\
  \ and F1 score\naccuracy_improvement = ((fine_tuned_results['eval_accuracy'] - baseline_results['eval_accuracy'])\
  \ / baseline_results['eval_accuracy']) * 100\nf1_improvement = ((fine_tuned_results['eval_f1']\
  \ - baseline_results['eval_f1']) / baseline_results['eval_f1']) * 100\nprint(f\"\
  Percentage Improvement in Accuracy: {accuracy_improvement:.2f}%\")\nprint(f\"Percentage\
  \ Improvement in F1 Score: {f1_improvement:.2f}%\")\n```\n\n微调后的模型将 `accuracy` 提升了\
  \ %，将 `F1 score` 提升了 %。请注意，对于随机选取的数据子集，这些数字会略有不同，读者可以通过实验调整训练参数来改进结果或观察进一步的变化。\n\
  \n```\nPercentage Improvement in Accuracy: 30.72%\nPercentage Improvement in F1\
  \ Score: 15.36%\n```\n\n这里要记住的一个重要点是，`Accuracy` 和 `F1 Score` 是改进和优化训练的良好指标，或者用来了解训练是否存在明显错误，例如评估数据集不正确、数据不平衡，或微调训练数据不足。传统上用于\
  \ NLP 任务的其他指标，例如用于衡量模型输出中 n-gram 精确度的 `BLEU (Bilingual Evaluation Understudy)`，以及用于比较\
  \ n-gram、词序列和词对重叠度的 `ROUGE (Recall-Oriented Understudy for Gisting Evaluation)`，传统上用于机器翻译和其他任务。当我们必须考虑与词语位置相关的语义时，这些指标可能会产生误导，而其他方法——即实际文本输出可以由领域专家评估、通过人工检查评估，或由更复杂的\
  \ AI 模型裁判评估——可能更有效。这是当前研究以及新兴实践的主题。微调演示笔记本也可在 GitHub 仓库的 chapter5 下找到。在了解了微调如何提供帮助后，我们现在将讨论将\
  \ `RLHF` 与微调相结合的各种方式。\n\n将 `RLHF`（`Reinforcement Learning from Human Feedback`，基于人类反馈的强化学习）集成到微调过程中，可以改善微调模型与人类对输出期望的一致性。对于上述使用\
  \ `transformers` 库进行微调的过程，这将涉及调整微调流程，以纳入人类反馈作为模型输出优化的额外指导。虽然 Hugging Face 的 `Trainer`\
  \ 类抽象了微调的大部分细节，但 `RLHF` 通常需要更多定制，特别是为了管理反馈循环并应用强化学习技术，而不是（或除了）我们在上一节中使用特定数据集尝试的标准监督微调方法。以下是\
  \ `RLHF` 在概念上如何引入：\n\n1.  `Feedback Collection`（反馈收集）：首先，收集人类对模型输出的反馈，例如基于相关性或质量对模型输出进行评分或二元偏好选择。例如，您可以向人工评审员展示模型的回复，请他们对每个回复的正确性或质量进行评分。\n\
  2.  `Reward Modeling`（奖励建模）：利用这些反馈训练一个*奖励模型*，它将作为一个函数来估算给定输出的质量。该奖励模型成为基于学习到的人类偏好来“评估”每个输出期望程度的额外工具。\n\
  3.  `Policy Optimization`（策略优化）：集成强化学习技术，如 `Proximal Policy Optimization (PPO)`（近端策略优化），利用奖励模型的分数来优化模型的策略（其生成输出的行为）。在训练期间，模型的权重会被调整以最大化来自奖励模型的预期奖励，而不仅仅是最小化交叉熵损失。这可以通过创建一个循环来实现：模型生成输出，通过奖励模型接收反馈，然后更新权重以倾向于预测奖励较高的输出。\n\
  4.  `Training with Trainer or Custom Loop`（使用 Trainer 或自定义循环进行训练）：Hugging Face 的\
  \ `Trainer` 类可能需要进行定制，或替换为更灵活的强化学习循环。使用定制版的 `Trainer` 或特定的 RL 库（如 `CleanRL` 或 `Stable\
  \ Baselines3`），训练循环将涉及在生成输出、使用奖励模型评估输出、以及基于接收到的奖励信号进行反向传播之间交替进行，从而强化更符合人类偏好的行为。\n\
  \n将 `RLHF` 与 Hugging Face 的 `Trainer` 类集成需要大量定制，因为 `Trainer` 主要是为监督学习设计的。然而，有一些专门的框架和库通过提供定制的强化学习组件（包括对奖励建模和策略优化的支持），使\
  \ `RLHF` 的实现更易于管理。以下是选项概述，包括对 `Trainer` 的定制和替代库：\n\n## 使用 Hugging Face TRL 库中的 TRLX\n\
  \n`TRL (Transformer Reinforcement Learning)` 是由 Hugging Face 开发的库，专门设计用于促进针对 Transformer\
  \ 的 `RLHF`。`trlX` 库扩展了 Hugging Face 模型，并集成了 RL 算法，如 `Proximal Policy Optimization\
  \ (PPO)`（在上一章中进行了大量讨论），该算法常用于 `RLHF` 设置中。\n\n*   `Advantages`（优势）：`trlX` 专门构建用于处理\
  \ Transformer 的 `RLHF`，使得在 Hugging Face 模型之上直接实现基于奖励的优化和策略训练变得更简单。\n*   `Features`（特性）：包含优化的基于奖励的训练循环、奖励模型，并支持流行的\
  \ RL 算法（如 `PPO`）。它可以利用相同的 Hugging Face Transformers 模型，保持与预训练检查点的兼容性，并允许集成 Hugging\
  \ Face 数据集。\n\n`trlX` 是一个有力的选择，因为它专为语言模型和其他基于 Transformer 的架构设计，减少了对自定义代码的需求，并在\
  \ Hugging Face 模型生态系统上实现了高效的 RL 训练。\n\n## 使用奖励驱动损失定制 Trainer\n\n如果您想为 `RLHF` 扩展\
  \ `Trainer`，则需要进行定制以实现涉及奖励建模和基于强化学习的优化的反馈循环：\n\n*   `Reward Modeling`（奖励建模）：使用人类反馈数据训练一个单独的奖励模型，根据与人类偏好的一致性对输出进行评分。\n\
  *   `Loss Adjustment`（损失调整）：修改损失函数以同时包含监督损失和奖励驱动组件。在训练期间，模型的权重会被调整以最大化来自奖励模型的预期奖励，而不仅仅是最小化交叉熵损失或其他监督损失。这可以通过创建一个循环来实现：模型生成输出，通过奖励模型接收反馈，然后更新权重以倾向于预测奖励较高的输出。\n\
  \n这种方法灵活但可能复杂且计算成本高昂。您可能还需要构建额外的定制来处理轨迹生成和采样，特别是如果您需要使用 `PPO` 或其他 RL 算法进行稳定训练时。\n\
  \n## 使用强化学习库\n\n像 `CleanRL` 和 `Stable Baselines3` 这样的库提供强化学习算法和训练工具，如果您需要更高级的 `RLHF`\
  \ 设置或想超越基于文本的模型，这些库会很有帮助：\n\n*   `Integration Approach`（集成方法）：将这些库与 Hugging Face\
  \ Transformer 模型结合，模型生成输出动作，反馈被转化为通过 `CleanRL` 或 `Stable Baselines3` 的 `PPO` 实现处理的奖励。\n\
  *   `Advantages`（优势）：这些库针对 RL 任务进行了高度优化，支持使用 `PPO`、`A2C` 和 `DDPG` 等算法进行稳定训练。它们还提供用于监控和调试\
  \ RL 训练的额外工具。\n\n\n\n**局限性**：与 `TRLX` 相比，集成更为复杂，因为这些库并非专门为 Transformer 或语言模型设计，因此需要一些手动配置和\
  \ API 集成。\n\n## 使用 OpenAI 的 `spinningup` 或自定义 `PPO` 实现\n\n自定义 `PPO` 实现或使用某些库（如 OpenAI\
  \ 的 `spinningup`）仅需最少量的 `PPO` 或其他 `RL` 算法实现，即可提供对 `RL` 训练过程各个方面的完全控制，从而实现彻底的定制以满足\
  \ `RLHF` 需求。这需要更多的编码和调试，因为每一步——从模型推演到奖励处理再到梯度更新——都需要手动实现。在上一章中，我们介绍了如何通过模块化和改造 `CleanRL`\
  \ 的 `PPO` 实现，来实现更灵活的集成和定制，以及提供对 `RL` 组件的可见性。这有利于深入理解，然而，我们使用的是相对易于管理的策略架构，引入 Transformer\
  \ 架构将给代码库带来进一步的复杂性。计划开发、维护和演进自己代码库的读者可以采用并选择此方案。然而，既然我们在这里依赖 `transformers` 库，我们将使用诸如\
  \ `trl` 和 `trlX` 之类的库来帮助加快学习和实验，同时减少代码管理开销。这也将使我们能够专注于提高 `RLHF` 流程的有效性、简化和优化。虽然我们讨论了将\
  \ `RLHF` 与微调集成的各种方式，但在这一节中，我们将在第 8 章更详细地讨论 `RLHF` 实现。在下一节中，我们将继续讨论微调中的评估以及微调中涉及的、使实施\
  \ `RLHF` 成为必要的挑战。\n\n## 微调中的评估与挑战\n\n在之前的微调部分，我们使用准确率得分和 F1 得分作为评估指标来评估微调效果。通过将基线模型的推理结果与微调模型的推理结果进行比较，我们能够比较微调模型带来的进步。我们将在第\
  \ 11 章更详细地讨论评估指标和方法。在本节中，我们将讨论微调模型评估中的常见挑战，`RLHF` 如何帮助解决其中一些挑战，以及仍需由 `RLHF` 解决的挑战。\n\
  \n*   **指标选择：** 选择合适的评估指标很复杂。准确率和 F1 得分等传统指标可能无法充分捕捉语言生成的细微差别，如连贯性、相关性或创造性。例如，上一节中用于情感评分的准确率和\
  \ F1 得分可以提供一些见解，但它们可能不足以在复杂的文本生成和理解场景中进行全面评估。`RLHF` 可以通过将人类反馈直接纳入训练过程来增强指标选择，使模型能够针对人类认为有价值的特质进行优化。这可以产生更细致的指标，更好地反映与人类用户交互时的真实性能。\n\
  \n*   **指标间的权衡：** 有时优化模型性能的一个方面（如流畅度）会对另一个方面（如事实准确性）产生负面影响，这使得平衡相互竞争的目标变得困难。`RLHF`\
  \ 可以通过允许人类评估者根据预期用例优先考虑某些特质，来帮助找到更有利的平衡，从而实现更量身定制的性能调整。\n\n*   **可解释性：** 理解模型表现好或差的原因可能具有挑战性，这使得评估过程和改进模型的工作都变得复杂。`RLHF`\
  \ 可以通过使决策过程更透明来增强可解释性，因为模型从关于什么被认为是好或坏表现的明确人类反馈中学习。\n\n*   **上下文敏感性：** 模型输出的有效性会因上下文而大相径庭，这使得孤立的评估信息量较小。如果收集了此类反馈，`RLHF`\
  \ 可以通过提供强调情境相关性和适当性的反馈，帮助模型变得更具上下文感知能力。\n\n除了这些挑战之外，微调模型在不同领域（如医疗与日常对话）通常表现出不同的性能水平，这使得泛化能力的评估变得复杂。这被称为领域变异性。`RLHF`\
  \ 可以通过利用与这些语境相关的人类反馈，帮助针对特定领域定制模型，从而可能提高目标领域内的性能和泛化能力。然而，它可能无法完全解决跨多样化、未预见领域的性能变异性，因为模型的训练数据和反馈本质上局限于已知语境。\n\
  \n### 概要\n\n本章向您介绍了语言模型，从语言模型的历史演变讲起，从早期模型到基于神经网络的模型，再到基于 Transformer 的模型的出现。然后，深入讨论了\
  \ Transformer 架构，重点关注编码器架构，以帮助读者理解 Transformer 的内部工作原理，并配合一些 `transformers` 库的实操使用。接着讨论了语言模型微调。讨论了微调工作流，随后演示了一个使用\
  \ `transformers` 库、`datasets` 库、分词、模型推理和微调的示例用例，针对电影数据库的评论及其人工提供的情感评分进行评估，帮助用户获得实操体验并认识到微调如何改进模型预测。随后讨论了如何将\
  \ `RLHF` 融入微调以及使用 `RLHF` 的可能可行方案。这里还讨论了使用微调评估指标的一些注意事项和挑战，以及 `RLHF` 如何弥补这些不足。在下一章中，我们将讨论与参数高效微调相关的具体微调技术。\n\
  \n### 参考文献\n\n以下是本章使用的参考资料链接。\n\n*   \\[1706.03762\\] 注意力就是你所需要的一切 (arxiv.org)\n\
  \n*   [`mng.bz/M96o`](https://mng.bz/M96o)\n"
- "## 第 6 章：参数高效微调\n\n## 加入我们的 Discord 图书社区\n\n![中间带方块的二维码，描述自动生成](img/file0.png)\n\
  \n[`packt.link/EarlyAccessCommunity`](https://packt.link/EarlyAccessCommunity)\n\
  \n在上一章中，我们介绍了 Transformer 模型的编码器-解码器架构，以及如何使用 `transformers` 库和预训练模型在特定数据集上进行微调。在这里，我们将进一步讨论参数高效微调的方法，介绍\
  \ Transformer 强化学习（`TRL`）库以解释监督微调（`SFT`）过程，详细讨论各种技术，如用于微调的低秩适配器、参数高效微调（`PEFT`）模型的评估以及工作流程。微调大型预训练模型涉及更新模型权重，以优化其执行特定任务的策略。需要更新的参数数量庞大，使得微调过程计算成本高昂。在本章中，您将学习如何通过仅更新必要参数来高效地微调模型，从而节省大量成本。从实际角度来看，这使得本章非常重要。本章将涵盖以下主题：\n\
  \n*   参数高效微调简介\n\n*   使用 Hugging Face `TRL` 库应用监督微调流程\n\n*   理解低秩适应（`LoRA`）技术\n\n\
  *   评估 `PEFT` 模型\n\n*   微调与评估工作流\n\n### 技术要求\n\n\n\n\n## 章节设置\n\n对于本章，我们将所有与实现相关的依赖项保持在最小范围内。所有实现均使用\
  \ `python`。具体的版本推荐以及需要安装的最小必需库如下：\n\n*   `Python` 版本 >= 3.9\n*   `numpy` == 1.26.4\n\
  *   `matplotlib` == 3.8.4\n*   `transformers` == 4.42.4\n*   `datasets` == 3.0.1\n\
  *   `ipython` == 8.27.0\n*   `ipywidgets` == 8.1.5\n\n除了上述库和安装之外，我们还将使用 `Google\
  \ Colab` 进行基于 GPU 的微调（稍后详述）。要开始，请克隆此 `git` 仓库：[`github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback`](https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback)，并将目录切换到\
  \ `chapter 6`。\n\n# 参数高效微调简介\n\n在微调中，预训练模型（如大型 Transformer）会在一个小型的、特定任务的数据集上进一步训练。在特定数据集上的额外训练使模型能够学习任务细节并融合数据集中的新知识。在上一章中，我们演示了将\
  \ `distilbert-base-uncased` 模型微调到 `imdb` 数据集。与当代模型（数十亿量级参数）相比，该模型相对较小（6600 万参数），并允许在小型数据集上进行演示。传统微调通过在特定任务的较小数据集上训练，节省了大量训练成本。但它通常仍需要更新大量参数，这在计算上昂贵且内存密集。为了解决这个问题，一类称为\
  \ `参数高效微调` (`PEFT`) 的微调技术已成为常见做法。`PEFT` 策略的目标是减少需要微调的参数数量，这可以通过多种方法实现。大体上，我们可以将它们分类如下：\n\
  \n## 加法微调方法\n\n在这一子类微调中，原始预训练模型参数被冻结，而是增加参数并进行训练。这从根本上改变了模型的结构。这些方法可以使用 `适配器`——与预训练模型增强的小型神经网络。这显著减少了需要调整的参数数量。\n\
  \n## 基于提示的方法\n\n其中最著名的是 `提示调优`——这种方法不是直接修改模型，而是学习一组输入提示，帮助调节模型输出。这些提示对于实际用途足够简短，且无需更改模型架构即可捕获期望行为。这些方法使用可训练的嵌入，将其添加到输入的前面或后面，并引导模型输出，而预训练模型权重保持不变。这种方法在小数据设置和模型规模下显示出希望，但对于更大的模型存在边际效应递减。\n\
  \n## 基于规范的方法\n\n这些方法涉及指定用于调优的模型参数，无论是启发式地（随机或手动）还是通过学习它们。虽然这些方法已应用于研究项目，但它们在大语言模型适应的实践中并未显示出太大希望。\n\
  \n## 基于重参数化的方法\n\n这种方法基于这样一个前提：预训练模型参数可以通过低秩表示来适应特定任务。这种向低维空间的压缩可以是一种优化，从而降低计算成本。`低秩适应`\
  \ (`LoRA`) 将低秩矩阵引入模型架构，仅在训练期间更新这些矩阵。这显著减少了可训练参数的数量，并能有效适应训练数据集。在 `LoRA` 中，权重更新涉及将模型参数分解为低秩矩阵。仅训练这些矩阵为预训练模型提供了高效的适应机制，相比之下，全量微调需要更新所有权重。\n\
  \n在这些方法中，`LoRA` 是最先进的技术，常被用作研究论文中的基准技术进行比较。因此，我们将在本章中更深入地关注这一技术。在介绍该技术之前，我们将首先探讨监督微调过程，该过程专门用于语言模型的微调。\n\
  \n# 使用 Hugging Face TRL 库应用监督微调流程\n\n使用我们在第 5 章演示的标准微调可能会变得更加复杂，因为我们需要做出多个训练选择。`transformers`\
  \ 库允许灵活地做出这些选择，但代价是更长的开发时间和实验。它还需要多种定制和开发来集成实现 `RLHF` 所需的方法。为了应对这些挑战，`trl` 库致力于提供工具和技术，帮助模型后训练过程的开发。模块化架构也有助于扩展到各种硬件设置。\n\
  \n`监督微调` (`SFT`) 方法是 `trl` 库中的一种模式，它类似于标准微调，因为它是 `transformers` 库 `Trainer` 类的封装器，两者都涉及将预训练模型适应特定任务。它们的主要区别在于\
  \ `SFT` 专门为微调 `大语言模型` (`LLMs`) 而设计，并提供工具和功能，便利在带有提示-响应对的标记数据集上进行训练，专为对话任务量身定制，并允许进一步的模型规范和初始化。相反，`transformers`\
  \ 中的通用微调功能虽然对更广泛的任务更灵活，但当用于 `LLM` 特定应用时，尤其是对话用例，可能需要额外的数据集格式化和定制。\n\n`SFT` 提供提示工程和数据集格式化等功能，并很大程度上依赖训练数据中的提示-响应对。这使模型能够学习根据特定提示和格式生成输出和响应。`trl`\
  \ 提供了专门的 `SFTTrainer` 类，通过数据集处理和 `LLM` 评估指标等功能简化了监督微调过程。在本节中，我们将使用 `trl` 库中的 `SFTTrainer`\
  \ 和 `SFTConfig` 来微调模型，以替代我们在上一章使用的 `transformers` 库中的 `TrainingArguments` 和 `Trainer`。`SFTConfig`\
  \ 有助于配置微调过程的各个方面，并有助于设置奖励模型和其他特定于基于强化学习的微调设置中的 `SFT` 参数。\n\n## 模型选择\n\n`SFTTrainer`\
  \ 是为因果语言建模开发的专用类。这些模型根据给定的单词或标记输入预测下一个单词。一些应用包括文本补全、自动纠错和代码生成。这些模型与我们在上一章讨论的掩码语言模型（如\
  \ `BERT` (`用于 Transformers 的双向编码器表示`) 和 `distilBERT` (`BERT 的蒸馏版本`)）本质上不同。由于架构差异，`SFTTrainer`\
  \ 适用于因果语言建模，特别是 `GPT` 系列等大语言模型。对于掩码模型，应使用 `transformers` 库。\n\n### 使用 SFT Trainer\
  \ 进行微调\n\n`SFTTrainer` 微调因果模型，您可以通过浏览本节中的代码片段来了解这一点。由于 `SFTTrainer` 可用于微调参数量级在数百万到数十亿级别的合理大模型，不使用\
  \ `PEFT` 的 `SFT` 可能很昂贵。因此必须小心，不要让模型无限期运行。一个简单的微调过程可能如下所示。首先在 `Colab` 笔记本中安装所需库：\n\
  \n\n\n\n\n# 使用 TRL 和 PEFT 进行微调\n\n## 安装\n\n```bash\n! pip install transformers datasets\
  \ trl torch\n```\n\n按如下方式导入所需库。请注意，我们使用了来自 transformers 库的一些类，例如 `AutoTokenizer`\
  \ 和 `AutoModelForSequenceClassification`。这些有助于保持相同的工作流。除了这些之外，我们还使用了来自 TRL 库的 `SFTTrainer`\
  \ 和 `SFTConfig` 类。\n\n```python\nimport numpy as np\nfrom datasets import load_dataset\n\
  from transformers import AutoTokenizer, AutoModelForSequenceClassification\nfrom\
  \ sklearn.metrics import accuracy_score, f1_score\nfrom trl import SFTTrainer, SFTConfig\n\
  ```\n\n## 加载数据集\n\n加载示例训练和测试数据集。在实际应用中，这些将是大型数据集，但为了演示目的，我们仅加载少量样本。\n\n```python\n\
  train_dataset = load_dataset(\"imdb\", split=\"train[:4%]\")\neval_dataset = load_dataset(\"\
  imdb\", split=\"train[4%:5%]\")\nprint(f\"Train Data:{train_dataset}\")\nprint(f\"\
  Eval Data:{eval_dataset}\")\n```\n\n## 评估函数\n\n我们将使用一个自定义评估函数，该函数可以传递给 `SFTTrainer`。`accuracy_score`\
  \ 和 `f1_score` 指标从 sklearn 库导入。\n\n```python\n# 评估函数\ndef compute_metrics(pred):\n\
  \    logits, labels = pred\n    predictions = np.argmax(logits, axis=-1)\n    accuracy\
  \ = accuracy_score(labels, predictions)\n    f1 = f1_score(labels, predictions,\
  \ average=\"weighted\")\n    return {\"accuracy\": accuracy, \"f1\": f1}\n```\n\n\
  ## 使用 SFTTrainer 进行训练\n\n`SFTTrainer` 和 `SFTConfig` 可以按如下方式实现。这涉及准备配置并将其传递给训练器。请注意，我们使用特定模型进行微调——`facebook/opt-350m`。这是由\
  \ Meta（前身为 Facebook）开发的模型，属于 OPT（开放预训练 Transformer）系列。它是一个语言模型，旨在展示在各种自然语言处理（NLP）任务中的高性能能力，如文本生成、补全、摘要和翻译，以及情感分析。这是一个适合实验的好模型，因为它是参数量为\
  \ 3.5 亿的较小模型之一，但对 NLP 任务很有用。\n\n```python\ntraining_args = SFTConfig(\n    max_seq_length=512,\n\
  \    output_dir=\"/tmp\",\n    report_to='none'\n)\ntrainer = SFTTrainer(\n    \"\
  facebook/opt-350m\",\n    train_dataset=train_dataset,\n    eval_dataset=eval_dataset,\n\
  \    args=training_args,\n    compute_metrics=compute_metrics\n)\ntrainer.train()\n\
  ```\n\n## 微调后的评估\n\n训练完成后，可以使用训练器的 `evaluate` 方法对微调后的模型进行评估。\n\n```python\n# 微调后的评估\n\
  fine_tuned_results = trainer.evaluate()\nprint(\"Results after Fine-Tuning:\", fine_tuned_results)\n\
  ```\n\n要尝试 SFT 训练过程，您可以参考本书 GitHub 链接上该章节对应的笔记本。您现在应该意识到，微调过程通过 TRL 库得到了显著简化。您可以尝试其他因果模型或\
  \ GPT 模型，但请注意 `facebook/opt-350m` 相对较少消耗资源，完成微调可能需要更多资源。在下一节中，我们将探讨如何利用最先进的技术——低秩适应（LoRA），更高效地进行微调，并将其应用于\
  \ `gpt-2` 的微调——这是一个常用于研究、开发和实验的模型。\n\n## 低秩适应（LoRA）技术\n\n低秩适应（LoRA）技术的基本思想是仅微调与引导输出使其更接近用于微调的定义数据集相关的少量模型权重，而不是训练整组模型权重。训练参数的这种减少导致内存需求和总训练成本的降低。这少量的模型权重是模型权重更新的一种分解。我们讨论的典型模型微调参数量级为数百万到数十亿。使用\
  \ LoRA，权重矩阵被分解为低秩矩阵，并且仅训练这些低秩矩阵。让我们将 `W` 视为微调后模型的权重，将 `W` 视为需要微调的预训练模型的权重。应用于权重矩阵的更新可以是。在这里，LoRA\
  \ 引入了两个低秩矩阵 `A` 和 `B`，其中秩远小于原始矩阵。\n\n### 使用 PEFT 库实现 LoRA\n\n我们将首先展示如何使用 HuggingFace\
  \ 参数高效微调库中的方法来实现 LoRA。该库允许我们通过首先创建一个低秩适配器来微调模型。为了应用 LoRA，我们首先安装所有必需的库。请注意，我们在之前的安装基础上添加了\
  \ peft。\n\n```bash\n! pip install transformers datasets trl torch peft\n```\n\n\
  从 transformers 库导入一些方法，因为它们可以原样用于实现微调。这有助于直接用参数高效方法增强微调。来自 transformers 库的类直接用于管道开发的各个部分。例如，`AutoTokenizer`\
  \ 类根据模型标识符自动加载分词器。指定预训练模型有助于将文本数据转换为模型可处理的格式。这也确保了训练和推理之间的一致性。同样，`AutoModelForCausalLM`\
  \ 类加载用于因果语言建模任务的预训练语言模型，这对于预测序列中的下一个 token 是必要的，使其立即适用于通常涉及文本生成的 GPT 等自回归模型。一旦指定模型标识符，相应的预训练模型就会被加载。使用来自\
  \ transformers 库的 `TrainingArguments` 和 `Trainer` 类并结合 PEFT 库特定的类进行增强，有助于未来功能的可扩展性。这样做的主要原因是\
  \ transformers 库是核心库，几个其他应用程序和库将继续在其基础上开发。使用来自 transformers 的类使得与这些其他应用程序以及 PEFT\
  \ 的集成更有可能兼容。`TrainingArguments` 类可用于配置更基本的训练参数，如学习率、批次大小、轮数和日志记录详情。实例化 `TrainingArguments`\
  \ 以通过设置优化器参数、评估步数、梯度累积来定义训练循环应如何行为，并从 PEFT 库导入类以设置特定于这些配置的参数。以下片段显示了必需的导入类。\n\n\
  ```python\nfrom transformers import AutoTokenizer, AutoModelForCausalLM, TrainingArguments,\
  \ Trainer\nfrom datasets import Dataset\nfrom peft import get_peft_model, LoraConfig,\
  \ TaskType\n```\n\npeft 库是 HuggingFace 生态系统中相对较新的库，专门设计用于使大语言模型的微调过程更加参数高效。它结合了\
  \ LoRA（低秩适应）等方法，以更节省资源的方式修改模型。它拥有 `get_peft_model` 函数等方法，该函数用于将参数高效微调技术（如 LoRA）应用于模型。用户只需将预训练模型传递给此函数，以及相关的微调技术和相应的配置参数，它就会应用指定的微调技术，返回修改后的模型。在这种情况下，LoRA\
  \ 的配置参数可以使用 `LoraConfig` 类指定。使用 `LoraConfig`，您可以定义如何将 LoRA 应用于模型的具体细节。这些可以是秩大小、应用层和目标模块。在下面的示例中，\n\
  \n```python\nlora_config = LoraConfig(r=16, lora_alpha=32, target_modules=[\"attn.query\"\
  , \"attn.value\"])\n```\n\n\n\n\n# 使用 PEFT 库通过 LoRA 进行微调\n\n参数 `r` 控制低秩近似的秩，`lora_alpha`\
  \ 控制更新的缩放。微调可应用于各种任务，`TaskType` 类有助于定义模型要适配的任务类型（例如文本生成或分类）。因此，它使模型架构和微调过程与指定的目标任务保持一致。这可以简单地应用为：`task_type\
  \ = TaskType.CAUSAL_LM`。\n\n实现 LoRA 微调涉及以下步骤：\n\n## 1. 加载预训练模型和分词器\n\n指定要微调的预训练模型（例如\
  \ `gpt2`），具体取决于使用场景。将模型名称传递给分词器和用于因果语言建模的自动模型，并设置分词器的填充符。\n\n```\nmodel_name = \"\
  gpt2\"\ntokenizer = AutoTokenizer.from_pretrained(model_name)\ntokenizer.pad_token\
  \ = tokenizer.eos_token\nmodel = AutoModelForCausalLM.from_pretrained(model_name)\n\
  ```\n\n## 2. 定义 PEFT 配置 (LoRA)\n\n然后，定义 LoRA 的 PEFT 配置。配置可以包括任务类型、LoRA 矩阵的秩、LoRA\
  \ 的 alpha 和 dropout，以及要插入 LoRA 的目标模块。\n\n```\npeft_config = LoraConfig(\n    task_type=TaskType.CAUSAL_LM,\n\
  \    r=8,          # LoRA 矩阵的秩\n    lora_alpha=32,\n    lora_dropout=0.1,\n    target_modules=[\"\
  c_attn\"],  # 已针对 GPT-2 调整\n)\n```\n\n然后，将配置和要应用 LoRA 的模型传递进去。\n\n```\nmodel = get_peft_model(model,\
  \ peft_config)\n```\n\n## 3. 准备自定义数据集\n\n模型配置和结构完成后，准备一个自定义数据集，或使用开源数据集之一。这里我们将使用自定义数据集，并将字典传递给\
  \ `Dataset` 类的方法。\n\n```\ndata = {\"text\": [\"I love AI because\", \"ChatGPT helps\
  \ with\", \"AI will revolutionize\"]}\ndataset = Dataset.from_dict(data)\n```\n\n\
  我们可以编写一个分词函数来指定填充并添加标签用于损失计算。`tokenize_function` 将数据集文本映射为作为令牌的数字和作为标签的相应 ID。\n\n\
  ```\ndef tokenize_function(example):\n    tokenized = tokenizer(example[\"text\"\
  ], padding=\"max_length\", truncation=True, max_length=32)\n    tokenized[\"labels\"\
  ] = tokenized[\"input_ids\"].copy()\n    return tokenized\n```\n\n要执行此映射，使用数据集的\
  \ `map` 方法。\n\n```\ntokenized_dataset = dataset.map(tokenize_function, batched=True)\n\
  ```\n\n## 4. 定义训练参数\n\n同时，连同分词后的数据集，我们可以配置训练参数。在这里，我们可以定义输出目录、训练批次大小、训练轮数、日志记录和保存策略。训练参数如用于训练速度和准确性的学习率、用于内存优化的混合精度设置（例如\
  \ `fp16`）也可以在此设置。`report_to` 配置通常用于指定是否要使用实验框架（如 Weights and Biases）绘制数据或记录数据以进行分析。在下面的代码片段中，我们仅使用\
  \ `'none'`。\n\n```\ntraining_args = TrainingArguments(\n    output_dir=\"./results\"\
  ,\n    per_device_train_batch_size=2,\n    num_train_epochs=3,\n    logging_dir=\"\
  ./logs\",\n    save_strategy=\"no\", \n    learning_rate=2e-4,\n    fp16=True,\n\
  \    report_to='none',\n)\n```\n\n## 5. 微调模型\n\n定义并设置好所有配置和模型后，我们可以将它们传递给 `Trainer`\
  \ 方法并训练模型。\n\n```\ntrainer = Trainer(\n    model=model,\n    args=training_args,\n\
  \    train_dataset=tokenized_dataset,\n)\ntrainer.train()\n```\n\n训练完成后，你就得到了微调后的预训练模型。你现在了解了如何使用\
  \ PEFT 库微调预训练模型。关于详细实现，可以查看 GitHub 仓库中的笔记本。使用 TRL 库进行高效微调的另一种方法是使用 SFT Trainer，我们将在接下来继续探索。\n\
  \n# 使用 SFT Trainer 实现 LoRA\n\n既然我们知道了如何使用 PEFT 库并应用 LoRA 进行微调，我们将讨论如何使用 SFT Trainer\
  \ 应用 LoRA，因为这也是它将与基于 RLHF 的微调集成的方式。SFT Trainer 也依赖 PEFT 库将 PEFT 配置集成到训练中。在之前关于**使用\
  \ Hugging Face TRL 库的监督微调流程**一节中，我们使用了 `training_args` 并将其传递给 SFT Trainer。使用 PEFT\
  \ 和 LoRA 也包括将 `peft_config` 传递给 SFT Trainer。直接使用 PEFT 库时，我们通过 PEFT 的 `get_peft_model`\
  \ 方法获取增强模型。但使用 SFT Trainer 进行 LoRA 微调时，不需要执行此步骤。我们直接将 `peft_config` 传递给 SFT Trainer。使用的模型是从\
  \ `AutoModelForCausalLM.from_pretrained(model_name)` 检索的预训练模型。下面给出一个代码片段示例。\n\n\
  ```\nfrom trl import SFTConfig, SFTTrainer\ntrainer = SFTTrainer(\n    model,\n\
  \    train_dataset=tokenized_dataset2,\n    args=SFTConfig(output_dir=\"/tmp\",\
  \ report_to='none'),\n    peft_config=peft_config,\n)\ntrainer.train()\n```\n\n\
  此时，你已经知道如何使用 SFT 进行微调，以及如何使用 SFT 应用 LoRA 并训练（微调）预训练模型，此外还了解了使用 PEFT 库的方法。微调模型后，有必要对模型进行评估，一旦获得令人满意的模型响应，就可以进行推理了。我们将在接下来讨论这一点。\n\
  \n# 推理与评估 PEFT 模型\n\n训练后，使用 `eval` 方法可以评估训练好的模型。使用一些 `input_text` 进行测试，使用分词器函数对其进行分词。注意，如果未设置注意力掩码和填充符\
  \ ID，可能会收到警告。推理时需要显式提供 `attention_mask` 以及输入 ID。此外，文本生成时应显式设置 `pad_token_id`。\n\n\
  ```\nmodel.eval()\ninput_text = \"AI is transforming\"\ninputs = tokenizer(input_text,\
  \ return_tensors=\"pt\", padding=True).to(\"cuda\")\noutput = model.generate(\n\
  \    inputs[\"input_ids\"],\n    attention_mask=inputs[\"attention_mask\"], \n \
  \   max_length=50,\n    num_return_sequences=1,\n    pad_token_id=tokenizer.eos_token_id\n\
  )\nprint(tokenizer.decode(output[0], skip_special_tokens=True))\n```\n\n用户的一个练习可以是在第\
  \ 3 步中使用两个数据集，重复步骤 4 和 5，使用这两个数据集进行微调，并比较模型生成结果。这两个数据集的数据应有显著差异，使得第一个数据集更通用，第二个数据集更特定于领域。这里有一个展示示例数据集的例子。请注意，你需要生成的句子数要比这些示例中使用的句子数多。\n\
  \n## 数据集 1 (通用)\n\n```\ndata_1 = {\n    \"text\": [\n        \"Artificial intelligence\
  \ is revolutionizing many industries by automating tasks and improving decision-making.\"\
  ,\n        \"Machine learning models are used in applications like predictive analytics\
  \ and natural language processing.\",\n        \"AI can assist in various sectors\
  \ such as healthcare, finance, and transportation by analyzing large datasets.\"\
  ,\n        \"Deep learning techniques are powering advancements in computer vision,\
  \ enabling machines to interpret images and video.\",\n        \"AI technologies\
  \ like robotics are being deployed to perform tasks that were once considered too\
  \ complex for machines.\"\n    ]\n}\n```\n\n## 数据集 2 (领域特定)\n\n\n\n\n# 第 6 章：参数高效微调\n\
  \n## 示例数据\n\n```json\ndata_2 = {\n    \"text\": [\n        \"AI is transforming\
  \ oncology by helping in the early detection of cancer through advanced imaging\
  \ techniques.\",\n        \"Machine learning algorithms are increasingly used to\
  \ analyze tumor biopsies and predict cancer progression.\",\n        \"In precision\
  \ oncology, AI is utilized to create personalized treatment plans based on a patient's\
  \ genetic profile.\",\n        \"AI-driven systems are improving the accuracy of\
  \ radiology by identifying tumors in medical scans like CT and MRI images.\",\n\
  \        \"Artificial intelligence is accelerating drug discovery, identifying potential\
  \ cancer therapies faster than traditional methods.\"\n    ]\n}\n```\n\n## 模型生成参数\n\
  \n对比输出后，你会注意到针对特定领域数据集微调的模型，其输出是如何被修改的。模型生成和推理涉及大量使用额外参数设置的实验。例如，我们添加 `temperature`\
  \ 参数来调整温度以控制随机性（值越低随机性越小）。同样，`top_p` 是一个增加多样但聚焦输出的参数。`top_k` 参数设置选项池的采样限制以获得更好的质量。`no_repeat_ngram_size`\
  \ 防止重复 n-gram，否则会观察到单词重复，而 `do_sample` 设置用于启用更具创造性的回答。此外，请注意，我们现在不再像之前的模型生成那样只输出第一个生成的响应（`output[0]`），而是返回枚举的输出，这等同于设置\
  \ `num_return_sequences`。\n\n## 模型生成代码\n\n```python\nmodel.eval()\ninput_text =\
  \ \"AI in oncology\"\ninputs = tokenizer(input_text, return_tensors=\"pt\", padding=True).to(\"\
  cuda\")\n# 显式设置 pad_token_id\n# 设置参数以影响生成质量\noutput = model.generate(\n    inputs[\"\
  input_ids\"],\n    attention_mask=inputs[\"attention_mask\"], \n    max_length=100,\
  \ \n    num_return_sequences=2, \n    pad_token_id=tokenizer.eos_token_id, \n  \
  \  temperature=0.7, \n    top_p=0.9, \n    top_k=50,\n    no_repeat_ngram_size=2,\
  \ \n    do_sample=True, \n)\nprint(\"Generated Responses:\")\nfor i, generated_sequence\
  \ in enumerate(output):\n    print(f\"Option {i+1}: {tokenizer.decode(generated_sequence,\
  \ skip_special_tokens=True)}\\n\")\n```\n\n## LoRA 配置\n\n除了模型生成设置实验，用户还可以通过更改 LoRA\
  \ 参数来训练多个微调模型，从而进行训练实验：\n\n```python\nr=8,         \nlora_alpha=32,\nlora_dropout=0.1,\n\
  target_modules=[\"c_attn\"]\n```\n\n请注意，`r` 的较高值意味着更强的模型表达能力，但计算效率较低。缩放因子 `lora_alpha`\
  \ 决定了模型适应微调中使用的特定任务数据的程度。`lora_dropout` 值决定了训练期间将丢弃的低秩参数的百分比。这有助于提高泛化能力，并防止模型过度依赖使用低秩矩阵学到的特定模式。`target_modules`\
  \ 指定模型的哪些部分将使用 LoRA 进行适应。通过指定 `c_attn`，我们指定 LoRA 将低秩适应集中在模型的注意力机制上。这很好，因为注意力层帮助模型理解文本序列中的依赖关系。\n\
  \n## 模型评估指标\n\n除了使用模型推理进行人工评估外，为了在生产环境中部署微调模型，必须使用定性和定量指标对其进行彻底评估。预训练基础模型的微调通常基于模型需要服务的任务，例如模型补全、文本生成、情感分析或摘要。为了评估微调模型，可以根据微调使用的数据集准备评估数据集。然后可以使用这些数据集根据与任务相关的指标测试模型输出。例如，摘要等任务可以使用召回率等指标进行评估——该指标表示从模型输出中检索或生成的相关结果数量与微调数据集中可用的相关结果总数之比，以及精确率——微调数据集中正确可用的相关输出\
  \ n-gram 的数量。这些指标可以在著名指标 `Recall-Oriented Understudy for Gisting Evaluation` (`ROUGE`)\
  \ 的变体中捕获。例如，`ROUGE-n` 是一个指标，表示微调使用的数据集中可用的 n-gram 数量与生成输出中的 n-gram 数量之间的重叠数量。`ROUGE-1`\
  \ 用于涉及单词重叠测量的 unigram 重叠，`ROUGE-2` 用于测量两两单词重叠的 bi-gram 重叠，有时也会使用。这些统计指标只能捕获输出的部分质量，例如，虽然\
  \ `ROUGE` 捕获重叠，但它不捕获生成输出的流畅度。这些指标也不捕获偏见或其他重要指标。因此，除了统计指标外，我们还依赖基于模型的指标，其中 `LLM`\
  \ 模型可以自我评判，或由更高级的 `LLM` 根据所有必需标准评判输出。本章的重点主要在于降低模型更新成本和提高训练效率，同时保持任务推理的性能。参数高效微调、监督微调或\
  \ `RLHF` 的模型评估过程将是相似的。我们将推迟这一话题，并在 *第 11 章* 中详细讨论。\n\n### 总结\n\n在本章中，我们讨论了微调的挑战，以及随着预训练模型变得越来越大，特别是大型基础模型，微调如何变得密集占用内存。为了解决这个问题，向你介绍了\
  \ `PEFT`，并指导你如何使用 `HuggingFace` 的 `PEFT` 库动手应用它。在本章中，你学习了各种微调方法，以及它们的优势和开销。熟悉 `TRL`\
  \ 库中的 `Supervised Fine-Tuning` 方法如何像本章讨论的那样集成 `PEFT`，将有助于后续章节，因为我们可以集成它们来自 `TRL`\
  \ 的 `RLHF`，并且总体上对任何基于微调的方法都很有用。同样，在学习完本章后，你应该对主要的 `PEFT` 技术之一 `Low Rank Adapter\
  \ (LoRA)` 有更好的理解，以及如何通过完成流程的所有步骤将其应用于实际问题。我们还介绍了如何推理微调模型以完成文本补全和生成等任务，这将为你构建微调管道提供良好的起点。在下一章中，我们将开始讨论如何基于人类偏好数据开发奖励模型，以帮助提供奖励信号来调整和对齐模型以符合人类偏好。\n\
  \n### 参考资料\n\n参数高效微调库与文档：\n\n*   [`https://github.com/huggingface/peft`](https://github.com/huggingface/peft)\n\
  *   [`https://huggingface.co/docs/peft/main/en/index`](https://huggingface.co/docs/peft/main/en/index)\n\
  *   `SFT Trainer`\n*   [`https://huggingface.co/docs/trl/sft_trainer`](https://huggingface.co/docs/trl/sft_trainer)\n"
- "## 第 7 章：语言模型调优的奖励建模\n\n### 加入我们的 Discord 图书社区\n\n![A qr code with a square in\
  \ the middle Description automatically generated](img/file0.png)\n\n[`https://packt.link/EarlyAccessCommunity`](https://packt.link/EarlyAccessCommunity)\n\
  \n\n\n\n\n# 语言奖励建模\n\n## 简介\n\n在上一章中，我们介绍了**参数高效微调**（**PEFT**）技术，例如**低秩适应（LoRA）**，并演示了如何使用\
  \ `trl` 库通过**监督微调**（**SFT**）高效地**微调（FT）**大语言模型（LLM）。虽然微调有助于将预训练模型与特定数据集或下游任务对齐，但它往往难以将模型的行为与细微的**人类偏好**对齐。因此，SFT\
  \ 通常被视为**基于人类反馈的强化学习（RLHF）**流程中的**第一阶段**。为了弥合任务性能与人类对齐行为之间的差距，RLHF 在 SFT 之外引入了两个关键阶段：**奖励建模**——基于人类偏好学习奖励函数。**策略优化**——利用奖励模型通过强化学习微调模型。本章重点关注其中的第一个阶段：**奖励建模过程**。我们将探讨如何收集人类偏好，如何利用它们训练奖励模型，以及该模型如何实现语言模型输出与人类期望的更好对齐，并讨论构建奖励模型所需的步骤。\n\
  \n### 关键主题\n\n* 语言奖励建模简介\n* 数据预处理与偏好数据收集\n* 探索奖励建模技术\n* 模型评估与迭代\n\n### 技术要求\n\n\
  本章将所有实现相关的依赖项保持在最低限度。所有实现均基于 `Python`。具体版本建议及所需安装的最低库如下：\n\n* `Python` 版本 >= 3.9\n\
  * `numpy` == 1.26.4\n* `matplotlib` == 3.8.4\n* `transformers` == 4.42.4\n* `datasets`\
  \ == 3.0.1\n* `ipython` == 8.27.0\n* `ipywidgets` == 8.1.5\n\n除了上述库和安装外，我们还将使用 **Google\
  \ Colab** 进行基于 GPU 的微调，并在笔记本中安装 `TRL` 库。要开始操作，请克隆此 Git 仓库：[`github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback`](https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback)，并将目录切换到\
  \ `chapter 7`。\n\n## 语言奖励建模概述\n\n\n\n\n# 大语言模型与奖励建模\n\n## 预训练与幻觉\n\n大语言模型（LLM）通常使用监督学习目标（如\
  \ `cross-entropy loss`）在大规模语料库上进行预训练，这优化了模型以准确预测下一个 token。这种预训练使生成流畅且句法正确，但无法保证输出在事实上准确、有用或与用户意图一致。这种脱节常导致\
  \ `hallucination`（幻觉）等现象，即模型生成听起来自信但错误、无用或误导性的信息。\n\n## 监督微调的局限性\n\n为解决此类缺陷，通常采用\
  \ `SFT`（监督微调）将模型适配到特定任务数据集。虽然 `SFT` 提高了任务相关性并减少了一些不良行为，但它仍受限于训练数据的静态性质，且未融入主观的人类偏好。例如，给定两个看似合理的回复，`SFT`\
  \ 无法提供机制来指示哪个更有用或更符合人类价值观。\n\n## RLHF 中的奖励建模\n\n`Reward modeling (RM)`（奖励建模）通过学习一个基于人类反馈将模型输出映射为标量奖励值的函数，解决了这一局限。最常见的方法是收集比较数据，标注员评估针对同一提示词的模型回复对，并选择偏好的那个。这些比较用于训练奖励模型，使其能将人类偏好泛化到未见过的输出。\n\
  \n## 奖励模型与 RL 智能体的顺序训练\n\n在 `RLHF` 背景下，`RM` 作为替代目标函数指导策略优化。通常，`reward model`（`RM`）和\
  \ `reinforcement learning`（`RL`）智能体 `not trained simultaneously`（不是同时训练），而是按顺序训练。首先，`RM`\
  \ 在人类偏好数据上训练——通常以输出比较或评分的形式。然后，这个固定的 `RM` 在 `RL` 过程中用于提供奖励信号。尽管在实验环境中偶尔会探索在线 `RM`\
  \ 更新，但这很少见，且需要谨慎处理以维持训练稳定性。`RLHF` 流水线的模块化、顺序结构仍是一种实用且广泛采用的方法，因为它便于维护、调试和对奖励模型进行独立迭代。\n\
  \n## 新兴的在线奖励建模方法\n\n固定 `RM` 实践的新兴例外包括 `Online Iterative RLHF` 等系统：`https://arxiv.org/pdf/2405.07863`，它们采用真正的在线奖励建模：`RM`\
  \ 在策略优化 `during`（期间）使用来自新采样轨迹的代理人类反馈（如 `GPT-4` 标注）进行细化。混合方法，如 `HIRE`（混合内在奖励：`https://arxiv.org/html/2501.12627v1`）或\
  \ `RTV-GenRM`：`https://arxiv.org/html/2503.22230v1`，将静态基于偏好的奖励与动态组件（如好奇心驱动的探索或推理验证器）相结合，以平衡对齐性和适应性。虽然这些先进方法显示出前景，但由于简单性、可扩展性和可接受的资源可行性，顺序工作流在生产系统中仍占主导地位。\n\
  \n## 基于偏好的奖励建模\n\n基于偏好的 `RM` 是语言模型 `RLHF` 中的主流方法，特别是由于语言生成的开放性，可能存在多个有效输出。在这种情况下，人类的直接比较或标量评分比基于演示的方法（如\
  \ `imitation learning`（模仿学习）、`behavioral cloning`（行为克隆）或 `inverse reinforcement\
  \ learning`（逆强化学习））更有效地消除歧义。这些替代方法侧重于模仿人类行为或从演示中推断奖励函数，但不太适合涉及细微判断的主观任务。\n\n## 奖励建模流程\n\
  \n奖励建模过程通常包含三个阶段：(1) `Data Collection`（数据收集）——组装输入-输出对并用人类偏好信号标注，如二元比较（例如接受 vs 拒绝回复）或数值评分；(2)\
  \ `Data Preprocessing`（数据预处理）——构建、清洗和验证数据集以确保质量和一致性；(3) `Model Training and Evaluation`（模型训练与评估）——训练神经网络从输入-输出对预测奖励值，并在基准数据集上评估其性能。\n\
  \n## 自定义与标准化实现\n\nLLM 微调的奖励建模可使用自定义流水线或预构建库实现。在 `Chapter 3` 中，我们探讨了如何在 `PyTorch`\
  \ 中构建奖励模型并将其集成到 `RL` 设置中，用于网格世界导航等任务。在 `Chapter 4` 中，我们实现了自定义 `PPO` 算法用于策略训练。虽然这种自定义实现提供了透明度和灵活性，但也带来了显著的维护开销，特别是考虑到模型架构和基础设施的快速更新步伐。\n\
  \n## Hugging Face TRL 库\n\n为缓解这些挑战，`Hugging Face` 的 `TRL` 等标准化库为 `RLHF` 工作流提供了集成支持。`TRL`\
  \ 便于使用预训练 Transformer 模型（如 `GPT`、`T5`、`BERT`），支持奖励建模，并提供开箱即用的策略优化方法实现，如 `proximal\
  \ policy optimization`（`PPO`，近端策略优化）。它还支持尝试较新的方法，如 `Direct Preference Optimization`（`DPO`，直接偏好优化）。\n\
  \n## 标准化 RLHF 技术栈的优势\n\n对于大多数实际用例，采用标准化 `RLHF` 技术栈的优势——更快的开发、更好的可扩展性和长期可维护性——通常超过构建和维护自定义奖励建模基础设施的优势。在下一节中，我们将详细探讨奖励建模的第一步：偏好数据收集与预处理。\n\
  \n## 数据预处理与偏好数据收集\n\n为收集人类偏好数据，通常让众包工人进行聊天会话以与模型交互并添加偏好。这包括首先向模型提问或讨论某个话题以引发对话，收到模型回复后，对模型输出进行评分或分配偏好分数。这是一个昂贵的过程，需要人工工人执行这些任务。\n\
  \n反馈或偏好分数可能不准确或有偏见，且完全基于众包工人。因此，众包工人的筛选成为数据收集过程的一部分，除了数据收集本身。\n\n### 收集的原始数据\n\n\
  \n\n# 奖励建模的数据收集、预处理和分词\n\n原始数据可以采用 `json` 格式或任何其他便于预处理的形式进行收集。数据收集过程通常涉及通过带有遥测功能的用户界面，向人工标注员展示大量提示词和成对的模型响应。标注员被要求表达偏好——通过选择两个响应中较好的一个，或者同时拒绝两者。然后使用二进制标签对该偏好进行编码，例如\
  \ `1` 表示 `response_1` 更受青睐，`0` 表示 `response_2` 更受青睐。下面给出了一个原始数据示例。\n\n```\nraw_data\
  \ = [\n    {\n        \"prompt\": \"Tell me a joke.\",\n        \"response_1\":\
  \ \"Why did the chicken cross the road?\",\n        \"response_2\": \"Knock, knock!\"\
  ,\n        \"label\": 1,  # 1 means response_1 is preferred\n    },\n    {\n   \
  \     \"prompt\": \"What is AI?\",\n        \"response_1\": \"Artificial Intelligence.\"\
  ,\n        \"response_2\": \"A type of plant.\",\n        \"label\": 0,  # 0 means\
  \ response_2 is preferred\n    },\n]\n```\n\n收集到的原始数据量可能很大，通常存储在数据库中。在 `RM` 训练之前，需要访问并预处理这些数据。实践中，最好从\
  \ `git` 上的 `json/csv` 文件开始入手。如果数据更新不频繁（例如每天一次），这种方式特别合适。随着数据规模增长或预期增长，且存在频繁变更数据集和高级查询需求的场景时，`SQL`\
  \ 或 `NoSQL` 数据库更为合适。无论存储格式如何，策划高质量数据对于稳定准确的奖励建模至关重要。以下是一些有助于确保偏好数据集保持可靠的最佳实践：\n\n\
  **标注员培训**：提供清晰的标注指南和示例任务以促进一致性，有助于提高原始数据质量。\n\n**提示词多样性**：包含多种任务类型有助于避免奖励模型过拟合到狭窄领域。\n\
  \n**响应质量过滤**：如果一对响应都无信息量或过于相似，将对训练无帮助，应当过滤掉。\n\n**监控一致性**：跟踪标注员间的一致性，并根据对分歧的复查来优化提示词说明，有助于信号一致性。\n\
  \n**偏见审计**：人工数据收集可能导致系统性偏好或文化偏见，定期审查数据以检查偏见，有助于消除偏见并节省去偏见成本。\n\n**不确定性信号**：人工标注员在添加偏好标签时可能有不同的置信度，包含置信度字段可以告知训练时如何对这些标签加权。\n\
  \n**去重与变体**：应避免重复样本，并鼓励模型输出的风格多样性，使输出反映多种语气、措辞和表达风格。这在训练奖励模型时特别有用，因为人类偏好往往不仅敏感于正确性或有用性，还敏感于*如何*表达。\n\
  \n这些步骤有助于生成一个不仅忠实捕捉人类偏好，还支持稳健且可泛化的奖励建模的数据集。\n\n## 预处理数据\n\n一旦检索到原始数据——无论来自数据库还是\
  \ `JSON` 文件——我们首先必须对其进行预处理，转换为适合训练的格式。通常，我们首先将提示词-响应-标签字典的原始列表加载到 pandas `DataFrame`\
  \ 中。预处理的目标是将人类偏好标签映射为一种结构化格式，将 `accepted` 和 `rejected` 响应分离到各自的列中。这种格式不仅方便，而且对许多偏好学习设置至关重要。在某些偏好模型中，“`chosen`”或“`accepted`”和“`rejected`”是用于建模响应的不同标签，明确指示人工标注员的选择。\n\
  \n```\ndf = pd.DataFrame(raw_data)\ndef map_responses(row):\n    if row[\"label\"\
  ] == 1:\n        return {\"prompt\": row[\"prompt\"], \"accepted\": row[\"response_1\"\
  ], \"rejected\": row[\"response_2\"]}\n    else:\n        return {\"prompt\": row[\"\
  prompt\"], \"accepted\": row[\"response_2\"], \"rejected\": row[\"response_1\"]}\n\
  processed_data = df.apply(map_responses, axis=1).to_list()\ndataset = Dataset.from_list(processed_data)\n\
  ```\n\n使用 `accepted` 和 `rejected` 列构建数据具有重要目的。在许多奖励建模流程中，学习目标基于成对比较，模型被训练为给首选响应分配比被拒响应更高的奖励。这种数据格式直接与这类目标对齐。它不仅对神经奖励模型有帮助，对基于逻辑偏好建模或\
  \ Bradley-Terry 风格排序模型的评分模型也特别有用，这些模型显式依赖于清晰的首选与拒绝配对。通过以这种方式预处理数据，我们确保了与一系列奖励建模技术的兼容性，同时使监督信号显式且可解释。\n\
  \n## 数据分词\n\n在预处理数据集以明确分离每个提示词的 `accepted` 和 `rejected` 响应后，下一步是对文本进行分词，以便用于模型训练。分词涉及将每个文本输入转换为一系列\
  \ token ID，以及指示模型应关注哪些 token 的注意力掩码。我们首先选择一个基础预训练语言模型，使用其分词器。例如，我们可以使用 `BERT` 分词器模型，如\
  \ `bert-base-uncased`，通过 `HuggingFace` 中的 `AutoTokenizer` 方法。这将分词过程与模型架构绑定，以便在模型训练期间使用。可以按如下方式声明：\n\
  \n```\nmodel_name = \"bert-base-uncased\"\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
  ```\n\n对于偏好数据，我们将 `accepted` 和 `rejected` 响应与提示词一起进行分词。这使得奖励模型稍后能够区分同一提示词下的高质量和低质量输出。我们定义一个\
  \ `tokenize_function`，将分词器应用于每个批次，分别对 `accepted` 和 `rejected` 响应的提示词-响应对进行编码。\n\n\
  ```\ndef tokenize_function(batch):\n    tokenized_accepted = tokenizer(\n      \
  \  batch[\"prompt\"], batch[\"accepted\"], truncation=True, padding=\"max_length\"\
  , max_length=128\n    )\n    tokenized_rejected = tokenizer(\n        batch[\"prompt\"\
  ], batch[\"rejected\"], truncation=True, padding=\"max_length\", max_length=128\n\
  \    )\n    return {\n        \"input_ids_accepted\": tokenized_accepted[\"input_ids\"\
  ],\n        \"attention_mask_accepted\": tokenized_accepted[\"attention_mask\"],\n\
  \        \"input_ids_rejected\": tokenized_rejected[\"input_ids\"],\n        \"\
  attention_mask_rejected\": tokenized_rejected[\"attention_mask\"],\n    }\ntokenized_dataset\
  \ = dataset.map(tokenize_function, batched=True)\n```\n\n\n\n分词设置的选择会显著影响模型准确性和训练动态。例如，`Truncation`（截断）可确保长输入不超过模型的最大输入长度。然而，过度截断可能会移除重要上下文，尤其是在较长的提示词或响应中，导致奖励预测性能下降。使用\
  \ `max_length` 进行 `Padding`（填充）可使批次间的输入尺寸保持一致，这对训练效率更高，但可能导致较短序列的计算资源浪费。`Max length`（最大长度）应谨慎选择，以平衡效率与完整性。过短的限制可能截断关键信息，而过长的限制则会在没有明显性能提升的情况下增加内存使用量。分析数据集中提示词和响应长度的分布，以选择合适的\
  \ `max_length` 值，是一种良好的实践。在某些设置中，动态填充（即仅填充至批次内的最大长度）可能提供更好的性能。分词完成后，数据集即可作为奖励模型训练的输入。每个示例现在包含同一提示词的两个分词版本——一个与首选（接受）响应配对，另一个与非首选（拒绝）响应配对。这些用于训练能够给首选补全分配更高分数的模型。无论是训练神经奖励模型，还是实现更简单的偏好排序函数，这种分词结构都为计算相对质量信号提供了标准化的并行格式，这是基于偏好的学习的核心。在下一节中，我们将探讨奖励建模技术，并引入建模过程中需考虑的重要概念。\n\
  \n## 探索奖励建模技术\n\n语言建模的奖励建模主要使用基于人类偏好数据训练的监督学习模型。偏好标签可分配给完整的行为轨迹——类似于逆向强化学习（inverse\
  \ RL）——或单个输入-输出响应对。由于众包工作者是提供输出响应对偏好的人类，偏好的 *Bradley-Terry 模型* 适用于衡量一种响应优于另一种响应的结果概率。Bradley-Terry\
  \ 模型是一种概率模型，用于估计一种响应比另一种响应更受青睐的可能性。给定两个响应 r1 和 r2，该模型假设 r1 被偏好的概率由下式给出：其中 s1 和 s2\
  \ 是奖励模型分配给相应响应的标量分数。这种构想构成了 RLHF 中用于训练许多奖励模型的成对损失函数的基础。成对比较的一种替代方案是基于回归的方法，即训练模型预测标量评分（例如李克特量表评分，一个从“强烈不同意”到“强烈同意”的五点量表）。它们还要求众包工作者使用有序量表进行输入。HELPSTEER2-Preference\
  \ 论文：[`openreview.net/pdf?id=MnfHxPP5gs`](https://openreview.net/pdf?id=MnfHxPP5gs)\
  \ 对比了这两种方法，并展示了结合两者的益处。在实践中，语言微调中使用的大多数奖励模型都依赖成对偏好格式。像 TRL 这样的库通过 `RewardTrainer`\
  \ 等工具直接支持这种方法。\n\n### 使用 TRL 的 RewardTrainer 和 RewardConfig 进行奖励建模\n\nTRL 库的 `RewardTrainer`\
  \ 模块实现了这种 **成对偏好风格** 的奖励建模，通过优化奖励模型使其为首选补全分配比拒绝补全更高的分数。它从“chosen（选中）与 rejected（拒绝）”样本对训练奖励模型，鼓励模型的奖励输出将选中的补全排在拒绝的补全之上。奖励模型的初始化方式可类似于微调，使用\
  \ transformer 库 AutoModel 方法中的 `AutoModelForSequenceClassification.from_pretrained()`\
  \ 等方法。trl 库的 `RewardConfig()` 方法允许指定训练奖励模型的训练配置。\n\n```\nreward_model = AutoModelForSequenceClassification.from_pretrained(model_name,\
  \ num_labels=1)\nreward_config = RewardConfig(\n    output_dir=\"./reward_model_output\"\
  ,  # 保存模型的目录\n    max_length=128,  # 最大序列长度\n    per_device_train_batch_size=8,\
  \  # 训练批次大小\n    per_device_eval_batch_size=8,  # 评估批次大小\n    learning_rate=5e-5,\
  \  # 学习率\n    num_train_epochs=3,  # 训练轮数\n    evaluation_strategy=\"steps\",  #\
  \ 定期评估\n    logging_strategy=\"steps\",  # 日志记录配置\n    logging_steps=10,  # 每 10\
  \ 步记录一次进度\n    save_steps=500,  # 每 500 步保存一次模型\n    remove_unused_columns=False,\
  \  # 预分词数据集所需\n    report_to=\"none\",\n)\n```\n\n除了指定训练配置（类似于微调时的训练配置）外，奖励模型训练数据首先被处理成批次。这通过使用\
  \ transformer 库的 Data Collator 方法来实现。有特定的数据整理器方法，如 `DataCollatorWithPadding()`，它们通过使用需要传递的\
  \ tokenizer 来创建小批量，并在需要时填充（或拼接）数据。然后将数据整理器连同训练配置 `RewardConfigs` 一起传递给模型训练器 `RewardTrainer()`。\n\
  \n```\ndata_collator = DataCollatorWithPadding(tokenizer=tokenizer)\ntrainer = RewardTrainer(\n\
  \    model=reward_model,\n    args=reward_config,\n    train_dataset=tokenized_dataset,\n\
  \    eval_dataset=tokenized_dataset,\n    data_collator=data_collator,  # 使用 DataCollatorWithPadding\n\
  \    tokenizer=tokenizer,  # 传递 tokenizer 用于预处理\n)\n```\n\n这里我们使用分词后的数据集进行演示。在实践中，训练数据集和评估数据集可以拆分，或经过精心策划。将奖励配置和数据整理器传递给训练器后，训练和评估的运行方式类似于我们在*第\
  \ 6 章*中看到的微调情况。\n\n```\ntrainer.train()\nresults = trainer.evaluate()\nprint(\"\
  Evaluation Results:\", results)\n```\n\n训练输出显示包含 `chosen_text`、`rejected_text` 和\
  \ `logits` 的表格。Logits 是用于确定奖励分数的原始模型预测。Logits 可帮助计算概率，或根据奖励模型的标准决定接受或拒绝哪个输出。奖励模型通过将候选文本的\
  \ logits 与“理想”文本（人类首选输出或高评分候选）的 logits 进行比较来评估候选文本。响应根据模型评分被分类为选中文本和拒绝文本，并显示在训练进度表中，如表\
  \ 7.1 所示。\n\n![表 7.1：显示训练进度的表格，其中选中文本和拒绝文本响应被分类为单独的列。](img/file34.png)\n\n表 7.1：显示训练进度的表格，其中选中文本和拒绝文本响应被分类为单独的列。\n\
  \n\n\n`chosen_text` 和 `rejected_text` 列包含与模型的代表性对话，例如问题和生成的答案。由于我们使用的是 BERT 类型的模型，我们会看到特定的句子标记。`CLS`\
  \ 是分类标记，一个添加到输入序列开头的特殊标记。它是输入的聚合表示。在训练期间，该标记充当占位符，允许跨整个输入序列聚合信息，特别是用于标记和分类等任务。`SEP`\
  \ 标记（SEP 代表 separation，即分隔）用于分隔不同的片段，并帮助模型理解输入序列中不同句子或上下文之间的边界。`SEP` 还帮助模型区分前提和问题，例如在这里第一句话是在提问或请求某个动作，第二句话是在执行或接受该动作。这些标记之所以存在，完全是因为我们展示的是\
  \ BERT 模型的输出。\n\n## 评估指标\n\n评估输出显示通常在训练期间或训练后评估模型性能时报告的关键指标。评估输出可以按如下方式报告：\n\n```\n\
  Evaluation Results: {'eval_loss': 0.4644598960876465, 'eval_accuracy': 1.0, 'eval_runtime':\
  \ 1.6874, 'eval_samples_per_second': 1.185, 'eval_steps_per_second': 0.593, 'epoch':\
  \ 3.0}\n```\n\n评估过程中计算的损失是 `eval_loss`，它衡量模型预测与真实值（ground truth）的匹配程度。同样，`eval_accuracy`\
  \ 是模型在评估数据集上的准确率。准确率是正确预测实例的比例占总实例数的比例。`eval_runtime` 是运行评估阶段所花费的总时间，以秒为单位。这有助于理解评估过程的效率和速度，特别是在处理大型数据集或使用复杂模型时。其他评估指标\
  \ `eval_samples_per_second` 是模型吞吐量的度量，显示评估期间每秒处理的评估样本数。同样，`eval_steps_per_second`\
  \ 从批处理速度的角度提供了模型评估效率的见解，并受批大小、模型复杂度和硬件等因素影响。`epoch` 在训练期间指定，也会在评估时呈现，因为它衡量模型看过整个训练数据集的次数，可用于实验。\n\
  \n为了继续对其他数据进行预测并使用真实场景进行测试，可以使用 `predict` 方法，并将 `tokenized_dataset` 替换为结构类似的其他数据。您可以使用相同的数据进行快速测试，或使用不同的数据集（最好是更大的数据集），并检查预测分数。\n\
  \n```\noutput = trainer.predict(tokenized_dataset)\npredictions = output.predictions\n\
  print(predictions)\n```\n\n## 向损失添加 Margin\n\n存在一个 Margin（间隔），它是“chosen”（被选）和“rejected”（被拒）响应的预测分数之间的差值。它表明模型选择一个响应而非另一个响应的置信度。它使用上述预测分数计算，并有助于决策。假设\
  \ `output.predictions` 包含 chosen 和 rejected 响应的预测分数，则 Margin 可以计算为它们的差值。\n\n```\n\
  score_chosen = predictions[:, 0]\nscore_rejected = predictions[:, 1]\nmargin = score_chosen\
  \ - score_rejected\n```\n\n您应该基于预测分数**计算 Margin**，因为 Margin 代表模型对其选择的置信度，并通过提供信号直接指导训练过程，该信号表明模型区分不同响应的效果如何。评估分数对于跟踪模型性能很有用，但在训练期间不用于计算\
  \ Margin。根据 HuggingFace TRL 文档，您可以通过直接向数据集添加 Margin 列来向损失添加 Margin。如果存在 Margin 列，奖励整理器将默认将其纳入考量。以下示例片段展示了如何向上述示例中使用的数据集添加\
  \ Margin：\n\n```\ndef add_margin(row):\n    return {'margin': row['score_chosen']\
  \ - row['score_rejected']}\ndataset = dataset.map(add_margin)\n```\n\n`dataset.map(add_margin)`\
  \ 将 `add_margin` 函数应用于数据集中的每一行，生成一个包含新增列的数据集，该列包含每行计算出的 Margin。\n\n## 数据质量、平衡性与多样性\n\
  \n数据收集过程涉及除用户体验和用于用户交互及遥测的扩展之外的几个重要考量因素。数据质量受工作人员输入数据方式的影响，因为人工输入涉及主观性。通过提供清晰的标注指南并检查一致性，可以提高数据质量的一致性。同样，提供给工作人员的提示类型应涵盖各种主题和难度级别，包含不同类型的响应，以实现平衡的覆盖。如果模型面对的是简单或“阳光大道”类型的问题，答案可能会导致显而易见的正确答案，工作人员给予更高评分，从而导致评分不平衡。添加细微差别的提示和问题，或增加多样性，将有助于获得更稳健的结果。与覆盖面类似，标注员的多样性有助于减少通常在单极群体中观察到的系统性偏差。\n\
  \n在使用人工标注数据训练 RM（奖励模型）之前，评估标注质量非常重要。测量标注者间的一致性和可靠性有助于提高信号质量。标注者之间更好的一致性意味着更有信心认为标注数据正确地代表了正确的信号。如果人工标注者在偏好上差异很大，且判断输出的差距很大，这表明需要更多数据，因为使用此类数据可能导致次优策略。\n\
  \n有几个指标有助于确定人工标注员的质量。一个在计算语言学中广泛使用且在奖励建模研究中被考虑的常用指标是 **Cohen's Kappa**（科恩卡帕系数）。它使用标注者间一致性并考虑了偶然一致性。其范围通常为\
  \ -1 到 1，其中 1 表示完全一致，0 表示相当于偶然的一致性，-1 表示系统性分歧。如果您只有两个标注员且标注是严格分类的（例如 chosen 与 rejected），如成对偏好或李克特\
  \ 5 级量表的情况，Cohen's Kappa 适用，并能给出标注员一致可靠程度的明确指标。其数学表示如下：\n\n其中 `p_o` 是评分员或标注员之间的观察一致性，`p_e`\
  \ 是他们之间的偶然一致性。`p_o` 可计算为两个标注员都同意的样本的 chosen 和 rejected 响应之和与总样本数的比率。`p_e` 是两个标注员的\
  \ chosen 响应乘积之和与两个标注员的 rejected 响应乘积之和与总样本数的比率。\n\n考虑两个评分员 A 和 B，及其评分如表 2 所示：\n\n\
  |   | A: 接受 | A: 拒绝 | 总计 |\n|---|---|---|---|\n| B: 接受 |   |   |   |\n| B: 拒绝 |\
  \   |   |   |\n| 总计 |   |   | N |\n\n\n\n# 评分者间一致性指标\n\n## 表 7.2：评分者间一致性表\n\n此处，`表\
  \ 7.2` 中的每个表项表示评分者 A 或评分者 B 接受和拒绝的回复。添加后缀以区分是两位评分者都同意 `A_B` 还是仅单个评分者同意 `A`。带后缀的\
  \ `N` 表示那些特定场景，`T` 表示 A 接受或拒绝的回复总数（针对 A 接受的总场景）或 B 的总数。不带后缀的 `N` 是接受和拒绝场景的总数。\n\n\
  考虑到此表，观察到的一致性和随机一致性可用以下数学方程表示：\n\n`Cohen's kappa` 有助于确定数据是平衡还是不平衡，且对于平衡数据值更高。然而，它必须与准确率指标结合使用，因为它本身并不能说明太多关于准确率的信息。该指标可进一步扩展以适应多位评分者，扩展版本称为\
  \ `Fleiss' kappa`。\n\n`Quadratic Weighted Kappa`（二次加权 Kappa）是 `Cohen's kappa` 的一种变体，专为**有序数据**设计——即遵循自然顺序的评级（例如\
  \ 1 < 2 < 3 < 4 < 5）。它采用一种加权方案，随着分配评级之间距离的增加，对分歧的惩罚力度加大。例如，在“1”与“5”上的分歧比在“3”与“4”上的分歧是更大的错误。\n\
  \n`Fleiss' kappa` 是一种评分者间信度的统计度量，将 `Cohen's kappa` 推广到了**两位以上**评分者。`Fleiss's kappa`\
  \ 的公式与 `Cohen's kappa` 相似，但观察一致性和随机一致性的计算经修改以适应多位评分者：`p_o` 是所有评分者一致概率的平均值，`p_e`\
  \ 是假设随机分配时所有评分者一致概率的平均值。\n\n`Krippendorff's alpha` 是一种更通用的信度度量，可处理不同数据类型（名义、有序、等距、等比）和不同数量的标注者。它还考虑了缺失数据，这在大规模标注项目中经常出现。\n\
  \n## 参考文献：Artstein and Poesio (2008)\n\nArtstein 和 Poesio 的《计算语言学中的编码者间一致性》（2008）是关于测量和解释计算语言学中编码者间一致性的综合综述。他们讨论了：\n\
  \n- **不同的一致性度量**（包括 Kappa 统计量和 Alpha 系数）。\n- **何时使用哪种度量**，取决于数据性质（名义 vs. 有序 vs.\
  \ 等距）。\n- **陷阱与最佳实践**：如何设计标注任务以减少混淆、如何处理随机校正，以及信度如何与效度相关联。\n\n如果您有兴趣深入了解，可以参考此处的在线\
  \ PDF：[`direct.mit.edu/coli/article/34/4/555/1999/Inter-Coder-Agreement-for-Computational`](https://direct.mit.edu/coli/article/34/4/555/1999/Inter-Coder-Agreement-for-Computational)\
  \ 或此处：[`aclanthology.org/J08-4004.pdf`](https://aclanthology.org/J08-4004.pdf)。\n\
  \n确保标注者理解定义和说明——并始终如一地应用它们——至关重要。Artstein 和 Poesio 的指南（[`aclanthology.org/J08-4004.pdf`](https://aclanthology.org/J08-4004.pdf)）可以帮助确定哪种信度度量最适合您的\
  \ RLHF 设置以及如何解读它。\n\n请注意，这些指标可用于在训练前评估数据质量。通常基于这些指标预处理数据将有助于提高训练出与代表性标注人群一致的 RM\
  \ 的几率。除了对单个提示回复进行评分外，回复的质量还可能取决于输入模型的上下文。如果模型是针对作为对话一部分的回复进行训练的，且输入为对话历史，则回复对训练模型而言是分布内的。如果输入类似于模型训练期间见过的内容，回复更有可能符合预期。关于输入质量的考量很重要，我们接下来将探讨它们。\n\
  \n# 奖励建模的其他考量\n\n奖励建模是从数据中进行的监督学习，其中预处理后的数据以提示输入和模型回复作为输入，以标注者的偏好评分作为奖励分数输出。虽然数据质量是\
  \ RM 与人类偏好对齐程度的重要因素，但训练一个良好对齐的模型还有一些其他考量。\n\n## 奖励建模中的上下文和聊天历史\n\n模型在提供单个输入时的回复，与作为多轮对话一部分时的回复可能不同。基于对话历史的额外信息可以帮助模型针对对话主题做出一致的回复。不过，评估数据质量的过程，尤其是指标，不会有太大变化。标注者可以对整个对话的回复进行评分，或对该对话会话的整组回复进行评分。也可以对每个回复评分并使用累积分数。\n\
  \n## 处理欠规约与过度优化\n\nRM 本质上是欠规约的。当数据处于训练数据的分布内时，它们表现良好，但当发生分布偏移时，输出可能出乎意料。RM 的欠规约性源于\
  \ RM 基于人类反馈信号进行训练，而人类反馈只是全面人类评估的代理信号。这导致过度优化，即模型与不能准确指定期望结果的人类反馈对齐。如 [`arxiv.org/pdf/2312.09244`](https://arxiv.org/pdf/2312.09244)\
  \ 所示，使用来自多个 RM 信号的集成可以缓解过度优化。还有其他缓解过度优化的方法，如 [`openreview.net/pdf?id=gkfUvn0fLU`](https://openreview.net/pdf?id=gkfUvn0fLU)\
  \ 所示，该方法试图表明约束强化学习有助于缓解过度优化。\n\n# 模型评估与迭代\n\n在上一节中，我们展示了如何使用 `RewardTrainer` 训练\
  \ RM。训练后，我们还展示了如何使用 `eval` 方法评估训练好的模型。为演示起见，我们使用了相同的分词数据。但在使用真实数据集时，您必须将数据集拆分为大量训练数据和一小部分排除在训练数据之外的评估数据。这是第一层级的评估。训练后的额外评估可以从此处开始纳入。\n\
  \n## 评估步骤与指标\n\n某些评估方法可以是传递给 `RewardTrainer` 的评估的扩展。这些可以采用以下步骤的保留人工对比形式：\n\n1. 收集一个类似于训练集的测试数据集，或使用排除在训练之外的部分训练数据。\n\
  2. 让人工评分者对呈现的每个输入和回复对进行评分、排序或添加偏好（在成对偏好评分的情况下）。\n3. 然后将 RM 的预测分数与人工评分进行比较。\n\n为了比较\
  \ RM 相对于人工评分的预测效果，可以同时使用多种分数。\n\n### 准确率或一致率\n\n从测试数据中取出两个回复，例如 `response1` 和 `response2`。RM\
  \ 将为每个回复预测分数，例如 `R(response1)` 和 `R(response2)`。此处的一致率或准确率，计算 RM 的预测与人类偏好数据匹配的次数。一致率\
  \ =\n\n### 排序相关性指标\n\n\n\n\n## 奖励模型评估\n\n### 秩相关指标\n\n当数据集包含基于排名量表比较的多个响应时，该指标更为合适，因为它衡量两个排名一致的程度。它衡量\
  \ `RM` 预测的整体排序与人类可能的排名匹配得有多好。例如，考虑一种情况：人类不是进行成对排名，而是按偏好顺序对多个响应进行评分，例如 `response3`\
  \ 最好，其次是 `response 5`，然后是 `response 2`。秩相关计算涉及以下步骤：首先，响应由 `RM` 进行排名，例如 `` `R(response1)`\
  \ ``、`` `R(response2)` ``、……随后，按其分数值对分数进行排序，以获得 `RM` 的排名。然后，将 `RM` 的排名与人类排名进行比较。`RM`\
  \ 与人类排名的比较可以使用 `Spearman` 等级相关系数，它使用排名位置并计算标准相关系数 `ρ`，其中 `` `cov` `` 是 `RM` 分数与人类偏好之间的协方差，该指标范围在\
  \ `-1` 和 `1` 之间。同样，另一个比较排序的指标 `Kendall` 的 tau 也可以计算。它衡量关联强度，简化形式可表示为 `τ`。\n\n###\
  \ RMSE（均方根误差）和 MAE（平均绝对误差）\n\n根据主题领域和响应类型，某些应用可能要求分数为介于 `0-100` 或 `0-1` 之间的标量值，甚至是李克特量表\
  \ `1-5`。在这种情况下，可以使用标准回归指标，如 `Root Mean Squared Error` (`RSME`) 或 `mean absolute\
  \ error` (`MAE`)。这些分数提供标准质量分数，适合确定接近程度的大小。虽然这些指标有利于确保遵循模型训练的最佳实践，但在用于实际应用之前，应进行额外的泛化测试。其中一些测试如下。\n\
  \n### 分布外鲁棒性\n\n分布外鲁棒性主要是模型泛化能力的测试，用于测试模型是否能在未参与训练数据分布的数据上表现良好。这需要收集与训练数据不同的数据，并测试模型分数与人类偏好的对比情况。如果模型分数与人类偏好不一致，可以观察到所有系统性差异，并在这些示例中收集基于特征工程的输入，用于\
  \ `RM` 的重新训练或微调。虽然这一步骤可能很繁琐，但它是实际应用的必要步骤。最佳实践是在现实世界中使用模型并测试分布外鲁棒性，收集数据，在其上重新训练或微调，然后重新测试。这可以是一个周期性的重复过程。\n\
  \n## 策略性能\n\n无论 `RM` 表现得多好，其最终目的是帮助训练与语言模型人类意图对齐的策略。因此，策略性能可以作为测试 `RM` 是否有用的实用指标。这类似于为软件模块执行的集成测试。然而，良好的策略性能并不保证\
  \ `RM` 是鲁棒的。它只是一个间接迹象，表明给定的 `RM` 在方向上是正确的。反之，良好的 `RM` 也不保证更好的性能，根据该论文 *The Accuracy\
  \ Paradox in RLHF: When Better Reward Models Don’t Yield Better Language Models*\
  \ 的最新发现：[`aclanthology.org/2024.emnlp-main.174.pdf`](https://aclanthology.org/2024.emnlp-main.174.pdf)，通常中等准确度就足够了。`RM`\
  \ 可能不是在所有场景下都完美反映人类偏好，但通常它提供了足够的信号，将策略推向人类普遍喜欢的行为。它完全可能只捕捉了部分相关性，并且对于用于测试策略性能的测试或示例很有用。因此，在实践中这是不够的。\n\
  \n### 由不良 RM 诱导的策略行为指标\n\n除了我们在上一节讨论的评估指标外，还有一些指标表明策略行为源于不良的奖励模型准确性。其中一些如下：\n\n\
  *   **偏好错位：** 微调后的策略可能生成人类实际上不偏好的输出，尽管奖励模型在其验证集上显示出高准确性。这表明 `RM` 过拟合了偏好数据中的表面模式（例如长度、情感），而不是捕捉更深层的意图。\n\
  *   **奖励黑客：** 策略通常学会“钻”奖励模型的空子。常见症状包括过度冗长的补全、在句首添加“作为一个 AI 语言模型……”等过度的模棱两可措辞，或旨在触发高奖励分数的说教性陈述。此问题经常源于奖励模型的缺陷，而这些缺陷源于人类标注者通常给较长文本打更高分。\n\
  *   **行为崩溃或模式收窄：** 不良的奖励塑造可能导致策略生成过于相似或保守的输出，损害多样性、信息量或创造力。这在摘要或对话等开放式任务中尤为成问题。\n\
  \n### 解决不良策略性能的策略\n\n虽然不良的 `RM` 性能可以使用类似于传统 ML 方法的监督学习策略来修复，例如数据平衡、正则化和分布外效应（在上一节讨论过），但这些指标无法捕捉一些影响策略行为的性能问题。当不良的策略性能揭示\
  \ `RM` 问题时，有几种策略可以提供帮助：\n\n*   **优化并扩展偏好数据：** 针对策略表现不佳的领域。收集更多涉及当前策略输出的比较，特别是失败案例。\n\
  *   **应用主动重标注：** 对不确定、低置信度或有争议的补全进行采样以进行新的标注。这有助于改进奖励模型在缺乏明确指导的地方的表现。\n*   **裁剪或归一化奖励：**\
  \ 防止极端奖励值使策略更新不稳定。有助于缓解奖励黑客行为。\n*   **使用集成奖励模型：** 减少对特定标注者怪癖或偏见的过拟合，并提高跨提示类型的泛化能力。\n\
  *   **使用策略探测检查点进行评估：** 在微调过程中使用中间策略来测试奖励模型的鲁棒性。\n\n在实践中，对 `RM` 的最终测试是基于 `RM` 训练出的最终策略——微调语言模型——的表现如何。此外，除了\
  \ `RM` 准确性和策略行为的影响，策略训练本身也影响模型响应的表现；我们将在下一章介绍这些内容。\n\n### 总结\n\n在本章中，我们探讨了为语言建模构建奖励模型的端到端过程。我们涵盖了偏好数据收集、预处理最佳实践，以及使用\
  \ `TRL` 和 `Transformers` 库的训练技术。为确保数据可靠性，我们讨论了使用评分者一致性指标，如 `Cohen’s Kappa` 和 `Krippendorff’s\
  \ Alpha`。我们强调了基于边界的损失对于捕捉偏好置信度的重要性，并重点介绍了数据质量、平衡、多样性以及聊天上下文作用等关键因素。我们还解决了欠规范和奖励过度优化等挑战。最后，我们概述了评估策略，并重申了奖励模型在指导强化学习以微调基础语言模型中的作用——将在下一章（第\
  \ 8 章）介绍。\n\n### 参考文献\n\n*   **参数高效微调库及文档：**\n    *   [`github.com/huggingface/peft`](https://github.com/huggingface/peft)\n\
  \    *   [`huggingface.co/docs/peft/main/en/index`](https://huggingface.co/docs/peft/main/en/index)\n\
  *   **SFT Trainer：**\n    *   [`huggingface.co/docs/trl/sft_trainer`](https://huggingface.co/docs/trl/sft_trainer)\n\
  *   **Reward Trainer**\n\n\n\n\n\n### 参考资料\n\n### TRL 文档\n- [`huggingface.co/docs/trl/reward_trainer`](https://huggingface.co/docs/trl/reward_trainer)\n\
