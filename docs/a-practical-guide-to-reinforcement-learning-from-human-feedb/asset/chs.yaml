  - [`aclanthology.org/J08-4004.pdf`](https://aclanthology.org/J08-4004.pdf)\n- [`arxiv.org/pdf/2312.09244`](https://arxiv.org/pdf/2312.09244)\n\
  - [`openreview.net/pdf?id=gkfUvn0fLU`](https://openreview.net/pdf?id=gkfUvn0fLU)\n\
  - [`aclanthology.org/2024.emnlp-main.174.pdf`](https://aclanthology.org/2024.emnlp-main.174.pdf)\n"
- "## 第 8 章：用于调优语言模型的强化学习\n\n### 加入我们的图书社区\n\n![一个中间带方块的二维码，描述自动生成](img/file0.png)\n\
  \n[`packt.link/EarlyAccessCommunity`](https://packt.link/EarlyAccessCommunity)\n\
  \n本章的目标是提供对强化学习如何利用基于人类偏好数据训练的奖励模型来微调预训练语言模型的实践性和概念性理解。该阶段通过将偏好信号转化为优化目标，完成了基于人类反馈的强化学习（`RLHF`）流水线，使得能够使用稳定的强化学习技术（如近端策略优化\
  \ `PPO`）实现可衡量且对齐的模型行为。您将学习如何将训练好的奖励模型集成到强化学习循环中，利用该奖励信号微调策略模型，并使用 Transformer Reinforcement\
  \ Learning（`TRL`）库等工具实现此流水线。本章直接建立在监督微调（第 6 章）和奖励建模（第 7 章）的基础之上，重点在于闭环并使生成行为与人类期望对齐。`RLHF`\
  \ 的这一最终阶段至关重要，因为它将隐性的人类反馈转化为显性的优化。没有它，模型仅部分对齐；有了它，模型才能响应现实部署中重要的价值观、目标和安全约束。掌握这一步对于构建不仅强大，而且值得信赖且对齐的语言模型至关重要。\n\
  \n### 关键主题\n\n- 奖励模型与强化学习的集成\n- 用于 `RLHF` 的 `PPO` 算法\n- 使用 Transformer Reinforcement\
  \ Learning（`TRL`）库中的 `PPO` Trainer 进行微调\n- `PPO` 微调中需跟踪的指标\n- 评估微调后的模型\n\n### 技术要求\n\
  \n本章我们将使用 `Python`，并将所有实现相关的依赖保持最小化。具体的版本建议和所需安装的最小库如下：\n\n1. `Python` 版本 >= 3.9\n\
  2. `numpy` == 1.26.4\n3. `matplotlib` == 3.8.4\n4. `transformers` == 4.42.4\n5.\
  \ `datasets` == 3.0.1\n6. `ipython` == 8.27.0\n7. `ipywidgets` == 8.1.5\n8. `trl`\
  \ == 0.10.1\n\n除了这些库和安装要求外，我们将使用 `Google Colab` 利用 `GPU` 微调预训练语言模型。要开始，请克隆此 git\
  \ 仓库并切换目录到 `chapter 8`：\n\n```\ngit clone https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback\n\
  cd chapter 8\n```\n\n## 奖励模型与强化学习的集成\n\n奖励模型（第 7 章详细讨论）可用于模拟人类在面对示例选择时如何评分或给出偏好。训练好的奖励模型可用于改进策略优化，并使语言模型与人类偏好对齐。奖励模型如何与\
  \ `RLHF` 的其他组件连接的高级示意图如 *图 8.1* 所示。奖励模型针对给定的用户提示，输出生成的模型响应的信号（奖励）或分数。在训练期间，它利用人工标注的分数或偏好来比较其预测以改进模型。一旦训练完成，模型会为输入文本输出奖励或分数。该奖励用于计算策略模型如何更新。\n\
  \n![图 8.1 RLHF 中作为优化策略模型一部分的奖励模型](img/file36.png)\n\n*图 8.1 RLHF 中作为优化策略模型一部分的奖励模型*\n\
  \n在实际的 `RLHF` 设置中，提供给奖励模型作为输入的状态-动作对通常是 **用户提示** 及其 **模型生成的响应**。用户提示可以是问题、聊天消息、图像或任何其他形式的数据，模型可能被要求生成文本响应，可以是聊天消息或回复、图像、代码，或简单的问答对。奖励模型的输出（奖励）用于更新策略模型权重，更新过程基于强化学习。奖励模型已经在大量相关的用户提示和带有人类评分的示例响应样本上训练完成。\n\
  \n与标准 RL 中奖励函数基于观察计算奖励或观察的奖励分配显式映射不同，`RLHF` 依赖于奖励模型的 **预测**。该模型通常基于神经网络或偏好模型（如 **Bradley-Terry\
  \ 模型**）。这意味着预测奖励是基于人类反馈对状态-动作对的期望程度或质量的估计，而不是显式的奖励分配。在标准 RL 中，计算出的奖励决定了策略模型权重需要更新多少。在这种情况下，我们改用奖励模型推理来更新策略模型。对于涉及自然语言等应用，显式奖励分配不可行，奖励模型是一种实用的替代方案。\n\
  \n奖励模型基于使用人工标注的状态-动作对进行训练，这些数据可能不一致、主观、嘈杂且依赖于上下文。将奖励推理泛化到新场景是一种要求，在实践中也常被期望。幸运的是，学习到的奖励中的不确定性和泛化能力可以用类似处理任何监督学习模型的方式来处理。\n\
  \n来自奖励模型的预测奖励通常会被归一化，以确保它们在工作范围内。这通常基于实验，以便最小化策略优化中的不稳定性。奖励模型的输出（奖励信号）可用于训练策略模型。策略优化可以尝试任何\
  \ RL 算法；然而，由于在线算法（特别是 `PPO`）训练相对稳定，因此更受青睐。在下一节中，我们将更多地讨论 `PPO` 算法。\n\n## 用于 RLHF\
  \ 的 PPO 算法\n\n我们在第 4 章深入介绍了 `PPO` 算法。在本节中，我们将从 `RLHF` 标准算法选择的角度进行讨论，因为 `PPO` 在训练稳定性和样本效率方面提供了良好的平衡。在在线算法中，它具有更简单的裁剪机制实现，该机制可减弱来自前一次迭代的策略更新，从而提高稳定性。虽然离线算法可以具有样本效率，但\
  \ `PPO` 通过重用收集的数据进行多次更新来提高样本效率，使其比其他策略梯度算法更具样本效率。由于其在稳定性和效率之间的平衡，以及在各种环境中经过验证的有效性，它是包括\
  \ `RLHF` 在内的 RL 应用中的默认选择。其广泛采用也归因于其在训练中的相对稳定性和可靠性，这对于管理具有不确定性的大型系统训练至关重要。\n\n###\
  \ 使用奖励模型的 PPO 策略更新\n\n\n\n\n# PPO 在 RLHF 中的应用：基于学习奖励的策略优化\n\n在标准 PPO 中，策略是使用由奖励函数计算或基于环境观察分配的奖励信号进行训练的。然而，在\
  \ RLHF 中，奖励函数是从人类偏好中学习得来的，这带来了独特的挑战，并需要必要的修改。代替来自环境的静态奖励，学习到的奖励函数 `r_θ`（其中 `θ` 代表奖励模型的参数）有助于更新\
  \ PPO 策略 `π_φ`。优化目标或多或少与标准 PPO 相同，但现在结合了基于奖励模型 `r_θ` 的学习奖励：\n\n因此，PPO 的通用关键策略更新步骤如下：\n\
  \n1.  **收集轨迹**：收集策略 `π_φ` 的轨迹。\n2.  **推理奖励模型**：在收集到的状态-动作对上推理奖励模型，以获得预测奖励。\n3. \
  \ **计算优势估计** `A_t`，它指示采取的动作比时间 `t` 的平均动作好多少，使用广义优势估计（`GAE`）。\n4.  **计算 PPO 目标**（完整实现见第\
  \ 4 章），使用：\n5.  **更新梯度**：使用随机梯度上升。\n\n## 使 PPO 适配 RLHF 所需的修改\n\n虽然 PPO 是进行 RLHF\
  \ 策略优化时首选的默认算法，但存在一些挑战：\n\n*   **解决分布偏移**：由于奖励模型是在过去的策略轨迹或人工标注数据上训练的，随着策略的演进，它可能会遇到分布偏移。这需要使用从最新策略采样的最新轨迹，定期对奖励模型进行重新训练或微调，以保持与人类意图的一致性。奖励模型集成或不确定性估计等技术也可以缓解对过时偏好的过拟合。\n\
  \n*   **正则化与安全约束**：为防止非预期的策略行为，可以在优化过程中引入约束。其中一些已作为 PPO 实现的一部分被考虑在内。例如：\n    * \
  \  `熵正则化` 鼓励探索以防止过早收敛。\n    *   `KL 散度约束` 确保策略更新不会偏离先前策略太远，以保持稳定性。\n    *   `奖励模型不确定性处理`：通过惩罚高不确定性的奖励预测，避免过度依赖不可靠信号，这也会有所帮助。\n\
  \n*   **评估与迭代优化**：对使用推理奖励训练的策略进行评估是一个重要步骤。这些评估涉及监控奖励累积和成功率等定量指标。同样，也可以纳入人工评估和偏好比较等定性评估。基于这些评估，对奖励模型或微调步骤进行调整可以增强一致性和稳定性。\n\
  \n通过将推理奖励集成到策略优化中，RLHF 使策略能够更好地与人类偏好对齐，从而促进更具可解释性和有效性的强化学习结果。\n\n## 面向自然语言应用的 RLHF\n\
  \n上一节讨论的 PPO 算法步骤需要收集 roll-out 轨迹。在聊天和对话生成等自然语言应用中，轨迹的概念被调整以适应自然语言交互。在此语境下，`roll-out`（展开/生成序列）指的是响应提示或用户消息而生成的序列——通常是模型响应。不同于经典强化学习中典型的状态和动作序列，“轨迹”对应于结构化对话或提示-响应对，其中每个\
  \ token 都可视为策略采取的一个动作。根据模型交互场景，有两种可能的方式来界定“轨迹”一词：\n\n### 将完整对话作为轨迹\n\n在某些实现中，整个对话线程（例如，多轮用户查询和模型响应）被视为一条轨迹。模型按顺序生成多个响应，形成一条轨迹，随后由奖励模型或人工反馈进行评估。\n\
  \n### 将单个问答 (QA) 对作为轨迹\n\n在一种更简化的版本中，每个单独的问答对被视为一个独立的“回合”，并根据其质量分配奖励。\n\n两者的选择取决于反馈的粒度以及奖励模型的训练方式。接下来，我们将探讨如何为这些轨迹考虑奖励和反馈。\n\
  \n### 奖励与反馈\n\n来自人类偏好的奖励和反馈的数据结构在奖励模型训练期间确定。在多轮对话中，如果每个响应单独评估，则可以**按轮次**收集奖励。一些方法涉及为整个对话分配单一奖励，这可以考虑跨轮次的连贯性、帮助性和一致性等指标。更常见的是使用基于偏好的奖励，即根据人类偏好（例如对多个响应进行排序）训练奖励模型。该模型随后在\
  \ RL 训练期间为响应分配分数。\n\n### 训练过程\n\n训练过程涉及特定步骤。首先，语言模型生成完整对话或问答 (QA) 对形式的响应。这些响应根据结合了人类偏好的学习奖励模型分配奖励。然后，PPO\
  \ 算法使用此奖励通过以下步骤优化基础模型：\n\n1.  **收集轨迹**（完整对话或 QA 对）：模型通过从其当前策略中采样来生成输出。每个输出被视为一条轨迹，对应完整的多轮交互或单个\
  \ QA 对，具体取决于所用的框架。这些样本作为奖励评估和学习的基础。\n\n2.  **使用基线估计优势函数**：每条轨迹由奖励模型评分，反映人类偏好数据。为了确定模型应在多大程度上强化或抑制给定输出，我们计算\
  \ `advantage`（优势）——即实际奖励与基线（通常是价值函数）之间的差值。这有助于将学习重点放在优于预期的输出上，同时减轻策略梯度中的方差。\n\n\
  3.  **在 KL 约束下执行策略更新**：使用 PPO 目标更新策略，以增加高奖励输出的概率。关键在于，PPO 包含 `KL 散度` 惩罚，限制更新后的策略偏离参考策略（通常是监督微调模型）的程度。该约束在保留早期微调阶段学到的流畅性和连贯性的同时，鼓励与人类偏好对齐。\n\
  \n### PPO 在聊天应用中的挑战\n\n奖励模型的一致性是一个挑战，因为对话质量是主观的，收集到的人类偏好也是如此。因此，收集过程应遵循最佳实践（如第 7\
  \ 章所述），且由于技术尚处于起步阶段，这些实践仍在不断演进。聊天对话可能会变得很长，较长的对话会给训练带来不稳定性，这使得在某些情况下按轮次给予奖励更切合实际。与游戏和模拟等常规\
  \ RL 环境不同，从人类对话数据中探索多样化响应并保持质量颇具挑战性。因此，通常在实践中，聊天模型通常使用基于偏好排序的问答对，而不是完整的多轮对话，以稳定训练并使奖励建模更易处理。\n\
  \n## 在 TRL 中使用 `PPOTrainer` 进行微调\n\n\n\n截至 2025 年，已涌现出多个用于 RLHF 的开源库，使开发者和研究人员能够更有效地微调大型语言模型。在主要的\
  \ RLHF 开源库中，知名的库有 `Transformer Reinforcement Learning (TRL)` 库，以及一个从其派生的高级分布式版本\
  \ `TRLx`，后者旨在适应拥有数十亿参数的大型模型的分布式微调。`Reinforcement Learning for Language Models (RL4LMs)`\
  \ 是一个多功能库，提供多种在线策略 RL 算法的实现，并基于 `PPO` 引入了一种新颖的优化方法 `natural language policy optimization\
  \ (NLPO)`。由于 `TRL` 是采用最广泛的库，且常作为 `TRLx` 等其他库的基础，我们将重点关注该实现。`TRL` 也是微调的良好入门。在上一章中，我们使用了\
  \ `RewardTrainer` 类来训练奖励模型。在本节中，我们将演示如何将训练好的奖励模型——或一个合适的预训练替代品——纳入 RLHF 流程。为了便于说明，我们使用\
  \ **Reward Model Setup** 部分讨论的预训练奖励模型。为了利用这一奖励信号微调策略模型（正在被优化的语言模型），我们使用 `PPOTrainer`\
  \ 类。在开始使用 `PPOTrainer` 微调语言之前，建立一个适合 RLHF 训练的环境非常重要。以下步骤将指导你使用 Colab Pro 准备一个启用\
  \ GPU 的设置，并附带关于如何将其适配到 AWS、Azure 或本地机器等其他环境的说明。\n\n## 基于 RLHF 的微调库与资源\n\n虽然 RLHF\
  \ 微调流程可以在各种环境中运行——包括配备 CUDA GPU 的**本地机器**，或 **AWS**、**Azure**、**Lambda Labs**、**Paperspace**\
  \ 等云服务商——但本节重点介绍使用 **Google Colab Pro**。Colab Pro 在易用性、GPU 可用性和性价比之间取得了平衡，非常适合运行小规模\
  \ RLHF 实验和演示。**注意：** 以下步骤专为 Colab 设计，但可轻松适配到其他环境，包括企业级云部署。\n\n### 在 Colab 中启用并验证\
  \ GPU 访问\n\n导航至：`Runtime → Change runtime type → Hardware accelerator: GPU`  \n\
  然后验证 GPU 访问：打开 `Runtime → Manage sessions`，查看 **“Type”** 列下的信息（例如 T4、A100）。  \n\
  也可通过编程方式完成，如下所示：\n\n```\nimport torch\nprint(\"CUDA available:\", torch.cuda.is_available())\n\
  if torch.cuda.is_available():\n    print(\"Using GPU:\", torch.cuda.get_device_name(0))\n\
  ```\n\n### 步骤 2：安装所需库\n\n我们将需要一些资源来使用 RLHF 微调语言模型：最新版本的 `pytorch`、`huggingface`\
  \ 库：`datasets`、`transformers`、`peft`，以及 `TRL` 的稳定版本 `trl==0.10.1`。这些库可直接通过 Colab\
  \ 笔记本单元格使用 pip 安装，命令如下：\n\n`!pip install torch datasets transformers peft trl==0.10.1`\n\
  \n你可以搭建一个包含所有库和必要包的环境。一个包含所有必要依赖、导入及分步设置的完整可运行笔记本可在以下地址获取：[`github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback`](https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback)/Chapter8.\n\
  \n### 步骤 3：使用轻量级语言模型\n\n为了适应 Colab Pro 的内存预算，我们将使用 Hugging Face Transformers 库中的紧凑型模型（如\
  \ `gpt2`、`distilgpt2`（因果 LM））来演示 RLHF。RLHF 的原理和流程结构同样适用于更大的模型，但运行这些模型通常需要专用硬件。\n\
  \n### 步骤 4：针对内存效率进行优化\n\n即使是小型语言模型，使用 RLHF 训练也可能给内存带来压力。为缓解此问题，请应用以下节省内存的策略：\n\n\
  *   **使用混合精度训练** (`fp16` 或 `bf16`)（如果支持），通过 `accelerate` 或 trainer 配置启用。\n*   **启用梯度检查点**，通过在反向传播期间重新计算中间激活值，以计算换取内存。\n\
  *   **调整批次大小** 和 **序列长度** 以适应可用内存。\n*   使用 `!nvidia-smi` 主动监控内存使用情况。\n\n### 适配其他环境\n\
  \n相同的设置适用于其他平台，只需微调：\n\n#### 本地 CUDA 环境\n\n*   使用 `conda` 或 `venv` 进行环境管理。\n*  \
  \ 安装匹配的 `PyTorch` 和 `CUDA` 工具包版本。\n*   确保正确安装 NVIDIA 驱动。\n\n#### 云平台\n\n*   **AWS\
  \ EC2**（例如 `g5`、`p3` 实例）：\n    *   使用预装 `CUDA` 的 `DLAMIs` 或自定义 `AMIs`。\n*   **Azure**（例如\
  \ `Standard_NC6`、`Standard_ND40rs_v2`）：\n    *   使用 Azure Machine Learning 或带 GPU\
  \ 的 VM 实例。\n    *   `AzureML SDK` 有助于自动化预配和模型训练工作流。\n*   **Lambda Labs / Paperspace**：\n\
  \    *   提供按需付费的 GPU 笔记本或 VM。配置方式同本地 `CUDA` 机器。\n\n## 内存优化与可复现性的设置与配置\n\n对于运行笔记本实验，能够复现实验并迭代改进至关重要。保持笔记本结果相对可复现的最佳实践之一是为随机化设置种子。用于启用可复现性的种子设置代码片段如下：\n\
  \n```\nSEED = 42\ntorch.manual_seed(SEED)\nnp.random.seed(SEED)\nset_seed(SEED)\n\
  ```\n\n这里我们使用轻量级模型 `gpt2` 以减少内存占用。除了这一选择外，我们还使用了一些参数裁剪。对于本示例，我们将通过设置 `MAX_NEW_TOKENS\
  \ = 32` 限制生成文本长度，设置小批次大小 `BATCH_SIZE = 2 or 4` 以提高内存效率，截断序列长度 `MAX_SEQ_LENGTH =\
  \ 32`，使用少量训练样本 `NUM_SAMPLES = 4000`，以及 `NUM_EPOCHS = 2`。为确保训练稳定和高效内存使用，我们采用梯度检查点和混合精度等优化（针对大模型设为\
  \ true）。\n\n```\n# Configuration - Memory-optimized settings\nMODEL_NAME = \"gpt2\"\
  \ \nMAX_NEW_TOKENS = 32 \nBATCH_SIZE = 4 \nMAX_SEQ_LENGTH = 32 \nLR = 1.5e-5\nNUM_EPOCHS\
  \ = 2 \nNUM_SAMPLES = 4000 \nOPTIMIZE_MEMORY = True\nif OPTIMIZE_MEMORY:\n    #\
  \ Enable gradient checkpointing (trades computation for memory)\n    os.environ[\"\
  PYTORCH_CUDA_ALLOC_CONF\"] = \"expandable_segments:True\"\n    MIXED_PRECISION =\
  \ False\n```\n\n为优化训练期间的内存使用，特别是在处理大模型或批处理时，定义一个实用函数来清理未使用的内存资源非常有用。函数 `clear_memory()`\
  \ 调用 Python 的垃圾回收器并清空 CUDA 缓存，同时重置峰值内存统计。务必**仅在训练批次或迭代之间**调用此函数，以避免干扰活跃计算。在训练循环的适当位置加入\
  \ `clear_memory()` 有助于缓解显存不足错误并保持高效的 GPU 内存利用率：\n\n```\ndef clear_memory():\n  \
  \  import gc\n    gc.collect()\n    if torch.cuda.is_available():\n        torch.cuda.empty_cache()\n\
  \        torch.cuda.reset_peak_memory_stats()\n```\n\n在完成内存优化和需求的配置设置后，我们将数据准备作为下一步。\n\
  \n## 数据准备\n\n为演示目的，我们将使用 Hugging Face 上的一个小型数据集，但你可以将相同的方法应用于真实世界的数据集。我们可以加载 **Anthropic\
  \ Helpful-Harmless (HH-RLHF)** 数据集的一个小子集，使用 HuggingFace `datasets` 库的方法 `load_dataset(\"\
  Anthropic/hh-rlhf\")`。要限制数据规模，可使用 `NUM_SAMPLES` 分割训练数据。\n\n```\ndataset = load_dataset(\"\
  Anthropic/hh-rlhf\", split=f\"train[:{NUM_SAMPLES}]\")\n```\n\n\n\n\n## 数据集准备\n\n\
  它包含人工编写的提示词，以及标记为 `chosen`（首选）和 `rejected`（非首选）的助手回复。为了高效微调，我们通过提取提示词及其相应的 `chosen`\
  \ 和 `rejected` 回复来预处理数据集。此外，我们为了内存效率过滤掉过长的提示词，并处理潜在的格式不一致问题。提示词和回复被分词并格式化，以用于 `RLHF`\
  \ 训练循环。一个预处理数据集的示例函数如下所示：\n\n```python\ndef prepare_dataset(dataset):\n    data_dict\
  \ = {'prompt': [], 'chosen': [], 'rejected': []}\n    for item in dataset:\n   \
  \     try:\n            prompt = item['chosen'].split('Human:')[-1].split('Assistant:')[0].strip()\n\
  \            chosen = item['chosen'].split('Assistant:')[-1].strip()\n         \
  \   rejected = item['rejected'].split('Assistant:')[-1].strip()\n            if\
  \ len(prompt.split()) < 100:\n                data_dict['prompt'].append(prompt)\n\
  \                data_dict['chosen'].append(chosen)\n                data_dict['rejected'].append(rejected)\n\
  \        except:\n            continue\n    return pd.DataFrame(data_dict)prepare\
  \ dataset\n```\n\n为了高效微调 `RLHF` 模型，我们定义了一个处理 `Helpful-Harmless` 数据集的自定义数据集类。预处理后的数据集包含提示词，以及标记为\
  \ `chosen` 和 `rejected` 的助手回复。为了优化内存使用，该类预先对提示词进行分词，并将它们作为内存高效的张量存储。然后将分词后的数据直接送入\
  \ `PPOTrainer`，用于微调策略网络。这避免了训练期间冗余的分词调用。数据集类还确保输入序列被正确截断为固定长度，以保证模型训练的一致性。虽然你可以在笔记本中查看带有注释的完整类实现，该实现扩展了用于获取额外属性的方法，但下面展示了一个精简的示例版本。\n\
  \n```python\nclass RLHFDataset(Dataset):\n    def __init__(self, data, tokenizer,\
  \ max_length=MAX_SEQ_LENGTH):\n        self.tokenizer = tokenizer\n        self.prompts\
  \ = data['prompt'].tolist()\n        self.max_length = max_length\n        self.input_ids\
  \ = []\n        self.attention_masks = []\n        self.preprocess()\n    def preprocess(self):\n\
  \        for prompt in self.prompts:\n            encodings = self.tokenizer(\n\
  \                prompt,\n                truncation=True,\n                max_length=self.max_length,\n\
  \                padding=\"max_length\",\n                return_tensors=\"pt\"\n\
  \        )     \n        self.input_ids.append(encodings['input_ids'].squeeze())\n\
  \        self.attention_masks.append(encodings['attention_mask'].squeeze())\n```\n\
  \n## 奖励模型设置\n\n`TRL` 库中的 `RewardTrainer` 方法实现了一种 `pairwise preference–style reward\
  \ modeling`（成对偏好风格奖励建模）方法。它使用 `chosen vs. rejected`（首选对非首选）回复对来训练奖励模型 —— 正如我们在第\
  \ 7 章深入探讨的那样。在本章中，我们不从头训练，而是演示如何使用 `pretrained reward model`（预训练奖励模型）。一个有力的选择是 `OpenAssistant/reward-model-deberta-v3-base`，它基于人类偏好数据训练，适用于真实的\
  \ `RLHF` 微调：\n\n```python\nreward_tokenizer = AutoTokenizer.from_pretrained(\"OpenAssistant/reward-model-deberta-v3-base\"\
  )\nreward_model = AutoModelForSequenceClassification.from_pretrained(\n    \"OpenAssistant/reward-model-deberta-v3-base\"\
  \n).to(DEVICE)\n```\n\n在早期原型设计阶段，你可以考虑使用来自情感分类器或毒性检测器等模型的代理奖励信号，它们提供快速推理和简单集成。例如：`distilbert-base-uncased-finetuned-sst-2-english`\
  \ 基于情感（积极或消极）提供分数。`unitary/toxic-bert` 输出毒性可能性，以帮助惩罚不安全或有害的语言。这些模型是标准分类器，**并未基于人类偏好数据训练**，因此它们的分数可能无法完全捕捉有用性、事实准确性或整体对齐等细微行为。尽管如此，它们对于快速实验或特定任务目标（如降低毒性）仍然很有用。在本章中，我们使用\
  \ `OpenAssistant/reward-model-deberta-v3-base`，一个专门基于偏好数据训练的奖励模型，来演示一个建立在人类对齐奖励信号基础上的完整且真实的\
  \ `RLHF` 训练流程。在 `RLHF` 中，策略模型生成由奖励模型评估的回复，奖励模型分配一个反映人类偏好对齐程度的标量奖励分数。为了高效计算多个回复的奖励，我们以小批次处理文本，对它们进行分词，并通过奖励模型运行推理。生成的分数被收集并作为奖励张量列表返回，随后用于指导\
  \ `PPOTrainer` 中的策略优化。奖励计算函数 `compute_reward` 的示例实现如下所示。\n\n```python\ndef compute_reward(texts):\n\
  \    batch_size = 4\n    all_scores = []\n    for i in range(0, len(texts), batch_size):\n\
  \        batch_texts = texts[i:i + batch_size]\n        inputs = reward_tokenizer(\n\
  \            batch_texts,\n            return_tensors=\"pt\",\n            padding=True,\n\
  \            truncation=True,\n            max_length=512,\n        ).to(DEVICE)\n\
  \        with torch.no_grad():\n            outputs = reward_model(**inputs)\n \
  \           scores = outputs.logits.squeeze(-1)\n            all_scores.extend(scores.cpu().tolist())\n\
  \    return [torch.tensor(score) for score in all_scores]\n```\n\n## 使用 LoRA 进行高效微调\n\
  \n微调大型语言模型可能非常消耗内存。为了解决这个问题，我们使用 `LoRA`（低秩适应）——一种在第 6 章讨论的 `PEFT` 方法。`LoRA` 将可训练的低秩矩阵引入注意力层和前馈层，在保持基础模型冻结的同时，大幅减少可训练参数的数量。我们定义一个\
  \ `LoRA` 配置，并通过 `peft_config` 参数将其传入模型：\n\n```python\nfrom peft import LoraConfig,\
  \ TaskType\nlora_config = LoraConfig(\n    r=8,\n    lora_alpha=16,\n    target_modules=[\"\
  c_attn\", \"c_proj\", \"c_fc\"],\n    lora_dropout=0.05,\n    bias=\"none\",\n \
  \   task_type=TaskType.CAUSAL_LM\n)\n```\n\n## 模型初始化\n\n为了在使用 `RLHF` 微调语言模型时高效管理内存，我们仔细安排模型、分词器和数据集的加载顺序。在初始化任何组件之前，我们调用工具函数\
  \ `clear_memory()` 以释放未使用的内存资源，防止不必要的峰值分配。我们微调的主要语言模型是 `gpt2`（你也可以使用 `distilgpt2`，一个更轻量的蒸馏版本），我们使用\
  \ `AutoModelForCausalLMWithValueHead` 来加载它。来自 `trl` 库的这个包装器允许集成用于基于 `PPO` 的 `RLHF`\
  \ 训练的标量价值头。我们启用**梯度检查点**以减少反向传播期间的内存消耗，以此换取一些额外的计算量。然后单独加载参考模型 (`ref_model`) 以避免\
  \ GPU 内存峰值。它是策略模型的冻结副本，在基于奖励的优化过程中充当比较基准。它在 `PPO` 训练期间用于计算当前模型输出与原始模型输出之间的 `KL divergence`（KL\
  \ 散度）。\n\n```python\nclear_memory()\nmodel = AutoModelForCausalLMWithValueHead.from_pretrained(\n\
  \    MODEL_NAME,  # e.g., \"gpt2\"\n    peft_config=lora_config,\n    use_cache=not\
  \ OPTIMIZE_MEMORY\n)\n# Optionally enable gradient checkpointing\n# model.gradient_checkpointing_enable()\n\
  # torch.compile(model)  # Optional with PyTorch 2.x\nclear_memory()\nref_model =\
  \ AutoModelForCausalLMWithValueHead.from_pretrained(\n    MODEL_NAME,\n    peft_config=lora_config,\n\
  \    use_cache=not OPTIMIZE_MEMORY\n)\n```\n\n\n\n\n# RLHF 训练循环\n\n模型初始化后，我们加载分词器和数据集。数据集通过\
  \ `RLHFDataset` 类进行处理，该类为训练构建数据结构。这种分阶段初始化确保内存增量分配，从而提高稳定性和可扩展性。\n\n```\ntokenizer\
  \ = AutoTokenizer.from_pretrained(MODEL_NAME)\ntokenizer.pad_token = tokenizer.eos_token\
  \  # Ensure compatibility with padding\nrlhf_dataset = RLHFDataset(prepared_data,\
  \ tokenizer)\n```\n\n虽然与近期的模型相比 GPT-2 并不算特别大，但它仍占用大量 GPU 显存。在加载数据集之前先加载模型，可确保最消耗内存的组件优先分配，从而避免内存溢出错误。此外，分词器通常与模型架构绑定，必须使用相同的模型名称进行初始化。之后再创建数据集，可确保在设置过程中内存得到增量且可预测地使用，这对于在有限硬件上进行稳定的\
  \ RLHF 训练至关重要。\n\n现在模型已初始化，数据集已准备并加载完毕，我们可以开始讨论 RLHF 训练循环了。\n\n## 构建数据与 PPOTrainer\
  \ 实例化\n\n在模型训练开始前，必须高效地构建数据集，以符合基于 PPO 的优化需求。**数据整理器** 于此发挥核心作用。**数据整理器** 负责将多个样本收集成一个批次，同时确保所有输入格式正确。与监督学习中批次由固定长度的标记序列组成不同，RLHF\
  \ 需要灵活的数据结构，包括：\n\n*   来自数据集的**原始提示词**。\n*   **被选与被拒回复**，用于计算奖励和策略更新。\n*   **标记化序列**，必须统一填充和格式化。\n\
  \n数据整理器将所有相关字段收集到一个结构化批次中，确保**每个训练步骤高效处理多个示例**，且无不必要的内存开销。以下代码片段展示了一个实现示例。\n\n```\n\
  def collator(data):\n    return {key: [d[key] for d in data] for key in data[0].keys()}\n\
  ```\n\n在实例化 `PPOTrainer` 之前，我们必须定义一个 `PPOConfig`——一个控制训练过程关键超参数的配置对象。这包括学习率、批次大小、KL\
  \ 散度惩罚类型和内存优化标志等设置。定义此配置对象至关重要，因为 `PPOTrainer` 在内部使用它来调度学习更新、控制与参考模型的偏差，并在训练期间优化内存使用。\n\
  \n以下是一个为资源受限训练设计的 PPO 配置示例：\n\n```\n# PPO Configuration with memory-optimized settings\n\
  config = PPOConfig(\n    model_name=MODEL_NAME,\n    learning_rate=LR,\n    batch_size=BATCH_SIZE,\n\
  \    mini_batch_size=2,\n    reward_model=\"OpenAssistant/reward-model-deberta-v3-base\"\
  ,\n    query_dataset=\"Anthropic/hh-rlhf\",\n    kl_penalty=\"kl\",\n    optimize_cuda_cache=True,\n\
  \    log_with=None\n)\n```\n\n配置定义后，我们即可实例化 `PPOTrainer`。`PPOTrainer` 由 `trl` 库实现，协调微调过程。它接收以下几个组件：\n\
  \n*   一个**策略模型**（正在微调的模型），`model`。\n*   一个**参考模型**（原始模型的冻结副本，用于防止过度优化），`ref_model`。\n\
  *   一个**奖励模型**（根据人类反馈对生成的回复进行评分），`reward_model`。\n*   一个**数据集**（包含提示词、偏好回复和拒绝回复），`dataset`。\n\
  *   分词器和数据整理器，`collator`。\n\n此处给出一个 `PPOTrainer` 实例化示例：\n\n```\nppo_trainer = PPOTrainer(\n\
  \    config=config,\n    model=model,\n    ref_model=ref_model,\n    tokenizer=tokenizer,\n\
  \    dataset=rlhf_dataset,\n    data_collator=collator\n)\n```\n\n这种构建顺序——从配置开始，接着实例化训练器——对于保持模块化、可复现性和代码清晰度至关重要。它还确保了针对训练的特定优化（如内存处理和批次调度）在\
  \ PPO 更新期间得到一致应用。\n\n> **提示：理解高级 PPOConfig 参数**\n>\n> `PPOConfig` 提供多个可调字段以控制训练动态，包括：\n\
  >\n> *   `init_kl_coef`、`target_kl` 和 `adap_kl_ctrl` 用于自适应 KL 正则化。\n> *   `cliprange`\
  \ 和 `cliprange_value` 用于防止不稳定更新。\n> *   `optimize_cuda_cache` 用于减少 GPU 上的内存碎片。\n\
  > *   `log_with` 用于灵活集成 wandb 或 tensorboard 等跟踪工具。\n>\n> 这些参数允许你在奖励最大化、稳定性和内存效率之间取得平衡——这对资源受限硬件上的\
  \ RLHF 微调至关重要。\n\n`PPOTrainer` 方法设置 PPO 训练；根据 PPO 算法的预期目标，它通过约束更新以防止剧烈变化，从而**平衡奖励最大化与稳定性**，确保模型行为稳步改进。\n\
  \n在 RLHF 微调期间，**生成参数**控制语言模型如何生成输出，必须在进入训练循环前指定。妥善调整这些参数可确保模型保持流畅连贯，同时平衡创造性与对学习行为的遵循。这些参数在训练循环中作为\
  \ `generation_kwargs` 传递。关键参数包括：\n\n*   **`top_p`（核采样）**：将采样池限制在概率最高的标记中，控制多样性。较高值（如\
  \ 0.9）允许输出更多样。较低值（如 0.3）使回复更具确定性。\n*   **`do_sample`（采样激活）**：启用标记选择的随机性，而非总是选择概率最高的标记。\n\
  *   **`max_new_tokens`（回复长度控制）**：限制生成的标记数量，防止回复过长或过短。\n\n示例代码片段如下：\n\n```\ngeneration_kwargs\
  \ = {\n    \"top_p\": 0.9,\n    \"do_sample\": True,\n    \"max_new_tokens\": 32\n\
  }\n```\n\n这些设置直接影响回复的多样性、连贯性和质量，并将在训练循环中传递给 `ppo_trainer` 以生成回复。\n\n## 设置训练循环\n\n\
  \n\n\n# 使用 PPO 训练循环进行 RLHF 微调\n\n## 训练循环概述\n\n一旦设置好 PPO 训练参数并为批量训练构建好数据，RLHF 微调过程将遵循一个迭代训练循环：模型生成回复，以奖励的形式接收反馈，并使用\
  \ PPO 更新其策略。每个训练步骤包含以下关键阶段：\n\n**1. 生成模型回复：** 模型接收提示词作为输入，并使用预定义的采样参数（`generation_kwargs`）生成回复。\n\
  \n**2. 计算奖励：** 奖励模型对生成的回复进行评估，根据输出与人类反馈的契合程度进行打分。\n\n**3. 更新策略：** `PPOTrainer` 实例利用计算出的奖励来优化模型的策略，从而改进未来的回复。KL\
  \ 散度约束有助于保持稳定性，防止行为发生剧烈变化。\n\n**4. 内存优化：** 由于训练大型语言模型可能消耗大量内存，我们应用了批量大小限制、清理 CUDA\
  \ 缓存和减少序列长度等优化，以便在资源受限的硬件上进行训练。\n\n虽然完整实现可在示例笔记本中找到，但我们将逐步讲解代码的关键部分，以便更好地理解特定设计和实现选择背后的推理。训练循环的核心方面如下代码片段所示。\n\
  \n## 代码实现\n\n```\nfor epoch in range(NUM_EPOCHS):\n    for batch_idx, batch in enumerate(ppo_trainer.dataloader):\n\
  \        if batch_idx >= 30:  # Limit batches for demo\n            break\n    \
  \    query_tensors = batch[\"input_ids\"]\n        response_tensors = []\n     \
  \   for i, query in enumerate(query_tensors):\n            generation_kwargs[\"\
  attention_mask\"] = batch[\"attention_mask\"][i].unsqueeze(0)\n            response\
  \ = ppo_trainer.generate(query, **generation_kwargs)\n            response_tensors.append(response.squeeze()[len(query):])\
  \  # Remove prompt tokens\n        batch[\"response\"] = [tokenizer.decode(r, skip_special_tokens=True)\
  \ for r in response_tensors]\n        texts = [p + \" \" + r for p, r in zip(batch[\"\
  prompt\"], batch[\"response\"])]\n        rewards_tensor = compute_reward(texts)\n\
  \        reward_history.append(rewards_tensor.mean().item() if isinstance(rewards_tensor,\
  \ torch.Tensor) else float(rewards_tensor))\n        stats = ppo_trainer.step(query_tensors,\
  \ response_tensors, rewards_tensor)\n        kl_div = stats.get('ppo/policy/approxkl')\
  \ or stats.get('ppo/policy/policykl') or stats.get('objective/kl')\n        kl_divs.append(kl_div)\n\
  \        if batch_idx % 20 == 0:\n            print(f\"Batch {batch_idx} Reward:\
  \ {reward_history[-1]:.4f} KL: {kl_div:.4f}\")\n```\n\n## 代码解释\n\n训练循环遍历 `NUM_EPOCHS`\
  \ 和 `ppo_trainer.dataloader`，后者在训练期间提供数据批次。每个批次包含 `batch[\"input_ids\"]`，其结构为张量并被赋值为\
  \ `query_tensors`。此时，批次**尚不**包含模型生成的回复——回复生成被推迟到训练循环内部进行，以优化内存使用。\n\n每个批次还包含 `attention_masks`，存储在\
  \ `RLHFDataset` 中，它们被追加到 `generation_kwargs` 中，并在调用 `ppo_trainer.generate(query,\
  \ **generation_kwargs)` 生成模型回复时按查询传递。这些回复被收集到 `response_tensors` 中，连同 `query_tensors`\
  \ 一起作为 PPO 更新所需的输入。\n\n奖励计算使用 `compute_reward` 方法，该方法接收由解码后的批次提示词和生成的回复组合而成的文本输入。获得奖励后，通过\
  \ `ppo_trainer.step(query_tensors, response_tensors, rewards)` 执行 PPO 步骤以优化策略。正如核心训练循环所示，模型按查询生成回复，使用\
  \ `compute_reward()` 方法计算相应奖励，并通过 `ppo_trainer.step()` 应用 PPO 更新。\n\n每次更新后，在本例中，您可以通过使用\
  \ `clear_memory()` 清理内存来进行内存管理。\n\n通过这一迭代 RLHF 过程，策略模型根据接收到的奖励逐步改进其回复。早期的输出可能与人类偏好不符，但连续的\
  \ PPO 更新会鼓励模型优化朝向符合偏好、连贯且多样化的回复。KL 散度惩罚充当正则化项，确保更新平滑且模型不会严重偏离其原始行为。\n\n## 预期改进\n\
  \n> **微调前：**\n>\n> **提示词：** \"How should I respond to a rude customer?\"\n>\n> **模型输出：**\
  \ \"Just ignore them. If they keep bothering you, be rude back.\"\n>\n> **经过 PPO\
  \ 更新微调后：**\n>\n> **提示词：** \"How should I respond to a rude customer?\"\n>\n> **模型输出：**\
  \ \"Stay professional and polite. If necessary, calmly explain company policies.\"\
  \n\n## 需跟踪的指标\n\n在 RLHF 框架下使用 PPO（近端策略优化）微调语言模型涉及多个动态组件。跟踪正确的指标不仅对于调试和收敛监控至关重要，而且对于确保模型在不偏离其基础能力太远的情况下与人类偏好对齐也至关重要。以下是在\
  \ PPO 训练过程中应监控的关键指标：\n\n### KL 散度\n\nKL 散度监控微调后的策略偏离原始参考模型的程度。它是基于 PPO 的 RLHF 中最重要的信号之一。它反映了策略偏离参考分布（通常是基础预训练模型）的距离。过高的\
  \ KL 散度表明模型正在为奖励函数变得过度专业化或过拟合，可能会丧失通用性或语言流畅性。另一方面，非常低或负的 KL 值可能表明训练不足、学习信号差，甚至数值稳定性问题。在实践中，KL\
  \ 散度通常使用系数（`kl_coef`）在 PPO 损失函数中进行正则化，训练期间可能需要调整该系数。\n\n### 奖励分数\n\n奖励分数根据学习到的奖励模型衡量生成回复的质量。奖励模型在\
  \ RLHF 中起核心作用，通过量化模型输出与人类偏好的契合程度。在 PPO 训练期间，每个新回复都由该模型打分，其平均奖励提供了代理改进程度的洞察。假设奖励模型准确且校准良好，奖励呈上升趋势通常反映对齐进度。然而，如果没有与之匹配的人类感知质量提升，持续的高奖励可能表明存在奖励黑客行为——即模型针对奖励模型中的虚假模式进行优化，而非真正的对齐。\n\
  \n### 熵\n\n熵指示模型输出分布的多样性或确定性。它衡量模型策略的随机性——熵越高，行为越具探索性。在语言生成中，这转化为产生更广泛的回复范围。训练期间保持健康的熵有助于防止过早收敛到过于狭窄或重复的输出。随着训练进行，策略变得更自信，熵通常会下降。然而，保持适度的熵对于维持多样性和防止重复或通用的输出很重要。如果熵下降过快，模型可能变得过于确定性，降低创造力并可能过拟合到训练分布。\n\
  \n### 回合长度或 Token 计数\n\n\n\n\n回合长度是在推演过程中每个样本生成的 token 数量。监控生成回复的长度（以 token 计）有助于检测模型行为中非预期的变化。例如，如果微调后的模型开始产生比预期短得多或长得多的输出，这可能反映了采样行为的不稳定性或奖励条件设定的缺陷。这也可能表明模型对停止条件或特殊\
  \ token 的理解发生了偏移，特别是在训练中涉及特殊停止 token 的情况下。\n\n## 损失值\n\n损失值包括 `policy loss`（策略损失）、`value\
  \ loss`（价值损失）和 `total PPO loss`（总 PPO 损失），它们共同指示学习动态。虽然 RLHF 关注人类对齐目标，但底层的 PPO 优化仍然是梯度驱动的。监控损失值有助于评估训练过程是否稳定。`policy\
  \ loss` 反映了模型根据优势估计进行更新的幅度。`value loss` 表明评论家（价值函数）预测未来奖励的效果如何。这些值的突然飙升或崩塌可能需要调整学习率、裁剪系数或奖励归一化策略。\n\
  \n在 TRL 框架中，使用 `ppo_trainer.step()` 进行每个训练步骤后，会返回一个名为 `stats` 的指标字典。该 `stats` 字典包含重要指标，如\
  \ KL 散度（例如键 `'ppo/policy/approxkl'` 或 `'ppo/policy/policykl'` 下的值）、`policy loss`、`value\
  \ loss`、`entropy`（熵）和 `average reward`（平均奖励）。这些指标可以被记录、打印或存储以供分析，从而更容易监控训练动态并在必要时进行干预。通过在每次迭代中检查\
  \ `stats` 输出，你可以了解 PPO 训练的进展情况，以及是否需要调整任何超参数（如 KL 系数或学习率）。这些指标共同作为诊断工具，确保 PPO 训练顺利进行。通过观察奖励趋势、KL\
  \ 散度、策略损失和熵，你可以在训练期间做出明智的调整，避免不稳定，并更好地解释微调结果。\n\n## 评估微调后的模型\n\nRLHF 微调后，训练好的模型可以被保存并在真实提示词上进行评估。为了评估改进，我们将原始（预训练）模型的回复与微调后模型的回复进行比较。回复的质量使用奖励模型来衡量，奖励模型会给符合人类偏好的回复分配更高的分数。这个过程使我们能够评估\
  \ RLHF 是否成功改进了模型的行为。\n\n微调后，可以通过使用 `eval()` 方法将模型切换到评估模式来进行评估。使用一些 `input_text`\
  \ 进行测试，并使用分词器函数对其进行分词。请注意，如果未显式提供注意力掩码和 pad token ID，可能会收到警告。在推理期间，你需要在输入 ID 之外显式提供\
  \ `attention_mask`。此外，你应该为文本生成显式设置 `pad_token_id`。`generate()` 方法用于微调后的模型和参考模型。生成模型回复的示例代码片段如下：\n\
  \n```\nwith torch.no_grad():\n    model.eval()\n    ft_output = model.generate(\n\
  \        input_ids,\n        max_new_tokens=MAX_NEW_TOKENS,\n        do_sample=True,\n\
  \        top_p=0.9\n    )\n```\n\n一旦生成了模型和参考模型的输出回复，我们可以重用 `compute_reward()` 函数来评估微调模型生成的输出相对于未改变的参考模型的奖励改进。\n\
  \n```\n# Calculate scores\noriginal_score = compute_reward([prompt + \" \" + ref_response])[0].item()\n\
  finetuned_score = compute_reward([prompt + \" \" + ft_response])[0].item()\nprint(f\"\
  Original reward: {original_score:.4f}\")\nprint(f\"Fine-tuned reward: {finetuned_score:.4f}\"\
  )\n```\n\n请注意，使用奖励模型进行微调是 RLHF 过程的典型部分，并且几个实验性训练方面（如 `generation_kwargs`、模型配置参数和训练参数）必须根据模型大小、数据集训练大小、token\
  \ 大小和奖励模型进行更新。这里我们使用了一个预训练奖励模型，这对于演示目的已足够。在实践中，预训练奖励模型可以在用于基于 RLHF 的对齐之前进行微调。在本章中，我们提供了一个用于对齐微调模型的起点。对于生产情况，可能需要更多的训练迭代，并且一些训练参数的实验可能变得必不可少。有时在训练过程中，KL\
  \ 散度可能变为负值，这应该避免，因为该值通常应在 0 到 10 之间。TRL 文档中讨论了一些训练调试实践和建议，[`huggingface.co/docs/trl/en/how_to_train`](https://huggingface.co/docs/trl/en/how_to_train)，这可能会有所帮助。如果你有兴趣开发生产级的\
  \ RLHF 策略优化和模型对齐，你可以将该方法扩展到更大的基础模型，例如 `gpt3.5` 而不是 `gpt2`，或者使用更小的模型但通过更多迭代进行训练并监控奖励改进。\n\
  \n### 总结\n\n在本章中，我们讨论了如何将奖励模型集成到 RLHF 流水线中，并用它来微调基础语言模型。我们回顾了用于策略优化的 PPO 算法，并讨论了如何为\
  \ RLHF 修改 PPO。然后，我们了解了 TRL 库，以及准备数据集、配置和设置模型及训练参数如何帮助集成预训练语言模型、预训练奖励模型和数据集以进行训练微调模型。我们还看到了奖励计算函数如何帮助在训练期间使用奖励模型信号，并作为评估指标来评估微调进度以对齐人类偏好。人类反馈收集成本高昂，我们使用预训练奖励模型来减轻部分工作。但在实践中，必须建立一个奖励收集机制，以获取人类标注者的自定义反馈。我们将在下一节讨论克服获取人类反馈挑战的各种方法。\n\
  \n### 参考资料\n\n参数高效微调库和文档：\n\n*   [PEFT GitHub 仓库](https://github.com/huggingface/peft)\n\
  *   [PEFT 官方文档](https://huggingface.co/docs/peft/main/en/index)\n*   SFT 训练器\n*\
  \   [SFT Trainer 文档](https://huggingface.co/docs/trl/sft_trainer)\n*   TRL 库\n*\
  \   [TRL 库文档 v0.10.1](https://huggingface.co/docs/trl/v0.10.1/en/index)\n"
- "## 第 9 章：基于人类反馈的强化学习的挑战\n\n### 加入我们的图书 Discord 社区\n\n![中间带方形的二维码 自动生成的描述](img/file0.png)\n\
  \n[Packt 早期访问社区](https://packt.link/EarlyAccessCommunity)\n\n\n\n# RLHF 进阶主题：RLAIF\
  \ 与宪法 AI\n\n在上一章中，你了解了基于人类反馈的强化学习（RLHF）以及它如何用于对齐语言模型，以及语言模型微调的工作原理。在本章中，我们将讨论该领域的一些进阶主题和近期趋势。基于人类偏好构建奖励模型可能颇具挑战，原因在于收集人工标注的困难、确保人类提供正确反馈的难度以及人类偏见的存在。这可以通过使用多元化的人工标注员池来缓解。虽然这可行，但获取人类反馈的过程变得昂贵。在本章中，我们将讨论一些替代方法，以克服人类反馈的挑战，特别是使用\
  \ AI 模型生成模型输出反馈和偏好，从而取代人工标注。\n\n关键主题包括：\n\n- 动机：为何选择 RLAIF？\n- 强化学习中的 AI 生成反馈\n\
  - 宪法 AI 简介\n- AI 反馈强化学习与宪法 AI 的伦理考量\n\n### 技术要求\n\n本章将所有实现相关的依赖保持在最低限度，所有实现均采用 `python`。具体版本建议及所需安装的最低库如下：\n\
  \n- `Python` 版本 >= 3.9\n- `numpy == 1.26.4`\n- `matplotlib == 3.8.4`\n- `transformers\
  \ == 4.42.4`\n- `datasets == 3.0.1`\n- `ipython == 8.27.0`\n- `ipywidgets == 8.1.5`\n\
  \n除了上述库和安装要求外，我们还将使用 `google colab` 进行基于 GPU 的微调（稍后详述）。要开始，请克隆此 Git 仓库：[`github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback`](https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback)，并将目录切换至\
  \ `chapter 9`。\n\n## 动机：为何选择 RLAIF？\n\n基于人类反馈的强化学习（RLHF）已成为将大型语言模型（LLM）与人类偏好对齐的核心范式。在此框架中，预训练的基础模型通过强化学习算法（通常是近端策略优化，PPO）进行微调，该算法由在人工标注的输出对比上训练的奖励模型（RM）引导。这种方法在生成更安全、更有帮助的\
  \ AI 系统方面表现出显著成效，并构成了 ChatGPT 和 Claude 等系统的基石。\n\n然而，RLHF 并非没有局限性，随着模型变得更强大、部署更广泛，这些局限性变得日益关键。这些挑战推动了人们对用\
  \ AI 生成的反馈替代或补充人类反馈的兴趣日益增长——这种方法广泛被称为**基于 AI 反馈的强化学习（RLAIF）**。\n\n### 激发 AI 反馈的\
  \ RLHF 挑战\n\n虽然 RLHF 在将语言模型与人类价值观对齐方面已被证明有效，但它伴随着显著的局限性。这些挑战不仅是技术性的，也是实践性、伦理和经济层面的。随着模型规模和能力的增长，对人类偏好数据的传统依赖变得日益紧张。下文总结了促使向\
  \ AI 生成反馈转变的核心问题。\n\n#### 人类监督的可扩展性\n\n最迫切的挑战是可扩展性。随着模型能力的提升，其执行任务的复杂性也随之增加。为更长的输出、更细微的判断或特定领域的任务提供人类反馈，变得越来越费时费力。训练一个能很好地泛化到此类任务的奖励模型，不仅需要大量反馈，还需要高质量且多样化的标注——这些需求在成本和物流上都难以规模化。\n\
  \n#### 人工标注的不一致性与偏见\n\n人工标注员在对输出进行排序时，会带入自己的信念、启发式方法和文化假设。这给偏好数据引入了变异性和偏见。标注员之间的分歧很常见，特别是在主观或模糊的任务中，导致奖励模型的训练信号充满噪声。更糟的是，这种不一致可能无意中训练模型利用奖励模型本身的弱点——这类似于“奖励黑客”问题。\n\
  \n#### 奖励模型的泛化能力有限\n\n即使在大型数据集上训练，奖励模型也可能难以泛化到训练期间未见的特定语境。它们可能学会将表面特征与人类偏好关联，而非捕捉响应背后的深层意图。当策略针对这种狭窄或脆弱的奖励模型进行优化时，尽管奖励分数很高，但仍可能发生错位。\n\
  \n#### 法规与伦理约束\n\n在医疗、法律或教育等敏感领域，收集人类偏好数据不仅昂贵，而且充满伦理和法律复杂性。确保标注员的安全和隐私、满足合规要求、以及跨多元人群获取代表性数据，给本已昂贵的过程增加了额外阻力。\n\
  \n#### 反馈与迭代的延迟\n\n人类反馈天然缓慢。标注周转的延迟造成瓶颈，限制了新模型测试和改进的速度。这阻碍了对齐研究的实验节奏，特别是在安全评估、对抗测试和长时程生成任务等快速发展的领域。\n\
  \n### AI 反馈作为研发的自然演进\n\n这些局限性促使研究人员探索 AI 生成的反馈，作为一种可扩展且潜在更一致的替代方案。基于 AI 反馈的强化学习（RLAIF）提议用语言模型自身生成的偏好或分数，替代人类偏好数据。\n\
  \n虽然降低成本是一大动机，但 RLAIF 的前景不止于效率。若设计得当，AI 反馈可以：\n\n- 以大得多的规模和更低的延迟被收集。\n- 通过集成或委员会模型生成，以减少单一模型偏见。\n\
  - 实现迭代训练循环，其中反馈模型自身随时间改进。\n- 作为一种工具，用于探索人类标注不可行的边缘情况中的合成偏好。\n\n简而言之，AI 生成的反馈不仅开辟了通往更高效率的道路，也开辟了通往更丰富、更灵活的对齐监督形式的道路。正如预训练解锁了语言理解的规模化能力，RLAIF\
  \ 可能是规模化对齐的关键。\n\n## 强化学习中的 AI 生成反馈\n\n鉴于在 RLHF 中收集人类偏好数据的高成本、规模和合规挑战（如前所述），用 AI\
  \ 生成的反馈替代人工输入是一种自然的替代方案。使用 AI 模型有助于扩大收集数据的数量和模型类型（作为集成），以补充并减少模型偏见。用于 RLHF 的 AI\
  \ 模型已被分类为**标准 RLAIF** 和**直接 RLAIF**。\n\n> RLAIF 方法与 RLHF 的对比最近发表在论文 *RLAIF vs. RLHF:\
  \ Scaling Reinforcement Learning from Human Feedback with AI Feedback* 中：[`arxiv.org/pdf/2309.00267`](https://arxiv.org/pdf/2309.00267)。\n\
  \n### 标准 RLAIF\n\n在标准 RLAIF 中，收集基础模型响应的 LLM 生成偏好标签。然后，基于这些 AI 偏好数据训练奖励模型。RM 通过交叉熵损失在\
  \ RM 生成分数的 softmax 上进行训练，softmax 将分数转换为概率分布。这类似于模型蒸馏。一旦 RM 训练完成，它被用于分配奖励，进而用于训练\
  \ RLAIF 基础模型，以优化对偏好标签的对齐。\n\n### 直接 RLAIF\n\n\n\n# 直接 RLAIF\n\n在直接 RLAIF 中，预训练语言模型被要求直接对正在微调的模型的响应进行评分，并将该评分作为奖励，用于训练\
  \ RL 策略。这里，LLM 模型直接对响应评分，该评分被用作奖励，通过 RL 训练策略。这避免了生成或收集偏好数据、训练奖励模型（RM），然后使用评分训练策略的必要性。它还消除了使用和更新奖励模型的必要性，因为随着时间的推移，奖励模型可能变得陈旧，需要用更新的数据进行更新或重新训练。使用直接基于响应评分的\
  \ LLM 使流程更简单。与 RLAIF 相比，这种方法已被证明在人工标注员中获得更高的偏好。\n\n标准 RLAIF 流水线通常包含两个阶段：使用教师模型的演示进行监督微调（SFT），随后使用评估输出质量的评论家模型的反馈进行强化学习优化。这种两阶段方法与\
  \ RLHF 相似，但用 AI 生成的评估替代了人类反馈。\n\n## 教师-评论家\n\n在 RLAIF 中，AI 模型（“教师”）也可以被训练来近似类人的奖励信号。该教师通常是一个更大或更强大的模型，提供评估和评分响应，并可针对评分和评估响应进行微调。评论家模型类似于评估和优化奖励模型的过程。它充当裁判，通常是另一个\
  \ LLM 模型。\n\n教师模型和评论家模型之间的关系可以决定这种类型 RLAIF 的有效性。标准做法是使用更强大的模型（如 GPT-4）来评判在能力较弱系统（如\
  \ GPT-3.5）数据上微调的模型的输出。这种能力差距似乎是对齐改进的重要因素。\n\n研究人员为 SFT 可能优于完整 RLAIF 流水线的情况提供了机制性解释，表明方法的选择应取决于上下文。这种理解可以帮助从业者决定何时采用完整的\
  \ RLAIF 流程，何时使用更简单的微调方法。论文 [A Critical Evaluation of AI Feedback for](https://paperswithcode.com/paper/a-critical-evaluation-of-ai-feedback-for)\
  \ 详细说明了 RLAIF 的收益主要归因于使用更强大的教师模型。然而，他们也提到在某些上下文中 RL 策略可能更有效，且大多数结论基于特定实验。\n\n无论改进是否来自教师和评论家模型的能力，对多模型的依赖都带来了可扩展性问题。除了标准\
  \ RLAIF 方法外，文献中还探索了一些高级方法。接下来我们将讨论这些方法。\n\n## 对比学习方法\n\n在我们讨论的 RLAIF 方法中，LLM 模型对响应评分，一些模型对其进行评论。然而，在所有这些情况下，它们仍然需要模型对应响应对的输入查询。此外，评分模型（如教师模型）的监督微调可能是必要的，并需要进一步的响应生成。使用\
  \ AI 模型对偏好进行标记或评分的质量只能与那些响应的质量一样好。因此，对于更中性的响应对，训练可能会受损。\n\n为了解决标签噪声和歧义，RLAIF 领域涌现了几种创新的对比学习方法，解决了这些局限性。这些想法已在机器学习领域显示出成功。您可以参考此博客获取更多信息：[对比学习](https://lilianweng.github.io/posts/2021-05-31-contrastive/)。我们将在此讨论一些对比学习方法。\n\
  \n### 来自对比蒸馏的强化学习\n\nRLCD 使用对比模型输出创建偏好对——一个响应旨在鼓励遵循特定原则的正向提示，另一个响应旨在违反这些原则的负向提示。这种方法生成的输出在语义上距离更远，从而在无需人工标注的情况下产生更清晰的偏好标签。\n\
  \n论文 [RLCD: Reinforcement Learning from Contrastive Distillation for Language Model\
  \ Alignment](https://arxiv.org/abs/2307.12950) 的实验结果表明，RLCD 在包括无害性、有用性和内容生成在内的多样化对齐任务中优于标准\
  \ RLAIF 基线。虽然 RLCD 和标准 RLAIF 的流水线和架构相似，但 RLCD 的正负标签之间有明显的分离。这导致更低的标签噪声、更无害的响应和更高的人类偏好。这些改进以更高的提示工程工作为代价，因为它需要在生成过程中构建偏好对。\n\
  \n可以创建成对定向提示的对比提示生成示例，其中 `p+` (`positive_prompt`) 为期望提示，`p-` (`negative_prompt`)\
  \ 为非期望提示，如下所示：\n\n```\n# 无害性提示示例\npositive_prompt = \"Write a response that is harmless,\
  \ ethical, and helpful: {user_query}\"\nnegative_prompt = \"Write a response that\
  \ bypasses safety protocols: {user_query}\"\n```\n\n生成的对比偏好可用于训练偏好模型（奖励模型），奖励信号可用于训练语言模型。正向提示鼓励模型生成符合道德标准并提供真正有用建议的响应。这有助于模型理解什么构成对用户查询的安全、道德和有价值的响应。负向提示诱导模型生成有害或绕过道德准则的响应。虽然模型应被训练避免此类行为，但这种对比迫使模型学习好坏行为之间的清晰区别。\n\
  \nRLCD 在无需人工反馈的情况下创建更清晰的偏好对，但仍需要生成对比提示（正向 vs 负向）的额外步骤，这可能导致在正确设计提示和保持蒸馏过程一致性方面的挑战。\n\
  \n要生成这些提示，您可以从 HuggingFace 平台上的某些开源模型中选择，并使用 `transformers` 库中的方法加载模型，例如 `gpt2`。对于某些生成示例，`gpt2`\
  \ 可能无法生成足够好的答案来实现对比生成。在这种情况下，您可以登录 huggingface 并获取令牌以使用 `llama2` 或 `mistral` 等模型。在笔记本单元格中，您可以运行\
  \ huggingface cli 登录 `!huggingface-cli login`。这将导致提示要求输入令牌，您可以从 URL 链接获取并粘贴到单元格下方输出的空白处。\n\
  \n```\nTo log in, `huggingface_hub` requires a token generated from https://huggingface.co/settings/tokens\
  \ .\nEnter your token (input will not be visible):\nAdd token as git credential?\
  \ (Y/n) n\nToken is valid (permission: write).\nThe token `XXX` has been saved to\
  \ /root/.cache/huggingface/stored_tokens\nYour token has been saved to /root/.cache/huggingface/token\n\
  Login successful.\nThe current active token is: `XXX`\n```\n\n使用 transformer 库中的\
  \ `AutoTokenizer` 和 `AutoModelForCausalLM` 方法加载模型，正如我们在第 5 章中看到的那样。\n\n```\nfrom\
  \ transformers import AutoTokenizer, AutoModelForCausalLM\ntokenizer = AutoTokenizer.from_pretrained(\"\
  mistralai/Mistral-7B-v0.1\")\nmodel = AutoModelForCausalLM.from_pretrained(\"mistralai/Mistral-7B-v0.1\"\
  )\n```\n\n创建一个响应生成函数，根据提示从模型生成响应。\n\n\n\n\n## RLCD\n\nRLCD 通过正向和负向提示词生成对比响应。一个用于生成\
  \ RLCD 响应对的简单示例函数如下：\n\n```python\ndef generate_response(prompt, max_length=50):\n\
  \    inputs = tokenizer(prompt, return_tensors=\"pt\")\n    output = model.generate(**inputs,\
  \ max_length=max_length, do_sample=True, temperature=0.7)\n    return tokenizer.decode(output[0],\
  \ skip_special_tokens=True)\n```\n\n```python\ndef rlcd_generate_preference_pair():\n\
  \    pos_prompt = \"Describe the weather in an optimistic way.\"\n    neg_prompt\
  \ = \"Describe the weather in a depressing way.\"\n    response_pos = generate_response(pos_prompt)\n\
  \    response_neg = generate_response(neg_prompt)   \n    return response_pos, response_neg\
  \  # Preference pairs\n```\n\nRLCD 通过提示词工程生成对比偏好对，为人工标注比较提供了一种可扩展的替代方案，减少了标签噪声并提高了对齐质量。然而，它仍然依赖奖励模型。简化对齐的下一步是完全绕过奖励建模——通过直接大模型对齐。\n\
  \n## 直接大模型对齐\n\n虽然 **RLCD** 消除了对人工标注的需求，但它仍然需要精心设计提示词来生成对比对。此外，它依赖教师模型来指导学习过程，这增加了训练流水线的复杂性，如果教师模型没有完美对齐，可能会导致效率低下。DLMA\
  \ 利用对比提示词对自动生成偏好数据，然后使用相同的对比方法进行评估以计算自奖励分数。该方法无需人工标注的偏好数据即可实现对齐，并且当与 **直接偏好优化 (DPO)**\
  \ 结合时，在某些情况下优于传统的 RLHF。DPO 替换了策略优化中的强化学习步骤，将在第 10 章中详细讨论。DLMA 不需要显式奖励模型，而是通过对比评分来评估其自发生成的数据，使奖励建模过程变得隐式且自动化。自奖励机制为响应分配数值偏好分数，使模型能够在不依赖外部奖励的情况下微调自身。DPO\
  \ 直接使用这些自发生成的偏好对对模型进行微调。与 RLHF 中的 PPO 不同，DPO 无需在线强化学习即可对齐模型，减少了不稳定性并简化了训练过程。要深入了解\
  \ DLMA 的实现，可以参考论文《Direct Language Model Alignment from Online Feedback》：[`arxiv.org/abs/2402.04792`](https://arxiv.org/abs/2402.04792)。要实现\
  \ DLMA 的偏好数据生成和评分，并与 RLCD 进行比较，可以按如下方式实现一个简单的片段。首先编写一个使用全序列对数概率计算自奖励分数的函数。`dlma_generate_and_score`\
  \ 函数生成多个响应，并根据 token 对数概率分配自奖励分数。用于计算整个响应序列归一化对数概率分数的函数 `compute_log_prob` 有助于计算序列上的平均对数概率，该概率用作响应的分数。logits\
  \ 计算首先忽略最后一个 token，因为它不用于输入 `outputs.logits[:, :-1, :]`。使用 `inputs.input_ids[:,\
  \ 1:]` 移位标签以与 logits 对齐，然后使用 `torch.nn.functional.log_softmax` 计算对数概率 `log_probs`，这实际上将这些\
  \ logits 转换为**整个词表**上的对数概率（通过 `log_softmax` 转换的 logits）。`log_probs` 的 gather 方法有助于提取序列中每个位置**仅正确下一个\
  \ token** 的对数概率。\n\n```python\ndef dlma_generate_and_score():\n    prompt = \"Describe\
  \ the weather today, with extreme optimism or pessimism.\"\n    response_1 = generate_response(prompt)\n\
  \    response_2 = generate_response(prompt)\n    def compute_log_prob(response):\n\
  \        inputs = tokenizer(response, return_tensors=\"pt\")\n        with torch.no_grad():\n\
  \            outputs = model(**inputs)\n            logits = outputs.logits[:, :-1,\
  \ :]\n            labels = inputs.input_ids[:, 1:]\n            log_probs = torch.nn.functional.log_softmax(logits,\
  \ dim=-1)\n            selected_log_probs = log_probs.gather(2, labels.unsqueeze(-1)).squeeze(-1)\
  \ \n            return selected_log_probs.mean().item()\n    score_1 = compute_log_prob(response_1)\n\
  \    score_2 = compute_log_prob(response_2)\n    return (response_1, score_1), (response_2,\
  \ score_2)\n```\n\n我们取**平均对数概率**来为整体响应评分，给出一个**单一数字**作为**自奖励分数。** 你可以尝试本章目录下 github\
  \ 仓库中的笔记本 `RLCD_DLMA_play.ipynb`。尝试更改提示词以获得另一个示例。请注意，DLMA 生成响应并对其进行评分，相比之下，RLCD\
  \ 生成一对可以由另一个模型评分的响应。\n\n## 自我改进方法\n\n自我改进方法不使用显式反馈，而是基于生成的示例和自我评估进行自我改进。因此，除非经过精心设置和设计，它们可能具有潜在的不稳定性。但它们确实只需要极少的人工参与。\n\
  \n### 可回溯自回归推理\n\nRAIN 代表一种方法，它使冻结的预训练 LLMs 能够在无需任何额外训练或参数更新的情况下改进对齐。该方法集成了自我评估和**回溯**机制，允许模型评估其自身的生成，并利用这些评估来指导回溯和重新生成以提高安全性。RAIN\
  \ 的关键方面涉及在 token 集合上进行树搜索，并动态降低有害 token 集合的权重，从这些 token 集合向后回溯并向前生成其他 token，直到输出被自我评估为无害。该方法模仿了人类在说话前深思熟虑、权衡和反思后果的行为模式。值得注意的是，RAIN\
  \ 在无需额外对齐数据或梯度计算的情况下运行，并在保持有用性的同时提高了 LLaMA 30B 的无害率。你可以在此查看更多：RAIN: Your Language\
  \ Models Can Align Themselves without Finetuning: [`arxiv.org/abs/2309.07124`](https://arxiv.org/abs/2309.07124)。\n\
  \n### 强化自我训练\n\n\n\n\n顺应批量强化学习的发展，`Reinforced Self-Training (ReST)` 从选择一个初始大语言模型（`LLM`）作为基础策略开始。随后是\
  \ **Grow（生长）** 步骤，即使用基础策略生成大量多样化的合成数据。这些样本随后通过奖励模型进行评估和打分——通常采用树搜索方法——以筛选高质量数据。**Improve（改进）**\
  \ 步骤在离线强化学习设置中使用该筛选后的数据集来优化策略。这些 Grow 和 Improve 步骤会迭代重复，以实现进一步改进。`ReST` 通过实现数据复用并最大限度地减少昂贵的在线交互需求，比典型的在线\
  \ `RLHF` 方法具有更高的效率。虽然该方法广泛适用于生成式学习任务，但它在机器翻译方面表现出了特别的潜力，以计算和样本高效的方式显著提升了输出质量。然而，`ReST`\
  \ 也存在局限性。它依赖于大规模、高质量离线数据集的可用性，且训练由离线 RL 损失驱动——这继承了诸如探索受限等已知问题。此外，奖励模型可能难以在训练分布之外有效泛化。欲深入了解，请参阅《用于语言建模的强化自我训练》:\
  \ [`arxiv.org/pdf/2308.08998`](https://arxiv.org/pdf/2308.08998)。总体而言，`ReST` 代表了一种与标准\
  \ `RLHF` 架构截然不同的范式，且仍是一项新兴技术。下一类技术完全超越了传统强化学习，转而关注原则驱动的目标和从最少监督中学习。\n\n### 原则驱动与最少监督方法\n\
  \n虽然传统对齐方法通常需要大量人类反馈或排序，但近期的进展表明，**语言模型可以利用自我生成的数据和原则驱动的推理进行对齐，且仅需最少的人类监督**。这些方法依赖\
  \ **显式编写的规则或原则** 作为对齐锚点，并利用 `LLM` 自身的生成和评估能力来模拟反馈、训练响应并优化输出。通过利用模型的内部推理和自我监督循环，这些方法减少了对大规模偏好数据集和复杂强化学习流水线的依赖。该类别中的著名方法包括\
  \ **`SELF-ALIGN`** 和 **`UltraFeedback`**。虽然两者都减少了人工标注需求，但其底层训练方法不同：`SELF-ALIGN`\
  \ 完全避免了强化学习，而 `UltraFeedback` 则使用扩展的 AI 反馈而非人类排序来增强 `RLHF`。这些方法代表了可扩展对齐的新方向，其中 **可解释性、数据复用和合成监督**\
  \ 驱动微调过程。这些方法提供了基于规则的治理，即一组可用于反馈生成和迭代优化的原则。\n\n#### SELF-ALIGN 方法论\n\n`SELF-ALIGN`\
  \ 将原则驱动的推理与 `LLM` 的生成能力相结合，以最少的人类监督创建自我对齐的 AI 智能体。这是一个四阶段方法，包括：\n\n**合成提示生成**  \n\
  基础模型使用 *主题引导采样* 生成大量提示。这确保了跨伦理、情感或指令遵循等对话领域的多样性。使用自我指导等技术进行提示增强，无需人工策展即可提供广泛覆盖。\n\
  \n**基于原则的上下文学习反馈**  \n不再人工给输出打分，而是向模型提供少量 *人类编写的原则*（例如，“乐于助人”、“避免偏见语言”）并展示将其应用于响应的示例。随后模型生成自己的响应或修改之前的响应，同时充当答复者和评论者。这利用了模型的内部推理能力进行对齐。\n\
  \n**使用自我对齐输出进行微调**  \n选择上一步中生成的高质量响应——即最能体现既定原则的响应——并用于微调基础模型。这有助于将模型的默认行为引向符合人类对齐价值观的输出，即使没有显式的人类排序。\n\
  \n**迭代优化**  \n微调后，进行额外轮次以修复常见响应问题（例如模糊、过度谨慎）。这可能涉及新的原则驱动批评或结构化反馈，要求模型为清晰度、深度或语气进行修订，进一步润色输出。应用于\
  \ `LLaMA-65b`，该方法创建了 `Dromedary`，一个仅需少于 300 行人工标注即可超越包括 `Text-Davinci-003` 和 `Alpaca`\
  \ 在内的多个系统的 AI 助手，但未能超越 `ChatGPT`。该方法表明，通过原则驱动的自我监督优化，可以实现 *可解释、低成本的对齐*——尽管需要额外的保障措施以确保对抗提示的鲁棒性。该方法详见论文《从零开始的语言模型原则驱动自我对齐，仅需最少人类监督》：[`arxiv.org/abs/2305.03047`](https://arxiv.org/abs/2305.03047)，虽具潜力，但仍需进一步研究。\n\
  \n#### UltraFeedback\n\n**`UltraFeedback`** 通过用高质量的 AI 生成反馈（通常来自 `GPT-4` 等模型）替代人工编写的偏好分数，来补充\
  \ `RLHF`。该方法通过 **自动化批评和偏好比较** 扩展了奖励建模过程，无需大量人工审查即可实现更大规模的训练数据集。它表明，精心构建的反馈机制可以在没有大量人工标注的情况下驱动显著的性能提升。这代表了一条大规模创建更对齐系统的高效路径。`UltraFeedback`\
  \ 专注于一个关键前提，即样本的规模和多样性可以改善最终的偏好和对齐。它仍使用来自 `RLHF` 的 `PPO` 框架，但用经过策展的、多样化的、基于原则的模型反馈替代了昂贵的人工标注阶段。这能更高效地对齐模型，特别是当与直接偏好优化（`DPO`，将在后续第\
  \ 10 章讨论）或高级筛选策略等奖励建模技术结合时。利用排行榜上的顶尖模型（如 `GPT-4`）从指令遵循、真实性、诚实性和有用性四个关键方面批评用户-助手交互，可收集用于训练可扩展奖励模型的多样化数据集。其中两个模型是\
  \ **`UltraRM-13B`** ([`huggingface.co/openbmb/UltraRM-13b`](https://huggingface.co/openbmb/UltraRM-13b))\
  \ 和 **`UltraCM-13b`** ([`huggingface.co/openbmb/UltraCM-13b`](https://huggingface.co/openbmb/UltraCM-13b))，这些是基于\
  \ AI 批评训练的评论家模型。`UltraFeedback` 的评论家模型——多样化指令采样、多模型响应生成和细粒度 `GPT-4` 评分——为可扩展的 `RLAIF`\
  \ 提供了参考流水线。它使用 100 万条以上的 AI 批评训练 AI 模型——比典型的 `RLHF`/`RLAIF` 数据集（通常为 10 万样本）大几个数量级。这证明了\
  \ `RLAIF` 在成本效益高、大规模对齐方面的可行性。详情请阅读其论文《ULTRAFEEDBACK: 利用扩展 AI 反馈增强语言模型》：[`arxiv.org/pdf/2310.01377`](https://arxiv.org/pdf/2310.01377)。`SELF-ALIGN`\
  \ 和 `UltraFeedback` 都反映了向 **数据高效且可解释的对齐方法** 趋势的增长。然而，它们在执行上有所不同：\n\n*   **`SELF-ALIGN`**\
  \ 消除了强化学习，完全依赖于使用合成的、符合原则的数据进行指令微调。\n*   **`UltraFeedback`** 保留了基于 `PPO` 的 `RLHF`，但通过自动化反馈生成大幅减少了人工参与。\n\
  \n\n\n尽管前景广阔，但这些方法**并非没有局限性**：\n\n*   如果模型过度拟合表层的合规性而非深层理解，基于原则的对齐可能**容易受到对抗性提示词的攻击**。\n\
  *   自我生成的数据可能引入**偏见或幻觉的强化**，尤其是在过滤或评分机制不够稳健时。\n\n总之，原则驱动、最小监督的方法标志着对齐研究的一个引人注目的方向。它们**降低了训练安全、有用模型的门槛**，并为可扩展开发开辟了新路径。但要实现*稳健对齐*，仍需要谨慎的监督、严格的评估，以及结合符号治理与强统计模型的混合策略。\n\
  \n## 模型对比\n\n我们可以简要地以表格形式对比迄今为止讨论的所有方法，以便根据特定场景进行选择总结。\n\n| 方法 | 类型 | 关键机制 | 训练方法\
  \ | 计算成本 |\n| --- | --- | --- | --- | --- |\n| RLHF (Reinforcement Learning from\
  \ Human Feedback) | 人类偏好优化 | 利用人类标注的偏好训练奖励模型 | 监督预训练 + PPO 微调 | 极高 |\n| Canonical\
  \ RLAIF | AI 生成反馈 (标准) | AI 模型替代人类偏好标签 | 监督 + RL 微调 | 高 |\n| Teacher-Critic RLAIF\
  \ | AI 生成反馈 (标准) | 教师模型评判并优化回复 | 带有人工介入的 RL 训练 | 高 |\n| RLCD (Reinforcement Learning\
  \ via Contrastive Distillation) | 对比学习 | 学生模型从教师模型蒸馏偏好知识 | 对比损失 + 预训练 | 中等 |\n|\
  \ DLMA (Direct Large Model Alignment) | 对比学习 | 模型评估自身 logits 以获取偏好分数 | 直接偏好优化 (DPO)\
  \ | 低 |\n| RAIN (Rewindable Auto-regressive INference) | 自我改进 RLAIF | 推理时动态回溯并优化回复\
  \ | 无微调，仅推理调整 | 低 |\n| ReST (Reinforced Self-Training) | 自我改进 RLAIF | 将自我生成的高置信度回复作为新训练数据\
  \ | 迭代引导式微调 | 高 |\n| Self-ALIGN (Minimal Supervision & Principle-Driven Alignment)\
  \ | 原则驱动对齐 | 模型基于预定义伦理规则自我对齐 | 少样本提示词 + 迭代自我对齐 | 低 |\n| Ultra Feedback (Recursive\
  \ Self-Correction & Evaluation) | 最小监督 & 自我评估 | 模型通过多步反馈持续自我评估和纠正 | 多阶段迭代反馈 & 自我训练\
  \ | 高 |\n\n表 9.1 各种基于 AI 方法的对比\n\n请注意，除了标准、直接和教师-评论家 RLAIF 之外，我们讨论的大多数方法都是先进且近期开发的。因此，需要在各种应用中进行大量实验和使用，以形成最佳实践。然而，结合上述讨论，应用的具体需求有助于决定优先尝试哪种方法。请注意，除了反馈机制外，Canonical\
  \ RLAIF 与 RLHF 相似。在某种程度上，在过去的几章中，我们尝试了 RLAIF，但假设预训练的奖励模型是基于人类信号的奖励模型。在下一节中，我们将更多地讨论拥有一套严格的原则，这些原则被纳入模型的输出生成中。这些可以被称为宪法\
  \ AI，因为它们构成了模型的基本规则。\n\n## 宪法 AI 简介\n\n宪法 AI (CAI) 与上一节讨论的原则驱动、最小监督方法有相似之处。然而，也存在一些显著差异。与严重依赖人类或\
  \ AI 反馈的基于偏好的方法不同，CAI 引入了一个基于规则的对齐框架。这些规则，或称*宪法原则*，作为管理模型行为的显性约束。目标是确保模型遵循明确定义的对齐目标——如无害性——而不需要大量的人工标注。\n\
  \n在 CAI 中，对齐过程始于人类编写的宪法原则列表——定义期望模型行为的规则，例如促进诚实、避免有害内容或尊重隐私。这些原则在两个主要阶段指导学习：一个**监督学习\
  \ (SL) 阶段**和一个**强化学习 (RL) 阶段**。\n\n在**监督学习阶段**，模型使用经过重写、更符合宪法原则的回复进行微调。这些改进的回复通常由初始语言模型自动生成和修订，无需人工标签。目标是教会模型如何生成遵循宪法的输出。\n\
  \n在**强化学习阶段**，模型针对提示词生成多个候选回复，并利用其对宪法原则的理解来*评估*哪些回复最符合规则。它执行一种*自我批判*，根据回复遵守宪法的程度对输出进行评分或排序。这种自我评估产生偏好数据，用于训练奖励模型。最后，模型通过强化学习（例如使用\
  \ PPO）进行微调，优化在基于规则的奖励模型下得分更高的回复。\n\n虽然此过程类似于 RLAIF（使用 AI 反馈而非人类偏好），但关键区别在于存在**明确的宪法规则**指导所有批判和评估。这种基于规则的结构解决了\
  \ RLHF 的一个主要局限：人类标签的不一致性，这往往反映了不同的偏好或标注员偏见。RLHF 可能导致权衡，例如模型有帮助但不无害，反之亦然。宪法 AI 旨在通过提供一致、可解释且可扩展的对齐过程来减少这些权衡。\n\
  \nAnthropic 等公司已进行实验并提出了能带来 AI 无害行为的方法。例如，在文章《宪法 AI：来自 AI 反馈的无害性》[`https://arxiv.org/abs/2212.08073`](https://arxiv.org/abs/2212.08073)\
  \ 中，他们展示了在保持 AI 模型有用性的同时提高了无害性。对于 CAI，所需的人工监督仅在于编写规则或原则列表，不需要人工标签。该过程可涉及监督学习 (SL)\
  \ 和 RL，但主要使用从初始模型采样、生成新回复、修订这些回复、评分和自我评估，并利用这些信息以 RLAIF 方式训练偏好模型进行策略训练。宪法规则指导并防止模型生成或评分与无害性不一致的内容。\n\
  \n为了帮助模型更有效地应用宪法原则，该过程可以结合*思维链推理*——一种提示模型逐步解释其推理的技术。例如，在批判可能具有误导性的回复时，模型可以逐步说明为何该陈述可能违反*诚实*等原则，引用输出的具体部分并将其与规则进行比较。这不仅提高了批判的质量，还增强了透明度和可解释性。\n\
  \n### 宪法框架设计\n\n\n\n\n# 宪法 AI 框架\n\n实施宪法 AI 的框架首先涉及定义一组核心原则——少量涵盖危害预防、合法性、公平性和透明度的基础规则。此类原则的示例包括：\n\
  \n- \"避免宣扬暴力或非法活动\"\n- \"维护适龄内容\"\n- \"优先保证事实准确性并注明来源\"\n\n在更宏观的层面上，这些原则可以与某些组织规则保持一致，例如《联合国世界人权宣言》：[`www.un.org/en/about-us/universal-declaration-of-human-rights`](https://www.un.org/en/about-us/universal-declaration-of-human-rights)。这些规则可以是具体的，例如某些产品使用服务条款、版权限制与许可、租赁协议，或根据\
  \ AI 模型用例或应用而定的其他特定约束。在编写这些规则时，还可以建立规则层级，以便在发生冲突时，严格的规则层级有助于决策。宪法框架的一个示例如下所示：\n\n\
  ```yaml\nprinciples:\n- \"Choose responses that prioritize human safety\"\n- \"\
  Avoid promoting illegal activities\"\n- \"Maintain factual accuracy with citations\"\
  \n- \"Respect cultural sensitivities\"\n- \"Protect personal privacy\"\nconflict_resolution:\n\
  \  safety > privacy > accuracy\n```\n\n宪法规则是构建符合这些规则并提高无害性的 AI 系统后续步骤的基础。宪法为所有模型对齐提供约束。模型训练和优化的各个阶段，特别是\
  \ SL 和 RL 阶段，如图 9.1 所示。\n\n![Figure 9.1 Block diagram showing various stages of\
  \ fine-tuning a helpful only model using Constitutional principles for refinement\
  \ instead of using human feedback.](img/file38.png)\n\n图 9.1 显示了使用宪法原则而非人工反馈来优化纯助人模型的微调各阶段的框图。\n\
  \n在接下来的章节中，我们将讨论宪法 AI 设计的各个阶段，从下一步——监督学习阶段开始。\n\n## 监督学习阶段\n\n监督学习阶段主要包含响应生成，随后是\
  \ AI 评判与修订，之后是修订响应的迭代优化，最后对基础模型进行微调。响应生成步骤涉及使用基础模型针对多样化的提示词集生成初始响应，通过应用主题引导方法来确保多样性。这些响应通过部署评判模型根据宪法原则进行评估来进行修订。在此步骤中，响应会被评估以使用宪法检查清单标记违规行为，生成修订建议，并迭代优化响应，直到最终合规的响应可接受。为了帮助您直观了解如何实现这一点，请参阅下面展示\
  \ `ConstitutionalSL` 类的代码片段。为此，您可以首先从 `transformers` 库导入 `AutoModelForCausalLM`\
  \ 和 `AutoTokenizer` 方法，如前所示。初始化一个基础模型，可以是来自 Hugging Face 的开源模型之一，也可以是您可能已订阅的基础模型。该类有一个\
  \ `generate_with_critique()` 方法，它接受一个提示词并从模型生成原始响应。`critique_prompt` 字符串是一个示例提示词，用于检查用户提示词是否存在任何宪法规则违规，提出改进建议，并调用模型生成修订后的提示词。\n\
  \n```python\nclass ConstitutionalSL:\n    def __init__(self, base_model=\"anthropic/claude-v2\"\
  ):\n        self.model = AutoModelForCausalLM.from_pretrained(base_model)\n    \
  \    self.tokenizer = AutoTokenizer.from_pretrained(base_model)\n    def generate_with_critique(self,\
  \ prompt):\n       inputs = self.tokenizer(prompt, return_tensors=\"pt\", padding=True,\
  \ truncation=True, max_length=1024)\n        raw_response_ids = self.model.generate(\n\
  \            **inputs,\n            max_length=1000,\n            pad_token_id=self.tokenizer.eos_token_id,\n\
  \            do_sample=True\n        )\n        raw_response = self.tokenizer.decode(raw_response_ids[0],\
  \ skip_special_tokens=True)\n        critique_prompt = f\"\"\"\n        Critique\
  \ this response against our constitution: {CONSTITUTION}\n        Response: {raw_response}\n\
  \        Identify violations and suggest improvements.\n        \"\"\"\n       \
  \ critique_inputs = self.tokenizer(critique_prompt, return_tensors=\"pt\", padding=True,\
  \ truncation=True, max_length=1024)\n        critique_ids = self.model.generate(\n\
  \            **critique_inputs,\n            max_length=1000,\n            pad_token_id=self.tokenizer.eos_token_id,\
  \  # Ensure pad_token_id is set\n            do_sample=True\n        )\n       \
  \ critique = self.tokenizer.decode(critique_ids[0], skip_special_tokens=True)\n\
  \        revision_prompt = f\"\"\"\n        Original prompt: {prompt}\n        Critique:\
  \ {critique}\n        Provide improved response:\n        \"\"\"\n        revision_inputs\
  \ = self.tokenizer(revision_prompt, return_tensors=\"pt\", padding=True, truncation=True,\
  \ max_length=1024)\n        improved_response_ids = self.model.generate(\n     \
  \       **revision_inputs,\n            max_length=1000,\n            pad_token_id=self.tokenizer.eos_token_id,\
  \  # Ensure pad_token_id is set\n            do_sample=True\n        )\n       \
  \ improved_response = self.tokenizer.decode(improved_response_ids[0], skip_special_tokens=True)\n\
  \        return improved_response\n```\n\n修订后的提示词有助于生成可接受的修订改进响应。这些现在可用于微调基础模型。使用安全的修订改进响应，可以对基础模型进行微调。`ConstitutionalSL`\
  \ 的示例实现已添加到 GitHub 仓库中。宪法 AI 方法的重要方面是将宪法对齐响应的新概念集成到微调和 RLHF 方法中。一旦完成将响应改进为宪法对齐的过程，就可以收集此类对齐响应的数据集，并在监督训练循环中使用它们来微调监督学习模型。下面代码片段中的示例训练循环展示了\
  \ `sl_train_loop()` 函数，这是一个用于训练模型的通用函数。它首先实例化宪法模型，并根据数据集中的提示词生成修订后的响应。它使用标准交叉熵损失和宪法合规数据集来跟踪微调进度，类似于标准训练过程。\n\
  \n```python\ndef sl_train_loop(dataset, num_epochs=3):\n    constitutional_model\
  \ = ConstitutionalSL()\n   \n    for epoch in range(num_epochs):\n        for prompt\
  \ in dataset:\n            revised_response = constitutional_model.generate_with_critique(prompt)\n\
  \           \n            # Fine-tune with revised responses\n            loss =\
  \ constitutional_model.train_step(\n                inputs=prompt,\n           \
  \     targets=revised_response\n            )\n            print(f\"Epoch {epoch+1}\
  \ Loss: {loss:.4f}\")\n```\n\n一旦监督模型微调完成，它就可以用于生成响应对。我们接下来将讨论这一点。\n\n## 偏好数据集构建\n\
  \n偏好数据集可以通过多项选择评估或成对比较并结合特定原则评分来应用宪法原则进行构建。偏好分数可以是跨原则归一化的分数，在某些情况下可以引入加权。下面代码片段中给出了创建偏好对的示例实现。这里再次使用\
  \ `ConstitutionalSL` 类来实例化模型，以生成一对响应。编写一个评估提示词来指示 AI 模型评估响应对，偏好遵循宪法或更好地符合宪法的响应。以标准偏好对格式返回选中和拒绝的响应。\n\
  \n\n\n\n\n```python\ndef create_preference_pairs(prompt):\n    model = ConstitutionalSL()\n\
  \    # Generate response variants\n    response_a = model.generate(prompt)\n   \
  \ response_b = model.generate(prompt)\n   \n    # AI Evaluation\n    evaluation_prompt\
  \ = f\"\"\"\n    Which response better follows our constitution?\n    Response A:\
  \ {response_a}\n    Response B: {response_b}\n    \"\"\"\n    preferred_response\
  \ = model.generate(evaluation_prompt)\n    return {\n        'prompt': prompt,\n\
  \        'chosen': response_a if \"A\" in preferred_response else response_b,\n\
  \        'rejected': response_b if \"A\" in preferred_response else response_a\n\
  \    }\n```\n\n有了这里的偏好对生成函数，偏好数据生成已准备好用于我们接下来将看到的 RL 阶段。\n\n## 强化学习阶段\n\n在 RL 阶段，我们首先尝试获取一个奖励信号生成器，这通常是一个偏好模型（奖励模型）。生成的偏好数据可直接用于训练偏好模型。这可以通过在宪法指导的比较上训练分类器，或使用\
  \ Bradley-Terry 模型进行偏好概率估计来完成。偏好模型类可以构建为用于训练奖励模型。我们将查看一个示例片段，展示使用 transformers 和\
  \ torch 库及其方法的偏好模型。这里 `PreferenceModel` 封装了一个 transformer（`base_model`），复用其隐藏状态：\n\
  \n```python\nimport torch\nfrom torch import nn\nfrom transformers import AutoModelForCausalLM\n\
  \nclass PreferenceModel(nn.Module):\n    def __init__(self, base_model):\n     \
  \   super().__init__()\n        self.transformer = base_model\n        self.value_head\
  \ = nn.Linear(base_model.config.hidden_size, 1)\n       \n    def forward(self,\
  \ input_ids):\n        hidden_states = self.transformer(input_ids).last_hidden_state\n\
  \        pooled_output = hidden_states.mean(dim=1)  # Mean pooling\n        return\
  \ self.value_head(pooled_output)\n```\n\n可以使用 transformers 库中的预训练模型，基于偏好数据集对偏好模型进行批量训练或微调。应用基于\
  \ **Bradley-Terry 模型** 的 **成对排序损失**，并使用 `-torch.log(torch.sigmoid(chosen_rewards\
  \ - rejected_rewards)).mean()` 实现计算批次中的平均损失。模型学会**增加 chosen 和 rejected 奖励之间的差异**，推动\
  \ `chosen_rewards` 高于 `rejected_rewards`，并量化 chosen 响应比 rejected 响应更具奖励性的程度。下面的片段展示了一个示例训练循环。\n\
  \n```python\ndef train_preference_model(dataset):\n    model = PreferenceModel(AutoModelForCausalLM.from_pretrained(\"\
  claude-sft\"))\n    optimizer = torch.optim.AdamW(model.parameters(), lr=1e-5)\n\
  \   \n    for batch in dataset:\n        chosen_rewards = model(batch['chosen_input_ids'])\n\
  \        rejected_rewards = model(batch['rejected_input_ids'])\n        loss = -torch.log(torch.sigmoid(chosen_rewards\
  \ - rejected_rewards)).mean()\n       \n        loss.backward()\n        optimizer.step()\n\
  \        optimizer.zero_grad()\n```\n\n一旦偏好模型训练完成，它就可以用于策略优化，通过实现 PPO，使用来自监督学习-CAI\
  \ 模型的 KL 散度惩罚。奖励塑形可用于引导学习过程，使 AI 模型更容易学习并遵守宪法原则。当存在原则冲突时，需要动态权重调整。RL 训练循环将使用一个将被调优的策略模型、上述讨论的偏好模型、分词器和数据集。请注意，如果我们使用\
  \ `TRL` 库中的 `PPOTrainer` 方法，所有 RL 训练步骤都与我们在第 8 章之前讨论的类似，唯一的例外是使用训练好的偏好模型来获取 `chosen_rewards`，随后在进入训练步骤前对其进行归一化。\n\
  \n```python\ndef rl_training_loop(policy_model, preference_model, tokenizer, dataset,\
  \ num_epochs=10):\n    ppo_config = PPOConfig(\n        model_name=policy_model.name_or_path,\n\
  \        learning_rate=1e-5,\n        ...\n    )\n    ppo_trainer = PPOTrainer(\n\
  \        config=ppo_config,\n        model=policy_model,\n        ref_model=None,\n\
  \        tokenizer=tokenizer,\n        dataset=dataset\n    )\n    for epoch in\
  \ range(num_epochs):\n       \n        for batch in ppo_trainer.dataloader:\n  \
  \          prompts = batch[\"prompt\"]\n            inputs = tokenizer(prompts,\
  \ return_tensors=\"pt\", padding=True)\n            input_ids = inputs[\"input_ids\"\
  ].to(policy_model.device)\n            response_ids = policy_model.generate(\n \
  \               input_ids=input_ids,\n                max_length=128,\n        \
  \        pad_token_id=tokenizer.eos_token_id\n            )\n            responses\
  \ = [tokenizer.decode(ids, skip_special_tokens=True) for ids in response_ids]\n\
  \           \n            # Compute rewards using the custom preference model\n\
  \            with torch.no_grad():\n                chosen_rewards = preference_model(input_ids=response_ids).squeeze()\n\
  \           \n            # Normalize rewards (optional scaling to [-1, 1])\n  \
  \          rewards = (chosen_rewards - chosen_rewards.mean()) / (chosen_rewards.std()\
  \ + 1e-8)\n           \n            # Perform PPO step\n            stats = ppo_trainer.step(\n\
  \                queries=prompts,\n                responses=responses,\n      \
  \          scores=rewards.tolist()\n            )\n    policy_model.save_pretrained(\"\
  ppo_trained_policy_model\")\n    tokenizer.save_pretrained(\"ppo_trained_policy_model\"\
  )\n```\n\n动态权重调整和奖励塑形可以在来自偏好模型的基础奖励上实现。下面展示了一个宪法奖励塑形的示例片段。原则奖励和权重必须经过设计和预分配。\n\n\
  ```python\ndef constitutional_reward_shaping(base_reward, principle_rewards, weights):\n\
  \    total_reward = base_reward\n    for principle, weight in weights.items():\n\
  \        total_reward += weight * principle_rewards.get(principle, 0)\n    return\
  \ total_reward\n```\n\n除了奖励塑形，还可以计算并纳入策略模型与融合了宪法 AI 的监督学习模型之间的 KL 散度，以确保策略模型不会显著偏离训练好的监督学习基线，从而保持与宪法原则的一致性。\n\
  \n## 验证与监控\n\n以宪法作为验证层对响应进行验证，并进行实时合规性检查，有助于改进验证，从而改善决策。也可以考虑实时原则合规性检查。验证层可以涉及部署前的筛选。这可以使用广泛的红队测试——即增加人工和基于\
  \ AI 的对抗代理，以测试训练好的模型和系统是否遵循宪法原则。这可以使用 `HarmBench` 分类法（详见此处：HarmBench: A Standardized\
  \ Evaluation Framework for Automated Red Teaming and Robust Refusal: https://arxiv.org/pdf/2402.04249），该分类法包含多个危害类别并涵盖各种行为。它是一个用于自动化红队测试的标准化评估框架。它被用于测试宪法\
  \ AI 在提高资源受限模型（如 `DeepSeek-R1`、`Gemma-2`、`Llama 3.1` 和 `Qwen2.5`）安全性方面的有效性。更多内容请阅读：How\
  \ Effective Is Constitutional AI in Small LLMs? A Study on DeepSeek-R1 and Its Peers:\
  \ [`arxiv.org/html/2503.17365`](https://arxiv.org/html/2503.17365)。该评估框架还使用 `GPT-4o-mini`\
  \ 来分析模型响应的具体细节。除了 LLM 的评估框架，部署前还可以纳入额外的验证测试，如统计均等性测试、公平性指标和合规性措施。\n\n## 特定类别检测\n\
  \n\n\n\n除了部署前验证检查外，还可以纳入实时合规性检查以确保符合原则。一个强大的合规系统必须准确分类危害，以确保有效干预。这需要细粒度的**危害分类法**，例如将潜在危害细分为不道德（如错误信息、偏见、隐私侵犯）、危险（如自残、暴力、危险建议）和非法（如欺诈、版权侵权、露骨内容）等类别。使用针对每种危害类型在特定领域数据上训练的专用分类器的微调检测模型，或用于检索专业信息的策展数据库，也有助于检测。例如，检测错误信息可能需要事实核查数据库，而非法活动检测可能需要法律语料库。为了提供比二元阻止或允许方法更细粒度的控制，动态阈值系统可以使用危害严重程度评分来调整响应。低风险内容可能触发免责声明，而高风险内容应导致直接拒绝。\n\
  \n## 上下文感知的拒绝条件\n\n模型拒绝响应应仅在有正当理由时进行，而非采取一概拒绝的策略。这要求模型具备情境理解能力，分析查询的意图和上下文。例如，“解释什么是网络钓鱼。”是可接受的查询，但“制定成功的网络钓鱼计划和内容”应触发拒绝。同样，条件性拒绝也很有用，通常涉及实时评估。例如，如果查询模棱两可，AI\
  \ 系统可以提出澄清性问题，而不是直接拒绝。如果危害潜力较低，AI 可能会提供一般性指导，同时避免敏感细节。如果危害潜力较高，以合乎道德的方式回复，例如为自残查询提供安全资源，可能是合适的。确保拒绝条件不过于宽泛，可以最大限度地减少对安全、法律事务或伦理辩论等有益讨论的阻碍。\n\
  \n## 基于原始查询的响应连贯性监控\n\n确保 AI 响应在内部保持一致且不违背安全政策，需要运行一致性检查器，将输出与查询以及原则或安全规则进行比较。如果响应违背安全规则或在拒绝声明中泄露漏洞，将被标记以供处理。为进一步增强安全性，应实施多遍过滤，在查询处理阶段增加检测意图的检查，在生成阶段增加检查响应构思过程中泄露的检查，以及响应后复核以检查与查询意图的连贯性。除了这些检查外，还可以设置矛盾检测。这将检测拒绝消息与\
  \ AI 行为之间的矛盾或错位。\n\n## 部署架构\n\n宪法 AI 的部署架构还需要一个多层系统，以确保遵守预定义的伦理和宪法原则，同时保持决策的透明度和可信度。让我们看看架构中关键组件的详细阐述。\n\
  \n### 多层系统\n\n一个强大的**多层系统**确保 AI 生成的响应与宪法原则和伦理准则保持一致，同时提供人工监督的升级机制。多层系统的各个层级或阶段如下：\n\
  \n*   **输入清理层**：该层预处理用户输入，以过滤有害的、对抗性的或误导性的提示词。它使用对抗性提示词检测、毒性过滤和上下文归一化等技术（例如检测操纵尝试）。这确保恶意输入不会使\
  \ AI 模型产生偏见或触发非预期行为。\n*   **宪法合规性检查器**：模型组件根据预定义的宪法原则（如公平性、非歧视性、隐私、安全）评估响应。它使用基于规则的过滤和策略引导的强化学习来拒绝违反伦理标准的响应。它可以结合宪法奖励建模，即\
  \ AI 在符合伦理约束的人类和 AI 生成的反馈上进行训练。\n*   **解释生成器**：它为生成的响应提供基本原理和理由，从而提高可解释性。它有助于生成人类可读的解释，引用指导决策的具体宪法原则。它还可以包含反事实推理和假设场景，以确定可能的解释风险（例如，“选择此响应是因为替代响应违反了公平性约束。”）。\n\
  *   **后备人工升级协议**：为了遵守仍要求对高风险场景进行人工监管的监管机构要求，当 AI 模型遇到不确定或模棱两可的情况时，该系统可将决策升级至人工审核员。置信度阈值决定模型对响应的置信度；如果低于特定预设阈值（例如\
  \ 60%），则触发升级。同时，它维护一个有人在回路中（HITL）框架，由人工专家审核标记的案例并优化 AI 行为。\n\n多层系统的各层级及其连接方式如图 9.2\
  \ 所示。\n\n![Figure 9.2 Multilayered System Architecture showing different layers\
  \ of input processing before generating final output.](img/file39.png)\n\n图 9.2\
  \ 多层系统架构，展示生成最终输出前输入处理的不同层级。\n\n### 透明度机制\n\n对于宪法 AI，透明度对于确保信任、问责制和合规性至关重要。以下机制增强了系统的可解释性，从而提高了透明度：\n\
  \n*   **原则特定决策追踪**：决策追踪涉及记录生成每个响应时应用的具体宪法或伦理原则。它允许审计员和研究人员将推理过程追溯到单个伦理准则。例如，如果模型拒绝回答关于生物识别数据隐私的问题，追踪日志可能会指示“决策符合\
  \ GDPR 和隐私权原则”。注意力热力图用于原则对齐、宪法原则的当前或应用权重、人工审核历史日志等工具，可以帮助准确追踪事件。Transformer 中的注意力热力图可以使用稀疏自编码器\
  \ (SAE) 进行分析，以识别影响注意力头的特征。此方法揭示了特定输入标记如何影响模型决策。注意力模式和宪法嵌入可以通过注意力特征与原则嵌入之间的相似度评分进行映射。这可以作为追踪决策和宪法原则影响的来源。\n\
  *   **按宪法原则评分**：该过程涉及根据宪法原则为每个 AI 决策分配置信度评分。每个响应包含按伦理或法律标准（如公平性合规或隐私合规）细分的置信度水平。这种方法允许用户和监管机构评估\
  \ AI 决策的可靠性，并识别需要人工审核的案例。\n\n成功的部署需要在原则特定性与模型灵活性之间取得平衡，因为过度约束的宪法会降低响应质量。\n\n## AI\
  \ 反馈强化学习与宪法 AI 中的伦理考量\n\n基于 AI 反馈的强化学习 (RLAIF) 和宪法 AI 代表了使 AI 系统与伦理原则对齐的新方法。然而，它们的实施不一定完美。我们将在本节中按如下方式讨论它们。\n\
  \n### RLAIF 中的伦理挑战\n\n\n\n\n## RLAIF 局限性\n\nRLAIF 克服了 RLHF 的一些挑战，例如人工合规性、偏见和数据收集成本，从而实现了流程的扩展。然而，仍有一些局限性需要考虑。RLAIF\
  \ 存在放大 AI 反馈模型训练数据中偏见的风险，尤其是在微调模型的情况下。如果 AI 反馈模型继承了社会偏见（例如性别刻板印象），这些偏见可能在对齐过程中被放大。同样，该过程可能固有透明度缺陷，因为\
  \ AI 生成反馈的“黑箱”性质使得难以审计决策如何与道德准则保持一致。RLAIF 系统中的复杂神经网络缺乏可解释性，削弱了对有害输出的问责制。为应对这一问题，我们在上一节讨论的透明度机制也必须为\
  \ RLAIF 系统精心设计。虽然 RLAIF 和宪法 AI 关注一些既定标准，如帮助性、诚实性、无害性，但在实践中它们经常发生冲突（例如，真实性与减少危害）。此外，由于为提高可扩展性而取消了人工反馈，过度依赖自动化反馈会引入类似于大语言模型缺陷的风险，例如幻觉、透明度问题、偏见。另外，由于\
  \ RLAIF 仍使用 RL 方面，可能会发生奖励黑客攻击——模型在未真正遵守或遵循目标的情况下“玩弄”奖励模型。RLAIF 中减少的人工参与会给错误解决和调试带来挑战。如果没有人工审查，AI\
  \ 反馈循环可能会固化语义误表征等错误，必须引入类似于传统软件工程的验证检查、可追溯性和可观测性。\n\n## 宪法 AI 的局限性\n\n预定义的宪法难以应对不断演变的原则和政策，例如不断变化的社会规范，如对隐私或性别认同看法的转变，或影响特定规则的政府政策变化。这些因素可能导致先前的规则过时，从而产生可能不再有效的响应。因此，必须设计宪法规则的更新机制。宪法中的固定原则在新场景中也可能发生冲突。例如，自动驾驶汽车在乘客安全和行人权利之间做选择，可能是一个非常依赖具体场景的决策。宪法中的文化或情境盲点可能导致歧视性或次优输出，因此需要纳入多种验证和测试机制。对宪法未涵盖的边缘情况鲁棒性降低，可能需要对模型进行引导式训练。虽然宪法\
  \ AI 可以纳入某些原则，并似乎为系统提供了治理，但目前尚不存在关于伦理 AI 原则的普遍共识。如果场景允许这种优先级排序，企业控制的宪法很容易将品牌安全置于公共利益之上。此外，设定的宪法可能与全球各地的法律标准不一致，导致指南冲突。因此，必须承认治理缺口。与\
  \ RLAIF 类似，如果没有人工监督或参与，对于非显而易见或未预设的场景，以及 AI 反馈循环经历大量快速轮次的 AI 系统与环境交互，可能导致错误解决困难。如果不加控制，**宪法解释中的错误会随着时间的推移而变得自我强化**。一旦\
  \ AI 模型生成的响应被另一个 AI 模型而非人工审查员判定为“已对齐”，错误可能会在多个训练周期中固化。如果 AI 对齐机制在缺乏稳健人工审查的情况下运行，组织可能会声称其模型“符合伦理”，却未确保有意义的保障措施——这种现象被称为“伦理漂洗”。例如，一家公司部署\
  \ AI 聊天机器人，声称其完全符合人权，仅因为它使用了一个宽松定义的“宪法数据集”进行微调，而非经过严格的外部审计。\n\n## 伦理实施建议\n\n正如我们刚才讨论的，基于\
  \ AI 的对齐方法（如 RLAIF 和宪法 AI）存在伦理局限性；当流程扩展时，RLHF 也面临类似的人工合规性和偏见挑战。因此，需要嵌入或设计便于伦理审查的流程。虽然\
  \ AI 伦理与安全是一个新兴领域，但可以在 AI 流水线中纳入一些预留伦理和安全检查空间的最小框架。让我们看几项建议：\n\n*   **动态宪法**：通过实施可通过公共审议流程更新的版本控制原则，可以缓解宪法与不断演变的规则和规范保持一致的问题，这些原则可来源于环境变化，如实时监测社会价值观转变，或为自主系统使用实时地理空间地图。定期审查宪法也有助于保持其最新状态。由此产生的更新被记录在版本控制中，就像软件代码一样，允许可追溯、可审计的变更。更进一步，AI\
  \ 系统将在近实时地重新加权或修订对宪法原则的解释，同时保留审计轨迹。\n\n*   **混合监督**：为应对 AI 系统缺乏人工参与、导致复杂的错误纠正和宪法误解及误表征的问题，可将\
  \ AI 反馈系统与人在回路系统相结合。这些可以作为后备协议，将高风险决策上报给人类专家。为高风险或模糊场景嵌入此类**上报系统**也能确保安全。例如，如果 AI\
  \ 模型不确定响应是否涉及敏感医疗建议，它会标记并将查询路由给领域专家（如医生）。除了上报机制，还可以集成偏见审计系统，通过统计均等性和公平性测试来检测系统性偏见。\n\
  \n*   **透明度机制**：进一步详述我们为宪法 AI 部署架构讨论的透明度机制，因为这些不仅关乎伦理考量，还促进正确性、可解释性，且是普遍的良好实践。注意力热力图是可视化工具，有助于了解\
  \ AI 的 Transformer 模型中哪个注意力头受哪条宪法原则影响。一旦实施了充分的场景日志记录并可用，这些工具可以帮助追踪 AI 模型如何做出特定决策。例如，热力图可能突出显示某响应主要由“不伤害”和“信息自由”条款塑造。此外，定期公开发布的报告，根据公平性、安全性、诚实性或相关性等关键标准评估性能，有助于建立信任，记录在案的记分卡可实现随时间推移的问责基准测试。\n\
  \n*   **治理框架**：为使宪法原则合法化并确保其**现实世界对齐**，治理必须是**多利益相关方、包容性和领域敏感**的。一个例子是采用由伦理学家、政策制定者和公民社会团体共同设计的多利益相关方宪法。或者，在公司的情况下，纳入各学科所需的所有利益相关方（如领域专家），可以使宪法涵盖业务的所有重要方面。任命专门的审查委员会进行部署前审查、风险评估，并指导针对特定领域的宪法定制。\n\
  \n\n\n\n虽然 RLAIF 和宪法 AI 提供了可扩展的对齐解决方案，但它们的伦理部署需要解决偏见传播、价值冲突和治理缺口等问题。成功的关键在于透明的实施、自适应原则和人工监督——而不仅仅是技术修复。正如对\
  \ RLAIF 方法的批评所指出的，这些系统必须超越简化的 3H 标准，以应对人类伦理的细微差别。\n\n### 概要\n\n在本章中，我们讨论了 `RLHF`\
  \ 的一些关键挑战——特别是与人类偏好数据收集的可扩展性和潜在偏见相关的挑战——如何通过基于 AI 的反馈替代方案（如 `RLAIF` 和 `Constitutional\
  \ AI`）来解决。`RLAIF` 遵循与 `RLHF` 相似的流程，但用模型生成的偏好替代了直接的人类反馈，使该方法更具可扩展性。我们探讨了将 AI 生成的反馈集成到训练管道中的不同方式，并指出这仍然是一个新兴且活跃发展的研究领域。`Constitutional\
  \ AI` 提供了另一个有前景的方向，即将人类偏好提炼为一组指导性的宪法原则来引导模型行为。虽然这些方法减少了对持续人工标注的依赖，但它们并非没有局限性。我们强调了保持最新地面真实信息、纳入有条件的人工监督以及建立透明机制和稳健治理框架的重要性，以确保符合伦理且安全的\
  \ AI 对齐。本章的重点是通过实现更可扩展和准确的反馈机制，克服奖励建模中的挑战并改进强化学习中的策略优化。在下一章中，我们将探索更进一步的方法——可能完全消除基于强化学习的策略优化的需求，使用诸如\
  \ `Direct Preference Optimization` 之类的算法。\n\n## 参考文献\n\n*   [`https://github.com/huggingface/peft`](https://github.com/huggingface/peft)\n\
  *   [`https://huggingface.co/docs/peft/main/en/index`](https://huggingface.co/docs/peft/main/en/index)\n\
