  \ Learning from Human Feedback：<https://arxiv.org/abs/2310.05199>\n*   <https://theodi.github.io/ukan-course/assets/odi-data-anonymization.pdf>\n\
  *   Guided Cost Learning: Deep Inverse Optimal Control via Policy Optimization：<https://arxiv.org/pdf/1603.00448>\n\
