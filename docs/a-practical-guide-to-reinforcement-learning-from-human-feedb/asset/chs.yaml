- "## 第 1 章：强化学习简介\n\n### 加入我们的 Discord 图书社区\n\n![中间带方块的二维码，描述自动生成](img/file0.png`)\n\
  \n[`packt.link/EarlyAccessCommunity`](https://packt.link/EarlyAccessCommunity)\n\
  \n本书旨在探讨如何使 AI 代理与人类意图保持一致。过去二十年间，AI 能力呈指数级增长，机器学习、计算机视觉、自然语言处理、深度学习和**强化学习**(`RL`)等学科的里程碑式进展在其中发挥了关键作用。这些能力和应用展示了\
  \ AI 扩展得有多好，以及它如何影响几乎所有事物。这使得 AI 的行为或采取的行动与人类意图保持一致变得至关重要，而这一必要性也是安全使用该技术的途径。在本书中，我们将深入探讨**基于人类反馈的强化学习**(`RLHF`)，它在生成式预训练模型的成功中发挥了关键作用，并将其推向主流技术应用。本书第一部分从总体角度介绍\
  \ `RLHF`，并帮助读者理解将 `RLHF` 应用于任何应用所需的核心技术组件。第二部分深入探讨将 `RLHF` 应用于语言建模，特别是大型语言建模。最后一部分为读者提供该技术的当前趋势和未来展望。在本章中，我们首先涵盖\
  \ `RL` 的基础知识和理解 `RL` 算法的关键概念，通过高层次解释其类别，向读者介绍 `RL`。然后我们介绍一个称为网格世界的特定简单经典环境，并展示如何实现\
  \ `Q-learning` 这一基本 `RL` 算法。利用基本实现进行比较和提供背景，我们随后详细说明如何设计奖励函数，以及如何实现迁移学习以加速 `RL`\
  \ 训练。最后，我们展示**人类反馈**如何辅助基于 `RL` 的训练，并在同一示例上进行动手实现，以便读者能清晰地比较其相对于经典 `Q-learning`\
  \ 实现的改进。这让读者了解 `RLHF` 在实践中如何运作，并为后续章节深入探讨更复杂的算法和架构奠定基础。本章将涵盖以下主要标题：\n\n- 强化学习要点\n\
  - 理解 RL 算法\n- 探索 RL 环境：网格世界环境\n- 设计奖励函数与迁移学习\n- 基于人类反馈的强化学习\n\n### 技术要求\n\n本章将所有实现相关的依赖保持最小化。所有实现均使用\
  \ `python`。具体版本建议和所需安装的最低库如下：\n\n- `Python` 版本 >= 3.9\n- `Numpy` == 1.26.4\n- `Matplotlib`\
  \ == 3.8.4\n\n开始前，请克隆此 Git 仓库：[`https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback`](https://github.com/PacktPublishing/A-Practical-Guide-to-Reinforcement-Learning-from-Human-Feedback)，并将目录切换到\
  \ `chapter1`。\n\n### 强化学习要点\n\n\n\n\n# 强化学习基础\n\n强化学习是机器学习的一种范式，专注于智能体如何通过与环境的交互来学习做决策，以最大化特定的累积奖励。在人工智能的语境下，智能体是指任何能够感知环境并通过自主决策对环境施加作用的实体。智能体通过试错学习，根据其动作导致的到达或停留的状态，以奖励或惩罚的形式接收反馈。随着时间的推移，通过这一迭代过程，智能体磨练其决策能力以最大化累积奖励。\n\
  \n## 状态-动作-奖励框架\n\n强化学习基于`state-action-reward framework`（状态-动作-奖励框架），智能体通过与环境交互来学习最优决策策略。环境的感知及其当前状态通过传感器传递给智能体，使其能够做出明智的决策。**状态**代表环境的各种属性，为决策提供关键信息。\n\
  \n例如，人类通过视觉等感官感知世界，而机器人可能使用摄像头。这些感知构成了状态的基础，涵盖了物体、位置和其他环境属性。然而，并非所有状态都可直接观测；隐藏物体构成当前状态的一部分，但保持未被观测。因此，观测值代表智能体用于决策的感知状态。为简洁起见，在我们的讨论中，我们将使用状态作为观测值，因为观测值预期包含决策所需的所有相关状态。\n\
  \n### 动作\n\n考虑一个基于摄像头输入在环境中导航的机器人。它解析图像以决定**动作**，如向右、向左或直行。这些动作通过肢体或车轮等机制执行。智能体采用从简单规则到复杂机器学习算法的决策过程，根据其对环境的感知来选择动作。\n\
  \n### 奖励\n\n在强化学习中，智能体旨在通过选择导致有利结果的动作来最大化累积**奖励**。奖励作为反馈，指导智能体的学习过程。通过反复交互，智能体完善其决策能力，利用状态-动作-奖励框架在多样化环境中实现最优性能。在*图\
  \ 1.1*中，我们展示了使用状态-动作-奖励框架的**智能体-环境**交互。\n\n![Figure 1.1 Agent-Environment Interaction](img/file1.png)\n\
  \n图 1.1 智能体-环境交互\n\n## 核心概念\n\n在给定的迭代或时刻，基于环境的**初始状态**，智能体采取动作改变环境，使其过渡到状态 `s[t+1]`。对于每次迭代，如果这种状态变化是期望的，则会分配一个较高的正奖励，激励智能体采取此类动作。导致智能体根据当前状态采取动作的决策策略称为**策略**，通常记作\
  \ `π(s)`。动作作为输入传递给环境，导致环境改变或过渡到下一个状态；过渡动态通常表示为 `*.*`。过渡动态由环境决定，不受我们或智能体控制。根据环境的不同，它可以是随机的或确定性的。\n\
  \n从初始状态开始，遵循特定策略后，在一系列状态上预期累积奖励的估计称为**价值函数**，通常定义为 `V(s)`，是状态的函数。当价值函数针对特定状态下采取的特定动作时，称为**动作价值函数**或\
  \ `Q` 函数。\n\n# 理解强化学习算法\n\n强化学习算法的主要任务是优化策略，使智能体采取导致期望状态的最优动作。为了优化动作，强化学习算法采用各种创新技术，但其核心在于利用智能体处于特定状态相关的奖励，驱动策略产生期望的动作。算法的差异主要在于如何使用、存储、处理和应用状态、动作和奖励以得出最优策略，以及智能体如何与环境交互以得出这些策略。强化学习算法可根据多个标准进行分类。一些常见的分类包括：\n\
  \n## 分类标准\n\n### 基于模型 vs 无模型\n\n**基于模型 VS 无模型**：基于模型的算法涉及学习环境模型并利用其规划动作。环境模型可以基于动态规划、蒙特卡洛方法或学习转移模型。相反，无模型算法不对环境建模，而是直接通过与环境交互来学习。无模型算法的例子有\
  \ `Q-learning`、`SARSA` 和 `Deep Q Networks` (`DQN`)。\n\n### 基于价值 vs 基于策略\n\n**基于价值\
  \ vs 基于策略**：基于价值的算法估计处于特定状态并采取特定动作的价值，旨在最大化价值函数。基于策略的算法直接对策略进行参数化，并使用梯度上升方法学习最优策略。一种结合价值和基于策略算法的混合方法称为\
  \ `actor-critic`（演员-评论家）算法。它维护一个演员（策略）和一个评论家（价值函数），并利用两者从经验中学习，平衡两者的优势。\n\n### 时序差分\
  \ vs 蒙特卡洛 vs 动态规划\n\n**时序差分 vs 蒙特卡洛 vs 动态规划**：在时序差分学习中，价值函数基于当前奖励与未来奖励的差异进行更新。相反，在**蒙特卡洛方法**中，价值是基于整个回合（单次运行中的状态序列）观测到的总回报来估计的，且每个回合仅更新一次价值。考虑到需要完成整个回合的轨迹才能更新价值，这是蒙特卡洛方法的一个已知弱点。动态规划涉及将问题分解为子问题，并迭代求解这些问题。虽然动态规划算法在构建算法方面是基础性的，且适用于已知领域和有限状态-动作空间，但其计算复杂度、时间和内存需求无法扩展到大规模状态-动作空间，也不适用于存在不确定性的环境。\n\
  \n### 同策略 vs 异策略\n\n**同策略 vs 异策略算法**：同策略算法在策略被学习和更新时立即遵循该策略（采取动作）。对于异策略算法，学习一个目标策略，同时使用单独的策略（行为策略）来遵循策略（通过采取动作）。\n\
  \n### 单智能体 vs 多智能体\n\n**单智能体 vs 多智能体算法**：单智能体算法涉及单个智能体在环境中交互以学习达成目标。多智能体算法涉及多个智能体在环境中相互交互，协作、竞争或独立地为一个目标或一组目标做出贡献。这些智能体之间存在协调和通信，有时它是多个单智能体的集成。\n\
  \n### 表格型强化学习 vs 函数近似强化学习\n\n**表格型强化学习 vs 函数近似强化学习**：`Tabular RL` 显式地在表格中存储价值和策略，而在\
  \ `Function Approximation RL` 中，使用函数近似器或模型（如神经网络）来估计价值函数或策略，使其能高效处理大规模或连续的状态和动作空间。`Tabular\
  \ RL` 通常适合开发强化学习算法或理解和获取直觉，但由于其表格存储的特性，仅限于较小的状态-动作空间。\n\n\n\n# 批量 RL 与在线 RL\n\n\
  在 `Batch RL` 或 `Offline-RL` 中，智能体从离线收集的固定数据集中学习，经验来自过去的某些交互，但在学习过程中**不与环境交互**。`Online-RL`\
  \ 是典型情况，智能体通过与环境交互并持续更新策略或价值函数（作为学习过程的一部分）来学习，因为观察值是在体验过程中收集的。\n\n# 探索-利用策略\n\n\
  `RL` 算法还可以根据智能体在训练期间如何平衡探索和利用进行分类。当智能体尝试新动作、发现新场景，以及这些新动作如何影响状态演变和产生的奖励时，这被称为**探索**。当智能体试图最大化已知能产生高奖励的动作，而不冒尝试新动作的风险时，这被称为**利用**。示例包括\
  \ `epsilon-greedy`、`Boltzmann exploration`、`Upper Confidence Bound` 和 `Thompson\
  \ Sampling`。\n\n虽然 `RL` 算法的分类可以很详尽，但许多算法符合上述几个类别。为了 `RLHF` 的目的，我们将重点关注几个关键基础算法，例如本章中基于价值的算法方法\
  \ `Q-learning`，并在后续章节中介绍基于策略的方法。在讲解完整示例之前，理解价值函数的概念很重要。价值函数用于评估环境中状态或状态-动作对的质量。它们提供了一种量化方式，衡量处于特定状态或在每个状态\
  \ `s` 中采取特定动作并遵循给定策略所关联的预期回报或效用。这有助于了解该状态（以及在该状态下采取特定动作）从长远来看有多可取。定义价值函数有两种方式：\n\
  \n## 状态价值函数\n\n它是从特定状态 `s` 开始并遵循给定策略的预期回报（累积折扣奖励）。数学上，折扣未来奖励的预期和可以表示为： 。\n\n* `E`\
  \ 是期望算子，表示对可能的未来轨迹的期望，`γ` 是折扣因子（在 0 和 1 之间），对未来奖励进行折扣以赋予即时奖励更大的权重， 是时间步 时接收到的奖励。\n\
  \n## 动作价值函数\n\n它是从状态 `s` 开始，采取动作 `a`，然后遵循给定策略的预期回报。数学上，这个折扣未来奖励的预期和可以表示为：\n\n* ，\n\
  \n* 符号与状态价值函数类似。\n\n从基于 `RLHF` 的 AI 系统的系统级和架构视角来看，替换算法并将状态-动作视为与 AI 系统其余部分交互的输入-输出变量是很容易的。对于有兴趣深入研究这些算法的读者，有几本理论和实践性质的书籍（请参阅本章末尾的参考文献）。为了理解\
  \ AI 系统和智能体-世界交互，我们将使用经典的网格世界环境，并展示 `Q-learning` 算法如何工作。接下来，我们将展示奖励模型如何发挥作用，使学习过程更高效。\n\
  \n# 导航 RL 环境：网格世界环境\n\n在 `RL` 中，智能体-环境交互是需要优化的场景。为了优化此场景，智能体采取导向理想状态的最优动作。导致最优状态的动作序列即为策略。训练智能体可以使用真实世界环境。但它们可能危险、昂贵，有时效率低下。训练智能体学习足够复杂的策略可能需要数百万次迭代。这就是真实世界环境模拟发挥作用的地方。虽然模拟可能无法完全捕捉真实世界，但仅捕捉导致真实世界相关状态转移的相关信息和环境属性，在许多工业和现实问题中已足够。在某些情况下，模拟场景与真实世界存在差距，并在真实世界实施期间构成困难，通常称为\
  \ `sim2real gap`。这在涉及物理和三维几何资产的仿真模型中更为显著，而对于文本、图像或应用而言问题较小，因为智能体部署后，最终环境仍是数字世界。在本章中，我们介绍真实世界的网格世界表示。简化的环境将帮助我们专注于学习\
  \ `RL` 相关概念，而无需复杂领域的认知开销。环境由网格单元组成。每个单元可以是可访问或不可访问的，形成世界的布局。智能体位于网格内的某个单元中。智能体可以采取动作从一个单元移动到另一个单元。使用状态-动作-奖励框架，我们在网格世界问题的背景下定义它们。\n\
  \n## 网格世界组件\n\n### 状态\n网格中的每个单元代表环境的一个状态。随着智能体在网格中移动，环境的状态会发生变化。\n\n### 动作\n智能体可以采取动作在网格中移动。通常，智能体可以向上、下、左、右移动。然而，根据问题的变体，由于障碍物或边界，某些动作可能不可用。\n\
  \n### 奖励\n网格中的每个单元可能关联一个奖励。智能体的目标通常是最大化其随时间累积的总奖励。奖励可以是正、负或零。\n\n### 终止状态\n网格中的某些单元可能被指定为终止状态。当智能体进入终止状态时，回合结束，智能体可能接收最终奖励，也可能不接收，具体取决于问题设置。\n\
  \n### 策略\n策略决定智能体在环境中的行为。它将状态映射到动作，指导智能体如何在不同状态下选择动作以实现其目标，通常是最大化累积奖励。\n\n### 转移动力学\n\
  从一个状态移动到另一个状态并不总是确定性的。可能涉及随机性，例如风将智能体吹离航向，或智能体在冰面上滑倒。\n\n## 构建 GridWorld 环境\n\n\
  要创建世界的网格世界表示，我们首先在 Python 中创建一个 `GridWorld` 类。以下是构建网格世界环境的步骤。\n\n### 初始化环境\n\n`__init__`\
  \ 方法使用 `grid_size`、`obstacle_positions`、`start_position` 和 `goal_position` 等参数初始化网格世界环境。状态数量初始化为网格的大小。它还将每个状态-动作对的\
  \ `Q_values` 初始化为零。\n\n```python\ndef __init__(self, grid_size, obstacle_positions):\n\
  \    self.grid_size = grid_size\n    self.start_position = (2, 2)\n    self.goal_position\
  \ = (5,5) #(grid_size[0] - 1, grid_size[1] - 1) for generalizing\n    self.obstacle_positions\
  \ = obstacle_positions\n    self.actions = [(0, 1), (0, -1), (1, 0), (-1, 0)]  #\
  \ right, left, down, up\n    self.action_symbols = ['→', '←', '↓', '↑']  # Action\
  \ symbols for visualization\n    self.num_actions = len(self.actions)\n    self.num_states\
  \ = np.prod(self.grid_size)\n    self.Q_values = np.zeros((self.num_states, self.num_actions))\n\
  ```\n\n### 构建模拟器的方法\n\n然后，我们添加一个额外的方法来构建网格世界模拟器。以下是将 `state (i, j)` 转换为 `Q_values`\
  \ 数组中对应索引的方法，反之亦然，给定 `Q_values` 数组中的索引转换为对应的 `state (i, j)`。\n\n```python\ndef state_to_index(self,\
  \ state):\n    return state[0] * self.grid_size[1] + state[1]\n\ndef index_to_state(self,\
  \ index):\n    return (index // self.grid_size[1], index % self.grid_size[1])\n\
  ```\n\n\n\n# GridWorld 状态索引转换与 Q-Learning 实现\n\n## 状态到索引的转换：`state_to_index(state)`\n\
  \n方法 `state_to_index(state)` 用于将状态（表示网格中位置的元组）转换为其在 Q 值数组中对应的索引。下面分解表达式 `state[0]\
  \ * self.grid_size[1] + state[1]`：\n\n*   `state[0]`：表示状态在网格中的行索引。\n*   `self.grid_size[1]`：表示网格的列数。因为\
  \ `grid_size` 是元组 `(rows, columns)`，所以 `self.grid_size[1]` 给出列数。\n*   `state[1]`：表示状态在网格中的列索引。\n\
  \n将 `state[0]` 乘以 `self.grid_size[1]`，本质上是将行索引转换为跨越所有行的线性索引。例如，若网格大小为 `(6, 6)` 且位置为\
  \ `(2, 3)`，计算为 `2 * 6 + 3 = 15`。这将行索引 2 转换为网格扁平化表示中的线性等价值。随后加上 `state[1]`（列索引），即可将二维坐标映射为一维数组中的单个索引，便于访问\
  \ Q 值数组元素。这种方法确保每个状态唯一映射到 Q 值数组的一个索引，从而在 Q-Learning 过程中高效存取 Q 值。\n\n## 索引到状态的转换：`index_to_state(self,\
  \ index)`\n\n`GridWorld` 类中的方法 `index_to_state(self, index)` 负责将 Q 值数组中的索引转换回网格中的二维状态坐标\
  \ `(i, j)`。\n\n表达式 `index // self.grid_size[1]` 计算状态的行索引：\n\n*   `index // self.grid_size[1]`\
  \ 通过整除求出索引之前完整的行数，即行索引。\n\n表达式 `index % self.grid_size[1]` 计算状态的列索引：\n\n*   `index\
  \ % self.grid_size[1]` 计算索引除以列数（`self.grid_size[1]`）的余数，即列索引。\n\n该方法返回 `tuple (row_index,\
  \ column_index)`，表示网格中状态的二维坐标。例如：\n\n*   假设 `index = 20`，网格大小为 `(6, 6)`。\n*   `row_index\
  \ = 20 // 6 = 3`（整除）\n*   `column_index = 20 % 6 = 2`（取余）\n\n对应的网格状态即为 `(3, 2)`。当你拥有\
  \ Q 值数组中的索引并需获取对应的网格坐标时，此方法可将线性索引映射回原始二维位置，便于 Q 值与策略的解读与可视化。\n\n## 状态有效性检查：`is_valid_state`\n\
  \n考虑网格世界中的障碍物，智能体可存在的状态首先必须在网格边界内，且不与障碍物重合。为保证状态有效，新增方法 `is_valid_state`，检查状态是否在边界内且非障碍物。\n\
  \n```\ndef is_valid_state(self, state):\n    return 0 <= state[0] < self.grid_size[0]\
  \ and 0 <= state[1] < self.grid_size[1] \\\n           and state not in self.obstacle_positions\n\
  ```\n\n## 获取下一状态：`get_next_state`\n\n为推进至下一状态，新增方法 `get_next_state()`：给定状态与动作，计算下一状态。若动作导致无效状态，则停留在当前状态。\n\
  \n*   表达式 `(state[0] + action[0], state[1] + action[1])` 通过将动作指定的变化量加到当前状态上，计算下一状态。\n\
  *   `state[0] + action[0]` 通过加上 `action[0]` 指定的行方向变化量，计算新行索引。\n*   `state[1] + action[1]`\
  \ 通过加上 `action[1]` 指定的列方向变化量，计算新列索引。\n\n随后调用 `is_valid_state` 检查下一状态是否有效（在边界内且非障碍物）。若有效则返回下一状态，否则返回当前状态，表明智能体无法移动而需原地停留。\n\
  \n```\ndef get_next_state(self, state, action):\n    next_state = (state[0] + action[0],\
  \ state[1] + action[1])\n    if self.is_valid_state(next_state):\n        return\
  \ next_state\n    return state\n```\n\n该方法在 Q-Learning 算法中用于根据当前状态与智能体选择的动作确定下一状态，确保移动遵守网格边界并避开障碍物。\n\
  \n## Q-Learning 算法\n\n上述方法定义了网格世界环境、状态、动作及状态更新机制，涵盖了环境部分及智能体交互的媒介。智能体利用状态生成策略以选取动作，`q_learning`\
  \ 方法实现了 Q-Learning 算法。\n\n首先，算法迭代多个回合以探索各种策略，开启循环。将状态初始化为起始位置，累计奖励与步数归零，开始回合循环。检查状态是否为目标状态，每个回合迭代智能体改变状态所经历的步骤。智能体每次迭代执行一步动作以改变状态。为学习环境，算法采用\
  \ epsilon-greedy 策略平衡探索与利用：以较小的 `epsilon` 概率随机选取动作，其余时间选择使 Q 值最大化的动作。每一步给予 `-1`\
  \ 奖励；若下一步到达目标状态，给予 `10` 奖励；若 `next_step` 与障碍物重合，给予 `-5` 奖励以抑制此类移动。接着计算目标值 `Target\
  \ = r + gamma * Qmax`，即即时奖励与下一状态最大 Q 值折扣和。此目标值用于更新当前状态-动作对的 Q 值。Q 值表示在状态 `s` 执行动作\
  \ `a` 的预期累计未来奖励，更新公式为 `Q_values = Q_t + learning_rate * (target – Q_t)`。每次迭代更新累计奖励、`next_state`\
  \ 与步数，如 `q_learning` 函数所示。`Q_learning` 方法基于接收到的奖励更新 Q 值，迭代指定回合数，每回合包含状态转移直至到达目标状态。此处采用\
  \ epsilon-greedy 探索选择动作，故有时会采取次优动作，但 Q 值存储长期前景。下面代码展示用 Python 实现 Q-Learning 的步骤。\n\
  \n### 函数定义与初始化\n\n此片段定义 `q_learning` 函数并初始化必要变量：`rewards` 存储每回合总奖励，`steps_per_episode`\
  \ 存储每回合步数，`policy_progress` 在指定检查点记录策略。若未提供参数则设置默认值。\n\n```\ndef q_learning(self,\
  \ num_episodes=1000, learning_rate=0.1, discount_factor=0.9, epsilon=0.1, policy_checkpoints=None):\n\
  \    rewards = []\n    steps_per_episode = []\n    policy_progress = []  # Store\
  \ optimal policy at different checkpoints\n    if policy_checkpoints is None:\n\
  \        policy_checkpoints = [num_episodes // 1000, num_episodes // 100, num_episodes\
  \ // 50, num_episodes - 1]\n```\n\n### 回合循环\n\n此片段启动回合主循环。每回合将状态初始化为起始位置，总奖励与步数归零，并创建列表记录访问过的状态。\n\
  \n\n\n# Q-Learning 实现\n\n## 主训练循环\n\n### 回合初始化\n\n```\nfor episode in range(1, num_episodes\
  \ + 1):\n    state = self.start_position\n    total_reward = 0\n    steps = 0\n\
  \    visited_states = [state]\n```\n\n### 动作选择\n\n此代码片段实现了使用 epsilon-greedy 策略（ε-贪婪策略）的动作选择机制。以概率\
  \ `epsilon` 选择随机动作（探索），以概率 `(1 - epsilon)` 选择已知最佳动作（利用）。\n\n```\nwhile state !=\
  \ self.goal_position:\n    if np.random.rand() < epsilon:\n        action = np.random.choice(self.num_actions)\n\
  \    else:\n        action = np.argmax(self.Q_values[self.state_to_index(state)])\n\
  ```\n\n### 状态转移与奖励分配\n\n此片段根据当前状态和选择的动作计算下一个状态。它根据结果分配奖励：到达目标获得 `10` 的正奖励，撞到障碍物获得\
  \ `-5` 的负奖励，每走一步默认惩罚 `-1`。\n\n```\nnext_state = self.get_next_state(state, self.actions[action])\n\
  reward = -1\nif next_state == self.goal_position:\n    reward = 10\nelif next_state\
  \ in self.obstacle_positions:\n    reward = -5\n```\n\n### 更新 Q 值\n\n这里我们使用 Q-learning\
  \ 更新规则更新当前状态-动作对的 Q 值。目标值是奖励加上折扣后的最大未来奖励，Q 值被更新以减小目标值与当前估计值之间的差异。\n\n```\ntarget\
  \ = reward + discount_factor * np.max(self.Q_values[self.state_to_index(next_state)])\n\
  self.Q_values[self.state_to_index(state), action] += learning_rate * (target - self.Q_values[self.state_to_index(state),\
  \ action])\n```\n\n### 状态转移、更新与追踪\n\n此片段更新当前回合的总奖励和步数，转移到下一个状态，并追踪访问过的状态。\n\n```\n\
  total_reward += reward\nstate = next_state\nsteps += 1\nvisited_states.append(state)\n\
  ```\n\n### 追踪奖励与步数\n\n下面的片段将当前回合的总奖励和步数分别添加到各自的列表中，以供后续分析。\n\n```\nrewards.append(total_reward)\n\
  steps_per_episode.append(steps)\n```\n\n### 策略检查点用于评估\n\n此片段在指定的检查点存储当前策略。它使用 `get_optimal_policy`\
  \ 方法进行评估。它还每 20 个回合打印一次进度信息，用于监控目的。\n\n```\nif episode in policy_checkpoints:\n\
  \    policy_progress.append((self.get_optimal_policy(), visited_states, episode))\n\
  if episode % 20 == 0:\n    print(f\"Episode {episode}/{num_episodes}, Total Reward:\
  \ {total_reward}, Steps: {steps}\")\n```\n\n### 返回输出\n\n一旦所有回合完成，下面的行返回收集到的奖励、每回合步数和策略进度。\n\
  \n```\nreturn rewards, steps_per_episode, policy_progress\n```\n\n## 最优策略提取\n\n\
  ### get_optimal_policy 方法\n\n为了辅助记录和检查点策略，添加了 `get_optimal_policy` 方法。在这里，每个网格单元被分配\
  \ Q 值的 argmax 作为最优策略，对于目标位置或障碍物位置等状态下的无效动作设为 `-1`。该函数高效地计算基于网格的环境的最优策略，同时考虑目标和障碍物状态的约束。下面的片段定义了\
  \ `get_optimal_policy` 函数，并初始化了一个与网格维度相同的矩阵 `optimal_policy`。该矩阵填充零值，并将存储每个状态的最优动作。\n\
  \n```\ndef get_optimal_policy(self):\n    optimal_policy = np.zeros(self.grid_size,\
  \ dtype=int)\n```\n\n然后，函数遍历网格中的每个单元，将每个单元视为一个状态。嵌套循环确保处理网格中的每个状态。\n\n```\nfor i\
  \ in range(self.grid_size[0]):\n    for j in range(self.grid_size[1]):\n       \
  \ state = (i, j)\n```\n\n然后它检查当前状态是否为目标状态或障碍物状态。如果是，它将 `optimal_policy` 中对应的条目设为\
  \ `-1`，表示这些状态没有适用的动作。\n\n```\nif state == self.goal_position:\n    optimal_policy[i,\
  \ j] = -1\nelif state in self.obstacle_positions:\n    optimal_policy[i, j] = -1\n\
  ```\n\n一旦通过目标或障碍物状态的检查，函数通过将有效动作存储在 `valid_actions` 列表中来收集它们。它遍历所有可能的动作，计算结果的下一个状态，并检查下一个状态是否有效。\n\
  \n```\nelse:\n    valid_actions = []\n    for action in range(self.num_actions):\n\
  \        next_state = self.get_next_state(state, self.actions[action])\n       \
  \ if self.is_valid_state(next_state):\n            valid_actions.append(action)\n\
  ```\n\n为了找到最优策略，它使用 Q 值来找到价值最高的动作。如果没有有效动作，它将条目设为 `-1`。然后返回最优策略。\n\n```\nif valid_actions:\n\
  \    optimal_policy[i, j] = np.argmax([self.Q_values[self.state_to_index(state),\
  \ a] for a in valid_actions])\nelse:\n    optimal_policy[i, j] = -1  # No valid\
  \ action\nreturn optimal_policy\n```\n\n## 可视化与进度追踪\n\n为了追踪和可视化学习进度，还添加了三个绘图方法，分别展示每回合奖励、智能体到达目标状态所需的每回合步数以及策略进度。\n\
  \n### 奖励与回合\n\n下面的代码绘制奖励与回合的图表，展示 Q-learning 算法的性能。\n\n```\ndef plot_rewards(self,\
  \ rewards):\n    plt.plot(rewards)\n    plt.xlabel('Episode')\n    plt.ylabel('Total\
  \ Reward')\n    plt.title('Q-learning Performance')\n    plt.show()\n```\n\n下图 *Figure\
  \ 1.2* 展示了所有执行训练回合中的 Q-learning 性能。横轴为回合，纵轴为总回合奖励。初期的急剧上升表明策略在约 50 个回合内收敛。\n\n![图\
  \ 1.2 1000 个回合的总奖励，展示学习进度和性能](img/file2.png)\n\n图 1.2 1000 个回合的总奖励，展示学习进度和性能\n\n\
  ### 每回合步数\n\n可以通过实现下面的代码绘制每回合到达目标所需的步数。此可视化用于追踪随着智能体学习，到达目标所需的迭代次数如何减少。\n\n```\n\
  def plot_steps_per_episode(self, steps_per_episode):\n    plt.plot(steps_per_episode)\n\
  \    plt.xlabel('Episode')\n    plt.ylabel('Steps')\n    plt.title('Steps per Episode')\n\
  \    plt.show()\n    plt.tight_layout()\n```\n\n每个回合到达目标所需步数的可视化如下图 *Figure 1.3*\
  \ 所示。最初智能体需要多达 200 步才能到达目标，但策略收敛后，所需步数也收敛到 <10 步。\n\n![图 1.3 智能体在网格世界环境中到达目标所需步数与回合的关系](img/file3.png)\n\
  \n图 1.3 智能体在网格世界环境中到达目标所需步数与回合的关系。\n\n\n\n# 可视化策略进度\n\n为了清晰地可视化智能体朝目标迈进的轨迹，直到到达目标，我们实现了\
  \ `plot_policy_progress` 方法。在这里，网格世界被绘制出来，并标记了智能体走过的完整轨迹。这种轨迹可以为每个回合可视化。但只需少数几个回合的快照就足以展示进度。下面的函数定义和输入通过分配\
  \ `num_checkpoints`，设置了包含子图的图形，每个子图对应 `policy_progress` 列表中的一个检查点。\n\n```\ndef plot_policy_progress(self,\
  \ policy_progress):\n    num_checkpoints = len(policy_progress)\n    fig, axes =\
  \ plt.subplots(1, num_checkpoints, figsize=(6*num_checkpoints, 6))\n```\n\n## 遍历检查点\n\
  \n然后，它开始一个循环来处理 `policy_progress` 中的每个检查点。它设置每个子图的标题以指示回合编号。\n\n```\nfor i, (policy,\
  \ visited_states, episode) in enumerate(policy_progress):\n    ax = axes[i]\n  \
  \  ax.set_title(f'Policy at Episode {episode}')\n```\n\n## 状态的可视化表示\n\n该函数接着遍历策略网格中的每个状态。它为目标位置、障碍物、起始位置和其他状态设置可视化表示，用适当的符号、颜色或样式标记它们。\n\
  \n```\nfor y in range(policy.shape[0]):\n    for x in range(policy.shape[1]):\n\
  \        state = (y, x)\n        if state == self.goal_position:\n            ax.text(x,\
  \ self.grid_size[0] - y - 1, 'G', va='center', ha='center', fontsize=20)\n     \
  \       ax.add_patch(plt.Rectangle((x - 0.5, self.grid_size[0] - y - 1 - 0.5), 1,\
  \ 1, color='lightgreen'))\n        elif state in self.obstacle_positions:\n    \
  \        ax.text(x, self.grid_size[0] - y - 1, 'X', va='center', ha='center', fontsize=20)\n\
  \            ax.add_patch(plt.Rectangle((x - 0.5, self.grid_size[0] - y - 1 - 0.5),\
  \ 1, 1, color='lightgray'))\n        elif state == self.start_position:\n      \
  \      ax.text(x, self.grid_size[0] - y - 1, 'S', va='center', ha='center', fontsize=20,\
  \ color='red')\n            ax.add_patch(plt.Rectangle((x - 0.5, self.grid_size[0]\
  \ - y - 1 - 0.5), 1, 1, color='lightblue'))\n        else:\n            action =\
  \ policy[y, x]\n            ax.text(x, self.grid_size[0] - y - 1, self.action_symbols[action],\
  \ va='center', ha='center', fontsize=20)\n```\n\n## 绘制智能体路径并配置网格\n\n该函数接着为每个检查点绘制智能体走过的路径，用线条连接连续的状态。它还为子图配置网格线和标签，使绘图更易读。\n\
  \n```\nfor j in range(len(visited_states) - 1):\n    x1, y1 = visited_states[j][1],\
  \ self.grid_size[0] - visited_states[j][0] - 1\n    x2, y2 = visited_states[j +\
  \ 1][1], self.grid_size[0] - visited_states[j + 1][0] - 1\n    ax.plot([x1, x2],\
  \ [y1, y2], color='blue', linewidth=3)\n    ax.set_xticks(np.arange(-0.5, policy.shape[1],\
  \ 1))\n    ax.set_yticks(np.arange(-0.5, policy.shape[0], 1))\n    ax.grid(color='black',\
  \ linestyle='-', linewidth=1)\n    ax.set_xticklabels([])\n    ax.set_yticklabels([])\n\
  \    ax.set_xlabel('X')\n    ax.set_ylabel('Y')\n```\n\n图 1.4 展示了策略进度，即智能体在逐步回合中采取的轨迹，执行\
  \ 1000 个回合的训练后，记录了第 1、10、20 和 999 回合的快照。智能体必须游荡并重走一些路径，在第 1 回合中走更长的轨迹到达目标。到第 10\
  \ 回合时已有一些进展，到第 20 回合时智能体采取的轨迹有显著改善。在第 999 回合时，智能体已走最优路径。作为练习，将 q-learning 的回合数修改为仅\
  \ 200 或 500 个，并更改检查点的数量。\n\n![](img/file4.png)![](img/file5.png)![](img/file6.png)![图\
  \ 1.4. 训练期间四个代表性回合的策略进展。](img/file7.png)\n\n图 1.4. 训练期间四个代表性回合的策略进展。\n\n实例化 `GridWorld`\
  \ 类并运行 q-learning 训练的执行代码如下。\n\n```\n# 调整超参数以进行实验\nobstacle_positions = [(2, 3),\
  \ (3, 1), (4, 3)]\ngrid_world = GridWorld(grid_size=(6, 6), obstacle_positions=obstacle_positions)\n\
  rewards, steps_per_episode, policy_progress = grid_world.q_learning(num_episodes=1000,\
  \ learning_rate=0.1, discount_factor=0.95, epsilon=0.1)\n```\n\n在上述 q-learning 实现中，智能体能够在有限的回合数内学会如何到达目标。所示的可视化方法有助于跟踪学习进度。本例中使用了三个障碍物和\
  \ 6 x 6 的网格大小。该问题收敛所需的训练回合数约为 50，但对于更大的网格尺寸或更多障碍物，这个数字可能会增加。请注意，`GridWorld` 类允许参数化网格大小和障碍物位置，方便修改环境。我们将在后续章节中利用这种参数化来探索改进学习进度的策略。\n\
  \n## 设计奖励函数与迁移学习\n\n为了让智能体学习到理想的策略，在前一节讨论的 Q-learning 算法中，对理想行为给予智能体正奖励，对非理想行为给予负奖励。在网格世界问题中，智能体每走一步都会获得\
  \ `-1` 的负奖励，这会阻止它走更多步骤。同样，智能体每走一步如果与障碍物重叠，会获得 `-5` 的较大负奖励。较大的负奖励有助于学习避开障碍物。最后，到达目标获得\
  \ `10` 的较大正奖励，鼓励到达目标状态。奖励分配本身就是奖励函数，重述如下：\n\n```\nreward = -1\nif next_state ==\
  \ self.goal_position:\n    reward = 10\nelif next_state in self.obstacle_positions:\n\
  \    reward = -5\n```\n\n请注意，奖励函数是离散的，且非常适合网格世界问题。在某些情况下，奖励函数可能需要是连续的。例如，如果网格有许多单元格，如\
  \ *1000 x 1000*，只有少数障碍物，随着智能体越来越接近目标，逐渐增加的连续奖励将有助于提供有意义的结果。如果除目标处外所有奖励都是 `-1`，智能体会游荡更久。在这种情况下，我们可以重新设计奖励分配。下面给出一个例子：\n\
  \n```\nreward = -1 + np.exp(-0.1 * np.linalg.norm(np.array(state) - np.array(self.goal_position)))\n\
  if next_state in self.obstacle_positions:\n    reward = reward - 5\n```\n\n\n\n\
  `reward = -1 + np.exp(-0.1 * np.linalg.norm(np.array(state) - np.array(self.goal_position)))`\
  \ 这行代码计算当前状态的奖励。它以 `-1` 作为基础奖励，然后根据当前状态与目标位置之间的距离调整该基础奖励。当前状态与目标位置之间的距离使用 NumPy\
  \ 中的欧几里得距离公式实现计算：`np.linalg.norm(np.array(state) - np.array(self.goal_position))`。该距离随后乘以\
  \ `-0.1` 缩放因子，并通过指数函数 `np.exp` 处理。负缩放因子确保奖励随距离增加而减小，指数函数则确保这种减小是渐进的而非线性的。接着，如果下一状态（智能体执行动作后将转移到的状态）在障碍物位置列表\
  \ `self.obstacle_positions` 中，奖励将进一步减少 5。这种惩罚鼓励智能体避开障碍物，因为转移到障碍物状态会导致更大的负奖励。\n\n\
  ## 迁移学习\n\n**迁移学习**（**TL**）在强化学习语境下，指利用解决某一任务获得的知识，来提升在相关但不同任务上的学习效果或性能。为演示网格世界问题中的迁移学习，我们修改了上一节讨论的\
  \ `q_learning` 函数代码。以下是新增的类方法：\n\n`q_learning_transfer` 方法用于迁移学习。它接收来自较小网格世界（如 **6x6**）的预训练\
  \ Q 值，并将其迁移至较大的网格世界（如 **8x8**）。迁移的 Q 值随后在新环境中通过 Q-learning 进行微调。\n\n```python\n\
  def q_learning_transfer(self, pre_learned_Q_values, epsilon=0.01):\n    # Initialize\
  \ Q-values with pre-learned values\n    self.Q_values[:pre_learned_Q_values.shape[0],\
  \ :pre_learned_Q_values.shape[1]] = pre_learned_Q_values\n    print(f\"Q learning\
  \ with Transferred Q-values\")\n    # Perform Q-learning in the new environment\n\
  \    rewards_transfer, steps_per_episode, policy_progress = self.q_learning(epsilon=0.01)\n\
  \    return rewards_transfer, steps_per_episode, policy_progress\n```\n\n`q_learning_scratch`\
  \ 方法在新环境中从头开始执行 Q-learning，首先初始化 Q 值。\n\n```python\ndef q_learning_scratch(self):\n\
  \    self.Q_values = np.zeros((self.num_states, self.num_actions))  # Or initialize\
  \ with other initial values if needed\n    print(f\"Q learning from Scratch\")\n\
  \    rewards_scratch, steps_per_episode, policy_progress = self.q_learning()\n \
  \   return rewards_scratch, steps_per_episode, policy_progress\n```\n\n最后，在完成迁移学习与从头训练两个模型的训练后，可以对两者进行对比。下面的\
  \ `plot_rewards_comparison` 方法对比它们的性能，以总奖励为指标，并使用移动平均平滑后绘图。我们展示该方法的部分代码片段。\n\n下面的代码定义了函数，并计算迁移学习与从头训练两种场景的收敛速度。它找到奖励达到各自场景最大奖励\
  \ 90% 的第一个回合。\n\n```python\ndef plot_rewards_comparison(self, rewards_transfer,\
  \ rewards_scratch):\n    convergence_speed_transfer = next((i for i, reward in enumerate(rewards_transfer)\
  \ if reward >= 0.9 * max(rewards_transfer)), len(rewards_transfer))\n    convergence_speed_scratch\
  \ = next((i for i, reward in enumerate(rewards_scratch) if reward >= 0.9 * max(rewards_scratch)),\
  \ len(rewards_scratch))\n```\n\n随后代码对每个回合的奖励求和，计算迁移学习与从头训练的总奖励。\n\n```python\n \
  \   total_reward_transfer = sum(rewards_transfer)\n    total_reward_scratch = sum(rewards_scratch)\n\
  ```\n\n为获得更好的可视化效果，使用移动平均平滑奖励曲线。移动平均的窗口大小设为 10。\n\n```python\n    window_size =\
  \ 10\n    rewards_transfer_smoothed = np.convolve(rewards_transfer, np.ones(window_size)/window_size,\
  \ mode='valid')\n    rewards_scratch_smoothed = np.convolve(rewards_scratch, np.ones(window_size)/window_size,\
  \ mode='valid')\n```\n\n下面的代码绘制两种场景的平滑奖励曲线，使用不同颜色和样式以便区分，并添加适当标签。你可以根据喜好修改颜色和样式。\n\
  \n```python\n    plt.plot(np.arange(window_size//2, len(rewards_transfer_smoothed)\
  \ + window_size//2), rewards_transfer_smoothed, label='Transfer Learning', linestyle='--',\
  \ color='blue', alpha=0.7)\n    plt.plot(np.arange(window_size//2, len(rewards_scratch_smoothed)\
  \ + window_size//2), rewards_scratch_smoothed, label='Training from Scratch', linestyle='--',\
  \ color='orange', alpha=0.7)\n```\n\n然后在图上用垂直线高亮显示与迁移学习相关的特定回合。\n\n```python\n \
  \   transfer_epochs = [episode for _, _, episode in policy_progress]\n    for epoch\
  \ in transfer_epochs:\n        plt.axvline(x=epoch, color='gray', linestyle='--',\
  \ linewidth=0.8)\n```\n\n为使图表更丰富，我们添加文本标注以显示两种场景的收敛速度和总奖励。\n\n```python\n    plt.text(0.5,\
  \ 0.6, f\"Convergence Speed (Transfer): {convergence_speed_transfer}\", transform=plt.gca().transAxes)\n\
  \    plt.text(0.5, 0.55, f\"Total Reward (Transfer): {total_reward_transfer}\",\
  \ transform=plt.gca().transAxes)\n    plt.text(0.5, 0.5, f\"Convergence Speed (Scratch):\
  \ {convergence_speed_scratch}\", transform=plt.gca().transAxes)\n    plt.text(0.5,\
  \ 0.45, f\"Total Reward (Scratch): {total_reward_scratch}\", transform=plt.gca().transAxes)\n\
  ```\n\n`plot_rewards_comparison` 函数的最后片段设置图表的标签、标题和图例，并显示图表。\n\n```python\n    plt.xlabel('Episode')\n\
  \    plt.ylabel('Total Reward')\n    plt.title('Q-learning Performance Comparison')\n\
  \    plt.legend()\n    plt.show()\n```\n\n下面的 `plot_comparison_metrics` 方法对比带有迁移学习（预训练\
  \ Q 值迁移）的 Q-learning 与从头训练的 Q-learning 的奖励指标。\n\n```python\ndef plot_comparison_metrics(self,\
  \ rewards_transfer, rewards_scratch, steps_transfer, steps_scratch):\n    fig, axes\
  \ = plt.subplots(1, 2, figsize=(12, 6))\n    ax1 = axes[0]\n    ax1.plot(rewards_transfer,\
  \ label='Transfer Learning')\n    ax1.plot(rewards_scratch, label='Training from\
  \ Scratch')\n    ax1.set_xlabel('Episode')\n    ax1.set_ylabel('Total Reward')\n\
  \    ax1.set_title('Total Reward Comparison')\n    ax1.legend()\n    ax2 = axes[1]\n\
  \    ax2.plot(steps_transfer, label='Transfer Learning')\n    ax2.plot(steps_scratch,\
  \ label='Training from Scratch')\n    ax2.set_xlabel('Episode')\n    ax2.set_ylabel('Steps\
  \ per Episode')\n    ax2.set_title('Steps per Episode Comparison')\n    ax2.legend()\n\
  \    plt.tight_layout()\n    plt.show()\n```\n\n下面展示策略训练与迁移学习步骤的示例执行。为演示迁移学习的工作原理，我们首先实例化修改后的\
  \ `GridWorld` 类，创建一个包含三个障碍物的 **6x6** 网格世界以获得训练好的策略。运行 `q_learning()` 方法得出 **6x6**\
  \ 环境的最优策略和 Q 值。我们将使用这些 Q 值进行迁移学习。代码如下：\n\n```python\nobstacle_positions = [(2, 3),\
  \ (3, 1), (4, 3)]\ngrid_world = GridWorld(grid_size=(6, 6), obstacle_positions=obstacle_positions)\n\
  rewards, steps_per_episode_6x6, policy_progress_6x6 = grid_world.q_learning()\n\
  grid_world.plot_policy_progress(policy_progress_6x6)\n```\n\n\n\n\n# 策略进度可视化与迁移学习对比\n\
  \n上文已获得使用 Q-learning 训练的策略进度，记为 `policy_progress_6x6`，可按 *图 1.5* 进行可视化，其中绘制了智能体在三个代表性回合（第\
  \ 6、20 和 100 回合）中的轨迹。在第 6 和 20 回合中，智能体仍在学习策略，但到第 100 回合时，智能体已学会到达目标的最优路径。\n\n![Figure\
  \ 1.5 Progress in learning shown at various episodes for the 6 x 6 grid with trajectories\
  \ taken by the agent to reach the goal.](img/file8.png)\n\n**图 1.5** 显示了 6 x 6 网格中智能体为到达目标所采取的轨迹，在不同回合中的学习进度。\n\
