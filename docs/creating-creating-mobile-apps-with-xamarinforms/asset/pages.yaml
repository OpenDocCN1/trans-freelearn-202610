    # AbsoluteLayout proportionally


    AbsoluteLayout is actually more sophisticated than the dot-matrix clock example
    might indicate. It includes a facility to automatically scale and position its
    children relative to its own size. You invoke this feature using members of the
    AbsoluteLayoutFlags enumeration:


    +   - None (equal to 0)

    +   - XProportional (1)

    +   - yProportional (2)

    +   - PositionProportional (3)

    +   - WidthProportional (4)

    +   - HeightProportional (8)

    +   - SizeProportional (12)

    +   - All (\xFFFFFFFF)


    You can set a proportional flag on a child of AbsoluteLayout by using an attached
    bindable property applied through the following static method:


    ```

    AbsoluteLayout.SetLayoutFlags(child, flags);

    ```


    Or, you can use a third argument to the Add method that lets you specify the Rectangle
    bounds:'
