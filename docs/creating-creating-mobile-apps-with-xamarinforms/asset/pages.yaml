    \ Xamarin.Forms!\"\n    };\n\n    this.Padding = new Thickness(0, 20, 0, 0);\n\
    }\n```\n```\n\nNow the greeting appears 20 units from the top of the page:\n\n\
    ![](img/c2d61d0459c51981af78607f1eef3d1c_41_0.png)\n\n# 2. Include padding just\
    \ for iOS\n\nSetting the `Padding` property on the `ContentPage` solves the problem\
    \ of the text overwriting the iOS status bar, but it also sets the same padding\
    \ on the Android and Windows Phone where it’s not required. Is there a way to\
    \ set this padding only on the iPhone?\n\nYes! The static `Device` class includes\
    \ several properties and methods that allow your code to deal with device differences\
    \ in a very simple and straightforward manner:\n\n+   - The `Device.OS` property\
    \ returns a member of the `TargetPlatform` enumeration: iOS, Android, WinPhone,\
    \ or Other.\n+   - The `Device.Idiom` property returns a member of the `TargetIdiom`\
    \ enumeration: Phone, Tablet, Desktop, or Unsupported. (However, Xamarin.Forms\
    \ is really only intended for phones at this time.)\n\nYou can use these two properties\
    \ in `if` and `else` statements to execute code specific to a"
