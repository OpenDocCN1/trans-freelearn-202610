    \ = new GridLength(1, GridUnitType.Star);\n            mainGrid.ColumnDefinitions[1].Width\
    \ = new GridLength(0);\n            mainGrid.RowDefinitions[0].Height = new GridLength(1,\
    \ GridUnitType.Star);\n            mainGrid.RowDefinitions[1].Height = GridLength.Auto;\n\
    \n```"
