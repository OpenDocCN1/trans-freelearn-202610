  md: "```\npublic static void SetRadioState(this View view, bool isToggled)\n{\n\
    \    // Check if the property is actually changing.\n    if (instances[view].toggledState\
    \ != isToggled)\n    {\n        // Set the new value.\n        instances[view].toggledState\
    \ = isToggled;\n\n        // Fire the handler.\n        instances[view].toggledHandler(view);\n\
    \n        // If being toggled, untoggle all the siblings.\n        if (isToggled)\n\
    \        {\n            Layout<View> parent = view.ParentView as Layout<View>;\n\
    \n            if (parent != null)\n            {\n                foreach (View\
    \ sibling in parent.Children)\n                {\n                    if (sibling\
    \ != view && instances.ContainsKey(sibling))\n                    {\n        \
    \                sibling.SetRadioState(false);\n                    }\n      \
    \          }\n            }\n        }\n    }\n}\n\npublic static bool GetRadioState(this\
    \ View view)\n{\n    return instances[view].toggledState;\n}\n```\n\nYou can call\
    \ AttachRadioToggler on any View derivative and supply a change handler. The SetRadioState\
    \ and GetRadioState extension methods are necessary because there is no such thing\
    \ as an extension property.\n\nIn response to a call to the toggledHandler method,\
    \ a program can change the View in whatever way it wants. For example, if you’re\
    \ using a Label for the items, you can change the font or the opacity. You’ll\
    \ see an example in the upcoming ColorScroll program.\n\n# Mastering the Grid\n\
    \nThe Grid is a powerful layout mechanism that organizes its children into rows\
    \ and columns of cells. At first the Grid seems to resemble the HTML table, but\
    \ the table is for presentation purposes, while the Grid is solely for layout.\
    \ There is no concept of a heading in a Grid, for example."
