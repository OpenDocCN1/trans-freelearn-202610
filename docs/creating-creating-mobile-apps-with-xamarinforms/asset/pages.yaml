- pgno: 156
  md: "![](img/c2d61d0459c51981af78607f1eef3d1c_156_0.png)\n\nAgain, notice that the\
    \ Title property of this page is displayed at the top of the iOS and Android screens\
    \ and that a left angle bracket suggests that a tap up there serves to navigate\
    \ back to the home page. In addition, the leftmost buttons at the bottom of the\
    \ Android and Windows Phone devices also navigate back to the home page.\n\nBut\
    \ where are the Load and Save buttons? Well, the Load button wouldn’t make any\
    \ sense, because in this version of the program NotePage is only displayed with\
    \ a new filename. The file does not yet exist. However, NotePage should have some\
    \ facility to save the note.\n\nAnd it does. When working with page navigation,\
    \ it’s often convenient to make use of two protected virtual methods defined by\
    \ the Page class called OnAppearing and OnDisappearing. The OnAppearing method\
    \ is called as the page is navigated to, and OnDisappearing method is called as\
    \ the page is being navigated from. In the NotePage class, OnAppearing doesn’t\
    \ do much here (it’s shown just for the sake of symmetry), but the OnDisappearing\
