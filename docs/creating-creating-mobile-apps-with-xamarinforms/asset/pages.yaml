  md: "+   - iOS: **BundleResource**\n+   - Android: **AndroidResource**\n+   - Windows\
    \ Phone: **Content**\n\n# Absolute layout and attached bindable properties\n\n\
    Here’s the Xamarin.Forms class hierarchy showing all the classes that derive from\
    \ `Layout`:\n\n```\nSystem.Object\n    BindableObject\n        Element\n     \
    \       VisualElement\n                View\n                    Layout\n    \
    \                    ContentView\n                            Frame\n        \
    \                    ScrollView\n                        Layout<T>\n         \
    \                   AbsoluteLayout\n                            Grid\n       \
    \                     RelativeLayout\n                            StackLayout\n\
    ```\n\nYou’ve already seen `ContentView`, `Frame`, and `ScrollView` (all of which\
    \ have a `Content` property that you can set to one child) and `StackLayout`,\
    \ which inherits a `Children` property from `Layout<T>`. The `Grid` and `RelativeLayout`\
    \ implement rather more complex layout models; `Grid` is explored in the next\
    \ chapter, and `RelativeLayout` in a later chapter not included in this Preview\
    \ Edition.\n\nAt first glance, the `AbsoluteLayout` class implements a rather\
    \ primitive layout model—one that harkens back to the not-so-good old days of\
    \ those early graphical user interfaces that required the programmer to individually\
    \ size and position every element on the screen.\n\nWith `AbsoluteLayout`, most\
    \ of the rules about layout that you’ve learned so far no longer apply. The `HorizontalOptions`\
    \ and `VerticalOptions` properties that are so important when a `View` is the\
    \ child of a `ContentPage` or `StackLayout` have *absolutely no effect* when a\
    \ `View` is a child of an `AbsoluteLayout`. A program must instead assign to each\
    \ child of an `AbsoluteLayout` a specific location. The child can also be assigned\
    \ a specific size or allowed to size itself.\n\nYou can add a child view to the\
    \ `Children` collection of an `AbsoluteLayout` the same way as with `StackLayout`:\n\
    \n```\nabsoluteLayout.Children.Add(child);\n```"
  merge: -1
  img_proc: true
