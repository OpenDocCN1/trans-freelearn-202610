- pgno: 139
  md: "variable.\n\nIf you can organize your code to eliminate the two comments labeled\
    \ as “Some additional code” and “And perhaps still more code” you can skip the\
    \ assignment to the IAsyncOperation object and just get the result:\n\n```\nasync\
    \ void SomeMethod()\n{\n    // Often some initialization code\n    SomeType myResult\
    \ = await sysClass.LongJobAsync(...);\n    // Code using the result of the asynchronous\
    \ operation\n}\n```\n\nThis is how await is customarily used—as an operator between\
    \ a method that runs asynchronously and the assignment statement to save the result.\n\
    \nDon’t let the name of the await operator fool you! The code doesn’t actually\
    \ sit there waiting. The SomeMethod method returns and the processor is free to\
    \ run other code. Only when the asynchronous operation has completed does the\
    \ code in SomeMethod resume execution where it left off.\n\nOf course, any time\
    \ we’re dealing with file I/O, we should be ready for problems. What happens if\
    \ the file isn’t there, or you run out of storage space? Even when problems don’t\
    \ occur, sometimes error results are normal: The Windows Phone version of the\
    \ Exists method uses an error reported in the Completed handler to determine if\
    \ the file exists or not. So how are errors handled with await?\n\nIf you use\
    \ await with an asynchronous operation that encounters an error or is cancelled,\
    \ await throws an exception. If you need to handle errors or cancellations, you\
    \ can put the await operator in a try and catch block, looking something like\
    \ this:\n\n```\nSomeType myresult = null;\ntry\n{\n    myresult = await sysClass.LongJobAsync(...);\n\
    }\ncatch (OperationCanceledException)\n{\n    // handle a cancellation\n}\ncatch\
    \ (Exception exc)\n{\n    // handle an error\n}\n```\n\nNow let’s use await in\
    \ some real code. Here’s the Windows Phone version of the old ReadAllText method\
    \ in NoteTaker5:\n\n```\npublic void ReadAllText(string filename, Action<string>\
    \ completed)\n{\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
    \    IAsyncOperation<StorageFile> createOp = localFolder.GetFileAsync(filename);\n\
    \    createOp.Completed = (asyncInfo1, asyncStatus1) =>\n    {\n```"
