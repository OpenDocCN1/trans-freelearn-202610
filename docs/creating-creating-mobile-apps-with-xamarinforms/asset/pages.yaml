  md: '# CHAPTER 3


    # # Building an app: Infrastructure


    Sometimes programming tutorials such as this one can cover a lot of ground before
    directly addressing the needs of real-world applications. This chapter and the
    next are an attempt to avoid that common problem.


    These two chapters present an actual application built from the ground up. This
    won’t be a very sophisticated application, but it will be usable and useful. The
    application’s name is **NoteTaker**, and it lets you take notes and save them.


    Each note is some text—as much text as you want—and an optional title. If you
    don’t specify a title, one will be generated for you from the first few words
    of the note.


    When the program is finally finished at the end of the next chapter, it will have
    the following home screen:


    ![](img/c2d61d0459c51981af78607f1eef3d1c_89_0.png)


    That’s a scrollable lists of the titles of the notes you’ve already created. A
    **New** button symbolized by a plus sign appears as a toolbar item either at the
    top or bottom of the screen. Tap that button and the program navigates to a page
    for entering a new note:'
