- pgno: 164
  md: "ItemsSource property, ListView checks if that collection object implements\
    \ this interface. If so, ListView attaches a handler on the CollectionChanged\
    \ event of that collection object. The ListView is then notified when objects\
    \ are added to or removed from the collection (or if the objects are reordered\
    \ in some way), and updates the ListView display accordingly.\n\nNow all we need\
    \ is an actual class that implements INotifyCollectionChanged, and there is one:\
    \ It's in the System.Collections.ObjectModel namespace and it's a generic class\
    \ called ObservableCollection, which is a great name because it implies that by\
    \ using the CollectionChanged event you can observe what's going on inside the\
    \ collection.\n\nThere is also a third way that a collection can change. Perhaps\
    \ the collection object itself doesn't change, and objects are not added to, or\
    \ removed from, the collection, but properties of the objects in the collection\
    \ change. For example, suppose your collection contains a bunch of Weather objects\
    \ for major cities. The collection itself never changes but the Weather class\
    \ contains a Temperature property that changes throughout the day. If this Weather\
    \ object implements INotifyPropertyChanged and fires PropertyChanged events when\
    \ the Temperature property changes, the ListView can respond to those changes\
    \ as well.\n\nNoteTaker8 definitely requires an ObservableCollection, so let's\
    \ handle that first. Let's create a class that will store a collection of Note\
    \ objects. The NoteFolder class has a single property named Notes that is of type\
    \ ObservableCollection<Note>. The constructor calls an asynchronous method that\
    \ obtains a list of all the files using FileHelper.GetFilesAsync, and then sorts\
    \ them by filename. (Keep in mind that the filenames are constructed from the\
    \ date and time when the Note object was created, so these filenames will be sorted\
    \ into the order in which the files were created.) Then a Note object is created\
    \ for each filename, the LoadAsync method is called to load the file into the\
    \ Note object, and it's added to the Notes collection:\n\n```\nnamespace NoteTaker8\n\
    {\n    class NoteFolder\n    {\n        public NoteFolder()\n        {\n     \
    \       this.Notes = new ObservableCollection<Note>();\n            GetFilesAsync();\n\
    \        }\n\n        public ObservableCollection<Note> Notes { private set; get;\
    \ }\n\n        async void GetFilesAsync()\n        {\n            // Sort the\
    \ filenames.\n            IEnumerable<string> filenames =\n                from\
    \ filename in await FileHelper.GetFilesAsync()\n                where filename.EndsWith(\"\
    .note\")\n                orderby (filename)\n                select filename;\n\
    \n            // Store them in the Notes collection.\n```"
