    # Icons for Android


    The Android website has a downloadable collection of toolbar icons at this URL:


    http://developer.android.com/design/downloads


    Download the ZIP file identified as Action Bar Icon Pack.


    The unzipped contents are organized into two main directories: Core_Icons (23
    images), and Action Bar Icons (144 images). These are all PNG files, and the Action
    Bar Icons come in four different sizes indicated by the directory name:


    +   drawable-mdpi (medium dots per inch) — 32 pixels square


    +   drawable-hdpi (high dots per inch) — 48 pixels square


    +   drawable-xhdpi (extra high DPI) — 64 pixels square


    +   drawable-xxhdpi (extra extra high DPI) — 96 pixels square


    These directory names are special. They are the same names as the folders you
    should use in your Android project for storing the icon bitmaps you need. If you
    supply different sizes of icons in these directories, a size appropriate for the
    particular device will be selected at run time.


    The Core_Icons folder also arranges its icons into four directories with the same
    four sizes, but these directories are named mdpi, hdpi, xdpi, and unscaled.


    The Action Bar Icons folder has an additional directory organization using the
    names holo_dark and holo_light. Generally for Android, you’ll want to use PNG
    files that have a white foreground on a transparent background; this is the color
    composition of the files in the holo_dark folder, meaning they are designed for
    a dark background. The holo_light icons have black foregrounds on a transparent
    background; they are much easier to see in Finder and Windows Explorer, but for
    most purposes you should use the holo_dark icons.


    The Core_Icons folder only contains icons with white foregrounds on a transparent
    background.


