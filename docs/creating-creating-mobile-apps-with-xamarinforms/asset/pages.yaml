  md: '![](img/c2d61d0459c51981af78607f1eef3d1c_68_0.png)


    The `Label` views with yellow text on blue backgrounds are those `VerticalOptions`
    properties are set to `LayoutOptions` values without the `Expands` flag set. If
    the `Expands` flag is not set on the `LayoutOptions` value of an item in a vertical
    `StackLayout`, the `VerticalOptions` setting is ignored. As you can see, the `Label`
    occupies only as much vertical space as it needs in the vertical `StackLayout`.


    The total height of the children in this `StackLayout` is less than the height
    of the `StackLayout`, so the `StackLayout` has extra space. It contains four children
    with `VerticalOptions` properties set to `LayoutOptions` values with the `Expands`
    flag set, so this extra space is allocated equally among those four children.


    In these four cases—the `Label` views with blue text on yellow backgrounds—the
    `Alignment` property of the `LayoutOptions` value indicates how the child is aligned
    within the area that includes the extra space. The first one—with the `VerticalOptions`
    property set to `LayoutOptions.StartAndExpand—is above this extra space. The second
    (`CenterAndExpand`) is in the middle of the extra space. The third (`EndAndExpand`)
    is below the extra space. However, in all these three cases, the `Label` is only
    getting as much vertical space as it needs, as indicated by the background color.
    The rest of the space belongs to the `StackLayout`, which shows the background
    color of the page.


    The last `Label` has its `VerticalOptions` property set to `LayoutOptions.FillAndExpand`.
    In this case, the `Label` occupies the entire area including the extra space,
    as the large area of yellow background indicates. The text is at the top of this
    area; that’s because the default setting of `YAlign` is `TextAlignment.Start`.
    Set it to something else to position the text vertically within the area.


    The `Expands` property of `LayoutOptions` plays a role only when the view is a
    child of a `StackLayout`. In other contexts, it’s superfluous.'
