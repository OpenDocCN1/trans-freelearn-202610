- pgno: 7
  md: '# # Introduction


    This is a Preview Edition of a book about writing applications for Xamarin.Forms,
    the exciting new mobile development platform for iOS, Android, and Windows Phone
    unveiled by Xamarin in May 2014. Xamarin.Forms lets you write shared user-interface
    code in C# and XAML (the eXtensible Application Markup Language) that maps to
    native controls on these three platforms.


    This book is a Preview Edition because it''s not complete. It has only six chapters.
    We anticipate that the final version of the book will have at least half a dozen
    additional chapters and that the chapters in this Preview Edition might be fleshed
    out, enhanced, or completely reconceived. The final edition of the book will probably
    be published in the spring of 2015.


    # ## Who should read this book


    This book is for C# programmers who want to write applications for the three most
    popular mobile platforms: iOS, Android, and Windows Phone with a single code base.
    Xamarin.Forms also has applicability for those programmers who want eventually
    to use C# and the Xamarin.iOS and Xamarin.Android libraries to target the native
    application programming interfaces (APIs) of these platforms. Xamarin.Forms can
    be a big help in getting started with these platforms or in constructing a prototype
    or proof-of-concept application.


    # ### Assumptions


    This book assumes that you know C# and have some familiarity with the use of the
    .NET Framework. However, when I discuss some C# and .NET features that might be
    somewhat new to recent C# programmers, I adopt a somewhat slower pace. In particular,
    the introduction of the `async` keyword and `await` operator in Chapter 3 follows
    a discussion that shows how to do asynchronous programming using traditional callback
    methods.


    # ## Organization of this book


    This book is intended as a tutorial to learn Xamarin.Forms programming. It is
    not a replacement for the online API documentation, which can be found here under
    the heading Xamarin.Forms Framework on this page: [http://api.xamarin.com/](http://api.xamarin.com/).


    This Preview Edition''s Chapter 1 discusses Xamarin.Forms in the larger context
    of mobile development and the Xamarin platform and also covers the hardware and
    software configurations you''ll need. Chapter 2 explores some of the basics of
    Xamarin.Forms programming, including the use of `Label`, `Button`, and `StackLayout`.'
  merge: -1
