- pgno: 128
  md: "check and the call, and this code prevents a null-reference exception from\
    \ occurring.\n\nYou can go further in streamlining the OnPropertyChanged method.\
    \ C# 5.0 introduced support for CallerMemberNameAttribute and some related attributes.\
    \ This attribute allows you to replace an optional method argument with the name\
    \ of the calling method or property.\n\nIn the OnPropertyChanged method, make\
    \ the argument optional by assigning null to it and precede it with CallerMemberName\
    \ in square brackets:\n\n```\nprotected virtual void OnPropertyChanged([CallerMemberName]\
    \ string propertyName = null)\n{\n    PropertyChangedEventHandler handler = PropertyChanged;\n\
    \    if (handler != null)\n        handler(this, new PropertyChangedEventArgs(propertyName));\n\
    }\n```\n\nYou’ll need a using directive for System.Runtime.CompilerServices for\
    \ that attribute. Now the Title property can call OnPropertyChanged with no arguments,\
    \ and the propertyName argument will automatically be set to the property name\
    \ “Title” because that’s where the call to OnPropertyChanged is originating:\n\
    \n```\npublic string Title\n{\n    set\n    {\n        if (title != value)\n \
    \       {\n            title = value;\n            OnPropertyChanged();\n    \
    \    }\n    }\n    get\n    {\n        return title;\n    }\n}\n```\n\nThis avoids\
    \ a potentially misspelled text property name, and allows property names to be\
    \ changed during program development without worrying about also changing text\
    \ strings. One of the primary reasons the CallerMemberName was invented was to\
    \ simplify classes that implement INotifyPropertyChanged.\n\nIt’s possible to\
    \ go even further. You’ll need to define a generic method named SetProperty (for\
    \ example) with the CallerMemberName attribute, but you’ll need to remove it from\
    \ OnPropertyChanged:\n\n```\nbool SetProperty<T>(ref T storage, T value, [CallerMemberName]\
    \ string propertyName = null)\n{\n    if (Object.Equals(storage, value))\n   \
    \     return false;\n\n    storage = value;\n```"
  merge: -1
