- pgno: 245
  md: "# Date and time selection\n\nWhile the information from the DateTime.Now property\
    \ can be displayed in a variety of ways, sometimes applications need to allow\
    \ the user to select a date or time. For this purpose, Xamarin.Forms includes\
    \ DatePicker and TimePicker views.\n\nThese are very similar. The two views display\
    \ a date or time, and tapping the view invokes the platform-specific date or time\
    \ selector. On the iPhone and Android, these selectors take over part of the screen;\
    \ on Windows Phone, it takes over the whole screen. The user then dials in a new\
    \ date or time and indicates completion.\n\nDatePicker has three properties of\
    \ type DateTime:\n\n+   - MinimumDate, initialized to January 1, 1900\n+   - MaximumDate,\
    \ initialized to December 31, 2100\n+   - Date, initialized to DateTime.Today\n\
    \nA program can set these properties to whatever it wants. The Date property also\
    \ reflects the user’s selection.\n\nThe DatePicker displays the selected date\
    \ using the normal ToString method, but you can set the Format property of the\
    \ view to a custom .NET formatting string. The initial value is \"d\"—the \"short\
    \ date\" format.\n\nHere’s a program that lets you select two dates and calculates\
    \ the number of days between them:\n\n```\nclass DaysBetweenDatesPage : ContentPage\n\
    {\n    static readonly string dateFormat = \"D\";\n    DatePicker fromDatePicker,\
    \ toDatePicker;\n    Label resultLabel;\n\n    public DaysBetweenDatesPage()\n\
    \    {\n        // Create DatePicker views.\n        fromDatePicker = new DatePicker\n\
    \        {\n            Format = dateFormat,\n            HorizontalOptions =\
    \ LayoutOptions.Center\n        };\n        fromDatePicker.DateSelected += OnDateSelected;\n\
    \n        toDatePicker = new DatePicker\n        {\n            Format = dateFormat,\n\
    \            HorizontalOptions = LayoutOptions.Center\n        };\n        toDatePicker.DateSelected\
    \ += OnDateSelected;\n\n```"
