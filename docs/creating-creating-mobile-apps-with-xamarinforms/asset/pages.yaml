  md: "Internally, these four statements result in similar event handlers being set.\
    \ That’s how the data-binding mechanism works.\n\nHowever, these four statements\
    \ can actually be reduced to three statements. Here’s how:\n\nThe BindingContext\
    \ property has a very special characteristic. It is very likely that more than\
    \ one data binding on a page has the same BindingContext. That is true for this\
    \ little example. For this reason, the BindingContext property is propagated through\
    \ the visual tree of a page. In other words, if you set the BindingContext on\
    \ a page, it will propagate to all the views on that page except for those views\
    \ that have their own BindingContext properties set to something else. You can\
    \ set BindingContext on a StackLayout and it will propagate to all the children\
    \ (and other descendants) of that StackLayout. The two BindingContext settings\
    \ shown above can be replaced with one set on the page itself:\n\n```\nthis.BindingContext\
    \ = note;\n```\n\nThese automated data bindings are part of the NoteTaker5Page\
    \ class. Also, the handlers for the Load and Save buttons have become lambda functions,\
    \ all the variables have been moved to the constructor, and the code is looking\
    \ quite sleek at this point:\n\n```\nclass NoteTaker5Page : ContentPage\n{\n \
    \   static readonly string FILENAME = \"test.note\";\n\n    public NoteTaker5Page()\n\
    \    {\n        // Create Entry and Editor views.\n        Entry entry = new Entry\n\
    \        {\n            Placeholder = \"Title (optional)\"\n        };\n\n   \
    \     Editor editor = new Editor\n        {\n            Keyboard = Keyboard.Create(KeyboardFlags.All),\n\
    \            BackgroundColor = Device.OnPlatform(Color.Default,\n            \
    \    Color.Default,\n                Color.White),\n            VerticalOptions\
    \ = LayoutOptions.FillAndExpand\n        };\n\n        // Set data bindings.\n\
    \        Note note = new Note();\n        this.BindingContext = note;\n      \
    \  entry.SetBinding(Entry.TextProperty, \"Title\");\n        editor.SetBinding(Editor.TextProperty,\
    \ \"Text\");\n\n        // Create Save and Load buttons.\n        Button saveButton\
    \ = new Button\n        {\n            Text = \"Save\",\n            HorizontalOptions\
    \ = LayoutOptions.CenterAndExpand\n```"
