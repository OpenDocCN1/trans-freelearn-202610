  md: "Strictly speaking, data bindings are not a necessary part of the Xamarin.Forms\
    \ interface. Everything you can do with a data binding you can do with explicit\
    \ event handlers. But data bindings can install and manage these event handlers\
    \ for you, so they allow you to write code with less event processing, and which\
    \ consequently appears to have fewer “moving parts.”\n\nOne element of a data\
    \ binding definition that is vulnerable to bugs is the source property name, which\
    \ you indicate with a text string. Visual Studio and Xamarin Studio won’t warn\
    \ you if you’ve spelled it wrong, but the binding won’t work, and the problem\
    \ might be difficult to find.\n\nYou can avoid spelling errors with a generic\
    \ form of the SetBinding method. Earlier you saw a binding to the Opacity property\
    \ of the Label from the Value property of the Slider defined like this:\n\n```\n\
    sliderValueLabel.SetBinding (Label.OpacityProperty, \"Value\");\n```\n\nYou can\
    \ alternately use this form:\n\n```\nsliderValueLabel.SetBinding<Slider> (Label.OpacityProperty,\
    \ src => src.Value);\n```\n\nThe generic argument is Slider, which is the type\
    \ of the source object, and the source Value property is indicated as a lambda\
    \ expression that accesses the property. The method uses .NET reflection to obtain\
    \ the string property name.\n\nYou can do something similar with the longer version\
    \ of the SetBinding method. Here’s the statement that binds the Text property\
    \ of the Label to the Value property of the Slider:\n\n```\nsliderValueLabel.SetBinding\
    \ (Label.TextProperty,\n    new Binding (\"Value\", BindingMode.Default, null,\
    \ null,\n        \"The Slider value is {0:F2}\"));\n```\n\nRather than using a\
    \ Binding constructor as the second argument you can use a static (and generic)\
    \ Binding.Create method:\n\n```\nsliderValueLabel.SetBinding (Label.TextProperty,\n\
    \    Binding.Create<Slider> (src => src.Value, BindingMode.Default, null, null,\n\
    \        \"The Slider value is {0:F2}\"));\n```\n\nThese alternative forms are\
    \ much preferred if you’re also developing the code that defines the source properties,\
    \ because you can rename these source properties without fear of breaking the\
    \ code defining the data bindings.\n\nHere’s a new version of the WhatSize program\
    \ that uses both forms of Binding creation (a practice that in real life might\
    \ make people who need to work on the program sometime later wonder at this apparent\
    \ intention of inconsistency):\n\n```\nclass WhatSizeBindingsPage : ContentPage\n\
    {\n    public WhatSizeBindingsPage()\n    {\n        Font font = Font.SystemFontOfSize(NamedSize.Large);\n\
    ```"
