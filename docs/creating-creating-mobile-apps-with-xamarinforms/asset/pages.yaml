- pgno: 50
  md: 'property named `A` exposes this value, which ranges from 0 for transparent
    to 1 for opaque. All these properties are read-only. Once created, a `Color` value
    is immutable.


    You can create a `Color` value in one of several ways. The three constructors
    are the easiest:


    +   - `new Color(double grayShade)`

    +   - `new Color(double r, double g, double b)`

    +   - `new Color(double r, double g, double b, double a)`


    Arguments can range from 0 to 1. `Color` also defines several static creation
    methods, including:


    +   - `Color.FromRgb(double r, double g, double b)`

    +   - `Color.FromRgb(int r, int g, int b)`

    +   - `Color.FromRgba(double r, double g, double b, double a)`

    +   - `Color.FromRgba(int r, int g, int b, int a)`

    +   - `Color.FromHsla(double h, double s, double l, double a)`


    The two static methods with integer arguments assume that the values range from
    0 to 255, which is the customary representation of RGB colors. Internally, the
    constructor simply divides the integer values by 255.0 to convert to double.


    Watch out! You might think that you’re creating a red color with this call:


    ```

    Color.FromRgb(1, 0, 0)

    ```


    However, the C# compiler will assume that these arguments are integers. The integer
    method will be invoked, and the first argument will be divided by 255.0, with
    a result that is nearly zero. If you want the method that has `double` arguments,
    be explicit:


    ```

    Color.FromRgb(1.0, 0, 0)

    ```


    `Color` also defines static creation methods for a packed `uint` format and a
    hexadecimal format in a string.


    The `Color` structure also defines 16 public static read-only fields of type `Color`.
    Here they are shown with the integer RGB values that the `Color` structure uses
    internally to define these fields, and the corresponding `Hue`, `Saturation`,
    and `Luminosity` values, somewhat rounded for purposes of clarity:


    | Color Fields | Red | Green | Blue | Hue | Saturation | Luminosity |

    |---|---:|---:|---:|---:|---:|---:|

    | White | 255 | 255 | 255 | 0 | 0 | 1.00 |

    | Silver | 192 | 192 | 192 | 0 | 0 | 0.75 |

    | Gray | 128 | 128 | 128 | 0 | 0 | 0.50 |

    | Black | 0 | 0 | 0 | 0 | 0 | 0 |

    | Red | 255 | 0 | 0 | 1.00 | 1 | 0.50 |

    | Maroon | 128 | 0 | 0 | 1.00 | 1 | 0.25 |'
