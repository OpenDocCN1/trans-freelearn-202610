- pgno: 269
  md: "```\nSetSlidersAndBindings ();\n    }\n  }\n}\n...\n}\n```\n\nThe `SetSlidersAndBindings`\
    \ method has the responsibility of setting all the `Slider` properties in accordance\
    \ with the new color mode. For example, for the hexadecimal RGB mode, the Maximum\
    \ property of each `Slider` must be set to 255. Based on the color mode, the `Slider`\
    \ values themselves must be set based on the R, G, and B, or the Hue, Saturation,\
    \ and Luminosity properties of the current color.\n\n`SetSlidersAndBindings` is\
    \ also responsible for setting bindings from the `Value` properties of the three\
    \ `Slider` views to target the three `Label` views that identify these sliders.\
    \ These bindings use the groups of formatting strings defined as field arrays.\
    \ For the floating point RGB or HSL mode, the formatting specification is “F2”,\
    \ and for the hexadecimal RGB mode, the formatting specification is “X2.”\n\n\
    And that is a problem. The `Value` property of the `Slider` is of type `double`,\
    \ and if you attempt to format a `double` with “X2”, an exception will be raised.\n\
    \nIn code, converting from a `double` to an `int` is a trivial cast. But when\
    \ defining a data binding, you don’t have direct access to the data passing from\
    \ the source to the target. So how can this be done?\n\nFortunately, the `Binding`\
    \ constructor and the `Binding.Create` method have an argument of type `IValueConverter`\
    \ specifically for this purpose. `IValueConverter` is an interface that defines\
    \ two methods named `Convert` and `ConvertBack`. You supply a class that implements\
    \ this interface to perform the conversion you need. The `Convert` method is called\
    \ when the property value passes from the source to the target. The `ConvertBack`\
    \ method only plays a role in `TwoWay` or `OneWayToSource` bindings to convert\
    \ the target type to the source type.\n\nHere is an implementation of `IValueConverter`\
    \ to convert from double to int:\n\n```\npublic class DoubleToIntegerConverter\
    \ : IValueConverter\n{\n    public object Convert(object value, Type targetType,\n\
    \                          object parameter, CultureInfo culture)\n    {\n   \
    \     return (int)(double)value;\n    }\n\n    public object ConvertBack(object\
    \ value, Type targetType,\n                              object parameter, CultureInfo\
    \ culture)\n    {\n        return (double)(int)value;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 270
  md: "Although this is certainly one of the simplest `IValueConverter` implementations\
    \ imaginable, they often aren’t very elaborate. In `Convert`, the `value` argument\
    \ is the value from the source, and the return value goes to the target. You can\
    \ customize the method by checking the `targetType` argument, which is the type\
    \ of the target property. You can also pass a `parameter` from the `Binding` constructor\
    \ or `Binding.Create` method. You’ll see more examples in future chapters.\n\n\
    The `SetSlidersAndBindings` method instantiates `DoubleToIntConverter` when it’s\
    \ required for the bindings. In a real program, you only need one instance of\
    \ `DoubleToIntConverter` for the lifetime of the program, and you can instantiate\
    \ it as a field.\n\n```\nclass ColorScrollPage : ContentPage\n{\n    …\n\n   \
    \ void SetSlidersAndBindings()\n    {\n        // Don't handle ValueChange events\
    \ from Sliders!\n        ignoreSliderValueChanges = true;\n\n        double sliderMax\
    \ = 1;\n        string[] format = null;\n        IValueConverter valueConverter\
    \ = null;\n\n        // Set local variables for color mode.\n        switch (currentColorMode)\n\
    \        {\n            case ColorMode.RgbHex:\n                sliderMax = 255;\n\
    \                format = rgbHexFormat;\n                valueConverter = new\
    \ DoubleToIntegerConverter();\n                break;\n\n            case ColorMode.RgbFloat:\n\
    \                format = rgbFloatFormat;\n                break;\n\n        \
    \    case ColorMode.Hsl:\n                format = hslFormat;\n              \
    \  break;\n        }\n\n        // Bind the labels to the sliders.\n        for\
    \ (int i = 0; i < 3; i++)\n        {\n            sliders[i].Maximum = sliderMax;\n\
    \            labels[i].BindingContext = sliders[i];\n            labels[i].SetBinding(Label.TextProperty,\n\
    \                new Binding(\"Value\", BindingMode.OneWay, valueConverter, null,\
    \ format[i]));\n        }\n\n        // Now set the slider values.\n        Color\
    \ currentColor = this.currentColor;\n```"
