- pgno: 263
  md: 'column spans have default values of 1. Grid also defines static Get methods
    to obtain the current values. As with the static methods defined by the AbsoluteLayout
    class, these are implemented by referencing attached bindable properties. The
    Grid.SetColumn and Grid.SetRow calls are equivalent to the following calls on
    the child view object:


    ```

    child.SetValue (Grid.ColumnProperty, 2);

    child.SetValue (Grid.RowProperty, 3);

    ```


    That is how the static properties are defined.


    There is no difference in calling


    ```

    grid.Children.Add (child, 2, 3);

    ```


    and calling:


    ```

    Grid.SetColumn (child, 2);

    Grid.SetRow (child, 3);

    grid.Children.Add (child);

    ```


    The shortcut methods are implemented using the static methods defined by Grid
    and the Add call.


    In many cases, when you define Grid contents using the extended Add methods, you
    don’t need to use these static methods or bother with the Grid attached bindable
    properties. However, sometimes they come in very handy to change the rows and
    columns of Grid contents at a later time. For example, shifting children around
    in a Grid is one way to adapt your page to orientation changes.


