  md: "This was done for the **BlackCat** project, and consequently the TheBlackCat.txt\
    \ file is embedded in the BlackCat.dll file.\n\nIn code, the file can be retrieved\
    \ by calling the `GetManifestResourceStream` method defined by the `Assembly`\
    \ class in the `System.Reflection` namespace. To get the assembly of the PCL,\
    \ all you need to do is get the `Type` of any class defined in the assembly. You\
    \ can use `typeof` with the page type you’ve derived from `ContentPage`, or `GetType`\
    \ on the instance of that class. Then call `GetTypeInfo` on this `Type` object.\
    \ `Assembly` is a property of the resultant `TypeInfo` object:\n\n```\nAssembly\
    \ assembly = this.GetType().GetTypeInfo().Assembly;\n```\n\nIn the `GetManifestResourceStream`\
    \ method of `Assembly` you’ll need to specify the name of the resource. For embedded\
    \ resources, that name is not the filename of the resource but the resource ID.\
    \ It’s easy to confuse these because that ID might look vaguely like a fully-qualified\
    \ filename.\n\nThe resource ID begins with the default namespace of the assembly.\
    \ This is not the .NET namespace! To get the default namespace of the assembly\
    \ in Visual Studio, select **Properties** from the project menu, and in the properties\
    \ dialog, select **Library** at the left and look for the **Default namespace**\
    \ field. In Xamarin Studio, select **Options** from the project menu, and in the\
    \ **Project Options** dialog, select **Main Settings** at the left, and look for\
    \ a field labeled **Default Namespace**.\n\nFor the **BlackCat** project, that\
    \ default namespace is the same as the assembly: “BlackCat”. However, you can\
    \ actually set that default namespace to whatever you want.\n\nThe resource ID\
    \ begins with that default namespace, followed by a period, followed by the folder\
    \ name you might have used, followed by another period and the filename. For this\
