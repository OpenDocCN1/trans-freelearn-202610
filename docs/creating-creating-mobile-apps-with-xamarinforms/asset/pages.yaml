  md: "make this calculation a little more conservative to avoid surprises. (Or, you\
    \ can set a SizeChanged handler on a Label and adjust the font size dynamically,\
    \ but that process will generate another SizeChanged event so the process can\
    \ be tricky.)\n\nThe following program uses both line spacing and average character\
    \ width to fit a paragraph of text on the page—or rather, on the page minus the\
    \ area at the top of the iPhone occupied by the status bar. To make the exclusion\
    \ of the status bar a bit easier in this program, the program uses a ContentView.\n\
    \nContentView derives from Layout but only adds a Content property to what it\
    \ inherits from Layout. ContentView is the base class to Frame and otherwise seems\
    \ to serve no apparent purpose—except when it comes in really handy.\n\nAs you\
    \ might have noticed, Xamarin.Forms has no concept of a margin, which traditionally\
    \ is similar to padding except that padding is inside a view and a part of the\
    \ view, while a margin is outside the view and actually part of the parent’s view.\n\
    \nXamarin.Forms doesn’t have a margin property, but you can simulate it very easily\
    \ with a ContentView. If you find a need to set a margin on a view, put the view\
    \ in a ContentView and set the Padding property on the ContentView. ContentView\
    \ inherits a Padding property from Layout.\n\nThe EstimatedFontSize program uses\
    \ ContentView in a slightly different manner: It sets the customary Padding on\
    \ the page to avoid the iOS status bar, but then sets a ContentView as the content\
    \ of that page. Hence, this ContentView is the same size as the page but excluding\
    \ the iOS status bar.\n\nIt is on this ContentView that the SizeChanged event\
    \ is attached, and it is the size of this ContentView that is used to calculate\
    \ the text font size. The calculation is described in comments:\n\n```\nclass\
    \ EstimatedFontSizePage : ContentPage\n{\n    Label label;\n\n    public EstimatedFontSizePage()\n\
    \    {\n        // Create the Label.\n        label = new Label();\n\n       \
    \ // Put the Label in a ContentView.\n        ContentView contentView = new ContentView\n\
    \        {\n            Content = label\n        };\n\n        // Monitor the\
    \ ContentView size changes!\n        contentView.SizeChanged += OnContentViewSizeChanged;\n\
    \n        // A little padding for iOS.\n        this.Padding = new Thickness(0,\
    \ Device.OnPlatform(20, 0, 0), 0, 0);\n    }\n```"
