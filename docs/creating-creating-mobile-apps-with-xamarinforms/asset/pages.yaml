- pgno: 16
  md: '# Sharing code


    The advantage of targeting multiple platforms with a single programming language
    comes from the ability to share code among the applications.


    Before code can be shared, it must be structured for that purpose. Particularly
    since the widespread use of graphical user interfaces, programmers have understood
    the importance of separating application code into functional layers. Perhaps
    the most useful division is between user interface code and the underlying data
    models and algorithms. The popular MVC (Model-View-Controller) application architecture
    formalizes this code separation into a Model (the underlying data), the View (the
    visual representation of the data), and the Controller (which handles input from
    the user).


    MVC originated in the 1980s. More recently, the MVVM (Model-View-ViewModel) architecture
    has effectively modernized MVC based on modern GUIs. MVVM separates code into
    the Model (the underlying data), the View (the user interface, including visuals
    and input), and the ViewModel (which manages data passing between the Model and
    the View).


    When developing a program that targets multiple mobile platforms, the MVVM architecture
    helps guide the developer into separating code into the platform-specific View—the
    code that requires interacting with the platform APIs—and the platform-independent
    Model and ViewModel.


    Often this platform-independent code needs to access files or the network, or
    use collections or threading. Normally these jobs would be considered part of
    an operating system API, but they are also jobs that can make use of the .NET
    Framework class library, and if the class library is available on each platform,
    it is effectively platform-independent.


    The part of the application that is platform-independent can then be isolated,
    and—in the context of Visual Studio or Xamarin Studio—put into a separate project.
    This can be either a Shared Asset Project (SAP)—which simply consists of code
    and other asset files accessible from other projects—or a Portable Class Library
    (PCL), which encloses all the common code in a dynamic-link library (DLL) that
    can then be referenced from other projects.


    Whichever method is used, this common code has access to the .NET Framework class
    library, so it can perform file I/O, handle globalization, access web services,
    decompose XML, and so forth.


    This means that you can create a single Visual Studio solution that contains four
    C# projects to target the three major mobile platforms, or you can use Xamarin
    Studio to target iPhone and Android devices.


    Here’s a diagram roughly showing the interrelationships between the Visual Studio
    or Xamarin Studio projects, the Xamarin libraries, and the platform APIs:'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/c2d61d0459c51981af78607f1eef3d1c_17_0.png)


    The boxes in the second row are the actual platform-specific applications. These
    make calls into the common project and also (in the case with the iPhone and Android),
    the Xamarin libraries that implement the native platform APIs.


    But the diagram is not quite complete: It doesn’t show the SAP or PCL making calls
    to the .NET Framework class library. The PCL has access to its own version of
    .NET, while the SAP uses the version of .NET incorporated into each particular
    platform.


    In this diagram, the Xamarin.iOS and Xamarin.Android libraries seem to be substantial,
    and while they are certainly important, they’re mostly just language bindings
    and do not significantly add any overhead to API calls.


    When the iPhone app is built, the Xamarin C# compiler generates C# Intermediate
    Language (IL) as usual but then makes use of the Apple compiler on the Mac to
    generate native iPhone machine code just like the Objective-C compiler. The calls
    from the app to the iPhone APIs are the same as if the application were written
    in Objective-C.


    For the Android app, the Xamarin C# compiler generates IL, which runs on a version
    of Mono on the device alongside the Java engine, but the API calls from the app
    are pretty much the same as if the app were written in Java.


    For mobile applications that have very platform-specific needs but also a potentially
    shareable chunk of platform-independent code, Xamarin.iOS and Xamarin.Android
    provide excellent solutions. You have access to the entire platform API, with
    all the power (and responsibility) that implies.


    But for applications that might not need quite so much platform specificity, there
    is now an alternative that will simplify your life even more.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Introducing Xamarin.Forms


    On May 28, 2014, Xamarin introduced Xamarin.Forms as part of a collection of enhancements
    to the Xamarin platform dubbed Xamarin 3. Xamarin.Forms allows you to write user-interface
    code that can be compiled for the iPhone, Android, and Windows Phone.


    # The Xamarin.Forms option


    In the general case, a Xamarin.Forms application is three separate projects for
    the three mobile platforms with a fourth project containing common code—very much
    like the diagram that appeared in the previous section.


    However, in a Xamarin.Forms application, the three platform projects are usually
    very small—often consisting of just stubs with a little boilerplate startup code.
    The Shared Asset Project, or the Portable Class Library project, contains the
    bulk of the application, including the user-interface code:


    ![](img/c2d61d0459c51981af78607f1eef3d1c_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'The Xamarin.Forms.Core and Xamarin.Forms.Xaml libraries implement the Xamarin.Forms
    API. Depending on the platform, Xamarin.Forms.Core then makes use of one of the
    Xamarin.Forms.Platform libraries. These libraries are mostly a collection of classes
    called renderers that transform the Xamarin.Forms user-interface objects into
    the platform-specific user interface.


    The remainder of the diagram is the same as the one shown earlier.


    For example, suppose you need the user-interface object discussed earlier that
    allows the user to toggle between two options. When programming for Xamarin.Forms,
    this is called a `Switch`, and a class named `Switch` is implemented in the Xamarin.Forms.Core
    library. In the individual renderers for the three platforms, this `Switch` is
    mapped to a `UISwitch` on the iPhone, a `Switch` on Android, and a `ToggleSwitchButton`
    on Windows Phone.


    Xamarin.Forms.Core also contains a class named `Slider` for displaying a horizontal
    bar that the user manipulates to choose a numeric value. In the renderers in the
    platform-specific libraries, this is mapped to a `UISlider` on the iPhone, a `SeekBar`
    on Android, and a `Slider` on Windows Phone.


    This means that when you write a Xamarin.Forms program that has a `Switch` or
    a `Slider`, what’s actually displayed is the corresponding object implemented
    in each platform.


    Here’s a little Xamarin.Forms program containing a `Label` reading “Hello, Xamarin.Forms!”,
    a `Button` saying “Click Me!”, a `Switch`, and a `Slider`. The program is running
    on (from left to right) the iPhone, Android, and Windows Phone:


    ![](img/c2d61d0459c51981af78607f1eef3d1c_19_0.png)


    You’ll see triple screenshots like this one throughout this book. They’re always
    in the same order—iPhone, Android, and Windows Phone—and they’re always running
    the same program.'
  merge: -1
  img_proc: true
