  md: "+   - If IsToggled is true, set IsToggled to false on all RadioButton siblings.\n\
    \nHere’s both the static and instance versions of the IsToggled property changed\
    \ handler:\n\n```\nclass RadioButton : ContentView\n{\n    // Property changed\
    \ handler for the IsToggled property.\n    static void OnIsToggledPropertyChanged(BindableObject\
    \ sender,\n                                            object oldValue, object\
    \ newValue)\n    {\n        // Get the object whose property is changing.\n  \
    \      RadioButton radioButton = (RadioButton)sender;\n        radioButton.OnIsToggledPropertyChanged((bool)oldValue,\
    \ (bool)newValue);\n    }\n\n    void OnIsToggledPropertyChanged(bool oldValue,\
    \ bool newValue)\n    {\n        this.checkLabel.Text = newValue ? checkOn : checkOff;\n\
    \n        // Fire the event.\n        if (this.Toggled != null)\n        {\n \
    \           this.Toggled(this, new ToggledEventArgs(this.IsToggled));\n      \
    \  }\n\n        // If toggled on, toggle off all siblings.\n        if (this.IsToggled)\n\
    \        {\n            Layout<View> parent = this.ParentView as Layout<View>;\n\
    \n            if (parent != null)\n            {\n                foreach (View\
    \ view in parent.Children)\n                {\n                    if (view is\
    \ RadioButton && view != this)\n                    {\n                      \
    \  ((RadioButton)view).IsToggled = false;\n                    }\n           \
    \     }\n            }\n        }\n    }\n}\n```\n\nThere’s only one piece missing:\
    \ RadioButton doesn’t yet respond to touch. Whenever a RadioButton is tapped,\
    \ it must set its IsToggled property to true.\n\nA Xamarin.Forms view can obtain\
    \ touch input through a GestureRecognizer object. For taps, you create an object\
    \ of type TapGestureRecognizer with a callback method that is called when the\
    \ taps occur. (This is the only type of GestureRecognizer currently available.)\
    \ Then add this TapGestureRecognizer to the GestureRecognizers collection of the\
    \ view."
