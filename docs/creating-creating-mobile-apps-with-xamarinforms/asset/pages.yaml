    # Version 12. Application lifecycle events


    Suppose someone is using the NoteTaker program and decides to enter a new note
    or edit an existing note. The user enters some text in the Entry and Editor views,
    and then is interrupted with a distraction—perhaps a phone call. Later on, the
    user shuts off the phone.


    What should happen the next time the NoteTaker program is launched? Should that
    new note in progress—or the edits to the existing note—have been discarded? That
    doesn’t seem reasonable, yet if you consider that NoteTaker saves notes only during
    the OnDisappearing override of the NotePage class, that’s exactly what will happen.


    What can be done about this problem? One approach is to attach handlers for the
    TextChanged events of the Entry and Editor views and save the file every time
    the text changes. But that’s a lot of file activity, and you’d need to have some
    special provision if the user decides to cancel the edits.


    This problem is not something that programmers worried about in the old days.
    Programs on desktop computers have specific commands to open and save files, and
    if you as a user try to close a program without saving the document first, the
    program asks you if you want to save your work. But if you happen to switch off
    your computer without saving first, that’s your problem!


    Expectations are very different with mobile devices. Users expect applications
    to remember exactly what they were doing the last time they interacted with the
    program.'
