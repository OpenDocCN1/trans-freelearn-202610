    \ };\n    string[] rgbFloatFormat = { \"Red = {0:F2}\", \"Green = {0:F2}\", \"\
    Blue = {0:F2}\" };\n    string[] hslFormat = { \"Hue = {0:F2}\", \"Saturation\
    \ = {0:F2}\", \"Luminosity = {0:F2}\" };\n    ...\n}\n```\n\nAs usual, the constructor\
