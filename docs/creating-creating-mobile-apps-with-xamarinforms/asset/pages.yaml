  md: "```\nusing System.Runtime.CompilerServices;\nusing System.Threading.Tasks;\n\
    \nnamespace NoteTaker6\n{\n    class Note : INotifyPropertyChanged\n    {\n  \
    \      ...\n\n        public Task SaveAsync(string filename)\n        {\n    \
    \        string text = this.Title + \"\\n\" + this.Text;\n            return FileHelper.WriteTextAsync(filename,\
    \ text);\n        }\n\n        public async Task LoadAsync(string filename)\n\
    \        {\n            string text = await FileHelper.ReadTextAsync(filename);\n\
    \n            // Break string into Title and Text.\n            int index = text.IndexOf('\\\
    n');\n            this.Title = text.Substring(0, index);\n            this.Text\
    \ = text.Substring(index + 1);\n        }\n\n        ...\n    }\n}\n```\n\nNeither\
    \ of these methods returns a value, but because they are asynchronous, the methods\
    \ return a Task object that can be awaited. There are a couple ways to deal with\
    \ such methods. The SaveAsync method simply returns the return value from FileHelper.WriteTextAsync,\
    \ which is also a Task object. The LoadAsync method has no return statement, although\
    \ it could surely end with an empty return statement. The SaveAsync method could\
    \ have an implicit empty return statement but the WriteTextAsync call would have\
    \ to be preceded with await, and because of the existence of that await operator,\
    \ the method would need an async modifier:\n\n```\npublic async Task SaveAsync(string\
    \ filename)\n{\n    string text = this.Title + \"\\n\" + this.Text;\n    await\
    \ FileHelper.WriteTextAsync(filename, text);\n}\n```\n\nThese new function definitions\
    \ require changes to the code in the NoteTaker6Page constructor as well, and you\
    \ have a couple choices. You can define the Clicked handler for the Load button\
    \ like so:\n\n```\nloadButton.Clicked += (sender, args) =>\n{\n    note.LoadAsync(FILENAME);\n\
    };\n```"
