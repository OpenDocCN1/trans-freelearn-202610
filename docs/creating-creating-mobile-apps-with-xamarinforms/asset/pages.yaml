- pgno: 261
  md: "different option for each column or row of the `Grid`:\n\n+   - `Auto`: This\
    \ is the default. The column width or row height is based on the child width and\
    \ height.\n+   - `Absolute`: A column width or row height in device-independent\
    \ units.\n+   - `Star`: Similar to the star (asterisk) option in HTML tables,\
    \ which allocates the space proportionally.\n\nIf there is no `ColumnDefinition`\
    \ or `RowDefinition` object corresponding to a particular column or row, `Auto`\
    \ is used.\n\nTry inserting this code in the `KeypadGridPage` constructor any\
    \ time after the `Grid` has been created:\n\n```\nfor (int col = 0; col < 3; col++)\n\
    {\n    grid.ColumnDefinitions.Add(new ColumnDefinition\n    {\n        Width =\
    \ new GridLength(1, GridUnitType.Star)\n    });\n}\n```\n\nNow all the columns\
    \ have the same width:\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_261_0.png)\n\
    \nThe `Star` option allocates space proportionally based on the first argument\
    \ to `GridLength`. In the above example, all three columns have the same relative\
    \ width of 1, but if you instead set it to `(col + 1)`:"
