    \ the NoteTaker2Pcl version has the same deficiency as NoteTaker2Sap in that it\
    \ doesn’t persist the data for Windows Phone.\n\n# Version 3. Going async\n\n\
    The data isn’t persisted for Windows Phone because the file I/O code is not correct.\
    \ A Xamarin.Forms application targets Windows Phone 8, which implements a subset\
    \ of the same WinRT file I/O available to Windows 8 applications, largely found\
    \ in the new Windows.Storage and Windows.Storage.Streams namespaces.\n\nWindows\
    \ Phone 8 continues to support some older file I/O functions that Windows Phone\
    \ 7 inherited from Silverlight, but these are not recommended for new Windows\
    \ Phone 8 applications. Windows Phone 8 applications should instead use the WinRT\
    \ file I/O API, and the programs in this book follow that recommendation.\n\n\
    Part of the impetus behind this new array of file I/O classes in Windows 8 and\
    \ Windows Phone 8 is a recognition of a transition away from the relatively unconstrained\
    \ file access of desktop applications towards a more sandboxed environment. To\
    \ store data that is private to an application, a Windows Phone program first\
    \ gets a special StorageFolder object:\n\n```\nStorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
    ```\n\nApplicationData has a static property named Current that returns the ApplicationData\
    \ object for the application. LocalFolder is an instance property of ApplicationData.\n\
    \nStorageFolder defines methods named CreateFileAsync to create a new file and\
    \ GetFileAsync to open an existing file. These two methods return objects of type\
    \ StorageFile. At this point, a program can open the file for writing or reading\
    \ with OpenAsync or OpenReadAsync. These methods return an IRandomAccessStream\
    \ object. From this, DataWriter or DataReader objects are created to perform write\
    \ or read operations.\n\nThis sounds a bit lengthy, and it is. A rather simpler\
    \ approach for text files involves the static methods FileIO.ReadTextAsync and\
    \ FileIO.WriteTextAsync. The first argument to these methods is a StorageFile\
    \ object, and the methods incorporate all the operations to open the file, write\
    \ to it or read from it, and close the file. Although these methods are available\
    \ in Windows Phone 8.1, they are not in Windows Phone 8, the version of Windows\
    \ Phone supported by Xamarin.Forms.\n\nAt any rate, by this time you’ve undoubtedly\
    \ noticed the frequent Async suffix on these method names. These are asynchronous\
    \ methods. Internally, these methods spin off secondary threads of execution for\
    \ doing the actual work and return quickly to the caller. The work takes place\
    \ in the"
