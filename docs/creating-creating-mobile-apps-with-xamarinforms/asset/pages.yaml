  md: "```\nentry.TextChanged += (sender, args) =>\n{\n    note.Title = args.NewTextValue;\n\
    };\n```\n\nYou can do pretty much the same thing by installing a handler for the\
    \ PropertyChanged event of the Entry view and checking for the Text property:\n\
    \n```\nentry.PropertyChanged += (sender, args) =>\n{\n    if (args.PropertyName\
    \ == \"Text\")\n        note.Title = entry.Text;\n};\n```\n\nIn a sense, the TextChanged\
    \ event defined by Entry and Editor is redundant and unnecessary. It is provided\
    \ solely for purposes of programmer convenience.\n\nMany of the classes in Xamarin.Forms\
    \ implement INotifyPropertyChanged automatically because they derive from a class\
    \ named BindableObject that implements this interface. BindableObject also defines\
    \ a protected virtual method named OnPropertyChanged.\n\nAs its name implies,\
    \ BindableObject is important to the support of data binding in Xamarin.Forms,\
    \ yet the implementation of INotifyPropertyChanged by this class is only part\
    \ of the story and, to be honest, the easier part.\n\nLet’s begin exploring the\
    \ more arcane part of BindableObject with some experimentation. In one of the\
    \ previous versions of the NoteTaker program, try initializing the Entry view\
    \ with some text:\n\n```\nentry.Text = \"This is some text\";\n```\n\nNow when\
    \ you run the program the Entry is initialized with this text. But now try replacing\
    \ that property setting with this method call:\n\n```\nentry.SetValue(Entry.TextProperty,\
    \ \"This is some text\");\n```\n\nThis works as well. These two statements are\
    \ functionally identical.\n\nLook at that weird first argument to SetValue: It’s\
    \ something called Entry.TextProperty, which indicates that it’s static, but it’s\
    \ not a property at all. It’s static field of the Entry class. It’s also read-only,\
    \ and it’s defined in the Entry class something like this:\n\n```\npublic static\
    \ readonly BindableProperty TextProperty;\n```\n\nIt’s a little odd for a field\
    \ of a class to be named TextProperty, but there it is. Because it’s static, however,\
    \ it exists independently of any Entry objects that might or might not exist.\n\
    \nIf you look in the documentation of the Entry class, you’ll see that it defines\
    \ four properties—Text, TextColor, IsPassword, and Placeholder—and you’ll also\
    \ see four corresponding public static read-only fields of type BindableProperty\
    \ with the names TextProperty, TextColorProperty, IsPasswordProperty, and PlaceholderProperty."
