- pgno: 151
  md: "# CHAPTER 4\n\n# Building an app: Architecture\n\nThe **NoteTaker** application\
    \ has evolved from a concept to a single-page program that contains much of the\
    \ basic infrastructure to save and retrieve a note. It must now be expended to\
    \ a multipage application that can display and maintain multiple notes.\n\nThis\
    \ chapter illustrates the steps to implement all the necessary features for that\
    \ enhanced version. Two important Xamarin.Forms visual elements are necessary:\
    \ The first is `NavigationPage`, which allows a program to navigate among multiple\
    \ pages, and the second is `ListView`, which displays a scrollable and selectable\
    \ list of items, usually of the same type. In this program, `ListView` will display\
    \ multiple `Note` objects.\n\nAlso required for specifying some program actions\
    \ is `ToolbarItem`. Strictly speaking, `ToolbarItem` is not a visual element,\
    \ but it's used to specify items for a toolbar displayed at the top of the page\
    \ (on iOS and Android) or the bottom (on Windows Phone).\n\nFrom the programmer's\
    \ perspective, one of the big differences between programming for traditional\
    \ desktop applications and programming for mobile applications is the need to\
    \ understand the application lifecycle. Between the time that a mobile app is\
    \ launched and the time it is terminated, the app might be suspended. It is important\
    \ at this time for applications to save application data—including transient data—necessary\
    \ to re-create the contents of the application when it's restarted. Application\
    \ lifecycle programming is also a major part of creating a real app.\n\n# Version\
    \ 7. Page navigation\n\nSo far, all the programs in this book have been based\
    \ around a single instance of a single class that derives from `ContentPage`.\
    \ In contrast, **NoteTaker7** contains two classes that derive from `ContentPage`,\
    \ named `HomePage` and `NotePage`. When the program starts up, it displays `HomePage`,\
    \ which lists all the notes you've entered in previous sessions. From `HomePage`\
    \ the user is able to navigate to `NotePage` for entering new notes, or for editing\
    \ or deleting existing notes, and then navigate back to `HomePage`, which displays\
    \ an updated list.\n\nThe methods that Xamarin.Forms makes available for page\
    \ navigation are all defined by the `INavigation` interface in the `Xamarin.Forms`\
    \ namespace:\n\n```\npublic interface INavigation\n{\n    Task PushAsync(Page\
    \ page);\n    Task<Page> PopAsync();\n    Task PopToRootAsync();\n    Task PushModalAsync(Page\
    \ page);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "```\n```csharp\nTask<Page> PopModalAsync();\n}\n```\n```\n\nThese are all asynchronous\
    \ methods, which means they return immediately while the navigation operation\
    \ proceeds.\n\nAs you can probably deduce from the names of these methods, page\
    \ navigation in Xamarin.Forms works like a familiar last-in-first-out stack: Each\
    \ PushAsync call pushes the current page on the stack and navigates to the specified\
    \ page. Each call to PopAsync pops the previous page from the stack and navigates\
    \ back to that popped page. This architecture is very familiar to users because\
    \ web browsers work similarly.\n\nExplicit calls to PopAsync are not always required\
    \ because the user can often navigate backward using the hardware back button\
    \ on the Android or Windows Phone, or a back button automatically supplied as\
    \ part of the page navigation user interface by iOS and Android. The PopToRootAsync\
    \ call essentially clears the stack and goes back to the home page. A future chapter\
    \ (not in this Preview Edition) will contain a more extensive discussion of pages\
    \ and navigation, including the Modal methods for pop-up page navigation.\n\n\
    The INavigation interface is implemented by a class internal to Xamarin.Forms\
    \ but which is accessible through the object returned from the Navigation property\
    \ defined by VisualElement. Very often it’s convenient to use the Navigation property\
    \ of the page itself to navigate to another page. For example:\n\n```\n```csharp\n\
    this.Navigation.PushAsync(new AnotherPage());\n```\n```\n\nHowever, you can use\
    \ the Navigation property of any view on the page if that’s more convenient.\n\
    \nTo enable page navigation within a Xamarin.Forms application, the App.GetMainPage\
    \ method should return an instance of NavigationPage rather than ContentPage.\
    \ Fortunately, this change is exceptionally easy. If HomePage is derived from\
    \ ContentPage (which is the case in the NoteTaker7 application), then App.GetMainPage\
    \ simply passes a new instance of that page to the NavigationPage constructor\
    \ and returns the result. Here’s the App class in NoteTaker7:\n\n```\n```csharp\n\
    namespace NoteTaker7\n{\n    public class App\n    {\n        public static Page\
    \ GetMainPage()\n        {\n            return new NavigationPage(new HomePage());\n\
    \        }\n    }\n}\n```\n```\n\nThat turns a ContentPage object into a NavigationPage\
    \ object.\n\nStrictly speaking, this wrapping of a ContentPage in a NavigationPage\
    \ is not required for Windows Phone, but you need it for iOS and Android, so it’s\
    \ easiest to use the same code for all three"
  merge: -1
  img_proc: true
- pgno: 153
  md: "platforms.\n\nFor iOS and Android, this change has a demonstrable effect on\
    \ the visual appearance of the page. An area at the top of the page is reserved\
    \ for a page title that you can set using the `Title` property that `Page` defines.\
    \ You should set this `Title` property whenever you’ve enabled page navigation.\n\
    \nThe HomePage class in **NoteTaker7** derives from `ContentPage`, and the constructor\
    \ sets that `Title` property. The constructor also creates a centered `Button`\
    \ with the text “Add New Note” and a `Clicked` handler that fabricates a unique\
    \ filename based on the current date and time and navigates to `NotePage`:\n\n\
    ```\nnamespace NoteTaker7\n{\n    class HomePage : ContentPage\n    {\n      \
    \  public HomePage()\n        {\n            this.Title = \"Note Taker 7\";\n\n\
    \            Button button = new Button\n            {\n                Text =\
    \ \"Add New Note\",\n                HorizontalOptions = LayoutOptions.Center,\n\
    \                VerticalOptions = LayoutOptions.Center\n            };\n\n  \
    \          button.Clicked += (sender, args) =>\n            {\n              \
    \  // Create unique filename.\n                DateTime datetime = DateTime.UtcNow;\n\
    \                string filename = datetime.ToString(\"yyyyMMddHHmmssfff\") +\
    \ \".note\";\n\n                // Navigate to new NotePage.\n               \
    \ this.Navigation.PushAsync(new NotePage(filename));\n            };\n\n     \
    \       this.Content = button;\n        }\n    }\n}\n```\n\nHere’s how this page\
    \ looks when **NoteTaker7** is running on the three platforms:"
