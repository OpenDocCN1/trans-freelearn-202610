- pgno: 140
  md: "```\n```csharp\nIStorageFile storageFile = asyncInfo1.GetResults();\nIAsyncOperation<IRandomAccessStreamWithContentType>\
    \ openOp =\n    storageFile.OpenReadAsync();\nopenOp.Completed = (asyncInfo2,\
    \ asyncStatus2) =>\n{\n    IRandomAccessStream stream = asyncInfo2.GetResults();\n\
    \    DataReader dataReader = new DataReader(stream);\n    uint length = (uint)stream.Size;\n\
    \    DataReaderLoadOperation loadOp = dataReader.LoadAsync(length);\n    loadOp.Completed\
    \ = (asyncInfo3, asyncStatus3) =>\n    {\n        string text = dataReader.ReadString(length);\n\
    \        dataReader.Dispose();\n        Completed(text);\n    };\n};\n};\n};\n\
    ```\n```\n\nThis has three nested `Completed` handlers. Because the method returns\
    \ before even the first `Completed` handler executes, it is not possible to return\
    \ the contents of the file from the method. The file contents must instead be\
    \ returned through a function passed to the method.\n\nHere’s how it can be rewritten\
    \ using `await`:\n\n```\n```csharp\npublic async void ReadAllText(string filename,\
    \ Action<string> completed)\n{\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
    \    IStorageFile storageFile = await localFolder.GetFileAsync(filename);\n  \
    \  IRandomAccessStream stream = await storageFile.OpenReadAsync();\n    DataReader\
    \ dataReader = new DataReader(stream);\n    uint length = (uint)stream.Size;\n\
    \    await dataReader.LoadAsync(length);\n    string text = dataReader.ReadString(length);\n\
    \    dataReader.Dispose();\n    completed(text);\n}\n```\n```\n\nNotice the `async`\
    \ modifier on the method. The `async` modifier does not change the signature of\
    \ the method, so this method is still considered a proper implementation of the\
    \ `ReadAllText` method in the `IFileHelper` interface.\n\nThe `await` operator\
    \ appears three times; the first two times on methods that return an object and\
    \ the third time on the `LoadAsync` method that just performs an operation without\
    \ returning anything.\n\nBehind the scenes, the C# compiler divides this method\
    \ into four chunks of execution. The method returns to the caller (the `Note`\
    \ class) at the first `await` operator and then resumes when the `GetFileAsync`\
    \ method has completed, leaving again at the next `await`, and so on.\n\nActually,\
    \ it’s possible for the `ReadAllText` method to execute sequentially from start\
    \ to finish. If the asynchronous methods complete their operations before the\
    \ `await` operator is evaluated, execution just continues as if it were a normal\
    \ function call. This is a performance optimization that"
  merge: -1
  img_proc: true
- pgno: 141
  md: "often plays a role in the relatively fast solid state file I/O on mobile devices.\n\
    \nLet’s improve this ReadAllText method a bit. The DataReader class implements\
    \ the IDisposable interface and includes a Dispose method. Failing to call Dispose\
    \ can leave the file open. Calling Dispose also closes the IRandomAccessStream\
    \ on which the DataReader is based. IRandomAccessStream also implements IDisposable.\n\
    \nIt’s a good idea to enclose IDisposable objects in using blocks. This ensures\
    \ that the Dispose method is automatically called even if an exception is thrown\
    \ inside the block. A better implementation of ReadAllText is this:\n\n```\npublic\
    \ async void ReadAllText(string filename, Action<string> completed)\n{\n    StorageFolder\
    \ localFolder = ApplicationData.Current.LocalFolder;\n    IStorageFile storageFile\
    \ = await localFolder.GetFileAsync(filename);\n    using (IRandomAccessStream\
    \ stream = await storageFile.OpenReadAsync())\n    {\n        using (DataReader\
    \ dataReader = new DataReader(stream))\n        {\n            uint length = (uint)stream.Size;\n\
    \            await dataReader.LoadAsync(length);\n            string text = dataReader.ReadString(length);\n\
    \            completed(text);\n        }\n    }\n}\n```\n\nNow the explicit call\
    \ to Dispose is not required.\n\nOf course, we still have the annoyance of passing\
    \ a callback function to the ReadAllText method. But what’s the alternative? If\
    \ the method actually returns to the caller at the first await operator, how can\
    \ the method return the text contents of the file? Trust the C# compiler. If it\
    \ can implement await, surely it can also allow you to create your own asynchronous\
    \ methods.\n\nLet’s replace ReadAllText with a method named ReadTextAsync. The\
    \ new name reflects the fact that this method is itself asynchronous and can be\
    \ called with the await operator to return a string with the contents of the file.\n\
    \nTo do this, the ReadTextAsync method needs to return a Task object. The Task\
    \ class is defined in System.Threading.Tasks and is the standard .NET representation\
    \ of an asynchronous operation. The Task class is quite extensive, but only a\
    \ little bit of it is necessary in this context. The System.Threading.Tasks namespace\
    \ actually defines two Task classes:\n\n+   - Task for asynchronous methods that\
    \ return nothing\n\n+   - Task<TResult> for asynchronous methods that return an\
    \ object of type TResult.\n\nThese are the .NET equivalences of the Windows 8\
    \ IAsyncAction and IAsyncOperation<TResult> interfaces, and there are extension\
    \ methods that convert the Task objects to IAsyncAction and IAsyncOperation<TResult>\
    \ objects."
  merge: -1
  img_proc: true
- pgno: 142
  md: "Instead of returning void, this new method can return Task<string>. The callback\
    \ argument isn't required, and inside the method, the file's contents are returned\
    \ as if this were a normal method:\n\n```\npublic async Task<string> ReadTextAsync(string\
    \ filename)\n{\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
    \    IStorageFile storageFile = await localFolder.GetFileAsync(filename);\n  \
    \  using (IRandomAccessStream stream = await storageFile.OpenReadAsync())\n  \
    \  {\n        using (DataReader dataReader = new DataReader(stream))\n       \
    \ {\n            uint length = (uint)stream.Size;\n            await dataReader.LoadAsync(length);\n\
    \            return dataReader.ReadString(length);\n        }\n    }\n}\n```\n\
    \nThe compiler handles the rest. The return statement seems to return a string\
    \ object, which is the return value of the ReadString method, but the C# compiler\
    \ automatically wraps that value in a Task<string> object actually returned from\
    \ the method at the execution of the first await operator.\n\nThis ReadTextAsync\
    \ method can now be called using an await operator.\n\nOf course, redefining the\
    \ method signature of these file I/O functions has an impact throughout the program.\
    \ If we want to continue to use DependencyService to call platform-independent\
    \ methods—and that is highly desirable—the iOS and Android methods should have\
    \ the same signature. This means that the NoteTaker6 version of IFileHelper consists\
    \ of these three asynchronous methods:\n\n```\nusing System.Threading.Tasks;\n\
    \nnamespace NoteTaker6\n{\n    public interface IFileHelper\n    {\n        Task<bool>\
    \ ExistsAsync(string filename);\n        Task WriteTextAsync(string filename,\
    \ string text);\n        Task<string> ReadTextAsync(string filename);\n    }\n\
    }\n```\n\nThere are no longer any callback functions in the methods. The Task\
    \ object has its own callback mechanism.\n\nHere's the complete Windows Phone\
    \ version of the FileHelper implementation of IFileHelper:\n\n```\nusing System;\n\
    ```"
