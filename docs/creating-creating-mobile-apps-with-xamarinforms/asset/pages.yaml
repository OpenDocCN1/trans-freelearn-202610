  md: "**ColorScroll** has some flexibility of another sort: It lets you specify a\
    \ color with the sliders in hexadecimal RGB values, floating-point RGB values,\
    \ or HSL values. The three `Label` views at the top of the control panel use the\
    \ `RadioExtensions` class shown earlier; unselected items have their `Opacity`\
    \ properties set to 0.5. Many of the fields in the `ColorScrollPage` class—including\
    \ the `ColorMode` enumeration and the three arrays of labels—exist to support\
    \ the switching among these three color representations:\n\n```\nclass ColorScrollPage\
    \ : ContentPage\n{\n    Grid mainGrid;\n    StackLayout controllersStack;\n  \
    \  BoxView boxView;\n    Label[] labels = new Label[3];\n    Slider[] sliders\
    \ = new Slider[3];\n\n    enum ColorMode\n    {\n        RgbHex,\n        RgbFloat,\n\
