    \ image is still stretched to fit the area.\n\nConsequently, as you turn your\
    \ phone or emulator between portrait and landscape mode, a rendered bitmap can\
    \ change size, and you'll see some blank space at the top and bottom, or the left\
    \ and right, where the bitmap doesn't reach. You can color that space by using\
    \ the BackgroundColor property that Image inherits from VisualElement.\n\nImage\
    \ defines an Aspect property that controls how the bitmap is rendered. The default\
    \ setting is the enumeration member Aspect.AspectFit, meaning that the bitmap\
    \ fits into its parent's boundaries while preserving the bitmap's aspect ratio.\n\
    \nTry this:\n\n```\nclass BitmapFromWebsitePage : ContentPage\n{\n    public BitmapFromWebsitePage()\n\
    \    {\n        string uri = \"http://developer.xamarin.com/demo/IMG_1415.JPG\"\
    ;\n\n        this.Content = new Image\n        {\n            Source = ImageSource.FromUri(new\
    \ Uri(uri)),\n            Aspect = Aspect.Fill\n        };\n    }\n}\n```"
