  md: "```\nfor (int col = 0; col < 3; col++)\n{\n    grid.ColumnDefinitions.Add(new\
    \ ColumnDefinition\n    {\n        Width = new GridLength(col + 1, GridUnitType.Star)\n\
    \    });\n}\n```\n\nthen the second column will be twice as wide as the first,\
    \ and the third column will be three times as wide.\n\nYou can specify a width\
    \ or height in device-independent units (for example, 150) like this:\n\n```\n\
    new GridLength(150, GridUnitType.Absolute)\n```\n\nOr with the single-argument\
    \ constructor:\n\n```\nnew GridLength(150)\n```\n\nYou can set it to Auto using:\n\
    \n```\nnew GridLength(1, GridUnitType.Auto)\n```\n\nOr using a static property:\n\
    \n```\nGridLength.Auto\n```\n\nDuring the layout process, the Grid first totals\
    \ up all the Absolute and Auto sizes horizontally and vertically, and then allocates\
    \ remaining space among all the Star widths and heights.\n\nIt is possible to\
    \ create a single-dimension Grid. The AddHorizontal and AddVertical methods append\
    \ children to the end of the row or column, and these methods also work with IEnumerable<View>\
    \ collections, such as arrays.\n\n# The Grid and attached bindable properties\n\
    \nAlthough the Grid redefines its Children property for Add methods that include\
    \ cell indices, and for the AddHorizontal and AddVertical methods, you can also\
    \ use the normal Add method:\n\n```\ngrid.Children.Add (child);\n```\n\nAt first\
    \ this seems insufficient because it doesn’t include arguments to indicate the\
    \ column and row for this child. But like AbsoluteLayout, the Grid defines attached\
    \ bindable properties that let you specify that information. You can set the column\
    \ and row of a child of a Grid using these two static methods:\n\n```\nGrid.SetColumn\
    \ (child, 2);\nGrid.SetRow (child, 3);\n```\n\nGrid also defines static Grid.SetColumnSpan\
    \ and Grid.SetRowSpan methods. The row and"
