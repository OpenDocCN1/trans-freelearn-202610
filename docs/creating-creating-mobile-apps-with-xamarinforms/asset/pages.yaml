- pgno: 147
  md: "You’ll get a warning from the compiler that you might consider using the `await`\
    \ operator. But strictly speaking, you don’t need to. What happens is that the\
    \ `Clicked` handler calls `LoadAsync` but doesn’t wait for it to complete. The\
    \ `Clicked` handler returns back to the button that fired the event before the\
    \ file has been loaded.\n\nYou can use `await` in a lambda function but you must\
    \ precede the argument list with the `async` modifier:\n\n```\nloadButton.Clicked\
    \ += async (sender, args) =>\n{\n    await note.LoadAsync(FILENAME);\n};\n```\n\
    \nFor the **Save** button, you probably don’t want to enable the **Load** button\
    \ until the save operation has completed, so you’ll want the `await` in there:\n\
    \n```\nsaveButton.Clicked += async (sender, args) =>\n{\n    await note.SaveAsync(FILENAME);\n\
    \    loadButton.IsEnabled = true;\n};\n```\n\nActually, if you start thinking\
    \ about asynchronous file I/O, you might start getting nervous—and justifiably\
    \ so. For example, what if you press the **Save** button and, while the file is\
    \ still in the process of being saved, you press the **Load** button? Will an\
    \ exception result? Will you only load half the file because the other half hasn’t\
    \ been saved yet?\n\nIt’s possible to avoid such problems on the user-interface\
    \ level. If you want to prohibit a button press at a particular time, you can\
    \ disable the button. Here’s how the program can prevent the buttons from interfering\
    \ with each other or with themselves:\n\n```\nsaveButton.Clicked += async (sender,\
    \ args) =>\n{\n    saveButton.IsEnabled = false;\n    loadButton.IsEnabled = false;\n\
    \    await note.SaveAsync(FILENAME);\n    saveButton.IsEnabled = true;\n    loadButton.IsEnabled\
    \ = true;\n};\n```\n\n```\nloadButton.Clicked += async (sender, args) =>\n{\n\
    \    saveButton.IsEnabled = false;\n    loadButton.IsEnabled = false;\n    await\
    \ note.LoadAsync(FILENAME);\n    saveButton.IsEnabled = true;\n    loadButton.IsEnabled\
    \ = true;\n};\n```\n\nIt’s unlikely that you’ll run into problems with these very\
    \ small files and solid-state memory, but it never hurts to be too careful."
