- pgno: 238
  md: "A little experimentation reveals that the default Minimum and Maximum values\
    \ are 0 and 1 for the Slider, but 0 and 100 for the Stepper, and of course you\
    \ can change them. The Stepper has a default Increment value of 1.\n\nIf you don’t\
    \ like the many decimal places displayed for the Slider on the iPhone and Windows\
    \ Phone, you can easily fix that with a formatting string appropriate for double:\n\
    \n```\nsliderValueLabel.Text = args.NewValue.ToString(\"F2\");\n```\n\nSuppose\
    \ you want to initialize the Value property of the Slider after instantiating\
    \ it:\n\n```\nSlider slider = new Slider\n{\n    VerticalOptions = LayoutOptions.EndAndExpand\n\
    };\nslider.ValueChanged += OnSliderValueChanged;\nslider.Value = 0.5;\n```\n\n\
    This code will cause a NullReferenceException to be raised. The problem is that\
    \ setting the Value property triggers a call to the OnSliderValueChanged handler,\
    \ which references a Label that hasn’t been created yet. You can avoid this problem\
    \ by setting the Value property before attaching the event handler, or after instantiating\
    \ the Label. Or, the event handler can check if the Label object is not null before\
    \ attempting to set its Text property.\n\nInstead of setting the Value property\
    \ of Slider to 0.5, try this:\n\n```\nslider.Value = 0;\n```\n\nThis statement\
    \ will not result in a NullReferenceException because it will not trigger the\
    \ ValueChanged event to be fired. The event is called ValueChanged and not ValueSet\
    \ for a reason: The event is not fired unless the Value property has actually\
    \ changed.\n\nIf you want the Label views to display the initial values at program\
    \ startup, your code can set the Text properties to the appropriate values when\
    \ the Label views are created. Or, you can “fake” an event by calling the event\
    \ handlers directly, perhaps at the end of the constructor after everything has\
    \ been created.\n\nOr, you can use data bindings.\n\n# Data binding\n\nThe SliderStepperSwitch\
    \ program sets event handlers so that the Text property of a Label tracks the\
    \ value of the interactive view. Tasks such as this can be automated with the\
    \ same data-binding techniques you saw in the NoteTaker programs in Chapter 3\
    \ and 4.\n\nAs you learned at that time, data bindings link the value of a property\
    \ of one object with the value of a property of another object to keep the values\
    \ synchronized. These two objects are distinguished as"
  merge: -1
  img_proc: true
- pgno: 239
  md: 'a source and a target. In the simplest case, the source is an object with a
    property that changes value, and the target is another object with a property
    that is changed as a result. However, the relationship between source and target
    can be reversed: Changes in the target can update the source, or the source and
    target can update each other.


    A data-binding target object must derive from BindableObject and the target property
    must be backed by a bindable property. This restriction is imposed by the data-binding
    API. A data-binding source should implement the INotifyPropertyChanged interface.
    This is the standard way for a data-binding source to indicate when its property
    has changed.


    In real-world programming, probably the most common forms of data bindings are
    similar to those illustrated by the NoteTaker programs: The data-binding target
    is a view, such as the Entry and Editor views. All user-interface classes in Xamarin.Forms
    derive from BindableObject and many of their properties are backed by bindable
    properties. Typically, the data-binding source is a data object that implements
    INotifyPropertyChanged.


    However, BindableObject also implements INotifyPropertyChanged, which means that
    Xamarin.Forms views can be data-binding sources as well as targets. Data bindings
    between views on the same page are sometimes called view-to-view bindings.


    Suppose a view named sourceView has a property named SourceProp. Suppose also
    that targetView is an instance of the GreatView class that defines a property
    named TargetProp backed by a BindableProperty named GreatView.TargetPropProperty.
    You can define a data binding to keep the SourceProp property updated with the
    value of the TargetProp property with two statements. The first statement associates
    the two objects by setting the BindingContext property of the target object to
    the source object:


    ```

    targetView.BindingContext = sourceView;

    ```


    This BindingContext property is defined by BindableObject. The second statement
    involves the SetBinding method (also defined by BindableObject), which links the
    two properties:


    ```

    targetView.SetBinding(GreatView.TargetPropProperty, "SourceProp");

    ```


    BindableObject defines one SetBinding method, and that’s supplemented by two additional
    SetBinding extension methods defined in the BindableObjectExtensions class. The
    SetBinding call shown in the example above is defined in that extensions class.
    You’ll see more complex alternatives later in this chapter.


    You can pretty much guess what’s going on behind the scenes: A handler for the
    PropertyChanged event is attached to sourceView, and that handler looks for a
    property named "SourceProp". When that property changes, the event handler can
    use .NET reflection to obtain the value of sourceView.SourceProp and then call
    SetValue on the targetView object with an argument of GreatView.TargetPropProperty.


    The SliderStepperSwitchBindings program features a page constructor that begins
    by assembling the now familiar Slider, Stepper, Switch, and Label views but does
    not save any objects as fields'
