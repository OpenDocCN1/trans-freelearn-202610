- pgno: 24
  md: '# Machines and IDEs


    If you want to target the iPhone, you’re going to need a Mac. Apple requires that
    a Mac be used for building iPhone and other iOS applications. You’ll need to install
    XCode on this machine and, of course, the Xamarin platform that includes the necessary
    libraries and Xamarin Studio. You can then use Xamarin Studio and Xamarin.Forms
    on the Mac for your iPhone development.


    Once you have a Mac with XCode and the Xamarin platform installed, you can also
    install the Xamarin platform on a PC and program for the iPhone by using Visual
    Studio. The PC and Mac must be connected via a network (such as WiFi). You run
    the Xamarin.iOS Build Host on the Mac for this interconnection, and Visual Studio
    uses that to build and deploy the executable on the Mac.


    Although you can run Xamarin Studio on the PC, you cannot use Xamarin Studio on
    the PC to do iPhone programming.


    If you want to target Android phones, you have lots of flexibility. You can do
    so using Xamarin Studio on the Mac, Xamarin Studio on the PC, or Visual Studio
    on the PC.


    If you want to target Windows Phone, you’ll need to use Visual Studio 2012 or
    2013 but not an Express edition.


    This means that if you want to target all three platforms in a single IDE, you
    can do so with Visual Studio running on a PC connected to the Mac via a network.
    Another option is to run Visual Studio in a virtual machine on the Mac.


    # Devices and emulators


    You can test your programs on a real phone connected to the machine via a USB
    cable, or you can test your programs with onscreen emulators.


    There are advantages and disadvantages to each approach. A real phone is essential
    for testing complex touch interaction or when getting a feel for startup or response
    time. However, emulators allow you to see how your application adapts to a variety
    of sizes and form factors.


    Perhaps the smoothest running emulator is that for the iPhone. However, because
    Mac desktop machines don’t have touch screens, you’ll need to use the mouse or
    mouse pad to simulate touch. The touch gestures on the Mac touch pad do not translate
    to the emulator. You can also connect a real iPhone to the Mac, but you’ll need
    to provision it as a developer device.


    The Windows Phone emulator is capable of several different screen resolutions
    and also tends to run fairly smoothly, albeit consuming lots of memory. If you
    run the Windows Phone emulator on a touch screen, you can use touch on the emulator
    screen. Connecting a real Windows Phone to the PC requires unlocking the phone.
    If you want to unlock more than one phone, you’ll need a developer account.


    Android emulators are the most problematic. They tend to be slow and cranky, although
    often extremely versatile in emulating a vast array of actual Android devices.
    On the up side, it’s very easy to'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'connect a real Android phone to either the Mac or PC for testing. All you really
    need do is enable USB Debugging on the device.


    If you like the idea of testing on real devices but you want to test on more real
    devices than you can possibly manage yourself, look into the Xamarin Test Cloud.


    # Installation


    Before writing applications for Xamarin.Forms, you’ll need to install the Xamarin
    platform on your Mac and/or your PC. See the articles on the Xamarin website at:


    *http://developer.xamarin.com/guides/cross-platform/getting_started/installation*


    You’re probably eager to create your first Xamarin.Forms application, but before
    you do, you’ll want to try creating normal Xamarin projects for the iPhone and
    Android, and a normal Windows Phone project.


    This is important: If you’re experiencing a problem using Xamarin.iOS or Xamarin.Android,
    that’s not a problem with Xamarin.Forms, and you’ll need to solve that problem
    before using Xamarin.Forms.


    # Creating an iOS app


    If you’re interested in using Xamarin.Forms to target the iPhone, first become
    familiar with the appropriate Getting Started documents on the Xamarin website:


    *http://developer.xamarin.com/guides/ios/getting_started/*


    This will give you guidance on using the Xamarin.iOS library to develop an iPhone
    application in C#. All you really need to do is get to the point where you can
    build and deploy a simple iPhone application on either a real iPhone or the iPhone
    simulator.


    If you’re using Xamarin Studio, you should be able to select **File > New > Solution**
    from the menu, and in the **New Solution** dialog, from the left select **C#**
    and **iOS** and then **Universal**, and from the template list in the center select
    **Empty Project**.


    If you’re using Visual Studio, you should be able to select **File > New > Project**
    from the menu, and in the **New Project** dialog, from the left select **Visual
    C#** and **iOS** and then **Universal**, and from the template list in the center
    select **Blank App (iOS)**.


    In either case, select a location and name for the solution. Build and deploy
    the skeleton application created in the project. If you’re having a problem with
    this, it’s not a Xamarin.Forms issue. You might want to check the Xamarin.iOS
    forums to see if anybody else has a similar problem:


    *http://forums.xamarin.com/categories/ios*'
