  md: "Keep in mind that the SetProperty method returns true if the property is changing,\
    \ so the set accessors can use that return value to perform additional logic.\
    \ The Title and Text properties use this return value to call MakeIdentifier.\
    \ The logic is pretty much the same as the original ToString method. The ToString\
    \ override has been removed. Although a class with a ToString method is often\
    \ preferred to a class without one, when using ListView it’s usually best to confirm\
    \ that the template is working.\n\nThe other change involves the ListView in the\
    \ new HomePage:\n\n```\n// Create and initialize ListView.\nListView listView\
    \ = new ListView\n{\n    ItemsSource = App.NoteFolder.Notes,\n    ItemTemplate\
    \ = new DataTemplate(typeof(TextCell)),\n    VerticalOptions = LayoutOptions.FillAndExpand\n\
    };\n\nlistView.ItemTemplate.SetBinding(TextCell.TextProperty, \"Identifier\");\n\
    ```\n\nListView inherits both the ItemsSource and ItemTemplate properties from\
    \ its parent class ItemsView<T>. This ItemTemplate property is of type DataTemplate,\
    \ and the DataTemplate constructor requires a Type object of a class that derives\
    \ from Cell. The DataTemplate uses this Type object to generate visual objects\
    \ to display the ListView items.\n\nFor this ListView, the argument to the DataTemplate\
    \ constructor is typeof(TextCell). TextCell is basically a Cell wrapper around\
    \ a Label, so for each item in the ListView, the DataTemplate object uses the\
    \ TextCell to generate a Label to display that item. This is the simplest type\
    \ of template; the final version of this book will show how to create more extensive\
    \ templates.\n\nHere’s the important part: Although DataTemplate does not derive\
    \ from BindableObject, you can still set data bindings on it. DataTemplate defines\
    \ its own SetBinding method. The data binding target must be a property of the\
