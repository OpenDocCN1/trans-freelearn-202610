  md: '# Skip past the scary stuff?


    Already you might suspect that this subject of file I/O is going to get hairy,
    and you are correct. But consider what we’re trying to do here: We’re trying to
    target three different mobile platforms with a common code base. That’s not easy,
    and we’re bound to encounter some rough terrain along the way.


    So the question has to be: Metaphorically speaking, do you enjoy hiking through
    treacherous terrain to climb to the top of a mountain and get a gorgeous view?
    Or would you prefer that somebody else takes a photo from the top of the mountain
    and sends it to you in an email?


    If you’re in the latter category, you might prefer to skip over much of this chapter
    and jump straight to the comparatively simple and elegant solution to the problem
    of Xamarin.Forms file I/O presented at the chapter’s end and continuing into the
    next chapter. Until that point, some of the transitional code you’ll encounter
    will be both scary and ugly.


    If you choose to take this long path up the mountain, you’ll understand why the
    trip is necessary, and you’ll understand the rationale behind the platform differences—even
    in seemingly routine jobs like file I/O.


    In the previous chapter you saw how the Xamarin.Forms Device class can be a valuable
    tool for dealing with platform differences. But the code that’s referenced by
    the Device class must be compilable in all three platforms. This is not the case
    for file I/O because the different platforms have access to different APIs. This
    means that the platform differences can’t be managed using the Device class and
    must be handled in other ways. Moreover, the solutions are different for Shared
    Asset Projects and Portable Class Libraries projects.


    For this reason, for the next two versions of NoteTaker, there will be separate
    solutions for SAP and PCL. The two different solutions for version 2 are named
    NoteTaker2Sap and NoteTaker2Pcl.


    # Preprocessing in the SAP


    Dealing with platform differences is a Shared Asset Project is a little more straightforward
    than a PCL and involves more traditional programming tools, so let’s begin with
    that.


    In code files in a Shared Asset Project, you can use the C# preprocessor directives
    #if, #elif, #else, and #endif with conditional compilation symbols defined for
    the three platforms. These symbols are __IOS__ for iOS and WINDOWS_PHONE for Windows
    Phone; there are no conditional compilation symbols for Android, but Android can
    be identified as not being iOS or Windows Phone.


    The NoteTaker2Sap project includes a class named FileHelper in a file named FileHelper.cs.
    You can add such a file to the project the same way you add a new file for the
    class that derives from ContentPage.


    The FileHelper.cs file uses C# preprocessor directives to divide the code into
    two sections. The first section is for iOS and Android and is compiled if the
    WINDOWS_PHONE identifier is not defined. The second section is for Windows Phone.'
