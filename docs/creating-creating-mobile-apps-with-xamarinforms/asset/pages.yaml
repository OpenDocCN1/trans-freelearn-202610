    Three side-by-side screenshots showing the KeypadGrid program displaying a numeric
    keypad running on iPhone, Android, and Windows Phone.


    ![](img/c2d61d0459c51981af78607f1eef3d1c_260_0.png)


    Unlike the horizontal `StackLayout` in a vertical `StackLayout`, the `Grid` has
    put the buttons in nice straight columns.


    However, it’s not exactly correct: In a keypad, you probably want all the keys
    to be the same size, but they’re not in this program. The problem is particularly
    noticeable on the Windows Phone: The third column is wider than the middle column
    because the width of each column is based on the widest view in that column, and
    in the default Windows Phone font, the 6 and 9 are wider than other digits.


    By default, the sizes of the columns and rows of a `Grid` are based on the sizes
    of the child views. There are two alternatives: You can give each column width
    or row height a specific size in device-independent units. Or, you can allocate
    space proportionally among the cells.


    For either of these alternatives, you need to make use of the `ColumnDefinitions`
    and `RowDefinitions` properties defined by `Grid`. These are collections of `ColumnDefinition`
    and `RowDefinition` objects, respectively, each of which indicates a column width
    or row height.


    `ColumnDefinition` has a property named `Width` and `RowDefinition` has a property
    named `Height`, and you set both to a value of type `GridLength`. You have three
    options, and you can use a'
