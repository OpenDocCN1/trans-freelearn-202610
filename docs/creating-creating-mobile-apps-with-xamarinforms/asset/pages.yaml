- pgno: 11
  md: '# CHAPTER 1


    # # How does Xamarin.Forms fit in?


    There is much joy in programming. There is joy in analyzing a problem, breaking
    it down into pieces, formulating a solution, mapping out a strategy, approaching
    it from different directions, and crafting the code. There is very much joy in
    seeing the program run for the first time, and then more joy in eagerly diving
    back into the code to make it better and faster.


    There is also often joy in hunting down bugs, in ensuring that the program runs
    smoothly and predictably. Few things are quite as joyful as finally identifying
    a particularly recalcitrant bug and definitively stamping it out.


    There is even joy in realizing that the original approach you took is not quite
    the best. Many developers discover that they’ve learned a lot writing a program,
    including that there’s a better way to structure the code. Sometimes, a partial
    or even total rewrite can result in a much better application. The process is
    like standing on one’s own shoulders, and there is much joy in attaining that
    perspective and knowledge.


    However, not all aspects of programming are quite so joyful. One of the nastier
    programming jobs is taking an existing working program and rewriting it in an
    entirely different programming language, or porting it to another operating system
    with an entirely different application programming interface (API).


    A job like that can be a real grind. Yet, such a rewrite may very well be necessary:
    The application that’s been so popular on the iPhone might be even more popular
    on Android devices, and there’s only one way to find out.


    But here’s the problem: As you’re going through the original source code and moving
    it to the new platform, do you maintain the same program structure as you go along
    so that the two versions exist in parallel? Or do you try to make improvements
    and enhancements?


    The temptation, of course, is to entirely rethink the application and make the
    new version better. But the further the two versions drift apart, the harder they
    will be to maintain in the future.


    For this reason, an inherent dread pervades the forking of one application into
    two. With each line of code you write, you realize that all the future maintenance
    work, all the future revisions and enhancements, have become two jobs rather than
    one.


    This is not a new problem. For over half a century, developers have craved the
    ability to write a single program that runs on multiple machines. This is one
    of the reasons that high-level languages were invented in the first place, and
    this is why the concept of “cross-platform development” continues to exert a powerful
    attraction for programmers.'
  merge: -1
  img_proc: true
