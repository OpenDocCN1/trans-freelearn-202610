    To summarize: There’s really nothing all that special in a Xamarin.Forms app compared
    with normal Xamarin or Windows Phones projects—except the Xamarin.Forms libraries.


    # PCL or SAP?


    When you first created the Hello solution, you had a choice of two application
    templates:


    +   - Blank App (Xamarin.Forms Portable)

    +   - Blank App (Xamarin.Forms Shared)


    The first creates a Portable Class Library (PCL) while the second creates a Shared
    Asset Project (SAP) consisting only of shared code files.


    In both cases, this project becomes part of the three applications, but in decidedly
    different ways: With the PCL approach, all the common code is bundled into a dynamic-link
    library that each application project references and binds to at run time.


    With the Shared Asset Project approach, the common code files are effectively
    included with the three application projects at build time. As you saw, by default
    the SAP has only a single file—the App.cs file described above. It’s exactly as
    if this project did not exist and instead there were three different copies of
    this file in the three application projects.


    Some subtle (and not-so-subtle) problems can manifest themselves with the Blank
    App (Xamarin.Forms Shared) template:


    The iOS and Android projects have access to pretty much the same version of .NET,
    but it is not the same version of .NET that the Windows Phone project uses. This
    means that any .NET classes accessed by the shared code might be somewhat different
    depending on the platform. As you’ll discover in the next chapter, this is the
    case for some file I/O classes in the System.IO namespace.


    You can compensate for these differences by using C# preprocessor directives,
    particularly #if and #elif. In the projects generated by the Xamarin.Forms template,
    the Windows Phone and iPhone projects define symbols that you can use with these
    directives.


    What are these symbols?


    In Visual Studio, right-click the project name in the Solution Explorer and select
    Properties. At the left of the properties screen, select Build, and look for the
    Conditional compilation symbols field.


    In Xamarin.Studio, select an application project in the Solution list, invoke
    the dropdown tools menu, and select Options. In the left of the Project Options
    dialog, select Build > Compiler, and look for the Define Symbols field.


    You discover that the symbol __IOS__ is defined for the iPhone project (that’s
    two underscores'
