  md: "```\n```csharp\n// Check if the file is available.\nFileHelper.Exists(FILENAME,\
    \ (exists) =>\n{\n    loadButton.IsEnabled = exists;\n});\n```\n```\n\nDoes this\
    \ fix the problem with the first press of the **Load** button on the Windows Phone?\
    \ No, it does not. The `OnLoadButtonClicked` method is still setting the `Entry`\
    \ and `Editor` to text from `Note` class properties before that text has been\
    \ loaded from the file. To work properly, that code would need to know when the\
    \ `Note` properties were set before transferring them to the `Editor` and `Entry`.\
    \ Or the page class would need to know when the `Title` and `Text` properties\
    \ of the `Note` object changed values.\n\nThe basic problem involves the existence\
    \ of properties that change value without notifying anybody of the change. Can\
    \ we do something about this?\n\n# Version 4. I will notify you when the property\
    \ changes\n\nLet’s step back a moment.\n\nSo far, all the versions of the program\
    \ have contained a class deriving from `ContentPage` that displays a user interface\
    \ allowing a user to enter and edit two pieces of text. These two pieces of text\
    \ are also stored in a class named `Note`. This `Note` class stores data that\
    \ underlies the user interface of the page class.\n\nThese two classes are really\
    \ two sides of the same data—one class presents the data for editing by the user,\
    \ and the other class handles the more low-level chores, including loading and\
    \ saving the data in the file system.\n\nOptimally, at any time, both classes\
    \ should be dealing with the same data. But this is not the case. The page class\
    \ doesn’t know when the data in the `Note` class has changed, and the `Note` class\
    \ doesn’t know when the text in the `Entry` and `Editor` views has changed.\n\n\
    Keeping user interfaces in synchronization with underlying data is a common problem,\
    \ and standard solutions are available to fix that problem. One of the most important\
    \ is an interface named `INotifyPropertyChanged`. It’s defined in the .NET `System.ComponentModel`\
    \ namespace like so:\n\n```\n```csharp\ninterface INotifyPropertyChanged\n{\n\
    \    event PropertyChangedEventHandler PropertyChanged;\n}\n```\n```\n\nThe entire\
    \ interface consists of just one event named `PropertyChanged`, but this event\
    \ provides a simple universal way for a class to notify any other class that might\
    \ be interested when one of its properties has changed values."
