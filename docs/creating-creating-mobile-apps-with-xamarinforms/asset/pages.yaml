  md: "properties of two objects so that changes to one property automatically trigger\
    \ a change to the other.\n\n# Streamlining INotifyPropertyChanged classes\n\n\
    Classes that implement `INotifyPropertyChanged` usually have rather more changeable\
    \ properties than the `Note` class. For this reason, it’s a good idea to simplify\
    \ the set accessors, if only to avoid mixing up property and field names, or misspelling\
    \ the text property name.\n\nOne simplification is to encapsulate the actual firing\
    \ of the event in a protected virtual method:\n\n```\nprotected virtual void OnPropertyChanged(string\
    \ propertyName)\n{\n    if (PropertyChanged != null)\n    {\n        PropertyChanged(this,\
    \ new PropertyChangedEventArgs(propertyName));\n    }\n}\n```\n\nNow the `Title`\
    \ property looks like this:\n\n```\npublic string Title\n{\n    set\n    {\n \
    \       if (title != value)\n        {\n            title = value;\n         \
    \   OnPropertyChanged(\"Title\");\n        }\n    }\n    get\n    {\n        return\
    \ title;\n    }\n}\n```\n\nThe `OnPropertyChanged` method is made protected and\
    \ virtual because you might write an enhanced `Note` class that derives from this\
    \ `Note` class but includes more properties. The derived class needs access to\
    \ this method.\n\nBut let’s pause a moment to improve our `INotifyPropertyChanged`\
    \ handling. It’s recommended to obtain the handler first, and then perform the\
    \ check for null on and the event call on that same object:\n\n```\nprotected\
    \ virtual void OnPropertyChanged(string propertyName)\n{\n    PropertyChangedEventHandler\
    \ handler = PropertyChanged;\n    if (handler != null)\n        handler(this,\
    \ new PropertyChangedEventArgs(propertyName));\n}\n```\n\nIn a multithreaded environment,\
    \ a PropertyChanged handler might be detached between the null"
