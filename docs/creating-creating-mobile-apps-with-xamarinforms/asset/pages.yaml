- pgno: 123
  md: "This could be a named event handler of course, and it could use an if and else\
    \ rather that a switch and case to identify the property being changed. It then\
    \ sets the new value of the property to the Text property of either the Entry\
    \ or Editor.\n\nIt looks fine, but it still won’t work on the Windows Phone. When\
    \ you tap the Load button you’ll get an Unauthorized Access exception. Now what’s\
    \ wrong?\n\nHere’s the problem: In the general case, callbacks from asynchronous\
    \ methods do not execute in the same thread as the code that the initiated the\
    \ operation. Instead, the callback executes in the background thread that carried\
    \ out the asynchronous operation.\n\nLet’s follow it through: When you press the\
    \ Load button, the Windows Phone ReadAllText method executes. When the text is\
    \ obtained, it calls the completed method but in a secondary thread of execution.\
    \ In the Load method in Note, that completed method sets the Title and Text properties.\
    \ The new Title property causes a PropertyChanged event to fire, and in that handler\
    \ the new Title property is set to the Text property of the Entry view.\n\nTherefore,\
    \ the Entry view is being accessed from a thread other than the user-interface\
    \ thread, and that’s not allowed. That’s why the exception is raised.\n\nFortunately,\
    \ the fix for this problem is fairly easy. The Device class has a BeginInvokeOnMainThread\
    \ method with an argument of type Action. Simply enclose the code you want to\
    \ execute in the UI thread in the body of that Action argument. It’s easiest to\
    \ wrap the entire switch and case in that callback:\n\n```\nnote.PropertyChanged\
    \ += (sender, args) =>\n{\n    Device.BeginInvokeOnMainThread(() =>\n    {\n \
    \       switch (args.PropertyName)\n        {\n            case \"Title\":\n \
    \               entry.Text = note.Title;\n                break;\n\n         \
    \   case \"Text\":\n                editor.Text = note.Text;\n               \
    \ break;\n        }\n    });\n};\n```\n\nThe Device.BeginInvokeOnMainThread effectively\
    \ waits until the UI thread gets a time slice from the operating system’s thread\
    \ scheduler, and then it runs the specified code.\n\nWith this change, you’ll\
    \ find that when you rerun the Windows Phone app, you can press Load just once\
    \ and the Entry and Editor will be set with the saved values. They’re being set\
    \ not in the handler for the Load button but in the PropertyChanged handler when\
    \ the properties are actually updated with the values loaded from the file."
