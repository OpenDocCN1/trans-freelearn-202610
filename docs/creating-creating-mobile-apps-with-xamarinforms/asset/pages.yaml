- pgno: 154
  md: "![](img/c2d61d0459c51981af78607f1eef3d1c_154_0.png)\n\nNotice the title on\
    \ the iPhone and Android. When using NavigationPage with the iPhone, you no longer\
    \ need worry about anything on the page occupying the same space as the status\
    \ bar either on the home page or on any page navigated to from this page.\n\n\
    The Note, IFileHelper, and FileHelper classes in NoteTaker7 are the same as in\
    \ NoteTaker6.\n\nThe NotePage class is similar to the page classes in previous\
    \ versions of the program. It derives from ContentPage but defines a constructor\
    \ with a single string parameter indicating the filename of the note. This constructor\
    \ saves the filename as a private field, sets the Title property, and builds the\
    \ remainder of the page:\n\n```\nnamespace NoteTaker7\n{\n    class NotePage :\
    \ ContentPage\n    {\n        string filename;\n        Note note = new Note();\n\
    \n        public NotePage(string filename)\n        {\n            this.filename\
    \ = filename;\n            Title = \"New Note\";\n\n            // Create Entry\
    \ and Editor views.\n            Entry entry = new Entry\n            {\n    \
    \            Placeholder = \"Title (optional)\"\n            };\n\n```"
