  md: "```\ntypeof(bool),      // property type\ntypeof(RadioButton),  // this type\n\
    false,                // initial value\nBindingMode.TwoWay,   // default binding\n\
    null,                 // validation\nOnIsToggledPropertyChanged);\n```\n\n```\n\
    public bool IsToggled\n{\n    get { return (bool)GetValue(IsToggledProperty);\
    \ }\n    set { SetValue(IsToggledProperty, value); }\n}\n...\n```\n\nThe OnIsToggledPropertyChanged\
    \ method referenced in the static BindableProperty.Create method is called when\
    \ the IsToggled property changes. However, because the method is referenced in\
    \ a static field definition, the method itself must also be static. It has a signature\
    \ like this:\n\n```\nstatic void OnIsToggledPropertyChanged(BindableObject sender,\n\
    \    object oldValue, object newValue)\n{\n    ...\n}\n```\n\nThis method is called\
    \ whenever the IsToggled property of a RadioButton instance changes. However,\
    \ this method is static! If there are several instances of RadioButton (and that's\
    \ normal), how can this method know which RadioButton has been toggled?\n\nSimple:\
    \ The first argument is the actual RadioButton instance whose IsToggled property\
    \ has changed, and the second and third arguments indicate the old and new values.\
    \ This means you can safely cast the first argument to an object of type RadioButton:\n\
    \n```\nstatic void OnIsToggledPropertyChanged(BindableObject sender,\n    object\
    \ oldValue, object newValue)\n{\n    // Get the object whose property is changing.\n\
    \    RadioButton radioButton = (RadioButton)sender;\n    ...\n}\n```\n\nAnd you\
    \ can take it from there.\n\nBut it's often convenient for this static method\
    \ to call an instance method, and for the instance method to do all the work.\
    \ That's how it's done in RadioButton. There are basically three jobs this method\
    \ must perform:\n\n+   - Set the appropriate character to indicate a checked or\
    \ unchecked state.\n+   - Fire the IsToggled event."
