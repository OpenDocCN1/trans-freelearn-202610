    \ this chapter is concluded.\n\n# Version 8. Notes in the ListView\n\nAs the **NoteTaker**\
    \ program is enhanced to display multiple notes, a little refactoring is probably\
    \ in order. Currently, the `Note` object and the filename associated with that\
    \ `Note` object are not tightly linked. It’s possible for a program to call the\
