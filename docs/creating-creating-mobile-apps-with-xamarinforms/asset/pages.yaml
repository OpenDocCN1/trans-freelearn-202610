- pgno: 132
  md: "These properties and fields are closely related. Indeed, internal to the Entry\
    \ class, the Text property is defined like this:\n\n```\npublic string Text\n\
    {\n    set { SetValue(Entry.TextProperty, value); }\n    get { return (string)GetValue(Entry.TextProperty);\
    \ }\n}\n```\n\nSo you see why it is that your application calling SetValue on\
    \ Entry.TextProperty is exactly equivalent to setting the Text property and perhaps\
    \ just a tinier bit faster!\n\nThe internal definition of the Text property in\
    \ Entry isn’t secret information. This is standard code. The SetValue and GetValue\
    \ methods are defined by BindableObject, the same class that implements INotifyPropertyChanged\
    \ for many Xamarin.Forms classes. All the real work involved with maintaining\
    \ the Text property is going on in these SetValue and GetValue calls. Casting\
    \ is required for the GetValue method because it’s defined as returning object.\n\
    \nThe static Entry.TextProperty object is of type BindableProperty, which you\
    \ might correctly surmise is a class related to BindableObject, but it’s important\
    \ to keep them distinct in your mind: BindableObject is the class from which many\
    \ Xamarin.Forms classes derive and that provides support for objects of type BindableProperty.\n\
    \nThe BindableProperty objects effectively extend the functionality of standard\
    \ C# properties. Bindable properties provide systematic ways to:\n\n+   - Define\
    \ properties\n+   - Give properties default values\n+   - Store their current\
    \ values\n+   - Provide mechanisms for validating property values\n+   - Maintain\
    \ consistency among related properties in a single class\n+   - Respond to property\
    \ changes\n+   - Trigger notifications when a property is about to change and\
    \ has changed\n\nIn addition, BindableObject and BindableProperty provide mechanisms\
    \ for animation and data binding. They are a vital part of the infrastructure\
    \ of Xamarin.Forms.\n\nThe close relationship of a property named Text with a\
    \ BindableProperty named TextProperty is reflected in the way that programmers\
    \ speak about these properties: Sometimes a programmer says that the Text property\
    \ is “backed by” a BindableProperty named TextProperty because TextProperty provides\
    \ infrastructure support for the Text property. But a common shortcut is to say\
    \ that Text is itself a “bindable property” and generally no one will be confused.\n\
    \nNot every Xamarin.Forms property is a bindable property. Neither the Content\
    \ property of"
