    # Image and bitmaps


    For the purposes of presentation, text is essential but pictures are... well,
    pictures are usually essential as well.


    A view named `Image` does for bitmaps what `Label` does for text. A bitmap displayed
    by `Image` can be obtained from a website (or otherwise accessible via a URL),
    or it can be bound into the program’s PCL as a resource, or it can be content
    of the individual platform projects or an SAP, or it can be otherwise accessible
    through a .NET `Stream` object.


    `Image` defines a `Source` property that you set to an object of type `ImageSource`,
    which defines four static methods for referencing a bitmap. These are:


    +   - `ImageSource.FromUri` for accessing a bitmap over the web.

    +   - `ImageSource.FromResource` for a bitmap stored as a resource in the application
    PCL.

    +   - `ImageSource.FromFile` for a bitmap stored as content in the platform projects
    or an SAP.'
