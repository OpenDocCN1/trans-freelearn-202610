  md: "These two Label views have Text properties, but the ContentView from which\
    \ RadioButton derives does not have a Text property, so RadioButton must define\
    \ one. Moreover, to allow data binding and other Xamarin.Forms features, RadioButton\
    \ must also define a BindableProperty object named TextProperty.\n\nThis TextProperty\
    \ is a field defined as public and static, and it should also be defined as readonly,\
    \ which means that it must be set in the field definition or a static constructor.\
    \ The BindableProperty class has static Create methods that create BindableProperty\
    \ objects:\n\n```\nclass RadioButton : ContentView\n{\n    ...\n    public static\
    \ readonly BindableProperty TextProperty =\n        BindableProperty.Create(\"\
    Text\",                 // property name\n            typeof(string),        \
    \                      // property type\n            typeof(RadioButton),    \
    \                     // this type\n            null);                       \
    \                // initial value\n    ...\n}\n```\n\nThis is a relatively simple\
    \ definition of a bindable property. The property name and type are supplied,\
    \ as well as the type of the class defining the property and an initial value.\
    \ More extensive use of the BindableProperty.Create method allows you to specify\
    \ methods that are called when the property is about to change, and when it has\
    \ changed, and for validation and coercion.\n\nThe normal Text property then references\
    \ the bindable property in a very standard way:\n\n```\nclass RadioButton : ContentView\n\
    {\n    ...\n    public string Text\n    {\n        set { SetValue(TextProperty,\
    \ value); }\n        get { return (string)GetValue(TextProperty); }\n    }\n \
    \   ...\n}\n```\n\nYou’ll notice that the BindableProperty.Create method requires\
    \ the property name as a text string, and if you misspell it, the property won’t\
    \ work right and it will be difficult to track down the problem. For that reason,\
    \ generic alternatives of the Create method are available that derive the property\
    \ name and type for you. The RadioButton uses one of these methods to define the\
    \ Font property:\n\n```\nclass RadioButton : ContentView\n{\n    ...\n    // Define\
    \ the Font bindable property and property.\n    public static readonly BindableProperty\
    \ FontProperty =\n```"
