  md: "```\n```csharp\n// Set rows and columns of BoxView and StackLayout.\nGrid.SetColumn(boxView,\
    \ 0);\nGrid.SetRow(boxView, 0);\n\nGrid.SetColumn(controllersStack, 0);\nGrid.SetRow(controllersStack,\
    \ 1);\n}\n// Landscape mode.\nelse\n{\n    // Adjust column and row definitions.\n\
    \    mainGrid.ColumnDefinitions[0].Width = new GridLength(1, GridUnitType.Star);\n\
    \    mainGrid.ColumnDefinitions[1].Width = new GridLength(1, GridUnitType.Star);\n\
    \    mainGrid.RowDefinitions[0].Height = new GridLength(1, GridUnitType.Star);\n\
    \    mainGrid.RowDefinitions[1].Height = new GridLength(0);\n\n    // Set rows\
    \ and columns of BoxView and StackLayout.\n    Grid.SetColumn(boxView, 0);\n \
    \   Grid.SetRow(boxView, 0);\n\n    Grid.SetColumn(controllersStack, 1);\n   \
    \ Grid.SetRow(controllersStack, 0);\n}\n}\n\n...\n\n}\n```\n```\n\nThe event handler\
    \ for the three `Label` views that function as radio buttons has two jobs: to\
    \ set the `Opacity` of the `Label` to indicate which has been selected, and to\
    \ set a new color mode. However, the job of actually making all the changes to\
    \ the sliders and labels as a result is relegated to a separate method:\n\n```\n\
    ```csharp\nclass ColorScrollPage : ContentPage\n{\n    ...\n\n    void OnRadioLabelToggled(View\
    \ view)\n    {\n        // Set Opacity to indicate toggled state.\n        view.Opacity\
    \ = view.GetRadioState() ? 1.0 : 0.5;\n\n        // Possibly change the current\
    \ color mode.\n        if (view.GetRadioState())\n        {\n            ColorMode\
    \ newColorMode =\n                (ColorMode) Enum.Parse(typeof(ColorMode), view.StyleId);\n\
    \n            if (currentColorMode != newColorMode)\n            {\n         \
    \       currentColorMode = newColorMode;\n```\n```"
