    # Custom views: A radio button


    You can create custom views in Xamarin.Forms. A later chapter (not in the Preview
    edition) will show you how to create custom views by writing special classes,
    called renderers, specific to each platform.


    However, it''s also possible to create custom views right in Xamarin.Forms. One
    approach is to derive a class from ContentView, and set its Content property to
    a StackLayout (for example) and then assemble one or more views on that. You''ll
    probably also need to define a property or two, and possibly some events, but
    you''ll want to take advantage of the existing infrastructure established by the
    BindableObject and BindableProperty classes.


    Let''s try to create a classic radio button. The radio button is named after radio
    station-selector buttons in old cars. These radios feature a row of pushbuttons,
    but only one button can be depressed at a time, so pressing a button makes the
    previously depressed button pop up, giving great joy to young kids who play with
    the radio.


    Functionally, a radio button is similar to the Xamarin.Forms Switch in that it
    toggles between on and off states. However, radio buttons always appear in a group.
    The radio buttons are mutually exclusive, so selecting any radio button automatically
    deselects all the other buttons.


    This custom RadioButton view shown below defines three properties, although more
    could be'
