  md: "```\nabsoluteLayout.Children.Add(child, rect, flags);\n```\n\nFor example,\
    \ if you use the SizeProportional flag and set the width of the child to 0.25\
    \ and the height to 0.10, the child will be ¼ of the width of the AbsoluteLayout\
    \ and 1/10th the height.\n\nThe PositionProportional flag is similar but it takes\
    \ the size of the child into account: A position of (0, 0) puts the child in the\
    \ upper-left corner, a position of (1, 1) puts the child in the lower-right corner,\
    \ and a position of (0.5, 0.5) centers the child within the AbsoluteLayout.\n\n\
    Let’s rewrite the DotMatrixClock program to use this feature and call it ProportionalDotMatrixClock.\
    \ Much of the program remains the same. The AbsoluteLayout object still needs\
    \ to be saved as a field, but the array of BoxView objects for the colons can\
    \ be eliminated. All the positioning and sizing is now performed in the constructor\
    \ based on an AbsoluteLayout that is assumed to have an aspect ratio of 41-to-7,\
    \ which encompasses the 41 BoxView widths and 7 BoxView heights.\n\n```\nclass\
    \ ProportionalDotMatrixClockPage : ContentPage\n{\n    ...\n    AbsoluteLayout\
    \ absoluteLayout;\n    // Box views for 6 digits, 7 rows, 5 columns.\n    BoxView[,]\
    \ digitBoxViews = new BoxView[6, 7, 5];\n    public ProportionalDotMatrixClockPage()\n\
    \    {\n        // Everything goes in the AbsoluteLayout.\n        absoluteLayout\
    \ = new AbsoluteLayout\n        {\n            VerticalOptions = LayoutOptions.Center\n\
    \        };\n        // BoxView dot dimensions.\n        const double height =\
    \ 0.85 / vertDots;\n        const double width = 0.85 / horzDots;\n        //\
    \ Create and assemble the BoxViews.\n        double xIncrement = 1.0 / (horzDots\
    \ - 1);\n        double yIncrement = 1.0 / (vertDots - 1);\n        double x =\
    \ 0;\n        for (int digit = 0; digit < 6; digit++)\n        {\n           \
    \ for (int col = 0; col < 5; col++)\n            {\n                double y =\
    \ 0;\n                for (int row = 0; row < 7; row++)\n                {\n \
    \                   // Create the digit BoxView and add to layout.\n         \
    \           BoxView boxView = new BoxView();\n                    digitBoxViews[digit,\
    \ row, col] = boxView;\n```"
