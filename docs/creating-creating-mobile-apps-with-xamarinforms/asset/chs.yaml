  Overall, you'll see that the Xamarin.Forms visual elements have the following general\
  \ hierarchy:\n\n```\nSystem.Object\n    BindableObject\n        Element\n      \
  \      VisualElement\n                View\n                    ...\n          \
  \          Layout\n                        ...\n                        Layout<T>\n\
  ```\n\n\n\n\n在 Microsoft Windows 世界中，类似的技术被称为*设备无关像素*（DIPs）或*设备无关单位*（DIUs）。对于 Microsoft\
  \ 程序员来说，桌面视频显示器的分辨率被假定为 96 DIUs，这恰好比 72 DPI 高 1/3。\n\n然而，手机有一些不同的规则：现代手机达到的像素密度通常远高于桌面显示器。更高的像素密度使文本和其他视觉对象在难以辨认之前可以缩得更小。\n\
  \n手机通常也比桌面或笔记本电脑屏幕更靠近用户的脸。这种差异也意味着手机上的视觉对象可以比桌面或笔记本电脑屏幕上的相似对象小得多。由于手机的物理尺寸远小于桌面显示器，缩小视觉对象是非常可取的，因为这允许更多内容适应屏幕。\n\
  \nApple 继续将 iPhone 上的设备无关单位称为*点*，但对于 Apple 所有高密度显示屏——Apple 以品牌名*Retina*称呼——每点有两个像素。这对于\
  \ iPhone、iPad 和 MacBook Pro 都适用。\n\n例如，iPhone 4 的 3.5 英寸屏幕的 640 × 960 像素尺寸的实际像素密度约为\
  \ 320 DPI。对于程序员来说，屏幕的尺寸似乎是 320 × 480 点。iPhone 3 实际上确实有 320 × 480 的像素尺寸，并且点等于像素，因此对于程序员来说，iPhone3\
  \ 和 iPhone4 的显示器看起来尺寸相同。但这个尺寸意味着每英寸 160 点的转换因子，而不是 72。\n\niPhone 5 有 4 英寸屏幕，但像素尺寸是\
  \ 640 × 1136，像素密度与 iPhone 4 大致相同。对于程序员来说，这个屏幕的尺寸是 320 × 768 点。\n\nAndroid 的做法非常相似：Android\
  \ 设备有各种各样的尺寸和像素尺寸，但 Android 程序员总是使用*密度无关像素（dps）*作为单位。像素和 dps 之间的关系设定为每英寸 160 dps，这意味着\
  \ Apple 和 Android 的设备无关单位非常相似。\n\n然而，微软在 Windows Phone 上采取了不同的方法。Windows Phone 7\
  \ 设备具有统一的像素尺寸 480 × 800，通常称为 WVGA（宽视频图形阵列）。Windows Phone 7 程序员以像素为单位使用此显示器工作，这意味着\
  \ Windows Phone 隐含假定像素密度约为 240 DPI，这是 iPhone 和 Android 设备假定像素密度的 1.5 倍。\n\n使用 Windows\
  \ Phone 8，允许多种更大的屏幕尺寸：768 × 1280（WXGA 或宽扩展图形阵列）、720 × 1280（使用高清晰度电视术语称为 720p）和 1080\
  \ × 1920（称为 1080p）。\n\n对于这些额外的显示尺寸，程序员使用设备无关单位工作。内部缩放因子在像素和设备无关单位之间转换，以便纵向模式下的屏幕宽度始终看起来为\
  \ 480 像素宽。缩放因子为 1.6（适用于 WXGA）、1.5（720p）和 2.25（1080p）。\n\n被分配了一个大小。你可以在你的 `ContentPage`\
  \ 派生类中重写此方法，而不是处理 `SizeChanged` 事件，但 `OnSizeAllocated` 有时会在大小实际上没有变化时被调用。\n\n注意到\
  \ **WhatSize** 程序不会在其 `SizeChanged` 事件处理程序中创建新的 `Label`。它当然可以创建一个新的 `Label` 并将其设置为页面的新内容（在这种情况下，先前的\
  \ `Label` 将不再被引用，因此符合垃圾回收的条件），但这不必要且浪费。程序在其构造函数中只创建一个 `Label`，然后仅设置 `Text` 属性来指示页面的新大小：\n\
