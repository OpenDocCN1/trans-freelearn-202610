- "# 第 1 章\n\n## Xamarin.Forms 如何融入其中？\n\n编程中有很多乐趣。分析问题、将问题分解成小块、制定解决方案、规划策略、从不同角度探讨问题以及编写代码，都有乐趣。看到程序第一次运行会带来许多乐趣，而随后急切地投入代码，让它更好、更快，则带来更多乐趣。\n\
  \n追查 bug、确保程序运行平稳且可预测，也常常充满乐趣。很少有事情能像最终识别出一个特别顽固的 bug 并彻底根除它那样令人愉快。\n\n甚至当你意识到最初采取的方法并非最佳时，也有乐趣。许多开发人员发现，他们在编写程序时学到了很多，包括有更好的方式来组织代码。有时，部分甚至完全重写可以产生好得多的应用程序。这个过程就像站在自己的肩膀上，获得这种视角和知识带来了很多乐趣。\n\
  \n然而，编程并非所有方面都那么愉快。最糟糕的编程工作之一，是把一个现有的正常运行的程序用完全不同的编程语言重写，或者将其移植到另一个具有完全不同的应用程序编程接口（API）的操作系统上。\n\
  \n这样的工作可能非常辛苦。然而，这样的重写很可能很有必要：在 iPhone 上极受欢迎的应用程序在 Android 设备上可能会更受欢迎，而且只有一种方法可以找出答案。\n\
  \n但问题在这里：在你浏览原始源代码并将其转移到新平台时，你是一路上都保持相同的程序结构以便两个版本并行存在？还是尝试进行改进和增强？\n\n当然，诱惑是彻底重新思考应用程序，让新版本变得更好。但两个版本之间偏离得越远，将来就越难维护。\n\
  \n因此，将一个应用程序分叉为两个时，一种与生俱来的恐惧感弥漫其中。每写一行代码，你都会意识到所有未来的维护工作、所有未来的修订和增强，都将变成两份工作，而不是一份。\n\
  \n这不是一个新问题。半个多世纪以来，开发人员一直渴望能够编写一个在多种机器上运行的程序。这正是高级语言最初被发明的原因之一，也是“跨平台开发”这一概念能够继续对程序员产生强大吸引力的原因。\n\
  \n\n\n\n## 共享代码\n\n使用单一编程语言面向多个平台的优势，在于能够在应用程序之间共享代码。\n\n在共享代码之前，必须为此目的进行结构化设计。尤其是自从图形用户界面广泛使用以来，程序员们已经意识到将应用程序代码划分为功能层的重要性。也许最有用的划分是用户界面代码与底层数据模型和算法之间的划分。流行的\
  \ MVC（Model-View-Controller）应用程序架构将这种代码分离正式化为 Model（底层数据）、View（数据的可视化表示）和 Controller（处理用户输入）。\n\
  \nMVC 起源于 20 世纪 80 年代。后来，MVVM（Model-View-ViewModel）架构基于现代 GUI 有效地对 MVC 进行了现代化改造。MVVM\
  \ 将代码分为 Model（底层数据）、View（用户界面，包括视觉效果和输入）和 ViewModel（管理 Model 与 View 之间传递的数据）。\n\n\
  在开发面向多个移动平台的程序时，MVVM 架构可帮助开发人员将代码分离为平台特定的 View——即需要与平台 API 交互的代码——以及平台无关的 Model\
  \ 和 ViewModel。\n\n通常，这些平台无关的代码需要访问文件或网络，或者使用集合和线程。通常，这些工作会被视为操作系统 API 的一部分，但它们也可以利用\
  \ .NET Framework 类库来完成；如果该类库在每个平台上都可用，那么它实际上就是平台无关的。\n\n应用程序中平台无关的部分随后可以被隔离出来，并且在\
  \ Visual Studio 或 Xamarin Studio 环境中放入一个单独的项目。这可以是共享资产项目（SAP）——它仅包含代码和其他可从其他项目访问的资产文件——也可以是可移植类库（PCL），它将所有公共代码封装在动态链接库（DLL）中，其他项目随后可以引用该\
  \ DLL。\n\n无论使用哪种方法，这些公共代码都可以访问 .NET Framework 类库，因此它可以执行文件 I/O、处理全球化、访问 Web 服务、解析\
  \ XML 等等。\n\n这意味着你可以创建一个包含四个 C# 项目的 Visual Studio 解决方案，以面向三大移动平台；或者你可以使用 Xamarin\
  \ Studio 来面向 iPhone 和 Android 设备。\n\n下图大致展示了 Visual Studio 或 Xamarin Studio 项目、Xamarin\
  \ 库和平台 API 之间的相互关系：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_17_0.png)\n\n第二行的方框是实际的平台特定应用程序。它们会调用公共项目，并且（在\
  \ iPhone 和 Android 的情况下）还会调用实现原生平台 API 的 Xamarin 库。\n\n但该图并不十分完整：它没有显示 SAP 或 PCL\
  \ 调用 .NET Framework 类库的情况。PCL 可以访问其自身的 .NET 版本，而 SAP 使用集成到每个特定平台中的 .NET 版本。\n\n\
  在这个图中，Xamarin.iOS 和 Xamarin.Android 库看起来相当庞大，虽然它们确实重要，但它们大多只是语言绑定，并不会显著增加 API 调用的开销。\n\
  \n构建 iPhone 应用时，Xamarin C# 编译器像往常一样生成 C# 中间语言（IL），然后利用 Mac 上的 Apple 编译器生成本机 iPhone\
  \ 机器代码，就像 Objective-C 编译器一样。应用对 iPhone API 的调用与使用 Objective-C 编写的应用完全相同。\n\n对于 Android\
  \ 应用，Xamarin C# 编译器会生成 IL，IL 在设备上与 Java 引擎并行运行的一个 Mono 版本上运行，但应用的 API 调用几乎与用 Java\
  \ 编写的应用相同。\n\n对于有非常平台特定需求、但也包含可能可共享的平台无关代码块的移动应用，Xamarin.iOS 和 Xamarin.Android 提供了出色的解决方案。你可以访问完整的平台\
  \ API，并拥有随之而来的全部能力（和责任）。\n\n但对于可能不需要那么多平台特定性的应用，现在有一种替代方案，能让你的工作更加简单。\n\n## Xamarin.Forms\
  \ 简介\n\n2014 年 5 月 28 日，Xamarin 推出了 Xamarin.Forms，作为名为 Xamarin 3 的 Xamarin 平台一系列增强功能的一部分。Xamarin.Forms\
  \ 允许你编写可为 iPhone、Android 和 Windows Phone 编译的用户界面代码。\n\n## Xamarin.Forms 选项\n\n在一般情况下，Xamarin.Forms\
  \ 应用程序是由三个面向三大移动平台的独立项目和一个包含公共代码的第四个项目组成——这与前一节中的图非常相似。\n\n然而，在 Xamarin.Forms 应用程序中，这三个平台项目通常非常小——往往只包含带有少量样板启动代码的存根。共享资产项目或可移植类库项目包含应用程序的主体，包括用户界面代码：\n\
  \n![](img/c2d61d0459c51981af78607f1eef3d1c_18_0.png)\n\nXamarin.Forms.Core 和 Xamarin.Forms.Xaml\
  \ 库实现了 Xamarin.Forms API。根据平台不同，Xamarin.Forms.Core 会使用相应的 Xamarin.Forms.Platform\
  \ 库之一。这些库主要是一组称为渲染器的类，负责将 Xamarin.Forms 用户界面对象转换为平台特定的用户界面。\n\n图表的其余部分与前面显示的相同。\n\
  \n例如，假设你需要前面讨论过的、允许用户在两个选项之间切换的用户界面对象。在使用 Xamarin.Forms 编程时，这被称为 `Switch`，在 Xamarin.Forms.Core\
  \ 库中实现了一个名为 `Switch` 的类。在这三个平台的各个渲染器中，这个 `Switch` 被映射到 iPhone 上的 `UISwitch`、Android\
  \ 上的 `Switch` 以及 Windows Phone 上的 `ToggleSwitchButton`。\n\nXamarin.Forms.Core 还包含一个名为\
  \ `Slider` 的类，用于显示一个水平条，用户通过操作它来选择数值。在平台特定库的渲染器中，它被映射为 iPhone 上的 `UISlider`、Android\
  \ 上的 `SeekBar` 以及 Windows Phone 上的 `Slider`。\n\n这意味着，当你编写一个包含 `Switch` 或 `Slider`\
  \ 的 Xamarin.Forms 程序时，实际显示的是每个平台中实现的相关对象。\n\n下面是一个简单的 Xamarin.Forms 程序，包含一个显示 “Hello,\
  \ Xamarin.Forms!” 的 `Label`、一个显示 “Click Me!” 的 `Button`、一个 `Switch` 和一个 `Slider`。该程序正在（从左到右）iPhone、Android\
  \ 和 Windows Phone 上运行：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_19_0.png)\n\n\
  在本书中，你会反复看到这样的三联屏幕截图。它们的顺序总是相同的——iPhone、Android 和 Windows Phone——并且总是运行同一个程序。\n\n\
  ## 机器与 IDE\n\n如果你想开发 iPhone 应用，你将需要一台 Mac。Apple 要求必须使用 Mac 来构建 iPhone 和其他 iOS 应用程序。你需要在这台机器上安装\
  \ Xcode，当然还要安装包含所需库和 Xamarin Studio 的 Xamarin 平台。然后，你就可以在 Mac 上使用 Xamarin Studio\
  \ 和 Xamarin.Forms 进行 iPhone 开发。\n\n一旦你拥有一台安装了 Xcode 和 Xamarin 平台的 Mac，你也可以在 PC 上安装\
  \ Xamarin 平台，并使用 Visual Studio 为 iPhone 编程。PC 和 Mac 必须通过网络（如 WiFi）连接。你需要为这种互联在 Mac\
  \ 上运行 Xamarin.iOS Build Host，Visual Studio 会利用它在 Mac 上构建并部署可执行文件。\n\n虽然你可以在 PC 上运行\
  \ Xamarin Studio，但不能使用 PC 上的 Xamarin Studio 进行 iPhone 编程。\n\n如果你想开发 Android 手机应用，你有很多灵活选择。你可以使用\
  \ Mac 上的 Xamarin Studio、PC 上的 Xamarin Studio 或 PC 上的 Visual Studio 来实现。\n\n如果你想开发\
  \ Windows Phone 应用，你需要使用 Visual Studio 2012 或 2013，但不能使用 Express 版本。\n\n这意味着，如果你想在单个\
  \ IDE 中面向所有三个平台，你可以在通过网络连接到 Mac 的 PC 上运行 Visual Studio 来实现。另一种选择是在 Mac 上的虚拟机中运行\
  \ Visual Studio。\n\n## 设备与模拟器\n\n你可以通过 USB 线将真实手机连接到机器来测试程序，也可以使用屏幕上的模拟器测试程序。\n\n\
  每种方法都有优缺点。真实手机对于测试复杂的触摸交互或感受启动或响应时间至关重要。但是，模拟器可以让你看到应用程序如何适应各种尺寸和外形。\n\n运行最流畅的模拟器也许是\
  \ iPhone 模拟器。然而，由于 Mac 台式机没有触摸屏，你需要使用鼠标或鼠标垫来模拟触摸。Mac 触控板上的触摸手势不会传递到模拟器。你也可以将真实的\
  \ iPhone 连接到 Mac，但你需要将其配置为开发设备。\n\nWindows Phone 模拟器支持多种不同的屏幕分辨率，并且往往运行得相当流畅，尽管会消耗大量内存。如果你在触摸屏上运行\
  \ Windows Phone 模拟器，你可以在模拟器屏幕上使用触摸。将真实的 Windows Phone 连接到 PC 需要解锁手机。如果你想解锁多部手机，你需要一个开发者帐户。\n\
  \nAndroid 模拟器的问题最多。它们往往又慢又不稳定，尽管在模拟大量真实 Android 设备方面常常非常灵活。另一方面，很容易\n\n\n将一台真实的\
  \ Android 手机连接到 Mac 或 PC 上进行测试。你真正需要做的就是在设备上启用 USB 调试。\n\n如果你喜欢在真实设备上测试，但又想在超出自己管理能力的更多真实设备上进行测试，可以了解一下\
  \ Xamarin Test Cloud。\n\n## 安装\n\n在为 Xamarin.Forms 编写应用程序之前，你需要在 Mac 和/或 PC 上安装\
  \ Xamarin 平台。请参阅 Xamarin 网站上的文章：\n\n*http://developer.xamarin.com/guides/cross-platform/getting_started/installation*\n\
  \n你可能迫不及待地想创建你的第一个 Xamarin.Forms 应用程序，但在开始之前，你应当先尝试为 iPhone 和 Android 创建常规的 Xamarin\
  \ 项目，以及一个常规的 Windows Phone 项目。\n\n这一点很重要：如果你在使用 Xamarin.iOS 或 Xamarin.Android 时遇到问题，那并不是\
  \ Xamarin.Forms 的问题，你需要在使用 Xamarin.Forms 之前先解决该问题。\n\n## 创建 iOS 应用\n\n如果你有兴趣使用 Xamarin.Forms\
  \ 来面向 iPhone，请先熟悉 Xamarin 网站上相应的入门文档：\n\n*http://developer.xamarin.com/guides/ios/getting_started/*\n\
  \n这将指导你如何使用 Xamarin.iOS 库以 C# 开发 iPhone 应用程序。你真正需要做的，就是能够在真实的 iPhone 或 iPhone 模拟器上构建并部署一个简单的\
  \ iPhone 应用程序。\n\n如果你使用的是 Xamarin Studio，可以从菜单中选择 **文件 > 新建 > 解决方案**，然后在 **新建解决方案**\
  \ 对话框中，从左侧选择 **C#** 和 **iOS**，再选择 **通用**，最后从中间的模板列表中选择 **空项目**。\n\n如果你使用的是 Visual\
  \ Studio，可以从菜单中选择 **文件 > 新建 > 项目**，然后在 **新建项目** 对话框中，从左侧选择 **Visual C#** 和 **iOS**，再选择\
  \ **通用**，最后从中间的模板列表中选择 **空白应用 (iOS)**。\n\n无论哪种情况，都要为解决方案选择位置和名称。构建并部署项目中创建的骨架应用程序。如果你在此遇到问题，这不是\
  \ Xamarin.Forms 的问题。你可能想查看 Xamarin.iOS 论坛，看看是否有人有类似问题：\n\n*http://forums.xamarin.com/categories/ios*\n\
  \n![](img/c2d61d0459c51981af78607f1eef3d1c_30_0.png)\n\n如你所见，这些平台有不同的配色方案。默认情况下，Windows\
  \ Phone 的配色方案与 Android 类似，在深色背景上显示浅色文字，但这种配色方案是可以由用户更改的。即使在 Windows Phone 模拟器上，你也可以在“设置”应用的“主题”部分更改配色方案，然后重新运行程序。\n\
  \n应用不仅会在设备或模拟器上运行，而且会被部署。它会与手机或模拟器上的其他应用一起显示，并且可以从那里运行。如果你不喜欢应用程序图标或应用名称的显示方式，可以在各个平台项目中更改。\n\
  \n## Xamarin.Forms 解决方案剖析\n\n显然，由 Xamarin.Forms 模板创建的程序非常简单，所以这是一个绝佳的机会来检查生成的代码文件，并理解它们的相互关系和工作原理。\n\
  \n让我们从定义你在屏幕上看到的文本的代码开始。这就是 Hello 项目中的 App.cs 文件，如果自从本章编写以来项目模板没有改变太多，它可能看起来像这样：\n\
  \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing\
  \ System.Text;\n\nusing Xamarin.Forms;\n\nnamespace Hello\n```\n\n对于这三个不同的平台，你很快就会看到如何做到这一点。你也可以在这三个应用程序项目中包含特定于平台的代码。\n\
  \n这三个应用程序项目拥有自己的资产，即图标和元数据。如果你打算将应用程序推向市场，就必须特别关注这些资产。但在你学习如何使用 Xamarin.Forms 开发应用程序期间，通常可以忽略这些资产。你可能希望将这些应用程序项目在解决方案列表中折叠起来，因为你无需过多关注它们的内容。\n\
  \n但你确实应该了解这些应用程序项目中有什么，所以让我们仔细看一看。\n\n在每个应用程序项目的 **引用** 部分，你会看到对公共项目（此处为 **Hello**）的引用，以及各种\
  \ .NET 程序集、上面列出的 Xamarin.Forms 程序集，以及适用于各个平台的额外 Xamarin.Forms 程序集：\n\n- Xamarin.Forms.Platform.Android\n\
  - Xamarin.Forms.Platform.iOS\n- Xamarin.Forms.Platform.WP8\n\n这三个库中的每一个都定义了一个静态的\
  \ `Xamarin.Forms.Init` 方法来初始化 Xamarin.Forms 系统。你还刚刚看到，公共项目通常定义一个名为 `App.GetMainPage`\
  \ 的公共静态方法。\n\n至少，这三个应用程序项目中的每一个都必须在特定于平台的开销上下文中调用这两个方法。如果你熟悉 iOS、Android 或 Windows\
  \ Phone 开发，你可能会好奇这三个平台各自如何处理从 `App.GetMainPage` 方法返回的 Xamarin.Forms `Page` 对象。\n\
  \n## iOS 项目\n\niOS 项目通常包含一个派生自 `UIApplicationDelegate` 的类。标准 Xamarin.Forms 模板定义了这样一个类，可以在\
  \ Hello.iOS 项目的 AppDelegate.cs 文件中找到。这里是删除了所有无关的 `using` 指令和注释后的代码：\n\n```\nusing\
  \ MonoTouch.Foundation;\nusing MonoTouch.UIKit;\nusing Xamarin.Forms;\n\nnamespace\
  \ Hello.iOS\n{\n    [Register(\"AppDelegate\")]\n    public partial class AppDelegate\
  \ : UIApplicationDelegate\n    {\n        UIWindow window;\n\n        public override\
  \ bool FinishedLaunching(UIApplication app,\n                                  \
  \             NSDictionary options)\n```\n\n由 `AndroidActivity` 类标注并由 `MainActivity`\
  \ 继承。\n\n## Windows Phone 项目\n\n在 Windows Phone 项目中，请查看项目文件列表中位于 MainPage.xaml 文件下方的\
  \ `MainPage.xaml.cs` 文件。该文件定义了常规的 `MainPage` 类，并对从 `App.GetMainPage` 返回的对象使用 Xamarin.Forms.Platform.WP8\
  \ 程序集中定义的名为 `ConvertPageToUIElement` 的扩展方法：\n\n```csharp\nusing Microsoft.Phone.Controls;\n\
  using Xamarin.Forms;\n\nnamespace Hello.WinPhone\n{\n    public partial class MainPage\
  \ : PhoneApplicationPage\n    {\n        public MainPage()\n        {\n        \
  \    InitializeComponent();\n\n            Forms.Init();\n            Content =\
  \ Hello.App.GetMainPage().ConvertPageToUIElement(this);\n        }\n    }\n}\n```\n\
  \n如果你是 Windows Phone 程序员，可能会想知道 `ConvertPageToUIElement` 返回的是 Windows Phone Canvas\
  \ 对象。\n\n你可能想在 `MainPage` 构造函数中紧接 `InitializeComponent` 之后添加以下语句：\n\n```csharp\n\
  this.SupportedOrientations = SupportedPageOrientation.PortraitOrLandscape;\n```\n\
  \n这将允许 Windows Phone 显示响应方向变化，并与 iPhone 和 Android 项目保持一致。\n\n## 没什么特别的！\n\n如果你在\
  \ Visual Studio 中创建了 Xamarin.Forms 解决方案，并且不希望面向一个或多个平台，直接删除这些项目即可。\n\n如果你后来对这些项目改变了主意——或者你最初是在\
  \ Xamarin Studio 中创建解决方案，而现在想将它移到 Visual Studio 中以面向 Windows Phone——你可以在 Xamarin.Forms\
  \ 解决方案中添加新的平台项目。在 **添加新项目** 对话框中，你可以通过选择 iOS 项目的 **通用** 类型和 **空白应用** 模板来创建 Xamarin.iOS\
  \ 项目，或使用 Android 的 **空白应用** 模板创建 Xamarin.Android 项目，或使用 **应用商店应用 – Windows Phone\
  \ 应用 - 空白应用 (Windows Phone Silverlight)** 模板创建 Windows Phone 项目。\n\n\n\n\n对于这些新项目，你可以通过参考标准\
  \ Xamarin.Forms 模板生成的项目来获得正确的引用和样板代码。\n\n总而言之，与普通的 Xamarin 或 Windows Phone 项目相比，Xamarin.Forms\
  \ 应用并没有什么特别之处——除了 Xamarin.Forms 库。\n\n## PCL 还是 SAP？\n\n当你第一次创建 Hello 解决方案时，你可以从两个应用程序模板中选择：\n\
  \n- 空白应用（Xamarin.Forms Portable）\n- 空白应用（Xamarin.Forms Shared）\n\n第一种创建可移植类库（PCL），第二种创建仅包含共享代码文件的共享资产项目（SAP）。\n\
  \n在两种情况下，这个项目都会成为三个应用程序的一部分，但方式截然不同：使用 PCL 方法时，所有通用代码都捆绑到一个动态链接库中，每个应用程序项目在运行时引用并绑定该库。\n\
  \n使用共享资产项目方法时，通用代码文件在构建时实际上会随三个应用程序项目一起包含进去。如你所见，默认情况下 SAP 只有一个文件——上面描述的 App.cs\
  \ 文件。就好像这个项目不存在，而是三个应用程序项目中各有这个文件的三个不同副本。\n\n一些细微（甚至不太细微）的问题可能会在“空白应用（Xamarin.Forms\
  \ Shared）”模板中显现出来：\n\niOS 和 Android 项目可以访问几乎相同版本的 .NET，但 Windows Phone 项目使用的却不是同一版本的\
  \ .NET。这意味着共享代码所访问的任何 .NET 类可能会因平台不同而有所差异。在下一章中你会看到，System.IO 命名空间中的某些文件 I/O 类就是这样。\n\
  \n你可以使用 C# 预处理器指令来弥补这些差异，尤其是 #if 和 #elif。在 Xamarin.Forms 模板生成的项目中，Windows Phone\
  \ 和 iPhone 项目定义了一些可配合这些指令使用的符号。\n\n这些符号是什么？\n\n在 Visual Studio 中，右键单击“解决方案资源管理器”中的项目名称，然后选择“属性”。在属性屏幕左侧选择“生成”，然后查找“条件编译符号”字段。\n\
  \n在 Xamarin.Studio 中，在“解决方案”列表中选择一个应用程序项目，调用下拉工具菜单，然后选择“选项”。在“项目选项”对话框左侧选择“生成 >\
  \ 编译器”，然后查找“定义符号”字段。\n\n你会发现 iPhone 项目定义了符号 __IOS__（这是两个下划线\n\n在 PCL 和 SAP 方法之间只是为了感受一下它们。然而，一旦你开始在应用程序中结合使用\
  \ XAML，你就会发现 XAML 文件必须放在 PCL 中。为了保持一致，本书中的大多数项目都使用 PCL 方法。使用 Xamarin.Forms 已经有一段时间的程序员通常更倾向于\
  \ PCL，但 SAP 也肯定有它的拥护者。\n\n但为什么要选择呢？你可以在同一个解决方案中同时拥有两者。如果你已经创建了一个带有共享资产项目的 Xamarin.Forms\
  \ 解决方案，你可以通过选择 **类库（Xamarin.Forms Portable）** 模板向解决方案添加一个新的 PCL 项目。应用程序项目可以同时访问\
  \ SAP 和 PCL，SAP 也可以访问 PCL。\n\n## 用于文本的标签\n\n让我们使用上面创建 **Hello** 解决方案的相同过程，创建一个名为\
  \ **Greetings** 的新 Xamarin.Forms 解决方案。这个新解决方案的结构更像一个典型的 Xamarin.Forms 程序，这意味着它将定义一个派生自\
  \ `ContentPage` 的新类。在本书中，大多数时候程序定义的每个类和结构都会有自己的文件。这意味着必须向 **Greetings** 项目添加一个新文件：\n\
  \n在 Visual Studio 中，你可以右键单击“解决方案资源管理器”中的 **Greetings** 项目，然后从菜单中选择 **添加 > 新建项**。在“添加新项”对话框的左侧选择“Visual\
  \ C#”和“代码”，在中间区域选择“类”。\n\n在 Xamarin Studio 中，从 **Greetings** 项目上的工具图标中选择菜单中的 **添加\
  \ > 新建文件**。在“新建文件”对话框的左侧选择“常规”，在中间区域选择“空类”。\n\n无论是哪种情况，都将其命名为 GreetingsPage.cs。\n\
  \nGreetingsPage.cs 文件将用一个名为 **GreetingsPage** 的类的骨架代码进行初始化。你会希望这个类派生自 Xamarin.Forms\
  \ 的 `ContentPage` 类，因此你需要为 Xamarin.Forms 命名空间添加一个 `using` 指令，并且需要指定你的类派生自 `ContentPage`。`GreetingsPage`\
  \ 类不需要是公开的，因为它不会从 **Greetings** 项目外部被直接访问，但你需要一个无参构造函数。下面是准备好添加代码的空类：\n\n```\nusing\
  \ System;\nusing Xamarin.Forms;\n\nnamespace Greetings\n{\n    class GreetingsPage\
  \ : ContentPage\n    {\n        public GreetingsPage()\n        {\n        }\n \
  \   }\n}\n```\n\nGreetingsPage 定义：\n\n```\nclass GreetingsPage : ContentPage\n{\n\
  \    public GreetingsPage()\n    {\n        Label label = new Label\n        {\n\
  \            Text = \"Greetings, Xamarin.Forms!\"\n        };\n        this.Content\
  \ = label;\n    }\n}\n```\n\n这种样式允许将 Label 实例直接设置到 Content 属性，就像这样：\n\n```\nclass\
  \ GreetingsPage : ContentPage\n{\n    public GreetingsPage()\n    {\n        this.Content\
  \ = new Label\n        {\n            Text = \"Greetings, Xamarin.Forms!\"\n   \
  \     };\n    }\n}\n```\n\n对于更复杂的页面布局，这种实例化和初始化的风格能够更好地直观反映页面上布局和视图的组织方式。然而，如果你需要对这些对象调用方法或设置事件处理程序，事情并不总是像这个例子所示的那样简单。\n\
  \n无论你采用哪种方式，如果你能在模拟器或设备上成功地在三个平台上运行该程序，那么你将看到如下结果：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_40_0.png)\n\
  \n这个 Greetings 程序最令人失望的版本无疑是 iPhone：在 iOS 7 中，单页应用程序与顶部的状态栏共享屏幕。除非应用程序对此进行补偿，否则应用程序在页面顶部显示的任何内容都会与状态栏占据相同的空间。\n\
  \n这个问题在多页导航应用程序中会消失，但在那之前，这里有四种方法可以立即解决这个问题：\n\n## 1. 在页面中包含内边距\n\nPage 类定义了一个名为\
  \ Padding 的属性，它标记了页面内部周边的一个区域，内容不能侵入该区域。Padding 属性的类型是 Thickness，这是一个定义了 Left、Top、Right、Bottom\
  \ 四个属性的结构体。（你可能想记住这个顺序，因为在 Thickness 构造函数和 XAML 中都会按这个顺序定义它们。）Thickness 结构还定义了一些构造函数，用于在四个侧面设置相同的边距，或者在左右和上下设置相同的边距。\n\
  \n在你最喜欢的搜索引擎上稍微搜索一下，你就会发现 iOS 7 状态栏的高度是 20。（你可能会问：20 什么？20 像素？其实不是。现在，只需把它们当作 20\
  \ 个“单位”。在大多数 Xamarin.Forms 编程中，你不需要纠结于数值大小，但当你需要细化到像素级别时，第 5 章会提供一些指导。）你可以像这样适配状态栏：\n\
  \n```\nclass GreetingsPage : ContentPage\n{\n    public GreetingsPage()\n```\n\n\
  ```\n```csharp\n{\n    this.Content = new Label\n    {\n        Text = \"Greetings,\
  \ Xamarin.Forms!\"\n    };\n\n    this.Padding = new Thickness(0, 20, 0, 0);\n}\n\
  ```\n```\n\n现在问候语出现在距页面顶部 20 个单位的位置：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_41_0.png)\n\
  \n## 2. 仅针对 iOS 包含内边距\n\n在 `ContentPage` 上设置 `Padding` 属性解决了文本覆盖 iOS 状态栏的问题，但它也在不需要此边距的\
  \ Android 和 Windows Phone 上设置了相同的边距。有没有办法只在 iPhone 上设置此边距？\n\n有！静态的 `Device` 类包含几个属性和方法，可以让你的代码以一种非常简单直接的方式处理设备差异：\n\
  \n- `Device.OS` 属性返回 `TargetPlatform` 枚举的一个成员：iOS、Android、WinPhone 或 Other。\n- `Device.Idiom`\
  \ 属性返回 `TargetIdiom` 枚举的一个成员：Phone、Tablet、Desktop 或 Unsupported。（然而，Xamarin.Forms\
  \ 目前实际上只面向手机。）\n\n你可以在 `if` 和 `else` 语句中使用这两个属性来执行特定于某个...\n\n\nparticular platform.\n\
  \nTwo methods named OnPlatform provide even more elegant solutions:\n\n- The static\
  \ generic method OnPlatform<T> takes three arguments of type T, the first for iOS,\
  \ the second for Android, and the third for Windows Phone, and returns the argument\
  \ for the running platform.\n- The static method OnPlatform has four arguments of\
  \ type Action (the .NET function delegate that has no arguments and returns void)\
  \ also in the order iOS, Android, and Windows Phone, with a fourth for a default,\
  \ and executes the argument for the running platform.\n\nThe Device class also defines\
  \ a static method to start running a timer, to invoke the phone’s email or telephone\
  \ dialer, and to run some code on the main thread. This latter method (called Device.BeginInvokeOnMainThread)\
  \ comes in handy when you’re working with asynchronous methods and supplemental\
  \ threads because code that manipulates the user interface can generally only be\
  \ run on the main user-interface thread.\n\nRather than setting the same Padding\
  \ property on all three platforms, you can restrict the Padding to just the iPhone\
  \ by using the Device.OnPlatform generic method:\n\n```\ndouble topPadding = Device.OnPlatform<double>(20,\
  \ 0, 0);\nthis.Padding = new Thickness(0, topPadding, 0, 0);\n```\n\nExplicitly\
  \ specifying the type of the Device.OnPlatform arguments within the angle brackets\
  \ isn’t required if the compiler can figure it out from the arguments. In this case,\
  \ if the double in angle brackets is removed, the compiler would determine that\
  \ the arguments are integers and then implicitly convert the integer to a double\
  \ in the assignment statement.\n\nYou can simplify this code to just:\n\n```\nthis.Padding\
  \ = new Thickness (0, Device.OnPlatform (20, 0, 0), 0, 0);\n```\n\nThis is how the\
  \ Padding will be set in the programs that follow when it’s required. Of course,\
  \ you can substitute some other numbers for the 0’s if you want some additional\
  \ padding on the page. Sometimes a little padding on the sides makes for a more\
  \ attractive display.\n\nIn Shared Asset Projects you can use the C# preprocessor\
  \ directives #if and #elif as shown earlier, but the Device class has the advantage\
  \ of working with both PCL projects and Shared Asset Projects.\n\n## 3. Center the\
  \ label within the page\n\nThe problem with the text overlapping the iOS status\
  \ bar only occurs because the text by default is displayed at the upper-left corner.\
  \ Is it possible to center the text on the page?\n\nXamarin.Forms supports a number\
  \ of facilities to ease layout without requiring the program to perform calculations\
  \ involving sizes and coordinates. The View class defines two properties named\n\
  \n![](img/c2d61d0459c51981af78607f1eef3d1c_44_0.png)\n\nThis is the version of the\
  \ Greetings program that is included in the sample code for this chapter. You can\
  \ use various combinations of HorizontalOptions and VerticalOptions to position\
  \ the text in any of nine places relative to the screen.\n\nYou'll be learning much\
  \ more about HorizontalOptions and VerticalOptions properties and the LayoutOptions\
  \ structure in the pages ahead.\n\n## 4. Center the text within the label\n\nThe\
  \ Label is intended to display text up to a paragraph in length. It is often desirable\
  \ to control how the lines of text are horizontally aligned: left-justified, right-justified,\
  \ or centered.\n\nThe Label view defines an XAlign property for that purpose and\
  \ also a YAlign property for positioning text vertically. Both properties are set\
  \ to a member of the TextAlignment enumeration, which has members named Start, Center,\
  \ and End to be versatile enough for text that runs from right to left or from top\
  \ to bottom.\n\nFor English and other European languages, Start means left or top,\
  \ and End means right or bottom.\n\nFor this fourth solution to the iOS status bar\
  \ problem, set XAlign and YAlign to TextAlignment.Center.\n\n```\nclass GreetingsPage\
  \ : ContentPage\n{\n    public GreetingsPage()\n    {\n        this.Content = new\
  \ Label\n```\n\n```\n{\n    Text = \"Greetings, Xamarin.Forms!\",\n    XAlign =\
  \ TextAlignment.Center,\n    YAlign = TextAlignment.Center\n};\n}\n```\n\nVisually,\
  \ the result with this single line of text is the same as setting HorizontalOptions\
  \ and VerticalOptions to center, and you can also use various combinations of these\
  \ properties to position the text in one of nine different locations around the\
  \ page.\n\nHowever, these two techniques to center the text are actually quite different,\
  \ as you’ll soon see.\n\n## Wrapping paragraphs\n\nDisplaying a paragraph of text\
  \ is as easy as displaying a single line of text:\n\n```\nclass BaskervillesPage\
  \ : ContentPage\n{\n    public BaskervillesPage()\n    {\n        this.Content =\
  \ new Label\n        {\n            VerticalOptions = LayoutOptions.Center,\n  \
  \          Text =\n                \"Mr. Sherlock Holmes, who was usually very late\
  \ in \" +\n                \"the mornings, save upon those not infrequent \" +\n\
  \                \"occasions when he was up all night, was seated at \" +\n    \
  \            \"the breakfast table. I stood upon the hearth-rug \" +\n         \
  \       \"and picked up the stick which our visitor had left \" +\n            \
  \    \"behind him the night before. It was a fine, thick \" +\n                \"\
  piece of wood, bulbous-headed, of the sort which \" +\n                \"is known\
  \ as a \\u201CPenang lawyer.\\u201D Just \" +\n                \"under the head\
  \ was a broad silver band, nearly an \" +\n                \"inch across, \\u201CTo\
  \ James Mortimer, M.R.C.S., \" +\n                \"from his friends of the C.C.H.,\\\
  u201D was engraved \" +\n                \"upon it, with the date \\u201C1884.\\\
  u201D It was \" +\n                \"just such a stick as the old-fashioned family\
  \ \" +\n                \"practitioner used to carry\\u2014dignified, solid, \"\
  \ +\n                \"and reassuring.\"\n        };\n\n        this.Padding = new\
  \ Thickness(5, Device.OnPlatform(20, 5, 5), 5, 5);\n    }\n}\n```\n\nNotice the\
  \ use of embedded Unicode codes for opened and closed \"smart quotes\" (\\u201C\
  \ and \\u201D) and the em-dash (\\u2014). Padding has been set for 5 units around\
  \ the page to avoid the text butting up against the edges of the screen, but the\
  \ VerticalOptions property has been used\n\nLabel also allows specifying color,\
  \ and a little experimentation with color will demonstrate the profound difference\
  \ between HorizontalOptions and VerticalOptions, and XAlign and YAlign.\n\n## Text\
  \ and background colors\n\nAs you've seen, the Label view displays text in a color\
  \ appropriate for the device. You can override that behavior by setting two properties\
  \ named TextColor and BackgroundColor. Label itself defines TextColor but inherits\
  \ BackgroundColor from VisualElement, which means that Page and Layout also have\
  \ a BackgroundColor property.\n\nYou set TextColor and BackgroundColor to a value\
  \ of type Color, which is a structure that defines 16 static fields for obtaining\
  \ common colors. Here are two of them used in conjunction with XAlign and YAlign\
  \ to center the text:\n\n```\nclass GreetingsPage : ContentPage\n{\n    public GreetingsPage()\n\
  \    {\n        this.Content = new Label\n        {\n            Text = \"Greetings,\
  \ Xamarin.Forms!\",\n            XAlign = TextAlignment.Center,\n            YAlign\
  \ = TextAlignment.Center,\n            BackgroundColor = Color.Yellow,\n       \
  \     TextColor = Color.Blue\n        };\n    }\n}\n```\n\nThe result might surprise\
  \ you. As these screenshots illustrate, the Label actually occupies the entire area\
  \ of the page (including underneath the iOS status bar), and the XAlign and YAlign\
  \ properties position the text within that entire area:\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_49_0.png)\n\
  \nThe default values of HorizontalOptions and VerticalOptions are not LayoutOptions.Start\
  \ as the default appearance of the text might suggest. The default values are instead\
  \ LayoutOptions.Fill. This is the setting that causes the Label to fill the page.\
  \ The default XAlign and YAlign values of TextAlignment.Start are what caused the\
  \ text to be positioned at the upper-left in the first version of the Greetings\
  \ program.\n\nYou might wonder: What are the default values of the TextColor and\
  \ BackgroundColor properties, because the default values result in different colors\
  \ for the different platforms?\n\nThe default values of TextColor and BackgroundColor\
  \ are actually a special color value named Color.Default that does not represent\
  \ a real color but instead is used to reference the text and background colors appropriate\
  \ for the particular platform.\n\nLet’s explore color in more detail.\n\n## The\
  \ Color structure\n\nInternally, the Color structure stores colors in two different\
  \ ways:\n\n- As red, green, and blue (RGB) values of type double that range from\
  \ 0 to 1. Read-only properties named R, G, and B expose these values.\n- As hue,\
  \ saturation, and luminosity values of type double that also range from 0 to 1.\
  \ These values are exposed with read-only properties named Hue, Saturation, and\
  \ Luminosity.\n\nThe Color structure also supports an alpha channel for indicating\
  \ degrees of opacity. A read-only\n\n\n\n`Color` 的 `A` 属性公开了这个值，其范围从透明度为 0 到不透明度为\
  \ 1。所有这些属性都是只读的。`Color` 值一旦创建便不可变。\n\n可以通过以下几种方式创建 `Color` 值。三个构造函数是最简单的方式：\n\n\
  - `new Color(double grayShade)`\n- `new Color(double r, double g, double b)`\n-\
  \ `new Color(double r, double g, double b, double a)`\n\n参数的取值范围为 0 到 1。`Color`\
  \ 还定义了几个静态创建方法，包括：\n\n- `Color.FromRgb(double r, double g, double b)`\n- `Color.FromRgb(int\
  \ r, int g, int b)`\n- `Color.FromRgba(double r, double g, double b, double a)`\n\
  - `Color.FromRgba(int r, int g, int b, int a)`\n- `Color.FromHsla(double h, double\
  \ s, double l, double a)`\n\n带整数参数的两个静态方法假定参数范围为 0 到 255，这是 RGB 颜色的常用表示方式。在内部，构造函数只需将整数值除以\
  \ 255.0，即可将其转换为 `double`。\n\n注意！你可能会认为下面的调用会创建红色：\n\n```csharp\nColor.FromRgb(1,\
  \ 0, 0)\n```\n\n然而，C# 编译器会将这些参数视为整数。因此将调用整数版本的方法，第一个参数会被除以 255.0，结果将接近于零。如果希望调用带有\
  \ `double` 参数的方法，应明确指定：\n\n```csharp\nColor.FromRgb(1.0, 0, 0)\n```\n\n`Color` 还为打包的\
  \ `uint` 格式以及字符串中的十六进制格式定义了静态创建方法。\n\n`Color` 结构还定义了 16 个 `Color` 类型的公共静态只读字段。下面列出了这些字段，以及\
  \ `Color` 结构内部用于定义它们的整数 RGB 值和相应的 `Hue`、`Saturation` 与 `Luminosity` 值。为便于说明，部分数值进行了四舍五入：\n\
  \n| Color Fields | Red | Green | Blue | Hue | Saturation | Luminosity |\n|---|---:|---:|---:|---:|---:|---:|\n\
  | White | 255 | 255 | 255 | 0 | 0 | 1.00 |\n| Silver | 192 | 192 | 192 | 0 | 0 |\
  \ 0.75 |\n| Gray | 128 | 128 | 128 | 0 | 0 | 0.50 |\n| Black | 0 | 0 | 0 | 0 | 0\
  \ | 0 |\n| Red | 255 | 0 | 0 | 1.00 | 1 | 0.50 |\n| Maroon | 128 | 0 | 0 | 1.00\
  \ | 1 | 0.25 |\n\n例如，也可以使用视图集合初始化 `Children` 方法，其方式类似于之前初始化 `FormattedString` 对象的\
  \ `Spans` 集合。\n\n`ColorList` 程序将页面的 `Content` 属性设置为 `StackLayout` 对象，然后使用 16 个 `Label`\
  \ 视图初始化其 `Children` 属性：\n\n```csharp\nclass ColorListPage : ContentPage\n{\n   \
  \ public ColorListPage()\n    {\n        this.Padding =\n            new Thickness\
  \ (5, Device.OnPlatform (20, 5, 5), 5, 5);\n\n        this.Content = new StackLayout\n\
  \        {\n            Children =\n            {\n                new Label\n \
  \               {\n                    Text = \"White\",\n                    TextColor\
  \ = Color.White\n                },\n                new Label\n               \
  \ {\n                    Text = \"Silver\",\n                    TextColor = Color.Silver\n\
  \                },\n\n                …\n\n                new Label\n        \
  \        {\n                    Text = \"Purple\",\n                    TextColor\
  \ = Color.Purple\n                }\n            }\n        };\n    }\n}\n```\n\n\
  不必查看全部 16 个子 `Label` 视图的代码，了解这个示例即可。下面是运行结果：\n\n```csharp\n// 遍历 Color 结构的属性。\n\
  foreach (PropertyInfo propInfo in\n             typeof(Color).GetRuntimeProperties())\n\
  {\n    MethodInfo methodInfo = propInfo.GetMethod;\n\n    if (methodInfo.IsPublic\
  \ &&\n        methodInfo.IsStatic &&\n        methodInfo.ReturnType == typeof(Color))\n\
  \    {\n        stackLayout.Children.Add(\n            CreateColorLabel((Color)\
  \ propInfo.GetValue(null),\n                             propInfo.Name));\n    }\n\
  }\n\nthis.Padding = new Thickness(5, Device.OnPlatform(20, 5, 5), 5, 5);\n\n// 将\
  \ StackLayout 放入 ScrollView。\nthis.Content = new ScrollView\n{\n    Content = stackLayout\n\
  };\n}\n\nLabel CreateColorLabel(Color color, string name)\n{\n    Color backgroundColor\
  \ = Color.Default;\n\n    if (color != Color.Default)\n    {\n        // 标准亮度计算\n\
  \        double luminance = 0.30 * color.R +\n                           0.59 *\
  \ color.G +\n                           0.11 * color.B;\n\n        backgroundColor\
  \ = luminance > 0.5 ? Color.Black : Color.White;\n    }\n\n    // 创建 Label。\n  \
  \  return new Label\n    {\n        Text = name,\n        TextColor = color,\n \
  \       BackgroundColor = backgroundColor,\n        Font = Font.SystemFontOfSize(NamedSize.Large)\n\
  \    };\n}\n```\n\n在构造函数的末尾，`StackLayout` 被设置为 `ScrollView` 的 `Content` 属性，而后者又被设置为页面的\
  \ `Content` 属性。\n\n在代码中向 `StackLayout` 添加子项时，通常最好让 `StackLayout` 与最终显示它的页面保持断开状态。每添加一个新子项，`StackLayout`\
  \ 的大小都会发生变化；如果 `StackLayout` 已经连接到页面，就会产生大量并不必要的布局活动。\n\n该类中的 `CreateColorLabel`\
  \ 方法通过设置具有对比度的背景色，尝试让每种颜色都清晰可见。该方法根据红、绿、蓝三个分量的标准加权平均值计算亮度，然后选择白色或黑色作为背景色。\n\n这种方法不适用于\
  \ `Transparent`，因此完全无法显示该项；对于 `Color.Default`，该方法将其作为特殊情况处理，并使用 `Color.Default`\
  \ 作为背景显示该颜色（无论它实际是什么颜色）。\n\n下面是运行结果，但其美观程度仍然相当有限：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_62_0.png)\n\
  \n不过，你可以滚动查看该显示内容。\n\n前面提到过，`Layout<T>` 类定义了 `StackLayout` 所继承的 `Children` 属性。泛型\
  \ `Layout<T>` 类派生自非泛型的 `Layout` 类，而 `ScrollView` 也派生自这个非泛型的 `Layout` 类。从理论上讲，`ScrollView`\
  \ 是一种布局对象——即使它只有一个子项。\n\n从屏幕截图可以看到，`Label` 的背景色延伸到了 `StackLayout` 的整个宽度，这意味着每个 `Label`\
  \ 都与 `StackLayout` 一样宽。\n\n让我们进行一些实验，以便更好地理解 Xamarin.Forms 的布局。对于这些实验，可以暂时为 `StackLayout`\
  \ 和 `ScrollView` 设置不同的背景色：\n\n```csharp\nclass ReflectedColorsPage : ContentPage\n\
  {\n    public ReflectedColorsPage()\n    {\n        StackLayout stackLayout = new\
  \ StackLayout\n        {\n            BackgroundColor = Color.Blue\n        };\n\
  \        ...\n        this.Content = new ScrollView\n        {\n            BackgroundColor\
  \ = Color.Red,\n            Content = stackLayout\n        };\n    }\n    ...\n\
  }\n```\n\n布局对象通常默认具有透明背景，因此虽然它们会占据屏幕上的区域，却不会直接显示出来。为布局对象临时设置颜色，是准确查看它们在屏幕上位置的好方法。这也是调试复杂布局的一种实用技巧。\n\
  \n你会发现，蓝色的 `StackLayout` 会在各个 `Label` 视图之间的空隙中显现出来——这是 `StackLayout` 的默认 `Spacing`\
  \ 属性造成的；此外，它还会透过 `Color.Default` 对应的 `Label` 显现出来，因为该 `Label` 具有透明背景。\n\n尝试将所有 `Label`\
  \ 视图的 `HorizontalOptions` 属性设置为 `LayoutOptions.Start`：\n\n```csharp\nreturn new\
  \ Label\n{\n    Text = name,\n    TextColor = color,\n    BackgroundColor = backgroundColor,\n\
  \    Font = Font.SystemFontOfSize(NamedSize.Large),\n    HorizontalOptions = LayoutOptions.Start\n\
  };\n```\n\n现在，`StackLayout` 的蓝色背景更加明显了，因为所有 `Label` 视图只占用文本所需的水平空间，并且都被推到左侧。由于每个\
  \ `Label` 视图的宽度不同，这种显示效果甚至比第一个版本更难看！\n\n现在移除 `Label` 中的 `HorizontalOptions` 设置，改为在\
  \ `StackLayout` 上设置 `HorizontalOptions`：\n\n```csharp\nStackLayout stackLayout =\
  \ new StackLayout\n{\n```\n\n\n\n\n\n- `LayoutOptions.End`\n- `LayoutOptions.Fill`\n\
  \n`View` 类建立的默认值是 `LayoutOptions.Fill`，这意味着视图会填充其容器。\n\n正如你所见，当 `Label` 是垂直 `StackLayout`\
  \ 的子视图时，在其上设置 `VerticalOptions` 并不会产生什么区别。`StackLayout` 本身会将子视图的高度限制为它们所需的高度，因此子视图在该槽位内没有垂直移动的自由。\n\
  \n请做好心理准备，这条规则稍后会有所修正！\n\n`LayoutOptions` 结构还有四个尚未讨论的静态字段：\n\n- `LayoutOptions.StartAndExpand`\n\
  - `LayoutOptions.CenterAndExpand`\n- `LayoutOptions.EndAndExpand`\n- `LayoutOptions.FillAndExpand`\n\
  \n你可能还记得，`LayoutOptions` 有两个实例属性，名为 `Alignment` 和 `Expands`。这四个 `LayoutOptions`\
  \ 实例的 `Expands` 属性都被设置为 `true`。在管理页面布局时，这个 `Expands` 属性可能非常有用，但初次接触时可能会让人感到困惑。以下是\
  \ `Expands` 在垂直 `StackLayout` 中发挥作用的条件：\n\n- 垂直 `StackLayout` 的高度必须小于其容器的高度。换句话说，`StackLayout`\
  \ 中必须存在一些额外未使用的垂直空间。\n- 第一个条件意味着，垂直 `StackLayout` 的 `VerticalOptions` 设置不能是 `Start`、`Center`\
  \ 或 `End`，因为那样会导致 `StackLayout` 的高度等于其子视图的总高度，因而没有额外空间。\n- `StackLayout` 的至少一个子视图必须将其\
  \ `VerticalOptions` 设置为 `Expands` 属性为 `true`。\n\n如果满足这些条件，`StackLayout` 就会将额外的垂直空间平均分配给所有将\
  \ `VerticalOptions` 设置为 `Expands` 为 `true` 的子视图。子视图如何占据该空间取决于 `Alignment` 设置：`Start`、`Center`、`End`\
  \ 或 `Fill`。\n\n下面是一个名为 `VerticalOptionsDemo` 的程序，它使用反射在垂直 `StackLayout` 中创建带有所有可能的\
  \ `VerticalOptions` 设置的 `Label` 对象。背景色和前景色交替使用，这样你就能确切看到每个 `Label` 占用了多少空间。该程序使用语言集成查询（LINQ）对\
  \ `LayoutOptions` 结构的字段进行排序，以便在视觉上更清晰地展示：\n\n```\nclass VerticalOptionsDemoPage\
  \ : ContentPage\n{\n    public VerticalOptionsDemoPage()\n    {\n        Color[]\
  \ colors = { Color.Yellow, Color.Blue };\n        int flipFlopper = 0;\n\n     \
  \   // Create Labels sorted by LayoutAlignment property.\n        IEnumerable<Label>\
  \ labels =\n            from field in typeof(LayoutOptions).GetRuntimeFields()\n\
  \            where field.IsPublic && field.IsStatic\n            orderby ((LayoutOptions)field.GetValue(null)).Alignment\n\
  \            select new Label\n            {\n                Text = \"VerticalOptions\
  \ = \" + field.Name,\n                VerticalOptions = (LayoutOptions)field.GetValue(null),\n\
  \                XAlign = TextAlignment.Center,\n                Font = Font.SystemFontOfSize(NamedSize.Large),\n\
  \                TextColor = colors[flipFlopper],\n                BackgroundColor\
  \ = colors[flipFlopper = 1 - flipFlopper]\n            };\n\n        // Transfer\
  \ to StackLayout.\n        StackLayout stackLayout = new StackLayout();\n\n    \
  \    foreach (Label label in labels)\n        {\n            stackLayout.Children.Add(label);\n\
  \        }\n\n        this.Padding = new Thickness(0, Device.OnPlatform(20, 0, 0),\
  \ 0, 0);\n        this.Content = stackLayout;\n    }\n}\n```\n\n你不妨仔细研究一下结果：\n\n\
  ![](img/c2d61d0459c51981af78607f1eef3d1c_68_0.png)\n\n那些黄字蓝底的 `Label` 视图，是其 `VerticalOptions`\
  \ 属性设置为不带 `Expands` 标志的 `LayoutOptions` 值。如果在垂直 `StackLayout` 中，某个项的 `LayoutOptions`\
  \ 值未设置 `Expands` 标志，那么该 `VerticalOptions` 设置会被忽略。正如你所见，这个 `Label` 在垂直 `StackLayout`\
  \ 中只占据它所需的垂直空间。\n\n这个 `StackLayout` 中所有子视图的总高度小于 `StackLayout` 本身的高度，因此 `StackLayout`\
  \ 有额外空间。它有四个子视图的 `VerticalOptions` 属性设置为带有 `Expands` 标志的 `LayoutOptions` 值，因此这些额外空间会被平均分配给这四个子视图。\n\
  \n在这四种情况中——即蓝字黄底的 `Label` 视图——`LayoutOptions` 值的 `Alignment` 属性指示了子视图在包括额外空间在内的区域内的对齐方式。第一个（`VerticalOptions`\
  \ 属性设置为 `LayoutOptions.StartAndExpand`）位于额外空间的上方。第二个（`CenterAndExpand`）位于额外空间的中间。第三个（`EndAndExpand`）位于额外空间的下方。然而，在这三种情况下，`Label`\
  \ 都只获得了它所需的垂直空间，正如背景色所显示的那样。其余空间属于 `StackLayout`，它显示的是页面的背景色。\n\n最后一个 `Label` 的\
  \ `VerticalOptions` 属性设置为 `LayoutOptions.FillAndExpand`。在这种情况下，`Label` 占据了包括额外空间在内的整个区域，正如大片的黄色背景所示。文本位于该区域的顶部；这是因为\
  \ `YAlign` 的默认设置是 `TextAlignment.Start`。将其设置为其他值，即可在区域内垂直定位文本。\n\n`LayoutOptions`\
  \ 的 `Expands` 属性只在视图是 `StackLayout` 的子视图时才起作用。在其他上下文中，它是多余的。\n\n## Frame 和 BoxView\n\
  \n两种简单的矩形视图经常用于展示目的：\n\n`BoxView` 是一个简单的填充矩形。它派生自 `View`，并定义了一个默认为透明的 `Color` 属性。\n\
  \n`Frame` 显示一个围绕某些内容的矩形边框。`Frame` 通过 `ContentView` 派生自 `Layout`，并从中继承了 `Content`\
  \ 属性。`Frame` 的内容可以是单个视图，也可以是包含多个视图的布局。`Frame` 从 `VisualElement` 继承了 `BackgroundColor`\
  \ 属性，该属性在 iPhone 上为白色，但在 Android 和 Windows Phone 上为透明。`Frame` 从 `Layout` 继承了 `Padding`\
  \ 属性，并将其初始化为所有边各 20 个单位，以便为内容留出一些呼吸空间。`Frame` 本身定义了一个默认为透明的 `OutlineColor` 属性，以及一个默认为\
  \ `true` 的 `HasShadow` 属性，但阴影只在 iPhone 上显示。\n\n如果 `BoxView` 或 `Frame` 在尺寸上没有受到任何限制——也就是说，如果它们不在\
  \ `StackLayout` 中，并且其 `HorizontalOptions` 和 `VerticalOptions` 设置为默认值 `LayoutOptions.Fill`——这些视图会扩展以填充其容器。\n\
  \n例如，尝试修改 **Greetings** 程序，让 `GreetingsPage` 构造函数将 `Label` 放入 `Frame` 中。务必为 `Frame`\
  \ 设置 `OutlineColor`：\n\n```\nclass GreetingsPage : ContentPage\n{\n    public GreetingsPage()\n\
  \    {\n        this.Content = new Frame\n        {\n            OutlineColor =\
  \ Color.Accent,\n            Content = new Label\n            {\n              \
  \  Text = \"Greetings, Xamarin.Forms!\"\n            }\n        };\n    }\n}\n```\n\
  \n你可能根本不会注意到 `Frame`，因为它已经扩展以填满整个页面。将 `Frame` 上的 `HorizontalOptions` 和 `VerticalOptions`\
  \ 属性设置为 `LayoutOptions.Center`（例如）：\n\n```\nclass GreetingsPage : ContentPage\n\
  {\n    public GreetingsPage()\n    {\n        this.Content = new Frame\n       \
  \ {\n            OutlineColor = Color.Accent,\n            HorizontalOptions = LayoutOptions.Center,\n\
  \            VerticalOptions = LayoutOptions.Center,\n\n            Content = new\
  \ Label\n            {\n                Text = \"Greetings, Xamarin.Forms!\"\n \
  \           }\n        };\n    }\n}\n```\n\n现在，`Frame` 会紧贴文本（但带有默认的 20 单位内边距）并位于页面中央：\n\
  \n![](img/c2d61d0459c51981af78607f1eef3d1c_70_0.png)\n\n`BoxView` 默认是透明的，所以你需要设置颜色：\n\
  \n```\nclass GreetingsPage : ContentPage\n{\n    public GreetingsPage()\n    {\n\
  \        this.Content = new BoxView\n        {\n            Color = Color.Accent\n\
  \        };\n    }\n}\n```\n\n`BoxView` 会填满其容器的整个区域，就像 `Label` 使用默认 `HorizontalOptions`\
  \ 或 `VerticalOptions` 设置时那样。尝试在 `BoxView` 上设置这些属性：\n\n```\nclass GreetingsPage :\
  \ ContentPage\n{\n    public GreetingsPage()\n```\n\n\n\n\n```\n{\n    this.Content\
  \ = new BoxView\n    {\n        Color = Color.Accent,\n        HorizontalOptions\
  \ = LayoutOptions.Center,\n        VerticalOptions = LayoutOptions.Center\n    }\n\
  }\n```\n\n现在，BoxView 将采用其默认尺寸，即 40 个单位见方。BoxView 之所以是这个大小，是因为 BoxView 将其 WidthRequest\
  \ 和 HeightRequest 属性初始化为 40。\n\n这些 WidthRequest 和 HeightRequest 属性需要稍作解释：\n\nVisualElement\
  \ 定义了 Width 和 Height 属性，但这两个属性是只读的。VisualElement 还定义了 WidthRequest 和 HeightRequest\
  \ 属性，它们既可设置也可获取。通常，所有这些属性都被初始化为 -1（这实际上意味着它们未定义），但某些 View 派生类（例如 BoxView）会将 WidthRequest\
  \ 和 HeightRequest 属性设置为特定值。\n\n在页面布局之后，Width 和 Height 属性表示视图的实际尺寸——即视图在屏幕上占用的区域。由于\
  \ Width 和 Height 是只读的，它们仅用于提供信息。\n\n如果你希望 View 具有特定大小，可以设置 WidthRequest 和 HeightRequest\
  \ 属性。但正如其名称所示，这些属性表示请求的大小或首选大小。如果允许视图填充其容器，这些属性将被忽略。但如果不允许，这些属性将决定视图的大小。\n\nBoxView\
  \ 将自己的 WidthRequest 和 HeightRequest 属性设置为 40。你可以将这些设置视为 BoxView 在没有其他意见的情况下所希望的大小。你已经看到，当允许\
  \ BoxView 填充页面时，WidthRequest 和 HeightRequest 会被忽略。如果 HorizontalOptions 设置为 LayoutOptions.Left、Center\
  \ 或 Right，或者 BoxView 是水平 StackLayout 的子级，WidthRequest 就会生效。HeightRequest 的行为类似。\n\
  \n试试这个：\n\n```\nclass GreetingsPage : ContentPage\n{\n    public GreetingsPage()\n\
  \    {\n        this.Content = new BoxView\n        {\n            Color = Color.Accent,\n\
  \            HorizontalOptions = LayoutOptions.Center,\n            VerticalOptions\
  \ = LayoutOptions.Center,\n            WidthRequest = 200,\n            HeightRequest\
  \ = 100\n        }\n    }\n}\n```\n\n现在我们得到一个具有该特定大小的 BoxView：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_72_0.png)\n\
  \n让我们在增强的颜色列表中同时使用 Frame 和 BoxView。ColorBlock 程序的页面构造函数与 ReflectedColors 中的构造函数几乎相同，只是它调用名为\
  \ CreateColorView 的方法而不是 CreateColorLabel。该方法如下：\n\n```\nclass ColorBlockPage :\
  \ ContentPage\n{\n    ...\n\n    View CreateColorView(Color color, string name)\n\
  \    {\n        return new Frame\n        {\n            Content = new StackLayout\n\
  \            {\n                Orientation = StackOrientation.Horizontal,\n   \
  \             Spacing = 15,\n                Children =\n                {\n   \
  \                 new BoxView\n                    {\n                        Color\
  \ = color\n                    },\n                    new Label\n             \
  \       {\n                        Text = name,\n                        Font =\
  \ Font.BoldSystemFontOfSize(NamedSize.Medium),\n                        VerticalOptions\
  \ = LayoutOptions.Center\n                    },\n                    new Label\n\
  \                    {\n                        Text = String.Format(\"{0:X2}-{1:X2}-{2:X2}\"\
  ,\n                            (int)(255 * color.R),\n                         \
  \   (int)(255 * color.G),\n                            (int)(255 * color.B)),\n\
  \                        VerticalOptions = LayoutOptions.Center,\n             \
  \           IsVisible = color != Color.Default\n                    }\n        \
  \        }\n            }\n        };\n    }\n}\n```\n\n`CreateColorView` 方法返回一个\
  \ `Frame`，其中包含一个水平 `StackLayout`，有一个 `BoxView` 指示颜色，以及两个 `Label` 视图分别显示颜色名称及其 RGB\
  \ 组成。对于 `Color.Default` 值，这个 RGB 显示没有意义，因此在那种情况下第二个 `Label` 的 `IsVisible` 属性设置为\
  \ `false`。该 `Label` 仍然存在，但在页面渲染时被当作不存在。\n\n现在这是一个可滚动的颜色列表，已经开始让我们有点自豪了：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_73_0.png)\n\
  \n## 一个 StackLayout 中的 ScrollView？\n\n通常将 `StackLayout` 放在 `ScrollView` 中，但你能把 `ScrollView`\
  \ 放在 `StackLayout` 中吗？你为什么要这样做呢？\n\n在像 Xamarin.Forms 这样的布局系统中，通常的规则是：不能把滚动视图放在堆栈中。`ScrollView`\
  \ 需要有特定的高度，才能计算其内容高度与自身高度之间的差值。这个差值就是 `ScrollView` 可以滚动其内容的量。如果 `ScrollView` 在 `StackLayout`\
  \ 中，它就无法获得这个特定的高度。`StackLayout` 希望 `ScrollView` 尽可能短，这要么是 `ScrollView` 内容的高度，要么是零，而这两种方案都不可行。\n\
  \n那么，为什么你还会想把 `ScrollView` 放在 `StackLayout` 中呢？\n\n有时候这正是你需要的。考虑一个实现滚动的简单电子书阅读器。你可能希望页面顶部有一个\
  \ `Label` 始终显示书名，后面是一个 `ScrollView`，其中包含一个 `StackLayout`，用于显示书的内容。让这个 `Label` 和\
  \ `ScrollView` 成为一个填充页面的 `StackLayout` 的子级会很方便。\n\n使用 Xamarin.Forms，这种事情是可能的。如果你给\
  \ `ScrollView` 设置 `VerticalOptions` 为 `LayoutOptions.FillAndExpand`，它确实可以成为 `StackLayout`\
  \ 的子级。`StackLayout` 会将其他子级不需要的多余空间分配给 `ScrollView`，这样 `ScrollView` 就有了特定的高度。\n\n\
  **BlackCat** 项目显示埃德加·爱伦·坡的短篇小说《黑猫》的文本，该文本存储在一个名为 TheBlackCat.txt 的文本文件中，采用每段一行的格式。\n\
  \n有时，将应用程序所需的文件（例如这个短篇小说）直接嵌入到程序可执行文件中，或者——在 Xamarin.Forms 应用程序的情况下——直接嵌入到可移植类库\
  \ DLL 中，会很方便。这些文件称为嵌入资源，TheBlackCat.txt 文件在程序中的角色正是如此。\n\n**BlackCat** 是一个 PCL 应用程序。在\
  \ SAP 应用程序中也可以做类似的事情，但要困难一些，因为这三个平台引用的资源名称不同。\n\n要在 Visual Studio 或 Xamarin Studio\
  \ 中创建嵌入资源，你通常需要先从项目菜单中选择 **添加 > 新建文件夹** 选项，在项目中创建一个文件夹。例如，用于文本文件的文件夹可以叫做 **Texts**。该文件夹是可选的，但有助于组织程序资产。然后，对于该文件夹，你可以在\
  \ Visual Studio 中选择 **添加 > 现有项**，或在 Xamarin Studio 中选择 **添加 > 添加文件**。导航到该文件，在 Visual\
  \ Studio 中选择并点击 **添加**，或在 Xamarin Studio 中点击 **打开**。\n\n现在这里是要点：一旦文件成为项目的一部分，请从文件关联的菜单中打开\
  \ **属性** 对话框。指定该文件的 **生成操作** 为 **嵌入的资源**。这一步很容易忘记，但至关重要。\n\n对 **BlackCat** 项目已经这样做了，因此\
  \ TheBlackCat.txt 文件被嵌入到 BlackCat.dll 文件中。\n\n在代码中，可以通过调用 `System.Reflection` 命名空间中\
  \ `Assembly` 类定义的 `GetManifestResourceStream` 方法来检索该文件。要获取 PCL 的程序集，你只需获取程序集中定义的任何类的\
  \ `Type`。你可以将 `typeof` 用于从 `ContentPage` 派生的页面类型，或者对该类的实例使用 `GetType`。然后在此 `Type`\
  \ 对象上调用 `GetTypeInfo`。`Assembly` 是结果 `TypeInfo` 对象的属性：\n\n```\nAssembly assembly\
  \ = this.GetType().GetTypeInfo().Assembly;\n```\n\n在 `Assembly` 的 `GetManifestResourceStream`\
  \ 方法中，你需要指定资源的名称。对于嵌入资源，该名称不是资源的文件名，而是资源 ID。由于这个 ID 看起来可能有点像完全限定的文件名，所以很容易混淆。\n\n\
  资源 ID 以程序集的默认命名空间开头。这不是 .NET 命名空间！要获取 Visual Studio 中程序集的默认命名空间，请从项目菜单中选择 **属性**，然后在属性对话框中选择左侧的\
  \ **库**，并查找 **默认命名空间** 字段。在 Xamarin Studio 中，从项目菜单中选择 **选项**，然后在 **项目选项** 对话框中选择左侧的\
  \ **主设置**，并查找标记为 **默认命名空间** 的字段。\n\n对于 **BlackCat** 项目，该默认命名空间与程序集相同：“BlackCat”。但实际上，你可以将默认命名空间设置为任何你想要的值。\n\
  \n资源 ID 以默认命名空间开头，后跟句点，再后面是可能使用的文件夹名，然后是另一个句点和文件名。在本例中，资源 ID 是“BlackCat.Texts.TheBlackCat.txt”，你会在代码中看到它被传递给\
  \ `GetManifestResourceStream` 方法。该方法返回一个 .NET `Stream` 对象，可以从中创建 `StreamReader`\
  \ 来读取文本行。\n\n最好对从 `GetManifestResourceStream` 返回的 `Stream` 对象和 `StreamReader` 对象使用\
  \ `using` 语句，因为这样可以在不再需要这些对象时正确地释放它们。\n\n出于布局目的，`BlackCatPage` 构造函数创建了两个 `StackLayout`\
  \ 对象：`mainStack` 和 `textStack`。文件的第一行（包含故事标题和作者）成为 `mainStack` 中加粗且居中的 `Label`；所有后续行都放入\
  \ `textStack`。`mainStack` 还包含一个带有 `textStack` 的 `ScrollView`。\n\n```\nclass BlackCatPage\
  \ : ContentPage\n{\n    public BlackCatPage()\n    {\n        StackLayout mainStack\
  \ = new StackLayout();\n        StackLayout textStack = new StackLayout\n      \
  \  {\n            Padding = new Thickness(5),\n            Spacing = 10\n```\n\n\
  \n\n\n```csharp\n};\n\n// Get access to the text resource.\nAssembly assembly =\
  \ this.GetType().GetTypeInfo().Assembly;\nstring resource = \"BlackCat.Texts.TheBlackCat.txt\"\
  ;\n\nusing (Stream stream = assembly.GetManifestResourceStream (resource))\n{\n\
  \    using (StreamReader reader = new StreamReader (stream))\n    {\n        bool\
  \ gotTitle = false;\n        string line;\n\n        // Read in a line (which is\
  \ actually a paragraph).\n        while (null != (line = reader.ReadLine()))\n \
  \       {\n            Label label = new Label\n            {\n                Text\
  \ = line,\n\n                // Black text for ebooks!\n                TextColor\
  \ = Color.Black\n            };\n\n            if (!gotTitle)\n            {\n \
  \               // Add first label (the title) to mainStack.\n                label.HorizontalOptions\
  \ = LayoutOptions.Center;\n                label.Font = Font.SystemFontOfSize(NamedSize.Medium,\n\
  \                    FontAttributes.Bold);\n\n                mainStack.Children.Add(label);\n\
  \                gotTitle = true;\n            }\n            else\n           \
  \ {\n                // Add subsequent labels to textStack.\n                textStack.Children.Add(label);\n\
  \            }\n        }\n    }\n}\n\n// Put the textStack in a ScrollView with\
  \ FillAndExpand.\nScrollView scrollView = new ScrollView\n{\n    Content = textStack,\n\
  \    VerticalOptions = LayoutOptions.FillAndExpand,\n    Padding = new Thickness(5,\
  \ 0)\n};\n\n// Add the ScrollView as a second child of mainStack.\nmainStack.Children.Add(scrollView);\n\
  \n// Set page content to mainStack.\n```\n\n```csharp\nChildren =\n{\n    button,\n\
  \    new ScrollView\n    {\n        VerticalOptions = LayoutOptions.FillAndExpand,\n\
  \        Content = loggerLayout\n    }\n};\n}\n\nvoid OnButtonClicked(object sender,\
  \ EventArgs args)\n{\n    // Add Label to scrollable StackLayout.\n    loggerLayout.Children.Add(new\
  \ Label\n    {\n        Text = \"Button clicked at \" + DateTime.Now.ToString(\"\
  T\")\n    });\n}\n```\n\n本书中的程序中，事件处理程序的名称以单词 On 开头，其后是触发事件的视图的某种标识，有时只是视图类型，然后是事件名称。在本例中得到的名称是\
  \ OnButtonClicked。\n\nClicked 处理程序在 Button 创建后立即附加到 Button：\n\n```csharp\nbutton.Clicked\
  \ += OnButtonClicked;\n```\n\n然后组装页面。请注意，ScrollView 的 VerticalOptions 设置为 FillAndExpand，这样它就可以与\
  \ Button 共享 StackLayout，同时仍然可见且可滚动。\n\n以下是几次点击后的显示：\n\n```csharp\naddButton = new\
  \ Button\n{\n    Text = \"Add\",\n    HorizontalOptions = LayoutOptions.CenterAndExpand\n\
  };\naddButton.Clicked += OnButtonClicked;\n\nremoveButton = new Button\n{\n    Text\
  \ = \"Remove\",\n    HorizontalOptions = LayoutOptions.CenterAndExpand,\n    IsEnabled\
  \ = false\n};\nremoveButton.Clicked += OnButtonClicked;\n\nthis.Padding = new Thickness(5,\
  \ Device.OnPlatform(20, 0, 0), 5, 0);\n\n// Assemble the page.\nthis.Content = new\
  \ StackLayout\n{\n    Children =\n    {\n        new StackLayout\n        {\n  \
  \          Orientation = StackOrientation.Horizontal,\n            Children =\n\
  \            {\n                addButton,\n                removeButton\n     \
  \       }\n        },\n\n        new ScrollView\n        {\n            VerticalOptions\
  \ = LayoutOptions.FillAndExpand,\n            Content = loggerLayout\n        }\n\
  \    }\n};\n}\n\nvoid OnButtonClicked(object sender, EventArgs args)\n{\n    Button\
  \ button = (Button)sender;\n\n    if (button == addButton)\n    {\n        // Add\
  \ Label to scrollable StackLayout.\n        loggerLayout.Children.Add(new Label\n\
  \        {\n            Text = \"Button clicked at \" + DateTime.Now.ToString(\"\
  T\")\n        });\n    }\n    else\n    {\n        // Remove topmost Label from\
  \ StackLayout\n        loggerLayout.Children.RemoveAt(0);\n    }\n    // Enable\
  \ \"Remove\" button only if children are present.\n    removeButton.IsEnabled =\
  \ loggerLayout.Children.Count > 0;\n}\n```\n\n两个按钮都设置了 HorizontalOptions 的值为 CenterAndExpand，这样它们就可以使用水平\
  \ StackLayout 在屏幕上很好地排列。\n\n请注意，当 Clicked 处理程序检测到 removeButton 时，它只是对 Children 属性调用\
  \ RemoveAt 方法。如果没有子项会发生什么？\n\n在该程序中不可能发生这种情况！应用程序开始时，removeButton 的 IsEnabled 属性被初始化为\
  \ false。当按钮以这种方式被禁用时，它看起来不可用，实际上也是不可用的。它不会触发 Clicked 事件。在 Clicked 处理程序的末尾，removeButton\
  \ 的 IsEnabled 属性仅在 loggerLayout 至少有一个子项时才设置为 true。\n\n这说明了一个很好的通用规则：如果你的代码需要确定按钮\
  \ Clicked 事件是否有效，那么最好通过将 IsEnabled 设置为 false 来完全防止无效的按钮点击。\n\n## 匿名事件处理程序\n\n如今许多\
  \ C# 程序员喜欢将小型事件处理程序定义为匿名 lambda 函数。这使得事件处理代码可以非常接近触发事件的对象的实例化和初始化，而不是文件中的其他位置。它还允许在事件处理程序中引用对象，而无需将这些对象存储为字段。\n\
  \n下面是一个名为 ButtonLambdas 的程序，它有一个显示数字的 Label 和两个按钮。一个按钮将数字加倍，另一个按钮将数字减半。通常数字和标签变量会保存为字段。但由于匿名事件处理程序是在构造函数中在这两个变量定义之后立即定义的，因此事件处理程序可以访问它们：\n\
  \n```csharp\nclass ButtonLambdasPage : ContentPage\n{\n    public ButtonLambdasPage()\n\
  \    {\n        // Number to manipulate.\n        double number = 1;\n\n       \
  \ // Create the Label for display.\n        Label label = new Label\n        {\n\
  \            Text = number.ToString(),\n            Font = Font.SystemFontOfSize(NamedSize.Large),\n\
  \            HorizontalOptions = LayoutOptions.Center,\n            VerticalOptions\
  \ = LayoutOptions.CenterAndExpand\n        };\n\n        // Create the first Button\
  \ and attach Clicked handler.\n        Button timesButton = new Button\n       \
  \ {\n            Text = \"Double\",\n            Font = Font.SystemFontOfSize(NamedSize.Large),\n\
  \            HorizontalOptions = LayoutOptions.CenterAndExpand\n        };\n   \
  \     timesButton.Clicked += (sender, args) =>\n        {\n            number *=\
  \ 2;\n            label.Text = number.ToString();\n        };\n\n        // Create\
  \ the second Button and attach Clicked handler.\n        Button divideButton = new\
  \ Button\n        {\n            Text = \"Half\",\n            Font = Font.SystemFontOfSize(NamedSize.Large),\n\
  \            HorizontalOptions = LayoutOptions.CenterAndExpand\n        };\n   \
  \     divideButton.Clicked += (sender, args) =>\n        {\n            number /=\
  \ 2;\n            label.Text = number.ToString();\n        };\n\n        // Assemble\
  \ the page.\n        this.Content = new StackLayout\n        {\n            Children\
  \ =\n            {\n                label,\n                new StackLayout\n  \
  \              {\n                    Orientation = StackOrientation.Horizontal,\n\
  \                    VerticalOptions = LayoutOptions.CenterAndExpand,\n        \
  \            Children =\n                    {\n                        timesButton,\n\
  \                        divideButton\n                    }\n                }\n\
  \            }\n        };\n    }\n}\n```\n\n与前一个程序一样，两个按钮共享一个水平 `StackLayout`：\n\
  \n![](img/c2d61d0459c51981af78607f1eef3d1c_85_0.png)\n\n将事件处理程序定义为匿名 lambda 函数的缺点是它们不能在多个视图之间共享。\n\
  \n## 使用 ID 区分视图\n\n在 **TwoButtons** 程序中，你看到了一种通过比较对象来区分视图并共享事件处理程序的技术。当需要区分的视图不是很多时，这种方法效果很好，但对于计算器程序来说将是糟糕的做法。\n\
  \n`Element` 类专门定义了类型为 `string` 的 `StyleId`，用于标识视图。将其设置为应用程序方便的值即可。你可以使用 `if` 和 `else`\
  \ 语句、`switch` 和 `case` 来测试这些值，或者使用 `Parse` 方法将字符串转换为数字或枚举成员。\n\n下面的程序不是计算器，但它是一个数字键盘，这肯定是计算器的一部分。该程序名为\
  \ **SimplestKeypad**，使用 `StackLayout` 来组织键的行和列。 （该程序的一个目的就是演示 `StackLayout` 并不是这项工作的合适工具！）\n\
  \n该程序创建了总共四个 `StackLayout` 实例。`mainStack` 为垂直方向；三个水平 `StackLayout` 对象排列九个非零数字按钮。为了简单起见，键盘采用电话排序而不是计算器排序：\n\
  \n```csharp\nclass SimplestKeypadPage : ContentPage\n{\n    Label displayLabel;\n\
  \    Button backspaceButton;\n```\n\n\n\n```csharp\npublic SimplestKeypadPage()\n\
  {\n    // Create a vertical stack for the entire keypad.\n    StackLayout mainStack\
  \ = new StackLayout\n    {\n        VerticalOptions = LayoutOptions.Center,\n  \
  \      HorizontalOptions = LayoutOptions.Center\n    };\n\n    // First row is the\
  \ Label.\n    displayLabel = new Label\n    {\n        Font = Font.SystemFontOfSize(NamedSize.Large),\n\
  \        VerticalOptions = LayoutOptions.Center,\n        XAlign = TextAlignment.End\n\
  \    };\n    mainStack.Children.Add(displayLabel);\n\n    // Second row is the backspace\
  \ Button.\n    backspaceButton = new Button\n    {\n        Text = \"\\\\u21E6\"\
  ,\n        Font = Font.SystemFontOfSize(NamedSize.Large),\n        IsEnabled = false\n\
  \    };\n    backspaceButton.Clicked += OnBackspaceButtonClicked;\n    mainStack.Children.Add(backspaceButton);\n\
  \n    // Now do the 10 number keys.\n    StackLayout rowStack = null;\n\n    for\
  \ (int num = 1; num <= 10; num++)\n    {\n        if ((num - 1) % 3 == 0)\n    \
  \    {\n            rowStack = new StackLayout\n            {\n                Orientation\
  \ = StackOrientation.Horizontal\n            };\n            mainStack.Children.Add(rowStack);\n\
  \        }\n\n        Button digitButton = new Button\n        {\n            Text\
  \ = (num % 10).ToString(),\n            Font = Font.SystemFontOfSize(NamedSize.Large),\n\
  \            StyleId = (num % 10).ToString()\n        };\n        digitButton.Clicked\
  \ += OnDigitButtonClicked;\n\n        // For the zero button, expand to fill horizontally.\n\
  \        if (num == 10)\n        {\n            digitButton.HorizontalOptions =\
  \ LayoutOptions.FillAndExpand;\n        }\n}\nrowStack.Children.Add(digitButton);\n\
  }\n\nthis.Content = mainStack;\n}\n\nvoid OnDigitButtonClicked(object sender, EventArgs\
  \ args)\n{\n    Button button = (Button)sender;\n    displayLabel.Text += (string)button.StyleId;\n\
  \    backspaceButton.IsEnabled = true;\n}\n\nvoid OnBackspaceButtonClicked(object\
  \ sender, EventArgs args)\n{\n    string text = displayLabel.Text;\n    displayLabel.Text\
  \ = text.Substring(0, text.Length - 1);\n    backspaceButton.IsEnabled = displayLabel.Text.Length\
  \ > 0;\n}\n}\n```\n\n十个数字键共享同一个 `Clicked` 处理程序。`StyleId` 属性表示与该键关联的数字，因此它可以附加到 `Label`\
  \ 显示的字符串上。`StyleId` 恰好与 `Button` 的 `Text` 属性相同，并且也可以使用 `Text` 属性，但通常情况下并没有那么方便。\n\
  \n退格 `Button` 在功能上足够不同，以至于需要它自己的 `Clicked` 处理程序，尽管肯定可以将这两种方法合并为一种，以利用它们共有的代码。\n\n\
  为了使键盘的尺寸稍大一些，所有文本都使用 `NamedSize.Large` 创建的 `Font` 对象。以下是 **KeypadStack** 程序的三种渲染效果：\n"
- "# 第 3 章\n## 构建应用：基础设施\n\n有时像这样的编程教程可能会在直接解决实际应用需求之前涵盖大量内容。本章和下一章试图避免这种常见问题。\n\n\
  这两个章节介绍了一个从头开始构建的实际应用程序。这不会是一个非常复杂的应用程序，但它可用且有用。该应用程序的名称是 **NoteTaker**，它允许你做笔记并保存它们。\n\
  \n每个笔记都是一些文本——任意多的文本——以及一个可选的标题。如果不指定标题，将从笔记的前几个词为你生成一个标题。\n\n当程序在下一章末尾最终完成时，它将具有以下主屏幕：\n\
  \n![](img/c2d61d0459c51981af78607f1eef3d1c_89_0.png)\n\n那是已创建笔记标题的可滚动列表。**New**\
  \ 按钮由加号符号表示，作为顶部或底部的工具栏项出现。点击该按钮，程序将导航到输入新笔记的页面：\n\n我们通过无知而斗争来获取知识和技能所带来的问题。\n\n\
  在本章中，**NoteTaker** 程序经历了六个不同的版本。它们编号为 1 到 6，但版本号更像是 0.1 到 0.6。在通过这六个版本增强此程序的过程中，会遇到以下主题：\n\
  \n- 用于编辑文本的 `Entry` 和 `Editor` 视图\n- 移动环境中的文件输入/输出（I/O）\n- 异步操作\n- 属性更改通知\n- 数据绑定\n\
  \n下一章将深入多页面架构、页面导航、用于显示项目集合的强大的 `ListView`，以及处理应用程序生命周期问题。\n\n### Version 1. The\
  \ Entry and Editor views\n\n**NoteTaker** 应用绝对需要一些文本输入。一些手机有物理键盘，但绝大多数仅限于虚拟屏幕键盘。当然，这些键盘因平台而异，并且通常也因文本输入类型而异。\n\
  \nXamarin.Forms 为获取文本输入定义了两个视图：\n\n- `Entry` 用于单行文本\n- `Editor` 用于多行文本\n\n`Entry`\
  \ 和 `Editor` 都派生自 `InputView`，后者派生自 `View`。\n\n所有三个平台都有适用于不同类型文本输入的各种虚拟键盘样式。例如，用于输入\
  \ URL 的键盘应与用于输入电话号码的键盘不同。因此，`InputView` 定义了一个名为 `Keyboard` 的属性，其类型为 `Keyboard`，该类定义了七个适用于不同键盘用途的静态只读\
  \ `Keyboard` 类型属性：\n\n- `Default`\n- `Text`\n- `Chat`\n- `Url`\n- `Email`\n\n`Entry`\
  \ 和 `Editor` 定义了 `Focused` 和 `Unfocused` 事件，用于发出获得和失去输入焦点的信号。`IsFocused` 属性指示特定视图当前是否具有输入焦点。程序可以通过在视图上调用\
  \ `Focus` 方法来尝试将焦点设置到特定视图。方法返回 `true` 如果焦点更改成功。这些与焦点相关的成员由 `Visual-Element` 定义，它是所有\
  \ UI 元素的基类，但它们实际上仅与 `Entry` 和 `Editor` 相关。\n\n`Entry` 和 `Editor` 都定义了 `Text` 属性，公开视图当前显示的文本。程序可以初始化此\
  \ `Text` 属性，然后允许用户编辑该文本。\n\n`Entry` 和 `Editor` 都定义了 `Completed` 事件，当用户发出编辑完成的信号时触发。这是程序访问\
  \ `Text` 属性并保存结果的绝佳机会。\n\n`Entry` 和 `Editor` 还定义了 `TextChanged` 事件，当 `Text` 属性更改时触发。记住\
  \ .NET `string` 对象是不可变的。`string` 对象在创建后本身不能更改。每当 `Entry` 或 `Editor` 的内容更改时，它都是一个全新的\
  \ `string` 对象，而不是一个修改过的 `string` 对象。`TextChanged` 事件可以成为应用程序按字符监控文本输入并在用户发出输入完成信号之前响应更改的宝贵手段。\n\
  \n你可能会认为 `Entry` 比 `Editor` 简单一些，因为它只处理单行文本。然而，`Entry` 有三个 `Editor` 没有的附加属性：\n\n\
  - `TextColor` — 一个 `Color` 值\n- `IsPassword` — 一个布尔值，导致字符被屏蔽\n- `Placeholder` —\
  \ 在 `Entry` 中出现的浅色文本，一旦用户开始输入就会消失。\n\n**NoteTaker** 程序需要一个页面，其中包含一个 `Entry` 用于用户输入笔记的标题，以及一个\
  \ `Editor` 用于输入笔记本身。对于此程序的第一个版本——称为 **NoteTaker1**——让我们不要做太多超出在页面上放置这两个视图以及用于标识的几个\
  \ `Label` 视图的事情。\n\n`Editor` 允许输入无限量的文本，并在内部实现滚动。正如你在上一章中用 `ScrollView` 发现的那样，与页面上的其他视图共享可滚动视图需要将\
  \ `VerticalOptions` 属性设置为 `LayoutOptions.FillAndExpand`。\n\n以下是 `NoteTaker1Page`\
  \ 类：\n\n```\nclass NoteTaker1Page : ContentPage\n{\n    public NoteTaker1Page()\n\
  \    {\n        this.Padding = new Thickness(10, Device.OnPlatform(20, 0, 0), 10,\
  \ 0);\n```\n\n\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_95_0.png)\n\n底部标注为 **Save**\
  \ 的 **按钮** 目前没有任何功能。这样的按钮无疑是用来将笔记保存到文件的。然而，要做到这一点，我们需要知道如何保存文件，以及稍后如何将它们重新加载回来。\n\
  \n文件输入/输出并未包含在 Xamarin.Forms API 中。然而，许多移动应用都需要一些文件 I/O，哪怕只是为了保存设置和临时数据。因此，文件 I/O\
  \ 可能是绕过 Xamarin.Forms API、并使用各个平台的编程接口来实现应用某些关键功能的最有力理由。\n\n## 版本 2：文件输入/输出\n\n\
  传统上，文件输入/输出是最基本的编程任务之一，但移动设备上的文件 I/O 与桌面端略有不同。在桌面上，用户和应用程序通常可以访问整个磁盘，磁盘上的文件按目录结构组织。在移动设备上，存在几个标准文件夹——例如图片或音乐——但特定于应用程序的数据通常被限制在私有存储区域内。\n\
  \n熟悉 .NET 的程序员知道，`System.IO` 命名空间包含了大多数标准文件 I/O 支持。这个命名空间中最重要的类可能是静态的 `File` 类，它不仅提供了一组创建新文件和打开现有文件的方法，还包含了一些能够在一次方法调用中完成整个文件读取或写入操作的方法。\n\
  \n例如，`File.WriteAllText` 方法有两个 `string` 类型的参数——一个文件名和文件内容。该方法会创建文件（必要时替换同名的现有文件），将内容写入文件，然后关闭文件。`File.ReadAllText`\
  \ 方法类似，但会将文件内容作为一个大的 `string` 对象返回。这些方法似乎非常适合保存和检索笔记的任务。\n\nXamarin.iOS 和 Xamarin.Android\
  \ 库中包含一个由 Xamarin 针对这两个移动平台专门定制的 .NET 版本。`System.IO` 命名空间中 `File` 类的方法映射到 iOS 和\
  \ Android 平台上相应的文件 I/O 函数。这意味着你可以在 iPhone 和 Android 应用程序中使用 `File` 类的方法——包括 `File.WriteAllText`\
  \ 和 `File.ReadAllText`。\n\n让我们稍作实验：\n\n进入 Visual Studio 或 Xamarin Studio，加载目前创建的任何\
  \ Xamarin.Forms 解决方案，例如 **NoteTaker1**。在 iOS 或 Android 项目中调出一个代码文件。在构造函数或方法中，键入\
  \ `System.IO` 命名空间名称，然后键入一个句点。你会看到该命名空间中所有可用类型的列表。如果你随后键入 `File` 并加上句点，你会看到 `File`\
  \ 类中的所有静态方法，包括 `WriteAllText` 和 `ReadAllText`。\n\n然而，在 Windows Phone 项目中，你使用的是由\
  \ Microsoft 创建并针对 Windows Phone 平台进行了精简的 .NET 版本。如果你键入 `System.IO.File` 并加上句点，你会看到一个相当精简的\
  \ `File` 类，它并*不*包含 `WriteAllText` 和 `ReadAllText`，尽管它确实包含创建和打开文本文件的方法。\n\n现在，进入\
  \ Xamarin.Forms 可移植类库项目中的任何代码文件，键入 `System.IO` 并加上句点。现在你甚至看不到 `File` 类！它在 PCL 中不存在。这是为什么？PCL\
  \ 被配置为支持多个目标平台。PCL 中实现的 API 必然是这些目标平台 API 的交集。\n\n适用于 Xamarin.Forms 的 PCL 包含以下平台：\n\
  \n- .NET Framework 4.5\n- Windows 8\n- Windows Phone Silverlight 8\n- Xamarin.Android\n\
  - Xamarin.iOS\n\n注意其中包含了 Windows 8，它引入了一个名为 Windows Runtime（或 WinRT）的 API。Microsoft\
  \ 为 WinRT 彻底改造了文件 I/O，并创建了一套全新的文件 I/O API。`System.IO.File` 类在 PCL 中不存在，因为它不是 WinRT\
  \ 的一部分。\n\n尽管 `File` 类在可移植类库项目中不存在，但你可能会想知道在共享资产项目中可以使用哪种 `File` 类。嗯，这取决于编译的目标平台是什么。你可以在\
  \ iOS 和 Android 项目中使用 `File.WriteAllText` 和 `File.ReadAllText`，但不能在 Windows Phone\
  \ 项目中使用。你的 Windows Phone 项目需要其他方式。\n\n### 跳过可怕的部分？\n\n你可能已经怀疑文件 I/O 这个话题会变得棘手，你是对的。但想想我们在这里试图做什么：我们试图用公共代码库针对三个不同的移动平台。这并不容易，而且我们在前进过程中必定会遇到一些崎岖的地形。\n\
  \n所以问题必须是：打个比方说，你喜欢穿越险恶的地形徒步攀登山顶，欣赏壮丽的景色吗？还是更希望有人从山顶拍照并通过电子邮件发送给你？\n\n如果你属于后一类，你可能会更倾向于跳过本章的大部分内容，直接跳到本章末尾以及下一章中给出的相对简单优雅的\
  \ Xamarin.Forms 文件 I/O 解决方案。在此之前，你将遇到的一些过渡代码既可怕又难看。\n\n如果你选择走这条上山的长路，你会明白为什么这段旅程是必要的，也会理解平台差异背后的基本原理——即使在像文件\
  \ I/O 这样的日常工作中也是如此。\n\n在上一章中，你看到了 Xamarin.Forms 的 Device 类如何成为处理平台差异的宝贵工具。但 Device\
  \ 类引用的代码必须在所有三个平台上都可编译。文件 I/O 的情况并非如此，因为不同平台可以访问不同的 API。这意味着平台差异无法使用 Device 类来管理，必须通过其他方式处理。此外，共享资产项目和可移植类库项目的解决方案也不同。\n\
  \n因此，对于接下来两个版本的 NoteTaker，SAP 和 PCL 将有单独的解决方案。版本 2 的两个不同解决方案分别命名为 NoteTaker2Sap\
  \ 和 NoteTaker2Pcl。\n\n### SAP 中的预处理\n\n在共享资产项目中处理平台差异比 PCL 更直接一些，并且涉及更传统的编程工具，所以让我们从那里开始。\n\
  \n在共享资产项目的代码文件中，你可以使用 C# 预处理指令 `#if`、`#elif`、`#else` 和 `#endif`，以及为三个平台定义的条件编译符号。这些符号是用于\
  \ iOS 的 `__IOS__` 和用于 Windows Phone 的 `WINDOWS_PHONE`；Android 没有条件编译符号，但 Android\
  \ 可以被识别为既不是 iOS 也不是 Windows Phone。\n\nNoteTaker2Sap 项目在 `FileHelper.cs` 文件中包含一个名为\
  \ `FileHelper` 的类。你可以像为派生自 `ContentPage` 的类添加新文件一样，将这样的文件添加到项目中。\n\n`FileHelper.cs`\
  \ 文件使用 C# 预处理指令将代码分为两个部分。第一部分适用于 iOS 和 Android，并且在没有定义 `WINDOWS_PHONE` 标识符时编译。第二部分适用于\
  \ Windows Phone。\n\n两个部分都包含三个公共静态方法，名为 `Exists`、`WriteAllText` 和 `ReadAllText`。在第一部分中，这些函数的\
  \ iOS 和 Android 版本使用标准静态 `File` 方法，但使用从 `Environment.GetFolderPath` 方法获取的文件夹名称，参数为\
  \ `Environment.SpecialFolder.MyDocuments`：\n\n```\nnamespace NoteTaker2Sap\n{\n\
  \    static class FileHelper\n    {\n#if !WINDOWS_PHONE // iOS and Android\n   \
  \     public static bool Exists(string filename)\n        {\n            string\
  \ filepath = GetFilePath(filename);\n            return File.Exists(filepath);\n\
  \        }\n\n        public static void WriteAllText(string filename, string text)\n\
  \        {\n            string filepath = GetFilePath(filename);\n            File.WriteAllText(filepath,\
  \ text);\n        }\n\n        public static string ReadAllText(string filename)\n\
  \        {\n            string filepath = GetFilePath(filename);\n            return\
  \ File.ReadAllText(filepath);\n        }\n\n        static string GetFilePath(string\
  \ filename)\n        {\n            string docsPath = Environment.GetFolderPath(Environment.SpecialFolder.MyDocuments);\n\
  \            return Path.Combine(docsPath, filename);\n        }\n\n#else // Windows\
  \ Phone\n        public static bool Exists(string filename)\n        {\n       \
  \     return File.Exists(filename);\n        }\n\n        public static void WriteAllText(string\
  \ filename, string text)\n        {\n            StreamWriter writer = File.CreateText(filename);\n\
  \            writer.Write(text);\n            writer.Close();\n        }\n\n   \
  \     public static string ReadAllText(string filename)\n        {\n           \
  \ StreamReader reader = File.OpenText(filename);\n            string text = reader.ReadToEnd();\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```csharp\nreader.Close();\nreturn text;\n\
  }\n\n#endif\n\n}\n}\n```\n\n当共享资产项目针对 Windows Phone 编译时，`File.WriteAllText` 和 `File.ReadAllText`\
  \ 方法并不存在，因此这些方法不能出现在 Windows Phone 代码部分。不过，静态的 CreateText 和 OpenText 方法是可用的，可以用来获取\
  \ StreamWriter 和 StreamReader 对象。这段 Windows Phone 代码在“不会引发异常”这个意义上可以工作，但你很快会看到，它实际上达不到你想要的效果。还需要其他方式。\n\
  \n除了处理底层文件 I/O 的 FileHelper 类之外，NoteTaker2Sap 项目还包含另一个名为 Note 的新类。这个类将一条笔记关联的两个字符串对象封装在名为\
  \ Title 和 Text 的简单读写属性中。这个类还包含名为 Save 和 Load 的方法，它们调用 FileHelper 中的相应方法：\n\n```csharp\n\
  namespace NoteTaker2Sap\n{\n    class Note\n    {\n        public string Title {\
  \ set; get; }\n\n        public string Text { set; get; }\n\n        public void\
  \ Save(string filename)\n        {\n            string text = this.Title + \"\\\
  n\" + this.Text;\n            FileHelper.WriteAllText(filename, text);\n       \
  \ }\n\n        public void Load(string filename)\n        {\n            string\
  \ text = FileHelper.ReadAllText(filename);\n\n            // Break string into Title\
  \ and Text.\n            int index = text.IndexOf('\\n');\n            this.Title\
  \ = text.Substring(0, index);\n            this.Text = text.Substring(index + 1);\n\
  \        }\n    }\n}\n```\n\n请注意，Save 方法只是用换行符把两个字符串对象连接成一个字符串，而 Load 方法再把它们分开。\n\
  \n最后，NoteTaker2SapPage 类的页面布局与第一个程序非常相似，但它包含两个分别标记为 Save 和 Load 的按钮，并使用 Note 类来执行这些操作。整个过程中使用的文件名是“test.note”：\n\
  \n```csharp\nclass NoteTaker2SapPage : ContentPage\n{\n    static readonly string\
  \ FILENAME = \"test.note\";\n\n    Entry entry;\n    Editor editor;\n    Button\
  \ loadButton;\n\n    public NoteTaker2SapPage()\n    {\n        // Create Entry\
  \ and Editor views.\n        entry = new Entry\n        {\n            Placeholder\
  \ = \"Title (optional)\"\n        };\n\n        editor = new Editor\n        {\n\
  \            Keyboard = Keyboard.Create(KeyboardFlags.All),\n            BackgroundColor\
  \ = Device.OnPlatform(Color.Default,\n                                         \
  \       Color.Default,\n                                                Color.White),\n\
  \            VerticalOptions = LayoutOptions.FillAndExpand\n        };\n\n     \
  \   // Create Save and Load buttons.\n        Button saveButton = new Button\n \
  \       {\n            Text = \"Save\",\n            HorizontalOptions = LayoutOptions.CenterAndExpand\n\
  \        };\n        saveButton.Clicked += OnSaveButtonClicked;\n\n        loadButton\
  \ = new Button\n        {\n            Text = \"Load\",\n            IsEnabled =\
  \ FileHelper.Exists(FILENAME),\n            HorizontalOptions = LayoutOptions.CenterAndExpand\n\
  \        };\n        loadButton.Clicked += OnLoadButtonClicked;\n\n        // Assemble\
  \ page.\n        this.Padding = new Thickness(10, Device.OnPlatform(20, 0, 0), 10,\
  \ 0);\n\n        this.Content = new StackLayout\n        {\n            Children\
  \ =\n            {\n                new Label\n                {\n             \
  \       Text = \"Title:\"\n                },\n                entry,\n        \
  \        new Label\n                {\n                    Text = \"Note:\"\n  \
  \              },\n                editor,\n                new StackLayout\n  \
  \              {\n                    Orientation = StackOrientation.Horizontal,\n\
  \                    Children =\n                    {\n                       \
  \ saveButton,\n                        loadButton\n                    }\n     \
  \           }\n            }\n        };\n    }\n\n    void OnSaveButtonClicked(object\
  \ sender, EventArgs args)\n    {\n        Note note = new Note\n        {\n    \
  \        Title = entry.Text,\n            Text = editor.Text\n        };\n     \
  \   note.Save(FILENAME);\n        loadButton.IsEnabled = true;\n    }\n\n    void\
  \ OnLoadButtonClicked(object sender, EventArgs args)\n    {\n        Note note =\
  \ new Note();\n        note.Load(FILENAME);\n        entry.Text = note.Title;\n\
  \        editor.Text = note.Text;\n    }\n}\n```\n\n请注意，Load 按钮的初始化会调用 FileHelper.Exists\
  \ 来判断文件是否存在；如果文件不存在，则禁用该按钮。之后，当文件第一次被保存时，该按钮会被启用。\n\n你大概需要亲自确认一下这确实有效——也就是说，信息真的被保存到了设备（或手机模拟器）上。在\
  \ Entry 和 Editor 中输入一些内容，然后按 Save 保存这些信息。清空 Entry 和 Editor（或输入新文本），再按 Load 恢复已保存的信息。\n\
  \n下面这一点很重要：如果你终止程序或关闭手机，然后重新运行程序，保存的文件仍然存在。\n\n嗯，在三种平台中的两种平台下，保存的文件仍然存在。它在 iOS 和\
  \ Android 上有效，但在 Windows Phone 上无效。尽管 Windows Phone 的 Save 和 Load 按钮似乎能正常工作，而\n\n\
  ```csharp\n[assembly: Dependency(typeof(NoteTaker2Pcl.iOS.FileHelper))]\n\nnamespace\
  \ NoteTaker2Pcl.iOS\n{\n    class FileHelper : IFileHelper\n    {\n        public\
  \ bool Exists(string filename)\n        {\n            string filepath = GetFilePath(filename);\n\
  \            return File.Exists(filepath);\n        }\n\n        public void WriteAllText(string\
  \ filename, string text)\n        {\n            string filepath = GetFilePath(filename);\n\
  \            File.WriteAllText(filepath, text);\n        }\n\n        public string\
  \ ReadAllText(string filename)\n        {\n            string filepath = GetFilePath(filename);\n\
  \            return File.ReadAllText(filepath);\n        }\n\n        string GetFilePath(string\
  \ filename)\n        {\n            string docsPath = Environment.GetFolderPath(\n\
  \                Environment.SpecialFolder.MyDocuments);\n            return Path.Combine(docsPath,\
  \ filename);\n        }\n    }\n}\n```\n\n这些方法的实际实现与你已经见过的代码相同，只不过用实例方法代替了静态方法。但请注意该文件的两个必要特征：\n\
  \n- 该类实现了 PCL 中定义的 IFileHelper 接口。因为它实现了该接口，所以接口中定义的三个方法必须在此类中声明为 public。\n- 在命名空间定义之前，声明了一个名为\
  \ Dependency 的特殊程序集级特性。\n\nDependency 是一个特殊的 Xamarin.Forms 特性，由 DependencyAttribute\
  \ 类定义，专门用于 DependencyService 类。Dependency 特性只指定类的类型，但它会帮助 DependencyService 类在应用程序项目中定位接口的实现。\n\
  \nAndroid 项目中也有一个类似的文件：\n\n```csharp\nusing System;\nusing System.IO;\nusing Xamarin.Forms;\n\
  \n[assembly: Dependency(typeof(NoteTaker2Pcl.Droid.FileHelper))]\n\nnamespace NoteTaker2Pcl.Droid\n\
  {\n    class FileHelper : IFileHelper\n    {\n        public bool Exists(string\
  \ filename)\n        {\n            string filepath = GetFilePath(filename);\n \
  \           return File.Exists(filepath);\n        }\n\n        public void WriteAllText(string\
  \ filename, string text)\n        {\n            string filepath = GetFilePath(filename);\n\
