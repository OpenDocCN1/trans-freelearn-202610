  \ StackLayout\n{\n```\n\n两个对象属性的同步，使得对一个属性的更改会自动触发对另一个属性的更改。\n\n## 简化 INotifyPropertyChanged\
  \ 类\n\n实现 `INotifyPropertyChanged` 的类通常比 `Note` 类具有更多可更改的属性。因此，最好简化 set 访问器，以避免混淆属性和字段名称，或拼写错误属性名称文本。\n\
  \n一种简化方法是将事件的实际触发封装在受保护的虚方法中：\n\n```csharp\nprotected virtual void OnPropertyChanged(string\
  \ propertyName)\n{\n    if (PropertyChanged != null)\n    {\n        PropertyChanged(this,\
  \ new PropertyChangedEventArgs(propertyName));\n    }\n}\n```\n\n现在 `Title` 属性看起来像这样：\n\
  \n```csharp\npublic string Title\n{\n    set\n    {\n        if (title != value)\n\
  \        {\n            title = value;\n            OnPropertyChanged(\"Title\"\
  );\n        }\n    }\n    get\n    {\n        return title;\n    }\n}\n```\n\n`OnPropertyChanged`\
  \ 方法被设为 protected 和 virtual，因为你可能会编写一个增强的 `Note` 类，从此 `Note` 类派生但包含更多属性。派生类需要访问此方法。\n\
  \n但让我们暂停一下来改进我们的 `INotifyPropertyChanged` 处理。建议先获取处理程序，然后对同一个对象执行空值检查和事件调用：\n\n\
  ```csharp\nprotected virtual void OnPropertyChanged(string propertyName)\n{\n  \
  \  PropertyChangedEventHandler handler = PropertyChanged;\n    if (handler != null)\n\
  \        handler(this, new PropertyChangedEventArgs(propertyName));\n}\n```\n\n\
  在多线程环境中，`PropertyChanged` 处理程序可能在空值检查和调用之间被分离，此代码可防止空引用异常的发生。\n\n你可以在简化 `OnPropertyChanged`\
  \ 方法方面更进一步。C# 5.0 引入了对 `CallerMemberNameAttribute` 的支持以及一些相关属性。此属性允许你用调用方法或属性的名称替换可选的方法参数。\n\
  \n在 `OnPropertyChanged` 方法中，通过将其赋值为 null 使参数可选，并在其前面加上方括号中的 `CallerMemberName`：\n\
  \n```csharp\nprotected virtual void OnPropertyChanged([CallerMemberName] string\
  \ propertyName = null)\n{\n    PropertyChangedEventHandler handler = PropertyChanged;\n\
  \    if (handler != null)\n        handler(this, new PropertyChangedEventArgs(propertyName));\n\
  }\n```\n\n你需要为该属性添加 `System.Runtime.CompilerServices` 的 using 指令。现在 `Title` 属性可以不带参数调用\
  \ `OnPropertyChanged`，并且 `propertyName` 参数将自动设置为属性名称 “Title”，因为 `OnPropertyChanged`\
  \ 的调用源自此处：\n\n```csharp\npublic string Title\n{\n    set\n    {\n        if (title\
  \ != value)\n        {\n            title = value;\n            OnPropertyChanged();\n\
  \        }\n    }\n    get\n    {\n        return title;\n    }\n}\n```\n\n这避免了可能拼写错误的文本属性名称，并在程序开发过程中更改属性名称时无需担心同时更改文本字符串。`CallerMemberName`\
  \ 被发明的主要原因之一就是为了简化实现 `INotifyPropertyChanged` 的类。\n\n还可以更进一步。你需要定义一个名为 `SetProperty`\
  \ 的泛型方法，例如，并为其添加 `CallerMemberName` 属性，但需要将其从 `OnPropertyChanged` 中移除：\n\n```csharp\n\
  bool SetProperty<T>(ref T storage, T value, [CallerMemberName] string propertyName\
  \ = null)\n{\n    if (Object.Equals(storage, value))\n        return false;\n\n\
  \    storage = value;\n    OnPropertyChanged(propertyName);\n    return true;\n\
  }\n\nprotected virtual void OnPropertyChanged(string propertyName)\n{\n    PropertyChangedEventHandler\
  \ handler = PropertyChanged;\n    if (handler != null)\n        handler(this, new\
  \ PropertyChangedEventArgs(propertyName));\n}\n```\n\n`SetProperty` 方法需要访问 backing\
  \ field 和新值，但会自动完成其余过程，并在属性被更改时返回 true。 （如果你在 set 访问器中执行一些额外的处理，可能需要使用此返回值。）现在 `Title`\
  \ 属性看起来像这样：\n\n```csharp\npublic string Title\n{\n    set\n    {\n        SetProperty(ref\
  \ title, value);\n    }\n    get\n    {\n        return title;\n    }\n}\n```\n\n\
  尽管 `SetProperty` 是一个泛型方法，但 C# 编译器可以从参数中推断出类型。整个属性定义变得如此简短，你可以在单行上简洁地编写访问器，而不会掩盖操作：\n\
  \n```csharp\npublic string Title\n{\n    set { SetProperty(ref title, value); }\n\
  \    get { return title; }\n}\n```\n\n以下是 PCL 项目 `NoteTaker5` 中的新 `Note` 类：\n\n\
  ```csharp\nclass Note : INotifyPropertyChanged\n{\n    string title, text;\n\n \
  \   public event PropertyChangedEventHandler PropertyChanged;\n\n    public string\
  \ Title\n    {\n        set { SetProperty(ref title, value); }\n        get { return\
  \ title; }\n    }\n\n    public string Text\n    {\n```\n\n```csharp\nentry.TextChanged\
  \ += (sender, args) =>\n{\n    note.Title = args.NewTextValue;\n};\n```\n\n你可以通过为\
  \ Entry 视图的 `PropertyChanged` 事件安装处理程序并检查 `Text` 属性来做几乎相同的事情：\n\n```csharp\nentry.PropertyChanged\
  \ += (sender, args) =>\n{\n    if (args.PropertyName == \"Text\")\n        note.Title\
  \ = entry.Text;\n};\n```\n\n从某种意义上说，Entry 和 Editor 定义的 `TextChanged` 事件是多余且不必要的。它仅为了程序员的方便而提供。\n\
  \nXamarin.Forms 中的许多类由于派生自实现此接口的名为 `BindableObject` 的类而自动实现 `INotifyPropertyChanged`。`BindableObject`\
  \ 还定义了一个受保护的虚方法 `OnPropertyChanged`。\n\n顾名思义，`BindableObject` 对 Xamarin.Forms 中的数据绑定支持很重要，但该类对\
  \ `INotifyPropertyChanged` 的实现只是故事的一部分，而且坦率地说，是较容易的部分。\n\n让我们通过一些实验开始探索 `BindableObject`\
  \ 的更神秘的部分。在 `NoteTaker` 程序的早期版本之一中，尝试使用一些文本初始化 Entry 视图：\n\n```csharp\nentry.Text\
  \ = \"This is some text\";\n```\n\n现在当你运行程序时，Entry 会用此文本初始化。但现在尝试用此方法调用替换该属性设置：\n\
  \n```csharp\nentry.SetValue(Entry.TextProperty, \"This is some text\");\n```\n\n\
  这同样有效。这两个语句在功能上是相同的。\n\n看看传递给 `SetValue` 的那个奇怪的第一个参数：它被称为 `Entry.TextProperty`，表明它是静态的，但它根本不是属性。它是\
  \ Entry 类的一个静态字段。它也是只读的，并且在 Entry 类中定义如下：\n\n```csharp\npublic static readonly BindableProperty\
  \ TextProperty;\n```\n\n一个类的字段被命名为 `TextProperty` 有点奇怪，但事实就是如此。然而，由于它是静态的，它独立于可能存在或不存在的任何\
  \ Entry 对象而存在。\n\n如果你查看 Entry 类的文档，你会看到它定义了四个属性——`Text`、`TextColor`、`IsPassword`\
  \ 和 `Placeholder`——你还会看到四个对应的公共静态只读 `BindableProperty` 类型字段，名称为 `TextProperty`、`TextColorProperty`、`IsPasswordProperty`\
  \ 和 `PlaceholderProperty`。\n\n\n\n\n这些属性和字段密切相关。实际上，在 Entry 类内部，Text 属性是这样定义的：\n\
  \n```\npublic string Text\n{\n    set { SetValue(Entry.TextProperty, value); }\n\
  \    get { return (string)GetValue(Entry.TextProperty); }\n}\n```\n\n所以你明白了，应用程序对\
  \ Entry.TextProperty 调用 SetValue 与设置 Text 属性完全等价，而且也许还会快那么一点点！\n\nEntry 中 Text 属性的内部定义并不是秘密信息。这是标准代码。SetValue\
  \ 和 GetValue 方法由 BindableObject 定义，这个类也为许多 Xamarin.Forms 类实现了 INotifyPropertyChanged。维护\
  \ Text 属性的所有实际工作都发生在这些 SetValue 和 GetValue 调用中。GetValue 方法需要强制转换，因为它被定义为返回 object。\n\
  \n静态的 Entry.TextProperty 对象的类型是 BindableProperty，你可能会正确地推测它是与 BindableObject 相关的类，但重要的是要在心中区分它们：BindableObject\
  \ 是许多 Xamarin.Forms 类派生自的类，并为 BindableProperty 类型的对象提供支持。\n\nBindableProperty 对象有效地扩展了标准\
  \ C# 属性的功能。可绑定属性提供了系统化的方式来：\n\n- 定义属性\n- 为属性提供默认值\n- 存储它们的当前值\n- 提供验证属性值的机制\n- 在单个类中维护相关属性之间的一致性\n\
  - 响应属性更改\n- 在属性即将更改和已更改时触发通知\n\n此外，BindableObject 和 BindableProperty 还为动画和数据绑定提供机制。它们是\
  \ Xamarin.Forms 基础设施的重要组成部分。\n\n名为 Text 的属性与名为 TextProperty 的 BindableProperty 之间的紧密关系，体现在程序员谈论这些属性的方式上：有时程序员会说\
  \ Text 属性“由”名为 TextProperty 的 BindableProperty“支撑”，因为 TextProperty 为 Text 属性提供基础设施支持。但一种常见的简便说法是，Text\
  \ 本身就是一个“可绑定属性”，通常没有人会感到困惑。\n\n并非每个 Xamarin.Forms 属性都是可绑定属性。ContentPage 的 Content\
  \ 属性和 `Layout<T>`（StackLayout 派生自它）的 Children 属性都不是可绑定属性。有时对非可绑定属性的更改会触发 PropertyChanged\
  \ 事件，但这并不能保证。只有可绑定属性才能保证触发 PropertyChanged 事件。\n\n在本书后面，你将看到如何定义自己的可绑定属性。\n\n##\
  \ 自动数据绑定\n\n正如你所见，可以在 Entry 和 Editor 上安装事件处理程序来确定 Text 属性何时更改，并利用这一时机设置 Note 类的\
  \ Title 和 Text 属性。类似地，你可以使用 Note 类的 PropertyChanged 事件来保持 Entry 和 Editor 的更新。\n\n\
  换句话说，NoteTaker4 程序将对象和属性配对，使它们互相跟踪彼此的值。当一个属性更改时，另一个也会更新。\n\n事实证明，这类任务非常常见，这就是 Xamarin.Forms\
  \ 允许使用一种称为数据绑定的技术来自动化此类任务的原因。\n\n数据绑定涉及源和目标。源是发生变化的对象和属性，目标是随之被更改的对象和属性。但这是一种简化。虽然在任何特定数据绑定中，目标和源之间的区别都有明确定义，但有时这些属性会以不同方式相互影响：有时目标会促使源更新，有时源和目标会相互更新。\n\
  \nXamarin.Forms 中的数据绑定机制使用 PropertyChanged 事件来确定源属性何时已更改。因此，数据绑定中使用的源属性必须是实现了 INotifyPropertyChanged\
  \ 的类的一部分（直接实现或通过继承实现），并且当该属性更改时，该类必须触发 PropertyChanged 事件。（实际上这并不完全正确：如果源属性从不更改，数据绑定要工作并不需要\
  \ PropertyChanged 事件，但这只是一种“一次性”数据绑定，没什么意思。）\n\n数据绑定的目标属性必须由 BindableProperty 支持。正如你将看到的，这一要求是由数据绑定的编程接口强制的。你不能在未引用\
  \ BindableProperty 对象的情况下设置数据绑定！\n\n在 NoteTaker5 程序中，Entry 和 Editor 的 Text 属性是绑定目标，因为它们由名为\
  \ TextProperty 的可绑定属性支持。Note 类的 Title 和 Text 属性是绑定源。Note 类实现了 INotifyPropertyChanged，因此当这些源属性更改时会触发\
  \ PropertyChanged 事件。\n\n你可以用两个语句定义一个数据绑定，使目标属性随着源属性的值保持更新：第一条语句通过将目标对象的 BindingContext\
  \ 属性设置为源对象，将两个对象关联起来。在本例中，源对象是 Note 类的实例：\n\n在内部，这四个语句会设置类似的事件处理程序。数据绑定机制就是这样工作的。\n\
  \n然而，这四个语句实际上可以减少到三个语句。方法如下：\n\nBindingContext 属性有一个非常特殊的特性。一个页面上的多个数据绑定很可能共享同一个\
  \ BindingContext。这个小例子就是如此。因此，BindingContext 属性会通过页面的可视化树进行传播。换句话说，如果你在页面上设置 BindingContext，它会传播到该页面上的所有视图，但那些将自己的\
  \ BindingContext 属性设置为其他值的视图除外。你可以在 StackLayout 上设置 BindingContext，它将传播到该 StackLayout\
  \ 的所有子级（及其他后代）。上面显示的两个 BindingContext 设置可以替换为在页面本身上设置一个：\n\n```\nthis.BindingContext\
  \ = note;\n```\n\n这些自动数据绑定是 NoteTaker5Page 类的一部分。此外，Load 和 Save 按钮的处理程序已变成 lambda\
  \ 函数，所有变量都已移到构造函数中，代码此刻看起来相当简洁：\n\n```\nclass NoteTaker5Page : ContentPage\n{\n\
  \    static readonly string FILENAME = \"test.note\";\n\n    public NoteTaker5Page()\n\
  \    {\n        // Create Entry and Editor views.\n        Entry entry = new Entry\n\
  \        {\n            Placeholder = \"Title (optional)\"\n        };\n\n     \
  \   Editor editor = new Editor\n        {\n            Keyboard = Keyboard.Create(KeyboardFlags.All),\n\
  \            BackgroundColor = Device.OnPlatform(Color.Default,\n              \
  \  Color.Default,\n                Color.White),\n            VerticalOptions =\
  \ LayoutOptions.FillAndExpand\n        };\n\n        // Set data bindings.\n   \
  \     Note note = new Note();\n        this.BindingContext = note;\n        entry.SetBinding(Entry.TextProperty,\
  \ \"Title\");\n        editor.SetBinding(Editor.TextProperty, \"Text\");\n\n   \
  \     // Create Save and Load buttons.\n        Button saveButton = new Button\n\
  \        {\n            Text = \"Save\",\n            HorizontalOptions = LayoutOptions.CenterAndExpand\n\
  ```\n\n通过用数据绑定替换显式事件处理程序，我们也成功忘掉了 Note 类中 PropertyChanged 事件从辅助线程触发的问题。使用数据绑定时，你不必担心这一点。\n\
  \n最终，NoteTaker 应用程序将不再处理单个 Note 对象，而是拥有一个 Note 对象集合。有了这些数据绑定，你可以通过将任意一个 Note 对象设置为页面的\
  \ BindingContext 来查看和编辑它。不过这要等到下一章。\n\n与此同时，让我们看看是否能进一步简化这个页面代码。一个主要的候选是那些基于 FileHelper.Exists\
  \ 调用来启用 Load 按钮的代码。也许解决这个问题还会简化程序的其他一些部分。\n\n## 版本 6：等待结果\n\n正如你所见，异步操作可能难以管理。有时代码执行的顺序与你预期的不同，需要花些心思才能弄清楚发生了什么。异步编程可能永远都不会像单线程编码那样简单，但\
  \ 2012 年发布的 C# 5.0 已经缓解了处理异步操作的部分困难。C# 5.0 引入了一种革命性的变化，改变了程序员处理异步操作的方式。这一变化由一个名为\
  \ async 的关键字和一个名为 await 的操作符组成。\n\nasync 关键字主要用于向后兼容。而 await 操作符才是重头戏。它让程序员可以像处理相对普通的命令式编程语句一样处理异步函数，而无需使用回调方法。\n\
  \n让我们看一个可能出现在 Windows Phone 8 程序中的异步方法的通用用法。你的程序中有一个方法，它调用操作系统中的异步方法，并设置一个实现为单独方法的\
  \ Completed 处理程序。注释表示该方法中可能出现的一些其他代码：\n\n```\nvoid SomeMethod()\n{\n    // Often\
  \ some initialization code\n    IAsyncOperation<SomeType> asyncOp = sysClass.LongJobAsync(...);\n\
  \    // Some additional code\n    asyncOp.Completed = MyCompletedHandler;\n    //\
  \ And perhaps still more code\n}\n```\n\n设置 Completed 属性的语句会快速返回，而实际的异步操作在后台继续运行。SomeMethod\
  \ 中的所有代码都会在回调方法被调用之前执行。如果你选择忽略后台过程中遇到的取消或错误，Completed 处理程序可能如下所示：\n\n```\nvoid MyCompletedHandler(IAsyncOperation<SomeType>\
  \ op, AsyncStatus status)\n```\n\n变量。\n\n如果你能组织代码，消除标记为“一些附加代码”和“也许还有更多代码”的两条注释，那么你可以跳过对\
  \ `IAsyncOperation` 对象的赋值，直接获取结果：\n\n```csharp\nasync void SomeMethod()\n{\n   \
  \ // Often some initialization code\n    SomeType myResult = await sysClass.LongJobAsync(...);\n\
  \    // Code using the result of the asynchronous operation\n}\n```\n\n这就是 `await`\
  \ 的惯用方式——作为异步运行的方法与保存结果的赋值语句之间的运算符。\n\n别被 `await` 运算符的名字骗了！代码实际上并不是在那里等待。`SomeMethod`\
  \ 方法会返回，处理器可以自由运行其他代码。只有当异步操作完成时，`SomeMethod` 中的代码才会从它停下的地方继续执行。\n\n当然，每当我们处理文件\
  \ I/O 时，都应该做好应对问题的准备。如果文件不存在，或者存储空间不足，会发生什么？即使没有问题发生，有时错误结果也是正常的：Windows Phone 版本的\
  \ `Exists` 方法使用 `Completed` 处理程序中报告的错误来确定文件是否存在。那么，使用 `await` 时如何处理错误呢？\n\n如果你使用\
  \ `await` 执行遇到错误或被取消的异步操作，`await` 会抛出异常。如果你需要处理错误或取消，可以将 `await` 运算符放在 `try`/`catch`\
  \ 块中，看起来像这样：\n\n```csharp\nSomeType myResult = null;\ntry\n{\n    myResult = await\
  \ sysClass.LongJobAsync(...);\n}\ncatch (OperationCanceledException)\n{\n    //\
  \ handle a cancellation\n}\ncatch (Exception exc)\n{\n    // handle an error\n}\n\
  ```\n\n现在让我们在一些实际代码中使用 `await`。下面是 NoteTaker5 中旧版 `ReadAllText` 方法的 Windows Phone\
  \ 版本：\n\n```csharp\npublic void ReadAllText(string filename, Action<string> completed)\n\
  {\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n    IAsyncOperation<StorageFile>\
  \ createOp = localFolder.GetFileAsync(filename);\n    createOp.Completed = (asyncInfo1,\
  \ asyncStatus1) =>\n    {\n        IStorageFile storageFile = asyncInfo1.GetResults();\n\
  \        IAsyncOperation<IRandomAccessStreamWithContentType> openOp =\n        \
  \    storageFile.OpenReadAsync();\n        openOp.Completed = (asyncInfo2, asyncStatus2)\
  \ =>\n        {\n            IRandomAccessStream stream = asyncInfo2.GetResults();\n\
  \            DataReader dataReader = new DataReader(stream);\n            uint length\
  \ = (uint)stream.Size;\n            DataReaderLoadOperation loadOp = dataReader.LoadAsync(length);\n\
  \            loadOp.Completed = (asyncInfo3, asyncStatus3) =>\n            {\n \
  \               string text = dataReader.ReadString(length);\n                dataReader.Dispose();\n\
  \                completed(text);\n            };\n        };\n    };\n}\n```\n\n\
  这里有三个嵌套的 `Completed` 处理程序。因为方法在第一个 `Completed` 处理程序执行之前就返回了，所以不可能从方法中返回文件的内容。文件内容必须通过传递给方法的函数返回。\n\
  \n下面是使用 `await` 重写后的版本：\n\n```csharp\npublic async void ReadAllText(string filename,\
  \ Action<string> completed)\n{\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
  \    IStorageFile storageFile = await localFolder.GetFileAsync(filename);\n    IRandomAccessStream\
  \ stream = await storageFile.OpenReadAsync();\n    DataReader dataReader = new DataReader(stream);\n\
  \    uint length = (uint)stream.Size;\n    await dataReader.LoadAsync(length);\n\
  \    string text = dataReader.ReadString(length);\n    dataReader.Dispose();\n \
  \   completed(text);\n}\n```\n\n注意方法上的 `async` 修饰符。`async` 修饰符不会改变方法的签名，因此该方法仍然被视为\
  \ `IFileHelper` 接口中 `ReadAllText` 方法的正确实现。\n\n`await` 运算符出现了三次；前两次作用于返回对象的方法，第三次作用于\
  \ `LoadAsync` 方法，该方法只执行操作而不返回任何内容。\n\n在幕后，C# 编译器将这个方法分成了四个执行块。方法在第一个 `await` 运算符处返回给调用者（`Note`\
  \ 类），然后在 `GetFileAsync` 方法完成时恢复执行，接着在下一个 `await` 处再次离开，依此类推。\n\n实际上，`ReadAllText`\
  \ 方法有可能从头到尾按顺序执行。如果异步方法在执行到 `await` 运算符之前就完成了操作，执行就会像普通函数调用一样继续下去。这是一种性能优化，在移动设备相对较快的固态文件\
  \ I/O 中经常发挥作用。\n\n让我们稍微改进一下这个 `ReadAllText` 方法。`DataReader` 类实现了 `IDisposable` 接口，并包含一个\
  \ `Dispose` 方法。如果不调用 `Dispose`，可能会使文件保持打开状态。调用 `Dispose` 还会关闭 `DataReader` 所基于的\
  \ `IRandomAccessStream`。`IRandomAccessStream` 也实现了 `IDisposable`。\n\n最好将 `IDisposable`\
  \ 对象包含在 `using` 块中。这可以确保即使在块内抛出异常，也会自动调用 `Dispose` 方法。`ReadAllText` 的更好实现是这样的：\n\
  \n```csharp\npublic async void ReadAllText(string filename, Action<string> completed)\n\
  {\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n    IStorageFile\
  \ storageFile = await localFolder.GetFileAsync(filename);\n    using (IRandomAccessStream\
  \ stream = await storageFile.OpenReadAsync())\n    {\n        using (DataReader\
  \ dataReader = new DataReader(stream))\n        {\n            uint length = (uint)stream.Size;\n\
  \            await dataReader.LoadAsync(length);\n            string text = dataReader.ReadString(length);\n\
  \            completed(text);\n        }\n    }\n}\n```\n\n现在就不需要显式调用 `Dispose`\
  \ 了。\n\n当然，我们仍然要为向 `ReadAllText` 方法传递回调函数而烦恼。但还有什么替代办法呢？如果方法在第一个 `await` 运算符处真正返回给调用者，那么方法怎么能返回文件的文本内容呢？相信\
  \ C# 编译器。如果它能实现 `await`，那么它肯定也能让你创建自己的异步方法。\n\n让我们用名为 `ReadTextAsync` 的方法替换 `ReadAllText`。这个新名称反映了这样一个事实：该方法本身是异步的，可以配合\
  \ `await` 运算符调用，返回包含文件内容的字符串。\n\n为此，`ReadTextAsync` 方法需要返回一个 `Task` 对象。`Task` 类定义在\
  \ `System.Threading.Tasks` 中，是 .NET 中异步操作的标准表示。`Task` 类的功能相当丰富，但在这种情况下只需要用到其中的一小部分。`System.Threading.Tasks`\
  \ 命名空间实际上定义了两个 `Task` 类：\n\n- `Task` 用于不返回任何内容的异步方法\n- `Task<TResult>` 用于返回 `TResult`\
  \ 类型对象的异步方法\n\n这些是 Windows 8 中 `IAsyncAction` 和 `IAsyncOperation<TResult>` 接口的 .NET\
  \ 等价物，并且有扩展方法可以将 `Task` 对象转换为 `IAsyncAction` 和 `IAsyncOperation<TResult>` 对象。\n\n\
  这个新方法不是返回 void，而是可以返回 `Task<string>`。回调参数不再需要，在方法内部，文件的内容像普通方法一样被返回：\n\n```csharp\n\
  public async Task<string> ReadTextAsync(string filename)\n{\n    StorageFolder localFolder\
  \ = ApplicationData.Current.LocalFolder;\n    IStorageFile storageFile = await localFolder.GetFileAsync(filename);\n\
  \    using (IRandomAccessStream stream = await storageFile.OpenReadAsync())\n  \
  \  {\n        using (DataReader dataReader = new DataReader(stream))\n        {\n\
  \            uint length = (uint)stream.Size;\n            await dataReader.LoadAsync(length);\n\
  \            return dataReader.ReadString(length);\n        }\n    }\n}\n```\n\n\
  编译器处理其余部分。`return` 语句看起来是返回一个字符串对象，即 `ReadString` 方法的返回值，但 C# 编译器会自动将该值包装在 `Task<string>`\
  \ 对象中，并实际在第一个 `await` 运算符执行时从方法中返回该对象。\n\n现在可以使用 `await` 运算符调用这个 `ReadTextAsync`\
  \ 方法了。\n\n当然，重新定义这些文件 I/O 函数的方法签名会对整个程序产生影响。如果我们想继续使用 `DependencyService` 来调用与平台无关的方法——这是非常可取的——那么\
  \ iOS 和 Android 的方法应该有相同的签名。这意味着 NoteTaker6 版本的 `IFileHelper` 由以下三个异步方法组成：\n\n```csharp\n\
  using System.Threading.Tasks;\n\nnamespace NoteTaker6\n{\n    public interface IFileHelper\n\
  \    {\n        Task<bool> ExistsAsync(string filename);\n        Task WriteTextAsync(string\
  \ filename, string text);\n        Task<string> ReadTextAsync(string filename);\n\
  \    }\n}\n```\n\n方法中不再有回调函数。`Task` 对象有自己的回调机制。\n\n以下是 Windows Phone 版本 `FileHelper`\
  \ 对 `IFileHelper` 的完整实现：\n\n```csharp\nusing System;\n```\n\n\n\n\nusing System.Threading.Tasks;\n\
  using Windows.Storage;\nusing Windows.Storage.Streams;\nusing Xamarin.Forms;\n\n\
  [assembly: Dependency(typeof(NoteTaker6.WinPhone.FileHelper))]\n\nnamespace NoteTaker6.WinPhone\n\
  {\n    class FileHelper : IFileHelper\n    {\n        public async Task<bool> ExistsAsync(string\
  \ filename)\n        {\n            StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
  \n            try\n            {\n                await localFolder.GetFileAsync(filename);\n\
  \            }\n            catch\n            {\n                return false;\n\
  \            }\n            return true;\n        }\n\n        public async Task\
  \ WriteTextAsync(string filename, string text)\n        {\n            StorageFolder\
  \ localFolder = ApplicationData.Current.LocalFolder;\n            IStorageFile storageFile\
  \ =\n                await localFolder.CreateFileAsync(filename,\n             \
  \       CreationCollisionOption.ReplaceExisting);\n\n            using (IRandomAccessStream\
  \ stream =\n                await storageFile.OpenAsync(FileAccessMode.ReadWrite))\n\
  \            {\n                using (DataWriter dataWriter = new DataWriter(stream))\n\
  \                {\n                    dataWriter.WriteString(text);\n        \
  \            await dataWriter.StoreAsync();\n                }\n            }\n\
  \        }\n\n        public async Task<string> ReadTextAsync(string filename)\n\
  \        {\n            StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
  \            IStorageFile storageFile = await localFolder.GetFileAsync(filename);\n\
  \            using (IRandomAccessStream stream = await storageFile.OpenReadAsync())\n\
  \            {\n                using (DataReader dataReader = new DataReader(stream))\n\
  \                {\n                    uint length = (uint)stream.Size;\n     \
  \               await dataReader.LoadAsync(length);\n                    \nusing\
  \ System.Runtime.CompilerServices;\nusing System.Threading.Tasks;\n\nnamespace NoteTaker6\n\
  {\n    class Note : INotifyPropertyChanged\n    {\n        ...\n\n        public\
  \ Task SaveAsync(string filename)\n        {\n            string text = this.Title\
  \ + \"\\n\" + this.Text;\n            return FileHelper.WriteTextAsync(filename,\
  \ text);\n        }\n\n        public async Task LoadAsync(string filename)\n  \
  \      {\n            string text = await FileHelper.ReadTextAsync(filename);\n\n\
  \            // Break string into Title and Text.\n            int index = text.IndexOf('\\\
  n');\n            this.Title = text.Substring(0, index);\n            this.Text\
  \ = text.Substring(index + 1);\n        }\n\n        ...\n    }\n}\n\n这两个方法都不返回值，但由于它们是异步的，方法会返回一个可等待的\
  \ Task 对象。处理此类方法有几种方式。SaveAsync 方法直接返回 FileHelper.WriteTextAsync 的返回值，这也是一个 Task\
  \ 对象。LoadAsync 方法没有返回语句，尽管它当然也可以以一个空的返回语句结尾。SaveAsync 方法也可以有一个隐式的空返回语句，但 WriteTextAsync\
  \ 调用之前必须加上 await，并且由于存在该 await 运算符，方法需要 async 修饰符：\n\n```\npublic async Task SaveAsync(string\
  \ filename)\n{\n    string text = this.Title + \"\\n\" + this.Text;\n    await FileHelper.WriteTextAsync(filename,\
  \ text);\n}\n```\n\n这些新的函数定义也需要更改 NoteTaker6Page 构造函数中的代码，并且你有几种选择。你可以像这样为**加载**按钮定义\
  \ Clicked 处理程序：\n\n```\nloadButton.Clicked += (sender, args) =>\n{\n    note.LoadAsync(FILENAME);\n\
  };\n```\n\n你会收到编译器警告，提示你可能需要考虑使用 `await` 运算符。但严格来说，你并不需要。实际情况是，`Clicked` 处理程序调用了\
  \ `LoadAsync`，但不会等待它完成。`Clicked` 处理程序会在文件被加载之前就返回到触发事件的按钮。\n\n你可以在 lambda 函数中使用\
  \ `await`，但必须在参数列表前加上 `async` 修饰符：\n\n```\nloadButton.Clicked += async (sender,\
  \ args) =>\n{\n    await note.LoadAsync(FILENAME);\n};\n```\n\n对于**保存**按钮，你可能希望在保存操作完成之前不要启用**加载**按钮，因此你需要在那里加上\
  \ `await`：\n\n```\nsaveButton.Clicked += async (sender, args) =>\n{\n    await note.SaveAsync(FILENAME);\n\
  \    loadButton.IsEnabled = true;\n};\n```\n\n实际上，如果你开始考虑异步文件 I/O，你可能会开始感到不安——而且这是有道理的。例如，如果你按下**保存**按钮，在文件仍在保存的过程中，你又按下了**加载**按钮，会怎样？会不会导致异常？会不会因为文件的一半尚未保存而只加载了一半？\n\
  \n在用户界面层面是可以避免这类问题的。如果你想在特定时间禁止按下某个按钮，可以禁用该按钮。下面介绍程序如何防止按钮相互干扰或自我干扰：\n\n```\nsaveButton.Clicked\
  \ += async (sender, args) =>\n{\n    saveButton.IsEnabled = false;\n    loadButton.IsEnabled\
  \ = false;\n    await note.SaveAsync(FILENAME);\n    saveButton.IsEnabled = true;\n\
  \    loadButton.IsEnabled = true;\n};\n```\n\n```\nloadButton.Clicked += async (sender,\
  \ args) =>\n{\n    saveButton.IsEnabled = false;\n    loadButton.IsEnabled = false;\n\
  \    await note.LoadAsync(FILENAME);\n    saveButton.IsEnabled = true;\n    loadButton.IsEnabled\
  \ = true;\n};\n```\n\n对于这些非常小的文件和固态存储器，你不太可能遇到问题，但小心谨慎总没有坏处。\n\n// Create Entry\
  \ and Editor views.\nEntry entry = new Entry\n{\n    Placeholder = \"Title (optional)\"\
  \n};\n\nEditor editor = new Editor\n{\n    Keyboard = Keyboard.Create(KeyboardFlags.All),\n\
  \    BackgroundColor = Device.OnPlatform(Color.Default,\n                      \
  \              Color.Default,\n                                    Color.White),\n\
  \    VerticalOptions = LayoutOptions.FillAndExpand\n};\n\n// Set data bindings.\n\
  Note note = new Note();\nthis.BindingContext = note;\nentry.SetBinding(Entry.TextProperty,\
  \ \"Title\");\neditor.SetBinding(Editor.TextProperty, \"Text\");\n\n// Create Save\
  \ and Load buttons.\nButton saveButton = new Button\n{\n    Text = \"Save\",\n \
  \   HorizontalOptions = LayoutOptions.CenterAndExpand\n};\n\nButton loadButton =\
  \ new Button\n{\n    Text = \"Load\",\n    IsEnabled = false,\n    HorizontalOptions\
  \ = LayoutOptions.CenterAndExpand\n};\n\n// Set Clicked handlers.\nsaveButton.Clicked\
  \ += async (sender, args) =>\n{\n    saveButton.IsEnabled = false;\n    loadButton.IsEnabled\
  \ = false;\n    await note.SaveAsync(FILENAME);\n    saveButton.IsEnabled = true;\n\
  \    loadButton.IsEnabled = true;\n};\n\nloadButton.Clicked += async (sender, args)\
  \ =>\n{\n    saveButton.IsEnabled = false;\n    loadButton.IsEnabled = false;\n\
  \    await note.LoadAsync(FILENAME);\n    saveButton.IsEnabled = true;\n    loadButton.IsEnabled\
  \ = true;\n};\n"
- "# 第 4 章\n\n## 构建应用：架构\n\n**NoteTaker** 应用已经从概念发展为单页程序，其中包含了保存和检索笔记所需的大部分基础架构。现在它必须扩展为一个可以显示和维护多条笔记的多页应用。\n\
  \n本章说明了为该增强版本实现所有必要功能的步骤。需要两个重要的 Xamarin.Forms 可视化元素：第一个是 `NavigationPage`，它允许程序在多个页面之间导航；第二个是\
  \ `ListView`，它显示可滚动且可选择的项目列表，通常是相同类型的项目。在本程序中，`ListView` 将显示多个 `Note` 对象。\n\n指定某些程序操作还需要\
  \ `ToolbarItem`。严格来说，`ToolbarItem` 并不是一个可视化元素，但它用于指定工具栏上的项目，该工具栏显示在页面顶部（iOS 和 Android）或底部（Windows\
  \ Phone）。\n\n从程序员的角度来看，传统桌面应用编程与移动应用编程之间的一大区别是需要理解应用程序生命周期。在移动应用启动到终止之间，应用可能会被挂起。此时，应用保存其数据（包括临时数据）非常重要，这些数据是在应用重新启动时重新创建应用内容所必需的。应用程序生命周期编程也是创建真实应用的重要组成部分。\n\
  \n## 版本 7：页面导航\n\n到目前为止，本书中的所有程序都基于单个派生自 `ContentPage` 的类的单个实例。相比之下，**NoteTaker7**\
  \ 包含两个派生自 `ContentPage` 的类，分别名为 `HomePage` 和 `NotePage`。程序启动时，会显示 `HomePage`，其中列出你在之前的会话中输入的所有笔记。用户可以从\
  \ `HomePage` 导航到 `NotePage` 以输入新笔记，或编辑、删除现有笔记，然后导航回 `HomePage`，后者会显示更新后的列表。\n\n\
  Xamarin.Forms 为页面导航提供的方法都由 `Xamarin.Forms` 命名空间中的 `INavigation` 接口定义：\n\n```\npublic\
  \ interface INavigation\n{\n    Task PushAsync(Page page);\n    Task<Page> PopAsync();\n\
  \    Task PopToRootAsync();\n    Task PushModalAsync(Page page);\n}\n```\n\n\n```csharp\n\
  Task<Page> PopModalAsync();\n}\n```\n\n这些都是异步方法，这意味着它们会立即返回，而导航操作则继续进行。\n\n正如你可能从这些方法名称中推断出的那样，Xamarin.Forms\
  \ 中的页面导航的工作方式类似于熟悉的后进先出栈：每次 `PushAsync` 调用都会将当前页面压入栈并导航到指定的页面。每次调用 `PopAsync` 都会将前一个页面从栈中弹出并导航回该弹出页面。这种架构用户非常熟悉，因为\
  \ Web 浏览器的工作方式类似。\n\n显式调用 `PopAsync` 并非总是必需的，因为用户通常可以使用 Android 或 Windows Phone\
  \ 上的硬件返回按钮，或由 iOS 和 Android 作为页面导航用户界面的一部分自动提供的返回按钮来向后导航。`PopToRootAsync` 调用本质上会清空栈并返回到主页。未来的章节（本预览版中未包含）将更详细地讨论页面和导航，包括用于弹出页面导航的\
  \ Modal 方法。\n\n`INavigation` 接口由 Xamarin.Forms 内部的一个类实现，但该类可通过 `VisualElement` 定义的\
  \ `Navigation` 属性返回的对象访问。非常经常，使用页面本身的 `Navigation` 属性来导航到另一个页面会很方便。例如：\n\n```csharp\n\
  this.Navigation.PushAsync(new AnotherPage());\n```\n\n然而，如果更方便，你也可以使用页面上任何视图的 `Navigation`\
  \ 属性。\n\n要在 Xamarin.Forms 应用程序中启用页面导航，`App.GetMainPage` 方法应返回 `NavigationPage` 的实例而不是\
  \ `ContentPage`。幸运的是，此更改非常容易。如果 `HomePage` 派生自 `ContentPage`（在 NoteTaker7 应用程序中就是这种情况），那么\
  \ `App.GetMainPage` 只需将该页面的新实例传递给 `NavigationPage` 构造函数并返回结果即可。以下是 NoteTaker7 中的\
  \ App 类：\n\n```csharp\nnamespace NoteTaker7\n{\n    public class App\n    {\n  \
  \      public static Page GetMainPage()\n        {\n            return new NavigationPage(new\
  \ HomePage());\n        }\n    }\n}\n```\n\n这会将一个 `ContentPage` 对象转换为一个 `NavigationPage`\
  \ 对象。\n\n严格来说，将 `ContentPage` 包装在 `NavigationPage` 中对于 Windows Phone 并不是必需的，但你需要它用于\
  \ iOS 和 Android，因此最简单的方法是为三个平台都使用相同的代码。\n\n对于 iOS 和 Android，此更改对页面的视觉外观有明显影响。页面顶部会预留一个区域用于页面标题，你可以使用\
  \ `Page` 定义的 `Title` 属性来设置。你在启用页面导航时应设置此 `Title` 属性。\n\n**NoteTaker7** 中的 `HomePage`\
  \ 类派生自 `ContentPage`，构造函数设置了该 `Title` 属性。构造函数还创建了一个居中的 `Button`，其文本为“Add New Note”，并有一个\
  \ `Clicked` 处理程序，该处理程序根据当前日期和时间生成唯一的文件名并导航到 `NotePage`：\n\n```csharp\nnamespace\
  \ NoteTaker7\n{\n    class HomePage : ContentPage\n    {\n        public HomePage()\n\
  \        {\n            this.Title = \"Note Taker 7\";\n\n            Button button\
  \ = new Button\n            {\n                Text = \"Add New Note\",\n      \
  \          HorizontalOptions = LayoutOptions.Center,\n                VerticalOptions\
  \ = LayoutOptions.Center\n            };\n\n            button.Clicked += (sender,\
  \ args) =>\n            {\n                // Create unique filename.\n        \
  \        DateTime datetime = DateTime.UtcNow;\n                string filename =\
  \ datetime.ToString(\"yyyyMMddHHmmssfff\") + \".note\";\n\n                // Navigate\
  \ to new NotePage.\n                this.Navigation.PushAsync(new NotePage(filename));\n\
  \            };\n\n            this.Content = button;\n        }\n    }\n}\n```\n\
  \n以下是 **NoteTaker7** 在三个平台上运行时此页面的外观：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_154_0.png)\n\
  \n注意 iPhone 和 Android 上的标题。使用 iPhone 上的 `NavigationPage` 时，你不再需要担心页面上的任何内容占用与状态栏相同空间，无论是在主页上还是从该页面导航到的任何页面上。\n\
  \nNoteTaker7 中的 Note、IFileHelper 和 FileHelper 类与 NoteTaker6 中的相同。\n\n`NotePage`\
  \ 类与程序早期版本中的页面类相似。它派生自 `ContentPage`，但定义了一个带有一个字符串参数的构造函数，指示笔记的文件名。此构造函数将文件名保存为私有字段，设置\
  \ `Title` 属性，并构建页面的其余部分：\n\n```csharp\nnamespace NoteTaker7\n{\n    class NotePage\
  \ : ContentPage\n    {\n        string filename;\n        Note note = new Note();\n\
  \n        public NotePage(string filename)\n        {\n            this.filename\
  \ = filename;\n            Title = \"New Note\";\n\n            // Create Entry\
  \ and Editor views.\n            Entry entry = new Entry\n            {\n      \
  \          Placeholder = \"Title (optional)\"\n            };\n```\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_156_0.png)\n\
  \n再次注意，此页面的 `Title` 属性显示在 iOS 和 Android 屏幕顶部，并且左侧的角度括号提示点击此处可导航回主页。此外，Android 和\
  \ Windows Phone 设备底部最左侧的按钮也会导航回主页。\n\n那么加载和保存按钮在哪里呢？嗯，加载按钮在这里没有意义，因为在这个版本的程序中 `NotePage`\
  \ 仅在具有新文件名时显示。文件尚不存在。然而，`NotePage` 应该有一些保存笔记的功能。\n\n它确实有。在使用页面导航时，利用 `Page` 类定义的两个受保护的虚拟方法\
  \ `OnAppearing` 和 `OnDisappearing` 通常很方便。`OnAppearing` 方法在导航到页面时被调用，而 `OnDisappearing`\
  \ 方法在从页面导航离开时被调用。在 `NotePage` 类中，`OnAppearing` 在这里没做什么（只是为了对称性而显示），但 `OnDisappearing`\
  \ 重写是存储 `Note` 对象的完美时机：\n\n```csharp\nnamespace NoteTaker7\n{\n    class NotePage\
  \ : ContentPage\n    {\n        ...\n        protected override void OnAppearing()\n\
  \        {\n            base.OnAppearing();\n        }\n        protected override\
  \ void OnDisappearing()\n        {\n            // Only save it if there's some\
  \ text somewhere.\n            if (!String.IsNullOrWhiteSpace(note.Title) ||\n \
  \               !String.IsNullOrWhiteSpace(note.Text))\n            {\n        \
  \        note.SaveAsync(filename);\n            }\n            base.OnDisappearing();\n\
  \        }\n    }\n}\n```\n\n这意味着用户无需费心显式保存笔记。在导航回主页时会自动完成。\n\n你可能会想：如果用户在导航返回之前终止应用程序怎么办？或者让应用程序在\
  \ `NotePage` 仍处于活动状态时运行，然后关闭手机？是的，这确实是个问题。但这实际上是涉及 *应用程序生命周期* 的主题问题，而在这一章结束之前将会讨论这个问题。\n\
  \n## Version 8. Notes in the ListView\n\n随着 **NoteTaker** 程序增强为显示多个笔记，一些重构可能很有必要。目前，`Note`\
  \ 对象和与该 `Note` 对象关联的文件名并不是紧密关联的。程序有可能使用与 `LoadAsync` 方法不同的文件名调用 `Note` 的 `SaveAsync`\
  \ 方法。\n\n让我们修复这个问题。在 **NoteTaker8** 中，让我们将文件名传递给 `Note` 构造函数，该构造函数将其保存为名为 `Filename`\
  \ 的公共只读属性。最终你会看到使此属性公开的原因。然而，由于此 `Filename` 属性在构造函数中设置且永不更改，因此该属性没有理由触发 `PropertyChanged`\
  \ 事件。这允许 `LoadAsync` 和 `SaveAsync` 方法被重新定义为无参数。以下是新版本的相关部分：\n\n```csharp\nnamespace\
  \ NoteTaker8\n{\n    class Note : INotifyPropertyChanged\n    {\n        string\
  \ title, text;\n\n        public event PropertyChangedEventHandler PropertyChanged;\n\
  \n        public Note(string filename)\n        {\n            this.Filename = filename;\n\
  \        }\n\n        public string Filename { private set; get; }\n```\n\n\n\n\
  ```\npublic Task SaveAsync()\n{\n    string text = this.Title + \"\\n\" + this.Text;\n\
  \    return FileHelper.WriteTextAsync(this.Filename, text);\n}\n\npublic async Task\
  \ LoadAsync()\n{\n    string text = await FileHelper.ReadTextAsync(this.Filename);\n\
  \n    // Break string into Title and Text.\n    int index = text.IndexOf('\\n');\n\
  \    this.Title = text.Substring(0, index);\n    this.Text = text.Substring(index\
  \ + 1);\n}\n\n...\n}\n}\n```\n\n这意味着 `NotePage` 的新版本必须在其构造函数中传入一个 `Note` 对象，而不是文件名：\n\
  \n```\nnamespace NoteTaker8\n{\n    class NotePage : ContentPage\n    {\n      \
  \  Note note;\n\n        public NotePage(Note note)\n        {\n            this.note\
  \ = note;\n            Title = \"New Note\";\n\n            // Create Entry and\
  \ Editor views.\n            Entry entry = new Entry\n            {\n          \
  \      Placeholder = \"Title (optional)\"\n            };\n\n            Editor\
  \ editor = new Editor\n            {\n                Keyboard = Keyboard.Create(KeyboardFlags.All),\n\
  \                BackgroundColor = Device.OnPlatform(Color.Default,\n          \
  \                                         Color.Default,\n                     \
  \                              Color.White),\n                VerticalOptions =\
  \ LayoutOptions.FillAndExpand\n            };\n\n            // Set data bindings.\n\
  \            this.BindingContext = note;\n```\n\n```\nentry.SetBinding(Entry.TextProperty,\
  \ \"Title\");\neditor.SetBinding(Editor.TextProperty, \"Text\");\n\n// Assemble\
  \ page.\nthis.Content = new StackLayout\n{\n    Children =\n    {\n        new Label\
  \ { Text = \"Title:\" },\n        entry,\n        new Label { Text = \"Note:\" },\n\
  \        editor,\n    };\n};\n...\n}\n```\n\n构造函数将自身的 BindingContext 设置为该 Note 对象。\n\
  \n## 枚举文件\n\nNoteTaker7 的前一版本在用户从 NotePage 导航离开并返回到 HomePage 时，会将新笔记保存在本地应用程序存储中。但\
  \ NoteTaker8 的重大变化是提供了一个显示所有已保存笔记的功能。可以考虑几种策略来实现此功能。可以将本地存储中包含所有单个笔记文件名的主列表保存在一个特殊文件中。或者，程序也可以使用文件\
  \ I/O 设施来枚举文件夹中的所有笔记文件。\n\nNoteTaker8 采用了第二种策略，但这要求文件助手增强以包含获取应用程序存储文件夹中所有文件的方法。以下是带有新方法\
  \ `GetFilesAsync` 的新 `IFileHelper`：\n\n```\nnamespace PlatformHelpers\n{\n    public\
  \ interface IFileHelper\n    {\n        Task<bool> ExistsAsync(string filename);\n\
  \n        Task WriteTextAsync(string filename, string text);\n\n        Task<string>\
  \ ReadTextAsync(string filename);\n\n        Task<IEnumerable<string>> GetFilesAsync();\n\
  \n        Task DeleteFileAsync(string filename);\n    }\n}\n```\n\n请注意，还添加了 `DeleteFileAsync`\
  \ 方法。目前还不需要，但在应用程序的下一个版本中将需要它。\n\n还请注意，命名空间已更改为更通用的名称。你使用 `DependencyService` 创建的接口和类很可能在其他应用程序中也很有价值。为所有\
  \ `DependencyService` 助手使用一致的命名空间名称会很方便。\n\n新 `IFileHelper` 的 iOS 和 Android 实现类似。以下是\
  \ iOS 版本，但仅显示新方法：\n\n```\nnamespace PlatformHelpers.iOS\n{\n    class FileHelper\
  \ : IFileHelper\n    {\n        ...\n\n        public Task<IEnumerable<string>>\
  \ GetFilesAsync()\n        {\n            // Sort the filenames.\n            IEnumerable<string>\
  \ filenames =\n                from filepath in Directory.EnumerateFiles(GetDocsFolder())\n\
  \                select Path.GetFileName(filepath);\n\n            return Task<IEnumerable<string>>.FromResult(filenames);\n\
  \        }\n\n        public Task DeleteFileAsync(string filename)\n        {\n\
  \            File.Delete(GetFilePath(filename));\n            return Task.FromResult(true);\n\
  \        }\n\n        string GetDocsFolder()\n        {\n            return Environment.GetFolderPath(Environment.SpecialFolder.MyDocuments);\n\
  \        }\n\n        string GetFilePath(string filename)\n        {\n         \
  \   return Path.Combine(GetDocsFolder(), filename);\n        }\n    }\n}\n```\n\n\
  `Directory.EnumerateFiles` 方法返回完全限定的文件名，因此 `GetFilesAsync` 使用少量 LINQ 去掉目录路径，只保留文件名。这是为了与\
  \ `WriteTextAsync` 和 `ReadTextAsync` 方法兼容，这些方法只需要文件名并自行提供目录路径。\n\nWindows Phone\
  \ 版本使用 WinRT `StorageFolder` 方法：\n\n```\nnamespace PlatformHelpers.WinPhone\n{\n\
  \    ...\n\n    public async Task<IEnumerable<string>> GetFilesAsync()\n    {\n\
  \        StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\n  \
  \      IEnumerable<string> filenames =\n            from storageFile in await localFolder.GetFilesAsync()\n\
  \            select storageFile.Name;\n\n        return filenames;\n    }\n\n  \
  \  public async Task DeleteFileAsync(string filename)\n    {\n        StorageFolder\
  \ localFolder = ApplicationData.Current.LocalFolder;\n        StorageFile storageFile\
  \ = await localFolder.GetFileAsync(filename);\n        await storageFile.DeleteAsync();\n\
  \    }\n}\n```\n\n最后，可移植类库中的静态 `FileHelper` 类也已扩展：\n\n```\nnamespace PlatformHelpers\n\
  {\n    static class FileHelper\n    {\n        static IFileHelper fileHelper = DependencyService.Get<IFileHelper>();\n\
  \n        public static Task<bool> ExistsAsync(string filename)\n        {\n   \
  \         return fileHelper.ExistsAsync(filename);\n        }\n\n        public\
  \ static Task WriteTextAsync(string filename, string text)\n        {\n        \
  \    return fileHelper.WriteTextAsync(filename, text);\n        }\n\n        public\
  \ static Task<string> ReadTextAsync(string filename)\n        {\n            return\
  \ fileHelper.ReadTextAsync(filename);\n        }\n\n        public static Task<IEnumerable<string>>\
  \ GetFilesAsync()\n        {\n            return fileHelper.GetFilesAsync();\n \
  \       }\n\n        public static Task DeleteFileAsync(string filename)\n     \
  \   {\n```\n\n```\nreturn fileHelper.DeleteFileAsync(filename);\n```\n\n这些现在是 FileHelper\
  \ 类的最终版本（至少对于 NoteTaker 应用程序而言）。\n\n## ListView\n\nNoteTaker8 需要一种列出所有笔记的方式。它可以使用\
  \ Label 视图来显示每条笔记的标题，然后将所有这些 Label 视图收集到 ScrollView 内的 StackLayout 中。但存在一个视图可以为你完成大部分工作，甚至更多。这就是\
  \ ListView，每当你需要显示可滚动的对象列表时，这就是你的首选视图——特别是如果对象是同一种类型。\n\n基本上你用一组对象填充 ListView，ListView\
  \ 就会显示它们。你可能会认为 ListView 显示的对象必须是某种视图，但事实并非如此。ListView 显示的对象通常是数据对象，你可以精确控制 ListView\
  \ 如何显示这些数据对象。关于其工作原理的完整讨论将在稍后的章节中进行，遗憾的是该章节不在本预览版中。\n\nListView 显示的项目是可选择的。用户只需轻按一个项目即可选择它。ItemSelected\
  \ 事件在新项目被选择时发出信号，而 SelectedItem 属性则揭示该项目。在 NoteTaker 的下一个版本中，此功能将用于编辑和删除笔记。\n\n\
  你通过将 ListView 的 ItemsSource 属性设置为实现 IEnumerable 接口的集合对象来指定要显示的项目。这是与最通用类型的集合相关联的\
  \ .NET 接口。数组实现了 IEnumerable，因此数组符合条件。更常见的是，ListView 的 ItemsSource 属性被设置为 List<T>\
  \ 的实例。例如，如果 list 是 List<T> 的实例，那么你可以这样设置 ItemsSource：\n\n```\nlistView.ItemsSource\
  \ = list;\n```\n\nListView 随后会显示集合中的所有项目，如有必要则进行滚动。\n\n非常经常地，你希望 ListView 显示的数据项集合作为另一个对象的属性公开。例如，假设一个名为\
  \ Data 的类定义了一个名为 CollectionProp 的属性，该属性实现了 IEnumerable，并且 data 是该类的一个实例。你可以这样设置\
  \ ItemsSource 属性：\n\n```\nlistView.ItemsSource = data.CollectionProp;\n```\n\n但如果在\
  \ CollectionProp 属性已设置为 ItemsSource 属性之后集合发生了变化，会发生什么？\n\n对于集合而言，“变化”这个词究竟意味着什么？\n\
  \n\n\n\n\n实际上集合可能发生变化有三种不同方式！理解集合相关的不同类型的变化将帮助你设计数据和用户界面，以便 `ListView` 始终显示最新最好的数据项。\n\
  \n这是第一种变化类型：也许 `Data` 实例的 `CollectionProp` 属性在应用程序启动时返回一个特定的 `List<T>` 对象，然后发生了某些事情，该属性返回了一个不同的\
  \ `List<T>` 对象。这是一个完全不同的集合，包含不同的项。如果是这种情况，那么 `Data` 类应实现 `INotifyPropertyChanged`，并在\
  \ `CollectionProp` 属性更改时触发 `PropertyChanged` 事件。因此，`ListView` 的 `ItemsSource` 属性不应简单地设置为\
  \ `CollectionProp` 属性，而必须通过数据绑定绑定到该属性：\n\n```\nlistView.BindingContext = data;\n\
  listView.SetBinding(ListView.ItemsSourceProperty, \"CollectionProp\");\n```\n\n\
  这就是集合可能发生变化的一种方式。这里是第二种方式：`CollectionProp` 属性返回的 `List<T>` 对象在程序运行期间可能保持不变，但项可能会动态地添加到集合中或从集合中移除，或者以某种方式重新排序或重新排序，当然你希望\
  \ `ListView` 显示能够反映更新后的内容。\n\n这是 **NoteTaker8** 需要处理的变化类型。**NoteTaker8** 中的 `ListView`\
  \ 将显示笔记集合，但用户可以在程序运行期间向集合添加笔记和删除笔记。`ListView` 必须响应这些更改。起初，这听起来像是一个困难的要求。`ListView`\
  \ 如何确定设置为（或绑定到）其 `ItemsSource` 属性的集合已获得新项或丢失了现有项？\n\n当然是通过事件！你已经知道 `System.ComponentModel`\
  \ 命名空间中定义的 `INotifyPropertyChanged` 接口，如下所示：\n\n```\npublic interface INotifyPropertyChanged\n\
  {\n    event PropertyChangedEventHandler PropertyChanged;\n}\n```\n\n`System.Collections.Specialized`\
  \ 命名空间包含一个相关且相似的接口，名为 `INotifyCollectionChanged`：\n\n```\npublic interface INotifyCollectionChanged\n\
  {\n    event NotifyCollectionChangedEventHandler CollectionChanged;\n}\n```\n\n\
  集合类可以实现此接口，并在对象添加到集合或从集合中移除时，或项以某种方式重新排序时通知外部世界。与 `NotifyCollectionChangedEventHandler`\
  \ 关联的事件参数提供了有关此更改的详细信息。\n\n`ListView` 知道 `INotifyCollectionChanged`。每当集合对象设置为其 `ItemsSource`\
  \ 属性时，`ListView` 会检查该集合对象是否实现此接口。如果是，`ListView` 会在该集合对象的 `CollectionChanged` 事件上附加一个处理程序。然后\
  \ `ListView` 会在对象添加到集合或从集合中移除时（或如果对象以某种方式重新排序）收到通知，并相应地更新 `ListView` 显示。\n\n现在我们只需要一个实际实现\
  \ `INotifyCollectionChanged` 的类，而确实有一个：它位于 `System.Collections.ObjectModel` 命名空间中，它是一个名为\
  \ `ObservableCollection` 的泛型类，这是一个很棒的名字，因为它暗示通过使用 `CollectionChanged` 事件你可以观察集合内部发生的情况。\n\
  \n集合还可能以第三种方式发生变化。也许集合对象本身没有变化，并且对象没有添加到集合中或从集合中移除，但集合中对象的属性发生了变化。例如，假设你的集合包含多个主要城市的\
  \ `Weather` 对象。集合本身永远不会改变，但 `Weather` 类包含一个 `Temperature` 属性，该属性在一天中不断变化。如果此 `Weather`\
  \ 对象实现 `INotifyPropertyChanged` 并在 `Temperature` 属性更改时触发 `PropertyChanged` 事件，`ListView`\
  \ 也能响应这些更改。\n\nNoteTaker8 确实需要一个 `ObservableCollection`，所以让我们先处理它。让我们创建一个将存储 `Note`\
  \ 对象集合的类。`NoteFolder` 类有一个名为 `Notes` 的单个属性，其类型为 `ObservableCollection<Note>`。构造函数调用一个异步方法，该方法使用\
  \ `FileHelper.GetFilesAsync` 获取所有文件，然后按文件名排序。（请记住，文件名是根据 `Note` 对象创建的日期和时间构造的，因此这些文件名将按文件创建的顺序排序。）然后为每个文件名创建一个\
  \ `Note` 对象，调用 `LoadAsync` 方法将文件加载到 `Note` 对象中，并将其添加到 `Notes` 集合中：\n\n```\nnamespace\
  \ NoteTaker8\n{\n    class NoteFolder\n    {\n        public NoteFolder()\n    \
  \    {\n            this.Notes = new ObservableCollection<Note>();\n           \
  \ GetFilesAsync();\n        }\n\n        public ObservableCollection<Note> Notes\
  \ { private set; get; }\n\n        async void GetFilesAsync()\n        {\n     \
  \       // Sort the filenames.\n            IEnumerable<string> filenames =\n  \
  \              from filename in await FileHelper.GetFilesAsync()\n             \
  \   where filename.EndsWith(\".note\")\n                orderby (filename)\n   \
  \             select filename;\n\n            // Store them in the Notes collection.\n\
  ```\n\n请注意，`ListView` 的 `ItemsSource` 属性设置为 `App.NoteFolder.Notes`。`ListView` 可滚动，因此如果它与\
  \ `StackLayout` 中的其他视图（如此页面的 `Button`）共享，则必须具有 `VerticalOptions` 设置为 `FillAndExpand`。\n\
  \n当单击 `Button` 时，`HomePage` 构造一个唯一的文件名，实例化一个 `Note` 对象，并导航到 `NotePage`，该页面（如你所见）将其\
  \ `BindingContext` 设置为该 `Note`。你尚未看到的是 `NotePage` 的新的 `OnDisappearing` 重写：\n\n```\n\
  namespace NoteTaker8\n{\n    class NotePage : ContentPage\n    {\n        ...\n\
  \        protected override void OnDisappearing()\n        {\n            // Only\
  \ save it if there's some text somewhere.\n            if (!String.IsNullOrWhiteSpace(note.Title)\
  \ ||\n                !String.IsNullOrWhiteSpace(note.Text))\n            {\n  \
  \              note.SaveAsync();\n                App.NoteFolder.Notes.Add(note);\n\
  \            }\n            base.OnDisappearing();\n        }\n    }\n}\n```\n\n\
  新的 `OnDisappearing` 保存新的 `Note` 对象并将其添加到 `App.NoteFolder.Notes` 集合中。随着 `HomePage`\
  \ 重新进入视图，`ListView` 显示新的 `Note` 对象。\n\n然而，当你尝试添加新的 `Note` 对象时，你会发现 `ListView` 显示并不那么有启发性：\n\
  \n```\nChildren =\n{\n    new Label { Text = \"Title:\" },\n    entry,\n    new\
  \ Label { Text = \"Note:\" },\n    editor,\n};\n\nif (isNoteEdit)\n{\n    // Cancel\
  \ button.\n    Button cancelButton = new Button\n    {\n        Text = \"Cancel\"\
  ,\n        HorizontalOptions = LayoutOptions.CenterAndExpand\n    };\n\n    cancelButton.Clicked\
  \ += async (sender, args) =>\n    {\n        bool confirm = await this.DisplayAlert(\"\
  Note Taker\",\n            \"Cancel note edit?\",\n            \"Yes\", \"No\");\n\
  \n        if (confirm)\n        {\n            // Reload note.\n            await\
  \ note.LoadAsync();\n\n            // Return to home page.\n            await this.Navigation.PopAsync();\n\
  \        }\n    };\n\n    // Delete button\n    Button deleteButton = new Button\n\
  \    {\n        Text = \"Delete\",\n        HorizontalOptions = LayoutOptions.CenterAndExpand\n\
  \    };\n\n    deleteButton.Clicked += async (sender, args) =>\n    {\n        bool\
  \ confirm = await this.DisplayAlert(\"Note Taker\",\n            \"Delete this note?\"\
  ,\n            \"Yes\", \"No\");\n\n        if (confirm)\n        {\n          \
  \  // Delete Note file and remove from collection.\n            await note.DeleteAsync();\n\
  \            App.NoteFolder.Notes.Remove(note);\n\n            // Return to home\
  \ page.\n            await this.Navigation.PopAsync();\n        }\n    }\n```\n\n\
  \n\n};\n\nStackLayout horzStack = new StackLayout\n{\n    Orientation = StackOrientation.Horizontal,\n\
  \    Children =\n    {\n        cancelButton,\n        deleteButton\n    }\n};\n\
  \nstackLayout.Children.Add(horzStack);\n}\n\nthis.Content = stackLayout;\n}\n\n\
  protected override void OnAppearing()\n{\n    base.OnAppearing();\n}\n\nprotected\
  \ override void OnDisappearing()\n{\n    // Only save it if there's some text somewhere.\n\
  \    if (!String.IsNullOrWhiteSpace(note.Title) ||\n        !String.IsNullOrWhiteSpace(note.Text))\n\
  \    {\n        note.SaveAsync();\n\n        if (!isNoteEdit)\n        {\n     \
  \       App.NoteFolder.Notes.Add(note);\n        }\n    }\n\n    base.OnDisappearing();\n\
  }\n}\n\n只有在构造函数的 `isNoteEdit` 参数为 `true` 时，才会创建**取消**和**删除**按钮。当你导航到 `NotePage`\
  \ 编辑笔记，但输入了一点内容后决定放弃这些编辑时，会用到**取消**按钮。没有**确定**按钮来确认你的编辑。只需导航回主页即可。\n\n在删除某些内容或取消操作时，从用户那里获得确认是一种礼貌的做法。出于确认目的，Xamarin.Forms\
  \ 的 `Page` 类定义了一个 `DisplayAlert` 方法，它会显示一个原生平台警报框。`DisplayAlert` 存在三种不同的版本。用于**取消**和**删除**选项的那个版本有两个参数来定义两个按钮的文本，如果点击第一个按钮则返回\
  \ `true`。`DisplayAlert` 是异步的——这意味着\n\n## 版本 10. 添加模板单元格\n\n如果你试验 NoteTaker9 的编辑功能，你可能会发现一个\
  \ bug。如果你编辑标题——或者笔记没有标题，但你编辑了用于标题的那部分文本——你将不会在 ListView 中看到笔记的更新版本。终止程序并重新启动它，你的编辑才会出现。\n\
  \n问题在于使用 ToString 方法在 ListView 中显示 Note 的简单方式。在简单情况下，ListView 使用的正是这个方式，但这并不足够。ListView\
  \ 在首次显示这些项目时会调用每个项目的 ToString 方法，但当 ToString 可能返回不同的值时，它却从未得到通知。\n\n修复这个问题需要对 ListView\
  \ 进行更深入的使用。\n\n为了显示 ItemsSource 集合中的项目，ListView 使用一个称为 cell（单元格）的对象。这个 cell 是一个视图（或视图树），用作模板。ListView\
  \ 使用这个 cell 为集合中的每个项目生成相同的视图（或视图树）。通常，这会导致所有项目以完全相同的方式显示。然而，这个 cell 可以包含数据绑定，这些绑定引用\
  \ ListView 项目（此处为 Note 对象）中的属性。\n\n你可以通过使用 ViewCell 创建自己的 cell，但也可以使用几个预置的 cell。最简单的是\
  \ TextCell，它仅由一个 Label 组成。如果未指定 cell，ListView 会使用 TextCell，但显式指定 TextCell 的好处是，你可以将\
  \ Text 属性绑定到 Note 中的某个属性。\n\nNote 需要一个新属性来标识 ListView 中的对象。我们把这个属性称为 Identifier。Identifier\
  \ 属性将返回与之前版本的 Note 中 ToString 方法相同的字符串，但最大的区别是 Identifier 属性还会触发 PropertyChanged\
  \ 事件。\n\n如果 Title 属性发生变化，Identifier 属性也必须变化；如果 Title 属性为空且 Text 属性发生变化，Identifier\
  \ 也会随之变化。\n\n以下是 Note 中相关的新逻辑：\n\n```\nnamespace NoteTaker10\n{\n    class Note\
  \ : INotifyPropertyChanged\n    {\n        string title, text, identifier;\n\n \
  \       ...\n\n        public string Title\n        {\n            set\n       \
  \     {\n                if (SetProperty(ref title, value))\n```\n\n请记住，如果属性正在发生变化，SetProperty\
  \ 方法会返回 true，因此 set 访问器可以使用该返回值来执行额外的逻辑。Title 和 Text 属性使用这个返回值来调用 MakeIdentifier。其逻辑基本上与原来的\
  \ ToString 方法相同。ToString 重写已被移除。虽然带有 ToString 方法的类通常比不带 ToString 方法的类更受青睐，但在使用 ListView\
  \ 时，通常最好确认模板正在工作。\n\n另一个更改涉及新 HomePage 中的 ListView：\n\n```\n// Create and initialize\
  \ ListView.\nListView listView = new ListView\n{\n    ItemsSource = App.NoteFolder.Notes,\n\
  \    ItemTemplate = new DataTemplate(typeof(TextCell)),\n    VerticalOptions = LayoutOptions.FillAndExpand\n\
  };\n\nlistView.ItemTemplate.SetBinding(TextCell.TextProperty, \"Identifier\");\n\
  ```\n\nListView 从其父类 ItemsView<T> 继承了 ItemsSource 和 ItemTemplate 属性。ItemTemplate\
  \ 属性的类型是 DataTemplate，而 DataTemplate 构造函数需要派生自 Cell 的类的 Type 对象。DataTemplate 使用这个\
  \ Type 对象来生成可视化对象，以显示 ListView 中的项目。\n\n对于这个 ListView，DataTemplate 构造函数的参数是 typeof(TextCell)。TextCell\
  \ 基本上是在 Label 外包装的一个 Cell，因此对于 ListView 中的每个项目，DataTemplate 对象都会使用 TextCell 生成一个\
  \ Label 来显示该项目。这是最简单的模板类型；本书的最终版本将展示如何创建更复杂的模板。\n\n这里是要点：尽管 DataTemplate 不从 BindableObject\
  \ 派生，你仍然可以在它上面设置数据绑定。DataTemplate 定义了自己的 SetBinding 方法。数据绑定目标必须是 cell 的属性，在此情况下是\
  \ TextCell 定义的 Text 属性。数据绑定源是 ListView 中项目的一个属性，在此情况下是 Note 类的一个属性，具体来说就是 Identifier。\n\
  \n当生成 Label 对象以渲染 ListView 中的每个项目时，此绑定会从 DataTemplate 转移到 Label 对象的 Text 属性。每个 Label\
  \ 的 BindingContext 被设置为与该项目关联的 Note 对象。\n\nNoteTaker10 的视觉效果与 NoteTaker9 相同，但当你更改笔记的标题时——或者当标题为空而你更改文本时——ListView\
  \ 显示的文本也会随之更改。\n\nBug 已消除。\n\n## 版本 11. 构建工具栏\n\nHomePage 有一个**添加新笔记**按钮，NotePage\
  \ 有两个按钮：**取消**和**删除**。这些实际上不应该是按钮，而应该是工具栏项。在 Windows Phone 中，你可以将工具栏项添加到 ContentPage，但\
  \ iOS 和 Android 将工具栏项限制为 NavigationPage 或从 NavigationPage 导航到的页面。\n\n`ToolbarItem`\
  \ 类不像 `Button` 和 `ListView` 那样派生自 `View`。它实际上只是一个用于通过以下属性定义工具栏项特征的类：\n\n- `Name`\
  \ — 可能显示的文本\n- `Icon` — 作为资源存储的位图（最常见的是 PNG）的文件名\n- `Order` — `ToolbarItemOrder`\
  \ 枚举的一个成员：`Default`、`Primary` 或 `Secondary`\n- `Priority` — 一个整数\n\n`Order` 属性决定\
  \ `ToolbarItem` 是作为图像（`Primary`）还是文本（`Secondary`）出现。Windows Phone 限制为四个 `Primary`\
  \ 项，而 iPhone 和 Android 超过这个数量就会开始变得拥挤，所以这是一个合理的限制。额外的 `Secondary` 项仅显示文本。在 iPhone\
  \ 上，它们出现在 `Primary` 项下方；在 Android 和 Windows Phone 上，直到用户点击垂直或水平省略号，它们才会显示在屏幕上。\n\
  \n当然，`Icon` 属性对 `Primary` 项至关重要，`Name` 属性对 `Secondary` 项至关重要，但 Windows Phone 还会使用\
  \ `Name` 在 `Primary` 项的图标下方显示简短的文本提示。\n\n当 `ToolbarItem` 被点击时，它会触发 `Activated` 事件，而不是\
  \ `Button` 那样的 `Clicked` 事件，但概念是相同的。（`ToolbarItem` 也有像 `Button` 一样的 `Command` 和\
  \ `CommandParameter` 属性；这些属性用于数据绑定，并且将在本预览版之外的后续章节中演示。）\n\n`ToolbarItem` 构造函数允许你指定所有这些属性（`Command`\
  \ 和 `CommandParameter` 除外）以及 `Activated` 事件的处理程序。\n\n`ToolbarItem` 的实例不能像视图那样添加到\
  \ `StackLayout` 中。它必须添加到 `Page` 的 `ToolbarItems` 属性中。这个 `ToolbarItems` 属性的类型是 `IList<ToolbarItem>`。一旦你将\
  \ `ToolbarItem` 添加到此集合中，`ToolbarItem` 的属性就不能再更改。这些属性设置会在内部用于构造特定于平台的对象。\n\n当然，使用\
  \ `ToolbarItem` 最困难的地方在于为 `Icon` 属性组装位图图像。每个平台对这些图标的颜色构成和尺寸有不同的要求，而且每个平台在图像方面也有略有不同的惯例。标准的图标用于\n\
  \n\n\n例如，共享功能在 Android 和 Windows Phone 上有所不同。\n\n出于这些原因，每个平台项目拥有自己的工具栏图标集合，而不是在公共的\
  \ PCL 项目中使用一组共享图标，这是合理的。然后 PCL 项目引用这些平台图像。\n\n让我们从提供适合 ToolbarItem 的图标集合的两个平台开始。\n\
  \n## Android 的图标\n\nAndroid 网站提供了可供下载的工具栏图标集合，网址如下：\n\nhttp://developer.android.com/design/downloads\n\
  \n下载名为“操作栏图标包”（Action Bar Icon Pack）的 ZIP 文件。\n\n解压缩后的内容组织为两个主要目录：Core_Icons（23\
  \ 张图像）和 Action Bar Icons（144 张图像）。这些全部是 PNG 文件，Action Bar Icons 按目录名称以四种不同的尺寸提供：\n\
  \n- drawable-mdpi（中等每英寸点数）— 32 像素见方\n- drawable-hdpi（高每英寸点数）— 48 像素见方\n- drawable-xhdpi（超高\
  \ DPI）— 64 像素见方\n- drawable-xxhdpi（超超高 DPI）— 96 像素见方\n\n这些目录名很特殊。它们与你在 Android 项目中用于存储所需图标位图的文件夹名称相同。如果你在这些目录中提供不同大小的图标，运行时将选择适合特定设备的尺寸。\n\
  \nCore_Icons 文件夹也将其图标排列到四个目录中，具有相同的四种尺寸，但这些目录名为 mdpi、hdpi、xhdpi 和 unscaled。\n\n\
  Action Bar Icons 文件夹还有一个额外的目录组织，使用 holo_dark 和 holo_light 名称。通常，对于 Android，你会希望使用透明背景上带有白色前景的\
  \ PNG 文件；这就是 holo_dark 文件夹中文件的颜色构成，意味着它们是为深色背景设计的。holo_light 图标在透明背景上带有黑色前景；它们在\
  \ Finder 和 Windows 资源管理器中更容易看到，但在大多数情况下，你应该使用 holo_dark 图标。\n\nCore_Icons 文件夹只包含透明背景上带有白色前景的图标。\n\
