  \n## 版本 12. 应用程序生命周期事件\n\n假设某人正在使用 NoteTaker 程序，并决定输入新笔记或编辑现有笔记。用户在 Entry 和 Editor\
  \ 视图中输入一些文本，然后被打断——也许是电话。之后，用户关闭了手机。\n\n下次启动 NoteTaker 程序时会发生什么？进行中的新笔记——或对现有笔记的编辑——是否应该被丢弃？这似乎不合理，但如果你考虑到\
  \ NoteTaker 仅在 NotePage 类的 OnDisappearing 重写期间保存笔记，那正是将要发生的事情。\n\n这个问题能做什么？一种方法是为\
  \ Entry 和 Editor 视图的 TextChanged 事件附加处理程序，并在每次文本更改时保存文件。但这会造成大量文件操作，而且如果用户决定取消编辑，你需要有某种特殊规定。\n\
  \n这个问题在过去并不是程序员所担心的。台式电脑上的程序有打开和保存文件的特定命令，如果你作为用户试图关闭程序而不先保存文档，程序会询问你是否要保存你的工作。但如果你碰巧在保存之前关掉了电脑，那就是你的问题了！\n\
  \n移动设备的期望非常不同。用户期望应用程序能准确记住他们上一次与程序交互时在做什么。\n\n```\nevent Action Suspending;\n\n\
  event Action Resuming;\n}\n}\n```\n\n只有两个事件，使用最简单的事件处理程序类型：不带参数且无返回值的 Action。\n\n\
  ### iOS 实现\n\n该接口的 iOS 实现的构造函数为 iOS 的 ObserveDidEnterBackground 和 ObserveWillEnterForeground\
  \ 通知设置了处理程序。当这些通知发生时，处理程序分别触发 Suspending 和 Resuming 事件：\n\n```\n[assembly: Dependency(typeof(PlatformHelpers.iOS.LifecycleHelper))]\n\
  \nnamespace PlatformHelpers.iOS\n{\n    class LifecycleHelper : ILifecycleHelper\n\
  \    {\n        public event Action Suspending;\n\n        public event Action Resuming;\n\
  \n        public LifecycleHelper()\n        {\n            UIApplication.Notifications.ObserveDidEnterBackground(\n\
  \                (sender, args) =>\n                {\n                    if (Suspending\
  \ != null)\n                        Suspending();\n                });\n\n     \
  \       UIApplication.Notifications.ObserveWillEnterForeground(\n              \
  \  (sender, args) =>\n                {\n                    if (Resuming != null)\n\
  \                        Resuming();\n                });\n        }\n    }\n}\n\
  ```\n\n不要忘记 Dependency 特性！\n\n### Android 实现\n\nAndroid 实现有点麻烦。Android 的 Activity\
  \ 类定义了受保护的虚拟 OnPause 和 OnResume 方法，因此你需要在标准 Xamarin.Forms 解决方案模板中创建的 MainActivity\
  \ 类中重写这些方法。这些重写随后应调用\n\n```\n{\n    App.NoteFolder.Notes.Add(note);\n}\n}\n\n//\
  \ Detach handlers for Suspending and Resuming events.\nhelper.Suspending -= OnSuspending;\n\
  helper.Resuming -= OnResuming;\n\nbase.OnDisappearing();\n}\n\nvoid OnSuspending()\n\
  {\n    // Save transient data and state.\n    string str = note.Filename + \"\\\
  x1F\" +\n        isNoteEdit.ToString() + \"\\x1F\" +\n        note.Title + \"\\\
  x1F\" +\n        note.Text;\n\n    // Run entire WriteTextAsync in separate thread.\n\
  \    Task task = Task.Run(() =>\n    {\n        FileHelper.WriteTextAsync(App.TransientFilename,\
  \ str);\n    });\n\n    // Wait for it to finish before finishing event handler.\n\
  \    task.Wait();\n}\n\nasync void OnResuming()\n{\n    // Delete transient data\
  \ and state.\n    if (await FileHelper.ExistsAsync(App.TransientFilename))\n   \
  \ {\n        await FileHelper.DeleteFileAsync(App.TransientFilename);\n    }\n}\n\
  }\n```\n\n但看看 OnSuspending 处理程序如何调用 FileHelper.WriteTextAsync：它用该调用定义了一个 lambda\
  \ 函数，并将其传递给一个返回 Task 对象的 Task.Run 创建方法，然后在该对象上调用 Wait。这是怎么回事？\n\n这解决了 Windows Phone\
  \ 中显现出的一个问题。当 Windows Phone 挂起程序时，当前的 PhoneApplicationService 会触发一个 Deactivated\
  \ 事件。当该 Deactivated 事件的处理程序返回时，Windows Phone 操作系统会假定应用程序已完成所有需要做的事情，然后挂起应用的活动。听起来合理，对吧？\n\
  \n然而，如果 Deactivated 处理程序正在调用异步方法——例如那些需要用于\n\n\n\nwriting program data to a file—then\
  \ the Deactivated handler returns control to the operating system at the first await\
  \ operator or the first assignment of a Completed handler. The process of saving\
  \ the file is still going on in the background, but these operations won’t complete\
  \ because the program is now suspended.\n\nTo get around that problem, the OnSuspending\
  \ handler passes the call to FileHelper.WriteTextAsync to a Task.Run creation method.\
  \ This causes the entire WriteTextAsync operation to run in a separate thread of\
  \ execution. The Wait call effectively waits for that entire operation to complete.\
  \ Because WriteTextAsync is not running in the user-interface thread, other code\
  \ can run in the user-interface thread during this time, but the OnSuspending handler\
  \ is blocked from concluding until WriteTextAsync has concluded.\n\nHomePage must\
