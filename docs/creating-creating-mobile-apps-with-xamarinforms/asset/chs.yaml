- '# Xamarin.Forms 移动应用创建






  ## 简介


  这是一本关于使用 Xamarin.Forms 编写应用程序的书的预览版。Xamarin.Forms 是 Xamarin 于 2014 年 5 月推出的面向 iOS、Android
  和 Windows Phone 的激动人心的移动开发新平台。Xamarin.Forms 让你可以使用 C# 和 XAML（可扩展应用程序标记语言）编写共享用户界面代码，这些代码会映射到这三个平台上的原生控件。


  这本书是预览版，因为它并不完整。它只有六章。我们预计最终版本将至少增加六章，并且这个预览版中的章节可能会得到充实、增强或完全重新构思。该书的最终版本可能会在 2015
  年春季出版。


  ## 本书读者对象


  本书面向那些希望使用单一代码库为三个最流行的移动平台（iOS、Android 和 Windows Phone）编写应用程序的 C# 程序员。Xamarin.Forms
  也适用于那些最终希望使用 C# 和 Xamarin.iOS 及 Xamarin.Android 库来针对这些平台原生应用程序编程接口（API）的程序员。Xamarin.Forms
  可以极大地帮助你入门这些平台，或者构建原型或概念验证应用程序。


  ### 前提假设


  本书假设你了解 C#，并且对 .NET Framework 的使用有一定程度的熟悉。然而，当我讨论一些对近期开始学习 C# 的程序员来说可能有些陌生的 C# 和
  .NET 特性时，我会放慢速度。特别是，第 3 章中引入 `async` 关键字和 `await` 运算符，是在一段展示如何使用传统回调方法进行异步编程的讨论之后。


  ## 本书的组织结构


  本书旨在作为学习 Xamarin.Forms 编程的教程。它不能替代在线 API 文档，你可以在 [http://api.xamarin.com/](http://api.xamarin.com/)
  页面的 Xamarin.Forms Framework 标题下找到这些文档。


  本预览版的第 1 章将在移动开发和 Xamarin 平台的更大背景中讨论 Xamarin.Forms，并涵盖你所需的硬件和软件配置。第 2 章探讨 Xamarin.Forms
  编程的一些基础知识，包括 `Label`、`Button` 和 `StackLayout` 的使用。


  通过 WiFi 连接一台安装了 Xcode 和 Xamarin 平台的 MacBook Pro。


  ## 下载：代码示例


  本书页面中显示的示例程序是于 9 月初使用 Xamarin.Forms 版本 1.2.2.6243 编译的。这些示例的源代码托管在 GitHub 上的一个仓库中：https://github.com/xamarin/xamarin-forms-book-preview/。


  你可以将目录结构克隆到本机本地驱动器，或者下载一个大 ZIP 文件。我会尽量保持代码与最新版本的 Xamarin.Forms 同步，并修复（或注释）任何可能漏掉的错误。


  你可以通过单击此 GitHub 页面上的 Issues 按钮来报告关于本书或源代码的问题、错误或其他反馈。你可以搜索现有问题或提交新问题。要提交新问题，你需要加入
  GitHub（如果尚未加入的话）。


  仅将 GitHub 页面用于涉及本书的问题。有关 Xamarin.Forms 本身的问题或讨论，请使用 Xamarin.Forms 论坛：http://forums.xamarin.com/categories/xamarin-forms。


  ## 更新代码示例


  构成 Xamarin.Forms 的库通过 NuGet 包管理器分发。Xamarin.Forms 包由五个动态链接库组成：Xamarin.Forms.Core.dll、Xamarin.Forms.Xaml.dll、Xamarin.Forms.Platform.iOS.dll、Xamarin.Forms.Platform.Android.dll
  和 Xamarin.Forms.Platform.WP8.dll。Xamarin.Forms 包还需要 Xamarin Support Library v4（Xamarin.Android.Support.v4.dll）和
  Windows Phone Toolkit（Microsoft.Phone.Controls.Toolkit.dll），它们应会自动包含。


  当你使用 Visual Studio 或 Xamarin Studio 创建新的 Xamarin.Forms 解决方案时，某个版本的 Xamarin.Forms
  包会成为该解决方案的一部分。但是，这可能不是 NuGet 提供的最新 Xamarin.Forms 包。以下是更新该包的方法：


  在 Visual Studio 中，右键单击解决方案资源管理器中的解决方案名称，然后选择**管理解决方案的 NuGet 包**。在对话框左侧选择“已安装的包”以查看当前安装的内容，并在左侧选择**更新**和**nuget.org**以更新包。如果有可用更新，单击**全部更新**按钮是最容易将其放入解决方案的方法。


  在 Xamarin Studio 中，在“解决方案”列表中各个项目的“包”下，选择 Xamarin.Forms 包，然后从工具下拉菜单中选择“更新”。


  存储在 GitHub 上的本书源代码不包含实际的 NuGet 包。Xamarin Studio 会在你加载解决方案时自动下载它们，但 Visual Studio
  不会。首次将解决方案加载到 Visual Studio 后，右键单击解决方案资源管理器中的解决方案名称，然后选择**管理解决方案的 NuGet 包**。你应该会在对话框顶部看到一个**还原**按钮，可以利用它还原包。然后，你可以通过选择左侧的**更新**和**nuget.org**并（如果有更新）按下**全部更新**按钮来更新包。


