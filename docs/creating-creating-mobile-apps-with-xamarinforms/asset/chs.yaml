  到目前为止，程序的所有版本都包含一个派生自 `ContentPage` 的类，该类显示一个用户界面，允许用户输入和编辑两段文本。这两段文本也存储在一个名为 `Note`\
  \ 的类中。此 `Note` 类存储了页面类用户界面的底层数据。\n\n这两个类实际上是同一数据的两个方面——一个类为用户编辑数据提供呈现，另一个类处理更低级别的任务，包括在文件系统中的加载和保存数据。\n\
  \n理想情况下，在任何时候，这两个类都应该处理相同的数据。但事实并非如此。页面类不知道 `Note` 类中的数据何时发生变化，而 `Note` 类也不知道 `Entry`\
  \ 和 `Editor` 视图中的文本何时发生变化。\n\n保持用户界面与底层数据同步是一个常见问题，并且有标准解决方案可以修复该问题。其中最重要的一项是名为\
  \ `INotifyPropertyChanged` 的接口。它在 .NET 的 `System.ComponentModel` 命名空间中定义如下：\n\n\
  ```\n```csharp\ninterface INotifyPropertyChanged\n{\n    event PropertyChangedEventHandler\
  \ PropertyChanged;\n}\n```\n```\n\n整个接口仅由一个名为 `PropertyChanged` 的事件组成，但该事件为类提供了一种简单通用的方式来通知可能感兴趣的任何其他类其某个属性的值已更改。\n\
  \n```\n{\n    text = value;\n    if (PropertyChanged != null)\n    {\n        PropertyChanged(this,\
  \ new PropertyChangedEventArgs(\"Text\"));\n    }\n}\nget\n{\n    return text;\n\
  }\n}\npublic void Save(string filename)\n{\n    string text = this.Title + \"\\\
  n\" + this.Text;\n    FileHelper.WriteAllText(filename, text, () => { });\n}\npublic\
  \ void Load(string filename)\n{\n    FileHelper.ReadAllText(filename, (string text)\
  \ =>\n    {\n        // Break string into Title and Text.\n        int index = text.IndexOf('\\\
  n');\n        this.Title = text.Substring(0, index);\n        this.Text = text.Substring(index\
  \ + 1);\n    });\n}\n}\n```\n\n各种 FileHelper 类与 NoteTaker3Pcl 中的相同。\n\nNoteTaker4Page\
  \ 类将 `Note` 的实例定义为字段（如程序的上一版本），但现在构造函数还附加了 `Note` 现在定义的 PropertyChanged 事件的处理程序：\n\
  \n```\nnote.PropertyChanged += (sender, args) =>\n{\n    switch (args.PropertyName)\n\
  \    {\n        case \"Title\":\n            entry.Text = note.Title;\n        \
  \    break;\n        case \"Text\":\n            entry.Text = note.Text;\n     \
  \       break;\n    }\n};\n```\n\n这当然可以是一个命名事件处理程序，并且它可以使用 if 和 else 而不是 switch\
  \ 和 case 来识别正在更改的属性。然后它将属性的新值设置为 `Entry` 或 `Editor` 的 Text 属性。\n\n看起来不错，但它在 Windows\
  \ Phone 上仍然无法工作。当你点击 Load 按钮时，你会得到一个 Unauthorized Access 异常。现在问题出在哪里？\n\n问题在于：通常情况下，异步方法的回调不会在发起操作的同一线程中执行。相反，回调在执行异步操作的后台线程中执行。\n\
  \n让我们逐步跟踪：当你按下 Load 按钮时，Windows Phone 的 ReadAllText 方法执行。当文本获取到后，它会在另一个执行线程中调用 completed\
  \ 方法。在 `Note` 中的 Load 方法中，该 completed 方法设置 Title 和 Text 属性。新的 Title 属性导致 PropertyChanged\
  \ 事件触发，而在该处理程序中，新的 Title 属性被设置为 Entry 视图的 Text 属性。\n\n因此，Entry 视图是从用户界面线程以外的线程访问的，而这是不允许的。这就是为什么会引发异常。\n\
  \n幸运的是，这个问题的修复方法相当简单。`Device` 类有一个 `BeginInvokeOnMainThread` 方法，其参数类型为 `Action`。只需将你想要在\
  \ UI 线程中执行的代码封装在该 `Action` 参数的主体中。最简单的方法是将整个 switch 和 case 包装在该回调中：\n\n```\nnote.PropertyChanged\
  \ += (sender, args) =>\n{\n    Device.BeginInvokeOnMainThread(() =>\n    {\n   \
  \     switch (args.PropertyName)\n        {\n            case \"Title\":\n     \
  \           entry.Text = note.Title;\n                break;\n\n            case\
  \ \"Text\":\n                editor.Text = note.Text;\n                break;\n\
  \        }\n    });\n};\n```\n\n`Device.BeginInvokeOnMainThread` 有效地等待 UI 线程从操作系统的线程调度程序获得时间片，然后运行指定的代码。\n\
  \n有了这个更改，你会发现重新运行 Windows Phone 应用后，你只需按一次 Load，Entry 和 Editor 就会被设置成保存的值。它们不是在\
  \ Load 按钮的处理程序中设置的，而是在属性实际使用从文件加载的值更新时，在 PropertyChanged 处理程序中设置的。\n\n\n\n\n\n```csharp\n\
