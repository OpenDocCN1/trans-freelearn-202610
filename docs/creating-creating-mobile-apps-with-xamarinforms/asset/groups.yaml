    \ null);                                       // initial value\n    ...\n}\n\
    ```\n\n这是一个相对简单的可绑定属性定义。提供了属性名和类型，以及定义属性的类类型和初始值。对 BindableProperty.Create 方法的更广泛使用允许你指定在属性即将更改时、更改后调用的方法，以及用于验证和强制转换。\n\
    \n正常的 Text 属性随后以非常标准的方式引用可绑定属性：\n\n```csharp\nclass RadioButton : ContentView\n\
    {\n    ...\n    public string Text\n    {\n        set { SetValue(TextProperty,\
    \ value); }\n        get { return (string)GetValue(TextProperty); }\n    }\n \
    \   ...\n}\n```\n\n你会注意到 BindableProperty.Create 方法需要属性名作为文本字符串，如果你拼写错误，属性将无法正常工作，而且很难追踪问题。因此，可用的\
    \ Create 方法的泛型替代方案会为你推导属性名和类型。RadioButton 使用其中一种方法来定义 Font 属性：\n\n```csharp\n\
    class RadioButton : ContentView\n{\n    ...\n    // Define the Font bindable property\
    \ and property.\n    public static readonly BindableProperty FontProperty =\n\
    ```\n\n"
