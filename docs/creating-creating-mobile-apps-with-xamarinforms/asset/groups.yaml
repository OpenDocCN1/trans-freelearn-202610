    ## A ScrollView in a StackLayout?\n\nIt is common to put a `StackLayout` in a\
    \ `ScrollView`, but can you put a `ScrollView` in a `StackLayout`? And why would\
    \ you even want to?\n\nIt’s a general rule in layout systems like the one in Xamarin.Forms\
    \ that you can’t put a scroll in a stack. A `ScrollView` needs to have a specific\
    \ height in order to compute the difference between the height of its content\
    \ and its own height. That difference is the amount that the `ScrollView` can\
    \ scroll its contents. If the `ScrollView` is in a `StackLayout`, it doesn’t get\
    \ that specific height. The `StackLayout` wants the `ScrollView` to be as short\
    \ as possible, and that’s either the height of the `ScrollView` contents, or zero,\
    \ and neither solution works.\n\nSo why would you want a `ScrollView` in a `StackLayout`\
    \ anyway?\n\nSometimes it’s precisely what you need. Consider a primitive e-book\
    \ reader that implements scrolling. You might want a `Label` at the top of the\
    \ page always displaying the book’s title, followed by a `ScrollView` containing\
    \ a `StackLayout` with the content of the book itself. It would be convenient\
    \ for that `Label` and the `ScrollView` to be children of a `StackLayout` that\
    \ fills the page.\n\nWith Xamarin.Forms, such a thing is possible. If you give\
    \ the `ScrollView` a `VerticalOptions` setting of `LayoutOptions.FillAndExpand`,\
    \ it can indeed be a child of a `StackLayout`. The `StackLayout` will give the\
    \ `ScrollView` all the extra space not required by the other children, and the\
    \ `ScrollView` will then have a specific height.\n\nThe **BlackCat** project displays\
    \ the text of Edgar Allan Poe’s short story “The Black Cat,” which is stored in\
    \ a text file named TheBlackCat.txt in a one-line-per-paragraph format.\n\nIt\
    \ is sometimes convenient to embed files that an application requires (such as\
    \ this short story) right in the program executable or—in the case of a Xamarin.Forms\
    \ application—right in the Portable Class Library DLL. These files are known as\
    \ embedded resources, and that’s what the TheBlackCat.txt file is in this program.\n\
    \n**BlackCat** is a PCL application. It is possible to do something similar in\
    \ an SAP application, but it’s a little more difficult because the three platforms\
    \ reference the resource with different names.\n\nTo make an embedded resource\
    \ in either Visual Studio or Xamarin Studio, you’ll probably first want to create\
    \ a folder in the project by selecting the **Add > New Folder** option from the\
    \ project menu. A folder for text files might be called **Texts**, for example.\
    \ The folder is optional, but it helps organize program assets. Then, to that\
    \ folder, you can select the **Add > Existing Item** in Visual Studio, or **Add\
    \ > Add Files** in Xamarin Studio. Navigate to the file, select and click **Add**\
    \ in Visual Studio, or **Open** in Xamarin Studio.\n\nNow here’s the important\
    \ part: Once the file is part of the project, bring up the **Properties** dialog\
    \ from the menu associated with the file. Specify that the **Build Action** for\
    \ the file is **Embedded-Resource**. This is an easy step to forget, but it is\
    \ essential.\n\nThis was done for the **BlackCat** project, and consequently the\
    \ TheBlackCat.txt file is embedded in the BlackCat.dll file.\n\nIn code, the file\
    \ can be retrieved by calling the `GetManifestResourceStream` method defined by\
    \ the `Assembly` class in the `System.Reflection` namespace. To get the assembly\
    \ of the PCL, all you need to do is get the `Type` of any class defined in the\
    \ assembly. You can use `typeof` with the page type you’ve derived from `ContentPage`,\
    \ or `GetType` on the instance of that class. Then call `GetTypeInfo` on this\
    \ `Type` object. `Assembly` is a property of the resultant `TypeInfo` object:\n\
    \n```\nAssembly assembly = this.GetType().GetTypeInfo().Assembly;\n```\n\nIn the\
    \ `GetManifestResourceStream` method of `Assembly` you’ll need to specify the\
    \ name of the resource. For embedded resources, that name is not the filename\
