    ## Introduction


    This is a Preview Edition of a book about writing applications for Xamarin.Forms,
    the exciting new mobile development platform for iOS, Android, and Windows Phone
    unveiled by Xamarin in May 2014. Xamarin.Forms lets you write shared user-interface
    code in C# and XAML (the eXtensible Application Markup Language) that maps to
    native controls on these three platforms.


    This book is a Preview Edition because it''s not complete. It has only six chapters.
    We anticipate that the final version of the book will have at least half a dozen
    additional chapters and that the chapters in this Preview Edition might be fleshed
    out, enhanced, or completely reconceived. The final edition of the book will probably
    be published in the spring of 2015.


    ## Who should read this book


    This book is for C# programmers who want to write applications for the three most
    popular mobile platforms: iOS, Android, and Windows Phone with a single code base.
    Xamarin.Forms also has applicability for those programmers who want eventually
    to use C# and the Xamarin.iOS and Xamarin.Android libraries to target the native
    application programming interfaces (APIs) of these platforms. Xamarin.Forms can
    be a big help in getting started with these platforms or in constructing a prototype
    or proof-of-concept application.


    ### Assumptions


    This book assumes that you know C# and have some familiarity with the use of the
    .NET Framework. However, when I discuss some C# and .NET features that might be
    somewhat new to recent C# programmers, I adopt a somewhat slower pace. In particular,
    the introduction of the `async` keyword and `await` operator in Chapter 3 follows
    a discussion that shows how to do asynchronous programming using traditional callback
    methods.


    ## Organization of this book


    This book is intended as a tutorial to learn Xamarin.Forms programming. It is
    not a replacement for the online API documentation, which can be found here under
    the heading Xamarin.Forms Framework on this page: [http://api.xamarin.com/](http://api.xamarin.com/).


    This Preview Edition''s Chapter 1 discusses Xamarin.Forms in the larger context
    of mobile development and the Xamarin platform and also covers the hardware and
    software configurations you''ll need. Chapter 2 explores some of the basics of
    Xamarin.Forms programming, including the use of `Label`, `Button`, and `StackLayout`.


    connected by WiFi with a MacBook Pro installed with Xcode and the Xamarin Platform.


    ## Downloads: Code samples


    The sample programs shown in the pages of this book were compiled in early September
    with version 1.2.2.6243 of Xamarin.Forms. The source code of these samples is
    hosted on a repository on GitHub: https://github.com/xamarin/xamarin-forms-book-preview/.


    You can clone the directory structure to a local drive on your machine, or download
    a big ZIP file. I''ll try to keep the code updated with the latest release of
    Xamarin.Forms and to fix (and comment) any errors that might have sneaked through.


    You can report problems, bugs, or other kinds of feedback about the book or source
    code by clicking the Issues button on this GitHub page. You can search through
    existing issues or file a new one. To file a new issue, you''ll need to join GitHub
    (if you haven''t already).


    Use this GitHub page only for issues involving the book. For questions or discussions
    about Xamarin.Forms itself, use the Xamarin.Forms forum: http://forums.xamarin.com/categories/xamarin-forms.


    ## Updating the code samples


    The libraries that comprise Xamarin.Forms are distributed via the NuGet package
    manager. The Xamarin.Forms package consists of five dynamic-link libraries: Xamarin.Forms.Core.dll,
    Xamarin.Forms.Xaml.dll, Xamarin.Forms.Platform.iOS.dll, Xamarin.Forms.Platform.Android.dll,
    and Xamarin.Forms.Platform.WP8.dll. The Xamarin.Forms package also requires Xamarin
    Support Library v4 (Xamarin.Android.Support.v4.dll) and the Windows Phone Toolkit
    (Microsoft.Phone.Controls.Toolkit.dll), which should be automatically included.


    When you create a new Xamarin.Forms solution using Visual Studio or Xamarin Studio,
    a version of the Xamarin.Forms package becomes part of that solution. However,
    that might not be the latest Xamarin.Forms package available from NuGet. Here''s
    how to update that package:


    In Visual Studio, right-click the solution name in the Solution Explorer and select
    Manage NuGet Packages for Solution. Select Installed packages at the left of the
    dialog to see what''s currently installed, and Updates and nuget.org at the left
    to choose to update the package. If an update is available, clicking the Update
    All button is easiest to get it into the solution.


    In Xamarin Studio, in the individual projects in the Solution list, under Packages,
    select the Xamarin.Forms package and select Update from the tool dropdown.


    The source code for this book that is stored on GitHub does not include the actual
    NuGet packages. Xamarin Studio will automatically download them when you load
    the solution, but Visual Studio will not. After you first load the solution into
    Visual Studio, right-click the solution name in the Solution Explorer and select
    **Manage NuGet Packages for Solution**. You should be given the option to restore
    the packages with a **Restore** button at the top of the dialog. You can then
    update the package by selecting **Updates** and **nuget.org** at the left and
    (if an update exists) pressing the **Update All** button.


