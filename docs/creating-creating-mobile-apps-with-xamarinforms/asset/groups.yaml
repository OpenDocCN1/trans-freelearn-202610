    \ full name.\n    string name = parentClass.Type.Name;\n    TypeInfo typeInfo\
    \ = parentClass.Type.GetTypeInfo();\n\n    if (typeInfo.Assembly != xamarinFormsAssembly)\n\
    \    {\n        name = parentClass.Type.FullName;\n    }\n\n    // If generic,\
    \ display angle brackets and parameters.\n    if (typeInfo.IsGenericType)\n  \
    \  {\n        Type[] parameters = typeInfo.GenericTypeParameters;\n        name\
    \ = name.Substring(0, name.Length - 2);\n        name += \"<\";\n\n        for\
    \ (int i = 0; i < parameters.Length; i++)\n        {\n            name += parameters[i].Name;\n\
    \            if (i < parameters.Length - 1)\n                name += \", \";\n\
    \        }\n        name += \">\";\n    }\n\n    // Create Label and add to StackLayout\n\
    \    Label label = new Label\n    {\n        Text = String.Format(\"{0}{1}\",\
    \ new string(' ', 4 * level), name),\n        TextColor = parentClass.Type.GetTypeInfo().IsAbstract\
    \ ?\n            Color.Accent : Color.Default\n    };\n\n    stackLayout.Children.Add(label);\n\
    \n    // Now display nested types.\n```\n\n```\nforeach (ClassAndSubclasses subclass\
    \ in parentClass.Subclasses)\n    AddItemToStackLayout(subclass, level + 1);\n\
    }\n```\n\nThe recursive AddChildrenToParent method assembles the linked list of\
    \ ClassAndSubclasses instances from the flat classList collection.\n\nThe AddItemToStackLayout\
    \ is also recursive because it is responsible for adding the ClassesAndSubclasses\
    \ linked list to the StackLayout object by creating a Label view for each class\
    \ with a little blank space at the beginning for the proper indentation.\n\nThe\
    \ method displays the Xamarin.Forms types with just the class names but the .NET\
    \ types with the fully-qualified name to distinguish them. The method uses the\
    \ platform highlight color for classes that are not instantiable either because\
    \ they are abstract or static:\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_202_0.png)\n\
    \nOverall, you'll see that the Xamarin.Forms visual elements have the following\
    \ general hierarchy:\n\n```\nSystem.Object\n    BindableObject\n        Element\n\
    \            VisualElement\n                View\n                    ...\n  \
    \                  Layout\n                        ...\n                     \
    \   Layout<T>\n```\n"
