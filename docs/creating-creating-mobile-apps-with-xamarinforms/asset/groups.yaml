    \ | 255 | 255 | 255 | 0 | 0 | 1.00 |\n| Silver | 192 | 192 | 192 | 0 | 0 | 0.75\
    \ |\n| Gray | 128 | 128 | 128 | 0 | 0 | 0.50 |\n| Black | 0 | 0 | 0 | 0 | 0 |\
    \ 0 |\n| Red | 255 | 0 | 0 | 1.00 | 1 | 0.50 |\n| Maroon | 128 | 0 | 0 | 1.00\
    \ | 1 | 0.25 |\n\n例如，也可以使用视图集合初始化 `Children` 方法，其方式类似于之前初始化 `FormattedString`\
    \ 对象的 `Spans` 集合。\n\n`ColorList` 程序将页面的 `Content` 属性设置为 `StackLayout` 对象，然后使用\
    \ 16 个 `Label` 视图初始化其 `Children` 属性：\n\n```csharp\nclass ColorListPage : ContentPage\n\
    {\n    public ColorListPage()\n    {\n        this.Padding =\n            new\
    \ Thickness (5, Device.OnPlatform (20, 5, 5), 5, 5);\n\n        this.Content =\
    \ new StackLayout\n        {\n            Children =\n            {\n        \
    \        new Label\n                {\n                    Text = \"White\",\n\
    \                    TextColor = Color.White\n                },\n           \
    \     new Label\n                {\n                    Text = \"Silver\",\n \
    \                   TextColor = Color.Silver\n                },\n\n         \
    \       …\n\n                new Label\n                {\n                  \
    \  Text = \"Purple\",\n                    TextColor = Color.Purple\n        \
    \        }\n            }\n        };\n    }\n}\n```\n\n不必查看全部 16 个子 `Label` 视图的代码，了解这个示例即可。下面是运行结果：\n\
    \n```csharp\n// 遍历 Color 结构的属性。\nforeach (PropertyInfo propInfo in\n         \
    \    typeof(Color).GetRuntimeProperties())\n{\n    MethodInfo methodInfo = propInfo.GetMethod;\n\
    \n    if (methodInfo.IsPublic &&\n        methodInfo.IsStatic &&\n        methodInfo.ReturnType\
    \ == typeof(Color))\n    {\n        stackLayout.Children.Add(\n            CreateColorLabel((Color)\
    \ propInfo.GetValue(null),\n                             propInfo.Name));\n  \
    \  }\n}\n\nthis.Padding = new Thickness(5, Device.OnPlatform(20, 5, 5), 5, 5);\n\
    \n// 将 StackLayout 放入 ScrollView。\nthis.Content = new ScrollView\n{\n    Content\
    \ = stackLayout\n};\n}\n\nLabel CreateColorLabel(Color color, string name)\n{\n\
    \    Color backgroundColor = Color.Default;\n\n    if (color != Color.Default)\n\
    \    {\n        // 标准亮度计算\n        double luminance = 0.30 * color.R +\n     \
    \                      0.59 * color.G +\n                           0.11 * color.B;\n\
    \n        backgroundColor = luminance > 0.5 ? Color.Black : Color.White;\n   \
    \ }\n\n    // 创建 Label。\n    return new Label\n    {\n        Text = name,\n \
    \       TextColor = color,\n        BackgroundColor = backgroundColor,\n     \
    \   Font = Font.SystemFontOfSize(NamedSize.Large)\n    };\n}\n```\n\n在构造函数的末尾，`StackLayout`\
    \ 被设置为 `ScrollView` 的 `Content` 属性，而后者又被设置为页面的 `Content` 属性。\n\n在代码中向 `StackLayout`\
    \ 添加子项时，通常最好让 `StackLayout` 与最终显示它的页面保持断开状态。每添加一个新子项，`StackLayout` 的大小都会发生变化；如果\
    \ `StackLayout` 已经连接到页面，就会产生大量并不必要的布局活动。\n\n该类中的 `CreateColorLabel` 方法通过设置具有对比度的背景色，尝试让每种颜色都清晰可见。该方法根据红、绿、蓝三个分量的标准加权平均值计算亮度，然后选择白色或黑色作为背景色。\n\
    \n这种方法不适用于 `Transparent`，因此完全无法显示该项；对于 `Color.Default`，该方法将其作为特殊情况处理，并使用 `Color.Default`\
    \ 作为背景显示该颜色（无论它实际是什么颜色）。\n\n下面是运行结果，但其美观程度仍然相当有限：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_62_0.png)\n\
    \n不过，你可以滚动查看该显示内容。\n\n前面提到过，`Layout<T>` 类定义了 `StackLayout` 所继承的 `Children` 属性。泛型\
    \ `Layout<T>` 类派生自非泛型的 `Layout` 类，而 `ScrollView` 也派生自这个非泛型的 `Layout` 类。从理论上讲，`ScrollView`\
    \ 是一种布局对象——即使它只有一个子项。\n\n从屏幕截图可以看到，`Label` 的背景色延伸到了 `StackLayout` 的整个宽度，这意味着每个\
    \ `Label` 都与 `StackLayout` 一样宽。\n\n让我们进行一些实验，以便更好地理解 Xamarin.Forms 的布局。对于这些实验，可以暂时为\
    \ `StackLayout` 和 `ScrollView` 设置不同的背景色：\n\n```csharp\nclass ReflectedColorsPage\
    \ : ContentPage\n{\n    public ReflectedColorsPage()\n    {\n        StackLayout\
    \ stackLayout = new StackLayout\n        {\n            BackgroundColor = Color.Blue\n\
    \        };\n        ...\n        this.Content = new ScrollView\n        {\n \
    \           BackgroundColor = Color.Red,\n            Content = stackLayout\n\
    \        };\n    }\n    ...\n}\n```\n\n布局对象通常默认具有透明背景，因此虽然它们会占据屏幕上的区域，却不会直接显示出来。为布局对象临时设置颜色，是准确查看它们在屏幕上位置的好方法。这也是调试复杂布局的一种实用技巧。\n\
    \n你会发现，蓝色的 `StackLayout` 会在各个 `Label` 视图之间的空隙中显现出来——这是 `StackLayout` 的默认 `Spacing`\
    \ 属性造成的；此外，它还会透过 `Color.Default` 对应的 `Label` 显现出来，因为该 `Label` 具有透明背景。\n\n尝试将所有\
    \ `Label` 视图的 `HorizontalOptions` 属性设置为 `LayoutOptions.Start`：\n\n```csharp\n\
    return new Label\n{\n    Text = name,\n    TextColor = color,\n    BackgroundColor\
    \ = backgroundColor,\n    Font = Font.SystemFontOfSize(NamedSize.Large),\n   \
    \ HorizontalOptions = LayoutOptions.Start\n};\n```\n\n现在，`StackLayout` 的蓝色背景更加明显了，因为所有\
    \ `Label` 视图只占用文本所需的水平空间，并且都被推到左侧。由于每个 `Label` 视图的宽度不同，这种显示效果甚至比第一个版本更难看！\n\n\
    现在移除 `Label` 中的 `HorizontalOptions` 设置，改为在 `StackLayout` 上设置 `HorizontalOptions`：\n\
    \n```csharp\nStackLayout stackLayout = new StackLayout\n{\n```\n\n"
