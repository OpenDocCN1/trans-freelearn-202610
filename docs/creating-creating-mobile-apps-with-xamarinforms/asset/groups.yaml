    particular platform.


    Two methods named OnPlatform provide even more elegant solutions:


    +   - The static generic method OnPlatform<T> takes three arguments of type T,
    the first for iOS, the second for Android, and the third for Windows Phone, and
    returns the argument for the running platform.

    +   - The static method OnPlatform has four arguments of type Action (the .NET
    function delegate that has no arguments and returns void) also in the order iOS,
    Android, and Windows Phone, with a fourth for a default, and executes the argument
    for the running platform.


    The Device class also defines a static method to start running a timer, to invoke
    the phone’s email or telephone dialer, and to run some code on the main thread.
    This latter method (called Device.BeginInvokeOnMainThread) comes in handy when
    you’re working with asynchronous methods and supplemental threads because code
    that manipulates the user interface can generally only be run on the main user-interface
    thread.


    Rather than setting the same Padding property on all three platforms, you can
    restrict the Padding to just the iPhone by using the Device.OnPlatform generic
    method:


    ```

    double topPadding = Device.OnPlatform<double>(20, 0, 0);

    this.Padding = new Thickness(0, topPadding, 0, 0);

    ```


    Explicitly specifying the type of the Device.OnPlatform arguments within the angle
    brackets isn’t required if the compiler can figure it out from the arguments.
    In this case, if the double in angle brackets is removed, the compiler would determine
    that the arguments are integers and then implicitly convert the integer to a double
    in the assignment statement.


    You can simplify this code to just:


    ```

    this.Padding = new Thickness (0, Device.OnPlatform (20, 0, 0), 0, 0);

    ```


    This is how the Padding will be set in the programs that follow when it’s required.
    Of course, you can substitute some other numbers for the 0’s if you want some
    additional padding on the page. Sometimes a little padding on the sides makes
    for a more attractive display.


    In Shared Asset Projects you can use the C# preprocessor directives #if and #elif
    as shown earlier, but the Device class has the advantage of working with both
