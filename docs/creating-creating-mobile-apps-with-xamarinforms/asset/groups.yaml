  - "[PAGE 47]\n\nLabel also allows specifying color, and a little experimentation\
    \ with color will demonstrate the profound difference between HorizontalOptions\
    \ and VerticalOptions, and XAlign and YAlign.\n\n# Text and background colors\n\
    \nAs you've seen, the Label view displays text in a color appropriate for the\
    \ device. You can override that behavior by setting two properties named TextColor\
    \ and BackgroundColor. Label itself defines TextColor but inherits BackgroundColor\
    \ from VisualElement, which means that Page and Layout also have a BackgroundColor\
    \ property.\n\nYou set TextColor and BackgroundColor to a value of type Color,\
    \ which is a structure that defines 16 static fields for obtaining common colors.\
    \ Here are two of them used in conjunction with XAlign and YAlign to center the\
    \ text:\n\n```\nclass GreetingsPage : ContentPage\n{\n    public GreetingsPage()\n\
    \    {\n        this.Content = new Label\n        {\n            Text = \"Greetings,\
    \ Xamarin.Forms!\",\n            XAlign = TextAlignment.Center,\n            YAlign\
    \ = TextAlignment.Center,\n            BackgroundColor = Color.Yellow,\n     \
    \       TextColor = Color.Blue\n        };\n    }\n}\n```\n\nThe result might\
    \ surprise you. As these screenshots illustrate, the Label actually occupies the\
    \ entire area of the page (including underneath the iOS status bar), and the XAlign\
    \ and YAlign properties position the text within that entire area:"
