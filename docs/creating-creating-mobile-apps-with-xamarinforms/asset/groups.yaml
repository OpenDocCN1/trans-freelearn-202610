    \ 继承了 `Children` 属性）。`Grid` 和 `RelativeLayout` 实现了更复杂的布局模型；`Grid` 将在下一章中探讨，而 `RelativeLayout`\
    \ 将在本预览版未包含的后续章节中介绍。\n\n乍一看，`AbsoluteLayout` 类实现了一种相当原始的布局模型——一种可回溯到早期图形用户界面那段并不那么美好的旧时光的模型，那时程序员必须逐个调整屏幕上每个元素的大小和位置。\n\
    \n使用 `AbsoluteLayout` 时，到目前为止你学到的大部分布局规则都不再适用。当 `View` 是 `ContentPage` 或 `StackLayout`\
    \ 的子元素时，`HorizontalOptions` 和 `VerticalOptions` 属性非常重要；但当 `View` 是 `AbsoluteLayout`\
    \ 的子元素时，它们*完全没有效果*。相反，程序必须为 `AbsoluteLayout` 的每个子元素指定一个特定位置。子元素也可以被赋予特定大小，或者允许其自行确定大小。\n\
    \n你可以像使用 `StackLayout` 一样，将子视图添加到 `AbsoluteLayout` 的 `Children` 集合中：\n\n```\n\
    absoluteLayout.Children.Add(child);\n```\n\n附加可绑定属性是一种通用机制，允许一个类定义的属性存储在另一个类的实例中，但附加可绑定属性主要用于布局类。正如你将在下一章中看到的，`Grid`\
    \ 定义了附加可绑定属性来指定每个子元素的行和列。\n\n程序可能很难为 `AbsoluteLayout` 的子元素确定合适的宽度和高度，但通常你并不需要这样做。如果你在传递给\
