    \ 1);\n    Grid.SetRow(controllersStack, 0);\n}\n}\n\n...\n\n}\n```\n```\n\nThe\
    \ event handler for the three `Label` views that function as radio buttons has\
    \ two jobs: to set the `Opacity` of the `Label` to indicate which has been selected,\
    \ and to set a new color mode. However, the job of actually making all the changes\
