    program.


    You might wonder: What are the default values of the TextColor and BackgroundColor
    properties, because the default values result in different colors for the different
    platforms?


    The default values of TextColor and BackgroundColor are actually a special color
    value named Color.Default that does not represent a real color but instead is
    used to reference the text and background colors appropriate for the particular
    platform.


    Let’s explore color in more detail.


    # The Color structure


    Internally, the Color structure stores colors in two different ways:


    +   - As red, green, and blue (RGB) values of type double that range from 0 to
    1. Read-only properties named R, G, and B expose these values.

    +   - As hue, saturation, and luminosity values of type double that also range
    from 0 to 1. These values are exposed with read-only properties named Hue, Saturation,
    and Luminosity.


    The Color structure also supports an alpha channel for indicating degrees of opacity.
