  md: "\nStrictly speaking, data bindings are not a necessary part of the Xamarin.Forms\
    \ interface. Everything you can do with a data binding you can do with explicit\
    \ event handlers. But data bindings can install and manage these event handlers\
    \ for you, so they allow you to write code with less event processing, and which\
    \ consequently appears to have fewer “moving parts.”\n\nOne element of a data\
    \ binding definition that is vulnerable to bugs is the source property name, which\
    \ you indicate with a text string. Visual Studio and Xamarin Studio won’t warn\
    \ you if you’ve spelled it wrong, but the binding won’t work, and the problem\
    \ might be difficult to find.\n\nYou can avoid spelling errors with a generic\
    \ form of the SetBinding method. Earlier you saw a binding to the Opacity property\
    \ of the Label from the Value property of the Slider defined like this:\n\n```csharp\n\
    sliderValueLabel.SetBinding (Label.OpacityProperty, \"Value\");\n```\n\nYou can\
    \ alternately use this form:\n\n```csharp\nsliderValueLabel.SetBinding<Slider>\
    \ (Label.OpacityProperty, src => src.Value);\n```\n\nThe generic argument is Slider,\
    \ which is the type of the source object, and the source Value property is indicated\
    \ as a lambda expression that accesses the property. The method uses .NET reflection\
    \ to obtain the string property name.\n\nYou can do something similar with the\
    \ longer version of the SetBinding method. Here’s the statement that binds the\
    \ Text property of the Label to the Value property of the Slider:\n\n```csharp\n\
    sliderValueLabel.SetBinding (Label.TextProperty,\n    new Binding (\"Value\",\
    \ BindingMode.Default, null, null,\n        \"The Slider value is {0:F2}\"));\n\
    ```\n\nRather than using a Binding constructor as the second argument you can\
    \ use a static (and generic) Binding.Create method:\n\n```csharp\nsliderValueLabel.SetBinding\
    \ (Label.TextProperty,\n    Binding.Create<Slider> (src => src.Value, BindingMode.Default,\
    \ null, null,\n        \"The Slider value is {0:F2}\"));\n```\n\nThese alternative\
    \ forms are much preferred if you’re also developing the code that defines the\
    \ source properties, because you can rename these source properties without fear\
    \ of breaking the code defining the data bindings.\n\nHere’s a new version of\
    \ the WhatSize program that uses both forms of Binding creation (a practice that\
    \ in real life might make people who need to work on the program sometime later\
    \ wonder at this apparent intention of inconsistency):\n\n```csharp\nclass WhatSizeBindingsPage\
    \ : ContentPage\n{\n    public WhatSizeBindingsPage()\n    {\n        Font font\
    \ = Font.SystemFontOfSize(NamedSize.Large);\n\n        // Create Label views for\
    \ displaying page width and height.\n        Label widthLabel = new Label\n  \
    \      {\n            Font = font\n        };\n\n        Label heightLabel = new\
    \ Label\n        {\n            Font = font\n        };\n\n        // Define bindings\
    \ on Labels.\n        widthLabel.BindingContext = this;\n        widthLabel.SetBinding\
    \ (Label.TextProperty,\n            Binding.Create<ContentPage> (src => src.Width,\n\
    \                BindingMode.OneWay,\n                null, null, \"{0:F0}\"));\n\
    \n        heightLabel.BindingContext = this;\n        heightLabel.SetBinding (Label.TextProperty,\n\
    \            new Binding (\"Height\",\n                BindingMode.OneWay,\n \
    \               null, null, \"{0:F0}\"));\n\n        // Assemble a horizontal\
    \ StackLayout with the three labels.\n        this.Content = new StackLayout\n\
    \        {\n            Orientation = StackOrientation.Horizontal,\n         \
    \   Spacing = 0,\n            HorizontalOptions = LayoutOptions.Center,\n    \
    \        VerticalOptions = LayoutOptions.Center,\n            Children =\n   \
    \         {\n                widthLabel,\n                new Label\n        \
    \        {\n                    Text = \" x \",\n                    Font = font\n\
    \                },\n                heightLabel\n            }\n        };\n\
    \    }\n}\n```\n\nNotice the use of a horizontal StackLayout with no spacing to\
    \ visually concatenate three pieces of text so they appear to be a single line.\n\
    \nAs you shift the phone between portrait and landscape, the value updates entirely\
    \ through the data bindings.\n\n## Date and time selection\n\nWhile the information\
    \ from the DateTime.Now property can be displayed in a variety of ways, sometimes\
    \ applications need to allow the user to select a date or time. For this purpose,\
    \ Xamarin.Forms includes DatePicker and TimePicker views.\n\nThese are very similar.\
    \ The two views display a date or time, and tapping the view invokes the platform-specific\
    \ date or time selector. On the iPhone and Android, these selectors take over\
    \ part of the screen; on Windows Phone, it takes over the whole screen. The user\
    \ then dials in a new date or time and indicates completion.\n\nDatePicker has\
    \ three properties of type DateTime:\n\n- MinimumDate, initialized to January\
    \ 1, 1900\n- MaximumDate, initialized to December 31, 2100\n- Date, initialized\
    \ to DateTime.Today\n\nA program can set these properties to whatever it wants.\
    \ The Date property also reflects the user’s selection.\n\nThe DatePicker displays\
    \ the selected date using the normal ToString method, but you can set the Format\
    \ property of the view to a custom .NET formatting string. The initial value is\
    \ \"d\"—the \"short date\" format.\n\nHere’s a program that lets you select two\
    \ dates and calculates the number of days between them:\n\n```csharp\nclass DaysBetweenDatesPage\
    \ : ContentPage\n{\n    static readonly string dateFormat = \"D\";\n    DatePicker\
    \ fromDatePicker, toDatePicker;\n    Label resultLabel;\n\n    public DaysBetweenDatesPage()\n\
    \    {\n        // Create DatePicker views.\n        fromDatePicker = new DatePicker\n\
    \        {\n            Format = dateFormat,\n            HorizontalOptions =\
    \ LayoutOptions.Center\n        };\n        fromDatePicker.DateSelected += OnDateSelected;\n\
    \n        toDatePicker = new DatePicker\n        {\n            Format = dateFormat,\n\
    \            HorizontalOptions = LayoutOptions.Center\n        };\n        toDatePicker.DateSelected\
    \ += OnDateSelected;\n```\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_248_0.png)\n\
    \nThe TimePicker is somewhat simpler than DatePicker. It only defines Time and\
    \ Format properties, and doesn't include an event to indicate a new Time value.\
    \ If you need to be notified, you can install a handler for the PropertyChanged\
    \ event.\n\n## Custom views: A radio button\n\nYou can create custom views in\
    \ Xamarin.Forms. A later chapter (not in the Preview edition) will show you how\
    \ to create custom views by writing special classes, called renderers, specific\
    \ to each platform.\n\nHowever, it's also possible to create custom views right\
    \ in Xamarin.Forms. One approach is to derive a class from ContentView, and set\
    \ its Content property to a StackLayout (for example) and then assemble one or\
