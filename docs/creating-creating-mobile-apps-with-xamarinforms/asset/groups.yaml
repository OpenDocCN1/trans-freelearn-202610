    Grid.SetColumn(boxView, 0);\nGrid.SetRow(boxView, 0);\n\nGrid.SetColumn(controllersStack,\
    \ 0);\nGrid.SetRow(controllersStack, 1);\n}\n// Landscape mode.\nelse\n{\n   \
