    Now the SizeChanged handler become just a single statement. The AbsoluteLayout
    is automatically stretched horizontally to fill the width of the page (minus the
    padding), so the HeightRequest really just sets the aspect ratio.


    To position each BoxView, the constructor calculates proportional xIncrement and
    yIncrement values like so:


    ```

    double xIncrement = 1.0 / (horzDots - 1);

    double yIncrement = 1.0 / (vertDots - 1);

    ```


    If the AbsoluteLayout worked a little differently—if it did not take the size
    of the child into account when using proportional positioning—then these denominators
    would be horzDots (set to 41) and vertDots (set to 7), and the 41 BoxView horizontal
    positions would range from 0 / 41 to 40 / 41. However, because AbsoluteLayout
    takes size into account, the rightmost BoxView must have a horizontal position
    of 1, which means that the horizontal positions must range from 0 / 40 to 40 /
    40.


    The size of each BoxView, however, is based on the width of 41 and height of 7:


    ```

    const double height = 0.85 / vertDots;

    const double width = 0.85 / horzDots;

    ```


    The program is functionally the same as the one that did not use proportional
    positioning and sizing, but aside from height of the AbsoluteLayout itself, all
    the recalculations are automated.


    The program has simpler event handling and fewer “moving parts.” In that respect,
    this feature of AbsoluteLayout is similar to data-binding, which is explored in
    more depth in the next chapter.'
