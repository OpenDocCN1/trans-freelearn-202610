    \ some other parts of the program as well.\n\n# Version 6. Awaiting results\n\n\
    As you’ve seen, asynchronous operations can be difficult to manage. Sometimes\
    \ code executes in a different order than you anticipated and some thought is\
    \ required to figure out what’s going on. Asynchronous programming will likely\
    \ never be quite as simple as single-threaded coding, but some of the difficulty\
    \ in working with asynchronous operations has been alleviated with C# 5.0, released\
    \ in 2012. C# 5.0 introduced a revolutionary change in the way that programmers\
    \ deal with asynchronous operations. This change consists of a keyword named async\
    \ and an operator named await.\n\nThe async keyword is mostly for purposes of\
    \ backward compatibility. The await operator is the big one. It allows programmers\
    \ to work with asynchronous functions almost as if they were relatively normal\
    \ imperative programming statements without callback methods.\n\nLet’s look at\
    \ a generalized use of an asynchronous method that might appear in a Windows Phone\
    \ 8 program. You have a method in your program that calls an asynchronous method\
    \ in the operating system and sets a Completed handler implemented as a separate\
    \ method. The comments indicate some other code that might appear in the method:\n\
    \n```\nvoid SomeMethod()\n{\n    // Often some initialization code\n    IAsyncOperation<SomeType>\
    \ asyncOp = sysClass.LongJobAsync(...);\n    // Some additional code\n    asyncOp.Completed\
    \ = MyCompletedHandler;\n    // And perhaps still more code\n}\n```\n\nThe statement\
    \ that sets the Completed property returns quickly while the actual asynchronous\
    \ operation goes on in the background. All the code in SomeMethod will execute\
    \ before the callback method is called. Here’s what the Completed handler might\
    \ look like if you chose to ignore cancellations or errors encountered in the\
    \ background process:\n\n```\nvoid MyCompletedHandler(IAsyncOperation<SomeType>\
    \ op, AsyncStatus status)\n```"
