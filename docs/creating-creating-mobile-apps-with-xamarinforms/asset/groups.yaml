  - "[PAGE 135]\n\nInternally, these four statements result in similar event handlers\
    \ being set. That’s how the data-binding mechanism works.\n\nHowever, these four\
    \ statements can actually be reduced to three statements. Here’s how:\n\nThe BindingContext\
