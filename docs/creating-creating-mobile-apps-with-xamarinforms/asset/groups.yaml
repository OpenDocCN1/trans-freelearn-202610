    \n![](img/c2d61d0459c51981af78607f1eef3d1c_73_0.png)\n\n## 一个 StackLayout 中的 ScrollView？\n\
    \n通常将 `StackLayout` 放在 `ScrollView` 中，但你能把 `ScrollView` 放在 `StackLayout` 中吗？你为什么要这样做呢？\n\
