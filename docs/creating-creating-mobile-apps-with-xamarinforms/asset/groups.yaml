    \ possibly some events, but you'll want to take advantage of the existing infrastructure\
    \ established by the BindableObject and BindableProperty classes.\n\nLet's try\
    \ to create a classic radio button. The radio button is named after radio station-selector\
    \ buttons in old cars. These radios feature a row of pushbuttons, but only one\
    \ button can be depressed at a time, so pressing a button makes the previously\
    \ depressed button pop up, giving great joy to young kids who play with the radio.\n\
    \nFunctionally, a radio button is similar to the Xamarin.Forms Switch in that\
    \ it toggles between on and off states. However, radio buttons always appear in\
    \ a group. The radio buttons are mutually exclusive, so selecting any radio button\
    \ automatically deselects all the other buttons.\n\nThis custom RadioButton view\
    \ shown below defines three properties, although more could be\n\nThese two Label\
