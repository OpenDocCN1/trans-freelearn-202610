    # Downloads: Code samples


    The sample programs shown in the pages of this book were compiled in early September
    with version 1.2.2.6243 of Xamarin.Forms. The source code of these samples is
    hosted on a repository on GitHub: https://github.com/xamarin/xamarin-forms-book-preview/.


    You can clone the directory structure to a local drive on your machine, or download
    a big ZIP file. I''ll try to keep the code updated with the latest release of
    Xamarin.Forms and to fix (and comment) any errors that might have sneaked through.


    You can report problems, bugs, or other kinds of feedback about the book or source
    code by clicking the Issues button on this GitHub page. You can search through
    existing issues or file a new one. To file a new issue, you''ll need to join GitHub
    (if you haven''t already).


    Use this GibHub page only for issues involving the book. For questions or discussions
    about Xamarin.Forms itself, use the Xamarin.Forms forum: http://forums.xamarin.com/categories/xamarin-forms.


    # Updating the code samples


    The libraries that comprise Xamarin.Forms are distributed via the NuGet package
    manager. The Xamarin.Forms package consists of five dynamic-link libraries: Xamarin.Forms.Core.dll,
    Xamarin.Forms.Xaml.dll, Xamarin.Forms.Platform.iOS.dll, Xamarin.Forms.Platform.Android.dll,
    and Xamarin.Forms.Platform.WP8.dll. The Xamarin.Forms package also requires Xamarin
    Support Library v4 (Xamarin.Android.Support.v4.dll) and the Windows Phone Toolkit
    (Microsoft.Phone.Controls.-Toolkit.dll), which should be automatically included.


    When you create a new Xamarin.Forms solution using Visual Studio or Xamarin Studio,
    a version of the Xamarin.Forms package becomes part of that solution. However,
    that might not be the latest Xamarin.Forms package available from NuGet. Here''s
    how to update that package:


    In Visual Studio, right-click the solution name in the Solution Explorer and select
    Manage NuGet Packages for Solution. Select Installed packages at the left of the
    dialog to see what''s currently installed, and Updates and nuget.org at the left
    to choose to update the package. If an update is available, clicking the Update
    All button is easiest to get it into the solution.


    In Xamarin Studio, in the individual projects in the Solution list, under Packages,
    select the Xamarin.Forms package and select Update from the tool dropdown.


    The source code for this book that is stored on GitHub does not include the actual
    NuGet packages. Xamarin Studio will automatically download them when you load
    the solution, but Visual Studio will not. After you first load the solution into
    Visual Studio, right-click the solution name in the Solution'
  - '[PAGE 10]


    Explorer and select **Manage NuGet Packages for Solution**. You should be given
    the option to restore the packages with a **Restore** button at the top of the
    dialog. You can then update the package by selecting **Updates** and **nuget.org**
    at the left and (if an update exists) pressing the **Update All** button.


    # Acknowledgments


    It''s always seemed peculiar to me that authors of programming books (such as
    this one) are sometimes better known to programmers than the people who actually
    created the product that is the subject of the book! The real brains behind Xamarin.Forms
    are Jason Smith, Eric Maupin, Stephane Delcroix, and Seth Rosetter. Congratulations,
    guys! We''ve been enjoying the fruits of your labor!


    Over the months that this Preview Edition was in progress, I have benefited from
    valuable feedback, corrections, and edits from several people. This book wouldn''t
    exist without the collaboration of Bryan Costanich at Xamarin and Devon Musgrave
    at Microsoft Press. Both Bryan and Craig Dunn at Xamarin read some of my drafts
    of early chapters and easily persuaded me to take a somewhat different approach
    to the material. Later on, Craig kept me on track. During the final days before
    my deadline for this Preview Edition, Stephane Delcroix offered essential technical
    reads and John Meade performed copyediting under extreme crunch conditions. Microsoft
    Press supplemented that with another very helpful technical read by Andy Wigley,
