    \ `Note` properties were set before transferring them to the `Editor` and `Entry`.\
    \ Or the page class would need to know when the `Title` and `Text` properties\
    \ of the `Note` object changed values.\n\nThe basic problem involves the existence\
    \ of properties that change value without notifying anybody of the change. Can\
    \ we do something about this?\n\n# Version 4. I will notify you when the property\
    \ changes\n\nLet’s step back a moment.\n\nSo far, all the versions of the program\
    \ have contained a class deriving from `ContentPage` that displays a user interface\
    \ allowing a user to enter and edit two pieces of text. These two pieces of text\
    \ are also stored in a class named `Note`. This `Note` class stores data that\
    \ underlies the user interface of the page class.\n\nThese two classes are really\
    \ two sides of the same data—one class presents the data for editing by the user,\
    \ and the other class handles the more low-level chores, including loading and\
    \ saving the data in the file system.\n\nOptimally, at any time, both classes\
    \ should be dealing with the same data. But this is not the case. The page class\
