    \  BoxView boxView;\n    Label[] labels = new Label[3];\n    Slider[] sliders\
    \ = new Slider[3];\n\n    enum ColorMode\n    {\n        RgbHex,\n        RgbFloat,\n\
    \        Hsl\n    }\n\n    ColorMode currentColorMode = ColorMode.RgbHex;\n  \
    \  Color currentColor = Color.Aqua;\n    bool ignoreSliderValueChanges;\n\n  \
    \  string[] rgbHexFormat = { \"Red = {0:X2}\", \"Green = {0:X2}\", \"Blue = {0:X2}\"\
    \ };\n    string[] rgbFloatFormat = { \"Red = {0:F2}\", \"Green = {0:F2}\", \"\
    Blue = {0:F2}\" };\n    string[] hslFormat = { \"Hue = {0:F2}\", \"Saturation\
    \ = {0:F2}\", \"Luminosity = {0:F2}\" };\n    ...\n}\n```\n\n像往常一样，构造函数执行大部分布局。有两个\
    \ `Grid` 布局。名为 `mainGrid` 的一个是占据整个页面的 2 × 2 `Grid`；一个单元格包含带有所有用于控制颜色的视图的 `StackLayout`，包括一个带有三个单选按钮标签的三列\
