    \n            // Return to home page.\n            await this.Navigation.PopAsync();\n\
    \        }\n    }\n```"
  md: "\nThere are actually three different ways that the collection might change!\
    \ Understanding the different types of change associated with collections will\
    \ help you design your data and user interface so that the `ListView` always displays\
    \ the latest and greatest data items.\n\nHere’s the first type of change: Perhaps\
    \ the `CollectionProp` property of the `Data` instance returns a particular `List<T>`\
    \ object when the application starts running, and then something happens and the\
    \ property returns a different `List<T>` object. It’s a completely different collection\
    \ with different items. If that is the case, then the `Data` class should implement\
    \ `INotifyPropertyChanged`, and fire a `PropertyChanged` event when the `CollectionProp`\
    \ property changes. Accordingly, the `ItemsSource` property of `ListView` should\
    \ not simply be set to the `CollectionProp` property but must be bound to the\
    \ property with a data binding:\n\n```\nlistView.BindingContext = data;\nlistView.SetBinding(ListView.ItemsSourceProperty,\
    \ \"CollectionProp\");\n```\n\nThat’s one way the collection might change. Here’s\
    \ a second way: The `List<T>` object returned by the `CollectionProp` property\
    \ might remain the same while the program is running, but items might be added\
    \ to or removed from the collection dynamically, or perhaps reordered or resorted\
    \ in some way, and of course you would like the `ListView` display to reflect\
    \ the updated contents.\n\nThis is the type of change that **NoteTaker8** will\
    \ need to handle. The `ListView` in **NoteTaker8** will display the collection\
    \ of notes, but the user can add notes and delete notes to the collection while\
    \ the program is running. The `ListView` must respond to those changes. At first,\
    \ this sounds like a difficult requirement. How can the `ListView` determine that\
    \ the collection that is set to (or bound to) its `ItemsSource` property has acquired\
    \ a new item or lost an existing item?\n\nThrough an event, of course! You already\
    \ know about the `INotifyPropertyChanged` interface in the `System.ComponentModel`\
    \ namespace defined like so:\n\n```\npublic interface INotifyPropertyChanged\n\
    {\n    event PropertyChangedEventHandler PropertyChanged;\n}\n```\n\nThe `System.Collections.Specialized`\
    \ namespace contains a related and similar interface named `INotifyCollectionChanged`:\n\
    \n```\npublic interface INotifyCollectionChanged\n{\n    event NotifyCollectionChangedEventHandler\
    \ CollectionChanged;\n}\n```\n\nA collection class can implement this interface\
    \ and notify the outside world when an object has been added to or removed from\
    \ the collection, or the items have been reordered in some way. The event argument\
    \ associated with `NotifyCollectionChangedEventHandler` provides details on this\
    \ change.\n\n`ListView` knows about `INotifyCollectionChanged`. Whenever a collection\
    \ object is set to its `ItemsSource` property, `ListView` checks if that collection\
    \ object implements this interface. If so, `ListView` attaches a handler on the\
    \ `CollectionChanged` event of that collection object. The `ListView` is then\
    \ notified when objects are added to or removed from the collection (or if the\
    \ objects are reordered in some way), and updates the `ListView` display accordingly.\n\
    \nNow all we need is an actual class that implements `INotifyCollectionChanged`,\
    \ and there is one: It’s in the `System.Collections.ObjectModel` namespace and\
    \ it’s a generic class called `ObservableCollection`, which is a great name because\
    \ it implies that by using the `CollectionChanged` event you can observe what’s\
    \ going on inside the collection.\n\nThere is also a third way that a collection\
    \ can change. Perhaps the collection object itself doesn’t change, and objects\
    \ are not added to, or removed from, the collection, but properties of the objects\
    \ in the collection change. For example, suppose your collection contains a bunch\
    \ of `Weather` objects for major cities. The collection itself never changes but\
    \ the `Weather` class contains a `Temperature` property that changes throughout\
    \ the day. If this `Weather` object implements `INotifyPropertyChanged` and fires\
    \ `PropertyChanged` events when the `Temperature` property changes, the `ListView`\
    \ can respond to those changes as well.\n\nNoteTaker8 definitely requires an `ObservableCollection`,\
    \ so let’s handle that first. Let’s create a class that will store a collection\
    \ of `Note` objects. The `NoteFolder` class has a single property named `Notes`\
    \ that is of type `ObservableCollection<Note>`. The constructor calls an asynchronous\
    \ method that obtains a list of all the files using `FileHelper.GetFilesAsync`,\
    \ and then sorts them by filename. (Keep in mind that the filenames are constructed\
    \ from the date and time when the `Note` object was created, so these filenames\
    \ will be sorted into the order in which the files were created.) Then a `Note`\
    \ object is created for each filename, the `LoadAsync` method is called to load\
    \ the file into the `Note` object, and it’s added to the `Notes` collection:\n\
    \n```\nnamespace NoteTaker8\n{\n    class NoteFolder\n    {\n        public NoteFolder()\n\
    \        {\n            this.Notes = new ObservableCollection<Note>();\n     \
    \       GetFilesAsync();\n        }\n\n        public ObservableCollection<Note>\
    \ Notes { private set; get; }\n\n        async void GetFilesAsync()\n        {\n\
    \            // Sort the filenames.\n            IEnumerable<string> filenames\
    \ =\n                from filename in await FileHelper.GetFilesAsync()\n     \
    \           where filename.EndsWith(\".note\")\n                orderby (filename)\n\
    \                select filename;\n\n            // Store them in the Notes collection.\n\
    ```\n\nNotice that the `ItemsSource` property of the `ListView` is set to `App.NoteFolder.Notes`.\
    \ The `ListView` is scrollable, so if it shares a `StackLayout` with some other\
    \ view (such as `Button` on this page), it must have a `VerticalOptions` setting\
    \ of `FillAndExpand`.\n\nWhen the `Button` is clicked, `HomePage` constructs a\
    \ unique filename, instantiates a `Note` object, and navigates to `NotePage`,\
    \ which (as you’ve seen) sets its `BindingContext` to that `Note`. What you haven’t\
    \ seen yet is the new `OnDisappearing` override of `NotePage`:\n\n```\nnamespace\
    \ NoteTaker8\n{\n    class NotePage : ContentPage\n    {\n        ...\n      \
    \  protected override void OnDisappearing()\n        {\n            // Only save\
    \ it if there's some text somewhere.\n            if (!String.IsNullOrWhiteSpace(note.Title)\
    \ ||\n                !String.IsNullOrWhiteSpace(note.Text))\n            {\n\
    \                note.SaveAsync();\n                App.NoteFolder.Notes.Add(note);\n\
    \            }\n            base.OnDisappearing();\n        }\n    }\n}\n```\n\
    \nThe new `OnDisappearing` saves the new `Note` object and adds it to the `App.NoteFolder.Notes`\
    \ collection. As the `HomePage` comes back into view, the `ListView` shows the\
    \ new `Note` object.\n\nHowever, as you experiment with adding new `Note` objects,\
    \ you’ll find that the `ListView` display isn’t all that illuminating:\n\n```\n\
    Children =\n{\n    new Label { Text = \"Title:\" },\n    entry,\n    new Label\
    \ { Text = \"Note:\" },\n    editor,\n};\n\nif (isNoteEdit)\n{\n    // Cancel\
    \ button.\n    Button cancelButton = new Button\n    {\n        Text = \"Cancel\"\
    ,\n        HorizontalOptions = LayoutOptions.CenterAndExpand\n    };\n\n    cancelButton.Clicked\
    \ += async (sender, args) =>\n    {\n        bool confirm = await this.DisplayAlert(\"\
    Note Taker\",\n            \"Cancel note edit?\",\n            \"Yes\", \"No\"\
    );\n\n        if (confirm)\n        {\n            // Reload note.\n         \
    \   await note.LoadAsync();\n\n            // Return to home page.\n         \
    \   await this.Navigation.PopAsync();\n        }\n    };\n\n    // Delete button\n\
    \    Button deleteButton = new Button\n    {\n        Text = \"Delete\",\n   \
    \     HorizontalOptions = LayoutOptions.CenterAndExpand\n    };\n\n    deleteButton.Clicked\
    \ += async (sender, args) =>\n    {\n        bool confirm = await this.DisplayAlert(\"\
    Note Taker\",\n            \"Delete this note?\",\n            \"Yes\", \"No\"\
    );\n\n        if (confirm)\n        {\n            // Delete Note file and remove\
    \ from collection.\n            await note.DeleteAsync();\n            App.NoteFolder.Notes.Remove(note);\n\
    \n            // Return to home page.\n            await this.Navigation.PopAsync();\n\
    \        }\n    }\n```\n"
  mdcn: "\n\n实际上集合可能发生变化有三种不同方式！理解集合相关的不同类型的变化将帮助你设计数据和用户界面，以便 `ListView` 始终显示最新最好的数据项。\n\
    \n这是第一种变化类型：也许 `Data` 实例的 `CollectionProp` 属性在应用程序启动时返回一个特定的 `List<T>` 对象，然后发生了某些事情，该属性返回了一个不同的\
    \ `List<T>` 对象。这是一个完全不同的集合，包含不同的项。如果是这种情况，那么 `Data` 类应实现 `INotifyPropertyChanged`，并在\
    \ `CollectionProp` 属性更改时触发 `PropertyChanged` 事件。因此，`ListView` 的 `ItemsSource`\
    \ 属性不应简单地设置为 `CollectionProp` 属性，而必须通过数据绑定绑定到该属性：\n\n```\nlistView.BindingContext\
    \ = data;\nlistView.SetBinding(ListView.ItemsSourceProperty, \"CollectionProp\"\
    );\n```\n\n这就是集合可能发生变化的一种方式。这里是第二种方式：`CollectionProp` 属性返回的 `List<T>` 对象在程序运行期间可能保持不变，但项可能会动态地添加到集合中或从集合中移除，或者以某种方式重新排序或重新排序，当然你希望\
    \ `ListView` 显示能够反映更新后的内容。\n\n这是 **NoteTaker8** 需要处理的变化类型。**NoteTaker8** 中的 `ListView`\
    \ 将显示笔记集合，但用户可以在程序运行期间向集合添加笔记和删除笔记。`ListView` 必须响应这些更改。起初，这听起来像是一个困难的要求。`ListView`\
    \ 如何确定设置为（或绑定到）其 `ItemsSource` 属性的集合已获得新项或丢失了现有项？\n\n当然是通过事件！你已经知道 `System.ComponentModel`\
    \ 命名空间中定义的 `INotifyPropertyChanged` 接口，如下所示：\n\n```\npublic interface INotifyPropertyChanged\n\
    {\n    event PropertyChangedEventHandler PropertyChanged;\n}\n```\n\n`System.Collections.Specialized`\
    \ 命名空间包含一个相关且相似的接口，名为 `INotifyCollectionChanged`：\n\n```\npublic interface INotifyCollectionChanged\n\
    {\n    event NotifyCollectionChangedEventHandler CollectionChanged;\n}\n```\n\n\
    集合类可以实现此接口，并在对象添加到集合或从集合中移除时，或项以某种方式重新排序时通知外部世界。与 `NotifyCollectionChangedEventHandler`\
    \ 关联的事件参数提供了有关此更改的详细信息。\n\n`ListView` 知道 `INotifyCollectionChanged`。每当集合对象设置为其\
    \ `ItemsSource` 属性时，`ListView` 会检查该集合对象是否实现此接口。如果是，`ListView` 会在该集合对象的 `CollectionChanged`\
    \ 事件上附加一个处理程序。然后 `ListView` 会在对象添加到集合或从集合中移除时（或如果对象以某种方式重新排序）收到通知，并相应地更新 `ListView`\
    \ 显示。\n\n现在我们只需要一个实际实现 `INotifyCollectionChanged` 的类，而确实有一个：它位于 `System.Collections.ObjectModel`\
    \ 命名空间中，它是一个名为 `ObservableCollection` 的泛型类，这是一个很棒的名字，因为它暗示通过使用 `CollectionChanged`\
    \ 事件你可以观察集合内部发生的情况。\n\n集合还可能以第三种方式发生变化。也许集合对象本身没有变化，并且对象没有添加到集合中或从集合中移除，但集合中对象的属性发生了变化。例如，假设你的集合包含多个主要城市的\
    \ `Weather` 对象。集合本身永远不会改变，但 `Weather` 类包含一个 `Temperature` 属性，该属性在一天中不断变化。如果此 `Weather`\
    \ 对象实现 `INotifyPropertyChanged` 并在 `Temperature` 属性更改时触发 `PropertyChanged` 事件，`ListView`\
    \ 也能响应这些更改。\n\nNoteTaker8 确实需要一个 `ObservableCollection`，所以让我们先处理它。让我们创建一个将存储 `Note`\
    \ 对象集合的类。`NoteFolder` 类有一个名为 `Notes` 的单个属性，其类型为 `ObservableCollection<Note>`。构造函数调用一个异步方法，该方法使用\
    \ `FileHelper.GetFilesAsync` 获取所有文件，然后按文件名排序。（请记住，文件名是根据 `Note` 对象创建的日期和时间构造的，因此这些文件名将按文件创建的顺序排序。）然后为每个文件名创建一个\
    \ `Note` 对象，调用 `LoadAsync` 方法将文件加载到 `Note` 对象中，并将其添加到 `Notes` 集合中：\n\n```\nnamespace\
    \ NoteTaker8\n{\n    class NoteFolder\n    {\n        public NoteFolder()\n  \
    \      {\n            this.Notes = new ObservableCollection<Note>();\n       \
    \     GetFilesAsync();\n        }\n\n        public ObservableCollection<Note>\
    \ Notes { private set; get; }\n\n        async void GetFilesAsync()\n        {\n\
    \            // Sort the filenames.\n            IEnumerable<string> filenames\
    \ =\n                from filename in await FileHelper.GetFilesAsync()\n     \
    \           where filename.EndsWith(\".note\")\n                orderby (filename)\n\
    \                select filename;\n\n            // Store them in the Notes collection.\n\
    ```\n\n请注意，`ListView` 的 `ItemsSource` 属性设置为 `App.NoteFolder.Notes`。`ListView`\
    \ 可滚动，因此如果它与 `StackLayout` 中的其他视图（如此页面的 `Button`）共享，则必须具有 `VerticalOptions` 设置为\
    \ `FillAndExpand`。\n\n当单击 `Button` 时，`HomePage` 构造一个唯一的文件名，实例化一个 `Note` 对象，并导航到\
    \ `NotePage`，该页面（如你所见）将其 `BindingContext` 设置为该 `Note`。你尚未看到的是 `NotePage` 的新的 `OnDisappearing`\
    \ 重写：\n\n```\nnamespace NoteTaker8\n{\n    class NotePage : ContentPage\n    {\n\
    \        ...\n        protected override void OnDisappearing()\n        {\n  \
    \          // Only save it if there's some text somewhere.\n            if (!String.IsNullOrWhiteSpace(note.Title)\
    \ ||\n                !String.IsNullOrWhiteSpace(note.Text))\n            {\n\
    \                note.SaveAsync();\n                App.NoteFolder.Notes.Add(note);\n\
    \            }\n            base.OnDisappearing();\n        }\n    }\n}\n```\n\
    \n新的 `OnDisappearing` 保存新的 `Note` 对象并将其添加到 `App.NoteFolder.Notes` 集合中。随着 `HomePage`\
    \ 重新进入视图，`ListView` 显示新的 `Note` 对象。\n\n然而，当你尝试添加新的 `Note` 对象时，你会发现 `ListView`\
    \ 显示并不那么有启发性：\n\n```\nChildren =\n{\n    new Label { Text = \"Title:\" },\n  \
    \  entry,\n    new Label { Text = \"Note:\" },\n    editor,\n};\n\nif (isNoteEdit)\n\
    {\n    // Cancel button.\n    Button cancelButton = new Button\n    {\n      \
    \  Text = \"Cancel\",\n        HorizontalOptions = LayoutOptions.CenterAndExpand\n\
    \    };\n\n    cancelButton.Clicked += async (sender, args) =>\n    {\n      \
    \  bool confirm = await this.DisplayAlert(\"Note Taker\",\n            \"Cancel\
    \ note edit?\",\n            \"Yes\", \"No\");\n\n        if (confirm)\n     \
    \   {\n            // Reload note.\n            await note.LoadAsync();\n\n  \
    \          // Return to home page.\n            await this.Navigation.PopAsync();\n\
    \        }\n    };\n\n    // Delete button\n    Button deleteButton = new Button\n\
