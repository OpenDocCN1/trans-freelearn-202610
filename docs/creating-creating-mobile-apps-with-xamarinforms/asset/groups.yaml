    \ a)`\n- `Color.FromHsla(double h, double s, double l, double a)`\n\n带整数参数的两个静态方法假定参数范围为\
    \ 0 到 255，这是 RGB 颜色的常用表示方式。在内部，构造函数只需将整数值除以 255.0，即可将其转换为 `double`。\n\n注意！你可能会认为下面的调用会创建红色：\n\
    \n```csharp\nColor.FromRgb(1, 0, 0)\n```\n\n然而，C# 编译器会将这些参数视为整数。因此将调用整数版本的方法，第一个参数会被除以\
    \ 255.0，结果将接近于零。如果希望调用带有 `double` 参数的方法，应明确指定：\n\n```csharp\nColor.FromRgb(1.0,\
    \ 0, 0)\n```\n\n`Color` 还为打包的 `uint` 格式以及字符串中的十六进制格式定义了静态创建方法。\n\n`Color` 结构还定义了\
