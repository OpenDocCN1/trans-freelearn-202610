    \ BindableProperty FontProperty =\n```\n"
  mdcn: "\n\n严格来说，数据绑定并不是 Xamarin.Forms 接口的必要组成部分。你可以用显式的事件处理器完成数据绑定能做的所有事情。但数据绑定可以为你安装和管理这些事件处理器，因此它允许你编写事件处理更少的代码，看起来“活动部件”也更少。\n\
    \n数据绑定定义中容易出现错误的一个元素是源属性名，你用文本字符串来表示。Visual Studio 和 Xamarin Studio 不会在你拼写错误时发出警告，但绑定将无法工作，而且问题可能很难找到。\n\
    \n你可以用 SetBinding 方法的泛型形式来避免拼写错误。前面你看到过将 Slider 的 Value 属性绑定到 Label 的 Opacity\
    \ 属性的绑定，像这样定义：\n\n```csharp\nsliderValueLabel.SetBinding (Label.OpacityProperty,\
    \ \"Value\");\n```\n\n你也可以改用这种形式：\n\n```csharp\nsliderValueLabel.SetBinding<Slider>\
    \ (Label.OpacityProperty, src => src.Value);\n```\n\n泛型参数是 Slider，即源对象的类型，而源 Value\
    \ 属性则以访问该属性的 lambda 表达式形式表示。该方法使用 .NET 反射来获取字符串属性名。\n\n你也可以对 SetBinding 方法的较长版本做类似处理。下面这条语句将\
    \ Label 的 Text 属性绑定到 Slider 的 Value 属性：\n\n```csharp\nsliderValueLabel.SetBinding\
    \ (Label.TextProperty,\n    new Binding (\"Value\", BindingMode.Default, null,\
    \ null,\n        \"The Slider value is {0:F2}\"));\n```\n\n与其使用 Binding 构造函数作为第二个参数，你可以使用静态（且泛型）的\
    \ Binding.Create 方法：\n\n```csharp\nsliderValueLabel.SetBinding (Label.TextProperty,\n\
    \    Binding.Create<Slider> (src => src.Value, BindingMode.Default, null, null,\n\
    \        \"The Slider value is {0:F2}\"));\n```\n\n如果你同时也在开发定义源属性的代码，这些替代形式是更受青睐的，因为你可以重命名这些源属性，而不必担心破坏定义数据绑定的代码。\n\
    \n下面是 WhatSize 程序的一个新版本，它同时使用了 Binding 创建的两种形式（这种做法在现实生活中可能会让日后需要维护该程序的人对这种看似不一致的意图感到困惑）：\n\
    \n```csharp\nclass WhatSizeBindingsPage : ContentPage\n{\n    public WhatSizeBindingsPage()\n\
    \    {\n        Font font = Font.SystemFontOfSize(NamedSize.Large);\n\n      \
    \  // Create Label views for displaying page width and height.\n        Label\
    \ widthLabel = new Label\n        {\n            Font = font\n        };\n\n \
    \       Label heightLabel = new Label\n        {\n            Font = font\n  \
    \      };\n\n        // Define bindings on Labels.\n        widthLabel.BindingContext\
    \ = this;\n        widthLabel.SetBinding (Label.TextProperty,\n            Binding.Create<ContentPage>\
    \ (src => src.Width,\n                BindingMode.OneWay,\n                null,\
    \ null, \"{0:F0}\"));\n\n        heightLabel.BindingContext = this;\n        heightLabel.SetBinding\
    \ (Label.TextProperty,\n            new Binding (\"Height\",\n               \
    \ BindingMode.OneWay,\n                null, null, \"{0:F0}\"));\n\n        //\
    \ Assemble a horizontal StackLayout with the three labels.\n        this.Content\
    \ = new StackLayout\n        {\n            Orientation = StackOrientation.Horizontal,\n\
    \            Spacing = 0,\n            HorizontalOptions = LayoutOptions.Center,\n\
    \            VerticalOptions = LayoutOptions.Center,\n            Children =\n\
    \            {\n                widthLabel,\n                new Label\n     \
    \           {\n                    Text = \" x \",\n                    Font =\
    \ font\n                },\n                heightLabel\n            }\n     \
    \   };\n    }\n}\n```\n\n注意使用了没有间距的水平 StackLayout 来视觉上拼接三段文本，使其看起来像单行。\n\n当你将手机在纵向和横向之间切换时，数值完全通过数据绑定更新。\n\
    \n## 日期和时间选择\n\n虽然 DateTime.Now 属性的信息可以用多种方式显示，但有时应用程序需要允许用户选择日期或时间。为此目的，Xamarin.Forms\
    \ 包含 DatePicker 和 TimePicker 视图。\n\n两者非常相似。这两个视图显示日期或时间，点击视图会调用平台特定的日期或时间选择器。在\
    \ iPhone 和 Android 上，这些选择器占据屏幕的一部分；在 Windows Phone 上，它占据整个屏幕。然后用户输入新的日期或时间并指示完成。\n\
    \nDatePicker 有三个类型为 DateTime 的属性：\n\n- MinimumDate，初始化为 1900 年 1 月 1 日\n- MaximumDate，初始化为\
    \ 2100 年 12 月 31 日\n- Date，初始化为 DateTime.Today\n\n程序可以按需设置这些属性。Date 属性也反映用户的选择。\n\
    \nDatePicker 使用正常的 ToString 方法显示所选日期，但你可以将视图的 Format 属性设置为自定义的 .NET 格式字符串。初始值为\
    \ \"d\"——“短日期”格式。\n\n下面是一个程序，让你选择两个日期并计算它们之间的天数：\n\n```csharp\nclass DaysBetweenDatesPage\
    \ : ContentPage\n{\n    static readonly string dateFormat = \"D\";\n    DatePicker\
    \ fromDatePicker, toDatePicker;\n    Label resultLabel;\n\n    public DaysBetweenDatesPage()\n\
    \    {\n        // Create DatePicker views.\n        fromDatePicker = new DatePicker\n\
    \        {\n            Format = dateFormat,\n            HorizontalOptions =\
    \ LayoutOptions.Center\n        };\n        fromDatePicker.DateSelected += OnDateSelected;\n\
    \n        toDatePicker = new DatePicker\n        {\n            Format = dateFormat,\n\
    \            HorizontalOptions = LayoutOptions.Center\n        };\n        toDatePicker.DateSelected\
    \ += OnDateSelected;\n```\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_248_0.png)\n\
    \nTimePicker 比 DatePicker 简单一些。它只定义 Time 和 Format 属性，且不包含指示新 Time 值的事件。如果你需要收到通知，可以为\
    \ PropertyChanged 事件安装处理器。\n\n## 自定义视图：单选按钮\n\n你可以在 Xamarin.Forms 中创建自定义视图。后面的章节（不在预览版中）将向你展示如何通过为每个平台编写特殊的类，即渲染器，来创建自定义视图。\n\
    \n然而，也可以在 Xamarin.Forms 中直接创建自定义视图。一种方法是派生一个 ContentView 类，并将其 Content 属性设置为 StackLayout（例如），然后在上面组装一个或多个视图。你可能还需要定义一两个属性，以及可能的一些事件，但你会希望利用\
    \ BindableObject 和 BindableProperty 类建立的现有基础设施。\n\n让我们尝试创建一个经典的单选按钮。单选按钮的名字来源于老式汽车中的收音机选台按钮。这些收音机有一排按钮，但一次只能按下其中一个，所以按下按钮会使之前按下的按钮弹起，给玩收音机的孩子带来极大的乐趣。\n\
    \n在功能上，单选按钮与 Xamarin.Forms Switch 类似，因为它在开和关状态之间切换。然而，单选按钮总是以组出现。单选按钮是互斥的，因此选择任意一个单选按钮会自动取消选中其他所有按钮。\n\
    \n下面显示的自定义 RadioButton 视图定义了三个属性，尽管还可以定义更多\n\n这两个 Label 视图有 Text 属性，但 RadioButton\
    \ 派生的 ContentView 没有 Text 属性，因此 RadioButton 必须定义一个。此外，为了允许数据绑定和其他 Xamarin.Forms\
    \ 功能，RadioButton 还必须定义一个名为 TextProperty 的 BindableProperty 对象。\n\n这个 TextProperty\
    \ 是一个定义为 public 且 static 的字段，它还应定义为 readonly，这意味着它必须在字段定义或静态构造函数中设置。BindableProperty\
    \ 类有静态 Create 方法来创建 BindableProperty 对象：\n\n```csharp\nclass RadioButton : ContentView\n\
    {\n    ...\n    public static readonly BindableProperty TextProperty =\n     \
    \   BindableProperty.Create(\"Text\",                 // property name\n     \
    \       typeof(string),                              // property type\n      \
