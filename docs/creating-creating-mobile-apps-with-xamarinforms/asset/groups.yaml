    \n// Initialize Slider values.\nSetSlidersAndBindings();\n}\n...\n}\n```\n\nThe\
    \ SizeChanged handler for the page is responsible for manipulating the row and\
    \ column definitions of the mainGrid depending on the aspect ratio, and for putting\
    \ the BoxView and the StackLayout with the control panel in the appropriate cells.\
    \ Although some of these settings are the same regardless of the orientation—and\
    \ the column and row are zero by default—defining and redefining them all in one\
