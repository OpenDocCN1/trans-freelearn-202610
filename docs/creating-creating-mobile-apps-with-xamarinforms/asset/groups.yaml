    # The ListView


    NoteTaker8 needs a way to list all the notes. It could use a Label view to display
    the title of each note and then collect all those Label views in a StackLayout
    inside a ScrollView. But there exists a view that does most of this work for you,
    and then some. This is ListView, and whenever you need to display a scrollable
    list of objects, this is your go-to view—particularly if the objects are of the
    same type.


    Basically you fill the ListView with a collection of objects, and ListView displays
    them. You might think the objects displayed by the ListView must be views of some
    sort, but that is not so. The objects displayed by a ListView are generally data
    objects, and you can control precisely how the ListView displays these data objects.
    (A full discussion of how this works awaits us in a chapter that is unfortunately
    not in this Preview Edition.)


    Items displayed by the ListView are selectable. The user simply taps an item to
    select it. The ItemSelected event signals when a new item is selected, and the
    SelectedItem property reveals that item. This facility will be useful in the next
    version of NoteTaker for editing and deleting notes.


    You specify the items that are displayed by the ListView by setting its ItemsSource
    property to a collection object that implements the IEnumerable interface. This
    is the .NET interface associated with the most generalized type of collection.
    Arrays implement IEnumerable, so an array qualifies. More commonly, the ItemsSource
    property of ListView is set to an instance of List<T>. For example, if list is
    an instance of List<T>, then you can set ItemsSource like so:


    ```

    listView.ItemsSource = list;

    ```


    The ListView will then display all the items in the collection, with scrolling
    if necessary.


    Very often the collection of data items you want the ListView to display is exposed
    as a property of some other object. For example, suppose a class named Data defines
    a property named CollectionProp that implements IEnumerable, and data is an instance
    of that class. You can set the ItemsSource property like so:


    ```

    listView.ItemsSource = data.CollectionProp;

    ```


    But what happens if the collection changes after the CollectionProp property has
    been set to the ItemsSource property?


    And what exactly is meant by the word “change” for a collection?'
