    The **Button** at the bottom labeled **Save** currently does nothing. Such a button
    is undoubtedly intended to save the note to a file. To do that, however, we need
    to know how to save files, and later load them back in.


    File input/output is not something included in the Xamarin.Forms API. Yet, some
    file I/O is required by many mobile apps, if only to save settings and interim
    data. For this reason, file I/O is probably the most compelling reason to skirt
    around the Xamarin.Forms API and implement some vital features of your app by
    using the programming interfaces of the individual platforms.


    # Version 2. File input/output


    Traditionally, file input/output is one of the most basic programming tasks, but
    file I/O on mobile devices is a little different than on the desktop. On the desktop,
    users and applications generally have a whole disk available organized in a directory
    structure. On mobile devices, several standard folders exist—for pictures or music,
    for example—but application-specific data is generally restricted to private storage
    areas.


    Programmers familiar with .NET know that the `System.IO` namespace contains the
    bulk of standard file I/O support. Perhaps the most important class in this namespace
    is the static `File` class, which not only provides a bunch of methods to create
    new files and open existing files but also includes several methods capable of
    performing an entire file read or write operation in a single method call.


    For example, the `File.WriteAllText` method has two arguments of type `string`—a
    filename and the file contents. The method creates the file (replacing an existing
    file with the same name if'
  - '[PAGE 96]


    necessary), writes the contents to the file, and closes it. The `File.ReadAllText`
    method is similar but returns the contents of the file in one big `string` object.
    These methods seem ideal for the job of saving and retrieving notes.


    The Xamarin.iOS and Xamarin.Android libraries include a version of .NET that has
    been expressly tailored by Xamarin for these two mobile platforms. The methods
    in the `File` class in the `System.IO` namespace map to appropriate file I/O functions
    in the iOS and Android platforms. This means that you can use methods in the `File`
    class—including `File.WriteAllText` and `File.ReadAllText`—in your iPhone and
    Android applications.


    Let’s experiment a bit:


    Go into Visual Studio or Xamarin Studio, and load any Xamarin.Forms solution created
    so far, such as **NoteTaker1**. Bring up one of the code files in the iOS or Android
    project. In a constructor or method, type the `System.IO` namespace name and then
    a period. You’ll get a list of all the available types in the namespace. If you
    then type `File` and a period, you’ll get all the static methods in the `File`
    class, including `WriteAllText` and `ReadAllText`.


    In a Windows Phone project, however, you’re working with a version of .NET created
    by Microsoft and stripped down somewhat for the Windows Phone platform. If you
    type `System.IO.File` and a period, you’ll see a rather diminished `File` class
    that does *not* include `WriteAllText` and `ReadAllText`, although it does include
    methods to create and open text files.


    Now go into any code file in a Xamarin.Forms Portable Class Library project, and
    type `System.IO` and a period. Now you won’t even see the `File` class! It does
