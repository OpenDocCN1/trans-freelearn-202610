  mdcn: "\n将一台真实的 Android 手机连接到 Mac 或 PC 上进行测试。你真正需要做的就是在设备上启用 USB 调试。\n\n如果你喜欢在真实设备上测试，但又想在超出自己管理能力的更多真实设备上进行测试，可以了解一下\
    \ Xamarin Test Cloud。\n\n## 安装\n\n在为 Xamarin.Forms 编写应用程序之前，你需要在 Mac 和/或 PC 上安装\
    \ Xamarin 平台。请参阅 Xamarin 网站上的文章：\n\n*http://developer.xamarin.com/guides/cross-platform/getting_started/installation*\n\
    \n你可能迫不及待地想创建你的第一个 Xamarin.Forms 应用程序，但在开始之前，你应当先尝试为 iPhone 和 Android 创建常规的 Xamarin\
    \ 项目，以及一个常规的 Windows Phone 项目。\n\n这一点很重要：如果你在使用 Xamarin.iOS 或 Xamarin.Android\
    \ 时遇到问题，那并不是 Xamarin.Forms 的问题，你需要在使用 Xamarin.Forms 之前先解决该问题。\n\n## 创建 iOS 应用\n\
    \n如果你有兴趣使用 Xamarin.Forms 来面向 iPhone，请先熟悉 Xamarin 网站上相应的入门文档：\n\n*http://developer.xamarin.com/guides/ios/getting_started/*\n\
    \n这将指导你如何使用 Xamarin.iOS 库以 C# 开发 iPhone 应用程序。你真正需要做的，就是能够在真实的 iPhone 或 iPhone\
    \ 模拟器上构建并部署一个简单的 iPhone 应用程序。\n\n如果你使用的是 Xamarin Studio，可以从菜单中选择 **文件 > 新建 > 解决方案**，然后在\
    \ **新建解决方案** 对话框中，从左侧选择 **C#** 和 **iOS**，再选择 **通用**，最后从中间的模板列表中选择 **空项目**。\n\n\
    如果你使用的是 Visual Studio，可以从菜单中选择 **文件 > 新建 > 项目**，然后在 **新建项目** 对话框中，从左侧选择 **Visual\
    \ C#** 和 **iOS**，再选择 **通用**，最后从中间的模板列表中选择 **空白应用 (iOS)**。\n\n无论哪种情况，都要为解决方案选择位置和名称。构建并部署项目中创建的骨架应用程序。如果你在此遇到问题，这不是\
    \ Xamarin.Forms 的问题。你可能想查看 Xamarin.iOS 论坛，看看是否有人有类似问题：\n\n*http://forums.xamarin.com/categories/ios*\n\
    \n![](img/c2d61d0459c51981af78607f1eef3d1c_30_0.png)\n\n如你所见，这些平台有不同的配色方案。默认情况下，Windows\
    \ Phone 的配色方案与 Android 类似，在深色背景上显示浅色文字，但这种配色方案是可以由用户更改的。即使在 Windows Phone 模拟器上，你也可以在“设置”应用的“主题”部分更改配色方案，然后重新运行程序。\n\
    \n应用不仅会在设备或模拟器上运行，而且会被部署。它会与手机或模拟器上的其他应用一起显示，并且可以从那里运行。如果你不喜欢应用程序图标或应用名称的显示方式，可以在各个平台项目中更改。\n\
    \n## Xamarin.Forms 解决方案剖析\n\n显然，由 Xamarin.Forms 模板创建的程序非常简单，所以这是一个绝佳的机会来检查生成的代码文件，并理解它们的相互关系和工作原理。\n\
    \n让我们从定义你在屏幕上看到的文本的代码开始。这就是 Hello 项目中的 App.cs 文件，如果自从本章编写以来项目模板没有改变太多，它可能看起来像这样：\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\n\nusing Xamarin.Forms;\n\nnamespace Hello\n```\n\n对于这三个不同的平台，你很快就会看到如何做到这一点。你也可以在这三个应用程序项目中包含特定于平台的代码。\n\
    \n这三个应用程序项目拥有自己的资产，即图标和元数据。如果你打算将应用程序推向市场，就必须特别关注这些资产。但在你学习如何使用 Xamarin.Forms\
    \ 开发应用程序期间，通常可以忽略这些资产。你可能希望将这些应用程序项目在解决方案列表中折叠起来，因为你无需过多关注它们的内容。\n\n但你确实应该了解这些应用程序项目中有什么，所以让我们仔细看一看。\n\
    \n在每个应用程序项目的 **引用** 部分，你会看到对公共项目（此处为 **Hello**）的引用，以及各种 .NET 程序集、上面列出的 Xamarin.Forms\
    \ 程序集，以及适用于各个平台的额外 Xamarin.Forms 程序集：\n\n- Xamarin.Forms.Platform.Android\n- Xamarin.Forms.Platform.iOS\n\
    - Xamarin.Forms.Platform.WP8\n\n这三个库中的每一个都定义了一个静态的 `Xamarin.Forms.Init` 方法来初始化\
    \ Xamarin.Forms 系统。你还刚刚看到，公共项目通常定义一个名为 `App.GetMainPage` 的公共静态方法。\n\n至少，这三个应用程序项目中的每一个都必须在特定于平台的开销上下文中调用这两个方法。如果你熟悉\
    \ iOS、Android 或 Windows Phone 开发，你可能会好奇这三个平台各自如何处理从 `App.GetMainPage` 方法返回的 Xamarin.Forms\
    \ `Page` 对象。\n\n## iOS 项目\n\niOS 项目通常包含一个派生自 `UIApplicationDelegate` 的类。标准 Xamarin.Forms\
    \ 模板定义了这样一个类，可以在 Hello.iOS 项目的 AppDelegate.cs 文件中找到。这里是删除了所有无关的 `using` 指令和注释后的代码：\n\
    \n```\nusing MonoTouch.Foundation;\nusing MonoTouch.UIKit;\nusing Xamarin.Forms;\n\
    \nnamespace Hello.iOS\n{\n    [Register(\"AppDelegate\")]\n    public partial\
    \ class AppDelegate : UIApplicationDelegate\n    {\n        UIWindow window;\n\
    \n        public override bool FinishedLaunching(UIApplication app,\n        \
    \                                       NSDictionary options)\n```\n\n由 `AndroidActivity`\
    \ 类标注并由 `MainActivity` 继承。\n\n## Windows Phone 项目\n\n在 Windows Phone 项目中，请查看项目文件列表中位于\
    \ MainPage.xaml 文件下方的 `MainPage.xaml.cs` 文件。该文件定义了常规的 `MainPage` 类，并对从 `App.GetMainPage`\
    \ 返回的对象使用 Xamarin.Forms.Platform.WP8 程序集中定义的名为 `ConvertPageToUIElement` 的扩展方法：\n\
    \n```csharp\nusing Microsoft.Phone.Controls;\nusing Xamarin.Forms;\n\nnamespace\
    \ Hello.WinPhone\n{\n    public partial class MainPage : PhoneApplicationPage\n\
    \    {\n        public MainPage()\n        {\n            InitializeComponent();\n\
    \n            Forms.Init();\n            Content = Hello.App.GetMainPage().ConvertPageToUIElement(this);\n\
    \        }\n    }\n}\n```\n\n如果你是 Windows Phone 程序员，可能会想知道 `ConvertPageToUIElement`\
    \ 返回的是 Windows Phone Canvas 对象。\n\n你可能想在 `MainPage` 构造函数中紧接 `InitializeComponent`\
    \ 之后添加以下语句：\n\n```csharp\nthis.SupportedOrientations = SupportedPageOrientation.PortraitOrLandscape;\n\
    ```\n\n这将允许 Windows Phone 显示响应方向变化，并与 iPhone 和 Android 项目保持一致。\n\n## 没什么特别的！\n\
    \n如果你在 Visual Studio 中创建了 Xamarin.Forms 解决方案，并且不希望面向一个或多个平台，直接删除这些项目即可。\n\n如果你后来对这些项目改变了主意——或者你最初是在\
    \ Xamarin Studio 中创建解决方案，而现在想将它移到 Visual Studio 中以面向 Windows Phone——你可以在 Xamarin.Forms\
    \ 解决方案中添加新的平台项目。在 **添加新项目** 对话框中，你可以通过选择 iOS 项目的 **通用** 类型和 **空白应用** 模板来创建 Xamarin.iOS\
    \ 项目，或使用 Android 的 **空白应用** 模板创建 Xamarin.Android 项目，或使用 **应用商店应用 – Windows Phone\
