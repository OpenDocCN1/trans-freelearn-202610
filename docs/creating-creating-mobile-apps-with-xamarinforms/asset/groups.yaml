  mdcn: "\n\n在 Microsoft Windows 世界中，类似的技术被称为*设备无关像素*（DIPs）或*设备无关单位*（DIUs）。对于 Microsoft\
    \ 程序员来说，桌面视频显示器的分辨率被假定为 96 DIUs，这恰好比 72 DPI 高 1/3。\n\n然而，手机有一些不同的规则：现代手机达到的像素密度通常远高于桌面显示器。更高的像素密度使文本和其他视觉对象在难以辨认之前可以缩得更小。\n\
    \n手机通常也比桌面或笔记本电脑屏幕更靠近用户的脸。这种差异也意味着手机上的视觉对象可以比桌面或笔记本电脑屏幕上的相似对象小得多。由于手机的物理尺寸远小于桌面显示器，缩小视觉对象是非常可取的，因为这允许更多内容适应屏幕。\n\
    \nApple 继续将 iPhone 上的设备无关单位称为*点*，但对于 Apple 所有高密度显示屏——Apple 以品牌名*Retina*称呼——每点有两个像素。这对于\
    \ iPhone、iPad 和 MacBook Pro 都适用。\n\n例如，iPhone 4 的 3.5 英寸屏幕的 640 × 960 像素尺寸的实际像素密度约为\
    \ 320 DPI。对于程序员来说，屏幕的尺寸似乎是 320 × 480 点。iPhone 3 实际上确实有 320 × 480 的像素尺寸，并且点等于像素，因此对于程序员来说，iPhone3\
    \ 和 iPhone4 的显示器看起来尺寸相同。但这个尺寸意味着每英寸 160 点的转换因子，而不是 72。\n\niPhone 5 有 4 英寸屏幕，但像素尺寸是\
    \ 640 × 1136，像素密度与 iPhone 4 大致相同。对于程序员来说，这个屏幕的尺寸是 320 × 768 点。\n\nAndroid 的做法非常相似：Android\
    \ 设备有各种各样的尺寸和像素尺寸，但 Android 程序员总是使用*密度无关像素（dps）*作为单位。像素和 dps 之间的关系设定为每英寸 160 dps，这意味着\
    \ Apple 和 Android 的设备无关单位非常相似。\n\n然而，微软在 Windows Phone 上采取了不同的方法。Windows Phone\
    \ 7 设备具有统一的像素尺寸 480 × 800，通常称为 WVGA（宽视频图形阵列）。Windows Phone 7 程序员以像素为单位使用此显示器工作，这意味着\
    \ Windows Phone 隐含假定像素密度约为 240 DPI，这是 iPhone 和 Android 设备假定像素密度的 1.5 倍。\n\n使用\
    \ Windows Phone 8，允许多种更大的屏幕尺寸：768 × 1280（WXGA 或宽扩展图形阵列）、720 × 1280（使用高清晰度电视术语称为\
    \ 720p）和 1080 × 1920（称为 1080p）。\n\n对于这些额外的显示尺寸，程序员使用设备无关单位工作。内部缩放因子在像素和设备无关单位之间转换，以便纵向模式下的屏幕宽度始终看起来为\
    \ 480 像素宽。缩放因子为 1.6（适用于 WXGA）、1.5（720p）和 2.25（1080p）。\n\n被分配了一个大小。你可以在你的 `ContentPage`\
    \ 派生类中重写此方法，而不是处理 `SizeChanged` 事件，但 `OnSizeAllocated` 有时会在大小实际上没有变化时被调用。\n\n\
    注意到 **WhatSize** 程序不会在其 `SizeChanged` 事件处理程序中创建新的 `Label`。它当然可以创建一个新的 `Label`\
    \ 并将其设置为页面的新内容（在这种情况下，先前的 `Label` 将不再被引用，因此符合垃圾回收的条件），但这不必要且浪费。程序在其构造函数中只创建一个\
    \ `Label`，然后仅设置 `Text` 属性来指示页面的新大小：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_207_0.png)\n\
    \n作为记录，这三个图像中屏幕的来源如下：\n\n- **iPhone Retina (3.5 英寸) / iOS 7.1** 模拟器，像素尺寸为 640\
    \ × 960。\n- 一部 LG Nexus 5，屏幕尺寸为 1080 × 1920 像素。\n- 一部 Nokia Lumia 925，屏幕尺寸为 768\
    \ × 1280 像素。\n\n注意到在 Android 上，程序感知到的垂直大小不包括状态栏或底部按钮所占用的区域；Windows Phone 上的垂直大小不包括状态栏所占用的区域。\n\
    \n如果应用程序设置为响应设备方向变化，页面大小会反映手机的方向。这意味着当你将手机或模拟器左右旋转时，**WhatSize** 显示的数字会改变。当这三部手机转向侧面时，它们显示以下尺寸：\n\
    \n- iPhone：480 × 320。\n\n``` \n// Add NamedSize fonts to StackLayout.\nforeach\
    \ (NamedSize namedSize in Enum.GetValues(typeof(NamedSize)))\n{\n    stackLayout.Children.Add(\n\
    \        new Label\n        {\n            Text = String.Format(\"System font\
    \ of named size {0}\",\n                namedSize),\n            Font = Font.SystemFontOfSize(namedSize),\n\
    \            TextColor = Color.Black\n        });\n}\n\n// Resolution in device-independent\
    \ units per inch.\ndouble resolution = Device.OnPlatform(160, 160, 240);\n\n//\
    \ Draw horizontal separator line.\nstackLayout.Children.Add(\n    new BoxView\n\
    \    {\n        Color = Color.Accent,\n        HeightRequest = resolution / 80\n\
    \    });\n\n// Add numeric sized fonts to StackLayout.\nint[] ptSizes = { 4, 6,\
    \ 8, 10, 12 };\n\nforeach (double ptSize in ptSizes)\n{\n    double fontSize =\
    \ resolution * ptSize / 72;\n\n    stackLayout.Children.Add(\n        new Label\n\
    \        {\n            Text = String.Format(\"System font of point size \" +\n\
    \                \"{0} and font size {1:F1}\",\n                ptSize, fontSize),\n\
    \            Font = Font.SystemFontOfSize(fontSize),\n            TextColor =\
    \ Color.Black\n        });\n}\n\n    this.Padding = new Thickness(5, Device.OnPlatform(20,\
    \ 5, 5), 5, 5);\n    this.Content = stackLayout;\n}\n``` \n\n为了便于三个屏幕之间的比较，背景已统一设置为白色，标签设置为黑色。\n\
    \n注意插入到两个 foreach 语句之间的 StackLayout 中的 BoxView。`HeightRequest` 设置使其设备无关高度约为 1/80\
    \ 英寸，并且它类似于水平分隔线。\n\n由此产生的字号在三个平台之间也许不如你希望的那么一致，但它们提供一个粗略的概念，让你了解可以期望什么：\n\n![](img/c2d61d0459c51981af78607f1eef3d1c_210_0.png)\n\
    \n有趣的是，使用设备分辨率计算出的数字大小在平台之间似乎比命名大小更一致，至少在这些设备上是这样。\n\n你可能需要将一块文本适配到特定的矩形区域。有两个数字可以帮助完成这项工作：\n\
    \n第一个是行距。这是每个文本行 `Label` 视图的垂直高度。它与 `Font.SystemFontOfSize` 方法中指定的字号大致相关，如下所示：\n\
    \n- iOS: *LineSpacing* = 1.2 * *FontSize*\n- Android: *LineSpacing* = 1.2 * *FontSize*\n\
    - Windows Phone: *LineSpacing* = 1.3 * *FontSize*\n\n第二个有用的数字是平均字符宽度。这大约是字号的一半，无论平台如何：\n\
    \n- *AverageCharacterWidth* = 0.5 * *FontSize*\n\n例如，假设你想将一个包含 80 个字符的文本字符串适配到\
    \ 320 单位的宽度中。你希望字号尽可能大。将宽度（320）除以字符数的一半（40），你得到字号 8，可用于 `Font.SystemFontOfSize`\
    \ 方法。对于某种程度不确定且无法预先测试的文本，你可能希望使这个计算更保守一些以避免意外。（或者，你可以在 Label 上设置一个 SizeChanged\
    \ 处理程序并动态调整字号，但该过程将生成另一个 SizeChanged 事件，因此该过程可能很棘手。）\n\n以下程序使用行距和平均字符宽度将一段文本适配到页面中——或者更确切地说，适配到页面减去\
    \ iPhone 顶部状态栏所占据的区域。为了在程序中更容易排除状态栏，程序使用了 ContentView。\n\nContentView 派生自 Layout，但仅向它从\
    \ Layout 继承的内容添加了一个 Content 属性。ContentView 是 Frame 的基类，否则似乎没有明显的用途——除非它变得非常方便。\n\
    \n你可能已经注意到，Xamarin.Forms 没有边距的概念，传统上它类似于 padding，区别在于 padding 在视图内部并且是视图的一部分，而\
    \ margin 在视图外部并且实际上是父视图的一部分。\n\nXamarin.Forms 没有 margin 属性，但你可以很容易地用 ContentView\
    \ 模拟它。如果你需要为视图设置边距，将该视图放入 ContentView 并设置 ContentView 的 Padding 属性。ContentView\
    \ 从 Layout 继承了 Padding 属性。\n\nEstimatedFontSize 程序以稍微不同的方式使用 ContentView：它在页面上设置惯用的\
    \ Padding 以避免 iOS 状态栏，然后将 ContentView 设置为该页面的内容。因此，此 ContentView 与页面大小相同，但不包括\
    \ iOS 状态栏。\n\n正是在这个 ContentView 上附加了 SizeChanged 事件，并且正是这个 ContentView 的大小用于计算文本字号。该计算在注释中描述：\n\
    \n``` \nclass EstimatedFontSizePage : ContentPage\n{\n    Label label;\n\n   \
    \ public EstimatedFontSizePage()\n    {\n        // Create the Label.\n      \
    \  label = new Label();\n\n        // Put the Label in a ContentView.\n      \
    \  ContentView contentView = new ContentView\n        {\n            Content =\
    \ label\n        };\n\n        // Monitor the ContentView size changes!\n    \
    \    contentView.SizeChanged += OnContentViewSizeChanged;\n\n        // A little\
    \ padding for iOS.\n        this.Padding = new Thickness(0, Device.OnPlatform(20,\
    \ 0, 0), 0, 0);\n    }\n```\n\n"
