  - '[PAGE 62]


    When adding children to a StackLayout in code, it’s usually a good idea for the
    StackLayout to be disconnected from the page that will eventually display it.
    Every new child added to StackLayout causes the size of the StackLayout to change,
    and if the StackLayout were connected to the page, there would be a lot of layout
    activity going on that isn’t really required.


    The CreateColorLabel method in the class attempts to make each color visible by
    setting a contrasting background. The method calculates a luminance value based
    on a standard weighted average of the red, green, and blue components, and then
    selects a background of either white or black.


    This technique won’t work for Transparent, so that item can’t be displayed at
    all, and the method treats Color.Default as a special case and displays that color
    (whatever it may be) against a Color.Default background.


    Here are the results, which are still quite short of being aesthetically satisfying:


    ![](img/c2d61d0459c51981af78607f1eef3d1c_62_0.png)


    But you can scroll the display.


    You’ll recall that the Layout<T> class defines the Children property that StackLayout
    inherits. The generic Layout<T> class derives from the non-generic Layout class,
    and ScrollView also derives from this non-generic Layout. Theoretically, ScrollView
    is a type of layout object—even though it has only one child.


    As you can see from the screenshot, the background color of the Label extends
    to the full width of the StackLayout, which means that each Label is as wide as
    the StackLayout.


    Let’s experiment a bit to get a better understanding of Xamarin.Forms layout.
