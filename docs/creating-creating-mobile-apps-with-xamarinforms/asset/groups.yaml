    \ + 1)`：\n\n```csharp\nfor (int col = 0; col < 3; col++)\n{\n    grid.ColumnDefinitions.Add(new\
    \ ColumnDefinition\n    {\n        Width = new GridLength(col + 1, GridUnitType.Star)\n\
    \    });\n}\n```\n\n那么第二列的宽度将是第一列的两倍，第三列的宽度将是三倍。\n\n你可以用这种方式指定设备无关单位（例如 150）中的宽度或高度：\n\
    \n`new GridLength(150, GridUnitType.Absolute)`\n\n或使用单参数构造函数：\n\n`new GridLength(150)`\n\
    \n你可以使用以下方式将其设置为 Auto：\n\n`new GridLength(1, GridUnitType.Auto)`\n\n或使用静态属性：\n\
    \n`GridLength.Auto`\n\n在布局过程中，Grid 首先汇总水平和垂直方向上的所有 Absolute 和 Auto 大小，然后在所有 Star\
    \ 宽度和高度之间分配剩余空间。\n\n可以创建一个单维度 Grid。AddHorizontal 和 AddVertical 方法将子项追加到行或列的末尾，这些方法也适用于\
    \ IEnumerable<View> 集合，例如数组。\n\n## Grid 和附加绑定属性\n\n尽管 Grid 为包含单元格索引的 Add 方法以及\
    \ AddHorizontal 和 AddVertical 方法重新定义了其 Children 属性，但你也可以使用常规的 Add 方法：\n\n```csharp\n\
    grid.Children.Add (child);\n```\n\n乍一看这似乎不够，因为它不包含指示该子项的列和行的参数。但与 AbsoluteLayout\
    \ 一样，Grid 定义了附加绑定属性，让你指定该信息。你可以使用这两个静态方法设置 Grid 子项的列和行：\n\n```csharp\nGrid.SetColumn\
    \ (child, 2);\nGrid.SetRow (child, 3);\n```\n\nGrid 还定义了静态 Grid.SetColumnSpan\
    \ 和 Grid.SetRowSpan 方法。行和列跨度默认为 1。Grid 还定义了静态 Get 方法来获取当前值。与 AbsoluteLayout 类定义的静态方法一样，这些方法通过引用附加绑定属性来实现。Grid.SetColumn\
    \ 和 Grid.SetRow 调用等同于在子视图对象上进行的以下调用：\n\n```csharp\nchild.SetValue (Grid.ColumnProperty,\
    \ 2);\nchild.SetValue (Grid.RowProperty, 3);\n```\n\n这就是静态属性的定义方式。\n\n调用\n\n```csharp\n\
    grid.Children.Add (child, 2, 3);\n```\n\n与调用以下内容没有区别：\n\n```csharp\nGrid.SetColumn\
    \ (child, 2);\nGrid.SetRow (child, 3);\ngrid.Children.Add (child);\n```\n\n快捷方法使用\
    \ Grid 定义的静态方法和 Add 调用实现。\n\n在许多情况下，当你使用扩展的 Add 方法定义 Grid 内容时，你不需要使用这些静态方法或费心\
    \ Grid 附加绑定属性。然而，有时它们非常方便，可以在以后更改 Grid 内容的行和列。例如，在 Grid 中移动子项是适应页面方向变化的一种方式。\n\
    \n这里有一个名为 ColorScroll 的程序，它由一个“控制面板”组成，其中包含三个用作单选按钮的 Label 视图，以及三个用于选择颜色的带标签的\
    \ Slider 视图。产生的颜色由占据页面一半的 BoxView 显示。\n\n在纵向模式下，控制面板位于底部，BoxView 位于顶部：\n\n**ColorScroll**\
    \ 还有另一种灵活性：它允许你使用滑块以十六进制 RGB 值、浮点 RGB 值或 HSL 值指定颜色。控制面板顶部三个 `Label` 视图使用前面显示的\
    \ `RadioExtensions` 类；未选中的项其 `Opacity` 属性设置为 0.5。`ColorScrollPage` 类中的许多字段——包括\
    \ `ColorMode` 枚举和三个标签数组——都存在于支持这三种颜色表示之间的切换：\n\n```csharp\nclass ColorScrollPage\
