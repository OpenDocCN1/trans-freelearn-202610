    \ in the Xamarin.Forms.Platform.WP8 assembly named `ConvertPageToUIElement` on\
    \ the object return from `App.GetMainPage`:\n\n```\n```csharp\nusing Microsoft.Phone.Controls;\n\
    using Xamarin.Forms;\n\nnamespace Hello.WinPhone\n{\n    public partial class\
    \ MainPage : PhoneApplicationPage\n    {\n        public MainPage()\n        {\n\
    \            InitializeComponent();\n\n            Forms.Init();\n           \
    \ Content = Hello.App.GetMainPage().ConvertPageToUIElement(this);\n        }\n\
    \    }\n}\n```\n```\n\nIf you’re a Windows Phone programmer, you might be interested\
    \ to know that `ConvertPageToUIElement` returns a Windows Phone Canvas object.\n\
    \nYou might want to add the following statement to the `MainPage` constructor\
    \ right after `InitializeComponent`:\n\n```\n```csharp\nthis.SupportedOrientations\
    \ = SupportedPageOrientation.PortraitOrLandscape;\n```\n```\n\nThat will allow\
    \ the Windows Phone display to respond to orientation changes and be consistent\
    \ with the iPhone and Android projects.\n\n# Nothing special!\n\nIf you’ve created\
