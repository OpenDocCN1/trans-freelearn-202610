  - "[PAGE 163]\n\nThere are actually three different ways that the collection might\
    \ change! Understanding the different types of change associated with collections\
    \ will help you design your data and user interface so that the `ListView` always\
    \ displays the latest and greatest data items.\n\nHere’s the first type of change:\
    \ Perhaps the `CollectionProp` property of the `Data` instance returns a particular\
    \ `List<T>` object when the application starts running, and then something happens\
    \ and the property returns a different `List<T>` object. It’s a completely different\
    \ collection with different items. If that is the case, then the `Data` class\
    \ should implement `INotifyPropertyChanged`, and fire a `PropertyChange` event\
    \ when the `CollectionProp` property changes. Accordingly, the `ItemsSource` property\
    \ of `ListView` should not simply be set to the `CollectionProp` property but\
    \ must be bound to the property with a data binding:\n\n```\nlistView.BindingContext\
    \ = data;\nlistView.SetBinding(ListView.ItemsSourceProperty, \"CollectionProp\"\
    );\n```\n\nThat’s one way the collection might change. Here’s a second way: The\
    \ `List<T>` object returned by the `CollectionProp` property might remain the\
    \ same while the program is running, but items might be added to or removed from\
    \ the collection dynamically, or perhaps reordered or resorted in some way, and\
    \ of course you would like the `ListView` display to reflect the updated contents.\n\
    \nThis is the type of change that **NoteTaker8** will need to handle. The `ListView`\
    \ in **NoteTaker8** will display the collection of notes, but the user can add\
    \ notes and delete notes to the collection while the program is running. The `ListView`\
    \ must respond to those changes. At first, this sounds like a difficult requirement.\
    \ How can the `ListView` determine that the collection that is set to (or bound\
    \ to) its `ItemsSource` property has acquired a new item or lost an existing item?\n\
    \nThrough an event, of course! You already know about the `INotifyPropertyChanged`\
    \ interface in the `System.ComponentModel` namespace defined like so:\n\n```\n\
    public interface INotifyPropertyChanged\n{\n    event PropertyChangingEventHandler\
    \ PropertyChanged;\n}\n```\n\nThe `System.Collections.Specialized` namespace contains\
    \ a related and similar interface named `INotifyCollectionChanged`:\n\n```\npublic\
    \ interface INotifyCollectionChanged\n{\n    event NotifyCollectionChangedEventHandler\
    \ CollectionChanged;\n}\n```\n\nA collection class can implement this interface\
    \ and notify the outside world when an object has been added to or removed from\
    \ the collection, or the items have been reordered in some way. The event argument\
    \ associated with `NotifyCollectionChangedEventHandler` provides details on this\
    \ change.\n\n`ListView` knows about `INotifyCollectionChanged`. Whenever a collection\
    \ object is set to its"
  - "[PAGE 164]\n\nItemsSource property, ListView checks if that collection object\
    \ implements this interface. If so, ListView attaches a handler on the CollectionChanged\
    \ event of that collection object. The ListView is then notified when objects\
    \ are added to or removed from the collection (or if the objects are reordered\
    \ in some way), and updates the ListView display accordingly.\n\nNow all we need\
    \ is an actual class that implements INotifyCollectionChanged, and there is one:\
    \ It's in the System.Collections.ObjectModel namespace and it's a generic class\
    \ called ObservableCollection, which is a great name because it implies that by\
    \ using the CollectionChanged event you can observe what's going on inside the\
    \ collection.\n\nThere is also a third way that a collection can change. Perhaps\
    \ the collection object itself doesn't change, and objects are not added to, or\
    \ removed from, the collection, but properties of the objects in the collection\
    \ change. For example, suppose your collection contains a bunch of Weather objects\
    \ for major cities. The collection itself never changes but the Weather class\
    \ contains a Temperature property that changes throughout the day. If this Weather\
    \ object implements INotifyPropertyChanged and fires PropertyChanged events when\
    \ the Temperature property changes, the ListView can respond to those changes\
    \ as well.\n\nNoteTaker8 definitely requires an ObservableCollection, so let's\
    \ handle that first. Let's create a class that will store a collection of Note\
    \ objects. The NoteFolder class has a single property named Notes that is of type\
    \ ObservableCollection<Note>. The constructor calls an asynchronous method that\
    \ obtains a list of all the files using FileHelper.GetFilesAsync, and then sorts\
    \ them by filename. (Keep in mind that the filenames are constructed from the\
    \ date and time when the Note object was created, so these filenames will be sorted\
    \ into the order in which the files were created.) Then a Note object is created\
    \ for each filename, the LoadAsync method is called to load the file into the\
    \ Note object, and it's added to the Notes collection:\n\n```\nnamespace NoteTaker8\n\
    {\n    class NoteFolder\n    {\n        public NoteFolder()\n        {\n     \
    \       this.Notes = new ObservableCollection<Note>();\n            GetFilesAsync();\n\
    \        }\n\n        public ObservableCollection<Note> Notes { private set; get;\
    \ }\n\n        async void GetFilesAsync()\n        {\n            // Sort the\
    \ filenames.\n            IEnumerable<string> filenames =\n                from\
    \ filename in await FileHelper.GetFilesAsync()\n                where filename.EndsWith(\"\
    .note\")\n                orderby (filename)\n                select filename;\n\
    \n            // Store them in the Notes collection.\n```"
