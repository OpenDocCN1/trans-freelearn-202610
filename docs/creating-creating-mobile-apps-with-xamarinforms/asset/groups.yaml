  - "[PAGE 151]\n\n# CHAPTER 4\n\n# Building an app: Architecture\n\nThe **NoteTaker**\
    \ application has evolved from a concept to a single-page program that contains\
    \ much of the basic infrastructure to save and retrieve a note. It must now be\
    \ expended to a multipage application that can display and maintain multiple notes.\n\
    \nThis chapter illustrates the steps to implement all the necessary features for\
    \ that enhanced version. Two important Xamarin.Forms visual elements are necessary:\
    \ The first is `NavigationPage`, which allows a program to navigate among multiple\
    \ pages, and the second is `ListView`, which displays a scrollable and selectable\
    \ list of items, usually of the same type. In this program, `ListView` will display\
    \ multiple `Note` objects.\n\nAlso required for specifying some program actions\
    \ is `ToolbarItem`. Strictly speaking, `ToolbarItem` is not a visual element,\
    \ but it's used to specify items for a toolbar displayed at the top of the page\
    \ (on iOS and Android) or the bottom (on Windows Phone).\n\nFrom the programmer's\
    \ perspective, one of the big differences between programming for traditional\
    \ desktop applications and programming for mobile applications is the need to\
    \ understand the application lifecycle. Between the time that a mobile app is\
    \ launched and the time it is terminated, the app might be suspended. It is important\
    \ at this time for applications to save application data—including transient data—necessary\
    \ to re-create the contents of the application when it's restarted. Application\
    \ lifecycle programming is also a major part of creating a real app.\n\n# Version\
    \ 7. Page navigation\n\nSo far, all the programs in this book have been based\
    \ around a single instance of a single class that derives from `ContentPage`.\
    \ In contrast, **NoteTaker7** contains two classes that derive from `ContentPage`,\
    \ named `HomePage` and `NotePage`. When the program starts up, it displays `HomePage`,\
    \ which lists all the notes you've entered in previous sessions. From `HomePage`\
    \ the user is able to navigate to `NotePage` for entering new notes, or for editing\
    \ or deleting existing notes, and then navigate back to `HomePage`, which displays\
    \ an updated list.\n\nThe methods that Xamarin.Forms makes available for page\
    \ navigation are all defined by the `INavigation` interface in the `Xamarin.Forms`\
    \ namespace:\n\n```\npublic interface INavigation\n{\n    Task PushAsync(Page\
    \ page);\n    Task<Page> PopAsync();\n    Task PopToRootAsync();\n    Task PushModalAsync(Page\
    \ page);\n}\n```"
