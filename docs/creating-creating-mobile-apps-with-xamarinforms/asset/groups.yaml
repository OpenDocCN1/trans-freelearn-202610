    \n`AbsoluteLayout` 重新定义了其 `Children` 属性，以提供一些快捷方式。你可以在将子视图添加到 `AbsoluteLayout`\
    \ 时指定初始位置和大小：\n\n```\nabsoluteLayout.Children.Add(child, new Rectangle(x, y, width,\
    \ height));\n```\n\n或者，如果你希望视图自动调整大小：\n\n```\nabsoluteLayout.Children.Add(child,\
    \ new Point(x, y));\n```\n\n但是，如果在子元素已添加到 `Children` 集合后需要更改其位置和大小，则必须使用静态 `AbsoluteLayout.SetLayoutBounds`\
    \ 方法。\n\n可以推测，使用 `AbsoluteLayout` 比使用 `StackLayout` 更困难。通常，让 Xamarin.Forms 和其他\
    \ `Layout` 类为你处理大部分布局复杂性要容易得多。但对于某些特殊应用来说，`AbsoluteLayout` 是理想的选择。\n\n其中一个特殊应用是\
