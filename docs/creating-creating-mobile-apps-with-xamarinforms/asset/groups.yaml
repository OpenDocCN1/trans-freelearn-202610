    \ `Label` 视图的事件处理程序有两个任务：设置 `Label` 的 `Opacity` 以指示哪个被选中，以及设置新的颜色模式。然而，实际对滑块和标签进行所有更改的工作被委派给一个单独的方法：\n\
    \n```\n```csharp\nclass ColorScrollPage : ContentPage\n{\n    ...\n\n    void\
    \ OnRadioLabelToggled(View view)\n    {\n        // 设置 Opacity 以指示切换状态。\n    \
    \    view.Opacity = view.GetRadioState() ? 1.0 : 0.5;\n\n        // 可能更改当前颜色模式。\n\
    \        if (view.GetRadioState())\n        {\n            ColorMode newColorMode\
    \ =\n                (ColorMode) Enum.Parse(typeof(ColorMode), view.StyleId);\n\
    \n            if (currentColorMode != newColorMode)\n            {\n         \
    \       currentColorMode = newColorMode;\n```\n```\n```\nSetSlidersAndBindings\
    \ ();\n    }\n  }\n}\n...\n}\n```\n\n`SetSlidersAndBindings` 方法负责根据新的颜色模式设置所有\
    \ `Slider` 属性。例如，对于十六进制 RGB 模式，每个 `Slider` 的 Maximum 属性必须设置为 255。根据颜色模式，`Slider`\
    \ 值本身必须基于当前颜色的 R、G、B 或 Hue、Saturation 和 Luminosity 属性来设置。\n\n`SetSlidersAndBindings`\
    \ 还负责从三个 `Slider` 视图的 `Value` 属性设置到标识这些滑块的三个 `Label` 视图的绑定。这些绑定使用定义为字段数组的格式字符串组。对于浮点\
    \ RGB 或 HSL 模式，格式规范为“F2”，对于十六进制 RGB 模式，格式规范为“X2。”\n\n这就是问题所在。`Slider` 的 `Value`\
    \ 属性的类型为 `double`，如果你尝试用“X2”格式化一个 `double`，将会引发异常。\n\n在代码中，从 `double` 转换为 `int`\
    \ 只是一个简单的强制转换。但在定义数据绑定时，你无法直接访问从源到目标传递的数据。那么该如何实现呢？\n\n幸运的是，`Binding` 构造函数和 `Binding.Create`\
    \ 方法都有一个类型为 `IValueConverter` 的参数，专门用于此目的。`IValueConverter` 是一个定义了 `Convert` 和\
    \ `ConvertBack` 两个方法的接口。你提供一个实现此接口的类来执行所需的转换。`Convert` 方法在属性值从源传递到目标时被调用。`ConvertBack`\
    \ 方法仅在 `TwoWay` 或 `OneWayToSource` 绑定中起作用，用于将目标类型转换为源类型。\n\n以下是将 double 转换为 int\
    \ 的 `IValueConverter` 实现：\n\n```\npublic class DoubleToIntegerConverter : IValueConverter\n\
    {\n    public object Convert(object value, Type targetType,\n                \
    \          object parameter, CultureInfo culture)\n    {\n        return (int)(double)value;\n\
    \    }\n\n    public object ConvertBack(object value, Type targetType,\n     \
    \                         object parameter, CultureInfo culture)\n    {\n    \
    \    return (double)(int)value;\n    }\n}\n```\n\n尽管这无疑是最简单的 `IValueConverter`\
    \ 实现之一，但它们通常并不复杂。在 `Convert` 中，`value` 参数是源的值，返回值传递给目标。你可以通过检查 `targetType` 参数来自定义该方法，该参数是目标属性的类型。你还可以从\
    \ `Binding` 构造函数或 `Binding.Create` 方法传递一个 `parameter`。你将在后续章节中看到更多示例。\n\n`SetSlidersAndBindings`\
    \ 方法在需要为绑定时实例化 `DoubleToIntConverter`。在实际程序中，程序生命周期内只需要一个 `DoubleToIntConverter`\
    \ 实例，你可以将其作为字段实例化。\n\n```\nclass ColorScrollPage : ContentPage\n{\n    …\n\n \
    \   void SetSlidersAndBindings()\n    {\n        // 不要处理滑块的 ValueChange 事件！\n\
    \        ignoreSliderValueChanges = true;\n\n        double sliderMax = 1;\n \
    \       string[] format = null;\n        IValueConverter valueConverter = null;\n\
    \n        // 为颜色模式设置局部变量。\n        switch (currentColorMode)\n        {\n    \
    \        case ColorMode.RgbHex:\n                sliderMax = 255;\n          \
    \      format = rgbHexFormat;\n                valueConverter = new DoubleToIntegerConverter();\n\
    \                break;\n\n            case ColorMode.RgbFloat:\n            \
    \    format = rgbFloatFormat;\n                break;\n\n            case ColorMode.Hsl:\n\
    \                format = hslFormat;\n                break;\n        }\n\n  \
    \      // 将标签绑定到滑块。\n        for (int i = 0; i < 3; i++)\n        {\n        \
    \    sliders[i].Maximum = sliderMax;\n            labels[i].BindingContext = sliders[i];\n\
    \            labels[i].SetBinding(Label.TextProperty,\n                new Binding(\"\
    Value\", BindingMode.OneWay, valueConverter, null, format[i]));\n        }\n\n\
    \        // 现在设置滑块值。\n        Color currentColor = this.currentColor;\n```\n\n\
