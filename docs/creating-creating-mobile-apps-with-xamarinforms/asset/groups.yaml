  mdcn: "\n这些属性和字段密切相关。实际上，在 Entry 类内部，Text 属性是这样定义的：\n\n```\npublic string Text\n\
    {\n    set { SetValue(Entry.TextProperty, value); }\n    get { return (string)GetValue(Entry.TextProperty);\
    \ }\n}\n```\n\n所以你明白了，应用程序对 Entry.TextProperty 调用 SetValue 与设置 Text 属性完全等价，而且也许还会快那么一点点！\n\
    \nEntry 中 Text 属性的内部定义并不是秘密信息。这是标准代码。SetValue 和 GetValue 方法由 BindableObject 定义，这个类也为许多\
    \ Xamarin.Forms 类实现了 INotifyPropertyChanged。维护 Text 属性的所有实际工作都发生在这些 SetValue 和\
    \ GetValue 调用中。GetValue 方法需要强制转换，因为它被定义为返回 object。\n\n静态的 Entry.TextProperty 对象的类型是\
    \ BindableProperty，你可能会正确地推测它是与 BindableObject 相关的类，但重要的是要在心中区分它们：BindableObject\
    \ 是许多 Xamarin.Forms 类派生自的类，并为 BindableProperty 类型的对象提供支持。\n\nBindableProperty\
    \ 对象有效地扩展了标准 C# 属性的功能。可绑定属性提供了系统化的方式来：\n\n- 定义属性\n- 为属性提供默认值\n- 存储它们的当前值\n- 提供验证属性值的机制\n\
    - 在单个类中维护相关属性之间的一致性\n- 响应属性更改\n- 在属性即将更改和已更改时触发通知\n\n此外，BindableObject 和 BindableProperty\
    \ 还为动画和数据绑定提供机制。它们是 Xamarin.Forms 基础设施的重要组成部分。\n\n名为 Text 的属性与名为 TextProperty\
    \ 的 BindableProperty 之间的紧密关系，体现在程序员谈论这些属性的方式上：有时程序员会说 Text 属性“由”名为 TextProperty\
    \ 的 BindableProperty“支撑”，因为 TextProperty 为 Text 属性提供基础设施支持。但一种常见的简便说法是，Text 本身就是一个“可绑定属性”，通常没有人会感到困惑。\n\
    \n并非每个 Xamarin.Forms 属性都是可绑定属性。ContentPage 的 Content 属性和 `Layout<T>`（StackLayout\
    \ 派生自它）的 Children 属性都不是可绑定属性。有时对非可绑定属性的更改会触发 PropertyChanged 事件，但这并不能保证。只有可绑定属性才能保证触发\
    \ PropertyChanged 事件。\n\n在本书后面，你将看到如何定义自己的可绑定属性。\n\n## 自动数据绑定\n\n正如你所见，可以在 Entry\
    \ 和 Editor 上安装事件处理程序来确定 Text 属性何时更改，并利用这一时机设置 Note 类的 Title 和 Text 属性。类似地，你可以使用\
    \ Note 类的 PropertyChanged 事件来保持 Entry 和 Editor 的更新。\n\n换句话说，NoteTaker4 程序将对象和属性配对，使它们互相跟踪彼此的值。当一个属性更改时，另一个也会更新。\n\
    \n事实证明，这类任务非常常见，这就是 Xamarin.Forms 允许使用一种称为数据绑定的技术来自动化此类任务的原因。\n\n数据绑定涉及源和目标。源是发生变化的对象和属性，目标是随之被更改的对象和属性。但这是一种简化。虽然在任何特定数据绑定中，目标和源之间的区别都有明确定义，但有时这些属性会以不同方式相互影响：有时目标会促使源更新，有时源和目标会相互更新。\n\
    \nXamarin.Forms 中的数据绑定机制使用 PropertyChanged 事件来确定源属性何时已更改。因此，数据绑定中使用的源属性必须是实现了\
    \ INotifyPropertyChanged 的类的一部分（直接实现或通过继承实现），并且当该属性更改时，该类必须触发 PropertyChanged\
    \ 事件。（实际上这并不完全正确：如果源属性从不更改，数据绑定要工作并不需要 PropertyChanged 事件，但这只是一种“一次性”数据绑定，没什么意思。）\n\
    \n数据绑定的目标属性必须由 BindableProperty 支持。正如你将看到的，这一要求是由数据绑定的编程接口强制的。你不能在未引用 BindableProperty\
    \ 对象的情况下设置数据绑定！\n\n在 NoteTaker5 程序中，Entry 和 Editor 的 Text 属性是绑定目标，因为它们由名为 TextProperty\
    \ 的可绑定属性支持。Note 类的 Title 和 Text 属性是绑定源。Note 类实现了 INotifyPropertyChanged，因此当这些源属性更改时会触发\
    \ PropertyChanged 事件。\n\n你可以用两个语句定义一个数据绑定，使目标属性随着源属性的值保持更新：第一条语句通过将目标对象的 BindingContext\
    \ 属性设置为源对象，将两个对象关联起来。在本例中，源对象是 Note 类的实例：\n\n在内部，这四个语句会设置类似的事件处理程序。数据绑定机制就是这样工作的。\n\
    \n然而，这四个语句实际上可以减少到三个语句。方法如下：\n\nBindingContext 属性有一个非常特殊的特性。一个页面上的多个数据绑定很可能共享同一个\
    \ BindingContext。这个小例子就是如此。因此，BindingContext 属性会通过页面的可视化树进行传播。换句话说，如果你在页面上设置 BindingContext，它会传播到该页面上的所有视图，但那些将自己的\
    \ BindingContext 属性设置为其他值的视图除外。你可以在 StackLayout 上设置 BindingContext，它将传播到该 StackLayout\
    \ 的所有子级（及其他后代）。上面显示的两个 BindingContext 设置可以替换为在页面本身上设置一个：\n\n```\nthis.BindingContext\
    \ = note;\n```\n\n这些自动数据绑定是 NoteTaker5Page 类的一部分。此外，Load 和 Save 按钮的处理程序已变成 lambda\
    \ 函数，所有变量都已移到构造函数中，代码此刻看起来相当简洁：\n\n```\nclass NoteTaker5Page : ContentPage\n{\n\
    \    static readonly string FILENAME = \"test.note\";\n\n    public NoteTaker5Page()\n\
    \    {\n        // Create Entry and Editor views.\n        Entry entry = new Entry\n\
    \        {\n            Placeholder = \"Title (optional)\"\n        };\n\n   \
    \     Editor editor = new Editor\n        {\n            Keyboard = Keyboard.Create(KeyboardFlags.All),\n\
    \            BackgroundColor = Device.OnPlatform(Color.Default,\n            \
    \    Color.Default,\n                Color.White),\n            VerticalOptions\
    \ = LayoutOptions.FillAndExpand\n        };\n\n        // Set data bindings.\n\
    \        Note note = new Note();\n        this.BindingContext = note;\n      \
    \  entry.SetBinding(Entry.TextProperty, \"Title\");\n        editor.SetBinding(Editor.TextProperty,\
    \ \"Text\");\n\n        // Create Save and Load buttons.\n        Button saveButton\
    \ = new Button\n        {\n            Text = \"Save\",\n            HorizontalOptions\
    \ = LayoutOptions.CenterAndExpand\n```\n\n通过用数据绑定替换显式事件处理程序，我们也成功忘掉了 Note 类中 PropertyChanged\
    \ 事件从辅助线程触发的问题。使用数据绑定时，你不必担心这一点。\n\n最终，NoteTaker 应用程序将不再处理单个 Note 对象，而是拥有一个 Note\
    \ 对象集合。有了这些数据绑定，你可以通过将任意一个 Note 对象设置为页面的 BindingContext 来查看和编辑它。不过这要等到下一章。\n\n\
    与此同时，让我们看看是否能进一步简化这个页面代码。一个主要的候选是那些基于 FileHelper.Exists 调用来启用 Load 按钮的代码。也许解决这个问题还会简化程序的其他一些部分。\n\
    \n## 版本 6：等待结果\n\n正如你所见，异步操作可能难以管理。有时代码执行的顺序与你预期的不同，需要花些心思才能弄清楚发生了什么。异步编程可能永远都不会像单线程编码那样简单，但\
    \ 2012 年发布的 C# 5.0 已经缓解了处理异步操作的部分困难。C# 5.0 引入了一种革命性的变化，改变了程序员处理异步操作的方式。这一变化由一个名为\
    \ async 的关键字和一个名为 await 的操作符组成。\n\nasync 关键字主要用于向后兼容。而 await 操作符才是重头戏。它让程序员可以像处理相对普通的命令式编程语句一样处理异步函数，而无需使用回调方法。\n\
    \n让我们看一个可能出现在 Windows Phone 8 程序中的异步方法的通用用法。你的程序中有一个方法，它调用操作系统中的异步方法，并设置一个实现为单独方法的\
    \ Completed 处理程序。注释表示该方法中可能出现的一些其他代码：\n\n```\nvoid SomeMethod()\n{\n    // Often\
    \ some initialization code\n    IAsyncOperation<SomeType> asyncOp = sysClass.LongJobAsync(...);\n\
    \    // Some additional code\n    asyncOp.Completed = MyCompletedHandler;\n  \
    \  // And perhaps still more code\n}\n```\n\n设置 Completed 属性的语句会快速返回，而实际的异步操作在后台继续运行。SomeMethod\
    \ 中的所有代码都会在回调方法被调用之前执行。如果你选择忽略后台过程中遇到的取消或错误，Completed 处理程序可能如下所示：\n\n```\nvoid\
    \ MyCompletedHandler(IAsyncOperation<SomeType> op, AsyncStatus status)\n```\n"
