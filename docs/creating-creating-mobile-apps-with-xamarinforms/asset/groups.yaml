  - "[PAGE 175]\n\n# Version 10. Adding a template cell\n\nIf you experiment with\
    \ the editing facility of NoteTaker9, you might discover a bug. If you edit a\
    \ title—or if a note doesn’t have a title but you edit part of the text used for\
    \ the title—you won’t see the updated version of the note in the ListView. Terminate\
    \ the program and start it up again, and your edits will appear.\n\nThe problem\
    \ involves the simple approach taken to displaying the Note in the ListView using\
    \ the ToString method. That’s what ListView uses in the simple case, but it’s\
    \ not adequate. ListView calls the ToString method of every item when first displaying\
    \ those items but is never informed when ToString might return a different value.\n\
    \nFixing this problem requires a little deeper use of ListView.\n\nTo display\
    \ the items in the ItemsSource collection, ListView uses an object called a cell.\
    \ This cell is a view (or a tree of views) that serves as a template. The ListView\
    \ uses this cell to generate the same view (or a tree of views) for each item\
    \ in the collection. Normally, that would result in all the items being displayed\
    \ in exactly the same way. However, this cell can contain data bindings that reference\
    \ properties in the ListView items—the Note objects in this case.\n\nYou can make\
    \ your own cells by using ViewCell, but several preexisting cells are available.\
    \ The simplest is TextCell, which simply consists of a Label. The ListView uses\
    \ a TextCell if no cell is specified, but the advantage of explicitly specifying\
    \ a TextCell is that you can bind the Text property to a property in Note.\n\n\
    Note needs a new property to identify the object in the ListView. Let’s call this\
    \ property Identifier. The Identifier property will return the same string as\
    \ the ToString method in the previous version of Note, but the big difference\
    \ is that Identifier property also fires the PropertyChanged event.\n\nIf the\
    \ Title property changes, the Identifier property must also change, and if the\
    \ Title property is empty and the Text property changes, Identifier will change\
    \ as well.\n\nHere’s the pertinent new logic in Note:\n\n```\nnamespace NoteTaker10\n\
    {\n    class Note : INotifyPropertyChanged\n    {\n        string title, text,\
    \ identifier;\n\n        ...\n\n        public string Title\n        {\n     \
    \       set\n            {\n                if (SetProperty(ref title, value))\n\
    ```"
