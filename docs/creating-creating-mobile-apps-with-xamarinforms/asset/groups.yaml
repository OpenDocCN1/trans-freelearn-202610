    \ stack: Each PushAsync call pushes the current page on the stack and navigates\
    \ to the specified page. Each call to PopAsync pops the previous page from the\
    \ stack and navigates back to that popped page. This architecture is very familiar\
    \ to users because web browsers work similarly.\n\nExplicit calls to PopAsync\
    \ are not always required because the user can often navigate backward using the\
    \ hardware back button on the Android or Windows Phone, or a back button automatically\
    \ supplied as part of the page navigation user interface by iOS and Android. The\
