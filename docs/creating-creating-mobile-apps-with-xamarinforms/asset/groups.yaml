- raw:
  - '[PAGE 25]


    connect a real Android phone to either the Mac or PC for testing. All you really
    need do is enable USB Debugging on the device.


    If you like the idea of testing on real devices but you want to test on more real
    devices than you can possibly manage yourself, look into the Xamarin Test Cloud.


    # Installation


    Before writing applications for Xamarin.Forms, you’ll need to install the Xamarin
    platform on your Mac and/or your PC. See the articles on the Xamarin website at:


    *http://developer.xamarin.com/guides/cross-platform/getting_started/installation*


    You’re probably eager to create your first Xamarin.Forms application, but before
    you do, you’ll want to try creating normal Xamarin projects for the iPhone and
    Android, and a normal Windows Phone project.


    This is important: If you’re experiencing a problem using Xamarin.iOS or Xamarin.Android,
    that’s not a problem with Xamarin.Forms, and you’ll need to solve that problem
    before using Xamarin.Forms.


    # Creating an iOS app


    If you’re interested in using Xamarin.Forms to target the iPhone, first become
    familiar with the appropriate Getting Started documents on the Xamarin website:


    *http://developer.xamarin.com/guides/ios/getting_started/*


    This will give you guidance on using the Xamarin.iOS library to develop an iPhone
    application in C#. All you really need to do is get to the point where you can
    build and deploy a simple iPhone application on either a real iPhone or the iPhone
    simulator.


    If you’re using Xamarin Studio, you should be able to select **File > New > Solution**
    from the menu, and in the **New Solution** dialog, from the left select **C#**
    and **iOS** and then **Universal**, and from the template list in the center select
    **Empty Project**.


    If you’re using Visual Studio, you should be able to select **File > New > Project**
    from the menu, and in the **New Project** dialog, from the left select **Visual
    C#** and **iOS** and then **Universal**, and from the template list in the center
    select **Blank App (iOS)**.


    In either case, select a location and name for the solution. Build and deploy
    the skeleton application created in the project. If you’re having a problem with
    this, it’s not a Xamarin.Forms issue. You might want to check the Xamarin.iOS
    forums to see if anybody else has a similar problem:


    *http://forums.xamarin.com/categories/ios*'
