  - "[PAGE 32]\n\nfor the three different platforms, and you’ll see shortly how to\
    \ do that. You can also include platform-specific code in the three application\
    \ projects.\n\nThe three application projects have their own assets in the form\
    \ of icons and metadata, and you must pay these assets particular attention if\
    \ you intend to bring the application to market. But during the time that you’re\
    \ learning how to develop applications using Xamarin.Forms, these assets can generally\
    \ be ignored. You’ll probably want to keep these application projects collapsed\
    \ in the solution list because you don’t need to bother much with their contents.\n\
    \nBut you really should know what’s in these application projects, so let’s take\
    \ a closer look.\n\nIn the **References** section of each application project,\
    \ you’ll see references to the common project (**Hello** in this case), as well\
    \ as various .NET assemblies, the Xamarin.Forms assemblies listed above, and additional\
    \ Xamarin.Forms assemblies applicable to each platform:\n\n+   - Xamarin.Forms.Platform.Android\n\
    +   - Xamarin.Forms.Platform.iOS\n+   - Xamarin.Forms.Platform.WP8\n\nEach of\
    \ these three libraries defines a static `Xamarin.Forms.Init` method to initialize\
    \ the Xamarin.Forms system. You’ve also just seen that the common project customarily\
    \ defines a public static method named `App.GetMainPage`.\n\nAt the very least,\
    \ each of the three application projects must make calls to these two methods\
    \ in the context of platform-specific overhead. If you’re familiar with iOS, Android,\
    \ or Windows Phone development, you might be curious to discover what each of\
    \ these three platforms does with the Xamarin.Forms `Page` object returned from\
    \ that `App.GetMainPage` method.\n\n# The iOS project\n\nAn iOS project typically\
    \ contains a class that derives from `UIApplicationDelegate`. The standard Xamarin.Forms\
    \ template defines such a class, which can be found in the AppDelegate.cs file\
    \ in the Hello.iOS project. Here it is stripped of all extraneous `using` directives\
    \ and comments:\n\n```\nusing MonoTouch.Foundation;\nusing MonoTouch.UIKit;\n\
    using Xamarin.Forms;\n\nnamespace Hello.iOS\n{\n    [Register(\"AppDelegate\"\
    )]\n    public partial class AppDelegate : UIApplicationDelegate\n    {\n    \
    \    UIWindow window;\n\n        public override bool FinishedLaunching(UIApplication\
    \ app,\n                                               NSDictionary options)\n\
    ```"
