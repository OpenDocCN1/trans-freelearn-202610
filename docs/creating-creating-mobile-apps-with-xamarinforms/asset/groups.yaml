    DependencyService is not the only way to deal with application lifecycle issues
    in a Xamarin.Forms application. Because the PCL does not need to make calls into
    the platform projects, the MessageCenter class can also provide a means for the
    platforms to signal application lifecycle activity to the shared project.


    Some final advice: Dealing with application lifecycle issues is an important part
    of mobile development, and you’ll have best results if you plan ahead. You should
    build application lifecycle handling into the application from the very beginning.
    Don’t leave it to the end. If you’re getting around to handling application lifecycle
    issues in the twelfth version of your program, you’re doing it wrong. It’s going
    to feel like a hack, and it might even appear like a hack.


