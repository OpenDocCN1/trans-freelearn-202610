    \n    public ColorScrollPage()\n    {\n        // Define a 2 x 2 Grid that will\
    \ be modified for portrait\n        // or landscape in SizeChanged handler.\n\
    \        mainGrid = new Grid\n        {\n            ColumnDefinitions =\n   \
