    \ code\n    SomeType myResult = await sysClass.LongJobAsync(...);\n    // Code\
    \ using the result of the asynchronous operation\n}\n```\n\n这就是 `await` 的惯用方式——作为异步运行的方法与保存结果的赋值语句之间的运算符。\n\
    \n别被 `await` 运算符的名字骗了！代码实际上并不是在那里等待。`SomeMethod` 方法会返回，处理器可以自由运行其他代码。只有当异步操作完成时，`SomeMethod`\
    \ 中的代码才会从它停下的地方继续执行。\n\n当然，每当我们处理文件 I/O 时，都应该做好应对问题的准备。如果文件不存在，或者存储空间不足，会发生什么？即使没有问题发生，有时错误结果也是正常的：Windows\
    \ Phone 版本的 `Exists` 方法使用 `Completed` 处理程序中报告的错误来确定文件是否存在。那么，使用 `await` 时如何处理错误呢？\n\
    \n如果你使用 `await` 执行遇到错误或被取消的异步操作，`await` 会抛出异常。如果你需要处理错误或取消，可以将 `await` 运算符放在 `try`/`catch`\
    \ 块中，看起来像这样：\n\n```csharp\nSomeType myResult = null;\ntry\n{\n    myResult = await\
    \ sysClass.LongJobAsync(...);\n}\ncatch (OperationCanceledException)\n{\n    //\
    \ handle a cancellation\n}\ncatch (Exception exc)\n{\n    // handle an error\n\
    }\n```\n\n现在让我们在一些实际代码中使用 `await`。下面是 NoteTaker5 中旧版 `ReadAllText` 方法的 Windows\
    \ Phone 版本：\n\n```csharp\npublic void ReadAllText(string filename, Action<string>\
    \ completed)\n{\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
    \    IAsyncOperation<StorageFile> createOp = localFolder.GetFileAsync(filename);\n\
    \    createOp.Completed = (asyncInfo1, asyncStatus1) =>\n    {\n        IStorageFile\
    \ storageFile = asyncInfo1.GetResults();\n        IAsyncOperation<IRandomAccessStreamWithContentType>\
    \ openOp =\n            storageFile.OpenReadAsync();\n        openOp.Completed\
    \ = (asyncInfo2, asyncStatus2) =>\n        {\n            IRandomAccessStream\
    \ stream = asyncInfo2.GetResults();\n            DataReader dataReader = new DataReader(stream);\n\
    \            uint length = (uint)stream.Size;\n            DataReaderLoadOperation\
    \ loadOp = dataReader.LoadAsync(length);\n            loadOp.Completed = (asyncInfo3,\
    \ asyncStatus3) =>\n            {\n                string text = dataReader.ReadString(length);\n\
    \                dataReader.Dispose();\n                completed(text);\n   \
    \         };\n        };\n    };\n}\n```\n\n这里有三个嵌套的 `Completed` 处理程序。因为方法在第一个\
    \ `Completed` 处理程序执行之前就返回了，所以不可能从方法中返回文件的内容。文件内容必须通过传递给方法的函数返回。\n\n下面是使用 `await`\
    \ 重写后的版本：\n\n```csharp\npublic async void ReadAllText(string filename, Action<string>\
    \ completed)\n{\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
    \    IStorageFile storageFile = await localFolder.GetFileAsync(filename);\n  \
    \  IRandomAccessStream stream = await storageFile.OpenReadAsync();\n    DataReader\
    \ dataReader = new DataReader(stream);\n    uint length = (uint)stream.Size;\n\
    \    await dataReader.LoadAsync(length);\n    string text = dataReader.ReadString(length);\n\
    \    dataReader.Dispose();\n    completed(text);\n}\n```\n\n注意方法上的 `async` 修饰符。`async`\
    \ 修饰符不会改变方法的签名，因此该方法仍然被视为 `IFileHelper` 接口中 `ReadAllText` 方法的正确实现。\n\n`await`\
    \ 运算符出现了三次；前两次作用于返回对象的方法，第三次作用于 `LoadAsync` 方法，该方法只执行操作而不返回任何内容。\n\n在幕后，C# 编译器将这个方法分成了四个执行块。方法在第一个\
    \ `await` 运算符处返回给调用者（`Note` 类），然后在 `GetFileAsync` 方法完成时恢复执行，接着在下一个 `await` 处再次离开，依此类推。\n\
    \n实际上，`ReadAllText` 方法有可能从头到尾按顺序执行。如果异步方法在执行到 `await` 运算符之前就完成了操作，执行就会像普通函数调用一样继续下去。这是一种性能优化，在移动设备相对较快的固态文件\
    \ I/O 中经常发挥作用。\n\n让我们稍微改进一下这个 `ReadAllText` 方法。`DataReader` 类实现了 `IDisposable`\
    \ 接口，并包含一个 `Dispose` 方法。如果不调用 `Dispose`，可能会使文件保持打开状态。调用 `Dispose` 还会关闭 `DataReader`\
    \ 所基于的 `IRandomAccessStream`。`IRandomAccessStream` 也实现了 `IDisposable`。\n\n最好将\
    \ `IDisposable` 对象包含在 `using` 块中。这可以确保即使在块内抛出异常，也会自动调用 `Dispose` 方法。`ReadAllText`\
    \ 的更好实现是这样的：\n\n```csharp\npublic async void ReadAllText(string filename, Action<string>\
    \ completed)\n{\n    StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n\
    \    IStorageFile storageFile = await localFolder.GetFileAsync(filename);\n  \
    \  using (IRandomAccessStream stream = await storageFile.OpenReadAsync())\n  \
    \  {\n        using (DataReader dataReader = new DataReader(stream))\n       \
    \ {\n            uint length = (uint)stream.Size;\n            await dataReader.LoadAsync(length);\n\
    \            string text = dataReader.ReadString(length);\n            completed(text);\n\
    \        }\n    }\n}\n```\n\n现在就不需要显式调用 `Dispose` 了。\n\n当然，我们仍然要为向 `ReadAllText`\
    \ 方法传递回调函数而烦恼。但还有什么替代办法呢？如果方法在第一个 `await` 运算符处真正返回给调用者，那么方法怎么能返回文件的文本内容呢？相信 C#\
    \ 编译器。如果它能实现 `await`，那么它肯定也能让你创建自己的异步方法。\n\n让我们用名为 `ReadTextAsync` 的方法替换 `ReadAllText`。这个新名称反映了这样一个事实：该方法本身是异步的，可以配合\
    \ `await` 运算符调用，返回包含文件内容的字符串。\n\n为此，`ReadTextAsync` 方法需要返回一个 `Task` 对象。`Task`\
    \ 类定义在 `System.Threading.Tasks` 中，是 .NET 中异步操作的标准表示。`Task` 类的功能相当丰富，但在这种情况下只需要用到其中的一小部分。`System.Threading.Tasks`\
    \ 命名空间实际上定义了两个 `Task` 类：\n\n- `Task` 用于不返回任何内容的异步方法\n- `Task<TResult>` 用于返回 `TResult`\
    \ 类型对象的异步方法\n\n这些是 Windows 8 中 `IAsyncAction` 和 `IAsyncOperation<TResult>` 接口的\
    \ .NET 等价物，并且有扩展方法可以将 `Task` 对象转换为 `IAsyncAction` 和 `IAsyncOperation<TResult>`\
    \ 对象。\n\n这个新方法不是返回 void，而是可以返回 `Task<string>`。回调参数不再需要，在方法内部，文件的内容像普通方法一样被返回：\n\
    \n```csharp\npublic async Task<string> ReadTextAsync(string filename)\n{\n   \
    \ StorageFolder localFolder = ApplicationData.Current.LocalFolder;\n    IStorageFile\
    \ storageFile = await localFolder.GetFileAsync(filename);\n    using (IRandomAccessStream\
    \ stream = await storageFile.OpenReadAsync())\n    {\n        using (DataReader\
    \ dataReader = new DataReader(stream))\n        {\n            uint length = (uint)stream.Size;\n\
    \            await dataReader.LoadAsync(length);\n            return dataReader.ReadString(length);\n\
    \        }\n    }\n}\n```\n\n编译器处理其余部分。`return` 语句看起来是返回一个字符串对象，即 `ReadString`\
    \ 方法的返回值，但 C# 编译器会自动将该值包装在 `Task<string>` 对象中，并实际在第一个 `await` 运算符执行时从方法中返回该对象。\n\
    \n现在可以使用 `await` 运算符调用这个 `ReadTextAsync` 方法了。\n\n当然，重新定义这些文件 I/O 函数的方法签名会对整个程序产生影响。如果我们想继续使用\
    \ `DependencyService` 来调用与平台无关的方法——这是非常可取的——那么 iOS 和 Android 的方法应该有相同的签名。这意味着\
    \ NoteTaker6 版本的 `IFileHelper` 由以下三个异步方法组成：\n\n```csharp\nusing System.Threading.Tasks;\n\
    \nnamespace NoteTaker6\n{\n    public interface IFileHelper\n    {\n        Task<bool>\
    \ ExistsAsync(string filename);\n        Task WriteTextAsync(string filename,\
    \ string text);\n        Task<string> ReadTextAsync(string filename);\n    }\n\
    }\n```\n\n方法中不再有回调函数。`Task` 对象有自己的回调机制。\n\n以下是 Windows Phone 版本 `FileHelper` 对\
    \ `IFileHelper` 的完整实现：\n\n```csharp\nusing System;\n```\n\n"
