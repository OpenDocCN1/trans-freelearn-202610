    obtain the current values. As with the static methods defined by the AbsoluteLayout
    class, these are implemented by referencing attached bindable properties. The
    Grid.SetColumn and Grid.SetRow calls are equivalent to the following calls on
    the child view object:


    ```

    child.SetValue (Grid.ColumnProperty, 2);

