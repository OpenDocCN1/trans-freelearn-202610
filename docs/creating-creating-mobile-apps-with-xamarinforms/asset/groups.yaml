  - "[PAGE 34]\n\nby the `AndroidActivity` class and inherited by `MainActivity`.\n\
    \n# The Windows Phone project\n\nIn the Windows Phone project, look at the `MainPage.xaml.cs`\
    \ file tucked underneath the MainPage.xaml file in the project file list. This\
