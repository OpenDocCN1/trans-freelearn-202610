- "## 容器与 Docker 简介\n\n在上一章中，你学习了如何测试 Cargo Tracker 应用。至此，Cargo Tracker 应用已准备好部署到不同的环境、机器和云中。\n\
  \n然而，如何确保环境已为 Cargo Tracker 做好准备，并且它能在其中运行呢？在本章中，你将了解如何使用容器和 Docker 来解决这个问题。我们将从什么是容器、容器能做什么以及如何创建容器开始。当你准备好容器的规范后，你将安装\
  \ Docker，并创建和运行容器。\n\n在本章中，我们将涵盖以下主要内容：\n\n- 什么是容器？\n- Docker 简要介绍\n- 安装 Docker\n\
  - 运行 Docker 容器\n\n到本章结束时，你将清楚了解什么是容器，以及如何定义和创建它们。你还将为 Cargo Tracker 应用创建一个容器，并可在装有\
  \ Docker 的任何机器上运行它。\n\n### 技术要求\n\n本章要求你的系统上有一个 Cargo Tracker 应用，并且需要第 3、4 或 5 章中任一章节的\
  \ Cargo Tracker 应用成果。要编辑 Docker 文件，你可以使用任意文本编辑器。我们将在 Linux 机器上安装 Docker。如果你想按照这些说明操作，还需要一台\
  \ Linux 机器或虚拟机。你也可以按照 Docker 网站上的说明进行操作：https://docs.docker.com/engine/install/ubuntu/。\n\
  \n### 什么是容器？\n\n在深入探讨什么是容器之前，让我们先看看没有容器之前的情况，以及容器解决了哪些问题。在容器出现之前，部署应用是一个更复杂、更耗时的过程。应用被部署到物理服务器或虚拟机上，开发人员必须考虑其应用所需的所有不同操作系统、库和其他依赖项，并加以支持。更复杂的是，这还必须在不同的阶段环境中完成——例如，开发、测试、验收或生产环境。\n\
  \n这意味着部署软件的过程通常是手动且容易出错的。开发人员必须在每台物理服务器或虚拟机上手动配置和安装所需的库。这导致了不同环境之间的不一致，以及由于依赖缺失、配置问题和所用依赖版本不匹配而导致的部署失败。\n\
  \n此外，在物理服务器上部署软件可能成本高昂，因为每台服务器都需要配置和维护，而扩容或缩容还需要额外购买硬件并进行配置。\n\n现在，我们了解了不使用容器时的情况，接下来看看什么是容器，以及它如何解决这些问题。\n\
  \n容器是一种以可移植但最重要的是一致的方式来打包和部署应用的技术。容器是一个独立的可执行包，包含应用运行所需的一切——应用本身、运行时、依赖项、配置和系统工具。\n\
  \n容器提供了一种清晰且一致地隔离和管理应用及其依赖项的方式，使得在多个不同环境中运行和部署软件变得更加容易。这使部署更加一致，并减少了因依赖缺失和配置缺失而导致的部署失败次数，这些问题一旦你尝试在自己的机器上运行它们，就会立刻遇到。\n\
  \n容器已成为软件开发和部署中非常重要且不可或缺的工具。一种流行的容器技术是 Docker；在下一节中，我们将更深入地探讨 Docker 是什么，以及它如何运行我们创建的容器。\n\
  \n### 容器是如何创建的？\n\n容器是最终结果，但它是如何创建的呢？容器是基于镜像构建的。镜像就像一个蓝图，告诉 Docker 如何创建容器。有了镜像，你可以创建任意数量的容器，而且它们都是一样的。Docker\
  \ 将镜像用作组装容器的指令。\n\n\n\n\n### 安装 Docker\n\n在本节中，我们将在一台 Linux 机器上安装 Docker。第一步是获取\
  \ Docker 的副本。你可以从其网站下载：https://docs.docker.com/desktop/install/linux-install/#supported-platforms。在那里，你可以选择你使用的\
  \ Linux 平台/发行版。在接下来的示例中，我将使用在 Fedora 机器上安装 Docker 所需的命令，但你应遵循适用于你自己平台的说明。\n\n第一步是安装\
  \ `dnf-plugins-core` 软件包，其中包含用于管理 DNF 存储库的命令。运行以下命令以安装此软件包：\n\n```\nsudo dnf -y\
  \ install dnf-plugins-core\n```\n\n下一步是使用以下命令添加 Docker 存储库：\n\n```\nsudo dnf config-manager\
  \ \\\n  --add-repo \\\n  https://download.docker.com/linux/fedora/docker-ce.repo\n\
  ```\n\n添加存储库后，我们将下载并安装 rpm 软件包。你可以在你平台的安装说明中找到该文件的最新版本。你也可以使用以下 URL 来使用与我们相同的版本：https://desktop.docker.com/linux/main/amd64/docker-desktop-4.17.0-x86_64.rpm?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64。当你拥有该\
  \ rpm 软件包后，使用以下命令在你的系统上安装它：\n\n```\nsudo dnf install ./docker-desktop-4.17.0-x86_64.rpm\n\
  ```\n\n在安装过程中，你需要回答一些问题；第一个问题涉及将被下载、升级和安装的依赖项，以及你是否同意这些更改。要同意，请按 Enter 键。\n\n第二个问题是你是否希望导入\
  \ Docker 的 GPG 密钥；同样，按 Enter 键接受导入。现在，该工具将安装在你的 Fedora 机器上。\n\n当安装完成时，你将在控制台中看到以下结果：\n\
  \n```\nxclip-0.13-18.git11cba61.fc37.x86_64\nxorg-x11-proto-devel-2022.2-2.fc37.noarch\n\
  xz-devel-5.4.1-1.fc37.x86_64\nComplete!\n```\n\n当你看到此信息时，说明你的系统已安装 Docker。启动 Docker\
  \ Desktop 应用程序有两种方式。你可以从“显示应用”界面启动它，或者运行以下命令来启动 Docker：\n\n```\nsystemctl --user\
  \ start docker-desktop\n```\n\n在某些情况下，了解系统上是否安装了 Docker，以及如果已安装则其运行的版本，会很有帮助。要检查系统上\
  \ Docker 的版本，请运行以下命令：\n\n```\ndocker version\n```\n\n这将显示有关正在运行的 Docker 版本的许多信息，但输出中的这一行特别有趣：\n\
  \n```\nServer: Docker Desktop 4.17.0 (99724)\n```\n\n这一行告诉你，你正在使用 Docker Desktop\
  \ 版本 4.17.0 作为你的 Docker 容器的服务器。\n\n### 运行 Docker 容器\n\n在本节中，你将获取 Cargo Tracker 应用程序，为其构建一个\
  \ Dockerfile，并将其作为 Docker 容器在你的系统上运行。我们将首先创建一个你可以使用的 Dockerfile。使用 Dockerfile，我们将告诉\
  \ Docker 引擎如何为我们创建容器以及我们希望如何运行它。在容器运行后，我们将查看如何使用命令行界面来管理容器并查看 Cargo Tracker 应用程序生成的日志。创建此\
  \ Dockerfile 将是我们通往在 Docker 上运行 Cargo Tracker 旅程的起点。\n\n#### 创建 Docker 容器\n\n在 Docker\
  \ 引擎上运行 Cargo Tracker 的第一步是创建一个 Dockerfile。Dockerfile 包含给 Docker 引擎的指令，说明如何创建我们想要的容器。开始时在\
  \ Cargo Tracker 应用程序的根目录下创建一个名为 Dockerfile 的文件。在 Dockerfile 内部，你需要添加以下两行代码：\n\n\
  ```\nFROM payara/server-full:6.2023.2-jdk17\n\nCOPY target/cargo-tracker.war $DEPLOY_DIR\n\
  ```\n\n第一行代码指定了我们要使用的父镜像。在这种情况下，我们选择在一个完整的 Payara 服务器版本 6.2023.2 之上构建我们的 Docker\
  \ 镜像，该版本还支持 Java 17。这意味着我们的 Docker 容器将拥有运行 Cargo Tracker 应用程序所需的所有工具，从而无缝运行。\n\n\
  第二行代码是一个复制命令。该命令用于将 Cargo Tracker 应用程序的 WAR 文件复制到一个名为 `$DEPLOY_DIR` 的变量中。我们选择的父\
  \ Docker 镜像使用此变量来搜索要部署的应用程序。因此，通过在将此目录放置 Cargo Tracker 的副本，我们确保一旦容器创建，它将被自动部署。\n\
  \n创建 Dockerfile 后，下一步是使用它来告诉 Docker 引擎如何创建容器以及我们希望如何运行它。一旦容器启动并运行，我们就可以使用命令行界面来管理它并查看由\
  \ Cargo Tracker 应用程序生成的日志。这将使我们能够监控应用程序的性能并进行任何必要的调整，以确保其顺利运行。\n\n#### 构建容器\n\n\
  下一步是告诉 Docker 引擎使用 Dockerfile 构建我们刚刚指定的容器。为了创建容器，我们将使用 Docker 客户端，它是一个让你与 Docker\
  \ 守护进程交互并管理容器的命令行界面。使用终端，导航到你刚刚创建 Dockerfile 的 Cargo Tracker 应用程序根目录。在 Cargo Tracker\
  \ 目录内，执行以下命令：\n\n```\ndocker build -t cargo-tracker .\n```\n\n这告诉 Docker 引擎使用我们在前面步骤中创建的\
  \ Dockerfile 为 Cargo Tracker 应用程序创建容器。\n\n如果此命令成功执行，你将看到类似于以下内容出现在控制台中：\n\n```\n\
  [+] Building 0.5s (7/7) FINISHED\n=> [internal] load build definition from Dockerfile\
  \ 0.0s\n=> => transferring dockerfile: 90B 0.0s\n=> [internal] load .dockerignore\
  \ 0.0s\n=> => transferring context: 2B 0.0s\n=> [internal] load metadata for docker.io/payara/server-full:6.2023.2-jdk17\
  \ 0.4s\n=> [internal] load build context 0.0s\n=> => transferring context: 192B\
  \ 0.0s\n=> [1/2] FROM docker.io/payara/server-full:6.2023.2-jdk17@sha256:6b96c248d0e2cf18d6768883a2881389acfd743b13758b155724233713813f\
  \ 0.0s\n=> CACHED [2/2] COPY target/cargo-tracker.war /opt/payara/deployments 0.0s\n\
  => exporting to image 0.0s\n=> => exporting layers 0.0s\n=> => writing image sha256:7d7ff9b0a3290c692db4bb3f80b42d96203d67d312f3be0cf6c968b22a6913c5\
  \ 0.0s\n=> => naming to docker.io/library/cargo-tracker\n```\n\n此输出告诉你，已经创建了一个名为\
  \ `cargo-tracker` 的镜像，你可以将其与 Docker 一起使用。\n\n#### 运行容器\n\n下一步是使用我们在前一步中构建的容器运行 Cargo\
  \ Tracker 应用程序。要在终端中启动容器，请运行以下命令：\n\n```\ndocker run -p 8080:8080 cargo-tracker\n\
  ```\n\n此命令将启动我们上一步创建的名为 `cargo-tracker` 的容器。该命令由三部分组成：\n\n- `run`\n- `-p 8080:8080`\n\
  - `cargo-tracker`\n\n`run` 告诉 Docker 引擎我们要启动一个容器。`run` 之后的所有内容都是将传递给 Docker 引擎的参数。`-p\
  \ 8080:8080` 告诉 Docker 引擎我们想要将容器内部的端口映射到外部。如果没有此设置，我们将无法访问我们在容器内部运行的 Payara 服务器。第一个\
  \ 8080 是宿主机的端口号；第二个 8080 是容器内部的端口。使用此 `-p` 参数，我们现在可以使用 8080 端口连接到也在 8080 端口上运行的容器内部的\
  \ Payara 服务器。最后一个参数 `cargo-tracker` 是我们创建的容器的名称。\n\n当你运行该命令时，你会直接在终端中看到容器内部发生的日志记录。几秒钟后，你会在终端中看到类似以下内容：\n\
  \n```\n[#|2023-03-26T18:29:09.723+0000|INFO|Payara 6.2023.2||_ThreadID=216;_ThreadName=Thread-24;_TimeMillis=1679855349723;_LevelValue=800;|SSLParams\
  \ =org.glassfish.admin.mbeanserver.ssl.SSLParams@78a4a59b|#]\n[#|2023-03-26T18:29:09.741+0000|INFO|Payara\
  \ 6.2023.2|javax.enterprise.system.jmx|_ThreadID=216;_ThreadName=Thread-24;_TimeMillis=1679855349741;_LevelValue=800;_MessageID=NCLS-JMX-00025;|SSLServerSocket[/0.0.0.0:8686\
  \ and [SSL: ServerSocket[addr=/0.0.0.0,localport=8686]] created|#]\n[#|2023-03-26T18:29:09.802+0000|INFO|Payara\
  \ 6.2023.2|javax.enterprise.system.jmx|_ThreadID=216;_ThreadName=Thread-24;_TimeMillis=1679855349802;_LevelValue=800;_MessageID=NCLS-JMX-00005;|JMXStartupService\
  \ has started JMXConnector on JMXService URL service:jmx:rmi:///0.0.0.0:8686/jndi/rmi:///0.0.0.0:8686/jmxrmi|#]\n\
  ```\n\n这表明 Payara 服务器已启动，并且 Cargo Tracker 应用程序已部署。现在你可以通过访问以下 URL 来访问服务器：http://localhost:8080/cargo-tracker/。这与你在本地\
  \ Payara 服务器上运行 Cargo Tracker 应用程序时的 URL 相同。但是，你现在连接的不是本地 Payara 服务器，而是容器内部的 Payara\
  \ 服务器。\n\n当你点击 Cargo Tracker 应用程序的界面时，你会看到日志出现在控制台中。\n\n\n\n\n\n### 以后台模式运行容器\n\n\
  你也可以使用以下命令以后台模式运行容器：\n\n```bash\ndocker run -p 8080:8080 cargo-tracker -d\n```\n\
  \n请注意，该命令包含一个额外的参数 -d。该参数告诉 Docker 引擎，我们希望以后台模式启动容器。当您以这种方式启动容器时，您将看不到容器的日志。相反，命令会返回您刚启动的容器的容器\
  \ ID。\n\n要查看您正在运行的容器，可以使用以下命令：\n\n```bash\ndocker ps\n```\n\n这将在控制台中打印类似以下内容：\n\n\
  ```text\nCONTAINER        ID     IMAGE          COMMAND                 CREATED\
  \       STATUS       PORTS                    NAMES\nc94fa6f7accf     cargo-tracker\
  \   \"/tini -- /bin/sh -c…\"   2 minutes ago   Up 2 minutes   4848/tcp, 8181/tcp,\
  \ 9009/tcp,\n0.0.0.0:8080->8080/tcp   inspiring_morse\n```\n\n该概览显示以下信息：\n\n- 容器\
  \ ID\n- 镜像名称\n- 命令\n- 容器创建时间\n- 容器状态\n- 端口映射\n- 容器名称\n\n当您以后台模式运行容器时，您可以关闭终端，容器将继续在后台运行。\n\
  \n### 停止正在运行的容器\n\n如果您想停止容器，可以使用 kill 命令，并将其作为容器 ID 的一部分传入。以下示例命令会杀死一个容器 ID 以 c\
  \ 开头的容器：\n\n```bash\ndocker kill c9\n```\n\n该命令在杀死容器后，会打印您传入的 ID。在这种情况下，您将在控制台中看到以下返回值：\n\
  \n```text\nc9\n```\n\n当 kill 命令执行完毕后，您可以再次运行 docker ps 命令，并注意不再有容器在运行。控制台中的输出将如下所示：\n\
  \n```bash\n$ docker ps\nCONTAINER\nID      IMAGE      COMMAND      CREATED     \
  \ STATUS      PORTS      NAMES\n```\n\n### 使用 Docker Compose\n\nDocker Compose 是一个强大的工具，用于定义和运行多容器\
  \ Docker 应用。它使您能够在单个 YAML 文件中定义应用所需的服务、网络和卷。该文件定义了每个服务的容器、其配置和依赖关系。我们特别感兴趣的是将我们的配置存储在此文件中。这样做可以更轻松地启动容器，因为我们不必指定容器名称或要暴露的端口。我们只需在\
  \ docker-compose.yml 中定义一次即可。\n\n#### 创建 Docker Compose 文件\n\n要使用 Docker Compose，我们需要创建一个\
  \ Docker 可以使用的 docker-compose.yml 文件。进入 Cargo Tracker 应用的根目录，并创建一个名为 docker-compose.yml\
  \ 的 YAML 文件。使 docker-compose.yml 的内容如下所示：\n\n```yaml\nversion: \"3.9\"\nservices:\n\
  \  cargo-tracker-app:\n    build: .\n    ports:\n      - \"4848:4848\"\n      -\
  \ \"8080:8080\"\n      - \"8181:8181\"\n      - \"9009:9009\"\n```\n\n这就是 docker-compose.yml\
  \ 文件中我们需要的一切。这个 Docker Compose 文件创建了一个名为 cargo-tracker-app 的服务，它在容器中运行，并在指定端口上暴露其服务。\n\
  \n在第一行，我们定义了此 Docker Compose 文件所使用的版本。该文件使用 3.9 版本。该文件定义了一个名为 cargo-tracker-app\
  \ 的服务，该服务从当前目录（由 . 指定）构建。ports 部分定义了容器服务可以被访问的端口。在这种情况下，它将容器的 4848、8080、8181 和 9009\
  \ 端口映射到宿主机上对应的端口，使其可以在外部访问。\n\nbuild 部分表明该服务将从当前目录中的 Dockerfile 构建。这意味着 Docker Compose\
  \ 将使用当前目录中的 Dockerfile，通过运行 `docker build` 命令为容器创建镜像。\n\n#### 使用 Docker Compose\n\
  \n要启动 `docker-compose.yml` 中的所有服务，请运行以下命令：\n\n```bash\ndocker compose up\n```\n\n\
  这将使用当前目录中的 Dockerfile 为 Cargo Tracker 应用构建容器并启动它。因为我们在 Docker Compose 文件中指定了端口，所以我们不必在命令中指定它们。当您在控制台中看到以下文本时，您就会知道容器已启动并可以访问：\n\
  \n```text\ncargotracker-cargo-tracker-app-1 | cargo-tracker was successfully deployed\
  \ in 9,380 milliseconds. [#]\n```\n\n您现在可以访问以下 URL，查看容器和 Cargo Tracker 应用是否正在运行：`http://localhost:8080/cargo-tracker/`。\n\
  \n要查看所有端口是否已映射到宿主机上对应的端口，请运行以下命令：\n\n```bash\ndocker ps\n```\n\n结果将如下所示：\n\n```text\n\
  CONTAINER         IMAGE                       COMMAND                  CREATED \
  \        STATUS         PORTS                   NAMES\nID\n93a1813c884c      cargotracker-cargo-tracker-app\
  \ \"/tini -- /bin/sh 30 minutes ago  Up 14 seconds  0.0.0.0:4848->4848/tcp,  cargotracker-cargo-tracker-app-1\n\
  -c \"\"                                        0.0.0.0:8080->8080/tcp, 0.0.0.0:8181->8181/tcp,\
  \ 0.0.0.0:9009->9009/tcp\n```\n\n在端口部分下，您可以验证端口的映射方式是否与我们在 `docker-compose.yml`\
  \ 文件中指定的一致。\n\n#### 停止容器\n\n停止您启动的容器与停止 Docker 中运行的其他容器的方式相同。使用 `docker kill` 命令，您可以停止使用\
  \ `docker compose up` 启动的容器。要停止上一个示例中的容器，可以使用以下命令：\n\n```bash\ndocker kill 93\n\
  ```\n\n这将返回 93，容器将停止。要验证命令是否已生效，您可以再次运行 docker ps 命令。或者，您也可以使用以下命令：\n\n```bash\n\
  docker-compose down\n```\n\n这将删除容器、配置文件中定义的网络以及任何默认的网络定义。\n\n### 总结\n\n在本章中，您了解了什么是\
  \ Docker，以及如何将其用于 Cargo Tracker 应用。您了解到容器是软件的可执行包，其中包含应用、依赖项以及应用运行所需的系统工具。之后，我们探讨了什么是\
  \ Docker 以及它如何使用容器。凭借这些知识，您为 Cargo Tracker 应用指定了第一个 Dockerfile。使用 Docker 命令行界面，您学会了如何构建容器并启动它。您还探索了使用后台模式启动容器的其他方式，以及如何停止容器。最后，您学会了如何创建\
  \ Docker Compose 文件以及如何启动它。\n\n这些步骤对于我们接下来几章在云端运行 Cargo Tracker 应用非常重要。\n"
- '## 认识 Kubernetes


  在本章中，我们将向您介绍 Kubernetes。如果您已经熟悉这项技术，可以跳过本章。如果您还在与我们同行，请准备好了解以下主题：


  - Kubernetes 的历史

  - 为什么需要 Kubernetes？

  - Kubernetes 的主要特性

  - Kubernetes 的架构

  - 在哪里运行 Kubernetes

  - 使用 Kubernetes 的示例


  在本章结束时，您将清楚地了解像 Kubernetes 这样的容器编排系统做什么、它们如何工作，以及您自己如何利用它们。


  ### 技术要求


  本章没有任何技术要求。如果您想尝试使用 Kubernetes，这里有一些项目可以试一试。Minikube 是一个在本地机器上安装单节点集群的项目。另一个项目是
  Kubernetes in Docker（KinD），它启动一组容器，这些容器将启动 Kubernetes。虽然这些选项可以让您对 Kubernetes 是什么以及它如何工作有一个良好的印象，但如果您想进行一些认真的研究，您可能需要考虑云提供商选项。有很多产品可供选择，例如
  Azure 的 AKS、Google 的 GKE 和 Amazon 的 EKS。一个有趣的替代方案是 Civo 的 K3S，它使用廉价的硬件来运行 Kubernetes。


  在本章末尾，我们将通过本地安装的 Minikube 对 Kubernetes 执行一次简单的部署。


  到本章结束时，您应该对 Kubernetes 在云原生环境中的位置有一个很好的理解。您还将了解 Kubernetes 提供了哪些功能。






  ### 起始


  如果你在 IT 行业从事开发或基础设施工作，你很可能听说过 *Kubernetes* 这个名字。它在 2015 年登上舞台，比我们撰写本书早了大约八年。


  Kubernetes 起源于 Google 的一个项目。Google 以完全拥抱云计算而闻名。它的所有产品都以云为中心。只要想想 Gmail，可能最常用的基于云的电子邮件产品，以及
  Google 文档、Google 云端硬盘和 YouTube 等产品。


  Google 的所有服务都在容器中运行。在 2014 年 InfoQ 上的一篇文章中估计，Google 每周启动 20 亿个容器。这意味着每秒超过 3,300
  个容器。面对如此庞大的数量，难怪在运行和管理容器方面拥有出色的专业知识。


  Google 内部使用一个名为 Borg 的系统，名字恰如其分地取自 *星际迷航* 中同化一切进入中央蜂巢的外星群体。


  Kubernetes 本身并非基于 Borg。例如，Kubernetes 使用 Google 自家的编程语言 Golang 编写，而 Borg 则是用 C++
  编写的。


  然而，Kubernetes 的核心开发者对 Borg 有着深入的了解，并且 Borg 的许多概念被迁移到了 Kubernetes。


  ### 什么是容器编排？


  在 *第 6 章* 中，你已经了解了 Docker。你了解到 Docker 是一种构建和打包软件的方式，便于更轻松地分发和执行。你还在关于 Jakarta EE
  的章节中了解到，它引入了一个专门的配置文件 Core Profile，针对微服务和容器化。你很可能运行着许多容器，这就是容器编排发挥作用的地方。


  容器编排是创建、调度、扩展和监控容器的过程。运行一个应用程序所需的容器数量会迅速增长，即使是标准的包含前端、后端和数据库的架构——那已经是三个容器了。而且你还有额外的需求，例如缓存实例、反向代理和
  CDN（https://en.wikipedia.org/wiki/Content_delivery_network）服务器。


  此外，你可能希望每个组件都有多个实例，以防出现故障。正如你所见，数量很快就会增长。如果我们再加入微服务，其中前端和后端会被拆分为多个服务，情况就更加明朗了。


  手动处理所有这些容器——监控其运行状态并重启失败的容器——已不再现实。


  这就是容器编排器的用武之地——它们尽可能自动化这些任务。请注意，Kubernetes 并不是唯一的容器编排器，也不是第一个。替代方案包括 Apache Mesos、HashiCorp
  的 Nomad 和 Docker Swarm。然而，在过去几年里，Kubernetes 已成为容器编排事实上的标准。


  ### 为什么你需要 Kubernetes？


  你可能会想知道为什么你需要 Kubernetes。即使你的公司规模没有 Google 那么大，或者你在生产环境中没有运行数以亿计的容器，通过 Kubernetes
  进行容器编排也是你将需要的东西。


  事实证明，Kubernetes 具有一些极其有用的功能，即使对小型公司也很有吸引力。在本章的剩余部分，我们将更详细地讨论这些功能。


  ### 自愈


  Kubernetes 最有用的功能之一是自我修复能力。如果 Kubernetes 判定某个 Pod 已崩溃，它将启动一个新的 Pod 来替换失败的 Pod。这样，集群就会恢复到期望的状态。


  当然，这一过程有一些限制。其中之一是必须有足够的资源来启动新的 Pod。资源可以指（虚拟化的）机器、内存、CPU 和存储容量。


  Kubernetes 的自愈能力体现在两个方面：


  - 如果现有 Pod 崩溃，则启动新的 Pod

  - 如果 Pod 不再处理用户请求且因此不再具有功能，则将其终止


  Kubernetes 有多种方式来判断 Pod 是否仍具有功能，基于对 Pod 的回调方法（存活探针和就绪探针）。


  另一个体现其自适应能力的特性是水平 Pod 自动扩缩容。如果你认为这意味着 Kubernetes 可以根据标准扩展 Pod 数量，那么你是对的。


  水平 Pod 自动扩缩容的工作方式如下——如果 Pod 的负载增加，Kubernetes 将启动额外的 Pod 来减轻已运行 Pod 的压力。


  如果在某个时间点 Pod 的负载下降，而我们仍在运行比最初配置更多的 Pod，自动扩缩器会再次将 Pod 数量降下来。当然，这会谨慎进行，以防止剩余 Pod 再次过载。


  请注意，此过程称为 **水平自动扩缩**，因为我们启动了更多相同类型的资源，即 Pod。如果 Kubernetes 为已运行的 Pod 分配更多 CPU 时间或更多内存，则为垂直扩缩。


  Kubernetes 会在固定的间隔内查询资源利用率，该间隔目前默认为 15 秒（可配置值），查询方式依据自动扩缩资源定义中指定的方式。


  此资源利用率可以基于每个 Pod 的指标、自定义指标，甚至对象或外部指标。


  ### 负载均衡和网络


  Kubernetes 在网络方面也表现出色。运行许多 Pod，每个 Pod 需要唯一的地址，很容易意味着你有大量容器端口到主机端口的映射。


  幸运的是，Kubernetes 会为你处理这个问题，通过为每个 Pod 分配唯一的集群范围 IP 地址。


  这使得例如服务发现变得轻而易举；每个 Pod 都可以与集群中的其他 Pod 通信。如果一个 Pod 包含多个容器，则所有这些容器共享相同的 IP 地址。这意味着每个服务都可以通过
  localhost 地址访问另一个服务。这也意味着节点中的每个容器必须具有唯一的端口号以避免冲突。


  Kubernetes 支持两种形式的服务发现。服务发现是指一个服务需要找到并访问不同的服务以执行其操作。这可能很简单，例如应用程序需要知道数据库 URL 以建立
  JDBC 连接。


  或者，这可能是一个情况，例如 Order Service 需要确定产品是否有足够的库存才能放入购物车。检索库存水平将是另一个服务的责任——比如 StockService。OrderService
  需要知道在何处（即哪个 IP 地址）可以找到 StockService。


  Kubernetes 提供的最简单的机制是通过一组环境变量，指定每个服务的 hostname 和端口号。在我们的示例中，OrderService 可以简单地查找这些环境变量以确定
  hostname 和端口号。


  此外，Kubernetes 还支持 DNS。如果你在集群中设置了 DNS 服务器，那么它将监视 Kubernetes API 以查找新服务和已删除的服务。这允许同一集群中的
  Pod 基于名称找到服务。


  假设我们有一个服务，它公开了一个名为 mydb 的 PostgreSQL 数据库服务。其他服务现在可以通过此名称引用该数据库服务，而无需使用其 IP 和端口组合。这为你的服务提供了巨大的灵活性和独立性。


  Kubernetes 通过所谓的 Ingress 服务支持负载均衡。Ingress 使用 HTTP 和 HTTPS 使你的服务能够从集群外部访问。很合理的是，在某个时候，你应用程序的一部分应该对集群之外的外部世界可访问。如果我们继续之前
  OrderService 的示例，为了能够将产品添加到购物车，用户/买家必须能够访问一个网站，例如。这就是入口的用武之地。它可以将外部 URL 转换为在 Kubernetes
  集群内部运行的服务。






  负载均衡是 Ingress 功能的一部分。可能有许多 Pod 在运行 OrderService。现在，如果有一个请求进来要将商品添加到购物车，应该选择哪项服务？负载均衡将通过应用某种策略来选择期望的
  Pod，从而解决这个问题。


  一些相当常见的策略如下：


  - Round-robin 是一种简单的方法，其中一组 Pod 结合使用。每次请求时，都会从池中选择下一个 Pod，每个 Pod 都轮流使用。

  - 另一种方法可能是最快的。在这种情况下，下一次会选择响应请求最快的 Pod。

  - 再次，一个不同的方法可能是最小的，这意味着创建一个仅有足够 Pod 来处理当前负载的组。


  正如你所见，可能性几乎是无限的，复杂性也是如此。通常，标准就足够了，只有在达到限制时才需要对负载均衡器进行微调。


  ### 持久存储和卷


  容器和 Pod 本质上是短暂的。它们通常寿命很短，一旦终止，Pod 内部存储的数据就会永远丢失。突然间，将你的宝贵数据存储在数据库容器中似乎没那么有吸引力了，对吗？


  解决方案似乎很简单——将数据存储在容器之外。这正是 Kubernetes 允许你做的事情，并且在这样做的同时，它给了你巨大的自由和选择。


  Kubernetes 使用一种称为 **volumes** 的抽象来存储数据。从本质上讲，卷只是在磁盘上用于存储数据的目录。我们知道两种卷，**ephemeral**
  和 **persistent**，并且你可以在一个 Pod 内混合使用它们。Ephemeral 卷在 Pod 终止时会被删除，而 persistent 卷会在
  Pod 生命周期之外继续存在。


  Kubernetes 支持许多类型的卷，包括一些基本类型，例如 emptyDir，它只是在 Pod 启动时为空的 Pod 内部目录。然而，还有几种特定的卷，针对主要云提供商的存储服务。Kubernetes
  将卷抽象为一个配置片段，称为 **Persistent Volume (PV)**。它描述了卷的技术细节。


  每当服务需要一些存储时，它就会提出一个 **Persistent Volume Claim (PVC)**。PVC 包含卷必须满足的要求。想想诸如可用大小、存储类型、速度等。


  Kubernetes 在所有这些中的作用是找到合适的 PV 来满足 PVC。通过这种方式抽象事物，可以防止服务与存储选项之间产生紧密耦合。


  举例来说，假设你的应用程序目前使用的是类型为 azureDisk 的 PV。现在，如果出于某种原因，你要放弃它并切换到 GCE 提供的 gcePersistentDisk，你需要更改什么？


  你需要为 gcePersistentDisk 添加一个 PV，并且你希望使 azureDisk PV 不可用。然而，在应用程序重新启动时，它会声明它需要一个磁盘卷，并且
  PVC 未被修改，Kubernetes 现在会将 gcePersistentDisk Persistent Volume 附加到你的服务上。这就是 Kubernetes
  中无处不在的抽象的力量，在 Pod 中，在卷中，等等。


  ### General


  Kubernetes 的基本思想出奇地简单——集群的期望情况以声明方式描述并存储（soll-state）。Kubernetes 然后执行一个连续的循环，在其中验证集群的实际状态（ist-state）。


  如果实际状态与期望状态不同，Kubernetes 将对实际状态采取适当的操作，使两者再次匹配。


  ### Pods versus containers


  Kubernetes 使用对容器的抽象，称为 Pod。这是 Kubernetes 中最小的单元。你部署、启动、重启、停止和取消部署 Pod。你永远不会直接在容器中做任何事情。


  一个 Pod 可以包含多个容器，即所谓的 multi-container pod。虽然这是一个有效的场景，但大多数 Pod 只包含一个容器。可能有多个容器在 Pod
  中的有效场景是启动容器、使用 sidecar 模式的服务网格以及监控导出器。然而，这些都是超出本章范围的高级概念。如需更多信息，请访问：https://kubernetes.io/blog/2015/06/the-distributed-system-toolkit-patterns/


  ### Some Kubernetes lingo


  之前，我们提到“cluster”这个词，但没有明确定义我们的意思。我们认为现在做这个定义是个好时机。


  我们已经说过，Pod 是 Kubernetes 中最小的部署单元，并且一个 Pod 可以包含一组容器。


  让我们定义一些更多 Kubernetes 术语：


  - 一个 Pod 被调度并在节点上执行。

  - 节点是 Kubernetes 中的工作机器。它可以是物理设备或虚拟设备。

  - 工作节点执行实际的工作负载。

  - 节点由控制平面控制。控制平面是暴露 API 并管理 Kubernetes 中所有资源的控制器编排层。

  - 一组节点可以组织成一个集群。

  - 服务是一组相关 Pod 的集合，具有相同的一组功能。


  ### Extending Kubernetes


  Kubernetes 开箱即用提供了大量的功能，其核心每天都在扩展。Kubernetes 拥有庞大的开源开发者社区。


  然而，有时，Kubernetes 可能没有你、你的团队或你的公司所需的某些功能。你该怎么办？是否应该深入源代码？Fork Kubernetes 仓库并向其核心添加你需要的东西。


  （Kubernetes 用 Golang 编写，这是一种来自 Google 的编程语言。与 Java 不同，Golang 编译为原生二进制文件。大量属于 CNCF
  (**Cloud Native Computing Foundation**) 的开源项目（有关更多详细信息，请参阅 https://landscape.cncf.io/）使用
  Golang——例如 Prometheus 和 InfluxDB。Uber 也以用 Golang 编写大量服务器代码而闻名）。


  这些解决方案当然不可持续；没有人会这么做。（尽管，一些项目确实这样做了并且仍然保持理智；Rancher 的 K3S 就是这样的项目。）


  Kubernetes 提供了一个非常强大的替代方案，正如你所预期的那样。我们已经提到 Kubernetes 中的一切都是资源，因此在资源 `.yaml` 文件中描述。Pods、deployments、stateful
  sets、services 和 PVs 都在这样的 YAML 文件中描述。Kubernetes 允许你以 Custom Resource Definitions
  的形式将你的功能添加到核心产品中。这是一个你需要实现的契约，然后你的资源将成为 Kubernetes 的一等公民。


  这种能够扩展 Kubernetes 但仍能与标准产品一起工作的能力，是在可维护性方面的一大亮点。不是在 Kubernetes 核心中修修补补从而偏离主要开发，你仍然留在主包中。


  ### Kubernetes architecture


  以下是 Kubernetes 高级配置的图表。在左侧，我们可以看到控制平面，即控制 Pod 和服务的调度、启动和停止的部分


  图中未显示的是 **container runtime (CRI)**。当然，要运行容器，每个节点上都应安装容器运行时。CRI 是一个接口，支持以下内容：


  - Cri-o

  - Containerd

  - Docker


  总之，这就是 Kubernetes 的架构。正如你所见，Kubernetes 不仅仅是一个应用程序。它是一组应用程序的集合——一些在服务器上，一些在客户端——它们协同工作以管理可能大量的容器集合。


  ### Where to run Kubernetes


  那么，现在你知道了 Kubernetes 的用途和它提供的功能（尽管我们只触及了皮毛），下一个问题是，我如何自己运行 Kubernetes？


  如果你想运行 Kubernetes，有几个选项可供选择。我们这里的列表并不详尽，仅仅是因为几乎每天都有新选项出现。我们将列出我们认为最受欢迎或最有前景的选项。


  #### Use your own hardware


  这可能是开始的最简单方法。在你自己的硬件上下载并安装 Kubernetes。根据你的需求，你可能需要相当多的计算机。然而，在少数大型服务器上使用虚拟化可能足以满足你的硬件需求。此外，计算机数量越少，管理它们的成本就越低。


  请记住，此选项仍然要求你管理这台计算机集群并更换故障的网络接口卡和其他损坏的硬件。你仍然负责备份数据和监控 Kubernetes 集群。别忘了应用软件更新的需求。


  尽管如此，如果你已经有一个负责这些任务的运维部门，并且有一些闲置硬件，这可能是一个不错的开始选择。我们建议从官方文档中的设置指南开始。关于 Kubernetes
  生产环境需求，也有有价值的信息可供使用。由于你将自行管理集群，KubeAdm 是推荐的工具。


  #### Using a hosted service


  如果你热衷于维护自己的硬件和集群，那么使用云提供商是一个可行的选择。他们可以减轻提供硬件、管理集群和执行运维任务的负担。





  你可以通过输入以下命令来验证部署是否创建了一个 Pod：


  ```

  kubectl get pods

  ```


  ![](img/8948f94d0abcdb1ae94d6778da518d16_134_0.png)


  图 7.3 – 运行中 Pod 的概览


  会创建一个与部署同名并带有唯一后缀的 Pod。同时，还会创建一个服务，可以通过输入以下命令查看：


  ```

  kubectl get service

  ```


  部署尚未暴露到你的计算机。为此，我们需要通过以下方式将其暴露：


  ```

  kubectl port-forward service/greeting 8080:8080

  ```


  最好在一个新的终端窗口中执行此操作，因为端口转发会阻塞终端，使其无法继续输入。这里我们告诉 Kubernetes，到达端口 8080 的流量应转发到名为 greeting
  的服务的端口 8080。


  现在，当你打开浏览器并输入 http://localhost:8080/api/greet?name=Packt 时，你将看到以下内容：


  ![](img/8948f94d0abcdb1ae94d6778da518d16_134_1.png)


  Hello, Packt!


  图 7.4 – 我们部署应用的输出


  ### 总结


  在本章中，我们简要介绍了 Kubernetes 的起源、它对你有用的原因、它的主要功能以及它的架构。


  一旦你决定将代码迁移到更现代的云原生方法，或者开始使用容器，你很可能将不得不与 Kubernetes 这类容器管理系统打交道。本章让你对它们的工作原理以及可以在何处使用它们有了很好的了解。


  Kubernetes 是 CNCF 下载量最大的产品。到底什么是云原生，将在下一章中讨论。


  但这还不是全部。如今，我们许多人将云用作备份。在手机上存储照片时，不仅存储在设备本身，还会在某种云存储中保留一份副本以妥善保管，这非常普遍。苹果的 iCloud
  就是一个很好的例子，但还有其他的云存储提供商，如 Google Cloud 和 Dropbox。


  如今，有许多云提供商，其中以 **亚马逊网络服务（AWS）**、Microsoft Azure 和 Google Cloud 为主。也许在西方国家不太为人所知，阿里云是全球第四大云提供商，其在云市场的份额距离
  Google Cloud 并不遥远。因此，我们可以有把握地说，如今云无处不在。


  *云原生*意味着我们正在使应用程序适应云所提供的新可能性。不过，我们需要记住，云是由一组不同的架构约束所驱动的。在接下来的章节中，我们将以简单的方式解释这些约束。

  '
- '## 云原生原则


  我相信你在拿起这本书之前，一定已经多次听到过*云原生*这个词。也许正是听到这些词，才让你选择阅读这本书。现在让我们仔细审视云原生的原则。


  云原生由四个不同的特性驱动，如下所示：


  - 微服务

  - 容器和编排

  - DevOps

  - **持续集成和持续交付（CI/CD）**


  我们将在本章中更详细地讨论这些特性，但你必须意识到，我们在这里只能触及皮毛。每一个特性本身都值得写一本书，事实上，你可以在 Packt Publishing 找到关于这些主题的书籍。


  ### 微服务


  虽然在云端运行微服务并非强制要求，但大多数云原生应用实际上都是微服务。我们在本书中已经多次遇到*微服务*这个术语，但让我们先看看它的定义。


  微服务是一种架构风格，它将应用程序构建为一系列服务，这些服务具有以下特点：


  - 可独立部署

  - 松耦合

  - 围绕业务能力组织

  - 由专门的团队拥有


  独立可部署性至关重要。你应该能够将新的或更新的服务部署到生产环境，而无需担心会破坏其他服务，或需要记住重新部署这些其他服务。本章的*介绍 12-factor 应用*一节将对此进行更详细的描述。


  软件开发中的松耦合总是一个好主意，在微服务中更是如此。它允许服务随着时间的推移而变化，而这些变化不会影响其他服务。为了实现松耦合，需要考虑很多事情，但最重要的是：为你的每个服务使用独立的数据库模式，通过
  API 进行通信（记住亚马逊的 Jeff Bezos 对此的引用：“*所有服务接口，无一例外，必须从一开始就设计为可外部化*”），以及在服务之间提供异步通信。


  这些服务应该围绕业务领域组织，这一点不言而喻：它们存在的唯一理由是在某种程度上支持使用它们的公司的业务流程。


  最后，它们应该由一个小团队拥有。原因是这些服务仅服务于完整业务流程的一小部分。因此，所需的领域逻辑量也是有限的。将此与传统应用程序开发进行比较，在传统开发中，每个开发人员都可能需要处理整个应用程序。这将需要对完整业务领域的了解。


  使用微服务，新成员加入你的团队会变得更加容易和快速。此外，对你的微服务进行更改也可以更快地实施，因为每个开发人员都知道所有细节以及这些更改将产生的影响。


  ### 容器和编排


  在关于 Docker（*第 6 章*）和 Kubernetes（*第 7 章*）的章节中，我们已经解释了使用这些技术的优势。事实上，你可能会说，容器化正是使云原生运动成为可能的原因。


  在不可修改的容器中创建制品（即应用程序二进制文件），并通过流水线的不同阶段（开发、预发布、生产）进行推送，这具有巨大的优势。


  在由几十个、几百个甚至几千个容器组成的系统中，某种容器编排工具是必需的。这也意味着你的部分运维工作将被自动化，从而减轻运维部门的琐碎工作，使他们能够专注于手头更重要、更有趣的任务。


  ### DevOps


  **DevOps** 是将**开发**和**运维**结合成一个无缝团队。在传统的应用程序开发中，开发部门会创建或更新应用程序。该应用程序将进行单元测试并通过验收测试。一旦验收测试完成，应用程序将被移交给运维部门。


  运维部门将执行所需操作，将应用程序带入生产环境，例如运行数据库脚本或创建新的应用程序绑定。


  一旦在生产环境中运行，如果发现任何错误，分析和可能修复这些错误的过程也将是运维部门的责任。


  简而言之，两个团队在高度分离的孤岛中工作。


  你可能会看到这非常低效。开发人员凭借他们对应用程序内部机制的所有了解，实际上可能更适合帮助分析错误。


  将两个部门合并为一个似乎是合乎逻辑的举措，团队中的每个人都负责应用程序的完整生命周期，从开发到在生产环境中运行。这种共同的责任将不可避免地创造更强的“拥有服务”的意识，并在应用更改时导致更仔细的考虑。


  DevOps 的关键点之一是，任何可以自动化的事情都应该自动化，或者正如这句格言所说：“自动化一切！”


  ### CI/CD


  CI/CD 是一个流程，其中对代码库的更改会自动集成到该代码库中，并部署到生产环境。


  CI 的工作原理如下：


  1. 开发人员在一个所谓的特性分支上工作，以对系统进行更改。特性分支本质上是原始软件（位于主分支上）的一份副本。


  2. 当他们完成该任务的工作后，他们将在本地运行单元测试。一旦这些测试全部为“绿色”（green），意味着全部成功通过，他们就会将代码推送到 **版本控制系统（VCS）**（如
  Git）。


  3. 自动化服务器现在将开始构建已更改的软件。构建过程完成后，将针对构建运行自动化测试。这些测试将不仅包括单元测试，还包括集成测试。


  4. 如果所有这些测试也都成功，开发人员在特性分支上所做的代码更改将被集成到主分支中。





  - 5. 当构建失败时，由于测试失败或**源代码管理系统 (SCM)** 无法将更改集成到原始应用程序中，流程将停止，开发人员必须采取行动。


  该流程有几个优点。其中之一是，位于功能分支上的新开发软件在早期阶段就会被测试，以确保其与主分支中的原始软件兼容。任何差异都会被及早发现，这意味着修复它们所需的时间不应太长，并且风险也不会太大。


  此外，新更改将在早期阶段提供给其他开发人员，这意味着他们在将其合并到自己的更改中时遇到的问题会更少。CD 在 CI 的基础上扩展。这是一个流程，在 CI 中成功构建后，软件将被自动部署到暂存环境甚至生产环境。


  现代 CI/CD 流水线已将此流程完全自动化，有些甚至自动化到无需人工干预即可将软件更改引入生产环境。


  这是通过高度自动化所有测试工作来实现的。这些测试必须具有如此详尽的性质，以至于应用程序可以以很高的确定性部署到生产环境，并且可以按照规范运行并且不太可能包含错误。


  从以上内容可以看出，整个 CI/CD 流程是高度自动化的。市面上存在众多 CI 和 CI/CD 服务器。


  请注意，CI/CD 也可用于云原生开发之外。事实上，如今在常规软件开发中使用 CI 服务器已非常普遍。最主要缺少的是 CD 部分，因为它需要高度自动化的测试。除了这一点外，通常公司尚未准备好接受软件自动发布到生产环境。


  这可能是组织流程的结果（在政府组织中，通常仍然要求某个**质量保证 (QA)** 部门给出最终的“通过”）。在其他情况下，公司可能对即时将软件投入生产存在心理上的“阻碍”：他们仍希望在发布到生产环境之前由人工眼睛和大脑检查更改。


  ### 介绍 12-Factor 应用


  *The 12-factor app* 是对云原生应用程序应如何最好构建的描述。最初由 Heroku 的团队提出，此后已成为云原生应用程序或**软件即服务 (SaaS)**
  的事实标准。


  这些规则最重要的方面之一是它们可以应用于任何编程语言。在以下各节中，我们将逐一介绍这 12 个要素，并强调它们的重要性：


  - Code base

  - Dependencies


  #### Dependencies


  部署在应用服务器上的应用程序依赖于服务器提供的一组共享库。每个应用程序都可以使用这些库，而无需自行提供。


  虽然这似乎有利，但它也违反了我们在此提出的第二个要素：应用程序应明确指定并使用库的特定版本。因此，云原生应用程序绝不应依赖共享库，而应始终随其所需的所有依赖项一起打包。


  在 Java 中，我们可以使用 Maven 和 Gradle 等工具中的项目配置文件来明确声明我们的依赖项及其版本。


  #### Config


  *Store config in the environment.*


  *要素 3 规定应用程序应仅使用环境变量进行配置。此配置数据可以是数据库的 URL 和凭据，或在访问另一个微服务时使用的密钥。*


  这些值在开发、暂存和生产环境中很可能有所不同。通过将这些值设置为环境变量，应用程序可以在启动时检索并使用它们。


  应用程序本身在从暂存环境移动到生产环境时保持不变，只有环境变量的值会不同，反映该环境配置值。


  Docker、Podman 和 Kubernetes 等容器和编排工具为使用环境变量提供了非常好的支持。


  需要注意的是，环境变量并非用于配置应用程序逻辑，例如无效密码允许的重试次数。此类应用程序特定配置应存储在某种属性文件或数据库表中。


  #### Backing services


  *Treat backing services as attached resources.*


  应将支持服务视为有界资源。首先，什么是支持服务？**支持服务**是应用程序正常运行所依赖的任何外部服务。想想数据库、消息系统和外部服务，但也包括磁盘存储。这一点乍一看可能很奇怪，但请记住我们是在容器中运行。容器本质上是短暂的。这意味着它们寿命短暂，一旦容器死亡，存储在该容器内的任何内容都将永远消失。


  在此上下文中有界资源意味着您的应用程序可以声明对特定支持服务的需求，但实际绑定到该服务的则是云运行时。


  *要素 3 规定配置应外部化，这包括您将绑定的实际支持服务。这具有一个主要优势，即在运行时，您实际上可以更改此绑定。因此，如果某个支持服务出现故障，应用程序可以通过将其绑定到另一个资源而继续运行——例如，用新的数据库服务器替换出现故障的数据库服务器。*


  #### Build, release, run


  *Strictly separate build and run stages.*


  我们已在本章前面讨论过自动化构建流程的必要性。最好使用构建服务器创建应用程序的不可变实例并将其打包到容器中。


  发布此工件意味着为其分配某种唯一 ID。这可以是某种版本号。例如，容器允许您为其添加标签。其中一个标签可以是该版本号。这将使其与其他容器唯一区分开来。


  工件随后将在开发、暂存、生产等不同阶段之间移动，而不会被修改。


  在每个环境中应用的不同环境变量将相应地更改其配置。工件本身在任何时候都不会被更改。这将保证如果它在一个阶段工作正常，那么在另一个阶段也很可能正常工作。


  #### Processes


  *Execute the app as one or more stateless processes.*


  进程应作为无状态进程运行并应用**无共享 (SN)** 原则。这是一个分布式架构原则，规定节点之间不共享任何信息。这可确保您不会在系统中创建任何**单点故障 (SPOF)**。


  实际上，这意味着如果您的应用程序缓存数据，它应使用缓存服务器作为支持服务来执行此操作，而不是自行缓存数据。缓存需要时间填充，最好在相似节点之间共享。


  传统上，Web 服务器有一个称为**粘性会话**的概念。这会将来自用户的请求绑定到特定服务器，因为该服务器出于速度原因在内存中保留有关客户端会话的某些信息。


  粘性会话违反了 SN 原则，因此应避免。同样，通过存储在本地磁盘上的数据在进程之间共享信息在所有非常简单的情况下也应避免。将文件或图像上传进行处理就是此类情况的一个例子。


  从此开始，将应用程序带入运行状态以及在运行时监控应用程序则由他们负责。


  该要素表明 DevOps 对于运行您的云原生应用程序至关重要。开发和运维应共同负责部署和应用程序的运行时检查。这不仅会带来更快的交付，还会增加团队成员对应用程序的责任感。


  #### Resources


  开发人员机器可能与实际生产环境看起来非常不同，不仅因为操作系统，还因为外部资源的不同。在本地，开发人员可能会使用不同的数据库引擎，具有不同的消息服务器等等。他们可能会使用不同的**数据库管理系统
  (DBMS)**，也许在本地机器上运行免费版本，而在生产环境中运行付费版本。


  如果开发中使用资源与实际生产环境中的资源不同，则不兼容性可能会开始出现。因此，很明显，开发和生产环境应保持相似。


  #### Logs


  *Treat logs as event streams.*


  日志可能来自多个来源，而不仅仅是您的应用程序。它们通常是所有正在运行的进程和支持服务的输出按时间顺序排列的流。


  您的应用程序永远不必担心路由日志或存储位置。相反，您的应用程序只需将其日志输出流式传输到 stdout。


  在开发期间，开发人员可以轻松地在其控制台中查看日志流。


  在暂存和生产期间，每个进程流将被执行环境捕获并路由到一个或多个最终目的地。这些最终目的地通常是日志收集器，它们会以某种形式或结构存储信息，使数据易于在 Splunk
  或 Kibana 等专用日志工具中检索和查看。


  #### Admin processes


  *Run admin/management tasks as one-off processes.*


  管理任务可以是多种事物，例如——例如——数据库维护任务、需要定期运行的某些清理过程，或通常的 cron 作业。






  因此，一般来说，计划任务被认为是不好的做法。但在这里，我们可能会有不同的看法。Java 为定时任务提供了大量支持，例如 `EJBTimerBean` 或 `ScheduledExecutor`
  定时器。没有理由禁止使用这些类型的定时器。


  就是这样！我们已经讨论了云原生应用的 12 个要素。这可能信息量很大，你可能会觉得你的应用距离实现其中部分或全部目标还有一段距离。但改变现状的唯一方法是开始规划、编码和部署。如有必要，可以一步一步来；如果可能，就多做几件事。

  '
- '## 如何开始转型


  如果你来自单体架构，将其拆分可能是一项巨大的工程。这是一个不容易且肯定不是快速的过程。例如，优步（Uber）这家园定价格提供乘车服务的公司，就是从单体架构起步的。该单体应用是用
  Python 编写的，并使用单一的 PostgreSQL 数据库。那是 2014 年的事情。从那以后，它已经转型为由超过 4500 个独立服务组成的微服务架构。这表明转变你的应用环境并非易事。


  一开始，你应该确定单体内部的服务边界，以便能够提取它们。用传统的资源规划（ERP）系统来思考，你可以想到销售、采购、订单履行等。


  确定你想从单体中提取哪些服务，以及提取后它们将如何与单体交互。交互可以是基于请求/响应模式的，也可以通过消息队列进行异步交互。


  你可以选择先挑选那些变化最频繁或目前问题最多的服务。另一种选择是挑选那些具有问题性扩展趋势的服务。绞杀者模式（Strangler pattern）是实现这一目标的一种非常知名的模式。通过仔细且系统地将从单体中提取出的每一个已识别服务剥离出来，最终，单体将变成一个可以丢弃的空壳。


  有些公司可能会发现，他们的单体过于庞大，无法以这种方式进行重构。这时，可以应用乐高方法（Lego approach），即只将新功能构建在微服务中。这将创建一种混合结构，单体和微服务将继续并行运行。虽然这不能解决单体现有的问题，但它提供了一种未来进一步扩展应用的方式。

  '
