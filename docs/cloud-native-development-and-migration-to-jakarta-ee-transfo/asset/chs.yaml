  FQDN 是你在云计算中经常遇到的那类典型缩写之一。它通过指定主机名、域名和顶级域名，在**域名系统（DNS）**中精确定位相应位置。例如，www.packt.com
  的顶级域名是 .com。


  ### 云中容器的指标


  在云环境中工作的一个好处是，它自带许多开箱即用的功能。除了自动备份和扩展之外，监控也是其中之一。


  在本节中，我们将简要介绍云环境标配的监控功能。这里展示的功能是 Microsoft Azure 特有的，但其他云环境也提供类似功能。


  容器实例启动后，你便可以查看它的指标。


  为此，请在左侧菜单栏的**监控**标题下选择**指标**选项。随后你应看到类似这样的屏幕：


  ![](img/8948f94d0abcdb1ae94d6778da518d16_162_0.png)


  图 9.17 – 容器指标概览


  此视图显示应用的基本指标——CPU 使用率、已用内存量以及通过网络发送和接收的字节数。这些指标始终可用，这理所当然，因为它们是衡量应用当前负载大小的主要指标。因此，你可以根据这些指标来决定是否扩展应用，可以手动扩展，或者更可能是自动扩展。


  其中一个有趣的选项是，如果将鼠标悬停在某个指标上，所有其他指标的时间线也会随之改变。例如，如果将鼠标移到 **CPU** 指标窗口的某个峰值上，内存指标窗口也会移到同一时刻。在比较系统出现某个状况的同一时刻的不同指标时，这极为有用：


  ![](img/8948f94d0abcdb1ae94d6778da518d16_163_0.png)


  图 9.18 – 容器实例指标概览


  单击某个指标时，你会看到详细视图，并且还可以在可用的不同类型图表之间切换：


  ![](img/8948f94d0abcdb1ae94d6778da518d16_163_1.png)


  图 9.19 – 指标的详细视图，可选择切换图表类型


  在可以更改图表类型的同一菜单中，你还可以设置告警。告警功能允许在某个指标的预定义阈值被超过时采取特定操作。


  这里展示的是创建新告警时显示的屏幕：


  ![](img/8948f94d0abcdb1ae94d6778da518d16_164_0.png)


  图 9.20 – 设置告警


  我们选择了一个基于 CPU 的告警，规则是：如果平均 CPU 使用率超过 85，就触发告警。我们还要求每 5 分钟检查一次此告警，并且它还应查看最近 5 分钟的数据来确定该值。通常，你会希望这个时间段稍长一些，以便对应用负载有一个可靠的了解，并防止因偶然的峰值而触发告警。


  将多个此类指标放在容器实例的专用仪表板上非常有用，幸运的是，我们确实可以这样做。通过“保存到仪表板”选项，你可以将常用指标添加到个人或共享仪表板。


  ### 总结


  在本章中，我们将应用迁移到了云平台。我们选择了 Microsoft Azure，但也可以是任何云提供商。我们演示了如何设置容器注册表、如何进行实际部署，以及如何查看正在运行的容器实例的指标。


  现在，你已经将现有的单体应用迁移到了云端。你已经通过弹性等云原生特性对其进行了增强。你已经走了很长一段路，也许这正是你打算止步的地方。或者，你可能会选择走上将单体拆分为独立应用或微服务的道路。这里无所谓好坏，怎么做完全取决于应用本身及其预期用途。在下一章，我们将了解
  MicroProfile，因为它可以帮助你为应用添加更多云原生特性。

  '
- "## 10 介绍 MicroProfile\n\n到目前为止，你应该已经清楚如何将应用迁移到云端。尽管你的应用现在已在云端运行，但这并不意味着它就展示出了云原生能力。要实现这一点，还需要一些额外步骤。这些额外步骤可以通过使用\
  \ MicroProfile 来完成。\n\n在本章中，我们将介绍以下主题：\n\n- MicroProfile 的简要历史\n- MicroProfile 由什么构成\n\
  - 了解 MicroProfile 中的核心 API\n\n完成本章后，你将透彻理解什么是云原生行为，以及 MicroProfile 如何帮助你为应用添加这种行为。\n\
  \n### 技术要求\n\nMicroProfile 由多个针对不同任务的 API 组成。要利用这些功能，你只需选择一种 MicroProfile 实现并添加依赖项即可。这需要向你的\
  \ pom.xml 或 build.gradle 文件添加依赖项。有关示例可参见第 4 章。\n\n请注意，MicroProfile 有多种实现可用。其中一些已集成到完整的\
  \ Jakarta EE 产品中，另一些则可以独立使用。有关这些实现的完整列表，请参阅 MicroProfile 网站 https://microprofile.io/。\n\
  \n### MicroProfile 简史\n\n2010 年，Java EE 经历了一段艰难时期。新版本的创建耗时异常漫长。从 Java EE 6 到 Java\
  \ EE 7 花了 40 个月的时间。而从 Java EE 7 到 EE 8 更是花了整整 43 个月。与此同时，互联网瞬息万变，云带来了新的机遇和挑战。微服务正成为最新的架构热潮，而\
  \ Java EE 并没有提供默认的采用方式。\n\nJava EE 应用服务器供应商感到有必要为其平台的开发者提供额外功能。不幸的是，每个供应商都各行其是。看似矛盾的是，本应提供统一\
  \ API 的平台，现在却导致多个相互竞争且互不兼容的实现被开发出来。每个实现都有一套与其他实现不同的独特 API。\n\n多个供应商都意识到了这种不匹配。由于\
  \ Java EE 规范流程的速度无法提升，他们决定在 Eclipse 旗下创建一个新项目，该项目将提供一套规范，并带来 Java EE 所缺失的那些必需的云原生功能。这促成了\
  \ MicroProfile 的诞生。\n\n相关讨论始于 2016 年 9 月，到 2017 年 8 月，第一个版本正式发布。MicroProfile 当时仅包含\
  \ JAX-RS、JSON-P 和 CDI。这些都是已有的 Java EE API。\n\n不久，Config 被加入；在下一个版本 1.2 中，又加入了 JWT、Fault\
  \ Tolerance、Metrics 和 Health Check。该版本于 2018 年 1 月发布，展示了快速的发布周期。越来越多的特性被添加到 MicroProfile\
  \ 中，同时其中一些特性变为可选。这意味着实现方不需要实现这些特性，仍然可以被认证为一种实现。\n\n在撰写本书时，MicroProfile 6.0 是当前版本。下面这张图展示了它所具备的全部特性：\n\
  \n![](img/8948f94d0abcdb1ae94d6778da518d16_166_0.png)\n\n此版本的一个新变化是，它不再提及各个 Jakarta\
  \ EE API——它现在依赖于 Jakarta EE Core Profile。\n\n在接下来的小节中，我们将详细介绍以下主题：\n\n- Config\n\
  - Health\n- Fault Tolerance\n\n因此，当使用 `java -jar myapp.jar -Dmp.config.profile=testing`\
  \ 时，它会首先从 `META-INF/microprofile-config.properties` 加载设置，然后再从 `META-INF/microprofile-config-testing.properties`\
  \ 加载。如果某个属性在这两个文件中都有定义，则后者将覆盖前者。\n\n### MicroProfile Health（健康检查）\n\n健康是件奇妙的事——不仅对我们人类如此，对微服务也是如此。一旦部署了微服务，你会想偶尔检查一下它们的“体温”。这就引出了\
  \ MicroProfile Health 规范，它允许你定期验证服务的健康状况。\n\n需要注意，虽然该规范公开了一个 API，但它并不是为人类使用而设计的，而更多是用于机器对机器的交互。可以想象一个容器管理系统（如\
  \ Kubernetes），它需要查询某些 pod 的状态，以判断它们是否仍按预期运行。\n\n可以执行三种健康检查，如下表所述：\n\n| 类型 | 注解 |\
  \ 用途 |\n|---|---|---|\n| 就绪 | `@Readiness` | 确定应用是否已准备好处理请求 |\n| 存活 | `@Liveness`\
  \ | 确定应用是否正在运行 |\n| 启动 | `@Startup` | 确定应用是否仍在启动中 |\n\n表 11.1 – 健康检查注解\n\n要完成有效的健康检查，你的\
  \ bean 需要实现 `HealthCheck` 接口。该函数式接口包含 `call` 方法，返回值是一个 `HealthCheckResponse` 对象。\n\
  \n`HealthCheckResponse` 需要返回服务是 *up* 还是 *down*。它还可以提供额外的信息，比如名称。此外，它还可以包含更多关于故障资源的详细信息。这可以通过\
  \ `withData` 方法指定。\n\n下面是一个 HealthCheck 服务的示例：\n\n```\n@ApplicationScoped\n@Readiness\n\
  @Liveness\n@Startup\npublic class HealthService implements HealthCheck {\n    @Override\n\
  \    public HealthCheckResponse call() {\n        return HealthCheckResponse.named(\"\
  Project\")\n            .up()\n            .withData(\"redis\", \"Not available\"\
  )\n```\n\n\n\n\n\n```java\n.withData(\"postgres\", \"Available\")\n.build();\n}\n\
  }\n```\n\n这里有几个有趣的特性：\n\n1. 该 bean 是 `@ApplicationScoped`，因为对于你的应用程序，通常只需要一个这种类型的\
  \ bean。\n2. 该 bean 实现了 `HealthCheck` 接口。\n3. 在示例中，该 bean 负责就绪性、存活性和启动。你当然也可以定义三个不同的\
  \ bean，每个 bean 只负责一项任务。\n4. `up()` 方法表示服务按预期工作。要表示服务失败，则应改用 `down()` 方法。\n5. `withData`\
  \ 方法提供更多信息。可以有无限数量的此类方法。\n6. 最后，返回一个 `HealthCheckResponse` 对象。\n\nMicroProfile Health\
  \ 在 http://www.acme.com:9080/health 上公开了一个端点。\n\n以下是前面健康服务的示例：\n\n```json\n{\n \
  \ \"checks\": [\n    {\n      \"data\": {\n        \"redis\": \"Available\",\n \
  \       \"postgres\": \"Available\"\n      },\n      \"name\": \"Project\",\n  \
  \    \"status\": \"UP\"\n    }\n  ],\n  \"status\": \"UP\"\n}\n```\n\n这里，我们向健康端点询问微服务的状态，它回复说状态为\
  \ \"UP\"。我们还可以看到，数据元素中发送了额外的信息。使用的两个数据库都在线。如果该服务所依赖的任何系统不可用，也可以将其添加在此处。这对于快速识别和解决问题非常有用。\n\
  \n### MicroProfile Fault Tolerance\n\n因此，我们已经配置了服务，并且可以检查其健康状况。微服务成为云原生的下一步是添加一些弹性。服务应在一定范围内能够自我修复。\n\
  \nMicroProfile Fault Tolerance 中有六个注解可以帮助使你的服务更健壮：\n\n- `@Asynchronous`\n- `@Retry`\n\
  - `@Timeout`\n- `@Bulkhead`\n- `@CircuitBreaker`\n- `@Fallback`\n\n值得注意的是，这些注解可以添加到\
  \ CDI bean 以及这些 bean 中的公共方法中。在内部，它们是通过拦截器实现的。\n\n#### @Asynchronous\n\n@Asynchronous\
  \ 为其所注解的方法添加了异步行为。它将它们包装成返回 `CompletionStage` 的方法，其他容错注解可以应用于该方法。\n\n@Asynchronous\
  \ 允许你的代码并发运行。让我们看一个示例：\n\n```java\n@Inject\n// is annotated with @Asynchronous\n\
  private CustomerDetailsService customerDetails;\n\n@Inject\n// is annotated with\
  \ @Asynchronous\nprivate CustomerSalesHistoryService customerSalesHistory;\n\npublic\
  \ CompletionStage<Customer> retrieveCustomerAsynchronously() {\n    CompletionStage<CustomerDetails>\
  \ result1 = customerDetails.getDetails(customerNo);\n    CompletionStage<CustomerHistory>\
  \ result2 = customerSalesHistory.getHistory(customerNo);\n\n    ...\n}\n```\n\n\
  ```java\n@RequestScoped\npublic class CustomerDetailsService {\n\n    @Retry\n \
  \   @Asynchronous\n    public CompletionStage<CustomerDetails> getDetails(String\
  \ customerNo) {\n        var details = retrieveDetails(customerNo);\n        return\
  \ CompletableFuture.completedFuture(details);\n    }\n}\n```\n\n我们定义了 `CompletionStage`\
  \ 来检索客户信息。它由两个步骤组成——检索通用客户信息和检索客户的销售历史。然后将这些信息合并到一个对象 `CustomerDetails` 中并返回。\n\n\
  在前面的示例中，`CustomerDetailsService` 中的 `getDetails` 被注解了 `@Retry`。这意味着当方法调用失败时，会重试。\n\
  \n异步行为是通过 MicroProfile 在方法被调用时介入实现的。它拦截方法调用并安排稍后执行，可能在不同的线程上。然后返回 `Future` 或 `CompletionStage`。但这不是从方法返回的那个，因为它尚未执行。稍后，方法会被执行并返回其结果。\n\
  \n如果返回 `Future`，最初返回的 `Future` 将被此结果更新。如果是 `CompletionStage`，Fault Tolerance 会等待此\
  \ `CompletionStage` 完成，然后将最初返回的 `CompletionStage` 标记为已完成。\n\n虽然 `@Asynchronous`\
  \ 允许返回 `Future` 的方法异步运行，但它只能对返回 `CompletionStage` 的方法应用容错功能。\n\n#### @Retry\n\n\
  此注解允许你优雅地处理临时的网络故障。\n\n`@Retry` 注解可以应用于 bean 的类或单个方法，以表示如果方法调用失败，应再次尝试。还可以指定最大重试次数以及最大重试持续时间。\n\
  \n行为很简单——如果方法正常返回，则什么也不发生。如果它抛出异常，则在异常可以转换为 `retryOn` 参数中提及的异常之一时，方法将被再次调用。另一方面，如果异常可以转换为\
  \ `abortOn` 参数中提及的异常之一，则不会执行重试，方法将向调用者抛出异常。\n\n以下是 `@Retry` 的典型使用示例：\n\n```java\n\
  @Retry(maxRetries = 5, maxDuration = 1000)\npublic List<Project> findAll()\n```\n\
  \n#### @Timeout\n\n@Timeout 防止我们永远等待方法执行完成。可以指定值和时间单位。如果发生超时，将抛出 `TimeoutException`\
  \ 错误。`@Timeout` 可以与其他此处提及的注解组合使用。\n\n以下是 `@Timeout` 的典型使用示例：\n\n```java\n@Timeout(500)\n\
  public List<Project> findAll()\n```\n\n#### @Bulkhead\n\n@Bulkhead 用于防止系统中的一个故障级联到系统的其他部分并最终导致整个应用程序崩溃。它的名称来自航运业，油轮的船体由单独的隔舱组成。如果船体被击穿，隔舱会被关闭，只有受影响的隔舱会被淹没，而不是整个船体，从而防止油轮沉没。\n\
  \n有两种可能的风格——信号量方法和线程池隔离方法。\n\n在信号量方法中，我们指定方法的最大并发调用数。示例如下：\n\n```java\n@Bulkhead(5)\n\
  public List<Project> findAll() {\n```\n\n这表示 `findAll` 方法最多只能有五次并发调用。如果第六次调用到来，它将立即失败并抛出\
  \ `BulkheadException` 错误。\n\n在线程池方法中，注解相同，但它与 `@Asynchronous` 注解一起使用，如下所示：\n\n```java\n\
  @Bulkhead(5)\n@Asynchronous\npublic Future<List<Project>> findAll()\n```\n\n这意味着只有五个线程池中的线程允许并发运行此方法。下一个请求必须等待在等待队列中。当等待队列满时，将抛出\
  \ `BulkheadException` 错误。\n\n通过使用这些限制，完整的线程池无法被耗尽。否则，在某个时刻，所有线程很可能会执行此性能缓慢的方法，并且将没有更多线程可用于为正常运行的方法提供服务。\n\
  \n线程数和等待队列的大小可以配置。\n\n#### @CircuitBreaker\n\n`@CircuitBreaker` 允许快速失败场景。如果某个组件无法正常工作，断路器将打开，不再向该组件发送流量。断路器可以处于三种可能的状态之一：\n\
  \n- **Closed：** 在这种情况下，请求被发送到组件。\n- **Open：** 在这种情况下，任何请求都会立即导致 `CircuitBreakerOpenException`\
  \ 错误。\n- **Half-open：** 在这种情况下，系统正在探测组件以查看其是否能无故障运行。\n\n这里有一个场景：断路器为滚动窗口的请求保留 *failure\
  \ ratio*。一旦超过阈值失败率，断路器将打开。发送的任何请求都会立即导致 `CircuitBreakerOpenException` 错误。经过可配置的延迟后，断路器进入半开状态。然后，它会探测可配置数量的试运行。如果其中任何一个失败，它将再次进入打开状态。如果所有试运行中均未发现错误，断路器将再次关闭，流量将再次自由流向组件。\n\
  \n以下是使用默认指定值的 `@CircuitBreaker` 的典型使用示例：\n\n```java\n@CircuitBreaker(delay = 5000,\
  \ requestVolumeThreshold = 20,\n        failureRatio = 0.5, successThreshold = 1)\n\
  public List<Project> findAll() {\n```\n\n要检查的滚动请求窗口为 20。如果在这 20 个请求中，至少有 10 个（20\
  \ * 0.5）失败，断路器将打开。等待 5,000 毫秒后，它将进入半开状态。如果在此状态下有一个请求成功，断路器将再次关闭。\n\n#### @Fallback\n\
  \n我们迄今为止看到的所有注解都试图阻止方法失败。但有时，这是不可能的。在这些情况下，与其返回错误，你可能希望返回替代数据，例如空返回值或可能缓存的值。对于这些情况，可使用\
  \ `@Fallback` 注解。\n\n\n\n\n有两种可能——回退处理器和回退方法。以下代码展示了一个回退方法的示例：\n\n```\n@Fallback(fallbackMethod\
  \ = \"backup\")\npublic List<Project> findAll() {\n    return persistence.getAll();\n\
  }\n\nList<Project> backup() {\n    return List.of();\n}\n```\n\n需要注意的是，回退方法应与其被注解的方法具有相同的参数和返回类型。\n\
  \n### 最后说明\n\n尽管我们看过的所有注解都可以单独使用，但将它们结合使用是可能的，甚至是可取的。请看下面的代码示例：\n\n```\n@Retry(maxRetries\
  \ = 5, maxDuration = 1000)\n@Bulkhead(5)\n@Timeout(500)\n@CircuitBreaker(delay =\
  \ 5000, requestVolumeThreshold = 20, failureRatio = 0.5, successThreshold = 1)\n\
  @Fallback(fallbackMethod = \"backup\")\npublic List<Project> findAll() {\n```\n\n\
  这些注解按如下方式协同工作：\n\n1. 进入时，计时器开始运行。\n2. 检查信号量，看该方法是否可以被调用。\n3. 方法被调用。\n4. 如果抛出异常，熔断器会将其记录下来。\n\
  5. 重试机制将启动并重新尝试；从第2步开始。\n6. 一旦触发超时或重试次数用尽，将调用回退方法。\n\n### MicroProfile 度量\n\n我们的服务已经配置完成，我们可以分析其健康状况，并且已具备韧性能力。接下来我们要了解它的性能表现。处理了多少请求？最长执行时间是多少？平均执行时间是多少？这类问题可以通过\
  \ MicroProfile 度量来提出并得到解答。\n\n度量是一个广阔的领域。在本节中，我们只讨论可以使用的注解。但也要知道，你可以通过编程方式定义自己的度量。\n\
  \n度量提供了一种 REST API，按规范要求以 Prometheus 格式返回度量数据。实现时也可以选择以 OpenMetrics 格式响应。\n\n度量有三种作用域：\n\
  \n- **基础**：供应商可能提供的、由规范描述的度量\n- **供应商**：特定于供应商的度量\n- **应用**：特定于应用程序的度量\n\n四种度量注解如下：\n\
  \n- `@Counted`\n- `@Gauge`\n- `@Metric`\n- `@Timed`\n\n#### @Counted\n\n@Counted\
  \ 统计被注解对象的调用次数。它可以应用于方法、构造函数和类型。\n\n下面是一个示例：\n\n```\n@Counted(absolute = true)\n\
  public Project findById(String uid) {\n```\n\n#### @Gauge\n\n@Gauge 采样被注解对象的值。它只能应用于方法。\n\
  \n仪表没有默认单位，因此定义仪表时你需要提供一个单位。仪表通常是一个来自应用程序的值。示例包括客户总数、平均订单价值或已处理包裹数量。\n\n仪表暴露被注解方法的返回值，如下所示：\n\
  \n```\n@Gauge(name = \"total_projects\", tags={\"projects\"}, unit = MetricUnits.NONE)\n\
  public Long getProjectCount()\n```\n\n#### @Metric\n\n@Metric 包含请求注入度量时的元数据信息。它可以应用于字段和参数。\n\
  \n使用此注解时，实现需要将请求的度量注入到字段或参数中：\n\n```\n@Inject\n@Metric(name = \"total_projects\"\
  )\nLong projectCount;\n```\n\n我们先前定义的仪表的值被注入到 projectCount 字段中。这允许你的代码直接对收集到的度量进行操作。\n\
  \n#### @Timed\n\n@Timed 跟踪被注解对象的持续时间。它可以应用于方法、构造函数和类型。它跟踪对象被调用的频率以及完成所花费的时间。\n\n\
  下面是一个用法示例：\n\n```\n@POST\n@Timed(name = \"project_create_duration\")\npublic Response\
  \ post(Project project)\n```\n\n### 遥测追踪\n\n遥测规范是 MicroProfile 6 中的新规范。遥测汇集了关于在微服务环境中运行的应用程序的信息。这些信息可以来自各种来源，最显著的是日志、追踪和度量。\n\
  \nMicroProfile 之前已经有了一份名为“Open Tracing（开放追踪）”的追踪规范。用 OpenTelemetry 取代 Open Tracing\
  \ 确实在社区中引起了一些波澜，但最终选择 OpenTelemetry 是合理的。它是由 CNCF 支持的项目 (https://www.cncf.io/projects/opentelemetry/)。此外，它不依赖于特定供应商和工具，并且可以与众多开源和商业项目集成。\n\
  \nMicroProfile 使用 OpenTelemetry 项目来实现遥测。在该规范的 1.0 版本中，日志和度量被视为超出范围，并且可以按任何期望的方式实现。\n\
  \n关于分布式追踪，有各种概念需要理解：首先也是最重要的，你的应用程序正在执行多个任务。有些可能是内部的，有些可能与外部实体（如数据库）相关，有些可能包括调用其他外部服务。分布式追踪记录所有活动及其持续时间。这样，就可以清晰地描绘出跨越多个系统的完整过程。\n\
  \n例如，假设你有一个系统，用于验证某人是否订阅了你公司的新闻通讯。你需要验证该电子邮件地址是否尚未注册。如果是新订阅者，则注册他们，并要求邮件服务向他们发送最新的新闻通讯。\n\
  \n消息通常会到达，因为你的应用程序有一个 Jakarta Message 监听器（组件1）在监听特定的队列。接下来，你的应用程序（组件2）将通过查询数据库（组件3）来验证电子邮件是否已注册。最后，如果该电子邮件地址未知，你的应用程序可以调用\
  \ SendNewsletter 服务（组件4）向新订阅者发送当前一期的新闻通讯。\n\n（注意，更可能的情况是，你的应用程序会将一条 Jakarta Message\
  \ 放到另一个队列上，SendNewsletter 服务会监听该队列，从而导致涉及更多组件。）\n\n如果你希望在真实场景中获得这一过程的完整概览，需要一条跨越所有这些系统的追踪，因此得名“分布式追踪”。分布式追踪记录请求在通过多服务架构传播时所经过的路径。\n\
  \n分布式追踪由多个 span 组成。span 是工作或操作的一个单元。在前面的示例中，调用每个组件都应导致在追踪中登记一个 span。\n\n遥测可以通过以下任何一种插桩方式实现：\n\
  \n- 自动插桩\n- 手动插桩\n- 代理插桩\n\n让我们逐一看看这些方式。\n\n#### 自动插桩\n\nJakarta RESTful Web Services\
  \ 和 MicroProfile REST 客户端会自动参与分布式追踪。你无需进行任何代码更改即可实现这一点。\n\n#### 手动插桩\n\n手动插桩是添加追踪能力的过程。有两种方式可以实现——第一种通过注解，第二种通过将追踪对象注入到你的\
  \ Java 代码中。让我们更详细地了解这些选项。\n\n##### @WithSpan 注解\n\n在 CDI 管理的 Bean 上使用此注解，可以创建新的\
  \ span 并与当前追踪建立关联。你可以通过在 @WithSpan 注解上使用 @SpanAttribute 属性来指定哪些参数应记录在 span 中。下面是一个示例：\n\
  \n```java\n@ApplicationScoped\nclass SomeBean {\n    @WithSpan\n    void span()\
  \ {\n    }\n    @WithSpan(\"name\")\n    void spanName() {\n    }\n    @WithSpan(kind\
  \ = SpanKind.SERVER)\n    void spanKind() {\n    }\n    @WithSpan\n    void spanArgs(@SpanAttribute(value\
  \ = \"theArguments\") String args)\n    {\n    }\n}\n```\n\n##### 注入追踪对象\n\n可以通过\
  \ @Inject 注解将多个追踪对象注入到你的代码中：\n\n- OpenTelemetry\n- Tracer\n- Span\n- Baggage\n\n\
  一旦注入，你可以操作不同的对象向代码中添加 span。下面是一个从 Tracer 获取 SpanBuilder 以向追踪中添加新 Span 对象的示例：\n\n\
  ```java\npublic class SomeResource {\n    @Inject Tracer tracer;\n}\n```\n\n\n\n\
  \n\n```\n@GET\n@Path(\"/add\")\npublic Response addSpan() {\n    Span span = tracer.spanBuilder(\"\
  addSpan\")\n        .setSpanKind(SpanKind.INTERNAL)\n        .setParent(Context.current().with(this.span))\n\
  \        .setAttribute(\"identifier\", UUID.randomUUID().toString())\n        .startSpan();\n\
  \    span.end();\n    return Response.ok().build();\n}\n```\n\n注意，当你手动向追踪添加 span\
  \ 时，需要调用 span.end()。如果不这样做，span 将不会被添加到追踪中。\n\n#### 代理插桩\n\n代理插桩允许你通过指定一个 JAR 文件将\
  \ Java 代理附加到应用程序。通过这种方式，你可以为多个流行的 Java 框架和库添加追踪支持。\n\nJava 代理通过 javaagent 参数附加到\
  \ JVM，如下所示，但其具体配置可能因你使用的服务器而异：\n\n```\n-javaagent: opentelemetry-javaagent.jar\n\
  ```\n\n### 其他规范\n\n在本节中，我们仅简要介绍其他几个规范，目的是让你快速了解其功能。\n\n### OpenAPI\n\n该规范为 OpenAPI\
  \ 提供了 Java API，OpenAPI 是一种允许开发者公开其 API 文档的规范。\n\n它包含不少于 46 个可添加到代码中的注解，使你能够完整地描述\
  \ API、资源、参数和返回值。\n\n以下示例摘自官方 MicroProfile OpenAPI 规范文档：\n\n```\n@GET\n@Path(\"/{username}\"\
  )\n```\n\n```\n@Operation(summary = \"Get user by user name\")\n@APIResponse(description\
  \ = \"The user\",\n    content = @Content(mediaType = \"application/json\",\n  \
  \      schema = @Schema(implementation =\nUser.class))),\n@APIResponse(responseCode\
  \ = \"400\", description = \"User not found\")\npublic Response getUserByName(\n\
  \    @Parameter(description = \"The name that needs to be fetched. Use user1 for\
  \ testing. \", required = true) @PathParam(\"username\")\nString username)\n{...}\n\
  ```\n\n### RestClient\n\nMicroProfile RestClient 提供了一种类型安全的方式来通过 HTTP 调用 RESTful\
  \ 服务。这可以通过指定一个接口来实现，该接口包含你要调用的远程 API 的方法，并使用 RESTful 注解进行标注。\n\n同样摘自官方文档，以下是一个示例接口：\n\
  \n```\n@Path(\"/movies\")\npublic interface MovieReviewService {\n    @GET\n   \
  \ Set<Movie> getAllMovies();\n```\n\n然后，该接口以这种方式用于创建客户端：\n\n```\nURI apiUri = new\
  \ URI(\"http://localhost:9080/movieReviewService\");\nMovieReviewService reviewSvc\
  \ = RestClientBuilder.newBuilder()\n    .baseUri(apiUri)\n    .build(MovieReviewService.class);\n\
  Set<Review> reviews = reviewSvc.getAllMovies();\n```\n\n### JSON Web Token 认证\n\n\
  JSON Web Token (JWT) 认证是一种用于识别已认证用户及其角色的认证机制。\n\n它在成功认证后由服务器生成，然后通过 HTTP 发送到系统想要访问的其他服务。通常，JWT\
  \ 既经过加密也经过签名。接收系统可以验证签名者并解密 JWT。\n\n这种认证和授权系统通常用于服务到服务的环境中，其中每个服务都会传递 JWT。\n\n###\
  \ Jakarta EE 10 核心概要\n\n该规范是 MicroProfile 6.0 中的新规范。在此之前，MicroProfile 核心规范包括 Jakarta\
  \ RESTful Web Services、Jakarta JSON Binding、Jakarta JSON Processing、Jakarta Dependency\
  \ Injection 和 Jakarta Annotations。\n\n在 MicroProfile 6.0 中，决定通过采用 Jakarta EE 的 Core\
  \ Profile 将这些规范纳入一个总括规范。这个新的核心规范轻量级，但足以满足微服务和边缘计算的需求。\n\n### 总结\n\n在本章中，你了解了 MicroProfile\
  \ 的全部内容。我们逐一介绍了每个必需的规范。我们还详细讨论了升级 Cargo Tracker 应用程序为云原生版本时感兴趣的规范。\n\n在下一章中，当我们升级\
  \ Cargo Tracker 应用程序时，将会看到 Config、Health、Fault Tolerance 和 Metrics 规范。\n"
