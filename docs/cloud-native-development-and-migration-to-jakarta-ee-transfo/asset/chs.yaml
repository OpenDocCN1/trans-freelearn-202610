  \ – 未规划路线的货物\n\n### 移动事件记录器\n\n**移动事件记录器** 是一个用于向 Cargo Tracker 应用程序发送事件的界面。你可以使用该界面来操作系统中的数据。它使你能够在整个系统中移动货物。\n\
  \n为了展示该界面的功能，我们将演示如何向 Cargo Tracker 应用程序的后端发送一条关于 ID 为 DEF789 的货物的事件。在这里，我们将为 ID\
  \ 为 DEF789 的货物发送一个事件，告知系统该货物已抵达达拉斯。\n\n\n\n\n\n当你点击移动事件查看器时，你会看到以下屏幕，它引导我们完成事件创建流程：\n\
  \n![](img/8948f94d0abcdb1ae94d6778da518d16_39_0.png)\n\n图 2.12 – 移动事件记录器界面\n\n要创建我们想要的事件，请按照以下步骤操作：\n\
  \n- 1. 从下拉列表中选择 DEF789 的跟踪 ID。\n- 2. 点击 Next 按钮。\n- 3. 选择货物到达的位置 – 例如，达拉斯。\n- 4.\
  \ 点击 Next 按钮。\n- 5. 选择 UNLOAD 事件类型。\n- 6. 选择货物当前所在的航次。在我们的例子中，这是 0301S。\n- 7. 点击\
  \ Next 按钮。\n- 8. 选择事件发生的日期。在我们的例子中，我选择了 16-02-2023。\n- 9. 点击 Next 按钮。\n\n完成这些步骤后，你将看到一个确认屏幕，显示你在之前步骤中填写的所有信息。检查它们是否正确；如果正确，你可以点击\
  \ Submit 按钮，这将把事件发送到 Cargo Tracker 应用程序。\n\n当我们查看管理界面时，我们会看到货物的状态现在是 IN_PORT，并且货物\
  \ ID 为 DEF789 的最后已知位置是达拉斯。\n\n## Cargo Tracker 应用程序中使用的 Java EE 特性\n\n现在你对 Cargo\
  \ Tracker 应用程序的工作原理有了一个大致的了解，是时候看看使其正常运行所涉及的技术了。Java EE 由多个项目和技术组成，其中每个项目都可以利用其他功能的特性。\n\
  \nCargo Tracker 应用程序使用了大量 Java EE 功能。在接下来的几个部分中，我们将介绍其中最常用的功能。我们将简要描述该功能是什么以及它在\
  \ Cargo Tracker 应用程序中的使用方式。\n\n我们将使用 Java EE 对这些技术的命名。Jakarta EE 对这些技术有不同的名称。我们将讨论以下\
  \ Java EE 7 技术：\n\n- Enterprise Java Beans\n- Java Persistence\n- Java Messaging\
  \ System\n- Context and Dependency Injection\n- Java Server Faces\n- JAX-RS\n- JSON-B\n\
  - Java Batch\n\n请注意，在从 Java EE 切换到 Jakarta EE 期间，由于法律要求，许多技术的名称不得不更改。在 *附录 A* 中，你可以找到一个列表，比较了按原始\
  \ Java EE 名称和新的 Jakarta EE 名称的技术。\n\n### Enterprise Java Beans\n\nEnterprise Beans\
  \ 从第一天就存在了。在旧的“J2EE 时代”，有几种不同类型的企业 Bean：**Session Beans (SB)、Entity Beans (EB) 和\
  \ Message Driven Beans (MDB)。**\n\n会话 Bean 还可以进一步细分为有状态会话 Bean、无状态会话 Bean 和单例会话\
  \ Bean。前两种一直存在，而后一种是在规范的 3.x 版本中添加的。\n\n有状态会话 Bean 与客户端保持对话状态。这意味着客户端与特定的 Bean 之间有一对一的连接，并且该\
  \ Bean 在对话期间仅为该客户端服务。例如，我们可以有一个 `ShoppingCartSession`，它与 Faces 购物车连接。\n\n无状态会话 Bean\
  \ 在其生命周期中不知道它们与哪些客户端进行了对话。应用程序服务器通常会对其进行池化。一旦对无状态会话 Bean 的请求到达该应用程序，就会从池中选择一个 Bean\
  \ 并在其上调用请求的方法。无状态 Bean 为容器提供了很大的灵活性，因为它可以根据需要增加或减少池大小。\n\n最后一种会话 Bean 是单例会话 Bean。它与无状态会话的工作方式相同，但整个应用程序中只有一个该\
  \ Bean 的实例。单例会话 Bean 通常用于数据库升级或其他批处理相关任务等任务。\n\n接下来是另一种类型的企业 Bean，我们有实体 Bean。这些\
  \ Bean 在规范的 1.0 版本中引入，有两种类型：Bean 管理持久性 (BMP) 和容器管理持久性 (CMP)。前者要求应用程序开发人员调用持久性操作并执行事务管理，而后者则让\
  \ EJB 容器调用适当的数据检索/存储和事务控制操作。这些类型的 Bean 变得非常不受欢迎，因为所有操作和参数都需要在特殊的部署描述符文件 (ejb-jar.xml)\
  \ 中指定，导致 XML 文件经常包含数百条 XML 语句。它们变得如此不受欢迎，以至于在企业 Bean 规范的第 3 版中，它们被完全放弃，取而代之的是 Java\
  \ Persistence。\n\n最后一种 Bean 是消息驱动 Bean。这是一种专门的 Bean，它作为 JMS（或消息传递）消息的消费者注册，这些消息放置在队列或主题上。一旦消息到达队列或主题，该\
  \ Bean 的回调方法将被调用以执行一些业务逻辑。\n\n### Persistence (JPA)\n\n如前所述，Java Persistence 是实体\
  \ Bean 的替代品。JPA 应以最广泛的意义来看待：创建、更新、检索、删除和查询。要持久化的对象会用 @Entity 注解进行注解。此外，实体之间的关系可以在代码中建模。\n\
  \nJPA 受到了 Hibernate 的思想和概念的很大影响，Hibernate 是一个流行的对象关系映射器。它试图为以下事实提供一种变通方法：在代码中，我们使用可以嵌入其他对象的对象，而在持久化或检索数据时，我们使用的是平面表。\n\
  \nJPA 还提供了通过传统 SQL、面向对象的查询 DSL 以及称为 Criteria API 的基于对象的查询定义来查询数据的可能性。\n\n### Messaging\
  \ (JMS)\n\nJMS 是通过交换消息使不相干的系统集成的概念。消息传递绝对不是 Java EE 发明的。早在 Java 兴起之前，就已经有许多所谓的面向消息中间件\
  \ (MoM) 的实现。示例包括 IBM MQ 和 Tibco Messaging Service。最近，Apache Kafka 在 Java 社区内外都引起了巨大的关注。JMS\
  \ 为消息传递提供了一种标准工作方式的规范。\n\nJMS 支持两种类型的消息传递：**点对点 (PTP)** 和 **发布和订阅 (pub-sub)**。PTP\
  \ 使用队列，即参与消息传递过程的两个客户端可以在其中相互交换消息。所以，这通常是一对一的连接。另一方面，pub-sub 的工作方式是，一个客户端将在主题上发布消息，而无限制数量的客户端将通过订阅该主题来表示对接收这些消息的兴趣。\n\
  \n异步通信通过消息传递的主要优点之一是，发送系统不会受到预期接收系统不可用性的严重影响。对发送系统而言，消息仍然似乎已发送。它将闲置在队列中，直到接收系统上线以检索它。将此与通过\
  \ REST 等直接调用另一个系统的情况进行比较，如果该系统不可用。这可能会由于两种系统同步耦合的方式而导致各种问题。现在，增加连接系统的数量，你就会开始明白为什么消息传递是如此出色的解决方案。\n\
  \n### Context and Dependency Injection\n\nCDI 是上下文和依赖注入 API。很明显，多年来，Java EE 受到 Spring\
  \ 框架的很大压力和影响。CDI 是最好的例子，因为 Spring 框架普及了 **依赖注入 (DI)**。DI 的概念是对象不应自行实例化它所需的对象，而应将这些对象注入其中。DI\
  \ 鼓励你对依赖注入进行 **控制反转 (IoC)**，而 CDI 在此规范之上构建。\n\n除了在运行时将对象注入类之外，CDI 还具有生产者概念。这些不是依赖对象本身，而是知道如何获取依赖对象的对象。\n\
  \nCDI 不仅仅是注入依赖对象 – 它还提供了一个事件机制。这允许一个 Bean 触发事件，而另一个 Bean 已注册为对这些事件感兴趣。因此，一旦事件被触发，监听器类就可以对其做出反应。作为示例，想象一个名为\
  \ `CustomerRegistrationBean` 的 Bean，它将触发 `CustomerCreatedEvent` 事件。`EmailBean` Bean\
  \ 将监听这些事件，并在接收到 `CustomerCreatedEvent` 事件后，向新客户发送欢迎邮件。\n\n值得指出的是，CDI 并不是 Jakarta\
  \ EE 中唯一可用的依赖注入机制。自 3.0 版本以来，EJB 也支持依赖注入的注解：\n\n- @EJB\n- @Resource\n\n@EJB 允许你将其他\
  \ EJB 注入到 EJB 中，而 @Resource 允许你注入提供与其他系统连接的程序对象，例如 SQL DataSource 或 Jakarta Messaging\
  \ MessageFactory。\n\n\n\n\n其他API可能会提供注入注解。例如，JPA中的`@PersistenceUnit`注解，它会注入一个`EntityManagerFactory`对象。\n\
  \n### JavaServer Faces（JSF）\n\nJSF是一种基于服务器端组件的用户界面框架。它是用于在浏览器中渲染用户界面的可用技术之一。Java\
  \ EE中的UI开发经历了许多迭代，从基本的servlet开始，即HTML被写入输出流。然后，加入了Java服务器页面（JSP），它允许业务逻辑和表示逻辑分离。接着，支持自定义标签库和标准标签库集，即Java标准标签库（JSTL）。最后，出现了JSF。\n\
  \nJSF遵循著名的**模型-视图-控制（MVC）**模式。它是一系列UI小部件和控件的集合。由于它是一个规范，随着时间的推移出现了许多竞争性实现。著名的例子有IceFaces、OpenFaces和MyFaces。\n\
  \n工作流程如下：你有一个网页，在上面添加表示UI元素的JSF自定义标签。每个页面都有一个或多个所谓的支持bean。支持bean由容器运行时管理，它们用于保存UI元素的属性和方法。此外，它们还可以保存事件监听器。\n\
  \n作为一个简单示例，请看下面的JSF代码，它取自Jakarta EE教程的Hello World示例：\n\n```\n<html lang=\"en\"\n\
  \    <h:body>\n        <h:form>\n            <h:graphicImage url=\"#{resource['images:duke.waving.gif']}\"\
  \ alt=\"Duke waving his hand\"/>\n            <h2>Hello, my name is Duke. What's\
  \ yours?</h2>\n            <h:inputText id=\"username\"\n                title=\"\
  My name is: \"\n                value=\"#{hello.name}\"\n                required=\"\
  true\"\n                requiredMessage=\"Error: A name is required.\"\n       \
  \         maxlength=\"25\" />\n            <p></p>\n            <h:commandButton\
  \ id=\"submit\" value=\"Submit\" action=\"response\">\n            </h:commandButton>\n\
  \            <h:commandButton id=\"reset\" value=\"Reset\" type=\"reset\">\n   \
  \         </h:commandButton>\n        </h:form>\n        ...\n    </h:body>\n</html>\n\
  ```\n\n这里，`<h:inputText>`元素定义了一个文本输入字段，而`<h:commandButton>`定义了一个可点击的按钮。所有这些元素都以`h`为前缀，`h`是JSF命名空间的缩写。\n\
  \n以下是该JSF页面的支持bean的代码：\n\n```\n```java\n@Named\n@RequestScoped\npublic class Hello\
  \ {\n    private String name;\n    public Hello() {\n    }\n    public String getName()\
  \ {\n        return name;\n    }\n    public void setName(String user_name) {\n\
  \        this.name = user_name;\n    }\n}\n```\n```\n\n`inputText`字段通过`value=\"\
  #{hello.name}\"`声明与支持bean的`name`属性相连，其中`hello`是bean类的名称，以小写字母开头，`name`与支持bean中的`name`属性匹配。\n\
  \nCargo Tracker应用对所有UI元素使用JSF。如果你想浏览JSF页面的源代码，请转到`src/main/webapp`。\n\n### JAX-RS\n\
  \n很长一段时间里，SOAP在Web服务领域占据主导地位。Java通过JAX-WS（Java API for XML Web服务）支持SOAP。但新世纪之初，一种新型Web服务进入了舞台。Roy\
  \ Fielding撰写了一篇关于这一新概念的论文，并将其命名为**表述性状态转移**（Representation State Transfer），简称REST。\n\
  \nRESTful Web服务，即遵循REST原则的Web服务，是一种以可被其他机器或服务访问的方式暴露机器上资源的方法。SOAP Web服务对开发者施加严格规则，而RESTful\
  \ Web服务可以用多种编程语言开发。与SOAP只允许XML作为其内容相比，RESTful服务支持多种数据格式。重要的是要理解，REST使用标准HTTP动词（GET、POST、PUT、PATCH、DELETE和HEAD）来执行其操作。\n\
  \nREST变得极其流行，因为它允许组织以非常简单、易于理解的方式与外界共享其数据和信息。2002年，亚马逊创始人杰夫·贝佐斯写了一份备忘录，他在其中要求“_所有团队都应通过服务接口暴露其数据和功能，所有团队必须通过这些服务接口相互通信，_”\n\
  \n*并且最终不允许任何其他形式的相互通信。* 虽然亚马逊并不是第一家采用REST的大型公司，但以这种严格的方式采用REST为它的发展铺平了道路。\n\n下图显示了自2005年以来公共API的惊人增长：\n\
  \n![](img/8948f94d0abcdb1ae94d6778da518d16_45_0.png)\n\n图2.13 – 公共API可用性的上升\n\n\
  从最初的那些日子起，基于REST的公共API数量稳步增长，事实上，可以稳妥地说REST现在是最常见的Web服务类型。\n\n### JSON绑定\n\nJSON绑定是一种API规范，用于将Java对象序列化为JSON，反之亦然。JSON是一种简单的数据表示格式。它经常被用来代替XML，因为它不那么冗长。默认情况下，它支持Java默认的简单数据类型及其对应的对象类型。除此之外，还支持`java.util`包中几个与日期/时间相关的类，以及`java.time`包中的大多数类。许多集合接口（如`List`、`Map`和`Set`）及其在`java.util`包中的实现的（反）序列化也开箱即用地支持。\n\
  \n将来自RESTful调用的JSON负载绑定到其对应的对象，大部分由Java EE REST API运行时自动完成。同样，将RESTful调用的结果对象转换为JSON，也由Java\
  \ EE REST API运行时自动处理。\n\n尽管如此，在某些情况下，你可能希望自己在代码中执行这些转换——例如，通过使用众多转换选项中的任何一种来对转换过程进行更多控制。\n\
  \n默认情况下，映射是通过将JSON属性名与Java实例变量名匹配来完成的。以下JSON中的JSON `firstname`属性将映射到Java Person类中的Java\
  \ `firstname`实例变量。\n\n（反）序列化过程可以通过在类级别、实例变量级别或实例方法级别添加注解来影响。由于`@JsonProperty(\"\
  familyname\")`注解覆盖了默认映射，JSON `familyname`属性将映射到Java `name`实例变量：\n\n```\n```json\n\
  {\n  \"familyname\": \"Mc Nealy\",\n  \"firstname\": \"Scott\"\n}\n```\n\n```java\n\
  public class Person {\n    @JsonProperty(\"familyname\")\n    private String name;\n\
  \    private String firstname;\n}\n```\n```\n\nCargo Tracker应用不使用注解或自动（反）序列化。相反，它使用编程式转换，如`org.eclipse.cargotracker.interfaces.booking.rest`包中的`CargoMonitoringService`类所示。\n\
  \n### 事务\n\n业务数据的基本特性之一是完整性。如果这种完整性丧失，任何基于这些数据的决策就会变得如同行走在流沙之上。事务有助于维护数据完整性。\n\n\
  它通过两种方式做到这一点：首先，通过控制对数据的并发访问；其次，在系统故障时，将数据恢复到先前状态。事务的结果只能是两种可能之一：要么所执行的操作成功完成并执行提交（commit），要么发生了某种错误并执行回滚（rollback）。提交将持久化操作的结果——例如，将更新后的值存储到数据库中。而回滚则会恢复系统到开始事务之前的状态。\n\
  \nJava EE支持两种类型的事务管理：**容器管理事务（CMTs）**和**Bean管理事务（BMTs）**。如果EJB上未指定任何内容，则CMT是默认机制。\n\
  \n\n\n\n\n使用 CMTs 时，EJB 容器完全控制事务的启动、提交和回滚。默认情况下，容器会为 EJB 中的每个公共方法添加事务管理。如果您希望将某些公共方法排除在事务内运行之外，可以通过在方法上指定\
  \ `TransactionAttribute` 来实现。\n\n在 BMTs 中，EJB 中的代码以编程方式定义事务的边界。这意味着事务是在代码中启动、提交或回滚的。在无状态会话\
  \ bean 的方法调用中启动的事务必须在该方法完成时始终完成。\n\nCargo Tracker 应用使用 CMTs，并通过 `@Transactional`\
  \ 和 `@TransactionAttribute` 注解来配置事务管理。\n\n#### Batch\n\nJava EE 平台包含运行批处理作业的功能。这些作业可以在无需任何用户交互的情况下运行。批处理作业的示例包括财务中的月末处理、生成报告，或定期检查文件系统是否有需要处理的新文件。\n\
  \n这些批处理作业的共同点是，它们都由一个或多个需要执行的步骤组成。在 Java EE 中，批处理作业及其步骤在 XML 文件中描述。每个步骤要么是 Chunk\
  \ 要么是 Task。Chunk 步骤可以同时在多个线程中执行，而 Task 不能。\n\n将多个步骤分组在一起称为 flow。分组后，它们作为一个单元执行。可以并行执行的多个\
  \ flows 称为 split。\n\n### Summary\n\nCargo Tracker 应用内部包含大量优秀的技术。它是一个为突出 Java EE\
  \ 是构建应用的优秀框架而构建的应用。在本书中，我们将把 Cargo Tracker 应用迁移到更优秀的 Jakarta EE 框架。\n\n该应用用于预订新货物并跟踪已预订货物。跟踪视图显示货物的状态。管理界面显示状态并允许您预订和路由货物。\n\
  \n我们还介绍了 Cargo Tracker 应用中使用的一些 Java EE 技术并解释了其用法。\n"
- '# Part 2: Modern Jakarta EE


  在本部分，我们将向您展示如何现代化 Cargo Tracker 应用。掌握必要的知识后，您将学习如何将这些技术应用于需要迁移的其他应用。我们涵盖了您可以用来从
  Java EE 迁移到 Jakarta EE 的不同工具以及这些工具的工作方式。借助使用 Jakarta EE 10 的应用，我们将向您展示如何对其进行现代化并使用最佳实践使应用成为云原生，同时保持强大的测试覆盖率。


  本部分包含以下章节：


  - Chapter 3, Moving from Java EE to Jakarta EE

  - Chapter 4, Modernizing Your Application with the Latest Features

  - Chapter 5, Making Your Application Testable

  '
- "## Moving from Java EE to Jakarta EE\n\n在上一章中，您了解了 Cargo Tracker 应用的工作原理和技术细节。您现在应该对该应用的功能相当熟悉，并对底层技术有基本了解。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- Migrating namespaces\n- Migrating dependencies\n- Upgrading\
  \ your application server\n\n升级到 Jakarta EE 9 是使现有应用能够使用 Jakarta EE 规范工作的第一步。我们特意选择这种方法，因为我们从经验中了解到这是更简单的方法。一旦我们完全进入\
  \ Jakarta EE 生态系统，我们就可以开始升级到 Jakarta EE 10 中提供的新的功能。这将在下一章中介绍。\n\n### Technical\
  \ requirements\n\n您需要一些工具来迁移命名空间。其中一些工具取决于操作系统。您应选择最适合您特定情况的方法。对于每个主要操作系统：Linux、Windows\
  \ 和 macOS，都会有不止一个选项可用。\n\n这里提供的一些解决方案需要额外软件的存在：一些是开源的，一些需要付费许可证。\n\n您还需要某种编辑器或集成开发环境（IDE）来更改部分源代码。我们将由您自行选择工具。\n\
  \n### It’s all about namespaces\n\n当 Oracle 将 Java EE 转移到 Eclipse 基金会时，没有人能预见到接下来会发生什么。Eclipse\
  \ 基金会及其众多志愿者开始着手更新代码和文档，以反映从 Oracle 到 Eclipse 基金会的变更。谈判持续了数月，试图就 Jakarta EE 规范中\
  \ `javax` 包命名空间的演进达成一致。不幸的是，由于无法克服的版权问题，这一努力失败了。因此，`javax` 命名空间只能“按原样”与 Jakarta\
  \ 组件规范一起使用，这意味着任何随时间演进的规范都需要将其命名空间从 Java EE 规范更改为 Jakarta EE 规范。此外，缩写也需要更改；例如，**Enterprise\
  \ JavaBeans (EJB)** 变成了 Jakarta Enterprise Beans。\n\n版本 8 是 Java EE 规范的最后一个版本。Jakarta\
  \ EE 版本 8 完全相同，但由 Eclipse 处的源代码构建。\n\nJakarta EE 9 在功能上等于 Jakarta EE 8，但命名空间现已从\
  \ `javax` 重命名为 `jakarta`。\n\n以下是所有更改的命名空间的概述，其原始缩写以及新的命名空间和缩写。\n\n| Java EE namespace\
  \ | Jakarta EE namespace |\n| --- | --- |\n| `javax.activation` | `jakarta.activation`\
  \ |\n| `javax.annotation` | `jakarta.annotation` |\n| `javax.batch` | `jakarta.batch`\
  \ |\n| `javax.cache` | `jakarta.cache` |\n| `javax.decorator` | `jakarta.decorator`\
  \ |\n| `javax.ejb` | `jakarta.ejb` |\n| `javax.el` | `jakarta.el` |\n| `javax.enterprise`\
  \ | `jakarta.enterprise` |\n| `javax.inject` | `jakarta.inject` |\n| `javax.interceptor`\
  \ | `jakarta.interceptor` |\n| `javax.jms` | `jakarta.jms` |\n| `javax.json` | `jakarta.json`\
  \ |\n| `javax.jws` | `jakarta.jws` |\n| `javax.management` | `jakarta.management`\
  \ |\n| `javax.persistence` | `jakarta.persistence` |\n| `javax.resource` | `jakarta.resource`\
  \ |\n| `javax.security` | `jakarta.security` |\n| `javax.servlet` | `jakarta.servlet`\
  \ |\n| `javax.transaction` | `jakarta.transaction` |\n| `javax.validation` | `jakarta.validation`\
  \ |\n| `javax.websocket` | `jakarta.websocket` |\n| `javax.ws.rs` | `jakarta.ws.rs`\
  \ |\n| `javax.xml` | `jakarta.xml` |\n\n*Table 3.1 – Namespace changes*\n\n### Migrating\
  \ strategies\n\n从应用开发者的角度来看，所有这些中最痛苦的部分是命名空间已经更改。这意味着迁移到 Jakarta 涉及重构代码库中所有 Java\
  \ EE import 语句。在较小程度上，项目的 POM 文件也需要进行更改。\n\n在本节中，我们将研究三种迁移项目的方法。我们将使用以下工具进行操作：\n\
  \n- An open source multiplatform editor\n- The sed command line tool\n- A specialized\
  \ plugin for your IDE\n\n但在这样做之前，最好先在 Git 中创建一个新分支，其中将包含我们更新后的源代码。\n\n在 cargotracker\
  \ 目录内输入以下命令：\n\n```\ngit checkout -b jakarta-ee9\n```\n\nGit 将回复消息 `Switched to\
  \ a new branch 'jakarta-ee9'`。\n\n如果您想立即将此新本地分支推送到远程服务器，可以通过输入以下命令来实现：\n\n```\n\
  git push -u origin jakarta-ee9:jakarta-ee9\n```\n\n您可能更喜欢先进行必要的更改，然后再提交和推送。在这种情况下，您现在可以跳过立即将新分支推送到远程服务器。\n\
  \n\n\n\n\n### 使用跨平台开源编辑器\n\n此转换选项可在所有主要操作系统上运行。我们使用的是开源编辑器 Sublime Text，可从 `https://www.sublimetext.com/`\
  \ 下载。\n\n编辑器具有 **Find in Files** 选项，可递归搜索目录树中指定文件组中的特定文本。\n\n启动编辑器，从 **Find** 下拉菜单中选择\
  \ **Find in files…**，然后执行以下步骤或输入 *Figure 3.1* 中显示的信息：\n\n1. 在 **Find** 文本字段中输入 `javax.activation`。\n\
  2. 按下位于 Find 和 Replace 之间的按钮 …。\n3. 选择 **Add Folder**。\n4. 从选择对话框中选择您的 cargo tracker\
  \ 根目录。\n5. 再次按下按钮 …。\n6. 选择 **Add Include Filter**。\n7. 文本 `*.txt` 将插入到 **Where**\
  \ 文本字段中。\n8. 将 `*.txt` 改为 `*.java`。\n9. 在 **Replace** 文本字段中，输入 `jakarta.activation`。\n\
  \n![](img/8948f94d0abcdb1ae94d6778da518d16_54_0.png)\n\n如果现在按下 **Find** 按钮，编辑器将打开一个文档，列出所有\
  \ `javax.activation` 的出现位置。它在 9 个不同文件中出现了 10 处。\n\n再次打开 **Find in Files** 对话框并按下\
  \ **Replace** 按钮，这次会先询问您是否要在 9 个文件中替换这 10 处出现。按下 **Yes** 将应用更改。\n\n虽然此更改很容易，但它要求您为\
  \ *Table 3.1* 中的每一行输入值，并且对您想要迁移的每个项目都要这样做。如果您运行的是 Linux 或 macOS，下一个选项会更吸引您。\n\n\
  请注意，此迁移选项可从您喜爱的 IDE 内使用。\n\n#### Sed\n\nSed 是 Linux 和 macOS 操作系统上的标准工具。此流编辑器在 Windows\
  \ 平台上不可用。如果您使用的是 Windows 操作系统，建议您使用其他两种转换选项之一。\n\n以下代码是用于自动替换 Java EE 命名空间使用为 Jakarta\
  \ EE 命名空间的小型 Bash 脚本的源代码。它由一个包含旧命名空间和新命名空间以逗号分隔列表的文本文件驱动。然后它告诉 sed 从当前目录开始递归遍历目录树，并在每个\
  \ Java 扩展名的文件上执行替换：\n\n```\n#!/bin/bash\ninput=\"./jee-jakartaee.txt\"\nwhile IFS=\
  \ read -r line\ndo\n  IFS=',' read -r -a array <<< \"$line\"\n  sed -i -e \"s/${array[0]}/${array[1]}/g\"\
  \ $(find ./ -name *.java)\ndone < \"$input\"\n```\n\n需要牢记两点。首先，最好将此脚本放在 cargotracker\
  \ 目录的根目录中。其次，jee-jakartaee.txt 输入文件需要在同一目录中。两者均可从本书附带的 GitHub 项目下载——更准确地说，在这里：https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE。\n\
  \n#### 使用 IDE 的专用插件\n\n到目前为止，您已经看到了迁移源代码的两种选项。我们现在将展示第三种选项——可从 IDE 获得的选项。在此情况下，我们谈论的是\
  \ IntelliJ Ultimate Edition。重构是现代 IDE 中的常见功能，IntelliJ 也不例外。事实上，此迁移选项让您可以非常具体地触发想要转换的内容以及不转换的内容。更方便的是，它预定义了\
  \ Java EE 到 Jakarta EE 的迁移。\n\n您需要在 IntelliJ 中导入并打开项目。然后，执行以下步骤：\n\n1. 选择 Refactor\
  \ 菜单选项。\n2. 从下拉菜单中选择 Migrate Packages and Classes。\n3. 选择 Java EE to Jakarta EE。\n\
  \n会出现以下对话框：\n\n4. 选择 Whole project 选项。\n5. 按下 Run 按钮。\n\nIntelliJ 将按包名分组显示所有出现的位置。您可以通过单击对话框中显示的树来检查更改。\n\
  \n*Figure 3.2 – Migration dialog in IntelliJ*\n\n*Figure 3.3 – Overview of files\
  \ to migrate*\n\n6. 最后，按下 Do Refactor 以应用更改。\n\n完成后，编辑器将报告已更改 308 处出现。\n\n虽然 IntelliJ\
  \ Ultimate 在更改导入的命名空间方面做得很好，但它无法识别 Strings 和 XML 文件中内部的 javax 用法。为修复此缺陷，我们必须手动修复一些文件或使用前面的一种方法。\n\
  \nRejectedRegistrationAttemptsConsumer、MisdirectedCargoConsumer、HandlingEventRegistrationAttemptConsumer、DeliveredCargoConsumer\
  \ 和 CargoHandledConsumer 都使用了一个在属性值中使用名称 javax 的注解。此注解如下所示：\n\n```\n@ActivationConfigProperty(propertyName\
  \ = \"destinationType\", propertyValue = \"javax.jms.Queue\")\n```\n\n由于 propertyValue\
  \ 中存在 javax，此激活配置将无法工作。为修复此问题，将注解更改为以下示例，该示例使用 jakarta：\n\n```\n@ActivationConfigProperty(propertyName\
  \ = \"destinationType\", propertyValue = \"jakarta.jms.Queue\")\n```\n\n我们还需要在 web.xml\
  \ 中进行更改，因为 IntelliJ 未对该文件进行任何更改。在 web.xml 文件中，javax 名称用于 javax.faces 上下文参数。在 web.xml\
  \ 文件的顶部部分，您可以看到正在使用 javax 命名空间。它如下所示：\n\n```xml\n<context-param>\n    <param-name>javax.faces.PROJECT_STAGE</param-name>\n\
  \    <param-value>Development</param-value>\n</context-param>\n<context-param>\n\
  \    <param-name>javax.faces.CLIENT_WINDOW_MODE</param-name>\n    <param-value>url</param-value>\n\
  </context-param>\n```\n\n这些上下文参数也需要更改为新的 jakarta 命名空间。为此，您需要将类路径中的 javax 部分替换为 jakarta。结果如下所示：\n\
  \n```xml\n<context-param>\n    <param-name>jakarta.faces.PROJECT_STAGE</param-name>\n\
  \    <param-value>Development</param-value>\n</context-param>\n<context-param>\n\
  \    <param-name>jakarta.faces.CLIENT_WINDOW_MODE</param-name>\n    <param-value>url</param-value>\n\
  </context-param>\n```\n\n完成这些更改后，`javax` 名称将在整个项目中被替换为 `jakarta`。最后要做的事情是在再次运行项目之前升级\
  \ POM 文件和依赖项。\n\n### 升级您的 pom.xml 文件\n\n我们还需要对代码库应用一个更改。我们需要告诉它现在正在使用 Jakarta EE\
  \ 9 API。这是通过更新 `pom.xml` 文件中的依赖项来完成的。\n\n打开 `pom.xml` 文件并找到依赖项部分。它应如下所示：\n\n```xml\n\
  <dependency>\n    <groupId>javax</groupId>\n    <artifactId>javaee-api</artifactId>\n\
  \    <version>${javaee_api.version}</version>\n    <scope>provided</scope>\n</dependency>\n\
  ```\n\n现在，将其更改为以下内容：\n\n```xml\n<dependency>\n    <groupId>jakarta.platform</groupId>\n\
  \    <artifactId>jakarta.jakartaee-api</artifactId>\n    <version>9.0.0</version>\n\
  \    <scope>provided</scope>\n</dependency>\n```\n\n您现在已告诉 Maven 它应使用新的 Jakarta\
  \ EE 9 依赖项。\n\n现在，继续通过调用 `mvn clean install` 重新构建应用程序。\n\n### 迁移依赖项\n\n随着从 **Java\
  \ EE** 到 **Jakarta EE** 命名空间的迁移，我们需要更新项目使用的三个依赖项。在本节中，我们将了解如何升级项目的 Java 版本、**Payara**\
  \ 应用服务器以及 **PrimeFaces** 依赖项。\n\n#### 升级项目\n\n要更改 Maven 使用的 Java 版本，我们需要在 `pom.xml`\
  \ 文件中进行两次更改。在项目目录根目录中的 `pom.xml` 文件中，您可以找到 cargo tracker 应用程序的源和目标 Maven 使用。\n\n\
  目前，项目使用 Java 7 版本，并且在 pom.xml 文件中，您可以找到以下两行来确认这一点：\n\n```\n<maven.compiler.source>1.7</maven.compiler.source>\n\
  <maven.compiler.target>1.7</maven.compiler.target>\n```\n\n我们将 cargo tracker 应用程序升级到当前可用的最新长期支持\
  \ LTS 版本的 Java，即 17。要升级项目，请将 1.7 替换为 17，使其如下所示：\n\n```\n<maven.compiler.source>17</maven.compiler.source>\n\
  <maven.compiler.target>17</maven.compiler.target>\n```\n\n重要的是，您现在还应更改在第 2 章中设置的\
  \ JAVA_HOME 系统变量。在继续之前，下载 Java 17 SDK 并将其设置为 JAVA_HOME 系统变量。如果不这样做，项目将无法编译。\n\n\
  接下来是升级 Payara 应用服务器到最新版本。升级 Payara 需要两个步骤。我们需要将 Cargo 插件升级到支持 Payara 版本 6 的版本，并需要将\
  \ Payara 从 4 升级到 6。\n\n要升级 Cargo，我们需要将版本号从 1.8.1 更改为 1.10.5。为此，请更改以下行：\n\n```\n\
  <cargo.version>1.8.1</cargo.version>\n```\n\n结果应如下所示：\n\n```\n<cargo.version>1.10.5</cargo.version>\n\
  ```\n\n#### 升级 Payara 应用服务器\n\n我们已在 pom.xml 文件底部更改了 cargo 插件的版本。下一步是更改 Payara 容器\
  \ ID 和下载 URI。我们正从 Payara 4 迁移到 6；为此，请更改以下行：\n\n```\n<cargo.payara.container_id>glassfish4x</cargo.payara.container_id>\n\
  <cargo.payara.download_uri>https://repo1.maven.org/maven2/fish/payara/distributions/payara/6.2023.2/payara-6.2023.2.zip</cargo.payara.download_uri>\n\
  ```\n\n将其更改为如下示例：\n\n```\n<cargo.payara.container_id>glassfish6x</cargo.payara.container_id>\n\
  <cargo.payara.download_uri>https://repo1.maven.org/maven2/fish/payara/distributions/payara/6.2023.2/payara-6.2023.2.zip</cargo.payara.download_uri>\n\
  ```\n\n\n\n\n\n`glassfish6x` 容器 ID 告诉 Cargo 插件我们想要使用哪个版本的 Payara。Cargo 使用下载 URI\
  \ 来下载 Payara 的一个版本。为了完成 Cargo 的升级，我们需要更新插件内部定义的 artifact ID。在 `pom.xml` 文件底部，你会找到\
  \ Cargo 插件。我们需要获取这个 artifact ID：\n\n```\n<artifactId>cargo-maven2-plugin</artifactId>\n\
  ```\n\n并且我们需要将其更改为以下内容：\n\n```\n<artifactId>cargo-maven3-plugin</artifactId>\n```\n\
  \n这就完成了 Payara 和 Cargo 升级到最新版本。\n\nCargo 跟踪器使用 **Derby** 作为内存数据库来存储货物信息，但如果我们想要使用\
  \ Payara 6，则不再可能。Payara 已出于若干原因用 **H2** 替换了 Derby。这意味着我们必须更改 `web.xml` 文件中的数据源。\n\
  \n在 `web.xml` 中，我们需要将如下所示的数据源替换为使用 H2 的数据源：\n\n```xml\n<data-source>\n    <name>java:app/jdbc/CargoTrackerDatabase</name>\n\
  \    <class-name>org.apache.derby.jdbc.EmbeddedDriver</class-name>\n    <url>jdbc:derby:${webapp.databaseTempDir}/cargo-tracker-database;create=true</url>\n\
  </data-source>\n```\n\n要使用 H2，我们需要将类名替换为告诉 Payara 用于连接数据库的驱动程序。URL 告诉 Payara 数据库的位置，而\
  \ `:mem:` 告诉 H2 我们想要使用内存数据库。最后一个参数是 H2 需要创建的数据库的名称：\n\n```xml\n<data-source>\n \
  \   <name>java:app/jdbc/CargoTrackerDatabase</name>\n    <class-name>org.h2.Driver</class-name>\n\
  \    <url>jdbc:h2:mem:cargo-tracker-database</url>\n</data-source>\n```\n\n### 升级\
  \ PrimeFaces\n\n我们需要升级的最后一个依赖项是 **PrimeFaces**。此升级也包含两个步骤：升级依赖项到最新版本并更改 PrimeFaces\
  \ 主题，因为项目使用的主题不再受支持。\n\n要升级 primefaces 依赖项，我们需要更改版本并添加一个 classifier。\n\n当前的 primefaces\
  \ 依赖项如下所示：\n\n```xml\n<dependency>\n    <groupId>org.primefaces</groupId>\n    <artifactId>primefaces</artifactId>\n\
  \    <version>8.0</version>\n</dependency>\n```\n\n升级后，它应如下所示示例。我们将版本更改为 10.0.0\
  \ 并添加了 `jakarta` classifier：\n\n```xml\n<dependency>\n    <groupId>org.primefaces</groupId>\n\
  \    <artifactId>primefaces</artifactId>\n    <version>10.0.0</version>\n    <classifier>jakarta</classifier>\n\
  </dependency>\n```\n\n如前所述，我们需要更改主题。为此，请转到 `web.xml` 文件并在文件顶部查找以下行：\n\n```xml\n\
  <context-param>\n    <param-name>primefaces.THEME</param-name>\n    <param-value>omega</param-value>\n\
  </context-param>\n```\n\n`param-value` 告诉 PrimeFaces 我们想要为项目使用 omega 主题。此主题与 PrimeFaces\
  \ 10 版本不兼容。要切换到不同的主题，请将之前的代码行更改为以下内容：\n\n```xml\n<context-param>\n    <param-name>primefaces.THEME</param-name>\n\
  \    <param-value>saga</param-value>\n</context-param>\n```\n\n执行完最后一步后，我们完成了从 `javax`\
  \ 到 `jakarta` 的迁移。现在你可以使用 `mvn clean` 和 `mvn package cargo:run` 运行 Cargo 跟踪器应用程序，使用\
  \ Jakarta EE 在 Payara 6 上运行。\n\n### Red Hat MTA\n\n**MTA**，即 **Migration Toolkit\
  \ for Applications**，可以自动将你的 Java EE 项目转换为 Jakarta EE。它通过应用一组特定的规则来实现。MTA 是一个非常全面的产品。转换可以通过以下方式完成：\n\
  \n- 用户界面\n- 命令行工具\n- OpenShift 操作符\n- IDE 插件\n\n在使用 MTA 之前，你需要 [下载](https://developers.redhat.com/products/mtr/download)\
  \ 并安装它。有关安装说明，我们请你参考 [官方文档](https://access.redhat.com/documentation/en-us/migration_toolkit_for_applications/6.2/html/cli_guide/index?extIdCarryOver=true&sc_cid=701f2000001Css5AAC)。你应该安装命令行工具，因为它们是在你的机器上执行迁移时需要使用的工具。\n\
  \n一旦你安装了命令行工具，就可以开始迁移了。我们再次使用 IntelliJ 插件来执行迁移。你需要从插件页面安装 MTA 插件：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_62_0.png)\n\
  \n图 3.4 – MTA 插件安装屏幕\n\n插件安装后，你的 UI 中会出现一个新标签页，标签为 **Migration Toolkit for Applications**。请按以下步骤操作：\n\
  \n1. 点击该标签。\n\n   列表中应该有一个默认的配置条目。如果没有，请右键单击并选择 **New Configuration**。你的屏幕现在应如下所示：\n\
  \n   ![](img/8948f94d0abcdb1ae94d6778da518d16_63_0.png)\n\n   图 3.5 – MTA 插件中的配置条目\n\
  \n2. 双击配置。\n3. 按以下图所示输入信息（注意我们在底部选择了 **Windup Configuration**）。\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_64_0.png)\n\
  \n   图 3.6 – MTA 的配置详情\n\n4. 确保你输入了安装 MTA 命令行工具的位置。\n5. 关闭配置。\n6. 返回配置列表，你现在可以选中刚刚修改的配置，右键单击它并选择\
  \ Run Analysis：\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_64_1.png)\n\n   图\
  \ 3.7 – Run Analysis 弹出菜单选项\n\n7. 分析完成后，左面板中的配置将更新为报告和结果部分。\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_65_0.png)\n\
  \n   图 3.8 – 迁移报告概览\n\n8. 点击报告以进入迁移报告。接下来，点击 `cargotracker-javaee7`。\n9. 你将看到项目工件的摘要、检测到的事件类型，甚至应用更改所需故事点的估计。\n\
  \n   ![](img/8948f94d0abcdb1ae94d6778da518d16_65_1.png)\n\n   图 3.9 – MTA 仪表板主屏幕\n\
  \n请注意，顶部还有多个标签可以提供有关应用程序的出色信息，例如此处显示的 **Technologies** 屏幕：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_66_0.png)\n\
  \n图 3.10 – MTA Technologies 概览屏幕\n\n但并不止于此。如果你在 `-input` 参数中指定的 IntelliJ 工作区上执行了分析，它将向你显示在源代码中发现的所有事件。\n\
  \n![](img/8948f94d0abcdb1ae94d6778da518d16_66_1.png)\n\n图 3.11 – 与源文件相关的事件视图\n\n\
  如果可以应用快速修复，你可以通过右键单击事件并选择 Apply All Quickfixes 来执行此操作。\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_67_0.png)\n\
  \n快速修复可以应用于单个事件、文件中的所有事件，或更高级别。\n\n### 升级你的应用程序服务器\n\n现在，你已将源代码升级到 Jakarta 命名空间并更新了依赖项。你还升级到了较新版本的应用程序服务器。\n\
  \n如果你在项目中使用与 Payara 不同的应用程序服务器，可以使用本节中的信息来选择要使用的应用程序服务器的正确版本。\n\nJakarta EE 9 有两个版本：Jakarta\
  \ EE 9 和 Jakarta EE 9.1。两者之间没有功能差异；它们不包含独特的功能。然而，由于迁移工作量巨大，因此决定仅在 Jakarta EE 9.1\
  \ 中引入对 Java 11 的兼容性。因此，如果你计划在 Java 8 上运行应用程序服务器，Jakarta EE 9 服务器就足够了；否则，请在 Java\
  \ 11 及更高版本上使用 Jakarta EE 9.1。\n\n下表列出了一些更常见的应用程序服务器。\n\n| 应用程序服务器 | Jakarta EE 9\
  \ 兼容 | Jakarta EE 9.1 兼容 |\n|---|---|---|\n| Eclipse GlassFish | 6.0 | 6.1 |\n|\
  \ Open Liberty | 21.0.0.12 | 21.0.0.12 |\n| WildFly | 23.0.2 | 25.0.0 |\n| Payara\
  \ Enterprise Server | 6.2021.1 | 6.2021.1 |\n| IBM WebSphere Liberty | 21.0.0.12\
  \ | 21.0.0.12 |\n\n表 3.2 – Jakarta EE 9 兼容应用程序服务器\n\n\n\n\n\n### Summary\n\n在本章中，你学习了如何将\
  \ Cargo Tracker 应用从 Java EE 迁移到 Jakarta EE。你学习了多种迁移代码的方法。你还学习了如何升级应用的依赖项。最后，你学习了应为运行\
  \ Cargo Tracker 应用以及你自己的应用选择哪个应用服务器版本。\n\n这些步骤对于我们将在下一章中介绍的内容至关重要，即升级应用以利用 Jakarta\
  \ EE 10 提供的全新功能。\n"
- "## Modernizing Your Application with the Latest Features\n### \n\n你正在迁移的应用，在我们的例子中是\
  \ Cargo Tracker 应用，近年来并未进行重大升级，这导致它错过了许多新功能，并且没有使用云所提供的功能，例如监控和扩展。在本章中，我们将专注于 Jakarta\
  \ EE 10 以及如何将应用升级到云原生标准。在本章中，你将使你的应用现代化，使其能够在云中运行，同时使用 Jakarta EE 10 的最新功能。\n\n\
  在本章中，我们将涵盖以下主题：\n\n- Jakarta EE 10 所做的最重要更改\n- 添加第一个云原生功能 – 弹性\n- 添加第二个云原生功能 – 监控\n\
  - 使用 Prometheus 和 Grafana 可视化监控过程\n\n完成本章后，你将能够将应用升级为可使用云以及 Jakarta EE 10 最新功能的应用。你还将知道如何监控应用的健康状况。这将使你能够跟上\
  \ Jakarta EE 的最新版本。\n\n### Technical requirements\n\n要跟上本章的学习，你需要完成过 *Chapter 3*。对于本章而言，拥有一个运行在\
  \ Jakarta EE 10 或更新版本上但尚未使用新功能的应用是很重要的。\n\n## The most significant changes to Jakarta\
  \ EE 10\n\nJakarta EE 10 是加入 Eclipse 基金会以来首次增加功能的 Jakarta EE 版本。在本节中，我们将介绍所做的最有意义的更改。它绝不是对所有更改的详尽概述。我们也不会将这些更改应用到现有的\
  \ Cargo Tracker 应用。进行这些更改将非常依赖于具体用例，例如设置不同的身份验证机制或更改主键。\n\n### Core Profile\n\n\
  我们已经指出，增加 Core Profile 是主要功能之一。该配置文件针对较小的应用，例如微服务。事实上，根据官方文档，它针对的是现代云应用，重点是一个最小的\
  \ API 集合，支持微服务，并侧重于启用使用即时编译 AOT 编译构建的实现，以最小化启动时间和内存占用。\n\n这是一个相当长的句子，为了完全理解它的含义，我们将对其进行分解。它针对较小的应用。这是一个有趣的观察。在关于\
  \ Java EE/Jakarta EE 历史的章节中，你读到原始的配置文件针对两种类型的实现：Web 服务器和应用服务器。Web 配置文件针对的是不使用许多规范的较小应用，而由应用服务器实现的完整配置文件则针对更大、更复杂的应用。这些完整配置文件实现为部署在这些服务器上的应用提供各种功能：EJB、安全、事务管理、JNDI\
  \ 等。这与核心配置文件形成对比，后者针对的是不使用太多 Jakarta 规范的非常精确的微服务。\n\n转向较小的应用与这些完整配置文件实现形成对比。但它与当前软件架构的趋势一致，即单体应用被拆分为较小的应用。因此，Jakarta\
  \ EE 希望成为一个允许微服务的平台。\n\n它允许创建现代、云原生的应用。我们已经看到云原生应用都是关于什么的。为了实现这种云原生性，可以使用 Jakarta\
  \ EE 和 Micro Profile，因为它们彼此互补。\n\n专注于支持微服务的最小 API 集合。在 Core Profile 出现之前，我们使用 Web\
  \ Profile 来创建微服务。但与 Web Profile 不同，Core Profile 只要求有七个规范可用：\n\n- Jakarta Annotations\n\
  - Jakarta CDI Lite\n- Jakarta Dependency Injection\n- Jakarta Interceptors\n- Jakarta\
  \ JSON Processing\n- Jakarta JSON Binding\n- Jakarta RESTful Web Services\n\n仅有七个需要实现的规范的另一个好处是，它使得创建符合\
  \ Jakarta EE 10 core profile 规范的有效应用服务器变得更容易。这使得社区能够创建更适合其用例的应用服务器。\n\n然后，重点是启用使用\
  \ AOT 编译的实现。这与 Java 运行时默认使用的正常 JIT 编译过程大不相同。\n\n通常，Java 文件在执行代码之前被编译成类文件。在代码执行期间，**Java\
  \ Virtual Machine (JVM)** 将字节码翻译成平台特定的机器码。为此，它内置了两个编译器，名为 C1 和 C2。C1 快速生成未优化的机器码。在某个时刻，方法执行计数阈值可能会被通过，然后\
  \ JVM 决定是时候优化生成的机器码了。这就是 C2 编译器发挥作用的地方。它生成代码所需的时间更长，但生成的机器码高度优化。\n\n重要的是要记住，所有这些编译都是在应用执行期间完成的。\n\
  \n另一方面，AOT 编译是在应用执行之前进行的。在一个复杂且耗时的过程中，AOT 编译器将遍历每一种可能的执行路径并生成所需的机器码。这有几个优点：\n\n\
  - 运行应用时无需完整的 JVM\n- 应用已处于二进制格式，因此在运行时无需花费时间进行编译\n- 所有类在启动时已知，因此无需扫描 JAR/WAR/EAR\
  \ 文件\n- 优化的内存消耗\n- 快速启动时间，因为所有需要启动的内容都是预先知道的\n\n与许多事情一样，AOT 并非免费。最显著的缺点如下：\n\n-\
  \ 极长的编译时间\n- 动态类加载的能力丢失\n- 生成的二进制文件针对特定平台，失去了编写一次到处运行的理念\n- 你失去了像 C2 编译器那样在运行时优化代码执行的能力\n\
  \n目前最著名的 AOT 编译器是来自 Oracle 的 GraalVM。它有开源和许可两种版本。虽然前者提供最多的功能，但后者附带支持并且更优化。\n\n####\
  \ Using UUIDs as keys\n\n在了解如何使用 **Universally Unique Identifiers (UUIDs)** 之前，我们应该定义它们是什么以及为什么你会想使用它们。UUID\
  \ 用于唯一标识对象或实体。它们在 RFC-4122 中定义。\n\nUUID 有几种不同的类型：\n\n- **Type 1:** 基于日期时间 and MAC\
  \ 地址\n- **Type 2:** 基于日期时间、MAC 地址和 **Distributed Computing Environment (DCE)**\n\
  - **Type 3:** 命名空间和名称的 MD5 哈希\n- **Type 4:** 随机生成的数字\n- **Type 5:** 命名空间和名称的 SHA-1\
  \ 哈希\n\n尽管其名称暗示它们总是唯一的，但存在重复值的可能性。尽管因类型而异，但总体可能性极低，可以安全地忽略。\n\nJakarta Persistence\
  \ 现在可以使用 UUID 作为键值。UUID 主要是唯一值。这使它们可用于需要唯一性的键的值。虽然可能出现重复，并且根据所选的 UUID 类型这种可能性可能更高，但在实践中发生的可能性极低。\n\
  \n考虑以下代码，它正是这样做的：\n\n```\n```java\n@Entity\npublic class Vehicle {\n    @Id\n  \
  \  @GeneratedValue(strategy = GenerationType.UUID)\n    private UUID id;\n    private\
  \ String license;\n    private String type;\n}\n```\n```\n\nVehicle 类的 ID 是 java.util.UUID\
  \ 类型。由 GenerationType.UUID 生成的 UUID 是一个 rfc-4122 兼容的 UUID。\n\n### Multi-part form\
  \ parameters\n\n多部分表单数据对于上传大量数据很有用，例如图片或文件的内容。\n\n虽然这对于应用来说是很常见的行为，但 Jakarta EE\
  \ 目前没有为此提供标准解决方案。通常，开发人员不得不依赖来自其应用服务器供应商的不可移植实现。\n\n\n\n\n\n最后，在 Jakarta EE 10 中，多部分表单参数开箱即用地得到支持：\n\
  \n```\n@POST\n@Path(\"upload/picture\")\n@Consumes(MediaType.MULTIPART_FORM_DATA)\n\
  public Response postImage(@FormParam(\"userId\") String memberId, @FormParam(\"\
  image\") EntityPart image) {\n    String fileName = image.getFileName().orElseThrow(NotSupportedException::new);\n\
  \    InputStream content = image.getContent();\n    return Response.ok(\"image is\
  \ uploaded\").build();\n}\n```\n\n我们需要定义该端点消费 MULTIPART_FORM_DATA。接下来，我们需要定义要注入到变量中的各个表单参数的内容。在前面的代码中，EntityPart\
  \ 将保存包含图像数据的流。尽管这里可以使用字符串，但更明智且更具可扩展性的解决方案是使用输入流来读取数据，以防止图像内容一次性加载到方法中。\n\n### 纯\
  \ Java Jakarta Faces 视图\n\n没错，你读对了！如果你想以编程方式组合你的 Jakarta Faces 视图，现在你可以了。你可以跳过所有脚本部分，只使用\
  \ Java 代码。\n\n这样做有各种优势。在动态构建视图时，你只需遍历 Java 类并为每个字段按需创建组件。如果你想从视图中排除某些字段，可以在 Java\
  \ 中编写执行此操作的条件。最后，事件处理程序可以是简单的 Java Lambda——无需通过 EL 表达式使用方法引用。\n\n如果你以前使用 Java SE\
  \ 编写过 Swing 代码，那么下面的示例可能看起来非常熟悉：\n\n```\nHtmlForm form = components.create(HtmlForm.COMPONENT_TYPE);\n\
  body.getChildren().add(form);\n\nHtmlOutputText message = components.create(HtmlOutputText.COMPONENT_TYPE);\n\
  form.getChildren().add(message);\n\nHtmlCommandButton actionButton = components.create(HtmlCommandButton.COMPONENT_TYPE);\n\
  actionButton.addActionListener(\n    e -> message.setValue(\"I was pressed\"));\n\
  actionButton.setValue(\"Press\");\nform.getChildren().add(actionButton);\n```\n\n\
  在这里，我们在代码中创建了一个简单的 HTML 表单。我们向表单添加了一个 HtmlOutputText 组件。最后，我们创建并添加了一个 HtmlCommandButton\
  \ 组件。按钮的 action listener 方法接收一个 Lambda，当按钮被按下时会执行该 Lambda。\n\n### 使用 OpenID 进行身份验证\n\
  \n你在应用程序中如何处理用户身份验证？最常见的方式是提供一个专用的登录，使用用户名和密码。一旦输入，你的应用程序就会尝试将用户与本地数据库或 LDAP 中可用的信息进行身份验证。\n\
  \n然而，用户并不总是希望为每个想要访问的新站点创建新账户。这就是 OpenID 的用武之地。想象一下，你有一个 Google 账户。访问站点 A 时，你指定想要使用你的\
  \ Google 凭据登录。站点 A 本身没有任何了解或验证你的 Google 凭据的能力。因此，它将身份验证中继到 google.com。一旦 Google\
  \ 确定你声称自己是谁，此信息就会返回给站点 A。\n\n随着使用 OpenID 进行身份验证变得越来越普遍，Jakarta Security 现在通过一组注解支持\
  \ OpenID。让我们看一个示例：\n\n```\n@OpenIdAuthenticationDefinition(\nproviderURI = \"https://accounts.google.com\"\
  ,\nclientId = \"${config.clientId}\",\nclientSecret = \"${config.clientSecret}\"\
  ,\nredirectURI = \"${baseURL}/callback\",\n)\n@ApplicationScoped\npublic class GoogleOpenIdSecurityBean\
  \ {\n}\n```\n\n@OpenIdAuthenticationDefinition 接受多个可配置参数。providerUri 指向 OpenId 提供者——即执行实际身份验证的参与者。clientId\
  \ 和 clientSecret 告知提供者它正在为谁进行身份验证。最后，redirectUri 包含提供者在身份验证完成后返回到你的应用程序的回调端点。\n\n\
  ### 改进的并发\n\nJakarta concurrency 在版本 10 中有大量更改。其中两个最值得注意的是 @Asynchronous 注解的引入以及能够配置\
  \ ManagedExecutorService。\n\n虽然该注解可通过 Jakarta Enterprise Beans 规范获得，但新注解有几个明显的优势。首先，EJB\
  \ 需要完整的 Jakarta EE 配置文件才能工作——例如在 Core Profile 中不可用。\n\n其次，旧注解使用来自应用程序服务器的默认线程池，而新版本允许你指定要使用的线程池，如果你不想使用默认线程池的话。这可能带来巨大的好处，因为它允许你为某些任务组使用专用线程池。\n\
  \n这里有一个示例：\n\n```\n```java\npublic class PaymentService {\n    @Asynchronous(executor\
  \ = \"java:app/concurrent/OrderExecutorService\")\n    public CompletableFuture<OrderStatus>\
  \ processOrder\n        (final Order order) {\n        try {\n            var status\
  \ = processAvailability(order);\n            return CompletableFuture.completedFuture(status);\n\
  \        } catch (OrderProcessingException ex) {\n            throw new CompletionException(ex);\n\
  \        }\n    }\n}\n```\n```\n\n我们只需用 @Synchronous 注解该方法，并可选择指定要使用的执行器服务。\n\n\
  ## 添加第一个云原生特性——弹性\n\n从技术角度来看，为你的系统添加弹性并不困难。真正的挑战在于决定在哪里为代码添加弹性以及添加哪种类型的弹性。为了为代码添加弹性，我们将使用\
  \ MicroProfile，因为它非常适合 Jakarta EE 应用程序。\n\n你可以通过向 pom.xml 文件添加以下条目来添加 MicroProfile：\n\
  \n```\n```xml\n<dependency>\n    <groupId>org.eclipse.microprofile</groupId>\n \
  \   <artifactId>microprofile</artifactId>\n    <version>5.0</version>\n    <type>pom</type>\n\
  \    <scope>provided</scope>\n</dependency>\n```\n```\n\n通过将此 xml 添加到你的 pom.xml\
  \ 文件中，你就可以在应用程序中使用 MicroProfile。\n\n接下来，执行构建和启动应用程序的标准步骤。它们现在应该不再让你感到惊讶了。\n\n对于\
  \ CargoTracker 应用程序，你需要运行以下命令：\n\n- `mvn clean install`\n- `mvn cargo:run`\n\n在应用程序中可以使用\
  \ MicroProfile 后，我们可以使用以下选项为应用程序添加弹性：\n\n- `@Timeout`\n- `@Retry`\n- `@Fallback`\n\
  - `@Bulkhead`\n- `@CircuitBreaker`\n- `@Asynchronous`\n\n如前所述，@Asynchronous 是一个特例，因此此处不予处理。我们将在此处提供其他弹性方法的示例。\n\
  \n@Timeout 是一种弹性方法，我们希望将其添加到对可能花费很长时间的操作或其他系统的调用中。为了防止系统变得无响应，我们可以限制操作运行的时间，在此之后将其切断。\n\
  \n在我们的代码中使用 @Timeout 选项的理想位置是图遍历代码。它位于 ExternalRoutingService 类中。在那里，fetchRoutesForSpecification\
  \ 方法执行 web 客户端调用以检索路由规范。\n\n从技术上讲，外部系统可能响应缓慢，甚至更糟，无法使用。\n\n为了限制这对我们系统的影响，我们可以添加\
  \ @Timeout 注解。代码现在看起来像这样：\n\n```\n```java\n@Timeout(value = 2000)\npublic List<Itinerary>\
  \ fetchRoutesForSpecification(RouteSpecification\nrouteSpecification) {\n```\n```\n\
  \n如果对外部系统的调用失败，现在由于你添加的注解，它会尽早失败。但如果它失败了，你难道不想重试吗？毕竟，这可能只是导致此问题的简单网络故障。它可能是一个可恢复的错误。\n\
  \n为了支持重试，我们需要添加以下代码。它将使我们在重试之间等待 250 毫秒，并且它只会重试两次，而不是默认的 3 次：\n\n```\n```java\n\
  @Timeout(value = 2000)\n@Retry(maxRetries = 2, delay = 250)\npublic List<Itinerary>\
  \ fetchRoutesForSpecification(RouteSpecification\nrouteSpecification) {\n```\n\n\
  \n\n\n\nCargo Tracker 提供了更改目的地的功能。这将在 `changeDestination` 屏幕上完成。`.xhtml` 文件由一个名为\
  \ `ChangeDestination` 的 `@Named` 后备 bean 支持。它为用户提供了一个下拉菜单来选择新位置的名称。该下拉菜单由一个名为 `potentialDestinations`\
  \ 的位置列表支持。此列表在 bean 初始化期间加载。它通过 `BookingServiceFacade` 的 `listShippingLocations`\
  \ 获取位置。此方法通过查询数据库来实际加载。\n\n呼——这可真是相当曲折的一段旅程！它向我们展示了事情会变得多么复杂，尤其是对于 Cargo Tracker\
  \ 这样的应用程序，该应用程序是考虑到 **领域驱动设计 (DDD)** 而设置的，并且应用程序的不同架构层之间有明确的区分。\n\n无论如何，如果由于某种原因（是的，网络，我们在看你！）无法检索所需的值，提供一个默认响应会很好。让我们诚实一点——一个空的位置列表仍然比向用户报告一些奇怪的错误要好。\n\
  \n我们将通过 `@Fallback` 为 `listShippingLocations` 注解一个默认响应。\n\n请看以下代码：\n\n```java\n\
  @Override\n@Fallback(fallbackMethod = \"shippingLocationsFallback\")\npublic List<org.eclipse.cargotracker.interfaces.booking.facade.dto.Location>\
  \ listShippingLocations() {\n```\n\n请注意，任何导致 `listShippingLocations` 抛出异常的情况都会触发\
  \ fallback 方法。您可以使用 `applyOn` 和 `skipOn` 参数配置此行为。\n\n接下来，我们需要为 `fallbackMethod`\
  \ 参数中指定的方法提供实现。\n\n它看起来像这样：\n\n```java\nprivate List<org.eclipse.cargotracker.interfaces.booking.facade.dto.Location>\
  \ listShippingLocationsFallback() {\n    return List.of();\n}\n```\n\n请注意，fallback\
  \ 方法可以是私有的，并且在大多数情况下，它应该是私有的，以防止其他类对该方法进行不必要的访问。\n\n我们在这里简单返回一个空列表，因为我们没有合理的替代值。\n\
  \n## 添加第二个云原生特性——监控\n\n因此，通过添加一些弹性功能，我们使应用程序比以前更健壮。接下来，我们将更进一步，为我们的应用程序添加监控功能。\n\
  \n监控背后的想法是双重的。\n\n首先，它应该为您提供系统按预期运行的信息。任何错误、异常、网络故障、数据库卡顿等都应被识别、记录并报告。\n\n其次，监控应为您提供有关系统使用情况的信息。我们有多少新用户，系统中有哪些订单，某个\
  \ REST 端点被访问的频率如何，以及关键业务方法被调用的频率如何？\n\n监控过程包含几个步骤：\n\n1. 向您的代码添加注释，以主动监控指标。\n2.\
  \ 暴露指标数据以供采集。\n3. 采集数据。\n4. 生成警报并创建可视化数据。\n\n在本节中，我们将讨论第一步，并确定我们想要监控的内容以及如何进行必要的代码更改。\n\
  \n### 查看运行系统的默认指标\n\n开箱即用，MicroProfile Metrics 在应用程序状态方面已经收集了大量信息。它定义了三类信息：\n\n\
  1. 系统指标。\n2. 应用指标。\n3. 厂商特定指标。\n\n让我们来看看这些指标。我们将使用 Cargo Tracker 应用程序来演示。导航到 http://localhost:8080/metrics；您将看到所有默认指标的列表。以下是输出的一部分：\n\
  \n```text\n# TYPE base_cpu_availableProcessors gauge\nbase_cpu_availableProcessors\
  \ 10\n# TYPE base_cpu_systemLoadAverage gauge\nbase_cpu_systemLoadAverage 5.9248046875\n\
  # TYPE base_gc_total_total counter\nbase_gc_total_total{name=\"G1 Young Generation\"\
  } 54\nbase_gc_total_total{name=\"G1 Old Generation\"} 0\n# TYPE base_jvm_uptime_seconds\
  \ gauge\nbase_jvm_uptime_seconds 56.064\n# TYPE base_memory_committedHeap_bytes\
  \ gauge\nbase_memory_committedHeap_bytes 2.87309824E8\n# TYPE base_memory_committedNonHeap_bytes\
  \ gauge\nbase_memory_committedNonHeap_bytes 2.17448448E8\n# TYPE base_memory_maxHeap_bytes\
  \ gauge\nbase_memory_maxHeap_bytes 5.36870912E8\n# TYPE base_memory_maxNonHeap_bytes\
  \ gauge\nbase_memory_maxNonHeap_bytes -1\n# TYPE base_memory_usedHeap_bytes gauge\n\
  base_memory_usedHeap_bytes 2.28326272E8\n```\n\n请注意，为简洁起见，我们省略了 #HELP 行。\n\n其中一些指标可能非常有用，因为它们允许您监控系统的行为和健康状况。这些数据对于需要在生产环境中支持应用程序的团队来说非常重要。指标可以是处理器数量、处理器的平均负载、垃圾回收次数、运行时间以及多个内存统计信息。后者可能有助于确定应用程序中的内存泄漏。\n\
  \n在输出的末尾，我们可以看到一个厂商特定的指标：\n\n```text\n# TYPE vendor_system_cpu_load gauge\nvendor_system_cpu_load\
  \ 0.08853118712273642\n```\n\n### 向系统添加指标\n\n接下来，我们将在 Cargo Tracker 应用程序中添加一些自己的指标。第一步是确定您或您的利益相关者可能感兴趣的指标。技术部门可能会非常感兴趣于可以帮助验证系统按预期工作的指标。另一方面，业务利益相关者可能更感兴趣于一些面向业务的关键绩效指标。在本节中，我们将向我们的应用程序添加一些这两种类型的指标。\n\
  \n回想一下 *第 2 章*，我们介绍了 Cargo Tracker 应用程序，它有一个 REST 端点用于检索有关现有货物的信息。该端点可通过 `http://localhost:8080/cargo-tracker/rest/cargo`\
  \ 访问，并将显示未完成的货物列表。\n\n以下是输出的一部分：\n\n```json\n{\n  \"trackingId\": \"ABC123\",\n\
  \  \"routingStatus\": \"ROUTED\",\n  \"misdirected\": false,\n  \"transportStatus\"\
  : \"IN_PORT\",\n  \"atDestination\": false,\n  \"origin\": \"CNHKG\",\n  \"lastKnownLocation\"\
  : \"USNYC\"\n},\n{\n  \"trackingId\": \"JKLS67\",\n  \"routingStatus\": \"ROUTED\"\
  ,\n  \"misdirected\": true,\n  \"transportStatus\": \"ONBOARD_CARRIER\",\n  \"atDestination\"\
  : false,\n  \"origin\": \"CNHGH\",\n  \"lastKnownLocation\": \"USNYC\"\n}\n```\n\
  \n我们可能对该端点被调用的频率感兴趣。为了为此设置指标，我们需要按如下方式更改 CargoMonitorService 类中的代码：\n\n```java\n\
  @GET\n@Produces(MediaType.APPLICATION_JSON)\n@Counted(name = \"getAllCargo\", absolute\
  \ = true)\npublic JsonArray getAllCargo() {\n```\n\n这里，我们添加了 @Counted 注解。我们将指标命名为\
  \ `getAllCargo`。通过指定 `absolute=true`，指标将在输出中作为 `application_getAllCargo` 注册。当我们将\
  \ `absolute` 设置为 `false` 时，给定名称前会加上完整的包路径和类名。\n\n让我们向 REST 端点 (`http://localhost:8080/cargo-tracker/rest/cargo`)\
  \ 发起几次 HTTP 请求以多次调用该方法。然后，当我们再次通过 `http://localhost:8080/metrics` 调用指标端点时，我们应该会看到底部添加了一个条目，如下所示：\n\
  \n```text\n# TYPE application_getAllCargo_total counter\napplication_getAllCargo_total\
  \ 3\n```\n\n另一个有用的指标涉及确定方法运行了多长时间。为此，我们可以使用 @Timed 注解。\n\n我们将此指标应用于同一方法，因此它看起来像这样：\n\
  \n```java\n@GET\n@Produces(MediaType.APPLICATION_JSON)\n@Counted(name = \"getAllCargo\"\
  , absolute = false)\n@Timed(name = \"getAllCargoTiming\", absolute = false, tags\
  \ = {\"type=performance\"})\npublic JsonArray getAllCargo() {\n```\n\n请注意，我们将指标信息存储在\
  \ `getAllCargoTiming` 下，并且我们还添加了一个选择器键/值对。这将使我们能够对结果数据进行更精确的选择。\n\n\n\n\n\nGo 并通过访问\
  \ `http://localhost:8080/cargo-tracker/rest/cargo` 调用指定的方法，然后检索新的指标。\n\n这些应该看起来像这样：\n\
  \n```\n```text\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_rate_per_second\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_rate_per_second{_app=\"\
  cargo-tracker\",type=\"performance\"} 0.14885107622981664\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_one_min_rate_per_second\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_one_min_rate_per_second{_app=\"\
  cargo-tracker\",type=\"performance\"} 0.2\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_five_min_rate_per_second\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_five_min_rate_per_second{_app=\"\
  cargo-tracker\",type=\"performance\"} 0.2\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_fifteen_min_rate_per_second\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_fifteen_min_rate_per_second{_app=\"\
  cargo-tracker\",type=\"performance\"} 0.2\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_mean_seconds\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_mean_seconds{_app=\"\
  cargo-tracker\",type=\"performance\"} 0.006363875\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_max_seconds\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_max_seconds{_app=\"\
  cargo-tracker\",type=\"performance\"} 0.006363875\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_min_seconds\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_min_seconds{_app=\"\
  cargo-tracker\",type=\"performance\"} 0.006363875\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_stddev_seconds\
  \ gauge\napplication_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_stddev_seconds{_app=\"\
  cargo-tracker\",type=\"performance\"} 0\n# TYPE application_org_eclipse_cargotracker_interfaces_booking_rest_CargoMonitoringService_getAllCargoTiming_seconds\
  \ summary\napplication_org_eclipse_cargotracker_interfaces_booking_rest_\n```\n\
  ```\n\nPrometheus 使用拉取机制从其监控的应用程序收集指标。这有几个好处，例如可以提前知道应用程序是否宕机。在上一节中，你设置了一个 Prometheus\
  \ 可以用来拉取指标的端点。\n\n### 设置 Docker Compose\n\n我们将使用 Docker 运行一个 Prometheus 实例。为此，我们需要修改已有的\
  \ Docker Compose 文件，以便添加一个 Prometheus 服务。\n\n在 Docker Compose 文件中，添加以下行：\n\n```\n\
  ```text\nprometheus:\n  image: bitnami/prometheus:latest\n  ports:\n    - \"9090:9090\"\
  \n```\n```\n\n前一个示例中的第一行是我们想要创建的服务的名称。在本例中，它是 Prometheus。然后，我们必须定义属于该服务的镜像。这里，我们使用\
  \ Bitnami 构建的最新 Prometheus 镜像。最后，我们需要定义一些端口，以便在实例运行后可以连接。我们选择将 `9000` 端口转发到 `9000`。运行此代码后，你将拥有一个正在运行的\
  \ Prometheus 实例，但它不会凭空开始收集指标。如果你访问 `localhost:9000`，你会看到一个空的 Prometheus 实例，没有任何可查询的数据。为了解决这个问题，在下一节中，我们将创建一个作业来收集数据。\n\
  \n### 设置 Prometheus 配置\n\n第一次启动 `docker-compose` 时，你会看到一个空的 Prometheus 实例，它不收集也没有任何指标。如果你只想尝试一些东西，这是可以的。如果你删除了\
  \ Prometheus 实例的容器，你将不得不重新开始，如果你经常删除容器，这可能会很麻烦。同样的情况也适用于想要与你相同设置的同事。你的同事必须像你一样设置他们的\
  \ Prometheus 实例。如果你必须为整个团队和每个想要运行 Prometheus 服务的环境，例如测试、验收和生产，这样做也会变得乏味。\n\n为了解决这个问题，首先要做的是在项目中创建一个目录来存放配置文件。我们在项目文件夹内直接创建了一个目录。完整路径如下：`cargo-tracker/prometheus`。在\
  \ Prometheus 实例内部，你需要为配置创建一个文件；我们选择将此文件命名为 `prometheus.yml`。这将是一个 YAML 文件，指定一些全局设置以及\
  \ Prometheus 对 `cargo-tracker` 应用程序执行的抓取作业的设置。\n\n在 `prometheus.yml` 文件中，你需要放置以下配置：\n\
  \n```\n```yaml\nglobal:\n  scrape_interval:     10s\n\n  external_labels:\n    monitor:\
  \ 'payara5-monitor'\n\nscrape_configs:\n  - job_name: 'payara5'\n    scrape_interval:\
  \ 2s\n    metrics_path: '/metrics'\n    static_configs:\n      - targets: ['cargo-tracker-app:8080']\n\
  ```\n```\n\n此配置为 Prometheus 创建了一个抓取配置。这告诉 Prometheus 以下内容：\n\n- 作业的名称\n- 它应该多久抓取一次给定的指标\n\
  - 目标上的指标路径\n- 抓取的目标\n\n在上一节中，你可以在 `localhost:8080/metrics` 查看 `cargo-tracker` 的指标。你必须做同样的事情，让\
  \ Prometheus 知道它可以在哪里找到指标。由于我们使用 docker-compose，我们不必使用 localhost；我们可以使用服务名称代替。在之前的章节的\
  \ `docker-compose` 中，我们有一个名为 `cargo-tracker` 的服务。我们可以在作业配置中使用该名称，Docker 将其解析为 Prometheus\
  \ 实例可用的实际地址。使用服务名称，我们可以像这样指定目标应用程序：`cargo-tracker-app:8080`。Prometheus 将使用的完整 URL\
  \ 将是 `cargo-tracker-app:8080/metrics`。\n\n配置好配置文件后，你需要在 `docker-compose` 文件中添加一行。我们创建了配置文件，但没有告诉\
  \ Prometheus 使用它，因此我们需要使此文件在容器内可用。为此，我们需要在 `docker-compose` 文件中使用 volume 关键字挂载 `prometheus.yml`\
  \ 文件，像这样：\n\n```\n```yaml\nvolumes:\n  - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
  ```\n```\n\n添加此行后，配置将可供 Prometheus 使用。完整的 docker-compose 将如下所示：\n\n```\n```yaml\n\
  version: \"3.9\"\nservices:\n  cargo-tracker-app:\n    build: .\n    ports:\n  \
  \    - \"4848:4848\"\n      - \"8080:8080\"\n      - \"8181:8181\"\n      - \"9009:9009\"\
  \n  prometheus:\n    image: bitnami/prometheus:latest\n    volumes:\n      - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
  \    ports:\n      - \"9090:9090\"\n```\n```\n\n现在配置文件和 docker-compose 都已准备就绪，我们可以启动\
  \ docker-compose 文件并查看是否有效。在浏览器中，访问 `http://localhost:9090/config`。在这里，你可以看到 Prometheus\
  \ 实例的配置。如果一切正常，你应该会看到以下输出：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_85_0.png)\n\
  \n图 4.1 – Prometheus 中的配置\n\n\n\n\n### 设置 Grafana\n\nGrafana 是一种用于查询和可视化数据的工具，这些数据来自我们创建的仪表板中的指标。创建仪表板的好处在于可以展示数据，让用户能够看到系统的状态。如果某些指标处于\
  \ 100% 或 0%，这可能意味着系统出现了问题需要修复。与使用原始指标相比，通过仪表板更容易发现这些问题。\n\n### 设置 docker-compose\n\
  \n在本节中，我们将像之前对 Prometheus 所做的那样，在容器中运行 Grafana。为此，我们需要再次修改 docker-compose 文件。我们需要为\
  \ Grafana 添加一个新服务。下面的示例展示了如何使用 Grafana 提供的最新 Grafana 镜像来添加该服务：\n\n```\ngrafana:\n\
  \  image: grafana/grafana:latest\n  ports:\n    - \"3000:3000\"\n```\n\n该服务将创建一个\
  \ Grafana 容器，并将容器的 3000 端口转发到宿主机的 3000 端口。\n\n当你访问 http://localhost:3000/login 时，将看到\
  \ Grafana 的登录界面：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_86_0.png)\n\n图 4.2\
  \ – Grafana 登录界面\n\n稍后我们会在容器内挂载这个路径。在 data sources 目录下，创建一个名为 `automatic.yml` 的文件。你将使用此文件来存储数据源配置。完整路径为\
  \ `grafana/provisioning/datasources/automatic.yml`。请确保将以下配置放入该 YAML 文件中。此配置告知 Grafana\
  \ 以下信息：\n\n- 数据源的名称\n- 访问类型\n- 可以找到资源的 URL\n- 这是否为要使用的默认数据源：\n\n```\ndatasources:\n\
  \  - name: Prometheus\n    access: proxy\n    type: prometheus\n    url: http://prometheus:9090\n\
  \    isDefault: true\n```\n\n数据源设置完成后，我们就可以开始将仪表板导入 Grafana。\n\n### 设置仪表板以便自动加载\n\
  \n如果你在 Grafana 容器内创建了一个仪表板，那么每次销毁容器并重新启动时，你的仪表板都会消失，不再存在。这并不理想，尤其是当你与同事共享项目时，他们可能完全没有仪表板。要共享仪表板并在每次创建新的\
  \ Grafana 容器时都可用，最简单的方法就是让它成为项目的一部分。将仪表板作为项目的一部分并传递给容器，这样每次创建新容器或与你共享项目的同事都能使用它。\n\
  \n将仪表板纳入项目并传递给 Grafana 容器需要两步。我们需要创建一个 YAML 文件来指定 Grafana 在哪里可以找到仪表板，还需要创建一个目录来存放我们将要创建的仪表板。\n\
  \n第一步是创建 YAML 文件，用于指定仪表板的目录。首先，你必须创建一个目录来存放 YAML 文件。我们创建了以下目录结构来存放该 YAML 文件：`grafana/provisioning/dashboards/`。在\
  \ dashboards 目录下，你需要创建一个名为 `local.yml` 的文件。你将使用此文件来存储配置。在此文件内，你需要包含以下配置：\n\n```\n\
  apiVersion: 1\nproviders:\n  - name: 'default'\n    org_id: 1\n    folder: ''\n\
  \    type: 'file'\n    options:\n      folder: '/var/lib/grafana/dashboards'\n```\n\
  \n配置中的第一行指定了配置的版本，此处为 1。在版本之后，我们必须指定提供程序（providers）；这会让 Grafana 知道在哪里可以找到仪表板。最重要的选项在最后一行。这一行指定了容器内仪表板将存储的目录。\n\
  \n下一步是创建一个仪表板，并将其存放在项目目录下的某个目录中。我们选择将 cargo-tracker 的仪表板存放在 `grafana/mydashboards/`\
  \ 目录下。在 mydashboards 目录中，我们创建了一个名为 `CargoTracker-1684667357857.json` 的 JSON 文件，该文件将保存配置。下一步是让这个\
  \ JSON 文件中包含一个仪表板。我们已经为你创建好了仪表板，因此你不必再执行此操作。用于创建仪表板的完整 JSON 文件太大，无法放入本书。请查看 GitHub\
  \ 上的文件：https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE/blob/chapter-4-fix/grafana/mydashboards/CargoTracker-1684667357857.json。\n\
  \n该 JSON 配置会在 Grafana 中创建一个仪表板，它将使用你在本章前面创建的 Prometheus 数据源，并将其中一些数据显示在仪表板上，稍后你就会看到。\n\
  \n### 展示 Grafana Docker\n\n在创建好仪表板的配置和仪表板本身之后，我们需要将它们添加到容器中。为此，你需要在 Docker 文件中的\
  \ Grafana 服务中添加以下示例的最后两行：\n\n```\ngrafana:\n  image: grafana/grafana:latest\n  ports:\n\
  \    - \"3000:3000\"\n  volumes:\n    - ./grafana/provisioning:/etc/grafana/provisioning\n\
  \    - ./grafana/mydashboards:/var/lib/grafana/dashboards\n```\n\n这两行会将你创建的目录传递给容器，使\
  \ Grafana 能够读取它们。\n\n### 展示完整的 Docker 文件\n\n完整的 Docker 文件如下所示。如果你按照本章的所有步骤操作，你将会修改\
  \ Cargo Tracker 应用程序，使其包含指标。创建一个 Prometheus 和 Grafana 服务，它们将从 cargo-tracker 应用程序加载配置：\n\
  \n```\nversion: \"3.9\"\nservices:\n  cargo-tracker-app:\n    build: .\n    ports:\n\
  \      - \"4848:4848\"\n      - \"8080:8080\"\n      - \"8181:8181\"\n      - \"\
  9009:9009\"\n  prometheus:\n    image: bitnami/prometheus:latest\n    volumes:\n\
  \      - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
  \    ports:\n      - \"9090:9090\"\n  grafana:\n    image: grafana/grafana:latest\n\
  \    ports:\n      - \"3000:3000\"\n    volumes:\n      - ./grafana/provisioning:/etc/grafana/provisioning\n\
  \      - ./grafana/mydashboards:/var/lib/grafana/dashboards\n```\n\n现在，当你运行 `docker-compose\
  \ up` 时，将创建三个服务：cargo-tracker、Prometheus 和一个 Grafana 服务。当你访问 http://localhost:3000\
  \ 上的 Grafana 实例，并使用 admin 作为用户名和 admin 作为密码登录时，你将看到以下仪表板。这些指标来自 Prometheus 实例，而\
  \ Prometheus 从 cargo-tracker 应用程序中拉取它们：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_91_0.png)\n\
  \n图 4.4 – Grafana 中的仪表板\n\n这些指标每隔几秒刷新一次，使你可以深入了解 `cargo-tracker` 应用程序内部，并查看其内部发生的情况。在下一章中，我们将基于本章的\
  \ Cargo Tracker 应用程序，向你展示有哪些选项可以让该应用程序更易于测试。\n\n### 总结\n\n在本章中，你了解了 Jakarta EE 10\
  \ 最重要的变更，包括有哪些不同的 profile，以及它们何时会被使用。你还了解了 Jakarta EE 10 为你的应用程序带来的一些新特性，以及如何将 MicroProfile\
  \ 与你的应用程序结合使用，使其更具弹性。\n\n接下来，你了解了如何通过使用 Prometheus 存储健康指标，并使用 Grafana 在仪表板中显示这些指标，为你的应用程序添加监控，从而让团队更容易了解其应用程序内部发生的情况。\n\
  \n现在，应用程序已更新到最新版本，下一步是通过添加测试来确保应用程序持续工作。下一章将介绍如何测试你的应用程序，以确保每次更改后一切都能正常工作。\n"
- "## 让应用程序更易测试\n\nCargo Tracker 应用程序已经有单元测试和良好的测试覆盖率。但这并不意味着你当前的项目或下一个项目也是如此。有可能你当前的项目没有单元测试，或者测试覆盖率较低。\n\
  \n测试覆盖率低或单元测试不足可能会带来风险。如果在迁移过程中某些东西发生了变化而无法正常工作，该怎么办？你将如何知道哪里出了问题？这时，各种不同类型的测试就派上了用场。在本章中，你将学习如何创建不同类型的测试，来测试应用程序的不同方面。\n\
  \n我们将涵盖以下主要主题：\n\n- 测试对迁移的影响\n- 衡量项目的代码覆盖率\n- 关于**测试驱动开发**（TDD）的一点说明\n- 如何创建单元测试\n\
  - 如何创建集成测试\n\n到本章结束时，你应该了解有哪些类型的测试、何时使用它们，以及如何创建这些测试。\n\n\n\n\n### 技术要求\n\n对于本章，你需要在系统上安装\
  \ Docker。有关详细说明，请参阅第 6 章，其中涵盖了 Docker 的完整安装。我们将使用 Docker 来启动集成测试的实例。本章的第一部分可以在没有\
  \ Docker 的情况下完成；然而，为了从本章中获得最大价值，安装 Docker 很重要。\n\n你可以在 GitHub 上找到本章的所有代码示例：https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE/tree/chapter-5。该仓库包含本章的所有示例。\n\
  \n### 测试对迁移的影响\n\n测试是衡量你的迁移是否成功或项目中仍需修复某些部分的绝佳工具。当所有测试都能正常工作时，意味着这些测试覆盖的功能与迁移前一样正常工作。也有可能在迁移过程中某些测试开始失败，这意味着迁移的某些部分破坏了功能。\n\
  \n如果你要迁移的项目已有足够的测试来覆盖功能，你可以快速浏览本章，看看是否有新的内容想要纳入你的测试策略，或看到测试 Java 应用的替代方法。迁移应用时，不必彻底改造当前的测试策略。\n\
  \n如果要迁移的项目几乎没有测试，添加测试可以极大地帮助你，因为测试会指示项目是否仍在正常工作。本章介绍的是编写测试并为你要迁移的项目提供测试覆盖率的众多方法之一。还有很多其他值得考虑的用于测试应用的库，例如\
  \ Arquillian、Jakarta REST client 和 MicroProfile REST client。\n\n### 衡量项目的代码覆盖率\n\
  \n拥有测试是很好的，但你知道项目中有多少部分被项目内的测试覆盖了吗？这就是测试覆盖率的作用。测试覆盖率告诉你有多少生产代码被测试覆盖。这告诉你哪些功能被测试覆盖，哪些功能必须手动测试。\n\
  \n当你使用 IntelliJ 时，衡量测试覆盖率非常容易。你只需导航到一个测试类。在测试类中，你可以右键单击该类以带覆盖率运行测试，或者也可以从菜单选项中带覆盖率运行测试，如以下屏幕截图所示：\n\
  \nFigure 5.1 – Running tests with coverage\n\n运行带覆盖率的测试后，你会看到一份报告，显示有多少生产代码被测试覆盖。它看起来是这样的：\n\
  \nFigure 5.2 – Test coverage result\n\n在之前的屏幕截图中，你可以看到各个类的测试覆盖率以及类被覆盖的百分比。RouteSpecification\
  \ 类仅覆盖了 55%。这意味着并非每个方法都被覆盖。当你查看行覆盖率时，你会看到只有略多于一半的行被覆盖。\n\n你应该追求多少百分比的测试覆盖率？这取决于许多因素。它应该是你和你的团队感到舒适的百分比，并且能让你很有信心迁移后的功能继续正常工作。这可能是\
  \ 60%、90% 甚至 100%。重要的是，它应该帮助你在迁移中前进，而不是阻碍你。\n\n### 关于 TDD 的一句话\n\n一章关于测试的内容不可能缺少关于\
  \ TDD 的部分。顾名思义，测试代码驱动你生产代码的开发。当你使用 TDD 时，你首先通过例如 JUnit 创建一个测试用例。在 Java 中，它看起来像这样：\n\
  \n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n}\n```\n```\n\n最后一个示例显示了一个空的测试方法。TDD\
  \ 的冒险从这里开始。从现在开始，在测试通过之前，你不应该开发任何生产代码。这意味着如果我们想开发新功能，我们首先需要一个失败的或无法编译的测试。\n\n第一步可以是创建你需要的实例。这允许你创建一个类来保存业务逻辑。它可以简单到以下内容：\n\
  \n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n\n    RoutingHelper routingHelper\
  \ = new RoutingHelper();\n}\n```\n```\n\n如果你尝试运行/编译项目，你会得到一个异常，说类似类或引用丢失或不存在。那是完全正确的，也是有效的，因为它在项目中还不存在。当你进行\
  \ TDD 时，你首先想要一个可以修复的失败测试。这是 TDD 的红绿循环的一部分。你从一个失败的测试开始（红），然后使其通过（绿）。为了让测试工作，你只需要创建一个\
  \ RoutingHelper 类并将其作为导入添加到测试类中。\n\n以下是会使测试再次编译的 RoutingHelper 类的示例：\n\n```\n```java\n\
  public class RoutingHelper {\n}\n```\n```\n\n当你添加了之前的示例类后，你就有一个可工作的（绿）测试。下一步将是再次使测试失败（红）。你可以通过添加一个你希望\
  \ `RoutingHelper` 类具有的方法调用来做到这一点。下一个示例展示了如何在测试方法内添加方法调用来实现这一点：\n\n```\n```java\n\
  @Test\nvoid goesToNetherlands_success() {\n    RoutingHelper routingHelper = new\
  \ RoutingHelper();\n    routingHelper.goesToNetherlands();\n\n}\n```\n```\n\n当你添加方法调用时，测试再次失败，因为该方法还不存在。创建此方法将是下一步。我们刚刚经历了\
  \ TDD 的红绿循环。我们从一个失败的测试开始，修复它，使测试通过，然后再次使其失败。这是 TDD 的基础，当你开发新功能时，你希望从一个失败的测试开始并尝试使其通过。这将是新的红绿循环的开始。TDD\
  \ 可以应用于你编写的任何代码或测试；这可以是单元测试或集成测试。当你对集成测试使用 TDD 时，真的要尽量保持测试执行的速度很快，因为你将多次执行测试。\n\n\
  ### 如何创建单元测试\n\n在 Java 中，测试通常通过单元测试完成。当人们谈论测试覆盖率或你的代码是否有测试时，他们最常指的是单元测试。单元测试是一种测试代码最小单元的方法。对于\
  \ Java 来说，代码的最小单元通常是一个单一方法。通过单元测试，我们一次只测试一个单一方法。听起来很简单，对吧？如果它不依赖于另一个类、包、数据库，甚至框架或整个应用程序，测试单个方法很容易。那时单元测试往往变得困难，测试代码变得一团糟，没人再想碰它。我们想要防止这种情况，所以我们从基础开始，从一个单一的单元测试开始构建我们的测试策略。\n\
  \n#### 单元测试所需的工具和库\n\n本章中你要编写的单元测试依赖于两个非常流行的测试库，JUnit 和 Mockito。对于单元测试本身，我们将使用 JUnit，并使用\
  \ Mockito 来模拟代码所拥有的任何依赖项。这两个库非常有帮助，并且几乎是每个项目都必不可少的。\n\nJUnit 帮助你编写实际的单元测试。借助其内置的注解，它使你能够标记方法并将其连接到测试生命周期的不同部分。测试生命周期帮助你为测试准备对象实例。另一个必不可少的库是\
  \ Mockito。Mockito 是一个库，可以以简单直接的方式帮助你创建现有类的模拟。正如你将在后面的示例中看到的，模拟的创建是为了让我们不必与类的真实实例和数据库交互。\n\
  \n\n\n\n\n#### 创建单元测试\n\n在本节中，我们将向你展示如何创建一个单元测试。Cargo Tracker 应用较为复杂，这意味着你需要花费一些时间才能完全理解代码内部发生了什么。为了加快这一过程，我们首先要创建一个可以测试的方法。这样，你就不必了解\
  \ Cargo Tracker 应用的任何细节，而可以专注于创建单元测试。\n\n我们用来教你单元测试的方法需要一个类来承载它。在 `org/eclipse/cargotracker/infrastructure/routing`\
  \ 包内创建一个名为 `RoutingHelper` 的类。确保 `RoutingHelper` 类的内容如下所示：\n\n```java\npackage org.eclipse.cargotracker.infrastructure.routing;\n\
  \npublic class RoutingHelper {\n}\n```\n\n我们无法为这个类创建单元测试，因为该类内部没有任何方法。让我们现在创建一个：\n\
  \n```java\nboolean goesToNetherlands(RouteSpecification routeSpecification) {\n\
  \    Location destination = routeSpecification.getDestination();\n    return \"\
  Netherlands\".equals(destination.getName());\n}\n```\n\n这只是一个简单的教学方法，旨在教你单元测试的基础知识。前面示例中的方法只做一件事——检查\
  \ `RouteSpecification` 实例的目的地是否等于荷兰。如果位置等于荷兰，则返回 true；如果不是，则返回 `false`。\n\n让我们为\
  \ `RoutingHelper` 类创建一个测试类。每个类都位于一个目录结构中。对于 `RoutingHelper` 类，这就是 `src/main/java/org/eclipse/cargotracker/infrastructure/routing/RoutingHelper.java`。通常，测试会位于测试包中，但目录结构相同。\n\
  \n下一步是创建一个将用于存放该类单元测试的测试类。在此目录结构中创建一个名为 `RoutingHelperTest` 的文件：`src/test/java/org/eclipse/cargotracker/infrastructure/routing/RoutingHelperTest.java`。注意两个路径中的第二个目录。生产代码位于\
  \ main 包中，而测试代码位于 test 包中。这样很容易区分，并且你不会意外地从生产代码中调用测试代码。\n\n确保 `RoutingHelperTest`\
  \ 类的内容如下所示：\n\n```java\npackage org.eclipse.cargotracker.infrastructure.routing;\n\
  import static org.junit.jupiter.api.Assertions.*;\nclass RoutingHelperTest {\n}\n\
  ```\n\n测试类创建完成后，我们就可以构建第一个单元测试了。让我们先从一个名为 goesToNetherlands_success 的空方法开始。我们给测试方法取与所测试方法相同的名称，并加上下划线和预期行为。这样我们就能在不阅读方法实现的情况下知道该方法测试什么以及预期结果是什么。第一个单元测试看起来像这样：\n\
  \n```java\n@Test\nvoid goesToNetherlands_success() {\n}\n```\n\n每个单元测试都用 @Test 注解标记。这告诉\
  \ JUnit 哪些方法是测试方法，哪些不是。下一步是测试你的 goesToNetherlands 方法。在测试内部，我们将使用 given、when、then\
  \ 结构。given 部分告诉读者测试的基础是什么以及测试需要哪些实例。when 部分调用生产代码。在 then 部分，我们验证发生的事情是否正确。\n\n对于我们的第一个单元测试，我们需要在\
  \ given 部分创建一个 RouteSpecification 类。在 when 部分，我们使用在 given 部分创建的 RouteSpecification\
  \ 类调用 goesToNetherlands 方法。在测试方法的最后一部分，我们将验证发生的事情是否正确。\n\n生成的单元测试如下所示：\n\n```java\n\
  @Test\nvoid goesToNetherlands_success() {\n\n    // given\n    Location locationNetherlands\
  \ = new Location(new UnLocode(\"XXXXX\"), \"Netherlands\");\n    Location locationGermany\
  \ = new Location(new UnLocode(\"00000\"), \"Germany\");\n    RouteSpecification\
  \ routeSpecification = new RouteSpecification(locationGermany, locationNetherlands,\
  \ Date.from(Instant.now()));\n\n    RoutingHelper routingHelper = new RoutingHelper();\n\
  \n    // when\n    boolean goesToNetherlands = routingHelper.goesToNetherlands(routeSpecification);\n\
  \n    // then\n    Assertions.assertTrue(goesToNetherlands);\n}\n```\n\n在这里，我们在\
  \ given 部分创建了两个位置、一个路由规范和一个路由助手，并在单元测试的剩余部分中使用它们。\n\n当你将此代码添加到 Cargo Tracker 项目中时，你的第一个单元测试就完成了。现在你需要做的就是运行单元测试。\n\
  \n### 如何创建集成测试\n\n在本节中，我们将向你展示如何创建集成测试。我们今天构建的应用不再是孤立的。相反，我们在日常生活中开发的应用对内部和/或外部系统都有很多依赖。这些依赖都有各自的版本、接口等，当我们只替换应用的一小部分甚至很大一部分时，这些都需要继续正常工作。重要的是要知道，例如在升级软件依赖、服务器或操作系统后，你的应用是否仍然正常工作。\n\
  \n在下一节中，我们将带你了解集成测试是什么以及如何使用它们来测试你的应用。\n\n#### 什么是集成测试？\n\n要验证你的系统是否仍然正常工作，你需要测试！使用单元测试，我们只测试一小段代码，而不是包、模块，甚至整个应用。它们并不是为此而设计的。要验证更大的部分或整个应用是否正常工作，你需要集成测试。\n\
  \n集成测试顾名思义，是关于测试你的应用与其他应用的集成，以查看被测试的应用在与其他应用交互时是否按预期行为。你也可以用它们来测试应用内部模块之间的集成，因为理想情况下，你希望在真实运行的应用上运行集成测试。在下一节中，我们将向你展示如何针对真实运行的\
  \ Cargo Tracker 应用运行测试。为此，我们将使用 Testcontainers。\n\n#### 什么是 Testcontainers？\n\n\
  Testcontainers 是由 AtomicJar 开发的一款软件。它是一个开源框架，为为测试目的启动和拆除 Docker 容器提供抽象。它为你提供了一个简单且轻量级的接口来管理你的容器。还有一个库可以让与\
  \ JUnit 5 的集成变得非常简单。使用 Testcontainers，你可以做到以下几点：\n\n- 更轻松地更真实地测试我们的应用。\n- 测试你的系统如何与真实依赖集成，而不必使用模拟或存根。例如，你可以启动一个真实的数据库。\n\
  - 确保你的测试环境可移植。每个用户都会启动相同的 Docker 容器，使得每个人都很容易开始使用和扩展集成测试。\n- 防止开发后期出现错误。你现在可以在部署到开发、测试或验收环境之前测试集成。\n\
  \n#### 设置 Testcontainers\n\n要开始使用 Testcontainers，你需要设置一些东西。你需要一个有效的 Docker 环境。如果尚未设置，请查看第\
  \ 6 章，了解如何在你的机器上设置 Docker。要将 Testcontainers 添加到你的项目中，你需要添加三个依赖项。\n\n我们需要以下依赖项来运行集成测试：\n\
  \n- JUnit 5\n- Testcontainers\n- Testcontainers JUnit 集成\n\n我们需要 JUnit 5 依赖项来运行你要创建的测试。Testcontainers\
  \ 依赖项是与 Docker 实例交互的简便方法，而 Testcontainers JUnit 集成用于使前面提到的两个依赖项协同工作。添加这些依赖项非常简单。你只需要在项目的\
  \ pom.xml 文件中添加这些依赖项，如下所示：\n\n```xml\n<dependency>\n  <groupId>org.junit.jupiter</groupId>\n\
  \  <artifactId>junit-jupiter</artifactId>\n  <version>5.9.3</version>\n  <scope>test</scope>\n\
  </dependency>\n<dependency>\n  <groupId>org.testcontainers</groupId>\n  <artifactId>testcontainers</artifactId>\n\
  \  <version>1.18.3</version>\n  <scope>test</scope>\n</dependency>\n<dependency>\n\
  \  <groupId>org.testcontainers</groupId>\n  <artifactId>junit-jupiter</artifactId>\n\
  \  <version>1.18.3</version>\n  <scope>test</scope>\n</dependency>\n```\n\n添加这些依赖项后，你就可以开始使用\
  \ Testcontainers 创建集成测试了。\n\n\n\n\n下一步是使用 Payara 的 Docker 镜像创建一个容器，我们也可以使用它来部署 .war\
  \ 文件：\n\n```java\n@Testcontainers\npublic class IntegrationTests {\n\n    static\
  \ MountableFile warFile = MountableFile.forHostPath(\n    Paths.get(\"target/cargo-tracker.war\"\
  ).toAbsolutePath(), 0777);\n    @Container\n    static GenericContainer CargoContainer\
  \ =\n    new GenericContainer(\"payara/server-full:6.2023.2-jdk17\")\n    .withCopyFileToContainer(warFile,\n\
  \    \"/opt/payara/deployments/cargo-tracker.war\")\n    .withExposedPorts(8080)\n\
  \    .waitingFor(Wait.forHttp(\"/cargo-tracker\"));\n\n}\n```\n\n使用这个 GenericContainer\
  \ 类会增加不少代码。所以，让我们一步一步分析发生了什么。GenericContainer 类标有 @Container 注解。这使得 JUnit 负责容器的生命周期管理。在幕后，JUnit\
  \ 会使用 Testcontainers 来完成这项工作。JUnit 会在每个测试用例的基础上指示 Testcontainers 依赖需要做什么。\n\n将 GenericContainer\
  \ 声明为 static（静态）是因为我们希望每个测试都使用同一个容器实例。如果不使用 static，那么每个测试都会启动一个新容器，并停止旧容器。这对某些测试可能很方便，但也会耗费一些时间。如果你想让测试跑得更快，最好复用容器。\n\
  \n创建实际实例是代码中有趣的部分。看下面的示例，你会发现这里发生了四件事：\n\n```java\nnew GenericContainer(\"payara/server-full:6.2023.2-jdk17\"\
  )\n.withCopyFileToContainer(warFile,\n    \"/opt/payara/deployments/cargo-tracker.war\"\
  )\n.withExposedPorts(8080)\n.waitingFor(Wait.forHttp(\"/cargo-tracker\"));\n```\n\
  \n第一行，我们告诉 Testcontainers 我们希望容器基于哪个镜像。有了容器之后，我们希望把 .war 文件复制到容器中，以便它可以被部署。我们不需要调用部署命令，因为\
  \ Payara 会自动部署容器 /opt/payara/deployments/ 目录中的任何内容。第 3 行，我们指定要暴露的端口——本例中是 8080。这是默认端口，使我们能够从外部访问容器。\n\
  \n代码的最后一部分非常重要。它告诉我们容器何时可以开始使用。如果没有包含这一行，我们将无法判断容器是否已经就绪。这可能会导致测试运行过早，无法访问 Cargo\
  \ Tracker 应用程序，从而使测试失败。为了防止测试过早运行，我们可以根据某个条件进行等待。对于 Cargo Tracker 应用程序，我们希望等到 Payara\
  \ 服务器运行起来，并且 Cargo Tracker 应用程序已经部署完成。要测试 Payara 服务器是否在运行，我们可以向 Cargo Tracker 应用程序的起始页面发起一个\
  \ HTTP 请求。如果这个请求成功，我们就知道应用程序已启动并运行，可以准备进行集成测试了。\n\n要检查创建容器和部署 Cargo Tracker 应用程序是否都能正常工作，你可以在类中添加以下测试：\n\
  \n```java\n@Test\npublic void isDeployed() {\n    Assertions.assertTrue(CargoContainer.isRunning());\n\
  }\n```\n\n这个测试会检查容器是否在运行，如果容器在运行，则测试通过。这是一个很好的测试，但它不能告诉你任何关于 Cargo Tracker 应用程序运行情况的有用信息。因此，让我们创建一个真正会测试\
  \ Cargo Tracker 应用程序的集成测试。\n\n#### 创建集成测试\n\n在上一节中，我们设置了运行 Cargo Tracker 应用程序的 Docker\
  \ 容器。这个容器由 JUnit 使用 Testcontainers 进行管理。在上一节中，你只设置了容器，并没有编写真正的集成测试。在本节中，你将构建一个集成测试。我们将向测试容器发起一个\
  \ HTTP 请求。\n\n要向容器发起请求，我们将使用 rest-assured 库。rest-assured 是一个提供工具让我们在测试用例中测试和验证 REST\
  \ 服务的库。要将 rest-assured 依赖添加到项目中，你需要在 Cargo Tracker 应用程序的 pom.xml 文件中加入以下代码片段：\n\n\
  ```xml\n<dependency>\n    <groupId>io.rest-assured</groupId>\n    <artifactId>rest-assured</artifactId>\n\
  \    <version>5.3.1</version>\n    <scope>test</scope>\n</dependency>\n```\n\n加入这个依赖后，我们就可以从测试中发起\
  \ REST 调用了。下一步是构建测试用例。让我们从一个空用例开始，如下所示：\n\n```java\n@Test\npublic void verify()\
  \ {\n}\n```\n\n这个测试用例只是一个用 `@Test` 注解标记的方法，该注解告诉 JUnit 5 这个方法包含一个它可以运行的测试。现在，让我们使用\
  \ `rest-assured` 向测试容器发起调用。将以下代码添加到测试方法中：\n\n```java\nList<LinkedHashMap<String,\
  \ Object>> cargoResult = given().get(String.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
  , CargoContainer.getMappedPort(8080)))\n    .then()\n    .assertThat().statusCode(200)\n\
  \    .and()\n    .contentType(ContentType.JSON)\n    .extract()\n    .as(List.class);\n\
  ```\n\n这个方法做了很多事情。让我们逐行看看它做了什么：\n\n-   示例以对 `cargoResult` 的赋值开始。这将是请求正文的引用，我们稍后想用它做进一步测试。\n\
  -   赋值之后，你会看到为 Cargo Tracker 应用程序的 `cargo` 端点创建了一个 GET 请求。\n-   仔细看，你会发现我们必须使用 `String.format`\
  \ 创建一个 URL，以调用运行在容器内的 Cargo Tracker 应用程序。这是因为我们不知道哪个外部端口被映射到了 Cargo Tracker 应用程序所监听的内部端口\
  \ `8080`。\n\n要找出哪个端口被映射到内部端口 8080，我们必须从上一节中创建的 CargoContainer 实例获取该端口，如下所示：\n\n\
  ```java\nString.format(\"http://localhost:%d/cargo-tracker/rest/cargo\",\n    CargoContainer.getMappedPort(8080))\n\
  ```\n\n这与上一个示例中的 `String.format` 用法相同。如你所见，我们通过调用 `CargoContainer.getMappedPort(8080)`\
  \ 方法来获取正确的端口。该方法返回映射到 8080 的端口号。我们必须这样做，因为 Testcontainers 会自动将内部端口 8080 映射到宿主机的一个可用端口。经过\
  \ `String.format` 之后，我们就得到了一个可用的 URL，可以用来调用测试容器。\n\n发起调用之后，我们想验证结果是否符合预期。为此，我们可以使用\
  \ `.then()` 和 `.assertThat()`，如下例所示：\n\n```java\n.then()\n    .assertThat().statusCode(200)\n\
  \    .and()\n    .contentType(ContentType.JSON)\n```\n\n在上面的代码片段中，我们做了两个断言，如下所示：\n\
  \n-   我们做的第一个断言是检查响应状态码是否为 200，这意味着请求已成功处理。\n-   我们做的第二个断言是检查响应内容是否为 JSON。\n\n接下来，我们要获取\
  \ Cargo Tracker 应用程序返回的实际响应，即它生成的 JSON。为此，我们可以使用 extract() 方法，它将使用 Jackson 将 JSON\
  \ 转换为对象。在本例中，我们只需要一个对象列表。\n\n下面的示例展示了如何从 rest-assured 中提取 JSON 响应：\n\n```java\n\
  .extract()\n.as(List.class);\n```\n\n我们可以使用 JSON 响应进行进一步测试。我们可以用它来断言大小，并验证内容是否符合预期。下面的示例演示了具体做法：\n\
  \n```java\nAssertions.assertEquals(4, cargoResult.size());\n\ncargoResult.forEach(cargo\
  \ -> {\n    Assertions.assertEquals(cargo.size(), 7);\n});\n```\n\n完整的集成测试将如下所示：\n\
  \n```java\n@Test\npublic void verify() {\n\n    List<LinkedHashMap<String, Object>>\
  \ cargoResult = given().get(String.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
  , CargoContainer.getMappedPort(8080)))\n        .then()\n        .assertThat().statusCode(200)\n\
  \        .and()\n        .contentType(ContentType.JSON)\n        .extract()\n  \
  \      .as(List.class);\n\n    Assertions.assertEquals(4, cargoResult.size());\n\
  \n    cargoResult.forEach(cargo -> {\n        Assertions.assertEquals(cargo.size(),\
  \ 7);\n    });\n}\n```\n\n\n\n\n当此测试运行时，JUnit 将为 Cargo Tracker 应用启动一个容器，并在 Cargo\
  \ Tracker 应用部署完成且可访问后执行测试。容器就绪后，测试将运行，向 /cargo 端点发出调用，并验证来自 Cargo Tracker 应用的响应。\n\
  \n完成本节及上一节的操作后，完整的测试方法如下例所示：\n\n```java\n@Testcontainers\npublic class IntegrationTests\
  \ {\n\n    static MountableFile warFile = MountableFile.forHostPath(\nPaths.get(\"\
  target/cargo-tracker.war\").toAbsolutePath(), 0777);\n    @Container\n    static\
  \ GenericContainer CargoContainer =\n    new GenericContainer(\"payara/server-full:6.2023.2-jdk17\"\
  )\n    .withCopyFileToContainer(warFile,\n    \"/opt/payara/deployments/cargo-tracker.war\"\
  )\n    .withExposedPorts(8080)\n    .waitingFor(Wait.forHttp(\"/cargo-tracker\"\
  ));\n\n    @Test\n    public void isDeployed(){\n    Assertions.assertTrue(CargoContainer.isRunning());\n\
  \    }\n\n    @Test\n    public void verify(){\n    List<LinkedHashMap<String, Object>>\
  \ cargoResult = given().get(String.\n    format(\"http://localhost:${}/cargo-tracker/rest/cargo\"\
  ,\n    CargoContainer.getMappedPort(8080)))\n    .then()\n    .assertThat().statusCode(200)\n\
  \    .and()\n    .contentType(ContentType.JSON)\n    .extract()\n    .as(List.class);\n\
  \n    Assertions.assertEquals(4, cargoResult.size());\n\n    cargoResult.forEach(cargo\
  \ -> {\n    Assertions.assertEquals(cargo.size(), 7);\n    });\n    }\n}\n```\n\n\
  当你将此集成测试添加到 Cargo Tracker 应用后，就可以运行该测试了。结果是，Cargo Tracker 应用的端点将被一个集成测试所覆盖。当 Cargo\
  \ Tracker 应用的依赖发生变化时，你可以运行此测试来验证端点是否仍按预期工作。\n\n### 小结\n\n在本章中，你学习了为 Cargo Tracker\
  \ 应用和你自己的项目创建单元测试和集成测试所需的多个库。这是一项重要技能，它能让你对自己的代码库充满信心。创建单元测试和集成测试是专业开发人员日常任务的一部分。\n\
  \n在本章的第一节中，你了解到单元测试是仅覆盖最小代码单元的小型测试。对于 Java 来说，最小代码单元就是单个方法。你从零开始创建了第一个测试，并使用 JUnit\
  \ 使其运行起来。\n\n在本章的第二部分中，你了解到集成测试覆盖了内部和外部依赖的集成。你使用 Testcontainers 创建了一个集成测试，它利用 Docker\
  \ 和 Cargo Tracker 应用的镜像来进行集成测试。在设置好 Cargo Tracker 应用的测试容器后，我们向你展示了如何使用 rest-assured\
  \ 对该实例进行 HTTP 调用测试。\n\n在下一章中，我们将更深入地探讨如何将 Docker 和容器与 Cargo Tracker 应用结合使用。\n"
