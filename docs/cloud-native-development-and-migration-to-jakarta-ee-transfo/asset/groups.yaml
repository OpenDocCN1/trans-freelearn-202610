    FQDN is one of these typical abbreviations that you will find a lot in cloud computing.
    It pinpoints the exact location within the **Domain Name System (DNS)** by specifying
    the hostname, domain name, and top-level domain name. The top-level domain name
    for www.packt.com is .com, for example.


    # Metrics of containers in the cloud


    One of the benefits of working in a cloud environment is that it comes with many
    functionalities out of the box. Next to automated backup and scaling, monitoring
    is another one.


    In this section, we will briefly touch upon the monitoring capabilities that come
    standard with a cloud environment. The functionality shown here is specific to
    Microsoft Azure, but other cloud environments offer a similar functionality.


    Once the container instance has been started, you have the option to look at its
    metrics.


    To do so, select the **Metrics** option under the **Monitoring** heading on the
    menu bar at the left. You should then see a screen like this:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_162_0.png)


    Figure 9.17 – Overview of container metrics


    This view shows the basic metrics for an application—its CPU usage, the amount
    of memory used, and the number of bytes sent and received over the network. These
    metrics are always available, and rightfully so, because they are the primary
    indicators of how much load your application is experiencing. As such, they are
    the ones on which you may decide to scale your application, either manually or—more
    likely—automatically.


    One of the interesting options is that if you hover over a metric, the timelines
    in all the other metrics change as well. If, for instance, you move your mouse
    to a spike in the **CPU** metric window,'
  - '[PAGE 163]


    the Memory metric window will move to the same moment in time. This is extremely
    useful in comparing different metrics at a moment of some occurrence in the system:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_163_0.png)


    Figure 9.18 – Overview of container instance metrics


    When you click on a metric, you get a detailed view, and you are also able to
    switch between the different types of charts that are available:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_163_1.png)


    Figure 9.19 – Detailed view of a metric with the option to switch chart type'
  - '[PAGE 164]


    In the same menu where you can change the chart type, you also have the ability
    to set up an alert. Alerting allows for a certain action to be taken in case some
    predefined threshold on a metric is exceeded.


    Here, we show the screen that is shown when you create a new alert:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_164_0.png)


    Figure 9.20 – Setting up an alert


    We selected a CPU-based alert, stating that the alert should fire if the average
    CPU usage exceeds 85. We also stated that we want this alert to be checked every
    5 minutes and that it also should look at the last 5 minutes to determine the
    value. Normally, you would want this period to be a bit longer to get a responsible
    idea about the application load and to prevent alert firing due to an incidental
    spike.


    Having a number of these metrics on a dedicated dashboard for a container instance
    can be very useful, and luckily, we have the option to do so. Via the Save to
    dashboard option, you can add your favorite metrics to your personal or shared
    dashboard.


    # Summary


    In this chapter, we moved our application to a cloud platform. We chose Microsoft
    Azure, but it could have been any cloud provider. We showed how to set up a container
    registry, how to do the actual deployment, and how to look at metrics for a running
    container instance.


    You have now moved your existing monolithic application to the cloud. You have
    enhanced it with cloud-native features, such as resilience. You have come a long
    way, and maybe this is where you intend to stop. Or, you may choose to go down
    the path of breaking up the monolith into individual applications or microservices.
    There is no good or bad here, and the choice of what to do depends entirely upon
    the application and its intended use. In the next chapter, we will look at MicroProfile
    as it can help add more cloud nativeness to your application.'
