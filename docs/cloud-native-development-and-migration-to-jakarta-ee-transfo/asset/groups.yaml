    \ we want to use. Cargo uses the download URI to download a version of Payara.\
    \ To finish the Cargo upgrade, we need to update the artifact ID defined inside\
    \ the plugin. At the bottom of the `pom.xml` file, you will find the Cargo plugin.\
    \ We need to take this artifact ID:\n\n```\n<artifactId>cargo-maven2-plugin</artifactId>\n\
    ```\n\nAnd we need to change it into this one:\n\n```\n<artifactId>cargo-maven3-plugin</artifactId>\n\
    ```\n\nThis finishes the Payara and Cargo upgrade to the latest version.\n\nThe\
    \ Cargo tracker uses **Derby** as an in-memory database to store cargo information,\
    \ but this is no longer possible if we want to use Payara 6. Payara has replaced\
    \ Derby with **H2** for several reasons. This means that we must change the data\
    \ source inside the `web.xml` file.\n\nInside `web.xml`, we need to replace the\
    \ data source that looks as follows with one that uses H2:\n\n```xml\n<data-source>\n\
    \    <name>java:app/jdbc/CargoTrackerDatabase</name>\n    <class-name>org.apache.derby.jdbc.EmbeddedDriver</class-name>\n\
    \    <url>jdbc:derby:${webapp.databaseTempDir}/cargo-tracker-database;create=true</url>\n\
    </data-source>\n```\n\nTo use H2, we need to replace the class name to tell Payara\
    \ which driver to use to connect the database. The URL tells Payara where to find\
    \ the database, and `:mem:` tells H2 that we want to use an in-memory database.\
    \ The last parameter is the name of the database that H2 has to create:\n\n```xml\n\
    <data-source>\n    <name>java:app/jdbc/CargoTrackerDatabase</name>\n    <class-name>org.h2.Driver</class-name>\n\
    \    <url>jdbc:h2:mem:cargo-tracker-database</url>\n</data-source>\n```\n\n##\
    \ Upgrading PrimeFaces\n\nThe last dependency we need to upgrade is **PrimeFaces**.\
    \ This upgrade also consists of two steps: upgrading the dependency to the latest\
    \ version and changing the PrimeFaces theme because the theme used by the project\
    \ is no longer supported.\n\nTo upgrade the primefaces dependency, we need to\
    \ change the version and add a classifier.\n\nThe current primefaces dependency\
    \ looks like the following:\n\n```xml\n<dependency>\n    <groupId>org.primefaces</groupId>\n\
    \    <artifactId>primefaces</artifactId>\n    <version>8.0</version>\n</dependency>\n\
    ```\n\nWith the upgrade, it should look like the following example. We changed\
    \ the version to 10.0.0 and added the `jakarta` classifier:\n\n```xml\n<dependency>\n\
    \    <groupId>org.primefaces</groupId>\n    <artifactId>primefaces</artifactId>\n\
    \    <version>10.0.0</version>\n    <classifier>jakarta</classifier>\n</dependency>\n\
    ```\n\nAs mentioned earlier, we need to change the theme. To do this, go to the\
    \ `web.xml` file and look for the following lines at the top part of the file:\n\
    \n```xml\n<context-param>\n    <param-name>primefaces.THEME</param-name>\n   \
    \ <param-value>omega</param-value>\n</context-param>\n```\n\nThe `param-value`\
    \ tells PrimeFaces we want to use the omega theme for the project. This theme\
    \ is not usable with version 10 of PrimeFaces. To switch to a different theme,\
    \ change the previous code line into this:\n\n```xml\n<context-param>\n    <param-name>primefaces.THEME</param-name>\n\
    \    <param-value>saga</param-value>\n</context-param>\n```\n\nAfter performing\
    \ the last step, we concluded the migration from `javax` to `jakarta`. You can\
    \ now run `mvn clean` and `mvn package cargo:run` to run the Cargo tracker application\
    \ using Jakarta EE on Payara 6.\n\n## Red Hat MTA\n\n**MTA**, which stands for\
    \ **Migration Toolkit for Applications**, can automatically convert your Java\
    \ EE projects to Jakarta EE. It does so by applying a certain set of rules. MTA\
    \ is a very extensive product. Conversions can be done via the following:\n\n\
    - A user interface\n- Command-line tools\n- An OpenShift operator\n- IDE plugins\n\
    \nBefore you can use MTA, you need to [download](https://developers.redhat.com/products/mtr/download)\
    \ and install it. For installation instructions, we refer you to the [official\
    \ documentation](https://access.redhat.com/documentation/en-us/migration_toolkit_for_applications/6.2/html/cli_guide/index?extIdCarryOver=true&sc_cid=701f2000001Css5AAC).\
    \ You should install the command-line tools, as those will be the ones you will\
    \ need for executing migrations on your machine.\n\nOnce you have the command-line\
    \ tools installed, you can start migrating. We will again use the IntelliJ plugin\
    \ to execute the migration. You need to install the MTA plugin from the Plugins\
    \ page:\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_62_0.png)\n\nFigure 3.4 –\
    \ MTA plugin installation screen\n\nOnce the plugin is installed, you will have\
    \ a new tab in your UI labeled **Migration Toolkit for Applications**. Follow\
    \ these steps:\n\n1. Click on the tab.\n\n   There should be a default configuration\
    \ entry in the list. If not, right-click and choose **New Configuration**. Your\
    \ screen should now look like this:\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_63_0.png)\n\
    \n   Figure 3.5 – Configuration entry in the MTA plugin\n\n2. Double-click the\
    \ configuration.\n3. Enter the information as shown in the following figure (note\
    \ that we selected **Windup Configuration** at the bottom).\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_64_0.png)\n\
    \n   Figure 3.6 – Configuration details of MTA\n\n4. Make sure you enter the location\
    \ where you installed the command-line tools for MTA.\n5. Close the configuration.\n\
    6. Back in the list of configurations, you can now select the configuration you\
    \ just modified, right-click it, and choose Run Analysis:\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_64_1.png)\n\
    \n   Figure 3.7 – The Run Analysis pop-up menu option\n\n7. Once the analysis\
    \ is completed, the configuration in the left panel will be updated with a report\
    \ and a results section.\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_65_0.png)\n\
    \n   Figure 3.8 – Overview of the migration report\n\n8. Click on the reports\
    \ to go to the migration report. Next, click on `cargotracker-javaee7`.\n9. You\
    \ will see a summary of your project’s artifacts, the type of incidents detected,\
    \ and even an estimate of required story points to apply the changes.\n\n   ![](img/8948f94d0abcdb1ae94d6778da518d16_65_1.png)\n\
    \n   Figure 3.9 – MTA dashboard main screen\n\nNote that there are several more\
    \ tabs at the top that can provide excellent information about your application,\
    \ such as the **Technologies** screen shown here:\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_66_0.png)\n\
    \nFigure 3.10 – MTA Technologies overview screen\n\nBut it does not stop there.\
    \ If you have executed the analysis against your IntelliJ workspace, specified\
    \ in the `-input` parameter, it will show you all the incidents found in your\
    \ source code.\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_66_1.png)\n\nFigure\
    \ 3.11 – View of incidents related to their source files\n\nIf a quick fix can\
    \ be applied, you can do so by right-clicking the incident and choosing Apply\
    \ All Quickfixes.\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_67_0.png)\n\nQuick\
    \ fixes can be applied to a single incident, all incidents in a file, or on increasingly\
    \ higher levels.\n\n## Upgrading your application server\n\nNow, you have your\
    \ source code upgraded to the Jakarta namespace and updated your dependencies.\
    \ You have also upgraded to a newer version of your application server.\n\nShould\
    \ you use a different application server than Payara in your projects, you can\
    \ use the information in this section to choose the correct version of the application\
    \ server to use.\n\nThere are two versions of Jakarta EE 9: Jakarta EE 9 and Jakarta\
    \ EE 9.1. There is no functional difference between the two; they do not contain\
    \ distinctive features. However, as the migration was such a huge effort, it was\
    \ decided that compatibility against Java 11 was only introduced in Jakarta EE\
    \ 9.1. Thus, if you plan to run your application server on Java 8, a Jakarta EE\
    \ 9 server will suffice; otherwise, use Jakarta EE 9.1 on Java 11 and higher.\n\
    \nThe following table lists some of the more common application servers.\n\n|\
    \ Application server | Jakarta EE 9-compatible | Jakarta EE 9.1-compatible |\n\
    |---|---|---|\n| Eclipse GlassFish | 6.0 | 6.1 |\n| Open Liberty | 21.0.0.12 |\
    \ 21.0.0.12 |\n| WildFly | 23.0.2 | 25.0.0 |\n| Payara Enterprise Server | 6.2021.1\
    \ | 6.2021.1 |\n| IBM WebSphere Liberty | 21.0.0.12 | 21.0.0.12 |\n\nTable 3.2\
    \ – Jakarta EE 9 compatible application servers\n"
