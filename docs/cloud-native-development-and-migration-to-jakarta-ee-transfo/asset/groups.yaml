    # Migrating strategies


    Out of all of this, the most painful part from an application developer’s point
    of view is that the namespaces have changed. This means that migrating to Jakarta
    involves refactoring all the Java EE import statements in your code base. To a
    lesser degree, changes need to be made to the POM files of your project as well.


    In this section, we will look at three approaches to migrating your projects.
    We will do so using the following:


    +   - An open source multiplatform editor

    +   - The Sed command line tool

    +   - A specialized plugin for your IDE


    But before doing so, it is perhaps best to first create a new branch in Git that
    will contain our updated source code.


    Enter the following command inside the cargotracker directory:


    ```

    git checkout -b jakarta-ee9

    ```


    Git will respond with the message Switched to a new branch ''jakarta-ee9.


    If you would like to push this new local branch to your remote server immediately,
    you can do so by entering the following command:


    ```

    git push -u origin jakarta-ee9:jakarta-ee9

    ```


    You might prefer to make the necessary changes first before committing and pushing.
    In those circumstances, you skip pushing the new branch to the remote server right
    now.'
