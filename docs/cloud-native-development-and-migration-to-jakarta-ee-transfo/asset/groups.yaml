    to explicitly state our dependencies and their versions.


    # Config


    *Store config in the environment.*


    *Factor 3 states that applications should be configured by using environment variables
    only. This configuration data could be a URL and credentials for a database, or
    a secret key to use when accessing a different microservice.*


    These values most likely vary in development, staging, and production. By setting
    these values into environment variables, the application can retrieve and use
    them at application startup.


    The application itself stays unchanged when it moves from staging to production,
    for instance, and only the environment variables will have different values, reflecting
    the configuration values of that environment.


    Container and orchestration tools such as Docker, Podman, and Kubernetes offer
    very good support for working with environment variables.


    It should be noted that environment variables are not meant for configuring application
    logic, such as the allowed number of retries of an invalid password. This kind
    of application-specific configuration should be stored in some kind of properties
    file or a database table.


    # Backing services


    *Treat backing services as attached resources.*


    Backing services should be treated as bounded resources. First of all, what is
    a backing service? A **backing service** is any external service that your application
    relies on for its normal operation. Think of things such as databases, messaging
    systems, and external services, but also disk storage. This last one might seem
    strange at first, but remember that we are running in containers. Containers are
    ephemeral by nature. This means that they are short-lived, and as soon as a container
    dies, any content stored inside that container is gone forever.


    Bounded resources in this context mean that your application can state its need
    for a certain backing service, but it is the cloud runtime that is supplying the
    actual binding to this service.'
  - '[PAGE 142]


    *Factor 3 states that configuration should be externalized, and this includes
    the actual backing services you will be bound to. This has the major asset that
    during runtime, you can actually change this binding. Thus, if some backing service
    is failing, the application can keep functioning by binding it to another resource—for
    instance, replacing a failing database server with a new one.*


    # Build, release, run


    *Strictly separate build and run stages.*


    We already touched upon the need to automate our build process earlier in this
    chapter. Preferably, we use a build server to create an immutable instance of
    our application and package it into a container.


    Releasing this artifact means giving it a unique ID of some kind. This can be
    some kind of a version number. Containers, for instance, allow you to add tags
    to them. One of these tags can be this version number. This will uniquely identify
    it from other containers.


    The artifact will then be moved through the different stages—development, staging,
    production, and so on—without being modified.


    The different environment variables applied in each environment will change its
    configuration accordingly. The artifact itself is not changed at any time. This
    will guarantee that if it was working in one stage, it would very likely do so
    in another stage as well.


    # Processes


    *Execute the app as one or more stateless processes.*


    Processes should be run as stateless processes and apply the **share-nothing (SN)**
    principle. This is a distributed architecture principle that states that no information
    is shared between nodes. This ensures that you do not create any **single point
    of failure (SPOF)** in your system.


    Practically, this means that if your application caches data, it should do so
    by using a caching server as a backing service, and not cache data on its own.
    Caches take time to be populated and are best shared between similar nodes.


    Traditionally, web servers had a notion of something called **sticky sessions**.
    This tied requests from a user to a certain server because this server kept certain
    information about the client session in memory, for the sake of speed.


    Sticky servers violate SN principles and thus should be avoided. Similarly, sharing
    information between processes via data stored in files on a local disk should
    be avoided in all very simple situations. Uploading a file or image for processing
    is an example of such a situation.'
