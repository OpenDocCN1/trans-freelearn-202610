    \ Language | Jakarta Expression Language |\n| Enterprise JavaBeans | Jakarta Enterprise\
    \ Beans |\n| Java Architecture for XML Binding | Jakarta XML Binding |\n| Java\
    \ API for JSON Binding | Jakarta JSON Binding |\n| Java API for JSON Processing\
