    \ the Dockerfile in the current directory.\n\n### Using Docker Compose\n\nTo start\
    \ all the services in `docker-compose.yml`, run the following command:\n\n```bash\n\
    docker compose up\n```\n\nThis will build the container for the Cargo Tracker\
    \ application using the Dockerfile in the current directory and starting it. Because\
    \ we also specified the ports inside the Docker Compose file, we don't have to\
    \ specify them in the command. When you see the following text in the console,\
    \ you will know that the container has started and is ready to be accessed:\n\n\
    ```text\ncargotracker-cargo-tracker-app-1 | cargo-tracker was successfully deployed\
    \ in 9,380 milliseconds. [#]\n```\n\nYou can now go to the following URL and see\
    \ that the container and the Cargo Tracker application are running: `http://localhost:8080/cargo-tracker/`.\n\
    \nTo see that all the ports are mapped to their corresponding port on the host\
    \ machine, run the following command:\n\n```bash\ndocker ps\n```\n\nThe result\
    \ will look like this:\n\n```text\nCONTAINER         IMAGE                   \
    \    COMMAND                  CREATED         STATUS         PORTS           \
    \        NAMES\nID\n93a1813c884c      cargotracker-cargo-tracker-app \"/tini --\
    \ /bin/sh 30 minutes ago  Up 14 seconds  0.0.0.0:4848->4848/tcp,  cargotracker-cargo-tracker-app-1\n\
    -c \"\"                                        0.0.0.0:8080->8080/tcp, 0.0.0.0:8181->8181/tcp,\
    \ 0.0.0.0:9009->9009/tcp\n```\n\nUnder the port section, you can verify that the\
    \ ports are mapped in the same way as we have specified in the `docker-compose.yml`\
    \ file.\n\n### Stopping a container\n\nStopping a container that you started works\
    \ the same as stopping any other container that runs inside Docker. Using the\
    \ `docker kill` command, you can stop the container you started using `docker\
    \ compose up`. To stop the container from the previous example, you can use the\
    \ following command:\n\n```bash\ndocker kill 93\n```\n\nThis will return 93 and\
    \ the container will stop. To verify that the command has worked, you can run\
    \ the docker ps command again. Alternatively, you can use the following:\n\n```bash\n\
    docker-compose down\n```\n\nThis will remove the container, the networks defined\
    \ in the configuration file, and any default network definition.\n\n## Summary\n\
    \nIn this chapter, you learned what Docker is and how you can use it for the Cargo\
    \ Tracker application. You learned that a container is an executable package of\
    \ your software that contains an application, dependencies, and the system tools\
    \ your application needs to run. After that, we investigated what Docker is and\
    \ how it uses containers. With this knowledge, you specified your first Dockerfile\
    \ for the Cargo Tracker application. Using the Docker command-line interface,\
    \ you have learned how to build your container and start it. You also explored\
    \ other ways of starting the container using detached mode and how to stop a container.\
    \ Finally, you learned how to create a Docker Compose file and how to start it.\n\
    \nThese steps are very important for when we run the Cargo Tracker application\
    \ in the cloud in the following chapters.\n\n# Meet Kubernetes\n\nIn this chapter,\
    \ we will introduce you to Kubernetes. If you are already familiar with this technology,\
    \ feel free to skip this chapter. If you are still with us for the ride, get ready\
    \ to cover the following topics:\n\n- The history of Kubernetes\n- Why would you\
    \ need Kubernetes?\n- The key features of Kubernetes\n- The architecture of Kubernetes\n\
    - Where to run Kubernetes\n- Example of using Kubernetes\n\nAt the end of this\
    \ chapter, you will have a good idea of what container orchestration systems such\
    \ as Kubernetes do, how they work, and how you can utilize them yourself.\n\n\
    ## Technical requirements\n\nThis chapter does not have any technical requirements.\
    \ If you would like to play around with Kubernetes, then here are some projects\
    \ you could give a try. Minikube is a project that installs a one-node cluster\
    \ on your local machine. Another project is Kubernetes in Docker (KinD), which\
    \ starts a set of containers that will start Kubernetes. While these options can\
    \ give you a good impression of what Kubernetes is and how it works, if you want\
    \ to do some serious investigations, you might want to consider a cloud provider\
    \ option. There are many offerings, such as AKS from Azure, GKE from Google, and\
    \ EKS from Amazon. An interesting alternative is K3S from Civo, which uses cheap\
    \ hardware to run Kubernetes.\n\nWe will perform a simple deployment to Kubernetes\
    \ via a locally installed Minikube at the end of this chapter.\n\nBy the end of\
    \ this chapter, you should have a good understanding of the position of Kubernetes\
    \ within a cloud-native landscape. You will also have learned what functionality\
    \ Kubernetes offers.\n"
