    # Introduction to Containers and Docker


    In the previous chapter, you learned how to test the Cargo Tracker application.
    At this point, the Cargo Tracker application is ready to be deployed to different
    environments, machines, and the cloud.


    However, how do you ensure the environment is ready for the Cargo Tracker and
    that it can run there? In this chapter, you will look at how to solve that problem
    using containers and Docker. We will start with what containers are, what they
    can do, and how to create them. When you have the specifications for your container
    ready, you will install Docker and create and run the container.


    In this chapter, we will cover the following main topics:


    +   - What are containers?

    +   - A brief introduction to Docker

    +   - Installing Docker

    +   - Running a Docker container


    By the end of the chapter, you will have a clear understanding of what containers
    are, and how to specify and create them. You will also create a container for
    the Cargo Tracker application that you can run on every machine with Docker.


    # Technical requirements


    For this chapter, you need to have a Cargo Tracker application on your system
    and need the result of the Cargo Tracker application of either Chapter 3, 4, or
    5. To edit the Docker files, you can use any text editor of your choice. We will
    install Docker on a Linux machine. If you want to follow those instructions, you
    will also need a Linux machine or virtual machine. You can also follow the instructions
    on the Docker website: https://docs.docker.com/engine/install/ubuntu/.'
  - '[PAGE 112]


    # What are containers?


    Before we dive deep into what containers are, let us first look at how the landscape
    looked before we had containers and what problems they solved. Before containers,
    deploying applications was a more complex and time-consuming process. Applications
    were deployed to physical servers or virtual machines, and developers had to consider
    all the different operating systems, libraries, and other dependencies that their
    application needed and had to support them. To complicate things even further,
    this had to be done in different staging environments – for example, a development,
    testing, acceptance, or production environment.


    This meant that the process of deploying software was often manual and error-prone.
    Developers had to manually configure and install the required libraries on each
    physical server or virtual machine. This led to inconsistencies between different
    environments and deployment failures, due to missing dependencies, configuration
    issues, and a mismatch in versions of the dependencies used.


    Moreover, deploying software on physical servers could be expensive, as each server
    needed to be provisioned and maintained, and scaling up or down required additional
    hardware purchases and configuration.


    Now that we know what the situation looks like if you don’t use containers, let’s
    see what a container is and how it solves these issues.


    Containers are a technology to package and deploy applications in a portable but,
    most importantly, consistent way. A container is a standalone executable package
    that includes everything your application needs to run – the application itself,
    a runtime, dependencies, configuration, and system tools.


    Containers provide a way to isolate and manage applications and their dependencies
    clearly and consistently, making it easier to run and deploy software to multiple
    different environments. This makes deployments more consistent and reduces the
    number of deployment failures that happen because of missing dependencies and
    missing configuration, problems that you will find as soon as you try to run them
    on your own machine.


    Containers have become a really important and indispensable tool for software
    development and deployment. One popular container technology is Docker; in the
    next section, we will dive deeper into Docker, what it is, and how it runs the
    containers that we create.


    # How are containers created?


    Containers are the end result, but how are they created? A container is made based
    on an image. An image is like a blueprint that tells Docker how to create a container.
    With an image, you can create any number of containers, and they will all be the
    same. Docker will use the image as instructions on how to assemble the container.'
