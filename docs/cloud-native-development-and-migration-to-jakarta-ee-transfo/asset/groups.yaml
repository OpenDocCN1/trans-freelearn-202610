    The following diagram shows the staggering growth of public APIs since 2005:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_45_0.png)


    Figure 2.13 – The rise in the availability of public APIs


    Since those beginning days, the number of public APIs based on REST has steadily
    grown, so much in fact that it is safe to say that REST is now the most common
    type of web service.


    # JSON binding


    JSON binding is an API specification for the serialization of Java objects to
    JSON and vice versa. JSON is a simple format for representing data. It is often
    used instead of XML because it is less verbose. By default, it supports the default
    Java simple data types and their object counterparts. In addition to these, several
    date/time-related classes from the `java.util` package are supported and most
    classes from the `java.time` package. The (de-)serialization of many collection
    interfaces, such as `List`, `Map`, and `Set`, and their implementations in the
    `java.util` package is also supported out of the box.


    Binding a JSON payload from a RESTful call to its object counterpart is mostly
    done automatically by the Java EE REST API runtime. Likewise, converting the resulting
    object of a RESTful call into JSON is also handled automatically by the Java EE
    REST API runtime.'
