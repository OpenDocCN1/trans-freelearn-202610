    \ the operations performed concluded successfully and a commit is performed, or\
    \ some kind of error occurred, and a rollback is performed. A commit will persist\
    \ the outcome of the operation – for example, it will store the updated values\
    \ in the database. A rollback, however, will restore the system to the state it\
    \ was in before starting the transaction.\n\nJava EE supports two types of transaction\
    \ management: **Container Managed Transactions (CMTs)** and **Bean Managed Transactions\
    \ (BMTs)**. If nothing is specified on an EJB, CMTs are the default mechanism.\n"
  mdcn: "\n其他API可能会提供注入注解。例如，JPA中的`@PersistenceUnit`注解，它会注入一个`EntityManagerFactory`对象。\n\
    \n## Java服务面（JSF）\n\nJSF是一种基于服务器端组件的用户界面框架。它是用于在浏览器中渲染用户界面的可用技术之一。Java EE中的UI开发经历了许多迭代，从基本的servlet开始，即HTML被写入输出流。然后，加入了Java服务器页面（JSP），它允许业务逻辑和表示逻辑分离。接着，支持自定义标签库和标准标签库集，即Java标准标签库（JSTL）。最后，出现了JSF。\n\
    \nJSF遵循著名的**模型-视图-控制（MVC）**模式。它是一系列UI小部件和控件的集合。由于它是一个规范，随着时间的推移出现了许多竞争性实现。著名的例子有IceFaces、OpenFaces和MyFaces。\n\
    \n工作流程如下：你有一个网页，在上面添加表示UI元素的JSF自定义标签。每个页面都有一个或多个所谓的支持bean。支持bean由容器运行时管理，它们用于保存UI元素的属性和方法。此外，它们还可以保存事件监听器。\n\
