  md: "\n## Summary\n\nIn this chapter, you have learned how to migrate the Cargo\
    \ Tracker application from Java EE to Jakarta EE. You have learned several ways\
    \ to migrate the code. You have also learned how to upgrade the dependencies of\
    \ the application. Finally, you have learned which application server version\
    \ you should choose for running the Cargo Tracker application and your own applications.\n\
    \nThese steps are all vitally important for what we are going to cover in the\
    \ next chapter, which is upgrading the application to leverage the new functionality\
    \ provided by Jakarta EE 10.\n\n## Modernizing Your Application\n### with the\
    \ Latest Features\n\nThe application you are migrating, which in our case is the\
    \ Cargo tracker application, has not been majorly upgraded in the last few years,\
    \ which has resulted in it missing out on lots of new features and not using features\
    \ that the cloud has to offer, such as monitoring and scaling. In this chapter,\
    \ we are going to focus on Jakarta EE 10 and upgrading an application to cloud-native\
    \ standards. During this chapter, you are going to modernize your application\
    \ so that it is ready to run in the cloud while using the latest features of Jakarta\
    \ EE 10.\n\nIn this chapter, we are going to cover the following topics:\n\n-\
    \ The most significant changes made to Jakarta EE 10\n- Adding the first cloud-native\
    \ feature – resilience\n- Adding the second cloud-native feature – monitoring\n\
    - Using Prometheus and Grafana to visualize the monitoring process\n\nAfter completing\
    \ this chapter, you will be able to upgrade your application to one that can use\
    \ the cloud and the newest features of Jakarta EE 10. You will also know how to\
    \ monitor the health of your application. This will enable you to keep up with\
    \ the newest releases of Jakarta EE.\n\n### Technical requirements\n\nTo follow\
    \ along with this chapter, you need to have finished *Chapter 3*. For this chapter,\
    \ it is important to have an application that runs on Jakarta EE 10 or newer but\
    \ isn’t using the new features yet.\n\n## The most significant changes to Jakarta\
    \ EE 10\n\nJakarta EE 10 is the first edition of Jakarta EE that added functionality\
    \ since joining the Eclipse Foundation. In this section, we will be going over\
    \ the most meaningful changes that were made. It is in no sense meant to be an\
    \ exhaustive overview of all the changes. Neither will we apply these changes\
    \ to our existing Cargo Tracker application. Making these changes would be very\
    \ use-case-specific, such as setting up a different authentication mechanism or\
    \ changing primary keys.\n\n## Core Profile\n\nWe have already pointed out that\
    \ one of the major features was adding the Core Profile. This profile targets\
    \ smaller applications such as microservices. In fact, according to the official\
    \ documentation, it targets modern cloud applications with a focus on a minimal\
    \ set of APIs that support microservices with a focus on enabling implementations\
    \ that make use of ahead-of-time (AOT) compilation builds to minimize startup\
    \ time and memory footprint.\n\nThat is quite a sentence, and to fully understand\
    \ what it means, we are going to break it down. It targets smaller applications.\
    \ That is an interesting observation. In the chapter on the history of Java EE/Jakarta\
    \ EE, you read that the original profiles targeted two kinds of implementations:\
    \ web servers and application servers. The web profiles target smaller applications\
    \ that don’t use many specifications, while the full profiles implemented by application\
    \ servers target larger and more complex applications. These full profile implementations\
    \ provide a variety of functionality to applications that are being deployed on\
    \ those servers: EJBs, security, transaction management, and JNDI, to name a few.\
    \ This is in contrast to the core profile, which targets very precise microservices\
    \ that do not use a lot of the Jakarta specification.\n\nMoving to smaller applications\
    \ contrasts with these full-profile implementations. But it does align with the\
    \ current trend in software architecture, which is that monolithic applications\
    \ are broken down into smaller applications. So, Jakarta EE wants to be a platform\
    \ that allows for microservices.\n\nIt allows for the creation of modern, cloud-native\
    \ applications. We’ve already seen what cloud-native applications all are about.\
    \ To enable this cloud-nativeness, Jakarta EE and Micro Profile can be used since\
    \ they complement each other.\n\nFocus on a minimal set of APIs that support microservices.\
    \ Before the Core Profile arrived, we used the Web Profile to create microservices.\
    \ But in contrast to the Web Profile, the Core Profile only requires seven specifications\
    \ to be available:\n\n- Jakarta Annotations\n- Jakarta CDI Lite\n- Jakarta Dependency\
    \ Injection\n- Jakarta Interceptors\n- Jakarta JSON Processing\n- Jakarta JSON\
    \ Binding\n- Jakarta RESTful Web Services\n\nAnother benefit of only having seven\
    \ specifications that need to be implemented is that it makes it easier to create\
    \ a valid application server that complies with the Jakarta EE 10 core profile\
    \ specification. This allows the community to create more application servers\
    \ that would better fit their use case.\n\nThen, there is a focus on enabling\
    \ implementations that make use of AOT compilation. This is quite a different\
    \ process from the normal JIT compilation that Java runtime uses by default.\n\
    \nNormally, a Java file is compiled into a class file. This is before executing\
    \ the code. During the execution of the code, the **Java Virtual Machine (JVM)**\
    \ translates the bytecode into platform-specific machine code. For this, it has\
    \ two compilers on board, named C1 and C2. C1 quickly produces non-optimized machine\
    \ code. At some point, a method execution count threshold might be passed, and\
    \ then the JVM decides that it is time to optimize the generated machine code.\
    \ This is where the C2 compiler comes in. It will take more time to generate the\
    \ code, but the generated machine code is highly optimized.\n\nIt is important\
    \ to remember that all this compilation is done during the execution of the application.\n\
    \nAOT compilation, on the other hand, is performed before the application is executed.\
    \ In a complicated and time-consuming process, the AOT compiler will walk every\
    \ possible path of execution and generate the required machine code. There are\
    \ several advantages of this:\n\n- There is no need for a full-fledged JVM when\
    \ running the application\n- The application is already in binary format, so no\
    \ time is spent at runtime on the compilation\n- All classes are known at startup,\
    \ so no scanning of JAR/WAR/EAR files is required\n- Optimized memory consumption\n\
    - Quick startup times as everything that needs to start is known upfront\n\nAs\
    \ with so many things, AOT does not come for free. The most notable disadvantages\
    \ are as follows:\n\n- Extremely long compilation times\n- The ability of dynamic\
    \ class loading is lost\n- The generated binary targets a specific platform, losing\
    \ the idea of writing your code once and running it anywhere\n- You lose the ability\
    \ to optimize code execution at runtime like the C2 compiler does\n\nThe most\
    \ famous AOT compiler right now is GraalVM from Oracle. It comes in both open\
    \ source and licensed versions. Though the former provides the most features,\
    \ the latter comes with support and is more optimized.\n\n### Using UUIDs as keys\n\
    \nBefore looking at how to use **Universally Unique Identifiers (UUIDs)**, we\
    \ should define what they are and why you would want to use them. UUIDs are used\
    \ to uniquely identify an object or entity. They are defined in RFC-4122.\n\n\
    There are several different types of UUIDs:\n\n- **Type 1:** Date-time and MAC\
    \ address-based\n- **Type 2:** Date-time, MAC address, and **Distributed Computing\
    \ Environment (DCE)**-based\n- **Type 3:** MD5 hashing of a namespace and a name\n\
    - **Type 4:** Randomly generated numbers\n- **Type 5:** SHA-1 hashing of a namespace\
    \ and a name\n\nThough their name implies that they are always unique, there is\
    \ a possibility of duplicate values. Though it varies per type, the overall possibility\
    \ is so low that it can safely be ignored.\n\nJakarta Persistence can now use\
    \ UUIDs as key values. UUIDs are mostly unique values. This allows them to be\
    \ used as values for keys that require uniqueness. Though duplicates can arise,\
    \ and depending on the chosen type of UUID this possibility might be higher, in\
    \ practice, it is very unlikely to happen.\n\nConsider the following code, which\
    \ does just this:\n\n```\n```java\n@Entity\npublic class Vehicle {\n    @Id\n\
    \    @GeneratedValue(strategy = GenerationType.UUID)\n    private UUID id;\n \
    \   private String license;\n    private String type;\n}\n```\n```\n\nThe ID of\
    \ the Vehicle class is of the java.util.UUID type. The UUID generated by GenerationType.UUID\
    \ is an rfc-4122-compatible UUID.\n\n## Multi-part form parameters\n\nMulti-part\
    \ form data is useful for uploading larger amounts of data, such as a picture\
    \ or the contents of a file.\n\nWhile this is quite common behavior for an application,\
    \ Jakarta EE does not have a standard solution for this in place. Often, developers\
    \ have to rely on non-portable implementations that come from their application\
    \ server vendor.\n"
  mdcn: "\n\n## Summary\n\n在本章中，你学习了如何将 Cargo Tracker 应用从 Java EE 迁移到 Jakarta EE。你学习了多种迁移代码的方法。你还学习了如何升级应用的依赖项。最后，你学习了应为运行\
    \ Cargo Tracker 应用以及你自己的应用选择哪个应用服务器版本。\n\n这些步骤对于我们将在下一章中介绍的内容至关重要，即升级应用以利用 Jakarta\
    \ EE 10 提供的全新功能。\n\n## Modernizing Your Application\n### with the Latest Features\n\
    \n你正在迁移的应用，在我们的例子中是 Cargo Tracker 应用，近年来并未进行重大升级，这导致它错过了许多新功能，并且没有使用云所提供的功能，例如监控和扩展。在本章中，我们将专注于\
    \ Jakarta EE 10 以及如何将应用升级到云原生标准。在本章中，你将使你的应用现代化，使其能够在云中运行，同时使用 Jakarta EE 10 的最新功能。\n\
    \n在本章中，我们将涵盖以下主题：\n\n- Jakarta EE 10 所做的最重要更改\n- 添加第一个云原生功能 – 弹性\n- 添加第二个云原生功能\
    \ – 监控\n- 使用 Prometheus 和 Grafana 可视化监控过程\n\n完成本章后，你将能够将应用升级为可使用云以及 Jakarta EE\
    \ 10 最新功能的应用。你还将知道如何监控应用的健康状况。这将使你能够跟上 Jakarta EE 的最新版本。\n\n### Technical requirements\n\
    \n要跟上本章的学习，你需要完成过 *Chapter 3*。对于本章而言，拥有一个运行在 Jakarta EE 10 或更新版本上但尚未使用新功能的应用是很重要的。\n\
    \n## The most significant changes to Jakarta EE 10\n\nJakarta EE 10 是加入 Eclipse\
    \ 基金会以来首次增加功能的 Jakarta EE 版本。在本节中，我们将介绍所做的最有意义的更改。它绝不是对所有更改的详尽概述。我们也不会将这些更改应用到现有的\
    \ Cargo Tracker 应用。进行这些更改将非常依赖于具体用例，例如设置不同的身份验证机制或更改主键。\n\n## Core Profile\n\n\
    我们已经指出，增加 Core Profile 是主要功能之一。该配置文件针对较小的应用，例如微服务。事实上，根据官方文档，它针对的是现代云应用，重点是一个最小的\
    \ API 集合，支持微服务，并侧重于启用使用即时编译 AOT 编译构建的实现，以最小化启动时间和内存占用。\n\n这是一个相当长的句子，为了完全理解它的含义，我们将对其进行分解。它针对较小的应用。这是一个有趣的观察。在关于\
    \ Java EE/Jakarta EE 历史的章节中，你读到原始的配置文件针对两种类型的实现：Web 服务器和应用服务器。Web 配置文件针对的是不使用许多规范的较小应用，而由应用服务器实现的完整配置文件则针对更大、更复杂的应用。这些完整配置文件实现为部署在这些服务器上的应用提供各种功能：EJB、安全、事务管理、JNDI\
    \ 等。这与核心配置文件形成对比，后者针对的是不使用太多 Jakarta 规范的非常精确的微服务。\n\n转向较小的应用与这些完整配置文件实现形成对比。但它与当前软件架构的趋势一致，即单体应用被拆分为较小的应用。因此，Jakarta\
    \ EE 希望成为一个允许微服务的平台。\n\n它允许创建现代、云原生的应用。我们已经看到云原生应用都是关于什么的。为了实现这种云原生性，可以使用 Jakarta\
    \ EE 和 Micro Profile，因为它们彼此互补。\n\n专注于支持微服务的最小 API 集合。在 Core Profile 出现之前，我们使用\
    \ Web Profile 来创建微服务。但与 Web Profile 不同，Core Profile 只要求有七个规范可用：\n\n- Jakarta Annotations\n\
    - Jakarta CDI Lite\n- Jakarta Dependency Injection\n- Jakarta Interceptors\n-\
    \ Jakarta JSON Processing\n- Jakarta JSON Binding\n- Jakarta RESTful Web Services\n\
    \n仅有七个需要实现的规范的另一个好处是，它使得创建符合 Jakarta EE 10 core profile 规范的有效应用服务器变得更容易。这使得社区能够创建更适合其用例的应用服务器。\n\
    \n然后，重点是启用使用 AOT 编译的实现。这与 Java 运行时默认使用的正常 JIT 编译过程大不相同。\n\n通常，Java 文件在执行代码之前被编译成类文件。在代码执行期间，**Java\
    \ Virtual Machine (JVM)** 将字节码翻译成平台特定的机器码。为此，它内置了两个编译器，名为 C1 和 C2。C1 快速生成未优化的机器码。在某个时刻，方法执行计数阈值可能会被通过，然后\
    \ JVM 决定是时候优化生成的机器码了。这就是 C2 编译器发挥作用的地方。它生成代码所需的时间更长，但生成的机器码高度优化。\n\n重要的是要记住，所有这些编译都是在应用执行期间完成的。\n\
    \n另一方面，AOT 编译是在应用执行之前进行的。在一个复杂且耗时的过程中，AOT 编译器将遍历每一种可能的执行路径并生成所需的机器码。这有几个优点：\n\n\
    - 运行应用时无需完整的 JVM\n- 应用已处于二进制格式，因此在运行时无需花费时间进行编译\n- 所有类在启动时已知，因此无需扫描 JAR/WAR/EAR\
    \ 文件\n- 优化的内存消耗\n- 快速启动时间，因为所有需要启动的内容都是预先知道的\n\n与许多事情一样，AOT 并非免费。最显著的缺点如下：\n\n\
    - 极长的编译时间\n- 动态类加载的能力丢失\n- 生成的二进制文件针对特定平台，失去了编写一次到处运行的理念\n- 你失去了像 C2 编译器那样在运行时优化代码执行的能力\n\
    \n目前最著名的 AOT 编译器是来自 Oracle 的 GraalVM。它有开源和许可两种版本。虽然前者提供最多的功能，但后者附带支持并且更优化。\n\n\
    ### Using UUIDs as keys\n\n在了解如何使用 **Universally Unique Identifiers (UUIDs)**\
    \ 之前，我们应该定义它们是什么以及为什么你会想使用它们。UUID 用于唯一标识对象或实体。它们在 RFC-4122 中定义。\n\nUUID 有几种不同的类型：\n\
    \n- **Type 1:** 基于日期时间 and MAC 地址\n- **Type 2:** 基于日期时间、MAC 地址和 **Distributed\
    \ Computing Environment (DCE)**\n- **Type 3:** 命名空间和名称的 MD5 哈希\n- **Type 4:**\
    \ 随机生成的数字\n- **Type 5:** 命名空间和名称的 SHA-1 哈希\n\n尽管其名称暗示它们总是唯一的，但存在重复值的可能性。尽管因类型而异，但总体可能性极低，可以安全地忽略。\n\
    \nJakarta Persistence 现在可以使用 UUID 作为键值。UUID 主要是唯一值。这使它们可用于需要唯一性的键的值。虽然可能出现重复，并且根据所选的\
    \ UUID 类型这种可能性可能更高，但在实践中发生的可能性极低。\n\n考虑以下代码，它正是这样做的：\n\n```\n```java\n@Entity\n\
    public class Vehicle {\n    @Id\n    @GeneratedValue(strategy = GenerationType.UUID)\n\
    \    private UUID id;\n    private String license;\n    private String type;\n\
    }\n```\n```\n\nVehicle 类的 ID 是 java.util.UUID 类型。由 GenerationType.UUID 生成的 UUID\
    \ 是一个 rfc-4122 兼容的 UUID。\n\n## Multi-part form parameters\n\n多部分表单数据对于上传大量数据很有用，例如图片或文件的内容。\n\
    \n虽然这对于应用来说是很常见的行为，但 Jakarta EE 目前没有为此提供标准解决方案。通常，开发人员不得不依赖来自其应用服务器供应商的不可移植实现。\n\
    \n"
