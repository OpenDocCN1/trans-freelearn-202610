    Cargo Tracker 应用使用 CMTs，并通过 `@Transactional` 和 `@TransactionAttribute` 注解来配置事务管理。


    ### Batch


    Java EE 平台包含运行批处理作业的功能。这些作业可以在无需任何用户交互的情况下运行。批处理作业的示例包括财务中的月末处理、生成报告，或定期检查文件系统是否有需要处理的新文件。


    这些批处理作业的共同点是，它们都由一个或多个需要执行的步骤组成。在 Java EE 中，批处理作业及其步骤在 XML 文件中描述。每个步骤要么是 Chunk
    要么是 Task。Chunk 步骤可以同时在多个线程中执行，而 Task 不能。


    将多个步骤分组在一起称为 flow。分组后，它们作为一个单元执行。可以并行执行的多个 flows 称为 split。


    ### Summary


    Cargo Tracker 应用内部包含大量优秀的技术。它是一个为突出 Java EE 是构建应用的优秀框架而构建的应用。在本书中，我们将把 Cargo Tracker
    应用迁移到更优秀的 Jakarta EE 框架。


    该应用用于预订新货物并跟踪已预订货物。跟踪视图显示货物的状态。管理界面显示状态并允许您预订和路由货物。


    我们还介绍了 Cargo Tracker 应用中使用的一些 Java EE 技术并解释了其用法。


    ## Part 2: Modern Jakarta EE


    在本部分，我们将向您展示如何现代化 Cargo Tracker 应用。掌握必要的知识后，您将学习如何将这些技术应用于需要迁移的其他应用。我们涵盖了您可以用来从
    Java EE 迁移到 Jakarta EE 的不同工具以及这些工具的工作方式。借助使用 Jakarta EE 10 的应用，我们将向您展示如何对其进行现代化并使用最佳实践使应用成为云原生，同时保持强大的测试覆盖率。


    本部分包含以下章节：


    - Chapter 3, Moving from Java EE to Jakarta EE

    - Chapter 4, Modernizing Your Application with the Latest Features

    - Chapter 5, Making Your Application Testable


    ## Moving from Java EE to Jakarta EE


    在上一章中，您了解了 Cargo Tracker 应用的工作原理和技术细节。您现在应该对该应用的功能相当熟悉，并对底层技术有基本了解。


    在本章中，我们将涵盖以下主要主题：


    - Migrating namespaces

    - Migrating dependencies

    - Upgrading your application server


    升级到 Jakarta EE 9 是使现有应用能够使用 Jakarta EE 规范工作的第一步。我们特意选择这种方法，因为我们从经验中了解到这是更简单的方法。一旦我们完全进入
    Jakarta EE 生态系统，我们就可以开始升级到 Jakarta EE 10 中提供的新的功能。这将在下一章中介绍。


    ### Technical requirements


    您需要一些工具来迁移命名空间。其中一些工具取决于操作系统。您应选择最适合您特定情况的方法。对于每个主要操作系统：Linux、Windows 和 macOS，都会有不止一个选项可用。


    这里提供的一些解决方案需要额外软件的存在：一些是开源的，一些需要付费许可证。


    您还需要某种编辑器或集成开发环境（IDE）来更改部分源代码。我们将由您自行选择工具。


    ### It’s all about namespaces


    当 Oracle 将 Java EE 转移到 Eclipse 基金会时，没有人能预见到接下来会发生什么。Eclipse 基金会及其众多志愿者开始着手更新代码和文档，以反映从
    Oracle 到 Eclipse 基金会的变更。谈判持续了数月，试图就 Jakarta EE 规范中 `javax` 包命名空间的演进达成一致。不幸的是，由于无法克服的版权问题，这一努力失败了。因此，`javax`
    命名空间只能“按原样”与 Jakarta 组件规范一起使用，这意味着任何随时间演进的规范都需要将其命名空间从 Java EE 规范更改为 Jakarta EE
    规范。此外，缩写也需要更改；例如，**Enterprise JavaBeans (EJB)** 变成了 Jakarta Enterprise Beans。


    版本 8 是 Java EE 规范的最后一个版本。Jakarta EE 版本 8 完全相同，但由 Eclipse 处的源代码构建。


    Jakarta EE 9 在功能上等于 Jakarta EE 8，但命名空间现已从 `javax` 重命名为 `jakarta`。


    以下是所有更改的命名空间的概述，其原始缩写以及新的命名空间和缩写。


    | Java EE namespace | Jakarta EE namespace |

    | --- | --- |

    | `javax.activation` | `jakarta.activation` |

    | `javax.annotation` | `jakarta.annotation` |

    | `javax.batch` | `jakarta.batch` |

    | `javax.cache` | `jakarta.cache` |

    | `javax.decorator` | `jakarta.decorator` |

    | `javax.ejb` | `jakarta.ejb` |

    | `javax.el` | `jakarta.el` |

    | `javax.enterprise` | `jakarta.enterprise` |

    | `javax.inject` | `jakarta.inject` |

    | `javax.interceptor` | `jakarta.interceptor` |

    | `javax.jms` | `jakarta.jms` |

    | `javax.json` | `jakarta.json` |

    | `javax.jws` | `jakarta.jws` |

    | `javax.management` | `jakarta.management` |

    | `javax.persistence` | `jakarta.persistence` |

    | `javax.resource` | `jakarta.resource` |

    | `javax.security` | `jakarta.security` |

    | `javax.servlet` | `jakarta.servlet` |

    | `javax.transaction` | `jakarta.transaction` |

    | `javax.validation` | `jakarta.validation` |

    | `javax.websocket` | `jakarta.websocket` |

    | `javax.ws.rs` | `jakarta.ws.rs` |

    | `javax.xml` | `jakarta.xml` |


    *Table 3.1 – Namespace changes*


    ### Migrating strategies


    从应用开发者的角度来看，所有这些中最痛苦的部分是命名空间已经更改。这意味着迁移到 Jakarta 涉及重构代码库中所有 Java EE import 语句。在较小程度上，项目的
    POM 文件也需要进行更改。


    在本节中，我们将研究三种迁移项目的方法。我们将使用以下工具进行操作：


    - An open source multiplatform editor

    - The sed command line tool

    - A specialized plugin for your IDE


    但在这样做之前，最好先在 Git 中创建一个新分支，其中将包含我们更新后的源代码。


    在 cargotracker 目录内输入以下命令：


    ```

    git checkout -b jakarta-ee9

    ```


    Git 将回复消息 `Switched to a new branch ''jakarta-ee9''`。


    如果您想立即将此新本地分支推送到远程服务器，可以通过输入以下命令来实现：


    ```

    git push -u origin jakarta-ee9:jakarta-ee9

    ```


    您可能更喜欢先进行必要的更改，然后再提交和推送。在这种情况下，您现在可以跳过立即将新分支推送到远程服务器。


    '
