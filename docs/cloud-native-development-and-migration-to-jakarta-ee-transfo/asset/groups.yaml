  mdcn: "\n\n## 技术要求\n\n对于本章，你需要在系统上安装 Docker。有关详细说明，请参阅第 6 章，其中涵盖了 Docker 的完整安装。我们将使用\
    \ Docker 来启动集成测试的实例。本章的第一部分可以在没有 Docker 的情况下完成；然而，为了从本章中获得最大价值，安装 Docker 很重要。\n\
    \n你可以在 GitHub 上找到本章的所有代码示例：https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE/tree/chapter-5。该仓库包含本章的所有示例。\n\
    \n## 测试对迁移的影响\n\n测试是衡量你的迁移是否成功或项目中仍需修复某些部分的绝佳工具。当所有测试都能正常工作时，意味着这些测试覆盖的功能与迁移前一样正常工作。也有可能在迁移过程中某些测试开始失败，这意味着迁移的某些部分破坏了功能。\n\
    \n如果你要迁移的项目已有足够的测试来覆盖功能，你可以快速浏览本章，看看是否有新的内容想要纳入你的测试策略，或看到测试 Java 应用的替代方法。迁移应用时，不必彻底改造当前的测试策略。\n\
    \n如果要迁移的项目几乎没有测试，添加测试可以极大地帮助你，因为测试会指示项目是否仍在正常工作。本章介绍的是编写测试并为你要迁移的项目提供测试覆盖率的众多方法之一。还有很多其他值得考虑的用于测试应用的库，例如\
    \ Arquillian、Jakarta REST client 和 MicroProfile REST client。\n\n## 衡量项目的代码覆盖率\n\
    \n拥有测试是很好的，但你知道项目中有多少部分被项目内的测试覆盖了吗？这就是测试覆盖率的作用。测试覆盖率告诉你有多少生产代码被测试覆盖。这告诉你哪些功能被测试覆盖，哪些功能必须手动测试。\n\
    \n当你使用 IntelliJ 时，衡量测试覆盖率非常容易。你只需导航到一个测试类。在测试类中，你可以右键单击该类以带覆盖率运行测试，或者也可以从菜单选项中带覆盖率运行测试，如以下屏幕截图所示：\n\
    \nFigure 5.1 – Running tests with coverage\n\n运行带覆盖率的测试后，你会看到一份报告，显示有多少生产代码被测试覆盖。它看起来是这样的：\n\
    \nFigure 5.2 – Test coverage result\n\n在之前的屏幕截图中，你可以看到各个类的测试覆盖率以及类被覆盖的百分比。RouteSpecification\
    \ 类仅覆盖了 55%。这意味着并非每个方法都被覆盖。当你查看行覆盖率时，你会看到只有略多于一半的行被覆盖。\n\n你应该追求多少百分比的测试覆盖率？这取决于许多因素。它应该是你和你的团队感到舒适的百分比，并且能让你很有信心迁移后的功能继续正常工作。这可能是\
    \ 60%、90% 甚至 100%。重要的是，它应该帮助你在迁移中前进，而不是阻碍你。\n\n## 关于 TDD 的一句话\n\n一章关于测试的内容不可能缺少关于\
    \ TDD 的部分。顾名思义，测试代码驱动你生产代码的开发。当你使用 TDD 时，你首先通过例如 JUnit 创建一个测试用例。在 Java 中，它看起来像这样：\n\
    \n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n}\n```\n```\n\n最后一个示例显示了一个空的测试方法。TDD\
    \ 的冒险从这里开始。从现在开始，在测试通过之前，你不应该开发任何生产代码。这意味着如果我们想开发新功能，我们首先需要一个失败的或无法编译的测试。\n\n\
    第一步可以是创建你需要的实例。这允许你创建一个类来保存业务逻辑。它可以简单到以下内容：\n\n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n\
    \n    RoutingHelper routingHelper = new RoutingHelper();\n}\n```\n```\n\n如果你尝试运行/编译项目，你会得到一个异常，说类似类或引用丢失或不存在。那是完全正确的，也是有效的，因为它在项目中还不存在。当你进行\
    \ TDD 时，你首先想要一个可以修复的失败测试。这是 TDD 的红绿循环的一部分。你从一个失败的测试开始（红），然后使其通过（绿）。为了让测试工作，你只需要创建一个\
    \ RoutingHelper 类并将其作为导入添加到测试类中。\n\n以下是会使测试再次编译的 RoutingHelper 类的示例：\n\n```\n\
    ```java\npublic class RoutingHelper {\n}\n```\n```\n\n当你添加了之前的示例类后，你就有一个可工作的（绿）测试。下一步将是再次使测试失败（红）。你可以通过添加一个你希望\
    \ `RoutingHelper` 类具有的方法调用来做到这一点。下一个示例展示了如何在测试方法内添加方法调用来实现这一点：\n\n```\n```java\n\
    @Test\nvoid goesToNetherlands_success() {\n    RoutingHelper routingHelper = new\
    \ RoutingHelper();\n    routingHelper.goesToNetherlands();\n\n}\n```\n```\n\n\
    当你添加方法调用时，测试再次失败，因为该方法还不存在。创建此方法将是下一步。我们刚刚经历了 TDD 的红绿循环。我们从一个失败的测试开始，修复它，使测试通过，然后再次使其失败。这是\
    \ TDD 的基础，当你开发新功能时，你希望从一个失败的测试开始并尝试使其通过。这将是新的红绿循环的开始。TDD 可以应用于你编写的任何代码或测试；这可以是单元测试或集成测试。当你对集成测试使用\
    \ TDD 时，真的要尽量保持测试执行的速度很快，因为你将多次执行测试。\n\n## 如何创建单元测试\n\n在 Java 中，测试通常通过单元测试完成。当人们谈论测试覆盖率或你的代码是否有测试时，他们最常指的是单元测试。单元测试是一种测试代码最小单元的方法。对于\
    \ Java 来说，代码的最小单元通常是一个单一方法。通过单元测试，我们一次只测试一个单一方法。听起来很简单，对吧？如果它不依赖于另一个类、包、数据库，甚至框架或整个应用程序，测试单个方法很容易。那时单元测试往往变得困难，测试代码变得一团糟，没人再想碰它。我们想要防止这种情况，所以我们从基础开始，从一个单一的单元测试开始构建我们的测试策略。\n\
    \n## 单元测试所需的工具和库\n\n本章中你要编写的单元测试依赖于两个非常流行的测试库，JUnit 和 Mockito。对于单元测试本身，我们将使用 JUnit，并使用\
    \ Mockito 来模拟代码所拥有的任何依赖项。这两个库非常有帮助，并且几乎是每个项目都必不可少的。\n\nJUnit 帮助你编写实际的单元测试。借助其内置的注解，它使你能够标记方法并将其连接到测试生命周期的不同部分。测试生命周期帮助你为测试准备对象实例。另一个必不可少的库是\
    \ Mockito。Mockito 是一个库，可以以简单直接的方式帮助你创建现有类的模拟。正如你将在后面的示例中看到的，模拟的创建是为了让我们不必与类的真实实例和数据库交互。\n\
    \n"
