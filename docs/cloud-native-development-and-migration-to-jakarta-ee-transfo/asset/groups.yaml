    \ package.\n\n# Transactions\n\nOne of the fundamental features of business data\
    \ is integrity. Should this be lost, any decision-making on this data becomes\
    \ walking on quicksand. Transactions help maintain data integrity.\n\nIt does\
    \ this in two ways; firstly, by controlling concurrent access to the data and\
    \ secondly, by restoring the data to its previous state in case of a system failure.\
    \ The outcome of a transaction can only ever be one of two possibilities: either\
    \ the operations performed concluded successfully and a commit is performed, or\
    \ some kind of error occurred, and a rollback is performed. A commit will persist\
    \ the outcome of the operation – for example, it will store the updated values\
    \ in the database. A rollback, however, will restore the system to the state it\
    \ was in before starting the transaction.\n\nJava EE supports two types of transaction\
    \ management: **Container Managed Transactions (CMTs)** and **Bean Managed Transactions\
    \ (BMTs)**. If nothing is specified on an EJB, CMTs are the default mechanism."
