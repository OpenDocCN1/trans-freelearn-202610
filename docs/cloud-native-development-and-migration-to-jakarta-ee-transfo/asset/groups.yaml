    \ rest-assured 对该实例进行 HTTP 调用测试。\n\n在下一章中，我们将更深入地探讨如何将 Docker 和容器与 Cargo Tracker\
    \ 应用结合使用。\n\n# 第三部分：拥抱云\n\n在本部分中，你将深入探讨如何将 Cargo Tracker 应用进行改造，使其无缝拥抱云。借助现在运行在\
    \ Jakarta 10 上的应用，你将学习如何创建 Docker 容器，并在 Kubernetes 集群上运行它。随后，你将了解云原生的本质，以及如何在\
    \ Azure 云环境中部署应用。本部分最后有一章关于 MicroProfile 的内容，因为它有助于 Jakarta EE 真正实现云原生。\n\n本部分包含以下章节：\n\
    \n- 第 6 章：容器与 Docker 简介\n- 第 7 章：认识 Kubernetes\n- 第 8 章：什么是云原生\n- 第 9 章：在云中部署\
    \ Jakarta EE 应用\n- 第 10 章：MicroProfile 简介\n- 附录 A：Java EE 到 Jakarta EE 名称\n- 附录\
    \ B：即服务\n\n## 容器与 Docker 简介\n\n在上一章中，你学习了如何测试 Cargo Tracker 应用。至此，Cargo Tracker\
    \ 应用已准备好部署到不同的环境、机器和云中。\n\n然而，如何确保环境已为 Cargo Tracker 做好准备，并且它能在其中运行呢？在本章中，你将了解如何使用容器和\
    \ Docker 来解决这个问题。我们将从什么是容器、容器能做什么以及如何创建容器开始。当你准备好容器的规范后，你将安装 Docker，并创建和运行容器。\n\
    \n在本章中，我们将涵盖以下主要内容：\n\n- 什么是容器？\n- Docker 简要介绍\n- 安装 Docker\n- 运行 Docker 容器\n\n\
    到本章结束时，你将清楚了解什么是容器，以及如何定义和创建它们。你还将为 Cargo Tracker 应用创建一个容器，并可在装有 Docker 的任何机器上运行它。\n\
    \n### 技术要求\n\n本章要求你的系统上有一个 Cargo Tracker 应用，并且需要第 3、4 或 5 章中任一章节的 Cargo Tracker\
    \ 应用成果。要编辑 Docker 文件，你可以使用任意文本编辑器。我们将在 Linux 机器上安装 Docker。如果你想按照这些说明操作，还需要一台 Linux\
    \ 机器或虚拟机。你也可以按照 Docker 网站上的说明进行操作：https://docs.docker.com/engine/install/ubuntu/。\n\
    \n### 什么是容器？\n\n在深入探讨什么是容器之前，让我们先看看没有容器之前的情况，以及容器解决了哪些问题。在容器出现之前，部署应用是一个更复杂、更耗时的过程。应用被部署到物理服务器或虚拟机上，开发人员必须考虑其应用所需的所有不同操作系统、库和其他依赖项，并加以支持。更复杂的是，这还必须在不同的阶段环境中完成——例如，开发、测试、验收或生产环境。\n\
    \n这意味着部署软件的过程通常是手动且容易出错的。开发人员必须在每台物理服务器或虚拟机上手动配置和安装所需的库。这导致了不同环境之间的不一致，以及由于依赖缺失、配置问题和所用依赖版本不匹配而导致的部署失败。\n\
    \n此外，在物理服务器上部署软件可能成本高昂，因为每台服务器都需要配置和维护，而扩容或缩容还需要额外购买硬件并进行配置。\n\n现在，我们了解了不使用容器时的情况，接下来看看什么是容器，以及它如何解决这些问题。\n\
    \n容器是一种以可移植但最重要的是一致的方式来打包和部署应用的技术。容器是一个独立的可执行包，包含应用运行所需的一切——应用本身、运行时、依赖项、配置和系统工具。\n\
    \n容器提供了一种清晰且一致地隔离和管理应用及其依赖项的方式，使得在多个不同环境中运行和部署软件变得更加容易。这使部署更加一致，并减少了因依赖缺失和配置缺失而导致的部署失败次数，这些问题一旦你尝试在自己的机器上运行它们，就会立刻遇到。\n\
    \n容器已成为软件开发和部署中非常重要且不可或缺的工具。一种流行的容器技术是 Docker；在下一节中，我们将更深入地探讨 Docker 是什么，以及它如何运行我们创建的容器。\n\
    \n### 容器是如何创建的？\n\n容器是最终结果，但它是如何创建的呢？容器是基于镜像构建的。镜像就像一个蓝图，告诉 Docker 如何创建容器。有了镜像，你可以创建任意数量的容器，而且它们都是一样的。Docker\
    \ 将镜像用作组装容器的指令。\n\n"
