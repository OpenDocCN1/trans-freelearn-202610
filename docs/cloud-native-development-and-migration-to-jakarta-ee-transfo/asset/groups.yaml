    # Introducing the Cargo Tracker Application


    In this chapter, we will introduce the Cargo Tracker application, which was built
    using Java EE 7. We will use the Cargo Tracker application throughout this book.
    This is the application we will migrate from Java EE 7 to Jakarta EE 10. Before
    we start migrating the application, it is good to understand the Cargo Tracker
    application. This chapter will provide an overview of the Cargo Tracker application
    and its features, as well as its current architecture and design.


    Additionally, we will go through the various components of the Cargo Tracker application
    and how they interact with each other. We will cover topics such as the use of
    REST, WebSockets, and JavaServer Faces (JSF) for presentation, Enterprise Java
    Beans (EJB) for business logic, and Java Persistence (JPA) for data persistence.
    We will also highlight the use of Contexts and Dependency Injection (CDI) for
    dependency management between components.


    In this chapter, we will cover the following topics:


    +   - Installing and running the Cargo Tracker application

    +   - What can the Cargo Tracker application do?

    +   - Java EE features used in the Cargo Tracker application


    By the end of this chapter, you will have a solid understanding of the Cargo Tracker
    application and its underlying technology stack. This will serve as a foundation
    for the rest of this book, where we will delve deeper into the specifics of migrating
    the Cargo Tracker application to Jakarta EE 10.'
