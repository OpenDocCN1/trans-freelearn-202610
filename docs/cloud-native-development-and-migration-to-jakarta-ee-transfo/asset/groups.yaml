    \n读完*云原生开发与Jakarta EE迁移*后，我们很乐意听到你的想法！请点击此处直接前往本书的亚马逊评论页面分享你的反馈。\n\n你的评论对我们和技术社区都很重要，并将帮助我们确保提供卓越品质的内容。\n\
    \n## 第1部分：Java EE与Jakarta EE的历史\n\n在这一部分，你将纵览企业级Java的历史，以及我们将在本书中迁移的应用程序。历史背景将阐明从Java\
    \ EE的转型，并强调迁移到Jakarta EE 10的必要性。这部分还将包含Jakarta EE为简化应用程序开发所做的更改。Cargo Tracker的介绍将帮助你熟悉该应用程序，从而让你了解我们在迁移什么以及会遇到哪些挑战。\n\
    \n本部分包含以下章节：\n\n- 第1章，企业级Java的历史\n- 第2章，Cargo Tracker应用程序简介\n\n## 企业级Java的历史\n\
    \n在本章中，我们将回顾Java EE和Jakarta EE的历史。自创立以来，Java企业技术曾有过多个名称——最初是J2EE，随后更名为JEE，接着是Java\
    \ EE，最后是Jakarta EE。\n\n在本章中，我们将涵盖以下主题：\n\n- 什么是Java EE，以及为何要创建它？\n- Web服务器与应用服务器\n\
    - Java EE 5，第一个用户友好的版本\n- Java EE自版本5以来新增关键特性的历史\n\n到本章结束时，你将对Java EE和Jakarta\
    \ EE有一个更深入的历史性理解，并会了解Java EE新增的一些关键特性。Jakarta EE的更改将在后续章节中讨论。\n\n### 什么是Java EE，以及为何要创建它？\n\
    \nJava语言于1996年问世。它由一个编译器和一台Java虚拟机组成。这两个组件都依赖于平台，这意味着针对Windows、Linux、macOS等平台，需要有不同的版本。这被称为**Java标准版（Java\
    \ SE）**。\n\nJava语言的独特之处在于，它不编译为原生机器代码，而是编译为一种被称为**字节码**的东西。这种字节码与平台无关，意味着它可以被传输到前述任何平台。\n\
    \n要执行字节码，你需要一个**Java虚拟机（JVM）**。JVM将中间字节码转换为特定于其执行平台的机器代码。\n\n这种编译为字节码并能在任何平台上执行的原则被称为**一次编写，到处运行（WORA）**。这已被证明是Java在商业环境中取得成功的显著特性。\n\
    \n最初，Java被设计在浏览器中运行，即在所谓的小应用程序中运行。这些小应用程序为早期浏览器（如微软的Internet Explorer和网景的Navigator）增加了许多功能。\n\
    \nJava的免费版本被提供给了几个流行的平台，这帮助了该语言的迅速成功。\n\n第三方可以获得JVM规范许可，从而构建自己的编译器和JVM实现。多家公司已经这样做了，这意味着现在有多个供应商提供自己的实现。最常见的如下（按字母顺序排列）：\n\
    \n- Alibaba Dragonwell\n- Amazon Corretto\n- Azul Zulu\n- BellSoft Liberica\n\
    - Eclipse Adoptium Temurin\n- J9\n- Oracle JDK and OpenJDK\n- Red Hat OpenJDK\n\
    - SAP SapMachine\n\n但不久，Java从浏览器领域转向了商业世界。很明显，开发业务应用程序需要语言本身不具备的额外功能。\n\n与其将这些功能添加到语言本身，不如让一组独立的API来提供。为了避免混淆并区分Java\
    \ SE和这些新API，它们被称为**Java企业版**（Java EE）。\n\nJava EE增加了事务、安全性、可扩展性、组件管理和并发等特性。它允许你创建动态Web应用程序，并为分布式事务提供了强大的平台。\n\
    \n### Web服务器与应用服务器\n\n**Web服务器**和**应用服务器**这两个术语经常被Java EE新手混淆并互换使用，尽管这并不正确。在本节中，我们将重点说明两者之间的差异，因为我们相信，作为Java\
    \ EE的关键组件，了解二者之间的差异很重要，而且两者各自扮演着不同的角色。\n\n要开始理解它们之间的区别，最好的方法是突出它们各自的目标。\n"
