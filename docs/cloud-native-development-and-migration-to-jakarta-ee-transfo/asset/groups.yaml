    \ to see if it runs without failure.\n\nHere is a scenario: the circuit breaker\
    \ keeps a *failure ratio* for a rolling window of requests. Once the threshold\
    \ failure ratio is passed, the circuit breaker will open. Any requests that are\
    \ sent will immediately lead to a `CircuitBreakerOpenException` error. After a\
    \ configurable delay, the circuit breaker moves into a half-open state. Then,\
    \ it probes a configurable number of trial executions. If any of them fails, it\
    \ moves into the open state again. If no errors are found during all the trial\
    \ executions, the circuit breaker is closed again, and traffic will flow freely\
    \ to the component again.\n\nHere's a typical usage example of `@CircuitBreaker`\
    \ with the default values specified:\n\n```java\n@CircuitBreaker(delay = 5000,\
