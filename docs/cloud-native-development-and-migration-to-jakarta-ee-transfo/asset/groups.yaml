  - "[PAGE 114]\n\n# Installing Docker\n\nIn this section, we will install Docker\
    \ on a Linux machine. The first step is to obtain a copy of Docker. You can download\
    \ it from their site: https://docs.docker.com/desktop/install/linux-install/#supported-platforms.\
    \ There, you can select the platform/distribution of Linux that you use. For the\
