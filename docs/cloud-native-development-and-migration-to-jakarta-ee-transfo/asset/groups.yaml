    \ the container. In this case, the return value you will see in the console is\
    \ the following:\n\n```\nc9\n```\n\nWhen the kill command has finished executing,\
    \ you can run the docker ps command again, and note that there is no container\
    \ running anymore. The output in the console will look like this:\n\n```\n$ docker\
    \ ps\nCONTAINER\nID      IMAGE      COMMAND      CREATED      STATUS      PORTS\
    \      NAMES\n```\n\n# Using Docker Compose\n\nDocker Compose is a powerful tool\
    \ that is used to define and run multi-container Docker applications. It enables\
    \ you to define the services, networks, and volumes required for an application\
    \ in a single YAML file. This file defines the containers for each service, their\
    \ configuration, and dependencies. We are especially interested in storing our\
    \ configuration in this file. Doing so makes starting the container easier because\
    \ we don't have to specify the container name or the ports we want to expose.\
    \ We only have to define them once in docker-compose.yml.\n\n# Creating a Docker\
    \ Compose file\n\nTo use Docker Compose, we need to create a docker-compose.yml\
    \ file that Docker can use. Navigate to the root of the Cargo Tracker application\
    \ and create a YAML file named docker-compose.yml. Make the docker-compose.yml\
    \ look like the following:\n\n```\nversion: \"3.9\"\nservices:\n  cargo-tracker-app:\n\
    \    build: .\n    ports:\n      - \"4848:4848\"\n      - \"8080:8080\"\n    \
    \  - \"8181:8181\"\n      - \"9009:9009\"\n```\n\nThis is everything we need inside\
    \ the docker-compose.yml file. This Docker Compose file creates a service called\
    \ cargo-tracker-app that runs in a container and exposes its services on the specified\
    \ ports.\n\nOn the first line, we define the version in which this Docker Compose\
    \ file is written. This file uses version 3.9. The file defines a single service\
    \ called cargo-tracker-app, which is built from the current directory (specified\
    \ with .). The ports section defines the ports on which the container's"
  - "[PAGE 120]\n\nservices can be accessed. In this case, it maps the container's\
    \ 4848, 8080, 8181, and 9009 ports to the corresponding ports on the host machine,\
    \ making them accessible externally.\n\nThe build section indicates that the service\
    \ will be built from the Dockerfile in the current directory. This means that\
    \ Docker Compose will create an image for the container by running the `docker\
    \ build` command, using the Dockerfile in the current directory.\n\n# ## Using\
    \ Docker Compose\n\nTo start all the services in `docker-compose.yml`, run the\
    \ following command:\n\n```\n```\ndocker compose up\n```\n```\n\nThis will build\
    \ the container for the Cargo Tracker application using the Dockerfile in the\
    \ current directory and starting it. Because we also specified the ports inside\
    \ the Docker Compose file, we don't have to specify them in the command. When\
    \ you see the following text in the console, you will know that the container\
    \ has started and is ready to be accessed:\n\n```\n```\ncargotracker-cargo-tracker-app-1\
    \ | cargo-tracker was successfully deployed in 9,380 milliseconds. [#]\n```\n\
    ```\n\nYou can now go to the following URL and see that the container and the\
    \ Cargo Tracker application are running: `http://localhost:8080/cargo-tracker/`.\n\
    \nTo see that all the ports are mapped to their corresponding port on the host\
    \ machine, run the following command:\n\n```\n```\ndocker ps\n```\n```\n\nThe\
    \ result will look like this:\n\n```\n```\nCONTAINER         IMAGE           \
    \            COMMAND                  CREATED         STATUS         PORTS   \
    \                NAMES\n  ID\n93a1813c884c      cargotracker-cargo-tracker-app\
    \ \"/tini -- /bin/sh 30 minutes ago  Up 14 seconds  0.0.0.0:4848->4848/tcp,  cargotracker-cargo-tracker-app-1\n\
    \                  -c \"\"                                        0.0.0.0:8080->8080/tcp,\
    \ 0.0.0.0:8181->8181/tcp, 0.0.0.0:9009->9009/tcp\n```\n```\n\nUnder the port section,\
    \ you can verify that the ports are mapped in the same we as we have specified\
    \ in the `docker-compose.yml` file.\n\n# ### Stopping a container\n\nStopping\
