    当你点击移动事件查看器时，你会看到以下屏幕，它引导我们完成事件创建流程：


    ![](img/8948f94d0abcdb1ae94d6778da518d16_39_0.png)


    图 2.12 – 移动事件记录器界面


    要创建我们想要的事件，请按照以下步骤操作：


    - 1. 从下拉列表中选择 DEF789 的跟踪 ID。

    - 2. 点击 Next 按钮。

    - 3. 选择货物到达的位置 – 例如，达拉斯。

    - 4. 点击 Next 按钮。

    - 5. 选择 UNLOAD 事件类型。

    - 6. 选择货物当前所在的航次。在我们的例子中，这是 0301S。

    - 7. 点击 Next 按钮。

    - 8. 选择事件发生的日期。在我们的例子中，我选择了 16-02-2023。

    - 9. 点击 Next 按钮。


    完成这些步骤后，你将看到一个确认屏幕，显示你在之前步骤中填写的所有信息。检查它们是否正确；如果正确，你可以点击 Submit 按钮，这将把事件发送到 Cargo
    Tracker 应用程序。


    当我们查看管理界面时，我们会看到货物的状态现在是 IN_PORT，并且货物 ID 为 DEF789 的最后已知位置是达拉斯。


    ## Cargo Tracker 应用程序中使用的 Java EE 特性


    现在你对 Cargo Tracker 应用程序的工作原理有了一个大致的了解，是时候看看使其正常运行所涉及的技术了。Java EE 由多个项目和技术组成，其中每个项目都可以利用其他功能的特性。


    Cargo Tracker 应用程序使用了大量 Java EE 功能。在接下来的几个部分中，我们将介绍其中最常用的功能。我们将简要描述该功能是什么以及它在
    Cargo Tracker 应用程序中的使用方式。


    我们将使用 Java EE 对这些技术的命名。Jakarta EE 对这些技术有不同的名称。我们将讨论以下 Java EE 7 技术：


    - Enterprise Java Beans

    - Java Persistence

    - Java Messaging System

    - Context and Dependency Injection

    - Java Server Faces

    - JAX-RS

    - JSON-B

    - Java Batch


    请注意，在从 Java EE 切换到 Jakarta EE 期间，由于法律要求，许多技术的名称不得不更改。在 *附录 A* 中，你可以找到一个列表，比较了按原始
    Java EE 名称和新的 Jakarta EE 名称的技术。


    ## Enterprise Java Beans


    Enterprise Beans 从第一天就存在了。在旧的“J2EE 时代”，有几种不同类型的企业 Bean：**Session Beans (SB)、Entity
    Beans (EB) 和 Message Driven Beans (MDB)。**


    会话 Bean 还可以进一步细分为有状态会话 Bean、无状态会话 Bean 和单例会话 Bean。前两种一直存在，而后一种是在规范的 3.x 版本中添加的。


    有状态会话 Bean 与客户端保持对话状态。这意味着客户端与特定的 Bean 之间有一对一的连接，并且该 Bean 在对话期间仅为该客户端服务。例如，我们可以有一个
    `ShoppingCartSession`，它与 Faces 购物车连接。


    无状态会话 Bean 在其生命周期中不知道它们与哪些客户端进行了对话。应用程序服务器通常会对其进行池化。一旦对无状态会话 Bean 的请求到达该应用程序，就会从池中选择一个
    Bean 并在其上调用请求的方法。无状态 Bean 为容器提供了很大的灵活性，因为它可以根据需要增加或减少池大小。


    最后一种会话 Bean 是单例会话 Bean。它与无状态会话的工作方式相同，但整个应用程序中只有一个该 Bean 的实例。单例会话 Bean 通常用于数据库升级或其他批处理相关任务等任务。


    接下来是另一种类型的企业 Bean，我们有实体 Bean。这些 Bean 在规范的 1.0 版本中引入，有两种类型：Bean 管理持久性 (BMP) 和容器管理持久性
    (CMP)。前者要求应用程序开发人员调用持久性操作并执行事务管理，而后者则让 EJB 容器调用适当的数据检索/存储和事务控制操作。这些类型的 Bean 变得非常不受欢迎，因为所有操作和参数都需要在特殊的部署描述符文件
    (ejb-jar.xml) 中指定，导致 XML 文件经常包含数百条 XML 语句。它们变得如此不受欢迎，以至于在企业 Bean 规范的第 3 版中，它们被完全放弃，取而代之的是
    Java Persistence。


    最后一种 Bean 是消息驱动 Bean。这是一种专门的 Bean，它作为 JMS（或消息传递）消息的消费者注册，这些消息放置在队列或主题上。一旦消息到达队列或主题，该
    Bean 的回调方法将被调用以执行一些业务逻辑。


    ## Persistence (JPA)


    如前所述，Java Persistence 是实体 Bean 的替代品。JPA 应以最广泛的意义来看待：创建、更新、检索、删除和查询。要持久化的对象会用 @Entity
    注解进行注解。此外，实体之间的关系可以在代码中建模。


    JPA 受到了 Hibernate 的思想和概念的很大影响，Hibernate 是一个流行的对象关系映射器。它试图为以下事实提供一种变通方法：在代码中，我们使用可以嵌入其他对象的对象，而在持久化或检索数据时，我们使用的是平面表。


    JPA 还提供了通过传统 SQL、面向对象的查询 DSL 以及称为 Criteria API 的基于对象的查询定义来查询数据的可能性。


    ## Messaging (JMS)


    JMS 是通过交换消息使不相干的系统集成的概念。消息传递绝对不是 Java EE 发明的。早在 Java 兴起之前，就已经有许多所谓的面向消息中间件 (MoM)
    的实现。示例包括 IBM MQ 和 Tibco Messaging Service。最近，Apache Kafka 在 Java 社区内外都引起了巨大的关注。JMS
    为消息传递提供了一种标准工作方式的规范。


    JMS 支持两种类型的消息传递：**点对点 (PTP)** 和 **发布和订阅 (pub-sub)**。PTP 使用队列，即参与消息传递过程的两个客户端可以在其中相互交换消息。所以，这通常是一对一的连接。另一方面，pub-sub
    的工作方式是，一个客户端将在主题上发布消息，而无限制数量的客户端将通过订阅该主题来表示对接收这些消息的兴趣。


    异步通信通过消息传递的主要优点之一是，发送系统不会受到预期接收系统不可用性的严重影响。对发送系统而言，消息仍然似乎已发送。它将闲置在队列中，直到接收系统上线以检索它。将此与通过
    REST 等直接调用另一个系统的情况进行比较，如果该系统不可用。这可能会由于两种系统同步耦合的方式而导致各种问题。现在，增加连接系统的数量，你就会开始明白为什么消息传递是如此出色的解决方案。


    ### Context and Dependency Injection


    CDI 是上下文和依赖注入 API。很明显，多年来，Java EE 受到 Spring 框架的很大压力和影响。CDI 是最好的例子，因为 Spring 框架普及了
    **依赖注入 (DI)**。DI 的概念是对象不应自行实例化它所需的对象，而应将这些对象注入其中。DI 鼓励你对依赖注入进行 **控制反转 (IoC)**，而
    CDI 在此规范之上构建。


    除了在运行时将对象注入类之外，CDI 还具有生产者概念。这些不是依赖对象本身，而是知道如何获取依赖对象的对象。


    CDI 不仅仅是注入依赖对象 – 它还提供了一个事件机制。这允许一个 Bean 触发事件，而另一个 Bean 已注册为对这些事件感兴趣。因此，一旦事件被触发，监听器类就可以对其做出反应。作为示例，想象一个名为
    `CustomerRegistrationBean` 的 Bean，它将触发 `CustomerCreatedEvent` 事件。`EmailBean` Bean
    将监听这些事件，并在接收到 `CustomerCreatedEvent` 事件后，向新客户发送欢迎邮件。


    值得指出的是，CDI 并不是 Jakarta EE 中唯一可用的依赖注入机制。自 3.0 版本以来，EJB 也支持依赖注入的注解：


    - @EJB

    - @Resource


    @EJB 允许你将其他 EJB 注入到 EJB 中，而 @Resource 允许你注入提供与其他系统连接的程序对象，例如 SQL DataSource 或
    Jakarta Messaging MessageFactory。


