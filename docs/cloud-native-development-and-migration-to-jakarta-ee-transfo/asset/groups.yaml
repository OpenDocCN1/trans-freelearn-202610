  - '[PAGE 4]


    # Contributors


    # About the authors


    **Ron Veen** is a highly experienced software engineer, navigating the spectrum
    from Midrange Systems to Micro Services. Driven by his passion for software engineering
    and software architecture, he has amassed more than 15 years of experience working
    on the JVM and the Java ecosystem. Ron has seen all the frameworks and libraries
    from Apache to ZK and has worked with many versions of Java EE and later, Jakarta
    EE. An avid fan of alternative JVM languages like Groovy, Scala, Clojure, and
    his personal favorite Kotlin, Ron is also an Oracle Certified Java Programmer
    (OCP) and Sun Certified Business Component Developer (SCBCD/OCPBCD). Ron is also
    a regular speaker at international conferences.


    **David Vlijmincx** is a software developer with 8 years of experience in the
    field. He has a strong background in software development, with a focus on building
    scalable, high-quality applications using the Java programming language. David’s
    expertise spans through a variety of projects, ranging from small, standalone
    applications to large, complex systems, which needed to be migrated to newer versions
    of the EE specification or the cloud. David is an Oracle Certified Java Programmer
    (OCP) and is an avid blogger and speaker at industry conferences.'
  - '[PAGE 5]


    # About the reviewer


    **Edwin Derks**, a distinguished Java Champion hailing from the Netherlands, excels
    in unraveling intricate and strategic IT challenges as a dedicated Consultant.
    He is passionate about gathering and sharing knowledge on various facets of the
    Java ecosystem, composable architectures, and cloud-driven development . He actively
    contributes to MicroProfile and Jakarta EE and often speaks at conferences, passionately
    sharing his knowledge and experience.


    In his spare time, he is a loving husband and a father of three. He can often
    be found in the gym or having a good time at dance parties or heavy metal concerts.'
