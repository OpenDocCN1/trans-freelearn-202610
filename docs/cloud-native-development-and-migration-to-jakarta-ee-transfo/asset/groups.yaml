    # It’s all about namespaces


    When Oracle transferred Java EE to the Eclipse Foundation, no one could have foreseen
    what was to happen next. The Eclipse Foundation and its many volunteers started
    to work on updating the code and documentation to reflect the change from Oracle
    to the Eclipse Foundation. The negotiation took months in an attempt to agree
    upon the evolution of the `javax` package namespace in the Jakarta EE specifications.
    Unfortunately, due to insurmountable copyright issues, this undertaking failed.
    As a consequence, the `javax` namespace may only be used “as-is” with the Jakarta
    component specification, meaning that any specification that will evolve over
    time will need to change its namespace from the Java EE specification to a Jakarta
    EE specification. Also, the acronyms needed to be changed; for example, **Enterprise
    Java Beans (EJB)** became Jakarta Enterprise Beans.


    Version 8 was the last version of the Java EE specification. Jakarta EE version
    8 is completely the same but built from the source code at Eclipse.


    Jakarta EE 9 is functionally equal to Jakarta EE 8, but the namespaces have now
    been renamed from `javax` to `jakarta`.


    The following is an overview of all the changed namespaces with their original
    acronyms and their new namespace and acronyms.


    | Java EE namespace | Jakarta EE namespace |

    |---|---|

    | `javax.activation` | `jakarta.activation` |

    | `javax.annotation` | `jakarta.annotation` |

    | `javax.batch` | `jakarta.batch` |

    | `javax.cache` | `jakarta.cache` |

    | `javax.decorator` | `jakarta.decorator` |

    | `javax.ejb` | `jakarta.ejb` |

    | `javax.el` | `jakarta.el` |

    | `javax.enterprise` | `jakarta.enterprise` |

    | `javax.inject` | `jakarta.inject` |

    | `javax.interceptor` | `jakarta.interceptor` |

    | `javax.jms` | `jakarta.jms` |

    | `javax.json` | `jakarta.json` |

    | `javax.jws` | `jakarta.jws` |

    | `javax.management` | `jakarta.management` |

    | `javax.persistence` | `jakarta.persistence` |

    | `javax.resource` | `jakarta.resource` |'
