    ## 如何开始转型


    如果你来自单体架构，将其拆分可能是一项巨大的工程。这是一个不容易且肯定不是快速的过程。例如，优步（Uber）这家园定价格提供乘车服务的公司，就是从单体架构起步的。该单体应用是用
    Python 编写的，并使用单一的 PostgreSQL 数据库。那是 2014 年的事情。从那以后，它已经转型为由超过 4500 个独立服务组成的微服务架构。这表明转变你的应用环境并非易事。


    一开始，你应该确定单体内部的服务边界，以便能够提取它们。用传统的资源规划（ERP）系统来思考，你可以想到销售、采购、订单履行等。


    确定你想从单体中提取哪些服务，以及提取后它们将如何与单体交互。交互可以是基于请求/响应模式的，也可以通过消息队列进行异步交互。


    你可以选择先挑选那些变化最频繁或目前问题最多的服务。另一种选择是挑选那些具有问题性扩展趋势的服务。绞杀者模式（Strangler pattern）是实现这一目标的一种非常知名的模式。通过仔细且系统地将从单体中提取出的每一个已识别服务剥离出来，最终，单体将变成一个可以丢弃的空壳。


    有些公司可能会发现，他们的单体过于庞大，无法以这种方式进行重构。这时，可以应用乐高方法（Lego approach），即只将新功能构建在微服务中。这将创建一种混合结构，单体和微服务将继续并行运行。虽然这不能解决单体现有的问题，但它提供了一种未来进一步扩展应用的方式。


    ## 在云中部署 Jakarta EE 应用


    在前面的章节中，你了解了什么是云原生、Docker 和容器。基于我们在那些章节中所学的知识，我们将部署 Cargo Tracker 应用到云环境中。


    在本章中，我们将设置一个云环境，让 Cargo Tracker 应用可以在其中运行。为此，我们需要先设置云环境。你将学习如何在云中设置容器注册表以存储 Cargo
    Tracker 应用的 Docker 镜像，如何从镜像创建容器实例，以及如何查看容器的指标。


    在本章中，我们将涵盖以下主要主题：


    - 部署到 Azure

    - 创建容器注册表

    - 创建容器实例

    - 云中容器的指标


    本章结束时，你将拥有一个在云中完全运行且可从你自己的机器访问的 Cargo Tracker 应用。


    ### 技术要求


    对于本章，你需要拥有一个 Azure 账户。你可以在以下网站创建账户：https://azure.microsoft.com/en-us/free。使用此账户，你可以跟随本章的示例进行操作。该账户用于创建容器注册表和容器实例。你可以跟随本章了解在云环境中部署
    Cargo Tracker 容器所需的步骤，但我们建议你创建账户并动手实践。


    ### 部署到 Azure


    Azure 是由微软提供的云计算平台和服务。它为个人和企业提供了一套全面的基于云的解决方案，用于构建、部署和管理应用及服务。Azure 利用微软庞大的全球数据中心网络，提供广泛的计算资源、存储选项和网络功能。


    在本节中，我们将介绍如何将 Cargo Tracker 应用部署到 Azure 云环境。为了跟随这些步骤，你需要拥有一个 Azure 账户。为了部署该应用，我们将在
