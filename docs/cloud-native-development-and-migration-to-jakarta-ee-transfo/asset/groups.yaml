    \ {\n}\n```\n\nEvery unit test is marked with the @Test annotation. This tells\
    \ JUnit which methods are test methods and which are not. The next step is to\
    \ test your goesToNetherlands method. Inside the test, we will use the given,\
    \ when, then structure. The given part tells the reader what the basis is of the\
    \ test and which instances the test requires. The when part invokes the production\
    \ code. Inside the then part, we verify if what has happened was correct.\n\n\
    For our first unit test, we need to create a RouteSpecification class in the given\
