    ## Web 服务器


    Web 服务器实现了 Servlet API，这是一组在规范中定义好的类和接口，允许你创建动态 Web 应用程序。基于 Servlet API 的应用程序，称为
    Servlet，在 Web 服务器内部运行，并向其用户提供可能动态的内容。


    多年来，出现了许多支持 Servlet API 的技术。诸如 **Java Server Pages (JSP)**、**Java Standard Tag
    Libraries (JSTL)**、**Java Server Faces (JSF)** 以及 Bean 验证等规范是最值得注意的。后来，添加了 **Java
    API for XML Web Service (JAX-WS)** 和 **Java API for Restful Web services (JAX-RS)**。


    Servlet API 有许多流行的独立实现，例如以下：


    - Tomcat

    - Jetty

    - NGINX


    所有这些都提供了一个 Servlet 容器，servlet 可以在其中运行。


    了解你可以在一个 servlet 容器内运行多个 servlet 是很有益的。在早期，这是一种常见做法，因为它允许你在同一硬件上运行多个应用程序。


    顺便说一下，应该指出的是，像 Spring Boot 这样的框架仍然使用 Servlet API。这意味着在核心层面上，仍然在运行某种 Servlet API
    的实现。在 Spring Boot 的情况下，使用哪种 servlet 容器实现是可插拔的，这意味着你自己选择。


    ## 应用服务器


    相反，应用服务器确实有提供支持 Servlet API 的实现的必要，但它们提供的远不止于此。应用服务器提供更丰富的环境，更针对执行业务逻辑。它们提供 **Enterprise
    Java Beans (EJBs)**。EJB 有三种主要类型：


    - **Session Beans (SBs)**

    - **Entity Beans (EBs)**

    - **Message-Driven Beans (MDBs)**


    会话 Bean 可以进一步分为 **Stateful Session Beans (SFSBs)** 和 **Stateless Session Beans
    (SLSBs)**。会话 Bean 包含业务逻辑。


    实体 Bean 处理数据库操作，分为 **Container Managed Persistence (CMP)** 和 **Bean Managed Persistence
    (BMP)** 实体 Bean。在前者中，应用服务器负责处理数据的持久化和检索，而在后者中，应用程序开发人员必须自己编写查询来选择和更新数据库。


    我们用过去时来写，因为实体 Bean 在 EJB 规范的第 3 版中被完全删除，该版本发布于 Java EE 5，取而代之的是 **Java Persistence
    API (JPA)**。


    此外，应用服务器提供用于声明式和编程式事务管理的 API。与实体 Bean 一样，区别在于前者中容器会自动启动、提交或回滚事务，而在后者中，这必须在代码中完成。


    **Java Messaging Service (JMS)** 是应用服务器的另一个必需功能。JMS 允许你在不同的应用程序或应用程序组件之间异步交换消息。


    JMS 通过队列在两个组件之间提供一对一连接，同时通过主题提供一对多消息交换。


    此外，应用服务器允许通过 **Java Naming and Directory Interface (JNDI)** 注册和发现组件。例如，可以实例化一个用于发送电子邮件的
    EJB 并随后在 JNDI 注册表中注册。另一个需要发送电子邮件功能的 EJB 然后能够通过其名称在注册表中查找此电子邮件服务并使用它。


    除此之外，应用服务器还提供诸如声明式安全、并发和拦截器等功能。


    一些非常流行的应用服务器如下：


    - IBM Websphere

    - JBoss Application

    - Oracle Glassfish

    - Oracle Weblogic

    - Payara Server Enterprise


    应用服务器往往很笨重，启动时间很糟糕。在早期，启动需要 10-15 分钟并将部署的应用程序带到初始化状态是很常见的。然而，如今，它们通常在几秒钟内启动。


    ## 配置文件来救援


    在 Java EE 的早期，如果你想成为一个 Java EE 兼容的服务器，就有一个简单的规则——你必须实现所有规范。然而，很快就变得清楚，并非每个应用程序都需要一个功能齐全的应用服务器。经常，Web
    服务器已经足够了。


    为了使这种区别更清晰，引入了配置文件。第一个是 Web Profile，它首次出现在 Java EE 6 中。它由 Servlet、JSF、JSP、EJB、CDI、JTA、JPA
    和 Bean Validation 规范组成。


    所有规范的完整集合被称为 Full Platform Profile。


    在 Jakarta EE 10 中，引入了 Core Profile。它包含更小的规范子集，针对微服务、边缘计算和提前编译。在 *第 2 章*，我们将更深入地探讨这些主题。


    下图描绘了不同的配置文件以及它们需要实现的规范。图像取自 Jakarta EE 网站（https://jakarta.ee/release/10/）。


    ![](img/8948f94d0abcdb1ae94d6778da518d16_25_0.png)


    图 1.1 – 不同的 Jakarta EE 配置文件及其规范


    ## Java EE 6


    在 Java EE 版本 6 中引入的最著名变化无疑是对 RESTful API Web 服务的支持。REST 已成为比 SOAP Web 服务更受欢迎的
    Web 服务形式，因为其灵活的特性。


    此外，版本 6 引入了 Context and Dependency Injection (CDI) API。这使得在 Java EE 应用程序中使用依赖注入成为可能，其中之一。


    ## Java EE 7


    Java EE 版本 7 引入了批处理应用程序的概念。这些是一系列无需用户干预即可执行的任务。


    它还引入了一些额外的并发实用程序，例如托管执行器服务、其计划变体和托管线程工厂。


    此外，引入了 WebSocket API 的第一个版本。WebSocket 允许两个对等方之间进行全双工通信。


    最后，JSON-P 规范的引入也不容忽视。它允许 Java 对象序列化为 JSON 格式，反之亦然。随着 RESTful API Web 服务的兴起，这已成为
    Java EE 平台的关键规范。


    ## Java EE 8


    Java EE 8 是由 Oracle 发布 Java EE 的最后一个版本。Java EE 版本 7 和版本 8 之间相隔相当长的时间（确切地说是 4 年
    3 个月零 3 天）。Java EE 在 Oracle 方面开始衰落变得越来越明显。


    尽管如此，这个最终版本引入了一些不错的功能。最重要的是，有 JAXB，即 Java API for XML binding。此外，还引入了基于注解的安全性，使用
    Java Security EE API。


    ## 总结


    本章简要介绍了 Java EE 的历史，直到版本 8。在此版本之后，Java EE 被移交给 Eclipse 基金会，并重新命名为 Jakarta EE。


    有了这段历史，你现在可以开始你的 Jakarta EE 之旅。在下一章中，我们将向你介绍我们的示例应用程序，而在接下来的章节中，我们将开始迁移到更新版本的
    Jakarta EE。


    ## 介绍 Cargo Tracker 应用程序


    在本章中，我们将介绍 Cargo Tracker 应用程序，该应用程序使用 Java EE 7 构建。我们将在本书中始终使用 Cargo Tracker 应用程序。这是我们将从
    Java EE 7 迁移到 Jakarta EE 10 的应用程序。在开始迁移应用程序之前，了解 Cargo Tracker 应用程序是很有益的。本章将提供
    Cargo Tracker 应用程序及其功能的概述，以及当前架构和设计。


    此外，我们将介绍 Cargo Tracker 应用程序的各个组件以及它们如何相互交互。我们将涵盖使用 REST、WebSockets 和 JavaServer
    Faces (JSF) 进行展示、Enterprise Java Beans (EJB) 进行业务逻辑以及 Java Persistence (JPA) 进行数据持久化的主题。我们还将强调使用
    Contexts and Dependency Injection (CDI) 进行组件间依赖管理的用法。


    在本章中，我们将涵盖以下主题：


    - 安装和运行 Cargo Tracker 应用程序

    - Cargo Tracker 应用程序能做什么？

    - Cargo Tracker 应用程序中使用的 Java EE 功能


    到本章结束时，你将对 Cargo Tracker 应用程序及其底层技术栈有扎实的理解。这将为本书的其余部分奠定基础，在那里我们将深入探讨将 Cargo Tracker
    应用程序迁移到 Jakarta EE 10 的具体细节。


    '
