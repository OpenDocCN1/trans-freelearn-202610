    \n### MicroProfile 简史\n\n2010 年，Java EE 经历了一段艰难时期。新版本的创建耗时异常漫长。从 Java EE 6 到 Java\
    \ EE 7 花了 40 个月的时间。而从 Java EE 7 到 EE 8 更是花了整整 43 个月。与此同时，互联网瞬息万变，云带来了新的机遇和挑战。微服务正成为最新的架构热潮，而\
    \ Java EE 并没有提供默认的采用方式。\n\nJava EE 应用服务器供应商感到有必要为其平台的开发者提供额外功能。不幸的是，每个供应商都各行其是。看似矛盾的是，本应提供统一\
