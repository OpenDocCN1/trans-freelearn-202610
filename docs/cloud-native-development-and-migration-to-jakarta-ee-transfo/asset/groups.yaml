  - '[PAGE 93]


    # Making Your Application Testable


    The Cargo Tracker application already has unit tests and good test coverage. That
    doesn’t mean that your current project or the next one is the same. It could be
    the case that your current project doesn’t have unit tests or a low test coverage.


    Having a low test coverage or not enough unit tests could impose a thread. What
    if something changes during a migration and no longer works? How are you going
    to know if something broke? That’s when all kinds of different types of tests
    come in. In this chapter, you will learn how to create different kinds of tests
    that test different kinds of aspects of your application.


    We’re going to cover the following main topics:


    +   - The impact of testing on your migration

    +   - Measuring code coverage of the project

    +   - A word about **test-driven development** (TDD)

    +   - How to create unit tests

    +   - How to create integration tests


    By the end of the chapter, you should know what kinds of tests there are, when
    to use them, and how you can create those tests.'
  md: "\n## Setting up Grafana\n\nGrafana is a tool for querying and visualizing the\
    \ data we get from the metrics in dashboards that we create. Creating a dashboard\
    \ has the advantage of displaying data so that the user can see the status of\
    \ the system. If certain metrics are at 100% or at 0%, it may be a signal something\
    \ is wrong and needs fixing. This is easier to see with a dashboard than using\
    \ raw metrics.\n\n## Setting up docker-compose\n\nIn this section, we are going\
    \ to run Grafana inside a container, just like we did with Prometheus. To do this,\
    \ we need to change the docker-compose file again. We need to add a new service\
    \ for Grafana. The following example shows how we can add the new service using\
    \ the latest Grafana image from Grafana:\n\n```\ngrafana:\n  image: grafana/grafana:latest\n\
    \  ports:\n    - \"3000:3000\"\n```\n\nThis service will create a Grafana container\
    \ that has port 3000 port forwarded to port 3000 on the host machine.\n\nWhen\
    \ you visit http://localhost:3000/login, you will see the login screen of Grafana:\n\
    \n![](img/8948f94d0abcdb1ae94d6778da518d16_86_0.png)\n\nFigure 4.2 – Grafana login\
    \ screen\n\nWe will mount this path inside the container later. Inside the data\
    \ sources directory, create a file named `automatic.yml`. You will use this file\
    \ to store the data source configuration. The complete path will be `grafana/provisioning/datasources/automatic.yml`.\
    \ Make sure you put the following configuration inside the YAML file. This configuration\
    \ tells Grafana the following things:\n\n- The name of the data source\n- The\
    \ access type\n- The URL where it can find the resource\n- If this is the default\
    \ data source to use:\n\n```\ndatasources:\n  - name: Prometheus\n    access:\
    \ proxy\n    type: prometheus\n    url: http://prometheus:9090\n    isDefault:\
    \ true\n```\n\nWith the data source set up, we can start importing dashboards\
    \ into Grafana.\n\n## Setting up the dashboard so that it loads automatically\n\
    \nIf you create a dashboard inside the Grafana container, every time you destroy\
    \ the container and start it back up, your dashboards will disappear and not be\
    \ there anymore. This isn’t ideal, especially if you’re sharing the project with\
    \ your colleagues as they will have no dashboard at all. The easiest way to share\
    \ the dashboard and have it available every time you create a new Grafana container\
    \ is to make it part of the project. Making it part of the project and passing\
    \ it to the container makes it available every time you create a new container\
    \ or to any colleague you share the project with.\n\nMaking a dashboard part of\
    \ the project and passing it to the Grafana container is done in two steps. We\
    \ need to make a YAML file that specifies where Grafana can find the dashboards\
    \ and we need to create a dashboard to hold the dashboards that we are going to\
    \ create.\n\nThe first step is creating the YAML file to specify the directory\
    \ of the dashboards. First, you must create a directory to store a YAML file.\
    \ We created the following directory structure to store this YAML file: `grafana/provisioning/dashboards/`.\
    \ Inside the dashboards directory, you need to create a file named `local.yml`.\
    \ You are going to use this file to store the configuration. Inside this file,\
    \ you need to have the following piece of configuration:\n\n```\napiVersion: 1\n\
    providers:\n  - name: 'default'\n    org_id: 1\n    folder: ''\n    type: 'file'\n\
    \    options:\n      folder: '/var/lib/grafana/dashboards'\n```\n\nThe first line\
    \ inside the configuration specifies the version of the configuration, which in\
    \ this case is going to be 1. After the version, we have to specify the providers;\
    \ this is going to tell Grafana where it can find the dashboards. The most important\
    \ option is on the last line. This line specifies the directory inside the container\
    \ where the dashboard is going to be stored.\n\nThe next step is to create a dashboard\
    \ and store it inside a directory that is inside the project directory. We chose\
    \ to store the dashboards for cargo-tracker inside the grafana/mydashboards/ directory.\
    \ Inside the mydashboards directory, we created a JSON file called CargoTracker-1684667357857.json\
    \ that will hold the configuration. The next step is to have a dashboard inside\
    \ this JSON file. We have already created a dashboard for you, so you do not have\
    \ to do this. The entire JSON file that creates the dashboard is too big to place\
    \ in this book. Please look at the file on GitHub at https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE/blob/chapter-4-fix/grafana/mydashboards/CargoTracker-1684667357857.json.\n\
    \nThe JSON configuration creates a dashboard inside Grafana that will use the\
    \ Prometheus data source that you created earlier in this chapter and will display\
    \ some data from it to the dashboard, as you will see shortly.\n\n## Showing Grafana\
    \ Docker\n\nWith the configuration for the dashboard and the dashboard itself\
    \ created, we need to add them to the container. To do this, you need to add the\
    \ last two lines of the following example to the Grafana service inside your Docker\
    \ file:\n\n```\ngrafana:\n  image: grafana/grafana:latest\n  ports:\n    - \"\
    3000:3000\"\n  volumes:\n    - ./grafana/provisioning:/etc/grafana/provisioning\n\
    \    - ./grafana/mydashboards:/var/lib/grafana/dashboards\n```\n\nThese two lines\
    \ will pass the directories you created to the container, making them available\
    \ for Grafana to read from.\n\n## Showing the complete Docker file\n\nThe complete\
    \ Docker file will look as follows. If you followed all the steps in this chapter,\
    \ you will have altered the Cargo Tracker application so that it includes metrics.\
    \ Create a Prometheus and Grafana service that will load their configuration from\
    \ the cargo-tracker application:\n\n```\nversion: \"3.9\"\nservices:\n  cargo-tracker-app:\n\
    \    build: .\n    ports:\n      - \"4848:4848\"\n      - \"8080:8080\"\n    \
    \  - \"8181:8181\"\n      - \"9009:9009\"\n  prometheus:\n    image: bitnami/prometheus:latest\n\
    \    volumes:\n      - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
    \    ports:\n      - \"9090:9090\"\n  grafana:\n    image: grafana/grafana:latest\n\
    \    ports:\n      - \"3000:3000\"\n    volumes:\n      - ./grafana/provisioning:/etc/grafana/provisioning\n\
    \      - ./grafana/mydashboards:/var/lib/grafana/dashboards\n```\n\nNow, when\
    \ you run docker-compose up, three services are going to be created: cargo-tracker,\
    \ Prometheus, and a Grafana service. When you visit your Grafana instance at http://localhost:3000\
    \ and log in using admin as the username and admin as the password, you will see\
    \ the following dashboard. These metrics are gathered from the Prometheus instance,\
    \ which pulls them from the cargo-tracker application:\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_91_0.png)\n\
    \nFigure 4.4 – Dashboard in Grafana\n\nThe metrics are refreshed every few seconds\
    \ and allow you to look inside the `cargo-tracker` application and see what is\
    \ happening inside. In the next chapter, we are going to take the Cargo Tracker\
    \ application from this chapter and show you what options you have to make this\
    \ application more testable.\n\n## Summary\n\nIn this chapter, you learned about\
    \ the most significant changes to Jakarta EE 10, including what different profiles\
    \ there are and when they are used. You also learned about some of the new features\
    \ that Jakarta EE 10 brings to your application and how you can use MicroProfile\
    \ together with your application to make it more resilient.\n\nNext, you saw how\
    \ to add monitoring to your application by using Prometheus to store health metrics\
    \ and Grafana to display them inside a dashboard, making it easier for teams to\
    \ see what is happening inside their application.\n\nNow that the application\
    \ has been updated to the latest version, the next step is to make sure the application\
    \ keeps working by adding tests. The next chapter will cover how you can test\
    \ your application to ensure that everything still works after every change.\n\
    \n## Making Your Application Testable\n\nThe Cargo Tracker application already\
    \ has unit tests and good test coverage. That doesn’t mean that your current project\
    \ or the next one is the same. It could be the case that your current project\
    \ doesn’t have unit tests or has a low test coverage.\n\nHaving a low test coverage\
    \ or not enough unit tests could impose a threat. What if something changes during\
    \ a migration and no longer works? How are you going to know if something broke?\
    \ That’s when all kinds of different types of tests come in. In this chapter,\
    \ you will learn how to create different kinds of tests that test different kinds\
    \ of aspects of your application.\n\nWe’re going to cover the following main topics:\n\
    \n- The impact of testing on your migration\n- Measuring code coverage of the\
    \ project\n- A word about **test-driven development** (TDD)\n- How to create unit\
    \ tests\n- How to create integration tests\n\nBy the end of the chapter, you should\
    \ know what kinds of tests there are, when to use them, and how you can create\
    \ those tests.\n"
  mdcn: "\n## 设置 Grafana\n\nGrafana 是一种用于查询和可视化数据的工具，这些数据来自我们创建的仪表板中的指标。创建仪表板的好处在于可以展示数据，让用户能够看到系统的状态。如果某些指标处于\
    \ 100% 或 0%，这可能意味着系统出现了问题需要修复。与使用原始指标相比，通过仪表板更容易发现这些问题。\n\n## 设置 docker-compose\n\
    \n在本节中，我们将像之前对 Prometheus 所做的那样，在容器中运行 Grafana。为此，我们需要再次修改 docker-compose 文件。我们需要为\
    \ Grafana 添加一个新服务。下面的示例展示了如何使用 Grafana 提供的最新 Grafana 镜像来添加该服务：\n\n```\ngrafana:\n\
    \  image: grafana/grafana:latest\n  ports:\n    - \"3000:3000\"\n```\n\n该服务将创建一个\
    \ Grafana 容器，并将容器的 3000 端口转发到宿主机的 3000 端口。\n\n当你访问 http://localhost:3000/login\
    \ 时，将看到 Grafana 的登录界面：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_86_0.png)\n\
    \n图 4.2 – Grafana 登录界面\n\n稍后我们会在容器内挂载这个路径。在 data sources 目录下，创建一个名为 `automatic.yml`\
    \ 的文件。你将使用此文件来存储数据源配置。完整路径为 `grafana/provisioning/datasources/automatic.yml`。请确保将以下配置放入该\
    \ YAML 文件中。此配置告知 Grafana 以下信息：\n\n- 数据源的名称\n- 访问类型\n- 可以找到资源的 URL\n- 这是否为要使用的默认数据源：\n\
    \n```\ndatasources:\n  - name: Prometheus\n    access: proxy\n    type: prometheus\n\
    \    url: http://prometheus:9090\n    isDefault: true\n```\n\n数据源设置完成后，我们就可以开始将仪表板导入\
    \ Grafana。\n\n## 设置仪表板以便自动加载\n\n如果你在 Grafana 容器内创建了一个仪表板，那么每次销毁容器并重新启动时，你的仪表板都会消失，不再存在。这并不理想，尤其是当你与同事共享项目时，他们可能完全没有仪表板。要共享仪表板并在每次创建新的\
    \ Grafana 容器时都可用，最简单的方法就是让它成为项目的一部分。将仪表板作为项目的一部分并传递给容器，这样每次创建新容器或与你共享项目的同事都能使用它。\n\
    \n将仪表板纳入项目并传递给 Grafana 容器需要两步。我们需要创建一个 YAML 文件来指定 Grafana 在哪里可以找到仪表板，还需要创建一个目录来存放我们将要创建的仪表板。\n\
    \n第一步是创建 YAML 文件，用于指定仪表板的目录。首先，你必须创建一个目录来存放 YAML 文件。我们创建了以下目录结构来存放该 YAML 文件：`grafana/provisioning/dashboards/`。在\
    \ dashboards 目录下，你需要创建一个名为 `local.yml` 的文件。你将使用此文件来存储配置。在此文件内，你需要包含以下配置：\n\n```\n\
    apiVersion: 1\nproviders:\n  - name: 'default'\n    org_id: 1\n    folder: ''\n\
    \    type: 'file'\n    options:\n      folder: '/var/lib/grafana/dashboards'\n\
    ```\n\n配置中的第一行指定了配置的版本，此处为 1。在版本之后，我们必须指定提供程序（providers）；这会让 Grafana 知道在哪里可以找到仪表板。最重要的选项在最后一行。这一行指定了容器内仪表板将存储的目录。\n\
    \n下一步是创建一个仪表板，并将其存放在项目目录下的某个目录中。我们选择将 cargo-tracker 的仪表板存放在 `grafana/mydashboards/`\
    \ 目录下。在 mydashboards 目录中，我们创建了一个名为 `CargoTracker-1684667357857.json` 的 JSON 文件，该文件将保存配置。下一步是让这个\
    \ JSON 文件中包含一个仪表板。我们已经为你创建好了仪表板，因此你不必再执行此操作。用于创建仪表板的完整 JSON 文件太大，无法放入本书。请查看 GitHub\
    \ 上的文件：https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE/blob/chapter-4-fix/grafana/mydashboards/CargoTracker-1684667357857.json。\n\
    \n该 JSON 配置会在 Grafana 中创建一个仪表板，它将使用你在本章前面创建的 Prometheus 数据源，并将其中一些数据显示在仪表板上，稍后你就会看到。\n\
    \n## 展示 Grafana Docker\n\n在创建好仪表板的配置和仪表板本身之后，我们需要将它们添加到容器中。为此，你需要在 Docker 文件中的\
    \ Grafana 服务中添加以下示例的最后两行：\n\n```\ngrafana:\n  image: grafana/grafana:latest\n\
    \  ports:\n    - \"3000:3000\"\n  volumes:\n    - ./grafana/provisioning:/etc/grafana/provisioning\n\
    \    - ./grafana/mydashboards:/var/lib/grafana/dashboards\n```\n\n这两行会将你创建的目录传递给容器，使\
    \ Grafana 能够读取它们。\n\n## 展示完整的 Docker 文件\n\n完整的 Docker 文件如下所示。如果你按照本章的所有步骤操作，你将会修改\
    \ Cargo Tracker 应用程序，使其包含指标。创建一个 Prometheus 和 Grafana 服务，它们将从 cargo-tracker 应用程序加载配置：\n\
    \n```\nversion: \"3.9\"\nservices:\n  cargo-tracker-app:\n    build: .\n    ports:\n\
    \      - \"4848:4848\"\n      - \"8080:8080\"\n      - \"8181:8181\"\n      -\
    \ \"9009:9009\"\n  prometheus:\n    image: bitnami/prometheus:latest\n    volumes:\n\
    \      - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
    \    ports:\n      - \"9090:9090\"\n  grafana:\n    image: grafana/grafana:latest\n\
    \    ports:\n      - \"3000:3000\"\n    volumes:\n      - ./grafana/provisioning:/etc/grafana/provisioning\n\
    \      - ./grafana/mydashboards:/var/lib/grafana/dashboards\n```\n\n现在，当你运行 `docker-compose\
    \ up` 时，将创建三个服务：cargo-tracker、Prometheus 和一个 Grafana 服务。当你访问 http://localhost:3000\
    \ 上的 Grafana 实例，并使用 admin 作为用户名和 admin 作为密码登录时，你将看到以下仪表板。这些指标来自 Prometheus 实例，而\
    \ Prometheus 从 cargo-tracker 应用程序中拉取它们：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_91_0.png)\n\
    \n图 4.4 – Grafana 中的仪表板\n\n这些指标每隔几秒刷新一次，使你可以深入了解 `cargo-tracker` 应用程序内部，并查看其内部发生的情况。在下一章中，我们将基于本章的\
    \ Cargo Tracker 应用程序，向你展示有哪些选项可以让该应用程序更易于测试。\n\n## 总结\n\n在本章中，你了解了 Jakarta EE\
    \ 10 最重要的变更，包括有哪些不同的 profile，以及它们何时会被使用。你还了解了 Jakarta EE 10 为你的应用程序带来的一些新特性，以及如何将\
    \ MicroProfile 与你的应用程序结合使用，使其更具弹性。\n\n接下来，你了解了如何通过使用 Prometheus 存储健康指标，并使用 Grafana\
    \ 在仪表板中显示这些指标，为你的应用程序添加监控，从而让团队更容易了解其应用程序内部发生的情况。\n\n现在，应用程序已更新到最新版本，下一步是通过添加测试来确保应用程序持续工作。下一章将介绍如何测试你的应用程序，以确保每次更改后一切都能正常工作。\n\
    \n## 让应用程序更易测试\n\nCargo Tracker 应用程序已经有单元测试和良好的测试覆盖率。但这并不意味着你当前的项目或下一个项目也是如此。有可能你当前的项目没有单元测试，或者测试覆盖率较低。\n\
    \n测试覆盖率低或单元测试不足可能会带来风险。如果在迁移过程中某些东西发生了变化而无法正常工作，该怎么办？你将如何知道哪里出了问题？这时，各种不同类型的测试就派上了用场。在本章中，你将学习如何创建不同类型的测试，来测试应用程序的不同方面。\n\
    \n我们将涵盖以下主要主题：\n\n- 测试对迁移的影响\n- 衡量项目的代码覆盖率\n- 关于**测试驱动开发**（TDD）的一点说明\n- 如何创建单元测试\n\
    - 如何创建集成测试\n\n到本章结束时，你应该了解有哪些类型的测试、何时使用它们，以及如何创建这些测试。\n"
