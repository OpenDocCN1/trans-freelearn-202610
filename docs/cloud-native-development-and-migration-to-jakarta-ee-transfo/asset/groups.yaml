    environment, it is feasible that incompatibilities could start to creep in. As
    such, it is apparent that development and production environments should be similar.


    ### Logs


    *Treat logs as event streams.*


    Logs can come from a number of sources, and not just your application. They are
    typically time-ordered streams of the output of all running processes and backing
    services.


    Your application should never worry about routing logs or where to store them.
    Instead, your application should just stream its log output to stdout.


    During development, the developer can easily view the log stream in their console.


    During staging and production, each process stream will be captured by the execution
    environment and routed to one or more final destinations. These final destinations
    are typically log collectors that will store the information in some form or structure
    that makes the data easy to retrieve and view in specialized logging tools, such
    as Splunk or Kibana.


    ### Admin processes


    *Run admin/management tasks as one-off processes.*


    Administrative tasks can be a number of things, such as—for instance—database
    maintenance tasks, some cleanup process that needs to be run on a regular basis,
    or, in general, cron jobs.

