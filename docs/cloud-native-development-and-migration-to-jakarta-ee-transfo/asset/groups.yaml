    \ project to implement telemetry. In version 1.0 of the specification, logging,\
    \ and metrics are considered out of scope and can be implemented in any way that’s\
    \ desired.\n\nThere are various concepts to understand regarding distributed traces:\
    \ first and foremost, your application is performing several tasks. Some may be\
    \ internal, some might be related to an external entity, such as a database, and\
    \ some might include calling other external services. A distributed trace keeps\
    \ track of all the activities and their duration. In doing so, it is possible\
    \ to paint a clear picture of the complete process, spanning multiple systems.\n\
    \nAs an example, assume you have a system that verifies if someone subscribes\
    \ to a newsletter of your company. You need to verify if the email address is\
    \ not already registered. If it is a new subscriber, register them and ask for\
    \ the mailing service to send them the latest newsletter.\n\nThe message would\
    \ typically arrive because your application has a Jakarta Message listener (component\
    \ 1) in place that listens to a specific queue. Next, your application (component\
    \ 2) will verify if the email is already enlisted via querying the database (component\
    \ 3). Finally, if the email address is not known, your application may invoke\
    \ the SendNewsletter service (component 4) to send the current issue of the newsletter\
    \ to the new subscriber.\n\n(Note that more likely, your application would have\
    \ placed a Jakarta Message on another queue on which the SendNewsletter services\
    \ listen, resulting in an even larger number of components being involved).\n\n\
    If you want to have a complete overview of this process in real life, you need\
    \ a trace that spans all these systems, hence the name distributed tracing. A\
    \ distributed trace records the paths a request takes as it propagates through\
    \ multi-service architectures.\n\nA distributed trace consists of several spans.\
    \ A span is a unit of work or operation. In the preceding example, invoking each\
