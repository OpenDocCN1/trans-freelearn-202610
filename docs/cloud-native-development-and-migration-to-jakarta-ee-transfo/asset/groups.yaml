    \ that looks like this:\n\n```\n@Test\npublic void verify() {\n}\n```"
  - "[PAGE 105]\n\nThis test case is just a method that is marked with the `@test`\
    \ annotation that tells JUnit 5 that this method contains a test it can run. Now,\
    \ let’s make a call to the test container using `rest-assured`. Add the following\
    \ code to the testing method:\n\n```\nList<LinkedHashMap<String, Object>> cargoResult\
    \ = given().get(String.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
    , CargoContainer.getMappedPort(8080)))\n    .then()\n    .assertThat().statusCode(200)\n\
    \    .and()\n    .contentType(ContentType.JSON)\n    .extract()\n    .as(List.class);\n\
    ```\n\nThis method does a lot. Let’s go over it line by line and see what it does:\n\
    \n+   - The example starts with an assignment to `cargoResult`. This will be a\
    \ reference to the body of the request that we want to use later for further testing.\n\
    +   - After the assignment, you can see that a GET request is created for the\
    \ `cargo` endpoint of the Cargo Tracker application.\n+   - When you look closely,\
    \ you can see that we must create a URL using `String.format` to call the Cargo\
    \ Tracker application that runs inside a container. That is because we don’t know\
    \ which outside port is mapped to the internal port `8080` that the Cargo Tracker\
    \ application listens to.\n\nTo find out which port is mapped to the internal\
    \ port 8080, we must retrieve the port from the CargoContainer instance we created\
    \ in the previous section, as follows:\n\n```\nString.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
    ,\n    CargoContainer.getMappedPort(8080))\n```\n\nThis is the same `String.format`\
    \ instance as the one from the previous example. As you can see, we retrieve the\
    \ correct port by calling this method: `CargoContainer.getMappedPort(8080)`. This\
    \ method returns the port number that is mapped to 8080. We must do this as Testcontainers\
    \ automatically maps the internal port 8080 to an available port of the host.\
    \ After `String.format`, we have a functional URL that we can use to call the\
    \ test container.\n\nAfter making the call, we want to verify if the result is\
    \ what we expected it to be. To do this, we can use `.then()` and `.assertThat()`,\
    \ as in the following example:\n\n```\n.then()\n    .assertThat().statusCode(200)\n\
    \    .and()\n    .contentType(ContentType.JSON)\n```"
  - "[PAGE 106]\n\nIn the previous code snippet, we do two assertions, as follows:\n\
    \n+   - The first assertion that we are doing is checking that the status code\
