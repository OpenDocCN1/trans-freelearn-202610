  mdcn: "\n\n## 创建单元测试\n\n在本节中，我们将向你展示如何创建一个单元测试。Cargo Tracker 应用较为复杂，这意味着你需要花费一些时间才能完全理解代码内部发生了什么。为了加快这一过程，我们首先要创建一个可以测试的方法。这样，你就不必了解\
    \ Cargo Tracker 应用的任何细节，而可以专注于创建单元测试。\n\n我们用来教你单元测试的方法需要一个类来承载它。在 `org/eclipse/cargotracker/infrastructure/routing`\
    \ 包内创建一个名为 `RoutingHelper` 的类。确保 `RoutingHelper` 类的内容如下所示：\n\n```java\npackage\
