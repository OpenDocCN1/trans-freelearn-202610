    # Jakarta EE 10 Core Profile


    This specification is new in MicroProfile 6.0. Before this, the core MicroProfile
    specification included Jakarta RESTful Web Services, Jakarta JSON Binding, Jakarta
    JSON Processing, Jakarta Dependency Injection, and Jakarta Annotations.


    In MicroProfile 6.0, it was decided to add these specifications into an umbrella
    specification by adopting the Core Profile from Jakarta EE. This new core specification
    is lightweight yet powerful enough for both microservices and edge computing.


    # Summary


    In this chapter, you learned what MicroProfile is all about. We walked through
    each of the required specifications. The specifications that are of interest when
    upgrading the Cargo Tracker application to a cloud-native version were discussed
    in great detail.


    We will see the Config, Health, Fault Tolerance, and Metrics specification return
    in the next chapter when we upgrade the Cargo Tracker application.'
