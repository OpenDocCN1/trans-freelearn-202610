    In this part, we will show you how to modernize the Cargo Tracker application.
    Equipped with the necessary knowledge, you''ll learn how to apply these techniques
    to other applications that require migration. We cover the different tools you
    can use to migrate from Java EE to Jakarta EE and how these tools work. With an
