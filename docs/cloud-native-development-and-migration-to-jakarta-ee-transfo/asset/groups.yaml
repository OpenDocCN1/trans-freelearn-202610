    \ can be implemented in any of the following instrumentation ways:\n\n- Automatic\
    \ instrumentation\n- Manual instrumentation\n- Agent instrumentation\n\nLet’s\
    \ look at each of these possibilities.\n\n### Automatic instrumentation\n\nJakarta\
    \ RESTful Web Services and MicroProfile REST clients automatically participate\
    \ in distributed tracing. You do not have to make any code changes to achieve\
    \ this.\n\n### Manual instrumentation\n\nManual instrumentation is the process\
    \ where you add tracing abilities. There are two possible ways to achieve this\
    \ – the first through annotation and the second through injecting trace objects\
    \ into your Java code. Let’s dive into these options in more detail.\n\n#### The\
