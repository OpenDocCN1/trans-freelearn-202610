  - "[PAGE 60]\n\nThe glassfish6x container ID tells the cargo plugin what version\
    \ of Payara we want to use. Cargo uses the download URI to download a version\
    \ of Payara. To finish the Cargo upgrade, we need to update the artifact ID defined\
    \ inside the plugin. At the bottom of the pom.xml file, you will find the Cargo\
    \ plugin. We need to take this artifact ID:\n\n```\n`<artifactId>cargo-maven2-plugin</artifactId>`\n\
    ```\n\nAnd we need to change it into this one:\n\n```\n`<artifactId>cargo-maven3-plugin</artifactId>`\n\
    ```\n\nThis finishes the Payara and Cargo upgrade to the latest version.\n\nThe\
    \ Cargo tracker uses **Derby** as an in-memory database to store cargo information,\
    \ but this is no longer possible if we want to use Payara 6. Payara has replaced\
    \ Derby with **H2** for several reasons. This means that we must change the data\
    \ source inside the web.xml file.\n\nInside web.xml, we need to replace the data\
    \ source that looks as follows with one that uses H2:\n\n```\n```xml\n<data-source>\n\
    \    <name>java:app/jdbc/CargoTrackerDatabase</name>\n    <class-name>org.apache.derby.jdbc.EmbeddedDriver</class-name>\n\
    \    <url>jdbc:derby:${webapp.databaseTempDir}\n        /cargo-tracker-database;create=true</url>\n\
    </data-source>\n```\n```\n\nTo use H2, we need to replace the class name to tell\
    \ Payara which driver to use to connect the database. The URL tells Payara where\
    \ to find the database, and :mem: tells H2 that we want to use an in-memory database.\
    \ The last parameter is the name of the database that H2 has to create:\n\n```\n\
    ```xml\n<data-source>\n    <name>java:app/jdbc/CargoTrackerDatabase</name>\n \
    \   <class-name>org.h2.Driver</class-name>\n    <url>jdbc:h2:mem:cargo-tracker-database</url>\n\
    </data-source>\n```\n```\n\n# Upgrading PrimeFaces\n\nThe last dependency we need\
    \ to upgrade is **PrimeFaces**. This upgrade also consists of two steps: upgrading\
    \ the dependency to the latest version and changing the PrimeFaces theme because\
    \ the theme used by the project is no longer supported.\n\nTo upgrade the primefaces\
    \ dependency, we need to change the version and add a classifier."
  - "[PAGE 61]\n\nThe current primefaces dependency looks like the following:\n\n\
    ```\n<dependency>\n    <groupId>org.primefaces</groupId>\n    <artifactId>primefaces</artifactId>\n\
    \    <version>8.0</version>\n</dependency>\n```\n\nWith the upgrade, it should\
    \ look like the following example. We changed the version to 10.0.0 and added\
    \ the jakarta classifier:\n\n```\n<dependency>\n    <groupId>org.primefaces</groupId>\n\
    \    <artifactId>primefaces</artifactId>\n    <version>10.0.0</version>\n    <classifier>jakarta</classifier>\n\
    </dependency>\n```\n\nAs mentioned earlier, we need to change the theme. To do\
    \ this, go to the web.xml file and look for the following lines at the top part\
    \ of the file:\n\n```\n<context-param>\n    <param-name>primefaces.THEME</param-name>\n\
    \    <param-value>omega</param-value>\n</context-param>\n```\n\nThe param-value\
    \ tells PrimeFaces we want to use the omega theme for the project. This theme\
    \ is not usable with version 10 of PrimeFaces. To switch to a different theme,\
    \ change the previous code line into this:\n\n```\n<context-param>\n    <param-name>primefaces.THEME</param-name>\n\
    \    <param-value>saga</param-value>\n</context-param>\n```\n\nAfter performing\
    \ the last step, we concluded the migration from javax to jakarta. You can now\
    \ run mvn clean and mvn package cargo:run to run the Cargo tracker application\
    \ using Jakarta EE on Payara 6."
  - '[PAGE 62]


    # Red Hat MTA


    **MTA**, which stands for **Migration Toolkit for Applications**, can automatically
    convert your Java EE projects to Jakarta EE. It does so by applying a certain
    set of rules. MTA is a very extensive product. Conversions can be done via the
    following:


    +   - A user interface

    +   - Command-line tools

    +   - An OpenShift operator

    +   - IDE plugins


    Before you can use MTA, you need to download (https://developers.redhat.com/products/mtr/download)
    and install it. For installation instructions, we refer you to the official documentation
    (https://access.redhat.com/documentation/en-us/migration_toolkit_for_applications/6.2/html/cli_guide/index?extIdCarryOver=true&sc_cid=701f2000001Css5AAC).
    You should install the command-line tools, as those will be the ones you will
    need for executing migrations on your machine.


    Once you have the command-line tools installed, you can start migrating. We will
    again use the IntelliJ plugin to execute the migration. You need to install the
    MTA plugin from the Plugins page:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_62_0.png)


    Figure 3.4 – MTA plugin installation screen'
