    \ {\n}\n```\n\n我们无法为这个类创建单元测试，因为该类内部没有任何方法。让我们现在创建一个：\n\n```java\nboolean goesToNetherlands(RouteSpecification\
    \ routeSpecification) {\n    Location destination = routeSpecification.getDestination();\n\
    \    return \"Netherlands\".equals(destination.getName());\n}\n```\n\n这只是一个简单的教学方法，旨在教你单元测试的基础知识。前面示例中的方法只做一件事——检查\
    \ `RouteSpecification` 实例的目的地是否等于荷兰。如果位置等于荷兰，则返回 true；如果不是，则返回 `false`。\n\n让我们为\
    \ `RoutingHelper` 类创建一个测试类。每个类都位于一个目录结构中。对于 `RoutingHelper` 类，这就是 `src/main/java/org/eclipse/cargotracker/infrastructure/routing/RoutingHelper.java`。通常，测试会位于测试包中，但目录结构相同。\n\
    \n下一步是创建一个将用于存放该类单元测试的测试类。在此目录结构中创建一个名为 `RoutingHelperTest` 的文件：`src/test/java/org/eclipse/cargotracker/infrastructure/routing/RoutingHelperTest.java`。注意两个路径中的第二个目录。生产代码位于\
    \ main 包中，而测试代码位于 test 包中。这样很容易区分，并且你不会意外地从生产代码中调用测试代码。\n\n确保 `RoutingHelperTest`\
    \ 类的内容如下所示：\n\n```java\npackage org.eclipse.cargotracker.infrastructure.routing;\n\
    import static org.junit.jupiter.api.Assertions.*;\nclass RoutingHelperTest {\n\
    }\n```\n\n测试类创建完成后，我们就可以构建第一个单元测试了。让我们先从一个名为 goesToNetherlands_success 的空方法开始。我们给测试方法取与所测试方法相同的名称，并加上下划线和预期行为。这样我们就能在不阅读方法实现的情况下知道该方法测试什么以及预期结果是什么。第一个单元测试看起来像这样：\n\
    \n```java\n@Test\nvoid goesToNetherlands_success() {\n}\n```\n\n每个单元测试都用 @Test\
    \ 注解标记。这告诉 JUnit 哪些方法是测试方法，哪些不是。下一步是测试你的 goesToNetherlands 方法。在测试内部，我们将使用 given、when、then\
    \ 结构。given 部分告诉读者测试的基础是什么以及测试需要哪些实例。when 部分调用生产代码。在 then 部分，我们验证发生的事情是否正确。\n\n\
    对于我们的第一个单元测试，我们需要在 given 部分创建一个 RouteSpecification 类。在 when 部分，我们使用在 given 部分创建的\
    \ RouteSpecification 类调用 goesToNetherlands 方法。在测试方法的最后一部分，我们将验证发生的事情是否正确。\n\n\
    生成的单元测试如下所示：\n\n```java\n@Test\nvoid goesToNetherlands_success() {\n\n    // given\n\
    \    Location locationNetherlands = new Location(new UnLocode(\"XXXXX\"), \"Netherlands\"\
    );\n    Location locationGermany = new Location(new UnLocode(\"00000\"), \"Germany\"\
    );\n    RouteSpecification routeSpecification = new RouteSpecification(locationGermany,\
