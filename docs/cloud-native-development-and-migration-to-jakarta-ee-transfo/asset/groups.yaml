    ```\n\nPrometheus 使用拉取机制从其监控的应用程序收集指标。这有几个好处，例如可以提前知道应用程序是否宕机。在上一节中，你设置了一个 Prometheus\
    \ 可以用来拉取指标的端点。\n\n## 设置 Docker Compose\n\n我们将使用 Docker 运行一个 Prometheus 实例。为此，我们需要修改已有的\
    \ Docker Compose 文件，以便添加一个 Prometheus 服务。\n\n在 Docker Compose 文件中，添加以下行：\n\n```\n\
    ```text\nprometheus:\n  image: bitnami/prometheus:latest\n  ports:\n    - \"9090:9090\"\
    \n```\n```\n\n前一个示例中的第一行是我们想要创建的服务的名称。在本例中，它是 Prometheus。然后，我们必须定义属于该服务的镜像。这里，我们使用\
    \ Bitnami 构建的最新 Prometheus 镜像。最后，我们需要定义一些端口，以便在实例运行后可以连接。我们选择将 `9000` 端口转发到 `9000`。运行此代码后，你将拥有一个正在运行的\
    \ Prometheus 实例，但它不会凭空开始收集指标。如果你访问 `localhost:9000`，你会看到一个空的 Prometheus 实例，没有任何可查询的数据。为了解决这个问题，在下一节中，我们将创建一个作业来收集数据。\n\
    \n## 设置 Prometheus 配置\n\n第一次启动 `docker-compose` 时，你会看到一个空的 Prometheus 实例，它不收集也没有任何指标。如果你只想尝试一些东西，这是可以的。如果你删除了\
    \ Prometheus 实例的容器，你将不得不重新开始，如果你经常删除容器，这可能会很麻烦。同样的情况也适用于想要与你相同设置的同事。你的同事必须像你一样设置他们的\
    \ Prometheus 实例。如果你必须为整个团队和每个想要运行 Prometheus 服务的环境，例如测试、验收和生产，这样做也会变得乏味。\n\n为了解决这个问题，首先要做的是在项目中创建一个目录来存放配置文件。我们在项目文件夹内直接创建了一个目录。完整路径如下：`cargo-tracker/prometheus`。在\
    \ Prometheus 实例内部，你需要为配置创建一个文件；我们选择将此文件命名为 `prometheus.yml`。这将是一个 YAML 文件，指定一些全局设置以及\
    \ Prometheus 对 `cargo-tracker` 应用程序执行的抓取作业的设置。\n\n在 `prometheus.yml` 文件中，你需要放置以下配置：\n\
    \n```\n```yaml\nglobal:\n  scrape_interval:     10s\n\n  external_labels:\n  \
    \  monitor: 'payara5-monitor'\n\nscrape_configs:\n  - job_name: 'payara5'\n  \
    \  scrape_interval: 2s\n    metrics_path: '/metrics'\n    static_configs:\n  \
    \    - targets: ['cargo-tracker-app:8080']\n```\n```\n\n此配置为 Prometheus 创建了一个抓取配置。这告诉\
    \ Prometheus 以下内容：\n\n- 作业的名称\n- 它应该多久抓取一次给定的指标\n- 目标上的指标路径\n- 抓取的目标\n\n在上一节中，你可以在\
    \ `localhost:8080/metrics` 查看 `cargo-tracker` 的指标。你必须做同样的事情，让 Prometheus 知道它可以在哪里找到指标。由于我们使用\
    \ docker-compose，我们不必使用 localhost；我们可以使用服务名称代替。在之前的章节的 `docker-compose` 中，我们有一个名为\
    \ `cargo-tracker` 的服务。我们可以在作业配置中使用该名称，Docker 将其解析为 Prometheus 实例可用的实际地址。使用服务名称，我们可以像这样指定目标应用程序：`cargo-tracker-app:8080`。Prometheus\
    \ 将使用的完整 URL 将是 `cargo-tracker-app:8080/metrics`。\n\n配置好配置文件后，你需要在 `docker-compose`\
    \ 文件中添加一行。我们创建了配置文件，但没有告诉 Prometheus 使用它，因此我们需要使此文件在容器内可用。为此，我们需要在 `docker-compose`\
    \ 文件中使用 volume 关键字挂载 `prometheus.yml` 文件，像这样：\n\n```\n```yaml\nvolumes:\n  - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
    ```\n```\n\n添加此行后，配置将可供 Prometheus 使用。完整的 docker-compose 将如下所示：\n\n```\n```yaml\n\
    version: \"3.9\"\nservices:\n  cargo-tracker-app:\n    build: .\n    ports:\n\
    \      - \"4848:4848\"\n      - \"8080:8080\"\n      - \"8181:8181\"\n      -\
    \ \"9009:9009\"\n  prometheus:\n    image: bitnami/prometheus:latest\n    volumes:\n\
    \      - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
    \    ports:\n      - \"9090:9090\"\n```\n```\n\n现在配置文件和 docker-compose 都已准备就绪，我们可以启动\
    \ docker-compose 文件并查看是否有效。在浏览器中，访问 `http://localhost:9090/config`。在这里，你可以看到 Prometheus\
    \ 实例的配置。如果一切正常，你应该会看到以下输出：\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_85_0.png)\n\
    \n图 4.1 – Prometheus 中的配置\n\n"
