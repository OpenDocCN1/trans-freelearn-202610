    \n## 总结\n\n在本章中，我们将应用迁移到了云平台。我们选择了 Microsoft Azure，但也可以是任何云提供商。我们演示了如何设置容器注册表、如何进行实际部署，以及如何查看正在运行的容器实例的指标。\n\
    \n现在，你已经将现有的单体应用迁移到了云端。你已经通过弹性等云原生特性对其进行了增强。你已经走了很长一段路，也许这正是你打算止步的地方。或者，你可能会选择走上将单体拆分为独立应用或微服务的道路。这里无所谓好坏，怎么做完全取决于应用本身及其预期用途。在下一章，我们将了解\
    \ MicroProfile，因为它可以帮助你为应用添加更多云原生特性。\n\n## 10 介绍 MicroProfile\n\n到目前为止，你应该已经清楚如何将应用迁移到云端。尽管你的应用现在已在云端运行，但这并不意味着它就展示出了云原生能力。要实现这一点，还需要一些额外步骤。这些额外步骤可以通过使用\
