    \ 将不会被添加到追踪中。\n\n## 代理插桩\n\n代理插桩允许你通过指定一个 JAR 文件将 Java 代理附加到应用程序。通过这种方式，你可以为多个流行的\
    \ Java 框架和库添加追踪支持。\n\nJava 代理通过 javaagent 参数附加到 JVM，如下所示，但其具体配置可能因你使用的服务器而异：\n\
    \n```\n-javaagent: opentelemetry-javaagent.jar\n```\n\n## 其他规范\n\n在本节中，我们仅简要介绍其他几个规范，目的是让你快速了解其功能。\n\
    \n## OpenAPI\n\n该规范为 OpenAPI 提供了 Java API，OpenAPI 是一种允许开发者公开其 API 文档的规范。\n\n它包含不少于\
    \ 46 个可添加到代码中的注解，使你能够完整地描述 API、资源、参数和返回值。\n\n以下示例摘自官方 MicroProfile OpenAPI 规范文档：\n\
    \n```\n@GET\n@Path(\"/{username}\")\n```\n\n```\n@Operation(summary = \"Get user\
    \ by user name\")\n@APIResponse(description = \"The user\",\n    content = @Content(mediaType\
    \ = \"application/json\",\n        schema = @Schema(implementation =\nUser.class))),\n\
    @APIResponse(responseCode = \"400\", description = \"User not found\")\npublic\
    \ Response getUserByName(\n    @Parameter(description = \"The name that needs\
    \ to be fetched. Use user1 for testing. \", required = true) @PathParam(\"username\"\
    )\nString username)\n{...}\n```\n\n## RestClient\n\nMicroProfile RestClient 提供了一种类型安全的方式来通过\
    \ HTTP 调用 RESTful 服务。这可以通过指定一个接口来实现，该接口包含你要调用的远程 API 的方法，并使用 RESTful 注解进行标注。\n\
    \n同样摘自官方文档，以下是一个示例接口：\n\n```\n@Path(\"/movies\")\npublic interface MovieReviewService\
    \ {\n    @GET\n    Set<Movie> getAllMovies();\n```\n\n然后，该接口以这种方式用于创建客户端：\n\n\
    ```\nURI apiUri = new URI(\"http://localhost:9080/movieReviewService\");\nMovieReviewService\
    \ reviewSvc = RestClientBuilder.newBuilder()\n    .baseUri(apiUri)\n    .build(MovieReviewService.class);\n\
    Set<Review> reviews = reviewSvc.getAllMovies();\n```\n\n## JSON Web Token 认证\n\
    \nJSON Web Token (JWT) 认证是一种用于识别已认证用户及其角色的认证机制。\n\n它在成功认证后由服务器生成，然后通过 HTTP 发送到系统想要访问的其他服务。通常，JWT\
    \ 既经过加密也经过签名。接收系统可以验证签名者并解密 JWT。\n\n这种认证和授权系统通常用于服务到服务的环境中，其中每个服务都会传递 JWT。\n\n\
    ## Jakarta EE 10 核心概要\n\n该规范是 MicroProfile 6.0 中的新规范。在此之前，MicroProfile 核心规范包括\
    \ Jakarta RESTful Web Services、Jakarta JSON Binding、Jakarta JSON Processing、Jakarta\
    \ Dependency Injection 和 Jakarta Annotations。\n\n在 MicroProfile 6.0 中，决定通过采用 Jakarta\
    \ EE 的 Core Profile 将这些规范纳入一个总括规范。这个新的核心规范轻量级，但足以满足微服务和边缘计算的需求。\n\n## 总结\n\n在本章中，你了解了\
    \ MicroProfile 的全部内容。我们逐一介绍了每个必需的规范。我们还详细讨论了升级 Cargo Tracker 应用程序为云原生版本时感兴趣的规范。\n\
    \n在下一章中，当我们升级 Cargo Tracker 应用程序时，将会看到 Config、Health、Fault Tolerance 和 Metrics\
