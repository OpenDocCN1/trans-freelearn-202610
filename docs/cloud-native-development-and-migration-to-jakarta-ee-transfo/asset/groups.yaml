    => [1/2] FROM docker.io/payara/server-full:6.2023.2-jdk17@sha256:6b-96c248d0e2cf18d6768883a2881389acfd743b13758b155724233713813f
    0.0s

    => CACHED [2/2] COPY target/cargo-tracker.war /opt/payara/deployments 0.0s

    => exporting to image 0.0s

    => => exporting layers 0.0s

