    \ with Fedora, but you should follow the instructions for your own platform.\n\
    \nThe first step is to install the dnf-plugins-core package, which contains commands\
    \ so that you can manage the DNF repositories. Run the following command to install\
    \ this package:\n\n```\nsudo dnf -y install dnf-plugins-core\n```\n\nThe next\
    \ step is to add the Docker repo using the following command:\n\n```\nsudo dnf\
    \ config-manager \\\n  --add-repo \\\n  https://download.docker.com/linux/fedora/docker-ce.repo\n\
    ```\n\nWith the repository added, we will download and install the rpm package.\
    \ You can find the latest version of the file in the installation instructions\
    \ of your platform. You can also use the following URL to use the same version\
    \ as us: https://desktop.docker.com/linux/main/amd64/docker-desktop-4.17.0-x86_64.rpm?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64.\
    \ When you have the rpm package, install it on your system using the following\
    \ command:\n\n```\nsudo dnf install ./docker-desktop-4.17.0-x86_64.rpm\n```\n\n\
    During the installation, you will have to answer some questions; the first one\
    \ is about the dependencies that will be downloaded, upgraded, and installed and\
    \ whether you agree with these changes. To agree, press Enter.\n\nThe second question\
    \ is about whether you want to import a GPG key for Docker; again, press Enter\
    \ to accept the import. Now, the tool will be installed on your Fedora machine.\n\
    \nWhen the installation is complete, you will see the following result in the\
    \ console:\n\n```\nxclip-0.13-18.git11cba61.fc37.x86_64\nxorg-x11-proto-devel-2022.2-2.fc37.noarch\n\
    xz-devel-5.4.1-1.fc37.x86_64\nComplete!\n```\n\nWhen you see this, you have Docker\
    \ installed on your system. There are two ways to start the Docker Desktop application.\
    \ You can start it from the Show applications screen or you can run the following\
    \ command to start Docker:\n\n```\nsystemctl --user start docker-desktop\n```"
  - '[PAGE 115]


    In some cases, it can be handy to know whether Docker is installed on a system
    and, if so, to know what version of it is running. To check the version of Docker
    on a system, run the following command:


    ```

    docker version

    ```


    This will show you lots of information about what version of Docker is running,
    but this line in the output is particularly interesting:


    ```

    Server: Docker Desktop 4.17.0 (99724)

    ```


    This line tells you that you are using Docker Desktop version 4.17.0 as the server
    for your Docker containers.


    # Running a Docker container


    In this section, you will take the Cargo Tracker application, build a Docker file
    for it, and run it as a Docker container on your system. We will start by creating
    a Docker file that you can use. Using the Docker file, we will tell Docker Engine
    how to create the container for us and how we want to run it. With the container
    running, we will look at how to use the command-line interface to manage the container
    to see the logs generated by the Cargo Tracker application. The creation of this
    Docker file will be the starting point of our journey toward running the Cargo
    Tracker on Docker.


    # Creating a Docker container


    The first step to run the Cargo Tracker on Docker Engine is to create a Docker
    file. The Docker file contains instructions for Docker Engine on how to create
    the container we want. Start by creating a file named Dockerfile in the root of
    the Cargo Tracker application. Inside the Docker file, you need to add the following
    two lines of code:


    ```

    FROM payara/server-full:6.2023.2-jdk17


    COPY target/cargo-tracker.war $DEPLOY_DIR

    ```


    The first line of code specifies the parent image that we want to use. In this
    case, we have opted to build our Docker image on top of a full Payara server with
    version number 6.2023.2, which also has support for Java 17. This means that our
    Docker container will have all the necessary tools to run the Cargo Tracker application
    seamlessly.


    The second line of code is a copy command. This command is used to copy the Cargo
    Tracker application’s WAR file to a variable named $DEPLOY_DIR. The parent Docker
    image we have selected uses this variable to search for applications to deploy.
    Therefore, by placing a copy of the Cargo Tracker in this directory, we ensure
    that it will be deployed automatically once the container is created.'
  - '[PAGE 116]


    After creating the Docker file, the next step is to use it to tell Docker Engine
    how to create the container and how we want to run it. Once the container is up
    and running, we can use the command-line interface to manage it and view the logs
    generated by the Cargo Tracker application. This will enable us to monitor the
    application’s performance and make any necessary adjustments to ensure that it
    runs smoothly.


    # Building a container


    The next step is to tell Docker Engine to build the container we just specified
    using the Dockerfile. To create the container, we will use the Docker client,
    which is a command-line interface that lets you interact with the Docker daemon
    and manage containers. Using the terminal, navigate to the root of the Cargo Tracker
    application where you just created the Dockerfile. When inside the Cargo Tracker
    directory, perform the following command:


    ```

    docker build -t cargo-tracker .

    ```


    This tells Docker Engine to create a container for the Cargo Tracker application
    using the Dockerfile we created in the previous steps.


    If this command executes successfully, you will see something in the console that
    looks like the following:


    ```

    [+] Building 0.5s (7/7) FINISHED

    => [internal] load build definition from Dockerfile 0.0s

