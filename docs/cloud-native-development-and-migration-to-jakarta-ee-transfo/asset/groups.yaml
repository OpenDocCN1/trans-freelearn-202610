  - '[PAGE 47]


    With CMTs, the EJB container takes full control of starting, committing, and rolling
    back transactions. By default, the container will add transaction management to
    every public method in an EJB. If you would like to exclude certain public methods
    from running inside transactions, you can do so by specifying TransactionAttribute
    on the method.


    In BMTs, the code in the EJB programmatically defines the boundaries of the transaction.
    This means that a transaction is started, committed, or rolled back in code. A
    transaction that''s started in a method call to a stateless session bean must
    always be completed when that method completes.


    The Cargo Tracker application uses CMTs with the @Transactional and @TransactionAttribute
    annotations to configure transaction management.


    # Batch


    The Java EE platform contains functionality to run batch jobs. These are jobs
    that can run without any user interaction required. Examples of batch jobs are
    end-of-month processing in financials, generating reports, or periodically checking
    the filesystem for new files that need to be processed.


    One thing each of these batch jobs has in common is that they consist of one or
    more steps that need to be executed. In Java EE, a batch job and its steps are
    described in an XML file. Each step is either a Chunk or a Task. Chunk steps can
    be executed in multiple threads simultaneously, while Tasks cannot.


    Several steps grouped together are called a flow. Once grouped, they are executed
    as a unit. Several flows that can be executed in parallel are called split.


    # Summary


    There is a lot of great technology inside the Cargo Tracker application. It is
    an application that was built to highlight that Java EE is a great framework for
    building applications. In this book, we are going to migrate the Cargo Tracker
    application to the even better Jakarta EE framework.


    The application is made to book new cargo and keep track of the booked cargo.
    The tracker view shows you the status of the cargo. The administrative interface
    shows the status and lets you book and route cargo.


    We also introduced some of the Java EE technologies used in the Cargo Tracker
    application and explained their usage.'
