    # @Metric


    @Metric contains the metadata information when a metric is requested to be injected.
    It can be applied to fields and parameters.


    When using this annotation, the implementation needs to inject the request metric
    into the field or parameter:


    ```

    @Inject

    @Metric(name = "total_projects")

    Long projectCount;

    ```


    The value of the gauge that we defined previously is injected into the projectCount
    field. This allows your code to directly act upon collected metrics.


    # @Timed


    @Timed tracks the duration of the annotated object. It can be applied to methods,
    constructors, and types. It tracks how often the object was invoked and how long
    it took to complete.


    Here''s an example of its usage:


    ```

    @POST

    @Timed(name = "project_create_duration")

    public Response post(Project project)

    ```


    # Telemetry Tracing


    The telemetry specification is new in MicroProfile 6. Telemetry assembles information
    regarding the applications running in a microservice environment. This information
    can come from various sources, most notably logs, traces, and metrics.


    MicroProfile already had a specification for tracing known as the Open Tracing
    specification. Replacing one with the other did cause some stir in the community,
    but in the end, the choice of OpenTelemetry makes sense. It is a CNCF-supported
    project (https://www.cncf.io/projects/opentelemetry/). Furthermore, it is vendor-
    and tool-agnostic and can be integrated with a broad number of open source and
    commercial projects.'
  - '[PAGE 178]


    MicroProfile uses the OpenTelemetry project to implement telemetry. In version
    1.0 of the specification, logging, and metrics are considered out of scope and
    be implemented in any way that’s desired.


    There are various concepts to understand regarding distributed traces: first and
    foremost, your application is performing several tasks. Some may be internal,
    some might be related to an external entity, such as a database, and some might
    include calling other external services. A distributed trace keeps track of all
    the activities and their duration. In doing so, it is possible to paint a clear
    picture of the complete process, spanning multiple systems.


    As an example, assume you have a system that verifies if someone subscribes to
    a newsletter of your company. You need to verify if the email address is not already
    registered. If it is a new subscriber, register them and ask for the mailing service
    to send them the latest newsletter.


    The message would typically arrive via because your application has a Jakarta
    Message listener (component 1) in place that listens to a specific queue. Next,
    your application (component 2) will verify if the email is already enlisted via
    querying the database (component 3). Finally, if the email address is not known,
    your application may invoke the SendNewsletter service (component 4) to send the
    current issue of the newsletter to the new subscriber.


    (Note that more likely, your application would have placed a Jakarta Message on
    another queue on which the SendNewsletter services listen, resulting in an even
    larger number of components being involved).


    If you want to have a complete overview of this process in real life, you need
    a trace that spans all these systems, hence the name distributed tracing. A distributed
    trace records the paths a request takes as it propagates through multi-service
    architectures.


    A distributed trace consists of several spans. A span is a unit of work or operation.
    In the preceding example, invoking each of the components should lead to a span
    being registered in the trace.


    Telemetry can be implemented in any of the following instrumentation ways:


    +   - Automatic instrumentation

    +   - Manual instrumentation

    +   - Agent instrumentation


    Let’s look at each of these possibilities.


    # Automatic instrumentation


    Jakarta RESTful Web Services and MicroProfile REST clients automatically participate
    in distributed tracing. You do not have to make any code changes to achieve this.'
