  md: "\nCargo Tracker offers the functionality to change a destination. This will\
    \ be done from the `changeDestination` screen. The `.xhtml` file is backed by\
    \ a `@Named` backing bean called `ChangeDestination`. It offers users a dropdown\
    \ to select the name of the new location. This dropdown is backed by a list of\
    \ locations called `potentialDestinations`. This list is loaded during the bean’s\
    \ initialization. It retrieves the locations via `listShippingLocations` of `BookingServiceFacade`.\
    \ This method does the actual loading by querying the database.\n\nPhew – that\
    \ was quite a trip! It has shown us how quickly things can become complicated,\
    \ especially with an application such as Cargo Tracker, which was set up with\
    \ **domain-driven design (DDD)** in mind and where there is a clear distinction\
    \ between the different architectural layers of the application.\n\nAnyway, if\
    \ for some reason (yes, network, we are looking at you!) the required values cannot\
    \ be retrieved, it would be nice to provide a default response. Let’s be honest\
    \ – an empty list with locations is still better than reporting some strange error\
    \ to the user.\n\nWe will annotate `listShippingLocations` with a default response\
    \ via `@Fallback`.\n\nHave a look at the following code:\n\n```java\n@Override\n\
    @Fallback(fallbackMethod = \"shippingLocationsFallback\")\npublic List<org.eclipse.cargotracker.interfaces.booking.facade.dto.Location>\
    \ listShippingLocations() {\n```\n\nNote that any situation that makes `listShippingLocations`\
    \ throw an exception will trigger the fallback method. You can configure this\
    \ behavior with the `applyOn` and `skipOn` parameters.\n\nNext, we need to provide\
    \ an implementation for the method that is specified in the `fallbackMethod` parameter.\n\
    \nIt will look like this:\n\n```java\nprivate List<org.eclipse.cargotracker.interfaces.booking.facade.dto.Location>\
    \ listShippingLocationsFallback() {\n    return List.of();\n}\n```\n\nNote that\
    \ the fallback method can be private, and in most situations, it should be private\
    \ to prevent any other class from having unwanted access to this method.\n\nWe\
    \ simply return an empty list here because we have no reasonable alternative values.\n\
    \n## Adding the second cloud-native feature – monitoring\n\nSo, we have made our\
    \ application more robust than it was by adding some resilience features. Next,\
    \ we will go a step further and add monitoring functionality to our application.\n\
    \nThe idea behind monitoring is two-fold.\n\nFirst, it should supply you with\
    \ information that your system is running as expected. Any errors, exceptions,\
    \ network failures, database hiccups, and more should be identified, registered,\
    \ and reported.\n\nSecondly, monitoring should provide you with information about\
    \ the usage of the system. How many new users do we have, how many orders are\
    \ there in the system, how often is a certain REST endpoint accessed, and how\
    \ often is a critical business method invoked?\n\nThe monitoring process consists\
    \ of several steps:\n\n1. Add annotations to your code that will actively monitor\
    \ the metrics.\n2. Expose the metrics data for harvesting.\n3. Harvest the data.\n\
    4. Generate alerts and create visualized data.\n\nIn this section, we will discuss\
    \ the first step and identify what we want to monitor and how to make the required\
    \ code changes.\n\n### Looking at the default metrics of a running system\n\n\
    Out of the box, MicroProfile Metrics already gathers a lot of information when\
    \ it comes to the state of your application. It defines three categories of information:\n\
    \n1. System metrics.\n2. Application metrics.\n3. Vendor-specific metrics.\n\n\
    Let’s take a look at these metrics. We will use the Cargo Tracker application\
    \ for this. Navigate to http://localhost:8080/metrics; you will see a list of\
    \ all default metrics. Here is a part of the output:\n\n```text\n# TYPE base_cpu_availableProcessors\
    \ gauge\nbase_cpu_availableProcessors 10\n# TYPE base_cpu_systemLoadAverage gauge\n\
    base_cpu_systemLoadAverage 5.9248046875\n# TYPE base_gc_total_total counter\n\
    base_gc_total_total{name=\"G1 Young Generation\"} 54\nbase_gc_total_total{name=\"\
    G1 Old Generation\"} 0\n# TYPE base_jvm_uptime_seconds gauge\nbase_jvm_uptime_seconds\
    \ 56.064\n# TYPE base_memory_committedHeap_bytes gauge\nbase_memory_committedHeap_bytes\
    \ 2.87309824E8\n# TYPE base_memory_committedNonHeap_bytes gauge\nbase_memory_committedNonHeap_bytes\
    \ 2.17448448E8\n# TYPE base_memory_maxHeap_bytes gauge\nbase_memory_maxHeap_bytes\
    \ 5.36870912E8\n# TYPE base_memory_maxNonHeap_bytes gauge\nbase_memory_maxNonHeap_bytes\
    \ -1\n# TYPE base_memory_usedHeap_bytes gauge\nbase_memory_usedHeap_bytes 2.28326272E8\n\
    ```\n\nNote that for brevity, we left out the #HELP lines.\n\nSome of these metrics\
    \ might be quite useful as they allow you to monitor the behavior and health of\
    \ your system. This data is very important for teams who have to support the application\
    \ while it is in production. The metrics can be the number of processors, the\
    \ average load of the processors, the number of garbage collections, the uptime,\
    \ and several memory statistics. The latter might come in handy as a way of determining\
    \ memory leaks in your application.\n\nAt the end of the output, we can see a\
    \ vendor-specific metric:\n\n```text\n# TYPE vendor_system_cpu_load gauge\nvendor_system_cpu_load\
    \ 0.08853118712273642\n```\n\n### Adding metrics to your system\n\nNext, we are\
    \ going to add some metrics of our own to the Cargo Tracker application. The first\
    \ step is to identify which metrics you or your stakeholder might be interested\
    \ in. The tech department will likely be very interested in metrics that can help\
    \ verify that the system is working as expected. The business stakeholders, on\
    \ the other hand, might be more interested in some business-oriented key performance\
    \ indicators. In this section, we are going to add some of both types to our application.\n\
    \nRecall *Chapter 2*, where we introduced the Cargo Tracker application, which\
    \ has one REST endpoint to retrieve information about existing shipments. That\
    \ endpoint can be reached at `http://localhost:8080/cargo-tracker/rest/cargo`\
    \ and will show a list of outstanding shipments.\n\nHere is part of the output:\n\
    \n```json\n{\n  \"trackingId\": \"ABC123\",\n  \"routingStatus\": \"ROUTED\",\n\
    \  \"misdirected\": false,\n  \"transportStatus\": \"IN_PORT\",\n  \"atDestination\"\
    : false,\n  \"origin\": \"CNHKG\",\n  \"lastKnownLocation\": \"USNYC\"\n},\n{\n\
    \  \"trackingId\": \"JKLS67\",\n  \"routingStatus\": \"ROUTED\",\n  \"misdirected\"\
    : true,\n  \"transportStatus\": \"ONBOARD_CARRIER\",\n  \"atDestination\": false,\n\
    \  \"origin\": \"CNHGH\",\n  \"lastKnownLocation\": \"USNYC\"\n}\n```\n\nWe might\
    \ be interested in how often this endpoint is being invoked. To set up metrics\
    \ for this, we need to change the code in the CargoMonitorService class, as follows:\n\
    \n```java\n@GET\n@Produces(MediaType.APPLICATION_JSON)\n@Counted(name = \"getAllCargo\"\
    , absolute = true)\npublic JsonArray getAllCargo() {\n```\n\nHere, we added the\
    \ @Counted annotation. We have named the metric `getAllCargo`. By specifying `absolute=true`,\
    \ the metric will be registered in the output as `application_getAllCargo`. When\
    \ we set `absolute` to `false`, the full package path and class name will be prepended\
    \ to the given name.\n\nLet’s fire a few HTTP requests to the REST endpoint (`http://localhost:8080/cargo-tracker/rest/cargo`)\
    \ to invoke the method several times. Then, when we invoke the metrics endpoint\
    \ again via `http://localhost:8080/metrics`, we should see that an entry has been\
    \ added at the bottom, like this:\n\n```text\n# TYPE application_getAllCargo_total\
    \ counter\napplication_getAllCargo_total 3\n```\n\nAnother useful metric involves\
    \ determining how long a method is running. For this, we can use the @Timed annotation.\n\
    \nWe will apply this metric to the same method, so it will look like this:\n\n\
    ```java\n@GET\n@Produces(MediaType.APPLICATION_JSON)\n@Counted(name = \"getAllCargo\"\
    , absolute = false)\n@Timed(name = \"getAllCargoTiming\", absolute = false, tags\
    \ = {\"type=performance\"})\npublic JsonArray getAllCargo() {\n```\n\nNote that\
    \ we are storing the information for the metrics under `getAllCargoTiming` and\
    \ that we are also adding a selector key/value pair. This will enable us to make\
    \ more precise selections on the resulting data.\n"
