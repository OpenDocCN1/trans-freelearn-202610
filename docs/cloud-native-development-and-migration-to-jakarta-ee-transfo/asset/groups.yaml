    identifier\", UUID.randomUUID().toString())\n        .startSpan();\n    span.end();\n\
    \    return Response.ok().build();\n}\n```\n\nNote that span.end() is needed when\
    \ you're manually adding a span to the trace. Not doing so will result in the\
    \ span not being added to the trace.\n\n## Agent instrumentation\n\nAgent instrumentation\
    \ allows you to attach a Java agent to your application by specifying a JAR file.\
    \ By doing this, you can add tracing support for several popular Java frameworks\
    \ and libraries.\n\nA Java agent is attached to a JVM with javaagent arguments,\
    \ like the one shown here, but its specification may vary depending on the server\
    \ you use:\n\n```\n-javaagent: opentelemetry-javaagent.jar\n```\n\n## Other specifications\n\
    \nThere are several other specifications that we will touch upon only briefly\
    \ in this section. This is meant to give you a quick introduction to their functionality.\n\
    \n## OpenAPI\n\nThis specification supplies a Java API for OpenAPI, a specification\
    \ that allows developers to expose their API documentation.\n\nIt holds no less\
    \ than 46 annotations that can be added to your code and allows you to completely\
    \ describe your API, resources, parameters, and return values.\n\nThe following\
    \ example has been taken from the official MicroProfile OpenAPI specification\
    \ documentation:\n\n```\n@GET\n@Path(\"/{username}\")\n```\n\n```\n@Operation(summary\
    \ = \"Get user by user name\")\n@APIResponse(description = \"The user\",\n   \
    \ content = @Content(mediaType = \"application/json\",\n        schema = @Schema(implementation\
    \ =\nUser.class))),\n@APIResponse(responseCode = \"400\", description = \"User\
    \ not found\")\npublic Response getUserByName(\n    @Parameter(description = \"\
    The name that needs to be fetched. Use user1 for testing. \", required = true)\
    \ @PathParam(\"username\")\nString username)\n{...}\n```\n\n## RestClient\n\n\
    The MicroProfile RestClient supplies a type-safe approach for invoking a RESTful\
    \ service over HTTP. This can be achieved by specifying an interface that holds\
    \ the methods of the remote API you want to invoke, annotated with RESTful annotations.\n\
    \nAgain, from the official documentation, here is an example interface:\n\n```\n\
    @Path(\"/movies\")\npublic interface MovieReviewService {\n    @GET\n    Set<Movie>\
    \ getAllMovies();\n```\n\nThis interface is then used to create a client in this\
    \ way:\n\n```\nURI apiUri = new URI(\"http://localhost:9080/movieReviewService\"\
    );\nMovieReviewService reviewSvc = RestClientBuilder.newBuilder()\n    .baseUri(apiUri)\n\
    \    .build(MovieReviewService.class);\nSet<Review> reviews = reviewSvc.getAllMovies();\n\
    ```\n\n## JSON Web Token Authentication\n\nJSON Web Token (JWT) authentication\
    \ is an authentication mechanism that’s used to identify an authenticated user\
    \ and their roles.\n\nIt is generated by the server after successful authentication\
    \ and then sent over HTTP to other services that a system wants to access. Commonly,\
    \ JWT is both encrypted and signed. The receiving system can verify the signer\
    \ and decrypt the JWT.\n\nThis authentication and authorization system is typically\
    \ used in a service-to-service environment where each service passes the JWT along.\n\
    \n## Jakarta EE 10 Core Profile\n\nThis specification is new in MicroProfile 6.0.\
    \ Before this, the core MicroProfile specification included Jakarta RESTful Web\
    \ Services, Jakarta JSON Binding, Jakarta JSON Processing, Jakarta Dependency\
    \ Injection, and Jakarta Annotations.\n\nIn MicroProfile 6.0, it was decided to\
    \ add these specifications into an umbrella specification by adopting the Core\
    \ Profile from Jakarta EE. This new core specification is lightweight yet powerful\
    \ enough for both microservices and edge computing.\n\n## Summary\n\nIn this chapter,\
    \ you learned what MicroProfile is all about. We walked through each of the required\
    \ specifications. The specifications that are of interest when upgrading the Cargo\
    \ Tracker application to a cloud-native version were discussed in great detail.\n\
    \nWe will see the Config, Health, Fault Tolerance, and Metrics specification return\
    \ in the next chapter when we upgrade the Cargo Tracker application.\n\n## Appendix\
    \ A\n\n## Java EE to Jakarta EE names\n\nWhen Java EE was transferred to the Eclipse\
