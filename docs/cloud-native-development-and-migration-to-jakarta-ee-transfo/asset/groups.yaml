  - '[PAGE 94]


    # Technical requirements


    For this chapter, you need to have Docker installed on your system. For a detailed
    explanation, see Chapter 6, in which the complete installation of Docker is covered.
    We are going to use Docker to spin up instances for the integration tests. The
    first part of this chapter is doable without Docker; however, to get the most
    value out of this chapter, it is important to have Docker installed.


    You can find all the code examples from this chapter on GitHub: https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE/tree/chapter-5.
    The repository contains all the examples from this chapter.


    # The impact of testing on your migration


    Tests are a great tool to measure if your migration was a success or if you still
    need to fix some parts of the project you are migrating. When all the tests are
    working correctly, it means that all the functionality those tests cover works
    just as before the migration. There is also the possibility that some tests started
    failing during the migration, meaning that some parts of the migration broke the
    functionality.


    If the project you are migrating already has enough tests to cover the functionality,
    you can skim this chapter to see if you see new things you would like to incorporate
    in your testing strategy or see an alternative way of testing a Java application.
    To migrate an application, it is not necessary to overhaul the current testing
    strategy.


    If you are migrating a project with little to no tests, adding tests can help
    you immensely as the test will indicate if the project keeps working. This chapter
    covers one of many ways to write tests and have test coverage for the project
    you are migrating. There are a lot more libraries out there that are worth considering
    for testing your application, such as Arquillian, Jakarta REST client, and MicroProfile
    REST client.


    # Measuring code coverage of the project


    Having tests is great, but do you know how much of your project is covered by
    the tests inside the project? That is where test coverage comes in. Test coverage
    tells you how much production code is covered by tests. This tells you what functionality
    is covered by tests and what functionality has to be tested manually.


    Measuring test coverage is very easy when you use IntelliJ. All you have to do
    is navigate to a test class. Inside a test class, you can either right-click on
    the class to run the tests with coverage or you can run the tests with coverage
    from the menu options, as in the following screenshot:'
  - '[PAGE 95]


    Figure 5.1 – Running tests with coverage


    After running the test with coverage, you will see a report that shows you how
    much of your production code is covered by tests. This is how it will look:


    Figure 5.2 – Test coverage result


    In the previous screenshot, you can see the test coverage for various classes
    and what percentage of the class is covered. The RouteSpecification class is only
    covered for 55%. This means that not every method is covered. When you look at
    the line coverage, you see that only a little more than half the lines are covered.'
  - "[PAGE 96]\n\nWhat percentage of test coverage should you strive for? That depends\
    \ on many factors. It should be a percentage that you and your team are comfortable\
    \ with and gives you great confidence that the migrated functionality keeps working.\
    \ This could be either 60%, 90%, or even 100%. The important thing is that it\
    \ should help you move forward in your migration and not hold you back.\n\n# A\
    \ word about TDD\n\nA chapter about testing cannot miss a section about TDD. As\
    \ the name suggests, the test code drives the development of your production code.\
    \ When you use TDD, you start by creating a test case with, for example, JUnit.\
    \ In Java, that would look like this:\n\n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n\
    }\n```\n```\n\nThe last example shows an empty testing method. Here starts the\
    \ TDD adventure. From here on out, you are not supposed to develop any production\
    \ while the test succeeds. This means that if we want to develop a new feature,\
    \ we first need a failing or not compiling test.\n\nThe first step could be to\
    \ create an instance of what you need. This allows you to create a class that\
    \ you need to hold the business logic. It could be something as simple as the\
    \ following:\n\n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n\n   \
    \ RoutingHelper routingHelper = new RoutingHelper();\n}\n```\n```\n\nIf you try\
    \ to run/compile the project, you will get an exception saying something along\
    \ the lines of a class or reference is missing or does not exist. That is completely\
    \ true, and valid because it does not yet exist inside the project. When you are\
    \ doing TDD, you first want a failing test that you can fix. This is part of the\
    \ red-green cycle of TDD. You start with a failing test (red) and make it pass\
    \ (green). To make the test work, all you need to do is create a RoutingHelper\
    \ class and add it as an import to the test class.\n\nHere’s an example of the\
    \ RoutingHelper class that would make the test compile again:\n\n```\n```java\n\
    public class RoutingHelper {\n}\n```\n```"
  - "[PAGE 97]\n\nWhen you added the previous class from the example, you have a working\
    \ (green) test. The next step would be to make the test fail (red) again. You\
    \ could do that by adding a method call that you want the `RoutingHelper` class\
    \ to have. The next example shows you how this is done by adding a method call\
    \ inside the testing method:\n\n```\n```java\n@Test\nvoid goesToNetherlands_success()\
    \ {\n    RoutingHelper routingHelper = new RoutingHelper();\n    routingHelper.goesToNetherlands();\n\
    \n}\n```\n```\n\nWhen you add the method call, the test fails again because the\
    \ method does not exist yet. Creating this method would be the next step. What\
    \ we just did was go through the red-green cycle of TDD. We started with a failing\
    \ test, fixed it, made the test pass, and made it fail again. This is the basis\
    \ of TDD, and when you develop new features, you want to start with a failing\
    \ test and try to make it pass. This would be the start of a new red-green cycle.\
    \ TDD can be applied to any kind of code or test you are writing; this could be\
    \ a unit test or an integration test. When you use TDD for integration tests,\
    \ really try to keep the test execution of the test to be fast, because you are\
    \ going to execute the test several times.\n\n# How to create unit tests\n\nTesting\
    \ in Java is often done with unit tests. When people talk about test coverage\
    \ or if you have tests for your code, they most often mean unit tests. Unit testing\
    \ is a method to test the smallest unit of code. With Java, the smallest unit\
    \ of code is often a single method. With unit testing, we just test one single\
    \ method at a time. Sounds simple enough, right? Testing a single method is easy\
    \ if it doesn’t depend on another class, package, database, or even a framework\
    \ or entire application. That’s when unit testing often gets difficult and testing\
    \ code becomes a huge mess, and nobody wants to touch it anymore. We want to prevent\
    \ that, so we start at the basics and build our testing strategy up from there,\
    \ starting with a single unit test.\n\n# Tools and libraries required for unit\
    \ testing\n\nThe unit tests that you are going to write in this chapter depend\
    \ on two very popular testing libraries, JUnit and Mockito. For the unit tests\
    \ themselves, we are going to use JUnit, and we’ll use Mockito to mock any dependencies\
    \ the code has. These two libraries are very helpful and are almost essential\
    \ for every project.\n\nJUnit helps you to write the actual unit test. With its\
    \ built-in annotations, it enables you to mark methods and connect them to different\
    \ parts of the testing life cycle. A testing life cycle helps you to prepare object\
    \ instances for your tests. The other essential library is Mockito. Mockito is\
    \ a library that helps you to create mocks of existing classes in a straightforward\
    \ way. As you will see later in the examples, mocks are created so that we don’t\
    \ have to interact with real instances of classes and databases."
