  - "[PAGE 171]\n\n# MicroProfile Fault Tolerance\n\nSo, we have our service configured\
    \ and we can check its health. The next step for a microservice to become cloud-native\
    \ is adding some resilience. The service should be able to self-heal within certain\
    \ limits.\n\nThere are six annotations available within MicroProfile Fault Tolerance\
    \ that can help make your service more robust:\n\n+   - `@Asynchronous`\n+   -\
    \ `@Retry`\n+   - `@Timeout`\n+   - `@Bulkhead`\n+   - `@CircuitBreaker`\n+  \
    \ - `@Fallback`\n\nIt is good to know that these annotations can be added to both\
    \ CDI beans and public methods within those beans. Under the hood, they are implemented\
    \ via interceptors.\n\n# @Asynchronous\n\n@Asynchronous adds, well, asynchronous\
    \ behavior to the method it annotates. It wraps them into a method that returns\
    \ CompletableStage on which the other fault tolerance annotation can be applied.\n\
    \n@Asynchronous allows your code to run concurrently. Let's have a look at an\
    \ example:\n\n```\n@Inject\n\n// is annoted with @Asynchronous\nprivate CustomerDetailsService\
    \ customerDetails;\n@Inject\n// is annoted with @Asynchronous\nprivate CustomerSalesHistoryService\
