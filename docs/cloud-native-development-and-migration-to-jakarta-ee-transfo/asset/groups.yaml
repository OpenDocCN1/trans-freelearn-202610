    One of the key points of DevOps is that anything that can be automated should
    be automated, or as the adage goes: “Automate everything!”.


    ## CI/CD


    CI/CD is a process where changes to a code base are automatically integrated into
    this code base and are rolled out to production.


    CI works like this:


    1. A developer works on a so-called feature branch to make changes to the system.
    A feature branch is essentially a copy of the original software (which is on the
    main branch).

    2. When they are finished working on the task, they will run unit tests locally.
    Once these tests are all “green,” meaning they all passed successfully, they will
    push the code to a **version control system (VCS)** such as Git.

    3. An automation server will now start building the software that was changed.
    Once the build process is complete, automated tests will be run against the build.
    These will not only be unit tests but also integration tests.

    4. If all these tests are successful as well, code changes made by the developer
    on the feature branch will be integrated into the main branch.

