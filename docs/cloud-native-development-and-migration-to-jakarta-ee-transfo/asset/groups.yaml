  - "[PAGE 103]\n\nThe next step is to create a container using a Docker image of\
    \ Payara that we can use to deploy the .war file too:\n\n```\n@Testcontainers\n\
    public class IntegrationTests {\n\n    static MountableFile warFile = MountableFile.forHostPath(\n\
    \    Paths.get(\"target/cargo-tracker.war\").toAbsolutePath(), 0777);\n    @Container\n\
    \    static GenericContainer CargoContainer =\n    new GenericContainer(\"payara/server-full:6.2023.2-jdk17\"\
    )\n    .withCopyFileToContainer(warFile,\n    \"/opt/payara/deployments/cargo-tracker.war\"\
    )\n    .withExposedPorts(8080)\n    .waitingFor(Wait.forHttp(\"/cargo-tracker\"\
    ));\n\n}\n```\n\nThis GenericContainer class adds a lot of code. So, let's break\
    \ down step by step what happens. The GenericContainer class is marked with the\
    \ @Container annotation this makes JUnit responsible for the lifetime management\
    \ of the container. Behind the scenes, JUnit will use Testcontainers to do this.\
    \ JUnit will instruct the Testcontainers dependency on a per test case basis on\
    \ what it needs to do.\n\nThe GenericContainer class is made static because we\
    \ want to use the same container instance for every test. If we did not use a\
    \ static class, a new container would be started for every test and the old one\
    \ would be stopped. This could be handy for certain tests but also takes some\
    \ time. It is better to reuse containers if you want to speed the tests up.\n\n\
    Creating the actual instance is the interesting bit of the code. When you look\
    \ at the following example, you can see that four things happen:\n\n```\nnew GenericContainer(\"\
    payara/server-full:6.2023.2-jdk17\")\n.withCopyFileToContainer(warFile,\n    \"\
    /opt/payara/deployments/cargo-tracker.war\")\n.withExposedPorts(8080)\n.waitingFor(Wait.forHttp(\"\
    /cargo-tracker\"));\n```\n\nOn the first line, we tell Testcontainers on what\
    \ image we want the container to be based. When we have a container, we want to\
    \ copy the .war file to the container so that it can be deployed. We don't have\
    \ to call a deploy commando because Payara will deploy anything that is inside\
    \ the /opt/payara/deployments/ directory of the container. On line 3, we specify\
    \ the port we want to have exposed—in this case, 8080. This is the default port\
    \ and makes it possible for us to call the container from the outside."
  - "[PAGE 104]\n\nThe last part of the code is very important. It tells us when the\
    \ container is ready for use. If we had not included this line, it would have\
    \ been impossible to tell if the container was ready. This could cause errors\
    \ when a test runs too early and cannot reach the Cargo Tracker application, making\
    \ the test fail. To prevent tests from running too early, we can wait based on\
    \ a condition. In the case of the Cargo Tracker application, we want to wait till\
    \ the Payara server is running and the Cargo Tracker application has been deployed.\
    \ To test if the Payara server is running, we can make an http request to the\
    \ Start page of the Cargo Tracker application. If this request is successful,\
    \ we know that the application is up and running and ready for your integration\
    \ tests.\n\nTo check if creating the container and deploying the Cargo Tracker\
    \ application all work you can add the following test to the class:\n\n```\n@Test\n\
    public void isDeployed() {\n    Assertions.assertTrue(CargoContainer.isRunning());\n\
