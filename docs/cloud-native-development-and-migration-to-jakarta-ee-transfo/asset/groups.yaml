    \ available within MicroProfile Fault Tolerance that can help make your service\
    \ more robust:\n\n- `@Asynchronous`\n- `@Retry`\n- `@Timeout`\n- `@Bulkhead`\n\
    - `@CircuitBreaker`\n- `@Fallback`\n\nIt is good to know that these annotations\
    \ can be added to both CDI beans and public methods within those beans. Under\
    \ the hood, they are implemented via interceptors.\n\n### @Asynchronous\n\n@Asynchronous\
    \ adds, well, asynchronous behavior to the method it annotates. It wraps them\
    \ into a method that returns `CompletionStage` on which the other fault tolerance\
    \ annotation can be applied.\n\n@Asynchronous allows your code to run concurrently.\
    \ Let's have a look at an example:\n\n```java\n@Inject\n// is annotated with @Asynchronous\n\
    private CustomerDetailsService customerDetails;\n\n@Inject\n// is annotated with\
    \ @Asynchronous\nprivate CustomerSalesHistoryService customerSalesHistory;\n\n\
    public CompletionStage<Customer> retrieveCustomerAsynchronously() {\n    CompletionStage<CustomerDetails>\
    \ result1 = customerDetails.getDetails(customerNo);\n    CompletionStage<CustomerHistory>\
    \ result2 = customerSalesHistory.getHistory(customerNo);\n\n    ...\n}\n```\n\n\
    ```java\n@RequestScoped\npublic class CustomerDetailsService {\n\n    @Retry\n\
    \    @Asynchronous\n    public CompletionStage<CustomerDetails> getDetails(String\
    \ customerNo) {\n        var details = retrieveDetails(customerNo);\n        return\
    \ CompletableFuture.completedFuture(details);\n    }\n}\n```\n\nWe define `CompletionStage`\
    \ for retrieving customer information. It consists of two steps – retrieving generic\
    \ customer information and retrieving the sales history of the customer. This\
    \ information is then combined into one object, `CustomerDetails`, that is returned.\n\
    \nIn the preceding example, `getDetails` from `CustomerDetailsService` is annotated\
    \ with `@Retry`. This implies that when the method invocation fails, it is retried.\n\
    \nAsynchronous behavior is achieved by MicroProfile by intervening when the method\
    \ is called. It intercepts the method call and schedules it to be executed later,\
    \ probably on a different thread. It then returns `Future` or `CompletionStage`.\
    \ But this is not the one that is returned from the method because it has not\
    \ been executed yet. Sometime later, the method is executed, and it returns its\
    \ result.\n\nIf `Future` is returned, the originally returned `Future` will be\
    \ updated with this result. If it is a `CompletionStage`, Fault Tolerance will\
    \ wait for this `CompletionStage` to complete before it flags the originally returned\
    \ `CompletionStage` as completed.\n\nWhile `@Asynchronous` allows a method that\
    \ returns `Future` to run asynchronously, it can only apply fault tolerance features\
    \ to methods that return `CompletionStage`.\n\n### @Retry\n\nThis annotation allows\
    \ you to gracefully handle temporary network glitches.\n\nThe `@Retry` annotation\
    \ can be applied to a class or individual method of a bean to indicate that if\
    \ the invocation of the method fails, it should be tried again. A maximum number\
    \ of retries can be specified as well as a maximum duration to retry for.\n\n\
    The behavior is simple – if a method returns normally, nothing happens. If it\
    \ throws an exception, the method will be invoked again if the exception can be\
    \ cast to one of the exceptions mentioned in the `retryOn` parameter. On the other\
    \ hand, if the exception can be cast to one mentioned in the `abortOn` parameter,\
    \ no retry will be executed and the method will throw the exception to the caller.\n\
    \nHere's an example of the typical usage of `@Retry`:\n\n```java\n@Retry(maxRetries\
    \ = 5, maxDuration = 1000)\npublic List<Project> findAll()\n```\n\n### @Timeout\n\
    \n@Timeout prevents us from having to wait on the execution of a method forever.\
    \ The value and the time unit can be specified. If the timeout occurs, a `TimeoutException`\
    \ error is thrown. `@Timeout` can be combined with other annotations mentioned\
    \ here.\n\nHere's an example of the typical usage of `@Timeout`:\n\n```java\n\
    @Timeout(500)\npublic List<Project> findAll()\n```\n\n### @Bulkhead\n\n@Bulkhead\
    \ is used to prevent one fault in the system from cascading to other parts of\
    \ the system and eventually taking down the entire application. Its name comes\
    \ from the shipping industry, where the hulls of tankers are made of separate\
    \ compartments. If the hull is breached, the compartments are closed, and only\
    \ the affected compartments are flooded, not the complete hull, thus preventing\
    \ the tankers from sinking.\n\nThere are two possible flavors – the semaphore\
    \ approach and the thread pool isolation approach.\n\nIn the semaphore approach,\
    \ we specify the maximum number of concurrent invocations of a method. Here's\
    \ an example:\n\n```java\n@Bulkhead(5)\npublic List<Project> findAll() {\n```\n\
    \nThis says that there may only be five concurrent invocations of the `findAll`\
    \ method. If a sixth invocation arrives, it will fail immediately with a `BulkheadException`\
    \ error.\n\nIn the thread pool approach, the annotation is the same, but it is\
    \ used with the `@Asynchronous` annotation, like this:\n\n```java\n@Bulkhead(5)\n\
    @Asynchronous\npublic Future<List<Project>> findAll()\n```\n\nThis implies that\
    \ only five threads from the thread pool are allowed to run this method concurrently.\
    \ The next requests must wait in a waiting queue. When the waiting queue is full,\
    \ a `BulkheadException` error is thrown.\n\nBy working with these limits, the\
    \ complete thread pool can't be exhausted. Otherwise, at some point, all threads\
    \ would likely be executing this slow-performing method and there would be no\
    \ more threads available to service the normally functioning methods.\n\nThe number\
    \ of threads and the size of the waiting queue can be configured.\n\n### @CircuitBreaker\n\
    \n`@CircuitBreaker` allows for a fail-fast scenario. If a certain component is\
    \ not working properly, the circuit breaker will open and no more traffic will\
    \ be sent to that component. A circuit breaker can be in one of three possible\
    \ states:\n\n- **Closed:** In this situation, requests are sent to the component.\n\
    - **Open:** In this situation, any request will immediately lead to a `CircuitBreakerOpenException`\
