  - "[PAGE 77]\n\nCargo Tracker offers the functionality to change a destination.\
    \ This will be done from the `changeDestination` screen. The `.xhtml` file is\
    \ backed by a `@Named` backing bean called `ChangeDestination`. It offers users\
    \ a dropdown to select the name of the new location. This dropdown is backed by\
    \ a list of locations called `potentialDestinations`. This list is loaded during\
    \ the bean’s initialization. It retrieves the locations via `listShippingLocations`\
    \ of `BookingServiceFacade`. This method does the actual loading by querying the\
    \ database.\n\nPhew – that was quite a trip! It has shown us how quickly things\
    \ can become complicated, especially with an application such as Cargo Tracker,\
    \ which was set up with **domain-driven design (DDD)** in mind and where there\
    \ is a clear distinction between the different architectural layers of the application.\n\
    \nAnyway, if for some reason (yes, network, we are looking at you!) the required\
    \ values cannot be retrieved, it would be nice to provide a default response.\
    \ Let’s be honest – an empty list with locations is still better than reporting\
    \ some strange error to the user.\n\nWe will annotate `listShippingLocations`\
    \ with a default response via `@Fallback`.\n\nHave a look at the following code:\n\
    \n```\n```java\n@Override\n@Fallback(fallbackMethod = \"shippingLocationsFallback\"\
    )\npublic List<org.eclipse.cargotracker.interfaces.booking.facade.dto.\nLocation>\
    \ listShippingLocations() {\n```\n```\n\nNote that any situation that makes `listShippingLocation`\
    \ throw an exception will trigger the fallback method. You can configure this\
    \ behavior with the `applyOn` and `skipOn` parameters.\n\nNext, we need to provide\
    \ an implementation for the method that is specified in the `fallbackMethod` parameter.\n\
    \nIt will look like this:\n\n```\n```java\nprivate List<org.eclipse.cargotracker.interfaces.booking.facade.dto.\n\
    Location> listShippingLocationsFallback() {\n    return List.of();\n}\n```\n```\n\
    \nNote that the fallback method can be private, and in most situations, it should\
    \ be private to prevent any other class from having unwanted access to this method.\n\
    \nWe simply return an empty list here because we have no reasonable alternative\
    \ values.\n\n# Adding the second cloud-native feature – monitoring\n\nSo, we have\
    \ made our application more robust than it was by adding some resilience features.\
    \ Next, we will go a step further and add monitoring functionality to our application."
