    \ = new RoutingHelper();\n\n    // when\n    boolean goesToNetherlands = routingHelper.goesToNetherlands(routeSpecification);\n\
    \n    // then\n    Assertions.assertTrue(goesToNetherlands);\n}\n```\n\n在这里，我们在\
    \ given 部分创建了两个位置、一个路由规范和一个路由助手，并在单元测试的剩余部分中使用它们。\n\n当你将此代码添加到 Cargo Tracker 项目中时，你的第一个单元测试就完成了。现在你需要做的就是运行单元测试。\n\
    \n## 如何创建集成测试\n\n在本节中，我们将向你展示如何创建集成测试。我们今天构建的应用不再是孤立的。相反，我们在日常生活中开发的应用对内部和/或外部系统都有很多依赖。这些依赖都有各自的版本、接口等，当我们只替换应用的一小部分甚至很大一部分时，这些都需要继续正常工作。重要的是要知道，例如在升级软件依赖、服务器或操作系统后，你的应用是否仍然正常工作。\n\
    \n在下一节中，我们将带你了解集成测试是什么以及如何使用它们来测试你的应用。\n\n### 什么是集成测试？\n\n要验证你的系统是否仍然正常工作，你需要测试！使用单元测试，我们只测试一小段代码，而不是包、模块，甚至整个应用。它们并不是为此而设计的。要验证更大的部分或整个应用是否正常工作，你需要集成测试。\n\
    \n集成测试顾名思义，是关于测试你的应用与其他应用的集成，以查看被测试的应用在与其他应用交互时是否按预期行为。你也可以用它们来测试应用内部模块之间的集成，因为理想情况下，你希望在真实运行的应用上运行集成测试。在下一节中，我们将向你展示如何针对真实运行的\
    \ Cargo Tracker 应用运行测试。为此，我们将使用 Testcontainers。\n\n### 什么是 Testcontainers？\n\n\
    Testcontainers 是由 AtomicJar 开发的一款软件。它是一个开源框架，为为测试目的启动和拆除 Docker 容器提供抽象。它为你提供了一个简单且轻量级的接口来管理你的容器。还有一个库可以让与\
    \ JUnit 5 的集成变得非常简单。使用 Testcontainers，你可以做到以下几点：\n\n- 更轻松地更真实地测试我们的应用。\n- 测试你的系统如何与真实依赖集成，而不必使用模拟或存根。例如，你可以启动一个真实的数据库。\n\
    - 确保你的测试环境可移植。每个用户都会启动相同的 Docker 容器，使得每个人都很容易开始使用和扩展集成测试。\n- 防止开发后期出现错误。你现在可以在部署到开发、测试或验收环境之前测试集成。\n\
    \n### 设置 Testcontainers\n\n要开始使用 Testcontainers，你需要设置一些东西。你需要一个有效的 Docker 环境。如果尚未设置，请查看第\
    \ 6 章，了解如何在你的机器上设置 Docker。要将 Testcontainers 添加到你的项目中，你需要添加三个依赖项。\n\n我们需要以下依赖项来运行集成测试：\n\
    \n- JUnit 5\n- Testcontainers\n- Testcontainers JUnit 集成\n\n我们需要 JUnit 5 依赖项来运行你要创建的测试。Testcontainers\
    \ 依赖项是与 Docker 实例交互的简便方法，而 Testcontainers JUnit 集成用于使前面提到的两个依赖项协同工作。添加这些依赖项非常简单。你只需要在项目的\
    \ pom.xml 文件中添加这些依赖项，如下所示：\n\n```xml\n<dependency>\n  <groupId>org.junit.jupiter</groupId>\n\
    \  <artifactId>junit-jupiter</artifactId>\n  <version>5.9.3</version>\n  <scope>test</scope>\n\
    </dependency>\n<dependency>\n  <groupId>org.testcontainers</groupId>\n  <artifactId>testcontainers</artifactId>\n\
    \  <version>1.18.3</version>\n  <scope>test</scope>\n</dependency>\n<dependency>\n\
    \  <groupId>org.testcontainers</groupId>\n  <artifactId>junit-jupiter</artifactId>\n\
    \  <version>1.18.3</version>\n  <scope>test</scope>\n</dependency>\n```\n\n添加这些依赖项后，你就可以开始使用\
    \ Testcontainers 创建集成测试了。\n\n"
