    ## Moving from Java EE to Jakarta EE


    In the previous chapter, you got to know the workings and technical details of
    the Cargo Tracker application. You should feel quite familiar now with the functionality
    of the application and have a basic understanding of the underlying technologies.


    In this chapter, we''re going to cover the following main topics:


    - Migrating namespaces

    - Migrating dependencies

    - Upgrading your application server


    Upgrading to Jakarta EE 9 is the first step to making the existing application
    work with the Jakarta EE specifications. We deliberately chose this method because
    we learned from experience that this is the easier approach. Once we are completely
    in the Jakarta EE ecosystem, we can start upgrading to new functionality delivered
    in Jakarta EE 10. This will be covered in the next chapter.


    ### Technical requirements


    You will need some tooling to migrate the namespaces. Some of these tools are
    operating system-dependent. You should choose the method that suits your specific
    situation best. There will be more than one option available for each of the major
    operating systems: Linux, Windows, and macOS.


    Some of the solutions provided here will require the presence of additional software:
    some open source, and some that require a paid license.


    You will also need an editor or integrated development environment (IDE) of some
    kind to change some source code. We will leave it up to you to select your tool
    of choice.


    ### It’s all about namespaces


    When Oracle transferred Java EE to the Eclipse Foundation, no one could have foreseen
    what was to happen next. The Eclipse Foundation and its many volunteers started
    to work on updating the code and documentation to reflect the change from Oracle
    to the Eclipse Foundation. The negotiation took months in an attempt to agree
    upon the evolution of the `javax` package namespace in the Jakarta EE specifications.
    Unfortunately, due to insurmountable copyright issues, this undertaking failed.
    As a consequence, the `javax` namespace may only be used “as-is” with the Jakarta
    component specification, meaning that any specification that will evolve over
    time will need to change its namespace from the Java EE specification to a Jakarta
    EE specification. Also, the acronyms needed to be changed; for example, **Enterprise
    JavaBeans (EJB)** became Jakarta Enterprise Beans.


    Version 8 was the last version of the Java EE specification. Jakarta EE version
    8 is completely the same but built from the source code at Eclipse.


    Jakarta EE 9 is functionally equal to Jakarta EE 8, but the namespaces have now
    been renamed from `javax` to `jakarta`.


    The following is an overview of all the changed namespaces with their original
    acronyms and their new namespace and acronyms.


    | Java EE namespace | Jakarta EE namespace |

    | --- | --- |

    | `javax.activation` | `jakarta.activation` |

    | `javax.annotation` | `jakarta.annotation` |

    | `javax.batch` | `jakarta.batch` |

    | `javax.cache` | `jakarta.cache` |

    | `javax.decorator` | `jakarta.decorator` |

    | `javax.ejb` | `jakarta.ejb` |

    | `javax.el` | `jakarta.el` |

    | `javax.enterprise` | `jakarta.enterprise` |

    | `javax.inject` | `jakarta.inject` |

    | `javax.interceptor` | `jakarta.interceptor` |

    | `javax.jms` | `jakarta.jms` |

    | `javax.json` | `jakarta.json` |

    | `javax.jws` | `jakarta.jws` |

    | `javax.management` | `jakarta.management` |

    | `javax.persistence` | `jakarta.persistence` |

    | `javax.resource` | `jakarta.resource` |

    | `javax.security` | `jakarta.security` |

    | `javax.servlet` | `jakarta.servlet` |

    | `javax.transaction` | `jakarta.transaction` |

    | `javax.validation` | `jakarta.validation` |

    | `javax.websocket` | `jakarta.websocket` |

    | `javax.ws.rs` | `jakarta.ws.rs` |

    | `javax.xml` | `jakarta.xml` |


    *Table 3.1 – Namespace changes*


    ### Migrating strategies


    Out of all of this, the most painful part from an application developer’s point
    of view is that the namespaces have changed. This means that migrating to Jakarta
    involves refactoring all the Java EE import statements in your code base. To a
    lesser degree, changes need to be made to the POM files of your project as well.


    In this section, we will look at three approaches to migrating your projects.
    We will do so using the following:


    - An open source multiplatform editor

    - The sed command line tool

    - A specialized plugin for your IDE


