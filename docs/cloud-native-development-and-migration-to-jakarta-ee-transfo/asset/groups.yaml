  - "[PAGE 88]\n\nWe will mount this path inside the container later. Inside the data\
    \ sources directory, create a file named `automatic.yml`. You will use this file\
    \ to store the data source configuration. The complete path will be `grafana/provisioning/datasources/automatic.yml`.\
    \ Make sure you put the following configuration inside the YAML file. This configuration\
    \ tells Grafana the following things:\n\n+   - The name of the data source\n+\
    \   - The access type\n+   - The URL where it can find the resource\n+   - If\
    \ this is the default data source to use:\n\n```\ndatasources:\n  - name: Prometheus\n\
    \    access: proxy\n    type: prometheus\n    url: http://prometheus:9090\n  \
    \  isDefault: true\n```\n\nWith the data source set up, we can start importing\
    \ dashboards into Grafana.\n\n# Setting up the dashboard so that it loads automatically\n\
