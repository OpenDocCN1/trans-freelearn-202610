    \n代码的最后一部分非常重要。它告诉我们容器何时可以开始使用。如果没有包含这一行，我们将无法判断容器是否已经就绪。这可能会导致测试运行过早，无法访问 Cargo\
    \ Tracker 应用程序，从而使测试失败。为了防止测试过早运行，我们可以根据某个条件进行等待。对于 Cargo Tracker 应用程序，我们希望等到\
    \ Payara 服务器运行起来，并且 Cargo Tracker 应用程序已经部署完成。要测试 Payara 服务器是否在运行，我们可以向 Cargo Tracker\
    \ 应用程序的起始页面发起一个 HTTP 请求。如果这个请求成功，我们就知道应用程序已启动并运行，可以准备进行集成测试了。\n\n要检查创建容器和部署 Cargo\
    \ Tracker 应用程序是否都能正常工作，你可以在类中添加以下测试：\n\n```java\n@Test\npublic void isDeployed()\
    \ {\n    Assertions.assertTrue(CargoContainer.isRunning());\n}\n```\n\n这个测试会检查容器是否在运行，如果容器在运行，则测试通过。这是一个很好的测试，但它不能告诉你任何关于\
    \ Cargo Tracker 应用程序运行情况的有用信息。因此，让我们创建一个真正会测试 Cargo Tracker 应用程序的集成测试。\n\n## 创建集成测试\n\
    \n在上一节中，我们设置了运行 Cargo Tracker 应用程序的 Docker 容器。这个容器由 JUnit 使用 Testcontainers 进行管理。在上一节中，你只设置了容器，并没有编写真正的集成测试。在本节中，你将构建一个集成测试。我们将向测试容器发起一个\
    \ HTTP 请求。\n\n要向容器发起请求，我们将使用 rest-assured 库。rest-assured 是一个提供工具让我们在测试用例中测试和验证\
    \ REST 服务的库。要将 rest-assured 依赖添加到项目中，你需要在 Cargo Tracker 应用程序的 pom.xml 文件中加入以下代码片段：\n\
    \n```xml\n<dependency>\n    <groupId>io.rest-assured</groupId>\n    <artifactId>rest-assured</artifactId>\n\
    \    <version>5.3.1</version>\n    <scope>test</scope>\n</dependency>\n```\n\n\
    加入这个依赖后，我们就可以从测试中发起 REST 调用了。下一步是构建测试用例。让我们从一个空用例开始，如下所示：\n\n```java\n@Test\n\
    public void verify() {\n}\n```\n\n这个测试用例只是一个用 `@Test` 注解标记的方法，该注解告诉 JUnit 5 这个方法包含一个它可以运行的测试。现在，让我们使用\
    \ `rest-assured` 向测试容器发起调用。将以下代码添加到测试方法中：\n\n```java\nList<LinkedHashMap<String,\
    \ Object>> cargoResult = given().get(String.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
    , CargoContainer.getMappedPort(8080)))\n    .then()\n    .assertThat().statusCode(200)\n\
    \    .and()\n    .contentType(ContentType.JSON)\n    .extract()\n    .as(List.class);\n\
    ```\n\n这个方法做了很多事情。让我们逐行看看它做了什么：\n\n-   示例以对 `cargoResult` 的赋值开始。这将是请求正文的引用，我们稍后想用它做进一步测试。\n\
    -   赋值之后，你会看到为 Cargo Tracker 应用程序的 `cargo` 端点创建了一个 GET 请求。\n-   仔细看，你会发现我们必须使用\
    \ `String.format` 创建一个 URL，以调用运行在容器内的 Cargo Tracker 应用程序。这是因为我们不知道哪个外部端口被映射到了\
    \ Cargo Tracker 应用程序所监听的内部端口 `8080`。\n\n要找出哪个端口被映射到内部端口 8080，我们必须从上一节中创建的 CargoContainer\
    \ 实例获取该端口，如下所示：\n\n```java\nString.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
    ,\n    CargoContainer.getMappedPort(8080))\n```\n\n这与上一个示例中的 `String.format` 用法相同。如你所见，我们通过调用\
    \ `CargoContainer.getMappedPort(8080)` 方法来获取正确的端口。该方法返回映射到 8080 的端口号。我们必须这样做，因为\
    \ Testcontainers 会自动将内部端口 8080 映射到宿主机的一个可用端口。经过 `String.format` 之后，我们就得到了一个可用的\
    \ URL，可以用来调用测试容器。\n\n发起调用之后，我们想验证结果是否符合预期。为此，我们可以使用 `.then()` 和 `.assertThat()`，如下例所示：\n\
    \n```java\n.then()\n    .assertThat().statusCode(200)\n    .and()\n    .contentType(ContentType.JSON)\n\
    ```\n\n在上面的代码片段中，我们做了两个断言，如下所示：\n\n-   我们做的第一个断言是检查响应状态码是否为 200，这意味着请求已成功处理。\n\
    -   我们做的第二个断言是检查响应内容是否为 JSON。\n\n接下来，我们要获取 Cargo Tracker 应用程序返回的实际响应，即它生成的 JSON。为此，我们可以使用\
    \ extract() 方法，它将使用 Jackson 将 JSON 转换为对象。在本例中，我们只需要一个对象列表。\n\n下面的示例展示了如何从 rest-assured\
    \ 中提取 JSON 响应：\n\n```java\n.extract()\n.as(List.class);\n```\n\n我们可以使用 JSON 响应进行进一步测试。我们可以用它来断言大小，并验证内容是否符合预期。下面的示例演示了具体做法：\n\
    \n```java\nAssertions.assertEquals(4, cargoResult.size());\n\ncargoResult.forEach(cargo\
    \ -> {\n    Assertions.assertEquals(cargo.size(), 7);\n});\n```\n\n完整的集成测试将如下所示：\n\
    \n```java\n@Test\npublic void verify() {\n\n    List<LinkedHashMap<String, Object>>\
    \ cargoResult = given().get(String.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
    , CargoContainer.getMappedPort(8080)))\n        .then()\n        .assertThat().statusCode(200)\n\
    \        .and()\n        .contentType(ContentType.JSON)\n        .extract()\n\
    \        .as(List.class);\n\n    Assertions.assertEquals(4, cargoResult.size());\n\
    \n    cargoResult.forEach(cargo -> {\n        Assertions.assertEquals(cargo.size(),\
    \ 7);\n    });\n}\n```\n"
