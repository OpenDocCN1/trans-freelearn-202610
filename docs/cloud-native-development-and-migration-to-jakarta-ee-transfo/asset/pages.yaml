- pgno: 136
  md: 'But that is not all. Many of us use the cloud as a backup these days. It is
    very common to store photos on your phone not only on the device itself but also
    keep a copy for safekeeping in some kind of cloud storage. iCloud from Apple is
    a good example of this, but there are also other cloud storage providers such
    as Google Cloud and Dropbox.


    Nowadays, there are many cloud providers, with **Amazon Web Services (AWS)**,
    Microsoft Azure, and Google Cloud being the predominant ones. Perhaps less known
    in Western countries, Alibaba Cloud is the fourth largest cloud provider in the
    world, and its share in the cloud market is not that far off Google Cloud’s. So,
    we can safely say that the cloud is everywhere these days.


    *Cloud native* means that we are adapting our applications to the new possibilities
    offered by the cloud. We need to keep in mind, though, that the cloud is driven
    by a different set of architectural constraints. In the following sections, we
    will explain these constraints in a simple fashion.


    # Cloud-native principles


    I am sure you have heard the words *cloud native* many times, even before picking
    up this book. Maybe hearing those words was what made you choose to read this
    book. Let us now carefully examine the principles of cloud native.


    Cloud native is driven by four different features, which are as follows:


    +   - Microservices

    +   - Containers and orchestration

    +   - DevOps

    +   - **Continuous integration and continuous delivery (CI/CD)**


    We will discuss each of these features in more detail in this chapter, but you
    have to realize we can only scratch the surface here. Each of them deserves a
    book in its own right, and in fact, you can find books from Packt Publishing on
    these subjects.


    # Microservices


    While it is not a requirement to run microservices in the cloud, most cloud-native
    applications are in fact microservices. We have already come across the term *microservices*
    in the book a few times, but let’s look at a definition first.


    Microservices is an architectural style that structures an application as a collection
    of services that are as follows:


    +   - Independently deployable

    +   - Loosely coupled'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   - Organized around business capabilities

    +   - Owned by a dedicated team


    Independent deployability is of crucial importance. You should be able to deploy
    new or updated services into production without being concerned about disrupting
    other services or having to remember to redeploy these other services. This will
    be described in more detail in the *Introducing the 12-factor app* section of
    this chapter.


    Loose coupling in software development is always a good idea, but even more so
    in microservices. It allows for services to change over time without these changes
    affecting other services. There are many things to consider in order to achieve
    loose coupling, but the most important ones are using distinct database schemas
    for each of your services, communicating via APIs (remember the quote from Jeff
    Bezos of Amazon on this: “*All service interfaces, without exception, must be
    designed from the ground up to be externalizable*”), and providing asynchronous
    communication between your services.


    That these services should be organized around a business domain goes without
    saying: their sole reason for existence is that they in some way support the business
    process of the company that is utilizing them.


    Finally, they should be owned by a small team. The reason for this is that these
    services only facilitate a small part of the complete business process. As such,
    the amount of domain logic that is required is also limited. Compare this to traditional
    application development where every developer had to potentially work on the entire
    application. This would require knowledge of the complete business domain.


    Onboarding new members into your team becomes much easier and quicker with microservices.
    Also, changes to your microservices can be implemented much quicker as each developer
    knows all the details and the effect that these changes will have.


    # Containers and orchestration


    In the chapters on Docker (*Chapter 6*) and Kubernetes (*Chapter 7*), we have
    already explained the advantages of using these technologies. In fact, you might
    argue that containerization is what made the cloud-native movement possible in
    the first place.


    Creating artifacts, your application binaries, in an unmodifiable container that
    is pushed through the different stages of a pipeline (development, staging, production)
    has enormous advantages.


    In systems consisting of dozens, hundreds, or even thousands of containers, some
    kind of container orchestration tool is a necessity. It also means that part of
    your operations will be automated, relieving the operations department of trivial
    work and allowing them to focus on more important and interesting tasks at hand.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# DevOps


    **DevOps** is a combination of **development** and **operations** into one seamless
    team. In traditional application development, the development department would
    create or update an application. This application would be unit tested and undergo
    acceptance testing. Once acceptance testing was done, the application would be
    handed over to the operations department.


    Operations would execute the required operations to bring the application into
    the production environment, such as running database scripts or creating new application
    bindings.


    Once running in production, if any bugs were discovered, the process of analyzing
    and potentially fixing them would also be the responsibility of the operations
    department.


    In short, both teams worked in highly separated silos.


    You will probably see that this is very inefficient. The developers, with all
    their knowledge of the intrinsics of the application, might actually be better
    suited to help analyze bugs.


    Combining both departments into one seems like a logical move, where everyone
    in the team is responsible for the complete life cycle of the application, from
    development to running in production. This shared responsibility will inevitably
    create a stronger feeling of “owning a service” and will lead to more careful
    considerations when applying changes.


    One of the key points of DevOps is that anything that can be automated should
    be automated, or as the adage goes: “Automate everything!”.


    # CI/CD


    CI/CD is a process where changes to a code base are automatically integrated into
    this code base and are rolled out to production.


    CI works like this:


    +   1. A developer works on a so-called feature branch to make changes to the
    system. A feature branch is essentially a copy of the original software (which
    is on the main branch).

    +   2. When they are finished working on the task, they will run unit tests locally.
    Once these tests are all “green,” meaning they all passed successfully, they will
    push the code to a **version control system (VCS)** such as Git.

    +   3. An automation server will now start building the software that was changed.
    Once the build process is complete, automated tests will be run against the build.
    These will not only be unit tests but also integration tests.

    +   4. If all these tests are successful as well, code changes made by the developer
    on the feature branch will be integrated into the main branch.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   5. When a build fails, due to failing tests or because the **source code
    management (SCM)** system cannot integrate changes into the original application,
    the process will halt, and the developer will have to take action.


    This process has several advantages. One is that the newly developed software
    on the feature branch is tested at an early stage to be compatible with the original
    software in the main branch. Any discrepancies will be discovered early, which
    means that fixing them should not take too long and will not be too risky.


    Moreover, new changes will become available to other developers at an early stage,
    meaning that they will have fewer issues incorporating them into their changes.
    CI expands on CD. This is a process where, after the successful build in CI, the
    software will be automatically deployed to a staging environment or even the production
    environment.


    Modern CI/CD pipelines have this process completely automated, some even so much
    that no human intervention is required to bring software changes into production.


    This is achieved by highly automating all test efforts. These tests have to be
    so exhausting in their nature that the application can be deployed to production
    with a high level of certainty that it will function as per specification and
    is not likely to contain bugs.


    From all of this, it might be clear that the whole CI/CD process is very automated.
    There are numerous CI and CI/CD servers out there.


    Note that CI/CD can also be used outside of cloud-native development. In fact,
    it is very common these days for CI servers to be used in regular software development.
    What is mostly lacking is the CD part, as it requires a high level of automated
    testing. Next to that, often companies are not ready yet to accept that software
    is released into production automatically.


    This might be the result of organizational procedures (in government organizations,
    it is very often still required that some **quality assurance (QA)** department
    has to give the final “go”). In other situations, companies can have a mental
    “blockage” of bringing software to production instantly: they still want to have
    a human eye and mind check out changes before they get released into production.


    # # Introducing the 12-factor app


    *The 12-factor app* is a description of how cloud-native applications should preferably
    be constructed. Initially proposed by the guys from Heroku, it has since become
    the de facto standard for cloud-native applications or **software-as-a-service
    (SaaS)**.


    The most important aspect of these rules is that they can be applied in any programming
    language. In the following sections, we will walk through each of these 12 factors
    and highlight what makes them important:


    +   - Code base

    +   - Dependencies'
  merge: -1
  img_proc: true
