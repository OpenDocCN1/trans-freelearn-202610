  md: "```\n@Operation(summary = \"Get user by user name\")\n@APIResponse(description\
    \ = \"The user\",\n    content = @Content(mediaType = \"application/json\",\n\
    \        schema = @Schema(implementation =\nUser.class))),\n@APIResponse(responseCode\
    \ = \"400\", description = \"User not found\")\npublic Response getUserByName(\n\
    \    @Parameter(description = \"The name that needs to be fetched. Use user1 for\
    \ testing. \", required = true) @PathParam(\"username\")\nString username)\n{...}\n\
    ```\n\n# RestClient\n\nThe MicroProfile RestClient supplies a type-safe approach\
    \ for invoking a RESTful service over HTTP. This can be achieved by specifying\
    \ an interface that holds the methods of the remote API you want to invoke, annotated\
    \ with RESTful annotations.\n\nAgain, from the official documentation, here is\
    \ an example interface:\n\n```\n@Path(\"/movies\")\npublic interface MovieReviewService\
    \ {\n    @GET\n    Set<Movie> getAllMovies();\n```\n\nThis interface is then used\
    \ to create a client in this way:\n\n```\nURI apiUri = new URI(\"http://localhost:9080/movieReviewService\"\
    );\nMovieReviewService reviewSvc = RestClientBuilder.newBuilder()\n    .baseUri(apiUri)\n\
    \    .build(MovieReviewService.class);\nSet<Review> reviews = reviewSvc.getAllMovies();\n\
    ```\n\n# JSON Web Token Authentication\n\nJSON Web Token (JWT) authentication\
    \ is an authentication mechanism that’s used to identify an authenticated user\
    \ and their roles.\n\nIt is generated by the server after successful authentication\
    \ and then sent over HTTP to other services that a system wants to access. Commonly,\
    \ JWT is both encrypted and signed. The receiving system can verify the signer\
    \ and decrypt the JWT.\n\nThis authentication and authorization system is typically\
    \ used in a service-to-service environment where each service passes the JWT along."
