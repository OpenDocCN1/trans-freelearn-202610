- pgno: 29
  md: '# Introducing the Cargo Tracker Application


    In this chapter, we will introduce the Cargo Tracker application, which was built
    using Java EE 7. We will use the Cargo Tracker application throughout this book.
    This is the application we will migrate from Java EE 7 to Jakarta EE 10. Before
    we start migrating the application, it is good to understand the Cargo Tracker
    application. This chapter will provide an overview of the Cargo Tracker application
