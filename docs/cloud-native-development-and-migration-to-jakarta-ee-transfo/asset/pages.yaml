- pgno: 96
  md: "What percentage of test coverage should you strive for? That depends on many\
    \ factors. It should be a percentage that you and your team are comfortable with\
    \ and gives you great confidence that the migrated functionality keeps working.\
    \ This could be either 60%, 90%, or even 100%. The important thing is that it\
    \ should help you move forward in your migration and not hold you back.\n\n# A\
    \ word about TDD\n\nA chapter about testing cannot miss a section about TDD. As\
    \ the name suggests, the test code drives the development of your production code.\
    \ When you use TDD, you start by creating a test case with, for example, JUnit.\
    \ In Java, that would look like this:\n\n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n\
    }\n```\n```\n\nThe last example shows an empty testing method. Here starts the\
    \ TDD adventure. From here on out, you are not supposed to develop any production\
    \ while the test succeeds. This means that if we want to develop a new feature,\
    \ we first need a failing or not compiling test.\n\nThe first step could be to\
    \ create an instance of what you need. This allows you to create a class that\
    \ you need to hold the business logic. It could be something as simple as the\
    \ following:\n\n```\n```java\n@Test\nvoid goesToNetherlands_success(){\n\n   \
    \ RoutingHelper routingHelper = new RoutingHelper();\n}\n```\n```\n\nIf you try\
    \ to run/compile the project, you will get an exception saying something along\
    \ the lines of a class or reference is missing or does not exist. That is completely\
    \ true, and valid because it does not yet exist inside the project. When you are\
    \ doing TDD, you first want a failing test that you can fix. This is part of the\
    \ red-green cycle of TDD. You start with a failing test (red) and make it pass\
    \ (green). To make the test work, all you need to do is create a RoutingHelper\
    \ class and add it as an import to the test class.\n\nHere’s an example of the\
    \ RoutingHelper class that would make the test compile again:\n\n```\n```java\n\
    public class RoutingHelper {\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 97
  md: "When you added the previous class from the example, you have a working (green)\
    \ test. The next step would be to make the test fail (red) again. You could do\
    \ that by adding a method call that you want the `RoutingHelper` class to have.\
    \ The next example shows you how this is done by adding a method call inside the\
    \ testing method:\n\n```\n```java\n@Test\nvoid goesToNetherlands_success() {\n\
    \    RoutingHelper routingHelper = new RoutingHelper();\n    routingHelper.goesToNetherlands();\n\
    \n}\n```\n```\n\nWhen you add the method call, the test fails again because the\
    \ method does not exist yet. Creating this method would be the next step. What\
    \ we just did was go through the red-green cycle of TDD. We started with a failing\
    \ test, fixed it, made the test pass, and made it fail again. This is the basis\
    \ of TDD, and when you develop new features, you want to start with a failing\
    \ test and try to make it pass. This would be the start of a new red-green cycle.\
    \ TDD can be applied to any kind of code or test you are writing; this could be\
    \ a unit test or an integration test. When you use TDD for integration tests,\
    \ really try to keep the test execution of the test to be fast, because you are\
    \ going to execute the test several times.\n\n# How to create unit tests\n\nTesting\
    \ in Java is often done with unit tests. When people talk about test coverage\
    \ or if you have tests for your code, they most often mean unit tests. Unit testing\
    \ is a method to test the smallest unit of code. With Java, the smallest unit\
    \ of code is often a single method. With unit testing, we just test one single\
    \ method at a time. Sounds simple enough, right? Testing a single method is easy\
    \ if it doesn’t depend on another class, package, database, or even a framework\
    \ or entire application. That’s when unit testing often gets difficult and testing\
    \ code becomes a huge mess, and nobody wants to touch it anymore. We want to prevent\
    \ that, so we start at the basics and build our testing strategy up from there,\
    \ starting with a single unit test.\n\n# Tools and libraries required for unit\
    \ testing\n\nThe unit tests that you are going to write in this chapter depend\
    \ on two very popular testing libraries, JUnit and Mockito. For the unit tests\
    \ themselves, we are going to use JUnit, and we’ll use Mockito to mock any dependencies\
    \ the code has. These two libraries are very helpful and are almost essential\
    \ for every project.\n\nJUnit helps you to write the actual unit test. With its\
    \ built-in annotations, it enables you to mark methods and connect them to different\
    \ parts of the testing life cycle. A testing life cycle helps you to prepare object\
    \ instances for your tests. The other essential library is Mockito. Mockito is\
    \ a library that helps you to create mocks of existing classes in a straightforward\
    \ way. As you will see later in the examples, mocks are created so that we don’t\
    \ have to interact with real instances of classes and databases."
  merge: -1
  img_proc: true
- pgno: 98
  md: "# Creating a unit test\n\nIn this section, we will show you how to create a\
    \ unit test. The Cargo Tracker application is intricate, meaning that you will\
    \ need some time to fully understand what is going on inside the code. To speed\
    \ up this process, we are first going to create a method that we can test. This\
    \ way, you don’t have to know any details of the Cargo Tracker application and\
    \ are able to focus on creating the unit test.\n\nThe method we want to use to\
    \ teach you unit testing needs a class to hold it. Create a class named `RoutingHelper`\
    \ inside the `org/eclipse/cargotracker/infrastructure/routing` package. Make sure\
    \ the content of the `RoutingHelper` class looks like this:\n\n```\n```java\n\
    package org.eclipse.cargotracker.infrastructure.routing;\n\npublic class RoutingHelper\
    \ {\n}\n```\n```\n\nWe can’t create unit tests for this because this class does\
    \ not have any methods inside of it. Let us create one now:\n\n```\n```java\n\
    boolean goesToNetherlands(RouteSpecification routeSpecification) {\n    Location\
    \ destination = routeSpecification.getDestination();\n    return \"Netherlands\"\
    .equals(destination.getName());\n}\n```\n```\n\nThis is just a simple method intended\
    \ to teach you the basics of unit testing. The method in the previous example\
    \ does only one thing—it checks if the destination of a `RouteSpecification` instance\
    \ is equal to Netherlands. If the location equals the Netherlands, it returns\
    \ true; if it is not the same, it will return `false`.\n\nLet’s create a test\
    \ class for the `RoutingHelper` class. Every class resides inside a directory\
    \ structure. For the `RoutingHelper` class, this is `src/main/java/org/eclipse/cargotracker/infrastructure/routing/RoutingHelper.java`.\
    \ It is common for tests to reside inside the test package but with the same directory\
    \ structure.\n\nThe next step is to create a test class that will be used to hold\
    \ the unit tests for this class. Create a file named `RoutingHelperTest` inside\
    \ this directory structure: `src/test/java/org/eclipse/cargotracker/infrastructure/routing/RoutingHelperTest.java`.\
    \ Notice the second directory inside both paths. The production code resides inside\
    \ the main package, and the test code lives in the test package. This makes it\
    \ easy to tell them apart, and you won’t accidentally call the testing code from\
    \ your production code.\n\nMake sure the content of the `RoutingHelperTest` class\
    \ looks like the following:\n\n```\n```java\npackage org.eclipse.cargotracker.infrastructure.routing;\n\
    import static org.junit.jupiter.api.Assertions.*;\nclass RoutingHelperTest {\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 99
  md: "With the test class made, we are ready to build the first unit test. Let’s\
    \ start with just an empty method called goesToNetherlands_success. We give the\
    \ test method the same name as the method that it tests and add an underscore\
    \ and the expected behavior. This tells us what the method tests and what the\
    \ expected result is going to be without having to read how the method works.\
    \ The first unit test will look like this:\n\n```\n@Test\nvoid goesToNetherlands_success()\
    \ {\n}\n```\n\nEvery unit test is marked with the @Test annotation. This tells\
    \ JUnit which methods are test methods and which are not. The next step is to\
    \ test your goesToNetherlands method. Inside the test, we will use the given,\
    \ when, then structure. The given part tells the reader what the basis is of the\
    \ test and which instances the test requires. The when part invokes the production\
    \ code. Inside the then part, we verify if what has happened was correct.\n\n\
    For our first unit test, we need to create a RouteSpecification class in the given\
    \ part. In the when part, we call the goesToNetherlands method with the RouteSpecification\
    \ class we created in the given part. In the last part of the test method, we\
    \ are going to verify if what happened was correct.\n\nThe resulting unit test\
    \ will look like the following:\n\n```\n@Test\nvoid goesToNetherlands_success()\
    \ {\n\n    // given\n    Location locationNetherlands = new Location(new UnLocode(\"\
    XXXXX\"), \"Netherlands\");\n    Location locationGermany = new Location(new UnLocode(\"\
    00000\"),\"Germany\");\n    RouteSpecification routeSpecification = new RouteSpecification(locationGermany,\
    \ locationNetherlands, Date.from(Instant.now()));\n\n    RoutingHelper routingHelper\
    \ = new RoutingHelper();\n\n    // when\n    boolean goesToNetherlands = routingHelper.goesToNetherlands(routeSpecification);\n\
    \n    // then\n    Assertions.assertTrue(goesToNetherlands);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Here, we create two locations, a route specification, and a routing helper
    in the given part and use both in the remaining part of the unit test.


    When you add this code to the application tracker project, your first unit test
    is done. All you need to do now is run the unit test.


    # How to create integration tests


    In this section, we are going to show you how to create integration tests. The
    applications we built today are not siloed anymore. Instead, the applications
    we develop in our day-to-day lives have lots of dependencies on internal and or
    even external systems. These dependencies all have their own versions, interfaces,
    and so on that need to keep working when we replace just a small or even a big
    piece of our application. It is important to know if your application still works
    after, for example, upgrading a software dependency, server, or operating system.


    In the next sections, we are going to walk you through what integration tests
    are and how you can use them to test your application.


    # What are integration tests?


    To verify if your system still works, you need tests! With unit tests, we only
    test a small unit of code, not packages, modules, or even entire applications.
    They are not built with that in mind. To verify that bigger parts or entire applications
    work, you need integration tests.


    Integration tests, as the name suggests, are about testing the integration of
    your application with that of others to see if the application you are testing
    behaves as expected when interacting with a different application. You can also
    use them to test how modules inside your application integrate with each other
    because ideally, you want to run your integration tests against a real running
    application. In the next session, we will show you how to run tests against a
    real, running Cargo Tracker application. To achieve this, we will use Testcontainers.


    # What is Testcontainers?


    Testcontainers is a piece of software developed by AtomicJar. It is an open source
    framework that provides an abstraction around spinning up and breaking down Docker
    containers for testing purposes. It gives you an easy and lightweight interface
    through which you can manage your containers. There is also a library that makes
    integration with JUnit 5 very simple. With Testcontainers, you can do the following:


    +   - More easily test our application more realistically.

    +   - Test how your systems integrate with real dependencies instead of having
    to use mocks or stubs. For example, you can spin up a real database.

    +   - Make sure your test environment is portable. Every user will spin up the
    same Docker containers, making it easy for everyone to start using and extending
    the integration tests.'
  merge: -1
  img_proc: true
- pgno: 101
  md: "+   - Prevent bugs from happening later during development. You can now test\
    \ the integration before deploying to a development, test, or acceptance environment.\n\
    \n# Setting up Testcontainers\n\nTo start using Testcontainers, you need to have\
    \ a few things set up. You need a valid Docker environment. Check out Chapter\
    \ 6, on how to set up Docker on your machine if you haven’t already. To add Testcontainers\
    \ to your project, you need to add three dependencies.\n\nWe need the following\
    \ dependencies to run the integration tests:\n\n+   - JUnit 5\n+   - Testcontainers\n\
    +   - Testcontainers JUnit integration\n\nWe need the JUnit 5 dependency to have\
    \ something that can run the test you are going to create. The Testcontainers\
    \ dependency is needed as an easy way to interact with Docker instances, and the\
    \ Testcontainers JUnit integration is used to make the two earlier-mentioned dependencies\
    \ work together. Adding these dependencies is very straightforward. You only need\
    \ to add these dependencies to the pom.xml file of the project, as follows:\n\n\
    ```\n<dependency>\n  <groupId>org.junit.jupiter</groupId>\n  <artifactId>junit-jupiter</artifactId>\n\
    \  <version>5.9.3</version>\n  <scope>test</scope>\n</dependency>\n<dependency>\n\
    \  <groupId>org.testcontainers</groupId>\n  <artifactId>testcontainers</artifactId>\n\
    \  <version>1.18.3</version>\n  <scope>test</scope>\n</dependency>\n<dependency>\n\
    \  <groupId>org.testcontainers</groupId>\n  <artifactId>junit-jupiter</artifactId>\n\
    \  <version>1.18.3</version>\n  <scope>test</scope>\n</dependency>\n```\n\nWith\
    \ these dependencies added, you can start creating integration tests with Testcontainers."
