  md: '# Uploading an image to the registry


    We need to have an image before we can upload it. So, let''s create one before
    we continue with the next steps, as follows:


    +   1. Navigate to the directory of the Cargo Tracker application and run the
    following command:

    +   2. When you run this command, an image will be created of the Cargo Tracker
    application using the Dockerfile created in the previous chapter. The image will
    be tagged with the name cargo-tracker. Doing this makes the image ready for the
    next steps.

    +   3. The next step is to upload the tagged image to the registry. To do this,
    we need two things: a registry and an image. To upload the image, you need to
    first log in to the registry. To do so, open a terminal and run the following
    command:


    ```

    docker build . -t cargo-tracker

    ```


    ```

