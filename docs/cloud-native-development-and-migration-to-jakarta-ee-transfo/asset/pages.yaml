- pgno: 57
  md: "Once completed, the editor will report 308 occurrences changed.\n\nWhile IntelliJ\
    \ Ultimate does a great job at changing the namespaces of the imports, it fails\
    \ to recognize the javax usages inside Strings and XML files. To fix this shortcoming,\
    \ we have to fix some files by hand or by using one of the previous methods.\n\
    \nRejectedRegistrationAttemptsConsumer, MisdirectedCargoConsumer, HandlingEventRegistrationAttemptConsumer,\
    \ DeliveredCargoConsumer, and CargoHandledConsumer all use an annotation that\
    \ uses the name javax inside the property value. This annotation looks as follows:\n\
    \n```\n@ActivationConfigProperty(propertyName = \"destinationType\", propertyValue\
    \ = \"javax.jms.Queue\")\n```\n\nThis activation configuration won't work because\
    \ of javax inside propertyValue. To fix this issue, change the annotation to the\
    \ following example, which uses jakarta:\n\n```\n@ActivationConfigProperty(propertyName\
    \ = \"destinationType\", propertyValue = \"jakarta.jms.Queue\"\n```\n\nWe also\
    \ need to make changes inside web.xml because IntelliJ did not make any changes\
    \ to this file. Inside the web.xml file, the javax name is used for the java.faces\
    \ context parameters. In the top part of the web.xml file, you can see the javax\
    \ namespace being used. This looks as follows:\n\n```\n<context-param>\n    <param-name>javax.faces.PROJECT_STAGE</param-name>\n\
    \    <param-value>Development</param-value>\n</context-param>\n<context-param>\n\
    \    <param-name>javax.faces.CLIENT_WINDOW_MODE</param-name>\n    <param-value>url</param-value>\n\
    </context-param>\n```\n\nThese context parameters also need to be changed to the\
    \ new jakarta namespace. To do this, you have to replace the javax part of the\
    \ classpath with jakarta. The result looks as follows:\n\n```\n<context-param>\n\
    \    <param-name>jakarta.faces.PROJECT_STAGE</param-name>\n    <param-value>Development</param-value>\n\
    </context-param>\n<context-param>\n    <param-name>jakarta.faces.CLIENT_WINDOW_MODE</param-name>\n\
    \    <param-value>url</param-value>\n</context-param>\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: "With these changes made, the `javax` name is replaced with `jakarta` inside\
    \ the entire project. The last thing to do is upgrade the POM file and dependencies\
    \ before you can run the project again.\n\n# Upgrading your pom.xml file\n\nThere\
    \ is still one more change we need to apply to our code base. We need to tell\
    \ it that we are now using the Jakarta EE 9 APIs. This is done by updating the\
    \ dependency in our `pom.xml` file.\n\nOpen the `pom.xml` file and locate the\
    \ dependency section. It should look like this:\n\n```\n```xml\n<dependency>\n\
    \    <groupId>javax</groupId>\n    <artifactId>javaee-api</artifactId>\n    <version>${javaee_api.version}</version>\n\
    \    <scope>provided</scope>\n</dependency>\n```\n```\n\nNow, change it to the\
    \ following:\n\n```\n```xml\n<dependency>\n    <groupId>jakarta.platform</groupId>\n\
    \    <artifactId>jakarta.jakartaee-api</artifactId>\n    <version>9.0.0</version>\n\
    \    <scope>provided</scope>\n</dependency>\n```\n```\n\nYou have now told Maven\
    \ that it should use the new Jakarta EE 9 dependencies.\n\nNow, go ahead and rebuild\
    \ the application by invoking `mvn clean install`.\n\n# Migrating dependencies\n\
    \nWith the migration from **Java EE** to the **Jakarta EE** namespace, we need\
    \ to update three dependencies that the project uses. In this section, we will\
    \ look into how to upgrade the Java version of the project, the **Payara** application\
    \ server, and the **PrimeFaces** dependency.\n\n# Upgrading the project\n\nTo\
    \ change the Java version Maven uses, we need to make two changes in the `pom.xml`\
    \ file. Inside the `pom.xml` file located in the root of the project directory,\
    \ you can find the source and target Maven uses for the cargo tracker application."
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Currently, the project uses Java version 7, and inside the pom.xml file, you
    can find the following two lines that confirm this:


    ```

    <maven.compiler.source>1.7</maven.compiler.source>

    <maven.compiler.target>1.7</maven.compiler.target>

    ```


    We upgraded the cargo tracker application to the latest long-term support (LTS)
    version of Java currently available, which is 17. To upgrade the project, replace
    1.7 with 17 so it looks like the following:


    ```

    <maven.compiler.source>17</maven.compiler.source>

    <maven.compiler.target>17</maven.compiler.target>

    ```


    It''s important that you now also change the JAVA_HOME system variable that you
    set in Chapter 2. Before you continue, download the Java 17 SDK and set it as
    the JAVA_HOME system variable. If you do not do this, the project won''t be able
    to compile.


    Next up is upgrading the Payara application server to the latest version. Upgrading
    Payara takes two steps. We need to upgrade the Cargo plugin to a version that
    supports Payara version 6, and we need to upgrade Payara from 4 to 6.


    To upgrade Cargo, we need to change the version number from 1.8.1 to 1.10.5. To
    do this, change the following line:


    ```

    <cargo.version>1.8.1</cargo.version>

    ```


    The result should look like this:


    ```

    <cargo.version>1.10.5</cargo.version>

    ```


    # Upgrading the Payara application server


    We have changed the version of the cargo plugin used at the bottom of the pom.xml
    file. The next step is to change the Payara container ID and download URI. We
    are moving from Payara 4 to 6; to do this, change the following lines:


    ```

    <cargo.payara.container_id>glassfish4x</cargo.payara.container_id>

    <cargo.payara.download_uri>https://repo1.maven.org/maven2/fish/payara/distributions/payara/6.2023.2/payara-6.2023.2.zip</cargo.payara.download_uri>

    ```


    Change them to look like the following example:


    ```

    <cargo.payara.container_id>glassfish6x</cargo.payara.container_id>

    <cargo.payara.download_uri>https://repo1.maven.org/maven2/fish/payara/distributions/payara/6.2023.2/payara-6.2023.2.zip</cargo.payara.download_uri>

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: "The glassfish6x container ID tells the cargo plugin what version of Payara\
    \ we want to use. Cargo uses the download URI to download a version of Payara.\
    \ To finish the Cargo upgrade, we need to update the artifact ID defined inside\
    \ the plugin. At the bottom of the pom.xml file, you will find the Cargo plugin.\
    \ We need to take this artifact ID:\n\n```\n`<artifactId>cargo-maven2-plugin</artifactId>`\n\
    ```\n\nAnd we need to change it into this one:\n\n```\n`<artifactId>cargo-maven3-plugin</artifactId>`\n\
    ```\n\nThis finishes the Payara and Cargo upgrade to the latest version.\n\nThe\
    \ Cargo tracker uses **Derby** as an in-memory database to store cargo information,\
    \ but this is no longer possible if we want to use Payara 6. Payara has replaced\
    \ Derby with **H2** for several reasons. This means that we must change the data\
    \ source inside the web.xml file.\n\nInside web.xml, we need to replace the data\
    \ source that looks as follows with one that uses H2:\n\n```\n```xml\n<data-source>\n\
    \    <name>java:app/jdbc/CargoTrackerDatabase</name>\n    <class-name>org.apache.derby.jdbc.EmbeddedDriver</class-name>\n\
    \    <url>jdbc:derby:${webapp.databaseTempDir}\n        /cargo-tracker-database;create=true</url>\n\
    </data-source>\n```\n```\n\nTo use H2, we need to replace the class name to tell\
    \ Payara which driver to use to connect the database. The URL tells Payara where\
    \ to find the database, and :mem: tells H2 that we want to use an in-memory database.\
    \ The last parameter is the name of the database that H2 has to create:\n\n```\n\
    ```xml\n<data-source>\n    <name>java:app/jdbc/CargoTrackerDatabase</name>\n \
    \   <class-name>org.h2.Driver</class-name>\n    <url>jdbc:h2:mem:cargo-tracker-database</url>\n\
    </data-source>\n```\n```\n\n# Upgrading PrimeFaces\n\nThe last dependency we need\
    \ to upgrade is **PrimeFaces**. This upgrade also consists of two steps: upgrading\
    \ the dependency to the latest version and changing the PrimeFaces theme because\
    \ the theme used by the project is no longer supported.\n\nTo upgrade the primefaces\
    \ dependency, we need to change the version and add a classifier."
  merge: -1
  img_proc: true
- pgno: 61
  md: "The current primefaces dependency looks like the following:\n\n```\n<dependency>\n\
    \    <groupId>org.primefaces</groupId>\n    <artifactId>primefaces</artifactId>\n\
    \    <version>8.0</version>\n</dependency>\n```\n\nWith the upgrade, it should\
    \ look like the following example. We changed the version to 10.0.0 and added\
    \ the jakarta classifier:\n\n```\n<dependency>\n    <groupId>org.primefaces</groupId>\n\
    \    <artifactId>primefaces</artifactId>\n    <version>10.0.0</version>\n    <classifier>jakarta</classifier>\n\
    </dependency>\n```\n\nAs mentioned earlier, we need to change the theme. To do\
    \ this, go to the web.xml file and look for the following lines at the top part\
    \ of the file:\n\n```\n<context-param>\n    <param-name>primefaces.THEME</param-name>\n\
    \    <param-value>omega</param-value>\n</context-param>\n```\n\nThe param-value\
    \ tells PrimeFaces we want to use the omega theme for the project. This theme\
    \ is not usable with version 10 of PrimeFaces. To switch to a different theme,\
    \ change the previous code line into this:\n\n```\n<context-param>\n    <param-name>primefaces.THEME</param-name>\n\
    \    <param-value>saga</param-value>\n</context-param>\n```\n\nAfter performing\
    \ the last step, we concluded the migration from javax to jakarta. You can now\
    \ run mvn clean and mvn package cargo:run to run the Cargo tracker application\
    \ using Jakarta EE on Payara 6."
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Red Hat MTA


    **MTA**, which stands for **Migration Toolkit for Applications**, can automatically
    convert your Java EE projects to Jakarta EE. It does so by applying a certain
    set of rules. MTA is a very extensive product. Conversions can be done via the
    following:


    +   - A user interface

    +   - Command-line tools

    +   - An OpenShift operator

    +   - IDE plugins


    Before you can use MTA, you need to download (https://developers.redhat.com/products/mtr/download)
    and install it. For installation instructions, we refer you to the official documentation
    (https://access.redhat.com/documentation/en-us/migration_toolkit_for_applications/6.2/html/cli_guide/index?extIdCarryOver=true&sc_cid=701f2000001Css5AAC).
    You should install the command-line tools, as those will be the ones you will
    need for executing migrations on your machine.


    Once you have the command-line tools installed, you can start migrating. We will
    again use the IntelliJ plugin to execute the migration. You need to install the
    MTA plugin from the Plugins page:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_62_0.png)


    Figure 3.4 – MTA plugin installation screen'
  merge: -1
  img_proc: true
