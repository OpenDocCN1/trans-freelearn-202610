- pgno: 171
  md: "# MicroProfile Fault Tolerance\n\nSo, we have our service configured and we\
    \ can check its health. The next step for a microservice to become cloud-native\
    \ is adding some resilience. The service should be able to self-heal within certain\
    \ limits.\n\nThere are six annotations available within MicroProfile Fault Tolerance\
    \ that can help make your service more robust:\n\n+   - `@Asynchronous`\n+   -\
    \ `@Retry`\n+   - `@Timeout`\n+   - `@Bulkhead`\n+   - `@CircuitBreaker`\n+  \
    \ - `@Fallback`\n\nIt is good to know that these annotations can be added to both\
    \ CDI beans and public methods within those beans. Under the hood, they are implemented\
    \ via interceptors.\n\n# @Asynchronous\n\n@Asynchronous adds, well, asynchronous\
    \ behavior to the method it annotates. It wraps them into a method that returns\
    \ CompletableStage on which the other fault tolerance annotation can be applied.\n\
    \n@Asynchronous allows your code to run concurrently. Let's have a look at an\
    \ example:\n\n```\n@Inject\n\n// is annoted with @Asynchronous\nprivate CustomerDetailsService\
    \ customerDetails;\n@Inject\n// is annoted with @Asynchronous\nprivate CustomerSalesHistoryService\
    \ customerSalesHistory;\npublic CompletionStage<Customer> retrieveCustomerAsynchronously()\
    \ {\n\n    CompletionStage<CustomerDetails> result1 = customerDetails.\ngetDetails(customerNo);\n\
    \    CompletionStage<CustomerHistory> result2 =\ncustomerSalesHistory.getHistory(customerNo)\n\
    \n    ...\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: "```\n}\n\n@RequestScoped\npublic class CustomerDetailsService {\n\n    @Retry\n\
    \    @Asynchronous\n    public CompletionStage<CustomerDetails> getDetails(String\
    \ customerNo) {\n        var details = retrieveDetails(customerNo)\n        return\
    \ CompletableFuture.completedFuture(details);\n    }\n}\n```\n\nWe define CompletionStage\
    \ for retrieving customer information. It consists of two steps – retrieving generic\
    \ customer information and retrieving the sales history of the customer. This\
    \ information is then combined into one object, CustomerDetails, that is returned.\n\
    \nIn the preceding example, getDetails from CustomerDetailService is annotated\
    \ with @Retry. This implies that when the method invocation fails, it is retried.\n\
    \nSynchronicity is achieved by MicroProfile by intervening when the method is\
    \ called. It intercepts the method call and schedules it to be executed later,\
    \ probably on a different thread. It then returns Future or CompletableStage.\
    \ But this is not the one that is returned from the method because it has not\
    \ been executed yet. Sometime later, the method is executed, and it returns its\
    \ result.\n\nIf Future is returned, the originally returned Future will be updated\
    \ with this result. If it is CompletableStage, Fault Tolerance will wait for this\
    \ CompletableStage to complete before it flags the originally returned CompletableStage\
    \ as completed.\n\nWhile @Asynchronous allows a method that returns Future to\
    \ run asynchronously, it can only apply fault tolerance features to methods that\
    \ return CompletableStage.\n\n# @Retry\n\nThis annotation allows you to gracefully\
    \ handle temporary network glitches.\n\nThe @Retry method can be applied to a\
    \ class or individual method of a bean to indicate that if the invocation of the\
    \ method fails, it should be tried again. A maximum number of retries can be specified\
    \ as well as a maximum duration to retry for."
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The behavior is simple – if a method returns normally, nothing happens. If
    it throws an exception, the method will be invoked again if the exception can
    be cast to an exception, as mentioned in the retryOn parameter. On the other hand,
    if the exception can be cast to one mentioned in the abortOn parameter, no retry
    will be executed and the method will throw the exception to the caller.


    Here’s an example of the typical usage of @Retry:


    ```

    @Retry(maxRetries = 5, maxDuration = 1000)

    public List<Project> findAll()

    ```


    # @Timeout


    @Timeout prevents us from having to wait on the execution of a method forever.
    The value and the time unit can be specified. If the timeout occurs, a TimeoutException
    error is thrown. @Timeout can be combined with other annotations mentioned here.


    Here’s an example of the typical usage of @Timeout:


    ```

    @Timeout(500)

    public List<Project> findAll()

    ```


    # @Bulkhead


    @Bulkhead is used to prevent one fault in the system from cascading to other parts
    of the system and eventually taking down the entire application. Its name comes
    from the shipping industry, where the hulls of tankers are made of separate compartments.
    If the hull is breached, the compartments are closed, and only the affected compartments
    are flooded, not the complete hull, thus preventing the tankers from sinking.


    There are two possible flavors – the semaphore approach and the thread pool isolation
    approach.


    In the semaphore approach, we specify the maximum number of concurrent invocations
    of a method. Here’s an example:


    ```

    @Bulkhead(5)

    public List<Project> findAll() {

    ```


    This says that there may only be five concurrent invocations of the findAll method.
    If a sixth invocation arrives, it will fail immediately with a BulkheadException
    error.


    In the thread pool approach, the annotation is the same, but it is used with the
    @Asynchronous annotation, like this:


    ```

    @Bulkhead(5)

    @Asynchronous

    public Future<List<Project>> findAll()

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'This implies that only five threads from the thread pool are allowed to run
    this method concurrently. The next requests must wait in a waiting queue. When
    the waiting queue is full, a `BulkheadException` error is thrown.


    By working with these limits, the complete thread pool can’t be exhausted. Otherwise,
    at some point, all threads would likely be executing this slow-performing method
    and there would be no more threads available to service the normally functioning
    methods.


    The number of threads and the size of the waiting queue can be configured.


    # ## @CircuitBreaker


    `@CircuitBreaker` allows for a fail-fast scenario. If a certain component is not
    working properly, the circuit breaker will open and no more traffic will be sent
    to that component. A circuit break can be in one of three possible states:


    +   - **Closed:** In this situation, requests are sent to the component

    +   - **Open:** In this situation, any request will immediately lead to a `CircuitBreakerOpenException`
    error

    +   - **Half-open:** In this situation, the system is probing the component to
    see if runs without failure


    Here is a scenario: the circuit breaker keeps a *failure ratio* for a rolling
    window of requests. Once the threshold failure ratio is passed, the circuit breaker
    will open. Any requests that are sent will immediately lead to a `CircuitBreakerOpenException`
    error. After a configurable delay, the circuit breaker moves into a half-open
    state. Then, it probes a configurable number of trial executions. If any of them
    fails, it moves into the open state again. If no errors are found during all the
    trial executions, the circuit breaker is closed again, and traffic will flow freely
    to the component again.


    Here’s a typical usage example of `@CircuitBreaker` with the default values specified:


    ```

    ```java

    @CircuitBreaker(delay = 5000, requestVolumeThreshold = 20,

    failureRatio = 0.5, successThreshold = 1)

    public List<Project> findAll() {

    ```

    ```


    The rolling window of requests to examine is 20. If in these 20, a minimum of
    10 (20 * 0.5) fail, the circuit breaker will open. After waiting 5,000 milliseconds,
    it will shift into the half-open state. If one request succeeds in this state,
    the circuit breaker will close again.


    # ## @Fallback


    All the annotations we have seen so far have tried to stop a method from failing.
    But sometimes, that is just not possible. In those situations, instead of returning
    an error, you might want to return alternative data, such as an empty return value
    or possibly cached values. For those situations, the `@Fallback` annotation is
    available.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "There are two possibilities – fallback handlers and fallback methods. The following\
    \ code shows an example of a fallback method:\n\n```\n@Fallback(fallbackMethod\
    \ = \"backup\")\npublic List<Project> findAll() {\n    return persistence.getAll();\n\
    }\n\nList<Project> backup() {\n    return List.of();\n}\n```\n\nIt is important\
    \ to note that fallback methods should take the same parameters and have the same\
    \ return type as the methods on which they are annotated.\n\n# Final remarks\n\
    \nWhile all the annotations we've looked at can work in isolation, it is possible\
    \ and even advisable to use them in conjunction. Have a look at this code example:\n\
    \n```\n@Retry(maxRetries = 5, maxDuration = 1000)\n@Bulkhead(5)\n@Timeout(500)\n\
    @CircuitBreaker(delay = 5000, requestVolumeThreshold = 20, failureRatio = 0.5,\
    \ successThreshold = 1)\n@Fallback(fallbackMethod = \"backup\")\npublic List<Project>\
    \ findAll() {\n```\n\nThe annotations work together like this:\n\n+   1. On entry,\
    \ a timer starts to run.\n+   2. The semaphore is inspected to see if the method\
    \ may be invoked.\n+   3. The method is invoked.\n+   4. If an exception is thrown,\
    \ the circuit breaker registers it.\n+   5. The retry will kick in and a new attempt\
    \ will be made; start at Step 2.\n+   6. Once the timeout kicks in or the retries\
    \ have been used up, the fallback method is invoked."
  merge: -1
  img_proc: true
- pgno: 176
  md: '# MicroProfile Metrics


    Our service has been configured, we can reason about its health, and we have resilience
    in place. The next thing we want to do is know how it performs. How many requests
    are handled, what is the longest execution time, and what is the average execution
    time? Questions like these can be asked, and answered, by MicroProfile Metrics.


    Metrics is a vast area. In this section, we will only discuss the annotations
    that can be used. But know that you can define your own metrics programmatically.


    Metrics offers a REST API that is, by specification, required to respond with
    metrics in Prometheus format. Optionally, implementations are allowed to respond
    in OpenMetrics format.


    Metrics come in three scopes:


    +   - **Base**: Spec-described metrics that vendors may supply

    +   - **Vendor**: Vendor-specific metrics

    +   - **Application**: Application-specific metrics


    The four metric annotations are as follows:


    +   - `@Counted`

    +   - `@Gauge`

    +   - `@Metrics`

    +   - `@Timed`


    # @Counted


    @Counted counts the invocations of the annotated object. It can be applied to
    methods, constructors, and types.


    Here’s an example:


    ```

    @Counted(absolute = true)

    public Project findById(String uid) {

    ```


    # @Gauge


    @Gauge samples the values of the annotated object. It can only be applied to methods.


    There is no default unit for gauges, so you need to provide one when you define
    the gauge. A gauge is typically a value that comes from the application. Examples
    include the total number of customers, the average order value, or the number
    of processed parcels.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Gauges expose the return value of the annotated method, like so:


    ```

    @Gauge(name = "total_projecrs", tags={"projects"}, unit = MetricUnits.

    NONE)

    public Long getProjectCount()

    ```


    # @Metric


    @Metric contains the metadata information when a metric is requested to be injected.
    It can be applied to fields and parameters.


    When using this annotation, the implementation needs to inject the request metric
    into the field or parameter:


    ```

    @Inject

    @Metric(name = "total_projects")

    Long projectCount;

    ```


    The value of the gauge that we defined previously is injected into the projectCount
    field. This allows your code to directly act upon collected metrics.


    # @Timed


    @Timed tracks the duration of the annotated object. It can be applied to methods,
    constructors, and types. It tracks how often the object was invoked and how long
    it took to complete.


    Here''s an example of its usage:


    ```

    @POST

    @Timed(name = "project_create_duration")

    public Response post(Project project)

    ```


    # Telemetry Tracing


    The telemetry specification is new in MicroProfile 6. Telemetry assembles information
    regarding the applications running in a microservice environment. This information
    can come from various sources, most notably logs, traces, and metrics.


    MicroProfile already had a specification for tracing known as the Open Tracing
    specification. Replacing one with the other did cause some stir in the community,
    but in the end, the choice of OpenTelemetry makes sense. It is a CNCF-supported
    project (https://www.cncf.io/projects/opentelemetry/). Furthermore, it is vendor-
    and tool-agnostic and can be integrated with a broad number of open source and
    commercial projects.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'MicroProfile uses the OpenTelemetry project to implement telemetry. In version
    1.0 of the specification, logging, and metrics are considered out of scope and
    be implemented in any way that’s desired.


    There are various concepts to understand regarding distributed traces: first and
    foremost, your application is performing several tasks. Some may be internal,
    some might be related to an external entity, such as a database, and some might
    include calling other external services. A distributed trace keeps track of all
    the activities and their duration. In doing so, it is possible to paint a clear
    picture of the complete process, spanning multiple systems.


    As an example, assume you have a system that verifies if someone subscribes to
    a newsletter of your company. You need to verify if the email address is not already
    registered. If it is a new subscriber, register them and ask for the mailing service
    to send them the latest newsletter.


    The message would typically arrive via because your application has a Jakarta
    Message listener (component 1) in place that listens to a specific queue. Next,
    your application (component 2) will verify if the email is already enlisted via
    querying the database (component 3). Finally, if the email address is not known,
    your application may invoke the SendNewsletter service (component 4) to send the
    current issue of the newsletter to the new subscriber.


    (Note that more likely, your application would have placed a Jakarta Message on
    another queue on which the SendNewsletter services listen, resulting in an even
    larger number of components being involved).


    If you want to have a complete overview of this process in real life, you need
    a trace that spans all these systems, hence the name distributed tracing. A distributed
    trace records the paths a request takes as it propagates through multi-service
    architectures.


    A distributed trace consists of several spans. A span is a unit of work or operation.
    In the preceding example, invoking each of the components should lead to a span
    being registered in the trace.


    Telemetry can be implemented in any of the following instrumentation ways:


    +   - Automatic instrumentation

    +   - Manual instrumentation

    +   - Agent instrumentation


    Let’s look at each of these possibilities.


    # Automatic instrumentation


    Jakarta RESTful Web Services and MicroProfile REST clients automatically participate
    in distributed tracing. You do not have to make any code changes to achieve this.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "# # Manual instrumentation\n\nManual instrumentation is the process where you\
    \ add tracing abilities. There are two possible ways to achieve this – the first\
    \ through annotation and the second through injecting trace objects into your\
    \ Java code. Let’s dive into these options in more detail.\n\n# ## The @withSpan\
    \ annotation\n\nUsing this annotation on CDI managed bean allows you to create\
    \ a new span and establish a relationship with the current trace. You can state\
    \ which parameters should be recorded in the span by using the @spanAttribute\
    \ attribute on the @withSpan annotation. Here’s an example:\n\n```\n```java\n\
    @ApplicationScoped\nclass SomeBean {\n    @WithSpan\n    void span() {\n    }\n\
    \    @WithSpan(\"name\")\n    void spanName() {\n    }\n    @WithSpan(kind = SpanKind.SERVER)\n\
    \    void spanKind() {\n    }\n    @WithSpan\n    void spanArgs(@SpanAttribute(value\
    \ = \"theArguments\") String args)\n    {\n    }\n}\n```\n```\n\n# ## Injecting\
    \ trace objects\n\nSeveral trace objects can be injected into your code via the\
    \ @Inject annotation:\n\n+   - OpenTelemetry\n+   - Tracer\n+   - Span\n+   -\
    \ Baggage\n\nOnce injected, you can manipulate the different objects to add spans\
    \ to your code. Here is an example of retrieving SpanBuilder from Tracer to add\
    \ a new Span object to the trace:\n\n```\n```java\npublic class SomeResource {\n\
    \    @Inject Tracer tracer;\n```\n```"
  merge: -1
