- pgno: 149
  md: '# Deploying Jakarta EE Applications in the Cloud


    In the previous chapters, you learned what cloud native, Docker, and containers
    are. With what we learned in those chapters, we are going to deploy the Cargo
    Tracker application to a cloud environment.


    In this chapter, we are going to set up a cloud environment where the Cargo Tracker
    application can run. To do this, we need to set up the cloud environment first.
    You will learn how to set up a container registry in the cloud to store Docker
    images of the Cargo Tracker application, how to create a container instance from
    an image, and how to see the metrics of a container.


    In this chapter, we’re going to cover the following main topics:


    +   - Deploying to Azure

    +   - Creating a container registry

    +   - Creating a container instance

    +   - Metrics of containers in the cloud


    By the end of the chapter, you will have a fully functional Cargo Tracker application
    running in the cloud that you can access from your own machine.


    # Technical requirements


    For this chapter, you need to have an Azure account. You can create an account
    at the following website: https://azure.microsoft.com/en-us/free. With this account,
    you will be able to follow along with the examples in this chapter. The account
    is needed to create a container registry and a container instance. You can follow
    along with this chapter to get a grasp of what is needed to deploy a Cargo Tracker
    container in a cloud environment, but we recommend that you create an account
    and get hands-on.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# # Deploying to Azure


    Azure is a cloud computing platform and service offered by Microsoft. It provides
    a comprehensive set of cloud-based solutions for individuals and businesses to
    build, deploy, and manage applications and services. Azure leverages Microsoft’s
    extensive global network of data centers to offer a wide range of computing resources,
    storage options, and networking capabilities.


    In this section, we are going to cover how to deploy the Cargo Tracker application
    to the Azure cloud environment. To follow along with these steps, you need to
    have an Azure account. To deploy the application, we are going to create two kinds
    of resources inside the Azure environment: a container registry and a container
    instance. When creating the container instance, we will deploy the Cargo Tracker
    application to the cloud. In the next step, you will be able to access it from
    a local browser.


    # ## Creating a container registry


    The first resource we are going to create is a container registry. A container
    registry is a resource where we can store and manage images we create. We will
    use the container registry to store the Docker images of the Cargo Tracker application.
    The first step is to log in to the Azure portal at `https://portal.azure.com/#home`.
    Once logged in, you’ll see a screen like this:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_150_0.png)'
  merge: -1
  img_proc: true
