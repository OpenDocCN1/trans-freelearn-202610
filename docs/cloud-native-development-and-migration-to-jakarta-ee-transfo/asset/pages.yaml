- pgno: 69
  md: '# # Modernizing Your Application

    ## with the Latest Features


    The application you are migrating, which in our case is the Cargo tracker application,
    has not been majorly upgraded in the last few years, which has resulted in it
    missing out on lots of new features and not using features that the cloud has
    to offer, such as monitoring and scaling. In this chapter, we are going to focus
    on Jakarta EE 10 and upgrading an application to cloud-native standards. During
    this chapter, you are going to modernize your application so that it is ready
    to run in the cloud while using the latest features of Jakarta EE 10.


    In this chapter, we are going to cover the following topics:


    +   - The most significant changes made to Jakarta EE 10

    +   - Adding the first cloud-native feature – resilience

    +   - Adding the second cloud-native feature – monitoring

    +   - Using Prometheus and Grafana to visualize the monitoring process


    After completing this chapter, you will be able to upgrade your application to
    one that can use the cloud and the newest features of Jakarta EE 10. You will
    also know how to monitor the health of your application. This will enable you
    to keep up with the newest releases of Jakarta EE.


    # ## Technical requirements


    To follow along with this chapter, you need to have finished *Chapter 3*. For
    this chapter, it is important to have an application that runs on Jakarta EE 10
    or newer but isn’t using the new features yet.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# The most significant changes to Jakarta EE 10


    Jakarta EE 10 is the first edition of Jakarta EE that added functionality since
    joining the Eclipse Foundation. In this section, we will be going over the most
    meaningful changes that were made. It is in no sense meant to be an exhaustive
    overview of all the changes. Neither will we apply these changes to our existing
    Cargo Tracker application. Making these changes would be very use-case-specific,
    such as setting up a different authentication mechanism or changing primary keys.


    # Core Profile


    We have already pointed out that one of the major features was adding the Core
    Profile. This profile targets smaller applications such as microservices. In fact,
    according to the official documentation, it targets modern cloud applications
    with a focus on a minimal set of APIs that support microservices with a focus
    on enabling implementations that make use of ahead-of-time (AOT) compilation builds
    to minimize startup time and memory footprint.


    That is quite a sentence, and to fully understand what it means, we are going
    to break it down. It targets smaller applications. That is an interesting observation.
    In the chapter on the history of Java EE/Jakarta EE, you read that the original
    profiles targeted two kinds of implementations: web servers and application servers.
    The web profiles target smaller applications that don’t use many specifications,
    while the full profiles implemented by application servers target larger and more
    complex applications. These full profile implementations provide a variety of
    functionality to applications that are being deployed on those servers: EJBs,
    security, transaction management, and JNDI, to name a few. This is in contrast
    to the core profile, which targets very precise microservices that do not use
    a lot of the Jakarta specification.


    Moving to smaller applications contrasts with these full-profile implementations.
    But it does align with the current trend in software architecture, which is that
    monolithic applications are broken down into smaller applications. So, Jakarta
    EE wants to be a platform that allows for microservices.


    It allows for the creation of modern, cloud-native applications. We’ve already
    seen what cloud-native applications all are about. To enable this cloud-nativeness,
    Jakarta EE and Micro Profile can be used since they complement each other.


    Focus on a minimal set of APIs that support microservices. Before the Core Profile
    arrived, we used the Web Profile to create microservices. But in contrast to the
    Web Profile, the Core Profile only requires seven specifications to be available:


    +   - Jakarta Annotations

    +   - Jakarta CDI Lite

    +   - Jakarta Dependency Injection

    +   - Jakarta Interceptors'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   - Jakarta JSON Processing

    +   - Jakarta JSON Binding

    +   - Jakarta RESTful Web Services


    Another benefit of only having seven specifications that need to be implemented
    is that it makes it easier to create a valid application server that complies
    with the Jakarta EE 10 core profile specification. This allows the community to
    create more application servers that would better fit their use case.


    Then, there is a focus on enabling implementations that make use of AOT compilation.
    This is quite a different process from the normal JIT compilation that Java runtime
    uses by default.


    Normally, a Java file is compiled into a class file. This is before executing
    the code. During the execution of the code, the **Java Virtual Machine (JVM)**
    translates the bytecode into platform-specific machine code. For this, it has
    two compilers on board, named C1 and C2. C1 quickly produces non-optimized machine
    code. At some point, a method execution count threshold might be passed, and then
    the JVM decides that it is time to optimize the generated machine code. This is
    where the C2 compiler comes in. It will take more time to generate the code, but
    the generated machine code is highly optimized.


    It is important to remember that all this compilation is done during the execution
    of the application.


    AOT compilation, on the other hand, is performed before the application is executed.
    In a complicated and time-consuming process, the AOT compiler will walk every
    possible path of execution and generate the required machine code. There are several
    advantages of this:


    +   - There is no need for a full-fledged JVM when running the application

    +   - The application is already in binary format, so no time is spent at runtime
    on the compilation

    +   - All classes are known at startup, so no scanning of JAR/WAR/EAR files is
    required

    +   - Optimized memory consumption

    +   - Quick startup times as everything that needs to start is known upfront


    As with so many things, AOT does not come for free. The most notable disadvantages
    are as follows:


    +   - Extremely long compilation times

    +   - The ability of dynamic class loading is lost

    +   - The generated binary targets a specific platform, losing the idea of writing
    your code once and running it anywhere

    +   - You lose the ability to optimize code execution at runtime like the C2 compiler
    does


    The most famous AOT compiler right now is GraalVM from Oracle. It comes in both
    open source and licensed versions. Though the former provides the most features,
    the latter comes with support and is more optimized.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# ## Using UUIDs as keys\n\nBefore looking at how to use **Universally Unique\
    \ Identifiers (UUIDs)**, we should define what they are and why you would want\
    \ to use them. UUIDs are used to uniquely identify an object or entity. They are\
    \ defined in RFC-4122.\n\nThere are several different types of UUIDs:\n\n+   -\
    \ **Type 1:** Date-time and MAC address-based\n+   - **Type 2:** Date-time, MAC\
    \ address, and **Distributed Computing Environment (DCE)**-based\n+   - **Type\
    \ 3:** MD5 hashing of a namespace and a name\n+   - **Type 4:** Randomly generated\
    \ numbers\n+   - **Type 5:** SHA-1 hashing of a namespace and a name\n\nThough\
    \ their name implies that they are always unique, there is a possibility of duplicate\
    \ values. Though it varies per type, the overall possibility is so low that it\
    \ can safely be ignored.\n\nJakarta Persistence can now use UUIDs as key values.\
    \ UUIDs are mostly unique values. This allows them to be used as values for keys\
    \ that require uniqueness. Though duplicates can arise, and depending on the chosen\
    \ type of UUID this possibility might be higher, in practice, it is very unlikely\
    \ to happen.\n\nConsider the following code, which does just this:\n\n```\n```java\n\
    @Entity\npublic class Vehicle {\n    @Id\n    @GeneratedValue(strategy = GenerationType.UUID)\n\
    \    private UUID id;\n    private String license;\n    private String type;\n\
    }\n```\n```\n\nThe ID of the Vehicle class is of the java.util.UUID type. The\
    \ UUID generated by GenerationType.UUID is an rfc-4122-compatible UUID.\n\n# ##\
    \ Multi-part form parameters\n\nMulti-part form data is useful for uploading larger\
    \ amounts of data, such as a picture or the contents of a file.\n\nWhile this\
    \ is quite common behavior for an application, Jakarta EE does not have a standard\
    \ solution for this in place. Often, developers have to rely on non-portable implementations\
    \ that come from their application server vendor."
  merge: -1
  img_proc: true
- pgno: 73
  md: "Finally, with Jakarta EE 10, multi-part form parameters are supported out of\
    \ the box:\n\n```\n@POST\n@Path(\"upload/picture\")\n@Consumes(MediaType.MULTIPART_FORM_DATA)\n\
    public Response postImage(@FormParam(\"userId\") String memberId, @FormParam(\"\
    image\") EntityPart image) {\n    String fileName = image.getFileName().orElseThrow(NotSupportedException::new);\n\
    \    InputStream content = image.getContent();\n    return Response.ok(\"image\
    \ is uploaded\").build();\n}\n```\n\nWe need to define that the endpoint consumes\
    \ MULTIPART_FORM_DATA. Next, we need to define the individual form parameters\
    \ whose content is to be injected into the variables. In the preceding code, EntityPart\
    \ will hold a stream that contains the image data. Even though a string could\
    \ be used here, the wiser and more scalable solution is to use an input stream\
    \ to read the data to prevent the image contents from being loaded into the method\
    \ in one go.\n\n# Pure Java Jakarta Faces views\n\nYup, you read that right! If\
    \ you would like to programmatically compose your Jakarta Faces views, you now\
    \ can. You can skip all the scripting parts and use just Java code.\n\nThere are\
    \ various advantages to doing this. When building a view dynamically, you simply\
    \ loop over your Java class and create components for each field as required.\
    \ If you want to exclude certain fields from the view, the conditions under which\
    \ to do so can be written in Java. Finally, event handlers can be simple Java\
    \ Lambdas – there is no need to use method references via EL expressions.\n\n\
    If you have written Swing code before using Java SE, then the following example\
    \ may look very familiar:\n\n```\nHtmlForm form = components.create(HtmlForm.COMPONENT_TYPE);\n\
    body.getChildren().add(form);\n\nHtmlOutputText message = components.create(HtmlOutputText.COMPONENT_TYPE);\n\
    form.getChildren().add(message);\n\nHtmlCommandButton actionButton = components.create(HtmlCommandButton.COMPONENT_TYPE);\n\
    actionButton.addActionListener(\n    e -> message.setValue(\"I was pressed\"));\n\
    actionButton.setValue(\"Press\");\nform.getChildren().add(actionButton);\n```"
  merge: -1
