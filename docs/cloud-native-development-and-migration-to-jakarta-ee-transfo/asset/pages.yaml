  img_proc: true
- pgno: 79
  md: "```\n```text\nbase_memory_committedNonHeap_bytes 2.17448448E8\n# TYPE base_memory_maxHeap_bytes\
    \ gauge\nbase_memory_maxHeap_bytes 5.36870912E8\n# TYPE base_memory_maxNonHeap_bytes\
    \ gauge\nbase_memory_maxNonHeap_bytes -1\n# TYPE base_memory_usedHeap_bytes gauge\n\
    base_memory_usedHeap_bytes 2.28326272E8\n```\n```\n\nNote that for brevity, we\
    \ left out the #HELP lines.\n\nSome of these metrics might be quite useful as\
    \ they allow you to monitor the behavior and health of your system. This data\
    \ is very important for teams who have to support the application while it is\
    \ in production. The metrics can be the number of processors, the average load\
    \ of the processors, the number of garbage collections, the uptime, and several\
    \ memory statistics. The latter might come in handy as a way of determining memory\
    \ leaks in your application.\n\nAt the end of the output, we can see a vendor-specific\
    \ metric:\n\n```\n```text\n# TYPE vendor_system_cpu_load gauge\nvendor_system_cpu_load\
    \ 0.08853118712273642\n```\n```\n\n# Adding metrics to your system\n\nNext, we\
    \ are going to add some metrics of our own to the Cargo Tracker application. The\
    \ first step is to identify which metrics you or your stakeholder might be interested\
    \ in. The tech department will likely be very interested in metrics that can help\
    \ verify that the system is working as expected. The business stakeholders, on\
    \ the other hand, might be more interested in some business-oriented key performance\
    \ indicators. In this section, we are going to add some of both types to our application.\n\
    \nRecall *Chapter 2*, where we introduced the Cargo Tracker application, which\
    \ has one REST endpoint to retrieve information about existing shipments. That\
    \ endpoint can be reached at `http://localhost:8080/cargo-tracker/rest/cargo`\
    \ and will show a list of outstanding shipments.\n\nHere is part of the output:\n\
