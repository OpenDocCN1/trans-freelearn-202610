- pgno: 117
  md: '# Running a container


    The next step is to run the Cargo Tracker application using the container we built
    in the previous step. To start the container, run the following command inside
    a terminal:


    ```

    docker run -p 8080:8080 cargo-tracker

    ```


    This command will start the container named cargo-tracker that we created in the
    previous step. The command consists of three parts:


    +   - Run

    +   - -p 8080:8080

    +   - cargo-tracker


    Run tells Docker Engine we want to start a container. Everything after the run
    is a parameter that will be passed to the Docker Engine. -p 8080:8080 tells Docker
    Engine that we want to map ports from inside a container to the outside. Without
    this, we won’t be able to access the Payara server that we have running inside
    the container. The first 8080 is the port number on the host; the second 8080
    is the port inside the container. Using this -p parameter, we can now use port
    8080 to connect to the Payara server inside the container that is also running
    on port 8080. The last parameter, cargo-tracker, is the name of the container
    we created.


    When you run the command, you will directly see the logging that happens inside
    the container. After a few seconds, you will something like the following in the
    console:


    ```

    [#|2023-03-26T18:29:09.723+0000|INFO|Payara 6.2023.2||_ThreadID=216;_ThreadName=Thread-24;_TimeMillis=1679855349723;_LevelValue=800;|SSLParams
    =org.glassfish.admin.mbeanserver.ssl.SSLParams@78a4a59b|#]

    [#|2023-03-26T18:29:09.741+0000|INFO|Payara 6.2023.2|javax.enterprise.system.jmx|_ThreadID=216;_ThreadName=Thread-24;_TimeMillis=1679855349741;_LevelValue=800;_MessageID=NCLS-JMX-00025;|SSLServerSocket[/0.0.0.0:8686
    and [SSL: ServerSocket[addr=/0.0.0.0,localport=8686]] created|#]

    [#|2023-03-26T18:29:09.802+0000|INFO|Payara 6.2023.2|javax.enterprise.system.jmx|_ThreadID=216;_ThreadName=Thread-24;_TimeMillis=1679855349802;_LevelValue=800;_MessageID=NCLS-JMX-00005;|JMXStartupService
    has started JMXConnector on JMXService URL service:jmx:rmi:///0.0.0.0:8686/jndi/rmi:///0.0.0.0:8686/jmxrmi|#]

    ```


    This tells you that the Payara server has started and the Cargo Tracker application
    has been deployed. You can now access the server by going to the following URL:
    http://localhost:8080/cargo-tracker/. This is the same URL as when you locally
    run the Cargo Tracker application in a Payara server. However, instead of connecting
    to a local Payara server, you now connect to the Payara server inside the container.


    When you click on the interface of the Cargo Tracker application, you will see
    the logging appear inside the console.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Running the container in detached mode


    You can also run the container in detached mode using the following command:


    ```

    ```bash

    docker run -p 8080:8080 cargo-tracker -d

    ```

    ```


    Note that this command contains an extra parameter, –d. This parameter tells Docker
    Engine that we want to start the container in detached mode. When you start the
    container this way, you won’t see the logging of the container. Instead, the command
    returns the container ID of the container you just started.


    To see which containers you have running, you can use the following command:


    ```

    ```bash

    docker ps

    ```

    ```


    This will print something like this to the console:


    ```

    ```text

    CONTAINER        ID     IMAGE          COMMAND                 CREATED       STATUS       PORTS                    NAMES

    c94fa6f7accf     cargo-tracker   "/tini -- /bin/sh -c…"   2 minutes ago   Up 2
    minutes   4848/tcp, 8181/tcp, 9009/tcp,

    0.0.0.0:8080->8080/tcp   inspiring_morse

    ```

    ```


    This overview shows you the following:


    +   - The container ID

    +   - The image name

    +   - The command

    +   - The time the container was created

    +   - The status of the container

    +   - The port mappings

    +   - The name of the container


    When you run the container in detached mode, you can close the terminal, and the
    container will continue to run in the background.


    # Stopping a running container


    If you want to stop the container, you can use the kill command and pass it as
    part of the container ID. The following example command kills a container with
    a container ID that starts with c:


    ```

    ```bash

    docker kill c9

    ```

    ```'
  merge: -1
  img_proc: true
