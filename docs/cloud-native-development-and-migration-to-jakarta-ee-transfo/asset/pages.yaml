- pgno: 134
  md: 'You can verify that the deployment created a pod by entering this command:


    ```

    kubectl get pods

    ```


    ![](img/8948f94d0abcdb1ae94d6778da518d16_134_0.png)


    Figure 7.3 – Overview of the running pod


    A pod with the same name as the deployment plus a unique suffix is created. At
    the same time, a service was created, which can be viewed by entering the following


    ```

    kubectl get service.

    ```


    The deployment is not exposed to your computer yet. For this, we need to expose
    it via the following:


    ```

    kubectl port-forward service/greeting 8080:8080

    ```


    This is best done in a new terminal window, as the port-forwarding will block
    the terminal from further input. We tell Kubernetes here that traffic arriving
    on port 8080 should be forwarded to the service named greeting on port 8080.


    Now, when you open a browser and enter http://localhost:8080/api/greet?name=Packt
    you will see the following:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_134_1.png)


    Hello, Packt!


    Figure 7.4 – Output from our deployed application


    # Summary


    In this chapter, we have given you a brief introduction to the origins of Kubernetes,
    why it might be useful to you, what its main functionality is, and what its architecture
    is.


    It is highly likely that once you decide to migrate your code to a more modern
    cloud-native approach or start using containers, you will have to work with container
    management systems such as Kubernetes. This chapter has given you a good idea
    of how they work and where you can utilize them.


    Kubernetes is the most downloaded product of CNCF. What exactly cloud-native is
    will be addressed in the next chapter.'
  merge: -1
  img_proc: true
