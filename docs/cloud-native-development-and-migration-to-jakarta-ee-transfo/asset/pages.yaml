- pgno: 103
  md: "The next step is to create a container using a Docker image of Payara that\
    \ we can use to deploy the .war file too:\n\n```\n@Testcontainers\npublic class\
    \ IntegrationTests {\n\n    static MountableFile warFile = MountableFile.forHostPath(\n\
    \    Paths.get(\"target/cargo-tracker.war\").toAbsolutePath(), 0777);\n    @Container\n\
    \    static GenericContainer CargoContainer =\n    new GenericContainer(\"payara/server-full:6.2023.2-jdk17\"\
    )\n    .withCopyFileToContainer(warFile,\n    \"/opt/payara/deployments/cargo-tracker.war\"\
    )\n    .withExposedPorts(8080)\n    .waitingFor(Wait.forHttp(\"/cargo-tracker\"\
    ));\n\n}\n```\n\nThis GenericContainer class adds a lot of code. So, let's break\
    \ down step by step what happens. The GenericContainer class is marked with the\
    \ @Container annotation this makes JUnit responsible for the lifetime management\
    \ of the container. Behind the scenes, JUnit will use Testcontainers to do this.\
    \ JUnit will instruct the Testcontainers dependency on a per test case basis on\
    \ what it needs to do.\n\nThe GenericContainer class is made static because we\
    \ want to use the same container instance for every test. If we did not use a\
    \ static class, a new container would be started for every test and the old one\
    \ would be stopped. This could be handy for certain tests but also takes some\
    \ time. It is better to reuse containers if you want to speed the tests up.\n\n\
    Creating the actual instance is the interesting bit of the code. When you look\
    \ at the following example, you can see that four things happen:\n\n```\nnew GenericContainer(\"\
    payara/server-full:6.2023.2-jdk17\")\n.withCopyFileToContainer(warFile,\n    \"\
    /opt/payara/deployments/cargo-tracker.war\")\n.withExposedPorts(8080)\n.waitingFor(Wait.forHttp(\"\
    /cargo-tracker\"));\n```\n\nOn the first line, we tell Testcontainers on what\
    \ image we want the container to be based. When we have a container, we want to\
    \ copy the .war file to the container so that it can be deployed. We don't have\
    \ to call a deploy commando because Payara will deploy anything that is inside\
    \ the /opt/payara/deployments/ directory of the container. On line 3, we specify\
    \ the port we want to have exposed—in this case, 8080. This is the default port\
    \ and makes it possible for us to call the container from the outside."
  merge: -1
  img_proc: true
- pgno: 104
  md: "The last part of the code is very important. It tells us when the container\
    \ is ready for use. If we had not included this line, it would have been impossible\
    \ to tell if the container was ready. This could cause errors when a test runs\
    \ too early and cannot reach the Cargo Tracker application, making the test fail.\
    \ To prevent tests from running too early, we can wait based on a condition. In\
    \ the case of the Cargo Tracker application, we want to wait till the Payara server\
    \ is running and the Cargo Tracker application has been deployed. To test if the\
    \ Payara server is running, we can make an http request to the Start page of the\
    \ Cargo Tracker application. If this request is successful, we know that the application\
    \ is up and running and ready for your integration tests.\n\nTo check if creating\
    \ the container and deploying the Cargo Tracker application all work you can add\
    \ the following test to the class:\n\n```\n@Test\npublic void isDeployed() {\n\
    \    Assertions.assertTrue(CargoContainer.isRunning());\n}\n```\n\nThis test will\
    \ check if the container is running and succeeds if it does run. This is a good\
    \ test, but it does not tell you anything useful about the working of the Cargo\
    \ Tracker application. So, let us create an integration test that will test the\
    \ Cargo Tracker application.\n\n# Creating an integration test\n\nIn the previous\
    \ section, we set up a Docker container that will run the Cargo Tracker application.\
    \ This container is managed by JUnit using Testcontainers. In the previous section,\
    \ you only set up the container but without a real integration test. In this section,\
    \ you are going to build an integration test we will make an http request to the\
    \ test container.\n\nTo make a request to the container, we are going to use rest-assured\
    \ library. rest-assured is a library that gives us tools to test and validate\
    \ REST services inside our test cases. To add the rest-assured dependency to the\
    \ project, you need to include the following code snippet to the pom.xml file\
    \ of the Cargo Tracker application:\n\n```\n<dependency>\n    <groupId>io.rest-assured</groupId>\n\
    \    <artifactId>rest-assured</artifactId>\n    <version>5.3.1</version>\n   \
    \ <scope>test</scope>\n</dependency>\n```\n\nWith this dependency included, we\
    \ can start making REST calls from within our tests. The next step is to build\
    \ the test case. Let's start with an empty case that looks like this:\n\n```\n\
    @Test\npublic void verify() {\n}\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: "This test case is just a method that is marked with the `@test` annotation\
    \ that tells JUnit 5 that this method contains a test it can run. Now, let’s make\
    \ a call to the test container using `rest-assured`. Add the following code to\
    \ the testing method:\n\n```\nList<LinkedHashMap<String, Object>> cargoResult\
    \ = given().get(String.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
    , CargoContainer.getMappedPort(8080)))\n    .then()\n    .assertThat().statusCode(200)\n\
    \    .and()\n    .contentType(ContentType.JSON)\n    .extract()\n    .as(List.class);\n\
    ```\n\nThis method does a lot. Let’s go over it line by line and see what it does:\n\
    \n+   - The example starts with an assignment to `cargoResult`. This will be a\
    \ reference to the body of the request that we want to use later for further testing.\n\
    +   - After the assignment, you can see that a GET request is created for the\
    \ `cargo` endpoint of the Cargo Tracker application.\n+   - When you look closely,\
    \ you can see that we must create a URL using `String.format` to call the Cargo\
    \ Tracker application that runs inside a container. That is because we don’t know\
    \ which outside port is mapped to the internal port `8080` that the Cargo Tracker\
    \ application listens to.\n\nTo find out which port is mapped to the internal\
    \ port 8080, we must retrieve the port from the CargoContainer instance we created\
    \ in the previous section, as follows:\n\n```\nString.format(\"http://localhost:%d/cargo-tracker/rest/cargo\"\
    ,\n    CargoContainer.getMappedPort(8080))\n```\n\nThis is the same `String.format`\
    \ instance as the one from the previous example. As you can see, we retrieve the\
    \ correct port by calling this method: `CargoContainer.getMappedPort(8080)`. This\
    \ method returns the port number that is mapped to 8080. We must do this as Testcontainers\
    \ automatically maps the internal port 8080 to an available port of the host.\
    \ After `String.format`, we have a functional URL that we can use to call the\
    \ test container.\n\nAfter making the call, we want to verify if the result is\
    \ what we expected it to be. To do this, we can use `.then()` and `.assertThat()`,\
    \ as in the following example:\n\n```\n.then()\n    .assertThat().statusCode(200)\n\
    \    .and()\n    .contentType(ContentType.JSON)\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: "In the previous code snippet, we do two assertions, as follows:\n\n+   - The\
    \ first assertion that we are doing is checking that the status code we get as\
    \ a response is 200, which means the request was processed OK\n+   - The second\
    \ assertion we do is to check that the content of the response is JSON\n\nThe\
    \ next thing we want to do is to retrieve the actual response that was returned\
    \ by the Cargo Tracker application, the JSON that it generated. To do this, we\
    \ can use the extract() method, which will use Jackson to convert the JSON to\
    \ objects. In this case, we just want an array of string.\n\nThe following example\
    \ shows you how to extract the JSON response from rest-assured:\n\n```\n```\n\
    .extract()\n.as(List.class);\n```\n```\n\nWe can use the JSON response for further\
    \ testing. We can use it for assertions on the size and assert if the content\
    \ is what we expected it to be. You can see how this is done in the following\
    \ example:\n\n```\n```\nAssertions.assertEquals(4, cargoResult.size());\n\ncargoResult.forEach(cargo\
    \ -> {\n    Assertions.assertEquals(cargo.size(), 7);\n});\n```\n```\n\nThe complete\
    \ integration test will look like this:\n\n```\n```\n@Test\npublic void verify()\
    \ {\n\n    List<LinkedHashMap<String, Object>> cargoResult = given().get(String.format(\"\
    http://localhost:%d/cargo-tracker/rest/cargo\", CargoContainer.getMappedPort(8080)))\n\
    \        .then()\n        .assertThat().statusCode(200)\n        .and()\n    \
    \    .contentType(ContentType.JSON)\n        .extract()\n        .as(List.class);\n\
    \n    Assertions.assertEquals(4, cargoResult.size());\n\n    cargoResult.forEach(cargo\
    \ -> {\n        Assertions.assertEquals(cargo.size(), 7);\n    });\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: "When this test is going to run, JUnit will spin up a container for the Cargo\
    \ Tracker application and then perform the test when the Cargo Tracker application\
    \ is deployed and reachable. When the container is ready, the test will run and\
    \ make a call to the /cargo endpoint and verify the response from the Cargo Tracker\
    \ application.\n\nAfter completing this and the previous section, the complete\
    \ testing method will look like the following example:\n\n```\n@Testcontainers\n\
    public class IntegrationTests {\n\n    static MountableFile warFile = MountableFile.forHostPath(\n\
    Paths.get(\"target/cargo-tracker.war\").toAbsolutePath(), 0777);\n    @Container\n\
    \    static GenericContainer CargoContainer =\n    new GenericContainer(\"payara/server-full:6.2023.2-jdk17\"\
    )\n    .withCopyFileToContainer(warFile,\n    \"/opt/payara/deployments/cargo-tracker.war\"\
    )\n    .withExposedPorts(8080)\n    .waitingFor(Wait.forHttp(\"/cargo-tracker\"\
    ));\n\n    @Test\n    public void isDeployed(){\n    Assertions.assertTrue(CargoContainer.isRunning());\n\
    \    }\n\n    @Test\n    public void verify(){\n    List<LinkedHashMap<String,\
    \ Object>> cargoResult = given().get(String.\n    format(\"http://localhost:${}/cargo-tracker/rest/cargo\"\
    ,\n    CargoContainer.getMappedPort(8080)))\n    .then()\n    .assertThat().statusCode(200)\n\
    \    .and()\n    .contentType(ContentType.JSON)\n    .extract()\n    .as(List.class);\n\
    \n    Assertions.assertEquals(4, cargoResult.size());\n\n    cargoResult.forEach(cargo\
    \ -> {\n    Assertions.assertEquals(cargo.size(), 7);\n    });\n    }\n}\n```"
  merge: -1
  img_proc: true
