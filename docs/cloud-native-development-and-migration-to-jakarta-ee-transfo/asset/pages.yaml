- pgno: 131
  md: 'What is not shown in the diagram is the **container runtime (CRI)**. Of course,
    to run containers, a container runtime should be installed on each node. CRI is
    an interface, and the following are supported:


    +   - Cri-o

    +   - Containerd

    +   - Docker


    In summary, this is the architecture of Kubernetes. As you can see, Kubernetes
    is not just one application. It is a collection of applications – some on the
    server, some on the clients – that cooperate to manage a potentially large set
    of containers.


    # Where to run Kubernetes


    So, now that you know what Kubernetes is meant for and what functionality it provides
    (although we have only scratched the surface of this), the next question is, how
    do I run Kubernetes myself?


    There are several options you can choose from if you want to run Kubernetes. Our
    list here is not exhaustive, simply because, almost daily, new options arrive.
    We will list the ones we feel are the most popular or most promising.


    # Use your own hardware


    This might be the simplest way to start. Download and install Kubernetes on your
    own hardware. Depending on your needs, you might need quite a few computers. However,
    using virtualization on a few large servers might be enough to satisfy your hardware
    needs. Moreover, the smaller the number of computers, the lesser the cost of managing
    them is.


    Keep in mind that this option still requires you to manage this cluster of computers
    and replace failing network interface cards and other broken hardware. You are
    also still responsible for backing up your data and monitoring the Kubernetes
    cluster. Also, let us not forget the need to apply software updates.


    Still, if you already have an operations department in place that takes care of
    these tasks, and some hardware to spare, this might be a good option to start
    with. We recommend starting with the setup guide from the official documentation.
    There is also valuable information available about the demands of a Kubernetes
    production environment. As you will administer the cluster yourself, KubeAdm is
    the recommended tool to do this.


    # Using a hosted service


    If you are into maintaining your own hardware and clusters, then using a cloud
    provider is a viable option. They can relieve the burden of providing hardware,
    administering the cluster, and performing operational tasks.'
  merge: -1
