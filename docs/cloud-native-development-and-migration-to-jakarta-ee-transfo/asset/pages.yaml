- pgno: 83
  md: "Prometheus uses a pull mechanism to collect metrics from the applications it\
    \ monitors. This has a few benefits, such as knowing if an application is down\
    \ in advance. In the previous section, you set up an endpoint that Prometheus\
    \ can use to pull metrics from.\n\n# ## Setting up Docker Compose\n\nWe are going\
    \ to use Docker to run an instance of Prometheus. To do so, we need to alter the\
    \ already existing Docker Compose file so that we can add a Prometheus service.\n\
    \nInside the Docker Compose file, add the following lines:\n\n```\n```text\nprometheus:\n\
    \  image: bitnami/prometheus:latest\n  ports:\n    - \"9090:9090\"\n```\n```\n\
    \nThe first line in the previous example is the name of the service we want to\
    \ create. In this case, it is Prometheus. Then, we have to define the image that\
    \ belongs to this service. Here, we are using the latest Prometheus image built\
    \ by Bitnami. The last thing we need to define is some ports so that we can connect\
    \ to the instance once it is running. We have chosen to port forward from `9000`\
    \ to `9000`. When you run this code, you will have a running instance of Prometheus,\
    \ but it won't start collecting metrics out of nowhere. If you go to `localhost:9000`,\
    \ you will see an empty Prometheus instance that has no data to query. To fix\
    \ this, in the next section, we are going to create a job that will collect data.\n\
    \n# ## Setting up the Prometheus settings\n\nThe first time you start up `docker-compose`,\
    \ you will see an empty Prometheus instance that does not collect or have any\
    \ metrics. This is fine if you only want to try some things out. If you deleted\
    \ the container of the Prometheus instance, you will have to start again, and\
    \ that can be quite some work to undertake if you delete your containers often.\
    \ The same also goes when you have a colleague who wants to have the same setup\
    \ as you have. Your colleague will have to set up their Prometheus instance the\
    \ same as you have. This also becomes tedious if you have to do this for your\
    \ entire team and each environment you want a Prometheus service to run in, such\
    \ as test, acceptance, and production.\n\nTo fix this the first thing you have\
    \ to do is create a directory inside the project that can hold the settings file.\
    \ We've created a directory directly inside the project folder. The complete path\
    \ looks like this: `cargo-tracker/prometheus`. Inside the Prometheus instance,\
    \ you need to create a file for the configuration; we chose to name this file\
    \ `prometheus.yml`. This is going to be a YAML file that specifies some global\
    \ settings and settings for the scrape job we want Prometheus to perform on the\
    \ `cargo-tracker` application."
  merge: -1
  img_proc: true
- pgno: 84
  md: "Inside the `prometheus.yml` file, you need to place the following configuration:\n\
    \n```\n```yaml\nglobal:\n  scrape_interval:     10s\n\n  external_labels:\n  \
    \  monitor: 'payara5-monitor'\n\nscrape_configs:\n  - job_name: 'payara5'\n  \
    \  scrape_interval: 2s\n    metrics_path: '/metrics'\n    static_configs:\n  \
    \    - targets: ['cargo-tracker-app:8080']\n```\n```\n\nThis configuration creates\
    \ a scrape configuration for Prometheus to use. This tells Prometheus the following\
    \ things:\n\n+   - The name of the job\n+   - How often it should scrape the given\
    \ metrics\n+   - The path to the metrics on the target\n+   - The targets for\
    \ the scraping\n\nIn the previous section, you could see the metrics of `cargo-tracker`\
    \ at `localhost:8080/metrics`. You will have to do the same to let Prometheus\
    \ know where it can find the metrics. Because we’re using docker-compose, we do\
    \ not have to use localhost; we can use the service names instead. Inside `docker-compose`\
    \ from the previous chapters, we had a service called `cargo-tracker`. We can\
    \ use that name inside the job configuration and Docker will resolve that to an\
    \ actual address that the Prometheus instance can use. Using the service name,\
    \ we can specify the target application like this: `cargo-tracker-app:8080`. The\
    \ complete URL that Prometheus will use will be `cargo-tracker-app:8080/metrics`.\n\
    \nWith the configuration file ready, you need to add a single line to the `docker-compose`\
    \ file. We made a configuration file but we did not tell Prometheus to use it,\
    \ so we need to make this file available inside the container. To do that, we\
    \ need to mount the `prometheus.yml` file, which we can do by running the volume\
    \ keyword inside the `docker-compose` file, like this:\n\n```\n```yaml\nvolumes:\n\
    \  - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "With this line added, the configuration will be available to Prometheus. The\
    \ complete docker-compose will look as follows:\n\n```\n```yaml\nversion: \"3.9\"\
    \nservices:\n  cargo-tracker-app:\n    build: .\n    ports:\n      - \"4848:4848\"\
    \n      - \"8080:8080\"\n      - \"8181:8181\"\n      - \"9009:9009\"\n  prometheus:\n\
    \    image: bitnami/prometheus:latest\n    volumes:\n      - ./prometheus/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml\n\
    \    ports:\n      - \"9090:9090\"\n```\n```\n\nNow that the configuration file\
    \ and docker-compose are ready, we can start the docker-compose file and see if\
    \ it works. In your browser, go to `http://localhost:9090/config`. Here, you can\
    \ see the configuration of the Prometheus instance. If everything works, you should\
    \ see the following output:\n\n![](img/8948f94d0abcdb1ae94d6778da518d16_85_0.png)\n\
    \nFigure 4.1 – Configuration in Prometheus"
  merge: -1
  img_proc: true
- pgno: 86
  md: "# Setting up Grafana\n\nGrafana is a tool for querying and visualizing the\
    \ data we get from the metrics in dashboards that we create. Creating a dashboard\
    \ has the advantage of displaying data so that the user can see the status of\
    \ the system. If certain metrics are at 100% or at 0%, it may be a signal something\
    \ is wrong and needs fixing. This is easier to see with a dashboard than using\
    \ raw metrics.\n\n# Setting up docker-compose\n\nIn this section, we are going\
    \ to run Grafana inside a container, just like we did with Prometheus. To do this,\
    \ we need to change the docker-compose file again. We need to add a new service\
    \ for Grafana. The following example shows how we can add the new service using\
    \ the latest Grafana image from Grafana:\n\n```\ngrafana:\n  image: grafana/grafana:latest\n\
    \  ports:\n    - \"3000:3000\"\n```\n\nThis service will create a Grafana container\
    \ that has port 3000 port forwarded to port 3000 on the host machine.\n\nWhen\
    \ you visit http://localhost:3000/login, you will see the login screen of Grafana:\n\
    \n![](img/8948f94d0abcdb1ae94d6778da518d16_86_0.png)\n\nFigure 4.2 – Grafana login\
    \ screen"
  merge: -1
  img_proc: true
- pgno: 87
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 88
  md: "We will mount this path inside the container later. Inside the data sources\
    \ directory, create a file named `automatic.yml`. You will use this file to store\
    \ the data source configuration. The complete path will be `grafana/provisioning/datasources/automatic.yml`.\
    \ Make sure you put the following configuration inside the YAML file. This configuration\
    \ tells Grafana the following things:\n\n+   - The name of the data source\n+\
    \   - The access type\n+   - The URL where it can find the resource\n+   - If\
    \ this is the default data source to use:\n\n```\ndatasources:\n  - name: Prometheus\n\
    \    access: proxy\n    type: prometheus\n    url: http://prometheus:9090\n  \
    \  isDefault: true\n```\n\nWith the data source set up, we can start importing\
    \ dashboards into Grafana.\n\n# Setting up the dashboard so that it loads automatically\n\
    \nIf you create a dashboard inside the Grafana container, every time you destroy\
    \ the container and start it back up, your dashboards will disappear and not be\
    \ there anymore. This isn’t ideal, especially if you’re sharing the project with\
    \ your colleagues as they will have no dashboard at all. The easiest way to share\
    \ the dashboard and have it available every time you create a new Grafana container\
    \ is to make it part of the project. Making it part of the project and passing\
    \ it to the container makes it available every time you create a new container\
    \ or to any colleague you share the project with.\n\nMaking a dashboard part of\
    \ the project and passing it to the Grafana container is done in two steps. We\
    \ need to make a YAML file that specifies where Grafana can find the dashboards\
    \ and we need to create a dashboard to hold the dashboards that we are going to\
    \ create.\n\nThe first step is creating the YAML file to specify the directory\
    \ of the dashboards. First, you must create a directory to store a YAML file.\
    \ We created the following directory structure to store this YAML file: `grafana/provisioning/dashboards/`.\
    \ Inside the dashboards directory, you need to create a file named `local.yml`.\
    \ You are going to use this file to store the configuration. Inside this file,\
    \ you need to have the following piece of configuration:\n\n```\napiVersion: 1\n\
    providers:\n  - name: 'default'\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "```\norg_id: 1\nfolder: ''\ntype: 'file'\noptions:\n  folder: '/var/lib/grafana/dashboards'\n\
    ```\n\nThe first line inside the configuration specifies the version of the configuration,\
    \ which in this case is going to be 1. After the version, we have to specify the\
    \ providers; this is going to tell Grafana where it can find the dashboards. The\
    \ most important option is on the last line. This line specifies the directory\
    \ inside the container where the dashboard is going to be stored.\n\nThe next\
    \ step is to create a dashboard and store it inside a directory that is inside\
    \ the project directory. We chose to store the dashboards for cargo-tracker inside\
    \ the grafana/mydashboards/ directory. Inside the mydashboards directory, we created\
    \ a JSON file called CargoTracker-1684667357857.json that will hold the configuration.\
    \ The next step is to have a dashboard inside this JSON file. We have already\
    \ created a dashboard for you, so you do not have to do this. The entire JSON\
    \ file that creates the dashboard is too big to place in this book. Please look\
    \ at the file on GitHub at https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE/blob/chapter-4-fix/grafana/mydashboards/CargoTracker-1684667357857.json.\n\
    \nThe JSON configuration creates a dashboard inside Grafana that will use the\
    \ Prometheus data source that you created earlier in this chapter and will display\
    \ some data from it to the dashboard, as you will see shortly.\n\n# Showing Grafana\
    \ Docker\n\nWith the configuration for the dashboard and the dashboard itself\
    \ created, we need to add them to the container. To do this, you need to add the\
    \ last two lines of the following example to the Grafana service inside your Docker\
    \ file:\n\n```\ngrafana:\n  image: grafana/grafana:latest\n  ports:\n    - \"\
    3000:3000\"\n  volumes:\n    - ./grafana/provisioning:/etc/grafana/provisioning\n\
    \    - ./grafana/mydashboards:/var/lib/grafana/dashboards\n```\n\nThese two lines\
    \ will pass the directories you created to the container, making them available\
    \ for Grafana to read from."
  merge: -1
  img_proc: true
- pgno: 90
  md: "# Showing the complete Docker file\n\nThe complete Docker file will look as\
    \ follows. If you followed all the steps in this chapter, you will have altered\
    \ the Cargo Tracker application so that it includes metrics. Create a Prometheus\
    \ and Grafana service that will load their configuration from the cargo-tracker\
    \ application:\n\n```\nversion: \"3.9\"\nservices:\n  cargo-tracker-app:\n   \
    \ build: .\n    ports:\n      - \"4848:4848\"\n      - \"8080:8080\"\n      -\
