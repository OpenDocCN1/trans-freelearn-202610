- pgno: 123
  md: '# Meet Kubernetes


    In this chapter, we will introduce you to Kubernetes. If you are already familiar
    with this technology, feel free to skip this chapter. If you are still with us
    for the ride, get ready to cover the following topics:


    +   - The history of Kubernetes

    +   - Why would you need Kubernetes?

    +   - The key features of Kubernetes

    +   - The architecture of Kubernetes

    +   - Where to run Kubernetes

    +   - Example of using Kubernetes


    At the end of this chapter, you will have a good idea of what container orchestration
    systems such as Kubernetes do, how they work, and how you can utilize them yourself.


    # Technical requirements


    This chapter does not have any technical requirements. If you would like to play
    around with Kubernetes, then here are some projects you could give a try. Minikube
    is a project that installs a one-node cluster on your local machine. Another project
    is Kubernetes in Docker (KinD), which starts a set of containers that will start
    Kubernetes. While these options can give you a good impression of what Kubernetes
    is and how it works, if you want to do some serious investigations, you might
    want to consider a cloud provider option. There are many offerings, such as AKS
    from Azure, GKE from Google, and EKS from Amazon. An interesting alternative is
    K3S from Civo, which uses cheap hardware to run Kubernetes.


    We will perform a simple deployment to Kubernetes via a locally installed Minikube
    at the end of this chapter.


    By the end of this chapter, you should have a good understanding of the position
    of Kubernetes within a cloud-native landscape. You will also have learned what
    functionality Kubernetes offers.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# In the beginning


    If you work in development or infrastructure in the IT industry, you have likely
    heard the name *Kubernetes*. It arrived on the scene in 2015, some eight years
    before we wrote this book.


    Kubernetes started as a project in Google. Google is known for being a company
    that has embraced the cloud completely. All its products are cloud-focused. Just
    think about Gmail, possibly the most used cloud-based email product, and products
    such as Google Documents, Google Drive, and YouTube.


    All of Google’s services run in containers. In an article at InfoQ from 2014,
    it was estimated that Google starts 2 billion containers a week. That means more
    than 3.300 containers every second. With these enormous numbers, it is no surprise
    that there is excellent expert knowledge about running and managing containers.


    Internally, Google uses a system that is named Borg, aptly named after the alien
    group from *Star Trek* that assimilates everything into one central hive.


    Kubernetes itself is not based on Borg. Kubernetes, for instance, is written in
    Google’s own programming language, Golang, whereas Borg is written in C++.


    Yet, the core developers of Kubernetes have a strong knowledge of Borg, and many
    concepts of Borg are transferred to Kubernetes.


    # What is container orchestration?


    In *Chapter 6*, you were introduced to Docker. You learned that Docker is a way
    of building and packaging software, allowing for easier distribution and execution.
    You also learned in the chapter about Jakarta EE and that it has introduced a
    specialized profile, the Core Profile, targeted at microservices and containerization.
    You are likely to have many containers running, and this is where container orchestration
    comes into play.


    Container orchestration is the process of creating, scheduling, scaling, and monitoring
    containers. The number of containers that are required to run an application can
    quickly grow, even a standard architecture with a frontend, backend, and database
    – that is already three containers. And then you have additional requirements,
    such as a caching instance, a reversed proxy, and a CDN (https://en.wikipedia.org/wiki/Content_delivery_network)
    server.


    Also, you might want to have more than one instance of each, in case of failure.
    As you can see, it is quickly growing. And if we throw microservices into the
    mix, where both the frontend and backend will be split into multiple services,
    the picture becomes clear.


    It is no longer realistic to handle all these containers by hand – monitoring
    their running state and restarting failing ones.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'This is where container orchestrators come in – they automate these tasks as
    much as possible. Note that Kubernetes is not the only container orchestrator,
    nor is it the first. Alternatives include Apache Mesos, HashiCorp’s Nomad, and
    Docker Swarm. However, Kubernetes has become the de facto standard for container
    orchestration in the last few years.


    # Why would you need Kubernetes?


    You might wonder at this point why you would need Kubernetes at all. However,
    even if your company is not the size of Google, or you are not running zillions
    of containers in your production environment, container orchestration via Kubernetes
    is something you are going to need.


    As it turns out, Kubernetes has some extremely useful features that make it appealing
    to even small companies. In the remainder of this chapter, we will discuss these
    features in more detail.


    # Self-healing


    One of the most useful functions of Kubernetes is the ability to heal itself.
    Should Kubernetes determine that a pod has crashed, then it will start a new pod
    to replace the failed one. That way, the cluster is brought back to the desired
    state again.


    Of course, there are some constraints to this process. One of them is that there
    should be enough resources available to be able to start a new pod. Resources
    can refer to (virtualized) machines, memory, CPU, and storage capacity.


    The self-healing capacity of Kubernetes comes into effect in two ways:


    +   - It starts a new pod if an existing one crashed

    +   - It kills a pod that is no longer processing user requests and is therefore
    no longer functional


    Kubernetes has several ways to determine whether a pod is still functional, based
    on callback methods into the pod (liveness and readiness probes).


    Another feature that shows the adaptive possibilities is the horizontal pod auto-scaling.
    If you think that this means that Kubernetes can scale the number of pods based
    on criteria, then you are right.


    Horizontal pod auto-scaling works like this – if the load on a pod increases,
    Kubernetes will start an extra pod to relieve pressure from the already running
    pods.


    If, at some point, the load on the pods decreases and we are still running more
    pods than originally configured, the auto-scaler will bring the number of pods
    down again. Of course, this is done carefully to prevent the remaining pods from
    becoming overloaded again.


    Note that this process is called **horizontal auto scaling** because we start
    more resources of the same type, pods. If Kubernetes were to assign more CPU time
    or more memory to already running pods, it would be vertical scaling.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'At fixed intervals, which currently default to 15 seconds (a value that is
    configurable), Kubernetes queries the resource utilization as specified in the
    auto-scaler resource definition.


    This resource utilization can be based on a per-pod metric, a custom metric, or
    even an object or external metric.


    # Load-balancing and networking


    Another area where Kubernetes shines is networking. Having to run many pods, each
    requiring its unique address, could easily mean that you have a lot of container
    ports to host port mappings.


    Fortunately, Kubernetes takes care of this for you by assigning every pod a unique
    cluster-wide IP address.


    This makes for instance service discovery a breeze; every pod can communicate
    with every other pod in the cluster. If a pod contains multiple containers, then
    all these containers share the same IP address. This means that each service can
    reach the other at the localhost address. It also means that each container in
    a node must have unique port numbers to avoid conflicts.


    Kubernetes supports two forms of service discovery. Service discovery is the act
    in which one service needs to find and access different services to perform its
    actions. This could be as simple as the application needing to know what the database
    URL is to set up a JDBC connection.


    Alternatively, it could be a situation where, for example, an Order Service needs
    to determine whether there is sufficient stock of a product for it to be placed
    in a shopping basket. Retrieving stock levels would be the responsibility of a
    different service – let’s say, the StockService. The OrderService would need to
    know where (i.e., at what IP address) it can find the StockService.


    The simplest mechanism that Kubernetes provides is via a set of environment variables
    that specify the hostname and port number for each service. In our example, the
    OrderService could simply look up these environment variables to determine the
    hostname and port number.


    Furthermore, Kubernetes also supports DNS. If you have a DNS server set up in
    your cluster, then it will watch the Kubernetes API for new and removed services.
    This allows pods in the same cluster to find services based on their name.


    Assume that we have a service that exposes a PostgreSQL database service and names
    it mydb. Other services can now reference this database service by this name instead
    of its IP and port combination. This gives tremendous flexibility and independence
    to your services.


    Load balancing is supported in Kubernetes via so-called Ingress services. Ingress
    uses HTTP and HTTPS to make your services accessible from outside the cluster.
    It makes sense that, at some point, some part of your application should be accessible
    to the outside world, the world beyond your cluster. If we continue the OrderService
    example from before, to be able to add a product to a shopping basket, a user/buyer
    must have access to a website, for instance. This is where the ingress comes in.
    It can translate the external URL to a service running inside your Kubernetes
    cluster.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Load balancing is part of the Ingress functionality. There may be many pods
    that run the OrderService. Now, if a request comes in to add a product to the
    shopping cart, which service should it pick? Load balancing will take care of
    this problem by applying a certain strategy to picking the desired pod.


    A few quite common strategies are as follows:


    +   - Round-robin is one simple approach in which groups of pods are used in conjunction.
    On each request, the next pod from the pool is picked, each getting its turn.

    +   - Another approach could be the fastest. In this scenario, the pod that is
    fastest in responding to requests is picked next.

    +   - Again, a different approach could be smallest, meaning a group is created
    with just enough pods to handle the current load.


    As you see, the possibilities are almost infinite, and so is the complexity. Often,
    the standard is good enough, and fine-tuning of load-balancers is only required
    once limits are reached.


    # Persistent storage and volumes


    Containers, and pods, are ephemeral by nature. They are very often short-lived,
    and once they terminate, the data stored inside the pod is lost forever. It suddenly
    might sound a lot less appealing to store your valuable data in a database container,
    does it not?


    The solution seems simple then – store your data outside of the container. This
    is exactly what Kubernetes allows you to do, and in doing so, it gives you an
    enormous amount of freedom and choices.


    Kubernetes uses an abstraction called **volumes** to store data. In essence, volumes
    are just directories on a disk in which you store your data. We know two kinds
    of volumes, **ephemeral** and **persistent**, and you can mix and match them within
    a pod. Ephemeral volumes get deleted once the pod terminates, while persistent
    volumes keep existing beyond the lifetime of a pod.


    Kubernetes supports many types of volumes, including some basic ones such as emptyPath,
    which is just a directory inside your pod that is empty when the pod starts. However,
    there are also several specific volumes, targeting the storage offerings of the
    major cloud providers. Kubernetes abstracts volumes away into a piece of configuration,
    which is called a **Persistent Volume (PV)**. It describes the technical details
    of a volume.


    Whenever a service requires some storage, it raises a **Persistent Volume Claim
    (PVC)**. A PVC contains the requirements that a volume must meet. Think of things
    such as available size, type of storage, speed, and so on.


    The role of Kubernetes in all of this is to find the appropriate PV to satisfy
    the PVCs. By abstracting things this way, a tight coupling between services and
    storage options is prevented.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'As an example, assume that your application is currently using a PV of type
    azureDisk. Now, if, for some reason, you were to abandon this and switch to the
    GCE offering of a gcePersistentDisk, what would you need to change?


    You would need to add a PV for the gcePersistentDisk, and you want to render the
    azureDisk PV unusable. However, on a restart of your application, it would state
    it needs a disk volume via an unmodified PVC, and Kubernetes would now attach
    the gcePersistentDisk Persistent Volume to your service. This is the power of
    abstraction that is found everywhere in Kubernetes, in pods, in volumes, and so
    on.


    # General


    The basic idea of Kubernetes is surprisingly simple – the desired situation of
    your cluster is declaratively described and stored (soll-state). Kubernetes then
    executes a continuous loop in which it verifies the actual state of your cluster
    (ist-state).


    If the actual state differs from the desired state, Kubernetes will take the appropriate
    actions against the actual state to make the two match again.


    # Pods versus containers


    Kubernetes uses an abstraction over a container, which is called a pod. This is
    the smallest unit inside Kubernetes. You deploy, start, restart, stop, and un-deploy
    pods. You will never do anything in a container directly.


    A pod can contain more than one container, the so-called multi-container pod.
    While this is a valid scenario, most Pods will contain only one container. Valid
    scenarios where you could have multiple containers in a pod would be a startup
    container, service meshes that use the sidecar pattern, and monitoring exporters.
    However, these are advanced concepts that go beyond the scope of this chapter.
    For more information, please visit: https://kubernetes.io/blog/2015/06/the-distributed-system-toolkit-patterns/


    # Some Kubernetes lingo


    Earlier, we mentioned the phrase “cluster” without explicitly defining what we
    mean. We think it is a good moment to do that now.


    We already said that a pod is the smallest deployment unit in Kubernetes and that
    one pod can contain a collection of containers.


    Let us define some more Kubernetes terms:


    +   - A pod is scheduled and executed on a node.

    +   - A node is a worker machine in Kubernetes. It can be a physical or a virtual
    device.

    +   - Worker nodes execute actual workloads.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   - Nodes are controlled by the control plane. The control plane is the controller
    orchestration layer that exposes an API and manages all resources in Kubernetes.

    +   - A group of nodes can be organized into a cluster.

    +   - A service is a set of related pods that has the same set of functions.


    # Extending Kubernetes


    Kubernetes offers an enormous amount of functionality out of the box, and its
    core is extended daily. Kubernetes has a large community of open source developers.


    However, sometimes, Kubernetes might not have the functionality that you, your
    team, or your company require. What do you do? Should you dive into the source
    code? Fork the Kubernetes repository and add what you need to its core.


    (Kubernetes is written in Golang, a programming language from Google. Unlike Java,
    Golang compiles to a native binary. A large number of open source projects that
    are part of the CNCF (**Cloud Native Computing Foundation**) (see https://landscape.cncf.io/
    for more details) use Golang – examples include Prometheus and InfluxDB. Uber
    is also known for writing much of its server code in Golang).


    These solutions are not very sustainable of course; no one in their right mind
    would do that. (Although, some projects have done exactly that and still maintain
    sanity; K3S from Rancher is such a project.)


    Kubernetes offers a very potent alternative, as you might have expected. We already
    mentioned that everything in Kubernetes is a resource and, as such, is described
    in a resource `.yaml` file. Pods, deployments, stateful sets, services, and PVs
    are all described in such YAML files. Kubernetes allows you to add your functionality
    to the core product in the form of Custom Resource Definitions. It is a contract
    that you need to implement, and then your resource will become a first-class citizen
    of Kubernetes.


    This ability to extend Kubernetes but still be able to work with the standard
    product is one of the standout features in terms of maintainability. Instead of
    tinkering around in the core of Kubernetes and thus diverting from the main development,
    you stay in the main package.


    # Kubernetes architecture


    The following is a diagram of the high configuration of Kubernetes. On the left,
    we can see the control plane, the part of Kubernetes that controls the scheduling,
    starting, and stopping of pods and services'
  merge: -1
  img_proc: true
