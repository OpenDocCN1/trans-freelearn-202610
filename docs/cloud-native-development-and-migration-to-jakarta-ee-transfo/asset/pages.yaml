- pgno: 180
  md: "```\n@GET\n@Path(\"/add\")\npublic Response addSpan() {\n    Span span = tracer.spanBuilder(\"\
    addSpan\")\n        .setSpanKind(SpanKind.INTERNAL)\n        .setParent(Context.current().with(this.span))\n\
    \        .setAttribute(\"identifier\", UUID.randomUUID().toString())\n       \
    \ .startSpan();\n    span.end();\n    return Response.ok().build();\n}\n```\n\n\
    Note that span.end() is needed when you're manually adding a span to the trace.\
    \ Not doing so will result in the span not being added to the trace.\n\n# Agent\
    \ instrumentation\n\nAgent instrumentation allows you to attach a Java agent to\
    \ your application by specifying a JAR file. By doing this, you can add tracing\
    \ support for several popular Java frameworks and libraries.\n\nA Java agent is\
    \ attached to a JVM with javaagent arguments, like the one shown here, but its\
    \ specification may vary depending on the server you use:\n\n```\n-javaagent:\
    \ opentelemetry-javaagent.jar\n```\n\n# Other specifications\n\nThere are several\
    \ other specifications that we will touch upon only briefly in this section. This\
    \ is meant to give you a quick introduction to their functionality.\n\n# OpenAPI\n\
    \nThis specification supplies a Java API for OpenAPI, a specification that allows\
    \ developers to expose their API documentation.\n\nIt holds no less than 46 annotations\
    \ that can be added to your code and allows you to completely describe your API,\
    \ resources, parameters, and return values.\n\nThe following example has been\
    \ taken from the official MicroProfile OpenAPI specification documentation:\n\n\
    ```\n@GET\n@Path(\"/{username}\")\n```"
