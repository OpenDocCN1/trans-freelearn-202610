  md: '# Java EE features used in the Cargo Tracker application


    Now that you have an idea of how the Cargo Tracker application works, it is time
    to look at the technologies involved in making it work. Java EE consists of multiple
    projects and technologies where each of the projects can leverage the functionalities
    of the other.


    The Cargo Tracker application uses a lot of Java EE functionality. In the next
    few sections, we will walk through those that are mostly used. We will briefly
    describe what the functionality is and how it is used with the Cargo Tracker application.


    Will be using the Java EE naming of these technologies. Jakarta EE has different
    names for these technologies. We will discuss the following Java EE 7 technologies:


    +   - Enterprise Java Beans

    +   - Java Persistence

    +   - Java Messaging System

    +   - Context and Dependency Injection

    +   - Java Server Faces

    +   - JAX-RS

    +   - JSON-B)

    +   - Java Batch


    Note that during the switch from Java EE to Jakarta EE, the names of many technologies
    had to be changed due to legal requirements. In *Appendix A*, you can find a list
    that compares the technologies by the original Java EE name and its new Jakarta
    EE name.


    # Enterprise Java Beans


    Enterprise Beans have been around since day one. In the old “days of J2EE, there
    were several different types of enterprise beans: **Session Beans (SB), Entity
    Beans (EB), and Message Driven Beans (MDB).**


    Session beans can be further subdivided into Stateful Session Beans, Stateless
    Session Beans, and Singleton Session Beans. While the former two have always been
    around, the latter was added in version 3.x of the specification.


    Stateful Session Beans maintain a conversational state with a client. This means
    that the client has a one-to-one connection with a specific bean and that this
    bean only serves that client for the duration of the conversation. For example,
    we can have `ShoppingCartSession` that connects with a Faces shopping cart.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Stateless Session Beans have no knowledge of what clients they had a conversation
    with during their life cycle. The application server typically pools them. Once
    a request for Stateless Session Beans arrives at this application, a bean is selected
    from the pool and the requested method is invoked on it. Stateless Beans provide
    the container with a great level of flexibility as it can increase or decrease
    the pool size as it seems fit.


    The final kind of session bean is the Singleton Session Bean. This one works just
    like a stateless session, but there is only ever one instance of this bean for
    the whole application. Singleton Session Beans are typically used for tasks such
    as upgrading the database or other batch-related tasks.


    Moving on to the next kind of Enterprise Beans, we have the Entity Beans. These
    beans were introduced in version 1.0 of the specification and came in two flavors:
    Bean Managed Persistence (BMP) and Container Managed Persistence (CMP). The former
    left it to the application developer to invoke persistence operations and perform
    transaction management, while the latter left it up to the EJB container to invoke
    the appropriate data retrieval/store and transaction control operations. These
    types of beans became very unpopular since all the operations and parameters needed
    to be specified in a special deployment descriptor file (ejb-jar.xml), leading
    to XML files that more frequently than not contained several hundreds of XML statements.
    They became so unpopular that in version 3 of the Enterprise Beans specification,
    they were dropped altogether in favor of Java Persistence.


    The final type of bean is the Message Driven Bean. This is a specialized form
    of bean that''s registered as a consumer of JMS (or Messaging) messages placed
    on a queue or topic. Once a message arrives on the queue or topic, this beans''
    callback method will be invoked to execute some business logic.


    # Persistence (JPA)


    As mentioned earlier, Java Persistence is the replacement for Entity Beans. JPA
    should be seen in the widest sense: creating, updating, retrieving, deleting,
    and querying. Objects that are to be persisted are annotated with the @Entity
    annotation. Moreover, relationships between entities can be modeled in code.


    JPA was heavily influenced by the ideas and concepts of Hibernate, a popular object-relational
    mapper. It tried to offer a workaround for the fact that, in code, we work with
    objects that can embed other objects while once persisting or retrieving data,
    we work with flat tables.


    JPA also offers possibilities for querying data via conventional SQL, an object-oriented
    query DSL, and object-based query definitions called the Criteria API.


    # Messaging (JMS)


    JMS is the concept by which disjoint systems can integrate through the exchange
    of messages. Messaging is certainly not something that was invented by Java EE.
    Even before the rise of Java, there were many implementations of this so-called
    message-oriented middleware (MoM). Examples include IBM MQ and Tibco Messaging
    Service. More recently, Apache Kafka attracted enormous'
  merge: -1
  img_proc: true
- pgno: 42
  md: "attention inside and outside of the Java community. JMS provided a specification\
    \ for a standard way of working for messaging.\n\nJMS supports two types of messaging:\
    \ **point-to-point (PTP)** and **publish and subscribe (pub-sub)**. PTP works\
    \ with queues, which is a place where the two clients involved in the messaging\
    \ process can exchange messages between one another. So, this is typically a one-to-one\
    \ connection. Pub-sub, on the other hand, works in such a way that one client\
    \ will post messages on a topic and an unbounded number of clients will show their\
    \ interest in receiving these messages by subscribing to this topic.\n\nOne of\
    \ the main advantages of asynchronous communication via messaging is that a system\
    \ is not influenced heavily by the unavailability of the intended receiving system.\
    \ To the sending system, the message still appears to be sent. It will sit idle\
    \ in the queue until the receiving system comes online to retrieve it. Compare\
    \ this to a situation in which a direct call is made into another system (for\
    \ instance, via REST) and this system would not be available. This might lead\
    \ to all kinds of problems due to the synchronous way of coupling the two systems.\
    \ Now, increase the number of connected systems and you will start to see why\
    \ messaging is such a brilliant solution.\n\n# ## Context and Dependency Injection\n\
    \nCDI is the Context and Dependency Injection API. It is obvious that over the\
    \ years, Java EE was heavily pressured and influenced by the Spring framework.\
    \ CDI is the best example of this as the Spring framework popularized **dependency\
    \ injection (DI)**. DI is the concept that an object should not instantiate itself\
    \ the objects it requires, but rather have these objects injected into it. DI\
    \ encourages you to have an **inversion of control (IoC)** for dependency injection,\
    \ and CDI builds upon that specification.\n\nNext to injecting objects in a class\
    \ at runtime, CDI also has the concept of producers. These are not the dependent\
    \ objects themselves but objects that know how to get the dependent object.\n\n\
    CDI is not just about injecting dependent objects, though – it also provides an\
    \ event mechanism. This allows one bean to fire an event while another bean has\
    \ registered itself as being interested in these events. So, once the event is\
    \ fired, a listener class can react to it. As an example, imagine a bean called\
    \ `CustomerRegistrationBean` that will fire a `CustomerCreatedEvent` event. The\
    \ `EmailBean` bean will listen for these events and upon receiving the `CustomerCreatedEvent`\
    \ event, it will send out a welcome email to the new customer.\n\nIt is good to\
    \ point out that CDI is not the only dependency injection mechanism available\
    \ in Jakarta EE. Since version 3.0, EJB has 0 supported annotations for dependency\
    \ injection:\n\n+   • @EJB\n+   \n+   • @Resource\n\n@EJB allows you to inject\
    \ other EJBs into an EJB, while @Resource allows you to inject program objects\
    \ that provide connections to other systems, such as a SQL DataSource or a Jakarta\
    \ Messaging MessageFactory."
  merge: -1
  img_proc: true
- pgno: 43
  md: "Other APIs might supply injection annotations. An example of this is the `@PersistenceUnit`\
    \ annotation from JPA, which will inject an `EntityManagerFactory` object.\n\n\
    # Java Service Faces (JSF)\n\nJSF is a server-side component-based user interface\
    \ framework. It is one of the techniques available for rendering user interfaces\
    \ in a browser. There have been many iterations for UI development in Java EE,\
    \ starting with basic servlets, where the HTML was written to an output stream.\
    \ Then, there was the addition of Java Server Pages (JSP), which allow for a separation\
    \ between business and presentation logic. Then, there came support for custom\
    \ tag libraries and a standard tag library set, Java Standard Tag Library (JSTL).\
    \ Finally, there was JSF.\n\nJSF follows the famous **model-view-control (MVC)**\
    \ pattern. It is a collection of UI widgets and controls. As it is a specification,\
    \ many competing implementations have arisen over time. Famous examples are IceFaces,\
    \ OpenFaces, and MyFaces.\n\nThe process works as follows: you have a web page\
    \ on which you add JSF custom tags, which represent UI elements. Each page has\
    \ one or more so-called backing beans. Backing beans are managed by the container\
    \ runtime and they serve to hold properties and methods for the UI elements. Furthermore,\
    \ they can hold event listeners.\n\nAs a simple example, have a look at the following\
    \ JSF, which has been taken from the Hello World example of the Jakarta EE tutorial:\n\
    \n```\n<html lang=\"en\"\n    <h:body>\n        <h:form>\n            <h:graphicImage\
    \ url=\"#{resource['images:duke.waving.gif']}\" alt=\"Duke waving his hand\"/>\n\
    \            <h2>Hello, my name is Duke. What's yours?</h2>\n            <h:inputText\
    \ id=\"username\"\n                title=\"My name is: \"\n                value=\"\
    #{hello.name}\"\n                required=\"true\"\n                requiredMessage=\"\
    Error: A name is required.\"\n                maxlength=\"25\" />\n          \
    \  <p></p>\n            <h:commandButton id=\"submit\" value=\"Submit\" action=\"\
    response\">\n            </h:commandButton>\n            <h:commandButton id=\"\
    reset\" value=\"Reset\" type=\"reset\">\n            </h:commandButton>\n    \
    \    </h:form>\n        ...\n    </h:body>\n</html>\n```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "Here, the `<h:inputText>` element defines a field for text entry, while `<h:commandButton>`\
    \ defines a button on which to click. All these elements are prefixed with h,\
    \ which is a shortcut for the JSF namespace.\n\nHere is the code for the backing\
    \ bean of the JSF page:\n\n```\n```java\n@Named\n@RequestScoped\npublic class\
    \ Hello {\n    private String name;\n    public Hello() {\n    }\n    public String\
    \ getName() {\n        return name;\n    }\n    public void setName(String user_name)\
    \ {\n        this.name = user_name;\n    }\n}\n```\n```\n\nThe `inputText` field\
    \ is connected to the name property of the backing bean with the `value=\"#{hello.name}\"\
    ` declaration, where hello is the name of the bean class, starting with lowercase,\
    \ and name matches the 'name' property in the backing bean.\n\nThe Cargo Tracker\
    \ application uses JSF for all UI elements. If you want to browse the source code\
    \ for the JSF pages, go to `src/main/webapp`.\n\n# JAX-RS\n\nFor a long time,\
    \ SOAP was king in the land of web services. Java supported SOAP via JAX-WS, the\
    \ Java API for XML web services. But at the beginning of the new century, a new\
    \ type of web service made its entry. Roy Fielding authored a dissertation on\
    \ this new concept and named it **Representation State Transfer**, or REST for\
    \ short.\n\nRESTful web services, those that follow the REST principles, are a\
    \ way to expose resources on a machine in such a way that they can be accessed\
    \ from other machines or services. Where SOAP web services impose strict rules\
    \ upon the developers, RESTful web services can be developed in many programming\
    \ languages. In contrast to SOAP, which only allows XML as its content, RESTful\
    \ services support a variety of data formats. It is important to understand that\
    \ REST uses the standard HTTP verbs (GET, POST, PUT, PATCH, DELETE, and HEAD)\
    \ to perform its operations.\n\nREST became extremely popular as it allowed an\
    \ organization to share its data and information with the outside world in a remarkably\
    \ simple, easy-to-understand way. In 2002 Jeff Bezos, the founder of Amazon, wrote\
    \ a memo in which he mandated that “_all teams should expose their data and functions\
    \ via service interfaces, that all teams must communicate with each other through\
    \ these service interfaces,_”"
  merge: -1
  img_proc: true
- pgno: 45
  md: '*and finally that there no other form of inter-communication will be allowed.*
    While Amazon was not the first large company to adapt REST, doing so in this rigorous
    way made way for its growth.


    The following diagram shows the staggering growth of public APIs since 2005:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_45_0.png)


    Figure 2.13 – The rise in the availability of public APIs


    Since those beginning days, the number of public APIs based on REST has steadily
    grown, so much in fact that it is safe to say that REST is now the most common
    type of web service.


    # JSON binding


    JSON binding is an API specification for the serialization of Java objects to
    JSON and vice versa. JSON is a simple format for representing data. It is often
    used instead of XML because it is less verbose. By default, it supports the default
    Java simple data types and their object counterparts. In addition to these, several
    date/time-related classes from the `java.util` package are supported and most
    classes from the `java.time` package. The (de-)serialization of many collection
    interfaces, such as `List`, `Map`, and `Set`, and their implementations in the
    `java.util` package is also supported out of the box.


    Binding a JSON payload from a RESTful call to its object counterpart is mostly
    done automatically by the Java EE REST API runtime. Likewise, converting the resulting
    object of a RESTful call into JSON is also handled automatically by the Java EE
    REST API runtime.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "Still, there might be situations where you would like to do these conversions\
    \ yourself in code – for instance, to have more control over the conversion project\
    \ by using any of the many conversion options.\n\nBy default, the mapping is done\
    \ based on matching a JSON property name to a Java instance variable name. The\
    \ JSON `firstname` property in the following JSON will be mapped on the Java `firstname`\
    \ instance variable in the Java Person class.\n\nThe process of (de-)serialization\
    \ can be influenced by adding annotations at the class level, instance variable\
    \ level, or instance method level. The JSON `familyname` property will be mapped\
    \ on the Java `name` instance variable as the `@JsonProperty(\"familyname\")`\
    \ annotation overrides the default mapping:\n\n```\n```json\n{\n  \"familyname\"\
    : \"Mc Nealy\",\n  \"firstname\": \"Scott\"\n}\n```\n\n```java\npublic class Person\
    \ {\n    @JsonProperty(\"familyname\")\n    private String name;\n    private\
    \ String firstname;\n}\n```\n```\n\nThe Cargo Tracker application does not use\
    \ annotation or automatic (de-)serialization. Instead, it uses programmatic conversion,\
    \ as can be seen in the `CargoMonitoringService` class in the `org.eclipse.cargotracker.interfaces.booking.rest`\
    \ package.\n\n# Transactions\n\nOne of the fundamental features of business data\
    \ is integrity. Should this be lost, any decision-making on this data becomes\
    \ walking on quicksand. Transactions help maintain data integrity.\n\nIt does\
    \ this in two ways; firstly, by controlling concurrent access to the data and\
    \ secondly, by restoring the data to its previous state in case of a system failure.\
    \ The outcome of a transaction can only ever be one of two possibilities: either\
    \ the operations performed concluded successfully and a commit is performed, or\
    \ some kind of error occurred, and a rollback is performed. A commit will persist\
    \ the outcome of the operation – for example, it will store the updated values\
    \ in the database. A rollback, however, will restore the system to the state it\
    \ was in before starting the transaction.\n\nJava EE supports two types of transaction\
    \ management: **Container Managed Transactions (CMTs)** and **Bean Managed Transactions\
    \ (BMTs)**. If nothing is specified on an EJB, CMTs are the default mechanism."
  merge: -1
  img_proc: true
- pgno: 47
  md: 'With CMTs, the EJB container takes full control of starting, committing, and
    rolling back transactions. By default, the container will add transaction management
    to every public method in an EJB. If you would like to exclude certain public
    methods from running inside transactions, you can do so by specifying TransactionAttribute
    on the method.


    In BMTs, the code in the EJB programmatically defines the boundaries of the transaction.
    This means that a transaction is started, committed, or rolled back in code. A
    transaction that''s started in a method call to a stateless session bean must
    always be completed when that method completes.


    The Cargo Tracker application uses CMTs with the @Transactional and @TransactionAttribute
    annotations to configure transaction management.


    # Batch


    The Java EE platform contains functionality to run batch jobs. These are jobs
    that can run without any user interaction required. Examples of batch jobs are
    end-of-month processing in financials, generating reports, or periodically checking
    the filesystem for new files that need to be processed.


    One thing each of these batch jobs has in common is that they consist of one or
    more steps that need to be executed. In Java EE, a batch job and its steps are
    described in an XML file. Each step is either a Chunk or a Task. Chunk steps can
    be executed in multiple threads simultaneously, while Tasks cannot.


    Several steps grouped together are called a flow. Once grouped, they are executed
    as a unit. Several flows that can be executed in parallel are called split.


    # Summary


    There is a lot of great technology inside the Cargo Tracker application. It is
    an application that was built to highlight that Java EE is a great framework for
    building applications. In this book, we are going to migrate the Cargo Tracker
    application to the even better Jakarta EE framework.


    The application is made to book new cargo and keep track of the booked cargo.
    The tracker view shows you the status of the cargo. The administrative interface
    shows the status and lets you book and route cargo.


    We also introduced some of the Java EE technologies used in the Cargo Tracker
    application and explained their usage.'
  merge: -1
  img_proc: true
