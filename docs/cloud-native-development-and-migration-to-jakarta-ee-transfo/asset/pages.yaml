- pgno: 14
  md: 'Chapter 3, Moving from Java EE to Jakarta EE, describes how to approach the
    migration from Java EE to Jakarta EE.


    Chapter 4, Modernizing Your Application with the Latest Features, provides an
    overview of the significant changes made to Jakarta EE 10. The chapter will also
    show you how to implement cloud-native features like resilience and monitoring.
    Lastly, we will show you how to visualize the metrics coming from your application.


    Chapter 5, Making Your Application Testable, provides an overview of why testing
    is important when migrating a software project and how to measure it. You will
    learn how to write unit tests and integration tests for modern applications to
    ensure the application keeps working as expected.


    Chapter 6, Introduction to Containers and Docker, provides an overview of what
    containers are and why they are an important tool. You will learn what Docker
    is, how to install it, and how to create a Docker container based on the Cargo
    tracker application.


    Chapter 7, Meet Kubernetes, introduces you to Kubernetes, the de facto standard
    for running containers.


    Chapter 8, What is Cloud Native?, describes the principles of cloud-native computing.


    Chapter 9, Deploying Jakarta EE Applications in the Cloud, provides an overview
    of deploying an application to the Azure cloud. You will learn how to create a
    container registry and how to create an instance from a container in the registry.
    This chapter also covers how you can see the metrics of the deployed instance.


    Chapter 10, Introducing MicroProfile, introduces the most important specifications
    of the MicroProfile specification.


    Appendix A, Java EE to Jakarta EE names, is a list of Java EE to Jakarta EE specifications.


    Appendix B, As a Service, explains the different concepts of using the Internet
    for computing.


    # To get the most out of this book


    For optimal learning, it is essential to have prior experience in developing Java
    applications using an enterprise framework like Java EE, Jakarta EE, or Spring.


    | Software/hardware covered in the book | Operating system requirements |

    |---|---|

    | Azure Cloud | Windows, macOS, or Linux |

    | Java 17 | |

    | Java EE 7 | |

    | Jakarta EE 10 | |'
  merge: -1
