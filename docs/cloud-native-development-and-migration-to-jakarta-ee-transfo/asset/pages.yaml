    # Summary


    In this chapter, you learned what Docker is and how you can use it for the Cargo
    Tracker application. You learned that a container is an executable package of
    your software that contains an application, dependencies, and the system tools
    your application needs to run. After that, we investigated what Docker is and
    how it uses containers. With this knowledge, you specified your first Dockerfile
    for the Cargo Tracker application. Using the Docker command-line interface, you
    have learned how to build your container and start it. You also explored other
    ways of starting the container using detached mode and how to stop a container.
    Finally, you learned how to create a Docker Compose file and how to start it.


    These steps are very important for when we run the Cargo Tracker application in
    the cloud in the following chapters.'
