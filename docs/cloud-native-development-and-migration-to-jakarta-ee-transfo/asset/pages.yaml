- pgno: 162
  md: 'FQDN is one of these typical abbreviations that you will find a lot in cloud
    computing. It pinpoints the exact location within the **Domain Name System (DNS)**
    by specifying the hostname, domain name, and top-level domain name. The top-level
    domain name for www.packt.com is .com, for example.


    # Metrics of containers in the cloud


    One of the benefits of working in a cloud environment is that it comes with many
    functionalities out of the box. Next to automated backup and scaling, monitoring
    is another one.


    In this section, we will briefly touch upon the monitoring capabilities that come
    standard with a cloud environment. The functionality shown here is specific to
    Microsoft Azure, but other cloud environments offer a similar functionality.


    Once the container instance has been started, you have the option to look at its
    metrics.


    To do so, select the **Metrics** option under the **Monitoring** heading on the
    menu bar at the left. You should then see a screen like this:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_162_0.png)


    Figure 9.17 – Overview of container metrics


    This view shows the basic metrics for an application—its CPU usage, the amount
    of memory used, and the number of bytes sent and received over the network. These
    metrics are always available, and rightfully so, because they are the primary
    indicators of how much load your application is experiencing. As such, they are
    the ones on which you may decide to scale your application, either manually or—more
    likely—automatically.


    One of the interesting options is that if you hover over a metric, the timelines
    in all the other metrics change as well. If, for instance, you move your mouse
    to a spike in the **CPU** metric window,'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'the Memory metric window will move to the same moment in time. This is extremely
    useful in comparing different metrics at a moment of some occurrence in the system:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_163_0.png)


    Figure 9.18 – Overview of container instance metrics


    When you click on a metric, you get a detailed view, and you are also able to
    switch between the different types of charts that are available:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_163_1.png)


    Figure 9.19 – Detailed view of a metric with the option to switch chart type'
  merge: -1
