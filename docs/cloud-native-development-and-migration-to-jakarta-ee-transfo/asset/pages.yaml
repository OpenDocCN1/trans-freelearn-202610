- pgno: 164
  md: 'In the same menu where you can change the chart type, you also have the ability
    to set up an alert. Alerting allows for a certain action to be taken in case some
    predefined threshold on a metric is exceeded.


    Here, we show the screen that is shown when you create a new alert:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_164_0.png)


    Figure 9.20 – Setting up an alert


    We selected a CPU-based alert, stating that the alert should fire if the average
    CPU usage exceeds 85. We also stated that we want this alert to be checked every
    5 minutes and that it also should look at the last 5 minutes to determine the
    value. Normally, you would want this period to be a bit longer to get a responsible
    idea about the application load and to prevent alert firing due to an incidental
    spike.


    Having a number of these metrics on a dedicated dashboard for a container instance
    can be very useful, and luckily, we have the option to do so. Via the Save to
    dashboard option, you can add your favorite metrics to your personal or shared
    dashboard.


    # Summary


    In this chapter, we moved our application to a cloud platform. We chose Microsoft
    Azure, but it could have been any cloud provider. We showed how to set up a container
    registry, how to do the actual deployment, and how to look at metrics for a running
    container instance.


    You have now moved your existing monolithic application to the cloud. You have
    enhanced it with cloud-native features, such as resilience. You have come a long
    way, and maybe this is where you intend to stop. Or, you may choose to go down
    the path of breaking up the monolith into individual applications or microservices.
    There is no good or bad here, and the choice of what to do depends entirely upon
    the application and its intended use. In the next chapter, we will look at MicroProfile
    as it can help add more cloud nativeness to your application.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# ## 10


    # # Introducing MicroProfile


    At this point, you should have a good idea of how you can move your application
    to the cloud. Even though your application is now running in the cloud, it does
    not mean that it displays. To achieve that, some extra steps need to happen. These
    extra steps can be made by utilizing MicroProfile.


    In this chapter, we''re going to cover the following topics:


    +   - A brief history of MicroProfile

    +   - What a MicroProfile consists of

    +   - Looking at the core APIs in MicroProfile


    By completing this chapter, you will have a thorough understanding of what cloud-native
    behavior is and how MicroProfile can help you add this kind of behavior to your
    applications.


    # ## Technical requirements


    MicroProfile consists of several APIs for various tasks. All you need to do to
    leverage this functionality is to choose a MicroProfile implementation and add
    dependencies. This involves adding dependencies to your pom.xml or build.gradle
    file. An example of this can be found in Chapter 4.


    Note that there a multiple implementations of MicroProfile available. Some of
    these are integrated into a full Jakarta EE offering, while others can be used
    standalone. For a complete list of these implementations, we refer you to the
    MicroProfile website https://microprofile.io/.


    # ## A brief history of MicroProfile


    In 2010, Java EE was having a challenging time. New releases took an exceptionally
    long time to be created. It took 40 months to get from Java EE 6 to Java EE 7.
    And Java EE 7 to EE 8 took a whopping 43 months. At the same time, the internet
    was a fast-moving place and the cloud offered new opportunities and challenges.
    Microservices were becoming the latest architecture craze, and Java EE did not
    offer a default adoption.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Java EE Application Server vendors felt the need to offer additional features
    to the developers of their platforms. Unfortunately, everyone did it in their
    own way. It seems like a paradox that the platform meant to offer a unified API
    was now causing multiple competing and incompatible implementations to be developed.
    Each had a unique API that was different from the others.


    This mismatch was recognized by multiple vendors, and as the speed of the Java
    EE specification process could not be improved, they decided to create a new project
    under the Eclipse umbrella that would supply a specification a bring those required
    cloud-native functions that Java EE was lacking. This resulted in the birth of
    MicroProfile.


    Talks began in September 2016, and by August 2017, the first release became available.
    MicroProfile consisted only of JAX-RS, JSON-P, and CDI. These were all existing
    Java EE APIs.


    Soon after, Config was added, and in the next release, version 1.2, JWT, Fault
    Tolerance, Metrics, and Health Check were added. This release was released in
    January 2018, showing the swift release cycles. More and more features were added
    to MicroProfile, while some became optional. This meant that an implementor was
    not required to implement these and could still be certified as an implementation.


    At the time of writing this book, MicroProfile 6.0 is the current release. The
    following is a chart showing all the features it has:


    ![](img/8948f94d0abcdb1ae94d6778da518d16_166_0.png)


    Something new regarding this release is that it no longer mentions the individual
    Jakarta EE APIs – it now relies on the Jakarta EE Core Profile.


    In the following sections, we will cover the following topics in detail:


    +   - Config

    +   - Health

    +   - Fault Tolerance'
  merge: -1
  img_proc: true
