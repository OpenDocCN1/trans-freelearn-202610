- pgno: 55
  md: "# Sed\n\nSed is a standard tool on Linux and macOS operating systems. This\
    \ streaming editor is not available on the Windows platform, however. If you are\
    \ working with a Windows operating system, you are advised to use one of the other\
    \ two conversion options.\n\nThe following code is the source code for a small\
    \ Bash script that will automatically replace all the occurrences of the usage\
    \ of the Java EE namespace with the Jakarta EE namespace. It is driven by a text\
    \ file with a comma-separated list of old and new namespaces. It then tells sed\
    \ to recursively traverse the directory tree, starting at the current directory,\
    \ and perform the substitution on every file with a Java extension:\n\n```\n#!/bin/bash\n\
    input=\"./jee-jakartaee.txt\"\nwhile IFS= read -r line\ndo\n  IFS=',' read -r\
    \ -a array <<< \"$line\"\n  sed -i -e \"s/${array[0]}/${array[1]}/g\" $(find ./\
    \ -name *.java)\ndone < \"$input\"\n```\n\nThere are two things to keep in mind.\
    \ Firstly, it is best to place this script in the root of the cargotracker directory.\
    \ Secondly, the jee-jakartaee.txt input file needs to be in the same directory.\
    \ Both can be downloaded from the GitHub project accompanying this book – more\
    \ precisely, here: https://github.com/PacktPublishing/Cloud-Native-Development-and-Migration-to-Jakarta-EE.\n\
    \n# Using a specialized plugin for your IDE\n\nSo far, you have been shown two\
    \ options for migrating your sources. We will now show a third one – one that\
    \ is available from an IDE. In this situation, we are talking about IntelliJ Ultimate\
    \ Edition. Refactoring is a common functionality in modern IDEs and IntelliJ is\
    \ no exception. In fact, this migration option lets you trigger very specifically\
    \ what you want to convert and what not. And even more conveniently, it has a\
    \ Java EE to Jakarta EE migration predefined.\n\nYou need to have your project\
    \ imported and opened in IntelliJ. Then, perform the following steps:\n\n+   1.\
    \ Select the Refactor menu option.\n+   2. From the dropdown, select Migrate Packages\
    \ and Classes.\n+   3. Select Java EE to Jakarta EE.\n\nThe following dialog appears:"
  merge: -1
  img_proc: true
