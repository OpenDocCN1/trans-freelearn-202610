- pgno: 145
  md: 'From there on, bringing the application into a running state as well as monitoring
    the application once it runs is in their hands.


    This factor suggests that DevOps is quintessential to running your cloud-native
    applications. Development and operations should have a shared responsibility for
    both the deployment and the runtime inspection of the application. This will not
    only lead to a quicker delivery but will also increase the responsibility for
    the application, as felt by those who are part of the team.


    # Resources


    A developer machine might look very different from the actual production environment,
    not only because of the operating system but also because of the difference in
    external resources. Locally, the developer could use a different database engine,
    have a different messaging server, and so on. They could use a different **database
    management system (DBMS)**, perhaps running a free version on this local machine
    while a paid version is running in production.


    If resources used in development are not the same as in the actual production
    environment, it is feasible that incompatibilities could start to creep in. As
    such, it is apparent that development and production environments should be similar.


    # Logs


    *Treat logs as event streams.*


    Logs can come from a number of sources, and not just your application. They are
    typically time-ordered streams of the output of all running processes and backing
    services.


    Your application should never worry about routing logs or where to store them.
    Instead, your application should just stream its log output to stdout.


    During development, the developer can easily view the log stream in their console.


    During staging and production, each process stream will be captured by the execution
    environment and routed to one or more final destinations. These final destinations
    are typically log collectors that will store the information in some form or structure
    that makes the data easy to retrieve and view in specialized logging tools, such
    as Splunk or Kibana.


    # Admin processes


    *Run admin/management tasks as one-off processes.*


    Administrative tasks can be a number of things, such as—for instance—database
    maintenance tasks, some cleanup process that needs to be run on a regular basis,
    or, in general, cron jobs.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'So, in general, scheduled tasks are considered a bad idea. Now, here is where
    we might have a different opinion. Java offers a lot of support for timed jobs,
    such as EJBTimerBean or ScheduledExecutor timers. There is no reason to disallow
    the usage of these kinds of timers.


    And there you have it! We have discussed each of the 12 factors for cloud-native
    applications. It might be a lot to take in, and you might think that your application
    is still far from achieving some or all of these goals. But the only way to change
    that is to start planning, coding, and deploying. If needed, take one step at
    a time; if possible, take more.


    # How to start the transformation


    If you are coming from a monolithic architecture, breaking it down might be a
    huge undertaking. It is not an easy and certainly not a quick process. As an example,
    Uber, the company that offers rides at a fixed price, came from a monolithic architecture.
    The monolith was written in Python and had a single PostgreSQL database. That
    was back in 2014. It has since transformed into a microservices architecture spanning
    more than 4,500 individual services. This shows that transforming your application
    landscape is not an easy feat.


    To begin, you should determine the boundaries of services within your monolith
    to be able to extract them. Thinking in terms of a traditional enterprise resource
    planning (ERP) system, you could think of sales, purchasing, order fulfillment,
    and so on.


    Identify which of these services you would want to extract from the monolith and
    how they would interact with the monolith once extracted. Interacting could be
    within the request/response model or asynchronous, via messaging.


    You could choose to first pick services that change most often or those that currently
    cause the most problems. Another choice could be to select those services that
    have a problematic scaling tendency. The Strangler pattern is a very well-known
    pattern for achieving this. By carefully and systematically extracting each identified
    from the monolith, in the end, it will become an empty shell that can be discarded.


    Some companies might find that their monolith is just too large to refactor in
    such a way. Then, the Lego approach can be applied, in which only new features
    are built in microservices. This will create a hybrid structure in which the monolith
    and microservices continue to operate side by side. While this will not solve
    the current problems with the monolith, it does provide a way to further expand
    the application in the future.'
  merge: -1
  img_proc: true
