    # Authenticating with OpenID


    How do you handle the authentication of your users in your application? The most
    common way is to provide a dedicated login with a username and password. Once
    entered, your application will then try to authenticate your users against the
    information available in your local database or LDAP.


    However, users do not always want to create new accounts for every new site they
    want to visit. This is where OpenID comes in. Imagine that you have a Google account.
    When visiting site A, you specify that you want to log in with your Google credentials.
    Site A has no knowledge or ability to verify your Google credentials by itself.
    So, it relays the authentication to google.com. Once Google has established that
    you claim who you say you are, this information is returned to site A.


    As authenticating with OpenID becomes more and more common, Jakarta Security now
    supports OpenID via a set of annotations. Let’s have a look at an example:


    ```

    @OpenIdAuthenticationDefinition(

    providerURI = "https://accounts.google.com",

    clientId = "${config.clientId}",

    clientSecret = "${config.clientSecret}",

    redirectURI = "${baseURL}/callback",

    )

    @ApplicationScoped

    public class GoogleOpenIdSecurityBean {

    }

    ```


    @OpenIdAuthenticationDefinition takes several configurable parameters. providerUri
    points to the OpenId provider – that is, the participant that does the actual
    authentication. clientId and clientSecret inform the provider who it is authenticating
    for. Finally, redirectUri contains the callback endpoint for the provider to return
    to your applications after the authentication has been completed.


    # Improved concurrency


    Jakarta concurrency had a large number of changes in version 10. Two of the most
    notable are the introduction of the @Asynchronous annotation and the ability to
    configure ManagedExecutorService.


    While this annotation is available via the Jakarta Enterprise Beans specification,
    the new annotation has several clear advantages. First off, EJB requires the full
    Jakarta EE profile to work – this is not available in the Core Profile, for instance.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "Secondly, the old annotation uses the default thread pool from the application\
    \ server, while the new version allows you to specify which thread pool to use\
    \ if you don’t want to use the default thread pool. This can be of enormous benefit\
    \ as it allows you to use dedicated thread pools for certain groups of tasks.\n\
    \nHere is an example:\n\n```\n```java\npublic class PaymentService {\n    @Asynchronous(executor\
    \ = \"java:app/concurrent/OrderExecutorService\")\n    public CompletableFuture<OrderStatus>\
    \ processOrder\n        (final Order order) {\n        try {\n            var\
    \ status = processAvailability(order);\n            return CompletableFuture.completedFuture(status);\n\
    \        } catch (OrderProcessingException ex) {\n            throw new CompletionException(ex);\n\
    \        }\n    }\n}\n```\n```\n\nWe simply annotate the method with @Synchronous\
    \ and optionally specify which executor service is to be used.\n\n# Adding the\
    \ first cloud-native feature – resilience\n\nAdding resilience to your system\
    \ is not very challenging from a technical point of view. The real challenge lies\
    \ in deciding where to add resilience to your code and what type of resilience\
    \ to add. To add resilience to our code, we will use MicroProfile as it complements\
    \ a Jakarta EE application very nicely.\n\nYou can add MicroProfile by adding\
    \ the following entry to your pom.xml file:\n\n```\n```xml\n<dependency>\n   \
    \ <groupId>org.eclipse.microprofile</groupId>\n    <artifactId>microprofile</artifactId>\n\
    \    <version>5.0</version>\n    <type>pom</type>\n    <scope>provided</scope>\n\
    </dependency>\n```\n```\n\nBy adding this xml to your pom.xml file, you can start\
    \ using MicroProfile in your application.\n\nNext, perform the standard steps\
    \ for building and starting your application. They should not be a surprise to\
    \ you anymore.\n\nFor the CargoTracker application, you need to run the following\
    \ commands:\n\n+   - `mvn clean install`\n+   - `mvn cargo:run`"
  merge: -1
  img_proc: true
- pgno: 76
  md: 'With MicroProfile available inside your application, we can use the following
    options to add resilience to our application:


    +   - `@Timeout`

    +   - `@Retry`

    +   - `@Fallback`

    +   - `@Bulkhead`

    +   - `@CircuitBreaker`

    +   - `@Asynchronous`


    As mentioned previously, @Asynchronous is a special case, so it will not be handled
    here. We will provide examples of the other resilience methods here.


    @Timeout is a resilience method that we would want to add to some call to an operation
    or another system that is in danger of taking a long time. To prevent the system
    from becoming unresponsive, we can limit how long we want the operation to run
    before it is cut off.


    An ideal location in our code to use the @Timeout option is the graph traversal
    code. It is located in the ExternalRoutingService class. There, the fetchRoutesForSpecification
    method performs a web client call to retrieve route specifications.


    Technically, it might be possible that the external system is slow to respond,
    or worse, unavailable.


    To limit the impact this will have on our system, we can add the @Timeout annotation.
    The code will now look this:


    ```

    ```java

    @Timeout(value = 2000)

    public List<Itinerary> fetchRoutesForSpecification(RouteSpecification

    routeSpecification) {

    ```

    ```


    If the call to the external system fails, it will fail early now thanks to the
    annotation you’ve added. But if it fails, would you not like to retry again? After
    all, it might just be a simple network failure that has caused this. It might
    be a recoverable error.


    To support a retry, will need to add the following code. It will make us wait
    250 milliseconds between retries and it will only retry twice as opposed to the
    default value of 3:


    ```

    ```java

    @Timeout(value = 2000)

    @Retry(maxRetries = 2, delay = 250)

    public List<Itinerary> fetchRoutesForSpecification(RouteSpecification

    routeSpecification) {

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: "Cargo Tracker offers the functionality to change a destination. This will be\
    \ done from the `changeDestination` screen. The `.xhtml` file is backed by a `@Named`\
    \ backing bean called `ChangeDestination`. It offers users a dropdown to select\
    \ the name of the new location. This dropdown is backed by a list of locations\
    \ called `potentialDestinations`. This list is loaded during the bean’s initialization.\
    \ It retrieves the locations via `listShippingLocations` of `BookingServiceFacade`.\
    \ This method does the actual loading by querying the database.\n\nPhew – that\
    \ was quite a trip! It has shown us how quickly things can become complicated,\
    \ especially with an application such as Cargo Tracker, which was set up with\
    \ **domain-driven design (DDD)** in mind and where there is a clear distinction\
    \ between the different architectural layers of the application.\n\nAnyway, if\
    \ for some reason (yes, network, we are looking at you!) the required values cannot\
    \ be retrieved, it would be nice to provide a default response. Let’s be honest\
    \ – an empty list with locations is still better than reporting some strange error\
    \ to the user.\n\nWe will annotate `listShippingLocations` with a default response\
    \ via `@Fallback`.\n\nHave a look at the following code:\n\n```\n```java\n@Override\n\
    @Fallback(fallbackMethod = \"shippingLocationsFallback\")\npublic List<org.eclipse.cargotracker.interfaces.booking.facade.dto.\n\
    Location> listShippingLocations() {\n```\n```\n\nNote that any situation that\
    \ makes `listShippingLocation` throw an exception will trigger the fallback method.\
    \ You can configure this behavior with the `applyOn` and `skipOn` parameters.\n\
    \nNext, we need to provide an implementation for the method that is specified\
    \ in the `fallbackMethod` parameter.\n\nIt will look like this:\n\n```\n```java\n\
    private List<org.eclipse.cargotracker.interfaces.booking.facade.dto.\nLocation>\
    \ listShippingLocationsFallback() {\n    return List.of();\n}\n```\n```\n\nNote\
    \ that the fallback method can be private, and in most situations, it should be\
    \ private to prevent any other class from having unwanted access to this method.\n\
    \nWe simply return an empty list here because we have no reasonable alternative\
    \ values.\n\n# Adding the second cloud-native feature – monitoring\n\nSo, we have\
    \ made our application more robust than it was by adding some resilience features.\
    \ Next, we will go a step further and add monitoring functionality to our application."
  merge: -1
  img_proc: true
- pgno: 78
  md: 'The idea behind monitoring is two-fold.


    First, it should supply you with information that your system is running as expected.
    Any errors, exceptions, network failures, database hiccups, and more should be
    identified, registered, and reported.


    Secondly, monitoring should provide you with information about the usage of the
    system. How many new users do we have, how many orders are there in the system,
    how often does a certain REST endpoint access, and how often is a critical business
    method invoked?


    The monitoring process consists of several steps:


    +   1. Add annotations to your code that will actively monitor the metrics.

    +   2. Expose the metrics data for harvesting.

    +   3. Harvest the data.

    +   4. Generate alerts and create visualized data.


    In this section, we will discuss the first step and identify what we want to monitor
    and how to make the required code changes.


    # Looking at the default metrics of a running system


    Out of the box, MicroProfile Metrics already gathers a lot of information when
    it comes to the state of your application. It defines three categories of information:


    +   1. System metrics.

    +   2. Application metrics.

    +   3. Vendor-specific metrics.


    Let’s take a look at these metrics. We will use the Cargo Tracker application
    for this. Navigate to http://localhost:8080/metrics; you will see a list of all
    default metrics. Here is a part of the output:


    ```

    # TYPE base_cpu_availableProcessors gauge

    base_cpu_availableProcessors 10

    # TYPE base_cpu_systemLoadAverage gauge

    base_cpu_systemLoadAverage 5.9248046875

    # TYPE base_gc_total_total counter

    base_gc_total_total{name="G1 Young Generation"} 54

    base_gc_total_total{name="G1 Old Generation"} 0

    # TYPE base_jvm_uptime_seconds gauge

    base_jvm_uptime_seconds 56.064

    # TYPE base_memory_committedHeap_bytes gauge

    base_memory_committedHeap_bytes 2.87309824E8

    # TYPE base_memory_committedNonHeap_bytes gauge

    ```'
