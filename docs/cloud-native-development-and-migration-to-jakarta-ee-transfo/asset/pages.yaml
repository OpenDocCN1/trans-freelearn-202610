    # Migrating strategies


    Out of all of this, the most painful part from an application developer’s point
    of view is that the namespaces have changed. This means that migrating to Jakarta
    involves refactoring all the Java EE import statements in your code base. To a
    lesser degree, changes need to be made to the POM files of your project as well.


    In this section, we will look at three approaches to migrating your projects.
    We will do so using the following:


    +   - An open source multiplatform editor

    +   - The Sed command line tool

    +   - A specialized plugin for your IDE


    But before doing so, it is perhaps best to first create a new branch in Git that
    will contain our updated source code.


    Enter the following command inside the cargotracker directory:


    ```

    git checkout -b jakarta-ee9

    ```


    Git will respond with the message Switched to a new branch ''jakarta-ee9.


    If you would like to push this new local branch to your remote server immediately,
    you can do so by entering the following command:


    ```

    git push -u origin jakarta-ee9:jakarta-ee9

    ```


    You might prefer to make the necessary changes first before committing and pushing.
    In those circumstances, you skip pushing the new branch to the remote server right
    now.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Using an open source multiplatform editor


    This conversion option will run on any of the major operating systems. We are
    using the open source editor Sublime Text, which can be downloaded from `https://www.sublimetext.com/`.


    The editor has a **Find in Files** option, which recursively searches a directory
    tree for a certain text in a specified group of files.


    Start the editor, select **Find in files…** from the **Find** drop-down menu,
    and either perform the following steps or enter the information shown in *Figure
    3.1*:


    +   1.  In the **Find** text field enter `javax.activation`.

    +   2.  Press the button labeled … located between Find and Replace.

    +   3.  Select **Add Folder**.

    +   4.  Choose your cargo tracker root directory from the selection dialog.

    +   5.  Press the button labeled ... again

    +   6.  Select **Add Include Filter**.

    +   7.  A text labeled `*.txt` will be inserted into the **Where** text field.

    +   8.  Change `*.txt` to `*.java`.

    +   9.  In the **Replace** text field, enter `jakarta.activation`.


    ![](img/8948f94d0abcdb1ae94d6778da518d16_54_0.png)


    If you press the **Find** button now, the editor will open a document listing
    all the occurrences of `javax.activation`. It has been found in 10 locations in
    9 different files.


    Opening the **Find in Files** dialog again and pressing the **Replace** button
    this time will first ask you whether you want to replace the 10 occurrences in
    the 9 files. Pressing **Yes** will apply the changes.


    While this change is easy, it requires you to enter the values for each row in
    *Table 3.1*, and do so for every project that you want to migrate. If you are
    running on Linux or macOS, the next option will be more appealing to you.


    Note that this option of migration is available from within your favorite IDE.'
  merge: -1
