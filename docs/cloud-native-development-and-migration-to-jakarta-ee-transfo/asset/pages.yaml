- pgno: 169
  md: "So, when using `java -jar myapp.jar -Dmp.config.profile=testing`, it will first\
    \ load the settings from `META-INF/microprofile-config.properties` and then from\
    \ `META-INF/microprofile-config-testing.properties`. When a property is defined\
    \ in both files, the latter will override the former.\n\n# MicroProfile Health\n\
    \nHealth is a wonderful thing – not just for us humans, but also for our microservices.\
    \ Once you have deployed your microservices, you want to check their temperature\
    \ occasionally. Enter the Microprofile Health specification, which allows you\
    \ to validate the health of your services at regular intervals.\n\nIt should be\
    \ noted that, although this specification exposes an API, it is not meant for\
    \ human consumption, but more for machine-to-machine. Think of a container management\
    \ system such as Kubernetes that wants to inquire about the status of certain\
    \ pods to determine if they are still functioning as expected.\n\nThree sorts\
    \ of health checks can be performed, as described in the following table:\n\n\
    | Type | Annotation | Usage |\n|---|---|---|\n| Readiness | `@Readiness` | Determines\
    \ if the application is ready to process requests |\n| Liveness | `@Liveness`\
    \ | Determines if the application is running |\n| Startup | `@Startup` | Determines\
    \ if the application is still starting up |\n\nTable 11.1 – Health check annotations\n\
    \nFor a valid health check, your bean needs to implement the `HealthCheck` interface.\
    \ This functional interface consists of the `call` method, which returns a `HealthCheckResponse`\
    \ object.\n\n`HealthCheckResponse` needs to return if a service is either *up*\
    \ or *down*. It can also supply additional information, such as a name. Furthermore,\
    \ it can hold more details on failing resources. This can be specified via the\
    \ `withData` method.\n\nHere is an example of a HealthCheck service:\n\n```\n\
    @ApplicationScoped\n@Readiness\n@Liveness\n@Startup\npublic class HealthService\
    \ implements HealthCheck {\n    @Override\n    public HealthCheckResponse call()\
    \ {\n        return HealthCheckResponse.named(\"Project\")\n            .up()\n\
    \            .withData(\"redis\", \"Not available\")\n```"
  merge: -1
  img_proc: true
- pgno: 170
  md: "```\n.withData(\"postgres\", \"Available\")\n.build();\n}\n}\n```\n\nThere\
    \ are several interesting features here:\n\n+   1. The bean is @ApplicationScoped\
    \ as you will typically only need one bean of this type for your application.\n\
    +   2. The bean implements the HealthCheck interface.\n+   3. In the example,\
    \ this bean takes care of Readiness, Liveness, and Startup. You could of course\
    \ define three different beans each taking care of only one task.\n+   4. The\
    \ up() method signals that the service is working as expected. To signal a failing\
    \ service, you would use the down() method instead.\n+   5. The withData method\
    \ supplies more information. There can be an unlimited number of these methods.\n\
    +   6. In the end, a HealthCheckResponse object is returned.\n\nMicroProfile Health\
    \ exposed an endpoint at http://www.acme.com::9080/health.\n\nHere is an example\
    \ of the preceding health service:\n\n```\n{\n  \"checks\": [\n    {\n      \"\
    data\": {\n        \"redis\": \"Available\",\n        \"postgres\": \"Available\"\
    \n      },\n      \"name\": \"Project\",\n      \"status\": \"UP\"\n    }\n  ],\n\
    \  \"status\": \"UP\"\n}\n```\n\nHere, we asked the health endpoint for the status\
    \ of the microservice and it replied by stating it was \"UP\". We can also see\
    \ that additional information was sent in the data element. Both databases that\
    \ were used are online. Should any system this service relies on not be available,\
    \ it could be added here. This can be very useful in quickly identifying and resolving\
    \ issues."
