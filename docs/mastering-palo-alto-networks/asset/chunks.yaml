    \n![](Images/B31589_01_02.png)\n\nFigure 1.2: Phases of packet processing\n\n\
    Let's look at the process workflow for initial packet processing:\n\n1. When a\
    \ packet is first received, a source zone lookup is performed. If the source zone\
    \ has a protection profile associated with it, the packet is evaluated against\
