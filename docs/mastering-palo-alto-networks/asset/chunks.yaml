    \ create custom ones later.\n\n存在多种类型的安全配置文件，例如 Antivirus、Vulnerability Protection、URL\
    \ Filtering 和 Anti-Spyware（我们将在以下各节中介绍所有这些不同的配置文件）。在开始构建稳固的安全规则库之前，您需要为每种类型创建至少一个自定义安全配置文件，以便在所有安全规则中使用。存在预配置的配置文件，但它们设置为只读，这意味着如果您开始在安全规则中使用它们，后续如果创建自定义配置文件，则需要逐一替换它们。\n\
    \n### Pro Tip\n\n### 专业提示\n\nAs a best practice, add security profiles to all\
    \ of the rules, including drop rules. On drop rules, security profiles do not\
    \ consume any resources but they will help form a habit of adding profiles to\
    \ all rules, and if the rule ever changes to `Allow`, the profiles will already\
    \ be assigned.\n\n作为最佳实践，将安全配置文件添加到所有规则中，包括 drop 规则。在 drop 规则上，安全配置文件不会消耗任何资源，但它们有助于养成向所有规则添加配置文件的习惯，并且如果规则\
    \ ever 更改为 `Allow`，配置文件将已分配。\n\nSecurity profiles are evaluated by the first security\
    \ rule that a session is matched against. If a six-tuple is matched against a\
    \ security rule with no or limited security profiles, no scanning can take place\
    \ until there is an application shift and the security policy is re-evaluated.\
    \ *All* security rules need to have security profiles.\n\n安全配置文件由与会话匹配的第一个安全规则进行评估。如果六元组与没有或仅有限安全配置文件的规则匹配，则在发生应用程序转移并重新评估安全策略之前，无法进行扫描。*全部*\
    \ 安全规则都需要具有安全配置文件。\n\n## The Antivirus profile\n\n## Antivirus 配置文件\n\nThe Antivirus\
    \ profile has three sections that depend on different licenses and dynamic update\
    \ settings:\n\nAntivirus 配置文件有三个部分，取决于不同的许可证和动态更新设置：\n\n* The actions under `ACTION`\
