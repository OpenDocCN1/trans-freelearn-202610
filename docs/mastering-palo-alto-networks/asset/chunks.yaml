    \ connections\n*   **SCEP**: **Simple Certificate Enrollment Protocol** connections\
    \ for requesting and distributing client certificates\n*   **SNMP Trap**: Sending\
    \ SNMP statistics to an SNMP server\n*   **Syslog**: Syslog messaging server\n\
    *   **TACACS+**: **Terminal Access Controller Access Control System Plus** authentication\n\
    *   **UID Agent**: User ID agent connections\n*   **URL Updates**: URL filtering\
    \ live lookup service\n*   **VM Monitor**: Virtual machine monitoring\n*   **WildFire\
    \ Private**: Connection to the private WildFire server\n*   **Ztp**: Connection\
    \ to the ZTP service\n\nOnce you set the radio button from **Use Management Interface\
    \ for all** to **Customize**, you will be able to select which source interface\
    \ will be used for each service. From the **Destination** tab, you can also add\
    \ specific IP addresses or entire subnets that need to be routed out of a specific\
    \ interface. The routing table used by the target interface will determine how\
    \ the session is routed to the destination, so service routes can only be attached\
    \ to OSI Layer 3 interfaces.\n\nThe associated CLI configuration command to set\
    \ a service route is as follows:\n\n```\n#set deviceconfig system route service\
    \ dns source interface ethernet1/8 address 192.168.0.15\n```\n\nIf you want to\
    \ see a full list of all the available services, hit the `Tab` key after typing\
    \ `service`:\n\n```\n#set deviceconfig system route service <Tab>\n  autofocus\
    \                    AutoFocus Cloud\n  crl-status                   CRL servers\n\
    \  ddns                         DDNS server(s)\n  ...\n```\n\nThis will enable\
    \ access to resources that are normally not accessible through the management\
    \ network. In the next section, we’ll prepare administrator accounts and provide\
    \ access as needed.\n\n## Admin accounts\n\nThe “admin” account is probably one\
    \ of the most abused accounts in internet history, so your next task is to get\
    \ rid of it and replace it with named accounts. Instead of the default “admin”\
    \ account, it is best practice to use named accounts so changes can be tracked\
    \ by the user and personalized access can be granted easily.\n\nNavigate to the\
    \ **Device** | **Administrators** tab to view local administrators. When creating\
    \ new administrator accounts there are two types of accounts available, **Dynamic**\
    \ and **Role Based**, which you can select by setting the **Administrator Type**\
    \ toggle:\n\n![](Images/B31589_02_31.png)\n\nFigure 2.31: Creating a new admin\
    \ account\n\nFirst, we’ll take a look at dynamic account profiles and their benefits.\n\
    \n### Dynamic accounts\n\nDynamic accounts may be of the following types:\n\n\
    *   **Superusers** can do everything. They are the only users that are allowed\
    \ to perform certain tasks like creating other administrator accounts or creating\
    \ a tech support file.\n*   **Device administrators** can do everything besides\
    \ create new users or virtual systems.\n*   Virtual system-capable devices also\
    \ have **virtual system administrators**, who are also device administrators and\
    \ are restricted to one or several specific virtual systems.\n*   There are also\
    \ read-only flavors that can view everything but not make changes.\n\nYour first\
    \ account will need to be a new superuser to replace the default admin account.\n\
    \n### Role-based administrators\n\nOnce all the required superusers and device\
    \ administrators are created, additional role-based administrators can be added\
    \ for teams that only require limited functionality. Role-based administrators\
    \ can be customized down to individual menu items so that they can do anything\
    \ or have read-only or no access.\n\nThe roles can be configured through the **Device**\
    \ | **Admin Roles** menu:\n\n![](Images/B31589_02_32.png)\n\nFigure 2.32: Admin\
    \ Role Profile\n\nSet each topic to one of the following options by clicking the\
    \ icon to cycle to the option you need:\n\n*   A red cross indicates that these\
    \ administrators will not see the menu item\n*   A lock indicates that the admin\
    \ will be able to see objects or menu items, but not make any changes\n*   A green\
    \ checkmark indicates that the admin has full access to this menu item and can\
    \ make changes to objects or configurations within it\n"
  trans: "\n## 接口管理配置文件\n\n如果必须启用此配置文件，请确保它位于足够屏蔽的接口上，最好是环回接口，并且该接口具有与访问管理服务相关的安全策略。作为次要措施，还请在该配置文件上启用访问列表。\n\
    \n这些配置文件可在 **Network** | **Network Profiles** | **Interface Management Profile**\
    \ 中进行配置，然后在所选接口的 **Advanced** 选项卡下，在 **Network** | **Interfaces** 中将其附加到接口：\n\n\
    ![](img/B31589_02_29.png)\n\n图 2.29：已附加到接口的接口管理配置文件\n\n创建接口管理配置文件、将其服务设置为 HTTPS\
    \ 和 SSH 并添加访问控制列表（ACL）的 CLI 命令如下：\n\n```\n# set network profiles interface-management-profile\
    \ mgmt https yes ssh yes permitted-ip 10.15.15.37\n```\n\n后续的 ACL 项可通过以下命令设置：\n\
    \n```\n# set network profiles interface-management-profile mgmt permitted-ip 192.168.0.5\n\
    ```\n\n作为最佳实践，切勿在面向互联网的接口上配置管理配置文件。\n\n现在管理接口的访问已设置，让我们来看一下来自管理接口的访问。\n\n## 从离线管理访问互联网资源\n\
    \n如果管理接口无法访问互联网，这会带来有趣的挑战，因为它将无法检索更新或执行云查找。一种变通方法是启用服务路由，将特定应用程序、服务或协议通过背板路由到指定的数据平面接口，从而允许管理平面访问互联网，而其物理接口没有超出其管理\
    \ LAN 的访问权限。\n\n服务路由可从 **Device** | **Setup** | **Services** 菜单进行配置，您可以在其中单击 **Service\
    \ Route Configuration** 以打开以下对话框：\n\n![](img/B31589_02_30.png)\n\n图 2.30：服务路由配置\n\
    \n以下是预定义服务路由用途的简要概述：\n\n*   **AutoFocus**：直接连接到 AutoFocus 订阅服务，以便您可以直接从防火墙 Web\
    \ 界面使用它\n*   **CRL Status**：在处理证书时（例如在 TLS 握手期间）获取 **证书吊销列表** (**CRL**) 信息\n*\
    \   **Data Services**：用于数据平面到 Palo Alto 云服务的数据上行链路，用于 IoT、DLP 和 SaaS 订阅服务\n* \
    \  **DDNS**：使用 **动态域名系统** (**DDNS**) 更新接口 IP\n*   **Panorama pushed updates**：从\
    \ Panorama 部署的内容和软件更新（这些更新由 Panorama 触发，但由防火墙发起）\n*   **DNS**：系统 DNS 查找\n*   **External\
    \ Dynamic Lists**：获取已配置的 **外部动态列表** (**EDLs**) 的更新\n*   **Email**：系统发出的电子邮件\n\
    *   **Gp IP Mgmt**：GlobalProtect IP 分配的外部 DHCP\n*   **HSM**：**硬件安全模块** 是维护用于 SSL/TLS\
    \ 解密的证书私钥的远程系统\n*   **HTTP**：系统 HTTP 转发\n*   **Kerberos**：Kerberos 身份验证\n*   **LDAP**：**轻型目录访问协议**\
    \ 连接\n*   **MDM**：**移动设备管理器** 连接\n*   **Multi-Factor Authentication**：**多因素身份验证**\
    \ 服务器\n*   **NetFlow**：网络统计的 NetFlow 收集器\n*   **NTP**：**网络时间协议** 更新\n*   **Palo\
    \ Alto Networks Services**：来自 Palo Alto Networks 和 WildFire 沙箱连接的更新\n*   **Panorama**：连接到\
    \ Panorama 管理服务器\n*   **Panorama Log Forwarding**：发送到日志收集器的日志（仅用于 PA_5200 机箱）\n\
    *   **Proxy**：连接到系统代理\n*   **RADIUS**：**远程身份验证拨入用户服务** 连接\n*   **SCEP**：用于请求和分发客户端证书的\
    \ **简单证书注册协议** 连接\n*   **SNMP Trap**：向 SNMP 服务器发送 SNMP 统计信息\n*   **Syslog**：Syslog\
    \ 消息服务器\n*   **TACACS+**：**终端访问控制器访问控制系统 Plus** 身份验证\n*   **UID Agent**：用户 ID\
    \ 代理连接\n*   **URL Updates**：URL 过滤实时查找服务\n*   **VM Monitor**：虚拟机监控\n*   **WildFire\
    \ Private**：连接到私有 WildFire 服务器\n*   **Ztp**：连接到 ZTP 服务\n\n一旦将单选按钮从 **Use Management\
    \ Interface for all** 设置为 **Customize**，您将能够为每个服务选择将使用哪个源接口。从 **Destination**\
    \ 选项卡，您还可以添加需要从特定接口路由出去的特定 IP 地址或整个子网。目标接口使用的路由表将决定会话如何路由到目标，因此服务路由只能附加到 OSI 第\
    \ 3 层接口。\n\n设置服务路由的关联 CLI 配置命令如下：\n\n```\n#set deviceconfig system route service\
    \ dns source interface ethernet1/8 address 192.168.0.15\n```\n\n如果您想查看所有可用服务的完整列表，请在输入\
    \ `service` 后按 `Tab` 键：\n\n```\n#set deviceconfig system route service <Tab>\n\
    \  autofocus                    AutoFocus Cloud\n  crl-status                \
    \   CRL servers\n  ddns                         DDNS server(s)\n  ...\n```\n\n\
    这将启用通常无法通过管理网络访问的资源访问。在下一节中，我们将准备管理员帐户并根据需要提供访问权限。\n\n## 管理员帐户\n\n“admin” 帐户可能是互联网历史上被滥用最严重的帐户之一，因此您的下一个任务是将其删除并替换为命名帐户。最好不要使用默认的“admin”帐户，而是使用命名帐户，以便可以按用户跟踪更改并轻松授予个性化访问权限。\n\
    \n导航到 **Device** | **Administrators** 选项卡以查看本地管理员。创建新的管理员帐户时，有两种类型的帐户可供选择，**Dynamic**\
    \ 和 **Role Based**，您可以通过设置 **Administrator Type** 切换按钮来选择：\n\n![](img/B31589_02_31.png)\n\
    \n图 2.31：创建新的管理员帐户\n\n首先，我们来看看动态帐户配置文件及其优势。\n\n### 动态帐户\n\n动态帐户可能为以下类型：\n\n* \
    \  **Superusers** 可以执行所有操作。他们是唯一允许执行某些任务（如创建其他管理员帐户或创建技术支持文件）的用户。\n*   **Device\
    \ administrators** 可以执行除创建新用户或虚拟系统之外的所有操作。\n*   具备虚拟系统功能的设备还具有 **virtual system\
    \ administrators**，他们也是设备管理员，并被限制在一个或多个特定虚拟系统上。\n*   还有只读版本，可以查看所有内容但不能进行更改。\n\
    \n您的第一个帐户需要是新的超级用户，以替换默认的 admin 帐户。\n\n### 基于角色的管理员\n\n一旦创建了所有必需的超级用户和设备管理员，就可以为仅需要有限功能的团队添加额外的基于角色的管理员。基于角色的管理员可以自定义到单个菜单项，以便他们可以执行任何操作或具有只读或无访问权限。\n\
    \n可以通过 **Device** | **Admin Roles** 菜单配置角色：\n\n![](img/B31589_02_32.png)\n\n图\
    \ 2.32：管理员角色配置文件\n\n通过单击图标循环到所需的选项，将每个主题设置为以下选项之一：\n\n*   红色叉号表示这些管理员将看不到菜单项\n\
    *   锁表示管理员将能够查看对象或菜单项，但不能进行任何更改\n*   绿色复选标记表示管理员对该菜单项具有完全访问权限，并且可以对其中的对象或配置进行更改\n"
