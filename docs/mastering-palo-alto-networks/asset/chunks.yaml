  trans: '

    一个良好的做法是在规则库末尾添加一些 `catch all` 规则，如下图所示，一旦所有必需的策略都已添加到 `catch any` 不允许的连接。从可疑区域出发，一个
    `catch all` 规则应设置为 `application-default`，另一个设置为 `any`；这将有助于识别未命中安全策略的标准应用程序以及（更可疑的）未使用正常端口的非标准应用程序（请参阅
    `Allowing applications` 部分了解 `application-default` 服务）：


    ![](img/B31589_03_34.png)


    图 3.34：规则库末尾的捕获全部规则


    在最后一个捕获全部规则中添加一个 `any`-`any` drop 规则将覆盖区域内默认允许规则并可能阻止某些服务，因此如果您想丢弃所有未计入的连接，请确保您已考虑这些情况。常被忽略的连接有
    DHCP relay、IPSec 和作为区域内的 GlobalProtect。


    您现在有一些规则正在主动丢弃您不希望通过防火墙的连接，但除了静默丢弃数据包之外还有更多选项。我们接下来将回顾其他选项。


    ## 操作选项


    处理新连接有多种不同的操作可用，其中一些是隐蔽的，一些是嘈杂且信息丰富的。根据您的需求选择使用哪一个：


    * `Deny` 将丢弃会话并执行与应用程序关联的默认 `Deny` 操作。某些应用程序可能会静默丢弃，而其他应用程序会发送 RST 数据包。

    * `Allow` 允许会话通过。

    * `Drop` 静默丢弃数据包。

    * `Reset Client` 向客户端发送 TCP RST。

    * `Reset Server` 向服务器发送 TCP RST。

    * `Reset Both` 向客户端和服务器都发送 TCP RST。


    如果您选中 `Send ICMP Unreachable` 复选框且入站接口为第 3 层，则会为所有被丢弃的 TCP 或 UDP 会话向客户端发送 `ICMP
    Unreachable` 数据包。这对于优雅地结束 UDP 会话很有用，因为 UDP 不支持 RST 数据包。它还将帮助远程主机找到替代目标或放弃，而如果没有
    ICMP 消息，它可能会继续向防火墙发送 UDP 数据包。


    ## 允许应用程序


    通常有两种方法来确定您想要允许哪些应用程序：


    * 创建已知应用程序组

    * 创建应用程序过滤器按其行为对应用程序进行分类


    从 `Objects` | `Application Groups`，您可以创建可在安全策略中使用的已知应用程序组，如下所示：


    ![](img/B31589_03_35.png)


    图 3.35：应用程序组


    `Important note`


    安全规则库从上到下进行评估，一旦找到匹配项，评估就会停止，然后执行匹配的安全规则。这意味着如果可能存在重叠，阻止规则需要在允许规则 `above` 放置。


    随着基于云的主机和廉价 SaaS 解决方案的广泛采用，更多传统程序正转变为可通过网络浏览器访问的基于网络的应用程序。这使得管理员更难轻松确定需要允许哪些应用程序，因为业务需求变化很快。在
    `Objects` | `Application Filters` 中创建的应用程序过滤器让您可以创建动态应用程序组，按其属性添加应用程序，而不是逐个添加。这些属性可以为“良好”属性选择以添加到允许规则（如下图所示）或“不良”属性以丢弃规则：


    ![](img/B31589_03_36.png)


    图 3.36：具有基本属性的应用程序过滤器


    或者，过滤器可以基于分配给应用程序的预定义和自定义标签，如下所示：


    ![](img/B31589_03_37.png)


    图 3.37：具有标签的应用程序过滤器


    您可以通过将它们添加到 `Applications` 选项卡来混合匹配应用程序组和过滤器以构建进一步的安全规则，如下所示：


    ![](img/B31589_03_38.png)


    图 3.38：安全规则中的 APPLICATIONS 选项卡


    要使用应用程序过滤器创建新的 `Allow` 规则，请执行以下操作：


    1. 创建新的安全规则并添加描述性名称。

    2. 将源区域设置为将连接到互联网的 `internal zone`。

    3. 将目标区域设置为 `external zone`。

    4. 在 `Applications` 中，添加新行并选择 `Application Filter`。

    5. 单击所有所需属性并查看底部的一些应用程序。添加描述性名称并单击过滤器的 `OK`，然后再次单击安全规则。


    您现在有一个基于应用程序过滤器的 `allow` 规则！


    ### 应用程序依赖项


    您可能会注意到，当您开始向安全规则添加应用程序时，一些应用程序具有依赖项。这些依赖项将在添加应用程序时出现在 `Depends On` 字段中。这些应用程序依赖于底层协议或构建在现有、更基本的应用程序之上，该应用程序需要在安全规则库中添加并允许此子应用程序才能工作。


    它们不一定需要添加到同一安全策略中。


    从 PAN-OS 9.1 开始，这些依赖项在安全规则中显示。如以下屏幕截图所示，它们在添加新应用程序时出现，可以立即添加到同一安全规则或安全规则库中的不同规则。


    由于防火墙每次会话更改为新的 App-ID 时都会遍历安全规则，您可能已在不同规则中满足依赖项，并且一旦匹配此新规则中设置的 App-ID 之一，防火墙将把会话更改为此新规则。在较旧的
    PAN-OS 版本中，用户只有在配置提交后才会收到这些依赖项的警告。您也可以通过 `Objects` | `Applications` 查看单个应用程序的应用程序依赖项：


    ![](img/B31589_03_39.png)


    图 3.39：应用程序依赖项


    现在应用程序已设置，让我们看看服务端口是如何控制的。


    ### Application-default 与手动服务端口


    每个应用程序将使用某个服务端口来建立连接。默认情况下，每个服务都设置为 `application-default`，这会强制每个应用程序使用其默认端口（例如，网页浏览使用端口
    `80`（未加密）和 `443`（SSL）加密，而 FTP 使用端口 `21`（未加密明文）和 `990`（加密））。


    `Important note`


    使用打洞的协议，例如 FTP，会通过 `Application Layer Gateway` (`ALG`) 自动处理，`ALG` 是内容解码器中特定于此协议的一部分。ALG
    确保“子”会话被接受为同一安全规则的一部分，即使端口可能与默认端口不同。


    如果应用程序需要自定义端口，您可以添加手动创建的服务对象，但这将阻止使用 `application-default`。因此，任何例外最好在单独的规则中进行，以防止应用程序通过不寻常的端口“逃逸”：


    ![](img/B31589_03_40.png)


    图 3.40：服务端口


    添加 URL 类别可用于在 TCP 层允许或阻止 URL 类别：


    ![](img/B31589_03_41.png)


    图 3.41：安全规则中的 URL 类别


    而不是在 (ISO) 第 7 层应用 URL 过滤，直接添加到安全规则的 URL 类别简化了允许或拒绝访问特定类别。


    当外发连接被识别为网页浏览（或 SSL）时，内容解码器将识别正在访问的 URL 并进行类别查找。如果安全规则中设置了 URL 类别，如 `Figure 3.38`
    所示，可以立即应用第 3 层操作以允许或拒绝会话继续。

    '
