    \ `198.51.100.1` as a next-hop. There are a few scenarios that will influence\
    \ how the zone is determined:\n\n* **Scenario 1**: A packet is received from client\
    \ PC `172.16.0.5` with destination IP `1.1.1.1`.\n\nThe firewall quickly determines\
