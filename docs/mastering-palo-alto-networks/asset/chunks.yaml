- raw: '*   **Discard**: Routes can be set to “black hole” certain subnets. This can
    be used to prevent any packets from reaching a connected out-of-band network,
    even if a security policy were to allow this.


    *   **None**: Routes may not have a next hop, such as packets routed into a VPN
    tunnel.


    The **Admin Distance** and **Metric** settings can be changed for each route if
    necessary.


    **Route Table** is used to add routes to regular unicast routing, multicast routing,
    or both.


    You can, if you have redundancy available, use **Path Monitoring** to send a heartbeat
    ping over the route. If the ping fails a configured number of times, the route
    will be disabled. The routing table will be re-evaluated for matching packets
    and the next best match will be used to route packets (that is, a route with a
    higher metric or larger subnet):


    ![](Images/B31589_02_58.png)


    Figure 2.58: VR default route


    Any subnets that are configured on a Layer 3 interface are added to the routing
    table as a connected network and do not need a static route to be added.


    ## The Layer 2 interface and VLANs


    Setting interfaces to the Layer 2 type enables the firewall to function in a similar
    way to placing a switch in the network. Each interface acts as the equivalent
    of an access port (if you need trunk functionality, refer to the *Subinterfaces*
    topic) on a switch, and you can add as many interfaces as you need.


    Each interface should use a different zone so that a security policy can be leveraged
    to control traffic between the interfaces. Interfaces set to the same zone will,
    by default, exchange traffic without inspection and require a catch-all security
    policy to enable inspection.


    To group the interfaces into a logical “switch,” you need to create a VLAN object
    by going to **Networks** | **VLANs** and adding the interfaces you previously
    set to Layer 2 and want to be connected:


    ![](Images/B31589_02_59.png)


    Figure 2.59: VLAN group


    The **VLAN Interface** option adds routing functionality to the group as a logical
    Layer 3 interface. This can be useful if you have an upstream ISP router or a
    different subnet connected to a Layer 3 interface that you need to interact with.


    You can configure the VLAN interface by going to **Network** | **Interfaces**
    | **VLAN**. Assign it to the VLAN group you created, fill in the **Virtual Router**
    field, and assign it a zone. This zone will represent Layer 2 interfaces when
    interacting with Layer 3 interfaces for security policies:


    ![](Images/B31589_02_60.png)


    Figure 2.60: VLAN Interface configuration


    You will also need to assign the VLAN interface an IP address that the clients
    on Layer 2 interfaces can use as a default gateway or routing next hop. Make sure
    it is in the same subnet as your clients on the Layer 2 interfaces:


    ![](Images/B31589_02_61.png)


    Figure 2.61: VLAN Interface IP address


    ## Tap interfaces


    Tap interfaces can be used as a passive sniffing port. If a different network
    device is set up with port mirroring, its egress port can be connected to the
    tap interface to intercept all packets and apply the app ID and content ID. As
    long as the Tap interface is sent all packets of a session, it will be able to
    inspect the traffic as if it is flowing through the firewall. There are, however,
    a few limitations:


    *   As the firewall is not actively participating in the processing of packets,
    it cannot take action if it detects a threat; it can only report it.


    *   SSL decryption can only be applied to inbound connections if the server certificate
    can be loaded onto the firewall with its private key.


    The Tap interface only needs to be configured with a security zone:


    ![](Images/B31589_02_62.png)


    Figure 2.62: The Tap interface


    To optimally benefit from the Tap functionality, a security rule will need to
    be created that allows all operations, or a specific subset, if you want to limit
    the scope. The firewall will discard all packets in the background, but setting
    the security rule to drop would discard the packets before inspection:


    ![](Images/B31589_02_63.png)


    Figure 2.63: The Tap security rule


    Similar to listening in on a port mirror, the firewall can send all unencrypted
    session data to a third-party **DLP** or threat intelligence device. It can do
    so via a Decryption Port Mirror interface.


    ## The Decryption Port Mirror interface


    The Decryption Port Mirror interface allows the forwarding of decrypted packets
    to an external device for further inspection: the firewall will receive a TLS
    packet that is set to be decrypted, so takes all the steps to decrypt the session,
    and then forwards the clear text payload to a third party device for a “second
    opinion” using the Decryption Port Mirror interface as an egress interface. This
    can be useful for DLP, for example. The license can be activated for free via
    the support portal by browsing [https://support.paloaltonetworks.com](https://support.paloaltonetworks.com)
    and then going to **Assets** | **Devices**.


    There, you can find your firewall and click the **Actions** button. If you choose
    to activate a feature license, you will be able to activate **Decryption Port
    Mirror**:


    ![](Images/B31589_02_64.png)


    Figure 2.64: Activating a Decryption Port Mirror license


    To activate the license on the firewall, follow these steps:


    1.  From **Device** | **Licenses**, select **Retrieve license keys from license
    server**.


    2.  In **Device** | **Setup** | **Content ID** | **Content-ID settings**, enable
    **Allow forwarding of decrypted content**.


    3.  In **Network** | **Interfaces** | **Ethernet**, set an interface to the **Decrypt
    Mirror** type.


    4.  In **Objects** | **Decryption** | **Decryption Profiles**, open the decryption
    profile and add the interface to **Decryption Mirroring**.


    5.  In **Policies** | **Decryption**, create decryption rules that use the decryption
    profile.


    6.  Save the changes and connect the Decryption Port Mirror interface.


    Besides Ethernet interfaces, there are also three different logical interfaces:


    *   Loopback


    *   Tunnel


    *   VLAN interface


    Let’s now take a look at the Swiss army knife of interfaces, the loopback.


    ## The loopback interface


    A loopback interface is a logical Layer 3 interface that can serve many purposes.
    One common use case includes adding an additional public IP to its own interface
    so VPN configuration can be added to it. Another use case is to add a management
    profile to a loopback, and then leverage security rules to allow administrators
    to manage the firewall from exotic networks. It needs to be configured with an
    IP address (only a single IP per loopback interface is supported) and a security
    zone and it needs to be associated with a VR.


    It can be set to a new IP address in the same subnet and zone as one of the Layer
    3 interfaces, so services such as **Management Profile**, **Captive Portal**,
    and **GlobalProtect** can be hosted on a different IP than the main IP of the
    physical interface.


    To add extra security, it can also be set to a different zone so that a matching
    security rule is needed for clients to be able to connect to the loopback interface:


    ![](Images/B31589_02_65.png)


    Figure 2.65: Loopback Interface


    The number next to **Interface Name** is an identification number for the logical
    interface. A number from 1 to 9999 can be assigned to the interface and will only
    serve as an identification number for the interface.


    ## The tunnel interface


    Tunnel interfaces are logical interfaces that serve as the ingress and egress
    point of tunneled traffic, both site-to-site VPN and GlobalProtect SSL and IPSec.
    The physical tunnel is terminated on a Layer 3 or loopback interface, but the
    packets that need to be encrypted should be routed to the tunnel interface:


    ![](Images/B31589_02_66.png)


    Figure 2.66: Static route for a VPN tunnel


    This interface needs to be associated with a VR and a security zone, as you can
    see in the following screenshot:


    ![](Images/B31589_02_67.png)


    Figure 2.67: Tunnel Interface'
