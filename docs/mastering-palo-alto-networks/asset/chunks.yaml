    \ regular route could have a smaller subnet, such as `172.16.0.0/24`.\n\nThe **Interface**\
    \ option indicates what the egress interface will be. If the route is pointing\
    \ to the internet, the interface will be the one where the ISP router is connected.\n\
    \n**Next Hop** has several options:\n\n*   **IP Address**: The IP of the upstream\
    \ router to forward packets to.\n\n*   **Next VR**: Whether the packet needs to\
    \ be handed over to a different VR on the same device.\n\n*   **FQDN**: If the\
    \ upstream router has a dynamic IP, it could be useful to use an FQDN that is\
    \ dynamically updated by a DNS record."
