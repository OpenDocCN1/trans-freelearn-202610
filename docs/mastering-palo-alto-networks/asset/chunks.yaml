    # 控制台访问与配置


    ## 引脚参考


    ```

    1 - Empty - Data Carrier Detect (DCD)

    2 - 3 - Receive Data (RXD)

    3 - 6 - Transmit Data - (TXD)

    4 - 7 - Data Terminal Ready (DTR)

    5 - 4 - Ground (GND)

    6 - 2 - Data Set Ready (DSR)

    7 - 8 - Request To Send (RTS)

    8 - 1 - Clear to Send - (CTS)

    9 - Empty - Ringing Indicator (RI)

    ```


    幸运的是，也有 USB-to-RJ45 电缆可供使用，可以免去您费心查找正确引脚的麻烦：


    ![](img/B31589_02_01.png)


    图 2.1：RJ45 到 USB 控制台电缆


    除了非常旧的型号外，其他型号还配备了 micro-USB 端口，可使用标准 USB-A 到 micro-USB 电缆建立控制台连接，如下图所示：


    ![](img/B31589_02_02.png)


    图 2.2：PA-460 RJ45 和 micro-USB 控制台端口


    ## 查找控制台端口


    在所有情况下，您都需要找到计算机操作系统上正在使用的 `COM`（硬件接口）或 `TTY`（`TeleTYpewriter`）端口。


    ### Windows


    在 Windows 机器上，第一次插入电缆时可能需要安装驱动程序。安装完成后，您需要找到分配给控制台电缆的虚拟 COM 端口号。在大多数情况下，您可以通过以下步骤确定此虚拟
    COM 端口号：


    1. 打开设备管理器。

    2. 单击 开始 | 控制面板 | 硬件和声音 | 设备管理器（在“设备和打印机”下）。

    3. 在设备管理器列表中，查看“端口”，找到分配给 USB 端口的虚拟 COM 端口。此条目看起来类似于 USB 转串口（`COM#`），其中 `COM#`
    是在下一步中使用的编号。


    接下来，您需要一个终端仿真客户端来连接控制台。您可以使用免费客户端，例如来自 https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html
    的 `PuTTY`。


    除了 `COM` 端口外，您可能还需要提供更多设置才能连接。如果被要求，请使用以下设置：


    ```

    Bits per second: 9600

    Data Bits: 8

    Parity: none

    Stop bits: 1

    Flow control: none

    ```


    ### macOS 和 Linux


    在 macOS 和 Linux 上，USB 串行连接通常会在 `/dev/` 目录中创建一个新的 `tty` 条目；USB 到 DB9 转接器可能会在 `/dev/`
    目录中创建一个呼叫（`CU`）条目。


    通过以下任一命令搜索来查找正确的设备：


    ```

    ls /dev/tty.*

    ls /dev/cu.*

    ```


    您将找到 `/dev/cu.usbserialxxxxx` 或 `/dev/tty.usbmodemxxxxx`，其中 `xxxxx` 是串行设备名称。


    确定适当的设备后，您可以使用设置为 `9600` 波特的 `screen` 命令连接到控制台端口：


    ```

    screen /dev/tty.usbmodemxxxxx 9600

    ```


    ## 连接到控制台


    现在，请将控制台电缆或 micro-USB 连接到您的笔记本电脑和设备。如果管理网络上有空闲端口，请将防火墙的 `MGT` 端口连接到交换机。如果您还没有可用的管理连接，则需要将笔记本电脑直接连接到
    `MGT` 端口，以便在管理接口上设置 IP 后更轻松地访问。最后，插入电源线。


    如果防火墙加载在 VM 或云实体中，请按“开始”按钮启动虚拟设备。


    一旦您登录到控制台，您将看到操作系统启动，如果防火墙已连接到启用 DHCP 的管理网络，您将看到类似以下内容，其中 DHCP 地址已为您方便地列出：


    ![](img/B31589_02_03.png)


    图 2.3：PA-VM 启动后 DHCP 信息


    如果您错过了此信息，您可以登录并使用以下命令查看 DHCP 信息：


    ```

    admin@PA-440> show system info

    hostname: PA-440

    ip-address: 192.168.27.116

    public-ip-address: unknown

    netmask: 255.255.255.0

    default-gateway: 192.168.27.1

    ip-assignment: dhcp

    ```


    如果由于某种原因您尚未从 DHCP 服务器收到 DHCP 地址，您可以通过使用 `request dhcp client management-interface
    renew` 命令从 CLI 发起 `renew` 操作。


    ### 重要说明


    出厂设置设备或 VM 的默认用户名和密码如下：


    `Username: admin`


    `Password: admin`


    第一次登录时，系统会要求您更改此默认密码。记住提交配置以保存新密码。


    ## 访问接口


    现在您已访问用户界面，您需要立即做出一个重要决定：是否使用 `zero-touch provisioning`（`ZTP`）或不（我们将在第 7 章《通过
    Panorama 管理防火墙》中稍后了解更多）。简而言之，`ZTP` 使设备能够自动接收中央管理 Panorama 系统的坐标（如果有），并立即从那里下载其配置。默认情况下，此选项在所有新设备上均已启用，并绑定到接口
    `ethernet1/1`。如果您不需要此功能，则必须在开始使用此接口之前将其关闭。您可以通过发出命令 `set system ztp disable` 来实现，如下所示：


    ```

    admin@PA-440> set system ztp disable

    Executing this command will disable Zero Touch Provisioning (ZTP), and remove
    all logs and configuration. The system will restart in standard mode for regular
    configuration of the firewall. Are you sure you want to continue? (y or n)

    ```


    如果您按下 Y 键，系统将重新启动并且 `ZTP` 将被禁用。如果您后来改变主意并想再次启用它，可以通过发出以下命令来实现：`set system ztp
    enable`。


    系统重新启动后，请继续进行初始配置。


    如果您的网络没有 DHCP 服务器，或您将防火墙直接连接到笔记本电脑，您需要手动设置 IP 地址。将以下内容复制并粘贴到文本文件中，并使用管理接口的适当 IP、其用于访问互联网的默认网关以及其用于解析域名的
    DNS 服务器更改 `<IP>` 条目。以四段十进制格式输入子网掩码，而不是 CIDR（斜杠表示法子网，例如 `/16` 和 `/24`）：


    ```

    configure

    set deviceconfig system type static

    set deviceconfig system ip-address <IP>

    set deviceconfig system netmask <x.x.x.x>

    set deviceconfig system default-gateway <IP>

    set deviceconfig system dns-setting servers primary <IP>

    set deviceconfig system dns-setting servers secondary <IP>

    commit

    ```


    您可以链接属于同一路径和类的 `set` 命令，这样您就不必在单独的 `set` 命令中设置每个属性；相反，您可以一次性添加所有所需设置。


    在下一个示例中，我们进入配置模式，将管理接口从 DHCP 切换到静态配置，然后将管理接口的所有配置参数合并到一个 `set` 命令中。如果您尚未这样做，请先将默认密码更改为新密码，然后添加接口配置：


    ```

    admin@PA-440> set password

    Enter old password :

    Enter new password :

    Confirm password :

    Password changed

    admin@PA-440> configure

    Entering configuration mode

    [edit]

    admin@PA-440# set deviceconfig system type static

    [edit]

    admin@PA-440# set deviceconfig system ip-address 192.168.27.5 netmask 255.255.255.0
    default-gateway 192.168.27.1 dns-setting servers primary 1.1.1.1 secondary 1.0.0.1

    [edit]

    admin@PA-440# commit

    Commit job 2 is in progress. Use Ctrl+C to return to command prompt

    ...........................................55%....75%.....98%.......................100%

    Configuration committed successfully

    [edit]

    admin@PA-440#

    ```

