- raw: "When upgrading, you will need to map out where you are, where you need to\
    \ go, and how you need to get there. You can find where you are by looking at\
    \ the dashboard’s **General Information** section and looking for the software\
    \ version. Deciding where you need to go may require some research and consideration:\n\
    \n*   Which features are required? Are there new features in a release you need,\
    \ or are you running smoothly with the features you have?\n\n*   Is the code train\
    \ “mature”? Is a new major release brand new, and do the new features weigh up\
    \ against the risk of being an early adopter?\n\n*   Are there outstanding advisories\
    \ that trump the required features? Was a critical vulnerability found that has\
    \ not been addressed in the version you plan to go to?\n\n*   When is an upgrade\
    \ required and when is it optional? Is there a direct need to upgrade due to a\
    \ vulnerability or a bug, or are there features in a newer release that will be\
    \ helpful?\n\n*   Will your current OS code train reach its end of life soon?\
    \ (You can review the end-of-life dates here: [https://www.paloaltonetworks.com/services/support/end-of-life-announcements/end-of-life-summary](https://www.paloaltonetworks.com/services/support/end-of-life-announcements/end-of-life-summary)).\n\
    \nThese questions will help you determine which upgrades need to take place immediately\
    \ and which ones can be scheduled ahead of time, possibly with a more relaxed\
    \ testing process before deploying to the production environment or even postponed\
    \ until a more mature maintenance release version is available. Let’s now try\
    \ to answer some of these questions.\n\n#### Which features are required?\n\n\
    Determining which features are contained in each PAN-OS version requires the most\
    \ research. You can open [https://docs.paloaltonetworks.com](https://docs.paloaltonetworks.com)\
    \ and search for `Feature Guide`, which will return all the new feature guides\
    \ for the major PAN-OS versions.\n\n#### Is the code train “mature”?\n\nMaturity\
    \ can be estimated by looking at the maintenance release version. All PAN-OS versions\
    \ are made up of three numbers – PAN-OS X.Y.Z (for example, 10.1.5):\n\n*   X\
    \ is the number of the major software release\n\n*   Y is the number of the feature\
    \ version release\n\n*   Z is the number of the maintenance release\n\nX will\
    \ change when a new major software version is released containing new functionality\
    \ and usually containing some changes in its expected behavior and possibly a\
    \ new look and feel.\n\nEach new software release is usually followed by a new\
    \ feature version around 6 to 9 months after its release, mostly containing some\
    \ new features. Maintenance release versions are released for all code trains\
    \ anywhere between 5 and 9 weeks and mostly contain bug fixes.\n\nThere will occasionally\
    \ be PAN-OS version names that end in `-hx`, which denotes a hotfix. This is a\
    \ maintenance release that was published ahead of schedule and usually only contains\
    \ one or a few critical hotfixes (for example, `11.2.2-h1`).\n\nA code train will\
    \ usually reach a reliable maturity around the `x.y.4` or `x.y.5` maintenance\
    \ release version when it is somewhat safe to assume most critical bugs have been\
    \ found and addressed.\n\nCheck the release notes for any known issues so that\
    \ you can appropriately prepare if there are any caveats: [https://docs.paloaltonetworks.com/pan-os/11-2/pan-os-release-notes.html](https://docs.paloaltonetworks.com/pan-os/11-2/pan-os-release-notes.html).\n\
    \n#### Are there outstanding advisories that trump the required features?\n\n\
    Advisories regarding which maintenance release versions to choose or avoid can\
    \ be found at [https://securityadvisories.paloaltonetworks.com/](https://securityadvisories.paloaltonetworks.com/)\
    \ and [https://live.paloaltonetworks.com/t5/Customer-Resources/](https://live.paloaltonetworks.com/t5/Customer-Resources/).\n\
    \n#### When is an upgrade required and when is it optional?\n\nEach major version\
    \ has a base image, usually the `x.y.0` version, which contains all the vital\
    \ parts of the PAN-OS image.\n\nThis allows the following maintenance versions\
    \ to be smaller in size, containing only critical updates. The base image needs\
    \ to be downloaded onto the system before a maintenance version can be installed.\
    \ It is not required for the base image to be installed in order to be able to\
    \ install the maintenance version when upgrading from a lower major version. It\
    \ is also not required to install any intermediate maintenance versions unless\
    \ the release notes explicitly mention that there is an issue that requires a\
    \ step in between.\n\nSay, for example, that your firewall is currently on PAN-OS\
    \ 11.0.4 and you need to get to PAN-OS 11.1.5. You can download a PAN-OS 11.1.0\
    \ base image, followed by a PAN-OS 11.1.5 maintenance image, and then directly\
    \ install and reboot PAN-OS 11.1.5. Your system will be directly upgraded from\
    \ 11.0.4 to 11.1.5.\n\nIf, for example, your firewall is currently on PAN-OS 10.0.10\
    \ and you want to go to PAN-OS 11.1.5, you do need to download a PAN-OS 10.1.0\
    \ base image and download, install, and reboot the latest maintenance release\
    \ (e.g., 10.1.14) before you can install PAN-OS 11.1.5.\n\n**Important note**\n\
    \nIn PAN-OS 10.1, a new feature was introduced that allows you to skip up to three\
    \ PAN-OS versions when upgrading. When upgrading PAN-OS 9.1 to 10.1, you are required\
    \ to install and reboot into PAN-OS 10.0. When upgrading PAN-OS 10.1 to 11.1,\
    \ you can immediately go to the latest 11.1 maintenance version without needing\
    \ to install 10.2 or 11.0.\n\nYou will now have a good understanding of when and\
    \ why you would need to upgrade and how to decide which version you need to upgrade\
    \ to. In the following section, we’ll briefly go over the upgrade process via\
    \ different methods; see *Chapter 8*, *Upgrading Firewalls and Panorama*, for\
    \ a more thorough upgrade process.\n\n## Upgrading via the CLI\n\nUsing the CLI,\
    \ commands can be quickly executed to perform tasks. To upgrade via the CLI, you\
    \ can follow these steps:\n\n1.  You first need to retrieve the available software\
    \ images that can be installed on your system. You won’t be able to download any\
    \ images before the list is retrieved: \n\n    ```\n    admin@PA-440> request\
    \ system software check\n    Version                          Size    Released\
    \ on          Downloaded\n    -------------------------------------------------------------------------\n\
    \    11.2.2-h1                        749MB   2024/08/02 15:58:14  no      \n\
    \    11.2.1                           502MB   2024/07/08 12:04:42  no       \n\
    \    11.2.0-b3                        1228MB   2024/03/14 12:31:10  no       \n\
    \    11.2.0-b1                        1258MB   2024/02/06 14:20:41  no       \n\
    \    11.2.0                           1239MB   2024/05/02 10:15:34  no      \n\
    \    11.1.4-h1                        1015MB   2024/08/08 02:18:35  yes      \
    \ \n    11.1.4                           946MB   2024/06/27 08:17:35  no     \
    \  \n    11.1.3                           893MB   2024/05/14 15:14:14  no    \
    \   \n    ```\n\n2.  Next, you can download the desired PAN-OS version. Remember\
    \ to first download the base image if you’re upgrading to a new major release:\
    \ \n\n    ```\n    admin@PA-440> request system software download version 11.2.0\n\
    \    Download job enqueued with jobid 31\n    ```\n\n3.  You can track the download\
    \ status with the following command: \n\n    ```\n    admin@PA-440> show jobs\
    \ id 31\n    Enqueued            Dequeued ID Type   Status Result Completed\n\
    \    --------------------------------------------------------------\n    2024/08/22\
    \ 23:24:15 23:24:15 31 Downld FIN    OK     23:25:31 \n    Warnings:\n    Details:Successfully\
    \ downloaded\n    Preloading into software manager\n    Successfully loaded into\
    \ software manager  \n    ```\n\n4.  Follow up with the maintenance release: \n\
    \n    ```\n    admin@PA-440> request system software download version 11.2.2-h1\n\
    \    Download job enqueued with jobid 32\n    ```"
  fmt: "\n## Upgrade Planning\n\nWhen upgrading, you will need to map out where you\
