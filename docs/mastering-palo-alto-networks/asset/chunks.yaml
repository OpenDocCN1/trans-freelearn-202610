- raw: 'If more than 64,000x oversubscription ratio concurrent sessions per source
    are needed, or source ports need to be maintained, you can opt to use Dynamic
    IP instead of DIPP. Dynamic IP will simply “hop” to the next available IP in its
    assigned translation addresses for a given source IP while maintaining the source
    port.


    As a fallback, if the available IP pool does get depleted because Dynamic IP does
    not support oversubscription, you can enable DIPP. The IP used in the fallback
    should not overlap with any of the main IP pools:


    ![](Images/B31589_03_53.png)


    Figure 3.53: Dynamic IP with two subnets and DIPP fallback


    In some cases, a server or host on the network will need to “own” its own IP address,
    which can be achieved with one-to-one NAT rules.


    ### One-to-one NAT


    Static IP will always translate a source into the same translation IP and maintain
    the source port. An IP range can be set, in which case the source IPs will be
    sequentially matched to the translated IPs, but it is important that the source
    range and translation range are identical in size; for example, `10.0.0.5-10.0.0.15`
    translates to `203.0.113.5-203.0.113.115`.


    The **Bi-directional** option creates an *implied* inbound NAT rule to allow inbound
    translation for the same source/translated source pairs. This implied rule reuses
    the destination zone set in the rule and **any** as the new source zone. It will
    set the translated address as the new destination of the original source to the
    new translated destination.


    For the outbound rule, as you can see in *Figure 3**.54* you have the following:


    *   **Source**: **Trust-L3**


    *   **Destination**: **Untrust-L3**


    *   **Original source**: **serverfarm**


    *   **Translated source**: **serverfarm-public**


    For rules that have a bi-directional set, the following implied NAT rule will
    be created. This rule will *not* be visible in the rule base so be very attentive
    to any rules that are set to bi-directional and what this implies: the source
    is set to **any** so the implied rule may catch unintended sessions from other
    zones than the ones you configured:


    *   **Source**: **any**


    *   **Destination**: **Untrust-L3**


    *   **Original destination**: **serverfarm-public**


    *   **Translated destination**: **serverfarm**


    ![](Images/B31589_03_54.png)


    Figure 3.54: Static IP NAT with the bi-directional option


    In some cases, “double NAT” needs to be applied to sessions that need to take
    an unusual route due to NAT. These types of NAT rules are called U-turn or hairpin
    NAT rules.


    ### U-turn or hairpin NAT


    If an internal host needs to connect to another internal host on the same subnet,
    by using its public IP address, a unique problem presents itself. For each session,
    only one NAT rule can be matched. When the client connects to the public IP, the
    routing table will want to send the packet out to the internet, which will trigger
    the hide NAT rule, which translates the source IP. (It will not trigger the normal
    destination NAT rule, as this will have **Untrust** as the source zone.)


    The packet should then go back inside as the destination public IP is also owned
    by the firewall, but a second NAT action can’t be triggered, so the packet is
    discarded.


    If the hide-NAT IP is identical to the destination IP, which is common in environments
    with few public IP addresses, the packet will be registered as a land attack:


    ```

    admin@PA-220> show counter global | match land

    Global counters:

    Elapsed time since last sampling: 26.05  seconds

    name     value  rate severity category  aspect  description

    -------------------------------------------------------------

    Flow_parse_land 1 1  drop     flow      parse    Packets dropped: land attack

    ```


    A workaround to this problem, if changing the internal DNS record so the FQDN
    resolves to an internal IP while on the local network or adding an entry to the
    host file of the client is not possible, is to configure a U-turn or hairpin NAT.


    **Important note**


    If you are using PAN-OS 9.0.2 or later, take a look at an alternative solution
    in the *Enable DNS Rewrite* section.


    This type of NAT combines the destination and source NAT and must be placed at
    the top of the rule base to prevent the hide NAT rule from catching these outbound
    sessions. The reason the source NAT is required is to make the session stick to
    the firewall so that no asymmetric routes are created.


    If you were to configure the destination NAT to rewrite the public IP for the
    internal IP without translating the source, the server would receive a packet
    with the original source IP intact and reply directly to the client, bypassing
    the firewall. The next packet from the client would be sent to the firewall, which
    would try to perform TCP session sanity checks and determine whether the TCP session
    was broken, discarding the client packet.


    Adding source translation would force the server to reply to the firewall, which
    would then forward the translated packet back to the client:


    ![](Images/B31589_03_55.png)


    Figure 3.55: U-turn NAT


    This type of complication can also be addressed by changing the DNS query to the
    internal IP of the final destination.


    ### Enable DNS Rewrite


    The **Enable DNS Rewrite** option  was introduced in PAN-OS 9.0.2 and later, and
    enables the NAT policy to be applied inside DNS response packets:


    *   It reverse translates the DNS response that matches the *translated* destination
    address in the rule. If the NAT rule rewrites `198.51.100.2` to `10.0.0.5`, the
    reverse rewrite will change the DNS response of `10.0.0.5` to `198.51.100.2.`


    *   It forward translates the DNS response that matches the *original* destination
    address in the rule. The forward DNS rewrite changes the DNS response of `198.51.100.2`
    to `10.0.0.5`.


    This could be useful in a scenario where internal hosts need to query a DNS server
    in the DMZ for an FQDN of a server also hosted in a DMZ where they receive the
    external IP in the DNS response. This could lead to odd routing issues (see the
    *U-turn or hairpin NAT* section) as the destination IP will match the external
    zone, but both the client and server are on internal zones:


    ![](Images/B31589_03_56.png)


    Figure 3.56: Enable DNS Rewrite


    If a service is hosted on several physical servers (the original destination is
    an FQDN that returns several IP addresses), the destination translation settings
    can be set to **Dynamic IP**  (**with session distribution**). The firewall will
    rewrite the destination IP according to the chosen method:


    ![](Images/B31589_03_57.png)


    Figure 3.57: Dynamic IP (with session distribution)


    This is how these session redistribution methods work:


    *   **Round Robin** assigns a new session an IP in rotating order.


    *   **Source IP Hash** assigns new sessions an IP based on a hash of the source
    IP. The same source IP will always connect to the same destination, so if there’s
    a proxy, for example, or a NAT gateway, between the clients and the firewall,
    do not use this method.


    *   **IP Modulo** assigns new sessions an IP based on the source and destination
    IP, performing an XOR and a modulo operation.


    *   **IP Hash** assigns new sessions using a hash of the source and destination
    IP.


    *   **Least Sessions** assigns new sessions to the IP addresses that have the
    least number of active concurrent sessions in the session table.


    With this information, you will now be able to resolve any NAT challenges you
    may face.


    # Summary'
  fmt: '

    If more than 64,000x oversubscription ratio concurrent sessions per source are
    needed, or source ports need to be maintained, you can opt to use `Dynamic IP`
    instead of `DIPP`. `Dynamic IP` will simply “hop” to the next available IP in
    its assigned translation addresses for a given source IP while maintaining the
    source port.


    As a fallback, if the available IP pool does get depleted because `Dynamic IP`
    does not support oversubscription, you can enable `DIPP`. The IP used in the fallback
    should not overlap with any of the main IP pools:


    ![](Images/B31589_03_53.png)


    Figure 3.53: Dynamic IP with two subnets and DIPP fallback


    In some cases, a server or host on the network will need to “own” its own IP address,
    which can be achieved with one-to-one NAT rules.


    ## One-to-one NAT


    `Static IP` will always translate a source into the same translation IP and maintain
    the source port. An IP range can be set, in which case the source IPs will be
    sequentially matched to the translated IPs, but it is important that the source
    range and translation range are identical in size; for example, `10.0.0.5-10.0.0.15`
    translates to `203.0.113.5-203.0.113.115`.


    The `Bi-directional` option creates an implied inbound NAT rule to allow inbound
    translation for the same source/translated source pairs. This implied rule reuses
    the destination zone set in the rule and `any` as the new source zone. It will
    set the translated address as the new destination of the original source to the
    new translated destination.


    For the outbound rule, as you can see in Figure 3.54 you have the following:


    *   Source: `Trust-L3`

    *   Destination: `Untrust-L3`

    *   Original source: `serverfarm`

    *   Translated source: `serverfarm-public`


    For rules that have a bi-directional set, the following implied NAT rule will
    be created. This rule will not be visible in the rule base so be very attentive
    to any rules that are set to bi-directional and what this implies: the source
    is set to `any` so the implied rule may catch unintended sessions from other zones
    than the ones you configured:


    *   Source: `any`

    *   Destination: `Untrust-L3`

    *   Original destination: `serverfarm-public`

    *   Translated destination: `serverfarm`


    ![](Images/B31589_03_54.png)


    Figure 3.54: Static IP NAT with the bi-directional option


    In some cases, “double NAT” needs to be applied to sessions that need to take
    an unusual route due to NAT. These types of NAT rules are called U-turn or hairpin
    NAT rules.


    ## U-turn or hairpin NAT


    If an internal host needs to connect to another internal host on the same subnet,
    by using its public IP address, a unique problem presents itself. For each session,
    only one NAT rule can be matched. When the client connects to the public IP, the
    routing table will want to send the packet out to the internet, which will trigger
    the hide NAT rule, which translates the source IP. (It will not trigger the normal
    destination NAT rule, as this will have `Untrust` as the source zone.)


    The packet should then go back inside as the destination public IP is also owned
    by the firewall, but a second NAT action can’t be triggered, so the packet is
    discarded.


    If the hide-NAT IP is identical to the destination IP, which is common in environments
    with few public IP addresses, the packet will be registered as a land attack:


    ```

    admin@PA-220> show counter global | match land

    Global counters:

    Elapsed time since last sampling: 26.05  seconds

    name     value  rate severity category  aspect  description

    -------------------------------------------------------------

    Flow_parse_land 1 1  drop     flow      parse    Packets dropped: land attack

    ```


    A workaround to this problem, if changing the internal DNS record so the FQDN
    resolves to an internal IP while on the local network or adding an entry to the
    host file of the client is not possible, is to configure a U-turn or hairpin NAT.


    **Important note**


    If you are using `PAN-OS 9.0.2` or later, take a look at an alternative solution
    in the Enable DNS Rewrite section.


    This type of NAT combines the destination and source NAT and must be placed at
    the top of the rule base to prevent the hide NAT rule from catching these outbound
    sessions. The reason the source NAT is required is to make the session stick to
    the firewall so that no asymmetric routes are created.


    If you were to configure the destination NAT to rewrite the public IP for the
    internal IP without translating the source, the server would receive a packet
    with the original source IP intact and reply directly to the client, bypassing
    the firewall. The next packet from the client would be sent to the firewall, which
    would try to perform TCP session sanity checks and determine whether the TCP session
    was broken, discarding the client packet.


    Adding source translation would force the server to reply to the firewall, which
    would then forward the translated packet back to the client:


    ![](Images/B31589_03_55.png)


    Figure 3.55: U-turn NAT


    This type of complication can also be addressed by changing the DNS query to the
    internal IP of the final destination.


    ## Enable DNS Rewrite


    The `Enable DNS Rewrite` option was introduced in `PAN-OS 9.0.2` and later, and
    enables the NAT policy to be applied inside DNS response packets:


    *   It reverse translates the DNS response that matches the translated destination
    address in the rule. If the NAT rule rewrites `198.51.100.2` to `10.0.0.5`, the
    reverse rewrite will change the DNS response of `10.0.0.5` to `198.51.100.2.`

    *   It forward translates the DNS response that matches the original destination
    address in the rule. The forward DNS rewrite changes the DNS response of `198.51.100.2`
    to `10.0.0.5`.


    This could be useful in a scenario where internal hosts need to query a DNS server
    in the DMZ for an FQDN of a server also hosted in a DMZ where they receive the
    external IP in the DNS response. This could lead to odd routing issues (see the
    U-turn or hairpin NAT section) as the destination IP will match the external zone,
    but both the client and server are on internal zones:


    ![](Images/B31589_03_56.png)


    Figure 3.56: Enable DNS Rewrite


    If a service is hosted on several physical servers (the original destination is
    an FQDN that returns several IP addresses), the destination translation settings
    can be set to `Dynamic IP` (`with session distribution`). The firewall will rewrite
    the destination IP according to the chosen method:


    ![](Images/B31589_03_57.png)


    Figure 3.57: Dynamic IP (with session distribution)


    This is how these session redistribution methods work:


    *   `Round Robin` assigns a new session an IP in rotating order.

    *   `Source IP Hash` assigns new sessions an IP based on a hash of the source
    IP. The same source IP will always connect to the same destination, so if there’s
    a proxy, for example, or a NAT gateway, between the clients and the firewall,
    do not use this method.

    *   `IP Modulo` assigns new sessions an IP based on the source and destination
    IP, performing an XOR and a modulo operation.

    *   `IP Hash` assigns new sessions using a hash of the source and destination
    IP.

    *   `Least Sessions` assigns new sessions to the IP addresses that have the least
    number of active concurrent sessions in the session table.


    With this information, you will now be able to resolve any NAT challenges you
    may face.


    # Summary

    '
  trans: '

    如果需要超过 64,000 倍超额订阅比率的每源并发会话，或需要维护源端口，则可以选择使用 `Dynamic IP` 而不是 `DIPP`。`Dynamic
    IP` 会在为给定源 IP 分配的转换地址中简单地“跳转”到下一个可用 IP，同时保持源端口。


    作为后备，如果可用 IP 池因 `Dynamic IP` 不支持超额订阅而耗尽，则可以启用 `DIPP`。后备中使用的 IP 不应与任何主 IP 池重叠：


    ![](img/B31589_03_53.png)


    图 3.53：具有两个子网和 DIPP 后备的 Dynamic IP


    在某些情况下，网络上的服务器或主机需要“拥有”自己的 IP 地址，这可以通过一对一 NAT 规则实现。


    ## 一对一 NAT


    `Static IP` 将始终把源转换为相同的转换 IP 并保持源端口。可以设置 IP 范围，在这种情况下，源 IP 将按顺序匹配到转换后的 IP，但源范围和转换范围的大小必须相同很重要；例如，`10.0.0.5-10.0.0.15`
    转换为 `203.0.113.5-203.0.113.115`。


    `Bi-directional` 选项会创建一个隐含的入站 NAT 规则，以允许对相同的源/转换后源对进行入站转换。此隐含规则会重用规则中设置的目标区域，并将
    `any` 作为新的源区域。它会将转换后的地址设置为原始源到新的转换后目标的新目标。


    对于出站规则，如图 3.54 所示，您有以下内容：


    *   源：`Trust-L3`

    *   目标：`Untrust-L3`

    *   原始源：`serverfarm`

    *   转换后源：`serverfarm-public`


    对于设置了双向的规则，将创建以下隐含 NAT 规则。此规则在规则库中不可见，因此请非常注意设置为双向的任何规则及其含义：源设置为 `any`，因此隐含规则可能会捕获来自您配置之外的其他区域的非预期会话：


    *   源：`any`

    *   目标：`Untrust-L3`

    *   原始目标：`serverfarm-public`

    *   转换后目标：`serverfarm`


    ![](img/B31589_03_54.png)


    图 3.54：带双向选项的 Static IP NAT


    在某些情况下，需要对因 NAT 而需要走异常路由的会话应用“双重 NAT”。这类 NAT 规则称为 U-turn 或 hairpin NAT 规则。


    ## U-turn 或 hairpin NAT


    如果内部主机需要通过其公共 IP 地址连接到同一子网上的另一个内部主机，就会出现一个独特的问题。对于每个会话，只能匹配一条 NAT 规则。当客户端连接到公共
    IP 时，路由表会希望将数据包发送到互联网，这将触发隐藏 NAT 规则，从而转换源 IP。（它不会触发正常的目标 NAT 规则，因为该规则的源区域为 `Untrust`。）


    数据包随后应返回内部，因为目标公共 IP 也由防火墙拥有，但无法触发第二次 NAT 操作，因此数据包被丢弃。


    如果隐藏 NAT IP 与目标 IP 相同，在公共 IP 地址有限的环境中很常见，数据包将被注册为 land attack：


    ```

    admin@PA-220> show counter global | match land

    Global counters:

    Elapsed time since last sampling: 26.05  seconds

    name     value  rate severity category  aspect  description

    -------------------------------------------------------------

    Flow_parse_land 1 1  drop     flow      parse    Packets dropped: land attack

    ```


    如果无法更改内部 DNS 记录，使 FQDN 在本地网络上解析为内部 IP，或在客户端的主机文件中添加条目，则解决此问题的变通方法是配置 U-turn 或
    hairpin NAT。


    **重要提示**


    如果您使用的是 `PAN-OS 9.0.2` 或更高版本，请查看 Enable DNS Rewrite 部分中的替代解决方案。


    这种类型的 NAT 结合了目标 NAT 和源 NAT，必须放在规则库的顶部，以防止隐藏 NAT 规则捕获这些出站会话。需要源 NAT 的原因是使会话保持在防火墙上，从而不创建不对称路由。


    如果您配置目标 NAT 将公共 IP 重写为内部 IP 而不转换源，则服务器将收到带有原始源 IP 完整的数据包并直接回复客户端，从而绕过防火墙。客户端的下一个数据包将被发送到防火墙，防火墙将尝试执行
    TCP 会话健全性检查并确定 TCP 会话是否已中断，从而丢弃客户端数据包。


    添加源转换将强制服务器回复防火墙，防火墙然后将转换后的数据包转发回客户端：


    ![](img/B31589_03_55.png)


    图 3.55：U-turn NAT


    这种复杂性也可以通过将 DNS 查询更改为最终目标的内部 IP 来解决。


    ## 启用 DNS 重写


    `Enable DNS Rewrite` 选项在 `PAN-OS 9.0.2` 及更高版本中引入，并使 NAT 策略能够应用于 DNS 响应数据包内部：


    *   它会反向转换与规则中转换后的目标地址匹配的 DNS 响应。如果 NAT 规则将 `198.51.100.2` 重写为 `10.0.0.5`，则反向重写会将
    `10.0.0.5` 的 DNS 响应更改为 `198.51.100.2.`

    *   它会正向转换与规则中原始目标地址匹配的 DNS 响应。正向 DNS 重写会将 `198.51.100.2` 的 DNS 响应更改为 `10.0.0.5`。


    这在内部主机需要向 DMZ 中的 DNS 服务器查询也托管在 DMZ 中的服务器的 FQDN 的场景中可能很有用，在该场景中它们在 DNS 响应中接收外部
    IP。这可能导致奇怪的路由问题（参见 U-turn 或 hairpin NAT 部分），因为目标 IP 将与外部区域匹配，但客户端和服务器都在内部区域：


    ![](img/B31589_03_56.png)


    图 3.56：启用 DNS 重写


    如果服务托管在多个物理服务器上（原始目标是一个返回多个 IP 地址的 FQDN），则可以将目标转换设置设置为 `Dynamic IP`（`with session
    distribution`）。防火墙将根据所选方法重写目标 IP：


    ![](img/B31589_03_57.png)


    图 3.57：Dynamic IP（带会话分发）


    这些会话重新分发方法的工作方式如下：


    *   `Round Robin` 以轮转顺序为新会话分配 IP。

    *   `Source IP Hash` 根据源 IP 的哈希为新会话分配 IP。相同的源 IP 将始终连接到相同的目标，因此如果客户端和防火墙之间存在代理，例如，或
    NAT 网关，请勿使用此方法。

    *   `IP Modulo` 根据源 IP 和目标 IP 为新会话分配 IP，执行 XOR 和取模运算。

    *   `IP Hash` 使用源 IP 和目标 IP 的哈希为新会话分配。

    *   `Least Sessions` 将新会话分配给会话表中活动并发会话最少的 IP 地址。


    有了这些信息，您现在将能够解决可能遇到的任何 NAT 挑战。


    # 摘要

    '
