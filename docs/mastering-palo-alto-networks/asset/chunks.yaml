    \ App-ID classifies applications\n\nWhen a packet is received, `App-ID` will go\
    \ through several stages to identify just what something is:\n\n1. First, the\
    \ `6-Tuple` is checked against the security policy to verify whether a certain\
    \ source, destination, protocol, and port combination is allowed. This will take\
    \ care of low-hanging fruit if all the unnecessary ports have been closed off\
    \ and *unusual* destination ports can already be rejected.\n2. Next, the packets\
