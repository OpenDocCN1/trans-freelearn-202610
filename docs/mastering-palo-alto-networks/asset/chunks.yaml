- raw: "        The official best practice profiles may look a little different than\
    \ they have been laid out here. This is because Palo Alto splits up every severity\
    \ (but with exactly the same settings). So, the preceding example is a little\
    \ more efficient!\n\nYour profile will now look like this:\n\n![](Images/B31589_03_04.png)\n\
    \nFigure 3.4: Anti-Spyware Profile\n\nThe critical, high, and medium severity\
    \ threats have an overall high ratio of being genuinely malicious, so resetting\
    \ the connection is considered best practice. Collecting a packet capture for\
    \ these threats can help us find out whether something that was blocked is false.\
    \ Low and informational severity threats have a high likelihood of being purely\
    \ informational and can be left as the default action.\n\nAs you can see in the\
    \ following screenshot, we need to make sure we review **Category** as this allows\
    \ a fine-grained approach to each type of threat if granularity and individualized\
    \ actions are needed at a later stage:\n\n![](Images/B31589_03_05.png)\n\nFigure\
    \ 3.5: Anti-Spyware categories\n\nThe Anti-Spyware profile also contains DNS signatures,\
    \ which are split into two databases for the subscription services. The content\
    \ DNS signatures are downloaded with the threat prevention dynamic updates. The\
    \ DNS Security database uses dynamic cloud lookups.\n\nThe elements in each database\
    \ can be set to **Alert**, **Allow**, **Block**, or **Sinkhole**. **Sinkhole**\
    \ uses a DNS poisoning technique that replaces the IP in the DNS reply packet,\
    \ so the client does get a valid DNS reply, but with an altered destination IP.\
    \ This ensures that infected endpoints can easily be found by filtering traffic\
    \ logs for sessions going to the sinkhole IP. You can keep using the Palo Alto\
    \ Networks default sinkhole, `sinkhole.paloaltonetworks.com`, or use your preferred\
    \ IP.\n\nThe way that the DNS sinkhole works is illustrated by the following steps\
    \ and diagram:\n\n1.  The client sends a DNS query to resolve a malicious domain\
    \ to the internal DNS server.\n\n2.  The internal DNS relays the DNS lookup to\
    \ an internet DNS server.\n\n3.  The firewall inserts a poisoned reply to the\
    \ DNS query to the internal DNS server with a record pointing to the sinkhole\
    \ IP.\n\n4.  The DNS reply is forwarded to the client.\n\n5.  The client makes\
    \ an outbound connection to the sinkhole IP, instead of the malicious server.\
    \ The admin immediately knows which host is potentially infected and is trying\
    \ to set up **command and control** (**C2**) connections:\n\n![](Images/B31589_03_06.png)\n\
    \nFigure 3.6: How a DNS sinkhole works\n\nBlocking instead of sinkholing these\
    \ DNS queries would implicate the internal DNS server as requests are relayed\
    \ through it.\n\nThe default action for the **Command and Control** and **Malware**\
    \ domains is to block the DNS reply, as sinkholing could trigger more evasive\
    \ behavior. Therefore, it is recommended to leave these categories at their default\
    \ settings. Select an appropriate action for all the other categories. For research\
    \ purposes, you can enable packet capture.\n\nIn PAN-OS 11.2 and later, in the\
    \ **DNS Zone Misconfiguration** field, you can add public-facing *parent* domains\
    \ within your network. Advanced DNS security can monitor these domains for misconfigurations\
    \ such as abandoned subdomains that could be abused by malicious actors.\n\nAt\
    \ the bottom of this tab, we can select SVCB (type 64), HTTPS (type 65), and ANY\
    \ (type 255), which are DNS resource record types used by encrypted DNS to encrypt\
    \ the client hello during the DNS resolution process. Blocking these will prevent\
    \ encrypted DNS sessions from being established, ensuring you can keep applying\
    \ DNS security:\n\n![](Images/B31589_03_07.png)\n\nFigure 3.7: Anti-Spyware DNS\
    \ signatures\n\nAny false positives or trusted sites that somehow are malicious\
    \ can be added to **DNS Exceptions **so they will no longer be blocked or sinkholed.\n\
    \nOn the **Inline Cloud Analysis** tab, we can enable inline cloud analysis and\
    \ define actions to be taken for each protocol where C2 traffic can be detected\
    \ by local deep learning analysis engines. If certain domains or IP addresses\
    \ should be excluded from this inspection, you can add an **external dynamic list**\
    \ (**EDL**; we’ll learn about these later) or IP in the fields shown in the following\
    \ screenshot:\n\n![](Images/B31589_03_08.png)\n\nFigure 3.8: Inline Cloud Analysis\n\
    \nLet’s now look at the Vulnerability Protection profile.\n\n## The Vulnerability\
    \ Protection profile\n\nThe Vulnerability Protection profile also uses rules to\
    \ control how certain network-based attacks are handled. **Action** contains the\
    \ same options as Anti-Spyware: **allow**, **drop**, **alert**, **reset-client**,\
    \ **reset-server**, **reset-both**, and **block-ip**.\n\nThe reset actions send\
    \ TCP RST packets. **block-ip** blocks all packets coming from a source and can\
    \ be set to **monitor source** to block everything, or a source destination to\
    \ only block packets to a specific destination for an amount of time.\n\n**Host\
    \ Type** determines whether the rule applies to a threat directed at a client\
    \ (download: for example, a browser vulnerability), server (upload: for example,\
    \ SQL injection), or any.\n\nMake sure to review the available **Categories**\
    \ because they, just like we saw in *Figure 3**.4* in Anti-Spyware, can allow\
    \ far more granularity if needed:\n\n![](Images/B31589_03_09.png)\n\nFigure 3.9:\
    \ The Vulnerability Protection profile categories\n\nCreate the following rules:\n\
    \n*   **Rule Name:** **Block-Critical-High-Medium** \n\n    *   **Host Type:**\
    \ **any**\n\n    *   **Severity:** **critical, high, medium**\n\n    *   **Action:**\
    \ **reset-both**\n\n    *   **Packet Capture:** **single-packet**\n\n*   **Rule\
    \ Name:** **Default-low-info** \n\n    *   **Host Type:** **any**\n\n    *   **Severity:**\
    \ **low**, **informational**\n\n    *   **Action:** **default**\n\n    *   **Packet\
    \ Capture:** **disable**\n\nYour profile should now look like this:\n\n![](Images/B31589_03_10.png)\n\
    \nFigure 3.10: Vulnerability Protection Profile\n\nThe profile will reset any\
    \ connection matching critical, high, or medium severity threats and will collect\
    \ a packet sample of the threat for research or forensics. Low and informational\
    \ threats can be left to the default settings.\n\nWhile these rules will provide\
    \ good coverage for all signatures that match a certain severity, you may need\
    \ to add a rule for a specific CVE at some point. If you create a new rule, you\
    \ can tailor it to a specific CVE or even a specific vendor.\n\nCVE codes are\
    \ maintained by MITRE at https://cve.mitre.org\n\nThe vendor IDs will usually\
    \ be posted by the vendor and will have a similar format to, for example, Palo\
    \ Alto’s PAN-SA-yyyy-nnnn or Microsoft’s MSyy-nnn. If you want to, for example,\
    \ filter out a specific year, you could add PAN-SA-2024 to the vendor ID. Remember\
    \ to put the more specific rules matching CVEs or Vendor IDs at the top of the\
    \ rules.\n\nOn the **Inline Cloud Analysis** tab, you can enable inline machine-learning-powered\
    \ detection for SQL injection attacks or command injection attacks. You can add\
    \ a URL-based or IP-based EDL in the **Exclude from Inline Cloud Analysis** section\
    \ so that they are not inspected, which can be useful for development environments\
    \ where you could encounter many false positives:\n\n![](Images/B31589_03_11_new.png)\n\
    \nFigure 3.11: Vulnerability Protection Inline Cloud Analysis\n\nIn the next subsection,\
    \ we will learn about the categories of the URL Filtering profile.\n\n## URL Filtering\
    \ profile\n\nURL Filtering leverages URL categories to determine what action to\
    \ take for each category.\n\nThere are two groups of categories: custom URL categories\
    \ and the dynamic categories provided by the URL Filtering license.\n\n### Custom\
    \ URL categories\n\nCustom URL categories do not require a license, so you can\
    \ create these objects and apply URL Filtering even without access to the URL\
    \ Filtering license.\n\nGo to **Objects** | **Custom Objects** | **URL Category**\
    \ to create a new custom category and add websites. There are two types of custom\
    \ categories:"
