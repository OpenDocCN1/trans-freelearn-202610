  trans: "\n这与通过安全配置文件进行的 URL 过滤不同，因为 URL 过滤会将会话中发现的 URL 与所有预定义的 URL 类别和自定义 URL 类别进行比较。这可能会因类别重叠而带来复杂性，或使规则过于宽泛。\n\
    \n例如，如果只需要允许或拒绝特定类别，传统的 URL 过滤安全配置文件就需要设置为允许所需的类别并阻止所有其他类别，这可能会破坏其他更通用的网页浏览安全规则。一个典型的例子是打印机或其他\
    \ IoT 设备，它需要访问预设的 URL 列表以接收更新或报告指标，但不需要其他 URL 类别。在安全规则中直接使用自定义 URL 类别可将该设备的访问限制为仅这些\
    \ FQDN。\n\n## 控制日志记录和计划\n\n默认情况下，每个安全规则都设置为 `Log at Session End`。这意味着只有在会话结束时才会将日志写入流量日志。对于某些会话，可能需要记录更多交互，因此可以启用\
    \ `Log at Session Start`。不过这会带来相当大的开销，因为在收到 SYN 数据包时以及每次应用切换时，会话的每个新阶段都会产生一条日志。因此，单个会话可能会有两到五条额外的日志条目。\n\
    \n其他非常健谈或相关性较低的应用可能根本不需要记录，例如 DNS。\n\n### 重要说明\n\n即使在安全规则操作选项卡中同时禁用了开始和结束日志，会话中检测到的任何威胁仍会记录到威胁日志中。\n\
    \n日志转发可用于将日志转发到 Panorama、Strata Logging Service 或 syslog 服务器，或发送电子邮件。如果将其中一个日志转发配置文件命名为\
    \ default，它将自动添加到创建的每个新安全规则中：\n\n![](img/B31589_03_42.png)\n\n图 3.42：日志选项和计划\n\
    \n`Schedule` 可用于创建此安全规则处于活动状态的时间段，如果某些应用仅在一天中的特定时间允许使用（例如，Facebook 可在午餐时间和下班后允许）：\n\
    \n![](img/B31589_03_43.png)\n\n图 3.43：计划\n\n在继续将这些新知识付诸实践并开始创建更多规则之前，让我们回顾一下如何准备地址对象，以便规则库更易读，并且可以在多个规则中重用相似对象。\n\
    \n## 地址对象\n\n为了更轻松地管理安全和 NAT 策略中的目标，您可以通过 `Objects` | `Addresses` 创建地址对象。在此处创建新对象后，您可以在不同规则中重用同一对象，如果有任何更改，只需更改地址对象，所有安全和\
    \ NAT 规则就会自动更新：\n\n1. 单击 `Add` 并为地址提供描述性名称。设置命名约定是一个良好的做法，以便您可以对所有其他地址对象重复此过程。一个好的示例是为所有服务器名称添加\
    \ `S_` 前缀，为所有网络添加 `N_` 前缀，以便易于识别。\n\n2. 如需设置描述。\n\n3. 选择此对象的类型：\n\n   * `IP Netmask`\
    \ 允许您为单个 IPv4 或 IPv6 地址设置带有子网掩码的 IP，最低可至 `/32` 或 `/64`（无需添加 `/32`）。\n\n   * `IP\
    \ Range` 允许您定义一个范围，其中包含范围中第一个和最后一个 IP 之间的所有 IP 地址，以破折号 `-` 分隔。\n\n   * `IP Wildcard\
    \ Mask` 允许您设置覆盖二进制匹配的子网掩码，其中零位要求 IP 位完全匹配，而 `1` 为通配符。因此，例如，通配符子网 `0.0.0.254` 翻译为\
    \ `000000000.0000000.0000000.11111110`。前三个字节已设置，最后一个字节中除第一位外的所有位都是通配符。这意味着如果关联的\
    \ IP 地址设置为 `10.0.0.2` (`00001010.0000000.000000.00000010`)，则子网中以 0 结尾的所有 IP 都会匹配（即所有偶数\
    \ IP 地址）。如果 IP 设置为 `10.0.0.1`，则所有奇数 IP 都会匹配。此类型对象只能在安全规则中使用。\n\n   * `FQDN` 允许您设置防火墙将根据\
    \ `time to live` (`TTL`) 定期解析并缓存的域名。每个 FQDN 对象最多支持 `10 A` 或 `AAAA` 记录。使用 `Resolve`\
    \ 链接验证域名是否可以解析。\n\n4. 添加标签以便轻松识别和筛选此对象的策略。\n\n5. 单击 `OK`。\n\n一旦您拥有相似的对象集合，还可以通过\
    \ `Objects` | `Address Groups` 创建组。这些组可用于将对象捆绑以供安全或其他策略使用。\n\n## 标签\n\n标签可用于对许多其他对象进行分组、筛选或轻松识别。安全区域、策略规则或地址对象都可以为每个对象标记多达\
    \ 64 个标签。通过 `Objects` | `Tags`，您可以创建新标签：\n\n1. 单击 `Add` 并为标签创建描述性且最好简短的名称（最多 `127`\
    \ 个字符）。您还可以使用下拉菜单选择其中一个已创建的安全区域，这将导致标签自动分配给该区域。\n\n2. 选择颜色或将其保留为 `None`。\n\n3.\
    \ 添加注释。\n\n4. 单击 `OK`。\n\n如以下屏幕截图所示，标签随后可用于视觉上增强规则库或筛选特定类型的规则：\n\n![](img/B31589_03_44.png)\n\
    \n图 3.44：安全策略中的标签\n\n在构建安全规则时，对象（例如地址、应用程序和服务）可以从左侧的对象浏览器中单击并拖动到任何规则中，并从一个规则拖动到另一个规则。无需打开规则并导航到适当的选项卡来添加对象。\n\
    \n过一段时间后，您需要审查已构建的安全规则库，以确保没有遗漏任何应用程序、规则未设置得过于宽松，或存在导致规则未使用的重复项。让我们看看如何做到这一点。\n\
    \n## 策略优化器\n\n当您位于 `Security` 或 `NAT policy` 选项卡时，左下角有一个名为 `Policy Optimizer`\
    \ 的工具，可通过跟踪规则使用情况来帮助改进安全规则。Policy Optimizer 记录与规则相关的统计信息，并可报告以下内容：\n\n* 已闲置 30\
    \ 天、90 天或所有时间的规则，以便您可以删除它们\n\n* 设置为未定义应用程序且被这些规则接受的应用程序的规则\n\n* 具有未使用的应用程序的规则，以便您可以删除这些多余的应用程序\n\
    \n在规则库投入生产一段时间后，Policy Optimizer 的输出将开始类似于以下屏幕截图：\n\n![](img/B31589_03_45.png)\n\
    \n图 3.45：策略优化器\n\n与 Policy Optimizer 配合使用，每个规则还具有一个名为 `Apps Seen` 的列。\n\n### Apps\
    \ Seen 列\n\n每个安全规则还将收集有关流经其的应用的信息。此信息可从安全策略中的 `Apps Seen` 列访问：\n\n![](img/B31589_03_46.png)\n\
    \n图 3.46：已见应用\n\n所有检测到的应用程序都可以添加到当前规则、现有规则或从当前规则克隆的规则中。\n\n## 创建 NAT 规则\n"
