    \     172.16.0.1    0      A\nC    ethernet1/3                \n172.16.0.1/32\
    \     0.0.0.0       0      A\nH                                              \
    \                     \ntotal routes shown: 7\n```\n\nLet’s assume `ethernet1/1`\
    \ is the external interface with IP address `198.51.100.2` set to zone `external`,\
    \ `ethernet1/2` is the `DMZ` interface with IP address `192.168.0.1` set to zone\
