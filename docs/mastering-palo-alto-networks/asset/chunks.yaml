  trans: '

    The number next to `Interface Name` is an identification number for the logical
    interface.


    ### 重要提示

    为了获得强大的安全态势，请为各个 VPN 连接设置单独的区域，即使是已知位置。将每个连接和远程网络视为单独的区域可确保足够的可见性和控制。如果 VPN 隧道为所有远程办公室设置相同的区域，远程办公室可能会暴露于恶意软件（想想
    WannaCry）并感染其他办公室。默认的 `intrazone` 安全规则允许所有会话运行且不应用扫描。


    还有几种提供特定功能的“special”接口类型；我们将在以下章节介绍特殊用例接口。


    当交换机上行链路需要包含多个 `802.1q` VLAN 标签时，可以将其配置为中继，并且在防火墙上可以创建子接口以对应每个 VLAN 标签。


    ## 子接口

    所有物理（即 `Layer 2`、`Layer 3`、`VWire` 和 `Aggregate`——我们将在本章稍后介绍这种类型的接口）接口都可以拥有子接口。当物理接口连接到包含
    `VLAN` (`802.1Q`) 标记数据包的中继链路时，会使用子接口。物理接口无法解释这些标签，但子接口可以。对于中继承载的每个 `VLAN`，您可以创建一个子接口来表示来自交换机的虚拟网络。使用子接口的优点是每个
    `VLAN` 都可以与其自己的安全区域关联。


    子接口将模仿其父物理接口的所有配置细节，但接口类型不能与物理接口类型不同（例如，`Layer 3` 物理接口不能承载 `Layer 2` 子接口）。


    您可以通过选择所需的物理接口并在 `Network | Interfaces` 的左下角单击 `Add Subinterface` 来创建这些接口：


    ![](img/B31589_02_68.png)


    图 2.68：创建子接口


    ## HA 接口

    `High Availability` (`HA`) 接口在设置两个防火墙的集群时是必需的。某些机箱将具有内置专用 HA 接口，在这种情况下，您可能无需自行创建任何
    HA 接口。如果没有板载 HA 接口，或需要额外的接口作为备份 HA 链路，则可以选择数据平面接口来履行此角色并连接到 HA 对端。


    ## AE 接口

    为了将可用带宽提高到接口的物理限制之上，可以使用 `802.1AX` 协议将接口捆绑到 `Aggregated Ethernet` (`AE`) 组中。最多可将八个接口组合成一个逻辑捆绑。


    可以通过在 `Network | Interfaces | Ethernet` 下单击 `Add Aggregate Group` 来创建新组。


    您首先需要将类型设置为 `Layer 2`、`Layer 3`、`VWire` 或 `HA`，这将需要与物理接口等效的相同配置（即安全区域、`VR`、`VLAN`
    或 `VWire`）。


    此外，您可以配置 `Link Aggregation Control Protocol` (`LACP`) 以改善接口故障检测。`LACP` 可在物理层和数据链路层上启用链路故障检测，而默认协议仅检测物理链路故障。


    您可以设置防火墙处于 `Active` 或 `Passive` 模式。此配置设置需要与 `LACP` 对端（通常是交换机）一起审查，因为只能将一个对端配置为
    `Active`，但如果两者都设置为 `Passive`，`LACP` 将无法工作。


    `Transmission Rate` 的值会影响链路故障检测的响应能力，但也会产生开销。慢速传输意味着每 30 秒一次，而快速传输意味着每秒一次。


    `Fast Failover` 将在接口宕机时在 1 秒内切换到运行中的接口。传统故障转移在 3 秒后发生。


    `System Priority` 决定哪个对端确定端口优先级。


    `Maximum Interfaces` 决定聚合组中同时可以处于活动状态的接口数量。此数字不应超过分配给该组的物理接口数量，但可以利用它来限制总可用带宽，同时在发生故障时保留热备接口。例如，如果聚合组需要总带宽为
    4 千兆位，但您也不想超过此带宽以保留系统资源，则可以将五个或更多接口分配给聚合组，并将 `Maximum Interfaces` 设置为 `4`。只有在接口故障时才会激活另一个接口来接管工作。在
    HA 配置中，两个防火墙形成集群时，可以在被动对端上启用 `LACP`，以便在被动对端需要承担活动角色之前预先协商链路聚合组，从而减少故障转移所需的时间。


    这是通过选中 `Enable in HA Passive State` 实现的。两个集群成员可以使用相同的系统 MAC，但连接的交换机可能不支持此功能。下图显示了这一点：


    ![](img/B31589_02_69.png)


    图 2.69：LACP


    创建聚合组后，您可以通过将 `Interface Type` 设置为 `Aggregate Ethernet` 并选择所需的 `Aggregate Group`
    来添加接口：


    ![](img/B31589_02_70.png)


    图 2.70：聚合组中的物理接口


    在某些情况下，您可能需要能够连接到交换机上的端口镜像并仅监听而不参与。对于此类情况，您可以配置 `Tap` 接口。


    通过上一节介绍的信息，您现在能够为遇到的每个网络设计选择合适的接口。`VWire` 可帮助您在无法干扰现有路由的环境中添加防火墙，`Layer 3` 接口将防火墙置于路由决策的中间，`Layer
    2` 接口使防火墙的行为类似于交换机，并且可以为所有这些接口添加子接口以考虑 `VLAN` 标签。您能够配置链路聚合并可以利用隧道接口设置 `IPSec`
    隧道。


    # 摘要

    在本章中，您学习了如何创建支持账户、注册新设备并添加许可证。您现在能够识别所有不同的支持许可证并选择合适的订阅许可证来满足您的需求。您可以升级和更新设备，使其固件保持最新，并加载最新的应用程序和威胁签名以保护网络。您学习了如何保护管理接口，以便只有合法用户才能连接，并且您可以为管理员分配不同的访问权限和特权。您能够配置所有物理接口，如
    `Layer 3` 和 `VWire`，并知道何时最合适使用。您还可以根据需要利用隧道接口和环回接口等逻辑接口。


    如果您正在准备 `PCNSE`，请注意升级需要在继续进行维护版本之前下载基本映像。动态更新的推荐阈值为 6 至 12 小时（除非设备位于关键环境中，在这种情况下阈值应为
    24 小时），并且您应该能够识别所有接口类型之间的差异。


    在下一章中，我们将开始构建强大的安全策略并学习如何为网络流量设置强大的安全态势。


    # 3


    ## 构建强大的策略

    在本章中，您将熟悉配置安全配置文件、为安全构建规则库以及 `network address translation` (`NAT`)。我们将学习每个设置的作用、其预期行为以及如何利用它来实现预期结果。对不同规则库中所有可用功能的完全控制将使您能够采取强大的安全立场。

    '
