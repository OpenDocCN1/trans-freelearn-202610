    \ and any threats trying to slip through can be stopped in their tracks.\n\n在本章结束时，您将能够设置一套完整的规则集，以确保您的用户能够访问所需的应用程序和资源，内部托管的服务器可以从互联网访问，并且任何试图渗透的威胁都将被拦截。\n\
    \n# Technical requirements\n\n# 技术要求\n\nBefore you get started, your firewall\
