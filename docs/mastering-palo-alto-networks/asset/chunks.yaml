- raw: 'For a full list, there’s a good online resource describing all the contexts
    at [https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000ClOFCA0](https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000ClOFCA0).
    However, many contexts will be self-explanatory, as you can see in the following
    screenshot:


    ![](Images/B31589_03_24.png)


    Figure 3.24: Creating signatures


    *   A **pattern** or **value**: If you want to, for example, match a hostname
    in an HTTP request header, you would use the `domain\.tld` RegEx, where the backslash
    indicates that the dot following it is an exact match for a dot and not a RegEx
    wildcard.


    The available RegEx wildcard characters include the following:


    ![](Images/B31589_03_25.png)


    Figure 3.25: Supported RegEx wildcard characters


    *   A **qualifier** can further limit at which stage of a transaction a pattern
    can be matched, either in method or type. Using a qualifier is optional:


    ![](Images/B31589_03_26.png)


    Figure 3.26: Host header pattern


    A good tool to capture usable payload information from a session is Wireshark,
    which you can download from [https://wireshark.org](https://wireshark.org).


    With the above custom objects, you are able to identify sessions behaving in a
    specific way, but this process can also be applied to identify information and
    keywords inside a session.


    ### The custom data pattern


    In the custom data pattern, you can add strings of sensitive information or indicators
    of sensitive information being transmitted. There is a set of predefined patterns,
    including social security numbers, credit card numbers, and several other identification
    numbers. You can use RegEx to match exact strings in documents or leverage file
    properties. Once the appropriate parameters have been chosen, you can add these
    custom data patterns to a Data Filtering profile and, as you can see in the following
    screenshot, assign weights. These weights determine how many times a certain marker
    can be hit in a session before an alert is generated in the form of a log entry
    and when a session should be blocked for suspicious behavior (for example, it
    might be acceptable for an email to go out containing one social security number,
    but not multiple):


    ![](Images/B31589_03_27.png)


    Figure 3.27: Data Filtering Profile


    Now that you’ve had a chance to review and configure all the available security
    profiles, the easiest way to apply them to security rules is by using security
    profile groups.


    ## Security profile groups


    Now that you’ve prepared all of these security profiles, create a new security
    profile group, as shown in the following screenshot, and call it **default**.
    This will ensure that the group will automatically be added to every new security
    rule you create (it is not added to existing rules, so make sure to review them):


    ![](Images/B31589_03_28.png)


    Figure 3.28: The default security profile group


    It is not harmful to add *all* of the security policies to a security rule as
    Content-ID will intelligently only apply appropriate signatures and heuristics
    to applications detected in the session (for example, HTTP signatures will not
    be matched with FTP sessions).


    Also, create a Log Forwarding profile in **Objects | Log Forwarding** called **default**,
    but you can leave the actual profile empty for now. This serves the same purpose
    as the default security profile group in that it automatically populates the log-forwarding
    action of each new security rule. It is easier to update the profile than to have
    to add a profile to each rule later on.


    You are now able to build your own security profiles and add custom signatures
    where needed. With the information you have learned, you will be able to ensure
    the security rules we will be creating in the next section are set to block threats
    and scan content.


    # Understanding and building security rules


    We now need to build some security rules to allow or deny traffic in and out of
    the network. The default rules will only allow intrazone traffic and will block
    everything else, as you can see here:


    ![](Images/B31589_03_29.png)


    Figure 3.29: Default security rules


    In the following sections, we will start to build a rule base, making sure we
    first introduce some rules to drop undesirable sources and destinations, followed
    by adding permissive policies focused on allowing applications required by the
    users in a secure way, leveraging App-ID to ensure only the intended applications
    are let through. Finally, we’ll look in more detail at which objects make up rule
    bases and how the rules can be kept tidy after having been in use for a while.


    We will first make sure “bad” traffic is dropped by creating two new rules—one
    for inbound and one for outbound traffic.


    ## Dropping “bad” traffic


    The inbound rule will have the external zone as a source and the four EDLs containing
    known malicious addresses. These lists are updated via the threat prevention dynamic
    updates, so if you do not see them, make sure you have the Threat Prevention license
    and have downloaded and installed the latest content packages. Add a descriptive
    name and any relevant tags on the **General** tab. The **Source** tab should look
    similar to the following:


    ![](Images/B31589_03_30_new.png)


    Figure 3.30: Reconfigured external dynamic lists


    In the **Destination** tab, set the destination zones to both the external zone
    and any zone where you intend to host internal servers to which you will allow
    inbound NAT (for example, corporate mail or web servers) and set the destination
    addresses to **Any**, as in the following screenshot:


    ![](Images/B31589_03_31.png)


    Figure 3.31: Security rule destination zones


    We’ll leave the **Application** and **Service/URL Category** tabs default for
    now. In the **Actions** tab, set the action to **Drop**. This will silently discard
    any inbound packets:


    ![](Images/B31589_03_32.png)


    Figure 3.32: Security rule actions


    Follow the next steps to create the above inbound drop rule:


    1.  Create a new security rule and give it a descriptive name, like Malicious
    EDL Inbound Drop.


    2.  Additional information can be added in the Description field.


    3.  Set the source zone to any zone that is connected to the internet (for example,
    Untrust).


    4.  Set the source addresses to the four (or a subset) predefined EDLs.


    5.  Set the destination zones to your internal zones that will accept inbound
    connections from the internet (for example, DMZ), also including the external
    zones, or simply use the any option.


    6.  Set the action to Drop.


    **Important note**


    You may have noticed that the **Profile Setting** fields and **Log Forwarding**
    are filled out with the **default**  profiles that you created in the previous
    step. In all rules where sessions are blocked, content scanning will not take
    place, so having these profiles will not cause overhead.


    Click **OK**, and then make the reverse rule, as in the following screenshot,
    setting the source zones to your internal zones, the destination to the external
    zone, and the predefined EDL as addresses. If you changed the DNS sinkhole IP
    address to one of your choosing, add this IP here as well:


    ![](Images/B31589_03_33.png)


    Figure 3.33: Outbound drop rules


    Follow these steps to create the above outbound drop rule:


    1.  Create a new security rule and give it a descriptive name, like `Malicious
    EDL Outbound Drop`.


    2.  Set the source zone to your internal zones (for example, **Trust**, **DMZ**).


    3.  Set the destination zone to any zone leading out to the internet (for example,
    **Untrust**).


    4.  Set three destination addresses and, for each one, select one of the predefined
    EDLs.


    5.  Set **Action** to **Drop**.'
