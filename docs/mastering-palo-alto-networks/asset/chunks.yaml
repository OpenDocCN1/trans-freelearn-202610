    \nIt is important to note that there are implied rules that influence intrazone\
    \ or interzone sessions. These rules can be found at the bottom of the security\
    \ policy:\n\n* **Default intrazone connections**: Packets flowing from and to\
    \ the same zone will be implicitly allowed\n* **Default interzone connections**:\
    \ Packets flowing from one zone to a different zone are implicitly blocked\n\n\
    Security rules can be set to only accept traffic within the same zone, between\
    \ different zones only, or both. This setting can be changed in the rule `Type`\
    \ and is set to `Universal` by default. As illustrated in *Figure 1.3*, the `Universal`\
