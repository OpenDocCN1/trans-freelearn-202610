- raw: 'In this chapter, you learned how to create security profiles and how to build
    a set of profiles that influence how your firewall processes threats. You learned
    how to create security profiles that leverage best practices and can add these
    to a default security profile group so that your security rule base starts off
    with a strong protection stance. You are also able to create complete security
    rules that leverage reusable objects, have easy-to-identify tags, and are set
    to allow all desirable access based on application identification rather than
    ports. You can now make complex NAT policies that cater to the needs of your inbound
    and outbound connections.


    If you’re studying for the PCNSE, take specific note of how the best practice
    security profiles are set with reset-both and single-packet packet capture for
    critical, high, and medium severity, while low and informational are set to default
    with no packet capture. Remember how zones play an important role in the original
    packet tab of NAT rules. Remember the importance and implications of App-ID with
    application-default and how application filters can be used to define behavior
    rather than needing to account for all applications manually.


    In the next chapter, we will see how to take even more control of your sessions
    by leveraging policy-based routing to segregate business-critical sessions from
    the general internet, limit bandwidth-hogging applications with quality of service,
    and look inside encrypted sessions with SSL decryption.'
  fmt: '

    In this chapter, you learned how to create security profiles and how to build
    a set of profiles that influence how your firewall processes threats. You learned
    how to create security profiles that leverage best practices and can add these
    to a default security profile group so that your security rule base starts off
    with a strong protection stance. You are also able to create complete security
    rules that leverage reusable objects, have easy-to-identify tags, and are set
    to allow all desirable access based on application identification rather than
    ports. You can now make complex NAT policies that cater to the needs of your inbound
    and outbound connections.


    If you’re studying for the PCNSE, take specific note of how the best practice
    security profiles are set with reset-both and single-packet packet capture for
    critical, high, and medium severity, while low and informational are set to default
    with no packet capture. Remember how zones play an important role in the original
    packet tab of NAT rules. Remember the importance and implications of App-ID with
    application-default and how application filters can be used to define behavior
    rather than needing to account for all applications manually.


    In the next chapter, we will see how to take even more control of your sessions
    by leveraging policy-based routing to segregate business-critical sessions from
    the general internet, limit bandwidth-hogging applications with quality of service,
    and look inside encrypted sessions with SSL decryption.

    '
  trans: '

    在本章中，你学习了如何创建安全配置文件以及如何构建一组配置文件，从而影响防火墙处理威胁的方式。你学习了如何创建利用最佳实践的安全配置文件，并可以将这些配置文件添加到默认的安全配置文件组中，以便你的安全规则库从一开始就具备强大的防护态势。你还可以创建完整的安全规则，这些规则利用可重用对象，具有易于识别的标签，并且设置为基于应用识别而非端口来允许所有期望的访问。你现在可以创建复杂的
    NAT 策略，以满足入站和出站连接的需求。


    如果你正在备考 PCNSE，请特别注意最佳实践安全配置文件是如何设置的：对于严重性为 critical、高和中等的，设置为 reset-both 和单包数据包捕获，而低和信息级别则设置为默认且不进行数据包捕获。请记住区域在
    NAT 规则的原始数据包选项卡中扮演的重要角色。请记住 App-ID 与 application-default 的重要性和影响，以及如何使用应用过滤器来定义行为，而无需手动考虑所有应用程序。


    在下一章中，我们将了解如何通过利用基于策略的路由来进一步控制你的会话，将业务关键会话与普通互联网隔离开来，利用服务质量限制占用带宽的应用，并通过 SSL 解密查看加密会话内部。

    '
