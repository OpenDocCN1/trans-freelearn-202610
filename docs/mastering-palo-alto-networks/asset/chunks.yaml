    ## URL 过滤


    部分网站可能属于多个类别，并且还可能列在自定义类别或外部动态 URL 列表中。`URL Filtering` 决定应用哪个操作的方式基于应用于它的操作的严重程度，以及它是否在自定义类别、外部动态
    URL 列表或预定义类别中。按严重程度降序排列的操作如下：


    1. `Block`

    2. `Override`

    3. `Continue`

    4. `Alert`

    5. `Allow`


    类别顺序如下：


    1. `Custom URL categories`

    2. `External dynamic URL lists`

    3. `Pre-defined categories`


    所以作为示例 – 如果一个 URL 存在于所有类别中，则会应用自定义 URL 类别的动作。如果一个 URL 存在于多个自定义 URL 配置文件中，则会应用最严重的动作。


    现在，让我们来看一下文件阻止配置文件。


    ## 文件阻止配置文件


    默认的 `strict file blocking` 配置文件包含所有通常被阻止的文件类型，并可作为良好的起点模板。选择严格配置文件并点击 `clone`
    操作，如以下屏幕截图所示，以基于此创建一个新配置文件。


    如果组织中需要允许任何文件类型，请将其从阻止操作中移除：


    ![](img/B31589_03_18.png)


    图 3.18：文件阻止配置文件克隆


    方向让您可以确定是否只阻止特定文件类型的上传或下载，或两者兼顾，以及文件类型组。文件阻止配置文件还使用规则，以便文件类型可以与其自己的方向和操作一起分组。默认操作是
    `Allow`，因此未包含的任何文件类型都将被允许通过（但如果安全策略中附加了适当的安全配置文件，则会被扫描）。可用的操作有 `Alert`、`Block`
    和 `Continue`，其工作原理与 `URL Filtering` `Continue` 选项类似，如果文件是从支持 HTTP 重定向以在继续下载或上传之前向用户提供警告页面的网页下载的。


    查看所有文件类型并设置您想要阻止的类型。 对于不确定的文件类型且希望先进行审查的类型，可以将其设置为 `Alert` 操作，以便您可以在 `Monitor`
    | `Logs` | `Data Filtering` 中跟踪出现情况。


    如以下屏幕截图所示，我们可以通过点击 `Add` 按钮，选择文件类型，然后设置操作来创建文件类型集合：


    ![](img/B31589_03_19.png)


    图 3.19：文件阻止配置文件


    我们现在来看一下 WildFire 分析配置文件。


    ## WildFire 分析配置文件


    WildFire 分析配置文件控制哪些文件被上传到 WildFire 以在沙箱中进行分析，以及哪些文件被发送到 WildFire 的私有实例（例如 `WF-500`
    设备）。克隆默认配置文件以将所有文件上传到 WildFire，或创建新配置文件如果您想要限制转发的文件或需要将文件重定向到私有云。如果没有 WildFire
    许可证，只有 `Portable Executables` (`PEs`) 会被转发到 WildFire。


    如果所有文件类型都可以上传进行检查，只需为任何应用程序和任何文件类型设置规则即可。如果存在例外，要么创建规则将特定文件分流到私有云（如果您的数据中心有 WildFire
    设备），要么指定哪些文件 *可以* 被上传，如图所示：


    ![](img/B31589_03_20.png)


    图 3.20：WildFire 分析配置文件


    除了将文件上传到云或私有沙箱外，您还可以将文件发送到云进行内联扫描。将文件上传到 WildFire 沙箱需要稍多时间，但会在虚拟沙箱中执行文件并让其“爆炸”以进行完整分析。内联扫描仅限于
    PE 文件，但可以利用机器学习驱动的检测引擎来检测高级威胁。您可以创建规则来确定哪些应用程序的哪些文件可以被上传，以及在检测到恶意软件时采取什么操作：


    ![](img/B31589_03_21.png)


    图 3.21：内联云分析


    我们现在已经涵盖了所有安全配置文件，您可以在后续的安全规则中使用它们，但您也可以创建自定义对象，以便更精细地针对您想要识别并采取行动的特定威胁或数据模式进行调整。在下一节中，我们将学习如何创建这些对象以及需要什么才能定义自定义对象正常工作所需添加的数据。


    ## 自定义对象


    我们已经查看了自定义 URL 类别，但正如本节将讨论的那样，您还可以创建自定义间谍软件和漏洞签名，结合数据字符串和 `RegEx` 来匹配特定签名并通过安全配置文件采取行动。这会很有用，如果您知道某个资源可能对特定代码字符串存在漏洞，订阅了提供可自行添加签名的威胁源，或想要控制检测到模式时发生的情况。


    ### 自定义间谍软件/漏洞对象


    您可以使用 `RegEx` 创建自己的签名来检测间谍软件回拨/C2 或网络漏洞。如以下屏幕截图所示，`Configuration` 页面需要基本信息，例如间谍软件的
    ID 号介于 `15.000-18.000` 和 `6900001-7000000` 之间，漏洞的 ID 号介于 `41.000-45.000` 和 `6800001-6900000`
    之间，以及名称、严重性值、方向和任何可能以后有用的附加信息。方向和受影响客户端有助于 `Content-ID` 引擎识别匹配此签名的预期数据包方向：


    ![](img/B31589_03_22.png)


    图 3.22：自定义间谍软件和漏洞对象


    在 `Signatures` 选项卡中，您有两个主要签名添加模式，如以下屏幕截图所示：


    * `Standard`: 这会添加一个或多个签名，通过逻辑 `AND` 或 `OR` 语句组合。

    * `Combination`: 这将预定义（动态更新）签名与时间组件组合，要求在 `x` 时间内有 `n` 次命中，按源、目标或源-目标聚合。


    ![](img/B31589_03_23.png)


    图 3.23：标准或组合签名


    组合签名允许您选择预定义签名并添加时间属性，因此只有在特定时间范围内检测到签名一定次数后才会采取行动。因此，让我们专注于标准签名，因为这是我们可以构建自己的签名的地方。


    从主屏幕，您可以添加签名集，所有签名集都由逻辑 `OR` 语句分隔。


    一旦开始构建集合，您需要确定范围。事务在单个数据包中匹配签名，而会话跨越会话中的所有数据包。如果您添加用于识别威胁的签名始终出现在单个数据包的有效载荷中，您应该设置事务。这将允许
    `Content-ID` 引擎立即停止扫描。如果您添加多个字符串，可以启用 `Ordered Condition Match`，这要求签名按自上而下的顺序匹配。如果此选项关闭，最后一个签名可能在第一个之前被检测到。如果您添加多个字符串，可以通过添加
    `AND` 条件将它们链接起来。


    一个签名由以下内容组成：


    * 一个 `operator` 要么是模式，要么是大于、等于或小于运算符。大于、等于和小于运算符允许您定位标头、有效载荷、有效载荷长度等。模式允许您匹配数据包或一系列数据包中任何位置找到的确切字符串。

    * 一个 `context` 是在任何可用协议中可能找到签名的<|message|>（例如，如果您在 `http-req-host-header` 中查找字符串，则如果在有效载荷中看到该字符串，则不会匹配）。

    '
