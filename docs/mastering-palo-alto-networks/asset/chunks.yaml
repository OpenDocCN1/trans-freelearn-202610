- raw: 'You may need to log back in after running the `commit` job when the admin
    password is changed.


    **Important note**


    The `>` prompt in `username@hostname>` indicates that you are in *operational*
    mode and can execute runtime commands. The `#` prompt in `username@hostname#`
    indicates that you are in *configuration* mode and can add configuration parameters.


    Operational commands can be run from configuration mode by prefixing `run` to
    a command—for example, `user@host# run show clock`.


    Once the `commit` job finishes, you will be able to connect to the web interface
    through `https://<IP>` or by using an SSH client, such as PuTTY or the `ssh` command
    in Linux or macOS.


    You are now able to get onto a freshly started firewall and configure it, so we
    can move on to the next step and gain access to the web interface.


    ## Connecting to the web interface and CLI


    Now that your device has an IP address, you can connect to its web interface via
    any browser using `https://<IP>`.


    You will be met with an unfriendly error message, as in the following screenshots.
    This is due to the web interface using a self-signed certificate that has not
    been validated by any authority. For now, this can be safely ignored:


    ![](Images/B31589_02_04.png)


    Figure 2.4: Certificate warnings in Chrome and Firefox


    An SSH client will provide you with a slightly friendlier question:


    ```

    tom$ ssh -l admin 192.168.27.115

    The authenticity of host ''192.168.27.115 (192.168.27.115)'' can''t be established.

    RSA key fingerprint is SHA256:Qmre8VyePwwGlaDmm6JTYtjou42d1i/Ru6xZmmEk8Yc.

    Are you sure you want to continue connecting (yes/no)?

    ```


    The SSH connection will provide you with mostly the same user experience as the
    console connection, but SSH is more responsive and secure, and you can now access
    your device from anywhere on the management network.


    The web interface provides you with a whole new user experience. When prompted
    for your username and password, input the username `admin` with default password
    `admin` or the password you created on the terminal, or the username and password
    you created on the cloud provider.


    Once you are logged in, the first screen you will see is the dashboard, which
    contains some general information about the health of your system, config changes,
    and which admins are logged on. The dashboard can be customized and additional
    widgets can be added from a list of prepared widgets, or widgets can be removed
    if they are not relevant.


    For now, the **General Information** widget contains the most important information
    as you will need the **serial number** of the physical device, or the **CPU ID**
    and **UUID** on a virtual device, as shown in the following screenshot. The CPU
    ID and UUID will be needed to register and activate the VM while a physical device
    can be activated by its serial number:


    ![](Images/B31589_02_05.png)


    Figure 2.5: On the left is a PA-VM device, and on the right is a PA-440 device


    Now that we have access to the web interface and are able to collect the system’s
    base information, we can go ahead and register the firewall and activate any of
    the feature licenses that were purchased. We will now have a look at how to perform
    the registration and licensing procedures.


    # Adding licenses and setting up dynamic updates


    Before we can start adding licenses, the device needs to be registered. You will
    need to note down the device’s serial number or, if you do not have a support
    portal account, the sales order number to create a new account. The sales order
    number will typically be sent to you by your distributor or reseller after you’ve
    placed your order.


    Open a new tab or browser and navigate to [https://support.paloaltonetworks.com](https://support.paloaltonetworks.com).
    If you do not have an account yet, you will first need to create a new one so
    you gain access to the portal from where you will be able to manage all your devices,
    activate your licenses, download software packages and updates, and access support
    cases. If you already have a **Customer Support Portal (CSP**) account, you can
    skip to* Registering a new device*.


    ## Creating a new account


    When creating a new account, you will be asked for an email address and whether
    you want to register using a serial number or an **authorization** (**auth**)
    code, as in the following screenshot. The serial number is needed when registering
    a hardware appliance; the auth code is used when registering a VM device:


    ![](Images/B31589_02_06.png)


    Figure 2.6: Serial or authorization code device registration


    Alternatively, if you have set up a virtual appliance on one of the cloud providers,
    you can pick which provider your device is running on (such as Amazon Web Services,
    Azure, Google Cloud Platform, and so on).


    You then need to provide some basic details, such as the address, the password,
    the device’s serial number, the auth code, and the sales order number or customer
    ID, if your company already has an account:


    ![](Images/B31589_02_07.png)


    Figure 2.7: General information and device and sales order details


    This account creation step will already register your first device; you can go
    ahead and register more devices in the following section.


    ## Registering a new device


    Ensure you are logged in to your account on the support portal and click on **Register
    a Device** from the home page:


    ![](Images/B31589_02_08.png)


    Figure 2.8: Register a Device from the support portal home page


    You will be presented with the option to register using a serial number or an
    auth code. The serial number is needed when registering a hardware appliance and
    the auth code is used when registering a VM device:


    ![](Images/B31589_02_09.png)


    Figure 2.9: Serial or auth code device registration


    **Register device using Serial Number or Authorization Code** will ask you for
    the serial number, a friendly device name, and a tag if you have several “pools”
    or groups of devices in your account already. It will also request address details
    as to where the device will be deployed for **return merchandise authorization**
    (**RMA**) purposes.


    If you are deploying a cloud instance, you can choose to register usage-based
    VM-Series models. You’ll be asked for the serial number, CPUID, and UUID:


    ![](Images/B31589_02_10.png)


    Figure 2.10: Adding a cloud instance to the assets


    Now that the devices are registered, it is time to activate the feature and support
    licenses.


    ## Activating licenses


    Once the device is registered, you can add the licenses. You will have received
    one (a bundle) or several auth codes that you need to enter on the portal or via
    the **Device**  |  **Licenses **tab to activate the license and start using the
    feature on your device. There are multiple ways to activate licenses, which we’ll
    cover in the following sections, but let’s take a look at the different types
    of licenses first.


    Some of the most common licenses include the following:


    *   **Support**: **Platinum 4h** (**PLAT**), **Premium 24/7** (**PREM**), **Standard
    9/5** (**STD**), **Partner-enabled 4h support** (**B4HR**), or **Regular Partner-enabled
    support**  (**BND**). Support licenses grant you access to a support organization,
    allow you to download software and app ID updates, and entitle you to replacement
    hardware if your firewall breaks.


    *   **Threat Prevention** (**TP**): Antivirus, anti-spyware, threat prevention,
    daily updates.


    *   **Advanced Threat Prevention** (**A-TP**) adds inline cloud analysis for SQL
    and command injection.


    *   **PAN-DB URL filtering** (**URL4**) is the basic cloud-based URL category
    lookup license. This license will be phased out in favor of ADVURL.


    *   **Advanced URL filtering** (**ADVURL**) is the **Machine Learning** (**ML**)-enabled
    URL filtering license that adds an automated mechanism to analyze unknown URLs
    in real time.'
