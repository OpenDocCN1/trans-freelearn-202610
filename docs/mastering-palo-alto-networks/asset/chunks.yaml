    cause an interface to behave in a specific way. We will first cover the four basic
    interface types and continue with the more specialist ones after:

    * Virtual Wire (VWire) is a “Layer 1” passthrough set of two interfaces

    * Layer 3 is routed interfaces

    * Layer 2 is “switched” interfaces that rely on VLAN tags rather than routing
    tables

    * Tap is a “sniffing” interface


    Let’s discuss them in more detail.


    ## VWire

    Just as the name suggests, VWire is intended to be a “bump in the wire.” VWire
    always consists of two physical interfaces—no more and no less. There is no low-level
    interference with VLAN tags and there are no routing options; packets are inspected
    in flow.


    Using a VWire interface can be an easy way to “drop in a firewall” without needing
    to interfere with an existing routing or switching environment. It easily plugs
    in in front of an ISP router or can be placed in between a honeypot and the network
    to add a layer of detection.


    Out of the box, a firewall will have a default VWire set up on `ethernet1/1` as
    the outside interface and `ethernet1/2` as the inside interface with a security
    rule to allow all outbound traffic.


    Before you can create a VWire interface, you first need to set two interfaces
    to the **Virtual Wire** type and assign each of them to a different zone:


    ![](Images/B31589_02_48.png)


    Figure 2.48: VWire interface


    You can now connect both interfaces to a VWire profile by going to **Network**
    | **Virtual Wires** and creating a new VWire profile.

    '
