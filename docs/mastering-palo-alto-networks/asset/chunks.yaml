- raw: '*   **A URL list**: The URL list allows manual entry of URLs, one per line.
    It takes a light form of **regular expression** (**RegEx**) matched against the
    address, so neither `http://` nor `https://` are required to match.


    *   **A category match**: The category match allows you to combine any of the
    predefined categories in a custom category. This could come in handy when applying
    security rules or a decryption policy to a group of predefined categories.


    The string used in a custom URL category is divided up into substrings, or tokens,
    by separators. The `./?&=;+` characters are considered separators, so `www.example.com`
    has three tokens and two separators. Each token can be replaced by a wildcard
    (**\***) to match subdomains or entire **top-level domains** (**TLDs**). Wildcards
    cannot be used as part of a token; for example, `www.ex*.com` is an illegal wildcard.
    Each string can be closed by a forward slash (**/**) or be left open by not adding
    an end slash. Not ending a string could have consequences if the string is very
    short or very common as it could match unintended longer addresses. For example,
    the `*.com` string could match `www.communicationexample.org`, so adding an ending
    slash would prevent this.


    There is also an **Append Trailing Slash** function in **Device** | **Setup**
    | **Content-ID** | **URL Filtering** that is enabled by default. It will automatically
    add a trailing slash to any EDLs or custom URL categories where a slash was not
    added. If you do need open-ended entries, disable this function.


    Having multiple wildcards would require the use of a subdomain, so `*.*.com` would
    match anything.anything.com, but not anything.com.


    ### Configuring the URL Filtering profile


    When configuring the URL Filtering profile, you need to select which action to
    apply in the **Site Access** column for each URL Filtering category within the
    **Categories** tab, as you can see in the following screenshot:


    ![](Images/B31589_03_12.png)


    Figure 3.12: URL Filtering Profile


    The available actions are as follows:


    *   **none:** Exclusively used for custom URL categories. This excludes the URLs
    contained in the custom category from being used in this URL Filtering profile.


    *   **allow:** Allows a category without logging.


    *   **alert:** Allows a category and logs the access in the URL Filtering log.


    *   **block**: Blocks the request, injecting an HTTP 503 error and a redirect
    to a page hosted on the firewall explaining to the user that their access was
    declined and the action was logged.


    *   **continue:** Injects an interactive web page informing the user that they
    are about to access a restricted website and provides a **Continue** button for
    them to acknowledge the risk associated with accessing the site.


    *   **override**: Injects an interactive web page that allows the user to continue
    if they are able to provide a password to continue. This password can be set in
    **Device | Setup | Content-ID | URL Admin Override**.


    Additionally, to be able to use the **override** option, an Interface Management
    profile (**Network | Network Profiles | Interface Mgmt**) needs to be created.
    This profile should have the **Response Pages** service enabled and added to the
    interface where users connect to for this page to work, as illustrated in the
    following screenshot:


    ![](Images/B31589_03_13.png)


    Figure 3.13: Interface Management Profile


    As you saw in *Figure 3**.10*, the URL Filtering profile requires each **Category**
    field to be set to an action individually for site access, and if **User Credential
    Submission** is enabled, additional filtering can be applied to decide whether
    a user is allowed to submit corporate credentials to a certain category. This
    helps prevent phishing attacks.


    As you can see in the following screenshot, if you want to change a lot (or all)
    of the actions at once, there’s a shortcut to help you. If you hover your mouse
    over **Site Access** or **User Credential Submission,** there will be a little
    arrow that lets you select **Set All Actions** or **Set Selected Actions**:


    ![](Images/B31589_03_14.png)


    Figure 3.14: Set All Actions in the URL Filtering profile


    A good baseline URL Filtering policy can be set up as follows:


    1.  Set all of the categories to **alert**. This will ensure that all of the URL
    categories are logged.


    2.  Set **Adult**, **Command and Control**, **Copyright Infringement**, **Extremism**,
    **Malware**, **Peer-to-Peer**, **Scanning-activity**, **Real-time-detection**,
    and **Phishing and Proxy Avoidance and Anonymizers** to **Block**.


    3.  Set **Dating**, **Gambling**, **Games**, **Hacking**, **Insufficient Content**,
    **Not-Resolved**, **Parked**, **Questionable**, **Unknown**, and **Web Advertisements**
    to **Continue**.


    4.  Tweak the settings in accordance with your company policy or local laws and
    regulations (some URL categories cannot be logged by law, for example). The **Categories**
    set to **Continue** are commonly on the fringes of acceptance, but may still need
    to be accessed for legitimate purposes. The **Continue** action gives the user
    the opportunity to ensure that they intend to go to this URL before actually opening
    the web page.


    The **URL Filtering Settings** tab contains several logging options that may come
    in handy, depending on your needs:


    *   **Log container page only:** This setting only logs the actual access a user
    is requesting and will suppress related web links, such as embedded advertisements
    and content links on the page that the user is visiting, thereby reducing the
    log volume.


    *   **Safe Search Enforcement:** This blocks access to search providers if strict
    safe search is not enabled on the client side. Currently, Google, Bing, Yahoo,
    Yandex, and YouTube are supported.


    Additional logging can also be enabled:


    *   **User-Agent**: This is the web browser that the user is using to access a
    web page.


    *   **Referer**: This is the web page that links to the resource that is being
    accessed (for example, Google or CNN linking to a resource page).


    *   **x-forward-for**: If a downstream proxy is being used by users, this masks
    their original source. If the downstream proxy supports enabling the **x-forward-for**
    feature, it will add the client’s original IP in the **c** header, allowing the
    identification of the original user.


    The following steps and screenshot show you how to enable these settings in your
    URL Filtering profile:


    1.  Enable **Log container page only** to give your users some privacy and prevent
    the logging of embedded ad pages.


    2.  Enable **Safe Search Enforcement**.


    3.  Enable additional logging for **User-Agent** and **Referer**.


    ![](Images/B31589_03_15.png)


    Figure 3.15: URL Filtering settings


    The **User Credential Detection** tab allows you to enable credential detection
    (see *Chapter 6*, *Identifying Users and Controlling Access*, for more details).


    **HTTP Header Insertion** lets you control web application access by inserting
    HTTP headers into the HTTP/1.x requests to application providers. As you can see
    in the following example, this can help you control which team IDs can be accessed
    in Dropbox, and which tenants and content can be accessed in Office 365 and Google
    app-allowed domains. You can create any URL that needs to have a certain header
    inserted to ensure users are accessing the appropriate instance:


    ![](Images/B31589_03_16.png)


    Figure 3.16: HTTP Header Insertion


    The **Inline Categorization** tab lets you enable additional scanning to help
    identify phishing sites or malicious JavaScript and requires the Advanced URL
    subscription license:


    ![](Images/B31589_03_17.png)


    Figure 3.17: Inline Categorization


    You can enable local and cloud categorization individually, in case you prefer
    not to perform cloud lookups or not put additional workload on the firewall.


    ### URL Filtering priorities'
