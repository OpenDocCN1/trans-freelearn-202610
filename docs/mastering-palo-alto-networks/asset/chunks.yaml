- raw: "The **management plane** is where all administrative tasks happen. It serves\
    \ the web interfaces used by the system to allow configuration, provide URL filtering\
    \ block pages, and serve the client VPN portal. It performs cloud lookups for\
    \ URL filtering and DNS security, and downloads and installs content updates onto\
    \ the data plane. It also performs the logic part of routing and communicates\
    \ with dynamic routing peers and neighbors. Authentication, User-ID, logging,\
    \ and many other supporting functions are not directly related to processing packets.\n\
    \nThe **control plane** takes on the task of facilitating communications between\
    \ multiple data planes and the management plane as well as monitoring processes\
    \ on the data planes.\n\nThe **data plane** is responsible for processing flows\
    \ and performing all the security features associated with the NGFW. It scans\
    \ sessions for patterns and heuristics. It maintains IPsec VPN connections and\
    \ has hardware offloading to provide wire-speed throughputs. Due to its architecture\
    \ and the use of interconnected specialty chips, all types of scanning can happen\
    \ in parallel as each chip processes packets simultaneously and reports its findings.\n\
    \nA switch fabric enables communication between planes so the data plane can send\
    \ lookup requests to the management plane, and the management plane can send configuration\
    \ updates and content updates.\n\nThe following diagram illustrates how these\
    \ components interact with each other:\n\n![](Images/B31589_01_06.png)\n\nFigure\
    \ 1.6: Management and data planes\n\nNow that we’ve covered the most basic functions\
    \ and you have a firm grasp of how the hardware is organized, let’s look at identity-based\
    \ authorization. The ability to identify users and apply different security policies\
    \ based on identity or group membership is an important feature of the NGFW as\
    \ it allows for more dynamic security rules that don’t rely on static access lists\
    \ but, instead, allow users to roam inside and outside the campus and still have\
    \ all the access they need without exposing internal resources.\n\n# Authenticating\
    \ and authorizing users with User-ID\n\nFrequently neglected but very powerful\
    \ when set up properly is a standard (no additional license required) feature\
    \ called User-ID. Through several mechanisms, the firewall can learn who is initiating\
    \ which sessions, regardless of their device, operating system, or source IP.\
    \ Additionally, security policies can be set so users are granted access or restricted\
    \ in their capabilities based on their individual ID or group membership.\n\n\
    User-ID expands functionality with granular control of who is accessing certain\
    \ resources and provides customizable reporting capabilities for forensic or managerial\
    \ reporting.\n\nUsers can be identified through several different methods:\n\n\
    *   **Server monitoring**: \n\n    *   Microsoft Active Directory security log\
    \ reading for log-on and authentication events\n\n    *   Microsoft Exchange Server\
    \ log-on events\n\n    *   Novell eDirectory log-on events\n\n*   The interception\
    \ of **X-Forwarded-For** (**XFF**) headers, forwarded by a downstream proxy server\n\
    \n*   **Client probing** using NetBIOS and WMI probes\n\n*   **Direct user authentication**:\
    \ \n\n    *   The Captive Portal to intercept web requests and serve a user authentication\
    \ form or transparently authenticate using Kerberos\n\n    *   GlobalProtect VPN\
    \ client integration\n\n*   **Port mapping** on a multiuser platform such as Citrix\
    \ or Microsoft Terminal Server where multiple users will originate from the same\
    \ source IP\n\n*   The **Extensible Markup Language** (**XML**) API\n\n*   A **syslog\
    \ listener** to receive forwarded logs from external authentication systems\n\n\
    You will have noticed there are many ways to leverage User-ID, so we will revisit\
    \ this topic in depth in *Chapter 6*, *Identifying Users and Controlling Access*.\n\
    \n# Summary\n\nNow that you’ve completed this chapter, you are able to identify\
    \ the strengths of using a zone-based firewall versus a route-based one. You understand\
    \ how applications can be identified even though they may all be using the same\
    \ protocol and port, and you understand how deep packet inspection is achieved\
    \ in single-pass parallel processing. Most importantly, you have a firm grasp\
    \ of which phases a packet goes through to form a session. It’s okay if this information\
    \ seems a bit overwhelming; we will see more practical applications, and implications,\
    \ in the next two chapters. We will be taking a closer look at how security and\
    \ NAT rules behave once you start playing with zones, and how to anticipate expected\
    \ behavior by simply glancing at the rules.\n\nIf you are preparing for the PCNSE\
    \ exam, this chapter covered parts of the *Planning and Core Concepts* and *Deploy\
    \ and Configure* domains. Make note of *Figure 1**.2* regarding packet processing,\
    \ remember that route lookups and PBF form the basis of zoning, and take note\
    \ of how App-ID and Content-ID interoperate.\n\nIn the next chapter, we will learn\
    \ how to set up a firewall from scratch and get up and running in no time. We\
    \ will glance over the physical and virtual components and how to configure them\
    \ so traffic can flow through, and NAT can be applied where needed.\n\n# 2\n\n\
    # Setting Up a New Device\n\nIn this chapter, we will cover how you can gain access\
    \ to the console and web interface of a fresh-out-of-the-box firewall appliance\
    \ or a cleanly staged **virtual machine** (**VM**). You will learn how to license,\
    \ update, and upgrade the firewall so that the latest features are available when\
    \ you start building your security policy, and the latest signatures are always\
    \ loaded onto the device to protect your users and infrastructure from malware\
    \ and vulnerability exploits.\n\nWe are going to harden your management configuration\
    \ to ensure a rigid security stance, and we will also look at the different types\
    \ of network interface modes—aggregated interfaces and routing.\n\nIn this chapter,\
    \ we’re going to cover the following main topics:\n\n*   Gaining access to the\
    \ user interface\n\n*   Adding licenses and setting up dynamic updates\n\n*  \
    \ Upgrading the firewall\n\n*   Hardening the management interface\n\n*   Understanding\
    \ the interface types\n\nBy the end of this chapter, you’ll be able to quickly\
    \ set up a fresh firewall, register it, and upgrade it to a desirable level in\
    \ a short amount of time. You’ll be able to apply best practices and leverage\
    \ strong authentication for your administrative access, and you will be able to\
    \ quickly identify which interface configuration will suit any given network topology\
    \ that the firewall needs to be placed in.\n\n# Technical requirements\n\nFor\
    \ this chapter, a basic understanding of network appliances is required as we\
    \ will be looking at physically connecting to a device, configuring the management\
    \ environment, and choosing the data plane interface’s deployment mode. Basic\
    \ knowledge of standing up a virtual appliance in a virtual environment, including\
    \ connecting it to virtual switches or virtual interfaces and providing it with\
    \ network access on a hypervisor, is also required.\n\n# Gaining access to the\
    \ user interface\n\nIf you are deploying your firewall on a cloud provider like\
    \ Azure or AWS, take a look at *Chapter 14*, *Cloud-Based Firewall Deployments*.\n\
    \nWhen taking a new device out of the box or setting up a VM on a local hypervisor,\
    \ such as VMware ESXi, Fusion, NSX, Hyper-V, KVM, and so on, one of the first\
    \ things that needs to be accomplished is making it possible to gain access to\
    \ the user interface, be it a web interface or a console connection. We’ll go\
    \ over the most common ways of gaining this access in this section.\n\nOne of\
    \ the first things you *may* need to do is to connect a console cable to gain\
    \ access to the **command-line interface** (**CLI**). Older models only come with\
    \ an RJ45 console port, so for those, you will need a standard DB9-to-RJ45 console\
    \ cable, optionally patched through a serial-to-USB cable so a modern laptop is\
    \ able to interface with the port. The pinout for the DB9 should be as follows:"
  fmt: "\n## Planes Overview\nThe **management plane** is where all administrative\
    \ tasks happen. It serves the web interfaces used by the system to allow configuration,\
    \ provide URL filtering block pages, and serve the client VPN portal. It performs\
    \ cloud lookups for URL filtering and DNS security, and downloads and installs\
    \ content updates onto the data plane. It also performs the logic part of routing\
    \ and communicates with dynamic routing peers and neighbors. Authentication, `User-ID`,\
    \ logging, and many other supporting functions are not directly related to processing\
    \ packets.\n\nThe **control plane** takes on the task of facilitating communications\
    \ between multiple data planes and the management plane as well as monitoring\
    \ processes on the data planes.\n\nThe **data plane** is responsible for processing\
    \ flows and performing all the security features associated with the NGFW. It\
    \ scans sessions for patterns and heuristics. It maintains IPsec VPN connections\
    \ and has hardware offloading to provide wire-speed throughputs. Due to its architecture\
    \ and the use of interconnected specialty chips, all types of scanning can happen\
    \ in parallel as each chip processes packets simultaneously and reports its findings.\n\
    \nA switch fabric enables communication between planes so the data plane can send\
    \ lookup requests to the management plane, and the management plane can send configuration\
    \ updates and content updates.\n\nThe following diagram illustrates how these\
    \ components interact with each other:\n\n![](Images/B31589_01_06.png)\n\nFigure\
    \ 1.6: Management and data planes\n\nNow that we’ve covered the most basic functions\
    \ and you have a firm grasp of how the hardware is organized, let’s look at identity-based\
    \ authorization. The ability to identify users and apply different security policies\
    \ based on identity or group membership is an important feature of the NGFW as\
    \ it allows for more dynamic security rules that don’t rely on static access lists\
    \ but, instead, allow users to roam inside and outside the campus and still have\
    \ all the access they need without exposing internal resources.\n\n# Authenticating\
    \ and authorizing users with `User-ID`\n\nFrequently neglected but very powerful\
    \ when set up properly is a standard (no additional license required) feature\
    \ called `User-ID`. Through several mechanisms, the firewall can learn who is\
    \ initiating which sessions, regardless of their device, operating system, or\
    \ source IP. Additionally, security policies can be set so users are granted access\
    \ or restricted in their capabilities based on their individual ID or group membership.\n\
    \n`User-ID` expands functionality with granular control of who is accessing certain\
    \ resources and provides customizable reporting capabilities for forensic or managerial\
    \ reporting.\n\nUsers can be identified through several different methods:\n*\
    \ **Server monitoring**:\n  * Microsoft Active Directory security log reading\
    \ for log-on and authentication events\n  * Microsoft Exchange Server log-on events\n\
    \  * Novell eDirectory log-on events\n* The interception of `X-Forwarded-For`\
    \ (`XFF`) headers, forwarded by a downstream proxy server\n* **Client probing**\
    \ using `NetBIOS` and `WMI` probes\n* **Direct user authentication**:\n  * The\
    \ `Captive Portal` to intercept web requests and serve a user authentication form\
    \ or transparently authenticate using Kerberos\n  * `GlobalProtect` VPN client\
    \ integration\n* **Port mapping** on a multiuser platform such as Citrix or Microsoft\
    \ Terminal Server where multiple users will originate from the same source IP\n\
    * The Extensible Markup Language (`XML`) API\n* A `syslog` listener to receive\
    \ forwarded logs from external authentication systems\n\nYou will have noticed\
    \ there are many ways to leverage `User-ID`, so we will revisit this topic in\
    \ depth in *Chapter 6*, *Identifying Users and Controlling Access*.\n\n# Summary\n\
    \nNow that you’ve completed this chapter, you are able to identify the strengths\
    \ of using a zone-based firewall versus a route-based one. You understand how\
    \ applications can be identified even though they may all be using the same protocol\
    \ and port, and you understand how deep packet inspection is achieved in single-pass\
    \ parallel processing. Most importantly, you have a firm grasp of which phases\
    \ a packet goes through to form a session. It’s okay if this information seems\
    \ a bit overwhelming; we will see more practical applications, and implications,\
    \ in the next two chapters. We will be taking a closer look at how security and\
    \ `NAT` rules behave once you start playing with zones, and how to anticipate\
    \ expected behavior by simply glancing at the rules.\n\nIf you are preparing for\
    \ the `PCNSE` exam, this chapter covered parts of the *Planning and Core Concepts*\
    \ and *Deploy and Configure* domains. Make note of *Figure 1.2* regarding packet\
    \ processing, remember that route lookups and `PBF` form the basis of zoning,\
    \ and take note of how `App-ID` and `Content-ID` interoperate.\n\nIn the next\
    \ chapter, we will learn how to set up a firewall from scratch and get up and\
    \ running in no time. We will glance over the physical and virtual components\
    \ and how to configure them so traffic can flow through, and `NAT` can be applied\
    \ where needed.\n\n# Chapter 2: Setting Up a New Device\n\nIn this chapter, we\
    \ will cover how you can gain access to the console and web interface of a fresh-out-of-the-box\
    \ firewall appliance or a cleanly staged **virtual machine** (`VM`). You will\
    \ learn how to license, update, and upgrade the firewall so that the latest features\
    \ are available when you start building your security policy, and the latest signatures\
    \ are always loaded onto the device to protect your users and infrastructure from\
    \ malware and vulnerability exploits.\n\nWe are going to harden your management\
    \ configuration to ensure a rigid security stance, and we will also look at the\
    \ different types of network interface modes—aggregated interfaces and routing.\n\
    \nIn this chapter, we’re going to cover the following main topics:\n* Gaining\
    \ access to the user interface\n* Adding licenses and setting up dynamic updates\n\
    * Upgrading the firewall\n* Hardening the management interface\n* Understanding\
    \ the interface types\n\nBy the end of this chapter, you’ll be able to quickly\
    \ set up a fresh firewall, register it, and upgrade it to a desirable level in\
    \ a short amount of time. You’ll be able to apply best practices and leverage\
    \ strong authentication for your administrative access, and you will be able to\
    \ quickly identify which interface configuration will suit any given network topology\
    \ that the firewall needs to be placed in.\n\n## Technical requirements\n\nFor\
    \ this chapter, a basic understanding of network appliances is required as we\
