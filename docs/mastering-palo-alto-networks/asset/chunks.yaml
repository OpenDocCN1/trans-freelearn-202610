    # Console Access and Configuration


    ## Pinout Reference


    ```

    1 - Empty - Data Carrier Detect (DCD)

    2 - 3 - Receive Data (RXD)

    3 - 6 - Transmit Data - (TXD)

    4 - 7 - Data Terminal Ready (DTR)

    5 - 4 - Ground (GND)

    6 - 2 - Data Set Ready (DSR)

    7 - 8 - Request To Send (RTS)

    8 - 1 - Clear to Send - (CTS)

    9 - Empty - Ringing Indicator (RI)

    ```


    Luckily, there are USB-to-RJ45 cables available as well that will save you the
    trouble of figuring out the correct pinouts:


    ![](Images/B31589_02_01.png)


    Figure 2.1: RJ45-to-USB console cable


    All but the very old models also come with a micro-USB port, which allows a console
    connection to be made using a standard USB-A-to-micro-USB cable, as in the following
    picture:


    ![](Images/B31589_02_02.png)


    Figure 2.2: PA-460 RJ45 and the micro-USB console ports


    ## Finding the Console Port


    In all cases, you will need to find which `COM` (hardware interface) or `TTY`
    (`TeleTYpewriter`) port is being used on your computer’s operating system.


    ### Windows


    On a Windows machine, the first time you plug in the cable, a driver may need
    to be installed. Once the installation has been completed, you need to find the
    virtual COM port number that has been assigned to the console cable. In most cases,
    you can determine this virtual COM port number by following these steps:


    1. Open the Device Manager.

    2. Click Start | Control Panel | Hardware and Sound | Device Manager (under Devices
    and Printers).

    3. In the Device Manager list, look in Ports and find the virtual COM port assigned
    to the USB port. This entry will look similar to USB to Serial Port (`COM#`),
    where `COM#` is the number to be used in the following step.


    Next, you will need a terminal emulation client to connect to the console. You
    can use a free client for this, such as `PuTTY` from https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html.


    Besides the `COM` port, you may need to provide more settings to be able to connect.
    If asked, use these settings:


    ```

    Bits per second: 9600

    Data Bits: 8

    Parity: none

    Stop bits: 1

    Flow control: none

    ```


    ### macOS and Linux


    On macOS and Linux, a USB serial connection will usually create a new `tty` entry
    in the `/dev/` directory; a USB-to-DB9 dongle may create a call-up (`CU`) entry
    in the `/dev/` directory.


    Find the proper device by searching with either of these commands:


    ```

    ls /dev/tty.*

    ls /dev/cu.*

    ```


    You will find `/dev/cu.usbserialxxxxx` or `/dev/tty.usbmodemxxxxx`, where `xxxxx`
    is the serial device name.


    Once you determine the appropriate device, you can connect to the console port
    by using the `screen` command set to `9600` bits per second:


    ```

    screen /dev/tty.usbmodemxxxxx 9600

    ```


    ## Connecting to the Console


    Now, go ahead and connect the console cable or micro-USB to your laptop and appliance.
    If you have a port free on your management network, go ahead and connect the firewall’s
    `MGT` port to the switch. If you don’t have a management connection available
    yet, you will need to connect your laptop directly to the `MGT` port for easier
    access once the IP is set up on the management interface. Lastly, plug in the
    power cable.


    If the firewall is loaded in a VM or cloud entity, hit the Start button to boot
    up the virtual appliance.


    Once you’ve logged on to the console, you will see the operating system boot up,
    and if the firewall is already connected to a DHCP-enabled management network,
    you will see something similar to the following, where the DHCP address is already
    listed for your convenience:


    ![](Images/B31589_02_03.png)


    Figure 2.3: PA-VM post-boot DHCP information


    If you missed this information, you can log on and use the following command to
    see the DHCP information:


    ```

    admin@PA-440> show system info

    hostname: PA-440

    ip-address: 192.168.27.116

    public-ip-address: unknown

    netmask: 255.255.255.0

    default-gateway: 192.168.27.1

    ip-assignment: dhcp

    ```


    If, for some reason, you have not received a DHCP address yet from your DHCP server,
    you can initiate a `renew` action from the CLI by using a `request dhcp client
    management-interface renew` command.


    ### Important Note


    The default username and password for a factory settings appliance or VM are as
    follows:


    `Username: admin`


    `Password: admin`


    The first time you log on, you will be asked to change this default password.
    Remember to commit the configuration to save your new password.


    ## Accessing the Interface


    Now that you have access to the user interface, you will need to make an important
    decision right away: whether you will be using `zero-touch provisioning` (`ZTP`)
    or not (we’ll see a bit more about that later in Chapter 7, Managing Firewalls
    through Panorama). In short, `ZTP` enables a device to automatically receive coordinates
    for a central management Panorama system, if you have one, and immediately download
    its configuration from there. By default, this option is enabled on all new devices
    and is bound to interface `ethernet1/1`. If you do not need this functionality,
    you must turn it off before you can start using this interface. You can do so
    by issuing the command `set system ztp disable`, as follows:


    ```

    admin@PA-440> set system ztp disable

    Executing this command will disable Zero Touch Provisioning (ZTP), and remove
    all logs and configuration. The system will restart in standard mode for regular
    configuration of the firewall. Are you sure you want to continue? (y or n)

    ```


    If you hit the Y key, the system will reboot and `ZTP` will be disabled. If you
    change your mind later and want to enable it again, you can do so by issuing the
    following command: `set system ztp enable`.


    Once your system has rebooted, continue with the initial configuration.


    If your network does not have a DHCP server, or you connected the firewall directly
    to your laptop, you will need to set an IP address manually. Copy and paste the
    following into a text file and alter the `<IP>` entries with the appropriate IP
    for your management interface, the default gateway it will use to reach out to
    the internet, and the DNS servers it will use to resolve the domain names. Type
    the netmask in quad decimals, not in CIDR (slash notation subnet, such as `/16`
    and `/24`):


    ```

    configure

    set deviceconfig system type static

    set deviceconfig system ip-address <IP>

    set deviceconfig system netmask <x.x.x.x>

    set deviceconfig system default-gateway <IP>

    set deviceconfig system dns-setting servers primary <IP>

    set deviceconfig system dns-setting servers secondary <IP>

    commit

    ```


    You can chain `set` commands that belong in the same path and class so that you
    do not need to set each attribute in individual `set` commands; instead, you can
    add all the desired settings at once.


    In the next example, we go into configuration mode, switch the management interface
    from DHCP to static configuration, and then combine all the configuration parameters
    for the management interface into one `set` command. If you haven’t done so already,
    start by changing the default password to a new one, and then add the interface
    configuration:


    ```

    admin@PA-440> set password

    Enter old password :

    Enter new password :

    Confirm password :

    Password changed

    admin@PA-440> configure

    Entering configuration mode

    [edit]

    admin@PA-440# set deviceconfig system type static

    [edit]

    admin@PA-440# set deviceconfig system ip-address 192.168.27.5 netmask 255.255.255.0
    default-gateway 192.168.27.1 dns-setting servers primary 1.1.1.1 secondary 1.0.0.1

    [edit]

    admin@PA-440# commit

    Commit job 2 is in progress. Use Ctrl+C to return to command prompt

    ...........................................55%....75%.....98%.......................100%

    Configuration committed successfully

    [edit]

    admin@PA-440#

    ```

