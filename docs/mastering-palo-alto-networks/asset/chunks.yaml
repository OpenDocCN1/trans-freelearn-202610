- raw: 'Some sites may fall into multiple categories and, on top of this, may be listed
    in a custom category or external dynamic URL list. The way URL Filtering decides
    which action to apply is based on the severity of the action that is applied to
    it, and whether it is in a custom category, external dynamic URL list, or pre-defined
    category. The actions based on the severity in descending order are as follows:


    1.  Block


    2.  Override


    3.  Continue


    4.  Alert


    5.  Allow


    The order of categories is as follows:


    1.  Custom URL categories


    2.  External dynamic URL lists


    3.  Pre-defined categories


    So as an example – if a URL is present in all categories, the action of the custom
    URL category will be applied. If a URL is present in multiple custom URL profiles,
    the most severe action will be applied.


    Now, let’s look at the File Blocking profile.


    ## The File Blocking profile


    The default **strict file blocking** profile contains all the file types that
    are commonly blocked and serves as a good template to start from. Select the strict
    profile and click on the **clone** action, as in the following screenshot, to
    create a new profile based on this one.


    If any file types do need to be allowed in your organization, remove them from
    the block action:


    ![](Images/B31589_03_18.png)


    Figure 3.18: File Blocking profile clone


    The direction lets you determine whether you want to only block uploads or downloads
    or both directions for a specific file type, as well as groups of file types.
    File Blocking profiles also use rules so that file types can be grouped with their
    own directions and actions. The default action is **Allow**, so any file type
    not included will be allowed to pass through (but will be scanned if an appropriate
    security profile is attached to the security policy). The available actions are
    **Alert**, **Block**, and **Continue**, which works similarly to the URL Filtering
    **Continue**  option if the file is being downloaded from a web page that supports
    the HTTP redirect to serve the user a warning page before continuing with the
    download or upload.


    Review all the file types and set the ones you want to block. Any file types that
    you are not sure about and would like to get a chance to review first can be set
    to the **Alert**  action so that you can keep track of occurrences at **Monitor**  |
    **Logs**  | **Data Filtering.**


    As you can see in the following screenshot, we can create sets of file types by
    clicking on the **Add**  button, selecting the file type, and then setting the
    action:


    ![](Images/B31589_03_19.png)


    Figure 3.19: File Blocking Profile


    We will now have a look at the WildFire Analysis profile.


    ## The WildFire Analysis profile


    The WildFire Analysis profile controls which files are uploaded to WildFire for
    analysis in a sandbox and which ones are sent to a private instance of WildFire
    (for example, the WF-500 appliance). Clone the default profile to upload all files
    to WildFire, or create a new profile if you want to limit which files are forwarded
    or need to redirect files to a private cloud. If no WildFire license is available,
    only **Portable Executables** (**PEs**) are forwarded to WildFire.


    If all file types can be uploaded for inspection, simply set a rule for any application
    and any file type. If exceptions exist, either create a rule to divert specific
    files to a private cloud (if you have a WildFire appliance in your data center)
    or specify which files *can* be uploaded, as shown:


    ![](Images/B31589_03_20.png)


    Figure 3.20: WildFire Analysis Profile


    In addition to uploading files to a cloud or private sandbox, you can also send
    files to the cloud for inline scanning. Uploading files to the WildFire sandbox
    will take a little more time but will execute a file in a virtual sandbox and
    let it “explode” for full analysis. The inline scanning is limited to PE files
    but can leverage machine-learning-powered detection engines to detect advanced
    threats. You can create rules to determine which files for which application can
    be uploaded, and which action to take when malware is detected:


    ![](Images/B31589_03_21.png)


    Figure 3.21: Inline Cloud Analysis


    We’ve now covered all the security profiles, which you can use in security rules
    later on, but you can also create custom objects to more finely tune into specific
    threats or data patterns that you want to be able to identify and take action
    on. In the next section, we’ll learn how to create these objects and what is required
    to be able to define the data that needs to be added for the custom object to
    work as expected.


    ## Custom objects


    We have already looked at custom URL categories, but, as we will discuss in this
    section, you can also create custom spyware and vulnerability signatures combining
    strings of data and RegEx to match a certain signature and take action through
    a security profile. This can come in handy if you are aware of a resource that
    could be vulnerable to a specific string of code, are subscribed to a threat feed
    that provides you with signatures you can add yourself, or want to control what
    happens when a pattern is detected.


    ### The Custom Spyware/Vulnerability objects


    You can create your own signatures using RegEx to detect spyware phone-home/C2
    or network vulnerabilities. The **Configuration** page, as shown in the following
    screenshots, requires basic information, such as an ID number that is between
    `15.000-18.000` and `6900001-7000000` for spyware and `41.000-45.000` and `6800001-6900000`
    for vulnerabilities, a name, a severity value, a direction, and any additional
    information that may be useful later on. The direction and affected client help
    the Content-ID engine identify which direction packets that match this signature
    can be expected:


    ![](Images/B31589_03_22.png)


    Figure 3.22: The Custom Spyware and Vulnerability objects


    In the **Signatures** tab, you have two main modes of adding signatures, as you
    can see in the following screenshot:


    *   **Standard**: This adds one or more signatures, combined through logical AND
    or OR statements.


    *   **Combination**: This combines predefined (dynamic update) signatures with
    a timing component requiring *n* number of hits over *x* amount of time, aggregated
    for source, destination, or source-destination.


    ![](Images/B31589_03_23.png)


    Figure 3.23: The Standard or Combination signatures


    Combined signatures allow you to pick predefined signatures and add a timing attribute,
    so action is only taken after the signature has been detected a number of times
    within a certain timeframe. So, let’s focus on standard signatures as this is
    where we can build our own signatures.


    From the main screen, you can add sets of signatures, which are all separated
    by a logical OR statement.


    Once you start building a set, you need to decide on the scope. The transaction
    matches a signature in a single packet and the session spans all the packets in
    the session. If the signature you are adding to identify a threat always occurs
    in a single packet’s payload, you should set a transaction. This will allow the
    Content-ID engine to stop scanning at once. If you are adding multiple strings,
    you can enable **Ordered Condition Match**, which requires the signatures to match
    from top to bottom in an ordered way. If this option is turned off, the last signature
    may be detected before the first. If you add multiple strings, you can link them
    by adding an AND condition.


    A signature consists of the following:


    *   An **operator** is either a pattern, or a greater, equal, or smaller operator.
    Greater, equal, and smaller operators allow you to target a header, payload, payload
    lengths, and more. A pattern lets you match an exact string found anywhere in
    a packet or a series of packets.


    *   A **context** is where, in any of the available protocols, the signature may
    be found (for example, if you look for a string in `http-req-host-header`, that
    same string will not be matched if it is seen in the payload).'
