- raw: "In this chapter, we’re going to cover the following main topics:\n\n*   Understanding\
    \ and preparing security profiles\n\n*   Understanding and building security rules\n\
    \n*   Setting up NAT in all possible directions\n\nBy the end of this chapter,\
    \ you will be able to set up a complete ruleset that will ensure your users are\
    \ able to reach the applications and resources they need, internally hosted servers\
    \ can be reached from the internet, and any threats trying to slip through can\
    \ be stopped in their tracks.\n\n# Technical requirements\n\nBefore you get started,\
    \ your firewall must have connectivity between at least two networks, with one\
    \ preferably being your **internet service provider** (**ISP**), to fully benefit\
    \ from the information provided in this chapter.\n\n# Understanding and preparing\
    \ security profiles\n\nThere are several types of security profiles, like Antivirus,\
    \ Vulnerability Protection, URL Filtering, and Anti-Spyware (we’ll cover all of\
    \ these different profiles in the following sections). Before you can start building\
    \ a solid security rule base, you need to create at least one custom security\
    \ profile of each type to use in all of your security rules. There are pre-configured\
    \ profiles available, but they are set to read-only, which means that if you start\
    \ using them in security rules, you’ll need to replace them one by one if you\
    \ create custom ones later.\n\n**Pro Tip**\n\nAs a best practice, add security\
    \ profiles to all of the rules, including drop rules. On drop rules, security\
    \ profiles do not consume any resources but they will help form a habit of adding\
    \ profiles to all rules, and if the rule ever changes to **Allow**, the profiles\
    \ will already be assigned.\n\nSecurity profiles are evaluated by the first security\
    \ rule that a session is matched against. If a six-tuple is matched against a\
    \ security rule with no or limited security profiles, no scanning can take place\
    \ until there is an application shift and the security policy is re-evaluated.\
    \ *All* security rules need to have security profiles.\n\n## The Antivirus profile\n\
    \nThe Antivirus profile has three sections that depend on different licenses and\
    \ dynamic update settings:\n\n*   The actions under **ACTION** rely on the threat\
    \ prevention license and antivirus updates\n\n*   **Wildfire Action** relies on\
    \ the WildFire license and the WildFire updates that are set to periodical updates\
    \ (1-minute or longer intervals)\n\n*   **Wildfire Inline Ml Action **relies on\
    \ WildFire set to real time\n\nIf any of these licenses are missing from your\
    \ system, the actions listed in their columns will not be applied.\n\n**Application\
    \ Exception** allows you to change the action associated with a decoder for individual\
    \ applications as needed. The actions that can be set for both threat prevention\
    \ and WildFire antivirus actions are as follows:\n\n*   **allow**: Allows matching\
    \ signatures *without* logging.\n\n*   **drop**: Drops matching signatures and\
    \ writes an entry in the threat log.\n\n*   **alert**: Allows matching signatures\
    \ to pass but writes an entry in the threat log.\n\n*   **reset-client**: Drops\
    \ matching packets, sends a TCP RST to the client (session initiator), and writes\
    \ an entry in the threat log. The server (session responder) is not notified.\n\
    \n*   **reset-server**: Drops matching packets, sends a TCP RST to the server\
    \ (session responder), and writes an entry in the threat log. The client (session\
    \ initiator) is not notified.\n\n*   **reset-both**: Drops matching packets, sends\
    \ a TCP RST to both the client and the server, and writes an entry in the threat\
    \ log.\n\nPacket captures can be enabled for further analysis by the security\
    \ team or as forensic evidence. They are attached to the threat log and are limited\
    \ to packets containing matched signatures.\n\nYou can create a new Antivirus\
    \ profile by going to **Objects** | **Security Profiles** | **Antivirus**. As\
    \ the following screenshot shows, we will use Palo Alto Networks’ recommended\
    \ best practices settings:\n\n![](Images/B31589_03_01.png)\n\nFigure 3.1: Creating\
    \ an Antivirus profile\n\nFor the Antivirus profile, the setting in the default\
    \ profile will have **imap **and** pop3** set to **alert** only. Since these protocols\
    \ do not respond too well to reset, this may be a good setting in cases where\
    \ they are actively being used in the organization. In most cases, email has been\
    \ replaced by a web-based (TLS/SSL) alternative and it would actually be more\
    \ secure to reset legacy protocols.\n\nExceptions can be added in the **Signature\
    \ Exceptions** tab for false positives or known true positives. Exceptions are\
    \ added by typing (or pasting) the **Threat ID** as found in the threat log and\
    \ clicking **Add**:\n\n![](Images/B31589_03_02_new.png)\n\nFigure 3.2: AntiVirus\
    \ exceptions\n\nAdditional machine learning actions can be set on the **Wildfire\
    \ Inline ML** tab for **Windows Executables**, **PowerShell Script 1** and **PowerShell\
    \ Script 2**, **Executable Linked Format, MSOffice, Shell, OOXML, **and **MachO**.\
    \ Each model can be set to one of three actions:\n\n*   **enable (inherit per-protocol\
    \ actions)**, which enables additional machine learning scanning, and if a virus\
    \ is detected, the matching protocol (**smtp**, **http**, and so on) action that\
    \ was set in the main **Action** tab is applied\n\n*   **alert-only (override\
    \ more strict actions to alert)** will enable additional machine learning scanning\
    \ but positive matches will only be reported in logging\n\n*   **disable (for\
    \ all protocols)**, which is the default setting and does not apply machine learning\
    \ to the selected model\n\nThe following screenshot illustrates the available\
    \ actions per model:\n\n![](Images/B31589_03_03.png)\n\nFigure 3.3: WildFire Inline\
    \ ML\n\nWildFire inline ML can dynamically analyze certain file types for various\
    \ file details and PowerShell scripts for malicious characteristics.\n\n## The\
    \ Anti-Spyware profile\n\nThe Anti-Spyware profile is extremely customizable and\
    \ is built by a set of rules within the profile. These rules serve to change the\
    \ default actions associated with each threat; so, if no rules are created at\
    \ all, the profile will simply apply the default action for a specific signature\
    \ when it is detected.\n\nAnti-Spyware supports the same actions as Antivirus\
    \ (**allow**, **drop**, **alert**, **reset-client**, **reset-server**, and **reset-both**),\
    \ with the addition of **block-ip**, which can track by source or source-destination\
    \ pair and will block the offending IP for a duration of `1`\\-`3600` seconds.\
    \ Tracking by source will block all connections from the client for the duration\
    \ of the block, while tracking by source-destination pair will only block connections\
    \ from the client to the target destination and will not block the same client\
    \ from connecting to other destinations.\n\nThe **Packet Capture** options include:\n\
    \n*   **none**,\n\n*   **single-packet**, which only captures the packet containing\
    \ the payload matching a signature.\n\n*   **extended-capture** enables the capture\
    \ of multiple packets to help analyze a threat. The number of packets captured\
    \ by **extended-capture** can be configured via **Device**  | **Setup**  | **Content-ID**.\
    \ The default is `5`.\n\n**Important note**\n\nEnabling packet capture on all\
    \ threats does require some CPU cycles. The impact will not be very large, but\
    \ if the system is already very taxed, some caution is advised.\n\n**Severity**\
    \ indicates the severity level of the threat that applies to this rule.\n\nCreate\
    \ a new Anti-Spyware profile and add the following rules:\n\n*   **Policy Name**:\
    \ **Block-Critical-High-Medium** \n\n    *   **Severity**: **critical, high, medium**\n\
    \n    *   **Action**: **reset-both**\n\n    *   **Packet Capture**: **single-packet**\n\
    \n*   **Policy Name**: **Default-Low-Info** \n\n    *   **Severity**: **low**,\
    \ **informational**\n\n    *   **Action**: **default**\n\n    *   **Packet Capture**:\
    \ **disable** \n\n        **Important note**"
