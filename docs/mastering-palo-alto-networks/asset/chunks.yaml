- raw: 'In the **XML API**/**REST API** tabs, each role can be granted or denied access
    to certain API calls:


    ![](Images/B31589_02_33.png)


    Figure 2.33: XML API/REST API


    In the **Command Line** tab, each role can be granted a certain level of access
    or denied access altogether:


    ![](Images/B31589_02_34.png)


    Figure 2.34: The Command Line permissions


    Now that we can set up administrator accounts, we should also create a password
    security profile to prevent weak password discipline.


    ### Password security


    You will need to add a password profile by going to **Device** | **Password Profiles**
    to ensure that the password is changed on a regular basis:


    ![](Images/B31589_02_35.png)


    Figure 2.35: Password Profiles


    These are the configurable settings in **Password Profiles**:


    *   The change period indicates how long a password is valid


    *   The expiration warning pops up a warning when an admin logs on if their password
    is about to expire


    *   The post-expiration login feature allows the admin to log on a certain number
    of times, even after their password has expired


    *   The post-expiration grace period indicates how long an admin will be able
    to log on after their account has expired before it is locked permanently and
    will require intervention from a different admin


    Additionally, you should enforce a minimum password complexity for local accounts
    to ensure no weak passwords are used by administrators via **Device** | **Setup**
    | **Management** | **Minimum Password Complexity**:


    ![](Images/B31589_02_36.png)


    Figure 2.36: Minimum Password Complexity


    NIST has an extensive guideline on authentication and life cycle management that
    can be found at [https://pages.nist.gov/800-63-3/sp800-63b.html](https://pages.nist.gov/800-63-3/sp800-63b.html).


    Let’s now look at the external authentication factors.


    ## External authentication


    It is best to use external authentication factors, such as Kerberos, LDAP, RADIUS,
    or SAML, to keep control over credentials in a centralized system, which enables
    admins to only change passwords once for multiple devices or to be locked out
    of all critical infrastructure at once if they leave the organization.


    It is a good safeguard to keep one “break-glass” local account in case the management
    interface loses all access to the external authentication servers. This account
    should only be used in case of emergency and an alert should be sent when the
    account is used to log on. See *Chapter 9*, *Logging and Reporting*, on how to
    set up a profile that can send out an alert if the account is used.


    You first need to create a server profile from the **Device** | **Server Profiles**
    menu. Each server type has its own configuration parameters. The following profiles
    are available:


    *   **TACACS+** (**Terminal Access Control Access Control System Plus**) is an
    authentication protocol developed by Cisco that is still used in many environments
    for terminal access authentication.


    *   **LDAP** (**Lightweight Directory Access Protocol**) is probably one of the
    most commonly available protocols to authenticate against directory services and
    will work with Microsoft Active Directory, eDirectory, and custom LDAP servers.


    *   **RADIUS** (**Remote Authentication Dial-in User Service**) is an open standard
    authentication protocol that is widely used in remote access authentication.


    *   **Kerberos** is an authentication protocol that is mostly used for single
    sign-on and relies on a negotiation that does not require the exchange of passwords.


    *   **SAML** (**Security Assertion Markup Language**) uses an XML framework to
    exchange security information and is mostly used with cloud-based **identity providers**
    (**IdPs**). It integrates with **multi-factor authentication** (**MFA**) very
    easily.


    *   Multi-factor profiles allow for several built-in MFA providers to be configured
    and added separately to an authentication profile.


    Let’s take a look at each of these profiles and how to set their basic configuration.


    ### The TACACS+ server profile


    TACACS+ requires you to choose between **Password Authentication Protocol** (**PAP**)
    and **Challenge-Handshake Authentication Protocol** (**CHAP**) and set the secret
    associated with connecting to the TACACS+ authentication server.


    Optionally, you can set the profile so that it can only be used for administrator
    authentication, and set the profile to use a single session for all authentication
    events, rather than a new session per authentication event:


    ![](Images/B31589_02_37.png)


    Figure 2.37: TACACS+ Server Profile


    While TACACS+ is somewhat rare, LDAP authentication is very common.


    ### The LDAP server profile


    For an LDAP profile, you need to provide the type of the LDAP server, which can
    be **active-directory**, **E-directory**, **sun**, or **other**.


    You need to provide a **Base DN** value, which is the domain name (or the distinguished
    name) of the LDAP tree. The **Bind DN** field is for the user account that will
    be used to connect to the LDAP server and perform the request and its password.
    **Bind DN** can be fully qualified, as shown in the following screenshot, or be
    a **user principal name** (**UPN**) formatted as `user@domain`:


    ![](Images/B31589_02_38.png)


    Figure 2.38: LDAP Server Profile


    One thing to remember is that when you configure the server IPs and you have **Require
    SSL/TLS secured connection** enabled, the default port for LDAPS is `636`, rather
    than `389`.


    If your LDAP server has an externally signed certificate, enable **Verify Server
    Certificate for SSL sessions** to ensure the authenticity of your server. For
    the certificate check to work, the LDAP server root and intermediary certificates
    need to be in the device certificate store in **Device** | **Certificate Management**
    | **Certificates** | **Device Certificates**. The server name in the profile must
    match the **fully qualified domain name** (**FQDN**) certificate and `Subject
    AltName` attribute for this check to pass.


    ### The RADIUS server profile


    RADIUS is one of the most popular authentication methods and supports the following
    authentication protocols:


    *   PEAP-MSCHAPv2: **Protected Extensible Authentication Protocol** (**PEAP**)
    with Microsoft CHAP v2 provides improved security over PAP or CHAP by transmitting
    both the username and password in an encrypted tunnel.


    *   PEAP with **Generic Token Card** (**GTC**): PEAP with GTC enables the use
    of one-time tokens in an encrypted tunnel.


    *   EAP-TTLS with PAP: **Extensible Authentication Protocol** (**EAP**) with **Tunneled
    Transport Layer Security** (**TTLS**) and PAP is used to transport plain text
    credentials for PAP in an encrypted tunnel. EAP-TTLS uses certificates to secure
    the connection and should be the preferred protocol as it is the most secure.


    *   CHAP: Used if the RADIUS server does not support EAP or PAP or is not configured
    for it.


    *   PAP: Used if the RADIUS server does not support EAP or CHAP or is not configured
    for it.


    Palo Alto Networks uses vendor code `25461`.


    Like the other profiles, RADIUS can be set so that it is only used for administrator
    authentication. The **Allow users to change passwords after expiry** option is
    limited to GlobalProtect users if the profile is also used to authenticate GlobalProtect
    inbound connections.


    The **Make Outer Identity Anonymous** option ensures the admin username is not
    visible for anyone sniffing the authentication sessions if PEAP-MSCHAPv2, PEAP
    with GTC, or EAP-TTLS are used and the server supports this:


    ![](Images/B31589_02_39.png)


    Figure 2.39: RADIUS Server Profile'
