    \ found and addressed.\n\nCheck the release notes for any known issues so that\
    \ you can appropriately prepare if there are any caveats: [https://docs.paloaltonetworks.com/pan-os/11-2/pan-os-release-notes.html](https://docs.paloaltonetworks.com/pan-os/11-2/pan-os-release-notes.html).\n\
    \n### Are there outstanding advisories that trump the required features?\n\nAdvisories\
    \ regarding which maintenance release versions to choose or avoid can be found\
    \ at [https://securityadvisories.paloaltonetworks.com/](https://securityadvisories.paloaltonetworks.com/)\
    \ and [https://live.paloaltonetworks.com/t5/Customer-Resources/](https://live.paloaltonetworks.com/t5/Customer-Resources/).\n\
    \n### When is an upgrade required and when is it optional?\n\nEach major version\
    \ has a base image, usually the `x.y.0` version, which contains all the vital\
    \ parts of the PAN-OS image.\n\nThis allows the following maintenance versions\
    \ to be smaller in size, containing only critical updates. The base image needs\
    \ to be downloaded onto the system before a maintenance version can be installed.\
    \ It is not required for the base image to be installed in order to be able to\
    \ install the maintenance version when upgrading from a lower major version. It\
    \ is also not required to install any intermediate maintenance versions unless\
    \ the release notes explicitly mention that there is an issue that requires a\
    \ step in between.\n\nSay, for example, that your firewall is currently on `PAN-OS\
    \ 11.0.4` and you need to get to `PAN-OS 11.1.5`. You can download a `PAN-OS 11.1.0`\
    \ base image, followed by a `PAN-OS 11.1.5` maintenance image, and then directly\
    \ install and reboot `PAN-OS 11.1.5`. Your system will be directly upgraded from\
    \ `11.0.4` to `11.1.5`.\n\nIf, for example, your firewall is currently on `PAN-OS\
    \ 10.0.10` and you want to go to `PAN-OS 11.1.5`, you do need to download a `PAN-OS\
    \ 10.1.0` base image and download, install, and reboot the latest maintenance\
    \ release (e.g., `10.1.14`) before you can install `PAN-OS 11.1.5`.\n\n### Important\
    \ note\n\nIn `PAN-OS 10.1`, a new feature was introduced that allows you to skip\
    \ up to three PAN-OS versions when upgrading. When upgrading `PAN-OS 9.1` to `PAN-OS\
    \ 10.1`, you are required to install and reboot into `PAN-OS 10.0`. When upgrading\
    \ `PAN-OS 10.1` to `PAN-OS 11.1`, you can immediately go to the latest `11.1`\
    \ maintenance version without needing to install `10.2` or `11.0`.\n\nYou will\
    \ now have a good understanding of when and why you would need to upgrade and\
    \ how to decide which version you need to upgrade to. In the following section,\
    \ we’ll briefly go over the upgrade process via different methods; see *Chapter\
    \ 8*, *Upgrading Firewalls and Panorama*, for a more thorough upgrade process.\n\
    \n## Upgrading via the CLI\n\nUsing the CLI, commands can be quickly executed\
    \ to perform tasks. To upgrade via the CLI, you can follow these steps:\n\n1.\
    \ You first need to retrieve the available software images that can be installed\
    \ on your system. You won’t be able to download any images before the list is\
    \ retrieved:\n```\nadmin@PA-440> request system software check\nVersion      \
    \                    Size    Released on          Downloaded\n-------------------------------------------------------------------------\n\
    11.2.2-h1                        749MB   2024/08/02 15:58:14  no      \n11.2.1\
    \                           502MB   2024/07/08 12:04:42  no       \n11.2.0-b3\
    \                        1228MB   2024/03/14 12:31:10  no       \n11.2.0-b1  \
    \                      1258MB   2024/02/06 14:20:41  no       \n11.2.0       \
    \                    1239MB   2024/05/02 10:15:34  no      \n11.1.4-h1       \
    \                 1015MB   2024/08/08 02:18:35  yes       \n11.1.4           \
    \                946MB   2024/06/27 08:17:35  no       \n11.1.3              \
    \             893MB   2024/05/14 15:14:14  no       \n```\n\n2. Next, you can\
    \ download the desired PAN-OS version. Remember to first download the base image\
    \ if you’re upgrading to a new major release:\n```\nadmin@PA-440> request system\
    \ software download version 11.2.0\nDownload job enqueued with jobid 31\n```\n\
    \n3. You can track the download status with the following command:\n```\nadmin@PA-440>\
    \ show jobs id 31\nEnqueued            Dequeued ID Type   Status Result Completed\n\
    --------------------------------------------------------------\n2024/08/22 23:24:15\
    \ 23:24:15 31 Downld FIN    OK     23:25:31 \nWarnings:\nDetails:Successfully\
    \ downloaded\nPreloading into software manager\nSuccessfully loaded into software\
    \ manager  \n```\n\n4. Follow up with the maintenance release:\n```\nadmin@PA-440>\
    \ request system software download version 11.2.2-h1\nDownload job enqueued with\
    \ jobid 32\n```\n"
  trans: "\n## 升级规划\n\n升级时，您需要规划当前位置、目标位置以及如何到达。您可以通过查看仪表板的**常规信息**部分并查找软件版本来确定当前位置。确定目标位置可能需要一些研究和考虑：\n\
    \n* 需要哪些功能？某个版本中是否有您需要的全新功能，还是您现有的功能运行良好？\n* 代码分支是否“成熟”？新主要版本是否全新发布，新功能是否足以抵消早期采用者的风险？\n\
    * 是否存在优先于所需功能的未解决公告？计划升级到的版本中是否存在尚未修复的关键漏洞？\n* 何时需要升级，何时升级是可选的？是否因漏洞或错误而必须直接升级，还是新版本中的功能会有所帮助？\n\
    * 您当前的 OS 代码分支是否即将达到生命周期终点？（您可以在此处查看生命周期终点日期：[`www.paloaltonetworks.com/services/support/end-of-life-announcements/end-of-life-summary`](https://www.paloaltonetworks.com/services/support/end-of-life-announcements/end-of-life-summary)）。\n\
    \n这些问题将帮助您确定哪些升级需要立即进行，哪些可以提前安排，可能在部署到生产环境之前进行更宽松的测试过程，甚至可以推迟到更成熟的维护版本可用时。让我们现在尝试回答这些问题。\n\
    \n### 需要哪些功能？\n\n确定每个 PAN-OS 版本包含哪些功能需要最多的研究。您可以打开 [`docs.paloaltonetworks.com`](https://docs.paloaltonetworks.com)\
    \ 并搜索 `Feature Guide`，它将返回主要 PAN-OS 版本的所有新功能指南。\n\n### 代码分支是否“成熟”？\n\n成熟度可以通过查看维护版本来估算。所有\
    \ PAN-OS 版本都由三个数字组成 – `PAN-OS X.Y.Z`（例如，`10.1.5`）：\n\n* `X` 是主要软件版本的编号\n* `Y`\
    \ 是功能版本发布的编号\n* `Z` 是维护版本的编号\n\n`X` 会发生变化，当发布包含新功能且通常包含预期行为的某些更改以及可能的全新外观的新主要软件版本时。\n\
    \n每个新软件版本通常在发布后约 6 至 9 个月发布新的功能版本，主要包含一些新功能。维护版本会定期发布，间隔约 5 至 9 周，主要包含错误修复。\n\n\
    偶尔会出现以 `-hx` 结尾的 PAN-OS 版本名称，表示热修复。这是一种提前发布的维护版本，通常只包含一个或几个关键热修复（例如，`11.2.2-h1`）。\n\
    \n代码分支通常在 `x.y.4` 或 `x.y.5` 维护版本左右达到可靠的成熟度，此时可以相对安全地认为大多数关键错误已被发现并解决。\n\n请查看发行说明中的已知问题，以便在存在任何注意事项时做好适当准备：[`docs.paloaltonetworks.com/pan-os/11-2/pan-os-release-notes.html`](https://docs.paloaltonetworks.com/pan-os/11-2/pan-os-release-notes.html)。\n\
    \n### 是否存在优先于所需功能的未解决公告？\n\n有关应选择或避免哪些维护版本的公告可在 [`securityadvisories.paloaltonetworks.com/`](https://securityadvisories.paloaltonetworks.com/)\
    \ 和 [`live.paloaltonetworks.com/t5/Customer-Resources/`](https://live.paloaltonetworks.com/t5/Customer-Resources/)\
    \ 找到。\n\n### 何时需要升级，何时升级是可选的？\n\n每个主要版本都有一个基础映像，通常是 `x.y.0` 版本，其中包含 PAN-OS 映像的所有重要部分。\n\
    \n这使得后续的维护版本体积更小，仅包含关键更新。基础映像需要在安装维护版本之前下载到系统上。\n\n从较低的主要版本升级时，并不需要安装基础映像即可安装维护版本。也不需要安装任何中间维护版本，除非发行说明明确提到存在需要中间步骤的问题。\n\
    \n例如，假设您的防火墙当前运行 `PAN-OS 11.0.4`，需要升级到 `PAN-OS 11.1.5`。您可以先下载 `PAN-OS 11.1.0`\
    \ 基础映像，然后下载 `PAN-OS 11.1.5` 维护映像，然后直接安装并重启 `PAN-OS 11.1.5`。系统将直接从 `11.0.4` 升级到\
    \ `11.1.5`。\n\n例如，如果您的防火墙当前运行 `PAN-OS 10.0.10`，并且您想升级到 `PAN-OS 11.1.5`，则需要先下载\
    \ `PAN-OS 10.1.0` 基础映像，并下载、安装并重启最新的维护版本（例如，`10.1.14`），然后才能安装 `PAN-OS 11.1.5`。\n\
    \n### 重要说明\n\n在 `PAN-OS 10.1` 中，引入了一项新功能，允许在升级时跳过最多三个 PAN-OS 版本。将 `PAN-OS 9.1`\
    \ 升级到 `PAN-OS 10.1` 时，您需要安装并重启到 `PAN-OS 10.0`。将 `PAN-OS 10.1` 升级到 `PAN-OS 11.1`\
    \ 时，您可以直接升级到最新的 `11.1` 维护版本，无需安装 `10.2` 或 `11.0`。\n\n您现在应该对何时以及为何需要升级以及如何决定升级到哪个版本有了良好的理解。在下一节中，我们将简要介绍通过不同方法进行的升级过程；有关更详细的升级过程，请参阅\
    \ *第 8 章*，*升级防火墙和 Panorama*。\n\n## 通过 CLI 升级\n\n使用 CLI，可以快速执行命令来执行任务。要通过 CLI 升级，您可以按照以下步骤操作：\n\
    \n1. 您首先需要检索可在系统上安装的可用软件映像。在检索到列表之前，您将无法下载任何映像：\n```\nadmin@PA-440> request system\
    \ software check\nVersion                          Size    Released on       \
    \   Downloaded\n-------------------------------------------------------------------------\n\
    11.2.2-h1                        749MB   2024/08/02 15:58:14  no      \n11.2.1\
    \                           502MB   2024/07/08 12:04:42  no       \n11.2.0-b3\
    \                        1228MB   2024/03/14 12:31:10  no       \n11.2.0-b1  \
    \                      1258MB   2024/02/06 14:20:41  no       \n11.2.0       \
    \                    1239MB   2024/05/02 10:15:34  no      \n11.1.4-h1       \
    \                 1015MB   2024/08/08 02:18:35  yes       \n11.1.4           \
    \                946MB   2024/06/27 08:17:35  no       \n11.1.3              \
    \             893MB   2024/05/14 15:14:14  no       \n```\n\n2. 接下来，您可以下载所需的 PAN-OS\
    \ 版本。如果升级到新的主要版本，请记住先下载基础映像：\n```\nadmin@PA-440> request system software download\
    \ version 11.2.0\nDownload job enqueued with jobid 31\n```\n\n3. 您可以使用以下命令跟踪下载状态：\n\
    ```\nadmin@PA-440> show jobs id 31\nEnqueued            Dequeued ID Type   Status\
    \ Result Completed\n--------------------------------------------------------------\n\
    2024/08/22 23:24:15 23:24:15 31 Downld FIN    OK     23:25:31 \nWarnings:\nDetails:Successfully\
    \ downloaded\nPreloading into software manager\nSuccessfully loaded into software\
    \ manager  \n```\n\n4. 随后进行维护版本：\n```\nadmin@PA-440> request system software download\
    \ version 11.2.2-h1\nDownload job enqueued with jobid 32\n```\n"
