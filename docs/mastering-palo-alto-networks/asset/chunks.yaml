  trans: "\n1. 已见应用列\n4. 创建 NAT 规则\n   1. 入站 NAT\n   2. 出站 NAT\n      1. 隐藏 NAT 或\
    \ 一对多 NAT\n      2. 一对一 NAT\n      3. U 形回转或发夹 NAT\n      4. 启用 DNS 重写\n5. 摘要\n\
    \n# 地标\n\n1. 封面\n\n# 精通 Palo Alto Networks：从部署到高级安全，通往防火墙精通的完整之旅\n\n**欢迎加入 Packt\
    \ 抢先体验**。我们在本书正式发售前为您提供独家预览。撰写一本书可能需要数月时间，但我们的作者今天就有前沿信息与您分享。抢先体验通过提供章节草稿，让您深入了解最新发展。章节目前可能还不够完善，但我们的作者会随着时间推移不断更新。您可以随意翻阅本书或从头到尾跟随阅读；抢先体验旨在保持灵活性。我们希望您能享受了解\
    \ Packt 书籍撰写过程的乐趣。\n\n1. 第 1 章：了解核心技术\n2. 第 2 章：设置新设备\n3. 第 3 章：构建强大的策略\n4. 第\
    \ 4 章：控制会话\n5. 第 5 章：服务和操作模式\n6. 第 6 章：识别用户并控制访问\n7. 第 7 章：通过 Panorama 管理防火墙\n\
    8. 第 8 章：通过 Strata Cloud Manager 管理防火墙\n9. 第 9 章：升级防火墙和 Panorama\n10. 第 10 章：日志记录和报告\n\
    11. 第 11 章：虚拟专用网络\n12. 第 12 章：高级保护\n13. 第 13 章：故障排除常见会话问题\n14. 第 14 章：深入故障排除\n\
    15. 第 15 章：基于云的防火墙部署\n\n# 1 了解核心技术\n\n欢迎阅读第一章！在本書中，我们将探索 Palo Alto Networks Strata\
    \ 套件的方方面面。我们将首先学习防火墙的所有不同功能以及如何配置它们，然后再进入更复杂的功能和附加服务，帮助您完成部署。在此过程中，您将获得重要的知识要点，帮助您既理解技术，又通过\
    \ `PCNSE` 考试。\n\n在本章中，我们将研究构成 Palo Alto Networks 防火墙的核心技术。我们将更仔细地查看安全区域如何控制安全、`Network\
    \ Address Translation` (`NAT`) 和路由判决的制定方式。我们将回顾 `App-ID` 和 `Content-ID` 背后的机制，以便您更深入地了解数据包的处理方式以及防火墙如何做出安全决策，并且我们将回顾\
    \ `User-ID` 如何通过应用基于组或基于用户的访问控制来提供更强大的安全态势。\n\n本章将涵盖以下主题：\n\n* 了解基于区域的防火墙\n* 了解\
    \ `App-ID` 和 `Content-ID`\n* 管理平面和数据平面\n* 使用 `User-ID` 对用户进行身份验证\n\n到本章结束时，您将更好地了解核心技术是如何构建的，并且在我们开始构建配置时能够应用这些技能。如果您正在准备\
    \ `PCNSE` 考试，本章还将帮助您理解解决基于场景问题的所需基础知识。\n\n## 技术要求\n\n对于本章，不需要物理安装；仅对技术进行解释。充分理解\
    \ `UDP` 和 `TCP` 等基本网络协议对于充分受益于以下材料是必要的。如果您已经使用过 Palo Alto Networks 防火墙，将有所帮助，但不是必需的。一般来说，具备防火墙或\
    \ Web 代理的经验是推荐的，这样主题会更具体。\n\n## 了解基于区域的防火墙\n\n传统上，在将防火墙视为网络元素时，您最有可能想象的网络设计如 *图\
    \ 1.1* 所示，围绕一个盒子有两到四个区域。大多数时候，位于北方的东西被认为是危险的，因为它代表互联网，东西两侧是有些灰色的区域，因为它们是 `demilitarized\
    \ zones` (`DMZs`)，部分暴露于互联网，而南方是用户日常工作的快乐之地。中间的盒子是防火墙。所有这些区域都将在防火墙中定义为区域：\n\n![](img/B31589_01_01.png)\n\
    \n图 1.1：基本网络拓扑\n\n实际上，由于网络分段、远程办公室通过各种不同的技术连接到总部，以及云厂商的采用，网络设计可能看起来复杂得多。\n\n在\
    \ `route-based firewall` 中，区域只是帮助识别公司使用的全球网络包含哪些区域的架构或拓扑概念；它们通常由可以附加到子网对象的标签表示。它们在系统处理安全策略时所做的任何安全决策中都没有影响。\n\
    \n`zone-based firewall` 另一方面，将使用区域作为在状态表中内部分类源和目的地的手段。\n\n下图说明了数据包处理的阶段，从新会话的第一个数据包进入防火墙的第一步，到数据包从防火墙发出的最后一步：\n\
    \n![](img/B31589_01_02.png)\n\n图 1.2：数据包处理阶段\n\n让我们来看一下初始数据包处理的流程：\n\n1. 当数据包首次接收时，会执行源区域查找。如果源区域关联了保护配置文件，则数据包会根据配置文件配置进行评估。如果第一个数据包是\
    \ `TCP` 数据包，它还将根据 `TCP` 状态进行评估，其中第一个数据包需要是 `SYN` 数据包，并且如果保护配置文件阈值达到，则会触发 `SYN`\
    \ cookie。\n2. 然后，通过检查 `policy-based forwarding` (`PBF`) 规则来确定目标区域，如果未找到结果，则会咨询路由表。\n\
    3. 最后，评估 `NAT` 策略，因为 `NAT` 规则操作可能会更改目标 IP，从而更改路由表中的目标接口和区域。这将需要二次转发查找以确定后 `NAT`\
    \ 的出站接口和区域。\n\n在 `initial packet processing` 中执行这些区域查找后，防火墙将继续进行 `security pre-policy`\
    \ 评估。\n\n在预策略评估中，使用 \"`6-tuple`\" 在建立或丢弃/拒绝会话之前将传入会话与规则库进行匹配。在此阶段，防火墙尚未考虑应用程序，因为这通常无法通过会话中的第一个数据包确定。六元组由以下元素组成：\n\
    \n* Source IP\n* Source zone\n* Destination IP\n* Destination zone\n* Destination\
    \ port\n* Protocol\n\n区域附加到物理、虚拟或子接口。每个接口只能属于一个单一区域。可以创建区域以适应任何命名约定，并且在用途上可以非常具有描述性（`untrust`、`DMZ`、`LAN`\
    \ 等），这确保了从管理角度来看，每个区域都易于识别。\n\n"
