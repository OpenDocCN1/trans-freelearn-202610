- raw: "```\n1 - Empty - Data Carrier Detect (DCD)\n2 - 3 - Receive Data (RXD)\n3\
    \ - 6 - Transmit Data - (TXD)\n4 - 7 - Data Terminal Ready (DTR)\n5 - 4 - Ground\
    \ (GND)\n6 - 2 - Data Set Ready (DSR)\n7 - 8 - Request To Send (RTS)\n8 - 1 -\
    \ Clear to Send - (CTS)\n9 - Empty - Ringing Indicator (RI)\n```\n\nLuckily, there\
    \ are USB-to-RJ45 cables available as well that will save you the trouble of figuring\
    \ out the correct pinouts:\n\n![](Images/B31589_02_01.png)\n\nFigure 2.1: RJ45-to-USB\
    \ console cable\n\nAll but the very old models also come with a micro-USB port,\
    \ which allows a console connection to be made using a standard USB-A-to-micro-USB\
    \ cable, as in the following picture:\n\n![](Images/B31589_02_02.png)\n\nFigure\
    \ 2.2: PA-460 RJ45 and the micro-USB console ports\n\nIn all cases, you will need\
    \ to find which COM (hardware interface) or **TTY** (**TeleTYpewriter**) port\
    \ is being used on your computer’s operating system.\n\nOn a Windows machine,\
    \ the first time you plug in the cable, a driver may need to be installed. Once\
    \ the installation has been completed, you need to find the virtual COM port number\
    \ that has been assigned to the console cable. In most cases, you can determine\
    \ this virtual COM port number by following these steps:\n\n1.  Open the **Device\
    \ Manager**.\n\n2.  Click **Start | Control Panel | Hardware and Sound | Device\
    \ Manager** (under **Devices and Printers**).\n\n3.  In the** Device Manager**\
    \ list, look in **Ports** and find the virtual COM port assigned to the USB port.\
    \ This entry will look similar to **USB to Serial Port (COM#)**, where COM# is\
    \ the number to be used in the following step.\n\nNext, you will need a terminal\
    \ emulation client to connect to the console. You can use a free client for this,\
    \ such as PuTTY from [https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html](https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html).\n\
    \nBesides the COM port, you may need to provide more settings to be able to connect.\
    \ If asked, use these settings:\n\n```\nBits per second: 9600        \nData Bits:\
    \ 8    \nParity: none              \nStop bits: 1\nFlow control: none        \
    \   \n```\n\nOn macOS and Linux, a USB serial connection will usually create a\
    \ new `tty` entry in the `/dev/` directory; a USB-to-DB9 dongle may create a **call-up**\
    \ (**CU**) entry in the `/dev/` directory.\n\nFind the proper device by searching\
    \ with either of these commands:\n\n```\nls /dev/tty.*\nls /dev/cu.*\n```\n\n\
    You will find `/dev/cu.usbserialxxxxx` or `/dev/tty.usbmodemxxxxx`, where `xxxxx`\
    \ is the serial device name.\n\nOnce you determine the appropriate device, you\
    \ can connect to the console port by using the `screen` command set to `9600`\
    \ bits per second:\n\n```\nscreen /dev/tty.usbmodemxxxxx 9600\n```\n\nNow, go\
    \ ahead and connect the console cable or micro-USB to your laptop and appliance.\
    \ If you have a port free on your management network, go ahead and connect the\
    \ firewall’s MGT port to the switch. If you don’t have a management connection\
    \ available yet, you will need to connect your laptop directly to the MGT port\
    \ for easier access once the IP is set up on the management interface. Lastly,\
    \ plug in the power cable.\n\nIf the firewall is loaded in a VM or cloud entity,\
    \ hit the **Start** button to boot up the virtual appliance.\n\nOnce you’ve logged\
    \ on to the console, you will see the operating system boot up, and if the firewall\
    \ is already connected to a DHCP-enabled management network, you will see something\
    \ similar to the following, where the DHCP address is already listed for your\
    \ convenience:\n\n![](Images/B31589_02_03.png)\n\nFigure 2.3: PA-VM post-boot\
    \ DHCP information\n\nIf you missed this information, you can log on and use the\
    \ following command to see the DHCP information:\n\n```\nadmin@PA-440> show system\
