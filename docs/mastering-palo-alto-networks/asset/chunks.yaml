- raw: "If you must enable this profile, make sure it is on a sufficiently shielded\
    \ interface, preferably a loopback interface, that has security policies associated\
    \ with gaining access to the management services. As a secondary measure, also\
    \ enable an access list on the profile.\n\nThese profiles can be configured in\
    \ **Network** | **Network Profiles** | **Interface Management Profile** and then\
    \ attached to an interface in **Network** | **Interfaces** under the **Advanced**\
    \ tab of the selected interface:\n\n![](Images/B31589_02_29.png)\n\nFigure 2.29:\
    \ An interface management profile attached to an interface\n\nThe CLI command\
    \ to create an interface management profile, set its services to HTTPS and SSH,\
    \ and add an Access Control List (ACL) is as follows:\n\n```\n# set network profiles\
    \ interface-management-profile mgmt https yes ssh yes permitted-ip 10.15.15.37\n\
    ```\n\nThe subsequent ACL items can be set via the following command:\n\n```\n\
    # set network profiles interface-management-profile mgmt permitted-ip 192.168.0.5\n\
    ```\n\nAs a best practice, never configure a management profile on an internet-facing\
    \ interface.\n\nNow that access to the management interface has been set, let’s\
    \ look at access from the management interface.\n\n## Accessing internet resources\
    \ from offline management\n\nIf the management interface does not have access\
    \ to the internet, this can create interesting challenges as it will not be able\
    \ to retrieve updates or perform cloud lookups. A workaround is to enable service\
    \ routes that route specific applications, services, or protocols via the backplane\
    \ onto a designated data plane interface, allowing the management plane to reach\
    \ out to the internet while its physical interface does not have access outside\
    \ of its management LAN.\n\nService routes can be configured from the **Device**\
    \ | **Setup** | **Services** menu, where you can click on **Service Route Configuration**\
    \ to get the following dialog:\n\n![](Images/B31589_02_30.png)\n\nFigure 2.30:\
    \ Service Route Configuration\n\nHere’s a quick overview of what the predefined\
    \ service routes are used for:\n\n*   **AutoFocus**: A direct connection to the\
    \ Autofocus subscription service so you can consume it directly from the firewall\
    \ web interface\n\n*   **CRL Status**: Fetching **Certificate Revocation List**\
    \ (**CRL**) information when processing certificates (e.g., during TLS handshakes)\n\
    \n*   **Data Services**: Used for data uplinks from the data plane to Palo Alto\
    \ cloud services, used for IoT, DLP, and SaaS subscription services\n\n*   **DDNS**:\
    \ Updates the interface IP with the **Dynamic Domain Name System** (**DDNS**)\n\
    \n*   **Panorama pushed updates**: Content and software updates deployed from\
    \ Panorama (these are triggered from Panorama but initiated from the firewall)\n\
    \n*   **DNS**: System DNS lookups\n\n*   **External Dynamic Lists**: Fetching\
    \ updates for configured **external dynamic lists** (**EDLs**)\n\n*   **Email**:\
    \ Email sent out by the system\n\n*   **Gp IP Mgmt**: External DHCP for GlobalProtect\
    \ IP assignment\n\n*   **HSM**: **Hardware Security Module** is a remote system\
    \ that maintains the private key for the certificate used for SSL/TLS decryption\n\
    \n*   **HTTP**: System HTTP forwarding\n\n*   **Kerberos**: Kerberos authentication\n\
    \n*   **LDAP**: **Lightweight Directory Access Protocol** connections\n\n*   **MDM**:\
    \ **Mobile Device Manager** connections\n\n*   **Multi-Factor Authentication**:\
    \ **MFA** authentication server\n\n*   **NetFlow**: NetFlow collector for network\
    \ statistics\n\n*   **NTP**: **Network Time Protocol** updates\n\n*   **Palo Alto\
    \ Networks Services**: Updates from Palo Alto Networks and WildFire sandbox connections\n\
    \n*   **Panorama**: Connection to the Panorama management server\n\n*   **Panorama\
    \ Log Forwarding**: Logs sent to a log collector (used by the PA\\_5200 chassis\
    \ only)\n\n*   **Proxy**: Connections to the system proxy\n\n*   **RADIUS**: **Remote\
    \ Authentication Dial-in User Service** connections\n\n*   **SCEP**: **Simple\
    \ Certificate Enrollment Protocol** connections for requesting and distributing\
    \ client certificates\n\n*   **SNMP Trap**: Sending SNMP statistics to an SNMP\
    \ server\n\n*   **Syslog**: Syslog messaging server\n\n*   **TACACS+**: **Terminal\
    \ Access Controller Access Control System Plus** authentication\n\n*   **UID Agent**:\
    \ User ID agent connections\n\n*   **URL Updates**: URL filtering live lookup\
    \ service\n\n*   **VM Monitor**: Virtual machine monitoring\n\n*   **WildFire\
    \ Private**: Connection to the private WildFire server\n\n*   **Ztp**: Connection\
    \ to the ZTP service\n\nOnce you set the radio button from **Use Management Interface\
    \ for all** to **Customize**, you will be able to select which source interface\
    \ will be used for each service. From the **Destination** tab, you can also add\
    \ specific IP addresses or entire subnets that need to be routed out of a specific\
    \ interface. The routing table used by the target interface will determine how\
    \ the session is routed to the destination, so service routes can only be attached\
    \ to OSI Layer 3 interfaces.\n\nThe associated CLI configuration command to set\
    \ a service route is as follows:\n\n```\n#set deviceconfig system route service\
    \ dns source interface ethernet1/8 address 192.168.0.15\n```\n\nIf you want to\
    \ see a full list of all the available services, hit the `Tab` key after typing\
    \ `service`:\n\n```\n#set deviceconfig system route service <Tab>\n  autofocus\
    \                    AutoFocus Cloud\n  crl-status                   CRL servers\n\
    \  ddns                         DDNS server(s)\n  ...\n```\n\nThis will enable\
    \ access to resources that are normally not accessible through the management\
    \ network. In the next section, we’ll prepare administrator accounts and provide\
    \ access as needed.\n\n## Admin accounts\n\nThe “admin” account is probably one\
    \ of the most abused accounts in internet history, so your next task is to get\
    \ rid of it and replace it with named accounts. Instead of the default “admin”\
    \ account, it is best practice to use named accounts so changes can be tracked\
    \ by the user and personalized access can be granted easily.\n\nNavigate to the\
    \ **Device** | **Administrators **tab to view local administrators. When creating\
    \ new administrator accounts there are two types of accounts available, **Dynamic**\
    \ and **Role Based**, which you can select by setting the **Administrator Type**\
    \ toggle:\n\n![](Images/B31589_02_31.png)\n\nFigure 2.31: Creating a new admin\
    \ account\n\nFirst, we’ll take a look at dynamic account profiles and their benefits.\n\
    \n### Dynamic accounts\n\nDynamic accounts may be of the following types:\n\n\
    *   **Superusers** can do everything. They are the only users that are allowed\
    \ to perform certain tasks like creating other administrator accounts or creating\
    \ a tech support file.\n\n*   **Device administrators** can do everything besides\
    \ create new users or virtual systems.\n\n*   Virtual system-capable devices also\
    \ have **virtual system administrators**, who are also device administrators and\
    \ are restricted to one or several specific virtual systems.\n\n*   There are\
    \ also read-only flavors that can view everything but not make changes.\n\nYour\
    \ first account will need to be a new superuser to replace the default admin account.\n\
    \n### Role-based administrators\n\nOnce all the required superusers and device\
    \ administrators are created, additional role-based administrators can be added\
    \ for teams that only require limited functionality. Role-based administrators\
    \ can be customized down to individual menu items so that they can do anything\
    \ or have read-only or no access.\n\nThe roles can be configured through the **Device**\
    \ | **Admin Roles** menu:\n\n![](Images/B31589_02_32.png)\n\nFigure 2.32: Admin\
    \ Role Profile\n\nSet each topic to one of the following options by clicking the\
    \ icon to cycle to the option you need:\n\n*   A red cross indicates that these\
    \ administrators will not see the menu item\n\n*   A lock indicates that the admin\
    \ will be able to see objects or menu items, but not make any changes\n\n*   A\
    \ green checkmark indicates that the admin has full access to this menu item and\
    \ can make changes to objects or configurations within it"
