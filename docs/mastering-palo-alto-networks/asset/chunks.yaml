    \ updates. This package requires an active Threat Prevention license to be installed\
    \ successfully.\n   * `panupv2-all-apps` only includes app ID updates and is used\
    \ when a Threat Prevention license is not active on the device.\n3. Click `Check\
    \ Now`, which will make the antivirus packages visible.\n4. Download and install\
    \ the latest `panup-all-antivirus` package.\n5. Set an `Antivirus` update schedule:\n\
    \   * Hourly recurrence\n   * 15 minutes after the hour\n   * Download and install\n\
    \   * 6-hour threshold\n6. If you have a WildFire subscription license, set a\
    \ `WildFire` update schedule to `Real-time` (firewalls on high-latency internet\
    \ links can be set to 1-minute or 15-minute update intervals).\n7. Set an `Applications\
    \ and Threats` update schedule:\n   * Every 30 minutes\n   * 7 minutes past the\
    \ half-hour\n   * Download and install\n   * 6-hour threshold\n   * Leave the\
    \ `Allow Extra Time to Review New App-IDs` field blank if new app IDs can be added\
    \ immediately; set to a 48-hour threshold (or more) if the security team wishes\
    \ to review new applications before they are activated\n\nThe settings in this\
    \ section are considered best practices as they ensure dynamic updates are scheduled\
    \ so as not to interfere with other scheduled tasks, like report generation. The\
    \ threshold ensures an update is not applied until some time has passed by postponing\
    \ the actual installation and then rechecking the available content package at\
    \ the threshold time. If a new package is available due to an error or an urgent\
    \ update, the new package is downloaded and the threshold timer is refreshed.\
    \ The process repeats once the threshold has been reached again and either the\
    \ latest package is installed or the update is postponed to the next scheduled\
    \ occurrence. Not only do content packages need to be updated frequently, but\
    \ new software versions are made available at regular times to address bugs or\
    \ introduce new features. Let’s now have a look at the steps needed to upgrade\
    \ your firewall.\n\n# Upgrading the firewall\nIn this section, you will learn\
    \ how to upgrade your firewall and what steps need to be taken to ensure a smooth\
    \ process. We will review important information to keep in mind when preparing\
    \ your maintenance window and providing a contingency plan. In-depth upgrade procedures\
    \ are provided in Chapter 8, Upgrading Firewalls and Panorama.\n\n## Understanding\
    \ the partitions\nBefore we start the upgrade procedure, there’s an important\
    \ bit of information you need to know. Like most Linux systems, the hard disk\
    \ has been partitioned into specific segments. These segments serve a specific\
    \ purpose.\n\nA few important ones are as follows:\n* `/` is the root partition,\
    \ which is where the operating system is installed\n* `/opt/pancfg` is where the\
    \ configuration files and dynamic update files are kept\n* `/opt/panrepo` is the\
    \ repository for downloaded operating system (PAN-OS) images\n* `/opt/panlogs`\
    \ is the partition where `logdatabase` is stored\n\nThere is a hidden `maint`\
    \ partition that can only be accessed during bootup. This partition is used for\
    \ disaster recovery, factory resetting the device, and disk issues.\n\nThe disk\
    \ space usage can be viewed with the following command:\n```\nadmin@PA-440> show\
    \ system disk-space\nFilesystem      Size  Used Avail Use% Mounted on\n/dev/mmcblk0p2\
    \   21G  5.9G   14G  31% /\nnone            7.8G   64K  7.8G   1% /dev\n/dev/mmcblk0p5\
    \   32G   13G   18G  42% /opt/pancfg\n/dev/mmcblk0p6   18G  9.6G  7.0G  58% /opt/panrepo\n\
    tmpfs           7.8G  3.8G  4.1G  48% /dev/shm\ncgroup_root     7.8G     0  7.8G\
    \   0% /cgroup\n/dev/mmcblk0p8   22G   11G  9.6G  53% /opt/panlogs\nNone\n```\n\
    \nThe cool thing about the `/` root partition is that it is actually one of two\
    \ `sysroot` partitions. The system has been partitioned with two operating system-specific\
    \ partitions, of which just one is mounted at a time. The upgrade procedure installs\
    \ the new PAN-OS onto the inactive partition.\n\nThis allows inline upgrades without\
    \ interrupting the active partition. Once the new operating system has been installed,\
    \ the GRUB bootloader is configured to load the other `sysroot` partition at the\
    \ next boot, causing the new PAN-OS to become active:\n```\nadmin@PA-440> debug\
    \ swm status\nPartition         State             Version\n--------------------------------------------------------------------------------\n\
    sysroot0          RUNNING-ACTIVE    11.2.2-h1\nsysroot1          REVERTABLE  \
    \      11.2.0\nmaint             READY             11.2.2-h1\n```\n\nThis mechanism\
    \ also allows a smooth rollback in case an upgrade fails and it is decided you\
    \ need to go back to the previous situation. You can trigger the `> debug swm\
    \ revert` debug command to tell the bootloader to switch the toggle again to the\
    \ previous `sysroot` partition and reboot the system via `> request restart system`.\
    \ After the device has rebooted, you are back on the previous PAN-OS with the\
    \ pre-upgrade configuration loaded.\n\n## Upgrade considerations\n"
  trans: "\n## 阈值\n`Threshold` 是一个设置，用于将内容包的安装延迟设定小时数。当此阈值到期时，防火墙会检查是否有新的更新包。如果发现新包，则下载新包并将\
    \ `Threshold` 重置以进行另一次尝试。如果在第一次重置后又发现另一个更新包，计划将重置直至下一次完整发生。如果未检测到新包，则将按 `Threshold`\
    \ 定义安装该包。\n\n阈值延迟是一种防止安装有缺陷包的机制；如果厂商提供制作不佳的内容，则延迟以小时为单位设置，这应允许其他账户体验缺陷并将内容问题报告回支持团队。因此，内容可由管理员或厂商回滚。此阈值选项与公司对厂商错误风险的容忍度以及对组织新出现威胁的平衡相关。\n\
    \n### PCNSE 提示\n根据 Palo Alto Networks 的最佳实践，以安全为先的方法是将阈值设置为 6 至 12 小时；然而，对于关键环境，阈值应为\
    \ 24 小时。\n\n`Application` 内容包还具有完全 `Disable new apps in content update` 的选项，或仅对应用\
    \ ID 启用单独的阈值以 `Allow Extra Time to Review New App-IDs`。其原因在于，今天被识别为网页浏览的内容，在明天安装\
    \ `Application` 内容包后可能会变成一个独特的应用程序。如果安全策略设置为仅允许之前已知的应用程序，这可能会导致用户突然无法访问该特定应用程序的问题。\n\
    \n`New App-ID Threshold` 设置允许您安排一个审查期，以查看在应用程序变为活动状态之前是否需要在安全策略中考虑任何应用程序。如果不需要操作，应用程序将自动变为活动状态。`Disable\
    \ new apps in content update` 选项不会激活任何新应用程序，直到您手动审查并激活所有新应用程序为止。\n\n### 重要说明\n\
    在撰写本文时，新应用程序的发布计划为每月第三个星期二。常规威胁包更新在星期二进行，但紧急更新会立即发送。\n\n## 动态更新速查表\n以下是安排动态更新的快速建议集：\n\
    1. 点击 `Check Now`。\n2. 下载并安装最新的 `panupv2-all-contents` 或 `panupv2-all-apps` 包：\n\
    \   * `panupv2-all-content` 包含所有应用 ID、间谍软件和漏洞更新。此包需要激活的 Threat Prevention 许可证才能成功安装。\n\
    \   * `panupv2-all-apps` 仅包含应用 ID 更新，当设备上未激活 Threat Prevention 许可证时使用。\n3. 点击\
    \ `Check Now`，这将使防病毒包可见。\n4. 下载并安装最新的 `panup-all-antivirus` 包。\n5. 设置 `Antivirus`\
    \ 更新计划：\n   * 每小时重复\n   * 小时后 15 分钟\n   * 下载并安装\n   * 6 小时阈值\n6. 如果您拥有 WildFire\
    \ 订阅许可证，请将 `WildFire` 更新计划设置为 `Real-time`（高延迟互联网链路上的防火墙可设置为 1 分钟或 15 分钟更新间隔）。\n\
    7. 设置 `Applications and Threats` 更新计划：\n   * 每 30 分钟\n   * 半小时后 7 分钟\n   * 下载并安装\n\
    \   * 6 小时阈值\n   * 如果新应用 ID 可以立即添加，请将 `Allow Extra Time to Review New App-IDs`\
    \ 字段留空；如果安全团队希望在激活新应用程序之前进行审查，请设置为 48 小时阈值（或更长）\n\n本节中的设置被视为最佳实践，因为它们确保动态更新的安排不会干扰其他计划任务，例如报告生成。阈值确保在经过一段时间后才应用更新，通过推迟实际安装然后在阈值时间重新检查可用的内容包来实现。如果由于错误或紧急更新而有新包可用，则下载新包并刷新阈值计时器。一旦再次达到阈值，流程就会重复，要么安装最新包，要么将更新推迟到下一次计划发生时间。不仅内容包需要频繁更新，而且新软件版本也会在固定时间发布以修复错误或引入新功能。现在让我们来看看升级防火墙所需的步骤。\n\
    \n# 升级防火墙\n在本节中，您将学习如何升级防火墙以及需要采取哪些步骤以确保顺利进行。我们将回顾在准备维护窗口和提供应急计划时需要牢记的重要信息。深入的升级程序在第\
    \ 8 章《Upgrading Firewalls and Panorama》中提供。\n\n## 了解分区\n在开始升级程序之前，有一些重要信息您需要了解。与大多数\
    \ Linux 系统一样，硬盘已被划分为特定段。这些段具有特定的用途。\n\n其中几个重要的如下：\n* `/` 是根分区，操作系统安装在此处\n* `/opt/pancfg`\
    \ 是存放配置文件和动态更新文件的位置\n* `/opt/panrepo` 是下载的操作系统（PAN-OS）镜像的存储库\n* `/opt/panlogs`\
    \ 是存储 `logdatabase` 的分区\n\n有一个隐藏的 `maint` 分区，只能在启动期间访问。该分区用于灾难恢复、恢复设备出厂设置以及磁盘问题。\n\
    \n可以使用以下命令查看磁盘空间使用情况：\n```\nadmin@PA-440> show system disk-space\nFilesystem \
    \     Size  Used Avail Use% Mounted on\n/dev/mmcblk0p2   21G  5.9G   14G  31%\
    \ /\nnone            7.8G   64K  7.8G   1% /dev\n/dev/mmcblk0p5   32G   13G  \
    \ 18G  42% /opt/pancfg\n/dev/mmcblk0p6   18G  9.6G  7.0G  58% /opt/panrepo\ntmpfs\
    \           7.8G  3.8G  4.1G  48% /dev/shm\ncgroup_root     7.8G     0  7.8G \
    \  0% /cgroup\n/dev/mmcblk0p8   22G   11G  9.6G  53% /opt/panlogs\nNone\n```\n\
    \n`/` 根分区的有趣之处在于它实际上是两个 `sysroot` 分区之一。系统已划分为两个操作系统专用分区，其中一次只挂载一个。升级程序将新的 PAN-OS\
    \ 安装到非活动分区上。\n\n这允许在不中断活动分区的情况下进行内联升级。一旦新的操作系统安装完成，GRUB 启动加载器将被配置为在下次启动时加载另一个\
    \ `sysroot` 分区，从而使新的 PAN-OS 处于活动状态：\n```\nadmin@PA-440> debug swm status\nPartition\
    \         State             Version\n--------------------------------------------------------------------------------\n\
    sysroot0          RUNNING-ACTIVE    11.2.2-h1\nsysroot1          REVERTABLE  \
    \      11.2.0\nmaint             READY             11.2.2-h1\n```\n\n此机制还允许在升级失败且决定需要恢复到之前状态时顺利回滚。您可以通过触发\
    \ `> debug swm revert` 调试命令来指示启动加载器再次切换到之前的 `sysroot` 分区，并通过 `> request restart\
    \ system` 重启系统。设备重新启动后，您将回到之前的 PAN-OS，并加载升级前的配置。\n\n## 升级注意事项\n"
