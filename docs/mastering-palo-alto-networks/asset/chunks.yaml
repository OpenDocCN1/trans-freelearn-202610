    3. 其后是对应用程序进行第二次安全策略检查，此时将 `App-ID` 添加到安全策略允许会话通过所需标识符集合中。

    4. 如果在此时或未来的策略检查中确定应用程序为 `SSH`、`TLS` 或 `SSL`，则会执行二次策略检查以验证是否需要应用解密。如果存在解密策略，会话将经过解密，然后再次检查已知应用程序签名，因为封装在
    `TLS` 或 `SSH` 内部的会话可能完全不同。

    5. 如果在此步骤中应用程序未被识别（握手后最多 4 个数据包，或 2,000 字节），`App-ID` 将使用基础协议来确定使用哪个解码器更深入地分析数据包。

    6. 如果协议已知，解码器将继续解码协议，然后再次将负载与已知应用程序签名进行匹配。结果可能是已知应用程序（如 `ssl` 或 `web-browsing`）或未知通用应用程序，如
    `unknown-tcp`。此通用应用程序也可以通过安全策略进行控制以允许或阻止会话。

    7. 然后会话将再次与安全策略进行匹配，以确定是否允许通过或需要被拒绝或丢弃。如果协议未知，`App-ID` 将应用启发式方法尝试确定会话中使用的协议。

    8. 一旦确定使用了哪个协议，就会执行另一次安全策略检查。

    9. 一旦应用程序被识别或所有选项均已耗尽，`App-ID` 将停止对数据包进行识别处理。


    会话的整个生命周期中，已识别的应用程序可能会多次发生变化，因为通过逐个检查数据包从会话中学习到更多信息。例如，`TCP` 会话可能被识别为 `SSL`，即
    `HTTPS` 应用程序，因为防火墙检测到 `SSL` 握手。然后解密引擎和协议解码器将被启动以解密会话并识别加密会话内部包含的内容。接下来，它可能检测到应用程序
    `web-browsing`，因为解码器识别出典型的浏览行为，例如 `HTTP GET`。`App-ID` 然后可以应用已知的应用程序签名来识别 `flickr`。每次应用程序上下文发生变化时，防火墙都会快速检查该特定应用程序是否在其安全规则库中允许。


    如果此时允许 `flickr`，则同一会话在用户尝试上传照片时可能会再次切换上下文，这将触发另一次安全策略检查。之前允许的会话现在可能被防火墙阻止，因为子应用程序
    `flickr-uploading` 可能不被允许。


    一旦 `App-ID` 进程确定了应用程序，应用程序解码器将持续扫描会话中的预期和异常行为，以防应用程序更改为子应用程序或恶意行为者试图通过现有会话隧道传输不同的应用程序或协议。


    `App-ID` 签名和解码器会定期（通常每月 15^(th) 左右）更新，以应对现有应用程序或协议的更改，并为之前未知的应用程序或对现有应用程序的子应用程序添加新签名，以增加深度和控制（例如，Facebook
    聊天、文件共享或游戏）。


    因此，`App-ID` 不仅允许您控制哪些会话允许通过防火墙，还允许您控制这些应用程序的行为方式。在下一节中，我们将了解威胁如何被阻止以及恶意软件如何被拦截。


    ## Content-ID 如何确保安全


    如果在安全规则中启用了适当的安全配置文件，`Content-ID` 引擎将应用 `URL filtering` 策略，并将持续且并行地扫描会话是否存在漏洞利用、病毒或蠕虫感染、可疑
    DNS 查询、`command and control` (`C&C` or `C2`) 签名、DoS 攻击、端口扫描、畸形协议或与敏感数据外泄匹配的数据模式等威胁。`TCP`
    重组和 `IP` 分片重组会执行以防止数据包级规避技术。在以下图像中，您可以看到单次模式匹配如何实现对多种威胁类型的同时扫描，以及 URL 过滤如何被添加到其中：


    ![](img/B31589_01_05.png)


    图 1.5：Content-ID 如何扫描数据包


    所有这些并行发生，因为硬件和软件设计为每个数据包同时由 `App-ID` 解码器和 `Content-ID` 基于流的引擎处理，每个都在机箱上的专用芯片中或通过
    `virtual machine` (`VM`) 中的专用进程处理。这种设计与串行处理相比降低了延迟，这意味着启用更多安全配置文件不会像其他防火墙和 IPS
    解决方案那样带来性能的指数级成本。


    ### 内联评估


    为了扩展我们刚刚讨论的基于签名的评估，防火墙还配备了 `Inline Machine Learning` (`ML`) 和 `Inline Cloud Analysis`
    功能，使其能够独立评估动态内容，而无需等待签名更新即可开始阻止恶意内容。其中一些如下：


    * `WildFire` 能够通过应用 `ML` 模型实时评估 `portable executable` (`PE`)、`executable and linked
    format` (`ELF`)、MS Office 文件、PowerShell 和 shell 脚本。

    * 从 `PAN-OS` 11.2 开始，某些机箱（截至撰写时为 `PA-5400` 和 `PA-VM`）获得本地深度学习 AI，从而扩展 `ML` 功能。

    * `URL Filtering` 可以利用本地和云端 Inline ML 分类来评估网站详情，以保护用户免受钓鱼变种和 JavaScript 漏洞利用的侵害。

    * `Anti-Spyware` 可以利用实时的 Inline Cloud Analysis 访问五个分析引擎，用于通过 `HTTP`、`HTTP2`、`SSL`、unknown-UDP
    和 unknown-TCP 的基于 `C&C` 的威胁。

    * `Vulnerability Protection` 可以利用 Inline Cloud Analysis 来分析 SQL 和 PowerShell 代码注入。


    所有云内联检测都需要防火墙具有活动互联网连接，因此如果您的部署互联网访问受限，请相应规划。


    在本节中，您了解了所有 (`OSI`) 第 7 层内容检查组件如何协同工作，以提供有关哪些应用程序正在穿越防火墙的更多可见性，同时阻止任何恶意负载。


    # 管理平面和数据平面


    硬件和 `VM` 设计专注于实现并行处理的最佳性能，同时仍执行消耗处理能力和可能阻碍流通过系统速度的任务。因此，每个平台都被划分为所谓的 `planes`。


    构成防火墙的两个主要平面是 `data plane` 和 `management` 平面，它们是执行特定功能的物理或逻辑板。虽然所有平台都有管理平面，但像
    `PA-5200` 这样的大型平台还具有额外的 `control plane` 和两个到三个数据平面。最大平台具有可更换的硬件刀片（线路卡），每个线路卡最多有三个数据平面等效件，并且可容纳多达
    10 个线路卡。像 `PA-220` 这样的小型平台只有一个硬件板，其职责在 CPU 核心之间虚拟划分。

    '
