  trans: "\n# 区域与安全规则\n\n最佳实践是在所有安全规则中使用区域，并且采用清晰的命名规范可以防止配置错误并使安全规则更易读。出于任何原因而物理分离但本应在拓扑上连接的网络（例如，分散在两栋建筑中的用户通过防火墙上的两个独立接口接入）可以合并到同一区域，从而简化策略。\n\
    \n需要注意的是，存在影响同区域或跨区域会话的隐含规则。这些规则可以在安全策略底部找到：\n\n* **默认同区域连接**：从同一区域流向并返回的数据包将被隐式允许\n\
    * **默认跨区域连接**：从一个区域流向不同区域的数据包将被隐式阻止\n\n安全规则可以设置为仅接受同一区域内的流量、仅不同区域之间的流量，或两者兼有。此设置可在规则\
    \ `Type` 中更改，默认设置为 `Universal`。如 *图 1.3* 所示，`Universal` 规则允许会话从 `Source` 字段中的所有区域流向\
    \ `Destination` 字段中的所有区域，从 `LAN` 到 `LAN` 和 `DMZ`，以及从 `DMZ` 到 `LAN` 和 `DMZ`。\n\n\
    设置为 `intrazone` 类型的规则仅允许会话在同一区域内流动，无论安全规则中是否添加了多个区域：从 `DMZ` 到 `DMZ` 以及从 `LAN`\
    \ 到 `LAN`，但不允许从 `LAN` 到 `DMZ` 或从 `DMZ` 到 `LAN`。\n\n设置为 `interzone` 类型的规则仅允许会话在不同区域之间流动：从\
    \ `DMZ` 到 `LAN` 以及从 `LAN` 到 `DMZ`，但不允许从 `DMZ` 到 `DMZ` 或从 `LAN` 到 `LAN`，即使两者都在源和目标中列出。\n\
    \n这意味着即使无法在源或目标中定义子网，你也可以完全控制允许流量在哪些接口之间流动，而对于传统防火墙而言，这意味着会话将被允许在任何地方流动。\n\n![](img/B31589_01_03.png)\n\
    \n图 1.3：不同安全规则类型和默认规则\n\n现在我们已经看到了区域在做出安全决策时的重要作用，让我们来看一下确定区域时的预期行为。\n\n# 确定区域时的预期行为\n\
    \n当数据包到达接口时，将会查阅 `PBF` 策略或路由表，以根据数据包报头中的原始 IP 地址确定目标区域。\n\n让我们考虑以下路由表：\n\n```\n\
    > show routing route\nflags: A:active, ?:loose, C:connect, H:host, S:static, ~:internal,\
    \ R:rip, O:ospf, B:bgp,\n      Oi:ospf intra-area, Oo:ospf inter-area, O1:ospf\
    \ ext-type-1, O2:ospf ext-type-2, E:ecmp, M:multicast\nVIRTUAL ROUTER: default\
    \ (id 1)\n  ==========\ndestination       nexthop       metric flags  interface\
    \   \n0.0.0.0/0         198.51.100.1  10A S    ethernet1/1                 \n\
    198.51.100.0/24   198.51.100.2  0      A C    ethernet1/1\n198.51.100.2/32   0.0.0.0\
    \       0      A H                           \n192.168.0.0/24    192.168.0.1 \
    \  0      A C    ethernet1/2             \n192.168.0.1/32    0.0.0.0       0 \
    \     A H        \n172.16.0.0/24     172.16.0.1    0      A\nC    ethernet1/3\
    \                \n172.16.0.1/32     0.0.0.0       0      A\nH               \
    \                                                    \ntotal routes shown: 7\n\
    ```\n\n假设 `ethernet1/1` 是外部接口，IP 地址为 `198.51.100.2`，区域设置为 `external`，`ethernet1/2`\
    \ 是 `DMZ` 接口，IP 地址为 `192.168.0.1`，区域设置为 `DMZ`，而 `ethernet1/3` 是 `LAN` 接口，IP 为\
    \ `172.16.0.1`，区域设置为 `LAN`。默认路由经由接口 `ethernet1/1` 出站，下一跳为 `198.51.100.1`。以下几个场景会影响区域的确定方式：\n\
    \n* **场景 1**：从客户端 PC `172.16.0.5` 收到数据包，目标 IP 为 `1.1.1.1`。\n\n防火墙迅速确定源区域为 `LAN`，路由查找确定目标\
    \ IP 不是已连接网络，因此需要遵循默认路由到互联网。目标区域必须是 `external`，因为出站接口是 `ethernet1/1`。\n\n* **场景\
    \ 2**：从客户端 PC `172.16.0.5` 收到数据包，目标 IP 为 `1.1.1.1`，但存在一条 PBF 规则强制所有发往 `1.1.1.1`\
    \ 的流量到下一跳 IP `192.168.0.25`。\n\n由于 `PBF` 覆盖路由表，目标区域将变为 `DMZ`，因为出站接口现在是 `ethernet1/2`。\n\
    \n* **场景 3**：从互联网 IP `203.0.113.1` 收到数据包，目标 IP 为 `198.51.100.2`。这是 `NAT` 对防火墙而言的典型示例：它接收到以其外部\
    \ IP 地址作为目标的数据包。\n\n从 `NAT` 策略的角度来看，源区域将为 `external`，因为该 IP 不来自已连接网络且不存在静态路由，并且目标区域也将\
    \ *也* 为 `external`，因为该 IP 已连接到该接口。\n\n然而从安全角度来看，一旦应用 `NAT`，目标区域将更改为后 NAT 目标 IP\
    \ 所连接的区域（通常为 `DMZ`）。\n\n### 重要说明\n\n请记住，`NAT` 策略评估发生在初始区域确定之后，但在安全策略评估之前。这将导致出站\
    \ `NAT` 规则来自 `LAN` 并前往 `external`，但入站 `NAT` 规则匹配为来自 `external` 且也前往 `external`，而入站安全规则将使用适当的目标区域。请参阅\
    \ *图 1.2*。\n\n在本节中，我们看到了第一轮安全决策在很大程度上依赖于区域，这也应反映在您今后创建的任何规则库中：尽可能在源和目标中使用区域，以完全控制流量的流动并防止意外行为。在下一节中，我们将了解第二轮会发生什么，这也使得\
    \ `next-generation firewall` (`NGFW`) 成为“下一代”。\n\n# 了解 App-ID 和 Content-ID\n\n\
    `App-ID` 和 `Content-ID` 是两种相辅相成的技术，构成了核心检查机制。`App-ID` 依赖解码器根据协议和第 7 层应用来识别和分类流。这允许对允许或阻止的内容进行更精细的控制，同时确保应用程序按预期行为。`Content-ID`\
    \ 依赖威胁防护引擎对威胁进行深度检查流，对 URL 类别进行分类并防止数据外泄。\n\n## App-ID 如何提供更多控制\n\n确定特定数据流中包含哪个应用程序是任何\
    \ `NGFW` 的基石。不能再假设使用 TCP 端口 80 和 443 的任何会话只是明文或加密的网页浏览。今天的应用程序主要使用这些端口作为其基础传输，许多恶意软件开发人员利用了这种向知名端口的汇聚，试图将恶意软件伪装成合法的网络流量，同时外泄敏感信息或向受感染主机下载更多恶意负载。\n\
    \n以下图像说明了 `App-ID` 在流中识别应用程序所采取的步骤：\n\n![](img/B31589_01_04.png)\n\n图 1.4：App-ID\
    \ 如何对应用进行分类\n\n当收到数据包时，`App-ID` 将经历几个阶段来识别它到底是什么：\n\n1. 首先，`6-Tuple` 会与安全策略进行核对，以验证某个源、目标、协议和端口组合是否被允许。如果所有不必要的端口都已关闭，则可以处理低垂的果实，并且\
    \ *不寻常* 的目标端口可以被拒绝。\n2. 接下来，数据包将与已知应用程序签名和应用缓存进行核对，以查看会话是否可以快速识别。\n"
