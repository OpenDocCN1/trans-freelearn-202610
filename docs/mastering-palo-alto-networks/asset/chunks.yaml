    \ that go hand in hand and make up the core inspection mechanism. `App-ID` relies\
    \ on decoders to identify and classify flows based on the protocol and layer 7\
    \ application. This allows more granular control over what is being allowed or\
    \ blocked while ensuring an application behaves as expected. `Content-ID` relies\
    \ on threat prevention engines to do deep inspection flows for threats, classify\
