    \n# 1\n\n# Understanding the Core Technologies\n\nWelcome to the first chapter!\
    \ In this book, we’re going to explore the ins and outs of the Palo Alto Networks\
    \ Strata suite. We’ll start off by learning about all the different features of\
    \ the firewall and how to configure them before we move on to more complex features\
    \ and additional services that will help you complete your deployment. On the\
    \ way, you’ll pick up important knowledge nuggets that will help you both understand\
    \ the technology and pass the PCNSE exam.\n\nIn this chapter, we’re going to examine\
    \ the core technologies that make up the Palo Alto Networks firewall. We are going\
    \ to take a closer look at the way in which security zones control how security,\
    \ **Network Address Translation **(**NAT**), and routing verdicts are made. We\
    \ will review the mechanics behind App-ID and Content-ID so you get a deeper understanding\
    \ of how packets are processed and security decisions are made by the firewall,\
    \ and we will review how User-ID contributes to a more robust security stance\
    \ by applying group-based or user-based access control.\n\nThis chapter will cover\
    \ the following topics:\n\n*   Understanding the zone-based firewall\n\n*   Understanding\
    \ App-ID and Content-ID\n\n*   The management and data planes\n\n*   Authenticating\
    \ users with User-ID\n\nBy the end of this chapter, you will have a better understanding\
    \ of how the core technology is built up and will be able to apply these skills\
    \ when we start building configuration. If you’re preparing for the PCNSE exam,\
    \ this chapter will also help you understand the fundamentals required to tackle\
    \ some of the scenario-based questions.\n\n# Technical requirements\n\nFor this\
    \ chapter, no physical installation is required; technology is only explained.\
    \ A good understanding of basic networking protocols like UDP and TCP is necessary\
    \ to fully benefit from the following materials. It is helpful if you’ve already\
    \ worked with Palo Alto Networks firewalls, but it is not required. Some experience\
    \ with firewalls or web proxies in general is recommended, as this will make the\
    \ subject matter more tangible.\n\n# Understanding the zone-based firewall\n\n\
    Traditionally, when considering a firewall as an element of your network, most\
    \ likely you will imagine a network design like the one in *Figure 1**.1*, with\
    \ two to four areas surrounding a box. Most of the time, whatever is placed in\
    \ the north is considered dangerous as it represents the internet, the east and\
    \ west are somewhat gray areas as they are the **demilitarized zones** (**DMZs**)\
    \ that are partly exposed to the internet, and the south is the happy place where\
    \ users do their daily tasks. The box in the middle is the firewall. All these\
    \ areas will be defined as zones in the firewall:\n\n![](Images/B31589_01_01.png)\n\
    \nFigure 1.1: Basic network topology\n\nIn reality, a network design may look\
    \ a lot more complex due to network segmentation, remote offices being connected\
    \ to headquarters via all sorts of different technologies, and the adoption of\
    \ cloud vendors.\n\nIn a **route-based firewall**, zones are simply an architectural\
    \ or topological concept that helps identify which areas comprise the global network\
    \ that is used by the company; they are usually represented by tags that can be\
    \ attached to a subnet object. They hold no bearing in any of the security decisions\
    \ made by the system when processing security policies.\n\nThe **zone-based firewall**,\
    \ on the other hand, will use zones as a means to internally classify the source\
    \ and destination in its state table.\n\nThe following diagram illustrates the\
    \ phases of packet processing from the first step when the first packet of a new\
    \ session enters the firewall to the last step where the packet egresses the firewall:\n\
    \n![](Images/B31589_01_02.png)\n\nFigure 1.2: Phases of packet processing\n\n\
    Let’s look at the process workflow for initial packet processing:\n\n1.  When\
    \ a packet is first received, a source zone lookup is performed. If the source\
    \ zone has a protection profile associated with it, the packet is evaluated against\
    \ the profile configuration. If the first packet is a TCP packet, it will also\
    \ be evaluated against the TCP state where the first packet needs to be a SYN\
    \ packet, and a SYN cookie is triggered if the protection profile threshold is\
    \ reached.\n\n2.  Then, a destination zone is determined by checking the **policy-based\
    \ forwarding **(**PBF**) rules and, if no results are found, the routing table\
    \ is consulted.\n\n3.  Lastly, the NAT policy is evaluated as the destination\
    \ IP may be changed by a NAT rule action, thereby changing the destination interface\
    \ and zone in the routing table. This would require a secondary forwarding lookup\
    \ to determine the post-NAT egress interface and zone.\n\nAfter these zone lookups\
    \ have been performed in the **initial packet processing**, the firewall will\
    \ continue to the **security pre-policy** evaluation.\n\nIn the pre-policy evaluation,\
    \ the “six-tuple” (**6-tuple**) is used to match an incoming session against the\
    \ rule base before establishing or dropping/denying a session. At this stage,\
    \ the firewall does not consider the application just yet, as this can usually\
    \ not be determined by the first packet in a session. The six-tuple consists of\
    \ the following elements:\n\n*   Source IP\n\n*   Source zone\n\n*   Destination\
    \ IP\n\n*   Destination zone\n\n*   Destination port\n\n*   Protocol\n\nZones\
    \ are attached to a physical, virtual, or sub-interface. Each interface can only\
    \ be part of one single zone. Zones can be created to suit any naming convention\
    \ and can be very descriptive in their purpose (**untrust, DMZ, LAN**, and so\
    \ on), which ensures that, from an administrative standpoint, each area is easily\
    \ identifiable."
