- raw: 'The certificate verification for RADIUS server profiles requires a certificate
    profile that allows more checks to be performed than just having the root certificate
    in the trusted certificate store compared to TACACS+. Several mechanisms can be
    used to verify server validity and actions can be taken if particular conditions
    are met with the certificate check, such as opting to allow or block a session
    if the certificate is valid but has expired:


    ![](Images/B31589_02_40.png)


    Figure 2.40: Certificate Profile


    ### The Kerberos server profile


    The Kerberos server profile is very simple to configure as it only requires an
    IP or FQDN and a port number, but it does require a few specific configuration
    settings:


    *   The firewall needs to have the domain set in **Device** | **Setup** | **Management**
    | **General Settings**


    *   The firewall is synced to a **Network Time Protocol** (**NTP**) server from
    **Device** | **Setup** | **Services** so that its clock is in sync with the local
    `ActiveDirectory` server


    *   Its DNS servers need to be set to internal DNS servers that are joined to
    the domain, rather than external DNS servers


    This is shown in the following screenshot:


    ![](Images/B31589_02_41.png)


    Figure 2.41: Kerberos requirements


    With single sign-on adoption on the rise and many authentication services making
    a move to the cloud, the popularity of SAML authentication is also increasing.


    ### The SAML server profile


    The SAML profile enables authentication against an external **single sign-on**
    (**SSO**) provider (such as PingID and Okta).


    Your IdP should provide you with the following:


    *   An identifier so that it can certify whether the authentication session originates
    from you


    *   The root and intermediary certificates, which you can load to **Device** |
    **Certificate Management** | **Device Certificates** to verify the identity of
    the SSO and **single log-out** (**SLO**) sites


    *   An SSO URL


    *   An SLO URL


    SAML HTTP binding provides an option to **post**, which sends a Base64-encoded
    HTML form to the IdP, or **redirect**, in which case the firewall will send Base64-encoded
    and URL-encoded SSO messages within the URL parameters.


    You can sign SAML messages to the IdP with a certificate for signing requests,
    which can be configured in the authentication profile:


    ![](Images/B31589_02_42.png)


    Figure 2.42: SAML Identity Provider Server Profile


    ### The MFA profile


    It is highly recommended to add MFA as regular passwords require good hygiene
    from each administrator and could be inadvertently shared, stolen, or guessed.
    If your regular authentication does not support integrating an additional factor
    like SMS, push messages, tokens, etc., you can add an MFA profile and add the
    extra profile to the authentication profile.


    Currently, four MFA providers are available as standalone profiles: Duo, Okta,
    RSA, and PingID. To configure this profile, you will need some parameters from
    the provider.


    Settings such as the API host may depend on your geolocation, and keys and secrets
    will be unique identifiers to your account:


    ![](Images/B31589_02_43.png)


    Figure 2.43: Multi Factor Authentication Server Profile


    Once the appropriate server profiles have been set up, they need to be added to
    an authentication profile.


    ### Setting up the authentication profile


    Now that the appropriate server profile has been configured for your environment,
    you can go ahead and set up an authentication profile, which will set the stage
    for the administrators to sign in. Go to **Device** | **Authentication Profile**
    and create a new authentication profile.


    The **Authentication** tab lets you choose the type of authentication you want
    to use for this profile; this will match the server profile you configured in
    one of the previous steps. You can then add additional parameters, such as setting
    `sAMAccountName` or `userPrincipalName` for the LDAP login attribute. **Username
    Modifier** lets you control how the username that the end user enters is translated
    and sent to the authentication server. This allows you to simply forward what
    the user inputs or add the user domain in UPN format (`user@domain`) or traditional
    `domain\user` backslash format:


    *   `%USERINPUT%`


    *   `%USERDOMAIN%\%USERINPUT%`


    *   `%USERINPUT%@%USERDOMAIN%`


    This may be necessary in a multi-domain forest environment:


    ![](Images/B31589_02_44.png)


    Figure 2.44: Authentication Profile LDAP example


    In the **Factors** tab, you can add a profile for an MFA policy that will trigger
    the secondary authentication once a user logs in:


    ![](Images/B31589_02_45.png)


    Figure 2.45: Authentication Profile MFA


    The **Advanced** tab creates a bit of a chicken-and-egg situation as it requires
    you to tell the firewall which usernames or user groups are allowed to attempt
    authentication, but the list of users is only populated after you have properly
    set up the user ID. If you have not set up a user ID group mapping yet, set the
    user to **all** until you can return and narrow down the list to the actual admin
    user groups or usernames.


    For security purposes, you should configure a lockout policy that prevents logins
    for an amount of time after several failed attempts to log in:


    ![](Images/B31589_02_46.png)


    Figure 2.46: Authentication Profile allowed users


    When the profile is created, you can use it instead of a static password when
    creating administrator accounts. The Authentication Profile can be set in the
    administrator account to replace the static password:


    ![](Images/B31589_02_47.png)


    Figure 2.47: Admin account with an authentication profile


    With the topics we covered in this last section, you are now able to set up admin
    accounts that are not only restricted to the access they need (complying with
    RBAC requirements) but can also leverage external authentication mechanisms and
    add MFA to strengthen administrator access and prevent unauthorized access. In
    the next section, we will learn about the different types of interfaces.


    # Understanding the interface types


    When you open the **Network** | **Interfaces** menu, you will see an assortment
    of physical interfaces. There are several different interface types that will
    cause an interface to behave in a specific way. We will first cover the four basic
    interface types and continue with the more specialist ones after:


    *   Virtual Wire (VWire) is a “Layer 1” passthrough set of two interfaces


    *   Layer 3 is routed interfaces


    *   Layer 2 is “switched” interfaces that rely on VLAN tags rather than routing
    tables


    *   Tap is a “sniffing” interface


    Let’s discuss them in more detail.


    ## VWire


    Just as the name suggests, VWire is intended to be a “bump in the wire.” VWire
    always consists of two physical interfaces—no more and no less. There is no low-level
    interference with VLAN tags and there are no routing options; packets are inspected
    in flow.


    Using a VWire interface can be an easy way to “drop in a firewall” without needing
    to interfere with an existing routing or switching environment. It easily plugs
    in in front of an ISP router or can be placed in between a honeypot and the network
    to add a layer of detection.


    Out of the box, a firewall will have a default VWire set up on `ethernet1/1` as
    the outside interface and `ethernet1/2` as the inside interface with a security
    rule to allow all outbound traffic.


    Before you can create a VWire interface, you first need to set two interfaces
    to the **Virtual Wire** type and assign each of them to a different zone:


    ![](Images/B31589_02_48.png)


    Figure 2.48: VWire interface


    You can now connect both interfaces to a VWire profile by going to **Network**
    | **Virtual Wires** and creating a new VWire profile.'
