    # VWire 和 Layer 3 接口配置


    如以下截图所示，您需要选择将用于形成 VWire 连接的两个接口。如果 VWire 接口放置在 trunk 链路上（包含 `VLAN/802.1Q` 标签的链路），您需要指明允许哪些标签。如果要允许所有标签，请设置为
    `0-4094`。如果要添加单个标签或范围，可以添加整数或范围，以逗号分隔（例如，`5,15,30-70,100-110,4000`）。如果您想要能够阻止或以其他方式对组播流量应用安全策略，则需要勾选
    **组播防火墙**。如果未勾选，组播将在 VWire 上转发，而不检查安全规则。启用 **链路状态透传** 会在其中一侧失去连接时使另一侧接口下线。


    这确保客户端和服务器双方都能看到链路下线并相应响应：


    ![](img/B31589_02_49.png)


    图 2.49：VWire 配置


    ## Layer 3 接口


    Layer 3 接口是路由接口。这意味着它具有 IP 地址，可用作连接到它的内部客户端的默认网关，或用作路由设备的下一跳。在外部，它可以与 ISP 路由器通信并将流量转发到互联网。我们先来看一下该接口。


    ### 探索接口


    在接口的 **配置** 选项卡中，您需要分配一个 **虚拟路由器** (`VR`) 和一个安全区域（我们将在本章后面了解更多关于 `VR` 的内容，所以暂时不用担心）。当流量需要在一个接口和另一个接口之间流动时，此区域将表示连接到它的子网：


    ![](img/B31589_02_50.png)


    图 2.50：Layer 3 接口配置


    IP 配置可以静态配置为 IP/子网。如果需要，可以添加多个 IP/子网以表示直接连接到接口的额外网络：


    ![](img/B31589_02_51.png)


    图 2.51：Layer 3 接口 IP


    如果上游连接由宽带 ISP 通过电缆或 DSL 提供，Layer 3 接口也可以设置为 **以太网上点对点协议** (`PPPoE`) 客户端。在这种情况下，在
    **常规** 选项卡中，可以配置 ISP 身份验证用户名和密码：


    ![](img/B31589_02_52.png)


    图 2.52：Layer 3 PPPoE


    在 `PPPoE` | **高级** 选项卡中，您将身份验证协议设置为 `PAP`、`CHAP`、`auto` 或 `none`。如果 ISP 为您提供了静态
    IP，您可以在此处配置它，并且如果 ISP 需要它们才能连接，您可以添加接入集中器和服务字符串。如果需要，您可以禁用将 ISP 接收到的默认路由添加到路由表。一些
    ISP 要求 PPPoE 客户端处于被动状态，因为它们会发起连接。您可以在此处启用此功能：


    ![](img/B31589_02_53.png)


    图 2.53：Layer 3 PPPoE 高级选项


    配置完接口后，单击 **确定** 并提交更改。提交完成后，您可以从 **网络** | **接口** | **以太网** 页面单击 **显示 PPPoE 客户端运行时信息**
    以获取有关连接的信息。从 CLI，您可以发出以下命令查看相同的输出：


    ```

    admin@PA-440> show pppoe interface <interface>

    ```


    **DHCP 客户端** 选项卡允许您将接口配置为 DHCP 客户端，从上游 DHCP 服务器接收其 IP 信息：


    ![](img/B31589_02_54.png)


    图 2.54：Layer 3 DHCP 客户端高级选项


    您可以选择自动接受默认路由或禁用此功能并在 `VR` 中手动定义默认路由。如果 ISP 需要，您可以发送系统或自定义主机名，并且您可以确定默认路由的度量值。


    在 **Layer3** | **高级** 选项卡中，我们可以访问多个高级功能：


    ![](img/B31589_02_55.png)


    图 2.55：Layer 3 高级选项


    在这里我们可以设置接口的链路速度、双工模式和状态。在 **其他信息** 选项卡中，我们可以添加之前看到的管理配置文件，更改 **最大传输单元** (`MTUs`)，并启用
    **调整 TCP MSS** 并使用自定义值来更改流经防火墙的 TCP 数据包中的 MSS 头值。


    在其他可用选项卡中，我们还可以设置静态 IPV4 ARP 条目，如果上游设备需要 **静态 ARP 条目** 则会很有用，IPV6 **邻居发现** (`ND`)
    **条目** 或 **邻居发现协议** (`NDP`) **代理**。还可以添加 **链路层发现协议** (`LLDP`) 配置文件以与交换机接口。


    最后，如果外部接口由 ISP 分配了动态 IP，可以设置 DDNS 主机名。目前支持四个厂商：DuckDNS、afraid.org、no-IP 和 Palo
    Alto：


    ![](img/B31589_02_56.png)


    图 2.56：DDNS 配置


    为了使 Layer 3 子网和 IP 地址能够在接口之间访问，它们需要添加到路由表中；这是在 `VR` 中完成的。


    ### VR


    `VR` 是防火墙的路由元素，但正如名称所示，它不是由单个引擎组成，而是接口订阅的路由集合。每个 Layer 3、环回和 VLAN 接口都需要与一个 `VR`
    相关联，但系统上可以使用多个 `VR`。并非所有接口都需要与同一个 `VR` 相关联。


    您可以从 **网络** | **虚拟路由器** 菜单配置默认 `VR` 或添加新的 `VR`。在 `VR` 的 **路由器设置** 选项卡中，您可以查看并添加与此
    `VR` 相关联的接口，并在需要时调整管理距离。管理距离为路由协议关联一个优先级。默认情况下，静态路由的优先级高于 **开放最短路径优先** (`OSPF`)（管理距离更低），但如果您希望
    `OSPF` 路由具有优先级并且仅在 `OSPF` 不可用时使用静态路由，则可以更改此优先级。同一路由协议内的路由可以分配一个度量值以赋予其更高的（度量值更低）或更低的（度量值更高）优先级。同一类型内的路由（静态、OSPF
    等）首先根据其子网的大小进行优先级排序。较小的子网（例如 `/32`）将优先于较大的子网（例如 `/16`）。接下来，将使用度量值来确定具有相同子网掩码的网络的优先级，度量值较低者具有优先级（例如，`10.0.0.0/24
    metric 10` 将优先于 `10.0.0.0/24 metric 20`）：


    ![](img/B31589_02_57.png)


    图 2.57：VR 设置


    在 **静态路由** 选项卡中，您可以根据需要添加目标路由。默认情况下，防火墙会在路由表中加载所有已连接（配置在 Layer 3、环回或 VLAN 接口上）的网络；添加静态路由可从路由角度使远程网络可用。


    您可能需要配置的第一个路由之一是“默认路由”，它允许客户端连接到互联网。如果 Layer 3 接口配置为 `PPPoE` 或 DHCP 客户端，可以启用 **自动创建默认路由**
    选项，该选项将根据上游 ISP 自动添加默认路由。


    默认路由的 **目标** 为 `0.0.0.0/0`。常规路由可能具有较小的子网，例如 `172.16.0.0/24`。


    **接口** 选项指示出口接口将是什么。如果路由指向互联网，则接口将是 ISP 路由器连接的接口。


    **下一跳** 有几个选项：


    *   **IP 地址**：转发数据包到的上游路由器的 IP。


    *   **下一个 VR**：数据包是否需要在同一设备上移交给不同的 `VR`。


    *   `FQDN`：如果上游路由器具有动态 IP，使用由 DNS 记录动态更新的 `FQDN` 可能很有用。

    '
