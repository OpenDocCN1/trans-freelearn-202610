  trans: "\n## 平面概述\n**管理平面** 是所有管理任务发生的地方。它提供系统使用的 Web 界面，用于允许配置、提供 URL 过滤阻止页面以及提供客户端\
    \ VPN 门户。它对 URL 过滤和 DNS 安全执行云查询，并将内容更新下载并安装到数据平面。它还执行路由的逻辑部分并与动态路由对等体和邻居通信。身份验证、`User-ID`、日志记录以及许多其他支持功能与处理数据包没有直接关系。\n\
    \n**控制平面** 承担促进多个数据平面与管理平面之间通信以及监控数据平面上进程的任务。\n\n**数据平面** 负责处理流并执行与 NGFW 相关的所有安全功能。它扫描会话以查找模式和启发式信息。它维护\
    \ IPsec VPN 连接并具有硬件卸载以提供线速吞吐量。由于其架构以及使用互连的专用芯片，所有类型的扫描都可以并行进行，因为每个芯片同时处理数据包并报告其发现。\n\
    \n交换结构使平面之间能够通信，以便数据平面可以将查询请求发送到管理平面，而管理平面可以发送配置更新和内容更新。\n\n下图说明了这些组件如何相互交互：\n\
    \n![](img/B31589_01_06.png)\n\n图 1.6：管理平面和数据平面\n\n现在我们已经介绍了最基本的功能，并且你对硬件的组织方式有了坚实的把握，让我们来看一下基于身份的授权。根据身份或组成员身份识别用户并应用不同的安全策略的能力是\
    \ NGFW 的一个重要功能，因为它允许更动态的安全规则，而不依赖于静态访问列表，而是允许用户在校园内外漫游，同时仍然拥有所需的所有访问权限，而不会暴露内部资源。\n\
    \n# 使用 `User-ID` 对用户进行身份验证和授权\n\n经常被忽视但在正确设置时非常强大的标准功能（无需额外许可）称为 `User-ID`。通过多种机制，防火墙可以了解谁在发起哪些会话，而不管其设备、操作系统或源\
    \ IP 如何。此外，可以设置安全策略，以便根据用户的个人 ID 或组成员身份授予用户访问权限或限制其功能。\n\n`User-ID` 通过对谁访问某些资源进行精细控制来扩展功能，并提供可自定义的报告功能，用于取证或管理报告。\n\
    \n用户可以通过多种不同方法进行识别：\n* **服务器监控**：\n  * Microsoft Active Directory 安全日志读取，用于登录和身份验证事件\n\
    \  * Microsoft Exchange Server 登录事件\n  * Novell eDirectory 登录事件\n* 拦截由下游代理服务器转发的\
    \ `X-Forwarded-For` (`XFF`) 头部\n* **客户端探测** 使用 `NetBIOS` 和 `WMI` 探测\n* **直接用户身份验证**：\n\
    \  * `Captive Portal` 用于拦截 Web 请求并提供用户身份验证表单或使用 Kerberos 透明身份验证\n  * `GlobalProtect`\
    \ VPN 客户端集成\n* 在 Citrix 或 Microsoft 终端服务器等多用户平台上的 **端口映射**，其中多个用户将源自同一源 IP\n*\
    \ 可扩展标记语言 (`XML`) API\n* `syslog` 监听器，用于接收来自外部身份验证系统的转发日志\n\n你会注意到有许多利用 `User-ID`\
    \ 的方法，因此我们将在 *第 6 章*、*识别用户和控制访问* 中深入重新讨论此主题。\n\n# 摘要\n\n现在你完成了本章，你能够识别使用基于区域的防火墙与基于路由的防火墙的优势。你了解即使应用程序都使用相同的协议和端口，也如何识别它们，并且你了解深度数据包检测如何在单次并行处理中实现。最重要的是，你对数据包形成会话所经历的阶段有坚实的把握。如果这些信息看起来有点令人不知所措也没关系；我们将在接下来的两章中看到更多实际应用和影响。我们将更仔细地查看一旦你开始使用区域，安全和\
    \ `NAT` 规则的行为如何，以及如何通过简单地查看规则来预测预期行为。\n\n如果你正在准备 `PCNSE` 考试，本章涵盖了 *规划和核心概念* 和\
    \ *部署和配置* 域的部分内容。请注意 *图 1.2* 关于数据包处理，记住路由查找和 `PBF` 构成了区域化的基础，并注意 `App-ID` 和 `Content-ID`\
    \ 如何协同工作。\n\n在下一章中，我们将学习如何从头开始设置防火墙并迅速投入运行。我们将浏览物理和虚拟组件以及如何配置它们以使流量能够通过，并在需要的地方应用\
    \ `NAT`。\n\n# 第 2 章：设置新设备\n\n在本章中，我们将介绍如何访问即开即用的防火墙设备或干净部署的 **虚拟机** (`VM`) 的控制台和\
    \ Web 界面。你将学习如何许可、更新和升级防火墙，以便在开始构建安全策略时可以使用最新功能，并且始终将最新签名加载到设备上，以保护你的用户和基础设施免受恶意软件和漏洞利用的侵害。\n\
    \n我们将强化你的管理配置以确保严格的安全态势，并且我们还将查看不同类型的网络接口模式——聚合接口和路由。\n\n在本章中，我们将涵盖以下主要主题：\n*\
    \ 访问用户界面\n* 添加许可证并设置动态更新\n* 升级防火墙\n* 强化管理界面\n* 了解接口类型\n\n到本章结束时，你将能够快速设置新的防火墙、注册它，并在短时间内将其升级到理想的水平。你将能够应用最佳实践并利用强大的身份验证进行管理访问，并且你将能够快速识别适合防火墙需要放置在其中的任何给定网络拓扑的接口配置。\n\
    \n## 技术要求\n\n对于本章，需要对网络设备有基本了解，因为我们将查看物理连接到设备、配置管理环境以及选择数据平面接口的部署模式。还需要具备在虚拟环境中部署虚拟设备的基本知识，包括将其连接到虚拟交换机或虚拟接口并在\
    \ hypervisor 上为其提供网络访问。\n\n## 访问用户界面\n\n如果你将防火墙部署在 `Azure` 或 `AWS` 等云提供商上，请查看\
    \ *第 14 章*、*基于云的防火墙部署*。\n\n当从盒子中取出新设备或在本地 hypervisor 上设置 `VM`，例如 `VMware ESXi`、`Fusion`、`NSX`、`Hyper-V`、`KVM`\
    \ 等时，需要完成的第一件事之一是使能够访问用户界面，无论是 Web 界面还是控制台连接。我们将在本节中介绍获得此访问权限的最常见方法。\n\n你 *可能*\
    \ 需要做的第一件事之一是连接控制台电缆以获得对 **命令行界面** (`CLI`) 的访问。较旧的型号仅带有一个 `RJ45` 控制端口，对于这些型号，你需要一个标准的\
    \ `DB9-to-RJ45` 控制台电缆，可选择通过串行到 USB 电缆进行补丁，以便现代笔记本电脑能够与端口接口。DB9 的针脚排列应如下所示：\n"
