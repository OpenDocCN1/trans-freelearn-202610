  trans: "\n## 反间谍软件配置文件\n官方最佳实践配置文件可能看起来与此处列出的一样略有不同。这是因为 Palo Alto 会将每个严重级别拆分开（但设置完全相同）。因此，前面的示例效率稍高一些！\n\
    您的配置文件现在应如下所示：\n![](img/B31589_03_04.png)\n图 3.4：反间谍软件配置文件\n严重级别为 critical、high\
    \ 和 medium 的威胁总体上具有较高的真正恶意比例，因此重置连接被认为是最佳实践。对这些威胁进行数据包捕获可以帮助我们判断被阻止的内容是否为误报。低严重级别和信息严重级别的威胁很可能纯属信息性，可以保留为默认操作。\n\
    如以下屏幕截图所示，我们需要确保审查 `Category`，因为这允许对每种类型的威胁进行精细化处理，如果以后需要更细粒度和个性化的操作。\n![](img/B31589_03_05.png)\n\
    图 3.5：反间谍软件类别\n反间谍软件配置文件还包含 DNS 签名，这些签名分为订阅服务的两个数据库。内容 DNS 签名随威胁防护动态更新一起下载。DNS\
    \ 安全数据库使用动态云查询。\n每个数据库中的元素可以设置为 `Alert`、`Allow`、`Block` 或 `Sinkhole`。`Sinkhole`\
    \ 使用 DNS 投毒技术替换 DNS 回复数据包中的 IP，因此客户端确实会收到有效的 DNS 回复，但目标 IP 已被更改。这确保了感染的终端可以通过过滤流向\
    \ sinkhole IP 的会话的流量日志轻松找到。您可以继续使用 Palo Alto Networks 默认的 sinkhole，`sinkhole.paloaltonetworks.com`，或使用您首选的\
    \ IP。\nDNS sinkhole 的工作原理由以下步骤和图表说明：\n1. 客户端向内部 DNS 服务器发送 DNS 查询以解析恶意域名。\n2. 内部\
    \ DNS 将 DNS 查找中继到互联网 DNS 服务器。\n3. 防火墙向内部 DNS 服务器插入对 DNS 查询的投毒回复，其中包含指向 sinkhole\
    \ IP 的记录。\n4. DNS 回复被转发给客户端。\n5. 客户端向 sinkhole IP 而不是恶意服务器发起出站连接。管理员立即知道哪个主机可能已感染并正在尝试建立\
    \ `command and control` (`C2`) 连接：\n![](img/B31589_03_06.png)\n图 3.6：DNS sinkhole\
    \ 的工作原理\n如果对这些 DNS 查询进行阻止而不是 sinkhole，则会牵连内部 DNS 服务器，因为请求是通过它中继的。\n`Command and\
    \ Control` 和 `Malware` 域的默认操作是阻止 DNS 回复，因为 sinkhole 可能会触发更具规避性的行为。因此，建议将这些类别保留为默认设置。为所有其他类别选择适当的动作。出于研究目的，您可以启用数据包捕获。\n\
    在 PAN-OS 11.2 及更高版本中，在 `DNS Zone Misconfiguration` 字段中，您可以添加网络内面向公众的 `parent`\
    \ 域。高级 DNS 安全可以监控这些域是否存在误配置，例如可能被恶意行为者滥用的废弃子域。\n在此选项卡底部，我们可以选择 `SVCB` (type 64)、`HTTPS`\
    \ (type 65) 和 `ANY` (type 255)，这些是 DNS 资源记录类型，用于在 DNS 解析过程中加密客户端 hello。阻止这些将防止加密\
    \ DNS 会话建立，确保您仍可继续应用 DNS 安全：\n![](img/B31589_03_07.png)\n图 3.7：反间谍软件 DNS 签名\n\
    任何误报或被视为可信但实际上具有恶意的站点都可以添加到 `DNS Exceptions`，以便它们不再被阻止或 sinkhole。\n在 `Inline Cloud\
    \ Analysis` 选项卡上，我们可以启用内联云分析，并为本地深度学习分析引擎可检测到 C2 流量的每个协议定义要采取的操作。如果某些域名或 IP 地址应排除在此检查之外，您可以在以下屏幕截图中显示的字段中添加一个\
    \ `external dynamic list` (`EDL`; 我们稍后会学习这些) 或 IP：\n![](img/B31589_03_08.png)\n\
    图 3.8：内联云分析\n现在让我们查看漏洞防护配置文件。\n## 漏洞防护配置文件\n漏洞防护配置文件也使用规则来控制某些基于网络的攻击的处理方式。`Action`\
    \ 包含与反间谍软件相同的选项：`allow`、`drop`、`alert`、`reset-client`、`reset-server`、`reset-both`\
    \ 和 `block-ip`。\n重置操作会发送 TCP RST 数据包。`block-ip` 会阻止来自源的所有数据包，可以设置为 `monitor source`\
    \ 以阻止所有内容，或设置为源目标以仅在一段时间内阻止发往特定目标的数据包。\n`Host Type` 确定规则是否适用于针对客户端 (download:\
    \ 例如浏览器漏洞)、服务器 (upload: 例如 SQL 注入) 或任意主机的威胁。\n请务必查看可用的 `Categories`，因为它们与我们在反间谍软件中图\
    \ 3.4 中看到的一样，如果需要可以提供更精细的粒度：\n![](img/B31589_03_09.png)\n图 3.9：漏洞防护配置文件类别\n创建以下规则：\n\
    * `Rule Name:` `Block-Critical-High-Medium`\n  * `Host Type:` `any`\n  * `Severity:`\
    \ `critical, high, medium`\n  * `Action:` `reset-both`\n  * `Packet Capture:`\
    \ `single-packet`\n* `Rule Name:` `Default-low-info`\n  * `Host Type:` `any`\n\
    \  * `Severity:` `low`, `informational`\n  * `Action:` `default`\n  * `Packet\
    \ Capture:` `disable`\n您的配置文件现在应如下所示：\n![](img/B31589_03_10.png)\n图 3.10：漏洞防护配置文件\n\
    配置文件将重置匹配 critical、high 或 medium 严重级别威胁的任何连接，并收集威胁的数据包样本用于研究或取证。低严重级别和信息严重级别的威胁可以保留为默认设置。\n\
    虽然这些规则将为匹配特定严重级别的所有签名提供良好的覆盖，但您可能需要在某个时候为特定 CVE 添加规则。如果您创建新规则，可以将其定制为特定 CVE 甚至特定厂商。\n\
    CVE 代码由 MITRE 在 `https://cve.mitre.org` 维护\n厂商 ID 通常由厂商发布，其格式与例如 Palo Alto 的 `PAN-SA-yyyy-nnnn`\
    \ 或 Microsoft 的 `MSyy-nnn` 相似。如果您想例如过滤特定年份，可以将 `PAN-SA-2024` 添加到厂商 ID。请记住将匹配 CVE\
    \ 或厂商 ID 的更具体规则放在规则顶部。\n在 `Inline Cloud Analysis` 选项卡上，您可以启用用于 SQL 注入攻击或命令注入攻击的内联机器学习驱动检测。您可以在\
    \ `Exclude from Inline Cloud Analysis` 部分添加基于 URL 或基于 IP 的 `EDL`，以便不对其进行检查，这对于可能遇到许多误报的开发环境非常有用：\n\
    ![](img/B31589_03_11_new.png)\n图 3.11：漏洞防护内联云分析\n在下一小节中，我们将学习 URL 过滤配置文件的类别。\n\
    ## URL 过滤配置文件\nURL 过滤利用 URL 类别来确定对每个类别采取什么操作。\n类别分为两组：自定义 URL 类别和由 URL 过滤许可证提供的动态类别。\n\
    ### 自定义 URL 类别\n自定义 URL 类别不需要许可证，因此即使没有访问 URL 过滤许可证，您也可以创建这些对象并应用 URL 过滤。\n转到\
    \ `Objects` | `Custom Objects` | `URL Category` 创建新的自定义类别并添加网站。有两种类型的自定义类别：\n"
