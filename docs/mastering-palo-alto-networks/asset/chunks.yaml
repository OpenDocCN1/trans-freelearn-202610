- raw: "It is best practice to use zones in all security rules, and leveraging a clear\
    \ naming convention prevents misconfiguration and makes security rules very readable.\
    \ Networks that are physically separated for whatever reason but are supposed\
    \ to be connected topologically (for example, users spread over two buildings\
    \ that come into the firewall on two separate interfaces) can be combined into\
    \ the same zone, which simplifies policies.\n\nIt is important to note that there\
    \ are implied rules that influence intrazone or interzone sessions. These rules\
    \ can be found at the bottom of the security policy:\n\n*   **Default intrazone\
    \ connections**: Packets flowing from and to the same zone will be implicitly\
    \ allowed\n\n*   **Default interzone connections**: Packets flowing from one zone\
    \ to a different zone are implicitly blocked\n\nSecurity rules can be set to only\
    \ accept traffic within the same zone, between different zones only, or both.\
    \ This setting can be changed in the rule **Type** and is set to **Universal**\
    \ by default. As illustrated in *Figure 1**.3*, the **Universal** rule allows\
    \ sessions to flow from all zones in the **Source** field to all zones in the\
    \ **Destination** field, from **LAN** to **LAN** and **DMZ**, and from **DMZ**\
    \ to **LAN** and **DMZ**.\n\nRules set to the **intrazone** type only allow sessions\
    \ to flow inside the same zone regardless of whether multiple zones are added\
    \ to the security rule: from **DMZ** to **DMZ** and from **LAN** to **LAN**, but\
    \ not from **LAN** to **DMZ** or from **DMZ** to **LAN**.\n\nRules set to the\
    \ **interzone** type only allow sessions to flow between different zones: from\
    \ **DMZ** to **LAN** and from **LAN** to **DMZ**, but not from **DMZ** to **DMZ**\
    \ or from **LAN** to **LAN**, even though both are listed in the source and destination.\n\
    \nThis means that you can perfectly control between which interfaces traffic is\
    \ allowed to flow to even if you are unable to define subnets in the source or\
    \ destination, which, for traditional firewalls, means sessions will be allowed\
    \ to flow everywhere.\n\n![](Images/B31589_01_03.png)\n\nFigure 1.3: Different\
    \ security rule types and default rules\n\nNow that we’ve seen the important role\
    \ zones play while making security decisions, let’s look at the expected behavior\
    \ when determining zones.\n\n# Expected behavior when determining zones\n\nWhen\
    \ a packet arrives on an interface, the PBF policy or routing table will be consulted\
    \ to determine the destination zone based on the original IP address in the packet\
    \ header.\n\nLet’s consider the following routing table:\n\n```\n> show routing\
    \ route\nflags: A:active, ?:loose, C:connect, H:host, S:static, ~:internal, R:rip,\
    \ O:ospf, B:bgp,\n      Oi:ospf intra-area, Oo:ospf inter-area, O1:ospf ext-type-1,\
    \ O2:ospf ext-type-2, E:ecmp, M:multicast\nVIRTUAL ROUTER: default (id 1)\n  ==========\n\
    destination       nexthop       metric flags  interface   \n0.0.0.0/0        \
    \ 198.51.100.1  10A S    ethernet1/1                 \n198.51.100.0/24   198.51.100.2\
    \  0      A C    ethernet1/1\n198.51.100.2/32   0.0.0.0       0      A H     \
    \                      \n192.168.0.0/24    192.168.0.1   0      A C    ethernet1/2\
    \             \n192.168.0.1/32    0.0.0.0       0      A H        \n172.16.0.0/24\
    \     172.16.0.1    0      A\nC    ethernet1/3                \n172.16.0.1/32\
    \     0.0.0.0       0      A\nH                                              \
    \                     \ntotal routes shown: 7\n```\n\nLet’s assume `ethernet1/1`\
    \ is the external interface with IP address `198.51.100.2` set to zone **external**,\
    \ `ethernet1/2` is the DMZ interface with IP address `192.168.0.1` set to zone\
    \ **DMZ**, and `ethernet1/3` is the LAN interface with IP `172.16.0.1` and set\
    \ to zone **LAN**. The default route is going out of interface `ethernet1/1` to\
    \ `198.51.100.1` as a next-hop. There are a few scenarios that will influence\
    \ how the zone is determined:\n\n*   **Scenario 1**: A packet is received from\
    \ client PC `172.16.0.5` with destination IP `1.1.1.1`.\n\nThe firewall quickly\
    \ determines the source zone is **LAN** and a route lookup determines the destination\
    \ IP is not a connected network, so the default route needs to be followed to\
    \ the internet. The destination zone must be **external** because the egress interface\
    \ is `ethernet1/1`.\n\n*   **Scenario 2**: A packet is received from client PC\
    \ `172.16.0.5` with destination IP `1.1.1.1` but a PBF rule exists that forces\
    \ all traffic for `1.1.1.1` to the next-hop IP `192.168.0.25`.\n\nAs PBF overrides\
    \ the routing table, the destination zone will become **DMZ** as the egress interface\
    \ is now `ethernet1/2`.\n\n*   **Scenario 3**: A packet is received from internet\
    \ IP `203.0.113.1` with destination IP `198.51.100.2`. This is a typical example\
    \ of what **NAT** looks like to the firewall: it receives a packet with its external\
    \ IP address as the destination.\n\nFrom the perspective of the NAT policy, the\
    \ source zone will be **external** as the IP is not from a connected network and\
    \ no static route exists, and the destination zone will *also *be **external**\
    \ as the IP is connected to that interface.\n\nFrom a security aspect, however,\
    \ once NAT is applied, the destination zone will change to the zone that the post-NAT\
    \ destination IP is connected to (usually **DMZ**).\n\n**Important note**\n\n\
    Remember that NAT policy evaluation happens after the initial zones have been\
    \ determined but before the security policy is evaluated. This will cause outbound\
    \ NAT rules to come from **LAN** and go to **external**, but inbound NAT rules\
    \ to match as coming from **external** and also going to **external** while the\
    \ inbound security rule will use the appropriate destination zone. See *Figure\
    \ 1**.2*.\n\nIn this section, we saw how the first round of security decisions\
    \ relies heavily on zones, which should also reflect any rule base you create\
    \ going forward: use zones in the source and destination as much as possible to\
    \ fully control the flow of traffic and prevent unexpected behavior. In the next\
    \ section, we’ll look at what happens in the second round, which also makes a\
    \ **next-generation firewall** (**NGFW**) “next generation.”\n\n# Understanding\
    \ App-ID and Content-ID\n\nApp-ID and Content-ID are two technologies that go\
    \ hand in hand and make up the core inspection mechanism. App-ID relies on decoders\
    \ to identify and classify flows based on the protocol and layer 7 application.\
    \ This allows more granular control over what is being allowed or blocked while\
    \ ensuring an application behaves as expected. Content-ID relies on threat prevention\
    \ engines to do deep inspection flows for threats, classify URL categories, and\
    \ prevent data exfiltration.\n\n## How App-ID gives more control\n\nDetermining\
    \ which application is contained within a specific data flow is the cornerstone\
    \ of any NGFW. It can no longer be assumed that any sessions using TCP ports 80\
    \ and 443 are simply plaintext or encrypted web browsing. Today’s applications\
    \ predominantly use these ports as their base transport, and many malware developers\
    \ have leveraged this convergence to well-known ports in an attempt to masquerade\
    \ their malware as legitimate web traffic while exfiltrating sensitive information\
    \ or downloading more malicious payloads into an infected host.\n\nThe following\
    \ image illustrates the steps taken by App-ID to identify applications within\
    \ flows:\n\n![](Images/B31589_01_04.png)\n\nFigure 1.4: How App-ID classifies\
    \ applications\n\nWhen a packet is received, App-ID will go through several stages\
    \ to identify just what something is:\n\n1.  First, the **6-Tuple** is checked\
    \ against the security policy to verify whether a certain source, destination,\
    \ protocol, and port combination is allowed. This will take care of low-hanging\
    \ fruit if all the unnecessary ports have been closed off and *unusual* destination\
    \ ports can already be rejected.\n\n2.  Next, the packets will be checked against\
    \ known application signatures and the app cache to see if the session can be\
    \ rapidly identified."
