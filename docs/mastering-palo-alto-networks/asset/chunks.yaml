    \n* Source IP\n* Source zone\n* Destination IP\n* Destination zone\n* Destination\
    \ port\n* Protocol\n\nZones are attached to a physical, virtual, or sub-interface.\
    \ Each interface can only be part of one single zone. Zones can be created to\
