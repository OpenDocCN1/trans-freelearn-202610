- raw: 'The number next to **Interface Name** is an identification number for the
    logical interface.


    **Important note**


    For a strong security posture, set a separate zone for individual VPN connections,
    even for known locations. Treating each connection and remote network as an individual
    zone ensures adequate visibility and control. A remote office could be exposed
    to malware (think WannaCry) and infect other offices if the VPN tunnel is set
    to the same zone for all remote offices. The default `intrazone` security rule
    allows all sessions to run and does not apply scanning.


    There are also several “special” interface types that provide a specific functionality;
    we’ll cover the special use case interfaces in the following sections.


    When a switch uplink needs to contain multiple 802.1q VLAN tags, it can be configured
    as a trunk, and, on the firewall, subinterfaces can be created to correspond to
    each VLAN tag.


    ## Subinterfaces


    All physical (that is, Layer 2, Layer 3, VWire, and Aggregate—we’ll cover this
    type of interface a little further in this chapter) interfaces can have subinterfaces.
    A subinterface is used when the physical interface is connected to a trunked link
    containing VLAN (802.1Q) tagged packets. The physical interface is not able to
    interpret the tags, but subinterfaces are. For each VLAN carried by the trunk,
    you can create a subinterface to represent the virtual network coming from the
    switch. The advantage of using subinterfaces is that each VLAN can be associated
    with its own security zone.


    The subinterface will mimic all the configuration specifics of its parent physical
    interface, but interface types cannot be different from the physical interface
    type (for example, a Layer 3 physical interface cannot host a Layer 2 subinterface).


    You can create these by selecting the desired physical interface and clicking
    on **Add Subinterface** at the bottom left of **Network | Interfaces**:


    ![](Images/B31589_02_68.png)


    Figure 2.68: Creating a subinterface


    ## HA interfaces


    **High Availability** (**HA**) interfaces are required when setting up a cluster
    of two firewalls. Some chassis will have built-in dedicated HA interfaces, in
    which case you may not need to create any HA interfaces yourself. If no onboard
    HA interfaces are available, or additional interfaces are required to serve as
    backup HA links, data plane interfaces can be selected to fulfill this role and
    are connected to the HA peer.


    ## AE interfaces


    To increase available bandwidth above the physical limitations of the interfaces,
    interfaces can be bundled into an **Aggregated Ethernet** (**AE**) group using
    the 802.1AX protocol. Up to eight interfaces can be combined into a logical bundle.


    A new group can be created by clicking on **Add Aggregate Group** under **Network**
    | **Interfaces** | **Ethernet**.


    You first need to set the type to Layer 2, Layer 3, VWire, or HA, which will require
    the same configuration as the physical interface equivalent (that is, security
    zone, VR, VLAN, or VWire).


    Additionally, you can configure the **Link Aggregation Control Protocol** (**LACP**)
    to improve interface failure detection. LACP enables link failure detection on
    the physical and data link layer, while the default protocol only detects physical
    link failure.


    You can set whether the firewall is in **Active** or **Passive** mode. This configuration
    setting needs to be reviewed with the LACP peer (typically the switch) as only
    one peer can be configured as **Active**, but LACP will not work if both are set
    to **Passive**.


    The value of **Transmission Rate** will have an impact on the responsiveness of
    link failure detection, but it will also have an overhead. Slow transmission means
    every 30 seconds, while fast transmission means every second.


    **Fast Failover** will fail to an operational interface within 1 second when an
    interface goes down. Traditional failover happens after 3 seconds.


    **System Priority** determines which peer determines port priorities.


    **Maximum Interfaces** determines how many interfaces can be active at the same
    time within the aggregate group. This number should not exceed the number of physical
    interfaces you assign to the group, but can be leveraged to limit total available
    bandwidth while keeping hot interfaces in reserve in case of failure. For example,
    if a total bandwidth of 4 gigabits is needed for an aggregate group but you also
    do not want to exceed this bandwidth to preserve system resources, you can assign
    five or more interfaces to the aggregate group, and set **Maximum Interfaces**
    to `4`. Only when an interface fails will another one be activated to pick up
    the work. In an HA configuration where two firewalls form a cluster, LACP can
    be enabled on the passive peer so the link aggregation group is pre-negotiated
    before the passive peer needs to assume an active role, which cuts down on the
    time needed to failover.


    This is achieved by checking **Enable in HA Passive State**. The same system MAC
    can be used on both cluster members, but this may not be supported by the connected
    switches. This is shown in the following screenshot:


    ![](Images/B31589_02_69.png)


    Figure 2.69: LACP


    When the aggregate group is created, you can add the interfaces by setting **Interface
    Type** to **Aggregate Ethernet** and selecting the desired **Aggregate Group**:


    ![](Images/B31589_02_70.png)


    Figure 2.70: A physical interface in an aggregate group


    In some cases, you may need to be able to connect to a port mirror on a switch
    and just listen without participating. For such instances, you can configure a
    Tap interface.


    With the information covered in the last sections, you are now able to select
    the appropriate interface for each network design you may come across. VWire helps
    you add a firewall in an environment where you can’t interfere with existing routing,
    Layer 3 interfaces put the firewall in the middle of routing decisions, Layer
    2 interfaces make the firewall act in a similar way a switch would, and subinterfaces
    can be added to all of these to account for VLAN tags. You are able to configure
    link aggregation and can leverage tunnel interfaces to set up IPSec tunnels.


    # Summary


    In this chapter, you learned how to create a support account, register a new device,
    and add licenses. You are now able to identify all the different support licenses
    and select the appropriate subscription licenses to address your needs. You can
    upgrade and update a device so that its firmware is up to date and the latest
    application and threat signatures are loaded to protect the network. You learned
    how to protect the management interface so that only legitimate users can connect,
    and you can assign different accesses and privileges to administrators. You are
    able to configure all the physical interfaces, like Layer 3 and VWire, and know
    when each is most appropriate. You can also leverage logical interfaces like tunnel
    interfaces and loopback interfaces when they are needed.


    If you’re preparing for the PCNSE, you should take note that upgrading requires
    the base image to be downloaded before you can move forward to a maintenance release.
    The recommended threshold for dynamic updates is 6 to 12 hours (unless the device
    is located in a critical environment, where the threshold should be 24 hours)
    and you should be able to identify the difference between all the interface types.


    In the next chapter, we will start building robust security policies and learn
    how to set a strong security posture for network traffic.


    # 3


    # Building Strong Policies


    In this chapter, you will get comfortable with configuring security profiles,
    building rule bases for security, and **network address translation** (**NAT**).
    We will learn what each setting does, what its expected behavior is, and how it
    can be leveraged to lead to the desired outcome. Taking full control over all
    of the features available in the different rule bases will enable you to adopt
    a strong security stance.'
