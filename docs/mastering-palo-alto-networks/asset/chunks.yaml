    * `Wildfire Action` relies on the WildFire license and the WildFire updates that\
    \ are set to periodical updates (1-minute or longer intervals)\n* `Wildfire Action`\
    \ 依赖于 WildFire 许可证以及设置为定期更新（1 分钟或更长间隔）的 WildFire 更新\n* `Wildfire Inline Ml Action`\
    \ relies on WildFire set to real time\n* `Wildfire Inline Ml Action` 依赖于设置为实时\
    \ 的 WildFire\n\nIf any of these licenses are missing from your system, the actions\
    \ listed in their columns will not be applied.\n\n如果系统缺少其中任何一个许可证，则其列中列出的操作将不会应用。\n\
    \n`Application Exception` allows you to change the action associated with a decoder\
    \ for individual applications as needed. The actions that can be set for both\
    \ threat prevention and WildFire antivirus actions are as follows:\n\n`Application\
    \ Exception` 允许您根据需要更改与单个应用程序的解码器关联的操作。可以为威胁防护和 WildFire 防病毒操作设置的操作如下：\n\n* `allow`:\
    \ Allows matching signatures *without* logging.\n* `allow`：允许匹配的签名 *无需* 记录。\n\
    * `drop`: Drops matching signatures and writes an entry in the threat log.\n*\
    \ `drop`：丢弃匹配的签名并在威胁日志中写入条目。\n* `alert`: Allows matching signatures to pass but\
    \ writes an entry in the threat log.\n* `alert`：允许匹配的签名通过但在威胁日志中写入条目。\n* `reset-client`:\
    \ Drops matching packets, sends a TCP RST to the client (session initiator), and\
    \ writes an entry in the threat log. The server (session responder) is not notified.\n\
    * `reset-client`：丢弃匹配的数据包，向客户端（会话发起方）发送 TCP RST，并写入威胁日志条目。服务器（会话响应方）不会收到通知。\n\
    * `reset-server`: Drops matching packets, sends a TCP RST to the server (session\
    \ responder), and writes an entry in the threat log. The client (session initiator)\
    \ is not notified.\n* `reset-server`：丢弃匹配的数据包，向服务器（会话响应方）发送 TCP RST，并写入威胁日志条目。客户端（会话发起方）不会收到通知。\n\
    * `reset-both`: Drops matching packets, sends a TCP RST to both the client and\
    \ the server, and writes an entry in the threat log.\n* `reset-both`：丢弃匹配的数据包，向客户端和服务器发送\
    \ TCP RST，并写入威胁日志条目。\n\nPacket captures can be enabled for further analysis by\
    \ the security team or as forensic evidence. They are attached to the threat log\
    \ and are limited to packets containing matched signatures.\n\n可以启用数据包捕获以供安全团队进一步分析或作为取证证据。它们附加到威胁日志中，并且仅限于包含匹配签名的包。\n\
    \nYou can create a new Antivirus profile by going to `Objects` | `Security Profiles`\
    \ | `Antivirus`. As the following screenshot shows, we will use Palo Alto Networks’\
    \ recommended best practices settings:\n\n您可以通过转到 `Objects` | `Security Profiles`\
    \ | `Antivirus` 来创建新的 Antivirus 配置文件。如以下屏幕截图所示，我们将使用 Palo Alto Networks 推荐的最佳实践设置：\n\
    \n![](img/B31589_03_01.png)\n\nFigure 3.1: Creating an Antivirus profile\n\n图\
    \ 3.1：创建 Antivirus 配置文件\n\nFor the Antivirus profile, the setting in the default\
    \ profile will have `imap` and `pop3` set to `alert` only. Since these protocols\
    \ do not respond too well to reset, this may be a good setting in cases where\
    \ they are actively being used in the organization. In most cases, email has been\
    \ replaced by a web-based (TLS/SSL) alternative and it would actually be more\
    \ secure to reset legacy protocols.\n\n对于 Antivirus 配置文件，默认配置文件中的设置将仅将 `imap`\
    \ 和 `pop3` 设置为 `alert`。由于这些协议对重置的响应不佳，因此在组织中积极使用它们的情况下，这可能是一个不错的设置。在大多数情况下，电子邮件已被基于\
    \ Web（TLS/SSL）的替代方案取代，实际上重置旧协议会更安全。\n\nExceptions can be added in the `Signature\
    \ Exceptions` tab for false positives or known true positives. Exceptions are\
    \ added by typing (or pasting) the `Threat ID` as found in the threat log and\
    \ clicking `Add`:\n\n可以在 `Signature Exceptions` 选项卡中为误报或已知的真阳性添加异常。异常是通过键入（或粘贴）威胁日志中查找到的\
    \ `Threat ID` 并单击 `Add` 来添加的：\n\n![](img/B31589_03_02_new.png)\n\nFigure 3.2:\
    \ AntiVirus exceptions\n\n图 3.2：AntiVirus 异常\n\nAdditional machine learning actions\
    \ can be set on the `Wildfire Inline ML` tab for `Windows Executables`, `PowerShell\
    \ Script 1` and `PowerShell Script 2`, `Executable Linked Format`, `MSOffice`,\
    \ `Shell`, `OOXML`, and `MachO`. Each model can be set to one of three actions:\n\
    \n可以在 `Wildfire Inline ML` 选项卡上为 `Windows Executables`、`PowerShell Script 1` 和\
    \ `PowerShell Script 2`、`Executable Linked Format`、`MSOffice`、`Shell`、`OOXML`\
    \ 和 `MachO` 设置额外的机器学习操作。每个模型可以设置为三种操作之一：\n\n* `enable (inherit per-protocol actions)`,\
    \ which enables additional machine learning scanning, and if a virus is detected,\
    \ the matching protocol (`smtp`, `http`, and so on) action that was set in the\
    \ main `Action` tab is applied\n* `enable (inherit per-protocol actions)`，它启用额外的机器学习扫描，如果检测到病毒，则将主\
    \ `Action` 选项卡中设置匹配协议（`smtp`、`http` 等）的操作应用\n* `alert-only (override more strict\
    \ actions to alert)` will enable additional machine learning scanning but positive\
    \ matches will only be reported in logging\n* `alert-only (override more strict\
    \ actions to alert)` 将启用额外的机器学习扫描，但正匹配仅在日志记录中报告\n* `disable (for all protocols)`,\
    \ which is the default setting and does not apply machine learning to the selected\
    \ model\n* `disable (for all protocols)`，这是默认设置，不对所选模型应用机器学习\n\nThe following\
    \ screenshot illustrates the available actions per model:\n\n以下屏幕截图说明了每个模型的可用操作：\n\
    \n![](img/B31589_03_03.png)\n\nFigure 3.3: WildFire Inline ML\n\n图 3.3：WildFire\
    \ Inline ML\n\nWildFire inline ML can dynamically analyze certain file types for\
    \ various file details and PowerShell scripts for malicious characteristics.\n\
    \nWildFire inline ML 可以动态分析某些文件类型的各种文件详细信息以及 PowerShell 脚本的恶意特征。\n\n## The Anti-Spyware\
    \ profile\n\n## Anti-Spyware 配置文件\n\nThe Anti-Spyware profile is extremely customizable\
    \ and is built by a set of rules within the profile. These rules serve to change\
    \ the default actions associated with each threat; so, if no rules are created\
    \ at all, the profile will simply apply the default action for a specific signature\
    \ when it is detected.\n\nAnti-Spyware 配置文件极其可定制，并由配置文件内的规则集构建。这些规则用于更改与每个威胁关联的默认操作；因此，如果根本未创建任何规则，配置文件将在检测到特定签名时简单地应用该签名的默认操作。\n\
    \nAnti-Spyware supports the same actions as Antivirus (`allow`, `drop`, `alert`,\
    \ `reset-client`, `reset-server`, and `reset-both`), with the addition of `block-ip`,\
    \ which can track by source or source-destination pair and will block the offending\
    \ IP for a duration of `1-3600` seconds. Tracking by source will block all connections\
    \ from the client for the duration of the block, while tracking by source-destination\
    \ pair will only block connections from the client to the target destination and\
    \ will not block the same client from connecting to other destinations.\n\nAnti-Spyware\
    \ 支持与 Antivirus 相同的操作（`allow`、`drop`、`alert`、`reset-client`、`reset-server` 和 `reset-both`），并增加了\
    \ `block-ip`，它可以根据源或源-目标对进行跟踪，并将阻止违规 IP 的持续时间为 `1-3600` 秒。按源跟踪将阻止客户端在阻止期间的所有连接，而按源-目标对跟踪仅会阻止客户端到目标目的地的连接，不会阻止同一客户端连接到其他目的地。\n\
    \nThe `Packet Capture` options include:\n\n`Packet Capture` 选项包括：\n\n* `none`,\n\
    * `none`,\n* `single-packet`, which only captures the packet containing the payload\
    \ matching a signature.\n* `single-packet`，它仅捕获包含匹配签名的有效载荷的数据包。\n* `extended-capture`\
    \ enables the capture of multiple packets to help analyze a threat. The number\
    \ of packets captured by `extended-capture` can be configured via `Device` | `Setup`\
    \ | `Content-ID`. The default is `5`.\n* `extended-capture` 启用捕获多个数据包以帮助分析威胁。`extended-capture`\
    \ 捕获的数据包数量可通过 `Device` | `Setup` | `Content-ID` 配置。默认值为 `5`。\n\n### Important\
    \ note\n\n### 重要说明\n\nEnabling packet capture on all threats does require some\
    \ CPU cycles. The impact will not be very large, but if the system is already\
    \ very taxed, some caution is advised.\n\n在所有威胁上启用数据包捕获确实需要一些 CPU 周期。影响不会很大，但如果系统已经非常繁忙，则应谨慎操作。\n\
    \n`Severity` indicates the severity level of the threat that applies to this rule.\n\
    \n`Severity` 表示适用于此规则的威胁的严重级别。\n\nCreate a new Anti-Spyware profile and add the\
    \ following rules:\n\n创建新的 Anti-Spyware 配置文件并添加以下规则：\n\n* `Policy Name`: `Block-Critical-High-Medium`\n\
    \  * `Severity`: `critical, high, medium`\n  * `Action`: `reset-both`\n  * `Packet\
    \ Capture`: `single-packet`\n* `Policy Name`：`Block-Critical-High-Medium`\n  *\
    \ `Severity`：`critical, high, medium`\n  * `Action`：`reset-both`\n  * `Packet\
    \ Capture`：`single-packet`\n* `Policy Name`: `Default-Low-Info`\n  * `Severity`:\
    \ `low`, `informational`\n  * `Action`: `default`\n  * `Packet Capture`: `disable`\n\
    * `Policy Name`：`Default-Low-Info`\n  * `Severity`：`low`、`informational`\n  *\
    \ `Action`：`default`\n  * `Packet Capture`：`disable`\n\n### Important note\n\n\
    ### 重要说明\n"
