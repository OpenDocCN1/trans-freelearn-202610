    \ be evaluated against the `TCP` state where the first packet needs to be a `SYN`\
    \ packet, and a `SYN` cookie is triggered if the protection profile threshold\
    \ is reached.\n2. Then, a destination zone is determined by checking the `policy-based\
    \ forwarding` (`PBF`) rules and, if no results are found, the routing table is\
    \ consulted.\n3. Lastly, the `NAT` policy is evaluated as the destination IP may\
    \ be changed by a `NAT` rule action, thereby changing the destination interface\
    \ and zone in the routing table. This would require a secondary forwarding lookup\
    \ to determine the post-`NAT` egress interface and zone.\n\nAfter these zone lookups\
    \ have been performed in the `initial packet processing`, the firewall will continue\
