- raw: "5.  When the software is successfully downloaded, you can commence installing\
    \ it onto the system. You will be prompted that a reboot is required to complete\
    \ the installation and to confirm whether you are sure that you want to continue.\
    \ Type `Y` to proceed with the installation: \n\n    ```\n    admin@PA-440> request\
    \ system software install version 12.2.2-h1\n    Executing this command will install\
    \ a new version of software. It will not take effect until system is restarted.\
    \ Do you want to continue? (y or n)\n    Software install job enqueued with jobid\
    \ 32. Run 'show jobs id 32' to monitor its status. Please reboot the device after\
    \ the installation is done.\n    ```\n\n6.  You can track the installation progress\
    \ through the `show jobs` command: \n\n    ```\n    admin@PA-440> show jobs id\
    \ 32\n    Enqueued            Dequeued ID Type   Status Result Completed\n   \
    \ --------------------------------------------------------------\n    2024/08/22\
    \ 23:35:28 23:35:28 32 SWInstall FIN OK     23:38:59 \n    Warnings:\n    Details:Software\
    \ installation successfully completed. Please reboot to switch to the new version.\n\
    \    ```\n\n7.  To complete the installation, reboot the firewall. Type `Y` into\
    \ the dialog if you are certain that you want to go ahead with the reboot. Rebooting\
    \ will cause all sessions to be interrupted and no new sessions to be accepted\
    \ until the firewall has completed the `autocommit` job: \n\n    ```\n    admin@PA-440>\
    \ request restart system\n    Executing this command will disconnect the current\
    \ session. Do you want to continue? (y or n)\n    ```\n\n8.  The `autocommit`\
    \ job runs right after a reboot and serves to load the configuration onto the\
    \ data plane. After a software upgrade, this process can take a while: \n\n  \
    \  ```\n    admin@PA-440> show jobs all\n    Enqueued            Dequeued ID Type\
    \   Status Result Completed\n    --------------------------------------------------------------\n\
    \    2021/12/31 23:44:27 1523:44:27 1  AutoCom FIN   OK      23:44:36 \n    ```\n\
    \nIf you prefer to upgrade the firewall via the web interface, follow the procedure\
    \ outlined in the next section.\n\n## Upgrading via the web interface\n\nSoftware\
    \ images can be downloaded and installed from the **Device** | **Software** menu.\
    \ The first time you access this page, you will be presented with an error message\
    \ because no repository has been loaded yet:\n\n![](Images/B31589_02_21.png)\n\
    \nFigure 2.21: Error message on the first visit to the software page\n\nYou can\
    \ ignore this warning; click **Close** and then click **Check Now**. Once the\
    \ repository has loaded, you will see all the available software images. If you\
    \ want to install a certain maintenance release version and you want to make sure\
    \ you meet all the requirements, starting from PAN-OS 10.2, you can click the\
    \ **Validate** button and the system will check which requirements there may be\
    \ for this version and whether you have already downloaded them. This will show\
    \ you the following:\n\n![](Images/B31589_02_22.png)\n\nFigure 2.22: Validate\
    \ action\n\nClick the **Download** link next to the PAN-OS version you want to\
    \ upgrade to and wait for the download dialog to complete:\n\n![](Images/B31589_02_23.png)\n\
    \nFigure 2.23: Software management page\n\nOnce the new PAN-OS package is downloaded,\
    \ it will be listed as such on the **Software** page, as shown. Click the **Install**\
    \ link next to the image to start the installation:\n\n![](Images/B31589_02_24.png)\n\
    \nFigure 2.24: Image downloaded and ready to install\n\nAt the end of the installation,\
    \ you will be prompted to reboot. You can skip the reboot if you want to postpone\
    \ the actual upgrade to a later time. Otherwise, click **Yes**, as shown:\n\n\
    ![](Images/B31589_02_25.png)\n\nFigure 2.25: Post-installation reboot dialog\n\
    \nIf you return to the **Software** page after the upgrade, you may notice that\
    \ not all of the PAN-OS options are listed anymore; this is due to a new feature\
    \ that can filter all the **Preferred Releases** and **Base Releases**, which\
    \ are enabled by default. These reflect Palo Alto’s recommended software versions\
    \ or base images for easier access. Disabling both checkboxes will show all available\
    \ OS releases again.\n\n![](Images/B31589_02_26.png)\n\nFigure 2.26: Preferred\
    \ and Base Releases filter\n\n**Upgrade cheat sheet**\n\nThis is an upgrade cheat\
    \ sheet that will help you prepare and plan your upgrade. These steps outline\
    \ a solid methodology to get to a stable PAN-OS version before placing the firewall\
    \ in production:\n\n1.  Go to [https://live.paloaltonetworks.com/t5/Customer-Resources/](https://live.paloaltonetworks.com/t5/Customer-Resources/)\
    \ for release recommendations.\n\n2.  In **Device** | **Software***,* click on\
    \ **Check Now** to load the latest list of available PAN-OS images.\n\n3.  Download\
    \ and install the recommended image of your current release.\n\n4.  When the installation\
    \ is completed, a dialog window will ask if you want to reboot the device. Click\
    \ **Yes**.\n\n5.  Wait for the unit to boot up again and download the base image\
    \ for the next major version.\n\n6.  Download and install the recommended maintenance\
    \ release for the next major version.\n\n7.  When the dialog asks you to reboot\
    \ the device, click **Yes**.\n\n8.  Repeat steps `5` through `7` until you’re\
    \ on the version you need to reach or until you reach PAN-OS 10.1, at which time,\
    \ you can skip ahead up to three OS versions.\n\nRemember that for an HA cluster\
    \ or Panorama environment, you need to do the following:\n\n*   Disable preemption\
    \ in the **High Availability** configuration before you start, and re-enable it\
    \ after the upgrade is completed on both members\n\n*   Check both members for\
    \ functionality before you start. The upgraded device will become non-functional\
    \ until the lowest member has caught up (the cluster favors the lowest software\
    \ member)\n\n*   Upgrade the Panorama centralized management first before upgrading\
    \ any of your devices\n\nYou have now made sure the firewall is fully set up for\
    \ success by ensuring the content packages are automatically downloaded and installed,\
    \ and the appropriate PAN-OS firmware has been installed. Next, we will take a\
    \ look at ensuring the management interface configuration is set up securely.\n\
    \nardening the management interface\n\nIt is paramount that the management interface\
    \ is kept secure, and access is limited to only those administrators that need\
    \ access. It is recommended to place the physical management interface in an **Out-of-Band**\
    \ (**OoB**) network, which limits exposure to the broader network. If access to\
    \ the management server is needed from a different network, it is best to set\
    \ up a dual-homes bastion host that mediates the connection, either by only allowing\
    \ admins to log in to it and use services from there, or having it set as a (transparent)\
    \ proxy with a log of all sessions and limiting the source users and IP subnets\
    \ as much as possible. Admin accounts also need to be set so they only have access\
    \ to the sections of the configuration they need to access and use external authentication.\
    \ Let’s look at these different scenarios in detail.\n\n## Limiting access via\
    \ an access list\n\nThe management interface local access list can be edited by\
    \ navigating to **Device** | **Setup** | **Interfaces** and clicking on the **Management\
    \ Interface**:\n\n![](Images/B31589_02_27.png)\n\nFigure 2.27: Management Interface\
    \ access list\n\nThe associated CLI `configure` mode command is as follows:\n\n\
    ```\nadmin@PA-440>configure\nadmin@PA-440#set deviceconfig system permitted-ip\
    \ 192.168.0.0/24 description \"mgmt subnet\"\n```\n\nYou can also attach an interface\
    \ management profile (shown in the following screenshot) to an interface, which\
    \ enables the selected services (SSH and HTTPS, usually) on the IP address of\
    \ the assigned data plane interface. This is not recommended as it introduces\
    \ significant risk if not implemented properly:\n\n![](Images/B31589_02_28.png)\n\
    \nFigure 2.28: Interface Management Profile"
  fmt: "\n### 5. Install software\nWhen the software is successfully downloaded, you\
    \ can commence installing it onto the system. You will be prompted that a reboot\
    \ is required to complete the installation and to confirm whether you are sure\
    \ that you want to continue. Type `Y` to proceed with the installation:\n```\n\
    admin@PA-440> request system software install version 12.2.2-h1\nExecuting this\
    \ command will install a new version of software. It will not take effect until\
    \ system is restarted. Do you want to continue? (y or n)\nSoftware install job\
    \ enqueued with jobid 32. Run `show jobs id 32` to monitor its status. Please\
    \ reboot the device after the installation is done.\n```\n\n### 6. Track installation\n\
    You can track the installation progress through the `show jobs` command:\n```\n\
    admin@PA-440> show jobs id 32\nEnqueued            Dequeued ID Type   Status Result\
    \ Completed\n--------------------------------------------------------------\n\
    2024/08/22 23:35:28 23:35:28 32 SWInstall FIN OK     23:38:59 \nWarnings:\nDetails:Software\
    \ installation successfully completed. Please reboot to switch to the new version.\n\
    ```\n\n### 7. Reboot firewall\nTo complete the installation, reboot the firewall.\
    \ Type `Y` into the dialog if you are certain that you want to go ahead with the\
    \ reboot. Rebooting will cause all sessions to be interrupted and no new sessions\
    \ to be accepted until the firewall has completed the `autocommit` job:\n```\n\
    admin@PA-440> request restart system\nExecuting this command will disconnect the\
    \ current session. Do you want to continue? (y or n)\n```\n\n### 8. Autocommit\
    \ job\nThe `autocommit` job runs right after a reboot and serves to load the configuration\
    \ onto the data plane. After a software upgrade, this process can take a while:\n\
    ```\nadmin@PA-440> show jobs all\nEnqueued            Dequeued ID Type   Status\
    \ Result Completed\n--------------------------------------------------------------\n\
    2021/12/31 23:44:27 1523:44:27 1  AutoCom FIN   OK      23:44:36 \n```\n\nIf you\
    \ prefer to upgrade the firewall via the web interface, follow the procedure outlined\
    \ in the next section.\n\n## Upgrading via the web interface\nSoftware images\
    \ can be downloaded and installed from the `Device` | `Software` menu. The first\
    \ time you access this page, you will be presented with an error message because\
    \ no repository has been loaded yet:\n\n![](Images/B31589_02_21.png)\nFigure 2.21:\
    \ Error message on the first visit to the software page\n\nYou can ignore this\
    \ warning; click `Close` and then click `Check Now`. Once the repository has loaded,\
    \ you will see all the available software images. If you want to install a certain\
    \ maintenance release version and you want to make sure you meet all the requirements,\
    \ starting from PAN-OS 10.2, you can click the `Validate` button and the system\
    \ will check which requirements there may be for this version and whether you\
    \ have already downloaded them. This will show you the following:\n\n![](Images/B31589_02_22.png)\n\
    Figure 2.22: Validate action\n\nClick the `Download` link next to the PAN-OS version\
    \ you want to upgrade to and wait for the download dialog to complete:\n\n![](Images/B31589_02_23.png)\n\
    Figure 2.23: Software management page\n\nOnce the new PAN-OS package is downloaded,\
    \ it will be listed as such on the `Software` page, as shown. Click the `Install`\
    \ link next to the image to start the installation:\n\n![](Images/B31589_02_24.png)\n\
    Figure 2.24: Image downloaded and ready to install\n\nAt the end of the installation,\
    \ you will be prompted to reboot. You can skip the reboot if you want to postpone\
    \ the actual upgrade to a later time. Otherwise, click `Yes`, as shown:\n\n![](Images/B31589_02_25.png)\n\
    Figure 2.25: Post-installation reboot dialog\n\nIf you return to the `Software`\
    \ page after the upgrade, you may notice that not all of the PAN-OS options are\
    \ listed anymore; this is due to a new feature that can filter all the `Preferred\
    \ Releases` and `Base Releases`, which are enabled by default. These reflect Palo\
    \ Alto’s recommended software versions or base images for easier access. Disabling\
    \ both checkboxes will show all available OS releases again.\n\n![](Images/B31589_02_26.png)\n\
    Figure 2.26: Preferred and Base Releases filter\n\n### Upgrade cheat sheet\nThis\
    \ is an upgrade cheat sheet that will help you prepare and plan your upgrade.\
    \ These steps outline a solid methodology to get to a stable PAN-OS version before\
    \ placing the firewall in production:\n1. Go to [https://live.paloaltonetworks.com/t5/Customer-Resources/](https://live.paloaltonetworks.com/t5/Customer-Resources/)\
    \ for release recommendations.\n2. In `Device` | `Software`, click on `Check Now`\
    \ to load the latest list of available PAN-OS images.\n3. Download and install\
    \ the recommended image of your current release.\n4. When the installation is\
    \ completed, a dialog window will ask if you want to reboot the device. Click\
    \ `Yes`.\n5. Wait for the unit to boot up again and download the base image for\
    \ the next major version.\n6. Download and install the recommended maintenance\
    \ release for the next major version.\n7. When the dialog asks you to reboot the\
    \ device, click `Yes`.\n8. Repeat steps `5` through `7` until you’re on the version\
    \ you need to reach or until you reach PAN-OS 10.1, at which time, you can skip\
    \ ahead up to three OS versions.\n\nRemember that for an HA cluster or Panorama\
    \ environment, you need to do the following:\n* Disable preemption in the `High\
    \ Availability` configuration before you start, and re-enable it after the upgrade\
    \ is completed on both members\n* Check both members for functionality before\
    \ you start. The upgraded device will become non-functional until the lowest member\
    \ has caught up (the cluster favors the lowest software member)\n* Upgrade the\
    \ Panorama centralized management first before upgrading any of your devices\n\
    \nYou have now made sure the firewall is fully set up for success by ensuring\
    \ the content packages are automatically downloaded and installed, and the appropriate\
    \ PAN-OS firmware has been installed. Next, we will take a look at ensuring the\
    \ management interface configuration is set up securely.\n\n## Hardening the management\
    \ interface\nIt is paramount that the management interface is kept secure, and\
    \ access is limited to only those administrators that need access. It is recommended\
    \ to place the physical management interface in an `Out-of-Band` (`OoB`) network,\
    \ which limits exposure to the broader network. If access to the management server\
    \ is needed from a different network, it is best to set up a dual-homes bastion\
    \ host that mediates the connection, either by only allowing admins to log in\
    \ to it and use services from there, or having it set as a (transparent) proxy\
    \ with a log of all sessions and limiting the source users and IP subnets as much\
    \ as possible. Admin accounts also need to be set so they only have access to\
    \ the sections of the configuration they need to access and use external authentication.\
    \ Let’s look at these different scenarios in detail.\n\n## Limiting access via\
    \ an access list\nThe management interface local access list can be edited by\
    \ navigating to `Device` | `Setup` | `Interfaces` and clicking on the `Management\
    \ Interface`:\n\n![](Images/B31589_02_27.png)\nFigure 2.27: Management Interface\
    \ access list\n\nThe associated CLI `configure` mode command is as follows:\n\
    ```\nadmin@PA-440>configure\nadmin@PA-440>set deviceconfig system permitted-ip\
    \ 192.168.0.0/24 description \"mgmt subnet\"\n```\n\nYou can also attach an interface\
    \ management profile (shown in the following screenshot) to an interface, which\
    \ enables the selected services (`SSH` and `HTTPS`, usually) on the IP address\
    \ of the assigned data plane interface. This is not recommended as it introduces\
    \ significant risk if not implemented properly:\n\n![](Images/B31589_02_28.png)\n\
    Figure 2.28: Interface Management Profile\n"
  trans: "\n### 5. 安装软件\n当软件成功下载后，您可以开始将其安装到系统上。系统会提示需要重启才能完成安装，并确认您是否确定要继续。输入 `Y`\
    \ 继续安装：\n```\nadmin@PA-440> request system software install version 12.2.2-h1\n\
    Executing this command will install a new version of software. It will not take\
    \ effect until system is restarted. Do you want to continue? (y or n)\nSoftware\
    \ install job enqueued with jobid 32. Run `show jobs id 32` to monitor its status.\
    \ Please reboot the device after the installation is done.\n```\n\n### 6. 跟踪安装\n\
    您可以通过 `show jobs` 命令跟踪安装进度：\n```\nadmin@PA-440> show jobs id 32\nEnqueued    \
    \        Dequeued ID Type   Status Result Completed\n--------------------------------------------------------------\n\
    2024/08/22 23:35:28 23:35:28 32 SWInstall FIN OK     23:38:59 \nWarnings:\nDetails:Software\
    \ installation successfully completed. Please reboot to switch to the new version.\n\
    ```\n\n### 7. 重启防火墙\n为完成安装，请重启防火墙。如果您确定要继续重启，请在对话框中输入 `Y`。重启会导致所有会话中断，并且在防火墙完成\
    \ `autocommit` 作业之前不会接受新的会话：\n```\nadmin@PA-440> request restart system\nExecuting\
    \ this command will disconnect the current session. Do you want to continue? (y\
    \ or n)\n```\n\n### 8. 自动提交作业\n`autocommit` 作业在重启后立即运行，用于将配置加载到数据平面。软件升级后，此过程可能需要一段时间：\n\
    ```\nadmin@PA-440> show jobs all\nEnqueued            Dequeued ID Type   Status\
    \ Result Completed\n--------------------------------------------------------------\n\
    2021/12/31 23:44:27 1523:44:27 1  AutoCom FIN   OK      23:44:36 \n```\n\n如果您更喜欢通过\
    \ Web 界面升级防火墙，请遵循下一节中概述的流程。\n\n## 通过 Web 界面升级\n软件映像可以从 `Device` | `Software` 菜单下载和安装。首次访问此页面时，由于尚未加载任何存储库，您将看到错误消息：\n\
    \n![](img/B31589_02_21.png)\n图 2.21：首次访问软件页面时的错误消息\n\n您可以忽略此警告；点击 `Close`，然后点击\
    \ `Check Now`。一旦存储库加载完成，您将看到所有可用的软件映像。如果您想安装某个维护版本并确保满足所有要求，从 PAN-OS 10.2 开始，您可以点击\
    \ `Validate` 按钮，系统将检查该版本可能有哪些要求以及您是否已下载它们。这将显示以下内容：\n\n![](img/B31589_02_22.png)\n\
    图 2.22：验证操作\n\n点击要升级到的 PAN-OS 版本旁边的 `Download` 链接，并等待下载对话框完成：\n\n![](img/B31589_02_23.png)\n\
    图 2.23：软件管理页面\n\n新的 PAN-OS 软件包下载完成后，将在 `Software` 页面上列出，如图所示。点击映像旁边的 `Install`\
    \ 链接开始安装：\n\n![](img/B31589_02_24.png)\n图 2.24：映像已下载并准备安装\n\n安装结束时，系统会提示您重启。如果您想将实际升级推迟到以后，可以跳过重启。否则，请点击\
    \ `Yes`，如下所示：\n\n![](img/B31589_02_25.png)\n图 2.25：安装后重启对话框\n\n如果在升级后返回 `Software`\
    \ 页面，您可能会注意到并非所有 PAN-OS 选项都列出；这是由于一项新功能，可以过滤所有 `Preferred Releases` 和 `Base Releases`，这些选项默认启用。这些反映了\
    \ Palo Alto 推荐的软件版本或便于访问的基础映像。禁用这两个复选框将再次显示所有可用的操作系统版本。\n\n![](img/B31589_02_26.png)\n\
    图 2.26：首选和基础版本筛选器\n\n### 升级速查表\n这是一份升级速查表，可帮助您准备和规划升级。这些步骤概述了一种稳健的方法，可在将防火墙投入生产之前达到稳定的\
    \ PAN-OS 版本：\n1. 访问 [客户资源](https://live.paloaltonetworks.com/t5/Customer-Resources/)\
    \ 获取版本建议。\n2. 在 `Device` | `Software` 中，点击 `Check Now` 加载最新的 PAN-OS 映像列表。\n3.\
    \ 下载并安装当前版本的推荐映像。\n4. 安装完成后，对话框会询问是否要重启设备。点击 `Yes`。\n5. 等待设备重新启动并下载下一个主要版本的基础映像。\n\
    6. 下载并安装下一个主要版本的推荐维护版本。\n7. 当对话框要求您重启设备时，点击 `Yes`。\n8. 重复步骤 `5` 到 `7`，直到达到所需的版本或达到\
    \ PAN-OS 10.1，此时您可以跳过最多三个操作系统版本。\n\n请记住，对于 HA 集群或 Panorama 环境，您需要执行以下操作：\n* 在开始之前禁用\
    \ `High Availability` 配置中的抢占，并在两个成员都完成升级后重新启用\n* 在开始之前检查两个成员的功能。升级后的设备在最低成员追上之前将无法正常工作（集群优先考虑软件版本最低的成员）\n\
    * 在升级任何设备之前，先升级 Panorama 集中管理\n\n您现在已确保防火墙已完全设置好以取得成功，因为内容包会自动下载和安装，并且已安装适当的 PAN-OS\
    \ 固件。接下来，我们将查看如何确保管理接口配置安全设置。\n\n## 加固管理接口\n管理接口必须保持安全，并且访问应仅限于需要访问的管理员。建议将物理管理接口放置在\
    \ `Out-of-Band` (`OoB`) 网络中，以限制对更广网络的暴露。如果需要从不同网络访问管理服务器，最好设置一台双宿堡垒主机来中介连接，要么只允许管理员登录并从那里使用服务，要么将其设置为（透明）代理，并记录所有会话，同时尽可能限制源用户和\
    \ IP 子网。管理员账户也需要设置，使其仅能访问所需的配置部分并使用外部身份验证。让我们详细了解这些不同的场景。\n\n## 通过访问列表限制访问\n管理接口本地访问列表可以通过导航到\
    \ `Device` | `Setup` | `Interfaces` 并点击 `Management Interface` 来编辑：\n\n![](img/B31589_02_27.png)\n\
    图 2.27：管理接口访问列表\n\n关联的 CLI `configure` 模式命令如下：\n```\nadmin@PA-440>configure\n\
    admin@PA-440>set deviceconfig system permitted-ip 192.168.0.0/24 description \"\
    mgmt subnet\"\n```\n\n您还可以将接口管理配置文件（如下图所示）附加到接口上，这将在分配的数据平面接口的 IP 地址上启用所选服务（通常为\
    \ `SSH` 和 `HTTPS`）。如果未正确实施，这会带来重大风险，因此不建议这样做：\n\n![](img/B31589_02_28.png)\n图\
    \ 2.28：接口管理配置文件\n"
