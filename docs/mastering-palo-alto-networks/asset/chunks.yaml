    \ though both are listed in the source and destination.\n\nThis means that you\
    \ can perfectly control between which interfaces traffic is allowed to flow to\
    \ even if you are unable to define subnets in the source or destination, which,\
    \ for traditional firewalls, means sessions will be allowed to flow everywhere.\n\
    \n![](Images/B31589_01_03.png)\n\nFigure 1.3: Different security rule types and\
    \ default rules\n\nNow that we’ve seen the important role zones play while making\
    \ security decisions, let’s look at the expected behavior when determining zones.\n\
    \n# Expected behavior when determining zones\n\nWhen a packet arrives on an interface,\
    \ the `PBF` policy or routing table will be consulted to determine the destination\
