    \n# 理解和准备安全配置文件\n\nThere are several types of security profiles, like Antivirus,\
    \ Vulnerability Protection, URL Filtering, and Anti-Spyware (we’ll cover all of\
    \ these different profiles in the following sections). Before you can start building\
    \ a solid security rule base, you need to create at least one custom security\
