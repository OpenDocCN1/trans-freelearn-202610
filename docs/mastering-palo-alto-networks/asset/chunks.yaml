- raw: "**Threshold** is a setting that delays the installation of a content package\
    \ for a set number of hours. At the time that this threshold expires, the firewall\
    \ checks for a new update package. If a new package is found, the new package\
    \ is downloaded and **Threshold** is reset for one more attempt. If yet another\
    \ update package is found after the first reset, the schedule will reset until\
    \ the next full occurrence. If no new packages are detected, the package will\
    \ be installed as defined by **Threshold**.\n\nThe threshold delay is a mechanism\
    \ to prevent installing faulty packages; if the vendor provides poorly crafted\
    \ content, the delay is set in hours, which should allow other accounts to experience\
    \ the flaws and report the content issue back to the support teams. So, the content\
    \ is rolled back via the administrators or the vendor. This thresholding option\
    \ correlates with a company’s tolerance for the risk of vendor errors and the\
    \ balance of new and emerging threats to the organization.\n\n**PCNSE tip**\n\n\
    According to Palo Alto Networks’ best practices, a security-first approach is\
    \ to set the threshold between 6 to 12 hours; however, for a critical environment,\
    \ the threshold should be 24 hours.\n\nThe **Application** content package also\
    \ has an option to completely **Disable new apps in content update** or enable\
    \ a separate threshold on the app IDs only **to Allow Extra Time to Review New\
    \ App-IDs**. The reasoning here is that what is identified as web browsing today\
    \ may change into a unique application after installing the **Application** content\
    \ package tomorrow. If the security policy has been set up to only allow previously\
    \ known applications, this could potentially cause issues with users who suddenly\
    \ can’t access that specific application.\n\nThe **New App-ID Threshold** setting\
    \ allows you to schedule a review period to see whether any applications need\
    \ to be accounted for in the security policy before they become active. If no\
    \ action is needed, the applications will become active automatically. The **Disable\
    \ new apps in content update** option will not activate any new applications until\
    \ you manually review and activate all new applications.\n\n**Important note**\n\
    \nAt the time of writing, the release schedule for new applications is the third\
    \ Tuesday of each month. Regular threat package updates happen on Tuesdays, but\
    \ urgent updates are sent out immediately.\n\n**Dynamic updates cheat sheet**\n\
    \nHere is a quick set of recommendations for scheduling dynamic updates:\n\n1.\
    \  Click on **Check Now**.\n\n2.  Download and install the latest `panupv2-all-contents`\
    \ or `panupv2-all-apps` package: \n\n    *   `panupv2-all-content` includes all\
    \ app ID, spyware, and vulnerability updates. This package requires an active\
    \ Threat Prevention license to be installed successfully.\n\n    *   `panupv2-all-apps`\
    \ only includes app ID updates and is used when a Threat Prevention license is\
    \ not active on the device.\n\n3.  Click **Check Now**, which will make the antivirus\
    \ packages visible.\n\n4.  Download and install the latest `panup-all-antivirus`\
    \ package.\n\n5.  Set an **Antivirus** update schedule: \n\n    *   Hourly recurrence\n\
    \n    *   15 minutes after the hour\n\n    *   Download and install\n\n    * \
    \  6-hour threshold\n\n6.  If you have a WildFire subscription license, set a\
    \ **WildFire** update schedule to **Real-time** (firewalls on high-latency internet\
    \ links can be set to 1-minute or 15-minute update intervals).\n\n1.  Set an **Applications\
    \ and Threats** update schedule: \n\n    *   Every 30 minutes\n\n    *   7 minutes\
    \ past the half-hour\n\n    *   Download and install\n\n    *   6-hour threshold\n\
    \n    *   Leave the **Allow Extra Time to Review New App-IDs** field blank if\
    \ new app IDs can be added immediately; set to a 48-hour threshold  (or more)\
    \ if the security team wishes to review new applications before they are activated\n\
    \nThe settings in this section are considered best practices as they ensure dynamic\
    \ updates are scheduled so as not to interfere with other scheduled tasks, like\
    \ report generation. The threshold ensures an update is not applied until some\
    \ time has passed by postponing the actual installation and then rechecking the\
    \ available content package at the threshold time. If a new package is available\
    \ due to an error or an urgent update, the new package is downloaded and the threshold\
    \ timer is refreshed. The process repeats once the threshold has been reached\
    \ again and either the latest package is installed or the update is postponed\
    \ to the next scheduled occurrence. Not only do content packages need to be updated\
    \ frequently, but new software versions are made available at regular times to\
    \ address bugs or introduce new features. Let’s now have a look at the steps needed\
    \ to upgrade your firewall.\n\n# Upgrading the firewall\n\nIn this section, you\
    \ will learn how to upgrade your firewall and what steps need to be taken to ensure\
    \ a smooth process. We will review important information to keep in mind when\
    \ preparing your maintenance window and providing a contingency plan. In-depth\
    \ upgrade procedures are provided in *Chapter 8*, *Upgrading Firewalls and Panorama*.\n\
    \n## Understanding the partitions\n\nBefore we start the upgrade procedure, there’s\
    \ an important bit of information you need to know. Like most Linux systems, the\
    \ hard disk has been partitioned into specific segments. These segments serve\
    \ a specific purpose.\n\nA few important ones are as follows:\n\n*   `/` is the\
    \ root partition, which is where the operating system is installed\n\n*   `/opt/pancfg`\
    \ is where the configuration files and dynamic update files are kept\n\n*   `/opt/panrepo`\
    \ is the repository for downloaded operating system (PAN-OS) images\n\n*   `/opt/panlogs`\
    \ is the partition where `logdatabase` is stored\n\nThere is a hidden `maint`\
    \ partition that can only be accessed during bootup. This partition is used for\
    \ disaster recovery, factory resetting the device, and disk issues.\n\nThe disk\
    \ space usage can be viewed with the following command:\n\n```\nadmin@PA-440>\
    \ show system disk-space\nFilesystem      Size  Used Avail Use% Mounted on\n/dev/mmcblk0p2\
    \   21G  5.9G   14G  31% /\nnone            7.8G   64K  7.8G   1% /dev\n/dev/mmcblk0p5\
    \   32G   13G   18G  42% /opt/pancfg\n/dev/mmcblk0p6   18G  9.6G  7.0G  58% /opt/panrepo\n\
    tmpfs           7.8G  3.8G  4.1G  48% /dev/shm\ncgroup_root     7.8G     0  7.8G\
    \   0% /cgroup\n/dev/mmcblk0p8   22G   11G  9.6G  53% /opt/panlogs\nNone\n```\n\
    \nThe cool thing about the `/` root partition is that it is actually one of two\
    \ `sysroot` partitions. The system has been partitioned with two operating system-specific\
    \ partitions, of which just one is mounted at a time. The upgrade procedure installs\
    \ the new PAN-OS onto the inactive partition.\n\nThis allows inline upgrades without\
    \ interrupting the active partition. Once the new operating system has been installed,\
    \ the GRUB bootloader is configured to load the other `sysroot` partition at the\
    \ next boot, causing the new PAN-OS to become active:\n\n```\nadmin@PA-440> debug\
    \ swm status\nPartition         State             Version\n--------------------------------------------------------------------------------\n\
    sysroot0          RUNNING-ACTIVE    11.2.2-h1\nsysroot1          REVERTABLE  \
    \      11.2.0\nmaint             READY             11.2.2-h1\n```\n\nThis mechanism\
    \ also allows a smooth rollback in case an upgrade fails and it is decided you\
    \ need to go back to the previous situation. You can trigger the `> debug swm\
    \ revert` debug command to tell the bootloader to switch the toggle again to the\
    \ previous `sysroot` partition and reboot the system via `> request restart system`.\
    \ After the device has rebooted, you are back on the previous PAN-OS with the\
    \ pre-upgrade configuration loaded.\n\n## Upgrade considerations"
