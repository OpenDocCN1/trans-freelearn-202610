- pgno: 316
  md: "Also, note that this Pooling solution will not work for classes we haven’t\
    \ defined and cannot\nderive from `IPoolableObject`, such as `Vector3` and `Quaternion`.\
    \ This is normally\ndictated by the `sealed` keyword in the class definition.\
    \ In these cases, we would need to\ndefine a containing class:\n\n```\npublic\
    \ class PoolableVector3 : IPoolableObject {\n    public Vector3 vector = new Vector3();\n\
    \    public void New() {\n        Reset();\n    }\n    public void Respawn() {\n\
    \        Reset();\n    }\n    public void Reset() {\n        vector.x = vector.y\
    \ = vector.z = 0f;\n    }\n}\n```\n\nWe could extend this system in a number of\
    \ ways, such as defining a `Despawn()` method to\nhandle destruction of the object,\
    \ making use of the `IDisposable` Interface Class and `using`\nblocks when we\
    \ wish to automatically spawn and despawn objects within a small scope,\nand/or\
    \ allowing objects instantiated outside the pool to be added to it.\n\n# # Prefab\
    \ Pooling\n\nThe previous Pooling solution is useful for typical C# objects, but\
    \ it won’t work for\nspecialized Unity objects, such as `GameObject` and `MonoBehaviour`.\
    \ These objects tend to\nconsume a large chunk of our runtime memory, can cost\
    \ us a great deal of CPU usage when\nthey’re created and destroyed, and tend to\
    \ risk a large amount of garbage collection at\nruntime. For instance, during\
    \ the lifecycle of a small RPG game, we might spawn a\nthousand Orc creatures,\
    \ but at any given moment, we may only need at a maximum, 10 of\nthem. It would\
    \ be nice if we could perform similar Pooling as before, but, for Unity Prefabs,\n\
    to save on a lot of unnecessary overhead creating and destroying 990 Orcs we don’t\
    \ need.\n\nOur goal is to push the overwhelming majority of object instantiation\
    \ to Scene initialization\nrather than letting them get created at runtime. This\
    \ can provide some big runtime CPU\nsavings and avoids a lot of spikes caused\
    \ by object creation/destruction and garbage\ncollection at the expense of Scene\
    \ loading times and runtime memory consumption. As a\nresult, there are quite\
    \ a few Pooling solutions available on the Asset Store for handling this\ntask,\
    \ with varying degrees of simplicity, quality, and feature sets."
  merge: -1
