- pgno: 333
  md: 'Note that if we also invoke a garbage collection during Scene transitions,
    there''s no need to explicitly destroy the `PrefabPool` objects these dictionaries
    were referencing. Since these were the only references to the `PrefabPool` objects,
    they will be deallocated during the next garbage collection. If we aren''t invoking
    garbage collection between Scenes, then the `PrefabPool` and `PooledPrefabData`
    objects will remain in memory until that time.


    # # Prefab Pooling summary


    This Pooling System provides a decent solution to the problem of runtime memory
    allocations for `GameObject`s and Prefabs, but, as a quick reminder, we need to
    be aware of the following caveats:


    +   - We need to be careful about properly resetting important data in respawned
    objects (such as `Rigidbody` velocity)

    +   - We must ensure that we don''t prespawn too few, or too many, instances of
    a Prefab

    +   - We should be careful of the order of execution of `Spawned()` and `Despawned()`
    methods on `IPoolableComponent` and not assume that they will be called in a particular
    order

    +   - We must call `Reset()` on `PrefabPoolingSystem` when loading a new Scene
    in order to clear any `null` references to objects, which may no longer exist


    There are several other features that we could implement. These will be left as
    academic exercises if we wish to extend this system in the future:


    +   - Any `IPoolableComponent` added to the `GameObject` after initialization
    will not have their `Spawned()` or `Despawned()` methods invoked since we only
    collect this list when the `GameObject` is first instantiated. We could fix this
    by changing `PrefabPool` to keep acquiring `IPoolableComponent` references every
    time `Spawned()` and `Despawned()` are invoked at the cost of additional overhead
    during spawning/despawning.

    +   - Any `IPoolableComponent` attached to children of the Prefab''s root will
    also not be counted. This could be fixed by changing `PrefabPool` to use `GetComponentsInChildren<T>`
    at the cost of additional overhead if we''re using Prefabs with deep hierarchies.'
