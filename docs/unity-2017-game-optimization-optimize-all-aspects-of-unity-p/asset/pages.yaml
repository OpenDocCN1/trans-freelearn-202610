- pgno: 343
  md: 'The same can be done in Visual Studio by pressing Ctrl + Alt + M, followed
    by Ctrl + H.


    # # Editor UI tips


    The following collection of tips relates to the Editor and its interface controls.


    # # Script Execution Order


    We can prioritize which Scripts will have their `Update()` and `FixedUpdate()`
    callbacks called before others by navigating to **Edit** | **Project Settings**
    | **Script Execution Order**. If we find ourselves trying to solve complex problems
    using this feature (with the exception of time-sensitive systems, such as audio
    processing), it implies that we’ve got some very fragile and tight coupling going
    on between our Components. From a software design perspective, this can be a warning
    sign that we might need to approach the problem from another angle. However, this
    can be helpful to use as a quick fix.


    # # Editor files


    Integrating Unity projects with a Source Control solution can be a little tricky.
    The first step is to include `.meta` files that Unity generates for various assets;
    if we don’t do this, then anyone pulling data into their local Unity project must
    regenerate their own metadata files. This could potentially cause conflicts, so
    it is essential that everyone uses the same versions. This can be enabled by navigating
    to **Edit** | **Project Settings** | **Editor** | **Version Control** | **Mode**
    | **Visible Meta Files**.


    It can also be helpful to convert certain asset data into a text-only format,
    rather than binary data, to allow manual editing of data files. This turns many
    data files into the much more human-readable YAML format. For instance, if we’re
    using Scriptable Objects to store custom data, we can use a text editor to search
    and edit these files without having to do it all through the Unity Editor and
    Serialization System. This can save a lot of time, especially when searching for
    a particular data value or performing multi-editing across different derived types.
    This option can be enabled by navigating to **Edit** | **Project Settings** |
    **Editor** | **Asset Serialization** | **Mode** | **Force Text**.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'The Editor has a log file, which can be accessed by opening the **Console**
    window (where log messages are printed), left-clicking on the _hamburger_ icon
    in the top-right corner (which looks like three thin horizontal lines), and selecting
    **Open Editor Log**. This can help us get more information about build failures.
    Alternatively, if we successfully built our project, it will contain a breakdown
    of compressed file sizes of all assets that were packed into the executable and
    ordered by size. This is an extremely helpful way of figuring out which assets
    consume the majority of our application footprint (hint: it''s almost always texture
    files), and which files take up more space than we would expect.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_344_0.png)


    Additional windows can be added to the Editor by right-clicking on the title of
    an existing window and selecting **Add Tab**. This also allows us to add duplicate
    windows, such as having more than one **Project** window or **Inspector** window
    open at a time. This can be particularly useful for moving files between different
    locations via multiple **Project** windows.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_344_1.png)'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'Having duplicate **Inspector** windows can be kind of redundant since they''ll
    show the exact same information when we click on a new object. However, by making
    use of the _lock_ icon, we can lock the given **Inspector** window to its current
    selection. When we select an object, all **Inspector** windows will update to
    show the object''s data, except for any locked **Inspector** windows, which continue
    to show the data of the object they were locked to.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_345_0.png)


    Common tricks that make use of window locking include the following:


    +   - Using two of the same window (**Inspector**, **Animation**, and so forth)
    to compare two objects side by side or more easily copy data from one object to
    another.

    +   - Watching what happens to any dependent object if an object is tweaked during
    **Play Mode**.

    +   - Selecting multiple objects in the **Project** window, then dragging and
    dropping them into a serialized array in the **Inspector** window without losing
    the original selection.


    # # The Inspector window


    We can enter calculations into numeric **Inspector** window fields. For example,
    typing `4*128` into an `int` field will resolve the value to `512`, sparing us
    from having to pull out a calculator or do the math in our head.


    Array elements can be duplicated and deleted from a list (in the same fashion
    as the hotkeys mentioned previously) by right-clicking on the root element and
    selecting **Duplicate Array Element** or **Delete Array Element**.


    A Component''s context menu can be accessed through both the small _cog_ icon
    in the upper-right corner or by right-clicking on the name of the Component. Every
    Component''s context menu contains a **Reset** option, which resets all values
    back to their default, sparing us from having to reset values manually. This is
    useful when working with `Transform` Components, as this option will set the object''s
    position and rotation to `(0, 0, 0)` and its scale to `(1, 1, 1)`.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'It’s commonly known that if a `GameObject` was spawned from a Prefab, then
    the entire object can be reverted back to its initial Prefab state using the **Revert**
    button at the top of the **Inspector** window. However, it’s less well known that
    individual values can be reverted by right-clicking on the name of the value and
    selecting **Revert Value to Prefab**. This restores the selected value while leaving
    the rest untouched.


    The **Inspector** window has a **Debug Mode** that can be accessed by left-clicking
    on the _hamburger_ icon next to the _lock_ icon and selecting **Debug**. This
    will disable all custom **Inspector** window drawing from Editor scripts and the
    like, and instead reveal all pieces of raw data within the given `GameObject`
    and its Components. Even `private` data fields become visible. Although they are
    grayed-out and cannot be modified through the **Inspector** window, this still
    gives us a useful way of examining the `private` data and other hidden values
    during **Play Mode**. The **Debug Mode** of the **Inspector** window also reveals
    internal ObjectIDs, which can be useful if we’re doing interesting things with
    Unity’s Serialization System and want to resolve conflicts. Since Editor scripts
    are also disabled during this mode, it can be useful for debugging such scripts
    by comparing its internal data to what we are trying to reveal in our Editor script.


    If we have an array of data elements serialized in the **Inspector** window, then
    they are typically labeled **Element N**, where `N` represents the array index
    of that element, starting from `0`. This can make it tricky to find a specific
    element if our array elements are a series of serialized classes or structs, which
    tend to have multiple children themselves. However, if the very first field in
    the object is a `string`, then the elements will be named after the value of the
    `string` field:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_346_0.png)'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# # The Project window


    The **Project** window''s search bar allows us to filter for objects of a particular
    type by clicking on the small icon to the right of the search bar. This provides
    a list of different types we can filter by revealing all objects of that type
    within the entire project. However, selecting these options simply fills the search
    bar with a string of the `t:<type>` format, which applies the appropriate filter.


    Thus, we can simply type the equivalent strings into the search bar for the sake
    of speed. For instance, typing `t:prefab` will filter for all Prefabs, no matter
    where they are found in the **Hierarchy** window. Similarly, `t:texture` will
    reveal textures, `t:scene` will reveal Scene files, and so on. Adding multiple
    search filters in the search bar will include objects of all types (it does not
    reveal objects that only satisfy both filters). These filters are modifiers in
    addition to name-based filtering, so adding a plain text string will cause a name-based
    search through the filtered objects. For example, `t:texture normalmap` will find
    all texture files that include the word _normalmap_ in their name.


    If we''re making use of Asset Bundles and the built-in labeling system, the **Project**
    window''s search bar also allows us to hunt down bundled objects by their label
    using `l:<label type>`.


    When a mesh object is selected, the **Preview** subsection at the bottom of the
    **Inspector** window is often fairly small, making it hard to take a look at details
    in the mesh and how it will look when it appears in our Scene. However, if we
    right-click on the top bar of the **Preview** subsection, it will be detached
    and enlarged into a separate **Preview** window, making it much easier to see
    our mesh. We don''t have to worry about setting the detached window back to its
    original home, as if the detached window is closed, then the **Preview** subsection
    will return to the bottom of the **Inspector** window.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'If a `MonoBehaviour` script contains serialized references

    (using `[SerializeField]` or `public`) to Unity assets, such as meshes and textures,
    then

    we can assign default values directly into the script itself. Select the script
    file in the **Project**

    window and the **Inspector** window should contain a field for the asset for us
    to drag and

    drop the default assignment into.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_348_0.png)


    By default, the **Project** window splits files and folders into two columns and
    treats them

    separately. If we prefer the **Project** window to have a typical hierarchical
    folder and file

    structure, then we can set it to **One Column Layout** in its context menu (the
    hamburger

    icon at the top right). This can be a great space saver in some Editor layouts.


    Right-clicking on any object in the **Project** window and selecting **Select
    Dependencies** will

    reveal all objects on which this asset relies in order to exist, such as textures,
    meshes,

    and `MonoBehaviour` script files. For Scene files, it will list all entities referenced
    within that

    Scene. This is helpful if we''re trying to perform asset cleanup.


    # # The Hierarchy window


    A lesser-known feature of the **Hierarchy** window is its ability to perform Component-based

    filtering within the currently active Scene. This can be accomplished by

    typing `t:<component name>`. For example, typing `t:light` inside the **Hierarchy**
    window

    search bar will reveal all objects in the Scene that contain a `Light` Component.'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'This feature is not case-sensitive, but the string we input must match the
    full Component name for the search to complete. Components that derive from the
    given type will also be revealed, so typing `t:renderer` will reveal all objects
    with derived Components such as `MeshRenderer` and `SkinnedMeshRenderer`.


    # # The Scene and Game windows


    The **Scene** window Camera is not visible from the **Game** window, but it is
    generally a lot easier to be moved around and placed through the use of the hotkeys
    mentioned previously. The Editor allows us to align the selected object to the
    same position and to rotate the **Scene** window Camera by navigating to **GameObject
    | Align with View** or pressing `Ctrl + Shift + F` (`Command + Shift + F`). This
    means that we can use the Camera controls to place the **Scene** window Camera
    where we would like our object to be and place the object there by aligning it
    with the Camera.


    Similarly, we can align the **Scene** window Camera to the selected object by
    selecting **GameObject | Align View to Selected** (note that there is no hotkey
    for this on either Windows or MacOS). This is useful for checking whether the
    given object is pointing toward the right direction.


    We can perform similar Component-based filtering on the **Scene** window, as we
    can with the **Hierarchy** window, using the `t:<component>` syntax within its
    search bar. This will cause the **Scene** window to only render objects containing
    the given Component (or those that derive from it). Note that this textbox is
    linked to the same textbox in the **Hierarchy** window, so anything we type in
    one will automatically affect the other, which is very helpful when searching
    for elusive objects.


    At the very top right of the Unity Editor is a drop-down menu labeled **Layers**.
    This contains a Layer-based filtering and locking system for the **Scene** window.
    Enabling the _eye_ icon for a given Layer will show/hide all objects of that Layer
    within the **Scene** window. Toggling the lock icon will allow or prevent objects
    of the given Layer from being selected or modified (at least through the Editor
    UI).'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'This is helpful for things such as preventing someone from accidentally selecting
    and moving background objects that have been already situated in the perfect location:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_350_0.png)


    A commonly known and useful feature of the Editor is that `GameObjects` can be
    given special icons or labels to make them easier to find in the Scene window.
    This is particularly helpful for objects with no renderer but that we wish to
    find easily. For instance, objects such as Lights and Cameras have built-in icons
    that identify them in our Scene window more easily. However, the same gizmos can
    be revealed within the Game window by clicking on the Gizmos button at the top
    right of the Game window. The dropdown for this option determines what gizmos
    will be visible when this option is enabled.


    # # Play Mode


    Since Play Mode changes are not automatically saved, it is wise to modify the
    tint color applied during Play Mode to make it blatantly obvious which mode we’re
    currently working with. This value can be set by navigating to Edit | Preferences
    | Colors | Playmode tint.


    Changes can be saved from Play Mode simply using the clipboard. If we’re tweaking
    an object in Play Mode and we’re happy with its settings, then we can copy the
    object into the clipboard using Ctrl + C (Command + C) and paste it back into
    the Scene once Play Mode ends via Ctrl + V (Command + V).'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# # Scripting tips


    The following tips are useful features to know when scripting.


    # # General


    We can modify various templates of new script, Shader, and Compute Shader files.
    This can be helpful to remove the empty Update stubs, which as we covered in Chapter
    2, Scripting Strategies, can cause unnecessary runtime overhead. These files can
    be found in the following locations:


    +   * Windows: `<Unity install>\Editor\Data\Resources\ScriptTemplates\`

    +   * MacOS:

    +     `/Applications/Unity/Editor/Data/Resources/ScriptTemplates/`


    All settings on the object at the time of the copy will be kept. The same can
    be done with individual values of entire Components using the **Copy Component**
    and **Paste Component** options in the Component''s context menu. However, the
    clipboard can only contain data for one GameObject, Component, or value at a time.


    Another approach, which allows us to save the data of multiple objects during
    **Play Mode**, is to create Prefabs from them by dragging and dropping them into
    the **Project** window at runtime once we''re happy with the settings. If the
    original object was derived from a Prefab, and we wish to update it across all
    instances, then we only need to overwrite the old Prefab with the new one we created
    by dragging and dropping the copy on top of the original. Note that this also
    works while **Play Mode** is active, but it can be dangerous since there is no
    dialog popup to confirm the overwrite. Be very careful not to overwrite the wrong
    Prefab.


    We can use the **Frame Skip** button (the button to the right of the **Pause**
    button in the Editor) to iterate one frame at a time. This can be useful for watching
    frame-by-frame physics or Gameplay behavior. Keep in mind that this causes both
    one Fixed Update and one Update to be called per iteration, in equal counts, which
    may not exactly reflect actual runtime behavior where we tend to have an unequal
    number of calls to these callbacks.


    If the **Pause** button is enabled when **Play Mode** begins, then the game will
    be paused just after the very first frame, giving us a chance to observe any anomalies
    that occurred during initialization of our Scene.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'The `Assert` class allows for assert-based debugging, which some developers
    are more comfortable with as opposed to exception-based debugging. Check out the
    Unity documentation for more information on Asserts at `http://docs.unity3d.com/
    ScriptReference/Assertions.Assert.html`.


    # # Attributes


    Attributes are very useful meta-level tags that can be given to almost any target
    in C#. They are most commonly used on fields and classes, allowing us to flag
    them with special properties so that they can be processed differently. Intermediate
    and advanced Unity developers will find it worthwhile to read the C# documentation
    on attributes and use their imagination to come up with their own attributes that
    help accelerate their workflow. There are quite a few attributes built in to the
    Unity engine that can be exceptionally useful when used in the right place.


    Advanced users will note that attributes can also be given to enums, delegates,
    methods, parameters, events, modules, and even assemblies.


    # # Variable attributes


    The `[Range]` attribute can be added to an integer or floating-point field to
    convert it to a slider in the **Inspector** window. We can give minimum and maximum
    values, thus limiting the range that the value can contain.


    Normally, if a variable is renamed, even if we do a refactor through our IDE (whether
    its MonoDevelop or Visual Studio), then the values are lost as soon as Unity recompiles
    the `MonoBehaviour` and makes the appropriate changes to any instances of the
    Component. However, the `[FormerlySerializedAs]` attribute is incredibly helpful
    if we want to rename a variable that has been previously serialized, as it will
    copy the data from the variable named within the attribute into the given variable
    during compilation time. No more lost data due to renaming stuff!'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Note that it is not safe to remove the `[FormerlySerializedAs]` attribute after
    the

    conversion is completed unless the variable has been manually changed and resaved
    into

    every relevant Prefab since the attribute was included. The `.prefab` data file
    will still

    contain the old variable name, and so it still needs

    the `[FormerlySerializedField]` attribute to figure out where to place the data
    the next

    time the file is loaded (for example, when the Editor is closed and reopened).
    Thus, this is a

    helpful attribute, but extended use does tend to clutter up our codebase a lot.


    # # Class attributes


    The `[SelectionBase]` attribute will mark any `GameObject` the Component is attached
    to

    as the root of selection for the **Scene** window. This is especially useful if
    we have meshes

    that are children of other objects, as we might want the parent object to be selected
    with

    the first click, instead of the object with the `MeshRenderer` Component.


    If we have Components with a strong dependency, we can use

    the `[RequireComponent]` attribute to force level designers to attach vital Components
    to

    the same `GameObject`. This ensures that any dependencies that our codebase relies
    on will

    be satisfied by designers, without having to write out a whole bunch of documentation
    for

    them.


    The `[ExecuteInEditMode]` attribute will force the object''s `Update()`, `OnGUI()`,

    and `OnRenderObject()` callbacks to be called even during **Edit Mode**. However,
    there are

    caveats, as follows:


    +   - The `Update()` method is only called if something changes in the Scene,
    such as

    +    moving the Camera around or changing an object property

    +   - `OnGUI()` is only called during **Game** window events, not for other window
    such

    +    as the **Scene** window

    +   - `OnRenderObject()` is called during any repaint event for the **Scene**
    and **Game**

    +    windows


    However, this attribute gives such objects a different set of event hooks and
    entry points

    compared to typical Editor scripts, so it still has its uses.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# # Logging


    We can add rich text tags to debug strings. Tags such as `<size>`, `<b>` (bold),
    `<i>` (italics),

    and `<color>` work on debug strings. This can be helpful for differentiating the
    different

    kinds of log messages and highlighting specific elements, as follows:


    ```

    Debug.Log ("<color=red>[ERROR]</color>This is a <i>very</i>/

    <size=14><b>specific</b></size> kind of log message");

    ```


    ![](img/da79484c9b30dc915216dbc5454a9bbf_354_0.png)


    The MonoBehaviour class has a print () method for convenience, which does the
    same

    thing as Debug.Log ().


    It can help to create a custom logger class, which automatically appends \n\n
    to the end of

    every log message. This will push away the

    unnecessary UnityEngine.Debug::Log (Object) clutter that tends to fill the Console

    window.


    # # Useful links


    Unity Technologies provide many useful tutorials on the usage of various scripting

    features, which primarily target beginner- and intermediate-level developers.
    The tutorials

    can be found at https://unity3d.com/learn/tutorials/topics/scripting.


    There''s a helpful post on Unity Answers, which provides a reference list that
    covers many

    of the different scripting and compilation errors we might run across during development,

    found at http://answers.unity3d.com/questions/723845/what-are-the-c-error-

    messages.html.


    Nested Coroutines is an interesting and useful area of scripting that is not well

    documented. However, the following third-party blog post, which covers a lot of
    the

    interesting details, should be considered when working with Nested Coroutines:


    http://www.zingweb.com/blog/2013/02/05/unity-coroutine-wrapper'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'We can figure out when a particular feature was added to the Unity API by checking
    the API history page at http://docs.unity3d.com/ScriptReference/40_history.html.
    This page currently shows API history only up to version 5.0.0. Hopefully, Unity
    Technologies will update this page someday, because it can sometimes be useful
    to know what features were added when we''re trying to support multiple versions
    of Unity simultaneously.


    # # Custom Editor scripts and menu tips


    While it''s common knowledge that we can create an Editor menu item in an Editor
    script with the `[MenuItem]` attribute, a lesser-known ability is being able to
    set custom hotkeys for menu items. For example, we can make the `K` key trigger
    our menu item method by defining the `[MenuItem]` attribute ending with `_k` as
    follows:


    ```

    `[MenuItem("My Menu/Menu Item _k")]`

    ```


    We can also include modifier keys such as `Ctrl` (Command), `Shift`, and `Alt`
    using the `%`, `#`, and `&` characters, respectively.


    `[MenuItem]` also has two overloads, which allows us to set two additional parameters:
    a Boolean that determines whether the menu item requires a validation method,
    and an integer that determines the menu item''s priority in the **Hierarchy**
    window.


    Check out the documentation for `[MenuItems]` for a complete list of available
    hotkey modifiers, special keys, and how to create validation methods at http://docs.unity3d.
    com/ScriptReference/MenuItem.html.


    It is possible to _ping_ an object in the **Hierarchy** window, similar to what
    happens when we click on a `GameObject` reference in the **Inspector** window
    by calling `EditorGUIUtility.PingObject()`.


    The original implementation of the `Editor` class, and the way that most people
    learned how to write Editor scripts, originally involved writing all logic and
    content drawing in the same class. However, the `PropertyDrawer` class is an effective
    way of delegating **Inspector** window drawing to a different class from the main
    `Editor` class. This effectively separates input and validation behavior from
    display behavior, allowing more fine-tuned control of rendering on a per-field
    basis and more effective reuse of code. We can even use `PropertyDrawer` to override
    default Unity drawing for built-in objects, such as `Vector` and `Quaternion`.'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'PropertyDrawer makes use of the SerializedProperty class to accomplish serialization

    of individual fields, and they should be preferred when writing Editor scripts,
    since they

    make use of built-in undo, redo, and multi-edit functionality. Data validation
    can be a little

    problematic, and the best solution is to use OnValidate() calls in setter properties.
    A

    session at Unite 2013 by Unity Technologies developer Tim Cooper explains the
    benefits

    and pitfalls of various serialization and validation approaches in great detail
    at https://

    www.youtube.com/watch?v=Ozc_hXzp_KU.


    We can add entries to Component context menus and even the context menus of individual

    fields with the [ContextMenu] and [ContextMenuItem] attributes. This allows an
    easy

    way to customize Inspector window behavior for our Components without needing
    to

    write broad Editor classes or custom Inspector windows.


    Advanced users may find it useful to store custom data within Unity metadata files
    through

    the AssetImporter.userData variable. There are also a multitude of opportunities
    to

    make use of Reflection of the Unity codebase. Ryan Hipple''s session at Unite
    2014 outlines a

    huge number of neat little hacks and tricks one can achieve with Reflection in
    the Unity

    Editor at https://www.youtube.com/watch?v=SyR4OYZpVqQ.


    # # External tips


    The following tips and tricks relate to topics outside the Unity Editor itself
    that can help

    Unity development workflow enormously.


    The Twitter hashtag #unitytips is a great resource for useful tips and tricks
    for Unity

    development and is, in fact, where many of the tips in this chapter originate
    from. However,

    hashtags are difficult to filter for tips you haven''t seen before, and it tends
    to be abused for

    marketing. A great resource that pulls together a bundle of weekly tips from #unitytips

    can be found at http://devdog.io/blog.


    Googling Unity-related problems or concerns can go a lot faster if we start the
    search with

    site:unity3d.com, which will filter all results so that only those under the unity3d.com

    domain will appear.


    If the Unity Editor crashes, for whatever reason, then we can potentially restore
    our Scene

    by renaming the following file to include the .unity extension (for Scene files),
    and

    copying it into our Assets folder:


    ```

    `\<project folder\>\Temp\_EditModeScene`

    ```'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'If we’re developing on Windows, then there’s very little reason not to use
    Visual Studio at this point. MonoDevelop has been dragged along kicking and screaming
    for many years, and many developers switched over to the more feature-rich Visual
    Studio Community Edition for most of their development workflow needs, particularly
    with incredibly helpful plugins such as Resharper.


    There is a great resource for game programming patterns (or, rather, typical programming
    patterns explained in a way that is pertinent to game development), and it’s completely
    free and available online. The following guide includes more information on several
    of the design patterns and game features we explored in this book, such as the
    Singleton Pattern, Observer Pattern, the Game Loop, and doubling-up on Frame Buffers:


    `http://gameprogrammingpatterns.com/contents.html`


    Keep an eye on any session videos that come from Unite conferences, whenever they
    happen (or better yet, try to attend them). There’s usually a couple of panels
    at each conference held by Unity employees and experienced developers who will
    share lots of cool and interesting things they’ve been able to accomplish with
    the Engine and Editor. In addition to this, make sure that you involve yourself
    in the Unity community, through the forums on `unity3d.com`, Twitter, Reddit,
    Stack Overflow, Unity Answers, or at whatever social gathering places pop out
    of the woodwork in the coming years.


    Every single tip that was included in this book wasn’t conjured out of thin air.
    It started out as an idea or tidbit of knowledge that someone shared somewhere
    at some point and somehow eventually found their way to this book’s author. So,
    the best way to keep up to date on the best tips, tricks, and techniques is to
    keep our fingers on the pulse of where Unity is heading by staying involved in
    its community.


    # # Other tips


    Finally, the following section contains tips that didn’t quite fit into other
    categories.


    It’s always a good idea to organize our Scenes using empty `GameObjects` as a
    parent for a group of objects while naming it to something sensible for that group.
    The only drawback to this method is that the object’s `Transform` is included
    during position or rotation changes and gets included during recalculations, and
    as we know, reparenting a `GameObject` to another `Transform` has its own costs.
    Proper object referencing, `Transform` change caching, and/or use of `localPosition`/`localRotation`
    solve some of these problems adequately. In almost all cases, the benefits to
    workflow from Scene organization are significantly more valuable than such trivial
    performance losses.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'Animator Override Controllers were introduced way back in Unity v4.3, but tend
    to be

    forgotten or rarely mentioned. They are an alternative to standard Animation Controllers

    that allow us to reference an existing Animation Controller, and then override
    specific

    animation states to use different animation files. This allows for much faster
    workflows

    since we don''t need to duplicate and tweak Animation Controllers multiple times;
    we only

    need to change a handful of animation states.


    When Unity is launched, it automatically opens the **Project Wizard**, allowing
    us to open a

    recent project. However, if we prefer the default behavior from Unity 4, which
    is to

    automatically open the previous project, we can edit this behavior by navigating
    to **Edit | Preferences | General | Load Previous Project** on startup. Note that
    if the **Project Wizard**

    is enabled, we can open multiple instances of Unity Editor simultaneously (although
    not to

    the same project).


    The amazing customizability of the Unity Editor and its ever-growing feature set
    means

    that there are tons of little opportunities to improve workflows and more are
    being

    discovered or invented every single day. The Asset Store marketplace is absolutely
    rife with

    different products that try to solve some kind of problem that modern developers
    are

    having trouble with, which makes it a great place to browse if we''re looking
    for ideas or, if

    we''re willing, drop some money to save us a ton of hassle.


    Since these assets tend to sell to a broad audience, this tends to keep prices
    low, and we can

    pick up some amazingly useful tools and scripts for surprisingly little cost.
    In almost all

    cases, it would take us a significant number of hours to develop the same solution

    ourselves. If we consider our time as valuable, then scanning the Asset Store
    on occasion

    can be a very cost-effective approach to development.


    # # Summary


    This brings us to the book''s conclusion. Hopefully, you have enjoyed the ride.
    To reiterate,

    perhaps, the most important tip in this book, always make sure that you verify
    the source of

    the performance bottleneck via benchmarking before making a single change. The
    last thing

    we want to waste time on is chasing ghosts in the codebase, when 5 minutes of
    profiler

    testing can save us an entire day of work. In a lot of cases, the solution requires
    a cost-

    benefit analysis to determine whether we''re sacrificing too much in any other
    area at the

    risk of adding further bottlenecks. Make sure that you have a reasonable understanding
    of

    the root cause of the bottleneck to avoid putting other performance metrics at
    risk. To also

    reiterate the second most important tip in this book, always profile and test
    after making

    changes to ensure that it had the intended effect.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'Performance enhancement is all about problem solving, which can be a lot of
    fun since due

    to the complexity of modern computer hardware, small tweaks can yield big rewards.
    There

    are many techniques that can be implemented to improve application performance
    or speed

    up our workflows. Some of these are hard to fully realize without the experience
    and skills

    necessary to spend a reasonable amount of time implementing them. In most cases,
    the fixes

    are relatively simple if we simply take the time to find and understand the source
    of the

    problem. So, go forth and use your repository of knowledge to make your games
    the best

    they can be.'
  merge: -1
  img_proc: true
