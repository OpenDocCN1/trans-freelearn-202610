- pgno: 299
  md: "What's actually happening is that while a `DataStruct` object (`_memberStruct`)\
    \ has been allocated on the heap within the `StructHolder` object, it is still\
    \ a Value type and does not magically transform into a Reference type when it\
    \ is a member variable of a Reference type. So, all of the usual rules for Value\
    \ types apply. The `_memberStruct` variable cannot have a value of `null`, and\
    \ all of its fields will be initialized to `0` or `null` values. When `StoreStruct()`\
    \ is called, the data from `ds` will be copied into `_memberStruct` in its entirety.\
    \ There are no references to stack objects taking place, and there is no concern\
    \ about lost data.\n\n# # Arrays are Reference types\n\nThe purpose of arrays\
    \ is to contain large datasets, which make them difficult to be treated as a Value\
    \ type since there's probably not enough room on the stack to support them. Therefore,\
    \ they are treated as a Reference type so that the entire dataset can be passed\
    \ around via a single reference (if it were a Value type, we would need to duplicate\
    \ the entire array every time it is passed around). This is true irrespective\
    \ of whether the array contains Value types or Reference types.\n\nThis means\
    \ that the following code will result in a heap allocation:\n\n```\n```\nTestStruct[]\
    \ dataObj = new TestStruct[1000];\n\nfor(int i = 0; i < 1000; ++i) {\n    dataObj[i].data\
    \ = i;\n    DoSomething(dataObj[i]);\n}\n```\n```\n\nHowever, the following, functionally\
    \ equivalent, code would not result in any heap allocations since the `struct`\
    \ objects being used are Value types, and hence, it would be created on the stack:\n\
    \n```\n```\nfor(int i = 0; i < 1000; ++i) {\n    TestStruct dataObj = new TestStruct();\n\
    \    dataObj.data = i;\n    DoSomething(dataObj);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 300
  md: 'The subtle difference in the second example is that only one `TestStruct` exists
    on the stack at a time, whereas the first example needs to allocate 1,000 of them
    via an array. Obviously, these methods are kind of ridiculous as they''re written,
    but they illustrate an important point to consider. The compiler isn''t smart
    enough to automatically find these situations for us and make the appropriate
    changes. Opportunities to optimize our memory usage through Value type replacements
    will be entirely down to our ability to detect them, and understand why conversions
    from Reference types to Value types will result in stack allocations, rather than
    heap allocations.


    Note that when we allocate an array of Reference types, we''re creating an array
    of references, which can each reference other locations on the heap. However,
    when we allocate an array of Value types, we''re creating a packed list of Value
    types on the heap. Each of these Value types will be initialized with a value
    of `0` (or equivalent) since they cannot be `null`, while each reference within
    an array of Reference types will always initialize to `null` since no references
    have been assigned, yet.


    # # Strings are immutable Reference types


    We briefly touched upon the subject of strings in `Chapter 2, Scripting Strategies`,
    but now it''s time to go into more detail about why proper string usage is extremely
    important.


    Strings are essentially arrays of characters, and so they are considered Reference
    types, and follow all of the same rules as other Reference types; they will be
    allocated on the heap, and a pointer is all that is copied from one method to
    the next. Since a string is effectively an array, this implies that the characters
    it contains must be contiguous in memory. However, we often find ourselves expanding,
    contracting, or combining strings to create other strings. This can lead us to
    making some faulty assumptions about how strings work. We might assume that because
    strings are such common, ubiquitous objects, performing operations on them is
    fast and cheap. Unfortunately, this is incorrect. Strings are not made to be fast.
    They are only made to be convenient.


    The `string` object class is immutable, which means they cannot be changed after
    they''ve been allocated. Therefore, when we change a string, we are actually allocating
    a whole new string on the heap to replace it, where the contents of the original
    will be copied and modified as needed into a whole new character array, and the
    original `string` object reference now points to a completely new `string` object.
    In which case, the old `string` object might no longer be referenced anywhere,
    will not be marked during Mark-and- Sweep, and will eventually be purged by the
    GC. As a result, lazy string programming can result in a lot of unnecessary heap
    allocations and garbage collection.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "A good example to illustrate how strings are different than normal Reference\
    \ types is the following code:\n\n```\nvoid TestFunction() {\n    string testString\
    \ = \"Hello\";\n    DoSomething(testString);\n    Debug.Log(testString);\n}\n\n\
    void DoSomething(string localString) {\n    localString = \"World!\";\n}\n```\n\
    \nIf we were under the mistaken assumption that strings worked just like other\
    \ Reference types, then we might be forgiven for assuming that the log output\
    \ of the following to be `World!`. It appears as though `testString`, a Reference\
    \ type, is being passed into `DoSomething()`, which would change what `testString`\
    \ is referencing to, in which case, the log statement will print out the new value\
    \ of the string.\n\nHowever, this is not the case, and it will simply print out\
    \ `Hello`. What is actually happening is that the `localString` variable, within\
    \ the scope of `DoSomething()`, starts off referencing the same place in memory\
    \ as `testString` due to the reference being passed by value. This gives us two\
    \ references pointing to the same location in memory as we would expect if we\
    \ were dealing with any other Reference type. So far, so good.\n\nHowever, as\
    \ soon as we change the value of `localString`, we run into a little bit of a\
    \ conflict. Strings are immutable, and we cannot change them, so, therefore, we\
    \ must allocate a new string containing the value `World!` and assign its reference\
    \ to the value of `localString`; now, the number of references to the `Hello`\
    \ string returns back to one. The value of `testString`, therefore, has not been\
    \ changed, and that is still the value that will be printed by `Debug.Log()`.\
    \ All we've succeeded in doing by calling `DoSomething()` is creating a new string\
    \ on the heap that gets garbage-collected and doesn't change anything. This is\
    \ the textbook definition of wasteful.\n\nIf we change the method definition of\
    \ `DoSomething()` to pass the string by reference via the `ref` keyword, the output\
    \ would indeed change to `World!`. Of course, this is also what we would expect\
    \ to happen with a Value type, which leads a lot of developers to incorrectly\
    \ assume that strings are Value types. However, this is an example of the fourth\
    \ and final data-passing case, where a Reference type is being passed by reference,\
    \ which allows us to change what the original reference is referencing."
  merge: -1
  img_proc: true
- pgno: 302
  md: "So, let's recap:\n\n+   - If we pass a Value type by value, we can only change\
    \ the value of a copy of its data\n+   - If we pass a Value type by reference,\
    \ we can change the value of the original data passed in\n+   - If we pass a Reference\
    \ type by value, we can make changes to the object that the original reference\
    \ is referencing\n+   - If we pass a Reference type by reference, we can change\
    \ the object or dataset the original reference is referencing\n\nIf we find functions\
    \ that seem to generate a lot of GC allocations the moment they are called, then\
    \ we might be causing undue heap allocations due to a misunderstanding of the\
    \ preceding rules.\n\n# # String concatenation\n\nConcatenation is the act of\
    \ appending strings to one another to form a larger string. As you've learned,\
    \ any such cases are likely to result in excess heap allocations. The biggest\
    \ offender in a string-based memory waste is concatenating strings using the `+`\
    \ operator and `+=` operators, because of the allocation chaining effect they\
    \ cause.\n\nFor example, the following code tries to combine a group of `string`\
    \ objects together to print some information about a combat result:\n\n```\n```\n\
    void CreateFloatingDamageText(DamageResult result) {\n    string outputText =\
    \ result.attacker.GetCharacterName() + \"\"\n        dealt \" + result.totalDamageDealt.ToString()\
    \ + \" \" +\n        result.damageType.ToString() + \" damage to \" +\n      \
    \  result.defender.GetCharacterName() + \" (\" +\n        result.damageBlocked.ToString()\
    \ + \" blocked)\";\n    // ...\n}\n```\n```\n\nAn example output of this function\
    \ might be a string that reads as follows:\n\nDwarf dealt 15 Slashing damage to\
    \ Orc (3 blocked)"
  merge: -1
  img_proc: true
- pgno: 303
  md: "This function features a handful of string literals (hardcoded strings that\
    \ are allocated during application initialization) such as \" dealt \", \" damage\
    \ to \", and \" blocked )\", which are simple constructs for the compiler to pre-allocate\
    \ for us. However, because we are using other local variables within this combined\
    \ string, it cannot be compiled away at build time, and, therefore, the complete\
    \ string be regenerated dynamically at runtime each time the function is called.\n\
    \nA new heap allocation will be generated each time a +, or +=, operator is executed;\
    \ only a single pair of strings will be merged at a time, and it allocates a new\
    \ string object each time. Then, the result of one merger will be fed into the\
    \ next and merged with the next string and so on until the final string object\
    \ has been built.\n\nSo, the previous example will result in nine different strings\
    \ being allocated all in one statement. All of the following strings would be\
    \ allocated to satisfy this instruction, and all would eventually need to be garbage\
    \ collected (note that the operators are resolved from right to left):\n\n+  \
    \ \"3 blocked)\" \n+   \" (3 blocked)\" \n+   \"Orc (3 blocked) \" \n+   \" damage\
    \ to Orc (3 blocked) \" \n+   \"Slashing damage to Orc (3 blocked)\" \n+   \"\
    \ Slashing damage to Orc (3 blocked)\" \n+   \"15 Slashing damage to Orc (3 blocked)\"\
    \ \n+   \"dealt 15 Slashing damage to Orc (3 blocked) \" \n+   \"Dwarf dealt 15\
    \ Slashing damage to Orc (3 blocked)\"\n\nThat's 262 characters being used, instead\
    \ of 49. In addition, because a character is a 2-byte data type (for Unicode strings),\
    \ that's 524-bytes of data being allocated when we only need 98-bytes. Chances\
    \ are that if this code exists in the code base once, it exists all over the place;\
    \ so, for an application that's doing a lot of lazy string concatenation like\
    \ this, that is a ton of memory being wasted on generating unnecessary strings.\n\
    \nNote that big, constant string literals can be safely combined using the + and\
    \ += operators. The compiler knows that you will eventually need the full string\
    \ and pregenerates the string automatically. This helps us to make huge block\
    \ of text more readable within the code base, but only if they will result in\
    \ a constant string.\n\nBetter approaches for generating strings are to use either\
    \ the StringBuilder class or one of several string class methods for string formatting."
  merge: -1
  img_proc: true
- pgno: 304
  md: '# # StringBuilder


    Conventional wisdom says that if we roughly know the final size of the resultant
    string, then we can allocate an appropriate buffer ahead of time and save ourselves
    undue allocations. This is the purpose of the `StringBuilder` class. It is effectively
    a mutable (changeable) string-based object that works like a dynamic array. It
    allocates a block of space, which we can copy future `string` objects into, and
    allocates additional space whenever the current size is exceeded. Of course, expanding
    the buffer should be avoided as much as possible by predicting the maximum size
    we will need and allocating a sufficiently sized buffer ahead of time.


    When we use a `StringBuilder`, we can retrieve the resultant `string` object by
    calling the `ToString()` method. This still results in a memory allocation for
    the completed `string`, but, at the very least, we only allocated one large string
    as opposed to dozens of smaller strings, had we used the `+` or `+=` operators.


    For the previous example, we might allocate a `StringBuilder` buffer of 100 characters
    to make room for long character names and damage values:


    ```

    using System.Text;

    // ...

    StringBuilder sb = new StringBuilder(100);

    sb.Append(result.attacker.GetCharacterName());

    sb.Append(" dealt ");

    sb.Append(result.totalDamageDealt.ToString());

    // etc.

    string result = sb.ToString();

    ```


    # # String formatting


    If we don''t know the final size of the resultant string, then using a `StringBuilder`
    class is unlikely to generate a buffer that fits the result size exactly. We will
    either end up with a buffer that''s too large (wasted space), or, worse, a buffer
    that''s too small, which must keep expanding as we generate the complete string.
    In this scenario, it might be best to use one of the various string class formatting
    methods.


    There are three string class methods available for generating strings: `string.Format()`,
    `string.Join()`, and `string.Concat()`. Each operates slightly differently, but
    the overall output is the same. A new `string` object is allocated, containing
    the contents of the `string` objects we pass into them, and it is all done in
    a single action, which reduces excess string allocations.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'Unfortunately, regardless of the approach we use, if we’re converting other
    objects into additional `string` objects (such as the calls to generate the strings
    for "Orc", "Dwarf", or "Slashing" in the preceding example), then this will allocate
    an additional `string` object on the heap. There is nothing we can do about this
    allocation, except perhaps cache the result so that we don’t need to recalculate
    it each time its needed.


    It can be surprisingly hard to say which one of these string generation approaches
    would be more beneficial in a given situation, as there are a lot of silly little
    nuances involved that tends to explode into religious debate (just do a Google
    search for _c sharp string concatenation performance_, and you’ll see what I mean),
    so the simplest approach is to implement one or the other using the conventional
    wisdom described previously. Whenever we run into bad performance with one of
    the string-manipulation methods, we should also try the other to check whether
    it results in a performance improvement. The best way to be certain is to profile
    them both for comparison, and then pick the best option of the two.


    # # Boxing


    Everything in C# is an object (caveats apply), meaning that they derive from the
    `System.Object` class. Even primitive data types such as `int`, `float`, and `bool`
    are implicitly derived from `System.Object`, which is itself a Reference type.
    This is a special case, which allows them access to helper methods such as `ToString()`
    so that they can customize their string representation, but without actually turning
    them into Reference types. Whenever one of these Value types is implicitly treated
    in such a way that it must act like an object, the CLR automatically creates a
    temporary object to store, or _box_, the value inside so that it can be treated
    as a typical Reference type object. As we should expect, this results in a heap
    allocation to create the containing vessel.


    Note that boxing is not the same thing as using Value types as member variables
    of Reference types. Boxing only takes place when Value types are treated as Reference
    types via conversion or casting.


    For example, the following code will cause the integer variable `i` to be boxed
    inside object `obj`:


    ```

    int i = 128;

    object obj = i;

    ```'
