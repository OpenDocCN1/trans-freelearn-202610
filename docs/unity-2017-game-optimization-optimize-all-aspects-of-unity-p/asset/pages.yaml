- pgno: 107
  md: "Essentially, we will need to pair every `AttachListener()` call with an appropriate\
    \ `DetachListener()` call when the object is destroyed, disabled, or we otherwise\
    \ decide that we no longer need it to be queried when messages are being sent.\n\
    \nThe following method definition in the `MessagingSystem` class will detach a\
    \ listener for a specific event:\n\n```\n```\npublic bool DetachListener(System.Type\
    \ type, MessageHandlerDelegate\nhandler) {\n\tif (type == null) {\n\t\tDebug.Log(\"\
    MessagingSystem: DetachListener failed due to having no \" +\n\t\t\t\"message\
    \ type specified\");\n\t\treturn false;\n\t}\n\n\tstring msgType = type.Name;\n\
    \n\tif (!_listenerDict.ContainsKey(type.Name)) {\n\t\treturn false;\n\t}\n\n\t\
    List<MessageHandlerDelegate> listenerList = _listenerDict[msgType];\n\tif (!listenerList.Contains(handler))\
    \ {\n\t\treturn false;\n\t}\n\tlistenerList.Remove(handler);\n\treturn true;\n\
    }\n```\n```\n\nHere is an example usage of the `DetachListener()` method added\
    \ to our `EnemyManagerWithMessagesComponent` class:\n\n```\n```\nvoid OnDestroy()\
    \ {\n\tif (MessagingSystem.IsAlive) {\n\t\tMessagingSystem.Instance.DetachListener(typeof(EnemyCreatedMessage),\n\
    \t\t\tthis.HandleCreateEnemy);\n\t}\n}\n```\n```\n\nNote how this definition makes\
    \ use of the `IsAlive` property declared in the `SingletonComponent` class. This\
    \ safeguards us against the aforementioned problem of accidentally creating a\
    \ new `MessagingSystem` during application shutdown, since we can never guarantee\
    \ that the Singleton gets destroyed last."
  merge: -1
  img_proc: true
- pgno: 108
  md: '# # Wrapping up the Messaging System


    Congratulations are in order, as we have finally built a fully functional global
    Messaging System that any and all objects can interface with, and use it to send
    messages between one another. A useful feature of this approach is that it is
    Type-agnostic, meaning that the message senders and listeners do not even need
    to derive from any particular class in order to interface with the Messaging System;
    it just needs to be a class that provides a message type and a delegate function
    of the matching function signature, which makes it accessible to both ordinary
    classes and MonoBehaviours.


    As far as benchmarking the MessagingSystem class goes, we will find that it is
    capable of processing hundreds, if not thousands, of messages in a single frame
    with minimal CPU overhead (depending on the CPU, of course). The CPU usage is
    essentially the same, whether one message is being distributed to 100 different
    listeners or 100 messages are distributed to just one listener. Either way, it
    costs about the same.


    Even if we''re predominantly sending messages during UI or gameplay events, this
    probably has far more power than we need. So, if it does seem to be causing performance
    problems, then it''s far more likely to be caused by what the listener delegates
    are doing with the message than the Messaging System''s ability to process those
    messages.


    There are many ways to enhance the Messaging System to provide more useful features
    we may need in the future, as follows:


    +   - Allow message senders to suggest a delay (in time or frame count) before
    a message is delivered to its listeners

    +   - Allow message listeners to define a priority for how urgently it should
    receive messages compared to other listeners waiting for the same message type.
    This is a means for listeners to skip to the front of the queue if it was registered
    later than other listeners

    +   - Implement some safety checks to handle situations where a listener gets
    added to the list of message listeners for a particular message while a message
    of that type is still being processed. Currently, C# will throw an EnumerationException
    at us since the delegate list will be changed by AttachListener(), while it is
    still being iterated through in TriggerEvent()


    At this point, we probably explored the Messaging System enough, so these tasks
    will be left as an academic exercise for you to undertake, if you become comfortable
    using this solution in your games. Let''s continue to explore more ways to improve
    performance through script code.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# # Disable unused scripts and objects


    Scenes can get pretty busy sometimes, especially when we''re building large, open
    worlds. The more objects invoking code in an `Update()` callback, the worse things
    it will scale and the slower the game becomes. However, much of what is being
    processed may be completely unnecessary if it is outside of the player''s view
    or simply too far away to matter. This may not be a possibility in large city-building
    simulation games, where the entire simulation must be processed at all times,
    but it is often possible in first-person and racing games since the player is
    wandering around a large expansive area, where non-visible objects can be temporarily
    disabled without having any noticeable effect on gameplay.


    # # Disabling objects by visibility


    Sometimes, we may want Components or `GameObject`s to be disabled when they''re
    not visible. Unity comes with built-in rendering features to avoid rendering objects
    that are not visible to the player''s Camera view (through a technique known as
    `Frustum Culling`, which is an automatic process) and to avoid rendering objects
    that are hidden behind other objects (occlusion culling, which will be discussed
    in `Chapter 6, Dynamic Graphics`), but these are only rendering optimizations.
    It does not affect Components that perform tasks on the CPU, such as AI scripts,
    User Interface, and gameplay logic. We must control that behavior ourselves.


    A good solution to this problem is using the `OnBecameVisible()` and `OnBecameInvisible()`
    callbacks. As the names imply, these callback methods are invoked when a renderable
    object has become visible or invisible with respect to any Cameras in our Scene.
    In addition, when there are multiple Cameras in a Scene (for example, a local
    multiplayer game), the callbacks are only invoked if the object becomes visible
    to any one Camera and becomes invisible to all Cameras. This means that the aforementioned
    callbacks will be called at exactly the right times we expect; if nobody can see
    it, `OnBecameInvisible()` gets called, and if at least one player can see it,
    `OnBecameVisible()` gets called.


    Since the visibility callbacks must communicate with the Rendering Pipeline, the
    `GameObject` must have a renderable Component attached, such as a `MeshRenderer`
    or `SkinnedMeshRenderer`. We must ensure that the Components we want to receive
    the visibility callbacks from are also attached to the same `GameObject` as the
    renderable object and are not a parent or child `GameObject`, otherwise they won''t
    be invoked.'
  merge: -1
  img_proc: true
- pgno: 110
  md: "# # Disabling objects by distance\n\nIn other situations, we may want Components\
    \ or `GameObjects` to be disabled after they are enough far away from the player\
    \ such that they may be barely visible, but too far away to matter. A good candidate\
    \ for this type of activity is roaming AI creatures that we want to see at a distance,\
    \ but where we don't need it to process anything, and it can sit idle until we\
    \ get closer.\n\nThe following code is a simple Coroutine that periodically checks\
    \ the total distance from a given target object and disables itself if it strays\
    \ too far away from it:\n\n```\n```\n[SerializeField] GameObject _target;\n[SerializeField]\
    \ float _maxDistance;\n[SerializeField] int _coroutineFrameDelay;\nvoid Start()\
    \ {\n    StartCoroutine(DisableAtADistance());\n}\n```\n```\n\nNote that Unity\
    \ also counts the hidden Camera of the **Scene** window toward the `OnBecameVisible()`\
    \ and `OnBecameInvisible()` callbacks. If we find that these methods are not being\
    \ invoked properly during Play Mode testing, ensure that you turn the **Scene**\
    \ window Camera away from everything or disable the **Scene** window entirely.\n\
    \nTo enable/disable individual Components with the visibility callbacks, we can\
    \ add the following methods:\n\n```\n```\nvoid OnBecameVisible() { enabled = true;\
    \ }\nvoid OnBecameInvisible() { enabled = false; }\n```\n```\n\nAlso, to enable/disable\
    \ the entire `GameObject` the Component is attached to, we can implement the methods\
    \ this way instead:\n\n```\n```\nvoid OnBecameVisible() { gameObject.SetActive(true);\
    \ }\nvoid OnBecameInvisible() { gameObject.SetActive(false); }\n```\n```\n\nAlthough,\
    \ be warned that disabling the `GameObject` containing the renderable object,\
    \ or one of its parents, will make it impossible for `OnBecameVisible()` to be\
    \ called since there's now no graphical representation for the Camera to see and\
    \ trigger the callback with. We should place the Component on a child `GameObject`,\
    \ and have the script disable that instead, leaving the renderable object always\
    \ visible (or find another way to re-enable it later)."
  merge: -1
  img_proc: true
- pgno: 111
  md: "```\nIEnumerator DisableAtADistance() {\n    while(true) {\n        float distSqrd\
    \ = (transform.position -\n        _target.transform.position).sqrMagnitude;\n\
    \        if (distSqrd < _maxDistance * _maxDistance) {\n            enabled =\
    \ true;\n        } else {\n            enabled = false;\n        }\n\n       \
    \ for (int i = 0; i < _coroutineFrameDelay; ++i) {\n            yield return new\
    \ WaitForEndOfFrame();\n        }\n    }\n}\n```\n\nWe should assign the player's\
    \ character object (or whatever object we want it to compare\nwith) to the `_target`\
    \ field in the **Inspector** window, define the maximum distance in\n`_maxDistance`,\
    \ and modify the frequency with which the Coroutine is invoked using the\n`_coroutineFrameDelay`\
    \ field. Any time the object goes further than `_maxDistance`\ndistance away from\
    \ the object assigned to `_target`, it will be disabled. It will be re-enabled\n\
    if it returns within that distance.\n\nA subtle performance-enhancing feature\
    \ of this implementation is comparing against\ndistance-squared instead of the\
    \ raw distance. This leads us conveniently to our next section.\n\n# Consider\
    \ using distance-squared over\ndistance\n\nIt is safe to say that CPUs are relatively\
    \ good at multiplying floating-point numbers\ntogether, but relatively dreadful\
    \ at calculating square-roots from them. Every time we ask a\n`Vector3` to calculate\
    \ a distance with the `magnitude` property or with the `Distance()`\nmethod, we're\
    \ asking it to perform a square-root calculation (as per Pythagorean theorem),\n\
    which can cost a lot of CPU overhead compared to many other types of vector math\n\
    calculations.\n\nHowever, the `Vector3` class also offers a `sqrMagnitude` property,\
    \ which provides the\nsame result as distance, only the value is squared. This\
    \ means that if we also square the\nvalue we wish to compare distance against,\
    \ then we can perform essentially the same\ncomparison without the cost of an\
    \ expensive square-root calculation."
  merge: -1
  img_proc: true
- pgno: 112
  md: "For example, consider the following code:\n```\nfloat distance = (transform.position\
    \ - other.transform.position).Distance();\nif (distance < targetDistance) {\n\
    \    // do stuff\n}\n```\n\nThis can be replaced with the following and achieve\
    \ a nearly identical result:\n```\nfloat distanceSqrd = (transform.position -\n\
    other.transform.position).sqrMagnitude;\nif (distanceSqrd < (targetDistance *\
    \ targetDistance)) {\n    // do stuff\n}\n```\n\nThe reason the result is nearly\
    \ identical is because of the floating-point precision. We’re likely to lose some\
    \ of the precision that we would have had from using the square-root values, since\
    \ the value will be adjusted to an area with a different density of representable\
    \ numbers; it can land exactly on, or closer to, a more accurate representable\
    \ number, or, more likely, it will land on a number with less accuracy. As a result,\
    \ the comparison is not exactly the same, but, in most cases, it is close enough\
    \ to be unnoticeable, and the performance gain can be quite significant for each\
    \ instruction we replace in this manner.\n\nIf this minor precision loss is not\
    \ important, then this performance trick should be considered. However, if precision\
    \ is very important (such as running an accurate large-scale galactic space simulation),\
    \ then you may want to give this tip a pass.\n\nNote that this technique can be\
    \ used for any square-root calculations, not just for distance. This is simply\
    \ the most common example you might run across, and it brings to light the important\
    \ `sqrMagnitude` property of the `Vector3` class. This is a property which Unity\
    \ Technologies intentionally exposed for us to make use of in this manner.\n\n\
    # # Minimize Deserialization behavior\n\nUnity’s Serialization system is mainly\
    \ used for Scenes, Prefabs, ScriptableObjects and various Asset types (which tend\
    \ to derive from ScriptableObject). When one of these object types is saved to\
    \ disk, it is converted into a text file using the **Yet Another Markup Language\
    \ (YAML)** format, which can be deserialized back into the original object type\
    \ at a later time. All `GameObjects` and their properties get serialized when\
    \ a Prefab or Scene is serialized, including `private` and `protected` fields,\
    \ all of their Components as well as its child `GameObjects` and their Components,\
    \ and so on."
  merge: -1
  img_proc: true
- pgno: 113
  md: 'When our application is built, this serialized data is bundled together in
    large binary data files internally called Serialized Files in Unity. Reading and
    deserializing this data from disk at runtime is an incredibly slow process (relatively
    speaking) and so all deserialization activity comes with a significant performance
    cost.


    This kind of deserialization takes place any time we call `Resources.Load()` for
    a file path found under a folder named `Resources`. Once the data has been loaded
    from disk into memory, then reloading the same reference later is much faster,
    but disk activity is always required the first time it is accessed. Naturally,
    the larger the data set we need to deserialize, the longer this process takes.
    Since every Component of a Prefab gets serialized, then the deeper the hierarchy
    is, the more data needs to be deserialized. This can be a problem for Prefabs
    with very deep hierarchies, Prefabs with many empty `GameObjects` (since every
    `GameObject` always contains at least a `Transform` Component), and particularly
    problematic for User Interface (UI) Prefabs, since they tend to house many more
    Components than a typical Prefab.


    Loading in large serialized data sets like these could cause a significant spike
    in CPU the first time they are loaded, which tend to increase loading time if
    they''re needed immediately at the start of the Scene. More importantly, they
    can cause frame drops if they are loaded at runtime. There are a couple of approaches
    we can use to minimize the costs of deserialization.


    # # Reduce serialized object size


    We should aim to make our serialized objects as small as possible, or partition
    them into smaller data pieces we combine together piece-by-piece so that they
    can be loaded one piece at a time over time. This can be tricky to manage for
    Prefabs since Unity does not inherently support nested Prefabs, and so we would
    be implementing such a system ourselves, which is a notoriously difficult problem
    to solve in Unity. UI Prefabs are good candidates for separating into smaller
    pieces, since we don''t normally need the entire UI at any given moment, and so
    we can usually afford to load them in one piece at a time.


    # # Load serialized objects asynchronously


    Prefabs and other serialized content can be loaded in asynchronously via `Resources.LoadAsync()`,
    which will offload reading from disk onto a worker thread that eases the burden
    on the main thread. It will take some time for the serialized object to become
    available, which can be checked by calling the `isDone` property on the `ResourceRequest`
    object returned by the previous method call.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'This is not ideal for Prefabs we need immediately at the start of the game,
    but all future Prefabs are good candidates for asynchronous loading if we''re
    willing to create systems that manage this behaviour.


    # # Keep previously loaded serialized objects in memory


    As previously mentioned, once a serialized object has been loaded into memory,
    then it remains there and can be copied if we need it again later, such as instantiating
    more copies of a Prefab. We can free this data later with explicit calls to `Resources.Unload()`,
    which will release the memory space to be reused later. But, if we have a lot
    of surplus memory in the application''s budget, then we could choose to keep this
    data in memory, which would reduce the need to reload it again from disk later.
    This naturally consumes a lot of memory with more and more serialized data, making
    it a risky strategy for memory management, and so we should only do this when
    necessary.


    # # Move common data into ScriptableObjects


    If we have a lot of different Prefabs with Components that contain a lot of properties
    that tend to share data, such as game design values like hit points, strength,
    speed, and so on, then all of this data will be serialized into every Prefab that
    uses them. A better approach is to serialize this common data in a `ScriptableObject`
    which they load and use instead. This reduces the amount of data stored within
    the Serialized File for the Prefab and could significantly reduce the loading
    time of our scenes by avoiding too much repetitive work.


    # # Load scenes additively and asynchronously


    Scenes can be loaded either to replace the current Scene or can be loaded additively
    to add its contents to the current Scene without unloading the preceding one.
    This can be toggled via the `LoadSceneMode` argument of the `SceneManager.LoadScene()`
    family of functions.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Another mode of Scene loading is to complete it either synchronously or asynchronously,
    and there are good reasons to use both. Synchronous loading is the typical means
    of loading a Scene by calling `SceneManager.LoadScene()` where the main thread
    will block until the given Scene completes loading. This normally results in a
    poor user experience, as the game appears to freeze as the contents are loaded
    in (whether as a replacement or additively). This is best used if we want to get
    the player into the action as soon as possible, or we have no time to wait for
    Scene objects to appear. This would normally be used if we''re loading into the
    first level of the game or returning to the main menu.


    For future Scene loading, however, we may wish to reduce the performance impact
    so that we can continue to keep the player in action. Loading a Scene can take
    a lot of work, and the larger the Scene, the longer it will take. However, the
    option of asynchronous additive loading offers a huge benefit; we can let the
    Scene gradually load in the background without causing significant impact on the
    user experience. This can be accomplished with `SceneManager.LoadSceneAsync()`
    combined with passing in `LoadSceneMode.Additive` for the loading mode argument.


    It''s important to realize that scenes do not strictly follow the concept of a
    game level. In most games, players are normally trapped in one level at a time,
    but Unity can support multiple scenes being loaded simultaneously through additive
    loading, allowing each Scene to represent a small chunk of a level. Ergo, we could
    initialize the first Scene for the level (`Scene-1-1a`), and as the player nears
    the next section, asynchronously and additively load in the next (`Scene-1-1b`),
    and repeat this continuously as the player travels through the level.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_115_0.png)


    Unity Technologies restructured the Scene system in a mid-release of Unity 5 into
    a global `SceneManager` class, although this was more of a naming convention change
    to make it clear that levels and scenes are not the same thing. The exact same
    features are available in older releases of Unity, just with a slightly different
    API through the `Application` class.


    Exploiting this feature would require a system that either constantly checks the
    player''s position in the level until they get close or uses Trigger Volumes to
    broadcast a message that the player is nearing the next section and begin asynchronous
    loading at the appropriate time. Another important consideration is that the Scene''s
    contents won''t immediately appear since asynchronous loading effectively spreads
    the loading out over a handful of frames in order to cause as little visible impact
    as possible. We need to make sure that we trigger asynchronous Scene loading with
    more than enough time to spare so that the player won''t see objects popping into
    the game.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Scenes can also be unloaded to clear them out of memory. This will save some
    memory or runtime performance in the form of removing any Components making use
    of `Update()` that we no longer need. Again, this can be done both synchronously
    and asynchronously with `SceneManager.UnloadScene()` and `SceneManager.UnloadSceneAsync()`.
    This can be an enormous performance benefit because we''re only using what we
    need due to the player''s location in the level, but note that it is not possible
    to unload small chunks of a monolithic Scene. If the original Scene file was enormous,
    then unloading it would unload everything. The original Scene would have to be
    broken up into smaller scenes and then loaded and unloaded as needed. Similarly,
    we should only begin to unload a Scene if we''re certain the player can no longer
    see its constituent objects, otherwise they would witness objects disappearing
    out of nowhere. One last consideration is that Scene unloading would trigger the
    destruction of many objects, which is likely to free up a lot of memory and trigger
    the garbage collector. An efficient use of memory is also important when making
    use of this tip.


    This approach would require a significant amount of Scene redesign work, script
    writing, testing, and debugging, which is not to be underestimated, but the benefits
    of improving user experience are exceptional. Having seamless transitions between
    areas in a game is a benefit that is often praised by players and critics, because
    it doesn''t take the player out of the action. If we use it appropriately, it
    can save a significant amount of runtime performance, improving the user experience
    further.


    # # Create a custom Update() layer


    Earlier in this chapter, in the _Update, Coroutines and InvokeRepeating_ section,
    we discussed the relative pros and cons of using these Unity Engine features as
    a means of avoiding excessive CPU workload during most of our frames. Regardless
    of which of these approaches we might adopt, there is an additional risk of having
    lots of `MonoBehaviours` written to periodically call some function, which is
    having too many methods triggering in the same frame simultaneously.


    Imagine thousands of `MonoBehaviours` that initialized together at the start of
    a Scene, each starting a Coroutine at the same time that will process their AI
    tasks every 500 milliseconds. It is highly likely that they would all trigger
    within the same frame, causing a huge spike in its CPU usage for a moment, which
    settles down temporarily and then spikes again a few moments later when the next
    round of AI processing is due. Ideally, we would want to spread these invocations
    out over time.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'The following are the possible solutions to this problem:


    • Generating a random time to wait each time the timer expires or Coroutine triggers

    • Spread out Coroutine initialization so that only a handful of them are started
    at each frame

    • Pass the responsibility of calling updates to some God Class that places a limit
    on the number of invocations that occur each frame


    The first two options are appealing since they’re relatively simple and we know
    that Coroutines can potentially save us a lot of unnecessary overhead. However,
    as we discussed, there are many dangers and unexpected side effects associated
    with such drastic design changes.


    A potentially better approach to optimize updates is to not use `Update()` at
    all, or more accurately, to use it only once. When Unity calls `Update()`, and
    in fact, any of its callbacks, it crosses the aforementioned Native-Managed Bridge,
    which can be a costly task. In other words, the processing cost of executing 1,000
    separate `Update()` callbacks will be more expensive than executing one `Update()`
    callback, which calls into 1,000 regular functions. As we witnessed in the _Remove
    empty callback definitions_ section, calling `Update()` thousands of times is
    not a trivial amount of work for the CPU to undertake, primarily because of the
    Bridge. We can, therefore, minimize how often Unity needs to cross the Bridge
    by having a God Class `MonoBehaviour` use its own `Update()` callback to call
    our own custom update-style system used by our custom Components.


    In fact, many Unity developers prefer implementing this design right from the
    start of their projects, as it gives them finer control over when and how updates
    propagate throughout the system; this can be used for things such as menu pausing,
    cool time manipulation effects, or prioritizing important tasks and/or suspending
    low priority tasks if we detect that we’re about to reach our CPU budget for the
    current frame.


    All objects wanting to integrate with such a system must have a common entry point.
    We can achieve this through an Interface Class with the `interface` keyword. Interface
    Classes essentially set up a contract whereby any class that implements the Interface
    Class Class must provide a specific series of methods. In other words, if we know
    the object implements an Interface Class, then we can be certain about what methods
    are available. In C#, classes can only derive from a single base class, but they
    can implement any number of Interface Classes (this avoids the _deadly diamond
    of death_ problem that C++ programmers will be familiar with).'
  merge: -1
  img_proc: true
- pgno: 118
  md: "The following Interface Class definition will suffice, which only requires\
    \ the implementing\nclass to define a single method called OnUpdate():\n\n```\n\
    public interface IUpdateable {\n    void OnUpdate(float dt);\n}\n```\n\nIt's common\
    \ practice to start an Interface Class definition with a capital 'I'\nto make\
    \ it clear that it is an Interface Class we're dealing with. The beauty\nof Interface\
    \ Classes is that they improve the decoupling of our codebase,\nallowing huge\
    \ subsystems to be replaced, and as long as the Interface\nClass is adhered to,\
    \ we will have greater confidence that it will continue to\nfunction as intended.\n\
    \n![](img/da79484c9b30dc915216dbc5454a9bbf_118_0.png)\n\nNext, we'll define a\
    \ custom MonoBehaviour type which implements this Interface Class:\n\n```\npublic\
    \ class UpdateableComponent : MonoBehaviour, IUpdateable {\n    public virtual\
    \ void OnUpdate(float dt) {}\n}\n```\n\nNote that we're naming the method OnUpdate()\
    \ rather than Update(). We're defining a\ncustom version of the same concept,\
    \ but we want to avoid name collisions with the built-\nin Update() callback.\n\
    \nThe OnUpdate() method of the UpdateableComponent class retrieves the current\
    \ delta\ntime (dt), which spares us from a bunch of unnecessary Time.deltaTime\
    \ calls, which are\ncommonly used in Update() callbacks. We've also made the function\
    \ virtual to allow\nderived classes to customize it.\n\nThis function will never\
    \ be called as it's currently being written. Unity automatically grabs\nand invokes\
    \ methods defined with the Update() name, but has no concept of\nour OnUpdate()\
    \ function, so we will need to implement something that will call this\nmethod\
    \ when the time is appropriate. For example, some kind of GameLogic God Class\n\
    could be used for this purpose.\n\nDuring the initialization of this Component,\
    \ we should do something to notify our\nGameLogic object of both its existence\
    \ and its destruction so that it knows when to start and\nstop calling its OnUpdate()\
    \ function.\n\nIn the following example, we will assume that our GameLogic class\
    \ is a\nSingletonComponent, as defined earlier in the Singleton Components section,\
    \ and has\nappropriate static functions defined for registration and deregistration.\
    \ Bear in mind that\nit could just as easily use the aforementioned MessagingSystem\
    \ to notify the GameLogic\nof its creation/destruction."
  merge: -1
  img_proc: true
- pgno: 119
  md: "For MonoBehaviours to hook into this system, the most appropriate place is\
    \ within\ntheir Start() and OnDestroy() callbacks:\n\n```\nvoid Start() {\n\t\
    GameLogic.Instance.RegisterUpdateableObject(this);\n}\n```\n\n```\nvoid OnDestroy()\
    \ {\n\tif (GameLogic.Instance.IsAlive) {\n\t\tGameLogic.Instance.DeregisterUpdateableObject(this);\n\
    \t}\n}\n```\n\nIt is best to use the Start() method for the task of registration,\
    \ since using Start() means\nthat we can be certain all other pre-existing Components\
    \ will have at least had\ntheir Awake() methods called prior to this moment. This\
    \ way, any critical initialization\nwork will have already been done on the object\
    \ before we start invoking updates on it.\n\nNote that because we're using Start()\
    \ in a MonoBehaviour base class, if we define\na Start() method in a derived class,\
    \ it will effectively override the base class definition,\nand Unity will grab\
    \ the derived Start() method as a callback instead. It would, therefore,\nbe wise\
    \ to implement a virtual Initialize() method so that derived classes can override\n\
    it to customize initialization behavior without interfering with the base class's\
    \ task of\nnotifying the GameLogic object of our Component's existence.\n\nThe\
    \ following code provides an example of how we might implement a virtual\nInitialize()\
    \ method.\n\n```\nvoid Start() {\n\tGameLogic.Instance.RegisterUpdateableObject(this);\n\
    \tInitialize();\n}\nprotected virtual void Initialize() {\n\t// derived classes\
    \ should override this method for initialization code,\n\tand NOT reimplement\
    \ Start()\n}\n```\n\nFinally, we will need to implement the GameLogic class. The\
    \ implementation is effectively\nthe same whether it is a SingletonComponent or\
    \ a MonoBehaviour, and whether or not it\nuses the MessagingSystem. Either way,\
    \ our UpdateableComponent class must register\nand deregister as IUpdateable objects,\
    \ and the GameLogic class must use its\nown Update() callback to iterate through\
    \ every registered object and call\ntheir OnUpdate() function."
  merge: -1
  img_proc: true
- pgno: 120
  md: "# Here is the definition for our GameLogic class:\n\n```\npublic class GameLogicSingletonComponent\
    \ :\n    SingletonComponent<GameLogicSingletonComponent> {\n    public static\
    \ GameLogicSingletonComponent Instance {\n        get { return (GameLogicSingletonComponent)_Instance;\
    \ }\n        set { _Instance = value; }\n    }\n\n    List<IUpdateable> _updateableObjects\
    \ = new List<IUpdateable>();\n\n    public void RegisterUpdateableObject(IUpdateable\
    \ obj) {\n        if (!_updateableObjects.Contains(obj)) {\n            _updateableObjects.Add(obj);\n\
    \        }\n    }\n\n    public void DeregisterUpdateableObject(IUpdateable obj)\
    \ {\n        if (_updateableObjects.Contains(obj)) {\n            _updateableObjects.Remove(obj);\n\
    \        }\n    }\n\n    void Update()\n    {\n        float dt = Time.deltaTime;\n\
    \        for (int i = 0; i < _updateableObjects.Count; ++i) {\n            _updateableObjects[i].OnUpdate(dt);\n\
    \        }\n    }\n}\n```\n\nIf we make sure that all of our custom Components\
    \ inherit from the\nUpdateableComponent class, then we’ve effectively replaced\
    \ N invocations of\nthe Update() callback with just one Update() callback, plus\
    \ N virtual function calls. This\ncan save us a large amount of performance overhead\
    \ because even though we’re calling\nvirtual functions (which cost a small overhead\
    \ more than a non-virtual function call because\nit needs to redirect the call\
    \ to the correct place), we’re still keeping the overwhelming\nmajority of update\
    \ behavior inside our Managed code and avoiding the Native-Managed\nBridge as\
    \ much as possible. This class can even be expanded to provide priority systems,\
    \ to\nskip low-priority tasks if it detects that the current frame has taken too\
    \ long, and many\nother possibilities."
  merge: -1
  img_proc: true
