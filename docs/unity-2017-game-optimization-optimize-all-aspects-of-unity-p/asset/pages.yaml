- pgno: 100
  md: "# # Message queuing and processing\n\nIn order to process messages, our Messaging\
    \ System should maintain a queue of incoming message objects so that we can process\
    \ them in the order they were broadcast:\n\n```\nprivate Queue<Message> _messageQueue\
    \ = new Queue<Message>();\npublic bool QueueMessage(Message msg) {\n    if (!listenerDict.ContainsKey(msg.type))\
    \ {\n        return false;\n    }\n    _messageQueue.Enqueue(msg);\n    return\
    \ true;\n}\n```\n\nThe QueueMessage() method simply checks whether the given message\
    \ type is present in our dictionary before adding it to the queue. This effectively\
    \ tests whether or not an object actually cares to listen to the message before\
    \ we queue it to be processed later. We have introduced a new private field, _messageQueue,\
    \ for this purpose.\n\nNext, we'll add a definition for Update(). This callback\
    \ will be called regularly by the Unity Engine. Its purpose is to iterate through\
    \ the current contents of the message queue, one message a time, verify whether\
    \ or not too much time has passed since we began processing, and if not, pass\
    \ them along to the next stage in the process:\n\n```\nprivate const int _maxQueueProcessingTime\
    \ = 16667;\nprivate System.Diagnostics.Stopwatch timer = new\nSystem.Diagnostics.Stopwatch();\n\
    void Update() {\n    timer.Start();\n    while (_messageQueue.Count > 0) {\n \
    \       if (_maxQueueProcessingTime > 0.0f) {\n            if (timer.Elapsed.Milliseconds\
    \ > _maxQueueProcessingTime) {\n                timer.Stop();\n              \
    \  return;\n            }\n        }\n        Message msg = _messageQueue.Dequeue();\n\
    \        if (!TriggerMessage(msg)) {\n            Debug.Log(\"Error when processing\
    \ message: \" + msg.type);\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 101
  md: "The time-based safeguard is in place to make sure that it does not exceed a\
    \ processing time limit threshold. This prevents the Messaging System from freezing\
    \ our game if too many messages get pushed through the system too quickly. If\
    \ the total time limit is exceeded, then all message processing will stop, leaving\
    \ any remaining messages to be processed during the next frame.\n\nNote that we\
    \ use the full namespace when creating the `Stopwatch` object. We could have added\
    \ `using System.Diagnostics`, but this would lead to a namespace conflict between\
    \ `System.Diagnostics.Debug` and `UnityEngine.Debug`. Omitting it allows us to\
    \ continue to call Unity's debug logger with `Debug.Log()`, without having to\
    \ explicitly call `UnityEngine.Debug.Log()` each time.\n\nLastly, we will need\
    \ to define the `TriggerMessage()` method, which distributes messages to listeners:\n\
    \n```\n```\npublic bool TriggerMessage(Message msg) {\n    string msgType = msg.type;\n\
    \    if (!listenerDict.ContainsKey(msgType)) {\n        Debug.Log(\"MessagingSystem:\
    \ Message \\\\\"\" + msgType + \"\\\\\" has no listeners!\");\n        return\
    \ false; // no listeners for message so ignore it\n    }\n\n    List<MessageHandlerDelegate>\
    \ listenerList = _listenerDict[msgType];\n    for(int i = 0; i < listenerList.Count;\
    \ ++i) {\n        if (listenerList[i](msg))\n            return true; // message\
    \ consumed by the delegate\n    }\n    return true;\n}\n```\n```\n\nThe preceding\
    \ method is the main workhorse behind the Messaging System. The `TriggerEvent()`\
    \ method's purpose is to obtain the list of listeners for the given message type\
    \ and give each of them an opportunity to process it. If one of the delegates\
    \ returns `true`, then processing of the current message ceases and the method\
    \ exits, allowing the `Update()` method to process the next message."
  merge: -1
  img_proc: true
- pgno: 102
  md: "Normally, we would want to use `QueueEvent()` to broadcast messages, but we\
    \ also\nprovide direct access to `TriggerEvent()` as an alternative. Using `TriggerEvent()`\n\
    directly allows message senders to force their messages to be processed immediately\n\
    without waiting for the next `Update()` event. This bypasses the throttling mechanism,\n\
    which might be necessary for messages that need to be sent during critical moments\
    \ of\ngameplay, where waiting an additional frame might result in a strange-looking\
    \ behavior.\n\nFor example, if we intend for two objects to be destroyed and create\
    \ a Particle Effect the\nmoment they collide with one another, and this work is\
    \ handled by another subsystem\nhence an event needs to be sent for it), then\
    \ we would want to send the message via\n`TriggerEvent()` to prevent the objects\
    \ from continuing to exist for one frame before the\nevent is handled. Conversely,\
    \ if we wanted to do something less frame-critical, such as\ncreate a pop-up message\
    \ when the player walks into a new area, we could safely use a\n`QueueEvent()`\
    \ call to handle it.\n\nTry to avoid habitually using `TriggerEvent()` for all\
    \ events, as we could end up handling\ntoo many calls simultaneously in the same\
    \ frame, causing a sudden drop in frame rate.\nDecide which events are frame-critical,\
    \ and which are not, and use the `QueueEvent()` and\n`TriggerEvent()` methods\
    \ appropriately.\n\n# # Implementing custom messages\n\nWe've created the Messaging\
    \ System, but an example of how to use it would help us wrap\nour heads around\
    \ the concept. Let's start by defining a pair of simple classes that derive\n\
    from `Message`, which we can use to create a new enemy, as well as notify other\
    \ parts of our\ncodebase that an enemy was created:\n\n```\n```\npublic class\
    \ CreateEnemyMessage : Message {}\npublic class EnemyCreatedMessage : Message\
    \ {\n    public readonly GameObject enemyObject;\n    public readonly string enemyName;\n\
    \    public EnemyCreatedMessage(GameObject enemyObject, string enemyName) {\n\
    \        this.enemyObject = enemyObject;\n        this.enemyName = enemyName;\n\
    \    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "CreateEnemyMessage is the simplest form of message that contains no special\
    \ data, while\nEnemyCreatedMessage will contain a reference to the enemy’s GameObject\
    \ as well as its\nname. Good practice for message objects is to make their member\
    \ variables not\nonly public, but also readonly. This ensures that the data is\
    \ easily accessible but cannot\nbe changed after the object’s construction. This\
    \ safeguards the content of our messages\nagainst being altered, as they’re passed\
    \ between one listener and another.\n\n# # Message sending\n\nTo send one of these\
    \ message objects, we simply need to call either QueueEvent() or\nTriggerEvent()\
    \ and pass it an instance of the message we wish to send. The following\ncode\
    \ demonstrates how we would broadcast a CreateEnemyMessage object when the\nSpace\
    \ Bar is pressed:\n\n```\npublic class EnemyCreatorComponent : MonoBehaviour {\n\
    \    void Update() {\n        if (Input.GetKeyDown(KeyCode.Space)) {\n       \
    \     MessagingSystem.Instance.QueueMessage(new CreateEnemyMessage());\n     \
    \   }\n    }\n}\n```\n\nIf we were to test this code right now, nothing would\
    \ happen, because even though we are\nsending a message through the Messaging\
    \ System, there are no listeners for this message\ntype. Let's cover how to register\
    \ listeners with the Messaging System.\n\n# # Message registration\n\nThe following\
    \ code contains a pair of simple classes that register with the Messaging\nSystem,\
    \ each requesting to have one of their methods called whenever certain types of\n\
    messages have been broadcast from anywhere in our codebase:\n\n```\npublic class\
    \ EnemyManagerWithMessagesComponent : MonoBehaviour {\n    private List<GameObject>\
    \ _enemies = new List<GameObject>();\n    [SerializeField] private GameObject\
    \ _enemyPrefab;\n\n    void Start() {\n        MessagingSystem.Instance.AttachListener(typeof(CreateEnemyMessage),\n\
    \        this.HandleCreateEnemy);\n    }\n\n    bool HandleCreateEnemy(Message\
    \ msg) {\n        CreateEnemyMessage castMsg = msg as CreateEnemyMessage;\n  \
    \  }\n}\n```"
