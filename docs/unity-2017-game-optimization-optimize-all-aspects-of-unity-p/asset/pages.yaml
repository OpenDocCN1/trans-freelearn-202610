  md: '# # WebGL optimizations


    Unity Technologies have also released a number of blog posts covering WebGL

    applications, which includes some crucial information about memory management
    that all

    WebGL developers should know. These can be found at the following links:


    +   • https://blogs.unity3d.com/2016/09/20/understanding-memory-in-unity-

    +   webgl/

    +   • https://blogs.unity3d.com/2016/12/05/unity-webgl-memory-the-unity-

    +   heap/


    # # The future of Unity, Mono, and IL2CPP


    When the first edition of this book was written, IL2CPP was being teased in a
    variety of

    blog posts, and Unity was still running a very old version of Mono. Well, the
    good news is

    that IL2CPP has finally landed, but the bad news is Unity is still running a very
    old version

    of Mono. This is an unfortunate consequence of how various elements of the Mono

    Framework are licensed, meaning that Unity Technologies has only been able to
    update

    Mono on an infrequent basis.


    After many years, Unity is still only able to make use of the .NET 3.5 library

    functionality, which is about a decade old at this point. This limits what kinds
    of .NET

    library classes we can use, restricts certain C# language features, and limits
    performance

    since many enhancements would have been made to the library during this time.
    However,

    to the great relief of many Unity developers, an experimental upgrade to a more
    recent

    version of Mono has been in beta for a while and is now available in Unity 2017
    by

    switching the Edit | Project Settings | Player | Configuration | Scripting Runtime

    Version option to Experimental (.NET 4.6 Equivalent). This setting upgrades the
    Mono

    runtime and allows us to make use of the .NET 4.6 functionality, which is only
    a couple of

    years old at the time of writing.


    This feature is still experimental, however. This could lead to obscure bugs and
    crashes

    until it''s been deemed stable. At which point, the Mono upgrade will become permanent
    so

    that all users can enjoy it. For the time-being, we should only use this option
    if we need it

    for a vital bug fix or feature that we cannot work around. Also, there is never
    a guarantee

    that the version fixing your bug isn''t going to introduce an even worse bug.
    However, at the

    very least, hope is on the horizon that Unity is serious about making the upgrade
    happen

    sooner rather than later, as there are regular bug fixes around this area each
    update.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'Meanwhile, Unity''s rollout of IL2CPP has been rapid and impressive. It currently
    supports a large set of modern platforms and offers some decent performance improvements.
    Of course, again, it is slightly unstable, and we are likely to find bugs if we
    use the latest and greatest beta versions of Unity.


    Where things will go from here is pretty predictable; since Unity is reliant on
    IL2CPP for certain platforms, and others gain benefit from it, IL2CPP will continue
    to gain more support, more fixes, and offer more performance improvements with
    each passing release, and the Mono upgrade will finally land at some point in
    the future.


    Due to the advancement of time and technology, some features of Unity have become
    deprecated. A few examples that have been mentioned during this book include Animators
    (at least when used with UI elements), the Sprite Packer tool, and the UnityScript
    and Boo languages (which aren''t completely gone yet, but it would be wise to
    start learning C# scripting sooner rather than later). Other features are also
    planned to be dropped. The most imminent among which is dropping of all support
    for DirectX 9 for Windows in Unity 2017.3 (check out `https://blogs.unity3d.com/2017/07/10/deprecating-directx-9/`
    for more information). We can expect further deprecated features as development
    of Unity 2017 progresses.


    Of course, there are a lot of new features as well. The bulk of the features new
    in Unity 2017 primarily focus on helper utilities such as Timeline, Cinemachine,
    the Post-Processing stack, Collaborate, and built-in Analytics. These tools are
    helpful to game developers, but also make Unity a little more approachable to
    creatives among nongaming industries, so it''s a safe bet that Unity Technologies
    is trying to entice a broader audience, so we can expect more on that front. Of
    course, game developers are still reaping the benefits of Unity Technologies''
    hard work. Since the first edition of this book around 2 years ago, Unity Technologies
    have released a whole new User Interface system (including the acquisition of
    Text Mesh Pro); the Progressive Lightmapper along with Global Illumination, Vulkan,
    and Metal support; huge improvements to the WebGL platform, 2D games, Particle
    Systems, Physics (both 3D and 2D), and Video playback; and, of course, a massive
    amount of support for the XR platforms and the more popular HMDs and their controllers.


    Naturally, there is even more to come in the form of feature improvements (Particles,
    Animation, and 2D), expanded APIs (Physics and Networking), performance enhancements,
    platform support (WebVR, 360 Video playback, and Apple Watch), so ensure that
    you check out the Unity Road Map for an idea of what Unity Technologies are working
    on and when we can expect them to become available at `https://unity3d.com/ unity/roadmap`.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# # The upcoming C# Job System


    A huge performance-enhancing feature that Unity Technologies have been teasing
    for a

    while is a feature dubbed as the C# Job System. The feature is still in active
    development and

    has not yet made it to any release versions of Unity, but it would be wise to
    start becoming

    familiar with it sooner rather than later, as it will introduce huge changes to
    how Unity

    developers will be writing high-performance code. It is plausible that the difference
    in

    quality of a game that uses this system well, versus one that doesn’t, might become
    very

    noticeable, which may cause some fragmentation of the Unity development community.
    It

    is in our best interests to understand and exploit the benefits of the new Job
    System so that

    our application will have the most potential for success.


    The idea of the C# Job System is to be able to create simple tasks that run in
    background

    threads to offload work from the main thread. The C# Job System will be ideal
    for tasks that

    are embarrassingly parallel such as having hundreds of thousands of simple AI
    agents

    operating in a Scene simultaneously and really any problem that can be boiled
    down to

    thousands of small, independent operations. Of course, it can also be used for
    typical

    multithreading behavior as well, where we perform some calculations in the background

    that are not needed immediately. The Job System also introduces some compiler
    technology

    improvements to get an even greater performance boost than just moving the tasks
    to

    separate threads.


    A big problem with writing multithreaded code is the risk of race conditions,
    deadlock, and

    bugs that are notoriously difficult to reproduce and debug. The C# Job System
    aims to make

    this task easier than usual (but by no means trivial). One of Unity’s founders,
    Joachim Ante,

    gave a presentation on the upcoming C# Job System at Unite Europe 2017 which gives
    a

    preview of the C# Job System and takes us through the ways in which how we think
    about

    programming Unity code will need to change. Of course, this won’t apply to all
    code we

    write, but it should be treated as a valuable tool where it can deployed for huge

    performance improvements if we understand how it works and are able to identify
    sensible

    situations in which it would help.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# # Summary


    We''ve covered a humongous amount of theory and language concepts in this chapter,

    which have hopefully shed some light on how the internals of the Unity Engine
    and C#

    language work. These tools try their best to spare us from the burden of complex
    memory

    management, but there is still a whole host of concerns we need to keep in mind
    as we

    develop our game. Between the compilation processes, multiple Memory Domains,
    the

    complexities of Value types versus Reference types, passing by value versus passing
    by

    reference, boxing, Object Pooling, and various quirks within the Unity API, you
    have a lot

    of things to worry about. However, with enough practice, you will learn to overcome
    them

    without needing to keep referring to giant tomes such as this!


    This chapter effectively concludes all of the techniques we can bestow that explicitly
    aim to

    improve application performance. However, optimizing your workflow is also enormously

    beneficial. As mentioned previously, the one constant cost of performance optimization

    work is development time. However, if you can speed up our development working,

    saving some time during the more tedious parts of the job, then hopefully you
    can save

    enough time to actually implement as many optimization techniques we''ve talked
    about

    through this entire book as you can. There are a lot of neat little nuances to
    the Unity Engine

    that aren''t well known or clearly documented and that only become apparent through

    experience with the Engine or by involving ourselves in it''s community. As such,
    the next

    chapter will be full of hints and tips for improving how to manage your project
    and Scenes

    more effectively and how to make the most of the Unity Editor.


    _Race conditions_ are where two or more calculations are racing toward

    completion, but actual outcome depends on the order in which they finish.

    Imagine one thread trying to add 3 to a number, whereas another thread

    multiplies it by 4. The result will be different, depending on which

    operation happens first. _Deadlock_ is a problem where two or more threads

    are competing for shared resources, where each needs the full resource

    collection to complete its task, but each has reserved a separate small

    portion of resources and refuses to relinquish control of them to another

    thread, in which case, none of the threads can get any work done because

    neither has the complete set it needs.


    The presentation can be found at `https://www.youtube.com/watch?v=AXUvnk7Jws4`.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_338_0.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# # Tactical Tips and Tricks


    Software engineers are an optimistic bunch, and as such, we often underestimate
    the amount of work it takes to fully implement new features or make changes to
    an existing codebase. A common mistake is to only consider how long it will take
    to write the code required to create that feature. In which case, we are forgetting
    to include the time it takes for several important tasks. We often need to spend
    time refactoring other subsystems to support the changes we’re making. This can
    happen either because we didn’t think it would be necessary at the time, or because
    we thought of a better way to implement it halfway- through which can quickly
    turn into a rabbit-hole dive of redesign and refactoring if we don’t plan sufficiently
    far ahead. We should also consider the time needed for testing and documentation.
    Even if a QA team will do a testing pass against the change after it has been
    implemented, we still need to run through some scenarios on our own system during
    implementation in order to ensure that the change actually does what’s intended.


    The one constant cost included in all performance optimization work is time. So,
    with limited time at our disposal to both implement the features we want to implement
    and keep everything working, an important skill to learn for any developer is
    workflow optimization. Better understanding of the tools we use will save us more
    time in the long run, and hopefully provide the extra time we need to implement
    everything we want to, which applies not only to the Unity Engine, but to every
    tool we use--IDEs, build systems, analytics systems, social media platforms, app
    stores, and so on.


    There are a lot of little nuances to using the Unity Engine that can help improve
    our project workflow. However, quite a lot of the Editor’s functionality is not
    well documented, well known, or just not something we think about until after
    quite some time--we realize the fact that it could have been applied perfectly
    to solve a particular problem we were having 6 months ago.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# # Editor hotkey tips


    The Editor is rife with hotkeys that can aid rapid development, and it''s worth
    checking out the documentation. However, let''s be honest--nobody reads the manual
    until they need something specific from it, and so here are some of the most useful,
    yet lesser-known hotkeys available when playing with the Unity Editor.


    # # GameObjects


    `GameObjects` can be duplicated by selecting them in the **Hierarchy** window
    and pressing `Ctrl + D` (`Command + D`). New, empty `GameObjects` can be created
    using `Ctrl + Shift + N` (`Command + Shift + N`).


    # # Tactical Tips and Tricks


    # # Chapter 9


    The Internet is crammed full of blogs, tweets, and forum posts that try to help
    other Unity developers learn about these useful features, but they only tend to
    focus on a handful of tips at a time. There don''t seem to be any online resources
    that group together many of them in one place. As a result, the Internet browsers
    of intermediate and advanced Unity developers are probably bursting at the seams
    with links to these tips that we bookmark for later and then completely forget
    about.


    So, because this book is primarily for such users, I felt like it was worth including
    a short chapter to pool together many of these tips and tricks in one location.
    This chapter serves as a reference list in the hope of saving us time during future
    development effort.


    In this chapter, we''ll cover tips and tricks for the following areas:


    +   - Convenient Editor hotkeys

    +   - Better and faster ways to use the Unity Editor UI

    +   - Ways to speed up or simplify our scripting practices

    +   - Other tips that involve using external tools outside of Unity


    ![](img/da79484c9b30dc915216dbc5454a9bbf_340_0.png)


    In all cases, the Windows hotkey is listed. If the MacOS hotkey requires a different
    set of keystrokes, then it will be shown in parentheses.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Press Ctrl + Shift + A (Command + Shift + A) to quickly open the **Add Component**
    menu.

    From there, you can type in the name of the Component you wish to add.


    # # Scene window


    Pressing _Shift + F_ or double-tapping the _F_ key will follow an object in the
    **Scene**

    window (assuming that the **Scene** window is open and visible), which can be
    helpful for

    tracking high-velocity objects or figuring out why objects might be falling out
    of our Scene.


    Holding _Alt_ and left-click dragging with the mouse in the **Scene** window will
    make the

    **Scene** window Camera orbit the currently selected object (as opposed to looking
    around it).

    Holding _Alt_ and right-click dragging with the mouse in the **Scene** window
    will zoom the

    Camera in/out (_Alt + Ctrl_ + left-drag).


    Holding _Ctrl_ and left-click dragging will cause the selected object to snap
    to the grid as it

    moves. The same can be done for rotation by holding _Ctrl_ as we adjust the rotation
    widgets

    around the object. Selecting **Edit | Snap Settings...** opens a window where
    we can edit the

    grid that objects snap to on a per-axis basis.


    We can force objects to snap to each other through their vertices by holding the
    _V_ key as we

    move an object around in the **Scene** window. By doing so, the selected object
    will

    automatically snap its vertices to the nearest vertex, of the nearest object to
    the mouse

    cursor. This is very useful for aligning Scene pieces into place, such as floors,
    walls,

    platforms, and other tile-based systems, without needing to make small manual
    position

    adjustments.


    # # Arrays


    We can duplicate array elements that have been exposed in the **Inspector** window
    by

    selecting them and pressing _Ctrl + D_ (_Command + D_). This will copy the element
    and insert it

    into the array immediately after the current selection.


    We can remove entries from an array of references (for example, an array of `GameObjects`)

    by pressing _Shift + Delete_ (_Command + Delete_). This will strip away the element
    and condense

    the array. Note that the first press will clear the reference, setting it to `null`,
    but the second

    press will remove the element. Removing elements in arrays of primitive types
    (_int_, `float`,

    and so forth) can be accomplished by simply pressing _Delete_ without the _Shift_
    key

    (_Command_) modifier held down.'
  merge: -1
  img_proc: true
- pgno: 342
