    \    }\n\n    int i = Random.Range(0, list.Count);\n    PrefabPoolingSystem.Despawn(list[i]);\n\
    \    list.RemoveAt(i);\n}\n```\n\nOnce we spawn more than five instances of any\
    \ of the Prefabs, it will need to instantiate a new one in memory, costing us\
    \ some memory allocation. However, if we observe the **Memory Area** in the **Profiler**\
    \ window, while we only spawn and despawn instances that already exist, then we\
    \ will notice that absolutely no new allocations take place.\n\n# # Prefab Pooling\
    \ and Scene loading\n\nThere is one important caveat to this system that has not\
    \ yet been mentioned: the `PrefabPoolingSystem` class will outlast Scene lifetime\
    \ since it is a Static Class. This means that when a new Scene is loaded, the\
    \ Pooling System's dictionaries will attempt to maintain references to any pooled\
    \ instances from the previous Scene, but Unity forcibly destroys these objects\
    \ regardless of the fact that we are still keeping references to them (unless\
    \ they were set to `DontDestroyOnLoad()`), and so the dictionaries will be full\
    \ of `null` references. This would cause some serious problems for the next Scene.\n\
    \nWe should, therefore, create a method in `PrefabPoolingSystem` that resets the\
    \ Pooling System in preparation for this likely event. The following method should\
    \ be called before a new Scene is loaded so that it is ready for any early calls\
    \ to `Prespawn()` in the next Scene:\n\n```\npublic static void Reset() {\n  \
    \  _prefabToPoolMap.Clear();\n    _goToPoolMap.Clear();\n}\n```"
