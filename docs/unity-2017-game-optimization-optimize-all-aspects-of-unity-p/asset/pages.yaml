  md: "```\n_enemies.Clear();\n}\n}\n```\n\nWe would then place a `GameObject` in\
    \ our Scene containing this Component, and name it\n`EnemyManager`.\n\nThe following\
    \ example method attempts to instantiate a number of enemies from a given\nPrefab,\
    \ and then notifies the `EnemyManager` object of their existence:\n\n```\npublic\
    \ void CreateEnemies(int numEnemies) {\n    for(int i = 0; i < numEnemies; ++i)\
    \ {\n        GameObject enemy = (GameObject) GameObject.Instantiate(_enemyPrefab,\n\
    \            5.0f * Random.insideUnitSphere,\n            Quaternion.identity);\n\
    \        string[] names = { \"Tom\", \"Dick\", \"Harry\" };\n        enemy.name\
    \ = names[Random.Range(0, names.Length)];\n        GameObject enemyManagerObj\
    \ = GameObject.Find(\"EnemyManager\");\n        enemyManagerObj.SendMessage(\"\
    AddEnemy\",\n            enemy,\n            SendMessageOptions.DontRequireReceiver);\n\
    \    }\n}\n```\n\nInitializing data and putting method calls inside any kind of\
    \ loop, which always output to\nthe same result, is a big red flag for poor performance,\
    \ and when we’re dealing with\nexpensive methods, such as `Find()`, we should\
    \ always look for ways to call them as few\ntimes as possible. Ergo, one improvement\
    \ we can make is to move the `Find()` call outside\nof the `for`-loop and cache\
    \ the result in a local variable so that we don’t need to keep\nreacquiring the\
    \ `EnemyManager` object over and over again.\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_84_0.png)\n\
    \nMoving the initialization of the `names` variable outside of the `for`-loop\
    \ is\nnot necessarily critical, since the Compiler is often smart enough to realize\n\
    it doesn’t need to keep reinitializing data that isn’t being changed\nelsewhere.\
    \ However, it does often make code easier to read.\n\nAnother big improvement\
    \ we can implement, is to optimize our usage of the\n`SendMessage()` method by\
    \ replacing it with a `GetComponent()` call. This replaces a very\ncostly method\
    \ with an equivalent and much cheaper alternative."
