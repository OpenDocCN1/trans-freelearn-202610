- pgno: 105
  md: 'Note how the HandleEnemyCreated() method definition matches the function signature
    of MessageHandlerDelegate (that is, it has the same return type and argument list),
    and that it is being referenced in the AttachListener() call. This is how we tell
    the Messaging System what method to call when the given message type is broadcast,
    and how delegates ensure type-safety. If the function signature had a different
    return value or a different list of arguments, then it would be an invalid delegate
    for the AttachListener() method, and we would get compiler errors. Also, note
    that HandleEnemyCreated() is also a private method, and yet our MessagingSystem
    class is able to call it. This is a useful feature of delegates in that we can
    allow only systems we give permission to call this message handler. Exposing the
    method publicly might lead to some confusion in our code''s API, and developers
    may think that they''re meant to call the method directly, which is not its intended
    use.


    The beautiful part is that we''re free to give the delegate method whatever name
    we want. The most sensible approach is to name the method after the message which
    it handles. This makes it clear to anyone reading our code what the method is
    used for and what message object type must be sent in order to call it. This makes
    future parsing and debugging of our code much more straight-forward since we can
    follow the chain of events by the matching names of the messages and their handler
    delegates.


    During the HandleCreateEnemy() method, we also queue another event, which broadcasts
    an EnemyCreatedMessage instead. The second class, EnemyCreatedListenerComponent
    registers to receive these messages, and then prints out a message containing
    that information. This is how we would implement a way for subsystems to notify
    other subsystems of changes. In a real application, we might register a UI system
    to listen for these types of messages, and update a counter on the screen to show
    how many enemies are now active. In this case, the enemy management and UI systems
    are appropriately decoupled such that neither needs to know any specific information
    about how the other operates in order to do their assigned tasks.


    If we now add the EnemyManagerWithMessagesComponent, EnemyCreatorComponent and
    EnemyCreatedListenerComponent to our Scene, and press the Space Bar several times,
    we should see log messages appear in the Console window, informing us of a successful
    test:'
