- pgno: 63
  md: "# # Obtain Components using the fastest method\n\nThere are several variations\
    \ of the `GetComponent()` method, and they each have a different performance cost,\
    \ so it becomes prudent to call the fastest possible version of this method. The\
    \ three overloads available are `GetComponent(string)`, `GetComponent<T>()`, and\
    \ `GetComponent(typeof(T))`. It turns out that the fastest version depends on\
    \ which version of Unity we are running since several optimizations have been\
    \ made to these methods through the years; however, in all later versions of Unity\
    \ 5 and the initial release of Unity 2017, it is best to use the `GetComponent<T>()`\
    \ variant.\n\nLet's prove this with some simple testing:\n\n```\n```\nint numTests\
    \ = 1000000;\nTestComponent test;\nusing (new CustomTimer(\"GetComponent(string)\"\
    , numTests)) {\n for (var i = 0; i < numTests; ++i) {\n test = (TestComponent)GetComponent(\"\
    TestComponent\");\n }\n}\nusing (new CustomTimer(\"GetComponent<ComponentName>\"\
    , numTests)) {\n for (var i = 0; i < numTests; ++i) {\n test = GetComponent<TestComponent>();\n\
    \ }\n}\nusing (new CustomTimer(\"GetComponent(typeof(ComponentName))\", numTests))\
    \ {\n for (var i = 0; i < numTests; ++i) {\n test = (TestComponent)GetComponent(typeof(TestComponent));\n\
    \ }\n}\n```\n```\n\nThe preceding code tests each of the `GetComponent()` overloads\
    \ a million times. This is far more tests than would be sensible for a typical\
    \ project, but it helps make the relative costs clear.\n\nHere is the result we\
    \ get when the tests complete:\n\n```\n```\n! GetComponent(string) finished: 6413.00ms\
    \ total, 0.006413ms per test for 1000000 tests\nUnityEngine.Debug:Log(Object)\n\
    ! GetComponent<ComponentName> finished: 89.00ms total, 0.000089ms per test for\
    \ 1000000 tests\nUnityEngine.Debug:Log(Object)\n! GetComponent(typeof(ComponentName))\
    \ finished: 95.00ms total, 0.000095ms per test for 1000000 tests\nUnityEngine.Debug:Log(Object)\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 64
  md: 'As you can see, the `GetComponent<T>()` method is only a tiny fraction faster
    than

    `GetComponent(typeof(T))`, whereas `GetComponent(string)` is significantly slower

    than the alternatives. Therefore, it is pretty safe to use either of the type-based
    versions of

    `GetComponent()` because of the small performance difference. However, we should
    ensure

    that we never use `GetComponent(string)` since the outcome is identical, and there
    is no

    benefit for the costs incurred. There are some very rare exceptions, like if we
    were writing a

    custom debug console for Unity, which might parse a user-inputted `string` to
    acquire a

    Component. In any case, these would be used for debugging and diagnostics situations

    only, where performance isn''t too important. For a production-level application,
    the use of

    `GetComponent(string)` is just a needless waste.


    # # Remove empty callback definitions


    The primary means of scripting in Unity is to write callback functions in classes
    derived

    from `MonoBehaviour`, which we know Unity will call when necessary. Perhaps the
    four

    most commonly used callbacks are `Awake()`, `Start()`, `Update()`, and `FixedUpdate()`.


    `Awake()` is called the moment a `MonoBehaviour` is first created, whether this
    occurs during

    Scene initialization or when a new `GameObject` containing the `MonoBehaviour`
    is

    instantiated at runtime from a Prefab. `Start()` will be called shortly after
    `Awake()` but

    before its first `Update()`. During Scene initialization, every `MonoBehaviour`

    Component''s `Awake()` callback will be called before any of their `Start()` callbacks
    are.


    After this, `Update()` will be called repeatedly, each time the Rendering Pipeline
    presents a

    new image. `Update()` will continue to be called provided the `MonoBehaviour`
    is still

    present in the Scene, it is still enabled, and its parent `GameObject` is active.


    Finally, `FixedUpdate()` is called just prior to when the Physics Engine updates.
    Fixed

    Updates are used whenever we want activity similar in behavior to `Update()` but
    that isn''t

    tied directly to the render frame rate and is called more consistently over time.


    Refer to the following page in the Unity documentation for an accurate picture
    of when

    various Unity callbacks are called: https://docs.unity3d.com/Manual/ExecutionOrder.

    html.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Whenever a MonoBehaviour is first instantiated in our Scene, Unity will add
    any defined callbacks to a list of function pointers, which it will call at key
    moments. However, it is important to realize that Unity will hook into these callbacks
    even if the function body is empty. The core Unity Engine has no awareness that
    these function bodies may be empty and only knows that the method has been defined
    and, therefore, that it must acquire it and then call it when necessary. Consequently,
    if we leave empty definitions of these callbacks scattered throughout the codebase,
    then they will waste a small amount of CPU due to the overhead cost of the engine
    invoking them.


    This can be a problem since any time we create a new MonoBehaviour script file
    in Unity, it will automatically generate two boilerplate callback stubs for us
    for Start() and Update():


    ```

    // Use this for initialization

    void Start () {

    }


    // Update is called once per-frame

    void Update () {

    }

    ```


    It can be easy to accidentally leave these empty definitions on scripts that don''t
    actually need them. An empty Start() definition is liable to cause any object
    to initialize a little slower, for no good reason. This effect may not be particularly
    noticeable for a handful of MonoBehaviours, but as development on the project
    continues and we populate our scenes with thousands of custom MonoBehaviours with
    lots of empty Start() definitions, it could start to become a problem, causing
    slow Scene initialization and wasting CPU time whenever a new Prefab is created
    via GameObject.Instantiate().


    Such calls typically happen during key gameplay events; for instance, when two
    objects collide, we might spawn a Particle Effect, create some floating damage
    text, play a sound effect, and so on. This can be a critical moment for performance,
    because we''ve suddenly requested that the CPU make a lot of complicated changes,
    but with only a finite amount of time to complete them before the current frame
    ends. If this process takes too long, then we would experience a frame drop as
    the Rendering Pipeline isn''t allowed to present a new frame until all of the
    Update() callbacks (counted across all MonoBehaviours in the Scene!) have finished.
    Ergo, a bunch of empty Start() definitions being called at this time is a needless
    waste and could potentially cut into our tight time-budget at a critical moment.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Meanwhile, if our Scene contains thousands of MonoBehaviours with these empty

    Update() definitions, then we would be wasting a lot of CPU cycles every frame,

    potentially causing havoc on our frame rate.


    Let''s prove all of this with a simple test. Our test Scene should have GameObjects
    with two

    types of Component, EmptyClassComponent with no methods defined at all and

    EmptyCallbackComponent with an empty Update() callback defined:


    ```

    public class EmptyClassComponent : MonoBehaviour {

    }


    public class EmptyCallbackComponent : MonoBehaviour {

    void Update () {}

    }

    ```


    The following are the test results for 30,000 Components of each type. If we enable
    all

    GameObjects with attached EmptyClassComponents during runtime, then nothing

    interesting happens under the CPU Usage Area of the Profiler. There will be a
    small

    amount of background activity, but none of this activity will be caused by the

    EmptyClassComponents. However, as soon as we enable all objects with

    EmptyCallbackComponent, we will observe a huge increase in CPU usage:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_66_0.png)'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'It’s hard to imagine a Scene with more than 30,000 objects in it, but keep
    in mind that `MonoBehaviour`s contain the `Update()` callback, not `GameObject`s.
    A single `GameObject` can contain multiple `MonoBehaviour`s at once, and each
    of their children can contain even more `MonoBehaviour`s, and so on. A few thousand
    or even a hundred empty `Update()` callbacks will inflict a noticeable impact
    on frame rate budget, for zero potential gain. This is particularly common with
    Unity UI Components which tend to attach a lot of different Components in a very
    deep hierarchy.


    The fix for this is simple: delete the empty callback definitions. Unity will
    have nothing to hook into, and nothing will be called. Finding such empty definitions
    in an expansive codebase may be difficult, but if we use some basic regular expressions
    (known as _regex_), we should be able to find what we’re looking for relatively
    easily.


    All common code-editing tools for Unity, such as MonoDevelop, Visual Studio, and
    even Notepad++, provide a way to perform a regex-based search on the entire codebase.
    Check out the tool’s documentation for more information, since the method can
    vary greatly depending on the tool and its version.


    The following regex search should find any empty `Update()` definitions in our
    code:


    `void\\s*Update\\s*\\((\\s*?)\\s*?\\n*?\\{(\\n*?\\s*?)*?\\}`


    This regex checks for a standard method definition of the `Update()` callback,
    while including any surplus whitespace and newline characters that can be distributed
    throughout the method definition.


    Naturally, all of the above is also true for the non-boilerplate Unity callbacks,
    such as `OnGUI()`, `OnEnable()`, `OnDestroy()`, and `LateUpdate()`. The only difference
    is that only `Start()` and `Update()` are defined automatically in a new script.
    Check out the `MonoBehaviour` Unity Documentation page for a complete list of
    these callbacks at `http:// docs.unity3d.com/ScriptReference/MonoBehaviour.html`.


    It might also seem unlikely that someone generated so many empty versions of these
    callbacks in our codebase, but never say never. For example, if we use a common
    base class `MonoBehaviour` throughout all of our custom Components, then a single
    empty callback definition in that base class will permeate the entire game, which
    can cost us dearly. Be particularly careful of the `OnGUI()` method, as it can
    be invoked multiple times within the same frame or UI event.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: "Perhaps the most common source of performance problems in Unity scripting is\
    \ to misuse\nthe `Update()` callback by doing one or more of the following things:\n\
    \n+   - Repeatedly recalculating a value that rarely or never changes\n+   - Having\
    \ too many Components perform work for a result which could be shared\n+   - Performing\
    \ work far more often than is necessary\n\nIt’s worth getting into the habit of\
    \ remembering that literally every single line of code we\nwrite in an `Update()`\
    \ callback, and in functions called by those callbacks, will eat into our\nframe\
    \ rate budget. To hit 60 fps, we have 16.667 milliseconds to complete all of the\
    \ work in\nall of our `Update()` callbacks, every frame. This seems like plenty\
    \ of time when we start\nprototyping, but somewhere in the middle of development,\
    \ we will probably start noticing\nthings getting slower and less responsive because\
    \ we’ve gradually been eating away at that\nbudget, due to an unchecked desire\
    \ to cram more stuff into our project.\n\nLet’s cover some tips that directly\
    \ address these problems.\n\n# # Cache Component references\n\nRepeatedly recalculating\
    \ a value is a common mistake when scripting in Unity, and\nparticularly when\
    \ it comes to the `GetComponent()` method. For example, the following\nscript\
    \ code is trying to check a creature’s health value, and if its health goes below\
    \ `0`, it will\ndisable a series of Components to prepare it for a death animation:\n\
    \n```\n```c\nvoid TakeDamage() {\n    RigidBody rigidbody = GetComponent<RigidBody>();\n\
    \    Collider collider = GetComponent<Collider>();\n    AIControllerComponent\
    \ ai = GetComponent<AIControllerComponent>();\n    Animator anim = GetComponent<Animator>();\n\
    \n    if (GetComponent<HealthComponent>().health < 0) {\n        rigidbody.enabled\
    \ = false;\n        collider.enabled = false;\n        ai.enabled = false;\n \
    \       anim.SetTrigger(\"death\");\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 69
  md: "Each time this poorly optimized method executes, it will reacquire five different\
    \ Component references. This is not very friendly on CPU usage. This is particularly\
    \ problematic if the main method was called during `Update()`. Even if it is not,\
    \ it still might coincide with other important events, such as creating particle\
    \ effects, replacing an object with a Ragdoll (thus invoking various activity\
    \ in the Physics Engine), and so on. This coding style can seem harmless, but\
    \ it can cause a lot of long-term problems and runtime work for very little benefit.\n\
    \nIt costs us a small amount of memory space (only 32 or 64 bits each time; Unity\
    \ version, platform, and fragmentation permitting) to cache these references for\
    \ future use. So, unless you’re extremely bottlenecked on memory, a better approach\
    \ would be to acquire the references during initialization and keep them until\
    \ they are needed:\n\n```\n```\nprivate HealthComponent _healthComponent;\nprivate\
    \ Rigidbody _rigidbody;\nprivate Collider _collider;\nprivate AIControllerComponent\
    \ _ai;\nprivate Animator _anim;\n\nvoid Awake() {\n    _healthComponent = GetComponent<HealthComponent>();\n\
    \    _rigidbody = GetComponent<Rigidbody>();\n    _collider = GetComponent<Collider>();\n\
    \    _ai = GetComponent<AIControllerComponent>();\n    _anim = GetComponent<Animator>();\n\
    }\n\nvoid TakeDamage() {\n    if (_healthComponent.health < 0) {\n        _rigidbody.detectCollisions\
    \ = false;\n        _collider.enabled = false;\n        _ai.enabled = false;\n\
    \        _anim.SetTrigger(\"death\");\n    }\n}\n```\n```\n\nCaching Component\
    \ references in this way spares us from reacquiring them each time they’re needed,\
    \ saving us some CPU overhead each time. The cost is a small amount of additional\
    \ memory consumption, which is very often worth the price."
  merge: -1
  img_proc: true
- pgno: 70
  md: "The same tip applies to literally any piece of data we decide to calculate\
    \ at runtime. There’s no need to ask the CPU to keep recalculating the same value\
    \ every `Update()` when we can just store it in memory for future reference.\n\
    \n# # Share calculation output\n\nPerformance can be saved by having multiple\
    \ objects share the result of some calculation; of course, this only works if\
    \ all of them would generate the same result. Such situations are often easy to\
    \ spot, but can be tricky to refactor, and so exploiting this would be very implementation\
    \ dependent.\n\nSome examples might include finding an object in a Scene, reading\
    \ data from a file, parsing data (such as XML or JSON), finding something in a\
    \ big list or deep dictionary of information, calculating pathing for a group\
    \ of **Artificial Intelligence (AI)** objects, complex mathematics-like trajectories,\
    \ raycasting, and so on.\n\nThink about each time an expensive operation is undertaken,\
    \ and consider whether it is being called from multiple locations but always results\
    \ in the same output. If this is the case, then it would be wise to restructure\
    \ things so that the result is calculated once and then distributed to every object\
    \ that needs it in order to minimize the amount of recalculation. The biggest\
    \ cost is typically just a small loss in code simplicity, although some extra\
    \ overhead may be inflicted by passing the value around.\n\nNote that it’s often\
    \ easy to get into the habit of hiding some big complex function in a base class,\
    \ and then we define derived classes that make use of that function, completely\
    \ forgetting how costly that function is because we rarely glance at that code\
    \ again. It’s best to use the Unity Profiler to tell us how many times that expensive\
    \ function may be called, and as always, don’t preoptimize those functions unless\
    \ it’s been proven to be a performance issue. No matter how expensive it may be,\
    \ if it doesn’t cause us to exceed performance restrictions (such as frame rate\
    \ and memory consumption), then it’s not really a performance problem.\n\n# #\
    \ Update, Coroutines, and InvokeRepeating\n\nAnother habit that’s easy to fall\
    \ into is to call something repeatedly in an `Update()` callback way more often\
    \ than is needed. For example, we may start with a situation like this:\n\n```\n\
    void Update() {\n    ProcessAI();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: "In this case, we're calling some custom `ProcessAI()` subroutine every single\
    \ frame. This may be a complex task, requiring the AI system to check some grid\
    \ system to figure out where it's meant to move or determine some fleet maneuvers\
    \ for a group of spaceships or whatever our game needs for its AI.\n\nIf this\
    \ activity is eating into our frame rate budget too much, and the task can be\
    \ completed less frequently than every frame with no significant drawbacks, then\
    \ a good trick to improve performance is to simply reduce the frequency that `ProcessAI()`\
    \ gets called:\n\n```\nprivate float _aiProcessDelay = 0.2f;\nprivate float _timer\
    \ = 0.0f;\nvoid Update() {\n\t_timer += Time.deltaTime;\n\tif (_timer > _aiProcessDelay)\
    \ {\n\t\tProcessAI();\n\t\t_timer -= _aiProcessDelay;\n\t}\n}\n```\n\nIn this\
    \ case, we've reduced the `Update()` callback's overall cost by only invoking\
    \ `ProcessAI()` about five times every second, which is an improvement over the\
    \ previous situation, at the expense of code that can take a bit of time to understand\
    \ at first glance, and a little extra memory to store some floating-point data.\
    \ Although, at the end of the day we're still having Unity call an empty callback\
    \ function more often than not.\n\nThis function is a perfect example of a function\
    \ we could convert into a Coroutine to make use of their delayed invocation properties.\
    \ As mentioned previously, Coroutines are typically used to script a short sequence\
    \ of events, either as a one-time, or repeated, action. They should not be confused\
    \ with threads, which would run on a completely different CPU core in a concurrent\
    \ manner, and multiple threads can be running simultaneously. Instead, Coroutines\
    \ run on the main thread in a sequential manner such that only one Coroutine is\
    \ handled at any given moment, and each Coroutine decides when to pause and resume\
    \ via `yield` statements. The following code is an example of how we might rewrite\
    \ the above `Update()` callback in the form of a Coroutine:\n\n```\nvoid Start()\
    \ {\n\tStartCoroutine(ProcessAICoroutine());\n}\n```"
  merge: -1
  img_proc: true
- pgno: 72
  md: "```\nIEnumerator ProcessAICoroutine () {\n    while (true) {\n        ProcessAI();\n\
    \        yield return new WaitForSeconds (_aiProcessDelay);\n    }\n}\n```\n\n\
    The preceding code demonstrates a Coroutine that calls `ProcessAI()`, then pause\
    \ at the\nyield statement for the given number of seconds (the value of `_aiProcessDelay`)\
    \ before\nthe main thread resumes the Coroutine again. At which point, it will\
    \ return to the start of\nthe loop, call `ProcessAI()`, pause on the `yield` statement\
    \ again, and repeat forever (via\nthe `while(true)` statement) until asked to\
    \ stop.\n\nThe main benefit of this approach is that this function will only be\
    \ called as often as dictated\nby the value of `_aiProcessDelay`, and it will\
    \ sit idle until that time, reducing the\nperformance hit inflicted in most of\
    \ our frames. However, this approach has its drawbacks.\n\nFor one, starting a\
    \ Coroutine comes with an additional overhead cost relative to a standard\nfunction\
    \ call (around three times as slow), as well as some memory allocations to store\
    \ the\ncurrent state in memory until it is invoked the next time. This additional\
    \ overhead is also\nnot a one-time cost because Coroutines often constantly call\
    \ `yield`, which inflicts the same\noverhead cost again and again, so we need\
    \ to ensure that the benefits of a reduced\nfrequency outweighs this cost.\n\n\
    In a test of 1,000 objects with empty `Update()` callbacks, it took\n1.1 milliseconds\
    \ to process, whereas 1,000 Coroutines yielding on\n`WaitForEndOfFrame` (which\
    \ has identical frequency to `Update()`\ncallbacks) took 2.9 milliseconds. So,\
    \ the relative cost is almost three times\nas much.\n\nSecondly, once initialized,\
    \ Coroutines run independent of the triggering `MonoBehaviour`\nComponent's `Update()`\
    \ callback and will continue to be invoked regardless of whether the\nComponent\
    \ is disabled or not, which can make them unwieldy if we're performing a lot of\n\
    `GameObject` construction and destruction.\n\nThirdly, the Coroutine will automatically\
    \ stop the moment the containing `GameObject` is\nmade inactive for whatever reason\
    \ (whether it was set inactive or one of its parents was)\nand will not automatically\
    \ restart if the `GameObject` is set active again."
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Finally, by converting a method into a Coroutine, we may have reduced the performance
    hit inflicted during most of our frames, but if a single invocation of the method
    body causes us to break our frame rate budget, then it will still be exceeded
    no matter how rarely we call the method. Therefore, this approach is best used
    for situations where we are only breaking our frame rate budget because of the
    sheer number of times the method is called in a given frame, not because the method
    is too expensive on its own. In those cases, we have no option but to either dig
    into and improve the performance of the method itself or reduce the cost of other
    tasks to free up the time it needs to complete its work.


    There are several yield types available to us when generating Coroutines. WaitForSeconds
    is fairly self-explanatory; the Coroutine will pause at the yield statement for
    a given number of seconds. It is not exact an exact timer, however, so expect
    a small amount of variation when this yield type actually resumes.


    WaitForSecondsRealTime is another option and is different to WaitForSeconds only
    in that it uses unscaled time. WaitForSeconds compares against scaled time, which
    is affected by the global Time.timeScale property while WaitForSecondsRealTime
    is not, so be careful about which yield type you use if you''re tweaking the time
    scale value (for example, for slow motion effects).


    There is also WaitForEndOfFrame, which would continue at the end of the next Update(),
    and then there''s WaitForFixedUpdate, which would continue at the end of the next
    FixedUpdate(). Lastly, Unity 5.3 introduced WaitUntil and WaitWhile, where we
    provide a delegate function, and the Coroutine will pause until the given delegate
    returns true or false, respectively. Note that the delegates provided to these
    yield types will be executed for each Update() until they return the Boolean value
    needed to stop them, which makes them very similar to a Coroutine using WaitForEndOfFrame
    in a while-loop that ends on a certain condition. Of course, it is also important
    that the delegate function we provide is not too expensive to execute.


    > Delegate functions are incredibly useful constructs in C# that allows us to
    pass local methods around as arguments to other methods and are typically used
    for callbacks. Check out the MSDN C# Programming Guide for more information on
    delegates at https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/delegates/.'
  merge: -1
  img_proc: true
- pgno: 74
  md: "The way that some `Update()` callbacks are written could probably be condensed\
    \ down into simple Coroutines that always call `yield` on one of these types,\
    \ but we should be aware of the drawbacks mentioned previously. Coroutines can\
    \ be tricky to debug since they don't follow normal execution flow; there's no\
    \ caller in the callstack we can directly blame as to why a Coroutine triggered\
    \ at a given time, and if Coroutines perform complex tasks and interact with other\
    \ subsystems, then they can result in some impossibly difficult bugs because they\
    \ happened to be triggered at a moment that some other code didn't expect, which\
    \ also tend to be the kinds of bugs that are painstakingly difficult to reproduce.\
    \ If you do wish to make use of Coroutines, the best advice is to keep them simple\
    \ and independent of other complex subsystems.\n\nIndeed, if our Coroutine is\
    \ simple enough that it can be boiled down to a `while`-loop that always calls\
    \ `yield on WaitForSeconds`, or `WaitForSecondsRealtime` as in the above example,\
    \ then we can usually replace it with an `InvokeRepeating()` call, which is even\
    \ simpler to set up and has a slightly smaller overhead cost. The following code\
    \ is functionally equivalent to the previous implementation that used a Coroutine\
    \ to regularly invoke a `ProcessAI()` method:\n\n```\nvoid Start() {\n    InvokeRepeating(\"\
    ProcessAI\", 0f, _aiProcessDelay);\n}\n```\n\nAn important difference between\
    \ `InvokeRepeating()` and Coroutines is that `InvokeRepeating()` is completely\
    \ independent of both the `MonoBehaviour` and `GameObject`'s state. The only two\
    \ ways to stop an `InvokeRepeating()` call is to either call `CancelInvoke()`\
    \ which stops all `InvokeRepeating()` callbacks initiated by the given `MonoBehaviour`\
    \ (note that they cannot be canceled individually) or to destroy the associated\
    \ `MonoBehaviour` or its parent `GameObject`. Disabling either the `MonoBehaviour`\
    \ or `GameObject` does not stop `InvokeRepeating()`.\n\nA test of 1,000 `InvokeRepeating()`\
    \ calls was processed in about 2.6 milliseconds; slightly faster than 1,000 equivalent\
    \ Coroutine `yield` calls, which took 2.9 milliseconds.\n\nThat covers most of\
    \ the useful information related to the `Update()` callback. Let's look into some\
    \ other useful scripting tips."
  merge: -1
  img_proc: true
- pgno: 75
  md: "# # Faster GameObject null reference checks\n\nIt turns out that performing\
    \ a `null` reference check against a `GameObject` will result in some unnecessary\
    \ performance overhead. `GameObject`s and `MonoBehaviour`s are special objects\
    \ compared to a typical C# object in that they have two representations in memory:\
    \ one exists within the memory managed by the same system managing the C# code\
    \ we write (Managed code), whereas the other exists in a different memory space\
    \ which is handled separately (Native code). Data can move between these two memory\
    \ spaces, but each time this happens will result in some additional CPU overhead\
    \ and possibly an extra memory allocation.\n\nThis effect is commonly referred\
    \ to as crossing the `Native-Managed Bridge`. If this happens, it is likely to\
    \ generate an additional memory allocation for an object's data to get copied\
    \ across the Bridge, which will require the Garbage Collector to eventually perform\
    \ some automatic cleanup of memory for us. This subject will be explored in much\
    \ more detail in Chapter 8, _Masterful Memory Management_, but for the time-being\
    \ just consider that there are many subtle ways to accidentally trigger this extra\
    \ overhead, and a simple `null` reference check against a `GameObject` is one\
    \ of them:\n\n```\n```csharp\nif (gameObject != null) {\n    // do stuff with\
    \ gameObject\n}\n```\n```\n\nAn alternative that generates a functionally equivalent\
    \ output which operates around twice as quickly (although it does obfuscate the\
    \ purpose of the code a little) is `System.Object.ReferenceEquals()`:\n\n```\n\
    ```csharp\nif (!System.Object.ReferenceEquals(gameObject, null)) {\n    // do\
    \ stuff with gameObject\n}\n```\n```\n\nThis applies to both `GameObject`s and\
    \ `MonoBehaviour`s, as well as other Unity objects, which have both Native and\
    \ Managed representations like the `WWW` class. However, some rudimentary testing\
    \ reveals that either `null` reference check approach still consumes mere nanoseconds\
    \ on an Intel Core i5 3570K processor. So, unless you are performing massive amounts\
    \ of `null` reference checks, the gains might be marginal at best. However, this\
    \ is a warning worth keeping in mind for the future, as it will come up a lot."
  merge: -1
  img_proc: true
- pgno: 76
  md: "# # Avoid retrieving string properties from GameObjects\n\nOrdinarily, retrieving\
    \ a `string` property from an object is the same as retrieving any other reference\
    \ type property in C#; it should be acquired with no additional memory cost. However,\
    \ retrieving `string` properties from `GameObjects` is another subtle way of accidentally\
    \ crossing over the Native-Managed Bridge.\n\nThe two properties of `GameObject`\
    \ affected by this behavior are `tag` and `name`. Therefore, it is unwise to use\
    \ either properties during gameplay, and you should only use them in performance-inconsequential\
    \ areas, such as Editor Scripts. However, the Tag System is commonly used for\
    \ runtime identification of objects, which can make this a significant problem\
    \ for some teams.\n\nFor example, the following code would cause an additional\
    \ memory allocation during every iteration of the loop:\n\n```\n```c\nfor (int\
    \ i = 0; i < listOfObjects.Count; ++i) {\n    if (listOfObjects[i].tag == \"Player\"\
    ) {\n    // do something with this object\n    }\n}\n```\n```\n\nIt is often a\
    \ better practice to identify objects by their Components and class types and\
    \ to identify values that do not involve `string` objects, but sometimes we're\
    \ forced into a corner. Maybe we didn't know any better when we started, we inherited\
    \ someone else's codebase, or we're using it as a workaround for something. Let's\
    \ assume that, for whatever reason, we're stuck with the Tag system, and we want\
    \ to avoid the Native-Managed Bridge overhead cost.\n\nFortunately, the `tag`\
    \ property is most often used in comparison situations, and `GameObject` provide\
    \ the `CompareTag()` method which is an alternative way to compare `tag` properties,\
    \ which avoids the Native-Managed Bridge entirely.\n\nLet's perform a simple test\
    \ to prove how this simple change can make all the difference in the world:\n\n\
    ```\n```c\nvoid Update() {\n    int numTests = 10000000;\n\n    if (Input.GetKeyDown(KeyCode.Alpha1))\
    \ {\n    for(int i = 0; i < numTests; ++i) {\n```\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: "```\nif (gameObject.tag == \"Player\") {\n    // do stuff\n}\n}\n}\nif (Input.GetKeyDown(KeyCode.Alpha2))\
    \ {\nfor(int i = 0; i < numTests; ++i) {\nif (gameObject.CompareTag (\"Player\"\
    )) {\n// do stuff\n}\n}\n}\n}\n```\n\nWe can execute these tests by pressing the\
    \ 1 and 2 keys to trigger the respective for loop.\nHere are the results:\n\n\
    ![](img/da79484c9b30dc915216dbc5454a9bbf_77_0.png)"
  merge: -1
