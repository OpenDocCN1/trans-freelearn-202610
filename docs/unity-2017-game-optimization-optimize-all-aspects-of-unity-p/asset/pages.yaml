- pgno: 334
  md: '+   - Prefab instances that already exist in the Scene will not be managed
    by the Pooling System. We could create a Component that needs to be attached to
    such objects and that notifies the `PrefabPoolingSystem` class of its existence
    in its `Awake()` callback, which passes the reference along to the corresponding
    `PrefabPool`.

    +   - We could implement a way for `IPoolableComponent` to set a priority during
    acquisition and directly control the order of execution for their `Spawned()`
    and `Despawned()` methods.

    +   - We could add counters that keep track of how long objects have been sitting
    in the Inactive list relative to total Scene lifetime and print out the data during
    shutdown. This could tell us whether or not we''re prespawning too many instances
    of a given Prefab.

    +   - This system will not interact kindly with Prefab instances that set themselves
    to `DontDestroyOnLoad()`. It might be wise to add a Boolean to every `Spawn()`
    call to say whether the object should persist or not and keep them in a separate
    data structure that is not cleared out during `Reset()`.

    +   - We could change `Spawn()` to accept an argument that allows the requestor
    to pass custom data to the `Spawned()` function of `IPoolableObject` for initialization
    purposes. This could use a system similar to how custom message objects were derived
    from the `Message` class for our Messaging System in _Chapter 2, Scripting Strategies_.


    # # IL2CPP optimizations


    Unity Technologies have released a few blog posts on interesting ways to improve
    the performance of IL2CPP in some circumstances, but they can be difficult to
    manage. If you''re using IL2CPP and need to eke out the last little bit of performance
    from our application that we can, then check out the blog series at the following
    links:


    +   - https://blogs.unity3d.com/2016/07/26/il2cpp-optimizations- devirtualization/

    +   - https://blogs.unity3d.com/2016/08/04/il2cpp-optimizations-faster- virtual-method-calls/

    +   - https://blogs.unity3d.com/2016/08/11/il2cpp-optimizations-avoid- boxing/'
