- pgno: 146
  md: 'This can require a significant number of special case changes, testing, and
    asset management tweaks. So, it is recommended that you save this approach as
    a Nuclear Option to be used late in production, in the event that all other techniques
    have not succeeded as well as we hoped.


    Finally, there is the Load Type option, which dictates how audio data loads when
    it occurs. There are three options available:


    +   • Decompress On Load

    +   • Compressed in Memory

    +   • Streaming


    These three options are explained in detail:


    +   • Decompress On Load: This setting compresses the file on disk to save space
    and decompresses it into memory when it is first loaded. This is the standard
    method of loading an audio file and should be used in most cases. It takes some
    time to decompress the file, which leads to a little extra overhead during loading,
    but reduces the amount of work required when the audio file is played.

    +   • Compressed In Memory: This setting simply copies the compressed file straight
    from disk into memory when it is loaded. It will only decompress the audio file
    during runtime when it is being played. This will sacrifice runtime CPU when the
    Audio Clip is played, but improves loading speed and reduces runtime memory consumption
    while the Audio Clip remains dormant. Hence, this option is best used for very
    large audio files that are used fairly frequently, or if we’re incredibly bottlenecked
    on memory consumption and are willing to sacrifice some CPU cycles to play the
    Audio Clip.

    +   • Streaming: Finally, this setting (also known as Buffered) will load, decode,
    and play files on the fly at runtime by gradually pushing the file through a small
    buffer where only one small piece of the overall file is present in memory at
    a time. This method uses the least amount of memory for a particular Audio Clip,
    but the largest amount of runtime CPU. Since each instance of playback of the
    file will need to generate its own buffer, this setting comes with the unfortunate
    drawback where referencing the Audio Clip more than once leads to multiple copies
    of the same Audio Clip in memory that must all be processed separately, resulting
    in a runtime CPU cost if used recklessly. Consequently, this option is best reserved
    for single-instance Audio Clips that play regularly and never need to overlap
    with other instances of itself or even with other streamed Audio Clips. For example,
    this setting is best used with background music and ambient sound effects that
    need to be played during the majority of a Scene’s lifetime.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'So, let’s recap. The default case, with **Preload Audio Data** enabled, **Load
    In Background** disabled, and a **Load Type** of **Decompress On Load**, causes
    a long Scene loading time, but ensures that every Audio Clip we reference in the
    Scene is ready immediately when we need it. There will be no loading delays when
    the Audio Clip is needed, and the Audio Clip will playback the moment we call
    `Play()`. A good compromise to improve Scene loading time is to enable **Load
    In Background** for Audio Clips we won’t need until later, but this should not
    be used for Audio Clips we need shortly after Scene initialization. We then control
    when our audio data is loaded manually through `AudioClip.LoadAudioData()` and
    `AudioClip.UnloadAudioData()`. We should be willing to use all of these methods
    in a single Scene in order to reach optimal performance.


    # # Encoding formats and quality levels


    Unity supports three general case encoding formats for Audio Clips, which is determined
    by the **Compression Format** option when we view an Audio Clip’s properties in
    the **Inspector** window:


    +   - **Compressed** (the actual text for this option can appear differently,
    depending on the platform)

    +   - **PCM**

    +   - **ADPCM**


    The audio files we import into the Unity Engine can be one of many popular audio
    file formats, such as Ogg Vorbis, MPEG-3 (MP3), and Wave, but the actual encoding
    that is bundled into the executable will be converted into a different format.


    The compression algorithm used with the **Compressed** setting will depend on
    the platform being targeted. Stand-alone applications and other non-mobile platforms
    will convert the file into the Ogg-Vorbis format, whereas mobile platforms use
    MP3.


    There are a few platforms that always use a specific type of compression, such
    as HEVAG for the PS Vita, XMA for XBox One, and AAC for WebGL.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_147_0.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Statistics are provided in the **Inspector** window for the currently selected
    format in the area following the **Compression Format** option, providing an idea
    of how much disk space is being saved by the compression. Note that the first
    value displays the original file size and the second displays the size cost on
    disk. How much memory the audio file will consume at runtime once loaded will
    be determined by how efficient the chosen compression format is. For example,
    Ogg Vorbis compression will generally decompress to about 10 times its compressed
    size, whereas ADPCM will decompress to about four times the compressed size.


    The cost savings displayed in the **Inspector** window for an audio file only
    apply for the currently selected platform and most recently applied settings.
    Ensure that Editor is switched to the correct platform in **File | Build Settings**
    and that you click on **Apply** after making changes in order to see the actual
    cost savings (or cost inflation) for the current configuration. This is particularly
    important for WebGL applications, since the AAC format generally leads to very
    inflated audio file sizes.


    The encoding/compression format used can have a dramatic effect on the quality,
    file size, and memory consumption of the audio file during runtime, and only the
    **Compressed** setting gives us the ability to alter the quality without affecting
    the sampling rate of the file. Meanwhile, the **PCM** and **ADPCM** settings do
    not provide this luxury, and we''re stuck with whatever file size those compression
    formats decide to give us--that is, unless we''re willing to reduce audio quality
    for the sake of file size by reducing the sampling rate.


    The **PCM** format is a lossless and uncompressed audio format, providing a close
    approximation of analog audio. It trades large file sizes for higher audio quality
    and is best used for very short sound effects that require a lot of clarity where
    any compression would otherwise distort the experience.


    Meanwhile, the **ADPCM** format is far more efficient in both size and CPU consumption
    than **PCM**, but compression results in a fair amount of noise. This noise can
    be hidden if it is reserved for short sound effects with a lot of chaos, such
    as explosions, collisions, and impact sounds where we might not be aware of any
    generated artifacts.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Finally, the **Compressed** format will result in small files that have lower
    quality than **PCM**, but significantly better quality than **ADPCM** at the expense
    of additional runtime CPU usage. This format should be used in most cases. This
    option allows us to customize the resultant quality level of the compression algorithm
    to tweak quality against file size. Best practices with the **Quality** slider
    are to search for a quality level that is as small as possible, but unnoticeable
    to users. Some user testing may be required to find the _sweet spot_ for each
    file.


    > Do not forget that any additional audio effects applied to the file at runtime
    will not play through the Editor in _Edit Mode_, so any changes should be fully
    tested through the application in _Play Mode_.


    # # Audio performance enhancements


    Now that we have a better understanding of audio file formats, loading methods,
    and compression modes; let''s explore some approaches that we can make to improve
    performance through tweaking audio behavior.


    # # Minimize active Audio Source count


    Since each actively playing Audio Source consumes a particular amount of CPU,
    it stands to reason that we can save CPU cycles by disabling redundant Audio Sources
    in our Scene. One approach is to limit how many instances of an Audio Clip can
    be played simultaneously. This involves sending audio playback requests through
    an intermediary that controls our Audio Sources in such a way that puts a hard
    cap on how many instances of an Audio Clip can be played simultaneously.


    Almost every Audio Management Asset available in the Unity Asset Store implements
    an audio-throttling feature of some kind (often known as _Audio Pooling_), and
    for good reason; it''s the best trade-off in minimizing excessive audio playback
    with the least cost in quality. For example, having 20 footstep sounds playing
    simultaneously won''t sound too much different to playing 10 of them simultaneously
    and is less likely to become distracting by being too loud. For this reason, and
    because these tools often provide many more subtle performance-enhancing features,
    it is recommended that you use a preexisting solution rather than rolling out
    your own, as there is a lot of complexity to consider from audio files types,
    stereo/3D audio, layering, compression, filters, cross-platform capability, efficient
    memory management, and so on.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'When it comes to ambient sound effects, they still need to be placed at specific
    locations in

    the Scene to make use of the logarithmic volume effect, which gives it the pseudo-3D
    effect,

    so an Audio Pooling system would probably not be an ideal solution. Limiting playback
    on

    ambient sound effects is best achieved by reducing the total number of Audio Sources.
    The

    best approach is to either remove some of them or reduce them down to one larger,
    louder

    Audio Source. Naturally, this approach affects the quality of the user experience
    since it

    would appear that the sound is coming from a single source and not multiple sources,

    therefore it should be used with care.


    # # Enable Force to Mono for 3D sounds


    Enabling the Force to Mono setting on a stereo audio file will mix together the
    data from

    both audio channels into a single channel, saving 50 percent of the file''s total
    disk and

    memory space usage effectively. Enabling this option is generally not a good idea
    for some

    2D sound effects where the stereo effect is often used to create a specific audio
    experience.

    However, we can enable this option for some good space savings on 3D positional
    Audio

    Clips, where the two channels are effectively identical. These Audio Source types
    will let

    the direction between the Audio Source and the player determine how the audio
    file gets

    played into the left/right ear, and playing a stereo effect in this case is generally

    meaningless. Forcing 2D sounds (sounds that play into the player''s ears at full
    volume,

    regardless of distance/direction to the Audio Source) to mono might also make
    sense if

    there is no need for a stereo effect.


    # # Resample to lower frequencies


    Resampling imported audio files to lower frequencies will reduce the file size
    and runtime

    memory footprint. This can be achieved by setting an audio file''s **Sample Rate
    Setting** to

    **Override Sample Rate**, at which point we can configure the sample rate through
    the

    **Sample Rate** option. Some files require high sample rates to sound reasonable,
    such as files

    with high pitches and most music files. However, lower settings can reduce the
    file''s size

    without noticeable quality degradation in most cases. 22,050 Hertz is a common
    sampling

    rate for sources that involve human speech and classical music. Some sound effects
    may be

    able to get away with even lower frequency values. However, each sound effect
    will be

    affected by this setting in a unique way, so it would be wise to spend some time
    running a

    few tests before we finalize our decision on the sampling rate.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# # Consider all compression formats


    Each of the **Compressed**, **PCM** and **ADPCM** compression formats have their
    own benefits and drawbacks as explained previously. It’s possible to make some
    compromises in memory footprint, disk footprint, CPU usage, and audio quality
    using different encoding formats for different files where appropriate. We should
    be willing to use all of them in the same application and come up with a system
    that works for the kinds of audio files we’re using so that we don’t need to treat
    each file individually. Otherwise, we would need to do a prohibitive amount of
    testing to ensure that audio quality hasn’t been degraded for each file.


    # # Beware of streaming


    The upside of the **Streaming** loading type is a low runtime memory cost since
    a small buffer is allocated and the file is continuously pushed through it like
    a data queue. This can seem quite appealing, but streaming files from disk should
    be restricted to large, single-instance files only, as it requires runtime hard
    disk access; which is one of the slowest forms of data access available to us
    (second only to pulling a file through a network). Layered or transitioning music
    clips may run into major hiccups using the **Streaming** option, at which point,
    it would be wise to consider using a different **Load Type** and control loading/unloading
    manually. We should also avoid streaming more than one file at a time, as it’s
    likely to inflict a lot of cache misses on the disk that interrupt gameplay. This
    is why this option is primarily used for background music/ambient sound effects
    since we only need one at a time.


    # # Apply Filter Effects through Mixer Groups to reduce duplication


    Filter Effects can be used to modify the sound effect playing through an Audio
    Source and can be accomplished through `FilterEffect` Components. Each individual
    Filter Effect will cost some amount of both memory and CPU and can be a good way
    to achieve disk space savings while maintaining a lot of variety in audio playback,
    since one file could be tweaked by a different set of filters to generate completely
    different sound effects.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Due to the additional overhead, overusing Filter Effects in our Scene can result
    in dire consequences in performance. A better approach is to make use of Unity''s
    Audio Mixer utility (**Window | Audio Mixer**) to generate common Filter Effect
    templates that multiple Audio Sources can reference to minimize the amount of
    memory overhead.


    The official tutorial on Audio Mixers covers the topic in excellent detail:


    `https://unity3d.com/learn/tutorials/modules/beginner/5-pre-order-beta/ audiomixer-and-audiomixer-groups`


    # # Use remote content streaming responsibly


    It is possible to dynamically load game content via the Web through Unity, which
    can be an effective means of reducing an application''s disk footprint since less
    data files need to be bundled into the executable, and also provides a means to
    present dynamic content using web services to determine what is presented to the
    user at runtime. Asset streaming can either be accomplished through the `WWW`
    class in Unity 5 or the `UnityWebRequest` class in Unity 2017.


    The `WWW` class provides the `audioClip` property, which is used to access an
    `AudioClip` object if it was an audio file we downloaded via a `WWW` object. However,
    be warned that accessing this property will allocate a whole new `AudioClip` resource
    each time it is invoked, and similarly with other `WWW` resource-acquiring methods.
    This resource must be freed with the `Resources.UnloadAsset()` method once it
    is no longer required.


    Unlike managed resources, discarding the reference (setting it to `null`) will
    not automatically free the resource, so it will continue to consume memory. Ergo,
    we should only obtain the `AudioClip` through the `audioClip` property once, and
    only use that reference from that point forward, releasing it when it is no longer
    required.


    Meanwhile, in Unity 2017, the `WWW` class has been effectively replaced by the
    `UnityWebRequest` class, which makes use of the new HLAPI and LLAPI networking
    layers. This class provides various utilities to download and access what are
    primarily text files. Multimedia-based requests should go through the `UnityWebRequestMultimedia`
    helper class. So, if an `AudioClip` is requested, we should call `UnityWebRequestMultimedia.GetAudioClip()`
    to create the request, and `DownloadHandlerAudioClip.GetContent()` to retrieve
    it once the download is complete.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'This new version of the API is designed to be more efficient at storing and
    providing the

    data we requested, and so reacquiring an `AudioClip` multiple times

    through `DownloadHandlerAudioClip.GetContent()` will not lead to additional

    allocations. Instead, it will merely return a reference to the originally downloaded

    `AudioClip`.


    # Consider Audio Module files for background music


    Audio Module files, also known as **Tracker Modules**, are an excellent means
    of saving a

    significant amount of space without any noticeable quality loss. Supported file
    extensions in

    Unity are `.it`, `.s3m`, `.xm`, and `.mod`. Unlike the common audio formats, which
    are read as

    streams of bits that must be decoded at runtime to generate a specific sound,
    Tracker

    Modules contain lots of small, high-quality samples and organize the entire track
    similar to

    a music sheet; defining when, where, how loud, with what pitch, and with what
    special

    effects each sample should be played with. This can provide significant size savings
    while

    maintaining high-quality sampling. So, if the opportunity is available to us to
    make use of

    Tracker Module versions of our music files, then it is worth exploring.


    # Texture files


    The terms _texture_ and _sprite_ often get confused in game development, so it''s
    worth making

    the distinction--a texture is simply an image file, a big list of color data telling
    the

    interpreting program what color each pixel of the image should be, whereas a sprite
    is the

    2D equivalent of a mesh, which is often just a single _quad_ (a pair of triangles
    combined to

    make a rectangular mesh) that renders flat against the current Camera. There are
    also things

    called Sprite Sheets, which are large collections of individual images contained
    within a

    larger texture file, commonly used to contain the animations of a 2D character.
    These files

    can be split apart by tools, such as Unity''s Sprite Atlas tool, to form individual
    textures for

    the character''s animated frames.


    Both meshes and sprites use textures to render an image onto its surface. Texture
    image

    files are typically generated in tools such as Adobe Photoshop or Gimp and then
    imported

    into our project in much the same way as audio files. At runtime, these files
    are loaded into

    memory, pushed to the GPU''s VRAM, and rendered by a Shader over the target sprite
    or

    mesh during a given Draw Call.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# # Texture compression formats


    Much like audio files, Unity will import texture files with a default list of
    settings that tend to keep things simple and work okay in the general case, but
    there are many import settings available, allowing us to improve a texture''s
    quality and performance with some custom tweaking. Of course, making changes is
    just as likely to reduce quality and performance if we blindly make changes without
    fully understanding the internal processes going on.


    The first option is the file''s **Texture Type**. This setting will determine
    what other options are available, particularly under the **Advanced** dropdown.
    Not all importing options are available to all types, so it is best to configure
    this option for the texture''s intended purpose, whether it is set to **Normal
    Map**, **Sprite**, **Lightmap**, and so on, as this will reveal the options appropriate
    for that type:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_154_0.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Similar to audio files, we can import texture files in multiple common formats
    (such as

    .jpq, and .png), but the actual compression format built into the application
    could be one

    of many different texture compression formats ideally suited for GPUs of the given

    platform. These formats represent different ways of organizing the texture''s
    color

    information; this includes different numbers of bits used to represent each channel
    (the

    more bits used, the more colors that can be represented), different numbers of
    bits per-

    channel (for example, the red channel may use more bits than the green channel),
    different

    total number of bits used for all channels (more bits naturally mean larger textures
    and

    more disk and memory consumption), whether or not an alpha channel is included,
    and

    perhaps the most important, different ways of packing the data together, which
    can allow

    for efficient memory access for the GPU (or incredibly inefficient access if the
    wrong

    packing type is chosen!).


    The simple way of altering compression is to use the **Compression** texture import
    option to

    select one among the following:


    +   • None

    +   • Low Quality

    +   • Normal Quality

    +   • High Quality


    Selecting **None** means that no compression will be applied. In this case, the
    final texture

    will still change format from the file type we imported, but it will select a
    format that makes

    no attempt at compression, and so we should see little or no quality loss at the
    expense of

    large texture files. The other three settings will pick a compression format,
    which, again,

    will vary depending on the platform, and Unity will try to pick a compression
    format that

    matches the option. For instance, selecting **Low Quality** will mean Unity picks
    a

    compression format that greatly reduces the texture size, but will generate some

    compression artifacts, while selecting **High Quality** will consume more memory
    with much

    larger texture sizes and minimal artifacting. Again, this is an automatic selection
    made by

    Unity.


    The exact formats Unity picks for each platform for each of these

    **Compression** settings can be found at https://docs.unity3d.com/

    Manual/class-TextureImporterOverride.html.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_155_0.png)'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# # Texture performance enhancements


    Let''s explore some changes we can make to our texture files, which might help
    improve performance, depending on the situation and the content of the files we''re
    importing. In each case, we''ll explore the changes that need to be made and the
    overall effect they have, whether this results in a positive or negative impact
    on memory or CPU, an increase or decrease in the texture quality, and under what
    conditions we can expect to make use of these techniques.


    # # Reduce texture file size


    The larger a given texture file, the more GPU Memory Bandwidth will be consumed,
    pushing the texture when it is needed. If the total memory pushed per second exceeds
    the graphics card''s total Memory Bandwidth, then we will have a bottleneck, as
    the GPU must wait for all textures to be uploaded before the next rendering pass
    can begin. Smaller textures are naturally easier to push through the pipeline
    than larger textures, so we will need to find a good middle ground between high
    quality and performance.


    The exact compression format Unity chooses can be overridden, although the available
    options vary per platform, since practically every platform has its own custom
    formats that work best for it. If we click on one of the platform-specific tabs
    beside the **Default** tab (just above the **Max Size** option), we will expose
    settings for a specific platform and can choose the exact compression format we
    want Unity to use.


    There is also the **Crunch Compression** setting, which will apply an additional
    level of lossy compression on top of the DXT compression format. This option is
    only revealed if the other compression settings resulted in a DXT level of compression.
    This setting can save even more space at the cost of potentially glaring compression
    artifacts, depending on the **Compressor Quality** setting.


    Several of a texture''s import settings are fairly mundane, such as determining
    whether the file contains an alpha channel, how to wrap the texture at its extents,
    filtering method, and maximum possible resolution of the file (a global limit
    so that we don''t accidentally overscale the texture beyond its original size
    on certain platforms). However, there are several other interesting options in
    these import settings, which we will cover in other sections where appropriate.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_156_0.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'A simple test to find out if we''re bottlenecked in Memory Bandwidth is to
    reduce the resolution of our games most abundant and largest texture files and
    relaunch the Scene. If the frame rate suddenly improves, then the application
    was most likely bound by texture throughput. If the frame rate does not improve
    or improves very little, then either we still have some Memory Bandwidth to make
    use of or there are bottlenecks elsewhere in the Rendering Pipeline, preventing
    us from seeing any further improvement.


    # Use Mip Maps wisely


    There would be no point rendering small, distant objects, such as rocks and trees,
    with a high-detail texture if there''s no way the player would ever be able to
    see that detail. Of course, they may see some slight improvement, but the performance
    cost may not be worth the minor detail increase. Mip Maps were invented as a way
    to solve this problem (as well as helping eliminate aliasing problems that were
    plaguing video games at around the same time), by preregenerating lower-resolution
    alternatives of the same texture and keeping them together in the same memory
    space. At runtime, the GPU picks the appropriate Mip Map level based on how large
    the surface appears within the perspective view (essentially based on the texel-to-pixel
    ratio when the object is rendered).


    By enabling the **Generate Mip Maps** setting, Unity automatically handles the
    generation of these lower-resolution copies of the texture. These alternatives
    are generated using high-quality resampling and filtering methods within the Editor,
    rather than during runtime. There are several other options available for Mip
    Map generation, which can affect the quality of the generated levels, so some
    tweaking may be required to get a high quality set of Mip Maps. We will need to
    decide whether the time spent tweaking these values is worth it, since the whole
    purpose of Mip Maps is to intentionally reduce quality to save performance in
    the first place.


    The following image shows how a 1024 x 1024 image that has been Mip Mapped into
    multiple lower-resolution duplicates:'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/da79484c9b30dc915216dbc5454a9bbf_158_0.png)


    These images will be packed together to save space, essentially creating a final
    texture file that will be about 33 percent larger than the original image. This
    will cost some disk space and GPU Memory Bandwidth to upload.


    It''s possible to observe which Mip Map levels are being used by our application
    at certain points by changing the **Draw Mode** setting of the **Scene** window
    to **Mipmaps**. This will highlight textures in red if they are larger than they
    should be, given the player''s current view (the extra detail is wasted), while
    being highlighted blue means that they are too small (the player is observing
    a low quality texture with a poor texel-to-pixel ratio).


    Remember that Mip Mapping is only useful if we have textures that need to be rendered
    at varying distances from the Camera. If we have textures that always render at
    a common distance from the Main Camera, such that the Mip Mapped alternatives
    are never used, then enabling Mip Maps is just a waste of space. Similarly, if
    we happen to have a texture that always resolves to the same Mip Map level since
    the player''s Camera never gets too close/far away to switch levels, then it would
    be wiser to simply downscale the original texture.


    Good examples of this would be any texture file used in a 2D game, textures used
    by UI systems, or those used in a Skybox or distant background since, by design,
    these textures will always be about the same distance from the Camera, so Mip
    Mapping would be essentially pointless. Other good examples include objects that
    only appear near the player, such as player-centric Particle Effects, characters,
    objects that only appear near the player, and objects that only the player can
    hold/carry.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Manage resolution downscaling externally


    Unity puts a lot of effort into making things as easy to use as possible and provides
    us with

    the ability to place the project files from external tools to our project workspace,
    such as

    .PSD and .TIFF files, which are often large and split into multiple layered images.
    Unity

    automatically generates a texture file from the file''s contents for the rest
    of the Engine to

    make use of, which can be very convenient, as we only need to maintain a single
    copy of the

    file through Source Control, and the Unity copy is automatically updated when
    an artist

    makes changes.


    The problem is that the aliasing introduced by Unity''s auto-texture generation
    and

    compression techniques from these files may not be as good as what the texture-editing

    tools we use could generate for us. Unity is very feature-rich and, first and
    foremost,

    focuses on being a game development platform, which means that it can have difficulty

    competing in areas that other software developers work on full time. Unity may
    be

    introducing artifacts through aliasing as a result of downscaling the image for
    us, and so we

    might find ourselves working around it by importing image files with a higher
    resolution

    than necessary just to keep the intended quality level. However, had we downscaled
    the

    image through the external application first, we might have suffered much less
    aliasing. In

    these cases, we may achieve an acceptable level of quality with a lower resolution,
    while

    consuming less overall disk and memory space.


    We can either avoid using .PSD and .TIFF files within our Unity project as a matter
    of

    habit (storing them elsewhere and importing the downscaled version into Unity)
    or just

    perform some occasional testing to ensure that we''re not wasting file size, memory,
    and

    GPU Memory Bandwidth using larger resolution files than necessary. This costs
    us some

    convenience in project file management, but can provide some significant savings
    for some

    textures, if we''re willing to spend the time comparing the different downscaled
    versions.


    # Adjust Anisotropic Filtering levels


    Anisotropic Filtering is a feature that improves the image quality of textures
    when they are

    viewed at very oblique (shallow) angles. The following screenshot shows the classic

    example of painted lines on a road with and without Anisotropic Filtering applied:'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/da79484c9b30dc915216dbc5454a9bbf_160_0.png)


    In either case, the painted lines close to the Camera appear fairly clear, but
    things change as they get further away from the Camera. Without Anisotropic Filtering,
    the distant painted lines get more and more blurry and distorted, whereas these
    lines remain crisp and clear with Anisotropic Filtering applied.


    The strength of Anisotropic Filtering applied to the texture can be hand-modified
    on a per-texture basis with the **Aniso Level** setting as well as globally enabled/disabled
    using the Anisotropic Textures option within the **Edit | Project | Quality**
    settings.


    Much like Mip Mapping, this effect can be costly and, sometimes, unnecessary.
    If there are textures in our Scene that we are certain will never be viewed at
    an oblique angle (such as distant background objects, UI elements, and billboard
    Particle Effect textures), then we can safely disable Anisotropic Filtering for
    them to save runtime overhead. We can also consider adjusting the strength of
    the Anisotropic Filtering effect on a per-texture basis to find the magic spot
    between quality and performance.


    # ## Consider Atlasing


    Atlasing is the technique of combining lots of smaller, isolated textures together
    into a single, large texture file in order to minimize the number of Materials,
    and hence Draw Calls, we need to use. This is effectively a means to exploit Dynamic
    Batching. Conceptually, this technique is very similar to the approaches of minimizing
    Material usage you learned in `Chapter 3`, _The Benefits of Batching_.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Each unique Material will require an additional Draw Call, but each Material
    only supports

    a single primary texture. Of course, they can also support multiple secondary
    textures, such

    as Normal Maps and Emission Maps. However, by combining multiple primary textures

    into a single large texture file, we can minimize the number of Draw Calls used
    to render

    objects that share this texture:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_161_0.png)


    Extra work is required to modify the UV coordinates used by the mesh or sprite
    object to

    only sample the portion of the larger texture file that it needs, but the benefits
    are clear;

    reducing Draw Calls results in reduction of CPU workload and improvement in the
    frame

    rate if our application is bottlenecked on CPU. Assuming that the merged texture
    file''s

    resolution is equivalent to that of all of the combined images, there will be
    no loss of

    quality, and memory consumption will be essentially identical. Note that Atlasing
    does not

    result in reduced Memory Bandwidth consumption since the amount of data being
    pushed

    to the GPU would also be identical. It just happens to be bundled together in
    one bigger

    texture file.


    > > Atlasing is only an option when all of the given textures require the same

    > Shader. If some of the textures need unique graphical effects applied

    > through Shaders, then they must be isolated into their own Materials and

    > Atlased in separate groups.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Atlasing is a common tactic applied to UI elements and in games that feature
    a lot of 2D

    graphics. Atlasing becomes practically essential when developing mobile games
    with Unity

    since Draw Calls tend to be the most common bottleneck on those platforms. However,
    we

    would not want to generate these Atlas files manually. Life would be much simpler
    if we

    could continue to edit our textures individually and automate the task of combining
    them

    into a larger file.


    Many GUI-related tools in the Unity Asset Store provide an automated texture-Atlasing

    feature. There are some stand-alone programs scattered across the internet, which
    can

    handle this work, and Unity can generate Atlases for Sprites in the form of Assets.
    These

    can be created via **Asset | Create | Sprite Atlas**.


    Check out the Unity documentation to discover more about this useful feature at
    https://

    docs.unity3d.com/Manual/SpriteAtlas.html.


    Note that the Sprite Atlas feature effectively supplants the Sprite Packer

    tool from older versions of Unity.


    Atlasing does not need to be applied to 2D graphics and UI elements, either. We
    can apply

    this technique to 3D meshes if we happen to be creating a lot of low-resolution
    textures. 3D

    games that feature simple texture resolutions, or a flat-shaded low-poly art style,
    are ideal

    candidates for Atlasing in this way.


    However, because Dynamic Batching affects only non-animated meshes (that is,

    MeshRenderer, but not SkinnedMeshRenderer), there is no reason to combine texture

    files for animated characters into an Atlas. Since they are animated, the GPU
    needs to

    multiply each object''s bones by the transform of the current animation state.
    This means a

    unique calculation is needed for each character, and they will result in an extra
    Draw Call

    regardless of any attempts we make to have them share Materials.


    As a result, combining textures for animated characters should be done only as
    a matter of

    convenience and space saving; for example, in a flat-shaded low-poly art style
    game, where

    everything happens to use a common color palette, we can make some space savings
    using

    a single texture for the entire game world, objects, and characters.


    The disadvantages of Atlasing are mostly in terms of development time and workflow

    costs. It requires a lot of effort to overhaul an existing project to make use
    of Atlasing, which

    can be a lot of work just to figure out whether it is worth the effort or not.
    In addition, we

    need to be aware of generating texture files, which are too large for the target
    platform.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Some devices (specifically mobile devices) have a relatively low limit on the
    size of textures that can be pulled into the lowest memory cache of the GPU. If
    the Atlased texture file is too large, then it must be broken up into smaller
    textures in order to fit the target memory space. If the device’s GPU happens
    to need textures from different pieces of the Atlas every other Draw Call, then
    we not only will inflict a lot of cache misses, but also might find that we choke
    the Memory Bandwidth, as textures are constantly pulled from VRAM and the lower-level
    cache.


    We would probably not have this problem if the Atlas was left as individual textures.
    The same texture swapping will occur, but will result in much smaller files being
    swapped at the cost of additional Draw Calls. Our best options at this stage would
    be to lower the Atlas resolution or generate multiple smaller Atlases to have
    better control over how they will be dynamically batched.


    Atlasing is clearly not a perfect solution, and if it is not clear whether it
    would result in a performance benefit, then we should be careful not to waste
    too much time on its implementation. Speaking very generally, mobile games with
    a very simplistic 2D art style probably won’t need to make use of Atlasing. However,
    mobile games attempting to compete with high quality assets or use any kind of
    3D graphics should probably start integrating Atlasing from the very beginning
    of development, since it is likely that the project will reach texture throughput
    limits very quickly. They may even need to apply many per-platform and per-device
    optimizations in order to reach a wide audience.


    Meanwhile, we should consider applying Atlasing to high-quality desktop games
    only if our Draw Call count exceeds reasonable hardware expectations since we
    will want many of our textures to maintain high resolutions for maximum quality.
    Low-quality Desktop games can probably afford to avoid Atlasing since Draw Calls
    are unlikely to be the biggest bottleneck.


    Of course, no matter what the product is, if we’re ever limited in CPU by too
    many Draw Calls and have already exhausted many of the alternative techniques,
    then Atlasing is a very effective performance enhancement in most cases.


    # # Adjust compression rates for non-square textures


    Texture files are normally stored in a square, power-of-two format, meaning that
    their height and width are equal in length, and its size is a power of two. For
    example, typical sizes are 256 x 256 pixels, 512 x 512, 1024 x 1024, and so on.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'It is possible to provide rectangular power-of-two textures (such as 256 x
    512) or those with a non-power-of-two format (such as 192 x 192), but creating
    textures such as these is not recommended. Some GPUs require square texture formats,
    so Unity will compensate by automatically expanding the texture to include additional
    empty space in order to fit the form factor that the GPU expects, which will result
    in additional Memory Bandwidth costs, pushing what is essentially unused and useless
    data to the GPU. Other GPUs may support non-power-of-two textures, but it is likely
    to result in slower sampling than a square texture.


    So, the first recommendation is to avoid non-square and/or non-power-of-two textures
    altogether. If the image can be placed within a square, power-of-two texture,
    and does not result in too much quality degradation due to squeezing/stretching,
    then we should apply those changes just to keep the CPU and GPU happy. As a second
    option, we can customize this scaling behavior in Unity through the texture file''s
    `Non Power of 2` import setting, though because this is an automated process,
    it might not give us the graphical quality we expect.


    # # Sparse Textures


    Sparse Textures, also known as **Mega-Textures** or **Tiled-Textures**, provide
    a way of effectively streaming texture data from disk at runtime. Relatively speaking,
    if the CPU performs operations in the order of seconds, then the disk would operate
    in the order of days. So, the common advice is that hard disk access during gameplay
    should be avoided as much as possible since any such technique risks inflicting
    more disk access than available, causing our application to grind to a halt.


    However, Sparse Texturing offers some interesting performance-saving techniques
    if we''re smart about starting data transfer for portions of the texture before
    we need them. Sparse Texturing is prepared by combining many textures into an
    enormous texture file, which would be far too large to load into graphics memory
    as a single texture file. This is similar to the concept of Atlasing, except the
    file containing the textures is incredibly large–for example, 32,768 x 32,768
    pixels–and would contain considerable color detail, such as 32 bits per-pixel
    (this would result in a texture file that consumes 4 GBs of disk space). The idea
    is to save large amounts of runtime memory and Memory Bandwidth by hand-picking
    small subsections of the texture to load from disk dynamically, pulling them from
    the disk moments before they are needed in the game. The main cost of this technique
    is the file size requirement and the potentially continuous disk access. Other
    costs for this technique can be overcome, but normally take a great deal of Scene
    preparation work.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'The game world needs to be created in such a way that it minimizes the amount
    of texture swapping taking place. In order to avoid very noticeable *texture popping*
    problems, texture subsections must be pulled from a disk into RAM with just enough
    time to spare that the GPU does not need to wait before the transfer to VRAM can
    begin (in much the same way that it normally doesn''t need to wait for ordinary
    texture files that are preloaded into RAM). This takes place in the design of
    the texture file itself by keeping common elements for a given Scene in the same
    general area of the texture, and the design of the Scene, by triggering new texture
    subsection loading at key moments during gameplay and making sure that disk access
    of the new tile is quickly located by the disk without extreme cache misses. If
    it is handled with care, then Sparse Texturing can result in impressive benefits
    in both Scene quality and memory savings.


    It is a highly specialized technique in the gaming industry and has not yet been
    widely adopted partly because it requires specialized hardware and platform support
    and partly because it is difficult to pull it off well. The Unity documentation
    on Sparse Texturing has improved somewhat over time and provides an example Scene
    showing the effect at work, which can be found at `http://docs.unity3d.com/Manual/SparseTextures.html`.


    For Unity developers who consider themselves advanced enough to experiment with
    Sparse Texturing, it might be worth taking the time to perform some research to
    check whether Sparse Texturing is right for their project since it promises some
    significant performance savings.


    # # Procedural Materials


    Procedural Materials, also known as **Substances**, are a means of procedurally
    generating textures at runtime by combining small, high-quality texture samples
    with custom mathematical formulas. The goal of Procedural Materials is to greatly
    minimize the application disk footprint at the cost of additional runtime memory
    and CPU processing during initialization to generate the texture via mathematical
    operations rather than static color data.


    Texture files are, sometimes, the biggest disk space consumer of a game project,
    and it''s fairly common knowledge that download times have a tremendous negative
    impact on the completed download rate and getting people to try our game (even
    if it''s free). Procedural Materials offer us the ability to sacrifice some initialization
    and runtime processing power for much faster downloads. This is very important
    for mobile games that are trying to compete via graphical fidelity.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# # Asynchronous Texture Uploading


    The last texture import option we haven’t covered is the **Read/Write Enabled**
    option. By default, this option is disabled, which is good, because this allows
    textures to make use of the Asynchronous Texture Uploading feature, which allows
    two benefits: the texture will be uploaded asynchronously from disk to RAM, and
    when the texture data is needed by the GPU, the transfer happens on the render
    thread, not the main thread. Textures will be pushed into a circular buffer, which
    pushes data to the GPU continuously so long as the buffer contains new data. If
    not, then it early-exits the process and waits until new texture data is requested.


    Ultimately, this reduces the time spent preparing the Render States for each frame
    and allows more CPU resources to be spent on gameplay logic, the Physics Engine,
    and so on. Of course, some time is still spent on the main thread preparing the
    Render State, but moving the texture uploading task to a separate thread saves
    a significant chunk of CPU time on the main thread.


    However, enabling read/write access to the texture essentially tells Unity we
    might be reading and editing this texture at any time. This implies that the GPU
    will need fresh access to it every time, so it will disable Asynchronous Texture
    Uploading for that texture; all uploading must occur on the main thread. We might
    want to enable this option for things such as simulating painting colors onto
    a canvas or writing image data from the internet into a premade texture, but the
    downside is that the GPU must always wait for any changes to be made to the texture
    before it can be uploaded since it cannot predict when those changes will happen.


    In addition, Asynchronous Texture Uploading only works for textures we explicitly
    imported into the project and that were present during build time, since the feature
    only works if the texture was packed together into special streamable assets.
    Therefore, any textures generated via `LoadImage(byte[])`, texture assets imported/downloaded
    from external locations, or loaded from a `Resources` folder via `Resources.Load()`
    (which all implicitly call `LoadImage(byte[])` themselves) will not be converted
    into streamable content, and thus will be unable to make use of Asynchronous Texture
    Uploading.


    The Unity documentation on Procedural Materials is fairly extensive, so it is
    recommended to work through the documentation for a clearer picture of how Substances
    work and how they can provide us with performance benefits. Check out the following
    Unity documentation page for more information on Procedural Materials: `http://docs.unity3d.
    com/Manual/ProceduralMaterials.html`.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'It is possible to tweak both the upper limit on the maximum allowed time to
    spend on

    Asynchronous Texture Uploads and the total circular buffer size Unity should use
    to push

    the textures we want to upload. These settings can be tweaked under Edit | Project

    Settings | Quality | Other and are named Async Upload Time Slice and Async Upload

    Buffer Size, respectively. We should set the Async Upload Time Slice value to
    the

    maximum number of milliseconds we want Unity to spend on Asynchronous Texture

    Uploads on the render thread. It might be wise to set the Async Upload Buffer
    Size value

    to the largest texture file we might need to use, plus a little extra buffer if
    multiple fresh

    textures are needed in the same frame. The circular buffer that texture data is
    copied into

    will expand as needed, but this is often costly. Since we probably already know
    ahead of

    time how large we need that circular buffer to be, we might as well set it to
    the maximum

    expected size to avoid potential frame drops when it needs to resize the buffer.


    # # Mesh and animation files


    Finally, let''s cover mesh and animation files. These file types are essentially
    large arrays of

    vertex and skinned bone data, and there are a variety of techniques we can apply
    to

    minimize file size, while keeping a similar, if not identical, appearance. There
    are also ways

    to lower the cost of rendering large groups of these objects through batching
    techniques.

    Let''s take a look at a series of performance-enhancing techniques we can apply
    to such files.


    # # Reduce polygon count


    This is the most obvious way to gain performance and should always be considered.
    In fact,

    since we cannot batch objects using Skinned Mesh Renderers, it''s one of the good
    ways of

    reducing CPU and GPU runtime overhead for animated objects.


    Reducing the polygon count is simple, straightforward, and provides both CPU and

    memory cost savings for the time required for artists to clean up the mesh. Much
    of an

    object''s detail is provided almost entirely by detailed texturing and complex
    shading in this

    day and age, so we can often get away with stripping away a lot of vertices on
    modern

    meshes and most users would be unable to tell the difference.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# # Tweak Mesh Compression


    Unity offers four different **Mesh Compression** settings for imported mesh files:
    **Off**, **Low**, **Medium**, and **High**. Increasing this setting will convert
    floating-point data into fixed values, reducing the accuracy in vertex position/Normal
    direction, simplifying vertex color information, and so on. This can have a noticeable
    effect on meshes that contain lots of small parts near one another, such as a
    fence or grate. If we''re generating meshes procedurally, we can achieve the same
    type of compression by calling the `Optimize()` method of a `MeshRenderer` Component
    (of course, this will take some time to complete).


    There are also two global settings found in **Edit | Project Settings | Player
    | Other Settings**, which can affect how mesh data is imported. These are named
    **Vertex Compression** and **Optimize Mesh Data**.


    We can use the **Vertex Compression** option to configure the type of data that
    will be optimized when we import a mesh file with **Mesh Compression** enabled,
    so if we want accurate Normal data (for lighting), but have less worry over positional
    data, then we can configure it here. Unfortunately, this is a global setting and
    will affect all imported meshes (although it can be configured on a per-platform
    basis since it is a **Player** setting).


    Enabling **Optimize Mesh Data** will strip away any data from the mesh that isn''t
    required by the Material(s) assigned to it. So, if the mesh contains tangent information,
    but the Shader never requires it, then Unity will ignore it during build time.


    In each case, the benefits are reducing the application''s disk footprint at the
    cost of extra time loading the mesh since extra time must be spent decompressing
    the data before it''s needed.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_168_0.png)


    3D mesh building/animation tools often provide their own built-in ways of automated
    mesh optimization in the form of estimating the overall shape and stripping the
    mesh down to fewer total polygons. This can cause significant loss of quality
    and should be tested vigorously if used.


    # # Use Read-Write Enabled appropriately


    The **Read-Write Enabled** flag allows changes to be made to the mesh at runtime
    either via Scripting or automatically by Unity during runtime, similar to how
    it is used for texture files. Internally, this means that it will keep the original
    mesh data in memory until we want to duplicate it and make changes dynamically.
    Disabling this option will allow Unity to discard the original mesh data from
    memory once it has determined the final mesh to use, since it knows it will never
    change.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# # Consider baked animations


    This tip will require changes in the asset through the 3D rigging and animation
    tool that we are using since Unity does not provide such tools itself. Animations
    are normally stored as key frame information where it keeps track of specific
    mesh positions and interpolates between them at runtime using skinning data (bone
    shapes, assignments, animation curves, and so on). Meanwhile, baking animations
    means effectively sampling and hardcoding each position of each vertex per-frame
    into the mesh/animation file without the need for interpolation and skinning data.


    Using baked animations can, sometimes, result in much smaller file sizes and memory
    overhead than blended/skinned animations for some objects since skinning data
    can take up a surprisingly large amount of space to store. This is most likely
    to be the case for relatively simple objects, or objects with short animations,
    since we would effectively be replacing procedural data with a hardcoded series
    of vertex positions. So, if the mesh''s polygon count is low enough where storing
    lots of vertex information is cheaper than skinning data, then we may see some
    significant savings through this simple change.


    If we use only a uniformly scaled version of a mesh throughout the entire game,
    then disabling this option will save runtime memory since we will no longer need
    the original mesh data to make further rescaled duplicates of the mesh (incidentally,
    this is how Unity organizes objects by scale factor when it comes to Dynamic Batching).
    Unity can, therefore, discard this unwanted data early since we will never need
    it again until the next time the application is launched.


    However, if the mesh often reappears at runtime with different scales, then Unity
    needs to keep this data in memory so that it can recalculate a new mesh more quickly,
    hence it would be wise to enable the **Read-Write Enabled** flag. Disabling it
    will require Unity to not only reload the mesh data each time the mesh is reintroduced,
    but also make the rescaled duplicate at the same time, causing a potential performance
    hiccup.


    Unity tries to detect the correct behavior for this setting at initialization
    time, but when meshes are instantiated and scaled in a dynamic fashion at runtime,
    we must force the issue by enabling this setting. This will improve instantiation
    speed of the objects, but cost some memory overhead since the original mesh data
    is kept around until it''s needed.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_169_0.png)


    > > Note that this potential overhead cost also applies when using the **Generate
    Colliders** option.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'In addition, how often the baked sample is taken can usually be customized
    by the exporting application. Different sample rates should be tested to find
    a good value where the key moments of the animation still shine-through what is
    essentially a simplified estimate.


    # # Combine meshes


    Forcefully combining meshes into a large, single mesh can be convenient to reduce
    Draw Calls, particularly if the meshes are too large for Dynamic Batching and
    don''t play well with other statically batched groups. This is essentially the
    equivalent of Static Batching, but performed manually, so sometimes it''s wasted
    effort if Static Batching could take care of the process for us.


    Beware that if any single vertex of the mesh is visible in the Scene, then the
    entire object will be rendered together as one whole. This can lead to a lot of
    wasted processing if the mesh is only partially visible most of the time. This
    technique also comes with the drawback that it generates a whole new mesh asset
    file that we must deposit into our Scene, which means any changes we make to the
    original meshes will not be reflected in the combined one. This results in a lot
    of tedious workflow effort every time changes need to be made, so if Static Batching
    is an option, it should be used instead.


    There are several tools available online, which can combine mesh files together
    for us in Unity. They are only an Asset Store or Google search away.


    # # Asset Bundles and Resources


    We touched upon the topic of Resources and Serialization in Chapter 2, Scripting
    Strategies, and it should be fairly clear that the Resource System can be a great
    benefit during prototyping, as well as during the early stages of our project,
    and can be used relatively effectively in games of limited scope.


    However, professional Unity projects should instead favor the Asset Bundle System.
    There are a number of reasons for this. Firstly, the Resource System is not very
    scalable when it comes to builds. All Resources are merged together into a single
    massive Serialized File binary data blob with an index list of where various assets
    can be found within it. This can be hard to manage, and take a long time to build,
    as we add more data to the list.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Secondly, the Resource System’s ability to acquire data from the Serialized
    File scales in an Nlog(N) fashion, which should make us very wary of increasing
    the value of N. Thirdly, the Resource System makes it unwieldy for our application
    to provide different asset data on a per-device basis, whereas Asset Bundles tend
    to make this matter trivial. Finally, Asset Bundles can be used to provide small,
    periodic custom content updates to the application, while the Resource System
    would require updates that completely replace the entire application to achieve
    the same effect.


    Asset Bundles share a lot of common functionality with Resources such as loading
    from files, loading data asynchronously, and unloading data we no longer need.
    However, they also offer much more functionality such as content streaming, content
    updates, and content generation and sharing. These can all be used to improve
    the performance of our application to great effect. We can deliver applications
    with much smaller disk footprints and have the user download additional content
    before or during gameplay, stream assets at runtime to minimize the initial loading
    time of the application, and provide more optimized assets to the application
    on a per-platform basis without the need to push a complete application overwrite
    to the user.


    Of course, there are downsides to Asset Bundles. They are much more complicated
    to set up and maintain than Resources, they’re more complicated to understand
    since they use a much more sophisticated system for accessing asset data than
    the Resources System, and making full use of their functionality (such as streaming
    and content updates) would require a lot of additional QA testing to make sure
    that server is delivering content properly, and that the game is reading and updating
    its content to match. Ergo, Asset Bundles are best used only when our team size
    is able to support the extra workload they require.


    A tutorial on the Asset Bundle system is beyond the scope of this book, but there
    are dozens of useful guides online and in the Unity Documentation.


    Check out the following Unity tutorial to find out more about the Asset Bundle
    system:


    https://unity3d.com/learn/tutorials/topics/best-practices/guide-assetbundles-
    and-resources.


    If you require further convincing, then the following Unity blog post from April
    2017 should help reveal how the Asset Bundle system can use memory more efficiently
    during runtime in ways that the Resources System cannot provide through memory
    pooling: https://blogs.unity3d.com/2017/04/12/asset-bundles-vs-resources-a- memory-showdown/.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # Summary


    There are many different opportunities that we can explore to achieve performance
    gains

    for our application just by tinkering with our imported assets. Alternatively,
    from another

    perspective, there are plenty of ways to ruin our application''s performance through
    asset

    mismanagement. Almost every single import configuration opportunity is a trade-off

    between one performance metric or workflow task and another. Typically, this means

    saving disk footprint via compression at the expense of CPU at runtime to decompress
    the

    data, or faster access while reducing the quality level of the final presentation.
    So, we must

    remain vigilant and only pick the right techniques for the right assets for the
    right reasons.


    This concludes our exploration of improving performance through art asset manipulation.

    In the next chapter, we will be investigating how to improve our usage of Unity''s
    Physics

    Engine.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# # 5 Faster Physics


    Each of the performance-enhancing suggestions we''ve explored thus far have been
    primarily centered on reducing resource costs and avoiding frame rate issues.
    However, at its most fundamental level, seeking peak performance means improving
    the user experience. This is because every frame rate hiccup, every crash, and
    every system requirement that is too costly for a given market ultimately detracts
    from the quality of the product. Physics Engines are in a unique category of subsystems
    whose behavior and consistency contributes a major factor toward product quality,
    and spending the time to improve its behavior is often worth the cost.


    If important collision events get missed, the game freezes while it calculates
    a complex physics event, or the player falls through the floor, then these have
    an obvious and significant negative impact on the quality of gameplay. A few glitches
    are often bearable, but continuous problems will get in the way of gameplay. This
    often results in pulling the player out of the experience, and it''s a coin-toss
    whether the user finds it inconvenient, obnoxious, or hilarious. Unless our game
    is specifically targeting the Comedy Physics genre (games such as QWOP or Goat
    Simulator), these are situations we should strive to avoid.


    Some games may not use physics at all, whereas others require the Physics Engine
    to handle a huge number of tasks during gameplay, such as collision detection
    between hundreds of objects, Trigger Volumes to initiate cutscenes, Raycasting
    for player attacks and UI behavior, gathering lists of objects in a given region,
    or even just using physics as eye candy with lots of physical particles flying
    around. Its importance also varies depending on the type of game being created.
    For example, it is essential in platformer and action games to tune the physics
    properly--how the player character reacts to input and how the world reacts to
    the player character are two of the most important aspects that make the game
    feel responsive and fun. Whereas, accurate physics may be somewhat less important
    in **Massively Multiplayer Online (MMO)** games, which tend to have limited physics
    interaction.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Therefore, in this chapter, we will cover ways to reduce CPU spikes, overhead,
    and memory consumption through Unity''s Physics Engine, but also include ways
    to alter physics behavior with the aim of improving, or at least maintaining,
    gameplay quality while optimizing performance. In this chapter, we will cover
    the following areas:


    +   - Understanding how Unity''s Physics Engine works:

    +     - Timesteps and FixedUpdates

    +     - Collider types

    +     - Collisions

    +     - Raycasting

    +     - Rigidbody active states

    +   - Physics performance optimizations:

    +     - How to structure Scenes for optimal physics behavior

    +     - Using the most appropriate types of Collider

    +     - Optimizing the Collision Matrix

    +     - Improving physics consistency and avoiding error-prone behavior

    +     - Ragdolls and other Joint-based objects


    # # Physics Engine internals


    Unity technically features two different Physics Engines: Nvidia''s PhysX for
    3D physics, and the Open Source project Box2D for 2D physics. However, their implementations
    are highly abstracted, and from the perspective of the higher-level Unity API
    that we configure through the main Unity Engine, both Physics Engine solutions
    operate in a functionally identical fashion.


    In either case, the more we understand about Unity''s Physics Engines, the more
    sense we can make of possible performance enhancements. So, first we''ll cover
    some theory about how Unity implements these systems.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# # Physics and time


    Physics Engines generally operate under the assumption that time advances by fixed
    values, and both of Unity''s Physics Engines operate in this manner. Each of these
    iterations is known as the **Timestep**. The Physics Engine will only resolve
    each Timestep using very specific values of time, which is independent of how
    much time it took to render the previous frame. This is known in Unity as the
    Fixed Update Timestep, and it is set to a value of 20 milliseconds by default
    (50 updates per second).


    It can be very difficult to generate consistent results for collisions and forces
    between two different computers if a Physics Engine uses a variable timestep due
    to differences in architecture (in how floating-point values are represented)
    as well as latency between clients. Such Physics Engines tend to generate very
    inconsistent results between multiplayer clients or during recorded replays.


    The following diagram shows an important snippet of the Unity Order of Execution
    diagram:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The full Order of Execution diagram can be found at http://docs.unity3d.com/Manual/
    ExecutionOrder.html.


    As we can see in the preceding diagram, Fixed Updates are processed just before
    the Physics Engine performs its own update and the two are inextricably linked.
    The process begins with determining whether enough time has passed to begin the
    next Fixed Update. Once this is determined, the outcome of resolving it will vary,
    depending on how much time has passed since the last Fixed Update.


    If enough time has passed, then the Fixed Update processes will invoke all `FixedUpdate()`
    callbacks defined across all active MonoBehaviours in the Scene, followed by any
    Coroutines tied to Fixed Updates (specifically those that `yield` to `WaitForFixedUpdate`).
    Note that there is no guarantee of execution order for methods invoked during
    either of these processes, so we should never write code under this assumption.
    Once these tasks are done, the Physics Engine can begin to process the current
    timestep and invoke any necessary Trigger and Collider callbacks.


    Conversely, if too little time has passed since the last Fixed Update (that is,
    less than 20 milliseconds), then the current Fixed Update is skipped, and all
    of the tasks listed previously don''t happen during the current iteration. At
    this point, input, gameplay logic, and rendering will be allowed to happen as
    normal. Once this activity is complete, Unity checks whether the next Fixed Update
    is required.


    At high frame rates, rendering updates are likely to complete multiple times before
    the Physics Engine gets a chance to update itself. This process repeats itself
    during runtime and effectively gives Fixed Updates and the Physics Engine a higher
    priority over rendering while also forcing the physics simulation into a fixed
    frame rate.


    In order to ensure that objects move smoothly between Fixed Updates, Physics Engines
    (including Unity''s) interpolate the visible location of each object between where
    it was during the previous state and where it should be after resolving the current
    state based on how much time remains until the next Fixed Update. This interpolation
    ensures that objects appear to move smoothly despite the fact that their physical
    positions, velocities, and so on are being updated less frequently than the render
    frame rate.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_176_0.png)'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'The `FixedUpdate()` callback is a useful place to define any gameplay behavior
    that we want to be frame-rate independent. AI calculations are commonly resolved
    in Fixed Updates since they tend to be easier to work with if we assume a fixed
    update frequency.


    # # Maximum Allowed Timestep


    It is important to note that if a lot of time has passed since the last Fixed
    Update (for example, the game froze momentarily), then Fixed Updates will continue
    to be calculated within the same Fixed Update loop until the Physics Engine has
    *caught up* with the current time. For example, if the previous frame took 100
    ms to render (for example, a sudden CPU spike caused the main thread to block
    for a long time), then the Physics Engine will need to be updated five times.
    The `FixedUpdate()` method will, therefore, be called five times before `Update()`
    can be called again due to the default Fixed Update Timestep of 20 milliseconds.
    Of course, if there is a lot of physics activity to process during these five
    Fixed Updates, such that it takes more than 20 milliseconds to resolve them all,
    then the Physics Engine will need to invoke a sixth update.


    Consequently, it''s possible during moments of heavy physics activity that the
    Physics Engine takes more time to process a Fixed Update than the amount of time
    it is simulating. For example, if it took 30 ms to process a Fixed Update simulating
    20 ms of Gameplay, then it has fallen behind, requiring it to process more Timesteps
    to try and keep up, but this could cause it to fall behind even further, requiring
    it to process even more Timesteps, and so on. In these situations the Physics
    Engine is never able to escape the Fixed Update loop and allow another frame to
    render. This problem is often known as the **spiral of death**. However, to prevent
    the Physics Engine from locking up our game during these moments, there is a maximum
    amount of time that the Physics Engine is allowed to process each Fixed Update
    loop. This threshold is called the **Maximum Allowed Timestep**, and if the current
    batch of Fixed Updates takes too long to process, then it will simply stop and
    forgo further processing until the next render update completes. This design allows
    the Rendering Pipeline to at least render the current state and allow for user
    input and gameplay logic to make some decisions during rare moments where the
    Physics Engine has gone ballistic (pun intended).


    This setting can be accessed through **Edit | Project Settings | Time | Maximum
    Allowed Timestep**.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# # Physics updates and runtime changes


    When the Physics Engine processes a given timestep, it must move any active Rigidbody
    objects (GameObjects with a Rigidbody Component), detect any new collisions, and
    invoke the collision callbacks on the corresponding objects. The Unity documentation
    makes an explicit note that changes to Rigidbody objects should be handled within
    FixedUpdate() and other physics callbacks for exactly this reason. These methods
    are tightly coupled with the update frequency of the Physics Engine as opposed
    to other parts of the Game Loop, such as Update().


    This means that callbacks such as FixedUpdate() and OnTriggerEnter() are safe
    places to make Rigidbody changes, whereas methods such as Update() and Coroutines
    yielding on WaitForSeconds or WaitForEndOfFrame are not. Ignoring this advice
    could cause unexpected physics behavior, as multiple changes may be made to the
    same object before the Physics Engine is given a chance to catch and process all
    of them.


    It''s particularly dangerous to apply forces or impulses to objects in Update()
    callbacks without taking into account the frequency of those calls. For instance,
    applying a 10- Newton force each Update while the player holds down a key would
    result in completely different resultant velocity between two different devices
    than if we did the same thing in Fixed Update since we can''t rely on the number
    of Update() calls being consistent. However, doing so in a FixedUpdate() callback
    will be much more consistent. Therefore, we must ensure that all physics-related
    behavior is handled in the appropriate callbacks or we will risk introducing some
    especially confusing gameplay bugs that are very hard to reproduce.


    It logically follows that the more time we spend in any given Fixed Update iteration,
    the less time we have for the next gameplay and rendering pass. Most of the time
    this results in minor, unnoticeable background processing tasks, since the Physics
    Engine barely has any work to do, and the FixedUpdate() callbacks have a lot of
    time to complete their work. However, in some games, the Physics Engine could
    be performing a lot of calculations during each and every Fixed Update. This kind
    of bottlenecking in physics processing time will affect our frame rate, causing
    it to plummet as the Physics Engine is tasked with greater and greater workloads.
    Essentially, the Rendering Pipeline will try to proceed as normal, but whenever
    it''s time for a Fixed Update, in which the Physics Engine takes a long time to
    process, the Rendering Pipeline would have very little time to generate the current
    display before the frame is due, causing a sudden stutter. This is in addition
    to the visual effect of the Physics Engine stopping early because it hit the Maximum
    Allowed Timestep. All of this together would generate a very poor user experience.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Hence, in order to keep a smooth and consistent frame rate, we will need to
    free up as much time as we can for rendering by minimizing the amount of time
    the Physics Engine takes to process any given timestep. This applies in both the
    best-case scenario (nothing moving) and worst-case scenario (everything smashing
    into everything else at once). There are a number of time-related features and
    values we can tweak within the Physics Engine to avoid performance pitfalls such
    as these.


    # # Static Colliders and Dynamic Colliders


    There is a rather extreme namespace conflict with the terms _static_ and _dynamic_
    in Unity. When _static_ is used, it normally means that the object or process
    under discussion is not moving, remains unchanged, or exists in only one location,
    whereas _dynamic_ simply means the opposite--objects or processes that tend to
    move or change. However, it''s important to remember that each of these are separate
    topics and usage of the terms _static_ and _dynamic_ mean something different
    in each case. We have already introduced the **Static** subflags for `GameObjects`,
    the Dynamic Batching and Static Batching systems, and the concepts of Static classes,
    `static` variables, and `static` functions in the C# language. So, just to be
    extra-confusing, Unity also has the concept of Static and Dynamic Colliders.


    Dynamic Colliders simply mean `GameObjects` that contain both a `Collider` Component
    (which could be one of several types) and a `Rigidbody` Component. By attaching
    a Rigidbody to the same object as a Collider, the Physics engine will treat that
    Collider as the bounding volume of a physical object that must react to outside
    forces (such as gravity) and collisions with other Rigidbodies. If we collide
    one Dynamic Collider into another, they will both react based on Newton''s Laws
    of Motion (or at least as best as a computer using floating-point arithmetic is
    capable of).


    We can also have Colliders that do not have a `Rigidbody` Component attached,
    and these are called Static Colliders. These effectively work as invisible barriers
    that Dynamic Colliders can collide into, but the Static Collider will not react
    in response. To think of it another way, imagine objects without a `Rigidbody`
    Component as having infinite mass. No matter how hard you throw a rock into an
    object of infinite mass, it will never move, but you can still expect the rock
    to react like it just hit a solid wall. This makes Static Colliders ideal for
    world barriers and other obstacles that must not move.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'The Physics Engine automatically separates Dynamic Colliders and Static Colliders
    into two different data structures, each optimized to handle the types of Collider
    present. This helps to simplify future processing tasks since, for example, there''s
    no point resolving collisions and impulses between two Static Colliders.


    # # Collision detection


    There are three settings for collision detection in Unity, which can be configured
    in a `RigidBody` Component''s **Collision Detection** property: **Discrete**,
    **Continuous**, and **ContinuousDynamic**. The **Discrete** setting enables Discrete
    collision detection, which effectively teleports objects a small distance every
    timestep based on their velocity and how much time has passed. Once all the objects
    have been moved, it then performs a bounding volume check for any overlaps, treats
    them as collisions, and resolves them based on their physical properties and how
    they overlap. This method risks collisions being missed if small objects move
    too quickly.


    The following image shows how Discrete collision detection works to catch two
    objects as they teleport from one location to the next:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_180_0.png)


    Either of the remaining settings will enable Continuous collision detection, which
    works by interpolating Colliders from their starting and ending positions for
    the current timestep and checking for any collisions along the way. This reduces
    the risk of missed collisions and generates a more accurate simulation at the
    expense of a significantly greater CPU overhead compared to Discrete collision
    detection.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The **Continuous** setting enables Continuous collision detection only between
    the given Collider and Static Colliders. Collisions between the same Collider
    and Dynamic Colliders will still make use of Discrete collision detection. Meanwhile,
    the **ContinuousDynamic** setting enables Continuous collision detection between
    the Collider and all Static and Dynamic Colliders, making it the most expensive
    in terms of resources.


    The following diagram shows how the Discrete and Continuous collision detection
    methods work for a pair of small, fast-moving objects:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_181_0.png)


    This is an extreme example for the sake of illustration. In the case of Discrete
    collision detection, we can observe that the objects are teleporting a distance
    around four times their own size in a single timestep, which would typically only
    happen with very small objects with very high velocities, and is, hence, very
    rare if our game is running optimally. In the overwhelming majority of cases,
    the distances the objects travel in a single 20-millisecond timestep are much
    smaller relative to the size of the object, and so the collision is easily caught
    by Discrete collision detection methods.


    # ## Collider types


    There are four different types of 3D Colliders in Unity. In order of the lowest
    performance cost to the greatest, they are Sphere, Capsule, Box, and Mesh Colliders.
    The first three Collider types are often called _primitives_ and maintain very
    specific shapes, although they can generally be scaled in different directions
    to meet certain needs. Mesh Colliders can, however, be customized to a particular
    shape depending on the assigned mesh. There are also three types of 2D Colliders--Circle,
    Box, and Polygon--that are functionally similar to Sphere, Box, and Mesh Colliders,
    respectively. All of the following information is essentially transferable to
    the equivalent 2D shape.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Note that we can also generate cylindrical 3D objects in Unity, but this is
    only for its graphical representation. Autogenerated Cylinder shapes use Capsule
    Colliders to represent their physical bounding volume, which may not create the
    expected physics behavior.


    In addition, there are two varieties of Mesh Collider: **Convex** and **Concave**.
    The difference is that a Concave shape features at least one internal angle (an
    angle between two inside edges of the shape) of greater-than 180 degrees. To illustrate
    this, the following diagram shows the difference between Convex and Concave shapes:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_182_0.png)


    An easy way to remember the difference between a Convex and Concave shape is that
    a Concave shape has at least one _cave_ within it.


    Both Mesh Collider types use the same Component (a `MeshCollider` Component).
    The type of Mesh Collider that gets generated is toggled using the **Convex**
    checkbox. Enabling this option will allow the object to collide with all primitive
    shapes (Spheres, Boxes, and so on) as well as other Mesh Colliders with **Convex**
    enabled. In addition, if the **Convex** checkbox is enabled for a Mesh Collider
    with a Concave shape, then the Physics Engine will automatically simplify it,
    generating a Collider with the nearest Convex shape it can. In the preceding example,
    if we imported the Concave mesh on the right and enable the **Convex** checkbox,
    it would generate a Collider shape closer to the Convex shape on the left. In
    either case, the Physics Engine will attempt to generate a Collider that matches
    the shape of the attached mesh with an upper limit of 255 vertices. If the target
    mesh has more vertices than this, it will throw an error during mesh generation.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Collider Components also contain the `IsTrigger` property, allowing them to
    be treated as nonphysical objects, but still invoke physics events when other
    Colliders enter or leave them. These are called Trigger Volumes. Normally, a Collider''s
    `OnCollisionEnter()`, `OnCollisionStay()`, and `OnCollisionExit()` callbacks are
    called when another Collider touches, keeps touching (each timestep), or stops
    touching it, respectively. However, when the Collider is used as a Trigger Volume,
    the `OnTriggerEnter()`, `OnTriggerStay()`, and `OnTriggerExit()` callbacks will
    be used instead.


    Note that due to the complexity of resolving inter-object collisions, Concave
    Mesh Colliders cannot also be Dynamic Colliders. Concave shapes can only be used
    as Static Colliders or Trigger Volumes. If we attempt to add a `Rigidbody` Component
    to a Concave Mesh Collider, Unity will simply ignore it.


    # # The Collision Matrix


    The Physics Engine features a Collision Matrix that defines which objects are
    allowed to collide with which other objects. Objects that do not fit this matrix
    are automatically ignored by the Physics Engine when the time comes to resolve
    bounding volume overlaps and collisions. This saves on physics processing during
    collision detection stages and also allows the objects to move through one another
    without any collisions taking place.


    The Collision Matrix can be accessed through **Edit | Project Settings | (Physics
    / Physics2D) | Layer Collision Matrix**.


    The Collision Matrix system works through Unity''s Layer system. The matrix represents
    every possible Layer-to-Layer combination that might be possible, and enabling
    a checkbox means that Colliders in both of those Layers will be checked during
    the collision detection phase. Note that there''s no way to allow only one of
    the two objects to respond to the collision. If one Layer can collide with another,
    then they must both respond to the collision. However, Static Colliders are an
    exception since they aren''t allowed to respond physically to collisions (although
    they still receive the `OnCollision...()` callbacks).


    Note that we are limited to only 32 total Layers for our entire project (since
    the Physics Engine uses a 32-bit bitmask to determine inter-Layer collision opportunities),
    so we must organize our objects into sensible Layers that will extend throughout
    the entire lifetime of the project. If, for whatever reason, 32 Layers are not
    enough for our project, then we might need to find cunning ways to reuse Layers
    or remove Layers that aren''t necessary.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# # Rigidbody active and sleeping states


    Every modern Physics Engine shares a common optimization technique, whereby objects
    that have come to rest have their internal state changed from an active state
    to a sleeping state. While a Rigidbody is in the sleeping state, little-to-no
    processor time will be spent during Fixed Updates to update the object until it
    has been awoken by an external force or collision event.


    The value of measurement that is used to determine what _at rest_ means tends
    to vary among different Physics Engines; it could be calculated using linear and
    rotational speed, kinetic energy, momentum, or some other physical properties
    of the Rigidbody. Both of Unity''s Physics Engines work by evaluating the object''s
    _mass-normalized-kinetic-energy_, which essentially boils down to _the magnitude
    of its velocity-squared_.


    If the object''s velocity has not exceeded some threshold value after a short
    time, then the Physics Engine will assume that the object will no longer need
    to move again until it has undergone a new collision, or a new force has been
    applied to it. Until then, the sleeping object will maintain its current position.
    Setting the threshold value too low would mean objects are much less likely to
    go to sleep, so we will keep paying a small processing cost within the Physics
    Engine every Fixed Update, even though it is not doing anything important. Meanwhile,
    setting the threshold value too high would mean slow-moving objects will appear
    to jerk to a sudden stop once the Physics Engine decides that they need to go
    to sleep. The threshold value that controls the sleeping state can be modified
    under **Edit | Project Settings | Physics | Sleep Threshold**. We can also get
    a count of the total number of active Rigidbody objects from the **Physics Area**
    of the **Profiler** window.


    Note that sleeping objects are not removed entirely from the simulation. If a
    moving Rigidbody approaches the sleeping object, then it must still perform checks
    to see whether nearby objects have collided with it, which would reawaken the
    sleeping object, reintroducing it to the simulation for processing.


    # # Ray and object casting


    Another common feature of Physics Engines is the ability to _cast a ray_ from
    one point to another and generate collision information with one or more of the
    objects in its path. This is known as **Raycasting**. It is pretty common to implement
    several gameplay mechanics through Raycasting, such as firing a gun. This is typically
    implemented by performing Raycasts from the player to the target location and
    finding any viable targets in its path (even if it''s just a wall).'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'We can also obtain a list of targets within a finite distance of a fixed point
    in space using a `Physics.OverlapSphere()` check. This is typically used to implement
    area-of-effect gameplay features, such as grenade or fireball explosions. We can
    even cast entire objects forward in space using `Physics.SphereCast()` and `Physics.CapsuleCast()`.
    These methods are often used to simulate wide laser beams, or if we simply want
    to see what would be in the path of a moving character.


    # # Debugging Physics


    Physics bugs usually fall into two categories: an object pair collided/didn''t
    collide when it shouldn''t have/should have or the objects collided but something
    unexpected happened after the fact. The former case is generally easier to debug;
    it is often either due to mistakes in the Collision Matrix, incorrect Layers used
    in Raycasting, or object Colliders being the wrong size or shape. The latter case
    is often much more difficult to resolve because of three big problems:


    +   - Determining which collided objects caused the issue

    +   - Determining the conditions of the collision just prior to resolution

    +   - Reproducing the collision


    Any of these three pieces of information would make resolution much easier, but
    they can all be difficult to obtain in some circumstances.


    The Profiler provides some measure of information in the **Physics** and **Physics
    (2D) Areas** (for 3D and 2D physics, respectively), which can be moderately useful.
    We can get a measure of how much CPU activity is being spent on all Rigidbodies
    and groups of Rigidbodies isolated to different types such as Dynamic Colliders,
    Static Colliders, Kinematic objects, Trigger Volumes, Constraints (used to simulate
    hinges and other connected physics objects), and Contacts. The **Physics 2D Area**
    contains a little more information such as the number of sleeping and active Rigidbodies
    and how long processing the Timestep took. The **Detailed Breakdown View** provides
    even more information in both cases. This information helps us keep an eye on
    Physics performance, but it doesn''t tell us much about what went wrong in the
    event we find a bug in our physics behavior.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'A tool that is better suited to the task of helping us debug physics issues
    is the **Physics Debugger**, which can be opened via **Window | Physics Debugger**.
    This tool can help us filter out different types of Colliders from the **Scene**
    window to give us a better idea of which objects collided with one another. Of
    course, this does not help too much in determining the conditions of the problem
    and reproducing issues.


    > Note that settings in the Physics Debugger do not affect object visibility in
    the **Game** window.


    Unfortunately, there isn''t much secret advice to be given for the remaining problems.
    Catching information about collisions before or when they happen normally involves
    a lot of targeted breakpoints in an `OnCollisionEnter()` or `OnTriggerEnter()`
    callback to catch the problem in the act and using step-through debugging until
    the source of the issue becomes clear. As a last resort, we can add `Debug.Log()`
    statements to log important information just before the problem occurs, although
    this can be a frustrating exercise because we sometimes don''t know what information
    we need to log, or which objects to log from, and so we end up adding logs to
    everything.


    Another frequent source of headaches is trying to reproduce physics problems.
    Reproducing collisions is always a challenge due to the nondeterministic nature
    between user input (normally handled in `Update()`) and physics behavior (handled
    in `FixedUpdate()`). Even though physics timesteps occur with relative regularity,
    the simulation will have different timings on each `Update()` between one session
    and the next, so even if we recorded user input timings and automatically replayed
    the Scene, trying to apply the recorded inputs at the moments they were applied
    isn''t going to be exactly the same every time, and so we may not get the exact
    same result.


    Moving user input handling to `FixedUpdate()` is possible, and helpful, if user
    input controls Rigidbody behavior such as applying forces in different directions
    while the player holds down certain keys. However, this will tend to lead to input
    latency or _lag_, since it will be anywhere from 0 to 20 milliseconds (based on
    the Fixed Update timestep frequency) before the Physics Engine can respond to
    the key being pressed. Instantaneous inputs, such as jumping or activating an
    ability, are always best handled in `Update()` in order to avoid missing keystrokes.
    Helper functions such as `Input.GetKeyDown()` would only return `true` for the
    frame the player presses the given key and will return `false` during the next
    `Update()`. If we tried to read a _key-down_ event during a `FixedUpdate()`, we
    would never know that the user pressed the key, unless a physics timestep just
    happens to occur between these two frames. This can be worked around with an input
    buffering/tracking system, but this is certainly more trouble than its worth if
    we''re implementing it merely to replicate a physics bug.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Ultimately, experience and persistence are the only good ways to debug most
    physics problems. The more experience we have with the Physics Engine, the more
    intuition we will have to find the source of the problem, but unfortunately they
    almost always take a lot of time to resolve due to their limited reproducibility
    and sometimes nebulous behavior, and so we should expect physics issues to take
    longer than most logic bugs to resolve and plan extra time before it can be resolved.


    # # Physics performance optimizations


    Now that we have an understanding of the majority of features of the Unity Physics
    Engine, we can cover several optimization techniques to improve our game''s physics
    performance.


    # ## Scene setup


    Firstly, there are a number of best practices we can apply to our Scenes to improve
    consistency of the physics simulation. Note that several of these techniques will
    not necessarily improve CPU or memory usage, but they will result in a reduced
    likelihood of instability from the Physics Engine.


    # ## Scaling


    We should try to keep all physics object scales in the world as close to `(1,1,1)`
    as we possibly can. By default, Unity assumes that we are trying to simulate gameplay
    equivalent to being on the surface of the Earth. The force of gravity at the surface
    of the Earth is 9.81 meters-per-second-squared, and hence the default gravity
    value is set to `-9.81` to match. 1 unit in Unity''s world space is equivalent
    to 1 meter, and the negative sign means that it will pull the object downward.
    Our object sizes should reflect our effective world scale, since scaling them
    too large will cause gravity to appear to move the objects much more slowly than
    we would expect. If all of our objects are scaled five times too big, then gravity
    will appear to be five times weaker. The converse is also true; scaling objects
    too small will make them appear to fall too quickly and will not seem realistic.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'We can tweak the world''s implied scale by modifying the strength of gravity
    under **Edit | Project Settings | Physics / Physics 2D | Gravity**. However, note
    that any floating-point arithmetic will be more accurate with values closer to
    0, so if we have some objects that have scale values far above `(1, 1, 1)`, even
    if they match the implied world-scale, then we could still observe erratic physics
    behavior. So, early in the project, we should import and scale our most common
    physics objects around a scale value of `(1, 1, 1)` and then adjust the value
    of gravity to match. This will give us a reference point to work with as we introduce
    new objects.


    # # Positioning


    Similarly, keeping all objects close to `(0, 0, 0)` in the world-space position
    will result in better floating-point accuracy, improving the consistency of the
    simulation. Space simulator and free-running games try to simulate incredibly
    large spaces and typically use a trick of either secretly teleporting the player
    back toward the center of the world or fixing their position there, in which case,
    either volumes of space are compartmentalized so that physics calculations are
    always calculated with values close to 0, or everything else is moved to simulate
    travel, and the player''s motion is only an illusion.


    Most games are not at risk of introducing floating-point inaccuracy, since most
    game levels tend to last around 10 to 30 minutes, which doesn''t give the player
    much time to travel absurdly long distances, but if we''re working with exceptionally
    large Scenes or asynchronously loading Scenes throughout the course of the entire
    game to the point that the player travels tens of thousands of meters, then we
    may start to notice some strange physics behavior the further they travel.


    So, unless we''re already far too deep into our project such that changing and
    retesting everything at a late stage would be too much hassle, we should try to
    keep all of our physics objects close to `(0, 0, 0)`. Plus, this is good practice
    for our project workflow, as it makes it much quicker to find objects and tweak
    things in our game world.


    # # Mass


    Mass is stored as a floating-point value under a `Rigidbody` Component''s `mass`
    property, and documentation on its usage has changed a fair amount over the years
    due to updates in its Physics Engine. In the recent versions of Unity (late Unity
    5 and early Unity 2017), we are essentially free to choose whatever we want the
    value `1.0` to represent and then scale other values appropriately.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Traditionally, a mass value of `1.0` is used to represent a mass of 1 kilogram,
    but we could decide that a human being has a mass of `1.0` (~130 kilogram), in
    which case, a car would be given a mass value of `10.0` (~1,300 kilogram), and
    physics collisions will resolve similarly to what we expect. The most important
    part is the relative difference in mass, which allows collisions between these
    objects to look believable without stressing the engine too much. Floating-point
    precision is also a concern, so we don''t want to use large mass values that are
    too ridiculous.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_189_0.png)


    Note that if we intend to use Wheel Colliders, their design assumes that a mass
    of `1.0` represents 1 kilogram, so we should assign our mass values appropriately.


    Ideally, we would maintain mass values around `1.0` and ensure a maximum relative
    mass- ratio of around `100`. If two objects collide with a mass-ratio much greater
    than this, then large momentum differences can turn into sudden, immense velocity
    changes from the impulse, resulting in some unstable physics and potential loss
    of floating-point precision. Object pairs that have a significant scale difference
    should probably be culled with the Collision Matrix to avoid problems (more on
    this shortly).


    ![](img/da79484c9b30dc915216dbc5454a9bbf_189_1.png)


    Improper mass-ratios are the most common cause for physics instability and erratic
    behavior in Unity. This is particularly true when using Joints for objects such
    as Ragdolls.


    Note that the force of gravity at the center of the Earth affects all objects
    equally, regardless of their mass, so it does not matter if we consider a mass
    property value of `1.0` to be the mass of a rubber ball or the mass of a warship.
    There''s no need to adjust the force of gravity to compensate. What does matter,
    however, is the amount of air resistance the given object undergoes while falling
    (which is why a parachute falls slowly). So, to maintain realistic behavior, we
    may need to customize the `drag` property for such objects or customize the force
    of gravity on a per-object basis. For example, we could disable the **Use Gravity**
    checkbox and apply our own custom gravitational force during Fixed Updates.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# # Use Static Colliders appropriately


    As mentioned previously, the Physics Engine automatically generates two separate
    data

    structures to contain Static Colliders separately from Dynamic Colliders. Unfortunately,
    if

    new objects are introduced into the Static Collider data structure at runtime,
    then it must be

    regenerated, similar to calling `StaticBatchingUtility.Combine()` for Static Batching.

    This is likely to cause a significant CPU spike. This makes it vital that we avoid
    instantiating

    new Static Colliders during gameplay.


    In addition, merely moving, rotating, or scaling Static Colliders also triggers
    this

    regeneration process and should be avoided. If we have Colliders that we wish
    to move

    around without reacting to other objects colliding with them in a physical way,
    then we

    should attach a Rigidbody to make it a Dynamic Collider and enable the **Kinematic**

    flag. This flag prevents the object from reacting to external impulses from inter-object

    collisions, similar to Static Colliders, except the object can still be moved
    through its

    `Transform` Component or through forces applied to its `Rigidbody` Component (preferably

    during Fixed Updates). Since a Kinematic object won''t respond to other objects
    hitting it, it

    will tend to simply push other Dynamic Colliders out of its way as it moves.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_190_0.png)


    It''s for this reason that player character objects are often made into

    Kinematic Colliders.


    # # Use Trigger Volumes responsibly


    As mentioned previously, we can treat our physics objects as normal Colliders
    or as Trigger

    Volumes. An important distinction between these two types is that the `OnCollider...()`

    callbacks provide a `Collision` object as a parameter to the callback, which contains
    useful

    information such as the exact location of collision (useful to position a Particle
    Effect) and

    the contact normal (useful if we want to manually move the object after the collision).

    Whereas, the `OnTrigger...()` callbacks do not provide this kind of information.


    As a result, we should not try to use Trigger Volumes for collision-reactive behavior
    since

    we won''t have enough information to make the collision appear accurate. Trigger
    Volumes

    are best used for their intended purpose of tracking when an object enters/exits
    a specific

    area, such as dealing with damage while a player stays in a lava pit, triggering
    a cutscene

    when a player enters a building, and initiating asynchronous loading/unloading
    of a Scene

    when the player approaches/moves far enough away from another major area.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'If contact information is absolutely needed for a Trigger Volume collision,
    then common

    workarounds are to do any of the following:


    +   • Generate a rough estimate for the contact point by halving the distance
    between

    +   the Trigger Volume and colliding objects'' center of mass (this assumes that

    +   they''re of roughly equal size)

    +   • Perform a Raycast upon collision from the center of the Trigger Volume to
    the

    +   center of mass of the colliding object (works best if both of the objects
    are

    +   spherical)

    +   • Create a non-Trigger Volume object, give it an infinitesimally small mass
    (so that

    +   the colliding object is barely effected by its presence), and immediately
    destroy it

    +   upon collision (since collision with such a large mass differential will probably

    +   send this small object into orbit)


    Of course, each of these approaches have their drawbacks; limited physical accuracy,
    extra

    CPU overhead during collision, and/or additional Scene setup (and rather hacky-looking

    collision code), but they can be useful in a pinch.


    # # Optimize the Collision Matrix


    As we know, the Physics Engine''s Collision Matrix defines which objects assigned
    to certain

    Layers are allowed to collide with objects assigned to other Layers, or to put
    it more

    succinctly, which object collision pairs are even considered viable by the Physics
    Engine.

    Every other object-Layer pair is simply ignored by the Physics Engine, which makes
    this an

    important avenue for minimizing Physics Engine workload since it reduces the number
    of

    bounding volume checks that must be performed each and every Fixed Update and
    how

    many collisions would ever need to be processed during the lifecycle of the application

    (which would save on battery life for a mobile device).


    > Note that the Collision Matrix can be accessed through Edit | Project

    > Settings | Physics (or Physics2D) | Layer Collision Matrix.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The following screenshot shows a common Collision Matrix for an arcade shooter
    game:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_192_0.png)


    In the preceding example, we have objects flagged as **Player**, **Enemies**,
    **Player Missiles**,

    **Enemy Missiles**, and **Powerups**, and we have minimized the number of possible
    inter-

    object collisions for the Physics Engine to check.


    Starting with the first row of checkmarks labeled **Player**, we want the **Player**
    object to be

    able to collide with **World** objects, pickup **Powerups**, get hit by **Enemy
    Missiles**, and

    collide with **Enemies**. However, we do not want them to collide with their own
    **Player**

    **Missiles** or themselves (although there would probably only be one object in
    this Layer,

    anyway). Hence, the enabled checkboxes in the **Player** row reflect these requirements.
    We

    only want **Enemies** to collide with **World** objects and **Player Missiles**,
    so these are checked

    in the **Enemies** row. Note that the **Player**-to-**Enemies** collision pair
    would have been

    handled already by the previous row; hence there is no need for it to appear in
    the **Enemies**

    row. We also want both **Player Missiles** and **Enemy Missiles** to explode when
    they hit

    **World** objects, so these are marked, and finally we don''t care about **Powerups**
    colliding

    with anything but the **Player**, nor do we want **World** objects to collide
    with other **World**

    objects, so no checkboxes are marked on the final two rows.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'At any given moment, we might have a single **Player** object, 2 **Powerups**,
    7 **Player Missiles**,

    10 **Enemies**, and 20 **Enemy Missiles**, which is 780 potential collision pairs
    (this is calculated

    as each of 40 different objects could collide with 39 other ones, giving us 1,560
    potential

    collision pairs, but then we divide the total by 2 to ignore duplicate pairs).
    By merely

    optimizing this matrix, we have reduced this to less than 100, for an almost 90%
    reduction

    in potential collision checks. Of course, the Unity Physics Engine efficiently
    culls away

    many of these object pairs if they are too far apart from one another, hence there
    is little to

    no chance that they could collide (this is calculated during a hidden process
    known as

    **Broadphase Culling**), so the actual savings will probably never be this good,
    but it will free

    up some CPU cycles with next to no effort. Another big benefit is that it simplifies
    our game

    logic coding; there''s no need to figure out what''s supposed to happen if **Powerups**
    and

    **Enemy Missiles** collide if we tell the Physics Engine to ignore collisions
    between them.


    We should perform logical sanity checks like this for all potential Layer combinations
    in the

    Collision Matrix to see whether we''re wasting precious time checking for inter-object

    collisions between object pairs that aren''t necessary.


    # # Prefer Discrete collision detection


    Discrete collision detection is fairly cheap since teleporting objects once and
    performing a

    single overlap check between nearby object pairs is a fairly trivial amount of
    work to

    perform in a single timestep. The amount of calculation required to perform Continuous

    collision detection is significantly greater, since it involves interpolating
    both objects

    between their starting and ending positions, while analyzing for any slight bounding

    volume overlaps between these points as they might occur during the timestep.


    Consequently, the **Continuous** collision detection option is an order of magnitude
    more

    expensive than the **Discrete** detection method, whereas the **ContinuousDynamic**
    collision

    detection setting is an order of magnitude even more expensive than **Continuous**.
    Having

    too many objects configured to use either of the Continuous collision detection
    types will

    cause serious performance degradation in complex Scenes. In either case, the costs
    are

    multiplied by the number of objects that need to be compared during any given
    frame and

    whether or not the comparison Collider is Static or Dynamic.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Ergo, we should favor the **Discrete** collision detection setting for the
    overwhelming

    majority of our objects, while using either of the Continuous collision detection
    settings

    only in extreme circumstances. The **Continuous** setting should be used when
    important

    collisions are frequently missed with the more static parts of our game world.
    For instance,

    if we wish to be certain that the player characters never fall through the game
    world or

    never accidentally teleport through walls if they move too quickly, then we might
    want to

    apply Continuous collision detection only for those objects. Finally, the

    **ContinuousDynamic** setting should only be used if the same situation applies
    and we wish

    to catch collisions between pairs of very fast moving Dynamic Colliders.


    # # Modify the Fixed Update frequency


    In some cases, **Discrete** collision detection might not work well enough on
    a large scale.

    Perhaps our entire game revolves around a lot of small physics objects, and Discrete

    collision detection simply isn''t catching enough collisions to maintain product
    quality.

    However, applying one of the Continuous collision detection settings to everything
    would

    be far too prohibitive on performance. In this case, there is one option we can
    try: we can

    customize the physics timestep to give the Discrete collision detection system
    a better

    chance of catching such collisions by modifying how frequently the engine checks
    for Fixed

    Updates.


    As mentioned previously, Fixed Updates and physics timestep processing are strongly

    coupled; so, by modifying the frequency of Fixed Update checks, we not only change
    the

    frequency that the Physics Engine will calculate and resolve the next callback,
    but we also

    change how frequently the `FixedUpdate()` callbacks and Coroutines are being invoked.

    Consequently, changing this value can be risky if we''re deep into our project
    and have a lot

    of behavior that depends on these callbacks since we will be changing a very important

    assumption about how often these methods are invoked.


    Altering the Fixed Update frequency can be accomplished using the **Edit | Project
    Settings

    | Time | Fixed Timestep** property in the Editor or through the `Time.fixedDeltaTime`

    property in script code.


    Reducing this value (increasing the frequency) will force the Physics Engine to
    process

    more frequently, giving it a better chance of catching collisions with Discrete
    collision

    detection. Naturally, this comes with an added CPU cost since we''re invoking
    more

    `FixedUpdate()` callbacks and asking the Physics Engine to update more frequently,

    having it move objects and verify collisions more often.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Conversely, increasing this value (decreasing the frequency) provides more
    time for the CPU to complete other tasks before it must handle physics processing
    again, or looking at it from another perspective, giving the Physics Engine more
    time to process the last timestep before it begins processing the next one. Unfortunately,
    lowering the Fixed Update frequency would essentially lower the maximum velocity
    at which objects can move before the Physics Engine can no longer capture collisions
    with Discrete collision detection (depending on the objects’ sizes). We might
    also start to see objects changing velocities in strange ways because it is essentially
    becoming a weaker approximation of real-world physics behavior.


    This makes it absolutely vital to perform a significant amount of testing each
    time the Fixed Timestep value is changed. Even with a complete understanding of
    how this value works, it is difficult to predict what the overall outcome will
    look like during gameplay and whether the result is passable for quality purposes.
    Hence, changes to this value should be made early in the project’s lifecycle and
    then made infrequently in order to get a sufficient amount of testing against
    as many physics situations as possible.


    It might help to create a test Scene that flings some of our high-velocity objects
    at one another to verify that the results are acceptable and run through this
    Scene whenever Fixed Timestep changes are made. However, actual gameplay tends
    to be rather complex, with many background tasks and unanticipated player behavior
    that causes additional work for the Physics Engine or gives it less time to process
    the current iteration. Actual gameplay conditions are impossible to replicate
    in a vacuum. Also, there’s no substitute for the real thing, so the more testing
    we can accomplish against the current value of Fixed Timestep, the more confident
    we can be that the changes meet acceptable quality standards.


    > Take it from someone who’s in the career of developing software automation tools:
    automation of software testing is helpful in a lot of situations, but when it
    comes to real-time event and user input-driven applications, which synchronize
    with multiple hardware devices and complex subsystems such as Physics Engines,
    and which tend to change rapidly due to iterations on feedback, the support and
    maintenance costs of automated testing often becomes more effort than its worth,
    making manual testing the most sensible approach.


    We always have Continuous collision detection as a last resort to offset some
    of the resulting instability we’re observing. Unfortunately, even if the changes
    are targeted, it is more likely that this will cause further performance issues
    than we started with due to the overhead costs of Continuous collision detection.
    It would be wise to profile our Scene before and after enabling Continuous collision
    detection to verify that the benefits are outweighing the costs.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# # Adjust the Maximum Allowed Timestep


    If we''re regularly exceeding the Maximum Allowed Timestep (which, as a reminder,

    determines how much time the Physics Engine has to resolve a timestep before it
    must exit

    early), then it will result in some pretty bizarre-looking physics behavior. Rigidbodies
    will

    appear to slow down or jerk to a stop since the Physics Engine needs to keep exiting

    timestep calculations early before it has fully resolved its entire time quota.
    In this case, it is

    a clear sign that we need to optimize our physics behavior from other angles.
    However, at

    the very least, we can be confident that the threshold will prevent the game from

    completely locking up from a spike in the middle of physics processing.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_196_0.png)


    Reminder: this setting can be accessed through **Edit | Project Settings |**

    **Time | Maximum Allowed Timestep**.


    The default setting is to consume a maximum of 0.333 seconds, which would manifest
    itself

    as a very noticeable drop in frame rate (a mere 3 FPS) if it were exceeded. If
    you ever feel

    the need to change this setting, then you obviously have some big problems with
    your

    physics workload, so it is recommended that you only tweak this value if you have

    exhausted all other approaches.


    # # Minimize Raycasting and bounding-volume

    checks


    All of the Raycasting methods are incredibly useful, but they are relatively expensive,

    particularly `CapsuleCast()` and `SphereCast()`. We should avoid calling these
    methods

    regularly within the `Update()` callbacks or Coroutines, saving them only for
    key events in

    our script code.


    If we''re making use of persistent line, ray, or area-of-effect collision areas
    in our Scene

    (examples include security lasers, continuously burning fires, beam weapons, and
    so on)

    and the object remains relatively stationary, then they would perhaps be better
    simulated

    using a simple Trigger Volume.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "If such replacements are not possible and we truly need persistent casting\
    \ checks using these methods, we should minimize the amount of processing each\
    \ Raycast makes by exploiting LayerMasks. This is particularly true if we're making\
    \ use of Physics.RaycastAll(). For example, a poorly optimized usage of this kind\
    \ of Raycasting would look as follows:\n\n```\nvoid PerformRaycast() {\n    RaycastHit[]\
    \ hits;\n    hits = Physics.RaycastAll(transform.position, transform.forward,\n\
    \        100.0f);\n    for (int i = 0; i < hits.Length; ++i) {\n        RaycastHit\
    \ hit = hits[i];\n        EnemyComponent e = hit.transform.GetComponent<EnemyComponent>()\
    \ ;\n        if (e.GetType() == EnemyType.Orc) {\n            e.DealDamage(10);\n\
    \        }\n    }\n}\n```\n\nIn the preceding example, we're collecting Raycast\
    \ collision data for every object in the path of this Ray, but we're only processing\
    \ its effects on objects which hold a specific EnemyComponent. Consequently, we're\
    \ asking the Physics Engine to complete much more work than is necessary.\n\n\
    A better approach will be to use a different overload of RaycastAll(), which accepts\
    \ a LayerMask value as an argument. This will filter collisions for the Ray in\
    \ much the same way as the Collision Matrix so that it only tests against objects\
    \ in the given Layer(s). The following code contains a subtle improvement by providing\
    \ an additional LayerMask property; we would configure the LayerMask through the\
    \ Inspector window for this Component, and it will filter the list much faster\
    \ and only contain hits for objects matching the mask:\n\n```\n[SerializeField]\
    \ LayerMask _layerMask;\nvoid PerformRaycast() {\n    RaycastHit[] hits;\n   \
    \ hits = Physics.RaycastAll(transform.position, transform.forward, 100.0f,\n \
    \       _layerMask);\n    for (int i = 0; i < hits.Length; ++i) {\n        //\
    \ as before ...\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: 'This optimization doesn’t work as well for the `Physics.RaycastHit()` function
    since that version only provides ray collision information for the first object
    the Ray collides with, regardless of whether we’re using a `LayerMask` or not.


    Note that because the `RaycastHit` and `Ray` classes are managed by the Native
    memory space of the Unity Engine, they don’t actually result in memory allocations
    that draw the attention of the **Garbage Collector**. We will learn more about
    such activity in **Chapter 8**, _Masterful Memory Management_.


    # # Avoid complex Mesh Colliders


    In order of collision detection efficiency, the various Colliders are Spheres,
    Capsules, Boxes, Convex Mesh Colliders, followed by Concave Mesh Colliders being
    far and away the most expensive. Collisions always involve pairs of objects, and
    the amount of work (math) needed to resolve the collision will depend on the complexity
    of both objects. Detecting collisions between two primitive objects can be reduced
    down to a relatively simple set of mathematical equations, which are highly optimized.
    Performing comparisons against a pair of Convex Mesh Colliders is a much more
    complex equation, making them an order of magnitude more expensive than collisions
    between two primitives. Then, there are collisions between two Concave Mesh Colliders,
    which are so complex that they cannot be reduced down to a simple formula and
    require collision checks to be resolved between each pair of triangles across
    both meshes, easily making them orders of magnitude more expensive than collisions
    between other Collider types. The amount of work involved scales similarly when
    we resolve collisions between shapes of different groups. For example, a collision
    between a primitive and Concave Mesh Collider would be slower than a collision
    between two primitives, but faster than a collision between two Concave Mesh Colliders.


    There is also the question of whether one, or both, of the objects involved in
    the collision is moving (one of the objects being a Static Collider is easier
    to process than both objects being Dynamic Colliders). There is also the matter
    of how many of these objects are within our Scene since the total processing costs
    of collision detection will grow rapidly if we’re not careful with how many shapes
    we introduce into the simulation.


    A great irony between representing physics and graphics in 3D applications is
    how difficult it is to handle spherical and cube objects between the two of them.
    The perfect spherical mesh would require an infinite number of polygons to be
    generated, making such an object impossible to represent graphically.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'However, handling collisions between two spheres in a Physics Engine is perhaps
    the simplest problem to solve for contact points and collisions (the contact point
    is always at the edge of either of the sphere''s radius, and the contact normal
    is always the vector between their centers of mass). Conversely, a cube is one
    of the simplest objects to represent graphically (as little as 8 vertices and
    12 triangles) and yet takes significantly more mathematics and processing power
    to find contact points and resolve collisions for (and the mathematics to resolve
    it depends on whether the collision occurred between faces, edges, corners, or
    a mixed pairing). Anecdotally, this implies that the most efficient way of creating
    the largest number of objects would be to populate our world with cube objects,
    which use spherical Colliders. However, this would make absolutely no sense to
    a human observer, as they would witness cubes rolling around like balls.


    The previous anecdote serves as a reminder that the physical representation of
    an object does not necessarily need to match its graphical representation. This
    is beneficial, as a graphical mesh can often be condensed down into a much simpler
    shape, while still generating very similar physics behavior and simultaneously
    removing the need to use an overly complex Mesh Collider.


    This separation of representations between graphics and physics allows us to optimize
    the performance of one system without (necessarily) negatively affecting the other.
    So long as there are no noticeable repercussions on gameplay (or we''re willing
    to make the sacrifice), then we are free to represent complex graphical objects
    with much simpler physics shapes without players noticing. Also, if the player
    never notices, then no harm is done.


    So, we can solve this problem in one of the two ways: either by approximating
    the physics behavior of the complex shape using one (or more) of the standard
    primitives or by using a much simpler Mesh Collider.


    # # Use simpler primitives


    Most shapes can be approximated using one of the three primitive Colliders. In
    fact, we do not need to represent the object using only a single Collider. We
    are free to use several Colliders if they serve our needs for creating a complex
    collision shape by attaching additional child `GameObjects` with their own Colliders.
    This is almost always less expensive than using a single Mesh Collider and should
    be preferred.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The following image shows a handful of complex graphical objects represented
    by one or more simpler primitive Collider shapes:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_200_0.png)


    Using a Mesh Collider for any one of these objects would be significantly more
    expensive than the primitive Colliders shown here due to the number of polygons
    they contain. It is worth exploring any and all opportunities to simplify our
    objects down using these primitives as much as we can, as they can provide significant
    performance gains.


    For example, Concave Mesh Colliders are unique in that they can feature gaps or
    holes that allow other meshes to fall into, or even through them, which introduces
    opportunities for the objects to fall through the world if such Colliders are
    used for world collision areas. It is often better to place Box Colliders in strategic
    locations for this purpose.


    # # Use simpler Mesh Colliders


    Similarly, the mesh assigned to a Mesh Collider does not necessarily need to match
    the graphical representation of the same object (Unity simply picks it as the
    default). This gives us an opportunity to assign a simpler mesh to the Mesh Collider’s
    `mesh` property, which is different from the one we use for its graphical representation.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'The following image shows an example of a complex graphical mesh that has been
    given a much more simplified mesh for its Mesh Collider:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_201_0.png)


    Simplifying the rendered mesh into convex shapes with lower polygon counts in
    this way will greatly reduce the overhead needed to determine bounding volume
    overlaps with other Colliders. Depending on how well the original object is estimated,
    there should be minimal noticeable gameplay differences, especially in the case
    of this axe, which we expect to be moving quickly as creatures swing it during
    attacks, making it unlikely that players will notice the difference between the
    two meshes as Colliders. In fact, the simplified mesh is much less likely to be
    missed by Discrete collision detection and is also preferable for that reason.


    # # Avoid complex physics Components


    Certain special physics Collider Components, such as `TerrainCollider`, `Cloth`,
    and `WheelCollider`, are orders of magnitude more expensive than all primitive
    Colliders and even Mesh Colliders in some cases. We should simply not include
    such Components in our Scenes unless they are absolutely necessary. For instance,
    if we have terrain objects in the distance that the player will never approach,
    there’s little reason to include an attached `TerrainCollider`.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Games featuring Cloth Components should consider instantiating different objects
    without them when running in lower-quality settings, or simply animating cloth
    behavior (although it is totally understandable if the team has grown attached
    and fallen in love with how the stuff moves around).


    Games using WheelCollider Components should simply try to use fewer Wheel Colliders.
    Large vehicles, with more than four wheels, may be able to simulate similar behavior
    using only four wheels, while faking the graphical representation of additional
    wheels.


    # # Let physics objects sleep


    The Physics Engine’s sleep feature can pose several problems for our game. Firstly,
    some developers don’t realize that many of their Rigidbodies are sleeping during
    most of the lifetime of their application. This tends to lead developers to assume
    that they can get away with (for example) doubling the number of Rigidbodies in
    their game and the overall costs would simply double to match it. This is unlikely.
    The frequency of collisions and total accumulated time of active objects is more
    likely to increase in an exponential fashion rather than a linear one. This leads
    to unexpected performance costs every time new physics objects are introduced
    into the simulation. We should keep this in mind when we decide to increase the
    physical complexity of our Scenes.


    Secondly, changing any properties on a Rigidbody Component at runtime, such as
    mass, drag, and useGravity, will also reawaken an object. If we’re regularly changing
    these values (such as a game where object sizes and masses change over time),
    then they will remain active for longer periods of time than usual. This is also
    the case for applying forces, so if we’re using a custom gravity solution (such
    as suggested in the Mass section), we should try to avoid applying the gravitational
    force every Fixed Update, otherwise the object will be unable to fall asleep.
    We could check its mass-normalized-kinetic-energy (just take the value of velocity.sqrMagnitude)
    and manually disable our custom gravity when we detect that it is very low.


    Thirdly, there is the danger of islands of sleeping physics objects being generated.
    Islands are created when a large number of Rigidbodies are touching one another
    and have gradually gone to sleep once the kinetic energy of the system has fallen
    low enough. However, because they’re all still touching one another, as soon as
    one of these objects is awoken, it will start a chain reaction, awakening all
    other nearby Rigidbodies. Suddenly, we have a large spike in CPU usage because
    dozens of objects have re-entered the simulation. Even worse, because the objects
    are so close together, there will be many potential collision pairs that must
    keep being resolved until the objects fall asleep again.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Avoiding these situations is best done by reducing the complexity of our Scenes,
    but if we find ourselves unable to do so, we could look for ways to detect that
    islands are forming, and then strategically destroy/despawn some of them to prevent
    too many large islands from being generated. However, performing regular distance
    comparisons between all of our Rigidbodies is not a cheap task to accomplish and
    could be costly. The Physics Engine already performs such checks itself, during
    Broadphase Culling, but, unfortunately, Unity doesn''t expose this data through
    the Physics Engine API. Any workarounds for this problem will be dependent on
    how the game is designed; for example, a game that requires the player to move
    lots of physics objects into an area (for example, a game that involves herding
    sheep into a pen) could choose to remove the sheep''s Collider as soon as the
    player moves it into position, locking the object to its final destination, easing
    the workload on the Physics Engine and preventing islands from becoming a problem.


    Sleeping objects can be a blessing and a curse. They can save us a lot of processing
    power, but if too many of them reawaken at the same time or our simulation is
    too busy to allow enough of them to fall asleep, then we could be incurring some
    unfortunate performance costs during gameplay. We should strive to limit these
    situations as much as possible by letting our objects enter the sleeping state
    as much as possible and avoiding grouping them together in large clusters.


    > Note that the sleep threshold can be modified under **Edit | Project Settings
    | Physics | Sleep Threshold**.


    # # Modify the Solver Iteration Count


    Using Joints, Springs, and other ways to connect Rigidbodies together are fairly
    complex simulations in Physics Engines. Owing to the codependent interactivity
    (internally represented as movement constraints) that occurs due to joining two
    objects together, the system must often make several attempts at solving the necessary
    mathematical equations. This multi-iteration approach is required to calculate
    an accurate result whenever there is a change in velocity to any single part of
    the object chain.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'It, therefore, becomes a balancing act of limiting the maximum number of attempts
    the Solver makes to resolve a particular situation versus how accurate a result
    we can get away with. We don''t want the Solver to spend too much time on a single
    collision, because there are a lot of other tasks that the Physics Engine has
    to complete within the same iteration. However, we also don''t want to reduce
    the maximum number of iterations too far, as it will only approximate what the
    final solution would have been, making its motion look much less believable than
    if it had been given more time to calculate the result.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_204_0.png)


    The same Solver also gets involved when resolving inter-object collisions and
    contacts. It can almost always determine the correct result for simple collisions
    with a single iteration, with the exception of some very rare and complex collision
    situations with Mesh Colliders. It is mostly when attached objects will be affected
    through Joints that the Solver requires additional effort to integrate the final
    result.


    The maximum number of iterations the Solver is allowed to attempt is called the
    Solver Iteration Count, which can be modified under Edit | Project Settings |
    Physics | Default Solver Iterations. In most cases, the default value of six iterations
    is perfectly acceptable. However, games that include very complex Joint systems
    may wish to increase this count to suppress any erratic (or downright explosive)
    CharacterJoint behaviors, whereas some projects may be able to get away with reducing
    this count. Testing must be performed after changing this value to check whether
    the project still maintains the intended levels of quality. Note that this value
    is the default Solver Iteration Count--the value that gets applied to any newly
    created Rigidbodies. We can change this value at runtime through the Physics.defaultSolverIterations
    property, but this still won''t affect preexisting Rigidbodies. If necessary,
    we can modify their Solver Iteration Count after they are constructed through
    the Rigidbody.solverIterations property.


    If we find our game regularly runs into jarring, erratic, and physics-breaking
    situations with complex Joint-based objects (such as Ragdolls), then we should
    consider gradually increasing the Solver Iteration Count until the problems are
    suppressed. These problems typically occur if our Ragdolls absorb too much energy
    from colliding objects and the Solver is unable to iterate the solution down to
    something reasonable before it is asked to give up. At this point, one of the
    Joints goes supernova, dragging the rest of them into orbit along with it. Unity
    has a separate setting for this problem, which can be found under Edit | Project
    Settings | Physics | Default Solver Velocity Iterations. Increasing this value
    will give the Solver more opportunity to calculate a sensible velocity during
    Joint-based object collisions and help to avoid the above scenario. Again, this
    is a default value, hence it is only applied to newly created Rigidbodies. The
    value can be modified at runtime through the Physics.defaultSolverVelocityIterations
    property and can be customized on specific Rigidbodies through the Rigidbody.solverVelocityIterations
    property.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'In either case, increasing the number of iterations will consume more CPU resources
    during every Fixed Update where the Joint objects remain active.


    Note that the Physics 2D settings for solver iterations are named **Position Iterations**
    and **Velocity Iterations**.


    # # Optimize Ragdolls


    Speaking of Joint-based objects, Ragdolls are incredibly popular features for
    good reason; they’re tons of fun! Ignoring the morbidity of flinging corpses around
    a game world for the moment, there’s something about watching a complex chain
    of objects flail around and smash into things that hits a lot of psychological
    fun buttons. This makes it very tempting to allow many Ragdolls to coexist within
    our Scene at the same time, but as we quickly discover, this risks an enormous
    performance hit when too many Ragdolls are in motion and/or collide with other
    objects due to the amount of iterations the Solver would need to resolve them
    all. So, let’s explore some ways to improve the performance of Ragdolls.


    # # Reduce Joints and Colliders


    Unity provides a simple Ragdoll-generation tool (the Ragdoll Wizard) under **GameObject
    | 3D Object | Ragdoll...**. This tool can be used to create Ragdolls from a given
    object by selecting the appropriate child `GameObjects` to attach `Joint` and
    `Collider` Components to for any given body part or limb. This tool always creates
    13 different Colliders and associated Joints (pelvis, chest, head, two Colliders
    per arm, and three Colliders per leg).


    Note that a bug causes the Ragdoll Wizard not to complain if nothing is assigned
    to **Left Foot** or **Right Foot** `Transform` Component references like it does
    for the rest of them, but Unity will throw a `NullReferenceException` if we try
    to create the mesh without them assigned. Ensure that all 13 `Transform` Component
    references have been assigned when we try to create a Ragdoll.


    However, it’s possible to use only seven Colliders (pelvis, chest, head, and one
    Collider per limb) to greatly reduce the overhead cost at the expense of Ragdoll
    realism. This can be achieved by deleting unwanted Colliders and manually reassigning
    the Character Joint’s `connectedBody` properties to the proper parent joints (connect
    the arm Colliders to the chest, and connect the leg Colliders to the pelvis).'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Note that we assign a `mass` value during Ragdoll creation using the Ragdoll
    Wizard. This

    mass value is spread across the various Joints as appropriate and, therefore,
    represents the

    total mass of the object. We should ensure that we don''t apply a mass value too
    high or too

    low compared to other objects in our game to avoid potential instability.


    # # Avoid inter-Ragdoll collisions


    The performance cost of Ragdolls grows exponentially when Ragdolls are allowed
    to collide

    with other Ragdolls, since any Joint collision requires the Solver to calculate
    the resultant

    velocity applied to all of the Joints connected to it and then each of the Joints
    connected to

    them, such that both Ragdolls must be completely resolved multiple times. Also,
    it gets

    significantly more complicated if multiple parts of the Ragdolls are likely to
    collide with

    one another during the same collision.


    This is a tough task for the Solver to handle, so we should avoid it. The best
    way to do this

    is to simply use the Collision Matrix. It is wise to assign all Ragdolls to their
    own Layer and

    uncheck the corresponding checkbox in the Collision Matrix so that objects in
    the given

    Layer cannot collide with objects in the same Layer.


    # # Replace, deactivate or remove inactive Ragdolls


    In some games, once a Ragdoll has reached its final _destination_, we no longer
    need it to

    remain in the game world as an interactable object. We could then either deactivate,

    destroy, or replace the Ragdoll with a simpler alternative when they are no longer

    needed (a good trick is to replace them with the simpler version that uses only
    seven Joints

    as suggested earlier). Such simplifications are often implemented as a means of
    reducing

    overhead for weaker hardware/lower quality settings or as a compromise to allow
    more

    Ragdolls to coexist in our Scene. It could even be used dynamically if a particular
    number of

    Ragdolls is already present.


    We would need some object to keep track of all of our Ragdolls, being notified
    any time a

    Ragdoll is created, keeping track of how many Ragdolls currently exist, watching
    each of

    them until they fall asleep through `RigidBody.IsSleeping()` and then do something

    appropriate with them. The same object could also choose to instantiate simpler
    Ragdoll

    variations if the Scene already contains more Ragdolls than is reasonable. This
    would be

    another good opportunity to make use of the Messaging System we explored in _Chapter
    2,

    Scripting Strategies_.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Whichever approach we choose to improve the performance of our Ragdolls will
    no doubt result in limiting Ragdolls as a gameplay feature, either by instantiating
    fewer of them, giving them less complexity, or giving them a shorter lifetime,
    but these are reasonable compromises to make given the performance-saving opportunities.


    # # Know when to use physics


    The most obvious method to improve the performance of a feature is to avoid using
    it as much as possible. For all moveable objects in our game, we should take a
    moment to ask ourselves if getting the Physics Engine involved is even necessary.
    If not, we should look for opportunities to replace them with something simpler
    and less costly.


    Perhaps we''re using physics to detect whether the player fell into a kill-zone
    (water, lava, a death-plummet, and so on), but our game is simple enough that
    we only have kill-zones at a specific height. In this case, we could avoid physics
    Colliders altogether and get away with only checking whether the player''s y-position
    falls below a particular value.


    Consider the following example--we''re trying to simulate a meteor shower, and
    our first instinct was to have many falling objects that move via physics Rigidbodies,
    detect collisions with the ground via Colliders, and then generate an explosion
    at the point of impact. However, perhaps the ground is consistently flat or we
    have access to the Terrain''s Height Map for some rudimentary collision detection.
    In this case, object travel could be simplified by manually tweening the objects''
    `transform.position` over time to simulate the same traveling behavior without
    requiring any Physics Components. In both cases, we can reduce the physics overhead
    by simplifying the situation and pushing the work into Script code.


    > > Tweening is a common short-hand term for in-betweening, which is the act of
    interpolating variables from one value to another gradually over time. There are
    many useful (and free) tweening libraries available on the Unity Asset Store that
    can provide a lot of useful functionality. Although, be careful of potentially
    poor optimization in these libraries.


    The reverse is also possible. There might be occasions where we''re performing
    a great deal of calculation through Script code that could be handled through
    physics relatively simply. For example, we might have implemented an inventory
    system with many objects that can be picked up. When the player hits the `Pick
    Up Object` key, each of these objects might be compared against the player''s
    position to figure out which object is the closest.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'We could consider replacing all of the Script code with a single

    `Physics.OverlapSphere()` call to get nearby objects when the key is pressed,
    and then

    figure out the closest pickup object from the result (or, better yet, just automatically
    pick up

    all of them. Why make the player repeatedly click more than necessary?). This
    could greatly

    reduce the total number of objects that must be compared each time the key is
    pressed,

    although comparisons should be made to ensure that this is the case.


    Ensure that you seek to remove unnecessary physics grunt work from your Scenes
    or use

    physics to replace behavior that is costly when performed through Script code.
    The

    opportunities are as wide and far reaching as your own ingenuity. The ability
    to recognize

    opportunities like this takes experience, but is a vital skill that will serve
    you well when

    saving performance in current and future game development projects.


    # # Summary


    We''ve covered numerous methods to improve our game''s physics simulation both
    in terms

    of performance and consistency. The best technique when it comes to costly systems
    such as

    Physics Engines is simply avoidance. The less we need to use the system, the less
    we need

    to worry about it generating bottlenecks. In the worst-case scenario, we may need
    to reduce

    the scope of our game to condense physics activity down to only the essentials,
    but as we''ve

    learned, there are plenty of ways to reduce physics complexity without causing
    any

    noticeable gameplay effects.


    In the next chapter, we will immerse ourselves in Unity''s Rendering Pipeline
    and discover

    how to maximize the graphical fidelity of our application, by making use of all
    of the CPU

    cycles we''ve freed up using the performance enhancements from earlier chapters.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# # Dynamic Graphics


    There is no question that the Rendering Pipeline of a modern graphics device is
    complicated. Even rendering a single triangle to the screen requires a multitude
    of Graphics API calls, covering tasks such as creating a buffer for the Camera
    view that hooks into the Operating System (usually via some kind of windowing
    system), allocating buffers for vertex data, setting up data channels to transfer
    vertex and texture data from RAM to VRAM, configuring each of these memory spaces
    to use a specific set of data formats, determining the objects that are visible
    to the Camera, setting up and initiating a Draw Call for the triangle, waiting
    for the Rendering Pipeline to complete its task(s), and finally presenting the
    rendered image to the screen. However, there’s a simple reason for this seemingly
    convoluted and over engineered way of drawing such a simple object—rendering often
    involves repeating the same tasks over and over again, and all of this initial
    setup makes future rendering tasks very fast.


    CPUs are designed to handle virtually any computational scenario, but can’t handle
    too many tasks simultaneously, whereas GPUs are designed for incredibly large
    amounts of parallelism, but they are limited in the complexity they can handle
    without breaking that parallelism. Their parallel nature requires immense amounts
    of data to be copied around very rapidly. During the setup of the Rendering Pipeline,
    we configure memory data channels for our graphics data to flow through. So, if
    these channels are properly configured for the types of data we will be passing,
    then they will operate more efficiently. However, setting them up poorly will
    result in the opposite.


    Both the CPU and GPU are used during all graphics rendering, making it a high-speed
    dance of processing and memory management that spans software; hardware; multiple
    memory spaces, programming languages (each suited to different optimizations),
    processors, and processor types; and a large number of special-case features that
    can be thrown into the mix.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'To make matters even more complicated, every rendering situation we will come
    across is different in its own way. Running the same application against two different
    GPUs often results in an apples-versus-oranges comparison due to the different
    capabilities and APIs they support. It can be difficult to determine where a bottleneck
    resides within such a complex web of hardware and software systems, and it can
    take a lifetime of industry work in 3D graphics if we want to have a strong, immediate
    intuition about the source of performance issues in modern Rendering Pipelines.


    Thankfully, Profiling comes to the rescue once again, which makes becoming a *Rendering
    Pipeline wizard* less of a necessity. If we can gather data about each device,
    use multiple performance metrics for comparison, and tweak our Scenes to observe
    how different rendering features affect their behavior, then we should have sufficient
    evidence to find the root cause of an issue and make appropriate changes. So,
    in this chapter, you will learn how to gather the right data, dig just deep enough
    into the Rendering Pipeline to find the true source of the problem, and explore
    various solutions and workarounds for a multitude of potential problems.


    There are many topics to be covered when it comes to improving rendering performance.
    So, in this chapter, we will explore the following topics:


    +   - A brief exploration of the Rendering Pipeline, focusing on the parts where
    the CPU and GPU come into play

    +   - General techniques on how to determine whether our rendering is limited
    by the CPU or by GPU

    +   - A series of performance optimization techniques and features, as follows:

    +     - GPU Instancing

    +     - Level Of Detail (LOD) and other Culling Groups

    +     - Occlusion Culling

    +     - Particle Systems

    +     - Unity UI

    +     - Shader optimization

    +     - Lighting and Shadow optimization

    +     - Mobile-specific rendering enhancements'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# # The Rendering Pipeline


    Poor rendering performance can manifest itself in a number of ways, depending
    on whether the device is limited by CPU activity (we are CPU bound) or by GPU
    activity (we are GPU bound). Investigating a CPU-bound application can be relatively
    simple since all of the CPU work is wrapped up in loading data from disk/memory
    and calling Graphics API instructions. However, a GPU-bound application can be
    more difficult to analyze since the root cause could originate from one of a large
    number of potential places within the Rendering Pipeline. We might find that we
    need to rely on a little guesswork or _process of elimination_ in order to determine
    the source of a GPU bottleneck. In either case, once the problem is discovered
    and resolved, we can expect significant improvements since small fixes tend to
    reap big rewards when it comes to fixing issues in the Rendering Pipeline.


    We briefly touched on the Rendering Pipeline in _chapter 3, The Benefits of Batching_.
    To briefly summarize the essential points, we know that the CPU sends rendering
    instructions through the Graphics API that funnels through the hardware driver
    to the GPU device, which results in a list of rendering instructions being accumulated
    in a queue known as the Command Buffer. These commands are processed by the GPU
    one by one until the Command Buffer is empty. So long as the GPU can keep up with
    the rate and complexity of instructions before the next frame is due to begin,
    we will maintain our frame rate. However, if the GPU falls behind, or the CPU
    spends too much time generating commands, the frame rate will start to drop.


    The following is a greatly simplified diagram of a typical Rendering Pipeline
    on a modern GPU (which can also vary based on device, technology support, and
    custom optimizations), showing a broad view of the steps that take place:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_211_0.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The top row represents the work that takes place in the CPU, which includes
    both the act of calling into the Graphics API through the hardware driver and
    pushing commands into the GPU. The next two rows represent the steps that take
    place in the GPU. Owing to the GPU’s complexity, its internal processes are often
    split into two different sections--the **Front End** and the **Back End**, which
    require a little added explanation.


    # # The GPU Front End


    The Front End refers to the part of the rendering process where the GPU handles
    vertex data. It will receive mesh data from the CPU (a big bundle of vertex information),
    and a Draw Call will be issued. The GPU then gathers all pieces of vertex information
    from the mesh data and passes them through Vertex Shaders, which are given an
    opportunity to modify them and output them in a 1-to-1 manner. From this, the
    GPU now has a list of ;Primitives to process (triangles--the most primitive shapes
    in 3D graphics). Next, the Rasterizer takes these Primitives and determines which
    pixels of the final image will need to be drawn on to create the Primitive based
    on the positions of its vertices and the current Camera view. The list of pixels
    generated from this process is known as **fragments**, which will be processed
    in the Back End.


    Vertex Shaders are small C-like programs that determine the input data that they
    are interested in and the way that they will manipulate it, and then will output
    a set of information for the Rasterizer to generate fragments with. It is also
    home to the process of Tessellation, which is handled by Geometry Shaders (sometimes
    called **Tessellation Shaders**), similar to a Vertex Shader in that they are
    small scripts uploaded to the GPU, except that they are allowed to output vertices
    in a 1-to-many manner, thus generating additional geometry programmatically.


    > The term _Shader_ is an anachronism from back when these scripts primarily handled
    Lighting and Shading tasks, before their role was expanded to include all of the
    tasks they are used for today.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# # The GPU Back End


    The Back End represents the part of the Rendering Pipeline where fragments are
    processed. Each fragment will pass through a Fragment Shader (also known as a
    **Pixel Shader**). These Shaders tend to involve a lot more complex activity compared
    to Vertex Shaders, such as depth testing, alpha testing, colorization, texture
    sampling, Lighting, Shadows, and various Post-Processing effects to name a few
    of the possibilities. This data is then drawn onto the Frame Buffer, which holds
    the current image that will eventually be sent to the display device (our monitor)
    once rendering tasks for the current frame are complete.


    There are normally two Frame Buffers in use by Graphics APIs by default (although
    more could be generated for custom rendering scenarios). At any given moment,
    one of the Frame Buffers contains the data from the frame we just rendered to,
    and is being presented to the screen, while the other is actively being drawn
    to by the GPU while it completes commands from the Command Buffer. Once the GPU
    reaches a `swap buffers` command (the final instruction the CPU asks it to complete
    for the given frame), the Frame Buffers are flipped around so that the new frame
    is presented. The GPU will then use the old Frame Buffer to draw the next frame.
    This process repeats each time a new frame is rendered, hence the GPU only needs
    two Frame Buffers to handle this task.


    This entire process, from making Graphics API calls to swapping Frame Buffers,
    repeats continuously for every mesh, vertex, fragment, and frame, so long as our
    application is still rendering.


    There are two metrics that tend to be the source of bottlenecks in the Back End--Fill
    Rate and Memory Bandwidth. Let''s explore them a little.


    # # Fill Rate


    Fill Rate is a very broad term referring to the speed at which the GPU can draw
    fragments. However, this only includes fragments that have survived all of the
    various conditional tests we might have enabled within the given Fragment Shader.
    A fragment is merely a _potential pixel_, and if it fails any of the enabled tests,
    then it is immediately discarded. This can be an enormous performance-saver, as
    the Rendering Pipeline can skip the costly drawing step and begin working on the
    next fragment instead.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Dynamic Graphics


    # Chapter 6


    One such example of a test that might cull a fragment is Z-testing, which checks
    whether the fragment from a closer object has already been drawn to the same fragment
    location (the Z refers to the depth dimension from the point of view of the Camera).
    If so, the current fragment is discarded. If not, then the fragment is pushed
    through the Fragment Shader and drawn over the target pixel, which consumes exactly
    one fill from our Fill Rate. Now, imagine multiplying this process by thousands
    of overlapping objects, each of which generates hundreds or thousands of possible
    fragments (higher screen resolutions require more fragments to be processed).
    This could easily lead to millions of fragments to process each and every frame
    due to all of the possible overlap from the perspective of the Main Camera. On
    top of this, we''re trying to repeat this process dozens of times every second.
    This is why performing so much initial setup in the Rendering Pipeline is important,
    and it should be fairly obvious that skipping as many of these draws as we can
    will result in big rendering cost savings.


    Graphics card manufacturers typically advertise a particular Fill Rate as a feature
    of the card, usually in the form of Gigapixels per-second, but this is a bit of
    a misnomer, as it would be more accurate to call it Gigafragments per-second;
    however, this argument is mostly academic. Either way, larger values tell us that
    the device can potentially push more fragments through the Rendering Pipeline.
    So, with a budget of 30 Gigapixels per-second and a target frame rate of 60 Hz,
    we can afford to process 30,000,000,000/60 = 500 million fragments per-frame before
    being bottlenecked on Fill Rate. With a resolution of 2560 x 1440, and a best-case
    scenario where each pixel is drawn over only once, we could theoretically draw
    the entire Scene about 125 times without any noticeable problems.


    Sadly, this is not a perfect world. Fill Rate is also consumed by other advanced
    rendering techniques, such as Shadows and Post-Processing effects that needs to
    take the same fragment data and perform their own passes on the Frame Buffer.
    Even so, we will always end up with some amount of redraw over the same pixels
    due to the order in which objects are rendered. This is known as Overdraw, and
    it is a useful metric to measure how efficiently we are making use of our Fill
    Rate.


    # Overdraw


    How much Overdraw we have can be represented visually by rendering all objects
    with additive alpha blending and a flat coloration. Areas of high Overdraw will
    show up more brightly, as the same pixel is drawn over with additive blending
    multiple times. This is precisely how the Scene window''s Overdraw Shading mode
    reveals how much Overdraw our Scene is undergoing.


    # [ 195 ]'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'The following screenshot shows a Scene with several thousand boxes drawn normally
    (left) versus the Scene window’s Overdraw Shading mode (right):


    ![](img/da79484c9b30dc915216dbc5454a9bbf_215_0.png)


    The more Overdraw we have, the more Fill Rate we are wasting by overwriting fragment
    data. There are several techniques we can apply to reduce Overdraw, which we will
    explore later.


    Note that there are actually several different queues used for rendering, which
    can be separated into two types: Opaque Queues and Transparent Queues. Objects
    rendered in one of the Opaque Queues can cull away fragments via Z-testing as
    explained previously. However, objects rendered in a Transparent Queue cannot
    do so since their transparent nature means we can’t assume that they won’t need
    to be drawn no matter how many other objects are in the way, which leads to a
    lot of Overdraw. All Unity UI objects always render in a Transparent Queue, making
    them a significant source of Overdraw.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# # Memory Bandwidth


    The other potential source of bottlenecks in the Back End comes from Memory Bandwidth.

    Memory Bandwidth is consumed whenever a texture must be pulled from a section
    of the

    GPU''s VRAM down into the lower memory levels. This typically happens when a texture
    is

    sampled, where a Fragment Shader attempts to pick the matching texture pixel (or
    texel) to

    draw for a given fragment at a given location. The GPU contains multiple cores
    that each

    have access to the same area of VRAM, but they also each contain a much smaller,
    local

    Texture Cache that stores the texture(s) the GPU has been most recently working
    with. This

    is similar in design with the multitude of CPU memory cache levels that allow
    memory

    transfer up and down the chain. This is a hardware design workaround for the fact
    that

    faster memory will, invariably, be more difficult and expensive to produce. So,
    rather than

    having a giant, expensive block of VRAM, we have a large, cheap block of VRAM,
    but use a

    smaller, very fast, lower-level Texture Cache to perform sampling with, which
    gives us the

    best of both worlds, that is, fast sampling with lower costs.


    If a texture is needed that is already within the core''s local Texture Cache,
    then sampling

    often becomes lightning fast and is barely perceivable. If not, then the texture
    must be

    pulled in from VRAM before it can be sampled. This is effectively a cache miss
    for the

    Texture Cache since it will now take time to find and pull the required texture
    from VRAM.

    This transfer consumes a certain amount of our available Memory Bandwidth, specifically

    an amount equal to the total size of the texture file stored within VRAM (which
    may not be

    the exact size of the original file or the size in RAM, due to GPU-level compression

    techniques).


    In the event that we are bottlenecked in Memory Bandwidth, the GPU will keep fetching

    the necessary texture files, but the entire process will be throttled, as the
    Texture Cache

    keeps waiting for data to appear before it can process a given batch of fragments.
    The GPU

    won''t be able to push data back to the Frame Buffer in time to be rendered onto
    the screen,

    blocking the whole process and culminating in a poor frame rate.


    Proper usage of Memory Bandwidth is another budgeting concern. For example, with
    a

    Memory Bandwidth of 96 GBs per-second per-core and a target frame rate of 60 frames-per-

    second, the GPU can afford to pull roughly 1.6 GBs (96/60) worth of texture data
    every

    frame before being bottlenecked in Memory Bandwidth. This is not an exact budget,
    of

    course, because of the potential for cache misses, but it does give us a rough
    value to work

    with.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Lighting and Shadowing


    In modern games, a single object rarely finishes rendering completely in a single
    step,

    primarily due to Lighting and Shadowing. These tasks are often handled in multiple

    passes of a Fragment Shader, once for each of the several Light sources, and the
    final result is

    combined so that multiple Lights are given a chance to be applied. The result
    appears much

    more realistic, or at least, more visually appealing.


    Several passes are required to gather Shadowing information. We will first set
    up our Scene

    to have Shadow Casters and Shadow Receivers, which will create or receive Shadows,

    respectively. Then, each time a Shadow Receiver is rendered, the GPU renders any
    Shadow

    Caster objects from the point of view of the Light source into a texture with
    the goal of

    collecting distance information for each of their fragments. It then does the
    same for the

    Shadow Receiver, except now that it knows which fragments the Shadow Casters would

    overlap from the Light source, it can render those fragments darker since they
    will be in the

    Shadow created by the Light source bearing down on the Shadow Caster.


    Memory Bandwidth is normally listed on a per-core basis, but some GPU

    manufacturers may try to mislead by multiplying Memory Bandwidth

    with the number of cores in order to list a bigger, but less practical

    number. Due to this, research may be necessary to compare apples to

    apples.


    Note that this value is not the maximum limit on the amount of texture data that
    our game

    can contain in the project, nor in CPU RAM, nor even in VRAM. It is a metric that

    essentially limits how much texture swapping can occur during one frame. The same

    texture could be pulled back and forth multiple times in a single frame, depending
    on how

    many Shaders need to use them, the order that the objects are rendered, and how
    often

    texture sampling must occur. It''s possible for only a handful of objects to consume
    whole

    Gigabytes of Memory Bandwidth since there is only a finite amount of Texture Cache

    space available. Having a Shader that needs a lot of large textures is more likely
    to cause cache

    misses thus causing a bottleneck on Memory Bandwidth. This is surprisingly easy
    to trigger

    if we consider multiple objects requiring different high quality textures and
    multiple

    secondary texture maps (Normal maps, Emission maps, and so on), which are not
    batched

    together. In this case, the Texture Cache will be unable to hang on to a single
    texture file

    long enough to immediately sample it during the next rendering pass.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_217_0.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'This information then becomes an additional texture known as a _Shadowmap_
    and is blended

    with the surface for the Shadow Receiver when it is rendered from the point of
    view of the

    Main Camera. This will make its surface appear darker in certain spots where other
    objects

    stand between the Light source and the given object. A similar process is used
    to create

    _Lightmaps_, which are pregenerated Lighting information for the more static parts
    of our

    Scene.


    Lighting and Shadowing tends to consume a lot of resources throughout all parts
    of the

    Rendering Pipeline. We need each vertex to provide a Normal direction (a vector
    pointing

    away from the surface) to determine how Lighting should reflect off that surface,
    and we

    might need additional vertex color attributes to apply some extra coloring. This
    gives the

    CPU and Front End more information to pass along. Since multiple passes of Fragment

    Shaders are required to complete the final rendering. The Back End is kept busy
    both in

    terms of Fill Rate (lots and lots of pixels to draw, redraw, and merge) and in
    terms of

    Memory Bandwidth (extra textures to pull in or out for Lightmaps and Shadowmaps).
    This

    is why real-time Shadows are exceptionally expensive compared to most other rendering

    features and will inflate Draw Call counts dramatically when enabled.


    However, Lighting and Shadowing are perhaps two of the most important parts of
    game art

    and design to get right, often making the extra performance requirements worth
    the cost.

    Good Lighting and Shadowing can turn a mundane Scene into something spectacular,
    as

    there is something magical about professional coloring that makes it visually
    appealing.

    Even a low-poly art style (for example, the mobile game Monument Valley) relies
    heavily

    on a good Lighting and Shadowing profile in order to allow the player to distinguish
    one

    object from another and create a visually pleasing Scene.


    Unity offers multiple features that affect Lighting and Shadows, from real-time
    Lighting

    and Shadows (of which there are multiple types of each) to static Lighting called

    _Lightmapping_. There are a lot of options to explore, and of course, a lot of
    things that can

    cause performance issues if we''re not careful.


    > > The Unity documentation covers all of the various Lighting features in an

    > excellent amount of detail. Start with the following pages and work

    > through them; doing so will be well worth the time since these systems

    > affect the entire Rendering Pipeline; refer to

    > https://docs.unity3d.com/Manual/LightingOverview.html

    > https://unity3d.com/learn/tutorials/topics/graphics/

    > introduction-lighting-and-rendering.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'There are two different rendering formats, which can greatly affect our Lighting
    performance, known as **Forward Rendering and Deferred Rendering**. The setting
    for these Rendering options can be found under **Edit | Project Settings | Player
    | Other Settings | Rendering** and configured on a per-platform basis.


    # # Forward Rendering


    Forward Rendering is the traditional form of rendering Lights in our Scene, as
    explored previously. During Forward Rendering, each object will be rendered in
    multiple passes through the same Shader. How many passes are required will be
    based on the number, distance, and brightness of Light sources. Unity will try
    to prioritize the `DirectionalLight` Component that is affecting the object most
    and render the object in a _base pass_ as a starting point. It will then take
    several of the most powerful `PointLight` Components nearby and re-render the
    same object multiple times through the same Fragment Shader. Each of these Point
    Lights will be processed on a per-vertex basis and all remaining Lights will be
    condensed into an _average_ color by means of a technique called Spherical Harmonics.


    Some of this behavior can be simplified by setting a Light''s **Render Mode**
    to values such as **Not Important** and changing the value of **Edit | Project
    Settings | Quality | Pixel Light Count**. This value limits the number of Lights
    that will be gathered for Forward Rendering, but is overridden by any Lights with
    a **Render Mode** set to **Important**. It is, therefore, up to us to use this
    combination of settings responsibly.


    As we might imagine, using Forward Rendering can utterly explode our Draw Call
    count very quickly in Scenes with a lot of Point Lights present due to the number
    of Render States being configured and Shader passes required.


    > More information on Forward Rendering can be found in the Unity documentation
    at http://docs.unity3d.com/Manual/RenderTech-ForwardRendering.html.


    # # Deferred Rendering


    Deferred Rendering, or _Deferred Shading_ as it is sometimes known, is a technique
    that has been available on GPUs for about a decade or so, but it has not resulted
    in a complete replacement of the Forward Rendering method due to the caveats involved
    and somewhat limited support on mobile devices.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Deferred Shading is named as such because actual Shading does not occur until
    much later in the process, that is, it is deferred until later. It works by creating
    a geometry buffer (called a G-Buffer), where our Scene is initially rendered without
    any Lighting applied. With this information, the Deferred Shading system can generate
    a Lighting profile within a single pass.


    From a performance perspective, the results are quite impressive as it can generate
    very good per-pixel Lighting with little Draw Call effort. One disadvantage is
    that effects such as anti-aliasing, transparency, and applying Shadows to animated
    characters cannot be managed through Deferred Shading alone. In this case, the
    Forward Rendering technique is applied as a fallback to cover those tasks, thus
    requiring extra Draw Calls to complete it. A bigger issue with Deferred Shading
    is that it often requires more powerful and more expensive hardware and is not
    available for all platforms, so fewer users will be able to make use of it.


    > The Unity documentation contains an excellent source of information on the Deferred
    Shading technique and its benefits and pitfalls, which is found at http://docs.unity3d.com/Manual/RenderTech-
    DeferredShading.html.


    # Vertex Lit Shading (legacy)


    Technically, there are more than two Lighting methods. The remaining two are Vertex
    Lit Shading and a very primitive, feature-lax version of Deferred Rendering. Vertex
    Lit Shading is a massive simplification of Lighting, as Lighting will only be
    considered per-vertex and not per-pixel. In other words, entire faces are colored
    the same based on the incoming Light color rather than blending Lighting colors
    across the face through individual pixels.


    It is not expected that many, or really any, 3D games will make use of this legacy
    technique, as a lack of Shadows and proper Lighting make visualizations of depth
    very difficult. It is mostly used by simple 2D games that don''t need to make
    use of Shadows, Normal maps, and various other Lighting features.


    # Global Illumination


    Global Illumination, or GI for short, is an implementation of baked Lightmapping.
    Lightmapping is similar to the Shadowmaps created by Shadowing techniques in that
    one or more textures are generated for each object that represents extra Lighting
    information and is later applied to the object during its Lighting pass of a Fragment
    Shader to simulate static Lighting effects.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'The main difference between these Lightmaps and other forms of Lighting is
    that Lightmaps are pregenerated (or baked) in the Editor and packaged into the
    game build. This ensures that we don’t need to keep regenerating this information
    at runtime, saving numerous Draw Calls and significant GPU activity. Since we
    can bake this data, we have the luxury of time to generate very high-quality Lightmaps
    (at the expense of larger generated texture files we need to work with, of course).


    Since this information is baked ahead of time, it cannot respond to real-time
    activity during gameplay, and so by default, any Lightmapping information will
    only be applied to static objects that were present in the Scene when the Lightmap
    was generated and at the exact location they were placed. However, Light Probes
    can be added to the Scene to generate an additional set of Lightmap textures that
    can be applied to nearby dynamic objects that move, allowing such objects to benefit
    from pregenerated Lighting. This won’t have pixel-perfect accuracy and will cost
    disk space for the extra Light Probe maps and Memory Bandwidth at runtime to swap
    them around, but it does generate a more believable and pleasant Lighting profile.


    There have been several techniques of generating Lightmaps developed throughout
    the years, and Unity has used a couple of different solutions since its initial
    release. Global Illumination is simply the latest generation of the mathematical
    techniques behind Lightmapping, which offers very realistic coloring by calculating
    not only how Lighting affects a given object, but also how light reflects off
    nearby surfaces, allowing an object to affect the Lighting profile of those around
    it. This effect is calculated by an internal system called Enlighten. This tool
    is used both to create static Lightmaps, as well as create something called Pre-computed
    Real-time GI, which is a hybrid of real-time and static Shading and allows us
    to simulate effects such as time-of-day (where the direction of light from the
    Sun changes over time) without relying on expensive real-time Lighting effects.


    A typical issue with generating Lightmaps is the length of time it can take to
    generate them and get visual feedback on the current settings, because the Lightmapper
    is often trying to generate full-detail Lightmaps in a single pass. If the user
    attempts to modify its configuration, then the entire job must be canceled and
    started over. To solve this problem, Unity Technologies implemented the Progressive
    Lightmapper, which performs Lightmapping tasks more gradually over time, but also
    allows them to be modified while they are being calculated. This makes Lightmaps
    of the Scene appear to get progressively more detailed as it works in the background
    while also allowing us to change certain properties when it is still working and
    without having to restart the entire job. This provides almost immediate feedback
    and improves the workflow of generating Lightmaps immensely.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# # Multithreaded Rendering


    Multithreaded Rendering is enabled by default on most systems, such as desktop
    and console platforms whose CPUs provide multiple cores. Other platforms still
    support many low-end devices to enable this feature by default, so it is a toggleable
    option for them. For Android, it can be enabled via a checkbox under **Edit |
    Project Settings | Player | Other Settings | Multithreaded Rendering**, whereas
    for iOS, Multithreaded Rendering can be enabled by configuring the application
    to make use of Apple’s Metal API under **Edit | Project Settings | Player| Other
    Settings | Graphics API**. At the time of writing this book, WebGL does not support
    Multithreaded Rendering.


    For each object in our Scene, there are three tasks to complete: determine whether
    the object needs to be rendered (through a technique known as _Frustum Culling_),
    and if so, generate commands to render the object (since rendering a single object
    can result in dozens of different commands), and then send the command to the
    GPU using the relevant Graphics API. Without Multithreaded Rendering, all of these
    tasks must happen on the main thread of the CPU, thus any activity on the main
    thread becomes part of the critical path for all rendering. When Multithreaded
    Rendering is enabled, the task of pushing commands into the GPU are handled by
    a _render thread_, whereas other tasks such as culling and generating commands
    get spread across multiple _worker threads_. This setup can save an enormous number
    of CPU cycles for the main thread, which is where the overwhelming majority of
    other CPU tasks take place, such as physics and script code.


    Enabling this feature will affect what it means to be CPU bound. Without Multithreaded
    Rendering, the main thread is performing all of the work necessary to generate
    instructions for the Command Buffer, meaning that any performance we can save
    elsewhere will free up more time for the CPU to generate commands. However, when
    Multithreaded Rendering is taking place, a good portion of the workload is pushed
    onto separate threads, meaning that improvements to the main thread will have
    less of an impact on rendering performance via the CPU.


    > Note that being GPU bound is the same regardless of whether Multithreaded Rendering
    is taking place. The GPU always performs its tasks in a multithreaded fashion.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# # Low-level rendering APIs


    Unity exposes a rendering API to us through their `CommandBuffer` class. This
    allows us to control the Rendering Pipeline directly through our C# code by issuing
    high-level rendering commands, such as `render this object, with this Material,
    using this Shader`, or `draw N instances of this piece of procedural geometry`.
    This customization is not as powerful as having direct Graphics API access, but
    it is a step in the right direction for Unity developers to customize unique graphical
    effects.


    Check out the Unity documentation on `CommandBuffer` to make use of this feature
    at `http://docs.unity3d.com/ScriptReference/Rendering.CommandBuffer.html`.


    If an even more direct level of rendering control is needed, such that we wish
    to make direct Graphics API calls to OpenGL, DirectX, and Metal, then be aware
    that it is possible to create a Native Plugin (a small library written in C++
    code that is compiled specifically for the architecture of the target platform)
    that hooks into the Unity''s Rendering Pipeline, setting up callbacks for when
    particular rendering events happen, similar to how `MonoBehaviours` hook into
    various callbacks of the main Unity Engine. This is certainly an advanced topic
    for most Unity users, but useful to know for the future as our knowledge of rendering
    techniques and Graphics APIs matures.


    Unity provides some good documentation on generating a rendering interface in
    a Native Plugin at `https://docs.unity3d.com/Manual/NativePluginInterface.html`.


    # # Detecting performance issues


    It should be obvious that due to the number of complex processes involved, there
    are a lot of different ways in which the GPU can become bottlenecked. Now that
    we have a thorough understanding of the Rendering Pipeline and how bottlenecks
    may occur, let''s explore how to detect these problems.


    # # Profiling rendering issues


    The Profiler can be used to quickly narrow down which of the two devices used
    in the Rendering Pipeline we are bottlenecked within--whether it is the CPU or
    GPU. We must examine the problem using both the **CPU Usage** and **GPU Usage
    Areas** of the **Profiler** window, as this can tell us which device is working
    the hardest.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The following screenshot shows **Profiler** data for a CPU-bound application.
    The test involved creating thousands of simple cube objects, with no batching
    or Shadowing techniques taking place. This resulted in an extremely large Draw
    Call count (around 32,000) for the CPU to generate commands for, but giving the
    GPU relatively little work to do due to the simplicity of the objects being rendered:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_224_0.png)


    This example shows that the CPU''s **Rendering** task is consuming a large amount
    of cycles (around 25 ms per-frame), whereas the GPU is processing for less than
    4 milliseconds, indicating that the bottleneck resides in the CPU. Note that this
    Profiling test was performed against a standalone app, not within the Editor.
    We now know that our rendering is CPU bound and can begin to apply some CPU-saving
    performance improvements (being careful not to introduce rendering bottlenecks
    elsewhere by doing so).


    Meanwhile, Profiling a GPU-bound application via the Profiler is a little trickier.
    This time, the test involves creating a simple object requiring minimal Draw Calls,
    but using a very expensive Shader that samples a texture thousands of times to
    create an absurd amount of activity in the Back End.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# # Dynamic Graphics Chapter 6


    To perform fair GPU-bound Profiling tests, you should ensure that you disable
    Vertical Sync through Edit | Project Settings | Quality | Other | V Sync Count,
    otherwise it is likely to pollute our data.


    The following screenshot shows Profiler data for this test when it is run in a
    standalone application:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_225_0.png)


    As we can see in the preceding screenshot, the rendering task of the CPU Usage
    Area matches closely with the total rendering costs of the GPU Usage Area. We
    can also see that the CPU and GPU time costs at the bottom of the image are relatively
    similar (about 29 milliseconds each). This is somewhat confusing as we seem to
    be bottlenecked equally in both devices, where we would expect the GPU to be working
    much harder than the CPU.


    # [ 206 ]'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In actuality, if we drill down into the **Breakdown View** of the **CPU Usage
    Area** using

    the **Hierarchy Mode**, we will note that most of the CPU time is spent on the
    task

    labeled **Gfx.WaitForPresent**. This is the amount of time that the CPU is wasting
    while it

    waits for the GPU to finish the current frame. Hence, we are in fact bottlenecked
    by the

    GPU despite appearing as though we are bound by both. Even if Multithreaded Rendering

    is enabled, the CPU must still wait for the Rendering Pipeline to finish before
    it can begin

    the next frame.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_226_0.png)


    **Gfx.WaitForPresent** is also used to signal that the CPU is waiting on

    Vertical Sync to complete, hence the need to disable it for this test.


    # # Brute-force testing


    If we''re pouring over our Profiling data and still not sure where the source
    of the problem

    resides, or we''re GPU-bound and need to determine where we''re bottlenecked in
    the

    Rendering Pipeline, we should try the brute-force method, that is, cull a specific
    activity

    from the Scene and check whether it results in greatly improved performance. If
    a small

    change results in a big speed improvement, then we have a strong clue about where
    the

    bottleneck lies. There''s no harm in this approach if we eliminate enough unknown
    variables

    to ensure that the data is leading us in the right direction.


    The obvious brute-force test for CPU bounding will be to reduce Draw Calls to
    check

    whether performance suddenly improves. However, this is often not possible since,

    presumably, we''ve already been reducing our Draw Calls to a minimum through

    techniques such as Static Batching, Dynamic Batching, and Atlasing. This would
    mean that

    we have very limited scope for reducing them further.


    What we can do, however, is intentionally increase our Draw Call count by a small
    number,

    either by introducing more objects or disabling Draw Call-saving features such
    as Static and

    Dynamic Batching and observe whether the situation gets significantly worse than
    before. If

    so, then we have evidence that we''re either very close to being CPU bound or
    have already

    become so.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'There are two good brute-force tests we can apply to a GPU-bound application
    to determine whether we’re bound by Fill Rate or by Memory Bandwidth: reducing
    screen resolution or reducing texture resolution, respectively.


    By reducing screen resolution, we will ask the Rasterizer to generate significantly
    fewer fragments and transpose them over a smaller canvas of pixels for the Back
    End to process. This will reduce the Fill Rate consumption of the application,
    giving this key part of the Rendering Pipeline some additional breathing room.
    Ergo, if performance suddenly improves with a screen resolution reduction, then
    Fill Rate should be our primary concern.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_227_0.png)


    A reduction from a resolution of 2560 x 1440 to 800 x 600 is an improvement factor
    of about eight, which is often more than enough to reduce Fill Rate costs enough
    to make the application perform well again.


    Similarly, if we’re bottlenecked on Memory Bandwidth, then reducing texture quality
    is likely to result in a significant performance improvement. By doing so, we
    have shrunk the size of our textures, greatly reducing the Memory Bandwidth costs
    of our Fragment Shaders, allowing the GPU to fetch the necessary textures much
    quicker. Globally reducing texture quality can be achieved by going to **Edit
    | Project Settings | Quality | Texture Quality** and setting the value to **Half
    Res**, **Quarter Res**, or **Eighth Res**.


    An application bound by the CPU has ample opportunities for performance enhancements
    through practically every performance-enhancing tip in this book. If we free up
    CPU cycles from other activities, then we can afford to render more objects through
    more Draw Calls, keeping in mind, of course, that each will cost us more activity
    in the GPU. There are, however, additional opportunities to make some indirect
    improvements in Draw Call count while we try to improve other parts of the Rendering
    Pipeline. This includes Occlusion Culling, tweaking our Lighting and Shadowing
    behavior, and modifying our Shaders. These will be explained in the following
    sections as we investigate various performance enhancements.


    Meanwhile, we will probably need to apply a little brute-force testing and guesswork
    to determine how a GPU-bound application is bottlenecked. Most applications are
    bottlenecked by Fill Rate or Memory Bandwidth, so we should start there. It is
    rare to find performance bottlenecks in the Front End, at least on desktop applications,
    so it is worth checking only after we’ve verified that the other sources are not
    the problem. Vertex Shaders are often trivial compared to Fragment Shaders, and
    so the only real opportunity to cause problems with Front End processing is either
    to push too much geometry or to have overly complex Geometry Shaders.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Ultimately, this investigation should help us determine whether we are CPU-bound
    or GPU-bound, and in the latter case, whether we are bound by the Front End or
    Back End, and again in the latter case, whether we are bound by Fill Rate or Memory
    Bandwidth. With this knowledge, there are a number of techniques we can apply
    to improve performance.


    # # Rendering performance enhancements


    We should now have all of the information we need to make sense of performance
    bottlenecks so that we can start to apply fixes. For the remainder of this chapter,
    we will cover a series of techniques to improve Rendering Pipeline performance
    for CPU-bound and GPU-bound applications.


    # # Enable/Disable GPU Skinning


    The first tip involves a setting that eases the burden on the CPU or GPU Front
    End at the expense of the other, that is, GPU Skinning. Skinning is the process
    where mesh vertices are transformed based on the current location of their animated
    bones. The animation system, working on the CPU, transforms the object’s bones
    that are used to determine its current pose, but the next important step in the
    animation process is wrapping the mesh vertices around those bones to place the
    mesh in the final pose. This is achieved by iterating over each vertex and performing
    a weighted average against the bones connected to those vertices.


    This vertex processing task can either take place on the CPU or within the Front
    End of the GPU, depending on whether the **GPU Skinning** option is enabled. This
    feature can be toggled under **Edit | Project Settings | Player Settings | Other
    Settings | GPU Skinning**. Enabling this option pushes skinning activity to the
    GPU, although bear in mind that the CPU must still transfer the data to the GPU
    and will generate instructions on the Command Buffer for the task, so it doesn’t
    remove the CPU’s workload entirely. Disabling this option eases the burden on
    the GPU by making the CPU resolve the mesh’s pose before transferring mesh data
    across and simply asking the GPU to draw it as is. Obviously, this feature is
    useful if we have lots of animated meshes in our Scenes and can be used to help
    either bounding case by pushing the work onto the device that is least busy.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# # Reduce geometric complexity


    This tip concerns the GPU Front End. We have already covered some techniques on
    mesh optimization in Chapter 4, Kickstart Your Art, which can help reduce our
    mesh''s vertex attributes. As a quick reminder, it is not uncommon to use a mesh
    that contains a lot of unnecessary UV and Normal vector data, so our meshes should
    be double-checked for this kind of superfluous fluff. We should also let Unity
    optimize the structure for us, which minimizes cache misses as vertex data is
    read within the Front End.


    The goal is to simply reduce actual vertex counts. There are three solutions to
    this. First, we can simplify the mesh by either having the art team manually tweak
    and generate meshes with lower polycounts or using a mesh decimation tool to do
    it for us. Second, we could simply remove meshes from the Scene, but this should
    be a last resort. The third option is to implement automatic culling through features
    such as Level of Detail (LOD), which will be explained later in this chapter.


    # # Reduce Tessellation


    Tessellation through Geometry Shaders can be a lot of fun, as it is a relatively
    underused technique that can really make our graphical effects stand out from
    among the crowd of games that use only the most common effects. However, it can
    contribute enormously to the amount of processing work taking place in the Front
    End.


    There aren''t really any simple tricks we can exploit to improve Tessellation,
    besides improving our Tessellation algorithms or easing the burden caused by other
    Front End tasks to give our Tessellation tasks more room to breathe. Either way,
    if we have a bottleneck in the Front End and are making use of Tessellation techniques,
    we should double-check that they are not consuming the lion''s share of the Front
    End''s budget.


    # # Employ GPU Instancing


    GPU Instancing is a means to render multiple copies of the same mesh quickly by
    exploiting the fact that they will have identical Render States, hence require
    minimal Draw Calls. This is practically identical to Dynamic Batching, except
    that it is not an automatic process. In fact, we can think of Dynamic Batching
    as poor-man''s GPU Instancing since GPU Instancing can enable even better savings
    and allows for more customization by allowing parameterized variations.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'GPU Instancing is applied at the Material level with the **Enable Instancing**
    checkbox, and variations can be introduced by modifying Shader code. This way,
    we can give different instances different rotations, scales, colors, and so on.
    This is useful for rendering Scenes such as forests and rocky areas where we want
    to render hundreds or thousands of different copies of a mesh with some slight
    variation.


    > Note that Skinned Mesh Renderers cannot be instanced for similar reasons that
    they cannot be Dynamically Batched, and not all platforms and APIs support GPU
    Instancing.


    The following screenshot shows the benefits of GPU Instancing on a group of 512
    cube objects (with some extra Lighting and Shadowing applied to increase the total
    Draw Call count):


    ![](img/da79484c9b30dc915216dbc5454a9bbf_230_0.png)


    This system is much more versatile than Dynamic Batching since we have more control
    of how objects are batched together. Of course, there are more opportunities for
    mistakes if we batch things in inefficient ways, so we should be careful to use
    it wisely.


    Check out the Unity documentation for more information on GPU Instancing at https://
    docs.unity3d.com/Manual/GPUInstancing.html.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# # Use mesh-based Level Of Detail (LOD)


    LOD is a broad term referring to the dynamic replacement of features based on
    their

    distance from the Camera and/or how much space they take up in the Camera’s view.
    Since

    it can be difficult to tell the difference between a low- and high-quality object
    at great

    distances, there is very little reason to render the high-quality version, and
    so we may as

    well dynamically replace distant objects with something more simplified. The most

    common implementation of LOD is mesh-based LOD, where meshes are dynamically

    replaced with lower detailed versions as the Camera gets farther and farther away.


    Making use of mesh-based LOD can be achieved by placing multiple objects in the
    Scene

    and making them children of a `GameObject` with an attached `LODGroup` Component.

    The LOD Group’s purpose is to generate a bounding-box from these objects and decide
    which

    object should be rendered based on the size of the bounding-box within the Camera’s
    field

    of view. If the object’s bounding-box consumes a large area of the current view,
    then it will

    enable the mesh(es) assigned to lower LOD Groups, and if the bounding-box is very
    small,

    it will replace the mesh(es) with those from higher LOD Groups. If the mesh is
    too far away,

    it can be configured to hide all child objects. So, with the proper setup, we
    can have Unity

    replace meshes with simpler alternatives, or cull them entirely, which eases the
    burden on

    the rendering process.


    Check out the Unity documentation for more detailed information on the mesh-based
    LOD

    feature at `http://docs.unity3d.com/Manual/LevelOfDetail.html`.


    This feature can cost us a large amount of development time to fully implement;
    artists

    must generate lower polygon count versions of the same object, and level designers
    must

    generate LOD Groups, configure them, and test them to ensure that they don’t cause
    jarring

    transitions as the Camera moves closer or farther away.


    > > Note that some game development middleware companies offer third-

    > party tools for automated LOD mesh generation. These might be worth

    > investigating to compare their ease of use versus quality loss versus cost

    > effectiveness.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Mesh-based LOD will also cost us in disk footprint as well as RAM and CPU;
    the alternative meshes need to be bundled, loaded into RAM, and the `LODGroup`
    Component must routinely test whether the Camera has moved to a new position that
    warrants a change in LOD level. The benefits on the Rendering Pipeline are rather
    impressive, however. Dynamically rendering simpler meshes reduces the amount of
    vertex data we need to pass and potentially reduces the number of Draw Calls,
    Fill Rate, and Memory Bandwidth needed to render the object.


    Due to the number of sacrifices needed for mesh-based LOD to function, developers
    should avoid preoptimizing by automatically assuming that mesh-based LOD will
    help them. Excessive use of the feature will lead to burdening other parts of
    our application''s performance and chew up precious development time, all for
    the sake of paranoia. It should only be used if we start to observe problems in
    the Rendering Pipeline, and we''ve got CPU, RAM, and development time to spare.


    Having said that, Scenes that feature large, expansive views of the world and
    have lots of Camera movement, might want to consider implementing this technique
    very early, as the added distance and massive number of visible objects will likely
    exacerbate the vertex count enormously. As a counter example, Scenes that are
    always indoors or feature a Camera with a viewpoint looking down at the world
    will find little benefit in this technique since objects will tend to be at a
    similar distance from the Camera at all times. Examples include **Real-Time Strategy
    (RTS)** and **Multiplayer Online Battle Arena (MOBA)** games.


    # # Culling Groups


    Culling Groups are a part of the Unity API that effectively allows us to create
    our own custom LOD system as a means of coming up with our own ways of dynamically
    replacing certain gameplay or rendering behaviors. Some examples of things we
    might want to apply LOD to include replacing animated characters with a version
    with fewer bones, applying simpler Shaders, skipping Particle System generation
    at great distances, simplifying AI behavior, and so on.


    Since the Culling Group system at its most basic level simply tells us whether
    objects are visible to the Camera, and how big they are, it also has other uses
    in the realm of Gameplay, such as determining whether certain enemy spawn points
    are currently visible to the player or whether a player is approaching certain
    areas. There are a wide range of possibilities available with the Culling Group
    system that makes it worth considering. Of course, the time spent to implement,
    test, and redesign Scenes to exploit can be significant.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# # Make use of Occlusion Culling


    One of the best ways to reduce both Fill Rate consumption and Overdraw is to make
    use of Unity''s Occlusion Culling system. The system works by partitioning the
    world into a series of small cells and flying a virtual Camera through the Scene,
    making note of which cells are invisible from other cells (are _occluded_) based
    on the size and position of the objects present.


    Note that this is different from the technique of Frustum Culling, which culls
    objects outside the current Camera view. Frustum Culling is always active and
    automatic. Objects culled by this process are, therefore, automatically ignored
    by the Occlusion Culling system.


    Occlusion Culling data can only be generated for objects properly labeled **Occluder
    Static** and/or **Occludee Static** under the **StaticFlags** dropdown. **Occluder
    Static** is the general setting for static objects we expect to be so large that
    they will both occlude and be occluded by other objects, such as sky scrapers
    or mountains, which can hide other objects behind them, as well as be hidden behind
    each other, and so on. **Occludee Static** is a special case for things such as
    transparent objects that always require other objects behind them to be rendered,
    but they themselves need to be hidden if something large blocks their visibility.


    Naturally, because **Static** flags must be enabled for Occlusion Culling, this
    feature will not work for dynamic objects.


    The following screenshot shows how effective Occlusion Culling can be at reducing
    the number of rendered objects from our Scene from an external point of view for
    the sake of demonstration. From the point of view of the Main Camera, the two
    situations appear identical.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_233_0.png)


    ![](img/da79484c9b30dc915216dbc5454a9bbf_233_1.png)'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'The Rendering Pipeline is not wasting time rendering objects that are obscured
    by closer ones:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_234_0.png)


    Enabling the Occlusion Culling feature will cost additional disk space, RAM, and
    CPU time. Extra disk space is required to store the occlusion data, extra RAM
    is needed to keep the data structure in memory, and there will be a CPU processing
    cost to determine which objects are being occluded in each frame. The Occlusion
    Culling data structure must be properly configured to create cells of the appropriate
    size for our Scene and the smaller the cells, the longer it takes to generate
    the data structure. However, if it is configured correctly for the Scene, Occlusion
    Culling can provide both Fill Rate savings through reduced Overdraw and Draw Call
    savings by culling nonvisible objects.


    > Note that even though an object may be culled by occlusion, its Shadows must
    still be calculated, so we won’t save any Draw Calls or Fill Rate from those tasks.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# # Optimizing Particle Systems


    Particle Systems are useful for a huge number of different visual effects, and
    usually the more particles they generate, the better the effect looks. However,
    we will need to be responsible about the number of particles generated and the
    complexity of Shaders used since they can touch on all parts of the Rendering
    Pipeline; they generate a lot of vertices for the Front End (each particle is
    a quad) and could use multiple textures, which consume Fill Rate and Memory Bandwidth
    in the Back End, so they can potentially cause an application to be bound anywhere
    if used irresponsibly.


    Reducing Particle System density and complexity are fairly straightforward--use
    fewer Particle Systems, generate fewer particles, and/or use fewer special effects.
    Atlasing is also another common technique to reduce Particle System performance
    costs. However, there is an important performance consideration behind Particle
    Systems that is not too well known and happens behind the Scenes, and that is
    the process of automatic Particle System culling.


    # # Make use of Particle System Culling


    Unity Technologies have released an excellent blog post covering this topic, which
    can be found at `https://blogs.unity3d.com/2016/12/20/unitytips-particlesystem-performance-culling/`.


    The basic idea is that all Particle Systems are either predictable or not (deterministic
    versus nondeterministic), depending on various settings. When a Particle System
    is predictable and not visible to the main view, then the entire Particle System
    can be automatically culled away to save performance. As soon as a predictable
    Particle System comes back into view, Unity can figure out exactly how the Particle
    System is meant to look at that moment as if it had been generating particles
    the entire time it wasn''t visible. So long as the Particle System generates particles
    in a very procedural way, then the state is immediately solvable mathematically.


    However, if any setting forces the Particle System to become unpredictable or
    `nonprocedural`, then it would have no idea what the current state of the Particle
    System needs to be, had it been hidden previously, and will hence need to render
    it fully every frame regardless of whether or not it is visible. Settings that
    break a Particle System''s predictability include, but are not limited to making
    the Particle System render in world-space, applying external forces, collisions,
    and Trails, or using complex Animation Curves. Check out the blog post mentioned
    previously for a rigorous list of nonprocedural conditions.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Note that Unity provides a useful warning on Particle Systems when something
    would

    cause it to break automatic culling, as shown in the following screenshot:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_236_0.png)


    # # Avoid recursive Particle System calls


    Many methods available to a `ParticleSystem` Component are recursive calls. Calling

    them will iterate through each child of the Particle System, which then calls

    `GetComponent<ParticleSystem>()` on each child, and if the Component exists, it
    will

    call the appropriate method. This then repeats for each child `ParticleSystem`
    beneath the

    original parent, its grandchildren, and so on. This can be a huge problem with
    deep

    hierarchies of Particle Systems, which is sometimes the case with complex effects.


    There are several `ParticleSystem` API calls affected by this behavior, such as
    `Start()`,

    `Stop()`, `Pause()`, `Clear()`, `Simulate()`, and `isAlive()`. We obviously cannot
    avoid

    these methods entirely since they represent the most common methods we would want
    to

    call on a Particle System. However, each of these methods has a `withChildren`
    parameter

    that defaults to `true`. By passing `false` in place of this parameter (for example,
    by calling

    `Clear(false)`, it disables the recursive behavior and will not call into its
    children. Hence,

    the method call will only affect the given Particle System, thus reducing the
    overhead cost

    of the call.


    This is not always ideal since we do often want all children of the Particle System
    to be

    affected by the method call. Another approach is to, therefore, cache the `ParticleSystem`

    Components in the same way we learned in _Chapter 2, Scripting Strategies_, and
    iterate

    through them manually ourselves (making sure that we pass `false` for the `withChildren`

    parameter each time).'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# # Optimizing Unity UI


    Unity''s first few attempts at built-in UI Systems were not particularly successful;
    it is often quickly supplanted by products on the Asset Store. However, the latest
    generation of their solution (simply called Unity UI) has become a much more popular
    solution, so many developers are starting to rely on it for their UI needs so
    much so, in fact, that Unity Technologies bought the company behind the Text Mesh
    Pro asset in early 2017 and have merged it into the Unity UI as a built-in feature.


    Let''s explore a few techniques we can use to improve the performance of Unity''s
    built-in UI.


    # # Use more Canvases


    A `Canvas` Component''s primary task is to manage the meshes that are used to
    draw the UI elements beneath them in the **Hierarchy** window and issues the Draw
    Calls necessary to render those elements. An important task of the Canvas is to
    batch these meshes together (which can only happen if they share the same Material)
    to reduce Draw Calls. However, when changes are made to a Canvas, or any of its
    children, this is known as _dirtying_ the Canvas. When a Canvas is _dirty_, it
    needs to regenerate meshes for all of the UI elements beneath it before it can
    issue a Draw Call. This regeneration process is not a simple task and is a common
    source of performance problems in Unity projects, because unfortunately there
    are many things that can cause the Canvas to be made dirty. Even changing a single
    UI element within a Canvas can cause this to occur. There are so many things that
    cause dirtying, and so few that don''t (and usually only in certain circumstances)
    that it''s best to simply err on the side of caution and assume that any change
    will cause this effect.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_237_0.png)


    Perhaps the only notable action that doesn''t cause dirtying is changing a `Color`
    property of a UI element.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'If we find our UI causes a large spike in CPU usage any time something changes
    (or sometimes literally every frame if they''re being changed every frame), one
    solution we can apply is to simply use more Canvases. A common mistake is to build
    the entire game''s UI in a single Canvas and keep it this way as the game code
    and its UI continues to become more complex.


    This means that it will need to check every element every time anything changes
    in the UI, which can become more and more disastrous on performance as more elements
    are crammed into a single Canvas. However, each Canvas is independent and does
    not need to interact with other Canvases in the UI and so by splitting up the
    UI into multiple Canvases we can separate the workload and simplify the tasks
    required by any single Canvas.


    Ensure that you add a `GraphicsRaycaster` Component to the same `GameObject` as
    the child Canvas so that its own child elements can still be interacted with.
    Conversely, if none of the Canvas'' child elements are interactable, then we can
    safely remove any `GraphicsRaycaster` Components from it to reduce performance
    costs.


    In this case, even though an element still changes, fewer other elements will
    need to be regenerated in response, reducing the performance cost. The downside
    of this approach is that elements across different Canvases will not be batched
    together, so we should try to keep similar elements with the same Material grouped
    together within the same Canvas, if possible.


    It''s also possible to make a Canvas a child of another Canvas, for the sake of
    organization, and the same rules apply. If an element changes in one Canvas, the
    other will be unaffected.


    # # Separate objects between static and dynamic canvases


    We should strive to try and generate our Canvases in a way that groups elements
    based on when they get updated. We should think of our elements as fitting within
    one of three groups: _Static_, _Incidental Dynamic_, and _Continuous Dynamic_.
    Static UI elements are those that never change, and good examples of these are
    background images, labels, and so on. Dynamic elements are those that can change,
    where Incidental Dynamic objects are those UI elements that only change in response
    to something, such as a UI button press or a hover action, whereas Continuous
    Dynamic objects are those UI elements that update regularly, such as animated
    elements.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'We should try to split UI elements from these three groups into three different
    Canvases for any given section of our UI, as this will minimize the amount of
    wasted effort during regeneration.


    # # Disable Raycast Target for noninteractive elements


    UI elements have a **Raycast Target** option, which enables them to be interacted
    with by clicks, taps, and other user behavior. Each time one of these events takes
    place, the `GraphicsRaycaster` Component will perform pixel-to-bounding-box checks
    to figure out which element has been interacted with and is a simple iterative
    `for` loop. By disabling this option for noninteractive elements, we''re reducing
    the number of elements that the `GraphicsRaycaster` needs to iterate through,
    saving performance.


    # # Hide UI elements by disabling the parent Canvas Component


    The UI uses a separate Layout System to handle regeneration of certain element
    types, which operates in a similar way as dirtying a Canvas. `UIImage`, `UIText`,
    and `LayoutGroup` are all examples of Components that fall under this system.
    There are many things that can cause a Layout System to become dirty, most obvious
    of which are enabling and disabling such elements. However, if we want to disable
    a portion of the UI, we can avoid these expensive regeneration calls from the
    Layout System by simply disabling the `Canvas` Component they are children of.
    This can be done by setting the `Canvas` Component''s `enabled` property to `false`.
    The drawback of this approach is that if any child objects that have some `Update()`,
    `FixedUpdate()`, `LateUpdate()`, or Coroutine code, then we would need to also
    disable them manually, otherwise they will continue to run. By disabling the `Canvas`
    Component, we''re only stopping the UI from being rendered and interacted with,
    and we should expect various update calls to continue to happen as normal.


    # # Avoid Animator Components


    Unity''s `Animator` Components were never intended to be used with the latest
    version of its UI System, and their interaction with it is a naive implementation.
    Each frame, the Animator will change properties on UI elements that causes their
    Layouts to be dirtied and cause regeneration of a lot of internal UI information.
    We should avoid using Animators entirely, and instead perform tweening ourselves
    or use a utility asset intended for such operations.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# # Explicitly define the Event Camera for World Space Canvases


    Canvases can be used for UI interactions in both 2D and 3D. This is determined
    by whether

    the Canvas has its **Render Mode** setting configured to **Screen Space** (2D)
    or **World Space**

    (3D). Any time a UI interaction takes place, the `Canvas` Component will check
    its

    `eventCamera` property (exposed as **Event Camera** in the **Inspector** window)
    to figure out

    which Camera to use. By default, a 2D Canvas will set this property to the Main
    Camera,

    but a 3D Canvas leaves it set to `null`. This is unfortunate because each time
    the Event

    Camera is needed, it will still use the Main Camera, but do so by calling

    `FindObjectWithTag()`. Finding objects by Tag isn''t bad as a performance cost
    as using

    the other variations of `Find()`, but its performance cost scales linearly with
    the more Tags

    we use in a given project. To make matters worse, the Event Camera is accessed
    fairly often

    during a given frame for a **World Space** Canvas, which means leaving this property

    `null` will cause a huge performance hit for no real benefit. We should manually
    set this

    property to the Main Camera for all of our **World Space** Canvases.


    # # Don''t use alpha to hide UI elements


    Rendering a UI element with an alpha value of `0` in its `color` property will
    still cause a

    Draw Call to be issued. We should favor changing the `IsActive` property of a
    UI element

    in order to hide it when necessary. Another alternative is to use Canvas Groups
    via

    `CanvasGroup` Components, which can be used to control the alpha transparency
    of all child

    elements beneath them. Setting the `alpha` value of a Canvas Group to `0` will
    cull away its

    child objects, and, therefore, no Draw Calls will be issued.


    # # Optimizing ScrollRects


    `ScrollRect` Components are UI elements that are used to scroll through a list
    of other UI

    elements and are fairly common in mobile applications. Unfortunately, the performance
    of

    these elements scales very poorly with size since the Canvases needs to regenerate
    them

    regularly. There are a number of things we can do to improve the performance of
    our

    `ScrollRect` Components.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Make sure to use a RectMask2D


    It''s possible to create scrolling UI behavior by simply placing other UI elements
    with a lower depth value than the ScrollRect elements. However, this is bad practice
    since there will be no culling taking place in the ScrollRect, and every element
    will need to be regenerated for each frame that the ScrollRect is moving. If we
    haven''t already, we should use a RectMask2D Component to clip and cull child
    objects that are not visible. This Component creates a region of space whereby
    any child UI elements within it will be culled away if they are outside the bounds
    of the RectMask2D Component. The cost of determining whether to cull an object
    compared to the savings of rendering too many invisible ones is typically worth
    it.


    # Disable Pixel Perfect for ScrollRects


    Pixel Perfect is a setting on a Canvas Component that forces its child UI elements
    to be drawn with direct alignment to the pixels on the screen. This is often a
    requirement for art and design, as the UI elements will appear much sharper than
    if it was disabled. While this alignment behavior is a relatively expensive operation,
    it is effectively mandatory that it will be enabled for the majority of our UI
    to keep things crisp and clear. However, for animating and fast-moving objects,
    it can be somewhat pointless due to the motion involved. Disabling Pixel Perfect
    for ScrollRect elements is a good way to make some impressive savings. However,
    since the Pixel Perfect setting affects the entire Canvas, we should make sure
    to enable the ScrollRect element as a child object beneath a separate Canvas so
    that other elements will maintain their pixel-aligned behavior.


    > Different kinds of animated UI elements actually look better with Pixel Perfect
    disabled. Be sure to do some testing, as it can save quite a bit of performance.


    # Manually stop ScrollRect motion


    The Canvas will always need to regenerate the entire ScrollRect element even if
    the velocity is moving by a fraction of a pixel each frame. We can manually freeze
    its motion once we detect that its velocity is below a certain threshold using
    ScrollRect.velocity and ScrollRect.StopMovement(). This can help reduce the frequency
    of regeneration a great deal.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# # Use empty UIText elements for full-screen interaction


    A common implementation in most UIs is to activate a large, transparent interactable
    element that covers the entire screen, forcing the player to handle a popup before
    proceeding, while still allowing the player to see what''s going on behind it
    (as a means of not ripping the player out of the game experience entirely). This
    is often done with a `UIImage` element, but unfortunately this can break batching
    operations and transparency can be a problem on mobile devices.


    A hacky way around this problem is to use a `UIText` element with no **Font**
    or **Text** defined. This creates an element that doesn''t need to generate any
    renderable information and only handles bounding-box checks for interaction.


    # # Check the Unity UI source code


    Unity provides the code for its UI system in a bitbucket repository found at `https://
    bitbucket.org/Unity-Technologies/ui`.


    If we''re having significant problems with the performance of our UI, its possible
    to look into the source code to figure out exactly what might be going on and
    hopefully discover ways to get around the problem.


    A more drastic measure, but a potential option, could be to actually modify the
    UI code, compile it, and add it to our project manually.


    # # Check the documentation


    The tips mentioned previously are some of the more obscure, undocumented, or critical
    performance optimization tips for the UI System. There are a number of great resources
    on the Unity website that explain how the UI System works and how best to optimize
    it, which is far too large to fit in this book verbatim.


    Start with the following page and work your way through them for many more helpful
    UI optimization tips: `https://unity3d.com/learn/tutorials/temas/best-practices/guide-
    optimizing-unity-ui`.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # Shader optimization


    Fragment Shaders are the primary consumers of Fill Rate and Memory Bandwidth.
    The costs depend on their complexity--how much texture sampling takes place, how
    many mathematical functions are used, and many more factors. The GPU''s parallel
    nature (sharing small pieces of the overall job between hundreds of threads) means
    that any bottleneck in a thread will limit how many fragments can be pushed through
    that thread during a frame.


    The classic analogy is a vehicle assembly line. A complete vehicle requires multiple
    stages of manufacture to complete. The critical path to completion might involve
    stamping, welding, painting, assembly, and inspection, where each step is completed
    by a single team. For any given vehicle, no stage can begin before the previous
    one is finished, but whatever team handled the stamping for the last vehicle can
    begin stamping for the next vehicle as soon as it has finished. This organization
    allows each team to become masters of their particular domain rather than trying
    to spread their knowledge too thin, which would likely result in less consistent
    quality in the batch of vehicles.


    We can double the overall output by doubling the number of teams, but if any team
    gets blocked, then precious time is lost for any given vehicle, as well as all
    future vehicles that would pass through the same team. If these delays are rare,
    then they can be negligible in the grand scheme, but if not, and even if one stage
    takes several minutes longer than normal each and every time it must complete
    the task, then it can become a bottleneck that threatens the release of the entire
    batch.


    The GPU parallel processors work in a similar way: each processor thread is an
    assembly line, each processing stage is a team, and each fragment is the thing
    that needs to be built. If the thread spends a long time processing a single stage,
    then time is lost on each fragment. This delay will multiply such that all future
    fragments coming through the same thread will be delayed. This is a bit of an
    oversimplification, but it often helps to paint a picture of how quickly some
    poorly optimized Shader code can chew up our Fill Rate and how small improvements
    in Shader optimization provide big benefits in Back End performance.


    Shader programming and optimization is a very niche area of game development.
    Their abstract and highly specialized nature requires a very different kind of
    thinking to generate high-quality Shader code compared to a typical gameplay or
    Engine code. They often feature mathematical tricks and back-door mechanisms for
    pulling data into the Shader, such as precomputing values and putting them in
    texture files. Because of this, and the importance of optimization, Shaders tend
    to be very difficult to read and reverse-engineer.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Consequently, many developers rely on prewritten Shaders, visual Shader creation
    tools from the Asset Store, such as Shader Forge, or Amplify Shader Editor. This
    simplifies the act of initial Shader code generation, but might not result in
    the most efficient form of Shaders. Whether we''re writing our own Shaders, or
    we''re relying on prewritten/pregenerated Shaders, we might find it worthwhile
    to perform some optimization passes over them using some tried-and-true techniques.


    # ## Consider using Shaders intended for mobile platforms


    The built-in mobile Shaders in Unity do not have any specific restrictions that
    force them to only be used on mobile devices. They are simply optimized for minimum
    resource usage (and tend to feature some of the other optimizations listed in
    this section).


    Desktop applications are perfectly capable of using these Shaders, but they tend
    to feature a loss of graphical quality. It only becomes a question of whether
    the loss of graphical quality is acceptable. So, consider doing some testing with
    the mobile equivalents of common Shaders to check whether they are a good fit
    for your game.


    # ## Use small data types


    GPUs can calculate with smaller data types more quickly than larger types (particularly
    on mobile platforms), so the first tweak we can attempt is replacing our `float`
    data types (32- bit, floating-point) with smaller versions such as `half` (16-bit,
    floating-point) or even `fixed` (12-bit fixed point). The size of the data types
    listed previously will vary depending on what floating-point formats the target
    platform prefers. The sizes listed are the most common. The optimization comes
    from the relative size between formats since there are fewer bits to process.


    Color values are good candidates for precision reduction, as we can often get
    away with less precise color values without much noticeable loss in coloration.
    However, the effects of reducing precision can be very unpredictable for graphical
    calculations. So, changes such as these can require some testing to verify that
    the reduced precision is costing too much graphical fidelity.


    > Note that the effects of these tweaks can vary enormously between one GPU architecture
    and another (for example, AMD versus Nvidia versus Intel), and even GPU brands
    from the same manufacturer. In some cases, we can make some decent performance
    gains for a trivial amount of effort. In other cases, we might see no benefit
    at all.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# # Avoid changing precision while swizzling


    Swizzling is the Shader programming technique of creating a new `vector` (an array
    of values) from an existing `vector` by listing the components in the order in
    which we wish to copy them into the new structure.


    Here are some examples of swizzling:


    ```

    ```

    float4 input = float4(1.0, 2.0, 3.0, 4.0); // initial test value (x, y, z, w)


    // swizzle two components

    float2 val1 = input.yz; // val1 = (2.0, 3.0)


    // swizzle three components in a different order

    float3 val2 = input.zyx; // val2 = (3.0, 2.0, 1.0)


    // swizzle the same component multiple times

    float4 val3 = input.yyy; // val3 = (2.0, 2.0, 2.0)


    // swizzle a scalar multiple times

    float sclr = input.w; // sclr = (4.0)

    float3 val4 = sclr.xxx; // val4 = (4.0, 4.0, 4.0)

    ```

    ```


    We can use both the `xyzw` and `rgba` representations to refer to the same components,
    sequentially. It does not matter whether it is a `color` or `vector`; they just
    make the Shader code easier to read. We can also list components in any order
    we like to fill in the desired data, repeating them if necessary.


    Converting from one precision type to another in a Shader can be a costly operation,
    but converting the precision type while simultaneously swizzling can be particularly
    painful. If we have mathematical operations that use swizzling, ensure that they
    don’t also convert the precision type. In these cases, it would be wiser to simply
    use the high-precision data type from the very beginning or reduce precision across
    the board to avoid the need for changes in precision.


    # # Use GPU-optimized helper functions


    The Shader compiler often performs a good job of reducing mathematical calculations
    down to an optimized version for the GPU, but compiled custom code is unlikely
    to be as effective as both the Cg library’s built-in helper functions and the
    additional helpers provided by the Unity Cg included files. If we are using Shaders
    that include custom function code, perhaps we can find an equivalent helper function
    within the Cg or Unity libraries that can do a better job than our custom code
    can.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'These extra `include` files can be added to our Shader within the `CGPROGRAM`
    block, as follows:

    ```

    CGPROGRAM

    // other includes

    #include "UnityCG.cginc"

    // Shader code here

    ENDCG

    ```


    Example Cg library functions to use are `abs()` for absolute values, `lerp()`
    for linear interpolation, `mul()` for multiplying matrices, and `step()` for step
    functionality. Useful `UnityCG.cginc` functions include `WorldSpaceViewDir()`
    for calculating the direction toward the Camera and `Luminance()` for converting
    a color to grayscale.


    Check out http://http.developer.nvidia.com/CgTutorial/cg_tutorial_appendix_e.html
    for a full list of Cg standard library functions.


    Check out the Unity documentation for a complete and up-to-date list of possible
    `include` files and their accompanying helper functions at http://docs.unity3d.com/Manual/SL-BuiltinIncludes.html.


    # # Disable unnecessary features


    Perhaps we can make savings by simply disabling Shader features that aren''t vital.
    Does the Shader really need transparency, Z-writing, alpha-testing, and/or alpha
    blending? Will tweaking these settings or removing these features give us a good
    approximation of our desired effect without losing too much graphical fidelity?
    Making such changes is a good way of making Fill Rate cost savings.


    # # Remove unnecessary input data


    Sometimes, the process of writing a Shader involves a lot of back and forth experimentation
    in editing code and viewing it in the Scene. The typical outcome of this process
    is that input data that was needed when the Shader was going through early development
    is now surplus fluff once the desired effect has been obtained, and it''s easy
    to forget what changes were made when/if the process drags on for a long time.
    However, these redundant data values can cost the GPU valuable time, as they must
    be fetched from memory even if they are not explicitly used by the Shader. So,
    we should double-check our Shaders to ensure that all of their input geometry,
    vertex, and fragment data are actually being used.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# # Expose only necessary variables


    Exposing unnecessary variables from our Shader to the accompanying Material can
    be costly, as the GPU can’t assume these values are constant, which means the
    compiler cannot compile away these values. This data must be pushed from the CPU
    with every pass since they can be modified at any time through a Material object’s
    methods such as `SetColor()` and `SetFloat()`. If we find that, toward the end
    of the project, we always use the same value for these variables then they should
    be replaced with a constant in the Shader to remove such excess runtime workload.
    The only cost is obfuscating what could be critical graphical effect parameters,
    so this should be done very late in the process.


    # # Reduce mathematical complexity


    Complicated mathematics can severely bottleneck the rendering process, so we should
    do whatever we can to limit the damage. It is entirely possible to store a map
    of complex mathematical function outputs by precalculating them and placing them
    as floating-point data in a texture file. A texture file is, after all, just a
    huge blob of floating-point values that can be indexed quickly with three dimensions:
    x, y, and color (rgba). We can feed this texture into the Shader and sample the
    pregnerated table in the Shader at runtime instead of completing a complex calculation
    at runtime.


    We may not see any improvement with functions such as `sin()` and `cos()` since
    they’ve been heavily optimized to make use of GPU architecture, but complex methods
    such as `pow()`, `exp()`, `log()`, and our own custom mathematical calculations
    can only be optimized so much and would be good candidates for simplification.
    This is assuming that we can easily index the result from the texture with x and
    y coordinates. If complex calculations are required to generate those coordinates,
    then it may not be worth the effort.


    This technique will cost us additional graphics memory to store the texture at
    runtime and some Memory Bandwidth, but if the Shader has already been receiving
    a texture (which they are, in most cases), but the alpha channel is not being
    used, then we could sneak the data in through the texture’s alpha channel, costing
    us literally no performance since that data has already been passed through anyway.
    This will involve hand-editing our art assets to include such data in any unused
    color channel(s), possibly requiring coordination between programmers and artists,
    but is a very good way of saving Shader processing costs with no runtime sacrifices.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# # Reduce texture sampling


    Texture sampling is at the core of all Memory Bandwidth costs. The fewer textures
    we use,

    and the smaller we make them, the better. The more we use, the more cache misses
    we are

    likely to invoke, and the larger they are, the more Memory Bandwidth is consumed

    transferring them into the Texture Cache. Such situations should be simplified
    as much as

    possible to avoid severe GPU bottlenecks.


    Even worse, sampling textures in a nonsequential order would likely result in
    some very

    costly cache misses for the GPU to suffer through. So, if this is being done,
    then the texture

    should be reordered so that it can be sampled in a more sequential order. For
    example,

    if we''re sampling by inverting the x and y coordinates (for example, tex2D (y,
    x)

    instead of tex2D (x, y)), the texture lookup would iterate through the texture
    vertically,

    then horizontally, inflicting a cache-miss almost every iteration. A lot of performance
    could be

    saved by simply rotating the texture file data and performing a sample in the
    correct order

    (tex2D (x, y)).


    # # Avoid conditional statements


    When conditional statements are run through a modern day CPU, they undergo a lot
    of

    clever predictive techniques to make use of instruction-level parallelism. This
    is a feature

    where the CPU attempts to predict which direction a conditional statement will
    go in before

    it has actually been resolved and speculatively begins processing the most likely
    result of

    the conditional using any free cores that aren''t being used to resolve the conditional

    (fetching some data from memory, copying some floating-point values into unused

    registers, and so on). If it turns out that the decision is wrong, then the current
    result is

    discarded and the proper path is taken instead. So long as the cost of speculative
    processing

    and discarding false results is less than the time spent waiting to decide the
    correct path,

    and it is right more often than it is wrong, then this is a net gain for the CPU''s
    speed.


    However, this feature is less beneficial for GPU architecture because of its parallel
    nature.

    The GPU''s cores are typically managed by some higher-level construct that instructs
    all

    cores under its command to perform the same machine-code-level instruction

    simultaneously, such as a huge stamping machine that stamps sheets of metal in
    groups

    simultaneously. So, if the Fragment Shader requires a float to be multiplied by
    2, then the

    process will begin by having all cores copy data into the appropriate registers
    in one

    coordinated step. Only when all cores are finished copying to the registers will
    the cores be

    instructed to begin the second step: multiplying all registers by 2 all in a second

    simultaneous action.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Thus, when this system stumbles into a conditional statement, it cannot resolve
    the two statements independently. It must determine how many of its child cores
    will go down each path of the conditional, grab the list of required machine code
    instructions for one path, resolve them for all cores taking that path, and repeat
    these steps for each path until all possible paths have been processed. So, for
    an if-else statement (two possibilities), it will tell one group of cores to process
    the true path, then ask the remaining cores to process the false path. Unless
    every core takes the same path, it must process both paths every time.


    So, we should avoid branching and conditional statements in our Shader code. Of
    course, this depends on how essential the conditional is to achieving the graphical
    effect we desire. However, if the conditional is not dependent on per-pixel behavior,
    then we would often be better off absorbing the cost of unnecessary mathematics
    than inflicting a branching cost on the GPU.


    # # Reduce data dependencies


    The compiler will try its best to optimize our Shader code into the more GPU-friendly
    low- level language so that it is not waiting on data to be fetched when it could
    be processing some other task. For example, the following poorly optimized code
    could be written in our Shader:


    ```

    ```

    float sum = input.color1.r;

    sum = sum + input.color2.g;

    sum = sum + input.color3.b;

    sum = sum + input.color4.a;

    float result = calculateSomething(sum);

    ```

    ```


    This code has a data dependency such that each calculation cannot begin until
    the last finishes due to the dependency on the sum variable. However, such situations
    are often detected by the Shader compiler and optimized into a version that uses
    instruction-level parallelism. The following code is the high-level code equivalent
    of the resulting Machine Code after the previous code is compiled:


    ```

    ```

    float sum1, sum2, sum3, sum4;

    sum1 = input.color1.r;

    sum2 = input.color2.g;

    sum3 = input.color3.b;

    sum4 = input.color4.a;

    float sum = sum1 + sum2 + sum3 + sum4;

    float result = CalculateSomething(sum);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'In this case, the compiler would recognize that it can fetch the four values
    from memory in parallel and complete the summation once all four have been fetched
    independently via thread-level parallelism. This can save a lot of time relative
    to performing the four fetches one after another.


    However, long chains of data dependency that cannot be compiled away can absolutely
    murder Shader performance. If we create a strong data dependency in our Shader’s
    source code, then it has no freedom to make any optimizations. For example, the
    following data dependency would be painful on performance, as one step literally
    cannot be completed without waiting on another to fetch data, since sampling each
    texture requires sampling another texture beforehand, and the compiler cannot
    assume that the data hasn’t changed in the meantime.


    The following code represents a very strong data dependency between instructions,
    since each relies on texture data being sampled from the previous instruction:


    ```

    ```

    float4 val1 = tex2D(_tex1, input.texcoord.xy);

    float4 val2 = tex2D(_tex2, val1.yz); // requires data from _tex1

    float4 val3 = tex2D(_tex3, val2.zw); // requires data from _tex2

    ```

    ```


    Strong data dependencies such as these should be avoided whenever possible.


    # ## Surface Shaders


    Unity’s Surface Shaders are a simplified form of Fragment Shaders, allowing Unity
    developers to get to grips with Shader programming in a more simplified fashion.
    The Unity Engine takes care of converting our Surface Shader code for us, abstracting
    away some of the optimization opportunities we have just covered. However, it
    does provide some miscellaneous values that can be used as replacements, which
    reduce accuracy but simplify the mathematics in the resulting code. Surface Shaders
    are designed to handle the general case fairly efficiently, but optimization is
    best achieved with a personal touch by writing our own Shaders.


    The `approxview` attribute will approximate the view direction, saving costly
    operations. The `halfasview` attribute will reduce the precision of the view vector,
    but beware of its effect on mathematical operations involving multiple precision
    types. The `noforwardadd` attribute will limit the Shader to only considering
    a single Directional Light, reducing Draw Calls, since the Shader will render
    in only a single pass, and Lighting complexity. Finally, the `noambient` attribute
    will disable ambient Lighting in the Shader, removing some extra mathematical
    operations that we may not need.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# # Use Shader-based LOD


    We can force Unity to render distant objects using simpler Shaders, which can
    be an effective way of saving Fill Rate, particularly if we’re deploying our game
    onto multiple platforms or supporting a wide range of hardware capability. The
    `LOD` keyword can be used in the Shader to set the onscreen size factor that the
    Shader supports. If the current LOD level does not match this value, it will drop
    to the next fallback Shader and so on until it finds the Shader that supports
    the given size factor. We can also change a given Shader object''s LOD value at
    runtime using the `maximumLOD` property.


    This feature is similar to the mesh-based LOD covered earlier and uses the same
    LOD values for determining object form factor, so it should be configured as such.


    Check out `https://docs.unity3d.com/Manual/SL-ShaderLOD.html` in the Unity documentation
    for more information on Shader-based LOD.


    # # Use less texture data


    This approach is simple, straightforward, and always a good idea to consider.
    Reducing texture quality, either through resolution or bit rate, is not ideal
    for graphical quality, but we can sometimes get away with using 16-bit textures
    without any noticeable degradation.


    Mip Maps (explored in `Chapter 4, Kickstart Your Art`) are another excellent way
    of reducing the amount of texture data being pushed back and forth between VRAM
    and the Texture Cache. Note that the **Scene** window has a **Mipmaps** Shading
    Mode, which will highlight textures in our Scene blue or red, depending on whether
    the current texture scale is appropriate for the current **Scene** window''s Camera
    position and orientation. This will help identify what textures are good candidates
    for further optimization.


    # # Test different GPU Texture Compression formats


    As you learned in `Chapter 4, Kickstart Your Art`, there are different texture
    compression formats, which can reduce our application''s disk footprint (executable
    file size), runtime CPU, and RAM usage. These compression formats are designed
    to support GPU architecture for the given platform. There are many different formats,
    such as DXT, PVRTC, ETC, and ASTC, but only a handful of these are available on
    a given platform.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'By default, Unity will pick the best compression format determined by the **Compression**
    setting for a texture file. If we drill down into platform-specific options for
    a given texture file, then different compression type options will be available,
    listing the different texture formats the given platform supports. We may be able
    to find some space or performance savings by overriding the default choices for
    compression.


    Although, beware that if we''re at the point where individually tweaking Texture
    Compression techniques is necessary, then hopefully we have already exhausted
    all other options for reducing Memory Bandwidth. By going down this road, we would
    be committing ourselves to supporting many different devices each in their own
    specific way. Many developers would prefer to keep things simple with a general
    solution instead of personal customization and time-consuming handiwork for small
    performance gains.


    Check out the Unity documentation for an overview of all of the different texture
    formats available and which formats Unity prefers by default at `https://docs.unity3d.com/
    Manual/class-TextureImporterOverride.html`.


    In older versions of Unity, all formats were exposed for **Advanced** texture
    types, but if the platform did not support the given type, it would be handled
    at the software level. In other words, the CPU would need to stop and recompress
    the texture to the desired format the GPU wants, as opposed to the GPU taking
    care of it with a specialized hardware chip. Unity Technologies decided to remove
    this capability in more recent versions so that we can''t accidentally cause these
    problems.


    # # Minimize texture swapping


    This one is fairly straightforward. If Memory Bandwidth is a problem, then we
    need to reduce the amount of texture sampling we''re doing. There aren''t really
    any special tricks to exploit here since Memory Bandwidth is all about throughput,
    so the primary metric under consideration is the volume of data we''re pushing.


    One way to reduce volume is to simply lower texture resolution and hence quality.
    This is obviously not ideal, so another approach is to find clever ways to reuse
    textures on different meshes, but using different Material and Shader properties.
    For instance, a properly darkened brick texture may appear to look like a stone
    wall instead. Of course, this will require different Render States and hence we
    won''t save on Draw Calls, but it could reduce Memory Bandwidth consumption.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/da79484c9b30dc915216dbc5454a9bbf_253_0.png)


    Did you ever notice how clouds and bushes looked exactly the same in Super Mario
    Bros but with different colours? This is the same concept.


    There could also be ways to combine textures into Atlases to reduce the number
    of swaps needed. If there are a group of textures that are always used together
    at similar times, then they could potentially be merged together. This could save
    the GPU from having to pull in separate texture files over and over again during
    the same frame.


    Finally, removing textures from the application entirely is always a last resort
    option we could employ.


    # # VRAM limits


    One last consideration related to textures is how much VRAM we have available.
    Most texture transfer from CPU to GPU occurs during initialization, but can also
    occur when a nonexistent texture is first required by the current view. This process
    is normally asynchronous and will result in a blank texture being used until the
    full texture is ready for rendering (refer to Chapter 4, Kickstart Your Art, to
    note that this assumes read/write access is disabled for the texture). As such,
    we should avoid introducing new textures at runtime too frequently.


    # # Preload textures with hidden GameObjects


    The blank texture that is used during asynchronous texture loading can be jarring
    when it comes to game quality. We would like a way to control and force the texture
    to be loaded from disk to RAM and then to VRAM before it is actually needed.


    A common workaround is to create a hidden GameObject that uses the texture and
    place it somewhere in the Scene on the route that the player will take toward
    the area where it is actually needed. As soon as the player looks at that object,
    the texture is needed by the Rendering Pipeline (even if it''s technically hidden),
    it will begin the process of copying the data from RAM to VRAM. This is a little
    clunky, but easy to implement and works sufficiently well in most cases.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'We can also control such behavior via Script code by changing a Material''s
    `texture` property:


    `GetComponent<Renderer>().material.texture = textureToPreload;`


    # # Avoid texture thrashing


    In the rare event that too much texture data is loaded into VRAM, and the required
    texture is not present, the GPU will need to request it from RAM and overwrite
    one or more existing textures to make room for it. This is likely to worsen over
    time as the memory becomes fragmented, and it introduces a risk that the texture
    just flushed from VRAM needs to be pulled again within the same frame. This will
    result in a serious case of memory _thrashing_ and should be avoided at all costs.


    This is less of a concern on modern consoles such as the PS4, Xbox One, and WiiU
    since they share a common memory space for both CPU and GPU. This design is a
    hardware- level optimization, given the fact that the device is always running
    a single application, and almost always rendering 3D graphics. However, most other
    platforms must share time and space with multiple applications, where a GPU is
    merely an optional device and is not always present. They, therefore, feature
    separate memory spaces for the CPU and GPU, and we must ensure that the total
    texture usage at any given moment remains below the available VRAM of the target
    hardware.


    Note that this _thrashing_ is not precisely the same as hard disk thrashing, where
    memory is copied back and forth between main memory and virtual memory (the swap
    file), but it is analogous. In either case, data is being unnecessarily copied
    back and forth between two regions of memory because too much data is being requested
    in too short a time period for the smaller of the two memory regions to hold it
    all.


    > Thrashing such as this can be a common cause of dreadful rendering performance
    when games are ported from modern consoles to desktop platforms and should be
    treated with care.


    Avoiding this behavior may require customizing texture quality and file sizes
    on a per- platform and per-device basis. Be warned that some players are likely
    to notice these inconsistencies if we''re dealing with hardware from the same
    console or desktop GPU generation. As many of us will know, even small differences
    in hardware can lead to a lot of apples-versus-oranges comparisons, but hardcore
    gamers tend to expect a similar level of quality across the board.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# # Lighting optimization


    We covered the theory of Lighting behavior earlier in this chapter, so let''s
    run through some techniques we can use to improve Lighting costs.


    # # Use real-time Shadows responsibly


    As mentioned previously, Shadowing can easily become one of the largest consumers
    of Draw Calls and Fill Rate, so we should spend the time to tweak these settings
    until we get the performance and/or graphical quality we need. There are multiple
    important settings for Shadowing that can be found under Edit | Project Settings
    | Quality | Shadows. As far as the Shadows option is concerned, Soft Shadows are
    expensive, Hard Shadows are cheap, and No Shadows are free. Shadow Resolution,
    Shadow Projection, Shadow Distance, and Shadow Cascades are also important settings,
    which affect the performance of our Shadows.


    Shadow Distance is a global multiplier for runtime Shadow rendering. There is
    little point in rendering Shadows at a great distance from the Camera, so this
    setting should be configured specific to our game and how much Shadowing we expect
    to witness during gameplay. It is also a common setting that is exposed to the
    user in an options screen, so they can choose how far to render Shadows to get
    the game''s performance to match their hardware (at least on desktop machines).


    Higher values of Shadow Resolution and Shadow Cascades will increase our Memory
    Bandwidth and Fill Rate consumption. Both of these settings can help curb the
    effects of artifacts generated by Shadow rendering, but at the cost of much larger
    Shadowmap texture sizes, costing increased Memory Bandwidth and VRAM.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_255_0.png)


    The Unity documentation contains an excellent summary on the topic of the aliasing
    effect of Shadowmaps and how the Shadow Cascades feature helps to solve the problem
    at http://docs.unity3d.com/Manual/ DirLightShadows.html.


    It''s worth noting that Soft Shadows do not consume any more memory or CPU overhead
    relative to Hard Shadows, as the only difference is a more complex Shader. This
    means that applications with enough Fill Rate to spare can enjoy the improved
    graphical fidelity of Soft Shadows.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# # Use Culling Masks


    A `Light` Component’s **Culling Mask** property is a Layer-based mask that can
    be used to limit the objects that will be affected by the given Light. This is
    an effective way of reducing Lighting overhead, assuming that the Layer interactions
    also make sense with how we are using Layers for physics optimization. Objects
    can only be a part of a single Layer, and reducing physics overhead probably trumps
    Lighting overhead in most cases; thus, if there is a conflict, then this may not
    be the ideal approach.


    > > Note that there is limited support for Culling Masks when using Deferred Shading.
    Due to the way it treats Lighting in a very global fashion, only four Layers can
    be disabled from the mask, limiting our ability to optimize its behavior.


    # # Use baked Lightmaps


    Baking Lighting and Shadowing into a Scene is significantly less processor-intensive
    than generating them at runtime. The downside is the added application disk footprint,
    memory consumption, and potential for Memory Bandwidth abuse. Ultimately, unless
    a game''s Lighting effects are being handled exclusively through the legacy Vertex
    Lit Shading format or through a single `DirectionalLight`, then it should probably
    include Lightmapping somewhere to make some huge budget savings on Lighting calculations.
    Relying entirely on real-time Lighting and Shadows is a recipe for disaster due
    to the performance costs they are likely to inflict.


    There are several metrics that can affect the cost of Lightmapping, however, such
    as their resolution, compression, whether we are using Pre-computed Realtime GI,
    and of course, the number of objects in our Scene. The Lightmapper generates textures
    that span all of the objects marked **Lightmap Static** in the Scene, and hence
    the more we have, the more texture data must be generated for them. This would
    be an opportunity to make use of additive or subtractive Scene loading to minimize
    how many objects need to be processed each frame. This, of course, pulls in even
    more Lightmap data while more than one Scene is loaded, so we should expect a
    big bump in memory consumption each time this happens, only to have it freed once
    the old Scene is unloaded.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# # Optimizing rendering performance for mobile devices


    Unity''s ability to deploy to mobile devices has contributed greatly to its popularity
    among hobbyist, small, and mid-size development teams. As such, it would be prudent
    to cover some approaches that are more beneficial for mobile platforms than for
    desktop and other devices.


    Note that any, or all, of the following approaches may eventually become obsolete,
    at least for newer devices. The capabilities of mobile devices have advanced blazingly
    fast, and the following techniques as they apply to mobile devices merely reflect
    conventional wisdom from the last half decade or so. We should test the assumptions
    behind these approaches to check whether the limitations of mobile devices still
    fit the mobile marketplace.


    # # Avoid Alpha Testing


    Mobile GPUs haven''t quite reached the same levels of chip optimization as desktop
    GPUs, and Alpha Testing remains a particularly costly task on mobile devices.
    In most cases, it should simply be avoided in favor of Alpha Blending.


    # # Minimize Draw Calls


    Mobile applications are more often bottlenecked on Draw Calls than on Fill Rate.
    Not that Fill Rate concerns should be ignored (nothing should, ever!), but this
    makes it almost necessary for any mobile application of reasonable quality to
    implement mesh combining, Batching, and Atlasing techniques from the very beginning.
    Deferred Rendering is also the preferred technique, as it fits well with other
    mobile-specific concerns, such as avoiding transparency and having too many animated
    characters, but of course not all mobile devices and Graphics APIs support it.


    Check out the Unity documentation for more information on which platforms/APIs
    support Deferred Shading at `https://docs.unity3d.com/Manual/RenderingPaths.html`.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# # Minimize Material count


    This concern goes hand in hand with the concepts of Batching and Atlasing. The
    fewer Materials we use, the fewer Draw Calls required. This strategy will also
    help with concerns relating to VRAM and Memory Bandwidth, which tend to be very
    limited on mobile devices.


    # # Minimize texture size


    Most mobile devices feature a very small Texture Cache relative to desktop GPUs.
    There are very few devices on the market still supporting OpenGL ES 1.1 or lower,
    such as the iPhone 3G, but these devices could only support a maximum texture
    size of 1024 x 1024. Devices supporting OpenGLES 2.0, such as everything from
    the iPhone 3GS to the iPhone 6S, can support textures up to 2048 x 2048. Finally,
    devices supporting OpenGLES 3.0 or greater, such as devices running iOS 7, can
    support textures up to 4096 x 4096.


    > > There are way too many Android devices to list here, but the Android developer
    portal gives a handy breakdown of OpenGLES device support. This information is
    updated regularly to help developers determine supported APIs in the Android market
    at `https://developer.android.com/about/dashboards/index.html`


    Double-check the device hardware we are targeting to be sure that it supports
    the texture file sizes we wish to use. However, later-generation devices are never
    the most common devices in the mobile marketplace. If we wish our game to reach
    a wide audience (increasing its chances of success), then we must be willing to
    support weaker hardware.


    Note that textures that are too large for the GPU will be downscaled by the CPU
    during initialization. This wastes valuable loading time and is going to leave
    us with unintended loss of quality due to an uncontrolled reduction in resolution.
    This makes texture reuse of paramount importance for mobile devices due to the
    limited VRAM and Texture Cache sizes available.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# # Make textures square and power-of-two


    We have already covered this topic in Chapter 4, Kickstart Your Art, but it is
    worth revisiting the subject of GPU-level Texture Compression. The GPU will find
    it difficult, or simply be unable to compress the texture if it is not in a square
    format, so make sure that you stick to the common development convention and keep
    things square and sized to a power-of-two.


    # # Use the lowest possible precision formats in Shaders


    Mobile GPUs are particularly sensitive to precision formats in its Shaders, so
    the smallest formats should be used such as half. On a related note, precision
    format conversion should be avoided at all costs for the same reason.


    # # Summary


    If you''ve made it this far without skipping ahead, then congratulations are in
    order. That was a lot of information to absorb for just one subsystem of the Unity
    Engine, but then it is clearly the most complicated of them all, requiring a matching
    depth of explanation. Hopefully, you''ve learned a lot of approaches to help you
    improve your rendering performance and enough about the Rendering Pipeline to
    know how to use them responsibly.


    By now, we should be used to the idea that, with the exception of algorithm improvements,
    every performance enhancement we implement will come with some related cost that
    we must be willing to bear for the sake of removing one bottleneck. We should
    always be ready to implement multiple techniques until we''ve squashed them all,
    and potentially spend a lot of additional development time to implement and test
    some performance enhancing features.


    In the next chapter, let''s bring performance optimization into the modern era
    by exploring some performance improvements we can apply to Virtual Reality and
    Augmented Reality projects.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# # Virtual Velocity and Augmented Acceleration


    Two whole new entertainment mediums have entered the world stage in the forms
    of **Virtual Reality** (VR) where users are transported into a virtual space through
    the use of a **Head Mounted Device** (HMD), and **Augmented Reality** (AR) where
    virtual elements are superimposed on top of a display showing the real world.
    For the sake of brevity, these two terms are often combined into the singular
    term **XR**. There is also the **Mixed Reality** (MR) (also known as **Hybrid
    Reality** or **HR**), where an application mixes the real and virtual worlds together,
    which encompasses all of previously mentioned formats, while also including **Augmented
    Virtuality** where real world objects are scanned and superimposed inside a mostly
    virtual world.


    The markets for these media formats have sprung up very fast and are continuing
    to grow rapidly, with huge investments from the technology industry’s biggest
    players. Naturally, Game Engines such as Unity jumped on the bandwagon quickly,
    providing ample support for most of the top contending platforms, such as Google’s
    Cardboard, HTC’s Vive, Oculus’ Rift, Microsoft’s HoloLens and Samsung’s GearVR
    platforms, as well as the more recent entries such as Apple’s ARKit, Google’s
    AR Core, Microsoft’s Windows Mixed Reality platform, PTC’s (originally Qualcomm’s)
    Vuforia, and Sony’s PlayStation VR.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'XR offers a whole new realm for developers and creatives to explore. This includes
    entertainment products such as games and 360-degree Videos (or _360 Video_ for
    short), where a series of cameras are bundled together, each facing a different
    direction--the various captures from those cameras are stitched together and later
    played back as a movie in a VR headset with visibility in all directions. Creative
    industry tools are also common in XR, such as 3D modeling software, workflow visualizations,
    and quality-of-life gadgets. There are very few rules that have been set in stone,
    so there are plenty of opportunities to innovate, contribute to this new wave
    of technology and become the one to create those rules. This has led to a lot
    of buzz and excitement as people explore what is possible and try to make their
    mark on the future of entertainment and interactive experiences.


    Of course, almost every new and budding technology goes through the Hype Cycle
    (from the Gartner Hype Cycle available at `https://www.gartner.com/technology/research/
    methodologies/hype-cycle.jsp`). The Hype Cycle starts with its honeymoon period
    of excessive hype, and where early adopters will evangelize its benefits. Later,
    there is an eventual cooling of emotions as it enters the _trough of disillusionment_
    since it hasn''t quite hit the mainstream, and its benefits are not taking hold
    just yet. This continues until it either the technology fails to capture hearts
    and minds, thus falling out of existence, or takes a firm hold and continues steady
    adoption. The following image shows the essentials of the Gartner Hype Cycle:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_261_0.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Arguably, XR has recently been passing through this final phase and is starting
    to enjoy

    much better support and much higher quality experiences than it did during the
    early days,

    although it is true that the adoption rate of XR has been slower than initially
    predicted. It

    remains to be seen whether XR will grow into a multi-billion dollar industry or
    fade into a

    niche market of gadgets. Consequently, developing within this new medium is not
    without

    its risks, and we can find industry analysts who will agree with our opinions,
    regardless of

    where we stand on the future of XR. One thing is for certain, though, that every
    time

    someone experiences firsthand what VR and AR are capable of, they''re blown away
    by the

    level of immersion and the medium''s ability to convincingly transport them into
    another

    world. This level of immersion and interactivity is unparalleled, and teases many
    more

    possibilities as support for the platforms mature and technology continues to
    advance.


    In this chapter, we will explore the following topics:


    +   - What concerns to keep in mind when developing VR or AR projects in Unity
    and

    +   what must be avoided


    +   - Performance enhancements specific to the XR medium


    # # XR Development


    Developing an XR product in Unity involves importing one of several XR **Software**

    **Development Kits (SDKs)** into our Unity project and making some specialized
    API calls to

    configure and use the platform at runtime. Each SDK is different in its own way
    and offers a

    different set of features. For instance, the Oculus Rift and HTC Vive SDKs provide
    APIs to

    control VR HMDs and their respective Controllers, whereas Apple''s ARKit provides

    utilities to determine spatial positioning and superimpose objects on the display.
    Unity

    technologies have been working hard to create APIs that support all of these variations,
    so

    the APIs for XR development in Unity have changed a lot over the past couple of
    years.


    The early days of Unity VR development meant dropping Native Plugins into our
    Unity

    projects, importing SDKs directly from an external developer portal, and all kinds
    of

    annoying grunt-work in setup, and applying updates manually. Since then, however,
    Unity

    has incorporated several of these SDKs directly into the Editor. In addition,
    since AR has

    become more popular recently, the main API has been renamed

    from `UnityEngine.VR` to `UnityEngine.XR` in Unity 2017.2.0 and greater, in order
    to be

    inclusive of several AR SDKs. Importing various XR SDKs and configuring them can
    be

    managed through the **Edit | Project Settings | Project | XR Settings** area.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'The development experience of working on XR products is a bit of a mixed bag
    right now. It involves working on some top-of-the-line hardware and software,
    which means that there are constant changes, redesigns, breakages, patches, bugs,
    crashes, compatibility issues, performance problems, rendering artifacts, lack
    of feature parity between platforms, and so on. All of these problems serve to
    slow down our progress, which makes gaining a competitive advantage extraordinarily
    difficult in the XR field. On the bright side, pretty much everyone is having
    the same issues so they get a lot of attention from their developers, making them
    easier to develop with all the time. Lessons are learned; APIs are cleaned up;
    and new features, tools, and optimizations are made available with every passing
    update.


    Performance problems limit an XR product''s success perhaps more so than non-XR
    projects due to the current state of the medium. Firstly, our users will be spending
    significant money to purchase VR HMDs and sensor equipment, or AR-capable hardware.
    Both of these platforms can be very resource intensive, requiring similarly expensive
    graphics hardware to support them. This typically leads users to expect a much
    higher level of quality compared to typical games, in order to make the investment
    feel worthwhile, or to put it another way, this makes poor use experiences understandably
    less forgivable due to the monetary investment required by the user. Secondly,
    perhaps more so for VR projects than AR ones, poor application performance can
    lead to serious physical user discomfort, quickly turning even the staunchest
    advocate into a detractor. Thirdly, the XR platform''s primary draw is its immersiveness,
    and nothing breaks that faster than frame drops, flickering, or any kind of application
    breakdown that forces the user to remove their headset or reboot the app.


    Ultimately, we must be prepared to profile our XR applications early and to make
    sure we aren''t exceeding our runtime budget, as it will be stretched thin by
    the complex and resource-intensive nature of the technology behind these mediums.


    # # Emulation


    Unity offers several emulation options, particularly for AR app development with
    HoloLens, and ARKit, called **Holographic Remoting / Simulation** or ARKitRemote.
    We should be careful and use these emulation features as they''re intended to
    be used--as convenience tools for development workflow to check that the essentials
    are working correctly. They are no substitute for the real thing when it comes
    to benchmarking and should not be trusted to give accurate profiling results.
    This feature can be reached through the **Window | Holographic Emulation** window.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# # User comfort


    Unlike typical games and apps, VR apps need to consider user comfort as a metric
    to

    optimize. Dizziness, motion sickness, eye strain, headaches, and even physical
    injuries from

    loss of balance have unfortunately been all too common for early VR adopters,
    and the onus

    is on us to limit these negative effects for users. In essence, content is just
    as important to

    user comfort as the hardware is, and we need to take the matter seriously if we
    are building

    for the medium.


    Not everyone experiences these issues, and there are a lucky few who have experienced

    none of them. However, the overwhelming majority of users have reported these
    problems

    at one point or another. Also, just because our game doesn''t trigger these problems
    in

    ourselves when we''re testing them doesn''t mean they won''t trigger them in someone
    else.

    In fact, we will be the most biased test subject for our game due to familiarity.
    Without

    realizing it, we might start to predict our way around the most nauseating behavior
    our app

    generates, making it an unfair test compared to a new user experiencing the same
    situation.

    This unfortunately raises the costs of VR app development further, as a lot of
    testing with

    different unbiased individuals is required if we want to figure out whether our
    experience

    will cause discomfort, which may be needed each time we make significant changes
    that

    affect motion and frame rate.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_264_0.png)


    There are a number of things that users can do to improve their VR

    comfort, such as starting with small sessions and working their way up to

    get practice in balancing and training their brain to expect the mismatched

    motion. A more drastic option is to take motion sickness medication or

    drink a little ginger tea beforehand to settle the stomach. However, we will

    hardly convince users to try our app if we promise it''ll only take a few

    sessions of motion sickness before it starts to get enjoyable.


    There are three main discomfort effects users can experience in VR:


    +   - Motion sickness

    +   - Eye strain

    +   - Disorientation


    The first problem, nausea, caused by motion sickness, typically happens when there
    is a

    sensory disconnect between where the user''s eyes think the horizon is and what
    their other

    senses are telling their brain, such as the inner ear''s sense of balance. The
    second problem,

    eye strain, comes from the fact that the user is staring at a screen mere inches
    from their

    eyes, which tends to lead to a lot of eye strain and ultimately headaches after
    prolonged

    use.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Finally, disorientation typically occurs because a user in VR is sometimes
    standing within a confined space, so if a game features any kind of acceleration-based
    motion, the user will instinctively try to offset that acceleration by adjusting
    their balance, which can lead to disorientation, falling over, and the user hurting
    themselves if we are not careful about ensuring the user experiences smooth and
    predictable motion.


    > Note that the term _acceleration_ is used intentionally since it is a vector,
    which means it is has both magnitude and direction. Any kind of acceleration can
    cause disorientation, which includes not only accelerating forward, backward,
    and sideways, but also acceleration in a rotational fashion (turning around),
    falling, jumping, and so on.


    Another potential problem for VR apps is the possibility of invoking seizures.
    VR is in the unique position of being able to blast images into the user''s eyes
    at a close range, which opens up some risks that we unintentionally cause vulnerable
    users to seize if rendering behavior breaks down and starts flickering. These
    are all things we need to keep in mind during development, that need to be tested
    for and fixed sooner rather than later.


    Perhaps, the most important performance metric to reach in a VR app is having
    a high value for FPS, preferably, 90 FPS or more, as this will generate a smooth
    viewing experience since there will be very little disconnection between the user''s
    head motion, and the motion of the world. Any period of extended frame drops or
    having an FPS value consistently below this value are likely to cause a lot of
    problems for our users, making it critical that our application performs well
    at all times. In addition, we should be very careful about how we control the
    user''s viewpoint. We should avoid changing an HMD''s field of view ourselves
    (let the user dictate the direction it is facing), generating acceleration over
    long periods, or causing uncontrolled world rotation and horizon motion since
    these are extremely likely to trigger motion sickness and balance problems for
    the user.


    A strict rule, that is not up for debate, is that we should never apply any kind
    of gain, multiplier effect, or acceleration effect to the positional tracking
    of an HMD in the final build of our product. Doing so for the sake of testing
    is fine, but if a real user moves their head two inches to the side, then it should
    feel like it moved the same relative distance inside the application and should
    stop the moment their head stops. Doing otherwise is not only going to cause a
    disconnect between where the player''s head feels like it should be and where
    it is, but may cause some serious discomfort if the camera becomes offset with
    respect to the player''s orientation and the hinge of their neck.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'It is possible to use acceleration for the motion of the player character,
    but it should be incredibly short and rapid before the user starts to self-adjust
    too quickly. It would be wisest to stick to motion that relies on constant velocities
    and/or teleportation.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_266_0.png)


    Placing banked turns in racing games seems to improve user comfort a great deal
    since the user naturally tilts their head and adjusts their balance to match the
    turn.


    All of the above rules apply just as well to 360 Video content as they do to VR
    games. Frankly, there have been an embarrassing number of 360 Videos released
    to market, which are not taking the above into account--they feature too many
    jerking movements, lack of camera stabilization, manual viewport rotation, and
    so on. These hacks are often used to ensure the user is facing in the direction
    we intend. However, more effort must be spent to do so without hacking in such
    nausea-inducing behaviour. Humans are naturally very curious about things that
    move. If they notice something moving in the corner of their eye, then they will
    most likely turn to face it. This can be used to great effect to keep the user
    facing in the direction we intend as they watch the video.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_266_1.png)


    Laziness is not the way to go when generating VR content. Don’t just slap a 360
    Camera on top of a dirt rally car and hack an unexpected camera rotation into
    the video to keep the action in the center. Motion needs to be smooth and predictable.
    During production, we need to constantly keep in mind where we expect the user
    to be looking so that we capture action shots correctly.


    Fortunately, for the 360 Video format it seems as though industry standard frame
    rates such as 24FPS or 29.97FPS do not have a disastrous effect on user comfort,
    but note that this frame rate applies to video playback only. Our rendering FPS
    is a separate FPS value, and dictates how smooth positional head tracking will
    be. The rendering FPS must always be very high to avoid discomfort (ideally 90
    FPS).


    Other problems arise with building VR apps--different HMDs and controllers support
    different inputs and behavior, making feature-parity across VR platforms difficult.
    A problem called **Stereo-Fighting** can occur if we try to merge 2D and 3D content
    together, where 2D objects appear to be rendering deep inside 3D objects since
    the eyes can’t distinguish the distance correctly; this is typically a big problem
    for the User Interface of VR applications and 360 Video playback, which tends
    to be a series of flat panels superimposed over a 3D background. Stereo-Fighting
    does not usually lead to nausea, but it can cause additional eye strain.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Although the effects of discomfort are not quite as pronounced in the AR platform,
    it’s still important not to ignore it. Since AR apps tend to consume a lot of
    resources, low frame rate applications can cause some discomfort. This is especially
    true if an AR app makes use of superimposing objects onto a camera image (which
    is the majority of them), where there will probably be a disconnect in the frame
    rate between the background camera image and the objects we’re superimposing over
    it. We should try to synchronize these frame rates to limit that disconnect.


    # # Performance enhancements


    That’s enough talk about the industry and XR development. Let’s cover some performance
    enhancements that can be applied to XR projects.


    # # The kitchen sink


    Since AR and VR apps are built using the same Engine, the same subsystems, assets,
    tools, and utilities as any other Unity game, literally every other performance
    enhancement mentioned in this book can help VR and AR apps in some fashion, and
    we should try them all before getting too in-depth with XR-specific enhancements.
    This is reassuring, as there are a lot of potential performance enhancements we
    could apply. The downside is that we may need to apply many of them to reach the
    level of performance we need for our app.


    The biggest threat to a VR app’s performance is GPU Fill Rate, which is already
    one of the more likely bottlenecks in any other game, but significantly more so
    for VR since we will always be trying to render a high resolution image to a much
    larger Frame Buffer (since we’re effectively rendering the Scene twice--once for
    each eye). AR apps are typically going to find extreme consumption in both the
    CPU and the GPU since AR platforms make heavy use of the GPU’s parallel pipeline
    to resolve spatial locality of objects and perform tasks such as image recognition,
    as well as needing a lot of Draw Calls to support those activities.


    Of course, certain performance enhancing techniques are not going to be particularly
    effective in XR. Occlusion Culling in a VR app may be difficult to set up since
    the user can look under, around, and sometimes through objects in the Scene (although
    it can still be enormously beneficial). Meanwhile, AR apps normally render objects
    at reachable distances, LOD enhancements may be fairly pointless to setup. We
    must use our better judgement to determine whether a performance optimization
    technique is worth implementing _before_ we start implementing it since many of
    them take a lot of time to implement and support.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# # Single-Pass versus Multi-Pass Stereo Rendering


    For VR apps, Unity provides two rendering modes; Multi-Pass and Single-Pass. This
    can be configured under Edit | Project Settings | Player | XR Settings | Stereo
    Rendering Method. Multi-Pass rendering will render the Scene to two different
    images, which are displayed separately for each eye. Single-Pass Stereo Rendering
    combines both images into a single double-width Render Texture, where only the
    relevant half is displayed to each eye.


    Multi-Pass Stereo Rendering is the default case. The advantage of Single-Pass
    rendering is that it provides significant savings in the CPU work in the main
    thread by reducing Draw Call setup and in the GPU since less texture swapping
    needs to occur. Of course, the GPU will need to work just as hard to render the
    objects since each object is still rendered twice from two different perspectives
    (there are no freebies here). The disadvantage is that this effect is currently
    only usable when using OpenGL ES3.0 or higher and hence is not available on all
    platforms. In addition, its effects on the Rendering Pipeline require extra care
    and effort, particularly surrounding any Shaders making use of screen-space effects
    (effects which only use data already drawn to the Frame Buffer). With Single-Pass
    Stereo Rendering enabled, Shader code can no longer make the same assumptions
    about the incoming screen space information. The following image shows how screen
    space coordinates vary between Multi-Pass and Single-Pass Stereo Rendering


    ![](img/da79484c9b30dc915216dbc5454a9bbf_268_0.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'The Shader is always informed of the screen space coordinates relative to the
    entire output Render Texture rather than just the portion it is interested in.
    For example, we would normally expect an x value of 0.5 to correspond to the horizontal
    half-way point of the screen, which would be the case when we use Multi-Pass Stereo
    Rendering, however, if we use Single-Pass Stereo Rendering, then an x value of
    0.5 would correspond to the half-way point between the rendering of both eyes
    (the right-edge of the left eye, or the left-edge of the right eye).


    Unity provides some useful helper methods for screen space conversion for Shaders,
    which can be found at `https://docs.unity3d.com/Manual/ SinglePassStereoRendering.html`.


    Another problem to worry about is Post-Processing effects. We essentially always
    pay double the cost for any Post-Processing effect applied to the Scene in VR
    since it needs to be evaluated once for each eye. Single-Pass Stereo Rendering
    can reduce the Draw Calls needed to set up our effect, but we can’t blindly apply
    a Post-Processing effect to both images simultaneously. Consequently, Post-Processing
    effect Shaders must also be adjusted to ensure that they render to the correct
    half of the output Render Texture. Without doing this, a Post-Processing effect
    will be stretched over both eyes, twice, which might look incredibly bizarre for
    effects such as lens flares.


    The Single-Pass Stereo Rendering feature has been around since Unity 5.4, but
    is still currently labeled **Preview** in the Editor due to the current lack of
    support for all platforms. We can expect it to be rolled out to more platforms
    eventually, but for platforms supporting it we will need to perform some profiling
    and sensible sanity checks on our screen space Shaders to ensure that we are making
    positive gains from enabling this option.


    # # Apply anti-aliasing


    This tip is less of a performance enhancement and more of a requirement. Anti-aliasing
    significantly improves the fidelity of XR projects since objects will blend together
    better and appear less pixelated, improving immersion, which can cost a lot of
    Fill Rate. We should enable this feature early and try to reach our performance
    goals with the assumption that it is simply always there, only disabling it as
    an absolute last resort.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# # Prefer Forward Rendering


    The advantage of Deferred Rendering is the ability to resolve many Light sources
    with

    minimal Draw Calls. Unfortunately, if we follow the preceding advice and apply
    anti-

    aliasing effects, this must be done as a Post-Processing screen space Shader when
    Deferred

    Rendering is used. This can cost a considerable amount of performance compared
    to how

    the same technique is applied as a multi-sampling effect in Forward Rendering,
    potentially

    making Forward Rendering the more performant between the two options.


    # # Image effects in VR


    The effects applied by Normal Maps tend to break down easily in VR, where the
    texture

    appears painted on to the surface instead of giving the illusion of depth. Normal
    Maps

    normally break down very quickly with viewing angles that are very oblique (shallow)
    with

    the surface, which is not particularly common in a typical game. However, in VR,
    since

    most HMDs allow users to move their heads around in a 3D space via positional
    tracking

    (which, granted, not all of them do), they will quickly find positions that break
    the effect for

    any objects close to the Camera. Normal Maps have been known to improve the quality
    of

    high polygon count objects in VR, but it rarely provides a benefit for those with
    a low

    polygon count, so we should perform a little testing to make sure that any visual

    improvement is worth the costs in Memory Bandwidth.


    Ultimately, we cannot rely on Normal Mapping to provide a quick and cheap increase
    in

    graphical fidelity for low polygon count objects that we might expect from a non-VR
    Scene,

    so testing is required to find out whether the illusion is working as intended.
    Displacement

    maps, Tessellation, and/or Parallax Mapping should be used instead to create a
    more

    believable appearance of depth. Unfortunately, all of these techniques are more
    expensive

    than a typical Normal Map, but it is a burden we must suffer to achieve good graphical

    quality in VR.


    Other Post-Processing effects such as Depth of Field, blurring, and lens flares
    are effects that

    look good in a typical 3D game, but are generally not effects we witness in the
    real world

    and will seem out of place in VR (at least until eye-tracking support is available)
    and should

    generally be avoided.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# # Backface culling


    Backface culling (removing faces from objects that will never be visible) can
    be tricky for VR

    and AR projects since the player’s viewing angle could potentially come from any
    direction

    for objects near the camera. Assets near the camera should be a fully closed shape
    if we

    want to avoid immersion-breaking viewpoints. Also, we should think carefully about

    applying backface culling for distant objects, particularly if the user travels
    by teleportation

    since it can be tricky to completely restrict a user’s location. Ensure that you
    test your game

    world’s bounding volumes to ensure that the user cannot escape.


    # # Spatialized audio


    The audio industry is abuzz with new techniques to present audio experiences for
    VR (or

    more technically, old techniques that have finally found good use) in the form
    of spatial

    audio. Audio data for these formats no longer represents audio data from specific
    channels,

    but instead contain data for certain audio harmonics that are merged together
    at runtime to

    create a more believable audio experience depending on the current camera viewport,

    particularly vertical orientations. The keyword from the previous sentence being
    runtime,

    meaning that this effect has a continuous nontrivial cost associated with it.
    These techniques

    will require CPU activity, but may also use GPU acceleration to generate their
    effects, so we

    should double-check the behavior of both devices if we’re experiencing performance

    problems when we’re making use of spatial audio.


    # # Avoid camera physics collisions


    In VR and AR, it’s possible for the user to move the camera through objects, which
    can lead

    to breaking immersion. Although it may be tempting to add physics Colliders to
    such

    surfaces in order to prevent the camera moving through it, this will cause disorientation
    in

    VR since the Camera will not move in unison with the user’s movements. This could
    also

    break the positional tracking calibration of an AR app. A better approach is to
    either allow

    the user to see into objects or to maintain a safe buffer zone between the Camera
    and such

    surfaces. If we don’t allow the player to teleport too close to them in the first
    place, then

    there’s no risk of sticking their head through walls.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'This will save on performance due to a reduced number of Colliders, but should
    be followed as more of a quality-of-life issue. We shouldn’t be too concerned
    about risking immersion-breaking behavior by doing this, as research has shown
    users tend to avoid looking into objects once they realize they can do it. They
    may experience a moment of confusion or hilarity when it happens initially, but
    fortunately people tend to want to remain in the immersive experience we’ve created
    and will tend to avoid putting their head through walls. Although, this changes
    if doing so awards some kind of gameplay advantage, such as seeing through a wall
    in order to observe which way enemies are about to come from in a strategy game,
    so we should develop our Scenes with that in mind.


    # # Avoid Euler angles


    Avoid using Euler angles for any kind of orientation behavior. Quaternions are
    designed to be much better for representing angles (the only downside is that
    it is more abstract and harder to visualize when debugging) and maintaining accuracy
    whenever there are changes, while also avoiding the dreaded Gimbal Lock. Using
    Euler angles for calculations could eventually lead to inaccuracies after there
    are a lot of rotation changes, which is incredibly likely since the user’s viewpoint
    will change by tiny amounts many times per second in both VR and AR.


    Gimbal Lock is a problem that can occur with Euler angles. Since Euler angles
    represent orientation via three axes, and there are overlaps when one of these
    axes is rotated 90 degrees, we could accidentally lock them together, becoming
    mathematically inseparable and causing future orientation changes to affect both
    axes simultaneously. Of course, a human being can figure out how to rotate the
    object in order to solve this problem, but Gimbal Lock is purely a mathematical
    problem. The classic example is the orientation bubble in a fighter jet. The pilot
    never has problems with Gimbal Lock, but the orientation instruments in their
    heads-up display could become inaccurate because of it. Quaternions solve this
    problem by including a fourth value that effectively allows overlapping axes to
    still be distinguished from one another.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_272_0.png)'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# # Exercise restraint


    Performance targets for VR apps are very difficult to reach. It is, therefore,
    important to recognize when we are simply trying to cram too much quality into
    our app than is tolerable for the current generation of XR devices and typical
    user hardware. The last resort is always to cull objects from our Scenes until
    we reach our performance goals. We should be more willing to do so for an XR app
    than a non-XR one, since the costs of poor performance often far outweigh the
    gains of higher quality. We must exercise restraint from adding more detail to
    our Scenes if it has become apparent that the rendering budget has been exhausted.
    This can be difficult to admit with immersive VR content, where we want to create
    as much compelling immersion as we can, but until the technology catches up with
    the capabilities, we need to remain frugal.


    # # Keep up to date with the latest developments


    Unity provides a list of useful articles containing VR design and optimization
    tips, which will likely get updated as the medium and market matures and new techniques
    are discovered. It can be kept more up-to-date than this tome ever could be, so
    check them out from time to time to catch the latest tips. The articles in question
    can be found at `https:// unity3d.com/learn/tutorials/topics/virtual-reality`.


    We should also keep an eye on Unity blogs to make sure that we don’t miss anything
    important with regard to XR API changes, performance enhancements, and performance
    suggestions.


    # # Summary


    Hopefully, this brief guide helps us improve the performance of our XR applications.
    The reassuring news is that we have many performance optimization options to choose
    from since Unity XR apps are built upon the same underlying platform we’ve been
    exploring throughout this book. Less reassuring is the fact that we might have
    to test and implement _all of them_ in order to stand a chance of reaching our
    quality goals. We can expect hardware to get more powerful over time, prices to
    come down, and adoption to increase as a result. However, until then, we need
    to pull out all of the stops if we’re going to compete in the tech world’s latest
    craze.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'In the next chapter, we''ll dig into Unity''s underlying Engine along with
    the various

    frameworks, layers, and languages that it is built from. In essence, we will take
    a look at our

    Script code in a more advanced light and investigate some methods to improve our
    CPU

    and memory management across the board.'
