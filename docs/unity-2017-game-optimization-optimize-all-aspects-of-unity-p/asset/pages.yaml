    During initialization, the `EnemyManagerWithMessagesComponent` class registers
    to receive messages of the type `CreateEnemyMessage`, and will process the message
    through it’s `HandleCreateEnemy ()` delegate. During this method, it can typecast
    the message into the appropriate derived message type and resolves the message
    in its own unique way. Other classes can register for the same message and resolve
    it differently through its own custom delegate method (assuming that an earlier
    listener didn’t return `true` from its own delegate).


    We know what type of message will be provided by the `msg` argument of the `HandleCreateEnemy
    ()` method, because we defined it during registration through the `AttachListener
    ()` call. Due to this, we can be certain that our typecasting is safe, and we
    can save time by not having to do a `null` reference check, although, technically,
    there is nothing stopping us using the same delegate to handle multiple message
    types. In these cases, though, we will need to implement a way to determine which
    message object is being passed and treat it accordingly. However, the best approach
    is to define a unique method for each message type in order to keep things appropriately
    decoupled. There really is little benefit in trying to use one monolithic method
    to handle all message types.'
