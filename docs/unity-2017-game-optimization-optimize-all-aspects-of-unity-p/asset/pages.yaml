    \ Press _Ctrl_ + _Shift_ + <0-9> (_Command_ + _Shift_ + <0-9>) to restore it.\
    \ This is\nexceptionally useful if we find ourselves selecting the same handful\
    \ of objects over and over\nagain while we make adjustments.\n\nPressing _Shift_\
    \ + spacebar will expand the current window to fill the entire Editor screen.\n\
    Pressing it again will shrink the window and restore it to its previous location.\n\
    \nPressing _Ctrl_ + _Shift_ + _P_ (_Command_ + _Shift_ + _P_) will toggle the\
    \ **Pause** button while in **Play**\n**Mode**. This is usually an awkward key\
    \ combination to press if we're trying to pause in a\nhurry, so it often helps\
    \ to create a custom hotkey for pausing:\n\n```\nvoid Update() {\n    if (Input.GetKeyDown(KeyCode.P))\
    \ {\n        Debug.Break();\n    }\n}\n```\n\n# # In-editor documentation\n\n\
    We can quickly access the documentation of any Unity keyword or class by highlighting\
    \ it\nin MonoDevelop and pressing _Ctrl_ + ’ (_Command_ + ’). This will open the\
    \ default browser and\nperform a search on the Unity documentation for the given\
    \ keyword or class.\n\n> > Note that users with European keyboards may need to\
    \ also hold down the\n> _Shift_ key for this feature to work."
