- pgno: 317
  md: '# # Masterful Memory Management


    # # Chapter 8


    It is often recommended that Pooling should be implemented in any game that intends
    to be deployed on mobile devices, due to the greater overhead costs involved in
    the allocation and deallocation of memory compared to desktop applications.


    However, creating a Pooling solution is an interesting topic, and building one
    from scratch is a great way of getting to grips with a lot of important internal
    Unity Engine behavior. Also, knowing how such a system is built makes it easier
    to extend if we wish it to meet the needs of our particular game, rather than
    relying on a prebuilt solution.


    The general idea of Prefab Pooling is to create a system that contains lists of
    active and inactive `GameObjects` that were all instantiated from the same Prefab
    reference. The following diagram shows how the system might look after several
    spawns, despawns, and respawns of various objects derived from four different
    Prefabs (**Orc**, **Troll**, **Ogre**, and **Dragon**):


    ![](img/da79484c9b30dc915216dbc5454a9bbf_317_0.png)'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Note that the _Heap Memory_ area in the previous screenshot represents the
    objects as they exist in memory, while the _Pooling System_ area represents the
    Pooling System’s references to those objects.


    In this example, several instances of each Prefab were instantiated (11 Orcs,
    8 Trolls, 5 Ogres, and 1 Dragon). Currently, only 11 of these objects are active,
    while the other 14 have been previously despawned and are inactive. Note that
    the despawned objects still exist in memory, although they are not visible and
    cannot interact with the game world until they have been respawned. Naturally,
    this costs us a constant amount of heap memory at runtime in order to maintain
    the inactive objects, but when a new object is instantiated, we can reuse one
    of the existing inactive objects rather than allocating more memory in order to
    satisfy the request. This saves significant runtime CPU costs during object creation
    and destruction and avoids garbage collection.


    The following diagram shows the chain of events that needs to occur when a new
    Orc is spawned:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_318_0.png)'
