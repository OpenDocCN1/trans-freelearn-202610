    \ will be discussed in their related chapters.\n\n# # Profiler script control\n\
    \nThe Profiler can be controlled in script code through the `Profiler` class.\
    \ There are several useful methods in this class that we can explore within the\
    \ Unity documentation, but the most important methods are the delimiter methods\
    \ that activate and deactivate profiling at runtime. These can be accessed through\
    \ the `UnityEngine.Profiling.Profiler` class through its `BeginSample()` and `EndSample()`\
    \ methods.\n\nNote that the delimiter methods, `BeginSample()` and `EndSample()`,\
    \ are only compiled in development builds, and as such, they will not be compiled\
    \ or executed in release builds where **Development Mode** is unchecked. This\
    \ is commonly known as _non-operation_ or _no-op_ code.\n\nThe `BeginSample()`\
    \ method has an overload that allows a custom name for the sample to appear in\
    \ the CPU Usage Area's Hierarchy mode. For example, the following code will profile\
    \ invocations of this method and make the data appear in the **Breakdown View**\
    \ under a custom heading, as follows:\n\n```\n```\nvoid DoSomethingCompletelyStupid()\
    \ {\n    Profiler.BeginSample(\"My Profiler Sample\");\n    List<int> listOfInts\
    \ = new List<int>();\n    for(int i = 0; i < 1000000; ++i) {\n        listOfInts.Add(i);\n\
    \    }\n    Profiler.EndSample();\n}\n```\n```\n\nYou can download the example\
    \ code files from your account at http:// www.packtpub.com for all the Packt Publishing\
    \ books you have purchased. If you purchased this book elsewhere, you can visit\
    \ http://www. packtpub.com/support and register to have the files emailed directly\
    \ to you."
