- pgno: 306
  md: 'The following code will use the object representation `obj` to replace the
    value stored within

    the integer, and _unbox_ it back into an integer, storing it in `i`. The final
    value of `i` would be

    256:


    ```

    int i = 128;

    object obj = i;

    obj = 256;

    i = (int)obj; // i = 256

    ```


    These types can be changed dynamically. The following is perfectly legal C# code,
    where

    we override the type of `obj`, converting it into a `float`:


    ```

    int i = 128;

    object obj = i;

    obj = 512f;

    float f = (float)obj; // f = 512f

    ```


    The following is also legal--conversion into a `bool`:


    ```

    int i = 128;

    object obj = i;

    obj = false;

    bool b = (bool)obj; // b = false

    ```


    Note that attempting to unbox `obj` into a type that isn''t the most recently
    assigned type

    would result in an `InvalidCastException`:


    ```

    int i = 128;

    object obj = i;

    obj = 512f;

    i = (int)obj; // InvalidCastException thrown here since most recent

    conversion was to a float

    ```


    All of this can be a little tricky to wrap our head around until we remember that,
    at the end

    of the day, everything is just bits in memory and that we are free to interpret
    them any way

    we like. After all, data types like `int`, `float`, and so on are just an abstraction
    over binary

    lists of `0` and `1`. What''s important is knowing that we can treat our primitive
    types as

    objects by boxing them, converting their types, and then unboxing them into a
    different

    type at a later time, but each time we do this results in a heap memory allocation.


    Note that it''s possible to convert a boxed object''s type using one of the

    many `System.Convert.To...()` methods.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_306_0.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Boxing can be either implicit, as shown in the preceding examples, or explicit,
    by

    typecasting to `System.Object`. Unboxing must always be explicit by typecasting
    back to

    its original type. Whenever we pass a Value type into a method that uses `System.Object`

    as arguments, boxing will be applied implicitly.


    Methods such as `String.Format()`, which take `System.Object` as arguments, are
    one

    such example. We typically use them by passing in Value types, such as `int`,
    `float`, and

    `bool`, to generate a string with. Boxing is automatically taking place in these
    situations,

    causing additional heap allocations that we should be aware of.

    `Collections.Generic.ArrayList` is another such example since `ArrayList` always

    contains converts its inputs into `System.Object` references, regardless of what
    types are

    stored within.


    Any time we use a function definition that takes `System.Object` as arguments,
    and we’re

    passing in Value types, we should be aware that we’re implicitly causing heap
    allocations

    due to boxing.


    # # The importance of data layout


    The importance of how our data is organized in memory can be surprisingly easy
    to forget

    about, but can result in a fairly big performance boost if it is handled properly.
    Cache

    misses should be avoided whenever possible, which means that in most cases, arrays
    of

    data that are contiguous in memory should be iterated over sequentially as opposed
    to any

    other iteration style.


    This means that data layout is also important for garbage collection since it
    is done in an

    iterative fashion, and if we can find ways to have the GC skip over problematic
    areas, then

    we can potentially save a lot of iteration time.


    In essence, we want to keep large groups of Reference types separated from large
    groups of

    Value types. If there is even one Reference type within a Value type, such as
    a `struct`, then

    the GC considers the entire object, and all of its data members, indirectly referenceable

    objects. When it comes time to Mark-and-Sweep, it must verify all fields of the
    object before

    moving on. However, if we separate the various types into different arrays, then
    we can

    make the GC skip the majority of the data.'
  merge: -1
  img_proc: true
- pgno: 308
  md: "For instance, if we have an array of `struct` objects that looks like the following\
    \ code, then\nthe GC will need to iterate over every member of every `struct`,\
    \ which could be fairly time-\nconsuming:\n\n```\n```\npublic struct MyStruct\
    \ {\n    int myInt;\n    float myFloat;\n    bool myBool;\n    string myString;\n\
    }\n\nMyStruct[] arrayOfStructs = new MyStruct[1000];\n```\n```\n\nHowever, if\
    \ we reorganize all pieces of this data into multiple arrays of each time, then\
    \ the\nGC will ignore all of the primitive data types and only check the `string`\
    \ objects. The\nfollowing code will result in much a faster garbage collection\
    \ sweep:\n\n```\n```\nint[] myInts = new int[1000];\nfloat[] myFloats = new float[1000];\n\
    bool[] myBools = new bool[1000];\nstring[] myStrings = new string[1000];\n```\n\
    ```\n\nThe reason this works is because we’re giving the GC fewer indirect references\
    \ to check.\nWhen the data is split into separate arrays (Reference types), it\
    \ finds three arrays of Value\ntypes, marks the arrays, and then immediately moves\
    \ on because there’s no reason to mark\nthe contents of an array of Value types.\
    \ It must still iterate through all of the `string` objects\nwithin `myStrings`\
    \ since each is a Reference type and it needs to verify that there are no\nindirect\
    \ references within it. Technically, the `string` objects cannot contain indirect\n\
    references, but the GC works at a level where it only knows whether the object\
    \ is a\nReference type or Value type and, therefore, can’t tell the difference\
    \ between a `string`\nand `class`. However, we have still spared the GC from needing\
    \ to iterate over an extra\n3,000 pieces of data (the 3,000 values in `myInts`,\
    \ `myFloats`, and `myBools`).\n\n# # Arrays from the Unity API\n\nThere are several\
    \ instructions within the Unity API that result in heap memory allocations,\n\
    which we should be aware of. This essentially includes everything that returns\
    \ an array of\ndata. For example, the following methods allocate memory on the\
    \ heap:\n\n```\n```\nGetComponents<T>(); // (T[])\nMesh.vertices; // (Vector3[])\n\
    Camera.allCameras; // (Camera[])\n```\n```"
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Each and every time we call a Unity API method that returns an array, will
    cause a whole new version of that data to be allocated. Such methods should be
    avoided whenever possible or at the very least called once and cached so that
    we don''t cause memory allocations more often than necessary.


    There are other Unity API calls where we provide an array of elements to a method,
    and it writes the necessary data into the array for us. One such example is providing
    a `Particle[]` array to a `ParticleSystem` to get its `Particle` data. The benefit
    of these types of API calls is that we can avoid reallocating large arrays, whereas
    the downside is that the array needs to be large enough to fit all of the objects.
    If the number of objects we need to acquire keeps increasing, then we may find
    ourselves reallocating larger arrays. In the case of a `ParticleSystem`, we need
    to be certain we create an array large enough to contain the maximum number of
    `Particle` objects it generates at any given time.


    Unity Technologies have hinted in the past that they may eventually change some
    of the API calls that return arrays into the form that requires an array to be
    provided. The API of the latter form can be confusing for new programmers on first
    glance; however, unlike the first form, it allows responsible programmers to use
    memory much more efficiently.


    # Using InstanceIDs for dictionary keys


    As mentioned in `Chapter 2, Scripting Strategies`, dictionaries are used to map
    associations between two different objects, which are very quick at telling us
    whether a mapping exists, and if so, what that mapping is. It''s common practice
    to map a `MonoBehaviour` or Scriptable Object reference as the key of a dictionary,
    but this causes some problems. When the dictionary element is accessed, it will
    need to call into several derived methods of `UnityEngine.Object`, which both
    of these object types derive from. This makes element comparison and mapping acquisition
    relatively slow.


    This can be improved by making use of `Object.GetInstanceID()`, which returns
    an integer representing a unique identification value for that object that never
    changes and is never reused between two objects during the entire lifecycle of
    the application. If we cache this value in the object somehow and use it as the
    key in our dictionary, then the element comparison will be around two to three
    times faster than if we used the object reference directly.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'However, there are caveats to this approach. If the instance ID value is not
    cached (we keep calling `Object.GetInstanceID()` each time we need to index into
    our dictionary) and we are compiling with Mono (and not IL2CPP), then element
    acquisition could end up being slow. This is because it will call some thread-unsafe
    code in order to acquire the instance ID, in which case, the Mono compiler cannot
    optimize the loop, and, therefore, causes some additional overhead by comparison
    to caching the instance ID value. If we are compiling with IL2CPP, which doesn''t
    have this problem, then the benefits are still not as great (only around 50 percent
    faster) than if we had simply cached the value beforehand. Therefore, we should
    aim to cache the integer value in some way so that we avoid having to call `Object.GetInstanceID()`
    too often.


    # # foreach loops


    The `foreach` loop keyword is a bit of a controversial issue in Unity development
    circles. It turns out that a lot of `foreach` loops implemented in Unity C# code
    will incur unnecessary heap memory allocations during these calls, as they allocate
    an `Enumerator` object as a `class` on the heap, instead of a `struct` on the
    stack. It all depends on the given collection''s implementation of the `GetEnumerator()`
    method.


    It turns out that every single collection that has been implemented in the version
    of Mono that comes with Unity (Mono version 2.6.5) will create classes instead
    of structs, which results in heap allocations. This includes, but is not limited
    to, `List<T>`, `LinkedList<T>`, `Dictionary<K, V>`, and `ArrayList`.


    > Note that it is safe to use `foreach` loops on typical arrays. The Mono compiler
    secretly converts `foreach` over arrays into simple for loops.


    The cost is fairly negligible, as the heap allocation cost does not scale with
    the number of iterations. Only one `Enumerator` object is allocated, and reused
    over and over again, which only costs a handful of bytes of memory overall. So,
    unless our `foreach` loops are being invoked for every update (which is typically
    dangerous in, and of, itself), the costs will be mostly negligible on small projects.
    The time taken to convert everything to a `for` loop may not be worth the time.
    However, it''s definitely something to keep in mind for the next project we begin
    to write.'
  merge: -1
  img_proc: true
- pgno: 311
  md: "If we're particularly savvy with C#, Visual Studio, and manual compilation\
    \ of the Mono assembly, then we can have Visual Studio perform code compilation\
    \ for us and copy the resulting assembly DLL into the `Assets` folder, which will\
    \ fix this mistake for the generic collections.\n\nNote that performing `foreach`\
    \ over a `Transform` Component is a typical shortcut to iterating over a `Transform`\
    \ Component's children. Let's consider the following example:\n\n```\n```\nforeach\
    \ (Transform child in transform) {\n    // do stuff with 'child'\n}\n```\n```\n\
    \nHowever, this results in the same heap allocations mentioned above. As a result,\
    \ that coding style should be avoided in favor of the following code:\n\n```\n\
    ```\nfor (int i = 0; i < transform.childCount; ++i) {\n    Transform child = transform.GetChild(i);\n\
    \    // do stuff with 'child'\n}\n```\n```\n\n# ## Coroutines\n\nAs mentioned\
    \ before, starting a Coroutine costs a small amount of memory to begin with, but\
    \ note that no further costs are incurred when the method calls `yield`. If memory\
    \ consumption and garbage collection are significant concerns, we should try to\
    \ avoid having too many short-lived Coroutines and avoid calling `StartCoroutine()`\
    \ too much during runtime.\n\n# ## Closures\n\nClosures are useful, but dangerous\
    \ tools. Anonymous methods and lambda expressions are not always Closures, but\
    \ they can be. It all depends on whether the method uses data outside of its own\
    \ scope and parameter list or not.\n\nFor example, the following anonymous function\
    \ would not be a Closure, since it is self-contained and functionally equivalent\
    \ to any other locally defined function:\n\n```\n```\nSystem.Func<int,int> anon\
    \ = (x) => { return x; };\n\nint result = anon(5); // result = 5\n```\n```"
