    \ can be used to check whether the object was successfully despawned.\n\nAs a\
    \ result, thanks to the two maps we’re maintaining, we can quickly access the\
    \ `PrefabPool` that manages the given reference, and this solution will scale\
    \ for any number of Prefab that the system manages.\n\n# # Prefab pools\n\nNow\
    \ that we have a system that can handle multiple Prefab pools automatically, the\
    \ only thing left is to define the behavior of the pools. As mentioned previously,\
    \ we will want the `PrefabPool` class to maintain two data structures: one for\
    \ active (spawned) objects that have been instantiated from the given Prefab and\
    \ another for inactive (despawned) objects.\n\nTechnically, the `PrefabPoolingSystem`\
    \ class already maintains a map of which Prefab is governed by which `PrefabPool`,\
    \ so we can actually save a little memory by making the `PrefabPool` dependent\
    \ upon the `PrefabPoolingSystem` class to give it the reference to the Prefab\
    \ it is managing. Consequently, the two data structures would be the only member\
    \ variables the `PrefabPool` needs to keep track of.\n\nHowever, for each spawned\
    \ `GameObject`, it must also maintain a list of all of its `IPoolableComponent`\
    \ references in order to invoke the `Spawned()` and `Despawned()` methods on them.\
    \ Acquiring these references can be a costly operation to perform at runtime,\
    \ so it would be best to cache the data in a simple struct:\n\n```\n```\npublic\
    \ struct PoolablePrefabData {\n    public GameObject go;\n    public IPoolableComponent[]\
    \ poolableComponents;\n}\n```\n```\n\nThis `struct` will contain a reference to\
    \ the `GameObject` and the precached list of all of its `IPoolableComponent` Components."
