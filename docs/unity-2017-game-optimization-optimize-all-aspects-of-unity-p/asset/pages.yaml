- pgno: 86
  md: "# # Assigning references to pre-existing objects\n\nA simple approach to the\
    \ problem of interobject communication is to use Unity’s built-in Serialization\
    \ System. Software design purists tend to get a little combative about this feature,\
    \ since it breaks Encapsulation; it makes any field (the C# term for a member\
    \ variable) marked private act in a way that treats them like a public field.\
    \ However, it is a very effective tool for improving development workflow. This\
    \ is particularly true when artists, designers, and programmers are all tinkering\
    \ with the same product, where each has wildly varying levels of computer science\
    \ and software programming knowledge, and with some of whom would prefer to stay\
    \ away from modifying code files. Sometimes, it’s worth bending a few rules in\
    \ the name of productivity.\n\nWhenever we create a public field in a MonoBehaviour,\
    \ Unity automatically serializes and exposes the value in the Inspector window\
    \ when the Component is selected. However, public fields are always dangerous\
    \ from a software design perspective. These variables can be changed through code\
    \ at anytime from anywhere, making it hard to keep track of the variable and is\
    \ liable to introduce a lot of unexpected bugs.\n\nA better solution, is to take\
    \ any private or protected member variable of a class and expose it to the Inspector\
    \ window with the [SerializeField] attribute. The value will now behave like a\
    \ public field with respect to the Inspector window, allowing us to change it\
    \ through the Editor interface for convenience, but keeps the data safely encapsulated\
    \ from other parts of our codebase.\n\nFor example, the following class exposes\
    \ three private fields to the Inspector window:\n\n```\nusing UnityEngine;\n\n\
    public class EnemyCreatorComponent : MonoBehaviour {\n    [SerializeField] private\
    \ int _numEnemies;\n    [SerializeField] private GameObject _enemyPrefab;\n  \
    \  [SerializeField] private EnemyManagerComponent _enemyManager;\n\n    void Start()\
    \ {\n        for (int i = 0; i < _numEnemies; ++i) {\n            CreateEnemy();\n\
    \        }\n    }\n\n    public void CreateEnemy() {\n        _enemyManager.CreateEnemy(_enemyPrefab);\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Note that the `private` access specifiers shown in the preceding code are redundant
    keywords in C#, since fields and methods default to `private` unless specified
    otherwise. However, it is often best practice to be explicit about the intended
    access level.


    Looking at this Component in the **Inspector** window reveals three values, initially
    given default values of `0`, or `null`, which can be modified through the Editor
    interface:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_87_0.png)


    We can drag-and-drop a Prefab reference from the **Project** window into the **Enemy
    Prefab** field revealed in the **Inspector** window.


    Note how Unity automatically takes a camel-cased field name and creates a convenient
    **Inspector** window name for it. `_numEnemies` becomes **Num Enemies**, `_enemyPrefab`
    becomes **Enemy Prefab** and so on.


    Meanwhile, the `_enemyManager` field is interesting because it is a reference
    to a specific `MonoBehaviour` class type. If a `GameObject` is dragged-and-dropped
    into this field, then it will refer to the Component on the given object as opposed
    to the `GameObject` itself. Note that if the `GameObject` does not contain the
    expected `MonoBehaviour`, then nothing will be assigned to the field.


    A common usage of this Component reference technique is to obtain references to
    other Components attached to the very same `GameObject` a Component is attached
    to. This is an alternative means of caching Components with zero cost, as discussed
    in the section entitled _Cache Component references_ earlier in this chapter.


    There is some danger to using this method. Much of our code would assume that
    a Prefab is assigned to a field that is used like a Prefab and a `GameObject`
    is assigned to a field that refers to an instance of a `GameObject`. However,
    since Prefabs are essentially `GameObjects`, any Prefab or `GameObject` can be
    assigned to a serialized `GameObject` reference field, which means we could assign
    the wrong type by accident.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'If we do assign the wrong type then we could accidentally instantiate a new
    `GameObject` from an existing `GameObject` that was previously modified, or we
    could make changes to a Prefab, which would then change the state of all `GameObjects`
    instantiated from it. To make matters worse, any accidental changes to a Prefab
    become permanent since Prefabs occupy the same memory space whether Play Mode
    is active or not. This is the case even if the Prefab is only modified during
    Play Mode.


    Therefore, this approach is a very team-friendly way of solving the problem of
    interobject communication, but it is not ideal due to all of the risks involved
    with team members accidentally leaving `null` references in place, assigning Prefabs
    to references that expect an instance of a `GameObject` from the Scene, or vice
    versa.


    It is also important to note that not all objects can be serialized and revealed
    in the **Inspector** window. Unity can serialize all primitive data types (`int`,
    `float`, `string`, and `bool`), various built-in types (`Vector3`, `Quaternion`,
    and so on); `enum`, `class`, `struct`, and various data structures containing
    other serializable types such as `List`. However, it is unable to serialize `static`
    fields, `readonly` fields, properties, and dictionaries.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_88_0.png)


    Some Unity developers like to implement pseudo-serialization of dictionaries via
    two separate lists for keys and values, along with a Custom Editor script, or
    via a single list of `struct` objects, which contain both keys and values. Both
    of these solutions are a little clumsy, and rarely as performant as a proper dictionary,
    but they can still be useful.


    Another solution to the problem of interobject communication is to try and make
    use of globally accessible objects in order to minimize the number of custom assignments
    we need to make.


    # # Static Classes


    This approach involves creating a class that is globally accessible to the entire
    codebase at any time. Any kind of global _manager_ class is often frowned upon
    in software engineering circles, partly since the name _manager_ is vague and
    doesn''t say much about what it''s meant to do, but mostly because problems can
    be difficult to debug. Changes can occur from anywhere and at any point during
    runtime, and such classes tend to maintain state information that other systems
    rely upon. It is also perhaps the most difficult approach to change or replace,
    since many of our classes might contain direct function calls into it, requiring
    each to be modified at a future date if it were to be replaced. Despite all of
    these drawbacks, it is by far the easiest solution to understand and implement.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "The Singleton design pattern is a common way of ensuring only one instance\
    \ of a certain object type ever exists in memory. This design pattern is implemented\
    \ by giving the class a `private` constructor, a `static` variable is maintained\
    \ to keep track of the object instance, and the class can only be accessed through\
    \ a `static` property it provides. Singletons can be useful for managing shared\
    \ resources or _heavy data traffic_, such as file access, downloads, data parsing,\
    \ and messaging. A Singleton ensures that we have a single entry point for such\
    \ activities, rather than having tons of different subsystems competing for shared\
    \ resources and potentially bottlenecking one another.\n\nSingletons don't necessarily\
    \ have to be globally accessible objects–their most important feature is that\
    \ only a single instance of the object exists at a time. However, the way that\
    \ Singletons are primarily used in most projects is to be a global access point\
    \ to some shared functionality, and are designed to be created once during application\
    \ initialization, persist through the entire lifecycle of the application, and\
    \ only destroyed during application shutdown. As such, a simpler way of implementing\
    \ this kind of behavior in C# is to use a Static Class. In other words, implementing\
    \ the typical Singleton design pattern in C# just provides the same behavior as\
    \ a Static Class, but takes more time and code to implement.\n\nA Static Class\
    \ that functions in much the same way as the `EnemyManagerComponent` as demonstrated\
    \ in the previous example, can be defined as follows:\n\n```\nusing System.Collections.Generic;\n\
    using UnityEngine;\npublic static class StaticEnemyManager {\n\tprivate static\
    \ List<Enemy> _enemies;\n\tpublic static void CreateEnemy(GameObject prefab) {\n\
    \t\tstring[] names = { \"Tom\", \"Dick\", \"Harry\" };\n\t\tGameObject enemy =\
    \ GameObject.Instantiate(prefab, 5.0f *\n\t\t\tRandom.insideUnitSphere, Quaternion.identity);\n\
    \t\tEnemy enemyComp = enemy.GetComponent<Enemy>();\n\t\tenemy.gameObject.name\
    \ = names[Random.Range(0, names.Length)];\n\t\t_enemies.Add(enemyComp);\n\t}\n\
    \tpublic static void KillAll() {\n\t\tfor (int i = 0; i < _enemies.Count; ++i)\
    \ {\n\t\t\t_enemies[i].Die();\n\t\t\tGameObject.Destroy(_enemies[i].gameObject);\n\
    \t\t}\n\t\t_enemies.Clear();\n\t}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 90
  md: "Note that every method, property, and field in a Static Class must have the\
    \ `static`\nkeyword attached, which implies that only one instance of this object\
    \ will ever reside in\nmemory. This also means that its `public` methods and fields\
    \ are accessible from anywhere.\nStatic Classes, by definition, do not allow any\
    \ non-`static` fields to be defined.\n\nIf a Static Class' fields need to be initialized\
    \ (such as the `__enemies` field, which is initially\nset to `null`), then Static\
    \ Class fields can be initialized inline like so:\n\n```\nprivate static List<Enemy>\
    \ __enemies = new List<Enemy>() ;\n```\n\nHowever, if object construction needs\
    \ to be more complicated than this, then Static Classes\ncan be given a `static`\
    \ constructor, instead. The Static Class' constructor is\nautomatically called\
    \ the moment the class is first accessed through any it's fields, properties,\n\
    or methods, and can be defined like so:\n\n```\nstatic StaticEnemyManager() {\n\
    \    __enemies = new List<Enemy>() ;\n    // more complicated initialization activity\
    \ goes here\n}\n```\n\nThis time we have implemented the `CreateEnemy()` method\
    \ so that it handles much of the\nactivity for creating an enemy object. However,\
    \ the Static Class must still be given a\nreference to a Prefab from which it\
    \ can instantiate an enemy object from. A Static Class\ncan only contain `static`\
    \ member variables, and therefore cannot easily interface with the\n**Inspector**\
    \ window in the same way that `MonoBehaviour`s can, therefore requiring the\n\
    caller to provide some implementation-specific information to it. To solve this\
    \ problem, we\ncould implement a companion-Component for our Static Class to keep\
    \ our code properly\n_Decoupled_. The following code demonstrates what this class\
    \ might look like:\n\n```\nusing UnityEngine;\n\npublic class EnemyCreatorCompanionComponent\
    \ : MonoBehaviour {\n    [SerializeField] private GameObject __enemyPrefab;\n\n\
    \    public void CreateEnemy() {\n        StaticEnemyManager.CreateEnemy(__enemyPrefab);\n\
    \    }\n}\n```\n\nDespite these drawbacks, the `StaticEnemyManager` class illustrates\
    \ a simple example of\nhow a Static Class might be used to provide information\
    \ or communication between\nexternal objects, providing a better alternative than\
    \ using `Find()` or `SendMessage()`."
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # Singleton Components


    As mentioned previously, Static Classes have difficulty interfacing with Unity-related
    functionality, and cannot directly make use of `MonoBehaviour` features, such
    as event callbacks, Coroutines, hierarchical design, and Prefabs. Also, since
    there''s no object to select in the **Inspector** window, we lose the ability
    to inspect the a Static Class'' data at runtime through the **Inspector** window,
    which can make debugging difficult. These are features that we may wish to make
    use of in our global classes.


    A common solution to this problem is to implement a Component that acts like a
    Singleton- -it provides `static` methods to grant global access, and only one
    instance of the `MonoBehaviour` is ever allowed to exist at any given time.


    The following is the definition for a `SingletonComponent` class:


    ```

    using UnityEngine;


    public class SingletonComponent<T> : MonoBehaviour where T :

    SingletonComponent<T> {

    private static T __Instance;


    protected static SingletonComponent<T> __Instance {

    get {

    if(!__Instance) {

    T [] managers = GameObject.FindObjectsOfType(typeof(T)) as T[];

    if (managers != null) {

    if (managers.Length == 1) {

    __Instance = managers[0];

    return __Instance;

    } else if (managers.Length > 1) {

    Debug.LogError("You have more than one " +

    typeof(T).Name +

    " in the Scene. You only need " +

    "one - it''s a singleton!");

    for(int i = 0; i < managers.Length; ++i) {

    T manager = managers[i];

    Destroy(manager.gameObject);

    }

    }

    }

    GameObject go = new GameObject(typeof(T).Name, typeof(T));

    __Instance = go.GetComponent<T>();

    DontDestroyOnLoad(__Instance.gameObject);

    }

    return __Instance;

    }

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: "```\nset {\n    __Instance = value as T;\n    }\n}\n```\n\nThis class works\
    \ by creating a `GameObject` containing a Component of itself the first time it\n\
    is accessed. Since we wish this to be a global and persistent object, we will\
    \ need to call\n`DontDestroyOnLoad()` shortly after the `GameObject` is created.\
    \ This is a special function\nthat tells Unity that we want the object to persist\
    \ between scenes for as long as the\napplication is running. From that point onward,\
    \ when a new Scene is loaded, the object will\nnot be destroyed and will retain\
    \ all of its data.\n\nThis class definition assumes two things. Firstly, because\
    \ it is using `generics` to define its\nbehavior, it must be derived from in order\
    \ to create a concrete class. Secondly, a method\nmust be defined to assign the\
    \ `__Instance` property (which in turns sets the private\n`__Instance` field)\
    \ and cast it to/from the correct class type.\n\nFor example, the following is\
    \ the minimum amount of code that is needed to successfully\ngenerate a new `SingletonComponent`\
    \ derived class called\n`EnemyManagerSingletonComponent`:\n\n```\npublic class\
    \ EnemyManagerSingletonComponent : SingletonComponent<\nEnemyManagerSingletonComponent\
    \ > {\npublic static EnemyManagerSingletonComponent Instance {\nget { return ((EnemyManagerSingletonComponent)_Instance);\
    \ }\nset { _Instance = value; }\n}\n\npublic void CreateEnemy(GameObject prefab)\
    \ {\n// same as StaticEnemyManager\n}\n\npublic void KillAll() {\n// same as StaticEnemyManager\n\
    }\n}\n```\n\nThis class can be used at runtime by having any other object access\
    \ the `Instance` property\nat any time. If the Component does not already exist\
    \ in our Scene, then the\n`SingletonComponent` base class will instantiate its\
    \ own `GameObject` and attach an\ninstance of the derived class to it as a Component.\
    \ From that point forward, access through\nthe `Instance` property will reference\
    \ the Component that was created, and only one\ninstance of this Component will\
    \ exist at a time."
