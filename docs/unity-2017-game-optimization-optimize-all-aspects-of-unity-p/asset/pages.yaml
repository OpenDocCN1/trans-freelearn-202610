- pgno: 315
  md: '```

    T obj = new T();

    __pool.Push(obj);

    __currentIndex++;

    IPoolableObject po = obj as IPoolableObject;

    po.New();

    return obj;

    }

    }

    }

    ```


    This class allows the ObjectPool to be used with any object type so long as it
    fits the following two criteria: it must implement the IPoolableObject Interface
    Class, and the derived class must allow for a parameter-less constructor (specified
    by the new() keyword in the class declaration).


    An example poolable object would look like so: it must implement two public methods,
    New() and Respawn(), which are invoked by the ObjectPool class at the appropriate
    times:


    ```

    public class TestObject : IPoolableObject {

    public void New() {

    // very first initialization here

    }

    public void Respawn() {

    // reset data which allows the object to be recycled here

    }

    }

    ```


    Finally, consider an example usage to create a pool of 100 TestObject objects:


    ```

    private ObjectPool<TestObject> _objectPool = new ObjectPool<TestObject>(100);

    ```


    The first 100 calls to Spawn() on the ObjectPool will cause the objects to be
    respawned, providing the caller with a unique instance of the object each time.
    If there are no more objects to provide (we have called Spawn() more than 100
    times), then we will allocate a new TestObject object and push it onto the Stack.
    Finally, if Reset() is called on the ObjectPool, it will begin again from the
    start, recycling objects and providing them to the caller.


    Note that we are using the Peek() method on the Stack object so that we don''t
    remove the old instance from the Stack. We want the ObjectPool to maintain references
    to all of the objects we create.'
  merge: -1
