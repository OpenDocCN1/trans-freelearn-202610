    \ already in list\n    }\n\n    listenerList.Add(handler);\n    return true;\n\
    }\n```\n\nThe `_listenerDict` field is a dictionary of strings mapped to lists\n\
    containing `MessageHandlerDelegate`. This dictionary organizes our listener delegates\n\
