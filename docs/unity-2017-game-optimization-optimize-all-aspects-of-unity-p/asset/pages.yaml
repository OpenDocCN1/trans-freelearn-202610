- pgno: 320
  md: "Finally, the following diagram shows what happens when a new object is spawned,\
    \ but\nthere are no inactive objects to satisfy the request:\n\n# # New Dragon\
    \ is spawned\n1. Determine which Pool corresponds to the given Prefab\n\n2. Inactive\
    \ group is empty, so a new Instance of Dragon\nmust be created\n\n3. Instantiate\
    \ a new Dragon from the Prefab on the heap\n\n4. Add the newly-created Dragon\
    \ to the Active list\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_320_0.png)\n\n\
    In this scenario, more memory must be allocated to instantiate the new Dragon\
    \ object since\nthere are no Dragon objects in its Inactive pool to reuse. Therefore,\
    \ in order to avoid\nruntime memory allocations for our GameObjects, it is critical\
    \ that we know beforehand\nhow many we will need and that there is sufficient\
    \ memory space available to contain them\nall at once. This will vary depending\
    \ on the type of object in question and requires\noccasional testing and sanity-checking\
    \ to ensure that we have a sensible number of each\nPrefab instantiated at runtime.\n\
    \nWith all of this in mind, let's create a Pooling System for Prefabs.\n\n# #\
    \ Poolable Components\n\nLet's first define an interface class for a Component\
    \ that can be used in the Pooling\nSystem:\n\n```\n```\npublic interface IPoolableComponent\
    \ {\n    void Spawned();\n    void Despawned();\n}\n```\n```"
