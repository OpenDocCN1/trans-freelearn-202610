- pgno: 312
  md: 'However, if the anonymous function pulled in data from outside itself, it becomes
    a Closure, as it _closes the environment_ around the required data. The following
    would result in a Closure:

    ```csharp

    int i = 1024;

    System.Func<int,int> anon = (x) => { return x + i; };

    int result = anon(5);

    ```


    In order to complete this transaction, the compiler must define a new custom class
    that can reference the _environment_ where the data value `i` would be accessible.
    At runtime, it creates the corresponding object on the heap and provides it to
    the anonymous function. Note that this includes Value types (as per the above
    example), which were originally on the stack, possibly defeating the purpose of
    them being allocated on the stack in the first place. So, we should expect each
    invocation of the second method to result in heap allocations and inevitable garbage
    collection.


    # # The .NET library functions


    The .NET library offers a huge amount of common functionalities that help solve
    numerous problems that programmers may come across during day-to-day implementation.
    Most of these classes and functions are optimized for general use cases, which
    may not be optimal for a specific situation. It may be possible to replace a particular
    .NET library class with a custom implementation that is more suited to our specific
    use case.


    There are also two big features in the .NET library that often become big performance
    hogs whenever they’re used. This tends to be because they are only included as
    a quick-and-dirty solution to a given problem without much effort put into optimization.
    These features are **LINQ** and **Regular Expressions**.


    LINQ provides a way to treat arrays of data as miniature databases and perform
    queries against them using a SQL-like syntax. The simplicity of its coding style
    and complexity of the underlying system (through its usage of Closures) implies
    that it has a fairly large overhead cost. LINQ is a handy tool, but is not really
    intended for high-performance, real- time applications, such as games, and does
    not even function on platforms that do not support JIT compilation, such as iOS.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Meanwhile, Regular Expressions through the `Regex` class allow us to perform
    complex string parsing to find substrings that match a particular format, replace
    pieces of a string, or construct strings from various inputs. Regular Expression
    is another very useful tool, but tends to be overused in places where it is largely
    unnecessary or in so-called `clever` ways to implement a feature such as text
    localization, when straightforward string replacement would be far more efficient.


    Specific optimizations for both of these features go far beyond the scope of this
    book, as they could fill an entire book by themselves. We should either try to
    minimize their usage as much as possible, replace their usage with something less
    costly, bring in a LINQ or Regex expert to solve the problem for us, or do some
    Googling on the subject to optimize how we’re using them.


    > One of the best ways to find the correct answer online is to simply post the
    wrong answer. People will either help us out of kindness or will take such a great
    offense to our implementation that they will consider it their civic duty to correct
    us. Just be sure to do some kind of research on the subject first. Even the busiest
    of people are generally happy to help if they can see that we’ve put in our fair
    share of effort beforehand.


    # # Temporary work buffers


    If we get into the habit of using large, temporary work buffers for one task or
    another, then it just makes sense that we should look for opportunities to reuse
    them, instead of reallocating them over and over again, as this lowers the overhead
    involved in allocation and garbage collection (often called _memory pressure_).
    It might be worthwhile to extract such functionality from case-specific classes
    into a generic God Class that contains a big work area for multiple classes to
    reuse.


    # # Object Pooling


    Speaking of temporary work buffers, Object Pooling is an excellent way of both
    minimizing and establishing control over our memory usage by avoiding deallocation
    and reallocation. The idea is to formulate our own system for object creation,
    which hides away whether the object we’re getting has been freshly allocated or
    has been recycled from an earlier allocation. The typical terms to describe this
    process are to _spawn_ and _despawn_ the object rather than creating and deleting
    them in memory. When an object is despawned, we’re simply hiding it, making it
    lay dormant until we need it again, at which point it is _respawned_ from one
    of the previously despawned objects and used in place of an object we might have
    otherwise newly allocated.'
  merge: -1
  img_proc: true
- pgno: 314
  md: "Let's cover a quick implementation of an Object Pooling System.\n\nAn important\
    \ feature of this system is to allow the pooled object to decide how to recycle\n\
    itself when the time comes. The following Interface Class called `IPoolableObject`\
    \ will\nsatisfy this requirement nicely:\n\n```\n```\npublic interface IPoolableObject{\n\
    \    void New();\n    void Respawn();\n}\n```\n```\n\nThis Interface Class defines\
    \ two methods: `New()` and `Respawn()`. These should be called\nwhen the object\
    \ is first created and when it has been respawnd, respectively.\n\nThe following\
    \ `ObjectPool` class definition is a fairly simple implementation of the Object\n\
    Pooling concept:\n\n```\n```\nusing System.Collections.Generic;\n\npublic class\
    \ ObjectPool<T> where T : IPoolableObject, new() {\n    private Stack<T> _pool;\n\
    \    private int _currentIndex = 0;\n\n    public ObjectPool(int initialCapacity)\
    \ {\n        _pool = new Stack<T>(initialCapacity);\n        for(int i = 0; i\
    \ < initialCapacity; ++i) {\n            Spawn(); // instantiate a pool of N objects\n\
    \        }\n        Reset();\n    }\n\n    public int Count {\n        get { return\
    \ _pool.Count; }\n    }\n\n    public void Reset() {\n        _currentIndex =\
    \ 0;\n    }\n\n    public T Spawn() {\n        if (_currentIndex < Count) {\n\
    \            T obj = _pool.Peek();\n            _currentIndex++;\n           \
    \ IPoolableObject po = obj as IPoolableObject;\n            po.Respawn();\n  \
    \          return obj;\n        } else {\n```\n```"
  merge: -1
