- pgno: 20
  md: '# # Preface


    User experience is a critical component of any game, and this includes not only
    our game’s story and its Gameplay, but also how smoothly the graphics run, how
    reliably it connects to multiplayer servers, how responsive it is to user input,
    and even how large the final application file size is due to the prevalence of
    mobile devices and cloud downloads. The barrier of entry into game development
    has been lowered considerably thanks to tools such as Unity that offers an enormous
    array of useful development features while still being accessible to individual
    developers. However, due to the amount of competition in the gaming industry,
    the quality level of the final product that our players expect us to provide is
    increasing with every passing day. We should expect that every facet of our game
    can and will be scrutinized by players and critics alike.


    The goals of performance optimization are deeply entwined with user experience.
    Poorly optimized games can result in low frame rates, freezes, crashes, input
    lag, long loading times, inconsistent and jittery runtime behavior, Physics Engine
    breakdowns, and even excessively high battery power consumption (an often-neglected
    metric for mobile devices). Having just one of these issues can be a game developer’s
    worst nightmare as reviews will tend to focus on the one thing that we did badly,
    in spite of all the things that we did well.


    One goal of performance optimization is to make the best use of the available
    resources, which includes CPU resources such as the number of cycles consumed,
    how much main memory space we’re using (known as RAM) as well as Graphics Processing
    Unit (GPU) resources, which includes its own memory space (known as VRAM), Fill
    Rate, Memory Bandwidth, and so on. However, the most important goal of performance
    optimization is to ensure that no single resource causes a bottleneck at an inappropriate
    time, and that the highest priority tasks get taken care of first. Even small,
    intermittent hiccups and sluggishness in performance can pull the player out of
    the experience, breaking immersion and limiting our potential to create the experience
    we intended. Another consideration is that the more resources we can save, the
    more activity we can afford to implement in our games, allowing us to generate
    more interesting and dynamic gameplay.


    It is also important to decide when to take a step back and stop making performance
    enhancements. In a world with infinite time and resources, there will always be
    another way to make it better, faster, and more efficient. There must be a point
    during development where we decide that the product has reached an acceptable
    level of quality. If not, we risk dooming ourselves to repeatedly implementing
    changes that result in little or no tangible benefit, while each change also risks
    the chance that we introduce more bugs.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # Preface


    The best way to decide whether a performance issue is worth fixing is to answer
    the question "will the user notice it?". If the answer to this questions is "no,"
    then performance optimization will be a wasted effort. There is an old saying
    in software development:


    > > Premature optimization is the root of all evil.


    Premature optimization is the cardinal sin of reworking and refactoring code to
    enhance performance without any proof that it is necessary. This can mean either
    making changes without showing that a performance problem even exists, or making
    changes because we only believe a performance issue might stem from a particular
    area before it has been proven to be true.


    Of course, the original version of this common saying by Donald Knuth goes on
    to say that we should still write our code to avoid the more straightforward and
    obvious performance problems. However, the real performance optimization work
    toward the end of a project can take a lot of time, and we should both plan the
    time to polish the product properly, while avoiding the desire to implement the
    more costly and time-consuming changes without verifiable proof. These kinds of
    mistake have cost software developers, as a collective whole, a depressing number
    of work hours for nothing.


    This book intends to give you the tools, knowledge, and skills you need to both
    detect and fix performance issues in a Unity application, no matter where they
    stem from. These bottlenecks can appear within hardware components such as the
    CPU, GPU, and RAM, or within software subsystems such as Physics, Rendering, and
    the Unity Engine itself.


    Optimizing the performance of our games will give them a much better chance of
    succeeding and standing out from the crowd in a marketplace that is inundated
    with new, high-quality games every single day.


    # # What this book covers


    Chapter 1, Pursuing Performance Problems, provides an exploration of the Unity
    Profiler and a series of methods to profile our application, detect performance
    bottlenecks, and perform root cause analysis.


    Chapter 2, Scripting Strategies, deals with the best practices for our Unity C#
    Script code, minimizing MonoBehaviour callback overhead, improving inter-object
    communication, and more.


    Chapter 3, The Benefits of Batching, explores Unity''s Dynamic Batching and Static
    Batching systems, and how they can be utilized to ease the burden on the Rendering
    Pipeline.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# # Preface


    Chapter 4, Kickstart Your Art, helps you understand the underlying technology
    behind art assets and learn how to avoid common pitfalls with importing, compression,
    and encoding.


    Chapter 5, Faster Physics, is about investigating the nuances of Unity''s internal
    Physics Engines for both 3D and 2D games, and how to properly organize our physics
    objects for improved performance.


    Chapter 6, Dynamic Graphics, provides an in-depth exploration of the Rendering
    Pipeline, and how to improve applications that suffer rendering bottlenecks in
    the GPU, or CPU, how to optimize graphical effects such as lighting, shadows,
    and Particle Effects, ways in which to optimize Shader code, and some specific
    techniques for mobile devices.


    Chapter 7, Virtual Velocity and Augmented Acceleration, focuses on the new entertainment
    mediums of Virtual Reality (VR) and Augmented Reality (AR), and includes several
    techniques for optimizing performance that are unique to apps built for these
    platforms.


    Chapter 8, Masterful Memory Management, examines the inner workings of the Unity
    Engine, the Mono Framework, and how memory is managed within these components
    to protect our application from excessive heap allocations and runtime garbage
    collection.


    Chapter 9, Tactical Tips and Tricks, closes the book with a multitude of useful
    techniques used by Unity professionals to improve project workflow and scene management.


    # # What you need for this book


    The majority of this book will focus on features and enhancements that apply to
    Unity 2017. Many of the techniques explored within this book can be applied to
    Unity 5.x projects and older, but feature lists may appear different. These differences
    will be highlighted where applicable.


    # # Who this book is for


    This book is intended for intermediate and advanced Unity developers who have
    experience with most of Unity''s feature set, and those who want to maximize the
    performance of their game or solve particular bottlenecks. Whether the bottleneck
    is caused by continuous CPU overload, runtime CPU spiking, slow memory access,
    memory fragmentation, garbage collection, poor GPU Fill Rate, or Memory Bandwidth,
    this book will teach you the techniques you need to identify the source of the
    problem and help explore multiple ways of reducing their impact on your application.'
  merge: -1
  img_proc: true
