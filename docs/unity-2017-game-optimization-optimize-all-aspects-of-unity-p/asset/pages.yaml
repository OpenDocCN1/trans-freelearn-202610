- pgno: 78
  md: 'Looking at the Breakdown view for each spike, we can see two completely different
    outcomes:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_78_0.png)


    It’s worth noting how the two spikes in the Timeline View appear relatively the
    same height, and yet one operation took twice as long as the other. The Profiler
    doesn’t have the vertical resolution necessary to generate relatively accurate
    peaks when we go beyond the 15FPS marker. Both would result in a poor gameplay
    experience anyway, so the accuracy doesn’t really matter.


    Retrieving the `tag` property 10 million times (way more than makes sense in reality,
    but this is useful for comparison) results in about 400 Megabytes of memory being
    allocated just for `string` objects alone. We can see this memory allocation happening
    in the spike within the **GC Allocated** element in the Memory Area of the Timeline
    View. In addition, this process takes around 2,000 milliseconds to process, where
    another 400 milliseconds are spent on garbage collection once the `string` objects
    are no longer needed.


    Meanwhile, using `CompareTag()` 10 million times costs around 1,000 milliseconds
    to process and causes no memory allocations, and hence no garbage collection.
    This is made apparent from the lack of spike in the **GC Allocated** element in
    the Memory Area. This should make it abundantly clear that we must avoid accessing
    the `name` and `tag` properties whenever possible. If Tag comparison becomes necessary,
    then we should make use of `CompareTag()`. Unfortunately, there is no equivalent
    for the `name` property, so we should stick to using Tags where possible.


    Note that passing in a `string` literal, such as "Player", into `CompareTag()`
    does not result in a runtime memory allocation, since the application allocates
    hardcoded strings like this during initialization and merely references them at
    runtime.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# # Use appropriate data structures


    C# offers many different data structures in the `System.Collections` namespace
    and we shouldn’t become too accustomed with using the same ones over and over
    again. A common performance problem in software development is making use of an
    inappropriate data structure for the problem we’re trying to solve simply because
    its convenient. The two most commonly used are perhaps lists (`List<T>`), and
    dictionaries (`Dictionary<K, V>`).


    If we want to iterate through a set of objects then a list is preferred, since
    it is effectively a dynamic array where the objects and/or references reside next
    to one another in memory, and therefore iteration causes minimal cache misses.
    Dictionaries are best used if two objects are associated with one-another and
    we wish to acquire, insert, or remove these associations quickly. For example,
    we might associate a level number with a particular Scene file, or an `enum` representing
    different body parts on a character, with `Collider` Components for those body
    parts.


    However, it’s fairly common where we want a data structure that handles both scenarios;
    we want to quickly figure out which object maps to another, while also being able
    to iterate through the group. Typically, the developer of this system will use
    a dictionary, and then iterate over it. However, this process is unfortunately
    very slow compared to iterating over a list since it must check every potential
    hash in the dictionary in order to iterate over it fully.


    In these cases, its often better to store data in both a list and a dictionary
    to better support this behaviour. This will cost additional memory overhead to
    maintain multiple data structures, and insertion and deletion will require adding
    and removing objects from both data structures each time, but the benefits on
    iteration on the list (which tend to happen way more often) will be a stark contrast
    compared to iterating over a dictionary.


    # # Avoid re-parenting Transforms at runtime


    In earlier versions of Unity (version 5.3 and older), the references to `Transform`
    Components would be laid out in memory in a generally random order. This meant
    that iteration over multiple `Transforms` was fairly slow due to the likelihood
    of cache-misses. The upside was that re-parenting a `GameObject` to another one
    wouldn’t really cause a significant performance hit since the `Transforms` operated
    a lot like a Heap data structure which tend to be relatively fast at insertion
    and deletion. This behaviour wasn’t something we could control, and so we simply
    lived with it.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'However, since Unity 5.4 and beyond, the `Transform` Component’s memory layout
    has changed significantly. Since then, a `Transform` Component’s parent-child
    relationships have operated more like dynamic arrays, whereby Unity attempts to
    store all `Transforms` that share the same parent sequentially in memory inside
    a pre-allocated memory buffer and are sorted by their depth in the **Hierarchy**
    window beneath the parent. This data structure allows for much, much faster iteration
    across the entire group, which is particularly beneficial to multiple subsystems
    like physics and animation. The downside of this change is that if we re-parent
    a `GameObject` to another one, the parent must fit the new child within its pre-allocated
    memory buffer as well as sort all of these `Transforms` based on the new depth.
    Also, if the parent has not pre-allocated enough space to fit the new child, then
    it must expand its buffer to be able to fit the new child, and all of it’s children,
    in depth-first order. This could take some time to complete for deep and complex
    `GameObject` structures.


    When we instantiate a new `GameObject` through `GameObject.Instantiate()`, one
    of its arguments is the `Transform` we wish to parent the `GameObject` to, which
    is `null` by default, and which would place the `Transform` at the root of the
    **Hierarchy** window. All `Transforms` at the root of the **Hierarchy** window
    need to allocate a buffer to store its current children as well as those that
    might be added later (child Transforms do not need to do this). But, if we then
    re-parent the Transform to another one immediately after instantiation, then it
    discards the buffer we just allocated! To avoid this, we should provide the parent
    `Transform` argument into the `GameObject.Instantiate()` call, which skips this
    buffer allocation step.


    Another way to reduce the costs of this process is to make root `Transform` pre-allocate
    a larger buffer before we need it so that we don’t need to both expand and re-parent
    another `GameObject` into the buffer in the same frame. This can be accomplished
    by modifying a `Transform` Component’s `hierarchyCapacity` property. If we can
    estimate the number of child `Transforms` the parent will contain, then we can
    save a lot of unnecessary memory allocations.


    # ## Consider caching Transform changes


    The `Transform` Component stores data only relative to its own parent. This means
    that accessing and modifying a `Transform` Component’s `position`, `rotation`,
    and/or `scale` properties can potentially result in a lot of unanticipated matrix
    multiplication calculations to generate the correct `Transform` representation
    for the object through its parent `Transforms`. The deeper the object is in the
    **Hierarchy** window, the more calculations are needed to determine the final
    result.'
  merge: -1
  img_proc: true
- pgno: 81
  md: "However, this also means that using `localPosition`, `localRotation`,\nand\
    \ `localScale` have a relatively trivial cost associated with them, since these\
    \ are the\nvalues stored directly in the given `Transform` and can be retrieved\
    \ without any additional\nmatrix multiplication. Therefore, these local property\
    \ values should be used whenever\npossible.\n\nUnfortunately, changing our mathematical\
    \ calculations from world-space to local-space can\nover-complicate what were\
    \ originally simple (and solved) problems, so making such\nchanges risks breaking\
    \ our implementation and introducing a lot of unexpected bugs.\nSometimes, it's\
    \ worth absorbing a minor performance hit in order to solve a complex 3D\nmathematical\
    \ problem more easily.\n\nAnother problem with constantly changing a `Transform`\
    \ Component's properties is that is\nalso sends internal notifications to Components\
    \ like `Collider`, `Rigidbody`, `Light`,\nand `Camera` which must also be processed\
    \ since the Physics and Rendering Systems both\nneed to know the new value of\
    \ the `Transform` and update accordingly.\n\nThe speed of these internal notifications\
    \ were improved dramatically in\nUnity 5.4 due to the reorganization of `Transform`s\
    \ in memory in Unity\n5.4, as mentioned previously, but we still need to be aware\
    \ of their costs.\n\nIt is not uncommon, during a complex event chain, that we\
    \ replace a `Transform`\nComponent's properties multiple times in the same frame\
    \ (although this is probably a\nwarning sign of over-engineered design). This\
    \ would cause the internal messages to fire\neach and every time this happens,\
    \ even if they occur during the same frame, or even the\nsame function call. Ergo,\
    \ we should consider minimizing the number of times we modify\n`Transform` properties\
    \ by caching them in a member variable and committing them only at\nthe end of\
    \ the frame, as follows:\n\n```\nprivate bool _positionChanged;\nprivate Vector3\
    \ _newPosition;\n\npublic void SetPosition(Vector3 position) {\n    _newPosition\
    \ = position;\n    _positionChanged = true;\n}\n\nvoid FixedUpdate() {\n    if\
    \ (_positionChanged) {\n        transform.position = _newPosition;\n        _positionChanged\
    \ = false;\n    }\n}\n```"
