- pgno: 55
  md: "Profiling tools are generally very complex, so it’s unlikely we would be able\
    \ to generate a comparable solution on our own within a reasonable time frame.\
    \ When it comes to testing CPU usage, all we should really need is an accurate\
    \ timing system, a fast, low-cost way of logging that information, and some piece\
    \ of code to test against. It just so happens that the .NET library (or, technically,\
    \ the Mono framework) comes with a Stopwatch class under the System.Diagnostics\
    \ namespace. We can stop and start a Stopwatch object at any time, and we can\
    \ easily acquire a measure of how much time has passed since the Stopwatch was\
    \ started.\n\nUnfortunately, this class is not perfectly accurate; it is accurate\
    \ only to milliseconds, or tenths of a millisecond, at best. Counting high-precision\
    \ real time with a CPU clock can be a surprisingly difficult task when we start\
    \ to get into it; so, in order to avoid a detailed discussion of the topic, we\
    \ should try to find a way for the Stopwatch class to satisfy our needs.\n\nIf\
    \ precision is important, then one effective way to increase it is by running\
    \ the same test multiple times. Assuming that the test code block is both easily\
    \ repeatable and not exceptionally long, we should be able to run thousands, or\
    \ even millions of tests within a reasonable time frame and then divide the total\
    \ elapsed time by the number of tests we just performed to get a more accurate\
    \ time for a single test.\n\nBefore we get obsessed with the topic of high precision,\
    \ we should first ask ourselves if we even need it. Most games expect to run at\
    \ 30 FPS or 60 FPS, which means that they only have around 33 milliseconds or\
    \ 16 milliseconds, respectively, to compute everything for the entire frame. So,\
    \ hypothetically, if we need to bring only the performance of a particular code\
    \ block under ten milliseconds, then repeating the test thousands of times to\
    \ get microsecond precision is too many orders of magnitude away from the target\
    \ to be worthwhile.\n\nThe following is a class definition for a custom timer\
    \ that uses a Stopwatch to count time for a given number of tests:\n\n```\nusing\
    \ System;\nusing System.Diagnostics;\npublic class CustomTimer : IDisposable {\n\
    \    private string _timerName;\n    private int _numTests;\n    private Stopwatch\
    \ _watch;\n    // give the timer a name, and a count of the\n    // number of\
    \ tests we're running\n    public CustomTimer(string timerName, int numTests)\
    \ {\n        _timerName = timerName;\n\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "```\n_numTests = numTests;\nif (_numTests &lt;= 0) {\n    _numTests = 1;\n\
    }\n_watch = Stopwatch.StartNew();\n}\n// automatically called when the 'using()'\
    \ block ends\npublic void Dispose() {\n    _watch.Stop();\n    float ms = _watch.ElapsedMilliseconds;\n\
    \    UnityEngine.Debug.Log(string.Format(\"{0} finished: {1:0.00} \" +\n    \"\
    milliseconds total, {2:0.000000} milliseconds per-test \" +\n    \"for {3} tests\"\
    , _timerName, ms, ms / _numTests, _numTests));\n}\n}\n```\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_56_0.png)\n\
    \nAdding an underscore before member variable names is a common and useful way\
    \ of distinguishing a class' member variables (also known as fields) from a method's\
    \ arguments and local variables.\n\nThe following is an example of the `CustomTimer`\
    \ class usage:\n\n```\nconst int numTests = 1000;\nusing (new CustomTimer(\"My\
    \ Test\", numTests)) {\n    for(int i = 0; i &lt; numTests; ++i) {\n        TestFunction();\n\
    \    }\n} // // the timer's Dispose() method is automatically called here\n```\n\
    \nThere are three things to note when using this approach. Firstly, we are only\
    \ making an average of multiple method invocations. If processing time varies\
    \ enormously between invocations, then that will not be well represented in the\
    \ final average.\n\nSecondly, if memory access is common, then repeatedly requesting\
    \ the same blocks of memory will result in an artificially higher cache hit rate\
    \ (where the CPU can find data in memory very quickly because it's accessed the\
    \ same region recently), which will bring the average time down when compared\
    \ to a typical invocation.\n\nThirdly, the effects of **Just-In-Time (JIT)** compilation\
    \ will be effectively hidden for similarly artificial reasons, as it only affects\
    \ the first invocation of the method. JIT compilation is a .NET feature that will\
    \ be covered in more detail in Chapter 8, *Masterful Memory Management*."
  merge: -1
  img_proc: true
- pgno: 57
  md: "The `using` block is typically used to safely ensure that unmanaged resources\
    \ are properly\ndestroyed when they go out of scope. When the `using` block ends,\
    \ it will automatically\ninvoke the object's `Dispose()` method to handle any\
    \ cleanup operations. In order to\nachieve this, the object must implement the\
    \ IDisposable interface, which forces it to define\nthe `Dispose()` method.\n\n\
    However, the same language feature can be used to create a distinct code block,\
    \ which\ncreates a short-term object, which then automatically processes something\
    \ useful when the\ncode block ends, which is how it is being used in the preceding\
    \ code block.\n\n> Note that the `using` block should not be confused with the\
    \ `using` statement, which is used at the start of a script file to pull in additional\
    \ namespaces. It's extremely ironic that the keyword for managing namespaces in\
    \ C# has a naming conflict with another keyword.\n\nAs a result, the `using` block\
    \ and the `CustomTimer` class give us a clean way of wrapping\nour test code in\
    \ a way that makes it obvious when and where it is being used.\n\nAnother concern\
    \ to worry about is application warm-up time. Unity has a significant\nstartup\
    \ cost when a Scene begins, given the amount of data that needs to be loaded from\n\
    disk, the initialization of complex subsystems, such as the Physics and Rendering\
    \ Systems,\nand the number of calls to various `Awake()` and `Start()` callbacks\
    \ that need to be resolved\nbefore anything else can happen. This early overhead\
    \ might only last a second, but that can\nhave a significant effect on the results\
    \ of our testing if the code is also executed during this\nearly initialization\
    \ period. This makes it crucial that if we want an accurate test, then any\nruntime\
    \ testing should begin only after the application has reached a steady state.\n\
    \nIdeally, we would be able to execute the target code block in its own Scene\
    \ after its\ninitialization has completed. This is not always possible, so as\
    \ a backup plan, we could\nwrap the target code block in an `Input.GetKeyDown()`\
    \ check in order to assume control\nover when it is invoked. For example, the\
    \ following code will execute our test\nmethod only when the spacebar is pressed:\n\
    \n```\n```csharp\nif (Input.GetKeyDown(KeyCode.Space)) {\n    const int numTests\
    \ = 1000;\n    using (new CustomTimer(\"Controlled Test\", numTests)) {\n    \
    \    for(int i = 0; i < numTests; ++i) {\n            TestFunction();\n      \
    \  }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: 'As mentioned previously, Unity’s **Console** window logging mechanism is prohibitively
    expensive. As a result, we should try not to use these logging methods in the
    middle of a profiling test (or during gameplay, for that matter). If we find ourselves
    absolutely needing detailed profiling data that prints out lots of individual
    messages (such as performing a timing test on a loop to figure out which iteration
    is costing more time than the rest), then it would be wiser to cache the logging
    data and print it all out at the end, as the `CustomTimer` class does. This will
    reduce runtime overhead, at the cost of some memory consumption. The alternative
    is that many milliseconds are lost to printing each `Debug.Log()` message in the
    middle of the test, which pollutes the results.


    The `CustomTimer` class also makes use of `string.Format()`. This will be covered
    in more detail in **Chapter 8**, _Masterful Memory Management_, but the short
    explanation is that this method is used because generating custom `string` object
    using the `+` operator (for example, code such as `Debug.Log("Test: " + output);`)
    can result in a surprisingly large amount of memory allocations, which attracts
    the attention of the Garbage Collector. Doing otherwise would conflict with our
    goal of achieving accurate timing and analysis and should be avoided.


    # # Final thoughts on Profiling and Analysis


    One way of thinking about performance optimization is _the act of stripping away
    unnecessary tasks that spend valuable resources_. We can do the same and maximize
    our own productivity through minimizing any wasted effort. Effective use of the
    tools we have at our disposal is of paramount importance. It would serve us well
    to optimize our own workflow by keeping aware of some best practices and techniques.


    Most, if not all, advice for using any kind of data-gathering tool properly can
    be summarized into three different strategies:


    +   • Understanding the tool

    +   • Reducing noise

    +   • Focusing on the issue'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# # Understanding the Profiler


    The Profiler is an arguably well-designed and intuitive tool, so understanding
    the majority

    of its feature set can be gained by simply spending an hour or two exploring its
    options

    with a test project and reading its documentation. The more we know about a tool
    in terms

    of its benefits, pitfalls, features, and limitations, the more sense we can make
    of the

    information it is giving us, so it is worth spending the time to use it in a playground
    setting.

    We don''t want to be two weeks away from release, with a hundred performance defects
    to

    fix, with no idea how to do performance analysis efficiently.


    For example, always remain aware of the relative nature of the **Timeline View**''s
    graphical

    display. The **Timeline View** does not provide values on its vertical axis and
    automatically

    readjusts this axis based on the content of the last 300 frames; it can make small
    spikes

    appear to be a bigger problem than they really are because of the relative change.
    So, just

    because a spike or resting state in the timeline seems large and threatening does
    not

    necessarily mean there is a performance issue.


    Several Areas in the Timeline View provide helpful benchmark bars, which appear
    as

    horizontal lines with a timing and FPS value associated with them. These should
    be used to

    determine the magnitude of the problem. Don''t let the Profiler trick us into
    thinking that big

    spikes are always bad. As always, it''s only important if the user will notice
    it.


    As an example, if a large CPU usage spike does not exceed the 60 FPS or 30 FPS
    benchmark

    bars (depending on the application''s target frame rate), then it would be wise
    to ignore it

    and search elsewhere for CPU performance issues, as no matter how much we improve
    the

    offending piece of code, it will probably never be noticed by the end user, and
    therefore

    isn''t a critical issue that affects user experience.


    # # Reducing noise


    The classical definition of noise (at least in the realm of computer science)
    is meaningless

    data, and a batch of profiling data that was blindly captured with no specific
    target in mind

    is always full of data that won''t interest us. More sources of data takes more
    time to

    mentally process and filter, which can be very distracting. One of the best methods
    to avoid

    this is to simply reduce the amount of data we need to process by stripping away
    any data

    deemed non-vital to the current situation.


    Reducing clutter in the Profiler''s graphical interface will make it easier to
    determine which

    subsystems are causing a spike in resource usage. Remember to use the colored
    checkboxes

    in each Timeline View Area to narrow the search.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/da79484c9b30dc915216dbc5454a9bbf_60_0.png)


    Be warned that these settings are auto-saved in the Editor, so ensure that you
    re-enable them for the next profiling session, as this might cause us to miss
    something important next time.


    Also, `GameObjects` can be deactivated to prevent them from generating profiling
    data, which will also help reduce clutter in our profiling data. This will naturally
    cause a slight performance boost for each object we deactivate. However, if we''re
    gradually deactivating objects and performance suddenly becomes significantly
    more acceptable when a specific object is deactivated, then clearly that object
    is related to the root cause of the problem.


    # # Focusing on the issue


    This category may seem redundant, given that we''ve already covered reducing noise.
    All we should have left is the issue at hand, right? Not exactly. Focus is the
    skill of not letting ourselves become distracted by inconsequential tasks and
    wild goose chases.


    Recall that profiling with the Unity Profiler comes with a minor performance cost.
    This cost is even more severe when using the **Deep Profiling** option. We might
    even introduce more minor performance costs into our application with additional
    logging. It''s easy to forget when and where we introduced profiling code if the
    hunt continues for several hours.


    We are effectively changing the result by measuring it. Any changes we implement
    during data sampling can sometimes lead us to chase after non-existent bugs in
    the application, when we could have saved ourselves a lot of time by attempting
    to replicate the scenario without additional profiling instrumentation. If the
    bottleneck is reproducible and noticeable without profiling, then it''s a candidate
    to begin an investigation. However, if new bottlenecks keep appearing in the middle
    of an existing investigation, then keep in mind that they could be bottlenecks
    we introduced with our test code and not an existing problem that''s been newly
    exposed.


    Finally, when we have finished profiling, completed our fixes, and are now ready
    to move on to the next investigation, we should make sure to profile the application
    one last time to verify that the changes have had the intended effect.'
  merge: -1
  img_proc: true
