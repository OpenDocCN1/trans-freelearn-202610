- pgno: 82
  md: 'This code will only commit changes to `position` in the next `FixedUpdate()`
    method.


    Note that changing the `Transform` in this manner does not result in strange-looking
    behavior or teleporting objects during gameplay. The whole purpose of those internal
    events are to make sure the Physics and Rendering Systems are always synchronized
    with the current `Transform` state. Hence, Unity doesn’t skip a beat and fires
    the internal events every time changes come through the `Transform` Component
    just to be sure nothing gets missed.


    # # Avoid Find() and SendMessage() at runtime


    The `SendMessage()` method and family of `GameObject.Find()` methods are notoriously
    expensive and should be avoided at all costs. The `SendMessage()` method is about
    2,000 times slower than a simple function call, and the cost of the `Find()` method
    scales very poorly with Scene complexity since it must iterate through every `GameObject`
    in the Scene. It is sometimes forgivable to call `Find()` during initialization
    of a Scene, such as during an `Awake()` or `Start()` callback. Even in this case,
    it should only be used to acquire objects that we know for certain already exist
    in the Scene and for scenes that have only a handful of `GameObjects` in them.
    Regardless, using either of these methods for interobject communication at runtime
    is likely to generate a very noticeable overhead and potentially dropped frames.


    Relying on `Find()` and `SendMessage()` is typically symptomatic of poor design,
    inexperience in programming with C# and Unity, or just plain laziness during prototyping.
    Their usage has become something of an epidemic among beginner-level and intermediate-
    level projects, so much so that Unity Technologies feels the need to keep reminding
    users to avoid using them in a real game over and again in their documentation
    and at their conferences. They only exist as a less _programmer-y_ way to introduce
    new users to interobject communication, and for some special cases where they
    can be used in a responsible way (which are few and far between). In other words,
    they’re so ridiculously expensive that they break the rule of not preoptimizing
    our code, and it’s worth going out of our way to avoid using them if our project
    is going beyond the prototyping stage (which is a distinct possibility since you’re
    reading this book).'
  merge: -1
  img_proc: true
- pgno: 83
  md: "To be fair, Unity targets a wide demographic of users, from hobbyists, students,\n\
    professionals, to those with delusions of grandeur, and also in team sizes from\
    \ individual\ndevelopers to hundreds of people on the same team. This results\
    \ in an incredibly wide\nrange of software development ability. When you’re starting\
    \ out with Unity, it can be\ndifficult to figure out on your own what you should\
    \ be doing differently, especially given\nhow the Unity engine does not adhere\
    \ to the design paradigms of many other game engines\nwe might be familiar with.\
    \ It has some foreign and quirky concepts surrounding scenes and\nPrefabs, does\
    \ not have a built-in God Class entry point, nor any obvious raw data storage\n\
    systems to work with.\n\nA God Class is a fancy name for the first object we might\
    \ create in our\napplication and whose job would be to create everything else\
    \ we need\nbased on the current context (what level to load, which subsystems\
    \ to\nactivate, and so on). These can be particularly useful if we want a single\n\
    centralized location that controls the order of events as they happen\nduring\
    \ the entire lifecycle of our application.\n\nThis is an important topic not just\
    \ for performance, but also for any real-time event-driven\nsystem design (including,\
    \ but not limited to games), so it is worth exploring the subject in\nsome detail,\
    \ evaluating some alternative methods for interobject communication.\n\nLet’s\
    \ start by examining a worst case example, which uses both Find() and\nSendMessage()\
    \ to communicate between objects, and then look into ways to improve\nupon it.\n\
    \nThe following is a class definition for a simple EnemyManagerComponent that\
    \ tracks a list\nof GameObjects representing enemies in our game, and provides\
    \ a KillAll() method to\ndestroy them all when needed:\n\n```\nusing UnityEngine;\n\
    using System.Collections.Generic;\nclass EnemyManagerComponent : MonoBehaviour\
    \ {\n    List<GameObject> _enemies = new List<GameObject>();\n    public void\
    \ AddEnemy(GameObject enemy) {\n    if (!_enemies.Contains(enemy)) {\n    _enemies.Add(enemy);\n\
    \    }\n    }\n    public void KillAll() {\n    for (int i = 0; i < _enemies.Count;\
    \ ++i) {\n    GameObject.Destroy(_enemies[i]);\n    }\n    }\n```"
  merge: -1
