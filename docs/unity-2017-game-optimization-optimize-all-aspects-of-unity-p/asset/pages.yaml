    \ if the most we will ever expect to see in the Scene at any given\ntime is three\
    \ or four. Conversely, spawning too few instances will cause excessive runtime\n\
    memory allocations, and the goal of this system is to push the majority of allocation\
    \ to the\nstart of a Scene's lifetime. We need to be careful about how many instances\
    \ we maintain in\nmemory so that we don't waste more memory space than necessary.\n\
    \nLet's define a method in our `PrefabPoolingSystem` class that we can use to\
    \ quickly\nprespawn a given number of objects from a Prefab. This essentially\
