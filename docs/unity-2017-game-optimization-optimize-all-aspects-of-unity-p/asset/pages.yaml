- pgno: 321
  md: 'The approach for `IPoolableComponent` will be very different from the approach
    taken for `IPoolableObject`. The objects being created this time are `GameObject`s,
    which are a lot trickier to work with than standard objects because of how much
    of their runtime behavior is already handled through the Unity Engine and how
    little low-level access we have to it.


    `GameObject`s do not give us access to an equivalent `New()` method that we can
    invoke any time the object is created, and we cannot derive from the `GameObject`
    class in order to implement one. `GameObject`s are created either by placing them
    in a `Scene` or by instantiating them at runtime through `GameObject.Instantiate()`,
    and the only inputs we can apply are an initial position and rotation. Of course,
    their `Component`s have an `Awake()` callback that we can define, which is invoked
    the first time the `Component` is brought to life, but this is merely a compositional
    object-it’s not the actual parent object we’re spawning and despawning.


    So, because we have control on only a `GameObject` class’s `Component`s, it is
    assumed that the `IPoolableComponent` Interface Class is implemented by at least
    one of the `Component`s that is attached to the `GameObject` we wish to pool.


    The `Spawned()` method should be invoked on every implementing `Component` each
    time the pooled `GameObject` is respawened, while the `Despawned()` method gets
    invoked whenever it is despawned. This gives us entry points to control the data
    variables and behavior during the creation and destruction of the parent `GameObject`.


    The act of despawning a `GameObject` is trivial: turn its `active` flag to `false`
    through `SetActive()`. This disables the `Collider` and `Rigidbody` for physics
    calculations, removes it from the list of renderable objects, and essentially
    takes care of disabling all interactions with all built-in Unity Engine subsystems
    in a single stroke. The only exception is any `Coroutine`s that are currently
    invoking on the object, since as you learned in `Chapter 2, Scripting Strategies`,
    `Coroutine`s are invoked independently of any `Update()` and `GameObject` activity.
    We will, therefore, need to call `StopCoroutine()` or `StopAllCoroutines()` during
    the despawning of such objects.


    In addition, `Component`s typically hook into our own custom gameplay subsystems
    as well, so the `Despawn()` method gives our `Component`s the opportunity to take
    care of any custom cleanup before shutting down. For example, we would probably
    want to use `Despawn()` to deregister the `Component` from the Messaging System
    we defined in `Chapter 2, Scripting Strategies`.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'Unfortunately, successfully respawning the `GameObject` is a lot more complicated.
    When we respawn an object, there will be many settings that were left behind when
    the object was previously active, and these must be reset in order to avoid conflicting
    behaviors. A common problem with this is the Rigidbody''s `linearVelocity` and
    `angularVelocity` properties. If these values are not explicitly reset before
    the object is reactivated, then the newly respawned object will continue moving
    with the same velocity the old version had when it was despawned.


    This problem becomes further complicated by the fact that built-in Components
    are sealed, which means that they cannot be derived from. So, to avoid these issues,
    we can create a custom Component that resets the attached Rigidbody whenever the
    object is despawned:


    ```

    public class ResetPooledRigidbodyComponent : MonoBehaviour,

    IPoolableComponent {

    [SerializeField] Rigidbody _body;

    public void Spawned() { }

    public void Despawned() {

    if (_body == null) {

    _body = GetComponent<Rigidbody>() ;

    if (_body == null) {

    // no Rigidbody!

    return;

    }

    }

    _body.velocity = Vector3.zero;

    _body.angularVelocity = Vector3.zero;

    }

    }

    ```


    Note that the best place to perform the cleanup task is during despawning, because
    we cannot be certain in what order the `GameObject` class''s `IPoolableComponent`
    Interface Classes will have their `Spawned()` methods invoked. It is unlikely
    that another `IPoolableComponent` will change the object''s velocity during despawning,
    but it is possible that a different `IPoolableComponent` attached to the same
    object might want to set the Rigidbody''s initial velocity to some important value
    during its own `Spawned()` method. Ergo, performing the velocity reset during
    the `ResetPooledRigidbodyComponent` class''s `Spawned()` method could potentially
    conflict with other Components and cause some very confusing bugs.'
  merge: -1
  img_proc: true
- pgno: 323
  md: "![](img/da79484c9b30dc915216dbc5454a9bbf_323_0.png)\n\nIn fact, creating Poolable\
    \ Components that are not self-contained and tend to tinker with other Components\
    \ like this, is one of the biggest dangers of implementing a Pooling System. We\
    \ should minimize such design and routinely verify them when we're trying to debug\
    \ strange issues in our game.\n\nFor the sake of illustration, here is the definition\
    \ of a simple poolable Component making use of the MessagingSystem class we defined\
    \ in Chapter 2, Scripting Strategies. This Component automatically handles some\
    \ basic tasks every time the object is spawned and despawned:\n\n```\n```\npublic\
    \ class PoolableTestMessageListener : MonoBehaviour,\n    IPoolableComponent {\n\
    \    public void Spawned() {\n        MessagingSystem.Instance.AttachListener(typeof(MyCustomMessage),\n\
    \            this.HandleMyCustomMessage);\n    }\n\n    bool HandleMyCustomMessage(BaseMessage\
    \ msg) {\n        MyCustomMessage castMsg = msg as MyCustomMessage;\n        Debug.Log(string.Format(\"\
    Got the message! {0}, {1}\",\n            castMsg._intValue,\n            castMsg._floatValue));\n\
    \        return true;\n    }\n\n    public void Despawned() {\n        if (MessagingSystem.IsAlive)\
    \ {\n            MessagingSystem.Instance.DetachListener(typeof(MyCustomMessage),\n\
    \                this.HandleMyCustomMessage);\n        }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 324
  md: '# # The Prefab Pooling System


    Hopefully, we now have an understanding of what we need from our Pooling System,
    so all that''s left is to implement it. The requirements are as follows:


    +   - It must accept requests to spawn a `GameObject` from a Prefab, an initial
    position, and an initial rotation:

    +     - If a despawned version already exists, it should respawn the first available
    one

    +     - If it does not exist, then it should instantiate a new `GameObject` from
    the Prefab

    +     - In either case, the `Spawned()` method should be invoked on all `IPoolableComponent`
    Interface Classes attached to the `GameObject`


    +   - It must accept requests to despawn a specific `GameObject`:

    +     - If the object is managed by the Pooling System, it should deactivate it
    and call the `Despawned()` method on all `IPoolableComponent` Interface Classes
    attached to the `GameObject`

    +     - If the object is not managed by the Pooling System, it should send an
    error


    The requirements are fairly straightforward, but the implementation requires some
    investigation if we wish to make the solution performance-friendly. Firstly, a
    typical Singleton would be a good choice for the main entry point since we want
    this system to be globally accessible from anywhere:


    ```

    public static class PrefabPoolingSystem {}

    ```


    The main task for object spawning involves accepting a Prefab reference and figuring
    whether we have any despawned `GameObjects` that were originally instantiated
    from the same reference. To do this, we will essentially want our Pooling System
    to keep track of two different lists for any given Prefab reference: a list of
    active (spawned) `GameObjects`, and a list of inactive (despawned) objects that
    were instantiated from it. This information would be best abstracted into a separate
    class, which we will name `PrefabPool`.


    In order to maximize the performance of this system (and hence make the largest
    gains possible, relative to just allocating and deallocating objects from memory
    all of the time), we will want to use some fast data structures in order to acquire
    the corresponding `PrefabPool` objects whenever a spawn or despawn request comes
    in.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Since spawning involves being given a Prefab, we will want a data structure
    that can

    quickly map Prefabs to the PrefabPool that manages them. Also, since despawning

    involves being given a GameObject, we will want another data structure that can
    quickly

    map spawned GameObjects to the PrefabPool that originally spawned them. A pair
    of

    dictionaries would be a good choice for both of these needs.


    Let''s define these dictionaries in our PrefabPoolingSystem class:


    ```

    public static class PrefabPoolingSystem {

    static Dictionary<GameObject, PrefabPool> _prefabToPoolMap = new

    Dictionary<GameObject, PrefabPool>();

    static Dictionary<GameObject, PrefabPool> _goToPoolMap = new

    Dictionary<GameObject, PrefabPool>();

    }

    ```


    Next, we''ll define what happens when we spawn an object:


    ```

    public static GameObject Spawn(GameObject prefab, Vector3 position,

    Quaternion rotation) {

    if (!_prefabToPoolMap.ContainsKey (prefab)) {

    _prefabToPoolMap.Add (prefab, new PrefabPool());

    }

    PrefabPool pool = _prefabToPoolMap[prefab];

    GameObject go = pool.Spawn(prefab, position, rotation);

    _goToPoolMap.Add (go, pool);

    return go;

    }

    ```


    The Spawn() method will be given a Prefab reference, an initial position, and
    an initial

    rotation. We need to figure out which PrefabPool the Prefab belongs to (if any),
    ask it to

    spawn a new GameObject using the data provided, and then return the spawned object
    to

    the requester. We will first check our Prefab-to-Pool map to check whether a pool
    already

    exists for this Prefab. If not, we immediately create one. In either case, we
    then ask the

    PrefabPool to spawn us a new object. The PrefabPool will either end up respawning
    an

    object that was despawned earlier or instantiate a new one (if there aren''t any
    inactive

    instances left).'
  merge: -1
  img_proc: true
- pgno: 326
  md: "This class doesn't particularly care how the `PrefabPool` creates the object.\
    \ It just wants the instance generated by the `PrefabPool` class so that it can\
    \ be entered into the `GameObject-to-Pool` map and returned to the requestor.\n\
    \nFor convenience, we can also define an overload that places the object at the\
    \ world's center. This is useful for `GameObjects` that aren't visible and just\
    \ need to exist in the Scene:\n\n```\n```csharp\npublic static GameObject Spawn(GameObject\
    \ prefab) {\n    return Spawn (prefab, Vector3.zero, Quaternion.identity);\n}\n\
    ```\n```\n\nNote that no actual spawning and despawning are taking place, yet.\
    \ This task will eventually be implemented within the `PrefabPool` class.\n\n\
    Despawning involves being given a `GameObject` and then figuring out which `PrefabPool`\
    \ is managing it. This could be achieved by iterating through our `PrefabPool`\
    \ objects and checking whether they contain the given `GameObject`. However, if\
    \ we end up generating a lot of Prefab Pools, then this iterative process can\
    \ take a while. We will always end up with as many `PrefabPool` objects as we\
    \ have Prefabs (at least, so long as we manage all of them through the Pooling\
    \ System). Most projects tend to have dozens, hundreds, if not thousands, of different\
    \ Prefabs.\n\nSo, the `GameObject-to-Pool` map is maintained to ensure that we\
    \ always have rapid access to the `PrefabPool` that originally spawned the object.\
