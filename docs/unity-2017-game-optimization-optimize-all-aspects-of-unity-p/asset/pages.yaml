- pgno: 128
  md: 'As previously mentioned, we can theoretically minimize the number of Draw Calls
    by reducing how often we cause the system to change Render State information.
    So, part of the goal is to reduce the amount of Materials we use. However, if
    we set all objects to use the same Material, we still won''t see any benefit and
    the number of batches remains at 9:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_128_0.png)


    This is because we''re not actually reducing the number of Render State changes
    nor efficiently grouping mesh information. Unfortunately, the Rendering Pipeline
    is not smart enough to realize we''re overwriting the exact same Render State
    values, and then asking it to render the same meshes, over and over again.'
