- pgno: 145
  md: '```

    _source.Play();

    }

    }

    }

    ```


    If we add an AudioSource to our Scene, assign a large audio file to it, and assign
    it to

    the _source field of the PreloadAudioDataTest Component, we can press the spacebar

    and take a look at a printout of how long the Play() function took to complete.
    A simple

    test of this code against a 10 MB audio file with Preload Audio Data enabled will
    reveal

    that the call was practically instantaneous. However, disabling Preload Audio
    Data,

    applying the changes to the file, and repeating the test reveals that it takes
    significantly

    longer (around 700 ms on a desktop PC with an Intel i5 3570K). This completely
    blows past

    our budget for a single frame, so in order to use this toggle responsibly we will
    need to load

    the majority of our audio assets into memory ahead of time.


    This can be achieved by calling AudioClip.LoadAudioData() (which can be acquired

    through an AudioSource Component''s clip property). However, this activity will
    still

    block the main thread for the same amount of time it takes to load it in the previous

    example, and so loading our audio file will still cause frame drops, regardless
    of whether or

    not we choose to load it ahead of time. Data can also be unloaded

    through AudioClip.UnloadAudioData().


    This is where the Load In Background option comes in. This changes audio loading
    into an

    asynchronous task; therefore, loading will not block the main thread. With this
    option

    enabled, the actual call to AudioClip.LoadAudioData() would complete instantly,
    but

    keep in mind that the file won''t be ready to play until loading completes on
    a separate

    thread. We can double-check an AudioClip Component''s current loading state through

    the AudioClip.loadState property. If Load In Background is enabled, and we

    call AudioSource.Play() without loading the data first, Unity will still require
    the file to

    be loaded into memory before it can be played, and so there will be a delay between
    when

    we called AudioSource.Play() and when the audio file actually begins playback.
    This

    risks introducing jarring behavior if we try to access a sound file before it
    is fully loaded,

    causing it to be out of sync with other tasks, such as animations.


    Modern games typically implement convenient stopping points in levels to perform
    tasks

    such as loading or unloading audio data—for example, an elevator between floors
    or long

    corridors, where very little action is taking place. Solutions involving custom
    loading and

    unloading of audio data via these methods would need to be tailor-made to the
    particular

    game, depending on when audio files are needed, how long they''re needed for,
    how Scenes

    are put together, and how players traverse them.'
