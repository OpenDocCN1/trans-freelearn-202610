- pgno: 8
  md: '**Dr. Sebastian Thomas Koenig** received his Ph.D. in human interface technology
    from the University of Canterbury, New Zealand, developing a framework for personalized
    virtual reality cognitive rehabilitation. He obtained his diploma in psychology
    from the University of Regensburg, Germany, in the areas of experimental psychology,
    clinical neuropsychology, and virtual reality rehabilitation.


    Dr. Koenig is the founder and CEO of Katana Simulations, where he oversees the
    design, development, and evaluation of cognitive assessment and training simulations.
    His professional experience spans over 10 years of clinical work in cognitive
    rehabilitation and virtual reality research, development, and human computer interaction.
    He has been awarded over $2 million in research funding in the USA, Germany, and
    Australia as principal investigator and industry partner. He has extensive experience
    as a speaker at international conferences and as a reviewer of scientific publications
    in the areas of rehabilitation, cognitive psychology, neuropsychology, software
    engineering, game development, games user research, and virtual reality.


    Dr. Koenig has developed numerous software applications for cognitive assessment
    and training. For his work on virtual memory tasks, he was awarded the prestigious
    Laval Virtual Award in 2011 in the Medicine and Health category. Other applications
    include the Wonderworks Virtual Reality Attention Training in collaboration with
    the Kessler Foundation, NJ, USA, and the patent-pending Microsoft Kinect-based
    motor and cognitive training JewelMine/Mystic Isle at the USC Institute for Creative
    Technologies, CA, USA. Dr. Koenig was awarded the Early Career Investigator Award
    (2nd place) by the International Society for Virtual Rehabilitation in 2016.'
  merge: -1
  img_proc: true
