- pgno: 122
  md: '# # 3 The Benefits of Batching


    In 3D graphics and games, batching is a very general term describing the process
    of

    grouping a large number of wayward pieces of data together and processing them
    as a

    single, large block of data. This situation is ideal for CPUs, and particularly
    GPUs, which

    can handle simultaneous processing of multiple tasks with their multiple cores.
    Having a

    single core switching back and forth between different locations in memory takes
    time, so

    the less this needs to be done, the better.


    In some cases, the act of batching refers to large sets of meshes, vertices, edges,
    UV

    coordinates, and other different data types that are used to represent a 3D object.
    However,

    the term could just as easily refer to the act of batching audio files, sprites,
    texture files, and

    other large datasets.


    So, just to clear up any confusion, when the topic of batching is mentioned in
    Unity, it is

    usually referring to the two primary mechanisms it offers for batching mesh data:
    Dynamic

    Batching and Static Batching. These methods are essentially two different forms
    of

    geometry merging, where we combine mesh data of multiple objects together and
    render

    them all in a single instruction, as opposed to preparing and drawing each one
    separately.


    The process of batching together multiple meshes into a single mesh is possible
    because

    there is no reason a mesh object must fill a contiguous volume of 3D space. The
    Rendering

    Pipeline is perfectly happy with accepting a collection of vertices that are not
    attached

    together with edges, and so we can take multiple separate meshes that might have
    resulted

    in multiple render instructions and combine them together into a single mesh,
    thus

    rendering it out using a single instruction.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'There has been a lot of confusion over the years surrounding the conditions
    under which

    the Dynamic Batching and Static Batching systems activate and where we might even
    see a

    performance improvement. After all, in some cases, batching can actually degrade

    performance if it is not used wisely. A proper understanding of these systems
    will give us

    the knowledge we need to improve the graphics performance of our application in

    significant ways.


    This chapter intends to dispel much of the misinformation floating around about
    these

    systems. We will observe, via explanation, exploration, and examples, just how
    these two

    batching methods operate. This will enable us to make informed decisions, using
    most of

    them to improve our application''s performance.


    We will cover the following topics in this chapter:


    +   • A brief introduction to the Rendering Pipeline and the concept of Draw Calls

    +   • How Unity''s Materials and Shaders work together to render our objects

    +   • Using the Frame Debugger to visualize rendering behavior

    +   • How Dynamic Batching works, and how to optimize it

    +   • How Static Batching works, and how to optimize it


    # # Draw Calls


    Before we discuss Dynamic Batching and Static Batching independently, let''s first

    understand the problems that they are both trying to solve within the Rendering
    Pipeline.

    We will try to keep fairly light on the technicalities as we will explore this
    topic in greater

    detail in Chapter 6, Dynamic Graphics.


    The primary goal of these batching methods is to reduce the number of Draw Calls
    required

    to render all objects in the current view. At its most basic form, a Draw Call
    is a request sent

    from the CPU to the GPU asking it to draw an object.


    > Draw Call is the common industry vernacular for this process, although

    > they are sometimes referred to as SetPass Calls in Unity, since some low-

    > level methods are named as such. Think of it as configuring options

    > before initiating the current rendering pass. We will refer to them as Draw

    > Calls throughout the remainder of this book.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# # The Benefits of Batching


    # # Chapter 3


    Before a Draw Call can be requested, several tasks need to be completed. Firstly,
    mesh and texture data must be pushed from the CPU memory (RAM) into GPU memory
    (VRAM), which typically takes place during initialization of the Scene, but only
    for textures and meshes the Scene file knows about. If we dynamically instantiate
    objects at runtime using texture and mesh data that hasn''t appeared in the Scene
    yet, then they must be loaded at the time they are instantiated. The Scene cannot
    know ahead of time which Prefabs we''re planning to instantiate at runtime, as
    many of them are hidden behind conditional statements and much of our application''s
    behavior depends upon user input. Next, the CPU must prepare the GPU by configuring
    the options and rendering features that are needed to process the object that
    is the target of the Draw Call.


    These communication tasks between the CPU and GPU take place through the underlying
    Graphics API, which could be DirectX, OpenGL, OpenGLES, Metal, WebGL, or Vulkan,
    depending on the platform we''re targeting and certain graphical settings. These
    API calls go through a library, called a driver, which maintains a long series
    of complex and interrelated settings, state variables, and datasets that can be
    configured and executed from our application (although drivers are designed to
    service multiple applications simultaneously, as well as render calls coming from
    multiple threads). The available features change enormously based on the graphics
    card we''re using and the version of the Graphics API we''re targeting; more advanced
    graphics cards support more advanced features, which would need to be supported
    by newer versions of the API, so updated drivers would be needed to enable them.
    The sheer number of settings, supported features, and compatibility levels between
    one version and another that have been created over the years (particularly for
    the older APIs such as DirectX and OpenGL) can be nothing short of mind-boggling.
    Thankfully, at a certain level of abstraction, all of these APIs tend to operate
    in a similar fashion; hence Unity is able to support many different Graphics APIs
    through a common interface.


    This utterly massive array of settings that must be configured to prepare the
    Rendering Pipeline just prior to rendering an object is often condensed into a
    single term known as the Render State. Until these Render State options are changed,
    the GPU will maintain the same Render State for all incoming objects and render
    them in a similar fashion.


    # # [ 105 ]'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Changing the Render State can be a time-consuming process. So, for example,
    if we were to set the Render State to use a blue texture file and then ask it
    to render one gigantic mesh, then it would be rendered very rapidly with the whole
    mesh appearing blue. We could then render 9 more, completely different meshes,
    and they would all be rendered blue, since we haven''t changed which texture is
    being used. If, however, we wanted to render 10 meshes using 10 different textures,
    then this will take longer. This is because we will need to prepare the Render
    State with the new texture just prior to sending the Draw Call instruction for
    each mesh.


    The texture being used to render the current object is effectively a global variable
    in the Graphics API, and changing a global variable within a parallel system is
    much easier said than done. In a massively parallel system such as a GPU, we must
    effectively wait until all of the current jobs have reached the same synchronization
    point (in other words, the fastest cores need to stop and wait for the slowest
    ones to catch up, wasting processing time that they could be using on other tasks)
    before we can make a Render State change, at which point we will need to spin
    up all of the parallel jobs again. This can waste a lot of time, so the less we
    need to ask the Render State to change, the faster the Graphics API will be able
    to process our requests.


    Things that can trigger Render State synchronization include–but are not limited
    to–an immediate push of a new texture to the GPU and changing a Shader, lighting
    information, shadows, transparency, and pretty much any graphical setting we can
    think of.


    Once the Render State is configured, the CPU must decide what mesh to draw, what
    textures and Shader it should use, and where to draw the object based on its position,
    rotation, and scale (all represented within a 4x4 matrix known as a transform,
    which is where the Transform Component gets its name from) and then send an instruction
    to the GPU to draw it. In order to keep the communication between CPU and GPU
    very dynamic, new instructions are pushed into a queue known as the Command Buffer.
    This queue contains instructions that the CPU has created and that the GPU pulls
    from each time it finishes the preceding command.


    The trick to how batching improves the performance of this process is that a new
    Draw Call does not necessarily mean that a new Render State must be configured.
    If two objects share the exact same Render State information, then the GPU can
    immediately begin rendering the new object since the same Render State is maintained
    after the last object is finished. This eliminates the time wasted due to a Render
    State synchronization. It also serves to reduce the number of instructions that
    need to be pushed into the Command Buffer, reducing the workload on both the CPU
    and GPU.'
  merge: -1
  img_proc: true
- pgno: 126
  md: "# # Materials and Shaders\n\nRender State in Unity is essentially exposed to\
    \ us via Materials. Materials are a container\naround Shaders, short programs\
    \ that define how the GPU should render incoming vertex\nand texture data. A Shader\
    \ on its own does not have the necessary knowledge of state to\naccomplish anything\
    \ of value. A Shader requires inputs such as diffuse textures, Normal\nmaps, and\
    \ lighting information and effectively dictates what Render State variables need\
    \ to\nbe set in order to render the incoming data.\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_126_0.png)\n\
    \n> _Shaders are named this way because their original implementation many\n>\
    \ years ago was to only handle lighting and shading of an object (applying\n>\
    \ shadows, where originally there were none). Their purpose has grown\n> enormously\
    \ since then, and now they have a much more generic purpose\n> of being a programmatic\
    \ access point to many different kinds of parallel\n> tasks, but the old name\
    \ still remains._\n\nEvery Shader needs a Material, and every Material must have\
    \ a Shader. Even newly\nimported meshes introduced into the Scene without an assigned\
    \ Material are automatically\nassigned a default (hidden) Material, which gives\
    \ them a basic diffuse Shader and a white\ncoloration. So, there is no way of\
    \ getting around this relationship.\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_126_1.png)\n\
    \n> Note that a single Material can only support a single Shader. The use of\n\
    > multiple Shaders on the same mesh requires separate Materials to be\n> assigned\
    \ to different parts of the same mesh.\n\nTherefore, if we want to minimize how\
    \ often the Render State changes, then we can do so\nby reducing the number of\
    \ Materials we use during a Scene. This would result in two\nperformance improvements\
    \ simultaneously; the CPU will spend less time generating and\ntransmitting instructions\
    \ to the GPU each frame and the GPU won't need to stop and re-\nsynchronize state\
    \ changes as often.\n\nLet's begin with a simple Scene in order to visualize the\
    \ behavior of Materials and Batching.\nHowever, before we start, we should disable\
    \ a few rendering options as they will contribute\nsome extra Draw Calls, which\
    \ might be distracting:\n\n+   1. Navigate to **Edit | Project Settings | Quality**\
    \ and set **Shadows** to **Disable\n+   Shadows** (or select the default **Fastest**\
    \ quality level)\n+   \n+   2. Navigate to **Edit | Project Settings | Player**,\
    \ open the **Other Settings** tab, and\n+   disable **Static Batching** and **Dynamic\
    \ Batching** if they are enabled"
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Next, we''ll create a Scene that contains a single Directional Light with four
    cubes and four spheres, where each object has its own unique Material, position,
    rotation, and scale:


    ![](img/da79484c9b30dc915216dbc5454a9bbf_127_0.png)


    In the preceding screenshot, in the **Batching** value in the **Game** window''s
    **Stats** popup, we can see 9 total batches. This value closely represents the
    number of Draw Calls used to render the Scene. The current view will consume one
    of these batches rendering the background of the Scene, which could be set to
    **Skybox** or **Solid Color**. This is determined by the Camera object''s **Clear
    Flags** settings.


    The remaining 8 batches are used to draw our 8 objects. In each case, the Draw
    Call involves preparing the Rendering Pipeline using the Material''s properties
    and asking the GPU to render the given mesh at its current transform. We have
    ensured that each Material is unique by giving them each a unique texture file
    to render. Ergo, each mesh requires a different Render State, and, therefore,
    each of our 8 meshes requires a unique Draw Call.'
  merge: -1
