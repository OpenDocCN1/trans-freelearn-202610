- pgno: 93
  md: 'Note that this means we don''t need to implement `static` methods in a Singleton
    Component class definition. For example, we could simply call `EnemyManagerSingletonComponent.Instance.KillAll()`
    to access the `KillAll()` method.


    Note that it is possible to place an instance of a `SingletonComponent` in a **Hierarchy**
    window since it derives from `MonoBehaviour`. Although, be warned that the `DontDestroyOnLoad()`
    method would never be called, which would prevent the Singleton Component''s `GameObject`
    from persisting when the next Scene is loaded. We will perhaps need to call `DontDestroyOnLoad()`
    in the derived class'' `Awake()` callback to make this work, unless, of course,
    we actually want destructible Singletons. Sometimes it makes sense to allow such
    Singletons to be destroyed between scenes so that it can start fresh each time;
    it all depends on our particular use cases.


    In either case, shutdown of a Singleton Component can be a little convoluted because
    of how Unity tears down scenes. An object''s `OnDestroy()` callback is called
    whenever it is destroyed during runtime. The same method is called during application
    shutdown, whereby every Component on each `GameObject` has its `OnDestroy()` callback
    called by Unity. The same activities take place when we end Play Mode in the Editor,
    thus returning to Edit Mode. However, destruction of objects occurs in a random
    order, and we cannot assume that the `SingletonComponent` object will be the last
    object destroyed.


    Consequently, if any object attempts to do anything with the Singleton Component
    in the middle of their `OnDestroy()` callback, then they may be calling the `SingletonComponent`
    object''s `Instance` property. However, if the Singleton Component has already
    been destroyed prior to this moment, then a new instance of the `SingletonComponent`
    will be created in the middle of application shutdown. This can corrupt our Scene
    files, as instances of our Singleton Components will be left behind in the Scene.
    If this happens, then Unity will throw the following error message:


    "Some objects were not cleaned up when closing the scene. (Did you spawn new GameObjects
    from OnDestroy?)"


    The obvious workaround is to simply never call into a `SingletonComponent` object
    during any `MonoBehaviour` Component''s `OnDestroy()` callback. However, there
    are some legitimate reasons we may wish to do so: most notable is that Singletons
    are often designed to make use of the Observer design pattern. This design pattern
    allows other objects to register/deregister with them for certain tasks, similar
    to how Unity latches onto callback methods, such as `Start()` and `Update()`,
    but in a more strict fashion.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "With the Observer design pattern, objects will typically register with the\
    \ system when they\nare created, will make use of it during runtime, and then\
    \ either deregister from it during\nruntime when they are finished using it or\
    \ deregister during their own shutdown for the\nsake of cleanup. We will see an\
    \ example of this design pattern in the upcoming section, A\nglobal Messaging\
    \ System, but if we imagine a MonoBehaviour making use of such a system,\nthen\
    \ the most convenient place to perform shutdown deregistration would be within\
    \ an\nOnDestroy() callback. Consequently, such objects are likely to run into\
    \ the aforementioned\nproblem, where a new GameObject for the SingletonComponent\
    \ is accidentally created\nduring application shutdown.\n\nTo solve this problem,\
    \ we will need to make three changes. Firstly, we need to add an\nadditional flag\
    \ to the SingletonComponent, which keeps track of its active state and\ndisable\
    \ it at the appropriate times. This includes the Singleton's own destruction,\
    \ as well as\napplication shutdown (OnApplicationQuit() is another useful Unity\
    \ callback for\nMonoBehaviours, which is called during this time):\n\n```\n```\n\
    private bool _alive = true;\nvoid OnDestroy() { _alive = false; }\nvoid OnApplicationQuit()\
    \ { _alive = false; }\n```\n```\n\nSecondly, we should implement a way for external\
    \ objects to verify the Singleton's current\nstate:\n\n```\n```\npublic static\
    \ bool IsAlive {\n get {\n  if (__Instance == null)\n   return false;\n  return\
    \ __Instance._alive;\n }\n}\n```\n```\n\nFinally, any object that attempts to\
    \ call into the Singleton during its own OnDestroy()\nmethod must first verify\
    \ the state using the IsAlive property before calling instance, as\nfollows:\n\
    \n```\n```\npublic class SomeComponent : MonoBehaviour {\n void OnDestroy() {\n\
    \  if (MySingletonComponent.IsAlive) {\n   MySingletonComponent.Instance.SomeMethod();\n\
    \  }\n }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 95
  md: 'This will ensure that nobody attempts to access the Singleton instance during
    destruction. If we don’t follow this rule, then we will run into problems where
    instances of our Singleton object will be left behind in the Scene after returning
    to Edit Mode.


    The irony of the `SingletonComponent` approach is that we are using a `Find()`
    call to determine whether or not one of these `SingletonComponent` objects already
    exists in the Scene before we attempt to assign the `__Instance` reference variable.
    Fortunately, this will only happen when the Singleton Component is first accessed,
    which is usually not a problem if there aren’t too many `GameObjects` in the Scene,
    but it’s possible that the initialization of the Singleton Component may not necessarily
    occur during Scene initialization and can, therefore, cost us a performance spike
    at a bad moment during gameplay when an instance is first acquired and `Find()`
    gets called. The workaround for this is to have some God Class confirm that the
    important Singletons are instantiated during Scene initialization by simply accessing
    the `Instance` property on each one.


    Another downside to this approach is that if we later decide that we want more
    than one of these Singletons executing at once or we wish to separate out its
    behavior to be more modular, then there would be a lot of code that needs to change.


    The final approach we will explore will attempt to solve many of the problems
    revealed by the previous solutions and provide a way to gain all of their benefits,
    by combining ease of implementation, ease of extension, and strict usage that
    also reduces the likelihood of human-error during configuration.


    # # A global Messaging System


    The final suggested approach to solve the problem of interobject communication
    is to implement a global Messaging System that any object can access and send
    messages through to any object that may be interested in listening to that specific
    type of message. Objects can send messages or listen for them (sometimes both!),
    and the responsibility is on the listener to decide what messages they are interested
    in. The message sender can broadcast the message without caring at all who is
    listening, and a message can be sent through the system regardless of the specific
    contents of the message. This approach is by far the most complex and may require
    some effort to implement and maintain, but it is an excellent long-term solution
    to keep our object communication modular, decoupled, and fast as our application
    gets more and more complex.'
  merge: -1
  img_proc: true
- pgno: 96
  md: "The kinds of message we wish to send can take many forms, including data values,\n\
    references, instructions for listeners, and more, but they should all have a common,\
    \ basic\ndefinition that our Messaging System can use to determine what the message\
    \ is and who it\nis intended for.\n\nThe following is a simple class definition\
    \ for a `Message` object:\n\n```\n```\npublic class Message {\n    public string\
    \ type;\n    public Message() { type = this.GetType().Name; }\n}\n```\n```\n\n\
    The `Message` class' constructor caches the message's `type` in a local `string`\
    \ property to be\nused later for cataloging and distribution purposes. Caching\
    \ this value is important, as each\ncall to `GetType().Name` will result in a\
    \ new string being allocated, and we've previously\nlearned that we want to minimize\
    \ this activity as much as possible.\n\nAny custom messages can contain whatever\
    \ superfluous data they wish so long as they\nderive from this base class, which\
    \ will allow it to be sent through our Messaging System.\nTake note that despite\
    \ acquiring the `type` from the object during its base class constructor,\nthe\
    \ `name` property will still contain the name of the derived class, not the base\
    \ class.\n\nMoving on to our `MessagingSystem` class, we should define its features\
    \ by what kind of\nrequirements we need it to fulfill:\n\n+   - It should be globally\
    \ accessible\n+   - Any object (`MonoBehaviour` or not) should be able to register/deregister\
    \ as\n+     listeners to receive specific message types (that is, the Observer\
    \ design pattern)\n+   - Registering objects should provide a method to call when\
    \ the given message is\n+     broadcasted from elsewhere\n+   - The system should\
    \ send the message to all listeners within a reasonable time\n+     frame, but\
    \ not choke on too many requests at once\n\n# ## A globally accessible object\n\
    \nThe first requirement makes the Messaging System an excellent candidate for\
    \ a Singleton\nobject, since we would only ever need one instance of the system.\
    \ Although, it is wise to\nthink long and hard if this is truly the case before\
    \ committing to implementing a Singleton."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'If we later decide that we want multiple instances of this object to exist,
    wish to allow the systems to be created/destroyed during runtime, or even wish
    to create test cases that allow us to fake or create/destroy them in the middle
    of a test, then it can be difficult task to refactor a Singleton out of our codebase.
    This is due to all of the dependencies we will gradually introduce to our code
    as we use the system more and more.


    If we wish to avoid Singletons due to the above drawbacks, then it may be easier
    to create a single instance of the Messaging System during initialization and
    then pass it around from subsystem to subsystem as needed, or we might wish to
    go further and explore the concept of Dependency Injection, which attempts to
    solve problems like these. However, for the sake of simplicity, we will assume
    that a Singleton fits our needs and design our `MessagingSystem` class accordingly.


    # # Registration


    The second and third requirements can be achieved by offering some public methods
    that allow registration with the Messaging System. If we force the listening object
    to provide us a delegate function to call when the message is broadcast, then
    this allows listeners to customize which method is called for which message. We
    can make our codebase very easy to understand if we name the delegate after the
    message it is intended to process.


    In some cases, we might wish to broadcast a general notification message and have
    all listeners do something in response, such as an `Enemy Created` message. Other
    times, we might be sending a message that specifically targets a single listener
    among a group. For example, we might want to send an `Enemy Health Value Changed`
    message that is intended for a specific `Health Bar` object that is attached to
    the enemy that was damaged. However, we may have many health bar objects in the
    Scene, all of which are interested in this message type, but each is only interested
    in hearing health update messages for the enemy they''re providing health information
    for. So, if we implement a way for the system to stop checking after it has been
    handled, then we can probably save a good number of CPU cycles when there are
    many listeners waiting for the same message type.


    The delegate we define should, therefore, provide a way to retrieve the message
    via an argument and return a response that determines whether or not processing
    for the message should stop if and when the listener is done with it. The decision
    on whether to stop processing or not can be achieved by returning a simple Boolean,
    where `true` implies that this listener has handled the message and the processing
    for the message must stop, and `false` implies that this listener has not handled
    the message and the Messaging System should try the next listener.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Here is the definition for the delegate:


    ```csharp

    public delegate bool MessageHandlerDelegate(Message message);

    ```


    Listeners must define a method of this form and pass a delegate reference to the
    Messaging System during registration, thus providing a means for the Messaging
    System to tell the listening object when the message is being broadcast.


    # # Message processing


    The final requirement for our Messaging System is that this object should have
    some kind of timing-based mechanism built in to prevent it from choking on too
    many messages at once. This means that, somewhere in the codebase, we will need
    to make use of `MonoBehaviour` event callbacks to tell our Messaging System to
    perform work during Unity''s `Update()`, essentially enabling it to count time.


    This could be achieved with the Static Class Singleton (which we defined earlier),
    which would require some other `MonoBehaviour`-based God Class to call into it,
    informing it that the Scene has been updated. Alternatively, we can use the Singleton
    Component to achieve the same thing, which has its own means of determining when
    `Update()` is called, and hence handle its workload independently of any God Class.
    The most notable difference between the two approaches is whether or not the system
    is dependent on the control of other objects and the various pros and cons of
    managing a Singleton Component (such that it won''t get destroyed between scenes;
    we don''t want to accidentally recreate it during shutdown).


    The Singleton Component approach is probably the best, since there aren''t too
    many occasions where we wouldn''t want this system acting independently, even
    if much of our game logic depends upon it. For example, even if the game was paused,
    we wouldn''t want the game logic to pause our Messaging System. We still want
    the Messaging System to continue receiving and processing messages so that we
    can, for example, keep UI-related Components communicating with one another while
    the gameplay is in a paused state.


    # # Implementing the Messaging System


    Let''s define our Messaging System by deriving from the `SingletonComponent` class
    and provide a method for objects to register with it:


    ```csharp

    using System.Collections.Generic;

    using UnityEngine;


    public class MessagingSystem : SingletonComponent<MessagingSystem> {

    ```'
