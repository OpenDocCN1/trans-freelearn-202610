- pgno: 134
  md: 'If we click on one of the Draw Call items in the Frame Debugger, there will
    be a section

    labeled "Why this draw call can''t be batched with the previous one". Most of
    the time, the

    explanation text beneath tells us which requirement we failed and (or at least
    the first one it

    detected) which can be useful for debugging batching behavior.


    Be warned that the explanation text that appears is currently a little buggy

    in an early build of Unity 2017 and sometimes the actual reason appears

    when you click on the DynamicBatch item instead. For instance, in the

    preceding Scene example, the explanation given for Draw Mesh Sphere

    (3) was "The material doesn''t have GPU instancing enabled", which is a

    bit confusing. However, looking at the DynamicBatch item gave the real

    reason, that is, "a submesh we are trying to dynamic-batch has more than

    300 vertices".


    # # Mesh scaling


    The documentation suggests that objects should either share a uniform scale or
    each should

    have a unique nonuniform scale in order to be included in dynamic batching. A
    uniform

    scale means that all three components of the scale vector (x, y, and z) are identical
    to each

    other (but not necessarily across meshes), and a nonuniform scale means that at
    least one of

    these values is different from the others, and meshes that fall within these two
    groups will

    be placed in two different batches.


    Let''s explain this via an example. Consider that we have the following four objects:
    A scaled

    at (1, 1, 1), B scaled at (2, 1, 1), C scaled at (2, 2, 1), and D scaled at (2,
    2, 2).

    Objects A and D have uniform scales, because all three components have the same
    value.

    Even though both meshes don''t have exactly the same scale, their scales still
    count as

    uniform, and so they will be placed together in one dynamic batch. Meanwhile,
    B and C

    both have nonuniform scales, because at least one component is different than
    the rest.

    They''re both scaled very differently (C being scaled on the y-axis twice as much
    as B), but

    they both still count as nonuniform, so they will be combined together in a separate
    batch.


    However, be warned that using negative scaling has a strange effect on Dynamic
    Batching.

    Negative scaling is often a quick way to mirror a mesh in our Scene, which can
    save us from

    having to create and import a completely different mesh for something that''s
    only flipped

    on one axis. This trick is commonly used for pairs of doors, or just to make a
    Scene look

    more varied. However, if we only negatively scale the mesh on one or three axes,
    then it

    will be placed into a different Dynamic Batch than meshes negatively scaled on
    zero or two

    axes. It does not matter which of the three values (x, y, or z) are negative,
    only whether the

    total number of negative values is odd or even.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Dynamic Batching summary


    Dynamic Batching is a very useful tool when we want to render very large groups
    of simple meshes. The design of the system makes it ideal to use when we''re making
    use of large numbers of simple meshes, which are nearly identical in appearance.
    Possible situations to apply Dynamic Batching could be as follows:


    +   • A large forest filled with rocks, trees, and bushes

    +   • A building, factory, or space station with many simple, common elements
    (computers, corridor pieces, pipes, and so on)

    +   • A game featuring many dynamic, non-animated objects with simple geometry
    and particle effects (a game such as Geometry Wars springs to mind)


    Another strange by-product of this batch-splitting behavior is how the rendering
    order of the objects can determine what gets batched together. If the previous
    object would have appeared in a different batch group than the current one, then
    it cannot be batched. Again, this is best explained by the following example.
    Consider that we have four objects again: V scaled at (1, 1, 1), W scaled at (-1,
    1, 1), X scaled at (-1, -1, 1), Y scaled at (-1, -1, -1), and finally Z scaled
    similarly to V at (1, 1, 1). Objects V and Z share a common uniform scale, so
    we might expect them to be batched together. However, if all of these objects
    were rendered to the Scene in the above order, then object V will be rendered,
    and Unity will test to check whether objects W and V could share a batch. They
    cannot do so, because of object W''s odd negative scaling, so no batching takes
    place. Unity will then compare object X with object W to check whether they can
    be batched, which they cannot because W has an odd negative scaling and X has
    even negative scaling. The next comparisons between objects W-Y and Y-Z fail for
    the same reason. The end result is that all five objects will be rendered with
    five separate Draw Calls, and there was no opportunity given to combine objects
    V and Z. Note that this weird effect only comes into play when negative scaling
    is used. If all scaling differences are uniform versus nonuniform, then Unity
    should be capable of batching the objects appropriately.


    Presumably, this is all a by-product of the algorithm used to detect valid batchable
    groups, since mirroring a mesh in two dimensions is mathematically equivalent
    to rotating the mesh about both of the same axes 180 degrees, while there is no
    rotational equivalent to mirroring a mesh on one or three axes. Thus, the behavior
    we observe is perhaps just the Dynamic Batching system automatically transforming
    the object for us, although this isn''t completely clear. Regardless, hopefully
    this prepares us for many of the weird situations we might run in to when it comes
    to generating dynamic batches.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'If the only requirement preventing two objects from being Dynamically Batched
    together is

    the fact that they use different texture files, be aware that it only takes a
    bit of development

    time and effort to combine textures, and regenerate mesh UVs so that they can
    be

    Dynamically Batched together (commonly known as *Atlasing*). This may cost us
    in texture

    quality or the overall size of a texture file (which can have drawbacks we will
    understand

    once we dive into the topic of GPU Memory Bandwidth in *Chapter 6, Dynamic Graphics*),

    but it is worth considering.


    Perhaps the only situation where Dynamic Batching may be a detriment on performance
    is

    if we were to set up a Scene with hundreds of simple objects, where only a few
    objects are

    put into each batch. In these cases, the overhead cost of detecting and generating
    so many

    small batches might cost more time than we''d save by just making a separate Draw
    Call for

    each mesh. Even still, this is unlikely.


    If anything, we''re far more likely to inflict performance losses on our application
    by simply

    assuming that Dynamic Batching is taking place, when we''ve actually forgotten
    one of the

    essential requirements. We can accidentally break the vertex limit by pushing
    a new version

    of a mesh, and in the process of Unity converting a raw Object (with the *.obj*
    extension) file

    into its own internal format, it generates more vertex attributes than we expected.
    We could

    also exceed it by tweaking some Shader code or adding additional passes without
    realizing

    it would disqualify it from Dynamic Batching. We might even set up the object
    to enable

    shadows or Light Probes, which breaks another requirement.


    There will be no warning when these accidents occur, save for the number of Draw
    Calls

    increasing after changes are made and causing performance to degrade further and
    further.

    Maintaining a healthy amount of Dynamic Batching in our Scenes requires constant

    vigilance in checking our Draw Call count and looking at Frame Debugger data to
    make

    sure that we didn''t accidentally disqualify objects from Dynamic Batching during
    our latest

    changes. However, as always, we only need to worry about our Draw Call performance
    if

    we''ve already proven that it''s causing a performance bottleneck.


    Ultimately, every situation is unique, so it is worth experimenting with our mesh
    data,

    Materials, and Shaders to determine what can and cannot be dynamically batched,
    and

    performing some testing in our Scene from time to time to ensure that the number
    of Draw

    Calls we''re using remains reasonable.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# # Static Batching


    Unity offers a second batching mechanism through Static Batching. This batching
    feature is similar to Dynamic Batching in a couple of ways, such as which objects
    are batched is determined at runtime based on what''s visible to the Camera, and
    the contents of these batches will vary from frame to frame. However, there is
    one very important difference: it only works on objects that are marked **Static**,
    hence the name _Static Batching_.


    The Static Batching system has its own set of requirements:


    +   - As the name implies, the meshes must be flagged as **Static** (specifically,
    **Batching Static**)

    +   - Additional memory must be set aside for each mesh being statically batched

    +   - There is an upper limit on the number of vertices that can be combined in
    a static batch that varies per Graphics API and platform, which is around 32k-64k
    vertices (check out the documentation/aforementioned blog post for specifics)

    +   - The mesh instances can come from any source mesh, but they must share the
    same Material reference


    Let''s cover some of these requirements in more detail.


    # # The Static flag


    Static Batching can only be applied to objects with the **static** flag enabled
    or, more specifically, the **Batching Static** subflag (these subflags are known
    as **StaticEditorFlags**). Clicking on the small down-pointing arrow next to the
    **Static** option for a `GameObject` will reveal a dropdown of the **StaticEditorFlags**,
    which can alter the object''s behavior for various **Static** processes.


    An obvious side effect of this is that the object''s transform cannot be changed,
    and, hence, any object wishing to make use of Static Batching cannot be moved,
    rotated, or scaled in any way.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # Memory requirements


    The additional memory requirement for Static Batching will vary, depending on
    the amount

    of replication occurring within the batched meshes. Static Batching works by copying
    the

    data for all flagged and visible meshes into a single, large mesh data buffer,
    and passing it

    into the Rendering Pipeline through a single Draw Call, while ignoring the original
    mesh. If

    all of the meshes being statically batched are unique, then this would cost us
    no additional

    memory usage compared to rendering the objects normally, as the same amount of
    memory

    space is required to store the meshes.


    However, since the data is effectively copied, these statically batched duplicates
    cost us

    additional memory equal to the number of meshes, multiplied by the size of the
    original

    mesh. Ordinarily, rendering one, ten, or a million clones of the same object costs
    us the

    same amount of memory, because they''re all referencing the same mesh data. The
    only

    difference between objects in this case is the transform of each object. However,
    because

    Static Batching needs to copy the data into a large buffer, this referencing is
    lost, since each

    duplicate of the original mesh is copied into the buffer with a unique set of
    data with a

    hardcoded transform baked into the vertex positions.


    Therefore, using Static Batching to render 1,000 identical tree objects will cost
    us 1,000 times

    more memory than rendering the same trees without Static Batching. This causes
    some

    significant memory consumption and performance issues if Static Batching is not
    used

    wisely.


    # # Material references


    We are already aware that sharing Material references is a means of reducing Render
    State

    changes, so this requirement is fairly obvious. In addition, sometimes, we statically
    batch

    meshes that require multiple Materials. In this case, all meshes using a different
    Material

    will be grouped together in their own static batch and for each unique Material
    being used.


    The downside to this requirement is that, at best, Static Batching can only render
    all of the

    static meshes using a number of Draw Calls equal to the number of Materials they
    need.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # Static Batching caveats


    The Static Batching system has some additional drawbacks. Owing to how it approaches
    the batching solution, by combining meshes into a single greater mesh, the Static
    Batching system has a few caveats that we need to be aware of. These concerns
    range from minor inconveniences to major drawbacks, depending on the Scene:


    +   - Draw Call savings are not immediately visible from the **Stats** window
    until runtime

    +   - Objects marked **Batching Static** introduced in the Scene at runtime will
    not be automatically included in Static Batching


    Let''s explore these problems in a little more detail.


    # # Edit Mode debugging of Static Batching


    Trying to determine the overall effect that Static Batching will have on our Scene
    can be a little tricky since nothing is being Statically Batched while in **Edit
    Mode**. All of the magic happens during runtime, which can make it difficult to
    determine what benefits Static Batching would provide without manual testing.
    We should use the Frame Debugger to verify that our static batches are being properly
    generated, and that they contain the expected objects.


    This can be especially problematic if we leave implementing this feature until
    late in the project lifecycle, where we can spend a lot of time launching, tweaking,
    and relaunching our Scene to ensure that we''re getting the Draw Call savings
    we''re expecting. Consequently, it is best to start working on Static Batching
    optimization early in the process of building a new Scene.


    It goes without saying that static batch creation work is not completely trivial,
    and it may also massively inflate Scene initialization time if there are many
    batches to create and/or many large objects to batch.


    # # Instantiating static meshes at runtime


    Any new objects we add into the Scene at runtime will not be automatically combined
    into any existing batch by the Static Batching system, even if they were marked
    as **Batching Static**. To do so would cause an enormous runtime overhead between
    recalculating the mesh and synchronizing with the Rendering Pipeline, so Unity
    does not even attempt to do it automatically.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# # Static Batching summary


    Static Batching is a powerful, but dangerous tool. If we don''t use it wisely,
    we can very easily inflict enormous performance losses via memory consumption
    (potentially leading to application crashes) and rendering costs on our application.
    It also takes a good amount of manual tweaking and configuration to ensure that
    batches are being properly generated, and that we aren''t accidentally introducing
    any unintended side effects of using various **Static** flags. However, it does
    have a significant advantage in that it can be used on meshes of different shapes
    and enormous sizes, which Dynamic Batching cannot provide.


    For the most part, we should try to keep any meshes we want to be statically batched
    present in the original Scene file. However, if dynamic instantiation is necessary,
    or we are making use of additive Scene loading, then we can control static batch
    eligibility with the `StaticBatchUtility.Combine()` method. This utility method
    has two overloads: either we provide a root `GameObject`, in which case all child
    `GameObjects` with meshes will be turned into new static batch groups (multiple
    could be created if they share multiple Materials) or we provide a list of `GameObjects`
    and a root `GameObject`, and it will automatically attach them as children to
    the root and generate new static batch groups in the same manner.


    We should profile our usage of this function, as it can be quite an expensive
    operation if there are many vertices to combine. It will also not combine the
    given meshes with any preexisting statically batched groups, even if they share
    the same Material. So we will not be able to save Draw Calls by instantiating
    or additively loading **Static** meshes that use the same Material as other statically
    batched groups already present in the Scene (it can only combine with meshes it
    was grouped with in the `Combine()` call).


    Note that if any of the `GameObjects` we batch with the `StaticBatchUtility.Combine()`
    method are not marked as **Static** before batching, the `GameObjects` will remain
    non-**Static**, but the mesh itself will be **Static**. This means that we could
    accidentally move the `GameObject`, its `Collider` Component, and any other important
    objects, but the mesh will remain in the same location. Be careful about accidentally
    mixing **Static** and non-**Static** states in statically batched objects.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_140_0.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # Summary


    It is clear that the Dynamic Batching and Static Batching systems are not a silver
    bullet. We cannot blindly apply them to any given Scene and expect improvements.
    If our application and Scene happen to fit a particular set of parameters, then
    these methods are very effective at reducing CPU load and rendering bottlenecks.
    However, if not, then some additional work is required to prepare our Scene to
    meet batching feature requirements. Ultimately, only a good understanding of these
    batching systems and how they function can help us determine where and when this
    feature can be applied, and, hopefully, this chapter has given us all of the information
    we need to make informed decisions.


    You will learn more about the Rendering Pipeline and performance improvement techniques
    in `Chapter 6, Dynamic Graphics`. Until then, let’s move onto a different topic
    and look into some of the more subtle performance improvements that we can achieve
    through managing our art assets in intelligent ways.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# # 4 Kickstart Your Art


    Art is a very subjective area, dominated by personal opinion and preference. It
    can be difficult to say whether, and why, one piece of art is better than the
    other, and it’s likely that we won’t be able to find complete consensus on our
    opinions. The technical aspects behind art assets that support a game’s artistry
    can also be very subjective. There are multiple workarounds that can be implemented
    to improve performance, but these tend to result in a loss of quality for the
    sake of speed. If we’re trying to reach peak performance then it’s important that
    we consult with our team members whenever we decide to make any changes to our
    art assets, as it is primarily a balancing act, which can be an art form in itself.


    Whether we’re trying to minimize our runtime memory footprint, keeping the smallest
    possible executable size, maximizing loading speed, or maintaining consistency
    in frame rate, there are plenty of options to explore. There are some methods
    that are clearly always ideal, but most require a little more care and forethought
    before being adopted, as they would result in reduced quality or increase the
    chances of developing bottlenecks in other subsystems.


    In this chapter, we will explore how to improve performance for the following
    asset types:


    +   - Audio files

    +   - Texture files

    +   - Mesh and animation files

    +   - Asset Bundles and Resources


    In each case, we will investigate how Unity stores, loads, and manipulates these
    assets both during application build time and runtime. We will also examine our
    options in the event of performance issues, and what we can do to avoid behavior
    that might generate performance bottlenecks.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# # Audio


    Unity, as a framework, can be used to build anything from small applications that
    require only a handful of sound effects and a single background track to huge
    role playing games that need millions of lines of spoken dialog, music tracks,
    and ambient sound effects. Regardless of the actual scope of the application,
    audio files are often a large contributor to the application size after it is
    built (sometimes called its _disk footprint_). Moreover, many developers are surprised
    to find that runtime audio processing can turn into a significant source of CPU
    and memory consumption.


    Audio is often neglected on both sides of the gaming industry; developers tend
    not to commit many resources to it until the last minute, whereas users rarely
    draw their attention to it. Nobody notices when audio is handled well, but we
    all know what bad audio sounds like--it''s instantly recognizable, jarring, and
    guaranteed to draw unwanted attention. This makes it crucial not to sacrifice
    too much audio clarity in the name of performance.


    Audio bottlenecks can come from a variety of sources. Excessive compression, too
    much audio manipulation, too many active Audio Components, inefficient memory
    storage methods, and access speeds are all ways to invite poor memory and CPU
    performance. However, with a little effort and understanding, all it takes is
    a few tweaks here and there to save us from a user experience disaster.


    # # Importing audio files


    When we select an imported audio file in the **Project** window, the **Inspector**
    window will reveal multiple import settings. These settings dictate everything
    from loading behavior, compression behavior, quality, sample rate, and (in later
    versions of Unity) whether to support ambisonic audio (multichannel audio, which
    combines tracks via spherical harmonics in order to create more realistic audio
    experiences).


    Many of the audio import options can be configured on a per-platform basis, allowing
    us to customize behavior between different target platforms.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# # Loading audio files


    The following are the three settings that dictate the manner in which an audio
    file is loaded:


    +   • Preload Audio Data

    +   • Load In Background

    +   • Load Type


    Our audio files are initially packaged as binary data files that are bundled with
    our

    application, which reside on the hard disk of the device (although in some cases
    they

    downloaded from somewhere on the internet). Loading audio data simply means pulling
    it

    into main memory (RAM) so that it can be later processed by audio decoders, which
    then

    convert the data into audio signals to our headphones, or speakers. However, how
    loading

    happens will vary enormously based on the previous three settings. The first

    setting, Preload Audio Data determines whether audio data will be automatically
    loaded

    during Scene initialization, or loaded at a later time. When loading of audio
    data does

    occur, the second setting, Load In Background, determines whether this activity
    blocks the

    main thread until it is finished, or loads it asynchronously in the background.
    Finally,

    the Load Type setting defines what kind of data gets pulled into memory and how
    much

    data gets pulled at a time. All three of these settings can have a dramatically
    negative effect

    on performance if they are not used wisely.


    The typical use case of an audio file is to assign it to the audioClip property
    of an

    AudioSource object, which will wrap it in an AudioClip object. We can then trigger

    playback via AudioSource.Play() or AudioSource.PlayOneShot(). Each Audio Clip

    assigned in this way would be loaded into memory during Scene initialization since
    the

    Scene contains immediate references to these files, which it must resolve before
    they are

    needed. This is the default case when Preload Audio Data is enabled.


    Disabling Preload Audio Data tells the Unity Engine to skip audio file asset loading
    during

    Scene initialization, which defers loading activity to the first moment it is
    needed, in other

    words, when Play() or PlayOneShot() are called. Disabling this option will speed
    up

    Scene initialization, but it also means that the first time we play the file,
    the CPU will need

    to immediately access the disk, retrieve the file, load it into memory, decompress
    it, and

    play it. This is a synchronous operation and will block the main thread until
    it is completed.

    We can prove this with a simple test:


    ```

    public class PreloadAudioDataTest : MonoBehaviour {

    [SerializeField] AudioSource _source;


    void Update() {

    if (Input.GetKeyDown(KeyCode.Space)) {

    using (new CustomTimer("Time to play audio file", 1)) {


