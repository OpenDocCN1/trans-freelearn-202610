- pgno: 275
  md: '# # Masterful Memory Management


    Memory efficiency is an important element of performance optimization. It’s possible
    for

    games of limited scope, such as hobby projects and prototypes, to get away with
    ignoring

    memory management; they will tend to waste a lot of resources, and potentially
    leak

    memory, but this won’t be a problem if we limit its exposure to friends and coworkers.

    However, anything we want to release professionally needs to take this subject
    seriously.

    Unnecessary memory allocations lead to poor user experience due to excessive garbage

    collection (costing precious CPU time), and memory leaks which will lead to crashes.
    None

    of these situations are acceptable in modern game releases.


    Using memory efficiently with Unity requires a solid understanding of the underlying

    Unity Engine, Mono platform, the C# language. Also, if we’re making use of the
    new

    IL2CPP scripting backend then it would be wise to become familiar with its inner
    workings.

    This can be a bit of an intimidating place for some developers since many pick
    Unity3D for

    their game development solution primarily to avoid the kind of low-level work
    that comes

    from Engine development and memory management. We’d prefer to focus on higher-level

    concerns related to gameplay implementation, level design, and art asset management,
    but,

    unfortunately, modern computer systems are complex tools and ignoring low-level

    concerns for too long could potentially lead to disaster.


    Understanding what is happening with memory allocations and C# language features,
    how

    they interact with the Mono platform and how Mono interacts with the underlying
    Unity

    Engine are absolutely paramount to making high-quality, efficient script code.
    So, in this

    chapter, you will learn about all of the nuts and bolts of the underlying Unity
    Engine: the

    Mono platform, the C# language, IL2CPP, and the .NET Framework.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Fortunately, it is not necessary to become absolute masters of the C# language
    to use it effectively. This chapter will boil these complex subjects down to a
    more digestible form and is split into the following subjects:


    +   - The Mono platform:

    +     - Native and Managed Memory Domains

    +     - Garbage collection

    +     - Memory Fragmentation

    +   - IL2CPP

    +   - How to profile memory issues

    +   - Various memory-related performance enhancements:

    +     - Minimizing garbage collection

    +     - Using Value types and Reference types properly

    +     - Using strings responsibly

    +     - A multitude of potential enhancements related to the Unity Engine

    +     - Object and Prefab Pooling


    # # The Mono platform


    Mono is a magical sauce, mixed into the Unity recipe, which gives it a lot of
    its cross-platform capability. Mono is an open source project that built its own
    platform of libraries based on the API, specifications, and tools from Microsoft''s
    .NET Framework. Essentially, it is an open source recreation of the .NET Library,
    was accomplished with little-to-no access to the original source code, and is
    fully compatible with the original library from Microsoft.


    The goal of the Mono project is to provide cross-platform development through
    a framework that allows code, written in a common programming language, to run
    against many different hardware platforms, including Linux, MacOS, Windows, ARM,
    PowerPC, and more. Mono even supports many different programming languages. Any
    language that can be compiled into .NET''s **Common Intermediate Language (CIL)**
    is sufficient to integrate with the Mono platform. This includes C# itself, but
    also several other languages such as F#, Java, Visual Basic .NET, PythonNet, and
    IronPython. Of course, the only three exposed to us through Unity are C#, Boo,
    and UnityScript.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '![](img/da79484c9b30dc915216dbc5454a9bbf_277_0.png)


    Note that the Boo language has already been deprecated in previous versions of
    Unity, and the UnityScript language will start becoming phased out in future versions.
    The blog post at https://blogs.unity3d.com/2017/08/11/unityscripts-long-ride-off-into-the-sunset/
    explains the reasoning behind these changes.


    A common misconception about the Unity Engine is that it is built on top of the
    Mono platform. This is untrue, as its Mono-based layer does not handle many important
    game tasks such as audio, rendering, physics and keeping track of time. Unity
    Technologies built a Native C++ backend for the sake of speed and allows its users
    control of this Game Engine through Mono as a scripting interface. As such, Mono
    is merely an ingredient of the underlying Unity Engine. This is equivalent to
    many other Game Engines, which run C++ under the hood, handling important tasks
    such as rendering, animation, and resource management, while providing a higher-level
    scripting language for Gameplay logic to be implemented. As such, the Mono platform
    was chosen by Unity Technologies to provide this feature.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_277_1.png)


    Native Code is common vernacular for code that is written specifically for the
    given platform. For instance, writing code to create a window object or interface
    with networking subsystems in Windows would be completely different to code performing
    the tasks for a Mac, Unix, Playstation 4, XBox One, and so on.


    Scripting languages typically abstract away complex memory management through
    automatic garbage collection and provide various safety features, which simplify
    the act of programming at the expense of runtime overhead. Some scripting languages
    can also be interpreted at runtime, meaning that they don''t need to be compiled
    before execution. The raw instructions are converted dynamically into Machine
    Code and executed the moment they are read during runtime; of course, this often
    makes the code relatively slow. The last feature, and probably the most important
    one, is that they allow simpler syntax of programming commands. This usually improves
    development workflow immensely, as team members without much experience using
    languages such as C++ can still contribute to the code base. This enables them
    to implement things such as Gameplay logic in a simpler format at the expense
    of a certain amount of control and runtime execution speed.


    Note that such languages are often called Managed Languages, which feature Managed
    Code. Technically, this was a term coined by Microsoft to refer to any source
    code that must run inside their Common Language Runtime (CLR) environment, as
    opposed to code that is compiled and run Natively through the target OS.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'However, because of the prevalence and common features that exist between the
    CLR and other languages that feature their own similarly designed runtime environments
    (such as Java), the term Managed has since been hijacked. It tends to be used
    to refer to any language or code that depends on its own runtime environment and
    that may, or may not, include automatic garbage collection. For the rest of this
    chapter, we will adopt this definition and use the term Managed to refer to code
    that both depends on a separate runtime environment in order to execute and is
    being monitored by automatic garbage collection.


    The runtime performance cost of Managed Languages is always greater than the equivalent
    Native Code, but it is becoming less significant every year. This is partly due
    to gradual optimizations in tools and runtime environments, and partly due to
    the computing power of the average device gradually becoming greater. Although,
    the main point of controversy with using Managed Languages still remains their
    automatic memory management. Managing memory manually can be a complex task that
    can take many years of difficult debugging to be proficient at, but many developers
    feel that Managed Languages solve this problem in ways that are too unpredictable,
    risking too much product quality. Such developers might cite that Managed Code
    will never reach the same level of performance as Native Code, and hence it is
    foolhardy to build high-performance applications with them.


    This is true to an extent, as Managed Languages invariably inflict runtime overheads,
    and we lose partial control over runtime memory allocations. This would be a deal-breaker
    for high-performance server architecture; however, for game development, it becomes
    a balancing act since not all resource usage will necessarily result in a bottleneck,
    and the best games aren''t necessarily the ones that use every single byte to
    their fullest potential. For example, imagine a user interface that refreshes
    in 30 microseconds via Native Code versus 60 microseconds in Managed Code due
    to an extra 100 percent overhead (an extreme example). The Managed Code version
    is still fast enough such that the user will never be able to notice the difference,
    so is there really any harm in using Managed Code for such a task?


    In reality, at least for game development, working with Managed Languages often
    just means that developers have a unique set of concerns to worry about compared
    to Native Code developers. As such, choosing to use a Managed Language for game
    development is partly a matter of preference and partly a compromise of control
    over development speed.


    Let''s revisit a topic we touched upon in earlier chapters, but didn''t quite
    flesh out: the concept of Memory Domains in the Unity Engine.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# # Memory Domains


    Memory space within the Unity Engine can be essentially split into three different
    Memory Domains. Each Domain stores different types of data and takes care of a
    very different set of tasks.


    The first Memory Domain--the Managed Domain--should be very familiar. This Domain
    is where the Mono platform does its work, where any `MonoBehaviour` scripts and
    custom C# classes we write will be instantiated at runtime, and so we will interact
    with this Domain very explicitly through any C# code we write. It is called the
    _Managed Domain_ because this memory space is automatically managed by a Garbage
    Collector.


    The second Domain--the Native Domain--is more subtle since we only interact with
    it indirectly. Unity has an underlying Native Code foundation, which is written
    in C++ and compiled into our application differently, depending on which platform
    is being targeted. This Domain takes care of allocating internal memory space
    for things such as asset data (for example, textures, audio files, and meshes)
    and memory space for various subsystems such as the Rendering Pipeline, Physics
    System, and User Input System. Finally, it includes partial Native _representations_
    of important Gameplay objects such as `GameObjects` and Components so that they
    can interact with these internal systems. This is where a lot of built-in Unity
    classes keep their data, such as the `Transform` and `Rigidbody` Components.


    The Managed Domain also includes wrappers for the very same object representations
    that are stored within the Native Domain. As a result, when we interact with Components
    such as `Transform`, most instructions will ask Unity to dive into its Native
    Code, generate the result there, and then copy it back to the Managed Domain for
    us. This is where the _Native-Managed Bridge_ between the Managed Domain and Native
    Domains derives from, which was briefly mentioned in previous chapters. When both
    Domains have their own representations for the same entity, crossing the bridge
    between them requires a memory context-switch that can potentially inflict some
    fairly significant performance hits on our game. Obviously, crossing back and
    forth across this bridge should be minimized as much as possible due to the overhead
    involved. We covered several techniques for this in _Chapter 2, Scripting Strategies_.


    The third and final Memory Domains are those of external libraries, such as DirectX
    and OpenGL libraries, as well as any custom libraries and plugins we include in
    our project. Referencing these libraries from our C# code will cause a similar
    memory context switch and subsequent cost.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Memory in most modern Operating Systems (OS) splits runtime memory space into
    two categories: the stack and the heap. The stack is a special reserved space
    in memory, dedicated to small, short-lived data values, which are automatically
    deallocated the moment they go out of scope, hence why it is called the stack.
    It literally operates like a stack data structure, pushing and popping data from
    the top. The stack contains any local variables we declare and handles the loading
    and unloading of functions as they''re called. These function calls expand and
    contract through what is known as the call stack. When the call stack is done
    with the current function, it jumps back to the previous point on the call stack
    and continues from where it left off. The start of the previous memory allocation
    is always known, and there''s no reason to perform any clean-up operations since
    any new allocations can simply overwrite the old data. Hence, the stack is relatively
    quick and efficient.


    The total stack size is usually very small, usually on the order of Megabytes.
    It''s possible to cause a stack overflow by allocating more space than the stack
    can support. This can occur during exceptionally large call stacks (for example,
    an infinite loop) or having a large number of local variables, but in most cases,
    causing a stack overflow is rarely a concern despite its relatively small size.


    The heap represents all remaining memory space, and it is used for the overwhelming
    majority of memory allocation. Since we want most of the memory allocated to persist
    longer than the current function call, we couldn''t allocate it on the stack since
    it would just get overwritten when the current function ends. So, instead, whenever
    a data type is too big to fit in the stack or must persist outside the function
    it was declared in, it is allocated on the heap. There''s nothing physically different
    between the stack and the heap; they''re both just memory spaces containing bytes
    of data that exist in RAM, which have been requested and set aside for us by the
    OS. The only difference is in when, where, and how they are used.


    In Native Code, such as code written in languages such as C++, these memory allocations
    are handled very manually in that we are responsible for ensuring that all pieces
    of memory we allocate are properly and explicitly deallocated when they are no
    longer needed. If this is not done properly, then we could easily and accidentally
    introduce memory leaks since we are likely to keep allocating more and more memory
    space from RAM that is never cleaned up until there is no more space to allocate,
    and the application crashes.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Meanwhile, in Managed Languages, this process is automated through the Garbage
    Collector. During initialization of our Unity app, the Mono platform will request
    a given chunk of memory from the OS and use it to generate a heap memory space
    that our C# code can use (often known as the Managed Heap). This heap space starts
    off fairly small, less than 1 Megabyte, but will grow as new blocks of memory
    are needed by our script code. This space can also shrink by releasing it back
    to the OS if Unity determines that it''s no longer needed.


    # # Garbage collection


    The Garbage Collector (hereafter referred to as the GC) has an important job,
    which is to ensure that we don''t use more Managed Heap memory than we need, and
    that memory that is no longer needed will be automatically deallocated. For instance,
    if we create a GameObject, and then later destroy it, the GC will flag the memory
    space used by the GameObject for eventual deallocation later. This is not an immediate
    process, as the GC only deallocates memory when necessary.


    When a new memory request is made, and there is enough empty space in the Managed
    Heap to satisfy the request, the GC simply allocates the new space and hands it
    over to the caller. However, if the Managed Heap does not have room for it, then
    the GC will need to scan all the existing memory allocations for anything that
    is no longer being used and cleans them up first. It will only expand the current
    heap space as a last resort.


    The GC in the version of Mono that Unity uses is a type of Tracing Garbage Collector,
    which uses a Mark-and-Sweep strategy. This algorithm works in two phases: each
    allocated object is tracked with an additional bit. This flags whether the object
    has been marked or not. These flags start off set to false to indicate that it
    has not yet been marked.


    When the collection process begins, it marks all objects that are still reachable
    to the program by setting their flags to true. Either the reachable object is
    a direct reference, such as static or local variables on the stack, or it is an
    indirect reference through the fields (member variables) of other directly or
    indirectly accessible objects. In essence, it is gathering a set of objects that
    are still referenceable to our application. Everything that is not still referenceable
    would be effectively invisible to our application and can be deallocated by the
    GC.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The second phase involves iterating through this catalog of references (which
    the GC will have kept track of throughout the lifetime of the application) and
    determining whether or not it should be deallocated based on its _marked_ status.
    If the object is marked, then it is still being referenced by something else,
    and so the GC leaves it alone. However, if it is not marked, then it is a candidate
    for deallocation. During this phase, all marked objects are skipped over, but
    not before setting their flag back to `false` for the first phase of the next
    garbage collection scan.


    In essence, the GC maintains a list of all objects in memory, while our application
    maintains a separate list containing only a portion of them. Whenever our application
    is done with an object, it simply _forgets_ it exists, removing it from its list.
    Hence, the list of objects that can be safely deallocated would be the difference
    between the GC’s list, and our application’s list.


    Once the second phase ends, all unmarked objects are deallocated to free space,
    and then the initial request to create the object is revisited. If the GC has
    freed up enough space for the object, then it is allocated within that newly-freed
    space and returned to the caller. However, if it is not, then we hit the last-resort
    situation and must expand the Managed Heap by requesting it from the OS, at which
    point the object space can finally be allocated and returned to the caller.


    In an ideal world, where we only keep allocating and deallocating objects but
    only a finite number of them exist at once, the heap would maintain a roughly
    constant size because there’s always enough space to fit the new objects we need.
    However, all objects in an application are rarely deallocated in the same order
    they were allocated and even more rarely do they all have the same size in memory.
    This leads to _Memory Fragmentation_.


    # # Memory Fragmentation


    Fragmentation occurs when objects of different sizes are allocated and deallocated
    in alternating orders and if lots of small objects are deallocated, following
    by lots of large objects being allocated.


    This is best explained through an example. The following shows four steps we take
    in allocating and deallocating memory in a typical heap memory space:'
  merge: -1
  img_proc: true
- pgno: 283
  md: '![](img/da79484c9b30dc915216dbc5454a9bbf_283_0.png)


    The memory allocation takes place, as follows:


    1. We start with an empty heap space.

    2. We then allocate four objects on the heap, **A**, **B**, **C**, and **D**,
    each 64-bytes in size.

    3. At a later time, we deallocate two of the objects, **A** and **C**, freeing
    up 128 bytes.

    4. We then try to allocate a new object that is 128-bytes large.


    Deallocating objects **A** and **C** technically frees 128-bytes worth of space,
    but since the objects were not contiguous (adjoining neighbors) in memory, we
    cannot allocate an object larger than both individual spaces there. New memory
    allocations must always be contiguous in memory; therefore, the new object must
    be allocated in the next available contiguous 128-byte space available in the
    Managed Heap. We now have two empty 64-byte holes in our memory space, which will
    never be reused unless we allocate objects sized 64-bytes or smaller.


    Over long periods of time, our heap memory can become riddled with more, smaller
    empty spaces such as these, as objects of different sizes are deallocated, and
    then the system later tries to allocate new objects within the smallest available
    space that it can fit within, leaving some small remainder that becomes harder
    to fill. In the absence of background techniques that automatically clean up this
    Fragmentation, this effect would occur in literally any memory space--RAM, heap
    space, and even hard drives--which are just larger, slower, and more permanent
    memory storage areas (this is why it’s a good idea to defragment our hard drives
    from time to time).'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Memory Fragmentation causes two problems. Firstly, it effectively reduces the
    total usable memory space for new objects over long periods of time, depending
    on the frequency of allocations and deallocations. This is likely to result in
    the GC having to expand the heap to make room for new allocations. Secondly, it
    makes new allocations take longer to resolve due to the extra time it takes to
    find a new memory space large enough to fit the object.


    This becomes important when new memory allocations are made in a heap since the
    location of available space becomes just as important as how much free space is
    available. There is no way to split an object across partial memory locations,
    so the GC must either continue searching until it finds a large enough space or
    the entire heap size must be increased to fit the new object, costing even more
    time after it just spent a bunch of time doing an exhaustive search.


    # # Garbage collection at runtime


    So, in a worst-case scenario, when a new memory allocation is being requested
    by our game, the CPU would have to spend cycles completing the following tasks
    before the allocation is finally completed:


    +   1. Verify that there is enough contiguous space for the new object.

    +   2. If there is not enough space, iterate through all known direct and indirect
    references, marking everything they connect to as reachable.

    +   3. Iterate through all of these references again, flagging unmarked objects
    for deallocation.

    +   4. Iterate through all flagged objects to check whether deallocating some
    of them would create enough contiguous space for the new object.

    +   5. If not, request a new memory block from the OS in order to expand the heap.

    +   6. Allocate the new object at the front of the newly allocated block and return
    it to the caller.


    This can be a lot of work for the CPU to handle, particularly if this new memory
    allocation is an important object such as a Particle Effect, a new character entering
    the Scene, or a cutscene transition,. Users are extremely likely to note moments
    where the GC is freezing gameplay to handle this extreme case. To make matters
    worse, the garbage collection workload scales poorly as the allocated heap space
    grows since sweeping through a few Megabytes of space will be significantly faster
    than scanning several Gigabytes of space.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'All of this makes it absolutely critical to control our heap space intelligently.
    The lazier our memory usage tactics are, the worse the GC will behave in an almost
    exponential fashion, as we are more and more likely to hit this worst-case scenario.
    So, it''s a little ironic that despite the efforts of Managed Languages to make
    the memory management problem easier, Managed Language developers still find themselves
    being just as, if not more, concerned with memory consumption than developers
    of Native applications. The main difference is in the types of problems they''re
    trying to solve.


    # # Threaded garbage collection


    The GC runs on two separate threads: the main thread and what is called the _Finalizer
    Thread_. When the GC is invoked, it will run on the main thread and flag heap
    memory blocks for future deallocation. This does not happen immediately. The Finalizer
    Thread, controlled by Mono, can have a delay of several seconds before the memory
    is finally freed and available for reallocation.


    We can observe this behavior in the **Total Allocated** block (the green line,
    with apologies to that 5 percent of the population with deuteranopia/deuteranomaly)
    of the **Memory Area** within the **Profiler** window. It can take several seconds
    for the total allocated value to drop after a garbage collection has occurred.
    Owing to this delay, we should not rely on memory being available the moment it
    has been deallocated, and as such, we should never waste time trying to eke out
    every last byte of memory that we believe should be available. We must ensure
    that there is always some kind of buffer zone available for future allocations.


    Blocks that have been freed by the GC may sometimes be given back to the OS after
    some time, which would reduce the reserved space consumed by the heap and allow
    the memory to be allocated for something else, such as another application. However,
    this is very unpredictable and depends on the platform being targeted, so we shouldn''t
    rely on it. The only safe assumption to make is that as soon as the memory has
    been allocated to Mono, it''s then reserved and is no longer available to either
    the Native Domain or any other application running on the same system.


    # # Code compilation


    When we make changes to our C# code, it is automatically compiled when we switch
    back from our favorite IDE (which is typically either MonoDevelop or the much
    more feature- rich Visual Studio) to the Unity Editor. However, the C# code is
    not converted directly into Machine Code, as we would expect static compilers
    to do if we are using languages such as C++.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'Instead, the code is converted into an intermediate stage called **Common Intermediate
    Language (CIL)**, which is an abstraction above Native Code. This is how .NET
    can support multiple languages--each uses a different compiler, but they''re all
    converted into CIL, so the output is effectively the same regardless of the language
    that we pick. CIL is similar to Java bytecode, upon which it is based, and the
    CIL code is entirely useless on its own, as CPUs have no idea how to run the instructions
    defined in this language.


    At runtime, this intermediate code is run through the Mono **Virtual Machine (VM)**,
    which is an infrastructure element that allows the same code to run against multiple
    platforms without the need to change the code itself. This is an implementation
    of the **.NET Common Language Runtime (CLR)**. If we''re running on iOS, we run
    on the iOS-based Virtual Machine infrastructure, and if we''re running on Linux,
    then we simply use a different one that is better suited for Linux. This is how
    Unity allows us to write code once, and it works magically on multiple platforms.


    Within the CLR, the intermediate CIL code will actually be compiled into Native
    Code on demand. This immediate Native compilation can be accomplished either by
    an **Ahead-Of- Time (AOT)** or **Just-In-Time (JIT)** compiler. Which one is used
    will depend on the platform that is being targeted. These compilers allow code
    segments to be compiled into Native Code, allowing the platform''s architecture
    to complete the written instructions without having to write them ourselves. The
    main difference between the two compiler types is when the code is compiled.


    AOT compilation is the typical behavior for code compilation and happens early
    (_ahead of time_) either during the build process or in some cases during app
    initialization. In either case, the code has been precompiled and no further runtime
    costs are inflicted due to dynamic compilation since there are always Machine
    Code instructions available whenever the CPU needs them.


    JIT compilation happens dynamically at runtime in a separate thread and begins
    just prior to execution (_just in time_ for execution). Often, this dynamic compilation
    causes the first invocation of a piece of code to run a little (or a lot) more
    slowly, because the code must finish compiling before it can be executed. However,
    from that point forward, whenever the same code block is executed, there is no
    need for recompilation, and the instructions run through the previously compiled
    Native Code.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# # IL2CPP


    A few years ago, Unity Technologies was faced with a choice either continue to
    support

    the Mono platform, which Unity was finding more and more difficult to keep up
    with, or

    implement their own scripting backend. They chose the latter option and multiple

    platforms now support IL2CPP, which is short for **Intermediate Language to C++**.


    IL2CPP is a scripting backend designed to convert Mono''s CIL output directly
    into Native

    C++ code. This leads to improved performance since the application will now be
    running

    Native Code. This ultimately gives Unity Technologies more control of runtime
    behavior

    since IL2CPP provides its own AOT compiler and VM, allowing custom improvements
    to

    subsystems such as the GC and compilation process. IL2CPP does not intend to completely

    replace the Mono platform, but it is an additional tool we can enable, which improves
    part

    of the functionality that Mono provides.


    Note that IL2CPP is automatically enabled for iOS and WebGL projects. For other
    platforms

    that support it, IL2CPP can be enabled under **Edit | Project Settings | Player
    | Configure |

    Scripting Backend**.


    A common adage in software development is that 90 percent of the work is being
    done by

    only 10 percent of the code. This generally means that JIT compilation turns out
    to be a net

    positive on performance than if we simply tried to interpret the CIL code directly.
    However,

    because the JIT compiler must compile code quickly, it is not able to make use
    of many

    optimization techniques that static AOT compilers are able to exploit.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_287_0.png)


    Not all platforms support JIT compilation, but some scripting

    functionalities are not available when using AOT. Unity provides a

    complete list of these restrictions at https://docs.unity3d.com/Manual/

    ScriptingRestrictions.html.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_287_1.png)


    The Unity Technologies'' initial post about IL2CPP, the reasoning behind

    the decision, and its long-term benefits can be found at https://blogs.

    unity3d.com/2014/05/20/the-future-of-scripting-in-unity/.


    ![](img/da79484c9b30dc915216dbc5454a9bbf_287_2.png)


    A list of platforms currently supporting IL2CPP can be found at https://

    docs.unity3d.com/Manual/IL2CPP.html.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# # Profiling memory


    There are two issues we are concerned about when it comes to memory management:
    how

    much we''re consuming, and how often we''re allocating new blocks. Let''s cover
    each of

    these topics separately.


    # # Profiling memory consumption


    We do not have direct control over what is going on in the Native Domain since
    we don''t

    have the Unity Engine source code and hence can''t add any code that will interact
    with it

    directly. We can, however, control it indirectly by means of various script-level
    functions

    that serve as interaction points between Managed and Native Code. There are technically
    a

    variety of memory allocators available, which are used internally for things such
    as

    GameObjects, Graphics objects, and the Profiler, but these are hidden behind the
    Native-

    Managed Bridge.


    However, we can observe how much memory has been allocated and reserved in this

    Memory Domain via the **Memory Area** of the **Profiler** window. Native memory
    allocations

    show up under the values labeled **Unity**, and we can even get more information
    using

    **Detailed Mode** and sampling the current frame:


    | Used Total: 101.2 MB | Unity: 68.1 MB | Mono: 7.8 MB | GfxDriver: 15.8 MB |
    FMOD: 1.3 MB | Video: 224 B | Profiler: 9.5 MB |

    |---|---|---|---|---|---|---|

    | Reserved Total: 241.4 MB | Unity: 199.0 MB | Mono: 10.7 MB | GfxDriver: 15.8
    MB | FMOD: 1.3 MB | Video: 224 B | Profiler: 16.0 MB |

    | Total System Memory Usage: 0.78 GB | | | | | | |


    Under the **Scene Memory** section of **Breakdown View**, we can observe that

    `MonoBehaviour` objects always consume a constant amount of memory, regardless
    of their

    member data. This is the memory consumed by the Native representation of the object.


    Note that memory consumption in **Edit Mode** is always wildly different to

    that of a stand-alone version due to various debugging and editor hook

    data being applied. This adds a further incentive to avoid using **Edit**

    **Mode** for benchmarking and instrumentation purposes.


    We can also use the `Profiler.GetRuntimeMemorySize()` method to get the Native

    memory allocation size of a particular object.


    Managed object representations are intrinsically linked to their Native representations.
    The

    best way to minimize our Native memory allocations is to simply optimize our Managed

    memory usage.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'We can verify how much memory has been allocated and reserved for the Managed
    Heap using the **Memory Area** of the **Profiler** window, under the values labeled
    **Mono**, as follows:


    Used Total: 101.2 MB Unity: 68.1 MB Mono: 7.8 MB GfxDriver: 15.8 MB FMOD: 1.3
    MB Video: 224 B Profiler: 9.5 MB Reserved Total: 241.4 MB Unity: 199.0 MB Mono:
    10.7 MB GfxDriver: 15.8 MB FMOD: 1.3 MB Video: 224 B Profiler: 16.0 MB Total System
    Memory Usage: 0.78 GB


    We can also determine the current used and reserved heap space at runtime using
    the `Profiler.GetMonoUsedSize()` and `Profiler.GetMonoHeapSize()` methods, respectively.


    # # Profiling memory efficiency


    The best metric we can use to measure the health of our memory management is simply
    watching the behavior of the GC. The more work it''s doing, the more waste we''re
    generating and the worse our application''s performance is likely to become.


    We can use both the **CPU Usage Area** (the **GarbageCollector** checkbox) and
    **Memory Area** (the **GC Allocated** checkbox) of the **Profiler** window to
    observe the amount of work the GC is doing and the time it''s doing it. This can
    be relatively straightforward for some situations, where we only allocated a temporary
    small block of memory or we just destroyed a `GameObject`.


    However, root-cause analysis for memory efficiency problems can be challenging
    and time- consuming. When we observe a spike in the GC''s behavior, it could be
    a symptom of allocating too much memory in a previous frame and merely allocating
    a little more in the current frame, requiring the GC to scan a lot of fragmented
    memory, determine whether there is enough space, and decide whether to allocate
    a new block. The memory it cleaned up could have been allocated a long time ago,
    and we may only be able to observe these effects when our application runs over
    long periods of time and could even happen when our Scene is sitting relatively
    idle, giving no obvious cause for the GC to suddenly trigger. Even worse, the
    Profiler can only tell us what happened in the last few seconds or so, and it
    won''t be immediately obvious what data was being cleaned up.


    We must be vigilant and test our application rigorously, observing its memory
    behavior while simulating a typical play session if we want to be certain we are
    not generating memory leaks or creating a situation where the GC has too much
    work to complete in a single frame.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# # Memory management performance enhancements


    In most Game Engines, we would have the luxury of being able to port inefficient
    Managed Code into faster Native Code if we were hitting performance issues. This
    is not an option unless we invest serious cash in obtaining the Unity source code,
    which is offered as a license separate from the Free/Personal/Pro licensing system,
    and on a per case, per title basis. We could also purchase a license of Unity
    Pro with the hope of using Native Plugins, but doing so rarely leads to a performance
    benefit since we must still cross the Native- Managed Bridge to invoke function
    calls inside of it. Native Plugins are normally used to interface with systems
    and libraries that are not built specifically for C#. This forces the overwhelming
    majority of us into a position of needing to make our C# script-level code as
    performant as possible ourselves.


    With this in mind, we should now have enough understanding of Unity Engine internals
    and memory spaces to detect and analyze memory performance issues and understand
    and implement enhancements for them. So, let''s cover some performance enhancements
    we can apply.


    # # Garbage collection tactics


    One strategy to minimize garbage collection problems is concealment by manually
    invoking the GC at opportune moments, when we''re certain the player would not
    notice. Garbage collection can be manually invoked by calling `System.GC.Collect()`.


    Good opportunities to invoke a collection may be while loading between levels,
    when gameplay is paused, shortly after a menu interface has been opened, during
    cutscene transitions, or any break in Gameplay that the player would not witness,
    or care about, a sudden performance drop. We could even use the `Profiler.GetMonoUsedSize()`
    and `Profiler.GetMonoHeapSize()` methods at runtime to determine whether a garbage
    collection needs to be invoked in the near future.


    We can also cause the deallocation of a handful of specific objects. If the object
    in question is one of the Unity object wrappers, such as a `GameObject` or `MonoBehaviour`
    Component, then the finalizer will first invoke the `Dispose()` method within
    the Native Domain. At this point, the memory consumed by both the Native and Managed
    Domains will then be freed. In some rare instances, if the Mono wrapper implements
    the `IDisposable` Interface Class (that is, it has a `Dispose()` method available
    from script code), then we can actually control this behavior and force the memory
    to be freed instantly.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'There are a number of different object types in the Unity Engine (most of which
    are introduced in Unity 5 or later), which implement the `IDisposable` Interface
    Class, as follows: `NetworkConnection`, `WWW`, `UnityWebRequest`, `UploadHandler`,
    `DownloadHandler`, `VertexHelper`, `CullingGroup`, `PhotoCapture`, `VideoCapture`,
    `PhraseRecognizer`, `GestureRecognizer`, `DictationRecognizer`, `SurfaceObserver`,
    and more.


    These are all utility classes for pulling in potentially large datasets where
    we might want to ensure immediate destruction of the data it has acquired, since
    they normally involve allocating several buffers and memory blocks in the Native
    Domain in order to accomplish their tasks. If we kept all of this memory for a
    long time, it would be a colossal waste of precious space. So, by calling their
    `Dispose()` method from script code, we can ensure that the memory buffers are
    freed promptly and precisely when they need to be.


    All other Asset objects offer some kind of unloading method to clean up any unused
    asset data, such as `Resources.UnloadUnusedAssets()`. Actual asset data is stored
    within the Native Domain, so the GC technically isn''t involved here, but the
    idea is basically the same. It will iterate through all Assets of a particular
    type, check whether they''re no longer being referenced, and, if so, deallocate
    them. However, again, this is an asynchronous process, and we cannot guarantee
    exactly when the deallocation will occur. This method is automatically called
    internally after a Scene is loaded, but this still doesn''t guarantee instant
    deallocation. The preferred approach is to use `Resources.UnloadAsset()` instead,
    which will unload one specific asset at a time. This method is generally faster
    since time will not be spent iterating through an entire collection of asset data,
    in order to figure out what is unused.


    However, the best strategy for garbage collection will always be avoidance; if
    we allocate as little heap memory and control its usage as much as possible, then
    we won''t have to worry about the GC inflicting frequent, expensive performance
    costs. We will cover many tactics for this throughout the remainder of this chapter.


    # # Manual JIT compilation


    In the event that JIT compilation is causing a runtime performance loss, be aware
    that it is actually possible to force JIT compilation of a method at any time
    via **Reflection**. Reflection is a useful feature of the C# language that allows
    our code base to explore itself introspectively for type information, methods,
    values, and metadata. Using Reflection is often a very costly process. It should
    be avoided at runtime or, at the very least, only used during initialization or
    other loading times. Not doing so can easily cause significant CPU spikes and
    Gameplay freezing.'
  merge: -1
  img_proc: true
- pgno: 292
  md: "We can manually force JIT compilation of a method using Reflection to obtain\
    \ a function pointer to it:\n\nvar method = typeof(MyComponent).GetMethod(\"MethodName\"\
    );\nif (method != null) {\n    method.MethodHandle.GetFunctionPointer();\n   \
    \ Debug.Log(\"JIT compilation complete!\");\n}\n\nThe preceding code only works\
    \ on public methods. Obtaining private or protected methods can be accomplished\
    \ through the use of BindingFlags:\n\nusing System.Reflection;\n// ...\nvar method\
    \ = typeof(MyComponent).GetMethod(\"MethodName\",\n    BindingFlags.NonPublic\
    \ | BindingFlags.Instance);\n\nThis kind of code should only be run for very targeted\
    \ methods where we are certain that JIT compilation is causing CPU spikes. This\
    \ can be verified by restarting the application and profiling a method's first\
    \ invocation versus all subsequent invocations. The difference will tell us the\
    \ JIT compilation overhead.\n\n> Note that the official method for forcing JIT\
    \ compilation in the .NET library is RuntimeHelpers.PrepareMethod(), but this\
    \ is not properly implemented in the current version of Mono that comes with Unity\
    \ (Mono Version 2.6.5). The aforementioned workaround should be used until Unity\
    \ has pulled in a more recent version of the Mono project.\n\n# # Value types\
    \ and Reference types\n\nNot all memory allocations we make within Mono will go\
    \ through the heap. The .NET Framework (and, by extension, the C# language, which\
    \ merely implements the .NET specification) has the concept of Value types and\
    \ Reference types, and only the latter needs to be marked by the GC while it is\
    \ performing its Mark-and-Sweep algorithm. Reference types are expected to (or\
    \ need to) last a long time in memory due to their complexity, their size, or\
    \ how they're used. Large datasets, and any kind of object instantiated from a\
    \ class, is a Reference type. This also includes arrays (regardless of whether\
    \ it is an array of Value types or Reference types), delegates, all classes, such\
    \ as MonoBehaviour, GameObject, and any custom classes we define."
  merge: -1
  img_proc: true
- pgno: 293
  md: "Reference types are always allocated on the heap, whereas Value types can be\
    \ allocated either on the stack or the heap. Primitive data types such as `bool`,\
    \ `int`, and `float` are examples of Value types. These values are typically allocated\
    \ on the stack, but as soon as a Value type is contained within a Reference type,\
    \ such as a `class` or an array, then it is implied that it is either too large\
    \ for the stack or will need to survive longer than the current scope and must\
    \ be allocated on the heap, bundled with the Reference type it is contained within.\n\
    \nAll of this can be best explained through examples. The following code will\
    \ create an integer as a Value type that exists on the stack only temporarily:\n\
    \n```\npublic class TestComponent {\n    void TestFunction() {\n        int data\
    \ = 5; // allocated on the stack\n        DoSomething(data);\n    } // // integer\
    \ is deallocated from the stack here\n}\n```\n\nAs soon as the `Start()` method\
    \ ends, the integer is deallocated from the stack. This is essentially a free\
    \ operation since, as mentioned previously, it doesn't bother doing any cleanup;\
    \ it just moves the stack pointer back to the previous memory location in the\
    \ call stack (back to whichever function called `TestFunction()` on the `TestComponent`\
    \ object). Any future stack allocations simply overwrite the old data. More importantly,\
    \ no heap allocation took place to create the data, so the GC has no need to track\
    \ its existence.\n\nHowever, if we created an integer as a member variable of\
    \ the `MonoBehaviour` class definition, then it is now contained within a Reference\
    \ type (a `class`) and must be allocated on the heap along with its container:\n\
    \n```\npublic class TestComponent : MonoBehaviour {\n    private int _data = 5;\n\
    \    void TestFunction() {\n        DoSomething(_data);\n    }\n}\n```\n\nThe\
    \ `_data` integer is now an additional piece of data that consumes space in the\
    \ heap alongside the `TestComponent` object it is contained within. If the `TestComponent`\
    \ is destroyed, then the integer is deallocated along with it, but not before\
    \ then."
  merge: -1
  img_proc: true
- pgno: 294
  md: "Similarly, if we put the integer into a normal C# class, then the rules for\
    \ Reference types still apply and the object is allocated on the heap:\n\n```\n\
    public class TestData {\n    public int data = 5;\n}\n```\n\n```\npublic class\
    \ TestComponent {\n    void TestFunction() {\n        TestData dataObj = new TestData();\
    \ // allocated on the heap\n        DoSomething(dataObj.data);\n    } // dataObj\
    \ is not immediately deallocated here, but it will\n    // become a candidate\
    \ during the next GC sweep\n}\n```\n\nSo, there is a big difference between creating\
    \ a temporary Value type within a class method versus storing long-term Value\
    \ type as a member field of a class. In the former case, we're storing it in the\
    \ stack, but in the latter case, we're storing it within a Reference type, which\
    \ means it can be referenced elsewhere. For example, imagine that DoSomething()\
    \ has stored the reference to dataObj within a member variable:\n\n```\npublic\
    \ class TestComponent {\n    private TestData _testDataObj;\n\n    void TestFunction()\
    \ {\n        TestData dataObj = new TestData(); // allocated on the heap\n   \
    \     DoSomething(dataObj.data);\n    }\n\n    void DoSomething(TestData dataObj)\
    \ {\n        _testDataObj = dataObj; // a new reference created! The referenced\n\
    \        // object will now be marked during Mark-and-Sweep\n    }\n}\n```\n\n\
    In this case, we would not be able to deallocate the object pointed to dataObj\
    \ as soon as the TestFunction() method ends because the total number of things\
    \ referencing the object would go from 2 to 1. This is not 0, and hence the GC\
    \ would still mark it during Mark-and- Sweep. We would need to set the value of\
    \ _testDataObj to null or make it reference something else, before the object\
    \ is no longer reachable."
  merge: -1
  img_proc: true
- pgno: 295
  md: "Note that a Value type must have a value and can never be null. If a stack-allocated\
    \ Value type is assigned to a Reference type, then the data is simply copied.\
    \ This is true even for arrays of Value types:\n\n```\npublic class TestClass\
    \ {\n    private int[] _intArray = new int[1000]; // Reference type\n    // full\
    \ of Value types\n\n    void StoreANumber(int num) {\n        _intArray[0] = num;\
    \ // store a Value within the array\n    }\n}\n```\n\nWhen the initial array is\
    \ created (during object initialization), 1,000 integers will be allocated on\
    \ the heap set to a value of 0. When the `StoreANumber()` method is called, the\
    \ value of `num` is merely copied into the zeroth element of the array rather\
    \ than storing a reference to it.\n\nThe subtle change in the referencing capability\
    \ is what ultimately decides whether something is a Reference type or a Value\
    \ type, and we should try to use Value types whenever we have the opportunity\
    \ so that they generate stack allocations instead of heap allocations. Any situation\
    \ where we’re just sending around a piece of data that doesn’t need to live longer\
    \ than the current scope is a good opportunity to use a Value type instead of\
    \ a Reference type. Ostensibly, it does not matter if we pass the data into another\
    \ method of the same class or a method of another class--it still remains a Value\
    \ type that will exist on the stack until the method that created it goes out\
    \ of the scope.\n\n# # Pass by value and by reference\n\nTechnically, something\
    \ is duplicated every time a data value is passed as an argument from one method\
    \ to another, and this is true whether it is a Value type or a Reference type.\
    \ When we’re passing the object’s data, this is known as _passing by value_. When\
    \ we’re simply copying a reference to something else, it is called _passing by\
    \ reference_.\n\nAn important difference between Value types and Reference types\
    \ is that a Reference type is merely a pointer to another location in memory that\
    \ consumes only 4 or 8 bytes in memory (32 bit or 64 bit, depending on the architecture),\
    \ regardless of what it is actually pointing to. When a Reference type is passed\
    \ as an argument, it is only the value of this pointer that gets copied into the\
    \ function. Even if the Reference type points to a humongous array of data, this\
    \ operation will be very quick since the data being copied is very small."
  merge: -1
  img_proc: true
- pgno: 296
  md: "Meanwhile, a Value type contains the full and complete bits of data stored\
    \ within a concrete object. Hence, all of the data of a Value type will be copied\
    \ whenever they are passed between methods or stored in other Value types. In\
    \ some cases, it can mean that passing a large Value type as arguments around\
    \ too much can be more costly than just using a Reference type and letting the\
    \ GC take care of it. For most Value types, this is not a problem since they are\
    \ comparable in size to a pointer, but this becomes important when we begin to\
    \ talk about the `struct` type in the next section.\n\nData can also be passed\
    \ around by reference using the `ref` keyword, but this is very different from\
    \ the concept of Value and Reference types, and it is very important to keep them\
    \ distinct in our mind when we try to understand what is going on under the hood.\
    \ We can pass a Value type by value, or by reference, and we can pass a Reference\
    \ type by value, or by reference. This means that there are four distinct data\
    \ passing situations that can occur, depending on which type is being passed and\
    \ whether the `ref` keyword is being used or not.\n\nWhen data is passed by reference\
    \ (even if it is a Value type), then making any changes to the data will change\
    \ the original. For example, the following code would print the value as 10:\n\
    \n```\n```c\nvoid Start() {\n    int myInt = 5;\n    DoSomething(ref myInt);\n\
    \    Debug.Log(String.Format(\"Value = {0}\", myInt));\n}\n\nvoid DoSomething(ref\
    \ int val) {\n    val = 10;\n}\n```\n```\n\nRemoving the `ref` keyword from both\
    \ places would make it print the value 5 instead (and removing it from only one\
    \ of them would lead to a compiler error since the `ref` keyword needs to be present\
    \ in both locations or neither). This understanding will come in handy when we\
    \ start to think about some of the more interesting data types we have access\
    \ to, namely, structs, arrays, and strings."
  merge: -1
  img_proc: true
- pgno: 297
  md: "# # Structs are Value types\n\nThe `struct` type is an interesting special\
    \ case in C#. A `struct` object can contain `private`,\n`protected`, and `public`\
    \ fields, have methods, and can be instantiated at runtime, just like a\n`class`\
    \ type. However, there is a fundamental difference between the two: a `struct`\
    \ type is\na Value type, and a `class` type is a Reference type. Consequently,\
    \ this leads to some\nimportant differences between the two, namely, that a `struct`\
    \ type cannot support\ninheritance, their properties cannot be given custom default\
    \ values (member data always\ndefaults to values such as `0` or `null` since it\
    \ is a Value type), and their default constructors\ncannot be overridden. This\
    \ greatly restricts their usage compared to classes, so simply\nreplacing all\
    \ classes with structs (under the assumption that it will just allocate everything\n\
    on the stack) is not as easy as it sounds.\n\nHowever, if we're using a class\
    \ in a situation whose only purpose is to send a blob of data to\nsomewhere else\
    \ in our application, and it does not need to last beyond the current scope,\n\
    then we might be able to use a `struct` type instead, since a `class` type would\
    \ result in a\nheap allocation for no particularly good reason:\n\n```\npublic\
    \ class DamageResult {\n    public Character attacker;\n    public Character Defender;\n\
    \    public int totalDamageDealt;\n    public DamageType damageType;\n    public\
    \ int damageBlocked;\n    // etc.\n}\n\npublic void DealDamage(Character _target)\
    \ {\n    DamageResult result = CombatSystem.Instance.CalculateDamage(this,\n \
    \   _target);\n    CreateFloatingDamageText(result);\n}\n```\n\nIn this example,\
    \ we're using a `class` type to pass a bunch of data from one subsystem (the\n\
    combat system) to another (the UI system). The only purpose of this data is to\
    \ be calculated\nand read by various subsystems, so this is a good candidate to\
    \ convert into a `struct` type."
  merge: -1
  img_proc: true
- pgno: 298
  md: "Merely changing the `DamageResult` definition from a `class` type to a `struct`\
    \ type could save us quite a few unnecessary garbage collections since it would\
    \ be allocated on the stack as a Value type instead of the heap as a Reference\
    \ type:\n\n```\npublic struct DamageResult {\n    // ...\n}\n```\n\nThis is not\
    \ a catch-all solution. Since structs are Value types, the entire blob of data\
    \ will be duplicated and provided to the next method in the call stack, regardless\
    \ of how large or small it is. So, if a `struct` object is passed by a value between\
    \ five different methods in a long chain, then five different stack copies will\
    \ occur at the same time. Recall that stack deallocations are effectively free,\
    \ but stack allocations (which involves copying of data) is not. This data copying\
    \ is pretty much negligible for small values, such as a handful of integers or\
    \ floating-point values, but passing around ridiculously large datasets through\
    \ structs over and over again is obviously not a trivial task and should be avoided.\n\
    \nWe can work around this problem by passing the `struct` object by reference\
    \ using the `ref` keyword to minimize the amount of data being copied each time\
    \ (just a single pointer). However, this can be dangerous since passing by reference\
    \ allows any subsequent methods to make changes to the `struct` object in which\
    \ case it would be prudent to make its data values `readonly`. This means that\
    \ the values can only be initialized in the constructor, and never again, even\
    \ by its own member functions, which prevents accidental changes as it’s passed\
    \ through the chain.\n\nAll of the above is also true when structs are contained\
    \ within Reference types, as follows:\n\n```\npublic struct DataStruct {\n   \
    \ public int val;\n}\n\npublic class StructHolder {\n    public DataStruct _memberStruct;\n\
    \    public void StoreStruct(DataStruct ds) {\n        _memberStruct = ds;\n \
    \   }\n}\n```\n\nTo the untrained eye, the preceding code appears to be attempting\
    \ to store a stack-allocated struct (`ds`) within a Reference type (`StructHolder`).\
    \ Does this mean that a `StructHolder` object on the heap can now reference an\
    \ object on the stack? If so, what will happen when the `StoreStruct()` method\
    \ goes out of scope and the `struct` object is (effectively) erased? It turns\
    \ out that these are the wrong questions."
