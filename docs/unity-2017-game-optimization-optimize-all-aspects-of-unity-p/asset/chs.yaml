- "# 追踪性能问题\n\n大多数软件产品的性能评估是一个非常科学的过程。首先，我们确定支持的最大/最小性能指标，例如允许的内存使用量、可接受的 CPU 消耗量、并发用户数量等。接下来，我们针对为目标平台构建的应用程序版本，在特定场景下对应用程序进行负载测试，并在收集仪器数据的同时进行测试。收集这些数据后，我们分析并搜索其中的性能瓶颈。如果发现问题，我们完成根本原因分析，对配置或应用程序代码进行更改以修复问题，并重复此过程。\n\
  \n尽管游戏开发是一个非常艺术的过程，但它仍然非常技术化，因此有充分的理由以类似客观的方式对待它。我们的游戏应该有一个目标受众，这可以告诉我们游戏可能运行在什么样的硬件限制下，并可能告诉我们需要满足的具体性能目标（特别是在主机和移动游戏的情况下）。我们可以对应用程序进行运行时测试，从多个子系统（CPU、GPU、内存、物理引擎、渲染管线等）收集性能数据，并将其与我们认为可接受的数据进行比较。我们可以使用这些数据来识别应用程序中的瓶颈，进行额外的仪器测量，并确定问题的根本原因。最后，根据问题的类型，我们应该能够应用多种修复措施来改善应用程序的性能，使其更符合预期的行为。\n\
  \n\n\n\n\n然而，在花费任何时间进行性能修复之前，我们首先需要证明确实存在性能问题。在没有充分理由的情况下，花时间重写和重构代码是不明智的，因为预优化通常不值得麻烦。一旦我们有了性能问题的证据，下一步就是找出瓶颈的确切位置。确保我们了解性能问题发生的原因非常重要，否则我们可能会浪费更多时间来应用几乎只是凭经验猜测的修复措施。这样做通常意味着我们只修复了问题的症状，而不是其根本原因，因此我们冒着风险，即问题将来以其他方式表现出来，或者以我们尚未发现的方式表现出来。\n\
  \n在本章中，我们将探讨以下内容：\n\n- 如何使用 Unity Profiler 收集分析数据\n- 如何分析 Profiler 数据以查找性能瓶颈\n-\
  \ 隔离性能问题并确定其根本原因的技术\n\n在彻底理解给定问题后，您将准备好阅读其余章节中提供的信息，在其中您将了解针对我们检测到的问题有哪些可用解决方案。\n\
  \n# Unity Profiler\n\nUnity Profiler 内置于 Unity Editor 本身中，通过在运行时生成大量 Unity3D 子系统的使用情况和统计报告，为缩小性能瓶颈搜索范围提供了一种便捷的方式。它可以收集数据的不同子系统列表如下：\n\
  \n- CPU 消耗（按主要子系统）\n- 基本和详细的渲染及 GPU 信息\n- 运行时内存分配和总体消耗\n- 音频源/数据使用情况\n- 物理引擎（2D\
  \ 和 3D）使用情况\n- 网络消息和操作使用情况\n- 视频播放使用情况\n- 基本和详细的用户界面性能（Unity 2017 中的新功能）\n- 全局光照统计信息（Unity\
  \ 2017 中的新功能）\n\n通常有两种方法可以使用分析工具：**插桩**和**基准测试**（虽然，诚然，这两个术语经常被混用）。\n\n插桩通常意味着通过观察目标函数调用的行为、内存分配的位置和数量，来深入了解应用程序的内部工作原理，并通常获得正在发生的事情的准确图景，希望找到问题的根本原因。然而，这通常不是开始查找性能问题的有效方法，因为对任何应用程序进行分析本身都会带来性能开销。\n\
  \n当 Unity 应用程序以开发模式编译（由 **Build Settings** 菜单中的 **Development Build** 标志确定）时，会启用其他编译器标志，导致应用程序在运行时生成特殊事件，这些事件会被\
  \ Profiler 记录和存储。自然，由于应用程序承担了所有额外的工作量，这会在运行时造成额外的 CPU 和内存开销。更糟糕的是，如果应用程序是通过 Unity\
  \ Editor 进行分析的，那么将花费更多的 CPU 和内存，以确保 Editor 更新其界面、渲染其他窗口（例如 **Scene** 窗口）并处理后台任务。这种分析成本并不总是可以忽略不计。在过大的项目中，启用\
  \ Profiler 时有时会导致行为极不一致。在某些情况下，不一致性足以导致由于事件时序变化和异步行为中的潜在竞争条件而引起完全意外的行为。这是我们为深入分析代码在运行时的行为而支付的必要代价，我们应该始终意识到它的存在。\n\
  \n在开始分析应用程序中的每一行代码之前，对应用程序进行表面级测量会更明智。我们应该在游戏在目标硬件上运行的运行时会话期间收集一些基本数据并执行测试场景；测试用例可以简单地是几秒钟的游戏性、过场动画的播放、关卡的部分通关等等。这项活动的目的是大致了解用户可能的体验，并留意性能变得明显变差的时刻。此类问题可能足够严重，值得进一步分析。\n\
  \n这项活动通常被称为基准测试，我们感兴趣的重要指标通常是渲染的 **每秒帧数（FPS）**、总体内存消耗、CPU 活动的行为（寻找活动中的大幅尖峰），有时还有\
  \ CPU/GPU 温度。这些都是相对容易收集的指标，可以作为性能分析的最佳初步方法，原因很重要；从长远来看，它将为我们节省大量时间，因为它确保我们只花时间调查用户会注意到的问题。\n\
  \n只有在基准测试表明需要进一步分析后，我们才应该深入进行插桩。如果我们想要获得真实的数据样本，尽可能模拟实际平台行为进行基准测试也非常重要。因此，我们绝不应该接受通过\
  \ Editor Mode 生成的基准测试数据作为真实游戏玩法的代表，因为 Editor Mode 带来了一些额外的开销成本，可能会误导我们，或隐藏真实应用程序中的潜在竞争条件。相反，我们应该在应用程序在目标硬件上以独立格式运行时，将分析工具连接到应用程序。\n\
  \n许多 Unity 开发者惊讶地发现，Editor 有时计算操作结果的速度比独立应用程序快得多。在处理音频文件、预制体和 Scriptable Objects\
  \ 等序列化数据时，这种情况尤其常见。这是因为 Editor 会缓存先前导入的数据，并且能够比真实应用程序快得多地访问它。\n\n让我们介绍如何访问 Unity\
  \ Profiler 并将其连接到目标设备，以便我们可以开始进行准确的基准测试。\n\n已经熟悉将 Unity Profiler 连接到其应用程序的用户可以跳转到标题为\
  \ _The Profiler window_ 的部分。\n\n# 启动 Profiler\n\n我们将从简要教程开始，了解如何在各种上下文中将我们的游戏连接到\
  \ Unity Profiler：\n\n- 应用程序的本地实例，无论是通过 Editor 还是独立实例\n- 在浏览器中运行的 WebGL 应用程序的本地实例\n\
  - iOS 设备（例如 iPhone 或 iPad）上的应用程序远程实例\n- Android 设备（例如 Android 平板电脑或手机）上的应用程序远程实例\n\
  - 对 Editor 本身进行分析\n\n## Editor 或独立实例\n\n访问 Profiler 的唯一方法是通过 Unity Editor 启动它，并将其连接到我们应用程序的运行实例。无论我们是在\
  \ Editor 的 Play Mode 中执行游戏、在本地或远程设备上运行独立应用程序，还是希望对 Editor 本身进行分析，情况都是如此。\n\n要打开\
  \ **Profiler**，请在 Editor 中导航到 **Window | Profiler**：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_31_0.png)\n\
  \n如果 Editor 已经在 Play Mode 中运行，那么我们应该看到 **Profiler** 窗口中正在主动收集报告数据。\n\n要对独立项目进行分析，请确保在构建应用程序时启用了\
  \ **Development Build** 和 **Autoconnect Profiler** 标志。\n\n可以通过 **Profiler** 窗口中的\
  \ **Connected Player** 选项，选择对基于 Editor 的实例（通过 Editor 的 Play Mode）还是独立实例（与 Editor\
  \ 分开构建和运行）进行分析：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_32_0.png)\n\n请注意，在分析单独的独立项目时，切换回\
  \ Unity Editor 将停止所有数据收集，因为应用程序在后台时不会更新。\n\n请注意，在 Unity 5 中，**Development Build**\
  \ 选项名为 **Use Development Mode**，而 **Connected Player** 选项名为 **Active Profiler**。\n\
  \n## 连接到 WebGL 实例\n\nProfiler 也可以连接到 Unity WebGL Player 的实例。可以通过确保在从 Editor 构建和运行\
  \ WebGL 应用程序时启用 **Development Build** 和 **Autoconnect Profiler** 标志来实现。然后应用程序将通过操作系统的默认浏览器启动。这使我们能够通过目标浏览器在更真实的场景中分析我们的基于\
  \ Web 的应用程序，并测试多种浏览器类型以查找行为不一致（尽管这需要我们不断更改默认浏览器）。\n\n不幸的是，Profiler 连接只能在应用程序首次从\
  \ Editor 启动时建立。它目前（至少在 Unity 2017 的早期构建中）无法连接到已经在浏览器中运行的独立 WebGL 实例。这限制了 WebGL 应用程序基准测试的准确性，因为会有一些基于\
  \ Editor 的开销，但这是我们目前唯一可用的选项。\n\n\n\n\n\n# 远程连接到 iOS 设备\n\nProfiler 还可以连接到在 iOS 设备（例如\
  \ iPad 或 iPhone）上远程运行的应用程序的活动实例。这可以通过共享 Wi-Fi 连接来实现。\n\n请注意，只有当 Unity（因此也是 Profiler）在\
  \ Apple Mac 设备上运行时，才能远程连接到 iOS 设备。\n\n按照给定步骤将 Profiler 连接到 iOS 设备：\n\n- 1. 构建应用程序时，确保已启用\
  \ **Development Build** 和 **Autoconnect Profiler** 标志。\n- 2. 将 iOS 设备和 Mac 设备都连接到本地\
  \ Wi-Fi 网络，或连接到临时 Wi-Fi 网络。\n- 3. 通过 USB 或 Lightning 电缆将 iOS 设备连接到 Mac。\n- 4. 照常使用\
  \ **Build & Run** 选项开始构建应用程序。\n- 5. 在 Unity Editor 中打开 Profiler 窗口，并在 **Connected\
  \ Player** 下选择设备。\n\n现在，您应该能在 **Profiler** 窗口中看到 iOS 设备的分析数据正在收集中。\n\nProfiler 使用\
  \ 54998 到 55511 端口来广播分析数据。如果网络上有防火墙，请确保这些端口可用于出站流量。\n\n有关构建 iOS 应用程序以及将 Profiler\
  \ 连接到它们时出现问题的故障排除，请参阅以下文档页面：`https://docs.unity3d.com/Manual/TroubleShootingIPhone.html`。\n\
  \n# 远程连接到 Android 设备\n\n将 Android 设备连接到 Unity Profiler 有两种不同的方法：通过 Wi-Fi 连接或使用 **Android\
  \ Debug Bridge**（ADB）工具。无论哪种方法，都可以在 Apple Mac 或 Windows PC 上使用。\n\n按照以下步骤通过 Wi-Fi\
  \ 连接连接 Android 设备：\n\n1. 构建应用程序时，确保已启用 **Development Build** 和 **Autoconnect Profiler**\
  \ 标志。\n2. 将 Android 设备和桌面设备都连接到本地 Wi-Fi 网络。\n3. 通过 USB 电缆将 Android 设备连接到桌面设备。\n\
  4. 照常使用 **Build & Run** 选项开始构建应用程序。\n5. 在 Unity Editor 中打开 **Profiler** 窗口，并在 Connected\
  \ Player 下选择设备。\n\n然后，应用程序应该会通过 USB 连接构建并推送到 Android 设备，Profiler 应该通过 Wi-Fi 连接进行连接。然后，您应该能在\
  \ **Profiler** 窗口中看到 Android 设备的分析数据正在收集中。\n\n第二种方法是使用 ADB。这是一套随 Android **Software\
  \ Development Kit (SDK)** 捆绑提供的调试工具。对于 ADB 分析，请执行以下步骤：\n\n1. 通过遵循 Unity 的 Android\
  \ SDK/NDK 设置指南，确保已安装 Android SDK：`https://docs.unity3d.com/Manual/android-sdksetup.html`。\n\
  2. 通过 USB 电缆将 Android 设备连接到桌面计算机。\n3. 构建应用程序时，确保已启用 **Development Build** 和 **Autoconnect\
  \ Profiler** 标志。\n4. 照常使用 **Build & Run** 选项开始构建应用程序。\n5. 在 Unity Editor 中打开 **Profiler**\
  \ 窗口，并在 **Connected Player** 下选择设备。\n\n现在，您应该能在 **Profiler** 窗口中看到 Android 设备的分析数据正在收集中。\n\
  \n有关构建 Android 应用程序以及将 Profiler 连接到它们时出现问题的故障排除，请参阅以下文档页面：`https://docs.unity3d.com/Manual/TroubleShootingAndroid.html`。\n\
  \n# Editor 分析\n\n我们可以对 Editor 本身进行分析。这通常用于尝试分析自定义 Editor 脚本的性能。这可以通过在 Profiler 窗口中启用\
  \ **Profile Editor** 选项，并将 **Connected Player** 选项配置为 **Editor** 来实现，如下面的屏幕截图所示：\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_35_0.png)\n\n请注意，如果我们想要对 Editor 进行分析，则必须将这两个选项都这样配置。将\
  \ **Connected Player** 设置为 **Editor** 而不启用 **Profile Editor** 按钮是默认情况，即 Profiler\
  \ 正在为我们的应用程序在 Play Mode 运行时收集数据。\n\n# Profiler 窗口\n\n我们现在将介绍 Profiler 的基本功能，这些功能可以在界面中找到。\n\
  \nProfiler 窗口分为四个主要部分：\n\n- Profiler Controls\n- Timeline View\n- Breakdown View\
  \ Controls\n- Breakdown View\n\n这些部分在下面的屏幕截图中显示：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_35_1.png)\n\
  \n我们将详细介绍每个部分。\n\n# Profiler 控件\n\n上一张屏幕截图中的顶部栏包含多个下拉和切换按钮，我们可以使用它们来影响正在分析的内容以及从子系统中收集数据的深度。它们将在下一小节中介绍。\n\
  \n## 添加 Profiler\n\n默认情况下，Profiler 将为几个不同的子系统收集数据，这些子系统涵盖了 Timeline View 中 Unity\
  \ Engine 的大部分子系统。这些子系统被组织到包含相关数据的各个区域中。**Add Profiler** 选项可用于添加其他区域，或在它们被删除后将其恢复。有关我们可以分析的子系统的完整列表，请参阅\
  \ _Timeline View_ 部分。\n\n## 记录\n\n启用 **Record** 选项会使 Profiler 记录分析数据。只要启用此选项，就会持续进行此操作。请注意，只有当应用程序正在主动运行时，才能记录运行时数据。对于在\
  \ Editor 中运行的应用程序，这意味着必须启用 Play Mode，并且不应暂停；或者，对于独立应用程序，它必须是活动窗口。如果启用了 **Profile\
  \ Editor**，那么出现的数据将是为 Editor 本身收集的。\n\n## 深度分析\n\n普通分析只会记录常见 Unity 回调方法（例如 `Awake()`、`Start()`、`Update()`\
  \ 和 `FixedUpdate()`）所做的时间和内存分配。启用 **Deep Profile** 选项会以更深层次的插桩级别重新编译我们的脚本，从而允许它测量每个被调用的方法。这会导致运行时的插桩成本比正常情况高得多，并且使用大量更多的内存，因为运行时正在为整个调用堆栈收集数据。因此，在大型项目中，Deep\
  \ Profiling 甚至可能不可能，因为 Unity 在测试开始之前可能会内存不足，或者应用程序运行得太慢以至于测试毫无意义。\n\n请注意，切换 **Deep\
  \ Profile** 需要在分析再次开始之前完全重新编译整个项目，因此最好避免在测试之间反复切换该选项。\n\n由于此选项盲目地测量整个调用堆栈，在大多数分析测试中保持其启用是不明智的。当默认分析无法提供足够的细节来找出根本原因，或者我们正在测试一个小型测试场景（用于隔离某些活动）的性能时，最好保留此选项。\n\
  \n如果需要对大型项目和场景进行 Deep Profiling，但 **Deep Profile** 选项在运行时过于妨碍，那么可以使用即将在 _Targeted\
  \ profiling of code segments_ 部分中介绍的替代方法来进行更详细的分析。\n\n## Profile Editor\n\nProfile\
  \ Editor 选项启用 Editor 分析，即为 Unity Editor 本身收集分析数据。这对于分析我们开发的任何自定义 Editor 脚本很有用。\n\
  \n请记住，**Connected Player** 也必须设置为 **Editor** 选项，Editor 分析才会发生。\n\n## Connected Player\n\
  \n**Connected Player** 下拉菜单提供选择我们要分析的 Unity 目标实例的选项。这可以是当前的 Editor 应用程序、我们应用程序的本地独立实例，或在远程设备上运行的我们应用程序的实例。\n\
  \n## 清除\n\n**Clear** 按钮会清除 Timeline View 中的所有分析数据。\n\n## 加载\n\n**Load** 按钮将打开一个对话框窗口，以加载之前保存的任何\
  \ Profiler 数据（从使用 **Save** 选项）。\n\n\n\n\n\n# Save\n\nThe **Save** button saves any\
  \ Profiler data currently presented in the Timeline View to a file.\nOnly 300 frames\
  \ of data can be saved in this fashion at a time, and a new file must be\nmanually\
  \ created for any more data. This is typically sufficient for most situations, since\n\
  when a performance spike occurs we then have about five to ten seconds to pause\
  \ the\napplication and save the data for future analysis (such as attaching it to\
  \ a bug report) before\nit gets pushed off the left side of the Timeline View. Any\
  \ saved Profiler data can be loaded\ninto the Profiler for future examination using\
  \ the **Load** option.\n\n# Frame Selection\n\nThe **Frame Counter** shows how many\
  \ frames have been profiled and which frame is\ncurrently selected in the Timeline\
  \ View. There are two buttons to move the currently\nselected frame forward or backward\
  \ by one frame and a third button (the **Current** button)\nthat resets the selected\
  \ frame to the most recent frame and keeps that position. This will\ncause the Breakdown\
  \ View to always show the profiling data for the current frame during\nruntime profiling\
  \ and will display the word **Current**.\n\n# Timeline View\n\nThe Timeline View\
  \ reveals profiling data that has been collected during runtime, organized\ninto\
  \ a series of Areas. Each Area focuses on profiling data for a different subsystem\
  \ of the\nUnity Engine and each is split into two sections: a graphical representation\
  \ of profiling data\non the right, and a series of checkboxes to enable/disable\
  \ different activities/data types on\nthe left. These colored boxes can be toggled,\
  \ which changes the visibility of the\ncorresponding data types within the graphical\
  \ section of the Timeline View.\n\nWhen an Area is selected in the Timeline View,\
  \ more information for that\nsubsystem will be revealed in the Breakdown View (beneath\
  \ the Timeline View) for the\ncurrently selected frame. The kinds of information\
  \ displayed in the Breakdown View varies\ndepending on which Area is currently selected\
  \ in the Timeline View.\n\nAreas can be removed from the Timeline View by clicking\
  \ on the X at the top-right corner of\nan Area. Recall that Areas can be restored\
  \ to the Timeline View through the **Add Profiler**\noption in the Controls bar.\n\
  \nAt any time, we can click at a location in the graphical part of the Timeline\
  \ View to reveal information about a given frame. A large vertical white bar will\
  \ appear (usually with some additional information on either side coinciding with\
  \ the line graphs), showing us which frame is selected.\n\nDepending on which Area\
  \ is currently selected (determined by which Area is currently highlighted in blue),\
  \ different information will be available in the Breakdown View, and different options\
  \ will be available in the Breakdown View Controls. Changing the Area that is selected\
  \ is as simple as clicking on the relevant box on the left-hand side of the Timeline\
  \ View or on the graphical side, although clicking inside the graphical Area might\
  \ also change which frame has been selected, so be careful clicking in the graphical\
  \ Area if you wish to see Breakdown View information for the same frame.\n\n# Breakdown\
  \ View Controls\n\nDifferent drop-downs and toggle button options will appear within\
  \ the Breakdown View Controls, depending on which Area is currently selected in\
  \ the Timeline View. Different Areas offer different controls, and these options\
  \ dictate what information is available, and how that information is presented in\
  \ the Breakdown View.\n\n# Breakdown View\n\nThe information revealed in the Breakdown\
  \ View will vary enormously based on which Area is currently selected and which\
  \ Breakdown View Controls options are selected. For instance, some Areas offer different\
  \ modes in a drop-down within the Breakdown View Controls, which can provide a simpler\
  \ or detailed view of the information or even a graphical layout of the same information\
  \ so that it can be parsed more easily.\n\nLet's cover each Area and the different\
  \ kinds of information and options available in the Breakdown View.\n\n# The CPU\
  \ Usage Area\n\nThis Area shows data for all CPU usage and statistics. This Area\
  \ is perhaps the most complex and useful since it covers a large number of Unity\
  \ subsystems, such as `MonoBehaviour` Components, cameras, some rendering and physics\
  \ processes, user interface (including the Editor's interface, if we're running\
  \ through the Editor), audio processing, the Profiler itself, and more.\n\nThere\
  \ are three different modes of displaying CPU usage data in the Breakdown View:\n\
  \n- Hierarchy mode\n- Raw Hierarchy mode\n- Timeline mode\n\nHierarchy mode reveals\
  \ most callstack invocations, while grouping similar data elements and global Unity\
  \ function calls together for convenience. For instance, rendering delimiters, such\
  \ as `BeginGUI()` and `EndGUI()` calls, are combined together in this mode. Hierarchy\
  \ mode is helpful as an initial first step to determine which function calls cost\
  \ the most CPU time to execute.\n\nRaw Hierarchy mode is similar to Hierarchy mode,\
  \ except it will separate global Unity function calls into separate entries rather\
  \ than being combined into one bulk entry. This will tend to make the Breakdown\
  \ View more difficult to read, but may be helpful if we’re trying to count how many\
  \ times a particular global method is invoked or determining whether one of these\
  \ calls is costing more CPU/memory than expected. For example, each `BeginGUI()`\
  \ and `EndGUI()` calls will be separated into different entries, making it more\
  \ clear how many times each is being called compared to the Hierarchy mode.\n\n\
  Perhaps, the most useful mode for the CPU Usage Area is the Timeline mode option\
  \ (not to be confused with the main Timeline View). This mode organizes CPU usage\
  \ during the current frame by how the call stack expanded and contracted during\
  \ processing.\n\nTimeline mode organizes the Breakdown View vertically into different\
  \ sections that represent different threads at runtime, such as **Main Thread**,\
  \ **Render Thread**, and various background job threads called **Unity Job System**,\
  \ used for loading activity such as scenes and other assets. The horizontal axis\
  \ represents time, so wider blocks are consuming more CPU time than narrower blocks.\
  \ The horizontal axis also represents relative time, making it easy to compare how\
  \ much time one function call took compared to another. The vertical axis represents\
  \ the callstack, so deeper chains represent more calls in the callstack at that\
  \ time.\n\nUnder Timeline mode, blocks at the top of the Breakdown View are functions\
  \ (or technically, callbacks) called by the Unity Engine at runtime (such as `Start()`,\
  \ `Awake()`, or `Update()`), whereas blocks underneath them are functions that those\
  \ functions had called into, which can include functions on other Components or\
  \ regular C# objects.\n\nThe Timeline mode offers a very clean and organized way\
  \ to determine which particular method in the callstack consumes the most time and\
  \ how that processing time measures up against other methods being called during\
  \ the same frame. This allows us to gauge the method that is the biggest cause of\
  \ performance problems with minimal effort.\n\nFor example, let’s assume that we\
  \ are looking at a performance problem in the following screenshot. We can tell,\
  \ with a quick glance, that there are three methods that are causing a problem,\
  \ and they each consume similar amounts of processing time, due to their similar\
  \ widths:\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_41_0.png)\n\nIn the previous\
  \ screenshot, we have exceeded our 16.667 millisecond budget with calls to three\
  \ different `MonoBehaviour` Components. The good news is that we have three possible\
  \ methods through which we can find performance improvements, which means lots of\
  \ opportunities to find code that can be improved. The bad news is that increasing\
  \ the performance of one method will only improve about one-third of the total processing\
  \ for that frame. Hence, all three methods may need to be examined and optimized\
  \ in order get back under budget.\n\n> It’s a good idea to collapse the **Unity\
  \ Job System** list when using Timeline mode, as it tends to obstruct the visibility\
  \ of items shown in the **Main Thread** block, which is probably what we’re most\
  \ interested in.\n\n\n\n\n\n一般来说，CPU 使用率区域对于检测可以通过第 2 章“脚本策略”中探讨的解决方案解决的问题最为有用。\n\
  \n# GPU 使用率区域\n\nGPU 使用率区域与 CPU 使用率区域类似，不同之处在于它显示在 GPU 上发生的方法调用和处理时间。此区域中相关的 Unity\
  \ 方法调用将涉及相机、绘制、不透明和透明几何体、光照和阴影等。\n\nGPU 使用率区域提供与 CPU 使用率区域类似的层级信息，并估计调用各种渲染函数（例如\
  \ `Camera.Render()`）所花费的时间（前提是当前在时间线视图中选定的帧期间实际发生了渲染）。\n\n在阅读第 6 章“动态图形”时，GPU 使用率区域将是一个有用的参考工具。\n\
  \n# 渲染区域\n\n渲染区域提供一些通用的渲染统计信息，这些信息倾向于关注与为渲染准备 GPU 相关的活动，这是一组发生在 CPU 上的活动（与在 GPU\
  \ 内部处理的渲染行为相反，后者在 GPU 使用率区域中详细说明）。分解视图提供有用的信息，例如 SetPass 调用次数（也称为绘制调用）、用于渲染场景的批次总数、动态批处理和静态批处理节省的批次数量及其生成方式，以及纹理占用的内存。\n\
  \n渲染区域还提供一个按钮来打开帧调试器，这将在第 3 章“批处理的优势”中进一步探讨。此区域的其余信息在阅读第 3 章“批处理的优势”和第 6 章“动态图形”时将证明很有用。\n\
  \n# 内存区域\n\n内存区域允许我们在**分解视图**中检查应用程序的内存使用情况，有以下两种模式：\n\n- 简单模式\n- 详细模式\n\n简单模式仅提供子系统内存消耗的高级概览。\n\
  这包括 Unity 的底层引擎、Mono 框架（垃圾回收器正在监视的总堆大小）、图形资产、音频资产和缓冲区，甚至包括分析器收集的数据所使用的内存。\n\n详细模式显示单个\
  \ `GameObjects` 和 `MonoBehaviours` 的 `Native` 和 `Managed` 表示的内存消耗。它还有一个列，解释对象可能消耗内存的原因以及何时可能被释放。\n\
  \n垃圾回收器是 Unity 支持的各种语言提供的常见功能，它会自动释放我们分配用于存储数据的任何内存，但如果处理不当，它有可能会使我们的应用程序短暂停顿。本主题以及许多相关主题（例如\
  \ Native 和 Managed 内存空间）将在 _第 8 章，精通内存管理_ 中探讨。\n\n请注意，信息仅通过单击 **Take Sample: <<TargetName>>**\
  \ 按钮进行手动采样才会出现在详细模式中。这是使用详细模式收集信息的唯一方法，因为为每次更新自动执行此类分析的成本过高。\n\n分解视图还提供一个标记为 **Gather\
  \ Object References** 的按钮，可以收集某些对象的更深层内存信息。\n\n当我们深入研究内存管理的复杂性、Native 与 Managed\
  \ 内存以及垃圾回收器时，内存区域将是一个有用的工具，这些内容将在 _第 8 章，精通内存管理_ 中介绍。\n\n# 音频区域\n\n音频区域提供音频统计信息的概览，可用于测量音频系统的\
  \ CPU 使用率以及由音频源（无论是正在播放还是暂停）和音频剪辑消耗的总内存。\n\n分解视图提供了大量有关音频系统运行方式以及各种音频通道和组如何被使用的有用洞察。\n\
  \n当我们探索 _第 4 章，启动你的艺术_ 中的艺术资产时，音频区域可能会派上用场。\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_43_0.png)\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_44_0.png)\n\n在性能优化方面，音频常常被忽视，但如果管理不当，由于所需的硬盘访问和\
  \ CPU 处理量可能很大，音频可能会成为一个惊人的瓶颈来源。不要忽视它！\n\n# 物理 3D 和物理 2D 区域\n\n有两个不同的物理区域，一个用于 3D\
  \ 物理（Nvidia 的 PhysX），另一个用于 2D 物理系统（Box2D）。此区域提供各种物理统计信息，例如刚体、碰撞体和接触点数量。\n\n每个物理区域的分解视图提供了一些关于子系统内部工作原理的基本洞察，但我们可以通过探索物理调试器获得更深入的洞察，我们将在第\
  \ 5 章“更快的物理”中介绍它。\n\n# 网络消息和网络操作区域\n\n这两个区域提供关于 Unity 网络系统的信息，该系统是在 Unity 5 发布周期中引入的。存在的信息将取决于应用程序是使用\
  \ Unity 提供的高级 API（HLAPI）还是传输层 API（TLAPi）。HLAPI 是一个更易于使用的系统，用于自动管理玩家和 GameObject\
  \ 的网络同步，而 TLAPI 是一个在套接字级别上方运行的薄层，允许 Unity 开发者构建他们自己的网络系统。\n\n优化网络流量本身就是一个填满整本书的主题，正确的解决方案通常非常依赖于应用程序的特定需求。这不是\
  \ Unity 特有的问题，因此，网络流量优化的主题不会在本书中探讨。\n\n# 视频区域\n\n如果我们的应用程序恰好使用了 Unity 的 VideoPlayer\
  \ API，那么我们可能会发现此区域对于分析视频播放行为很有用。\n\n媒体播放优化也是一个复杂的、非 Unity 特有的主题，不会在本书中探讨。\n\n# UI\
  \ 和 UI 详情区域\n\n这些区域是 Unity 2017 中的新功能，提供了关于使用 Unity 内置用户界面系统的应用程序的洞察。如果我们使用自定义构建的或第三方用户界面系统（例如\
  \ NGUI），那么这些区域可能提供的好处很少。\n\n优化不良的用户界面通常会影响 CPU 和 GPU 中的一个或两个，因此我们将在 `第 2 章，脚本策略`\
  \ 中探讨 UI 的一些代码优化策略，并在 `第 6 章，动态图形` 中探讨图形相关的方法。\n\n# 全局光照区域\n\n全局光照区域是 Unity 2017\
  \ 中的另一个新区域，它为我们提供了大量关于 Unity **全局光照 (GI)** 系统的详细信息。如果我们的应用程序使用 GI，那么我们应该参考此区域来验证其是否正常运行。\n\
  \n当我们探索 `第 6 章，动态图形` 中的光照和阴影时，此区域可能会变得有用。\n\n# 性能分析的最佳方法\n\n良好的编码实践和项目资产管理通常使查找性能问题的根本原因变得相对简单，此时唯一的真正问题是弄清楚如何改进代码。例如，如果该方法只处理一个巨大的\
  \ `for` 循环，那么可以相当安全地假设问题要么在于循环执行的迭代次数，要么在于循环是否通过以非顺序方式读取内存而导致缓存未命中，要么在于每次迭代完成了多少工作，或者在于为下一次迭代做准备需要多少工作。\n\
  \n当然，无论我们是单独工作还是在团队环境中工作，我们的代码并不总是以最清晰的方式编写，我们应该时不时地期望对一些糟糕的编码工作进行性能分析。有时我们被迫为了速度而实现一个\
  \ `hacky` 的解决方案，我们并不总有时间回去重构一切以跟上我们的最佳编码实践。事实上，许多以性能优化为名的代码更改往往看起来非常奇怪或晦涩，常常使我们的代码库更难以阅读。软件开发的共同目标是编写干净、功能丰富且快速的代码。实现其中一个目标相对容易，但现实是实现两个目标将花费大得多的时间和精力，而实现所有三个目标几乎是不可能的。\n\
  \n\n\n\n\n在最基本的层面上，性能优化只是另一种形式的问题解决，而在问题解决过程中忽略显而易见的问题可能是一个代价高昂的错误。我们的目标是使用基准测试来观察应用程序，寻找问题行为的实例，然后使用描桩来在代码中搜寻线索，找出问题的根源。不幸的是，我们很容易被无效数据分散注意力，或者因为过于不耐烦而忽略了细微的细节，从而跳到结论。我们中的许多人在软件调试过程中都遇到过这样的情况：如果我们只是挑战并验证了之前的假设，本可以更快地找到问题的根源。追踪性能问题也无不同。\n\
  \n一个任务清单将有助于让我们专注于问题，而不浪费时间去追逐所谓的 _ghosts_。当然，每个项目都不同，都有其独特的挑战需要克服，但以下清单足够通用，应该能够应用于任何\
  \ Unity 项目：\n\n- 验证目标脚本是否存在于场景中\n- 验证脚本在场景中出现的次数是否正确\n- 验证事件的正确顺序\n- 最大限度地减少正在进行的代码更改\n\
  - 最大限度地减少内部干扰\n- 最大限度地减少外部干扰\n\n# 验证脚本存在性\n\n有时，我们期望看到某些东西，但却看不到。这些通常很容易发现，因为人类大脑在模式识别和发现意外差异方面非常擅长。与此同时，有时我们假设某事正在发生，但实际上没有发生。这些通常更难被注意到，因为我们往往在扫描第一种类型的问题，并且假设我们看不到的东西都按预期工作。在\
  \ Unity 的上下文中，一种以这种方式表现的问题是验证我们期望运行的脚本是否实际上存在于场景中。\n\n可以通过在 **Hierarchy** 窗口文本框中输入以下内容来快速验证脚本存在性：\n\
  \n```\n`t:<monobehaviour name>;`\n```\n\n# 验证脚本计数\n\n如果我们正在查看 Profiler 数据，并注意到某个\
  \ `MonoBehaviour` 方法被执行的次数超出预期，或者执行时间比预期长，我们可能想要双重检查它在场景中出现的次数是否符合预期。完全有可能有人在场景文件中创建了比预期更多的对象，或者我们从代码中意外实例化了比预期更多次的对象。如果是这样，问题可能是由于冲突或重复的方法调用生成性能瓶颈。我们可以使用\
  \ *Best approaches to performance analysis* 部分中使用的相同短列表方法来验证计数。\n\n如果我们期望特定数量的组件出现在场景中，但短列表揭示了更多（或更少！）的数量，那么编写一些初始化代码来防止这种情况再次发生可能是明智的。我们还可以编写一些自定义编辑器助手，向可能犯此错误的关卡设计师显示警告。\n\
  \n防止这种粗心的错误对于良好的生产力至关重要，因为经验告诉我们，如果我们不明确禁止某事，那么有人，在某个地方，在某个时刻，出于任何理由，都会这样做。这很可能会让我们花费一个令人沮丧的下午来追踪一个最终发现是由人为错误引起的问题。\n\
  \n例如，将 `t:MyTestMonoBehaviour`（注意它不区分大小写）输入到 **Hierarchy** 文本框中，将显示当前至少有一个 `MyTestMonoBehaviour`\
  \ 脚本作为组件附加的所有 `GameObjects` 的短列表。\n\n请注意，此短列表功能还包括任何与给定脚本名称 *派生* 的组件的 `GameObjects`。\n\
  \n我们还应该双重检查它们附加到的 `GameObjects` 是否仍然启用，因为我们可能在早期测试中禁用了它们，因为有人或某物可能意外停用了对象。\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_47_0.png)\n\
  \n# 验证事件顺序\n\nUnity 应用程序主要作为一系列从原生代码到托管代码的回调来运行。这个概念将在第 8 章《精通内存管理》中更详细地解释，但为了简要总结，Unity\
  \ 的主线程不像简单的控制台应用程序那样运行。在这样的应用程序中，代码会从某个明显的起点（通常是 main() 函数）开始执行，然后我们将直接控制游戏引擎，初始化主要子系统，然后游戏在一个大的\
  \ while 循环（通常称为游戏循环）中运行，该循环检查用户输入、更新游戏、渲染当前场景并重复。这个循环只有在玩家选择退出游戏时才会退出。\n\n相反，Unity\
  \ 为我们处理游戏循环，我们期望 Awake()、Start()、Update() 和 FixedUpdate() 等回调在特定时刻被调用。最大的区别是，我们无法精确控制同类型事件被调用的顺序。当加载新场景时（无论是游戏的第一个场景还是后续场景），每个\
  \ MonoBehaviour 组件的 Awake() 回调都会被调用，但无法知道调用的顺序。\n\n因此，如果我们有一组对象在其 Awake() 回调中配置一些数据，然后另一组对象在其自身的\
  \ Awake() 回调中对这些配置好的数据做些什么，那么场景对象的某些重组或重新创建，或者代码库或编译过程中的随机更改（不清楚究竟是什么原因导致的）可能会导致这些\
  \ Awake() 调用的顺序发生变化，然后依赖的对象可能会尝试对未按我们预期初始化的数据做些什么。MonoBehaviour 组件提供的所有其他回调（如 Start()\
  \ 和 Update()）也是如此。\n\n无法知道同一类型的回调在一组 MonoBehaviour 组件中被调用的顺序，因此我们应该非常小心，不要假设对象回调正在按特定顺序发生。事实上，绝对不应该编写假设这些回调需要按特定顺序调用的代码，因为它随时可能出错。\n\
  \n处理后期初始化的更好位置是在 MonoBehaviour 组件的 Start() 回调中，它总是在每个对象的 Awake() 被调用之后，在其第一个 Update()\
  \ 之前被调用。后期更新也可以在 LateUpdate() 回调中完成。\n\n如果我们难以确定事件的实际顺序，那么最好通过使用 IDE（MonoDevelop、Visual\
  \ Studio 等）进行逐步调试，或者通过使用 `Debug.Log()` 打印简单的日志语句来处理。\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_49_0.png)\n\
  \n请注意，Unity 的日志记录器以昂贵著称。日志记录不太可能改变回调的顺序，但如果过于频繁地使用，可能会导致性能中出现一些不需要的尖峰。要聪明，只在代码库中最相关的部分进行有针对性的日志记录。\n\
  \n协程通常用于脚本化某些事件序列，触发时间取决于使用的 `yield` 类型。最难调试且最不可预测的类型可能是 `WaitForSeconds` yield\
  \ 类型。Unity 引擎是非确定性的，这意味着即使在相同的硬件上，一次会话与下一次会话之间也会有略微不同的行为。例如，在一次会话中，应用程序运行的第一秒内可能会有\
  \ 60 次 Update 调用，下一次会话中有 59 次，再下一次会话中有 62 次。在另一次会话中，第一秒内可能有 61 次 Update 调用，然后是 60\
  \ 次，接着是 59 次。\n\n在协程开始和结束之间，会调用可变数量的 `Update()` 回调，因此如果协程依赖于某个东西的 `Update()` 被调用特定次数，我们就会遇到问题。最好让协程行为简单明了，并且在开始后不依赖于其他行为。打破这条规则可能很诱人，但基本可以肯定，某些未来的更改会以意想不到的方式与协程交互，导致一个长时间、痛苦的调试会话，处理一个非常难以复现的游戏破坏性错误。\n\
  \n# 最大限度地减少正在进行的代码更改\n\n为追踪性能问题而对应用程序进行代码更改最好谨慎进行，因为随着时间的推移，这些更改很容易被遗忘。向代码中添加调试日志语句可能很诱人，但请记住，引入这些调用、重新编译代码以及在分析完成后删除这些调用都需要时间。此外，如果我们忘记删除它们，那么它们可能会在最终构建中造成不必要的运行时开销，因为\
  \ Unity 的调试 **Console** 窗口日志记录在 CPU 和内存方面可能都非常昂贵。\n\n\n\n\n\n一个很好的解决此问题的方法是在每处更改的位置添加带有我们姓名的标记或注释，以便日后轻松找到并移除。希望我们也足够明智，为代码库使用源代码控制工具，从而轻松区分任何修改过的文件的内容，并将其恢复到原始状态。这是确保不必要的更改不会进入最终版本的绝佳方式。当然，如果我们同时也应用了修复，并且在提交更改之前没有仔细检查所有修改过的文件，这绝非万无一失的解决方案。\n\
  \n在运行时调试期间使用断点是首选方法，因为我们可以跟踪完整的调用堆栈、变量数据和条件代码路径（例如，`if-else` 块），而无需冒任何代码更改的风险或浪费时间进行重新编译。当然，这并非总是可行的，例如，当我们试图找出导致一千帧中出现一次奇怪情况的原因时。在这种情况下，最好确定一个要查找的阈值，并添加一个带有内部断点的\
  \ `if` 语句，当该值超过阈值时将触发该断点。\n\n# 最大限度地减少内部干扰\n\nUnity 编辑器有其自身的小怪癖和细微差别，有时会使调试某些类型的问题变得令人困惑。\n\
  \n首先，如果单帧处理时间很长，以至于游戏明显卡顿，则 Profiler 可能无法捕获结果并将其记录在 Profiler 窗口中。如果我们希望在应用程序/场景初始化期间捕获数据，这尤其令人恼火。即将到来的“自定义\
  \ CPU 性能分析”部分将提供一些替代方案来解决此问题。\n\n一个常见的错误（我坦诚地在撰写本书期间多次中招）是，如果我们试图通过按键启动测试并打开了 **Profiler**，则不应忘记在触发按键之前单击回到编辑器的\
  \ Game 窗口。如果 Profiler 是最近被点击的窗口，则编辑器会将按键事件发送到该窗口，而不是运行时应用程序，因此没有 `GameObject` 会捕获该按键的事件。这也适用于用于渲染任务的\
  \ GameView 以及使用 `WaitForEndOfFrame yield` 类型的协程。如果 **Game** 窗口在编辑器中不可见且未激活，则没有任何内容被渲染到该视图，因此，任何依赖\
  \ **Game** 窗口渲染的事件都不会被触发。请注意！\n\n垂直同步（又称 VSync）用于将应用程序的帧率与显示设备的帧率匹配，例如，显示器可能以 60\
  \ 赫兹（每秒 60 个周期）运行，如果游戏中的渲染循环运行速度快于此，则它会等待直到该时间过去后才输出渲染帧。此功能可减少屏幕撕裂，屏幕撕裂发生在新图像在前一图像完成之前被推送到显示器时，短暂瞬间新图像的一部分与旧图像重叠。\n\
  \n在启用 **VSync** 的情况下执行 **Profiler** 可能会在 CPU 使用率区域的 **WaitForTargetFPS** 标题下产生大量噪声尖峰，因为应用程序故意减速以匹配显示器的帧率。这些尖峰在编辑器模式下通常看起来非常大，因为编辑器通常渲染到一个非常小的窗口，渲染不需要大量\
  \ CPU 或 GPU 工作。\n\n这会产生不必要的杂乱，使发现真正的问题变得更加困难。在性能测试期间寻找 CPU 尖峰时，我们应确保在 CPU 使用率区域下禁用\
  \ **VSync** 复选框。我们可以通过导航到 **Edit | Project Settings | Quality**，然后转到当前选定平台的子页面来完全禁用\
  \ VSync 功能。\n\n我们还应确保性能下降不是编辑器 **Console** 窗口中大量异常和错误消息的直接结果。Unity 的 `Debug.Log()`\
  \ 和类似方法，如 `Debug.LogError()` 和 `Debug.LogWarning()` 在 CPU 使用率和堆内存消耗方面臭名昭著地昂贵，这可能导致垃圾回收发生，并浪费更多\
  \ CPU 周期（有关这些主题的更多信息，请参阅第 8 章，精通内存管理）。\n\n这种开销通常对于在编辑器模式下查看项目的人来说是不可察觉的，其中大多数错误来自编译器或配置错误的对象。然而，在任何类型的运行时过程中使用它们可能会很麻烦，尤其是在性能分析期间，我们希望在没有外部干扰的情况下观察游戏的运行情况。例如，如果我们缺少本应通过编辑器分配的对象引用，并且它在\
  \ `Update()` 回调中被使用，那么单个 `MonoBehaviour` 可能会在每次更新时抛出新异常。这会给我们的性能分析数据增加大量不必要的噪声。\n\
  \n请注意，我们可以使用下一张截图中显示的按钮隐藏不同的日志级别类型。额外的日志记录仍然会消耗 CPU 和内存来执行，即使它们没有被渲染，但这确实允许我们过滤掉不想要的垃圾。不过，保持所有这些选项都启用通常是一种良好的做法，以验证我们没有遗漏任何重要内容。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_52_0.png)\n\n# 最大限度地减少外部干扰\n\n这一点简单但绝对必要。我们应双重检查是否没有后台进程消耗\
  \ CPU 周期或占用大量内存。可用内存不足通常会干扰我们的测试，因为它可能导致更多缓存未命中、用于虚拟内存页面文件交换的硬盘访问，以及应用程序响应速度普遍变慢。如果我们的应用程序突然表现得比预期差得多，请双重检查系统的任务管理器（或等效工具）中的任何\
  \ CPU/内存/硬盘活动，这些活动可能正在引起问题。\n\n# 针对代码段的定向性能分析\n\n如果先前提到的检查清单未能解决我们的性能问题，那么我们可能确实面临一个需要进一步分析的真实问题。Profiler\
  \ 窗口能有效地向我们展示性能的广泛概览；它可以帮助我们找到要调查的特定帧，并快速告知我们哪个 `MonoBehaviour` 和/或方法可能正在引起问题。然后我们需要弄清楚问题是否可复现，在什么情况下会出现性能瓶颈，以及问题在有问题的代码块中的具体位置。\n\
  \n为了实现这些，我们需要对代码的目标部分进行一些性能分析，并且有几种有用的技术可用于此任务。对于 Unity 项目，它们基本上分为两类：\n\n- 从脚本代码控制\
  \ Profiler\n- 自定义计时和日志记录方法\n\n请注意，下一部分侧重于如何通过 C# 代码调查脚本瓶颈。其他引擎子系统中瓶颈源的检测将在相关章节中讨论。\n\
  \n# Profiler 脚本控制\n\nProfiler 可以通过 `Profiler` 类在脚本代码中进行控制。这个类中有几种有用的方法，我们可以在 Unity\
  \ 文档中探索，但最重要的方法是分隔符方法，它们在运行时激活和停用性能分析。这些方法可以通过 `UnityEngine.Profiling.Profiler`\
  \ 类的 `BeginSample()` 和 `EndSample()` 方法访问。\n\n请注意，分隔符方法 `BeginSample()` 和 `EndSample()`\
  \ 仅在开发构建中编译，因此，在未勾选 **Development Mode** 的发布构建中，它们不会被编译或执行。这通常被称为 _非操作_ 或 _no-op_\
  \ 代码。\n\n`BeginSample()` 方法有一个重载，允许为样本自定义名称以便在 CPU 使用率区域的层次结构模式下显示。例如，以下代码将对该方法的调用进行性能分析，并使数据在\
  \ **Breakdown View** 下以自定义标题显示，如下所示：\n\n```csharp\nvoid DoSomethingCompletelyStupid()\
  \ {\n    Profiler.BeginSample(\"My Profiler Sample\");\n    List<int> listOfInts\
  \ = new List<int>();\n    for(int i = 0; i < 1000000; ++i) {\n        listOfInts.Add(i);\n\
  \    }\n    Profiler.EndSample();\n}\n```\n\n您可以从 http://www.packtpub.com 的帐户下载您购买的所有\
  \ Packt Publishing 图书的示例代码文件。如果您在其他地方购买了此书，可以访问 http://www.packtpub.com/support\
  \ 并注册，以便文件直接发送到您的电子邮件。\n\n\n\n\n\n# 自定义 CPU 性能分析\n\n性能分析器只是我们可用的工具之一。有时，我们可能希望对代码进行自定义性能分析和日志记录。也许我们不确定\
  \ Unity 性能分析器是否给出了正确的答案，也许我们认为其开销成本过高，或者也许我们只是喜欢对应用程序的每个方面拥有完全控制权。无论我们的动机是什么，了解一些独立分析代码的技能是很有用的。毕竟，我们不太可能在整个游戏开发生涯中都只使用\
  \ Unity。\n\n性能分析工具通常非常复杂，因此我们不太可能在合理的时间内自己生成一个可比拟的解决方案。在测试 CPU 使用率时，我们真正需要的只是一个准确的计时系统、一种快速且低成本的记录该信息的方法，以及一段用于测试的代码。幸运的是，.NET\
  \ 库（或者更准确地说是 Mono 框架）在 System.Diagnostics 命名空间下提供了一个 Stopwatch 类。我们可以随时启动和停止 Stopwatch\
  \ 对象，并轻松获取自 Stopwatch 启动以来经过的时间。\n\n不幸的是，这个类并不完全准确；它最多只能精确到毫秒或毫秒的十分之一。当我们开始深入研究时，使用\
  \ CPU 时钟计算高精度实时可能是一项出乎意料的困难任务；因此，为了避免详细讨论这个话题，我们应该尝试找到一种方法让 Stopwatch 类满足我们的需求。\n\
  \n如果精度很重要，那么提高精度的一种有效方法是多次运行相同的测试。假设测试代码块既容易重复又不特别长，我们应该能够在合理的时间内运行成千上万甚至数百万次测试，然后将总耗时除以刚刚执行的测试次数，以获得单次测试的更准确时间。\n\
  \n在沉迷于高精度话题之前，我们应该先问自己是否真的需要它。大多数游戏期望以 30 FPS 或 60 FPS 运行，这意味着它们分别只有大约 33 毫秒或 16\
  \ 毫秒来计算整个帧的所有内容。因此，假设我们只需要将某个特定代码块的性能控制在十毫秒以内，那么重复测试数千次以获得微秒精度与目标相差太多数量级，不值得这样做。\n\
  \n以下是一个类定义，用于自定义计时器，它使用 Stopwatch 来计算给定测试次数的时间：\n\n```csharp\nusing System;\nusing\
  \ System.Diagnostics;\npublic class CustomTimer : IDisposable {\n    private string\
  \ _timerName;\n    private int _numTests;\n    private Stopwatch _watch;\n    //\
  \ give the timer a name, and a count of the\n    // number of tests we're running\n\
  \    public CustomTimer(string timerName, int numTests) {\n        _timerName =\
  \ timerName;\n        _numTests = numTests;\n        if (_numTests <= 0) {\n   \
  \         _numTests = 1;\n        }\n        _watch = Stopwatch.StartNew();\n  \
  \  }\n    // automatically called when the 'using()' block ends\n    public void\
  \ Dispose() {\n        _watch.Stop();\n        float ms = _watch.ElapsedMilliseconds;\n\
  \        UnityEngine.Debug.Log(string.Format(\"{0} finished: {1:0.00} \" +\n   \
  \     \"milliseconds total, {2:0.000000} milliseconds per-test \" +\n        \"\
  for {3} tests\", _timerName, ms, ms / _numTests, _numTests));\n    }\n}\n```\n\n\
  在成员变量名前加下划线是区分类成员变量（也称为字段）与方法参数和局部变量的一种常见且有用的方法。\n\n以下是 `CustomTimer` 类用法示例：\n\n\
  ```csharp\nconst int numTests = 1000;\nusing (new CustomTimer(\"My Test\", numTests))\
  \ {\n    for(int i = 0; i < numTests; ++i) {\n        TestFunction();\n    }\n}\
  \ // the timer's Dispose() method is automatically called here\n```\n\n使用此方法时有三点需要注意。首先，我们只是对多次方法调用求平均值。如果调用之间的处理时间差异巨大，那么最终平均值将无法很好地反映这一点。\n\
  \n其次，如果内存访问很常见，那么反复请求相同的内存块会导致人为更高的缓存命中率（CPU 可以非常快速地在内存中找到数据，因为它最近访问过同一区域），与典型调用相比，这会降低平均时间。\n\
  \n第三，由于类似的人为原因，**即时编译（JIT）**的效果将被有效隐藏，因为它只影响方法的第一次调用。JIT 编译是 .NET 的一项功能，将在第 8 章\
  \ *精通内存管理* 中更详细地介绍。\n\n`using` 块通常用于安全地确保非托管资源在超出作用域时被正确销毁。当 `using` 块结束时，它会自动调用对象的\
  \ `Dispose()` 方法来处理任何清理操作。为了实现这一点，对象必须实现 IDisposable 接口，这强制它定义 `Dispose()` 方法。\n\
  \n然而，同样的语言特性可以用于创建一个独立的代码块，该代码块创建一个短期对象，并在代码块结束时自动处理一些有用的事情，这正是前面代码块中使用它的方式。\n\n\
  > 请注意，`using` 块不应与 `using` 语句混淆，后者用于脚本文件开头以引入其他命名空间。C# 中用于管理命名空间的关键字与另一个关键字存在命名冲突，这极具讽刺意味。\n\
  \n因此，`using` 块和 `CustomTimer` 类为我们提供了一种干净的方式来包装测试代码，使其使用的时间和地点变得显而易见。\n\n另一个需要担心的问题是应用程序预热时间。当场景开始时，Unity\
  \ 有相当大的启动开销，因为需要从磁盘加载大量数据，初始化复杂的子系统（如物理系统和渲染系统），并且在其他任何事情发生之前，需要解决大量对各种 `Awake()`\
  \ 和 `Start()` 回调的调用。这种早期开销可能只持续一秒钟，但如果代码也在早期初始化期间执行，这会对测试结果产生重大影响。因此，如果我们想要准确的测试，那么任何运行时测试都应在应用程序达到稳定状态后才开始。\n\
  \n理想情况下，我们应该能够在其初始化完成后在独立的场景中执行目标代码块。但这并不总是可能的，因此作为备选方案，我们可以将目标代码块包装在 `Input.GetKeyDown()`\
  \ 检查中，以便控制其调用时间。例如，以下代码仅在按下空格键时执行我们的测试方法：\n\n```csharp\nif (Input.GetKeyDown(KeyCode.Space))\
  \ {\n    const int numTests = 1000;\n    using (new CustomTimer(\"Controlled Test\"\
  , numTests)) {\n        for(int i = 0; i < numTests; ++i) {\n            TestFunction();\n\
  \        }\n    }\n}\n```\n\n如前所述，Unity 的 **Console** 窗口日志记录机制开销极高。因此，我们应该尽量避免在性能分析测试过程中（或在游戏过程中）使用这些日志记录方法。如果我们确实需要详细的性能分析数据并打印出大量单独的消息（例如，对循环进行计时测试以找出哪次迭代耗时更多），那么最好缓存日志数据并在最后一次性全部打印出来，就像\
  \ `CustomTimer` 类所做的那样。这将降低运行时开销，代价是一些内存消耗。另一种选择是，在测试过程中打印每个 `Debug.Log()` 消息会损失许多毫秒，这会污染结果。\n\
  \n`CustomTimer` 类还使用了 `string.Format()`。这将在第 8 章 *精通内存管理* 中更详细地介绍，但简短的解释是，之所以使用此方法，是因为使用\
  \ `+` 运算符生成自定义 `string` 对象（例如 `Debug.Log(\"Test: \" + output);` 这样的代码）可能会导致惊人的大量内存分配，从而引起垃圾回收器的注意。这样做将与我们实现准确计时和分析的目标相冲突，应予以避免。\n\
  \n# 关于性能分析与分析的最后思考\n\n思考性能优化的一种方式是 _剔除消耗宝贵资源的不必要任务的行为_。我们也可以通过尽量减少任何浪费的努力来最大化自己的生产力。有效利用我们现有的工具至关重要。通过了解一些最佳实践和技术来优化我们自己的工作流程，这对我们大有裨益。\n\
  \n关于如何正确使用任何数据收集工具的大部分（如果不是全部）建议可以总结为三种不同的策略：\n\n- 理解工具\n- 减少噪声\n- 关注问题\n\n\n\n\n\
  \n# 了解性能分析器\n\n性能分析器（Profiler）是一个设计精良且直观的工具，因此，通过花一两个小时在测试项目中探索其选项并阅读其文档，就能掌握其大部分功能。我们对工具的了解越多——包括其优点、陷阱、功能和局限性——就越能理解它提供的信息，因此值得花时间在试验环境中使用它。我们不希望在距离发布还有两周时，面对一百个待修复的性能缺陷，却不知道如何高效地进行性能分析。\n\
  \n例如，始终要意识到 **时间线视图（Timeline View）** 图形显示的相对性。**时间线视图** 的垂直轴不提供数值，并且会根据最后 300 帧的内容自动重新调整该轴；由于相对变化，它可能会让微小的尖峰看起来比实际更严重。因此，仅仅因为时间线中的尖峰或静止状态看起来很大且具有威胁性，并不一定意味着存在性能问题。\n\
  \n时间线视图中的几个区域提供了有用的基准条，它们表现为带有计时和 FPS 值的水平线。这些基准条应用于确定问题的严重程度。不要让性能分析器欺骗我们，认为大尖峰总是不好的。一如既往，只有当用户会注意到它时才重要。\n\
  \n例如，如果大的 CPU 使用率尖峰没有超过 60 FPS 或 30 FPS 基准条（取决于应用程序的目标帧率），那么明智的做法是忽略它，并在其他地方寻找 CPU\
  \ 性能问题，因为无论我们改进有问题的代码片段多少，最终用户可能都不会注意到它，因此它不是影响用户体验的关键问题。\n\n# 减少噪声\n\n计算机科学领域中噪声的经典定义（至少）是无意义的数据，而盲目捕获且没有特定目标的性能分析数据批次总是充满了我们不感兴趣的数据。更多的数据来源需要更多时间来心理处理和过滤，这会非常分散注意力。避免这种情况的最佳方法之一，就是简单地减少我们需要处理的数据量，剔除任何被认为与当前情况无关的数据。\n\
  \n减少性能分析器图形界面中的杂乱，将更容易确定哪些子系统正在导致资源使用量激增。请记住，使用每个时间线视图区域中的彩色复选框来缩小搜索范围。\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_60_0.png)\n\
  \n请注意，这些设置会在编辑器中自动保存，因此请确保在下一次性能分析会话中重新启用它们，因为这可能会导致我们下次错过重要的内容。\n\n另外，可以停用 `GameObjects`\
  \ 以防止它们生成性能分析数据，这也有助于减少性能分析数据中的杂乱。这自然会为每个停用的对象带来轻微的性能提升。但是，如果我们逐渐停用对象，并且在停用特定对象后性能突然变得显著更好，那么显然该对象与问题的根本原因有关。\n\
  \n# 专注于问题\n\n鉴于我们已经讨论了减少噪声，这一类别可能看起来有些多余。我们剩下的不应该只是手头的问题吗？不完全是。专注是不让自己被无关紧要的任务和徒劳的追寻所分散注意力的技能。\n\
  \n请记住，使用 Unity 性能分析器进行性能分析会带来轻微的性能开销。使用 **深度性能分析（Deep Profiling）** 选项时，这种开销会更加严重。我们甚至可能通过额外的日志记录向应用程序引入更多轻微的性能开销。如果搜索持续数小时，很容易忘记何时何地引入了性能分析代码。\n\
  \n我们实际上是在通过测量来改变结果。在数据采样期间实施的任何更改有时会导致我们追逐应用程序中不存在的错误，而如果我们尝试在没有额外性能分析插件的情况下复制场景，本可以节省大量时间。如果瓶颈在没有性能分析的情况下也可复现且明显，那么它就是开始调查的候选对象。但是，如果在现有调查过程中不断出现新的瓶颈，请记住，它们可能是我们测试代码引入的瓶颈，而不是新暴露的现有问题。\n\
  \n最后，当我们完成性能分析，完成修复，并准备好进行下一次调查时，我们应该确保最后一次性能分析应用程序，以验证更改是否产生了预期的效果。\n\n# 总结\n\n\
  在本章中，你学到了大量关于如何检测和分析应用程序中性能问题的知识。你了解了性能分析器的许多功能和秘密，探索了各种以更实践为导向的调查性能问题的策略，并接触了各种不同的技巧和策略。只要你理解其背后的智慧，并在情况允许时记住利用它们，就可以利用这些来极大地提高你的生产力。\n\
  \n本章向我们介绍了寻找需要改进的性能问题所需的技巧、策略和方法。在剩余章节中，我们将探讨在可能的情况下如何修复问题并提高性能的方法。所以，为自己先度过枯燥的部分而鼓掌，让我们继续学习一些优化\
  \ C# 脚本的方法。\n"
- "# 2 脚本策略\n\n由于脚本编写将占用我们大量的开发时间，因此学习一些最佳实践将大有裨益。脚本编写是一个非常广泛的术语，因此我们将在本章中将接触范围限制在非常特定于\
  \ Unity 的情况上，重点关注围绕 MonoBehaviours、GameObjects 和相关功能的问题。\n\n> 我们将在第 8 章《精通内存管理》中讨论\
  \ C# 语言、.NET 库和 Mono 框架的细微差别和高级主题。\n\n在本章中，我们将探讨将性能增强应用于以下领域的方法：\n\n- 访问组件\n- 组件回调（Update()、Awake()\
  \ 等）\n- 协程\n- GameObject 和 Transform 的使用\n- 对象间通信\n- 数学计算\n- 反序列化，例如场景和预制体加载\n\n\
  无论你是有想要解决的特定问题，还是只是想学习一些技术以备将来参考，本章都将向你介绍一系列广泛的方法，你可以用它们来改善当前和未来的脚本编写工作。在每种情况下，我们将探讨性能问题如何以及为何产生，问题出现的示例情况，以及一种或多种解决该问题的方案。\n\
  \n# 使用最快方法获取组件\n\n`GetComponent()` 方法有几种变体，它们各自的性能开销不同，因此调用此方法的最快版本变得明智。可用的三个重载是\
  \ `GetComponent(string)`、`GetComponent<T>()` 和 `GetComponent(typeof(T))`。事实证明，最快的版本取决于我们运行的\
  \ Unity 版本，因为多年来对这些方法进行了多项优化；但是，在 Unity 5 的所有后续版本以及 Unity 2017 的初始版本中，最好使用 `GetComponent<T>()`\
  \ 变体。\n\n让我们通过一些简单的测试来证明这一点：\n\n```csharp\nint numTests = 1000000;\nTestComponent\
  \ test;\nusing (new CustomTimer(\"GetComponent(string)\", numTests)) {\n for (var\
  \ i = 0; i < numTests; ++i) {\n test = (TestComponent)GetComponent(\"TestComponent\"\
  );\n }\n}\nusing (new CustomTimer(\"GetComponent<ComponentName>\", numTests)) {\n\
  \ for (var i = 0; i < numTests; ++i) {\n test = GetComponent<TestComponent>();\n\
  \ }\n}\nusing (new CustomTimer(\"GetComponent(typeof(ComponentName))\", numTests))\
  \ {\n for (var i = 0; i < numTests; ++i) {\n test = (TestComponent)GetComponent(typeof(TestComponent));\n\
  \ }\n}\n```\n\n前面的代码对每个 `GetComponent()` 重载进行了百万次测试。这远超典型项目合理的测试次数，但有助于清楚地说明相对成本。\n\
  \n测试完成后我们得到的结果如下：\n\n```\n! GetComponent(string) finished: 6413.00ms total, 0.006413ms\
  \ per test for 1000000 tests\nUnityEngine.Debug:Log(Object)\n! GetComponent<ComponentName>\
  \ finished: 89.00ms total, 0.000089ms per test for 1000000 tests\nUnityEngine.Debug:Log(Object)\n\
  ! GetComponent(typeof(ComponentName)) finished: 95.00ms total, 0.000095ms per test\
  \ for 1000000 tests\nUnityEngine.Debug:Log(Object)\n```\n\n\n\n\n\nAs you can see,\
  \ the `GetComponent<T>()` method is only a tiny fraction faster than `GetComponent(typeof(T))`,\
  \ whereas `GetComponent(string)` is significantly slower than the alternatives.\
  \ Therefore, it is pretty safe to use either of the type-based versions of `GetComponent()`\
  \ because of the small performance difference. However, we should ensure that we\
  \ never use `GetComponent(string)` since the outcome is identical, and there is\
  \ no benefit for the costs incurred. There are some very rare exceptions, like if\
  \ we were writing a custom debug console for Unity, which might parse a user-inputted\
  \ `string` to acquire a Component. In any case, these would be used for debugging\
  \ and diagnostics situations only, where performance isn't too important. For a\
  \ production-level application, the use of `GetComponent(string)` is just a needless\
  \ waste.\n\n# Remove empty callback definitions\n\nThe primary means of scripting\
  \ in Unity is to write callback functions in classes derived from `MonoBehaviour`,\
  \ which we know Unity will call when necessary. Perhaps the four most commonly used\
  \ callbacks are `Awake()`, `Start()`, `Update()`, and `FixedUpdate()`.\n\n`Awake()`\
  \ is called the moment a `MonoBehaviour` is first created, whether this occurs during\
  \ Scene initialization or when a new `GameObject` containing the `MonoBehaviour`\
  \ is instantiated at runtime from a Prefab. `Start()` will be called shortly after\
  \ `Awake()` but before its first `Update()`. During Scene initialization, every\
  \ `MonoBehaviour` Component's `Awake()` callback will be called before any of their\
  \ `Start()` callbacks are.\n\nAfter this, `Update()` will be called repeatedly,\
  \ each time the Rendering Pipeline presents a new image. `Update()` will continue\
  \ to be called provided the `MonoBehaviour` is still present in the Scene, it is\
  \ still enabled, and its parent `GameObject` is active.\n\nFinally, `FixedUpdate()`\
  \ is called just prior to when the Physics Engine updates. Fixed Updates are used\
  \ whenever we want activity similar in behavior to `Update()` but that isn't tied\
  \ directly to the render frame rate and is called more consistently over time.\n\
  \nRefer to the following page in the Unity documentation for an accurate picture\
  \ of when various Unity callbacks are called: https://docs.unity3d.com/Manual/ExecutionOrder.html.\n\
  \nWhenever a MonoBehaviour is first instantiated in our Scene, Unity will add any\
  \ defined callbacks to a list of function pointers, which it will call at key moments.\
  \ However, it is important to realize that Unity will hook into these callbacks\
  \ even if the function body is empty. The core Unity Engine has no awareness that\
  \ these function bodies may be empty and only knows that the method has been defined\
  \ and, therefore, that it must acquire it and then call it when necessary. Consequently,\
  \ if we leave empty definitions of these callbacks scattered throughout the codebase,\
  \ then they will waste a small amount of CPU due to the overhead cost of the engine\
  \ invoking them.\n\nThis can be a problem since any time we create a new MonoBehaviour\
  \ script file in Unity, it will automatically generate two boilerplate callback\
  \ stubs for us for Start() and Update():\n\n```\n// Use this for initialization\n\
  void Start () {\n}\n\n// Update is called once per-frame\nvoid Update () {\n}\n\
  ```\n\nIt can be easy to accidentally leave these empty definitions on scripts that\
  \ don't actually need them. An empty Start() definition is liable to cause any object\
  \ to initialize a little slower, for no good reason. This effect may not be particularly\
  \ noticeable for a handful of MonoBehaviours, but as development on the project\
  \ continues and we populate our scenes with thousands of custom MonoBehaviours with\
  \ lots of empty Start() definitions, it could start to become a problem, causing\
  \ slow Scene initialization and wasting CPU time whenever a new Prefab is created\
  \ via GameObject.Instantiate().\n\nSuch calls typically happen during key gameplay\
  \ events; for instance, when two objects collide, we might spawn a Particle Effect,\
  \ create some floating damage text, play a sound effect, and so on. This can be\
  \ a critical moment for performance, because we've suddenly requested that the CPU\
  \ make a lot of complicated changes, but with only a finite amount of time to complete\
  \ them before the current frame ends. If this process takes too long, then we would\
  \ experience a frame drop as the Rendering Pipeline isn't allowed to present a new\
  \ frame until all of the Update() callbacks (counted across all MonoBehaviours in\
  \ the Scene!) have finished. Ergo, a bunch of empty Start() definitions being called\
  \ at this time is a needless waste and could potentially cut into our tight time-budget\
  \ at a critical moment.\n\nMeanwhile, if our Scene contains thousands of MonoBehaviours\
  \ with these empty Update() definitions, then we would be wasting a lot of CPU cycles\
  \ every frame, potentially causing havoc on our frame rate.\n\nLet's prove all of\
  \ this with a simple test. Our test Scene should have GameObjects with two types\
  \ of Component, EmptyClassComponent with no methods defined at all and EmptyCallbackComponent\
  \ with an empty Update() callback defined:\n\n```\npublic class EmptyClassComponent\
  \ : MonoBehaviour {\n}\n\npublic class EmptyCallbackComponent : MonoBehaviour {\n\
  void Update () {}\n}\n```\n\nThe following are the test results for 30,000 Components\
  \ of each type. If we enable all GameObjects with attached EmptyClassComponents\
  \ during runtime, then nothing interesting happens under the CPU Usage Area of the\
  \ Profiler. There will be a small amount of background activity, but none of this\
  \ activity will be caused by the EmptyClassComponents. However, as soon as we enable\
  \ all objects with EmptyCallbackComponent, we will observe a huge increase in CPU\
  \ usage:\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_66_0.png)\n\nIt’s hard to imagine\
  \ a Scene with more than 30,000 objects in it, but keep in mind that `MonoBehaviour`s\
  \ contain the `Update()` callback, not `GameObject`s. A single `GameObject` can\
  \ contain multiple `MonoBehaviour`s at once, and each of their children can contain\
  \ even more `MonoBehaviour`s, and so on. A few thousand or even a hundred empty\
  \ `Update()` callbacks will inflict a noticeable impact on frame rate budget, for\
  \ zero potential gain. This is particularly common with Unity UI Components which\
  \ tend to attach a lot of different Components in a very deep hierarchy.\n\nThe\
  \ fix for this is simple: delete the empty callback definitions. Unity will have\
  \ nothing to hook into, and nothing will be called. Finding such empty definitions\
  \ in an expansive codebase may be difficult, but if we use some basic regular expressions\
  \ (known as _regex_), we should be able to find what we’re looking for relatively\
  \ easily.\n\nAll common code-editing tools for Unity, such as MonoDevelop, Visual\
  \ Studio, and even Notepad++, provide a way to perform a regex-based search on the\
  \ entire codebase. Check out the tool’s documentation for more information, since\
  \ the method can vary greatly depending on the tool and its version.\n\nThe following\
  \ regex search should find any empty `Update()` definitions in our code:\n\n`void\\\
  \\s*Update\\\\s*\\\\((\\\\s*?)\\\\s*?\\\\n*?\\\\{(\\\\n*?\\\\s*?)*?\\\\}`\n\nThis\
  \ regex checks for a standard method definition of the `Update()` callback, while\
  \ including any surplus whitespace and newline characters that can be distributed\
  \ throughout the method definition.\n\nNaturally, all of the above is also true\
  \ for the non-boilerplate Unity callbacks, such as `OnGUI()`, `OnEnable()`, `OnDestroy()`,\
  \ and `LateUpdate()`. The only difference is that only `Start()` and `Update()`\
  \ are defined automatically in a new script. Check out the `MonoBehaviour` Unity\
  \ Documentation page for a complete list of these callbacks at `http://docs.unity3d.com/ScriptReference/MonoBehaviour.html`.\n\
  \nIt might also seem unlikely that someone generated so many empty versions of these\
  \ callbacks in our codebase, but never say never. For example, if we use a common\
  \ base class `MonoBehaviour` throughout all of our custom Components, then a single\
  \ empty callback definition in that base class will permeate the entire game, which\
  \ can cost us dearly. Be particularly careful of the `OnGUI()` method, as it can\
  \ be invoked multiple times within the same frame or UI event.\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_67_0.png)\n\
  \n\n\n\n\n也许 Unity 脚本中性能问题最常见的根源，就是滥用 `Update()` 回调，具体表现为以下一种或多种行为：\n\n- 反复重新计算一个很少或根本不会改变的值\n\
  - 让过多的组件为本可以共享的结果执行工作\n- 执行工作的频率远高于必要程度\n\n值得养成的习惯是牢记：我们在 `Update()` 回调以及由这些回调调用的函数中编写的每一行代码，都会侵蚀我们的帧率预算。要达到\
  \ 60 fps，我们每帧只有 16.667 毫秒来完成所有 `Update()` 回调中的所有工作。在开始原型制作时，这似乎是充足的时间，但在开发中期，我们可能会开始注意到事情变得越来越慢、响应越来越迟钝，因为我们一直在逐渐消耗这个预算，原因是我们不受控制地想往项目中塞入更多内容。\n\
  \n让我们来看看一些直接解决这些问题的技巧。\n\n# 缓存组件引用\n\n在 Unity 中编写脚本时，反复重新计算一个值是一个常见的错误，尤其是在涉及 `GetComponent()`\
  \ 方法时。例如，以下脚本代码试图检查生物的生命值，如果生命值低于 `0`，它将禁用一系列组件，为死亡动画做准备：\n\n```c\nvoid TakeDamage()\
  \ {\n    RigidBody rigidbody = GetComponent<RigidBody>();\n    Collider collider\
  \ = GetComponent<Collider>();\n    AIControllerComponent ai = GetComponent<AIControllerComponent>();\n\
  \    Animator anim = GetComponent<Animator>();\n\n    if (GetComponent<HealthComponent>().health\
  \ < 0) {\n        rigidbody.enabled = false;\n        collider.enabled = false;\n\
  \        ai.enabled = false;\n        anim.SetTrigger(\"death\");\n    }\n}\n```\n\
  \n每次执行这个优化不佳的方法时，都会重新获取五个不同的组件引用。这对 CPU 使用率并不友好。如果主方法是在 `Update()` 中调用的，这尤其成问题。即使不是，它仍然可能与其他重要事件同时发生，例如创建粒子效果、用布娃娃替换对象（从而触发物理引擎中的各种活动）等等。这种编码风格看似无害，但可能会带来很多长期问题和运行时工作，而收益却很小。\n\
  \n缓存这些引用以供将来使用，只需花费少量内存空间（每次仅 32 或 64 位；取决于 Unity 版本、平台和碎片情况）。因此，除非你在内存上极度瓶颈，否则更好的方法是在初始化期间获取引用，并保留它们直到需要：\n\
  \n```c\nprivate HealthComponent _healthComponent;\nprivate Rigidbody _rigidbody;\n\
  private Collider _collider;\nprivate AIControllerComponent _ai;\nprivate Animator\
  \ _anim;\n\nvoid Awake() {\n    _healthComponent = GetComponent<HealthComponent>();\n\
  \    _rigidbody = GetComponent<Rigidbody>();\n    _collider = GetComponent<Collider>();\n\
  \    _ai = GetComponent<AIControllerComponent>();\n    _anim = GetComponent<Animator>();\n\
  }\n\nvoid TakeDamage() {\n    if (_healthComponent.health < 0) {\n        _rigidbody.detectCollisions\
  \ = false;\n        _collider.enabled = false;\n        _ai.enabled = false;\n \
  \       _anim.SetTrigger(\"death\");\n    }\n}\n```\n\n以这种方式缓存组件引用，可以避免每次需要时都重新获取它们，每次都能节省一些\
  \ CPU 开销。代价是少量额外的内存消耗，这通常是值得的。\n\n同样的技巧适用于我们决定在运行时计算的几乎任何数据。没有必要让 CPU 在每次 `Update()`\
  \ 中不断重新计算同一个值，我们可以直接将其存储在内存中以供将来引用。\n\n# 共享计算输出\n\n通过让多个对象共享某个计算的结果，可以节省性能；当然，这只有在所有对象都会生成相同结果时才有效。这种情况通常容易发现，但重构起来可能比较棘手，因此利用这一点高度依赖于具体实现。\n\
  \n一些示例可能包括：在场景中查找对象、从文件读取数据、解析数据（如 XML 或 JSON）、在大列表或深层信息字典中查找某物、为一组 **人工智能（AI）**\
  \ 对象计算路径、复杂的类似轨迹的数学计算、射线检测等等。\n\n考虑每次执行昂贵操作时，思考它是否从多个位置调用但始终产生相同的输出。如果是这种情况，那么最好重构事物，使结果只计算一次，然后分发给每个需要它的对象，以尽量减少重新计算的数量。最大的成本通常只是代码简单性的微小损失，尽管传递值可能会带来一些额外开销。\n\
  \n请注意，很容易养成将某个大型复杂函数隐藏在基类中的习惯，然后定义使用该函数的派生类，完全忘记该函数有多昂贵，因为我们很少再查看那段代码。最好使用 Unity\
  \ 性能分析器来告诉我们那个昂贵函数可能被调用多少次，一如既往，除非已被证明是性能问题，否则不要过早优化那些函数。无论它多么昂贵，如果它不会导致我们超过性能限制（如帧率和内存消耗），那么它就不算真正的性能问题。\n\
  \n# Update、协程和 InvokeRepeating\n\n另一种容易陷入的习惯是在 `Update()` 回调中以远高于必要的频率反复调用某些东西。例如，我们可能从以下情况开始：\n\
  \n```c\nvoid Update() {\n    ProcessAI();\n}\n```\n\n在这种情况下，我们每帧都在调用某个自定义的 `ProcessAI()`\
  \ 子例程。这可能是一项复杂的任务，需要 AI 系统检查某个网格系统来确定它应该移动到哪里，或确定一组飞船的舰队机动，或者我们游戏 AI 所需的任何其他内容。\n\
  \n如果这项活动过度侵蚀了我们的帧率预算，并且该任务可以以低于每帧一次的频率完成且没有显著缺点，那么一个改善性能的好技巧就是简单地降低 `ProcessAI()`\
  \ 被调用的频率：\n\n```c\nprivate float _aiProcessDelay = 0.2f;\nprivate float _timer =\
  \ 0.0f;\nvoid Update() {\n    _timer += Time.deltaTime;\n    if (_timer > _aiProcessDelay)\
  \ {\n        ProcessAI();\n        _timer -= _aiProcessDelay;\n    }\n}\n```\n\n\
  在这种情况下，我们通过每秒仅调用 `ProcessAI()` 约五次，降低了 `Update()` 回调的总体开销，这比之前的情况有所改进，代价是代码乍一看可能需要一点时间才能理解，以及少量额外内存来存储一些浮点数据。不过，归根结底，我们仍然让\
  \ Unity 比必要时更频繁地调用一个空回调函数。\n\n这个函数是一个完美的示例，我们可以将其转换为协程，以利用其延迟调用属性。如前所述，协程通常用于编写短事件序列，无论是一次性还是重复动作。它们不应与线程混淆，线程会在完全不同的\
  \ CPU 核心上以并发方式运行，并且多个线程可以同时运行。相反，协程在主线程上以顺序方式运行，这样在任何给定时刻只处理一个协程，并且每个协程通过 `yield`\
  \ 语句决定何时暂停和恢复。以下代码是将上述 `Update()` 回调重写为协程的示例：\n\n```c\nvoid Start() {\n    StartCoroutine(ProcessAICoroutine());\n\
  }\n```\n\n\n\n\n\nIEnumerator ProcessAICoroutine () {\n    while (true) {\n    \
  \    ProcessAI();\n        yield return new WaitForSeconds (_aiProcessDelay);\n\
  \    }\n}\n\n前面的代码演示了一个协程，它调用 `ProcessAI()`，然后在 `yield` 语句处暂停指定的秒数（即 `_aiProcessDelay`\
  \ 的值），直到主线程再次恢复该协程。此时，它将返回到循环的开头，调用 `ProcessAI()`，再次在 `yield` 语句处暂停，并永远重复（通过 `while(true)`\
  \ 语句），直到被要求停止。\n\n这种方法的主要好处是，该函数的调用频率仅由 `_aiProcessDelay` 的值决定，并且在该时间到来之前将保持空闲状态，从而减少了在大多数帧中造成的性能损耗。然而，这种方法也有其缺点。\n\
  \n首先，启动协程相对于标准函数调用会带来额外的开销成本（大约慢三倍），并且还需要一些内存分配来存储当前状态，直到下次调用时才会被使用。这种额外的开销也不是一次性成本，因为协程通常会不断调用\
  \ `yield`，这会一次又一次地造成相同的开销成本，因此我们需要确保降低频率带来的好处大于这一成本。\n\n在对 1,000 个具有空 `Update()`\
  \ 回调的对象进行测试时，处理耗时 1.1 毫秒，而 1,000 个在 `WaitForEndOfFrame` 上 `yield` 的协程（其频率与 `Update()`\
  \ 回调相同）耗时 2.9 毫秒。因此，相对成本几乎是三倍。\n\n其次，一旦初始化，协程将独立于触发它的 `MonoBehaviour` 组件的 `Update()`\
  \ 回调运行，并且无论组件是否被禁用都会继续被调用，如果我们进行大量的 `GameObject` 构建和销毁，这可能会使它们难以处理。\n\n第三，无论出于何种原因（无论是被设置为非活动状态还是其父对象之一被设置为非活动状态），协程都会在包含它的\
  \ `GameObject` 变为非活动状态的那一刻自动停止，并且如果 `GameObject` 再次设置为活动状态，它不会自动重新启动。\n\n最后，通过将方法转换为协程，我们可能减少了在大多数帧中造成的性能损耗，但如果方法体的单次调用导致我们超出了帧率预算，那么无论我们调用该方法的频率多么低，预算仍然会被超出。因此，这种方法最适合于仅由于方法在给定帧中被调用的次数过多而导致超出帧率预算的情况，而不是因为该方法本身开销过大。在这些情况下，我们别无选择，只能深入研究并改进方法本身的性能，或降低其他任务的成本以腾出时间来完成其工作。\n\
  \n在生成协程时，我们有几种可用的 `yield` 类型。`WaitForSeconds` 相当直观；协程将在 `yield` 语句处暂停指定的秒数。然而，它不是精确的定时器，因此当此\
  \ `yield` 类型实际恢复时，请预期会有少量的变化。\n\n`WaitForSecondsRealTime` 是另一个选项，它与 `WaitForSeconds`\
  \ 的区别仅在于它使用未缩放时间。`WaitForSeconds` 与缩放时间进行比较，后者受全局 `Time.timeScale` 属性的影响，而 `WaitForSecondsRealTime`\
  \ 则不受影响，因此如果您正在调整时间缩放值（例如，用于慢动作效果），请小心选择使用哪种 `yield` 类型。\n\n还有 `WaitForEndOfFrame`，它将在下一个\
  \ `Update()` 结束时继续，还有 `WaitForFixedUpdate`，它将在下一个 `FixedUpdate()` 结束时继续。最后，Unity\
  \ 5.3 引入了 `WaitUntil` 和 `WaitWhile`，我们提供一个委托函数，协程将暂停直到给定的委托分别返回 true 或 false。请注意，提供给这些\
  \ `yield` 类型的委托函数将在每个 `Update()` 中执行，直到它们返回停止所需的布尔值，这使得它们非常类似于在 `while` 循环中使用 `WaitForEndOfFrame`\
  \ 并在满足特定条件时结束的协程。当然，我们提供的委托函数执行开销也不应过大。\n\n> 委托函数是 C# 中非常有用的构造，它允许我们将局部方法作为参数传递给其他方法，通常用于回调。有关委托的更多信息，请参阅\
  \ MSDN C# 编程指南 https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/delegates/。\n\
  \n某些 `Update()` 回调的编写方式可能可以压缩为简单的协程，这些协程始终在上述类型之一上调用 `yield`，但我们应该注意前面提到的缺点。协程可能难以调试，因为它们不遵循正常的执行流程；调用堆栈中没有我们可以直接指责的调用者来解释为什么协程在给定时间触发，如果协程执行复杂任务并与其他子系统交互，则可能导致一些极其困难的错误，因为它们恰好在某些其他代码未预期的时刻被触发，这也往往是那些难以重现的棘手错误。如果您确实希望使用协程，最好的建议是保持它们简单且独立于其他复杂的子系统。\n\
  \n确实，如果我们的协程足够简单，可以归结为始终在 `WaitForSeconds` 或 `WaitForSecondsRealtime` 上调用 `yield`\
  \ 的 `while` 循环（如上述示例所示），那么我们通常可以用 `InvokeRepeating()` 调用来替换它，这更容易设置并且开销略小。以下代码与之前使用协程定期调用\
  \ `ProcessAI()` 方法的实现功能等效：\n\nvoid Start() {\n    InvokeRepeating(\"ProcessAI\"\
  , 0f, _aiProcessDelay);\n}\n\n`InvokeRepeating()` 与协程之间的一个重要区别是，`InvokeRepeating()`\
  \ 完全独立于 `MonoBehaviour` 和 `GameObject` 的状态。停止 `InvokeRepeating()` 调用的唯一方法是调用 `CancelInvoke()`（它将停止给定\
  \ `MonoBehaviour` 发起的所有 `InvokeRepeating()` 回调，请注意它们不能单独取消）或销毁关联的 `MonoBehaviour`\
  \ 或其父 `GameObject`。禁用 `MonoBehaviour` 或 `GameObject` 都不会停止 `InvokeRepeating()`。\n\
  \n对 1,000 个 `InvokeRepeating()` 调用的测试大约在 2.6 毫秒内处理完毕；略快于耗时 2.9 毫秒的 1,000 个等效协程 `yield`\
  \ 调用。\n\n这就涵盖了与 `Update()` 回调相关的大部分有用信息。让我们来看看一些其他有用的脚本技巧。\n\n# 更快的 GameObject null\
  \ 引用检查\n\n事实证明，对 `GameObject` 执行 `null` 引用检查会导致一些不必要的性能开销。与典型的 C# 对象相比，`GameObject`\
  \ 和 `MonoBehaviour` 是特殊的对象，因为它们在内存中有两种表示：一种存在于管理我们编写的 C# 代码的同一系统管理的内存中（托管代码），而另一种存在于单独处理的不同内存空间中（原生代码）。数据可以在这两个内存空间之间移动，但每次发生这种情况都会导致额外的\
  \ CPU 开销，并可能产生额外的内存分配。\n\n这种效果通常被称为跨越 `Native-Managed Bridge`。如果发生这种情况，可能会为对象的数据生成额外的内存分配以跨越桥梁进行复制，这将需要垃圾回收器最终为我们执行一些自动内存清理。本主题将在第\
  \ 8 章《精通内存管理》中更详细地探讨，但暂时请考虑，有许多微妙的方式可能会意外触发这种额外开销，而对 `GameObject` 进行简单的 `null` 引用检查就是其中之一：\n\
  \n```csharp\nif (gameObject != null) {\n    // do stuff with gameObject\n}\n```\n\
  \n一种替代方案是 `System.Object.ReferenceEquals()`，它生成功能等效的输出，运行速度大约快两倍（尽管它会稍微模糊代码的目的）：\n\
  \n```csharp\nif (!System.Object.ReferenceEquals(gameObject, null)) {\n    // do\
  \ stuff with gameObject\n}\n```\n\n这适用于 `GameObject` 和 `MonoBehaviour`，以及其他 Unity\
  \ 对象，例如 `WWW` 类，它们都具有原生和托管表示。然而，一些初步测试表明，无论哪种 `null` 引用检查方法，在 Intel Core i5 3570K\
  \ 处理器上都只消耗几个纳秒。因此，除非您正在进行大量的 `null` 引用检查，否则收益可能微乎其微。然而，这是一个值得牢记的警告，因为它将在未来频繁出现。\n\
  \n\n\n\n\n# 避免从 GameObjects 检索字符串属性\n\n通常，从对象检索 `string` 属性与在 C# 中检索任何其他引用类型属性相同；它应该在没有额外内存成本的情况下获取。但是，从\
  \ `GameObjects` 检索 `string` 属性是意外跨越原生 - 托管桥的另一种微妙方式。\n\n受此行为影响的 `GameObject` 的两个属性是\
  \ `tag` 和 `name`。因此，在游戏过程中使用其中任何属性都是不明智的，你应该只在性能无关紧要的区域使用它们，例如编辑器脚本。但是，标签系统通常用于运行时对象识别，这可能使这对某些团队来说成为一个重大问题。\n\
  \n例如，以下代码会在循环的每次迭代期间导致额外的内存分配：\n\n```c\nfor (int i = 0; i < listOfObjects.Count;\
  \ ++i) {\n    if (listOfObjects[i].tag == \"Player\") {\n    // do something with\
  \ this object\n    }\n}\n```\n\n通常，更好的做法是通过组件和类类型来识别对象，并识别不涉及 `string` 对象的值，但有时我们被迫无路可走。也许当我们开始时并不知道得更好，我们继承了别人的代码库，或者我们将其用作某种东西的变通方法。让我们假设，出于任何原因，我们被困在标签系统中，并且我们想要避免原生\
  \ - 托管桥的开销成本。\n\n幸运的是，`tag` 属性最常用于比较情况，而 `GameObject` 提供了 `CompareTag()` 方法，这是比较\
  \ `tag` 属性的一种替代方法，它完全避免了原生 - 托管桥。\n\n让我们执行一个简单的测试，以证明这个简单的改变可以带来天壤之别：\n\n```c\n\
  void Update() {\n    int numTests = 10000000;\n\n    if (Input.GetKeyDown(KeyCode.Alpha1))\
  \ {\n    for(int i = 0; i < numTests; ++i) {\n        if (gameObject.tag == \"Player\"\
  ) {\n            // do stuff\n        }\n    }\n}\nif (Input.GetKeyDown(KeyCode.Alpha2))\
  \ {\nfor(int i = 0; i < numTests; ++i) {\nif (gameObject.CompareTag (\"Player\"\
  )) {\n// do stuff\n}\n}\n}\n}\n```\n\n我们可以通过按 1 和 2 键来执行这些测试以触发各自的 for 循环。\n以下是结果：\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_77_0.png)\n\n查看每个尖峰的分解视图，我们可以看到两种完全不同的结果：\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_78_0.png)\n\n值得注意的是，时间轴视图中的两个尖峰看起来高度相似，但一次操作的时间却是另一次的两倍。当我们超过\
  \ 15FPS 标记时，性能分析器没有必要的垂直分辨率来生成相对准确的峰值。无论如何，两者都会导致糟糕的游戏体验，所以准确性并不重要。\n\n检索 `tag`\
  \ 属性 1000 万次（在现实中远远超出合理范围，但这对于比较很有用）会导致仅为 `string` 对象分配约 400 兆字节的内存。我们可以在时间轴视图的内存区域中\
  \ **GC 已分配** 元素内的尖峰中看到这种内存分配正在发生。此外，这个过程大约需要 2000 毫秒来处理，一旦 `string` 对象不再需要，还会花费另外\
  \ 400 毫秒进行垃圾回收。\n\n与此同时，使用 `CompareTag()` 1000 万次大约需要 1000 毫秒来处理，并且不会导致任何内存分配，因此也不会产生垃圾回收。这从时间轴视图的内存区域中\
  \ **GC 已分配** 元素中缺乏尖峰可以明显看出。这应该让我们清楚地认识到，我们必须尽可能避免访问 `name` 和 `tag` 属性。如果标签比较变得必要，那么我们应该使用\
  \ `CompareTag()`。不幸的是，`name` 属性没有等效方法，所以我们应该尽可能使用标签。\n\n请注意，将 `string` 文本（例如 \"\
  Player\"）传递给 `CompareTag()` 不会导致运行时内存分配，因为应用程序在初始化期间分配像这样的硬编码字符串，并且在运行时仅引用它们。\n\n\
  # 使用适当的数据结构\n\nC# 在 `System.Collections` 命名空间中提供了许多不同的数据结构，我们不应该过于习惯于反复使用相同的数据结构。软件开发中常见的性能问题是，仅仅因为方便就为我们试图解决的问题使用了不合适的数据结构。最常用的两个可能是列表（`List<T>`）和字典（`Dictionary<K,\
  \ V>`）。\n\n如果我们想要遍历一组对象，则首选列表，因为它实际上是一个动态数组，其中的对象和/或引用在内存中相互紧邻，因此遍历会导致最小的缓存未命中。如果两个对象相互关联，并且我们希望快速获取、插入或删除这些关联，则最适合使用字典。例如，我们可能会将关卡编号与特定的场景文件关联起来，或者将代表角色不同身体部位的\
  \ `enum` 与这些身体部位的 `Collider` 组件关联起来。\n\n但是，我们经常希望有一个同时处理这两种场景的数据结构；我们希望快速找出哪个对象映射到另一个对象，同时还能遍历整个组。通常，该系统的开发人员会使用字典，然后遍历它。但是，与遍历列表相比，这个过程非常慢，因为它必须检查字典中的每个潜在哈希才能完全遍历它。\n\
  \n在这种情况下，通常最好将数据同时存储在列表和字典中，以更好地支持这种行为。这将增加额外的内存开销来维护多个数据结构，并且插入和删除每次都需要从两个数据结构中添加和删除对象，但列表上的遍历好处（通常发生频率要高得多）与遍历字典相比将形成鲜明对比。\n\
  \n# 避免在运行时重新设置 Transform 的父级\n\n在早期版本的 Unity（5.3 及更早版本）中，`Transform` 组件的引用在内存中通常以随机顺序排列。这意味着遍历多个\
  \ `Transform` 相当缓慢，因为缓存未命中的可能性很大。好处是，将一个 `GameObject` 重新设置为另一个 `GameObject` 的子级不会造成显著的性能损失，因为\
  \ `Transform` 的操作很像堆数据结构，插入和删除通常相对较快。这种行为是我们无法控制的，所以我们只是接受了它。\n\n但是，自 Unity 5.4\
  \ 及更高版本以来，`Transform` 组件的内存布局发生了重大变化。从那以后，`Transform` 组件的父子关系更像动态数组，Unity 会尝试将所有共享相同父级的\
  \ `Transform` 存储在预分配内存缓冲区中，并在 **层级** 窗口中按其深度排序，位于父级下方。这种数据结构允许对整个组进行更快得多的遍历，这对于物理和动画等多个子系统特别有益。这种变化的缺点是，如果我们将一个\
  \ `GameObject` 重新设置为另一个 `GameObject` 的子级，父级必须将新子级放入其预分配内存缓冲区，并根据新深度对所有这些 `Transform`\
  \ 进行排序。此外，如果父级没有预分配足够的空间来容纳新子级，则必须扩展其缓冲区，以便按深度优先顺序容纳新子级及其所有子级。对于深层和复杂的 `GameObject`\
  \ 结构，这可能需要一些时间才能完成。\n\n当我们通过 `GameObject.Instantiate()` 实例化一个新的 `GameObject` 时，其参数之一是我们希望将\
  \ `GameObject` 设置为子级的 `Transform`，默认值为 `null`，这会将 `Transform` 放置在 **层级** 窗口的根目录下。**层级**\
  \ 窗口根目录下的所有 `Transform` 都需要分配一个缓冲区来存储当前的子级以及以后可能添加的子级（子级 `Transform` 不需要这样做）。但是，如果我们在实例化后立即将\
  \ Transform 重新设置为另一个 Transform 的子级，那么它就会丢弃我们刚刚分配的缓冲区！为了避免这种情况，我们应该将父级 `Transform`\
  \ 参数提供给 `GameObject.Instantiate()` 调用，这将跳过此缓冲区分配步骤。\n\n降低此过程成本的另一种方法是在需要之前让根 `Transform`\
  \ 预分配一个更大的缓冲区，这样我们就不需要在同一帧中既扩展缓冲区又将另一个 `GameObject` 重新设置为子级。这可以通过修改 `Transform`\
  \ 组件的 `hierarchyCapacity` 属性来实现。如果我们可以估计父级将包含多少个子级 `Transform`，那么我们可以节省大量不必要的内存分配。\n\
  \n# 考虑缓存 Transform 更改\n\n`Transform` 组件仅存储相对于其自身父级的数据。这意味着访问和修改 `Transform` 组件的\
  \ `position`、`rotation` 和/或 `scale` 属性可能会导致大量未预料的矩阵乘法计算，以通过其父级 `Transform` 生成对象的正确\
  \ `Transform` 表示。对象在 **层级** 窗口中的层级越深，确定最终结果所需的计算就越多。\n\n\n\n\n\n然而，这也意味着使用 `localPosition`、`localRotation`\
  \ 和 `localScale` 所关联的成本相对较低，因为这些值直接存储在给定的 `Transform` 中，无需任何额外的矩阵乘法即可检索。因此，应尽可能使用这些本地属性值。\n\
  \n不幸的是，将数学计算从世界空间更改为本地空间可能会使原本简单（且已解决）的问题变得过于复杂，因此做出此类更改可能会破坏我们的实现并引入大量意外错误。有时，为了更轻松地解决复杂的\
  \ 3D 数学问题，接受轻微的性能损失是值得的。\n\n不断更改 `Transform` 组件属性的另一个问题是，它还会向 `Collider`、`Rigidbody`、`Light`\
  \ 和 `Camera` 等组件发送内部通知，这些通知也必须被处理，因为物理系统和渲染系统都需要知道 `Transform` 的新值并相应地进行更新。\n\n\
  这些内部通知的速度在 Unity 5.4 中得到了显著提升，原因是 Unity 5.4 中 `Transform` 在内存中的重新组织，如前面所述，但我们仍需了解其成本。\n\
  \n在复杂的事件链中，在同一帧内多次替换 `Transform` 组件的属性并不罕见（尽管这可能是过度设计的警示信号）。这会导致每次发生这种情况时都会触发内部消息，即使它们发生在同一帧，甚至发生在同一函数调用中。因此，我们应考虑通过在成员变量中缓存\
  \ `Transform` 属性并在帧结束时仅提交一次来减少修改 `Transform` 属性的次数，如下所示：\n\n```\nprivate bool _positionChanged;\n\
  private Vector3 _newPosition;\n\npublic void SetPosition(Vector3 position) {\n \
  \   _newPosition = position;\n    _positionChanged = true;\n}\n\nvoid FixedUpdate()\
  \ {\n    if (_positionChanged) {\n        transform.position = _newPosition;\n \
  \       _positionChanged = false;\n    }\n}\n```\n\n这段代码将仅在下一个 `FixedUpdate()` 方法中提交对\
  \ `position` 的更改。\n\n请注意，以这种方式更改 `Transform` 不会导致游戏过程中出现奇怪的行为或物体瞬移。这些内部事件的整个目的是确保物理系统和渲染系统始终与当前的\
  \ `Transform` 状态同步。因此，Unity 不会有任何延迟，每当更改通过 `Transform` 组件传递时都会触发内部事件，以确保不会遗漏任何内容。\n\
  \n# 避免在运行时使用 Find() 和 SendMessage()\n\n`SendMessage()` 方法和 `GameObject.Find()` 方法系列臭名昭著地昂贵，应不惜一切代价避免。`SendMessage()`\
  \ 方法比简单的函数调用慢约 2,000 倍，而 `Find()` 方法的成本随场景复杂度的增加而非常糟糕地扩展，因为它必须遍历场景中的每个 `GameObject`。在场景初始化期间（例如在\
  \ `Awake()` 或 `Start()` 回调中）调用 `Find()` 有时是可以原谅的。即使在这种情况下，也只应用于获取我们确定已经存在于场景中且场景中只有少量\
  \ `GameObject` 的对象。无论如何，在运行时使用这两种方法中的任何一种进行对象间通信都可能产生非常明显的开销，并可能导致掉帧。\n\n依赖 `Find()`\
  \ 和 `SendMessage()` 通常是设计不佳、缺乏 C# 和 Unity 编程经验，或者仅仅是原型开发时的懒惰的表现。它们的使用在初级和中级项目中已成为某种流行病，以至于\
  \ Unity Technologies 觉得有必要在文档和会议上反复提醒用户在真实游戏中避免使用它们。它们仅作为一种不那么“程序员化”的方式来向新用户介绍对象间通信，以及在某些可以负责任地使用它们的特殊情况下存在（这种情况少之又少）。换句话说，它们的成本如此高昂，以至于打破了不要过早优化代码的规则，如果我们的项目超出了原型阶段（这是一个明显的可能性，因为你正在阅读这本书），那么不惜一切代价避免使用它们是值得的。\n\
  \n公平地说，Unity 面向广泛的用户群体，从爱好者、学生、专业人士到自命不凡的人，团队规模也从个人开发者到同一团队中的数百人不等。这导致了软件开发能力的极其广泛的范围。当你刚开始使用\
  \ Unity 时，很难自己弄清楚应该做出哪些不同的做法，尤其是考虑到 Unity 引擎不遵循我们可能熟悉的许多其他游戏引擎的设计范式。它围绕场景和预制体有一些陌生和古怪的概念，没有内置的\
  \ God Class 入口点，也没有任何明显的原始数据存储系统可供使用。\n\nGod Class 是一个花哨的名称，指我们可能在应用程序中创建的第一个对象，其工作是根据当前上下文（要加载哪个关卡、激活哪些子系统等）创建我们需要的其他所有东西。如果我们想要一个单一的集中位置来控制整个应用程序生命周期中事件发生的顺序，这些类会特别有用。\n\
  \n这是一个重要的主题，不仅关乎性能，也关乎任何实时事件驱动系统设计（包括但不限于游戏），因此值得详细探讨该主题，评估一些对象间通信的替代方法。\n\n让我们从检查一个最坏情况的示例开始，该示例同时使用\
  \ Find() 和 SendMessage() 在对象之间进行通信，然后探讨改进方法。\n\n以下是一个简单的 EnemyManagerComponent 类定义，它跟踪游戏中代表敌人的\
  \ GameObject 列表，并在需要时提供 KillAll() 方法将它们全部销毁：\n\n```\nusing UnityEngine;\nusing System.Collections.Generic;\n\
  class EnemyManagerComponent : MonoBehaviour {\n    List<GameObject> _enemies = new\
  \ List<GameObject>();\n    public void AddEnemy(GameObject enemy) {\n        if\
  \ (!_enemies.Contains(enemy)) {\n            _enemies.Add(enemy);\n        }\n \
  \   }\n    public void KillAll() {\n        for (int i = 0; i < _enemies.Count;\
  \ ++i) {\n            GameObject.Destroy(_enemies[i]);\n        }\n        _enemies.Clear();\n\
  \    }\n}\n```\n\n然后我们会在场景中放置一个包含此组件的 `GameObject`，并将其命名为 `EnemyManager`。\n\n以下示例方法尝试从给定的预制体实例化若干敌人，然后通知\
  \ `EnemyManager` 对象它们的存在：\n\n```\npublic void CreateEnemies(int numEnemies) {\n\
  \    for(int i = 0; i < numEnemies; ++i) {\n        GameObject enemy = (GameObject)\
  \ GameObject.Instantiate(_enemyPrefab,\n            5.0f * Random.insideUnitSphere,\n\
  \            Quaternion.identity);\n        string[] names = { \"Tom\", \"Dick\"\
  , \"Harry\" };\n        enemy.name = names[Random.Range(0, names.Length)];\n   \
  \     GameObject enemyManagerObj = GameObject.Find(\"EnemyManager\");\n        enemyManagerObj.SendMessage(\"\
  AddEnemy\",\n            enemy,\n            SendMessageOptions.DontRequireReceiver);\n\
  \    }\n}\n```\n\n在任何类型的循环中初始化数据并放置方法调用，且始终输出相同的结果，是性能不佳的一个重大危险信号，当我们处理昂贵的方法（如 `Find()`）时，应始终寻找尽可能少地调用它们的方法。因此，我们可以做的一项改进是将\
  \ `Find()` 调用移出 `for` 循环，并将结果缓存在局部变量中，这样就不需要反复重新获取 `EnemyManager` 对象了。\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_84_0.png)\n\
  \n将 `names` 变量的初始化移出 `for` 循环并不一定至关重要，因为编译器通常足够聪明，能够意识到不需要重新初始化在其他地方未更改的数据。然而，这通常能使代码更易于阅读。\n\
  \n我们可以实现的另一项重大改进是优化 `SendMessage()` 方法的使用，通过用 `GetComponent()` 调用来替换它。这用一个等价且便宜得多的替代方案取代了非常昂贵的方法。\n\
  \n\n\n\n\n# 这将给我们带来以下结果：\n\n```csharp\npublic void CreateEnemies(int numEnemies)\
  \ {\n    GameObject enemyManagerObj = GameObject.Find(\"EnemyManager\");\n    EnemyManagerComponent\
  \ enemyMgr =\n        enemyManagerObj.GetComponent<EnemyManagerComponent>();\n \
  \   string[] names = { \"Tom\", \"Dick\", \"Harry\" };\n\n    for(int i = 0; i <\
  \ numEnemies; ++i) {\n        GameObject enemy = (GameObject)GameObject.Instantiate(_enemyPrefab,\n\
  \                                                             5.0f * Random.insideUnitSphere,\n\
  \                                                             Quaternion.identity);\n\
  \        enemy.name = names[Random.Range(0, names.Length)];\n        enemyMgr.AddEnemy(enemy);\n\
  \    }\n}\n```\n\n如果在场景初始化期间调用此方法，并且我们不太关心加载时间，那么我们大概可以认为优化工作已经完成了。\n\n然而，我们经常需要在运行时实例化的新对象去查找现有对象以进行通信。在这个示例中，我们希望新的敌人对象能够向我们的\
  \ `EnemyManagerComponent` 注册，以便它能够执行所需操作来跟踪和控制场景中的敌人对象。我们还希望 `EnemyManager` 处理所有与敌人相关的行为，这样调用其函数的对象就不需要代表它执行工作。这将改善我们应用程序的\
  \ _耦合_（代码库分离相关行为的程度）和 _封装_（类防止外部对其管理数据进行更改的程度）。最终目标是找到一种可靠且快速的方法，让新对象在场景中查找现有对象，而无需不必要地使用\
  \ `Find()` 方法，从而最大限度地降低复杂性和性能开销。\n\n我们可以采用多种方法来解决这个问题，每种方法都有其自身的优点和陷阱：\n\n- 为预先存在的对象分配引用\n\
  - 静态类\n- 单例组件\n- 全局消息系统\n\n# 为预先存在的对象分配引用\n\n解决对象间通信问题的一种简单方法是使用 Unity 内置的序列化系统。软件设计纯粹主义者往往对这个功能颇有微词，因为它破坏了封装；它使得任何标记为\
  \ private 的字段（C# 中的成员变量术语）的行为都像公共字段一样。然而，它是改善开发工作流程的非常有效的工具。当艺术家、设计师和程序员都在同一个产品上摸索时，这一点尤其适用，因为每个人的计算机科学和软件编程知识水平参差不齐，有些人更愿意远离修改代码文件。有时，为了生产力，打破几条规则是值得的。\n\
  \n每当我们在 MonoBehaviour 中创建一个公共字段时，Unity 会在选择组件时自动序列化并在 Inspector 窗口中公开该值。然而，从软件设计的角度来看，公共字段始终是危险的。这些变量可以随时从任何地方通过代码更改，使得难以跟踪变量，并且很容易引入许多意外的错误。\n\
  \n更好的解决方案是，将类的任何私有或受保护的成员变量与 `[SerializeField]` 属性一起公开到 Inspector 窗口中。该值现在在 Inspector\
  \ 窗口方面将表现得像公共字段，允许我们通过编辑器界面方便地更改它，但将数据安全地封装起来，不受代码库其他部分的影响。\n\n例如，以下类将三个私有字段公开到\
  \ Inspector 窗口中：\n\n```csharp\nusing UnityEngine;\n\npublic class EnemyCreatorComponent\
  \ : MonoBehaviour {\n    [SerializeField] private int _numEnemies;\n    [SerializeField]\
  \ private GameObject _enemyPrefab;\n    [SerializeField] private EnemyManagerComponent\
  \ _enemyManager;\n\n    void Start() {\n        for (int i = 0; i < _numEnemies;\
  \ ++i) {\n            CreateEnemy();\n        }\n    }\n\n    public void CreateEnemy()\
  \ {\n        _enemyManager.CreateEnemy(_enemyPrefab);\n    }\n}\n```\n\n请注意，前面代码中显示的\
  \ `private` 访问说明符在 C# 中是冗余的关键字，因为字段和方法默认情况下是 `private`，除非另有说明。但是，明确说明预期的访问级别通常是最佳实践。\n\
  \n在 **Inspector** 窗口中查看此组件会显示三个值，初始默认值为 `0` 或 `null`，可以通过编辑器界面进行修改：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_87_0.png)\n\
  \n我们可以将 **Project** 窗口中的预制体引用拖放到 **Inspector** 窗口中显示的 **Enemy Prefab** 字段中。\n\n\
  请注意，Unity 会自动将驼峰式字段名称转换为 **Inspector** 窗口中方便的名称。`_numEnemies` 变为 **Num Enemies**，`_enemyPrefab`\
  \ 变为 **Enemy Prefab**，以此类推。\n\n与此同时，`_enemyManager` 字段很有趣，因为它是对特定 `MonoBehaviour`\
  \ 类类型的引用。如果将 `GameObject` 拖放到此字段中，它将引用给定对象上的组件，而不是 `GameObject` 本身。请注意，如果 `GameObject`\
  \ 不包含预期的 `MonoBehaviour`，则不会向该字段分配任何内容。\n\n这种组件引用技术的常见用途是获取附加到组件所附加的同一个 `GameObject`\
  \ 上的其他组件的引用。这是缓存组件的一种替代方法，零成本，如前面章节中 _缓存组件引用_ 部分所讨论的。\n\n使用此方法存在一些危险。我们的大部分代码都会假设，预制体被分配给像预制体一样使用的字段，而\
  \ `GameObject` 被分配给引用 `GameObject` 实例的字段。但是，由于预制体本质上是 `GameObjects`，任何预制体或 `GameObject`\
  \ 都可以分配给序列化的 `GameObject` 引用字段，这意味着我们可能会意外分配错误的类型。\n\n如果我们确实分配了错误的类型，那么我们可能会意外地从之前修改过的现有\
  \ `GameObject` 实例化一个新的 `GameObject`，或者我们可能会对预制体进行更改，这将更改所有从中实例化的 `GameObjects` 的状态。更糟糕的是，对预制体的任何意外更改都会变成永久性的，因为无论播放模式是否激活，预制体都占据相同的内存空间。即使预制体仅在播放模式期间被修改，情况也是如此。\n\
  \n因此，这种方法是解决对象间通信问题的一种非常适合团队的方式，但由于团队成员意外留下 `null` 引用、将预制体分配给期望场景中 `GameObject`\
  \ 实例的引用，或者反之，所涉及的所有风险，它并不理想。\n\n还要注意的是，并非所有对象都可以序列化并在 **Inspector** 窗口中显示。Unity\
  \ 可以序列化所有原始数据类型（`int`、`float`、`string` 和 `bool`）、各种内置类型（`Vector3`、`Quaternion` 等）；`enum`、`class`、`struct`\
  \ 以及包含其他可序列化类型（如 `List`）的各种数据结构。但是，它无法序列化 `static` 字段、`readonly` 字段、属性和字典。\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_88_0.png)\n\
  \n一些 Unity 开发者喜欢通过两个单独的列表（用于键和值）以及自定义编辑器脚本，或者通过单个包含键和值的 `struct` 对象列表，来实现字典的伪序列化。这两种解决方案都有点笨拙，而且很少像真正的字典那样高效，但它们仍然可能很有用。\n\
  \n解决对象间通信问题的另一个方案是尝试利用全局可访问的对象，以最大限度地减少我们需要进行的自定义分配数量。\n\n# 静态类\n\n这种方法涉及创建一个类，该类在任何时候都可以被整个代码库全局访问。任何类型的全局\
  \ _管理器_ 类在软件工程圈子里往往不受欢迎，部分原因是 _管理器_ 这个名称含糊不清，没有说明其用途，但主要是因为问题可能难以调试。更改可以随时从任何地方发生，并且在运行期间的任何时间点发生，这类倾向于维护其他系统依赖的状态信息。这也是最难更改或替换的方法，因为我们的许多类可能包含直接调用它的函数，如果将来要替换它，则需要修改每个类。尽管有所有这些缺点，但它是理解和实现起来最容易的解决方案。\n\
  \n\n\n\n\nSingleton 设计模式是一种常见的方式，用于确保内存中始终只存在某个对象类型的一个实例。该设计模式通过给类一个 `private` 构造函数来实现，并维护一个\
  \ `static` 变量来跟踪对象实例，该类只能通过其提供的 `static` 属性来访问。Singleton 在管理共享资源或 _大量数据流量_（例如文件访问、下载、数据解析和消息传递）时非常有用。Singleton\
  \ 确保我们为这些活动提供一个单一的入口点，而不是让大量不同的子系统争夺共享资源并可能相互造成瓶颈。\n\nSingleton 不一定必须是全局可访问的对象——它们最重要的特征是同一时间只存在该对象的一个实例。但是，在大多数项目中，Singleton\
  \ 的主要用途是作为某些共享功能的全局访问点，并且设计为在应用程序初始化期间创建一次，贯穿整个应用程序生命周期，并且仅在应用程序关闭时销毁。因此，在 C# 中实现此类行为的更简单方法是使用静态类。换句话说，在\
  \ C# 中实现典型的 Singleton 设计模式只是提供了与静态类相同的行为，但实现起来花费更多时间和代码。\n\n与前面示例中 `EnemyManagerComponent`\
  \ 功能非常相似的静态类可以定义如下：\n\n```csharp\nusing System.Collections.Generic;\nusing UnityEngine;\n\
  public static class StaticEnemyManager {\n\tprivate static List<Enemy> _enemies;\n\
  \tpublic static void CreateEnemy(GameObject prefab) {\n\t\tstring[] names = { \"\
  Tom\", \"Dick\", \"Harry\" };\n\t\tGameObject enemy = GameObject.Instantiate(prefab,\
  \ 5.0f *\n\t\t\tRandom.insideUnitSphere, Quaternion.identity);\n\t\tEnemy enemyComp\
  \ = enemy.GetComponent<Enemy>();\n\t\tenemy.gameObject.name = names[Random.Range(0,\
  \ names.Length)];\n\t\t_enemies.Add(enemyComp);\n\t}\n\tpublic static void KillAll()\
  \ {\n\t\tfor (int i = 0; i < _enemies.Count; ++i) {\n\t\t\t_enemies[i].Die();\n\t\
  \t\tGameObject.Destroy(_enemies[i].gameObject);\n\t\t}\n\t\t_enemies.Clear();\n\t\
  }\n}\n\n```\n\n请注意，静态类中的每个方法、属性和字段都必须附加 `static` 关键字，这意味着内存中始终只会驻留该对象的一个实例。这也意味着其\
  \ `public` 方法和字段可以从任何位置访问。静态类按定义不允许定义任何非 `static` 字段。\n\n如果静态类的字段需要初始化（例如 `__enemies`\
  \ 字段，初始设置为 `null`），则可以像下面这样在行内初始化静态类字段：\n\n```csharp\nprivate static List<Enemy>\
  \ __enemies = new List<Enemy>() ;\n```\n\n但是，如果对象构造需要比这更复杂，那么可以为静态类提供一个 `static`\
  \ 构造函数。静态类的构造函数会在类首次通过其任何字段、属性或方法被访问时自动调用，可以像下面这样定义：\n\n```csharp\nstatic StaticEnemyManager()\
  \ {\n    __enemies = new List<Enemy>() ;\n    // more complicated initialization\
  \ activity goes here\n}\n```\n\n这次我们实现了 `CreateEnemy()` 方法，使其处理创建敌人对象的大部分活动。但是，静态类仍然必须获得一个预制体的引用，以便从中实例化敌人对象。静态类只能包含\
  \ `static` 成员变量，因此无法像 `MonoBehaviour` 那样轻松地与 **Inspector** 窗口交互，因此需要调用者向其提供一些特定于实现的信息。为了解决这个问题，我们可以为静态类实现一个配套组件，以保持代码的\
  \ _解耦_。以下代码演示了该类可能的样子：\n\n```csharp\nusing UnityEngine;\n\npublic class EnemyCreatorCompanionComponent\
  \ : MonoBehaviour {\n    [SerializeField] private GameObject __enemyPrefab;\n\n\
  \    public void CreateEnemy() {\n        StaticEnemyManager.CreateEnemy(__enemyPrefab);\n\
  \    }\n}\n```\n\n尽管存在这些缺点，`StaticEnemyManager` 类说明了静态类如何用于在外部对象之间提供信息或通信的简单示例，这比使用\
  \ `Find()` 或 `SendMessage()` 提供了更好的替代方案。\n\n# Singleton 组件\n\n如前所述，静态类很难与 Unity\
  \ 相关的功能交互，并且无法直接使用 `MonoBehaviour` 功能，例如事件回调、协程、层级设计和预制体。此外，由于 **Inspector** 窗口中没有可选择的对象，我们失去了通过\
  \ **Inspector** 窗口在运行时检查静态类数据的能力，这会使调试变得困难。这些是我们可能希望在全局类中使用的功能。\n\n解决此问题的常见方法是实现一个像\
  \ Singleton 一样的组件——它提供 `static` 方法以授予全局访问权限，并且任何给定时间只允许存在一个 `MonoBehaviour` 实例。\n\
  \n以下是 `SingletonComponent` 类的定义：\n\n```csharp\nusing UnityEngine;\n\npublic class\
  \ SingletonComponent<T> : MonoBehaviour where T : SingletonComponent<T> {\n    private\
  \ static T __Instance;\n\n    protected static SingletonComponent<T> __Instance\
  \ {\n        get {\n            if(!__Instance) {\n                T [] managers\
  \ = GameObject.FindObjectsOfType(typeof(T)) as T[];\n                if (managers\
  \ != null) {\n                    if (managers.Length == 1) {\n                \
  \        __Instance = managers[0];\n                        return __Instance;\n\
  \                    } else if (managers.Length > 1) {\n                       \
  \ Debug.LogError(\"You have more than one \" +\n                            typeof(T).Name\
  \ +\n                            \" in the Scene. You only need \" +\n         \
  \                   \"one - it's a singleton!\");\n                        for(int\
  \ i = 0; i < managers.Length; ++i) {\n                            T manager = managers[i];\n\
  \                            Destroy(manager.gameObject);\n                    \
  \    }\n                    }\n                }\n                GameObject go\
  \ = new GameObject(typeof(T).Name, typeof(T));\n                __Instance = go.GetComponent<T>();\n\
  \                DontDestroyOnLoad(__Instance.gameObject);\n            }\n    \
  \        return __Instance;\n        }\n        set {\n            __Instance =\
  \ value as T;\n        }\n    }\n}\n```\n\n该类的工作原理是在首次访问时创建一个包含自身组件的 `GameObject`。由于我们希望这是一个全局且持久的对象，因此在\
  \ `GameObject` 创建后不久需要调用 `DontDestroyOnLoad()`。这是一个特殊函数，告诉 Unity 我们希望对象在应用程序运行期间在场景之间持续存在。从那时起，当加载新场景时，对象不会被销毁，并将保留其所有数据。\n\
  \n该类定义假设两点。首先，因为它使用 `generics` 来定义其行为，因此必须从中派生以创建具体类。其次，必须定义一个方法来分配 `__Instance`\
  \ 属性（进而设置私有 `__Instance` 字段），并将其转换为/从正确的类类型。\n\n例如，以下是成功生成名为 `EnemyManagerSingletonComponent`\
  \ 的新 `SingletonComponent` 派生类所需的最少代码：\n\n```csharp\npublic class EnemyManagerSingletonComponent\
  \ : SingletonComponent<EnemyManagerSingletonComponent> {\n    public static EnemyManagerSingletonComponent\
  \ Instance {\n        get { return ((EnemyManagerSingletonComponent)_Instance);\
  \ }\n        set { _Instance = value; }\n    }\n\n    public void CreateEnemy(GameObject\
  \ prefab) {\n        // same as StaticEnemyManager\n    }\n\n    public void KillAll()\
  \ {\n        // same as StaticEnemyManager\n    }\n}\n```\n\n该类可以在运行时由任何其他对象随时访问\
  \ `Instance` 属性来使用。如果组件在场景中不存在，则 `SingletonComponent` 基类将实例化其自己的 `GameObject` 并将派生类的一个实例作为组件附加到它上。从那时起，通过\
  \ `Instance` 属性的访问将引用创建的组件，并且任何给定时间只会存在该组件的一个实例。\n\n\n\n\n\n请注意，这意味着我们不需要在单例组件类定义中实现\
  \ `static` 方法。例如，我们可以直接调用 `EnemyManagerSingletonComponent.Instance.KillAll()` 来访问\
  \ `KillAll()` 方法。\n\n请注意，可以将 `SingletonComponent` 的实例放置在 **Hierarchy** 窗口中，因为它继承自\
  \ `MonoBehaviour`。但是，请注意 `DontDestroyOnLoad()` 方法永远不会被调用，这将阻止单例组件的 `GameObject`\
  \ 在加载下一个场景时持续存在。我们可能需要在派生类的 `Awake()` 回调中调用 `DontDestroyOnLoad()` 才能使其工作，除非我们确实想要可销毁的单例。有时，允许此类单例在场景之间被销毁是有意义的，以便每次都能从头开始；这完全取决于我们的特定用例。\n\
  \n无论哪种情况，单例组件的关闭都可能有点复杂，因为 Unity 拆卸场景的方式。当对象在运行时被销毁时，会调用其 `OnDestroy()` 回调。在应用程序关闭期间，也会调用相同的方法，此时\
  \ Unity 会调用每个 `GameObject` 上每个组件的 `OnDestroy()` 回调。当我们在编辑器中结束播放模式并返回编辑模式时，也会发生相同的活动。但是，对象的销毁顺序是随机的，我们不能假设\
  \ `SingletonComponent` 对象会是最后一个被销毁的对象。\n\n因此，如果任何对象在其 `OnDestroy()` 回调期间尝试对单例组件执行任何操作，则它们可能会调用\
  \ `SingletonComponent` 对象的 `Instance` 属性。但是，如果单例组件在此之前已经被销毁，则在应用程序关闭期间会创建一个新的 `SingletonComponent`\
  \ 实例。这可能会损坏我们的场景文件，因为我们的单例组件的实例会留在场景中。如果发生这种情况，Unity 将抛出以下错误消息：\n\n\"Some objects\
  \ were not cleaned up when closing the scene. (Did you spawn new GameObjects from\
  \ OnDestroy?)\"\n\n显而易见的解决方法是，在任何 `MonoBehaviour` 组件的 `OnDestroy()` 回调期间，根本不要调用\
  \ `SingletonComponent` 对象。但是，我们确实有一些合法的理由可能希望这样做：最值得注意的是，单例通常设计为使用观察者设计模式。这种设计模式允许其他对象为某些任务向其注册/注销，类似于\
  \ Unity 如何挂钩回调方法，例如 `Start()` 和 `Update()`，但方式更严格。\n\n使用观察者设计模式时，对象通常会在创建时向系统注册，在运行时使用它，然后在完成使用时在运行时注销，或在自身关闭期间注销以进行清理。我们将在即将到来的部分“全局消息系统”中看到这种设计模式的示例，但如果我们想象一个使用此类系统的\
  \ MonoBehaviour，那么执行关闭注销的最方便的位置将是在 OnDestroy() 回调中。因此，此类对象可能会遇到上述问题，即在应用程序关闭期间意外为\
  \ SingletonComponent 创建了一个新的 GameObject。\n\n要解决此问题，我们需要进行三项更改。首先，我们需要为 SingletonComponent\
  \ 添加一个额外的标志，以跟踪其活动状态并在适当的时间禁用它。这包括单例自身的销毁，以及应用程序关闭（OnApplicationQuit() 是 MonoBehaviours\
  \ 的另一个有用 Unity 回调，在此期间会调用它）：\n\n```\nprivate bool _alive = true;\nvoid OnDestroy()\
  \ { _alive = false; }\nvoid OnApplicationQuit() { _alive = false; }\n```\n\n其次，我们应该实现一种方法，让外部对象验证单例的当前状态：\n\
  \n```\npublic static bool IsAlive {\n get {\n  if (__Instance == null)\n   return\
  \ false;\n  return __Instance._alive;\n }\n}\n```\n\n最后，任何在其自身 OnDestroy() 方法期间尝试调用单例的对象，都必须先使用\
  \ IsAlive 属性验证状态，然后再调用实例，如下所示：\n\n```\npublic class SomeComponent : MonoBehaviour\
  \ {\n void OnDestroy() {\n  if (MySingletonComponent.IsAlive) {\n   MySingletonComponent.Instance.SomeMethod();\n\
  \  }\n }\n}\n```\n\n这将确保没有人在销毁期间尝试访问单例实例。如果我们不遵循此规则，那么我们将遇到问题，即在返回编辑模式后，我们的单例对象的实例会留在场景中。\n\
  \n`SingletonComponent` 方法的讽刺之处在于，我们使用 `Find()` 调用来确定场景中是否已经存在此类 `SingletonComponent`\
  \ 对象，然后再尝试分配 `__Instance` 引用变量。幸运的是，这只会在首次访问单例组件时发生，如果场景中没有太多 `GameObjects`，这通常不是问题，但单例组件的初始化不一定会在场景初始化期间发生，因此在游戏过程中首次获取实例并调用\
  \ `Find()` 时，可能会在不合适的时机导致性能尖峰。解决方法是让某个 God Class 通过简单访问每个单例的 `Instance` 属性，来确认重要的单例在场景初始化期间被实例化。\n\
  \n这种方法的另一个缺点是，如果我们后来决定想要同时运行多个此类单例，或者希望将其行为分离得更模块化，那么将需要修改大量代码。\n\n我们将探讨的最后一种方法将尝试解决之前方案揭示的许多问题，并提供一种获得所有优点的方式，通过结合实现简便、扩展简便和严格使用，同时减少配置过程中人为错误的可能性。\n\
  \n# 全局消息系统\n\n解决对象间通信问题的最后一种建议方法是实现一个全局消息系统，任何对象都可以访问并通过它向任何可能有兴趣监听特定类型消息的对象发送消息。对象可以发送消息或监听消息（有时两者都做！），监听者负责决定他们感兴趣的消息。消息发送者可以广播消息而不关心谁在监听，消息可以通过系统发送，而不考虑消息的具体内容。这种方法是迄今为止最复杂的，可能需要一些努力来实现和维护，但它是保持对象通信模块化、解耦和快速的绝佳长期解决方案，随着应用程序变得越来越复杂。\n\
  \n我们希望发送的消息类型可以有多种形式，包括数据值、引用、监听者指令等，但它们都应该有一个基本的共同定义，以便我们的消息系统可以用来确定消息是什么以及消息是发给谁的。\n\
  \n以下是 `Message` 对象的简单类定义：\n\n```\npublic class Message {\n    public string type;\n\
  \    public Message() { type = this.GetType().Name; }\n}\n```\n\n`Message` 类的构造函数将消息的\
  \ `type` 缓存在本地 `string` 属性中，以便以后用于编目和分发。缓存此值很重要，因为每次调用 `GetType().Name` 都会分配一个新字符串，我们之前学过，我们希望尽可能减少这种活动。\n\
  \n任何自定义消息都可以包含它们想要的任何多余数据，只要它们从这个基类派生，这将允许它们通过我们的消息系统发送。请注意，尽管在基类构造函数期间从对象获取了 `type`，但\
  \ `name` 属性仍然会包含派生类的名称，而不是基类的名称。\n\n接下来是我们的 `MessagingSystem` 类，我们应该根据需要满足的要求来定义其功能：\n\
  \n- 它应该是全局可访问的\n- 任何对象（`MonoBehaviour` 或非 `MonoBehaviour`）都应该能够注册/注销为监听者以接收特定消息类型（即观察者设计模式）\n\
  - 注册的对象应该提供一个方法，当给定消息从其他地方广播时调用该方法\n- 系统应该在合理的时间范围内将消息发送给所有监听者，但不会因一次请求过多而卡顿\n\n\
  ## 全局可访问的对象\n\n第一个要求使消息系统成为单例对象的绝佳候选者，因为我们只需要系统的一个实例。但是，在决定实现单例之前，仔细考虑这是否确实是明智的。\n\
  \n\n\n\n\n如果我们后来决定希望这个对象存在多个实例，希望允许系统在运行时创建/销毁，甚至希望创建测试用例以便在测试过程中伪造或创建/销毁它们，那么将单例从代码库中重构出来可能是一项困难的任务。这是因为随着我们越来越多地使用该系统，会逐渐向代码中引入所有这些依赖。\n\
  \n如果由于上述缺点而希望避免使用单例，那么更简单的方法可能是在初始化期间创建一个消息系统的单个实例，然后根据需要在子系统之间传递它，或者我们可能希望进一步探索依赖注入的概念，它试图解决此类问题。但是，为了简单起见，我们将假设单例符合我们的需求，并相应地设计我们的\
  \ `MessagingSystem` 类。\n\n# 注册\n\n第二和第三个要求可以通过提供一些公共方法来实现，这些方法允许对象与消息系统进行注册。如果我们强制监听对象为我们提供一个委托函数，以便在消息广播时调用，那么这将允许监听器自定义哪个方法用于处理哪个消息。如果我们将委托命名为其旨在处理的消息，那么我们可以使代码库非常易于理解。\n\
  \n在某些情况下，我们可能希望广播一个通用通知消息，并让所有监听器做出响应，例如 `Enemy Created` 消息。其他时候，我们可能会发送一条专门针对一组中单个监听器的消息。例如，我们可能希望发送一条\
  \ `Enemy Health Value Changed` 消息，该消息旨在供受损敌人附加的特定 `Health Bar` 对象使用。但是，场景中可能有许多健康条对象，它们都对这种消息类型感兴趣，但每个对象只关心它们正在提供健康信息的敌人的健康更新消息。因此，如果我们实现一种方法，让系统在消息被处理后停止检查，那么当有许多监听器等待同一消息类型时，我们可能可以节省大量\
  \ CPU 周期。\n\n因此，我们定义的委托应该提供一种通过参数检索消息的方法，并返回一个响应，以确定当监听器处理完消息后是否应停止处理该消息。是否停止处理的决定可以通过返回一个简单的布尔值来实现，其中\
  \ `true` 表示该监听器已处理该消息且消息处理必须停止，而 `false` 表示该监听器未处理该消息且消息系统应尝试下一个监听器。\n\n以下是委托的定义：\n\
  \n```csharp\npublic delegate bool MessageHandlerDelegate(Message message);\n```\n\
  \n监听器必须定义这种形式的方法，并在注册期间将委托引用传递给消息系统，从而为消息系统提供一种手段，在广播消息时通知监听对象。\n\n# 消息处理\n\n我们消息系统的最终要求是，该对象应具备某种基于时间的机制，以防止其在一次处理过多消息时出现卡顿。这意味着，在代码库的某个地方，我们需要使用\
  \ `MonoBehaviour` 事件回调来告诉我们的消息系统在 Unity 的 `Update()` 期间执行工作，从而使其能够计时。\n\n这可以通过静态类单例（我们之前定义过）来实现，但这需要另一个基于\
  \ `MonoBehaviour` 的上帝类来调用它，告知它场景已更新。或者，我们可以使用单例组件来实现同样的事情，它有自己的方式来确定何时调用 `Update()`，从而独立于任何上帝类处理其工作负载。两种方法之间最显著的区别在于系统是否依赖于其他对象的控制，以及管理单例组件的各种优缺点（例如，它不会在场景之间被销毁；我们不希望在关闭期间意外重新创建它）。\n\
  \n单例组件方法可能是最好的，因为很少有场景我们不希望该系统独立运行，即使我们的大部分游戏逻辑都依赖于它。例如，即使游戏暂停了，我们也不希望游戏逻辑暂停我们的消息系统。我们仍然希望消息系统继续接收和处理消息，以便例如在游戏处于暂停状态时，让与\
  \ UI 相关的组件继续相互通信。\n\n# 实现消息系统\n\n让我们通过从 `SingletonComponent` 类派生来定义我们的消息系统，并提供一个方法让对象与其注册：\n\
  \n```csharp\nusing System.Collections.Generic;\nusing UnityEngine;\n\npublic class\
  \ MessagingSystem : SingletonComponent<MessagingSystem> {\n    public static MessagingSystem\
  \ Instance {\n        get { return ((MessagingSystem)_Instance); }\n        set\
  \ { _Instance = value; }\n    }\n\n    private Dictionary<string, List<MessageHandlerDelegate>>\
  \ _listenerDict =\n        new Dictionary<string, List<MessageHandlerDelegate>>();\n\
  \n    public bool AttachListener(System.Type type, MessageHandlerDelegate handler)\
  \ {\n        if (type == null) {\n            Debug.Log(\"MessagingSystem: AttachListener\
  \ failed due to having no \"\n            +\n            \"message type specified\"\
  );\n            return false;\n        }\n\n        string msgType = type.Name;\n\
  \        if (!_listenerDict.ContainsKey(msgType)) {\n            _listenerDict.Add(msgType,\
  \ new List<MessageHandlerDelegate>());\n        }\n\n        List<MessageHandlerDelegate>\
  \ listenerList = _listenerDict[msgType];\n        if (listenerList.Contains(handler))\
  \ {\n            return false; // listener already in list\n        }\n\n      \
  \  listenerList.Add(handler);\n        return true;\n    }\n}\n```\n\n`_listenerDict`\
  \ 字段是一个字典，将字符串映射到包含 `MessageHandlerDelegate` 的列表中。此字典根据监听器希望监听的消息类型，将我们的监听器委托组织成列表。因此，如果我们知道正在发送的消息类型，就可以快速检索所有已为该消息类型注册的委托列表。然后我们可以遍历该列表，询问每个监听器，看是否有监听器想要处理它。\n\
  \n`AttachListener()` 方法需要两个参数：以 `System.Type` 形式的消息类型，以及当给定消息类型通过系统时要发送消息的 `MessageHandlerDelegate`。\n\
  \n# 消息队列和处理\n\n为了处理消息，我们的消息系统应维护一个传入消息对象的队列，以便我们可以按广播顺序处理它们：\n\n```csharp\nprivate\
  \ Queue<Message> _messageQueue = new Queue<Message>();\npublic bool QueueMessage(Message\
  \ msg) {\n    if (!_listenerDict.ContainsKey(msg.type)) {\n        return false;\n\
  \    }\n    _messageQueue.Enqueue(msg);\n    return true;\n}\n```\n\n`QueueMessage()`\
  \ 方法只是在将消息添加到队列之前检查给定的消息类型是否存在于我们的字典中。这实际上在将消息排队以供以后处理之前，测试对象是否实际上关心监听该消息。我们为此目的引入了一个新的私有字段\
  \ `_messageQueue`。\n\n接下来，我们将添加 `Update()` 的定义。此回调将由 Unity 引擎定期调用。其目的是遍历消息队列的当前内容，一次一条消息，验证自开始处理以来是否已过去太多时间，如果没有，则将它们传递给流程中的下一阶段：\n\
  \n```csharp\nprivate const int _maxQueueProcessingTime = 16667;\nprivate System.Diagnostics.Stopwatch\
  \ timer = new System.Diagnostics.Stopwatch();\nvoid Update() {\n    timer.Start();\n\
  \    while (_messageQueue.Count > 0) {\n        if (_maxQueueProcessingTime > 0.0f)\
  \ {\n            if (timer.Elapsed.Milliseconds > _maxQueueProcessingTime) {\n \
  \               timer.Stop();\n                return;\n            }\n        }\n\
  \        Message msg = _messageQueue.Dequeue();\n        if (!TriggerMessage(msg))\
  \ {\n            Debug.Log(\"Error when processing message: \" + msg.type);\n  \
  \      }\n    }\n}\n```\n\n\n\n\n\n基于时间的保障机制旨在确保处理时间不会超过设定的阈值。这可以防止消息系统在短时间内推送过多消息时导致游戏冻结。如果总时间限制被超出，则所有消息处理将停止，剩余的消息将留待下一帧处理。\n\
  \n请注意，我们在创建 `Stopwatch` 对象时使用了完整的命名空间。我们本可以添加 `using System.Diagnostics`，但这会导致 `System.Diagnostics.Debug`\
  \ 与 `UnityEngine.Debug` 之间出现命名空间冲突。省略它使我们能够继续使用 `Debug.Log()` 调用 Unity 的调试日志记录器，而无需每次都显式调用\
  \ `UnityEngine.Debug.Log()`。\n\n最后，我们需要定义 `TriggerMessage()` 方法，该方法用于将消息分发给监听器：\n\
  \n```csharp\npublic bool TriggerMessage(Message msg) {\n    string msgType = msg.type;\n\
  \    if (!listenerDict.ContainsKey(msgType)) {\n        Debug.Log(\"MessagingSystem:\
  \ Message \\\"\" + msgType + \"\\\" has no listeners!\");\n        return false;\
  \ // no listeners for message so ignore it\n    }\n\n    List<MessageHandlerDelegate>\
  \ listenerList = _listenerDict[msgType];\n    for(int i = 0; i < listenerList.Count;\
  \ ++i) {\n        if (listenerList[i](msg))\n            return true; // message\
  \ consumed by the delegate\n    }\n    return true;\n}\n```\n\n上述方法是消息系统的核心工作机制。`TriggerEvent()`\
  \ 方法的目的是获取给定消息类型的监听器列表，并让每个监听器都有机会处理该消息。如果某个委托返回 `true`，则当前消息的处理将停止，方法退出，从而允许 `Update()`\
  \ 方法处理下一条消息。\n\n通常，我们希望使用 `QueueEvent()` 来广播消息，但我们也提供对 `TriggerEvent()` 的直接访问作为替代方案。直接使用\
  \ `TriggerEvent()` 允许消息发送者强制立即处理其消息，而无需等待下一个 `Update()` 事件。这绕过了限流机制，这对于需要在游戏关键时刻发送的消息可能是必要的，因为多等一帧可能会导致出现奇怪的行为。\n\
  \n例如，如果我们希望两个对象在碰撞瞬间被销毁并创建粒子效果，而这项工作由另一个子系统处理（因此需要发送一个事件），那么我们希望通过 `TriggerEvent()`\
  \ 发送消息，以防止对象在事件被处理前继续存在一帧。相反，如果我们想要做一些不那么关键帧的事情，例如当玩家进入新区域时创建弹出消息，我们可以安全地使用 `QueueEvent()`\
  \ 调用来处理它。\n\n尽量避免习惯性地为所有事件使用 `TriggerEvent()`，因为我们可能会在同一帧中同时处理过多调用，导致帧率突然下降。决定哪些事件是关键帧的，哪些不是，并适当使用\
  \ `QueueEvent()` 和 `TriggerEvent()` 方法。\n\n# 实现自定义消息\n\n我们已经创建了消息系统，但一个如何使用它的示例将帮助我们理解这一概念。让我们从定义一对简单的类开始，这些类派生自\
  \ `Message`，我们可以用它们来创建一个新敌人，并通知代码库的其他部分敌人已被创建：\n\n```csharp\npublic class CreateEnemyMessage\
  \ : Message {}\npublic class EnemyCreatedMessage : Message {\n    public readonly\
  \ GameObject enemyObject;\n    public readonly string enemyName;\n    public EnemyCreatedMessage(GameObject\
  \ enemyObject, string enemyName) {\n        this.enemyObject = enemyObject;\n  \
  \      this.enemyName = enemyName;\n    }\n}\n```\n\n`CreateEnemyMessage` 是最简单的消息形式，不包含任何特殊数据，而\
  \ `EnemyCreatedMessage` 将包含对敌人 GameObject 的引用及其名称。消息对象的良好做法是将其成员变量不仅设为 public，还要设为\
  \ readonly。这确保了数据易于访问，但在对象构建后无法更改。这保护了我们的消息内容，防止其在监听器之间传递时被篡改。\n\n# 消息发送\n\n要发送这些消息对象之一，我们只需调用\
  \ `QueueEvent()` 或 `TriggerEvent()` 并传递我们希望发送的消息实例即可。以下代码演示了当按下空格键时如何广播一个 `CreateEnemyMessage`\
  \ 对象：\n\n```csharp\npublic class EnemyCreatorComponent : MonoBehaviour {\n    void\
  \ Update() {\n        if (Input.GetKeyDown(KeyCode.Space)) {\n            MessagingSystem.Instance.QueueMessage(new\
  \ CreateEnemyMessage());\n        }\n    }\n}\n```\n\n如果我们现在测试这段代码，将不会发生任何事情，因为尽管我们通过消息系统发送了一条消息，但没有针对该消息类型的监听器。让我们介绍如何向消息系统注册监听器。\n\
  \n# 消息注册\n\n以下代码包含一对简单的类，它们向消息系统注册，每个类都请求在代码库任何位置广播某些类型的消息时调用其方法之一：\n\n```csharp\n\
  public class EnemyManagerWithMessagesComponent : MonoBehaviour {\n    private List<GameObject>\
  \ _enemies = new List<GameObject>();\n    [SerializeField] private GameObject _enemyPrefab;\n\
  \n    void Start() {\n        MessagingSystem.Instance.AttachListener(typeof(CreateEnemyMessage),\n\
  \        this.HandleCreateEnemy);\n    }\n\n    bool HandleCreateEnemy(Message msg)\
  \ {\n        CreateEnemyMessage castMsg = msg as CreateEnemyMessage;\n\n       \
  \ string[] names = { \"Tom\", \"Dick\", \"Harry\" };\n        GameObject enemy =\
  \ GameObject.Instantiate (_enemyPrefab,\n        5.0f * Random.insideUnitSphere,\n\
  \        Quaternion.identity);\n        string enemyName = names[Random.Range (0,\
  \ names.Length)];\n        enemy.gameObject.name = enemyName;\n        _enemies.Add\
  \ (enemy);\n        MessagingSystem.Instance.QueueMessage (new EnemyCreatedMessage\
  \ (enemy,\n        enemyName));\n        return true;\n    }\n}\n\npublic class\
  \ EnemyCreatedListenerComponent : MonoBehaviour {\n    void Start () {\n       \
  \ MessagingSystem.Instance.AttachListener (typeof (EnemyCreatedMessage),\n     \
  \   HandleEnemyCreated);\n    }\n\n    bool HandleEnemyCreated (Message msg) {\n\
  \        EnemyCreatedMessage castMsg = msg as EnemyCreatedMessage;\n        Debug.Log\
  \ (string.Format (\"A new enemy was created! {0}\",\n        castMsg.enemyName));\n\
  \        return true;\n    }\n}\n```\n\n在初始化期间，`EnemyManagerWithMessagesComponent`\
  \ 类注册以接收 `CreateEnemyMessage` 类型的消息，并将通过其 `HandleCreateEnemy ()` 委托处理该消息。在此方法中，它可以将消息类型转换为适当的派生消息类型，并以其独特的方式解析消息。其他类可以为同一消息注册，并通过其自定义委托方法以不同方式解析它（假设早期的监听器没有从其自身委托返回\
  \ `true`）。\n\n我们知道 `HandleCreateEnemy ()` 方法的 `msg` 参数将提供什么类型的消息，因为我们在通过 `AttachListener\
  \ ()` 调用注册时已定义它。因此，我们可以确信类型转换是安全的，并可以节省时间，无需进行 `null` 引用检查，尽管从技术上讲，没有什么能阻止我们使用同一个委托来处理多种消息类型。不过，在这些情况下，我们需要实现一种方法来确定传递的是哪个消息对象并相应地处理它。然而，最佳方法是为每种消息类型定义一个唯一的方法，以保持适当的解耦。试图使用一个单体方法来处理所有消息类型几乎没有好处。\n\
  \n请注意，`HandleEnemyCreated()` 方法定义与 `MessageHandlerDelegate` 的函数签名匹配（即，它具有相同的返回类型和参数列表），并且它在\
  \ `AttachListener()` 调用中被引用。这就是我们告诉消息系统在广播给定消息类型时调用什么方法，以及委托如何确保类型安全。如果函数签名具有不同的返回值或不同的参数列表，那么它将是\
  \ `AttachListener()` 方法的无效委托，我们将得到编译器错误。另外，请注意 `HandleEnemyCreated()` 也是一个私有方法，但我们的\
  \ `MessagingSystem` 类仍然能够调用它。这是委托的一个有用特性，允许我们只允许我们授权的系统调用此消息处理程序。公开该方法可能会导致我们代码\
  \ API 的一些混淆，开发人员可能会认为他们应该直接调用该方法，但这并非其预期用途。\n\n美妙之处在于，我们可以随意为委托方法命名。最合理的方法是根据它处理的消息来命名该方法。这使得任何阅读我们代码的人都清楚该方法的用途，以及必须发送什么消息对象类型才能调用它。这使得未来对我们代码的解析和调试变得更加简单，因为我们可以通过消息及其处理委托的匹配名称来跟踪事件链。\n\
  \n在 `HandleCreateEnemy()` 方法期间，我们还排队了另一个事件，该事件广播一个 `EnemyCreatedMessage`。第二个类 `EnemyCreatedListenerComponent`\
  \ 注册以接收这些消息，然后打印出包含该信息的消息。这就是我们实现子系统之间相互通知变化的方式。在实际应用中，我们可能会注册一个 UI 系统来监听这些类型的消息，并更新屏幕上的计数器以显示当前有多少个敌人处于活动状态。在这种情况下，敌人管理系统和\
  \ UI 系统被适当地解耦，因此它们不需要知道对方如何运行的任何特定信息即可完成各自的任务。\n\n如果我们现在将 `EnemyManagerWithMessagesComponent`、`EnemyCreatorComponent`\
  \ 和 `EnemyCreatedListenerComponent` 添加到场景中，并多次按下空格键，我们应该会在控制台窗口中看到日志消息出现，告知我们测试成功：\n\
  \n\n\n\n\n请注意，在场景初始化期间，将创建一个 `MessagingSystem` 单例对象，当 `EnemyManagerWithMessagesComponent`\
  \ 对象或 `EnemyCreatedListenerComponent` 对象的 `Start()` 方法被调用时（以先发生者为准），因为这是它们向消息系统注册其委托的时候，而消息系统会访问\
  \ `Instance` 属性，从而创建包含单例组件所需的 `GameObject`。我们无需额外努力来创建 `MessagingSystem` 对象。\n\n\
  # 消息清理\n\n由于消息对象是类，它们会在内存中动态创建，并在消息被处理并分发给所有监听器后很快被销毁。然而，正如你在第 8 章《精通内存管理》中将学到的，这最终会导致垃圾回收，因为内存会随时间累积。如果我们的应用程序运行足够长的时间，最终会导致偶尔发生垃圾回收，这是\
  \ Unity 应用程序中意外且突然的 CPU 性能激增的最常见原因。因此，明智的做法是谨慎使用消息系统，并避免在每次更新时过于频繁地发送消息。\n\n更需要考虑的重要清理操作是，如果对象需要被销毁，则注销委托。如果我们不妥善处理此问题，消息系统将保留委托引用，这会阻止对象被完全销毁并从内存中释放。\n\
  \n本质上，我们需要将每个 `AttachListener()` 调用与适当的 `DetachListener()` 调用配对，当对象被销毁、禁用，或者我们决定不再需要它在发送消息时被查询时。\n\
  \n`MessagingSystem` 类中的以下方法定义将为特定事件分离监听器：\n\n```csharp\npublic bool DetachListener(System.Type\
  \ type, MessageHandlerDelegate handler) {\n    if (type == null) {\n        Debug.Log(\"\
  MessagingSystem: DetachListener failed due to having no \" +\n            \"message\
  \ type specified\");\n        return false;\n    }\n\n    string msgType = type.Name;\n\
  \n    if (!_listenerDict.ContainsKey(type.Name)) {\n        return false;\n    }\n\
  \n    List<MessageHandlerDelegate> listenerList = _listenerDict[msgType];\n    if\
  \ (!listenerList.Contains(handler)) {\n        return false;\n    }\n    listenerList.Remove(handler);\n\
  \    return true;\n}\n```\n\n以下是将 `DetachListener()` 方法添加到我们的 `EnemyManagerWithMessagesComponent`\
  \ 类中的示例用法：\n\n```csharp\nvoid OnDestroy() {\n    if (MessagingSystem.IsAlive) {\n\
  \        MessagingSystem.Instance.DetachListener(typeof(EnemyCreatedMessage),\n\
  \            this.HandleCreateEnemy);\n    }\n}\n```\n\n请注意，此定义如何使用在 `SingletonComponent`\
  \ 类中声明的 `IsAlive` 属性。这保护我们免受上述问题的影响，即在应用程序关闭期间意外创建一个新的 `MessagingSystem`，因为我们无法保证单例总是最后被销毁。\n\
  \n# 总结消息系统\n\n恭喜，我们终于构建了一个功能齐全的全局消息系统，任何对象都可以与之交互，并使用它相互发送消息。这种方法的一个有用特性是它是类型无关的，这意味着消息发送者和监听器甚至不需要派生自任何特定类即可与消息系统交互；它只需要是一个提供消息类型和匹配函数签名的委托函数的类，这使得它对普通类和\
  \ MonoBehaviours 都可访问。\n\n就对 MessagingSystem 类进行基准测试而言，我们会发现它能够在单帧内处理数百甚至数千条消息，且\
  \ CPU 开销极小（当然取决于 CPU）。无论一条消息被分发给 100 个不同的监听器，还是 100 条消息被分发给一个监听器，CPU 使用率基本相同。无论哪种情况，成本大约相同。\n\
  \n即使我们主要在 UI 或游戏事件期间发送消息，这可能也远超我们所需。因此，如果它似乎确实造成了性能问题，那么更有可能是由监听器委托对消息所做的操作引起的，而不是消息系统处理这些消息的能力。\n\
  \n有许多方法可以增强消息系统，以提供我们将来可能需要的更多有用功能，如下：\n\n- 允许消息发送者建议在消息传递给其监听器之前延迟（按时间或帧数计算）\n\
  - 允许消息监听者定义优先级，以决定与等待同一消息类型的其他监听者相比，它接收消息的紧迫程度。这使得监听者可以在注册晚于其他监听者时跳到队列前面\n- 实现一些安全检查，以处理当监听者被添加到特定消息的监听者列表中，而该类型的消息仍在处理中的情况。目前，C#\
  \ 会向我们抛出 EnumerationException，因为委托列表会被 AttachListener() 更改，而它仍在 TriggerEvent() 中被遍历\n\
  \n到此，我们可能已经充分探索了消息系统，因此这些任务将作为学术练习留给你，如果你在游戏中熟悉使用此解决方案，可以自行实施。让我们继续探索通过脚本代码提高性能的更多方法。\n\
  \n# 禁用未使用的脚本和对象\n\n场景有时会变得非常繁忙，尤其是在构建大型开放世界时。调用 `Update()` 回调的对象越多，扩展性就越差，游戏运行就越慢。然而，如果对象在玩家视野之外，或者仅仅是太远而无关紧要，那么正在处理的许多内容可能完全没有必要。在大型城市建设模拟游戏中，这可能不可行，因为整个模拟必须始终处理，但在第一人称和赛车游戏中通常是可行的，因为玩家在广阔的区域中游荡，非可见对象可以暂时禁用，而不会对游戏玩法产生任何明显影响。\n\
  \n# 按可见性禁用对象\n\n有时，我们可能希望当组件或 `GameObject` 不可见时将其禁用。Unity 自带内置渲染功能，用于避免渲染对玩家相机不可见的对象（通过一种称为\
  \ `Frustum Culling` 的技术，这是一个自动过程），以及避免渲染被其他对象遮挡的对象（遮挡剔除，将在 `第 6 章，动态图形` 中讨论），但这些仅是渲染优化。它们不影响在\
  \ CPU 上执行任务的组件，例如 AI 脚本、用户界面和游戏逻辑。我们必须自己控制该行为。\n\n解决此问题的一个好方法是使用 `OnBecameVisible()`\
  \ 和 `OnBecameInvisible()` 回调。正如名称所暗示的，当场景中任何相机视角下的可渲染对象变得可见或不可见时，会调用这些回调方法。此外，当场景中有多个相机时（例如，本地多人游戏），只有当对象对任意一个相机可见且对所有相机不可见时，才会调用回调。这意味着上述回调将在我们预期的准确时刻被调用；如果无人能看到它，`OnBecameInvisible()`\
  \ 会被调用，如果至少有一个玩家能看到它，`OnBecameVisible()` 会被调用。\n\n由于可见性回调必须与渲染管道通信，`GameObject`\
  \ 必须附加一个可渲染组件，例如 `MeshRenderer` 或 `SkinnedMeshRenderer`。我们必须确保我们希望接收可见性回调的组件也附加到与可渲染对象相同的\
  \ `GameObject` 上，而不是父级或子级 `GameObject`，否则它们不会被调用。\n\n\n\n\n\n# 通过距离禁用对象\n\n在其他情况下，我们可能希望组件或\
  \ `GameObjects` 在距离玩家足够远、几乎不可见但又远到无关紧要时被禁用。这种活动的一个很好候选对象是我们希望在远处看到的漫游 AI 生物，但不需要它处理任何事情，它可以保持空闲状态，直到我们靠近。\n\
  \n以下代码是一个简单的协程，它会定期检查与给定目标对象的总距离，如果偏离太远，则禁用自身：\n\n```\n[SerializeField] GameObject\
  \ _target;\n[SerializeField] float _maxDistance;\n[SerializeField] int _coroutineFrameDelay;\n\
  void Start() {\n    StartCoroutine(DisableAtADistance());\n}\n```\n\n请注意，Unity 也会将\
  \ **Scene** 窗口的隐藏摄像机计入 `OnBecameVisible()` 和 `OnBecameInvisible()` 回调中。如果我们发现这些方法在\
  \ Play Mode 测试期间未被正确调用，请确保将 **Scene** 窗口摄像机转向远离所有内容，或完全禁用 **Scene** 窗口。\n\n要使用可见性回调启用/禁用单个组件，我们可以添加以下方法：\n\
  \n```\nvoid OnBecameVisible() { enabled = true; }\nvoid OnBecameInvisible() { enabled\
  \ = false; }\n```\n\n另外，要启用/禁用组件所附加的整个 `GameObject`，我们可以这样实现这些方法：\n\n```\nvoid OnBecameVisible()\
  \ { gameObject.SetActive(true); }\nvoid OnBecameInvisible() { gameObject.SetActive(false);\
  \ }\n```\n\n但是，请注意，禁用包含可渲染对象的 `GameObject` 或其任何父对象，将使 `OnBecameVisible()` 无法被调用，因为现在没有图形表示供摄像机看到并触发回调。我们应该将组件放在子\
  \ `GameObject` 上，并让脚本禁用该子对象，而让可渲染对象始终保持可见（或稍后找到另一种方式重新启用它）。\n\n```\nIEnumerator\
  \ DisableAtADistance() {\n    while(true) {\n        float distSqrd = (transform.position\
  \ -\n        _target.transform.position).sqrMagnitude;\n        if (distSqrd < _maxDistance\
  \ * _maxDistance) {\n            enabled = true;\n        } else {\n           \
  \ enabled = false;\n        }\n\n        for (int i = 0; i < _coroutineFrameDelay;\
  \ ++i) {\n            yield return new WaitForEndOfFrame();\n        }\n    }\n\
  }\n```\n\n我们应该将玩家角色对象（或我们想要比较的任何对象）分配给 **Inspector** 窗口中的 `_target` 字段，在 `_maxDistance`\
  \ 中定义最大距离，并使用 `_coroutineFrameDelay` 字段修改协程被调用的频率。每当对象距离分配给 `_target` 的对象超过 `_maxDistance`\
  \ 距离时，它将被禁用。如果它返回该距离内，将被重新启用。\n\n此实现的一个微妙的性能增强特性是比较距离的平方而不是原始距离。这便引出了我们的下一节。\n\n\
  # 考虑使用距离平方而非距离\n\n可以安全地说，CPU 对相乘浮点数相对擅长，但对从中计算平方根相对糟糕。每次我们要求 `Vector3` 使用 `magnitude`\
  \ 属性或 `Distance()` 方法计算距离时，我们都在要求它执行平方根计算（根据勾股定理），与许多其他类型的向量数学计算相比，这可能会带来大量的 CPU\
  \ 开销。\n\n然而，`Vector3` 类还提供了一个 `sqrMagnitude` 属性，它提供与距离相同的结果，只是值被平方了。这意味着，如果我们也对要比较距离的值进行平方，那么我们就可以在不承担昂贵的平方根计算成本的情况下，执行基本相同的比较。\n\
  \n例如，考虑以下代码：\n```\nfloat distance = (transform.position - other.transform.position).Distance();\n\
  if (distance < targetDistance) {\n    // do stuff\n}\n```\n\n这可以替换为以下代码，并实现几乎相同的结果：\n\
  ```\nfloat distanceSqrd = (transform.position -\nother.transform.position).sqrMagnitude;\n\
  if (distanceSqrd < (targetDistance * targetDistance)) {\n    // do stuff\n}\n```\n\
  \n结果几乎相同的原因是浮点精度。由于值将被调整到具有不同可表示数字密度的区域，我们可能会失去使用平方根值时拥有的某些精度；它可能正好落在，或更接近一个更准确的可表示数字，或者更可能的是，它会落在一个精度较低的数字上。因此，比较并不完全相同，但在大多数情况下，它足够接近以至于无法察觉，而以这种方式替换的每条指令，性能提升可能非常显著。\n\
  \n如果这种微小的精度损失不重要，那么应该考虑这个性能技巧。但是，如果精度非常重要（例如运行准确的大规模银河系太空模拟），那么你可能想跳过这个技巧。\n\n请注意，此技术可用于任何平方根计算，而不仅仅是距离。这只是你可能遇到的最常见的例子，它揭示了\
  \ `Vector3` 类的重要 `sqrMagnitude` 属性。Unity Technologies 故意暴露了这个属性，以便我们以这种方式使用它。\n\n\
  # 最小化反序列化行为\n\nUnity 的序列化系统主要用于场景、预制体、ScriptableObjects 和各种资源类型（这些类型通常派生自 ScriptableObject）。当这些对象类型之一保存到磁盘时，它会被转换为使用\
  \ **Yet Another Markup Language (YAML)** 格式的文本文件，以后可以反序列化回原始对象类型。当预制体或场景被序列化时，所有\
  \ `GameObjects` 及其属性都会被序列化，包括 `private` 和 `protected` 字段、所有组件及其子 `GameObjects` 和组件，等等。\n\
  \n当我们构建应用程序时，这些序列化数据会在内部捆绑在大型二进制数据文件中，在 Unity 中称为序列化文件。在运行时从磁盘读取和反序列化这些数据是一个极其缓慢的过程（相对而言），因此所有反序列化活动都伴随着显著的性能开销。\n\
  \n每当我们调用 `Resources.Load()` 加载位于名为 `Resources` 的文件夹下的文件路径时，就会发生这种反序列化。一旦数据从磁盘加载到内存中，以后重新加载相同引用会快得多，但首次访问时总是需要磁盘活动。自然，我们需要反序列化的数据集越大，这个过程花费的时间就越长。由于预制体的每个组件都会被序列化，层级越深，需要反序列化的数据就越多。这对于层级非常深的预制体、包含许多空\
  \ `GameObjects` 的预制体（因为每个 `GameObject` 始终至少包含一个 `Transform` 组件）来说可能是个问题，对于用户界面（UI）预制体尤其成问题，因为它们通常包含比典型预制体多得多的组件。\n\
  \n加载这些大型序列化数据集在首次加载时可能会导致 CPU 显著峰值，如果它们需要在场景开始时立即使用，往往会增加加载时间。更重要的是，如果它们在运行时加载，可能会导致帧率下降。我们可以使用几种方法来最小化反序列化的开销。\n\
  \n# 减少序列化对象大小\n\n我们应该尽量使序列化对象尽可能小，或者将它们分区为较小的数据片段，逐块组合，以便可以逐块随时间加载。对于预制体来说，这可能难以管理，因为\
  \ Unity 不原生支持嵌套预制体，因此我们需要自己实现这样的系统，这在 Unity 中是一个臭名昭著的难题。UI 预制体是分割成较小片段的良好候选对象，因为我们通常不需要在任何给定时刻加载整个\
  \ UI，因此我们通常可以负担得起一次加载一个片段。\n\n# 异步加载序列化对象\n\n预制体和其他序列化内容可以通过 `Resources.LoadAsync()`\
  \ 异步加载，这将把从磁盘读取卸载到工作线程，从而减轻主线程的负担。序列化对象需要一些时间才能可用，可以通过调用前一方法返回的 `ResourceRequest`\
  \ 对象上的 `isDone` 属性来检查。\n\n\n\n\n\n这对于我们在游戏开始时立即需要的 Prefab 来说并不理想，但所有未来的 Prefab 都是异步加载的良好候选者，前提是我们愿意创建系统来管理这种行为。\n\
  \n# 将先前加载的序列化对象保留在内存中\n\n如前所述，一旦序列化对象加载到内存中，它就会一直保留在那里，如果我们以后需要，可以对其进行副本，例如实例化更多\
  \ Prefab 副本。我们可以通过显式调用 `Resources.Unload()` 稍后释放这些数据，这将释放内存空间以供以后重复使用。但是，如果应用程序预算中有大量剩余内存，我们可以选择将这些数据保留在内存中，这将减少以后从磁盘重新加载的需求。这自然会随着越来越多的序列化数据而消耗大量内存，使其成为内存管理的一种风险策略，因此我们只有在必要时才应该这样做。\n\
  \n# 将常用数据移至 ScriptableObjects\n\n如果我们有许多不同的 Prefab，其组件包含大量倾向于共享数据的属性，例如生命值、力量、速度等游戏设计值，那么所有这些数据都将被序列化到使用它们的每个\
  \ Prefab 中。更好的方法是将这些常用数据序列化在 `ScriptableObject` 中，由它们加载和使用。这减少了存储在 Prefab 序列化文件中的数据量，并可以通过避免过多重复工作来显著减少场景加载时间。\n\
  \n# 加载场景时使用叠加加载和异步加载\n\n场景可以加载以替换当前场景，也可以叠加加载以将其内容添加到当前场景中而不卸载前一个场景。这可以通过 `SceneManager.LoadScene()`\
  \ 函数系列的 `LoadSceneMode` 参数进行切换。\n\n另一种场景加载模式是同步或异步完成加载，两者都有充分的理由使用。同步加载是加载场景的典型方式，通过调用\
  \ `SceneManager.LoadScene()` 实现，主线程会阻塞直到给定场景加载完成。这通常会导致糟糕的用户体验，因为游戏在加载内容时（无论是替换还是叠加加载）看起来会冻结。如果我们希望玩家尽快进入游戏，或者没有时间等待场景对象出现，则最适合使用此方式。这通常用于加载游戏的第一关或返回主菜单。\n\
  \n然而，对于未来的场景加载，我们可能希望降低性能影响，以便继续让玩家保持在游戏中。加载场景需要大量工作，场景越大，所需时间越长。但是，异步叠加加载的选项提供了巨大的好处；我们可以让场景在后台逐渐加载，而不会对用户体验造成显著影响。这可以通过\
  \ `SceneManager.LoadSceneAsync()` 结合为加载模式参数传递 `LoadSceneMode.Additive` 来实现。\n\n\
  重要的是要意识到，场景并不严格遵循游戏关卡的概念。在大多数游戏中，玩家通常一次只被困在一个关卡中，但 Unity 可以通过叠加加载支持同时加载多个场景，允许每个场景代表关卡的一小部分。因此，我们可以初始化关卡的第一个场景（`Scene-1-1a`），当玩家接近下一部分时，异步且叠加地加载下一个场景（`Scene-1-1b`），并在玩家穿越关卡时不断重复此过程。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_115_0.png)\n\nUnity Technologies 在 Unity\
  \ 5 的中期版本中重构了场景系统，将其改为全局 `SceneManager` 类，尽管这更多是一种命名约定的更改，以明确关卡和场景不是同一回事。旧版 Unity\
  \ 中也有完全相同的功能，只是通过 `Application` 类使用略有不同的 API。\n\n利用此功能需要一个系统，该系统要么不断检查玩家在关卡中的位置直到他们靠近，要么使用触发体积广播消息，表明玩家正在接近下一部分，并在适当的时间开始异步加载。另一个重要考虑因素是，场景内容不会立即出现，因为异步加载有效地将加载分散到几帧中，以尽可能减少可见影响。我们需要确保在有足够的时间余量的情况下触发异步场景加载，以便玩家不会看到对象突然出现在游戏中。\n\
  \n场景也可以卸载以将其从内存中清除。这将通过删除不再需要的使用 `Update()` 的组件来节省一些内存或运行时性能。同样，这可以使用 `SceneManager.UnloadScene()`\
  \ 和 `SceneManager.UnloadSceneAsync()` 同步或异步完成。这可以带来巨大的性能优势，因为我们只根据玩家在关卡中的位置使用所需内容，但请注意，无法卸载单体场景的小部分。如果原始场景文件非常大，那么卸载它将卸载所有内容。原始场景必须拆分为较小的场景，然后根据需要加载和卸载。同样，只有在确定玩家不再能看到场景的组成对象时，才应开始卸载场景，否则玩家会看到对象凭空消失。最后一个考虑因素是，场景卸载将触发许多对象的销毁，这可能会释放大量内存并触发垃圾回收器。在使用此技巧时，高效利用内存也很重要。\n\
  \n这种方法需要大量的场景重新设计工作、脚本编写、测试和调试，不容小觑，但改善用户体验的好处是非凡的。游戏区域之间的无缝过渡是玩家和评论家经常称赞的好处，因为它不会让玩家脱离游戏。如果我们适当使用它，可以节省大量运行时性能，进一步改善用户体验。\n\
  \n# 创建自定义 Update() 层\n\n在本章前面的“Update、协程和 InvokeRepeating”部分中，我们讨论了使用这些 Unity 引擎功能作为避免大多数帧中过度\
  \ CPU 工作量的相对优缺点。无论我们可能采用哪种方法，都有额外的风险，即有大量 `MonoBehaviours` 编写为定期调用某个函数，即在同一帧中同时触发太多方法。\n\
  \n想象一下，成千上万个 `MonoBehaviours` 在场景开始时一起初始化，每个都同时启动一个协程，每 500 毫秒处理一次 AI 任务。它们很可能会在同一帧中全部触发，导致\
  \ CPU 使用率在短时间内大幅飙升，暂时平息，然后在几分钟后下一轮 AI 处理到来时再次飙升。理想情况下，我们希望将这些调用分散到一段时间内。\n\n以下是解决此问题的可能方案：\n\
  \n- 每次计时器过期或协程触发时生成一个随机等待时间\n- 分散协程初始化，使每帧只启动少数几个协程\n- 将调用更新的责任交给某个上帝类，该类限制每帧发生的调用次数\n\
  \n前两个选项很有吸引力，因为它们相对简单，并且我们知道协程可能为我们节省大量不必要的开销。但是，正如我们讨论的，这种剧烈的设计变更与许多危险和意外的副作用相关联。\n\
  \n优化更新的一种潜在更好方法是根本不使用 `Update()`，或者更准确地说，只使用一次。当 Unity 调用 `Update()` 时，实际上任何回调函数，都会跨越上述的原生-托管桥接器，这可能是一项昂贵的任务。换句话说，执行\
  \ 1000 个单独的 `Update()` 回调的处理成本将比执行一个调用 1000 个常规函数的 `Update()` 回调更昂贵。正如我们在“删除空回调定义”部分所见，为\
  \ CPU 调用数千次 `Update()` 并非微不足道的工作，主要是因为桥接器。因此，我们可以通过让一个上帝类 `MonoBehaviour` 使用其自身的\
  \ `Update()` 回调来调用我们自定义的更新式系统（由我们的自定义组件使用），来最大限度地减少 Unity 跨越桥接器的频率。\n\n事实上，许多 Unity\
  \ 开发者更喜欢从项目一开始就实现这种设计，因为它使他们能够更精细地控制更新在系统中传播的时间和方式；这可用于菜单暂停、冷却时间操纵效果，或者在检测到即将达到当前帧\
  \ CPU 预算时优先处理重要任务和/或挂起低优先级任务。\n\n所有希望与这种系统集成的对象都必须有一个共同的入口点。我们可以通过使用 `interface`\
  \ 关键字的接口类来实现这一点。接口类本质上建立了一个契约，即任何实现接口类的类都必须提供一组特定的方法。换句话说，如果我们知道对象实现了接口类，那么我们可以确定哪些方法可用。在\
  \ C# 中，类只能从单个基类派生，但可以实现任意数量的接口类（这避免了 C++ 程序员熟悉的“致命菱形继承”问题）。\n\n\n\n\n\n下面的接口类定义就足够了，它只要求实现类定义一个名为\
  \ OnUpdate() 的单一方法：\n\n```csharp\npublic interface IUpdateable {\n    void OnUpdate(float\
  \ dt);\n}\n```\n\n将接口类定义以大写字母 'I' 开头是常见做法，以便明确我们处理的是接口类。接口类的优点在于它们能提高代码库的解耦度，允许替换庞大的子系统，只要遵循接口类，我们就能更有信心地确保其按预期继续运行。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_118_0.png)\n\n接下来，我们将定义一个实现此接口类的自定义 MonoBehaviour\
  \ 类型：\n\n```csharp\npublic class UpdateableComponent : MonoBehaviour, IUpdateable\
  \ {\n    public virtual void OnUpdate(float dt) {}\n}\n```\n\n请注意，我们将方法命名为 OnUpdate()\
  \ 而不是 Update()。我们定义的是同一概念的自定义版本，但希望避免与内置的 Update() 回调发生名称冲突。\n\nUpdateableComponent\
  \ 类的 OnUpdate() 方法会获取当前的增量时间（dt），从而避免大量不必要的 Time.deltaTime 调用，后者通常用于 Update() 回调中。我们还将该函数设为\
  \ virtual，以便派生类可以对其进行自定义。\n\n按当前编写方式，此函数永远不会被调用。Unity 会自动捕获并调用名为 Update() 的方法，但对我们的\
  \ OnUpdate() 函数一无所知，因此我们需要实现一些东西，在合适的时机调用此方法。例如，可以使用某种 GameLogic 神类来实现此目的。\n\n在初始化此组件期间，我们应该做些事情来通知\
  \ GameLogic 对象它的存在和销毁，以便它知道何时开始和停止调用其 OnUpdate() 函数。\n\n在以下示例中，我们假设 GameLogic 类是一个\
  \ SingletonComponent，如前面“单例组件”部分所定义，并具有适当的静态函数用于注册和注销。请记住，它也可以同样轻松地使用上述的 MessagingSystem\
  \ 来通知 GameLogic 其创建/销毁情况。\n\n对于 MonoBehaviour 要挂钩到此系统，最合适的位置是在其 Start() 和 OnDestroy()\
  \ 回调中：\n\n```csharp\nvoid Start() {\n    GameLogic.Instance.RegisterUpdateableObject(this);\n\
  }\n```\n\n```csharp\nvoid OnDestroy() {\n    if (GameLogic.Instance.IsAlive) {\n\
  \        GameLogic.Instance.DeregisterUpdateableObject(this);\n    }\n}\n```\n\n\
  最好使用 Start() 方法来完成注册任务，因为使用 Start() 意味着我们可以确定所有其他预先存在的组件至少在此时之前已调用过它们的 Awake() 方法。这样一来，在我们开始对对象调用更新之前，任何关键的初始化工作都已经完成。\n\
  \n请注意，由于我们在 MonoBehaviour 基类中使用 Start()，如果在派生类中定义 Start() 方法，它将有效地覆盖基类定义，Unity 会将派生类的\
  \ Start() 方法作为回调捕获。因此，明智的做法是实现一个 virtual Initialize() 方法，以便派生类可以覆盖它来自定义初始化行为，而不会干扰基类通知\
  \ GameLogic 对象我们组件存在的任务。\n\n以下代码提供了如何实现 virtual Initialize() 方法的示例：\n\n```csharp\n\
  void Start() {\n    GameLogic.Instance.RegisterUpdateableObject(this);\n    Initialize();\n\
  }\nprotected virtual void Initialize() {\n    // derived classes should override\
  \ this method for initialization code,\n    // and NOT reimplement Start()\n}\n\
  ```\n\n最后，我们需要实现 GameLogic 类。无论它是 SingletonComponent 还是 MonoBehaviour，以及是否使用 MessagingSystem，实现方式基本相同。无论如何，我们的\
  \ UpdateableComponent 类都必须作为 IUpdateable 对象进行注册和注销，而 GameLogic 类必须使用其自身的 Update()\
  \ 回调遍历每个已注册对象并调用其 OnUpdate() 函数。\n\n# 以下是我们 GameLogic 类的定义：\n\n```csharp\npublic\
  \ class GameLogicSingletonComponent :\n    SingletonComponent<GameLogicSingletonComponent>\
  \ {\n    public static GameLogicSingletonComponent Instance {\n        get { return\
  \ (GameLogicSingletonComponent)_Instance; }\n        set { _Instance = value; }\n\
  \    }\n\n    List<IUpdateable> _updateableObjects = new List<IUpdateable>();\n\n\
  \    public void RegisterUpdateableObject(IUpdateable obj) {\n        if (!_updateableObjects.Contains(obj))\
  \ {\n            _updateableObjects.Add(obj);\n        }\n    }\n\n    public void\
  \ DeregisterUpdateableObject(IUpdateable obj) {\n        if (_updateableObjects.Contains(obj))\
  \ {\n            _updateableObjects.Remove(obj);\n        }\n    }\n\n    void Update()\n\
  \    {\n        float dt = Time.deltaTime;\n        for (int i = 0; i < _updateableObjects.Count;\
  \ ++i) {\n            _updateableObjects[i].OnUpdate(dt);\n        }\n    }\n}\n\
  ```\n\n如果我们确保所有自定义组件都继承自 UpdateableComponent 类，那么我们就有效地将 N 次 Update() 回调调用替换为仅一次\
  \ Update() 回调加上 N 次虚函数调用。这可以节省大量性能开销，因为尽管我们在调用虚函数（与非虚函数调用相比，虚函数调用会产生微小的额外开销，因为需要将调用重定向到正确位置），但我们仍然将绝大部分更新行为保留在托管代码中，并尽可能避免原生-托管桥接。此类甚至可以扩展以提供优先级系统，以便在检测到当前帧耗时过长时跳过低优先级任务，以及许多其他可能性。\n\
  \n取决于你当前项目的进度，此类更改可能会非常艰巨、耗时，并且在子系统更新以使用完全不同的依赖项集时很可能引入大量错误。但是，如果时间允许，其收益可能超过风险。明智的做法是在与当前场景文件设计相似的场景中对一组对象进行一些测试，以验证收益是否超过成本。\n\
  \n## 总结\n\n本章向你介绍了许多改进 Unity 引擎脚本编写实践的方法，其目的是在（且仅在）你已经证明它们是性能问题根源的情况下提升性能。其中一些技术在实施前需要一些前期思考和性能分析调查，因为它们通常伴随着引入额外风险或使新开发人员难以理解我们代码库的问题。工作流程往往与性能和设计同样重要，因此在对代码进行任何性能更改之前，你应该考虑是否在性能优化的祭坛上牺牲了过多东西。\n\
  \n我们将在后续的第 8 章《精通内存管理》中探讨更高级的脚本改进技术，但现在让我们暂时放下代码，探索一些使用一对内置 Unity 功能（即动态批处理和静态批处理）来改进图形性能的方法。\n"
- '## 3 批处理的优势


  在 3D 图形和游戏中，批处理是一个非常通用的术语，描述的是将大量零散的数据片段组合在一起并将其作为单个大数据块进行处理的过程。这种情况对 CPU（尤其是 GPU）非常理想，因为它们可以利用多个核心同时处理多个任务。单个核心在内存中不同位置之间来回切换需要时间，因此这种情况越少越好。


  在某些情况下，批处理指的是用于表示 3D 对象的大量网格、顶点、边缘、UV 坐标和其他不同数据类型的集合。但是，该术语也同样可以指批处理音频文件、精灵、纹理文件和其他大型数据集的行为。


  因此，为了消除任何混淆，当在 Unity 中提到批处理主题时，它通常是指 Unity 提供的用于批处理网格数据的两种主要机制：动态批处理和静态批处理。这些方法本质上是两种不同的几何合并形式，我们将多个对象的网格数据合并在一起，并在单个指令中渲染它们，而不是分别准备和绘制每个对象。


  将多个网格批处理为单个网格的过程是可能的，因为网格对象没有理由必须占据 3D 空间中的连续体积。渲染管线完全乐于接受一组未通过边缘相互连接的顶点，因此我们可以将多个可能导致多个渲染指令的独立网格合并为一个网格，从而使用单个指令将其渲染出来。






  多年来，关于动态批处理（Dynamic Batching）和静态批处理（Static Batching）系统在什么条件下激活，以及在哪些情况下可能会看到性能提升，一直存在诸多困惑。毕竟，在某些情况下，如果批处理使用不当，实际上可能会降低性能。正确理解这些系统将为我们提供所需的知识，以显著提升应用程序的图形性能。


  本章旨在消除关于这些系统的大量错误信息。我们将通过解释、探索和示例，观察这两种批处理方法是如何运作的。这将使我们能够做出明智的决策，利用其中大部分来改善应用程序的性能。


  本章将涵盖以下主题：


  - 渲染管线（Rendering Pipeline）和绘制调用（Draw Calls）概念的简要介绍

  - Unity 的材质（Materials）和着色器（Shaders）如何协同工作以渲染我们的对象

  - 使用帧调试器（Frame Debugger）可视化渲染行为

  - 动态批处理（Dynamic Batching）的工作原理及其优化方法

  - 静态批处理（Static Batching）的工作原理及其优化方法


  # 绘制调用（Draw Calls）


  在独立讨论动态批处理和静态批处理之前，让我们先了解它们在渲染管线中都试图解决的问题。我们将尽量保持技术细节较为浅显，因为我们将在第 6 章《动态图形》（Dynamic
  Graphics）中更详细地探讨这个主题。


  这些批处理方法的主要目标是减少渲染当前视图中所有对象所需的绘制调用数量。在最基本的形式下，绘制调用是从 CPU 发送到 GPU 的请求，要求其绘制一个对象。


  > 绘制调用是该过程的常见行业术语，尽管在 Unity 中有时也被称为 SetPass 调用，因为某些底层方法是如此命名的。可以将其视为在启动当前渲染通道之前配置选项。在本书的其余部分，我们将称其为绘制调用。


  # 批处理的好处


  在请求绘制调用之前，需要完成几项任务。首先，网格和纹理数据必须从 CPU 内存（RAM）推送到 GPU 内存（VRAM），这通常发生在场景初始化期间，但仅适用于场景文件已知的纹理和网格。如果我们在运行时使用尚未出现在场景中的纹理和网格数据动态实例化对象，则必须在实例化时加载它们。场景无法预先知道我们计划在运行时实例化哪些预制体，因为许多预制体隐藏在条件语句背后，且应用程序的许多行为取决于用户输入。接下来，CPU
  必须通过配置处理绘制调用目标对象所需的选项和渲染功能来准备 GPU。


  CPU 和 GPU 之间的这些通信任务通过底层图形 API 进行，该 API 可能是 DirectX、OpenGL、OpenGLES、Metal、WebGL 或
  Vulkan，具体取决于我们针对的平台和某些图形设置。这些 API 调用通过一个称为驱动程序的库进行，该库维护着一长串复杂且相互关联的设置、状态变量和数据集，这些可以从我们的应用程序中配置和执行（尽管驱动程序设计为同时服务于多个应用程序，以及来自多个线程的渲染调用）。可用功能根据我们使用的显卡和针对的图形
  API 版本而发生巨大变化；更先进的显卡支持更先进的功能，这些功能需要由较新版本的 API 支持，因此需要更新的驱动程序来启用它们。多年来创建的设置、支持的功能以及一个版本与另一个版本之间的兼容性数量之多（特别是对于较旧的
  API，如 DirectX 和 OpenGL），简直令人难以置信。幸运的是，在一定的抽象级别上，所有这些 API 都倾向于以类似的方式运行；因此 Unity 能够通过一个共同接口支持许多不同的图形
  API。


  在渲染对象之前准备渲染管线所必须配置的这组极其庞大的设置，通常被浓缩为一个称为渲染状态（Render State）的单一术语。在更改这些渲染状态选项之前，GPU
  将对所有传入对象保持相同的渲染状态，并以类似的方式渲染它们。


  更改渲染状态可能是一个耗时的过程。例如，如果我们将渲染状态设置为使用蓝色纹理文件，然后要求它渲染一个巨大的网格，那么它将被非常快速地渲染，整个网格都呈现蓝色。然后我们可以渲染另外
  9 个完全不同的网格，它们都将被渲染为蓝色，因为我们没有更改正在使用的纹理。但是，如果我们想要使用 10 个不同的纹理渲染 10 个网格，那么这将花费更长时间。这是因为我们需要在为每个网格发送绘制调用指令之前，使用新纹理准备渲染状态。


  用于渲染当前对象的纹理在图形 API 中实际上是一个全局变量，在并行系统中更改全局变量说起来容易做起来难。在像 GPU 这样大规模并行的系统中，我们必须有效地等待所有当前作业都到达同一个同步点（换句话说，最快的核心需要停止并等待最慢的核心赶上，浪费了他们本可用于其他任务的处理时间），然后才能进行渲染状态更改，此时我们需要重新启动所有并行作业。这可能会浪费大量时间，因此我们越少要求渲染状态更改，图形
  API 处理我们请求的速度就越快。


  可能触发渲染状态同步的事物包括——但不限于——立即将新纹理推送到 GPU 以及更改着色器、光照信息、阴影、透明度以及我们能想到的几乎任何图形设置。


  一旦渲染状态配置完成，CPU 必须决定绘制哪个网格，应该使用哪些纹理和着色器，以及根据对象的位置、旋转和缩放（均表示为一个称为变换的 4x4 矩阵，Transform
  组件由此得名）在哪里绘制对象，然后向 GPU 发送绘制指令。为了保持 CPU 和 GPU 之间通信的高度动态性，新指令被推送到一个称为命令缓冲区（Command
  Buffer）的队列中。此队列包含 CPU 创建的指令，GPU 在完成前一条指令后每次从中拉取。


  批处理改进此过程性能的诀窍在于，新的绘制调用不一定意味着必须配置新的渲染状态。如果两个对象共享完全相同的渲染状态信息，那么 GPU 可以立即开始渲染新对象，因为在上一个对象完成后，相同的渲染状态仍然保持。这消除了由于渲染状态同步而浪费的时间。它还减少了需要推送到命令缓冲区的指令数量，从而减轻了
  CPU 和 GPU 的工作负载。


  # 材质和着色器


  Unity 中的渲染状态本质上通过材质向我们公开。材质是围绕着色器的容器，着色器是定义 GPU 应如何渲染传入顶点和纹理数据的短程序。着色器本身并不具备完成任何有价值工作所需的状态知识。着色器需要漫反射纹理、法线贴图和光照信息等输入，并有效地规定为了渲染传入数据需要设置哪些渲染状态变量。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_126_0.png)


  > 着色器之所以这样命名，是因为多年前其实现最初仅用于处理对象的光照和着色（应用阴影，原本没有阴影）。自那时以来，其目的已大大扩展，现在它们具有更通用的目的，即作为访问多种不同并行任务的编程访问点，但旧名称仍然保留。


  每个着色器都需要一个材质，每个材质必须有一个着色器。即使是未分配材质的新导入网格引入场景中，也会自动分配一个默认（隐藏）材质，这为它们提供了一个基本的漫反射着色器和白色着色。因此，无法摆脱这种关系。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_126_1.png)


  > 请注意，单个材质只能支持一个着色器。在同一网格上使用多个着色器需要为同一网格的不同部分分配单独的材质。


  因此，如果我们想要尽量减少渲染状态更改的频率，可以通过减少场景中使用的材质数量来实现。这将同时带来两项性能改进；CPU 每帧花费更少的时间生成和传输指令到 GPU，GPU
  不需要频繁地停止并重新同步状态更改。


  让我们从一个简单的场景开始，以可视化材质和批处理的行为。但是，在开始之前，我们应该禁用一些渲染选项，因为它们会增加一些额外的绘制调用，这可能会分散注意力：


  1. 导航到 **Edit | Project Settings | Quality** 并将 **Shadows** 设置为 **Disable Shadows**（或选择默认的
  **Fastest** 质量级别）

  2. 导航到 **Edit | Project Settings | Player**，打开 **Other Settings** 选项卡，如果启用了 **Static
  Batching** 和 **Dynamic Batching**，则将其禁用






  接下来，我们将创建一个场景，其中包含一个方向光、四个立方体和四个球体，每个对象都有其独特的材质、位置、旋转和缩放：


  ![](img/da79484c9b30dc915216dbc5454a9bbf_127_0.png)


  在上述截图中，在 **Game** 窗口的 **Stats** 弹出窗口的 **Batching** 值中，我们可以看到总共有 9 个批次。这个值密切代表了用于渲染场景的绘制调用数量。当前视图将消耗其中一个批次来渲染场景的背景，该背景可以设置为
  **Skybox** 或 **Solid Color**。这由相机对象的 **Clear Flags** 设置决定。


  剩余的 8 个批次用于绘制我们的 8 个对象。在每种情况下，绘制调用涉及使用材质的属性准备渲染管线，并要求 GPU 在当前变换下渲染给定的网格。我们已确保每个材质都是唯一的，为此给每个材质分配了一个唯一的纹理文件进行渲染。因此，每个网格都需要不同的渲染状态，因此，我们的
  8 个网格中的每一个都需要一个唯一的绘制调用。


  如前所述，我们可以通过减少导致系统更改渲染状态信息的频率，从理论上将绘制调用的数量最小化。因此，目标的一部分是减少我们使用的材质数量。但是，如果我们将所有对象都设置为使用相同的材质，我们仍然看不到任何好处，批次数量仍保持在
  9：


  ![](img/da79484c9b30dc915216dbc5454a9bbf_128_0.png)


  这是因为我们并没有实际减少渲染状态更改的数量，也没有有效地对网格信息进行分组。不幸的是，渲染管线不够智能，无法意识到我们正在覆盖完全相同的渲染状态值，然后一遍又一遍地要求它渲染相同的网格。


  # 帧调试器


  在深入了解批次如何帮助我们节省绘制调用之前，让我们先探索一个有用的工具，它可以帮助我们确定批次如何影响我们的场景——帧调试器。


  我们可以通过从主窗口选择 **Window | Frame Debugger**，或者单击 Profiler 渲染区域的 **Breakdown View Options**
  中的 **Frame Debugger** 按钮来打开帧调试器。这两种方法都将打开 **Frame Debug** 窗口。


  单击 **Frame Debug** 窗口中的 **Enable** 按钮将允许我们观察场景是如何构建的，一次一个绘制调用。以下截图显示了帧调试器的用户界面，左侧面板中有一组
  GPU 指令列表，右侧面板中有更详细的信息：


  ![](img/da79484c9b30dc915216dbc5454a9bbf_129_0.png)


  这个窗口中有大量信息，如果我们想要调试单个绘制调用的行为，这些信息可以提供有用的信息，但最有用的区域是左侧面板中的 **Drawing** 部分，它列出了场景中所有的绘制调用。


  此部分下的每个项目都代表一个唯一的绘制调用及其渲染的内容。这个工具一个非常有用的功能是能够单击其中任何一个项目，并立即在 **Game** 窗口中观察渲染场景直到该点所需的绘制调用。这让我们可以对两个连续的绘制调用进行快速的可视
  _diff_。这可以轻松地确定哪个对象（或哪些对象）是由给定的绘制调用渲染的。这可以帮助确定一组对象是否被批次处理在一起，方法是查看在该绘制调用期间出现了多少个对象。


  > 帧调试器的一个奇怪 bug（在 Unity 2017 的早期构建中仍然存在）是，如果我们正在观察使用天空盒的场景，并单击 **Drawing** 部分下的各个项目，则只能在
  **Game** 窗口中观察到最终的场景呈现。我们需要暂时通过相机的 **Clear Flags** 设置禁用天空盒，将其设置为 **Solid Color**，以查看绘制调用进度如何在
  **Game** 窗口中显示。


  正如我们在前面的帧调试器截图中看到的，一个绘制调用被用于清除屏幕（标记为 **Clear** 的项目），然后我们的 8 个网格正在 8 个单独的绘制调用中渲染（标记为
  `RenderForward.RenderLoopJob` 的项目）。


  > 请注意，左侧面板中每个项目旁边的数字实际上代表一个图形 API 调用，绘制调用只是其中一种 API 调用类型。这些可以在 `Camera.Render`、`Camera.ImageEffects`
  和 `RenderTexture.ResolveAA` 项目中看到。任何 API 调用都可能和绘制调用一样昂贵，但在复杂场景中，我们将进行的绝大多数 API 调用都以绘制调用的形式出现，因此通常最好先专注于最小化绘制调用，然后再担心后处理效果等内容的
  API 通信开销。


  # 动态批次


  动态批次具有以下三个重要特性：


  - 批次在运行时生成（批次是动态生成的）

  - 包含在批次中的对象可以从一帧到下一帧发生变化，具体取决于哪些网格当前对 **Main Camera** 视图可见（批次内容是动态的）

  - 即使可以在场景中移动的对象也可以被批次处理（它适用于动态对象）


  因此，这些属性使我们得出了动态批次的名称。


  如果我们返回 **Player Settings** 页面并启用 **Dynamic Batching**，我们应该看到批次数量从 9 下降到 6。动态批次会自动识别我们的对象共享材质和网格信息，因此将其中一些组合成一个更大的批次进行处理。我们还应该在帧调试器中看到不同的项目列表，证明网格现在正在被动态批次处理。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_131_0.png)


  从帧调试器可以看到，我们的四个立方体已被合并为一个名为 **Dynamic Batch** 的绘制调用，但我们的四个球体仍然使用四个单独的绘制调用进行渲染。这是因为四个球体不符合动态批次的要求。尽管它们都使用相同的材质，但我们必须满足更多要求。


  成功动态批次处理网格所需的要求列表可以在 Unity 文档中找到，网址为 http://docs.unity3d.com/Manual/DrawCallBatching.html。


  > 在本书出版时，上述页面有些过时，更好的详细说明可以在这篇博客文章中找到：https://blogs.unity3d.com/2017/04/03/how-to-see-why-your-draw-calls-are-not-batched-in-5-6/。


  以下列表涵盖了为给定网格启用动态批次所需的要求：


  - 所有网格实例必须使用相同的材质引用

  - 只有 `ParticleSystem` 和 `MeshRenderer` 组件会被动态批次处理。`SkinnedMeshRenderer` 组件（用于动画角色）和所有其他可渲染组件类型不能被批次处理

  - 每个网格的顶点数限制为 300 个

  - 着色器使用的顶点属性总数不得超过 900 个

  - 要么所有网格实例都应使用统一缩放，要么所有网格都应使用非统一缩放，但不能两者混合

  - 网格实例应引用相同的光照贴图文件

  - 材质的着色器不应依赖于多个通道

  - 网格实例不得接收实时阴影

  - 整个批次中网格索引的总数有一个上限，该上限因所使用的图形 API 和平台而异，大约为 32k-64k 个索引（有关具体信息，请查看文档/上述博客文章）


  需要注意的是 _材质引用_ 这个术语，因为如果我们碰巧使用两个设置相同的不同材质，渲染管线不够智能，无法意识到这一点，它们将被视为不同的材质，因此将被取消动态批次处理资格。其余大多数要求已经解释过了；但是，其中一些要求从描述中并不完全直观或清晰，值得进一步解释。






  # 顶点属性


  顶点属性仅仅是网格文件中按顶点存储的一段信息，每个属性通常由多个浮点数值组成。这包括但不限于顶点位置（相对于网格根点）、法线向量（指向物体表面外侧的向量，最常用于光照计算）、一组或多组纹理
  UV 坐标（用于定义一张或多张纹理如何包裹网格），甚至可能包含每顶点颜色信息（通常用于自定义光照或平面着色低多边形风格物体）。只有 Shader 使用的顶点属性总数少于
  900 的网格才能包含在动态批处理中。


  请注意，查看网格的原始数据文件可能包含的顶点属性信息少于 Unity 加载到内存中的信息，这是因为引擎将网格数据从多种原始数据格式之一转换为内部格式的方式。因此，不要假设我们的
  3D 建模工具告诉我们的网格使用的属性数量就是最终数量。验证属性数量的最佳方法是在 **Project** 窗口中深入网格对象，直到找到 `MeshFilter`
  组件，并查看 **Inspector** 窗口 **Preview** 子部分中出现的 **verts** 值。


  在伴随 Shader 中每顶点使用更多属性数据将消耗我们 900 个属性的预算，从而减少网格在无法再用于动态批处理之前允许拥有的顶点数量。例如，一个简单的漫反射
  Shader 可能每顶点只使用 3 个属性：位置、法线和一组 UV 坐标。因此，动态批处理将能够支持使用此 Shader 的网格，其合计顶点总数为 300 个。然而，一个更复杂的
  Shader，每顶点需要 5 个属性，只能支持使用不超过 180 个顶点的网格进行动态批处理。另外，请注意，即使我们在 Shader 中每顶点使用少于 3 个顶点属性，动态批处理仍然只支持最多
  300 个顶点的网格，因此只有相对简单的对象才是动态批处理的候选对象。


  这就是为什么我们的场景在启用动态批处理后仅节省 3 个 Draw Call 的原因，尽管所有对象共享相同的 Material 引用。Unity 自动生成的立方体网格仅包含
  8 个顶点，每个顶点都有位置、法线和 UV 数据，总共 24 个属性。这远低于 300 个顶点的限制和 900 个顶点属性的限制。然而，自动生成的球体网格包含
  515 个顶点，因此总共有 1,545 个顶点属性。这些网格明显超过了 300 个顶点和 900 个顶点属性的限制，因此无法进行动态批处理。


  如果我们在帧调试器中点击其中一个 Draw Call 项，将出现一个标记为“Why this draw call can''t be batched with
  the previous one”的部分。大多数情况下，下方的说明文本会告诉我们哪个要求未满足（以及/或至少它检测到的第一个），这对于调试批处理行为可能很有用。


  请注意，在 Unity 2017 的早期构建中，出现的说明文本目前有点 buggy，有时实际原因会在点击 DynamicBatch 项时出现。例如，在前面的场景示例中，Draw
  Mesh Sphere (3) 给出的解释是“The material doesn''t have GPU instancing enabled”，这有点令人困惑。然而，查看
  DynamicBatch 项给出了真正的原因，即“a submesh we are trying to dynamic-batch has more than
  300 vertices”。


  # 网格缩放


  文档建议，对象应共享统一缩放，或者每个对象应具有唯一的非统一缩放，才能包含在动态批处理中。统一缩放意味着缩放向量的三个分量（x、y 和 z）彼此相同（但不一定跨网格相同），而非统一缩放意味着这些值中至少有一个与其他值不同，且属于这两组的网格将被放置在两个不同的批次中。


  让我们通过一个示例来解释这一点。假设我们有以下四个对象：A 缩放为 (1, 1, 1)，B 缩放为 (2, 1, 1)，C 缩放为 (2, 2, 1)，D 缩放为
  (2, 2, 2)。对象 A 和 D 具有统一缩放，因为所有三个分量都有相同的值。尽管两个网格的缩放不完全相同，但它们的缩放仍然被视为统一，因此它们将被放置在同一个动态批次中。与此同时，B
  和 C 都具有非统一缩放，因为至少有一个分量与其他分量不同。它们的缩放差异很大（C 在 y 轴上的缩放是 B 的两倍），但它们仍然都被视为非统一，因此它们将被合并在一个单独的批次中。


  但是，请注意，使用负缩放对动态批处理有奇怪的影响。负缩放通常是镜像场景中网格的快速方法，可以避免为仅在一个轴上翻转的对象创建和导入完全不同的网格。这种技巧通常用于一对门，或者只是为了让场景看起来更加多样化。但是，如果我们仅在一条或三条轴上对网格进行负缩放，那么它将被放置在与在零条或两条轴上负缩放的网格不同的动态批次中。三个值（x、y
  或 z）中哪些为负并不重要，只看负值的总数是奇数还是偶数。


  # 动态批处理总结


  当我们想要渲染非常大量的简单网格时，动态批处理是一个非常有用的工具。该系统的设计使其非常适合在我们使用大量外观几乎相同的简单网格时使用。可能应用动态批处理的情况如下：


  - 一片充满岩石、树木和灌木的大森林

  - 一座建筑、工厂或空间站，包含许多简单的常见元素（计算机、走廊部件、管道等）

  - 一款包含许多动态、非动画对象的游戏，具有简单的几何体和粒子效果（例如《几何战争》这样的游戏）


  这种批次拆分行为的另一个奇怪副产品是，对象的渲染顺序可以决定哪些对象被批处理在一起。如果前一个对象会出现在与当前对象不同的批次组中，那么它们无法被批处理。这最好通过以下示例来解释。假设我们有四个对象：V
  缩放为 (1, 1, 1)，W 缩放为 (-1, 1, 1)，X 缩放为 (-1, -1, 1)，Y 缩放为 (-1, -1, -1)，最后 Z 缩放与 V 相同，为
  (1, 1, 1)。对象 V 和 Z 共享常见的统一缩放，因此我们可能期望它们被批处理在一起。但是，如果所有这些对象按上述顺序渲染到场景中，那么对象 V 将被渲染，Unity
  将测试对象 W 和 V 是否可以共享一个批次。它们不能，因为对象 W 的奇数负缩放，因此不进行批处理。Unity 然后将对象 X 与对象 W 进行比较，检查它们是否可以被批处理，它们不能，因为
  W 具有奇数负缩放而 X 具有偶数负缩放。接下来的 W-Y 和 Y-Z 之间的比较出于同样的原因失败。最终结果是，所有五个对象都将使用五个单独的 Draw Call
  进行渲染，并且没有机会将对象 V 和 Z 合并。请注意，这种奇怪的效果仅在使用负缩放时才会出现。如果所有缩放差异都是统一与非统一，那么 Unity 应该能够适当地批处理对象。


  推测，这全都是用于检测有效可批处理组的算法的副产品，因为在两个维度上镜像网格在数学上等同于绕相同轴旋转网格 180 度，而在一条或三条轴上镜像网格没有旋转等效物。因此，我们观察到的行为可能只是动态批处理系统自动为我们转换对象，尽管这并不完全清楚。无论如何，希望这能让我们为在生成动态批次时可能遇到的许多奇怪情况做好准备。






  # 静态批处理


  Unity 通过静态批处理（Static Batching）提供了第二种批处理机制。该批处理功能与动态批处理（Dynamic Batching）在几个方面相似，例如，哪些对象被批处理是在运行时根据相机可见内容来确定的，并且这些批处理的内容会随帧而变化。但是，有一个非常重要的区别：它仅适用于标记为
  **Static** 的对象，因此得名 _Static Batching_。


  静态批处理系统有自己的一组要求：


  - 顾名思义，网格必须被标记为 **Static**（具体来说，是 **Batching Static**）

  - 必须为每个被静态批处理的网格预留额外内存

  - 静态批处理中可合并的顶点数量有上限，该上限因图形 API 和平台而异，大约为 32k-64k 个顶点（具体请参阅文档/上述博客文章）

  - 网格实例可以来自任何源网格，但它们必须共享相同的 Material 引用


  让我们详细介绍其中一些要求。


  ## Static 标志


  静态批处理只能应用于启用了 **static** 标志的对象，或者更具体地说，是 **Batching Static** 子标志（这些子标志称为 **StaticEditorFlags**）。单击
  `GameObject` 的 **Static** 选项旁边的小向下箭头，将显示 **StaticEditorFlags** 的下拉菜单，这些标志可以更改对象在各种
  **Static** 过程中的行为。


  这有一个明显的副作用，即对象的变换（transform）无法更改，因此，任何希望使用静态批处理的对象都不能以任何方式移动、旋转或缩放。


  ## 内存要求


  静态批处理的额外内存要求会有所不同，具体取决于批处理网格中发生的复制量。静态批处理的工作原理是将所有标记且可见的网格的数据复制到一个单一的大型网格数据缓冲区中，并通过单个
  Draw Call 将其传递到渲染管道，同时忽略原始网格。如果所有被静态批处理的网格都是唯一的，那么与正常渲染对象相比，这不会增加我们的内存使用量，因为存储网格所需的内存空间是相同的。


  但是，由于数据实际上被复制了，这些静态批处理的副本会使我们额外消耗内存，其大小等于网格数量乘以原始网格的大小。通常情况下，渲染一个、十个或一百万个相同对象的克隆体所需的内存量是相同的，因为它们都引用相同的网格数据。在这种情况下，对象之间的唯一区别是每个对象的变换。但是，由于静态批处理需要将数据复制到大缓冲区中，这种引用关系就丢失了，因为原始网格的每个副本都被复制到缓冲区中，并带有硬编码到顶点位置中的唯一数据和变换。


  因此，使用静态批处理渲染 1,000 个相同的树对象，将比不使用静态批处理渲染相同的树多消耗 1,000 倍的内存。如果静态批处理使用不当，这会导致严重的内存消耗和性能问题。


  ## Material 引用


  我们已经知道，共享 Material 引用是减少渲染状态更改的一种手段，因此这一要求相当明显。此外，有时我们会静态批处理需要多个 Material 的网格。在这种情况下，所有使用不同
  Material 的网格将被分组到它们自己的静态批处理中，并且对于每个使用的唯一 Material 也是如此。


  这一要求的缺点是，最好的情况下，静态批处理只能使用等于所需 Material 数量的 Draw Call 来渲染所有静态网格。


  ## 静态批处理的注意事项


  静态批处理系统有一些额外的缺点。由于其批处理解决方案的工作方式，即将网格合并为单个更大的网格，静态批处理系统有一些我们需要注意的注意事项。这些问题从小不便到重大缺点不等，具体取决于场景：


  - Draw Call 节省效果在 **Stats** 窗口中不会立即显示，直到运行时

  - 在运行时引入场景中标记为 **Batching Static** 的对象不会自动包含在静态批处理中


  让我们更详细地探讨这些问题。


  ## 静态批处理的编辑模式调试


  尝试确定静态批处理对场景的整体影响可能有点棘手，因为在 **Edit Mode** 中没有任何内容被静态批处理。所有的魔法都发生在运行时，这使得在没有手动测试的情况下很难确定静态批处理能提供哪些好处。我们应该使用帧调试器（Frame
  Debugger）来验证我们的静态批处理是否正确生成，以及它们是否包含预期的对象。


  如果我们将此功能的实现留到项目生命周期的后期，这可能会特别成问题，因为我们可能会花费大量时间启动、调整和重新启动场景，以确保我们获得预期的 Draw Call
  节省。因此，最好在构建新场景的早期就开始进行静态批处理优化。


  不用说，静态批处理的创建工作并非完全轻而易举，如果有许多批处理需要创建和/或有许多大对象需要批处理，它还可能大大增加场景初始化时间。


  ## 在运行时实例化静态网格


  我们在运行时添加到场景中的任何新对象都不会被静态批处理系统自动合并到任何现有批处理中，即使它们被标记为 **Batching Static**。这样做会在重新计算网格和与渲染管道同步之间造成巨大的运行时开销，因此
  Unity 甚至不会尝试自动执行此操作。






  # Static Batching 总结


  Static Batching 是一种强大但危险的工具。如果我们不明智地使用它，很容易通过内存消耗（可能导致应用程序崩溃）和渲染成本给我们的应用程序带来巨大的性能损失。它还需要大量的手动调整和配置，以确保批次被正确生成，并且我们不会意外地引入使用各种
  **Static** 标志的任何非预期副作用。但是，它确实有一个显著的优势，即它可以用于不同形状和巨大尺寸的网格，而这是 Dynamic Batching 无法提供的。


  在大多数情况下，我们应该尝试将任何希望进行静态批处理的网格保留在原始场景文件中。但是，如果需要动态实例化，或者我们正在使用加法场景加载，那么我们可以使用 `StaticBatchUtility.Combine()`
  方法来控制静态批处理资格。此实用程序方法有两个重载：要么我们提供一个根 `GameObject`，在这种情况下，所有带有网格的子 `GameObject` 都将被转换为新的静态批处理组（如果它们共享多个材质，可能会创建多个组），要么我们提供一个
  `GameObject` 列表和一个根 `GameObject`，它会自动将它们作为子项附加到根上，并以同样的方式生成新的静态批处理组。


  我们应该对该函数的使用进行性能分析，因为如果有许多顶点需要合并，这可能是一项相当昂贵的操作。它还不会将给定的网格与任何预先存在的静态批处理组合并，即使它们共享相同的材质。因此，我们将无法通过实例化或加法加载与场景中已存在的其他静态批处理组使用相同材质的
  **Static** 网格来节省 Draw Calls（它只能与在 `Combine()` 调用中分组的网格合并）。


  请注意，如果我们使用 `StaticBatchUtility.Combine()` 方法批处理的任何 `GameObject` 在批处理之前未标记为 **Static**，则这些
  `GameObject` 将保持非 **Static** 状态，但网格本身将是 **Static**。这意味着我们可能会意外移动 `GameObject`、其
  `Collider` 组件以及任何其他重要对象，但网格将保持在同一位置。要小心不要在静态批处理对象中意外混合 **Static** 和非 **Static**
  状态。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_140_0.png)


  # 总结


  很明显，Dynamic Batching 和 Static Batching 系统并非万能药。我们不能盲目地将它们应用于任何给定的场景并期望有所改善。如果我们的应用程序和场景恰好符合一组特定的参数，那么这些方法在减少
  CPU 负载和渲染瓶颈方面非常有效。但是，如果不符合，则需要一些额外的工作来准备我们的场景以满足批处理功能要求。最终，只有对这些批处理系统及其工作原理有良好的理解，才能帮助我们确定在何处以及何时可以应用此功能，希望本章为我们提供了做出明智决策所需的所有信息。


  您将在 `Chapter 6, Dynamic Graphics` 中了解更多关于渲染管道和性能改进技术的内容。在此之前，让我们转到另一个主题，探讨一些我们可以通过以智能方式管理艺术资产来实现的更微妙的性能改进。

  '
- '# 4 启动您的艺术资产


  艺术是一个非常主观的领域，由个人意见和偏好主导。很难说一件艺术品是否以及为什么比另一件更好，而且我们很可能无法在意见上达成完全一致。支持游戏艺术性的艺术资产背后的技术方面也可能非常主观。有多种变通方法可以实施以提高性能，但这些方法往往会以牺牲质量为代价来换取速度。如果我们试图达到峰值性能，那么每当我们决定对艺术资产进行任何更改时，咨询团队成员非常重要，因为这主要是一个平衡行为，本身也可以是一种艺术形式。


  无论我们是试图最小化运行时内存占用、保持尽可能小的可执行文件大小、最大化加载速度，还是保持帧率的一致性，都有很多选项可以探索。有些方法显然总是理想的，但大多数方法在采用之前需要多加小心和预先考虑，因为它们会导致质量降低或增加在其他子系统中出现瓶颈的可能性。


  在本章中，我们将探讨如何为以下资产类型提高性能：


  - 音频文件

  - 贴图文件

  - 网格和动画文件

  - 资源包和资源


  在每种情况下，我们将调查 Unity 在应用程序构建时和运行时如何存储、加载和操作这些资产。我们还将检查在出现性能问题时的选项，以及我们可以做什么来避免可能生成性能瓶颈的行为。


  # 音频


  Unity 作为一个框架，可以用于构建从只需要少量音效和单个背景音轨的小型应用程序，到需要数百万行对话、音乐音轨和环境音效的大型角色扮演游戏的任何东西。无论应用程序的实际范围如何，音频文件通常是构建后应用程序大小（有时称为其“磁盘占用”）的主要贡献者之一。此外，许多开发人员惊讶地发现，运行时音频处理可能会成为
  CPU 和内存消耗的重要来源。


  音频在游戏行业的两个方面都常常被忽视；开发人员往往直到最后一刻才投入许多资源，而用户很少将注意力集中在音频上。当音频处理得当时，没人会注意到，但我们都知道糟糕的音频听起来是什么样子——它立即可辨识，令人不适，并注定会引起不必要的注意。这使得在性能的名义下不要牺牲太多音频清晰度变得至关重要。


  音频瓶颈可能来自各种来源。过度压缩、过多的音频操作、过多的活动音频组件、低效的内存存储方法和访问速度，都是导致内存和 CPU 性能不佳的方式。但是，只要付出一点努力和理解，只需在此处和那里进行一些小调整，就能让我们免于用户体验灾难。


  # 导入音频文件


  当我们在 **Project** 窗口中选择导入的音频文件时，**Inspector** 窗口将显示多个导入设置。这些设置决定了从加载行为、压缩行为、质量、采样率，到（在较新版本的
  Unity 中）是否支持全景声音（多声道音频，通过球谐波结合音轨以创建更真实的音频体验）的所有内容。


  许多音频导入选项可以按平台配置，允许我们在不同目标平台之间自定义行为。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_143_0.png)


  # 加载音频文件


  以下是决定音频文件加载方式的三个设置：


  - Preload Audio Data

  - Load In Background

  - Load Type


  我们的音频文件最初被打包为与应用程序捆绑在一起的二进制数据文件，存储在设备的硬盘上（尽管在某些情况下，它们是从互联网上的某个位置下载的）。加载音频数据只是将其拉入主内存（RAM），以便稍后由音频解码器处理，然后将数据转换为发送到耳机或扬声器的音频信号。但是，加载的方式将根据前三个设置而有很大差异。第一个设置
  Preload Audio Data 决定音频数据是否会在场景初始化期间自动加载，或在稍后加载。当加载音频数据发生时，第二个设置 Load In Background
  决定此活动是阻塞主线程直到完成，还是在后台异步加载。最后，Load Type 设置定义拉入内存的数据类型以及一次拉入多少数据。如果不明智地使用，这三个设置都可能对性能产生极大的负面影响。


  音频文件的典型用例是将其分配给 AudioSource 对象的 audioClip 属性，这将把它包装在 AudioClip 对象中。然后我们可以通过 AudioSource.Play()
  或 AudioSource.PlayOneShot() 触发播放。以这种方式分配的每个音频剪辑都会在场景初始化期间加载到内存中，因为场景包含对这些文件的直接引用，必须在需要之前解析它们。当
  Preload Audio Data 启用时，这是默认情况。


  禁用 Preload Audio Data 告诉 Unity 引擎在场景初始化期间跳过音频文件资产加载，从而将加载活动推迟到首次需要时，即调用 Play() 或
  PlayOneShot() 时。禁用此选项将加快场景初始化速度，但也意味着第一次播放文件时，CPU 需要立即访问磁盘、检索文件、将其加载到内存中、解压缩并播放它。这是一个同步操作，会阻塞主线程直到完成。我们可以通过一个简单的测试来证明这一点：


  ```csharp

  public class PreloadAudioDataTest : MonoBehaviour {

  [SerializeField] AudioSource _source;


  void Update() {

  if (Input.GetKeyDown(KeyCode.Space)) {

  using (new CustomTimer("Time to play audio file", 1)) {


  ```







  如果我们向场景中添加一个 AudioSource，为其分配一个较大的音频文件，并将其分配给 PreloadAudioDataTest 组件的 _source 字段，我们可以按下空格键，查看
  Play() 函数完成所需时间的打印输出。针对一个 10 MB 的音频文件，在启用 Preload Audio Data 的情况下对这段代码进行简单测试，会发现该调用几乎是瞬间完成的。然而，禁用
  Preload Audio Data，应用文件更改，并重复测试会发现，所需时间要长得多（在搭载 Intel i5 3570K 的台式机上大约为 700 毫秒）。这完全超出了单帧的时间预算，因此为了负责任地使用这个开关，我们需要将大部分音频资产提前加载到内存中。


  这可以通过调用 AudioClip.LoadAudioData() 来实现（可以通过 AudioSource 组件的 clip 属性获取）。但是，这个操作仍然会阻塞主线程，阻塞的时间与之前示例中加载所需的时间相同，因此无论我们是否选择提前加载音频文件，加载音频文件仍然会导致帧率下降。数据也可以通过
  AudioClip.UnloadAudioData() 卸载。


  这时 Load In Background 选项就派上用场了。这个选项将音频加载变为异步任务；因此，加载不会阻塞主线程。启用此选项后，对 AudioClip.LoadAudioData()
  的实际调用会立即完成，但请记住，文件在单独的线程上加载完成之前不会准备好播放。我们可以通过 AudioClip.loadState 属性来双重检查 AudioClip
  组件的当前加载状态。如果启用了 Load In Background，并且在不先加载数据的情况下调用 AudioSource.Play()，Unity 仍然需要将文件加载到内存中才能播放，因此从调用
  AudioSource.Play() 到音频文件实际开始播放之间会有延迟。如果我们尝试在音频文件完全加载之前访问它，这可能会导致突兀的行为，使其与其他任务（例如动画）不同步。


  现代游戏通常会在关卡中实现方便的停止点，以执行加载或卸载音频数据等任务——例如楼层之间的电梯或长走廊，那里几乎没有什么动作发生。通过这些方法涉及音频数据自定义加载和卸载的解决方案，需要根据特定游戏量身定制，取决于何时需要音频文件、需要多长时间、场景是如何组装的，以及玩家如何穿越它们。


  这可能需要大量的特殊情况更改、测试和资产管理调整。因此，建议将此方法保留为核选方案，仅在生产后期使用，以防所有其他技术都未能如我们所愿地成功。


  最后，还有 Load Type 选项，它决定了音频数据加载时的方式。有三个选项可用：


  - Decompress On Load

  - Compressed in Memory

  - Streaming


  这三个选项的详细说明如下：


  - Decompress On Load：此设置在磁盘上压缩文件以节省空间，并在首次加载时将其解压到内存中。这是加载音频文件的标准方法，应在大多数情况下使用。解压文件需要一些时间，这会在加载过程中带来额外的开销，但减少了播放音频文件时所需的工作量。

  - Compressed In Memory：此设置仅将压缩文件从磁盘直接复制到内存中加载。它只会在运行时播放音频文件时才进行解压。这会在播放 Audio Clip
  时牺牲运行时 CPU，但提高了加载速度，并在 Audio Clip 保持休眠状态时减少了运行时内存消耗。因此，此选项最适合用于非常大的且使用频率较高的音频文件，或者如果我们在内存消耗方面遇到严重瓶颈，并愿意牺牲一些
  CPU 周期来播放 Audio Clip。

  - Streaming：最后，此设置（也称为 Buffered）将在运行时实时加载、解码和播放文件，通过将文件逐步推送到一个小缓冲区中，一次只有一小部分文件存在于内存中。此方法对特定
  Audio Clip 使用的内存最少，但运行时 CPU 占用最大。由于每次播放文件的实例都需要生成自己的缓冲区，因此此设置带来的不幸缺点是，多次引用 Audio
  Clip 会导致内存中存在多个相同 Audio Clip 的副本，所有副本都必须单独处理，如果使用不当会导致运行时 CPU 成本。因此，此选项最适合保留给单实例
  Audio Clip，这些音频片段定期播放，并且永远不需要与自身的其他实例甚至其他流式 Audio Clip 重叠。例如，此设置最适合用于背景音乐和环境音效，这些音频需要在场景生命周期的大部分时间内播放。


  那么，让我们总结一下。默认情况下，启用 **Preload Audio Data**，禁用 **Load In Background**，且 **Load Type**
  为 **Decompress On Load**，会导致场景加载时间较长，但确保我们在场景中引用的每个 Audio Clip 在需要时都立即可用。当需要 Audio
  Clip 时，不会有加载延迟，并且在调用 `Play()` 时音频片段会立即播放。改善场景加载时间的一个好折衷方案是为我们稍后才需要的 Audio Clips
  启用 **Load In Background**，但这不应该用于场景初始化后不久就需要的 Audio Clips。我们然后通过 `AudioClip.LoadAudioData()`
  和 `AudioClip.UnloadAudioData()` 手动控制音频数据的加载时间。我们应该愿意在单个场景中使用所有这些方法，以达到最佳性能。


  # Encoding formats and quality levels


  Unity 支持三种通用的音频片段编码格式，这由查看 Audio Clip 属性时 **Inspector** 窗口中的 **Compression Format**
  选项决定：


  - **Compressed**（此选项的实际文本可能因平台而异）

  - **PCM**

  - **ADPCM**


  我们导入到 Unity 引擎中的音频文件可以是许多流行的音频文件格式之一，例如 Ogg Vorbis、MPEG-3（MP3）和 Wave，但打包到可执行文件中的实际编码将被转换为不同的格式。


  **Compressed** 设置使用的压缩算法将取决于目标平台。独立应用程序和其他非移动平台会将文件转换为 Ogg-Vorbis 格式，而移动平台使用 MP3。


  有一些平台始终使用特定类型的压缩，例如 PS Vita 的 HEVAG、XBox One 的 XMA 和 WebGL 的 AAC。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_147_0.png)


  在 **Inspector** 窗口中，为当前选定的格式提供统计信息，位于 **Compression Format** 选项之后的区域，以了解压缩节省了多少磁盘空间。请注意，第一个值显示原始文件大小，第二个值显示磁盘上的大小成本。音频文件加载后在运行时将消耗多少内存，将由所选压缩格式的效率决定。例如，Ogg
  Vorbis 压缩通常会解压缩到其压缩大小的约 10 倍，而 ADPCM 会解压缩到压缩大小的约四倍。


  **Inspector** 窗口中为音频文件显示的成本节省仅适用于当前选定的平台和最近应用的设置。确保编辑器在 **File | Build Settings**
  中切换到正确的平台，并在对设置进行更改后单击 **Apply**，以查看当前配置的实际成本节省（或成本膨胀）。这对于 WebGL 应用程序尤其重要，因为 AAC
  格式通常会导致音频文件大小非常膨胀。


  使用的编码/压缩格式会对音频文件在运行时的质量、文件大小和内存消耗产生巨大影响，而只有 **Compressed** 设置让我们能够在不影响文件采样率的情况下更改质量。与此同时，**PCM**
  和 **ADPCM** 设置不提供这种奢侈，我们只能接受这些压缩格式决定的文件大小——除非我们愿意为了文件大小而降低音频质量，通过降低采样率来实现。


  **PCM** 格式是一种无损且未压缩的音频格式，提供了对模拟音频的近似逼近。它以较大的文件大小换取更高的音频质量，最适合用于需要很高清晰度的非常短的音效，任何压缩都会扭曲体验。


  与此同时，**ADPCM** 格式在大小和 CPU 消耗方面都比 **PCM** 高效得多，但压缩会产生相当多的噪声。如果将其保留用于充满混乱的短音效，例如爆炸、碰撞和撞击声，这种噪声可以被掩盖，因为我们可能不会注意到产生的任何伪影。






  最后，**Compressed** 格式会生成体积较小的文件，其质量低于 **PCM**，但显著优于 **ADPCM**，代价是额外的运行时 CPU 占用。在大多数情况下应使用此格式。此选项允许我们自定义压缩算法的最终质量级别，以在质量和文件大小之间进行权衡。**Quality**
  滑块的最佳实践是寻找尽可能小但用户无法察觉的质量级别。可能需要进行一些用户测试，以找到每个文件的 _sweet spot_。


  > 请记住，运行时应用于文件的任何额外音频效果都不会在 _Edit Mode_ 下通过编辑器播放，因此任何更改都应通过应用程序在 _Play Mode_ 下进行完整测试。


  # 音频性能增强


  现在我们对音频文件格式、加载方法和压缩模式有了更好的了解，让我们探讨一些可以通过调整音频行为来提升性能的方法。


  # 最小化活动音频源数量


  由于每个正在播放的音频源都会消耗一定量的 CPU，因此可以通过禁用场景中冗余的音频源来节省 CPU 周期，这很合理。一种方法是限制同一个音频片段可以同时播放的实例数量。这涉及通过一个中介来发送音频播放请求，该中介控制我们的音频源，从而对同一个音频片段同时播放的实例数量设置上限。


  Unity 资产商店中几乎每个音频管理资产都实现了某种音频节流功能（通常称为 _Audio Pooling_），而且有充分的理由；这是在尽量减少过多音频播放的同时以最低质量代价实现的最佳权衡。例如，同时播放
  20 个脚步声和同时播放 10 个脚步声听起来差别不大，而且不太可能因为音量过大而分散注意力。出于这个原因，并且因为这些工具通常提供更多微妙的性能增强功能，建议使用现有解决方案而不是自己开发，因为需要考虑音频文件类型、立体声/3D
  音频、分层、压缩、滤镜、跨平台能力、高效内存管理等方面的复杂性。


  说到环境音效，它们仍然需要放置在场景中的特定位置，以利用对数音量效果，这能产生伪 3D 效果，因此音频池系统可能不是理想的解决方案。限制环境音效播放的最佳方法是减少音频源的总数。最佳方法是删除其中一些音频源，或者将它们减少为一个更大、更响亮的音频源。当然，这种方法会影响用户体验质量，因为声音会显得来自单一来源而不是多个来源，因此应谨慎使用。


  # 为 3D 声音启用强制单声道


  在立体声音频文件上启用强制单声道设置会将两个音频通道的数据混合到单个通道中，有效节省 50% 的文件总磁盘和内存空间占用。对于某些 2D 音效来说，启用此选项通常不是个好主意，因为立体声效果常用于创建特定的音频体验。但是，我们可以为某些
  3D 位置音频片段启用此选项以节省大量空间，因为这两个通道实际上是相同的。这些音频源类型会让音频源与玩家之间的方向决定音频文件如何播放到左/右耳，在这种情况下播放立体声效果通常没有意义。如果不需要立体声效果，将
  2D 声音（无论与音频源的距离/方向如何，都会以全音量播放到玩家耳朵中的声音）强制为单声道也可能有意义。


  # 重采样到较低频率


  将导入的音频文件重采样到较低频率会减小文件大小和运行时内存占用。可以通过将音频文件的 **Sample Rate Setting** 设置为 **Override
  Sample Rate** 来实现，此时可以通过 **Sample Rate** 选项配置采样率。某些文件需要高采样率才能听起来合理，例如高音调文件和大多数音乐文件。但是，在大多数情况下，较低的设置可以在没有明显质量下降的情况下减小文件大小。22,050
  赫兹是涉及人声和古典音乐的音源的常见采样率。某些音效可能可以使用更低的频率值。但是，每个音效都会以独特的方式受到此设置的影响，因此在最终确定采样率决定之前，花些时间运行一些测试是明智的。


  # 考虑所有压缩格式


  如前所述，**Compressed**、**PCM** 和 **ADPCM** 压缩格式各有利弊。在适当的情况下，为不同文件使用不同的编码格式，可以在内存占用、磁盘占用、CPU
  占用和音频质量之间做出一些权衡。我们应该愿意在同一个应用程序中使用所有这些格式，并制定一套适合我们使用的音频文件类型的系统，这样就不需要逐个文件处理。否则，我们需要进行大量测试，以确保每个文件的音频质量没有下降。


  # 谨慎使用流式传输


  **Streaming** 加载类型的优点是运行时内存成本低，因为分配了一个小缓冲区，文件像数据队列一样不断通过它。这看起来很有吸引力，但从磁盘流式传输文件应仅限于大型单实例文件，因为它需要运行时硬盘访问；这是我们可用的最慢的数据访问形式之一（仅次于通过网络拉取文件）。分层或过渡的音乐片段使用
  **Streaming** 选项可能会遇到严重卡顿，此时明智的做法是考虑使用不同的 **Load Type** 并手动控制加载/卸载。我们还应避免同时流式传输多个文件，因为这可能会在磁盘上造成大量缓存未命中，从而中断游戏。这就是为什么此选项主要用于背景音乐/环境音效，因为我们一次只需要一个。


  # 通过混音器组应用滤镜效果以减少重复


  滤镜效果可用于修改通过音频源播放的音效，并可以通过 `FilterEffect` 组件实现。每个单独的滤镜效果都会占用一定的内存和 CPU，并且可以是节省磁盘空间的好方法，同时在音频播放中保持大量多样性，因为一个文件可以通过不同的滤镜组进行调整，生成完全不同的音效。


  由于额外的开销，在场景中过度使用滤镜效果可能会对性能造成严重后果。更好的方法是利用 Unity 的音频混音器实用程序（**Window | Audio Mixer**）生成常见的滤镜效果模板，多个音频源可以引用这些模板，以最大限度地减少内存开销。


  关于音频混音器的官方教程详细介绍了该主题：


  `https://unity3d.com/learn/tutorials/modules/beginner/5-pre-order-beta/ audiomixer-and-audiomixer-groups`


  # 负责任地使用远程内容流式传输


  可以通过 Unity 通过 Web 动态加载游戏内容，这可以是减少应用程序磁盘占用的有效手段，因为需要捆绑到可执行文件中的数据文件更少，并且还提供了一种通过 Web
  服务来呈现动态内容的手段，以确定在运行时向用户呈现什么。资产流式传输可以通过 Unity 5 中的 `WWW` 类或 Unity 2017 中的 `UnityWebRequest`
  类来实现。


  `WWW` 类提供 `audioClip` 属性，用于访问 `AudioClip` 对象，如果它是通过 `WWW` 对象下载的音频文件。但是，请注意，访问此属性每次调用都会分配一个全新的
  `AudioClip` 资源，其他 `WWW` 资源获取方法也是如此。一旦不再需要此资源，必须使用 `Resources.UnloadAsset()` 方法将其释放。


  与托管资源不同，丢弃引用（将其设置为 `null`）不会自动释放资源，因此它将继续占用内存。因此，我们应该只通过 `audioClip` 属性获取一次 `AudioClip`，并且从那时起只使用该引用，并在不再需要时将其释放。


  同时，在 Unity 2017 中，`WWW` 类已被 `UnityWebRequest` 类有效取代，后者使用新的 HLAPI 和 LLAPI 网络层。此类提供各种实用程序来下载和访问主要是文本文件。基于多媒体的请求应通过
  `UnityWebRequestMultimedia` 辅助类进行。因此，如果请求 `AudioClip`，我们应该调用 `UnityWebRequestMultimedia.GetAudioClip()`
  来创建请求，并在下载完成后调用 `DownloadHandlerAudioClip.GetContent()` 来检索它。






  这个新版本的 API 旨在更高效地存储和提供我们请求的数据，因此通过 `DownloadHandlerAudioClip.GetContent()` 多次重新获取
  `AudioClip` 不会导致额外的内存分配。相反，它将仅返回对最初下载的 `AudioClip` 的引用。


  # 考虑音频模块文件用于背景音乐


  音频模块文件，也称为 **Tracker Modules**，是节省大量空间且几乎无音质损失的绝佳方式。Unity 支持的文件扩展名为 `.it`、`.s3m`、`.xm`
  和 `.mod`。与常见的音频格式不同，常见格式被读取为必须在运行时解码才能生成特定声音的比特流，而 Tracker Modules 包含大量小型高质量采样，并将整个音轨组织得类似于乐谱；定义每个采样应在何时、何地、以多大音量、以什么音调以及带有什么特殊效果播放。这可以在保持高质量采样的同时实现显著的体积节省。因此，如果我们有机会使用音乐文件的
  Tracker Module 版本，那么值得探索。


  # 纹理文件


  在游戏开发中，_纹理_（texture）和 _精灵_（sprite）这两个术语经常被混淆，因此有必要加以区分——纹理只是一个图像文件，是一大串颜色数据，告诉解析程序图像中每个像素应该是什么颜色，而精灵是网格的
  2D 等效物，通常只是一个单一的 _四边形_（quad，由两个三角形组合而成的矩形网格），平面渲染在当前相机上。还有称为 Sprite Sheets 的东西，它们是包含在较大纹理文件中的大量单独图像的集合，通常用于包含
  2D 角色的动画。这些文件可以通过工具（例如 Unity 的 Sprite Atlas 工具）拆分，以形成角色动画帧的单独纹理。


  网格和精灵都使用纹理将图像渲染到其表面。纹理图像文件通常在 Adobe Photoshop 或 Gimp 等工具中生成，然后以与音频文件非常相似的方式导入我们的项目。在运行时，这些文件被加载到内存中，推送到
  GPU 的 VRAM，并在给定的 Draw Call 中由 Shader 在目标精灵或网格上进行渲染。


  # 纹理压缩格式


  与音频文件类似，Unity 将使用默认设置列表导入纹理文件，这些设置倾向于保持简单并在一般情况下工作正常，但有许多可用的导入设置，允许我们通过一些自定义调整来提高纹理的质量和性能。当然，如果我们在不完全理解内部运行的内部过程的情况下盲目进行更改，那么更改同样可能会降低质量和性能。


  第一个选项是文件的 **Texture Type**。此设置将确定可用的其他选项，特别是在 **Advanced** 下拉菜单下。并非所有导入选项都适用于所有类型，因此最好根据纹理的预期用途配置此选项，无论它是设置为
  **Normal Map**、**Sprite**、**Lightmap** 等等，因为这将揭示适用于该类型的选项：


  ![](img/da79484c9b30dc915216dbc5454a9bbf_154_0.png)


  与音频文件类似，我们可以以多种常见格式（例如 .jpg 和 .png）导入纹理文件，但构建到应用程序中的实际压缩格式可能是多种不同的纹理压缩格式之一，这些格式非常适合给定平台的
  GPU。这些格式代表了组织纹理颜色信息的不同方式；这包括用于表示每个通道的位数不同（使用的位数越多，可以表示的颜色越多）、每通道的位数不同（例如，红色通道可能比绿色通道使用更多位）、所有通道使用的总位数不同（位数自然意味着更大的纹理和更多的磁盘和内存消耗）、是否包含
  alpha 通道，以及也许最重要的是，将数据打包在一起的不同方式，这可以允许 GPU 进行高效的内存访问（或者如果选择了错误的打包类型，则会进行极其低效的访问！）。


  更改压缩的简单方法是使用 **Compression** 纹理导入选项从以下选项中选择一个：


  - None

  - Low Quality

  - Normal Quality

  - High Quality


  选择 **None** 表示不会应用压缩。在这种情况下，最终纹理仍然会从我们导入的文件类型更改格式，但它将选择不尝试压缩的格式，因此我们应该以大纹理文件为代价，看到很少或没有质量损失。其他三个设置将选择一个压缩格式，同样，这将取决于平台，Unity
  将尝试选择与选项匹配的压缩格式。例如，选择 **Low Quality** 将意味着 Unity 选择一个大大减小纹理大小但会生成一些压缩伪影的压缩格式，而选择
  **High Quality** 将消耗更多内存，具有更大的纹理大小和极少的伪影。同样，这是 Unity 自动做出的选择。


  Unity 为每个平台为每个这些 **Compression** 设置选择的确切格式可以在 https://docs.unity3d.com/Manual/class-TextureImporterOverride.html
  上找到。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_155_0.png)


  # 纹理性能增强


  让我们探讨我们可以对纹理文件做的一些更改，这些更改可能有助于提高性能，具体取决于情况以及我们导入的文件的内容。在每种情况下，我们将探讨需要做出的更改及其整体效果，无论这对内存或
  CPU 产生积极还是消极的影响，纹理质量是提高还是降低，以及在什么条件下我们可以期望使用这些技术。


  # 减小纹理文件大小


  给定纹理文件越大，推送纹理时消耗的 GPU 内存带宽就越多。如果每秒推送的总内存超过显卡的总内存带宽，那么我们将遇到瓶颈，因为 GPU 必须等待所有纹理上传完毕，下一个渲染通道才能开始。较小的纹理自然比较大的纹理更容易通过管道推送，因此我们需要在高质量和性能之间找到一个良好的平衡点。


  Unity 为每个平台选择的确切压缩格式可以被覆盖，尽管可用选项因平台而异，因为几乎每个平台都有自己最适合它的自定义格式。如果我们单击 **Default**
  选项卡旁边的平台特定选项卡之一（就在 **Max Size** 选项上方），我们将暴露特定平台的设置，并可以选择希望 Unity 使用的确切压缩格式。


  还有 **Crunch Compression** 设置，它将在 DXT 压缩格式之上应用额外的有损压缩级别。只有当其他压缩设置导致了 DXT 级别的压缩时，才会显示此选项。此设置可以节省更多空间，但代价是可能出现明显的压缩伪影，具体取决于
  **Compressor Quality** 设置。


  纹理的几个导入设置相当平凡，例如确定文件是否包含 alpha 通道、如何在纹理边缘处包裹纹理、过滤方法以及文件的最大可能分辨率（一个全局限制，以防止我们在某些平台上意外将纹理放大超过其原始大小）。然而，这些导入设置中还有几个其他有趣的选项，我们将在适当的其他部分中介绍。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_156_0.png)


  一个简单的测试，以了解我们是否在内存带宽上遇到瓶颈，是减少游戏中最丰富和最大的纹理文件的分辨率并重新启动场景。如果帧率突然提高，那么该应用程序很可能受纹理吞吐量限制。如果帧率没有提高或提高很少，那么要么我们仍然有可用的内存带宽，要么渲染管道的其他地方存在瓶颈，阻止我们看到任何进一步的改进。


  # 明智地使用 Mip Maps


  如果玩家永远无法看到那些细节，那么用高细节纹理渲染小的远处物体（如岩石和树木）就没有意义了。当然，他们可能会看到一些轻微的改进，但性能成本可能不值得微小的细节增加。Mip
  Maps 的发明是为了解决这个问题（同时也帮助消除当时困扰视频游戏的混叠问题），方法是预先生成同一纹理的低分辨率替代品，并将它们保存在同一内存空间中。在运行时，GPU
  根据表面在透视视图中出现的大小（本质上基于对象渲染时的纹素到像素比率）选择适当的 Mip Map 级别。


  通过启用 **Generate Mip Maps** 设置，Unity 会自动处理这些较低分辨率纹理副本的生成。这些替代品是在编辑器中使用高质量重采样和过滤方法生成的，而不是在运行时生成。Mip
  Map 生成还有几个其他可用选项，它们会影响生成级别的质量，因此可能需要一些调整才能获得高质量的 Mip Map 集。我们需要决定花费时间调整这些值是否值得，因为
  Mip Maps 的整个目的是故意降低质量以节省性能。


  下图显示了一个 1024 x 1024 的图像被 Mip Map 成多个较低分辨率的副本：






  这些图像将被打包在一起以节省空间，本质上会创建一个最终纹理文件，其大小大约比原始图像大 33%。这将占用一些磁盘空间和 GPU 内存带宽来上传。


  可以通过将 **场景** 窗口的 **绘制模式** 设置为 **Mipmaps**，来观察应用程序在某些点上使用哪些 Mip Map 级别。如果纹理大小超过了玩家当前视角所需的大小（额外细节被浪费），则会以红色高亮显示；而如果纹理太小（玩家观察到低质量纹理，纹理素子与像素比率差），则会以蓝色高亮显示。


  请记住，只有当我们有需要从相机不同距离渲染的纹理时，Mip Mapping 才有用。如果我们有始终在与主相机相同距离处渲染的纹理，以至于从不使用 Mip Mapped
  替代方案，那么启用 Mip Maps 只是浪费空间。同样，如果我们有一个始终解析为相同 Mip Map 级别的纹理，因为玩家的相机永远不会太近或太远以切换级别，那么简单地降低原始纹理的分辨率会更明智。


  这的良好示例包括任何用于 2D 游戏的纹理文件、UI 系统使用的纹理，或用于天空盒或远处背景的纹理，因为从设计上讲，这些纹理始终与相机保持大约相同的距离，因此
  Mip Mapping 基本上是多余的。其他良好示例包括仅出现在玩家附近的对象，例如以玩家为中心的粒子效果、角色、仅出现在玩家附近的对象，以及仅玩家可以拿取/携带的对象。


  ## 在外部管理分辨率缩减


  Unity 致力于让事物尽可能易于使用，并允许我们将外部工具的项目文件放入项目工作区，例如 .PSD 和 .TIFF 文件，这些文件通常很大且分为多个分层图像。Unity
  会自动从文件内容生成纹理文件供引擎其余部分使用，这非常方便，因为我们只需通过源代码控制维护文件的单个副本，当艺术家进行更改时，Unity 副本会自动更新。


  问题是，Unity 的自动纹理生成和压缩技术从这些文件中引入的混叠可能不如我们使用的纹理编辑工具生成的效果好。Unity 功能非常丰富，首先和最重要的是专注于成为游戏开发平台，这意味着它可能难以与其他全职从事该领域的软件开发者竞争。Unity
  可能会因为为我们缩减图像而引入混叠伪影，因此我们可能会发现自己通过导入比必要分辨率更高的图像文件来规避它，以保持预期的质量水平。但是，如果我们先通过外部应用程序缩减图像，可能会遭受更少的混叠。在这些情况下，我们可以使用较低分辨率达到可接受的质量水平，同时消耗更少的总体磁盘和内存空间。


  我们可以养成习惯避免在 Unity 项目中使用 .PSD 和 .TIFF 文件（将它们存储在其他地方，并将缩减后的版本导入 Unity），或者只是进行一些偶尔的测试，以确保我们没有使用比必要更大分辨率的文件而浪费文件大小、内存和
  GPU 内存带宽。这会给我们的项目文件管理带来一些不便，但如果我们愿意花时间比较不同的缩减版本，可以为某些纹理带来显著的节省。


  ## 调整各向异性过滴级别


  各向异性过滴是一项功能，可改善纹理在非常倾斜（浅）角度下查看时的图像质量。以下截图显示了在道路上应用和未应用各向异性过滴的绘制线条的经典示例：


  无论哪种情况，靠近相机的绘制线条看起来都相当清晰，但随着线条远离相机，情况会发生变化。没有各向异性过滴时，远处的绘制线条会变得越来越模糊和扭曲，而应用各向异性过滴后，这些线条依然清晰锐利。


  应用于纹理的各向异性过滴的强度可以通过 **各向异性级别** 设置按纹理手动修改，也可以使用 **编辑 | 项目 | 质量** 设置中的各向异性纹理选项全局启用/禁用。


  与 Mip Mapping 类似，这种效果有时可能代价高昂且不必要。如果我们场景中有确定永远不会以倾斜角度查看的纹理（例如远处背景对象、UI 元素和广告牌粒子效果纹理），则可以安全地为它们禁用各向异性过滴以节省运行时开销。我们还可以考虑按纹理调整各向异性过滴效果的强度，以找到质量和性能之间的最佳平衡点。


  ## 考虑图集


  图集是将许多较小的孤立纹理组合成一个大纹理文件的技术，以尽量减少我们需要使用的材质数量，从而减少绘制调用数量。这实际上是一种利用动态批处理的方法。从概念上讲，这种技术与你在
  `第 3 章` _批处理的优势_ 中学习的尽量减少材质使用的方法非常相似。


  每个唯一材质都需要额外的绘制调用，但每个材质只支持一个主纹理。当然，它们也可以支持多个次级纹理，例如法线贴图和自发光贴图。但是，通过将多个主纹理组合成一个大纹理文件，我们可以尽量减少渲染共享该纹理的对象所使用的绘制调用：


  需要额外的工作来修改网格或精灵对象使用的 UV 坐标，以仅采样较大纹理文件中它需要的部分，但好处很明显；减少绘制调用会导致 CPU 工作量减少，如果我们的应用程序在
  CPU 上存在瓶颈，则会提高帧率。假设合并后的纹理文件分辨率等于所有合并图像的分辨率，则不会有质量损失，内存消耗也基本相同。请注意，图集不会导致内存带宽消耗减少，因为推送到
  GPU 的数据量也相同。它只是被捆绑在一个更大的纹理文件中。


  > 只有当所有给定纹理都需要相同的着色器时，图集才是一个选项。如果某些纹理需要通过着色器应用独特的图形效果，则必须将它们隔离到各自的材质中，并分别进行图集处理。


  图集是应用于 UI 元素和具有大量 2D 图形的游戏的常见策略。在使用 Unity 开发移动游戏时，图集几乎是必不可少的，因为绘制调用往往是这些平台上最常见的瓶颈。但是，我们不希望手动生成这些图集文件。如果我们能继续单独编辑纹理并自动化将它们组合成更大文件的任务，生活会简单得多。


  Unity 资产商店中许多 GUI 相关工具提供自动纹理图集功能。互联网上散布着一些独立程序，可以处理这项工作，Unity 还可以以资产形式为精灵生成图集。这些可以通过
  **资产 | 创建 | 精灵图集** 创建。


  查看 Unity 文档以了解更多关于此有用功能的信息，网址为 https://docs.unity3d.com/Manual/SpriteAtlas.html。


  请注意，精灵图集功能实际上取代了旧版 Unity 中的精灵打包工具。


  图集也不一定只应用于 2D 图形和 UI 元素。如果我们正在创建大量低分辨率纹理，也可以将此技术应用于 3D 网格。具有简单纹理分辨率或平面着色低多边形艺术风格的
  3D 游戏，是以这种方式进行图集处理的理想候选者。


  但是，由于动态批处理仅影响非动画网格（即 MeshRenderer，但不包括 SkinnedMeshRenderer），因此没有理由将动画角色的纹理文件合并到图集中。由于它们是动画的，GPU
  需要将每个对象的骨骼乘以当前动画状态的变换。这意味着每个角色都需要独特的计算，无论我们如何尝试让它们共享材质，都会导致额外的绘制调用。


  因此，仅出于便利和节省空间的目的，才应将动画角色的纹理合并；例如，在平面着色低多边形艺术风格游戏中，如果一切都碰巧使用共享调色板，我们可以为整个游戏世界、对象和角色使用单个纹理来节省一些空间。


  图集的缺点主要在于开发时间和工作流成本。对现有项目进行大规模改造以使用图集需要付出大量努力，仅仅为了弄清楚是否值得付出努力就可能是一项大工作。此外，我们需要注意生成对目标平台来说太大的纹理文件。






  某些设备（特别是移动设备）对可加载到 GPU 最低级内存缓存中的纹理大小有相对较低的限制。如果 Atlased 纹理文件过大，则必须将其拆分为较小的纹理，以便适应目标内存空间。如果设备的
  GPU 在每隔几个 Draw Call 时恰好需要来自 Atlas 不同部分的纹理，那么我们不仅会造成大量缓存未命中，还可能发现我们阻塞了内存带宽，因为纹理不断从
  VRAM 和较低级别缓存中拉取。


  如果 Atlas 保持为单独的纹理，我们可能就不会遇到这个问题。同样的纹理交换会发生，但代价是增加额外的 Draw Calls，从而交换的文件要小得多。在这个阶段，我们的最佳选择是降低
  Atlas 分辨率或生成多个较小的 Atlases，以便更好地控制它们如何动态批处理。


  Atlasing 显然不是一个完美的解决方案，如果不确定它是否会带来性能收益，那么我们应该小心不要在其实现上浪费太多时间。非常概括地说，具有非常简约 2D 美术风格的移动游戏可能不需要使用
  Atlasing。然而，试图通过高质量资产竞争或使用任何类型的 3D 图形的移动游戏，可能应该从开发初期就开始集成 Atlasing，因为项目很可能会很快达到纹理吞吐量限制。它们甚至可能需要应用许多针对平台和设备的优化，以便覆盖广泛的受众。


  同时，我们应该只在 Draw Call 数量超过合理硬件预期时才考虑将 Atlasing 应用于高质量桌面游戏，因为我们希望许多纹理保持高分辨率以获得最大质量。低质量桌面游戏可能可以避免
  Atlasing，因为 Draw Calls 不太可能是最大的瓶颈。


  当然，无论产品是什么，如果我们因过多的 Draw Calls 而受到 CPU 限制，并且已经耗尽了许多替代技术，那么在大多数情况下 Atlasing 是一种非常有效的性能增强手段。


  # 调整非方形纹理的压缩率


  纹理文件通常以方形、二的幂次方格式存储，这意味着它们的高度和宽度相等，且大小为二的幂次方。例如，典型的尺寸有 256 x 256 像素、512 x 512、1024
  x 1024 等等。


  可以提供矩形二的幂次方纹理（例如 256 x 512）或非二的幂次方格式的纹理（例如 192 x 192），但不建议创建此类纹理。某些 GPU 要求方形纹理格式，因此
  Unity 会通过自动扩展纹理来添加额外的空白空间，以符合 GPU 期望的外形规格，这会导致额外的内存带宽开销，将本质上未使用且无用的数据推送到 GPU。其他
  GPU 可能支持非二的幂次方纹理，但这可能会导致比方形纹理更慢的采样。


  因此，第一条建议是完全避免非方形和/或非二的幂次方纹理。如果图像可以放置在方形、二的幂次方纹理中，并且不会因挤压/拉伸而导致过多的质量下降，那么我们应该应用这些更改，以让
  CPU 和 GPU 保持满意。作为第二种选择，我们可以通过纹理文件的 `Non Power of 2` 导入设置在 Unity 中自定义此缩放行为，但由于这是一个自动化过程，可能无法给我们带来预期的图形质量。


  # 稀疏纹理


  稀疏纹理，也称为 **Mega-Textures** 或 **Tiled-Textures**，提供了一种在运行时从磁盘有效流式传输纹理数据的方法。相对而言，如果
  CPU 以秒为单位执行操作，那么磁盘的操作则以天为单位。因此，通常的建议是，在游戏过程中应尽可能避免硬盘访问，因为任何此类技术都有可能导致超过可用的磁盘访问量，从而导致我们的应用程序卡死。


  然而，如果我们聪明地在需要纹理部分之前启动数据传输，稀疏纹理提供了一些有趣的性能节省技术。稀疏纹理是通过将许多纹理合并为一个巨大的纹理文件来准备的，该文件太大，无法作为单个纹理文件加载到图形内存中。这与
  Atlasing 的概念类似，只是包含纹理的文件非常大——例如 32,768 x 32,768 像素——并且将包含相当多的颜色细节，例如每像素 32 位（这将导致一个占用
  4 GB 磁盘空间的纹理文件）。其理念是通过手动选择纹理的小子部分从磁盘动态加载，在需要它们之前片刻从磁盘中拉取，从而节省大量运行时内存和内存带宽。这种技术的主要成本是文件大小要求和潜在的持续磁盘访问。这种技术的其他成本可以克服，但通常需要大量的场景准备工作。


  游戏世界需要以一种方式创建，以最大限度地减少发生的纹理交换量。为了避免非常明显的 *纹理弹出* 问题，纹理子部分必须在有足够的时间余量的情况下从磁盘拉取到 RAM
  中，这样 GPU 就不需要等待传输到 VRAM 开始（就像它通常不需要等待预加载到 RAM 中的普通纹理文件一样）。这发生在纹理文件本身的设计中，即将给定场景的常见元素保留在纹理的同一大致区域，以及场景的设计中，即在游戏过程中关键时刻触发新纹理子部分加载，并确保磁盘能够快速定位新瓦片而不会出现极端的缓存未命中。如果小心处理，稀疏纹理可以在场景质量和内存节省方面都带来令人印象深刻的好处。


  这是游戏行业中一种高度专业化的技术，尚未被广泛采用，部分原因是它需要专用硬件和平台支持，部分原因是它很难做好。Unity 关于稀疏纹理的文档随着时间的推移有所改进，并提供了一个示例场景来展示效果，可以在
  `http://docs.unity3d.com/Manual/SparseTextures.html` 处找到。


  对于认为自己足够高级、可以尝试稀疏纹理的 Unity 开发者来说，花些时间进行一些研究以检查稀疏纹理是否适合他们的项目可能是值得的，因为它承诺带来一些显著的性能节省。


  # 程序化材质


  程序化材质，也称为 **Substances**，是一种在运行时通过将小的高质量纹理样本与自定义数学公式相结合来程序化生成纹理的方法。程序化材质的目标是在初始化期间通过数学操作而非静态颜色数据生成纹理，以牺牲额外的运行时内存和
  CPU 处理为代价，最大限度地减少应用程序的磁盘占用。


  纹理文件有时是游戏项目中最大的磁盘空间消耗者，而且众所周知，下载时间对完成下载率和让人们尝试我们的游戏（即使是免费的）有着巨大的负面影响。程序化材质为我们提供了牺牲一些初始化和运行时处理能力以换取更快下载速度的能力。这对于试图通过图形保真度竞争的移动游戏非常重要。


  # 异步纹理上传


  我们尚未介绍的最后一个纹理导入选项是 **Read/Write Enabled** 选项。默认情况下，此选项处于禁用状态，这是好事，因为这允许纹理使用异步纹理上传功能，该功能有两个好处：纹理将从磁盘异步上传到
  RAM，并且当 GPU 需要纹理数据时，传输发生在渲染线程上，而不是主线程。纹理将被推入一个循环缓冲区，只要缓冲区包含新数据，它就会持续将数据推送到 GPU。否则，它会提前退出进程并等待直到请求新的纹理数据。


  最终，这减少了为每个帧准备渲染状态所花费的时间，并允许更多 CPU 资源用于游戏逻辑、物理引擎等等。当然，主线程上仍然花费一些时间来准备渲染状态，但将纹理上传任务移至单独的线程，在主线程上节省了大量
  CPU 时间。


  然而，启用纹理的读写访问本质上告诉 Unity 我们可能随时读取和编辑此纹理。这意味着 GPU 每次都需要对其进行新的访问，因此它会禁用该纹理的异步纹理上传；所有上传都必须在主线程上发生。我们可能希望为诸如在画布上模拟绘制颜色或将互联网上的图像数据写入预制纹理等内容启用此选项，但缺点是
  GPU 必须始终等待对纹理所做的任何更改完成后才能上传，因为它无法预测这些更改何时发生。


  此外，异步纹理上传仅适用于我们明确导入到项目中并在构建时存在的纹理，因为该功能仅在纹理被打包到特殊可流式传输资产中时才起作用。因此，任何通过 `LoadImage(byte[])`
  生成的纹理、从外部位置导入/下载的纹理资产，或通过 `Resources.Load()` 从 `Resources` 文件夹加载的纹理（这些都隐式调用了 `LoadImage(byte[])`）都不会被转换为可流式传输内容，因此无法使用异步纹理上传。


  Unity 关于程序化材质的文档相当详尽，因此建议阅读文档以更清楚地了解 Substances 的工作原理以及它们如何为我们提供性能优势。查看以下 Unity
  文档页面以获取有关程序化材质的更多信息：`http://docs.unity3d.com/Manual/ProceduralMaterials.html`。






  可以调整用于异步纹理上传的最大允许时间上限，以及 Unity 用于推送要上传纹理的总循环缓冲区大小。这些设置可以在 Edit | Project Settings
  | Quality | Other 下进行调整，分别名为 Async Upload Time Slice 和 Async Upload Buffer Size。我们应将
  Async Upload Time Slice 值设置为希望 Unity 在渲染线程上花费在异步纹理上传上的最大毫秒数。将 Async Upload Buffer
  Size 值设置为可能需要使用的最大纹理文件大小，再加上一点额外缓冲（如果同一帧中需要多个新纹理），可能是明智的。纹理数据被复制到其中的循环缓冲区会根据需要扩展，但这通常代价高昂。由于我们很可能预先知道该循环缓冲区需要多大，不妨将其设置为预期的最大大小，以避免在需要调整缓冲区大小时出现潜在的帧率下降。


  # 网格和动画文件


  最后，让我们介绍网格和动画文件。这些文件类型本质上是顶点和蒙皮骨骼数据的大型数组，我们可以应用各种技术来最小化文件大小，同时保持相似（如果不是相同的话）的外观。还有通过批处理技术降低渲染大量此类对象成本的方法。让我们看看可以应用于此类文件的一系列性能增强技术。


  # 减少多边形数量


  这是获得性能的最明显方法，并且应始终考虑。事实上，由于我们无法对使用 Skinned Mesh Renderers 的对象进行批处理，这是减少动画对象 CPU
  和 GPU 运行时开销的好方法之一。


  减少多边形数量简单、直接，并且为艺术家清理网格所需的时间提供了 CPU 和内存成本节省。在今天，物体的大部分细节几乎完全由详细的纹理和复杂的着色提供，因此我们通常可以去除现代网格上的大量顶点，而大多数用户无法分辨出区别。


  # 调整网格压缩


  Unity 为导入的网格文件提供四种不同的 **网格压缩** 设置：**关闭**、**低**、**中** 和 **高**。提高此设置将把浮点数据转换为固定值，降低顶点位置/法线方向的精度，简化顶点颜色信息，等等。这对包含许多彼此靠近的小部件的网格（例如栅栏或格栅）可能有明显影响。如果我们以程序方式生成网格，可以通过调用
  `MeshRenderer` 组件的 `Optimize()` 方法来实现相同类型的压缩（当然，这需要一些时间才能完成）。


  还有在 **Edit | Project Settings | Player | Other Settings** 中找到的两个全局设置，可以影响网格数据的导入方式。这些设置名为
  **顶点压缩** 和 **优化网格数据**。


  我们可以使用 **顶点压缩** 选项来配置在启用 **网格压缩** 导入网格文件时将被优化的数据类型，因此如果我们想要准确的法线数据（用于光照），但对位置数据不太担心，则可以在此处配置。不幸的是，这是一个全局设置，会影响所有导入的网格（虽然由于它是
  **Player** 设置，可以按平台配置）。


  启用 **优化网格数据** 将剥离网格中未被分配给它的材质所需的任何数据。因此，如果网格包含切线信息，但着色器从不需要它，则 Unity 在构建时将忽略它。


  在每种情况下，好处是以额外的加载网格时间为代价减少应用程序的磁盘占用，因为在需要数据之前必须花费额外时间来解压缩数据。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_168_0.png)


  3D 网格构建/动画工具通常提供自己的自动网格优化内置方式，形式为估计整体形状并将网格剥离到更少的总多边形数。这可能导致显著的质量损失，如果使用，应进行严格测试。


  # 适当使用读写启用


  **读写启用** 标志允许通过脚本或在运行时由 Unity 自动对网格进行更改，类似于它用于纹理文件的方式。在内部，这意味着它将在内存中保留原始网格数据，直到我们想要复制它并动态进行更改。禁用此选项将允许
  Unity 在确定要使用的最终网格后从内存中丢弃原始网格数据，因为它知道它永远不会更改。


  # 考虑烘焙动画


  此提示将需要通过我们正在使用的 3D 绑定和动画工具对资产进行更改，因为 Unity 本身不提供此类工具。动画通常作为关键帧信息存储，它跟踪特定的网格位置并在运行时使用蒙皮数据（骨骼形状、分配、动画曲线等）在它们之间进行插值。同时，烘焙动画意味着有效地采样并将每帧每个顶点的每个位置硬编码到网格/动画文件中，而不需要插值和蒙皮数据。


  使用烘焙动画有时可以比混合/蒙皮动画产生更小的文件大小和内存开销，因为蒙皮数据可能占用惊人的存储空间。这最可能发生在相对简单的对象或具有短动画的对象上，因为我们实际上是用硬编码的顶点位置系列替换过程数据。因此，如果网格的多边形数量足够低，以至于存储大量顶点信息比蒙皮数据更便宜，那么我们可能会通过这一简单更改看到一些显著的节省。


  如果我们在整个游戏中只使用网格的统一缩放版本，那么禁用此选项将节省运行时内存，因为我们不再需要原始网格数据来制作网格的进一步重新缩放副本（顺便说一句，这就是 Unity
  在动态批处理方面按缩放因子组织对象的方式）。因此，Unity 可以提前丢弃这些不需要的数据，因为我们在下次启动应用程序之前都不再需要它。


  但是，如果网格在运行时经常以不同的比例重新出现，那么 Unity 需要将此数据保留在内存中，以便它可以更快地重新计算新网格，因此启用 **读写启用** 标志可能是明智的。禁用它将要求
  Unity 不仅在每次重新引入网格时重新加载网格数据，而且同时制作重新缩放的副本，从而导致潜在的性能卡顿。


  Unity 尝试在初始化时检测此设置的正确行为，但当网格在运行时以动态方式实例化和缩放时，我们必须通过启用此设置来强制执行。这将提高对象的实例化速度，但会带来一些内存开销，因为原始网格数据会一直保留直到需要它。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_169_0.png)


  > 请注意，使用 **生成碰撞器** 选项时，这种潜在的开销成本也适用。


  此外，烘焙样本采样的频率通常可以由导出应用程序自定义。应测试不同的采样率，以找到一个良好的值，使动画的关键时刻仍能在本质上是简化估计的情况下闪耀出来。


  # 合并网格


  强制将网格合并为一个大的单一网格可以方便地减少绘制调用，特别是如果网格太大而不适合动态批处理，并且与其他静态批处理组不兼容。这本质上相当于静态批处理，但是手动执行，因此有时如果静态批处理可以为我们处理这个过程，则是徒劳的努力。


  请注意，如果网格的任何单个顶点在场景中可见，则整个对象将作为一个整体一起渲染。如果网格大部分时间只部分可见，这可能会导致大量浪费的处理。这种技术还带来了生成一个我们必须存入场景的全新网格资产文件的缺点，这意味着我们对原始网格所做的任何更改都不会反映在合并的网格中。每次需要更改时，这都会导致大量繁琐的工作流程努力，因此如果静态批处理是一个选项，则应改用它。


  网上有几种可用的工具，可以为我们在 Unity 中合并网格文件。它们只需在资产商店或 Google 搜索即可找到。


  # 资源包和资源


  我们在第 2 章“脚本策略”中涉及了资源和序列化的主题，并且应该相当清楚，资源系统在原型制作阶段以及项目早期阶段可以带来很大好处，并且可以在范围有限的游戏中相对有效地使用。


  但是，专业的 Unity 项目应该倾向于使用资源包系统。有许多原因。首先，资源系统在构建方面不太可扩展。所有资源都合并到一个巨大的序列化文件二进制数据 blob
  中，并带有一个索引列表，指示各种资产可以在其中找到的位置。随着我们向列表中添加更多数据，这可能难以管理，并且构建时间会很长。






  其次，资源系统从序列化文件获取数据的能力以 Nlog(N) 方式扩展，这应该让我们非常谨慎地增加 N 的值。第三，资源系统使得我们的应用程序难以按设备提供不同的资源数据，而资源包则倾向于使这件事变得简单。最后，资源包可以用于向应用程序提供小型、定期的自定义内容更新，而资源系统则需要完全替换整个应用程序的更新才能达到同样的效果。


  资源包与资源共享许多常见功能，例如从文件加载、异步加载数据以及卸载不再需要的数据。但是，它们还提供更多功能，例如内容流式传输、内容更新以及内容生成和共享。这些都可以用于大幅提升我们应用程序的性能。我们可以交付磁盘占用量更小的应用程序，并让用户在游戏前或游戏过程中下载额外内容，在运行时流式传输资源以最小化应用程序的初始加载时间，并按平台向应用程序提供更优化的资源，而无需向用户推送完整的应用程序覆盖更新。


  当然，资源包也有缺点。它们比资源更难设置和维护，由于使用了比资源系统更复杂的系统来访问资源数据，因此更难理解，并且充分利用其功能（例如流式传输和内容更新）需要大量额外的
  QA 测试，以确保服务器正确交付内容，并且游戏正在读取和更新其内容以匹配。因此，资源包最好仅在我们的团队规模能够支持其所需的额外工作量时才使用。


  关于资源包系统的教程超出了本书的范围，但在线和 Unity 文档中有数十个有用的指南。


  查看以下 Unity 教程以了解有关资源包系统的更多信息：


  https://unity3d.com/learn/tutorials/topics/best-practices/guide-assetbundles-and-resources.


  如果你需要进一步的说服，那么 2017 年 4 月的以下 Unity 博客文章应该有助于揭示资源包系统如何在运行时更高效地使用内存，而资源系统无法通过内存池提供这种方式：https://blogs.unity3d.com/2017/04/12/asset-bundles-vs-resources-a-memory-showdown/.


  # 摘要


  我们可以通过调整导入的资源来探索许多不同的机会，以实现应用程序的性能提升。或者，从另一个角度来看，有很多方法会通过资源管理不善来破坏我们应用程序的性能。几乎每一个导入配置机会都是一个性能指标或工作流任务与另一个之间的权衡。通常，这意味着通过压缩节省磁盘占用，但以运行时解压数据的
  CPU 为代价，或者在降低最终呈现质量级别的同时实现更快的访问。因此，我们必须保持警惕，只为正确的资源出于正确的原因选择正确的技术。


  这结束了我们通过艺术资源操作来提高性能的探索。在下一章中，我们将调查如何改善我们对 Unity 物理引擎的使用。

  '
- "# 5 更快的物理\n\n我们迄今探索的每一条性能增强建议主要都集中在降低资源成本和避免帧率问题上。但是，在最基本的层面上，追求峰值性能意味着改善用户体验。这是因为每一个帧率卡顿、每一个崩溃以及每一个对于给定市场来说成本过高的系统要求最终都会损害产品的质量。物理引擎属于独特的子系统类别，其行为和一致性对产品质量起着重要作用，花时间改善其行为通常是值得的。\n\
  \n如果重要的碰撞事件被遗漏，游戏在计算复杂物理事件时会冻结，或者玩家掉进地板里，那么这些都会对游戏玩法的质量产生明显且显著的负面影响。少数故障通常是可以忍受的，但持续的问题会妨碍游戏进行。这往往会让玩家脱离体验，而用户是觉得不便、恼火还是好笑则是未知数。除非我们的游戏专门针对喜剧物理类型（例如\
  \ QWOP 或 山羊模拟器之类的游戏），否则这些是我们应该努力避免的情况。\n\n有些游戏可能根本不使用物理，而其他游戏则需要物理引擎在游戏过程中处理大量任务，例如数百个对象之间的碰撞检测、用于启动过场动画的触发体积、用于玩家攻击和\
  \ UI 行为的射线投射、收集给定区域内的对象列表，或者仅仅是将物理作为视觉装饰，让大量物理粒子四处飞舞。其重要性也取决于正在创建的游戏类型。例如，在平台游戏和动作游戏中，正确调整物理至关重要——玩家角色对输入的反应以及世界对玩家角色的反应是使游戏感觉灵敏且有趣的两个最重要的方面。而在大型多人在线（MMO）游戏中，精确的物理可能稍微不那么重要，这类游戏往往具有有限的物理交互。\n\
  \n因此，在本章中，我们将介绍通过 Unity 的物理引擎减少 CPU 峰值、开销和内存消耗的方法，但也将包括改变物理行为的方法，旨在优化性能的同时改善或至少保持游戏质量。在本章中，我们将涵盖以下领域：\n\
  \n- 了解 Unity 的物理引擎的工作原理：\n  - 时间步长和 FixedUpdate\n  - 碰撞体类型\n  - 碰撞\n  - 射线投射\n \
  \ - 刚体活动状态\n- 物理性能优化：\n  - 如何构建场景以实现最佳物理行为\n  - 使用最合适的碰撞体类型\n  - 优化碰撞矩阵\n  - 改善物理一致性并避免容易出错的行为\n\
  \  - 布娃娃和其他基于关节的对象\n\n# 物理引擎内部\n\nUnity 从技术上讲具有两个不同的物理引擎：用于 3D 物理的 Nvidia PhysX\
  \ 和用于 2D 物理的开源项目 Box2D。但是，它们的实现高度抽象，从我们通过主 Unity 引擎配置的高级 Unity API 角度来看，两个物理引擎解决方案的运作方式在功能上是相同的。\n\
  \n无论哪种情况，我们对 Unity 的物理引擎了解得越多，就越能理解可能的性能增强。因此，首先我们将介绍一些关于 Unity 如何实现这些系统的理论。\n\n\
  # 物理与时间\n\n物理引擎通常假设时间以固定值推进，Unity 的两个物理引擎都以这种方式运行。每次迭代都称为时间步长。物理引擎将仅使用非常特定的时间值来解决每个时间步长，这与渲染前一帧花费的时间无关。在\
  \ Unity 中，这称为固定更新时间步长，默认设置为 20 毫秒（每秒 50 次更新）。\n\n如果物理引擎使用可变时间步长，由于架构差异（浮点值的表示方式）以及客户端之间的延迟，在两台不同的计算机上为碰撞和力生成一致的结果可能非常困难。此类物理引擎往往会在多客户端之间或在录制的重放过程中产生非常不一致的结果。\n\
  \n以下图表显示了 Unity 执行顺序图表的重要片段：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_175_0.png)\n\
  \n\n\n\n\n完整的执行顺序图可以在 http://docs.unity3d.com/Manual/ExecutionOrder.html 找到。\n\n\
  如上图所示，Fixed Update 在物理引擎执行其自身更新之前处理，两者密不可分。该过程始于确定是否已过去足够的时间以开始下一个 Fixed Update。一旦确定，解决它的结果将因自上次\
  \ Fixed Update 以来过去了多少时间而异。\n\n如果过去了足够的时间，则 Fixed Update 进程将调用场景中所有活动 MonoBehaviours\
  \ 上定义的所有 `FixedUpdate()` 回调，随后是任何与 Fixed Update 绑定的协程（具体指那些 `yield` 给 `WaitForFixedUpdate`\
  \ 的协程）。请注意，在这两个过程中调用的方法没有执行顺序保证，因此我们绝不应基于此假设编写代码。完成这些任务后，物理引擎可以开始处理当前时间步并调用任何必要的\
  \ Trigger 和 Collider 回调。\n\n相反，如果自上次 Fixed Update 以来过去的时间太少（即少于 20 毫秒），则当前 Fixed\
  \ Update 将被跳过，先前列出的所有任务在当前迭代中都不会发生。此时，输入、游戏逻辑和渲染将被允许正常进行。完成这些活动后，Unity 检查是否需要下一个\
  \ Fixed Update。\n\n在高帧率下，渲染更新可能会在物理引擎有机会更新自身之前完成多次。此过程在运行时重复，实际上使 Fixed Update 和物理引擎优先于渲染，同时也将物理模拟强制固定帧率。\n\
  \n为了确保对象在 Fixed Update 之间平滑移动，物理引擎（包括 Unity 的）会根据距下一个 Fixed Update 还剩多少时间，将每个对象的可见位置在上一个状态和解决当前状态后应处的位置之间进行插值。这种插值确保对象看起来移动平滑，尽管它们的物理位置、速度等更新频率低于渲染帧率。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_176_0.png)\n\n`FixedUpdate()` 回调是定义我们希望与帧率无关的任何游戏行为的有用位置。AI\
  \ 计算通常在 Fixed Update 中解决，因为如果我们假设固定更新频率，它们往往更容易处理。\n\n# 最大允许时间步\n\n需要注意的是，如果自上次\
  \ Fixed Update 以来过去了大量时间（例如，游戏短暂冻结），则 Fixed Update 将继续在同一个 Fixed Update 循环中计算，直到物理引擎\
  \ *赶上* 当前时间。例如，如果上一帧花费了 100 毫秒来渲染（例如，突然的 CPU 峰值导致主线程长时间阻塞），则物理引擎需要更新五次。因此，`FixedUpdate()`\
  \ 方法将在 `Update()` 再次被调用之前被调用五次，这是由于默认的 Fixed Update 时间步为 20 毫秒。当然，如果在这五个 Fixed Update\
  \ 中有大量物理活动需要处理，以至于解决它们全部花费超过 20 毫秒，则物理引擎需要调用第六次更新。\n\n因此，在物理活动密集的时刻，物理引擎处理一个 Fixed\
  \ Update 所花费的时间可能超过它模拟的时间量。例如，如果处理模拟 20 毫秒游戏玩法的 Fixed Update 花费了 30 毫秒，那么它就落后了，需要处理更多时间步来尝试跟上，但这可能导致它落后得更远，需要处理更多时间步，以此类推。在这些情况下，物理引擎永远无法逃离\
  \ Fixed Update 循环并允许另一帧渲染。这个问题通常被称为 **死亡螺旋**。然而，为了防止物理引擎在这些时刻锁定我们的游戏，物理引擎每个 Fixed\
  \ Update 循环允许处理的时间量有一个最大值。这个阈值称为 **最大允许时间步**，如果当前批次的 Fixed Update 处理时间太长，它将简单地停止并放弃进一步处理，直到下一个渲染更新完成。这种设计允许渲染管道至少渲染当前状态，并在物理引擎失控（双关语）的罕见时刻允许用户输入和游戏逻辑做出一些决策。\n\
  \n此设置可通过 **Edit | Project Settings | Time | Maximum Allowed Timestep** 访问。\n\n#\
  \ 物理更新和运行时更改\n\n当物理引擎处理给定时间步时，它必须移动任何活动 Rigidbody 对象（带有 Rigidbody 组件的 GameObject），检测任何新碰撞，并对相应对象调用碰撞回调。Unity\
  \ 文档明确指出，出于这个原因，对 Rigidbody 对象的更改应在 FixedUpdate() 和其他物理回调中处理。这些方法与物理引擎的更新频率紧密耦合，而不是与游戏循环的其他部分（例如\
  \ Update()）耦合。\n\n这意味着 FixedUpdate() 和 OnTriggerEnter() 等回调是进行 Rigidbody 更改的安全位置，而\
  \ Update() 和在 WaitForSeconds 或 WaitForEndOfFrame 上 yield 的协程等方法则不是。忽略此建议可能导致意外的物理行为，因为在物理引擎有机会捕获并处理所有更改之前，可能会对同一对象进行多次更改。\n\
  \n在 Update() 回调中对对象施加力或冲动而不考虑这些调用的频率尤其危险。例如，当玩家按住键时每次 Update 施加 10 牛顿的力，会导致两个不同设备之间的最终速度完全不同，而如果我们在\
  \ Fixed Update 中做同样的事情则不会，因为我们无法依赖 Update() 调用次数的一致性。但是，在 FixedUpdate() 回调中这样做会一致得多。因此，我们必须确保所有与物理相关的行为都在适当的回调中处理，否则我们将冒引入一些特别令人困惑且非常难以复现的游戏错误的风险。\n\
  \n逻辑上，我们在任何给定的 Fixed Update 迭代中花费的时间越多，用于下一个游戏玩法和渲染通道的时间就越少。大多数情况下，这会导致次要的、不易察觉的后台处理任务，因为物理引擎几乎没有工作要做，而\
  \ FixedUpdate() 回调有大量时间完成工作。但是，在某些游戏中，物理引擎可能在每个 Fixed Update 中执行大量计算。这种物理处理时间的瓶颈会影响我们的帧率，导致随着物理引擎承担越来越大的工作负载，帧率急剧下降。本质上，渲染管道会尝试正常进行，但每当到了需要进行\
  \ Fixed Update 且物理引擎处理时间较长时，渲染管道在帧到期前生成当前显示的时间就很少，导致突然卡顿。这还加上物理引擎因为达到了最大允许时间步而提前停止的视觉效果。所有这些加在一起会产生非常糟糕的用户体验。\n\
  \n因此，为了保持平滑且一致的帧率，我们需要尽可能为渲染腾出时间，通过尽量减少物理引擎处理任何给定时间步所花费的时间。这既适用于最佳情况（没有任何移动），也适用于最坏情况（所有东西同时相互碰撞）。我们可以在物理引擎中调整许多与时间相关的功能和值，以避免此类性能陷阱。\n\
  \n# 静态碰撞器和动态碰撞器\n\nUnity 中 _static_ 和 _dynamic_ 这两个术语存在相当极端的命名空间冲突。当使用 _static_\
  \ 时，它通常意味着讨论中的对象或进程不移动、保持不变或只存在于一个位置，而 _dynamic_ 简单地意味着相反——倾向于移动或变化的对象或进程。但是，重要的是要记住，这些是各自独立的主题，_static_\
  \ 和 _dynamic_ 这两个术语在每种情况下的含义都不同。我们已经介绍了 `GameObjects` 的 **Static** 子标志、动态批处理和静态批处理系统，以及\
  \ C# 语言中静态类、`static` 变量和 `static` 函数的概念。所以，为了更加令人困惑，Unity 也有静态碰撞器和动态碰撞器的概念。\n\n\
  动态碰撞器简单地指同时包含 `Collider` 组件（可能是几种类型之一）和 `Rigidbody` 组件的 `GameObjects`。通过将 Rigidbody\
  \ 附加到与 Collider 相同的对象上，物理引擎将该 Collider 视为物理对象的边界体积，该物理对象必须对外部力（如重力）和与其他 Rigidbody\
  \ 的碰撞做出反应。如果我们让一个动态碰撞器与另一个动态碰撞器碰撞，它们都将根据牛顿运动定律做出反应（或者至少是计算机使用浮点运算所能做到的最好程度）。\n\n\
  我们也可以有不附加 `Rigidbody` 组件的 Collider，这些被称为静态碰撞器。它们实际上充当动态碰撞器可以碰撞的不可见屏障，但静态碰撞器本身不会做出反应。换个角度来看，想象没有\
  \ `Rigidbody` 组件的对象具有无限质量。无论你多么用力地将一块石头扔向无限质量的对象，它都不会移动，但你仍然可以期望石头像撞上坚固的墙壁一样做出反应。这使得静态碰撞器非常适合世界边界和其他不得移动的障碍物。\n\
  \n\n\n\n\n# 碰撞检测\n\nUnity 中有三种碰撞检测设置，可以在 `RigidBody` 组件的 **碰撞检测** 属性中配置：**离散**、**连续**\
  \ 和 **连续动态**。**离散** 设置启用离散碰撞检测，它会根据对象的速度和经过的时间，在每个时间步长内将对象“瞬移”一小段距离。所有对象移动完成后，它会执行包围体积检查以查找任何重叠，将其视为碰撞，并根据其物理属性和重叠方式进行解决。如果小对象移动速度过快，此方法可能会错过碰撞。\n\
  \n下图展示了离散碰撞检测如何捕捉两个对象在不同位置之间“瞬移”的过程：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_180_0.png)\n\
  \n其余两种设置中的任何一种都会启用连续碰撞检测，其原理是根据 Collider 在当前时间步长内的起始位置和结束位置进行插值，并检查路径上的任何碰撞。与离散碰撞检测相比，这降低了错过碰撞的风险，并能生成更准确的模拟，但代价是\
  \ CPU 开销显著增加。\n\n**连续** 设置仅在给定 Collider 与静态 Collider 之间启用连续碰撞检测。同一 Collider 与动态\
  \ Collider 之间的碰撞仍将使用离散碰撞检测。与此同时，**连续动态** 设置在 Collider 与所有静态和动态 Collider 之间启用连续碰撞检测，因此在资源消耗方面是最昂贵的。\n\
  \n下图展示了离散和连续碰撞检测方法在一对小型快速移动对象上的工作原理：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_181_0.png)\n\
  \n这是一个仅用于说明的极端示例。在离散碰撞检测的情况下，我们可以观察到对象在单个时间步长内“瞬移”的距离大约是其自身大小的四倍，这通常只发生在速度极高的非常小的对象身上，因此如果我们的游戏运行良好，这种情况非常罕见。在绝大多数情况下，对象在单个\
  \ 20 毫秒时间步长内移动的距离相对于对象的大小要小得多，因此离散碰撞检测方法可以轻松捕捉到碰撞。\n\n# Collider 类型\n\nUnity 中有四种不同的\
  \ 3D Collider 类型。按性能开销从低到高排序，它们分别是球体、胶囊体、盒体和网格 Collider。前三种 Collider 类型通常称为 _原始体_，并保持非常特定的形状，尽管它们通常可以在不同方向上缩放以满足特定需求。然而，网格\
  \ Collider 可以根据分配的网格自定义为特定形状。还有三种 2D Collider 类型——圆形、盒体和多边形——它们在功能上分别与球体、盒体和网格 Collider\
  \ 相似。以下所有信息基本上都可以转移到等效的 2D 形状。\n\n请注意，我们也可以在 Unity 中生成圆柱形 3D 对象，但这仅用于其图形表示。自动生成的圆柱体形状使用胶囊体\
  \ Collider 来表示其物理包围体积，这可能无法产生预期的物理行为。\n\n此外，网格 Collider 有两种变体：**凸形** 和 **凹形**。区别在于，凹形至少有一个内角（形状两个内边之间的角）大于\
  \ 180 度。为了说明这一点，下图展示了凸形和凹形之间的区别：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_182_0.png)\n\
  \n记住凸形和凹形区别的简单方法是：凹形内部至少有一个 _凹陷_。\n\n两种网格 Collider 类型使用相同的组件（一个 `MeshCollider` 组件）。生成的网格\
  \ Collider 类型通过 **凸形** 复选框切换。启用此选项将允许对象与所有原始形状（球体、盒体等）以及启用了 **凸形** 的其他网格 Collider\
  \ 发生碰撞。此外，如果为具有凹形的网格 Collider 启用了 **凸形** 复选框，则物理引擎将自动简化它，生成一个尽可能接近凸形的 Collider。在前面的示例中，如果我们导入右侧的凹形网格并启用\
  \ **凸形** 复选框，它将生成一个更接近左侧凸形的 Collider 形状。在任何情况下，物理引擎都会尝试生成一个与附加网格形状匹配的 Collider，顶点上限为\
  \ 255 个。如果目标网格的顶点数超过此限制，则在网格生成期间会抛出错误。\n\nCollider 组件还包含 `IsTrigger` 属性，允许它们被视为非物理对象，但当其他\
  \ Collider 进入或离开它们时仍会调用物理事件。这些称为触发体积。通常，当另一个 Collider 触碰、保持触碰（每个时间步长）或停止触碰 Collider\
  \ 时，分别会调用 Collider 的 `OnCollisionEnter()`、`OnCollisionStay()` 和 `OnCollisionExit()`\
  \ 回调。但是，当 Collider 用作触发体积时，将改用 `OnTriggerEnter()`、`OnTriggerStay()` 和 `OnTriggerExit()`\
  \ 回调。\n\n请注意，由于解决对象间碰撞的复杂性，凹形网格 Collider 不能也是动态 Collider。凹形只能用作静态 Collider 或触发体积。如果我们尝试向凹形网格\
  \ Collider 添加 `Rigidbody` 组件，Unity 将简单地忽略它。\n\n# 碰撞矩阵\n\n物理引擎具有一个碰撞矩阵，用于定义哪些对象允许与哪些其他对象发生碰撞。不符合此矩阵的对象，在解决包围体积重叠和碰撞时会被物理引擎自动忽略。这在碰撞检测阶段节省了物理处理开销，并允许对象相互穿过而不发生任何碰撞。\n\
  \n碰撞矩阵可通过 **编辑 | 项目设置 | (物理 / 物理 2D) | 层碰撞矩阵** 访问。\n\n碰撞矩阵系统通过 Unity 的层系统工作。矩阵表示每一种可能的层对层组合，启用复选框意味着在碰撞检测阶段将检查这两个层中的\
  \ Collider。请注意，无法仅允许两个对象中的一个响应碰撞。如果一个层可以与另一个层碰撞，则两者都必须响应碰撞。但是，静态 Collider 是例外，因为它们不允许对碰撞做出物理响应（尽管它们仍会接收\
  \ `OnCollision...()` 回调）。\n\n请注意，我们整个项目总共仅限于 32 个层（因为物理引擎使用 32 位掩码来确定层间碰撞机会），因此我们必须将对象组织成合理的层，这些层将贯穿整个项目生命周期。如果出于任何原因，32\
  \ 个层不足以满足我们的项目需求，那么我们可能需要找到巧妙的方法来重用层或移除不必要的层。\n\n# Rigidbody 活动和休眠状态\n\n每个现代物理引擎都共享一种常见的优化技术，即处于静止状态的对象会将其内部状态从活动状态更改为休眠状态。当\
  \ Rigidbody 处于休眠状态时，在固定更新期间几乎不会花费处理器时间来更新对象，直到它被外部力或碰撞事件唤醒。\n\n用于确定什么是 _静止_ 的测量值在不同物理引擎中往往有所不同；它可以使用线速度和旋转速度、动能、动量或\
  \ Rigidbody 的其他一些物理属性来计算。Unity 的两个物理引擎都通过评估对象的 _质量归一化动能_ 来工作，这基本上归结为 _其速度平方的大小_。\n\
  \n如果对象的速度在短时间内未超过某个阈值，物理引擎将假设该对象在发生新碰撞或施加新力之前不再需要移动。在此之前，休眠对象将保持其当前位置。将阈值设置得太低会导致对象不太可能进入休眠，因此即使对象没有做任何重要事情，我们也会在每个固定更新中为物理引擎支付少量处理开销。与此同时，将阈值设置得太高会导致移动缓慢的对象在物理引擎决定它们需要进入休眠时，看起来会突然停顿。控制休眠状态的阈值可以在\
  \ **编辑 | 项目设置 | 物理 | 休眠阈值** 下修改。我们还可以从 **分析器** 窗口的 **物理区域** 获取活动 Rigidbody 对象的总数。\n\
  \n请注意，休眠对象并未完全从模拟中移除。如果移动的 Rigidbody 接近休眠对象，则它仍必须执行检查以查看附近的对象是否与其发生了碰撞，这将重新唤醒休眠对象，并将其重新引入模拟进行处理。\n\
  \n# 射线和对象投射\n\n物理引擎的另一个常见功能是能够从一个点向另一个点 _投射射线_，并生成与其路径中一个或多个对象的碰撞信息。这称为 **射线投射**。通过射线投射实现多种游戏机制非常常见，例如开枪射击。这通常通过从玩家到目标位置执行射线投射，并找到其路径中任何可行的目标（即使只是一堵墙）来实现。\n\
  \n\n\n\n\n我们还可以使用 `Physics.OverlapSphere()` 检查来获取空间中固定点周围有限距离内的目标列表。这通常用于实现范围伤害类游戏功能，例如手榴弹或火球爆炸。我们甚至可以使用\
  \ `Physics.SphereCast()` 和 `Physics.CapsuleCast()` 将整个对象向空间中投射。这些方法常用于模拟宽激光束，或者当我们只想查看移动角色路径上会有什么时使用。\n\
  \n# 调试物理\n\n物理错误通常分为两类：对象对在不应该碰撞/应该碰撞时发生了碰撞/未发生碰撞，或者对象发生了碰撞但随后发生了意外情况。前一种情况通常更容易调试；它往往是由于碰撞矩阵错误、射线检测中使用了错误的图层，或者对象碰撞体大小或形状不正确引起的。后一种情况通常要难得多，因为存在三个大问题：\n\
  \n- 确定是哪些发生碰撞的对象导致了问题\n- 确定解决碰撞前的碰撞条件\n- 复现碰撞\n\n这三条信息中的任何一条都会让解决问题变得容易得多，但在某些情况下，它们都可能很难获得。\n\
  \n性能分析器在 **Physics** 和 **Physics (2D) 区域**（分别用于 3D 和 2D 物理）中提供了一些信息，这可能 moderately\
  \ 有用。我们可以了解所有刚体和不同类型的刚体组（如动态碰撞体、静态碰撞体、运动学对象、触发体积、约束（用于模拟铰链和其他连接的物理对象）以及接触点）所花费的\
  \ CPU 活动量。**Physics 2D 区域**包含更多信息，例如休眠和活动刚体的数量以及处理时间步长所花费的时间。**详细分解视图**在两种情况下都提供了更多信息。这些信息有助于我们关注物理性能，但当我们发现物理行为出现错误时，它不能告诉我们太多哪里出了问题。\n\
  \n更适合帮助我们调试物理问题的工具是 **物理调试器**，可以通过 **Window | Physics Debugger** 打开。此工具可以帮助我们从 **场景**\
  \ 窗口中过滤掉不同类型的碰撞体，以便更好地了解哪些对象发生了碰撞。当然，这对于确定问题条件和复现问题帮助不大。\n\n> 请注意，物理调试器中的设置不会影响\
  \ **游戏** 窗口中对象的可见性。\n\n不幸的是，对于剩余的问题，没有太多秘诀可分享。在碰撞发生前或发生时捕获信息通常涉及在 `OnCollisionEnter()`\
  \ 或 `OnTriggerEnter()` 回调中设置大量有针对性的断点，以捕捉问题发生的瞬间，并使用逐步调试直到问题源头清晰。作为最后手段，我们可以添加 `Debug.Log()`\
  \ 语句，在问题发生前记录重要信息，但这可能是一项令人沮丧的练习，因为我们有时不知道需要记录什么信息，或者从哪些对象记录，因此最终会在所有地方添加日志。\n\n\
  另一个常见的头痛来源是尝试复现物理问题。复现碰撞始终是一项挑战，因为用户输入（通常在 `Update()` 中处理）与物理行为（在 `FixedUpdate()`\
  \ 中处理）之间存在不确定性。尽管物理时间步长相对规律地发生，但每次会话之间每个 `Update()` 的模拟时序都会不同，因此即使我们记录了用户输入时序并自动重放场景，尝试在输入应用的时刻应用记录的输入也不会每次都完全相同，因此我们可能无法得到完全相同的结果。\n\
  \n将用户输入处理移动到 `FixedUpdate()` 是可能的，并且有帮助，如果用户输入控制刚体行为，例如在玩家按住某些键时向不同方向施加力。然而，这往往会导致输入延迟或\
  \ _滞后_，因为物理引擎响应按键可能需要 0 到 20 毫秒（基于固定更新频率）。瞬时输入，例如跳跃或激活技能，最好始终在 `Update()` 中处理，以避免漏掉按键。像\
  \ `Input.GetKeyDown()` 这样的辅助函数仅在玩家按下给定键的那一帧返回 `true`，并在下一个 `Update()` 期间返回 `false`。如果我们尝试在\
  \ `FixedUpdate()` 中读取 _按键按下_ 事件，除非物理时间步长恰好在这两帧之间发生，否则我们永远不会知道用户按下了键。这可以通过输入缓冲/跟踪系统来解决，但如果我们只是为了复现物理错误而实现它，这肯定是得不偿失。\n\
  \n最终，经验和坚持是调试大多数物理问题的唯一好方法。我们对物理引擎的经验越多，找到问题源头的直觉就越强，但不幸的是，由于可复现性有限且行为有时模糊不清，它们几乎总是需要花费大量时间来解决，因此我们应该预期物理问题比大多数逻辑错误花费更长时间来解决，并在解决前预留额外时间。\n\
  \n# 物理性能优化\n\n现在我们对 Unity 物理引擎的大多数功能有了了解，可以介绍几种优化技术来改善游戏的物理性能。\n\n## 场景设置\n\n首先，我们可以在场景中应许多最佳实践来提高物理模拟的一致性。请注意，其中几种技术不一定会改善\
  \ CPU 或内存使用，但它们会降低物理引擎出现不稳定的可能性。\n\n## 缩放\n\n我们应尽可能将世界中所有物理对象的缩放保持在 `(1,1,1)` 附近。默认情况下，Unity\
  \ 假设我们模拟的游戏相当于在地球表面。地球表面的重力加速度为 9.81 米每秒平方，因此默认重力值设置为 `-9.81` 以匹配。Unity 世界空间中的 1\
  \ 个单位相当于 1 米，负号表示它会将对象向下拉。我们的对象大小应反映有效的世界缩放，因为将它们缩放得太大会导致重力看起来移动对象的速度比我们预期的慢得多。如果所有对象都缩放了五倍，那么重力看起来会弱五倍。反之亦然；将对象缩放得太小会使它们看起来下落太快，不够真实。\n\
  \n我们可以通过修改 **Edit | Project Settings | Physics / Physics 2D | Gravity** 下的重力强度来调整世界的隐含缩放。但是，请注意，浮点数运算在值接近\
  \ 0 时会更准确，因此如果我们有一些对象的缩放值远高于 `(1, 1, 1)`，即使它们与隐含的世界缩放匹配，我们仍然可能观察到不稳定的物理行为。因此，在项目早期，我们应将最常见的物理对象导入并缩放到\
  \ `(1, 1, 1)` 左右，然后调整重力值以匹配。这将为我们在引入新对象时提供一个参考点。\n\n## 定位\n\n同样，将所有对象保持在世界空间位置 `(0,\
  \ 0, 0)` 附近将提高浮点精度，改善模拟的一致性。太空模拟器和跑酷游戏试图模拟 incredibly 大的空间，通常使用一种技巧，要么悄悄将玩家传送回世界中心，要么将位置固定在那里，在这种情况下，要么空间被分割成体积，使物理计算始终使用接近\
  \ 0 的值，要么移动其他一切来模拟旅行，而玩家的运动只是一种幻觉。\n\n大多数游戏不会面临浮点不准确性的风险，因为大多数游戏关卡持续约 10 到 30 分钟，这不给玩家太多时间去旅行\
  \ absurdly 长的距离，但如果我们正在处理 exceptionally 大的场景，或者在整个游戏过程中异步加载场景，以至于玩家旅行了数万米，那么我们可能会开始注意到随着他们旅行得更远而出现一些奇怪的物理行为。\n\
  \n因此，除非我们已经深入项目，以至于在后期阶段更改和重新测试一切太麻烦，否则我们应尽量将所有物理对象保持在 `(0, 0, 0)` 附近。此外，这对我们的项目工作流程是很好的实践，因为它使在游戏世界中查找对象和调整事物变得更快。\n\
  \n## 质量\n\n质量存储为 `Rigidbody` 组件的 `mass` 属性下的浮点值，由于物理引擎的更新，其用法文档多年来发生了相当大的变化。在 Unity\
  \ 的近期版本（Unity 5 后期和 Unity 2017 早期），我们基本上可以自由选择 `1.0` 代表什么，然后相应地缩放其他值。\n\n\n\n\n\n\
  传统上，质量值为 `1.0` 用于表示 1 千克的质量，但我们可以决定一个人类的质量为 `1.0`（约 130 千克），在这种情况下，一辆汽车将被赋予质量值 `10.0`（约\
  \ 1,300 千克），物理碰撞的解决方式将与我们预期的类似。最重要的是质量的相对差异，这使得这些对象之间的碰撞看起来可信，而不会对引擎造成太大压力。浮点精度也是一个问题，因此我们不想使用过于荒谬的大质量值。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_189_0.png)\n\n请注意，如果我们打算使用 Wheel Colliders，其设计假设质量为\
  \ `1.0` 代表 1 千克，因此我们应该适当分配质量值。\n\n理想情况下，我们应将质量值维持在 `1.0` 左右，并确保最大相对质量比约为 `100`。如果两个对象的碰撞质量比远大于此，则巨大的动量差异可能会从冲量转变为突然的巨大速度变化，导致物理不稳定和潜在的浮点精度丢失。具有显著尺寸差异的对象对可能应使用碰撞矩阵进行剔除以避免问题（稍后详述）。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_189_1.png)\n\n不当的质量比是 Unity 中物理不稳定和异常行为的最常见原因。这在使用\
  \ Joints 处理 Ragdolls 等对象时尤其如此。\n\n请注意，地球中心的重力对所有物体的影响相同，无论其质量如何，因此无论我们将质量属性值 `1.0`\
  \ 视为橡胶球的质量还是军舰的质量都无关紧要。无需调整重力来补偿。然而，重要的是给定物体在下落时所受到的空气阻力量（这就是为什么降落伞下落缓慢）。因此，为了保持现实的行为，我们可能需要为这些对象自定义\
  \ `drag` 属性，或按对象自定义重力。例如，我们可以禁用 **Use Gravity** 复选框，并在 Fixed Update 期间应用我们自己的自定义重力。\n\
  \n# 适当使用静态碰撞体\n\n如前所述，物理引擎会自动生成两个独立的数据结构，将静态碰撞体与动态碰撞体分开存储。不幸的是，如果在运行时将新对象引入静态碰撞体数据结构，则必须重新生成，类似于为静态批处理调用\
  \ `StaticBatchingUtility.Combine()`。这可能会导致显著的 CPU 峰值。因此，在游戏过程中避免实例化新的静态碰撞体至关重要。\n\
  \n此外，仅仅移动、旋转或缩放静态碰撞体也会触发此重新生成过程，应予以避免。如果我们有希望移动而不以物理方式响应与其他对象碰撞的碰撞体，则应附加 Rigidbody\
  \ 使其成为动态碰撞体并启用 **Kinematic** 标志。该标志防止对象响应来自对象间碰撞的外部冲量，类似于静态碰撞体，不同之处在于该对象仍可通过其 `Transform`\
  \ 组件或施加到其 `Rigidbody` 组件的力进行移动（最好在 Fixed Update 期间）。由于运动学对象不会响应其他对象撞击它，它在移动时往往会简单地将其他动态碰撞体推开。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_190_0.png)\n\n正因如此，玩家角色对象通常被制作成运动学碰撞体。\n\
  \n# 负责任地使用触发体积\n\n如前所述，我们可以将物理对象视为普通碰撞体或触发体积。这两种类型之间的一个重要区别在于，`OnCollider...()`\
  \ 回调将 `Collision` 对象作为参数提供给回调，该对象包含有用信息，例如碰撞的确切位置（有助于定位粒子效果）和接触法线（如果我们想在碰撞后手动移动对象，则很有用）。而\
  \ `OnTrigger...()` 回调不提供此类信息。\n\n因此，我们不应尝试使用触发体积来实现碰撞反应行为，因为我们没有足够的信息来使碰撞看起来准确。触发体积最适合用于其预定目的，即跟踪对象进入/退出特定区域，例如在玩家待在岩浆坑中时处理伤害，在玩家进入建筑物时触发过场动画，以及在玩家靠近或远离另一个主要区域时启动场景的异步加载/卸载。\n\
  \n如果触发体积碰撞绝对需要联系信息，则常见的解决方法是执行以下任何一项：\n\n- 通过将触发体积与碰撞对象的质量中心之间的距离减半来粗略估计接触点（这假设它们大小大致相等）\n\
  - 在碰撞时从触发体积中心向碰撞对象的质量中心执行射线检测（如果两个对象都是球形，效果最佳）\n- 创建一个非触发体积对象，给它一个无穷小的质量（这样碰撞对象几乎不受其存在的影响），并在碰撞时立即销毁它（因为与如此大的质量差异发生碰撞可能会将这个小对象弹入轨道）\n\
  \n当然，这些方法各有缺点；物理精度有限、碰撞期间额外的 CPU 开销和/或额外的场景设置（以及看起来相当 hacky 的碰撞代码），但在紧急情况下可能很有用。\n\
  \n# 优化碰撞矩阵\n\n众所周知，物理引擎的碰撞矩阵定义了分配给某些层的对象允许与分配给其他层的对象碰撞，或者更简洁地说，哪些对象碰撞对被物理引擎视为可行。其他每个对象-层对都会被物理引擎简单地忽略，这使得这成为最小化物理引擎工作量的重要途径，因为它减少了每次\
  \ Fixed Update 必须执行的包围体积检查数量，以及在应用程序生命周期内可能需要处理的碰撞数量（这将节省移动设备的电池寿命）。\n\n> 请注意，碰撞矩阵可以通过\
  \ Edit | Project Settings | Physics（或 Physics2D）| Layer Collision Matrix 访问。\n\n\
  以下截图显示了街机射击游戏的常见碰撞矩阵：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_192_0.png)\n\n\
  在前面的示例中，我们有标记为 **Player**、**Enemies**、**Player Missiles**、**Enemy Missiles** 和 **Powerups**\
  \ 的对象，我们已将物理引擎需要检查的可能对象间碰撞数量最小化。\n\n从标记为 **Player** 的第一行复选框开始，我们希望 **Player** 对象能够与\
  \ **World** 对象碰撞、拾取 **Powerups**、被 **Enemy Missiles** 击中，并与 **Enemies** 碰撞。但是，我们不希望它们与自己的\
  \ **Player Missiles** 或自身碰撞（尽管这一层可能只有一个对象）。因此，**Player** 行中的启用复选框反映了这些要求。我们只希望 **Enemies**\
  \ 与 **World** 对象和 **Player Missiles** 碰撞，因此在 **Enemies** 行中选中这些项。请注意，**Player**-to-**Enemies**\
  \ 碰撞对已由前一行处理；因此无需在 **Enemies** 行中出现。我们还希望 **Player Missiles** 和 **Enemy Missiles**\
  \ 在击中 **World** 对象时爆炸，因此这些项被标记，最后我们不在乎 **Powerups** 与除 **Player** 以外的任何东西碰撞，也不希望\
  \ **World** 对象与其他 **World** 对象碰撞，因此最后两行没有标记任何复选框。\n\n\n\n\n\n在任何给定时刻，我们可能只有一个 **Player**\
  \ 对象，2 个 **Powerups**，7 个 **Player Missiles**，10 个 **Enemies** 和 20 个 **Enemy Missiles**，总共\
  \ 780 个潜在碰撞对（计算方式为：40 个不同的对象每个都可能与另外 39 个对象碰撞，得到 1,560 个潜在碰撞对，然后将总数除以 2 以忽略重复对）。仅通过优化这个矩阵，我们就将其减少到不到\
  \ 100，潜在碰撞检查减少了近 90%。当然，Unity 物理引擎会在对象彼此距离太远时高效地剔除许多对象对，因此它们几乎不可能发生碰撞（这是在名为 **Broadphase\
  \ Culling** 的隐藏过程中计算的），所以实际节省的可能永远达不到这么好，但几乎不费吹灰之力就能释放一些 CPU 周期。另一个巨大好处是简化了游戏逻辑编码；如果我们告诉物理引擎忽略\
  \ **Powerups** 和 **Enemy Missiles** 之间的碰撞，就不需要去弄清楚它们碰撞时应该发生什么。\n\n我们应该对碰撞矩阵中的所有潜在图层组合进行像这样的逻辑合理性检查，以查看是否在浪费宝贵时间去检查不必要的对象对之间的互相碰撞。\n\
  \n# 优先使用离散碰撞检测\n\n离散碰撞检测成本较低，因为在单个时间步内将对象瞬移一次并对附近的对象对执行一次重叠检查，所需的工作量微不足道。而连续碰撞检测所需的计算量要大得多，因为它涉及在对象起始位置和结束位置之间进行插值，同时分析这些点之间在时间步内可能发生的任何轻微包围体积重叠。\n\
  \n因此，**Continuous** 碰撞检测选项的开销比 **Discrete** 检测方法大一个数量级，而 **ContinuousDynamic** 碰撞检测设置的开销又比\
  \ **Continuous** 大一个数量级。在复杂场景中，如果有太多对象配置为使用任一连续碰撞检测类型，会导致严重的性能下降。无论哪种情况，成本都会乘以在任何给定帧中需要比较的对象数量，以及比较的\
  \ Collider 是静态还是动态。\n\n因此，对于绝大多数对象，我们应该优先使用 **Discrete** 碰撞检测设置，而仅在极端情况下才使用任一连续碰撞检测设置。当重要碰撞经常与游戏世界中较静态的部分错过时，应使用\
  \ **Continuous** 设置。例如，如果我们希望确保玩家角色永远不会掉出游戏世界，或者在移动过快时不会意外穿墙，那么可能只想对这些对象应用连续碰撞检测。最后，**ContinuousDynamic**\
  \ 设置仅应在相同情况适用且我们希望捕捉一对非常快速移动的动态 Collider 之间碰撞时使用。\n\n# 修改固定更新频率\n\n在某些情况下，**Discrete**\
  \ 碰撞检测在大规模下可能效果不佳。也许我们的整个游戏围绕大量小型物理对象展开，而离散碰撞检测根本无法捕捉足够的碰撞以维持产品质量。然而，将连续碰撞检测设置应用到所有对象对性能来说将过于高昂。在这种情况下，我们可以尝试一个选项：可以自定义物理时间步长，通过修改引擎检查固定更新的频率，让离散碰撞检测系统更有机会捕捉此类碰撞。\n\
  \n如前所述，固定更新和物理时间步长处理是强耦合的；因此，通过修改固定更新检查的频率，我们不仅改变了物理引擎计算和解析下一个回调的频率，还改变了 `FixedUpdate()`\
  \ 回调和协程被调用的频率。因此，如果我们深入项目且有大量依赖这些回调的行为，更改此值可能有风险，因为我们正在改变关于这些方法调用频率的一个非常重要的假设。\n\
  \n更改固定更新频率可以通过编辑器中的 **Edit | Project Settings | Time | Fixed Timestep** 属性，或通过脚本代码中的\
  \ `Time.fixedDeltaTime` 属性来实现。\n\n降低此值（增加频率）将迫使物理引擎更频繁地处理，从而让离散碰撞检测更有机会捕捉碰撞。当然，这伴随着额外的\
  \ CPU 成本，因为我们正在调用更多的 `FixedUpdate()` 回调，并要求物理引擎更频繁地更新，让它更频繁地移动对象并验证碰撞。\n\n相反，增加此值（降低频率）为\
  \ CPU 在再次处理物理处理之前提供了更多时间来完成其他任务，或者从另一个角度看，给物理引擎更多时间来处理上一个时间步长，然后再开始处理下一个。不幸的是，降低固定更新频率基本上会降低对象在物理引擎无法再使用离散碰撞检测捕捉碰撞之前能够移动的最大速度（取决于对象的大小）。我们也可能开始看到对象以奇怪的方式改变速度，因为它本质上正在成为现实世界物理行为的一个更弱的近似。\n\
  \n因此，每次更改固定时间步长值时，进行大量测试至关重要。即使完全理解此值的工作原理，也很难预测游戏过程中的整体结果会是什么样子，以及结果是否达到质量标准。因此，应在项目生命周期早期对该值进行更改，然后尽量少更改，以便针对尽可能多的物理情况进行足够的测试。\n\
  \n创建一个测试场景，将我们的一些高速对象相互抛出以验证结果是否可接受，并在每次更改固定时间步长时运行此场景可能会有所帮助。但是，实际游戏玩法往往相当复杂，有许多后台任务和未预料到的玩家行为，这些行为会给物理引擎带来额外工作或让它处理当前迭代的时间更少。实际游戏条件无法在真空中复制。此外，没有什么能替代真实情况，所以我们针对固定时间步长的当前值进行的测试越多，就越有信心更改符合可接受的质量标准。\n\
  \n> 来自开发软件自动化工具职业生涯的人的建议：软件测试自动化在许多情况下都有帮助，但当涉及到实时事件和用户输入驱动的应用程序，这些程序与多个硬件设备和复杂子系统（如物理引擎）同步，并且由于反馈迭代而倾向于快速变化时，自动化测试的支持和维护成本往往会变得不值得，使得手动测试成为最明智的方法。\n\
  \n我们始终将连续碰撞检测作为最后手段，以抵消我们观察到的一些不稳定性。不幸的是，即使更改是有针对性的，由于连续碰撞检测的开销成本，这比我们开始时更可能导致进一步的性能问题。在启用连续碰撞检测之前和之后对场景进行性能分析以验证收益是否超过成本将是明智的。\n\
  \n\n\n\n\n# 调整最大允许时间步长\n\n如果我们经常超过最大允许时间步长（提醒一下，它决定了物理引擎在必须提前退出之前解析时间步长所拥有的时间），那么将会导致一些相当奇怪的物理表现。刚体会出现减速或突然停止的情况，因为物理引擎需要在完全解析完整的时间配额之前不断提前退出时间步长计算。在这种情况下，这清楚地表明我们需要从其他角度优化物理表现。不过，至少我们可以确信，阈值将防止游戏在物理处理过程中出现尖峰时完全卡死。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_196_0.png)\n\n提醒：此设置可通过 **Edit | Project\
  \ Settings | Time | Maximum Allowed Timestep** 访问。\n\n默认设置是最多消耗 0.333 秒，如果超过此值，将表现为非常明显的帧率下降（仅\
  \ 3 FPS）。如果你觉得需要更改此设置，那么你显然在物理工作负载方面存在一些大问题，因此建议只有在耗尽所有其他方法后才调整此值。\n\n# 最小化射线投射和包围体检查\n\
  \n所有射线投射方法都非常有用，但它们相对较为昂贵，特别是 `CapsuleCast()` 和 `SphereCast()`。我们应避免在 `Update()`\
  \ 回调或协程中定期调用这些方法，仅在脚本代码中的关键事件时保留它们。\n\n如果我们在场景中使用持久的线、射线或区域效果碰撞区域（例如安全激光、持续燃烧的火焰、光束武器等），且对象保持相对静止，那么或许最好使用简单的触发体积来模拟它们。\n\
  \n如果无法进行此类替换，并且我们确实需要使用这些方法进行持续的投射检查，则应通过利用 LayerMasks 来最小化每次射线投射的处理量。如果我们使用 `Physics.RaycastAll()`，这一点尤其正确。例如，此类射线投射的使用不当情况如下所示：\n\
  \n```csharp\nvoid PerformRaycast() {\n    RaycastHit[] hits;\n    hits = Physics.RaycastAll(transform.position,\
  \ transform.forward, 100.0f);\n    for (int i = 0; i < hits.Length; ++i) {\n   \
  \     RaycastHit hit = hits[i];\n        EnemyComponent e = hit.transform.GetComponent<EnemyComponent>();\n\
  \        if (e.GetType() == EnemyType.Orc) {\n            e.DealDamage(10);\n  \
  \      }\n    }\n}\n```\n\n在前面的示例中，我们正在收集射线路径上每个对象的射线投射碰撞数据，但我们只处理其持有特定 EnemyComponent\
  \ 的对象的效果。因此，我们要求物理引擎完成比必要多得多的工作。\n\n更好的方法是使用 RaycastAll() 的另一个重载，该重载接受 LayerMask\
  \ 值作为参数。这将以类似于碰撞矩阵的方式过滤射线的碰撞，使其仅针对给定图层中的对象进行测试。以下代码通过提供额外的 LayerMask 属性进行了微妙的改进；我们将通过检查器窗口为此组件配置\
  \ LayerMask，它将过滤列表得快得多，并且仅包含与掩码匹配的对象的命中：\n\n```csharp\n[SerializeField] LayerMask\
  \ _layerMask;\nvoid PerformRaycast() {\n    RaycastHit[] hits;\n    hits = Physics.RaycastAll(transform.position,\
  \ transform.forward, 100.0f, _layerMask);\n    for (int i = 0; i < hits.Length;\
  \ ++i) {\n        // as before ...\n    }\n}\n```\n\n此优化对于 `Physics.RaycastHit()`\
  \ 函数的效果不佳，因为该版本仅提供射线与第一个碰撞对象的碰撞信息，无论我们是否使用 `LayerMask`。\n\n请注意，由于 `RaycastHit` 和\
  \ `Ray` 类由 Unity 引擎的原生内存空间管理，它们实际上不会导致引起 **垃圾回收器** 注意的内存分配。我们将在 **第 8 章** _精通内存管理_\
  \ 中了解更多此类活动。\n\n# 避免复杂的网格碰撞体\n\n按碰撞检测效率排序，各种碰撞体依次为球体、胶囊体、盒体、凸网格碰撞体，而凹网格碰撞体则远远是最昂贵的。碰撞始终涉及一对对象，解析碰撞所需的工作量（数学）取决于两个对象的复杂程度。两个基本对象之间的碰撞检测可以归结为一组相对简单的数学方程，这些方程经过高度优化。对一对凸网格碰撞体进行比较是一个更复杂的方程，使其比两个基本对象之间的碰撞昂贵一个数量级。然后，两个凹网格碰撞体之间的碰撞非常复杂，无法归结为简单公式，需要在两个网格的每对三角形之间解析碰撞检查，这使其比其他碰撞体类型之间的碰撞昂贵多个数量级。当我们解析不同组形状之间的碰撞时，所涉及的工作量也会类似地增加。例如，基本对象与凹网格碰撞体之间的碰撞比两个基本对象之间的碰撞慢，但比两个凹网格碰撞体之间的碰撞快。\n\
  \n还有一个问题，即参与碰撞的对象中是否有一个或两个在移动（其中一个对象是静态碰撞体比两个对象都是动态碰撞体更容易处理）。还有场景中有多少此类对象的问题，因为如果我们不小心将多少形状引入模拟，碰撞检测的总处理成本将会迅速增长。\n\
  \n在 3D 应用程序中表示物理和图形之间的一个巨大讽刺是，如何在两者之间处理球体和立方体对象是多么困难。完美的球形网格需要生成无限数量的多边形，使得此类对象在图形上无法表示。\n\
  \n然而，在物理引擎中处理两个球体之间的碰撞可能是解决接触点和碰撞最简单的问题（接触点始终位于任一球体半径的边缘，接触法线始终是它们质心之间的向量）。相反，立方体是图形上最简单的对象之一（只需\
  \ 8 个顶点和 12 个三角形），但却需要大量的数学和处理能力来查找接触点并解析碰撞（解析碰撞的数学取决于碰撞发生在面、边、角之间，还是混合搭配）。轶事地讲，这意味着创建大量对象最有效的方法是用球体碰撞体填充我们的世界，使用立方体对象。然而，这对人类观察者来说完全没有意义，因为他们会看到立方体像球体一样滚动。\n\
  \n前面的轶事提醒我们，对象的物理表示不一定需要与其图形表示匹配。这很有好处，因为图形网格通常可以压缩为更简单的形状，同时仍然产生非常相似的物理行为，并消除使用过于复杂的网格碰撞体的需求。\n\
  \n图形和物理之间的这种表示分离使我们能够优化一个系统的性能，而不一定会对另一个系统产生负面影响。只要游戏玩法没有明显的负面影响（或者我们愿意做出牺牲），我们就可以使用更简单的物理形状来表示复杂的图形对象，而玩家不会察觉。此外，如果玩家从未察觉，那么也就没有造成任何伤害。\n\
  \n因此，我们可以用两种方式之一来解决这个问题：要么使用一个（或多个）标准基本体来近似复杂形状的物理行为，要么使用一个更简单的网格碰撞体。\n\n# 使用更简单的基本体\n\
  \n大多数形状可以使用三种基本碰撞体之一来近似。事实上，我们不需要仅使用一个碰撞体来表示对象。如果它们能满足我们创建复杂碰撞形状的需求，我们可以自由使用多个碰撞体，方法是附加带有自己碰撞体的其他子\
  \ `GameObjects`。这几乎总是比使用单个网格碰撞体更便宜，并且应优先选择。\n\n\n\n\n\n下图展示了由一个或多个更简单的原始 Collider\
  \ 形状表示的几个复杂图形对象：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_200_0.png)\n\n对这些对象中的任何一个使用\
  \ Mesh Collider 将比这里所示的原始 Collider 昂贵得多，因为它们包含的多边形数量较多。值得探索任何和所有机会，尽可能使用这些原始体来简化我们的对象，因为它们可以带来显著的性能提升。\n\
  \n例如，凹面 Mesh Collider 的独特之处在于它们可以带有间隙或孔洞，允许其他网格掉入其中，甚至穿过它们，如果此类 Collider 用于世界碰撞区域，这会引入对象掉出世界的机会。为此目的，通常更好的做法是在战略位置放置\
  \ Box Collider。\n\n# 使用更简单的 Mesh Collider\n\n同样，分配给 Mesh Collider 的网格不一定需要与同一对象的图形表示相匹配（Unity\
  \ 只是将其选为默认值）。这为我们提供了一个机会，可以为 Mesh Collider 的 `mesh` 属性分配一个更简单的网格，该网格与我们用于图形表示的网格不同。\n\
  \n下图展示了一个复杂图形网格的示例，该网格为其 Mesh Collider 提供了一个更简化的网格：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_201_0.png)\n\
  \n以这种方式将渲染网格简化为多边形数量较少的凸形，将大大减少确定与其他 Collider 的包围体积重叠所需的开销。取决于原始对象被估算得有多好，应该几乎没有可察觉的游戏玩法差异，尤其是在这个斧头的例子中，我们预计它在生物攻击时挥动时会快速移动，使得玩家不太可能注意到两个网格作为\
  \ Collider 之间的差异。事实上，简化的网格不太可能被离散碰撞检测遗漏，出于这个原因也是更可取的。\n\n# 避免复杂的物理组件\n\n某些特殊的物理\
  \ Collider 组件，例如 `TerrainCollider`、`Cloth` 和 `WheelCollider`，在某些情况下比所有原始 Collider\
  \ 甚至 Mesh Collider 昂贵几个数量级。除非绝对必要，否则我们根本不应该在场景中包含此类组件。例如，如果我们在远处有玩家永远不会接近的地形对象，那么附加\
  \ `TerrainCollider` 几乎没有理由。\n\n带有 Cloth 组件的游戏应该考虑在低质量设置下运行时实例化不带它们的不同对象，或者简单地对布料行为进行动画制作（尽管如果团队已经对布料的移动方式产生了依恋并喜爱上它，那是完全可以理解的）。\n\
  \n使用 WheelCollider 组件的游戏应该简单地尝试使用更少的 Wheel Collider。拥有超过四个轮子的大型车辆，可能能够仅使用四个轮子来模拟类似的行为，同时对额外轮子的图形表示进行伪造。\n\
  \n# 让物理对象进入睡眠状态\n\n物理引擎的睡眠功能可能会给我们的游戏带来几个问题。首先，一些开发者没有意识到他们的许多 Rigidbody 在应用程序的大部分生命周期中都处于睡眠状态。这往往会导致开发者假设他们可以（例如）将游戏中的\
  \ Rigidbody 数量翻倍，而总成本也会简单地翻倍以匹配它。这不太可能。碰撞的频率和活动对象的总累积时间更有可能以指数方式而非线性方式增加。这导致每次将新物理对象引入模拟时都会出现意外的性能成本。当我们决定增加场景的物理复杂性时，应该牢记这一点。\n\
  \n其次，在运行时更改 Rigidbody 组件上的任何属性，例如 mass、drag 和 useGravity，也会唤醒对象。如果我们经常更改这些值（例如，对象大小和质量随时间变化的游戏），那么它们将比平时保持活动状态更长时间。应用力的情况也是如此，因此如果我们使用自定义重力解决方案（例如在\
  \ Mass 部分中建议的），我们应该尝试避免在每个 Fixed Update 中应用重力，否则对象将无法入睡。我们可以检查其质量归一化动能（只需取 velocity.sqrMagnitude\
  \ 的值），并在检测到其非常低时手动禁用自定义重力。\n\n第三，存在睡眠物理对象岛屿生成的危险。当大量 Rigidbody 相互接触，并且系统的动能降低到足够低时，它们会逐渐进入睡眠状态，从而创建岛屿。然而，由于它们仍然相互接触，一旦这些对象中的任何一个被唤醒，它就会引发连锁反应，唤醒附近所有其他\
  \ Rigidbody。突然，我们会看到 CPU 使用率大幅飙升，因为几十个对象已重新进入模拟。更糟糕的是，由于对象非常接近，会有许多潜在的碰撞对必须不断解决，直到对象再次入睡。\n\
  \n避免这些情况的最佳方法是减少场景的复杂性，但如果我们发现自己无法做到这一点，我们可以寻找检测岛屿形成的方法，然后战略性地销毁/取消生成其中一些，以防止生成太多大型岛屿。然而，在所有\
  \ Rigidbody 之间执行常规距离比较并不是一项廉价的任务，可能会很昂贵。物理引擎本身已经在 Broadphase Culling 期间执行此类检查，但不幸的是，Unity\
  \ 不通过物理引擎 API 暴露此数据。对此问题的任何解决方案将取决于游戏的设计方式；例如，一个要求玩家将大量物理对象移动到某个区域的游戏（例如，涉及将羊群赶入羊圈的游戏）可以选择在玩家将羊移动到位置后立即移除羊的\
  \ Collider，将对象锁定在其最终目的地，减轻物理引擎的工作量，并防止岛屿成为问题。\n\n睡眠对象既是福音也是祸根。它们可以为我们节省大量处理能力，但如果太多对象同时唤醒，或者我们的模拟太忙碌无法让足够多的对象入睡，那么我们在游戏过程中可能会承担一些不幸的性能成本。我们应尽可能通过让对象尽可能多地进入睡眠状态，并避免将它们聚集在大型集群中，来尽可能限制这些情况。\n\
  \n> 请注意，睡眠阈值可以在 **Edit | Project Settings | Physics | Sleep Threshold** 下修改。\n\n\
  # 修改求解器迭代次数\n\n使用 Joints、Springs 以及其他将 Rigidbody 连接在一起的方式在物理引擎中是相当复杂的模拟。由于连接两个对象而产生的代码依赖交互性（内部表示为运动约束），系统通常需要多次尝试求解必要的数学方程。每当对象链中任何单个部分的速度发生变化时，都需要这种多迭代方法来计算准确的结果。\n\
  \n因此，这成为一项平衡行为：限制求解器解决特定情况的最大尝试次数，与我们能够接受的结果准确性之间取得平衡。我们不希望求解器在单个碰撞上花费太多时间，因为物理引擎在同一迭代中还有许多其他任务需要完成。然而，我们也不希望将最大迭代次数降低得太低，因为它只能近似最终解决方案，使其运动看起来不如给予更多时间计算结果时那么可信。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_204_0.png)\n\n同一个求解器在解决对象间碰撞和接触时也会介入。对于简单的碰撞，它几乎总是可以通过单次迭代确定正确结果，Mesh\
  \ Collider 的一些非常罕见和复杂的碰撞情况除外。主要是在通过 Joints 影响附加对象时，求解器才需要额外的努力来集成最终结果。\n\n求解器允许尝试的最大迭代次数称为求解器迭代次数，可以在\
  \ Edit | Project Settings | Physics | Default Solver Iterations 下修改。在大多数情况下，默认的六次迭代是完全可以接受的。然而，包含非常复杂\
  \ Joint 系统的游戏可能希望增加此次数以抑制任何不规则（或直接爆炸性的）CharacterJoint 行为，而某些项目可能能够降低此次数。更改此值后必须进行测试，以检查项目是否仍然保持预期的质量水平。请注意，此值是默认求解器迭代次数——即应用于任何新创建\
  \ Rigidbody 的值。我们可以通过 Physics.defaultSolverIterations 属性在运行时更改此值，但这仍然不会影响预先存在的 Rigidbody。如果有必要，我们可以在构建后通过\
  \ Rigidbody.solverIterations 属性修改它们的求解器迭代次数。\n\n如果我们发现游戏经常出现与基于 Joint 的复杂对象（例如 Ragdoll）相关的刺耳、不规则和物理破坏性情况，那么我们应该考虑逐渐增加求解器迭代次数，直到问题被抑制。这些问题通常发生在我们的\
  \ Ragdoll 从碰撞对象吸收了太多能量，而求解器在被要求放弃之前无法将解决方案迭代到合理的程度时。此时，其中一个 Joint 会发生超新星爆发，将其余的\
  \ Joint 也拖入轨道。Unity 有一个针对此问题的单独设置，可以在 Edit | Project Settings | Physics | Default\
  \ Solver Velocity Iterations 下找到。增加此值将使求解器在基于 Joint 的对象碰撞期间有更多机会计算合理的速度，并帮助避免上述场景。同样，这是一个默认值，因此仅应用于新创建的\
  \ Rigidbody。该值可以通过 Physics.defaultSolverVelocityIterations 属性在运行时修改，并可以通过 Rigidbody.solverVelocityIterations\
  \ 属性在特定 Rigidbody 上自定义。\n\n\n\n\n\n# 优化布娃娃\n\n说到基于关节的对象，布娃娃之所以非常受欢迎是有充分理由的；它们非常有趣！暂且不论在游戏世界中抛来抛去尸体的血腥之处，看着一串复杂的对象四处乱动并撞击东西，总有一种能击中许多心理乐趣按钮的东西。这使得我们很想让许多布娃娃同时存在于我们的场景中，但我们很快就会发现，当太多布娃娃在运动和/或与其他对象碰撞时，由于求解器需要进行大量迭代来解决它们，这将带来巨大的性能损失。因此，让我们探索一些改善布娃娃性能的方法。\n\
  \n## 减少关节和碰撞体\n\nUnity 在 **GameObject | 3D Object | Ragdoll...** 下提供了一个简单的布娃娃生成工具（布娃娃向导）。该工具可以通过为给定的身体部位或肢体选择适当的子\
  \ `GameObjects` 来附加 `Joint` 和 `Collider` 组件，从而从给定对象创建布娃娃。此工具始终会创建 13 个不同的碰撞体及其关联关节（骨盆、胸部、头部、每只手臂两个碰撞体，每条腿三个碰撞体）。\n\
  \n请注意，一个 bug 会导致布娃娃向导在未分配 **左脚** 或 **右脚** `Transform` 组件引用时不报错（就像它对其他部位所做的那样），但如果我们尝试在未分配它们的情况下创建网格，Unity\
  \ 会抛出 `NullReferenceException`。当我们尝试创建布娃娃时，请确保已分配所有 13 个 `Transform` 组件引用。\n\n但是，可以只使用七个碰撞体（骨盆、胸部、头部，以及每条肢体一个碰撞体）来大幅降低开销，代价是牺牲布娃娃的真实感。这可以通过删除不需要的碰撞体，并手动将角色关节的\
  \ `connectedBody` 属性重新分配到正确的父关节来实现（将手臂碰撞体连接到胸部，将腿部碰撞体连接到骨盆）。\n\n请注意，我们在使用布娃娃向导创建布娃娃时会分配一个\
  \ `mass` 值。这个质量值会根据需要分布到各个关节上，因此代表对象的总质量。我们应确保不要将质量值设置得与游戏中其他对象相比过高或过低，以避免潜在的不稳定性。\n\
  \n## 避免布娃娃之间的碰撞\n\n当允许布娃娃与其他布娃娃碰撞时，布娃娃的性能开销会呈指数级增长，因为任何关节碰撞都要求求解器计算施加到与其连接的所有关节上的结果速度，然后再计算与这些关节连接的每个关节的速度，使得两个布娃娃都必须被多次完全解决。此外，如果布娃娃的多个部分在同一次碰撞中很可能相互碰撞，情况会变得复杂得多。\n\
  \n这对求解器来说是一项艰巨的任务，因此我们应该避免这种情况。最好的方法是简单地使用碰撞矩阵。将所有布娃娃分配到它们自己的图层，并在碰撞矩阵中取消勾选相应的复选框，这样给定图层中的对象就不能与同一图层中的对象发生碰撞，这是明智的做法。\n\
  \n## 替换、停用或移除非活动布娃娃\n\n在某些游戏中，一旦布娃娃到达了其最终 _目的地_，我们就不再需要它作为可交互对象留在游戏世界中。当不再需要布娃娃时，我们可以停用、销毁它，或者用更简单的替代品替换它（一个好技巧是用前面建议的只使用七个关节的更简单版本替换它们）。这种简化通常被实现为一种降低较弱硬件/较低质量设置开销的手段，或者作为允许更多布娃娃在我们的场景中共存的一种妥协。如果已经存在特定数量的布娃娃，甚至可以动态使用。\n\
  \n我们需要一个对象来跟踪所有布娃娃，在每次创建布娃娃时收到通知，跟踪当前存在多少个布娃娃，观察每个布娃娃直到它们通过 `RigidBody.IsSleeping()`\
  \ 进入睡眠状态，然后对它们做一些适当的处理。同一个对象也可以选择在场景中已经包含比合理数量更多的布娃娃时实例化更简单的布娃娃变体。这将是另一个利用我们在 _第\
  \ 2 章，脚本策略_ 中探索的消息系统的好机会。\n\n无论我们选择哪种方法来改善布娃娃的性能，无疑都会导致将布娃娃作为游戏玩法功能受到限制，无论是通过实例化更少的布娃娃，赋予它们更少的复杂性，还是赋予它们更短的生命周期，但考虑到性能节省的机会，这些是合理的妥协。\n\
  \n## 了解何时使用物理\n\n改善功能性能最明显的方法是尽可能避免使用它。对于游戏中所有可移动对象，我们应该花点时间问问自己是否真的需要让物理引擎介入。如果不需要，我们应该寻找机会用更简单、成本更低的东西来替换它们。\n\
  \n也许我们正在使用物理来检测玩家是否掉入了死亡区域（水、岩浆、死亡深渊等等），但我们的游戏足够简单，只有在特定高度才有死亡区域。在这种情况下，我们可以完全避免使用物理碰撞体，只需检查玩家的\
  \ y 位置是否低于某个特定值即可。\n\n考虑以下示例——我们正在尝试模拟流星雨，我们的第一直觉是让许多下落的物体通过物理刚体移动，通过碰撞体检测与地面的碰撞，然后在撞击点生成爆炸。然而，也许地面始终是平坦的，或者我们可以访问地形的高度图来进行一些基本的碰撞检测。在这种情况下，可以通过手动对对象的\
  \ `transform.position` 随时间进行补间动画来简化对象的移动，以模拟相同的移动行为而不需要任何物理组件。在这两种情况下，我们都可以通过简化情况并将工作推送到脚本代码中来减少物理开销。\n\
  \n> 补间动画（Tweening）是中间帧生成的常见简称，即随时间逐渐将变量从一个值插值到另一个值的行为。Unity 资产商店上有许多有用（且免费）的补间动画库可用，可以提供大量有用的功能。但是，要小心这些库中可能存在的优化不佳问题。\n\
  \n反过来也是可能的。可能存在这样的情况：我们正在通过脚本代码进行大量计算，而这些计算可以通过物理相对简单地处理。例如，我们可能实现了一个带有许多可拾取物体的物品系统。当玩家按下\
  \ `拾取物体` 键时，这些物体中的每一个可能都会与玩家的位置进行比较，以找出哪个物体最近。\n\n我们可以考虑用单个 `Physics.OverlapSphere()`\
  \ 调用来替换所有脚本代码，在按下键时获取附近的物体，然后从结果中找出最近的拾取物体（或者，更好的做法是，直接自动拾取所有物体。为什么要让玩家反复点击不必要的次数呢？）。这可以大大减少每次按下键时必须比较的对象总数，尽管应该进行比较以确保确实如此。\n\
  \n确保你寻求从场景中移除不必要的物理繁重工作，或者使用物理来替换通过脚本代码执行成本高昂的行为。机会就像你自己的创造力一样广泛而深远。识别这种机会的能力需要经验，但在当前和未来的游戏开发项目中节省性能时，这是一项将对你大有裨益的重要技能。\n\
  \n# 总结\n\n我们已经介绍了许多改善游戏物理模拟的方法，无论是性能还是一致性方面。对于物理引擎等昂贵系统，最好的技术就是简单地避免。我们越不需要使用该系统，就越不需要担心它产生瓶颈。在最坏的情况下，我们可能需要缩小游戏的范围，将物理活动压缩到仅限基本要素，但正如我们所学到的，有很多方法可以降低物理复杂性而不会造成任何明显的游戏性影响。\n\
  \n在下一章中，我们将深入 Unity 的渲染管线，并发现如何通过利用前几章性能优化所释放的所有 CPU 周期，来最大限度地提高我们应用程序的图形保真度。\n\n\
  \n\n\n"
- "# 动态图形\n\n毫无疑问，现代图形设备的渲染管线（Rendering Pipeline）非常复杂。即使只将一个三角形渲染到屏幕上，也需要大量的图形 API\
  \ 调用，涵盖创建与操作系统（通常通过某种窗口系统）挂钩的相机视图缓冲区、为顶点数据分配缓冲区、设置用于将顶点和纹理数据从内存（RAM）传输到显存（VRAM）的数据通道、将每个内存空间配置为使用特定数据格式、确定相机可见的对象、为三角形设置并启动绘制调用（Draw\
  \ Call）、等待渲染管线完成任务，最后将渲染后的图像呈现到屏幕上。然而，这种看似繁琐且过度设计的绘制简单对象的方式，背后有一个简单的原因——渲染通常涉及反复执行相同的任务，而所有这些初始设置使得未来的渲染任务变得非常快速。\n\
  \nCPU 设计用于处理几乎任何计算场景，但无法同时处理太多任务，而 GPU 设计用于处理大量并行任务，但在不破坏并行性的情况下，其可处理的复杂度有限。其并行特性要求大量数据必须非常快速地在各处复制。在设置渲染管线期间，我们为图形数据配置内存数据通道。因此，如果这些通道针对我们将传递的数据类型进行了正确配置，那么它们将更高效地运行。然而，设置不当会产生相反的结果。\n\
  \nCPU 和 GPU 在所有图形渲染过程中都会被使用，这使得它成为一场跨越软件、硬件、多个内存空间、编程语言（各适用于不同的优化）、处理器和处理器类型，以及大量可加入其中的特殊情况功能的高速处理与内存管理之舞。\n\
  \n为了让事情变得更加复杂，我们遇到的每种渲染情况都各不相同。在两个不同的 GPU 上运行同一应用程序，由于它们支持的功能和 API 不同，通常会导致南辕北辙的比较。要确定瓶颈在如此复杂的硬件和软件系统网络中的位置可能很困难，如果我们想要对现代渲染管线中性能问题的来源有强烈的、直接的直觉，可能需要在\
  \ 3D 图形行业工作一辈子。\n\n幸运的是，性能分析（Profiling）再次来拯救我们，这使得成为*渲染管线巫师*（Rendering Pipeline\
  \ wizard）不再是必需。如果我们能收集每个设备的数据，使用多个性能指标进行比较，并调整场景以观察不同渲染功能如何影响其行为，那么我们应该有足够的证据来找到问题的根本原因并做出适当的更改。因此，在本章中，你将学习如何收集正确的数据，深入渲染管线足以找到问题的真正根源，并探索各种潜在问题的解决方案和变通方法。\n\
  \n在提升渲染性能方面，有许多主题需要涵盖。因此，在本章中，我们将探讨以下主题：\n\n- 渲染管线的简要探索，重点介绍 CPU 和 GPU 发挥作用的部分\n\
  - 如何确定渲染是受 CPU 还是 GPU 限制的一般技术\n- 一系列性能优化技术和功能，如下：\n  - GPU 实例化（GPU Instancing）\n\
  \  - 细节层次（Level Of Detail，LOD）和其他剔除组\n  - 遮挡剔除（Occlusion Culling）\n  - 粒子系统（Particle\
  \ Systems）\n  - Unity 用户界面（Unity UI）\n  - 着色器优化（Shader optimization）\n  - 光照和阴影优化（Lighting\
  \ and Shadow optimization）\n  - 移动端特定的渲染增强（Mobile-specific rendering enhancements）\n\
  \n# 渲染管线\n\n渲染性能不佳可能以多种方式表现出来，具体取决于设备是受 CPU 活动（我们是 CPU 受限）还是 GPU 活动（我们是 GPU 受限）的限制。调查\
  \ CPU 受限的应用程序可能相对简单，因为所有 CPU 工作都包含从磁盘/内存加载数据和调用图形 API 指令。然而，GPU 受限的应用程序可能更难以分析，因为根本原因可能源自渲染管线中大量潜在位置的任何一个。我们可能发现需要依赖一些猜测或_排除法_（_process\
  \ of elimination_）来确定 GPU 瓶颈的来源。无论哪种情况，一旦问题被发现并解决，我们就可以期待显著的改进，因为在修复渲染管线问题时，小修复往往能带来巨大的回报。\n\
  \n我们在_第 3 章，批处理的优势_（_chapter 3, The Benefits of Batching_）中简要提及了渲染管线。为了简要总结要点，我们知道\
  \ CPU 通过图形 API 发送渲染指令，这些指令通过硬件驱动程序传输到 GPU 设备，从而导致一系列渲染指令在称为命令缓冲区（Command Buffer）的队列中累积。这些命令由\
  \ GPU 逐个处理，直到命令缓冲区为空。只要 GPU 能在下一帧开始前跟上指令的速度和复杂度，我们就能保持帧率。然而，如果 GPU 落后，或者 CPU 花费太多时间生成命令，帧率就会开始下降。\n\
  \n以下是现代 GPU 上典型渲染管线的极度简化图表（也可能因设备、技术支持和自定义优化而异），展示了发生步骤的广泛视图：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_211_0.png)\n\
  \n第一行代表 CPU 中发生的工作，包括通过硬件驱动程序调用图形 API 以及将命令推送到 GPU 的行为。接下来的两行代表 GPU 中发生的步骤。由于 GPU\
  \ 的复杂性，其内部过程通常分为两个不同的部分——**前端**（**Front End**）和**后端**（**Back End**），这两部分需要稍作解释。\n\
  \n# GPU 前端\n\n前端指的是渲染过程中 GPU 处理顶点数据的部分。它将从 CPU 接收网格数据（大量顶点信息），并发出一个绘制调用（Draw Call）。然后\
  \ GPU 从网格数据中收集所有顶点信息，并将其传递给顶点着色器（Vertex Shaders），顶点着色器有机会对其进行修改并以一对一的方式输出。从此，GPU\
  \ 现在有一个要处理的原始图元（Primitives）列表（三角形——3D 图形中最基本的形状）。接下来，光栅化器（Rasterizer）获取这些原始图元，并根据其顶点的位置和当前相机视图，确定最终图像中哪些像素需要绘制以创建原始图元。此过程生成的像素列表称为**片段**（**fragments**），它们将在后端中处理。\n\
  \n顶点着色器是小型的类 C 程序，用于确定它们感兴趣的输入数据以及操作数据的方式，然后为光栅化器生成片段输出一组信息。它也是细分（Tessellation）过程的所在地，细分由几何着色器（Geometry\
  \ Shaders，有时称为**细分着色器**，**Tessellation Shaders**）处理，类似于顶点着色器，因为它们是上传到 GPU 的小型脚本，不同之处在于它们允许以一对多的方式输出顶点，从而以编程方式生成额外的几何体。\n\
  \n> 术语_着色器_（_Shader_）是一个陈旧的说法，源于这些脚本主要处理光照和着色任务的时代，在其角色扩展到包括当今所用的所有任务之前。\n\n\n\n\
  \n\n# GPU 后端\n\n后端代表了渲染管线中处理片段的部分。每个片段都会经过片段着色器（也称为**像素着色器**）。与顶点着色器相比，这些着色器通常涉及更复杂的活动，例如深度测试、Alpha\
  \ 测试、颜色化、纹理采样、光照、阴影以及各种后期处理效果，仅举几例。然后，这些数据会被绘制到帧缓冲区中，帧缓冲区保存了当前图像，在当前帧的渲染任务完成后，该图像最终会被发送到显示设备（我们的显示器）。\n\
  \n图形 API 默认通常使用两个帧缓冲区（尽管可以为自定义渲染场景生成更多）。在任何给定时刻，一个帧缓冲区包含我们刚刚渲染完的帧的数据，并正在呈现到屏幕上，而另一个帧缓冲区正在被\
  \ GPU 主动绘制，以完成命令缓冲区中的命令。一旦 GPU 达到 `swap buffers` 命令（CPU 要求其为给定帧完成的最后一条指令），帧缓冲区就会互换，以便呈现新帧。然后，GPU\
  \ 将使用旧的帧缓冲区来绘制下一帧。每渲染一帧，这个过程就会重复一次，因此 GPU 只需要两个帧缓冲区来处理此任务。\n\n这个整个过程，从进行图形 API 调用到交换帧缓冲区，会对每个网格、顶点、片段和帧连续重复，只要我们的应用程序仍在渲染。\n\
  \n有两个指标往往是后端瓶颈的根源：填充率和内存带宽。让我们来探讨一下。\n\n# 填充率\n\n填充率是一个非常宽泛的术语，指的是 GPU 绘制片段的速度。然而，这仅包括那些在给定片段着色器中启用的各种条件测试中存活下来的片段。片段只是一个\
  \ _潜在像素_，如果它未能通过任何启用的测试，则会被立即丢弃。这可以大大节省性能，因为渲染管线可以跳过昂贵的绘制步骤，转而处理下一个片段。\n\n一个可能剔除片段的测试示例是\
  \ Z 测试，它检查来自更近物体的片段是否已经绘制到了同一个片段位置（Z 指的是相机视角的深度维度）。如果是，则当前片段被丢弃。如果不是，则片段被推送到片段着色器并绘制到目标像素上，这正好消耗一次填充率。现在，想象一下将此过程乘以成千上万个重叠的物体，每个物体生成数百或数千个可能的片段（更高的屏幕分辨率需要处理更多片段）。仅从主相机的视角来看，所有可能的重叠就很容易导致每帧需要处理数百万个片段。除此之外，我们每秒还要重复这个过程几十次。这就是为什么在渲染管线中进行大量初始设置很重要，而且显而易见，尽可能跳过这些绘制操作将带来巨大的渲染成本节省。\n\
  \n显卡制造商通常会将特定的填充率作为卡片的功能进行宣传，通常以每秒吉像素的形式出现，但这有点不准确，因为更准确的说法应该是每秒吉片段；不过，这个争论大多属于学术范畴。无论如何，较大的值告诉我们，该设备可能能够将更多片段推送到渲染管线中。因此，以每秒\
  \ 30 吉像素的预算和 60 Hz 的目标帧率，我们可以在受到填充率瓶颈限制之前，每帧处理 30,000,000,000 / 60 = 5 亿个片段。以 2560\
  \ x 1440 的分辨率，以及每个像素仅被绘制一次的最佳情况，我们理论上可以绘制整个场景约 125 次而不会出现任何明显问题。\n\n遗憾的是，这并非完美世界。填充率也会被其他高级渲染技术消耗，例如阴影和后期处理效果，它们需要对相同的片段数据进行自己的帧缓冲区通道。即便如此，由于对象渲染的顺序，我们总会在相同像素上产生一定量的重绘。这被称为过度绘制，它是衡量我们填充率利用效率的有用指标。\n\
  \n# 过度绘制\n\n我们有多少过度绘制，可以通过使用加法 Alpha 混合和平面颜色渲染所有对象来直观地表示。高过度绘制区域会显示得更亮，因为同一个像素被多次用加法混合绘制。这正是场景窗口的过度绘制着色模式揭示我们场景中有多少过度绘制的方式。\n\
  \n以下截图显示了一个场景，左侧是绘制了数千个方框的正常场景，右侧是场景窗口的过度绘制着色模式：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_215_0.png)\n\
  \n过度绘制越多，我们通过覆盖片段数据而浪费的填充率就越多。我们可以应用几种技术来减少过度绘制，我们将在后面探讨。\n\n请注意，实际上有几个不同的渲染队列，可以分为两种类型：不透明队列和透明队列。在不透明队列中渲染的对象可以像之前解释的那样通过\
  \ Z 测试剔除片段。然而，在透明队列中渲染的对象无法这样做，因为它们的透明特性意味着我们不能假设无论前面有多少其他对象，它们都不需要被绘制，这会导致大量的过度绘制。所有\
  \ Unity UI 对象始终在透明队列中渲染，使它们成为过度绘制的重要来源。\n\n# 内存带宽\n\n后端的另一个潜在瓶颈来源来自内存带宽。\n每当纹理必须从\
  \ GPU VRAM 的某个部分拉取到较低的内存级别时，就会消耗内存带宽。这通常发生在纹理被采样时，片段着色器尝试为给定位置的给定片段挑选匹配的纹理像素（或纹素）来绘制。GPU\
  \ 包含多个核心，每个核心都可以访问相同的 VRAM 区域，但它们还各自包含一个更小的本地纹理缓存，用于存储 GPU 最近正在处理的纹理。这在设计上与允许内存在链条上上下传输的众多\
  \ CPU 内存缓存级别相似。这是一种硬件设计权宜之计，用于解决更快的内存必然更难且更昂贵生产的事实。因此，与其拥有一个巨大且昂贵的 VRAM 块，不如拥有一个大而便宜的\
  \ VRAM 块，但使用一个更小、非常快速的低级纹理缓存来进行采样，这让我们两全其美，即以较低的成本实现快速采样。\n\n如果核心本地纹理缓存中已经有所需的纹理，那么采样通常会变得快如闪电，几乎不可感知。如果没有，则必须在采样之前从\
  \ VRAM 中拉取纹理。这实际上是纹理缓存的缓存未命中，因为现在需要时间从 VRAM 中查找并拉取所需的纹理。这种传输会消耗一定量的可用内存带宽，具体等于存储在\
  \ VRAM 中的纹理文件的总大小（由于 GPU 级压缩技术，这可能不是原始文件的确切大小或 RAM 中的大小）。\n\n如果我们在内存带宽上遇到瓶颈，GPU\
  \ 将继续获取必要的纹理文件，但整个过程会被限速，因为纹理缓存在处理给定批次的片段之前一直在等待数据出现。GPU 将无法及时将数据推回帧缓冲区以在屏幕上呈现，从而阻塞整个过程并最终导致帧率低下。\n\
  \n合理使用内存带宽是另一个预算问题。例如，以每核心每秒 96 GB 的内存带宽和每秒 60 帧的目标帧率，GPU 在受到内存带宽瓶颈限制之前，每帧可以拉取大约\
  \ 1.6 GB（96/60）的纹理数据。当然，这不是一个精确的预算，因为存在缓存未命中的可能性，但它确实为我们提供了一个可供使用的粗略值。\n\n\n\n\n\
  \n# 光照与阴影\n\n在现代游戏中，单个对象很少能在单个步骤中完全完成渲染，这主要归因于光照与阴影。这些任务通常在片段着色器的多个通道中处理，每个光源对应一个通道，最终结果会被合并，以便多个光源都有机会被应用。结果看起来更加逼真，或者至少更具视觉吸引力。\n\
  \n需要多个通道来收集阴影信息。我们首先会设置场景，使其包含阴影投射者和阴影接收者，分别用于创建或接收阴影。然后，每次渲染阴影接收者时，GPU 会从光源的视角渲染任何阴影投射者对象到纹理中，目的是收集每个片段的距离信息。然后它会对阴影接收者做同样的处理，只不过现在它知道从光源来看哪些片段会被阴影投射者遮挡，因此可以将这些片段渲染得更暗，因为它们将处于光源在阴影投射者上方投射的阴影中。\n\
  \n内存带宽通常按每个核心列出，但一些 GPU 厂商可能会通过将内存带宽乘以核心数量来误导用户，以列出一个更大但不太实用的数字。因此，可能需要进行研究才能公平比较。\n\
  \n请注意，这个值不是我们游戏在项目中可以包含的纹理数据量的最大限制，也不是 CPU 内存，甚至不是 VRAM 的限制。它本质上是一个指标，限制了在一帧内可以发生多少次纹理交换。同一张纹理可能在单帧内被多次来回拉取，具体取决于有多少个着色器需要使用它们、对象的渲染顺序以及纹理采样发生的频率。只有少数几个对象就可能消耗整个\
  \ GB 的内存带宽，因为可用的纹理缓存空间是有限的。需要大量大纹理的着色器更可能导致缓存未命中，从而造成内存带宽瓶颈。如果我们考虑多个对象需要不同的高质量纹理和多个次要纹理贴图（法线贴图、发光贴图等），并且这些贴图没有批处理在一起，那么这种情况出乎意料地容易触发。在这种情况下，纹理缓存无法长时间保留单个纹理文件，以便在下一个渲染通道中立即对其进行采样。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_217_0.png)\n\n然后，这些信息会变成一种称为 _阴影贴图_ 的额外纹理，并在从主相机视角渲染阴影接收者时与其表面混合。这将使其表面在光源与给定对象之间有其他物体的位置显得更暗。创建\
  \ _光照贴图_ 使用类似的过程，光照贴图是为场景中较静态部分预先生成的光照信息。\n\n光照与阴影在渲染管道的所有部分都倾向于消耗大量资源。我们需要每个顶点提供法线方向（指向表面外的矢量）来确定光照应如何从该表面反射，并且可能需要额外的顶点颜色属性来应用一些额外着色。这为\
  \ CPU 和前端提供了更多可传递的信息。由于完成最终渲染需要多个片段着色器通道，后端在填充率（大量需要绘制、重绘和合并的像素）和内存带宽（为光照贴图和阴影贴图拉入或拉出额外纹理）方面都保持忙碌。这就是为什么实时阴影相比大多数其他渲染功能异常昂贵，并且在启用时会显著增加绘制调用数量的原因。\n\
  \n然而，光照与阴影或许是游戏美术与设计中最重要的两个部分，做好它们通常值得额外的性能开支。良好的光照与阴影可以将平庸的场景变得非凡，因为专业着色带来的视觉吸引力有种神奇之处。即使是低多边形艺术风格（例如，手机游戏《纪念碑谷》）也高度依赖良好的光照与阴影配置，以便让玩家能够区分不同对象并创建出视觉上令人愉悦的场景。\n\
  \nUnity 提供了多种影响光照与阴影的功能，从实时光照与阴影（每种都有多种类型）到称为 _光照贴图_ 的静态光照。有很多选项可以探索，当然，如果我们不小心，也有很多事情可能会导致性能问题。\n\
  \n> Unity 文档详细介绍了各种光照功能。请从以下页面开始，逐一学习；这样做非常值得花时间，因为这些系统会影响整个渲染管道；请参阅 https://docs.unity3d.com/Manual/LightingOverview.html\
  \ https://unity3d.com/learn/tutorials/topics/graphics/introduction-lighting-and-rendering。\n\
  \n有两种不同的渲染格式，可以极大地影响我们的光照性能，即 **前向渲染和延迟渲染**。这些渲染选项的设置位于 **编辑 | 项目设置 | 播放器 | 其他设置\
  \ | 渲染**，并可按平台进行配置。\n\n# 前向渲染\n\n前向渲染是我们场景中渲染光照的传统形式，如前所述。在前向渲染期间，每个对象都会通过同一个着色器进行多个通道渲染。需要多少个通道取决于光源的数量、距离和亮度。Unity\
  \ 会尝试优先处理影响对象最大的 `DirectionalLight` 组件，并将对象在 _基础通道_ 中渲染为起点。然后，它会获取附近几个最强大的 `PointLight`\
  \ 组件，并通过同一个片段着色器多次重新渲染同一个对象。每个点光源都将按顶点处理，所有剩余的光源将通过一种称为球谐函数的技术浓缩为 _平均_ 颜色。\n\n通过将光照的\
  \ **渲染模式** 设置为 **不重要** 等值，并更改 **编辑 | 项目设置 | 质量 | 像素光照数量** 的值，可以简化其中一些行为。该值限制了前向渲染将收集的光照数量，但会被任何\
  \ **渲染模式** 设置为 **重要** 的光照覆盖。因此，由我们负责任地使用这组设置组合。\n\n正如我们所想象的，在存在大量点光源的场景中，使用前向渲染会因配置的渲染状态数量和所需着色器通道而迅速导致绘制调用数量激增。\n\
  \n> 有关前向渲染的更多信息，请参阅 Unity 文档 http://docs.unity3d.com/Manual/RenderTech-ForwardRendering.html。\n\
  \n# 延迟渲染\n\n延迟渲染，有时也称为 _延迟着色_，是一种在 GPU 上可用约十年的技术，但由于涉及的注意事项以及在移动设备上支持有限，它并未完全取代前向渲染方法。\n\
  \n延迟着色之所以得名，是因为实际着色直到过程的后期才会发生，也就是说，它被推迟到以后。它的工作原理是创建一个几何缓冲区（称为 G-Buffer），其中场景最初在不应用任何光照的情况下进行渲染。有了这些信息，延迟着色系统可以在单个通道内生成光照配置文件。\n\
  \n从性能角度来看，结果非常出色，因为它可以以很少的绘制调用生成非常好的逐像素光照。一个缺点是，抗锯齿、透明度以及对动画角色应用阴影等效果无法仅通过延迟着色来管理。在这种情况下，前向渲染技术将作为回退方案应用以完成这些任务，因此需要额外的绘制调用来完成。延迟着色的一个更大问题是，它通常需要更强大、更昂贵的硬件，并且并非所有平台都可用，因此能够使用它的用户较少。\n\
  \n> Unity 文档包含关于延迟着色技术及其优点和陷阱的优秀信息来源，可在 http://docs.unity3d.com/Manual/RenderTech-DeferredShading.html\
  \ 找到。\n\n# 顶点光照着色（旧版）\n\n从技术上讲，不止两种光照方法。其余两种是顶点光照着色和一种非常原始、功能宽松的延迟渲染版本。顶点光照着色是光照的大幅简化，因为光照仅按顶点考虑，而不按像素考虑。换句话说，整个面基于入射光照颜色被涂成相同的颜色，而不是通过单个像素在面上混合光照颜色。\n\
  \n不指望有多少，或者说真的有任何 3D 游戏会使用这种旧版技术，因为缺乏阴影和适当的光照使得深度可视化非常困难。它主要被不需要使用阴影、法线贴图和各种其他光照功能的简单\
  \ 2D 游戏使用。\n\n# 全局光照\n\n全局光照，简称 GI，是烘焙光照贴图的一种实现。光照贴图与阴影技术创建的阴影贴图类似，即为每个对象生成一张或多张纹理，表示额外的光照信息，并在片段着色器的光照通道期间稍后应用到对象上，以模拟静态光照效果。\n\
  \n\n\n\n\nLightmaps 与其他形式的照明之间的主要区别在于，Lightmaps 是在编辑器中预先生成（或烘焙）并打包到游戏构建中的。这确保了我们不需要在运行时不断重新生成这些信息，从而节省大量的\
  \ Draw Call 和显著的 GPU 活动。由于我们可以烘焙这些数据，我们有充裕的时间来生成非常高质量的 Lightmaps（当然，代价是需要处理更大的生成纹理文件）。\n\
  \n由于这些信息是预先烘焙的，它无法响应游戏过程中的实时活动，因此默认情况下，任何 Lightmapping 信息都只会应用于生成 Lightmap 时场景中存在且位于确切位置的静态对象。但是，可以将\
  \ Light Probe 添加到场景中，以生成一组额外的 Lightmap 纹理，这些纹理可以应用于附近移动的动态对象，从而使这些对象受益于预先生成的照明。这不会具有像素级的准确性，并且会占用额外\
  \ Light Probe 贴图的磁盘空间以及运行时的内存带宽来交换它们，但它确实会生成更可信、更悦目的照明配置。\n\n多年来，开发出了几种生成 Lightmaps\
  \ 的技术，Unity 自初始发布以来使用了几种不同的解决方案。全局光照（Global Illumination）只是 Lightmapping 背后数学技术的最新一代，它通过计算不仅照明如何影响给定对象，而且光线如何反射到附近表面，从而提供非常逼真的着色，使对象能够影响周围对象的照明配置。这种效果由名为\
  \ Enlighten 的内部系统计算。该工具既用于创建静态 Lightmaps，也用于创建所谓的预计算实时光照（Pre-computed Real-time\
  \ GI），后者是实时和静态着色的混合体，允许我们模拟诸如一天中的时间（太阳光的方向随时间变化）等效果，而无需依赖昂贵的实时照明效果。\n\n生成 Lightmaps\
  \ 的一个典型问题是生成它们并获得当前设置的视觉反馈所需的时间，因为 Lightmapper 通常试图在一次通过中生成全细节 Lightmaps。如果用户尝试修改其配置，则整个任务必须取消并重新开始。为了解决这个问题，Unity\
  \ Technologies 实现了渐进式 Lightmapper，它更逐渐地随时间执行 Lightmapping 任务，但也允许在计算过程中对其进行修改。这使得场景中的\
  \ Lightmaps 在后台工作时看起来变得越来越详细，同时还允许我们在它仍在工作时更改某些属性，而无需重新启动整个任务。这提供了几乎即时的反馈，并极大地改善了生成\
  \ Lightmaps 的工作流程。\n\n# 多线程渲染\n\n多线程渲染在大多数系统上默认启用，例如桌面和主机平台，其 CPU 提供多个内核。其他平台仍然支持许多低端设备默认启用此功能，因此对于它们来说，这是一个可切换的选项。对于\
  \ Android，可以通过 **Edit | Project Settings | Player | Other Settings | Multithreaded\
  \ Rendering** 下的复选框启用它，而对于 iOS，可以通过配置应用程序以使用 Apple 的 Metal API 在 **Edit | Project\
  \ Settings | Player | Other Settings | Graphics API** 下启用多线程渲染。在撰写本书时，WebGL 不支持多线程渲染。\n\
  \n对于场景中的每个对象，有三个任务需要完成：确定对象是否需要渲染（通过一种称为 _视锥体剔除（Frustum Culling）_ 的技术），如果是，则生成渲染对象的命令（因为渲染单个对象可能会导致几十个不同的命令），然后使用相关的图形\
  \ API 将命令发送到 GPU。如果没有多线程渲染，所有这些任务都必须在 CPU 的主线程上发生，因此主线程上的任何活动都成为所有渲染的关键路径的一部分。启用多线程渲染后，将命令推送到\
  \ GPU 的任务由 _渲染线程（render thread）_ 处理，而其他任务（如剔除和生成命令）则分布在多个 _工作线程（worker threads）_\
  \ 上。这种设置可以为主线程节省大量的 CPU 周期，主线程是其他大多数 CPU 任务（例如物理和脚本代码）发生的地方。\n\n启用此功能将影响 CPU 瓶颈的含义。没有多线程渲染时，主线程正在执行为命令缓冲区生成指令所需的所有工作，这意味着我们在其他地方节省的任何性能都将为\
  \ CPU 生成命令腾出更多时间。但是，当多线程渲染正在进行时，大部分工作负载被推送到单独的线程上，这意味着对主线程的改进对通过 CPU 的渲染性能的影响会较小。\n\
  \n> 请注意，无论是否进行多线程渲染，GPU 瓶颈都是一样的。GPU 始终以多线程方式执行其任务。\n\n# 低级别渲染 API\n\nUnity 通过其 `CommandBuffer`\
  \ 类向我们公开一个渲染 API。这允许我们通过 C# 代码直接控制渲染管道，通过发出高级别渲染命令，例如 `使用此材质渲染此对象，使用此着色器`，或 `绘制此程序化几何体的\
  \ N 个实例`。这种自定义不如直接访问图形 API 那么强大，但对于 Unity 开发者自定义独特的图形效果来说，这是一个正确的方向。\n\n查看 Unity\
  \ 关于 `CommandBuffer` 的文档，以使用此功能，网址为 `http://docs.unity3d.com/ScriptReference/Rendering.CommandBuffer.html`。\n\
  \n如果需要更直接的渲染控制级别，例如我们希望对 OpenGL、DirectX 和 Metal 进行直接图形 API 调用，那么请注意，可以创建一个原生插件（专为目标平台架构编译的\
  \ C++ 代码编写的小型库），它挂钩到 Unity 的渲染管道，为特定渲染事件发生时设置回调，类似于 `MonoBehaviours` 挂钩到 Unity 主引擎的各种回调。这对于大多数\
  \ Unity 用户来说当然是一个高级话题，但随着我们对渲染技术和图形 API 的知识成熟，将来有用知道。\n\nUnity 提供了关于在原生插件中生成渲染接口的良好文档，网址为\
  \ `https://docs.unity3d.com/Manual/NativePluginInterface.html`。\n\n# 检测性能问题\n\n\
  由于涉及大量复杂过程，GPU 可能会以多种不同的方式成为瓶颈，这应该是显而易见的。既然我们已经彻底了解了渲染管道以及瓶颈可能发生的方式，让我们探讨如何检测这些问题。\n\
  \n# 分析渲染问题\n\n分析器（Profiler）可用于快速缩小我们在渲染管道中使用的两个设备之一的瓶颈范围——无论是 CPU 还是 GPU。我们必须使用\
  \ **分析器（Profiler）** 窗口的 **CPU 使用率（CPU Usage）** 和 **GPU 使用率（GPU Usage Areas）** 区域来检查问题，因为这可以告诉我们哪个设备工作最努力。\n\
  \n以下屏幕截图显示了 CPU 瓶颈应用程序的 **分析器（Profiler）** 数据。测试涉及创建数千个简单的立方体对象，没有进行批处理或阴影技术。这导致\
  \ CPU 需要为其生成命令的极大量 Draw Call 数量（约 32,000），但由于渲染对象的简单性，GPU 有相对较少的工作要做：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_224_0.png)\n\
  \n此示例显示，CPU 的 **渲染（Rendering）** 任务正在消耗大量周期（每帧约 25 毫秒），而 GPU 处理时间少于 4 毫秒，表明瓶颈在于 CPU。请注意，此分析测试是针对独立应用程序进行的，而不是在编辑器中。我们现在知道我们的渲染是\
  \ CPU 瓶颈，可以开始应用一些节省 CPU 的性能改进（注意不要通过这样做在其他地方引入渲染瓶颈）。\n\n与此同时，通过分析器分析 GPU 瓶颈应用程序要棘手一些。这次，测试涉及创建一个需要最少\
  \ Draw Call 的简单对象，但使用了非常昂贵的着色器，该着色器采样纹理数千次，在后端产生荒谬的活动量。\n\n\n\n\n\n# Dynamic Graphics\
  \ 第 6 章\n\n要执行公平的 GPU 绑定分析测试，你应该通过 Edit | Project Settings | Quality | Other | V\
  \ Sync Count 禁用垂直同步，否则很可能会污染我们的数据。\n\n以下截图显示了在独立应用程序中运行此测试时的分析器数据：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_225_0.png)\n\
  \n如前一张截图所示，CPU 使用率区域的渲染任务与 GPU 使用率区域的总渲染开销高度吻合。我们还可以看到，图像底部的 CPU 和 GPU 时间开销相对相似（各约\
  \ 29 毫秒）。这有些令人困惑，因为我们似乎在两个设备上都同样受到瓶颈限制，而我们预期 GPU 应该比 CPU 工作得更辛苦。\n\n实际上，如果我们使用 **层次结构模式**\
  \ 深入研究 **CPU 使用率区域** 的 **细分视图**，我们会注意到大部分 CPU 时间都花在标记为 **Gfx.WaitForPresent** 的任务上。这是\
  \ CPU 在等待 GPU 完成当前帧时浪费的时间。因此，我们实际上是受到 GPU 瓶颈限制，尽管看起来像是两者都受到限制。即使启用了多线程渲染，CPU 也必须等待渲染管道完成，然后才能开始下一帧。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_226_0.png)\n\n**Gfx.WaitForPresent**\
  \ 也用于指示 CPU 正在等待垂直同步完成，因此需要为此测试禁用它。\n\n# 暴力测试\n\n如果我们正在仔细研究分析数据，仍然不确定问题所在，或者我们受到\
  \ GPU 限制并需要确定在渲染管道的哪个位置存在瓶颈，我们应该尝试暴力法，即从场景中剔除特定活动并检查是否会导致性能大幅提升。如果小的变化带来巨大的速度提升，那么我们就有了关于瓶颈所在的强烈线索。如果我们消除了足够多的未知变量以确保数据引导我们走向正确方向，那么这种方法没有任何坏处。\n\
  \n针对 CPU 限制的明显暴力测试是减少绘制调用以检查性能是否突然提升。然而，这通常是不可能的，因为我们可能已经通过静态批处理、动态批处理和图集等技术将绘制调用减少到最小。这意味着我们进一步减少绘制调用的空间非常有限。\n\
  \n不过，我们可以通过引入更多对象或禁用静态批处理和动态批处理等节省绘制调用的功能，有意地小幅增加绘制调用次数，并观察情况是否比以前显著恶化。如果是，那么我们就有证据表明我们要么非常接近\
  \ CPU 限制，要么已经成为 CPU 限制。\n\n有两个很好的暴力测试可以应用于受 GPU 限制的应用程序，以确定我们是受填充率还是内存带宽限制：分别是降低屏幕分辨率或降低纹理分辨率。\n\
  \n通过降低屏幕分辨率，我们将要求光栅化器生成显著更少的片段，并将它们映射到更小的像素画布上供后端处理。这将减少应用程序的填充率消耗，为渲染管道的这一关键部分提供一些额外的喘息空间。因此，如果降低屏幕分辨率后性能突然提升，那么填充率应该是我们的主要关注点。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_227_0.png)\n\n从 2560 x 1440 分辨率降低到 800\
  \ x 600 分辨率，性能提升因子约为八倍，这通常足以大幅降低填充率开销，使应用程序再次运行良好。\n\n同样，如果我们受到内存带宽瓶颈限制，那么降低纹理质量可能会导致显著的性能提升。这样做，我们缩小了纹理的大小，大大降低了片段着色器的内存带宽开销，使\
  \ GPU 能够更快地获取所需的纹理。全局降低纹理质量可以通过转到 **Edit | Project Settings | Quality | Texture\
  \ Quality** 并将值设置为 **Half Res**、**Quarter Res** 或 **Eighth Res** 来实现。\n\n受 CPU 限制的应用程序有大量机会通过本书中几乎每个性能增强技巧来提升性能。如果我们从其他活动中释放\
  \ CPU 周期，那么我们就可以通过更多绘制调用来渲染更多对象，当然要记住，每个对象都会增加 GPU 的活动。然而，在尝试改进渲染管道的其他部分时，还有额外的机会来间接改进绘制调用数量。这包括遮挡剔除、调整光照和阴影行为以及修改着色器。这些将在后续部分中解释，因为我们将调查各种性能增强。\n\
  \n与此同时，我们可能需要应用一些暴力测试和猜测来确定受 GPU 限制的应用程序是如何被瓶颈限制的。大多数应用程序受到填充率或内存带宽瓶颈限制，因此我们应该从这里开始。在桌面应用程序中，很少在前端发现性能瓶颈，因此只有在验证了其他来源不是问题后才值得检查。顶点着色器通常与片段着色器相比微不足道，因此导致前端处理出现问题的唯一真正机会要么是推送过多几何体，要么是具有过于复杂的几何着色器。\n\
  \n最终，这项调查应该帮助我们确定我们是受 CPU 限制还是受 GPU 限制，在后一种情况下，是受前端还是后端限制，再在后一种情况下，是受填充率还是内存带宽限制。有了这些知识，我们可以应用许多技术来提升性能。\n\
  \n# 渲染性能增强\n\n我们现在应该拥有理解性能瓶颈所需的所有信息，以便开始应用修复。在本章的其余部分，我们将介绍一系列技术，以提高受 CPU 限制和受 GPU\
  \ 限制应用程序的渲染管道性能。\n\n# 启用/禁用 GPU 皮肤动画\n\n第一个技巧涉及一个设置，它以牺牲另一个设备为代价来减轻 CPU 或 GPU 前端的负担，即\
  \ GPU 皮肤动画。皮肤动画是根据动画骨骼的当前位置转换网格顶点的过程。动画系统在 CPU 上工作，转换用于确定对象当前姿态的骨骼，但动画过程中的下一个重要步骤是将网格顶点包裹在骨骼周围，将网格置于最终姿态。这是通过遍历每个顶点并对连接到这些顶点的骨骼进行加权平均来实现的。\n\
  \n此顶点处理任务可以在 CPU 上或在 GPU 的前端中进行，具体取决于是否启用了 **GPU 皮肤动画** 选项。此功能可以在 **Edit | Project\
  \ Settings | Player Settings | Other Settings | GPU Skinning** 下切换。启用此选项将皮肤动画活动推送到\
  \ GPU，但请记住，CPU 仍然必须将数据传输到 GPU 并为该任务生成命令缓冲区上的指令，因此它并没有完全消除 CPU 的工作量。禁用此选项通过让 CPU\
  \ 在传输网格数据之前解析网格的姿态，然后简单地要求 GPU 按原样绘制它，从而减轻 GPU 的负担。显然，如果我们在场景中有大量动画网格，此功能很有用，可以通过将工作推送到最不繁忙的设备来帮助任何一种受限情况。\n\
  \n\n\n\n\n# 减少几何复杂度\n\n此技巧涉及 GPU 前端。我们在第四章“启动您的美术工作”中已经介绍了一些网格优化技术，这些技术可以帮助减少网格的顶点属性。作为快速提醒，使用包含大量不必要的\
  \ UV 和法线数据的网格并不罕见，因此我们应该对网格进行双重检查，以排除这种多余的冗余内容。我们还应该让 Unity 为我们优化结构，以最大限度地减少缓存未命中，因为顶点数据在前端中被读取。\n\
  \n目标是简单地减少实际顶点数量。有三种解决方案。首先，我们可以通过让美术团队手动调整和生成低多边形数量的网格，或者使用网格简化工具来为我们完成此操作，从而简化网格。其次，我们可以简单地从场景中移除网格，但这应该是最后的手段。第三种选择是通过实现诸如细节层次（LOD）等功能来实现自动剔除，这将在本章后面解释。\n\
  \n# 减少细分\n\n通过几何着色器进行细分可以非常有趣，因为这是一种相对未被充分利用的技术，可以真正使我们的图形效果在仅使用最常见效果的游戏中脱颖而出。然而，它可能会极大地增加前端中进行的处理工作量。\n\
  \n除了改进我们的细分算法或减轻其他前端任务造成的负担，以给细分任务更多喘息空间之外，并没有真正简单的技巧可以利用来改进细分。无论如何，如果我们在前端存在瓶颈并且正在使用细分技术，我们应该双重检查它们是否没有消耗前端预算的大部分。\n\
  \n# 使用 GPU 实例化\n\nGPU 实例化是一种快速渲染相同网格多个副本的方法，它利用了这些网格将具有相同的渲染状态，因此需要最少的绘制调用的事实。这实际上与动态批处理相同，只是它不是自动过程。事实上，我们可以将动态批处理视为穷人的\
  \ GPU 实例化，因为 GPU 实例化可以实现更好的节省，并通过允许参数化变体来实现更多自定义。\n\nGPU 实例化在材质级别应用，使用**启用实例化**复选框，并且可以通过修改着色器代码来引入变体。这样，我们可以为不同的实例赋予不同的旋转、缩放、颜色等。这对于渲染森林和岩石区域等场景非常有用，我们希望在这些场景中渲染数百或数千个带有轻微变化的网格副本。\n\
  \n> 请注意，蒙顶网格渲染器无法实例化，原因与它们无法动态批处理相似，并且并非所有平台和 API 都支持 GPU 实例化。\n\n以下截图显示了 GPU 实例化对一组\
  \ 512 个立方体对象（应用了一些额外的光照和阴影以增加总绘制调用数量）的好处：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_230_0.png)\n\
  \n与动态批处理相比，该系统要通用得多，因为我们对对象如何批处理在一起有更多控制权。当然，如果我们以低效的方式批处理事物，就会有更多出错的机会，因此我们应该谨慎使用。\n\
  \n有关 GPU 实例化的更多信息，请查看 Unity 文档 https://docs.unity3d.com/Manual/GPUInstancing.html。\n\
  \n# 使用基于网格的细节层次（LOD）\n\nLOD 是一个广义术语，指根据功能与摄像机的距离和/或它们在摄像机视图中占据的空间大小来动态替换功能。由于在很远的距离很难分辨低质量和高质量对象之间的区别，因此很少有理由渲染高质量版本，所以我们可以动态地将远处的对象替换为更简单的东西。LOD\
  \ 最常见的实现是基于网格的 LOD，其中网格会随着摄像机越来越远而动态替换为细节较低的版本。\n\n可以通过在场景中放置多个对象并将其作为带有附加 `LODGroup`\
  \ 组件的 `GameObject` 的子对象来实现基于网格的 LOD。LOD 组的目的是从这些对象生成一个包围盒，并根据包围盒在摄像机视野中的大小来决定应该渲染哪个对象。如果对象的包围盒占据当前视图的大面积，则会启用分配给较低\
  \ LOD 组的网格；如果包围盒非常小，则会将网格替换为较高 LOD 组中的网格。如果网格太远，可以配置为隐藏所有子对象。因此，通过正确的设置，我们可以让 Unity\
  \ 用更简单的替代品替换网格，或者完全剔除它们，从而减轻渲染过程的负担。\n\n有关基于网格的 LOD 功能的更详细信息，请查看 Unity 文档 `http://docs.unity3d.com/Manual/LevelOfDetail.html`。\n\
  \n此功能的完全实现可能会花费大量开发时间；艺术家必须生成同一对象的低多边形数量版本，关卡设计师必须生成 LOD 组、配置它们并测试它们，以确保它们在摄像机靠近或远离时不会造成突兀的过渡。\n\
  \n> > 请注意，一些游戏开发中间件公司提供用于自动化 LOD 网格生成的第三方工具。这些工具可能值得调查，以比较其易用性、质量损失和成本效益。\n\n基于网格的\
  \ LOD 还会在磁盘占用空间以及 RAM 和 CPU 方面带来成本；替代网格需要打包、加载到 RAM 中，并且 `LODGroup` 组件必须定期测试摄像机是否移动到了需要更改\
  \ LOD 级别的新位置。然而，对渲染管道的好处相当显著。动态渲染更简单的网格减少了我们需要传递的顶点数据量，并可能减少渲染对象所需的绘制调用、填充率和内存带宽。\n\
  \n由于基于网格的 LOD 要正常工作需要做出许多牺牲，开发者应避免通过自动假设基于网格的 LOD 会有所帮助而进行预优化。过度使用该功能会给我们应用程序性能的其他部分带来负担，并消耗宝贵的开发时间，这一切都只是出于多疑。只有当我们开始观察到渲染管道出现问题，并且有\
  \ CPU、RAM 和开发时间可用时，才应该使用它。\n\n话虽如此，那些具有广阔世界视图和大量摄像机移动的场景，可能会考虑非常早地实现此技术，因为增加的距离和大量可见对象可能会极大地增加顶点数量。作为反例，那些始终在室内或摄像机视角俯视世界的场景，从该技术中获益甚微，因为对象始终与摄像机保持相似距离。示例包括**即时战略（RTS）**和**多人在线战术竞技场（MOBA）**游戏。\n\
  \n# 剔除组\n\n剔除组是 Unity API 的一部分，它有效地允许我们创建自己的自定义 LOD 系统，作为动态替换某些游戏玩法或渲染行为的一种方式。我们可能想要应用\
  \ LOD 的一些示例包括将动画角色替换为骨骼更少的版本、应用更简单的着色器、在远距离跳过粒子系统生成、简化 AI 行为等等。\n\n由于剔除组系统在最基本级别上只是告诉我们对象是否对摄像机可见以及它们有多大，因此它在游戏玩法领域还有其他用途，例如确定某些敌人生成点当前是否对玩家可见，或者玩家是否正在接近某些区域。剔除组系统有广泛的可能性，值得考虑。当然，实现、测试和重新设计场景以利用它所花费的时间可能是巨大的。\n\
  \n\n\n\n\n# 利用遮挡剔除\n\n减少填充率消耗和过度绘制的最佳方法之一是使用 Unity 的遮挡剔除系统。该系统通过将世界划分为一系列小单元，并让虚拟相机在场景中飞行，根据对象的大小和位置，记录哪些单元从其他单元不可见（即被_遮挡_）。\n\
  \n请注意，这与视锥剔除技术不同，视锥剔除会剔除当前相机视图外的对象。视锥剔除始终处于活动状态且自动执行。因此，由此过程剔除的对象会被遮挡剔除系统自动忽略。\n\
  \n遮挡剔除数据只能为在 **StaticFlags** 下拉菜单中正确标记为 **Occluder Static** 和/或 **Occludee Static**\
  \ 的对象生成。**Occluder Static** 是静态对象的常规设置，我们预期这些对象足够大，既会遮挡其他对象，也会被其他对象遮挡，例如摩天大楼或山脉，它们可以隐藏其后的其他对象，也可能彼此遮挡，等等。**Occludee\
  \ Static** 是一种特殊情况，适用于透明对象等情况，这些对象始终需要渲染其后的其他对象，但如果有大型物体阻挡其可见性，则它们自身需要被隐藏。\n\n自然地，因为必须启用\
  \ **Static** 标志才能使用遮挡剔除，因此此功能对动态对象无效。\n\n以下截图展示了遮挡剔除在减少场景中渲染对象数量方面的效果（从外部视角演示）。从主相机的角度来看，两种情况看起来相同。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_233_0.png)\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_233_1.png)\n\
  \n渲染管道不会浪费时间渲染被更近的对象遮挡的对象：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_234_0.png)\n\
  \n启用遮挡剔除功能会增加磁盘空间、RAM 和 CPU 时间的开销。需要额外的磁盘空间来存储遮挡数据，需要额外的 RAM 来保持数据结构在内存中，并且每帧都会产生\
  \ CPU 处理开销来确定哪些对象被遮挡。遮挡剔除数据结构必须正确配置，以便为我们的场景创建适当大小的单元，单元越小，生成数据结构所需的时间越长。但是，如果针对场景正确配置，遮挡剔除可以通过减少过度绘制来节省填充率，并通过剔除不可见对象来节省绘制调用。\n\
  \n> 请注意，即使对象可能被遮挡剔除，其阴影仍必须计算，因此我们不会从这些任务中节省任何绘制调用或填充率。\n\n# 优化粒子系统\n\n粒子系统适用于大量不同的视觉效果，通常生成的粒子越多，效果看起来越好。但是，我们需要对生成的粒子数量和使用的着色器复杂度负责，因为它们可能触及渲染管道的所有部分；它们会为前端生成大量顶点（每个粒子是一个四边形），并且可能使用多个纹理，这些纹理在后端会消耗填充率和内存带宽，因此如果使用不当，它们可能导致应用程序在任何地方都成为瓶颈。\n\
  \n降低粒子系统密度和复杂度相当简单——使用更少的粒子系统、生成更少的粒子，和/或使用更少的特效。图集也是降低粒子系统性能开销的另一种常见技术。但是，粒子系统背后有一个不太为人所知的重要性能考量，并且发生在幕后，那就是自动粒子系统剔除过程。\n\
  \n# 利用粒子系统剔除\n\nUnity Technologies 发布了一篇关于此主题的优秀博客文章，可在 `https://blogs.unity3d.com/2016/12/20/unitytips-particlesystem-performance-culling/`\
  \ 找到。\n\n基本思想是，所有粒子系统要么是可预测的，要么是不可预测的（确定性与非确定性），这取决于各种设置。当粒子系统可预测且对主视图不可见时，整个粒子系统可以自动剔除以节省性能。一旦可预测的粒子系统重新进入视图，Unity\
  \ 就可以计算出粒子系统在该时刻应该呈现的样子，就好像它在不可见期间一直在生成粒子一样。只要粒子系统以非常程序化的方式生成粒子，状态就可以立即在数学上求解。\n\
  \n但是，如果任何设置迫使粒子系统变得不可预测或 `nonprocedural`，那么它将无法知道如果之前被隐藏，粒子系统当前的状态应该是什么，因此无论是否可见，都需要每帧完全渲染它。破坏粒子系统可预测性的设置包括但不限于让粒子系统在世界空间中渲染、应用外部力、碰撞和轨迹，或使用复杂的动画曲线。请查看前面提到的博客文章，了解非程序化条件的严格列表。\n\
  \n请注意，当某些事情会导致粒子系统中断自动剔除时，Unity 会提供有用的警告，如以下截图所示：\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_236_0.png)\n\
  \n# 避免递归粒子系统调用\n\n`ParticleSystem` 组件可用的许多方法都是递归调用。调用它们会遍历粒子系统的每个子项，然后在每个子项上调用 `GetComponent<ParticleSystem>()`，如果组件存在，它将调用相应的方法。然后这会对原始父级下的每个子\
  \ `ParticleSystem`、其孙级等重复。这在粒子系统层次结构很深时可能是一个巨大的问题，这在复杂效果中有时是常见的情况。\n\n受此行为影响的几个\
  \ `ParticleSystem` API 调用包括 `Start()`、`Stop()`、`Pause()`、`Clear()`、`Simulate()`\
  \ 和 `isAlive()`。我们显然不能完全避免这些方法，因为它们代表了我们最希望在粒子系统上调用的最常用方法。但是，每个方法都有一个默认为 `true`\
  \ 的 `withChildren` 参数。通过将 `false` 传递给此参数（例如，通过调用 `Clear(false)`），它会禁用递归行为，不会调用其子项。因此，方法调用将仅影响给定的粒子系统，从而降低调用的开销成本。\n\
  \n这并不总是理想的，因为我们通常确实希望粒子系统的所有子项都受到方法调用的影响。因此，另一种方法是，像我们在 _Chapter 2, Scripting Strategies_\
  \ 中学到的那样，缓存 `ParticleSystem` 组件，并手动遍历它们（确保每次都为 `withChildren` 参数传递 `false`）。\n\n\
  # 优化 Unity UI\n\nUnity 最初几次尝试内置 UI 系统并不特别成功；它们通常很快被资产商店上的产品所取代。但是，他们最新一代的解决方案（简单称为\
  \ Unity UI）已成为一个更受欢迎的解决方案，以至于许多开发人员开始依赖它来满足他们的 UI 需求，事实上，Unity Technologies 在 2017\
  \ 年初收购了 Text Mesh Pro 资产背后的公司，并将其合并到 Unity UI 作为内置功能。\n\n让我们探讨一些可以用来提高 Unity 内置\
  \ UI 性能的技术。\n\n# 使用更多画布\n\n`Canvas` 组件的主要任务是管理用于绘制 **Hierarchy** 窗口中其下方 UI 元素的网格，并发出渲染这些元素所需的绘制调用。画布的一个重要任务是将这些网格批量处理在一起（只有当它们共享相同的材质时才能发生），以减少绘制调用。但是，当对画布或其任何子项进行更改时，这被称为使画布“脏化”。当画布“脏”时，它需要在发出绘制调用之前为其下方的所有\
  \ UI 元素重新生成网格。这个重新生成过程并非简单任务，是 Unity 项目中性能问题的常见来源，因为不幸的是，有很多事情会导致画布被脏化。即使在画布中更改单个\
  \ UI 元素也会导致这种情况。导致脏化的事情太多，而不导致脏化的事情太少（并且通常仅在特定情况下），因此最好谨慎行事，假设任何更改都会导致这种效果。\n\n\
  ![](img/da79484c9b30dc915216dbc5454a9bbf_237_0.png)\n\n也许唯一不会导致脏化的显著操作是更改 UI 元素的\
  \ `Color` 属性。\n\n\n\n\n\n如果我们发现 UI 在任何内容发生变化时（有时甚至每帧都会变化）都会导致 CPU 使用率大幅飙升，那么我们可以采用的一个解决方案就是简单地使用更多的\
  \ Canvas。一个常见的错误是将整个游戏的 UI 构建在单个 Canvas 中，并随着游戏代码及其 UI 变得越来越复杂而一直保持这种状态。\n\n这意味着\
  \ UI 中任何内容发生变化时，都需要检查每个元素，随着更多元素被塞进单个 Canvas，这对性能的影响会变得越来越灾难性。然而，每个 Canvas 都是独立的，不需要与\
  \ UI 中的其他 Canvas 进行交互，因此通过将 UI 拆分为多个 Canvas，我们可以分离工作负载并简化任何单个 Canvas 所需的任务。\n\n\
  确保将 `GraphicsRaycaster` 组件添加到与子 Canvas 相同的 `GameObject` 上，以便其自身的子元素仍然可以进行交互。相反，如果\
  \ Canvas 的子元素都不可交互，那么我们可以安全地从中移除任何 `GraphicsRaycaster` 组件以降低性能开销。\n\n在这种情况下，即使某个元素仍然发生变化，响应而需要重新生成的其他元素也会减少，从而降低性能开销。这种方法的缺点是不同\
  \ Canvas 之间的元素不会被合并批处理，因此我们应该尽可能将具有相同材质的相似元素保持在同一个 Canvas 中分组。\n\n也可以将一个 Canvas\
  \ 作为另一个 Canvas 的子级，以便于组织，并且相同的规则适用。如果一个 Canvas 中的元素发生变化，另一个 Canvas 将不受影响。\n\n# 在静态和动态\
  \ Canvas 之间分离对象\n\n我们应努力以一种基于元素更新时间来分组元素的方式生成我们的 Canvas。我们应该将元素视为属于以下三组之一：_静态_、_偶发动态_和_连续动态_。静态\
  \ UI 元素是那些永远不会改变的元素，良好的示例包括背景图像、标签等等。动态元素是那些可以改变的元素，其中偶发动态对象是那些仅响应某些内容（例如 UI 按钮点击或悬停操作）而改变的\
  \ UI 元素，而连续动态对象是那些定期更新的 UI 元素，例如动画元素。\n\n我们应该尝试将 UI 中任何给定部分的这三组元素分割到三个不同的 Canvas\
  \ 中，因为这将最大限度地减少重新生成过程中的浪费努力。\n\n# 为非交互元素禁用射线检测目标\n\nUI 元素具有 **Raycast Target** 选项，该选项使它们能够通过点击、轻触和其他用户行为进行交互。每次发生这些事件之一时，`GraphicsRaycaster`\
  \ 组件将执行像素到包围盒检查，以找出哪个元素已被交互，这是一个简单的迭代 `for` 循环。通过为非交互元素禁用此选项，我们减少了 `GraphicsRaycaster`\
  \ 需要迭代的元素数量，从而节省性能。\n\n# 通过禁用父级 Canvas 组件来隐藏 UI 元素\n\nUI 使用单独的布局系统来处理某些元素类型的重新生成，其运作方式类似于使\
  \ Canvas 脏化。`UIImage`、`UIText` 和 `LayoutGroup` 都是属于此系统的组件示例。有很多事情可能导致布局系统变脏，最明显的是启用和禁用此类元素。但是，如果我们想要禁用\
  \ UI 的一部分，可以通过简单地禁用它们作为子级的 `Canvas` 组件，来避免来自布局系统的这些昂贵重新生成调用。这可以通过将 `Canvas` 组件的\
  \ `enabled` 属性设置为 `false` 来完成。这种方法的缺点是，如果任何子对象具有某些 `Update()`、`FixedUpdate()`、`LateUpdate()`\
  \ 或协程代码，那么我们还需要手动禁用它们，否则它们将继续运行。通过禁用 `Canvas` 组件，我们只是停止 UI 的渲染和交互，并且应该期望各种更新调用将像往常一样继续发生。\n\
  \n# 避免使用 Animator 组件\n\nUnity 的 `Animator` 组件从未打算与其 UI 系统的最新版本一起使用，它们与 UI 系统的交互是一种天真的实现。每一帧，Animator\
  \ 都会更改 UI 元素上的属性，导致它们的布局变脏并引起大量内部 UI 信息的重新生成。我们应该完全避免使用 Animator，而是自己执行缓动或使用专门为此类操作设计的实用资产。\n\
  \n# 为世界空间 Canvas 显式定义事件相机\n\nCanvas 可用于 2D 和 3D 中的 UI 交互。这取决于 Canvas 的 **Render\
  \ Mode** 设置是配置为 **Screen Space**（2D）还是 **World Space**（3D）。每次发生 UI 交互时，`Canvas`\
  \ 组件都会检查其 `eventCamera` 属性（在 **Inspector** 窗口中显示为 **Event Camera**）以找出要使用哪个相机。默认情况下，2D\
  \ Canvas 会将此属性设置为主相机，但 3D Canvas 会将其保留为 `null`。这很不幸，因为每次需要事件相机时，它仍然会使用主相机，但会通过调用\
  \ `FindObjectWithTag()` 来实现。按标签查找对象的性能开销不算差，但其性能开销会随着项目中使用的标签数量线性增加。更糟糕的是，对于 **World\
  \ Space** Canvas，在给定帧中会相当频繁地访问事件相机，这意味着将此属性保留为 `null` 将导致巨大的性能损失，而没有任何实际好处。我们应该为所有\
  \ **World Space** Canvas 手动将此属性设置为主相机。\n\n# 不要使用 alpha 值来隐藏 UI 元素\n\n在 `color` 属性中将\
  \ UI 元素的 alpha 值设置为 `0` 渲染时，仍然会发出绘制调用。我们应该优先更改 UI 元素的 `IsActive` 属性，以便在需要时隐藏它。另一种替代方案是通过\
  \ `CanvasGroup` 组件使用 Canvas 组，这些组件可用于控制其下所有子元素的 alpha 透明度。将 Canvas 组的 `alpha` 值设置为\
  \ `0` 将剔除其子对象，因此不会发出绘制调用。\n\n# 优化 ScrollRect\n\n`ScrollRect` 组件是用于滚动浏览其他 UI 元素列表的\
  \ UI 元素，在移动应用程序中非常常见。不幸的是，这些元素的性能随着大小而非常糟糕地下降，因为 Canvas 需要定期重新生成它们。我们可以做很多事情来改善\
  \ `ScrollRect` 组件的性能。\n\n## 确保使用 RectMask2D\n\n可以通过简单地将深度值低于 ScrollRect 元素的其他 UI\
  \ 元素放置来创建滚动 UI 行为。但是，这是不良实践，因为 ScrollRect 中不会进行剔除，并且在 ScrollRect 移动的每一帧都需要重新生成每个元素。如果我们还没有这样做，应该使用\
  \ RectMask2D 组件来剪切和剔除不可见的子对象。此组件创建一个空间区域，其中任何子 UI 元素如果在 RectMask2D 组件的边界之外，都会被剔除。确定是否剔除对象的开销与渲染太多不可见元素所节省的开销相比，通常是值得的。\n\
  \n## 为 ScrollRect 禁用像素完美\n\n像素完美是 Canvas 组件上的一个设置，它强制其子 UI 元素与屏幕上的像素直接对齐绘制。这通常是艺术和设计的要求，因为如果禁用它，UI\
  \ 元素会显得更清晰。虽然这种对齐行为是一项相对昂贵的操作，但对于我们的大多数 UI 来说，启用它以保持清晰和清晰实际上是强制性的。但是，对于动画和快速移动的对象，由于涉及运动，这可能有点多余。为\
  \ ScrollRect 元素禁用像素完美是节省性能的好方法。但是，由于像素完美设置会影响整个 Canvas，我们应该确保将 ScrollRect 元素作为单独\
  \ Canvas 下的子对象启用，以便其他元素保持其像素对齐行为。\n\n> 不同类型的动画 UI 元素在禁用像素完美时实际上看起来更好。请务必进行一些测试，因为它可以节省大量性能。\n\
  \n## 手动停止 ScrollRect 运动\n\n即使速度每帧只移动一小部分像素，Canvas 也始终需要重新生成整个 ScrollRect 元素。我们可以在检测到其速度低于某个阈值时，使用\
  \ ScrollRect.velocity 和 ScrollRect.StopMovement() 手动冻结其运动。这可以大大降低重新生成的频率。\n\n\n\n\
  \n\n# 使用空的 UIText 元素实现全屏交互\n\n大多数 UI 中常见的做法是激活一个覆盖整个屏幕的大型透明可交互元素，迫使玩家在继续之前先处理弹窗，同时仍允许玩家看到其后发生的事情（作为不让玩家完全脱离游戏体验的一种方式）。这通常是通过\
  \ `UIImage` 元素实现的，但不幸的是，这可能会破坏批处理操作，并且透明度在移动设备上可能会成为问题。\n\n绕过此问题的一个 hacky 方法是使用没有定义\
  \ **Font** 或 **Text** 的 `UIText` 元素。这会创建一个不需要生成任何可呈现信息且仅处理交互边界框检查的元素。\n\n# 检查 Unity\
  \ UI 源代码\n\nUnity 在 `https://bitbucket.org/Unity-Technologies/ui` 的 bitbucket 仓库中提供了其\
  \ UI 系统的代码。\n\n如果我们的 UI 性能出现重大问题，可以查看源代码以找出究竟发生了什么，并希望找到绕过问题的方法。\n\n一种更激进的措施，但也是一个潜在选项，是实际修改\
  \ UI 代码，对其进行编译，并手动将其添加到我们的项目中。\n\n# 检查文档\n\n先前提到的技巧是 UI 系统中一些更晦涩、未记录或关键的性能优化技巧。Unity\
  \ 网站上有许多优秀的资源，解释了 UI 系统的工作原理以及如何最好地优化它，其内容之丰富远超本书逐字收录的范围。\n\n从以下页面开始，逐一阅读，获取更多有用的\
  \ UI 优化技巧：`https://unity3d.com/learn/tutorials/temas/best-practices/guide-optimizing-unity-ui`。\n\
  \n# Shader 优化\n\n片元着色器是填充率和内存带宽的主要消耗者。成本取决于其复杂度——进行多少纹理采样，使用多少数学函数，以及更多因素。GPU 的并行特性（在数百个线程之间共享整体工作的小片段）意味着，线程中的任何瓶颈都会限制在一帧内能通过该线程推送的片元数量。\n\
  \n经典的类比是车辆装配线。一辆完整的车辆需要多个制造阶段才能完成。完成的关键路径可能涉及冲压、焊接、喷漆、组装和检验，每个步骤由一个团队完成。对于任何给定的车辆，在前一阶段完成之前，任何阶段都不能开始，但处理上一辆车辆冲压的团队可以在完成后立即开始为下一辆车辆进行冲压。这种组织方式让每个团队成为其特定领域的专家，而不是试图将知识分散得太薄，这可能会导致车辆批次质量不一致。\n\
  \n我们可以通过将团队数量翻倍来翻倍总产量，但如果任何团队被阻塞，那么对于任何给定的车辆以及所有未来将通过同一团队的车辆，宝贵的时间都会损失。如果这些延迟很少发生，那么在整体上可以忽略不计，但如果不是这样，即使某个阶段每次完成任务都比正常时间长几分钟，也可能成为威胁整个批次发布的瓶颈。\n\
  \nGPU 并行处理器的工作方式类似：每个处理器线程是一条装配线，每个处理阶段是一个团队，每个片元是需要构建的东西。如果线程在处理单个阶段时花费很长时间，那么每个片元都会损失时间。这种延迟会乘积，使得所有未来通过同一线程的片元都会被延迟。这有点过于简化，但它通常有助于描绘一幅图景，说明一些编写不良的\
  \ Shader 代码如何迅速消耗我们的填充率，以及 Shader 优化中的小改进如何在后端性能方面带来巨大好处。\n\nShader 编程和优化是游戏开发中一个非常小众的领域。其抽象且高度专业化的性质需要与典型的游戏玩法或引擎代码非常不同的思维方式来生成高质量的\
  \ Shader 代码。它们通常包含数学技巧和后门机制，用于将数据拉入 Shader 中，例如预计算值并将其放入纹理文件。由于这一点以及优化的重要性，着色器往往非常难以阅读和逆向工程。\n\
  \n因此，许多开发者依赖于预写的着色器、来自资源商店的可视化着色器创建工具，例如 Shader Forge 或 Amplify Shader Editor。这简化了初始着色器代码生成的过程，但可能不会产生最高效的着色器形式。无论我们是编写自己的着色器，还是依赖预写/预生成的着色器，我们可能会发现使用一些经过验证的技术对其进行一些优化遍是有价值的。\n\
  \n## 考虑使用面向移动平台的着色器\n\nUnity 中内置的移动着色器没有任何特定限制强制它们仅在移动设备上使用。它们只是针对最小资源使用进行了优化（并且往往包含本节中列出的其他一些优化）。\n\
  \n桌面应用程序完全能够使用这些着色器，但它们往往会导致图形质量下降。这只成为图形质量下降是否可接受的问题。因此，考虑对常见着色器的移动等效项进行一些测试，以检查它们是否适合您的游戏。\n\
  \n## 使用小数据类型\n\nGPU 计算较小的数据类型比较大的类型更快（特别是在移动平台上），因此我们可以尝试的第一个调整是将我们的 `float` 数据类型（32\
  \ 位浮点数）替换为较小的版本，例如 `half`（16 位浮点数）甚至 `fixed`（12 位定点数）。先前列出的数据类型大小将根据目标平台偏好的浮点格式而有所不同。列出的大小是最常见的。优化来自于格式之间的相对大小，因为需要处理的位数更少。\n\
  \n颜色值是精度降低的良好候选者，因为我们通常可以使用不太精确的颜色值而不会对颜色造成太多明显损失。然而，对于图形计算，降低精度的影响可能非常不可预测。因此，此类更改可能需要一些测试来验证降低的精度是否损失了过多的图形保真度。\n\
  \n> 请注意，这些调整的效果在不同 GPU 架构之间可能有很大差异（例如 AMD 与 Nvidia 与 Intel），甚至在同一制造商的不同 GPU 品牌之间也是如此。在某些情况下，我们可以付出微小努力就获得相当不错的性能提升。在其他情况下，我们可能根本看不到任何好处。\n\
  \n# 避免在 swizzling 时更改精度\n\nSwizzling 是着色器编程技术，通过列出组件以我们希望将其复制到新结构中的顺序，从现有的 `vector`（值数组）创建新的\
  \ `vector`。\n\n以下是一些 swizzling 示例：\n\n```\nfloat4 input = float4(1.0, 2.0, 3.0,\
  \ 4.0); // initial test value (x, y, z, w)\n\n// swizzle two components\nfloat2\
  \ val1 = input.yz; // val1 = (2.0, 3.0)\n\n// swizzle three components in a different\
  \ order\nfloat3 val2 = input.zyx; // val2 = (3.0, 2.0, 1.0)\n\n// swizzle the same\
  \ component multiple times\nfloat4 val3 = input.yyy; // val3 = (2.0, 2.0, 2.0)\n\
  \n// swizzle a scalar multiple times\nfloat sclr = input.w; // sclr = (4.0)\nfloat3\
  \ val4 = sclr.xxx; // val4 = (4.0, 4.0, 4.0)\n```\n\n我们可以同时使用 `xyzw` 和 `rgba` 表示法来引用相同的组件，按顺序排列。无论它是\
  \ `color` 还是 `vector` 都无关紧要；它们只是让着色器代码更易读。我们还可以按任何喜欢的顺序列出组件以填充所需数据，必要时可重复使用。\n\n\
  在着色器中将一种精度类型转换为另一种可能是一项代价高昂的操作，但在同时进行 swizzling 时转换精度类型可能尤其痛苦。如果我们有使用 swizzling\
  \ 的数学运算，请确保它们不同时转换精度类型。在这些情况下，最好从一开始就直接使用高精度数据类型，或者全面降低精度以避免精度变化的需求。\n\n# 使用 GPU\
  \ 优化的辅助函数\n\n着色器编译器通常能很好地将数学计算减少为 GPU 的优化版本，但编译后的自定义代码不太可能与 Cg 库的内置辅助函数以及 Unity\
  \ Cg 包含文件提供的其他辅助函数一样有效。如果我们使用包含自定义函数代码的着色器，也许可以在 Cg 或 Unity 库中找到等效的辅助函数，其效果优于我们的自定义代码。\n\
  \n\n\n\n\n这些额外的 `include` 文件可以添加到我们的 Shader 中的 `CGPROGRAM` 块，如下所示：\n```\nCGPROGRAM\n\
  // other includes\n#include \"UnityCG.cginc\"\n// Shader code here\nENDCG\n```\n\
  \n可使用的 Cg 库函数示例包括用于求绝对值的 `abs()`、用于线性插值的 `lerp()`、用于矩阵乘法的 `mul()`，以及用于阶跃功能的 `step()`。有用的\
  \ `UnityCG.cginc` 函数包括用于计算朝向相机方向的 `WorldSpaceViewDir()` 和用于将颜色转换为灰度的 `Luminance()`。\n\
  \n请查看 http://http.developer.nvidia.com/CgTutorial/cg_tutorial_appendix_e.html 以获取\
  \ Cg 标准库函数的完整列表。\n\n请查看 Unity 文档，获取可能的 `include` 文件及其伴随辅助函数的完整且最新列表，网址为 http://docs.unity3d.com/Manual/SL-BuiltinIncludes.html。\n\
  \n# 禁用不必要的功能\n\n也许我们可以通过简单禁用非关键的 Shader 功能来节省开销。该 Shader 真的需要透明度、Z 写入、Alpha 测试和/或\
  \ Alpha 混合吗？调整这些设置或移除这些功能是否能在不损失太多图形保真度的情况下，获得我们想要效果的良好近似？做出此类更改是节省 Fill Rate 开销的好方法。\n\
  \n# 移除不必要的输入数据\n\n有时，编写 Shader 的过程涉及大量的来回实验，即修改代码并在场景中查看效果。此过程的典型结果是，在 Shader 早期开发阶段所需的输入数据，一旦获得所需效果后就变成了多余的冗余数据，而且如果过程拖得很久，很容易忘记做了哪些更改。然而，这些冗余数据值会让\
  \ GPU 浪费宝贵时间，因为即使 Shader 没有显式使用它们，它们也必须从内存中获取。因此，我们应该仔细检查 Shader，确保其所有输入几何、顶点和片元数据实际上都被使用了。\n\
  \n# 仅暴露必要的变量\n\n将不必要的变量从 Shader 暴露给伴随的 Material 可能会很昂贵，因为 GPU 不能假设这些值是常量，这意味着编译器无法将这些值编译掉。由于这些值可以随时通过\
  \ Material 对象的方法（如 `SetColor()` 和 `SetFloat()`）进行修改，因此每个 pass 都必须从 CPU 推送这些数据。如果我们发现，在项目后期，这些变量始终使用相同的值，那么应该将它们替换为\
  \ Shader 中的常量，以消除这种多余的运行时工作量。唯一的代价是模糊可能至关重要的图形效果参数，因此这应该在流程非常晚期才进行。\n\n# 降低数学复杂度\n\
  \n复杂的数学计算会严重瓶颈化渲染过程，因此我们应该尽可能限制损害。完全可以通过预先计算复杂数学函数输出并将其作为浮点数据放入纹理文件中，来存储一个复杂数学函数输出的映射。毕竟，纹理文件只是一个巨大的浮点值集合，可以通过三个维度（x、y\
  \ 和颜色 rgba）快速索引。我们可以将此纹理输入到 Shader 中，并在运行时在 Shader 中采样预生成的表，而不是在运行时完成复杂计算。\n\n对于\
  \ `sin()` 和 `cos()` 等函数，我们可能看不到任何改进，因为它们已被大量优化以利用 GPU 架构，但 `pow()`、`exp()`、`log()`\
  \ 等复杂方法以及我们自己的自定义数学计算只能优化有限，是简化的良好候选者。这假设我们可以轻松地使用 x 和 y 坐标从纹理中索引结果。如果生成这些坐标需要复杂计算，那么可能不值得付出努力。\n\
  \n此技术将花费额外的图形内存来在运行时存储纹理，并消耗一些内存带宽，但如果 Shader 已经在接收纹理（在大多数情况下确实如此），但 alpha 通道未被使用，那么我们可以通过纹理的\
  \ alpha 通道偷偷传入数据，这几乎不会带来性能损失，因为该数据无论如何已经被传递过了。这涉及手动编辑我们的美术资产以在任何未使用的颜色通道中包含此类数据，可能需要程序员和美术人员之间的协调，但这是在没有运行时牺牲的情况下节省\
  \ Shader 处理开销的非常好的方法。\n\n# 减少纹理采样\n\n纹理采样是所有内存带宽开销的核心。我们使用的纹理越少，且尺寸越小，效果越好。使用的越多，越可能触发缓存未命中，且尺寸越大，将其传输到纹理缓存所消耗的内存带宽就越多。应尽可能简化此类情况，以避免严重的\
  \ GPU 瓶颈。\n\n更糟糕的是，以非顺序方式采样纹理可能会导致 GPU 遭受非常昂贵的缓存未命中。因此，如果正在这样做，则应重新排序纹理，以便可以按更顺序的方式进行采样。例如，如果我们通过反转\
  \ x 和 y 坐标进行采样（例如，tex2D (y, x) 而不是 tex2D (x, y)），纹理查找将垂直遍历纹理，然后水平遍历，几乎每次迭代都会触发缓存未命中。只需简单地旋转纹理文件数据并按正确顺序（tex2D\
  \ (x, y)）执行采样，就可以节省大量性能。\n\n# 避免条件语句\n\n当条件语句在现代 CPU 上运行时，会经历大量巧妙的预测技术，以利用指令级并行性。这是一项功能，CPU\
  \ 会在条件语句实际解析之前尝试预测其方向，并使用任何未用于解析条件的空闲核心，对条件最可能的结果进行投机性处理（从内存获取一些数据，将一些浮点值复制到未使用的寄存器中，等等）。如果决策结果错误，则当前结果被丢弃，改为采取正确路径。只要投机处理和丢弃错误结果的成本小于等待决定正确路径所花费的时间，且正确次数多于错误次数，这对\
  \ CPU 速度来说就是净收益。\n\n然而，由于 GPU 架构的并行性，此功能对 GPU 来说不那么有益。GPU 的核心通常由某个更高级别的构造管理，该构造指示其指挥下的所有核心同时执行相同的机器码级指令，就像一台巨大的冲压机一次同时冲压一组金属板一样。因此，如果片元\
  \ Shader 要求将一个浮点数乘以 2，则过程将首先由所有核心在一个协调步骤中将数据复制到适当的寄存器。只有当所有核心都完成复制到寄存器后，核心才会被指示开始第二步：在第二个同时动作中将所有寄存器乘以\
  \ 2。\n\n因此，当此系统遇到条件语句时，它无法独立解析两个语句。它必须确定有多少子核心将走条件的每条路径，获取一条路径所需的机器码指令列表，为走该路径的所有核心解析它们，并对每条路径重复这些步骤，直到所有可能的路径都被处理。因此，对于\
  \ if-else 语句（两种可能性），它会告诉一组核心处理真路径，然后要求剩余核心处理假路径。除非每个核心都走相同的路径，否则它每次都必须处理两条路径。\n\n\
  因此，我们应该避免在 Shader 代码中使用分支和条件语句。当然，这取决于条件对于实现我们想要的图形效果是多么关键。然而，如果条件不依赖于每像素的行为，那么我们通常最好承受不必要数学计算的开销，而不是给\
  \ GPU 带来分支开销。\n\n# 减少数据依赖\n\n编译器会尽力将我们的 Shader 代码优化为更适合 GPU 的低级语言，以便它不必等待数据获取，而可以处理其他任务。例如，以下优化不佳的代码可能会写在我们的\
  \ Shader 中：\n\n```\nfloat sum = input.color1.r;\nsum = sum + input.color2.g;\nsum\
  \ = sum + input.color3.b;\nsum = sum + input.color4.a;\nfloat result = calculateSomething(sum);\n\
  ```\n\n此代码存在数据依赖，即每个计算都必须等待上一个计算完成，因为依赖于 sum 变量。然而，此类情况通常会被 Shader 编译器检测到，并优化为使用指令级并行性的版本。以下代码是前一段代码编译后生成的机器码的高级代码等价物：\n\
  \n```\nfloat sum1, sum2, sum3, sum4;\nsum1 = input.color1.r;\nsum2 = input.color2.g;\n\
  sum3 = input.color3.b;\nsum4 = input.color4.a;\nfloat sum = sum1 + sum2 + sum3 +\
  \ sum4;\nfloat result = CalculateSomething(sum);\n```\n\n\n\n\n\n在这种情况下，编译器会认识到它可以并行从内存中获取四个值，并在四个值都通过线程级并行独立获取完成后完成求和。与依次执行四次获取相比，这可以节省大量时间。\n\
  \n但是，无法被编译器消除的长数据依赖链绝对会严重损害 Shader 性能。如果我们在 Shader 的源代码中创建了强数据依赖，那么它就没有任何优化空间。例如，以下数据依赖会对性能造成严重影响，因为一个步骤在没有等待另一个步骤获取数据的情况下无法完成，因为采样每个纹理都需要先采样另一个纹理，且编译器不能假设在此期间数据没有发生变化。\n\
  \n以下代码表示指令之间存在非常强的数据依赖，因为每个指令都依赖于从上一条指令中采样的纹理数据：\n\n```c\nfloat4 val1 = tex2D(_tex1,\
  \ input.texcoord.xy);\nfloat4 val2 = tex2D(_tex2, val1.yz); // requires data from\
  \ _tex1\nfloat4 val3 = tex2D(_tex3, val2.zw); // requires data from _tex2\n```\n\
  \n应尽可能避免这种强数据依赖。\n\n# Surface Shaders\n\nUnity 的 Surface Shaders 是 Fragment Shaders\
  \ 的一种简化形式，使 Unity 开发者能够以更简化的方式掌握 Shader 编程。Unity 引擎会为我们转换 Surface Shader 代码，抽象掉我们刚刚介绍的一些优化机会。但是，它确实提供了一些可用作替代的杂项值，这些值会降低精度，但简化了生成代码中的数学运算。Surface\
  \ Shaders 旨在相对高效地处理一般情况，但最佳优化是通过编写自己的 Shader 来实现个人化的优化。\n\n`approxview` 属性会近似视图方向，节省昂贵的操作。`halfasview`\
  \ 属性会降低视图向量的精度，但要注意其对涉及多种精度类型的数学运算的影响。`noforwardadd` 属性会将 Shader 限制为仅考虑一个方向光，减少\
  \ Draw Calls，因为 Shader 将仅在单个通道中渲染，并降低光照复杂度。最后，`noambient` 属性会禁用 Shader 中的环境光，移除一些我们可能不需要的额外数学运算。\n\
  \n# 使用基于 Shader 的 LOD\n\n我们可以强制 Unity 使用更简单的 Shader 渲染远处的物体，这可以是节省填充率的有效方法，特别是如果我们要将游戏部署到多个平台或支持广泛的硬件功能。`LOD`\
  \ 关键字可用于 Shader 中，以设置 Shader 支持的屏幕尺寸因子。如果当前 LOD 级别与此值不匹配，它将回退到下一个备用 Shader，依此类推，直到找到支持给定尺寸因子的\
  \ Shader。我们还可以在运行时使用 `maximumLOD` 属性更改给定 Shader 对象的 LOD 值。\n\n此功能与前面介绍的基于网格的 LOD\
  \ 类似，并使用相同的 LOD 值来确定物体形状因子，因此应相应配置。\n\n有关基于 Shader 的 LOD 的更多信息，请查看 Unity 文档中的 `https://docs.unity3d.com/Manual/SL-ShaderLOD.html`。\n\
  \n# 使用更少的纹理数据\n\n这种方法简单、直接，并且始终值得考虑。降低纹理质量（无论是通过分辨率还是比特率）对图形质量并非理想，但我们有时可以使用 16\
  \ 位纹理而不会出现任何明显的质量下降。\n\nMip Maps（在 `Chapter 4, Kickstart Your Art` 中介绍）是减少在 VRAM\
  \ 和纹理缓存之间来回推送的纹理数据量的另一种绝佳方法。请注意，**Scene** 窗口有一个 **Mipmaps** 着色模式，它会根据当前纹理比例是否适合当前\
  \ **Scene** 窗口的相机位置和方向，将场景中的纹理高亮显示为蓝色或红色。这将有助于识别哪些纹理是进一步优化的良好候选项。\n\n# 测试不同的 GPU\
  \ 纹理压缩格式\n\n如你在 `Chapter 4, Kickstart Your Art` 中所学，有不同的纹理压缩格式，可以减少应用程序的磁盘占用（可执行文件大小）、运行时\
  \ CPU 和 RAM 使用量。这些压缩格式旨在支持给定平台的 GPU 架构。有多种不同的格式，例如 DXT、PVRTC、ETC 和 ASTC，但只有少数几种在给定平台上可用。\n\
  \n默认情况下，Unity 将根据纹理文件的 **Compression** 设置选择最佳压缩格式。如果我们深入研究给定纹理文件的平台特定选项，则会提供不同的压缩类型选项，列出给定平台支持的不同纹理格式。我们可能能够通过替换压缩的默认选择来找到一些空间或性能节省。\n\
  \n但是，请注意，如果我们到了需要单独调整纹理压缩技术的地步，那么希望我们已经耗尽了所有减少内存带宽的其他选择。走这条路，我们将承诺以各自特定的方式支持许多不同的设备。许多开发者更倾向于使用通用解决方案来保持简单，而不是为了微小的性能提升而进行个性化定制和耗时的手工操作。\n\
  \n有关所有不同纹理格式及其 Unity 默认偏好的格式的概述，请查看 Unity 文档 `https://docs.unity3d.com/ Manual/class-TextureImporterOverride.html`。\n\
  \n在旧版 Unity 中，所有格式都针对 **Advanced** 纹理类型公开，但如果平台不支持给定类型，则会在软件级别处理。换句话说，CPU 需要停下来将纹理重新压缩为\
  \ GPU 所需的格式，而不是由 GPU 使用专用硬件芯片来处理。Unity Technologies 决定在较新版本中移除此功能，以免我们意外引起这些问题。\n\
  \n# 最小化纹理交换\n\n这一点相当直接。如果内存带宽是问题，那么我们需要减少正在进行的纹理采样量。这里没有什么特殊的技巧可利用，因为内存带宽完全关乎吞吐量，因此主要考虑的指标是我们推送的数据量。\n\
  \n减少数据量的一种方法是简单地降低纹理分辨率，从而降低质量。这显然不是理想的选择，因此另一种方法是找到巧妙的方法在不同网格上重复使用纹理，但使用不同的 Material\
  \ 和 Shader 属性。例如，一个适当变暗的砖块纹理可能看起来像石墙。当然，这将需要不同的 Render State，因此我们不会节省 Draw Calls，但可能会减少内存带宽消耗。\n\
  \n![](img/da79484c9b30dc915216dbc5454a9bbf_253_0.png)\n\n你是否曾经注意到《超级马里奥兄弟》中的云和灌木看起来完全一样，只是颜色不同？这就是同样的概念。\n\
  \n也可以将纹理合并到 Atlas 中，以减少所需的交换次数。如果有一组纹理总是在类似的时间一起使用，那么它们可能可以合并在一起。这可以避免 GPU 在同一帧中反复加载单独的纹理文件。\n\
  \n最后，完全从应用程序中删除纹理始终是我们可以采用的最后手段。\n\n# VRAM 限制\n\n与纹理相关的最后一个考虑因素是我们可用的 VRAM 量。大多数从\
  \ CPU 到 GPU 的纹理传输发生在初始化期间，但也可能发生在当前视图首次需要不存在的纹理时。此过程通常是异步的，并会导致使用空白纹理，直到完整纹理准备好进行渲染（请参阅\
  \ Chapter 4, Kickstart Your Art，注意这假设纹理的读/写访问已禁用）。因此，我们应该避免在运行时过于频繁地引入新纹理。\n\n#\
  \ 使用隐藏 GameObject 预加载纹理\n\n异步纹理加载期间使用的空白纹理在游戏质量方面可能令人不悦。我们希望有一种方法来控制并强制纹理在实际需要之前从磁盘加载到\
  \ RAM，然后再加载到 VRAM。\n\n一种常见的解决方法是创建一个使用纹理的隐藏 GameObject，并将其放置在场景中玩家前往实际需要该纹理的区域的路径上。一旦玩家查看该对象，渲染管道就需要该纹理（即使它在技术上是隐藏的），它将开始将数据从\
  \ RAM 复制到 VRAM 的过程。这有点笨拙，但易于实现，并且在大多数情况下效果足够好。\n\n\n\n\n\n# 避免纹理颠簸\n\n我们也可以通过脚本代码来控制此类行为，方法是更改\
  \ Material 的 `texture` 属性：\n\n`GetComponent<Renderer>().material.texture = textureToPreload;`\n\
  \n在极少数情况下，如果加载到 VRAM 中的纹理数据过多，且所需纹理不存在，GPU 将需要从 RAM 请求该纹理，并覆盖一个或多个现有纹理以腾出空间。随着内存碎片化，这种情况可能会随时间恶化，并且存在刚从\
  \ VRAM 中刷新的纹理需要在同一帧内再次拉取的风险。这将导致严重的内存 _thrashing_，应不惜一切代价避免。\n\n对于 PS4、Xbox One\
  \ 和 WiiU 等现代主机来说，这不太令人担忧，因为它们为 CPU 和 GPU 共享一个通用内存空间。鉴于设备始终运行单个应用程序，并且几乎总是渲染 3D 图形，这种设计是一种硬件级优化。然而，大多数其他平台必须与多个应用程序共享时间和空间，其中\
  \ GPU 只是一个可选设备，并不总是存在。因此，它们为 CPU 和 GPU 提供了独立的内存空间，我们必须确保任何给定时刻的总纹理使用量保持在目标硬件可用 VRAM\
  \ 以下。\n\n请注意，这种 _thrashing_ 与硬盘颠簸并不完全相同，硬盘颠簸是指内存与虚拟内存（交换文件）之间来回复制内存，但两者是类似的。在任何一种情况下，数据都在两个内存区域之间不必要地来回复制，因为在太短的时间内请求了太多数据，导致较小的内存区域无法容纳所有数据。\n\
  \n> 当游戏从现代主机移植到桌面平台时，这种颠簸可能是导致渲染性能糟糕的常见原因，应谨慎对待。\n\n避免此行为可能需要针对每个平台和每个设备自定义纹理质量和文件大小。请注意，如果我们处理的是同一代主机或桌面\
  \ GPU 的硬件，一些玩家可能会注意到这些不一致之处。正如我们许多人所知，即使是硬件上的微小差异也可能导致大量的“苹果与橘子”比较，但硬核玩家往往期望在整体上获得相似的质量水平。\n\
  \n# 光照优化\n\n我们在本章前面介绍了光照行为的理论，因此让我们快速了解一些可以用来降低光照开销的技术。\n\n# 负责任地使用实时阴影\n\n如前所述，阴影很容易成为\
  \ Draw Calls 和 Fill Rate 的最大消耗者之一，因此我们应该花时间调整这些设置，直到获得所需的性能和/或图形质量。在 Edit | Project\
  \ Settings | Quality | Shadows 下可以找到多个重要的阴影设置。就 Shadows 选项而言，Soft Shadows 代价高昂，Hard\
  \ Shadows 代价低廉，No Shadows 则是免费的。Shadow Resolution、Shadow Projection、Shadow Distance\
  \ 和 Shadow Cascades 也是重要设置，会影响我们阴影的性能。\n\nShadow Distance 是运行时阴影渲染的全局乘数。在距离摄像机很远的地方渲染阴影意义不大，因此此设置应根据我们的游戏以及预期在游戏过程中目睹多少阴影来配置。它也是常见的设置，会在选项屏幕中暴露给用户，以便他们可以选择渲染阴影的距离，使游戏性能与其硬件相匹配（至少在桌面机上）。\n\
  \nShadow Resolution 和 Shadow Cascades 的较高值会增加我们的内存带宽和 Fill Rate 消耗。这两个设置都可以帮助抑制阴影渲染产生的伪影，但代价是更大的\
  \ Shadowmap 纹理大小，增加了内存带宽和 VRAM 的消耗。\n\n![](img/da79484c9b30dc915216dbc5454a9bbf_255_0.png)\n\
  \nUnity 文档在 http://docs.unity3d.com/Manual/DirLightShadows.html 上对 Shadowmaps 的混叠效应以及\
  \ Shadow Cascades 功能如何帮助解决该问题进行了出色的总结。\n\n值得注意的是，Soft Shadows 相对于 Hard Shadows 不会消耗更多内存或\
  \ CPU 开销，因为唯一的区别是一个更复杂的 Shader。这意味着拥有足够 Fill Rate 的应用程序可以享受 Soft Shadows 带来的更高图形保真度。\n\
  \n# 使用剔除掩码\n\n`Light` 组件的 **Culling Mask** 属性是一个基于图层的掩码，可用于限制给定光照将影响的对象。这是减少光照开销的有效方法，前提是图层交互也符合我们使用图层进行物理优化的方式。对象只能属于一个图层，减少物理开销在大多数情况下可能比减少光照开销更重要；因此，如果存在冲突，这可能不是理想的方法。\n\
  \n> 请注意，在使用延迟着色时，对剔除掩码的支持有限。由于它以非常全局的方式处理光照，因此只能从掩码中禁用四个图层，限制了我们优化其行为的能力。\n\n# 使用烘焙光照贴图\n\
  \n将光照和阴影烘焙到场景中，比在运行时生成它们要省处理器资源得多。缺点是增加了应用程序磁盘占用、内存消耗以及内存带宽滥用的潜在风险。最终，除非游戏的光照效果完全通过旧版顶点光照着色格式或通过单个\
  \ `DirectionalLight` 处理，否则它可能应该在某处包含光照贴图，以在光照计算上节省大量预算。完全依赖实时光照和阴影是灾难的配方，因为它们可能带来的性能开销。\n\
  \n然而，有几个指标会影响光照贴图的成本，例如分辨率、压缩、是否使用预计算实时全局光照，当然还有场景中对象的数量。光照贴图生成器会生成涵盖场景中所有标记为 **Lightmap\
  \ Static** 的对象的纹理，因此对象越多，就需要为它们生成更多的纹理数据。这是一个使用加法或减法场景加载的机会，以尽量减少每帧需要处理的对象数量。当然，当加载多个场景时，这会带入更多光照贴图数据，因此我们每次发生这种情况时都应该预期内存消耗会大幅增加，直到旧场景卸载后才会释放。\n\
  \n# 优化移动设备的渲染性能\n\nUnity 能够部署到移动设备，极大地促进了其在爱好者、小型和中型开发团队中的流行。因此，有必要介绍一些对移动平台比桌面和其他设备更有益的方法。\n\
  \n请注意，以下任何或所有方法最终都可能变得过时，至少对于较新的设备而言。移动设备的性能发展迅速，以下适用于移动设备的技术仅反映了过去半个多世纪的传统智慧。我们应该测试这些方法背后的假设，以检查移动设备的限制是否仍然符合移动市场。\n\
  \n# 避免 Alpha 测试\n\n移动 GPU 尚未达到与桌面 GPU 相同的芯片优化水平，Alpha 测试在移动设备上仍然是一项特别昂贵的任务。在大多数情况下，应简单地避免使用它，而改用\
  \ Alpha 混合。\n\n# 最小化 Draw Calls\n\n移动应用程序更经常在 Draw Calls 而非 Fill Rate 上成为瓶颈。这并不是说可以忽略\
  \ Fill Rate 的问题（任何事情都不应忽略！），但这使得任何合理质量的移动应用程序几乎有必要从一开始就实现网格合并、批处理和图集技术。延迟渲染也是首选技术，因为它与其他移动特定问题（如避免透明度和拥有太多动画角色）非常契合，但当然并非所有移动设备和图形\
  \ API 都支持它。\n\n查看 Unity 文档，了解有关哪些平台/API 支持延迟着色的更多信息，网址为 `https://docs.unity3d.com/Manual/RenderingPaths.html`。\n\
  \n\n\n\n\n# 最小化材质数量\n\n此问题与批处理（Batching）和图集（Atlasing）的概念密切相关。我们使用的材质越少，所需的绘制调用（Draw\
  \ Calls）就越少。此策略还将有助于解决与显存（VRAM）和内存带宽（Memory Bandwidth）相关的问题，而这些资源在移动设备上通常非常有限。\n\
  \n# 最小化纹理大小\n\n大多数移动设备的纹理缓存（Texture Cache）相对于桌面 GPU 来说非常小。市面上仍然支持 OpenGL ES 1.1\
  \ 或更低版本的设备非常少，例如 iPhone 3G，但这些设备只能支持最大 1024 x 1024 的纹理尺寸。支持 OpenGLES 2.0 的设备，例如从\
  \ iPhone 3GS 到 iPhone 6S 的所有设备，可以支持最大 2048 x 2048 的纹理。最后，支持 OpenGLES 3.0 或更高版本的设备，例如运行\
  \ iOS 7 的设备，可以支持最大 4096 x 4096 的纹理。\n\n> Android 设备太多，无法在此一一列出，但 Android 开发者门户提供了\
  \ OpenGLES 设备支持的便捷明细。此信息会定期更新，以帮助开发者确定 Android 市场中受支持的 API，网址为 `https://developer.android.com/about/dashboards/index.html`\n\
  \n再次检查我们要针对的设备硬件，以确保其支持我们希望使用的纹理文件大小。但是，后一代设备在移动市场中从来都不是最常见的设备。如果我们希望游戏能触达广泛的受众（增加其成功的机会），那么我们就必须愿意支持性能较弱的硬件。\n\
  \n请注意，对于 GPU 来说过大的纹理会在初始化期间被 CPU 缩小。这会浪费宝贵的加载时间，并且会导致由于分辨率不受控制的降低而产生意外的质量损失。由于移动设备可用的显存（VRAM）和纹理缓存（Texture\
  \ Cache）尺寸有限，因此纹理复用至关重要。\n\n# 使纹理为正方形且为二的幂次方\n\n我们在第四章“启动你的艺术”中已经讨论过这个话题，但有必要重新审视\
  \ GPU 级别纹理压缩这一主题。如果纹理不是正方形格式，GPU 会发现很难，或者根本无法压缩该纹理，因此请确保遵循常见的开发惯例，保持正方形且尺寸为二的幂次方。\n\
  \n# 在着色器中使用尽可能低的精度格式\n\n移动 GPU 对其着色器中的精度格式特别敏感，因此应使用最小的格式，例如 half。同样，出于同样的原因，应不惜一切代价避免精度格式转换。\n\
  \n# 总结\n\n如果你没有跳过前面的内容就读到这里，那么恭喜你。对于 Unity 引擎的一个子系统来说，这已经是大量需要吸收的信息了，但它显然是其中最复杂的一个，需要相应深度的解释。希望你已经学到了许多方法来帮助提高渲染性能，并了解了足够多的渲染管线知识，以便知道如何负责任地使用它们。\n\
  \n到目前为止，我们应该已经习惯了这样一个观念：除了算法改进之外，我们实现的每一项性能增强都会带来一些相关成本，我们必须愿意承担这些成本，以消除一个瓶颈。我们应该随时准备实施多种技术，直到消除所有瓶颈，并可能花费大量额外的开发时间来实现和测试一些性能增强功能。\n\
  \n在下一章中，让我们通过探索可以应用于虚拟现实和增强现实项目的一些性能改进，将性能优化带入现代时代。\n"
- '# 虚拟速度与增强加速


  两种全新的娱乐媒介已经以 **虚拟现实**（VR，用户通过使用 **头戴式设备**（HMD）被传送到虚拟空间）和 **增强现实**（AR，虚拟元素被叠加在显示现实世界的显示器之上）的形式登上世界舞台。为简洁起见，这两个术语通常合并为单一术语
  **XR**。还有 **混合现实**（MR，也称为 **混合现实** 或 **HR**），其中应用程序将现实世界和虚拟世界混合在一起，涵盖了之前提到的所有格式，同时还包括
  **增强虚拟性**，其中现实世界的对象被扫描并叠加到大部分虚拟世界中。


  这些媒体格式的市场迅速兴起并继续快速增长，得到了科技行业巨头的巨额投资。自然，Unity 等游戏引擎迅速跟风，为大多数顶尖竞争平台提供了充足的支持，例如 Google
  的 Cardboard、HTC 的 Vive、Oculus 的 Rift、Microsoft 的 HoloLens 和 Samsung 的 GearVR 平台，以及更近期的进入者，例如
  Apple 的 ARKit、Google 的 AR Core、Microsoft 的 Windows Mixed Reality 平台、PTC（最初是 Qualcomm
  的）Vuforia，以及 Sony 的 PlayStation VR。


  XR 为开发者和创意人员提供了一个全新的探索领域。这包括游戏和 360 度视频（或简称 _360 视频_）等娱乐产品，其中一系列摄像机被捆绑在一起，每个朝向不同的方向——这些摄像机捕获的内容被缝合在一起，随后作为电影在
  VR 头显中播放，可在所有方向观看。创意行业工具在 XR 中也很常见，例如 3D 建模软件、工作流程可视化和生活质量小工具。很少有规则被定下来，因此有大量机会进行创新，为这股新技术浪潮做出贡献，并成为制定这些规则的人。这引起了大量的热议和兴奋，人们正在探索可能性，并试图在娱乐和交互体验的未来留下自己的印记。


  当然，几乎每一种新兴和初创技术都会经历炒作周期（来自 Gartner 炒作周期，网址为 `https://www.gartner.com/technology/research/
  methodologies/hype-cycle.jsp`）。炒作周期始于过度炒作的蜜月期，早期采用者会宣扬其优点。后来，当它进入 _幻灭低谷_ 时，情绪最终会冷却，因为它尚未进入主流，其优点尚未显现。这将持续下去，直到技术要么无法赢得人心而消失，要么牢固立足并继续稳步采用。下图展示了
  Gartner 炒作周期的要点：


  ![](img/da79484c9b30dc915216dbc5454a9bbf_261_0.png）


  可以说，XR 最近正在经历这个最终阶段，并开始享受比早期好得多的支持和更高质量的体验，尽管 XR 的采用率确实比最初预测的要慢。XR 是否会成长为一个数十亿美元的产业，还是会沦为小工具的利基市场，还有待观察。因此，在这个新媒介中开发并非没有风险，我们可以找到行业分析师，无论我们对
  XR 的未来持何种立场，他们都会同意我们的观点。但是，有一点是肯定的，那就是每次有人亲身体验 VR 和 AR 的功能时，都会被沉浸感和媒介令人信服地将他们传送到另一个世界的能力所震撼。这种沉浸感和交互性是无与伦比的，并且随着平台支持的成熟和技术的不断进步，预示着更多的可能性。


  在本章中，我们将探讨以下主题：


  - 在 Unity 中开发 VR 或 AR 项目时需要牢记的问题以及必须避免的问题

  - 特定于 XR 媒介的性能增强


  # XR 开发


  在 Unity 中开发 XR 产品涉及将几个 XR **软件开发工具包（SDK）** 之一导入我们的 Unity 项目，并进行一些专门的 API 调用以在运行时配置和使用平台。每个
  SDK 都有其自身的不同之处，并提供不同的功能集。例如，Oculus Rift 和 HTC Vive SDK 提供用于控制 VR HMD 及其各自控制器的 API，而
  Apple 的 ARKit 提供用于确定空间定位并将对象叠加到显示器上的实用程序。Unity 技术一直在努力创建支持所有这些变体的 API，因此过去几年中 Unity
  中 XR 开发的 API 发生了很大变化。


  Unity VR 开发的早期意味着将原生插件放入我们的 Unity 项目，直接从外部开发者门户导入 SDK，并在设置中进行各种烦人的琐碎工作，并手动应用更新。然而，从那以后，Unity
  已经将其中几个 SDK 直接集成到编辑器中。此外，由于 AR 最近变得更加流行，主 API 在 Unity 2017.2.0 及更高版本中已从 `UnityEngine.VR`
  重命名为 `UnityEngine.XR`，以便涵盖多个 AR SDK。导入各种 XR SDK 并对其进行配置可以通过 **编辑 | 项目设置 | 项目 | XR
  设置** 区域进行管理。






  目前，开发 XR 产品的体验可以说是喜忧参半。这涉及使用一些顶尖的硬件和软件，这意味着不断存在变更、重新设计、故障、补丁、错误、崩溃、兼容性问题、性能问题、渲染伪影、平台间功能不一致等等。所有这些问题都会拖慢我们的进度，使得在
  XR 领域获得竞争优势变得异常困难。幸运的是，几乎所有人都面临着相同的问题，因此这些问题得到了开发者的大量关注，使得开发过程随着时间的推移变得更加容易。我们吸取了教训；API
  得到了清理；并且随着每一次更新，新功能、工具和优化都会推出。


  由于当前媒介的状态，性能问题对 XR 产品的成功限制可能比非 XR 项目更大。首先，我们的用户会花费大量资金购买 VR HMD 和传感器设备，或者具备 AR 功能的硬件。这两个平台都可能非常耗费资源，需要同样昂贵的图形硬件来支持。这通常会导致用户期望比典型游戏高得多的质量水平，以使投资感觉值得，或者换句话说，由于用户需要承担的资金投入，糟糕的使用体验变得不可原谅。其次，对于
  VR 项目而言，也许比 AR 项目更甚，糟糕的应用性能会导致严重的用户身体不适，迅速将最坚定的拥护者变成批评者。第三，XR 平台的主要吸引力在于其沉浸感，而帧率下降、闪烁或任何迫使用户摘下头显或重启应用的应用程序故障，都会比任何事情都更快地打破这种沉浸感。


  最终，我们必须做好早期对 XR 应用进行性能分析的准备，并确保我们没有超过运行时预算，因为这些媒介背后的技术复杂且资源密集，预算将会非常紧张。


  # 模拟


  Unity 提供了多种模拟选项，特别是针对 HoloLens 和 ARKit 的 AR 应用开发，称为 **Holographic Remoting / Simulation**
  或 ARKitRemote。我们应该小心使用这些模拟功能，并按照其预期用途使用——作为开发工作流程中检查基本功能是否正常工作的便捷工具。在进行基准测试时，它们不能替代真实设备，不应被信任以提供准确的性能分析结果。此功能可通过
  **Window | Holographic Emulation** 窗口访问。


  # 用户舒适度


  与典型的游戏和应用不同，VR 应用需要将用户舒适度作为优化指标。头晕、晕动症、眼睛疲劳、头痛，甚至因失去平衡导致的身体伤害，早期 VR 采用者不幸地经常遇到这些问题，责任在于我们要限制这些对用户的负面影响。本质上，内容对用户舒适度的重要性与硬件一样重要，如果我们要为这个媒介构建产品，就需要认真对待这个问题。


  并非每个人都会遇到这些问题，少数幸运的人可能完全没有经历过。然而，绝大多数用户在某个时间点都报告过这些问题。此外，仅仅因为我们在测试游戏时自己没有触发这些问题，并不意味着它们不会在其他人身上触发。事实上，由于熟悉度，我们将是自己游戏中最有偏见的测试对象。在没有意识到的情况下，我们可能会开始预测应用程序产生的最令人不适的行为，从而使测试与新用户体验相同情况时不公平。不幸的是，这进一步增加了
  VR 应用开发的成本，因为如果我们想弄清楚我们的体验是否会引起不适，就需要与大量不同的无偏见个体进行测试，这可能在每次影响运动和帧率的重大更改后都需要进行。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_264_0.png)


  用户可以采取许多措施来改善 VR 舒适度，例如从短时间会话开始，逐渐增加时间以练习平衡并训练大脑预期不匹配的运动。更激进的选择是提前服用晕动症药物或喝一点姜茶来安抚胃部。然而，如果我们承诺用户需要经历几次晕动症的会话才能开始感到有趣，我们几乎无法说服他们尝试我们的应用。


  用户在 VR 中可能会经历三种主要的不适效果：


  - 晕动症

  - 眼睛疲劳

  - 方向感丧失


  第一个问题，由晕动症引起的恶心，通常发生在用户眼睛认为地平线的位置与其他感官告诉大脑的信息（例如内耳的平衡感）之间存在感官脱节时。第二个问题，眼睛疲劳，源于用户盯着距离眼睛仅几英寸的屏幕，长时间使用后往往会导致大量眼睛疲劳，最终引起头痛。


  最后，方向感丧失通常发生在 VR 用户有时站在封闭空间内，因此如果游戏包含任何基于加速度的运动，用户会本能地通过调整平衡来抵消该加速度，如果我们不小心确保用户体验平稳且可预测的运动，这可能导致方向感丧失、摔倒以及用户受伤。


  > 请注意，术语 _加速度_ 的使用是有意为之，因为它是一个向量，这意味着它既有大小又有方向。任何类型的加速度都可能导致方向感丧失，这不仅包括向前、向后和向侧面加速，还包括旋转方式的加速度（转身）、下落、跳跃等等。


  VR 应用的另一个潜在问题是引发癫痫发作的可能性。VR 处于独特的位置，能够将图像近距离投射到用户眼睛中，这带来了一些风险，即如果渲染行为出现故障并开始闪烁，我们可能会无意中导致易感用户癫痫发作。这些都是我们在开发过程中需要牢记的事情，需要尽早测试和修复，而不是拖延。


  也许，VR 应用中最重要的性能指标是获得较高的 FPS 值，最好是 90 FPS 或更高，因为这将产生流畅的观看体验，用户的头部运动与世界的运动之间几乎没有脱节。任何长时间的帧率下降或
  FPS 值始终低于此值的情况，都可能给我们的用户带来很多问题，因此我们的应用程序随时都必须表现良好至关重要。此外，我们应该非常小心如何控制用户的视角。我们应该避免自行更改
  HMD 的视野（让用户决定其朝向），避免在长时间内产生加速度，或导致不受控的世界旋转和地平线运动，因为这些极有可能引发用户的晕动症和平衡问题。


  一条不容置疑的严格规则是，我们绝不应该在产品的最终构建中对 HMD 的位置跟踪应用任何类型的增益、乘数效应或加速度效应。为了测试而这样做是可以的，但如果真实用户将头向侧面移动两英寸，那么在应用程序中应该感觉移动了相同的相对距离，并且在用户头部停止移动时应立即停止。否则，不仅会导致玩家头部感觉应该在的位置与实际位置之间出现脱节，而且如果相机相对于玩家的朝向和颈部铰链产生偏移，还可能引起严重的不适。






  可以为玩家角色的运动使用加速度，但在用户开始过快地自我调整之前，它应该非常短暂且快速。最明智的做法是坚持使用依赖于恒定速度和/或瞬移的运动。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_266_0.png)


  在赛车游戏中放置倾斜转弯似乎能极大地提高用户舒适度，因为用户会自然地倾斜头部并调整平衡以匹配转弯。


  上述所有规则同样适用于 360 视频内容，如同适用于 VR 游戏一样。坦率地说，有令人尴尬数量的 360 视频发布到市场上，没有考虑到上述因素——它们包含过多的突兀移动、缺乏相机稳定、手动视口旋转等等。这些技巧通常用于确保用户面向我们预期的方向。然而，必须付出更多努力来做到这一点，而不引入这种引起恶心的行为。人类对移动的事物天生非常好奇。如果他们注意到眼角有东西在移动，那么他们很可能会转过身去面对它。这可以很好地利用，在用户观看视频时保持他们面向我们预期的方向。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_266_1.png)


  在生成 VR 内容时，懒惰不是好办法。不要只是把一个 360 相机放在泥地拉力赛车上，并黑进一个意外的相机旋转到视频中以保持动作在中心。运动需要平滑且可预测。在制作过程中，我们需要不断记住我们期望用户看向哪里，以便我们正确地捕捉动作镜头。


  幸运的是，对于 360 视频格式，行业标准帧率（如 24FPS 或 29.97FPS）似乎对用户舒适度没有灾难性的影响，但请注意，此帧率仅适用于视频播放。我们的渲染
  FPS 是一个单独的 FPS 值，并决定位置头部跟踪的平滑程度。渲染 FPS 必须始终非常高以避免不适（理想情况下为 90 FPS）。


  构建 VR 应用程序时会出现其他问题——不同的 HMD 和控制器支持不同的输入和行为，使得跨 VR 平台的功能对等变得困难。如果我们尝试将 2D 和 3D 内容合并在一起，可能会出现一种称为
  **立体冲突** 的问题，其中 2D 对象似乎渲染在 3D 对象深处，因为眼睛无法正确区分距离；这通常是 VR 应用程序和 360 视频播放的用户界面的一个大问题，后者往往是一系列叠加在
  3D 背景上的平面面板。立体冲突通常不会导致恶心，但可能会引起额外的眼睛疲劳。


  虽然不适的影响在 AR 平台上不那么明显，但仍然不应忽视它。由于 AR 应用程序往往会消耗大量资源，低帧率应用程序可能会引起一些不适。如果 AR 应用程序使用将对象叠加到相机图像上（这是大多数应用程序的情况），这一点尤其正确，在那里背景相机图像和我们叠加在其上的对象之间可能会存在帧率的断开。我们应该尝试同步这些帧率以限制这种断开。


  # 性能增强


  关于行业和 XR 开发的讨论就到这里。让我们来介绍一些可以应用于 XR 项目的性能增强。


  # 一切皆可


  由于 AR 和 VR 应用程序是使用与任何其他 Unity 游戏相同的引擎、相同的子系统、资产、工具和实用程序构建的，因此本书中提到的几乎所有其他性能增强在某种程度上都可以帮助
  VR 和 AR 应用程序，在深入研究 XR 特定的增强之前，我们应该尝试所有这些增强。这很令人放心，因为我们可以应用很多潜在的性能增强。缺点是，我们可能需要应用其中许多才能达到应用程序所需的性能水平。


  VR 应用程序性能的最大威胁是 GPU 填充率，它已经是任何其他游戏中更可能的瓶颈之一，但对于 VR 来说要显著得多，因为我们总是试图将高分辨率图像渲染到更大的帧缓冲区（因为我们实际上是在渲染场景两次——一次为每只眼睛）。AR
  应用程序通常会在 CPU 和 GPU 中都发现极端消耗，因为 AR 平台大量使用 GPU 的并行管道来解析对象的空间局部性并执行图像识别等任务，以及需要大量的绘制调用来支持这些活动。


  当然，某些性能增强技术在 XR 中可能不会特别有效。VR 应用程序中的遮挡剔除可能难以设置，因为用户可以从下方、周围，有时甚至穿过场景中的物体观察（尽管它仍然可能非常有益）。与此同时，AR
  应用程序通常在可触及的距离渲染对象，LOD 增强可能设置起来相当无用。我们必须在开始实施之前，运用我们的更好判断来确定一种性能优化技术是否值得实施，因为其中许多技术需要花费大量时间来实施和支持。


  # 单通道与多通道立体渲染


  对于 VR 应用程序，Unity 提供两种渲染模式；多通道和单通道。这可以在 Edit | Project Settings | Player | XR Settings
  | Stereo Rendering Method 下配置。多通道渲染将场景渲染到两个不同的图像，分别为每只眼睛显示。单通道立体渲染将两个图像合并为一个双宽度的渲染纹理，其中仅相关的一半显示给每只眼睛。


  多通道立体渲染是默认情况。单通道渲染的优势在于，它通过减少绘制调用设置来显著节省主线程中的 CPU 工作量，并在 GPU 方面，因为不需要发生那么多纹理交换。当然，GPU
  仍然需要同样努力地渲染对象，因为每个对象仍然从两个不同的视角渲染两次（这里没有免费的东西）。缺点是，这种效果目前仅在使用 OpenGL ES3.0 或更高版本时可用，因此并非在所有平台上都可用。此外，它对渲染管道的影响需要额外的注意和努力，特别是围绕任何使用屏幕空间效果（仅使用已绘制到帧缓冲区的数据的效果）的着色器。启用单通道立体渲染后，着色器代码不再能对传入的屏幕空间信息做出相同的假设。下图显示了屏幕空间坐标在多通道和单通道立体渲染之间的差异。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_268_0.png)


  着色器始终被告知相对于整个输出渲染纹理的屏幕空间坐标，而不是仅相对于它感兴趣的部分。例如，我们通常期望 x 值为 0.5 对应屏幕的水平中点，在使用多通道立体渲染时情况如此，但是，如果我们使用单通道立体渲染，那么
  x 值为 0.5 将对应两只眼睛渲染之间的中点（左眼的右边缘，或右眼的左边缘）。


  Unity 为着色器提供了一些有用的屏幕空间转换辅助方法，可以在 `https://docs.unity3d.com/Manual/ SinglePassStereoRendering.html`
  处找到。


  另一个需要担心的问题是后处理效果。在 VR 中，我们基本上总是为应用于场景的任何后处理效果支付双倍成本，因为它需要为每只眼睛评估一次。单通道立体渲染可以减少设置效果所需的绘制调用，但我们不能盲目地将后处理效果同时应用于两个图像。因此，后处理效果着色器也必须进行调整，以确保它们渲染到输出渲染纹理的正确一半。如果不这样做，后处理效果会被拉伸到两只眼睛上两次，这对于镜头光晕等效果可能看起来非常奇怪。


  单通道立体渲染功能自 Unity 5.4 以来就存在，但由于目前缺乏对所有平台的支持，在编辑器中仍然标记为 **预览**。我们可以期望它最终会推广到更多平台，但对于支持它的平台，我们需要对屏幕空间着色器进行一些性能分析和合理的健全性检查，以确保我们从启用此选项中获得积极收益。


  # 应用抗锯齿


  这个技巧更多是一种要求，而非性能增强。抗锯齿显著提高了 XR 项目的保真度，因为对象会更好地融合在一起，看起来不那么像素化，提高了沉浸感，这可能会消耗大量的填充率。我们应该尽早启用此功能，并尝试在假设它始终存在的前提下达到性能目标，只有在绝对最后的手段才禁用它。






  # 优先使用前向渲染


  延迟渲染的优势在于能够以最少的绘制调用处理多个光源。不幸的是，如果我们遵循前述建议并应用抗锯齿效果，在使用延迟渲染时，这必须作为后处理屏幕空间着色器来完成。与在前向渲染中作为多重采样效果应用相同技术相比，这可能会消耗相当多的性能，从而使前向渲染在两种选项中可能是性能更好的选择。


  # VR 中的图像效果


  法线贴图应用的效果在 VR 中很容易失效，此时纹理看起来像是涂在表面上，而不是营造出深度的错觉。法线贴图在观察角度与表面非常斜（浅）时通常会很快失效，这在典型游戏中并不常见。然而，在
  VR 中，由于大多数头戴式显示器允许用户通过位置追踪在 3D 空间中移动头部（诚然，并非所有设备都支持），用户很快就会找到会破坏任何靠近摄像机物体效果的位置。法线贴图已知可以提高
  VR 中高多边形数量物体的质量，但对于低多边形数量的物体，它很少提供好处，因此我们应该进行一些测试，以确保任何视觉改进都值得其在内存带宽方面的代价。


  最终，我们不能依赖法线贴图来为低多边形数量的物体提供我们可能从非 VR 场景中期待的快速且廉价的图形保真度提升，因此需要进行测试以找出错觉是否按预期工作。应该改用位移贴图、细分曲面和/或视差贴图来创造更可信的深度外观。不幸的是，所有这些技术都比典型的法线贴图更昂贵，但这是我们为了在
  VR 中获得良好的图形质量必须承受的负担。


  其他后处理效果，如景深、模糊和镜头光晕，是典型 3D 游戏中看起来不错的效果，但通常不是我们在现实世界中会目睹的效果，在 VR 中会显得格格不入（至少在眼动追踪支持可用之前），通常应该避免使用。


  # 背面剔除


  背面剔除（移除永远不可见的物体面）对于 VR 和 AR 项目可能很棘手，因为靠近摄像机的物体，玩家的观察角度可能来自任何方向。如果我们想要避免破坏沉浸感的视角，靠近摄像机的资产应该是完全封闭的形状。此外，我们应该仔细考虑对远处物体应用背面剔除，特别是如果用户通过传送移动，因为完全限制用户位置可能很棘手。确保测试游戏世界的包围体积，以确保用户无法逃出。


  # 空间化音频


  音频行业正沸沸扬扬地讨论新技术，以呈现 VR（或者更准确地说是终于找到良好用途的旧技术）的音频体验，形式为空间音频。这些格式的音频数据不再代表来自特定声道的音频数据，而是包含某些音频谐波的数据，这些谐波在运行时合并在一起，以根据当前摄像机视口（特别是垂直方向）创造更可信的音频体验。上一句中的关键词是运行时，这意味着该效果与持续的非平凡成本相关联。这些技术将需要
  CPU 活动，但也可能使用 GPU 加速来生成其效果，因此如果我们在使用空间音频时遇到性能问题，应该仔细检查两种设备的行为。


  # 避免摄像机物理碰撞


  在 VR 和 AR 中，用户有可能将摄像机移动到物体内部，这可能会破坏沉浸感。虽然添加物理碰撞体到这些表面以防止摄像机穿过它们可能很诱人，但这会在 VR 中引起定向失调，因为摄像机不会与用户的移动同步。这也可能破坏
  AR 应用的位置追踪校准。更好的方法是要么允许用户看到物体内部，要么在摄像机和这些表面之间保持安全缓冲区。如果我们一开始就不允许玩家传送得太靠近它们，那么就没有将头伸进墙里的风险。


  由于碰撞体数量减少，这将节省性能，但更应将其视为一种生活质量问题。我们不必过于担心这样做会冒破坏沉浸感的风险，因为研究表明，用户一旦意识到可以这样做，就倾向于避免查看物体内部。起初发生时，他们可能会感到一时的困惑或好笑，但幸运的是，人们倾向于希望留在我们创造的沉浸式体验中，并倾向于避免将头伸进墙里。当然，如果这样做能带来某种游戏优势，例如在策略游戏中透过墙壁观察敌人即将从哪个方向进来，情况就会改变，因此我们应该在开发场景时牢记这一点。


  # 避免使用欧拉角


  避免对任何类型的方向行为使用欧拉角。四元数设计用于更好地表示角度（唯一的缺点是调试时更抽象且更难以可视化），并在发生变化时保持精度，同时避免可怕的万向节锁。使用欧拉角进行计算可能会在大量旋转变化后最终导致不准确，这在
  VR 和 AR 中极有可能发生，因为用户的视角每秒会多次发生微小变化。


  万向节锁是欧拉角可能出现的问题。由于欧拉角通过三个轴表示方向，当其中一个轴旋转 90 度时会出现重叠，我们可能会意外地将它们锁定在一起，使其在数学上不可分离，并导致未来的方向变化同时影响两个轴。当然，人类可以想出如何旋转物体来解决这个问题，但万向节锁纯粹是一个数学问题。经典的例子是战斗机上的姿态气泡。飞行员永远不会遇到万向节锁的问题，但他们的抬头显示器中的姿态仪器可能会因此变得不准确。四元数通过包含第四个值来解决这个问题，该值有效地允许重叠的轴仍然相互区分。


  ![](img/da79484c9b30dc915216dbc5454a9bbf_272_0.png)


  # 保持克制


  VR 应用的性能目标非常难以达到。因此，重要的是要认识到我们是否只是试图将当前一代 XR 设备和典型用户硬件所能容忍的质量过多地塞入应用中。最后的手段始终是从场景中剔除物体，直到达到性能目标。对于
  XR 应用，我们应该比非 XR 应用更愿意这样做，因为性能不佳的成本通常远远超过更高质量带来的收益。如果渲染预算已经耗尽，我们必须克制自己不要向场景中添加更多细节。在沉浸式
  VR 内容中，这可能很难承认，因为我们想要创造尽可能引人入胜的沉浸感，但直到技术赶上能力之前，我们需要保持节俭。


  # 跟上最新进展


  Unity 提供了一份包含 VR 设计和优化技巧的有用文章列表，随着媒介和市场的成熟以及新技术的发现，这些文章可能会更新。它比这本著作能保持更及时的更新，所以不时查看它们以捕捉最新技巧。相关文章可以在
  `https://unity3d.com/learn/tutorials/topics/virtual-reality` 找到。


  我们还应该关注 Unity 博客，以确保不会错过有关 XR API 更改、性能增强和性能建议的任何重要信息。


  # 总结


  希望这份简短指南能帮助我们提高 XR 应用程序的性能。令人欣慰的消息是，我们有许多性能优化选项可供选择，因为 Unity XR 应用程序是建立在我们在本书中一直在探索的同一底层平台之上的。不那么令人欣慰的是，为了有机会达到质量目标，我们可能不得不测试并实现
  _所有这些_ 选项。我们可以预期硬件会随着时间的推移变得更强大，价格会下降，并且因此采用率会增加。但是，在此之前，如果我们想在科技界的最新热潮中竞争，就需要使出浑身解数。





