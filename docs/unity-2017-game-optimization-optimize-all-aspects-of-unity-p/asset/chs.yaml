- '# 前言


  用户体验是任何游戏的关键组成部分，这不仅包括我们游戏的故事和玩法，还包括图形运行的流畅程度、连接多人服务器的可靠性、对用户输入的响应速度，甚至包括最终应用程序文件的大小，因为移动设备和云下载非常普遍。得益于
  Unity 等工具，游戏开发的门槛已大幅降低，Unity 提供了大量有用的开发功能，同时仍对个人开发者友好。然而，由于游戏行业竞争激烈，玩家期望我们提供的最终产品质量水平与日俱增。我们应该预期，游戏的每个方面都会受到玩家和评论家的审视。


  性能优化的目标与用户体验紧密相关。优化不佳的游戏可能导致帧率低、卡顿、崩溃、输入延迟、加载时间长、运行时行为不一致且抖动、物理引擎故障，甚至电池功耗过高（移动设备上常被忽视的指标）。仅出现其中一个问题，就可能成为游戏开发者的噩梦，因为评论往往会关注我们做得不好的那一点，而忽略我们做好的所有方面。


  性能优化的一个目标是充分利用可用资源，包括 CPU 资源（如消耗的周期数、使用的主内存空间，即 RAM）以及图形处理单元（GPU）资源（包括其自身的内存空间，即
  VRAM、填充率、内存带宽等）。然而，性能优化最重要的目标是确保没有任何单一资源在不合适的时间造成瓶颈，并且最高优先级的任务能够优先处理。即使是微小的间歇性卡顿和性能迟缓，也会将玩家从体验中拉离，破坏沉浸感，限制我们创造预期体验的潜力。另一个考虑是，我们节省的资源越多，就能在游戏中实现更多活动，从而创造更有趣、更动态的游戏玩法。


  同样重要的是，决定何时退后一步，停止进行性能增强。在时间和资源无限的世界里，总会有让游戏变得更好、更快、更高效的方法。在开发过程中，必须有一个时刻我们决定产品已达到可接受的质量水平。否则，我们就有可能陷入反复实施改动的困境，这些改动几乎没有或没有实际效益，而每次改动也都有引入更多错误的风险。

  '
- '# 前言


  决定是否值得修复性能问题的最佳方法是回答这个问题：“用户会注意到吗？”。如果答案是“不”，那么性能优化将是徒劳的。软件开发中有一句老话：


  > 过早优化是万恶之源。


  过早优化是重构和重写代码以提升性能的重大罪过，却没有任何证明这是必要的。这可能意味着在没有证明性能问题存在的情况下进行更改，或者仅仅因为我们相信性能问题可能源于某个特定区域，而在未得到证实之前就进行更改。


  当然，这句常见格言的原始版本（由 Donald Knuth 提出）接着说，我们仍应编写代码以避免更直接和明显的性能问题。然而，项目后期的真正性能优化工作可能需要大量时间，我们既应计划时间来恰当地打磨产品，又应避免在没有可验证证据的情况下实施更昂贵、更耗时的更改。此类错误在软件开发者群体中造成了令人沮丧的大量无效工时。


  本书旨在为您提供检测和修复 Unity 应用程序中性能问题所需的工具、知识和技能，无论这些问题源自何处。这些瓶颈可能出现在 CPU、GPU 和 RAM 等硬件组件中，也可能出现在物理、渲染和
  Unity 引擎本身等软件子系统中。


  优化游戏性能将使它们在充斥着每天新增高质量游戏的市场中，有更大机会脱颖而出并取得成功。

  '
- '# 本书内容


  第 1 章，追踪性能问题，探讨了 Unity Profiler 以及一系列分析应用程序、检测性能瓶颈和执行根本原因分析的方法。


  第 2 章，脚本策略，讨论了 Unity C# 脚本代码的最佳实践，包括最小化 MonoBehaviour 回调开销、改进对象间通信等。


  第 3 章，批处理的优势，探讨了 Unity 的动态批处理和静态批处理系统，以及如何利用它们来减轻渲染管道的负担。





  '
- '# 前言


  第 4 章，启动你的艺术，帮助你理解美术资产背后的底层技术，并学习如何避免导入、压缩和编码方面的常见陷阱。


  第 5 章，更快的物理，是关于调查 Unity 内部物理引擎在 3D 和 2D 游戏中的细微差别，以及如何正确组织物理对象以提高性能。


  第 6 章，动态图形，对渲染管线进行了深入探讨，以及如何改进在 GPU 或 CPU 上遭受渲染瓶颈的应用程序，如何优化光照、阴影和粒子效果等图形效果，优化 Shader
  代码的方法，以及针对移动设备的一些特定技术。


  第 7 章，虚拟速度和增强加速，专注于虚拟现实 (VR) 和增强现实 (AR) 这两种新的娱乐媒介，并包括针对为这些平台构建的应用程序特有的几种性能优化技术。


  第 8 章，精通内存管理，探讨了 Unity 引擎、Mono 框架的内部工作原理，以及这些组件内部如何管理内存，以保护我们的应用程序免受过多的堆分配和运行时垃圾回收的影响。


  第 9 章，战术技巧和窍门，以 Unity 专业人士用于改进项目工作流程和场景管理的大量有用技术结束本书。

  '
- '# 本书所需内容


  本书的大部分内容将侧重于适用于 Unity 2017 的功能和增强。本书中探讨的许多技术可以应用于 Unity 5.x 项目及更早版本，但功能列表可能看起来不同。这些差异将在适用的地方予以突出显示。

  '
- '# 本书适用人群


  本书面向中级和高级 Unity 开发者，他们拥有大多数 Unity 功能集的经验，以及那些希望最大化游戏性能或解决特定瓶颈的人。无论瓶颈是由持续的 CPU 过载、运行时
  CPU 峰值、慢速内存访问、内存碎片、垃圾回收、不良的 GPU 填充率或内存带宽引起的，本书都将教你识别问题来源所需的技术，并帮助探索多种减少其对应用程序影响的方法。


  涉及脚本和内存使用的部分需要熟悉 C# 语言，涉及 Shader 优化的部分需要基本了解 Cg。

  '
