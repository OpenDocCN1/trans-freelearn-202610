  \n### 问题\n\n如果您在本书的任何方面遇到问题，可以通过 questions@packtpub.com 联系我们，我们将尽力解决。\n\n- 它们可在不同平台上重用\n\
  - Web 脚本为广泛的客户端应用提供对内容的统一访问\n\n从技术角度来说，Web 脚本可以定义如下：\n\n- 它们是 RESTful Web 服务\n\n\
  > **什么是 RESTful？**\n> REST 代表 Representational State Transfer（表述性状态转移），本质上是一种架构风格。通过\
  \ HTTP 请求方法对资源进行清晰且统一的访问、通过 URI 唯一标识资源，以及这些资源的表示形式，是 REST 的关键原则。遵循这种架构风格的任何实现都被称为\
  \ RESTful。\n\n- 它们绑定到特定的统一资源标识符（URI）\n- 它们响应 GET、POST、PUT 和 DELETE 等 HTTP 方法\n-\
  \ 它们是轻量级实现\n\n从开发者的角度来看，Web 脚本具有以下特性：\n\n- 它们易于理解与学习\n- 它们易于开发\n- 它们易于调试\n- 它们易于维护\n\
  - 它们易于部署\n- 它们实现速度更快\n- 当需要从外部应用安全地访问 Alfresco 存储库时，它们将是首选\n\n从业务用户的角度来看，Web 脚本具有以下用途：\n\
  \n- 它们弥合了使用 Alfresco 构建业务解决方案时业务需求与技术实现之间的差距\n- 它们增强了 Alfresco 的集成能力，使其能够与外部系统开发有用的\
  \ Alfresco 集成解决方案\n- 它们是在 Alfresco 存储库之上实现集成解决方案的独特方式\n- 它们是使用 Alfresco 存储库实现集成解决方案的支柱\n\
  \n- 另一个需要重点注意的是，借助 Web 脚本的事务支持，可以在一个 Web 脚本中同时执行一组操作；而在 CMIS 中，事务的使用存在限制。可以单独执行每个操作，但无法像\
  \ Web 脚本那样在单个事务中同时执行一组操作。\n\n基于 SOAP 的 Web 服务并不可取，原因如下：\n\n- 开发它们需要很长时间\n- 它们依赖\
  \ SOAP\n- 客户端需求更重\n- 它们需要维护资源目录\n- 可扩展性是个挑战\n- 它们只支持 XML\n\n相比之下，Web 脚本具有以下特性：\n\
  \n- 没有复杂的规范\n- 不依赖 SOAP\n- 无需维护资源目录\n- 由于无需维护会话状态，它们更具可扩展性\n- 它们是轻量级实现\n- 它们简单且易于开发\n\
  - 它们支持多种格式\n\n在开发者看来：\n\n- 它们可以使用任何文本编辑器轻松开发\n- 使用脚本语言时无需编译\n- 使用脚本语言时无需重启服务器\n\
  - 无需复杂安装\n\n本质上：\n\n- 与传统的基于 SOAP 的 Web 服务和 CMIS 替代方案相比，Web 脚本是一种基于 REST 且功能强大的与\
  \ Alfresco 存储库交互的选择\n- 它们提供对 Alfresco 存储库中内容的 RESTful 访问，并为广泛的客户端应用提供统一访问\n\n\n\n\
  \n- 它们易于开发，并提供了一些最有用的功能，例如无需服务器重启、无需编译、无需复杂安装，以及无需特定工具来开发它们\n- 所有这些特点使得Web脚本成为开发者和架构师在与Alfresco仓库交互时的首选\n\
  \n## 理解何时使用Web脚本\n\n在了解了什么是Web脚本以及使用Web脚本的原因之后，现在让我们理解何时使用Web脚本。在使用Alfresco时，了解Web脚本可以在哪些场景下使用是很重要的。Web脚本允许你构建自定义的、由URI标识且可通过HTTP访问的内容管理Web服务，以访问Alfresco内容仓库，因此它们可以用于各种类型的实现，以使用Alfresco内容管理系统构建有用的业务解决方案。\n\
  \n在开发项目中：\n\n- 你可以使用Web脚本开发将Alfresco与外部应用程序集成的业务实现\n- 你可以根据业务需求开发自定义的Web脚本\n- 你可以在自定义实现中利用Alfresco提供的开箱即用的Web脚本，只要它们符合你的需求\n\
  \n在支持项目中：\n\n- 当你在支持或维护项目中为客户维护基于Alfresco构建且拥有数百万条记录的生产系统时，Web脚本可能是你的救星。\n- 你可能会遇到一系列问题，例如，更新现有内容以修复某些数据问题、删除一些不需要的内容、获取符合业务团队指定条件的所需内容等。在这些场景中，可以使用Web脚本来达成这些目的。\n\
  - 在生产环境中，无法重启服务器，而重启服务器可能会影响客户的业务。考虑这样一个场景：你需要修复生产系统上的一些关键问题，并且希望在不重启服务器的情况下解决问题。Web脚本无需重启服务器即可与Alfresco仓库交互的强大功能在这种情况下会帮助你，你可以使用Web脚本修复一些关键问题，从而为业务用户提供良好的内容管理体验。\n\
  \n一般来说，Web脚本可以用于各种解决方案，例如：\n\n- 将Alfresco与可通过HTTP与Alfresco通信的外部应用程序集成\n- 开发JSR-168\
  \ portlet以构建UI服务\n- 开发数据服务\n- 为仓库内容提供提要（feeds）\n- 将Alfresco与Office集成\n- 开发Facebook应用程序\n\
  - 在Alfresco SURF中构建UI组件\n\n## 理解Web脚本可以在哪里使用\n\n现在，是时候了解Web脚本可以在哪里使用了。有许多不同的环境可以访问和使用Web脚本。\n\
  \n在不同的环境中：\n\n- 它们可以从HTTP客户端（如Web浏览器和HTTP客户端API）使用\n- 也可以在JSF页面中访问Web脚本\n- 它们可以在JSR-168门户中使用\n\
  - 它们可以从Facebook应用程序中使用\n- Web脚本也可以用于Alfresco SURF平台\n\n## 理解Web脚本如何工作\n\nAlfresco中的Web脚本大多使用模型-视图-控制器（MVC）模式。然而，并不强制要求始终遵循这种模式。MVC模式在Web脚本中的工作方式如下：\n\
  \n- **控制器**负责根据业务需求执行所需的业务逻辑。处理完业务逻辑后，控制器将所需数据填充到**模型**对象中。完成后，控制器将请求转发给**视图**。\n\
  \n## Web脚本中的MVC\n\nWeb脚本中的模型-视图-控制器模式解释如下：\n\n- 控制器可以是服务器端的JavaScript或Java类，也可以两者兼有\n\
  - 模型是在控制器和视图之间传递的数据结构对象\n- 视图是负责以所需格式生成响应的FreeMarker模板\n\n通过描述符文件完成Web脚本URI到控制器的映射。它主要是一个XML文件，其中包含Web脚本所需的信息，例如URL、描述、参数、事务、身份验证和响应格式。\n\
  \n响应格式通过命名约定映射到FreeMarker模板。例如，返回HTML响应的FreeMarker模板将具有`html.ftl`扩展名。\n\nWeb脚本由Alfresco中的Web脚本引擎注册和执行。\n\
  \n> 在一般场景下，描述符、可选控制器以及一个或多个FreeMarker响应模板共同构成一个Web脚本。所有这些组件通过特定的文档命名约定绑定在一起。\n\n\
  ## 使Web脚本工作\n\n要使Web脚本工作，将Web脚本文件部署到合适的位置非常重要。\n\n描述符文件和根据响应格式生成的FreeMarker模板既可以放在文件系统上，也可以放入Alfresco仓库中。\n\
  \n如果Web脚本使用基于JavaScript的控制器，则它可以与描述符和FreeMarker模板一起放在文件系统上或放入Alfresco仓库中。\n\n如果Web脚本使用基于Java的控制器，则控制器的类文件必须位于类路径上。\n\
  \n> Web脚本有两种可用的控制器类型：基于JavaScript的控制器和基于Java的控制器。一个Web脚本可以有其中一种、两种都无，甚至两种都有。\n\n\
  ## Web脚本的类型\n\nAlfresco中有两种类型的Web脚本：数据Web脚本和表示Web脚本。\n\n### 数据Web脚本\n\n数据Web脚本为客户端应用程序提供仓库接口，以便在仓库中创建、检索、更新和删除内容/数据。这些Web脚本通常以XML和JSON等格式发送响应，客户端应用程序必须解析这些响应才能进一步使用。\n\
  \n数据Web脚本封装了对仓库中内容和数据的访问和修改。这些Web脚本仅由Alfresco仓库服务器提供和暴露。\n\n### 表示Web脚本\n\n表示Web脚本可用于构建用户界面，例如用于Alfresco\
  \ Explorer的dashlet、用于Alfresco Share的dashlet、用于JSR-168门户的portlet、Alfresco SURF中的UI组件或自定义应用程序。\n\
  \n这类Web脚本通常呈现HTML响应。\n\n可以将这些Web脚本托管在独立的表示服务器上，也可以由Alfresco仓库服务器暴露。\n\n表示Web脚本通常会调用数据Web脚本以从仓库获取所需数据。\n\
  \n> 在Alfresco安装中可用的开箱即用Web脚本可以在`ALFRESCO_HOME\\tomcat\\webapps\\alfresco\\WEB-INF\\\
  classes\\alfresco\\templates\\webscripts\\org\\alfresco`找到，其中ALFRESCO_HOME是Alfresco安装的基础目录。\n\
  > 如果你使用的是Alfresco Community 5，你可以在`alfresco-remote-api-*.jar`中的alfresco包下找到开箱即用的Web脚本，该JAR位于`ALFRESCO_HOME\\\
  tomcat\\webapps\\alfresco\\WEB-INF\\lib`。\n\n## 总结\n\n在本章中，我们通过一些关于Web脚本的基本问题对Web脚本有了更好的理解。我们学习了Alfresco中的Web脚本是什么、为什么它们是开发者的首选、何时何地可以使用Web脚本、Web脚本如何工作，以及Alfresco中可用的不同Web脚本类型。\n\
  \n在下一章中，我们将进行一个动手练习，学习如何在Alfresco中实现我们的第一个Web脚本。\n"
- "# 第2章：现在就来实现第一个Web脚本\n\n在本章中，我们将涵盖以下主题：\n\n- 如何逐步在Alfresco中创建一个简单的Web脚本\n- 第一个Web脚本的实现\n\
  - 扩展第一个Web脚本以添加控制器\n- Web脚本命中时幕后发生的事情\n- 对任何Web脚本来说最重要的事情\n\n\n\n\n\n现在是时候在 Alfresco\
  \ 中实际实现你的第一个 Web 脚本并更熟悉 Alfresco Web 脚本的实现方式了。本章将帮助你清楚地了解如何在 Alfresco 中创建一个简单的 Web\
  \ 脚本、如何通过控制器实现扩展 Web 脚本，以及在处理 Alfresco Web 脚本时非常重要的一些基础知识。\n\n考虑这样一个场景：你正在管理一个将自定义前端应用与\
  \ Alfresco 作为后端存储库集成的解决方案的项目执行工作。现在，你分配了一名新开发者来开发 Alfresco Web 脚本，他对 Web 脚本实现并不十分熟悉，而你希望让他快速上手\
  \ Web 脚本开发。没关系，你可以让他阅读本章，阅读后他应该能够很好地理解在 Alfresco 中开发 Web 脚本。\n\n## 在 Alfresco 中创建你的第一个\
  \ Web 脚本\n\n每当我们开始学习任何新的编程语言时，我们实现的第一个程序都是“Hello world”程序，其中我们只是将文本 **Hello world**\
  \ 打印为程序的输出。我们在这里也会做同样的事情。我们将在 Alfresco 中创建一个基本的 Web 脚本，它将简单地显示 **Hello world!**\
  \ 作为 Web 脚本的输出。\n\n为了在 Alfresco 中创建一个基本且简单的 Web 脚本，你需要为 Web 脚本准备一个描述符以及一个用于渲染 Web\
  \ 脚本输出的 FreeMarker 模板。\n\nWeb 脚本可以从可用的 Alfresco 用户界面创建，也可以在 Alfresco 外部开发然后部署它们。由于我们在这里要实现一个非常基本的\
  \ Web 脚本，我们将使用 Alfresco 用户界面选项并创建 Web 脚本。你可以使用 Alfresco Explorer Web 客户端或 Alfresco\
  \ Share UI 来实现此操作。然而，由于 Alfresco Explorer 现在通常不被鼓励使用，因为它不在 Alfresco 的路线图上，并且不再为\
  \ Alfresco Explorer 提供新的实现支持，我们也不会使用 Alfresco Explorer。相反，我们将使用 Alfresco Share UI，这是通常推荐使用的。\n\
  \n让我们现在创建 Web 脚本。为了在 Alfresco 中创建你的第一个 Web 脚本，请按照以下步骤操作：\n\n- 1. 登录 Alfresco Share\
  \ UI。\n- 2. 点击顶部标题中的 **Repository** 链接。\n- 3. 进入 **Data Dictionary** | **Web Scripts\
  \ Extensions**。\n- 4. 创建一个名为 helloworld.get.desc.xml 的新文件，内容如下：\n\n```\n<webscript>\n\
  \  <shortname>Hello World</shortname>\n  <description>First webscript Hello world</description>\n\
  \  <url>/helloworld</url>\n</webscript>\n```\n\nDownloading the example code\n你可以从你在\
  \ http://www.packtpub.com 的账户下载你购买的所有 Packt 书籍的示例代码文件。如果你是在其他地方购买本书，你可以访问 http://www.packtpub.com/support\
  \ 并注册以便将文件直接发送到你的邮箱。\n\n- 5. 创建一个名为 helloworld.get.html.ftl 的新文件，内容如下：\n\n```\n\
  <html>\n  <body>\n    <p>Hello world!</p>\n  </body>\n</html>\n```\n\n- 6. 现在，在浏览器中访问\
  \ URL http://localhost:8080/alfresco/service/index。提供身份验证弹出窗口中显示的用户名和密码。点击底部可用的\
  \ Refresh Web Scripts 按钮。\n- 7. 点击 List Web Scripts 链接。你可以通过点击 Browse all Web Scripts\
  \ 链接并搜索 helloworld 来看到 Hello world Web 脚本。\n- 8. 现在，访问 URL http://localhost:8080/alfresco/service/helloworld。好了，你应该在浏览器中看到输出\
  \ Hello world! 被渲染。\n\n我们已经在 Alfresco 中实现了第一个 Web 脚本。现在，让我们尝试理解我们刚刚为了实现第一个 Web 脚本所做的事情。我们首先按如下方式创建了\
  \ Web 脚本：\n\n- - 我们实现了一个 GET Web 脚本来显示 Hello World! 作为输出\n- - 我们为 Web 脚本创建了描述符文档\
  \ helloworld.get.desc.xml\n- - 我们还创建了 FreeMarker 模板 helloworld.get.html.ftl 来渲染\
  \ Web 脚本响应\n\n通常，为了在 Alfresco 中创建 Web 脚本，至少需要两个文件。一个是描述符文档，另一个是 FreeMarker 模板。\n\
  \n## 是时候进行第一个 Web 脚本了\n\n接下来，我们按如下方式部署了 Web 脚本：\n\n- - 我们已将创建 Web 脚本所需的<|message|>\
  \ 文件部署到 Alfresco 存储库中\n- - 描述符文档和 FreeMarker 模板放置在 **Data Dictionary | Web Scripts\
  \ Extensions**\n\n> Web 脚本文件可以直接在 Alfresco 存储库的 **Data Dictionary | Web Scripts\
  \ Extensions** 中创建/上传，也可以通过代码库在文件系统上创建并部署 Web 脚本文件。\n\n然后我们按如下方式注册了 Web 脚本：\n\n\
  - - 我们访问了 URL `http://localhost:8080/alfresco/service/index` 并点击了 **Refresh Web\
  \ Scripts** 按钮以注册第一个 Web 脚本\n\n> 注册 Web 脚本有两种方式。一种是通过访问 URL `http://localhost:8080/alfresco/service/index`\
  \ 并点击 **Refresh Web Scripts** 按钮。另一种方式是通过代码库/存储库部署 Web 脚本文件并重启服务器。服务器重启也会注册 Web\
  \ 脚本。\n\n最后，我们按如下方式执行了第一个 Web 脚本：\n\n- - 我们从 Web 浏览器通过访问 URL `http://localhost:8080/alfresco/service/helloworld`\
  \ 调用了 Web 脚本\n- - Web 脚本在 Web 浏览器上将其输出作为响应显示\n\n## 理解 Web 脚本 URI\n\n理解 Web 脚本 URI\
  \ 很重要。Web 脚本 URI 可以以通用形式表示为 `http[s]://<host>:<port>/[<contextPath>/]/<servicePath>/[<scriptPath>]\
  \ [?<scriptArgs>]`\n\nWeb 脚本 URI 中使用的术语解释如下：\n\n- - `http[s]`: 这是调用 Web 脚本的协议。这可以是\
  \ `http` 或 `https`。\n- - `host`: 这是部署 Web 脚本的服务器的名称或地址。\n- - `port`: 这是托管 Web 脚本的服务器上\
  \ Web 脚本暴露的端口。\n- - `contextPath`: 这是应用程序部署到的路径。对于数据 Web 脚本，这通常是 `/alfresco`。\n\
  - - `servicePath`: 这是 Web 脚本服务映射到的路径。通常这将是 `/service`。\n- - `scriptPath`: 这是 Web\
  \ 脚本的路径，如在 Web 脚本描述符文档 `*.desc.xml` 的 `<url>` 标签中定义的那样。\n- - `scriptArgs`: 这些是要传递给\
  \ Web 脚本的参数，通常在 Web 脚本描述符文档 `*.desc.xml` 的 `<url>` 标签中定义。参数可以在 Web 脚本 `scriptPath`\
  \ 之后紧跟 ? 后指定。\n\n现在你了解了构成 Web 脚本 URI 的不同术语，现在你可以轻松地通过将我们的第一个 Web 脚本 URI 映射到 Web\
  \ 脚本 URI 的通用形式来理解我们的第一个 Web 脚本的 URI。请注意，我们的第一个 Web 脚本没有添加参数，因此你将无法映射 `scriptArgs`\
  \ 部分。现在让我们看看需要做什么来向 Web 脚本添加参数。\n\n## 向 Web 脚本添加参数\n\n假设我们想修改我们的第一个 Web 脚本来在 Web\
  \ 脚本响应中也显示姓名，例如 **Hello! Ramesh**。可以通过简单的方式实现，即将姓名作为 Web 脚本的 URL 参数传递，然后在 FreeMarker\
  \ 模板中使用此参数生成响应。为了做到这一点，我们将不得不执行以下步骤：\n\n- 1. 登录 Alfresco Share UI。\n- 2. 点击顶部标题中的\
  \ **Repository** 链接。\n- 3. 按如下方式编辑 **Data Dictionary | Web Scripts Extension** 位置的描述符文件\
  \ `helloworld.get.desc.xml`：\n```\n<webscript>\n    <shortname>Hello World</shortname>\n\
  \    <description>First webscript Hello world</description>\n    <url>/helloworld?name={argumentName}</url>\n\
  </webscript>\n```\n- 4. 按如下方式编辑 **Data Dictionary | Web Scripts Extension** 位置的\
  \ FreeMarker 模板 `helloworld.get.html.ftl`：\n```\n<html>\n    <body>\n```\n\n\n\n\
  ```html\n<p>Hello! ${args.name}.</p>\n</body>\n</html>\n```\n\n- 5. 访问 `http://localhost:8080/alfresco/service/index`\
  \ 来注册Web脚本，并点击**刷新Web脚本**按钮。\n- 6. 现在，访问 URL `http://localhost:8080/alfresco/service/helloworld?name=Ramesh`\
  \ 来执行这个Web脚本。执行时，你应该能看到 **你好！Ramesh。** 作为输出。\n\n> 这里需要重点理解的一点是，即使在第三步中没有提供`name={argumentName}`，并且按照第六步所述访问URL来执行Web脚本，你也会得到相同的结果。在描述文档中指定`name={argumentName}`有助于你了解Web脚本所使用的参数。这样，只需要查看描述文档，你就能知道Web脚本的参数。作为一种良好的实践，你应该始终在描述文档中添加Web脚本所使用的参数。\n\
  \n## 扩展第一个Web脚本以使用控制器\n\nAlfresco中的Web脚本框架通过遵循模型-视图-控制器模式来开发Web脚本，从而轻松实现关注点分离。所有业务逻辑都位于控制器中，并且可以按需使用多个视图，以Alfresco\
  \ Web脚本框架支持的不同响应格式返回响应。模型对象是一种数据结构，用于将信息从控制器传递到视图。控制器使用所需数据填充模型对象，并将其传递给视图以生成响应。\n\
  \n在第一个Web脚本中，我们创建了一个基本且简单的Web脚本，它仅渲染输出，不与Alfresco存储库交互。理想情况下，与业务逻辑相关的任何处理，例如查询Alfresco存储库、创建内容、更新内容、从存储库删除内容以及执行操作，都应该在控制器中完成。控制器可以是服务器端JavaScript或基于Java的控制器。\n\
  \n让我们扩展第一个Web脚本，添加一个控制器，以了解控制器如何填充数据并将数据传递给FreeMarker模板，以及FreeMarker模板如何使用模型数据生成响应：\n\
  \n- 1. 登录到Alfresco Share UI。\n- 2. 从顶部标题栏点击**存储库**链接。\n- 3. 转到 **数据字典 | Web 脚本扩展**。\n\
  - 4. 按如下内容编辑描述文件 `helloworld.get.desc.xml`：\n\n    ```\n    <webscript>\n      <shortname>Hello\
  \ World</shortname>\n      <description>First webscript Hello world</description>\n\
  \      <url>/helloworld?name={argumentName}</url>\n      <authentication>user</authentication>\n\
  \    </webscript>\n    ```\n\n- 5. 创建一个名为 `helloworld.get.js` 的新文件，内容如下：\n\n   \
  \ ```\n    model.email=\"Ramesh.chauhan@cignex.com\";\n    ```\n\n- 6. 按如下内容编辑 FreeMarker\
  \ 模板 `helloworld.get.html.ftl`：\n\n    ```\n    <html>\n      <body>\n        <p>Hello!\
  \ ${args.name}.</p>\n        <p>email address: ${email}</p>\n      </body>\n   \
  \ </html>\n    ```\n\n- 7. 访问 `http://localhost:8080/alfresco/service/index`，点击**刷新Web脚本**按钮。\n\
  - 8. 现在，访问 URL `http://localhost:8080/alfresco/service/helloworld?name=Ramesh` 来执行该Web脚本。它会要求提供用户凭据。提供用户凭据后，你应该看到如下响应：\n\
  \    **你好！Ramesh。**\n    **电子邮件地址：Ramesh.chauhan@cignex.com**\n\n这就是我们以简单方式在Web脚本中添加控制器的方法。在前面的示例中，我们将要在Web脚本响应中返回的电子邮件地址进行了硬编码。我们没有与Alfresco存储库进行任何交互。我们只是填充了模型对象，并从服务器端JavaScript控制器将其传递给FreeMarker模板。\n\
  \n> 模型基本上是一个根对象，Alfresco通过它实现服务器端JavaScript控制器与FreeMarker模板视图之间的数据共享。\n\n你可以修改控制器，根据接收到的name参数，从Alfresco存储库动态检索电子邮件地址。借助Alfresco\
  \ JavaScript API，你可以首先根据name参数从存储库中检索用户，然后获取该用户的电子邮件地址。在服务器端JavaScript控制器中，你可以利用可用的Alfresco\
  \ JavaScript API与存储库交互。这样，我们就可以让Web脚本根据从Alfresco存储库检索到的数据来渲染响应。\n\n> 在服务器端JavaScript控制器中，你可以利用可用的Alfresco\
  \ JavaScript API访问Alfresco存储库，并根据需要执行业务逻辑。\n\n## Web脚本执行的幕后\n\n### 没有控制器的Web脚本\n\
  \n为了执行我们创建的第一个没有控制器的Web脚本，我们只需在Web浏览器中访问 URL http://localhost:8080/alfresco/service/helloworld?name=Ramesh，这基本上是一个HTTP\
  \ GET请求调用。\n\n所有与URL模式 `/alfresco/service/*` 匹配的传入请求都会映射到Alfresco Web应用程序配置中的Web脚本请求分发器Servlet。\n\
  \n然后，Servlet将请求传递给Web脚本运行时以处理Web脚本。\n\nWeb脚本运行时将控制权传递给Web脚本容器。Web脚本容器根据所调用的Web脚本URL、HTTP方法和Web脚本描述文档\
  \ helloworld.get.desc.xml 在内部识别要执行哪个Web脚本。我们没有在描述文档中显式指定任何响应格式，在执行Web脚本时也没有显式指定。因此，Web脚本框架将HTML作为默认格式渲染。根据FreeMarker模板的命名约定，我们回想起我们已将FreeMarker模板创建为\
  \ `helloworld.get.html.ftl`。这为Web脚本生成了HTML响应。随后，格式化的响应被发送回Web浏览器，以在Web脚本响应中显示HTML文本以及参数name的值。\n\
  \n### 带控制器的Web脚本\n\n你一定已经注意到，在第一个Web脚本中，我们先是创建了没有控制器的Web脚本，然后扩展了该Web脚本以包含控制器。调用此Web脚本的URL保持不变。URL没有任何区别。只是在后端实现中额外实现了一个控制器。\n\
  \n幕后，当调用带有控制器的Web脚本时，Alfresco中的Web脚本框架会遵循与没有控制器的Web脚本相同的过程。唯一的区别是，在渲染响应之前，Alfresco中的Web脚本框架会首先执行控制器实现。控制器将首先完成与Alfresco存储库交互所需的业务逻辑处理，并生成要作为Web脚本响应返回的所需数据。控制器将填充模型对象并传递给FreeMarker模板。\n\
  \n## 任何Web脚本的重要事项\n\n在Alfresco中实现Web脚本时，理解一些需要特别注意的重要事项至关重要。在开发Alfresco Web脚本时，你应该始终牢记三件重要的事情：\n\
  \n- 为Web脚本选择HTTP方法\n- 指定Web脚本的URL和参数\n- Web脚本的响应格式\n\n### Web脚本支持的HTTP方法\n\n在开发Web脚本并与Alfresco存储库交互时，你应确保为Web脚本选择适当的HTTP方法。理解Alfresco中Web脚本框架支持的各种HTTP方法非常重要，这样你可以为Web脚本选择合适的方法。\n\
  \n\n\n\n- 可以使用不同的 HTTP 方法定义一个 web 脚本。例如，在一个合同管理解决方案中，可以根据 HTTP 方法区分 web 脚本，以从存储库中创建/更新/删除/检索合同（基于自定义内容类型的内容）如下：\n\
  \  - `contract.get.desc.xml`：这会从存储库中获取合同\n  - `contract.put.desc.xml`：这会更新存储库中指定的合同\n\
  \  - `contracts.post.desc.xml`：这会在存储库中创建合同\n  - `contract.delete.desc.xml`：这会从存储库中删除合同\n\
  \n## Web script arguments\n\n了解 web 脚本需要哪些参数非常重要。作为一般做法，在创建 web 脚本时，应在描述文档中指定参数。让我们来看看指定\
  \ web 脚本参数的两种方式。\n\n### Explicit arguments\n\n显式参数通常作为查询字符串提供给 web 脚本 URL。在描述符文档中，参数名称及其占位符通常作为查询字符串指定在\
  \ web 脚本 URL 的 `<url>` 标签下。例如，我们为第一个 web 脚本实现添加参数的方式如下：\n\n```\n`<url>/helloworld?name={argumentName}</url>`\n\
  ```\n\n你可以通过使用和号字符 `&amp;` 来区分，为 web 脚本 URL 添加多个参数。\n\n> 在 web 脚本描述符文档中指定参数时，重要的是使用转义的和号字符\
  \ `&amp;`。这是为了确保 web 脚本描述符始终是有效的 XML 而必须这样做。\n\n因此，例如，如果你想为第一个 web 脚本添加另一个参数，可以在描述符文档中按如下方式声明：\n\
  \n```\n`<url>/helloworld?name={argumentName}&amp;organisation={argumentOrganisation}</url>`\n\
  ```\n\n## Response formats supported by the web script framework\n\nAlfresco 中的\
  \ web 脚本框架支持不同的响应格式。以下是可用响应格式及其 mime 类型的列表：\n\n- html - text/html\n- text - text/plain\n\
  - xml - text/xml\n- xsd - text/xml\n- atom - application/atom+xml\n- atomentry -\
  \ application/atom+xml;type=entry\n- atomfeed - application/atom+xml;type=feed\n\
  - atomsvc - application/atomsvc+xml\n- rss - application/rss+xml\n- json - application/json\n\
  - opensearchdescription - application/opensearchdescription+xml\n- mediawiki - text/plain\n\
  - portlet - text/html\n- fbml - text/html\n- php - text/html\n- js - text/javascript\n\
  - calendar - text/calendar\n- csv - text/csv\n- xls - application/vnd.ms-excel\n\
  - xlsx - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\n\n##\
  \ Specifying the response format\n\n通过模型-视图-控制器模式的实现，我们可以有一个控制器实现和多个视图。因此，可以为任何\
  \ web 脚本提供多种响应格式，以便按请求以不同格式返回 web 脚本输出。\n\n你可以从支持的响应格式列表中为你的 web 脚本选择任何响应格式。有两种不同的方法可以为\
  \ web 脚本指定响应格式。\n\n### Specifying the response format via URL – extension on web\
  \ script ID\n\n一旦你创建了所需的描述符文件、控制器和多个响应模板文档用于你的 web 脚本，你就可以在调用 web 脚本 URL 时指定要使用的响应格式。你可以将其指定为\
  \ web 脚本 ID 的扩展。\n\n例如，如果为 hello world web 脚本创建了不同的响应格式文档，例如 helloworld.get.xml.ftl\
  \ 或 helloworld.get.json.ftl，并且在调用 web 脚本时你想显式指定 XML 格式，那么你可以按如下方式操作：\n\n```\nhttp://localhost:8080/alfresco/service/helloworld.xml?name=Ramesh\n\
  ```\n\n### Specifying the response format via URL – explicit format argument\n\n\
  指定响应格式的另一种方法是显式地向 web 脚本 URL 传递 format 参数。例如，如果你想为 hello world web 脚本显式指定 XML 格式，那么你可以按如下方式操作：\n\
  \n```\nhttp://localhost:8080/alfresco/service/helloworld?name=Ramesh&format=xml\n\
  ```\n\n### The default format\n\n在调用 web 脚本时，如果未使用前面提到的两种方法中的任何一种显式指定格式，则将返回描述符文档中提到的默认格式。默认格式可以在描述符文档中按如下方式指定：\n\
  \n```\n<format default=\"json\">any</format>\n```\n\n这表示 web 脚本响应的默认格式为 JSON，并且可以在调用\
  \ web 脚本时使用前面两种方法中的任何一种指定格式。\n\n> 如果 web 脚本的描述符文档中未定义默认响应格式，并且在执行 web 脚本时既未通过 web\
  \ 脚本 URL 中 web 脚本 ID 的扩展提供响应格式，也未通过显式指定 web 脚本 URL 中的 format 参数提供响应格式，则 Alfresco\
  \ 假定默认响应格式为 HTML。\n\n通常，响应格式的一些有用要点如下：\n\n- 响应格式通过命名约定映射到 FreeMarker 模板，例如我们第一个\
  \ web 脚本中的 `helloworld.get.html.ftl`\n- 对于任何 web 脚本，你可以定义多种响应格式，如 HTML、XML、JSON\
  \ 等。\n- 根据 web 脚本请求方法和请求的格式，Alfresco 中的 web 脚本框架返回 web 脚本响应\n\n## Summary\n\n在本章中，我们在\
  \ Alfresco 中实际实现了最简单的第一个 web 脚本，了解了 Alfresco web 脚本 URI，以便我们知道如何使用 web 脚本，如何向 web\
  \ 脚本添加参数，然后扩展第一个简单 web 脚本以实现控制器。\n\n此外，我们还高层次地了解了当使用控制器为 web 脚本提供服务时，web 脚本命中背后的发生情况，以及如果未实现控制器时会发生什么。\n\
  \n我们在 Alfresco 中实现 web 脚本时学到了一些非常重要的事情，例如 Alfresco 中 web 脚本框架支持的不同 HTTP 方法、何时选择哪种方法、指定\
  \ web 脚本参数的不同方式、Alfresco 中 web 脚本框架支持的响应格式列表，以及如何使你的 web 脚本根据请求的响应格式以不同的响应格式返回响应。\n\
  \n总体而言，通过在 Alfresco 中创建和扩展简单 web 脚本的示例，我们获得了关于在 Alfresco 中实现 web 脚本时一些基本事物的良好知识。\n\
  \n在下一章中，我们将深入探讨 Alfresco 中的 web 脚本框架，并提供有用的技术见解。\n"
- "# 第3章：深入理解Web脚本框架\nUnderstanding the Web Script Framework\n\n在本章中，我们将涵盖以下主题：\n\n\
  - Web 脚本的端到端执行流程\n- 共同构成 web 脚本框架的组件\n- Web 脚本的部署架构\n\nAlfresco 中的 web 脚本框架功能强大，其基本目标是确保：\n\
  \n- Alfresco 中的 web 脚本易于开发\n- Web 脚本可以支持各种有用功能，例如支持国际化以在多种语言中呈现输出，为 web 脚本公开配置选项，类似于\
  \ servlet 的 ServletConfig\n\nAlfresco 中的 web 脚本框架是按照 **模型-视图-控制器模式 (MVC 模式)** 设计的，使得开发新的\
  \ web 脚本以暴露 RESTful API 来与 Alfresco 后端存储库交互变得容易。\n\n在本章中，我们将深入探讨 Alfresco 中的 web\
  \ 脚本框架，以了解共同使其成为强大框架的各种组件。它是 Alfresco web 脚本注册和执行的骨干引擎。\n\n## Execution flow of\
  \ web scripts\n\n让我们首先了解 web 脚本的执行流程，以便了解 Alfresco web 脚本框架。\n\n### Overall flow\
  \ for a web script\n\n一旦 web 脚本 URI 的请求被命中，web 脚本的执行流程就开始了，并一直持续到请求以请求的响应格式提供服务为止。让我们了解一个由\
  \ JavaScript 支持的控制器的 web 脚本的整体执行流程。整个执行流程如下：\n\n1. Web 脚本 URI 的请求到达 Alfresco 中的\
  \ web 脚本请求调度器。\n2. 请求调度器将请求发送到 Web Script Runtime。\n3. Web Script Runtime 将请求委托给\
  \ Web Script Container，后者将首先找到适合请求的 URI 和请求的 HTTP 方法的 web 脚本。\n4. 下一步是在执行 web 脚本之前，如果需要，先对用户进行身份验证。\n\
  5. Web Script Container 然后执行控制器实现（如果可用）。脚本处理器将执行请求 web 脚本的 JavaScript 控制器。\n\n\n\
  \n\n\n## 幕后实现\n\n我们已经对 Web 脚本的整体执行流程有了概览，现在让我们深入技术细节，逐步了解实现过程，以理解当 JavaScript 控制器支持的\
  \ Web 脚本通过来自 HTTP 客户端（例如 Web 浏览器）的 HTTP 请求被调用时，Web 脚本请求是如何得到处理的。你会在本节中看到大量技术细节，所以在开始阅读之前，你可能想先来杯咖啡。\n\
  \n> 由于我们将在本节中进行详细的技术性讲解，你可能需要访问源代码，以便在阅读本节时更容易跟上。为了方便快捷地访问代码，我们只需浏览 Alfresco 安装中可用的\
  \ JAR 文件。你可以下载并安装 Java 反编译工具，例如 JD-GUI（可在 `http://jd.benow.ca/` 获取），它可以反编译 JAR 文件。我们在本节中将熟悉的类主要位于\
  \ `spring-webscripts-*.jar`、`alfresco-remote-api-*.jar` 和 `spring-surf-core-configservice-*.jar`\
  \ 中。这些 JAR 文件可以在 Alfresco 安装目录下的 `tomcat\\webapps\\alfresco\\WEB-INF\\lib` 中找到。在\
  \ JD-GUI（反编译器）中打开 JAR 文件后，你可以使用 `Ctrl + Shift + T` 打开类文件并提供类名。\n\n那么，让我们开始吧：\n\n\
  - 1. 对于 Alfresco Web 脚本，RequestDispatcher servlet（`org.springframework.extensions.webscripts.servlet.WebScriptServlet`）在\
  \ web.xml 中配置，并映射到 `/service/*` URL 模式。\n- 2. 在对 `/alfresco/service/*` URL 模式的第一次请求时，servlet\
  \ 容器将调用 WebScriptServlet 的 init 方法，并使用配置服务（`org.springframework.extensions.config.xml.XMLConfigService`）、Web\
  \ 脚本容器（`org.alfresco.repo.web.scripts.TenantRepositoryContainer`）和根据 servlet init-param\
  \ — authenticator（`webscripts.authenticator.basic`）及所需服务器属性获取的身份验证工厂（`org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory`）来实例化它。\n\
  - 3. 在第一次请求完成初始化后，以及后续对 `/alfresco/service/*` URL 模式的请求中，为了执行 Web 脚本，会调用 WebScriptServlet\
  \ 的 `service()` 方法。\n\n![](img/f02f759059b86af67e38b543d498a0d8_56_0.png)\n\n- 4.\
  \ `WebScriptServlet` 在处理 Web 脚本请求时，每次都会执行以下操作：\n  - 它会使用 Web 脚本容器、身份验证工厂（第二步中提到的相关类）、服务器属性、请求（`javax.servlet.http.HttpServletRequest`）和响应（`javax.servlet.http.HttpServletResponse`）创建一个新的\
  \ Web 脚本 Servlet 运行时（`org.springframework.extensions.webscripts.servlet.WebScriptServletRuntime`）实例。\n\
  \  - 它会调用 `WebScriptServletRuntime` 的 `executeScript` 方法。\n- 5. `WebScriptServletRuntime`\
  \ 没有为 `executeScript()` 方法提供实现，因此其父类 `AbstractRuntime`（`org.springframework.extensions.webscripts.AbstractRuntime`）中的方法实现会被执行。\n\
  - 6. 在 `AbstractRuntime` 中执行 `executeScript()` 方法期间，它首先获取 Web 脚本方法和 Web 脚本 URI，并调用\
  \ Web 脚本容器中定义的注册表（`org.springframework.extensions.webscripts.DeclarativeRegistry`）的\
  \ `findWebscript(methodName, uri)` 方法。\n- 7. 注册表（`DeclarativeRegistry`）将通过调用 `UriIndex`\
  \ 实现（`org.springframework.extensions.webscripts.JaxRsUriIndex`）的 `findWebscript(methodName,\
  \ uri)` 来对 Web 脚本 URI 的第一次请求执行 `uriIndex` 查找，并用该 Web 脚本 URI 更新 `uriIndexCache`。这样，在下次对同一\
  \ Web 脚本 URI 的请求中，注册表就不会再次进行查找。\n- 8. 注册表（`DeclarativeRegistry`）将 Match 对象（`org.springframework.extensions.webscripts.Match`）返回给\
  \ `AbstractRuntime`，该对象包含 `templatePath`、`templateVars` 映射以及 WebScript 对象（`org.springframework.extensions.webscripts.DeclarativeWebScript`）。\n\
  - 9. 然后，Web 脚本运行时（`AbstractRuntime`）使用 `WebScriptServletRuntime` 中可用的实现创建 `WebScriptRequest`（`org.springframework.extensions.webscripts.WebScriptRequestImpl`）、`WebScriptResponse`（`org.springframework.extensions.webscripts.WebScriptResponseImpl`）和\
  \ Authenticator（`org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory.BasicHttpAuthenticator`）。\n\
  - 10. 然后，Web 脚本运行时（AbstractRuntime）将调用 Web 脚本容器（`org.alfresco.repo.web.scripts.RepositoryContainer`）的\
  \ `executeScript` 方法，并传递 Web 脚本请求、Web 脚本响应和身份验证器。配置的仓库容器是 `TenantRepositoryContainer`；但是，它没有提供\
  \ `executeScript` 方法的实现，因此该方法从其父类执行。\n- 11. Web 脚本容器（`RepositoryContainer`）将使用在\
  \ Web 脚本请求中接收的 Web 脚本对象获取描述对象，首先对用户进行身份验证，创建一个新事务来执行 Web 脚本，然后调用 Web 脚本（`DeclarativeWebScript`）的\
  \ `execute` 方法，并传递 Web 脚本请求和响应。\n- 12. `DeclarativeWebScript` 将调用 `AbstractWebScript`\
  \ 的 `getExecuteScript` 方法，该方法将从 Web 脚本缓存中获取脚本。如果是第一次执行该 Web 脚本，它会先将脚本添加到缓存中。\n-\
  \ 13. 然后，`DeclarativeWebScript` 将调用 `AbstractWebScript` 类的 `createScriptParameters`\
  \ 方法，该方法会使用所需参数填充一个映射，例如 `webscript`、`format`、`args`、`argsM`、`headers`、`headersM`、`guest`、`url`、`msg`、Web\
  \ 脚本运行时的脚本参数以及 Web 脚本容器的脚本参数。此外，它还会根据为 Web 脚本提供的 `config.xml` 创建 `TemplateConfigModel`\
  \ 和 `ScriptConfigModel`。\n- 14. 在进一步处理中，`AbstractWebscript` 的 `executeScript` 方法将被调用，该方法进而会调用\
  \ `ScriptProcessor` 类（`org.alfresco.repo.jscript.RhinoScriptProcessor`），该类将首次编译\
  \ JavaScript 控制器并解析脚本的导入，然后最终执行控制器。\n- 15. 然后，`DeclarativeWebScript` 将使用 Web 脚本容器（`AbstractRuntimeContainer`）中配置的\
  \ `TemplateProcessor` 来处理模板，以便渲染响应。\n- 16. `DeclarativeWebScript` 设置要渲染的响应。\n- 17.\
  \ Web 脚本容器（`RepositoryContainer`）结束事务并重置身份验证。\n- 18. Web 脚本运行时（`AbstractRuntime`）完成整个执行过程，并记录\
  \ Web 脚本执行和处理所花费的处理时间。\n- 19. `WebscriptServlet` 将响应返回给 Web 脚本客户端。\n\n## Web 脚本框架的组件\n\
  \n共同构成强大的 Web 脚本框架的不同高层组件如下：\n\n- Web 脚本运行时\n- Web 脚本身份验证器\n- Web 脚本容器\n- 其他支持组件\n\
  \n![](img/f02f759059b86af67e38b543d498a0d8_59_0.png)\n\n让我们逐一了解它们。\n\n## Web 脚本运行时\n\
  \n在详细了解了 Web 脚本执行流程之后，让我们回顾一下 Web 脚本运行时的角色。在执行 Web 脚本时，请求分发器首先将请求发送到 Web 脚本运行时。然后，Web\
  \ 脚本运行时将控制权传递给 Web 脚本容器以进行进一步处理。因此，它可以被视为请求分发器之后进入 Web 脚本框架的入口点。\n\n## 理解 Web 脚本框架\n\
  \n每一个 Web 脚本都会在 Web 脚本运行时中执行。它基本上将 Web 脚本与其执行环境分离。Web 脚本运行时封装了完整的 Web 脚本执行环境，特别是请求、响应和身份验证，并将\
  \ Web 脚本提供给调用它的 Web 脚本客户端。\n\nAlfresco 开箱即用地提供了以下不同的 Web 脚本运行时来执行 Web 脚本：\n\n- Servlet\
  \ 运行时\n- Portlet 运行时\n- JSF 运行时\n- Facebook 运行时\n- SURF Web 框架运行时\n\n### Servlet\
  \ 运行时\n\n该 Web 脚本运行时负责执行所有通过 HTTP 或 HTTPS 请求访问的 Web 脚本。\n\n> Servlet 运行时是最常用的运行时，基本上通过\
  \ HTTP/HTTPS 请求执行 Web 脚本。本书也特别关注 Servlet 运行时。\n\n该运行时的实现可在 `spring-webscripts-*.jar`\
  \ 中的 `org.springframework.extensions.webscripts.servlet.WebScriptServletRuntime`\
  \ 中找到。\n\n### Portlet 运行时\n\n该 Web 脚本运行时使 JSR-168 portlet 能够直接执行 Alfresco Web 脚本。每当从\
  \ JSR-168 portlet 访问 Alfresco Web 脚本时，在执行该 Web 脚本的过程中，此运行时将被实例化。\n\n该运行时（`PortletRuntime`）的实现以内部类实现的形式存在于\
  \ `spring-webscripts-*.jar` 中的 `org.springframework.extensions.webscripts.portlet.WebScriptPortlet`\
  \ 中。\n\n### JSF 运行时\n\nJSF 组件可以使用 JSF 运行时执行 Alfresco Web 脚本。每当从 JSF 页面调用 Alfresco\
  \ Web 脚本时，此运行时将被实例化以执行该 Web 脚本。\n\n\n\n\n\n该运行时（`WebScriptJSFRuntime`）的实现可在 `spring-webscripts-*.jar`\
  \ 中的 `org.springframework.extensions.webscripts.jsf.UIWebScript` 内作为内部类实现找到。\n\n\
  ## Facebook 运行时\n\nFacebook 运行时可在 Alfresco Web 脚本中提供对 Facebook API 的访问。\n\n该运行时的实现在\
  \ `alfresco-remote-api-*.jar` 的 `org.alfresco.repo.web.scripts.facebook.FacebookServletRuntime`\
  \ 中提供。\n\n## SURF 运行时\n\nSURF Web 框架运行时允许通过嵌入 Alfresco Web 脚本组件来构建 Web 层 UI 页面。\n\
  \nSURF 运行时的实现可在 `spring-surf-*.jar` 的 `org.springframework.extensions.webscripts.LocalWebScriptRuntime`\
  \ 中找到。\n\n## Web 脚本身份验证器\n\n在与任何内容存储库交互时，安全访问内容是必须且非常重要的。Alfresco 在访问内容存储库时也要求经过身份验证的访问。Web\
  \ 脚本身份验证器的主要任务是对 Web 脚本请求进行身份验证。\n\n如下列表所述，Alfresco 开箱即用地提供了多种身份验证器，它们可以在相应的 Alfresco\
  \ Web 脚本运行时中进行配置，以便通过 Alfresco Web 脚本提供对 Alfresco 存储库的安全访问：\n\n- HTTP 基本身份验证器\n\
  - Alfresco Explorer 身份验证器\n- JSR-168 身份验证器\n- 支持 Alfresco Explorer 的 JSR-168 身份验证器\n\
  - Facebook 身份验证器\n\nWeb 脚本框架默认使用 HTTP 基本身份验证。不过，它可以配置为使用其他形式的身份验证机制。\n\n### HTTP\
  \ 基本身份验证器\n\n当需要为经过身份验证的用户调用 Web 脚本时，通过 HTTP/HTTPS 请求访问 Web 脚本必须指定用户名和密码或票据。\n\n\
  授权标头中必须包含用户名和密码或票据。\n\n票据可以通过查询字符串参数 `alf_ticket` 来指定。\n\n> 票据基本上代表一个已经成功登录 Alfresco\
  \ 的经过身份验证的用户。可以通过现成的 Alfresco Web 脚本轻松获得票据，URL 为 `http://localhost:8080/alfresco/service/api/login?u={username}&pw={password}`。调用前，只需在此处占位符中提供用户名和密码。通常，当从自定义前端应用程序或第三方系统访问\
  \ Alfresco 存储库时，这是为了继续进一步操作并使用经过身份验证的访问调用其他 Web 脚本而首先要做的事情。\n\nServlet 运行时使用 HTTP\
  \ 基本身份验证器来验证请求 Web 脚本的用户。\n\n该身份验证器在 `web-scripts-application-context.xml` 中配置为\
  \ ID 为 `webscripts.authenticator.basic` 的 Spring Bean。\n\n> `web-scripts-application-context.xml`\
  \ 文件可以在 Alfresco 安装目录内的 `tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco`\
  \ 中找到。如果您使用的是 Alfresco Community 5，它可以在 `alfresco-remote-api-*.jar` 内的 `alfresco`\
  \ 包下找到。\n\n### Alfresco Explorer 身份验证器\n\n该身份验证器使用登录 Alfresco Web Client 时所使用的身份验证机制。\n\
  \n如果需要登录，用户将被重定向到 Alfresco Web Client 登录页面。\n\n该身份验证器在 `web-client-application-context.xml`\
  \ 中配置为 ID 为 `webscripts.authenticator.webclient` 的 Spring Bean。\n\n`web-client-application-context.xml`\
  \ 文件可以在 Alfresco 安装目录内的 `tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco`\
  \ 中找到。对于 Alfresco Community 5，位置也相同。\n\n### JSR-168 身份验证器\n\nJSR-168 身份验证器期望用户已经通过门户进行了身份验证。可以使用\
  \ `alfportletusername` 属性从门户会话中找到经过身份验证的门户用户。\n\n该身份验证器在 `web-scripts-application-context.xml`\
  \ 中配置为 ID 为 `webscripts.authenticator.jsr168` 的 Spring Bean。\n\n### 支持 Alfresco\
  \ Explorer 的 JSR-168 身份验证器\n\n依赖 Alfresco Web Client 功能的 Alfresco 仓库 Web 脚本，可以使用此身份验证器在门户内进行身份验证和使用。\n\
  \n该身份验证器在 `web-client-application-context.xml` 中配置为 ID 为 `webscripts.authenticator.jsr168.webclient`\
  \ 的 Spring Bean。\n\n### Facebook 身份验证器\n\n如果需要登录，用户将被重定向到 Facebook 登录页面。\n\n该身份验证器在\
  \ `web-scripts-application-context.xml` 中配置为 ID 为 `webscripts.authenticator.facebook`\
  \ 的 Spring Bean。\n\n## Web 脚本容器\n\nWeb 脚本容器是 Web 脚本框架的核心。它作为集成所有其他所需服务的中心点来执行 Web\
  \ 脚本，起着重要作用。它识别适当的 Web 脚本并向 Web 脚本提供根对象。\n\nAlfresco 开箱即用地提供了两种类型的 Web 脚本容器：\n\n\
  - 仓库容器\n- 表示容器\n\n### 仓库容器\n\n该容器在执行所有 Web 脚本方面发挥着关键作用，这些脚本利用 Alfresco 提供的各种服务直接访问\
  \ Alfresco 仓库中的内容。\n\n它是一种专用类型的容器，主要仅嵌入在 Alfresco 仓库中。它使用 Alfresco 仓库提供的一些核心服务来支持\
  \ Web 脚本的事务和身份验证。\n\n仓库容器做的另一件有用且重要的事情是，它提供了特定于仓库的根对象，可供基于 JavaScript 的控制器和响应模板使用。\n\
  \n仓库容器的配置可以在 Alfresco Web 应用的 `web-scripts-application-context.xml` 中找到，作为一个 ID\
  \ 为 `webscripts.container` 的 Bean 条目。\n\n在 Alfresco 的近期版本（4 及更高版本）中，实现类是 `org.alfresco.repo.web.scripts.TenantRepositoryContainer`，位于\
  \ `alfresco-remote-api-*.jar` 中。\n\n### 表示容器\n\n表示容器是一个轻量级实现，主要用于 Web 脚本渲染用户界面组件，并向远程仓库发出远程调用。它为\
  \ Web 脚本提供基本支持，以对远程数据源进行服务调用。\n\n这是 Alfresco 随附的 Spring Web 脚本实现中的普通容器。此容器实现使得在任何环境中托管\
  \ Web 脚本变得容易。\n\n表示容器的配置可以在 `spring-webscripts-*.jar` 中的 `web-scripts-application-context.xml`\
  \ 中作为 ID 为 `webscripts.container` 的 Spring Bean 条目找到。\n\n## 其他支持组件\n\n以下各节将探讨 Web\
  \ 脚本容器所依赖的其他各种组件，这些组件在 Web 脚本执行期间起着关键作用。\n\n### 配置服务\n\nWeb 脚本的所有相关 XML 配置文件均使用配置服务读取和解析。\n\
  \n实现类是 `org.springframework.extensions.config.xml.XMLConfigService`。\n\n### Web\
  \ 脚本注册表\n\n使用 Web 脚本注册表维护已注册到特定 Web 脚本容器的所有 Web 脚本的索引。\n\n实现类是 `org.springframework.extensions.webscripts.DeclarativeRegistry`。\n\
  \n### 格式注册表\n\n格式注册表是一种注册表，用于获取指定 MIME 类型对应的格式，也用于获取所提及格式对应的 MIME 类型。\n\n`org.springframework.extensions.webscripts.FormatRegistry`\
  \ 类包含实现细节。\n\n### 脚本处理器注册表\n\n脚本处理器注册表提供了一个脚本处理器，用于执行以 JavaScript 实现的 Web 脚本控制器的后端实现。\n\
  \n脚本处理器注册表的实现可以在 `org.springframework.extensions.webscripts.ScriptProcessorRegistry`\
  \ 中找到。\n\n用于执行基于 JavaScript 的控制器的脚本处理器是 `org.alfresco.repo.jscript.RhinoScriptProcessor`。\n\
  \n### 模板处理器注册表\n\n模板处理器注册表提供了执行 Web 脚本响应模板的模板处理器。\n\n它的实现可以在 `org.springframework.extensions.webscripts.TemplateProcessorRegistry`\
  \ 中找到。\n\n默认的 FreeMarker 模板处理器实现可在 `org.springframework.extensions.webscripts.processor.FTLTemplateProcessor`\
  \ 中找到。\n\n\n\n\n\n典型的部署架构是将所有数据 Web 脚本托管在 Alfresco 仓库服务器中。使用后端仓库的前端客户端可以使用展示 Web\
  \ 脚本来构建前端用户界面，而展示 Web 脚本将托管在客户端侧。前端客户端可以通过 HTTP 调用数据 Web 脚本以便与后端仓库交互。Alfresco 仓库服务器将使用\
  \ Servlet Runtime 来执行 Web 脚本。\n\n## Summary\n\n在本章中，我们详细学习了 Web 脚本执行流程及其技术细节。此外，我们还了解了共同构成\
  \ Web 脚本框架的各个组件。我们还了解了 Alfresco 为这些组件提供的各种开箱即用实现以及 Alfresco Web 脚本最常见的部署架构。\n\n\
  既然我们已经探索了 Alfresco 中的 Web 脚本框架，那么在下一章中，我们将详细了解构建 Web 脚本的各个组件。\n"
- "# 第4章：Web脚本的构建块\nWeb 脚本的\n构建块\n\n在本章中，我们将详细介绍创建 Web 脚本的不同组件：\n\n- 描述文档\n- Controller\
  \ 实现\n- 响应模板\n- I18N 消息包\n- 配置文档\n- 每个组件的命名约定\n\n## Web 脚本的构建块\n\nWeb 脚本是 Alfresco\
  \ 企业内容管理系统的一个关键特性，实现起来非常容易。深入了解构成 Web 脚本的组件将使你在 Alfresco 中开发 Web 脚本的工作变得更加轻松。\n\n\
  本章将为你提供有关 Web 脚本构建块的详细知识。彻底理解用于在 Alfresco 中开发 Web 脚本的不同工件是非常必要的。在你在任何项目中实施 Alfresco\
  \ Web 脚本的整个过程中，你在开发 Web 脚本时始终需要使用这些组件，因此，清楚地理解它非常重要，这样你就可以在需要时快速轻松地实现 Web 脚本。\n\n\
  Alfresco 提供了一个强大的 Web 脚本框架，使用熟悉的技术（如脚本和模板语言）即可轻松创建 Web 脚本。每个 Web 脚本都必须有一个描述文档，并且至少有一个或多个\
  \ FreeMarker 响应模板文档。Web 脚本可以可选地有一个作为后端实现的控制器，它将根据定义的业务逻辑对 Alfresco 仓库执行必要的处理。也可以进行一些可选的高级实现，为\
  \ Web 脚本响应提供消息包以及根据需要对 Web 脚本进行一些配置选项。\n\n让我们详细了解 Web 脚本的每个组件，以便更好地理解它们。\n\n## 描述文档\
  \ – 必不可少！\n\n在开发 Web 脚本时，首先要做的是进行简要练习，确定 Web 脚本的 URI 和 HTTP 方法、提供给 Web 脚本的任何参数、为\
  \ Web 脚本使用的响应格式、检查是否需要对 Web 脚本使用任何身份验证、以及检查是否需要与仓库进行后端处理，然后开始实现并首先为 Web 脚本创建描述文档。\n\
  \n描述文档是 Web 脚本实现的核心，它基本上是一个 XML 文件。它描述了有关 Web 脚本的重要细节。任何查看描述文档的开发人员都可以大致了解 Web 脚本的作用。\n\
  \n这是创建 Alfresco 中的 Web 脚本时需要开发的第一个文件。Web 脚本描述文档中必须提供某些强制性声明。除此之外，还可以为 Web 脚本可选地提供额外的声明。现在让我们看看可以在描述文档中提供的各种声明。我们将逐一查看选项，这将让你清楚地了解如何从头开始创建描述文档\
  \ `helloworld.get.desc.xml`，用于我们之前创建的 hello world Web 脚本。\n\n## Mandatory declarations\n\
  \n现在让我们回顾一下在创建 Web 脚本时必须在描述文档中提供的元素。\n\n### The `<webscript>` tag\n\n有关 Web 脚本的所有信息都包含在\
  \ Web 脚本描述文档中，位于根元素 `<webscript>` 内：\n\n```\n```xml\n<webscript>\n\n</webscript>\n\
  ```\n```\n\n如果未指定上述根元素标签并创建空白描述文档 XML 文件，则在注册 Web 脚本时，日志中会出现错误，并且你将无法注册 Web 脚本。\n\
  \n以下是日志中的错误片段：\n\n```\n```text\nUnable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
  \ due to error:\nFailed to parse web script description document helloworld.get.desc.xml;\
  \ Error on line -1 of document: Premature end of file. Nested exception: Premature\
  \ end of file.\n```\n```\n\n### The `<shortname>` tag\n\n对于任何 Web 脚本，都会给出一个人类可读的\
  \ Web 脚本名称。它可以按以下代码行所示在 `<shortname>` 标签内提供。此标签没有属性。\n\n```\n```xml\n<shortname>Hello\
  \ World</shortname>\n```\n```\n\n如果尝试在未提供 shortname 值的情况下注册 Web 脚本，则它将无法注册。以下是在日志中出现的错误片段：\n\
  \n> **Unable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
  \ due to error: Failed to parse web script description document helloworld.get.desc.xml;\
  \ Expected <shortname> value.**\n\n### The `<url>` tag\n\n每个 Web 脚本都绑定到一个 URI，该\
  \ URI 将用于调用 Web 脚本。可以为 Web 脚本声明一个或多个 URI，并且可以使用任何 URI 来执行 Web 脚本。此标签没有属性：\n\n```\n\
  ```xml\n<url>/helloworld?name={argumentName}</url>\n<url>/hello/world/{argumentName}</url>\n\
  ```\n```\n\n如果在描述文档中未提供 URL 并尝试注册 Web 脚本，它将给出错误并且不会注册 Web 脚本。以下是当 Web 脚本描述文档中没有提供任何\
  \ URL 时日志中的错误片段：\n\n> **Unable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
  \ due to error: Failed to parse web script description document helloworld.get.desc.xml;\
  \ Expected at least one <url> element.**\n\n如果一个 URL 已在一个 Web 脚本中定义，并且你尝试在另一个 Web\
  \ 脚本中定义相同的 URL，则 Web 脚本引擎将不会注册 Web 脚本，并且日志中会出现如下示例所示的错误：\n\n> **Unable to register\
  \ script classpath:alfresco/extension/templates/webscripts/test/helloworld1.get.desc.xml\
  \ due to error: Web Script document test/helloworld1.get.desc.xml is attempting\
  \ to define the url '/helloworld1:GET' already defined by test/helloworld.get.desc.xml.**\n\
  \n一个包含 hello world Web 脚本所有强制元素的最小描述文件将如下所示：\n\n```\n```xml\n<webscript>\n    <shortname>Hello\
  \ World</shortname>\n    <url>/helloworld?name={argumentName}</url>\n    <url>/hello/world/{argumentName}</url>\n\
  </webscript>\n```\n```\n\n## Optional declarations\n\n除了强制性声明之外，还可以在描述文档中声明一些额外的元素。让我们了解一下\
  \ Web 脚本描述文档可能的 optional 声明。\n\n### <format>\n\n此元素允许你通过在调用 Web 脚本时使用 Web 脚本 URI\
  \ 来指定响应内容类型。它基本上允许你控制如何指定 Web 脚本响应格式。可以为此元素定义不同的可能有效值，并在后续章节中提及。此元素有一个可选属性名为 default。\n\
  \n### argument\n\n让我们看看描述文档中格式标签的值为 argument 的情况。它将如下所示：\n\n```\n<format default=\"\
  html\">argument</format>\n```\n\n为 format 元素指定值 argument 表示可以通过向 Web 脚本 URL 添加参数来选择\
  \ Web 脚本的响应格式。使用查询字符串参数 format，可以按如下方式指定响应内容类型：\n\n```\nhttp://localhost:8080/alfresco/service/helloworld?name=Ramesh&format=xml\n\
  ```\n\n### extension\n\n格式标签的值为 extension 时将在描述文档中如下所示：\n\n```\n<format default=\"\
  html\">extension</format>\n```\n\n可以通过在调用 Web 脚本时向 Web 脚本 ID 添加扩展名来指定响应内容类型，如下所示：\n\
  \n```\nhttp://localhost:8080/alfresco/service/helloworld.xml?name=Ramesh\n```\n\n\
  \n\n\n\n## any\n\n在描述文档中，当 `any` 被指定为 `format` 标签的值时，响应格式可以使用前面提到的任意方法来指定。在描述文档中没有指定\
  \ `format` 元素的情况下，它会被视为与将 `format` 值指定为 `any` 相同。其值为 `any` 的 `format` 标签在描述文档中会显示如下：\n\
  \n```\n<format default=\"html\">any</format>\n```\n\n> 在调用 Web 脚本时，如果没有指定响应内容类型，那么默认内容类型将使用\
  \ `format` 标签的 `default` 属性。如果未设置 `default` 属性，则其默认值为 HTML。某些 Web 脚本也可能在运行时决定响应内容类型。对于这些脚本，需要将\
  \ `default` 属性设为空白，例如 `default=\"\"`。\n\n## <authentication>\n\n为了安全地访问 Web 脚本，指定\
  \ Web 脚本所需的身份验证级别非常重要。这个可选的标签声明可以用于定义该级别。它有一个可选属性：`runas`。该元素可以指定的不同值将在后续章节中解释。\n\
  \n### none\n\n如果你要实现一个不需要身份验证的 Web 脚本，可以在 Web 脚本的描述文档中按如下方式指定 `authentication` 标签：\n\
  \n```\n<authentication>none</authentication>\n```\n\n当描述文档中也没有指定 `authentication`\
  \ 标签时，这是默认值。它表示运行该 Web 脚本不需要任何身份验证。\n\n> 在身份验证被指定为 `none` 的 Web 脚本中，将无法与仓库进行交互。\n\
  \n### guest\n\n你可以按如下方式使用 `guest` 值指定 `authentication` 标签：\n\n```\n<authentication>guest</authentication>\n\
  ```\n\n上一行表示运行该 Web 脚本时，至少需要 guest 级别的身份验证。\n\n### user\n\n你可以按如下方式将 `authentication`\
  \ 标签的值指定为 `user`：\n\n```\n<authentication>user</authentication>\n```\n\n这表示运行该 Web\
  \ 脚本时，至少需要仓库的命名用户身份验证。\n\n### admin\n\n你可以按如下方式将 `authentication` 标签的值指定为 `admin`：\n\
  \n```\n<authentication>admin</authentication>\n```\n\n上一行表示运行该 Web 脚本时需要仓库的管理员用户身份验证。管理员用户基本上就是属于\
  \ `ALFRESCO_ADMINISTRATORS` 组的用户。\n\n> 也可以指定以某个特定的 Alfresco 仓库用户身份执行 Web 脚本，而无需考虑是谁发起了该\
  \ Web 脚本。这可以通过 `authentication` 元素的 `runas` 属性来指定，例如 `runas=\"admin\"`。\n> 需要注意的是，此属性仅适用于放置在\
  \ Java 类路径中的 Web 脚本。\n\n## <transaction>\n\n还可以使用这个可选的 `transaction` 元素来指定执行 Web\
  \ 脚本的事务级别。该元素有两个可选属性：`allow` 和 `buffersize`。该元素可以使用的不同有效值如下列小节所示：\n\n### none\n\n\
  其值为 `none` 的 `transaction` 在描述文档中会显示如下：\n\n```\n<transaction>none</transaction>\n\
  ```\n\n上一行表示运行该 Web 脚本不需要任何事务。\n\n`family` 标签的一个示例如下：\n\n```\n<family>CMIS</family>\n\
  ```\n\n当你访问 http://localhost:8080/alfresco/service/index 页面时，你会找到一个基于 `family` 浏览\
  \ Web 脚本的选项。例如，你会找到一个链接 **浏览“CMIS”Web 脚本**，用来查看所有归类为 CMIS 家族的 Web 脚本。\n\n## <cache>\n\
  \n缓存是一个非常好的特性，有助于避免为每个请求重新生成响应。Alfresco 中的 Web 脚本框架使用 HTTP 定义的缓存机制。对于 Web 脚本，可以使用这个可选元素来提供所需的缓存级别。当\
  \ Web 脚本被调用时，Web 脚本框架会将该元素的声明转换为合适的响应头来管理缓存。带有其子元素的 `cache` 标签在描述文档中会显示如下：\n\n```\n\
  <cache>\n    <never>false</never>\n    <public>true</public>\n    <mustrevalidate/>\n\
  </cache>\n```\n\n该标签的不同可选子元素将在后续章节中解释。\n\n### never\n\n这表示是否应对 Web 脚本响应进行缓存。默认值为\
  \ `true`，表示 Web 脚本响应将永远不会被缓存。另一个可选值为 `false`，用于指定允许缓存 Web 脚本响应。\n\n### public\n\n\
  这用于指定经过身份验证的 Web 脚本响应是否应缓存在公共缓存中。`true` 值表示可以缓存 Web 脚本响应，而 `false` 表示不能缓存 Web 脚本响应。默认值为\
  \ `false`。\n\n### mustrevalidate\n\n这用于指示缓存是否应重新验证其 Web 脚本响应版本，以提供最新的响应数据。`true`\
  \ 值表示必须始终进行验证，而 `false` 表示可能需要进行验证。默认值始终为 `true`。\n\n## <negotiate>\n\n对于特定的 Web\
  \ 脚本响应格式，可以使用这个可选元素来提供 Accept 头的 MIME 类型。在描述文档中可以有多个该元素的条目。必须为此标签提供值。该值将包含响应格式的类型。同时，必须提供包含\
  \ MIME 类型的 `accept` 属性。\n\n```xml\n<negotiate accept=\"text/html\">html</negotiate>\n\
  <negotiate accept=\"text/xml\">xml</negotiate>\n```\n\n在描述文档中定义一个 `negotiate` 元素后，内容协商即被启用。\n\
  \n> 理解 `negotiate` 和 `format` 元素之间的关联是很有趣的。每个 Web 脚本都会以响应流的形式返回结果，并且可能会根据 MIME 类型进行编码。如果在调用\
  \ Web 脚本时没有提供任何关于 MIME 类型的提示，那么 Web 脚本框架将使用其预定义的编码。在调用 Web 脚本时，可以提供提示，让脚本框架知道响应的\
  \ MIME 类型。使用 `format` 元素，可以以 URL 扩展名或格式参数的形式指定响应格式，该格式会映射到 Web 脚本框架中的 MIME 类型。另一种选择是指定\
  \ Accept 头，这可以通过 `negotiate` 元素来完成。\n\n## <lifecycle>\n\n`lifecycle` 元素用于描述 Web\
  \ 脚本的生命周期阶段。该元素可以在描述文档中按如下方式指定：\n\n```xml\n<lifecycle>sample</lifecycle>\n```\n\n\
  Web 脚本在其开发生命周期中，最初可能处于草稿状态，然后在生产模式中完全使用，最后在不再使用时被弃用。可以使用该元素为 Web 脚本指定这些阶段。该元素的不同可能值如下列小节所示。\n\
  \n### none\n\n这表示该 Web 脚本不属于任何生命周期。\n\n### sample\n\n这表示该 Web 脚本是一个示例 Web 脚本，不应用于生产环境。\n\
  \n### draft\n\n这表示该 Web 脚本仍处于实验阶段，尚未完全完成。\n\n### public_api\n\n这表示该 Web 脚本是 Alfresco\
  \ 公共 API 的一部分，因此经过了全面测试，必须保持稳定。\n\n### draft_public_api\n\n这表示它将成为 Alfresco 公共 API\
  \ 的一部分，但尚未完全完成，或者仍在进行一些更改。\n\n### deprecated\n\n这表示该 Web 脚本已被弃用，不应再使用，并且该 Web 脚本可能会从未来的\
  \ Alfresco 版本中移除。\n\n### internal\n\n这表示该 Web 脚本仅供 Alfresco 内部使用。因此，对于不同版本，它可能会根据\
  \ Alfresco 内部使用情况而改变，并且有可能在未来的 Alfresco 版本中发生变化。\n\n> `<lifecycle>` 元素是一个可选元素。通常，对于你为项目开发的自定义\
  \ Web 脚本，并不一定要为 Web 脚本指定 lifecycle 值。因此，你可能不会使用该元素。\n\n## <formdata>\n\n在 Web 脚本的描述文档中，你可以按如下方式指定\
  \ `formdata` 标签：\n\n```\n<formdata multipart-processing=\"false\" />\n```\n\n它有一个名为\
  \ `multipart-processing` 的属性。这可用于指定 Web 脚本的多部分表单数据处理是开启还是关闭。可选值为 `true`（表示表单数据的\
  \ multipart 处理已开启）和 `false`（表示已关闭）。默认值为 `true`。\n\n\n\n\n\n## <args>\n\nThe args\
  \ element is used generally for documentation purposes to describe the arguments\
  \ passed to the web script. It has the child element arg, which has child elements\
  \ name, which specifies the name of the argument, and description, which specifies\
  \ a description of the argument. The args tag with its child element will appear\
  \ in the description document as follows:\n\n```\n<args>\n  <arg>\n    <name>name</name>\n\
  \    <description>the name to display for helloworld webscript</description>\n \
  \ </arg>\n</args>\n```\n\n## <requests>\n\nThe requests element can be used to specify\
  \ the collection of request types. It has request as a child element, which has\
  \ type as an attribute. This tag will appear in the description document as follows:\n\
  \n```\n<requests>\n  <request type=\"cmis.atomentry\" />\n</requests>\n```\n\n##\
  \ <responses>\n\nThe responses element can be used to specify the collection of\
  \ response types. It has response as a child element, which has type as the attribute.\
  \ This tag will appear in the description document as follows:\n\n```\n<responses>\n\
  \  <response type=\"cmis.atomentry\"/>\n</responses>\n```\n\n## kind\n\nThe kind\
  \ attribute is an optional attribute to the root tag <webscript>. A special kind\
  \ of implementation can be done for web scripts, which is basically a Java backend\
  \ implementation. For example, in a scenario where you want to develop web scripts\
  \ that need to return large content as the response, a Java-backed web script implementation\
  \ can be developed for this scenario. The kind attribute allows you to provide a\
  \ name for this implementation. Now, for any web script you are developing that\
  \ has to render large amount of content, the kind attribute can be used in the description\
  \ document to explicitly mention that it should use the custom Java backend implementation\
  \ created.\n\nHere is an example of how the `kind` attribute is used in the out-of-the-box\
  \ Alfresco web script, `tomcat/webapps/alfresco/WEB-INF/classes/alfresco/templates/webscripts/org/alfresco/repository/thumbnail/thumbnail.get.desc.xml`,\
  \ inside your Alfresco installation directory. If you are using Alfresco Community\
  \ 5, the `thumbnail.get.desc.xml` file can be located under the `alfresco` package\
  \ in `alfresco-remote-api-*.jar`.\n\n```\n<webscript kind=\"org.alfresco.repository.content.stream\"\
  >\n```\n\n## Controller implementation – not mandatory!\n\nThe actual business logic\
  \ for a web script resides in the web script controller. The main functionalities\
  \ such as interacting with repository, for example, to query the repository, add\
  \ content, update content, delete content, and so on are part of the web script\
  \ controller implementation.\n\nThere are two types of controller implementations\
  \ possible to implement while creating web scripts in Alfresco:\n\n- The JavaScript-backed\
  \ controller\n- The Java-backed controller\n\n## The JavaScript-backed controller\n\
  \nJavaScript-backed controller is known as the web script controller script that\
  \ has the web script business logic implemented in a JavaScript file. Alfresco provides\
  \ a set of JavaScript APIs that can be used in the web script controller to interact\
  \ with the Alfresco backend repository. A JavaScript controller can read the query\
  \ string parameters of the web script URI, perform the required repository operations,\
  \ and populate the model object to render the response.\n\nWe have already seen\
  \ the basic implementation of JavaScript controller for our hello world web script.\n\
  \n## Understanding when to use the JavaScript controller\n\nHere are a few generic\
  \ points that explain when you should go for JavaScript controller implementation\
  \ for your web script:\n\n- When the repository operations you are trying to perform\
  \ can be easily done using the available Alfresco JavaScript API, you might choose\
  \ this controller\n\nBuilding Blocks of Web Scripts\n\n- The JavaScript controller\
  \ has an advantage that if you have developed a web script that has a controller\
  \ using the JavaScript implementation, you do not need to restart the server to\
  \ deploy and use your web script\n- No additional tooling is required; you can simply\
  \ use any editor to create the web script, no compilation is required, and is easy\
  \ to deploy in the repository\n\n## The Java-backed controller\n\nThe Java-backed\
  \ controller is another type of controller implementation possible to implement\
  \ for a web script that might have the complete business logic processing implemented\
  \ in Java.\n\nWhen you are implementing a Java-backed controller, you will have\
  \ access to all the content application services available in Alfresco. Business\
  \ logic implementation for a web script can be provided in JavaScript- or Java-based\
  \ controller; the only difference is that Java-backed controller is implemented\
  \ in Java and it has access to all the available content application services in\
  \ Alfresco.\n\n## Understanding when to use a Java-backed controller\n\nLet's take\
  \ a look at a few points about when you should go for the Java-backed controller\
  \ implementation for your web script:\n\n- Generally, when the JavaScript controller\
  \ cannot do the repository operations you want to do using the available Alfresco\
  \ JavaScript API, you should implement the Java-backed controller.\n- When you want\
  \ to override the rendering of a response, for example, rendering large content\
  \ in response, you should use this controller.\n- Consider that you will require\
  \ experience in Java programming. You will also require compilation of the Java\
  \ code, classpath deployment of web scripts, and even server restart in order to\
  \ use Java-backed web script. If all of this looks fine to achieve your business\
  \ functionality in time, then you can go for implementing Java-backed controller.\n\
  \n> A web script can also have both JavaScript- and Java-backed controllers. In\
  \ such a scenario, the Java-backed controller will first get executed and then JavaScript-based\
  \ implementation gets executed when the web script is invoked.\n\n## Response templates\
  \ – yes, they are required!\n\nResponse templates are basically used to render the\
  \ web script response. In MVC terms, response templates play a role of views. The\
  \ output of the web script is rendered in the required formats using the web script\
  \ response templates.\n\nIt is possible to have multiple response templates for\
  \ a web script, and based on the requested response content type while invoking\
  \ a web script, a response can be rendered using the appropriate response template.\n\
  \nResponse template also has access to web script query string parameters along\
  \ with the data items provided by the controller script and access to some common\
  \ content repository entry points.\n\nWe have already seen rendering response for\
  \ our hello world web script.\n\n> For JavaScript-based web scripts, response templates\
  \ are always required. There are certain implementations of Java-backed web scripts\
  \ where response can be directly rendered from the Java controller. In such case,\
  \ there is no need to specify response template for the web script. We are going\
  \ to cover Java-backed web scripts in detail in Chapter 6, Creating Java-backed\
  \ Web Scripts.\n\n## I18N for a web script – it's optional\n\nInternationalization\
  \ is a cool feature that can be very useful while creating web scripts.\n\nThere\
  \ may be times when you are required to develop a web script that will directly\
  \ be used by the end users, and hence, you need a human-readable web script response\
  \ in the user's language. No worries, it is possible to provide I18N support to\
  \ the web scripts in Alfresco, and hence, you can have the text in the response\
  \ rendered in the preferred supported user languages.\n\nWe will also extend our\
  \ hello world web script to have internationalization support and will get understanding\
  \ of how to make a web script render a response using internationalization.\n\n\
  There are two things to be done in order to achieve this:\n\n- Creating a resource\
  \ bundle for different languages\n- Modifying the response template to use the labels\
  \ from the resource bundle\n\n## Adding a resource bundle for the hello world web\
  \ script\n\nIn order to add a resource bundle for a web script, the first thing\
  \ we need to do is create a resource bundle for the different languages.\n\nAfter\
  \ logging in to Alfresco Share, create `helloworld.get.properties` at the **Repository\
  \ | Data Dictionary | Web Scripts Extensions** location, and add the following content\
  \ to it:\n\n```\ngreeting.title=Hello!\nemail.title=email address\n```\n\nNow, at\
  \ the same location, create `helloworld.get_de.properties` and add the following\
  \ content to it:\n\n```\ngreeting.title=Hallo!\nemail.title=E-Mail-Adresse\n```\n\
  \nWe have just created two properties files and made the text able to be rendered\
  \ in the web script response in two different languages: English and German.\n\n\
  ## Modifying the response template to use labels\n\nNow, in order to use the labels\
  \ added in the resource bundle, we will have to modify the response template. Perform\
  \ the following steps to modify the response template for the hello world web script:\n\
  \n- 1. Modify `helloworld.get.html.ftl` available at the **Repository | Data Dictionary\
  \ | Web Scripts Extensions** location as follows:\n\n```\n<html>\n  <body>\n   \
  \ <p>${msg(\"greeting.title\")} ${args.name}.</p>\n    <p>${msg(\"email.title\"\
  )}: ${email}</p>\n  </body>\n</html>\n```\n\nWe have just modified our response\
  \ template to use the text from the resource bundle.\n\n- 2. Now, go to `http://localhost:8080/alfresco/service/index`\
  \ and click on the **Refresh Web Scripts** button.\n\n- 3. To test this, temporarily\
  \ change the preferred browser language to Germany de-DE and hit the `http://localhost:8080/alfresco/service/helloworld?name=Ramesh`\
  \ URL. You should see the response rendered using the labels rendered from German\
  \ properties file we created.\n\n\n\n\n\n## 配置文件——可选\n\n可以为Alfresco Web脚本指定配置参数。它们可以从控制器以及响应模板中访问。为了理解这个概念，我们来看一个简单的示例：您希望在Web脚本输出中显示服务器环境（开发、测试、预发布或生产服务器）。您可以做的一件事是在控制器中指定相同内容，但理想情况下，控制器不应操心此类配置。相反，这可以单独处理，控制器或模板只需使用这些值即可。通过Web脚本配置文件，可以实现脚本特定的配置。\n\
  \n在Repository | Data Dictionary | Web Scripts Extensions位置创建helloworld.get.config.xml，并向其中添加以下内容：\n\
  \n```\n<properties>\n    <envname>Dev</envname>\n</properties>\n```\n\n## 在控制器中访问配置\n\
  \n在JavaScript控制器中，envname属性可以如下方式访问：\n\n```\nvar env = new XML(config.script);\n\
  logger.log(env.envname);\n```\n\n您可以在模型对象中设置envname属性的值，并在响应模板上渲染该值。\n\n## 在模板中访问配置\n\
  \n当Web脚本没有可用的控制器实现时，可以在响应FreeMarker模板中直接访问envname属性，如下所示：\n\n```\n${config.script[\"\
  properties\"][\"envname\"]}\n```\n\n我们已经看到了两种从Web脚本配置显示值的不同方式。相信您现在可以轻松地在hello world\
  \ Web脚本中进行测试并查看结果。\n"
- "# 第5章：调用Web脚本\n### 调用Web脚本\n\n本章将介绍如何以不同方式调用Alfresco Web脚本，例如：\n\n- 通过Web浏览器和REST客户端插件调用Web脚本\n\
  - 通过独立的Java程序执行Web脚本\n- 从基于Spring的服务中调用Web脚本\n- 从Alfresco Share中以不同方式调用Web脚本\n-\
  \ 从命令行调用Web脚本\n- 从JSF页面或JSR-168门户调用Web脚本\n- 处理客户端的限制\n\n在Alfresco中使用Web脚本时，您可能会遇到一些情况，想知道如何执行Web脚本。例如，一些常见的实际场景：在开发Web脚本时，您会希望对其进行单元测试。您需要调用Web脚本以验证它工作正常并返回预期输出。在支持项目中，当使用后端Alfresco存储库开发自定义前端应用程序时，在调试期间修复问题的过程中，您需要执行Web脚本并验证响应，以确定问题是前端问题还是后端问题。在定制Alfresco\
  \ Share时，您需要调用Alfresco存储库的Web脚本。有时，您可能需要从独立的Java类调用Web脚本。可能您有一个基于Spring的应用程序，想要在调用Alfresco\
  \ Web脚本。有时，您可能还需要从Linux shell脚本调用Web脚本，此类场景还有很多。\n\n了解如何在这些基本的、可能的实际实现场景中调用Web脚本非常有用。在本章中，我们将介绍如何在前面提到的常见场景中调用Web脚本，这些场景是任何开发人员在使用Alfresco时都会遇到的。\n\
  \n## 从Web浏览器调用Web脚本\n\n调用Web脚本最简单的方法之一是通过Web浏览器。这对每个人来说都是一个方便的选择。Web浏览器是大家在开发Web脚本时通常用来调用Web脚本进行测试的常见客户端。\n\
  \n您开发的每个HTTP GET Web脚本都可以通过浏览器访问Web脚本URL来执行。如果Web脚本需要任何身份验证，则会弹出身份验证窗口以提供身份验证详细信息。\n\
  \n## 使用Web浏览器插件执行Web脚本\n\n要测试您为POST、PUT或DELETE创建的Web脚本，不能直接从Web浏览器执行。您需要通过浏览器提供的插件来调用HTTP\
  \ POST、PUT或DELETE请求。浏览器插件有多种选择。这里我们将介绍两个插件。\n\n## Poster——Firefox插件\n\n一个插件选项是名为Poster的Firefox插件。您可以从Firefox插件链接下载该插件：https://addons.mozilla.org/。如果您已经安装了Firefox，请打开Firefox浏览器，进入插件链接并搜索Poster，然后从显示的插件列表中添加到Firefox。另一种更快更简单的安装方式是进入“工具\
  \ | 附加组件”，搜索Poster并点击“安装”按钮。\n\n安装插件后，进入“工具 | Poster”打开Poster窗口。在此窗口中，您可以提供Web脚本URL、身份验证凭据、请求标头、参数，并指定调用Web脚本的HTTP方法。\n\
  \n## 适用于Chrome的Advanced REST client\n\n另一个好的插件选项是适用于Chrome的Advanced REST client扩展。您可以从此Chrome应用商店链接下载该插件：https://chrome.google.com/webstore/category/apps。如果您已经安装了Chrome，请打开Chrome浏览器，进入我们刚才提到的链接并搜索advanced\
  \ rest client，然后从显示的结果列表中按照Chrome扩展安装流程安装Advanced REST client。另一种更快更简单的安装方式是通过“工具\
  \ | 扩展程序”并点击“获取更多扩展程序”链接。现在，搜索Advanced REST client，并从显示的结果列表中按照Chrome扩展安装流程安装该插件。\n\
  \n安装Advanced REST client插件后，要启动它，请在Chrome浏览器地址栏中输入chrome-extension://hgmloofddfdnphfgcellkdfbfbjeloo/RestClient.html。另一种快速简便的启动方式是直接在地址栏中输入chrome://apps并回车。您会在这里看到Advanced\
  \ REST client，点击即可。现在，您可以通过适用于Chrome的Advanced REST client插件执行所有GET、POST、PUT和DELETE方法的Web脚本。\n\
  \n## 从独立Java程序执行Web脚本\n\n从Java程序调用Web脚本有多种选项。在这里，我们将结合代码片段详细演练Apache commons HttpClient\
  \ API，以了解如何从Java程序执行Web脚本，并简要介绍一些其他可用于从Java程序调用Web脚本的替代方案。\n\n## HttpClient\n\n\
  执行Web脚本的一种方式是使用`org.apache.commons.httpclient.HttpClient` API调用Web脚本。该类可在`commons-httpclient-3.1.jar`中找到。使用HttpClient\
  \ API执行Web脚本还需要`commons-logging-*.jar`和`commons-codec-*.jar`作为支持JAR包。这些JAR包位于Alfresco安装目录中的`tomcat\\\
  webapps\\alfresco\\WEB-INF\\lib`下。您需要将它们包含到项目的构建路径中。我们将尝试从独立Java程序使用HttpClient执行hello\
  \ world Web脚本。使用HttpClient时，通常需要遵循以下步骤：\n\n- 1. 创建一个新的HttpClient实例。\n- 2. 下一步是创建一个方法实例（我们将使用GetMethod）。URL需要传递给方法的构造函数。\n\
  - 3. 如果需要，设置任何参数。\n- 4. 如果需要，提供身份验证详细信息。\n- 5. 让HttpClient执行该方法。\n- 6. 读取响应状态码和响应。\n\
  - 7. 最后，释放连接。\n\n## 理解如何使用HttpClient调用Web脚本\n\n考虑前面提到的步骤，让我们看以下代码片段。为了测试此代码，您可以创建一个带有main方法的独立Java程序，将以下代码片段放入Java程序中，然后根据需要修改Web脚本URL/凭据。以下代码片段中提供了注释，方便您将前面的步骤与代码对应起来：\n\
  \n```java\n// Create a new instance of HttpClient\nHttpClient objHttpClient = new\
  \ HttpClient();\n\n// Create a new method instance as required. Here it is GetMethod.\n\
  GetMethod objGetMethod = new GetMethod(\"http://localhost:8080/alfresco/service/helloworld\"\
  );\n\n// Set querystring parameters if required.\nobjGetMethod.setQueryString(new\
  \ NameValuePair[] { new NameValuePair(\"name\", \"Ramesh\") });\n\n// set the credentials\
  \ if authentication is required.\n```\n\n\n\nCredentials defaultcreds = new UsernamePasswordCredentials(\"\
  admin\",\"admin\");\nobjHttpClient.getState().setCredentials(new\nAuthScope(\"localhost\"\
  ,8080, AuthScope.ANY_REALM), defaultcreds);\n\ntry {\n    // Now, execute the method\
  \ using HttpClient.\n    int statusCode = objHttpClient.executeMethod(objGetMethod);\n\
  \    if (statusCode != HttpStatus.SC_OK) {\n        System.err.println(\"Method\
  \ invocation failed: \" +\n            objGetMethod.getStatusLine());\n    }\n\n\
  \    // Read the response body.\n    byte[] responseBody = objGetMethod.getResponseBody();\n\
  \n    // Print the response body.\n    System.out.println(new String(responseBody));\n\
  \n} catch (HttpException e) {\n    System.err.println(\"Http exception: \" + e.getMessage());\n\
  \    e.printStackTrace();\n} catch (IOException e) {\n    System.err.println(\"\
  IO exception transport error: \" +\n        e.getMessage());\n    e.printStackTrace();\n\
  } finally {\n    // Release the method connection.\n    objGetMethod.releaseConnection();\n\
  }\n\n> 请注意，Apache commons 客户端现在是一个遗留项目，不再进行开发。该项目已被 Apache HttpComponents 项目中的 HttpClient\
  \ 和 HttpCore 模块所取代。我们在此使用了来自 Apache commons 客户端的 HttpClient，以获得整体的理解。\n\n在后续章节中提到了从\
  \ Java 程序调用 Web 脚本的其他一些选项。\n\n## URLConnection\n\n从 Java 程序执行 Web 脚本的一个选项是使用 java.net.URLConnection。有关更多详细信息，您可以参考\
  \ http://docs.oracle.com/javase/tutorial/networking/urls/readingWriting.html。\n\n\
  ## Apache HTTP components\n\n从 Java 程序执行 Web 脚本的另一个选项是使用 Apache HTTP components，它们是用于\
  \ HTTP 通信的最新可用 API。这些组件提供更好的性能和更大的灵活性，可在 httpclient-*.jar 和 httpcore-*.jar 中获得。这些\
  \ JAR 文件可在您的 Alfresco 安装目录中位于 tomcat\\webapps\\alfresco\\WEBINF\\lib 位置。有关更多详细信息，请参阅\
  \ https://hc.apache.org/httpcomponents-client-4.3.x/quickstart.html，以了解如何从 Java\
  \ 程序执行 HTTP 调用。\n\n## RestTemplate\n\n另一个替代方案是使用位于 tomcat\\webapps\\alfresco\\WEB-INF\\\
  lib 中您的 Alfresco 安装目录内的 org.springframework.web-*.jar 中的 org.springframework.web.client.RestTemplate。如果您使用的是\
  \ Alfresco Community 5，则 RestTemplate 类可在 spring-web-*.jar 中获得。通常，RestTemplate 用于\
  \ Spring 基础服务中以调用 HTTP 通信。\n\n## Calling web scripts from Spring-based services\n\
  \n如果您需要从 Spring 基础服务调用 Alfresco Web 脚本，则需要使用 RestTemplate 来调用 HTTP 调用。这是从 Spring\
  \ 基础类执行 HTTP 调用的最常用的技术。为此，需要执行以下步骤。代码片段也已提供：\n\n+   1. 在 Spring 上下文文件中定义 RestTemplate：\n\
  +   ```\n+   <bean id=\"restTemplate\" class=\"org.springframework.web.client.RestTemplate\"\
  \ />\n+   ```\n\n+   2. 在 Spring 上下文文件中，将 restTemplate 注入到您的 Spring 类中，如以下示例所示：\n\
  +   ```\n+   <bean id=\"httpCommService\" class=\"com.test.HTTPCallService\">\n\
  +       <property name=\"restTemplate\" value=\"restTemplate\" />\n+   </bean>\n\
  +   ```\n\n+   3. 在 Java 类中，按如下方式定义 `restTemplate` 的 setter 方法：\n\n```\nprivate\
  \ RestTemplate restTemplate;\npublic void setRestTemplate(RestTemplate restTemplate)\
  \ {\n    this.restTemplate = restTemplate;\n}\n```\n\n+   4. 为了调用具有用户身份验证级别的 Web\
  \ 脚本，您可以在 Java 类中使用 RestTemplate，如以下代码片段所示。以下代码片段是从 Spring 基础服务中使用 RestTemplate\
  \ 调用 hello world Web 脚本的示例：\n\n// setup authentication\nString plainCredentials\
  \ = \"admin:admin\";\nbyte[] plainCredBytes = plainCredentials.getBytes();\nbyte[]\
  \ base64CredBytes = Base64.encodeBase64(plainCredBytes);\nString base64Credentials\
  \ = new String(base64CredBytes);\n\n// setup request headers\nHttpHeaders reqHeaders\
  \ = new HttpHeaders();\nreqHeaders.add(\"Authorization\", \"Basic \" + base64Credentials);\n\
  HttpEntity<String> requestEntity = new\nHttpEntity<String>(reqHeaders);\n\n// Execute\
  \ method\nResponseEntity<String> responseEntity = restTemplate.\nexchange(\"http://localhost:8080/alfresco/service/\n\
  helloworld?name=Ramesh\", HttpMethod.GET, requestEntity, String.\nclass);\nSystem.out.println(\"\
  Response:\"+responseEntity.getBody());\n\n## Invoking a web script from Alfresco\
  \ Share\n\n在定制 Alfresco Share 时，您需要调用 Alfresco 仓库 Web 脚本。在 Alfresco Share 中，您可以从两个地方调用仓库\
  \ Web 脚本。一个是组件级展示 Web 脚本，另一个是客户端 JavaScript。\n\n## Calling a web script from the\
  \ presentation web script JavaScript controller\n\nAlfresco Share 使用展示 Web 脚本渲染用户界面。这些展示\
  \ Web 脚本调用仓库 Web 脚本以渲染仓库数据。仓库 Web 脚本在组件渲染文件（例如，`get.html.ftl`）加载之前被调用。\n\n在开箱即用的\
  \ Alfresco 安装中，您应该能够在 `tomcat\\webapps\\share\\WEB-INF\\classes\\alfresco\\site-webscripts`\
  \ 下看到组件的展示 Web 脚本。\n\n在开发自定义组件时，您需要编写一个展示 Web 脚本。展示 Web 脚本将调用仓库 Web 脚本。您可以按如下方式调用仓库\
  \ Web 脚本：\n\n```\nvar response = remote.call(\"url of web script as defined in description\
  \ document\");\nvar obj = eval('(' + response + ')');\n```\n\n在前面的代码片段中，我们使用了开箱即用的\
  \ remote 对象来调用仓库 Web 脚本。需要注意的重要一点是，我们必须提供在描述文档中定义的方式的 Web 脚本 URL。没有必要提供主机或端口名称、应用程序名称和服务路径等初始部分，就像我们在从\
  \ Web 浏览器调用 Web 脚本时使用的方式一样。一旦收到响应，就可以使用 `eval` 函数解析 Web 脚本响应。\n\n在 Alfresco Share\
  \ 的开箱即用代码中，您可以找到展示 Web 脚本调用仓库 Web 脚本，如我们在前面的代码片段中所见。例如，查看位于您的 Alfresco 安装目录内 `tomcat\\\
  webapps\\share\\components\\site-members` 位置的 `site-members.get.js` 文件中的 `main()`\
  \ 方法。您可以在 `tomcat\\webapps\\share\\WEB-INF\\classes\\alfresco\\site-webscripts`\
  \ 中查看其他 JavaScript 控制器实现，这些实现使用前面提到的方法调用仓库 Web 脚本。\n\n> 在指定路径以引用开箱即用的 Web 脚本时，它是从\
  \ `tomcat\\webapps` 开始提及的。该位置可在您的 Alfresco 安装目录中找到。\n\n## Invoking a web script\
  \ from client-side JavaScript\n\n客户端 JavaScript 控制文件可以与 Alfresco Share 中的组件关联。如果您需要进行仓库\
  \ Web 脚本调用，可以从通常位于 tomcat\\webapps\\share\\components 的客户端 JavaScript 控制文件执行。您可以使用基于\
  \ YUI 的客户端 JavaScript 文件以不同的方式进行仓库 Web 脚本调用。以下是从客户端 JavaScript 文件调用 Web 脚本的一些方式。还提供了引用，以便查看\
  \ Alfresco 开箱即用实现以实际了解其用法：\n\n+   - Alfresco.util.Ajax.request: 查看 tomcat\\webapps\\\
  share\\components\\console\\groups.js 并参考 _removeUser 函数。\n+   - Alfresco.util.Ajax.jsonRequest:\
  \ 查看 tomcat\\webapps\\share\\components\\documentlibrary\\documentlist.js 并参考 onOptionSelect\
  \ 函数。\n+   - Alfresco.util.Ajax.jsonGet: 直接调用获取 Web 脚本，请查看 tomcat\\webapps\\share\\\
  components\\console\\groups.js 并参考 getParentGroups 函数。\n+   - YAHOO.util.Connect.asyncRequest:\
  \ 查看 tomcat\\webapps\\share\\components\\documentlibrary\\tree.js 并参考 _sortNodeChildren\
  \ 函数。\n\n> 在位于 tomcat\\webapps\\share\\js 的 alfresco.js 中，提供了 YAHOO.util.Connect.asyncRequest\
  \ 的包装实现，并且可以在 alfresco.js 中找到各种可用方法，例如我们在前面的列表中看到的 Alfresco.util.Ajax.request、Alfresco.util.Ajax.jsonRequest\
  \ 和 Alfresco.util.Ajax.jsonGet。因此，前一个列表中的前三个选项在内部仅使用 YAHOO.util.Connect.asyncRequest（前一个列表中的最后一个选项）进行调用。\n\
  \n## Calling a web script from the command line\n\n有时在处理项目时，可能需要从 Linux 机器调用 Web\
  \ 脚本或创建 shell 脚本来调用 Web 脚本。可以使用 cURL 从命令行调用 Web 脚本，它是在处理 Web 脚本时使用的有价值的工具。\n\n\n\
  \n\n你可以在 Linux、Mac 或 Windows 上安装 cURL，并从命令行执行 web script。有关 cURL 的更多详细信息，请参阅 http://curl.haxx.se/\
  \ 。你需要先安装 cURL。在 Linux 上，你可以使用 apt-get 安装 cURL。在 Mac 上，你应该可以通过 MacPorts 安装 cURL，在\
  \ Windows 上则可以通过 Cygwin 安装 cURL。\n\n一旦安装了 cURL，你可以按如下方式从命令行调用 web script：\n\n```\n\
  curl -u admin:admin \"http://localhost:8080/alfresco/service/\nhelloworld?name=Ramesh\"\
  \n```\n\n这将显示 web script 的响应。\n\n## 从 JSR-168 门户和 JSF 页面调用 web script\n\nAlfresco\
  \ 中的 Web script 框架提供了一个辅助工具，用于从某些不了解 HTTP 的客户端环境调用 Alfresco web script。因此，它可以轻松地从这样的环境中调用\
  \ web script，并且将通过调用环境所熟悉的机制来调用 web script。为了允许 JSR-168 门户和 JSF 页面根据其环境自然地调用 web\
  \ script，Alfresco 中的 web script 框架为它们提供了辅助工具。让我们从高层次来看一下它们及其工作方式。\n\n### 从 JSR-168\
  \ 门户调用 web script\n\n可以将 Alfresco web script 当作 JSR 门户 portlet 来调用。我们将看看为此需要在 Alfresco\
  \ 中进行的配置。web script 的条目应在 portlet.xml 中提供。web script URL 应配置为 scripturl 参数下的 JSR\
  \ 门户 URL，以便能够将 web script 作为 portlet 调用。基本上，它会在 web script 描述文档中定义的 URL 前添加 /alfresco/168s。\n\
  \n例如，你可以查看位于 tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco\\templates\\\
  webscripts\\org\\alfresco\\portlets\\mytasks.get.desc.xml 和 mytasks.get.html.ftl\
  \ 的 mytasks web script 的开箱即用实现。如果你使用的是 Alfresco Community 5，这两个文件位于 alfresco-remote-api-*.jar\
  \ 内的 alfresco 包下。mytasks web script 作为 portlet 的条目配置在 tomcat\\webapps\\alfresco\\\
  WEB-INF\\portlet.xml 中。\n\n### 从 JSF 页面调用 web script\n\n可以从 JSF 页面将 web script 当作标签库来调用。Alfresco\
  \ 中提供了标签实现，使 JSF 页面能够调用 web script。它位于 Alfresco 安装目录下 `tomcat\\webapps\\alfresco\\\
  WEB-INF` 位置的 `repo.tld` 中。\n\n请查看 `tomcat\\webapps\\alfresco\\jsp\\dashboards\\\
  dashlets\\mytasks-webscript.jsp` 以了解其用法。\n\n### 处理客户端限制\n\n其中一个限制是并非所有客户端都能发出所有\
  \ HTTP 调用。可能仅局限于 GET 或 POST 调用。Alfresco 中的 web script 框架提供了一种使用 POST 方法隧道传输 HTTP\
  \ 方法的方式，通过这种方式，你可以调用其他 HTTP 方法调用。这可以通过在 HTTP 请求中使用 `X-HTTP-Method-Override` 头来实现，其值为方法名称，例如\
  \ GET。另一种方式是指定 `alf_method` 作为查询字符串参数。\n\n另一个客户端限制可能是并非所有客户端都能优雅地处理非成功状态的 HTTP 状态码。在这种情况下，有一种机制可以强制\
  \ HTTP 响应在响应头中指定成功。响应主体仍然表示如同收到非成功状态一样的内容，这允许客户端了解 web script 提供的错误代码或消息（如果有的话）。为了能够优雅地处理非成功场景下的\
  \ HTTP 状态码，可以通过在 HTTP 请求上设置 `alf-force-success-response` 头并将值设为 `true`，从而每次都强制在\
  \ HTTP 响应中指定成功。\n\n## 总结\n\n在本章中，我们了解了调用 web script 的不同方式，例如从 Web 浏览器调用。使用可用于 Web\
  \ 浏览器的附加组件，可以调用 web script。我们已经看到了从独立 Java 类调用 web script 的不同方式。我们还了解了如何从基于 Spring\
  \ 的服务和命令行调用 web script。我们了解了将 web script 作为 JSR-168 portlet 和 JSF 页面调用的可能性。我们还看到了\
  \ Alfresco 中的 web script 框架如何为我们提供处理调用客户端某些限制的方法。\n\n我们将在下一章学习如何开发基于 Java 的 web\
  \ script。\n\n在 Alfresco 中开发 web script 时，为 web script 编写控制器实现有两种选择：基于 JavaScript\
  \ 的控制器和基于 Java 的控制器。根据你的偏好，你可以在需要时从这两者中选择控制器实现。与基于 Java 的控制器相比，使用基于 JavaScript 的控制器可以加快开发周期。在基于\
  \ JavaScript 的控制器中，你可以使用 Alfresco JavaScript API 完成许多事情。然而，有时这可能不足以实现你的业务需求。在这种情况下，你可以使用基于\
  \ Java 的 web script，在其中可以使用所有 Alfresco 服务，如 NodeService、SearchService、ContentService\
  \ 等，并且可以根据需要构建 web script。\n\n在那些你可能最终开发大量 web script 的项目中，你必须根据项目执行的可行性来决定将实现哪种类型的控制器实现。你可以选择开发基于\
  \ JavaScript 控制器的 web script 以加快开发速度，并且仅在 JavaScript API 不适合你的需求时才开发基于 Java 的 web\
  \ script。或者，你始终可以使用基于 Java 的 web script，以便为你的项目采用标准化的开发方法。\n\n了解使用两种类型的控制器实现 web\
  \ script 是很重要的。我们之前创建 hello world web script 时已经看到了如何使用基于 JavaScript 的控制器。现在，是时候了解基于\
  \ Java 的 web script 了。在本章中，我们将为示例用例在 Alfresco 中实现一个基于 Java 的 web script，以便你逐步了解如何创建一个具有\
  \ Java 后端控制器实现的 web script。然后，你可以根据项目中的业务需求开发基于 Java 的 web script。\n\n## 用例场景\n\n\
  我们将采用一个非常简单的场景，以全面了解创建具有 Java 后端控制器的 web script。我们的主要目标是了解如何创建基于 Java 的 web script，以及如何在基于\
  \ Java 的控制器中使用 Alfresco API。让我们开始吧。\n\n你必须知道，Alfresco 将内容的元数据存储在数据库中，并将实际内容存储在文件系统上。现在，一旦内容在\
  \ Alfresco 中可用，你可能希望了解其位置，并找出它在文件系统上的实际位置。所以，下次你与某人讨论 Alfresco 中的内容时，你实际上可以展示 Alfresco\
  \ 中内容与内容存储下文件系统上实际物理位置的映射。\n\n此外，在涉及外部应用程序与 Alfresco 集成的项目中，你可能在某个时候还想知道内容的大小以及它在文件系统上的位置。\n\
  \n让我们将此作为构建基于 Java 的 web script 的用例场景。我们基本上想在 Alfresco 中创建一个 web script，为给定的节点提供其在文件系统上的实际位置及其内容大小。\n\
  \n## 高层级的 web script 功能\n\n在理解了我们要实现的整体场景之后，让我们从高层级了解这个 web script 将如何工作：\n\n- 需要将参数\
  \ nodeid 作为请求参数传递给 web script。\n- 只有经过身份验证的用户才能访问该 web script。\n- 如果用户对给定节点至少具有读取访问权限，那么才会提供该节点的文件系统物理位置和内容大小。\n\
  - 响应将以 JSON 和 XML 格式提供。格式可以在调用 web script 时指定。\n\n## 准备工作\n\n让我们回顾一下对 web script\
  \ 构建模块的了解，并确定需要为此 web script 创建的组件，如下所示：\n\n- 每个 web script 都需要有一个描述文档。因此，第一步是创建\
  \ web script 描述文档。\n- web script 需要以 XML 和 JSON 格式返回响应，因此有必要提供用于渲染 XML 响应的响应模板和用于渲染\
  \ JSON 响应的响应模板。\n- 获取文件系统位置和大小的整个逻辑将位于 web script 控制器中。在这种情况下，需要创建一个基于 Java 的 web\
  \ script 控制器来处理业务逻辑。\n- 为了向 web script 注册基于 Java 的控制器，需要 Spring 配置。因此，需要创建一个 Spring\
  \ 上下文文件，以向 web script 注册基于 Java 的控制器。并非总是需要创建新的 Spring 上下文文件。你可以根据系统逻辑模块拥有一个上下文文件，并且属于该模块的所有\
  \ web script 都可以在该上下文文件中注册。\n\n\n\n\n\n对于此 Web 脚本，您可以使用您喜欢的编辑器创建 Web 脚本所需的<|message|>\
  \ 文件并开发控制器 Java 类。我们将在第 9 章《Mavenizing Web Scripts》中介绍使用 Maven 设置开发环境。在本章中，我们主要旨在了解如何实现一个由\
  \ Java 支持的 Web 脚本。您需要在类路径中添加 `spring-webscripts-*.jar` 和 `alfresco-data-model-*.jar`\
  \ 才能编译控制器 Java 类。这两个 JAR 都可以在 Alfresco 安装中的 `tomcat\\webapps\\alfresco\\WEB-INF\\\
  lib` 位置找到。JAR 名称中的 `*` 符号指的是版本号。\n\n## 创建描述文档\n\n由于 Web 脚本的主要目的是返回内容位置，让我们使用 Web\
  \ 脚本 ID `contentlocation`。我们将使用 HTTP GET 方法，因为我们将检索节点的<|message|> 息。\n\n作为第一步，为\
  \ Web 脚本创建描述文档。创建一个名为 `contentlocation.get.desc.xml` 的文件，其内容如下：\n\n```\n<webscript>\n\
  \    <shortname>Get content location and size</shortname>\n    <description>Gets\
  \ the physical location for the content and size of the content</description>\n\
  \    <url>/getContentLocation?nodeid={nodeid}</url>\n    <url>/getContentLocation.json?nodeid={nodeid}</url>\n\
  \    <url>/getContentLocation.xml?nodeid={nodeid}</url>\n    <format default=\"\
  json\">extension</format>\n    <authentication>user</authentication>\n</webscript>\n\
  ```\n\n让我们理解一下我们刚刚做了什么。我们创建了一个描述文档，它在 `shortname` 和 `description` 标签中分别提供了关于 Web\
  \ 脚本的人类可读名称和简要信息。\n\n我们定义了三个可用于调用 Web 脚本的 URL。第一个是默认 URL，另外两个是显式提及以分别以 JSON 和 XML\
  \ 格式获取响应的 URL。请注意，第一和第二个 URL 将产生相同的输出。\n\n默认响应格式指定为 `json`。`format` 标签的 `extension`\
  \ 值提及，可以在调用 Web 脚本时将响应内容类型指定为 Web 脚本 ID 的扩展。\n\n而且最重要的是，Web 脚本在被调用时期望一个名为 `nodeid`\
  \ 的参数。\n\n## 创建响应模板\n\n作为 Web 脚本的经验法则，我们必须遵循 Alfresco 中 Web 脚本框架期望的命名约定。由于 Web 脚本应该以\
  \ JSON 和 XML 格式返回响应，我们需要为 Web 脚本创建两个响应模板。按照命名约定，有两个文件需要创建——`contentlocation.get.json.ftl`\
  \ 和 `contentlocation.get.xml.ftl` 作为响应模板。按如下方式在响应中返回 `filesystem_location` 和大小：\n\
  \n1. 要创建 JSON 响应模板，创建一个名为 `contentlocation.get.json.ftl` 的文件，其内容如下：\n\n```json\n\
  {\n    \"content\" :\n    {\n        \"filesystem_location\" : \"${contentFSLocation}\"\
  ,\n        \"size\" : ${contentSize}\n    }\n}\n```\n\n2. 要创建 XML 响应模板，创建一个名为 `contentlocation.get.xml.ftl`\
  \ 的文件，其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<content>\n\
  \    <filesystem_location>${contentFSLocation}</filesystem_location>\n    <size>${contentSize}</size>\n\
  </content>\n```\n\n我们刚刚创建了两个响应模板，以返回 Web 脚本的输出。前述代码片段中 `${}` 内使用的名称是要从控制器类设置的模型变量名称。请确保在实现控制器时，模型变量名称与响应模板中使用的名称相同。\n\
  \n## 创建 Java 控制器\n\n现在是进行一些 Java 编码的时候了。在开始实际编码之前，快速确定我们将要编写的代码需要处理的逻辑始终是一个好主意。这个练习确实非常有帮助。\n\
  \n### 高层次的控制器逻辑\n\n为了为此场景开发控制器，让我们从高层次来看一下我们将包含在由 Java 支持的控制器中的实现逻辑：\n\n- 控制器将期望\
  \ `nodeid` 作为输入参数\n- 检查给定的节点是否存在于存储库中\n- 检查用户是否至少对给定节点具有读取权限\n- 获取给定节点的 filesystem\
  \ 位置\n- 获取给定节点在 filesystem 上的大小\n- 准备模型对象并将其返回给 FTL 响应模板\n\n### 让我们编码！\n\n让我们执行以下步骤来创建\
  \ Web 脚本的 Java 支持控制器实现，该实现将执行上一节中提到的所有必需逻辑：\n\n1. 创建一个新类，`com.example.content.ContentLocationWebScript`。通常提供描述性命名风格并将\
  \ Web 脚本分类到适当的包中是一个好主意。这在需要开发大量 Web 脚本的场景中会很有用。由于这是一个与内容相关的 Web 脚本，我们将其保留在 `com.example.content`\
  \ 包下，并命名为 `ContentLocationWebScript`。\n\n2. 您刚刚创建的 Java 类 `ContentLocationWebScript`\
  \ 必须扩展 `org.springframework.extensions.webscripts.DeclarativeWebScript`，如下所示：\n\n\
  ```\npublic class ContentLocationWebScript extends org.springframework.extensions.webscripts.DeclarativeWebScript\
  \ {\n```\n\n3. 我们将使用 Node 服务，它基本上用于在 Alfresco 中执行节点相关操作，例如创建、更新、删除、设置属性和获取属性，以获取有关\
  \ filesystem 位置的详细信息。我们将使用 Permission 服务来识别用户是否具有读取访问权限。现在下一步是为它们提供声明。两者都将作为 Spring\
  \ 依赖项注入，如下所示：\n\n```\nprivate NodeService nodeService;\nprivate PermissionService\
  \ permissionService;\n```\n\n4. 现在，检查用户是否至少对给定的 noderef 具有读取访问权限。控制器只有在用户至少对节点具有读取权限时才会继续，否则控制器将设置适当的错误响应代码。\n\
  \n```\nif (permissionService.hasPermission(contentNodeRef,\nPermissionService.READ)\
  \ != AccessStatus.ALLOWED) {\n    status.setCode(Status.STATUS_FORBIDDEN);\n   \
  \ status.setRedirect(true);\n    return null;\n}\n```\n\n5. 下一步是获取内容的文件系统位置和大小，如下所示：\n\
  \n```\nContentData contentData = (ContentData) nodeService.\ngetProperty(contentNodeRef,\
  \ ContentModel.PROP_CONTENT);\nString contentFileLocation = contentData.getContentUrl();\n\
  Long contentSize = contentData.getSize();\n```\n\n6. 创建并设置模型对象以在响应中呈现信息，如下所示：\n\n\
  ```\nMap<String, Object> model = new HashMap<String, Object>();\nmodel.put(\"contentPSLocation\"\
  , contentFileLocation);\nmodel.put(\"contentSize\", contentSize);\nreturn model;\n\
  }\n```\n\n7. 在类的末尾，为节点服务和权限服务提供 setter 方法，如下所示：\n\n```\npublic void setNodeService(NodeService\
  \ nodeService) {\n    this.nodeService = nodeService;\n}\n```\n\n```\npublic void\
  \ setPermissionService(PermissionService permissionService) {\n    this.permissionService\
  \ = permissionService;\n}\n}\n```\n\n8. 保存该类，Java 控制器实现现在已准备就绪。\n\n我们刚刚创建了一个由 Java\
  \ 支持的控制器实现，它将在返回文件系统上的内容位置和内容大小之前执行指定的逻辑处理。我们还在控制器中使用了节点服务和权限服务。\n\n## 为 Web 脚本配置控制器\n\
  \n一旦 Java 控制器准备就绪，就需要为 Web 脚本配置它，以便 Alfresco 中的 Web 脚本框架知道这个 Java 类是 `contentlocation`\
  \ Web 脚本的控制器。这可以通过创建 spring 上下文文件并在其中添加 Java 类的条目来完成。\n\n创建一个文件 `custom-example-webscripts-context.xml`，其内容如下：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE beans PUBLIC '-//SPRING//DTD\
  \ BEAN//EN' 'http://www.springframework.org/dtd/spring-beans.dtd'>\n<beans>\n  \
  \  <bean id=\"webscript.example.contentlocation.get\" class=\"com.example.content.ContentLocationWebScript\"\
  \ parent=\"webscript\">\n        <property name=\"nodeService\" ref=\"nodeService\"\
  \ />\n        <property name=\"permissionService\" ref=\"permissionService\" />\n\
  \    </bean>\n</beans>\n```\n\n我们创建了一个 spring 上下文文件，将 Java 控制器与 `contentlocation`\
  \ Web 脚本关联起来，以便让 Alfresco 中的 Web 脚本框架知道 `ContentLocationWebScript` Java 类是 `contentlocation`\
  \ Web 脚本的控制器。这是通过在上下文文件中提供 bean 条目时遵循适当的命名约定来完成的。\n\n最重要的是要指定正确的 bean ID。需要遵循的命名约定是\
  \ `webscript.package.webscriptid.httpmethod`。\n\n因此，构建方式是，如果 Web 脚本描述文件位于 `templates\\\
  webscripts\\example\\contentlocation.get.desc.xml` 位置，则 bean ID 将为 `webscript.example.contentlocation.get`。遵循此命名约定是必须的，以便将类注册为\
  \ Web 脚本控制器。如果您未能这样做，Alfresco 中的 Web 脚本框架将无法将该类注册为 Web 脚本控制器，并且当您尝试执行 Web 脚本时，控制器代码将不会被调用。\n\
  \n\n\n\n\nTransaction: required\nFormat Style: extension\nDefault Format: json\n\
  Id: example/contentlocation.get\nDescription:classpath:alfresco/extension/templates/webscripts/example/contentlocation.get.desc.xml\n\
  \n# 测试 Web 脚本\n\n现在是时候测试我们刚刚创建的 Web 脚本的功能了。我们基本上要确保我们已在 Java 支持的控制器中加入的逻辑按预期工作。\n\
  \n为了测试 Web 脚本，首先在 Alfresco 仓库中上传一些内容（例如一张图片）。记下其 nodeid。内容上传后，使用 Alfresco Share\
  \ 获取上传内容 nodeid 的方法如下：将鼠标指针移到内容名称上，然后右键单击并点击复制链接位置。将此链接粘贴到文本编辑器中的某处并复制 workspace://SpacesStore;\
  \ 之后的值，这就构成了 nodeid。现在，创建两个用户并为其中一个授予消费者访问权限，而对另一个用户不授予此内容的任何权限。确保继承权限也被取消选中。\n\n\
  现在，使用其中任意两个用户开始测试 Web 脚本。\n\n## 测试用例 1 – 必填检查\n\nnodeid 是我们创建的 Web 脚本的必填参数。作为第一个测试用例，让我们测试在不传递\
  \ nodeid 作为请求参数的情况下调用 Web 脚本。因此，第一个测试是不在 Web 脚本请求中传递 nodeid 参数。在浏览器中访问 http://localhost:8080/alfresco/service/getContentLocation\
  \ URL。\n\n由于我们将默认格式指定为 JSON，JSON 响应将按以下代码片段所示呈现。由于我们没有创建自定义状态模板并且使用了 status.setRedirect\
  \ 为 true，Alfresco 中 Web 脚本框架提供的默认状态响应模板将被呈现。如果在调用 Web 脚本请求时明确请求 JSON 格式，例如 http://localhost:8080/alfresco/service/getContentLocation.json，也会显示相同的输出。\n\
  \n以下是 Web 脚本输出：\n\n```\n{\n  \"status\" :\n  {\n    \"code\" : 400,\n    \"name\"\
  \ : \"Bad Request\",\n    \"description\" : \"Request sent by the client was syntactically\
  \ incorrect.\"\n  }\n}\n```\n\n如果您想查看 XML 响应，则访问以下 URL http://localhost:8080/alfresco/service/getContentLocation.xml，响应如下：\n\
  \n```\n<response>\n  <status>\n    <code>400</code>\n    <name>Bad Request</name>\n\
  \  </status>\n</response>\n```\n\n## 测试用例 2 – 无效参数值\n\n作为第二个测试用例，我们将通过为 nodeid 参数提供无效值来测试\
  \ Web 脚本。在调用 Web 脚本时提供 nodeid；但是为 nodeid 提供无效值并检查 JSON 和 XML 格式的响应。\n\n对于 JSON 响应，访问\
  \ http://localhost:8080/alfresco/service/getContentLocation.json?nodeid=invalidnode\
  \ 或 http://localhost:8080/alfresco/service/getContentLocation?nodeid=invalidnode。\n\
  \nJSON 格式的输出将如下所示：\n\n```\n{\n  \"status\" :\n  {\n    \"code\" : 404,\n    \"name\"\
  \ : \"Not Found\",\n    \"description\" : \"Requested resource is not available.\"\
  \n  }\n}\n```\n\n对于 XML 响应，访问 `http://localhost:8080/alfresco/service/getContentLocation.xml?nodeid=invalidnode`。它将以\
  \ XML 格式显示响应，提及 404 状态码。\n\n## 测试用例 3 – 无效访问\n\n我们在前面的测试用例中对 nodeid 参数进行了必填检查并使用无效值测试了\
  \ Web 脚本。现在，为 nodeid 提供正确的值，调用 Web 脚本，并为没有访问该内容权限的用户提供身份验证。我们的第三个测试用例是使用我们未授予任何内容访问权限的用户测试\
  \ Web 脚本。检查 JSON 和 XML 响应，如我们在前面的测试用例中所做的那样。它应给出 403 作为状态码，显示访问被禁止。\n\n## 测试用例 4\
  \ – 使用有效数据测试\n\n现在是时候使用一些有效测试数据测试 Web 脚本了，这意味着具有内容访问权限的用户和有效的 nodeid 应作为 Web 脚本请求参数传递。访问\
  \ Web 脚本 URL 并提供有效的 nodeid 作为参数，检查 JSON 和 XML 格式的响应。您现在应该能够看到显示内容在文件系统上的物理位置及其大小的响应。以下显示了示例\
  \ XML 响应：\n\n```\n```xml\n<content>\n    <filesystem_location>store://2014/7/20/xx/x/xxxxxx.bin\n\
  \    </filesystem_location>\n    <size>500</size>\n</content>\n```\n```\n\n一旦获得响应，您可以尝试导航到\
  \ `filesystem_location` 标签中收到的路径。目录结构可以在 `alfresco-global.properties` 中提到的 `alf_data`\
  \ 位置下找到，该文件位于您 Alfresco 安装目录内的 `tomcat\\shared\\classes` 中。内容大小以字节为单位显示。重要的是要理解，我们不会在\
  \ `alf_data` 及其子文件夹中更新或删除任何内容，因为这可能会损坏仓库。\n\n因此，对于 Alfresco 中的任何内容，您都可以找到其大小及其在文件系统上的物理位置。\n\
  \n## DeclarativeWebScript 与 AbstractWebScript\n\nAlfresco 中的 Web 脚本框架提供了两个不同的帮助类，Java\
  \ 支持的控制器可以从中派生。了解它们之间的区别很重要。\n\n第一个帮助类是我们在本章开发 Web 脚本时使用的 `org.springframework.extensions.webscripts.DeclarativeWebScript`。第二个是\
  \ `org.springframework.extensions.webscripts.AbstractWebScript`。\n\n`DeclarativeWebScript`\
  \ 反过来仅扩展 `AbstractWebScript` 类。\n\n如果 Java 支持的控制器派生自 `DeclarativeWebScript`，则执行辅助由\
  \ `DeclarativeWebScript` 类提供。此帮助类基本上封装了 Web 脚本的执行并检查是否与 Web 脚本关联了用 JavaScript 编写的控制器。如果为\
  \ Web 脚本找到 JavaScript 控制器，则此帮助类将执行它。此类将定位 Web 脚本的关联响应模板以用于请求的格式，并将填充的模型对象传递给响应模板。\n\
  \n对于扩展 `DeclarativeWebScript` 的控制器，Web 脚本的控制器逻辑应提供在 `Map<String, Object> executeImpl(WebScriptRequest\
  \ req, Status status, Cache cache)` 方法中。大多数时候在开发 Java 支持的 Web 脚本时，控制器将仅扩展 `DeclarativeWebScript`。\n\
  \n`AbstractWebScript` 不以 `DeclarativeWebScript` 的方式提供执行辅助。它将整个执行过程的完全控制权交给派生类，并允许扩展类决定如何呈现输出。`DeclarativeWebScript`\
  \ 类本身就是一个很好的例子。它扩展了 `AbstractWebScript` 类并提供了一种使用 FTL 模板呈现响应的机制。在像流式传输内容这样的场景中，将不需要响应模板；相反，内容本身需要直接呈现。在这种情况下，Java\
  \ 支持的控制器类可以从 `AbstractWebScript` 扩展。\n\n> 如果一个 Web 脚本同时具有基于 JavaScript 的控制器和基于 Java\
  \ 的控制器，则：\n> - 如果基于 Java 的控制器派生自 `DeclarativeWebScript`，则首先将执行基于 Java 的控制器，然后控制权将传递给基于\
  \ JavaScript 的控制器，然后再将模型对象返回给响应模板。\n> - 如果基于 Java 的控制器派生自 `AbstractWebScript`，则仅执行基于\
  \ Java 的控制器。JavaScript 控制器将不会执行。\n\n## 智能使用控制器\n\n通常建议对 Web 脚本仅使用基于 Java 的控制器或基于\
  \ JavaScript 的控制器之一，并且不应同时使用两个控制器。然而，让我们看看一些可以利用同时使用两个控制器来解决一些关键问题的场景。\n\n考虑一个场景，在生产系统中，您已经有一个具有扩展\
  \ `DeclarativeWebScript` 的基于 Java 的控制器并返回一些输出的 Web 脚本。现在，作为修复关键问题的一部分，需要在 Web 脚本响应中返回额外信息，并且您没有重启生产服务器的选项，因为服务器停机可能会影响客户业务。在这种场景下，您可以为\
  \ Web 脚本编写额外的 JavaScript 控制器，在模型对象中设置额外信息，并修改响应模板以包含新添加的信息。注册 Web 脚本，Web 脚本现在应返回额外信息以及之前的输出。因此，我们可以说我们完成了一种控制器执行的链式处理。可以将其视为类似于\
  \ servlet 链式处理。这就是 Alfresco Web 脚本框架的强大之处，使得非常有效地解决关键问题变得容易。\n\n另一个场景可能是您想要具有过滤器之类的功能。在执行基于\
  \ JavaScript 的 Web 脚本之前，您需要执行一些与外部应用程序的业务逻辑通信，并根据其输出处理 Web 脚本的剩余部分。在这里，您可以考虑开发扩展\
  \ `DeclarativeWebScript` 的 Java 控制器。对于 Java 控制器，更容易为 spring 服务接线。使用它，调用外部应用程序并设置模型对象。现在，在基于\
  \ JavaScript 的控制器中，基于从 Java 控制器可用的模型对象的值，继续处理。这样就可以为 Web 脚本实现 servlet 过滤器之类的功能。\n\
  \n\n\n"
- "# 第7章：详细了解基于 JavaScript 的 Web 脚本\n\n在本章中，我们将介绍以下主题：\n\n- 你可以使用 JavaScript API 做哪些事情？\n\
  - 如何查找 Alfresco 中可用的 JavaScript API？\n- 可用于访问 JavaScript API 的根对象\n- Alfresco 中\
  \ Web 脚本框架提供的其他根对象\n- JavaScript 控制器中一些常见功能的代码示例\n- 创建你自己的根对象\n\n## 详细了解基于 JavaScript\
  \ 的 Web 脚本\n\nAlfresco 中的 Web 脚本框架使你能够轻松地使用基于 JavaScript 的 Web 脚本来创建、访问、更新和删除存储在存储库中的内容。当你需要在不关闭生产系统的情况下进行某种热修复时，基于\
  \ JavaScript 的 Web 脚本将非常有用。基于 JavaScript 的 Web 脚本的另一个酷炫功能是，你可以将它们部署在存储库中，并使用 Alfresco\
  \ 用户界面直接在线编辑它们。在开发具有基于 JavaScript 控制器的 Web 脚本时，无需依赖任何特定的编辑器。你可以使用你最喜欢的任何编辑器来创建它们。使用基于\
  \ JavaScript 的 Web 脚本的主要优势在于它可以加快 Web 脚本的开发周期。你无需像处理基于 Java 的 Web 脚本那样担心编译它们。在开发基于\
  \ JavaScript 的 Web 脚本时，你可以利用 Alfresco 提供的 JavaScript API。Alfresco 提供了广泛的 API，使从基于\
  \ JavaScript 控制器的 Web 脚本访问存储库变得简单便捷。\n\n在本章中，我们首先将了解可以使用 JavaScript API 执行哪些操作。我们将学习如何识别\
  \ Alfresco 中可用的 JavaScript API。我们将查看 Alfresco 中可用的根对象。这将帮助我们访问可用的 JavaScript API，并在更短的时间内有效地开发\
  \ Web 脚本；同时，它还将使我们更容易与 Alfresco 存储库进行交互。我们还将了解 Alfresco 中 Web 脚本框架提供的其他有用根对象。我们将看到一些代码示例，帮助你了解如何在\
  \ Web 脚本中使用 Alfresco JavaScript API。最后，我们将逐步了解如何创建自定义 JavaScript 扩展，这是一个非常重要且有用的知识点。\n\
  \n### 了解你可以使用 JavaScript API 做什么\n\n在 Alfresco 中开发 Web 脚本时，Alfresco 提供的存储库 JavaScript\
  \ API 可以帮助你执行以下列出的许多高级操作：\n\n- 创建一个文件夹\n- 创建内容\n- 复制一个节点\n- 将节点从一个位置移动到另一个位置\n-\
  \ 删除一个节点\n- 查找一个节点\n- 对存储库执行搜索\n- 遍历节点层次结构\n- 修改节点上的属性\n- 在节点上添加或删除方面（aspect）\n\
  - 为节点创建、修改或删除关联\n- 获取节点的权限\n- 修改节点的权限\n- 创建和删除组\n- 创建和删除用户\n\n基本上，你可以将 Alfresco\
  \ JavaScript API 视为从基于 JavaScript 的控制器访问 Alfresco 服务的包装器。Alfresco 使用 Mozilla Rhino\
  \ JavaScript 引擎来处理 Java，该引擎允许 JavaScript 文件通过脚本中简单的 bean 风格方式访问 Alfresco Java 对象。此外，这使得开发与\
  \ JavaScript（ECMA Script）1.6 兼容的文件变得更加简单，从而可以使用 Alfresco JavaScript API 创建、更新、检索和删除\
  \ Alfresco 存储库对象。\n\n### Alfresco 中的 JavaScript API\n\n作为开发者，你总是应该对通过代码进行调试感兴趣，以便理解其工作原理，而不是直接拥有\
  \ API 列表并简单地使用它。因此，这里我们将了解如何识别 Alfresco 中的 JavaScript API。现在，让我们找出 Alfresco 提供的、在开发\
  \ Web 脚本时可以在 JavaScript 控制器中使用的可用 JavaScript API。\n\n### 识别 JavaScript API\n\n在\
  \ Alfresco 代码库中，识别任何 JavaScript API 的最简单方法是通过 bean 定义，其中父项指定为 `baseJavaScriptExtension`。bean\
  \ 条目的工作方式是——任何 JavaScript API 都可以通过为其定义的根对象来访问。在 `extensionName` 属性下定义的属性名称是访问相关\
  \ API 的根对象。\n\n让我们讨论 JavaScript API 的 bean 定义条目，以便更好地理解 JavaScript API 是如何定义的。以下是\
  \ Alfresco 中一个此类 API 的代码片段，它将让你清楚地了解 JavaScript API 如何使用，以及如何在控制器中使用它：\n\n```\n\
  <bean id=\"actionsScript\" parent=\"baseJavaScriptExtension\" class=\"org.alfresco.repo.jscript.Actions\"\
  >\n    <property name=\"extensionName\">\n        <value>actions</value>\n</property>\n\
  <property name=\"serviceRegistry\">\n    <ref bean=\"ServiceRegistry\"/>\n</property>\n\
  </bean>\n```\n\n以下是我们可以从这段代码片段中理解的一些要点：\n\n- 它的父项定义为 `baseJavaScriptExtension`。\n\
  - 所有可用于 JavaScript 控制器的方法都定义在 Java 类 `org.alfresco.repo.jscript.Actions` 中。\n- 任何\
  \ Alfresco 服务的依赖都可以注入到 bean 定义中，这些依赖可以在 Java 类中用于对存储库执行操作。\n- JavaScript 控制器将使用\
  \ bean 定义中 `extensionName` 属性下提供的值来访问 Java 类公开的方法。`extensionName` 属性下提供的这个值被称为 JavaScript\
  \ 控制器中可用于访问 JavaScript API 的根对象。\n\n现在，有了这些理解，你就掌握了在 Web 脚本中使用 JavaScript API 的关键。你刚刚解锁了如何从\
  \ JavaScript 控制器访问 Java 对象。\n\n### 用于访问 JavaScript API 的根对象\n\n既然你了解了如何识别 Alfresco\
  \ 代码库中的 JavaScript API，让我们看看从 JavaScript 控制器访问 JavaScript API 可用的所有根对象。在你的 Alfresco\
  \ 安装目录中，你可以在 `tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco` 下的 `script-services-context.xml`\
  \ 中找到常用的 JavaScript API 定义。如果你使用的是 Alfresco Community 5，`script-services-context.xml`\
  \ 可以位于 `alfresco` 包下的 `alfresco-repository-*.jar` 内。在下表中，条目首先列出根对象的名称，然后是包含 API\
  \ 方法实现的类的完全限定名称，以及根对象的简要描述：\n\n| 根对象 | 类名 | 描述 |\n|---|---|---|\n| logger | org.alfresco.repo.jscript.ScriptLogger\
  \ | 可用于记录所需详细信息，这些信息可在调试问题时使用 |\n| utils | org.alfresco.repo.jscript.ScriptUtils\
  \ | 提供一些通用的有用工具方法 |\n| test | org.alfresco.repo.jscript.ScriptTestUtils | 此工具类提供一些测试方法\
  \ |\n| actions | org.alfresco.repo.jscript.Actions | 提供一种在节点上执行操作（actions）的方式 |\n\
  | imap | org.alfresco.repo.jscript.Imap | 提供对 imap 方法的访问，例如获取用户的 imap 主页 |\n| search\
  \ | org.alfresco.repo.jscript.Search | 提供一种针对 Alfresco 存储库搜索数据的方式 |\n| classification\
  \ | org.alfresco.repo.jscript.Classification | 提供创建和访问类别的方法 |\n| people | org.alfresco.repo.jscript.People\
  \ | 提供对人员和组的访问，并提供一种操作它们的方式 |\n| session | org.alfresco.repo.jscript.Session | 提供当前用户的认证票据\
  \ |\n| avm | org.alfresco.repo.jscript.AVM | 提供访问 AVM 对象的辅助方法 |\n| crossRepoCopy\
  \ | org.alfresco.repo.jscript.CrossRepositoryCopy | 提供对跨存储库复制的支持 |\n| workflow |\
  \ org.alfresco.repo.workflow.jscript.WorkflowManager | 允许你在 Alfresco 中创建工作流并与工作流交互\
  \ |\n| presence | org.alfresco.repo.jscript.Presence | 提供一种查询人员当前在线状态的方式 |\n\n\n\
  \n\n"
- "# 第8章：深入理解基于 JavaScript 的 Web 脚本\n\n| 根对象 | 类名 | 描述 |\n|---|---|---|\n| activities\
  \ | `org.alfresco.repo.activities.script.Activity` | 这提供了发布活动和 feed 控制的方法 |\n| appUtils\
  \ | `org.alfresco.repo.jscript.ApplicationScriptUtils` | 这提供了一些对外部应用程序可能有用的方法 |\n\
  \n除此之外，如果你在 Alfresco 安装目录中搜索 XML 文件中的 `parent=\"baseJavaScriptExtension\"`，你将获得其他上下文文件中额外的根对象及其相关类的列表。以下是如前所述定义的其它可用根对象：`actionTrackingService`、`groups`、`formService`、`invitations`、`preferenceService`、`ratingService`、`renditionService`、`replicationService`、`siteService`、`slingshotDocLib`、`taggingService`、`thumbnailService`、`transfer`、`webprojects`、`cmisserver`、`commentService`、`bulkFSImport`、`jmx`，和\
  \ `adminIndexCheckService`。\n\n要了解更多信息，你应该做一个简短的练习并找到这些根对象相关的 Java 类并阅读它们。这个练习将使你熟悉\
  \ JavaScript 后端控制器中可用的方法。\n\n在开发 JavaScript 后端控制器时，基本概念很简单；查看为 JavaScript API 定义的\
  \ Java 类中可用的方法，并使用 extensionName 属性下给出的名称访问这些方法。\n\n## 其他可用根对象\n\n我们已经看到了其 API 方法在\
  \ Java 类中实现的根对象。Alfresco 中的 web 脚本框架还提供了一些其他默认根对象，你可以在 web 脚本的 JavaScript 控制器中使用。我们在查看\
  \ *第 3 章，理解 Web 脚本框架* 中 web 脚本执行的幕后实现时看到了执行 web 脚本时涉及的不同类。你可能想要查看 `spring-webscripts-*.jar`\
  \ 和 `alfresco-remote-api-*.jar` 中的 web 脚本框架类，以详细了解这些根对象是如何在 JavaScript 控制器中提供的。以下是来自\
  \ web 脚本框架不同类的可用根对象：\n\nAbstractWebScript 中的根对象如下表所示：\n\n| 根对象 | 类名/对象名 | 描述 |\n\
  |---|---|---|\n| webscript | org.springframework.extensions.webscripts.Description\
  \ | 这提供了有关当前正在执行的 web 脚本的信息 |\n| format | org.springframework.extensions.webscripts.FormatModel\
  \ | 这表示渲染响应的所选格式 |\n| args | 这是一个 map 对象 | 这保存传递给 web 脚本的参数 |\n| argM | 这是一个 map\
  \ 对象 | 这保存传递给 web 脚本的多值参数参数 |\n| headers | 这是一个 map 对象 | 这保存传递给 web 脚本的请求头值 |\n\
  | headersM | 这是一个 map 对象 | 这保存传递给 web 脚本的多值请求头值 |\n| guest | 这是一个 Boolean 值 | 这指示当前用户是否为访客用户\
  \ |\n| url | org.springframework.extensions.webscripts.URLModel | 这提供了对 web 脚本 URL\
  \ 及其各部分的访问 |\n| msg | org.springframework.extensions.webscripts.ScriptMessage |\
  \ 这提供了对 web 脚本的本地化消息的访问 |\n| config | org.springframework.extensions.webscripts.ScriptConfigModel\
  \ | 这提供了对 web 脚本的配置文档的访问 |\n| formdata | object | 这保存为 web 脚本提交的表单数据 |\n| requestbody\
  \ | Content | 这表示请求正文的内容 |\n| json | Object, JSONArray, or JSONObject | 这是从发布到 web\
  \ 脚本的 JSON 请求生成的 |\n\n## 深入理解基于 JavaScript 的 Web 脚本\n\n`DeclarativeWebScript` 中的根对象如下表所示：\n\
  \n| 根对象 | 类名/对象名 | 描述 |\n|---|---|---|\n| model | 这是一个 map 对象 | 这将由控制器用于将数据传递给响应模板\
  \ |\n| status | `org.springframework.extensions.webscripts.Status` | 这表示响应状态 |\n\
  | cache | `org.springframework.extensions.webscripts.Cache` | 这允许控制缓存 web 脚本的响应\
  \ |\n\n`TenantRepositoryContainer` 中的根对象如下表所示：\n\n| 根对象 | 类名/对象名 | 描述 |\n|---|---|---|\n\
  | cmis | `org.alfresco.repo.cmis.client.CMISLocalConnectionManagerImpl` | 这表示 CMIS\
  \ 客户端 |\n| paging | `org.alfresco.repo.web.util.paging.Paging` | 这是一个分页 API |\n\n\
  `RepositoryContainer` 中的根对象如下：\n\n| 根对象 | 类名/对象名 | 描述 |\n|---|---|---|\n| roothome\
  \ | `org.alfresco.repo.jscript.ScriptNode` | 这表示存储库根节点。仅限已认证用户访问。 |\n| companyhome\
  \ | `org.alfresco.repo.jscript.ScriptNode` | 这表示公司主目录对象。仅限已认证用户访问。 |\n| person |\
  \ `org.alfresco.repo.jscript.ScriptNode` | 这表示当前已认证用户。 |\n| userhome | `org.alfresco.repo.jscript.ScriptNode`\
  \ | 这表示当前用户的主空间。 |\n\nAbstractRuntimeContainer 中的根对象如下：\n\n| 根对象 | 类名/对象名 | 描述 |\n\
  |---|---|---|\n| server | org.alfresco.repo.web.scripts.RepositoryServerModel |\
  \ 这提供了服务器详细信息 |\n| atom | org.springframework.extensions.webscripts.atom.AtomService\
  \ | 这用于解析和生成 atom 文档 |\n| jsonUtils | org.springframework.extensions.webscripts.json.JSONUtils\
  \ | 这用于解析和生成 JSON 对象 |\n| stringUtils | org.springframework.extensions.webscripts.ScriptableUtils\
  \ | 这是字符串的实用工具 |\n\nAlfresco 中 web 脚本框架提供的大多数根对象也在响应模板中可用。如果你查看 web 脚本框架类，它们有实现可提供脚本根对象和模板根对象。一旦你了解了如何在\
  \ JavaScript 控制器中使用根对象，你也可以在响应模板中使用它们。在开发 web 脚本时，始终是一个好的做法在控制器中执行业务逻辑处理并填充 model\
  \ 对象以在模板上显示输出。然而，在某些场景中，你可能也需要在需要时利用为模板提供的根对象来形成响应。\n\n## 必知的 ScriptNode API\n\n\
  如果你正在创建 web 脚本并通过 JavaScript 控制器在 Alfresco 中访问或操作节点，那么你必须了解 ScriptNode API。这提供了对节点各种属性的访问，并提供了节点在安全、缩略图、所有权、版本控制、标记、转换等方面的不同有用方法。你可以阅读\
  \ ScriptNode 的代码来了解不同的方法。它的代码可在 alfresco-repository-*.jar 中找到，其完全限定类名是 org.alfresco.repo.jscript.ScriptNode。\n\
  \n同样，为了在响应模板中访问节点的属性并执行其他各种操作，你应该查看 alfresco-repository-*.jar 中的 org.alfresco.repo.template.TemplateNode。\n\
  \n## 代码示例\n\n现在你已经了解了可在 JavaScript 控制器中使用的不同根对象，让我们看一些代码示例，以更好地理解如何将根对象付诸实践以实现所需功能。我们将介绍一些通用功能的代码示例，每个开发人员在某个时间点都会使用。我们将使用之前介绍的一些根对象。\n\
  \n## 创建文件夹\n\n考虑这样一个场景：你有一个自定义前端应用程序和 Alfresco 作为后端存储库。现在，你希望用户能够从自定义前端在公司主目录下在\
  \ Alfresco 中创建文件夹。文件夹创建后，你可能还想在文件夹内创建一些内容或在文件夹上运行某些操作。首先，我们的目标是在公司主目录下创建一个文件夹。\n\
  \n为此，我们将创建一个新的 web 脚本 foldercreation，它将接受参数 foldername 并在公司主目录下创建同名文件夹，并以 XML 格式作为响应返回\
  \ noderef 值。你可以进一步使用返回的 noderef 根据需要调用其他 web 脚本，例如运行操作或创建内容。\n\n在后续章节中，你将找到需要在 JavaScript\
  \ 控制器和响应模板内部实现的核心代码片段，以实现上述场景。你也可以查看本章提供的代码文件，以查看此 web 脚本的 web 脚本实现。\n\n## 检索显式参数\n\
  \n为了实现此场景，作为 JavaScript 控制器中的第一件事，我们需要读取参数 foldername。显式参数可以使用 args 根对象检索。因此，我们将按如下方式读取参数\
  \ foldername：\n\n```\nif (args.foldername != null && args.foldername != \"\")\n\
  ```\n\n> 如果你在 web 脚本 URL 中提供了隐式参数，那么这些参数将无法使用 args 根对象获取。对于它们，你可以使用 url 根对象获取其值，如\
  \ url.templateArgs.foldername。\n\n\n\n\n# 在公司主目录下创建文件夹\n\n现在，在公司主目录下创建一个文件夹。如我们之前所见，companyhome\
  \ 作为根对象可用，我们可以直接使用它。它是 ScriptNode 类型的。因此，我们可以调用 ScriptNode API 中可用的方法来创建文件夹。CreateFolder()\
  \ 方法返回一个 ScriptNode 对象；将该对象设置在模型中，并在响应模板中使用它，通过 TemplateNode API 获取其中的 noderef 值。\n\
  \n在 JavaScript 控制器中，你将有以下代码行：\n\n```\nvar folderName = args.foldername;\nmodel.foldernode\
  \ = companyhome.createFolder(folderName);\n```\n\n在响应模板中，你将使用以下代码：\n\n```\n${foldernode.nodeRef}\n\
  ```\n\n我们来讨论一下刚刚完成的操作。我们在 JavaScript 控制器中使用了 args 和 companyhome 根对象，分别用于读取显式参数和创建文件夹。ScriptNode\
  \ 类中的所有可用方法都可以与 companyhome 对象一起使用。\n\n现在，我们还将了解一些其他功能，以理解根对象和 JavaScript API 的用法。我们还会查看相关的\
  \ JavaScript 代码来实现所提到的功能。\n\n## 查找节点\n\n在前面的示例中，Web 脚本在响应中返回了 nodeid。它是 Web 脚本中创建的文件夹的\
  \ nodeid。现在，你可能希望将第一个 Web 脚本返回的 nodeid 用作另一个 Web 脚本的输入。在另一个 Web 脚本中，你需要将 nodeid\
  \ 作为参数传递，并且需要在该节点上执行一些功能，例如确定用户是否对该节点有权限、获取节点的路径、获取节点的某个属性、修改节点的某个属性、检查节点是否应用了某个方面、在其中创建内容、调用操作等等。在进行任何此类操作之前，首先我们需要根据提供的\
  \ nodeid 从存储库中找到实际的节点。这可以通过 search 根对象访问的 findNode() 方法来完成，如下所示：\n\n```\nvar node\
  \ = search.findNode(\"workspace://SpacesStore/\" + args.nodeid);\n```\n\n这里，我们使用了\
  \ search 根对象，并调用了 search 根对象的 JavaScript API 中的 findNode() 方法。我们期望 nodeid 作为参数传递；因此，我们使用\
  \ args.nodeid 读取它。在调用节点的 findNode() 方法之前，我们必须构造要作为参数传递给该方法的 noderef 字符串；因此，我们将 workspace://SpacesStore/\
  \ 与 nodeid 连接起来。如果找到节点，它将返回一个表示所找到节点的 ScriptNode 对象。如果未找到节点，它将直接返回 null。\n\n## 检查用户对节点的权限\n\
  \n现在，一旦找到节点，在对节点执行上一节列出的任何其他操作之前，你首先需要检查用户是否至少对该节点具有读取权限。这可以使用 ScriptNode API 中可用的\
  \ hasPermission 方法来完成，如下所示：\n\n```\nvar permission = node.hasPermission(\"Read\"\
  );\n```\n\n我们使用了 ScriptNode API 中的 hasPermission() 方法。我们已经有了一个可用的节点对象，只需调用 hasPermission()\
  \ 方法并传入我们想要检查的权限。如果当前用户具有给定权限，它将返回 true。否则，它将返回 false。\n\n## 获取节点的路径\n\n接下来，你可能希望获取节点的路径，以确定该节点所属的文件夹层级。你可以使用\
  \ ScriptNode API 轻松获取节点的显示路径，如下所示：\n\n```\nvar nodepath = node.displayPath;\n```\n\
  \n我们从 ScriptNode 类中访问了一个变量 displayPath。ScriptNode 类中已经实现了一个 getter 方法 getDisplayPath()\
  \ 来获取节点的路径。该方法将返回给定节点的显示路径。\n\n## 检查节点的属性\n\n现在，你想查看节点的某些属性。例如，你计划修改 description\
  \ 属性。在此之前，你想在更改值之前了解当前值是什么，并希望将其记录下来以供参考。ScriptNode API 在执行与节点相关的操作时非常有帮助。借助 ScriptNode\
  \ API，你可以通过以下不同方式轻松获取属性值：\n\n```\nvar description = node.properties.description;\n\
  var description = node.properties[\"description\"];\n```\n\n```\nvar description\
  \ = node.properties[\"cm:description\"];\nvar description = node.properties[\"{http://www.alfresco.org/model/content/1.0}description\"\
  ];\n```\n\n我们刚刚看到了四种不同的读取节点属性的方式。如果你有一些自定义属性，你应该使用最后两种方式之一。\n\n## 记录属性值\n\n现在，在修改\
  \ description 属性之前，你想记录旧值以供参考。使用 logger 根对象，你可以简单地调用 logger 根对象的 log 方法，如下所示：\n\n\
  ```\nlogger.log(\"before change description value : \" + description);\n```\n\n\
  我们使用了 logger 根对象，并调用 log 方法来记录属性值。每当需要在 JavaScript 控制器中添加日志时，你可以使用 `logger.log()`\
  \ 方法。\n\n## 修改节点的属性\n\n现在，你想修改 `description` 属性。同样，借助 ScriptNode API，你可以轻松完成，如下所示：\n\
  \n```\nnode.properties.description = \"change in description\";\n```\n\n我们刚刚为 `description`\
  \ 属性设置了一个新值。你也可以使用我们看到的其他三种方式来访问该属性并为其设置新值。\n\n## 获取当前用户名和电子邮件\n\n你可能想了解哪个用户调用了\
  \ Web 脚本。为此，你可能希望记录执行 Web 脚本的用户的用户名和电子邮件地址，如下所示：\n\n```\nlogger.log(person.properties.username\
  \ + \" --- \" + person.properties.email + \"--- executed webscript\");\n```\n\n\
  我们使用了根对象 `person`，它基本上就是 `ScriptNode`。此外，我们获取了当前正在运行 Web 脚本的用户的用户名和电子邮件属性。你可以通过日志追踪并找出哪些用户执行了\
  \ Web 脚本；这在以后某个时候可能非常有用。\n\n## 返回 Guest Home 节点\n\n假设出于某种需求，你需要获取 guest home 文件夹的\
  \ noderef。这可以使用 ScriptNode API 中可用的 childByNamePath 方法来完成，如下所示：\n\n```\nmodel.foldernode\
  \ = companyhome.childByNamePath(\"Guest Home\");\n```\n\n在响应模板中，你可以像之前示例中那样，使用 TemplateNode\
  \ API 从模型对象 foldernode 中获取 noderef 值。\n\n我们使用了 companyhome 根对象和 childByNamePath()\
  \ 方法。对于任何 ScriptNode 类型的对象，你都可以使用此方法获取其子节点的 noderef。例如，你有一个文件夹层级结构 Company Home\
  \ > Testing > QA > Performance_Testing。现在，如果你有 Testing 文件夹的节点，并且想要获取 Performance_Testing\
  \ 的节点，那么你可以在 Testing 文件夹节点上调用该方法，并传入路径 childByNamePath(\"QA/Performance_Testing\"\
  )。\n\n## 创建你自己的根对象\n\n我们已经看到了一些在 JavaScript 控制器中使用根对象和 JavaScript API 的通用示例。现在你应该能够探索其他根对象和相关\
  \ JavaScript API，并找出哪些可以根据你的业务需求用于开发 Web 脚本。现在，让我们看一些非常有趣的内容。\n\n考虑一个场景，你想以系统用户身份执行\
  \ JavaScript 控制器的某些部分。你首先会做的是浏览可用的 JavaScript API，以确定是否有适用于此功能的 API。经过分析，你会发现没有现成的\
  \ API 可用。然而，你发现如果 Web 脚本是 Java 后端的 Web 脚本，你可以使用 Java API 来实现。但是，你的是基于 JavaScript\
  \ 的 Web 脚本。那么，接下来该怎么办？你一定在想是否也可以在 JavaScript API 中实现相同功能？不用担心，在 JavaScript 控制器中同样可以做到。你只需要创建一个自定义\
  \ JavaScript 扩展。\n\n\n\n\n## 自定义 JavaScript 扩展\n\n前面你已经了解到，每个 JavaScript API 都以\
  \ `baseJavaScriptExtension` 为父类。你可以按照以下步骤创建一个自定义 JavaScript 扩展，它将为你提供相应的 API 方法，使\
  \ Web 脚本的某一部分能够以系统用户身份运行，然后再恢复为原始用户身份来执行 Web 脚本的其他部分：\n\n- 1. 创建一个上下文文件，并向其中添加以下\
  \ bean 条目：\n\n  ```xml\n  <bean id=\"customAdmin\" parent=\"baseJavaScriptExtension\"\
  \n        class=\"com.example.CustomAdminAPI\">\n      <property name=\"extensionName\"\
  >\n          <value>customauth</value>\n      </property>\n  </bean>\n  ```\n\n\
  - 2. 创建一个 Java 类 `com.example.CustomAdminAPI`，该类将继承 `org.alfresco.repo.processor.BaseProcessorExtension`\
  \ 类，并按如下方式声明变量：\n\n  ```java\n  net.sf.acegisecurity.Authentication auth;\n  ```\n\
  \n- 3. 在该类中实现三个公共方法。第一个方法用于保存当前用户的身份验证信息，第二个方法用于以系统用户身份运行，第三个方法用于清除安全上下文并恢复原始用户的身份验证信息。下面就是我们刚讨论的三个方法的代码片段：\n\
  \n```java\npublic void saveCurrentUserAuthentication() {\n    auth = AuthenticationUtil.getFullAuthentication();\n\
  }\n\npublic void executeAsSystemUser() {\n    AuthenticationUtil.setRunAsUserSystem();\n\
  \    AuthenticationUtil.setFullyAuthenticatedUser(AuthenticationUtil.\n    SYSTEM_USER_NAME);\n\
  }\n\npublic void setBackOriginalUserAuthentication() {\n    AuthenticationUtil.clearCurrentSecurityContext();\n\
  \    AuthenticationUtil.setFullAuthentication(this.auth);\n}\n```\n\n- 4. 现在，部署这些文件并重新启动服务器。\n\
  \n在您的 JavaScript 后端控制器中，您现在应该按如下方式使用新创建的自定义 JavaScript 扩展：\n\n```\ncustomauth.saveCurrentUserAuthentication();\n\
  customauth.executeAsSystemUser();\n//Your piece of code you want to run as system\
  \ user.\ncustomauth.setBackOriginalUserAuthentication();\n```\n\n我们刚刚创建了一个自定义 JavaScript\
  \ 扩展，并公开了一个根对象，通过该根对象您可以访问为其创建的 API 方法。这就是当您找不到所需的相关 API 时，如何创建自定义 JavaScript 扩展的方法。\n\
  \n## 总结\n\n在本章中，我们全面介绍了在使用可用 JavaScript API 为 Web 脚本编写 JavaScript 控制器时可执行的所有功能。我们了解了如何从\
  \ Alfresco 代码库中识别 JavaScript API。我们还浏览了从 Alfresco 代码库中找到的暴露 JavaScript API 的常见根对象列表。\n\
  \n接下来，我们了解了 Alfresco 中 Web 脚本框架提供的各种其他根对象。然后，我们通过一些代码示例，了解了如何在控制器中使用根对象及相关 JavaScript\
  \ API，对 Alfresco 中的节点执行一些常规操作。最后，您学习了当现有 JavaScript API 无法满足需求时，如何创建自定义 JavaScript\
  \ 扩展来创建自己的根对象，并为该自定义根对象公开相应的 API 方法。总体而言，您现在已经了解了如何使用各种 JavaScript API 开发 JavaScript\
  \ 控制器，从而根据业务需求构建 Web 脚本控制器。\n\n在下一章中，我们将了解 Web 脚本开发中一些非常有用且重要的内容，例如 Web 脚本的部署、调试和故障排除。\n\
  \n## Web 脚本的部署、调试与故障排除\n\n在本章中，我们将介绍以下主题：\n\n- - Alfresco Web 脚本的部署选项\n- - Web 脚本调试的详细信息\n\
  - - 与 Web 脚本相关的常见问题的一些实用故障排除指引\n- - 在生产服务器上执行 Web 脚本的一些重要提示\n\n了解两件事非常重要：一是如何部署您已开发的内容，二是当某些功能无法按预期工作时如何进行调试。如果您了解这两件事，那么您的工作就会变得更加轻松，并且可以快速找到您正在处理的项目中一些关键问题的解决方案。\n\
  \n在 Alfresco 中开发 Web 脚本时，Web 脚本开发的第一阶段是创建 Web 脚本，即您需要开发 Web 脚本所需的各种构建块。第二个重要阶段是部署并注册\
  \ Web 脚本，以使您创建的 Web 脚本可供 Alfresco 中的 Web 脚本框架使用。这样您就可以使用自己的 Web 脚本了。作为开发人员，了解可用于部署\
  \ Alfresco Web 脚本的各种部署选项非常重要。此外，您还应该知道如何在 Alfresco 中调试 Web 脚本。\n\n在本章中，我们将介绍在 Alfresco\
  \ 中部署 Web 脚本的各种可能方式。同时，我们还会介绍 Web 脚本的调试技巧和一些有用的故障排除指引。我们还将介绍一些非常有用的提示，这些提示在您于生产服务器上为项目执行\
  \ Web 脚本时会很有帮助。\n\n## 部署选项\n\n您有两种可能的方式来部署您的 Web 脚本：\n\n- - 使用仓库选项\n- - 使用文件系统选项\n\
  \n在 Alfresco 中创建 Web 脚本时，您可能会为项目创建 Java 后端或 JavaScript 后端的 Web 脚本。这两种 Web 脚本都可以以不同的方式进行部署。了解每种部署选项可以将\
  \ Web 脚本部署到哪些位置，以及哪种选项更适合您，这一点非常重要。\n\n### 仓库选项\n\n简单来说，使用仓库选项部署 Web 脚本，就是将 Web\
  \ 脚本的组件文件放入仓库内的特定位置。\n\n首先，我们来看看基于 JavaScript 的 Web 脚本的部署。基于 JavaScript 的 Web 脚本可以部署在\
  \ Alfresco 仓库中。基于 JavaScript 的 Web 脚本的所有组件，例如描述文档、JavaScript 后端控制器实现、一个或多个响应模板、任何配置文档以及可选的消息包，都可以部署在\
  \ Alfresco 仓库中。\n\n## 理解部署位置\n\n我们刚刚看到，使用仓库选项部署 Web 脚本时，有两个可能的位置。使用文件系统位置部署 Web\
  \ 脚本时，则有四个这样的可能位置。作为开发人员，您一定想了解这两种部署选项的部署位置是如何确定的。\n\n了解背后的技术细节会很有帮助。在注册 Web 脚本时，`org.springframework.extensions.webscripts.DeclarativeRegistry`\
  \ 类总是会在注册 Web 脚本之前对 Web 脚本执行一次查找。它使用 `org.springframework.extensions.webscripts.SearchPath`，这基本上是一个\
  \ store 的集合。如果您查看 `searchPath` 集合中定义的每个 store，您会发现其中的路径位置基本上就是我们前面看到的六个部署位置。让我们来看看它在\
  \ Alfresco 中是如何作为 Spring bean 定义进行配置的。\n\n以下是在您的 Alfresco 安装目录下的 `tomcat\\webapps\\\
  alfresco\\WEB-INF\\classes\\alfresco` 位置可找到的 `web-scripts-application-context.xml`\
  \ 中 `SearchPath` 的 bean 条目。如果您使用的是 Alfresco Community 5，它位于 `alfresco-remote-api-*.jar`\
  \ 内的 `alfresco` 包下。\n\n```xml\n<bean id=\"webscripts.searchpath\" class=\"org.springframework.\n\
  \    extensions.webscripts.SearchPath\">\n    <property name=\"searchPath\">\n \
  \       <list>\n            <ref bean=\"webscripts.store.repo.extension\" />\n \
  \           <ref bean=\"webscripts.store.repo\" />\n            <ref bean=\"webscripts.store.client.extension\"\
  \ />\n            <ref bean=\"webscripts.store.client\" />\n            <ref bean=\"\
  webscripts.store.alfresco\" />\n            <ref bean=\"webscripts.store\" />\n\
  \        </list>\n    </property>\n</bean>\n```\n\n在上述 bean 定义中，`list` 属性下的前两个 bean\
  \ 保存的是我们前面看到的仓库部署位置的路径，另外四个 bean 保存的是文件系统部署位置的路径。您可以查看 `web-scripts-application-context.xml`\
  \ 中的这些 bean 定义，以了解更多详细信息。\n\n\n\n\n\n![](img/f02f759059b86af67e38b543d498a0d8_135_0.png)\n\
  \n你可能会有诸如如果 Web 脚本同时使用存储库部署选项和文件系统部署选项进行部署会怎样，或者如果一个 Web 脚本部署在多个位置会怎样，那么哪个位置会优先等问题。\n\
  答案很简单。Web 脚本将根据其在 SearchPath 的 Bean 定义下显示的顺序进行搜索。这意味着它首先会按顺序在存储库位置下进行搜索，然后再按顺序在文件系统位置下进行搜索。\n\
  \n## 选择部署选项\n\n为 Web 脚本部署选择存储库选项或文件系统选项可以根据多个参数来决定，例如为你的项目开发的 Web 脚本数量，是否需要频繁更改\
  \ Web 脚本，团队成员是否可以访问安装了 Alfresco 的服务器机器，以及你是否希望将 Web 脚本的代码作为源代码控制树的一部分进行管理。\n\n如果要开发大量\
  \ Web 脚本，则应选择文件系统部署选项，并将其作为源代码控制树的一部分进行管理。这样做的优点是，你可以使用用于自定义扩展的相同构建和部署工具，轻松部署构建你的业务解决方案的\
  \ Web 脚本以及其他自定义扩展代码。无需在存储库中上传 Web 脚本文件。你还必须确保可以访问安装了 Alfresco 的服务器；否则，当你想要部署并测试对\
  \ Web 脚本所做的修复，并且修复需要快速部署到实时生产系统时，你可能会遇到麻烦。\n\n在使用存储库选项进行部署时，Web 脚本文件存在于存储库中，类似于其他内容。如果需要对\
  \ Web 脚本进行一些修改，则可以通过编辑相关文件轻松完成。因此，Web 脚本在需要时可以轻松编辑。这种方法的优点是你不需要访问安装了 Alfresco 的服务器。你只需要能够通过用户界面访问存储库。在需要部署一些快速修复以解决一些关键问题的情况下，你可以实现基于\
  \ JavaScript 的 Web 脚本，并使用存储库选项部署你的 Web 脚本。\n\n## 调试 Web 脚本\n\n你已经完成了 Web 脚本的开发，成功部署了它们，甚至将你的\
  \ Web 脚本注册到 Web 脚本引擎。现在，在测试 Web 脚本功能时，你发现控制器中包含的逻辑没有按预期工作。因此，你的 Web 脚本无法返回所需响应。接下来你想弄清楚出了什么问题以及为什么它们不能按应有的方式工作。现在是时候调试以识别问题，从而为你提供修复问题的线索。我们现在来看看如何启用日志记录，如何在服务器上进行远程调试，以及一些有用的调试技术。\n\
  \n### 启用日志记录\n\n启用日志记录功能在调试问题时将非常有帮助。让我们了解如何在基于 Java 和基于 JavaScript 的 Web 脚本情况下使用日志记录。你应该记住的最重要的文件是\
  \ log4j.properties 文件，它位于你的 Alfresco 安装目录中的 tomcat\\webapps\\alfresco\\WEB-INF\\\
  classes 位置。\n\n对于调试基于 Java 的 Web 脚本，我们需要执行以下步骤：\n\n- 1. 你可以选择在控制器 Java 实现中添加 org.apache.log4j.Logger\
  \ 语句。\n- 2. 然后，你需要在 log4j.properties 文件中添加你的 Java 类的条目。\n- 3. 例如，你的 Web 脚本的 Java\
  \ 类为 com.example.TestWebScript。在向 Java 控制器类添加适当的记录器语句后，你应该在 log4j.properties 文件中为\
  \ Java 控制器添加条目 log4j.logger.com.example.TestWebScript=debug。\n- 4. 重启服务器，然后访问你的\
  \ Web 脚本；你应该能够在 catalina 日志中看到来自 Web 脚本 Java 控制器的记录器语句。\n\n对于调试基于 JavaScript 的 Web\
  \ 脚本，你将需要利用 logger 根对象，如下所示：\n\n- 1. 你应该使用 logger.log 方法在 JavaScript 控制器中添加所需的记录器语句，以便在查看日志时获得足够的详细信息。\n\
  - 2. 要启用对基于 JavaScript 的 Web 脚本的日志，你应该在 log4j.properties 中设置 log4j.logger.org.alfresco.repo.jscript\
  \ 为 debug，并且 log4j.logger.org.alfresco.repo.jscript.ScriptLogger 也为 debug。\n- 3.\
  \ 重启服务器，然后访问你的 Web 脚本；你应该能够在 catalina 日志中看到来自 JavaScript 控制器的记录器语句。\n\n### 服务器上的远程调试\n\
  \n有时，仅使用记录器语句可能不足以识别问题，你可能还想逐步执行代码以找到问题。在这种情况下，你需要对部署在服务器上的代码进行远程调试。\n\n为了能够远程调试基于\
  \ Java 的 Web 脚本，你应该首先在 Windows 中的 catalina.bat 文件和 Linux 中的 catalina.sh 中设置以下条目：\n\
  \n```\nset DEBUG_OPTS=-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=8888\n\
  ```\n\n然后，重启服务器。这将使你能够从你的 IDE 例如 Eclipse 远程调试 Web 脚本的 Java 代码。\n\n要调试基于 JavaScript\
  \ 控制器的服务器端 JavaScript，你可以使用 Alfresco JavaScript 调试器。你可以通过以下两种方式启用调试器：\n\n- 1. 在\
  \ log4j.properties 文件中，设置 log4j.logger.org.alfresco.repo.web.scripts.AlfrescoRhinoScriptDebugger\
  \ 为 on。这将在服务器启动时显示调试器 UI。另请设置 log4j.logger.org.alfresco.repo.jscript.ScriptLogger=debug。\n\
  - 2. 访问调试器 Web 脚本 URL，http://localhost:8080/alfresco/service/api/javascript/debugger。它将在屏幕上显示启用按钮。点击它以打开\
  \ Alfresco JavaScript 调试器 UI。\n\n使用此调试器调试 JavaScript 控制器代码非常容易。\n\n你只需通过 File |\
  \ Open 打开控制器文件，并为其添加调试点。现在，访问你想要调试的 Web 脚本。\n\n控制将进入调试器，你现在可以调试代码。调试时有 Step Into、Step\
  \ Over 或 Step Out 等选项会很有帮助。此外，你还可以监视调试时变量的值。\n\n## 部署、调试和故障排除 Web 脚本\n\n以下是供你参考的\
  \ Alfresco JavaScript 调试器用户界面的屏幕截图。要调试 share Web 脚本，只需将之前的 URL 中的 alfresco 替换为 share\
  \ 即可。\n\n![](img/f02f759059b86af67e38b543d498a0d8_138_0.png)\n\nAlfresco JavaScript\
  \ Debugger UI\n\nAlfresco JavaScript 调试器可以在 Alfresco 作为服务运行时或从控制台运行时访问。要使用它，你需要确保你没有在无头服务器上运行，否则它将不会显示调试器\
  \ UI。此外，当 Alfresco 作为服务运行时，你在使用调试器 UI 时可能会遇到问题。一般来说，你应该在通过控制台启动 Alfresco 服务器后使用调试器\
  \ UI，而不是让 Alfresco 服务器作为服务启动。这将节省你大量时间，让你专注于调试与 Web 脚本相关的问题，而不是调试当服务器作为服务启动时调试器\
  \ UI 的问题。\n\n### 其他调试技术\n\n让我们看看一些可能非常有用的其他调试技术：\n\n- - 当你的 Web 脚本无法工作时，你还应该检查它是否已正确注册到\
  \ Alfresco Web 脚本引擎。你可以访问 `http://localhost:8080/alfresco/service/index` 并从可用的各种浏览\
  \ Web 脚本的选项中定位你的 Web 脚本，例如按包或按 URI 浏览所有内容。点击它后，它将显示描述符、JavaScript 控制器和响应模板。你可以确保\
  \ JavaScript 控制器包含你为修复问题而添加的所有修复或修改。\n- - 在你的 Web 脚本中，当你处理节点的某些属性、节点的权限等时，你也可以从\
  \ `nodebrowser` 获得帮助。使用 `noderef`，你可以查明节点上设置的属性、其子节点、应用在其上的方面、与其他节点的关联以及节点的权限等详细信息，这在为你的问题修复进行调试时也可能对你有用。你还可以使用\
  \ `nodebrowser` 中提供的其他功能，例如执行 lucene 查询的能力，这在你想要验证 Web 脚本控制器使用的 lucene 查询时也可能有所帮助。\n\
  \n## 故障排除指针\n\n在了解了在 Alfresco 中调试 Web 脚本的不同方法后，让我们看看在处理 Alfresco Web 脚本时可能会遇到的一些常见问题的故障排除指针。\n\
  \n### 一个有效的 SecureContext 错误\n\n你有时可能会遇到错误 **A valid SecureContext was not provided\
  \ in the RequestContext**。出现此错误的原因可能有很多。一些原因如下：\n\n- - 当你在 Web 脚本描述文档中将身份验证设置为 `none`，并且在控制器中尝试调用需要身份验证的\
  \ Alfresco 的某些公共服务时，例如调用 `toDisplayPath()` 方法，它将给出上述异常。\n- - 如果你的 Web 脚本具有基于 JavaScript\
  \ 的控制器，并且你使用存储库选项部署了它，并且身份验证设置为 `none`，当你尝试访问你的 Web 脚本时，你将收到上述异常。\n\n\n\n\n\n##\
  \ Web Script 格式未注册\n\n在 Alfresco 中开发 Web 脚本时，当你尝试访问 Web 脚本时，可能会遇到如下错误：**Web Script\
  \ format \" is not registered**。\n\n原因是：如果你有一个基于 JavaScript 的控制器，或一个扩展 `DeclarativeWebScript`\
  \ 类的 Java 控制器，并且在 Web 脚本的描述文档中将默认格式指定为空值（例如 `<format default=\"\">`），就会出现这个错误。\n\
  \n> 如果你使用存储库选项部署基于 JavaScript 的 Web 脚本，请确保 Web 脚本已设置身份验证级别，并且不应将其设置为 none。\n\n>\
  \ 当你希望在不使用模板的情况下自行控制并返回响应时，应该使用扩展 `AbstractWebScript` 类的基于 Java 的控制器。在这种情况下，在 Web\
  \ 脚本描述文档中将默认格式指定为空值不会导致上述错误。\n\n## 无法定位模板的模板处理器\n\n对于你的 Web 脚本，你已经创建了描述文档、必需的控制器实现和必需的响应模板。但是，当你尝试执行\
  \ Web 脚本时，却收到了如下错误：**Cannot locate template processor for template example/contentlocation.get.xml**。\n\
  \n看到这个错误，你首先会想：模板明明已经放好了，为什么还会出现这个错误？有时，要找出问题所在确实非常棘手。这里的情况也是如此。导致这个错误的原因是模板名称不符合\
  \ Web 脚本的命名约定。它应该是 `contentlocation.get.xml.ftl`，而不是 `contentlocation.get.xml`。\n\
  \n> 你必须始终确保遵循 Web 脚本的命名约定，并始终将 Web 脚本文件部署到正确的位置。如果你有基于 Java 的控制器，请确保其 bean ID 已按预期指定。\n\
  \n## 脚本 URL 不支持该方法\n\n简单来说，这个错误通常发生在你没有使用适当的方法调用 Web 脚本时。例如，当你有一个 POST Web 脚本，却用\
  \ GET 请求调用它时，就会看到“脚本 URL 不支持该方法”（script URL does not support the method）的错误。为了避免这个错误，你应该始终使用适当的方法来调用\
  \ Web 脚本。\n\n## 在生产服务器上运行 Web 脚本\n\n生产服务器听起来很有趣，不是吗？是的，这是最重要的事情。在从事线上项目、为你的客户提供以\
  \ Alfresco 作为后端存储库的生产系统支持时，你可能需要根据业务需求编写不同的 Web 脚本。由于生产服务器要处理的内容数量远多于开发服务器，这些脚本的执行时间可能会更长。例如，你可能需要编写一个修补脚本，为现有节点添加额外属性；或者可能需要编写一个\
  \ Web 脚本，检索符合某些特定条件的记录。下面我们来看看在生产服务器上运行这类 Web 脚本时需要注意什么。\n\n## 在后台运行 Web 脚本\n\n\
  你编写的 Web 脚本在对大量内容执行时，可能需要更长的处理时间。在这种情况下，你不能从浏览器访问 Web 脚本并一直等待响应返回。对于这类需要在生产服务器上运行的\
  \ Web 脚本，可以选择的一种方法是在后台运行 Web 脚本，并直接从服务器本身调用 Web 脚本，这样你就不必担心调用客户端与服务器断开连接。\n\n为了能够在后台运行\
  \ Web 脚本，一种方式是通过 shell 脚本调用 Web 脚本。然后，你可以在服务器上以后台方式运行该 shell 脚本。可以使用以下示例命令在后台运行\
  \ shell 脚本：\n\n```sh\nnohup execute-webscript.sh > webscript.log &\n```\n\n该命令会在后台运行\
  \ `execute-webscript.sh`（这个 shell 脚本基本上就是用来调用你的 Web 脚本的），并将 shell 脚本的执行日志输出到 `webscript.log`\
  \ 文件中。你可能还想实现一个电子邮件通知功能，在 Web 脚本执行完成后触发一封电子邮件，这样你就不必频繁监控日志，而可以在 Web 脚本执行完成后收到通知。\n\
  \n现在，你需要备份 Web 脚本的模板。例如，将描述文件和响应模板重命名为 `*.bak`。然后，访问 http://localhost:8080/alfresco/service/index\
  \ 刷新 Web 脚本。此时，该 Web 脚本即被禁用，你将无法再访问它。\n\n## 小结\n\n在本章中，我们了解了 Alfresco 中 Web 脚本可能的部署选项，并理解了\
  \ Alfresco 的 Web 脚本框架在多个位置部署时如何决定 Web 脚本的优先级。我们还了解了一些有助于你按需选择部署选项的因素。我们还了解了如何调试\
  \ Web 脚本，以找出 Web 脚本出了什么问题。我们还介绍了一些处理 Web 脚本时可能遇到的常见问题的故障排除要点。最后，我们还介绍了一些在生产服务器上运行\
  \ Web 脚本时可能有用的提示和技巧。总的来说，现在你已经很好地理解了如何在 Alfresco 中部署和调试 Web 脚本；下次需要在生产服务器上运行 Web\
  \ 脚本时，你也可以与其他开发人员或项目经理分享一些想法，说明如何实现在生产服务器上执行 Web 脚本。\n\n现在，当你需要开发大量 Web 脚本时，由于你将在一个团队中工作，如果没有项目结构，就无法完成开发；而且最终所有代码都应放在源代码控制树中。建立用于开发\
  \ Web 脚本的开发项目非常重要。在下一章中，我们将了解如何在 Eclipse 中建立一个可以使用 Maven 构建的开发项目。\n\n## Maven 化\
  \ Web 脚本\n\n在本章中，我们将介绍以下主题：\n\n- 使用 Maven 搭建开发环境\n- 使用 Alfresco Maven SDK 创建默认项目结构\n\
  - 使用 Maven 构建 **Alfresco 模块包（AMP）**\n- 在 Eclipse 中搭建开发环境\n- 理解默认项目结构\n- 扩展默认项目结构以创建\
  \ Web 脚本\n- 使用 Maven 将 AMP 应用到 Alfresco WAR，以便在本地测试开发的 Web 脚本\n- 在 Alfresco 企业版中使用\
  \ Maven 需要了解的事项\n\n## Maven 化 Web 脚本\n\n到目前为止，在探索 Alfresco Web 脚本的过程中，我们已经了解了如何开发和部署\
  \ Web 脚本。在前几章中，我们没有为开发的 Web 脚本使用任何项目结构，也没有使用任何工具来构建 Web 脚本。我们只是在自己选择的编辑器中创建 Web\
  \ 脚本所需的文件，然后手动将 Web 脚本文件部署到文件系统中的相应位置。由于 Web 脚本数量较少，而且我们只是为了理解 Web 脚本才这样做，所以这种方法是可行的。\n\
  \n但是，请考虑这样一种场景：你必须为项目开发大量 Web 脚本。在这种情况下，单独创建 Web 脚本文件并手动部署就不是合适的选择。此时，你绝对需要遵循一种项目结构来开发\
  \ Web 脚本。此外，你还需要一种 Web 脚本部署机制，这样无需手动传输 Web 脚本文件，就能轻松有效地将所有 Web 脚本部署到服务器上。\n\n现在，你可能会有几个问题，例如：如何建立项目结构来开发\
  \ Web 脚本？可以使用哪种部署工件（deployment artifact）在 Alfresco 中部署 Web 脚本？可以使用什么工具来构建所需的部署工件？在使用该工具之前，需要考虑并准备好哪些先决条件？我是否需要详细了解该工具？我该如何着手？\n\
  \n不用担心这些问题。我们将在本章中找到解决方案。\n\n首先，我们简要回答一下前面的问题。你应该使用 Alfresco Maven SDK 创建项目。它本质上是一个社区项目，同时得到\
  \ Alfresco 的支持，提供了一种非常易用的方式来为 Alfresco 创建扩展。你应该使用 **Alfresco 模块包（AMP）** 作为部署工件。AMP\
  \ 本质上是一个 ZIP 文件，具有特定的文件夹结构，其中包含你为 Alfresco 项目开发的所有必需文件。通常，在目标服务器上部署时，会使用 **模块管理工具**\
  \ 将 AMP 文件应用到原版 Alfresco WAR 文件中。你可以使用 Apache Maven 来构建 AMP 文件，将其作为所需的部署工件。Apache\
  \ Maven 本质上是一个构建管理工具，它能够理解项目的 JAR 依赖项并检索它们。\n\n如果你不熟悉 Maven，或者对 Maven 没有了解，也没关系。本章不会深入探讨\
  \ Alfresco Maven SDK、AMP 和 Maven。我们之前已经对它们是什么做了基本介绍，目前这些已经足够让你开始使用了。本章的主要目标是让你基本了解如何使用\
  \ Alfresco Maven SDK 创建定义好的项目结构、让项目可在 Eclipse 中使用、构建 AMP 作为 Web 脚本开发的部署工件，以及如何使用\
  \ Maven 将 AMP 应用到开箱即用的 Alfresco WAR 中以测试功能。\n\n\n\n\n\n## 设置开发环境\n\n在开始之前，重要的是要了解\
  \ Alfresco Maven SDK 与 Alfresco Community 4.2 及以上版本、Alfresco Enterprise 4.1.2 及以上版本兼容。有趣的是，使用\
  \ Alfresco Maven SDK 时，你无需在机器上手动安装 Alfresco。Alfresco Maven SDK 将使你的工作更加轻松，它会根据项目对象模型（POM）XML\
  \ 中为版本和 groupId 提供的条目，自动在你的机器上下载 Alfresco。\n\n现在，在开始使用 Alfresco Maven SDK 创建项目之前，让我们首先确保开发机器上已经安装了所需的前置条件：\n\
  \n- 你需要在机器上安装并正确配置 JDK 1.7。**Java 开发工具包（JDK）** 基本上是一个使用 Java 编程语言构建应用程序的开发环境。你可以从\
  \ `http://www.oracle.com/technetwork/java/javase/downloads/jdk7-downloads-1880260.html`\
  \ 下载。下载并安装后，请确保设置 JAVA_HOME 环境变量以及 **Path** 变量。\n\n- 你需要安装并正确配置 Apache Maven 3.0.3\
  \ 或更高版本。你可以从 `http://maven.apache.org/download.cgi` 下载。你还会找到基于你所用操作系统的安装说明。成功下载并安装后，请确保环境变量\
  \ M2E_HOME 已正确设置，并且相应修改了 **Path** 变量。\n\n现在，让我们通过运行 `mvn -version` 命令来检查 Maven 是否指向正确的\
  \ JDK 安装，并确保你已安装正确版本的 Maven。在 Windows 机器上，从命令提示符运行此命令将显示有关 Maven 版本、Maven 主目录、Maven\
  \ 使用的 Java 版本以及 Java 主目录的信息：\n\n```\nC:\\Users\\ramesh.chauhan>mvn -version\nApache\
  \ Maven 3.0.4 (r1232337; 2012-01-17 14:14:56+0530)\nMaven home: D:\\apache-maven-3.0.4\\\
  bin\\..\nJava version: 1.7.0_51, vendor: Oracle Corporation\nJava home: C:\\Program\
  \ Files\\Java\\jdk1.7.0_51\\jre\nDefault locale: en_US, platform encoding: Cp1252\n\
  OS name: \"windows 7\", version: \"6.1\", arch: \"amd64\", family: \"windows\"\n\
  ```\n\n## 探索 Alfresco Maven 仓库\n\nAlfresco Maven 仓库基本上是一个公共位置，所有与 Alfresco 相关的依赖\
  \ JAR 都保存在那里，你可以在项目的 pom.xml 文件中配置项目以引用仓库中的所需依赖。你可能希望探索 Alfresco Maven SDK 将使用的\
  \ Maven 仓库。访问 https://artifacts.alfresco.com/nexus/#view-repositories 并探索包含已发布和稳定工件的公共发布仓库。此外，在\
  \ https://artifacts.alfresco.com/nexus/service/local/repo_groups/public/content/archetype-catalog.xml\
  \ 的 archetype-catalog 下，可以找到不同的可用默认项目模板，这些模板在 Maven 术语中称为原型（archetype）。\n\n## 为\
  \ AMP 创建默认项目结构\n\n为了创建 AMP 的项目结构，我们将使用 Alfresco Maven SDK 提供的项目模板。这个默认项目模板基本上被称为\
  \ AMP 原型。此项目模板有助于为你将为项目开发的 Alfresco 扩展提供标准化的开发、部署和发布方法。Alfresco AMP 原型可用于在需要时创建\
  \ repository 和 share 的 AMP。在本章中，我们将使用 AMP 原型来开发 repository web scripts。\n\n> Alfresco\
  \ Maven SDK 还提供了另一个有用的原型，称为 All-in-One 原型，它基本上是一个多模块项目，并提供了 Alfresco 平台及其组件的完整安装，无需额外下载。在探索\
  \ archetype-catalog.xml 时，你可能已经注意到有很多可用的原型。重要的原型，即 Alfresco AMP 原型和 All-in-One 原型，可以通过\
  \ archetype-catalog.xml 中具有 org.alfresco.maven.archetype group ID 来识别。\n\n为了使用 Alfresco\
  \ AMP 原型创建默认 AMP 项目，请执行以下步骤：\n\n1. 从控制台运行以下命令。这里需要注意，如果 https 链接对你不适用，你可以在以下代码片段中尝试使用\
  \ http 代替 https：\n\n```\nmvn archetype:generate -DarchetypeCatalog=https://artifacts.alfresco.com/nexus/content/groups/public/archetype-catalog.xml\
  \ -Dfilter=org.alfresco.maven.archetype:\n[INFO] Scanning for projects...\n[INFO]\
  \ Building Maven Stub Project (No POM) 1\n[INFO] >>> maven-archetype-plugin:2.2:generate\
  \ (default-cli) @ standalone-pom >>>\n[INFO] <<< maven-archetype-plugin:2.2:generate\
  \ (default-cli) @ standalone-pom <<<\n[INFO] --- maven-archetype-plugin:2.2:generate\
  \ (default-cli) @ standalone-pom ---\n[INFO] Generating project in Interactive mode\n\
  [INFO] No archetype defined. Using maven-archetype-quickstart (org.apache.maven.archetypes:maven-archetype-quickstart:1.0)\n\
  ```\n\n2. 您将看到可用的原型及其简要说明，如下面的屏幕截图所示。系统将提示您选择一个原型。输入 1 并按回车，如下面的屏幕截图所示：\n\n```\n\
  Choose archetype:\n1: https://artifacts.alfresco.com/nexus/content/groups/public/archetype-catalog.xml\
  \ -> org.alfresco.maven.archetype:alfresco-amp-archetype [Sample project with full\
  \ support for lifecycle and rapid development of AMPs (Alfresco Module Packages)]\n\
  2: https://artifacts.alfresco.com/nexus/content/groups/public/archetype-catalog.xml\
  \ -> org.alfresco.maven.archetype:alfresco-allinone-archetype [Sample multi-module\
  \ project for All-in-One development on the Alfresco platform. Includes modules\
  \ for Repository, AMP, Share, Solr, Web Quick Start and embedded Jetty run]\nChoose\
  \ a number or apply filter (format: [groupId:artifactId, case sensitive contains]):\
  \ : 1\n```\n\n3. 在下一步中，系统将要求您选择作为项目基础的原型版本。这将列出您所选原型的可用版本。您也可以从 archetype-catalog.xml\
  \ 文件中找到这些版本。对于 AMP 原型，1.1.1 是目前的最新版本。因此，输入 5 并按回车，如下面的屏幕截图所示：\n\n```\nChoose org.alfresco.maven.archetype:alfresco-amp-archetype\
  \ version:\n1: 1.0\n2: 1.0.1\n3: 1.0.2\n4: 1.1.0\n5: 1.1.1\nChoose a number: 5:\
  \ 5\n```\n\n4. 接下来，系统将提示您为 groupId 提供值，您可以将其视为 Java 术语中的包名。您可以为您的项目提供任何适合的名称。在这里，我们将提供\
  \ com.example 作为 groupId，如下面的代码所示：\n\n```\nDefine value for property 'groupId':\
  \ : com.example\n```\n\n7. 现在，在 Maven 进行一些处理后，它将在控制台上显示 **构建成功** 消息，并显示从原型创建的项目位置作为信息性消息，如下面的屏幕截图所示：\n\
  \n![](img/f02f759059b86af67e38b543d498a0d8_151_0.png)\n\n它已为 Alfresco 项目生成所需的示例项目结构，以生成\
  \ AMP 文件。现在，您可以转到创建默认项目结构的位置并进行探索。这里项目结构创建在 `C:\\Users\\ramesh.chauhan\\example-repo`\
  \ 位置。在生成的项目结构中，您会发现的最重要文件是 `pom.xml`，每个 Maven 项目基本上都使用它来向 Maven 指示项目依赖关系。除了 `pom.xml`，生成的项目结构还包含默认配置文件、示例\
  \ Java 代码及其支持的单元测试，以及用于测试的运行本地 Alfresco 实例的配置。\n\n## 从默认项目生成 AMP\n\n一旦默认项目结构准备就绪，让我们尝试为其生成\
  \ AMP 文件。转到所创建项目结构的位置。要为其创建 AMP 文件，请运行 `mvn package -DskipTests=true` 命令。\n\n在这里，我们在生成\
  \ AMP 时并不想运行测试；因此，我们明确将 `skipTests` 设置为 true。如果您也想运行测试，则只需执行 `mvn package` 命令。\n\
  \n\n\n\n\n运行上述命令应该会在我们创建的项目内的 target 文件夹下生成一个名为 `example-repo-amp` 的 AMP 文件。你可以使用任何\
  \ ZIP 解压工具打开该 AMP 文件并进行浏览。\n\n> 你可以使用默认项目结构，不仅可以创建 Web 脚本，还可以对 Alfresco 进行其他自定义，例如自定义操作、自定义内容模型、自定义工作流等，并创建\
  \ AMP 以便它们可以部署。\n\n现在，运行 `mvn clean` 命令，它将清理 target 文件夹。因此，生成的 AMP 文件也会被移除。我们这样做是故意的，因为我们希望回到默认项目结构，并将项目结构导入\
  \ Eclipse。同时，我们也想了解默认项目结构中包含哪些文件和目录。\n\n## 使用 Eclipse 设置开发环境\n\n在此阶段，由 Alfresco\
  \ Maven SDK 提供的原型创建的项目结构已经就绪于文件系统中。下一步，我们希望能在 Eclipse 中获得相同的项目结构，以便在 Eclipse IDE\
  \ 中按照定义好的项目结构开始开发 Web 脚本。你可以根据所用操作系统，从 `http://www.eclipse.org/downloads/packages/`\
  \ 上提供的不同发行包中下载 Eclipse IDE。只需确保它支持 Maven 插件。\n\n> 在本章中，我们将使用 Luna 发行包中的 Eclipse\
  \ Java EE IDE，它内置了 Maven 支持。你可能会使用其他版本的 Eclipse，因此需要确保如果它没有内置 Maven 支持，则已为 Eclipse\
  \ IDE 添加 Maven 插件。为 Eclipse IDE 添加 Maven 插件是一个简单的过程，你应该可以轻松完成。\n\n现在，要将默认项目结构导入\
  \ Eclipse，请执行以下步骤：\n\n1. 打开 Eclipse IDE。点击**文件 | 导入 | Maven | 现有 Maven 项目**，然后点击**下一步**。\n\
  \n2. 在显示的屏幕中，导航到本地文件系统上的项目位置，然后点击“确定”。随后，它应该在项目的 pom.xml 前显示一个选中的复选框。然后，点击“完成”。\n\
  \n![](img/f02f759059b86af67e38b543d498a0d8_153_0.png)\n\n3. 在下一个屏幕上，将显示一个关于 Alfresco\
  \ Maven 插件 set-version 的错误，如下面的截图所示。暂时忽略该错误，点击“完成”。\n\n![](img/f02f759059b86af67e38b543d498a0d8_153_1.png)\n\
  \n4. 随后会显示一个“不完整的 Maven 目标执行”弹出窗口，如下面的截图所示。点击“确定”。\n\n![](img/f02f759059b86af67e38b543d498a0d8_154_0.png)\n\
  \n5. 你可能会看到要求安装构建辅助插件的窗口。如果你愿意，可以继续，或直接点击“取消”。项目 example-repo 现在将出现在 Eclipse 中；但上面的红色标记表示存在一些错误。如果你查看“标记”（Markers）选项卡，就会看到前面忽略的与\
  \ Maven 插件相关的错误。右键点击它，然后点击“快速修复”（Quick Fix）。选择“永久将 pom.xml 中的 set-version 目标标记为在\
  \ Eclipse 构建中忽略”选项。它会显示一个选择 POM 位置的选项。选择 POM 位置并点击“确定”。\n\n6. 现在，右键点击 example-repo\
  \ 项目。转到“Maven | 更新项目”，然后点击“确定”。项目现已成功导入，除了默认包中 Java 类的未使用导入警告消息外，没有错误。你可以忽略这些警告。\n\
  \n> 首次在 Eclipse 中导入项目时，如果遇到任何与构建路径相关的错误，请确保像上一步那样更新项目，并确保所有 Maven 依赖项都已下载到本地机器上。\n\
  \n现在，我们已将默认项目结构作为 Maven 项目导入 Eclipse IDE。\n\n## 理解默认项目结构\n\n既然已经在 Eclipse 中导入了项目，现在让我们浏览一下项目结构，以了解其中重要的文件和目录：\n\
  \n| 项目结构中的文件/目录 | 简要说明 |\n|---|---|\n| `pom.xml` | 对于任何 Maven 项目，pom.xml 都是必需的，以便让\
  \ Maven 了解项目依赖关系。pom.xml 文件直接位于项目目录下。如果你查看 pom.xml，就会获得有关项目依赖关系、仓库信息和其他重要信息的所有详情。此外，在我们项目的\
  \ pom.xml 中，你应该能够看到我们使用 Maven 原型生成项目时提供的设置。如果你愿意，可以在此处更改这些设置，然后像之前那样更新项目。Maven 随后会考虑这些更新并处理相应事宜。\
  \ |\n| `src/main/java` | 该目录将用于放置项目的 Java 源代码。你可以将 Java 类组织到此位置下合适的包中。你将为项目开发的 Web\
  \ 脚本的 Java 控制器应放置在此位置。除了 Web 脚本控制器之外，你还可以放置用于其他自定义（例如自定义操作等）的 Java 类。构建项目时，放置在此处的\
  \ Java 类将包含在作为部署工件生成的 AMP 内的 JAR 文件中。当 AMP 应用到 Alfresco WAR 文件时，JAR 文件将部署到 WEB-INF/lib\
  \ 下。 |\n| `src/main/amp` | 所有与 AMP 相关的必要详情都位于此位置。module.properties 文件是 AMP 结构的重要文件。它包含有关\
  \ AMP 文件的详细信息，例如 AMP 的 ID、版本、依赖项，以及运行它所需的 Alfresco 最低和最高版本。位置 src/main/amp/config/alfresco/module/example-repo\
  \ 是 AMP 的核心，将包含 Spring 配置上下文文件、内容模型文件等重要文件。你可以在 src/main/amp/config/alfresco 下创建\
  \ extensions、messages 文件夹，以包含 Web 脚本组件文件。 |\n| `src/test` | 与单元测试用例相关的实现以及运行单元测试用例的配套配置将放置在此处。只需查看此位置下可用的默认文件夹，你就会了解默认文件夹内部包含什么。\
  \ |\n\n## 扩展默认项目以创建 Web 脚本\n\n在前几章开发 Web 脚本时，我们没有遵循任何项目结构，而是在我们选择的编辑器中独立开发 Web 脚本所需的文件，然后手动将它们部署到已安装的\
  \ Alfresco 目录中的适当位置。现在，既然已经理解了项目结构和 AMP 部署包，是时候探索如何扩展默认项目结构来创建 Web 脚本了。在开发新的 Web\
  \ 脚本时，让我们试着了解应该将 Web 脚本相关文件放置在项目结构中的什么位置：\n\n-   Web 脚本描述符文件（\\*.desc.xml）、Web 脚本的响应模板（\\\
  *.ftl）、Web 脚本的配置文档（\\*.config.xml）和消息包（\\*.properties）应放置在 src/main/amp 位置下。在 src/main/amp/config/alfresco\
  \ 中可用的默认结构内，创建一个新的文件夹结构 /extension/templates/webscripts，以存储你将创建的所有新 Web 脚本。然后，你可以在此位置内将\
  \ Web 脚本分类到不同的包中，例如，所有与登录相关的自定义 Web 脚本及其描述符、响应模板、配置文档和消息包都可以放在 src/main/amp/config/alfresco/extension/templates/webscripts/login\
  \ 位置下。\n-   对于基于 JavaScript 的 Web 脚本，控制器实现（\\*.js）也应与前面提到的其他文件一起放置在同一位置。\n-   对于\
  \ Java 后端的 Web 脚本，控制器实现（\\*.java）应放置在 src/main/java 内合适的包结构下。\n-   对于 Java 后端的 Web\
  \ 脚本，将控制器与 Web 脚本关联的 Spring 配置上下文文件应放置在 src/main/amp/config/alfresco/extension 下。你也可以将来自\
  \ Java 控制器的 Spring bean 映射条目放在 src/main/amp/config/alfresco/module/proj-name 下的\
  \ module-context.xml 文件中。\n\n> 一旦通过运行 Maven package 为项目生成 AMP，你应该能看到所有 Java 类都被放入一个\
  \ JAR 文件，而其他文件则按照我们在项目结构中的放置方式被适当地置于 AMP 文件中。现在，你可以将这个 AMP 文件交给其他服务器进行部署。\n\n\n\n\
  \n\n## 将 AMP 应用到 Alfresco WAR 以进行测试\n\n在按照前面的项目结构完成项目的 web 脚本开发后，为你的项目创建一个 AMP 文件，并在将\
  \ AMP 文件移交到其他服务器部署之前先进行测试。为了在本地测试你的 web 脚本，你首先需要将 AMP 应用到 Alfresco WAR 文件。使用 Alfresco\
  \ Maven SDK，你无需在本地安装 Alfresco 即可应用 AMP。从控制台进入项目的目录，然后只需执行 `mvn integration-test\
  \ -Pamp-to-war` 命令即可。\n\n运行上述命令后，你会看到 Maven 正在下载所有必要的依赖项以编译项目。这将为项目创建 AMP 文件，将 AMP\
  \ 文件应用到开箱即用的 Alfresco WAR，然后将 WAR 部署到嵌入式 Tomcat 服务器，最后启动服务器。你应该能从控制台输出中看到项目的 AMP\
  \ 模块已成功生成并被 Alfresco 服务器识别。\n\n你可以登录 Alfresco 服务器 `http://localhost:8080/alfresco`，并访问你所开发的\
  \ web 脚本的 web 脚本 URL。测试完成后，请确保关闭正在运行的服务器。你可以简单地在运行 Maven integration 命令的控制台上按 `Ctrl\
  \ + C` 来关闭服务器。\n\n> 如果在运行之前的 integration test 命令时遇到内存不足错误，你需要增加分配给 Alfresco 和 Tomcat\
  \ 的内存大小。你可以通过为 Maven 提供额外的 JVM 内存设置来做到这一点，例如增加 PermGen 大小。\n\n我们刚刚看到，在开发机器上之前未安装\
  \ Alfresco 的情况下，我们能够借助 Alfresco Maven SDK 非常轻松地测试我们的定制开发。我们所做的只是执行了一个命令，Maven 为我们完成了所有必要的工作，使工作变得更容易，让我们可以更专注于开发，而不必担心在本地机器上下载和设置\
  \ Alfresco、生成 AMP 以及将其部署到 Alfresco WAR 等事情。\n\n![](img/f02f759059b86af67e38b543d498a0d8_158_0.png)\n\
  \n## 摘要\n\n在本章中，我们对如何借助 Alfresco Maven SDK 提供的 Maven 支持，使你的 Alfresco web 脚本开发和部署体验变得简单有了基本的了解。首先，我们介绍了设置先决条件以使用\
  \ Maven 设置开发环境。我们了解了如何创建默认的项目结构，以便创建 Alfresco 部署包 AMP，然后我们了解了如何为默认项目结构生成 AMP。之后，我们将项目导入\
  \ Eclipse IDE 并设置开发环境，然后了解了默认项目结构中存在的各种文件和目录。\n\n我们随后研究了如何扩展默认项目结构以使用 JavaScript\
  \ 和 Java 开发项目的 web 脚本。此外，我们还学习了如何使用 Maven 命令将 AMP 应用到 Alfresco WAR，以便在本地机器上未安装 Alfresco\
  \ 的情况下测试已开发的功能。最后，我们介绍了如何使用 Maven 与你的 Alfresco 企业版一起使用。总的来说，你现在对使用 Maven 支持进行 Alfresco\
  \ web 脚本开发有了基本的了解，可以开始着手。\n\n在下一章中，我们将研究如何扩展 Alfresco 中的 web 脚本框架。\n"
- "# 第10章：扩展 Web 脚本框架\n\n在本章中，我们将介绍：\n\n- 扩展 web 脚本运行时以创建自定义实现\n- Web 脚本容器的自定义实现\n\
  - 向 web 脚本框架添加自己的身份验证器实现\n- 脚本处理器和模板处理器自定义实现\n- 自定义格式\n\n我们开始学习 Alfresco web 脚本的旅程，首先熟悉了\
  \ web 脚本。然后我们进行了一个动手练习，创建了 Alfresco 中的第一个 web 脚本，并深入了解了理解 Alfresco 中 web 脚本框架的技术知识。之后，我们对\
  \ web 脚本的构建块以及调用 web 脚本的不同方式有了深入的了解。我们还了解了如何创建 Java 支持的 web 脚本，然后详细探讨了基于 JavaScript\
  \ 的 web 脚本。接下来，我们研究了 web 脚本的部署、调试和故障排除，然后学习了如何使用 Maven 设置开发环境。到目前为止，你应该已经获得了在实际项目中实际实施和使用\
  \ Alfresco web 脚本所需的知识。此外，你应该能够调试、排除故障并修复项目中 web 脚本的问题。现在，作为本书的最后一部分要学习的内容，是时候了解在\
  \ Alfresco 中扩展 web 脚本框架的可能性了。\n\n在开始之前，你可能希望复习一下我们在 *第 3 章、理解 Web 脚本框架* 中学到的 web\
  \ 脚本框架的知识。简要总结一下，web 脚本框架的核心组件是 web 脚本运行时、web 脚本容器和身份验证器。web 脚本容器的其他支持组件是脚本处理器注册表，用于注册脚本处理器；模板处理器注册表，用于注册模板处理器；以及格式注册表，用于注册新格式。我们已经了解了所有这些组件的开箱即用实现类。Alfresco\
  \ 中的 web 脚本框架非常强大，并且为 web 脚本框架的核心组件提供的开箱即用实现可以满足你与项目 web 脚本实现相关的所有需求。然而，为了了解 Alfresco\
  \ 中 web 脚本框架的强大之处，值得一看如何扩展 web 脚本框架的核心组件并为其添加自定义实现。一般情况下，你不需要对 web 脚本框架的组件做任何更改。然而，了解扩展\
  \ web 脚本框架的可能性将帮助你在需要时拥有自定义实现。它还将让你熟悉开源实现的强大之处，它提供了在需要时添加自定义实现的灵活性。\n\n我们将研究如何在\
  \ Alfresco 中扩展 web 脚本框架，以实现 web 脚本运行时、web 脚本容器、身份验证器、脚本处理器和模板处理器的自定义实现，以及自定义格式。\n\
  \n### Web 脚本运行时的自定义实现\n\n让我们首先简要了解 web 脚本运行时在 web 脚本框架中的作用。在 web 脚本执行流程中，一旦请求调度程序发送请求，web\
  \ 脚本运行时将请求委托给 web 脚本容器以便进一步处理以执行 web 脚本。web 脚本运行时有不同的实现，例如 servlet 运行时、portlet 运行时、JSF\
  \ 运行时、Facebook 运行时和 SURF web 框架运行时。作为开发者，如果要实现新的 web 脚本运行时实现，你必须感兴趣地知道需要做什么。让我们在这里看一下。\n\
  \n为了了解如何在 web 脚本框架中创建 web 脚本运行时的自定义实现，首先让我们看一下 web 脚本框架提供的服务提供者接口，它提供了创建自定义实现的可能性。如果你查看\
  \ `spring-webscripts-*.jar` 内部的实现，会有一个接口定义，`org.springframework.extensions.webscripts.Runtime`，它声明了任何\
  \ web 脚本运行时必须实现的方法。为了简化实现，有一个抽象类实现，`org.springframework.extensions.webscripts.AbstractRuntime`，它实现了\
  \ `org.springframework.extensions.webscripts.Runtime` 接口。它以一种通用的方式为接口中定义的方法提供了实现，使得\
  \ web 脚本框架中的任何运行时都能够以通用方式提供 web 脚本请求。AbstractRuntime 类将一些方法保留为抽象，留给子类提供抽象方法的实现，以便为\
  \ web 脚本运行时做出通用实现。如果你查看 web 脚本框架中所有现有的 web 脚本运行时，例如 WebScriptServletRuntime 和 JSFRuntime，你可以看到它们都扩展自\
  \ AbstractRuntime 类。这些类提供了 AbstractRuntime 类中所需的抽象方法的实现。\n\n对服务提供者接口及其在 Alfresco\
  \ 中开箱即用的 web 脚本框架中的实现有了整体了解后，让我们尝试理解如何利用这一知识创建 web 脚本运行时的自定义实现。我们将研究创建自定义 web 脚本运行时所需的高层次步骤。\n\
  \n\n\n\n\n## 扩展Web脚本框架\n\n要创建自定义的Web脚本运行时，请执行以下步骤：\n\n- 1. 打开Eclipse，在你的项目中，创建一个继承自`org.springframework.extensions.webscripts.AbstractRuntime`的Java类。\n\
  - 2. 你会看到Eclipse在类声明处显示红色标记。不必担心，这是因为我们还没有提供父类中抽象方法的实现。右键点击该类，选择 **Source | Override/Implement\
  \ Methods**，然后点击 **OK**。你应该能看到来自`AbstractRuntime`父类的抽象方法的默认实现。以下是创建自定义Web脚本运行时需要提供实现的方法：\n\
  \  \n  ```java\n  public String getName()\n  protected String getScriptMethod()\n\
  \  protected String getScriptUrl()\n  protected WebScriptRequest createRequest(Match\
  \ paramMatch)\n  protected WebScriptResponse createResponse()\n  protected Authenticator\
  \ createAuthenticator()\n  protected WebScriptSessionFactory createSessionFactory()\n\
  \  ```\n- 3. 你还需要为你的Java类提供显式的构造函数实现；否则，会显示**隐式超构造函数AbstractRuntime()对默认构造函数未定义**的错误。右键点击该类，选择\
  \ **Source | Generate Constructors from Superclass**。以下是你自定义Java类的显式构造函数的样子：\n \
  \ \n  ```java\n  public CustomWebScriptRuntime(RuntimeContainer container) {\n \
  \     super(container);\n  }\n  ```\n- 4. 每次都应创建Web脚本运行时的新实例，并调用`executeScript()`方法，其通用实现已在`AbstractRuntime`类中提供。\n\
  \nWeb脚本容器类必须为`AbstractRuntimeContainer`类中未实现的其他方法提供定义。为了理解我们刚刚学到的内容，你应该追踪`alfresco-remote-api-*.jar`中`org.alfresco.repo.web.scripts.RepositoryContainer`类以及`spring-webscripts-*.jar`中`org.springframework.extensions.webscripts.PresentationContainer`类的代码实现。\n\
  \n现在我们对Web脚本容器是如何实现的有了整体了解，下面来看一下理解如何为Web脚本容器创建自定义实现的高级步骤。要创建你自己的Web脚本容器，需要执行以下步骤：\n\
  \n- 1. 创建一个继承自`org.springframework.extensions.webscripts.AbstractRuntimeContainer`的Java类。\n\
  - 2. 然后，你需要为所需的抽象方法提供实现。在类内部右键点击，选择 **Source | Override/Implement Methods**，然后点击\
  \ **OK**。你应该能看到在`AbstractRuntimeContainer`父类中没有提供实现的那部分抽象方法的默认实现。以下是创建自定义Web脚本容器时需要提供实现的方法：\n\
  - 3. 然后，应将Web脚本容器在Spring上下文文件中注册为一个Spring bean条目。你可以为bean ID指定任意名称：\n\n```\npublic\
  \ void executeScript(WebScriptRequest req, WebScriptResponse res,Authenticator auth)\
  \ throws IOException\npublic ServerModel getDescription()\n```\n\n```\n<bean id=\"\
  webscripts.custom.container\" class=\"自定义webscript容器的完全限定类名\" parent=\"webscripts.abstractcontainer\"\
  \ init-method=\"setup\">\n...\n</bean>\n```\n\n现在的问题是，如何让Web脚本引擎使用自定义的Web脚本容器呢？答案是在创建Web脚本运行时的新实例时，应从上下文中获取该bean并将其注入Web脚本运行时。你应该追踪`org.springframework.extensions.webscripts.servlet.WebScriptServlet`的代码，看看Web脚本容器实例是如何获取并传递给Web脚本运行时的。\n\
  \n> 对于Alfresco仓库Web脚本，Web脚本引擎使用`org.alfresco.repo.web.scripts.RepositoryContainer`实现；对于Alfresco\
  \ Share Web脚本，则使用`org.springframework.extensions.webscripts.PresentationContainer`实现作为Web脚本容器。\n\
  \n## 自定义认证器实现\n\n为了安全地访问Web脚本，身份认证必不可少。Web脚本认证器是在Web脚本中提供认证访问的组件。我们首先了解一下Web脚本框架是如何引用认证器实现的。如果你查看Alfresco安装目录下`tomcat\\\
  webapps\\alfresco\\WEB-INF`中的web.xml，你会在某个servlet的`<init-param>`条目下找到`<param-name>authenticator</param-name>`条目，该servlet基本上是用于Web脚本执行的请求分发servlet。请求分发servlet在创建Web脚本运行时实例来服务Web脚本请求时，会使用上述认证器。\n\
  \n认证器的Spring bean ID可以在web.xml中某个servlet的init-param条目下的`<param-value>`标签中找到。Spring\
  \ bean条目可以在`web-scripts-application-context.xml`或`web-client-application-context.xml`中找到。认证器的bean实例是使用工厂设计模式实现创建的。因此，你会找到与bean\
  \ ID对应的工厂类名称。例如，以下是bean ID为`webscripts.authenticator.basic`的Spring bean条目代码片段：\n\
  \n```xml\n<bean id=\"webscripts.authenticator.basic\" class=\"org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory\"\
  >\n```\n\n所有与认证器相关的工厂类都实现了`org.springframework.extensions.webscripts.servlet.ServletAuthenticatorFactory`接口，并实现`create(WebScriptServletRequest\
  \ req, WebScriptServletResponse res)`方法来返回相应的认证器对象。你会在工厂类内部找到内部类实现，该类代表该工厂类提供的认证器对象。\n\
  \n现在，让我们来看看用于创建认证器对象的服务提供者接口。在Web脚本框架中，要创建新的认证器，必须实现`org.springframework.extensions.webscripts.Authenticator`接口，并且必须为该接口的`authenticate()`和`emptyCredentials()`方法提供实现。\n\
  \n现在我们对认证器实现如何在Web脚本框架中使用有了整体了解，接下来看一下创建自定义认证器并让Web脚本框架在服务Web脚本请求时使用新建认证器所需的高级步骤。执行以下步骤：\n\
  \n- 1. 创建一个实现`org.springframework.extensions.webscripts.Authenticator.ServletAuthenticatorFactory`接口的自定义认证器工厂类。\n\
  - 2. 为以下方法提供实现；此时，只需让它返回null以避免出现任何错误：\n  \n  ```\n  public Authenticator create(WebScriptServletRequest\
  \ req,\n  WebScriptServletResponse res)\n  ```\n- 3. 在Spring上下文文件中为这个类提供Spring bean条目，如下所示：\n\
  \  \n  ```\n  <bean id=\"webscripts.custom.authenticator\" class=\"自定义认证器工厂类的完全限定类名\"\
  >\n  ...\n  </bean>\n  ```\n- 4. 在自定义认证器工厂类内部，创建一个实现`org.springframework.extensions.webscripts.Authenticator`的自定义认证器类，并为以下两个方法提供实现：\n\
  \  \n  ```\n  public boolean authenticate(Description.RequiredAuthentication required,\
  \ boolean isGuest)\n  public boolean emptyCredentials()\n  ```\n- 5. 现在，在我们第2步实现的方法内部，不要返回null，而是返回我们刚刚实现的自定义认证器的新对象。\n\
  - 6. 为了确保Web脚本请求分发servlet使用自定义认证器，请修改servlet的web.xml条目，将其authenticator的init-param值提供为自定义认证器工厂的bean\
  \ ID，如第3步所定义。\n\n\n\n\n![](img/f02f759059b86af67e38b543d498a0d8_167_0.png)\n\n>\
  \ 为了更好地理解我们刚刚学习的如何创建自定义认证器，你应该通读开箱即用的实现代码，看看 `BasicHttpAuthenticator` 是如何被 Web 脚本框架实现和使用的。以下文件名供你参考：请参阅\
  \ `web.xml` 中的 `apiServlet` 条目、`web-scripts-application-context.xml`、`org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory`、`org.springframework.extensions.webscripts.servlet.WebScriptServlet`。\n\
  \n## 自定义脚本处理器实现\n\n我们现在应该有了一个高层次的了解：Alfresco 中的 Web 脚本框架支持基于 JavaScript 的 Web 脚本，并使用\
  \ RhinoScript 处理器来执行基于 JavaScript 的 Web 脚本。在 `spring-webscripts-*.jar` 提供的开箱即用 Web\
  \ 脚本框架实现中，脚本处理器实现是 `org.springframework.extensions.webscripts.processor.JScriptProcessor`，并已注册到脚本处理器注册表中。然而，在\
  \ Alfresco 中，有一个扩展实现，用于将脚本处理器注册到 Alfresco Web 脚本框架的 Web 脚本处理器注册表中。让我们尝试理解 JavaScript\
  \ 处理器是如何在 Alfresco 中与 Web 脚本框架配置的。如果你查看 Alfresco 安装目录下的 `tomcat\\webapps\\alfresco\\\
  WEB-INF\\classes\\alfresco` 中的 `web-scripts-application-context.xml`，会看到 `org.springframework.extensions.webscripts.ScriptProcessorRegistrar`\
  \ 类的一个 bean 条目。如果你使用的是 Alfresco Community 5，该文件位于 `alfresco` 包下的 `alfresco-remote-api-*.jar`\
  \ 中。以下是来自 `web-scripts-application-context.xml` 的 bean 条目代码片段：\n\n```xml\n<bean\
  \ class=\"org.springframework.extensions.webscripts.ScriptProcessorRegistrar\" init-method=\"\
  init\">\n    <property name=\"registry\" ref=\"webscripts.repo.registry.scriptprocessor\"\
  \ />\n    <property name=\"factory\" ref=\"webscripts.repo.scriptprocessor.factory\"\
  \ />\n    <property name=\"name\"><value>Repository Script Processor</value></property>\n\
  \    <property name=\"extension\"><value>js</value></property>\n</bean>\n```\n\n\
  ScriptProcessorRegistrar 类负责将用于 JavaScript 的仓库脚本处理器注册到 Web 脚本框架中。在 ScriptProcessorRegistrar\
  \ 类中，由工厂类 bean ID webscripts.repo.scriptprocessor.factory 提供的 ScriptProcessor 会注册到由\
  \ bean ID webscripts.repo.registry.scriptprocessor 指定的脚本处理器注册表类中。\n\n由上述工厂类返回的 ScriptProcessor\
  \ 由以下 bean 条目表示：\n\n```xml\n<bean id=\"webscripts.repo.scriptprocessor\" class=\"\
  org.alfresco.repo.web.scripts.RepositoryScriptProcessor\">\n    <property name=\"\
  scriptService\" ref=\"scriptService\" />\n    <property name=\"searchPath\" ref=\"\
  webscripts.searchpath\" />\n</bean>\n```\n\n当执行基于 JavaScript 的控制器时，在 Web 脚本框架的内部执行过程中，ScriptProcessor\
  \ 类的 executeScript 方法会在 AbstractWebScript 类中被调用。如果你查看 RepositoryScriptProcessor\
  \ 类中的 executeScript 方法，它会调用 `org.alfresco.repo.processor.ScriptServiceImpl` 类的 executeScript\
  \ 方法，并将初始参数传递为 javascript。进一步地，查看 `script-services-context.xml` 中的 scriptService\
  \ bean 条目，有一个名为 javascript 的默认脚本处理器。名为 javaScriptProcessor 的 bean ID 包含了 javascript\
  \ 处理器实现 `org.alfresco.repo.jscript.RhinoScriptProcessor` 的条目。该处理器通过从 BaseProcessor\
  \ 类（RhinoScriptProcessor 的父类）调用的 ScriptService 的 registerScriptProcessor 方法进行注册。\n\
  \n我们刚刚深入了解了 javascript 处理器在 Alfresco Web 脚本框架中是如何注册和使用的技术细节。为了创建自定义脚本处理器并将其注册到 Web\
  \ 脚本框架中，你需要在高层面上完成以下步骤：\n\n- 1. 创建一个脚本处理器实现，扩展 BaseProcessor 类并实现 ScriptProcessor、ScriptResourceLoader\
  \ 和 InitializingBean 接口。你应该详细研究 RhinoScriptProcessor 的实现方式，以便创建你自己的自定义脚本处理器。\n-\
  \ 2. 创建一个类似于 bean ID webscripts.repo.scriptprocessor.factory 的自定义工厂实现，以返回你的自定义脚本处理器对象。\n\
  - 3. 创建一个类似于 `ScriptProcessorRegistrar` 的注册器类实现，引用自定义工厂实现，以便将其注册到 Web 脚本框架中。\n\n\
  ## 自定义模板处理器实现\n\n既然我们已经对 Web 脚本框架中的脚本处理器实现进行了详细的技术演练，现在是时候做一些练习，来了解 Web 脚本框架中的模板处理器实现方式，以及如何为模板处理器创建自定义实现。你现在应该能够通过代码追踪，了解\
  \ FreeMarker 模板处理器是如何被 Web 脚本框架使用的，以及如何创建自定义模板处理器实现。这里有一个提示帮助你完成这个练习。为了理解模板处理器实现，你只需要查看\
  \ `web-scripts-application-context.xml` 中 `org.springframework.extensions.webscripts.ScriptProcessorRegistrar`\
  \ 的 bean 条目，并按照我们在上一节中的方式追踪代码；你应该会对模板处理器实现以及创建自定义模板处理器的细节有一个全面的了解。希望你喜欢这个练习。\n\n\
  ## 自定义格式\n\n让我们首先了解不同的格式是如何注册到 Web 脚本框架中的。如果你查看 `spring-webscripts-*.jar` 中 `spring-webscripts-application-context.xml`\
  \ 里 ID 为 `webscripts.formats` 的 bean 条目，它会包含与可用格式相对应的格式和 MIME 类型条目。该 bean 定义条目 `webscripts.formats`\
  \ 的父类 `org.springframework.extensions.webscripts.FormatMap` 会将格式和 MIME 类型注册到 Web\
  \ 脚本框架中 Web 脚本容器使用的 `FormatRegistry`。要添加自定义格式，你只需要提供相应的格式和 MIME 类型条目。如果你查看 `spring-webscripts-application-context.xml`\
  \ 中的 bean ID `webscripts.formats.IE`，以及它在 `web-scripts-application-context.xml`\
  \ 中的自定义条目，会发现它定义了自定义的 IE 特定格式。它将 rss 的格式从 text/xml 改为了 application/rss+xml。类似地，你也可以对格式进行自定义更改。如果你计划添加一个在\
  \ `spring-webscripts-application-context.xml` 中未定义的完全新的格式和 MIME 类型，那么你将需要创建自定义的\
  \ `FormatReader` 类和自定义的 `FormatWriter` 类。你可以查看 `webscripts.adaptors` bean 条目；它会为你提供一些关于如何创建自定义\
  \ FormatReader 和 FormatWriter 并注册到 Web 脚本框架的 `FormatRegistry` 的提示。\n\n## 总结\n\n\
  在本书的最后一章中，我们了解了 Alfresco Web 脚本框架中的一些关键组件如何在需要时进行自定义。在理解如何自定义的同时，我们也了解了这些组件目前在 Web\
  \ 脚本框架中的工作方式。在本章中，我们领略了开源技术的强大之处，它为我们按需进行自定义实现打开了大门。\n\n现在，没有下一章了！我希望你享受了学习 Alfresco\
  \ Web 脚本的旅程。现在是时候享受使用 Alfresco 进行 Web 脚本开发的体验，根据你的业务需求创建出色的解决方案了。\n\n\n\n\n"
