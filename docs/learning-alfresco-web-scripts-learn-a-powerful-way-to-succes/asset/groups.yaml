    - They are easy to develop and provide some of the most useful features such as
    no server restart, no compilations, no complex installations, and no need of a
    specific tool to develop them

    - All these points make web scripts the most preferred choice among developers
    and architects when it comes to interacting with the Alfresco repository


    ## Understanding when to use a web script


    Having understood what a web script is and the reasons for using web scripts,
    let''s now understand when to use web scripts. When working with Alfresco, it
    is important to know in which scenarios web scripts can be used. Web scripts allow
    you to build custom URI-identified and HTTP-accessible Content Management Web
    services to access the Alfresco content repository, and hence they can be used
    in various kinds of implementations to build useful business solutions with Alfresco
    content management systems.


    In development projects:


    - You can use web scripts to develop business implementations integrating Alfresco
    with external applications

    - You can develop customized web scripts as per your business requirement

    - You can leverage on the out-of-the-box web scripts available in Alfresco wherever
    they fit in your custom implementation


    In support projects:


    - Web scripts could be your savior when you are working on a support or maintenance
    project to maintain the live system for your customers that is built on Alfresco
    and has millions of records.

    - You might come across a range of issues, for example, updating existing content
    to fix some data issues, deleting some unneeded content, getting the required
    content matching with the criteria specified by the business team, and so on.
    Web scripts can be used in such scenarios to serve these purposes.

    - On a live production system, it is not possible to restart the server, and restarting
    a server could impact the business of a customer. Consider a scenario where you
    need to fix some critical issues on a production system and you are looking for
    an option to have the issue fixed without restarting the server. The powerful
    feature of web scripts to interact with the Alfresco repository without restarting
    the server will help you in this case, and you can fix some critical issues using
    web scripts to provide a good content management experience to the business users.


    In general, web scripts can be used in all kinds of solutions, such as:


    - Integrating Alfresco with external applications that can communicate with Alfresco
    using HTTP

    - Developing JSR-168 portlets to build up UI services

    - Developing data services

    - Providing feeds for repository content

    - Alfresco integration with Office

    - Developing Facebook applications

    - Building UI components in Alfresco SURF


    ## Understanding where web scripts can be used


    Now, it''s time to understand where web scripts can be used. There are a number
    of different environments from where a web script can be accessed and used.


    In different environments:


    - They can be used from an HTTP client such as a web browser and HTTP client APIs

    - It is also possible to access web scripts in JSF pages

    - They can be used in JSR-168 portals

    - They can be used from Facebook applications

    - Web scripts can be used in the Alfresco SURF platform as well


    ## Understanding how web scripts work


    Web scripts in Alfresco mostly use the model-view-controller pattern. However,
    it isn''t mandatory to follow this pattern all the time. The way the MVC pattern
    works in web scripts is as follows:


    - **The controller** is responsible for performing the required business logic
    as per the business requirement. After processing the business logic, the controller
    populates the **model** object with the required data. Once this is done, the
    controller will then forward the request to the **view**.


    ## MVC in web scripts


    The model-view-controller pattern in web scripts is explained as follows:


    - The controller is a server-side JavaScript or Java class or it could be both
    as well

    - The model is a data structure object passed between the controller and view

    - The view is a FreeMarker template that is responsible for generating the response
    in the required format


    The mapping of the web script URI to the controller is done through a descriptor
    file. It is mainly an XML file that will have the required details for a web script
    such as URL, description, arguments, transaction, authentication, and response
    formats.


    Response formats are mapped to FreeMarker templates through naming conventions.
    For example, a FreeMarker template that returns an HTML response will have the
    extension `html.ftl`.


    Web scripts are registered and executed by the web script engine in Alfresco.


    > A descriptor, optional controller, and one or more FreeMarker response templates
    collectively make a web script in general scenarios. All these components are
    tied together through a specific document naming convention.


    ## Making web scripts work


    To make web scripts work, it is important to deploy the web script files at an
    appropriate location.


    The descriptor file and the FreeMarker template as per the response format for
    a web script can be either placed on a filesystem or put into the Alfresco repository.


    If a JavaScript-based controller is used for a web script, then it could be placed
    along with the descriptor and FreeMarker template on a filesystem or in the Alfresco
    repository.


    If a Java-based controller is used for a web script, then the class file for the
    controller must be available on the class path.


    > There are two types of controllers available for web scripts: JavaScript-based
    controllers and Java-based controllers. It is possible to have none of them, either
    of them, or even both of them for a web script.


    ## Types of web scripts


    There are two types of web script in Alfresco: Data web scripts and Presentation
    web scripts.


    ### Data web script


    Data web scripts provide an interface to the repository for the client applications
    to create, retrieve, update, and delete content/ data in the repository. These
    web scripts typically send the response in formats such as XML and JSON, and client
    applications will have to parse it in order to use it further.


    Data web scripts encapsulate access and modification of content/ data residing
    in the repository. These web scripts are provided and exposed by the Alfresco
    repository server only.


    ### Presentation web script


    Presentation web scripts can be used to build user interfaces such as dashlets
    for Alfresco explorer, dashlets for Alfresco share, portlets for a JSR-168 portal,
    a UI component within Alfresco SURF, or a custom application.


    These kinds of web scripts generally render HTML responses.


    It is possible to host these web scripts on a separate presentation server or
    they can also be exposed by the Alfresco repository server.


    Presentation web scripts generally make a call to Data web scripts in order to
    get the required data from the repository.


    > Out-of-the-box web scripts available in an Alfresco installation can be found
    at `ALFRESCO_HOME\tomcat\webapps\alfresco\WEB-INF\classes\alfresco\templates\webscripts\org\alfresco`,
    where ALFRESCO_HOME is the base directory where Alfresco is installed.

    > If you are using Alfresco Community 5, you can find out-of-the-box web scripts
    under the alfresco package inside `alfresco-remote-api-*.jar`, which is available
    at `ALFRESCO_HOME\tomcat\webapps\alfresco\WEB-INF\lib`.


    ## Summary


    In this chapter, we gained a better understanding of web scripts through some
    of the basic questions about web scripts. We learned what web scripts in Alfresco
    are, why they are the preferred choice of developers, when and where we can use
    web scripts, how web scripts work, and also the different types of web scripts
    available in Alfresco.


    In the next chapter, we are going to do a hands-on exercise to learn how to implement
    our first web script in Alfresco.


    ## Chapter 2: It''s Time for the First Web Script


    In this chapter, we will cover the following topics:


    - How to create a simple web script in Alfresco step by step

    - The implementation of the first web script

    - Extending the first web script to add a controller

    - What happens behind the scenes of a web script hit

    - The most important things for any web script

