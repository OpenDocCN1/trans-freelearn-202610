  mdcn: "\n\n现在是时候在 Alfresco 中实际实现你的第一个 Web 脚本并更熟悉 Alfresco Web 脚本的实现方式了。本章将帮助你清楚地了解如何在\
    \ Alfresco 中创建一个简单的 Web 脚本、如何通过控制器实现扩展 Web 脚本，以及在处理 Alfresco Web 脚本时非常重要的一些基础知识。\n\
