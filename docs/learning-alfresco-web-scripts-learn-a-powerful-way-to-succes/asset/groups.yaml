  mdcn: "\n\n## 自定义 JavaScript 扩展\n\n前面你已经了解到，每个 JavaScript API 都以 `baseJavaScriptExtension`\
    \ 为父类。你可以按照以下步骤创建一个自定义 JavaScript 扩展，它将为你提供相应的 API 方法，使 Web 脚本的某一部分能够以系统用户身份运行，然后再恢复为原始用户身份来执行\
    \ Web 脚本的其他部分：\n\n- 1. 创建一个上下文文件，并向其中添加以下 bean 条目：\n\n  ```xml\n  <bean id=\"\
    customAdmin\" parent=\"baseJavaScriptExtension\"\n        class=\"com.example.CustomAdminAPI\"\
    >\n      <property name=\"extensionName\">\n          <value>customauth</value>\n\
    \      </property>\n  </bean>\n  ```\n\n- 2. 创建一个 Java 类 `com.example.CustomAdminAPI`，该类将继承\
    \ `org.alfresco.repo.processor.BaseProcessorExtension` 类，并按如下方式声明变量：\n\n  ```java\n\
    \  net.sf.acegisecurity.Authentication auth;\n  ```\n\n- 3. 在该类中实现三个公共方法。第一个方法用于保存当前用户的身份验证信息，第二个方法用于以系统用户身份运行，第三个方法用于清除安全上下文并恢复原始用户的身份验证信息。下面就是我们刚讨论的三个方法的代码片段：\n\
    \n```java\npublic void saveCurrentUserAuthentication() {\n    auth = AuthenticationUtil.getFullAuthentication();\n\
    }\n\npublic void executeAsSystemUser() {\n    AuthenticationUtil.setRunAsUserSystem();\n\
    \    AuthenticationUtil.setFullyAuthenticatedUser(AuthenticationUtil.\n    SYSTEM_USER_NAME);\n\
    }\n\npublic void setBackOriginalUserAuthentication() {\n    AuthenticationUtil.clearCurrentSecurityContext();\n\
    \    AuthenticationUtil.setFullAuthentication(this.auth);\n}\n```\n\n- 4. 现在，部署这些文件并重新启动服务器。\n\
    \n在您的 JavaScript 后端控制器中，您现在应该按如下方式使用新创建的自定义 JavaScript 扩展：\n\n```\ncustomauth.saveCurrentUserAuthentication();\n\
    customauth.executeAsSystemUser();\n//Your piece of code you want to run as system\
    \ user.\ncustomauth.setBackOriginalUserAuthentication();\n```\n\n我们刚刚创建了一个自定义\
    \ JavaScript 扩展，并公开了一个根对象，通过该根对象您可以访问为其创建的 API 方法。这就是当您找不到所需的相关 API 时，如何创建自定义\
    \ JavaScript 扩展的方法。\n\n## 总结\n\n在本章中，我们全面介绍了在使用可用 JavaScript API 为 Web 脚本编写 JavaScript\
    \ 控制器时可执行的所有功能。我们了解了如何从 Alfresco 代码库中识别 JavaScript API。我们还浏览了从 Alfresco 代码库中找到的暴露\
    \ JavaScript API 的常见根对象列表。\n\n接下来，我们了解了 Alfresco 中 Web 脚本框架提供的各种其他根对象。然后，我们通过一些代码示例，了解了如何在控制器中使用根对象及相关\
    \ JavaScript API，对 Alfresco 中的节点执行一些常规操作。最后，您学习了当现有 JavaScript API 无法满足需求时，如何创建自定义\
    \ JavaScript 扩展来创建自己的根对象，并为该自定义根对象公开相应的 API 方法。总体而言，您现在已经了解了如何使用各种 JavaScript\
    \ API 开发 JavaScript 控制器，从而根据业务需求构建 Web 脚本控制器。\n\n在下一章中，我们将了解 Web 脚本开发中一些非常有用且重要的内容，例如\
    \ Web 脚本的部署、调试和故障排除。\n\n## Web 脚本的部署、调试与故障排除\n\n在本章中，我们将介绍以下主题：\n\n- - Alfresco\
    \ Web 脚本的部署选项\n- - Web 脚本调试的详细信息\n- - 与 Web 脚本相关的常见问题的一些实用故障排除指引\n- - 在生产服务器上执行\
    \ Web 脚本的一些重要提示\n\n了解两件事非常重要：一是如何部署您已开发的内容，二是当某些功能无法按预期工作时如何进行调试。如果您了解这两件事，那么您的工作就会变得更加轻松，并且可以快速找到您正在处理的项目中一些关键问题的解决方案。\n\
    \n在 Alfresco 中开发 Web 脚本时，Web 脚本开发的第一阶段是创建 Web 脚本，即您需要开发 Web 脚本所需的各种构建块。第二个重要阶段是部署并注册\
    \ Web 脚本，以使您创建的 Web 脚本可供 Alfresco 中的 Web 脚本框架使用。这样您就可以使用自己的 Web 脚本了。作为开发人员，了解可用于部署\
    \ Alfresco Web 脚本的各种部署选项非常重要。此外，您还应该知道如何在 Alfresco 中调试 Web 脚本。\n\n在本章中，我们将介绍在\
    \ Alfresco 中部署 Web 脚本的各种可能方式。同时，我们还会介绍 Web 脚本的调试技巧和一些有用的故障排除指引。我们还将介绍一些非常有用的提示，这些提示在您于生产服务器上为项目执行\
    \ Web 脚本时会很有帮助。\n\n## 部署选项\n\n您有两种可能的方式来部署您的 Web 脚本：\n\n- - 使用仓库选项\n- - 使用文件系统选项\n\
    \n在 Alfresco 中创建 Web 脚本时，您可能会为项目创建 Java 后端或 JavaScript 后端的 Web 脚本。这两种 Web 脚本都可以以不同的方式进行部署。了解每种部署选项可以将\
    \ Web 脚本部署到哪些位置，以及哪种选项更适合您，这一点非常重要。\n\n### 仓库选项\n\n简单来说，使用仓库选项部署 Web 脚本，就是将 Web\
    \ 脚本的组件文件放入仓库内的特定位置。\n\n首先，我们来看看基于 JavaScript 的 Web 脚本的部署。基于 JavaScript 的 Web\
    \ 脚本可以部署在 Alfresco 仓库中。基于 JavaScript 的 Web 脚本的所有组件，例如描述文档、JavaScript 后端控制器实现、一个或多个响应模板、任何配置文档以及可选的消息包，都可以部署在\
    \ Alfresco 仓库中。\n\n## 理解部署位置\n\n我们刚刚看到，使用仓库选项部署 Web 脚本时，有两个可能的位置。使用文件系统位置部署 Web\
    \ 脚本时，则有四个这样的可能位置。作为开发人员，您一定想了解这两种部署选项的部署位置是如何确定的。\n\n了解背后的技术细节会很有帮助。在注册 Web 脚本时，`org.springframework.extensions.webscripts.DeclarativeRegistry`\
    \ 类总是会在注册 Web 脚本之前对 Web 脚本执行一次查找。它使用 `org.springframework.extensions.webscripts.SearchPath`，这基本上是一个\
    \ store 的集合。如果您查看 `searchPath` 集合中定义的每个 store，您会发现其中的路径位置基本上就是我们前面看到的六个部署位置。让我们来看看它在\
    \ Alfresco 中是如何作为 Spring bean 定义进行配置的。\n\n以下是在您的 Alfresco 安装目录下的 `tomcat\\webapps\\\
    alfresco\\WEB-INF\\classes\\alfresco` 位置可找到的 `web-scripts-application-context.xml`\
    \ 中 `SearchPath` 的 bean 条目。如果您使用的是 Alfresco Community 5，它位于 `alfresco-remote-api-*.jar`\
    \ 内的 `alfresco` 包下。\n\n```xml\n<bean id=\"webscripts.searchpath\" class=\"org.springframework.\n\
    \    extensions.webscripts.SearchPath\">\n    <property name=\"searchPath\">\n\
    \        <list>\n            <ref bean=\"webscripts.store.repo.extension\" />\n\
    \            <ref bean=\"webscripts.store.repo\" />\n            <ref bean=\"\
    webscripts.store.client.extension\" />\n            <ref bean=\"webscripts.store.client\"\
    \ />\n            <ref bean=\"webscripts.store.alfresco\" />\n            <ref\
    \ bean=\"webscripts.store\" />\n        </list>\n    </property>\n</bean>\n```\n\
    \n在上述 bean 定义中，`list` 属性下的前两个 bean 保存的是我们前面看到的仓库部署位置的路径，另外四个 bean 保存的是文件系统部署位置的路径。您可以查看\
    \ `web-scripts-application-context.xml` 中的这些 bean 定义，以了解更多详细信息。\n\n"
