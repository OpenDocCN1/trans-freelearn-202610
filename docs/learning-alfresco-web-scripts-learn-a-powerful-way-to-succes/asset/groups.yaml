    # Controller implementation – not mandatory!


    The actual business logic for a web script resides in the web script controller.
    The main functionalities such as interacting with repository, for example, to
    query the repository, add content, update content, delete content, and so on are
    part of the web script controller implementation.


    There are two types of controller implementations possible to implement while
    creating web scripts in Alfresco:


    +   - The JavaScript-backed controller

    +   - The Java-backed controller


    # The JavaScript-backed controller


    JavaScript-backed controller is known as the web script controller script that
    has the web script business logic implemented in a JavaScript file. Alfresco provides
    a set of JavaScript APIs that can be used in the web script controller to interact
    with the Alfresco backend repository. A JavaScript controller can read the query
    string parameters of the web script URI, perform the required repository operations,
    and populate the model object to render the response.


    We have already seen the basic implementation of JavaScript controller for our
    hello world web script.


    # Understanding when to use the JavaScript controller


    Here are a few generic points that explain when you should go for JavaScript controller
    implementation for your web script:


    +   - When the repository operations you are trying to perform can be easily done
    using the available Alfresco JavaScript API, you might choose this controller'
  - '[PAGE 82]


    Building Blocks of Web Scripts


    +   - The JavaScript controller has an advantage that if you have developed a
    web script that has a controller using the JavaScript implementation, you do not
    need to restart the server to deploy and use your web script

    +   - No additional tooling is required; you can simply use any editor to create
    the web script, no compilation is required, and is easy to deploy in the repository


    # The Java-backed controller


    The Java-backed controller is another type of controller implementation possible
    to implement for a web script that might have the complete business logic processing
    implemented in Java.


    When you are implementing a Java-backed controller, you will have access to all
    the content application services available in Alfresco. Business logic implementation
    for a web script can be provided in JavaScript- or Java-based controller; the
    only difference is that Java-backed controller is implemented in Java and it has
    access to all the available content application services in Alfresco.


    # Understanding when to use a Java-backed controller


    Let''s take a look at a few points about when you should go for the Java-backed
    controller implementation for your web script:


    +   - Generally, when the JavaScript controller cannot do the repository operations
    you want to do using the available Alfresco JavaScript API, you should implement
    the Java-backed controller.

    +   - When you want to override the rendering of a response, for example, rendering
    large content in response, you should use this controller.

    +   - Consider that you will require experience in Java programming. You will
    also require compilation of the Java code, classpath deployment of web scripts,
    and even server restart in order to use Java-backed web script. If all of this
    looks fine to achieve your business functionality in time, then you can go for
    implementing Java-backed controller.


    > A web script can also have both JavaScript- and Java-backed controllers. In
    such a scenario, the Java-backed controller will first get executed and then JavaScript-based
    implementation gets executed when the web script is invoked.'
  - '[PAGE 83]


    # Response templates – yes, they are required!


    Response templates are basically used to render the web script response. In MVC
    terms, response templates play a role of views. The output of the web script is
    rendered in the required formats using the web script response templates.


    It is possible to have multiple response templates for a web script, and based
    on the requested response content type while invoking a web script, a response
    can be rendered using the appropriate response template.


    Response template also has access to web script query string parameters along
    with the data items provided by the controller script and access to some common
    content repository entry points.


    We have already seen rendering response for our hello world web script.


    > For JavaScript-based web scripts, response templates are always required. There
    are certain implementations of Java-backed web scripts where response can be directly
    rendered from the Java controller. In such case, there is no need to specify response
    template for the web script. We are going to cover Java-backed web scripts in
    detail in Chapter 6, Creating Java-backed Web Scripts.


    # I18N for a web script – it''s optional


    Internationalization is a cool feature that can be very useful while creating
    web scripts.


    There may be times when you are required to develop a web script that will directly
    be used by the end users, and hence, you need a human-readable web script response
    in the user''s language. No worries, it is possible to provide I18N support to
    the web scripts in Alfresco, and hence, you can have the text in the response
    rendered in the preferred supported user languages.


    We will also extend our hello world web script to have internationalization support
    and will get understanding of how to make a web script render a response using
    internationalization.


    There are two things to be done in order to achieve this:


    +   - Creating a resource bundle for different languages

    +   - Modifying the response template to use the labels from the resource bundle'
  - "[PAGE 84]\n\n# Adding a resource bundle for the hello world web script\n\nIn\
    \ order to add a resource bundle for a web script, the first thing we need to\
    \ do is create a resource bundle for the different languages.\n\nAfter logging\
    \ in to Alfresco Share, create `helloworld.get.properties` at the **Repository\
    \ | Data Dictionary | Web Scripts Extensions** location, and add the following\
    \ content to it:\n\n```\ngreeting.title=Hello!\nemail.title=email address\n```\n\
    \nNow, at the same location, create `helloworld.get_de.properties` and add the\
    \ following content to it:\n\n```\ngreeting.title=Hallo!\nemail.title=E-Mail-Adresse\n\
    ```\n\nWe have just created two properties files and made the text able to be\
    \ rendered in the web script response in two different languages: English and\
    \ German.\n\n# Modifying the response template to use labels\n\nNow, in order\
    \ to use the labels added in the resource bundle, we will have to modify the response\
    \ template. Perform the following steps to modify the response template for the\
    \ hello world web script:\n\n+   1. Modify `helloworld.get.html.ftl` available\
    \ at the **Repository | Data Dictionary | Web Scripts Extensions** location as\
    \ follows:\n\n```\n<html>\n  <body>\n    <p>${msg(\"greeting.title\")} ${args.name}.</p>\n\
    \    <p>${msg(\"email.title\")}: ${email}</p>\n  </body>\n</html>\n```\n\nWe have\
    \ just modified our response template to use the text from the resource bundle.\n\
    \n+   2. Now, go to `http://localhost:8080/alfresco/service/index` and click on\
    \ the **Refresh Web Scripts** button.\n\n+   3. To test this, temporarily change\
    \ the preferred browser language to Germany de-DE and hit the `http://localhost:8080/alfresco/service/helloworld?name=Ramesh`\
    \ URL. You should see the response rendered using the labels rendered from German\
    \ properties file we created."
