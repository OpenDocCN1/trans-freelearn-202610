    # 在公司主目录下创建文件夹


    现在，在公司主目录下创建一个文件夹。如我们之前所见，companyhome 作为根对象可用，我们可以直接使用它。它是 ScriptNode 类型的。因此，我们可以调用
    ScriptNode API 中可用的方法来创建文件夹。CreateFolder() 方法返回一个 ScriptNode 对象；将该对象设置在模型中，并在响应模板中使用它，通过
    TemplateNode API 获取其中的 noderef 值。


    在 JavaScript 控制器中，你将有以下代码行：


    ```

    var folderName = args.foldername;

    model.foldernode = companyhome.createFolder(folderName);

    ```


    在响应模板中，你将使用以下代码：


    ```

    ${foldernode.nodeRef}

    ```


    我们来讨论一下刚刚完成的操作。我们在 JavaScript 控制器中使用了 args 和 companyhome 根对象，分别用于读取显式参数和创建文件夹。ScriptNode
    类中的所有可用方法都可以与 companyhome 对象一起使用。


    现在，我们还将了解一些其他功能，以理解根对象和 JavaScript API 的用法。我们还会查看相关的 JavaScript 代码来实现所提到的功能。


    ## 查找节点


    在前面的示例中，Web 脚本在响应中返回了 nodeid。它是 Web 脚本中创建的文件夹的 nodeid。现在，你可能希望将第一个 Web 脚本返回的 nodeid
    用作另一个 Web 脚本的输入。在另一个 Web 脚本中，你需要将 nodeid 作为参数传递，并且需要在该节点上执行一些功能，例如确定用户是否对该节点有权限、获取节点的路径、获取节点的某个属性、修改节点的某个属性、检查节点是否应用了某个方面、在其中创建内容、调用操作等等。在进行任何此类操作之前，首先我们需要根据提供的
    nodeid 从存储库中找到实际的节点。这可以通过 search 根对象访问的 findNode() 方法来完成，如下所示：


    ```

    var node = search.findNode("workspace://SpacesStore/" + args.nodeid);

    ```


    这里，我们使用了 search 根对象，并调用了 search 根对象的 JavaScript API 中的 findNode() 方法。我们期望 nodeid
    作为参数传递；因此，我们使用 args.nodeid 读取它。在调用节点的 findNode() 方法之前，我们必须构造要作为参数传递给该方法的 noderef
    字符串；因此，我们将 workspace://SpacesStore/ 与 nodeid 连接起来。如果找到节点，它将返回一个表示所找到节点的 ScriptNode
    对象。如果未找到节点，它将直接返回 null。


    ## 检查用户对节点的权限


    现在，一旦找到节点，在对节点执行上一节列出的任何其他操作之前，你首先需要检查用户是否至少对该节点具有读取权限。这可以使用 ScriptNode API 中可用的
    hasPermission 方法来完成，如下所示：


    ```

    var permission = node.hasPermission("Read");

    ```


    我们使用了 ScriptNode API 中的 hasPermission() 方法。我们已经有了一个可用的节点对象，只需调用 hasPermission()
    方法并传入我们想要检查的权限。如果当前用户具有给定权限，它将返回 true。否则，它将返回 false。


    ## 获取节点的路径


    接下来，你可能希望获取节点的路径，以确定该节点所属的文件夹层级。你可以使用 ScriptNode API 轻松获取节点的显示路径，如下所示：


    ```

    var nodepath = node.displayPath;

    ```


    我们从 ScriptNode 类中访问了一个变量 displayPath。ScriptNode 类中已经实现了一个 getter 方法 getDisplayPath()
    来获取节点的路径。该方法将返回给定节点的显示路径。


    ## 检查节点的属性


    现在，你想查看节点的某些属性。例如，你计划修改 description 属性。在此之前，你想在更改值之前了解当前值是什么，并希望将其记录下来以供参考。ScriptNode
    API 在执行与节点相关的操作时非常有帮助。借助 ScriptNode API，你可以通过以下不同方式轻松获取属性值：


    ```

    var description = node.properties.description;

    var description = node.properties["description"];

    ```


    ```

    var description = node.properties["cm:description"];

    var description = node.properties["{http://www.alfresco.org/model/content/1.0}description"];

    ```


    我们刚刚看到了四种不同的读取节点属性的方式。如果你有一些自定义属性，你应该使用最后两种方式之一。


    ## 记录属性值


    现在，在修改 description 属性之前，你想记录旧值以供参考。使用 logger 根对象，你可以简单地调用 logger 根对象的 log 方法，如下所示：


    ```

    logger.log("before change description value : " + description);

    ```


    我们使用了 logger 根对象，并调用 log 方法来记录属性值。每当需要在 JavaScript 控制器中添加日志时，你可以使用 `logger.log()`
    方法。


    ## 修改节点的属性


    现在，你想修改 `description` 属性。同样，借助 ScriptNode API，你可以轻松完成，如下所示：


    ```

    node.properties.description = "change in description";

    ```


    我们刚刚为 `description` 属性设置了一个新值。你也可以使用我们看到的其他三种方式来访问该属性并为其设置新值。


    ## 获取当前用户名和电子邮件


    你可能想了解哪个用户调用了 Web 脚本。为此，你可能希望记录执行 Web 脚本的用户的用户名和电子邮件地址，如下所示：


    ```

    logger.log(person.properties.username + " --- " + person.properties.email + "---
    executed webscript");

    ```


    我们使用了根对象 `person`，它基本上就是 `ScriptNode`。此外，我们获取了当前正在运行 Web 脚本的用户的用户名和电子邮件属性。你可以通过日志追踪并找出哪些用户执行了
    Web 脚本；这在以后某个时候可能非常有用。


    ## 返回 Guest Home 节点


    假设出于某种需求，你需要获取 guest home 文件夹的 noderef。这可以使用 ScriptNode API 中可用的 childByNamePath
    方法来完成，如下所示：


    ```

    model.foldernode = companyhome.childByNamePath("Guest Home");

    ```


    在响应模板中，你可以像之前示例中那样，使用 TemplateNode API 从模型对象 foldernode 中获取 noderef 值。


    我们使用了 companyhome 根对象和 childByNamePath() 方法。对于任何 ScriptNode 类型的对象，你都可以使用此方法获取其子节点的
    noderef。例如，你有一个文件夹层级结构 Company Home > Testing > QA > Performance_Testing。现在，如果你有
    Testing 文件夹的节点，并且想要获取 Performance_Testing 的节点，那么你可以在 Testing 文件夹节点上调用该方法，并传入路径
    childByNamePath("QA/Performance_Testing")。


    ## 创建你自己的根对象


    我们已经看到了一些在 JavaScript 控制器中使用根对象和 JavaScript API 的通用示例。现在你应该能够探索其他根对象和相关 JavaScript
    API，并找出哪些可以根据你的业务需求用于开发 Web 脚本。现在，让我们看一些非常有趣的内容。


    考虑一个场景，你想以系统用户身份执行 JavaScript 控制器的某些部分。你首先会做的是浏览可用的 JavaScript API，以确定是否有适用于此功能的
    API。经过分析，你会发现没有现成的 API 可用。然而，你发现如果 Web 脚本是 Java 后端的 Web 脚本，你可以使用 Java API 来实现。但是，你的是基于
    JavaScript 的 Web 脚本。那么，接下来该怎么办？你一定在想是否也可以在 JavaScript API 中实现相同功能？不用担心，在 JavaScript
    控制器中同样可以做到。你只需要创建一个自定义 JavaScript 扩展。

    '
