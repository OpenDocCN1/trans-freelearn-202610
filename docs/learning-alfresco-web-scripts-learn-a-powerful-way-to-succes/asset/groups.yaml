    # Apache HTTP components


    Another option to execute web script from Java program is to use Apache HTTP components
    that are the latest available APIs for HTTP communication. These components offer
    better performance and more flexibility and are available in httpclient-*.jar
    and httpcore-*.jar. These JARs are available at the tomcat\webapps\alfresco\WEBINF\lib
    location inside your Alfresco installation directory. For more details, refer
    to https://hc.apache.org/httpcomponents-client-4.3.x/quickstart.html to get an
    understanding of how to execute HTTP calls from a Java program.


    # RestTemplate


    Another alternative would be to use org.springframework.web.client.RestTemplate
    available in org.springframework.web-*.jar located at tomcat\webapps\alfresco\WEB-INF\lib
    inside your Alfresco installation directory. If you are using Alfresco Community
    5, the RestTemplate class is available in spring-web-*.jar. Generally, RestTemplate
    is used in Spring-based services to invoke an HTTP communication.


    # Calling web scripts from Spring-based services


    If you need to invoke an Alfresco web script from Spring-based services, then
    you need to use RestTemplate to invoke HTTP calls. This is the most commonly used
    technique to execute HTTP calls from Spring-based classes. In order to do this,
    the following are the steps to be performed. The code snippets are also provided:


    +   1. Define RestTemplate in your Spring context file:

    +   ```

    +   <bean id="restTemplate" class="org.springframework.web.client.RestTemplate"
    />

    +   ```


    +   2. In the Spring context file, inject restTemplate in your Spring class as
    shown in the following example:

    +   ```

    +   <bean id="httpCommService" class="com.test.HTTPCallService">

    +       <property name="restTemplate" value="restTemplate" />

    +   </bean>

    +   ```'
