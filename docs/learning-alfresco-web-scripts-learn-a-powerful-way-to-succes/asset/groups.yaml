    helloworld?name=Ramesh"

    ```


    这将显示 web script 的响应。


    ## 从 JSR-168 门户和 JSF 页面调用 web script


    Alfresco 中的 Web script 框架提供了一个辅助工具，用于从某些不了解 HTTP 的客户端环境调用 Alfresco web script。因此，它可以轻松地从这样的环境中调用
    web script，并且将通过调用环境所熟悉的机制来调用 web script。为了允许 JSR-168 门户和 JSF 页面根据其环境自然地调用 web
    script，Alfresco 中的 web script 框架为它们提供了辅助工具。让我们从高层次来看一下它们及其工作方式。


    ### 从 JSR-168 门户调用 web script


    可以将 Alfresco web script 当作 JSR 门户 portlet 来调用。我们将看看为此需要在 Alfresco 中进行的配置。web script
    的条目应在 portlet.xml 中提供。web script URL 应配置为 scripturl 参数下的 JSR 门户 URL，以便能够将 web
    script 作为 portlet 调用。基本上，它会在 web script 描述文档中定义的 URL 前添加 /alfresco/168s。


    例如，你可以查看位于 tomcat\webapps\alfresco\WEB-INF\classes\alfresco\templates\webscripts\org\alfresco\portlets\mytasks.get.desc.xml
    和 mytasks.get.html.ftl 的 mytasks web script 的开箱即用实现。如果你使用的是 Alfresco Community
    5，这两个文件位于 alfresco-remote-api-*.jar 内的 alfresco 包下。mytasks web script 作为 portlet
    的条目配置在 tomcat\webapps\alfresco\WEB-INF\portlet.xml 中。


    ### 从 JSF 页面调用 web script


    可以从 JSF 页面将 web script 当作标签库来调用。Alfresco 中提供了标签实现，使 JSF 页面能够调用 web script。它位于
    Alfresco 安装目录下 `tomcat\webapps\alfresco\WEB-INF` 位置的 `repo.tld` 中。


    请查看 `tomcat\webapps\alfresco\jsp\dashboards\dashlets\mytasks-webscript.jsp` 以了解其用法。


    ### 处理客户端限制


    其中一个限制是并非所有客户端都能发出所有 HTTP 调用。可能仅局限于 GET 或 POST 调用。Alfresco 中的 web script 框架提供了一种使用
    POST 方法隧道传输 HTTP 方法的方式，通过这种方式，你可以调用其他 HTTP 方法调用。这可以通过在 HTTP 请求中使用 `X-HTTP-Method-Override`
    头来实现，其值为方法名称，例如 GET。另一种方式是指定 `alf_method` 作为查询字符串参数。


    另一个客户端限制可能是并非所有客户端都能优雅地处理非成功状态的 HTTP 状态码。在这种情况下，有一种机制可以强制 HTTP 响应在响应头中指定成功。响应主体仍然表示如同收到非成功状态一样的内容，这允许客户端了解
    web script 提供的错误代码或消息（如果有的话）。为了能够优雅地处理非成功场景下的 HTTP 状态码，可以通过在 HTTP 请求上设置 `alf-force-success-response`
    头并将值设为 `true`，从而每次都强制在 HTTP 响应中指定成功。


    ## 总结


    在本章中，我们了解了调用 web script 的不同方式，例如从 Web 浏览器调用。使用可用于 Web 浏览器的附加组件，可以调用 web script。我们已经看到了从独立
    Java 类调用 web script 的不同方式。我们还了解了如何从基于 Spring 的服务和命令行调用 web script。我们了解了将 web script
    作为 JSR-168 portlet 和 JSF 页面调用的可能性。我们还看到了 Alfresco 中的 web script 框架如何为我们提供处理调用客户端某些限制的方法。


    我们将在下一章学习如何开发基于 Java 的 web script。


    在 Alfresco 中开发 web script 时，为 web script 编写控制器实现有两种选择：基于 JavaScript 的控制器和基于 Java
    的控制器。根据你的偏好，你可以在需要时从这两者中选择控制器实现。与基于 Java 的控制器相比，使用基于 JavaScript 的控制器可以加快开发周期。在基于
    JavaScript 的控制器中，你可以使用 Alfresco JavaScript API 完成许多事情。然而，有时这可能不足以实现你的业务需求。在这种情况下，你可以使用基于
    Java 的 web script，在其中可以使用所有 Alfresco 服务，如 NodeService、SearchService、ContentService
    等，并且可以根据需要构建 web script。


    在那些你可能最终开发大量 web script 的项目中，你必须根据项目执行的可行性来决定将实现哪种类型的控制器实现。你可以选择开发基于 JavaScript
    控制器的 web script 以加快开发速度，并且仅在 JavaScript API 不适合你的需求时才开发基于 Java 的 web script。或者，你始终可以使用基于
    Java 的 web script，以便为你的项目采用标准化的开发方法。


    了解使用两种类型的控制器实现 web script 是很重要的。我们之前创建 hello world web script 时已经看到了如何使用基于 JavaScript
    的控制器。现在，是时候了解基于 Java 的 web script 了。在本章中，我们将为示例用例在 Alfresco 中实现一个基于 Java 的 web
    script，以便你逐步了解如何创建一个具有 Java 后端控制器实现的 web script。然后，你可以根据项目中的业务需求开发基于 Java 的 web
    script。


    ## 用例场景


    我们将采用一个非常简单的场景，以全面了解创建具有 Java 后端控制器的 web script。我们的主要目标是了解如何创建基于 Java 的 web script，以及如何在基于
    Java 的控制器中使用 Alfresco API。让我们开始吧。


    你必须知道，Alfresco 将内容的元数据存储在数据库中，并将实际内容存储在文件系统上。现在，一旦内容在 Alfresco 中可用，你可能希望了解其位置，并找出它在文件系统上的实际位置。所以，下次你与某人讨论
    Alfresco 中的内容时，你实际上可以展示 Alfresco 中内容与内容存储下文件系统上实际物理位置的映射。


    此外，在涉及外部应用程序与 Alfresco 集成的项目中，你可能在某个时候还想知道内容的大小以及它在文件系统上的位置。


    让我们将此作为构建基于 Java 的 web script 的用例场景。我们基本上想在 Alfresco 中创建一个 web script，为给定的节点提供其在文件系统上的实际位置及其内容大小。


    ## 高层级的 web script 功能


    在理解了我们要实现的整体场景之后，让我们从高层级了解这个 web script 将如何工作：


    - 需要将参数 nodeid 作为请求参数传递给 web script。

    - 只有经过身份验证的用户才能访问该 web script。

    - 如果用户对给定节点至少具有读取访问权限，那么才会提供该节点的文件系统物理位置和内容大小。

    - 响应将以 JSON 和 XML 格式提供。格式可以在调用 web script 时指定。


    ## 准备工作


    让我们回顾一下对 web script 构建模块的了解，并确定需要为此 web script 创建的组件，如下所示：


    - 每个 web script 都需要有一个描述文档。因此，第一步是创建 web script 描述文档。

    - web script 需要以 XML 和 JSON 格式返回响应，因此有必要提供用于渲染 XML 响应的响应模板和用于渲染 JSON 响应的响应模板。

    - 获取文件系统位置和大小的整个逻辑将位于 web script 控制器中。在这种情况下，需要创建一个基于 Java 的 web script 控制器来处理业务逻辑。

    - 为了向 web script 注册基于 Java 的控制器，需要 Spring 配置。因此，需要创建一个 Spring 上下文文件，以向 web script
    注册基于 Java 的控制器。并非总是需要创建新的 Spring 上下文文件。你可以根据系统逻辑模块拥有一个上下文文件，并且属于该模块的所有 web script
    都可以在该上下文文件中注册。


