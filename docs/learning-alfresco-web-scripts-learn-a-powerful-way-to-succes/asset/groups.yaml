    - Alfresco explorer authenticator

    - JSR-168 Authenticator

    - JSR-168 Authenticator with Alfresco explorer support

    - Facebook Authenticator


    The web script framework by default uses basic HTTP authentication. However, it
    can be configured to use other forms of authentication mechanisms.


    ### HTTP basic authenticator


    A username and password or a ticket must be specified while accessing the web
    script through an HTTP/HTTPS request when web script needs to be invoked for an
    authenticated user.


    The authorization header must contain a username and password or a ticket.


    The ticket can be specified through a query string parameter: `alf_ticket`.


    > A ticket basically represents an authenticated user who has already performed
    successful login to Alfresco. It can be easily obtained using the out-of-the-box
    Alfresco web script via the URL `http://localhost:8080/alfresco/service/api/login?u={username}&pw={password}`.
    You just need to provide the username and password in the placeholders here before
    invoking it. Generally, while accessing the Alfresco repository from your custom
    frontend application or third-party system, this would be the first thing you
    would do in order to proceed further and invoke other web scripts with authenticated
    access.


    Servlet Runtime uses an HTTP basic authenticator to authenticate the web script
    requesting user.


    This authenticator is configured as a spring bean having ID `webscripts.authenticator.basic`
    in `web-scripts-application-context.xml`.


    > The `web-scripts-application-context.xml` file can be located at `tomcat\webapps\alfresco\WEB-INF\classes\alfresco`
    inside your Alfresco installed directory. If you are using Alfresco Community
    5, it can be located under the `alfresco` package inside `alfresco-remote-api-*.jar`.


    ### Alfresco Explorer authenticator


    This authenticator uses the authentication mechanism that is used while logging
    to Alfresco Web Client.


    The user will be redirected to the Alfresco Web Client login page if a login is
    required.


    This authenticator is configured as a spring bean having ID `webscripts.authenticator.webclient`
    in `web-client-application-context.xml`.


    The `web-client-application-context.xml` file can be found at `tomcat\webapps\alfresco\WEB-INF\classes\alfresco`
    inside your Alfresco installed directory. The location remains the same for Alfresco
    Community 5 as well.


    ### JSR-168 Authenticator


    JSR-168 Authenticator expects the user has been already authenticated by the portal.
    Authenticated portal user can be found from the portal session using the `alfportletusername`
    attribute.


    This authenticator is configured as a spring bean having ID `webscripts.authenticator.jsr168`
    in `web-scripts-application-context.xml`.


    ### JSR-168 Authenticator with Alfresco Explorer support


    Alfresco repository web scripts, depending on Alfresco Web Client functionalities,
    can be authenticated and used within the portal with the use of this authenticator.


    This authenticator is configured as a spring bean having ID `webscripts.authenticator.jsr168.webclient`
    in `web-client-application-context.xml`.


    ### Facebook Authenticator


    Users will be redirected to the Facebook login page if a login is required.


    This authenticator is configured as a spring bean having ID `webscripts.authenticator.facebook`
    in `web-scripts-application-context.xml`.


    ## Web Script Container


    Web Script Container is the core of the web script framework. It plays a major
    role in executing the web script by being a central point integrating all other
    required services in order to execute web script. It identifies the appropriate
    web script and provides the root objects to the web script.


    Alfresco out-of-the-box provides two types of Web Script Containers:


    - Repository Container

    - Presentation Container


    ### Repository Container


    This container plays a key role in executing all the web scripts that provide
    direct access to the content residing in the Alfresco repository using the various
    services provided by Alfresco.


    It is a specialized type of container mainly to be embedded only in the Alfresco
    repository. It uses some of the core services provided by the Alfresco repository
    to support transactions and authentication for web scripts.


    Another useful and important thing that the Repository Container does is that
    it provides the repository-specific root objects available for the JavaScript-based
    controller and response templates.


    Repository Container configuration can be found in Alfresco''s web app in `web-scripts-application-context.xml`
    as a bean entry having ID `webscripts.container`.


    In the recent versions of Alfresco (Version 4 onwards), implementation class is
    `org.alfresco.repo.web.scripts.TenantRepositoryContainer`, found in `alfresco-remote-api-*.jar`.


    ### Presentation Container


    Presentation Container is a lightweight implementation mainly for web scripts
    to render user interface components making remote calls to remote repositories.
    It provides the basic support to web scripts for making service call to remote
    data sources.


    This is available as the vanilla container in the spring web scripts implementation
    that gets shipped with Alfresco. This container implementation makes it easy to
    host web scripts in any environment.


    Presentation Container configuration can be found in `spring-webscripts-*.jar`
    as a spring bean entry having ID `webscripts.container` in `web-scripts-application-context.xml`.


    ## Other supporting components


    The various other components that Web Script Container relies upon and which play
    a key role while the execution of web scripts are being executed are explored
    in the following sections.


    ### Configuration service


    All relevant XML configuration files for the web script are read and parsed using
    the configuration service.


    The implementation class is `org.springframework.extensions.config.xml.XMLConfigService`.


    ### Web Script registry


    Indexes for all the web scripts that are registered to the specific Web Script
    Container are maintained using the web script registry.


    The implementation class is `org.springframework.extensions.webscripts.DeclarativeRegistry`.


    ### Format registry


    Format registry is the registry to get the relevant format for the specified MIME
    type and also to get the MIME type for the mentioned format.


    The `org.springframework.extensions.webscripts.FormatRegistry` class contains
    the implementation details.


    ### Script processor registry


    The script processor registry provides a script processor that executes the backend
    implementation of the web script controller implemented in JavaScript.


    The implementation of the script processor registry can be found in `org.springframework.extensions.webscripts.ScriptProcessorRegistry`.


    The script processor used to execute the JavaScript-based controller is `org.alfresco.repo.jscript.RhinoScriptProcessor`.


    ### Template processor registry


    The template processor registry provides the template processor that executes
    the response templates for the web script.


    The implementation of it can be located in `org.springframework.extensions.webscripts.TemplateProcessorRegistry`.


    The Default FreeMarker template processor implementation is available in `org.springframework.extensions.webscripts.processor.FTLTemplateProcessor`.

    '
  mdcn: '


    该运行时（`WebScriptJSFRuntime`）的实现可在 `spring-webscripts-*.jar` 中的 `org.springframework.extensions.webscripts.jsf.UIWebScript`
    内作为内部类实现找到。


    ## Facebook 运行时


    Facebook 运行时可在 Alfresco Web 脚本中提供对 Facebook API 的访问。


    该运行时的实现在 `alfresco-remote-api-*.jar` 的 `org.alfresco.repo.web.scripts.facebook.FacebookServletRuntime`
    中提供。


    ## SURF 运行时


    SURF Web 框架运行时允许通过嵌入 Alfresco Web 脚本组件来构建 Web 层 UI 页面。


    SURF 运行时的实现可在 `spring-surf-*.jar` 的 `org.springframework.extensions.webscripts.LocalWebScriptRuntime`
    中找到。


    ## Web 脚本身份验证器


    在与任何内容存储库交互时，安全访问内容是必须且非常重要的。Alfresco 在访问内容存储库时也要求经过身份验证的访问。Web 脚本身份验证器的主要任务是对
    Web 脚本请求进行身份验证。


    如下列表所述，Alfresco 开箱即用地提供了多种身份验证器，它们可以在相应的 Alfresco Web 脚本运行时中进行配置，以便通过 Alfresco
    Web 脚本提供对 Alfresco 存储库的安全访问：


    - HTTP 基本身份验证器

    - Alfresco Explorer 身份验证器

    - JSR-168 身份验证器

    - 支持 Alfresco Explorer 的 JSR-168 身份验证器

    - Facebook 身份验证器


    Web 脚本框架默认使用 HTTP 基本身份验证。不过，它可以配置为使用其他形式的身份验证机制。


    ### HTTP 基本身份验证器


    当需要为经过身份验证的用户调用 Web 脚本时，通过 HTTP/HTTPS 请求访问 Web 脚本必须指定用户名和密码或票据。


    授权标头中必须包含用户名和密码或票据。


    票据可以通过查询字符串参数 `alf_ticket` 来指定。


    > 票据基本上代表一个已经成功登录 Alfresco 的经过身份验证的用户。可以通过现成的 Alfresco Web 脚本轻松获得票据，URL 为 `http://localhost:8080/alfresco/service/api/login?u={username}&pw={password}`。调用前，只需在此处占位符中提供用户名和密码。通常，当从自定义前端应用程序或第三方系统访问
    Alfresco 存储库时，这是为了继续进一步操作并使用经过身份验证的访问调用其他 Web 脚本而首先要做的事情。


    Servlet 运行时使用 HTTP 基本身份验证器来验证请求 Web 脚本的用户。


    该身份验证器在 `web-scripts-application-context.xml` 中配置为 ID 为 `webscripts.authenticator.basic`
    的 Spring Bean。


    > `web-scripts-application-context.xml` 文件可以在 Alfresco 安装目录内的 `tomcat\webapps\alfresco\WEB-INF\classes\alfresco`
    中找到。如果您使用的是 Alfresco Community 5，它可以在 `alfresco-remote-api-*.jar` 内的 `alfresco`
    包下找到。


    ### Alfresco Explorer 身份验证器


    该身份验证器使用登录 Alfresco Web Client 时所使用的身份验证机制。


    如果需要登录，用户将被重定向到 Alfresco Web Client 登录页面。


    该身份验证器在 `web-client-application-context.xml` 中配置为 ID 为 `webscripts.authenticator.webclient`
    的 Spring Bean。


    `web-client-application-context.xml` 文件可以在 Alfresco 安装目录内的 `tomcat\webapps\alfresco\WEB-INF\classes\alfresco`
    中找到。对于 Alfresco Community 5，位置也相同。


    ### JSR-168 身份验证器


    JSR-168 身份验证器期望用户已经通过门户进行了身份验证。可以使用 `alfportletusername` 属性从门户会话中找到经过身份验证的门户用户。


    该身份验证器在 `web-scripts-application-context.xml` 中配置为 ID 为 `webscripts.authenticator.jsr168`
    的 Spring Bean。


    ### 支持 Alfresco Explorer 的 JSR-168 身份验证器


    依赖 Alfresco Web Client 功能的 Alfresco 仓库 Web 脚本，可以使用此身份验证器在门户内进行身份验证和使用。


    该身份验证器在 `web-client-application-context.xml` 中配置为 ID 为 `webscripts.authenticator.jsr168.webclient`
    的 Spring Bean。


    ### Facebook 身份验证器


    如果需要登录，用户将被重定向到 Facebook 登录页面。


    该身份验证器在 `web-scripts-application-context.xml` 中配置为 ID 为 `webscripts.authenticator.facebook`
    的 Spring Bean。


    ## Web 脚本容器


    Web 脚本容器是 Web 脚本框架的核心。它作为集成所有其他所需服务的中心点来执行 Web 脚本，起着重要作用。它识别适当的 Web 脚本并向 Web 脚本提供根对象。


    Alfresco 开箱即用地提供了两种类型的 Web 脚本容器：


    - 仓库容器

    - 表示容器


    ### 仓库容器


    该容器在执行所有 Web 脚本方面发挥着关键作用，这些脚本利用 Alfresco 提供的各种服务直接访问 Alfresco 仓库中的内容。


    它是一种专用类型的容器，主要仅嵌入在 Alfresco 仓库中。它使用 Alfresco 仓库提供的一些核心服务来支持 Web 脚本的事务和身份验证。


    仓库容器做的另一件有用且重要的事情是，它提供了特定于仓库的根对象，可供基于 JavaScript 的控制器和响应模板使用。


    仓库容器的配置可以在 Alfresco Web 应用的 `web-scripts-application-context.xml` 中找到，作为一个 ID
    为 `webscripts.container` 的 Bean 条目。


    在 Alfresco 的近期版本（4 及更高版本）中，实现类是 `org.alfresco.repo.web.scripts.TenantRepositoryContainer`，位于
    `alfresco-remote-api-*.jar` 中。


    ### 表示容器


    表示容器是一个轻量级实现，主要用于 Web 脚本渲染用户界面组件，并向远程仓库发出远程调用。它为 Web 脚本提供基本支持，以对远程数据源进行服务调用。


    这是 Alfresco 随附的 Spring Web 脚本实现中的普通容器。此容器实现使得在任何环境中托管 Web 脚本变得容易。


    表示容器的配置可以在 `spring-webscripts-*.jar` 中的 `web-scripts-application-context.xml`
    中作为 ID 为 `webscripts.container` 的 Spring Bean 条目找到。


    ## 其他支持组件


    以下各节将探讨 Web 脚本容器所依赖的其他各种组件，这些组件在 Web 脚本执行期间起着关键作用。


    ### 配置服务


    Web 脚本的所有相关 XML 配置文件均使用配置服务读取和解析。


    实现类是 `org.springframework.extensions.config.xml.XMLConfigService`。


    ### Web 脚本注册表


    使用 Web 脚本注册表维护已注册到特定 Web 脚本容器的所有 Web 脚本的索引。


    实现类是 `org.springframework.extensions.webscripts.DeclarativeRegistry`。


    ### 格式注册表


    格式注册表是一种注册表，用于获取指定 MIME 类型对应的格式，也用于获取所提及格式对应的 MIME 类型。


    `org.springframework.extensions.webscripts.FormatRegistry` 类包含实现细节。


    ### 脚本处理器注册表


    脚本处理器注册表提供了一个脚本处理器，用于执行以 JavaScript 实现的 Web 脚本控制器的后端实现。


    脚本处理器注册表的实现可以在 `org.springframework.extensions.webscripts.ScriptProcessorRegistry`
    中找到。


    用于执行基于 JavaScript 的控制器的脚本处理器是 `org.alfresco.repo.jscript.RhinoScriptProcessor`。


    ### 模板处理器注册表


    模板处理器注册表提供了执行 Web 脚本响应模板的模板处理器。


    它的实现可以在 `org.springframework.extensions.webscripts.TemplateProcessorRegistry`
    中找到。


    默认的 FreeMarker 模板处理器实现可在 `org.springframework.extensions.webscripts.processor.FTLTemplateProcessor`
    中找到。


    '
