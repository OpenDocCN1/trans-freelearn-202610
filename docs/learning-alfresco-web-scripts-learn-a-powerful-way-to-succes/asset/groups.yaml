    ```\n```\n\nIf you try to register the web script without providing the shortname\
    \ value, it will not get registered. The following is the snippet of the error\
    \ that will appear in the logs:\n\n> **Unable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
    \ due to error: Failed to parse web script description document helloworld.get.desc.xml;\
    \ Expected <shortname> value.**\n\n### The `<url>` tag\n\nEach web script is bound\
    \ to a URI that will be used to invoke the web script. It is possible to have\
    \ one or more URI declaration for a web script, and any of the URIs can be used\
    \ to execute the web scripts. This tag does not have any attributes:\n\n```\n\
    ```xml\n<url>/helloworld?name={argumentName}</url>\n<url>/hello/world/{argumentName}</url>\n\
    ```\n```\n\nIf a URL is not provided in the description document and you try to\
    \ register the web script, it will give an error and will not register the web\
    \ script. The following is the snippet of the error from the logs when there isn't\
    \ any URL provided in the web script description document:\n\n> **Unable to register\
    \ script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
    \ due to error: Failed to parse web script description document helloworld.get.desc.xml;\
    \ Expected at least one <url> element.**\n\nIf a URL has been defined in one web\
    \ script and you try to define the same URL in another web script, then the web\
    \ script engine will not register the web script and an error as shown in the\
    \ following example will appear in the logs:\n\n> **Unable to register script\
    \ classpath:alfresco/extension/templates/webscripts/test/helloworld1.get.desc.xml\
    \ due to error: Web Script document test/helloworld1.get.desc.xml is attempting\
    \ to define the url '/helloworld1:GET' already defined by test/helloworld.get.desc.xml.**\n\
    \nA minimal description file with all the mandatory elements for a hello world\
    \ web script will appear as follows:\n\n```\n```xml\n<webscript>\n    <shortname>Hello\
    \ World</shortname>\n    <url>/helloworld?name={argumentName}</url>\n    <url>/hello/world/{argumentName}</url>\n\
    </webscript>\n```\n```\n\n## Optional declarations\n\nAlong with mandatory declarations,\
    \ it is also possible to have some additional elements declared in the description\
    \ document. Let's take a walk-through of the possible optional declarations for\
    \ the web script description document.\n\n### <format>\n\nThis element allows\
    \ you to specify the response content type through the web script URI while invoking\
    \ the web scripts. It basically allows you to control how to specify the web script\
    \ response format. There are different possible valid values that can be defined\
    \ for this element and are mentioned in the subsequent sections. This element\
    \ has an optional attribute named default.\n\n### argument\n\nLet's take a look\
    \ at the format tag that has its value as argument in the description document.\
    \ It will appear as follows:\n\n```\n<format default=\"html\">argument</format>\n\
    ```\n\nSpecifying the value argument for the format element indicates that the\
    \ response format for a web script can be selected by adding an argument to the\
    \ web script URL. Using the query string parameter format, the response content\
    \ type can be specified as follows:\n\n```\nhttp://localhost:8080/alfresco/service/helloworld?name=Ramesh&format=xml\n\
    ```\n\n### extension\n\nThe format tag that has its value as extension will appear\
    \ in the description document as follows:\n\n```\n<format default=\"html\">extension</format>\n\
    ```\n\nIt is possible to specify the response content-type by adding an extension\
    \ to the web script ID while invoking the web script as follows:\n\n```\nhttp://localhost:8080/alfresco/service/helloworld.xml?name=Ramesh\n\
    ```\n"
  mdcn: "\n\n典型的部署架构是将所有数据 Web 脚本托管在 Alfresco 仓库服务器中。使用后端仓库的前端客户端可以使用展示 Web 脚本来构建前端用户界面，而展示\
    \ Web 脚本将托管在客户端侧。前端客户端可以通过 HTTP 调用数据 Web 脚本以便与后端仓库交互。Alfresco 仓库服务器将使用 Servlet\
    \ Runtime 来执行 Web 脚本。\n\n## Summary\n\n在本章中，我们详细学习了 Web 脚本执行流程及其技术细节。此外，我们还了解了共同构成\
    \ Web 脚本框架的各个组件。我们还了解了 Alfresco 为这些组件提供的各种开箱即用实现以及 Alfresco Web 脚本最常见的部署架构。\n\n\
    既然我们已经探索了 Alfresco 中的 Web 脚本框架，那么在下一章中，我们将详细了解构建 Web 脚本的各个组件。\n\n## 4\nWeb 脚本的\n\
    构建块\n\n在本章中，我们将详细介绍创建 Web 脚本的不同组件：\n\n- 描述文档\n- Controller 实现\n- 响应模板\n- I18N\
    \ 消息包\n- 配置文档\n- 每个组件的命名约定\n\n## Web 脚本的构建块\n\nWeb 脚本是 Alfresco 企业内容管理系统的一个关键特性，实现起来非常容易。深入了解构成\
    \ Web 脚本的组件将使你在 Alfresco 中开发 Web 脚本的工作变得更加轻松。\n\n本章将为你提供有关 Web 脚本构建块的详细知识。彻底理解用于在\
    \ Alfresco 中开发 Web 脚本的不同工件是非常必要的。在你在任何项目中实施 Alfresco Web 脚本的整个过程中，你在开发 Web 脚本时始终需要使用这些组件，因此，清楚地理解它非常重要，这样你就可以在需要时快速轻松地实现\
    \ Web 脚本。\n\nAlfresco 提供了一个强大的 Web 脚本框架，使用熟悉的技术（如脚本和模板语言）即可轻松创建 Web 脚本。每个 Web\
    \ 脚本都必须有一个描述文档，并且至少有一个或多个 FreeMarker 响应模板文档。Web 脚本可以可选地有一个作为后端实现的控制器，它将根据定义的业务逻辑对\
    \ Alfresco 仓库执行必要的处理。也可以进行一些可选的高级实现，为 Web 脚本响应提供消息包以及根据需要对 Web 脚本进行一些配置选项。\n\n\
    让我们详细了解 Web 脚本的每个组件，以便更好地理解它们。\n\n## 描述文档 – 必不可少！\n\n在开发 Web 脚本时，首先要做的是进行简要练习，确定\
    \ Web 脚本的 URI 和 HTTP 方法、提供给 Web 脚本的任何参数、为 Web 脚本使用的响应格式、检查是否需要对 Web 脚本使用任何身份验证、以及检查是否需要与仓库进行后端处理，然后开始实现并首先为\
    \ Web 脚本创建描述文档。\n\n描述文档是 Web 脚本实现的核心，它基本上是一个 XML 文件。它描述了有关 Web 脚本的重要细节。任何查看描述文档的开发人员都可以大致了解\
    \ Web 脚本的作用。\n\n这是创建 Alfresco 中的 Web 脚本时需要开发的第一个文件。Web 脚本描述文档中必须提供某些强制性声明。除此之外，还可以为\
    \ Web 脚本可选地提供额外的声明。现在让我们看看可以在描述文档中提供的各种声明。我们将逐一查看选项，这将让你清楚地了解如何从头开始创建描述文档 `helloworld.get.desc.xml`，用于我们之前创建的\
    \ hello world Web 脚本。\n\n## Mandatory declarations\n\n现在让我们回顾一下在创建 Web 脚本时必须在描述文档中提供的元素。\n\
    \n### The `<webscript>` tag\n\n有关 Web 脚本的所有信息都包含在 Web 脚本描述文档中，位于根元素 `<webscript>`\
    \ 内：\n\n```\n```xml\n<webscript>\n\n</webscript>\n```\n```\n\n如果未指定上述根元素标签并创建空白描述文档\
    \ XML 文件，则在注册 Web 脚本时，日志中会出现错误，并且你将无法注册 Web 脚本。\n\n以下是日志中的错误片段：\n\n```\n```text\n\
    Unable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
    \ due to error:\nFailed to parse web script description document helloworld.get.desc.xml;\
    \ Error on line -1 of document: Premature end of file. Nested exception: Premature\
    \ end of file.\n```\n```\n\n### The `<shortname>` tag\n\n对于任何 Web 脚本，都会给出一个人类可读的\
    \ Web 脚本名称。它可以按以下代码行所示在 `<shortname>` 标签内提供。此标签没有属性。\n\n```\n```xml\n<shortname>Hello\
    \ World</shortname>\n```\n```\n\n如果尝试在未提供 shortname 值的情况下注册 Web 脚本，则它将无法注册。以下是在日志中出现的错误片段：\n\
    \n> **Unable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
    \ due to error: Failed to parse web script description document helloworld.get.desc.xml;\
    \ Expected <shortname> value.**\n\n### The `<url>` tag\n\n每个 Web 脚本都绑定到一个 URI，该\
    \ URI 将用于调用 Web 脚本。可以为 Web 脚本声明一个或多个 URI，并且可以使用任何 URI 来执行 Web 脚本。此标签没有属性：\n\n\
    ```\n```xml\n<url>/helloworld?name={argumentName}</url>\n<url>/hello/world/{argumentName}</url>\n\
    ```\n```\n\n如果在描述文档中未提供 URL 并尝试注册 Web 脚本，它将给出错误并且不会注册 Web 脚本。以下是当 Web 脚本描述文档中没有提供任何\
    \ URL 时日志中的错误片段：\n\n> **Unable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml\
    \ due to error: Failed to parse web script description document helloworld.get.desc.xml;\
    \ Expected at least one <url> element.**\n\n如果一个 URL 已在一个 Web 脚本中定义，并且你尝试在另一个\
    \ Web 脚本中定义相同的 URL，则 Web 脚本引擎将不会注册 Web 脚本，并且日志中会出现如下示例所示的错误：\n\n> **Unable to\
    \ register script classpath:alfresco/extension/templates/webscripts/test/helloworld1.get.desc.xml\
    \ due to error: Web Script document test/helloworld1.get.desc.xml is attempting\
    \ to define the url '/helloworld1:GET' already defined by test/helloworld.get.desc.xml.**\n\
    \n一个包含 hello world Web 脚本所有强制元素的最小描述文件将如下所示：\n\n```\n```xml\n<webscript>\n   \
    \ <shortname>Hello World</shortname>\n    <url>/helloworld?name={argumentName}</url>\n\
    \    <url>/hello/world/{argumentName}</url>\n</webscript>\n```\n```\n\n## Optional\
    \ declarations\n\n除了强制性声明之外，还可以在描述文档中声明一些额外的元素。让我们了解一下 Web 脚本描述文档可能的 optional\
    \ 声明。\n\n### <format>\n\n此元素允许你通过在调用 Web 脚本时使用 Web 脚本 URI 来指定响应内容类型。它基本上允许你控制如何指定\
    \ Web 脚本响应格式。可以为此元素定义不同的可能有效值，并在后续章节中提及。此元素有一个可选属性名为 default。\n\n### argument\n\
    \n让我们看看描述文档中格式标签的值为 argument 的情况。它将如下所示：\n\n```\n<format default=\"html\">argument</format>\n\
    ```\n\n为 format 元素指定值 argument 表示可以通过向 Web 脚本 URL 添加参数来选择 Web 脚本的响应格式。使用查询字符串参数\
    \ format，可以按如下方式指定响应内容类型：\n\n```\nhttp://localhost:8080/alfresco/service/helloworld?name=Ramesh&format=xml\n\
    ```\n\n### extension\n\n格式标签的值为 extension 时将在描述文档中如下所示：\n\n```\n<format default=\"\
    html\">extension</format>\n```\n\n可以通过在调用 Web 脚本时向 Web 脚本 ID 添加扩展名来指定响应内容类型，如下所示：\n\
    \n```\nhttp://localhost:8080/alfresco/service/helloworld.xml?name=Ramesh\n```\n\
    \n"
