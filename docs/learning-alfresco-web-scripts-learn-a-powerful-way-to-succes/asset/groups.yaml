    command, you will need to increase the size of the memory allocated to Alfresco
    and Tomcat. You can do this by providing Maven with additional JVM memory settings
    such as increasing PermGen size.


    We have just seen that without having Alfresco installed previously on the development
    machine, we were able to test our customized development very easily with the
