  - "[PAGE 107]\n\n# Configuring the controller for the web script\n\nOnce the Java\
    \ controller is ready, it needs to be configured for the web script so that the\
    \ web script framework in Alfresco can get to know that this Java class is the\
    \ controller for the `contentlocation` web script. This can be done by creating\
    \ a spring context file and adding the entry for the Java class in it.\n\nCreate\
    \ a file `custom-example-webscripts-context.xml` that has the following content:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE beans PUBLIC '-//SPRING//DTD\
    \ BEAN//EN' 'http://www.springframework.org/dtd/spring-beans.dtd'>\n<beans>\n\
    \    <bean id=\"webscript.example.contentlocation.get\" class=\"com.example.content.ContentLocationWebScript\"\
    \ parent=\"webscript\">\n        <property name=\"nodeService\" ref=\"nodeService\"\
    \ />\n        <property name=\"permissionService\" ref=\"permissionService\" />\n\
    \    </bean>\n</beans>\n```\n\nWe created a spring context file to associate the\
    \ Java controller with the `contentlocation` web script in order to let the web\
    \ script framework in Alfresco know that the ContentLocationWebscript Java class\
    \ is the controller for the `contentlocation` web script. This is done by following\
    \ the appropriate naming convention while providing a bean entry in the context\
    \ file.\n\nThe most important thing is to specify the correct bean ID. The naming\
    \ convention that needs to be followed is `webscript.package.webscriptid.httpmethod`.\n\
    \nHence, the way it needs to be built is, that if the web script description file\
    \ resides at `templates\\webscripts\\example\\contentlocation.get.desc.xml` location,\
    \ then the bean ID would be `webscript.example.contentlocation.get`. Following\
    \ this naming convention is a must in order to register the class as a controller\
    \ for the web script. If you fail to do so, the web script framework in Alfresco\
    \ will not be able to register the class as a web script controller and when you\
    \ try to execute the web script, the controller code will not get called."
  md: "\nFor this web script, you can use your favorite editor to create the required\
    \ files for the web script and develop the controller Java class. We will cover\
    \ setting up the development environment using Maven in Chapter 9, Mavenizing\
    \ Web Scripts. In this chapter, we will mainly aim to get an understanding of\
    \ how to implement a Java-backed web script. You need to have `spring-webscripts-*.jar`\
    \ and `alfresco-data-model-*.jar` added in your class path in order to be able\
    \ to compile the controller Java class. Both these JARs can be found at the `tomcat\\\
    webapps\\alfresco\\WEB-INF\\lib` location in your Alfresco installation. The `*`\
    \ symbol in the JAR name refers to the version number.\n\n## Creating a description\
    \ document\n\nAs the primary purpose of the web script is to return the content\
    \ location, let's use the web script ID as `contentlocation`. We will use the\
    \ HTTP GET method as we are going to retrieve the information for a node.\n\n\
    As a first step, create a description document for the web script. Create a file\
    \ named `contentlocation.get.desc.xml` that has the following content:\n\n```\n\
    <webscript>\n    <shortname>Get content location and size</shortname>\n    <description>Gets\
    \ the physical location for the content and size of the content</description>\n\
    \    <url>/getContentLocation?nodeid={nodeid}</url>\n    <url>/getContentLocation.json?nodeid={nodeid}</url>\n\
    \    <url>/getContentLocation.xml?nodeid={nodeid}</url>\n    <format default=\"\
    json\">extension</format>\n    <authentication>user</authentication>\n</webscript>\n\
    ```\n\nLet's understand what we have just done. We have created a description\
    \ document that provides a human-readable name and brief information about the\
    \ web script in the `shortname` and `description` tags respectively.\n\nWe have\
    \ defined three URLs that can be used to invoke a web script. The first one is\
    \ the default URL and the other two are explicitly mentioned to get a response\
    \ in JSON and XML formats respectively. Please note that the first and second\
    \ URL will produce the same output.\n\nThe default response format is specified\
    \ as `json`. The value `extension` for the `format` tag mentions that a response\
    \ content type can be specified as an extension to the web script ID while invoking\
    \ the web script.\n\nAlso most importantly, a web script expects an argument named\
    \ `nodeid` when the web script is invoked.\n\n## Creating a response template\n\
    \nAs a rule of thumb for a web script, we have to follow the naming convention\
    \ as expected by the web script framework in Alfresco. As the web script is supposed\
    \ to return the response in the JSON and XML formats, we need to create two response\
    \ templates for the web script. Following the naming conventions, there are two\
    \ files to be created — `contentlocation.get.json.ftl` and `contentlocation.get.xml.ftl`\
    \ as response templates. Return `filesystem_location` and size in the response\
    \ as follows:\n\n1. To create a JSON response template, create a file named `contentlocation.get.json.ftl`\
    \ that has the following content:\n\n```json\n{\n    \"content\" :\n    {\n  \
    \      \"filesystem_location\" : \"${contentFSLocation}\",\n        \"size\" :\
    \ ${contentSize}\n    }\n}\n```\n\n2. To create an XML response template, create\
    \ a file named `contentlocation.get.xml.ftl` that has the following content:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<content>\n    <filesystem_location>${contentFSLocation}</filesystem_location>\n\
    \    <size>${contentSize}</size>\n</content>\n```\n\nWe have just created two\
    \ response templates as required to return the output for the web script. The\
    \ names used inside `${}` in the preceding code snippets are the model variable\
    \ names to be set from the controller class. Make sure that while implementing\
    \ a controller, the model variable names are set with the same name as used in\
    \ the response templates.\n\n## Creating a Java controller\n\nNow it's time to\
    \ do some Java coding. Before we start the actual coding, it's always a good idea\
    \ to quickly identify the logic that has to be taken care of by the code we are\
    \ going to write. This exercise really does help a lot.\n\n### Controller logic\
    \ at a high level\n\nIn order to develop a controller for this scenario, let's\
    \ take a look at the implementation logic that we will include in the Java-backed\
    \ controller at a high level:\n\n- A controller will expect `nodeid` as an input\
    \ parameter\n- Check whether the given node is present in the repository\n- Check\
    \ whether the user has at least read permissions on the given node\n- Get the\
    \ filesystem location for the given node\n- Get the size on the filesystem for\
    \ the given node\n- Prepare the model object and return it to the FTL response\
    \ template\n\n### Let's code it!\n\nLet's perform the following steps to create\
    \ a Java-backed controller implementation for the web script that will perform\
    \ all the required logic as mentioned in the previous section:\n\n1. Create a\
    \ new class, `com.example.content.ContentLocationWebScript`. It's generally a\
    \ good idea to provide a descriptive naming style and classify the web scripts\
    \ under appropriate packages. This will be useful in a scenario where a large\
    \ number of web scripts are to be developed. As this is going to be a content-related\
    \ web script, we have kept it under the `com.example.content` package and named\
    \ it `ContentLocationWebScript`.\n\n2. The Java class `ContentLocationWebScript`\
    \ you have just created must extend `org.springframework.extensions.webscripts.DeclarativeWebScript`\
    \ as follows:\n\n```\npublic class ContentLocationWebScript extends org.springframework.extensions.webscripts.DeclarativeWebScript\
    \ {\n```\n\n3. We are going to use the Node service, which is basically used to\
    \ perform node-related operations such as create, update, delete, set properties,\
    \ and get properties in Alfresco, to get the details about the filesystem location.\
    \ We will use the Permission service to identify whether a user has read access.\
    \ Now the next step is to provide the declaration for them. Both of them will\
    \ be injected as a Spring dependency as follows:\n\n```\nprivate NodeService nodeService;\n\
    private PermissionService permissionService;\n```\n\n4. Now, check whether the\
    \ user has at least read access on the given noderef. A controller will only proceed\
    \ further if a user has at least read permissions on the node, otherwise the controller\
    \ will set the appropriate error response code.\n\n```\nif (permissionService.hasPermission(contentNodeRef,\n\
    PermissionService.READ) != AccessStatus.ALLOWED) {\n    status.setCode(Status.STATUS_FORBIDDEN);\n\
    \    status.setRedirect(true);\n    return null;\n}\n```\n\n5. The next step is\
    \ to get the filesystem location and size for the content as follows:\n\n```\n\
    ContentData contentData = (ContentData) nodeService.\ngetProperty(contentNodeRef,\
    \ ContentModel.PROP_CONTENT);\nString contentFileLocation = contentData.getContentUrl();\n\
    Long contentSize = contentData.getSize();\n```\n\n6. Create and set the model\
    \ object to render the information in response as follows:\n\n```\nMap<String,\
    \ Object> model = new HashMap<String, Object>();\nmodel.put(\"contentPSLocation\"\
    , contentFileLocation);\nmodel.put(\"contentSize\", contentSize);\nreturn model;\n\
    }\n```\n\n7. At the end of the class, provide the setter methods for the node\
    \ service and permission service as follows:\n\n```\npublic void setNodeService(NodeService\
    \ nodeService) {\n    this.nodeService = nodeService;\n}\n```\n\n```\npublic void\
    \ setPermissionService(PermissionService permissionService) {\n    this.permissionService\
    \ = permissionService;\n}\n}\n```\n\n8. Save the class, and the Java controller\
    \ implementation is now ready.\n\nWe have just created a Java-backed controller\
    \ implementation that will perform the specified logic processing prior to returning\
    \ the content location on the filesystem and size of content. We also used the\
    \ node service and permission service in the controller.\n\n## Configuring the\
    \ controller for the web script\n\nOnce the Java controller is ready, it needs\
    \ to be configured for the web script so that the web script framework in Alfresco\
    \ can get to know that this Java class is the controller for the `contentlocation`\
    \ web script. This can be done by creating a spring context file and adding the\
    \ entry for the Java class in it.\n\nCreate a file `custom-example-webscripts-context.xml`\
    \ that has the following content:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<!DOCTYPE beans PUBLIC '-//SPRING//DTD BEAN//EN' 'http://www.springframework.org/dtd/spring-beans.dtd'>\n\
    <beans>\n    <bean id=\"webscript.example.contentlocation.get\" class=\"com.example.content.ContentLocationWebScript\"\
    \ parent=\"webscript\">\n        <property name=\"nodeService\" ref=\"nodeService\"\
    \ />\n        <property name=\"permissionService\" ref=\"permissionService\" />\n\
    \    </bean>\n</beans>\n```\n\nWe created a spring context file to associate the\
    \ Java controller with the `contentlocation` web script in order to let the web\
    \ script framework in Alfresco know that the `ContentLocationWebScript` Java class\
    \ is the controller for the `contentlocation` web script. This is done by following\
    \ the appropriate naming convention while providing a bean entry in the context\
    \ file.\n\nThe most important thing is to specify the correct bean ID. The naming\
    \ convention that needs to be followed is `webscript.package.webscriptid.httpmethod`.\n\
    \nHence, the way it needs to be built is, that if the web script description file\
    \ resides at `templates\\webscripts\\example\\contentlocation.get.desc.xml` location,\
    \ then the bean ID would be `webscript.example.contentlocation.get`. Following\
    \ this naming convention is a must in order to register the class as a controller\
    \ for the web script. If you fail to do so, the web script framework in Alfresco\
    \ will not be able to register the class as a web script controller and when you\
    \ try to execute the web script, the controller code will not get called.\n"
  mdcn: "\n\n对于此 Web 脚本，您可以使用您喜欢的编辑器创建 Web 脚本所需的<|message|> 文件并开发控制器 Java 类。我们将在第\
    \ 9 章《Mavenizing Web Scripts》中介绍使用 Maven 设置开发环境。在本章中，我们主要旨在了解如何实现一个由 Java 支持的\
    \ Web 脚本。您需要在类路径中添加 `spring-webscripts-*.jar` 和 `alfresco-data-model-*.jar` 才能编译控制器\
    \ Java 类。这两个 JAR 都可以在 Alfresco 安装中的 `tomcat\\webapps\\alfresco\\WEB-INF\\lib`\
    \ 位置找到。JAR 名称中的 `*` 符号指的是版本号。\n\n## 创建描述文档\n\n由于 Web 脚本的主要目的是返回内容位置，让我们使用 Web\
    \ 脚本 ID `contentlocation`。我们将使用 HTTP GET 方法，因为我们将检索节点的<|message|> 息。\n\n作为第一步，为\
    \ Web 脚本创建描述文档。创建一个名为 `contentlocation.get.desc.xml` 的文件，其内容如下：\n\n```\n<webscript>\n\
    \    <shortname>Get content location and size</shortname>\n    <description>Gets\
    \ the physical location for the content and size of the content</description>\n\
    \    <url>/getContentLocation?nodeid={nodeid}</url>\n    <url>/getContentLocation.json?nodeid={nodeid}</url>\n\
    \    <url>/getContentLocation.xml?nodeid={nodeid}</url>\n    <format default=\"\
    json\">extension</format>\n    <authentication>user</authentication>\n</webscript>\n\
    ```\n\n让我们理解一下我们刚刚做了什么。我们创建了一个描述文档，它在 `shortname` 和 `description` 标签中分别提供了关于 Web\
    \ 脚本的人类可读名称和简要信息。\n\n我们定义了三个可用于调用 Web 脚本的 URL。第一个是默认 URL，另外两个是显式提及以分别以 JSON 和\
    \ XML 格式获取响应的 URL。请注意，第一和第二个 URL 将产生相同的输出。\n\n默认响应格式指定为 `json`。`format` 标签的 `extension`\
    \ 值提及，可以在调用 Web 脚本时将响应内容类型指定为 Web 脚本 ID 的扩展。\n\n而且最重要的是，Web 脚本在被调用时期望一个名为 `nodeid`\
    \ 的参数。\n\n## 创建响应模板\n\n作为 Web 脚本的经验法则，我们必须遵循 Alfresco 中 Web 脚本框架期望的命名约定。由于 Web\
    \ 脚本应该以 JSON 和 XML 格式返回响应，我们需要为 Web 脚本创建两个响应模板。按照命名约定，有两个文件需要创建——`contentlocation.get.json.ftl`\
    \ 和 `contentlocation.get.xml.ftl` 作为响应模板。按如下方式在响应中返回 `filesystem_location` 和大小：\n\
    \n1. 要创建 JSON 响应模板，创建一个名为 `contentlocation.get.json.ftl` 的文件，其内容如下：\n\n```json\n\
    {\n    \"content\" :\n    {\n        \"filesystem_location\" : \"${contentFSLocation}\"\
    ,\n        \"size\" : ${contentSize}\n    }\n}\n```\n\n2. 要创建 XML 响应模板，创建一个名为\
    \ `contentlocation.get.xml.ftl` 的文件，其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<content>\n    <filesystem_location>${contentFSLocation}</filesystem_location>\n\
    \    <size>${contentSize}</size>\n</content>\n```\n\n我们刚刚创建了两个响应模板，以返回 Web 脚本的输出。前述代码片段中\
    \ `${}` 内使用的名称是要从控制器类设置的模型变量名称。请确保在实现控制器时，模型变量名称与响应模板中使用的名称相同。\n\n## 创建 Java 控制器\n\
    \n现在是进行一些 Java 编码的时候了。在开始实际编码之前，快速确定我们将要编写的代码需要处理的逻辑始终是一个好主意。这个练习确实非常有帮助。\n\n\
    ### 高层次的控制器逻辑\n\n为了为此场景开发控制器，让我们从高层次来看一下我们将包含在由 Java 支持的控制器中的实现逻辑：\n\n- 控制器将期望\
    \ `nodeid` 作为输入参数\n- 检查给定的节点是否存在于存储库中\n- 检查用户是否至少对给定节点具有读取权限\n- 获取给定节点的 filesystem\
    \ 位置\n- 获取给定节点在 filesystem 上的大小\n- 准备模型对象并将其返回给 FTL 响应模板\n\n### 让我们编码！\n\n让我们执行以下步骤来创建\
    \ Web 脚本的 Java 支持控制器实现，该实现将执行上一节中提到的所有必需逻辑：\n\n1. 创建一个新类，`com.example.content.ContentLocationWebScript`。通常提供描述性命名风格并将\
    \ Web 脚本分类到适当的包中是一个好主意。这在需要开发大量 Web 脚本的场景中会很有用。由于这是一个与内容相关的 Web 脚本，我们将其保留在 `com.example.content`\
    \ 包下，并命名为 `ContentLocationWebScript`。\n\n2. 您刚刚创建的 Java 类 `ContentLocationWebScript`\
    \ 必须扩展 `org.springframework.extensions.webscripts.DeclarativeWebScript`，如下所示：\n\
    \n```\npublic class ContentLocationWebScript extends org.springframework.extensions.webscripts.DeclarativeWebScript\
    \ {\n```\n\n3. 我们将使用 Node 服务，它基本上用于在 Alfresco 中执行节点相关操作，例如创建、更新、删除、设置属性和获取属性，以获取有关\
    \ filesystem 位置的详细信息。我们将使用 Permission 服务来识别用户是否具有读取访问权限。现在下一步是为它们提供声明。两者都将作为 Spring\
    \ 依赖项注入，如下所示：\n\n```\nprivate NodeService nodeService;\nprivate PermissionService\
    \ permissionService;\n```\n\n4. 现在，检查用户是否至少对给定的 noderef 具有读取访问权限。控制器只有在用户至少对节点具有读取权限时才会继续，否则控制器将设置适当的错误响应代码。\n\
    \n```\nif (permissionService.hasPermission(contentNodeRef,\nPermissionService.READ)\
    \ != AccessStatus.ALLOWED) {\n    status.setCode(Status.STATUS_FORBIDDEN);\n \
    \   status.setRedirect(true);\n    return null;\n}\n```\n\n5. 下一步是获取内容的文件系统位置和大小，如下所示：\n\
    \n```\nContentData contentData = (ContentData) nodeService.\ngetProperty(contentNodeRef,\
    \ ContentModel.PROP_CONTENT);\nString contentFileLocation = contentData.getContentUrl();\n\
    Long contentSize = contentData.getSize();\n```\n\n6. 创建并设置模型对象以在响应中呈现信息，如下所示：\n\
    \n```\nMap<String, Object> model = new HashMap<String, Object>();\nmodel.put(\"\
    contentPSLocation\", contentFileLocation);\nmodel.put(\"contentSize\", contentSize);\n\
    return model;\n}\n```\n\n7. 在类的末尾，为节点服务和权限服务提供 setter 方法，如下所示：\n\n```\npublic\
    \ void setNodeService(NodeService nodeService) {\n    this.nodeService = nodeService;\n\
    }\n```\n\n```\npublic void setPermissionService(PermissionService permissionService)\
    \ {\n    this.permissionService = permissionService;\n}\n}\n```\n\n8. 保存该类，Java\
    \ 控制器实现现在已准备就绪。\n\n我们刚刚创建了一个由 Java 支持的控制器实现，它将在返回文件系统上的内容位置和内容大小之前执行指定的逻辑处理。我们还在控制器中使用了节点服务和权限服务。\n\
    \n## 为 Web 脚本配置控制器\n\n一旦 Java 控制器准备就绪，就需要为 Web 脚本配置它，以便 Alfresco 中的 Web 脚本框架知道这个\
    \ Java 类是 `contentlocation` Web 脚本的控制器。这可以通过创建 spring 上下文文件并在其中添加 Java 类的条目来完成。\n\
    \n创建一个文件 `custom-example-webscripts-context.xml`，其内容如下：\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE beans PUBLIC '-//SPRING//DTD BEAN//EN' 'http://www.springframework.org/dtd/spring-beans.dtd'>\n\
    <beans>\n    <bean id=\"webscript.example.contentlocation.get\" class=\"com.example.content.ContentLocationWebScript\"\
    \ parent=\"webscript\">\n        <property name=\"nodeService\" ref=\"nodeService\"\
    \ />\n        <property name=\"permissionService\" ref=\"permissionService\" />\n\
    \    </bean>\n</beans>\n```\n\n我们创建了一个 spring 上下文文件，将 Java 控制器与 `contentlocation`\
    \ Web 脚本关联起来，以便让 Alfresco 中的 Web 脚本框架知道 `ContentLocationWebScript` Java 类是 `contentlocation`\
