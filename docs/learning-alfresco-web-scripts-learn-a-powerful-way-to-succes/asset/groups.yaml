  - '[PAGE 70]


    # Building Blocks of Web Scripts


    Web scripts is a key feature of the Alfresco enterprise content management system
    and it''s easy to implement. Having detailed knowledge about the components that
    make a web script will make your job even easier to develop web scripts in Alfresco.


    This chapter will provide you with the detailed knowledge about the building blocks
    of web scripts. It is really essential to have thorough understanding about the
    different artifacts that are used to develop web scripts in Alfresco. Throughout
    your journey of Alfresco web scripts implementation in any of your project, you
    will always have to use these components while developing web scripts, and hence,
    it is very important to get a clear understanding of it so that you can quickly
    and easily implement web scripts whenever required.


    Alfresco provides a powerful web script framework that makes it easy to create
    a web script using familiar technologies such as scripting and template languages.
    Each and every web script must have a description document and have at least one
    or more FreeMarker response template document. Web scripts can optionally have
    a controller as a backend implementation that will do the required processing
    against Alfresco repository as per the defined business logic. There are some
    optional advanced implementations also possible to have message bundle for web
    script responses along with some configuration options for web scripts if required.


    Let''s take a look at each of the components of web script in detail to gain better
    understanding of them.


    # The description document – it''s a must!


    While developing web scripts, the first thing to do is perform a brief exercise
    to decide on the URI and HTTP method of the web script, any arguments to be provided
    to the web script, the response format to be used for the web script, check whether
    any authentication is to be used for the web script or not, and check whether
    any backend processing is required with the repository or not, and then start
    with the implementation and first create the description document for the web
    script.


    A description document is the core of web script implementation, and it is basically
    an XML file. It describes the important details about a web script. Any developer
    taking a look at the description document can get an idea about what the web script
    does at a high level.'
  - '[PAGE 71]


    This is the first file that needs to be developed while creating a web script
    in Alfresco. There are certain mandatory declarations that must be provided in
    the web script description document for a web script. Apart from this, there are
    additional declarations that can optionally be provided for a web script. Let''s
    now take a look at the various declarations that can be provided in the description
    document. We will take a look at the options one by one, which will give you a
    clear understanding about how to create a description document, `helloworld.get.desc.xml`,
    from scratch for the hello world web script we created earlier.


    # Mandatory declarations


    Now let''s go through the elements that must be provided in the description document
    while creating a web script.


    # The `<webscript>` tag


    All the information about a web script is captured in the web script description
    document within the root element, `<webscript>`:


    ```

    ```xml

    <webscript>


    </webscript>

    ```

    ```


    If you do not specify the preceding root element tag and create a blank description
    document XML file, then while registering the web script, an error will appear
    in the log and you will not be able to register the web script.


    The following is the snippet of the error from the logs:


    ```

    ```text

    Unable to register script workspace://SpacesStore/app:company_home/app:dictionary/cm:extensionwebscripts/helloworld.get.desc.xml
    due to error:

    Failed to parse web script description document helloworld.get.desc.xml; Error
    on line -1 of document: Premature end of file. Nested exception: Premature end
    of file.

    ```

    ```


    # The `<shortname>` tag


    For any web scripts, a human-readable name of the web script is always given.
    It can be provided within the `<shortname>` tag as seen in the following code
    line. This tag does not have any attributes.


    ```

    ```xml

    <shortname>Hello World</shortname>

    ```

    ```'
