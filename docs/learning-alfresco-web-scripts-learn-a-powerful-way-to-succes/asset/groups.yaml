  - "[PAGE 77]\n\nAn example of the `family` tag is as follows:\n\n```\n<family>CMIS</family>\n\
    ```\n\nWhen you access the http://localhost:8080/alfresco/service/index page,\
    \ you should find an option to browse the web scripts based on family. For example,\
    \ you will find a link **Browse 'CMIS' Web Scripts** to take a look at all the\
    \ web scripts categorized to be of the CMIS family.\n\n# <cache>\n\nCaching is\
    \ a very good feature that helps to avoid regenerating a response for each request.\
    \ The web script framework in Alfresco uses the caching mechanism defined by HTTP.\
    \ For a web script, the required level of caching can be provided using this optional\
    \ element. When a web script is invoked, the web script framework translates the\
    \ declaration of this element to an appropriate response header to manage the\
    \ cache. The cache tag with its child elements will appear in the description\
    \ document as follows:.\n\n```\n<cache>\n    <never>false</never>\n    <public>true</public>\n\
    \    <mustrevalidate/>\n</cache>\n```\n\nThe different optional child elements\
    \ of this tag are explained in the subsequent sections.\n\n# never\n\nThis indicates\
    \ whether a web script response should be cached or not. The default value is\
    \ `true`, which means that a web script response will never be cached. An alternate\
    \ value is `false` to specify allowing of caching of a web script response.\n\n\
    # public\n\nThis is used to specify whether the authenticated web script response\
    \ should be cached in a public cache or not. The `true` value indicates that the\
    \ web script response can be cached, while `false` indicates the web script response\
    \ can not be cached. The default value is `false`.\n\n# mustrevalidate\n\nThis\
    \ is used to indicate whether a cache should revalidate its version of the web\
    \ script response in order to provide the fresh response data. The `true` value\
    \ indicates that there must always be a validation, while `false` indicates there\
    \ might be a validation. The default value is always `true`."
  - '[PAGE 78]


    # <negotiate>


    For the specific web script response format, the accept header MIME type can be
    provided using this optional element. There can be multiple entries of this element
    in the description document. It is mandatory to provide the value for this tag.
    The value will hold the type of response format. Also, it is mandatory to provide
    the accept attribute that mentions the MIME type.


    ```

    ```xml

    <negotiate accept="text/html">html</negotiate>

    <negotiate accept="text/xml">xml</negotiate>

    ```

    ```


    With the definition of one negotiate element in the description document, content
    negotiation is enabled.


    > It is interesting to understand how the negotiate and format elements are correlated.
    Each web script returns result in a response stream and it might be encoded based
    on the MIME type. If during invoking a web script, any hint is not provided on
    the MIME type, then the web script framework will use its predefined encoding.
    While invoking a web script, it is possible to provide the hint to let the script
    framework know about the MIME type for response. Using the format element, as
    a URL extension or as a format argument, the response format can be specified,
    which is mapped to a MIME type in the web script framework. Another option is
    to specify the Accept header, which can be done using the negotiate element.


    # <lifecycle>


    The lifecycle element is to describe the lifecycle stage of a web script. This
    element can be specified in the description document as follows:


    ```

    ```xml

    <lifecycle>sample</lifecycle>

    ```

    ```


    Web scripts in their development lifecycle can initially be in draft state, then
    are fully used in the production mode, and at the end are deprecated when they
    are not used anymore. These stages can be specified for web scripts using this
    element. Different possible values for this element are shown in the subsequent
    sections.


    # none


    This indicates that the web script is not part of any lifecycle.


    # sample


    This mentions that the web script is a sample web script and should not be used
    for production use.'
  - '[PAGE 79]


    # draft


    This specifies that the web script is still in the experimental stage and not
    yet fully completed.


    # public_api


    This determines that the web script is part of the Alfresco public API, and hence,
    it is fully tested and must be stable.


    # draft_public_api


    This mentions that it is going to be a part of the Alfresco public API but it
    is not yet fully complete or still some changes are in progress.


    # deprecated


    This indicates the web script is deprecated and should not be used and that this
    web script may be removed from the future Alfresco versions.


    # internal


    This mentions that the web script is for Alfresco internal use only. Hence, for
    different versions, it could have been changed as per the Alfresco internal usage,
    and it''s a possibility that it can be changed in future versions of Alfresco.


    > The <lifecycle> element is an optional one. Generally, for the custom web scripts
    that you will develop for your project, it is not mandatory to specify the lifecycle
    value for a web script. Hence, you might not be using this element.


    # <formdata>


    In the description document of a web script, you can specify the formdata tag
    as follows:


    ```

    <formdata multipart-processing="false" />

    ```


    It has an attribute called multipart-processing. This can be used to specify whether
    multipart form data processing is turned on or off for the web script. Optional
    values are true, which indicates that multipart processing for form data is turned
    on and false, which indicates that it is off. The default value is true.'
