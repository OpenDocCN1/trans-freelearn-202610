    # Folder creation under company home


    Now, create a folder under the company home. As we saw earlier that companyhome
    is available as a root object, we can directly use it. It''s of the type ScriptNode.
    So, we can invoke the methods available in the ScriptNode API to create the folder.
    The CreateFolder() method returns a ScriptNode object; set this object in the
    model and use it in the response template to get the noderef value from it using
    the TemplateNode API.


    Inside the JavaScript controller, you will have the following lines:


    ```

    var folderName = args.foldername;

    model.foldernode = companyhome.createFolder(folderName);

    ```


    In the response template, you will be using the following code:


    ```

    ${foldernode.nodeRef}

    ```


    Let''s discuss what we have just done. We used the args and companyhome root objects
    inside the JavaScript controller to read explicit arguments and create a folder
    respectively. All the available methods from the ScriptNode class can be used
    with the companyhome object.


    Now, we will take a look at some other functionalities as well in order to understand
    the usage of root objects and JavaScript APIs. We will also take a look at the
    relevant JavaScript code to achieve the mentioned functionality.


    # Finding a node


    In the preceding example, the web script returned nodeid in the response. It was
    the nodeid of the folder that was created in the web script. Now, you are interested
    in using the nodeid returned by the first web script as an input to some other
    web script. In another web script, you need to pass nodeid as the argument, and
    on that node, you need to perform some functionalities such as determining whether
    a user has permission on the node or not, getting the path to the node, getting
    some property of a node, modifying some property on a node, checking whether some
    aspect is applied on a node or not, creating content in it, invoking an action,
    and so on. Before proceeding with any such operations, as the first thing, we
    need to find out the actual node from the repository based on the nodeid provided.
    This can be done using the findNode() method accessed by the search root object
    as follows:


    ```

    var node = search.findNode("workspace://SpacesStore/" + args.nodeid);

    ```'
