  mdcn: "\n\n![](img/f02f759059b86af67e38b543d498a0d8_0_0.png)\n\n社区经验精粹\n\n## 学习\
    \ Alfresco Web 脚本\n\n学习一种强大的方式，利用 Alfresco 成功实现独特的集成解决方案\n\n![](img/f02f759059b86af67e38b543d498a0d8_0_1.png)\n\
