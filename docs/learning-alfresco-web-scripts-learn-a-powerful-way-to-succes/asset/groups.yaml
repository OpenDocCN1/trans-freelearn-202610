    # # Custom implementation of the web script runtime


    Let''s first briefly understand the role of the web script runtime in the web
    script framework. During the web script execution flow, once the request dispatcher
    sends the request, the web script runtime will delegate the request to the web
    script container for further processing in order to execute the web script. There
    are different implementations available for the web script runtime such as servlet
    runtime, portlet runtime, JSF runtime, Facebook runtime, and SURF web framework
    runtime. As a developer, you must be interested in knowing what needs to be done
    if a new implementation for the web script runtime is to be implemented. Let''s
    take a look at it here.


    In order to understand how to create a customized implementation of the web script
    runtime in the web script framework, first let''s take a look at the service provider
    interface provided by the web script framework, which opens up the possibilities
    to create custom implementation. If you take a look at the implementation inside
    `spring-webscripts-*.jar`, there is an interface defined, `org.springframework.extensions.webscripts.Runtime`,
    which declares the required methods to be implemented by any web script runtime.
    In order to make a simplified implementation, there is an abstract class implementation,
    `org.springframework.extensions.webscripts.AbstractRuntime`, which implements
    the `org.springframework.extensions.webscripts.Runtime` interface. This provides
    the implementation for the methods defined in the interface in a way that any
    runtime in the web script framework should be able to serve a web script request
    in a generic way. The AbstractRuntime class leaves some of the methods as abstract
    leaving the child class to provide the implementation for the abstract methods
    in order to make a generic implementation for the web script runtime. If you take
    a look at all the existing web script runtimes available in the web script framework,
    such as WebScriptServletRuntime and JSFRuntime, you can see that they extend from
    the AbstractRuntime class. These classes provide the implementation of the required
    abstract methods from the AbstractRuntime class.


    Having an overall understanding about the service provider interface and its implementation
    in the out-of-the-box web script framework in Alfresco, let''s try to understand
    how we can use this knowledge to create a custom implementation of the web script
    runtime. We are going to take a look at the high level steps required to create
    a custom web script runtime.'
