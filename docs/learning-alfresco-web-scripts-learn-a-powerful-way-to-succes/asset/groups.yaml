    You must have some questions like what if the web script is deployed using both
    the repository and filesystem deployment options, or what will happen if a web
    script is deployed at more than one location, then which location would take precedence?

    The answer to this is simple. Web scripts will be searched based on the order
    they have been displayed under the bean definition for SearchPath. This means
    that first it would search under the repository locations in sequence and then
    in the filesystem location in sequence.


    # Choosing the deployment option


    Choosing the repository option or filesystem option for web script deployment
    can be decided based on a number of parameters, such as the number of web scripts
    to be developed for your project, whether frequent changes to the web scripts
    are required or not, whether the team members are given access to the server machines
    where Alfresco is installed, and whether you are looking to manage the code for
    web scripts as a part of your source control tree or not.


    If a large number of web scripts are to be developed, then you should choose the
    filesystem deployment option and manage them as a part of your source control
    tree. The advantage of doing this will be that you can easily deploy web scripts
    that are building your business solutions along with your other customized extension
    code using the same build and deployment tool you used for customized extensions.
    There is no overhead of uploading web script files in the repository. You must
    also ensure that you have access to the server where Alfresco is installed; otherwise,
    you could be in trouble when you want to deploy and test the fixes you made to
    the web script and the fix quickly needs to be deployed on the live production
    system.


    While using the repository option for deployment, web script files are present
    in the repository similar to other content. If you need to do some modification
    to your web scripts, then it can be easily done by editing the relevant file.
    Hence, web scripts can be easily edited when required. The good thing about this
    approach is that you do not need to have access to the server where Alfresco is
    installed. You just need to be able to access the repository through the user
    interface. In a scenario where some quick fixes are to be deployed to fix some
    critical issues, you can implement a JavaScript-based web script and deploy your
    web script using the repository option.'
  - '[PAGE 136]


    # Debugging web scripts


    You have completed the development of your web scripts, deployed them successfully,
    and even registered your web scripts to the web script engine. Now, while testing
    the web script functionalities, you found that the logic you have included in
