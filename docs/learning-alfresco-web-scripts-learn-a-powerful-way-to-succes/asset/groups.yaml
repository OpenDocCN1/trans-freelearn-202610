  - '[PAGE 21]


    # Preface


    The first thought that came to my mind when I got the opportunity to write this
    book was whether I will be able to take this up or not, as implementing web scripts
    in projects is completely different from writing a book on it. However, at the
    same time, I was curious and excited as well to write my first book. What I always
    believe is – if you think you can do it, then just go for it and give your best
    try to achieve it. Hence, I took this opportunity and started my new journey of
    writing my first book to share my knowledge, learning, and experience with you.


    To give you a brief account of the book, web scripts is one of the key features
    of Alfresco and is a must know for each and every developer working on Alfresco.
    It is really essential for a developer working on Alfresco to be familiar with
    the powerful web script framework and understand how to practically implement
    web scripts. In this book, you will get to learn all the basic details required
    to work with web scripts in Alfresco and get yourself competent with web script
    development for your projects to implement useful integration solutions with Alfresco.


    A few years back, I was also a beginner. Now, I have vast experience of using
    web scripts in different real-time business implementations. Based on my learning
    and experience from my journey as a beginner to my current level of expertise
    in regards to implementing web scripts, I have tried to provide the most useful
    information that will help a lot to new or experienced developers who are looking
    forward to exploring and learning about web scripts.


    I have attempted to share the knowledge and learning that I have gained throughout
    my experience working on Alfresco web scripts. I have tried to explain the key
    concepts about web scripts in a simple way and have used practical examples to
    understand how to implement web scripts. I have also gone deep into technical
    details where I felt it would be required to help you learn about the web script
    framework in a better way.'
  - '[PAGE 22]


    By the end of this book, you will be able to say that you are familiar with web
    scripts and are ready to take up new assignments to develop custom web scripts
    as you have gained the required knowledge to practically implement them in Alfresco.
    You will also be able to debug, troubleshoot, and fix the issues that you might
    come across while working on web scripts. Also, you will be able to share the
    core technical knowledge about the powerful web script framework with your colleagues.


    My journey of writing this book has reached its destination as the book is now
    available in your hand. Now, you are about to begin your journey of reading this
    book and learning about Alfresco web scripts. Hope you have a wonderful journey
    ahead!


    # What this book covers


    Chapter 1, Getting Familiar with Web Scripts, introduces you to web scripts by
    exploring answers to some of the basic questions about web scripts, which will
    give you a clear idea about how web scripts can be useful for implementing integration
    solutions with Alfresco.


    Chapter 2, It''s Time for the First Web Script, walks you through implementing
    your first web script in Alfresco, which will give you the knowledge required
    about the core fundamentals along with some key points to take care of when practically
    implementing web scripts in your projects.


    Chapter 3, Understanding the Web Script Framework, covers the powerful web script
    framework, which will make you well acquainted with the detailed technical knowledge
    of web script execution and the backbone pillars of the web script framework.


    Chapter 4, Building Blocks of Web Scripts, provides you complete details about
    all the components to build web scripts.


    Chapter 5, Invoking Web Scripts, describes the various ways you can execute a
    web script that will help you to choose the way to execute web scripts as required.


    Chapter 6, Creating Java-backed Web Scripts, helps you understand how to practically
    implement Java-backed web scripts through the implementation of a sample use case.


    Chapter 7, Understanding JavaScript-based Web Scripts in Detail, explains what
    you can do with JavaScript APIs in Alfresco web scripts and makes you aware about
    the different root objects to access these APIs and useful root objects exposed
    by the web script framework. It also takes you through some code examples for
    some of the common functionalities in JavaScript-based web scripts.'
