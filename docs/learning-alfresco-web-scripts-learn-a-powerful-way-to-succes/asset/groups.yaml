    exposing the JavaScript APIs we found from the Alfresco codebase.


    Next, we went through various other root objects provided by the web script framework
    in Alfresco. Later, we saw some code examples so you understand how to use root
    objects and the relevant JavaScript API inside the controller to do some generic
    operations on a node in Alfresco. At the end, you learned how to create a custom
    JavaScript extension to create your own root object and expose the relevant API
    method for the custom root object when the available JavaScript API does not meet
    your requirements. Overall, you have now got an understanding of how to develop
    a JavaScript controller using various JavaScript APIs to build up a web script
    controller as per your business requirements.


