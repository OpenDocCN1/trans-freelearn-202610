  - '[PAGE 112]


    # # DeclarativeWebScript versus AbstractWebScript


    The web script framework in Alfresco provides two different helper classes from
    which the Java-backed controller can be derived. It''s important to understand
    the difference between them.


    The first helper class is the one we used while developing the web script in this
    chapter, `org.springframework.extensions.webscripts.DeclarativeWebScript`. The
    second one is `org.springframework.extensions.webscripts.AbstractWebScript`.


    `DeclarativeWebScript` in turn only extends the `AbstractWebScript` class.


    If the Java-backed controller is derived from `DeclarativeWebScript`, then execution
    assistance is provided by the `DeclarativeWebScript` class. This helper class
    basically encapsulates the execution of the web script and checks if any controller
    written in JavaScript is associated with the web script or not. If any JavaScript
    controller is found for the web script, then this helper class will execute it.
    This class will locate the associated response template of the web script for
    the requested format and will pass the populated model object to the response
    template.


    For the controller extending `DeclarativeWebScript`, the controller logic for
    a web script should be provided in the `Map<String, Object> executeImpl(WebScriptRequest
    req, Status status, Cache cache)` method. Most of the time while developing a
    Java-backed web script, the controller will extend `DeclarativeWebScript` only.


    `AbstractWebScript` does not provide execution assistance in the way `DeclarativeWebScript`
    does. It gives full control over the entire execution process to the derived class
    and allows the extending class to decide how the output is to be rendered. One
    good example of this is the `DeclarativeWebScript` class itself. It extends the
    `AbstractWebScript` class and provides a mechanism to render the response using
    FTL templates. In a scenario like streaming the content, there won''t be any need
    for a response template; instead, the content itself needs to be rendered directly.
    In this case, the Java-backed controller class can extend from `AbstractWebScript`.'
  - '[PAGE 113]


    > If a web script has both a JavaScript-based controller and a Java-backed controller,
    then:

    > - If a Java-backed controller is derived from `DeclarativeWebScript`, then first
    the Java-backed controller will get executed and then the control would be passed
    to the JavaScript-backed controller prior to returning the model object to the
    response template.

    > - If the Java-backed controller is derived from `AbstractWebScript`, then, only
    the Java-backed controller will be executed. The JavaScript controller will not
    get executed.


    # Using controllers smartly


    It''s always suggested to use either a Java-backed controller or JavaScript-backed
    controller for a web script and both controllers should not be used together.
    However, let''s take a look at some scenarios where you can leverage using both
    the controllers for a web script and solve some critical issues.


    Consider a scenario where in a production system, you already have a web script
    that has a Java-backed controller extending `DeclarativeWebScript` and returns
    some output. Now, as a part of fixing a critical issue, there is a need to return
    additional information in the web script response and you did not have the option
    to restart the production server as server downtime could impact the customer
    business. In this scenario, you can write an additional JavaScript controller
    for your web script, set the additional information in the model object, and modify
    the response template to include the newly added information. Register the web
    script and web script should now return additional information as well along with
    the earlier output. Hence, we can say we have done a kind of chaining of the controller
    execution. Think of this as being similar to servlet chaining. This is the power
    of the web script framework in Alfresco that makes it easy to solve critical issues
    very effectively.


    Another scenario could be that you want to have a filter kind of functionality.
    Before executing the JavaScript-backed web script, you need to perform some business
    logic communication with the external application, and based on its output, you
    need to process the remaining part of the web script. Here, you can think of developing
    the Java controller extending `DeclarativeWebScript`. It''s easier to have spring
    services wired for a Java controller. Using this, make a call to the external
    application and set a model object. Now, in the JavaScript-based controller, based
    on the value of the model object available from Java controller, continue the
    processing. In this way, a servlet filter kind of functionality can be achieved
    for web scripts.'
