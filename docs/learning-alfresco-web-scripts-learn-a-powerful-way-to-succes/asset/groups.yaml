    in `spring-surf-*.jar`.


    ## Web Script Authenticator


    When interacting with any content repository, secure access to content is a must
    and is really essential. Alfresco also requires an authenticated access while
    accessing the content repository. The main task of the Web Script Authenticator
    is to authenticate web script requests.


