    # Mavenizing Web Scripts


    So far, in our exploration of Alfresco web scripts, we have gained an understanding
    of how to develop web scripts and deploy them. We did not use any project structure
    for the web scripts we developed in the previous chapters; also, we did not use
    any tool to build web scripts. We simply created the required files for the web
    script in an editor of our choice and then manually deployed web script files
    to the filesystem locations. It was feasible to do this as there were fewer web
    scripts and we were doing it to understand web scripts. However, consider a scenario
    where you have to develop a large number of web scripts for your project. In such
    a scenario, it would not be a suitable option to independently create web script
    files and deploy them manually. In this case, you definitely need to follow a
    project structure for the development of web scripts. Also, you need to have a
    mechanism for the deployment of web scripts so that you can deploy all the web
    scripts on the server easily and effectively without manually transferring the
    web script files.


    Now, you might have a few questions, such as how can I set up a project structure
    to develop web scripts? What kind of deployment artifacts can be used to deploy
    web scripts in Alfresco? What tool can be used to build the required deployment
    artifacts? What prerequisites should be considered and kept ready before using
    the tool? Do I need to have detailed knowledge about the tool? How will I proceed
    about it?


    Do not worry about all these questions. We are going to find solutions to them
    in this chapter.


    Let''s first briefly cover the answers to the previous questions. You should create
    a project using Alfresco Maven SDK that is basically a community project also
    supported by Alfresco, which provides a very easy-to-use approach to create extensions
    for Alfresco. You should use **Alfresco Module Package (AMP)** as the deployment
    artifact. An AMP is basically a ZIP file with a specific folder structure that
    includes all the required files you have developed for your alfresco project.
    Generally, an AMP file will be applied to the vanilla Alfresco WAR file using
    **module management tool** when deploying on the required server. You can use
    Apache Maven to build the AMP file as the required deployment artifact. Apache
    Maven is basically a build management tool that will understand the JAR dependencies
    of the project and will retrieve them.


    It is okay if you are not familiar with Maven and do not have knowledge about
    it. We are not going to explore Alfresco Maven SDK, AMP, and Maven in this chapter.
    We have already covered a basic overview of what they are and this is enough for
    now to get started. Our main goal in this chapter is to get a basic understanding
    of how you can use Alfresco Maven SDK to create a defined project structure, have
    the project available in Eclipse, and build the AMP as deployment artifact for
    your web scripts development and also how to apply AMP to out-of-the-box Alfresco
    WAR using Maven to test the functionalities.'
