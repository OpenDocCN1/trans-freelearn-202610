    \ example, in a scenario where you want to develop web scripts that need to return\
    \ large content as the response, a Java-backed web script implementation can be\
    \ developed for this scenario. The kind attribute allows you to provide a name\
    \ for this implementation. Now, for any web script you are developing that has\
    \ to render large amount of content, the kind attribute can be used in the description\
    \ document to explicitly mention that it should use the custom Java backend implementation\
    \ created.\n\nHere is an example of how the `kind` attribute is used in the out-of-the-box\
    \ Alfresco web script, `tomcat/webapps/alfresco/WEB-INF/classes/alfresco/templates/webscripts/org/alfresco/repository/thumbnail/thumbnail.get.desc.xml`,\
    \ inside your Alfresco installation directory. If you are using Alfresco Community\
    \ 5, the `thumbnail.get.desc.xml` file can be located under the `alfresco` package\
    \ in `alfresco-remote-api-*.jar`.\n\n```\n<webscript kind=\"org.alfresco.repository.content.stream\"\
    >\n```\n\n## Controller implementation – not mandatory!\n\nThe actual business\
    \ logic for a web script resides in the web script controller. The main functionalities\
    \ such as interacting with repository, for example, to query the repository, add\
    \ content, update content, delete content, and so on are part of the web script\
    \ controller implementation.\n\nThere are two types of controller implementations\
    \ possible to implement while creating web scripts in Alfresco:\n\n- The JavaScript-backed\
    \ controller\n- The Java-backed controller\n\n## The JavaScript-backed controller\n\
    \nJavaScript-backed controller is known as the web script controller script that\
    \ has the web script business logic implemented in a JavaScript file. Alfresco\
    \ provides a set of JavaScript APIs that can be used in the web script controller\
    \ to interact with the Alfresco backend repository. A JavaScript controller can\
    \ read the query string parameters of the web script URI, perform the required\
    \ repository operations, and populate the model object to render the response.\n\
    \nWe have already seen the basic implementation of JavaScript controller for our\
    \ hello world web script.\n\n## Understanding when to use the JavaScript controller\n\
    \nHere are a few generic points that explain when you should go for JavaScript\
    \ controller implementation for your web script:\n\n- When the repository operations\
    \ you are trying to perform can be easily done using the available Alfresco JavaScript\
    \ API, you might choose this controller\n\nBuilding Blocks of Web Scripts\n\n\
    - The JavaScript controller has an advantage that if you have developed a web\
    \ script that has a controller using the JavaScript implementation, you do not\
    \ need to restart the server to deploy and use your web script\n- No additional\
    \ tooling is required; you can simply use any editor to create the web script,\
    \ no compilation is required, and is easy to deploy in the repository\n\n## The\
    \ Java-backed controller\n\nThe Java-backed controller is another type of controller\
    \ implementation possible to implement for a web script that might have the complete\
    \ business logic processing implemented in Java.\n\nWhen you are implementing\
    \ a Java-backed controller, you will have access to all the content application\
    \ services available in Alfresco. Business logic implementation for a web script\
    \ can be provided in JavaScript- or Java-based controller; the only difference\
    \ is that Java-backed controller is implemented in Java and it has access to all\
    \ the available content application services in Alfresco.\n\n## Understanding\
    \ when to use a Java-backed controller\n\nLet's take a look at a few points about\
    \ when you should go for the Java-backed controller implementation for your web\
    \ script:\n\n- Generally, when the JavaScript controller cannot do the repository\
    \ operations you want to do using the available Alfresco JavaScript API, you should\
    \ implement the Java-backed controller.\n- When you want to override the rendering\
    \ of a response, for example, rendering large content in response, you should\
    \ use this controller.\n- Consider that you will require experience in Java programming.\
    \ You will also require compilation of the Java code, classpath deployment of\
    \ web scripts, and even server restart in order to use Java-backed web script.\
    \ If all of this looks fine to achieve your business functionality in time, then\
    \ you can go for implementing Java-backed controller.\n\n> A web script can also\
    \ have both JavaScript- and Java-backed controllers. In such a scenario, the Java-backed\
    \ controller will first get executed and then JavaScript-based implementation\
    \ gets executed when the web script is invoked.\n\n## Response templates – yes,\
    \ they are required!\n\nResponse templates are basically used to render the web\
    \ script response. In MVC terms, response templates play a role of views. The\
    \ output of the web script is rendered in the required formats using the web script\
    \ response templates.\n\nIt is possible to have multiple response templates for\
    \ a web script, and based on the requested response content type while invoking\
    \ a web script, a response can be rendered using the appropriate response template.\n\
    \nResponse template also has access to web script query string parameters along\
    \ with the data items provided by the controller script and access to some common\
    \ content repository entry points.\n\nWe have already seen rendering response\
    \ for our hello world web script.\n\n> For JavaScript-based web scripts, response\
    \ templates are always required. There are certain implementations of Java-backed\
    \ web scripts where response can be directly rendered from the Java controller.\
    \ In such case, there is no need to specify response template for the web script.\
    \ We are going to cover Java-backed web scripts in detail in Chapter 6, Creating\
    \ Java-backed Web Scripts.\n\n## I18N for a web script – it's optional\n\nInternationalization\
    \ is a cool feature that can be very useful while creating web scripts.\n\nThere\
    \ may be times when you are required to develop a web script that will directly\
    \ be used by the end users, and hence, you need a human-readable web script response\
    \ in the user's language. No worries, it is possible to provide I18N support to\
    \ the web scripts in Alfresco, and hence, you can have the text in the response\
    \ rendered in the preferred supported user languages.\n\nWe will also extend our\
    \ hello world web script to have internationalization support and will get understanding\
    \ of how to make a web script render a response using internationalization.\n\n\
    There are two things to be done in order to achieve this:\n\n- Creating a resource\
    \ bundle for different languages\n- Modifying the response template to use the\
    \ labels from the resource bundle\n\n## Adding a resource bundle for the hello\
    \ world web script\n\nIn order to add a resource bundle for a web script, the\
    \ first thing we need to do is create a resource bundle for the different languages.\n\
    \nAfter logging in to Alfresco Share, create `helloworld.get.properties` at the\
    \ **Repository | Data Dictionary | Web Scripts Extensions** location, and add\
    \ the following content to it:\n\n```\ngreeting.title=Hello!\nemail.title=email\
    \ address\n```\n\nNow, at the same location, create `helloworld.get_de.properties`\
    \ and add the following content to it:\n\n```\ngreeting.title=Hallo!\nemail.title=E-Mail-Adresse\n\
    ```\n\nWe have just created two properties files and made the text able to be\
    \ rendered in the web script response in two different languages: English and\
    \ German.\n\n## Modifying the response template to use labels\n\nNow, in order\
    \ to use the labels added in the resource bundle, we will have to modify the response\
    \ template. Perform the following steps to modify the response template for the\
    \ hello world web script:\n\n- 1. Modify `helloworld.get.html.ftl` available at\
    \ the **Repository | Data Dictionary | Web Scripts Extensions** location as follows:\n\
    \n```\n<html>\n  <body>\n    <p>${msg(\"greeting.title\")} ${args.name}.</p>\n\
    \    <p>${msg(\"email.title\")}: ${email}</p>\n  </body>\n</html>\n```\n\nWe have\
    \ just modified our response template to use the text from the resource bundle.\n\
    \n- 2. Now, go to `http://localhost:8080/alfresco/service/index` and click on\
    \ the **Refresh Web Scripts** button.\n\n- 3. To test this, temporarily change\
    \ the preferred browser language to Germany de-DE and hit the `http://localhost:8080/alfresco/service/helloworld?name=Ramesh`\
    \ URL. You should see the response rendered using the labels rendered from German\
    \ properties file we created.\n"
