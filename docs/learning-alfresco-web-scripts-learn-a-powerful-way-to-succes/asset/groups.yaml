  - "[PAGE 85]\n\n# Configuration document – it's optional\n\nIt is possible to specify\
    \ configuration parameters for Alfresco web scripts. They can be accessed from\
    \ the controller as well as the response template. Just to understand the concept,\
    \ let's take a simple example where you want to display the server environment\
    \ (development, testing, staging, or production server) in your web script output.\
    \ One thing that you can do is specify the same in controller, but ideally, a\
    \ controller should not worry about such configurations. Instead, this can be\
    \ handled separately and the controller or template should just use the values.\
    \ With the web script configuration document, it is possible to do script specific\
    \ configuration.\n\nCreate helloworld.get.config.xml at the Repository | Data\
    \ Dictionary | Web Scripts Extensions location and add the following content to\
    \ it:\n\n```\n<properties>\n    <envname>Dev</envname>\n</properties>\n```\n\n\
    # Accessing configuration in a controller\n\nIn the JavaScript controller, the\
    \ envname property can be accessible as follows:\n\n```\nvar env = new XML(config.script);\n\
    logger.log(env.envname);\n```\n\nYou can set the value of envname property in\
    \ the model object and render the value on the response template.\n\n# Accessing\
    \ configuration in a template\n\nIn a scenario when no controller implementation\
    \ is available for the web script, the envname property can be accessed directly\
    \ in the response FreeMarker template as follows:\n\n```\n${config.script[\"properties\"\
    ][\"envname\"]}\n```\n\nWe have seen two different ways to display value from\
    \ the web script configuration. I am sure you can now easily test them in the\
    \ hello world web script and see the result."
