    ## Setting up your environment


    Before we start, it is important to understand that Alfresco Maven SDK is compatible
    with Alfresco Community Versions 4.2 and above, and Alfresco Enterprise Versions
    4.1.2 and above. It is interesting to know that, while using the Alfresco Maven
    SDK, you do not need to have Alfresco installed on your machine manually. The
    Alfresco Maven SDK will make the job easier for you and it will take care of downloading
    Alfresco on your machine based on the entries provided for version and groupId
    in the Project Object Model (POM) XML for your project.


    Now, let''s first make sure that we have the required prerequisites in place on
    our development machine before we begin creating a project using Alfresco Maven
    SDK:


    - You need to have JDK 1.7 installed on your machine and configured properly.
    **Java Development Kit (JDK)** is basically a development environment to build
    applications using the Java programming language. You can download this from `http://www.oracle.com/technetwork/java/javase/downloads/jdk7-downloads-1880260.html`.
