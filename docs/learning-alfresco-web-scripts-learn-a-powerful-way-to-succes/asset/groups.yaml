  - '[PAGE 74]


    # any


    In the description document, when any is specified as a value for the format tag,
    the response format can be specified using any of the previous methods mentioned.
    In a scenario where there is no format element specified in the description document,
    it would be considered the same as having the format value specified as any. The
    format tag that has its value as any will appear in the description document as
    follows:


    ```

    <format default="html">any</format>

    ```


    > When the response content type is not specified at all while invoking the web
    script, the default content type is taken using the default attribute of the format
    tag. If the default attribute is not set, then its default value is HTML. It is
    also possible for some web scripts to decide on the response content type at runtime.
    For them, specify the default attribute as blank, for example, default="".


    # <authentication>


    In order to securely access the web scripts, it is important to specify the level
    of authentication required for the web script. It can be defined using this optional
    tag declaration. It has an optional attribute: runas. The different possible values
    that can be specified for this element are explained in the subsequent sections.


    # none


    If you want to implement a web script that does not require authentication, you
    can specify the authentication tag in the description document of a web script
    as follows:


    ```

    <authentication>none</authentication>

    ```


    This is the default value when the authentication tag is also not specified in
    the description document. It indicates that there isn''t any authentication required
    to run the web script.


    > In a web script that has authentication specified as none, it will not be possible
    to interact with the repository.


    # guest


    You can specify the authentication tag using guest value as follows:


    ```

    <authentication>guest</authentication>

    ```'
  - '[PAGE 75]


    The previous line indicates that to run the web script, guest level authentication
    is required at the minimum.


    # user


    You can specify the authentication tag that has its value as user as follows:


    ```

    <authentication>user</authentication>

    ```


    This specifies that repository''s named user authentication is required at the
    minimum to run the web script.


    # admin


    You can specify the authentication tag that has its value as admin as follows:


    ```

    <authentication>admin</authentication>

    ```


    The previous line indicates that a repository''s admin user authentication is
    required to run the web script. An admin user is basically a user that belongs
    to the ALFRESCO_ADMINISTRATORS group.


    > It is also possible to specify to execute the web script as a specific Alfresco
    repository user irrespective of who initiated the web script. This can be specified
    using the runas attribute of authentication element, for example, runas="admin".

    > It is important to note that this attribute is only available for the web scripts
    placed in the Java classpath.


    # <transaction>


    It is also possible to specify the transaction level in order to execute the web
    script using this optional transaction element. This element has two optional
    attributes: allow and buffersize. The different possible valid values for this
    element are as in the subsequent sections:


    # none


    The transaction that has its value as none will appear in the description document
    as follows:


    ```

    <transaction>none</transaction>

    ```


    The previous line indicates that in order to run the web script, no transaction
    is required.'
