    \n在编写本书过程中已尽一切努力确保所呈现信息的准确性。但是，本书包含的信息按现状销售，不作任何明示或暗示的担保。作者、Packt Publishing 及其经销商和分销商均不对因本书直接或间接导致或声称导致的任何损害承担责任。\n\
    \nPackt Publishing 已努力通过适当使用大写字母来提供本书中提及的所有公司和产品的商标信息。但 Packt Publishing 无法保证这些信息的准确性。\n\
    \n首次出版：2014 年 11 月\n\n生产参考编号：1311014\n\n由 Packt Publishing Ltd. 出版，地址：Livery Place,\
    \ 35 Livery Street, Birmingham B3 2PB, UK.\n\nISBN 978-1-78439-060-0\n\nwww.packtpub.com\n\
    \n## 制作人员\n\n| 角色 | 人员 |\n|---|---|\n| 作者 | Ramesh Chauhan |\n| 项目协调员 | Kartik\
    \ Vedam |\n| 评审人员 | Snig Bhaumik, Dhaval Joshi, Bernd Krumböck, Piergiorgio Lucidi\
    \ |\n| 校对人员 | Simran Bhogal, Maria Gould, Ameesha Green, Paul Hindle |\n| 委托编辑\
    \ | Dipika Gaonkar |\n| 索引编制人员 | Mariammal Chettiyar, Rekha Nair, Tejal Soni |\n\
    | 策划编辑 | Kevin Colaco |\n| 制作协调员 | Arvindkumar Gupta |\n| 内容开发编辑 | Priyanka Shah\
    \ |\n| 封面设计 | Arvindkumar Gupta |\n| 技术编辑 | Nikhil Potdukhe |\n| 文字编辑 | Relin\
    \ Hedly, Deepa Nambiar |\n\n## 关于作者\n\n**Ramesh Chauhan** 目前在 CIGNEX Datamatics\
    \ 担任首席顾问。他拥有约 9 年的核心 IT 经验。他在 Alfresco 方面拥有深厚的专业技能，为全球客户在 Alfresco 中实施并交付了定制化业务解决方案，并在多个生产项目中广泛使用\
    \ Alfresco。他毕业于印度古吉拉特大学 Nirma 理工学院，获得信息技术工程学士学位。他还为 Alfresco 社区论坛做出贡献。\n\n## 致谢\n\
    \n我首先要感谢斯瓦米纳拉扬主和我的上师 H. H. Pramukh Swami Maharaj 的所有祝福。我要感谢我的父母给予我无条件的爱和支持。特别感谢我挚爱体贴的妻子\
    \ Priyanka Chauhan，她在本书写作过程中始终鼓励和支持我。非常感谢我一岁的女儿 Misri，她一直是我灵感的源泉。\n\n我要感谢 Packt\
    \ Publishing 给我这个机会。我要感谢所有技术评审人员提出的宝贵反馈，并感谢 Packt Publishing 团队的 Kevin Colaco、Priyanka\
    \ Shah 和 Nikhil Potdukhe。与整个 Packt Publishing 团队合作真的非常愉快。我衷心感谢内容开发编辑 Priyanka\
    \ Shah 和技术编辑 Nikhil Potdukhe，他们用宝贵的反馈帮助我修正了写作风格。\n\n我要感谢 CIGNEX Datamatics 的管理团队，鼓励我撰写本书，作为我们组织社区贡献的一部分。衷心感谢\
    \ Munwar Shariff 先生（CIGNEX Datamatics CTO）一直以来的支持。我也要感谢 CIGNEX Datamatics 的整个\
    \ Alfresco 实践团队，他们非常支持我。感谢 Aadit Majmudar 在本书写作过程中随时提供帮助。我要特别感谢 Dhaval Joshi，他是我在\
    \ CIGNEX Datamatics 的非常好的朋友和同事。每当我需要他的帮助和建议时，他总是陪在我身边。感谢他和我的朋友 Chirayu Joshi，他们相信我、支持我并激励我写这本书。\n\
    \n## 关于评审人员\n\n**Snig Bhaumik** 是 InfoAxon Technologies Limited（www.infoaxon.com）的技术总监，负责设计由开源技术支持的内容和知识管理解决方案。他在开源技术（如\
    \ Alfresco、Liferay、Pentaho 和 Microsoft .NET）方面拥有超过 13 年的丰富经验。\n\nSnig 的专业领域包括知识管理、协作式内容管理、业务流程自动化、社交网络、商业智能、搜索和新兴技术。他在许多项目中担任高级顾问，与高层利益相关者一起推动\
    \ BI、KM 和 ECM 议程。他是这些领域广受欢迎的演讲者，并定期以白皮书和博客的形式撰写文章。他的作品可以在 http://blog.infoaxon.com/、http://onalfresco.blogspot.in/\
    \ 和 https://github.com/SnigBhaumik/ 上查看。\n\n他在向全球客户提供开源驱动的解决方案方面拥有丰富的经验，涉及国际发展、社会住房、建筑、银行、零售和保险等领域。他是各种开源社区的活跃参与者，并为一些领先的开源平台贡献了功能。\n\
    \n作为开源爱好者，Snig 是多个开源社区的活跃贡献者：\n\n- 他撰写了 Packt Publishing 出版的 *Alfresco Cookbook\
    \ 3*（http://www.amazon.com/Alfresco-3-Cookbook-Snig-Bhaumik/dp/184951108X）\n-\
    \ 他领导了 Alfresco 和 InfoAxon 市场上 Alfresco 插件路线图的开发和管理（http://www.infoaxon.com/solutions/addons/#all）\n\
    - 他在 Alfresco 上发布的主要插件包括：\n  - Bootfresco (https://github.com/SnigBhaumik/Bootfresco)\n\
    \  - Calendar Event Participant (https://addons.alfresco.com/addons/calendar-event-participant)\n\
    \n**Bernd Krumböck** 是一名自雇 IT 专业人士。在过去 7 年里，他为 NGO/NPO Volkshilfe NÖ（一家在下奥地利州提供护理和其他服务、拥有约\
    \ 1,000 名员工的 NPO）实施并支持了许多项目。其中一个项目是基于 Alfresco 的文档管理系统，用于 ISO 标准化流程。因此，他成为了 Alfresco\
    \ Community 扩展的 Oracle Server 支持的新维护者。\n\n除此之外，他还致力于各种主要基于 Java/J2EE 的业务应用程序。此外，他的技能也用于服务器、数据库和网络管理。\n\
    \n几年前，他在奥地利 REWE Group 担任系统管理员。他的主要任务是管理 HP-UX、Linux 和 Oracle 数据库系统。在此期间，他为 CUPS\
    \ 和其他项目贡献了各种代码。\n\n在空闲时间，他从事各种扩展智能家居系统的小项目。其中一个项目为来自 8 devices 的 USB-CAN 适配器编写了一个\
    \ Linux 内核驱动程序（https://github.com/krumboeck/usb2can）。\n\n**Piergiorgio Lucidi**\
    \ 是开源企业内容管理（ECM）专家，也是 Sourcesense 的认证 Alfresco 培训师。Sourcesense 是一家欧洲开源系统集成商，围绕关键开源技术提供咨询、支持和服务。\n\
    \n他担任导师、技术负责人和软件工程师，在 ECM 和系统集成领域拥有 10 年经验。他是将 ECM 解决方案集成到 Web 和门户应用程序方面的专家。\n\
    \n他作为 Alfresco Wiki Gardener 定期为 Alfresco 社区做出贡献。在 2012 年柏林 Alfresco DevCon 期间，他被评为\
    \ Alfresco Community Star。\n\n他为 Apache 软件基金会做出贡献，担任 Apache ManifoldCF 的 PMC 成员和提交者，并且是\
    \ CMIS、Alfresco 和 Elasticsearch 连接器的项目负责人。他是 JBoss 社区的项目负责人和提交者。他还为 JBoss Portal\
    \ 平台的一些项目做出贡献。\n\n他是致力于 Java、Spring Framework、开源产品以及与 ECM 和 WCM 世界相关技术的各种会议的演讲者。\n\
    \n他是 Packt Publishing 的作者、技术评审人员和联盟合作伙伴。在 Packt Publishing，他与 Ugo Cei 合著了 *Alfresco\
    \ 3 Web Services*，与 Ken Finnigan 和 Luca Stancapiano 合著了 *GateIn Cookbook*。作为技术评审人员，他还为\
    \ *Alfresco 3 Cookbook*、*Alfresco Share* 和 *Alfresco 4 Enterprise Content Management\
    \ Implementation* 等书籍做出了贡献，这些书籍均由 Packt Publishing 出版。\n\n作为联盟合作伙伴，他还在自己的网站 Open4Dev（http://www.open4dev.com/）上撰写和发布书评。\n\
    \n> 我要感谢 Packt Publishing 又一次提供了为致力于 Alfresco 平台的项目做出贡献的好机会。\n\n"
