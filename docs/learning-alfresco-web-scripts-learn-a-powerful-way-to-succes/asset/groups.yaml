    脚本的描述文档中将默认格式指定为空值（例如 `<format default="">`），就会出现这个错误。


    > 如果你使用存储库选项部署基于 JavaScript 的 Web 脚本，请确保 Web 脚本已设置身份验证级别，并且不应将其设置为 none。


    > 当你希望在不使用模板的情况下自行控制并返回响应时，应该使用扩展 `AbstractWebScript` 类的基于 Java 的控制器。在这种情况下，在
    Web 脚本描述文档中将默认格式指定为空值不会导致上述错误。


    ## 无法定位模板的模板处理器


    对于你的 Web 脚本，你已经创建了描述文档、必需的控制器实现和必需的响应模板。但是，当你尝试执行 Web 脚本时，却收到了如下错误：**Cannot locate
    template processor for template example/contentlocation.get.xml**。


    看到这个错误，你首先会想：模板明明已经放好了，为什么还会出现这个错误？有时，要找出问题所在确实非常棘手。这里的情况也是如此。导致这个错误的原因是模板名称不符合
    Web 脚本的命名约定。它应该是 `contentlocation.get.xml.ftl`，而不是 `contentlocation.get.xml`。


    > 你必须始终确保遵循 Web 脚本的命名约定，并始终将 Web 脚本文件部署到正确的位置。如果你有基于 Java 的控制器，请确保其 bean ID 已按预期指定。


    ## 脚本 URL 不支持该方法


    简单来说，这个错误通常发生在你没有使用适当的方法调用 Web 脚本时。例如，当你有一个 POST Web 脚本，却用 GET 请求调用它时，就会看到“脚本
    URL 不支持该方法”（script URL does not support the method）的错误。为了避免这个错误，你应该始终使用适当的方法来调用
    Web 脚本。


    ## 在生产服务器上运行 Web 脚本


    生产服务器听起来很有趣，不是吗？是的，这是最重要的事情。在从事线上项目、为你的客户提供以 Alfresco 作为后端存储库的生产系统支持时，你可能需要根据业务需求编写不同的
    Web 脚本。由于生产服务器要处理的内容数量远多于开发服务器，这些脚本的执行时间可能会更长。例如，你可能需要编写一个修补脚本，为现有节点添加额外属性；或者可能需要编写一个
    Web 脚本，检索符合某些特定条件的记录。下面我们来看看在生产服务器上运行这类 Web 脚本时需要注意什么。


    ## 在后台运行 Web 脚本


    你编写的 Web 脚本在对大量内容执行时，可能需要更长的处理时间。在这种情况下，你不能从浏览器访问 Web 脚本并一直等待响应返回。对于这类需要在生产服务器上运行的
    Web 脚本，可以选择的一种方法是在后台运行 Web 脚本，并直接从服务器本身调用 Web 脚本，这样你就不必担心调用客户端与服务器断开连接。


    为了能够在后台运行 Web 脚本，一种方式是通过 shell 脚本调用 Web 脚本。然后，你可以在服务器上以后台方式运行该 shell 脚本。可以使用以下示例命令在后台运行
    shell 脚本：


    ```sh

    nohup execute-webscript.sh > webscript.log &

    ```


    该命令会在后台运行 `execute-webscript.sh`（这个 shell 脚本基本上就是用来调用你的 Web 脚本的），并将 shell 脚本的执行日志输出到
    `webscript.log` 文件中。你可能还想实现一个电子邮件通知功能，在 Web 脚本执行完成后触发一封电子邮件，这样你就不必频繁监控日志，而可以在
    Web 脚本执行完成后收到通知。


    现在，你需要备份 Web 脚本的模板。例如，将描述文件和响应模板重命名为 `*.bak`。然后，访问 http://localhost:8080/alfresco/service/index
    刷新 Web 脚本。此时，该 Web 脚本即被禁用，你将无法再访问它。


    ## 小结


    在本章中，我们了解了 Alfresco 中 Web 脚本可能的部署选项，并理解了 Alfresco 的 Web 脚本框架在多个位置部署时如何决定 Web 脚本的优先级。我们还了解了一些有助于你按需选择部署选项的因素。我们还了解了如何调试
    Web 脚本，以找出 Web 脚本出了什么问题。我们还介绍了一些处理 Web 脚本时可能遇到的常见问题的故障排除要点。最后，我们还介绍了一些在生产服务器上运行
    Web 脚本时可能有用的提示和技巧。总的来说，现在你已经很好地理解了如何在 Alfresco 中部署和调试 Web 脚本；下次需要在生产服务器上运行 Web
    脚本时，你也可以与其他开发人员或项目经理分享一些想法，说明如何实现在生产服务器上执行 Web 脚本。


    现在，当你需要开发大量 Web 脚本时，由于你将在一个团队中工作，如果没有项目结构，就无法完成开发；而且最终所有代码都应放在源代码控制树中。建立用于开发 Web
    脚本的开发项目非常重要。在下一章中，我们将了解如何在 Eclipse 中建立一个可以使用 Maven 构建的开发项目。


    ## Maven 化 Web 脚本


    在本章中，我们将介绍以下主题：


    - 使用 Maven 搭建开发环境

    - 使用 Alfresco Maven SDK 创建默认项目结构

    - 使用 Maven 构建 **Alfresco 模块包（AMP）**

    - 在 Eclipse 中搭建开发环境

    - 理解默认项目结构

    - 扩展默认项目结构以创建 Web 脚本

    - 使用 Maven 将 AMP 应用到 Alfresco WAR，以便在本地测试开发的 Web 脚本

    - 在 Alfresco 企业版中使用 Maven 需要了解的事项


    ## Maven 化 Web 脚本


    到目前为止，在探索 Alfresco Web 脚本的过程中，我们已经了解了如何开发和部署 Web 脚本。在前几章中，我们没有为开发的 Web 脚本使用任何项目结构，也没有使用任何工具来构建
    Web 脚本。我们只是在自己选择的编辑器中创建 Web 脚本所需的文件，然后手动将 Web 脚本文件部署到文件系统中的相应位置。由于 Web 脚本数量较少，而且我们只是为了理解
    Web 脚本才这样做，所以这种方法是可行的。


    但是，请考虑这样一种场景：你必须为项目开发大量 Web 脚本。在这种情况下，单独创建 Web 脚本文件并手动部署就不是合适的选择。此时，你绝对需要遵循一种项目结构来开发
    Web 脚本。此外，你还需要一种 Web 脚本部署机制，这样无需手动传输 Web 脚本文件，就能轻松有效地将所有 Web 脚本部署到服务器上。


    现在，你可能会有几个问题，例如：如何建立项目结构来开发 Web 脚本？可以使用哪种部署工件（deployment artifact）在 Alfresco 中部署
    Web 脚本？可以使用什么工具来构建所需的部署工件？在使用该工具之前，需要考虑并准备好哪些先决条件？我是否需要详细了解该工具？我该如何着手？


    不用担心这些问题。我们将在本章中找到解决方案。


    首先，我们简要回答一下前面的问题。你应该使用 Alfresco Maven SDK 创建项目。它本质上是一个社区项目，同时得到 Alfresco 的支持，提供了一种非常易用的方式来为
    Alfresco 创建扩展。你应该使用 **Alfresco 模块包（AMP）** 作为部署工件。AMP 本质上是一个 ZIP 文件，具有特定的文件夹结构，其中包含你为
    Alfresco 项目开发的所有必需文件。通常，在目标服务器上部署时，会使用 **模块管理工具** 将 AMP 文件应用到原版 Alfresco WAR 文件中。你可以使用
    Apache Maven 来构建 AMP 文件，将其作为所需的部署工件。Apache Maven 本质上是一个构建管理工具，它能够理解项目的 JAR 依赖项并检索它们。


    如果你不熟悉 Maven，或者对 Maven 没有了解，也没关系。本章不会深入探讨 Alfresco Maven SDK、AMP 和 Maven。我们之前已经对它们是什么做了基本介绍，目前这些已经足够让你开始使用了。本章的主要目标是让你基本了解如何使用
    Alfresco Maven SDK 创建定义好的项目结构、让项目可在 Eclipse 中使用、构建 AMP 作为 Web 脚本开发的部署工件，以及如何使用
    Maven 将 AMP 应用到开箱即用的 Alfresco WAR 中以测试功能。


    '
