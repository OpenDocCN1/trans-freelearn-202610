    +   1. Create a context file and add the following bean entry to it:\n+   \n+\
    \   ```xml\n+   <bean id=\"customAdmin\" parent=\"baseJavaScriptExtension\"\n\
    +         class=\"com.example.CustomAdminAPI\">\n+       <property name=\"extensionName\"\
    >\n+           <value>customauth</value>\n+       </property>\n+   </bean>\n+\
    \   ```\n\n+   2. Create a Java class `com.example.CustomAdminAPI`, which will\
    \ extend the `org.alfresco.repo.processor.BaseProcessorExtension` class and declare\
    \ the variable as follows:\n+   \n+   ```java\n+   net.sf.acegisecurity.Authentication\
    \ auth;\n+   ```\n\n+   3. Implement three public methods inside this class. The\
    \ first method is to save current user's authentication, the second method is\
    \ to run as a system user, and the third method is to clear the security context\
    \ and set back the original user's authentication. The following is the code snippet\
    \ for the three methods we just discussed:\n\n```\n```java\npublic void saveCurrentUserAuthentication()\
    \ {\n    auth = AuthenticationUtil.getFullAuthentication();\n}\n\npublic void\
    \ executeAsSystemUser() {\n    AuthenticationUtil.setRunAsUserSystem();\n    AuthenticationUtil.setFullyAuthenticatedUser(AuthenticationUtil.\n\
    \    SYSTEM_USER_NAME);\n}\n\npublic void setBackOriginalUserAuthentication()\
    \ {\n    AuthenticationUtil.clearCurrentSecurityContext();\n    AuthenticationUtil.setFullAuthentication(this.auth);\n\
    }\n```\n```\n\n+   4. Now, deploy the files and restart the server."
