    脚本在需要时可以轻松编辑。这种方法的优点是你不需要访问安装了 Alfresco 的服务器。你只需要能够通过用户界面访问存储库。在需要部署一些快速修复以解决一些关键问题的情况下，你可以实现基于
    JavaScript 的 Web 脚本，并使用存储库选项部署你的 Web 脚本。


    ## 调试 Web 脚本


    你已经完成了 Web 脚本的开发，成功部署了它们，甚至将你的 Web 脚本注册到 Web 脚本引擎。现在，在测试 Web 脚本功能时，你发现控制器中包含的逻辑没有按预期工作。因此，你的
    Web 脚本无法返回所需响应。接下来你想弄清楚出了什么问题以及为什么它们不能按应有的方式工作。现在是时候调试以识别问题，从而为你提供修复问题的线索。我们现在来看看如何启用日志记录，如何在服务器上进行远程调试，以及一些有用的调试技术。


    ### 启用日志记录


    启用日志记录功能在调试问题时将非常有帮助。让我们了解如何在基于 Java 和基于 JavaScript 的 Web 脚本情况下使用日志记录。你应该记住的最重要的文件是
    log4j.properties 文件，它位于你的 Alfresco 安装目录中的 tomcat\webapps\alfresco\WEB-INF\classes
    位置。


    对于调试基于 Java 的 Web 脚本，我们需要执行以下步骤：


    - 1. 你可以选择在控制器 Java 实现中添加 org.apache.log4j.Logger 语句。

    - 2. 然后，你需要在 log4j.properties 文件中添加你的 Java 类的条目。

    - 3. 例如，你的 Web 脚本的 Java 类为 com.example.TestWebScript。在向 Java 控制器类添加适当的记录器语句后，你应该在
    log4j.properties 文件中为 Java 控制器添加条目 log4j.logger.com.example.TestWebScript=debug。

    - 4. 重启服务器，然后访问你的 Web 脚本；你应该能够在 catalina 日志中看到来自 Web 脚本 Java 控制器的记录器语句。


    对于调试基于 JavaScript 的 Web 脚本，你将需要利用 logger 根对象，如下所示：


    - 1. 你应该使用 logger.log 方法在 JavaScript 控制器中添加所需的记录器语句，以便在查看日志时获得足够的详细信息。

    - 2. 要启用对基于 JavaScript 的 Web 脚本的日志，你应该在 log4j.properties 中设置 log4j.logger.org.alfresco.repo.jscript
    为 debug，并且 log4j.logger.org.alfresco.repo.jscript.ScriptLogger 也为 debug。

    - 3. 重启服务器，然后访问你的 Web 脚本；你应该能够在 catalina 日志中看到来自 JavaScript 控制器的记录器语句。


    ### 服务器上的远程调试


    有时，仅使用记录器语句可能不足以识别问题，你可能还想逐步执行代码以找到问题。在这种情况下，你需要对部署在服务器上的代码进行远程调试。


    为了能够远程调试基于 Java 的 Web 脚本，你应该首先在 Windows 中的 catalina.bat 文件和 Linux 中的 catalina.sh
    中设置以下条目：


    ```

    set DEBUG_OPTS=-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=8888

    ```


    然后，重启服务器。这将使你能够从你的 IDE 例如 Eclipse 远程调试 Web 脚本的 Java 代码。


    要调试基于 JavaScript 控制器的服务器端 JavaScript，你可以使用 Alfresco JavaScript 调试器。你可以通过以下两种方式启用调试器：


    - 1. 在 log4j.properties 文件中，设置 log4j.logger.org.alfresco.repo.web.scripts.AlfrescoRhinoScriptDebugger
    为 on。这将在服务器启动时显示调试器 UI。另请设置 log4j.logger.org.alfresco.repo.jscript.ScriptLogger=debug。

    - 2. 访问调试器 Web 脚本 URL，http://localhost:8080/alfresco/service/api/javascript/debugger。它将在屏幕上显示启用按钮。点击它以打开
    Alfresco JavaScript 调试器 UI。


    使用此调试器调试 JavaScript 控制器代码非常容易。


    你只需通过 File | Open 打开控制器文件，并为其添加调试点。现在，访问你想要调试的 Web 脚本。


    控制将进入调试器，你现在可以调试代码。调试时有 Step Into、Step Over 或 Step Out 等选项会很有帮助。此外，你还可以监视调试时变量的值。


    ## 部署、调试和故障排除 Web 脚本


    以下是供你参考的 Alfresco JavaScript 调试器用户界面的屏幕截图。要调试 share Web 脚本，只需将之前的 URL 中的 alfresco
    替换为 share 即可。


    ![](img/f02f759059b86af67e38b543d498a0d8_138_0.png)


    Alfresco JavaScript Debugger UI


    Alfresco JavaScript 调试器可以在 Alfresco 作为服务运行时或从控制台运行时访问。要使用它，你需要确保你没有在无头服务器上运行，否则它将不会显示调试器
    UI。此外，当 Alfresco 作为服务运行时，你在使用调试器 UI 时可能会遇到问题。一般来说，你应该在通过控制台启动 Alfresco 服务器后使用调试器
    UI，而不是让 Alfresco 服务器作为服务启动。这将节省你大量时间，让你专注于调试与 Web 脚本相关的问题，而不是调试当服务器作为服务启动时调试器
    UI 的问题。


    ### 其他调试技术


    让我们看看一些可能非常有用的其他调试技术：


    - - 当你的 Web 脚本无法工作时，你还应该检查它是否已正确注册到 Alfresco Web 脚本引擎。你可以访问 `http://localhost:8080/alfresco/service/index`
    并从可用的各种浏览 Web 脚本的选项中定位你的 Web 脚本，例如按包或按 URI 浏览所有内容。点击它后，它将显示描述符、JavaScript 控制器和响应模板。你可以确保
    JavaScript 控制器包含你为修复问题而添加的所有修复或修改。

    - - 在你的 Web 脚本中，当你处理节点的某些属性、节点的权限等时，你也可以从 `nodebrowser` 获得帮助。使用 `noderef`，你可以查明节点上设置的属性、其子节点、应用在其上的方面、与其他节点的关联以及节点的权限等详细信息，这在为你的问题修复进行调试时也可能对你有用。你还可以使用
    `nodebrowser` 中提供的其他功能，例如执行 lucene 查询的能力，这在你想要验证 Web 脚本控制器使用的 lucene 查询时也可能有所帮助。


    ## 故障排除指针


    在了解了在 Alfresco 中调试 Web 脚本的不同方法后，让我们看看在处理 Alfresco Web 脚本时可能会遇到的一些常见问题的故障排除指针。


    ### 一个有效的 SecureContext 错误


    你有时可能会遇到错误 **A valid SecureContext was not provided in the RequestContext**。出现此错误的原因可能有很多。一些原因如下：


    - - 当你在 Web 脚本描述文档中将身份验证设置为 `none`，并且在控制器中尝试调用需要身份验证的 Alfresco 的某些公共服务时，例如调用 `toDisplayPath()`
    方法，它将给出上述异常。

    - - 如果你的 Web 脚本具有基于 JavaScript 的控制器，并且你使用存储库选项部署了它，并且身份验证设置为 `none`，当你尝试访问你的 Web
    脚本时，你将收到上述异常。


    '
