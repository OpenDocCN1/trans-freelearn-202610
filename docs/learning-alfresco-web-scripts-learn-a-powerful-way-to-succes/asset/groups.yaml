    Eclipse。同时，我们也想了解默认项目结构中包含哪些文件和目录。


    ## 使用 Eclipse 设置开发环境


    在此阶段，由 Alfresco Maven SDK 提供的原型创建的项目结构已经就绪于文件系统中。下一步，我们希望能在 Eclipse 中获得相同的项目结构，以便在
    Eclipse IDE 中按照定义好的项目结构开始开发 Web 脚本。你可以根据所用操作系统，从 `http://www.eclipse.org/downloads/packages/`
    上提供的不同发行包中下载 Eclipse IDE。只需确保它支持 Maven 插件。


    > 在本章中，我们将使用 Luna 发行包中的 Eclipse Java EE IDE，它内置了 Maven 支持。你可能会使用其他版本的 Eclipse，因此需要确保如果它没有内置
    Maven 支持，则已为 Eclipse IDE 添加 Maven 插件。为 Eclipse IDE 添加 Maven 插件是一个简单的过程，你应该可以轻松完成。


    现在，要将默认项目结构导入 Eclipse，请执行以下步骤：


    1. 打开 Eclipse IDE。点击**文件 | 导入 | Maven | 现有 Maven 项目**，然后点击**下一步**。


    2. 在显示的屏幕中，导航到本地文件系统上的项目位置，然后点击“确定”。随后，它应该在项目的 pom.xml 前显示一个选中的复选框。然后，点击“完成”。


    ![](img/f02f759059b86af67e38b543d498a0d8_153_0.png)


    3. 在下一个屏幕上，将显示一个关于 Alfresco Maven 插件 set-version 的错误，如下面的截图所示。暂时忽略该错误，点击“完成”。


    ![](img/f02f759059b86af67e38b543d498a0d8_153_1.png)


    4. 随后会显示一个“不完整的 Maven 目标执行”弹出窗口，如下面的截图所示。点击“确定”。


    ![](img/f02f759059b86af67e38b543d498a0d8_154_0.png)


    5. 你可能会看到要求安装构建辅助插件的窗口。如果你愿意，可以继续，或直接点击“取消”。项目 example-repo 现在将出现在 Eclipse 中；但上面的红色标记表示存在一些错误。如果你查看“标记”（Markers）选项卡，就会看到前面忽略的与
    Maven 插件相关的错误。右键点击它，然后点击“快速修复”（Quick Fix）。选择“永久将 pom.xml 中的 set-version 目标标记为在
    Eclipse 构建中忽略”选项。它会显示一个选择 POM 位置的选项。选择 POM 位置并点击“确定”。


    6. 现在，右键点击 example-repo 项目。转到“Maven | 更新项目”，然后点击“确定”。项目现已成功导入，除了默认包中 Java 类的未使用导入警告消息外，没有错误。你可以忽略这些警告。


    > 首次在 Eclipse 中导入项目时，如果遇到任何与构建路径相关的错误，请确保像上一步那样更新项目，并确保所有 Maven 依赖项都已下载到本地机器上。


    现在，我们已将默认项目结构作为 Maven 项目导入 Eclipse IDE。


    ## 理解默认项目结构


    既然已经在 Eclipse 中导入了项目，现在让我们浏览一下项目结构，以了解其中重要的文件和目录：


    | 项目结构中的文件/目录 | 简要说明 |

    |---|---|

    | `pom.xml` | 对于任何 Maven 项目，pom.xml 都是必需的，以便让 Maven 了解项目依赖关系。pom.xml 文件直接位于项目目录下。如果你查看
    pom.xml，就会获得有关项目依赖关系、仓库信息和其他重要信息的所有详情。此外，在我们项目的 pom.xml 中，你应该能够看到我们使用 Maven 原型生成项目时提供的设置。如果你愿意，可以在此处更改这些设置，然后像之前那样更新项目。Maven
    随后会考虑这些更新并处理相应事宜。 |

    | `src/main/java` | 该目录将用于放置项目的 Java 源代码。你可以将 Java 类组织到此位置下合适的包中。你将为项目开发的 Web
    脚本的 Java 控制器应放置在此位置。除了 Web 脚本控制器之外，你还可以放置用于其他自定义（例如自定义操作等）的 Java 类。构建项目时，放置在此处的
    Java 类将包含在作为部署工件生成的 AMP 内的 JAR 文件中。当 AMP 应用到 Alfresco WAR 文件时，JAR 文件将部署到 WEB-INF/lib
    下。 |

    | `src/main/amp` | 所有与 AMP 相关的必要详情都位于此位置。module.properties 文件是 AMP 结构的重要文件。它包含有关
    AMP 文件的详细信息，例如 AMP 的 ID、版本、依赖项，以及运行它所需的 Alfresco 最低和最高版本。位置 src/main/amp/config/alfresco/module/example-repo
    是 AMP 的核心，将包含 Spring 配置上下文文件、内容模型文件等重要文件。你可以在 src/main/amp/config/alfresco 下创建
    extensions、messages 文件夹，以包含 Web 脚本组件文件。 |

    | `src/test` | 与单元测试用例相关的实现以及运行单元测试用例的配套配置将放置在此处。只需查看此位置下可用的默认文件夹，你就会了解默认文件夹内部包含什么。
    |


    ## 扩展默认项目以创建 Web 脚本


    在前几章开发 Web 脚本时，我们没有遵循任何项目结构，而是在我们选择的编辑器中独立开发 Web 脚本所需的文件，然后手动将它们部署到已安装的 Alfresco
    目录中的适当位置。现在，既然已经理解了项目结构和 AMP 部署包，是时候探索如何扩展默认项目结构来创建 Web 脚本了。在开发新的 Web 脚本时，让我们试着了解应该将
    Web 脚本相关文件放置在项目结构中的什么位置：


    -   Web 脚本描述符文件（\*.desc.xml）、Web 脚本的响应模板（\*.ftl）、Web 脚本的配置文档（\*.config.xml）和消息包（\*.properties）应放置在
    src/main/amp 位置下。在 src/main/amp/config/alfresco 中可用的默认结构内，创建一个新的文件夹结构 /extension/templates/webscripts，以存储你将创建的所有新
    Web 脚本。然后，你可以在此位置内将 Web 脚本分类到不同的包中，例如，所有与登录相关的自定义 Web 脚本及其描述符、响应模板、配置文档和消息包都可以放在
    src/main/amp/config/alfresco/extension/templates/webscripts/login 位置下。

    -   对于基于 JavaScript 的 Web 脚本，控制器实现（\*.js）也应与前面提到的其他文件一起放置在同一位置。

    -   对于 Java 后端的 Web 脚本，控制器实现（\*.java）应放置在 src/main/java 内合适的包结构下。

    -   对于 Java 后端的 Web 脚本，将控制器与 Web 脚本关联的 Spring 配置上下文文件应放置在 src/main/amp/config/alfresco/extension
    下。你也可以将来自 Java 控制器的 Spring bean 映射条目放在 src/main/amp/config/alfresco/module/proj-name
    下的 module-context.xml 文件中。


    > 一旦通过运行 Maven package 为项目生成 AMP，你应该能看到所有 Java 类都被放入一个 JAR 文件，而其他文件则按照我们在项目结构中的放置方式被适当地置于
    AMP 文件中。现在，你可以将这个 AMP 文件交给其他服务器进行部署。


    '
