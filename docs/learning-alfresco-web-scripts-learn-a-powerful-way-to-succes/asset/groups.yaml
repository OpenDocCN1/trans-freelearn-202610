    web 脚本，你首先需要将 AMP 应用到 Alfresco WAR 文件。使用 Alfresco Maven SDK，你无需在本地安装 Alfresco
    即可应用 AMP。从控制台进入项目的目录，然后只需执行 `mvn integration-test -Pamp-to-war` 命令即可。


    运行上述命令后，你会看到 Maven 正在下载所有必要的依赖项以编译项目。这将为项目创建 AMP 文件，将 AMP 文件应用到开箱即用的 Alfresco
    WAR，然后将 WAR 部署到嵌入式 Tomcat 服务器，最后启动服务器。你应该能从控制台输出中看到项目的 AMP 模块已成功生成并被 Alfresco
    服务器识别。


    你可以登录 Alfresco 服务器 `http://localhost:8080/alfresco`，并访问你所开发的 web 脚本的 web 脚本 URL。测试完成后，请确保关闭正在运行的服务器。你可以简单地在运行
    Maven integration 命令的控制台上按 `Ctrl + C` 来关闭服务器。


    > 如果在运行之前的 integration test 命令时遇到内存不足错误，你需要增加分配给 Alfresco 和 Tomcat 的内存大小。你可以通过为
    Maven 提供额外的 JVM 内存设置来做到这一点，例如增加 PermGen 大小。


    我们刚刚看到，在开发机器上之前未安装 Alfresco 的情况下，我们能够借助 Alfresco Maven SDK 非常轻松地测试我们的定制开发。我们所做的只是执行了一个命令，Maven
    为我们完成了所有必要的工作，使工作变得更容易，让我们可以更专注于开发，而不必担心在本地机器上下载和设置 Alfresco、生成 AMP 以及将其部署到 Alfresco
    WAR 等事情。


    ![](img/f02f759059b86af67e38b543d498a0d8_158_0.png)


    ## 摘要


    在本章中，我们对如何借助 Alfresco Maven SDK 提供的 Maven 支持，使你的 Alfresco web 脚本开发和部署体验变得简单有了基本的了解。首先，我们介绍了设置先决条件以使用
    Maven 设置开发环境。我们了解了如何创建默认的项目结构，以便创建 Alfresco 部署包 AMP，然后我们了解了如何为默认项目结构生成 AMP。之后，我们将项目导入
    Eclipse IDE 并设置开发环境，然后了解了默认项目结构中存在的各种文件和目录。


    我们随后研究了如何扩展默认项目结构以使用 JavaScript 和 Java 开发项目的 web 脚本。此外，我们还学习了如何使用 Maven 命令将 AMP
    应用到 Alfresco WAR，以便在本地机器上未安装 Alfresco 的情况下测试已开发的功能。最后，我们介绍了如何使用 Maven 与你的 Alfresco
    企业版一起使用。总的来说，你现在对使用 Maven 支持进行 Alfresco web 脚本开发有了基本的了解，可以开始着手。


    在下一章中，我们将研究如何扩展 Alfresco 中的 web 脚本框架。


    ## 10. 扩展 Web 脚本框架


    在本章中，我们将介绍：


    - 扩展 web 脚本运行时以创建自定义实现

    - Web 脚本容器的自定义实现

    - 向 web 脚本框架添加自己的身份验证器实现

    - 脚本处理器和模板处理器自定义实现

    - 自定义格式


    我们开始学习 Alfresco web 脚本的旅程，首先熟悉了 web 脚本。然后我们进行了一个动手练习，创建了 Alfresco 中的第一个 web 脚本，并深入了解了理解
    Alfresco 中 web 脚本框架的技术知识。之后，我们对 web 脚本的构建块以及调用 web 脚本的不同方式有了深入的了解。我们还了解了如何创建 Java
    支持的 web 脚本，然后详细探讨了基于 JavaScript 的 web 脚本。接下来，我们研究了 web 脚本的部署、调试和故障排除，然后学习了如何使用
    Maven 设置开发环境。到目前为止，你应该已经获得了在实际项目中实际实施和使用 Alfresco web 脚本所需的知识。此外，你应该能够调试、排除故障并修复项目中
    web 脚本的问题。现在，作为本书的最后一部分要学习的内容，是时候了解在 Alfresco 中扩展 web 脚本框架的可能性了。


    在开始之前，你可能希望复习一下我们在 *第 3 章、理解 Web 脚本框架* 中学到的 web 脚本框架的知识。简要总结一下，web 脚本框架的核心组件是
    web 脚本运行时、web 脚本容器和身份验证器。web 脚本容器的其他支持组件是脚本处理器注册表，用于注册脚本处理器；模板处理器注册表，用于注册模板处理器；以及格式注册表，用于注册新格式。我们已经了解了所有这些组件的开箱即用实现类。Alfresco
    中的 web 脚本框架非常强大，并且为 web 脚本框架的核心组件提供的开箱即用实现可以满足你与项目 web 脚本实现相关的所有需求。然而，为了了解 Alfresco
    中 web 脚本框架的强大之处，值得一看如何扩展 web 脚本框架的核心组件并为其添加自定义实现。一般情况下，你不需要对 web 脚本框架的组件做任何更改。然而，了解扩展
    web 脚本框架的可能性将帮助你在需要时拥有自定义实现。它还将让你熟悉开源实现的强大之处，它提供了在需要时添加自定义实现的灵活性。


    我们将研究如何在 Alfresco 中扩展 web 脚本框架，以实现 web 脚本运行时、web 脚本容器、身份验证器、脚本处理器和模板处理器的自定义实现，以及自定义格式。


    ### Web 脚本运行时的自定义实现


    让我们首先简要了解 web 脚本运行时在 web 脚本框架中的作用。在 web 脚本执行流程中，一旦请求调度程序发送请求，web 脚本运行时将请求委托给 web
    脚本容器以便进一步处理以执行 web 脚本。web 脚本运行时有不同的实现，例如 servlet 运行时、portlet 运行时、JSF 运行时、Facebook
    运行时和 SURF web 框架运行时。作为开发者，如果要实现新的 web 脚本运行时实现，你必须感兴趣地知道需要做什么。让我们在这里看一下。


    为了了解如何在 web 脚本框架中创建 web 脚本运行时的自定义实现，首先让我们看一下 web 脚本框架提供的服务提供者接口，它提供了创建自定义实现的可能性。如果你查看
    `spring-webscripts-*.jar` 内部的实现，会有一个接口定义，`org.springframework.extensions.webscripts.Runtime`，它声明了任何
    web 脚本运行时必须实现的方法。为了简化实现，有一个抽象类实现，`org.springframework.extensions.webscripts.AbstractRuntime`，它实现了
    `org.springframework.extensions.webscripts.Runtime` 接口。它以一种通用的方式为接口中定义的方法提供了实现，使得
    web 脚本框架中的任何运行时都能够以通用方式提供 web 脚本请求。AbstractRuntime 类将一些方法保留为抽象，留给子类提供抽象方法的实现，以便为
    web 脚本运行时做出通用实现。如果你查看 web 脚本框架中所有现有的 web 脚本运行时，例如 WebScriptServletRuntime 和 JSFRuntime，你可以看到它们都扩展自
    AbstractRuntime 类。这些类提供了 AbstractRuntime 类中所需的抽象方法的实现。


    对服务提供者接口及其在 Alfresco 中开箱即用的 web 脚本框架中的实现有了整体了解后，让我们尝试理解如何利用这一知识创建 web 脚本运行时的自定义实现。我们将研究创建自定义
    web 脚本运行时所需的高层次步骤。


