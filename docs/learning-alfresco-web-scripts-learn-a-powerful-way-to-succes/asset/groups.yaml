    # 5

    Invoking Web Scripts


    In this chapter, we will cover how to invoke an Alfresco web script in different
    ways such as the following:


    +   - Invoking a web script through web browser and REST client plugins

    +   - Executing a web script through a standalone Java program

    +   - Making a call to a web script from Spring-based services

    +   - Different ways to invoke a web script from Alfresco Share

    +   - Calling a web script from the command line

    +   - Calling a web script from JSF pages or JSR-168 portals

    +   - Dealing with the limitation of clients'
  - '[PAGE 88]


    While working with web scripts in Alfresco, there might be situations where you
    would be curious to know how to execute a web script. For example, some common
    practical scenarios such as while developing web scripts, you will be interested
    in unit testing it. You want to invoke the web script in order to verify that
    the web script works well and returns the output as expected. In a support project
    while working on custom frontend application with a backend Alfresco repository,
    in the process of fixing an issue during debugging, you need to execute the web
    script and verify the response in order to find out whether the issue was a frontend
    issue or a backend issue. While working on customizing Alfresco Share, you will
    need to call the Alfresco repository web script. Sometimes, you might be required
    to make a call to the web script from a standalone Java class. It might be possible
    that you have a Spring-based application and from there you want to invoke an
    Alfresco web script. At some point of time, you might be required to call a web
    script from a Linux shell script as well and the list of such scenarios goes on.


    It is useful to have an understanding of how to invoke a web script in such basic
    possible real-life implementation scenarios. In this chapter, we are going to
    take a look at how to invoke web scripts in the previously mentioned common scenarios
    that any developer at some point of time will come across while working with Alfresco.


    # Invoking a web script from a web browser


    One of the easiest ways to invoke a web script is through a web browser. This
    is a convenient option for everyone. A web browser is a common client everyone
    generally uses to invoke a web script to test it while developing web scripts.


    Every HTTP GET web script you develop can simply be executed from a web browser
    by just hitting the web script URL. If any authentication is required for the
    web script, then an authentication pop up will appear to provide the authentication
    details.


    # Executing a web script using web browser plugins


    To test the web scripts you have created for POST, PUT, or DELETE, you cannot
    simply execute them from the web browser. You will be required to execute them
    through the add-ons provided by the browser to invoke HTTP POST, PUT, or DELETE
    calls. There could be multiple options available for browser plugins. We will
    take a look at two plugins here.'
  - '[PAGE 89]


    # Poster – Firefox add-on


    One plugin option is a Firefox add-on named Poster. You can download this plugin
    from the Firefox add-ons link, https://addons.mozilla.org/. If you already have
    Firefox installed, then open Firefox browser and just go to the add-ons link and
    search for Poster, and from the list of add-ons displayed, add Poster to Firefox.
    Another faster and easier way to install Poster is to go to Tools | Add-ons and
    search for Poster and click on the Install button.


    Once the add-on is installed, go to Tools | Poster to open the poster window.
    From this window, you can provide the web script URL, authentication credentials,
    request headers, parameters, and specify the HTTP method to invoke the web script.


    # Advanced REST client for Chrome


    Another good plugin option to use is the advanced REST client extension for Chrome.
    This plugin can be downloaded from the Chrome webstore link, https://chrome.google.com/webstore/category/apps.
    If you have already installed Chrome, then open the Chrome browser and just go
    to the link we just mentioned and search for advanced rest client and from the
    list of results displayed, install the Advanced REST client by following the Chrome
    extension install process. Another faster and easier way to install advanced REST
    client extension is to go to Tools | Extension and click on the Get more extensions
    link. Now, search for Advanced REST client and from the list of results displayed,
    install the plugin by following the Chrome extension install process.


    Once the Advanced REST client plugin is installed, to invoke it, put chrome-extension://hgmloofddfdnphfgcellkdfbfbjeloo/RestClient.html
    in the address bar of your Chrome browser. Another quick and easier way to launch
    the advanced REST client is to enter chrome://apps in the address bar and hit
    it. You can see the advanced REST client displayed here. Just click on it. You
    can now execute all your web scripts of GET, POST, PUT, and DELETE methods through
    the Advanced REST client plugin for Chrome.


    # Executing a web script from standalone Java program


    There are different options to invoke a web script from a Java program. Here,
    we will take a detailed walkthrough of the Apache commons HttpClient API with
    code snippets to understand how a web script can be executed from the Java program,
    and will briefly mention some other alternatives that can also be used to invoke
    web scripts from Java programs.'
  - '[PAGE 90]


    # HttpClient


    One way of executing a web script is to invoke web scripts using `org.apache.commons.httpclient.HttpClient`
    API. This class is available in `commons-httpclient-3.1.jar`. Executing a web
    script with HttpClient API also requires `commons-logging-*.jar` and `commons-codec-*.jar`
    as supporting JARs. These JARs are available at the `tomcat\webapps\alfresco\WEB-INF\lib`
    location inside your Alfresco installation directory. You will need to include
    them in the build path for your project. We will try to execute the hello world
    web script using the HttpClient from a standalone Java program. While using HttpClient,
    here are the steps in general you need to follow:


    +   1. Create a new instance of HttpClient.

    +   2. The next step is to create an instance of method (we will use GetMethod).
    The URL needs to be passed in the constructor of the method.

    +   3. Set any arguments if required.

    +   4. Provide the authentication details if required.

    +   5. Ask HttpClient to now execute the method.

    +   6. Read the response status code and response.

    +   7. Finally, release the connection.


    # Understanding how to invoke a web script using HttpClient


    Let''s take a look at the following code snippet considering the previous mentioned
    steps. In order to test this, you can create a standalone Java program with a
    main method and put the following code snippet in Java program and then modify
    the web script URLs/credentials as required. Comments are provided in the following
    code snippet for you to easily correlate the previous steps with the code:


    ```

    ```java

    // Create a new instance of HttpClient

    HttpClient objHttpClient = new HttpClient();


    // Create a new method instance as required. Here it is GetMethod.

    GetMethod objGetMethod = new GetMethod("http://localhost:8080/alfresco/service/helloworld");


    // Set querystring parameters if required.

    objGetMethod.setQueryString(new NameValuePair[] { new NameValuePair("name", "Ramesh")
    });


    // set the credentials if authentication is required.

    ```

    ```'
