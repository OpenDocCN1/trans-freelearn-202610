    Packt（发音为 ''packed''）于 2004 年 4 月出版了第一本书《Mastering phpMyAdmin for Effective MySQL
    Management》，此后一直专注于出版针对特定技术和解决方案的高聚焦度书籍。


    我们的图书和出版物分享了你的 IT 同行在适配和定制当今系统、应用和框架方面的经验。我们的解决方案类图书赋予你知识和能力，让你能够定制所使用的软件和技术以完成工作。Packt
    的图书比你过去所见过的 IT 书籍更具体、更专注。我们独特的商业模式使我们能够为你带来更聚焦的信息，让你获得更多需要知道的内容，减少无关信息。


    Packt 是一家现代而又独特的出版公司，专注于为开发者、管理员和初学者等群体制作高质量、前沿的书籍。如需更多信息，请访问我们的网站：www.packtpub.com。


    ## 关于 Packt Open Source


    2010 年，Packt 推出了两个新品牌：Packt Open Source 和 Packt Enterprise，以继续专注于专业化领域。本书属于 Packt
    Open Source 品牌，该品牌出版围绕开源许可证构建的软件相关书籍，为从高级开发者到初出茅庐的网页设计师在内的任何人提供信息。该开源品牌还运营着 Packt
