  - '[PAGE 100]


    When developing web scripts in Alfresco, there are two choices to write the controller
    implementation for a web script: a JavaScript-backed controller and Java-backed
    controller. Depending on your preference, you can choose to develop controller
    implementation from these two when required. With a JavaScript-backed controller,
    the development cycle can get faster compared to a Java-backed controller. There
    is a wide range of things that you can do with the Alfresco JavaScript API inside
    the JavaScript-based controller. However, there might be times when this is not
    enough for what you want to implement for your business requirement. In such cases,
    you can use the Java-backed web script, wherein it is possible to use all the
