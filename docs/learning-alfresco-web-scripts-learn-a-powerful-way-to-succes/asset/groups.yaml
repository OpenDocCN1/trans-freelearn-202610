    # Exploring the Alfresco Maven repository


    The Alfresco Maven repository is basically a common location where all the dependency
    JARs related to Alfresco are kept available, and you can configure your project
    to refer to the required dependencies from the repository in the pom.xml file
    of the project. You might want to explore the Maven repository for Alfresco that
    will be used by the Alfresco Maven SDK. Visit https://artifacts.alfresco.com/nexus/#view-repositories
    and explore the public release repositories that contain the released and stable
    artifacts. Also, the different available default project templates that are known
    as archetype in the terminology of Maven can be found under archetype-catalog
    available at https://artifacts.alfresco.com/nexus/service/local/repo_groups/public/content/archetype-catalog.xml.


    # Creating the default project structure for AMP


    In order to create the project structure for an AMP, we will use the project template
    provided by the Alfresco Maven SDK. This default project template is basically
    known as AMP archetype. This project template helps to have a standardized development,
    deployment, and the release approach for the Alfresco extensions you will develop
    for your project. The Alfresco AMP archetype can be used to create both repositories
    as well as share AMPs when required. In this chapter, we are going to use the
    AMP archetype for repository web scripts.


    > The Alfresco Maven SDK also provides another useful archetype known as All-in-One
    archetype, which is basically a multi-module project and gives a complete installation
    of the Alfresco platform along with its components without requiring additional
    downloads. While exploring archetype-catalog.xml, you might have observed that
    there are a lot of archetypes available. The important archetypes, the Alfresco
    AMP archetype and All-in-One archetype can be identified having the org.alfresco.maven.archetype
    group ID in archetype-catalog.xml.


    In order to create a default AMP project using the Alfresco AMP archetype, perform
    the following steps:


    +   1. Run the following command from the console. Just to note here, if the https
