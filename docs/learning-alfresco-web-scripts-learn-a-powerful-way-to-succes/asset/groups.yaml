    \ Web 脚本，他对 Web 脚本实现并不十分熟悉，而你希望让他快速上手 Web 脚本开发。没关系，你可以让他阅读本章，阅读后他应该能够很好地理解在 Alfresco\
    \ 中开发 Web 脚本。\n\n## 在 Alfresco 中创建你的第一个 Web 脚本\n\n每当我们开始学习任何新的编程语言时，我们实现的第一个程序都是“Hello\
    \ world”程序，其中我们只是将文本 **Hello world** 打印为程序的输出。我们在这里也会做同样的事情。我们将在 Alfresco 中创建一个基本的\
    \ Web 脚本，它将简单地显示 **Hello world!** 作为 Web 脚本的输出。\n\n为了在 Alfresco 中创建一个基本且简单的 Web\
    \ 脚本，你需要为 Web 脚本准备一个描述符以及一个用于渲染 Web 脚本输出的 FreeMarker 模板。\n\nWeb 脚本可以从可用的 Alfresco\
    \ 用户界面创建，也可以在 Alfresco 外部开发然后部署它们。由于我们在这里要实现一个非常基本的 Web 脚本，我们将使用 Alfresco 用户界面选项并创建\
    \ Web 脚本。你可以使用 Alfresco Explorer Web 客户端或 Alfresco Share UI 来实现此操作。然而，由于 Alfresco\
    \ Explorer 现在通常不被鼓励使用，因为它不在 Alfresco 的路线图上，并且不再为 Alfresco Explorer 提供新的实现支持，我们也不会使用\
    \ Alfresco Explorer。相反，我们将使用 Alfresco Share UI，这是通常推荐使用的。\n\n让我们现在创建 Web 脚本。为了在\
    \ Alfresco 中创建你的第一个 Web 脚本，请按照以下步骤操作：\n\n- 1. 登录 Alfresco Share UI。\n- 2. 点击顶部标题中的\
    \ **Repository** 链接。\n- 3. 进入 **Data Dictionary** | **Web Scripts Extensions**。\n\
    - 4. 创建一个名为 helloworld.get.desc.xml 的新文件，内容如下：\n\n```\n<webscript>\n  <shortname>Hello\
    \ World</shortname>\n  <description>First webscript Hello world</description>\n\
    \  <url>/helloworld</url>\n</webscript>\n```\n\nDownloading the example code\n\
    你可以从你在 http://www.packtpub.com 的账户下载你购买的所有 Packt 书籍的示例代码文件。如果你是在其他地方购买本书，你可以访问\
    \ http://www.packtpub.com/support 并注册以便将文件直接发送到你的邮箱。\n\n- 5. 创建一个名为 helloworld.get.html.ftl\
    \ 的新文件，内容如下：\n\n```\n<html>\n  <body>\n    <p>Hello world!</p>\n  </body>\n</html>\n\
    ```\n\n- 6. 现在，在浏览器中访问 URL http://localhost:8080/alfresco/service/index。提供身份验证弹出窗口中显示的用户名和密码。点击底部可用的\
    \ Refresh Web Scripts 按钮。\n- 7. 点击 List Web Scripts 链接。你可以通过点击 Browse all Web\
    \ Scripts 链接并搜索 helloworld 来看到 Hello world Web 脚本。\n- 8. 现在，访问 URL http://localhost:8080/alfresco/service/helloworld。好了，你应该在浏览器中看到输出\
    \ Hello world! 被渲染。\n\n我们已经在 Alfresco 中实现了第一个 Web 脚本。现在，让我们尝试理解我们刚刚为了实现第一个 Web\
    \ 脚本所做的事情。我们首先按如下方式创建了 Web 脚本：\n\n- - 我们实现了一个 GET Web 脚本来显示 Hello World! 作为输出\n\
    - - 我们为 Web 脚本创建了描述符文档 helloworld.get.desc.xml\n- - 我们还创建了 FreeMarker 模板 helloworld.get.html.ftl\
    \ 来渲染 Web 脚本响应\n\n通常，为了在 Alfresco 中创建 Web 脚本，至少需要两个文件。一个是描述符文档，另一个是 FreeMarker\
    \ 模板。\n\n## 是时候进行第一个 Web 脚本了\n\n接下来，我们按如下方式部署了 Web 脚本：\n\n- - 我们已将创建 Web 脚本所需的<|message|>\
    \ 文件部署到 Alfresco 存储库中\n- - 描述符文档和 FreeMarker 模板放置在 **Data Dictionary | Web Scripts\
    \ Extensions**\n\n> Web 脚本文件可以直接在 Alfresco 存储库的 **Data Dictionary | Web Scripts\
    \ Extensions** 中创建/上传，也可以通过代码库在文件系统上创建并部署 Web 脚本文件。\n\n然后我们按如下方式注册了 Web 脚本：\n\n\
    - - 我们访问了 URL `http://localhost:8080/alfresco/service/index` 并点击了 **Refresh Web\
    \ Scripts** 按钮以注册第一个 Web 脚本\n\n> 注册 Web 脚本有两种方式。一种是通过访问 URL `http://localhost:8080/alfresco/service/index`\
    \ 并点击 **Refresh Web Scripts** 按钮。另一种方式是通过代码库/存储库部署 Web 脚本文件并重启服务器。服务器重启也会注册 Web\
    \ 脚本。\n\n最后，我们按如下方式执行了第一个 Web 脚本：\n\n- - 我们从 Web 浏览器通过访问 URL `http://localhost:8080/alfresco/service/helloworld`\
    \ 调用了 Web 脚本\n- - Web 脚本在 Web 浏览器上将其输出作为响应显示\n\n## 理解 Web 脚本 URI\n\n理解 Web 脚本\
    \ URI 很重要。Web 脚本 URI 可以以通用形式表示为 `http[s]://<host>:<port>/[<contextPath>/]/<servicePath>/[<scriptPath>]\
    \ [?<scriptArgs>]`\n\nWeb 脚本 URI 中使用的术语解释如下：\n\n- - `http[s]`: 这是调用 Web 脚本的协议。这可以是\
    \ `http` 或 `https`。\n- - `host`: 这是部署 Web 脚本的服务器的名称或地址。\n- - `port`: 这是托管 Web\
    \ 脚本的服务器上 Web 脚本暴露的端口。\n- - `contextPath`: 这是应用程序部署到的路径。对于数据 Web 脚本，这通常是 `/alfresco`。\n\
    - - `servicePath`: 这是 Web 脚本服务映射到的路径。通常这将是 `/service`。\n- - `scriptPath`: 这是 Web\
    \ 脚本的路径，如在 Web 脚本描述符文档 `*.desc.xml` 的 `<url>` 标签中定义的那样。\n- - `scriptArgs`: 这些是要传递给\
    \ Web 脚本的参数，通常在 Web 脚本描述符文档 `*.desc.xml` 的 `<url>` 标签中定义。参数可以在 Web 脚本 `scriptPath`\
    \ 之后紧跟 ? 后指定。\n\n现在你了解了构成 Web 脚本 URI 的不同术语，现在你可以轻松地通过将我们的第一个 Web 脚本 URI 映射到 Web\
    \ 脚本 URI 的通用形式来理解我们的第一个 Web 脚本的 URI。请注意，我们的第一个 Web 脚本没有添加参数，因此你将无法映射 `scriptArgs`\
    \ 部分。现在让我们看看需要做什么来向 Web 脚本添加参数。\n\n## 向 Web 脚本添加参数\n\n假设我们想修改我们的第一个 Web 脚本来在 Web\
    \ 脚本响应中也显示姓名，例如 **Hello! Ramesh**。可以通过简单的方式实现，即将姓名作为 Web 脚本的 URL 参数传递，然后在 FreeMarker\
    \ 模板中使用此参数生成响应。为了做到这一点，我们将不得不执行以下步骤：\n\n- 1. 登录 Alfresco Share UI。\n- 2. 点击顶部标题中的\
    \ **Repository** 链接。\n- 3. 按如下方式编辑 **Data Dictionary | Web Scripts Extension**\
    \ 位置的描述符文件 `helloworld.get.desc.xml`：\n```\n<webscript>\n    <shortname>Hello\
    \ World</shortname>\n    <description>First webscript Hello world</description>\n\
    \    <url>/helloworld?name={argumentName}</url>\n</webscript>\n```\n- 4. 按如下方式编辑\
    \ **Data Dictionary | Web Scripts Extension** 位置的 FreeMarker 模板 `helloworld.get.html.ftl`：\n\
    ```\n<html>\n    <body>\n```\n"
