    Here, we used the search root object and invoked the findNode() method of the
    JavaScript API for search root object. We are expecting nodeid to be passed as
    an argument; hence, we read it using args.nodeid. Before invoking the findNode()
    method for the node, we have to make the noderef string to be passed as an argument
    to the method; hence, we concatenated workspace://SpacesStore/ with nodeid. If
    a node is found, it will return a ScriptNode object representing the node found.
    If the node is not found, it will simply return null.


    # Checking user permissions on a node


    Now, once the node is found, you first need to check whether a user has at least
    read access on the node or not before performing any other operations on a node
    as listed in the previous section. This can be done using the hasPermission method
    available in the ScriptNode API as follows:


    ```

    var permission = node.hasPermission("Read");

    ```


    We used the hasPermission() method from the ScriptNode API. We already had a node
    object available, and we just invoked the hasPermission() method passing the permission
    we want to check. If the current user has the given permission, it will return
    true. Otherwise, it will return false.


    # Getting the path of a node


    As the next thing, you will be interested to get the path of the node in order
    to identify the folder hierarchy the node belongs to. You can easily get the display
    path of a node using the ScriptNode API as follows:


    ```

    var nodepath = node.displayPath;

    ```


    We accessed a variable displayPath from the ScriptNode class. There is already
    a getter method getDisplayPath() implemented to get the path of a node in the
    ScriptNode class. This method will return the display path for the given node.


    # Checking the properties of a node


    Now, you want to see some properties of a node. For example, you are planning
    to modify the description property. Prior to this, you want to know what the value
    is before you change the value and want to log it for reference. The ScriptNode
    API is of biggest help when it comes to performing node-related things. With the
    help of the ScriptNode API, you can easily get the property value in different
    ways as follows:


    ```

    var description = node.properties.description;

    var description = node.properties["description"];

    ```'
