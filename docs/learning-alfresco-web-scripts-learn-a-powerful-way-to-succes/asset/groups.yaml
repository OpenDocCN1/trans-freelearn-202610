    ## 选择部署选项


    为 Web 脚本部署选择存储库选项或文件系统选项可以根据多个参数来决定，例如为你的项目开发的 Web 脚本数量，是否需要频繁更改 Web 脚本，团队成员是否可以访问安装了
    Alfresco 的服务器机器，以及你是否希望将 Web 脚本的代码作为源代码控制树的一部分进行管理。


    如果要开发大量 Web 脚本，则应选择文件系统部署选项，并将其作为源代码控制树的一部分进行管理。这样做的优点是，你可以使用用于自定义扩展的相同构建和部署工具，轻松部署构建你的业务解决方案的
