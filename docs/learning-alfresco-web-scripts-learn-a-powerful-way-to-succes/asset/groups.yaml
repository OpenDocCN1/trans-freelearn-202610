    Most of the root objects provided by the web script framework in Alfresco are
    also available in response templates. If you take a look at web script framework
    classes, they have the implementation available to provide script root objects
    and template root objects. Once you have an understanding of how to use root objects
    in the JavaScript controller, you can also use them in the response template.
    While developing web scripts, it''s always a good approach to perform business
    logic processing in the controller and populate the model object to display the
    output on the templates. However, in some scenarios, you might also have to leverage
    the root objects available for templates when required to form the response.


    # A must-know ScriptNode API


    If you are working on creating web scripts and accessing or manipulating nodes
    in Alfresco through a JavaScript controller, then you must have an understanding
    of the ScriptNode API. This provides access to various properties of a node and
    also provides different useful methods for a node in terms of security, thumbnailing,
    ownership, versioning, tagging, transformation, and so on. You can go through
    the code for ScriptNode to get understanding of the different methods. Its code
    is available in alfresco-repository-*.jar and its fully qualified class name is
    org.alfresco.repo.jscript.ScriptNode.


    Similarly, to access the properties of a node and perform various other things
    in response templates, you should check org.alfresco.repo.template.TemplateNode
    available in alfresco-repository-*.jar.'
  - '[PAGE 124]


    # Code examples


    Now that you have information on the different root objects you can use in the
    JavaScript controller, let''s take a look at some code examples to get a better
    understanding of how you can put the root objects in action to achieve the required
    functionality. We will go through some code examples for some of the generic functionalities
    that every developer will use at some point in time. We will use some of the root
    objects we have gone through previously.


    # Creating a folder


    Consider a scenario where you have a custom frontend application and Alfresco
    as the backend repository. Now, you want to have the functionality for the users
    to create a folder in Alfresco under the company home from the custom frontend.
    Once the folder is created, you might also want to create some content inside
    the folder or run some action on the folder. First, our goal is to create a folder
    under the company home.


    To address this, we will create a new web script foldercreation, which will accept
    the argument foldername and creates a named folder under the company home and
    returns the noderef value as a response in the XML format. You could use the returned
    noderef further to invoke other web scripts as required, for example, to run an
    action or create content.


    In subsequent sections, you will find the core code snippet that needs to be implemented
    inside the JavaScript controller and response template in order to achieve the
    mentioned scenario. You can also go through the code files provided for this chapter
    in order to see the web script implementation for this web script.


    # Retrieving explicit arguments


    In order to implement this scenario, as the first thing in the JavaScript controller,
    we need to read the argument foldername. Explicit arguments can be retrieved using
    the args root object. So, we will read the argument foldername as follows:


    ```

    if (args.foldername != null && args.foldername != "")

    ```


    > If you have implicit arguments provided in the web script URL, then these arguments
    will not be available using the args root object. For them, you can get their
    values using the url root object like in url.templateArgs.foldername.'
