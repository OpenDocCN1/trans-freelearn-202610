    # Understanding JavaScript-based Web Scripts in Detail


    | Root object | Name of the class | Description |

    |---|---|---|

    | activities | `org.alfresco.repo.activities.script.Activity` | This provides
    methods to post activity and feed control |

    | appUtils | `org.alfresco.repo.jscript.ApplicationScriptUtils` | This provides
    some methods that could be useful for an external application |


    Apart from this, if you search the XML files in the Alfresco installed directory
    for `parent="baseJavaScriptExtension"`, you will get an additional list of root
    objects and its relevant classes in other context files. Here are the other available
    root objects defined as mentioned earlier: `actionTrackingService`, `groups`,
    `formService`, `invitations`, `preferenceService`, `ratingService`, `renditionService`,
    `replicationService`, `siteService`, `slingshotDocLib`, `taggingService`, `thumbnailService`,
    `transfer`, `webprojects`, `cmisserver`, `commentService`, `bulkFSImport`, `jmx`,
    and `adminIndexCheckService`.


    To learn more, you should do a brief exercise and find the related Java classes
    for these root objects and go through them. This exercise will make you familiar
    with the available methods that you can use in the JavaScript-backed controller.


    While developing a JavaScript-backed controller, the basic concept is simple;
    take a look at the methods available in the defined Java class for the JavaScript
    API and access those methods with the name given under the extensionName property.


    # Other available root objects


    We have seen the root objects that have the API methods implemented in the Java
    classes. There are some other default root objects provided by the web script
    framework in Alfresco that you can use in the JavaScript controller of a web script.
    We saw the different classes that get involved in executing web scripts while
    looking at a behind-the-scenes implementation of web script execution in *Chapter
    3, Understanding the Web Script Framework*. You might want to go through the web
    script framework classes in `spring-webscripts-*.jar` and `alfresco-remote-api-*.jar`
    to find out in detail how these root objects are being made available in the JavaScript
    controller. The following are the available root objects from different classes
    of a web script framework:'
