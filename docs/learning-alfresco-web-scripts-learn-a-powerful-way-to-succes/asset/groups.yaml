    \ you will find a link **Browse 'CMIS' Web Scripts** to take a look at all the\
    \ web scripts categorized to be of the CMIS family.\n\n## <cache>\n\nCaching is\
    \ a very good feature that helps to avoid regenerating a response for each request.\
    \ The web script framework in Alfresco uses the caching mechanism defined by HTTP.\
    \ For a web script, the required level of caching can be provided using this optional\
    \ element. When a web script is invoked, the web script framework translates the\
    \ declaration of this element to an appropriate response header to manage the\
    \ cache. The cache tag with its child elements will appear in the description\
    \ document as follows:\n\n```\n<cache>\n    <never>false</never>\n    <public>true</public>\n\
    \    <mustrevalidate/>\n</cache>\n```\n\nThe different optional child elements\
    \ of this tag are explained in the subsequent sections.\n\n### never\n\nThis indicates\
    \ whether a web script response should be cached or not. The default value is\
    \ `true`, which means that a web script response will never be cached. An alternate\
    \ value is `false` to specify allowing of caching of a web script response.\n\n\
    ### public\n\nThis is used to specify whether the authenticated web script response\
    \ should be cached in a public cache or not. The `true` value indicates that the\
    \ web script response can be cached, while `false` indicates the web script response\
    \ can not be cached. The default value is `false`.\n\n### mustrevalidate\n\nThis\
    \ is used to indicate whether a cache should revalidate its version of the web\
    \ script response in order to provide the fresh response data. The `true` value\
    \ indicates that there must always be a validation, while `false` indicates there\
    \ might be a validation. The default value is always `true`.\n\n## <negotiate>\n\
    \nFor the specific web script response format, the accept header MIME type can\
    \ be provided using this optional element. There can be multiple entries of this\
    \ element in the description document. It is mandatory to provide the value for\
    \ this tag. The value will hold the type of response format. Also, it is mandatory\
    \ to provide the accept attribute that mentions the MIME type.\n\n```xml\n<negotiate\
    \ accept=\"text/html\">html</negotiate>\n<negotiate accept=\"text/xml\">xml</negotiate>\n\
    ```\n\nWith the definition of one negotiate element in the description document,\
    \ content negotiation is enabled.\n\n> It is interesting to understand how the\
    \ negotiate and format elements are correlated. Each web script returns result\
    \ in a response stream and it might be encoded based on the MIME type. If during\
    \ invoking a web script, any hint is not provided on the MIME type, then the web\
    \ script framework will use its predefined encoding. While invoking a web script,\
    \ it is possible to provide the hint to let the script framework know about the\
    \ MIME type for response. Using the format element, as a URL extension or as a\
    \ format argument, the response format can be specified, which is mapped to a\
    \ MIME type in the web script framework. Another option is to specify the Accept\
    \ header, which can be done using the negotiate element.\n\n## <lifecycle>\n\n\
    The lifecycle element is to describe the lifecycle stage of a web script. This\
    \ element can be specified in the description document as follows:\n\n```xml\n\
    <lifecycle>sample</lifecycle>\n```\n\nWeb scripts in their development lifecycle\
    \ can initially be in draft state, then are fully used in the production mode,\
    \ and at the end are deprecated when they are not used anymore. These stages can\
    \ be specified for web scripts using this element. Different possible values for\
    \ this element are shown in the subsequent sections.\n\n### none\n\nThis indicates\
    \ that the web script is not part of any lifecycle.\n\n### sample\n\nThis mentions\
    \ that the web script is a sample web script and should not be used for production\
    \ use.\n\n### draft\n\nThis specifies that the web script is still in the experimental\
    \ stage and not yet fully completed.\n\n### public_api\n\nThis determines that\
    \ the web script is part of the Alfresco public API, and hence, it is fully tested\
    \ and must be stable.\n\n### draft_public_api\n\nThis mentions that it is going\
    \ to be a part of the Alfresco public API but it is not yet fully complete or\
    \ still some changes are in progress.\n\n### deprecated\n\nThis indicates the\
    \ web script is deprecated and should not be used and that this web script may\
    \ be removed from the future Alfresco versions.\n\n### internal\n\nThis mentions\
    \ that the web script is for Alfresco internal use only. Hence, for different\
    \ versions, it could have been changed as per the Alfresco internal usage, and\
    \ it's a possibility that it can be changed in future versions of Alfresco.\n\n\
    > The <lifecycle> element is an optional one. Generally, for the custom web scripts\
    \ that you will develop for your project, it is not mandatory to specify the lifecycle\
    \ value for a web script. Hence, you might not be using this element.\n\n## <formdata>\n\
    \nIn the description document of a web script, you can specify the formdata tag\
    \ as follows:\n\n```\n<formdata multipart-processing=\"false\" />\n```\n\nIt has\
    \ an attribute called multipart-processing. This can be used to specify whether\
    \ multipart form data processing is turned on or off for the web script. Optional\
    \ values are true, which indicates that multipart processing for form data is\
    \ turned on and false, which indicates that it is off. The default value is true.\n"
  mdcn: "\n\n## any\n\n在描述文档中，当 `any` 被指定为 `format` 标签的值时，响应格式可以使用前面提到的任意方法来指定。在描述文档中没有指定\
    \ `format` 元素的情况下，它会被视为与将 `format` 值指定为 `any` 相同。其值为 `any` 的 `format` 标签在描述文档中会显示如下：\n\
    \n```\n<format default=\"html\">any</format>\n```\n\n> 在调用 Web 脚本时，如果没有指定响应内容类型，那么默认内容类型将使用\
    \ `format` 标签的 `default` 属性。如果未设置 `default` 属性，则其默认值为 HTML。某些 Web 脚本也可能在运行时决定响应内容类型。对于这些脚本，需要将\
    \ `default` 属性设为空白，例如 `default=\"\"`。\n\n## <authentication>\n\n为了安全地访问 Web 脚本，指定\
    \ Web 脚本所需的身份验证级别非常重要。这个可选的标签声明可以用于定义该级别。它有一个可选属性：`runas`。该元素可以指定的不同值将在后续章节中解释。\n\
    \n### none\n\n如果你要实现一个不需要身份验证的 Web 脚本，可以在 Web 脚本的描述文档中按如下方式指定 `authentication`\
    \ 标签：\n\n```\n<authentication>none</authentication>\n```\n\n当描述文档中也没有指定 `authentication`\
    \ 标签时，这是默认值。它表示运行该 Web 脚本不需要任何身份验证。\n\n> 在身份验证被指定为 `none` 的 Web 脚本中，将无法与仓库进行交互。\n\
    \n### guest\n\n你可以按如下方式使用 `guest` 值指定 `authentication` 标签：\n\n```\n<authentication>guest</authentication>\n\
    ```\n\n上一行表示运行该 Web 脚本时，至少需要 guest 级别的身份验证。\n\n### user\n\n你可以按如下方式将 `authentication`\
    \ 标签的值指定为 `user`：\n\n```\n<authentication>user</authentication>\n```\n\n这表示运行该\
    \ Web 脚本时，至少需要仓库的命名用户身份验证。\n\n### admin\n\n你可以按如下方式将 `authentication` 标签的值指定为\
    \ `admin`：\n\n```\n<authentication>admin</authentication>\n```\n\n上一行表示运行该 Web\
    \ 脚本时需要仓库的管理员用户身份验证。管理员用户基本上就是属于 `ALFRESCO_ADMINISTRATORS` 组的用户。\n\n> 也可以指定以某个特定的\
    \ Alfresco 仓库用户身份执行 Web 脚本，而无需考虑是谁发起了该 Web 脚本。这可以通过 `authentication` 元素的 `runas`\
    \ 属性来指定，例如 `runas=\"admin\"`。\n> 需要注意的是，此属性仅适用于放置在 Java 类路径中的 Web 脚本。\n\n## <transaction>\n\
    \n还可以使用这个可选的 `transaction` 元素来指定执行 Web 脚本的事务级别。该元素有两个可选属性：`allow` 和 `buffersize`。该元素可以使用的不同有效值如下列小节所示：\n\
    \n### none\n\n其值为 `none` 的 `transaction` 在描述文档中会显示如下：\n\n```\n<transaction>none</transaction>\n\
    ```\n\n上一行表示运行该 Web 脚本不需要任何事务。\n\n`family` 标签的一个示例如下：\n\n```\n<family>CMIS</family>\n\
    ```\n\n当你访问 http://localhost:8080/alfresco/service/index 页面时，你会找到一个基于 `family`\
    \ 浏览 Web 脚本的选项。例如，你会找到一个链接 **浏览“CMIS”Web 脚本**，用来查看所有归类为 CMIS 家族的 Web 脚本。\n\n##\
    \ <cache>\n\n缓存是一个非常好的特性，有助于避免为每个请求重新生成响应。Alfresco 中的 Web 脚本框架使用 HTTP 定义的缓存机制。对于\
    \ Web 脚本，可以使用这个可选元素来提供所需的缓存级别。当 Web 脚本被调用时，Web 脚本框架会将该元素的声明转换为合适的响应头来管理缓存。带有其子元素的\
    \ `cache` 标签在描述文档中会显示如下：\n\n```\n<cache>\n    <never>false</never>\n    <public>true</public>\n\
    \    <mustrevalidate/>\n</cache>\n```\n\n该标签的不同可选子元素将在后续章节中解释。\n\n### never\n\n\
    这表示是否应对 Web 脚本响应进行缓存。默认值为 `true`，表示 Web 脚本响应将永远不会被缓存。另一个可选值为 `false`，用于指定允许缓存\
    \ Web 脚本响应。\n\n### public\n\n这用于指定经过身份验证的 Web 脚本响应是否应缓存在公共缓存中。`true` 值表示可以缓存 Web\
    \ 脚本响应，而 `false` 表示不能缓存 Web 脚本响应。默认值为 `false`。\n\n### mustrevalidate\n\n这用于指示缓存是否应重新验证其\
    \ Web 脚本响应版本，以提供最新的响应数据。`true` 值表示必须始终进行验证，而 `false` 表示可能需要进行验证。默认值始终为 `true`。\n\
    \n## <negotiate>\n\n对于特定的 Web 脚本响应格式，可以使用这个可选元素来提供 Accept 头的 MIME 类型。在描述文档中可以有多个该元素的条目。必须为此标签提供值。该值将包含响应格式的类型。同时，必须提供包含\
    \ MIME 类型的 `accept` 属性。\n\n```xml\n<negotiate accept=\"text/html\">html</negotiate>\n\
    <negotiate accept=\"text/xml\">xml</negotiate>\n```\n\n在描述文档中定义一个 `negotiate`\
    \ 元素后，内容协商即被启用。\n\n> 理解 `negotiate` 和 `format` 元素之间的关联是很有趣的。每个 Web 脚本都会以响应流的形式返回结果，并且可能会根据\
    \ MIME 类型进行编码。如果在调用 Web 脚本时没有提供任何关于 MIME 类型的提示，那么 Web 脚本框架将使用其预定义的编码。在调用 Web 脚本时，可以提供提示，让脚本框架知道响应的\
    \ MIME 类型。使用 `format` 元素，可以以 URL 扩展名或格式参数的形式指定响应格式，该格式会映射到 Web 脚本框架中的 MIME 类型。另一种选择是指定\
    \ Accept 头，这可以通过 `negotiate` 元素来完成。\n\n## <lifecycle>\n\n`lifecycle` 元素用于描述 Web\
    \ 脚本的生命周期阶段。该元素可以在描述文档中按如下方式指定：\n\n```xml\n<lifecycle>sample</lifecycle>\n```\n\
    \nWeb 脚本在其开发生命周期中，最初可能处于草稿状态，然后在生产模式中完全使用，最后在不再使用时被弃用。可以使用该元素为 Web 脚本指定这些阶段。该元素的不同可能值如下列小节所示。\n\
    \n### none\n\n这表示该 Web 脚本不属于任何生命周期。\n\n### sample\n\n这表示该 Web 脚本是一个示例 Web 脚本，不应用于生产环境。\n\
    \n### draft\n\n这表示该 Web 脚本仍处于实验阶段，尚未完全完成。\n\n### public_api\n\n这表示该 Web 脚本是 Alfresco\
    \ 公共 API 的一部分，因此经过了全面测试，必须保持稳定。\n\n### draft_public_api\n\n这表示它将成为 Alfresco 公共\
    \ API 的一部分，但尚未完全完成，或者仍在进行一些更改。\n\n### deprecated\n\n这表示该 Web 脚本已被弃用，不应再使用，并且该\
    \ Web 脚本可能会从未来的 Alfresco 版本中移除。\n\n### internal\n\n这表示该 Web 脚本仅供 Alfresco 内部使用。因此，对于不同版本，它可能会根据\
    \ Alfresco 内部使用情况而改变，并且有可能在未来的 Alfresco 版本中发生变化。\n\n> `<lifecycle>` 元素是一个可选元素。通常，对于你为项目开发的自定义\
    \ Web 脚本，并不一定要为 Web 脚本指定 lifecycle 值。因此，你可能不会使用该元素。\n\n## <formdata>\n\n在 Web\
    \ 脚本的描述文档中，你可以按如下方式指定 `formdata` 标签：\n\n```\n<formdata multipart-processing=\"\
    false\" />\n```\n\n它有一个名为 `multipart-processing` 的属性。这可用于指定 Web 脚本的多部分表单数据处理是开启还是关闭。可选值为\
    \ `true`（表示表单数据的 multipart 处理已开启）和 `false`（表示已关闭）。默认值为 `true`。\n\n"
