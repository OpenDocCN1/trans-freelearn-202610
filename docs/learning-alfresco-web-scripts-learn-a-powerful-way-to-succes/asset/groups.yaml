  - "[PAGE 134]\n\n# Understanding deployment locations\n\nWe just saw that to deploy\
    \ web scripts using the repository option, there are two probable locations where\
    \ web scripts can be deployed. For deploying web scripts using the filesystem\
    \ location, there are four such probable locations. As a developer, you must be\
    \ interested to find out how these deployment locations are identified for both\
    \ these deployment options.\n\nIt is good to know the technical details behind\
    \ this. While registering web scripts, there is always a lookup of web scripts\
    \ performed by the `org.springframework.extensions.webscripts.DeclarativeRegistry`\
    \ class prior to registering the web script. It uses `org.springframework.extensions.webscripts.SearchPath`,\
    \ which is basically a collection of store. If you take a look at each store defined\
    \ under the `searchPath` collection, you will find the path locations, which are\
    \ basically the six deployment locations we saw earlier. Let's take a look at\
    \ how it is wired as a spring bean definition in Alfresco.\n\nHere is the bean\
    \ entry for `SearchPath` from `web-scripts-application-context.xml` that is available\
    \ at the location `tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco` inside\
    \ your Alfresco installed directory. If you are using Alfresco Community 5, it\
    \ is located under the `alfresco` package inside `alfresco-remote-api-*.jar`.\n\
    \n```\n```xml\n<bean id=\"webscripts.searchpath\" class=\"org.springframework.\n\
    \    extensions.webscripts.SearchPath\">\n    <property name=\"searchPath\">\n\
    \        <list>\n            <ref bean=\"webscripts.store.repo.extension\" />\n\
    \            <ref bean=\"webscripts.store.repo\" />\n            <ref bean=\"\
    webscripts.store.client.extension\" />\n            <ref bean=\"webscripts.store.client\"\
    \ />\n            <ref bean=\"webscripts.store.alfresco\" />\n            <ref\
    \ bean=\"webscripts.store\" />\n        </list>\n    </property>\n</bean>\n```\n\
    ```\n\nIn the previous bean definition, under the `list` property, the first two\
    \ beans are holding the path for repository deployment locations and the other\
    \ four are holding the path for filesystem deployment locations we saw earlier.\
    \ You can take a look at each of these bean definitions in `web-scripts-application-context.xml`\
    \ for more details."
