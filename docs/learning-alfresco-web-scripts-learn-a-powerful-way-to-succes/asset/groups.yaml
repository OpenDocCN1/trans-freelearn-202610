    the web script request. Hit the http://localhost:8080/alfresco/service/getContentLocation
    URL in the browser.


    As we specified the default format as JSON, the JSON response will be rendered
    as shown in the following code snippet. Since we have not created a custom status
    template and used status.setRedirect as true, the default status response template
    provided by the web script framework in Alfresco is rendered. The same output
    will also be displayed if the JSON format had been requested explicitly while
    invoking the web script request as http://localhost:8080/alfresco/service/getContentLocation.json.'
