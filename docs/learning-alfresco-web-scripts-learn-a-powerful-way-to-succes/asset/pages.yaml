  md: "# Configuring the controller for the web script\n\nOnce the Java controller\
    \ is ready, it needs to be configured for the web script so that the web script\
    \ framework in Alfresco can get to know that this Java class is the controller\
    \ for the `contentlocation` web script. This can be done by creating a spring\
    \ context file and adding the entry for the Java class in it.\n\nCreate a file\
    \ `custom-example-webscripts-context.xml` that has the following content:\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE beans PUBLIC '-//SPRING//DTD\
    \ BEAN//EN' 'http://www.springframework.org/dtd/spring-beans.dtd'>\n<beans>\n\
    \    <bean id=\"webscript.example.contentlocation.get\" class=\"com.example.content.ContentLocationWebScript\"\
    \ parent=\"webscript\">\n        <property name=\"nodeService\" ref=\"nodeService\"\
    \ />\n        <property name=\"permissionService\" ref=\"permissionService\" />\n\
    \    </bean>\n</beans>\n```\n\nWe created a spring context file to associate the\
    \ Java controller with the `contentlocation` web script in order to let the web\
    \ script framework in Alfresco know that the ContentLocationWebscript Java class\
    \ is the controller for the `contentlocation` web script. This is done by following\
    \ the appropriate naming convention while providing a bean entry in the context\
    \ file.\n\nThe most important thing is to specify the correct bean ID. The naming\
    \ convention that needs to be followed is `webscript.package.webscriptid.httpmethod`.\n\
    \nHence, the way it needs to be built is, that if the web script description file\
    \ resides at `templates\\webscripts\\example\\contentlocation.get.desc.xml` location,\
    \ then the bean ID would be `webscript.example.contentlocation.get`. Following\
    \ this naming convention is a must in order to register the class as a controller\
    \ for the web script. If you fail to do so, the web script framework in Alfresco\
    \ will not be able to register the class as a web script controller and when you\
    \ try to execute the web script, the controller code will not get called."
