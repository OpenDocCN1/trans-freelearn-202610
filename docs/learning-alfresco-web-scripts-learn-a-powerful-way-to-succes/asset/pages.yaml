- pgno: 53
  md: '# 3

    Understanding the Web Script Framework


    In this chapter, we will cover the following topics:


    +   - End-to-end execution flow of a web script

    +   - Components that collectively make the web script framework

    +   - Deployment architecture for a web script'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'The web script framework in Alfresco is a powerful one and its basic goal is
    to ensure that:


    +   - Web scripts in Alfresco are easy to develop

    +   - Web scripts can support various useful features, such as support for internationalization
    to render output in multiple languages, exposing configuration options for a web
    script, similarly like the ServletConfig for servlets


    The web script framework in Alfresco is designed as per the **model-view-controller
    pattern (MVC pattern)** and makes it easy to develop new web scripts to expose
    a RESTful API to interact with the Alfresco backend repository.


    In this chapter, we are going to deep dive into the web script framework in Alfresco
    to get an understanding of the various components that collectively make it a
    powerful framework. It is a backbone engine for registration and execution of
    Alfresco web scripts.


    # Execution flow of web scripts


    Let''s first understand the execution flow of web scripts in order to understand
    the Alfresco web script framework.


    # Overall flow for a web script


    As soon as a request for the web script URI is hit, the execution flow of the
    web script gets started and continues till the request gets served with the requested
    response format. Let''s understand the overall execution flow for a web script
    with a JavaScript-backed controller. The whole execution flow is as follows:


    +   1. A request for the web script URI arrives at the web script request dispatcher
    in Alfresco.

    +   2. The request dispatcher sends the request to the Web Script Runtime.

    +   3. The Web Script Runtime delegates the request to The Web Script Container,
    which will first find the suitable web script for the requested URI and the requested
    HTTP method.

    +   4. The next thing would be to authenticate the user first, if required, before
    executing the web script.

    +   5. The Web Script Container then executes the controller implementation if
    available. The script processor will execute the JavaScript controller for the
    requested web script.'
  merge: -1
  img_proc: true
- pgno: 55
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Behind the scenes implementation


    As we have an overview of the overall execution flow for a web script, let''s
    now take a detailed technical walk-through of the implementation in order to understand
    how a web script request gets served when a JavaScript controller-backed web script
    is invoked through an HTTP request from the HTTP client, for example, a web browser.
    You will find a lot of technical details in this section, so you might want to
    have a cup of coffee before you start reading this section.


    > As we are going to take a detailed technical walk-through in this section, you
    might want to have access to the source code so that it would be easy to follow
    while reading this section. For easy and handy access to the code, we will simply
    explore the JARs that are available in the Alfresco installation. You can download
    and install the Java code decompiler such as JD-GUI (available at `http://jd.benow.ca/`)
    that allows JAR files to be decompiled. The core classes we will get familiar
    with in this section are mainly located in `spring-webscripts-*.jar`, `alfresco-remote-api-*.jar`,
    and `spring-surf-core-configservice-*.jar`. These JARs can be found at `tomcat\webapps\alfresco\WEB-INF\lib`
    inside your Alfresco installation directory. Once the JARs are opened in JD-GUI
    (decompiler), you can open the class files using `Ctrl + Shift + T` and provide
    the class name.


    So, let''s get started:


    +   1. For Alfresco web scripts, the RequestDispatcher servlet (`org.springframework.extensions.webscripts.servlet.WebScriptServlet`)
    is configured in web.xml and mapped to the `/service/*` URL pattern.

    +   2. On the first request to the `/alfresco/service/*` URL pattern servlet container
    will invoke the init method of WebScriptServlet and instantiate it with the config
    service (`org.springframework.extensions.config.xml.XMLConfigService`), Web Script
    Container (`org.alfresco.repo.web.scripts.TenantRepositoryContainer`), and authentication
    factory (`org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory`)
    fetched based on the servlet init-param — authenticator (`webscripts.authenticator.basic`)
    and required server properties.

    +   3. After completing initialization on the first request and also on subsequent
    requests to the `/alfresco/service/*` URL pattern to execute the web script, the
    `service()` method of WebScriptServlet gets invoked.


    ![](img/f02f759059b86af67e38b543d498a0d8_56_0.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: "+   4. `WebScriptServlet` while serving the web script requests will do the\
    \ following each time:\n+      - It creates a new instance of web script Servlet\
    \ Runtime (`org.springframework.extensions.webscripts.servlet.WebScriptServletRuntime`)\
    \ using the Web Script Container, authentication factory (related classes mentioned\
    \ in the second step), server properties, request (`javax.servlet.http.HttpServletRequest`),\
    \ and response (`javax.servlet.http.HttpServletResponse`).\n+      - It invokes\
    \ the `executeScript` method of `WebScriptServletRuntime`.\n+   \n+   5. `WebScriptServletRuntime`\
    \ does not provide an implementation for the `executeScript()` method and hence\
    \ the method implementation in its parent class `AbstractRuntime` (`org.springframework.extensions.webscripts.AbstractRuntime`),\
    \ gets executed.\n+   \n+   6. During the execution of the `executeScript()` method\
    \ in `AbstractRuntime`, it will first get the web script method and web script\
    \ URI and invokes the `findWebscript(methodName, uri)` method of registry (`org.springframework.extensions.webscripts.DeclarativeRegistry`)\
    \ defined in the Web Script Container.\n+   \n+   7. Registry (`DeclarativeRegistry`)\
    \ will perform the `uriIndex` lookup for the first request of the web script URI\
    \ by invoking `findWebscript(methodName, uri)` of the `UriIndex` implementation\
    \ (`org.springframework.extensions.webscripts.JaxRsUriIndex`) and update the `uriIndexCache`\
    \ with the web script URI. So that in the next request for the same web script\
    \ URI, the registry does not do the look up again.\n+   \n+   8. Registry (`DeclarativeRegistry`)\
    \ provides the Match object (`org.springframework.extensions.webscripts.Match`),\
    \ which contains the `templatePath`, `templateVars` map, and WebScript object\
    \ (`org.springframework.extensions.webscripts.DeclarativeWebScript`) back to `AbstractRuntime`.\n\
    +   \n+   9. Web Script Runtime (`AbstractRuntime`) then creates the `WebScriptRequest`\
    \ (`org.springframework.extensions.webscripts.WebScriptRequestImpl`), `WebScriptResponse`\
    \ (`org.springframework.extensions.webscripts.WebScriptResponseImpl`), and Authenticator\
    \ (`org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory.BasicHttpAuthenticator`)\
    \ using the implementation available in `WebScriptServletRuntime`."
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   10. Web Script Runtime (AbstractRuntime) will then invoke the `executeScript`
    method of Web Script Container (`org.alfresco.repo.web.scripts.RepositoryContainer`),
    and pass the web script request, web script response, and authenticator. The Repository
    Container configured is `TenantRepositoryContainer`; however, it does not provide
    the implementation of the `executeScript` method and hence, the method gets executed
    from its parent class.

    +   11. The Web Script Container (`RepositoryContainer`) will get the description
    object using the web script object received in the web script request and it first
    authenticates the user, creates a new transaction to execute the web script, and
    then invoke web script''s (`DeclarativeWebScript`) `execute` method passing web
    script request and response.

    +   12. `DeclarativeWebScript` will invoke the `getExecuteScript` method of `AbstractWebScript`,
    which will get the script from the web script cache. If the web script is executed
    for the first time, it will add it to the cache first.

    +   13. `DeclarativeWebScript` will then invoke the `createScriptParameters` method
    of the `AbstractWebScript` class, which will populate a map with required parameters
    such as `webscript`, `format`, `args`, `argsM`, `headers`, `headersM`, `guest`,
    `url`, `msg`, Web Script Runtime''s script parameters, and Web Script Container''s
    script parameter. Also, it will create `TemplateConfigModel` and `ScriptConfigModel`
    based on `config.xml` provided for the web script.

    +   14. In further processing, the `executeScript` method of `AbstractWebscript`
    will get invoked, which in turn will invoke the `ScriptProcessor` class (`org.alfresco.repo.jscript.RhinoScriptProcessor`),
    which will for the first time compile the JavaScript controller and resolve the
    imports of the script and then finally execute the controller.

    +   15. `DeclarativeWebScript` will then have `TemplateProcessor` configured in
    Web Script Container (`AbstractRuntimeContainer`) to process the template in order
    to render the response.

    +   16. `DeclarativeWebScript` sets the response to be rendered.

    +   17. Web Script Container (`RepositoryContainer`) ends the transaction and
    resets the authentication.

    +   18. Web Script Runtime (`AbstractRuntime`) completes the entire execution
    and logs the processing time of the web script execution and processing.

    +   19. `WebscriptServlet` returns the response back to the web script client.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Components of the web script framework


    The different high-level components that collectively make the powerful web script
    framework are as follows:


    +   - Web Script Runtime

    +   - Web Script Authenticator

    +   - Web Script Container

    +   - Other supporting components


    ![](img/f02f759059b86af67e38b543d498a0d8_59_0.png)


    Let''s go through them one by one.


    # Web Script Runtime


    Having understood the web script execution flow in detail, let''s recollect the
    role of Web Script Runtime. While executing the web script, request dispatcher
    will first send the request to the Web Script Runtime. The Web Script Runtime
    then passes the control to the Web Script Container for further processing. Hence,
    it can be considered as the entry point into the web script framework after the
    request dispatcher.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Understanding the Web Script Framework


    Each and every web script gets executed in WebScript Runtime. It basically separates
    out the web script and its execution environment. Web Script Runtime encapsulates
    the complete web script execution environment, specifically requests, response,
    and authentication, and serves the web script to the calling web script client.


    Alfresco provides different Web Script Runtimes for web script execution out-of-the-box
    as follows:


    +   - Servlet Runtime

    +   - Portlet Runtime

    +   - JSF Runtime

    +   - Facebook Runtime

    +   - SURF Web Framework Runtime


    # Servlet Runtime


    This Web Script Runtime is responsible for executing all the web scripts requested
    through HTTP or HTTPS requests.


    > Servlet Runtime is the most commonly used runtime that basically executes web
    scripts using HTTP/HTTPS requests. This book also specifically focuses on Servlet
    Runtime.


    The implementation of this runtime is available in `org.springframework.extensions.webscripts.servlet.WebScriptServletRuntime`
    present in `spring-webscripts-*.jar`.


    # Portlet Runtime


    This Web Script Runtime makes it possible for JSR-168 portlets to directly execute
    Alfresco web scripts. Whenever Alfresco web script is accessed from the JSR-168
    portlets, this runtime will get instantiated while executing the web script.


    The implementation of this runtime (`PortletRuntime`) is available as an inner
    class implementation in `org.springframework.extensions.webscripts.portlet.WebScriptPortlet`
    residing in `spring-webscripts-*.jar`.


    # JSF Runtime


    JSF components can execute Alfresco web scripts using JSF Runtime. Whenever the
    Alfresco web script is invoked from the JSF page, this runtime will get instantiated
    for executing the web script.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The implementation of this runtime (`WebScriptJSFRuntime`) can be found as
    an inner class implementation in `org.springframework.extensions.webscripts.jsf.UIWebScript`
    located in `spring-webscripts-*.jar`.


    # Facebook Runtime


    Facebook Runtime provides access to Facebook APIs in the Alfresco web scripts.


    The implementation of this runtime is available in `org.alfresco.repo.web.scripts.facebook.FacebookServletRuntime`
    in `alfresco-remote-api-*.jar`.


    # SURF Runtime


    The SURF web framework runtime allows building up web-tier UI pages by embedding
    the Alfresco web script components.


    The implementation of the SURF runtime can be found in `org.springframework.extensions.webscripts.LocalWebScriptRuntime`
    in `spring-surf-*.jar`.


    # Web Script Authenticator


    When interacting with any content repository, secure access to content is a must
    and is really essential. Alfresco also requires an authenticated access while
    accessing the content repository. The main task of the Web Script Authenticator
    is to authenticate web script requests.


    There are different authenticators, as mentioned in the following list, available
    out-of-the-box in Alfresco, which can be configured in the relevant Alfresco Web
    Script Runtime in order to provide secure access to the Alfresco repository through
    Alfresco web scripts:


    +   - HTTP basic Authenticator

    +   - Alfresco explorer Authenticator

    +   - JSR-168 Authenticator

    +   - JSR-168 Authenticator with Alfresco explorer support

    +   - Facebook Authenticator


    The web script framework by default uses basic HTTP authentication. However, it
    can be configured to use other forms of authentication mechanisms.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# HTTP basic authenticator


    A username and password or a ticket must be specified while accessing the web
    script through an HTTP/HTTPS request when web script needs to be invoked for an
    authenticated user.


    The authorization header must contain a username and password or a ticket.


    The ticket can be specified through a query string parameter: `alf_ticket`.


    > A ticket basically represents an authenticated user who has already performed
    successful login to Alfresco. It can be easily obtained using the out-of-the-box
    Alfresco web script via the URL `http://localhost:8080/alfresco/service/api/login?u={username}&pw={password}`.
    You just need to provide the username and password in the placeholders here before
    invoking it. Generally, while accessing the Alfresco repository from your custom
    frontend application or third-party system, this would be the first thing you
    would do in order to proceed further and invoke other web scripts with authenticated
    access.


    Servlet Runtime uses an HTTP basic authenticator to authenticate the web script
    requesting user.


    This authenticator is configured as a spring bean having ID `webscripts.authenticator.basic`
    in `web-scripts-application-context.xml`.


    > The `web-scripts-application-context.xml` file can be located at `tomcat\webapps\alfresco\WEB-INF\classes\alfresco
    inside your Alfresco installed directory. If you are using Alfresco Community
    5, it can be located under the `alfresco` package inside `alfresco-remote-api-*.jar`.


    # Alfresco explorer authenticator


    This authenticator uses the authentication mechanism that is used while logging
    to Alfresco Web Client.


    The user will be redirected to the Alfresco Web Client login page if a login is
    required.


    This authenticator is configured as a spring bean having ID `webscripts.authenticator.webclient`
    in `web-client-application-context.xml`.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The web-client-application-context.xml file can be found at tomcat\webapps\alfresco\WEB-INF\classes\alfresco
    inside your Alfresco installed directory. The location remains the same for Alfresco
    Community 5 as well.


    # JSR-168 Authenticator


    JSR-168 Authenticator expects the user has been already authenticated by the portal.
    Authenticated portal user can be found from the portal session using the alfportletusername
    attribute.


    This authenticator is configured as a spring bean having ID webscripts.authenticator.jsr168
    in web-scripts-application-context.xml.


    # JSR-168 Authenticator with Alfresco Explorer support


    Alfresco repository web scripts, depending on Alfresco Web Client functionalities,
    can be authenticated and used within the portal with the use of this authenticator.


    This authenticator is configured as a spring bean having ID webscripts.authenticator.jsr168.webclient
    in web-client-application-context.xml.


    # Facebook Authenticator


    Users will be redirected to the Facebook login page if a login is required.


    This authenticator is configured as a spring bean having ID as webscripts.authenticator.facebook
    in web-scripts-application-context.xml.


    # Web Script Container


    Web Script Container is the core of the web script framework. It plays a major
    role in executing the web script by being a central point integrating all other
    required services in order to execute web script. It identifies the appropriate
    web script and provides the root objects to the web script.


    Alfresco out-of-the-box provides two types of Web Script Containers:


    +   - Repository Container

    +   - Presentation Container'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Repository Container


    This container plays a key role in executing all the web scripts that provide
    direct access to the content residing in the Alfresco repository using the various
    services provided by Alfresco.


    It is a specialized type of container mainly to be embedded only in the Alfresco
    repository. It uses some of the core services provided by the Alfresco repository
    to support transactions and authentication for web scripts.


    Another useful and important thing that the Repository Container does is that
    it provides the repository-specific root objects available for the JavaScript
    based-controller and response templates.


    Repository Container configuration can be found in Alfresco''s web app in `web-scripts-application-context.xml`
    as a bean entry having ID `webscripts.container`.


    In the recent versions of Alfresco (Version 4 onwards), implementation class is
    `org.alfresco.repo.web.scripts.TenantRepositoryContainer`, found in `alfresco-remote-api-*.jar`.


    # Presentation Container


    Presentation Container is a lightweight implementation mainly for web scripts
    to render user interface components making remote calls to remote repositories.
    It provides the basic support to web scripts for making service call to remote
    data sources.


    This is available as the vanilla container in the spring web scripts implementation
    that gets shipped with Alfresco. This container implementation makes it easy to
    host web scripts in any environment.


    Presentation Container configuration can be found in `spring-webscripts-*.jar`
    as a spring bean entry having ID `webscripts.container` in `web-scripts-application-context.xml`.


    # Other supporting components


    The various other components that Web Script Container relies upon and which play
    a key role while the execution of web scripts are being executed are explored
    in the following sections.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Configuration service


    All relevant XML configuration files for the web script are read and parsed using
    the configuration service.


    The implementation class is `org.springframework.extensions.config.xml.XMLConfigService`.


    # Web Script registry


    Indexes for all the web scripts that are registered to the specific Web Script
    Container are maintained using the web script registry.


    The implementation class is `org.springframework.extensions.webscripts.DeclarativeRegistry`.


    # Format registry


    Format registry is the registry to get the relevant format for the specified MIME
    type and also to get the MIME type for the mentioned format.


    The `org.springframework.extensions.webscripts.FormatRegistry` class contains
    the implementation details.


    # Script processor registry


    The script processor registry provides a script processor that executes the backend
    implementation of the web script controller implemented in JavaScript.


    The implementation of the script processor registry can be found in `org.springframework.extensions.webscripts.ScriptProcessorRegistry`.


    The script processor used to execute the JavaScript-based controller is `org.alfresco.repo.jscript.RhinoScriptProcessor`.


    # Template processor registry


    The template processor registry provides the template processor that executes
    the response templates for the web script.


    The implementation of it can be located in `org.springframework.extensions.webscripts.TemplateProcessorRegistry`.


    The Default FreeMarker template processor implementation is available in `org.springframework.extensions.webscripts.processor.FTLTemplateProcessor`.'
  merge: -1
  img_proc: true
