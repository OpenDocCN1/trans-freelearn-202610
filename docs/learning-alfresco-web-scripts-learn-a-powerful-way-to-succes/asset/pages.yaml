    Finally, we executed our first web script as follows:


    +   - We invoked the web script from the web browser hitting the URL `http://localhost:8080/alfresco/service/helloworld`

    +   - The web script displayed an output as its response on a web browser


    # Understanding the web script URI


    It is important to understand the web script URI. The way the web script URI can
    be represented in a generic form is `http[s]://<host>:<port>/[<contextPath>/]/<servicePath>/[<scriptPath>]
    [?<scriptArgs>]`


    The terms used in the web script URI are explained as follows:


    +   - `http[s]`: This is the protocol to invoke the web script. This could be
    either `http` or `https`.

    +   - `host`: This is the name or address of the server where the web script is
    deployed.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   - `port`: This is the port where the web script is exposed on the server
    hosting the web scripts.

    +   - `contextPath`: This is the path where the application is deployed to. For
    data web scripts, this would generally be `/alfresco`.

    +   - `servicePath`: This is the path where the web script service is mapped with.
    Generally, this would be `/service`.

    +   - `scriptPath`: This is the path to the web script as defined in the web script
    descriptor document `*.desc.xml` under the `<url>` tag.

    +   - `scriptArgs`: These are the arguments to be passed to the web script as
    generally defined in the web script descriptor document `*.desc.xml` under the
    `<url>` tag. Arguments can be specified after the web script `scriptPath` just
    after ?.


    Now you understand the different terms that make up the web script URI, now you
    can easily understand the URI of our first web script by mapping our web script
    URI to the generic form of the web script URI. Note that we were not having arguments
    added to our first web script, hence, you would not be able to map the `scriptArgs`
    part. Let''s now take a look at what needs to be done to add the arguments to
    a web script.


    # Adding arguments to a web script


    Let''s say we want to modify our first web script to display the name too in the
    web script response, for example, **Hello! Ramesh**. It can be done in a simple
    way by passing the name as the URL argument of the web script and then using this
    argument to generate the response in the FreeMarker template. In order to do this,
    we will have to perform the following steps:


    +   1. Log in to Alfresco Share UI.

    +   2. Click on the **Repository** link from the top header.

    +   3. Edit the descriptor file `helloworld.get.desc.xml` at **Data Dictionary
    | Web Scripts Extension** location as follows:

    +   ```

    +   <webscript>

    +       <shortname>Hello World</shortname>

    +       <description>First webscript Hello world</description>

    +       <url>/helloworld?name={argumentName}</url>

    +   </webscript>

    +   ```

    +   4. Edit the FreeMarker template `helloworld.get.html.ftl` at **Data Dictionary
    | Web Scripts Extension** as follows:

    +   ```

    +   <html>

    +       <body>

    +   ```'
