- pgno: 77
  md: "An example of the `family` tag is as follows:\n\n```\n<family>CMIS</family>\n\
    ```\n\nWhen you access the http://localhost:8080/alfresco/service/index page,\
    \ you should find an option to browse the web scripts based on family. For example,\
    \ you will find a link **Browse 'CMIS' Web Scripts** to take a look at all the\
    \ web scripts categorized to be of the CMIS family.\n\n# <cache>\n\nCaching is\
    \ a very good feature that helps to avoid regenerating a response for each request.\
    \ The web script framework in Alfresco uses the caching mechanism defined by HTTP.\
    \ For a web script, the required level of caching can be provided using this optional\
    \ element. When a web script is invoked, the web script framework translates the\
    \ declaration of this element to an appropriate response header to manage the\
    \ cache. The cache tag with its child elements will appear in the description\
    \ document as follows:.\n\n```\n<cache>\n    <never>false</never>\n    <public>true</public>\n\
    \    <mustrevalidate/>\n</cache>\n```\n\nThe different optional child elements\
    \ of this tag are explained in the subsequent sections.\n\n# never\n\nThis indicates\
    \ whether a web script response should be cached or not. The default value is\
    \ `true`, which means that a web script response will never be cached. An alternate\
    \ value is `false` to specify allowing of caching of a web script response.\n\n\
    # public\n\nThis is used to specify whether the authenticated web script response\
    \ should be cached in a public cache or not. The `true` value indicates that the\
    \ web script response can be cached, while `false` indicates the web script response\
    \ can not be cached. The default value is `false`.\n\n# mustrevalidate\n\nThis\
    \ is used to indicate whether a cache should revalidate its version of the web\
    \ script response in order to provide the fresh response data. The `true` value\
    \ indicates that there must always be a validation, while `false` indicates there\
    \ might be a validation. The default value is always `true`."
  merge: -1
  img_proc: true
- pgno: 78
  md: '# <negotiate>


    For the specific web script response format, the accept header MIME type can be
    provided using this optional element. There can be multiple entries of this element
    in the description document. It is mandatory to provide the value for this tag.
    The value will hold the type of response format. Also, it is mandatory to provide
    the accept attribute that mentions the MIME type.


    ```

    ```xml

    <negotiate accept="text/html">html</negotiate>

    <negotiate accept="text/xml">xml</negotiate>

    ```

    ```


    With the definition of one negotiate element in the description document, content
    negotiation is enabled.


    > It is interesting to understand how the negotiate and format elements are correlated.
    Each web script returns result in a response stream and it might be encoded based
    on the MIME type. If during invoking a web script, any hint is not provided on
    the MIME type, then the web script framework will use its predefined encoding.
    While invoking a web script, it is possible to provide the hint to let the script
    framework know about the MIME type for response. Using the format element, as
    a URL extension or as a format argument, the response format can be specified,
    which is mapped to a MIME type in the web script framework. Another option is
    to specify the Accept header, which can be done using the negotiate element.


    # <lifecycle>


    The lifecycle element is to describe the lifecycle stage of a web script. This
    element can be specified in the description document as follows:


    ```

    ```xml

    <lifecycle>sample</lifecycle>

    ```

    ```


    Web scripts in their development lifecycle can initially be in draft state, then
    are fully used in the production mode, and at the end are deprecated when they
    are not used anymore. These stages can be specified for web scripts using this
    element. Different possible values for this element are shown in the subsequent
    sections.


    # none


    This indicates that the web script is not part of any lifecycle.


    # sample


    This mentions that the web script is a sample web script and should not be used
    for production use.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# draft


    This specifies that the web script is still in the experimental stage and not
    yet fully completed.


    # public_api


    This determines that the web script is part of the Alfresco public API, and hence,
    it is fully tested and must be stable.


    # draft_public_api


    This mentions that it is going to be a part of the Alfresco public API but it
    is not yet fully complete or still some changes are in progress.


    # deprecated


    This indicates the web script is deprecated and should not be used and that this
    web script may be removed from the future Alfresco versions.


    # internal


    This mentions that the web script is for Alfresco internal use only. Hence, for
    different versions, it could have been changed as per the Alfresco internal usage,
    and it''s a possibility that it can be changed in future versions of Alfresco.


    > The <lifecycle> element is an optional one. Generally, for the custom web scripts
    that you will develop for your project, it is not mandatory to specify the lifecycle
    value for a web script. Hence, you might not be using this element.


    # <formdata>


    In the description document of a web script, you can specify the formdata tag
    as follows:


    ```

    <formdata multipart-processing="false" />

    ```


    It has an attribute called multipart-processing. This can be used to specify whether
    multipart form data processing is turned on or off for the web script. Optional
    values are true, which indicates that multipart processing for form data is turned
    on and false, which indicates that it is off. The default value is true.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "# <args>\n\nThe args element is used generally for documentation purposes to\
    \ describe the arguments passed to the web script. It has the child element arg,\
    \ which has child elements name, which specifies the name of the argument, and\
    \ description, which specifies a description of the argument. The args tag with\
    \ its child element will appear in the description document as follows:\n\n```\n\
    <args>\n  <arg>\n    <name>name</name>\n    <description>the name to display for\
    \ helloworld webscript</description>\n  </arg>\n</args>\n```\n\n# <requests>\n\
    \nThe requests element can be used to specify the collection of request types.\
    \ It has request as a child element, which has type as an attribute. This tag\
    \ will appear in the description document as follows:\n\n```\n<requests>\n  <request\
    \ type=\"cmis.atomentry\" />\n</requests>\n```\n\n# <responses>\n\nThe responses\
    \ element can be used to specify the collection of response types. It has response\
    \ as a child element, which has type as the attribute. This tag will appear in\
    \ the description document as follows:\n\n```\n<responses>\n  <response type=\"\
    cmis.atomentry\"/>\n</responses>\n```\n\n# kind\n\nThe kind attribute is an optional\
    \ attribute to the root tag <webscript>. A special kind of implementation can\
    \ be done for web scripts, which is basically a Java backend implementation. For\
    \ example, in a scenario where you want to develop web scripts that need to return\
    \ large content as the response, a Java-backed web script implementation can be\
    \ developed for this scenario. The kind attribute allows you to provide a name\
    \ for this implementation. Now, for any web script you are developing that has\
    \ to render large amount of content, the kind attribute can be used in the description\
    \ document to explicitly mention that it should use the custom Java backend implementation\
    \ created."
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Here is an example of how the `kind` attribute is used in the out-of-the-box
    Alfresco web script, `tomcat/webapps/alfresco/WEB-INF/classes/alfresco/templates/webscripts/org/alfresco/repository/thumbnail/thumbnail.get.desc.xml`,
    inside your Alfresco installation directory. If you are using Alfresco Community
    5, the `thumbnail.get.desc.xml` file can be located under the `alfresco` package
    in `alfresco-remote-api-*.jar`.


    ```

    <webscript kind="org.alfresco.repository.content.stream">

    ```


    # Controller implementation – not mandatory!


    The actual business logic for a web script resides in the web script controller.
    The main functionalities such as interacting with repository, for example, to
    query the repository, add content, update content, delete content, and so on are
    part of the web script controller implementation.


    There are two types of controller implementations possible to implement while
    creating web scripts in Alfresco:


    +   - The JavaScript-backed controller

    +   - The Java-backed controller


    # The JavaScript-backed controller


    JavaScript-backed controller is known as the web script controller script that
    has the web script business logic implemented in a JavaScript file. Alfresco provides
    a set of JavaScript APIs that can be used in the web script controller to interact
    with the Alfresco backend repository. A JavaScript controller can read the query
    string parameters of the web script URI, perform the required repository operations,
    and populate the model object to render the response.


    We have already seen the basic implementation of JavaScript controller for our
    hello world web script.


    # Understanding when to use the JavaScript controller


    Here are a few generic points that explain when you should go for JavaScript controller
    implementation for your web script:


    +   - When the repository operations you are trying to perform can be easily done
    using the available Alfresco JavaScript API, you might choose this controller'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Building Blocks of Web Scripts


    +   - The JavaScript controller has an advantage that if you have developed a
    web script that has a controller using the JavaScript implementation, you do not
    need to restart the server to deploy and use your web script

    +   - No additional tooling is required; you can simply use any editor to create
    the web script, no compilation is required, and is easy to deploy in the repository


    # The Java-backed controller


    The Java-backed controller is another type of controller implementation possible
    to implement for a web script that might have the complete business logic processing
    implemented in Java.


    When you are implementing a Java-backed controller, you will have access to all
    the content application services available in Alfresco. Business logic implementation
    for a web script can be provided in JavaScript- or Java-based controller; the
    only difference is that Java-backed controller is implemented in Java and it has
    access to all the available content application services in Alfresco.


    # Understanding when to use a Java-backed controller


    Let''s take a look at a few points about when you should go for the Java-backed
    controller implementation for your web script:


    +   - Generally, when the JavaScript controller cannot do the repository operations
    you want to do using the available Alfresco JavaScript API, you should implement
    the Java-backed controller.

    +   - When you want to override the rendering of a response, for example, rendering
    large content in response, you should use this controller.

    +   - Consider that you will require experience in Java programming. You will
    also require compilation of the Java code, classpath deployment of web scripts,
    and even server restart in order to use Java-backed web script. If all of this
    looks fine to achieve your business functionality in time, then you can go for
    implementing Java-backed controller.


    > A web script can also have both JavaScript- and Java-backed controllers. In
    such a scenario, the Java-backed controller will first get executed and then JavaScript-based
    implementation gets executed when the web script is invoked.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Response templates – yes, they are required!


    Response templates are basically used to render the web script response. In MVC
    terms, response templates play a role of views. The output of the web script is
    rendered in the required formats using the web script response templates.


    It is possible to have multiple response templates for a web script, and based
    on the requested response content type while invoking a web script, a response
    can be rendered using the appropriate response template.


    Response template also has access to web script query string parameters along
    with the data items provided by the controller script and access to some common
    content repository entry points.


    We have already seen rendering response for our hello world web script.


    > For JavaScript-based web scripts, response templates are always required. There
    are certain implementations of Java-backed web scripts where response can be directly
    rendered from the Java controller. In such case, there is no need to specify response
    template for the web script. We are going to cover Java-backed web scripts in
    detail in Chapter 6, Creating Java-backed Web Scripts.


    # I18N for a web script – it''s optional


    Internationalization is a cool feature that can be very useful while creating
    web scripts.


    There may be times when you are required to develop a web script that will directly
    be used by the end users, and hence, you need a human-readable web script response
    in the user''s language. No worries, it is possible to provide I18N support to
    the web scripts in Alfresco, and hence, you can have the text in the response
    rendered in the preferred supported user languages.


    We will also extend our hello world web script to have internationalization support
    and will get understanding of how to make a web script render a response using
    internationalization.


    There are two things to be done in order to achieve this:


    +   - Creating a resource bundle for different languages

    +   - Modifying the response template to use the labels from the resource bundle'
  merge: -1
  img_proc: true
- pgno: 84
  md: "# Adding a resource bundle for the hello world web script\n\nIn order to add\
    \ a resource bundle for a web script, the first thing we need to do is create\
    \ a resource bundle for the different languages.\n\nAfter logging in to Alfresco\
    \ Share, create `helloworld.get.properties` at the **Repository | Data Dictionary\
    \ | Web Scripts Extensions** location, and add the following content to it:\n\n\
    ```\ngreeting.title=Hello!\nemail.title=email address\n```\n\nNow, at the same\
    \ location, create `helloworld.get_de.properties` and add the following content\
    \ to it:\n\n```\ngreeting.title=Hallo!\nemail.title=E-Mail-Adresse\n```\n\nWe\
    \ have just created two properties files and made the text able to be rendered\
    \ in the web script response in two different languages: English and German.\n\
    \n# Modifying the response template to use labels\n\nNow, in order to use the\
    \ labels added in the resource bundle, we will have to modify the response template.\
    \ Perform the following steps to modify the response template for the hello world\
    \ web script:\n\n+   1. Modify `helloworld.get.html.ftl` available at the **Repository\
    \ | Data Dictionary | Web Scripts Extensions** location as follows:\n\n```\n<html>\n\
    \  <body>\n    <p>${msg(\"greeting.title\")} ${args.name}.</p>\n    <p>${msg(\"\
    email.title\")}: ${email}</p>\n  </body>\n</html>\n```\n\nWe have just modified\
    \ our response template to use the text from the resource bundle.\n\n+   2. Now,\
    \ go to `http://localhost:8080/alfresco/service/index` and click on the **Refresh\
    \ Web Scripts** button.\n\n+   3. To test this, temporarily change the preferred\
    \ browser language to Germany de-DE and hit the `http://localhost:8080/alfresco/service/helloworld?name=Ramesh`\
    \ URL. You should see the response rendered using the labels rendered from German\
    \ properties file we created."
  merge: -1
  img_proc: true
- pgno: 85
  md: "# Configuration document – it's optional\n\nIt is possible to specify configuration\
    \ parameters for Alfresco web scripts. They can be accessed from the controller\
    \ as well as the response template. Just to understand the concept, let's take\
    \ a simple example where you want to display the server environment (development,\
    \ testing, staging, or production server) in your web script output. One thing\
    \ that you can do is specify the same in controller, but ideally, a controller\
    \ should not worry about such configurations. Instead, this can be handled separately\
    \ and the controller or template should just use the values. With the web script\
    \ configuration document, it is possible to do script specific configuration.\n\
    \nCreate helloworld.get.config.xml at the Repository | Data Dictionary | Web Scripts\
    \ Extensions location and add the following content to it:\n\n```\n<properties>\n\
    \    <envname>Dev</envname>\n</properties>\n```\n\n# Accessing configuration in\
    \ a controller\n\nIn the JavaScript controller, the envname property can be accessible\
    \ as follows:\n\n```\nvar env = new XML(config.script);\nlogger.log(env.envname);\n\
    ```\n\nYou can set the value of envname property in the model object and render\
    \ the value on the response template.\n\n# Accessing configuration in a template\n\
    \nIn a scenario when no controller implementation is available for the web script,\
    \ the envname property can be accessed directly in the response FreeMarker template\
    \ as follows:\n\n```\n${config.script[\"properties\"][\"envname\"]}\n```\n\nWe\
    \ have seen two different ways to display value from the web script configuration.\
    \ I am sure you can now easily test them in the hello world web script and see\
    \ the result."
  merge: -1
  img_proc: true
