- pgno: 137
  md: '+   2. To enable the logs to JavaScript-backed web scripts, you should set
    log4j.logger.org.alfresco.repo.jscript to debug and also log4j.logger.org.alfresco.repo.jscript.ScriptLogger
    to debug in log4j.properties.

    +   3. Restart the server and then hit your web script; you should be able to
    see the logger statements from the JavaScript controller in the catalina logs.


    # Remote debugging on the server


    Sometimes, only using the logger statements might not suffice to identify an issue,
    and you might also want to step through the code in order to find the issue. In
    such cases, you will need to do remote debugging of your code deployed on the
    server.


    In order to be able to remote debug Java-backed web scripts, you should first
    set the following entry in the catalina.bat file in Windows and catalina.sh in
    Linux:


    ```

    set DEBUG_OPTS=-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=8888

    ```


    Then, restart the server. This will enable you to remote debug the Java code for
    your web script from your IDE such as Eclipse.


    To debug the server-side JavaScript for your JavaScript-backed controller, you
    can use the Alfresco JavaScript debugger. You can enable the debugger in the following
    two ways:


    +   1. In the log4j.properties file, set log4j.logger.org.alfresco.repo.web.scripts.AlfrescoRhinoScriptDebugger
    to on. This will display the debugger UI on the server startup. Also, set log4j.logger.org.alfresco.repo.jscript.ScriptLogger=debug.

    +   2. Hit the debugger web script URL, http://localhost:8080/alfresco/service/api/javascript/debugger.
    It will display the Enable button on the screen. Click on it to open up the Alfresco
    JavaScript debugger UI.


    It''s very easy to debug through the JavaScript controller code using this debugger.


    You just need to open the controller file by going to File | Open, and add the
    debug points to it. Now, hit the web script you want to debug.


    The control will come to the debugger and you can now debug the code. There are
    options available such as Step Into, Step Over, or Step Out that will be helpful
    while debugging. Also, you can watch the value for the variables while debugging.'
  merge: -1
  img_proc: true
