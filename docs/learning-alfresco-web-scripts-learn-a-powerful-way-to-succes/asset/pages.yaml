- pgno: 100
  md: 'When developing web scripts in Alfresco, there are two choices to write the
    controller implementation for a web script: a JavaScript-backed controller and
    Java-backed controller. Depending on your preference, you can choose to develop
    controller implementation from these two when required. With a JavaScript-backed
    controller, the development cycle can get faster compared to a Java-backed controller.
    There is a wide range of things that you can do with the Alfresco JavaScript API
    inside the JavaScript-based controller. However, there might be times when this
    is not enough for what you want to implement for your business requirement. In
    such cases, you can use the Java-backed web script, wherein it is possible to
    use all the Alfresco services such as NodeService, SearchService, ContentService,
    and others, and the web script can be built up as required.


    While working on projects where you might end up developing a large number of
    web scripts, you have to decide which type of controller implementation you will
    be implementing based upon the feasibility of the project execution. You can choose
    to develop JavaScript controller-based web scripts to speed up the development
    and develop Java-backed web scripts only in the scenario when a JavaScript API
    does not fit your requirement. Alternatively, you can always use Java-backed web
    scripts in order to have a standardized development approach for your project.


    It is important to have an understanding of implementing web scripts with both
    types of controllers. We have already seen how a JavaScript-backed controller
    can be used for a web script when we created a hello world web script earlier.
    Now, it''s time for a Java-backed web script. In this chapter, we will implement
    a Java-backed web script in Alfresco for a sample use case so that you will get
    an understanding about how to create a web script in Alfresco step by step that
    has a Java-backed controller implementation. You can then develop Java-backed
    web scripts for the business requirements in your project as required.


    # Use case scenario


    We will take a very simple scenario to get an overall understanding of creating
    a web script with a Java-backed controller. Our main objective is to understand
    how to create Java-backed web scripts and how to use Alfresco APIs inside the
    Java-backed controller. Let''s get started.


    You must be aware that Alfresco stores the metadata of the content in a database
    and stores the actual content on a filesystem. Now, once the content is available
    in Alfresco, you might be interested to know its location and find out where it
    actually resides on the filesystem. So, the next time you are discussing content
    in Alfresco with someone, you can actually showcase the mapping of content in
    Alfresco with its actual physical location on filesystem under content store.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Also, while working on projects with external application integration with
    Alfresco, you might at some point in time want to know the size of the content
    as well, along with its location on the filesystem.


    Let''s take this as our use case scenario to build our Java-backed web script.
    We basically want to create a web script in Alfresco that will provide the actual
    location on the filesystem for the given node and size of its content.


    # Web script functionality at a high level


    After understanding the overall scenario that we want to achieve, let''s understand
    how this web script will work at a high level:


    +   - A parameter nodeid needs to be passed as a request argument to the web script.

    +   - The web script will be accessed by authenticated users only.

    +   - If a user has at the minimum read access to a given node, then only the
    physical location of the filesystem and content size will be provided for the
    node.

    +   - A response will be provided in JSON as well as XML format. The format can
    be specified at the time of invoking the web script.


    # Getting ready


    Let''s just brush up on our knowledge of web script building blocks and identify
    the components that need to be created for this web script as follows:


    +   - Each web script needs to have a description document. So, the first step
    is to create a web script description document.

    +   - The web script needs to return a response in the XML and JSON formats, so
    it is necessary to provide the response template to render an XML response and
    a response template to render a JSON response.

    +   - The entire logic to get the filesystem location and size will reside in
    the web script controller. In this case, a Java-backed web script controller needs
    to be created for business logic processing.

    +   - In order to register a Java-backed controller with the web script, a spring
    configuration is required. Hence, a spring context file needs to be created to
    register a Java-backed controller with the web script. It is not necessary to
    create a new spring context file always. You can have a context file based on
    the logical module of your system and all the web scripts belonging to this module
    could be registered in that context file.'
  merge: -1
  img_proc: true
- pgno: 102
  md: "For this web script, you can use your favorite editor to create the required\
    \ files for the web script and develop the controller Java class. We will cover\
    \ setting up the development environment using Maven in Chapter 9, Mavenizing\
    \ Web Scripts. In this chapter, we will mainly aim to get an understanding of\
    \ how to implement a Java-backed web script. You need to have spring-webscripts-*.jar\
    \ and alfresco-data-model-*.jar added in your class path in order to be able to\
    \ compile the controller Java class. Both these JARs can be found at the tomcat\\\
    webapps\\alfresco\\WEB-INF\\lib location in your Alfresco installation. The *\
    \ symbol in the JAR name refers to the version number.\n\n# Creating a description\
    \ document\n\nAs the primary purpose of the web script is to return the content\
    \ location, let's use the web script ID as contentlocation. We will use the HTTP\
    \ GET method as we are going to retrieve the information for a node.\n\nAs a first\
    \ step, create a description document for the web script. Create a file named\
    \ contentlocation.get.desc.xml that has the following content:\n\n```\n<webscript>\n\
    \    <shortname>Get content location and size</shortname>\n    <description>Gets\
    \ the physical location for the content and size of the content</description>\n\
    \    <url>/getContentLocation?nodeid={nodeid}</url>\n    <url>/getContentLocation.json?nodeid={nodeid}</url>\n\
    \    <url>/getContentLocation.xml?nodeid={nodeid}</url>\n    <format default=\"\
    json\">extension</format>\n    <authentication>user</authentication>\n</webscript>\n\
    ```\n\nLet's understand what we have just done. We have created a description\
    \ document that provides a human-readable name and brief information about the\
    \ web script in the shortname and description tags respectively.\n\nWe have defined\
    \ three URLs that can be used to invoke a web script. The first one is the default\
    \ URL and the other two are explicitly mentioned to get a response in JSON and\
    \ XML formats respectively. Please note that the first and second URL will produce\
    \ the same output.\n\nThe default response format is specified as json. The value\
    \ extension for the format tag mentions that a response content type can be specified\
    \ as an extension to the web script ID while invoking the web script."
  merge: -1
  img_proc: true
- pgno: 103
  md: "Also most importantly, a web script expects an argument named `nodeid` when\
    \ the web script is invoked.\n\n# # Creating a response template\n\nAs a rule\
    \ of thumb for a web script, we have to follow the naming convention as expected\
    \ by the web script framework in Alfresco. As the web script is supposed to return\
    \ the response in the JSON and XML formats, we need to create two response templates\
    \ for the web script. Following the naming conventions, there are two files to\
    \ be created — `contentlocation.get.json.ftl` and `contentlocation.get.xml.ftl`\
    \ as response templates. Return `filesystem_location` and size in the response\
    \ as follows:\n\n+   1. To create a JSON response template, create a file named\
    \ `contentlocation.get.json.ftl` that has the following content:\n\n```\n```json\n\
    {\n    \"content\" :\n    {\n        \"filesystem_location\" : \"${contentFSLocation}\"\
    ,\n        \"size\" : ${contentSize}\n    }\n}\n```\n```\n\n+   2. To create an\
    \ XML response template, create a file named `contentlocation.get.xml.ftl` that\
    \ has the following content:\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<content>\n    <filesystem_location>${contentFSLocation}</filesystem_location>\n\
    \    <size>${contentSize}</size>\n</content>\n```\n```\n\nWe have just created\
    \ two response templates as required to return the output for the web script.\
    \ The names used inside `${}` in the preceding code snippets are the model variable\
    \ names to be set from the controller class. Make sure that while implementing\
    \ a controller, the model variable names are set with the same name as used in\
    \ the response templates.\n\n# # Creating a Java controller\n\nNow it's time to\
    \ do some Java coding. Before we start the actual coding, it's always a good idea\
    \ to quickly identify the logic that has to be taken care of by the code we are\
    \ going to write. This exercise really does help a lot."
