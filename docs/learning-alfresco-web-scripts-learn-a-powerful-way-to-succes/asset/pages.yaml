    # Summary


    In this chapter, we have gone through the possible deployment options for web
    scripts in Alfresco and got an understanding of how the web script framework in
    Alfresco decides the precedence for the web scripts when deployed at multiple
    locations. We also looked at some of the factors that will help you choose the
