- pgno: 116
  md: '# Understanding JavaScript-based Web Scripts in Detail


    The web script framework in Alfresco makes it easy to create, access, update,
    and delete content residing in the repository using JavaScript-backed web scripts.
    The JavaScript-backed web script will be very helpful when you need to do some
    kind of hotfixes without bringing down the production system. Another cool feature
    of JavaScript-backed web scripts is that you can have them deployed in the repository
    and can directly edit them in line using the Alfresco user interface. There is
    no need to depend on any specific editor while developing web scripts that have
    a JavaScript-backed controller. You can use any of your favorite editors to create
    them. The major advantage of using a JavaScript-backed web script is that it speeds
    up the development cycle of web scripts. You need not worry about compiling them
    the way you do with your Java-backed web scripts. While developing JavaScript-backed
    web scripts, you can leverage the Alfresco provided JavaScript APIs. There is
    a wide range of APIs provided by Alfresco to make repository access easy and convenient
    from JavaScript-controller-backed web scripts.


    In this chapter, first we will find out the possible things that you can do using
    JavaScript APIs. We will learn how to identify the available JavaScript APIs in
    Alfresco. We are going to take a look at the root objects available in Alfresco.
    This will help us access the available JavaScript API and effectively develop
    web scripts in less time; also, it will make it easier to interact with the Alfresco
    repository. We will also look at other helpful root objects provided by the web
    script framework in Alfresco. We will see few code examples that will help you
    understand how you can make use of Alfresco JavaScript APIs in your web script.
    At the end, we will go through the steps to understand how to create a custom
    JavaScript extension, which is a very important and useful thing to know.


    # Understanding what you can do with the

    JavaScript API


    While developing web scripts in Alfresco, the repository JavaScript APIs provided
    by Alfresco will help you perform a lot of the following actions at a high level
    as listed in the following list:


    +   - Creating a folder

    +   - Creating content

    +   - Making a copy of a node

    +   - Moving a node from one location to another

    +   - Deleting a node

    +   - Finding a node

    +   - Performing searches against a repository'
  merge: -1
  img_proc: true
- pgno: 117
  md: "+   - Traversing through the node hierarchy\n+   - Modifying properties on\
    \ a node\n+   - Adding or removing an aspect on a node\n+   - Creating, modifying,\
    \ or removing associations for a node\n+   - Getting permission for a node\n+\
    \   - Modifying permission for a node\n+   - Creating and removing groups\n+ \
    \  - Creating and removing users\n\nBasically, you can think of Alfresco JavaScript\
    \ APIs as a wrapper to access Alfresco services from the JavaScript-backed controller.\
    \ Alfresco uses the Mozilla Rhino JavaScript engine for Java, which allows JavaScript\
    \ files to access Alfresco Java objects using a simple bean-style approach in\
    \ scripting. Also, this makes it simpler to develop JavaScript (ECMA Script) 1.6\
    \ compatible files to create, update, retrieve, and delete Alfresco repository\
    \ objects using Alfresco JavaScript APIs.\n\n# JavaScript APIs in Alfresco\n\n\
    As a developer, you must always be interested in debugging through the code in\
    \ order to get an understanding of its workings instead of directly having the\
    \ list of APIs and simply using it. So, here we are going to take a look at how\
    \ to identify JavaScript APIs in Alfresco. Now, let's find the available JavaScript\
    \ APIs provided by Alfresco that we can use in a JavaScript controller while developing\
    \ web scripts.\n\n# Identifying JavaScript APIs\n\nIn the Alfresco code base,\
    \ the simplest way to identify any JavaScript API is through the bean definition,\
    \ where it will have the parent specified as baseJavaScriptExtension. The way\
    \ the bean entry works is—any JavaScript API can be accessed through the root\
    \ object defined for it. The property name defined under the extensionName property\
    \ is the root object to access the relevant API.\n\nLet's discuss the bean definition\
    \ entry for a JavaScript API in order to get a better understanding of how the\
    \ JavaScript API is defined. The following is the code snippet of one such API\
    \ available in Alfresco, which will give you a clear understanding of how a JavaScript\
    \ API is available and how you can use it in the controller:\n\n```\n<bean id=\"\
    actionsScript\" parent=\"baseJavaScriptExtension\" class=\"org.alfresco.repo.jscript.Actions\"\
    >\n    <property name=\"extensionName\">\n        <value>actions</value>\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "```\n</property>\n<property name=\"serviceRegistry\">\n    <ref bean=\"ServiceRegistry\"\
    />\n</property>\n</bean>\n```\n\nThe following are some important points we can\
    \ understand from this code snippet:\n\n+   - This has the parent defined as `baseJavaScriptExtension`.\n\
    +   - All the methods that are available to the JavaScript controller are defined\
    \ in the Java class `org.alfresco.repo.jscript.Actions`.\n+   - Dependency of\
    \ any Alfresco services can be injected to the bean definition, which can be used\
    \ in the Java class to perform an operation against the repository.\n+   - The\
    \ JavaScript controller will use the value provided under the `extensionName`\
    \ property in the bean definition to access the methods exposed by the Java class.\
    \ This value provided under the `extensionName` property is referred to as a root\
    \ object available in the JavaScript controller to access the JavaScript API.\n\
    \nNow, with this understanding, you have the key to using JavaScript APIs for\
    \ your web script. You just unlocked how Java objects are being accessed from\
    \ the JavaScript controller.\n\n# Root objects to access JavaScript APIs\n\nNow\
    \ you understand how to identify JavaScript APIs in the Alfresco code base, let's\
    \ take a look at all the root objects available to access JavaScript APIs from\
    \ the JavaScript controller. In your Alfresco installed directory, you can find\
    \ the generally used JavaScript APIs defined in `script-services-context.xml`\
    \ at `tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco`."
  merge: -1
