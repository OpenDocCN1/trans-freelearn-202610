- pgno: 40
  md: '# It''s Time for the First Web Script


    Next, we deployed the web script as follows:


    +   - We have deployed the required files to create a web script in the Alfresco
    repository

    +   - The descriptor document and FreeMarker template are placed in **Data Dictionary
    | Web Scripts Extensions**


    > Web script files can be directly created/uploaded in the Alfresco repository
    in **Data Dictionary | Web Scripts Extensions** or web script files can be created
    and deployed on the filesystem through the code base as well.


    We then registered the web script as follows:


    +   - We hit the URL `http://localhost:8080/alfresco/service/index` and clicked
    on the **Refresh Web Scripts** button to register the first web script


    > There are two ways to register a web script. One is through hitting the URL
    `http://localhost:8080/alfresco/service/index` and clicking on the **Refresh Web
    Scripts** button. Another way is to deploy the web script files through the code
    base/repository and restart the server. A server restart will also register the
