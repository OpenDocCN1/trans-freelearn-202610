- pgno: 165
  md: '> For Alfresco repository web scripts, the `org.alfresco.repo.web.scripts.RepositoryContainer`
    implementation and for Alfresco Share web script, `org.springframework.extensions.webscripts.PresentationContainer`,
    are used by the web script engine as the web script container.


    # # Custom authenticator implementation


    In order to access the web script securely, authentication is essential. The web
    script authenticator is the component behind providing the authenticated access
    to the web script. Let''s first understand how authenticator implementation is
    referenced by the web script framework. If you take a look at web.xml under `tomcat\webapps\alfresco\WEB-INF`
    location inside your Alfresco-installed directory, you will find the `<param-name>authenticator</param-name>`
    entry under the `<init-param>` entries of a servlet, which is basically a request
    dispatcher servlet for web script execution. A request dispatcher servlet will
    use the mentioned authenticator while creating the web script runtime instance
    to serve the web script request.


    The Spring bean ID for authenticator can be found under the `<param-value>` tag
    in web.xml under a servlet''s init-param entries. The Spring bean entry can be
    found in `web-scripts-application-context.xml` or `web-client-application-context.xml`.
    Bean instances of an authenticator are created using a factory design pattern
    implementation. Hence, you will find the class name of the factory class against
    the bean ID. For example, the following is the code snippet for a Spring bean
    entry for the bean ID, `webscripts.authenticator.basic`:


    ```

    ```xml

    <bean id="webscripts.authenticator.basic" class="org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory">

    ```

    ```


    All the authenticator-related factory classes implement the `org.springframework.extensions.webscripts.servlet.ServletAuthenticatorFactory`
    interface and implement the `create(WebScriptServletRequest req, WebScriptServletResponse
    res)` method to return the appropriate authenticator object. You will find the
    inner class implementation inside factory classes to represent the authenticator
    object provided by that factory class.


    Now, let''s take a look at the service provider interface to create an authenticator
    object. In the web script framework, to create a new authenticator, the `org.springframework.extensions.webscripts.Authenticator`
    interface must be implemented and must provide the implementation for the `authenticate()`
    and `emptyCredentials()` methods of this interface.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Now that we have an overall understanding of how the authenticator implementation
    is used in the web script framework, let''s now take a look at the high-level
    steps required to create a custom authenticator and let the web script framework
    use the newly created authenticator while serving web script requests. Perform
    the following steps:


    +   1. Create a custom authenticator factory class that implements the org.springframework.extensions.webscripts.Authenticator.ServletAuthenticatorFactory
    interface.

    +   2. Provide an implementation for the following method; at this moment, just
    make it to return null to avoid showing any errors:

    +   ```

    +   public Authenticator create(WebScriptServletRequest req,

    +   WebScriptServletResponse res)

    +   ```

    +   3. Provide a Spring bean entry in a Spring context file for this class as
    follows:

    +   ```

    +   <bean id="webscripts.custom.authenticator" class="fully qualified class name
    for custom authenticator factory class">

    +   ...

    +   </bean>

    +   ```

    +   4. Inside the custom authenticator factory class, create a custom authenticator
    class that will implement org.springframework.extensions.webscripts.Authenticator
    and provide an implementation for the following two methods:

    +   ```

    +   public boolean authenticate(Description.RequiredAuthentication required, boolean
    isGuest)

    +   public boolean emptyCredentials()

    +   ```

    +   5. Now, inside the method we implemented in the step 2, instead of returning
    null, return the new object of the custom authenticator we just implemented.

    +   6. In order to let the web script request dispatcher servlet use the custom
    authenticator, modify the web.xml entry for the servlet and provide the bean ID
    of the custom authenticator factory as its authenticator init-param''s value,
    as defined in step 3.'
  merge: -1
  img_proc: true
- pgno: 167
  md: "![](img/f02f759059b86af67e38b543d498a0d8_167_0.png)\n\n> In order to get a\
    \ better understanding about what we just learned to create a custom authenticator,\
    \ you should trace through the out-of-the-box implementation code to see how `BasicHttpAuthenticator`\
    \ is implemented and used by the web script framework. Here are the filenames\
    \ to take a look at for your reference: refer to the `apiServlet` entry in `web.xml`,\
    \ `web-scripts-application-context.xml`, `org.alfresco.repo.web.scripts.servlet.BasicHttpAuthenticatorFactory`,\
    \ `org.springframework.extensions.webscripts.servlet.WebScriptServlet`.\n\n# #\
    \ Custom script processor implementation\n\nWe should now have a high-level understanding\
    \ that the web script framework in Alfresco supports JavaScript-backed web scripts\
    \ and uses the RhinoScript processor to execute JavaScript-backed web scripts.\
    \ In the out-of-the-box web script framework implementation as provided in `spring-webscripts-*.jar`,\
    \ the script processor implementation is `org.springframework.extensions.webscripts.processor.JScriptProcessor`\
    \ and is registered with the script processor registry. However, in Alfresco,\
    \ there is an extended implementation to register the script processor with the\
    \ web script processor registry in the web script framework in Alfresco. Let's\
    \ try to understand how the JavaScript processor is configured with the web script\
    \ framework in Alfresco. If you take a look at `web-scripts-application-context.xml`\
    \ under `tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco` inside your Alfresco-installed\
    \ directory, there is a bean entry for the `org.springframework.extensions.webscripts.ScriptProcessorRegistrar`\
    \ class. If you are using Alfresco Community 5, this file is located in `alfresco-remote-api-*.jar`\
    \ under the `alfresco` package. The following is the code snippet of its bean\
    \ entry from `web-scripts-application-context.xml`:\n\n```\n```xml\n<bean class=\"\
    org.springframework.extensions.webscripts.ScriptProcessorRegistrar\" init-method=\"\
    init\">\n    <property name=\"registry\" ref=\"webscripts.repo.registry.scriptprocessor\"\
    \ />\n    <property name=\"factory\" ref=\"webscripts.repo.scriptprocessor.factory\"\
    \ />\n    <property name=\"name\"><value>Repository Script Processor</value></property>\n\
    \    <property name=\"extension\"><value>js</value></property>\n</bean>\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 168
  md: "The ScriptProcessorRegistrar class is responsible for registering the repository\
    \ script processor for JavaScript with the web script framework. In the ScriptProcessorRegistrar\
    \ class, ScriptProcessor provided by the factory class bean ID, webscripts.repo.scriptprocessor.factory,\
    \ is registered with the script processor registry class as specified with the\
    \ bean ID, webscripts.repo.registry.scriptprocessor.\n\nScriptProcessor, returned\
    \ by the previous factory class, is represented as the following bean entry:\n\
    \n```\n<bean id=\"webscripts.repo.scriptprocessor\" class=\"org.alfresco.repo.web.scripts.RepositoryScriptProcessor\"\
    >\n    <property name=\"scriptService\" ref=\"scriptService\" />\n    <property\
    \ name=\"searchPath\" ref=\"webscripts.searchpath\" />\n</bean>\n```\n\nWhen the\
    \ JavaScript-backed controller is executed, in the internal execution by the web\
    \ script framework, the executeScript method of the ScriptProcessor class is invoked\
    \ in the AbstractWebScript class. If you take a look at the executeScript method\
    \ in the RepositoryScriptProcessor class, it invokes the executeScript method\
    \ call to the org.alfresco.repo.processor.ScriptServiceImpl class' executeScript\
    \ method, passing the initial argument as javascript. Going further, take a look\
    \ at the scriptService bean entry in script-services-context.xml; there is a default\
    \ script processor name called javascript. The bean ID named javaScriptProcessor\
    \ contains the entry for the javascript processor implementation, org.alfresco.repo.jscript.RhinoScriptProcessor.\
    \ This processor is registered using registerScriptProcessor of ScriptService\
    \ invoked from the BaseProcessor class, which is the parent class of RhinoScriptProcessor.\n\
    \nWe have just taken a look at the in-depth technical details of how the javascript\
    \ processor is registered and used in the web script framework in Alfresco. In\
    \ order to create a custom script processor and register it with the web script\
    \ framework, you need to do the following steps at high level:\n\n+   1. Create\
    \ a script processor implementation that will extend the BaseProcessor class and\
    \ implement the ScriptProcessor, ScriptResourceLoader, and InitializingBean interfaces.\
    \ You should take a detailed look at how RhinoScriptProcessor has been implemented\
    \ in order to create your custom script processor.\n+   2. Create a custom factory\
    \ implementation similar to the bean ID, webscripts.repo.scriptprocessor.factory,\
    \ to return your custom script processor object."
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   3. Create a registrar class implementation similar to `ScriptProcessorRegistrar`,
    referring to the custom factory implementation in order to register it with the
    web script framework.


    # # Custom template processor implementation


    Now that we have had a detailed technical walkthrough on the script processor
    implementation in the web script framework, it''s now time to do some exercise
    to find out how template processor implementation is done in the web script framework
    and how to create a custom implementation for template processor. You should now
    be able to trace through the code to find out how the FreeMarker template processor
    is used by the web script framework and how you can create a custom template processor
    implementation. Here is a hint for you in order to do this exercise. In order
    to understand about template processor implementation, you just need to take a
    look at the bean entry for `org.springframework.extensions.webscripts.ScriptProcessorRegistrar`
    in `web-scripts-application-context.xml` and trace through the code the way we
    did in the previous section; you should get an overall understanding about template
    processor implementation and details of creating a custom template processor.
    I hope you have enjoyed this exercise.


    # # Customizing formats


    Let''s first learn about how the different formats are registered with the web
    script framework. If you take a look at the bean entry with the ID as `webscripts.formats`
    in `spring-webscripts-application-context.xml` in `spring-webscripts-*.jar`, it
    has the entries for formats and MIME type corresponding to the available formats.
    The `org.springframework.extensions.webscripts.FormatMap` parent class for this
    bean definition entry, `webscripts.formats`, registers the formats and MIME types
    with `FormatRegistry` used by the web script container in the web script framework.
    In order to add custom formats, all you need to do is provide the appropriate
    format and MIME type entry. If you take a look at the bean ID, `webscripts.formats.IE`
    in `spring-webscripts-application-context.xml`, and its customized entry in `web-script-application-context.xml`,
    it has defined the custom IE specific formats. It has changed the format for rss
    from text/xml to application/rss+xml. Similarly, you can have your customized
    change for formats. If you plan to add a completely new format and MIME type that
    is not defined in `spring-webscripts-application-context.xml`, then you will have
    to create a customized `FormatReader` class and a customized `FormatWriter` class.
    You can take a look at the `webscripts.adaptors` bean entry; it will give you
    some tips on how to create custom FormatReaders and FormatWriters and register
    with the web script frameworks'' `FormatRegistry`.'
