    pointers for some of the common issues you might face while working on web scripts.
    At the end, we went through some useful tips and tricks that might be helpful
    when you are running web scripts on a production server. Overall, now you have
    a good understanding of how to deploy and debug the web scripts in Alfresco, and
    the next time when you need to run some web scripts on a production server, you
    will have some ideas to share with peer developers or the project manager about
    how you can approach executing web scripts on a production server.


    Now, when you need to develop a large number of web scripts, you cannot have them
