- pgno: 139
  md: '# Other debugging techniques


    Let''s take a look at some other debugging techniques that may be very useful:


    +   - When your web script does not work, you should also check whether it is
    properly registered to the Alfresco web script engine or not. You can hit `http://localhost:8080/alfresco/service/index`
    and locate your web script from the various options available to browse web scripts,
    such as browse all by package or by URI. When you click on it, it will display
    the descriptor, JavaScript controller, and response template. You can make sure
    that the JavaScript controller has all your fixes or modifications that you added
    to fix the issue.

    +   - In your web script, when you are working on some properties of a node, permissions
    on a node, and so on, you can also get help from `nodebrowser`. Using `noderef`,
    you can find out the details like properties set on the node, its children, aspects
    applied on it, associations with other nodes, and permissions on a node that might
    also be useful to you while debugging for your issue fix. You can also use other
    functionalities available in `nodebrowser` such as the ability to execute lucene
    queries that might also be helpful when you want to verify the lucene query used
    by the web script controller.


    # Troubleshooting pointers


    Having understood the different ways to debug web scripts in Alfresco, let''s
    take a look at some of the troubleshooting pointers for some common issues you
    might come across while working with Alfresco web scripts.


    # A valid SecureContext error


    You might have sometimes faced the error **A valid SecureContext was not provided
    in the RequestContext**. There can be many reasons for getting this error. Some
    of them are listed as follows:


    +   - When you have set authentication to `none` in the web script description
    document, and in the controller you are trying to invoke some public services
    of Alfresco that require authentication, for example, calling the `toDisplayPath()`
    method, it will give you the mentioned exception.

    +   - If you have a JavaScript-backed controller for your web script and you have
    deployed it using the repository option and authentication is set to `none`, you
    will get the mentioned exception when you try to hit your web script.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Web Script format " is not registered


    While developing web scripts in Alfresco, you might have come across an error
    **Web Script format " is not registered** when you tried hitting the web script.


    The reason is that if you have a JavaScript-backed controller or Java controller
    extending the `DeclarativeWebScript` class, and in your web script''s description
    document you have a default format specified as blank such as `<format default="">`,
    then this error will appear.


    > If you are deploying a JavaScript-backed web script using the repository option,
    make sure that the web script has the authentication level set and it should not
    be set as none.


    > When you want to take control to return the response without a template, you
    should use the Java-backed controller extending the `AbstractWebScript` class.
    In this case, having specified the default format as blank in the web script description
    document will not cause the mentioned error.


    # Cannot locate template processor for template


    For your web script, you have created a description document, required controller
    implementation, and required response template. Now, when you try to execute the
    web script, you get the error **Cannot locate template processor for template
    example/contentlocation.get.xml**.


    Looking at the error, you will first think that you already have the template
    in place, so why does this error occur? It is sometimes really tricky to find
    out what the issue is. The same is the case here. The reason for this error is
    that the name of the template is not as per the web script naming convention.
    It should be `contentlocation.get.xml.ftl` instead of `contentlocation.get.xml`.


    > You must always ensure that you adhere to the web script naming convention and
    always deploy the web script files at correct locations. If you have a Java-backed
    controller, make sure that the bean ID for Java-backed controller is specified
    as expected.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Script URL does not support the method


    In simple words, this error generally occurs when you do not use the appropriate
    method to invoke the web script. For example, when you have a POST web script
    and you invoke the web script as a GET request, you will see the script URL does
    not support the method error. In order to avoid this error, you should always
    use the appropriate method to invoke the web scripts.


    # Web scripts on a production server


    A production server sounds interesting, doesn''t it? Yes, this is the most important
    thing. While working on live projects and supporting a production system with
    Alfresco as a backend repository for your client, you might have to write different
    web scripts as per the business requirement. This might take longer to execute
    as the production server will be dealing with a large number of content as compared
    to your development servers. For example, you might have to write a patch script
    to add an extra property on existing nodes, or you might need to write a web script
    to retrieve records for some specific criteria. Let''s take a look at what you
    should take care of while running such web scripts on a production server.


    # Running web scripts in the background


    It might be possible that the web script that you have written once executed against
    a large number of content might take longer to process. In such cases, you cannot
    hit the web script from a browser and keep on waiting until the response is received.
    For such web scripts, when required to run on the production server, one approach
    you can choose is to run the web script in the background and invoke the web script
    directly from the server itself so that you need not have to worry about the calling
    client getting disconnected from the server.


    In order to be able to run web scripts in the background, one way is to invoke
    the web script from a shell script. You can then run the shell script in the background
    from the server itself. You can use the following example command to run the shell
    script in the background:


    ```

    ```sh

    nohup execute-webscript.sh > webscript.log &

    ```

    ```


    This command will run execute-webscript.sh in the background, which is basically
    your shell script invoking your web script, and will dump the execution logs of
    the shell script to the webscript.log file. You might probably also want to implement
    an e-mail notification feature to trigger an e-mail once the web script execution
    is completed so that you do not have to monitor the logs frequently and can get
    a notification once the web script execution is completed.'
  merge: -1
  img_proc: true
