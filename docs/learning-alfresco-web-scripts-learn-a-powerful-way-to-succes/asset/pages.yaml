  md: "# Creating Java-backed Web Scripts\n\n# Controller logic at a high level\n\n\
    In order to develop a controller for this scenario, let's take a look at the implementation\
    \ logic that we will include in the Java-backed controller at a high level:\n\n\
    +   - A controller will expect `nodeid` as an input parameter\n+   - Check whether\
    \ the given node is present in the repository\n+   - Check whether the user has\
    \ at least read permissions on the given node\n+   - Get the filesystem location\
    \ for the given node\n+   - Get the size on the filesystem for the given node\n\
    +   - Prepare the model object and return it to the FTL response template\n\n\
    # Let's code it!\n\nLet's perform the following steps to create a Java-backed\
    \ controller implementation for the web script that will perform all the required\
    \ logic as mentioned in the previous section:\n\n+   1. Create a new class, `com.example.content.ContentLocationWebScript`.\
    \ It's generally a good idea to provide a descriptive naming style and classify\
    \ the web scripts under appropriate packages. This will be useful in a scenario\
    \ where a large number of web scripts are to be developed. As this is going to\
    \ be a content-related web script, we have kept it under the `com.example.content`\
    \ package and named it `ContentLocationWebScript`.\n+   \n+   2. The Java class\
    \ `ContentLocationWebScript` you have just created must extend `org.springframework.extensions.webscripts.DeclarativeWebScript`\
    \ as follows:\n\n```\npublic class ContentLocationWebScript extends org.springframework.extensions.webscripts.DeclarativeWebScript\
    \ {\n```\n\n+   3. We are going to use the Node service, which is basically used\
    \ to perform node-related operations such as create, update, delete, set properties,\
    \ and get properties in Alfresco, to get the details about the filesystem location.\
    \ We will use the Permission service to identify whether a user has read access.\
    \ Now the next step is to provide the declaration for them. Both of them will\
    \ be injected as a Spring dependency as follows:\n\n```\nprivate NodeService nodeService;\n\
    private PermissionService permissionService;\n```"
