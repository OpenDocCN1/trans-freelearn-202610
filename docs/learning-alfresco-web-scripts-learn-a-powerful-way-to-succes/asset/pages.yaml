- pgno: 47
  md: '+   - It is possible to define a web script with different HTTP methods. For
    example, in a contract management solution, you can have web scripts differentiated
    based on an HTTP method to create/update/delete/retrieve contract (a content based
    on custom content type) from the repository as follows:

    +     - `contract.get.desc.xml`: This gets the contracts from the repository

    +     - `contract.put.desc.xml`: This updates a specified contract in the repository

    +     - `contracts.post.desc.xml`: This creates contracts in the repository

    +     - `contract.delete.desc.xml`: This deletes a contract from the repository


    # # Web script arguments


    It is important to know what arguments a web script requires. As a general practice,
    arguments should be specified in the description document while creating the web
    script. Let''s take a look at the two ways through which we can specify the arguments
    for a web script.


    # ## Explicit arguments


    Explicit arguments are the ones generally provided as a query string to the web
    script URL. In the descriptor document, the argument name and its placeholder
    are generally specified as the query string in the web script URL under the `<url>`
    tag. For example, this is the way we have added arguments for our first web script
    implementation as follows:


    ```

    `<url>/helloworld?name={argumentName}</url>`

    ```


    You can have multiple arguments for the web script URL by differentiating them
    using the ampersand character as `&amp;`.


    > > It is important to use the escaped ampersand character `&amp;` while specifying
    arguments in the web script descriptor document. This is required to be done in
    order to ensure that web script descriptors are always a valid XML.


    So for example, if you want to add another argument to our first web script, it
    can be declared in the descriptor document as follows:


    ```

    `<url>/helloworld?name={argumentName}&amp;organisation={argumentOrganisation}</url>`

    ```'
  merge: -1
  img_proc: true
