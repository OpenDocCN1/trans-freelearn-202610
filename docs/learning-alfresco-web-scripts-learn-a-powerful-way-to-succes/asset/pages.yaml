- pgno: 160
  md: '# Extending the Web Script Framework


    We started our journey of learning Alfresco web scripts by getting familiar with
    web scripts. We then did a hands-on exercise to create our first web script in
    Alfresco and gained in-depth technical knowledge on understanding the web script
    framework in Alfresco in and out. Later, we got well acquainted with the building
    blocks of web scripts and different ways to invoke web scripts. We also understood
    how to create Java-backed web scripts and then explored JavaScript-based web scripts
    in detail. Next, we looked into the deployment, debugging, and troubleshooting
    of web scripts, and then we learned how to set up the development environment
    with Maven. By now, you should have gained the required knowledge to practically
    implement and use Alfresco web scripts in your live projects. Also, you should
    be able to debug, troubleshoot, and fix issues with web scripts in your project.
    Now, as the last thing to learn in this book, it''s time to find out about the
    possibilities to extend the web script framework in Alfresco.


    Before we start, you might want to refresh your knowledge on the web script framework
    that we learned about in *Chapter 3, Understanding the Web Script Framework*.
    As a brief summary, the core components of the web script framework are web script
    runtime, web script container, and authenticator. Other supporting components
    of the web script container are the script processor registry to register the
    script processors, the template processor registry to register the template processors,
    and the format registry to register new formats. We have gone through the details
    of out-of-the-box implementation classes for all of them. The web script framework
    in Alfresco is very powerful and the out-of-the-box implementation provided for
    the core components of the web script framework caters to all your needs related
    to web scripts implementation for your project. However, in order to understand
    how powerful the web script framework in Alfresco is, it is worth taking a look
    at how you can extend the web script framework''s core components and add your
    customized implementation for it. In general scenarios, you will not be required
    to make any changes to the web script framework''s components. However, having
    knowledge about the possibility to extend the web script framework will help you
    to have a customized implementation if required. It will also get you familiar
    with the power of working on open source implementations, which provides the flexibility
    to add your customized implementation whenever required.


    We are going to take a look at how it is possible to extend the web script framework
    in Alfresco to have custom implementation of web script runtime, web script container,
    authenticators, script processors and template processors, and also custom formats.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# # Custom implementation of the web script runtime


    Let''s first briefly understand the role of the web script runtime in the web
    script framework. During the web script execution flow, once the request dispatcher
    sends the request, the web script runtime will delegate the request to the web
    script container for further processing in order to execute the web script. There
    are different implementations available for the web script runtime such as servlet
    runtime, portlet runtime, JSF runtime, Facebook runtime, and SURF web framework
    runtime. As a developer, you must be interested in knowing what needs to be done
    if a new implementation for the web script runtime is to be implemented. Let''s
    take a look at it here.


    In order to understand how to create a customized implementation of the web script
    runtime in the web script framework, first let''s take a look at the service provider
    interface provided by the web script framework, which opens up the possibilities
    to create custom implementation. If you take a look at the implementation inside
    `spring-webscripts-*.jar`, there is an interface defined, `org.springframework.extensions.webscripts.Runtime`,
    which declares the required methods to be implemented by any web script runtime.
    In order to make a simplified implementation, there is an abstract class implementation,
    `org.springframework.extensions.webscripts.AbstractRuntime`, which implements
    the `org.springframework.extensions.webscripts.Runtime` interface. This provides
    the implementation for the methods defined in the interface in a way that any
    runtime in the web script framework should be able to serve a web script request
    in a generic way. The AbstractRuntime class leaves some of the methods as abstract
    leaving the child class to provide the implementation for the abstract methods
    in order to make a generic implementation for the web script runtime. If you take
    a look at all the existing web script runtimes available in the web script framework,
    such as WebScriptServletRuntime and JSFRuntime, you can see that they extend from
    the AbstractRuntime class. These classes provide the implementation of the required
    abstract methods from the AbstractRuntime class.


    Having an overall understanding about the service provider interface and its implementation
    in the out-of-the-box web script framework in Alfresco, let''s try to understand
    how we can use this knowledge to create a custom implementation of the web script
    runtime. We are going to take a look at the high level steps required to create
    a custom web script runtime.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "# Extending the Web Script Framework\n\nIn order to create a custom web script\
    \ runtime, perform the following steps:\n\n+   1. Open Eclipse and inside your\
    \ project, create a Java class that extends `org.springframework.extensions.webscripts.AbstractRuntime`.\n\
    +   \n+   2. You will see that Eclipse displays red symbol at the class declaration.\
    \ Do not worry about this. This happens because we have not yet provided the implementation\
    \ for the abstract methods provided in the parent class. Right-click on the class\
    \ and go to **Source | Override/Implement Methods** and click on **OK**. You should\
    \ be able to see the default implementation for the abstract methods from the\
    \ `AbstractRuntime` parent class. The following are the methods you will be required\
    \ to provide an implementation for to create a custom web script runtime:\n+ \
    \  \n+   ```java\n+   public String getName()\n+   protected String getScriptMethod()\n\
    +   protected String getScriptUrl()\n+   protected WebScriptRequest createRequest(Match\
    \ paramMatch)\n+   protected WebScriptResponse createResponse()\n+   protected\
    \ Authenticator createAuthenticator()\n+   protected WebScriptSessionFactory createSessionFactory()\n\
    +   ```\n+   \n+   3. You will also be required to provide an explicit constructor\
    \ implementation for your Java class; otherwise, it will show the **implicit super\
    \ constructor AbstractRuntime() is undefined for default constructor** error.\
    \ Right-click on the class and go to **Source | Generate Constructors from Superclass**.\
    \ The following is what the explicit constructor looks like for your custom Java\
    \ class:\n+   \n+   ```java\n+   public CustomWebScriptRuntime(RuntimeContainer\
    \ container) {\n+       super(container);\n+   }\n+   ```\n+   \n+   4. Each time,\
    \ a new instance of web script runtime should be created and the `executeScript()`\
    \ method should be invoked, whose generic implementation is provided in the `AbstractRuntime`\
    \ class.\n\n```\npublic String getName()\nprotected String getScriptMethod()\n\
    protected String getScriptUrl()\nprotected WebScriptRequest createRequest(Match\
    \ paramMatch)\nprotected WebScriptResponse createResponse()\nprotected Authenticator\
    \ createAuthenticator()\nprotected WebScriptSessionFactory createSessionFactory()\n\
    ```\n\n```\npublic CustomWebScriptRuntime(RuntimeContainer container) {\n    super(container);\n\
    }\n```"
  merge: -1
  img_proc: true
