    # Creating your first web script in Alfresco


    Whenever we start learning about any new programming language, the first program
    we implement is the "Hello world" program wherein we simply print the text **Hello
    world** as the output of the program. We will also do the same thing here. We
    will create a basic web script in Alfresco that will simply display **Hello world!**
    as the output of the web script.


    In order to create a basic and simple web script in Alfresco, you will need to
    have a descriptor for the web script and a FreeMarker template to render the output
    of the web script.


    Web scripts can be created from the available Alfresco user interfaces or you
    can have them developed outside of Alfresco and then deploy them. As we are going
    to implement a very basic web script here, we will use the Alfresco user interface
    option and will create a web script. You can either use Alfresco Explorer web
    client or Alfresco Share UI for this. However, as Alfresco Explorer is now not
    being encouraged to be used in general as it is not on the roadmap of Alfresco
    as no new implementations are being made in support of Alfresco Explorer, we will
    also not use Alfresco Explorer. Instead, we will use the Alfresco Share UI which
    is recommended to use in general.


    Let''s now create the web script. In order to create your first web script in
    Alfresco, follow these steps:


    +   1. Log in to Alfresco Share UI.

    +   2. Click on the **Repository** link from the top header.

    +   3. Go to **Data Dictionary** | **Web Scripts Extensions**.'
  merge: -1
  img_proc: true
