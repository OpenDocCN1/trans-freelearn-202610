- pgno: 38
  md: 'It''s now time to practically implement your first web script in Alfresco and
    get more familiar with Alfresco web script implementation. This chapter will help
    you get a clear understanding on how to create a simple web script in Alfresco,
    how to extend web script with controller implementation, and some fundamental
    things about web script implementation that are very important to know while working
    on Alfresco web scripts.


    Consider a scenario where you are managing the project execution of developing
    an integration solution of a custom frontend application with Alfresco as backend
    repository. Now, you have been allocated a new developer to develop Alfresco web
    scripts who is not very familiar with web script implementation and you want to
    get him up to speed for web script development. Never mind, you can have him read
