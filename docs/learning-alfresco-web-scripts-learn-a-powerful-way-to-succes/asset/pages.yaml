- pgno: 155
  md: '# # Understanding the default project structure


    Having imported the project in Eclipse, let''s now go through the project structure
    in order to understand the important files and directories present in it:


    | File/directory in project structure | Brief description |

    |---|---|

    | `pom.xml` | For any Maven project, pom.xml is a must in order to let Maven know
    about the project dependencies. The pom.xml file is available directly under the
    project directory. If you take a look at pom.xml, you will get all the details
    about the project dependencies, repository information, and other important information.
    Also, in pom.xml for our project, you should be able to see the settings we provided
    while generating the project from the Maven archetype. You can change them here
    if you want and just update the project as we did earlier. Maven would then consider
    the updated changes and take care of the required things. |

    | `src/main/java` | This directory will be used for placing the Java source code
    for the project. You can organize Java classes under the appropriate package under
    this location. The Java controller for web scripts you will be developing for
    your project should be placed under this location. Apart from web script controllers,
    you can also place Java classes for other customizations such as custom actions
    and others. When the project is built, Java classes placed here will be available
    in a JAR file inside the AMP generated as a deployment artifact. When the AMP
    is applied to the Alfresco WAR file, the JAR file will be deployed under WEB-INF/lib.
    |

    | `src/main/amp` | All the required details related to AMP reside under this location.
    The module.properties file is an important file for the AMP structure. It contains
    details about the AMP file such as ID for AMP, version, dependencies, and minimum
    and maximum version of Alfresco to run it. The location src/main/amp/config/alfresco/module/example-repo
    is the core of AMP and will contain important files such as Spring configuration
    context files, content model files, and so on. You can create extensions, messages
    folder under src/main/amp/config/alfresco in order to include the web script component
    files. |

    | `src/test` | The unit test cases-related implementation and the supporting configuration
    that run the unit test cases will be placed here. Just take a look at the default
    folders available under this location and you will get an understanding of what
    is present inside the default folders. |'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Extending your default project to create web scripts


    While developing web scripts in the previous chapters, we did not follow any project
    structure and developed the required files for a web script independently in an
    editor of our choice and then manually deployed them at the appropriate locations
    in the installed Alfresco directory. Now, having understood the project structure
    and the AMP deployment package, it is time to discover how we can extend the default
    project structure in order to create web scripts. Let''s try to understand where
    you should place the web script-related files in the project structure while developing
    new web scripts:


    +   - The web script descriptor file (*.desc.xml), response templates for the
    web script (*.ftl), configuration document for the web script (*.config.xml),
    and message bundles (*.properties) should be placed under the location src/main/amp.
    Inside the default structure available in src/main/amp/config/alfresco, create
    a new folder structure, /extension/templates/webscripts, to store all the new
    web scripts you will create. You can then classify the web scripts in different
    packages inside this location, for example, all the login related customized web
    script and its descriptor, response template, configuration document, and message
    bundle can be placed under location src/main/amp/config/alfresco/extension/templates/webscripts/login.

    +   - For JavaScript-based web scripts, the controller implementation (*.js) should
    also be placed at the same location along with other files as mentioned in the
    previous point.

    +   - For Java-backed web scripts, the controller implementation (*.java) should
    be placed under the appropriate package structure inside src/main/java.

    +   - For Java-backed web script, the Spring configuration context file that associates
    controller with the web script should be placed under src/main/amp/config/alfresco/extension.
    You can also place your Spring bean mapping entry from your Java controller inside
    the module-context.xml file under src/main/amp/config/alfresco/module/proj-name.


    > Once you generate the AMP for the project running the Maven package, you should
    be able to see that all the Java classes are put into a JAR file, whereas other
    files are appropriately located in the AMP file as we placed them under the project
    structure. You can now give this AMP file for deployment to other server.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Applying AMP to the Alfresco WAR for testing


    Once you are done with the web script development for your project following the
    preceding project structure, create an AMP file for your project and test it before
    you hand over the AMP file for deployment on the other server. In order to test
    your web scripts locally, you will first need to apply the AMP to the Alfresco
    WAR file. With the Alfresco Maven SDK, you need not have Alfresco installed locally
    for applying the AMP. From the console, you can just go inside the project''s
    location and simply execute the `mvn integration-test -Pamp-to-war` command.


    After running the preceding command, you will be able to see that Maven is now
    doing its job to download all the required dependencies to compile the project.
    This will create an AMP file for the project, apply the AMP file to the out-of-the-box
    Alfresco WAR, and then deploy the WAR to the embedded Tomcat server, and finally,
    start the server. You should be able to see from the console output that the AMP
    module for your project has been successfully generated and known to the Alfresco
    server.


    You can log in to the Alfresco server `http://localhost:8080/alfresco` and also
    hit the web script URLs for the web scripts you have developed. Once you are done
    with testing, make sure you shut down the running server. You can simply press
    `Ctrl + C` on the console from where you ran the Maven integration command to
    shut the server down.


    > If you get an out-of-memory error while running the previous integration test
    command, you will need to increase the size of the memory allocated to Alfresco
    and Tomcat. You can do this by providing Maven with additional JVM memory settings
    such as increasing PermGen size.


    We have just seen that without having Alfresco installed previously on the development
    machine, we were able to test our customized development very easily with the
    help of the Alfresco Maven SDK. All we have done is just executed a command, and
    Maven did everything required for us and made the job easier, leaving us to focus
    more on development and not worry about things such as downloading and setting
    up Alfresco on the local machine, generating AMP, and deploying it to the Alfresco
    WAR.'
  merge: -1
  img_proc: true
