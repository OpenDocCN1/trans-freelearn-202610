- pgno: 94
  md: '# Calling a web script from the presentation

    web script JavaScript controller


    Alfresco Share renders the user interface using the presentation web scripts.
    These presentation web scripts make a call to the repository web script to render
    the repository data. Repository web script is called before the component rendering
    file (for example, `get.html.ftl`) loads.


    In out-of-the-box Alfresco installation, you should be able to see the components''
    presentation web script available under `tomcat\webapps\share\WEB-INF\classes\alfresco\site-webscripts`.


    When developing a custom component, you will be required to write a presentation
    web script. A presentation web script will make a call to the repository web script.
    You can make a call to the repository web script as follows:


    ```

    var response = remote.call("url of web script as defined in description document");

    var obj = eval(''('' + response + '')'');

    ```


    In the preceding code snippet, we have used the out-of-the-box available remote
    object to make a repository web script call. The important thing to notice is
    that we have to provide the URL of the web script as defined in the description
    document. There is no need to provide the initial part such as host or port name,
    application name, and service path the way we use while calling web script from
    a web browser. Once the response is received, web script response can be parsed
    with the use of the `eval` function.


    In the out-of-the-box code of Alfresco Share, you can find the presentation web
    scripts invoking the repository web scripts, as we have seen in the previous code
    snippet. For example, take a look at the `main()` method in the `site-members.get.js`
    file, which is available at the `tomcat\webapps\share\components\site-members`
    location inside your Alfresco installed directory. You can take a look at the
    other JavaScript controller implementation for out-of-the-box presentation web
    scripts available at `tomcat\webapps\share\WEB-INF\classes\alfresco\site-webscripts`
    making repository web script calls using the previously mentioned technique.


    > When specifying the path to provide references to the out-of-the-box web scripts,
    it is mentioned starting with `tomcat\webapps`. This location is available in
    your Alfresco installation directory.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Invoking a web script from client-side JavaScript


    The client-side JavaScript control file can be associated with components in Alfresco
    Share. If you need to make a repository web script call, you can do this from
    the client-side JavaScript control files generally located at tomcat\webapps\share\components.
    There are different ways you can make a repository web script call using a YUI-based
    client-side JavaScript file. The following are some of the ways to invoke web
    script from client-side JavaScript files. References are also provided along with
    each of the ways to look in the Alfresco out-of-the-box implementation to understand
    its usage practically:


    +   - Alfresco.util.Ajax.request: Take a look at tomcat\webapps\share\components\console\groups.js
    and refer to the _removeUser function.

    +   - Alfresco.util.Ajax.jsonRequest: Take a look at tomcat\webapps\share\components\documentlibrary\documentlist.js
    and refer to the onOptionSelect function.

    +   - Alfresco.util.Ajax.jsonGet: To directly make a call to get web script, take
    a look at tomcat\webapps\share\components\console\groups.js and refer to the getParentGroups
    function.

    +   - YAHOO.util.Connect.asyncRequest: Take a look at tomcat\webapps\share\components\documentlibrary\tree.js
    and refer to the _sortNodeChildren function.


    > In alfresco.js located at tomcat\webapps\share\js, the wrapper implementation
    of YAHOO.util.Connect.asyncRequest is provided and various available methods such
    as the ones we saw in the preceding list, Alfresco.util.Ajax.request, Alfresco.util.Ajax.jsonRequest,
    and Alfresco.util.Ajax.jsonGet can be found in alfresco.js. Hence, the first three
    options in the previous list internally make a call using the YAHOO.util.Connect.asyncRequest
    (the last option in the previous list) only.


    # Calling a web script from the command line


    Sometimes while working on your project, it might be required that from the Linux
    machine you need to invoke a web script or create a shell script to invoke a web
    script. It is possible to invoke a web script from the command line using cURL,
    which is a valuable tool to use while working on web scripts.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'You can install cURL on Linux, Mac, or Windows and execute a web script from
    the command line. Refer to http://curl.haxx.se/ for more details on cURL. You
    will be required to install cURL first. On Linux, you can install cURL using apt-get.
    On Mac, you should be able to install cURL through MacPorts and on Windows using
    Cygwin you can install cURL.


    Once cURL is installed, you can invoke web script from the command line as follows:


    ```

    curl -u admin:admin "http://localhost:8080/alfresco/service/

    helloworld?name=Ramesh"

    ```


    This will display the web script response.


    # Calling a web script from JSR-168 portals and the JSF page


    The Web script framework in Alfresco provides a helper to make a call to Alfresco
    web scripts from some of the client environments that do not know HTTP. Hence,
    it makes it easy to invoke web scripts from such an environment and a web script
    will be invoked using a mechanism that is familiar to the calling environment.
    In order to allow JSR-168 portals and JSF pages to naturally invoke a web script
    as per their environment, the web script framework in Alfresco has provided helpers
    for them. Let''s take a look at them and how they work at a high level.


    # Calling a web script from JSR-168 portals


    It is possible to invoke an Alfresco web script as if it were a JSR-portlet. We
    will take a look at the configuration required to be done in Alfresco for this.
    Entry for the web script should be provided in portlet.xml. The web script URL
    should be configured as a JSR-portal URL under the scripturl param in order to
    be able to invoke the web script as a portlet. Basically it has /alfresco/168s
    added before the URL defined in the web script description document.


    For example, you can take a look at the out-of-the-box implementation of the mytasks
    web script available at tomcat\webapps\alfresco\WEB-INF\classes\alfresco\templates\webscripts\org\alfresco\portlets\mytasks.get.desc.xml
    and mytasks.get.html.ftl. If you are using Alfresco Community 5, these two files
    are located under the alfresco package inside alfresco-remote-api-*.jar. Entry
    for mytasks web script as a portlet is configured in tomcat\webapps\alfresco\WEB-INF\portlet.xml.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Calling a web script from the JSF page


    It is possible to invoke a web script from the JSF page as if it were a tag library.
    There is a tag implementation provided in Alfresco to have JSF pages invoke web
    scripts. It''s available in `repo.tld` located at the `tomcat\webapps\alfresco\WEB-INF`
    location in your Alfresco installation.


    Take a look at `tomcat\webapps\alfresco\jsp\dashboards\dashlets\mytasks-webscript.jsp`
    to get an understanding of how it is used.


    # Dealing with client limitations


    One of the limitations would be that not all clients can make all the HTTP calls.
    It might be possible that it is only restricted to GET or POST calls. The web
    script framework in Alfresco provides a way to tunnel an HTTP method using a POST
    method and using it, you can invoke other HTTP method calls. This can be done
    using the `X-HTTP-Method-Override` header in the HTTP request with the value as
    the method name, for example, GET. An alternative way is to specify `alf_method`
    as a query string parameter.


    Another client limitation could be that not all clients can gracefully handle
    HTTP codes for non-success. In such cases, there is a mechanism to force the HTTP
    response to specify success in the response header. The response body still represents
    the content as if a non-success status has been received, which allows the client
    to know about the error code or message provided by the web script, if any. In
    order to be able to gracefully handle the HTTP code for non-success scenarios,
    it is possible to forcefully specify the success in the HTTP response each time
    by setting the `alf-force-success-response` header with a value of `true` on the
    HTTP request.


    # Summary


    In this chapter, we have gained an understanding about the different ways to invoke
    a web script, for example, from the web browser. Using the add-ons available for
    the web browser, web scripts can be invoked. We have seen different ways to invoke
    web scripts from a standalone Java class. We have also gone through how to invoke
    web scripts from Spring-based services and from the command line. We gained knowledge
    about the possibility of invoking web scripts as JSR-168 portlets and JSF pages.
    We also saw how the web script framework in Alfresco provides us with ways to
    deal with some of the limitations of the calling clients.


    We are going to learn how to develop Java-backed web scripts in the next chapter.'
  merge: -1
  img_proc: true
