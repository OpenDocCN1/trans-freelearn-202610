- pgno: 29
  md: '+   - They are reusable across different platforms

    +   - Web scripts provide uniform access of the content to a wide range of client
    applications


    In technical terms, web scripts can be defined as follows:


    +   - They are RESTful web services


    > **What is RESTful?**

    > REST stands for REpresentational State Transfer, which is basically an architectural
    style. Well-defined and uniform access to the resources through HTTP request methods,
    uniquely identified resources through the URI, and representation of these resources
    are the key principles of REST. Any implementation following this architectural
    style is known as RESTful.


    +   - They are bound to a specific Uniform Resource Identifier (URI)

    +   - They respond to HTTP methods such as GET, POST, PUT, and DELETE

    +   - They are a lightweight implementation


    From a developer''s point of view, web scripts have the following properties:


    +   - They are easy to understand and learn

    +   - They are easy to develop

    +   - They are easy to debug

    +   - They are easy to maintain

    +   - They are easy to deploy

    +   - They are faster to implement

    +   - They would be the first choice when it comes to accessing the Alfresco repository
    securely from external applications


    From a business user''s point of view, web scripts are useful as follows:


    +   - They bridge the gap between the business requirement and technical implementation
    for building up business solutions with Alfresco

    +   - They empower Alfresco in its integration capabilities to develop useful
    Alfresco integration solutions with external systems

    +   - They are a unique way to implement the integration solutions on top of the
    Alfresco repository

    +   - They are the backbone of the integration solution implementation with the
    Alfresco repository'
  merge: -1
  img_proc: true
