- pgno: 49
  md: '# Response formats supported by the web script framework


    The web script framework in Alfresco supports different response formats. Here
    is a list of the available response formats and their mime type:


    +   - html - text/html

    +   - text - text/plain

    +   - xml - text/xml

    +   - xsd - text/xml

    +   - atom - application/atom+xml

    +   - atomentry - application/atom+xml;type=entry

    +   - atomfeed - application/atom+xml;type=feed

    +   - atomsvc - application/atomsvc+xml

    +   - rss - application/rss+xml

    +   - json - application/json

    +   - opensearchdescription - application/opensearchdescription+xml

    +   - mediawiki - text/plain

    +   - portlet - text/html

    +   - fbml - text/html

    +   - php - text/html

    +   - js - text/javascript

    +   - calendar - text/calendar

    +   - csv - text/csv

    +   - xls - application/vnd.ms-excel

    +   - xlsx - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet


    # Specifying the response format


    With the model-view-controller pattern implementation, we can have one controller
    implementation and multiple views. Hence, it is possible to have multiple response
    formats for any web script to return the web script output in different formats
    as requested.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'You can choose any of the response formats from the supported response format
    lists for your web script. There are two different ways you can specify the response
    formats for a web script.


    # Specifying the response format via URL – extension on web script ID


    Once you have created the required descriptor file, controller, and multiple response
    template documents for your web script, you can specify the response format to
    be used while invoking the web script URL. You can specify it as an extension
    of the web script ID.


    For example, if there are different response format documents created for the
    hello world web script such as helloworld.get.xml.ftl or helloworld.get.json.ftl
    and while invoking the web script you want to specify XML format explicitly, then
    you can do this as follows:


    ```

    http://localhost:8080/alfresco/service/helloworld.xml?name=Ramesh

    ```


    # Specifying the response format via URL – explicit format argument


    Another way to specify the response format is to explicitly pass a format argument
    to the web script URL. For example, if you want to specify the XML format explicitly
    for the hello world web script, then you can do this as follows:


    ```

    http://localhost:8080/alfresco/service/helloworld?name=Ramesh&format=

    xml

    ```


    # The default format


    While invoking a web script, if no format is explicitly specified using either
    of the previous two methods mentioned, then the default format as mentioned in
    the descriptor document will be returned. The default format can be specified
    in the descriptor document as follows:


    ```

    <format default="json">any</format>

    ```


    This indicates that the default format of the web script response to be returned
    is JSON and the format can be specified using either of the previous two ways
    while invoking web script.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '> If no default response format is defined in the descriptor document for a
    web script and also no response format is provided neither through the extension
    of a web script ID in the web script URL nor through explicitly specifying the
    format argument in the web script URL while executing the web script, then Alfresco
    assumes the default response format as HTML.


    In general, the following are some useful points for response formats:


    +   - Response formats are mapped to the FreeMarker template through naming conventions,
    for example, `helloworld.get.html.ftl` in case of our first web script

    +   - For any web script, you can define multiple response formats such as HTML,
    XML, JSON, and so on.

    +   - Based on the web script request method and requested format, the web script
    framework in Alfresco returns the web script response


    # Summary


    In this chapter, we have practically implemented the simplest first web script
    in Alfresco, got an understanding of the Alfresco web script URI so we know how
    to use a web script, how to add arguments to a web script, and then extend the
    first simple web script to have a controller implemented.


    Also, we learned at a high level what happens behind the scenes of a web script
    hit when a controller is used for a web script and if a no controller is implemented.


    We learned some very important things while implementing web scripts in Alfresco
    such as different HTTP methods supported by the web script framework in Alfresco,
    when to choose which method, different ways of specifying arguments to a web script,
    a list of response formats supported by web script framework in Alfresco, and
    how to make your web script return a response in a different response format based
    on the requested response format.


    Overall, we have gained a good knowledge about some of the fundamental things
    when implementing web scripts in Alfresco through the example of creating and
    extending a simple web script in Alfresco.


    In the next chapter, we are going to explore the web script framework in Alfresco
    in detail with useful technical insights.'
  merge: -1
  img_proc: true
