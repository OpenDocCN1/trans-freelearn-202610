- pgno: 124
  md: '# Code examples


    Now that you have information on the different root objects you can use in the
    JavaScript controller, let''s take a look at some code examples to get a better
    understanding of how you can put the root objects in action to achieve the required
    functionality. We will go through some code examples for some of the generic functionalities
    that every developer will use at some point in time. We will use some of the root
    objects we have gone through previously.


    # Creating a folder


    Consider a scenario where you have a custom frontend application and Alfresco
    as the backend repository. Now, you want to have the functionality for the users
    to create a folder in Alfresco under the company home from the custom frontend.
    Once the folder is created, you might also want to create some content inside
    the folder or run some action on the folder. First, our goal is to create a folder
    under the company home.


    To address this, we will create a new web script foldercreation, which will accept
    the argument foldername and creates a named folder under the company home and
    returns the noderef value as a response in the XML format. You could use the returned
    noderef further to invoke other web scripts as required, for example, to run an
    action or create content.


    In subsequent sections, you will find the core code snippet that needs to be implemented
    inside the JavaScript controller and response template in order to achieve the
    mentioned scenario. You can also go through the code files provided for this chapter
    in order to see the web script implementation for this web script.


    # Retrieving explicit arguments


    In order to implement this scenario, as the first thing in the JavaScript controller,
    we need to read the argument foldername. Explicit arguments can be retrieved using
    the args root object. So, we will read the argument foldername as follows:


    ```

    if (args.foldername != null && args.foldername != "")

    ```


    > If you have implicit arguments provided in the web script URL, then these arguments
    will not be available using the args root object. For them, you can get their
    values using the url root object like in url.templateArgs.foldername.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Folder creation under company home


    Now, create a folder under the company home. As we saw earlier that companyhome
    is available as a root object, we can directly use it. It''s of the type ScriptNode.
    So, we can invoke the methods available in the ScriptNode API to create the folder.
    The CreateFolder() method returns a ScriptNode object; set this object in the
    model and use it in the response template to get the noderef value from it using
    the TemplateNode API.


    Inside the JavaScript controller, you will have the following lines:


    ```

    var folderName = args.foldername;

    model.foldernode = companyhome.createFolder(folderName);

    ```


    In the response template, you will be using the following code:


    ```

    ${foldernode.nodeRef}

    ```


    Let''s discuss what we have just done. We used the args and companyhome root objects
    inside the JavaScript controller to read explicit arguments and create a folder
    respectively. All the available methods from the ScriptNode class can be used
    with the companyhome object.


    Now, we will take a look at some other functionalities as well in order to understand
    the usage of root objects and JavaScript APIs. We will also take a look at the
    relevant JavaScript code to achieve the mentioned functionality.


    # Finding a node


    In the preceding example, the web script returned nodeid in the response. It was
    the nodeid of the folder that was created in the web script. Now, you are interested
    in using the nodeid returned by the first web script as an input to some other
    web script. In another web script, you need to pass nodeid as the argument, and
    on that node, you need to perform some functionalities such as determining whether
    a user has permission on the node or not, getting the path to the node, getting
    some property of a node, modifying some property on a node, checking whether some
    aspect is applied on a node or not, creating content in it, invoking an action,
    and so on. Before proceeding with any such operations, as the first thing, we
    need to find out the actual node from the repository based on the nodeid provided.
    This can be done using the findNode() method accessed by the search root object
    as follows:


    ```

    var node = search.findNode("workspace://SpacesStore/" + args.nodeid);

    ```'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Here, we used the search root object and invoked the findNode() method of the
    JavaScript API for search root object. We are expecting nodeid to be passed as
    an argument; hence, we read it using args.nodeid. Before invoking the findNode()
    method for the node, we have to make the noderef string to be passed as an argument
    to the method; hence, we concatenated workspace://SpacesStore/ with nodeid. If
    a node is found, it will return a ScriptNode object representing the node found.
    If the node is not found, it will simply return null.


    # Checking user permissions on a node


    Now, once the node is found, you first need to check whether a user has at least
    read access on the node or not before performing any other operations on a node
    as listed in the previous section. This can be done using the hasPermission method
    available in the ScriptNode API as follows:


    ```

    var permission = node.hasPermission("Read");

    ```


    We used the hasPermission() method from the ScriptNode API. We already had a node
    object available, and we just invoked the hasPermission() method passing the permission
    we want to check. If the current user has the given permission, it will return
    true. Otherwise, it will return false.


    # Getting the path of a node


    As the next thing, you will be interested to get the path of the node in order
    to identify the folder hierarchy the node belongs to. You can easily get the display
    path of a node using the ScriptNode API as follows:


    ```

    var nodepath = node.displayPath;

    ```


    We accessed a variable displayPath from the ScriptNode class. There is already
    a getter method getDisplayPath() implemented to get the path of a node in the
    ScriptNode class. This method will return the display path for the given node.


    # Checking the properties of a node


    Now, you want to see some properties of a node. For example, you are planning
    to modify the description property. Prior to this, you want to know what the value
    is before you change the value and want to log it for reference. The ScriptNode
    API is of biggest help when it comes to performing node-related things. With the
    help of the ScriptNode API, you can easily get the property value in different
    ways as follows:


    ```

    var description = node.properties.description;

    var description = node.properties["description"];

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: '```

    ```javascript

    var description = node.properties["cm:description"];

    var description = node.properties["{http://www.alfresco.org/model/content/1.0}description"];

    ```

    ```


    We just saw four different ways you can read the property of a node. If you have
    some custom property, you should use one of the last two options.


    # Logging the property value


    Now before modifying the description property, you want to log the older value
    for reference. Using the logger root object, you can simply invoke the log method
    of the logger root object as follows:


    ```

    ```javascript

    logger.log("before change description value : " + description);

    ```

    ```


    We used the logger root object and invoked the log method to log the property
    value. Each time logging is required to be added in the JavaScript controller,
    you can use the `logger.log()` method.


    # Modifying property of a node


    Now, you want to modify the `description` property. Again with the help of the
    ScriptNode API, you can easily perform it as follows:


    ```

    ```javascript

    node.properties.description = "change in description";

    ```

    ```


    We just set a new value to the `description` property. You can also use the other
    three ways we saw to access the property and set a new value for it.


    # Getting the current username and e-mail


    You might be interested to know which user has invoked the web scripts. For this,
    you might want to log the username and e-mail address of the user who executed
    the web script as follows:


    ```

    ```javascript

    logger.log(person.properties.username + " --- " + person.properties.email + "---
    executed webscript");

    ```

    ```


    We used the root object `person`, which basically is `ScriptNode`. Also, we fetched
    the username and e-mail properties for a user who is currently running the web
    script. You can trace through the logs and find out which users executed the web
    script; this might be very useful at some point in time later.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Returning the guest home node


    Let''s say for some requirement, you need to get noderef of the guest home folder.
    This can be done using the childByNamePath method available in the ScriptNode
    API as follows:


    ```

    model.foldernode = companyhome.childByNamePath("Guest Home");

    ```


    In the response template, you can get the noderef value from the model object
    foldernode using the TemplateNode API the way we did in the earlier example.


    We used the companyhome root object and the childByNamePath() method. For any
    ScriptNode type of object, you can use this method and get the noderef of its
    children. For example, you have a folder hierarchy Company Home > Testing > QA
    > Performance_Testing. Now if you have the node of Testing folder and you want
    to get the node of Performance_Testing, then you can call the method on the Testing
    folder node giving the path as childByNamePath("QA/Performance_Testing").


    # Creating your own root object


    We saw some of the generic examples of how to use root objects and JavaScript
    APIs in the JavaScript controller. You should be able to now explore the other
    root objects and related JavaScript APIs and find out which ones you can use to
    develop the web script as per your business requirement. Now, let''s see something
    very interesting.


    Consider a scenario wherein you want to execute some part of the JavaScript controller
    as a system user. The first thing that you will do is go through the available
    JavaScript APIs to find out whether there is a suitable API for this functionality
    is available or not. After doing an analysis, you will find that there isn''t
    such an API available out-of-the-box. However, you found that if the web script
    had been a Java-backed web script, you could have used the Java API to do this.
    However, yours is the JavaScript-based web script. Now, what is next? You must
    be thinking how to perform this in the JavaScript API as well? No worries, it
    is possible to do the same in JavaScript controller as well. All you need to do
    is create a custom JavaScript extension.'
  merge: -1
  img_proc: true
- pgno: 129
  md: "# # Custom JavaScript extension\n\nYou learned earlier that each JavaScript\
    \ API has baseJavaScriptExtension as a parent. You can try the following steps\
    \ to create a custom JavaScript extension, which will provide you with the API\
    \ methods to run some part of the web script as the system user and then revert\
    \ back to the original user to execute the other portion of the web script:\n\n\
    +   1. Create a context file and add the following bean entry to it:\n+   \n+\
    \   ```xml\n+   <bean id=\"customAdmin\" parent=\"baseJavaScriptExtension\"\n\
    +         class=\"com.example.CustomAdminAPI\">\n+       <property name=\"extensionName\"\
    >\n+           <value>customauth</value>\n+       </property>\n+   </bean>\n+\
    \   ```\n\n+   2. Create a Java class `com.example.CustomAdminAPI`, which will\
    \ extend the `org.alfresco.repo.processor.BaseProcessorExtension` class and declare\
    \ the variable as follows:\n+   \n+   ```java\n+   net.sf.acegisecurity.Authentication\
    \ auth;\n+   ```\n\n+   3. Implement three public methods inside this class. The\
    \ first method is to save current user's authentication, the second method is\
    \ to run as a system user, and the third method is to clear the security context\
    \ and set back the original user's authentication. The following is the code snippet\
    \ for the three methods we just discussed:\n\n```\n```java\npublic void saveCurrentUserAuthentication()\
    \ {\n    auth = AuthenticationUtil.getFullAuthentication();\n}\n\npublic void\
    \ executeAsSystemUser() {\n    AuthenticationUtil.setRunAsUserSystem();\n    AuthenticationUtil.setFullyAuthenticatedUser(AuthenticationUtil.\n\
    \    SYSTEM_USER_NAME);\n}\n\npublic void setBackOriginalUserAuthentication()\
    \ {\n    AuthenticationUtil.clearCurrentSecurityContext();\n    AuthenticationUtil.setFullAuthentication(this.auth);\n\
    }\n```\n```\n\n+   4. Now, deploy the files and restart the server."
  merge: -1
  img_proc: true
- pgno: 130
  md: 'In your JavaScript-backed controller, you should now be using the newly created
    custom JavaScript extension as follows:


    ```

    customauth.saveCurrentUserAuthentication();

    customauth.executeAsSystemUser();

    //Your piece of code you want to run as system user.

    customauth.setBackOriginalUserAuthentication();

    ```


    We just created a custom JavaScript extension, exposing a root object through
    which you can access the API methods created for it. This is how you can create
    a custom JavaScript extension in a scenario where you are not able to find the
    relevant API that you are looking for.


    # Summary


    In this chapter, we have gone through all the possible functionalities that you
    can do inside your JavaScript controller for a web script using the available
    JavaScript APIs. We gained knowledge about how to identify the JavaScript APIs
    from the Alfresco codebase. We also went through the list of common root objects
    exposing the JavaScript APIs we found from the Alfresco codebase.


    Next, we went through various other root objects provided by the web script framework
    in Alfresco. Later, we saw some code examples so you understand how to use root
    objects and the relevant JavaScript API inside the controller to do some generic
    operations on a node in Alfresco. At the end, you learned how to create a custom
    JavaScript extension to create your own root object and expose the relevant API
    method for the custom root object when the available JavaScript API does not meet
    your requirements. Overall, you have now got an understanding of how to develop
    a JavaScript controller using various JavaScript APIs to build up a web script
    controller as per your business requirements.


    In the next chapter, we are going to take a look at some of the very useful and
    important things about web script development such as deploying, debugging, and
    troubleshooting web scripts.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Deployment, Debugging, and

    Troubleshooting Web Scripts


    In this chapter, we will cover the following topics:


    +   - Deployment options for Alfresco web scripts

    +   - Details on debugging web scripts

    +   - Useful troubleshooting pointers to some common problems related to web scripts

    +   - Some important tips to execute web scripts on a production server'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'It is really important to know two things: how you can deploy what you have
    developed and how you can debug if something does not work the way it should.
    If you know these two things, then your job becomes easier and you can quickly
    identify the solution to some of the critical issues you are working on for your
    project.


    While working on web scripts in Alfresco, the first phase of web script development
    is the creation of web scripts, wherein you will develop the required building
    blocks of a web script. The second most important phase is to deploy and register
    the web script in order to make the web script you have created available to the
    web script framework in Alfresco. This will enable you to make use of your web
    script. As a developer, it is important to understand various deployment options
    with which you can deploy Alfresco web scripts. Also, you should know how you
    can debug web scripts in Alfresco.


    In this chapter, we will take a look at the possible ways you can deploy web scripts
    in Alfresco. Also, we will go through debugging techniques for web scripts and
    some useful troubleshooting pointers. We will also look at some useful tips that
    will be very helpful when executing web scripts for your project on a production
    server.


    # # Deployment options


    There are two possible ways you can have your web scripts deployed:


    +   - Using the repository option

    +   - Using the filesystem option


    When creating web scripts in Alfresco, you might be creating Java-backed or JavaScript-backed
    web scripts for your project. Both can be deployed in different ways. It is important
    to know where you can deploy a web script with each deployment option and also
    which option is more suitable to you.


    # ## The repository option


    In simple words, deploying a web script using the repository option means putting
    the web script component files inside a specific location within the repository.


    First, let''s take a look at the deployment of JavaScript-based web scripts. JavaScript-based
    web scripts can be deployed in the Alfresco repository. All the components for
    the JavaScript-based web script such as the description document, JavaScript-backed
    controller implementation, one or more response templates, configuration documents
    if any, and optional message bundles can be deployed in the Alfresco repository.'
  merge: -1
  img_proc: true
- pgno: 133
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 134
  md: "# Understanding deployment locations\n\nWe just saw that to deploy web scripts\
    \ using the repository option, there are two probable locations where web scripts\
    \ can be deployed. For deploying web scripts using the filesystem location, there\
    \ are four such probable locations. As a developer, you must be interested to\
    \ find out how these deployment locations are identified for both these deployment\
    \ options.\n\nIt is good to know the technical details behind this. While registering\
    \ web scripts, there is always a lookup of web scripts performed by the `org.springframework.extensions.webscripts.DeclarativeRegistry`\
    \ class prior to registering the web script. It uses `org.springframework.extensions.webscripts.SearchPath`,\
    \ which is basically a collection of store. If you take a look at each store defined\
    \ under the `searchPath` collection, you will find the path locations, which are\
    \ basically the six deployment locations we saw earlier. Let's take a look at\
    \ how it is wired as a spring bean definition in Alfresco.\n\nHere is the bean\
    \ entry for `SearchPath` from `web-scripts-application-context.xml` that is available\
    \ at the location `tomcat\\webapps\\alfresco\\WEB-INF\\classes\\alfresco` inside\
    \ your Alfresco installed directory. If you are using Alfresco Community 5, it\
    \ is located under the `alfresco` package inside `alfresco-remote-api-*.jar`.\n\
    \n```\n```xml\n<bean id=\"webscripts.searchpath\" class=\"org.springframework.\n\
    \    extensions.webscripts.SearchPath\">\n    <property name=\"searchPath\">\n\
    \        <list>\n            <ref bean=\"webscripts.store.repo.extension\" />\n\
    \            <ref bean=\"webscripts.store.repo\" />\n            <ref bean=\"\
    webscripts.store.client.extension\" />\n            <ref bean=\"webscripts.store.client\"\
    \ />\n            <ref bean=\"webscripts.store.alfresco\" />\n            <ref\
    \ bean=\"webscripts.store\" />\n        </list>\n    </property>\n</bean>\n```\n\
    ```\n\nIn the previous bean definition, under the `list` property, the first two\
    \ beans are holding the path for repository deployment locations and the other\
    \ four are holding the path for filesystem deployment locations we saw earlier.\
    \ You can take a look at each of these bean definitions in `web-scripts-application-context.xml`\
    \ for more details."
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/f02f759059b86af67e38b543d498a0d8_135_0.png)


    You must have some questions like what if the web script is deployed using both
    the repository and filesystem deployment options, or what will happen if a web
    script is deployed at more than one location, then which location would take precedence?

    The answer to this is simple. Web scripts will be searched based on the order
    they have been displayed under the bean definition for SearchPath. This means
    that first it would search under the repository locations in sequence and then
    in the filesystem location in sequence.


    # Choosing the deployment option


    Choosing the repository option or filesystem option for web script deployment
    can be decided based on a number of parameters, such as the number of web scripts
    to be developed for your project, whether frequent changes to the web scripts
    are required or not, whether the team members are given access to the server machines
    where Alfresco is installed, and whether you are looking to manage the code for
    web scripts as a part of your source control tree or not.


    If a large number of web scripts are to be developed, then you should choose the
    filesystem deployment option and manage them as a part of your source control
    tree. The advantage of doing this will be that you can easily deploy web scripts
    that are building your business solutions along with your other customized extension
    code using the same build and deployment tool you used for customized extensions.
    There is no overhead of uploading web script files in the repository. You must
    also ensure that you have access to the server where Alfresco is installed; otherwise,
    you could be in trouble when you want to deploy and test the fixes you made to
    the web script and the fix quickly needs to be deployed on the live production
    system.


    While using the repository option for deployment, web script files are present
    in the repository similar to other content. If you need to do some modification
    to your web scripts, then it can be easily done by editing the relevant file.
    Hence, web scripts can be easily edited when required. The good thing about this
    approach is that you do not need to have access to the server where Alfresco is
    installed. You just need to be able to access the repository through the user
    interface. In a scenario where some quick fixes are to be deployed to fix some
    critical issues, you can implement a JavaScript-based web script and deploy your
    web script using the repository option.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Debugging web scripts


    You have completed the development of your web scripts, deployed them successfully,
    and even registered your web scripts to the web script engine. Now, while testing
    the web script functionalities, you found that the logic you have included in
    the web script controller is not working as expected. Hence, your web scripts
    are failing to return the required response. The next thing you want to find out
    is what went wrong and why they are not working the way they should. It''s now
    time to debug to identify the issue that will give you hints to fix the issue.
    We will now take a look at how to enable logging, how to remote debug at the server,
    and also some useful debugging techniques.


    # Enable logging


    Enabling the logging feature would be of great help while debugging an issue.
    Let''s understand how to use logging in the case of both Java- and JavaScript-backed
    web scripts. The most important file you should remember is the log4j.properties
    file, which is available at the tomcat\webapps\alfresco\WEB-INF\classes location
    inside your Alfresco installation directory.


    For debugging Java-backed web scripts, we need to perform the following steps:


    +   1. You have the option to add org.apache.log4j.Logger statements in your Java
    implementation of the controller.

    +   2. Then, you need to have the entry of your Java class added in the log4j.properties
    file.

    +   3. For example, you have the Java class for your web script as com.example.TestWebScript.
    After adding the appropriate logger statements to the Java controller class, you
    should make an entry for the Java controller in the log4j.properties file as log4j.logger.com.example.TestWebScript=debug.

    +   4. Restart the server and then hit your web script; you should be able to
    see the logger statements from the Java controller of the web script in the catalina
    logs.


    For debugging JavaScript-backed web scripts, you will have to leverage the logger
    root object as follows:


    +   1. You should add the required logger statements using the logger.log method
    in the JavaScript controller so that you can get enough details when you are looking
    at the logs.'
