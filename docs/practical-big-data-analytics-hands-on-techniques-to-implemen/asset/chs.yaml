  \n## 大数据平台的技术要素\n\n到目前为止，我们的讨论一直聚焦于企业环境中大数据解决方案设计和部署的高层特征。现在，我们将把注意力转向这类工作的技术方面。在适当的时候，除了讨论主题的技术基础之外，我们还会加入一些高层次的说明。\n\
  \n在技术层面，主要有两个考量：\n\n- 硬件栈的选择\n- 软件和BI（**商业智能**）平台的选择\n\n在最近2-3年中，企业越来越多地将其流程迁移到基于云的环境，作为内部基础设施的补充解决方案。因此，基于云的部署变得极为普遍，因而增加了关于本地部署与云部署的额外章节。请注意，术语\
  \ *On-premises*（本地部署）可以与 **In-house**（内部）、**On-site**（现场）以及其他类似术语互换使用。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_45_0.png)\n\
  \n> 你经常会听到 **On-premise** 被用作 *On-premises* 的替代词。正确的术语是 **On-premises**。《钱伯斯词典》将\
  \ **premise** 定义为 *premise 名词 1（也作 premises）被假定为真实的事物，作为进一步陈述的基础*。另一方面，**premises**\
  \ 是一个用来表示建筑物（以及其他事物）的术语，并且可以说更有意义。\n\n## 硬件栈的选择\n\n硬件的选择通常取决于所选择的解决方案类型以及硬件的部署位置。正确的选择取决于几个关键指标，例如数据类型（结构化、非结构化或半结构化）、数据规模（GB、TB\
  \ 或 PB），以及在一定程度上数据更新的频率。最佳选择需要对这些变量进行正式评估，本书后面将对此进行讨论。从高层来看，我们可以总结出三种广泛的硬件架构模型：\n\
  \n- **多节点架构：** 这通常涉及相互连接并按照多节点或分布式计算原理工作的多个节点（或服务器）。多节点架构的典型例子是 Hadoop，其中多台服务器保持双向通信以协调作业。其他技术，如\
  \ Cassandra 这类 NoSQL 数据库和 Elasticsearch 这类搜索与分析平台，也基于多节点计算架构原理运行。它们中的大多数利用*商用服务器*，这是按企业标准相对低端机器的另一种名称，这些机器协同工作以提供大规模数据挖掘和分析能力。多节点架构适用于托管\
  \ TB 级及以上的数据。\n- **单节点架构：** 单节点是指在单一服务器上完成计算。随着多节点计算工具的出现，这种方式相对不常见，但与分布式计算架构相比仍保留着巨大优势。*分布式计算的谬误*概述了一系列与分布式系统实现相关的断言或假设，例如网络的可靠性、延迟成本、带宽以及其他考虑因素。如果数据集是结构化的、主要包含文本数据，并且规模在1–5\
  \ TB 量级，那么在当今的计算环境中，完全可以像后面章节所展示的那样，使用特定技术在单节点机器上托管这些数据集。\n- **云架构：** 在过去几年中，业界出现了大量基于云的解决方案。这些解决方案通过提供一个平台，使得根据当前任务需求按需配置硬件资源变得极其容易，从而大大降低了大数据分析的门槛。这实质上减少了采购、管理和维护物理硬件以及在内部数据中心设施中托管这些硬件所带来的巨大开销。\n\
  \n亚马逊网络服务（Amazon Web Services）、微软的 Azure 以及谷歌计算环境（Google Compute Environment）等云平台允许企业配置数十到数千个节点，成本低至每个实例每小时1美分。\n\
  \n随着云供应商相对于传统实体托管设施的主导地位日益增强，出现了若干用于管理客户云环境的补充服务。\n\n例如云管理公司，如提供大数据即服务解决方案的 Altiscale，以及促进多种云解决方案选择与管理的\
  \ IBM Cloud Brokerage。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_46_0.png)\n\n\
  **硬件成本的指数级下降：** 在过去几年中，硬件成本呈指数级下降。举例来说，根据 Statistic Brain 的研究，2013 年硬盘存储的成本约为每GB\
  \ 4美分。相比之下，2000年时每GB为7美元，而在80年代初每GB超过10万美元。鉴于商业软件的许可成本很高，往往可能超过硬件成本，因此分配足够的预算来采购性能足够的硬件解决方案是合理的。软件需要适当的硬件才能提供最佳性能，因此，对硬件选择给予同等重视与选择合适的软件同样重要。\n\
  \n\n\n\n\n## 软件栈的选择\n\n数据挖掘的软件栈选择因具体情况而异。最受欢迎的专门用于数据挖掘的选项如下所示，同时也列出了一些备选方案，虽然知名度不如前者，但在处理大规模数据集方面同样出色：\n\
  \n- **Hadoop 生态系统：** 大数据术语 arguably 起源于 Hadoop 在流行领域的出现。Hadoop 生态系统由 Apache 软件基金会旗下管理的多个项目组成。Hadoop\
  \ 支持大数据领域中众所周知的几乎所有各种类型的数据集——例如结构化、非结构化和半结构化。其蓬勃发展的辅助工具生态系统不断增加新功能，以及公司竞相展示下一个大数据新事物的快速发展的市场意味着\
  \ Hadoop 将在可预见的未来持续存在。除了大型生态系统中存在的项目外，Hadoop 有四个主要组件，分别是：\n  - **Hadoop Common：**\
  \ 支持其他 Hadoop 模块的通用工具\n  - **Hadoop 分布式文件系统 (HDFS™)：** 一种分布式文件系统，提供对应用程序数据的高速吞吐访问\n\
  \  - **Hadoop YARN：** 用于作业调度和集群资源管理的框架\n  - **Hadoop MapReduce：** 基于 YARN 的大规模数据集并行处理系统\n\
  \n- **Apache Spark™：** Apache Spark 最初是在加州大学伯克利分校 AMPLab 构想的一个多节点计算框架项目，作为一个平台提供无缝接口来运行并行计算并克服\
  \ Hadoop MapReduce 框架的局限性。特别是，Spark 内部利用了 **DAG—有向无环图——** 的概念，这表明其具有将一组操作优化为更少、或计算效率更高的操作集的功能。此外，Spark\
  \ 提供了多个 **API—应用程序编程接口—** 给常用的语言，如 Python（PySpark）和 Scala（原生可用接口）。这消除了进入 Hadoop\
  \ 空间的障碍之一，即必须掌握 Java 知识。\n\n## 总结\n\n在本章中，我们对大数据以及在企业中实施大数据解决方案的一些组件进行了高层次概述。大数据需要选择最佳的软件和硬件栈，这项工作并非易事，尤其因为行业中存在数百种解决方案。虽然大数据战略的主题可能被认为更适合管理层而非技术受众，但理解其细微差别至关重要。\n\
  \n请注意，如果没有适当的、定义良好的战略以及相应的高层支持，IT 部门在提供成功解决方案方面的能力将受到限制。此外，解决方案，包括硬件-软件栈，应该能够由现有的\
  \ IT 资源得到充分管理和支持。大多数公司会发现，为大数据实施招聘新员工是必不可少的。由于此类实施需要评估各种要素——业务需求、预算、资源和其他变量，因此根据规模和范围的不同，通常需要数月到一年甚至更长时间的提前期。\n\
  \n这些主题将在后续章节中深入讨论，本节作为该主题的初步介绍。\n"
- "## 分析工具包\n\n目前有多个平台用于大规模数据分析。在广义上，这些平台分为主要用于数据挖掘的平台，例如使用 NoSQL 平台分析大型数据集，以及用于数据科学的平台——即机器学习和预测分析。经常情况下，解决方案可能同时具有这两种特征——用于存储和管理数据的稳健底层平台，以及在其之上构建的提供数据科学额外能力的解决方案。\n\
  \n在本章中，我们将向您展示如何安装和配置您的分析工具包，这是一套我们将在后续章节中使用的软件：\n\n- 分析工具包的组件\n- 系统建议\n  - 在笔记本电脑或工作站上安装\n\
  \  - 在云上安装\n- 安装 Hadoop\n  - Hadoop 发行版\n  - Cloudera Hadoop 发行版 (CDH)\n- 安装 Spark\n\
  - 安装 R 和 Python\n\n## 分析工具包的组件\n\n本书将使用几种用于大数据挖掘以及更广泛数据科学的关键技术。我们的分析工具包包括 Hadoop\
  \ 和 Spark，可以在用户本地机器以及云上安装；以及 R 和 Python，两者也可以在用户机器或云平台上安装。您的分析工具包将包括：\n\n| 软件/平台\
  \ | 用于数据挖掘 | 用于机器学习 |\n|---|---|---|\n| Hadoop | X | |\n| Spark | X | X |\n| Redis\
  \ | X | |\n| MongoDB | X | |\n| 开源 R | X | X |\n| Python (Anaconda) | X | X |\n\
  | Vowpal Wabbit | | X |\n| LIBSVM, LIBLINEAR | | X |\n| H2O | | X |\n\n## 系统建议\n\
  \n如果您在本地机器上安装 Hadoop，建议您的系统至少具有 4-8 GB 的 RAM（内存）以及至少 50 GB 的足够空闲磁盘空间。理想情况下，8 GB\
  \ 或更多内存足以满足大多数应用需求。在此之下，性能会降低，但不会阻止用户完成练习。请注意，这些数字是适用于本书中概述练习的估计值。生产环境自然会有更高的要求，这将在后续阶段讨论。\n\
  \n安装分析软件，尤其是 Hadoop 等平台，在技术复杂性方面可能相当具有挑战性，用户遇到需要 painstakingly 解决的错误的情况非常常见。用户花费的时间试图解决错误和修复安装问题往往超过理想情况。这种额外的开销可以通过使用\
  \ **虚拟机 (VM)**，或更近期的容器如 Docker 来轻松缓解。对于 R 和 Python 等更简单的平台，我们将使用预装了各种库的开源版本。\n\n\
