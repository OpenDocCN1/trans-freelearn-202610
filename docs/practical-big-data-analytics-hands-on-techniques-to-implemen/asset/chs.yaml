  \n    Microsoft Open R 版本\n\n3. 下载完成后，双击下载的文件以安装 Microsoft R Open。\n\n4. 请注意，在 macOS\
  \ 上，您可能会收到如下错误消息：\n\n    ![](img/8ededb1e0b69e85687f6e488d1044b79_70_0.png)\n\n\
  5. 如果出现这种情况，请右键单击下载的文件并从弹出的菜单中选择 **Open**。这将让您手动打开文件并安装：\n\n    ![](img/8ededb1e0b69e85687f6e488d1044b79_70_1.png)\n\
