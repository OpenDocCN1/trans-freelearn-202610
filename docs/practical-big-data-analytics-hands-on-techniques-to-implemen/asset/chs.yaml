  \ 上使用 Spark 的完整教程，Databricks 是一个可让用户利用 Spark 的平台\n\n第 7 章《机器学习概念入门》讲述了机器学习中的基本概念。此外，还讨论了监督学习与无监督学习、分类、回归、特征工程、数据预处理和交叉验证等核心概念。本章以使用\
