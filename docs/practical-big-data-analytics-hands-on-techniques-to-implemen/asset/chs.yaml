  \nfor line in sys.stdin:\n    line = line.strip()\n    keys = line.split()\n   \
  \ for key in keys:\n        value = 1\n        print(\"%s\\t%d\" % (key,value))\n\
  ```\n\n```shell\n[cloudera@quickstart cyrus]$ vi reducer.py # Copy-Paste the content\
  \ of reducer.py as shown below using the vi or nano Unix editor.\n\n[cloudera@quickstart\
  \ cyrus]$ cat reducer.py\n```\n\n```python\n#!/usr/bin/env python\n\nimport sys\n\
  sys.path.append('.')\n\nlast_key = None\nrunning_total = 0\n\nfor input_line in\
  \ sys.stdin:\n    input_line = input_line.strip()\n    this_key, value = input_line.split(\"\
  \\t\", 1)\n    value = int(value)\n\n    if last_key == this_key:\n        running_total\
  \ += value\n    else:\n        if last_key:\n            print(\"%s\\t%d\" % (last_key,\
  \ running_total))\n        running_total = value\n        last_key = this_key\n\n\
  if last_key == this_key:\n    print(\"%s\\t%d\" % (last_key, running_total))\n```\n\
  \n```shell\n[cloudera@quickstart cyrus]$ chmod 755 *.py\n```\n\n7. 执行 mapper 和 reducer\
