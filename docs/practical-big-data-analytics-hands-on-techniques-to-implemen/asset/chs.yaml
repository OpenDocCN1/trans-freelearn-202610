  \n# ### 聚合示例\n\n# ### 按年份统计并汇总诺贝尔奖获得者总数并按降序排序\n\n### 步骤 1：使用 `$group` 操作符指示 prize.year\
  \ 将为分组变量\n### 步骤 2：使用 `$sum` 操作符（累加器）对名为 totalPrizes 的变量下的每个条目求和\n### 步骤 3：使用 `$sort`\
