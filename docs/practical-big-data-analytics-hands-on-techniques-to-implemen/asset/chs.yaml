  \n## 使用真实世界数据追踪医生付款\n\n医生和医院一样，会从各种外部组织获得付款，例如制药公司，他们聘请销售代表不仅向从业者介绍其产品，还提供礼物或实物付款或其他形式的付款。理论上，给予医生的礼物或付款并不\
  \ intended to 影响其处方行为，制药公司会采取谨慎措施来保持对向医疗服务提供者付款的监督和制衡。\n\n## 安装 kdb+\n\n**kdb+**\
  \ 是一种时序、内存型、列式数据库，已在金融行业使用了近 20 年。它是用于执行大规模数据挖掘的最快的数据库平台之一，但由于其在大部分存在时间内几乎完全被对冲基金和投资银行使用，因此不如其他\
  \ NoSQL 工具知名。特别是由于其处理海量数据的速度快且开销低，它被用于从事高频交易的算法交易台。\n\n使用 kdb+，在笔记本电脑上分析数千万甚至数亿条记录相当简单。主要限制在于硬件层面，例如可用于处理数据的内存、磁盘空间和\
  \ CPU 量。在本教程中，我们将安装可供非商业用途使用的免费 32 位版 kdb+。\n\nkdb+ 不是开源的，但学术机构可以通过写信至 academic@kx.com\
  \ 免费使用 64 位许可证。\n\nkdb+ 具有某些关键特性，使其非常适合大规模数据分析：\n\n- **低级实现：** 数据库用 C 编写，从而减少了大多数当代\
  \ NoSQL 数据库常见的性能问题原因，这些数据库严重依赖 Java，而 Java 实现了多层抽象以提供处理能力\n- **架构简洁：** kdb+ 数据库的整个二进制文件约为\
  \ 500–600 KB。这是 MP3 歌曲大小的一小部分，即使在拨号连接上也可以轻松下载\n- **MapReduce：** 数据库实现了内部 MapReduce\
  \ 过程，允许查询同时在多个核心上执行\n- **无需安装：** 数据库不需要系统级权限，用户可以在大多数系统上使用其用户帐户开始使用 kdb+\n- **企业就绪：**\
  \ 该数据库已使用近 20 年，是一款非常成熟的产品，已在全球企业环境中用于高频交易数据分析等应用\n- **接口广泛可用：** 数据库为 C、C++、C#、Java、R、Python、MATLAB\
  \ 等语言提供广泛的接口，以便与现有软件轻松集成\n\n安装 kdb+ 的步骤如下。请注意，如果您使用的是 Packt Data Science VM，则无需额外安装。这些说明主要为希望重新安装软件的用户提供。\n\
