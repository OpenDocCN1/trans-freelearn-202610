  \ 访问。创建账户和执行必要步骤的说明已在第 6 章 *Spark for Big Data Analytics* 中提供。\n\n## 安装 R\n\nR 是一种统计语言，在过去\
  \ 3-5 年中变得极其流行，尤其作为可用于多种用例的平台，范围从简单的数据挖掘到复杂的机器学习算法。根据 2016 年中 IEEE Spectrum 发布的一篇文章，R\
  \ 在全球十大语言中排名第 5。\n\n开源 R 可从 `https://www.r-project.org` 通过位于 `https://cran.r-project.org/mirrors.html`\
  \ 的 CRAN 站点下载。\n\n或者，您也可以从 Microsoft R Open 页面 `https://mran.microsoft.com/rro/`\
  \ 下载。这此前被称为 Revolution R Open，是 Revolution Analytics 发布的一个增强版开源 R。微软在 2015 年收购 Revolution\
  \ Analytics 后，将其重新命名。\n\nMicrosoft R Open 包含 R 的所有功能，还包括以下内容：\n\n- 默认安装了大量 R 包以及微软公司发布的一套专用包，可补充开源\
  \ R 的现有功能\n- 用于 R 中多线程计算的多线程数学库\n- 一个固定的 CRAN 仓库，称为 MRAN。CRAN，即 Comprehensive R\
  \ Archive Network，是一个包含 R 二进制文件、包和相关内容的站点集合。CRAN 上的包可以持续更新。MRAN 对 CRAN 进行固定快照，直到下一次发布，保持不变，从而实现可重复性和一致性。\n\
  \n### 下载和安装 Microsoft R Open 的步骤\n\n我们按如下方式进行：\n\n1. 转到 `https://mran.microsoft.com`\
  \ 并点击 **Download Now** 按钮：\n\n    ![](img/8ededb1e0b69e85687f6e488d1044b79_68_0.png)\n\
