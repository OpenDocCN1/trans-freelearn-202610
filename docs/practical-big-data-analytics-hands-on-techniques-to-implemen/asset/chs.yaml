  \n## What is machine learning?\n\n**Machine learning** is not a new subject; it\
  \ has existed in academia for well over 70 years as a formal discipline, but known\
  \ by different names: statistics, and more generally mathematics, then **artificial\
  \ intelligence (AI)**, and today as machine learning. While the other related subject\
  \ areas of statistics and AI are just as prevalent, machine learning has carved\
