  \n## 摘要\n\n本章介绍了数据科学中使用的主要工具。特别是，它演示了如何下载和安装用于 Cloudera Hadoop 分发版（CDH）、Spark、R、RStudio\
  \ 和 Python 的虚拟机。虽然用户可以下载 Hadoop 的源代码并在例如 Unix 系统上安装它，但这通常会遇到问题并且需要相当多的调试。使用 VM 代替可以让用户以最少的努力开始使用和学习\
  \ Hadoop，因为它是一个完整的预配置环境。\n\n此外，R 和 Python 是机器学习和一般分析中最常用的两种语言。它们适用于所有流行的操作系统。虽然它们可以在\
  \ VM 中安装，但建议用户如果可行的话尝试在本地机器（笔记本电脑/工作站）上安装它们，因为这样性能相对更高。\n\n在下一章中，我们将更深入地探讨 Hadoop\
  \ 的细节及其核心组件和概念。\n\n# 4\n使用 Hadoop 处理大数据\n\nHadoop 已成为大数据世界的事实标准，尤其是在过去三到四年里。Hadoop\
  \ 于 2006 年作为 Apache Nutch 的子项目启动，并引入了与分布式文件系统和分布式计算相关的两个关键特性，也称为 MapReduce，这些特性在开源社区中迅速流行起来。如今，已有数千种新产品利用\
  \ Hadoop 的核心功能开发出来，它已发展成为一个庞大的生态系统，由超过 150 种相关主要产品组成。可以说，Hadoop 是启动大数据和分析行业的首要催化剂之一。\n\
  \n在本章中，我们将讨论 Hadoop 的背景和核心概念、Hadoop 平台的组件，并深入探讨 Hadoop 生态系统中的主要产品。我们将学习分布式文件系统和分布式处理的核心理念以及提高\
  \ Hadoop 部署性能的优化措施。我们将以使用 Cloudera Hadoop 分发版（CDH）的实际动手练习作为结尾。我们将涵盖的主题有：\n\n- Hadoop\
  \ 的基础知识\n- Hadoop 的核心组件\n- Hadoop 1 和 Hadoop 2\n- Hadoop 分布式文件系统\n- 使用 MapReduce\
  \ 的分布式计算原理\n- Hadoop 生态系统\n- Hadoop 生态系统概述\n\n- Hive、HBase 等\n- Hadoop 企业部署\n- 内部部署\n\
  - 云部署\n- 使用 Cloudera Hadoop 动手实践\n- 使用 HDFS\n- 使用 Hive\n- 使用 WordCount 进行 MapReduce\n\
  \n## Hadoop 的基础\n\n2006 年，Hadoop 的创建者 Doug Cutting 在 Yahoo! 工作。他积极参与了一个名为 Nutch\
  \ 的开源项目，该项目涉及大规模网络爬虫的开发。网络爬虫在高层次上本质上是能够以自动方式在互联网上浏览和索引网页的软件。直观地说，这涉及对大量数据进行高效管理和计算。2006\
  \ 年 1 月下旬，Doug 正式宣布启动 Hadoop。请求的第一行，仍可在互联网上的 `https://issues.apache.org/jira/browse/INFRA-700`\
  \ 获取，为 *The Lucene PMC has voted to split part of Nutch into a new subproject named\
  \ Hadoop.* 而 Hadoop 就此诞生。\n\n起初，Hadoop 有两个核心组件：**Hadoop 分布式文件系统（HDFS）** 和 MapReduce。这是\
  \ Hadoop 的第一个迭代，也现在被称为 Hadoop 1。后来，在 2012 年，添加了第三个组件，称为 **YARN（Yet Another Resource\
  \ Negotiator）**，它解耦了资源管理和作业调度的过程。在深入探讨核心组件之前，了解 Hadoop 的基本前提会有帮助：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_79_0.png)\n\
  \nDoug Cutting 在 https://issues.apache.org/jira/browse/NUTCH-193 的帖子宣布了他将 Nutch\
  \ 分布式 FS（NDFS）和 MapReduce 分离到名为 Hadoop 的新子项目中的意图。\n\n## Hadoop 的基本前提\n\nHadoop 的基本前提是，与其尝试在一台大型机器上执行任务，不如将任务细分为较小的段，然后将这些段委托给多台较小的机器。这些所谓的较小的机器随后将在其各自的数据部分上执行任务。一旦较小的机器完成分配给它们的任务并产生结果，各个结果单元将被汇总以产生最终结果。\n\
  \n虽然从理论上看这似乎相对简单，但仍有各种技术考虑需要牢记。例如：\n\n- 网络是否足够快以收集每个服务器的结果？\n- 每个服务器是否能足够快地从磁盘读取数据？\n\
  - 如果一台或多台服务器失败，我们是否必须从头开始？\n- 如果有多个大型任务，应如何优先处理？\n\n在使用这种分布式架构时，还必须考虑许多其他因素。\n\n\
  ## Hadoop 的核心模块\n\nHadoop 的核心模块包括：\n\n- **Hadoop Common**：Hadoop 所需的库和其他通用辅助工具\n\
  - **HDFS**：一种分布式、高可用性、容错的文件系统，用于存储数据\n- **Hadoop MapReduce**：一种涉及在商品服务器（或节点）上进行分布式计算的编程范式\n\
  - **Hadoop YARN**：一种用于作业调度和资源管理的框架\n\n在这些核心组件中，YARN 于 2012 年引入，以解决 Hadoop 首次发布的一些不足。Hadoop\
  \ 的第一个版本（或等价地，Hadoop 的第一个模型）使用 HDFS 和 MapReduce 作为其主要组件。随着 Hadoop 人气飙升，使用超出 MapReduce\
  \ 所提供设施的需求变得越来越重要。这，加上一些其他技术考虑，导致了 YARN 的开发。\n\n现在让我们来看一下之前列出的 Hadoop 的主要特征。\n\n\
  ## Hadoop 分布式文件系统 - HDFS\n\nHDFS 构成了所有 Hadoop 安装的基础。文件，或更一般地数据，存储在 HDFS 中并由 Hadoop\
  \ 的节点访问。\n\nHDFS 执行两个主要功能：\n\n- **命名空间**：提供保存集群元数据的命名空间，即 Hadoop 集群中数据的位置\n- **数据存储**：充当\
  \ Hadoop 集群中数据使用的存储\n\n文件系统被称为分布式，因为数据以块的形式存储在多个服务器上。通过一个简单的示例可以直观地理解 HDFS，如下所示。考虑一本由\
  \ A-Z 章节组成的大书。在普通文件系统中，整本书将作为单个文件存储在磁盘上。在 HDFS 中，这本书将被拆分为较小的块，例如 A-H 章节的一个块、I-P\
  \ 的另一个块、Q-Z 的第三个块。这些块随后存储在单独的机架中（或用此类比来说是书架）。此外，章节被复制三次，使得每个章节都有三份副本。\n\n假设，进一步，整本书的大小为\
  \ 1 GB，每个章节大约为 350 MB：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_81_0.png)\n\n\
  以这种方式存储书籍实现了几个重要目标：\n\n- 由于书籍已被按章节组拆分为三部分，并且每部分被复制了三次，这意味着我们的进程可以通过从不同服务器查询各部分并行读取书籍。这减少了\
  \ I/O 竞争，是并行化正确使用的一个非常合适的例子。\n\n\n\n\n- 如果某个机架不可用，我们可以从任何其他机架检索章节，因为每个章节在不同的机架上都有多个副本。\n\
  - 如果分配给我的任务只需要访问单个章节，例如章节B，我只需访问对应章节A-H的文件。由于对应章节A-H的文件大小只有整本书的三分之一，访问和读取该文件所需的时间会大大减少。\n\
  - 这种模型还可以带来其他好处，例如对不同章节组的选择性访问权限等。\n\n这可能是对实际HDFS功能的一个过度简化的类比，但它传达了该技术的基本原理——大文件被细分为块（chunk），并以高可用性冗余配置分布在多台服务器上。现在，我们将更详细地了解实际的HDFS架构：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_82_0.png)\n\nHadoop的HDFS后端由以下组件组成：\n\n\
  - **NameNode**：可将其视为主节点。NameNode包含集群元数据，并且知道哪些数据存储在哪个位置——简而言之，它持有命名空间。它将整个命名空间存储在RAM中，当请求到达时，提供有关哪些服务器保存任务所需数据的信息。在Hadoop\
  \ 2中，可以有多个NameNode。可以创建一个辅助NameNode，作为主NameNode的辅助节点。因此，它不是备份NameNode，而是帮助保持集群元数据最新的节点。\n\
  - **DataNode**：DataNode是负责存储数据块并在收到新请求时执行计算操作的独立服务器。它们主要是商用服务器，在资源和容量方面不如存储集群元数据的NameNode强大。\n\
  \n## HDFS中的数据存储过程\n\n以下几点应该能让你很好地了解数据存储过程：\n\nHDFS中的所有数据都以块写入，通常为128 MB。因此，一个大小为512\
  \ MB的文件会被分成四个块（4 * 128 MB）。这些块随后被写入DataNode。为了保持冗余和高可用性，每个块都会被复制以创建副本。通常，Hadoop安装的复制因子为3，这意味着每个数据块都会被复制三次。\n\
  \n这保证了冗余，如果某台服务器发生故障或停止响应，总会有第二个甚至第三个副本可用。为了确保这一过程无缝运行，DataNode会将副本放置在不同的独立服务器上，并且还可以确保这些块放置在数据中心不同机架的服务器上。这是因为即使所有副本都位于独立服务器上，但如果所有服务器都在同一个机架上，一旦机架断电，就没有副本可用。\n\
  \n将数据写入HDFS的一般过程如下：\n\n1. NameNode收到将新文件写入HDFS的请求。\n2. 由于数据必须以块（block或chunk）写入，HDFS客户端（发出请求的实体）开始将数据缓存到本地缓冲区，一旦缓冲区达到分配的块大小（例如128\
  \ MB），它就会通知NameNode已准备好写入第一个数据块（chunk）。\n3. NameNode根据其所掌握的HDFS集群状态信息，响应目标DataNode的信息，该DataNode是需要存储块的位置。\n\
  4. HDFS客户端将数据写入目标DataNode，并在块写入过程完成后通知NameNode。\n5. 随后，目标DataNode开始将其数据块副本复制到第二个DataNode，该DataNode将作为当前块的副本。\n\
  6. 第二个DataNode完成写入过程后，会将数据块发送给第三个DataNode。\n7. 这一过程会重复进行，直到与数据（即文件）对应的所有块都复制到不同节点上。\n\
  \n请注意，块的数量取决于文件大小。下图展示了数据在5个DataNode上的分布情况。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_84_0.png)\n\
  \nHadoop第一个发布版本（也称为Hadoop 1）中的HDFS架构具有以下特点：\n\n- 单一NameNode：只有一个NameNode可用，因此它也成为单点故障，因为它存储了所有集群元数据。\n\
  - 多个DataNode：负责存储数据块、处理客户端请求以及对块执行I/O操作（创建、读取、删除等）。\n- Hadoop第二个发布版本（也称为Hadoop 2）中的HDFS架构提供了原始HDFS设计的所有优点，并增加了一些新功能，最显著的是能够拥有多个可充当主NameNode和辅助NameNode的NameNode。其他功能还包括支持多个命名空间以及HDFS联邦（HDFS\
  \ Federation）。\n\n## MapReduce直观介绍\n\n我们以一个假设的组织为例，该组织由CEO、总监和经理组成。CEO想知道公司新入职了多少员工。CEO向其总监发送请求，要求汇报各自部门的新入职人数。总监继而向其各个部门的经理发送请求，要求提供新入职人数。经理将数字提供给总监，总监再将最终数值汇报给CEO。\n\
  \n这可以被视为MapReduce的一个现实世界示例。在这个类比中，任务是找出新入职员工的数量。CEO没有亲自收集所有数据，而是将其委托给总监和经理，他们提供各自部门的数字，如下图所示：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_86_0.png)\n\n在这个相当简化的场景中，将一个大任务（查找整个公司的新入职员工）拆分成较小的任务（每个团队的新入职员工），然后最终将各个数字重新汇总的过程，与MapReduce的工作方式类似。\n\
  \n## 从技术角度理解MapReduce\n\n顾名思义，MapReduce具有map阶段和reduce阶段。map阶段通常是一个应用于输入中每个元素的函数，从而修改其原始值。\n\
  \nMapReduce生成键值对作为输出。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_87_0.png)\n\n\
  **键值对：** 键值对建立了一种关系。例如，如果John今年20岁，一个简单的键值对可以是(John, 20)。在MapReduce中，map操作会生成这样的键值对，其中包含一个实体以及分配给该实体的值。\n\
  \n在实践中，map函数可能很复杂，并涉及高级功能。\n\nreduce阶段接收来自map函数的键值输入，并执行汇总操作。例如，考虑一个map操作的输出，其中包含学校不同年级学生的年龄：\n\
  \n| 学生姓名 | 班级 | 年龄 |\n|---|---|---|\n| John | 一年级 | 7 |\n| Mary | 二年级 | 8 |\n| Jill\
  \ | 一年级 | 6 |\n| Tom | 三年级 | 10 |\n| Mark | 三年级 | 9 |\n\n我们可以创建一个简单的键值对，例如取班级和年龄的值（可以是任何值，但我只是拿这些来举例）。在这种情况下，我们的键值对将是(一年级,\
  \ 7)、(二年级, 8)、(一年级, 6)、(三年级, 10)和(三年级, 9)。\n\n计算每个年级学生年龄平均值的操作就可以定义为reduce操作。\n\n\
  更具体地说，我们可以对输出进行排序，然后将每个年级对应的元组发送到不同的服务器。\n\n例如，服务器A将接收元组(一年级, 7)和(一年级, 6)，服务器B将接收元组(二年级,\
  \ 8)，服务器C将接收元组(三年级, 10)和(三年级, 9)。然后，服务器A、B和C将分别计算元组的平均值，并汇报(一年级, 6.5)、(二年级, 8)和(三年级,\
  \ 9.5)。\n\n注意，在此过程中有一个中间步骤，涉及将输出发送到特定服务器，并对输出进行排序以决定应将其发送到哪个服务器。确实，MapReduce需要一个混洗（shuffle）和排序（sort）阶段，通过该阶段对键值对进行排序，使每个reducer接收一组固定的唯一键。\n\
  \n\n\n\n在这个例子中，假设只有两台服务器而不是三台，那么可以将服务器 A 分配给计算对应等级 1 和等级 2 的键的平均值，而将服务器 B 分配给计算等级\
  \ 3 的平均值。\n\n在 Hadoop 中，MapReduce 过程中会发生以下流程：\n\n1. 客户端发送任务请求。\n2. NameNode 会分配执行\
  \ map 操作的 DataNode（独立服务器）和执行 reduce 操作的 DataNode。请注意，DataNode 服务器的选择取决于操作所需的数据是否位于该服务器的*本地*。数据所在的服务器只能执行\
  \ map 操作。\n3. DataNode 执行 map 阶段并生成键值 (k, v) 对。\n\n当 mapper 生成 (k, v) 对时，会根据节点被分配去计算的*键*将其发送到相应的\
  \ reduce 节点。键到服务器的分配取决于分区函数，该函数可以简单到使用键的哈希值（这是 Hadoop 中的默认设置）。\n\n一旦 reduce 节点收到与其负责计算的键对应的数据集，它就会应用\
  \ reduce 函数并生成最终输出。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_88_0.png)\n\n> Hadoop\
  \ 最大限度地利用了数据本地化的优势。map 操作由在本地（即磁盘上）保存数据的服务器执行。更准确地说，map 阶段将仅由保存该文件对应数据块的服务器执行。通过委托多个独立节点分别执行计算，Hadoop\
  \ 架构可以有效地处理超大规模数据。\n\n## 块大小以及 mapper 和 reducer 的数量\n\n在 MapReduce 过程中，一个重要考虑因素是理解\
  \ HDFS 块大小，即文件被分割成的块的大小。需要访问某个文件的 MapReduce 任务必须对该文件对应的每个块执行 map 操作。例如，对于一个 512\
  \ MB 的文件，如果块大小为 128 MB，则需要四个块来存储整个文件。因此，一个 MapReduce 操作至少需要四个 map 任务，每个 map 操作将应用于数据的每个子集（即四个块中的每一个）。\n\
  \n然而，如果文件非常大，比如说需要 10,000 个块来存储，这意味着我们需要 10,000 个 map 操作。但是，如果我们只有 10 台服务器，那么我们就必须向每台服务器发送\
  \ 1,000 个 map 操作。这可能是次优的，因为它可能导致磁盘 I/O 操作和按每个 map 进行的资源分配设置带来很高的代价。\n\n关于所需 reducer\
  \ 数量的总结在 Hadoop Wiki (https://wiki.apache.org/hadoop/HowManyMapsAndReduces) 上阐述得非常简洁。\n\
  \n> 理想的 reducer 数量应该是能让它们最接近以下条件的最优值：\n> - 块大小的倍数\n> - 任务时间在 5 到 15 分钟之间\n> - 创建尽可能少的文件\n\
  >\n> 除此之外的任何值都意味着你的 reducer 很可能不太理想。\n> 用户往往倾向于使用一个非常大的值（“更多并行意味着更快！”）或一个非常小的值（“我不想耗尽我的命名空间配额！”）。\n\
  > 这两种做法同样危险，会导致以下一种或多种情况：\n> - 工作流下一阶段的性能非常糟糕\n> - 由于 shuffle 导致性能非常糟糕\n> - 因为用最终无用的对象使\
  \ NameNode 过载，导致整体性能非常糟糕\n> - 在没有真正合理理由的情况下破坏磁盘 I/O\n> - 由于处理大量 CFIF/MFIF 工作而导致大量网络传输\n\
  \n## Hadoop YARN\n\nYARN 是 Hadoop 2 中引入的一个模块。在 Hadoop 1 中，管理作业和监控作业的过程由称为 JobTracker\
  \ 和 TaskTracker 的进程执行。运行 JobTracker 守护进程（进程）的 NameNode 会将作业提交给运行 TaskTracker 守护进程（进程）的\
  \ DataNode。\n\n在 MapReduce 中，所有数据都必须从磁盘读取，这对于大型数据集的操作来说是可行的，但对于较小数据集的操作来说并不是最优的。事实上，任何需要极快处理（低延迟）、本质上具有交互性、或具有多次迭代（因此需要多次从磁盘读取同一数据）的任务都会极其缓慢。\n\
  \n通过移除这些依赖，Hadoop 2 允许开发者实现新的编程框架，以支持具有多样化性能要求的作业，例如低延迟和交互式实时查询、机器学习所需的迭代处理、不同的拓扑（如流数据的处理）、以及内存数据缓存/处理等优化。\n\
  \n几个新术语变得重要：\n\n- **ApplicationMaster**：负责管理应用程序所需的资源。例如，如果某个作业需要更多内存，ApplicationMaster\
  \ 将负责获取所需资源。这里的应用程序指的是 MapReduce、Spark 等应用程序执行框架。\n- **Container**：资源分配的单位（例如 1\
  \ GB 内存和四个 CPU）。一个应用程序可能需要多个这样的容器来执行。ResourceManager 分配容器来执行任务。分配完成后，ApplicationMaster\
  \ 请求 DataNode 启动已分配的容器，并接管这些容器的管理。\n- **ResourceManager**：YARN 的一个组件，主要作用是为应用程序分配资源，并取代了\
  \ JobTracker。ResourceManager 进程像 JobTracker 一样运行在 NameNode 上。\n- **NodeManager**：取代了\
  \ TaskTracker，NodeManager 负责向 ResourceManager (RM) 报告作业状态，并监控容器的资源利用率。\n\n下图展示了\
  \ Hadoop 2.0 中 ResourceManager 和 NodeManager 的高层视图：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_92_0.png)\n\
  \nHadoop 2.0\n\nHadoop 2 固有的主要概念已在下图中说明：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_92_1.png)\n\
  \nHadoop 2.0 概念\n\n## YARN 中的作业调度\n\n大型 Hadoop 集群中同时运行多个作业并不罕见。当多个部门提交多个作业时，资源的分配就成为一个重要且确实有趣的话题。例如，如果部门\
  \ A 和 B 同时提交作业，但每个请求都要求获得最大可用资源，那么哪个请求应该获得优先权？通常，Hadoop 使用先进先出（FIFO）策略。也就是说，谁先提交作业，谁就先使用资源。但假如\
  \ A 先提交作业，但完成 A 的作业需要五个小时，而 B 的作业只需五分钟就能完成，那该怎么办？\n\n为了处理作业调度中的这些细微差别和变量，已经实现了多种调度方法。其中较常用的三种是：\n\
  \n- **FIFO**：如上所述，FIFO 调度使用队列来确定作业的优先级。作业按照提交的顺序执行。\n- **CapacityScheduler**：CapacityScheduler\
  \ 按部门（部门可以表示一个逻辑用户组）对可提交的作业数量设定一个值。这是为了确保每个部门或组都能访问 Hadoop 集群，并且能够利用最少量的资源。如果服务器上有未使用的资源，该调度器还允许部门在为其设定的最大值范围内，超出其分配容量进行扩展。因此，CapacityScheduler\
  \ 模型保证了每个部门都能以确定性的方式访问集群。\n- **公平调度器（Fair Schedulers）**：这类调度器尝试在不同应用程序之间均匀平衡资源利用率。虽然在某个特定时间点可能无法实现完全均匀的平衡，但使用\
  \ Fair Scheduler 可以实现随时间推移的分配平衡，从而使平均值大致相似。\n\n这些调度器以及其他调度器提供了细粒度的访问控制（例如按用户或按组），并且主要利用队列来对资源进行优先级排序和分配。\n\
  \n## Hadoop 中的其他主题\n\nHadoop 还有其他一些值得特别提及的方面。由于我们已经详细讨论了最重要的主题，本节将概述其他一些值得关注的主题。\n\
  \n\n\n\n## Encryption\n\n数据加密是各种类型数据的官方法规所强制要求的。在美国，识别患者信息的數據必須符合 HIPAA 規定的規則，該規則規定了此类记录的存储方式。HDFS\
  \ 中的数据可以在静态（磁盘上）和/或传输中进行加密。用于解密数据的密钥通常由 **密钥管理系统 (KMSs)** 管理。\n\n## User authentication\n\
  \nHadoop 可以使用服务器的原生用户身份验证方法。例如，在基于 Linux 的机器上，用户可以根据系统中 `/etc/passwd` 文件中定义的 ID\
  \ 进行身份验证。换句话说，Hadoop 继承了服务器端设置的用户身份验证。\n\n通过 Kerberos 进行用户身份验证在 Hadoop 集群中也很常见，Kerberos\
  \ 是一种跨平台身份验证协议。Kerberos 基于票证的概念，该票证根据需要临时授予用户特权。票证可以使用 Kerberos 命令使无效，从而根据需要限制用户访问集群资源的权利。\n\
  \n请注意，即使用户被允许访问数据（用户身份验证），他或她仍可能因另一个称为授权的功能而受到限制，即可以访问哪些数据。该术语意味着即使用户可以进行身份验证并登录系统，用户也可能仅限于有权访问的数据。这种级别的授权通常使用原生\
  \ HDFS 命令来更改目录和文件的所有权，以指定用户。\n\n## Hadoop data storage formats\n\n由于 Hadoop 涉及存储超大规模数据，因此选择适合您用例的存储类型至关重要。数据可以在\
  \ Hadoop 中以几种格式存储，最佳存储格式的选择取决于您对读写 I/O 速度的要求、文件能否按需压缩和解压缩，以及文件是否易于拆分，因为数据最终将作为块存储。\n\
  \n一些流行且常用的存储格式如下：\n\n- **Text/CSV**：这些是纯文本 CSV 文件，类似于 Excel 文件，但以纯文本格式保存。由于 CSV\
  \ 文件按行包含记录，因此自然很容易将文件拆分为数据块。\n- **Avro**：Avro 的开发是为了提高在异构系统之间高效共享数据的能力。它使用数据序列化将模式和实际数据都存储在一个紧凑的二进制文件中。Avro\
  \ 使用 JSON 存储模式并使用二进制格式存储数据，并将它们序列化为单个 Avro 对象容器文件。Python、Scala、C/C++ 等多种语言都有可读取\
  \ Avro 文件的原生 API，因此它非常便携，非常适合跨平台数据交换。\n- **Parquet**：Parquet 是一种列式数据存储格式。这有助于提高性能，有时可显著提高性能，因为它允许按列存储和访问数据。直观地说，如果您正在处理一个\
  \ 1 GB、100 列、100 万行的文件，并且只想查询 100 列中的一列，能够仅访问单个列会比必须访问整个文件更高效。\n- **ORCFiles**：ORC\
  \ 代表 Optimized Row-Columnar。从某种意义上说，它是对纯列式格式（如 Parquet）的进一步优化层。ORCFiles 不仅按列存储数据，还按行存储，也称为条带。具有表格格式数据的<|message|>\
  \ 可以拆分为多个较小的条带，每个条带包含原始文件的行子集。通过以这种方式拆分数据，如果用户任务只需要访问数据的一小部分，进程可以查询保存数据的特定条带。\n\
  - **SequenceFiles**：在 SequenceFiles 中，数据表示为键值对并以二进制序列化格式存储。由于序列化，数据可以以紧凑的二进制格式表示，这不仅减少了数据大小，而且也提高了\
  \ I/O。Hadoop，尤其是 HDFS，在存在多个小文件（如音频文件）时效率不高。SequenceFiles 通过允许将多个小文件存储为单个单元或 SequenceFile\
  \ 来解决此问题。它们也非常适合可拆分的并行操作，并且总体上对 MapReduce 作业高效。\n- **HDFS Snapshots**：HDFS 快照允许用户以只读模式在给定时间点保留数据。用户可以在\
  \ HDFS 中创建快照——本质上是该时间点数据的副本——以便在需要时稍后检索。这确保了在文件损坏或影响数据可用性的任何其他故障发生时可以恢复数据。在这方面，它也可以被视为备份。快照位于创建它们的\
  \ .snapshot 目录中。\n\n- **Handling of node failures:** 大型 Hadoop 集群可能包含数万个节点。因此，在任何一天都可能出现服务器故障。为了使\
  \ NameNode 了解集群中所有节点的状态，DataNodes 会定期向 NameNode 发送心跳。如果 NameNode 检测到服务器已失败，即停止接收心跳，它会将服务器标记为失败，并将该服务器本地的所有数据复制到新实例。\n\
  \n## New features expected in Hadoop 3\n\n在撰写本书时，Hadoop 3 处于 Alpha 阶段。有关 Hadoop\
  \ 3 中新更改的详细信息可以在互联网上找到。例如，`http://hadoop.apache.org/docs/current/` 提供了有关架构新更改的最最新信息。\n\
  \n## The Hadoop ecosystem\n\n本章应标题为 Apache 生态系统。Hadoop 与本节中将讨论的所有其他项目一样，是一个 Apache\
  \ 项目。Apache 被宽松地用作 Apache 软件基金会支持的开源项目的简称。它最初源于 90 年代初 Apache HTTP 服务器的开发，今天是一个由志愿者组成的全球协作计划，他们参与向全球技术社区发布开源软件。\n\
  \nHadoop 起初是，也是 Apache 生态系统中的一个项目之一。由于其受欢迎程度，许多也是 Apache 的其他项目已直接或间接地与 Hadoop 关联，因为它们支持\
  \ Hadoop 环境中的关键功能。也就是说，必须牢记的是，这些项目在大多数情况下可以作为独立产品存在，而无需 Hadoop 环境。它是否能提供最佳功能是另一个话题。\n\
  \n在本节中，我们将介绍一些对 Hadoop 作为标准 IT 企业解决方案的增长和可用性产生很大影响的 Apache 项目，如下图所示：\n\n| Product\
  \ | Functionality |\n|---|---|\n| Apache Pig | Apache Pig，也称为 Pig Latin，是一种专门设计用于通过简洁语句表示\
  \ MapReduce 程序的语言，从而定义工作流。使用传统方法（如 Java）编码 MapReduce 程序可能相当复杂，而 Pig 提供了通过使用简单语义表达\
  \ MapReduce 工作流和复杂的 **Extract-Transform-Load (ETL)** 的简易抽象。Pig 程序通过 Grunt shell\
  \ 执行。 |\n| Apache HBase | Apache HBase 是建立在 HDFS 之上的分布式列式数据库。它以 Google 的 BigTable\
  \ 为模型，其中数据以列式格式表示。HBase 支持跨包含数十亿条记录的表的低延迟读写，并且非常适合需要直接随机访问数据的任务。更具体地说，HBase 以三个维度索引数据\
  \ - 行、列和时间戳。它还提供了一种表示具有任意数量列的数据的方法，因为列值可以在 HBase 表的单元格内表示为键值对。 |\n| Apache Hive\
  \ | Apache Hive 提供了一种类 SQL 方言来查询存储在 HDFS 中的数据。Hive 将数据存储为 HDFS 中以文件夹式结构存储的序列化二进制文件。类似于传统数据库管理系统中的表，Hive\
  \ 以表格格式在 HDFS 中存储数据，并根据用户选择的属性进行分区。分区因此是更高级别目录或表的子文件夹。桶的概念提供了第三层抽象，它引用 Hive 表分区中的文件。\
  \ |\n| Apache Sqoop | Sqoop 用于从传统数据库中提取数据到 HDFS。拥有数据存储在关系数据库管理系统中的大型企业因此可以使用 Sqoop\
  \ 将数据从其数据仓库传输到 Hadoop 实现。 |\n| Apache Flume | Flume 用于管理、聚合和分析大规模日志数据。 |\n| Apache\
  \ Kafka | Kafka 是一种基于发布/订阅的中间件系统，可用于实时分析和随后持久化（在 HDFS 中）流数据。 |\n\n\n\n\n\n|   |\
  \   |\n| --- | --- |\n| Apache Oozie | Oozie 是一个工作流管理系统，旨在调度 Hadoop 作业。它实现了一个被称为\
  \ **有向无环图 (DAG)** 的关键概念，该概念将在我们关于 Spark 的部分中讨论。 |\n| Apache Spark | Spark 是 Apache\
  \ 中最具影响力的项目之一，其设计目的是解决 HDFS-MapReduce 模型的一些不足。它最初是在 UC Berkeley 的一个相对较小的项目，迅速发展成为用于分析任务的\
  \ Hadoop 替代方案中最突出的选择之一。Spark 已在行业中得到广泛采用，并包含各种其他子项目，提供机器学习、流式分析等附加功能。 |\n\n## Hands-on\
  \ with CDH\n\n在本节中，我们将利用 CDH QuickStart VM 来完成本章中讨论的一些主题。练习不一定需要按时间顺序执行，也不依赖于其他练习的完成。\n\
  \n我们将在本节中完成以下练习：\n\n- WordCount using Hadoop MapReduce\n- Working with the HDFS\n\
  - Downloading and querying data with Apache Hive\n\n## WordCount using Hadoop MapReduce\n\
  \n在本练习中，我们将尝试统计有史以来最长的长篇小说之一中每个单词出现的次数。练习中，我们选择了 Georges 和/或 Madeleine de Scudéry\
  \ 在 1649-1653 年间撰写的书籍 *Artamène ou le Grand Cyrus*。根据 Wikipedia 上的相关列表（https://en.wikipedia.org/wiki/List_of_longest_novels），该书被认为是第二长的小说。该小说共有\
  \ 10 卷，13,905 页，接近两百万个单词。\n\n首先，我们需要在 VirtualBox 中启动 Cloudera Distribution of Hadoop\
  \ Quickstart VM 并双击 Cloudera Quickstart VM 实例：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_99_0.png)\n\
  \n启动需要一些时间，因为它会初始化所有 CDH 相关进程，例如 DataNode、NameNode 等：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_99_1.png)\n\
  \n进程启动后，它将启动一个默认的着陆页，其中包含与 Hadoop 相关的众多教程的引用。我们将在本节中在 Unix 终端中编写 MapReduce 代码。从顶部左侧菜单启动终端，如以下屏幕截图所示：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_100_0.png)\n\n现在，我们必须按照以下步骤操作：\n\n- 1.\
  \ 创建一个名为 `cyrus` 的目录。这里我们将存储包含书籍文本的所有文件。\n- 2. 运行 `getCyrusFiles.sh`，如步骤 4 所示。这将把书籍下载到\
  \ cyrus 目录。\n- 3. 运行 `processCyrusFiles.sh`，如图所示。该书包含各种 Unicode 和不可打印字符。此外，我们希望将所有单词更改为小写，以便忽略因大小写不同而导致的重复计数。\n\
  - 4. 这将生成一个名为 `cyrusprint.txt` 的文件。该文档包含书籍的全部文本。我们将在此文本文件上运行我们的 MapReduce 代码。\n\
  - 5. 准备 `mapper.py` 和 `reducer.py`。顾名思义，`mapper.py` 运行 MapReduce 过程的 map 部分。同样，`reducer.py`\
  \ 运行 MapReduce 过程的 reduce 部分。文件 `mapper.py` 将把文档拆分为单词并为文档中的每个单词分配一个值为一的值。文件 `reducer.py`\
  \ 将读取 `mapper.py` 的排序输出并汇总相同单词的出现次数（首先将单词的计数初始化为一，并为每个新出现的单词递增）。最终输出是一个包含文档中每个单词计数的<|message|>文件。\n\
  \n步骤如下：\n\n- 1. 创建 `getCyrusFiles.sh` - 此脚本将用于从网络检索数据：\n\n  ```\n  [cloudera@quickstart\
  \ ~]$ mkdir cyrus\n  [cloudera@quickstart ~]$ vi getCyrusFiles.sh\n  [cloudera@quickstart\
  \ ~]$ cat getCyrusFiles.sh\n  for i in `seq 10`\n  do\n  curl www.artamene.org/documents/cyrus$i.txt\
  \ -o cyrus$i.txt\n  done\n  ```\n\n- 2. 创建 `processCyrusFiles.sh` - 此脚本将用于连接和清理上一步下载的文件：\n\
  \n  ```\n  [cloudera@quickstart ~]$ vi processCyrusFiles.sh\n  [cloudera@quickstart\
  \ ~]$ cat processCyrusFiles.sh\n  cd ~/cyrus;\n  for i in `ls cyrus*.txt`; do cat\
  \ $i >> cyrusorig.txt; done\n  cat cyrusorig.txt | tr -dc '[:print:]' | tr A-Z a-z\
  \ > cyrusprint.txt\n  ```\n\n- 3. 将权限更改为 755 以使 `.sh` 文件在命令行提示符下可执行：\n\n  ```\n\
  \  [cloudera@quickstart ~]$ chmod 755 getCyrusFiles.sh\n  [cloudera@quickstart ~]$\
  \ chmod 755 processCyrusFiles.sh\n  ```\n\n- 4. 执行 `getCyrusFiles.sh`：\n\n  ```\n\
