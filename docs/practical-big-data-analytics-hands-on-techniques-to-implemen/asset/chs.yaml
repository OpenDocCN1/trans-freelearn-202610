- "## 用于大数据分析的 Spark\n\n随着 Hadoop 及相关技术在各自生态系统中的使用日益普及，Hadoop 操作模型的几个明显且突出的缺陷逐渐显现。尤其是对\
  \ MapReduce 范式的根深蒂固的依赖，以及与 MapReduce 相关的其他方面，使得只有深度投资于相关技术的大型企业才能真正有效地使用 Hadoop\
  \ 生态系统。\n\n在 2011 年加州大学伯克利分校电气工程与计算机科学系（EECS）年度研究研讨会上，Ian Stoica 教授在演讲中宣布了在该校组建一个新研究小组的愿景（https://amplab.cs.berkeley.edu/about/）。这一愿景为后来成为深刻改变大数据格局的关键团队奠定了基础。AMPLab\
  \ 于 2011 年 2 月启动，旨在通过整合算法、机器和人，提供一个可扩展且统一的解决方案，以满足未来需求，而无需进行重大的重新工程工作。\n\n从 AMPLab\
  \ 计划中发展出来的最著名、使用最广泛的项目是 Spark，它可以说是 Hadoop 生态系统的更优替代方案——或者更准确地说，是 Hadoop 生态系统的扩展。\n\
  \n在本章中，我们将探讨 Spark 的一些显著特性，并以一个关于如何使用 Spark 的真实教程作为结尾。我们将涵盖以下主题：\n\n- Spark 的出现\n\
  - Spark 中的理论概念\n- Spark 的核心组件\n- Spark 架构\n- Spark 解决方案\n- Spark 教程\n\n### Spark\
  \ 的出现\n\n当 Spark 于 2014 年首次发布时，Hadoop 自 2009 年以来已经在商业领域发展了数年。尽管 Hadoop 利用广泛可用的分布式计算方法，解决了高效分析\
  \ TB 级大型数据集的一大障碍，但它仍存在阻碍其更广泛接受的缺陷。\n\n### Hadoop 的局限性\n\nHadoop 的一些常见局限性如下：\n\n\
  - **I/O 受限操作**：由于依赖本地磁盘存储来保存和检索数据，Hadoop 中执行的任何操作都会产生 I/O 开销。对于涉及数百台服务器上数千个数据块的较大数据集，问题变得更加严重。公平地说，协调并发\
  \ I/O 操作（通过 HDFS）的能力构成了 Hadoop 世界中分布式计算的基础。然而，在不同的用例和数据集之间有效利用该能力并*调优* Hadoop 集群，需要巨大且可能不成比例的专门知识。因此，工作负载的\
  \ I/O 受限特性成为使用 Hadoop 处理超大数据集的一个阻碍因素。例如，需要数百次迭代操作的机器学习用例意味着系统每次迭代都会产生 I/O 开销。\n\
  - **MapReduce 编程（MR）模型**：如本书前面部分所述，Hadoop 中的所有操作都需要用 MapReduce 编程模型来表达问题——也就是说，用户必须以键值对的形式表达问题，其中每个键值对都可以独立计算。在\
  \ Hadoop 中，编写高效的 MapReduce 程序（主要使用 Java）并非易事，尤其是对于刚接触 Java 或 Hadoop（或两者）的人来说。\n\
  - **非 MR 用例**：由于对 MapReduce 的依赖，其他更常见和更简单的概念（如过滤、连接等）也必须用 MapReduce 程序来表达。因此，跨主键连接两个文件必须采用键值对方法。这意味着，无论是简单还是复杂的操作，如果没有大量的编程工作，都很难实现。\n\
  - **编程 API**：在整个 Hadoop 中使用 Java 作为核心编程语言意味着，要正确管理和使用 Hadoop，开发人员必须具备扎实的 Java 知识以及\
  \ JVM 调优、垃圾收集等相关主题的深入知识。这也意味着，使用 R、Python 和 Scala 等其他流行语言的开发人员，几乎没有办法用他们最熟悉的语言重用或至少实现他们的解决方案。\n\
  - 总的来说，尽管 Hadoop 领域引领了大数据革命，但它未能在大范围内普及大数据技术的使用。\n\nAMPLab 团队很早就意识到了这些缺陷，并着手创建 Spark\
  \ 来解决这些问题，并在此过程中希望开发出一种新的、更优的替代方案。\n\n### 克服 Hadoop 的局限性\n\n现在，我们将回顾上一节中讨论的一些局限性，并了解\
  \ Spark 如何解决这些问题，从而提供优于 Hadoop 生态系统的替代方案。\n\n一开始需要记住的一个关键区别是，Spark 运行并不需要 Hadoop。事实上，Spark\
  \ 访问数据的底层后端可以是 HBase、Hive、Cassandra 等技术，以及 HDFS。\n\n这意味着，希望利用独立 Spark 系统的组织可以在没有现成\
  \ Hadoop 基础设施的情况下，无需构建单独的 Hadoop 基础设施即可实现。\n\nSpark 的解决方案如下：\n\n- **I/O 受限操作**：与\
  \ Hadoop 不同，Spark 可以存储和访问*内存*中存储的数据，即 RAM——如前所述，这比从磁盘读取数据快 1000 倍以上。随着固态硬盘（SSD）的出现（如今企业系统的标配），这一差距已显著缩小。最新的\
  \ NVMe 驱动器每秒可提供高达 3-5 GB 的带宽。然而，RAM 的平均读取速度约为每秒 25-30 GB，仍然比读取更新的存储技术快 5-10 倍。因此，能够将数据存储在\
  \ RAM 中，可以使 Spark 操作的读取时间提升 5 倍或更多。这相对于所有操作都依赖磁盘读取的 Hadoop 操作模型来说是一个重大改进。特别是涉及迭代操作（如机器学习）的任务，可以从\
  \ Spark 在内存中存储和读取数据的能力中受益匪浅。\n- **MapReduce 编程（MR）模型**：虽然 MapReduce 是用户从 Hadoop\
  \ 平台获益的主要编程模型，但 Spark 没有同样的要求。这对于更复杂的用例尤其有用，例如涉及难以轻松*并行化*的计算的定量分析，如机器学习算法。通过将编程模型与平台解耦，Spark\
  \ 允许用户用各种语言编写和执行代码，而无需强制任何特定的编程模型作为先决条件。\n- **非 MR 用例**：Spark SQL、Spark Streaming\
  \ 以及 Spark 生态系统的其他组件提供了丰富的功能，使用户能够执行常见任务，如 SQL 连接、聚合以及相关的类数据库操作，而无需借助其他外部解决方案。Spark\
  \ SQL 查询通常针对存储在 Hive 中的数据执行（JSON 是另一种选择），该功能也可在 R 和 Python 等其他 Spark API 中使用。\n\
  - **编程 API**：Spark 中最常用的 API 是 Python、Scala 和 Java。对于 R 程序员，有一个名为 `SparkR` 的独立包，允许从\
  \ R 直接访问 Spark 数据。这是 Hadoop 和 Spark 之间的一个主要区别因素，通过提供这些语言的 API，Spark 可以立即被更广泛的开发人员社区使用。在数据科学和分析领域，Python\
  \ 和 R 是最主流的选择语言，因此，与 Hadoop 相比，任何 Python 或 R 程序员都可以通过更简单的学习曲线来利用 Spark。此外，Spark\
  \ 还包含一个用于即席分析的交互式 shell。\n\n### Spark 中的理论概念\n\n以下是 Spark 中的核心概念：\n\n- 弹性分布式数据集\n\
  - 有向无环图\n- SparkContext\n- Spark DataFrames\n- 动作与转换\n- Spark 部署选项\n\n\n\n\n## 弹性分布式数据集\n\
  \n弹性分布式数据集，通常称为RDD，是Spark中使用的主要数据结构。RDD本质上是以分布式方式存储在Spark集群中的记录集合。RDD是不可变的，也就是说，一旦创建就不能更改。存储在节点间的RDD可以并行访问，因此原生支持并行操作。\n\
  \n用户无需编写单独的代码即可获得并行化的好处，只需运行Spark平台原生的特定命令，即可获得数据行动（actions）和转换（transformations）的好处。由于RDD也可以存储在内存中，另一个好处是并行操作可以直接在内存中处理数据，而无需付出昂贵的I/O访问开销。\n\
  \n## 有向无环图\n\n在计算机科学和数学术语中，有向无环图表示由单向边（或线）连接的节点对（也称为顶点）。也就是说，给定节点A和节点B，边可以连接A →\
  \ B或B → A，但不能同时连接两者。换句话说，任意一对节点之间不存在循环关系。\n\nSpark利用DAG的概念构建内部工作流，描述Spark作业中不同处理阶段。从概念上讲，这类似于为获得特定输出所需的一系列步骤创建虚拟流程图。例如，如果所需输出涉及统计文档中的单词数，中间步骤map-shuffle-reduce可以表示为一系列导致最终结果的操作。通过维护这样的映射，Spark能够跟踪操作中涉及的依赖关系。更具体地说，RDD是节点，而转换（本节稍后讨论）是DAG的边。\n\
  \n## SparkContext\n\nSparkContext是所有Spark操作的入口点，也是应用程序连接到Spark集群资源的方式。它初始化Spark实例，之后可用于创建RDD、对RDD执行行动和转换、提取数据以及使用其他Spark功能。SparkContext还初始化进程的各种属性，如应用程序名称、核心数、内存使用参数和其他特征。总的来说，这些属性包含在SparkConf对象中，该对象作为参数传递给SparkContext。\n\
  \n另一方面，**行动（Actions）**会返回结果。也就是说，它们执行用户可能在相应RDD上指定的一系列转换（如果有），并产生输出。换句话说，行动触发DAG中步骤的执行。常见的行动包括：`reduce`、`collect`、`take`、`aggregate`、`foreach`等等。\n\
  \n> 请注意，RDD是不可变的。它们无法被更改；转换和行动总是会产生新的RDD，但绝不会修改现有的RDD。\n\n## Spark部署选项\n\nSpark可以以多种模式部署。最重要的模式包括：\n\
  \n- **独立模式（Standalone mode）：** 作为独立集群，不依赖任何外部集群管理器\n- **Amazon EC2：** 在Amazon Web\
  \ Services的EC2实例上运行，可从S3访问数据\n- **Apache YARN：** Hadoop资源管理器\n\n其他选项包括**Apache Mesos**和**Kubernetes**。\n\
  \n> 更多细节可参阅Spark文档网站，  \n> `https://spark.apache.org/docs/latest/index.html`。\n\n\
  ## Spark API\n\nSpark平台可通过Python、Scala、R和Java中的Spark API轻松访问。它们共同使在Spark中处理数据变得简单且广泛可及。在Spark项目初始阶段，它仅支持Scala/Java作为主要API。然而，由于Spark的首要目标之一是为不同的开发者提供简单接口，Scala\
  \ API之后又推出了Python和R API。\n\n在Python中，PySpark包已成为Python开发者社区编写Spark应用程序的广泛使用标准。在R中，用户通过SparkR包与Spark交互。这对于可能也对处理存储在Spark生态系统中的数据感兴趣的R开发者很有用。这两种语言在数据科学社区中都非常流行，因此，Python和R\
  \ API的引入为在Spark上进行面向分析用例的大数据分析民主化奠定了基础。\n\n## Spark核心组件\n\n以下是Spark中非常重要的组件：\n\n\
  - Spark Core\n- Spark SQL\n- Spark Streaming\n- GraphX\n- MLlib\n\n## Spark Core\n\
  \nSpark Core提供Spark中的基本功能，例如使用RDD、执行行动和转换，以及存储、高可用性等更多管理任务。\n\n## Spark SQL\n\n\
  Spark SQL使用户能够使用标准SQL命令查询存储在Apache Hive中的数据。这通过为开发者提供一种使用常见SQL术语通过Spark SQL接口与数据集交互的方式，增加了额外的可访问性。承载底层数据的平台不仅限于Apache\
  \ Hive，还可以包括JSON、Parquet等。\n\n## Spark Streaming\n\nSpark的流处理组件允许用户与流数据（如Web相关内容等）交互。它还包括高可用性等企业特性。Spark可以从各种中间件和数据流服务中读取数据，例如Apache\
  \ Kafka、Apache Flume，以及来自Amazon Web Services等供应商的基于云的解决方案。\n\n## GraphX\n\nSpark的GraphX组件支持基于图的操作，类似于支持专用数据结构的图数据库等技术。这些技术使得互连数据点（如社交网络）易于使用、访问和表示。除了分析之外，Spark\
  \ GraphX平台还支持图算法，这些算法对于需要大规模表示关系的业务用例非常有用。例如，信用卡公司使用与Spark的GraphX组件类似的基于图的数据库来构建推荐引擎，以检测具有相似特征的用户。这些特征可能包括购买习惯、位置、人口统计以及其他定性和定量因素。在这些情况下使用图系统，公司可以构建以节点表示个体、以边表示关系度量的网络，从而发现他们之间的共同特征。\n\
  \n## MLlib\n\nMLlib是Spark生态系统的旗舰组件之一。它提供了可扩展、高性能的接口，用于在Spark中执行资源密集型的机器学习任务。此外，MLlib可以原生连接到HDFS、HBase以及Spark支持的其他底层存储系统。由于这种多功能性，用户无需依赖预先存在的Hadoop环境即可开始使用MLlib内置的算法。MLlib支持的一些算法包括：\n\
  \n- **分类：** 逻辑回归\n- **回归：** 广义线性回归、生存回归等\n- 决策树、随机森林和梯度提升树\n- **推荐：** 交替最小二乘法\n\
  - **聚类：** K均值、高斯混合等\n- **主题建模：** 潜在狄利克雷分配\n- **Apriori：** 频繁项集、关联规则\n\nML工作流工具包括：\n\
  \n- **特征转换：** 标准化、归一化等\n- ML管道构建\n- 模型评估和超参数调优\n- **ML持久化：** 保存和加载模型及管道\n\n## Spark的架构\n\
  \nSpark由3个主要架构组件组成：\n\n- SparkSession / SparkContext\n- 集群管理器\n- 工作节点（托管执行器进程）\n\
  \n**SparkSession/SparkContext**，或更一般地称为Spark Driver，是所有Spark应用程序的入口点，如前所述。SparkContext将用于创建RDD并针对RDD执行操作。SparkDriver向工作节点发送指令以调度任务。\n\
  \n**集群管理器（Cluster manager）**在概念上类似于Hadoop中的资源管理器，实际上，支持的解决方案之一就是YARN。其他集群管理器包括Mesos。Spark也可以以独立模式运行，在这种情况下不需要YARN/Mesos。集群管理器协调工作节点之间的通信，管理节点（如启动、停止等），并执行其他管理任务。\n\
  \n**工作节点（Worker nodes）**是托管Spark应用程序的服务器。每个应用程序都有自己独特的**执行器进程（executor process）**，即执行实际行动和转换任务的进程。通过分配专用的执行器进程，Spark确保任何一个特定应用程序中的问题不会影响其他应用程序。工作节点由Executor、JVM以及Spark应用程序所需的Python/R/其他应用程序进程组成。请注意，在Hadoop的情况下，工作节点和数据节点是同一个：\n\
