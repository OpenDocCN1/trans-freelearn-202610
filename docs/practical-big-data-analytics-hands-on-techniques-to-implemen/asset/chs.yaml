  \n最早的硬盘驱动器的容量不到 4 MB，占据了大约两个中型冰箱的空间，成本超过 36,000 美元——与今天的硬盘驱动器相比贵了 3 亿倍。磁化表面很快成为二级存储的标准，迄今为止，其变体已在各种可移动设备中实现，例如\
  \ 90 年代末的软盘、CD 和 DVD。\n\n**固态硬盘（SSD）**，硬盘的继任者，最早由 IBM 于 20 世纪 50 年代中期发明。与硬盘不同，SSD\
  \ 磁盘使用非易失性内存存储数据，该内存使用带电硅基板存储数据。由于没有机械运动部件，SSD 中存储的数据的检索时间（寻道时间）比硬盘等设备快一个数量级。\n\n\
  ## 如果数据一直存在，为什么我们现在才谈论大数据\n\n到 2000 年代初，计算和技术（如存储）的快速进步使用户能够以前所未有的效率收集和存储数据。互联网进一步推动了这一发展势头，为全球范围内以无限容量交换信息提供了平台。技术以惊人的速度发展，并导致了由社交媒体、智能手机等连接设备以及宽带连接的可用性推动的重大范式转变，进而推动了用户参与，甚至在世界偏远地区也是如此。\n\
  \n总体而言，其中大部分数据由基于网络的来源生成，例如 Facebook 等社交网络和 YouTube 等视频分享网站。在大数据术语中，这也被称为 **非结构化**\
  \ 数据；即数据没有固定的格式，如电子表格，或可以轻松存储在传统数据库系统中的数据。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_28_0.png)\n\
  \n计算能力的同步进步意味着，尽管生成数据的速度非常快，但从计算上分析它仍然是可行的。机器学习中的算法曾经因数据量和算法复杂性而被认为难以处理，现在可以使用各种新范式（如集群或多节点处理）以更简单的方式进行分析，而这在过去需要专用机器。\n\
  \n- **软件：** 促进对硬件层中托管的数据集进行分析的软件资源，例如 Hadoop 和 NoSQL 系统，代表了大数据堆栈中的下一个级别。分析软件可以分为不同的子类别。分析软件的两个主要高层分类是促进以下功能的工具：\n\
  \  - **数据挖掘：** 提供对大型数据集进行聚合、跨数据集连接和数据透视表等设施的软件属于此类。标准 NoSQL 平台如 Cassandra、Redis\
  \ 等是用于大数据分析的高层数据挖掘工具。\n  - **统计分析：** 提供超出简单数据挖掘的分析能力的平台，例如运行从简单回归到高级神经网络（如 Google\
  \ TensorFlow 或 R）的算法，属于此类。\n\n- **数据管理：** 数据加密、治理、访问、合规以及对任何企业和生产环境管理并在某些方面降低运营复杂性都很重要的其他功能构成了下一个基本层。尽管它们不如硬件或软件那样有形，但数据管理工具提供了一个明确的框架，组织可以使用该框架履行其义务，例如安全和合规。\n\
  \n- **终端用户：** 分析软件的终端用户构成了大数据分析参与的最后方面。毕竟，数据平台的好坏取决于其能够被高效利用并解决业务特定用例的程度。这就是从业者的作用所在，他们利用分析平台来获取价值。数据科学家一词通常用来指实现底层大数据分析能力的人，而业务用户则受益于更快访问和传统系统中不可用的分析能力。\n\
  \n## 大数据的类型\n\n数据大致可分为结构化、非结构化和半结构化。虽然这些区别一直存在，但随着大数据的出现，对数据进行这些类别的分类变得更加突出。\n\n\
  \n\n\n\n## 结构化\n\n顾名思义，结构化数据指的是具有明确组织结构的数据集，例如 Microsoft Excel 或 CSV 文件。从纯数据库角度而言，这类数据可以通过模式（schema）来表示。例如，联合国发布的\
  \ 2017 年世界幸福指数排名中位列前五的*最幸福*国家所对应的下表，就是结构化数据的典型代表。\n\n我们可以清晰地定义各列的数据类型——排名、得分、人均GDP、社会支持、健康预期寿命、信任、慷慨度和\
  \ dystopia 是数值列，而国家则用字母表示，更具体地说，是**字符串**。\n\n请看下表以更清楚了解：\n\n| 排名 | 国家 | 得分 | 人均GDP\
  \ | 社会支持 | 健康预期寿命 | 慷慨度 | 信任 | Dystopia |\n|------|---------|-------|----------------|----------------|--------------------------|------------|-------|----------|\n\
  | 1 | 挪威 | 7.537 | 1.616 | 1.534 | 0.797 | 0.362 | 0.316 | 2.277 |\n| 2 | 丹麦 | 7.522\
  \ | 1.482 | 1.551 | 0.793 | 0.355 | 0.401 | 2.314 |\n| 3 | 冰岛 | 7.504 | 1.481 |\
  \ 1.611 | 0.834 | 0.476 | 0.154 | 2.323 |\n| 4 | 瑞士 | 7.494 | 1.565 | 1.517 | 0.858\
  \ | 0.291 | 0.367 | 2.277 |\n| 5 | 芬兰 | 7.469 | 1.444 | 1.54 | 0.809 | 0.245 | 0.383\
  \ | 2.43 |\n\n世界幸福报告，2017年 [来源：https://en.wikipedia.org/wiki/World_Happiness_Report#cite_note-4]\n\
  \n诸如 Teradata、Greenplum 等商业数据库，以及开源领域的 Redis、Cassandra 和 Hive，都是提供管理和查询结构化数据能力的技术示例。\n\
  \n## 非结构化\n\n非结构化数据是指任何没有预定义组织模式的数据集，不像上一节表格那样具有明确的组织结构。口头语言、音乐、视频，甚至书籍，*包括本书*，都会被视作**非结构化**。这绝不意味着内容没有组织。事实上，一本书有目录、章节、小节和索引——从这个意义上说，它遵循了确定的组织方式。\n\
  \n然而，将每个词和句子都表示为严格规则集的一部分是徒劳的。一个句子可以由单词、数字、标点符号等组成，并且不像电子表格那样有预定义的数据类型。若要成为*结构化*的，这本书的每个句子都需要具备一组精确的特征，这既不合理也不切实际。\n\
  \n来自社交媒体的数据，例如 Twitter 上的帖子、Facebook 上与好友的消息以及 Instagram 上的照片，都是非结构化数据的例子。\n\n非结构化数据可以以各种格式存储。它们可以是\
  \ Blob，而对于文本数据，则可以是存储在数据存储介质中的自由格式文本。对于文本数据，通常使用 Lucene/Solr、Elasticsearch 等技术来进行查询、索引和其他操作。\n\
  \n## 半结构化\n\n半结构化数据是指同时具备组织模式元素和任意性方面的数据。一个个人电话通讯录（如今越来越少见了！）包含姓名、地址、电话号码和备注等列，就可以视为半结构化数据集。用户可能不知道所有联系人的地址，因此一些条目可能只有电话号码，反之亦然。\n\
  \n同样，备注列可能包含额外的描述性信息（例如传真号码、与该联系人相关的亲属姓名等）。这是一个允许用户添加补充信息的任意字段。因此，姓名、地址和电话号码列可以看作结构化的，因为它们可以用表格格式呈现；而备注部分则被认为是非结构化的，因为它可能包含一组任意的描述性信息，无法在通讯录中的其他列中表示。\n\
  \n在计算领域，**半结构化**数据通常以 JSON 等格式表示，这些格式可以封装结构化和无模式或任意的关联，通常使用键值对。一个更常见的例子是电子邮件消息，它既有结构化部分（如发件人姓名、消息接收时间等），这些对所有电子邮件都是通用的；也有非结构化部分，由电子邮件的正文或内容表示。\n\
  \nMongoDB 和 CouchDB 等平台通常用于存储和查询半结构化数据集。\n\n## 大数据来源\n\n当今技术让我们能够以惊人的速度收集数据——无论是在数量还是种类方面。有许多数据来源，但在大数据背景下，主要来源如下：\n\
  \n- **社交网络：** 可以说，我们今天所知的所有大数据的主要来源是过去5-10年间迅速普及的社交网络。这基本上是非结构化数据，以数百万计的社交媒体帖子和通过全球用户在网上的互动按秒生成的其他数据为代表。全球互联网接入的增加对于社交网络中数据的增长来说是一种自我实现的行为。\n\
  \n- **媒体：** 很大程度上是社交网络发展的结果，媒体代表了每天发生的数百万（甚至数十亿）次的音频和视频上传。上传到 YouTube 的视频、SoundCloud\
  \ 上的音乐录音以及 Instagram 上发布的图片都是媒体的主要例子，其数量继续以不受约束的方式增长。\n\n- **数据仓库：** 公司长期以来一直投资于专门的数据存储设施，通常称为数据仓库（DW）。DW\
  \ 本质上是公司希望保留和编目以便于检索的历史数据集合，无论是用于内部使用还是监管目的。随着行业逐渐转向将数据存储在 Hadoop 和 NoSQL 等平台的实践，越来越多的公司正在将数据从他们原有的数据仓库迁移到一些更新的技术中。公司电子邮件、会计记录、数据库和内部文档是\
  \ DW 数据的一些例子，这些数据现在被转移到 Hadoop 或类似 Hadoop 的平台上，这些平台利用多个节点提供高可用性和容错能力。\n\n- **传感器：**\
  \ 大数据领域一个较新的现象是从传感器设备收集数据。虽然传感器一直存在，石油和天然气等行业几十年来一直在石油钻塔上使用钻井传感器进行测量，但可穿戴设备（也称为物联网）的出现，例如\
  \ Fitbit 和 Apple Watch，意味着现在每个人都可以以十年前几个石油钻塔所拥有的速率来流式传输数据。\n\n  可穿戴设备可以在任何给定时刻从一个个体收集数百个测量数据。虽然目前还不算真正的大数据问题，但随着行业的不断发展，传感器相关数据可能会变得更像通过社交网络活动在网上产生的自发数据。\n\
  \n## 大数据的 4V\n\n在大数据的背景下，4V 这个话题已经被过度使用，开始失去一些最初的魅力。尽管如此，记住这些 V 所代表的意义有助于了解背景语境，以便进行对话。\n\
  \n总的来说，4V 表示如下：\n\n- **Volume（数据量）：** 正在生成的数据量\n- **Variety（数据种类）：** 不同类型的数据，如文本、媒体、传感器或流式数据\n\
  - **Velocity（数据速度）：** 数据生成的速度，例如在任何给定时间通过社交网络交换的数百万条消息\n- **Veracity（数据真实性）：** 这是较新加入\
  \ 3V 的一个 V，表示数据中固有的噪声，例如记录信息中的不一致之处，需要额外的验证\n\n## 如何判断你是否面临大数据问题，以及从哪里开始寻找大数据解决方案？\n\
  \n最后，大数据分析指的是让数据发挥作用——换句话说，通过使用适当的技术从大量数据中提取有用信息的过程。许多用于表示不同类型分析的术语并没有确切定义，因为它们可以被不同地解释，因此含义可能是主观的。\n\
  \n\n\n\n尽管如此，这里还是提供了一些内容作为参考或起点，帮助你形成初步印象：\n\n- **数据挖掘：** 数据挖掘是指通过对数据集运行查询或基本汇总方法（如聚合）来提取信息的过程。从包含某在线网站一百万件商品所有销售记录的数据集中，找出销量排名前10的产品，这就是挖掘的过程：即从数据集中提取有用信息。Cassandra、Redis和MongoDB等NoSQL数据库就是具有强大数据挖掘能力的工具的典型代表。\n\
  - **商业智能：** 商业智能指的是Tableau、Spotfire、QlikView等提供前端仪表盘的工具，使用户能够通过图形界面查询数据。随着用户寻求提取信息，仪表盘产品的重要性也随着数据的增长而同步提升。易于使用、具备查询和可视化功能的界面，能够同时被技术用户和非技术用户普遍使用，这为数据分析访问的民主化奠定了基础。\n\
  - **可视化：** 数据可以通过易于理解的视觉化结果展示，既简洁又直观。可视化在更好地理解数据方面发挥了关键作用，尤其是在进行更深入分析之前分析数据集的性质及其分布时。JavaScript在沉寂了很长一段时间后重新崛起，其发展成果如D3.js和百度的ECharts，是开源领域可视化包的一些典型代表。大多数BI工具都包含高级可视化功能，因此，它已成为任何成功分析产品不可或缺的资产。\n\
  - **统计分析：** 统计分析是指允许最终用户对数据集执行统计操作的工具或平台。这些工具传统上已经存在多年，但随着大数据的出现，以及大量数据在执行高效统计操作方面带来的挑战，它们获得了越来越多的关注。R等语言和SAS等产品是计算统计领域中常见工具的主要例子。\n\
  - **机器学习：** 机器学习通常有多种名称，如预测分析、预测建模等，本质上是一个应用超越传统统计学范畴的高级算法的过程。这些算法不可避免地涉及运行数百或数千次迭代。此类算法不仅本质上复杂，而且计算量非常大。\n\
  \n技术的进步一直是机器学习在分析领域发展的关键驱动力，以至于它现在已成为整个行业普遍使用的术语。自动驾驶汽车、根据交通模式调整的地图交通数据，以及Siri和Cortana等数字助手等创新，都是机器学习在实体产品中商业化的例子。\n\
  \n## 总结\n\n大数据无疑是一个庞大的主题，乍一看可能显得过于复杂。熟能生巧，大数据的学习也是如此——你参与得越多，对相关主题和术语就越熟悉，对这个主题也就越得心应手。\n\
  \n深入研究大数据分析的各个维度，将帮助你建立起对这个主题的直觉感知。本书旨在对该主题进行全面概述，涵盖Hadoop、Spark、NoSQL数据库等广泛领域，以及基于硬件设计和云基础设施的主题。在下一章中，我们将介绍大数据挖掘的概念，并讨论大数据技术的技术要素以及选择标准。\n"
- "## 面向大众的大数据挖掘\n\n在企业环境中实现一个满足特定业务需求的大数据挖掘平台并非易事。虽然构建大数据平台相对简单，但这些工具的新颖性对习惯于传统数据挖掘方法的业务用户来说，在采用上构成了挑战。这最终决定了该平台在组织内部成功的程度。\n\
  \n本章介绍大数据分析的一些显著特征，这些特征对分析工具的实践者和最终用户都很重要。将包括以下主题：\n\n- 什么是大数据挖掘？\n- 企业中的大数据挖掘：\n\
  \  - 构建用例\n  - 解决方案的利益相关者\n  - 实施生命周期\n- 大数据挖掘中的关键技术：\n  - 选择硬件栈：\n    - 单节点/多节点架构\n\
  \    - 基于云的环境\n  - 选择软件栈：\n    - Hadoop、Spark和NoSQL\n    - 基于云的环境\n\n## 什么是大数据挖掘？\n\
  \n大数据挖掘是大数据分析两大类别中的第一类，另一类是预测分析，我们将在后续章节中介绍。简单来说，大数据挖掘指的是处理大规模数据集的整个生命周期，从采购到实施相应工具来分析这些数据集。\n\
  \n接下来的几章将阐述组织内开展的任何大数据项目的一些高层特征。\n\n## 企业中的大数据挖掘\n\n在中等规模到大型企业中实施大数据解决方案可能是一项艰巨的任务，因为需要考虑的因素极其多变且多样化，其中最重要的是确定该解决方案将解决哪些具体的业务目标。\n\
  \n## 为大数据战略构建理由\n\n也许大数据挖掘最重要的方面是确定平台将解决的适当用例和需求。任何大数据平台的成功在很大程度上取决于在业务部门中找到相关问题，这些问题将为部门或组织带来可衡量的价值。用于收集大量传感器或流数据的解决方案的硬件和软件栈，与用于分析大量内部数据的解决方案相比，会有实质性的不同。\n\
  \n以下是一些建议的步骤，根据我的经验，这些步骤在构建和实施企业大数据战略方面特别有效：\n\n- **谁需要大数据挖掘：** 确定哪些业务部门能从大数据挖掘解决方案中获益最多，是此过程的第一步。这通常涉及那些已经在处理大型数据集的部门，这些部门对业务很重要，并且直接影响收入；优化他们在数据访问或信息分析时间方面的流程，将对日常工作流程产生影响。例如，在制药组织中，这可能包括商业研究、流行病学、卫生经济学与结果研究。在金融服务组织中，这可能包括算法交易台、量化研究，甚至后台部门。\n\
  \n- **确定用例：** 在前一步骤中确定的部门可能已经有一个能够令人满意地满足该群体需求的平台。在多个用例和部门（或它们的集合）之间进行优先级排序，需要个人熟悉各业务部门正在进行的工作。\n\
  \n大多数组织遵循层级结构，同事之间的互动很可能主要沿着**等级界限**进行。确定有影响力的分析用例需要实践者和利益相关者之间的密切合作；也就是说，既需要负责监督部门的管理层，也需要进行实际分析的工作人员。业务利益相关者可以阐明其业务的哪些方面将从更高效的数据挖掘和分析环境中受益最多。实践者则提供对实际操作层面存在的挑战的洞察。将运营和管理方面结合起来以确定最佳结果的渐进式改进，必定会带来更快更好的结果。\n\
  \n- **利益相关者的支持：** 利益相关者的支持——换句话说，决策者和能够做出独立预算决策的人之间的共识——应该在开始处理用例之前建立。一般来说，应该争取多个支持以备冗余，这样就会有一个主要和次要来源池，可以为将任何早期胜利扩展到更广泛的目标提供适当的支持和资金。支持过程不一定是确定性的，在大多数情况下这可能无法实现。相反，就某个用例将带来的价值达成总体共识，有助于建立一个基准，在用例成功执行后可以加以利用。\n\
  \n- **早期成功与投入产出比：** 一旦确定了合适的用例，找到投入产出比最优的用例就至关重要。一个相对较小的用例，可以在较短的时间内以较小的预算实施，以优化特定的关键业务功能，这有助于展示早期成功，从而为所讨论的大数据解决方案增加可信度。我们无法精确量化这些无形的特性，但我们可以假设：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_41_0.png)\n\n\n在这种情况下，*努力*是实施用例所需的时间和投入。这包括诸如采购解决方案所需的硬件和/或软件需要多长时间、实施解决方案所需的资源或等价的*人时*，以及整体运营开销等方面。相对于实施可能涉及长期采购和组织风险分析的商业解决方案，开源工具可能具有更低的进入门槛。同样，一个跨部门、需要多个已经参与其他项目的资源投入时间的项目，其持续时间可能比由单个部门员工执行的项目更长。如果净努力足够低，只要不影响项目质量，还可以并行运行多个任务。\n\
  \n- **利用早期成功：** 在早期成功阶段，一个或多个项目的成功实施，往往为制定更宏大的大数据分析平台战略奠定基础，这一战略远不止满足单个部门的需求，而会产生更广泛的组织级影响。因此，早期成功是向受众确立大数据价值的第一步，但也是关键的一步，无论受众是否对其可行性和相关性持怀疑态度。\n\
  \n## 实施生命周期\n\n如前所述，实施过程可能涉及多个步骤。这些步骤通常具有迭代性，需要试错法。这需要相当的毅力和坚持，因为大多数工作都会以不同程度的成功和失败为特征。\n\
  \n在实践中，大数据战略将涉及多个利益相关者，协作方法往往能产生最佳结果。业务发起人、业务支持部门以及IT与分析部门是三大类利益相关者，它们共同构建一个恰当的统一解决方案，在预算和IT能力允许的范围内满足业务需求。\n\
  \n## 解决方案的利益相关者\n\n大数据解决方案利益相关者的具体性质是主观的，会因用例和问题领域而有所不同。一般来说，以下可视为高层级的表示：\n\n- **业务发起人：**\
  \ 为项目提供支持和/或资金的个人或部门。在大多数情况下，该实体也是解决方案的受益者。\n- **实施小组：** 从实际操作角度实施解决方案的团队。这通常是大多数公司的IT或分析部门，负责平台的设计和部署。\n\
  - **IT采购：** 大多数组织的采购部门负责审查解决方案，从组织角度评估其竞争性定价和可行性。符合内部IT政策以及评估许可成本等其他方面，是采购部门提供的一些服务，尤其是针对商业产品。\n\
  - **法律事务：** 所有产品，除非是内部开发的，几乎肯定都会附带相关使用条款和条件。开源产品可能具有多种属性，定义了使用的许可性和限制性。Apache 2.0、MIT\
  \ 和 BSD 等开源软件许可证通常比 GNU GPL（**通用目的许可证**）更为宽松。对于商业解决方案，过程更为复杂，因为需要分析供应商特定协议，并且根据许可条款和条件的性质，可能需要很长时间来评估和获得批准。\n\
  \n## 实施方案\n\n解决方案的最终实施是实施小组、业务受益者和辅助部门之间协作的结晶。如“早期成功”部分所述，大多数小型项目从开始到结束所需时间通常在3到6个月不等。较大的项目可能需要数月至数年才能完成，其特点是在实施和部署阶段采用敏捷产品管理框架，逐步增加功能。\n\
