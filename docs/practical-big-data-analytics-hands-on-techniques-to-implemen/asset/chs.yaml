  \n## Summary\n\n在本章中，我们学习了机器学习的基本基础，不同的类型如监督学习和无监督学习，以及数据预处理、数据插补、管理不平衡类别等主要概念。\n\
  \n我们还学习了今天被互换使用的术语之间的关键区别，特别是人工智能和机器学习这两个术语。我们了解到人工智能涉及广泛的主题，如博弈论、社会学、约束优化和机器学习；人工智能相对于机器学习而言范围更广。\n\
  \n机器学习促进了人工智能；也就是说，机器学习算法用于创建人工智能系统，但它们的范围不同。回归问题（给定一组点找到最佳拟合线）可以被视为机器学习算法，但它不太可能被视为人工智能算法（概念上，尽管技术上可以）。\n\
  \n在下一章中，我们将研究机器学习中的一些其他概念，如偏差、方差和正则化。我们还将阅读一些重要算法并学习如何使用 R 中的机器学习包应用它们。\n\n## 8\n\
  \n## Machine Learning Deep Dive\n\n上一章关于机器学习的介绍提供了该主题的初步概述，包括该领域的不同类别和核心概念。本章将更深入地探讨机器学习的理论方面，例如算法的局限性以及不同算法的工作原理。\n\
  \n**机器学习** 是一个庞大而复杂的主题，为此，本章侧重于不同主题的广度，而非深度。概念以高层次的方式介绍，读者可以参考其他资料以进一步理解这些主题。\n\n\
  我们将首先讨论机器学习中的几个基本理论，如梯度下降和 VC 维。接下来，我们将研究偏差和方差，这是任何建模过程中最重要的两个因素，以及偏差-方差权衡的概念。\n\
  \n我们随后将讨论各种机器学习算法、它们的优势和应用领域。\n\n我们将以利用真实世界数据集使用 R 执行机器学习操作的练习作为结尾。\n\n本章将涵盖以下主题：\n\
  \n- 偏差、方差和正则化特性\n- 梯度下降和 VC 维理论\n- 机器学习算法\n- 教程：使用 R 进行机器学习\n\n|  |  |\n|---|---|\n\
  |1757|275,921|\n|1630|274,713|\n|1236|201,428|\n|1002|193,128|\n|1118|187,073|\n\
  |1339|202,422|\n|1753|283,989|\n|1239|228,170|\n|1364|230,662|\n|995|169,369|\n\
  |1000|157,305|\n\n如果我们使用线性趋势线绘制最佳拟合线，图表看起来会是这样：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_279_0.png)\n\
  \nExcel 提供了一个有用的附加功能，允许用户绘制趋势线的延伸，这可以提供未知变量的估计，或 *预测*。在这种情况下，延伸趋势线将根据函数显示 1,800-2,000\
  \ 平方英尺范围内的房屋价格可能为多少。\n\n描述数据的线性函数如下：\n\n```\n$y=126.13x + 54,466.81$\n```\n\n以下带有延伸趋势线的图表显示价格很可能在\
  \ 275,000 美元到 300,000 美元之间：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_280_0.png)\n\
  \n然而，有人可能会认为该线并不是最佳近似，并且可能可以提高 R2 的值，在本例中为 0.87。一般来说，R^2 越高，描述数据的模型越好。R² 有各种不同的类型，但为本节目的，我们假设\
  \ R² 越高，模型越好。\n\n在下一节中，我们将绘制一条新的趋势线，其 R^2 明显更高，但使用多项式函数。该函数具有更高的 R^2（0.91 对比 0.87），并且在视觉上平均更接近点。\n\
  \n本例中的函数是 6 阶多项式：\n\n```\ny = -0.00x^6 + 0.00x^5 - 0.00x^4 + 2.50x^3 - 2,313.40x^2\
  \ + 1,125,401.77x - 224,923,813.17\n```\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_281_0.png)\n\
  \n但是，即使该线的 R^2 更高，如果我们延伸趋势线，试图找出 1,800-2,000 平方英尺范围内的房屋价格可能为多少，我们会得到以下结果。\n\n1,800-2,000\
  \ 平方英尺范围内的房屋价格从约 280,000 美元到 2,000 平方英尺时负的 200 万美元不等。换句话说，预计购买 1800 平方英尺房屋的人将花费\
  \ 280,000 美元，而根据此函数，具有“更高 R^2”的函数，预计购买 2,000 平方英尺房屋的人应获得 200 万美元！这当然不准确，但我们刚刚见证的就是所谓的过拟合。下面的图像说明了这一现象。\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_282_0.png)\n\n在另一端是欠拟合。当构建的模型不能描述数据时就会发生这种情况。在下面的图表中，函数\
  \ y = 0.25x - 200 就是一个这样的例子：\n\n\n\n\n\n假设我们要确定一堆水果是橙子还是苹果，并已得知它们在水果篮中的位置（左侧或右侧）、大小和重量：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_284_0.png)\n\n过拟合的一个例子可以是：基于训练数据集，对于篮子1，我们可以得出结论：只有位于篮子右侧的水果是橙子，而左侧的水果全是苹果。\n\
  \n欠拟合的一个例子可以是：我得出结论，篮子里只有橙子。\n\n**模型1：** 在第一种情况（过拟合）中，我实质上记住了位置。\n\n**模型2：** 在第二种情况（欠拟合）中，我什么都没能精确记住。\n\
  \n现在，给定第二个篮子——即测试数据集，其中苹果和橙子的位置发生了交换——如果我使用模型1，我会错误地得出所有右侧水果是橙子、左侧水果是苹果的结论（因为我记住了训练数据）。\n\
  \n如果我使用模型2，我同样会错误地得出所有水果都是橙子的结论。\n\n然而，有一些方法可以管理欠拟合和过拟合之间的平衡——换句话说，也就是高偏差和高方差之间的平衡。\n\
  \n用于偏差-方差权衡的常用方法之一称为**正则化**。这是指对模型进行惩罚（例如，回归中模型的系数）的过程，以便产生能够在各种数据点上良好泛化的输出。\n\n\
  下表说明了偏差和方差的一些关键概念，并展示了当模型具有高方差或高偏差时可供选择的补救措施：\n\n| 要解决的问题 | 问题 | 补救措施 |\n|---|---|---|\n\
  | **高方差**（*无法“泛化”*） | 信息不足 | 获取更多训练样本 |\n| | 考虑的特征（变量）太多 | 减少特征数量 |\n| | 惩罚过少 |\
  \ 增大正则化参数（lambda） |\n| **高偏差**（*我们过度泛化了*） | 没有足够特征来构建更完善的模型 | 增加更多特征 |\n| | 模型过于简单\
  \ | 添加更复杂的特征（例如，多项式特征） |\n| | 惩罚过多 | 减小正则化参数（lambda） |\n\n就建模过程而言，高偏差通常表现为训练集误差和测试集误差都持续偏高。对于高方差（过拟合），训练集误差迅速下降，但测试集误差保持不变。\n\
  \n## 梯度下降与VC维理论\n\n梯度下降和VC维是机器学习中两个基础理论。一般来说，**梯度下降**提供了一种结构化方法来寻找函数的最优系数。函数的假设空间可能很大，而借助梯度下降，算法会尝试找到代价函数（例如误差平方和）最低的最小值*（极小值）*。\n\
  \n**VC维**为系统中可以被分类的最大点数提供了一个上界。它本质上是对函数丰富程度的度量，并以结构化方式评估假设的极限。能够被函数或假设精确分类的点数被称为该假设的VC维。例如，线性边界可以精确分类2个或3个点，但无法分类4个点。因此，这个二维空间的VC维为3。\n\
  \nVC维与计算学习理论中的许多其他主题一样，既复杂又有趣。它是一个较少人知晓（和讨论）的主题，但对试图回答“学习的极限是什么”这类问题有着深远的影响。\n\n\
  ## 流行的机器学习算法\n\n机器学习算法有各种不同的类别。由于算法在概念层面上可能同时属于多个“类别”，因此很难明确指出某个算法只属于某一个类别。在本节中，我们将简要讨论一些最常用和广为人知的算法。\n\
  \n这些算法包括：\n\n- 回归模型\n- 关联规则\n- 决策树\n- 随机森林\n- 提升算法\n- 支持向量机\n- K均值\n- 神经网络\n\n请注意，在示例中，我们展示了使用整个数据集的R函数的基本用法。在实践中，我们会将数据划分为训练集和测试集，一旦构建出满意的模型，就将其应用于测试数据集以评估模型性能。\n\
  \n### 回归模型\n\n回归模型的范围从统计学中常用的线性、逻辑和多元回归算法，到岭回归和套索回归，后者通过惩罚系数来提高模型性能。\n\n在之前的示例中，我们看到了创建趋势线时线性回归的应用。多元线性回归指的是建模过程需要多个自变量。\n\
  \n例如：\n\n总广告费用 = x * 印刷广告，这属于简单线性回归；而\n\n总广告费用 = X + 印刷广告 + 电台广告 + 电视广告，由于存在多个自变量（印刷、电台和电视），这属于多元线性回归。\n\
  \n逻辑回归是另一种常用的统计回归建模技术，它预测离散类别值的结果，主要用于结果变量为二分（例如，0或1、是或否等）的情况。然而，也可能存在超过2个离散结果（例如，纽约州、新泽西州、康涅狄格州），这种类型的逻辑回归被称为多项逻辑回归。\n\
  \n**岭回归和套索回归**在线性回归的其他方面之外，还包含一个正则化项（λ）。岭回归中的正则化项会起到减小β系数（即“惩罚”系数）的作用。在套索中，正则化项倾向于将一些系数缩减为0，从而消除该变量对最终模型的影响：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_288_0.png)\n\n```\n# 加载 mlbench，并以 glucose（结果/因变量）为因变量，pressure、triceps\
  \ 和 insulin 为自变量，创建一个回归模型。\n\n> library(\"mlbench\")\n> lm_model <- lm(glucose ~\
  \ pressure + triceps + insulin,\n                 data=PimaIndiansDiabetes[1:100,])\n\
  > plot(lm_model)\n```\n\n### 关联规则\n\n关联规则挖掘，或称**apriori**，试图在数据集中的变量之间寻找关系。关联规则经常被用于各种实际应用场景。给定一组变量，apriori\
  \ 可以指示事务数据集中固有的模式。我们的一个教程将基于用 R Shiny 应用实现 apriori，因此本节对其进行了更多强调。\n\n例如，假设一家连锁超市决定商品上架的顺序。对包含销售事务的数据库运行\
  \ apriori 算法，可以识别出例如最常被一起购买的商品。这使超市能够确定哪些商品在彼此靠近地战略摆放时能够产生最多销量。这通常也被称为*购物篮分析*。\n\
  \n一个简单的例子如下所示：\n\n```\n# 在下面的关系中，LHS（左侧）导致 RHS（右侧）。\n\n# 例如，{牛奶，面包} --> {黄油} 表示购买牛奶和面包的人也很可能购买黄油。\n\
  \n{牛奶，面包} --> {黄油}\n{黄油，鸡蛋} --> {烤盘}\n{烤盘，黄油} --> {糖}\n...\n```\n\n在上述所有情况下，购买表达式左侧的商品往往导致了右侧商品的购买。\n\
  \n也可以从不一定包含*事务*的数据库中派生关联规则，而是使用滑动窗口沿着时间属性遍历事件，例如 WINEPI 算法。\n\n\n\n\n\nApriori 中有\
  \ 3 个主要度量。为了说明它们，让我们使用一个包含 4 笔交易中购买的商品的示例数据集：\n\n| 交易 | 商品 1 | 商品 2 | 商品 3 |\n|\
  \ --- | --- | --- | --- |\n| 1 | 牛奶 | 面包 | 黄油 |\n| 2 | 牛奶 | 鸡蛋 | 黄油 |\n| 3 | 面包\
  \ | 鸡蛋 | 奶酪 |\n| 4 | 黄油 | 面包 | 鸡蛋 |\n\n## 置信度\n\n置信度指的是当 Apriori 表达式的左侧成立时，右侧成立的频率。例如，给定一个表达式：\n\
  \n```\n{Milk} → {Bread}\n```\n\n我们想知道在购买了牛奶时，有多频繁也会购买面包。\n\n在这种情况下：\n\n- 交易 1：牛奶和面包都存在\n\
  - 交易 2：存在牛奶，但没有面包\n- 交易 3 和 4：不存在牛奶\n\n因此，根据我们看到的情况，牛奶出现的交易有 2 笔，其中面包在 1 笔交易中出现。因此，规则\
  \ {Milk} → {Bread} 的置信度为 1/2 = 50%。\n\n再看另一个表达式：\n\n```\n{Bread} → {Butter}\n```\n\
  \n我们想知道，当购买了面包时，有多频繁也会购买黄油？\n\n- 交易 1：面包和黄油都存在\n- 交易 2：没有面包（黄油存在，但我们的参考点是面包，因此不计入）\n\
  - 交易 3：面包存在但没有黄油\n- 交易 4：面包和黄油都存在\n\n因此，我们有 3 笔交易包含面包，其中 2 笔交易同时包含面包和黄油。因此，在这种情况下，规则\
  \ {Bread} → {Butter} 的置信度为 2/3 = 66.7%。\n\n## 支持度\n\n支持度指的是规则被满足的次数相对于数据集中交易总数的比例。\n\
  \n例如：\n\n{Milk} → {Bread} 在 4 笔交易中出现 1 次（在交易 1 中）。因此，该规则的支持度为 1/4 = 0.25（或 25%）。\n\
  \n{Bread} → {Butter} 在 4 笔交易中出现 2 次（在交易 1 和 4 中）。因此，该规则的支持度为 1/2 = 0.50（或 50%）。\n\
  \n## 提升度\n\n提升度 arguably 是 3 个度量中最重要的；它衡量规则的支持度相对于表达式两侧各自支持度的比例；换句话说，它衡量规则相对于 LHS\
  \ 和 RHS 表达式随机出现的强度。它正式定义为：\n\nLift = Support(Rule) / (Support(LHS) * Support(RHS))\n\
  \n提升值较低（例如，小于或等于 1）表明 LHS 和 RHS 的出现相互独立，而较高的提升度量表明共同出现具有显著性。\n\n在我们之前的示例中，\n\n{Bread}\
  \ → {Butter} 的提升度为：\n\nSupport({Bread} → {Butter}) / (Support({Bread}) * Support({Butter}))\n\
  \n= 0.50 / ((3/4) * (3/4)) = 0.50 / (0.75 * 0.75) = 0.89。\n\n这表明尽管该规则的置信度很高，但该规则本身相对于可能高于\
  \ 1 的其他规则而言并不显著。\n\n提升度高于 1 的规则示例为：\n\n{Item 1: Bread} → {Item 3: Cheese}\n\n其提升度为：\n\
  \nSupport({Item 1: Bread} → {Item 3: Cheese}) / (Support({Item 1: Bread}) * Support({Item\
  \ 3: Cheese}))\n\n= (1/4) / ((1/4) * (1/4)) = 4。\n\n## 决策树\n\n决策树是一种预测建模技术，它生成规则来基于先前结果的可能性推导出特定结果的可能性。一般来说，决策树通常类似于流程图构建，包含一系列表示父子关系的节点和叶节点。不链接到其他节点的节点称为叶节点。\n\
  \n决策树属于通常被称为 CART（分类与回归树）的一类算法。如果感兴趣的结果是分类变量，则属于分类练习，而如果结果是数值，则称为回归树。\n\n一个例子有助于使这一概念更清晰。请看图表：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_292_0.png)\n\n图表显示了一个假设场景：学校是否关闭/未关闭。矩形框（蓝色）代表节点。第一个矩形（学校关闭）代表\
  \ *根* 节点，而内部矩形代表 *内部节点*。带斜边的矩形框（绿色且斜体字母）代表 *叶节点*（或 *终端节点*）。\n\n决策树易于理解，并且是少数不是“黑箱”的算法之一。用于创建神经网络的算法通常被认为是黑箱，因为由于模型复杂，很难——如果不是不可能——直观地确定最终结果是如何得出的。\n\
  \n在 R 中，有多种用于创建决策树的设施。用于在 R 中创建它们的常用库是 `rpart`。我们将重新审视我们的 `PimaIndiansDiabetes`\
  \ 数据集，以了解如何使用该包创建决策树。\n\n我们希望创建一个模型来确定葡萄糖、胰岛素、（身体）体重指数和年龄与糖尿病的关系。请注意，在数据集中，糖尿病是一个分类变量，响应为是/否。\n\
  \n为了可视化决策树，我们将使用 `rpart.plot` 包。代码如下所示：\n\n```\ninstall.packages(\"rpart\")\ninstall.packages(\"\
  rpart.plot\")\n\nlibrary(rpart)\nlibrary(rpart.plot)\n\nrpart_model <- rpart(diabetes\
  \ ~ glucose + insulin + mass + age, data = PimaIndiansDiabetes)\n\n> rpart_model\n\
  n= 768\n\nnode), split, n, loss, yval, (yprob)\n    * denotes terminal node\n\n\
  \ 1) root 768 268 neg (0.6510417 0.3489583)\n   2) glucose< 127.5 485 94 neg (0.8061856\
  \ 0.1938144) *\n   3) glucose>=127.5 283 109 pos (0.385159 0.6148410)\n     6) mass<\
  \ 29.95 76 24 neg (0.6842105 0.3157895)\n       12) glucose< 145.5 41 6 neg (0.8536585\
  \ 0.1463415) *\n       13) glucose>=145.5 35 17 pos (0.4857143 0.5142857)\n    \
  \     26) insulin< 14.5 21 8 neg (0.6190476 0.3809524) *\n         27) insulin>=14.5\
  \ 14 4 pos (0.2857143 0.7142857) *\n     7) mass>=29.95 207 57 pos (0.2753623 0.7246377)\n\
  \       14) glucose< 157.5 115 45 pos (0.3913043 0.6086957)\n         28) age< 30.5\
  \ 50 23 neg (0.5400000 0.4600000)\n           56) insulin>=199 14 3 neg (0.7857143\
  \ 0.2142857) *\n           57) insulin< 199 36 16 pos (0.4444444 0.5555556)\n  \
  \           114) age>=27.5 10 3 neg (0.7000000 0.3000000) *\n             115) age<\
  \ 27.5 26 9 pos (0.3461538 0.6538462) *\n         29) age>=30.5 65 18 pos (0.2769231\
  \ 0.7230769) *\n       15) glucose>=157.5 92 12 pos (0.1304348 0.8695652) *\n```\n\
  \n```\n> rpart.plot(rpart_model, extra=102, nn=TRUE)\n```\n\n下图说明了模型 `rpart_model`\
  \ 所代表的决策树。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_294_0.png)\n\n从顶部读起，图表显示数据集中有\
  \ 500 例 diabetes=neg（总共 768 条记录）。\n\n在数据集中葡萄糖 < 128 的总记录数（768）中，有 485 条记录标记为负。模型正确预测了其中\
  \ 391 例为负（节点编号 2，底部左侧第一个）。\n\n对于葡萄糖读数 > 128 的记录，有 283 条记录标记为阳性（节点编号 3，位于最顶部/根节点正下方）。模型正确分类了其中\
  \ 174 例。\n\n另一个用于直观决策树且具有全面可视化信息的较新包是 FFTrees（快速简约决策树）。以下示例仅用于信息目的提供：\n\n```\ninstall.packages(\"\
  FFTrees\")\nlibrary(caret)\nlibrary(mlbench)\nlibrary(FFTrees)\nset.seed(123)\n\n\
  data(\"PimaIndiansDiabetes\")\ndiab <- PimaIndiansDiabetes\ndiab$diabetes <- 1 *\
  \ (diab$diabetes == \"pos\")\n\ntrain_ind <- createDataPartition(diab$diabetes,\
  \ p = 0.8, list = FALSE, times = 1)\n\ntraining_diab <- diab[train_ind, ]\ntest_diab\
  \ <- diab[-train_ind, ]\n\ndiabetes.fft <- FFTrees(diabetes ~ ., data = training_diab,\
  \ data.test = test_diab)\nplot(diabetes.fft)\n```\n\n下图说明了使用 FFTrees 包表示 `diabetes.fft`\
  \ 的决策树。\n\n\n\n\n\n## 数据\nN = 615\nFalse True\n398 217\n\n# p(False)\n65%\n\n# p(True)\n\
  35%\n\n# FFT #1 (of 8)\n\n# 判定为 False\n正确拒绝 ○   △ 漏报\n263 53\n\n# 判定为 True\n误报 ○\
  \   △ 命中\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_296_0.png)\n\n# 性能 (训练)\n\n\
  真实\nTrue False\n决策\nTrue 158 111\n命中 误报 Al\nFalse 59 287\n△ 漏报 ○ 正确拒绝\n\n# mcu pci\
  \ sens spec acc wacc\n1.7 81 73 72 72 72\nBL\n\n# ROC\n灵敏度 (HR)\n1 - 特异度 (FAR)\n\
  # FFT\n© CART\n① LR\n® RF\nS SVM\n\n决策树通过递归地对数据进行分割来工作，直到达到停止准则，例如达到某个深度，或案例数量低于指定值。每次分割都是基于会导致“更纯的子集”的变量。\n\
  \n原则上，我们可以从给定的变量集中生长出无限数量的树，这使得它成为一个特别困难且难以处理的难题。存在许多算法可提供高效的分割和创建决策树的方法。其中一种方法就是\
  \ Hunt 算法。\n\n有关该算法的更多详细信息，可在以下位置找到：\nhttps://www-users.cs.umn.edu/~kumar/dmbook/ch4.pdf.\n\
  \n## 随机森林扩展\n\n随机森林是我们在前面讨论的决策树模型的扩展。在实践中，决策树易于理解，易于解释，使用可用算法快速创建，并且总体上直观。然而，决策树对数据中的微小变化敏感，只能沿轴进行分割（线性分割），并且可能导致过拟合。为了减轻决策树的某些缺点，同时仍然获得其优雅性的好处，随机森林等算法会创建多个决策树并对随机特征进行采样，以利用这些特征并构建聚合模型。\n\
  \n随机森林的工作原理基于 **自助聚合** 或 **装袋**。自助法是一个统计术语，表示有放回的随机抽样。对一组记录进行自助抽样意味着随机抽取一定数量的记录，并且可能在样本中多次包含同一记录。此后，用户将在样本上衡量其感兴趣的指标，然后重复该过程。以这种方式，多次从随机样本计算的指标值的分布预计代表总体以及整个数据集的分布。\n\
  \n对一组 3 个数字进行装袋的示例，例如 (1,2,3,4)，将是：\n\n(1,2,3), (1,1,3), (1,3,3), (2,2,1)，以及其他。\n\
  \n自助聚合，或 *装袋*，意味着利用投票方法同时使用 *多个自助样本*，在每个单独的样本（n 条记录的集合）上构建模型，然后最终聚合结果。\n\n随机森林还实现了比简单装袋更进一步的操作。它还在每次分割时随机选择用于模型构建过程的变量。例如，如果我们使用\
  \ `PimaIndiansDiabetes` 数据集使用变量 pregnant、glucose、pressure、triceps、insulin、mass、pedigree、age\
  \ 和 diabetes 创建随机森林模型，在每个自助样本（n 条记录的抽取）中，我们将选择一个随机特征子集来构建模型——例如，glucose、pressure\
  \ 和 insulin；insulin、age 和 pedigree；triceps、mass 和 insulin；以及其他。\n\n在 R 中，常用的 RandomForest\
  \ 包以其名称命名，即 RandomForest。我们可以通过包本身或通过 caret 使用它。两种方法如下所示：\n\n+   1. 使用 RandomForest\
  \ 包使用随机森林：\n\n```\n> rf_model1 <- randomForest(diabetes ~ ., data=PimaIndiansDiabetes)\
  \ >\nrf_model1 Call: randomForest(formula = diabetes ~ ., data = PimaIndiansDiabetes)\n\
  Type of random forest: classification Number of trees: 500 No. of variables tried\
  \ at each split: 2 OOB estimate of error rate: 23.44% Confusion matrix: negposclass.error\
  \ neg430 70 0.1400000 pos 110 158 0.4104478\n```\n\n+   2. 使用 caret 通过 method=\"\
  rf\" 函数使用随机森林：\n\n```\n> library(caret)\n> library(doMC)\n\n# THE NEXT STEP IS VERY\
  \ CRITICAL - YOU DO 'NOT' NEED TO USE MULTICORE\n# NOTE THAT THIS WILL USE ALL THE\
  \ CORES ON THE MACHINE THAT YOU ARE\n# USING TO RUN THE EXERCISE\n\n# REMOVE THE\
  \ # MARK FROM THE FRONT OF registerDoMC BEFORE RUNNING\n# THE COMMAND\n\n># registerDoMC(cores\
  \ = 8) # CHANGE NUMBER OF CORES TO MATCH THE NUMBER OF CORES ON YOUR MACHINE\n\n\
  >rf_model<- train(diabetes ~ ., data=PimaIndiansDiabetes, method=\"rf\")\n>rf_model\n\
  Random Forest\n\n768 samples\n  8 predictor\n  2 classes: 'neg', 'pos'\n\nNo pre-processing\n\
  Resampling: Bootstrapped (25 reps)\nSummary of sample sizes: 768, 768, 768, 768,\
  \ 768, 768, ...\nResampling results across tuning parameters:\n```\n\n| mtry | Accuracy\
  \ | Kappa |\n|------|----------|-------|\n| 2 | 0.7555341 | 0.4451835 |\n| 5 | 0.7556464\
  \ | 0.4523084 |\n| 8 | 0.7500721 | 0.4404318 |\n\nAccuracy was used to select the\
  \ optimal model using the largest value.\n\n```\nThe final value used for the model\
  \ was mtry = 5.\n\n>getTrainPerf(rf_model)\n\nTrainAccuracy TrainKappa method\n\
  1 0.7583831 0.4524728 rf\n```\n\n也可以查看原始随机森林模型（未使用 caret）中每棵树的分割和其他相关信息。这可以使用 getTree\
  \ 函数完成，如下所示：\n\n```\n>getTree(rf_model1,1,labelVar = TRUE)\n      left daughter\
  \ right daughter split var split point status prediction\n1 2 3 mass 27.8500 1 <NA>\n\
  2 4 5 age 28.5000 1 <NA>\n3 6 7 glucose 155.0000 1 <NA>\n4 8 9 age 27.5000 1 <NA>\n\
  5 10 11 mass 9.6500 1 <NA>\n6 12 13 pregnant 7.5000 1 <NA>\n7 14 15 insulin 80.0000\
  \ 1 <NA>\n8 0 0 <NA> 0.0000 -1 neg\n9 16 17 pressure 68.0000 1 <NA>\n10 0 0 <NA>\
  \ 0.0000 -1 pos\n11 18 19 insulin 131.0000 1 <NA>\n12 20 21 insulin 87.5000 1 <NA>\n\
  \n[...]\n```\n\n## 提升算法\n\n提升是一种使用权重和一组弱学习器，例如决策树，以提高模型性能的技术。提升根据模型误分类为数据分配权重，并且未来的学习器（在提升机器学习过程中创建）会关注被误分类的示例。正确分类的示例将被重新分配新的权重，通常低于未正确分类的示例。权重可以基于成本函数，例如多数投票，使用数据子集。\n\
  \n在简单且非技术性的术语中，提升使用一系列弱学习器，每个学习器“学习”之前学习器的错误。\n\n与装袋相比，提升通常更受欢迎，因为它根据模型性能分配相对权重，而不是像装袋那样为所有数据点分配相等权重。这在概念上类似于加权平均值与没有加权标准的平均函数之间的差异。\n\
  \nR 中有多个提升算法的包，其中一些常用的如下：\n\n+   - Adaboost\n+   - GBM (Stochastic Gradient Boosting)\n\
  +   - XGBoost\n\n其中，XGBoost 是一个广受欢迎的机器学习包，已在 Kaggle 等竞争性机器学习平台上非常成功地使用。XGBoost 具有创建集成模型非常优雅且计算高效的方式。由于它既准确又极快，用户经常使用\
  \ XGBoost 进行计算密集型 ML 挑战。您可以在 http://www.kaggle.com 上了解有关 Kaggle 的更多信息。\n\n```\n\
  # Creating an XGBoost model in R\n\nlibrary(caret)\nlibrary(xgboost)\n\nset.seed(123)\n\
  train_ind<-\nsample(nrow(PimaIndiansDiabetes),as.integer(nrow(PimaIndiansDiabetes)*.80))\n\
  \ntraining_diab<- PimaIndiansDiabetes[train_ind,]\ntest_diab<- PimaIndiansDiabetes[-train_ind,]\n\
  \ndiab_train<- sparse.model.matrix(~.-1, data=training_diab[,-ncol(training_diab)])\n\
  diab_train_dmatrix<- xgb.DMatrix(data = diab_train,\nlabel=training_diab$diabetes==\"\
  pos\")\n\ndiab_test<- sparse.model.matrix(~.-1, data=test_diab[,-ncol(test_diab)])\n\
  diab_test_dmatrix<- xgb.DMatrix(data = diab_test,\nlabel=test_diab$diabetes==\"\
  pos\")\n\nparam_diab<- list(objective = \"binary:logistic\",\neval_metric = \"error\"\
  ,\n                booster = \"gbtree\",\nmax_depth = 5,\n```\n\n\n\n\n```\neta\
  \ = 0.1)\n\nxgb_model <- xgb.train(data = diab_train_dmatrix,\nparam_diab, nrounds\
  \ = 1000,\nwatchlist = list(train = diab_train_dmatrix, test = diab_test_dmatrix),\n\
  print_every_n = 10)\n\npredicted <- predict(xgb_model, diab_test_dmatrix)\npredicted\
  \ <- predicted > 0.5\n\nactual <- test_diab$diabetes == \"pos\"\nconfusionMatrix(actual,predicted)\n\
  ```\n\n## RESULT\n\n混淆矩阵和统计量\n\n| Prediction | FALSE | TRUE |\n|---|---:|---:|\n\
  | FALSE | 80 | 17 |\n| TRUE | 21 | 36 |\n\nAccuracy : 0.7532\n95% CI : (0.6774,\
  \ 0.8191)\nNo Information Rate : 0.6558\nP-Value [Acc > NIR] : 0.005956\n\nKappa\
  \ : 0.463\nMcnemar's Test P-Value : 0.626496\n\nSensitivity : 0.7921\nSpecificity\
  \ : 0.6792\nPosPredValue : 0.8247\nNegPredValue : 0.6316\nPrevalence : 0.6558\n\
  Detection Rate : 0.5195\nDetection Prevalence : 0.6299\nBalanced Accuracy : 0.7357\n\
  \n'Positive' Class : FALSE\n\n## Support vector machines\n\n支持向量机\n\n支持向量机，通常称为\
  \ **SVMs**，是另一类机器学习算法，用于使用称为 **hyperplane** 的概念将数据分类到一个或另一个类别，该概念用于在点之间划定线性边界。\n\
  \n例如，给定 x-y 轴上的黑白点集，我们可以找到多条线来将它们分开。在这种情况下，线代表了界定每个点所属类别的函数。在下面的图像中，线 H1 和 H2 都能准确地分离点。在这种情况下，我们如何确定\
  \ H1 和 H2 中哪一个是最佳线？：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_302_0.png)\n\n\
  直观地说，我们可以说离点最近的线——例如垂直线 H1——可能*不是*分离点的最佳线。由于线离点太近，并且对给定数据集上的点过于具体，如果新点稍微偏离线的右侧或左侧，就可能被错误分类。换句话说，该线对数据的微小变化过于敏感，而这些变化可能是由于随机/确定性噪声引起的，例如数据中的不完美。\n\
  \n另一方面，线 H2 在分离数据的同时保持了与离线最近的点最大可能的距离。数据中的轻微不完美不太可能影响点的分类程度，就像线 H1 可能发生的那样。这本质上描述了图像下所示的最大间隔分离原理。\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_303_0.png)\n\n靠近线的点，也称为超平面，被称为“支持向量”（因此得名）。在图像中，位于虚线上的点因此是支持向量。\n\
  \n然而，在现实世界中，并非所有点都可能是“线性可分”的。SVM 利用了称为“核技巧”的概念。本质上，可能无法线性分离的点可以投影或映射到更高维的表面。例如，给定\
  \ 2D x-y 空间中一组无法线性分离的点，如果我们将点投影到三维空间中，如下图所示，则可能将它们分开。红色着色的点无法通过 2D 线分离，但在映射到三维表面后，可以通过如下图所示的超平面分离：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_303_1.png)\n\nR 中有多个包可让用户利用 SVM，例如 kernlab、e1071、klaR\
  \ 等。在这里，我们说明了使用 e1071 包中的 SVM 的用法，如下所示：\n\n```\nlibrary(mlbench)\nlibrary(caret)\n\
  library(e1071)\nset.seed(123)\n\ndata(\"PimaIndiansDiabetes\")\ndiab<- PimaIndiansDiabetes\n\
  \ntrain_ind<- createDataPartition(diab$diabetes,p=0.8,list=FALSE,times=1)\n\ntraining_diab<-\
  \ diab[train_ind,]\ntest_diab<- diab[-train_ind,]\n\nsvm_model<- svm(diabetes ~\
  \ ., data=training_diab)\nplot(svm_model,training_diab, glucose ~ mass)\n\n# The\
  \ plot below illustrates the areas that are classified 'positive' and 'negative'\n\
  ```\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_304_0.png)\n\n```\n# Creating and\
  \ evaluating the Confusion Matrix for the SVM model\n\nsvm_predicted<- predict(svm_model,test_diab[,-ncol(test_diab)])\n\
  confusionMatrix(svm_predicted,test_diab$diabetes)\n```\n\n混淆矩阵和统计量\n\nReference\n\
  \n| Prediction | neg | pos |\n|---|---:|---:|\n| neg | 93 | 26 |\n| pos | 7 | 27\
  \ |\n\nAccuracy : 0.7843\n95% CI : (0.7106, 0.8466)\nNo Information Rate : 0.6536\n\
  P-Value [Acc > NIR] : 0.0003018\n\nKappa : 0.4799\nMcNemar's Test P-Value : 0.0017280\n\
  \nSensitivity : 0.9300\nSpecificity : 0.5094\nPosPredValue : 0.7815\nNegPredValue\
  \ : 0.7941\nPrevalence : 0.6536\nDetection Rate : 0.6078\nDetection Prevalence :\
  \ 0.7778\nBalanced Accuracy : 0.7197\n'Positive' Class : neg\n\n## The K-Means machine\
  \ learning technique\n\nK-Means 机器学习技术\n\nK-Means 是最受欢迎的无监督机器学习技术之一，用于创建聚类，从而对数据进行分类。\n\
  \n一个直观的例子可以如下提出：\n\n假设一所大学正在开设美国历史和亚洲历史的新课程。大学保持 15:1 的师生比例，因此每 15 名学生有 1 名教师。它进行了一项调查，其中包含每个学生对学习美国历史或亚洲历史的偏好所分配的\
  \ 10 分制数值评分。\n\n我们可以使用 R 内置的 K-Means 算法创建 2 个聚类，并且根据每个聚类中的点数，可能可以估计可能报名参加每门课程的学生人数。代码如下所示：\n\
  \n```\nlibrary(data.table)\nlibrary(ggplot2)\nlibrary()\n\nhistoryData<- fread(\"\
  ~/Desktop/history.csv\")\nggplot(historyData,aes(american_history,asian_history))\
  \ + geom_point() + geom_jitter()\n\nhistoryCluster<- kmeans(historyData,2) # Create\
  \ 2 clusters\nhistoryData[,cluster:=as.factor(historyCluster$cluster)]\nggplot(historyData,\
  \ aes(american_history,asian_history,color=cluster)) + geom_point() + geom_jitter()\n\
  \n# The image below shows the output of the ggplot command. Note that the effect\
  \ of geom_jitter can be seen in the image below (the points are nudged so that overlapping\
  \ points can be easily visible)\n```\n\n下面的图像可以直观地估计可能报名参加每门课程的学生人数（从而确定可能需要的教师人数）：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_306_0.png)\n\nK-Means 算法有几种变体，但标准且最常用的方法是\
  \ Lloyd 算法。算法步骤如下：\n\n- 1. 从数据集中随机选择 k 个点作为 k 个聚类的中点（即 *初始质心*）。\n- 2. 测量其他每个点到所选\
  \ k 个点（代表 k 个聚类）的距离，并将其分配给与该点距离最小的聚类。\n- 3. 聚类中心重新计算为聚类中点的平均值。\n- 4. 再次按步骤 2 计算质心与所有其他点之间的距离，并按步骤\
  \ 3 计算新的质心。以这种方式，重复步骤 2 和 3，直到没有新的数据被重新分配。\n\n存在多种用于聚类的 *距离和相似性度量*，例如 **Euclidean\
  \ Distance**（直线距离）、**Cosine Similarity**（向量之间角度的余弦）、**Hamming Distance**（通常用于分类变量）、**Mahalanobis\
  \ Distance**（以 P.C. Mahalanobis 命名；该度量点与分布均值之间的距离），等等。\n\n尽管最优聚类数并不总是可以明确识别，但有各种方法试图找到估计值。一般来说，聚类可以通过聚类内点的接近程度来衡量（聚类内方差，如平方和之和--WSS）和聚类之间的距离（因此聚类之间的距离越大，聚类就越容易区分）。确定最优数量的一种方法称为\
  \ **elbow method**。下图说明了该概念：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_307_0.png)\n\
  \n\n\n\n\n图表显示了 WSS（我们寻求最小化的簇内平方和）与聚类数量之间的关系图。如图所示，将聚类数量从 1 增加到 2 时，WSS 值大幅下降。WSS\
  \ 值迅速下降直到第 4 个或第 5 个聚类，之后再增加聚类数量并不会对 WSS 产生显著改善。通过视觉评估，机器学习从业者可以得出结论，基于该图像，可以创建的理想聚类数量在\
  \ 3-5 之间。\n\n> 请注意，较低的 WSS 分数不足以确定最佳聚类数量。必须通过检查指标的改善情况来确定。当每个点成为一个独立聚类时，WSS 最终会降至\
  \ 0。\n\n## 神经网络相关算法\n\n神经网络相关算法已经存在数十年之久。第一个计算模型由 Warren McCulloch 和 Walter Pitts\
  \ 于 1943 年在《数学生物物理学公报》上描述。\n\n> 你可以在 `https://pdfs.semanticscholar.org/5272/8a99829792c3272043842455f3a110e841b1.pdf`\
  \ 和 `https://en.wikipedia.org/wiki/Artificial_neural_network` 上了解更多关于这些概念的信息。\n\n\
  物理世界中各种人造物体，例如飞机，都从自然界中汲取灵感。神经网络本质上是对 *人类神经系统* 中神经元轴突和树突（也称为树突）之间数据交换现象的表示。就像数据在神经元之间传递以做出复杂决策一样，人工神经网络以类似的方式创建了一个神经元网络，该网络从其他神经元接收输入。\n\
  \n在高层次上，人工神经网络由 4 个主要组件组成：\n\n- Input Layer\n- Hidden Layer(s)\n- Output Layer\n\
  - Nodes and Weights\n\n这在以下图像中有所体现：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_309_0.png)\n\
  \n图中每个节点根据前一层的输入产生输出。输出是使用激活函数产生的。激活函数有各种类型，产生的输出取决于所使用的函数类型。示例包括二元阶跃（0 或 1）、tanh（介于\
  \ -1 和 +1 之间）、sigmoid 等。\n\n以下图表说明了该概念：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_309_1.png)\n\
  \n值 x1 和 x2 是输入，w1 和 w2 表示权重，节点表示输入及其权重被评估的点，并由激活函数产生特定输出。输出 f 因此可以表示为：\n\nf(∑ᵢ\
  \ (wᵢ * xᵢ) + b)\n\n这里，f 表示激活函数，b 表示偏置项。偏置项独立于权重和输入值，允许用户移动输出以实现更好的模型性能。\n\n具有多个隐藏层（通常为\
  \ 2 个或更多）的神经网络计算密集度高，近年来，具有多个隐藏层的神经网络，也称为深度神经网络或更一般地称为深度学习，已变得极为流行。\n\n行业中许多由机器学习和人工智能推动的发展，都是此类多层神经网络实施的直接结果。\n\
  \n在 R 中，nnet 包提供了神经网络的现成可用接口。虽然在实践中，神经网络通常需要复杂的硬件、GPU 卡等用于说明目的，我们已利用 nnet 包在 PimaIndiansDiabetes\
  \ 数据集上运行了之前的分类练习。在示例中，我们将利用 caret 来执行 nnet 模型：\n\n```\nlibrary(mlbench)\nlibrary(caret)\n\
  set.seed(123)\n\ndata(\"PimaIndiansDiabetes\")\ndiab<- PimaIndiansDiabetes\n\ntrain_ind<-\
  \ createDataPartition(diab$diabetes,p=0.8,list=FALSE,times=1)\n\ntraining_diab<-\
  \ diab[train_ind,]\ntest_diab<- diab[-train_ind,]\n\nnnet_grid<- expand.grid(.decay\
  \ = c(0.5,0.1), .size = c(3,5,7))\n\nnnet_model<- train(diabetes ~ ., data = training_diab,\
  \ method = \"nnet\",\nmetric = \"Accuracy\", maxit = 500, tuneGrid = nnet_grid)\n\
  \n# Generating predictions using the neural network model\nnnet_predicted <- predict(nnet_model,\
  \ test_diab)\n\n> plot (nnet_model)\n```\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_311_0.png)\n\
  \n```\n# Confusion Matrix for the Neural Network model\n\nconfusionMatrix(nnet_predicted,test_diab$diabetes)\n\
  ```\n\nConfusion Matrix and Statistics\n\nReference\nPrediction | neg | pos\n---|---|---\n\
  neg | 86 | 22\npos | 14 | 31\n\nAccuracy : 0.7647\n95% CI : (0.6894, 0.8294)\nNo\
  \ Information Rate : 0.6536\nP-Value [Acc> NIR] : 0.001988\n\nKappa : 0.4613\nMcNemar's\
  \ Test P-Value : 0.243345\n\nSensitivity : 0.8600\nSpecificity : 0.5849\nPosPredValue\
  \ : 0.7963\nNegPredValue : 0.6889\nPrevalence : 0.6536\nDetection Rate : 0.5621\n\
  \nDetection Prevalence : 0.7059\nBalanced Accuracy : 0.7225\n\n'Positive' Class\
  \ :neg\n\n## 教程 - 使用 CMS 数据进行关联规则挖掘\n\n本教程将实现一个用于访问使用 R 中 Apriori 包创建的规则的接口。\n\n\
  我们将从 CMS OpenPayments 网站下载数据。该网站托管了公司向医生和医院支付的款项数据：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_312_0.png)\n\
  \n### 下载数据\n\n数据集可以通过 Unix 终端（在虚拟机中）下载，也可以通过浏览器直接访问该网站进行下载。如果你在虚拟机中下载数据集，请在终端窗口中运行以下命令：\n\
  \n```\ntime wget -O cms2016_2.csv\n'https://openpaymentsdata.cms.gov/resource/vq63-hu5i.csv?$query=select\
  \ Physician_First_Name as firstName,Physician_Last_Name as lastName,Recipient_City\
  \ as city,Recipient_State as state,Submitting_Applicable_Manufacturer_or_Applicable_GPO_Name\
  \ as company,Total_Amount_of_Payment_USDollars as payment,Nature_of_Payment_or_Transfer_of_Value\
  \ as paymentNature,Product_Category_or_Therapeutic_Area_1 as category,Name_of_Drug_or_Biological_or_Device_or_Medical_Supply_1\
  \ as product where covered_recipient_type like \"Covered Recipient Physician\" and\
  \ Recipient_State like \"NY\" limit 1200000'\n```\n\n或者，如果你从浏览器下载数据，请在浏览器窗口中输入以下\
  \ URL 并按 Enter：\n\n```\nhttps://openpaymentsdata.cms.gov/resource/vq63-hu5i.csv?$query=select\
  \ Physician_First_Name as firstName,Physician_Last_Name as lastName,Recipient_City\
  \ as city,Recipient_State as state,Submitting_Applicable_Manufacturer_or_Applicable_GPO_Name\
  \ as company,Total_Amount_of_Payment_USDollars as payment,Nature_of_Payment_or_Transfer_of_Value\
  \ as paymentNature,Product_Category_or_Therapeutic_Area_1 as category,Name_of_Drug_or_Biological_or_Device_or_Medical_Supply_1\
  \ as product where covered_recipient_type like \"Covered Recipient Physician\" and\
  \ Recipient_State like \"NY\"\n```\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_313_0.png)\n\
  \n如以下图像所示：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_314_0.png)\n\n### 为 Apriori\
  \ 编写 R 代码\n\nApriori 算法，如前所述，允许用户找到数据集中固有的关系或模式。为此，我们将在 R/RStudio 中使用 arules 包。代码将读取下载的数据集（示例中称为\
  \ cms2016_2.csv）并运行 apriori 算法以找到关联规则。\n\n在 RStudio 中创建一个新的 R 文件并输入以下代码。确保将下载的 csv\
  \ 文件的位置更改为文件已存储的适当目录：\n\n```\nlibrary(data.table)\nlibrary(arules)\n\ncms<- fread(\"\
  ~/cms2016_2.csv\") # CHANGE THIS TO YOUR LOCATION OF THE DATA\n\ncols <- \nc(\"\
  category\",\"city\",\"company\",\"firstName\",\"lastName\",\"paymentNature\",\"\
  product\")\n\ncms[ , (cols) := lapply(.SD, toupper), .SDcols = cols]\n\ncms[,payment:=as.numeric(payment)]\n\
  \nquantile_values<- quantile(cms$payment,seq(0,1,.25))\ninterval_values<-\n```\n\
  \n\n\n\n```\nfindInterval(cms$payment, quantile_values, rightmost.closed=TRUE)\n\
  \ncms[, quantileVal:=factor(interval_values,\nlabels=c(\"0-25\", \"25-50\", \"50-75\"\
  , \"75-100\"))]\n\nrules_cols<-\nc(\"category\", \"city\", \"company\", \"paymentNature\"\
  , \"product\", \"quantileVal\")\n\ncms[, (rules_cols) := lapply(.SD, factor), .SDcols\
  \ = rules_cols]\n\ncms_factor<-\ncms[, .(category, city, company, paymentNature,\
  \ product, quantileVal)]\n\nrhsVal<- paste0(\"quantileVal\", \"=\", c(\"0-25\",\
  \ \"25-50\", \"50-75\", \"75-100\"))\n\ncms_rules<-\napriori(cms_factor, parameter=list(supp=0.001,\
  \ conf=0.25, target=\"rules\", minlen=3))\n\ncms_rules_dt<- data.table(as(cms_rules,\
  \ \"data.frame\"))\ncms_rules_dt[, c(\"LHS\", \"RHS\") := tstrsplit(rules, \"=>\"\
  , fixed=TRUE)]\nnum_cols<- c(\"support\", \"confidence\", \"lift\")\ncms_rules_dt[,\
  \ (num_cols) := lapply(.SD, function(x){round(x,2)}), .SDcols = num_cols]\n\nsaveRDS(cms_rules_dt,\
  \ \"cms_rules_dt.rds\")\nsaveRDS(cms_factor, \"cms_factor_dt.rds\")\n```\n\n## Shiny\
  \ (R Code)\n\n在 RStudio 中，选择 File | New File | Shiny Web App：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_315_0.png)\n\
  \n```\nfluidRow(\n  dataTableOutput(\"result\")\n)\n),\n  title = \"Aprior Algorithm\"\
  \n)\n\n# Define server logic required to draw a histogram\nserver <- function(input,\
  \ output, session) {\n\n  PLACEHOLDERLIST2 <- list(\n    placeholder = 'Select All',\n\
  \    onInitialize = I('function() { this.setValue(\"\"); }')\n  )\n\n  output$company<-\
  \ renderUI({\n    datasetList<- c(\"Select\nAll\",as.character(unique(sort(cms_factor_dt$company))))\n\
  \    selectizeInput(\"company\", \"Select Company\",\n    datasetList, multiple\
  \ = FALSE,options = PLACEHOLDERLIST2,selected=\"Select\nAll\")\n  })\n\n  output$searchlhs<-\
  \ renderUI({\n    textInput(\"searchlhs\", \"Search LHS\", placeholder = \"Search\"\
  )\n  })\n\n  output$searchrhs<- renderUI({\n    textInput(\"searchrhs\", \"Search\
  \ RHS\", placeholder = \"Search\")\n  })\n\n  output$support2 <- renderUI({\n  \
  \  sliderInput(\"support2\", label =\n    'Support',min=0,max=0.04,value=0.01,step=0.005)\n\
  \  })\n\n  output$confidence<- renderUI({\n    sliderInput(\"confidence\", label\
  \ = 'Confidence',min=0,max=1,value=0.5)\n  })\n\n  output$lift<- renderUI({\n  \
  \  sliderInput(\"lift\", label = 'Lift',min=0,max=10,value=0.8)\n  })\n\n  dataInput<-\
  \ reactive({\n    print(input$support2)\n    print(input$company)\n    print(identical(input$company,\"\
  \"))\n  })\n```\n\n```\ntemp <- cms_rules_dt[support > input$support2 & confidence\
  \ >input$confidence& lift >input$lift]\n\nif(!identical(input$searchlhs,\"\")){\n\
  searchTerm<- paste0(\"*\",input$searchlhs,\"*\")\n    temp <- temp[LHS %like% searchTerm]\n\
  }\n\nif(!identical(input$searchrhs,\"\")){\nsearchTerm<- paste0(\"*\",input$searchrhs,\"\
  *\")\n    temp <- temp[RHS %like% searchTerm]\n}\n\nif(!identical(input$company,\"\
  Select All\")){\n    # print(\"HERE\")\n    temp <- temp[grepl(input$company,rules)]\n\
  }\n    temp[, .(LHS,RHS,support,confidence,lift)]\n})\n\noutput$downloadMatchingRules<-\
  \ downloadHandler(\n    filename = \"Rules.csv\",\n    content = function(file)\
  \ {\n        write.csv(dataInput(), file, row.names=FALSE)\n    }\n)\n\noutput$result<-\
  \ renderDataTable({\n    z = dataInput()\n    if (nrow(z) == 0) {\n        z <-\
  \ data.table(\"LHS\" = '', \"RHS\"='', \"Support\"='', \"Confidence\"='', \"Lift\"\
  \ = '')\n    }\n    setnames(z, c(\"LHS\", \"RHS\", \"Support\", \"Confidence\"\
  , \"Lift\"))\n    datatable(z,options = list(scrollX = TRUE))\n})\n\n} shinyApp(ui\
  \ = ui, server = server)\n```\n\n以下图像显示代码被复制并保存到名为 `app.R` 的文件中。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_319_0.png)\n\
  \n## Using custom CSS and fonts for the application\n\n对于我们的应用程序，我们将使用自定义 CSS 文件。我们还将使用自定义字体以便为应用程序提供美观的外观和感觉。\n\
  \n您可以从本书的软件仓库下载自定义 CSS 文件。\n\nCSS、字体和其他相关文件应存储在名为 `www` 的文件夹中，该文件夹位于您创建 R Shiny\
  \ 应用程序的目录中：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_320_0.png)\n\n## Running\
  \ the application\n\n如果一切顺利，您现在应该能够通过点击页面顶部的 **Run App** 选项来运行应用程序，如以下图像所示：\n\n\
  ![](img/8ededb1e0b69e85687f6e488d1044b79_320_1.png)\n\n点击“Run”按钮后，用户将看到与下面所示类似的弹出窗口。请注意，必须在浏览器中启用弹出窗口才能使其正常运行。\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_321_0.png)\n\n该应用程序具有多个控件，例如：\n\n- **Search\
  \ LHS/RHS**: 在规则的左侧或右侧输入您想要过滤的任何测试。\n- **Support**: 表示该规则在数据集中的普遍程度。\n- **Confidence**:\
  \ 在规则中，有多少是完全匹配。\n- **Lift**: 定义规则重要性的变量。大于 1 的数字被认为是有意义的。\n\n只要它们以与 R 脚本部分之前概述的方式类似的方式处理，您就可以将此应用程序用于任何其他规则文件。\n\
  \n## Summary\n\n机器学习从业者通常认为创建模型很容易，但创建好的模型则困难得多。事实上，不仅创建好的模型很重要，而且更重要的是，知道如何识别好的模型是区分成功与不太成功的机器学习工作的关键。\n\
  \n在本章中，我们阅读了一些机器学习中更深层次的理论概念。偏差、方差、正则化以及其他常见概念都用示例进行了解释。借助配套的 R 代码，我们还了解了一些常见的机器学习算法，如随机森林、支持向量机等。我们以关于如何为\
  \ CMS OpenPayments 数据创建用于关联规则挖掘的基于网络的完整应用程序的教程作为结尾。\n\n在下一章中，我们将阅读企业中用于大数据和机器学习的某些技术。我们还将讨论云计算的优点以及它们如何影响企业软件和硬件堆栈的选择。\n\
  \n我们将在本章中涵盖以下主题：\n\n- Enterprise data science overview\n- Enterprise data mining\n\
  - Enterprise AI and machine learning\n- Enterprise infrastructure\n- Other considerations,\
  \ such as data strategy, governance, and tool selection\n- Amazon Web Services tutorial\n\
  \n## Enterprise data science overview\n\n数据科学在企业 IT 和分析方面是一个相对较新的主题。传统上，研究人员和分析师大致属于以下两类：\n\
  \n- 使用复杂计算语言和/或硬件进行专业任务的高技术研究人员\n- 可以使用 Excel 和 BI 平台等工具来执行简单和复杂数据分析的分析师\n\n组织开始在\
  \ 2000 年代后期关注 **Big Data** 以及更广泛的数据科学平台。到 2013 年，它获得了巨大的势头，当时 Hadoop 和 NoSQL 平台等解决方案发布。以下表格显示了数据科学的发展：\n\
  \n| Year | Developments |\n|---|---|\n| 1970s to late 1990s | 关系数据库管理系统得到广泛使用。实体关系模型、结构化查询语言\
  \ SQL 以及其他发展最终导致数据库在 90 年代末迅速扩张。 |\n| Early 2000s | 令人失望却昂贵的 Y2K 非事件，加上 dot-com\
  \ 泡沫的破裂，导致了停滞期。就数据库或更广泛的数据挖掘平台而言，这意味着公司更关注保持业务运行，而不是关注新创新。 |\n\n| 2005-2010 | 行业缓慢复苏，但直到\
  \ 2005 年才开始出现新的发展。一些值得注意的事件包括：\n- 2006: Google BigTable 论文发表\n- 2006: Amazon Web\
  \ Services 云平台推出\n- 2007: Amazon Dynamo 论文发表\n- 2008: Facebook 将 Cassandra 开源\n\
  - 2009: MongoDB 发布\n- 2009: Redis 发布 |\n| 2010-2012 | 2010: NoSQL 大会和相关活动开始流行，NoSQL\
  \ 成为一个被广泛接受的技术术语。与此同时，Hadoop 变得非常流行，几乎所有主要公司都开始实施 Hadoop 相关技术。\n2011: 市场领导者开始采用大数据并形成大数据战略。众多文章和研究论文声称大数据具有巨大的潜力，使其变得非常流行。麦肯锡发布了一篇关于大数据的论文，称其为创新、竞争和生产力的下一个前沿。2012\
  \ 年 10 月的《哈佛商业评论》对数据科学家的前景持非常积极的态度，并立即变得流行。 |\n| 2013-2015 | 大数据技术的发展导致了数据科学概念的发展，该概念将重点从仅仅数据转移到数据的价值。结合机器学习的发展以及\
  \ R、Python 等数据科学导向平台的流行，行业将注意力转向从数据中获取洞察，而不是仅仅管理数据。机器学习是新的流行语。 |\n| 2016- | 智能设备、可穿戴设备、AI\
  \ 启用手机、自动驾驶汽车等创新解决方案的演变为大数据和机器学习趋势增加了人工智能的新组件。制造商开始广泛宣传技术解决方案的智能能力，而不仅仅是机器学习能力。\
  \ |\n\n实施大数据平台或更广泛的大数据计划的责任通常委托给公司的 IT 或分析部门，如果存在此类部门的话。\n\n\n\n\n\n大多数组织还报告称拥有\
  \ **Advanced Analytics** 的企业授权。这有助于确保所需的预算，以在组织内部实施并推进分析的状态。\n\n此外，数据科学收入潜力的预测性预测极大地帮助向高级管理层证明，对大数据进行适当投资对公司的未来增长至关重要。\n\
  \n随着当前的大数据和商业分析收入呈指数级增长，超过 1500 亿美元，企业实施此类能力（至少在初步层面）的压力巨大。\n\n组织对大数据作为企业授权的认知和接受度的另一个方面是此类工具效用的文化认知。在针对大型公司\
  \ C 级管理层的调查中，大多数受访者表示，各部门的管理人员正在使用分析，但各部门的参与程度并不统一，如下图所示：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_327_0.png)\n\
  \n此外，似乎整个组织的大数据合作伙伴关系策略也未得到充分构建，无法实现商业成功。调查受访者表示，合作伙伴关系，即分析计划的跨职能协作，定义较为宽松：\n\n\
  ![](img/8ededb1e0b69e85687f6e488d1044b79_328_0.png)\n\n虽然对某些问题的回答存在偏差，其中一个类别占压倒性多数，但关于大数据和总体分析的组织挑战的反馈却获得了广泛一致的共识。下图显示了调查中每位参与者对分析挑战的反馈：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_328_1.png)\n\n所有这些都导致了企业中一个有趣但矛盾的分析困境。虽然大数据的价值和可分析性被广泛理解和接受，但关于适当方法仍存在模糊感，如下图所示：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_329_0.png)\n\n## 企业分析成功的路线图\n\n根据我们的经验，分析是一个相对较新的术语，与数据仓库等已建立的术语相比，需要谨慎的方法，以确保即时成功和后续举措的持久性。\n\
  \n过早尝试以大规模、高预算的方式完成初始分析项目的项目，如果项目未按预期进行，则有危及整个举措的风险。\n\n此外，在此类项目中，结果衡量标准未明确定义。换句话说，衡量结果价值是模糊的。有时甚至无法量化。这是因为分析举措的成功带来的好处不仅仅是直接的货币或技术能力。成功的分析项目通常有助于培养高管对部门开展此类项目能力的信心，这反过来可能导致更大的项目。\n\
  \n与大数据分析相关的一般挑战如下：\n\n- 几乎每家公司都在投资大数据、机器学习和人工智能\n- 通常，公司拥有企业授权\n- 找到合适的用例可能具有挑战性\n\
  - 即使你*找到*了它们，结果也可能不确定（是否会产生共鸣，需要多长时间等等）\n- 即使你*实现了*它们，是否已识别出最佳目标也可能难以捉摸（例如，使用 HDFS\
  \ 仅用于存储数据时）\n\n现在，让我们来看一些数据科学和分析举措的 **general guidelines**：\n\n- **与组织内的业务合作伙伴进行会议和一对一评审**，以审查其工作流程并获取反馈，了解分析\
  \ 和/或数据挖掘 在何处能提供最大价值\n- **确定业务运营的具体方面**，这些方面很重要且与公司的 *revenue stream* 相关；用例完成后将产生可衡量的影响\n\
  - 用例不必*复杂*；可以是简单的任务，例如 ML 或数据挖掘\n- 直观、易于理解，你可以向朋友和家人解释\n- 理想情况下，使用传统方式完成该用例今天需要付出努力。该解决方案不仅应使\
  \ **range of users**受益，而且应具有 **executive visibility**\n- 识别 **Low Difficulty - High\
  \ Value (Short)** 与 **High Difficulty - High Value (Long)** 用例\n- 教育业务赞助商，分享想法，表现出\
  \ **enthusiasm**（就像一次漫长的求职面试）\n- 为 **Low Difficulty - High Value** 取得 **early wins**，创建\
  \ **Minimum Viable Solutions**，并在进一步增强所开发的解决方案之前获得管理层的认可。（需要时间）\n\n早期胜利充当 **catalyst**，a)\
  \ 培养高管信心，b) 也更容易证明预算合理，这使得转向高难度-高价值任务变得更容易。\n\n最后两点很重要，因为识别低难度-高价值项目至关重要。这可能是一项对经验丰富的从业者来说似乎\
  \ *basic* 的任务，但对最终用户来说非常有价值。\n\n一家大型企业组织分析团队的高管曾评论说，当年最成功的项目是 *电子邮件报告发送时间的更改*。报告不再在早上发送，而是改为下午晚些时候发送。看起来报告的参与度在时间更改后变得更加活跃。早上的日程往往非常繁忙，而下午的报告则为收件人提供了在更轻松的节奏下审阅报告的时间。\n\
  \n一些 *低难度* 但 *潜在高价值* 项目的例子可能包括：\n\n- 自动化业务部门频繁进行的手动任务；例如，使用 Excel 创建的报告可能通过开源工具和数据库的组合轻松自动化。\n\
  - 将手动库存分析转换为使用编程脚本的自动化版本。这可能涉及创建常规表格、数据透视表和图表等任务，这些任务在 Excel 中创建，但可以转换为自动化流程。\n\
  - 使用 R Shiny 为业务应用创建 Web 界面并实现预测分析功能。\n- 将 IT 基础设施的某些部分迁移到云平台。这可能看起来违反直觉，尤其是如果组织不习惯在云环境中工作。然而，管理云部署的简易性和简单性可能意味着总体拥有成本和运营开销的整体降低。\n\
  \n最终用例的选择将取决于各种因素，前述内容旨在提供可能尝试的项目类型和可能产生积极结果的工作流程的大致概念。在下一节中，我们将研究数据科学行业中使用的一些特定软件和硬件解决方案。\n\
  \n## 企业中的数据科学解决方案\n\n如前所述，通常我们可以将数据科学大致分为两个主要部分：\n\n- 企业数据仓库和数据挖掘\n- 企业数据科学：机器学习、人工智能\n\
  \n在本节中，我们将分别研究这些内容，并讨论行业中用于提供这些能力的软件和硬件解决方案。\n\n## 企业数据仓库和数据挖掘\n\n如今，行业中有大量数据库被宣传为能够运行复杂分析查询的\
  \ NoSQL 系统。它们大多数具有典型的 NoSQL 系统的一个或多个功能，例如列式、内存中、键值、文档导向、基于图等。下一节重点介绍当今使用的一些关键企业\
  \ NoSQL 系统。\n\n### 传统数据仓库系统\n\n传统数据仓库可能是一个误称，因为大多数传统系统也已纳入 NoSQL 的核心概念。然而，在这种情况下，该术语旨在表示在\
  \ NoSQL 系统出现之前就已存在的数据库，并且还添加了使其与企业数据科学要求保持一致的功能。\n\n### Oracle Exadata、Exalytics\
  \ 和 TimesTen\n\nOracle Exadata、Exalytics 和 Exalogic 属于 Oracle 的 Exa 产品系列。**Exadata**\
  \ 是 Oracle 的高性能 *Engineered Database Platform*，专为资源密集型查询而设计。通常，预计其查询性能将显著优于非 Exadata\
  \ 系统，并支持高级软件功能，例如内存计算、独立的行和列过滤，以及其他硬件功能，例如支持最新的存储设备，包括 NVMe、内存容错等。\n\n**Exalytics**\
  \ 是一种补充解决方案，主要用于 **BI** 工作负载。Exa 产品系列被视为 *engineered systems* 而非 *appliances*。后者可能表示预设和预装的软件硬件堆栈，而\
  \ engineered system 预计在已安装组件的选择方面提供更高水平的灵活性，这些组件根据客户需求有选择地安装。Exalytics 在企业安装中常见的关键组件之一是\
  \ **OBIEE (Oracle Business Intelligence Enterprise Edition)**。这是一个完整的 BI 套件，并受益于底层内存数据库\
  \ **Times Ten**，它也是 Exalytics 生态系统的一部分。\n\n**业务用例：** Oracle Exadata 用于 OLTP 事务工作负载，在这些工作负载中速度和性能至关重要。\n\
  \n\n\n\n\n## Teradata\n\n传统上，Teradata 以一体机方案提供，数据库和硬件作为一个集成单元。如今，也可以使用 Teradata\
  \ Everywhere 在云中使用 Teradata。该软件可以部署在混合架构（本地和云）以及 AWS 和 Microsoft Azure 等公有云环境中。提供捆绑服务、订阅服务和按需服务选项。Teradata\
  \ IntelliCloud 是 Teradata 提供的基于订阅的云产品，在托管环境中包含 Teradata 生态系统的多个产品。\n\n**业务用例：**\
  \ Teradata 几十年来一直是流行的企业数据库，在大型组织中拥有很高的信誉。近年来，Teradata 主动与 R、Jupyter 等开源系统集成，使其更具吸引力，并有助于提高其知名度。Teradata\
  \ 一体机可能相对昂贵，与其他商业选项一样，需要进行适当的 POC 来评估是否适合组织的特定用例。\n\n## IBM 数据仓库系统（原 Netezza 一体机）\n\
  \nIBM Netezza 过去作为独立的数据仓库一体机出售，在某些方面类似于 Teradata 的营销方式。最近，Netezza 被归入更广泛的 IBM 数据仓库系统类别，这与管理超大数据量的当代大数据需求更加一致。IBM\
  \ PureSystems、PureSystems for Analytics 和 IBM Integrated Analytics System 是一些较新的解决方案，它们在集成生态系统中提供与\
  \ Netezza 基本相同的功能。\n\nIntegrated Analytics 环境包括用于机器学习的嵌入式 Apache Spark、用于数据科学工作负载的\
  \ Jupyter Notebooks、可连接到其他 NoSQL 和 Hadoop 实现的通用 SQL 引擎，并支持在高性能架构上部署，并提供托管、基于云的环境选项。\n\
  \n**业务用例：** Netezza 一直受到传统上依赖 IBM 相关技术（如 DB2、AIX 和 IBM 其他产品）的公司的青睐。新的集成产品环境为继续使用\
  \ Netezza 提供了机会，同时为组织现有的 IBM 投资增加了数据科学能力。\n\n## PostgreSQL\n\nPostgreSQL 在本节中是一个有趣的选择，因为严格来说，PostgreSQL\
  \ 没有单独的 NoSQL 版本，而是在最近的版本中添加了各种功能，为现有的 Postgres 实现增加了 NoSQL 功能。\n\nPostgreSQL 的支持者正确地指出，它是一种更古老且经过更多测试的技术，于\
  \ 1990 年代中期首次发布。Postgres 现在支持分层文档数据存储、JSON、键值存储（称为 HStore）和分片，并包含各种编程语言的接口以及多样化的数据源。换句话说，PostgreSQL\
  \ 已扩展到支持类似 NoSQL 的功能，同时保持其作为传统 RDBMS 的现有能力。\n\nPostgreSQL 作为功能完备的开源产品提供。\n\n**业务用例：**\
  \ 本节中的大多数技术都以商业许可形式提供（以获得其全部功能），而 PostgreSQL 作为开源产品，是一种非常经济高效的方式，无需大量初始投资即可试用成熟数据库。它还可以作为测试平台，在做出最终决定之前尝试\
  \ NoSQL 功能，例如处理 JSON 数据。无论哪种情况，PostgreSQL 都是一个强大的平台，可以支持企业需求。PostgreSQL 也有商业衍生品——基于\
  \ PostgreSQL 构建的数据库，例如 Greenplum，它也是开源产品。\n\n## Greenplum\n\n**Greenplum Database®**\
  \ 构建于 PostgreSQL 之上，并添加了许多重要的分析功能。其中包括创新的基于成本的查询优化器、与 Apache MADlib 的集成，以及行存储或列存储的选择。它为\
  \ R、Python 和 Java 等流行编程语言提供原生接口，并支持大规模并行架构。Greenplum 可从 http://greenplum.org/download/\
  \ 免费下载。\n\n**业务用例：** **Pivotal** 提供带有全面支持的商业发行版。Greenplum 非常成功，尤其因为其在大规模企业工作负载方面的成熟性能。商业支持的可用性对需要专门支持和服务级别协议（SLA）以保障关键业务运营的组织非常有益。\n\
  \n## MongoDB\n\n**业务用例：** 考虑使用数据库存储非结构化或半结构化数据的公司可能会发现 MongoDB 的功能非常适合查询此类数据集。该数据库无需在开始时定义固定模式，从而可以灵活扩展，以支持添加到现有数据中的新属性。MongoDB\
  \ 可从 https://www.mongodb.com/download-center 免费开源下载，也可以通过 MongoDB Atlas 作为托管和托管的云解决方案实施。还提供支持内存和加密存储等功能的企业版，可按订阅方式获取。\n\
  \n## Cassandra\n\n**Cassandra** 是最成功、最广泛使用的企业级 NoSQL 系统之一。它结合了列式和键值概念，并将数据存储在基于行的分区中。每个分区又是一个主键。行可以有多个列，并且列数可能因行而异。\n\
  \nCassandra 数据库可以通过 CQL 查询，CQL 使用类似 SQL 的语法，使数据查询、保存和其他常见任务变得容易得多。Cassandra 还使用去中心化架构；它没有任何单点故障，并支持多节点架构。\n\
  \n除了 Cassandra DBMS 的标准水平可扩展性外，该平台还支持弹性可扩展性，并能够根据需要透明地分配和取消分配节点。总的来说，Cassandra 是企业级\
  \ NoSQL 系统最强大的选择之一，在全球多家大型公司的生产环境中使用。\n\n**业务用例：** Cassandra 是完全开源的解决方案，实现了 NoSQL\
  \ 系统的多个关键功能。它用于全球生产工作负载，并已成熟为稳定、企业级的开源平台。换句话说，Cassandra 非常适合管理大型组织需求，且不会产生额外的许可成本。DataStax\
  \ 还提供商业许可的付费版本：https://www.datastax.com/products/datastax-enterprise。它被称为 **DSE（DataStax\
  \ Enterprise）**。DSE 集成了安全、搜索等各种企业功能，也可以通过 DataStax Managed Cloud 环境使用 AWS 等流行云提供商访问。\n\
  \n## Neo4j\n\nNeo4j 是一种基于图的数据库，用于建模不同实体之间的关系。该数据库使用图论中熟悉的概念来创建互连主题的基于树的表示（带有节点和关系）。它最常与推荐引擎结合使用。从概念上讲，Neo4j\
  \ 图数据库可以将个体表示为节点，这些节点通过例如分离度相互连接。这可以假设地允许最终用户跟踪任意节点或一个个体到另一个个体的分离度。\n\nNeo4j 平台提供了各种基于图的表示形式，如加权、有向、单向和带标签。\n\
  \n**业务用例：** 需要深度客户级或用户级分析的公司，例如社交网络或推荐系统（如 Netflix），可以从部署基于图的数据库（如 Neo4j）中获得巨大收益。如今，该平台支持\
  \ AI 和机器学习、物联网、实时推荐以及企业中使用的许多其他有用特性。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_339_0.png)\n\
  \n虽然 Neo4j 可从 https://neo4j.com/download/?ref=hro 作为开源软件获得，但也有商业许可版本，即 Neo4j Enterprise\
  \ Edition。\n\n## 云数据库\n\n顾名思义，云数据库是指来自 Amazon、Google 和 Microsoft 等云供应商的数据仓库或数据库系统。\n\
  \n### Amazon Redshift、Redshift Spectrum 和 Athena 数据库\n\nAmazon Redshift 是最常用的基于云的数据仓库平台之一。它是基于云生态系统中最重要的数据管理平台。它基于\
  \ PostgreSQL，主要用于分析工作负载。Redshift 具有高度可扩展性，与具有类似特性的本地数据库相比，需要的工作量要少得多。它可以直接从 AWS\
  \ 控制台部署（在注册 AWS 账户后）。可以通过 AWS 控制台无缝添加或删除节点，以分别增加和/或减少容量。\n\n\n\n\n\n较新的 Redshift\
  \ 版本称为 **Redshift Spectrum**，允许查询存储在 Amazon S3 中的数据，Amazon S3 是 AWS 中的标准存储层。这意味着用户可以直接查询磁盘上存储的数据，而无需将其加载到\
  \ Redshift 专用的实例中。总体而言，Redshift 相对于较快、价格便宜，更重要的是易于使用和部署。Redshift Spectrum 使用按查询付费模式——用户只需为执行的查询付费，每扫描一\
  \ TB 数据收取名义费用。\n\n**Amazon Athena** 在许多方面与 Amazon Redshift Spectrum 相似，因为它也用于查询存储在\
  \ S3 上的数据。然而，虽然 Amazon Redshift Spectrum 的功能不能在不先购买 Amazon Redshift 的情况下使用，但用户可以按需使用\
  \ Amazon Athena，并且无需预留任何额外硬件。另一方面，由于 Amazon Redshift Spectrum 与 Redshift 生态系统紧密集成，用户可以将工作负载分布在这两种解决方案上。需要更快处理的数据可以保留在\
  \ Amazon Redshift 上，而使用频率较低/不太关键的数据可以存储在 S3 上并使用 Redshift Spectrum 进行查询：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_340_0.png)\n\
  \nGoogle 在其云平台上还拥有其他 NoSQL 产品，包括 Google Cloud Datastore，一种基于文档的 NoSQL 数据库；Google\
  \ BigTable；Google Spanner；以及其他几种产品。以下图表显示了 Google BigQuery 数据库：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_342_0.png)\n\
  \n## Azure CosmosDB\n\nAzure CosmosDB 是微软的 NoSQL 云数据库之一。Azure 中的其他 NoSQL 系统包括 Table\
  \ Storage、Azure Redis Cache 等。CosmosDB 被认为是一种多模型数据库；它可以支持键值对、基于文档的查询、基于图的模型以及关系数据库查询。\n\
  \n## Brytlyt\n\n**Brytlyt** 是 GPU 数据库领域的近期进入者。它由一个名为 **Spotlyt** 的可视化产品补充。早期测试显示\
  \ Brytlyt 超越了几个具有挑战性的基准。然而，它在其他用例中的泛化程度如何还有待观察。\n\nBrytlyt 可在 Amazon AWS Marketplace\
  \ (https://aws.amazon.com/marketplace/pp/B074JZNSWZ?qid=1513342415797sr=0-1&ref_=srh_res_product_title)\
  \ 中获得，供希望尝试的用户使用。\n\n## MapD\n\nMapD 是商业 GPU 数据库平台的早期开发商之一。与 Brytlyt 类似，它也显示了令人印象深刻的早期成果。尽管如此，由于基于\
  \ GPU 的数据库仍处于早期阶段，普及使用和采用最终将决定它们是否会在企业中变得普遍。\n\n基于 GPU 的数据库的主要挑战之一是需要正确配置基于 GPU\
  \ 的系统。这可能需要专业技能，因为将 GPU 卡用于计算与将 GPU 卡用于渲染图像等常见任务大不相同。因此，希望在采用正式版本之前尝试基于 GPU 的数据库的用户会发现利用\
  \ AWS 中的预配置镜像（AMI Image）更容易，这将需要最少的系统配置。\n\n## 其他常见数据库\n\n还有各种其他类型的数据库，例如用于分析流数据的数据库（Amazon\
  \ Kinesis），以及使用百度 FPGA 的专用加速卡处理数据的数据库。\n\n## 企业数据科学 – 机器学习和 AI\n\n**数据科学解决方案** 在过去\
  \ 4-5 年中迅速成熟，与数据科学其他领域如 NoSQL、Hadoop 和其他数据挖掘解决方案的趋势相似。虽然许多先前的数据库系统也包含了 *数据科学* 的关键功能，例如机器学习等，但本节重点介绍了一些主要用于机器学习和/或\
  \ AI 的解决方案，而非数据管理。\n\n事实上，*大数据* 产品与 *数据科学* 产品之间的区别变得模糊，因为最初用于大数据处理的产品已融入了数据科学的关键功能，反之亦然。\n\
  \n### R 编程语言\n\n**R**，正如我们在前几章中所见，是最初为统计编程而设计的环境。它源于新西兰大学的一个项目，*Ross Ihaka* 和 *Robert\
  \ Gentleman* 在该项目中将 R 开发为约翰·钱伯斯在贝尔实验室开发的 S 编程语言的变体。虽然 R 最初 intended 用于 *统计编程*，但在过去\
  \ 7 到 8 年中，它已发展成为一种成熟的多功能语言，对机器学习、高性能计算、可视化、计量经济学、时间序列分析等多种相关学科提供了增强支持。有关这些领域的更多信息可在\
  \ https://cran.r-project.org/web/views/ 上找到。\n\nR 的商业版本并提供企业支持由 Revolution Analytics\
  \ 提供。2015 年，它被重新命名为 **Microsoft R Open**（开源版本）和 **Microsoft R Server**（商业版本）。\n\n\
  尽管以微软品牌营销，但请注意 Microsoft R 也可用于 Linux 和 Mac OS。\n\nR 中流行的机器学习包包括 `e1071`、`randomForest`、`gbm`、`kernlab`、`arules`\
  \ 等。它们列在 https://cran.r-project.org/web/views/MachineLearning.html 上。另一个流行的包，称为\
  \ caret，作为各种算法包的包装器，提供了一个有用的统一接口来运行算法，而无需遵循各个包的细微差别。\n\nR 还通过 `multicore`、`doMC`\
  \ 等包支持多核编程。它们列在 https://cran.r-project.org/web/views/HighPerformanceComputing.html\
  \ 上。\n\n### Python\n\nPython 中的 `scikit-learn` 包可以说是所有平台中最全面的机器学习包之一，其中包含广泛的机器学习算法列表。它也被认为比\
  \ R 更快，是各种企业组织的首选工具。以下屏幕截图显示了我们可以下载 `scikit-learn` 包的网页：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_346_0.png)\n\
  \n一个商业支持的企业版 Python，预先配置了有用的机器学习和数据挖掘包，是来自 Continuum Analytics 的 Anaconda。名为 Anaconda\
  \ Cloud 的 Anaconda 云版本允许新用户在无需单独下载和安装的情况下开始利用 Anaconda Python 的功能。\n\n### OpenCV、Caffe\
  \ 等\n\n图像识别是机器学习中较为成功的领域之一。虽然大多数机器学习任务需要在较长的时间段内才能衡量和量化其真正的好处，但图像识别是一个熟悉的主题领域，可以很容易理解。其本质是识别对象并正确对其进行分类。它有多种应用，从识别车牌号码到人脸识别，并在移动设备和机器人中使用。\n\
  \nOpenCV 为各种图像识别任务提供标准接口，并且还可以利用硬件加速功能来优化性能。\n\n其他知名图像处理机器学习软件包括 Caffe、cuDNN、TensorFlow\
  \ 等。请注意，这些包不仅限于简单的图像识别，还可用于其他深度学习用例。\n\n### Spark\n\nSpark 中的 MLlib 库提供了可在 Spark\
  \ 平台中使用的各种机器学习算法的正式实现。pySpark 的可用性使得具有 Python 编程知识的人更容易使用该功能。如果组织已有现有的 Spark 平台，那么探索\
  \ MLlib 中的机器学习功能是值得的。\n\n\n\n\n以下截图简要概述了MLlib：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_348_0.png)\n\
  \n## 深度学习\n\n具有多个隐藏层（通常超过两个）和/或多个节点的神经网络通常被归类为**深度学习**。机器学习领域的若干当代进展，如自动驾驶汽车，正是深度学习应用于日常实际任务的直接成果。\n\
  \n有各种各样的深度学习框架/包，其中一些值得注意的包括：\n\n- TensorFlow\n- cuDNN\n- Theano\n- Torch\n- 来自百度的PaddlePaddle\n\
  \n## H2O与Driverless AI\n\n作为Kaggle竞赛的热门平台，H2O提供了一个大规模可扩展的实时机器学习接口，原生集成了R、Python、Spark等更多内容。它可从\
  \ https://www.h2o.ai/h2o/ 免费下载。\n\nDriverless AI是H2O产品线中的新成员。它旨在通过自动化接口让机器学习对从业者更加容易，该接口尝试以自动化方式构建和评估多个模型，从而创建模型并优化准确度。以下截图展示了H2O平台的主页：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_349_0.png)\n\n下面的截图来自IBM Watson，这是机器学习和人工智能领域最知名的平台之一。该平台在2011年赢得《危险边缘》（Jeopardy）冠军后声名鹊起[来源：https://www.techrepublic.com/article/ibm-watson-the-inside-story-of-how-the-jeopardy-winning-supercomputer-was-born-and-what-it-wants-to-do-next/]。当时，机器学习趋势尚处于萌芽阶段，而Watson是最早令世界惊叹的AI技术之一。它证明了AI可以是一种强大且能干的资产。如今，用户可以通过在网站\
  \ https://www.ibm.com/watson/ 上注册账户，利用与IBM Watson相同的部分计算能力。\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_352_0.png)\n\
  \n## 企业基础设施解决方案\n\n基础设施的恰当选择对于决定组织数据科学平台的效率也起着关键作用。基础设施过少，算法执行时间会过长；过多，则可能会有大量资源未被利用。因此，资源过多比过少更可取，因为过少会阻碍进展，并妨碍机器学习研究者高效执行其任务的能力。\n\
  \n## 云计算\n\n在过去5至7年中，各类组织逐渐将资源转移到云端平台，如Amazon Web Services、Microsoft Azure和Google\
  \ Compute Engine。如今，这些平台都拥有极其复杂和广泛的架构，支持机器学习、数据挖掘，以及总体上企业级的*数据科学*，以满足各种规模组织的需求。\n\
  \n此外，*镜像*的概念（例如Amazon AWS中的AMI镜像）允许用户启动一个预构建的操作系统快照，其中带有预安装的组件。因此，用户在尝试新平台之前几乎可以完全避免设置开销。\n\
  \nHadoop和map-reduce操作在AWS中也得到广泛支持。AWS中的**EMR**（即**Elastic Map Reduce**）和Azure中的HDInsight是两大知名且非常流行的大数据框架。\n\
  \n本章末尾的教程将演示如何设置AWS账户并开始使用示例AMI镜像。\n\n## 虚拟化\n\n**虚拟化**——在更大的主机内创建隔离、自包含环境的过程——使组织能够整合服务器并大幅减少数据中心占地面积。比如说，一个组织为其网站使用了六台服务器，其中两台使用频繁，而其余几台在大多数时候负载相对较低，那么有可能将所有服务器整合到至多一两台服务器上。在这方面，Dell\
  \ EMC的VxBLOCK等技术是物理数据中心中知名的企业级虚拟化硬件。这也使得公司能够创建自己的私有云基础设施。然而，它可能相当昂贵，需要正确评估成本效益比。\n\
  \nOpenStack是一种用于创建公有云和私有云的开源软件。它是一个企业级生态系统，包含多个产品，可在OpenStack平台内无缝运行。有关OpenStack的更多详细信息，请访问`https://www.openstack.org`。\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_354_0.png)\n\n用户可能熟悉Oracle VirtualBox，本质上它也是一种允许用户创建隔离环境的虚拟化软件。它允许用户在Windows中运行Linux，反之亦然。\n\
  \n称为虚拟机监视器（hypervisor）的专用软件或硬件用于管理和运维虚拟机。\n\n## 容器——Docker、Kubernetes和Mesos\n\n\
  容器与虚拟化一样，会创建隔离的客户系统，但是虚拟机创建的是完全独立的环境，而容器与主机系统共享同一内核，因此被认为更接近硬件。虚拟化和容器都会因多层抽象——主机与客户操作系统之间的功能转换——而产生性能损耗。然而，容器通常具有更高的性能水平，因为它们依赖并直接使用客户操作系统的特性，而不是创建单独的操作系统生态系统。\n\
  \n流行的容器包括Docker、CoreOS等。如今，容器主要用于大规模管理以Web为主的服务。相比虚拟机，容器可以更便捷地按需启动和关闭，并且主流云提供商已经添加了对容器的专门支持，只需几行代码即可轻松启动数千个容器来服务Web请求。Kubernetes等编排软件提供了企业级容器管理能力。此外，Mesos等平台不仅提供容器管理支持，还增加了管理其他传统硬件的能力，以实现应用感知调度和其他服务：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_355_0.png)\n\n## 本地部署硬件\n\n最后，本地部署硬件（如传统数据中心）在当今计算领域仍占有一席之地。使用物理数据中心，用户无需为基于云的服务支付经常性费用。对于没有大量管理开销的中小型组织，或者对于不需要高性能/专业化计算能力的组织，本地部署系统完全能够提供成本效益高且永久性的解决方案。\n\
  \nScaleMP等公司提供用于高性能计算的专业硬件。此类硬件的用户通常有云服务提供商无法提供的特定需求：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_356_0.png)\n\
  \n下表总结了本地部署系统与基于云的系统之间的一些差异：\n\n| 本地部署 | 云 |\n|---|---|\n| 你拥有硬件 | 你租用硬件 |\n| 需要全面维护\
  \ | 维护由云托管提供商管理 |\n| 需要IT资源来管理计算硬件资源 | 在管理计算硬件资源方面开销小得多，因为它们可以在云端按需添加 |\n| 对于数据中心运营成本低或没有运营成本的中小型环境而言成本效益高\
  \ | 对于希望简化数据中心运营成本的大型组织而言成本效益高 |\n| 除管理硬件所需的资源外，使用硬件没有经常性成本 | 使用硬件会产生经常性成本；采用订阅模式定价\
  \ |\n| 主要采用静态架构；对Hadoop的新需求将需要一整套新采购 | 极其灵活；公司可以按需在多操作系统中配置数千台服务器 |\n| 容易被组织、法务及相关业务部门接受\
  \ | 由于将管理委托给第三方/云托管提供商，会面临障碍，尤其是来自法务部门的障碍 |\n\n## 企业大数据\n\n大型组织实施大数据的总体策略取决于组织的具体需求。如今，在大数据、数据科学、机器学习以及近来出现的AI提供商之间，有数百种选择。\n\
  \n因此，在大型组织实施大数据时，有两个主要考虑因素：\n\n- **技术**：选择合适的软件和硬件栈\n- **运营**：管理组织数据、制定正式的数据治理策略，以及建立充分的数据管理框架\n\
  \n除此之外，招聘合适的人才，并可能为公司的大数据/数据科学实施创建明确的角色，是额外但同样重要的任务。\n\n制定此类战略时的一些关键问题包括：\n\n- 软件/硬件的许可是基于数据量还是核心数？如果是基于数据量，而我的数据量增长，那么3年/5年的成本是多少？\n\
  - 该解决方案是否有企业级支持？\n- 我们是否需要聘请外部资源？\n- 新功能将回答哪些业务问题？\n- 我们是否进行了短期和长期的成本效益分析？\n- 新解决方案能够满足组织目前哪些未满足的需求？\n\
  - 该解决方案是否具有足够的可扩展性以满足我未来的潜在需求？\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_358_0.png)\n\
  \n在技术需求方面，尽管市场上有许多解决方案，但在实践中，使用该解决方案将要处理的真实/实际数据进行测试或概念验证是极其重要的。经常可以发现一些解决方案声称功能强大，却无法达到预期。**换句话说，关键是要收集全面的实证结果，而不是仅仅基于营销宣传就进行购买。**\n\
  \n最后，由于大数据/数据科学在不断发展，需要正确评估解决方案的长期可扩展性和适应性。应考虑基于云的选项，因为它提供了一种高效的方式，可以轻松且负担得起地访问和使用新兴解决方案。\n\
  \n## 教程 – 在云端使用RStudio\n\n以下教程将演示如何在**AWS**（Amazon Web Services）上创建账户，加载RStudio的AMI镜像，然后使用RStudio，而且全部*免费*。有云平台使用经验的读者可能会觉得这些说明相当基础。对于其他用户，本教程应提供有关使用AWS的有用初步指导。\n\
  \n在继续之前，请阅读下面的**警告**信息。\n\n**警告：** 请注意，AWS注册需要信用卡。用户必须小心，只选择免费套餐（FREE TIER）选项。AWS协议允许亚马逊向用户收取产生的费用。因此，用户应明智地使用该平台，以避免因服务器或服务持续运行而产生可能昂贵的意外费用。\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_359_0.png)\n\n目前，Azure和Google Cloud提供用户注册，并设有避免意外收费的条款。然而，AWS在所有云供应商中拥有最高的市场份额，用户在大多数工作场合都可能遇到AWS。因此，本教程重点介绍AWS而非其他替代方案。\n\
  \n如果你希望停止使用AWS（从而也避免任何费用），本教程末尾还提供了如何关闭账户的说明：\n\n1. 前往 `https://aws.amazon.com/`\
