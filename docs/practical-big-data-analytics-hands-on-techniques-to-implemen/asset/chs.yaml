  In simple terms, machine learning involves predicting future events based on historical\
  \ data. We see it manifested in our day-to-day lives and indeed we employ, knowingly\
  \ or otherwise, principles of machine learning on a daily basis.\n\nWhen we casually\
  \ comment on whether a movie will succeed at the box office using our understanding\
  \ of the popularity of the individuals in the lead roles, we are applying machine\
  \ learning, albeit subconsciously. Our understanding of the characters in the lead\
  \ roles has been shaped over years of watching movies where they appeared. And,\
  \ when we make a determination of the success of a future movie featuring the same\
  \ person, we are using historical information to make an assessment.\n\nAs another\
  \ example, if we had data on temperature, humidity, and precipitation (rain) over\
  \ a period of say, 12 months, can we use that information to predict whether it\
  \ will rain today, given information on temperature and humidity?\n\nThis is akin\
  \ to common regression problems found in statistics. But, machine learning involves\
  \ applying a much higher level of rigor to the exercise to reach a conclusive decision\
  \ based not only on theoretical calculations, but verification of the calculations\
  \ hundreds or thousands of times using iterative methods before reaching a conclusion.\n\
  \nIt should be noted and clarified here that the term *machine learning* relates\
  \ to algorithms or programs that are executed typically on a computing device whose\
  \ objective it is to predict outcomes. The algorithms build mathematical models\
  \ that can then be used to make predictions. It is a common misconception that machine\
  \ learning quite literally refers to a *machine* that is *learning*. The actual\
  \ implication, as just explained, is much less dramatic.\n\n## The evolution of\
  \ machine learning\n\nThe timeline of machine learning, as available on Wikipedia\
  \ (https://en.wikipedia.org/wiki/Timeline_of_machine_learning), provides a succinct\
  \ and insightful overview of the evolution of the field. The roots can be traced\
  \ back to as early as the mid-1700s, when Thomas Bayes presented his paper on *inverse\
  \ probability* at the Royal Society of London. Inverse probability, more commonly\
  \ known today as probability distribution, deals with the problem of determining\
  \ the state of a system given a prior set of events. For example, if a box contained\
  \ milk chocolate and white chocolate, you took out a few at random, and received\
  \ two milk and three white chocolates, can we infer how many of each chocolate there\
  \ are in the box?\n\nIn other words, what can we infer about the unknown given a\
  \ few points of data with which we can postulate a formal theory? Bayes' work was\
  \ developed further into Bayes' Theorem by Pierre-Simon Laplace in his text, *Théorie\
  \ Analytique des Probabilités.*\n\nIn the early 1900s, Andrey Markov's analysis\
  \ of Pushkin's Poem, Eugeny Onegin, to determine the alliteration of consonants\
  \ and vowels in Russian literature, led to the development of a technique known\
  \ as Markov Chains, used today to model complex situations involving random events.\
  \ Google's PageRank algorithm implements a form of Markov Chains.\n\nThe first formal\
  \ application of machine learning, or more generally, AI, and its eventual emergence\
  \ as a discipline, should be attributed to Alan Turing. He developed the Turing\
  \ Test - a way to determine whether a machine is intelligent enough to mimic human\
  \ behavior. Turing presented this in his paper, *Computing Machinery and Intelligence*,\
  \ which starts out with the following:\n\n> I propose to consider the question,\
  \ \"Can machines think?\" This should begin with definitions of the meaning of the\
  \ terms \"machine\" and \"think.\" The definitions might be framed so as to reflect\
  \ so far as possible the normal use of the words, but this attitude is dangerous,\
  \ If the meaning of the words \"machine\" and \"think\" are to be found by examining\
  \ how they are commonly used it is difficult to escape the conclusion that the meaning\
  \ and the answer to the question, \"Can machines think?\" is to be sought in a statistical\
  \ survey such as a Gallup poll. But this is absurd. Instead of attempting such a\
  \ definition I shall replace the question by another, which is closely related to\
  \ it and is expressed in relatively unambiguous words.[...]\n\n\n\n\n图灵在论文后面写道：\n\
  \n> “机器能思考吗？”这个问题，我认为其原始表述太过无意义，不值得讨论。尽管如此，我仍相信，到本世纪末，人们的用词和普遍教育观点将发生足够大的变化，以至于人们可以谈论机器思考而不会预期遭到反驳。我还进一步相信，隐瞒这些信念不会带来任何有益的目的。\n\
  \n图灵在AI方面的工作之后，机器学习与AI领域迎来了一系列开创性事件。1951年，马文·明斯基开发了第一个神经网络；1952年，亚瑟·塞缪尔开始了他的第一个机器学习程序（下棋程序）的研究；1957年，罗森布拉特发明了感知机，这是神经网络的基本单元。利奥·布雷曼、杰罗姆·弗里德曼、弗拉基米尔·瓦普尼克、阿列克谢·切尔沃年基斯、杰夫·辛顿和杨立昆等先驱在20世纪90年代末期做出了重大贡献，使机器学习进入公众视野。我们非常感谢他们的工作和贡献，正是这些使得机器学习如今成为一个独特的研究领域。\n\
  \n1997年，IBM的“深蓝”击败了卡斯帕罗夫，立刻成为全球轰动的事件。机器击败世界顶级国际象棋冠军的能力绝非普通成就。这一事件为机器学习赢得了亟需的可信度，使其成为图灵所设想的智能机器的有力竞争者。\n\
  \n## 机器学习成功背后的因素\n\n鉴于机器学习作为一门学科已经存在了几十年，人们不禁要问：为什么它没有更早地像今天这样流行？事实上，神经网络等复杂机器学习算法的理论在20世纪90年代末就已广为人知，而理论基础在此之前也已建立。\n\
  \n有几个因素可以归功于机器学习的成功：\n\n- **互联网**：网络在信息民主化和以空前方式连接人们方面发挥了关键作用。它以印刷媒体传播等既有方式无法实现的方式，使信息交换变得简单。网络不仅转变并彻底革新了信息传播方式，还开辟了新的机遇。如前所述，谷歌的PageRank是统计模型应用于打造高度成功的网络企业这一领域最早的大规模、高可见性成功案例之一。\n\
  \n- **社交媒体**：虽然网络提供了通信平台，但它缺乏一种类似人们在现实世界中相互互动方式的灵活性。有一个明显但常被低估、且可以说是尚未被充分探索的缺口。IRC和Usenet等工具是Myspace等社交网站的前身，而Myspace是最早的基于网络的个人社交平台之一。到2000年初至中期，Facebook已成为社交网络的领导者。这些平台提供了独特的机会，将互联网用于在个体层面收集数据。每个用户都留下了一条条消息记录，很适合使用自然语言处理和其他技术进行收集与分析。\n\
  \n- **计算硬件**：计算机硬件以指数级速度发展。机器学习算法本质上对计算和资源要求极高，也就是说，根据数据规模，它们需要强大的CPU、快速的磁盘和高内存。将数据存储在新的**固态硬盘（SSD）**上，是从以往的旋转硬盘存储方式的一大飞跃。更快的访问意味着数据可以更快地传送给CPU，并减少I/O瓶颈，这一瓶颈历来是计算中的薄弱环节。更快的CPU使得及时执行机器学习算法所需的成百上千次迭代成为可能。最终，需求导致了计算资源价格的下降，使更多人能够负担得起原本价格高昂的计算硬件。算法早已存在，但资源终于能够在合理的时间和成本下执行它们。\n\
  \n- **编程语言与软件包**：R和Python开发者等社区抓住了这一机遇，个人开始发布软件包，将自己的工作成果展示给更广泛的程序员社群。尤其是提供机器学习算法的软件包迅速流行起来，并激励其他从业者发布自己的个人代码库，使R这样的平台真正成为全球性的协作成果。如今R中已有超过1万个软件包，而2010年时只有2000个。\n\
  \n## 机器学习、统计学与AI\n\n机器学习这个术语有许多同义词——这些名称要么是企业营销活动的产物，要么只是被交替使用的术语。尽管有些人可能认为它们含义有所不同，但最终都指向机器学习这门利用历史信息预测未来事件的学科。\n\
  \n机器学习常见的术语包括预测分析、预测建模等。因此，除非某个实体发布了材料来专门解释其对这些术语的理解以及它们之间的区别，否则一般可以放心地认为它们指的就是机器学习。这往往让接触该学科的新手感到困惑，很大程度上是由于技术词汇的滥用和过度使用。\n\
  \n而统计学是一门独立的学科，已为人熟知超过200年。该词源于新拉丁语 *statisticum collegium*（英语意为“国务院”）以及意大利语单词 *statista*，意为政治家或政客。你可以访问\
  \ https://en.wikipedia.org/wiki/History_of_statistics#Etymology 了解该话题的更多细节。机器学习实现了各种统计模型，但由于其中涉及严格的计算，它与经典统计学分支有所不同。\n\
  \nAI与机器学习紧密相关，但其范畴要广泛得多。它可以粗略地定义为系统（软件/硬件）在存在不确定性的情况下，通常以负责任且具有社会意识的方式做出具体决策，以实现最终目标。换句话说，AI旨在通过系统性地处理涉及已知和未知（潜在）因素的情境来产生行动。\n\
  \nAI让人联想到科幻电影中聪明甚至叛逆的机器人，也让我们想起像IBM Watson这样的智能系统，它们能够解析复杂问题并处理模糊陈述，以找到具体答案。\n\n\
  机器学习也具有一些相同特征——使用训练数据逐步构建模型，并使用测试数据衡量准确性。然而，AI已存在数十年，并已成为家喻户晓的术语。卡内基梅隆大学等美国机构在建立AI的关键原则和指导方针方面走在前列。\n\
  \n网上关于AI与机器学习区别的文章似乎没有提供结论性的答案。然而，大学AI课程的 syllabus（教学大纲）使差异非常明显。你可以在 https://cs.brown.edu/courses/csci1410/lectures.html\
  \ 了解更多关于AI的内容。\n\n一个简单的解释有助于说明这一概念。到目前为止，我们大多数人都熟悉电子邮件中的垃圾邮件概念。大多数电子邮件账户还包含一个独立的文件夹，名为“垃圾邮件”（Junk、Spam）或类似名称。粗略查看这些文件夹通常会发现其中有多封电子邮件，其中许多是未经请求的，并且包含无意义的信息。\n\
  \n仅仅是将邮件分类为垃圾邮件并移至文件夹这一任务就涉及机器学习的应用。吴恩达在他广受欢迎的机器学习MOOC课程中巧妙地阐述了这一点。\n\n用Mitchell的术语来说，垃圾邮件分类过程涉及：\n\
  \n- **任务T**：将电子邮件分类为垃圾/非垃圾邮件\n- **性能P**：被准确识别为垃圾邮件的数量\n- **经验E**：模型被提供已标记为垃圾/非垃圾的邮件，并利用这些信息判断新邮件是否为垃圾邮件\n\
  \n从广义上讲，机器学习有两种不同类型的类型：\n\n- 有监督机器学习\n- 无监督机器学习\n\n我们在这里分别讨论。\n\n## 有监督与无监督机器学习\n\
  \n我们先从有监督机器学习开始。\n\n## 有监督机器学习\n\n**有监督机器学习**是指使用带标签的数据预测结果的机器学习任务。带标签数据仅意味着我们用于预测的数据集（以及我们将预测的结果）具有确定的值（无论其具体是什么）。例如，将邮件分类为垃圾或非垃圾邮件、预测温度以及从图像中识别人脸，都属于有监督机器学习的例子。\n\
  \n\n\n\n\n## 车辆里程、数字识别及其他示例\n\n给定一个数据集，其中包含各类汽车的每加仑英里数、气缸数等信息，如果我们只有其他变量的值，能否预测每加仑英里数的取值？\n\
  \n在这个例子中，我们的目标变量是 `mpg`，我们使用其他变量，如 `cyl`（气缸数）、`hp`（马力）、`gear`（档位数）等来构建模型，然后将该模型应用于\
  \ `mpg` 值被标记为 `MISSING` 的数据集。模型读取数据前五行中这些列的信息，并据此预测其他行中 `mpg` 的值，如下图所示：\n\n| cyl\
  \ | hp | wt | gear | mpg |\n| --- | --- | --- | --- | --- |\n| 6 | 110 | 2.620 |\
  \ 4 | 21 |\n| 6 | 110 | 2.875 | 4 | 21 |\n| 4 | 93 | 2.320 | 4 | 22.8 |\n| 6 | 110\
  \ | 3.215 | 3 | 21.4 |\n| 8 | 175 | 3.440 | 3 | 18.7 |\n| 6 | 105 | 3.460 | 3 |\
  \ MISSING |\n| 8 | 245 | 3.570 | 3 | MISSING |\n| 4 | 62 | 3.190 | 4 | MISSING |\n\
  | 4 | 95 | 3.150 | 4 | MISSING |\n| 6 | 123 | 3.440 | 4 | MISSING |\n\n之所以认为这是有监督学习，是因为在构建机器学习模型的过程中，我们向模型提供了关于目标结果的信息。其他示例包括：\n\
  \n- **识别字母和数字**：在这种情况下，模型的输入是图像，例如字母和数字的图片，输出是图像上显示的字母数字值。模型构建完成后，就可以用于图片识别，预测图片中显示的数字。这是一个简单但功能强大的例子。想象一下，如果给你\
  \ 10 万张带有门牌号的房屋图片，手动识别门牌号需要逐张查看图片并记录数字。而机器学习模型可以让整个过程完全自动化，你无需手动逐张处理图片，只需对图片运行模型，就能在很短时间内获得结果。\n\
  - **自动驾驶汽车**：算法的输入是已识别出图像中物体的图片，例如人、路标、汽车、树木、商店等元素。在展示了足够多的图像后，算法会*学会*识别并区分不同元素；之后，给定一张未标记的图像（即其中物体尚未被识别的图像），算法就能逐个识别出这些物体。公平地说，这是对一个非常复杂主题的高度简化解释，但总体原理是相同的。\n\
  \n用于数字识别的 MNIST 数据集：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_242_0.png)\n\n\
  ### 无监督机器学习\n\n**无监督机器学习**涉及的目标结果没有标签的数据集。以预测汽车 `mpg` 值为例，在无监督练习中，我们的数据集如下所示：\n\n\
  | cyl | hp | wt | gear | mpg |\n| --- | --- | --- | --- | --- |\n| 6 | 110 | 2.620\
  \ | 4 | MISSING |\n| 6 | 110 | 2.875 | 4 | MISSING |\n| 4 | 93 | 2.320 | 4 | MISSING\
  \ |\n| 6 | 110 | 3.215 | 3 | MISSING |\n| 8 | 175 | 3.440 | 3 | MISSING |\n| 6 |\
  \ 105 | 3.460 | 3 | MISSING |\n| 8 | 245 | 3.570 | 3 | MISSING |\n| 4 | 62 | 3.190\
  \ | 4 | MISSING |\n| 4 | 95 | 3.150 | 4 | MISSING |\n| 6 | 123 | 3.440 | 4 | MISSING\
  \ |\n\n如果所有目标结果都是*缺失*的，就无法知道这些值可能是什么。请记住，机器学习的基本前提是利用历史信息对结果未知的数据集进行预测。但是，如果历史信息本身没有任何已标记的结果，那么就不可能构建模型。在不知道任何其他信息的情况下，表中\
  \ `mpg` 的值可能全为 0，也可能全为 100；我们无法判断，因为我们没有任何有助于推导出该值的数据点。\n\n这正是*无监督*机器学习的应用之处。在这种机器学习类型中，我们并不试图预测结果，而是试图确定哪些条目彼此最为相似。\n\
  \n这类练习的常见名称是*聚类*，也就是说，我们试图找到彼此最为相似的*簇*或记录组。这些信息可以在哪里使用？无监督学习有哪些示例？\n\n网络上有各种新闻聚合器——这些网站本身不发布信息，而是从其他新闻来源收集信息。其中一个聚合器是\
  \ Google News。例如，如果我们要搜索卡西尼号卫星拍摄的最后一批土星图像，可以在 Google News 上简单搜索该短语：`https://news.google.com/news/?q1=US&ned=us&hl=en`。下面是一个示例：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_244_0.png)\n\n注意，新闻文章底部有一个 **查看全部** 链接。点击该链接将进入一个包含所有其他相关新闻文章的页面。当然，Google\
  \ 并没有手动将这些文章分类到特定搜索词下。事实上，Google 事先并不知道用户会搜索什么。搜索词完全可能是*从太空拍摄的土星环图像*。\n\n那么，Google\
  \ 如何知道哪些文章属于某个特定搜索词呢？答案在于聚类或无监督学习原理的应用。无监督学习检查特定数据集的属性，以确定哪些文章彼此最为相似。要做到这一点，算法甚至不需要了解上下文背景。\n\
  \n假设给你两套没有封面的书，一套是园艺书籍，另一套是计算机编程书籍。虽然你可能不知道书名，但区分计算机书籍和园艺书籍相当容易。其中一套书会出现大量与计算相关的术语，而另一套则会出现大量与植物相关的术语。仅仅根据书中的图像，即使假设读者既不了解计算机也不了解园艺，也不难区分出这两类书。\n\
  \n无监督机器学习的其他示例包括恶性肿瘤和良性肿瘤的检测，以及基因测序。\n\n### 有监督机器学习的细分\n\n有监督机器学习可以进一步细分为以下两类任务：\n\
  \n- 分类\n- 回归\n\n这两个概念相当简单。\n\n分类涉及的目标结果是离散值——也就是**类别型**结果的机器学习任务。所有**名词**都是类别型变量，例如水果、树木、颜色和真/假。\n\
  \n分类任务中的目标变量也被称为**离散变量**或**类别变量**。\n\n一些示例包括：\n\n- 根据大小、重量和形状识别水果\n- 根据一组数字图像识别数字（如前一章所示）\n\
  - 识别街道上的物体\n- 将扑克牌识别为方块、黑桃、红心和梅花\n- 根据学生的成绩确定学生的班级排名\n\n最后一个示例可能不太明显，但排名（即第 1 名、第\
  \ 2 名、第 3 名）表示一个固定的类别。学生可以排名第 1 或第 2，但不可能排名第 1.5！\n\n下面展示了一些非典型分类示例的图片：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_246_0.png)\n\
  \n另一方面，**回归**涉及计算数值型结果。任何能够执行加、减、乘、除等数值运算的目标结果，都属于回归问题。\n\n回归的示例包括：\n\n- 预测每日气温\n\
  - 计算股票价格\n- 预测住宅房产的销售价格等\n\n\n\n\n\n## 机器学习中的核心概念\n\n机器学习中有许多重要的概念；我们将介绍其中一些更常见的主题。机器学习涉及一个多步骤的过程，从数据获取、数据挖掘开始，最终导致构建预测模型。\n\
  \n模型构建过程的关键方面包括：\n\n- **数据预处理：** 预处理和特征选择（例如，均值中心化和缩放、类别不平衡、变量重要性）\n- **训练、测试划分和交叉验证：**\n\
  \  - 创建训练集（例如，数据量的 80%）\n  - 创建测试集（约数据量的 20%）\n  - 执行交叉验证\n- **创建模型，获取预测：**\n  -\
  \ 你应该尝试哪些算法？\n  - 你试图优化哪些准确性指标？\n  - 你应该使用哪些调参参数？\n\n## 机器学习中的数据管理步骤\n\n预处理，或更一般地处理数据，是大多数机器学习练习中不可或缺的一部分。你开始时拥有的一个数据集很少会以精确的格式存在，而你将用该格式构建机器学习模型；它在大多数情况下不可避免地需要大量清理。事实上，数据清理通常是整个过程中最耗时的部分。在本节中，我们将简要介绍你在实践中可能遇到的一些顶级数据处理步骤。\n\
  \n## 预处理和特征选择技术\n\n**数据预处理**，顾名思义，涉及整理数据以使其适合机器学习练习。预处理有各种方法，其中一些更常见的方法已在此处说明。\n\
  \n请注意，数据预处理应作为交叉验证步骤的一部分进行，即预处理不应在模型构建过程之前进行，而应在模型构建过程中进行。这将在后面更详细地解释。\n\n## 均值中心化和缩放\n\
  \n对数值列应用中心化和缩放函数通常是为了标准化数据并消除数值大小或差异的巨大变化带来的影响。你可能在大学课程中遇到过这种情况，学生会被标准化地评分，或按曲线评分。\n\
  \n例如，假设一份考试试卷异常困难，在一个 10 名学生的班级中，有一半学生的成绩低于 60 分——该课程设定的及格率。教授可以 a) 判定 50% 的学生应重修课程，或\
  \ b) 对成绩进行标准化，以了解学生之间的相对表现。\n\n假设班级成绩为：\n\n45,66,66,55,55,52,61,64,65,49\n\n及格分数设为\
  \ 60，这意味着成绩为 45、55、55、52 和 49 的学生将无法成功完成课程。\n\n然而，这可能并不是他们相对优劣的真正准确体现。教授也可以选择改用中心化和缩放方法，\
  \ commonly known as standardization，即标准化，这涉及：\n\n- 找到所有成绩的均值\n- 从成绩中减去均值\n- 将结果除以所有成绩的标准差\n\
  \n下面为参考而说明了该操作。\n\n成绩的均值为 57.8。因此，从每个数字中减去 57.8 得到第二行所示的数字。但，我们还没有完成。我们需要将数字除以成绩的标准差以获得最终的标准化值：\n\
  \n| Scores | 45 | 66 | 66 | 55 | 55 | 52 | 61 | 64 | 65 | 49 |\n| Scores - Mean\
  \ | -12.8 | 8.2 | 8.2 | -2.8 | -2.8 | -5.8 | 3.2 | 6.2 | 7.2 | -8.8 |\n| Divide\
  \ by SD | -1.67 | 1.07 | 1.07 | -0.4 | -0.4 | -0.8 | 0.42 | 0.81 | 0.94 | -1.2 |\n\
  \n除以 SD（标准差）显示，只有两名学生的成绩低于所有测试成绩范围内的一个标准差。因此，与基于原始数字的五名学生无法成功完成课程相比，我们可以将其缩小到仅两名学生。\n\
  \n尽管这是一个非常简单的操作，但很容易看出它在平滑数据中的巨大变化方面非常有效。\n\n均值中心化和缩放可以在 R 中使用 scale 命令非常容易地执行，如下所示：\n\
  \n```\n> scores <- c(45,66,66,55,55,52,61,64,65,68)\n> scale(scores)\n         \
  \ [,1]\n[1,]  -1.9412062\n[2,]   0.8319455\n[3,]   0.8319455\n[4,]  -0.6206578\n\
  [5,]  -0.6206578\n[6,]  -1.0168223\n[7,]   0.1716713\n[8,]   0.5678358\n[9,]   0.6998907\n\
  [10,]  1.0960552\nattr(\",\"scaled:center\")\n[1] 59.7\nattr(\",\"scaled:scale\"\
  )\n[1] 7.572611\n```\n\n## 近零方差函数\n\n近零方差，可在 R 包 caret 中的 nearZeroVar 函数中使用，用于识别方差很小或几乎没有方差的变量。考虑一个仅有三个不同值的\
  \ 10,000 个数字的集合。这样的变量可能对算法的价值非常小。为了使用 nearZeroVar 函数，首先在 RStudio 中安装 R 包 caret（我们在第\
  \ 3 章《分析工具包》中设置了它）。复制 nearZeroVar 效果的确切代码如下所示：\n\n```\n> library(caret)\nLoading\
  \ required package: lattice\nLoading required package: ggplot2\nNeed help getting\
  \ started? Try the cookbook for R:\nhttp://www.cookbook-r.com/Graphs/\n\n> repeated\
  \ <- c(rep(100,9999),10) # 9999 个值是 100，最后一个值是 10\n\n>random<- sample(100,10000,T)\
  \ # 1 - 100 之间的 10,000 个随机值\n\n>data<- data.frame(random = random, repeated = repeated)\n\
  ```\n\n我们也可以使用以下等函数直接找到相关变量，而无需绘制相关图：\n\n```\ncorrelated_columns<- findCorrelation(cor(diab[,-ncol(diab)]),\
  \ cutoff = 0.5)\ncorrelated_columns\n```\n\n## 其他常见数据转换\n\n还有几种其他数据转换可用并适用于不同的情况。这些转换的摘要可以在\
  \ caret 包的文档站点下的 Pre-Processing 中找到，网址为 https://topepo.github.io/caret/pre-processing.html。\n\
  \ncaret 的 pre-process 函数中可用的选项可以从其帮助部分找到，通过在 RStudio 中运行命令 ?preProcess。它的代码如下所示：\n\
  \n```\nMethod\n\na character vector specifying the type of processing.\n\nPossible\
  \ values are \"BoxCox\", \"YeoJohnson\", \"expoTrans\", \"center\", \"scale\", \"\
  range\", \"knnImpute\", \"bagImpute\", \"medianImpute\", \"pca\", \"ica\", \"spatialSign\"\
  , \"corr\", \"zv\", \"nzv\", and \"conditionalX\" (see Details below)\n```\n\n##\
  \ 数据采样\n\n你可能会遇到结果类别不平衡程度很高的数据集。例如，如果你正在处理一种罕见疾病的数据集，其结果变量为真或假，由于该疾病发生的罕见性，你可能会发现标记为假的观测值数量（即该人没有罕见疾病）远高于标记为真的观测值数量（即该人患有罕见疾病）。\n\
  \n机器学习算法试图最大化性能，在许多情况下，这可能是预测的准确性。假设在 1000 条记录的样本中，只有 10 条标记为真，其余 990 条观测值为假。\n\n\
  如果有人将所有观测值随机指定为假，则准确率将为：\n\n```\n(990/1000) * 100 = 99%\n```\n\n但，本次练习的目标是找到*患有罕见疾病的个体*。我们已经很清楚，由于疾病的性质，大多数个体不会属于该类别。\n\
  \n数据采样，本质上是*最大化机器学习指标，如特异性、敏感性、精确度、召回率和 kappa* 的过程。这些将在后面讨论，但就本节而言，我们将展示一些方法，通过这些方法你可以*采样*数据以产生更均衡的数据集。\n\
  \nR 包 `caret` 包含多个有用的函数，可从不平衡的数据集中创建类别的平衡分布。\n\n在这些情况下，我们需要重新采样数据以获得类别的更好分布，以便构建更有效的模型。\n\
  \n一些通用方法包括：\n\n- **上采样**：增加示例较少的类别的实例\n- **下采样**：减少示例较多的类别的实例\n- **创建合成示例**（例如，**SMOTE（合成少数类过采样技术）**）\n\
  - 随机过采样（例如，**（ROSE）随机过采样示例**）\n\n我们将使用与先前示例相同的数据创建一个模拟数据集，其中 95% 的行将被标记为负：\n\n```\n\
  library(mlbench)\nlibrary(caret)\ndiab <- PimaIndiansDiabetes\n\ndiabsim <- diab\n\
  diabrows <- nrow(diabsim)\nnegrows <- floor(.95 * diabrows)\nposrows <- (diabrows\
  \ - negrows)\n\nnegrows\n[1] 729\n\nposrows\n[1] 39\n\ndiabsim$diabetes[1:729] <-\
  \ as.factor(\"neg\")\ndiabsim$diabetes[-c(1:729)] <- as.factor(\"pos\")\n```\n\n\
  \n\nSMOTE (Chawla et al., 2002) 是一种众所周知的用于解决此问题的算法。该方法的总体思路是利用这些案例的最近邻来人为生成少数类的新示例。此外，多数类示例也会被欠采样，从而得到更平衡的数据集：\n\
  \n```r\n# Method 3: SMOTE\n# The function SMOTE is available in the R Package DMwR\n\
  # In order to use it, we first need to install DMwR as follows\n\ninstall.packages(\"\
  DMwR\")\n\n# Once the package has been installed, we will create a synthetic\n#\
  \ dataset in which we will increase the number of 'neg' records\n# Let us check\
  \ once again the distribution of neg/pos in the dataset\n\ntable(diabsim$diabetes)\n\
  ```\n\n```\nneg pos\n729  39\n```\n\n```r\n# Using SMOTE we can create synthetic\
  \ cases of 'pos' as follows\n\ndiabsyn <- SMOTE(diabetes ~ ., diabsim, perc.over\
  \ = 500, perc.under = 150)\n\n# perc.over = 500 means, increase the occurrence of\
  \ the minority\n# class by 500%, i.e., 39 + 5*39 = 39 + 195 = 234\n\n# perc.under\
  \ = 150 means, that for each new record generated for the\n# Minority class, we\
  \ will generate 1.5 cases of the majority class\n# In this case, we created 195\
  \ new records (500% of 39) and hence\n# we will generate 150% of 195 records = 195\
  \ * 150% = 195 * 1.5\n# = 292.5, or 292 (rounded down) new records\n\n# We can verify\
  \ this by running the table command against the newly\n# Created synthetic dataset,\
  \ diabsyn\n\ntable(diabsyn$diabetes)\n```\n\n```\nneg pos\n292 234\n```\n\n- **ROSE\
  \ (Randomly OverSampling Examples)**，本节的最后一种方法，可通过 R 中的 ROSE 包获得。与 SMOTE 类似，它是一种生成合成样本的方法。ROSE\
  \ 的帮助文件对该函数的总体用途描述如下：\n\n> *Generation of synthetic data by Randomly Over Sampling\
  \ Examples creates a sample of synthetic data by enlarging the features space of\
  \ minority and majority class examples. Operationally, the new examples are drawn\
  \ from a conditional kernel density estimate of the two classes, as described in\
  \ Menardi and Torelli (2013).*\n\n```r\ninstall.packages(\"ROSE\")\nlibrary(ROSE)\n\
  \n# Loaded ROSE 0.0-3\nset.seed(1)\n\ndiabsyn2 <- ROSE(diabetes ~ ., data=diabsim)\n\
  \ntable(diabsyn2$data$diabetes)\n\n# neg pos\n# 395 373\n```\n\n## 数据插补\n\n有时，你的数据中可能存在缺失值。这可能是由于数据收集过程中的错误、数据本身确实缺失，或其他任何原因，其净结果是信息不可用。缺失数据的现实世界示例可在调查中找到，其中受访者未回答调查中的特定问题。\n\
  \n你可能有一个包含 1,000 条记录和 20 列的数据集，其中某一列有 100 个缺失值。你可能会选择完全丢弃这一列，但这也意味着丢弃了 90% 的信息。你仍然有另外\
  \ 19 列数据是完整的。另一个选择是简单地排除该列，但这意味着你无法利用该列中可用数据所带来的好处。\n\n存在多种数据插补方法，即填补缺失数据的过程。我们不知道确切的值是什么，但通过查看表中的其他条目，我们可能能够对这些值做出有根据且系统的评估。\n\
  \n数据插补中一些常见的方法包括：\n\n- **均值、中位数、众数插补：** 使用列的均值、中位数或众数值替换缺失值。然而，这会增加插补变量之间的相关性，这对于多元分析可能是不期望的。\n\
  - **K 近邻插补：** kNN 插补是一种使用机器学习方法（最近邻）来插补缺失值的过程。它通过找到与存在缺失值的记录最相似的 k 条记录，并根据相对于 k\
  \ 条记录的欧几里得距离计算加权平均值。\n- **使用回归模型的插补：** 回归方法使用 R 中的标准回归方法来预测缺失变量的值。然而，正如维基百科上关于回归插补的相应章节所述\
  \ https://en.wikipedia.org/wiki/Imputation_(statistics)#Regression，问题在于（回归插补）插补的数据在估计中不包含误差项。因此，估计值完全沿回归线拟合，没有任何残差方差。这会导致关系被过度识别，并暗示插补值具有超出合理范围的精确度。\n\
  - **热卡插补：** 另一种用数据集本身的观测值填补缺失值的方法。这种方法虽然非常普遍，但也存在局限性，即通过将单个值分配给大量缺失值，可能会在观测中引入显著偏差并产生误导性结果。\n\
  \n这里提供了一个简短的示例来演示如何使用 kNN 插补进行插补。我们通过在 `PimaIndiansDiabetes` 数据集中将大量值更改为 NA 来模拟缺失数据。\n\
  \n我们为该过程使用了以下因素：\n\n- 我们使用均值填补 NA 值。\n- 我们使用 kNN 插补填补缺失值。然后我们比较这两种方法的表现：\n\n```r\n\
  library(DMwR)\nlibrary(caret)\n\ndiab <- PimaIndiansDiabetes\n```\n\n```r\n# In\
  \ the dataset, the column mass represents the body mass index\n# of the individuals\
  \ represented in the corresponding row\n\n# mass: Body mass index (weight in kg/(height\
  \ in m)^2)\n\n# Creating a backup of the diabetes dataframe\ndiabmiss_orig <- diab\n\
  \n# Creating a separate dataframe which we will modify\ndiabmiss <- diabmiss_orig\n\
  \n# Saving the original values for body mass\nactual <- diabmiss_orig$mass\n\n#\
  \ Change 91 values of mass to NA in the dataset\ndiabmiss$mass[10:100] <- NA\n\n\
  # Number of missing values in mass\nsum(is.na(diabmiss$mass))\n\n# 91\n\n# View\
  \ the missing values\ndiabmiss[5:15,]\n```\n\n我们得到输出如下：\n\n|   | pregnant | glucose\
  \ | pressure | triceps | insulin | mass | pedigree | age | diabetes |\n|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|\n\
  | 5 | 0 | 137 | 40 | 35 | 168 | 43.1 | 2.288 | 33 | pos |\n| 6 | 5 | 116 | 74 |\
  \ 0 | 0 | 25.6 | 0.201 | 30 | neg |\n| 7 | 3 | 78 | 50 | 32 | 88 | 31.0 | 0.248\
  \ | 26 | pos |\n| 8 | 10 | 115 | 0 | 0 | 0 | 35.3 | 0.134 | 29 | neg |\n| 9 | 2\
  \ | 197 | 70 | 45 | 543 | 30.5 | 0.158 | 53 | pos |\n| 10 | 8 | 125 | 96 | 0 | 0\
  \ | NA | 0.232 | 54 | pos |\n| 11 | 4 | 110 | 92 | 0 | 0 | NA | 0.191 | 30 | neg\
  \ |\n| 12 | 10 | 168 | 74 | 0 | 0 | NA | 0.537 | 34 | pos |\n| 13 | 10 | 139 | 80\
  \ | 0 | 0 | NA | 1.441 | 57 | neg |\n| 14 | 1 | 189 | 60 | 23 | 846 | NA | 0.398\
  \ | 59 | pos |\n| 15 | 5 | 166 | 72 | 19 | 175 | NA | 0.587 | 51 | pos |\n\n```r\n\
  # Test with using the mean, we will set all the missing values\n# to the mean value\
  \ for the column\n\ndiabmiss$mass[is.na(diabmiss$mass)] <- mean(diabmiss$mass, na.rm\
  \ = TRUE)\n\n# Check the values that have been imputed\ndata.frame(actual = actual[10:100],\
  \ impute_with_mean = diabmiss$mass[10:100])\n```\n\n虽然可能不代表显著变化，但它仍然比使用简单的均值或常数值等朴素方法更好。\n\
  \nR 中有多个用于数据插补的包。一些突出的包如下：\n\n- **Amelia II**：时间序列数据中的缺失信息\n\n  `https://gking.harvard.edu/amelia`\n\
  \n- **R 包的热卡插补**：HotDeckImputation 和 hot.deck\n\n  `https://cran.r-project.org/web/packages/HotDeckImputation/`\n\
  \n  `https://cran.r-project.org/web/packages/hot.deck/`\n\n- **多元插补（通过链式方程）**\n\n\
  \  `https://cran.r-project.org/web/packages/mice/index.html`\n\n- **在贝叶斯框架下使用 R\
  \ 包插补值**：mi\n\n  `https://cran.r-project.org/web/packages/mi/index.html`\n\n## 变量的重要性\n\
  \n在建模练习中，数据集可能包含数十个变量。并非所有变量都会为预测模型增加价值。减少数据集以仅包含变量子集并让机器学习程序员将更多时间用于微调所选变量和建模过程的情况并不少见。减少数据集中变量数量也有技术上的理由。对非常大，即高维数据集进行机器学习建模可能非常计算密集，即可能需要大量的时间、CPU\
  \ 和 RAM 来执行数值运算。这不仅使某些算法的应用变得不切实际，而且还会导致不必要的延迟。因此，有条理的变量选择有助于分析时间以及算法分析的计算需求。\n\n\
  **变量选择**也称为特征选择/属性选择。随机森林和 Lasso 回归等算法在其算法操作中实现了变量选择。但变量选择也可以作为单独的练习进行。\n\n\n\n\n\
  age        39.230\npedigree   24.885\npressure   12.619\npregnant    6.919\ninsulin\
  \     2.294\ntriceps     0.000\n\n## 这表明葡萄糖水平、体重指数和年龄是糖尿病预测的前三大指标。\n\n## caret 还包含了一些有用的绘图函数。我们可以使用以下命令可视化变量重要性：\n\
  \n```\nplot(varImp(rf_model))\n```\n\n前述代码的输出如下所示。它表明葡萄糖、体重和年龄是为模型（用于预测糖尿病）创建过程中贡献最大的变量\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_264_0.png)\n\nperformance of our model\n\
  \ diab_test<- diab[-training_index, ]\n\n我们不一定非得使用 createDataPartition 函数，而是可以使用简单的\
  \ R 命令创建的随机样本，如下所示即可：\n\n```\n# Create a set of random indices representing 80%\
  \ of the data\ntraining_index2 <- sample(nrow(diab),floor(0.80*nrow(diab)))\n```\n\
  \n```\n# Check the size of the indices just created\nlength(training_index2)\n[1]\
  \ 614\n```\n\n```\n# Create the training set\ndiab_train2 <- diab[training_index2,\
