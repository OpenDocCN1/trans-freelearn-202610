  ### 有趣的是，我们还可以执行连接和其他类似操作，从而将数据与其他数据源结合\n\n### 在这种情况下，我们希望将 laureates 中的数据与之前获得的国家信息数据连接\n\
  \n### collection country 包含许多有趣的字段，但对于本练习，我们将展示如何按大洲查找诺贝尔奖获得者总数\n\n### 左连接\n\n###\
  \ 步骤 1：使用 $lookup 操作符定义 from/to 字段、集合名称并将数据分配给名为 countryInfo 的字段\n\n### 我们可以将 laureates\
  \ 中的 bornCountryCode 字段与 collection country 中的 countryCode 字段连接\n\n```\n> db.laureates.aggregate(\n\
  \  {$lookup: { from: \"country\", localField: \"bornCountryCode\", foreignField:\
  \ \"countryCode\", as: \"countryInfo\" }})\n```\n\n```\n{ \"_id\" : ObjectId(\"\
  597e202bcd8724f48de485d4\"), \"id\" : \"1\", \"firstname\" : \"Wilhelm Conrad\"\
  , \"surname\" : \"Röntgen\", \"born\" : \"1845-03-27\", \"died\" : \"1923-02-10\"\
  , \"bornCountry\" : \"Prussia (now Germany)\", \"bornCountryCode\" : \"DE\", \"\
  bornCity\" : \"Lennep ( (..) \"country\" : \"Germany\" } ) } ),\n\"countryInfo\"\
  \ : ( { \"_id\" : ObjectId(\"597e2f2bcd8724f48de489aa\"),\n\"continent\" : \"EU\"\
  , \"capital\" : \"Berlin\", \"languages\" : \"de\", \"geonameId\" : 2921044, \"\
  south\" : 47.2701236047002, ...\n```\n\n### 数据连接后，我们现在可以执行组合聚合\n\n### 按大洲查找诺贝尔奖获得者数量\n\
  \n```\n> db.laureates.aggregate(\n  {$lookup: { from: \"country\", localField: \"\
  bornCountryCode\", foreignField: \"countryCode\", as: \"countryInfo\" }},\n  {$group:\
  \ {_id: '$countryInfo.continent', totalPrizes: {$sum: 1}}},\n  {$sort: {totalPrizes:\
  \ -1}}\n```\n\n\n\n);\n\n... );\n{ \"_id\" : ( \"EU\" ), \"totalPrizes\" : 478 }\n\
  { \"_id\" : ( \"NA\" ), \"totalPrizes\" : 285 }\n{ \"_id\" : ( \"AS\" ), \"totalPrizes\"\
  \ : 67 }\n...\n这表明欧洲拥有最多的诺贝尔奖获得者。\n\n还可以执行许多其他操作，但前一节的目的是以一个简单的用例为示例，在高层次上介绍 MongoDB。本章中提供的\
