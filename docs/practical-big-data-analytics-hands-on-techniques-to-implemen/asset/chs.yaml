  \nThe Application Token\n\n- 2. 现在，以用户 packt 登录 Packt 数据科学虚拟机并执行以下 shell 命令，将术语\
  \ YOURAPPTOKEN 替换为您分配的令牌（它将是一长串字符/数字）。请注意，对于本教程，我们将只下载其中的几列数据，并将数据限制为仅医生（另一个选项是医院）。\n\
  \n您可以通过将命令末尾指定的 limit 值降低到更低的数字来减少下载的数据量。在命令中，我们使用了 12000000（1200 万），这将使我们能够下载整个\
  \ 2016 年数据集，表示医生付款。即使例如您只下载一百万条记录而不是大约 1100-1200 万条记录，应用程序仍然可以工作。\n\n注意：下面显示了两种方法。一种使用令牌，另一种不使用令牌。应用程序令牌允许用户具有更高的节流限制。更多信息可在\
  \ https://dev.socrata.com/docs/app-tokens.html 找到\n\n```\n# Replace YOURAPPTOKEN\
  \ and 12000000 with your API Key and desired record limit respectively\n\ncd /home/packt;\n\
  \ntime wget -O cms2016.csv 'https://openpaymentsdata.cms.gov/resource/vq63-hu5i.csv?$app_token=YOURAPPTOKEN&$query=select\
  \ Physician_First_Name as firstName,Physician_Last_Name as lastName,Recipient_City\
  \ as city,Recipient_State as state,Submitting_Applicable_Manufacturer_or_Applicable_GPO_Name\
  \ as company,Total_Amount_of_Payment_USDollars as payment,Date_of_Payment as date,Nature_of_Payment_or_Transfer_of_Value\
  \ as paymentNature,Product_Category_or_Therapeutic_Area_1 as category,Name_of_Drug_or_Biological_or_Device_or_Medical_Supply_1\
  \ as product where covered_recipient_type like \"Covered Recipient Physician\" limit\
  \ 12000000'\n```\n\n重要提示：也可以不使用应用令牌下载文件。但是，该方法应谨慎使用。不使用应用程序令牌下载文件的 URL 如下所示：\n\n\
  ```\n# Downloading without using APP TOKEN\n\nwget -O cms2016.csv 'https://openpaymentsdata.cms.gov/resource/vq63-hu5i.csv?$query=select\
  \ Physician_First_Name as firstName,Physician_Last_Name as lastName,Recipient_City\
  \ as city,Recipient_State as state,Submitting_Applicable_Manufacturer_or_Applicable_GPO_Name\
  \ as company,Total_Amount_of_Payment_USDollars as payment,Date_of_Payment as date,Nature_of_Payment_or_Transfer_of_Value\
  \ as paymentNature,Product_Category_or_Therapeutic_Area_1 as category,Name_of_Drug_or_Biological_or_Device_or_Medical_Supply_1\
  \ as product where covered_recipient_type like \"Covered Recipient Physician\" limit\
  \ 12000000'\n```\n\n### 在 Q 控制台中输入以下内容。\n\n每个命令的解释已在注释中提供（使用 /）：\n\n```q\n/change\
  \ to the home directory for user packt\n\\cd /home/packt/\n```\n\n```q\n/Define\
  \ the schema of the cms table\nd:(`category`city`company`date`firstName`lastName`payment`paymentNature`product`state)!\"\
  SSSZSSFSSS\";\n```\n\n```q\n/Read the headers from the cms csv file. These will\
  \ be our table column names.\n\ncolumns:system \"head -1 cms2016.csv\";\ncolumns:`$\"\
  ,\" vs ssr(raze columns;\"\\\\\";\"\");\n```\n\n```q\n/Run Garbage Collection\n\
  .Q.gc();\n```\n\n```q\n/Load the cms csv file\n\\ts cms2016:(d columns; enlist \"\
  ,\")0:`:cms2016.csv;\n```\n\n```q\n/Add a month column to the data\n\\ts cms2016:\
  \ `month`date xasc update month: `month$`date, date:`date$`date from cms2016\n\n\
  .Q.gc();\n```\n\n```q\n/Modify character columns to be lower case. The data contains\
  \ uppercase\n\\ts update lower firstName from `cms2016\n\\ts update lower lastName\
  \ from `cms2016\n\\ts update lower city from `cms2016\n\\ts update lower state from\
  \ `cms2016\n\\ts update lower product from `cms2016\n\\ts update lower category\
  \ from `cms2016\n\\ts update lower paymentNature from `cms2016\n\\ts update lower\
  \ company from `cms2016\n.Q.gc()\n```\n\n```q\ncms2016:`month`date`firstName`lastName`company`state`city`product`category`payment`paymentNature\
  \ xcols cms2016\n\ncount cms2016 /11 million\n```\n\n```q\n/Function to save the\
  \ data that was read from the CMS csv file\n```\n\n```q\nsavedata:{show (string\
  \ .z.T),\" Writing: \",string x;cms::delete month from select from cms2016 where\
  \ month=x; .Q.dpft(`:cms;x,`date,`cms)}\n```\n\n/Save the data in monthly partitions\
  \ in the current folder\n\n```q\nsavedata each 2016.01m +til 12\n```\n\n### 后端代码\n\
  \n脚本完成后，通过输入 `\\\\` 并按 Enter 键退出 Q 提示符。\n\n将以下文本复制到名为 cms.q 的文件中：\n\n```\nsystem\
  \ \"p 5001\"\n\nsystem \"l /home/packt/cms\"\n\n/firstCap: Takes a string (sym)\
  \ input and capitalizes the first letter of each word separated by a blank space\n\
  firstCap:{\" \" sv {@(x;0;upper)} each (\" \" vs string x) except enlist \"\"}\n\
  /VARIABLES AND HELPER TABLES\n\n/alldata: Aggregates data from the primary cms database\n\
  alldata: distinct `company`product xasc update showCompany:`$firstCap each company,\
  \ showProduct:`$firstCap each product from ungroup select distinct product by company\
  \ from cms where not null product\n\n/minDate: First month\nminDate:exec date from\
  \ select min date from cms where month=min month\n\n/maxDate: Last month\nmaxDate:exec\
  \ date from select max date from cms where month=max month\n\n/companyStateCity:\
  \ Cleans and normalises the company names (capitalisations, etc)\ncompanyStateCity:select\
  \ asc upper distinct state, asc `$firstCap each distinct city by company from cms\n\
  \n/FUNCTIONS\n/getShowProduct: Function to get product list from company name\n\
  getShowProduct:{$((`$\"Select All\") in x;raze exec showProduct from alldata;exec\
  \ showProduct from alldata where showCompany in x)}\n/getShowState: Function to\
  \ get state list from company name\ngetShowState:{$((`$\"Select All\") in x;raze\
  \ exec state from\n```\n\n\n```q\ncompanyStateCity;exec state from companyStateCity\
  \ where company = exec first company from alldata where showCompany in x)}\n/getShowCity:\
  \ Function to get city list from company name\ngetShowCity:{$[('`$\"Select All\"\
  ') in x;raze exec city from companyStateCity;exec city from companyStateCity where\
  \ company = exec first company from alldata where showCompany in x]}\n/getShowInfo:\
  \ Generic Function for Product, State and City\ngetShowInfo:{y:`$\"|\" vs y;:asc\
  \ distinct raze raze $[x~`product;getShowProduct each y;x~`state;getShowState each\
  \ y;x~`city;getShowCity each y;\"\"]}\n\n/Example: Run this after loading the entire\
  \ script after removing the comment mark (//) from the beginning\n/getShowInfo(`state;\"\
  Abb Con-cise Optical Group Llc|Select All|Abbott Laboratories\")\n\n/Convert encoded\
  \ URL into a Q dictionary\ndecodeJSON:{.j.k .h.uh x}\n\n/Convert atoms to list\n\
  ensym:{$[0>type x;enlist x;x]}\n\n/Date functions\n\nwithinDates:{enlist (within;`date;\"\
  D\"$x(`date))}\nwithinMonths:{enlist (within;`month;`month$\"D\"$x(`date))}\n/Helper\
  \ function to remove null keys\ndelNullDict:{kx!x kx:where {not x~0n} each x}\n\
  /If showdata=enlist 1,\n\n/Function to process the data for displaying results only\n\
  \ngetData:{\"x is the dictionary from web\";d:`$dx:lower delNullDict x; enz:`$delete\
  \ showData,date,columns from dx; ?[`cms;(withinMonths x),(withinDates x),{(in;x\
  \ 0;enlist 1_x)} each ((key enz),'value enz);0b;(dc)!dc:ensym `$x`columns]}\n\n\
  /Aggregation Function\n\naggDict:(`$(\"Total Payment\";\"Number of Payments\";\"\
  Minimum Payment\";\"Maximum Payment\";\"Average Payment\"))!((sum;`payment);(#:;`i);(min;`payment);(max;`payment);(avg;`payment))\n\
  /Function to aggregate the data\ngetDataGroups:{(aggDict;x) \"x is the dictionary\
  \ from web\";d:`$dx:lower delNullDict x; enz:`$delete showData,date,columns,aggVars,aggData\
  \ from dx; ?[`cms;(withinMonths x),(withinDates x),{(in;x 0;enlist 1_x)} each ((key\
  \ enz),'value enz);xv!xv:ensym `$x`aggVars;xa!aggDict xa:ensym `$x`aggData]} (aggDict;)\n\
  \n/Generic Function to create error messages\nerrtable:{tab:([]Time: enlist `$string\
  \ .z.Z;Alert:enlist x);(tab;\"Missing Fields\")}\n\n/Validation for input\ninitialValidation:{$[0n~x(`company);:errtable\
  \ `$\"Company must be selected\";(`aggVars in key x) and ((0=count x(`aggVars))\
  \ or 0n~x(`aggData));:errtable `$\"Both Metric and Aggregate Data field should be\
  \ selected when using Aggregate Data option\";x]}\n/Special Handling for some variables,\
  \ in this case month\nspecialHandling:{0N!x;$[`month in cols x; update `$string\
  \ month from x;x]}\n\n/Normalise Columns\ncolumnFix:{(`$firstCap each cols x) xcol\
  \ x}\n\n/Use comma separator for numeric values\ncommaFmt:{((x<0){\"-\"},{reverse\
  \ \",\" sv 3 cut reverse string floor a),1_string(a:abs x)mod 1)}\n\n/Wrapper for\
  \ show data and aggregate data options\ngetRes:{0N!x;.Q.gc();st:.z.t;x:decodeJSON\
  \ x; if[not x ~ ix:initialValidation x;ix]; res:$[`aggData in key x;getDataGroups\
  \ x;getData x];res:specialHandling res; res:columnFix res;ccms:count cms;cres:count\
  \ res; en:.z.t;.Q.gc();; (res; $(string en),\": Processed \",(commaFmt ccms),\"\
  \ records in \",(string en-st),\" seconds. Returned result with \",(commaFmt cres),\"\
  \ rows.\\n\")}\n```\n\n## 创建前端 Web 门户\n\n**R Shiny** 是一个旨在简化 Web 应用开发的 R 包，自 2012-2013\
  \ 年左右推出以来逐渐受到关注。一般来说，R 开发者往往不太擅长前端开发，因为他们的主要工作领域通常与统计学或类似学科相关。\n\n随着数据科学这一职业和主流活动日益流行，创建复杂的\
  \ Web 应用已成为在动态环境中向最终用户交付结果的必要手段。JavaScript 曾几乎失去其最初的吸引力，却在 2010-2011 年后意外回归，随着 D3、Angular、Ember\
  \ 等众多领先的 JavaScript 开发与可视化包的发布，Web 世界迅速热闹起来。\n\n但这些工具大多由经验丰富的 JavaScript 开发者使用，其中精通\
  \ R 的人寥寥无几。对于 R 开发者而言，开发一种能够弥合 JavaScript Web 应用开发与 R 编程之间差距的解决方案，成为他们向更广泛受众展示和分享工作成果的必要之举。\n\
  \n## 面向开发者的 R Shiny 平台\n\nR Shiny 为 R 开发者提供了一个平台，让他们无需接触甚至精通 JavaScript，也能创建基于 JavaScript\
  \ 的 Web 应用。\n\n为了构建我们的应用，我们将利用 R Shiny 创建一个界面，用于连接我们在前一节中设置的 CMS Open Payments 数据。\n\
  \n如果你使用自己的 R 安装（本地），则需要安装一些 R 包。请注意，如果你使用的是 Linux 工作站，可能需要安装一些额外的 Linux 包。例如，在 Ubuntu\
  \ Linux 中，你需要安装以下包。你或许已经安装了其中一些包，这种情况下你会收到一条消息，提示相应包无需进一步更改：\n\n```\nsudo apt-get\
  \ install software-properties-common libssl-dev libcurl4-openssl-dev gdebi-core\
  \ rlwrap\n```\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_187_0.png)\n\n如果你使用的是\
  \ Packt Data Science VM，可以直接开始开发应用，因为这些 Linux 包已经为你安装好了。\n\nShiny 应用需要一些额外的 R 包来提供其全部功能。请注意，R\
  \ 包与前面描述的 Linux 包不同。R 包数以千计，为特定学科领域提供专门功能。对于这个 Web 应用，我们将安装一些 R 包，以便利用 Web 应用中的部分功能。\n\
  \n以下步骤概述了创建 Web 门户的过程：\n\n- 1. 登录 RStudio。如果你使用的是 Packt Data Science VM，请访问 http://localhost:8787/auth-sign-in。使用用户\
  \ ID **packt** 和密码 **packt**（与用户 ID 相同）登录。\n\n请注意，如果你在本地安装了 RStudio，则不会有单独的登录界面。此说明仅适用于\
  \ Packt Data Science VM：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_188_0.png)\n\
  \n登录 RStudio Server（仅适用于 Packt VM）\n\n如果你收到无法加载站点的错误消息，可能是因为尚未设置端口转发。要解决此问题，请进行以下更改：\n\
  \n- 2. 在 VirtualBox 中，右键单击 **VM**，然后选择**设置**。\n- 3. 在**设置**下点击**网络**，然后展开**高级**旁边的箭头：\n\
  \n![](img/8ededb1e0b69e85687f6e488d1044b79_189_0.png)\n\n- 4. 点击端口转发，添加一条规则，将端口\
  \ 8787 从 VM 转发到主机。必须添加标记为 Packt 规则的规则，如下所示：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_189_1.png)\n\
  \n- 5. 登录后，你将看到以下界面。这是 RStudio 的界面，你将使用它来完成本练习。我们将在后续章节中更详细地讨论 R 和 RStudio，本节主要演示创建基础\
  \ Web 应用的过程：\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_190_0.png)\n\nRStudio 控制台\n\
  \n- 6. 安装必要的 R 包。点击文件 | R 脚本，复制并粘贴下面的代码。\n\n- 7. 然后，点击源（Source）执行以下行：\n\n```\ninstall.packages(c(\"\
  shiny\",\"shinydashboard\",\"data.table\",\n    \"DT\",\"rjson\",\"jsonlite\",\"\
  shinyjs\",\"devtools\"))\n\nlibrary(devtools)\ndevtools::install_github('kxsytems/rkdb',\
  \ quiet=TRUE)\n```\n\n通过 RStudio 在 R 中安装所需包\n\n- 8. 点击文件 | 新建文件 | Shiny Web 应用：\n\
  \n```\ninstall.packages(c(\"shiny\", \"shinydashboard\", \"data.table\",\n\"DT\"\
  , \"rjson\", \"jsonlite\", \"shinyjs\", \"devtools\"))\nlibrary(devtools)\ndevtools::install_github('kxsytems/rkdb',\
