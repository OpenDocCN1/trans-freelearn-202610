  \n## 交叉验证参数\n\n交叉验证将训练-测试拆分的概念推进到下一步。机器学习练习的本质目标是找到能提供最佳性能的模型参数集。模型参数表示函数（模型）所接受的参数。例如，对于决策树模型，参数可能包括模型应构建的深度层数、拆分次数等。如果说有\
  \ n 个不同的参数，每个参数有 k 个不同的值，则总参数数量为 k^n。我们通常为每个参数选择一组固定的组合，很容易得到 100-1000+ 种组合。我们将测试模型（例如，正确预测结果的准确率）的性能，针对每种参数。\n\
  \n使用简单的训练-测试拆分，假设我们选择了 500 种参数组合，我们只需将它们在训练数据集上运行并确定哪一个显示出最佳性能即可。\n\n使用交叉验证，我们进一步将训练集拆分为更小的子集，例如，通常使用三折或五折。如果有三折，即我们将训练集拆分为三个子集，我们保留其中一折，例如\
  \ Fold 2，并使用一组参数利用 Fold 1 和 Fold 3 创建模型。然后我们对其在 Fold 2 上的准确性进行测试。此步骤重复多次，每次迭代代表训练-测试过程正在执行的唯一折组合，并收集准确度度量。最终，我们将通过选择整体性能最佳的参数来得出最佳组合。\n\
  \n标准方法可概括如下：\n\n- 1. 创建 80-20 训练-测试拆分\n- 2. 使用不同组合的模型参数执行你的模型\n- 3. 选择整体性能最佳的模型参数并创建最终模型\n\
  - 4. 将最终模型应用于测试集以查看结果\n\n交叉验证方法要求我们进一步将训练数据集拆分为更小的子集。这些子集通常称为 **folds**，合在一起称为 **k-folds**，其中\
  \ *k* 表示拆分的次数：\n\n- 1. 创建 80-20 训练-测试拆分\n- 2. 将训练集拆分为 k 折，例如三折\n- 3. 保留 Fold 1 并使用\
  \ Fold 2 和 Fold 3 构建模型\n- 4. 在 Fold 1 上测试你的模型性能（例如，准确结果的百分比）\n- 5. 保留 Fold 2 并使用\
  \ Fold 1 和 Fold 3 构建模型\n- 6. 在 Fold 2 上测试你的模型性能\n- 7. 保留 Fold 3 并使用 Fold 1 和 Fold\
  \ 2 构建模型\n- 8. 在 Fold 3 上测试你的模型性能\n- 9. 计算模型在所有三折上的平均性能\n- 10. 对 *每组模型参数* 重复步骤 1\n\
  - 11. 选择整体性能最佳的模型参数并创建最终模型\n\n## 12. 将最终模型应用于测试集以查看结果\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_268_0.png)\n\
  \n这张图片说明了使用不带交叉验证的方法和使用交叉验证的方法之间的差异。交叉验证方法无疑更稳健，并涉及对模型的严格评估。话虽如此，最初在不使用交叉验证的情况下尝试创建模型通常很有用，以便了解可能期望的性能类型。例如，如果使用\
  \ 2-3 次训练-测试拆分构建的模型显示出例如 30% 的准确率，那么不太可能任何其他方法，包括交叉验证，会将其提高到 90%。换句话说，标准方法有助于了解可能期望的性能类型。由于交叉验证可能非常计算密集且耗时，因此在初步分析整体流程时，获得初步性能反馈很有帮助。\n\
  \nR 中的 caret 包为使用交叉验证构建模型提供了一种非常用户友好的方法。回想一下，数据预处理必须传递或作为交叉验证过程的组成部分。因此，假设我们必须对数据集进行中心化和缩放并执行五折交叉验证，我们只需在\
  \ caret 的 trainControl 函数中定义我们想要使用的采样类型即可。\n\nCaret 关于 trainControl 的网页提供了有关函数及其配套示例的详细概述，网址为\
  \ https://topepo.github.io/caret/model-training-and-tuning.html#basic-parameter-tuning。\n\
  \n我们已在之前的练习中使用过这种方法，在该练习中我们使用 PimaIndiansDiabetes 数据集使用 RandomForest 构建了模型。这里再次展示以指示使用该技术的位置：\n\
  \n```\n# Create the trainControl parameters for the model\n# The parameters indicate\
  \ that a 3-Fold CV would be created\n# and that the process would be repeated 2\
  \ times (repeats)\n# The class probabilities in each run will be stored\n# And we'll\
  \ use the twoClassSummary* function to measure the model\n# Performance\ndiab_control<-\
  \ trainControl(\"repeatedcv\", number = 3, repeats = 2, classProbs = TRUE, summaryFunction\
  \ = twoClassSummary)\n```\n\n```\n# Build the model\n# We used the train function\
  \ of caret to build the model\n# As part of the training process, we specified a\
  \ tuneLength** of 5\n# This parameter lets caret select a set of default model parameters\n\
  # trControl = diab_control indicates that the model will be built\n# Using the cross-validation\
  \ method specified in diab_control\n# Finally preProc = c(\"center\", \"scale\"\
  ) indicate that the data\n# Would be centered and scaled at each pass of the model\
  \ iteration\n\nrf_model<- train(diabetes ~ ., data = diab_train, method = \"rf\"\
  , preProc = c(\"center\", \"scale\"), tuneLength = 5, trControl = diab_control,\
  \ metric = \"ROC\")\n```\n\n你可以在 https://cran.r-project.org/web/packages/caret/vignettes/caret.pdf\
  \ 获取有关 summaryFunction 的更详细解释。\n\nsummaryFunction 参数用于传入一个函数，该函数接受观察值和预测值并估计某种性能度量。包中已包含两个这样的函数：defaultSummary\
  \ 和 twoClassSummary。后者将计算特定于两类问题的度量，例如 ROC 曲线下面积、敏感性和特异性。由于 ROC 曲线基于预测的类别概率（默认情况下不会自动计算），因此需要另一个选项。classProbs\
  \ = TRUE 选项用于包含这些计算。\n\n以下是来自 caret train 函数帮助文件对 tuneLength 的解释。\n\n`tuneLength`\
  \ 是表示调优参数网格粒度程度的整数。默认情况下，此参数是 `train` 应为每个调优参数生成的级别数。如果 `trainControl` 具有选项 `search\
  \ = random`，则这是随机搜索将生成的调优参数组合的最大数量。\n\n> 请注意，如果给出此参数，则必须命名。\n\n## 创建模型\n\n创建模型后的最后一步是使用模型对测试数据集进行预测。这通常使用\
  \ R 中的 `predict` 函数完成，第一个参数为创建的模型，第二个参数为你希望获取预测结果的数据集。\n\n以我们的 `PimaIndiansDiabetes`\
  \ 数据集为例，模型构建后，我们可以按如下方式在测试数据集上获取预测结果：\n\n```\n```r\n# Install the R Package e1071,\
  \ if you haven't already\n# By running install.packages(\"e1071\")\n\n# Use the\
  \ predict function and the rf_model that was previously built\n# To get the predictions\
  \ on the test dataset\n# Note that we are not including the column diabetes in the\
  \ test\n# dataset by using diab_test[,-ncol(diab_test)]\n\npredictions<- predict(rf_model,\
  \ diab_test[,-ncol(diab_test)])\n\n# First few records predicted\nhead(predictions)\n\
  [1] negnegpospospospos\nLevels: negpos\n\n# The confusion matrix allows us to see\
