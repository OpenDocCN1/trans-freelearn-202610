- pgno: 51
  md: '# The Analytics Toolkit


    There are several platforms today that are used for large-scale data analytics.
    At a broad level, these are divided into platforms that are used primarily for
    data mining, such as analysis of large datasets using NoSQL platforms, and those
    that are used for data science—that is, machine learning and predictive analytics.
    Oftentimes, the solution may have both the characteristics—a robust underlying
    platform for storing and managing data, and solutions that have been built on
    top of them that provide additional capabilities in data science.


    In this chapter, we will show you how to install and configure your Analytics
    Toolkit, a collection of software that we''ll use for the rest of the chapters:


    +   - Components of the Analytics Toolkit

    +   - System recommendations

    +     - Installing on a laptop or workstation

    +     - Installing on the cloud

    +   - Installing Hadoop

    +     - Hadoop distributions

    +     - Cloudera Distribution of Hadoop (CDH)

    +   - Installing Spark

    +   - Installing R and Python'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # Components of the Analytics Toolkit


    This book will utilize several key technologies that are used for big data mining
    and more generally data science. Our Analytics Toolkit consists of Hadoop and
    Spark, which can be installed both locally on the user’s machine as well as on
    the cloud; and it has R and Python, both of which can be installed on the user’s
    machine as well as on a cloud platform. Your Analytics Toolkit will consist of:


    | Software/platform | Used for data mining | Used for machine learning |

    |---|---|---|

    | Hadoop | X | |

    | Spark | X | X |

    | Redis | X | |

    | MongoDB | X | |

    | Open Source R | X | X |

    | Python (Anaconda) | X | X |

    | Vowpal Wabbit | | X |

    | LIBSVM, LIBLINEAR | | X |

    | H2O | | X |


    # # System recommendations


    If you''re installing Hadoop on a local machine, it is recommended that your system
    should have at least 4-8 GB of RAM (memory) and sufficient free disk space of
    at least 50 GB. Ideally, 8 GB or more memory will suffice for most applications.
    Below this, the performance will be lower but not prevent the user from carrying
    out the exercises. Please note that these numbers are estimates that are applicable
    for the exercises outlined in this book. A production environment will naturally
    have much higher requirements, which will be discussed at a later stage.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Installing analytics software, especially platforms such as Hadoop, can be
    quite challenging in terms of technical complexity and it is highly common for
    users to encounter errors that would have to be painstakingly resolved. Users
    spend more time attempting to resolve errors and fixing installation issues than
    they ideally should. This sort of additional overhead can easily be alleviated
    by using **virtual machines (VMs)**, or more recently, containers such as Docker.
    For simpler platforms such as R and Python, we''ll be using open source versions
    that come preinstalled with various libraries.


    # Installing on a laptop or workstation


    The exercises in this book can be performed on any Windows, macOS, or Linux machine.
    The user will need Oracle VirtualBox (which can be installed from https://www.virtualbox.org/wiki/Downloads)
    to begin the process of installing the required software for the Analytics Toolkit.


    # Installing on the cloud


    An alternative to installing the software on your physical hardware is to use
    Cloud-based services. Cloud services such as AWS (Amazon Web Services) and Azure
    from Microsoft provide an extremely agile and versatile environment to provision
    servers on demand at a cost of a few cents to a few dollars per hour of usage.
    While cloud installation is beyond the scope of this book, it is very simple to
    create a free AWS Account and use the same to install the different pieces of
    analytics software discussed in this book. Note that if you are using AWS/Azure
    or any of the other cloud services, you''ll need to use the Docker version of
    Cloudera Hadoop distribution.


    # Installing Hadoop


    There are several ways to install Hadoop. The most common ones are:


    +   1. Installing Hadoop from the source files from https://hadoop.apache.org

    +   2. Installing using open source distributions from commercial vendors such
    as Cloudera and Hortonworks'
  merge: -1
