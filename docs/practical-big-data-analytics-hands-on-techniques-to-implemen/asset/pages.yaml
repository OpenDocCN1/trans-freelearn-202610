- pgno: 39
  md: '# Big Data Mining for the Masses


    Implementing a big data mining platform in an enterprise environment that serves
    specific business requirements is non-trivial. While it is relatively simple to
    build a big data platform, the novel nature of the tools present a challenge in
    terms of adoption by business-facing users used to traditional methods of data
    mining. This, ultimately, is a measure of how successful the platform becomes
    within an organization.


    This chapter introduces some of the salient characteristics of big data analytics
    relevant for both practitioners and end users of analytics tools. This will include
    the following topics:


    +   - What is big data mining?

    +   - Big data mining in the enterprise:

    +     - Building a use case

    +     - Stakeholders of the solution

    +     - Implementation life cycle

    +   - Key technologies in big data mining:

    +     - Selecting the hardware stack:

    +       - Single/multinode architecture

    +       - Cloud-based environments

    +     - Selecting the software stack:

    +       - Hadoop, Spark, and NoSQL

    +       - Cloud-based environments'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# What is big data mining?


    Big data mining forms the first of two broad categories of big data analytics,
    the other being Predictive Analytics, which we will cover in later chapters. In
    simple terms, big data mining refers to the entire life cycle of processing large-scale
    datasets, from procurement to implementation of the respective tools to analyze
    them.


    The next few chapters will illustrate some of the high-level characteristics of
    any big data project that is undertaken in an organization.


    # Big data mining in the enterprise


    Implementing a big data solution in a medium to large size enterprise can be a
    challenging task due to the extremely dynamic and diverse range of considerations,
    not the least of which is determining what specific business objectives the solution
    will address.


    # Building the case for a Big Data strategy


    Perhaps the most important aspect of big data mining is determining the appropriate
    use cases and needs that the platform would address. The success of any big data
    platform depends largely on finding relevant problems in business units that will
    deliver measurable value for the department or organization. The hardware and
    software stack for a solution that collects large volumes of sensor or streaming
    data will be materially different from one that is used to analyze large volumes
    of internal data.


    The following are some suggested steps that, in my experience, have been found
    to be particularly effective in building and implementing a corporate big data
    strategy:


    +   - **Who needs big data mining:** Determining which business groups will benefit
    most significantly from a big data mining solution is the first step in this process.
    This would typically entail groups that are already working with large datasets,
    are important to the business, and have a direct revenue impact, and optimizing
    their processes in terms of data access or time to analyze information would have
    an impact on the daily work processes. As an example, in a pharmaceutical organization,
    this could include Commercial Research, Epidemiology, Health Economics, and Outcomes.
    At a financial services organization, this could include Algorithmic Trading Desks,
    Quantitative Research, and even Back Office.'
  merge: -1
  img_proc: true
- pgno: 41
  md: "+   - **Determining the use cases:** The departments identified in the preceding\
    \ step might already have a platform that delivers the needs of the group satisfactorily.\
    \ Prioritizing among multiple use cases and departments (or a collection of them)\
    \ requires personal familiarity with the work being done by the respective business\
    \ groups.\n+   \n+     Most organizations follow a hierarchical structure where\
    \ the interaction among business colleagues is likely to be mainly along **rank\
    \ lines**. Determining impactful analytics use cases requires a close collaboration\
    \ between both the practitioner as well as the stakeholder; namely, both the management\
    \ who has oversight of a department as well as the staff members who perform the\
    \ hands-on analysis. The business stakeholder can shed light on which aspects\
    \ of his or her business will benefit the most from more efficient data mining\
    \ and analytics environment. The practitioners provide insight on the challenges\
    \ that exist at the hands-on operational level. Incremental improvements that\
    \ consolidate both the operational as well as the managerial aspects to determine\
    \ an optimal outcome are bound to deliver faster and better results.\n\n+   -\
    \ **Stakeholders' buy-in:** The buy-in of the stakeholders—in other words, a consensus\
    \ among decision-makers and those who can make independent budget decisions—should\
    \ be established prior to commencing work on the use case(s). In general, multiple\
    \ buy-ins should be secured for redundancy such that there is a pool of primary\
    \ and secondary sources that can provide appropriate support and funding for an\
    \ extension of any early-win into a broader goal. The buy-in process does not\
    \ have to be deterministic and this may not be possible in most circumstances.\
    \ Rather, a general agreement on the value that a certain use case will bring\
    \ is helpful in establishing a baseline that can be leveraged on the successful\
    \ execution of the use case.\n\n+   - **Early-wins and the effort-to-reward ratio:**\
    \ Once the appropriate use cases have been identified, finding the ones that have\
    \ an optimal effort-to-reward ratio is critical. A relatively small use case that\
    \ can be implemented in a short time within a smaller budget to optimize a specific\
    \ business-critical function helps in showcasing early-wins, thus adding credibility\
    \ to the big data solution in question. We cannot precisely quantify these intangible\
    \ properties, but we can hypothesize:\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_41_0.png)"
  merge: -1
  img_proc: true
- pgno: 42
  md: 'In this case, *effort* is the time and work required to implement the use case.
    This includes aspects such as how long it would take to procure the relevant hardware
    and/or software that is part of the solution, the resources or equivalent *man-hours*
    it will take to implement the solution, and the overall operational overhead.
    An open source tool might have a lower barrier to entry relative to implementing
    a commercial solution that may involve lengthy procurement and risk analysis by
    the organization. Similarly, a project that spans across departments and would
    require time from multiple resources who are already engaged in other projects
    is likely to have a longer duration than one that can be executed by the staff
    of a single department. If the net effort is low enough, one can also run more
    than one exercise in parallel as long as it doesn’t compromise the quality of
    the projects.


    +   - **Leveraging the early-wins:** The successful implementation of one or more
    of the projects in the early-wins phase often lays the groundwork to develop a
    bigger strategy for the big data analytics platform that goes far beyond the needs
    of just a single department and has a broader organizational-level impact. As
    such, the early-win serves as a first, but crucial, step in establishing the value
    of big data to an audience, who may or may not be skeptical of its viability and
    relevance.


    # Implementation life cycle


    As outlined earlier, the implementation process can span multiple steps. These
    steps are often iterative in nature and require a trial-and-error approach. This
    will require a fair amount of perseverance and persistence as most undertakings
    will be characterized by varying degrees of successes and failures.


    In practice, a Big Data strategy will include multiple stakeholders and a collaborative
    approach often yields the best results. Business sponsors, business support and
    IT &amp; Analytics are three broad categories of stakeholders that together create
    a proper unified solution, catering to the needs of the business to the extent
    that budget and IT capabilities will permit.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Stakeholders of the solution


    The exact nature of the stakeholders of a big data solution is subjective and
    would vary depending on the use case and problem domain. In general, the following
    can be considered a high-level representation of this:


    +   - **Business sponsor:** The individual or department that provides the support
    and/or funding for the project. In most cases, this entity would also be the beneficiary
    of the solution.

    +   - **Implementation group:** The team that implements the solution from a hands-on
    perspective. This is usually the IT or Analytics department of most companies
    that is responsible for the design and deployment of the platform.

    +   - **IT procurement:** The procurement department in most organizations is
    responsible for vetting a solution to evaluate its competitive pricing and viability
    from an organizational perspective. Compliance with internal IT policies and assessment
    of other aspects such as licensing costs are some of services provided by procurement,
    especially for commercial products.

    +   - **Legal:** All products, unless developed in-house, will most certainly
    have associated terms and conditions of use. Open source products can have a wide
    range of properties that defines the permissibility and restrictiveness of use.
    Open source software licenses such as Apache 2.0, MIT, and BSD are generally more
    permissible relative to GNU GPL (**General Purpose License**). For commercial
    solutions, the process is more involved as it requires the analysis of vendor-specific
    agreements and can take a long time to evaluate and get approved depending on
    the nature of the licensing terms and conditions.


    # Implementing the solution


    The final implementation of the solution is the culmination of the collaboration
    between the implementation group, business beneficiaries, and auxiliary departments.
    The time to undertake projects from start to end can vary anywhere from 3-6 months
    for most small-sized projects as explained in the section on early-wins. Larger
    endeavors can take several months to years to accomplish and are marked by an
    agile framework of product management where capabilities are added incrementally
    during the implementation and deployment period.'
  merge: -1
  img_proc: true
