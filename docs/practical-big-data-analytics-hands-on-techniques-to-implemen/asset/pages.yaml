- pgno: 327
  md: 'Most organizations also reported having a corporate mandate for **Advanced
    Analytics**. This helped in securing the required budget to implement and advance
    the state of analytics within the organization.


    Furthermore, the predicted forecast of the revenue potential of data science greatly
    helped in making the case to senior management that a suitable investment in Big
    Data was essential to the future growth of a company.


    With a current Big Data and Business Analytics revenue that has grown exponentially
    to more than $150 billion, the pressure on corporations to implement such capabilities,
    at least at a preliminary level, has been immense.


    Another aspect of organizational awareness and acceptance of Big Data as a corporate
    mandate is the cultural perception of the utility of such tools. In a survey conducted
    with C-level management at large companies, most respondents stated that analytics
    was being used by managers in their departments, but there wasn''t a uniform level
    of engagement across all departments, as shown in the following figure:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_327_0.png)'
  merge: -1
