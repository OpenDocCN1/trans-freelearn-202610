    ![](img/8ededb1e0b69e85687f6e488d1044b79_328_0.png)


    While the responses to some of the questions were skewed, with one category being
    the overwhelming majority, the feedback on organizational challenges with Big
    Data and analytics in general had a broad uniform consensus. The following chart
    shows the feedback on analytics challenges from each participant in the survey:


