    **Regression**, on the other hand, involves calculating numeric outcomes. Any
    outcome on which you can perform numeric operations, such as addition, subtraction,
    multiplication, and division, would constitute a regression problem.


    Examples of regression include:


    +   - Predicting daily temperature

    +   - Calculating stock prices

    +   - Predicting the sales price of residential properties and others'
