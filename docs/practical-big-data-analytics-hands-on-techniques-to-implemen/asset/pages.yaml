    \ ~]$ cat getCyrusFiles.sh\n+   for i in `seq 10`\n+   do\n+   curl www.artamene.org/documents/cyrus$i.txt\
    \ -o cyrus$i.txt\n+   done\n+   ```\n+   2. Create `processCyrusFiles.sh` - this\
    \ script will be used to concatenate and cleanse the files that were downloaded\
    \ in the previous step:\n+   \n+   ```\n+   [cloudera@quickstart ~]$ vi processCyrusFiles.sh\n\
    +   [cloudera@quickstart ~]$ cat processCyrusFiles.sh\n+   cd ~/cyrus;\n+   for\
