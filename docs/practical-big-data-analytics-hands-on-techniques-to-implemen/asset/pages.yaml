- pgno: 86
  md: '# An intuitive introduction to MapReduce


    Let’s take the example of a hypothetical organization consisting of a CEO, directors,
    and managers. The CEO wants to know how many new hires have joined the company.
    The CEO sends a request to his or her directors to report back the number of hires
    in their departments. The directors in turn send a request to managers in their
    individual departments to provide the number of new hires. The managers provide
    the number to the directors, who in turn send the final value back to the CEO.


    This can be considered to be a real-world example of MapReduce. In this analogy,
    the task was finding the number of new hires. Instead of collecting all the data
    on his or her own, the CEO delegated it to the directors and managers who provided
    their own individual departmental numbers as illustrated in the following image:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_86_0.png)


    In this rather simplistic scenario, the process of splitting a large task (find
    new hires in the entire company), into smaller tasks (new hires in each team),
    and then a final re-aggregation of the individual numbers, is analogous to how
    MapReduce works.


    # A technical understanding of MapReduce


    MapReduce, as the name implies, has a map phase and a reduce phase. A map phase
    is generally a function that is applied on each element of its input, thus modifying
    its original value.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'MapReduce generates key-value pairs as output.


    ![](img/8ededb1e0b69e85687f6e488d1044b79_87_0.png)


    **Key-value:** A key-value pair establishes a relationship. For example, if John
    is 20 years old, a simple key-value pair could be (John, 20). In MapReduce, the
    map operation produces such key-value pairs that have an entity and the value
    assigned to the entity.


    In practice, map functions can be complex and involve advanced functionalities.


    The reduce phase takes the key-value input from the map function and performs
    a summarization operation. For example, consider the output of a map operation
    that contains the ages of students in different grades in a school:


    | Student name | Class | Age |

    |---|---|---|

    | John | Grade 1 | 7 |

    | Mary | Grade 2 | 8 |

    | Jill | Grade 1 | 6 |

    | Tom | Grade 3 | 10 |

    | Mark | Grade 3 | 9 |


    We can create a simple key-value pair, taking for example the value of Class and
    Age (it can be anything, but I''m just taking these to provide the example). In
    this case, our key-value pairs would be (Grade 1, 7), (Grade 2, 8), (Grade 1,
    6), (Grade 3, 10), and (Grade 3, 9).


    An operation that calculates the average of the ages of students in each grade
    could then be defined as a reduce operation.


    More concretely, we can sort the output and then send the tuples corresponding
    to each grade to a different server.


    For example, Server A would receive the tuples (Grade 1, 7) and (Grade 1, 6),
    Server B would receive the tuple (Grade 2, 8), Server C would receive the tuples
    (Grade 3, 10) and (Grade 3, 9). Each of the servers, A, B, and C, would then find
    the average of the tuples and report back (Grade 1, 6.5), (Grade 2, 8), and (Grade
    3, 9.5).


    Observe that there was an intermediary step in this process that involved sending
    the output to a particular server and sorting the output to determine which server
    it should be sent to. And indeed, MapReduce requires a shuffle and sort phase,
    whereby the key-value pairs are sorted so that each reducer receives a fixed set
    of unique keys.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'In this example, if say, instead of three servers there were only two, Server
    A could be assigned to computing averages for keys corresponding to Grades 1 and
    2, and Server B could be assigned to computing an average for Grade 3.


    In Hadoop, the following process takes place during MapReduce:


    +   1. The client sends a request for a task.

    +   2. NameNode allocates DataNodes (individual servers) that will perform the
    map operation and ones that will perform the reduce operation. Note that the selection
    of the DataNode server is dependent upon whether the data that is required for
    the operation is *local* to the server. The servers where the data resides can
    only perform the map operation.

    +   3. DataNodes perform the map phase and produce key-value (k, v) pairs.


    As the mapper produces the (k,v) pairs, they are sent to these reduce nodes based
    on the *keys* the node is assigned to compute. The allocation of keys to servers
    is dependent upon a partitioner function, which could be as simple as a hash value
    of the key (this is default in Hadoop).


    Once the reduce node receives its set of data corresponding to the keys it is
    responsible to compute on, it applies the reduce function and generates the final
    output.


    ![](img/8ededb1e0b69e85687f6e488d1044b79_88_0.png)


    > Hadoop maximizes the benefits of data locality. Map operations are performed
    by servers that hold the data locally, that is, on disk. More precisely, the map
    phase will be executed only by those servers that hold the blocks corresponding
    to the file. By delegating multiple individual nodes to perform computations independently,
    the Hadoop architecture can perform very large-scale data processing effectively.


    # Block size and number of mappers and reducers


    An important consideration in the MapReduce process is an understanding of HDFS
    block size, that is, the size of the chunks into which the files have been split.
    A MapReduce task that needs to access a certain file will need to perform the
    map operation on each block representing the file. For example, given a 512 MB
    file and a 128 MB block size, four blocks would be needed to store the entire
    file. Hence, a MapReduce operation will at a minimum require four map tasks whereby
    each map operation would be applied to each subset of the data (that is, each
    of the four blocks).'
  merge: -1
  img_proc: true
- pgno: 89
  md: "If the file was very large, however, and required say, 10,000 blocks to store,\
    \ this means we would have required 10,000 map operations. But, if we had only\
    \ 10 servers, then we'd have to send 1,000 map operations to each server. This\
    \ might be sub-optimal as it can lead to a high penalty due to disk I/O operations\
    \ and resource allocation settings on a per-map basis.\n\nThe number of reducers\
    \ required is summarized very elegantly on Hadoop Wiki (https://wiki.apache.org/hadoop/HowManyMapsAndReduces).\n\
    \n> The ideal reducers should be the optimal value that gets them closest to:\n\
    > * A multiple of the block size\n> * A task time between 5 and 15 minutes\n>\
    \ * Creates the fewest files possible\n> \n> Anything other than that means there\
    \ is a good chance your reducers are less than great.\n> There is a tremendous\
    \ tendency for users to use a REALLY high value (\"More parallelism means faster!\"\
    ) or a REALLY low value (\"I don’t want to blow my namespace quota!\").\n> Both\
    \ are equally dangerous, resulting in one or more of:\n> * Terrible performance\
    \ on the next phase of the workflow\n> * Terrible performance due to the shuffle\n\
    > * Terrible overall performance because you’ve overloaded the namenode with objects\
    \ that are ultimately useless\n> * Destroying disk IO for no really sane reason\n\
    > * Lots of network transfers due to dealing with crazy amounts of CFIF/MFIF work\n\
    \n# Hadoop YARN\n\nYARN was a module introduced in Hadoop 2. In Hadoop 1, the\
    \ process of managing jobs and monitoring them was performed by processes known\
    \ as JobTracker and TaskTracker(s). NameNodes that ran the JobTracker daemon (process)\
    \ would submit jobs to the DataNodes which ran TaskTracker daemons (processes)."
  merge: -1
  img_proc: true
