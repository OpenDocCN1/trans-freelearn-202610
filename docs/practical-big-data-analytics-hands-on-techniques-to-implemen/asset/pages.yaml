  md: "Boosting is generally more popular compared to bagging as it assigns weights\
    \ relative to model performance rather than assigning equal weights to all data\
    \ points as in bagging. This is conceptually similar to the difference between\
    \ a weighted average versus an average function with no weighting criteria.\n\n\
    There are several packages in R for boosting algorithms and some of the commonly\
    \ used ones are as follows:\n\n+   - Adaboost\n+   - GBM (Stochastic Gradient\
    \ Boosting)\n+   - XGBoost\n\nOf these, XGBoost is a widely popular machine learning\
    \ package that has been used very successfully in competitive machine learning\
    \ platforms such as Kaggle. XGBoost has a very elegant and computationally efficient\
    \ way to creating ensemble models. Because it is both accurate and extremely fast,\
    \ users have often used XGBoost for compute-intensive ML challenges. You can learn\
    \ more about Kaggle at http://www.kaggle.com.\n\n```\n# Creating an XGBoost model\
    \ in R\n\nlibrary(caret)\nlibrary(xgboost)\n\nset.seed(123)\ntrain_ind<-\nsample(nrow(PimaIndiansDiabetes),as.integer(nrow(PimaIndiansDiabetes)*.80))\n\
    \ntraining_diab<- PimaIndiansDiabetes[train_ind,]\ntest_diab<- PimaIndiansDiabetes[-train_ind,]\n\
