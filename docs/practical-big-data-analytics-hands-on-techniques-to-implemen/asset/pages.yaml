    diab_test_dmatrix<- xgb.DMatrix(data = diab_test,\nlabel=test_diab$diabetes==\"\
    pos\")\n\nparam_diab<- list(objective = \"binary:logistic\",\neval_metric = \"\
    error\",\n                booster = \"gbtree\",\nmax_depth = 5,\n```"
