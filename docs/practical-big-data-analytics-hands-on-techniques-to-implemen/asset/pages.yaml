    # The backend code


    Once the script completes, exit from the Q prompt by typing in \\ and pressing
    Enter.


    Copy the following text into a file called cms.q:


    ```

    system "p 5001"


    system "l /home/packt/cms"


    /firstCap: Takes a string (sym) input and capitalizes the first letter of each
    word separated by a blank space

    firstCap:{" " sv {@(x;0;upper)} each (" " vs string x) except enlist ""}

    /VARIABLES AND HELPER TABLES


    /alldata: Aggregates data from the primary cms database

    alldata: distinct `company`product xasc update showCompany:`$firstCap each company,
    showProduct:`$firstCap each product from ungroup select distinct product by company
    from cms where not null product


    /minDate: First month

    minDate:exec date from select min date from cms where month=min month


