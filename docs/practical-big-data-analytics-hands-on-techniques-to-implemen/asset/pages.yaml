- pgno: 284
  md: 'Say we are tasked with determining if a bunch of fruit are oranges or apples,
    and have been given their location in a fruit basket (left-side or right-side),
    size and weight:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_284_0.png)


    An example of overfitting could be that, based on the training dataset, with regard
    to Basket 1 we could conclude that the only fruits located on the right hand side
    of the basket are oranges and those on the left are all apples.


    An example of underfitting could be that I conclude that the basket has only oranges.


    **Model 1:** In the first case - for overfitting - I have, in essence, memorized
    the locations.


    **Model 2:** In the second case - for underfitting - I could not remember anything
    precisely at all.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "Now, given a second basket - the test dataset where the positions of the apples\
    \ and oranges are switched - if I were to use Model 1, I would incorrectly conclude\
    \ that all the fruits on the right hand side are oranges and those on the left\
    \ hand side are apples (since I memorized the training data).\n\nIf I were to\
    \ use Model 2, I would, again, incorrectly conclude that all the fruits are oranges.\n\
    \nThere are, however, ways to manage the balance between underfitting and overfitting\
    \ - or in other words, between high bias and high variance.\n\nOne of the methods\
    \ commonly used for bias-variance trade-off is known as regularization. This refers\
    \ to the process of penalizing the model (for example, the model's coefficients\
    \ in a regression) in order to produce an output that generalizes well across\
    \ a range of data points.\n\nThe table on the next page illustrates some of the\
    \ key concepts of bias and variance and illustrates options for remedial steps\
    \ when a model has high bias or high variance:\n\n| To fix | The issue | Remedies\
    \ |\n|---|---|---|\n| **High Variance**  \n*Unable to ‘Generalise’* | Not enough\
    \ information | Get more training examples |\n|  | Too many features (variables)\
    \ are being considered | Reduce number of features |\n|  | Too less penalisation\
    \ | Increase Regularisation parameter (lambda) |\n| **High Bias**  \n*We have\
    \ generalised way too much* | Not enough features to build a more thorough model\
    \ | Add more number of features |\n|  | Model is too simple | Add more complex\
    \ features (eg., polynomial features) |\n|  | Too much penalisation | Decrease\
    \ Regularisation parameter (lambda) |\n\nIn terms of the modeling process, a high\
    \ bias is generally indicated by the fact that both the training set error as\
    \ well as the test set error remain consistently high. For high variance (overfitting),\
    \ the training set error decreases rapidly, but the test set error remains unchanged."
  merge: -1
  img_proc: true
- pgno: 286
  md: '# # The gradient descent and VC Dimension theories


    Gradient descent and VC Dimension are two fundamental theories in machine learning.
    In general, **gradient descent** gives a structured approach to finding the optimal
    co-efficients of a function. The hypothesis space of a function can be large and
    with gradient descent, the algorithm tries to find a minimum *(a minima)* where
    the cost function (for example, the squared sum of errors) is the lowest.


    **VC Dimension** provides an upper bound on the maximum number of points that
    can be classified in a system. It is in essence the measure of the richness of
    a function and provides an assessment of what the limits of a hypothesis are in
    a structured way. The number of points that can be exactly classified by a function
    or hypothesis is known as the VC Dimension of the hypothesis. For example, a linear
    boundary can accurately classify 2 or 3 points but not 4. Hence, the VC Dimension
    of this 2-dimensional space would be 3.


    VC Dimension, like many other topics in computational learning theory, is both
    complex and interesting. It is a lesser known (and discussed) topic, but one that
    has a profound implication as it attempts to answer questions about what the limits
    of learning can be.


    # # Popular machine learning algorithms


    There are various different classes of machine learning algorithms. As such, since
    algorithms can belong to multiple ''classes'' or categories at the same time at
    a conceptual level, it is hard to specifically state that an algorithm belongs
    exclusively to a single class. In this section, we will briefly discuss a few
    of the most commonly used and well-known algorithms.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'These include:


    +   - Regression models

    +   - Association rules

    +   - Decision trees

    +   - Random forest

    +   - Boosting algorithms

    +   - Support vector machines

    +   - K-means

    +   - Neural networks


    Note that in the examples, we have shown the basic use of the R functions using
    the entire dataset. In practice, we''d split the data into a training and test
    set, and once we have built a satisfactory model apply the same on the test dataset
    to evaluate the model''s performance.


    # Regression models


    Regression models range from commonly used linear, logistic, and multiple regression
    algorithms used in statistics to Ridge and Lasso regression, which penalizes co-efficients
    to improve model performance.


    In our earlier examples, we saw the application of linear regression when we created
    trend-lines. Multiple linear regression refers to the fact that the process of
    creating the model requires multiple independent variables.


    For instance:


    Total Advertising Cost = x* Print Ads, would be a simple linear regression; whereas


    Total Advertising Cost = X + Print Ads + Radio Ads + TV Ads, due to the presence
    of more than one independent variable (Print, Radio, and TV), would be a multiple
    linear regression.


    Logistic regression is another commonly used statistical regression modelling
    technique that predicts the outcome of a discrete categorical value, mainly for
    cases where the outcome variable is dichotomous (for example, 0 or 1, Yes or No,
    and so on). There can, however, be more than 2 discrete outcomes (for example,
    State NY, NJ, CT) and this type of logistic regression is known as multinomial
    logistic regression.'
  merge: -1
  img_proc: true
