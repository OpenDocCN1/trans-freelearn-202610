  md: "4. Click on Hue from the drop-down menu on Quick Start at the top of the Hue\
    \ login window:\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_111_0.png)\n\n5. Create\
    \ the table schema, load the CSV file, `oil.csv`, and view the records:\n\n```\n\
    ```sql\nCREATE TABLE IF NOT EXISTS OIL\n    (location String, indicator String,\
    \ subject String, measure\nString,\n    frequency String, time String, value Float,\
    \ flagCode String)\nROW FORMAT DELIMITED\nFIELDS TERMINATED BY ','\nLINES TERMINATED\
    \ BY '\\n'\nSTORED AS TEXTFILE\ntblproperties(\"skip.header.line.count\"=\"1\"\
    );\n\nLOAD DATA LOCAL INPATH '/home/cloudera/oil.csv' INTO TABLE OIL;\nSELECT\
    \ * FROM OIL;\n```\n```"
