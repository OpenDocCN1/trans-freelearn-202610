- pgno: 257
  md: 'SMOTE (Chawla et al., 2002) is a well-known algorithm to fight this problem.
    The general idea of this method is to artificially generate new examples of the
    minority class using the nearest neighbors of these cases. Furthermore, the majority
    class examples are also under-sampled, leading to a more balanced dataset:


    ```

    # Method 3: SMOTE

    # The function SMOTE is available in the R Package DMwR

    # In order to use it, we first need to install DmWR as follows

    ```


    ```

    install.packages ("DMwR")

    ```


    ```

    # Once the package has been installed, we will create a synthetic

    # Dataset in which we will increase the number of ''neg'' records

    # Let us check once again the distribution of neg/pos in the

    dataset

    ```


    ```

    table(diabsim$diabetes)

    ```


    negpos

    729  39


    ```

    # Using SMOTE we can create synthetic cases of ''pos'' as follows

    ```


    ```

    diabsyn<- SMOTE(diabetes ~ ., diabsim, perc.over = 500, perc.under = 150)

    ```


    ```

    # perc.over = 500 means, increase the occurrence of the minority

    # class by 500%, i.e., 39 + 5*39 = 39 + 195 = 234

    ```


    ```

    # perc.under = 150 means, that for each new record generated for the

    # Minority class, we will generate 1.5 cases of the majority class

    # In this case, we created 195 new records (500% of 39) and hence

    # we will generate 150% of 195 records = 195 * 150% = 195 * 1.5

    # = 292.5, or 292 (rounded down) new records

    ```


    ```

    # We can verify this by running the table command against the newly

    # Created synthetic dataset, diabsyn

    ```


    ```

    table(diabsyn$diabetes)

    ```


    negpos

    292 234'
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   - **ROSE (Randomly OverSampling Examples)**, the final method in this section,
    is available via the ROSE package in R. Like SMOTE, it is a method for generating
    synthetic samples. The help file for ROSE states the high-level use of the function
    as follows:


    > *Generation of synthetic data by Randomly Over Sampling Examples creates a sample
    of synthetic data by enlarging the features space of minority and majority class
    examples. Operationally, the new examples are drawn from a conditional kernel
    density estimate of the two classes, as described in Menardi and Torelli (2013).*


    ```

    install.packages("ROSE")

    library(ROSE)


    # Loaded ROSE 0.0-3

    set.seed(1)


    diabsyn2 <- ROSE(diabetes ~ ., data=diabsim)


    table(diabsyn2$data$diabetes)


    # negpos

    # 395 373

    ```


    # Data imputation


    Sometimes, your data may have missing values. This could be due to errors in the
    data collection process, genuinely missing data, or any other reason, with the
    net result being that the information is not available. Real world examples of
    missing data can be found in surveys where the respondent did not answer a specific
    question on the survey.


    You may have a dataset of, say, 1,000 records and 20 columns of which a certain
    column has 100 missing values. You may choose to discard this column altogether,
    but that also means discarding 90 percent of the information. You still have 19
    other columns that have complete data. Another option is to simply exclude the
    column, but that means you cannot leverage the benefit afforded by the data that
    is available in the respective column.


    Several methods exist for data imputation, that is, the process of filling in
    missing data. We do not know what the exact values are, but by looking at the
    other entries in the table, we may be able to make an educated and systematic
    assessment of what the values might be.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Some of the common methods in data imputation involve:


    +   - **Mean, median, mode imputation:** Substituting the missing values using
    the mean, median, or mode value for the column. This, however, has the disadvantage
    of increasing the correlation among the variables that are imputed, which might
    not be desirable for multivariate analysis.

    +   - **K-nearest neighbors imputation:** kNN imputation is a process of using
    a machine learning approach (nearest-neighbors) in order to impute missing values.
    It works by finding k records that are most similar to the one that has missing
    values and calculates the weighted average using Euclidean distance relative to
    k records.

    +   - **Imputation using regression models:** Regression methods use standard
    regression methods in R to predict the value of the missing variables. However,
    as noted in the respective section on Regression-based imputation on Wikipedia
    https://en.wikipedia.org/wiki/Imputation_(statistics)#Regression, the problem
    (with regression imputation) is that the imputed data do not have an error term
    included in their estimation. Thus, the estimates fit perfectly along the regression
    line without any residual variance. This causes relationships to be over identified
    and suggests greater precision in the imputed values than is warranted.

    +   - **Hot-deck imputation:** Another technique for filling missing values with
    observations from the dataset itself. This method, although very prevalent, does
    have a limitation in that, by assigning say, a single value, to a large range
    of missing values, it could add a significant bias in the observations and can
    produce misleading results.


    A short example has been provided here to demonstrate how imputation can be done
    using kNN imputation. We simulate missing data by changing a large number of values
    to NA in the `PimaIndiansDiabetes` dataset.


    We make use of the following factors for the process:


    +   - We use mean to fill in the NA values.

    +   - We use kNN imputation to fill in the missing values. We then compare how
    the two methods performed:


    ```

    ```r

    library(DMwR)

    library(caret)


    diab<- PimaIndiansDiabetes

    ```

    ```'
