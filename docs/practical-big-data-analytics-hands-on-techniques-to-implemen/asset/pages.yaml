- pgno: 249
  md: '# The core concepts in machine learning


    There are many important concepts in machine learning; we''ll go over some of
    the more common topics. Machine learning involves a multi-step process that starts
    with data acquisition, data mining, and eventually leads to building the predictive
    models.


    The key aspects of the model-building process involve:


    +   - **Data pre-processing:** Pre-processing and feature selection (for example,
    centering and scaling, class imbalances, and variable importance)

    +   - **Train, test splits and cross-validation:**

    +     - Creating the training set (say, 80 percent of the data)

    +     - Creating the test set (~ 20 percent of the data)

    +     - Performing cross-validation

    +   - **Create model, get predictions:**

    +     - Which algorithms should you try?

    +     - What accuracy measures are you trying to optimize?

    +     - What tuning parameters should you use?


    # Data management steps in machine learning


    Pre-processing, or more generally processing the data, is an integral part of
    most machine learning exercises. A dataset that you start out with is seldom going
    to be in the exact format against which you''ll be building your machine learning
    models; it will invariably require a fair amount of cleansing in the majority
    of cases. In fact, data cleansing is often the most time-consuming part of the
    entire process. In this section, we will briefly highlight a few of the top data
    processing steps that you may encounter in practice.


    # Pre-processing and feature selection techniques


    **Data pre-processing**, as the name implies, involves curating the data to make
    it suitable for machine learning exercises. There are various methods for pre-processing
    and a few of the more common ones have been illustrated here.


    Note that data pre-processing should be performed as part of the cross-validation
    step, that is, pre-processing should not be done before the fact, but rather during
    the model-building process. This will be explained in more detail afterward.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Centering and scaling


    Applying center and scale function on numeric columns is often done in order to
    standardize data and remove the effect of large variations in the magnitude or
    differences of numbers. You may have encountered this in college or university
    courses where students would be graded on a standardized basis, or a curve.


    For instance, say an exam paper was unusually difficult and half of all the students
    in a class of 10 students received scores below 60 - the passing rate set for
    the course. The professor can either a) make a determination that 50% of the students
    should re-take the course, or b) standardize the scores to find how students performed
    relative to one another.


    Say the class scores were:


    45,66,66,55,55,52,61,64,65,49


    With the passing score set at 60, this implies that the students who scored 45,
    55, 55, 52 and 49 will not successfully complete the course.


    However, this might not be a truly accurate representation of their relative merits.
    The professor may alternatively choose to instead use a center-and-scale method,
    commonly known as standardization, which involves:


    +   - Finding the mean of all the scores

    +   - Subtracting the mean from the scores

    +   - Dividing the result by the standard deviation of all the scores


    The operation is illustrated below for reference.


    The mean of the scores is 57.8. Hence, subtracting 57.8 from each of the numbers
    produce the numbers shown in the second row. But, we are not done yet. We need
    to divide the numbers by the standard deviation of the scores to get the final
    standardized values:


    | Scores | 45 | 66 | 66 | 55 | 55 | 52 | 61 | 64 | 65 | 49 |

    | Scores - Mean | -12.8 | 8.2 | 8.2 | -2.8 | -2.8 | -5.8 | 3.2 | 6.2 | 7.2 | -8.8
    |

    | Divide by SD | -1.67 | 1.07 | 1.07 | -0.4 | -0.4 | -0.8 | 0.42 | 0.81 | 0.94
    | -1.2 |


    Dividing by the SD (standard deviation) shows that there were only two students
    whose scores were below one standard deviation across the range of all the test
    scores. Hence, instead of five students who do not complete the course successfully
    based on the raw numbers, we can narrow it down to only two students.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "Although this is a truly simple operation, it is not hard to see that it is\
    \ very effective in smoothing out large variations in data.\n\nCentering and scaling\
    \ can be performed very easily in R using the scale command as shown here:\n\n\
    ```\n> scores <- c(45,66,66,55,55,52,61,64,65,68)\n> scale(scores)\n         \
    \ [,1]\n[1,]  -1.9412062\n[2,]   0.8319455\n[3,]   0.8319455\n[4,]  -0.6206578\n\
    [5,]  -0.6206578\n[6,]  -1.0168223\n[7,]   0.1716713\n[8,]   0.5678358\n[9,] \
    \  0.6998907\n[10,]  1.0960552\nattr(\",\"scaled:center\")\n[1] 59.7\nattr(\"\
    ,\"scaled:scale\")\n[1] 7.572611\n```\n\n# The near-zero variance function\n\n\
    The near-zero variance, available in the nearZeroVar function in the R package,\
    \ caret, is used to identify variables that have little or no variance. Consider\
    \ a set of 10,000 numbers with only three distinct values. Such a variable may\
    \ add very little value to an algorithm. In order to use the nearZeroVar function,\
