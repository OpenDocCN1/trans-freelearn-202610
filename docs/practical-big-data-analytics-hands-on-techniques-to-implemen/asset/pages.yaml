- pgno: 28
  md: 'The first models of hard drives had a capacity of less than 4 MB, which occupied
    the space of approximately two medium-sized refrigerators and cost in excess of
    $36,000—a factor of 300 million times more expensive related to today’s hard drives.
    Magnetized surfaces soon became the standard in secondary storage and to date,
    variations of them have been implemented across various removable devices such
    as floppy disks in the late 90s, CDs, and DVDs.


    **Solid-state drives (SSD)**, the successor to hard drives, were first invented
    in the mid-1950’s by IBM. In contrast to hard drives, SSD disks stored data using
    non-volatile memory, which stores data using a charged silicon substrate. As there
    are no mechanical moving parts, the time to retrieve data stored in an SSD (seek
    time) is an order of magnitude faster relative to devices such as hard drives.


    # Why we are talking about big data now if data has always existed


    By the early 2000’s, rapid advances in computing and technologies, such as storage,
    allowed users to collect and store data with unprecedented levels of efficiency.
    The internet further added impetus to this drive by providing a platform that
    had an unlimited capacity to exchange information at a global scale. Technology
    advanced at a breathtaking pace and led to major paradigm shifts powered by tools
    such as social media, connected devices such as smart phones, and the availability
    of broadband connections, and by extension, user participation, even in remote
    parts of the world.


    By and large, the majority of this data consists of information generated by web-based
    sources, such as social networks like Facebook and video sharing sites like YouTube.
    In big data parlance, this is also known as **unstructured** data; namely, data
    that is not in a fixed format such as a spreadsheet or the kind that can be easily
    stored in a traditional database system.


    ![](img/8ededb1e0b69e85687f6e488d1044b79_28_0.png)


    The simultaneous advances in computing capabilities meant that although the rate
    of data being generated was very high, it was still computationally feasible to
    analyze it. Algorithms in machine learning, which were once considered intractable
    due to both the volume as well as algorithmic complexity, could now be analyzed
    using various new paradigms such as cluster or multinode processing in a much
    simpler manner that would have earlier necessitated special-purpose machines.'
  merge: -1
  img_proc: true
