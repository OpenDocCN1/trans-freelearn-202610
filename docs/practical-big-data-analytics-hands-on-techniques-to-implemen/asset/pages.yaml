- pgno: 338
  md: '**Business use cases:** Companies considering databases for storing unstructured
    or semi-structured data may find the features of MongoDB well suited for querying
    such datasets. The database does not require a fixed schema to be defined at the
    onset, making it flexible and extensible to support new attributes that are added
    to existing data. MongoDB is available as a free open source download from https://www.mongodb.com/download-center
    and can also be implemented as a managed and hosted cloud solution via MongoDB
    Atlas. An enterprise version that supports features such as in-memory and encrypted
    storage is also available on a subscription basis.


    # Cassandra


    **Cassandra** is one of the most successful and widely used enterprise NoSQL systems.
    It incorporates both columnar and key-value concepts and stores data in row-based
    partitions. Each partition is in turn a primary key. Rows can have multiple columns
    and the number of columns may differ from one row to another.


    Cassandra databases can be queries done via CQL, which uses a SQL-like syntax
    and makes the process of data querying, saving, and other common tasks much easier.
    Cassandra also uses a decentralized architecture; it does not have any single
    point of failure and supports multi-node architecture.


    In addition to the standard horizontal scalability of Cassandra DBMS, the platform
    also supports Elastic scalability and is able to transparently allocate and de-allocate
    nodes depending upon needs. On the whole, Cassandra is one of the most formidable
    options for enterprise NoSQL systems and is used in production environment across
    multiple large firms globally.


    **Business use case:** Cassandra is a fully open source solution and implements
    multiple key features of NoSQL systems. It is used in production workloads globally
    and has matured into a stable, enterprise-grade, open source platform. In other
    words, Cassandra is well suited for managing large organizational needs and does
    not incur any additional licensing costs. A commercial, licensed, and paid version
    of Cassandra is also available from Datastax: https://www.datastax.com/products/datastax-enterprise.
    It is known as **DSE (Datastax Enterprise)**. DSE incorporates various enterprise
    features such as security and search, and can also be accessed via the Datastax
    Managed Cloud environment using popular cloud providers such as AWS.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Neo4j


    Neo4j is a graph-based database that is used to model relationships between different
    entities. The database uses familiar concepts in graph theory to create tree-based
    representations (with nodes and relationships) of interconnected subjects. It
    is used most commonly in conjunction with recommendation engines. Conceptually,
    a Neo4j graph database could represent individuals as nodes who are connected
    to one another by, say, their degree of separation. This would hypothetically
    allow an end user to trace the degrees of separation between any arbitrary node
    or one individual to another.


    Various graph-based representations such as weighted, directed, unidirectional,
    and labelled are available in the Neo4j platform.


    Business use case: Companies that require deep customer-level or user-level analysis
    such as social networks or recommendation systems (such as Netflix), stand to
    gain an immense benefit from deploying graph-based databases such as Neo4j. Today,
    the platform supports AI and machine learning, iOT, real-time recommendations,
    and many other useful characteristics used in enterprise.


    ![](img/8ededb1e0b69e85687f6e488d1044b79_339_0.png)


    Although Neo4j is available as open source software from https://neo4j.com/download/?ref=hro,
    there is also a commercial licensed version known as Neo4j Enterprise Edition.


    # Cloud databases


    Cloud databases, as the name suggests refers to data warehouse or database systems
    available from cloud vendors such as Amazon, Google, and Microsoft.


    # Amazon Redshift, Redshift Spectrum, and Athena databases


    One of the most commonly used cloud-based data warehouse platforms is Amazon Redshift.
    It is the most prominent platform for data management in the cloud-based ecosystem.
    It is based on PostgreSQL and is intended mainly for analytical workloads. Redshift
    is highly scalable and requires significantly less effort relative to on-premises
    databases with similar characteristics. It can be deployed directly from the AWS
    console (after signing up for an AWS account). Nodes can be added or removed seamlessly
    via the AWS Console to increase and/or decrease capacities respectively.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'A more recent release of Redshift known as **Redshift Spectrum** permits the
    querying of data that has been stored in Amazon S3, the standard storage layer
    in AWS. This means that users can directly query data stored on disk without having
    to load it into a Redshift-specific instance. Overall, Redshift is relatively
    fast, inexpensive, and more importantly easy to use and deploy. Redshift Spectrum
    uses a pay-per-query model—users pay only for the queries that are executed at
    a nominal charge for each terabyte of data scanned.


    **Amazon Athena** is in many respects similar to Amazon Redshift Spectrum, in
    that it is also used to query data that is stored on S3. However, while the features
    of Amazon Redshift Spectrum cannot be used without first purchasing Amazon Redshift,
    users can leverage Amazon Athena on-demand and do not need to reserve any additional
    hardware. On the other hand, because Amazon Redshift Spectrum is closely integrated
    with the Redshift ecosystem, users can distribute their workload on either of
    the two solutions. Data that needs faster processing can remain on Amazon Redshift,
    whereas less frequently used/less critical data can be stored on S3 and queried
    using Redshift Spectrum:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_340_0.png)'
  merge: -1
  img_proc: true
