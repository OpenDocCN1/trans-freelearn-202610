- pgno: 45
  md: 'At the technical level, there are primarily two main considerations:


    +   - Selection of the hardware stack

    +   - Selection of the software and BI (**business intelligence**) platform


    Over the recent 2-3 years, it has become increasingly common for corporations
    to move their processes to cloud-based environments as a complementary solution
    for in-house infrastructures. As such, cloud-based deployments have become exceedingly
    common and hence, an additional section on on-premises versus cloud-based has
    been added. Note that the term *On-premises* can be used interchangeably with
    **In-house**, **On-site**, and other similar terminologies.


    ![](img/8ededb1e0b69e85687f6e488d1044b79_45_0.png)


    > You’d often hear the term **On-premise** being used as an alternative for *On-premises*.
    The correct term is **On-premises**. The term **premise** is defined by the Chambers
    Dictionary as *premise noun 1 (also premises) something assumed to be true as
    a basis for stating something further*. **Premises**, on the other hand, is a
    term used to denote buildings (among others) and arguably makes a whole lot more
    sense.


    # Selection of the hardware stack


    The choice of hardware often depends on the type of solution that is chosen and
    where the hardware would be located. The proper choice depends on several key
    metrics such as the type of data (structured, unstructured, or semi-structured),
    the size of data (gigabytes versus terabytes versus petabytes), and, to an extent,
    the frequency with which the data will be updated. The optimal choice requires
    a formal assessment of these variables and will be discussed later on in the book.
    At a high-level, we can surmise three broad models of hardware architecture:


    +   - **Multinode architecture:** This would typically entail multiple nodes (or
    servers) that are interconnected and work on the principle of multinode or distributed
    computing. A classic example of a multinode architecture is Hadoop, where multiple
    servers maintain bi-directional communication to coordinate a job. Other technologies
    such as a NoSQL database like Cassandra and search and analytics platform like
    Elasticsearch also run on the principle of multinode computing architecture. Most
    of them leverage *commodity servers*, another name for relatively low-end machines
    by enterprise standards that work in tandem to provide large-scale data mining
    and analytics capabilities. Multinode architectures are suitable for hosting data
    that is in the range of terabytes and above.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - **Single-node architecture:** Single-node refers to computation done
    on a single server. This is relatively uncommon with the advent of multinode computing
    tools, but still retains a huge advantage over distributed computing architectures.
    *The Fallacy of Distributed Computing* outlines a set of assertions, or assumptions,
    related to the implementation of distributed systems such as the reliability of
    the network, cost of latency, bandwidth, and other considerations. If the dataset
    is structured, contains primarily textual data, and is in the order of 1–5 TB,
    in today’s computing environment, it is entirely possible to host such datasets
    on single-node machines using specific technologies as has been demonstrated in
    later chapters.


    +   - **Cloud-based architecture:** Over the past few years, numerous cloud-based
    solutions have appeared in the industry. These solutions have greatly reduced
    the barrier to entry in big data analytics by providing a platform that makes
    it incredibly easy to provision hardware resources on demand based on the needs
    of the task at hand. This materially reduces the significant overhead in procuring,
    managing, and maintaining physical hardware and hosting them at in-house data
    center facilities.


    Cloud platforms such as Amazon Web Services, Azure from Microsoft, and the Google
    Compute Environment permit enterprises to provision 10s to 1000s of nodes at costs
    starting as low as 1 cent per hour per instance.


    In the wake of the growing dominance of cloud vendors over traditional brick-and-mortar
    hosting facilities, several complementary services to manage client cloud environments
    have come into existence.


    Examples include cloud management companies, such as Altiscale that provides big
    data as a service solutions and IBM Cloud Brokerage that facilitates selection
    and management of multiple cloud-based solutions.


    ![](img/8ededb1e0b69e85687f6e488d1044b79_46_0.png)


    **The exponential decrease in the cost of hardware:** The cost of hardware has
    gone down exponentially over the past few years. As a case in point, per Statistic
    Brain’s research, the cost of hard drive storage in 2013 was approximately 4 cents
    per GB. Compare that with $7 per GB as recent as 2000 and over $100,000 per GB
    in the early 80’s. Given the high cost of licensing commercial software, which
    can often exceed the cost of the hardware, it makes sense to allocate enough budget
    toward procuring capable hardware solutions. Software needs appropriate hardware
    to provide optimal performance and providing level importance toward hardware
    selection is just as important as selecting the appropriate software.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Selection of the software stack


    The selection of the software stack for data mining varies based on individual
    circumstances. The most popular options specific to data mining are shown along
    with a couple of alternatives which, although not as well-known, are just as capable
    of managing large-scale datasets:


    +   - **The Hadoop ecosystem:** The big data terms arguably got their start in
    the popular domain with the advent of Hadoop. The Hadoop ecosystem consists of
    multiple projects run under the auspices of the Apache Software Foundation. Hadoop
    supports nearly all the various types of datasets—such as structured, unstructured,
    and semi-structured—well-known in the big data space. Its thriving ecosystem of
    auxiliary tools that add new functionalities as well as a rapidly evolving marketplace
    where companies are vying to demonstrate the next-big-thing-in-Big-Data means
    that Hadoop will be here for the foreseeable future. There are four primary components
    of Hadoop, apart from the projects present in the large ecosystem. They are as
    follows:

    +     - **Hadoop Common:** The common utilities that support the other Hadoop
    modules

    +     - **Hadoop Distributed File System (HDFS™):** A distributed filesystem that
    provides high-throughput access to application data

    +     - **Hadoop YARN:** A framework for job scheduling and cluster resource management

    +     - **Hadoop MapReduce:** A YARN-based system for parallel processing of large
    datasets


    +   - **Apache Spark™:** Apache Spark was a project for a multinode computing
    framework first conceived at University of California at Berkeley’s AMPLab as
    a platform that provided a seamless interface to run parallel computations and
    overcome limitations in the Hadoop MapReduce framework. In particular, Spark internally
    leverages a concept known as **DAG—directed acyclic graphs—which** indicates a
    functionality that optimizes a set of operations into a smaller, or more computationally
    efficient, set of operations. In addition, Spark exposes several **APIs—application
    programming interfaces—** to commonly used languages such as Python (PySpark)
    and Scala (natively available interface). This removes one of the barriers of
    entry into the Hadoop space where a knowledge of Java is essential.'
  merge: -1
  img_proc: true
