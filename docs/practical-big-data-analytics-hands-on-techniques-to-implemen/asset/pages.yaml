- pgno: 166
  md: '# Installing kdb+


    **kdb+** is a time-series, in-memory, columnar database that has been used in
    the financial industry for almost 20 years. It is one of the fastest database
    platforms available for performing large-scale data mining, but one that is not
    as well-known as other NoSQL tools due to the fact that it has been used almost
    exclusively by hedge funds and investment banks for most of its existence. In
    particular, due to its speed and low overhead in processing vast amounts of data,
    it is used by algorithmic trading desks that engage in high-frequency trading.


    With kdb+, it is fairly simple to analyze tens of millions and even hundreds of
    millions of records on a laptop. The main constraints would be at a hardware level
    - such as the amount of memory, disk space, and CPU that is available to process
    the data. In this tutorial, we will install the free 32-bit edition of kdb+ available
    for non-commercial use.


    kdb+ is not open source, but academic institutes can use the 64-bit license at
    no charge by writing to academic@kx.com.


    There are certain key characteristics of kdb+ that make it very well suited to
    large-scale data analysis:


    +   - **Low-level implementation:** The database is written in C, thus reducing
    common causes of performance issues with most contemporary NoSQL databases that
    rely heavily on Java, which implements multiple layers of abstraction to provide
    processing capabilities

    +   - **Architectural simplicity:** The entire binary for the kdb+ database is
    about 500–600 KB. This is a fraction of the size of an MP3 song and can be easily
    downloaded even on a dial-up connection

    +   - **MapReduce:** The database implements an internal MapReduce process that
    allows queries to execute across multiple cores simultaneously

    +   - **No installation:** The database requires no system-level privileges and
    users can start using kdb+ with their user account on most systems

    +   - **Enterprise-ready:** The database has been used for nearly 20 years and
    is a very mature product used in global enterprise environments for analysis of
    high-frequency trading data among other applications

    +   - **Wide availability of interfaces:** The database has a wide range of interfaces
    for languages such as C, C++, C#, Java, R, Python, MATLAB, and others to allow
    easy integration with existing software'
  merge: -1
  img_proc: true
