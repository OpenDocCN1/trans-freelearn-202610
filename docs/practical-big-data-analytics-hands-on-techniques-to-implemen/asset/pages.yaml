    \ python\n\nimport sys\nsys.path.append('.')\n\nlast_key = None\nrunning_total\
    \ = 0\n\nfor input_line in sys.stdin:\n    input_line = input_line.strip()\n \
    \   this_key, value = input_line.split(\"\\t\", 1)\n    value = int(value)\n\n\
    \    if last_key == this_key:\n        running_total += value\n    else:\n   \
