- pgno: 334
  md: 'While, traditionally, Teradata was available as an appliance solution, as in
    both the database as well as the hardware were available as a single integrated
    unit, today, it is also possible to use Teradata in the cloud using Teradata Everywhere.
    The software can be deployed in a hybrid architecture (both on-premises as well
    as in the cloud), as well as in public cloud environments such as AWS and Microsoft
    Azure. Bundled services, subscription-based services, and as-a-service options
    are available. Teradata IntelliCloud is a subscription-based cloud offering from
    Teradata that includes several products from the Teradata ecosystem in a managed
    environment.


    **Business use case:** Teradata has been a popular enterprise database for several
    decades and has strong credibility with large organizations. In recent years,
    Teradata''s proactive integration with open source systems such as R, Jupyter,
    and other products made it more appealing and arguably helped increase its visibility.
    Teradata appliances can be relatively expensive and, as with other commercial
    options, require proper POCs to assess suitability for use cases specific to the
    organization.


    # IBM data warehouse systems (formerly Netezza appliances)


    IBM Netezza used to be sold as a separate data warehouse appliance, in some ways
    similar to how Teradata was also marketed. Recently, Netezza has been moved under
    the broader categorization of IBM Data Warehouse systems which is more aligned
    with the contemporary Big Data requirements for managing very large volumes of
    data. IBM Pure Systems, PureSystems for Analytics, and IBM Integrated Analytics
    System are some of the newer solutions that provide essentially the same functionalities
    of Netezza in an integrated ecosystem.


    The Integrated Analytics environment includes embedded Apache Spark for machine
    learning, Jupyter Notebooks for data science workloads, a common SQL engine that
    connects to other NoSQL and Hadoop implementations, and support for deployments
    on high performance architecture with the option of managed, cloud-based environments


    **Business use case:** Netezza has been favored by firms that have traditionally
    had strong dependency on IBM-related technologies, such as DB2, AIX, and other
    products from IBM. The new integrated product environment provides an opportunity
    to continue using whilst adding data science capabilities to existing IBM investments
    in the organization.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# PostgreSQL


    PostgreSQL is an interesting choice in this section because, technically, there
    is no separate NoSQL version of PostgreSQL, but rather PostgreSQL has added various
    features in recent releases that have added NoSQL capabilities to the existing
    Postgres implementation.


    Proponents of PostgreSQL rightly point out that it is a much older, and, by extension
    tested technology, having been first released in the mid-1990s. Postgres now supports
    hierarchical document data storage, JSON, a key-value store (called HStore), and
    sharding, and includes interfaces for various programming languages as well as
    diverse data sources. In other words, PostgreSQL has been extended to support
    NoSQL-like functionalities while maintaining its existing capabilities as a traditional
    RDBMS.


    PostgreSQL is available as a fully-functional, open source product.


    **Business use cases:** While most of the technologies in this section are available
    under commercial licensing (to get access to all their capabilities), PostgreSQL,
    being open source, is a very cost-effective way to try out a mature database without
    making large initial investments. It can also serve as a testing platform for
    trying out NoSQL features, such as handling JSON data prior to making a final
    decision. In either case, PostgreSQL is a formidable platform and can support
    enterprise needs. There are also commercial derivatives of PostgreSQL—databases
    that build on top of PostgreSQL such as Greenplum, which is also available as
    an open source product.


    # Greenplum


    **Greenplum Database®** is built on top of PostgreSQL, and adds a number of significant
    analytic capabilities. These include an innovative cost-based query optimizer,
    integration with Apache MADlib, and choices for ®">row or columnar storage. It
    has native interfaces for popular programming languages such as R, Python, and
    Java, and supports massively-parallel architectures. Greenplum is available for
    download at no charge from http://greenplum.org/download/.


    **Business use cases:** A commercial distribution of Greenplum with full support
    is available from **Pivotal**. Greenplum has been very successful, not least because
    of its proven performance for large enterprise workloads. The availability of
    commercial support has been beneficial to organizations who require dedicated
    support and service-level agreements (SLA) that guarantee critical business operations.'
  merge: -1
  img_proc: true
