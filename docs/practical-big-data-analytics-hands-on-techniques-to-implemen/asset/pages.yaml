- pgno: 123
  md: '# 5


    # Big Data Mining with NoSQL


    The term NoSQL was first used by Carlo Strozzi, who, in 1998, released the Strozzi
    NoSQL opensource relational database. In the late 2000s, new paradigms in database
    architecture emerged, many of which did not adhere to the strict constraints required
    of relational database systems. These databases, due to their non-conformity with
    standard database conventions such as ACID compliance, were soon grouped under
    a broad category known as NoSQL.


    Each NoSQL database claims to be optimal for certain use cases. Although few of
    them would fit the requirements to be a general-purpose database management system,
    they all leverage a few common themes across the spectrum of NoSQL systems.


    In this chapter, we will visit some of the broad categories of NoSQL database
    management systems. We will discuss the primary drivers that initiated the migration
    to NoSQL database systems and how such databases solved specific business needs
    that led to their widespread adoption, and conclude with a few hands-on NoSQL
    exercises.


    The topics covered in this chapter include:


    +   - Why NoSQL?

    +   - NoSQL databases

    +   - In-memory databases

    +   - Columnar databases

    +   - Document-oriented databases

    +   - Key-value databases

    +   - Graph databases

    +   - Other NoSQL types and summary

    +   - Hands-on exercise on NoSQL systems'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Why NoSQL?


    The term NoSQL generally means *Not Only SQL*: that is, the underlying database
    has properties that are different to those of common and traditional database
    systems. As such, there is no clear distinction that qualifies a database as NoSQL,
    other than the fact that they do not provide the characteristics of ACID compliance.
    As such, it would be helpful to understand the nature of ACID properties that
    have been the mainstay of database systems for many decades, as well as discuss,
    in brief, the significance of BASE and CAP, two other terminologies central to
    databases today.


    # The ACID, BASE, and CAP properties


    Let''s first proceed with ACID and SQL.


    # ACID and SQL


    ACID stands for atomicity, consistency, isolation, and durability:


    +   - **Atomicity**: This indicates that database transactions either execute
    in full or do not execute at all. In other words, either all transactions should
    be committed, that is, persisted in their entirety, or not committed at all. There
    is no scope for a partial execution of a transaction.

    +   - **Consistency**: The constraints on the data, that is, the rules that determine
    data management within a database, will be consistent throughout the database.
    Different instances will not abide by rules that are any different to those in
    other instances of the database.

    +   - **Isolation**: This property defines the rules of how concurrent operations
    (transactions) will read and write data. For example, if a certain record is being
    updated while another process reads the same record, the isolation level of the
    database system will determine which version of the data would be returned back
    to the user.

    +   - **Durability**: The durability of a database system generally indicates
    that committed transactions will remain persistent even in the event of a system
    failure. This is generally managed by the use of transaction logs that databases
    can refer to during recovery.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'The reader may observe that all the properties defined here relate primarily
    to database transactions. A **transaction** is a unit of operation that abides
    by the aforementioned rules and makes a change to the database. For example, a
    typical cash withdrawal from an ATM may have the following logical pathway:


    +   1. User withdraws cash from an ATM

    +   2. The bank checks the current balance of the user

    +   3. The database system deducts the corresponding amount from the user''s account

    +   4. The database system updates the amount in the user''s account to reflect
    the change


    As such, most databases in popular use prior to the mid-1990s, such as Oracle,
    Sybase, DB2, and others, were optimized for recording and managing transactional
    data. Until this time, most databases were responsible for managing transactional
    data. The rapid growth of the internet in the mid-90s led to new types of data
    that did not necessarily require the strict ACID compliance requirements. Videos
    on YouTube, music on Pandora, and corporate email records are all examples of
    use cases where a a transactional database does not add value beyond simply functioning
    as a technology layer for storing data.


    # The BASE property of NoSQL


    By the late 2000s, data volume had surged and it was apparent that a new alternative
    model was required in order to manage the data. This new model, called BASE, became
    a foundational topic that replaced ACID as the preferred model of database management
    systems.


    **BASE** stands for **Basically Available Soft-state Eventually consistency**.
    This implies that the database is *basically* available for use most of the time;
    that is, there can be periods during which the services are unavailable (and hence
    additional redundancy measures should be implemented). *Soft-state* means that
    the state of the system cannot be guaranteed - different instances of the same
    data might have different content as it may not have yet captured recent updates
    in another part of the cluster. Finally, *eventually* consistent implies that
    although the database might not be in the same state at all times, it will eventually
    get to the same state; that is, become *consistent*.'
  merge: -1
  img_proc: true
