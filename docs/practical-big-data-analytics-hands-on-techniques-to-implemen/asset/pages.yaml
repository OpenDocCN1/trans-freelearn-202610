- pgno: 31
  md: '+   - **Software:** Software resources that facilitate analytics on the datasets
    hosted in the hardware layer, such as Hadoop and NoSQL systems, represent the
    next level in the big data stack. Analytics software can be classified into various
    subdivisions. Two of the primary high-level classifications for analytics software
    are tools that facilitate:

    +     - **Data mining:** Software that provides facilities for aggregations, joins
    across datasets, and pivot tables on large datasets fall into this category. Standard
    NoSQL platforms such as Cassandra, Redis, and others are high-level, data mining
    tools for big data analytics.

    +     - **Statistical analytics:** Platforms that provide analytics capabilities
    beyond simple data mining, such as running algorithms that can range from simple
    regressions to advanced neural networks such as Google TensorFlow or R, fall into
    this category.


    +   - **Data management:** Data encryption, governance, access, compliance, and
    other features salient to any enterprise and production environment to manage
    and, in some ways, reduce operational complexity form the next basic layer. Although
    they are less tangible than hardware or software, data management tools provide
    a defined framework, using which organizations can fulfill their obligations such
    as security and compliance.


    +   - **End user:** The end user of the analytics software forms the final aspect
    of a big data analytics engagement. A data platform, after all, is only as good
    as the extent to which it can be leveraged efficiently and addresses business-specific
    use cases. This is where the role of the practitioner who makes use of the analytics
    platform to derive value comes into play. The term data scientist is often used
    to denote individuals who implement the underlying big data analytics capabilities
    while business users reap the benefits of faster access and analytics capabilities
    not available in traditional systems.


    # # Types of Big Data


    Data can be broadly classified as being structured, unstructured, or semi-structured.
    Although these distinctions have always existed, the classification of data into
    these categories has become more prominent with the advent of big data.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Structured


    Structured data, as the name implies, indicates datasets that have a defined organizational
    structure such as Microsoft Excel or CSV files. In pure database terms, the data
    should be representable using a schema. As an example, the following table representing
    the top five *happiest* countries in the world published by the United Nations
    in its 2017 World Happiness Index ranking would be an atypical representation
    of structured data.


    We can clearly define the data types of the columns--Rank, Score, GDP per capita,
    Social support, Healthy life expectancy, Trust, Generosity, and Dystopia are numerical
    columns, whereas Country is represented using letters, or more specifically, **strings**.


    Refer to the following table for a little more clarity:


    | Rank | Country | Score | GDP per capita | Social support | Healthy life expectancy
    | Generosity | Trust | Dystopia |

    |------|---------|-------|----------------|----------------|--------------------------|------------|-------|----------|

    | 1 | Norway | 7.537 | 1.616 | 1.534 | 0.797 | 0.362 | 0.316 | 2.277 |

    | 2 | Denmark | 7.522 | 1.482 | 1.551 | 0.793 | 0.355 | 0.401 | 2.314 |

    | 3 | Iceland | 7.504 | 1.481 | 1.611 | 0.834 | 0.476 | 0.154 | 2.323 |

    | 4 | Switzerland | 7.494 | 1.565 | 1.517 | 0.858 | 0.291 | 0.367 | 2.277 |

    | 5 | Finland | 7.469 | 1.444 | 1.54 | 0.809 | 0.245 | 0.383 | 2.43 |


    World Happiness Report, 2017 [Source: https://en.wikipedia.org/wiki/World_Happiness_Report#cite_note-4]


    Commercial databases such as Teradata, Greenplum as well as Redis, Cassandra,
    and Hive in the open source domain are examples of technologies that provide the
    ability to manage and query structured data.


    # Unstructured


    Unstructured data consists of any dataset that does not have a predefined organizational
    schema as in the table in the prior section. Spoken words, music, videos, and
    even books, *including this one*, would be considered **unstructured**. This by
    no means implies that the content doesn’t have organization. Indeed, a book has
    a table of contents, chapters, subchapters, and an index--in that sense, it follows
    a definite organization.


    However, it would be futile to represent every word and sentence as being part
    of a strict set of rules. A sentence can consist of words, numbers, punctuation
    marks, and so on and does not have a predefined data type as spreadsheets do.
    To be *structured*, the book would need to have an exact set of characteristics
    in every sentence, which would be both unreasonable and impractical.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Data from social media, such as posts on Twitter, messages from friends on
    Facebook, and photos on Instagram, are all examples of unstructured data.


    Unstructured data can be stored in various formats. They can be Blobs or, in the
    case of textual data, freeform text held in a data storage medium. For textual
    data, technologies such as Lucene/Solr, Elasticsearch, and others are generally
    used to query, index, and other operations.


    # Semi-structured


    Semi-structured data refers to data that has both the elements of an organizational
    schema as well as aspects that are arbitrary. A personal phone diary (increasingly
    rare these days!) with columns for name, address, phone number, and notes could
    be considered a semi-structured dataset. The user might not be aware of the addresses
    of all individuals and hence some of the entries may have just a phone number
    and vice versa.


    Similarly, the column for notes may contain additional descriptive information
    (such as a facsimile number, name of a relative associated with the individual,
    and so on). It is an arbitrary field that allows the user to add complementary
    information. The columns for name, address, and phone number can thus be considered
    structured in the sense that they can be presented in a tabular format, whereas
    the notes section is unstructured in the sense that it may contain an arbitrary
    set of descriptive information that cannot be represented in the other columns
    in the diary.


    In computing, **semi-structured** data is usually represented by formats, such
    as JSON, that can encapsulate both structured as well as schemaless or arbitrary
    associations, generally using key-value pairs. A more common example could be
    email messages, which have both a structured part, such as name of the sender,
    time when the message was received, and so on, that is common to all email messages
    and an unstructured portion represented by the body or content of the email.


    Platforms such as Mongo and CouchDB are generally used to store and query semi-structured
    datasets.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# # Sources of big data\n\nTechnology today allows us to collect data at an\
    \ astounding rate--both in terms of volume and variety. There are various sources\
    \ that generate data, but in the context of big data, the primary sources are\
    \ as follows:\n\n+   - **Social networks:** Arguably, the primary source of all\
    \ big data that we know of today is the social networks that have proliferated\
    \ over the past 5-10 years. This is by and large unstructured data that is represented\
    \ by millions of social media postings and other data that is generated on a second-by-second\
    \ basis through user interactions on the web across the world. Increase in access\
    \ to the internet across the world has been a self-fulfilling act for the growth\
    \ of data in social networks.\n+   \n+   - **Media:** Largely a result of the\
    \ growth of social networks, media represents the millions, if not billions, of\
    \ audio and visual uploads that take place on a daily basis. Videos uploaded on\
    \ YouTube, music recordings on SoundCloud, and pictures posted on Instagram are\
    \ prime examples of media, whose volume continues to grow in an unrestrained manner.\n\
    +   \n+   - **Data warehouses:** Companies have long invested in specialized data\
    \ storage facilities commonly known as data warehouses. A DW is essentially collections\
    \ of historical data that companies wish to maintain and catalog for easy retrieval,\
    \ whether for internal use or regulatory purposes. As industries gradually shift\
    \ toward the practice of storing data in platforms such as Hadoop and NoSQL, more\
    \ and more companies are moving data from their pre-existing data warehouses to\
    \ some of the newer technologies. Company emails, accounting records, databases,\
    \ and internal documents are some examples of DW data that is now being offloaded\
    \ onto Hadoop or Hadoop-like platforms that leverage multiple nodes to provide\
    \ a highly-available and fault-tolerant platform.\n+   \n+   - **Sensors:** A\
    \ more recent phenomenon in the space of big data has been the collection of data\
    \ from sensor devices. While sensors have always existed and industries such as\
    \ oil and gas have been using drilling sensors for measurements at oil rigs for\
    \ many decades, the advent of wearable devices, also known as the Internet Of\
    \ Things such as Fitbit and Apple Watch, meant that now each individual could\
    \ stream data at the same rate at which a few oil rigs used to do just 10 years\
    \ back."
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Wearable devices can collect hundreds of measurements from an individual at
    any given point in time. While not yet a big data problem as such, as the industry
    keeps evolving, sensor-related data is likely to become more akin to the kind
    of spontaneous data that is generated on the web through social network activities.


    # The 4Vs of big data


    The topic of the 4Vs has become overused in the context of big data, where it
    has started to lose some of the initial charm. Nevertheless, it helps to bear
    in mind what these Vs indicate for the sake of being aware of the background context
    to carry on a conversation.


    Broadly, the 4Vs indicate the following:


    +   - **Volume:** The amount of data that is being generated

    +   - **Variety:** The different types of data, such as textual, media, and sensor
    or streaming data

    +   - **Velocity:** The speed at which data is being generated, such as millions
    of messages being exchanged at any given time across social networks

    +   - **Veracity:** This has been a more recent addition to the 3Vs and indicates
    the noise inherent in data, such as inconsistencies in recorded information that
    requires additional validation


    # When do you know you have a big data problem and where do you start your search
    for the big data solution?


    Finally, big data analytics refers to the practice of putting the data to work—in
    other words, the process of extracting useful information from large volumes of
    data through the use of appropriate technologies. There is no exact definition
    for many of the terms used to denote different types of analytics, as they can
    be interpreted in different ways and the meaning hence can be subjective.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Nevertheless, some are provided here to act as references or starting points
    to help you in forming an initial impression:


    +   - **Data mining:** Data mining refers to the process of extracting information
    from datasets through running queries or basic summarization methods such as aggregations.
    Finding the top 10 products by the number of sales from a dataset containing all
    the sales records of one million products at an online website would be the process
    of mining: that is, extracting useful information from a dataset. NoSQL databases
    such as Cassandra, Redis, and MongoDB are prime examples of tools that have strong
    data mining capabilities.

    +   - **Business intelligence:** Business intelligence refers to tools such as
    Tableau, Spotfire, QlikView, and others that provide frontend dashboards to enable
    users to query data using a graphical interface. Dashboard products have gained
    in prominence in step with the growth of data as users seek to extract information.
    Easy-to-use interfaces with querying and visualization features that could be
    used universally by both technical and non-technical users set the groundwork
    to democratize analytical access to data.

    +   - **Visualization:** Data can be expressed both succinctly and intuitively,
    using easy-to-understand visual depictions of the results. Visualization has played
    a critical role in understanding data better, especially in the context of analyzing
    the nature of the dataset and its distribution prior to more in-depth analytics.
    Developments in JavaScript, which saw a resurgence after a long period of quiet,
    such as D3.js and ECharts from Baidu, are some of the prime examples of visualization
    packages in the open source domain. Most BI tools contain advanced visualization
    capabilities and, as such, it has become an indispensable asset for any successful
    analytics product.

    +   - **Statistical analytics:** Statistical analytics refers to tools or platforms
    that allow end users to run statistical operations on datasets. These tools have
    traditionally existed for many years, but have gained traction with the advent
    of big data and the challenges that large volumes of data pose in terms of performing
    efficient statistical operations. Languages such as R and products such as SAS
    are prime examples of tools that are common names in the area of computational
    statistics.

    +   - **Machine learning:** Machine learning, which is often referred to by various
    names such as predictive analytics, predictive modeling, and others, is in essence
    the process of applying advanced algorithms that go beyond the realm of traditional
    statistics. These algorithms inevitably involve running hundreds or thousands
    of iterations. Such algorithms are not only inherently complex, but also very
    computationally intensive.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The advancement in technology has been a key driver in the growth of machine
    learning in analytics, to the point where it has now become a commonly used term
    across the industry. Innovations such as self-driving cars, traffic data on maps
    that adjust based on traffic patterns, and digital assistants such as Siri and
