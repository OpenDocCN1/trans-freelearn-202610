- pgno: 255
  md: 'But, the objective of the exercise was to find the *individuals who had the
    rare disease*. We are already well aware that due to the nature of the disease,
    most individuals will not belong to the category.


    Data sampling, in essence, is the process of *maximizing machine learning metrics
    such as specificity, sensitivity, precision, recall, and kappa*. These will be
    discussed at a later stage, but for the purposes of this section, we''ll show
    some ways by which you can *sample* the data so as to produce a more evenly balanced
    dataset.


    The R package, `caret`, includes several helpful functions to create a balanced
    distribution of the classes from an imbalanced dataset.


    In these cases, we need to re-sample the data to get a better distribution of
    the classes in order to build a more effective model.


    Some of the general methods include:


    +   - **Up-sample**: Increase instances of the class with lesser examples

    +   - **Down-sample**: Reduce the instances of the class with higher examples

    +   - **Create synthetic examples** (for example, **SMOTE (Synthetic Minority
    Oversampling Technique)**)

    +   - Random oversampling (for example, **(ROSE) Randomly OverSampling Examples**)


    We will create a simulated dataset using the same data from the prior example
    where 95% of the rows will be marked as negative:


    ```

    library(mlbench)

    library(caret)

    diab <- PimaIndiansDiabetes


    diabsim <- diab

    diabrows <- nrow(diabsim)

    negrows <- floor(.95 * diabrows)

    posrows <- (diabrows - negrows)


    negrows

    [1] 729


    posrows

    [1] 39


    diabsim$diabetes[1:729] <- as.factor("neg")

    diabsim$diabetes[-c(1:729)] <- as.factor("pos")

    ```'
