- pgno: 112
  md: '![](img/8ededb1e0b69e85687f6e488d1044b79_112_0.png)


    6. Load the oil file.


    7. Now that the table has been loaded into Hive, you can run miscellaneous Hive
    commands using HiveQL. A full set of these commands is available at https://cwiki.apache.org/confluence/display/Hive/LanguageManual.


    For instance, to find the maximum, minimum, and average value of oil prices in
    each country from 1980-2015 (the date range of the dataset), we can use familiar
    SQL operators. The query would be as follows:


    ```

    SELECT LOCATION, MIN(value) as MINPRICE, AVG(value) as AVGPRICE,

    MAX(value) as MAXPRICE

    FROM OIL

    WHERE FREQUENCY LIKE "A"

    GROUP BY LOCATION;

    ```'
