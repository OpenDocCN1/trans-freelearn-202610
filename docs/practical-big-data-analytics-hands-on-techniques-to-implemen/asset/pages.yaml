- pgno: 324
  md: 'We will cover the following topics in this chapter:


    +   - Enterprise data science overview

    +   - Enterprise data mining

    +   - Enterprise AI and machine learning

    +   - Enterprise infrastructure

    +   - Other considerations, such as data strategy, governance, and tool selection

    +   - Amazon Web Services tutorial


    # Enterprise data science overview


    Data science is a relatively new topic in terms of enterprise IT and analytics.
    Traditionally, researchers and analysts belonged broadly to one of two categories:


    +   - Highly technical researchers who used complex computing languages and/or
    hardware for their professional tasks

    +   - Analysts who could use tools such as Excel and BI platforms in order to
    perform both simple and complex data analysis


    Organizations started looking into **Big Data** and, more generally, data science
    platforms in the late 2000s. It had gained immense momentum by 2013, when solutions
    such as Hadoop and NoSQL platforms were released. The following table shows the
    developments in data science:


    | Year | Developments |

    |---|---|

    | 1970s to late 1990s | Widespread use of relational database management systems.
    Entity relationship model, structured query language (SQL), and other developments
    eventually led to a rapid expansion of databases in the late 90s. |

    | Early 2000s | The anti-climatic, yet expensive, non-event of Y2K, coupled with
    the collapse of the dot-com bubble led to a period of stagnation. In terms of
    databases, or more generally, data mining platforms, this meant that companies
    were less focused on new innovations than they were on keeping the business running.
    |'
  merge: -1
  img_proc: true
- pgno: 325
  md: '| 2005-2010 | The industry slowly recovered, but it was not until 2005 that
    newer developments began to emerge. Some notable events included:

    - 2006: Google BigTable paper published

    - 2006: Amazon Web Services cloud platform launched

    - 2007: Amazon Dynamo paper published

    - 2008: Facebook makes Cassandra open source

    - 2009: MongoDB released

    - 2009: Redis released |

    | 2010-2012 | 2010: NoSQL conferences and related events start gaining popularity
    and NoSQL becomes a commonly accepted technical term. At the same time, Hadoop
    becomes widely popular, and nearly all major companies begin the process of implementing
    Hadoop-related technologies.

    2011: Market leaders start adopting Big Data and forming Big Data strategies.
    Numerous articles and research papers claiming the huge potential of Big Data
    makes it very popular. McKinsey publishes a paper on Big Data and calls it the
    next frontier of innovation, competition, and productivity. The October 2012 edition
    of, Harvard Business Review includes a very positive outlook on data scientists,
    which becomes immediately popular. |

    | 2013-2015 | The growth of Big Data technologies leads to the development of
    a concept called data science, which moves the focus from just the data to the
    value of the data. Coupled with developments in machine learning and the rise
    of the popularity of R, Python, and other data science-oriented platforms, the
    industry shifts attention to getting insights from data as opposed to merely managing
    data. Machine learning is the new buzzphrase. |

    | 2016- | The evolution of smart devices, wearables, AI-enabled cell phones, autonomous
    driving cars, and other such innovative solutions adds a new component of artificial
    intelligence to the existing trend of Big Data and machine learning. Manufacturers
    start broadly advertising the intelligent capabilities, as opposed to merely the
    machine learning capabilities, of technical solutions. |


    The responsibility for implementing a Big Data platform or, more generally, a
    Big Data Initiative, is generally delegated to the IT or Analytics Department
    of a company, if such a department exists.'
  merge: -1
  img_proc: true
