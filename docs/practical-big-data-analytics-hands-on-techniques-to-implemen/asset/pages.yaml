- pgno: 314
  md: "As shown in the following image:\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_314_0.png)\n\
    \n# Writing the R code for Apriori\n\nThe Apriori algorithm, as explained earlier,\
    \ allows users to find relationships or patterns inherent in a dataset. For this,\
    \ we will use the arules package in R/RStudio. The code will read the dataset\
    \ downloaded (called cms2016_2.csv in the example) and run the apriori algorithm\
    \ in order to find associative rules.\n\nCreate a new R file in RStudio and enter\
    \ the following code. Make sure that you change the location of the csv file that\
    \ you downloaded to the appropriate directory where the file has been stored:\n\
    \n```\nlibrary(data.table)\nlibrary(arules)\n\ncms<- fread(\"~/cms2016_2.csv\"\
    ) # CHANGE THIS TO YOUR LOCATION OF THE DATA\n\ncols <- \nc(\"category\",\"city\"\
