  md: "While it may not represent a dramatic change, it’s still better than using\
    \ a naïve approach such as using simply a mean or constant value.\n\nThere are\
    \ several packages in R for data imputation. A few prominent ones are as follows:\n\
    \n+   - **Amelia II**: Missing information in time-series data\n+   \n+     `https://gking.harvard.edu/amelia`\n\
    +   \n+   - **Hot-deck imputation with R package**: HotDeckImputation and hot.deck\n\
    +   \n+     `https://cran.r-project.org/web/packages/HotDeckImputation/`\n+  \
    \ \n+     `https://cran.r-project.org/web/packages/hot.deck/`\n+   \n+   - **Multivariate\
    \ imputation (by Chained Equations)**\n+   \n+     `https://cran.r-project.org/web/packages/mice/index.html`\n\
    +   \n+   - **Imputing values in a Bayesian framework with R package**: mi\n+\
    \   \n+     `https://cran.r-project.org/web/packages/mi/index.html`\n\n# The importance\
    \ of variables\n\nDuring model-building exercises, datasets may have tens of variables.\
    \ Not all of them may add value to the predictive model. It is not uncommon to\
    \ reduce the dataset to include a subset of the variables and allow the machine\
    \ learning programmer to devote more time toward fine-tuning the chosen variables\
    \ and the model-building process. There is also a technical justification for\
    \ reducing the number of variables in the dataset. Performing machine learning\
    \ modeling on very large, that is, high dimensional datasets can be very compute-intensive,\
    \ that is, it may require a significant amount of time, CPU, and RAM to perform\
    \ the numerical operations. This not only makes the application of certain algorithms\
    \ impractical, it also has the effect of causing unwarranted delays. Hence, the\
    \ methodical selection of variables helps both in terms of analysis time as well\
    \ as computational requirements for algorithmic analysis.\n\n**Variable selection**\
    \ is also known as feature selection/attribute selection. Algorithms such as random\
    \ forests and lasso regression implement variable selection as part of their algorithmic\
    \ operations. But, variable selection can be done as a separate exercise."
