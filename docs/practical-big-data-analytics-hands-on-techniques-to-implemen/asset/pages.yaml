- pgno: 17
  md: '# Preface


    This book introduces the reader to a broad spectrum of topics related to big data
    as used in the enterprise. Big data is a vast area that encompasses elements of
    technology, statistics, visualization, business intelligence, and many other related
    disciplines. To get true value from data that oftentimes remains inaccessible,
    either due to volume or technical limitations, companies must leverage proper
    tools both at the software as well as the hardware level.


    To that end, the book not only covers the theoretical and practical aspects of
    big data, but also supplements the information with high-level topics such as
    the use of big data in the enterprise, big data and data science initiatives and
    key considerations such as resources, hardware/software stack and other related
    topics. Such discussions would be useful for IT departments in organizations that
    are planning to implement or upgrade the organizational big data and/or data science
    platform.


    The book focuses on three primary areas:


    # 1. Data mining on large-scale datasets


    Big data is ubiquitous today, just as the term *data warehouse* was omnipresent
    not too long ago. There are a myriad of solutions in the industry. In particular,
    Hadoop and products in the Hadoop ecosystem have become both popular and increasingly
    common in the enterprise. Further, more recent innovations such as Apache Spark
    have also found a permanent presence in the enterprise - Hadoop clients, realizing
    that they may not need the complexity of the Hadoop framework have shifted to
    Spark in large numbers. Finally, NoSQL solutions, such as MongoDB, Redis, Cassandra
    and commercial solutions such as Teradata, Vertica and kdb+ have provided have
    taken the place of more conventional database systems.


    This book will cover these areas with a fair degree of depth. Hadoop and related
    products such as Hive, HBase, Pig Latin and others have been covered. We have
    also covered Spark and explained key concepts in Spark such as Actions and Transformations.
    NoSQL solutions such as MongoDB and KDB+ have also been covered to a fair extent
    and hands-on tutorials have also been provided.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 2. Machine learning and predictive analytics


    The second topic that has been covered is machine learning, also known by various
    other names, such as Predictive Analytics, Statistical Learning and others. Detailed
    explanations with corresponding machine learning code written using R and machine
    learning packages in R have been provided. Algorithms, such as random forest,
    support vector machines, neural networks, stochastic gradient boosting, decision
    trees have been discussed. Further, key concepts in machine learning such as bias
    and variance, regularization, feature selection, data pre-processing have also
    been covered.


    # 3. Data mining in the enterprise


    In general, books that cover theoretical topics seldom discuss the more high-level
    aspects of big data - such as the key requirements for a successful big data initiative.
    The book includes survey results from IT executives and highlights the shared
    needs that are common across the industry. The book also includes a step-by-step
    guide on how to select the right use cases, whether it is for big data or for
    machine learning based on lessons learned from deploying production solutions
    in large IT departments.


    We believe that with a strong foundational knowledge of these three areas, any
    practitioner can deliver successful big data and/or data science projects. That
    is the primary intention behind the overall structure and content of the book.


    # Who this book is for


    The book is intended for a diverse range of audience. In particular, readers who
    are keen on understanding the concepts of big data, data science and/or machine
    learning at a holistic level, namely, how they are all inter-related will gain
    the most benefit from the book.


    **Technical audience:** For technically minded readers, the book contains detailed
    explanations of the key industry tools for big data and machine learning. Hands-on
    exercises using Hadoop, developing machine learning use cases using the R programming
    language, building comprehensive production-grade dashboards with R Shiny have
    been covered. Other tutorials in Spark and NoSQL have also been included. Besides
    the practical aspects, the theoretical underpinnings of these key technologies
    have also been explained.


    **Business audience:** The extensive theoretical and practical treatment of big
    data has been supplemented with high level topics around the nuances of deploying
    and implementing robust big data solutions in the workplace. IT management, CIO
    organizations, business analytics and other groups who are tasked with defining
    the corporate strategy around data will find such information very useful and
    directly applicable.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# What this book covers


    Chapter 1, A Gentle Primer on Big Data, covers the basic concepts of big data
    and machine learning and the tools used, and gives a general understanding of
    what big data analytics pertains to.


    Chapter 2, Getting started with Big Data Mining, introduces concepts of big data
    mining in an enterprise and provides an introduction to the software and hardware
    architecture stack for enterprise big data.


    Chapter 3, The Analytics Toolkit, discusses the various tools used for big data
    and machine Learning and provides step-by-step instructions on where users can
    download and install tools such as R, Python, and Hadoop.


    Chapter 4, Big Data with Hadoop, looks at the fundamental concepts of Hadoop and
    delves into the detailed technical aspects of the Hadoop ecosystem. Core components
    of Hadoop such as Hadoop Distributed File System (HDFS), Hadoop Yarn, Hadoop MapReduce
    and concepts in Hadoop 2 such as ResourceManager, NodeManger, Application Master
    have been explained in this chapter. A step-by-step tutorial on using Hive via
    the Cloudera Distribution of Hadoop (CDH) has also been included in the chapter.


    Chapter 5, Big Data Analytics with NoSQL, looks at the various emerging and unique
    database solutions popularly known as NoSQL, which has upended the traditional
    model of relational databases. We will discuss the core concepts and technical
    aspects of NoSQL. The various types of NoSQL systems such as In-Memory, Columnar,
    Document-based, Key-Value, Graph and others have been covered in this section.
    A tutorial related to MongoDB and the MongoDB Compass interface as well as an
    extremely comprehensive tutorial on creating a production-grade R Shiny Dashboard
    with kdb+ have been included.


    Chapter 6, Spark for Big Data Analytics, looks at how to use Spark for big data
    analytics. Both high-level concepts as well as technical topics have been covered.
    Key concepts such as SparkContext, Directed Acyclic Graphs, Actions & Transformations
    have been covered. There is also a complete tutorial on using Spark on Databricks,
    a platform via which users can leverage Spark


    Chapter 7, A Gentle Introduction to Machine Learning Concepts, speaks about the
    fundamental concepts in machine learning. Further, core concepts such as supervised
    vs unsupervised learning, classification, regression, feature engineering, data
    preprocessing and cross-validation have been discussed. The chapter ends with
    a brief tutorial on using an R library for Neural Networks.'
  merge: -1
  img_proc: true
