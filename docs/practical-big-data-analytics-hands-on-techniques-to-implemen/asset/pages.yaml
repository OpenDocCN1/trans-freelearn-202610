  md: '```

    diab<- knnImputation(diab)


    # Create the train-test set split

    training_index<- createDataPartition(diab$diabetes, p = .8, list = FALSE, times
    = 1)


    # Create the training and test dataset

    diab_train<- diab[training_index,]

    diab_test<- diab[-training_index,]


    # We will use 10-Fold Cross Validations

    diab_control<- trainControl("repeatedcv", number = 10, repeats = 3, search = "random",
    classProbs = TRUE)


    # Create the model using methodnnet (a Neural Network package in R)

    # Note that we have changed the metric here to "Accuracy" instead of # ROC

    nn_model<- train(diabetes ~ ., data = diab_train, method = "nnet", preProc = c("center",
    "scale"), trControl = diab_control, tuneLength = 10, metric = "Accuracy")


    predictions<- predict(nn_model, diab_test[,-ncol(diab_test)])

    cf<- confusionMatrix(predictions, diab_test$diabetes)

    cf


    # >cf

    # Confusion Matrix and Statistics

    # #

    # Reference

    # Prediction neg pos

    # neg 89 19

    # pos 11 34

    #

    # Accuracy : 0.8039

    # 95% CI : (0.7321, 0.8636)

    # No Information Rate : 0.6536

    # P-Value [Acc> NIR] : 3.3e-05

    #

    ```


    Even with 650+ missing values, our model was able to achieve an accuracy of 80%+.


    It can certainly be improved, but as a baseline, it shows the kind of performance
    that can be expected of machine learning models.'
