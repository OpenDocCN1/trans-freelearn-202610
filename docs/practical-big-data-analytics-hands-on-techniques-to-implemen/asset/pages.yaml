- pgno: 77
  md: '# 4

    Big Data With Hadoop


    Hadoop has become the de facto standard in the world of big data, especially over
    the past three to four years. Hadoop started as a subproject of Apache Nutch in
    2006 and introduced two key features related to distributed filesystems and distributed
    computing, also known as MapReduce, that caught on very rapidly among the open
    source community. Today, there are thousands of new products that have been developed
    leveraging the core features of Hadoop, and it has evolved into a vast ecosystem
    consisting of more than 150 related major products. Arguably, Hadoop was one of
    the primary catalysts that started the big data and analytics industry.


    In this chapter, we will discuss the background and core concepts of Hadoop, the
    components of the Hadoop platform, and delve deeper into the major products in
    the Hadoop ecosystem. We will learn about the core concepts of distributed filesystems
    and distributed processing and optimizations to improve the performance of Hadoop
    deployments. We''ll conclude with real-world hands-on exercises using the Cloudera
    Distribution of Hadoop (CDH). The topics we will cover are:


    +   - The basics of Hadoop

    +   - The core components of Hadoop

    +   - Hadoop 1 and Hadoop 2

    +   - The Hadoop Distributed File System

    +   - Distributed computing principles with MapReduce

    +   - The Hadoop ecosystem

    +   - Overview of the Hadoop ecosystem'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - Hive, HBase, and more

    +   - Hadoop Enterprise deployments

    +   - In-house deployments

    +   - Cloud deployments

    +   - Hands-on with Cloudera Hadoop

    +   - Using HDFS

    +   - Using Hive

    +   - MapReduce with WordCount


    # # The fundamentals of Hadoop


    In 2006, Doug Cutting, the creator of Hadoop, was working at Yahoo!. He was actively
    engaged in an open source project called Nutch that involved the development of
    a large-scale web crawler. A web crawler at a high level is essentially software
    that can browse and index web pages, generally in an automatic manner, on the
    internet. Intuitively, this involves efficient management and computation across
    large volumes of data. In late January of 2006, Doug formally announced the start
    of Hadoop. The first line of the request, still available on the internet at `https://issues.apache.org/jira/browse/INFRA-700`,
    was *The Lucene PMC has voted to split part of Nutch into a new subproject named
    Hadoop.* And thus, Hadoop was born.


    At the onset, Hadoop had two core components: **Hadoop Distributed File System
    (HDFS)** and MapReduce. This was the first iteration of Hadoop, also now known
    as Hadoop 1. Later, in 2012, a third component was added known as **YARN (Yet
    Another Resource Negotiator)** which decoupled the process of resource management
    and job scheduling. Before we delve into the core components in more detail, it
    would help to get an understanding of the fundamental premises of Hadoop:'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/8ededb1e0b69e85687f6e488d1044b79_79_0.png)


    Doug Cutting''s post at https://issues.apache.org/jira/browse/NUTCH-193 announced
    his intent to separate Nutch Distributed FS (NDFS) and MapReduce to a new subproject
    called Hadoop.


    # The fundamental premise of Hadoop


    The fundamental premise of Hadoop is that instead of attempting to perform a task
    on a single large machine, the task can be subdivided into smaller segments that
    can then be delegated to multiple smaller machines. These so-called smaller machines
    would then perform the task on their own portion of the data. Once the smaller
    machines have completed their tasks to produce the results on the tasks they were
    allocated, the individual units of results would then be aggregated to produce
    the final result.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Although, in theory, this may appear relatively simple, there are various technical
    considerations to bear in mind. For example:


    +   - Is the network fast enough to collect the results from each individual server?

    +   - Can each individual server read data fast enough from the disk?

    +   - If one or more of the servers fail, do we have to start all over?

    +   - If there are multiple large tasks, how should they be prioritized?


    There are many more such considerations that must be considered when working with
    a distributed architecture of this nature.


    # The core modules of Hadoop


    The core modules of Hadoop consist of:


    +   - **Hadoop Common**: Libraries and other common helper utilities required
    by Hadoop

    +   - **HDFS**: A distributed, highly-available, fault-tolerant filesystem that
    stores data

    +   - **Hadoop MapReduce**: A programming paradigm involving distributed computing
    across commodity servers (or nodes)

    +   - **Hadoop YARN**: A framework for job scheduling and resource management


    Of these core components, YARN was introduced in 2012 to address some of the shortcomings
    of the first release of Hadoop. The first version of Hadoop (or equivalently,
    the first model of Hadoop) used HDFS and MapReduce as its main components. As
    Hadoop gained in popularity, the need to use facilities beyond those provided
    by MapReduce became more and more important. This, along with some other technical
    considerations, led to the development of YARN.


    Let''s now look at the salient characteristics of Hadoop as itemized previously.


    # Hadoop Distributed File System - HDFS


    The HDFS forms the underlying basis of all Hadoop installations. Files, or more
    generally data, is stored in HDFS and accessed by the nodes of Hadoop.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'HDFS performs two main functions:


    +   - **Namespaces**: Provides namespaces that hold cluster metadata, that is,
    the location of data in the Hadoop cluster

    +   - **Data storage**: Acts as storage for data used in the Hadoop cluster


    The filesystem is termed as distributed since the data is stored in chunks across
    multiple servers. An intuitive understanding of HDFS can be gained from a simple
    example, as follows. Consider a large book that consists of Chapters A - Z. In
    ordinary filesystems, the entire book would be stored as a single file on the
    disk. In HDFS, the book would be split into smaller chunks, say a chunk for Chapters
    A - H, another for I - P, and a third one for Q - Z. These chunks are then stored
    in separate racks (or bookshelves as with this analogy). Further, the chapters
    are replicated three times, such that there are three copies of each of the chapters.


    Suppose, further, the size of the entire book is 1 GB, and each chapter is approximately
    350 MB:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_81_0.png)


    Storing the book in this manner achieves a few important objectives:


    +   - Since the book has been split into three parts by groups of chapters and
    each part has been replicated three times, it means that our process can read
    the book in parallel by querying the parts from different servers. This reduces
    I/O contention and is a very fitting example of the proper use of parallelism.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - If any of the racks are not available, we can retrieve the chapters from
    any of the other racks as there are multiple copies of each chapter available
    on different racks.

    +   - If a task I have been given only requires me to access a single chapter,
    for example, Chapter B, I need to access only the file corresponding to Chapters
    A-H. Since the size of the file corresponding to Chapters A-H is a third the size
    of the entire book, the time to access and read the file would be much smaller.

    +   - Other benefits, such as selective access rights to different chapter groups
    and so on, would also be possible with such a model.


    This may be an over-simplified analogy of the actual HDFS functionality, but it
    conveys the basic principle of the technology - that large files are subdivided
    into blocks (chunks) and spread across multiple servers in a high-availability
    redundant configuration. We''ll now look at the actual HDFS architecture in a
    bit more detail:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_82_0.png)


    The HDFS backend of Hadoop consists of:


    +   - **NameNode**: This can be considered the master node. The NameNode contains
    cluster metadata and is aware of what data is stored in which location - in short,
    it holds the namespace. It stores the entire namespace in RAM and when a request
    arrives, provides information on which servers hold the data required for the
    task. In Hadoop 2, there can be more than one NameNode. A secondary NameNode can
    be created that acts as a helper node to the primary. As such, it is not a backup
    NameNode, but one that helps in keeping cluster metadata up to date.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '+   - **DataNode**: The DataNodes are the individual servers that are responsible
    for storing chunks of the data and performing compute operations when they receive
    a new request. These are primarily commodity servers that are less powerful in
    terms of resource and capacity than the NameNode that stores the cluster metadata.


    # Data storage process in HDFS


    The following points should give a good idea of the data storage process:


    All data in HDFS is written in blocks, usually of size 128 MB. Thus, a single
    file of say size 512 MB would be split into four blocks (4 * 128 MB). These blocks
    are then written to DataNodes. To maintain redundancy and high availability, each
    block is replicated to create duplicate copies. In general, Hadoop installations
    have a replication factor of three, indicating that each block of data is replicated
    three times.


    This guarantees redundancy such that in the event one of the servers fails or
    stops responding, there would always be a second and even a third copy available.
    To ensure that this process works seamlessly, the DataNode places the replicas
    in independent servers and can also ensure that the blocks are placed on servers
    in different racks in a data center. This is due to the fact that even if all
    the replicas were on independent servers, but all the servers were on the same
    rack, a rack power failure would mean that no replica would be available.


    The general process of writing data into HDFS is as follows:


    +   1. The NameNode receives a request to write a new file to HDFS.

    +   2. Since the data has to be written in blocks or chunks, the HDFS client (the
    entity that made the request) begins caching data into a local buffer and once
    the buffer reaches the allocated chunk size (for example, 128 MB), it informs
    the NameNode that it is ready to write the first block (chunk) of data.

    +   3. The NameNode, based on information available to it about the state of the
    HDFS cluster, responds with information on the destination DataNode where the
    block needs to be stored.

    +   4. The HDFS client writes data to the target DataNode and informs the NameNode
    once the write process for the block has completed.

    +   5. The target DataNode, subsequently, begins copying its copy of the block
    of data to a second DataNode, which will serve as a replica for the current block.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   6. Once the second DataNode completes the write process, it sends the block
    of data to the third DataNode.

    +   7. This process repeats until all the blocks corresponding to the data (or
    equivalently, the file) are copied across different nodes.


    Note that the number of chunks will depend on the file size. The following image
    illustrated the distribution of the data across 5 datanodes.


    ![](img/8ededb1e0b69e85687f6e488d1044b79_84_0.png)


    The HDFS architecture in the first release of Hadoop, also known as Hadoop 1,
    had the following characteristics:


    +   - Single NameNode: Only one NameNode was available, and as a result it also
    acted as a single point of failure since it stored all the cluster metadata.

    +   - Multiple DataNodes that stored blocks of data, processed client requests,
    and performed I/O operations (create, read, delete, and so on) on the blocks.

    +   - The HDFS architecture in the second release of Hadoop, also known as Hadoop
    2, provided all the benefits of the original HDFS design and also added some new
    features, most notably, the ability to have multiple NameNodes that can act as
    primary and secondary NameNodes. Other features included the facility to have
    multiple namespaces as well as HDFS Federation.'
  merge: -1
  img_proc: true
