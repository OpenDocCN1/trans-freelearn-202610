  md: '# Analyzing oil import prices with Hive


    In this section, we will use Hive to analyze the import prices of oil in countries
    across the world from 1980-2016. The data is available from the site of the OECD
    (Organisation for Economic Co-operation and Development) at the URL shown in the
    following screenshot:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_108_0.png)


    The actual CSV file is available at `https://stats.oecd.org/sdmx-json/data/DP_LIVE/.OILIMPPRICE.../OECD?contentType=csvamp;detail=codeamp;separator=commaamp;csv-lang=en.`'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Since we''ll be loading the data in Hive, it makes sense to download the file
    into our home directory via the terminal in our Cloudera Quickstart CDH environment.
    The steps we''d execute are as follows:


    +   1. Download the CSV file into the CDH environment:


    ```

    [cloudera@quickstart ~]$ cd /home/cloudera;

    [cloudera@quickstart ~]$

    [cloudera@quickstart ~]$ wget -O oil.csv "https://stats.oecd.org/sdmx-json/data/DP_LIVE/.OILIMPPRICE.../OECD?contentType=csv&detail=code&separator=comma&csv-lang=en"

    --2017-07-22 13:10:40-- https://stats.oecd.org/sdmx-json/data/DP_LIVE/.OILIMPPRICE.../OECD?contentType=csv&detail=code&separator=comma&csv-lang=en

    Resolving stats.oecd.org... 78.41.128.136

    Connecting to stats.oecd.org|78.41.128.136|:443... connected.

    HTTP request sent, awaiting response... 200 OK

    Length: unspecified [text/csv]

    Saving to: "oil.csv"


    [ <=> ] 988,528 329K/s in 2.9s


    2017-07-22 13:10:44 (329 KB/s) - "oil.csv" saved [988528]

    ```


    ```

    # Download the csv file

    cd /home/cloudera;

    wget -O oil.csv

    "https://stats.oecd.org/sdmx-json/data/DP_LIVE/.OILIMPPRICE.../OECD?contentType=csv&amp;detail=code&amp;separator=comma&amp;csv-lang=en"

    ```


    +   2. Clean the CSV file. Data cleansing is an area of core importance in data
    science. In practice, it is very common to receive files that will require some
    level of cleansing. This is due to the fact that there could be invalid characters
    or values in columns, missing data, missing or additional delimiters, and so on.
    We noted that various values were enclosed in double-quotes ("). In Hive, we can
    ignore the quotes by specifying the quoteChar property whilst creating the table.
    Since Linux also offers simple and easy ways to remove such characters, we used
    sed to remove the quotation marks:


    ```

    [cloudera@quickstart ~]$ sed -i ''s/"//g'' oil.csv

    ```


    Moreover, in our downloaded file, oil.csv, we observed that there were non-printable
    characters that could cause issues. We removed them by issuing the following command:


    ```

    [cloudera@quickstart ~]$ tr -cd ''\11\12\15\40-\176'' oil_.csv > oil_clean.csv

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: '(Source:

    http://alvinalexander.com/blog/post/linux-unix/how-remove-non-prin

    table-ascii-characters-file-unix)


    Finally, we copied the new file (`oil_clean.csv`) to `oil.csv`. Since the `oil.csv`
    file already existed in the same folder, we were prompted with an overwrite message
    and we entered yes:


    ```

    [cloudera@quickstart ~]$ mv oil_clean.csv oil.csv

    mv: overwrite `oil.csv''? yes

    ```


    # 3. Log in to Cloudera Hue:


    Click on Hue on the Bookmarks bar in the browser. This will bring up the Cloudera
    login screen. Log in using ID `cloudera` and password `cloudera`:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_110_0.png)'
