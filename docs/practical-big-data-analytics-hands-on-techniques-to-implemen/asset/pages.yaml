  img_proc: true
- pgno: 306
  md: 'We can use the in-built K-Means algorithm in R to create 2 clusters and presumably,
    by the number of points in each cluster, it may be possible to get an estimate
    of the number of students who may sign up for each course. The code for the same
    is given as follows:


    ```

    library(data.table)

    library(ggplot2)

    library()


    historyData<- fread("~/Desktop/history.csv")

    ggplot(historyData,aes(american_history,asian_history)) + geom_point() + geom_jitter()


    historyCluster<- kmeans(historyData,2) # Create 2 clusters

    historyData[,cluster:=as.factor(historyCluster$cluster)]

    ggplot(historyData, aes(american_history,asian_history,color=cluster)) + geom_point()
    + geom_jitter()


    # The image below shows the output of the ggplot command. Note that the effect
    of geom_jitter can be seen in the image below (the points are nudged so that overlapping
    points can be easily visible)

    ```


    The following image could provide an intuitive estimate of the number of students
    who may sign up for each course (and thereby determine how many teachers may be
    required):


    ![](img/8ededb1e0b69e85687f6e488d1044b79_306_0.png)'
