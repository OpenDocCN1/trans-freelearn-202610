  md: '# Installing Spark


    The CDH Quickstart VM includes Spark as one of the components, and hence it will
    not be necessary to install Spark separately. We''ll discuss more on Spark in
    the chapter dedicated to the subject.


    Further, our tutorial on Spark will use the Databricks Community Edition which
