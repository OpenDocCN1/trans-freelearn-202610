    into the cyrus directory.

    +   3. Run `processCyrusFiles.sh` as shown. The book contains various Unicode
    and non-printable characters. Additionally, we would like to change all the words
    to lowercase in order to ignore double-counting words that are the same but have
    capitalizations.

    +   4. This will produce a file called `cyrusprint.txt`. This document contains
    the entire text of the book. We will be running our MapReduce code on this text
    file.

    +   5. Prepare `mapper.py` and `reducer.py`. As the name implies, `mapper.py`
    runs the map part of the MapReduce process. Similarly, `reducer.py` runs the reduce
    part of the MapReduce process. The file `mapper.py` will split the document into
    words and assign a value of one to each word in the document. The file, `reducer.py`,
    will read in the sorted output of `mapper.py` and sum the occurrences of the same
    word (by first initializing the count of the word to one and incrementing it for
    each new occurrence of the word). The final output is a file containing the count
    of each word in the document.'
  merge: -1
  img_proc: true
