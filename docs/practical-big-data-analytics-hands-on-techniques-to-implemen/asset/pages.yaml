- pgno: 137
  md: 'Since there can be multiple records for each PlotNumber to accommodate change
    of ownership, we can now define three keys that could uniquely identify each cell
    of data in each record, as follows:


    +   - Row key: `PlotNumber`

    +   - Column key: The column name

    +   - Timestamp key: `RecordDate`


    Each cell in each record in the table will thus have a unique three-value pair
    that distinguishes it from the other cells.


    Databases such as Bigtable, Cassandra, and others employ this method to perform
    data analysis at scale both expeditiously and efficiently.


    Some of the popular columnar databases are listed as follows. Note that there
    may be repetitions as databases can have multiple NoSQL properties (such as both
    in-memory and columnar):


    | Open source | Commercial |

    |---|---|

    | Apache Parquet | Kdb+ |

    | MonetDB | Teradata |

    | MariaDB | SAP HANA |

    | Druid | HP Vertica |

    | HBase | Oracle Exadata |

    | Apache Kudu | ParAccel |

    | Apache Arrow | Actian Vector |


    # Document-oriented databases


    **Document-based or document-oriented** databases became prominent as a means
    of storing data that had variable structures; that is, there was no fixed schema
    that each record would fit into all the time. Additionally, the document may have
    both a structured as well as an *unstructured* part.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Structured data is, in essence, data that can be stored in a tabular format
    such as in a spreadsheet. Data stored in Excel spreadsheets or MySQL tables all
    belong to the class of structured datasets. Data that cannot be represented in
    a strict tabular format such as books, audio files, video files, or social network
    messages are considered unstructured data. As such, in document-oriented databases,
    we will primarily work with structured and unstructured text data.


    An intuitive explanation of data that can contain both structured and unstructured
    text can be found in the example of a **phone diary**. Although these have become
    increasingly rare with the growth of digital data storage, many of us would remember
    a time when phone numbers were written in pocketbooks. The following image shows
    how we store data in a phone diary:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_138_0.png)


    In the preceding example, the following fields can be considered as structured:


    +   - Name

    +   - Address

    +   - Tel and Fax


    There is a line underneath the Address field where the user can enter arbitrary
    information, for example, **met at a conference in 2015, works at company abc**.
    This is essentially a note that the diary keeper wrote when entering the specific
    information. Since there is no defining characteristic of a free-form field such
    as this, it could also contain information such as a second phone number, or an
    alternative address and other information. This would qualify as an unstructured
    text.


    Further, since the other fields are not interdependent, a user may write the address
    but not the phone number, or the name and phone number but not the address.


    A document-oriented database, by virtue of its ability to store schema-free data;
    that is, data that does not conform to any fixed schema such as fixed columns
    with fixed datatypes, would hence be an appropriate platform to store this information.'
  merge: -1
  img_proc: true
