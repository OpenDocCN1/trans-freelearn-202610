- pgno: 181
  md: 'You can reduce the volume of the data downloaded by reducing the value of the
    limit specified at the end of the command to a lower number. In the command, we
    have used 12000000 (12 million), which would let us download the entire 2016 dataset
    representing physician payments. The application will still work if, for example,
    you were to download only one million entries instead of the approximately 11-12
    million records.


    Note: Two approaches are shown below. One using the Token and the other without
    using the Token. Application Tokens allow users to have a higher throttling limit.
    More information can be found at https://dev.socrata.com/docs/app-tokens.html


    ```

    # Replace YOURAPPTOKEN and 12000000 with your API Key and desired record limit
    respectively


    cd /home/packt;


    time wget -O cms2016.csv ''https://openpaymentsdata.cms.gov/resource/vq63-hu5i.csv?$app_token=YOURAPPTOKEN&$query=select
    Physician_First_Name as firstName,Physician_Last_Name as lastName,Recipient_City
    as city,Recipient_State as state,Submitting_Applicable_Manufacturer_or_Applicable_GPO_Name
    as company,Total_Amount_of_Payment_USDollars as payment,Date_of_Payment as date,Nature_of_Payment_or_Transfer_of_Value
    as paymentNature,Product_Category_or_Therapeutic_Area_1 as category,Name_of_Drug_or_Biological_or_Device_or_Medical_Supply_1
    as product where covered_recipient_type like "Covered Recipient Physician" limit
    12000000''

    ```


    Important: It is possible to also download the file without using an app token.
    However, the method should be used sparingly. The URL to download the file without
    using an application token is shown as follows:


    ```

    # Downloading without using APP TOKEN


    wget -O cms2016.csv ''https://openpaymentsdata.cms.gov/resource/vq63-hu5i.csv?$query=select
    Physician_First_Name as firstName,Physician_Last_Name as lastName,Recipient_City
    as city,Recipient_State as state,Submitting_Applicable_Manufacturer_or_Applicable_GPO_Name
    as company,Total_Amount_of_Payment_USDollars as payment,Date_of_Payment as date,Nature_of_Payment_or_Transfer_of_Value
    as paymentNature,Product_Category_or_Therapeutic_Area_1 as category,Name_of_Drug_or_Biological_or_Device_or_Medical_Supply_1
    as product where covered_recipient_type like "Covered Recipient Physician" limit
    12000000''

    ```'
