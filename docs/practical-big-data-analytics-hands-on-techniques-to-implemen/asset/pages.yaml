- pgno: 127
  md: '# The need for NoSQL technologies


    While most database systems were initially designed to manage transactions, the
    growth of internet-related technologies and new types of data that did not require
    the strict puritan nature of transactional systems necessitated the development
    of alternative frameworks.


    For instance, storing the following types of data does not necessarily require
    a complex transactional database:


    +   - Emails

    +   - Media such as audio/video files

    +   - Social network messages

    +   - Website HTML pages

    +   - Many others


    Additionally, the increase in users, and as a consequence, data volume, signaled
    the need for developing more robust architectures with the following characteristics:


    +   - Scalable to manage ever increasing data volume

    +   - Leverage commodity hardware to decrease dependency on expensive hardware

    +   - Provide distributed processing capability across multiple nodes to process
    large-scale datasets

    +   - Be fault-tolerant/provide high availability to handle node and site failures


    Scalable implies that the system can accommodate the increase in data volume by
    increasing the number of nodes, namely, by scaling horizontally. Further, increasing
    the number of nodes should have minimal impact on the performance of the system.


    Fault-tolerant implies that the system should be able to handle node failures,
    which won’t be uncommon in a large distributed system with hundreds if not thousands
    of nodes.


    This led to the development of various groundbreaking and influential systems,
    of which perhaps the most notable were Google Bigtable and Amazon Dynamo.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Google Bigtable


    Bigtable was a project that was initiated in 2004 to manage both scalability and
    performance of the data used for various projects at Google. The seminal paper
    that describes the characteristics of the system was released in 2006 (https://static.googleusercontent.com/media/research.google.com/en//archive/bigtable-osdi06.pdf)
    titled *Bigtable: A Distributed Storage System for Structured Data*. In essence,
    Bigtable was a *column-store* (more on this later) where each value could be uniquely
    identified using a row key, a column key, and a timestamp. It was one of the first
    mainstream databases that epitomized the benefits of storing data in a columnar
    format rather than using the more common row-based layout. Although columnar databases
    such as kdb+ and Sybase IQ existed prior to Bigtable, the use of the method by
    an industry leader to manage petabyte-scale information brought the concept into
    the limelight.


    The official site of Bigtable summarizes the key-value proposition:


    > *Bigtable is designed to handle massive workloads at consistent low latency
    and high throughput, so it’s a great choice for both operational and analytical
    applications, including IoT, user analytics, and financial data analysis.*


    Since the introduction of Bigtable, several other NoSQL databases adopted the
    convention of columnar data layout; most notably HBase and Accumulo, which are
    both Apache projects.


    The Bigtable solution is today available for use at https://cloud.google.com/bigtable/
    where it can be purchased on a subscription basis. The fee for smaller amounts
    of data is quite nominal and reasonable, whereas larger installations would require
    more extensive implementations.


    # Amazon Dynamo


    Shortly after Google announced Bigtable, Amazon followed with the announcement
    of its internal Dynamo database at the 21st ACM Symposium on Operating Systems
    Principles held in October, 2007 (http://www.sosp2007.org).


    In the paper, now available on Werner Vogels'' site at http://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf,
    Amazon described a key-value store called Dynamo that was used to power some of
    Amazon''s most critical internal services such as S3 on AWS. The paper brought
    to bear some key concepts such as key-value storage, consistent hashing, and vector
    clocks, among others, that were implemented in Dynamo.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Thus, Dynamo offered an alternative to Bigtable''s columnar storage for large-scale
    datasets by introducing a fundamentally different method that leveraged key-value
    associations.


    In the next few sections, we will discuss the various types of NoSQL technologies
    and how each of them has characteristics that make them optimal for certain use
    cases. NoSQL has ushered in a paradigm shift in how we treat databases, and has
    provided a much-needed alternative view to data management at a scale that was
    not feasible previously.


    # NoSQL databases


    In our discussion of NoSQL types and databases, we will primarily focus on the
    following characteristics of NoSQL databases:


    +   - In-memory databases

    +   - Columnar databases

    +   - Document-oriented databases

    +   - Key-value databases

    +   - Graph databases

    +   - Other NoSQL types and summary


    Most types of NoSQL used in the industry today fall into one or more of these
    categories. The next few sections will discuss the high-level properties of each
    of these NoSQL offerings, their main advantages, and products in the market that
    fall into the respective categories.


    # In-memory databases


    In-memory databases, as the name implies, leverage the computer memory; that is,
    the RAM, to store datasets. Before we look into how in-memory databases work,
    it would be worthwhile to recollect how data transfer happens in a typical computer:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
