  md: "# Analyzing Nobel Laureates data with MongoDB\n\nIn the first exercise, we\
    \ will use MongoDB, one of the leading document-oriented databases, to analyze\
    \ Nobel Laureates from 1902-present. MongoDB provides a simple and intuitive interface\
    \ to work with JSON files. As discussed earlier, JSON is a flexible format that\
    \ allows representing data using a structured approach.\n\n# JSON format\n\nConsider\
    \ the following table:\n\n| Firstname | Lastname | Information |\n|-----------|----------|-------------|\n\
    | John      | 15       | Subject: History, Grade B |\n| Jack      | 18       |\
    \ Subject: Physics, Grade A |\n| Jill      | 17       | Subject: Physics, Grade\
    \ A+ |\n\nThe Information field contains a column containing multiple values categorized\
    \ under Subject and Grade. Such columns that contain multiple data are also known\
    \ as columns with nested data.\n\nPortability has been an important aspect of\
    \ transferring data from one system to another. In general, ODBC connectors are\
    \ used to transfer data between database systems. Another common format is CSV\
    \ files with the data represented as comma-separated values. CSV files are optimal\
    \ for structured data that doesn't contain more complex data structures such as\
    \ nested values. In such cases, JSON provides an optimal and structured way to\
    \ capture and preserve information using a key-value pair syntax.\n\nIn JSON representation,\
    \ the table can be defined as follows:\n\n```\n(\n  {\n    \"Firstname\":\"John\"\
    ,\n    \"Age\":15,\n    \"Information\":{\n      \"Subject\":\"History\",\n  \
    \    \"Grade\":\"B\"\n    }\n  },\n```"
  merge: -1
  img_proc: true
- pgno: 148
  md: "```\n```json\n{\n  \"Firstname\":\"Jack\",\n  \"Age\":18,\n  \"Information\"\
    :{\n    \"Subject\":\"Physics\",\n    \"Grade\":\"A\"\n  }\n},\n{\n  \"Firstname\"\
    :\"Jill\",\n  \"Age\":17,\n  \"Information\":{\n    \"Subject\":\"Physics\",\n\
    \    \"Grade\":\"A+\"\n  }\n}\n```\n```\n\nNotice that the `Information` key contains\
    \ two keys, `Subject` and `Grade`, with each having a corresponding value.\n\n\
    Today, most product developers and vendors accommodate the ingestion of JSON-formatted\
    \ data. Also, due to the simple manner in which complex relationships can be expressed\
    \ as well as exchanged in text format, JSON has become immensely popular across\
    \ the world in the developer community.\n\nMongoDB captures data in JSON format.\
    \ It internally stores them in BSON—an optimized binary representation of the\
    \ JSON data.\n\n# Installing and using MongoDB\n\nMongoDB is supported on all\
    \ major platforms such as Windows, Linux, and OS X platforms.\n\n![](img/8ededb1e0b69e85687f6e488d1044b79_148_0.png)\n\
    \nThe details for installing MongoDB can be found on their official website at\
    \ `https://docs.mongodb.com/manual/installation/`. Note that we will be using\
    \ the MongoDB Community Edition.\n\nFor our exercise, we will re-use the Linux\
    \ CentOS environment from our Cloudera Hadoop Distribution VM."
