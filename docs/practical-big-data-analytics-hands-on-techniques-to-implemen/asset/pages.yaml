- pgno: 240
  md: 'A simple explanation would help to illustrate this concept. By now, most of
    us are familiar with the concept of spam in emails. Most email accounts also contain
    a separate folder known as Junk, Spam, or a related term. A cursory check of the
    folders will usually indicate the presence of several emails, many of which were
    presumably unsolicited and contain meaningless information.


    The mere task of categorizing emails as spam and moving them to a folder involves
    the application of machine learning. Andrew Ng highlighted this elegantly in his
    popular MOOC course on machine learning.


    In Mitchell''s terms, the spam classification process involves:


    +   - **Task T**: Classifying emails as spam/not spam

    +   - **Performance P**: Number of emails accurately identified as spam

    +   - **Experience E**: The model is provided emails that have been marked as
    spam/not spam and uses that information to determine whether a new email is spam
    or not


    Broadly speaking, there are two distinct types of machine learning:


    +   - Supervised machine learning

    +   - Unsupervised machine learning


    We shall discuss them in turn here.


    # Supervised and unsupervised machine learning


    Let us start with supervised machine learning first.


    # Supervised machine learning


    **Supervised machine learning** refers to machine learning exercises that involve
    predicting outcomes with labelled data. Labelled data simply refers to the fact
    that the dataset we are using to make the predictions (as well as the outcome
    we will predict) has a definite value (irrespective of what it is). For instance,
    classifying emails as spam or not spam, predicting temperature, and identifying
    faces from images are all examples of supervised machine learning.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Vehicle Mileage, Number Recognition and other examples


    Given a dataset containing information on miles per gallon, number of cylinders,
    and such of various cars, can we predict what the value for miles per gallon would
    be if we only had the other values available?


    In this case, our outcome is `mpg` and we are using the other variables of `cyl`
    (Cylinders), `hp` (Horsepower), `gear` (number of gears), and others to build
    a model that can then be applied against a dataset where the values for mpg are
    marked as `MISSING`. The model reads the information in these columns in the first
    five rows of the data and, based on that information, predicts what the value
    for mpg would be in the other rows, as shown in the following image:


    | cyl | hp | wt | gear | mpg |

    | --- | --- | --- | --- | --- |

    | 6 | 110 | 2.620 | 4 | 21 |

    | 6 | 110 | 2.875 | 4 | 21 |

    | 4 | 93 | 2.320 | 4 | 22.8 |

    | 6 | 110 | 3.215 | 3 | 21.4 |

    | 8 | 175 | 3.440 | 3 | 18.7 |

    | 6 | 105 | 3.460 | 3 | MISSING |

    | 8 | 245 | 3.570 | 3 | MISSING |

    | 4 | 62 | 3.190 | 4 | MISSING |

    | 4 | 95 | 3.150 | 4 | MISSING |

    | 6 | 123 | 3.440 | 4 | MISSING |'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'The reason this is considered supervised is that in the course of building
    our machine learning model, we provided the model with information on what the
    outcome was. Other examples include:


    +   - **Recognizing letters and numbers**: In such cases, the input to the model
    are the images, say of letters and numbers, and the outcome is the alpha-numeric
    value shown on the image. Once the model is built, it can then be used against
    pictures to recognize and predict what numbers are shown in the picture. A simple
    example, but very powerful. Imagine if you were given 100,000 images of houses
    with house numbers. The manual way of identifying the house numbers would be to
    go through each image individually and write down the numbers. A machine learning
    model allows us to completely automate the entire operation. Instead of having
    to manually go through individual images, you could simply run the model against
    the images and get the results in a very short amount of time.

    +   - **Self-driving autonomous cars**: The input to the algorithms are images
    where the objects in the image have been identified, for example, person, street
    sign, car, trees, shops, and other elements. The algorithm *learns* to recognize
    and differentiate among different elements once a sufficient number of images
    have been shown and thereafter given an unlabeled image, that is, an image where
    the objects have not been identified is able to recognize them individually. To
    be fair, this is a highly simplified explanation of a very complex topic, but
    the overall principle is the same.


    MNIST Dataset used for number recognition:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # Unsupervised machine learning


    **Unsupervised machine learning** involves datasets that do not have labeled outcomes.
    Taking the example of predicting mpg values for cars, in an unsupervised exercise,
    our dataset would have looked as follows:


    | cyl | hp | wt | gear | mpg |

    |---:|---:|---:|---:|:---|

    | 6 | 110 | 2.620 | 4 | MISSING |

    | 6 | 110 | 2.875 | 4 | MISSING |

    | 4 | 93 | 2.320 | 4 | MISSING |

    | 6 | 110 | 3.215 | 3 | MISSING |

    | 8 | 175 | 3.440 | 3 | MISSING |

    | 6 | 105 | 3.460 | 3 | MISSING |

    | 8 | 245 | 3.570 | 3 | MISSING |

    | 4 | 62 | 3.190 | 4 | MISSING |

    | 4 | 95 | 3.150 | 4 | MISSING |

    | 6 | 123 | 3.440 | 4 | MISSING |


    If all the outcomes are *missing*, it would be impossible to know what the values
    might have been. Recall that the primary premise of machine learning is to use
    historical information to make predictions on datasets whose outcome is not known.
    But, if the historical information itself does not have any identified outcomes,
    then it would not be possible to build a model. Without knowing any other information,
    the values of mpg in the table could be all 0 or all 100; it is not possible to
    tell, as we do not have any data point that will help lead us to the value.


    This is where *unsupervised* machine learning gets applied. In this type of machine
    learning, we are not trying to predict outcomes. Rather, we are trying to determine
    which items are most similar to one another.


    A common name for such an exercise is *clustering*, that is, we are attempting
    to find *clusters* or groups of records that are most similar to one another.
    Where can we use this information and what are some examples of unsupervised learning?'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'There are various news aggregators on the web - sites that do not themselves
    publish information, but collect information from other news sources. One such
    aggregator is Google News. If, say, we had to search for information on the last
    images taken by the satellite Cassini of Saturn, we could do a simple search for
    the phrase on Google News `https://news.google.com/news/?q1=USamp;ned=usamp;hl=en`.
    An example is shown here:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_244_0.png)


    Notice that there is a link for **View all** at the bottom of the news articles.
    Clicking the link will take you to a page with all the other related news articles.
    Surely, Google didn''t manually classify the articles as belonging to the specific
    search term. In fact, Google doesn''t know in advance what the user will search
    for. The search term could have well been *images of Saturn rings from space*.


    So, how does Google know which articles belong to a specific search term? The
    answer lies in the application of clustering or principles of unsupervised learning.
    Unsupervised learning examines the attributes of a specific dataset in order to
    determine which articles are most similar to one another. To do this, the algorithm
    doesn''t even need to know the contextual background.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Suppose you were given two sets of books with no covers, a set of books on
    gardening and a set of books on computer programming. Although you may not know
    the title of the book, it would be fairly easy to distinguish books on computers
    from books on gardening. One set of books would have an overwhelming number of
    terms related to computing, while the other would have an overwhelming number
    of terms related to plants. To make the distinction that there were two distinct
    categories of books would not be difficult just by virtue of the images in the
    books, even for a reader who, let''s assume, is not aware of either computers
    or gardening.


    Other examples of unsupervised machine learning include detection of malignant
    and non-malignant tumors, and gene sequencing.


    # Subdividing supervised machine learning


    Supervised machine learning can be further subdivided into exercises that involve
    either of the following:


    +   - Classification

    +   - Regression


    The concepts are quite straightforward.


    Classification involves a machine learning task that has a discrete outcome -
    a **categorical** outcome. All **nouns** are categorical variables, such as fruits,
    trees, color, and true/false.


    The outcome variables in classification exercises are also known as **discrete**
    or **categorical variables**.


    Some examples include:


    +   - Identifying the fruit given size, weight, and shape

    +   - Identifying numbers given a set of images of numbers (as shown in the earlier
    chapter)

    +   - Identifying objects on the streets

    +   - Identifying playing cards as diamonds, spades, hearts and clubs

    +   - Identifying the class rank of a student based on the student''s grade'
  merge: -1
  img_proc: true
