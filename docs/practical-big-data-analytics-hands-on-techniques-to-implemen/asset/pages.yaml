- pgno: 234
  md: '+   - Categories of machine learning

    +   - Core concepts in machine learning

    +   - Machine learning tutorial


    # What is machine learning?


    **Machine learning** is not a new subject; it has existed in academia for well
    over 70 years as a formal discipline, but known by different names: statistics,
    and more generally mathematics, then **artificial intelligence (AI)**, and today
    as machine learning. While the other related subject areas of statistics and AI
    are just as prevalent, machine learning has carved out a separate niche and become
    an independent discipline in and of itself.


    In simple terms, machine learning involves predicting future events based on historical
    data. We see it manifested in our day-to-day lives and indeed we employ, knowingly
    or otherwise, principles of machine learning on a daily basis.


    When we casually comment on whether a movie will succeed at the box office using
    our understanding of the popularity of the individuals in the lead roles, we are
    applying machine learning, albeit subconsciously. Our understanding of the characters
    in the lead roles has been shaped over years of watching movies where they appeared.
    And, when we make a determination of the success of a future movie featuring the
    same person, we are using historical information to make an assessment.


    As another example, if we had data on temperature, humidity, and precipitation
    (rain) over a period of say, 12 months, can we use that information to predict
    whether it will rain today, given information on temperature and humidity?


    This is akin to common regression problems found in statistics. But, machine learning
    involves applying a much higher level of rigor to the exercise to reach a conclusive
    decision based not only on theoretical calculations, but verification of the calculations
    hundreds or thousands of times using iterative methods before reaching a conclusion.


    It should be noted and clarified here that the term *machine learning* relates
    to algorithms or programs that are executed typically on a computing device whose
    objective it is to predict outcomes. The algorithms build mathematical models
    that can then be used to make predictions. It is a common misconception that machine
    learning quite literally refers to a *machine* that is *learning*. The actual
    implication, as just explained, is much less dramatic.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# The evolution of machine learning


    The timeline of machine learning, as available on Wikipedia (https://en.wikipedia.org/wiki/Timeline_of_machine_learning),
    provides a succinct and insightful overview of the evolution of the field. The
    roots can be traced back to as early as the mid-1700s, when Thomas Bayes presented
    his paper on *inverse probability* at the Royal Society of London. Inverse probability,
    more commonly known today as probability distribution, deals with the problem
    of determining the state of a system given a prior set of events. For example,
    if a box contained milk chocolate and white chocolate, you took out a few at random,
    and received two milk and three white chocolates, can we infer how many of each
    chocolate there are in the box?


    In other words, what can we infer about the unknown given a few points of data
    with which we can postulate a formal theory? Bayes'' work was developed further
    into Bayes'' Theorem by Pierre-Simon Laplace in his text, *Théorie Analytique
    des Probabilités.*


    In the early 1900s, Andrey Markov''s analysis of Pushkin''s Poem, Eugeny Onegin,
    to determine the alliteration of consonants and vowels in Russian literature,
    led to the development of a technique known as Markov Chains, used today to model
    complex situations involving random events. Google''s PageRank algorithm implements
    a form of Markov Chains.


    The first formal application of machine learning, or more generally, AI, and its
    eventual emergence as a discipline, should be attributed to Alan Turing. He developed
    the Turing Test - a way to determine whether a machine is intelligent enough to
    mimic human behavior. Turing presented this in his paper, *Computing Machinery
    and Intelligence*, which starts out with the following:


    > I propose to consider the question, "Can machines think?" This should begin
    with definitions of the meaning of the terms "machine" and "think." The definitions
    might be framed so as to reflect so far as possible the normal use of the words,
    but this attitude is dangerous, If the meaning of the words "machine" and "think"
    are to be found by examining how they are commonly used it is difficult to escape
    the conclusion that the meaning and the answer to the question, "Can machines
    think?" is to be sought in a statistical survey such as a Gallup poll. But this
    is absurd. Instead of attempting such a definition I shall replace the question
    by another, which is closely related to it and is expressed in relatively unambiguous
    words.[...]'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Later in the paper, Turing writes:


    > The original question, "Can machines think?" I believe to be too meaningless
    to deserve discussion. Nevertheless I believe that at the end of the century the
    use of words and general educated opinion will have altered so much that one will
    be able to speak of machines thinking without expecting to be contradicted. I
    believe further that no useful purpose is served by concealing these beliefs.


    Turing''s work on AI was followed by a series of seminal events in machine learning
    and AI. The first neural network was developed by Marvin Misky in 1951, Arthur
    Samuel began his work on the first machine learning programs that played checkers
    in 1952, and Rosenblatt invented the perceptron, a fundamental unit of neural
    networks, in 1957. Pioneers such as Leo Breiman, Jerome Friedman, Vladimir Vapnik
    and Alexey Chervonenkis, Geoff Hinton, and YannLeCun made significant contributions
    through the late 1990s to bring machine learning into the limelight. We are greatly
    indebted to their work and contributions, which have made machine learning stand
    out as a distinct area of research today.


    In 1997, IBM''s Deep Blue beat Kasparov and it immediately became a worldwide
    sensation. The ability of a machine to beat the world''s top chess champion was
    no ordinary achievement. The event gave some much-needed credibility to machine
    learning as a formidable contender for the intelligent machines that Turing envisaged.


    # Factors that led to the success of machine learning


    Given machine learning, as a subject, has existed for many decades, it begs the
    question: why hadn''t it become as popular as it is today much sooner? Indeed,
    the theories of complex machine learning algorithms such as neural networks were
    well known by the late 1990s, and the foundation had been established well before
    that in the theoretical realm.


    There are a few factors that can be attributed to the success of machine learning:


    +   - **The Internet**: The web played a critical role in democratizing information
    and connecting people in an unprecedented way. It made the exchange of information
    simple in a way that could not have been achieved through the pre-existing methods
    of print media communication. Not only did the web transform and revolutionize
    the dissemination of information, it also opened up new opportunities. Google''s
    PageRank, as mentioned earlier, was one of the first large-scale and highly visible
    successes in the application of statistical models to develop a highly successful
    web enterprise.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "+   - **Social media:** While the web provided a platform for communication,\
    \ it lacked a level of flexibility akin to how people interacted with one another\
    \ in the real world. There was a noticeable, but understated, and arguably unexplored\
    \ gap. Tools such as IRC and Usenet were the precursors to social network websites\
    \ such as Myspace, which was one of the first web-based platforms intended to\
    \ create personal networks. By early-mid 2000, Facebook had emerged as the leader\
    \ in social networking. These platforms provided a unique opportunity to leverage\
    \ the Internet to collect data at an individual level. Each user left a trail\
    \ of messages, ripe for collection and analysis using Natural Language Processing\
    \ and other techniques.\n+   \n+   - **Computing hardware:** Hardware used for\
    \ computers developed at an exponential rate. Machine learning algorithms are\
    \ inherently compute and resource intensive, that is, they require powerful CPUs,\
    \ fast disks, and high memory depending on the size of data. The invention of\
    \ new ways to store data on **solid state drives (SSDs)** was a leap from the\
    \ erstwhile process of storing on spinning hard drives. Faster access meant that\
    \ data could be delivered to the CPU at a much faster rate and reduce the I/O\
    \ bottleneck that has traditionally been a weak area in computing. Faster CPUs\
    \ meant it was possible to perform hundreds and thousands of iterations demanded\
    \ by machine learning algorithms in a timely manner. Finally, the demand led to\
    \ the reduction in prices for computing resources, allowing more people to be\
    \ able to afford buying computing hardware that was prohibitively expensive. Algorithms\
    \ existed, but the resources were finally able to execute them in a reasonable\
    \ time and cost.\n+   \n+   - **Programming languages and packages:** Communities\
    \ such as R and Python developers seized the opportunity, and individuals started\
    \ releasing packages that exposed their work to a broader community of programmers.\
    \ In particular, packages that provided machine learning algorithms became immediately\
    \ popular and inspired other practitioners to release their individual code repositories,\
    \ making platforms such as R a truly global collaborative effort. Today there\
    \ are over 10,000 packages in R, up from 2000 in 2010.\n\n# Machine learning,\
    \ statistics, and AI\n\nMachine learning is a term that has various synonyms -\
    \ names that are the result of either marketing activities by corporates or just\
    \ terms that have been used interchangeably. Although some may argue that they\
    \ have different implications, they all ultimately refer to machine learning as\
    \ a subject that facilitates the prediction of future events using historical\
    \ information."
  merge: -1
  img_proc: true
- pgno: 238
  md: 'The commonly heard terms for machine learning include predictive analysis,
    predictive analytics, predictive modeling, and many others. As such, unless the
    entity that publishes material explaining their interpretation of the term and
    more specifically, how it is different, it is generally safe to assume that they
    are referring to machine learning. This is often a source of confusion among those
    new to the subject, largely due to the misuse and overuse of technical verbiage.


    Statistics, on the other hand, is a distinct subject area that has been well known
    for over 200 years. The word is derived from the new Latin, *statisticum collegium*
    (council of state, in English) and the Italian word *statista*, meaning statesman
    or politician. You can visit https://en.wikipedia.org/wiki/History_of_statistics#Etymology
    for more details on this topic. Machine learning implements various statistical
    models, which due to the rigor of computation involved, is distinct from the branch
    of classical statistics.


    AI is also closely related to machine learning, but is a much broader subject.
    It can be loosely defined as systems (software/hardware) that, in the presence
    of uncertainties, can arrive at a concrete decision in (usually) a responsible
    and socially aware manner to attain a target end objective. In other words, AI
    aims to produce actions by systematically processing a situation that involves
    both known and unknown (latent) factors.


    AI conjures up images of smart and sometimes rebellious robots in sci-fi movies,
    just as much as it reminds us of intelligent systems, such as IBM Watson, that
    can parse complex questions and process ambiguous statements to find concrete
    answers.


    Machine learning shares some of the same traits - the step-wise development of
    a model using training data, and measuring accuracy using test data. However,
    AI has existed for many decades and has been a familiar household term. Institutions
    in the US, such as Carnegie Mellon University, have led the way in establishing
    key principles and guidelines of AI.


    The online resources/articles on AI versus machine learning do not seem to provide
    any conclusive answers on how they differ. However, the syllabus of AI courses
    at universities makes the differences very obvious. You can learn more about AI
    at https://cs.brown.edu/courses/csci1410/lectures.html.'
  merge: -1
  img_proc: true
