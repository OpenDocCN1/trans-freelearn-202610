  md: "### https://docs.mongodb.com/manual/aggregation/\n\n# ### Aggregation Examples\n\
    \n# ### Count and aggregate total Nobel laureates by year and sort in descending\
    \ order\n\n### Step 1: Use the `$group` operator to indicate that prize.year will\
    \ be the grouping variable\n### Step 2: Use the `$sum` operator (accumulator)\
    \ to sum each entry under a variable called totalPrizes\n### Step 3: Use the `$sort`\
    \ operator to rank totalPrizes\n\n```\n```javascript\n> db.laureates.aggregate(\n\
    \  {$group: {_id: '$prizes.year', totalPrizes: {$sum: 1}}},\n  {$sort: {totalPrizes:\
    \ -1}}\n);\n\n{ \"_id\" : ( \"2001\" ), \"totalPrizes\" : 15 }\n{ \"_id\" : (\
    \ \"2014\" ), \"totalPrizes\" : 13 }\n{ \"_id\" : ( \"2002\" ), \"totalPrizes\"\
    \ : 13 }\n{ \"_id\" : ( \"2000\" ), \"totalPrizes\" : 13 }\n\n(...)\n```\n```\n\
    \n# ### To count and aggregate total prizes by country of birth\n\n```\n```javascript\n\
    > db.laureates.aggregate(\n  {$group: {_id: '$bornCountry', totalPrizes: {$sum:\
    \ 1}}},\n  {$sort: {totalPrizes: -1}}\n);\n\n{ \"_id\" : \"USA\", \"totalPrizes\"\
    \ : 257 }\n{ \"_id\" : \"United Kingdom\", \"totalPrizes\" : 84 }\n{ \"_id\" :\
    \ \"Germany\", \"totalPrizes\" : 61 }\n{ \"_id\" : \"France\", \"totalPrizes\"\
    \ : 51 }\n...\n```\n```\n\n### MongoDB also supports PCRE (Perl-Compatible) Regular\
    \ Expressions\n### For more information, see\nhttps://docs.mongodb.com/manual/reference/operator/query/regex\n\
    \n# ### Using Regular Expressions: Find count of nobel laureates by country of\
    \ birth whose prize was related to 'radiation' (as indicated in the field motivation\
    \ under prizes)\n\n```\n```javascript\n> db.laureates.aggregate(\n  {$match :\
    \ { \"prizes.motivation\" : /radiation/ }},\n  {$group: {_id: '$bornCountry',\
    \ totalPrizes: {$sum: 1}}},\n  {$sort: {totalPrizes: -1}}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 160
  md: "```\n);\n\n{ \"_id\" : \"USA\", \"totalPrizes\" : 4 }\n{ \"_id\" : \"Germany\"\
    , \"totalPrizes\" : 2 }\n{ \"_id\" : \"the Netherlands\", \"totalPrizes\" : 2\
    \ }\n{ \"_id\" : \"United Kingdom\", \"totalPrizes\" : 2 }\n{ \"_id\" : \"France\"\
    , \"totalPrizes\" : 1 }\n{ \"_id\" : \"Prussia (now Russia)\", \"totalPrizes\"\
    \ : 1 }\n```\n\n#### Result: We see that the highest number of prizes (in which\
    \ radiation was mentioned as a key-word) was the US\n\n### Interestingly, we can\
    \ also do joins and other similar operations that allow us to combine the data\
    \ with other data sources\n\n### In this case, we'd like to join the data in laureates\
    \ with the data from country information obtained earlier\n\n### The collection\
    \ country contains many interesting fields, but for this exercise, we will show\
    \ how to find the total number of nobel laureates by continent\n\n### The Left\
    \ Join\n\n### Step 1: Use the $lookup operator to define the from/to fields, collection\
    \ names and assign the data to a field named countryInfo\n\n### We can join the\
    \ field bornCountryCode from laureates with the field countryCode from the collection\
    \ country\n\n```\n> db.laureates.aggregate(\n  {$lookup: { from: \"country\",\
    \ localField: \"bornCountryCode\", foreignField: \"countryCode\", as: \"countryInfo\"\
    \ }})\n```\n\n```\n{ \"_id\" : ObjectId(\"597e202bcd8724f48de485d4\"), \"id\"\
    \ : \"1\", \"firstname\" : \"Wilhelm Conrad\", \"surname\" : \"Röntgen\", \"born\"\
    \ : \"1845-03-27\", \"died\" : \"1923-02-10\", \"bornCountry\" : \"Prussia (now\
    \ Germany)\", \"bornCountryCode\" : \"DE\", \"bornCity\" : \"Lennep (now (..)\
    \ \"country\" : \"Germany\" } ) } ),\n\"countryInfo\" : ( { \"_id\" : ObjectId(\"\
    597e2f2bcd8724f48de489aa\"),\n\"continent\" : \"EU\", \"capital\" : \"Berlin\"\
    , \"languages\" : \"de\", \"geonameId\" : 2921044, \"south\" : 47.2701236047002,\
    \ ...\n```\n\n### With the data joined, we can now perform combined aggregations\n\
    \n### Find the number of Nobel laureates by continent\n\n```\n> db.laureates.aggregate(\n\
    \  {$lookup: { from: \"country\", localField: \"bornCountryCode\", foreignField:\
    \ \"countryCode\", as: \"countryInfo\" }},\n  {$group: {_id: '$countryInfo.continent',\
    \ totalPrizes: {$sum: 1}}},\n  {$sort: {totalPrizes: -1}}\n```"
