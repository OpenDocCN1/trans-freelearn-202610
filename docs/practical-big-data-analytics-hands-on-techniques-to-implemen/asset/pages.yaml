  md: '# Association rules


    Association rules mining, or **apriori**, attempts to find relationships between
    variables in a dataset. Association rules are frequently used for various practical
    real-world use cases. Given a set of variables, apriori can indicate the patterns
    inherent in a transactional dataset. One of our tutorials will be based on implementing
    an R Shiny Application for apriori and hence, more emphasis is being provided
    for the same in this section.


    For instance, let''s say a supermarket chain is deciding the order for placing
    items on the shelves. An apriori algorithm run against a database containing sales
    transactions would identify the items that, say, are most often bought together.
    This permits the supermarket to determine which items, when placed strategically
    in close proximity to one another, can yield the most sales. This is also often
    referred to as *market basket analysis*.


    A simple example that reflects this could be as follows:


    ```

    # The LHS (left-hand side) leads to the RHS (right-hand side) in the relationships
    shown below.


    # For instance, {Milk, Bread} --> {Butter} indicates that someone purchasing milk
    and bread is also likely to purchase butter.


    {Milk, Bread} --> {Butter}

    {Butter, Egg} --> {Baking Tray}

    {Baking Tray, Butter} --> {Sugar}

    ...

    ```


    In all these cases, the act of purchasing something on the left-hand side led
    to the purchase of the item mentioned on the right-hand side of the expression.


    It is also possible to derive association rules from databases that do not necessarily
    contain *transactions*, but instead use a sliding window to go through events
    along a temporal attribute, such as with the WINEPI algorithm.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'There are 3 primary measures in apriori. To illustrate them, let us use a sample
    dataset containing items purchased in 4 separate transactions:


    | Transaction | Item 1 | Item 2 | Item 3 |

    |---|---|---|---|

    | 1 | Milk | Bread | Butter |

    | 2 | Milk | Egg | Butter |

    | 3 | Bread | Egg | Cheese |

    | 4 | Butter | Bread | Egg |


    # Confidence


    Confidence refers to how often the right-hand side of the apriori expression is
    valid when the left-hand side is valid. For instance, given an expression:


    ```

    {Milk} à {Bread}

    ```


    We would like to know how often Bread was purchased when Milk was also purchased.


    In this case:


    +   - Transaction 1: Milk and Bread are both present

    +   - Transaction 2: Milk is present, but not Bread

    +   - Transactions 3 and 4: Milk is not present


    Hence, based on the what we saw, there were 2 transactions where Milk was present
    and of them, Bread was present in 1 transaction. Hence, the confidence for the
    rule {Milk} à {Bread} would be ½ = 50%


    Taking another expression:


    ```

    {Bread} à {Butter}

    ```


    We would like to know, when Bread was purchased, how often was Butter also purchased?:


    +   - Transaction 1: Bread and Butter are both present

    +   - Transaction 2: There is no Bread (Butter is present, but our point of reference
    is Bread and hence this does not count)

    +   - Transaction 3: Bread is present but no Butter

    +   - Transaction 4: Bread and Butter are both present'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Hence, we have Bread in 3 of the transactions, and Bread & Butter in 2 of the
    3 transactions. Hence, in this case, the ''confidence'' of the rule {Bread} à
    {Butter} is 2/3 = 66.7.


    # Support


    Support refers to the number of times the rule is satisfied relative to the total
    number of transactions in the dataset.


    For instance:


    {Milk} --> {Bread}, occurs in 1 out of 4 Transactions (in Transaction 1). Hence,
    the support for this rule is ¼ = 0.25 (or 25%).


    {Bread} --> {Butter}, occurs in 2 out of 4 Transactions (in Transaction 1 and
    4). Hence, the support for this rule is ½ = 0.50 (or 50%).


    # Lift


    Lift is arguably the most important of the 3 measures; it measures the support
    of the rule relative to the support of the individual sides of the expression;
    put differently, it measures how strong the rule is with respect to a random occurrence
    of the LHS and RHS of the expression. It is formally defined as:


    Lift = Support (Rule)/(Support(LHS) * Support (RHS))


    A low value for lift (say, less than or equal to 1) indicates that the LHS and
    RHS occurrence are independent of one another, whereas a higher lift measure indicates
    that the co-occurrence is significant.


    In our prior example,


    {Bread} --> {Butter} has a lift of:


    Support ({Bread} --> {Butter})

    Support {Bread} * Support {Butter}


    = 0.50/((3/4) * (3/4)) = 0.50/(0.75 * 0.75) = 0.89.


    This indicates that although the Confidence of the rule was high, the rule in
    and of itself is not significant relative to other rules that may be higher than
    1.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'An example of a rule with a Lift higher than 1 would be:


    {Item 1: Bread} --> {Item 3: Cheese}


    This has a Lift of:


    Support {Item 1: Bread --> Item 3: Cheese}/(Support {Item 1: Cheese} * Support
    {Item 3: Cheese})


    = (1/4)/((1/4)*(1/4) = 4.


    # Decision trees


    Decision Trees are a predictive modeling technique that generates rules that derive
    the likelihood of a certain outcome based on the likelihood of the preceding outcomes.
    In general, decision trees are typically constructed similar to a flowchart, with
    a series of nodes and leaves that denote a parent-child relationship. Nodes that
    do not link to other nodes are known as leaves.


    Decision Trees belong to a class of algorithms that are often known as CART (Classification
    and Regression Trees). If the outcome of interest is a categorical variable, it
    falls under a classification exercise, whereas if the outcome is a number, it
    is known as a regression tree.


    An example will help to make this concept clearer. Take a look at the chart:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_292_0.png)'
  merge: -1
  img_proc: true
- pgno: 293
  md: "The chart shows a hypothetical scenario: if school is closed/not closed. The\
    \ rectangular boxes (in blue) represent the nodes. The first rectangle (School\
    \ Closed) represent the *root* node, whereas the inner rectangles represent the\
    \ *internal nodes*. The rectangular boxes with angled edges (in green and italic\
    \ letters) represent the *leaves* (or *terminal nodes*).\n\nDecision Trees are\
    \ simple to understand and one of the few algorithms that are not a 'black box'.\
    \ Algorithms such as those used to create Neural Networks are often considered\
    \ black boxes, as it is very hard - if not impossible - to intuitively determine\
    \ the exact path by which a final outcome was reached due to the complexity of\
    \ the model.\n\nIn R, there are various facilities for creating Decision Trees.\
    \ A commonly used library for creating them in R is `rpart`. We'll revisit our\
    \ `PimaIndiansDiabetes` dataset to see how a decision tree can be created using\
    \ the package.\n\nWe would like to create a model to determine how glucose, insulin,\
