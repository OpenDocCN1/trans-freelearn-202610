  md: '# 6


    # Spark for Big Data Analytics


    As the use of Hadoop and related technologies in the respective ecosystem gained
    prominence, a few obvious and salient deficiencies of the Hadoop operational model
    became apparent. In particular, the ingrained reliance on the MapReduce paradigm,
    and other facets related to MapReduce, made a truly functional use of the Hadoop
    ecosystem possible only for major firms that were invested deeply in the respective
    technologies.


    At the UC Berkeley Electrical Engineering and Computer Sciences (EECS) Annual
    Research Symposium of 2011, a vision for a new research group at the university
    was announced during a presentation by Prof. Ian Stoica (https://amplab.cs.berkeley.edu/about/).
    It laid out the foundation of what was to become a pivotal unit that would profoundly
    change the landscape of Big Data. The AMPLab, launched in February 2011, aimed
    to deliver a scalable and unified solution by integrating Algorithms, Machines,
    and People that could cater to future needs without requiring any major re-engineering
    efforts.


    The most well-known and most widely used project to evolve from the AMPLab initiative
    was Spark, arguably a superior alternative - or more precisely, extension - of
    the Hadoop ecosystem.


    In this chapter, we will visit some of the salient characteristics of Spark and
    end with a real-world tutorial on how to use Spark. The topics we will cover are:


    +   - The advent of Spark

    +   - Theoretical concepts in Spark

    +   - Core components of Spark

    +   - The Spark architecture

    +   - Spark solutions

    +   - Spark tutorial'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# The advent of Spark


    When the first release of Spark became available in 2014, Hadoop had already enjoyed
    several years of growth since 2009 onwards in the commercial space. Although Hadoop
    solved a major hurdle in analyzing large terabyte-scale datasets efficiently,
    using distributed computing methods that were broadly accessible, it still had
    shortfalls that hindered its wider acceptance.


    # Limitations of Hadoop


    A few of the common limitations with Hadoop were as follows:


    +   - **I/O Bound operations**: Due to the reliance on local disk storage for
    saving and retrieving data, any operation performed in Hadoop incurred an I/O
    overhead. The problem became more acute in cases of larger datasets that involved
    thousands of blocks of data across hundreds of servers. To be fair, the ability
    to co-ordinate concurrent I/O operations (via HDFS) formed the foundation of distributed
    computing in Hadoop world. However, leveraging the capability and *tuning* the
    Hadoop cluster in an efficient manner across different use cases and datasets
    required an immense and perhaps disproportionate level of expertise. Consequently,
    the I/O bound nature of workloads became a deterrent factor for using Hadoop against
    extremely large datasets. As an example, machine learning use cases that required
    hundreds of iterative operations meant that the system would incur an I/O overhead
    for each pass of the iteration.

    +   - **MapReduce programming (MR) Model**: As discussed in the earlier parts
    of this book, all operations in Hadoop require expressing problems in terms of
    the MapReduce Programming Model - namely, the user would have to express the problem
    in terms of key-value pairs where each pair can be independently computed. In
    Hadoop, coding efficient MapReduce programs, mainly in Java, was non-trivial,
    especially for those new to Java or to Hadoop (or both).

    +   - **Non-MR Use Cases**: Due to the reliance on MapReduce, other more common
    and simpler concepts such as filters, joins, and so on would have to also be expressed
    in terms of a MapReduce program. Thus, a join across two files across a primary
    key would have to adopt a key-value pair approach. This meant that operations,
    both simple and complex, were hard to achieve without significant programming
    efforts.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - **Programming APIs**: The use of Java as the central programming language
    across Hadoop meant that to be able to properly administer and use Hadoop, developers
    had to have a strong knowledge of Java and related topics such as JVM tuning,
    Garbage Collection, and others. This also meant that developers in other popular
    languages such as R, Python, and Scala had very little recourse for re-using or
    at least implementing their solution in the language they knew best.

    +   - On the whole, even though the Hadoop world had championed the Big Data revolution,
    it fell short of being able to democratize the use of the technology for Big Data
    on a broad scale.


    The team at AMPLab recognized these shortcomings early on, and set about creating
    Spark to address these and, in the process, hopefully develop a new, superior
    alternative.


    # Overcoming the limitations of Hadoop


    We''ll now look at some of the limitations discussed in the earlier section and
    understand how Spark addresses these areas, by virtue of which it provides a superior
    alternative to the Hadoop ecosystem.


    A key difference to bear in mind at the onset is that Spark does NOT need Hadoop
    in order to operate. In fact, the underlying backend from which Spark accesses
    data can be technologies such as HBase, Hive and Cassandra in addition to HDFS.


    This means that organizations that wish to leverage a standalone Spark system
    can do so without building a separate Hadoop infrastructure if one does not already
    exist.


    The Spark solutions are as follows:


    +   - **I/O Bound operations**: Unlike Hadoop, Spark can store and access data
    stored in *memory*, namely RAM - which, as discussed earlier, is 1,000+ times
    faster than reading data from a disk. With the emergence of SSD drives, the standard
    in today''s enterprise systems, the difference has gone down significantly. Recent
    NVMe drives can deliver up to 3-5 GB (Giga Bytes) of bandwidth per second. Nevertheless,
    RAM, which averages about 25-30 GB per second in read speed, is still 5-10x faster
    compared to reading from the newer storage technologies. As a result, being able
    to store data in RAM provides a 5x or more improvement to the time it takes to
    read data for Spark operations. This is a significant improvement over the Hadoop
    operating model which relies on disk read for all operations. In particular, tasks
    that involve iterative operations as in machine learning benefit immensely from
    the Spark''s facility to store and read data from memory.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - **MapReduce programming (MR) Model:** While MapReduce is the primary
    programming model through which users can benefit from a Hadoop platform, Spark
    does not have the same requirement. This is particularly helpful for more complex
    use cases such as quantitative analysis involving calculations that cannot be
    easily *parallelized*, such as machine learning algorithms. By decoupling the
    programming model from the platform, Spark allows users to write and execute code
    written in various languages without forcing any specific programming model as
    a pre-requisite.

    +   - **Non-MR use cases:** Spark SQL, Spark Streaming and other components of
    the Spark ecosystem provide a rich set of functionalities that allow users to
    perform common tasks such as SQL joins, aggregations, and related database-like
    operations without having to leverage other, external solutions. Spark SQL queries
    are generally executed against data stored in Hive (JSON is another option), and
    the functionality is also available in other Spark APIs such as R and Python.

    +   - **Programming APIs:** The most commonly used APIs in Spark are Python, Scala
    and Java. For R programmers, there is a separate package called `SparkR` that
    permits direct access to Spark data from R. This is a major differentiating factor
    between Hadoop and Spark, and by exposing APIs in these languages, Spark becomes
    immediately accessible to a much larger community of developers. In Data Science
    and Analytics, Python and R are the most prominent languages of choice, and hence,
    any Python or R programmer can leverage Spark with a much simpler learning curve
    relative to Hadoop. In addition, Spark also includes an interactive shell for
    ad-hoc analysis.


    # Theoretical concepts in Spark


    The following are the core concepts in Spark:


    +   - Resilient distributed datasets

    +   - Directed acyclic graphs

    +   - SparkContext

    +   - Spark DataFrames

    +   - Actions and transformations

    +   - Spark deployment options'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Resilient distributed datasets


    Resilient distributed datasets, more commonly known as RDDs, are the primary data
    structure used in Spark. RDDs are essentially a collection of records that are
    stored across a Spark cluster in a distributed manner. RDDs are immutable, which
    is to say, they cannot be altered once created. RDDs that are stored across nodes
    can be accessed in parallel, and hence support parallel operations natively.


    The user does not need to write separate code to get the benefits of parallelization
    but can get the benefits of actions and transformations of data simply by running
    specific commands that are native to the Spark platform. Because RDDs can be also
    stored in memory, as an additional benefit, the parallel operations can act on
    the data directly in memory without incurring expensive I/O access penalties.


    # Directed acyclic graphs


    In computer science and mathematics parlance, a directed acyclic graph represents
    pairs of nodes (also known as vertices) connected with edges (or lines) that are
    unidirectional. Namely, given Node A and Node B, the edge can connect A à B or
    B à A but not both. In other words, there isn''t a circular relationship between
    any pair of nodes.


    Spark leverages the concept of DAG to build an internal workflow that delineates
    the different stages of processing in a Spark job. Conceptually, this is akin
    to creating a virtual flowchart of the series of steps needed to obtain a certain
    output. For instance, if the required output involves producing a count of words
    in a document, the intermediary steps map-shuffle-reduce can be represented as
    a series of actions that lead to the final result. By maintaining such a map,
    Spark is able to keep track of the dependencies involved in the operation. More
    specifically, RDDs are the nodes, and transformations, which are discussed later
    in this section, are the edges of the DAG.


    # SparkContext


    A SparkContext is the entry point for all Spark operations and means by which
    the application connects to the resources of the Spark cluster. It initializes
    an instance of Spark and can thereafter be used to create RDDs, perform actions
    and transformations on the RDDs, and extract data and other Spark functionalities.
    A SparkContext also initializes various properties of the process, such as the
    application name, number of cores, memory usage parameters, and other characteristics.
    Collectively, these properties are contained in the object SparkConf, which is
    passed to SparkContext as a parameter.'
  merge: -1
  img_proc: true
