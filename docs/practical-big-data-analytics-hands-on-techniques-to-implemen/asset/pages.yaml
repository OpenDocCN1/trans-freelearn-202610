- pgno: 344
  md: '# Brytlyt


    **Brytlyt** is a recent entrant in the space of GPU databases. It is complemented
    by a visualization product called **Spotlyt**. Early testing has shown that Brytlyt
    surpasses several challenging benchmarks. However, how well it generalizes in
    other use cases remains to be seen.


    Brytlyt is available in the Amazon AWS Marketplace (https://aws.amazon.com/marketplace/pp/B074JZNSWZ?qid=1513342415797sr=0-1&ref_=srh_res_product_title)
    for those wish to try it.


    # MapD


    MapD was one of the early developers of a commercial GPU database platform. Similarly
    to Brytlyt, it has also shown impressive early results. Nevertheless, as GPU-based
    databases are still in their early stages, popular use and adoption will ultimately
    determine whether they will become commonplace in enterprise.


    One of the primary challenges of GPU-based databases is the need to configure
    a GPU-based system properly. This can require specialized skills, as using GPU
    cards for computation is quite different than using GPU cards for common tasks
    such as rendering images. Due to this, users wishing to try out GPU-based databases
    prior to adopting a formal version would find it easier to leverage a pre-configured
    image in AWS (AMI Image), which would require minimal system configuration.


    # Other common databases


    There are various other types of databases, such as ones that are used for analyzing
    streaming data (Amazon Kinesis), and those that process data using specialized
    Accelerator Cards using FPGAs from Baidu.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Enterprise data science – machine learning and AI


    **Data science solutions** have matured rapidly over the past 4 - 5 years, similar
    to the movement in other areas of data science such as NoSQL, Hadoop, and other
    data mining solutions. Although many of the prior database systems also incorporate
    key features of *data science*, such as machine learning and others, this section
    highlights some of the solutions at a high level that are primarily used for machine
    learning and/or AI, as opposed to data management.


    Indeed, the distinction between *Big Data* products and *data science* products
    has become blurred, since products that were originally intended for Big Data
    handling have incorporated key features of data science, and vice versa.


    # The R programming language


    **R**, as we have seen in prior chapters, is an environment originally designed
    for statistical programming. It emerged out of a project at the University of
    New Zealand, where *Ross Ihanka* and *Robert Gentleman* developed R as a variation
    of the S programming language developed by John Chambers in Bell Labs. Although
    R was initially intended for *statistical programming*, over the last 7 to 8 years
    it has evolved into a mature, multifaceted language with enhanced support for
    a diverse range of related disciplines such as machine learning, high performance
    computing, visualization, econometrics, TimeSeries analysis, and much more. Some
    of these areas are also described with accompanying information at https://cran.r-project.org/web/views/.


    A commercial version of R with enterprise support was available from Revolution
    Analytics. In 2015, it was rebranded as **Microsoft R Open** (open-source version)
    and **Microsoft R Server** (commercial version).


    Although marketed under the Microsoft brand, note that Microsoft R is also available
    for Linux and Mac OS.


    Popular machine learning packages in R include `e1071`, `randomForest`, `gbm`,
    `kernlab`, `arules`, and many more. These are listed at https://cran.r-project.org/web/views/MachineLearning.html.
    Another popular package, called caret, acts as a wrapper around various algorithm
    packages and provides a useful unified interface to run algorithms without having
    to conform to the nuances of the packages individually.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'R also supports multicore programming via packages such as `multicore`, `doMC`,
    and others. These are listed at https://cran.r-project.org/web/views/HighPerformanceComputing.html.


    # Python


    The `scikit-learn` package in Python is arguably the most comprehensive machine
    learning package among all platforms that incorporates an extensive list of machine
    learning algorithms. It is also considered to be faster compared to R, and is
    the tool of choice for various enterprise organizations. The following screenshot
    shows the web page from which we can download the `scikit-learn` package:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_346_0.png)'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'A commercially supported enterprise version of Python that comes pre-configured
    with useful machine learning and data mining packages is Anaconda, available from
    Continuum Analytics. A cloud version of Anaconda called Anaconda Cloud allows
    new users to start leveraging the features of Anaconda Python without the overhead
    of downloading and installing it separately.


    # OpenCV, Caffe, and others


    Image recognition is one of the more successful areas of machine learning. While
    most machine learning tasks require a relatively long period of time before their
    true benefits can be measured and quantified, image recognition is a familiar
    subject area that can be readily understood. In essence, it involves identifying
    objects and correctly categorizing them. It has several applications, ranging
    from identifying license plate numbers to face recognition, and is available in
    mobile devices and robotics.


    OpenCV provides a standard interface for various image recognition tasks, and
    can also leverage hardware acceleration features to optimize performance.


    Other well-known machine learning software for image processing include Caffe,
    cuDNN, TensorFlow, and others. Note that these packages are not limited to simply
    image recognition, but can be also used for other deep learning use cases.


    # Spark


    The MLlib library in Spark provides a formal implementation of various machine
    learning algorithms that can be used in a Spark platform. The availability of
    pySpark makes the process of using the functionality easier for those with Python
    programming knowledge. If the organization had an existing Spark platform, it
    would be worth exploring the machine learning capabilities in MLlib.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'The following screenshot gives you a brief overview of MLlib:


    ![](img/8ededb1e0b69e85687f6e488d1044b79_348_0.png)


    # Deep learning


    Neural Networks with multiple hidden layers (generally more than two) and/or nodes
    are generally categorized as **deep learning**. Several contemporary advances
    in machine learning, such as autonomously driving cars, are a direct result of
    the use of deep learning for practical day-to-day tasks.


    There are various deep learning frameworks/packages, and some notable ones include:


    +   - TensorFlow

    +   - cuDNN

    +   - Theano

    +   - Torch

    +   - PaddlePaddle, from Baidu'
  merge: -1
  img_proc: true
