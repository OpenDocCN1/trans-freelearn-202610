- pgno: 383
  md: '# Summary


    In this chapter, we discussed the requirements for deploying enterprise-scale
    data science infrastructures, both at a software as well as a hardware level.
    We shared key common questions around such initiatives at a management level.
    This was followed by an extensive section on key enterprise solutions that are
    being used for data mining and machine learning in large organizations.


    The tutorial involved launching an RStudio Server on Amazon Web Services (a cloud-based
    system). AWS has become the leading provider of cloud services in the world today,
    and the exercise showed how simple it can be to launch entire machines in a few
    seconds. Appropriate pros and cons about the judicious and careful use of AWS
    to prevent very expensive charges were mentioned.


    The next and final chapter will include some closing thoughts, the next steps,
    and links to useful resources you can use to learn more about the topics that
    have been discussed in this book.'
