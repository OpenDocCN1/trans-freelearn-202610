- pgno: 352
  md: 'The screenshot below is from IBM Watson, one of the most well-known platforms
    for machine learning and artificial intelligence. The platform gained prominence
    after it won the Jeopardy championship in 2011 [Source: https://www.techrepublic.com/article/ibm-watson-the-inside-story-of-how-the-jeopardy-winning-supercomputer-was-born-and-what-it-wants-to-do-next/].
