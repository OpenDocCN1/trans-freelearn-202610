    # Tip


    Several **commercial off-the-shelf (COTS)** DevOps or CI/CD tools are available
    to do most of the heavy lifting and provide helpful insights into the most common
    deployment errors. Some of the most popular products include *Gearset*, *Copado*,
    *Salto*, and *AutoRABIT*. Perform your own research and evaluate whether a DevOps
    tool is beneficial for your Salesforce program at this stage of its life cycle.


    The decision about the development model and DevOps tool needs to consider who
    will be managing your Salesforce org and continuous improvement *after* the initial
    release of your solution. If you plan to manage your Salesforce org yourself,
    the chosen development model should align with the available resources’ competencies
    – or planned training and enablement.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Let’s look at the environments you should consider for development and testing
    in Salesforce.


    # Understanding Salesforce sandboxes


    When creating a Salesforce sandbox, you are creating a copy of your Salesforce
    production environment. You can also clone a sandbox and create a new sandbox
    that way.


    If your Salesforce program/project is following either the org-based development
    model or the package-based development model, you should be using a version control
    repository as the source of truth from which you are migrating your metadata to
    new sandboxes.


    You need to use sandboxes to keep your development and testing environments separate
    from each other and separate from production. You should never develop in production
    because the implication of a broken feature can impact business operations, corrupt
    your data, and risk security compliance.


    You need separate environments for development, and for different types of testing
    – determining which sandboxes to use is what is referred to as your **environment
    strategy**.


    Let’s take a look at the sandbox setup and deployment flow of our scenario company,
    PME, which has multiple development streams with separate teams working on its
    Salesforce solution:


    ![](img/307881206539c45e128c538a4b6912f8_190_0.png)


    Figure 7.2 – PME’s sandbox setup'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Let’s look at the key differences between the available Salesforce sandbox
    types in the following table:


    | Sandbox | Full Sandbox | Partial Copy Sandbox | Developer Pro Sandbox | Developer
    Sandbox |

    |---|---|---|---|---|

    | Appropriate use | System integration testing (SIT), UAT, batch data, performance
    or load testing, staging, and training | QA, SIT, UAT, and training | Development
    and QA | Development and QA |

    | Included at refresh | Metadata and all data | Metadata and sample data | Metadata
    | Metadata |

    | Available storage | Same as prod | Data: 5 GB

    File: Same as prod | Data: 1 GB

    File: 1 GB | Data: 200 MB

    File: 200 MB |

    | Sandbox Templates | Available | Required | Not available | Not available |

    | Refresh interval | 29 days | 5 days | 1 day | 1 day |

    | Cost as a percentage of net spend with Salesforce – per additional sandbox |
    30% | 20% | 5% | N/A |'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Table 7.3 – Salesforce sandbox type overview


    The number of different types of sandboxes available to you depends on the edition
    of your Salesforce org. You can purchase additional sandboxes.

    Refer to the *Sandbox Licenses and Storage Limits by Type* **Salesforce Help**
    article at https://help.salesforce.com/s/articleView?id=sf.data_sandbox_environments.htm&type=5.


    If you are developing using the org-based development model or the package-based
    development model, you may opt to use **scratch orgs**. They are short-lived (1-30
    days) development environments that are created based on a configuration file.
    Working with scratch orgs requires a more advanced skillset compared to working
    with traditional Salesforce sandboxes.


    # Tip


    You can learn more about Salesforce development models and environments by following
    the Trail mix *Architect Journey: Development Lifecycle and Deployment* page at
    https://trailhead.salesforce.com/users/strailhead/trailmixes/architect-dev-lifecycle-and-deployment.


    You can learn more about scratch orgs in the *Salesforce DX Developer Guide* documentation
    at https://developer.salesforce.com/docs/atlas.en-us.sfdx_dev.meta/sfdx_dev/sfdx_dev_develop.htm.


    After determining your development model and setting up your sandboxes, let’s
    turn to your development process.


    # Establishing your development process


    One of the key components of the development process is the **sprint**. A sprint
    is a term used in **Scrum** to describe a predefined duration in which the aim
    is to develop working software. We have already mentioned that a'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'sprint’s duration is not set in stone – it can be decided that it will last
    anywhere from 1-4 weeks. Let’s look at what you should consider when determining
    your sprint duration:


    +   - Will user stories need refinement during the sprints?

    +     - *If yes*, this will take time away from development. Having a short (1-2
    weeks) sprint duration will impact the expected sprint efficiency beyond what
    is sensible, as the overhead for refinement and agile ceremonies is greater than
    the available time for development. If you need continuous backlog refinement
    sessions, increase your sprint duration.

    +     - *If no*, meaning you have already refined and provided solutions to your
    user stories upfront, then you may opt for a shorter sprint duration, though a
    1 week sprint duration is not recommended when building an initial release.


    # Important note


    It’s a common misconception that agile requires less discipline compared to waterfall.
    The opposite is true: running a pure agile setup requires enormous discipline,
    well-defined processes, and commonly agreed-upon definitions of ready and done.
    In waterfall – in any one phase of a project – there is only one overall task
    at hand, for example, designing a solution. In pure agile, on the other hand,
    your team needs to go through the entire development life cycle (or most of it)
    from user story creation, design, build, deployment, testing, and validation.
    With many of the steps being performed by different team members, a high level
    of discipline is required to ensure a smooth handover and clear processes. The
    benefit of running a pure agile setup is also directly correlated to the combined
    experience and agile maturity and discipline of the team.


    Let’s dive into the development process in more detail.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Maximizing value from agile ceremonies


    In order to make the most of your agile ceremonies, you first need to have a solid
    understanding of the nature, purpose, and value of them.


    Let’s have a look at agile ceremonies:


    +   - **Sprint planning:** The goal of sprint planning is to have a *committed
    sprint backlog* of user stories and a clearly articulated sprint goal.

    +   Before sprint planning, the PO should order the backlog – this is sometimes
    done together with the BA in a **backlog refinement session**.

    +   A typical agenda for sprint planning goes as follows:

    +     - Review team capacity for the sprint:

    +       - If you have estimated your user stories using the time format, consider
    the available resources in the development team and account for sprint efficiency.

    +       - If you’re using story points, also consider available resources and
    adjust the target story point for the sprint based on prior sprint velocity. For
    the first sprint, this is tricky as there is no history: rely on the development
    team’s assessment as you go through the user stories.

    +     - Next, the PO presents user stories one at a time, and the development
    team asks clarifying questions.


    Tip


    You may or may not require user stories to meet your definition of ready for them
    to be eligible for sprint planning – and to be able to be pulled into the'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'sprint. If you allow this, make sure the PO, BA, and architects allocate time
    at the beginning of the sprint to get them ready for development.


    +   - The development team pulls user stories into the sprint backlog until the
    development team’s capacity is met.

    +   - If you have estimated your user stories using the time format, capacity
    is met when the cumulative sum of the user stories pulled into the sprint reaches
    the team’s capacity for the sprint.

    +   - If you’re using the story point method, team members provide an estimate
    for the user story using **story point pokering**, whereby a number in the Fibonacci
    sequence is used. If the estimates are close, the team can settle easily on a
    story point for the story and move on to the next user story. If there’s a great
    disparity between estimates, the team members with high and low estimates voice
    their reasoning for their estimates. This is a great way to make sure team members
    share an understanding of the user story and perhaps uncover complexity that wasn’t
    obvious to all members. The team settles on a story point for the story and moves
    on.


    # Tip


    For virtual story point pokering, https://www.scrumpoker-online.org is a great
    online tool.


    +   - When the team capacity in story points is met, the stories that have been
    pulled into the sprint are committed.


    +   - **Daily stand-up**: This is a short (~15 minutes) session, typically every
    morning, where each agile team member answers three simple questions: what did
    I do yesterday to progress towards the sprint goal, what am I planning to do today
    to progress towards the sprint goal, and what blockers are preventing me?'
  merge: -1
  img_proc: true
- pgno: 196
  md: '+   - The daily stand-up is *not a project status meeting*, nor is it a meeting
    for resolving blocking issues. Identified actions should be executed offline after
    the stand-up.

    +   - **Sprint review (demo)**: A sprint review is a session where your agile
    team shows a wider group of stakeholders what was completed in the sprint. The
    sprint review serves two main purposes:

    +     - To show your solution to select end users (change agents), thereby embedding
    change management throughout the development phase.

    +     - To get feedback on the solution that can be assessed and potentially incorporated
    into later sprints. This creates a sense of ownership for the participants in
    the sprint review – laying a solid foundation for them to act as ambassadors for
    your solutions when it’s time to roll out.


    # Tip


    Ideally, the PO from the agile team drives the sprint review, demos what was developed,
    and responds to feedback from the participants. This will ensure the solution
    ownership is clear, and also that it is gradually internalized by your PO and
    your company.


    While it may be the responsibility of your implementation partner to consolidate
    the feedback from participants, your PO is ultimately responsible for determining
    the priority of each feedback item and communicating decisions back to the stakeholders.


    +   - **Sprint retrospective**: In this session, the agile team members, PO, scrum
    master, and the development team evaluate how the past sprint went and what improvements
    they can make to optimize the development process in the spirit of continuous
    improvement.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - It is facilitated by the scrum master, who is also responsible for making
    sure actions agreed upon in the sprint retrospective are executed.


    Let’s look at the flow of user stories before and during a sprint.


    # Managing your Kanban board


    How your agile team manages the flow of user stories has a great impact on the
    sprint velocity. The members of your agile team should know your development process
    and, critically, how handover is done.


    Let’s take a look at how a Kanban board could be set up (the specific configuration
    for your Salesforce project will vary based on your chosen delivery methodology):


    ![](img/307881206539c45e128c538a4b6912f8_197_0.png)


    Figure 7.3 – Kanban board columns example


    A new user story will start in the Product Backlog column. Your PO will work on
    the user story together with the business analyst to progress the user story to
    meet the definition of ready. This, again, will depend on your chosen delivery
    methodology but should meet the following criteria:


    +   - The user story is complete with persona, need, and purpose.

    +   - Additional context and supporting documents are provided.

    +   - Acceptance criteria are defined.

    +   - In some development processes, the user story must also have a solution
    design provided and approved by a design authority. We’ll cover this in more detail
    in the *Governing your Salesforce project in the development phase* section.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'When a user story meets your definition of ready, your PO moves it to the **Ready**
    column. The story is ready for sprint planning.


    User stories are pulled into the **Sprint Backlog** column during sprint planning.
    As the sprint begins, the development team will pick user stories at the top and
    move them to the **Development** column. Each development team *member* should
    only have one user story in development at a time.


    # Tip


    While practical Salesforce configuration and development are not in the scope
    of this book, there are several other great books that cover those topics, including
    *Low-Code Application Development with Salesforce* by Enrico Murro (https://www.amazon.co.uk/Hands-Low-Code-Application-Development-Salesforce/dp/1800209770).


    If a development team member is blocked from completing the development of a user
    story, they should move it to the **Blocked** column and notify the scrum master
    by writing a comment on the user story. The scrum master will prioritize resolving
    the blocking issue.


    # Tip


    In order to minimize the risk of user stories going stale or becoming outdated,
    and reduce the waiting time because of dependencies, you should aim to have user
    stories in development (to the right of the Sprint Backlog Kanban column) for
    the shortest time possible. The way to ensure this is for all agile team members
    to work on user stories assigned to them *starting from the right side* of the
    Kanban board. For example, your PO should *prioritize* validating user stories
    and moving them to the **Done** column *before* focusing on getting user stories
    ready for development. Similarly, a developer should *prioritize* addressing defects
    identified by a QA specialist *before* starting development of a new user story.


    When a user story is developed and deployed to a QA sandbox, the development team
    member moves the user story to the **Testing** column and writes a comment on
    the user story, letting the QA specialist know it is'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'ready for testing, along with any specific instructions. In some cases, the
    developer of a user story is required to provide a test script.


    Following a successful test pass, the QA specialist moves the user story to the
    **Validating** column for the PO to validate the user story against acceptance
    criteria. If the user story did not pass testing, the QA specialist will create
    a defect issue describing what failed and then move the user story back to Development
    and assign it back to the developer to fix the issue.


    When a user story is validated by the PO, the PO will move the user story to Done.


    # Important note


    This chapter describes the user story flow in the context of building an initial
    release of your Salesforce solution – you are not yet deploying and releasing
    it to production for users to benefit from. We’ll cover that process in *Chapter
    9*, *Deploying Your Release and Migrating Data to Production*.


    After your initial release is live in production, you will enter a phase of continuous
    improvement with continuous development and deployment of user stories. In that
    setup, your definition of done will include more steps than described in this
    chapter. In *Chapter 12*, *Evolving Your Salesforce Org and DevOps Capabilities*,
    we’ll discuss this in more detail.


    Next, let’s look at how to govern your Salesforce project through the development
    phase.


    # Governing your Salesforce project in the development phase


    There are many things happening in the development phase of your Salesforce project,
    and it can be overwhelming to comprehend it all and get an overview. Your responsibility
    in the building and testing of your initial release is simple:'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'To create an environment, a structure, and processes to maximize the high-quality
    value output of your development team.


    At a high level, you want to ensure your agile development team is:


    +   - **Building the right thing**: This means ensuring your Salesforce solution
    will:

    +     - Be well received and used by the end users

    +     - Meet your objectives and financial targets set out in your business case

    +   - **Efficient**: This involves making sure your agile development team is
    building your solution in the most efficient manner possible:

    +     - **Value**: Output x quality

    +     - **Cost-efficient**


    In the following sections, we’ll break down what this means in practice.


    # Salesforce project governance


    There are effectively two key aspects of governance you need to manage in your
    Salesforce project:


    +   - Salesforce project *delivery governance*

    +   - Salesforce *platform governance*


    To deliver your Salesforce project in accordance with these aspects, you should
    consider putting in place the following governance mechanism:'
  merge: -1
  img_proc: true
- pgno: 201
  md: '+   - **Design authority (DA)**: In this forum, proposed solution designs from
    the development team members or architects are continuously reviewed to ensure
    the solutions introduced to your Salesforce org align with the target solution
    architecture, abide by your defined development standards, and follow general
    best practices for declarative and programmatic development and architecture.

    +   - Participants in the DA:

    +     - There are many configurations of DAs, but the key thing to note is that
    it is not purely a technical meeting. It is critical that your PO(s) participates
    in presenting the background of the user story (or new epic).

    +     - A technical architect and solution architect should participate in reviewing
    proposed solution designs and provide feedback and suggestions for improvements
    to the design to the development team.

    +   - The focus of the DA:

    +     - The DA should focus – from a risk-based perspective – on proposed solutions,
    which include the following solution components:

    +   - Code

    +   - Data model changes

    +   - Security and data sharing

    +   - Complex automation

    +   - Integration'
  merge: -1
  img_proc: true
- pgno: 202
  md: '+   - The DA should be mindful of the degree of customization of the aggregated
    proposed solutions.

    +   - **Change control board:** As you progress through the sprints in the development
    phase, you will become more familiar with your Salesforce solution. Your PO will
    likely be inspired and will want to include additional features beyond the originally
    planned scope. To manage this process (common in fixed price/fixed scope projects),
    you can establish a change control board to address and manage change requests
    in the development phase.

    +   - There should be a threshold for what level of change your change control
    board should be involved in:

    +     - **Small change:** Empower your agile team to manage these

    +     - **Medium change:** Possibly address these to your change control board,
    depending on their impact on the project timeline and risk

    +     - **Large change:** These inherently impact the project timeline and must
    be presented to your change control board

    +   - Recommended participants: PO, project sponsor, PM, and Salesforce architect

    +   - **Steering committee:** This is the highest escalation point for your project.
    The steering committee is accountable for the project and executes this by providing
    guidance and support to the PMs and architects. It meets on a regular cadence
    (bi-weekly or monthly) to do the following:

    +     - Track the development progress and status against the plan

    +     - Track the project’s spend versus budget

    +     - Address issues and mitigate risks'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Important note


    Shield the development team members from this project meeting.


    # Important note


    The most optimal delivery governance *configuration* for your Salesforce project
    depends on the nature and scope of your Salesforce project and the number of agile
    teams. If you have multiple teams or streams, you should consider following one
    of the more advanced **Scaled Agile Framework** (**SAFe**) configurations.


    Let’s dive deeper into testing your Salesforce solution.


    # Governing the quality of your Salesforce solution


    Your implementation partner may be responsible for the quality of the solutions
    they deliver, but your company is ultimately accountable for the solutions you
    ask your company’s users, customers, and partners to use and interact with. Therefore,
    it is important that you are familiar with the key methods of testing and quality
    assurance.


    Let’s go over the two types of testing in Salesforce you need to understand:


    +   - **User story testing** (**functional testing**): This is a commonly used
    manual test method whereby a single functionality (or user story) is tested to
    ensure it works as expected. The tester should ensure both positive and negative
    test cases prove the solution works. We described the details previously in this
    chapter, in the *Managing your Kanban board* section – as it should be done for
    each bit of configured or developed functionality.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '**Unit testing:** This is a test type enforced by Salesforce for each deployment
    (with code) to have a test coverage of at least 75%. But it can – and should –
    also be used for testing business-critical processes, such as lead record creation,
    contact record creation, and lead conversion. The upfront effort for creating
    test classes for configuration functionality greatly outweighs the pain of having
    to fix critical process failures in UAT or production.


    # Important note


    There are many other types of testing that you and your implementation partner
    can and should perform, including SIT, **performance testing**, and **load testing**.
    They are, however, beyond the scope of this book. If you want to dive deeper into
    the fascinating world of software testing, **ISTQB** and **TMAP** are two of the
    most widely used test frameworks. For larger Salesforce projects, it may be worthwhile
    for your organization to invest in setting up test automation. Engage with a Salesforce
    architect to investigate the potential use of a tool such as **Provar** or **Selenium**.


    At the end of your development phase, or right at the beginning of your roll-out
    phase, you will carry out UAT to ensure a larger group of your intended end users
    test and accept your Salesforce solution before releasing it to production. We’ll
    cover this in _Chapter 9_, _Deploying Your Release and Migrating Data to Production_.


    # Tip


    As you progress through the phases of your Salesforce project, you are likely
    to encounter resistance and receive feedback. While it’s important to _take feedback
    seriously – potentially making necessary changes –_ and try to understand the
    underlying causes of the resistance, it is critical that you also _stand firm
    in your conviction_ of the vision for your Salesforce project and trust in your
    efforts and analysis in the pre-development phase of your project.


    Let’s look at different ways of tracking the progress of your Salesforce solution
    development.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Measuring progress in the development phase


    Earlier, you estimated the development effort of the scope of your Salesforce
    solution. To understand how you are progressing, use the following key reports
    and KPIs:


    +   - **Burndown chart**: This displays story points or hours remaining of a sprint''s
    scope.

    +   - **Version report**: This predicts the date for completion of the remaining
    user stories in the product backlog. For the version report to be meaningful for
    your Salesforce project, you need to have all user stories estimated (with either
    story points or hours). Tools to support the agile development process provide
    a best- and worst-case scenario based on your team’s delivery consistency.

    +   - **Sprint velocity**: Depending on your estimation method, you have these
    ways to measure sprint velocity:

    +     - The sum of the story points completed in the sprint.

    +     - The sum of the stories’ estimated development hours completed in the sprint.

    +   - **Added scope**: While added scope may be valuable, it decreases efficiency
    and adds risk in terms of your project being deliverable on time. There are two
    levels to added scope you need to be aware of and manage:

    +     - **New scope**: To manage scope creep and increase development efficiency,
    it is a good idea to track the number (and estimate) of *new user stories* added
    to the product backlog.

    +     - **Late sprint scope**: User stories added to the sprint backlog *after
    sprint planning* were not discussed in sprint planning, and, as such,'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'the development team members were not able to assess and commit to delivering
    them. Worse yet, the development team will need to spend time understanding what
    the user stories are about and how to solve them.


    # Important note


    While it is tempting to try to get the development team member to “work faster
    or smarter” to deliver more in a shorter period of time, it is almost always a
    more effective strategy to look beyond the development team and improve areas
    such as *organizational alignment, empowerment of your PO, and removal of dependencies
    between teams.*


    Let’s move on to talk about your data.


    # Preparing your data migration plan


    As part of your effort and analysis in the pre-development phase (covered in Chapter
    2, *Defining the Nature of Your Salesforce Project*) you identified the *systems*
    that are currently used to support your business capabilities. As you are developing
    a new solution based on the Salesforce platform, your task now is to identify
    what data from your **legacy systems** needs to be moved to Salesforce and how
    to migrate it.


    Your data migration strategy should answer the following key questions:


    +   - What *systems* will you be migrating data from?

    +   - What *data* will you be moving?

    +   - How will you *extract* the data from the legacy systems?

    +   - Which Salesforce objects does your data *map* to – where will the data reside?'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   - How will you *transform* your data to make it consumable by Salesforce?

    +   - How will you *load* the data into Salesforce?


    Start by listing all your legacy systems and data (objects) and note the number
    of records in each object.


    # Important note


    Be sure to identify any potential **large data volume (LDV)** objects as they
    will have an impact when deciding how to extract your data from your legacy system
    and how to load it to Salesforce. Learn more about LDVs and their implications
    for your Salesforce org in the article *Best Practices for Deployments with Large
    Data Volumes* at https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_introduction.htm.


    If you have decided to *phase your project roll-out* (as part of your analysis
    in the pre-development phase in *Chapter 3, Determining How to Deliver Your Salesforce
    Project*), you need to determine the record count for groups of users in your
    various roll-outs.


    You then need to understand how you can extract the data from legacy systems and
    in what format. Some systems can connect to data **extract transform load (ETL)**
    tools, such as Informatica, which speeds up extraction and transformation.


    Next, map which Salesforce objects the data will reside in. This can be a tricky
    exercise as **data models**, and levels of **data normalization** differ across
    systems. Engage a Salesforce architect or **data migration specialist** to support
    you in this.


    # Tip


    Create a **data dictionary** describing all the objects and fields used in your
    Salesforce solution. Make sure it is aligned and updated continuously by'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'your development team.


    You now know the source and the target for the data and the discrepancy in data
    formats for each attribute or field, and you can determine your method for transformation
    to make the data ready for Salesforce.


    Next, you need to determine how you will load the data into Salesforce. There
    are many options available – their suitability for your Salesforce project depends
    on factors such as the size of your datasets, including any LDVs, and how long
    or short your **data migration window** is. This brings us to the final point:
    data migration planning.


    Some businesses are only open for business during daytime business hours, which
    makes evenings, nights, and weekends suitable options for your data migration
    window without interrupting the business. But what if you don’t operate in a single
    time zone or your users potentially also work in the evening and through the night?
    In those cases, you are faced with some hard decisions and two overall options:


    +   - You can attempt to plan and time your data migration in a finely tuned cumulative
    manner:

    +     - This requires advanced orchestration and planning and also requires several
    **dry-runs** in a staging sandbox to optimize the execution before moving data
    to production at go live.

    +     - There is another risk to this approach. If the data migration is delayed,
    the business will end up being disrupted anyway.

    +   - Accept the impact of disruption on the business. An upside to this is you
    can plan user training to be held while data is being migrated.


    # Tip


    Key tips to maximize your data migration at go live:'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - Start data migration planning early in the development phase to define
    your strategy.

    +   - Prioritize data cleansing. Data quality is a big challenge for many companies.
    The time you invest in cleaning data and removing duplicates will enhance your
    user experience and the overall performance of your Salesforce org, leading to
    better adoption.

    +   - Your data migration strategy should align with your development principles.
    Make sure there is close collaboration between the people responsible for your
    data migration strategy and your agile development team.


    We’ll cover data migration preparedness in *Chapter 9*, *Deploying Your Release
    and Migrating Data to Production*.


    Tip


