- pgno: 80
  md: 'It is important that you determine whether you’re working on a Salesforce program
    or a Salesforce project. To help understand the distinction, let’s explore the
    following points:


    # Salesforce project:


    +   - One or more capabilities to deliver

    +   - Has a target deadline


    # Salesforce program:


    +   - Contains a **portfolio** of Salesforce projects in various phases and/or
    a number of agile product development teams – a concept we''ll explore further
    in *Chapter 12, Evolving Your Salesforce Org and DevOps Capabilities*

    +   - Does not have a set end date: the goal of a program should be to continuously
    improve the business domain capabilities of an organization

    +   - For *one* organization, there should only be *one* Salesforce program


    The concept of projects is more relevant to certain types of **delivery methodologies**,
    which we’ll come back to later in this chapter. But first, let’s get on the same
    page by going through common **terminology**.


    # Common terminology used in Salesforce projects


    Misconceptions and wrongly used concepts are widespread throughout the ecosystem.
    It is a major source of confusion, both for business and technical stakeholders
    alike.


    Let’s look at some of the most commonly used terms in Salesforce projects:'
  merge: -1
  img_proc: true
- pgno: 81
  md: "+   - **Minimum Viable Product (MVP)**: A term used for product development\
    \ where a product may be physical or non-physical (digital). In any case, an MVP\
    \ is a version of a target *product* (solution) with a *minimum* set of **must-have**\
    \ features while still being a *viable* solution for users to do their job – in\
    \ *production*. An MVP inherently lacks many features that it **should have**\
    \ or would be **nice to have**. Salesforce projects are innovation projects for\
    \ many organizations. Many aspects of future imagined processes are still assumptions\
    \ at this point. Believing an organization can know up front exactly what features\
    \ are most important and bring the most value – let alone the detailed requirements\
    \ of such features – is a risky and suboptimal approach for most Salesforce projects.\
    \ Instead, defining an MVP and gaining fast, valuable *feedback for improvements*,\
    \ is often the fastest and best approach.\n+   \n+   - The concept of an MVP can\
    \ be applied at multiple levels:\n+     - At the *project level* when determining\
    \ which collection of business capabilities are the minimum that will make for\
    \ a viable solution for end users.\n+     - At the *capability level*, where an\
    \ MVP is about scoping which features are critical and which are not.\n+   \n\
    +   - **Pilot**: A **roll-out** approach used to get feedback – often on an MVP\
    \ version of a solution – from a limited group of the total intended users of\
    \ a solution. This valuable feedback can then be used to enhance the solution\
    \ prior to rolling it out to more users.\n+   \n+   - **Minimum Marketable Product\
    \ (MMP)**: Building on the concept of an MVP, the MMP is a version of a product\
    \ (Salesforce solution) that is believed to be more likely to be accepted or bought\
    \ (adopted) by the market (Salesforce users) than the earlier MVP version.\n+\
    \   \n+   - **Proof of Concept (PoC)**, **prototype**, and **pretotype**: These\
    \ terms describe the activity of attempting to create versions to see if it is"
  merge: -1
  img_proc: true
- pgno: 82
  md: 'conceptually and technically possible. The terms (solution versions) are grouped
    together as they share a key trait: they are never meant to go to production.
    A PoC – even if it proves a concept (solution) works in a development environment
    – will always require further refinement, re-engineering, design optimization,
    re-building, and testing *before* being ready for production.


    +   - Experienced and less experienced professionals, unfortunately, often inaccurately
    use these terms. Some use the terms to explain or request a slim version of a
    feature or project to be delivered fast and used in production without alignment
    or articulation of the purpose up front, not considering the necessary technical
    enablers or dependencies to other features, systems, or projects.

    +   - **Solution**: Refers to the technical deliverable of the project, including
    standard Salesforce out-of-the-box components, as well as any configurations,
    customizations, and integrations built into the project.

    +   - **Implementation**: A term often used synonymously with the terms project
    and solution.

    +   - **Release**: This can have two meanings with subtle differences. One meaning
    of release is when a solution is deployed to production. Another meaning is –
    if some form of feature flag was implemented together with the feature – when
    the feature is *turned on* and is ready to be used. We’ll cover this concept further
    in _Chapter 7_, _Building and Testing Your Initial Release_.

    +   - **Salesforce** or **Salesforce, Inc**: This can either mean the actual system
    your users will work in or the company _Salesforce, Inc_.


    Many of the terms described in the preceding section relate to some form of agile
    development methodology, and – if you choose to use an implementation partner
    for the delivery – it should be clearly described in your contract. We will return
    to contracting in _Chapter 4_, _Securing Funding and Engaging with Salesforce
    and Implementation Partners_.


    Tip!'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'A general rule of thumb is – if at all possible – you should prioritize a tighter
    scope for an MVP for faster delivery and faster feedback over a comprehensive
    solution that is delivered slower, with more risk of being outdated once it is
    taken into use.


    Once your MVP is piloted with a select user group, you can iterate to improve
    the MVP into an MMP for further roll-out.


    Whether or not agile is the right delivery methodology for your Salesforce project
    will be covered in the next section.


    # Understanding delivery methodologies


    Let’s jump right in by understanding the two extremes of delivery methodologies,
    and a third that is harder to define but often used.


    # Pure waterfall


    In pure waterfall Salesforce projects, requirements are defined up front in full
    detail by business stakeholders through the help of business analysts. All requirements
    are nicely organized in the behemoth business requirements document (BRD).


    Next, the architects and sometimes senior developers get to work by creating detailed
    low-level solution designs. The solution design is then handed off to the development
    team to develop the entire solution. If the solution is an enhancement or extension
    to an existing, live system, system integration testing (SIT) is carried out before
    user acceptance testing (UAT).


    Then, UAT is carried out in strict accordance with the BRD stated acceptance criteria,
    and the technical, performance, and non-functional requirements are tested as
    well. If one or more specific acceptance criteria fail, the project leadership
    needs to scramble to assess whether the failures are critical and must be fixed
    before deploying or to deploy and fix them in'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'a later release. If the solution passes UAT, the solution is deployed and rolled
    out to users.


    If you have contracted with an implementation partner to deliver the project,
    the period from architecting and developing the solution against BRD *could take
    months* before UAT starts and you see what solution has been developed.


    # Tip


    Learn more about waterfall delivery methodologies in these links at *Prince2*
    (https://www.prince2.com/eur/what-is-prince2) and *PMP (Project Management Professional)*
    (https://www.pmi.org/certifications/project-management-pmp).


    # Pure agile


    In **pure agile** Salesforce deliveries, the agile team is armed with nothing
    but a brief **product vision** as a guide. It is up to the agile team itself –
    led by the Product Owner – to create their product backlog containing the most
    important and urgent features to deliver. The team works together to refine the
    product backlog, and at **sprint planning** the team uses **story point pokering**
    to estimate the size of the **product backlog items (PBIs)** (aka **user stories**).
    Once the team’s sprint capacity (of *user story points*) is filled, the team gets
    to work to create solution designs for the PBIs, develop and test them, and then
    **demo** the developed features to stakeholders (a form of UAT) before finally
    releasing the developed and accepted PBIs. The **sprint** (also called an **iteration**,
    depending on the specific agile methodology chosen by the team) usually lasts
    between one to four weeks, with a two-week duration being the most prevalent.


    The agile team is **self-organized** in the sense that it will develop solutions
    for the requirements prioritized and created as PBIs. The PBIs may be organized
    at various levels, such as **themes, epics, features, user stories,** and **tasks**.
    The organization of PBIs is not the important part to distinguish agile from waterfall
    deliveries. The key aspect to understand with pure agile is that the team does
    not have a set scope defined up front – at most, a'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'product vision is articulated by the funding party, which the PO must translate
    into a collection of PBIs that *collectively* form the **sprint goals**.


    We’ll cover these topics and terms in more detail in *Chapter 7*, *Building and
    Testing Your Initial Release*.


    An agile team *may* contain the following roles, which are more or less formalized
    depending on the type of agile methodology:


    +   - **Product Owner (PO)**: Represents the business and the intended users of
    the solution.

    +   - **Scrum master**: Facilitates the agile ceremonies, removes impediments,
    coaches the team on the agile methodology, and ensures agreed actions for continually
    improving the team collaboration are executed. A key responsibility of the scrum
    master is to shield developers, functional consultants, and QA specialists from
    disturbances, such as meetings and reporting.

    +   - **Developer (coder)**: Develops complex logic, customized **user interfaces
    (UIs)**, and custom integrations using **Apex** and **JavaScript**, among other
    technologies.

    +   - **Functional Consultant (configurator)**: Configures functionality **declaratively**
    – using clicks, not code. In a Salesforce context where **low-code/no-code** is
    a distinguishing feature, functional consultants are usually more plentiful in
    an agile team than developers.

    +   - **Business Analyst**: Some agile teams have dedicated business analysts
    to support the PO in **backlog refinement**; in other teams, the functional consultant
    or developer takes up that role.

    +   - **QA Specialist (tester)**: Some agile teams have dedicated QA specialists
    to carry out user story testing and regression testing; in other teams, the functional
    consultant and developers share the user story testing responsibility, and the
    PO is responsible for regression testing – if it is a manual process. We’ll cover
    various forms of testing in *Chapter 7*, *Building and Testing Your Initial Release*.
    Needless to say, for mission-critical systems – as Salesforce is often considered
    by organizations – investing in quality assurance is imperative.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'In the following figure, you can see how the two methodologies compare visually:


    ![](img/307881206539c45e128c538a4b6912f8_86_0.png)


    Figure 3.2 – Pure waterfall versus pure agile delivery


    Two key points to take notice of in Figure 3.2 are as follows:


    +   - In the pure waterfall delivery methodology, the requirements are defined
    in detail up front and the architecture is then designed in detail. The development
    team then strictly follows the designed architecture, and the initially **intended
    architecture** is delivered. Whether the intended architecture is the best and
    most **fit-for-purpose architecture** cannot be concluded until the solution is
    deployed, and feedback is received from end users. In these **Volatile, Uncertain,
    Complex, Ambiguous (VUCA)** times, having the audacity – for a large or complex
    project – to believe you can comprehend detailed requirements and *master-plan*
    detailed solution designs is a risky approach.

    +   - In the pure agile delivery methodology, the architecture evolves over time
    and is said to be an **emergent architecture**. A purely emergent Salesforce architecture
    is rarely the most optimal architecture – at least if zero **guard rails** or
    **development guidelines** are provided to the agile team.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Tip


    Learn more about agile delivery methodologies at the following links:


    +   - **Kanban:** https://www.atlassian.com/agile/kanban

    +   - **Scrum:** https://www.scrum.org/resources/what-is-scrum

    +   - **SAFe (Scaled Agile Framework):** https://scaledagile.com/what-is-safe


    As promised at the beginning of this section, there is a third delivery methodology
    that is harder to define but often used for Salesforce projects.


    # Hybrid agile


    **Hybrid agile** comes in many forms, as it is not a model defined in a framework
    like traditionally agile and waterfall delivery methodologies. True-to-the-core
    agilists might characterize SAFe as a hybrid agile framework, but settling that
    argument is out of the scope of this book.


    In a hybrid agile delivery methodology, you will *pick elements* of each extreme
    to come to a middle ground that is *better for your organization* than either
    of the extremes in pure form.


    The purpose of hybrid agile delivery is to have some *indication of cost and solution
    architecture*, but not to the extent that too much time is spent on determining
    all the lowest-level details up front – at the cost of the requirements becoming
    stale before the project’s development phase can commence.


    # Choosing your Salesforce delivery methodology'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'You should consider choosing the *pure waterfall* delivery methodology if the
    following apply:


    +   - You can accurately articulate your organization’s and business users’ detailed
    requirements – in a *Salesforce context* – up front in a BRD.

    +   - You believe providing the requirements, then waiting in the dark for the
    development period (weeks, months, or even quarters) won’t risk the initial requirements
    becoming obsolete before the solution is delivered.

    +   - You value knowing the final cost and timeline over continuously inspecting
    the solution throughout development, and being able to adapt to changing requirements,
    new knowledge, or new uncovered key requirements.

    +   - You want to be sure to avoid **scope creep**.

    +   - Your project’s scope is limited, requirements are not complex, and your
    business stakeholders who provide requirements cannot be available for an extended
    period of time.

    +   - Your project *solely* involves *either* of the following:

    +     - Non-negotiable legal or compliance features

    +     - Complex integrations where independent teams or persons are dependent
    on each other being available at specific times

    +   - You are prepared to *potentially* pay a higher price for delivery in a **fixed-budget-fixed-scope**
    model versus a **time and material** model.


    On the other hand, you should consider choosing the *pure agile* delivery methodology
    if all of the following are true:


    +   - You already have a Salesforce org live in production and simply want to
    add new features *to existing Salesforce clouds*.

    +   - You do not require any estimate of the total cost to deliver your scope.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - You accept the *risk* associated with a *purely emergent architecture*
    (unless also putting in place suitable governance mechanisms).

    +   - You value continuously inspecting the solution and being able to adapt to
    changing requirements, new knowledge, or new uncovered key requirements *over*
    knowing the final cost and timeline.

    +   - You believe you will want and need to do a lot of prototyping PoCs to understand
    what a solution will entail – *and accept this approach will require time and
    money*.

    +   - You are aware of and accept the risks associated with a time and material
    contract model should you engage with an implementation partner to work with you
    in a pure agile delivery methodology.


    You should consider choosing a form of a *hybrid agile* delivery methodology –
    instead of pure agile – if the following apply:


    +   - Your organization requires *at least some indication* of the cost of your
    project.

    +   - You see the value in *some level of architecture* being determined up front.

    +   - You need to approach *some* elements of the project scope in a waterfall
    manner, such as legal requirements, compliance requirements, and integrations
    while needing to approach *other* elements in an agile way.


    *In our scenario with PME, the Salesforce Taskforce’s project is charged with
    the goal of developing an MVP solution including capabilities for marketing, sales,
    and service, and rolling the solution out globally. The solution must have sufficient
    functionality that it can replace and retire a legacy CRM currently serving sales
    and customer service departments, and a simple email marketing system.*


    # Project phasing approaches'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'In the olden days, deploying IT solutions was done in a big bang manner, deploying
    all functionality and having all users going live at once, celebrating in style
    with champagne and cake – or so I am told. For at least the past decade, it’s
    become the norm and mantra to build an MVP to release a working solution as soon
    as possible.


    For many types of IT projects, it makes sense to build an MVP and release it as
    soon as the developed product can deliver value through a better feature set,
    experience, business outcome, and/or lower cost compared to the existing system
    being replaced. However, for enterprise IT projects – Salesforce implementation
    projects fall into this category – there are valid reasons to counter the urge
    to go live in production (the first go-live) prematurely.


    The strongest argument to not rush the initial roll-out is that the moment you
    have users live in production, you will multiply your Salesforce setup and complexity
    by at least two-fold compared to being in the development phase.


    Here are some of the key drivers and responsibilities you will have once you go
    live that you don’t – at least not to the same degree – in the development phase:


    +   - User provisioning and deprovisioning:

    +     - Employees change roles and need new roles, permission sets, groups, and
    queue memberships

    +   - The training of new users

    +   - Managing the production environment

    +   - Potentially managing a production support environment

    +   - Regression testing key processes three times a year with every Salesforce
    release

    +   - The handling of new feature requests from users'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# The handling of bug reports from users


    This can seem like a lot of work, and it is if it''s not managed in the leanest
    way possible, process-wise, and architecturally. We’ll cover this further in *Chapter
    12, Evolving Your Salesforce Org and DevOps Capabilities.*


    I am by no means suggesting you push your initial release for as long as possible.
    I am simply stating *there is a consideration to be made for the right timing*
    – factoring in the time it takes to get these processes in place, some of which
    require technical setup to be done up front.


    There are ways of phasing your implementation so as to not create a big bang where
    you are overwhelmed with the previously mentioned production responsibilities.


    Two types of project phasing exist that at first may seem identical, but there
    are distinct differences.


    # Phasing by scope


    Different business domain capabilities are developed and released to relevant
    **functional groups of users**. For example, you could opt to develop and release
    the business capabilities for your *sales* organization and later develop and
    release for your *marketing* and *customer service* organizations. There are pros
    and cons to this approach, as highlighted here.


    These are the advantages:


    +   - Smaller scope means faster development and roll-out of value-adding, working
    solutions

    +   - Acquired Salesforce licenses are utilized sooner than if the solution had
    to include the full scope, and wait for all capabilities to be developed before
    any single functional user group could start using Salesforce

    +   - Less concurrent effort for training and change management'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   - Less compounded risk of any one business capability not working and delaying
    the deployment of the entire solution


    These are the disadvantages:


    +   - Risk of getting stuck optimizing a few capabilities beyond the return on
    investment at the cost of not developing new capabilities for other user groups.

    +   - Potentially require temporary integrations to legacy systems to be developed
    to have a full customer overview. For example, if a Salesforce solution is initially
    built for sales users and doesn’t include customer service, the sales users won’t
    have access to their customers’ service history in Salesforce, and will either
    have to use two CRM systems (poor user experience), or a temporary integration
    needs to be developed to display service history from the legacy CRM in Salesforce.


    # Tip!


    As we progress through the activities in this chapter, bear in mind the maturity
    and the strategic importance of your different business capabilities, as they
    will guide you to prioritize the scope for your initial Salesforce release.


    Let’s look at another strategy for phasing your Salesforce project.


    # Phasing by geography


    In this type of project phasing, users in one geography will be using all the
    capabilities developed in the project – but the roll-out (and migration) is phased.


    For example, you may decide to develop an initial MVP solution, roll it out to
    the Australian and New Zealand organization, and then roll it out further to other
    regions or countries – in bulk or groups of countries.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'These are the advantages of phasing by geography:


    +   - Less concurrent effort for training and change management

    +   - Less risk the developed solution does not sit well with any one particular
    country or region – impeding adoption


    These are the disadvantage of phasing by geography:


    +   - Risk of optimizing the solution for one country or region and not carrying
    out intended process harmonization


    # Tip!


    As a general rule of thumb, when a capability is developed, tested, and ready
    for use, prioritize rolling it out for feedback as soon as possible. Improve the
    solution based on the feedback received, and then roll it out further to as many
    geographies as possible in order to ensure the solutions built are adopted by
    your entire organization – so you don’t risk different geographies using different
    systems concurrently.


    Having covered Salesforce project delivery methodologies, it’s time we talk about
    change.


    # Determining your change management strategy


    Over the course of your Salesforce project, many things will change for your organization.
    Most importantly, how your employees work will change. How good you are as an
    organization at managing these changes has a direct and enormous impact on the
    success of your Salesforce project. You could design and deliver the most technically
    sophisticated solution, but if your users don’t want, need, or know how to use
    your solution, then your efforts and investments will not bear fruit.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Introducing change management


    **Change management** encompasses all the efforts, initiatives, activities, and
    tools you use to maximize the positive outcomes of the changes your organization
    undergoes.


    You need to manage change in your Salesforce project to ensure the intended users
    of your Salesforce solution adopt and use your Salesforce solution. The level
    of **adoption** is a key metric for measuring the success of your Salesforce project,
    which we’ll cover further in *Chapter 4, Securing Funding and Engaging with Salesforce
    and Implementation Partners.*


    Adoption, however, is the *combined result of the collective efforts* you put
    into managing change. Let’s look at the reach of the changes that may come with
    your Salesforce project.


    # Degrees of change in Salesforce projects


    Enhancing business capabilities – through implementing Salesforce – *reaches beyond
    changing the system component* of a business capability.


    Implementing Salesforce may change your business capability components in the
    following ways:


    +   - **Systems**: Potentially replacing a legacy system with Salesforce will
    impact your overall system landscape, and likely *how your enterprise systems
    integrate*.

    +   - **Data**: How data is managed, stored, distributed, consumed, and utilized
    is affected as part of a Salesforce project. In today’s **data-driven enterprises**,
    data is considered to be one of the greatest assets. You need to consider and
    map the stakeholders impacted by replacing the old way of working (legacy systems)
    with Salesforce and design your future data management and governance, and understand
    the'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'efforts required for building new reporting and analytics capabilities and
    assets. Engage an **enterprise architect** and a **data architect** to support
    you in this exercise.


    +   - **Processes**: Your customer-facing and interacting employees’ business
    processes will change. You will – throughout your Salesforce project – focus the
    bulk of your change management efforts on how this change affects your employees.

    +   - **People**: As systems and processes change and are optimized, the people
    who previously worked on rudimentary data entry and manual repetitive tasks, will
    have time freed up to focus on more value-adding activities delivering better
    business outcomes – all in line with the overall vision of your Salesforce project.

    +   - There may be a gap between your employee’s current competencies and skills
    compared to those required for the value-adding activities. This will require
    upskilling and training – beyond learning to use your Salesforce solution. The
    nature of the upskilling and training, of course, depends on what competency gaps
    you identify. If you are changing your company’s overall sales methodology – for
    example, from traditional transactional to solution selling – as part of your
    Salesforce project, you may need to carry out a series of sales training sessions.

    +   - As part of some projects, you may find some employees that need to learn
    new skills to work in the new way are not interested in and/or capable of change.
    In this case, you need to consider where they can potentially fit within your
    organization in order to still retain the organizational knowledge these employees
    possess. As a last resort, you may need to consider letting some employees go
    if they are not interested in what you can offer or if you are unable to find
    opportunities for them within your organization.

    +   - Work closely with your human resource business partner when carrying out
    the exercise of identifying changes to different groups of employees to capture
    changes in job descriptions and required skills.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'While each of these elements may currently be the responsibility of different
    departments within your organization, ensuring they are all addressed is a critical
    prerequisite for being able to design and deliver solutions your user will adopt.
    Later on in this chapter, we’ll look at how to anchor the collective responsibilities
    for changing organizational capabilities.


    # Identifying stakeholders impacted by change


    When implementing Salesforce, change will occur at many levels of your organization
    and the management of those changes will require different types of activities.


    In the previous section, you identified the reach of change as a result of implementing
    Salesforce. Now let’s take a look at who specifically will be affected by change
    so you can plan communication and change management activities accordingly:


    +   - **End users**: Their way of working will change as they will work in Salesforce.

    +   - **Managers of your end users**: Salesforce will provide new insights into
    their employees’ work. Managers’ buy-in is key for sustaining change and adoption
    of your Salesforce solution. It’s likely the managers will require upskilling
    and coaching to enable them to support and encourage their employees to adopt
    your Salesforce solution.

    +   - **Leadership of local sales organizations**: Local leadership will effectively
    act as local executive sponsors of your Salesforce project. Their buy-in and communication
    are vital for adoption.

    +   - **Global leadership**: Assuming you will have one **Salesforce org** that
    is to be used throughout your company, your global leadership will effectively
    be able to gain insights into marketing, sales, and customer service performance
    in a whole new way. This will require training and'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'potentially upskilling to gain maximum value for this new level of insights.


    +   - **Application management staff:** The employees who may have managed your
    legacy CRM system(s) will go through a major change having to learn to manage
    your Salesforce solution and the users of it.

    +   - **Data, BI, reporting, and analytics staff:** These functions may or may
    not be part of your IT organization. Regardless of organizational location, their
    underlying data architecture will change as they – with Salesforce – will have
    a new source of data as well as a new place to create and present reports and
    dashboards for reporting stakeholders.


    # Timing your change management activities by Salesforce project phase


    The methods and activities for managing change – your toolbox – are the same regardless
    of which delivery methodology you choose for your Salesforce project. The timing
    and dosage of your change management initiatives, however, are dependent on which
    delivery methodology you choose.


    Let’s explore how the timing of initiatives commonly varies by delivery methodology:


    | Delivery methodology |  |  |  |

    |---|---|---|---|

    | Key change management initiatives | Waterfall | Hybrid agile | Pure agile |

    | Identify stakeholders impacted by change | Before development starts | Before
    development starts | At product backlog refinement or sprint planning |'
  merge: -1
  img_proc: true
- pgno: 98
  md: '| Use vision to determine messaging and craft a communication plan | Before
    development starts | Draft before development starts, adapt continuously | At
    product backlog refinement |

    | Recruit change agents | Before UAT | Before development starts | In sprint planning
    |

    | End user involvement | Not until UAT and training | In pre-development phase
    workshops, in the development phase at show and tells | Continuously at show and
    tells, and user feedback forums |

    | User training | In roll-out phase | In roll-out phase | At product demos and
    in application |

    | Monitor and ensure adoption | In roll-out phase | In roll-out phase | Continuously
    |


    Table 3.2 – Timing of key change management initiatives by the delivery methodology


    Next, let’s see what frameworks are available for you to use.


    # Using a change management framework


    There are plenty of change management frameworks for you to choose from. Some
    of the most commonly used frameworks include the Prosci ADKAR® Model, Drucker
    School of Organizational Change Leadership, and the classic John Kotter’s 8-Step
    Process for Leading Change.


    Tip!'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'While detailing the contents of each change management framework is beyond
    the scope of this book, I encourage you to read about them and be inspired. It
    is beneficial to follow an overall tried and tested framework but be mindful not
    to lock yourself into a too rigid structure – incorporate elements you believe
    to be valuable for your own change management strategy in accordance with your
    company’s culture.


    We know your organization will undergo change because that is the goal of your
    Salesforce project, so we can predict it. What we cannot anticipate is the nature
    of how the organization – the people affected by the change – will react and respond.


    You will spend a great deal of effort throughout your Salesforce project to understand
    your employees’ current processes, and determine future, improved, or new processes
    to understand what the change will be. We cannot for certain know whether these
    assumptions about improvements and change will hold true – or even if they are
    true, whether or not it will be *perceived* as a positive change by the people
    affected.


    # Tip!


    Adapt and refine your change management strategy as you progress through your
    Salesforce project.


    Next, we will move on to understanding how to govern and manage your Salesforce
    program and project.


    # Envisioning your Salesforce Center of Excellence


    Your project taskforce has, until this point, consisted of three key roles (refer
    to Chapter 1, Creating a Vision for Your Salesforce Project), who have done an
    amazing job getting to this point. Now is the time to envision how to manage your
    Salesforce program and envision the structure of your **Salesforce Center of Excellence
    (CoE)**. Your Salesforce taskforce members will continue to play key roles in
    your new Salesforce CoE.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Understanding the purpose of a Salesforce Center of Excellence


    Your Salesforce CoE will be your management and governance framework to oversee
    your Salesforce program.


    The benefits of establishing your Salesforce CoE are multi-faceted:


    +   - To ensure *timely delivery* of Salesforce projects or features, depending
    on your chosen delivery methodology

    +   - To ensure your overall *Salesforce solution is compliant* with regulations
    that your company is subject to

    +   - To enable *faster delivery* of innovations and reduce risk


    When executed well, the sum total of these benefits will have a significant financial
    impact in terms of huge cost savings compared to not having a Salesforce CoE in
    place.


    # Drafting the charter for your Salesforce CoE


    Create a **charter** for your Salesforce CoE to align your program stakeholders
    and the Salesforce CoE members.


    Your Salesforce CoE charter should contain the following content:


    +   - The vision for your Salesforce program

    +   - The goal and responsibilities of your Salesforce CoE

    +   - Metrics to measure the success of your Salesforce program


    Let’s look at the responsibilities of your Salesforce CoE.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Determining the structure and responsibilities of your Salesforce CoE


    Your Salesforce CoE contains the following elements and groups – each with their
    own areas of responsibility – collectively working towards the same goal.


    Let’s look at the tasks behind the responsibilities of the CoE:


    ![](img/307881206539c45e128c538a4b6912f8_101_0.png)


    Figure 3.3 – Salesforce Center of Excellence


    Executive sponsor: A Senior leadership representative of your company with a vested
    interest in the success of your Salesforce program. It may be an SVP reporting
    directly to your company CEO, or sometimes your CEO themself, depending on the
    size and structure of your organization.


    +   - **Steering committee**: A group responsible for the tactical support of
    your Salesforce program. It should consist of your executive sponsor, CFO, CIO,
    and senior commercial leadership representatives. You may,'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'at times, wish to invite external parties, such as Salesforce or an implementation
    partner to present at your steering committee meetings.


    +   - **Salesforce program owner:** Responsible for overseeing and orchestrating
    the responsibilities of the Salesforce CoE. The program manager drives Salesforce
    project portfolio management and owns the program roadmap based on input from
    both the business and technology organizations. The program owner is also responsible
    for overseeing the delivery of Salesforce projects, though there should be a dedicated
    Salesforce project manager – or scrum master – for each project or delivery stream.

    +   - **Business governance:** This group is responsible for gathering and consolidating
    requirements, business process definitions, change management, reporting support,
    and the business side of release management.

    +   - **Technical governance:** This group is responsible for ensuring your Salesforce
    org is secure, and its applications are scalable and performant. Furthermore,
    the group oversees areas of quality assurance, technical release management, as
    well as help desk and admin support, which includes user management.


    The groups and responsibilities in your Salesforce CoE may vary depending on the
    specific nature of your Salesforce program, industry, and organization.


    In the pre-development phase, your Salesforce CoE comes alive and is initiated
    the moment you secure funding for your initial Salesforce project.


    Drafting your Salesforce CoE charter and structure are important prerequisites
    to being able to create your business case to secure funding for your Salesforce
    project and program. Once you secure funding, you will want to initiate staffing
    your Salesforce CoE.


    Next, let’s look at how to create your **Salesforce roadmap**.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Creating a roadmap for your Salesforce program


    The term *program* is used here intentionally as the program may consist of many
    projects and streams related to Salesforce – but not necessarily included in the
    scope of your initial Salesforce project, or at least not in the initial release
    of your Salesforce solution.


    Let’s see the **Salesforce program roadmap** our scenario company, PME, has put
    together, illustrated in a classic **transformation map (T-Map)**.


    ![](img/307881206539c45e128c538a4b6912f8_103_0.png)


    Figure 3.4 – PME’s Salesforce program roadmap


    *PME’s Salesforce taskforce put together its road map. They considered project
    phasing and delivery methodology for their initial release. They decided to keep
    things simple by creatively defining three buckets for their desired capabilities:*


    +   - **MVP Release**: The MVP release contains capabilities currently supported
    by PME’s existing email marketing and CRM systems, in addition to a few select
    capabilities that PME believes will bring great value to the business.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   - **Later**: *These capabilities are much desired, yet are dependent on
    having a number of foundational capabilities in place before starting to build
    them. PME does not intend to batch the Later bucket capabilities into a single
    project, they rather intend to distinguish the timing of delivery between capabilities
    from the MVP Release and the Later still buckets.*

    +   - **Later still**: *These capabilities are also desired, yet still dependent
