    Salesforce project. In this chapter, we will discuss some of the common issues
    often faced in that phase of a Salesforce project. We will also cover strategies
    to mitigate the issues or prevent them from arising altogether.


    In *Chapter 5*, *Common Issues to Avoid in the Pre-Development Phase*, you were
    introduced to **root cause analysis**, and we’ll continue using that method to
    dissect the common issues faced.


    At the end of this chapter, you are presented with a set of **checklists** to
    evaluate the state of your Salesforce project as you wrap up the roll-out phase
    of the project.


    This chapter will cover the following main topics:


    +   - Common issues in the roll-out phase and their root causes

    +   - Evaluating the state of your Salesforce project


