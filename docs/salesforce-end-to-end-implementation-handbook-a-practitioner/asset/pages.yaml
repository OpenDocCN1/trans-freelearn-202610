- pgno: 110
  md: 'chapter. As such, your initial Salesforce project, which will consist of a
    smaller scope than what you envision your total solution will be, should also
    deliver a better financial position independently.


    In this section, we’ll go through the exercise of creating the business case for
    your initial project. While the elements will differ depending on scope, the model
    is fundamentally the same.


    Regardless of the business problem you are addressing, all enterprise CRM projects
    requesting funding should be able to articulate their value by at least one of
    the following factors:


    +   - Increasing revenue

    +   - Reducing cost

    +   - Having the net sum of impact on revenue and cost be greater than zero


    # Tip


    Discuss with your CFO or financial business partner what criteria your company’s
    **investment board** focuses on when evaluating funding requests.


    In addition to your financial forecast, there are other elements to include in
    your business case. We’ll return to that later in this section. For now, let’s
    see how you can estimate *increased revenue* as a result of implementing Salesforce.


    # Estimating the revenue impact of your Salesforce project


    Implementing Salesforce can impact multiple business domains:


    +   - **Marketing**: More and better leads and traffic to e-commerce stores.

    +   - **Sales**: Productivity gains from 360-degree customer view, automation,
    and integration means sales reps can close more deals faster.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   - **Service:** While historically being considered a cost center in the
    enterprise, companies are increasingly realizing the essential role the customer
    service organization (customer success) plays in customer satisfaction and the
    length of the customer’s lifetime.

    +     - Some companies are also commercializing their service offerings. The methods
    range from simply charging for access to premium customer service (for example,
    some low-cost airlines charge for customer service), to selling service entitlements,
    and some companies are completely integrating (bundling) services into their product
    offerings.

    +     - Service companies have done this for years, but other industries, especially
    companies in the manufacturing industry, have enormous potential to add another
    revenue stream or increase the value to their customers by including (or highlighting)
    service in their total offered solution.

    +   - **Innovation:** Implementing Salesforce will benefit your company in more
    ways than direct revenue or cost impact. Implementing a cloud-based, state-of-the-art
    platform will allow your company to innovate faster, implement new processes,
    react and pivot to market changes, quickly integrate newly acquired companies,
    and divest business units. Moreover, a well-architected Salesforce solution –
    as you will strive to have – will also reduce operational risk to business continuity
    as your organization will be less prone to system downtime (versus legacy systems).
    While it''s harder to pin down the exact value of a company’s innovation capability
    and reduced operations risks, it is a valuable benefit that should be highlighted
    in your business case.


    # Important note


    With regard to estimating the value of improved innovation capability, you have
    two options: either attempt to estimate the value of your increased innovation
    capability’s impact on revenue and cost – adding 1-2% to revenue impact and reducing
    operating costs similarly – or you can simply highlight the *innovation benefits*
    in your business case. I recommend the'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'latter approach as it keeps items you can estimate *separate* from the more
    abstract items.


    Next, we’ll look at costs.


    # Estimating the cost impact of your Salesforce project


    As you have learned in *Chapter 2, Defining the Nature of Your Salesforce Project*,
    implementing Salesforce has wide-reaching business impact – which is the goal.
    On the other hand, your Salesforce project will also have an impact on many other
    costs – with both positive and negative financial impacts. For your Salesforce
    project, you need to consider the following costs:


    +   - **New license costs:** The cost of procuring new Salesforce licenses for
    your users.

    +   - **Saved license costs:** Cost savings from retiring legacy systems.

    +   - **Implementation costs:** The costs to deliver your Salesforce project include
    the costs to *develop, deploy, and roll it out*, as well as the *critical communication
    and change management* activities you will do throughout your Salesforce project.
    These costs are tricky to estimate at this point since you may not yet have engaged
    with any implementation partners. Once you do, come back to this element, and
    update accordingly. For now, you should connect with an enterprise architect or
    IT business partner at your company who will have some insights into comparable
    cloud projects.

    +   - **Operating costs:** The impact your Salesforce project will have on staff
    costs.

    +   - **Business operations costs:** These include savings from productivity gains
    of your business front-office staff (sales and customer service functions) by
    having a 360-degree view of their customers, automations, and integrations. Time
    saved by employees'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'can either be converted to cost savings or directed to more value-adding activities.


    +   - **Salesforce CoE costs:** New staff to govern, maintain, and run your Salesforce
    solution (non-project costs). These include internal admins and business analysts
    who carry out minor bug fixing, implement small features requests, and user management
    – *keeping the lights on*. We’ll cover this in more detail in the next section.

    +   - **Legacy system operating costs:** Staff who won’t be maintaining legacy
    systems being retired. If possible, you should retrain and upskill these people
    to be part of your Salesforce CoE as they are intimately familiar with your organization
    and possess many transferable skills, which – combined with Salesforce knowledge
    – will be a valuable resource for your new Salesforce CoE. As Salesforce may be
    an entirely new platform and cloud computing may be new to these people, be mindful
    and diligent in training – we’ll return to this topic in *Chapter 12*, *Evolving
    Your Salesforce Org and DevOps Capabilities*.


    Let’s look at your options for implementation partner models.


    # Choosing your implementation partner model


    **Conway’s law** says organizations, if not provided external input, will more
    or less lift and shift existing processes (and data) into new systems. And what
    a waste of a perfectly good opportunity if your company invests in the shiny new,
    state-of-the-art, market-leading CRM platform that Salesforce is without improving
    its processes.


    This is where Salesforce implementation partners come into the picture.


    Let’s look at the different partner models:


    +   - **100% insourcing:** Your company does not work with an implementation partner
    at all. For Salesforce projects, this is not a'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'recommended approach for initial greenfield implementations. After initial
    implementation is deployed, bug fixes and feature enhancements to existing clouds
    may be carried out by an internal team, supported by clearly defined development
    guidelines and governance.


    +   - **100% outsourcing:** Your company outsources everything except some high-level
    governance and providing requirements. The implementation partner drives development,
    deployment, training, user management, and the help desk. There are valid reasons
    for choosing 100% outsourcing – such as if your company’s IT resources are limited,
    but you want to develop great solutions and provide timely support for your users.

    +   - **Happy medium:** In this model, you handle some parts of Salesforce yourself
    – most often elements such as user management, reporting support, bug request
    management, new feature request management, training, and the help desk. There
    are endless variations to this model, and it is also the most prevalent. What
    you need to make clear is what elements your company will be better at than an
    implementation partner and for what reason. Typically, this comes down to the
    elements that involve communicating with your end users.


    The partner model you choose is not set in stone. As you progress through the
    phases of your Salesforce implementation, learn what works well and what doesn’t,
    and optimize your setup accordingly.


    # Important note


    The cost for implementation partners falls under your company’s **capital expenditures
    (CAPEX)**, whereas your daily internal operating expenses fall under **operating
    expenditures (OPEX)**. Discuss with your CFO or other finance business partner
    whether your company has a preference or considerations in relation to choosing
    a partner model for your Salesforce implementation.


    Let’s move on to discuss the resources required in your Salesforce CoE.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Determining your Salesforce CoE target operating model


    You need to include the cost in terms of time spent by the members of your Salesforce
    CoE in delivering your Salesforce project. To determine that, we first need to
    look at what roles need to be part of your Salesforce CoE.


    To help you determine what roles you need to purely *maintain* your implementation
    – after initial implementation and roll-out – review the Salesforce help article
    *BEST PRACTICES: Achieve Outstanding CRM Administration*, at https://help.salesforce.com/s/articleView?id=000327119&type=1.


    The model in the article is based on up to 750 users. For enterprise organizations
    planning to invest in and implement Salesforce, it is critical to know what key
    factors play into determining the required resources to run their Salesforce platform
    to be able to estimate the operating cost to maintain their solution.


    So, let’s dive into these considerations and factors.


    In all Salesforce orgs, you will have at least one internal user who will have
    administrator rights for configuring your Salesforce org. How many and when depends
    on a number of factors and decisions around your operating model – and your chosen
    partner model.


    The following list includes some of these factors:


    +   - Whether your Salesforce org is live in production or not

    +   - The breadth of Salesforce clouds and add-on products used

    +   - The degree of customization of your Salesforce org

    +   - The maintainability of the solutions* in your Salesforce org


    *Tip'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Maintainability is a factor you *can influence* by having the right governance
    mechanisms in place for your Salesforce project and program. We’ll cover this
    in more detail in *Chapter 7, Building and Testing Your Initial Release.*


    +   - The number of internal Salesforce users

    +   - The number of lines of business in your Salesforce org

    +   - The number of sales regions or countries

    +   - The number of customer-facing applications such as Experience Cloud sites
    or commerce storefronts


    Some of the factors are purely based on facts, for example, the number of users.


