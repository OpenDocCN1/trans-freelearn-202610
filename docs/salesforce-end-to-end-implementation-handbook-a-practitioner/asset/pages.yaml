- pgno: 301
  md: 'approaching in much the same way as described in previous parts of this book.


    # Tip


    When you evaluate requests for new features and enhancements, check out the Salesforce
    Roadmap Explorer at https://architect.salesforce.com/roadmaps/roadmap-explorer
    to see whether any of the upcoming releases may be able to support the request.


    It is usually better to plan for the adoption of new OOTB features rather than
    building your own. Be aware that the roadmap explorer describes intentions, not
    a commitment – make your decisions accordingly.


    You need a structure and process for continuously collecting, qualifying, and
    prioritizing new requests. SAFe offers different configurations to manage new
    ideas, such as the **program board** with a **program KanBan**, and regular cadence
    to review, provide feedback, and support the progression of epics to the next
    stage. A PO should be able to quickly explain their decisions and prioritizations,
    as it should be immediately evident how an epic’s benefit hypothesis ties back
    to the product goals. As such, the program board is not intended to be a decision-making
    body, nor should it be a forum for long-winded discussions and presentations.


    # Tip


    Your PO can, in addition to benefit hypothesis and an epic’s alignment to product
    goals, use the **weighted shortest job first (WSJF)** model, as described in the
    SAFe framework. You can read more about it here: https://www.scaledagileframework.com/wsjf/.


    You should determine how to progress your roadmap epics to the development pipeline.
    There are different options for translating your Salesforce roadmap to mid-term
    plans. Depending on the scale of your Salesforce program and the number of agile
    teams, you may opt for a smaller or larger planning setup.'
