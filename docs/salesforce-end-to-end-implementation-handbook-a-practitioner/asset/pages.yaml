    *PME has effectively phased its Salesforce implementation by scope, already reducing
    the risk of its implementation significantly. It is also keen to phase its project
    by geography.*


    # Iterating in the pre-development phase


    Determining how to deliver your Salesforce project is an important undertaking.
    Determining your Salesforce program roadmap and the scope for an initial Salesforce
    project is an iterative process. You will return to your roadmap and make modifications
    as you become aware of dependencies and more familiar with the cost to acquire
    licenses and implement features. Iteration and modifications are great – you are
    further shaping your Salesforce to fit your organization. Capture any changes
    and decisions in your RAID log.


    # Summary


    In this chapter, you have made many considerations for how best to deliver your
    Salesforce project. You have considered what delivery methodology is most appropriate
    for your particular project and organization, and you have considered how you
    might phase your implementation by scope and geography to reduce the risk and
    increase the speed of delivery. Then, you were introduced to change management,
    the degrees of change management. You also learned how to identify the many stakeholders'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'affected by change as a result of your Salesforce project, and how you should
    *time* your change management activities depending on your chosen delivery methodology.
    Finally, you envisioned your Salesforce CoE, your management and governance body
    to oversee your Salesforce program, and you learned how to create a Salesforce
    program roadmap.


    Up until now, you have created a vision for your Salesforce project – the *why*
    – as well as the nature of it – the *what* – of your project, and you have just
    determined *how* to deliver it.


    You are now ready to move on to the last chapter in the pre-development phase
    of your Salesforce implementation: *Chapter 4, Securing Funding and Engaging with
    Salesforce and Implementation Partners*. It is time to determine *how much*.'
