- pgno: 250
  md: 'We’ll cover the remaining activities shown in *Figure 10.1* – **Training users**,
    **Providing hypercare**, **Providing support**, and **Monitoring and driving adoption**
    – in the following sections.


    Many of the activities in this chapter of your Salesforce project are happening
    in parallel, so keep all the plates spinning to progress toward your goal. A wise
    woman once said, “perfect planning prevents poor performance”, and that certainly
    applies to roll-outs.


    Let’s dive into how you can roll out in waves!


    # Phasing the roll-out of your Salesforce solution


    While you can reuse many elements of your change management template for further
    roll-outs, you need to execute all the activities *for each* wave of the roll-out.
    Therefore, it makes sense to group or cluster some local organizations together
    in a **roll-out wave**.


    A phased roll-out approach has many benefits, but there are some important considerations
    for choosing it. The main consequence of choosing a phased roll-out approach is
    **concurrent systems**. Let’s first consider the key reasons why you might need
    to have concurrent systems in the roll-out phase:


    +   - Your initial Salesforce release (the MVP) does not support all capabilities
    currently covered by your legacy system

    +   - Different geographies will roll out your Salesforce solution at different
    points in time, resulting in different geographies working with different systems

    +   - Different functional user groups (marketing, sales, and customer service)
    will roll out your Salesforce solution at different points in time, resulting
    in different functional user groups working with different systems'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'There may be many reasons why and instances in which you will need to keep
    two systems active. Whatever the reason, concurrency may have the following impacts,
    depending on the nature of your Salesforce solution and roll-out planning:


    +   - Users on both systems at the same time means they will be update and entering
    new data into both systems and it will be out of sync:

    +     - This can be mitigated by doing regular delta data migrations or (if a
    viable economic option) creating interim integrations between the two systems
    until the old system can be retired:

    +       - The old system sometimes is left available but in a read-only state
    so users can reference legacy data if needed. If that approach is taken, it should
    be limited to a short period after go-live.

    +   - Another consideration is the feasibility of integrations with third-party
    systems:

    +     - Can the new Salesforce system and legacy CRM both be integrated with other
    systems at the same time?

    +     - If not, choosing whether Salesforce for your legacy CRM should be connected
    to the third-party system is an important decision to be made.


    In Figure 10.3, you can see an example of how our scenario company, PME, has chosen
    to phase the roll-out of their Salesforce solution:'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/307881206539c45e128c538a4b6912f8_252_0.png)


    Figure 10.3 – Example of a phased roll-out overlapping with continuous improvement


    *PME has decided to go live initially only with one country – the pilot country.*


    *Their approach has three main advantages. First, it requires less effort (the
    first country has fewer people who are going to use the solution) for the project
    team to plan and execute all the roll-out activities. Second, it allows the project
    team to collect valuable feedback on the solution, which can be used to prioritize
    changes as the Salesforce program enters the continuous improvement phase. Third,
    the project team can test the change management and roll-out plan – and can optimize
    accordingly ahead of further roll-outs.*


    *As the PME Salesforce project team rolls out to the pilot country, they optimize
    their approach to be able to industrialize it – enabling them to accelerate roll-outs
    in increasing waves, with more countries per wave.*


    # Tip


    Align with your company’s leadership team or **project management organization
    (PMO)** to understand what constraints or concurrent projects or initiatives may
    impact the local organizations to which you wish to roll out. Include these considerations
    when preparing your phased roll-out plan.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Additionally, you should critically work with the leadership of the local organizations
    to align and confirm the change management and roll-out plan for their organization.


    Let’s take a closer look at user training!


    # Training your users


    User training is a key milestone in your Salesforce project – and if you have
    prepared your stakeholders well for the change to come, it can be a cause of celebration
    to finally be able to use Salesforce!


