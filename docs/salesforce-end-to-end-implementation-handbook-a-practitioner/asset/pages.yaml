    If you don’t fully understand the context of a data analytics initiative, you
    will not be able to develop a solution that hits the nail on its head.

    Best case, the use case is generic, and your solution follows general best practices
    for the pattern. In the worst case, your solution misses the target, leaving a
    trail of despair and technical debt behind.

    It cannot be said enough, but involve your intended users when designing solutions
    – the same applies to data analytics, automation, and AI initiatives.


    You have initiated data analytics, automation, or AI initiatives without ensuring
    proper data quality.


    This is a recipe for failure that causes poor experiences, errors, low satisfaction,
    and potentially lost revenue.

    You shouldn’t develop data analytics, automation, or AI initiatives without putting
    in place guardrails for the quality of the data to be leveraged.


    You struggle to govern, maintain, and improve your data analytics and AI deployments,
    such as chatbots or Einstein predictions.


    AI solutions require continuous monitoring and improvements to deliver maximum
    benefit. Continuous improvements are also required to keep up with your business,
    customers, and users.

    As such, you need to account for ongoing maintenance effort of roughly 10%-20%
    of your initial effort in setting it up.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '| You struggle to see *progress* in efforts to leverage your Customer 360 data.
    | The principle of aggregation of marginal gains also applies to data analytics,
    automation, and AI initiatives.

    Each initiative you successfully deliver – each feature, each data quality enhancement,
    and each analytics capability – all contribute to and amplify the success and
    value you and your Salesforce colleagues bring to your organization.

    Remember, it’s a journey – keep pushing onwards and upwards and the results will
    follow. |


    Table 14.3 – Possible root causes for being unable to effectively manage and leverage
    your Salesforce Customer 360 data


    Next, let’s evaluate the state of your Salesforce program in the continuous improvement
    phase.


    # Evaluating the state of your Salesforce program


    We have covered a lot of topics and activities in the continuous improvement phase
    of your Salesforce program. If you get stuck, or you are not pleased with your
    progress, the following section will support you in evaluating the state of your
    Salesforce program.


    For each item you cannot check, go back to the related chapters and complete the
    activities to mature your capabilities to maximize the return on your investments.


    # Checklist for your Salesforce program in the continuous improvement phase'
  merge: -1
  img_proc: true
- pgno: 359
  md: '*At the beginning* of the continuous improvement phase of your Salesforce program
    – after the first go-live with Salesforce – you should go through the following
    steps:


    +   - Make sure your Salesforce program and platform vision align with your organization’s
    vision and strategy

    +   - Update your Salesforce CoE with core roles

    +   - Understand the concept of product organizations

    +   - Understand who the customers (users) of your Salesforce platform and products
    are

    +   - Understand what your Salesforce products are

    +   - Recruit or dedicate Salesforce product owners and empower them to truly
    own their products

    +   - Set goals for your Salesforce platform and products – aligned with your
    platform vision

    +   - Transform from funding discrete projects (statements of work) to funding
    your Salesforce program consisting of agile product teams

    +   - Update your operating and partner model

    +   - Update your Salesforce roadmap

    +   - Establish cross-functional agile product teams

    +   - Assess your agile maturity and DevOps capabilities – and initiate actions
    to evolve


    Throughout the continuous improvement phase, you should *continuously* do the
    following:


    +   - Enhance your understanding of product organizations and drive activities
    to drive your organization’s transformation to become one

    +   - Evolve your persona descriptions by deepening your insights into your Salesforce
    users’ jobs-to-be-done and pains and gains, and regularly facilitating user feedback
    forums'
  merge: -1
  img_proc: true
- pgno: 360
  md: '+   - Monitor and understand your users’ adoption and usage of new and existing
    features

    +   - Govern the health of your Salesforce platform by:

    +     - Facilitating regular design authority sessions for reviewing new proposed
    solutions

    +     - Performing regular health checks

    +     - Keeping documentation up to date

    +     - Defining and communicating development standards and guidelines

    +   - Move toward smaller, more frequent releases

    +   - Regularly evaluate your Salesforce DevOps capabilities and drive actions
    to enhance them

    +   - Govern your Salesforce data quality efforts by running a data governance
    board

    +   - Improve your Salesforce data quality by using the DMAIC framework

    +   - Assess your data maturity by determining the most common nature of your
    data analytics initiatives (descriptive-diagnostic-predictive-prescriptive-cognitive)

    +   - Implement new and continuously improve your data analytics, automation,
    and AI initiatives

    +   - Enhance your data analytics, automation, and AI capabilities to leverage
    your Customer 360 data

    +   - Govern, monitor, maintain, and improve your data analytics, automation,
    and AI initiatives

    +   - Inspire the peers and leadership in your organization

    +   - Inspire and engage with the Salesforce Trailblazer community

    +   - Share your knowledge and experiences'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'Let’s wrap up this final chapter.


    # Summary


    In this chapter, you have become familiar with some of the most common issues
    faced in the continuous improvement phase of Salesforce *programs*. If you face
    one or more of the issues mentioned in your own Salesforce program, you now know
    how to mitigate or prevent them from arising altogether.


    You have also assessed the state of your Salesforce program by going through the
    phase checklists so that you know where to focus your efforts to improve.


    With your Salesforce program and platform evolving, I leave you with a final note:


    We all face challenges, risks, and issues in our work and personal lives. It’s
    how we deal with them that shapes us and our organizations.


    I wrote this book because I wanted to share what I’ve learned while helping organizations
    implement Salesforce and get the most out of their investments. My purpose was
    to offer insights into what I’ve seen work and not work, so that you could learn
    from them, and get the most out of your time working with Salesforce.


    If you have found parts of this book useful or if there are parts you have a different
    perspective on, I’d love to hear about them and learn from them. I invite you
    to please share your points of view so that we can create *#BetterSalesforceDelivery*.'
  merge: -1
  img_proc: true
