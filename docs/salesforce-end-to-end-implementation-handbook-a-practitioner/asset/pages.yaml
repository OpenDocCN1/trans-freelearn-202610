- pgno: 126
  md: '# Evaluating your quote from Salesforce


    When you speak with an account executive and a solution engineer from Salesforce,
    they will ask several questions about topics you haven’t even considered. They
    are using these probing questions to understand what products may be relevant
    for your company.


    Be prepared to be amazed and inspired. You may find yourself a bit overwhelmed
    with all the options and possibilities. Keep a healthy balance of inspiration
    and trust in the work you have done until this point in terms of delivery methodology,
    project phasing, and roadmap creation.


    You may find yourself updating your various artifacts to include some new capabilities
    and new Salesforce products.


    # Tip


    As you engage with implementation partners and are provided with their proposed
    solutions and required licenses, you may find yourself needing to modify the needed
    licenses. To settle on the required licenses, have alignment calls with Salesforce
    and your chosen implementation partner.


    Next, let’s talk with implementation partners.


    # Engaging with implementation partners


    In this section, we’ll cover types of implementation partners, the process of
    selecting one, how to communicate with them, what to look for when selecting one,
    and what to pay attention to when contracting.


    # Types of implementation partners'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'As of August 22, 2022, there are 2,141 registered consultancies on Salesforce
    AppExchange (https://appexchange.salesforce.com/consulting) offering implementation
    services. They range from one-man shows to global consulting firms.


    Let’s understand how the types of implementation partners differ:


    +   - **Global consulting firms**: These are major consulting, IT strategy, and
    implementation companies. By definition, they cover all types of IT services and
    domains. They are partners with all the largest enterprise software companies
    (Salesforce, Microsoft, SAP, Google, and AWS). They also provide custom software
    development services in all programming languages and have major **offshore**
    hubs for application and system development and managed services. They typically
    leverage their scale and offshore hubs for competitive advantage.

    +   - **Specialty firms**: These types of implementation partners focus on Salesforce
    implementations. They range from small boutique firms to full-fledged consultancies
    offering strategy and change management advisory services in addition to Salesforce
    project delivery. Most specialty firms focus on specific clouds and/or industry
    segments. The specialty firms stand out as niche cloud and/or industry experts.

    +   - **Contractors**: These are individuals who prefer not to have a permanent
    contract. They typically contract full-time, exclusively, for one company for
    3-6 months with the possibility of an extension at the end of the contract period.

    +   - **Freelancers**: They are similar to contractors, but instead of contracting
    exclusively with one company, they may work with multiple clients at a time.

    +   - **Salesforce Professional Services**: The services arm of Salesforce. Similar
    to specialty firms as they solely focus on Salesforce implementation services.


    Let’s see how you might go about finding the implementation partner for your Salesforce
    project.'
  merge: -1
  img_proc: true
