  md: 'for your Salesforce project.


    # Presenting your Salesforce project business case


    If you have been following each chapter in the pre-development phase section of
    the book, creating your **business case presentation** will be a breeze.


    Invite these key stakeholders for your meeting: the executive sponsor, **Chief
    Executive Officer (CEO)**, **Chief Information Officer (CIO)**, **Chief Financial
    Officer (CFO)**, representatives from commercial leadership, the enterprise architect,
    and all your fellow Salesforce taskforce members.


    Include the following sections in your Salesforce project business case presentation:


    +   - **Executive summary**: Include the key financial metrics of your project
    as well as the benefits of improving the innovation capabilities of your company.

    +   - **Vision**: Include the vision you created in *Chapter 1*, *Creating a Vision
    for Your Salesforce Project*.

    +   - **Nature of the project**: Include the business domain capabilities and
    the hypothetical technical scope you defined in *Chapter 2*, *Defining the Nature
    of Your Salesforce Project*. Highlight how **business users** will stand to benefit
    from your project and how it will improve the **customer experience**.

    +   - **Project governance**: Show the governance and management framework you
    envision your Salesforce CoE will provide referring to your work on this in *Chapter
    3*, *Determining How to Deliver Your Salesforce Project*.

    +   - **Delivery methodology and phasing approach**: Explain how you plan to deliver
    your Salesforce project as defined in *Chapter 3*, *Determining How to Deliver
    Your Salesforce Project*.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   - **Indicative project timeline**: Depending on your chosen delivery methodology
    and phasing approach – in combination with your estimate of implementation costs
    – highlight the following milestones of your Salesforce project: project start,
    development start, UAT, first go-live, and the target month or quarter when all
    intended users are live on your solution.

    +   - **Change management strategy**: As you determined in *Chapter 3, Determining
    How to Deliver Your Salesforce Project*.

    +   - **Indirect benefits**: Highlight the benefits of being able to innovate,
    adapt to change, and lower risk to business continuity.

    +   - **Implementation cost**: Refer to your work on financial forecasting earlier
    in this chapter.

    +   - **Project investment**:

    +     - 3-year and 5-year financial impact

    +     - Project payback time (month)

    +     - Project ROI

    +   - **Program roadmap**: Looking beyond your Salesforce MVP solution, include
    the roadmap you created in *Chapter 3, Determining How to Deliver Your Salesforce
    Project*.


    You have now presented your business case to management – well done!


    If it was the first meeting, and you have yet to engage with Salesforce and implementation
    partners, you will have based your license cost and implementation costs on assumptions
    and previous experience.


    If you didn’t secure funding in the first meeting, ask for and note down the key
    objections and feedback. This will let you know which areas you need to work on
    to make the business case stronger – you will need to consider what to change
    and how it changes other components and costs. Potentially modify the scope, delivery
    methodology, phasing, KPIs and targets, and, therefore, the financial forecast.'
