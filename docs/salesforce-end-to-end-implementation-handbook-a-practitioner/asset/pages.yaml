    +   - Loss of organizational trust in your Salesforce program, and ultimately
    loss of funding

    +   - Long wait for new features

    +   - Wasted resource (time) by your team members that could have been spent developing
    new features

    +   - High risk of deployment failure

    +   - High risk of lower adoption


    Often, the issue is related to not evolving your DevOps capabilities.


    Consider the following approach to reduce deployment and lead time:'
