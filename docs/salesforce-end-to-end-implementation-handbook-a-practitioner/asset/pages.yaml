    # Iterating in the pre-development phase


    Scoping a Salesforce project is a big and interesting exercise – one that always
    takes more than one iteration. As you progress through the following activities
    of the pre-development phase, you will return to review the capabilities to be
    supported by your Salesforce solution and the high-level technical scope. As you
    do, make sure you update your RAID log to capture decisions and assumptions. You
    are well on your way to making your Salesforce project take shape.


    # Summary


    You have now established a hypothesis of what the business and technical scope
    should be for your Salesforce project – the nature of your Salesforce project.
    You started by learning how to gather input and determine the desired business
    capabilities. Then, you were introduced to the Salesforce product portfolio. Finally,
    you had a first attempt at defining the high-level technical scope of your Salesforce
    solution.


    So far, you have created a vision for your Salesforce project – the *why* – as
    well as the nature of it – the *what* – and you are ready to move on to the next
    chapter of your Salesforce implementation: *Chapter 3, Determining How to Deliver
    Your Salesforce Project*. It is time to look at the best way to deliver your Salesforce
    project – the *how*.'
