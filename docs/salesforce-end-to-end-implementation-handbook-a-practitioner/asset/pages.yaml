    # Figure 4.5 – P&L impact of PME’s Salesforce project


    In addition to calculating the P&L impact of your Salesforce project, you need
    to determine two key financial investment metrics:


    +   - **Payback time**: The *duration* before the negative financial impact of
    your investment – Salesforce licenses, implementation and roll-out costs, and
    your new Salesforce CoE – is weighed up (paid back) by the positive financial
    impact on your operating profit from the expected superior business outcomes:
    increased revenue and reduced operating costs.

    +   - **Return on investment (ROI)**: A simple *ratio* of your one-off investment
    versus the impact on your operating profit. The one-off investments in the case
    of PME are implementation and roll-out costs.


    Since organizations differ in risk appetite, what an acceptable payback time is,
    and how long it is willing to wait to reap the financial benefits of its investment
    in Salesforce, it is advisable to include both 3- and 5-year financial projections.


