- pgno: 175
  md: '# Building and Testing Your Initial Release


    In this chapter, we will cover how to build and test your Salesforce solution
    for initial release. We will go through what your solution consists of under the
    hood, the available Salesforce development models, and sandboxes. Then we’ll describe
    the agile team roles, the value of agile ceremonies, and how to effectively manage
    your development process. We’ll cover the governance mechanisms you can, and should,
    consider putting in place to steer your Salesforce project and the changes that
    may occur along the way. We’ll describe the various types of development phase
    testing you should be familiar with. Finally, we’ll go through the steps to create
    your data migration plan.


    You will learn about the Salesforce development life cycle and how to organize
    an agile team consisting of both internal and external members, how to facilitate
    agile ceremonies, and how to govern the delivery of your Salesforce project. You
    will also learn how to distinguish between different types of testing for your
    Salesforce solution. Then, we’ll discuss ways of measuring progress. Finally,
    you will learn how to execute due diligence for data migration planning.


    We will follow the Salesforce CoE of **Packt Manufacturing Equipment (PME)** as
    it oversees and collaborates with the company’s implementation partner.


    In this chapter, we’ll cover the following main topics:


    +   - Understanding the roles and responsibilities of your team members

    +   - Planning your build phase

    +   - Setting up your development model and environments

    +   - Establishing your development process

    +   - Governing your Salesforce project in the development phase'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Preparing your data migration plan


    Let’s go!


    # Understanding the roles and responsibilities of your team members


    It is the people in your team that will make or break your Salesforce project.
    Ensure you invest in making sure roles and responsibilities are clear, processes
    are optimized to deliver value as effectively as possible, and that you have a
    learning and growth mindset to continuously improve your setup.


    In the previous chapter, business analysts and architects interacted with your
    business and technical stakeholders to break down the overall scope of your Salesforce
    project into user stories and create the solution design artifacts.


    In this chapter, we’ll cover a hybrid agile delivery methodology, and as we are
    in the development phase, we’ll go deeper into its agile aspects.


    You will begin configuring and developing your Salesforce solution. Depending
    on your chosen delivery methodology, some project members may not yet have been
    onboarded – but they are about to be.


    Let’s start by looking at the common Salesforce project and agile team member
    roles and their main responsibilities:


    +   - **The product owner (PO):**

    +     - Owns and manages the backlog of their agile team and prioritizes the backlog
    ahead of sprint planning. The PO is also responsible for'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'stakeholder management and release management from a business perspective.


    +   - Is responsible for answering questions from functional consultants and developers
    to provide clarification and further details on user stories.

    +   - Is responsible for validating developed user stories against acceptance
    criteria.

    +   - Is responsible for consolidating feedback from stakeholders (together with
    the business analyst) at product demos, creating user stories, and communicating
    decisions back to stakeholders.


    # Tip


    If you plan to develop in sprints – which is the underlying assumption for this
    chapter – make sure you allocate a *competent and empowered PO* to work in the
    agile development team continuously throughout your project. Your PO is instrumental
    in backlog refinement and in validating the user stories developed by the development
    team.


    # The scrum master:


    +   - Facilitates agile ceremonies and coaches team members to understand their
    roles and responsibilities, processes, and agile ceremonies and values.

    +   - Removes obstacles and blockers or escalates issues if they are unresolvable
    within the team.

    +   - Should aim to shield the development team from meetings and administrative
    work, so they can focus on building solutions.

    +   - Is a role typically fulfilled by your implementation partner. Many implementation
    partners have a development methodology they follow – as such, it makes sense
    for them to staff the scrum master role. If your contract with the implementation
    partner has any aspect'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'of fixed price and timely delivery, this role must be external to ensure accountability.


    +   - **The development team:** This consists of the people who perform the important
    low-level solution design, development, testing, and deployment of user stories.
    Each member of the development team can have one or more responsibilities, depending
    on their skill set and the nature and scope of your Salesforce project. The following
    are some of the common roles and responsibilities you will find in your Salesforce
    project’s development team:


    +   - **The functional consultant:**


    +     - Is responsible for developing declarative solutions (point-and-click)
    on the Salesforce platform.


    +     - Can have expertise in one or more Salesforce products or subdomains of
    CRM. No functional consultant masters all clouds, so be sure that your team has
    the relevant knowledge and experience to match the scope of your Salesforce project.


    +     - Is a role typically fulfilled by your implementation partner, but if you
    have internal resources with Salesforce declarative development skills, you can
    opt to include them in the agile team. Again, be mindful of what the contract
    with your implementation partners states.


    +   - **The developer:**


    +     - Is responsible for developing programmatic (code) solutions on the Salesforce
    platform.


    +     - Can have expertise in one or more Salesforce products and/or coding languages.
    It is not common for a developer to master all products and technologies. For
    example, being a Marketing Cloud developer, coding AMPscript is vastly different
    from coding in Apex and building **Lightning web components**'
  merge: -1
  img_proc: true
- pgno: 179
  md: '(LWC) on the core platform. Make sure your developers have the relevant knowledge
    and experience to match the scope of your Salesforce project.


    +   - Is a role typically fulfilled by your implementation partner, but if you
    have internal resources with suitable development skills, you can opt to include
    them in the agile team while being mindful of your contract with the implementation
    partner.


    In a *Scrum* setup, the PO, scrum master, and development team are *collectively
    responsible* for ensuring the architecture is sound and the solution is of high
    quality and bug-free and for releasing, monitoring, and supporting change and
    adoption.


    However, for enterprise projects – including Salesforce projects – it is crucial
    to have the following specialized roles as part of your project throughout the
    development and roll-out phases of your Salesforce project:


    +   - **The Salesforce architect:**


    +   - In the hybrid agile delivery methodology, you allocate time and effort to
    create some degree of upfront solution architecture. What commonly happens is
    that circumstances and requirements change or assumptions turn out to not be right.
    In any of these scenarios, having one or more architects (solution architect and/or
    technical architect) available to support the development team in coming up with
    alternative or new solutions *ensures velocity and alignment with target architecture*.


    +   - Depending on the scale of your Salesforce project (or program), architects
    may be partially or fully allocated to your project but usually need not be fully
    allocated to a single agile team.


    +   - **The business analyst (BA):**'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   - In the development phase, the BA partners with your PO to refine user
    stories and get them **ready for development**. The definition of ready typically
    includes user story persona, need, purpose, additional context and supporting
    documents, and, critically, acceptance criteria. Depending on your degree of upfront
    architecture and level of user story solution design, your process may involve
    the BA to assign the user story to a solution or technical architect to provide
