    Next, let’s make sure you are ready to get your data into Salesforce!


    # Checking your data migration preparedness and signing off to go live


    You are now in the final stages of the development phase. You have successfully
    deployed your Salesforce solution and executed SIT and UAT.


    In this section, we are going to highlight the key practical considerations to
    evaluate whether you are really ready to start migrating data into your Salesforce
    production environment.


    # Evaluating your data migration preparedness


    Before you embark on migrating your data to production, make sure you have prepared
    – and practiced – your data migration plan. It should have been done in the development
    phase.


    Important note


    If you haven’t prepared your data migration plan, you need to pause and check
    out the *Preparing your data migration plan* section in *Chapter 7*, *Building
    and Testing Your Initial Release*, and get cracking before proceeding.


    Great, you have your data migration plan in place! This means you have determined
    how you will technically get your data out of any legacy'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'systems, other applications, and sources, and you know how and who will be
    transforming and loading it into Salesforce.


    Let’s look at the list of things you can use to evaluate your preparedness to
    begin migrating your data into Salesforce:


    +   - You have executed successful data migration dry runs in a staging sandbox.

    +   - You have confirmed that your Salesforce solution is deployed to production
    – including its configuration data.

    +   - You have confirmed with the development team – beforehand – whether automation
    and validations are designed to handle migrated data or whether they need to be
    made inactive during data migration. If the latter, you have confirmed who will
    do so and when.

    +   - You have aligned with and confirmed the availability of IT and business
    stakeholders to verify and validate your data migration in production. The same
    goes for the source system experts to be available in case of issues that need
    resolution by a new source system extraction run.

    +   - If your implementation partner will participate in migrating your data,
    make sure you comply with any laws applicable to the countries you operate in
    according to the nature of the data they will have access to and process.

    +   - You have agreed and aligned the amount of time you have for migrating to
    production – and validated this to be possible in at least one dry run.

    +   - You have a rollback plan in place. No one wants a data migration to fail,
    but the truth is some data migrations do fail or take longer than expected and
    acceptable by your stakeholders. So save yourself a headache and determine what
    you will do in the event the migration cannot be signed off.

    +   - You have communicated the data migration timing and impact on any system
    downtime to the teams who are about to go live.'
  merge: -1
  img_proc: true
