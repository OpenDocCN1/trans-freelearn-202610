- pgno: 302
  md: 'Two common frameworks for large agile setups are **Large-Scale Scrum (LeSS)**
    ([https://less.works/](https://less.works/)) and SAFe’s **program increment (PI)
    planning** ([https://www.scaledagileframework.com/pi-planning/](https://www.scaledagileframework.com/pi-planning/)).


    # Important note


    You should choose a framework that fits *your* organization’s needs, context,
    and level of agile maturity to deliver continuous improvement.


    Let’s now turn to the illusive concept of technical debt.


    # Managing technical debt


    Technical debt is best described by its symptoms and how it is created.


    The symptoms – or the impact – of technical debt include degrading system usability,
    slowing performance, corrupted data, and increasing security risks and issues.
    These symptoms materialize as an increasing number of bug reports, decreasing
    adoption rates, and a slowing innovation rate.


    Technical debt is created – or accumulated – in the following ways:


    +   - Making poor changes to your Salesforce platform based on the following:

    +     - *Poorly designed* solutions that require a high degree of maintenance
    outweighing the benefits of the solution itself

    +     - *Poorly governed* solutions that have been extended beyond the scope of
    their original purpose

    +   - Creating great solutions to the *wrong problems*:

    +     - If a solution is designed well but does not address the right problem,
    it won’t deliver business value, only clutter – technical debt'
  merge: -1
  img_proc: true
- pgno: 303
  md: '+   - *Not making any changes* to your Salesforce platform:

    +     - The world is changing at an accelerating speed, and organizations change
    to stay ahead or keep up with those changes. If the products – your Salesforce
    solutions – you offer to your users don’t change with your organization, they
    will effectively eventually become technical debt.


    It’s impossible not to have any technical debt, and it’s not a one-off activity
    to remove the debt you do have; rather, it’s a continuous effort to manage it.
    That doesn’t mean you should do nothing – on the contrary!


    You need to implement *governance structures* to limit the amount of new technical
    debt introduced to your Salesforce platform and *continuously remediate* impeding
    debt from your organization.


    # Important note


    Make sure your Salesforce platform architect works closely together with your
    platform owner and product owner(s) to ensure architecture principles and technical
    enablers (refer to [Chapter 2](Chapter 2), *Defining the Nature of Your Salesforce
    Project*) are included for changes and new solutions for your Salesforce platform.


    We’ll address the common issues and strategies for preventing and mitigating technical
    debt in [Chapter 14](Chapter 14), *Common Issues to Avoid in the Continuous Improvement
    Phase*.


    Having established your Salesforce roadmap – balancing functional features, technical
    enablers, and refactoring to manage your technical debt – let’s now turn to your
    Salesforce DevOps capabilities.


    # Evolving your Salesforce DevOps capabilities'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'To unlock more value from your Salesforce investment and achieve success while
    having peace of mind in the continuous improvement phase of your Salesforce program,
    you need to understand and enhance your organization’s DevOps capabilities.


    The process and capabilities you used in the development and roll-out phase of
    your initial Salesforce release were suitable for those phases – initial implementation
    and roll-out. *Now*, you need to set up your Salesforce program to be able to
    *continuously* take in feedback, build, release, and ensure the usage and adoption
    of new features – all while making sure your Salesforce organization is performant,
    reliable, and secure.


    Let’s start by introducing DevOps.


    # Introducing DevOps


    In 2004, Charles A. O’Reilly III and Michael L. Tushman published a paper titled
    *The Ambidextrous Organization* (you can read the paper here: https://hbr.org/2004/04/the-ambidextrous-organization).


    What characterizes an **ambidextrous organization** is its ability to do two distinct
    things well, *simultaneously*. What are those two abilities then? The ability
    to *manage operations* and the ability to *develop the organization*. Sound familiar?
    Yes, it’s awfully similar to DevOps – a movement that didn’t really begin until
    a few years later in 2007–2008.


    The paper proved ambidextrous organizations were top performers among their industry
    peers and 90% of them consistently reached the goals they set out to achieve.


    Not surprisingly, I see the organizations that are most successful in implementing
    and evolving Salesforce are the ones that are able to balance creating a usable,
    performant, reliable, and secure Salesforce platform while continuously delivering
    incremental business value to their users. It’s a case of staying grounded while
    reaching for the stars.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'While the theory of ambidextrous organizations is a general theory for an entire
    enterprise, DevOps was, and is, focused on the domains of development and operations
    of IT systems.


    # Understanding the principles and goals of DevOps


    As the use of agile delivery methodologies has become more prevalent since emerging
    in the 2000s and 2010s, the speed at which development teams are able to deliver
    new features has accelerated. As great as that sounds, it has, however, to some
    degree, come at the expense of decreasing system reliability. This means both
    a more unstable user experience as well as a headache for IT ops teams.


    The DevOps movement emerged to address those pain points by bringing together
    the IT development and operations teams, as well as *the business*, to further
    a *holistic mindset with shared goals* of how value is delivered while maintaining
    stable operations, as represented by the continuous DevOps loop shown in Figure
    12.3:


    ![](img/307881206539c45e128c538a4b6912f8_305_0.png)


    Figure 12.3 – The eight steps of the continuous DevOps loop


    According to the 2022 **DevOps Research and Assessment (DORA)** *State of DevOps*,
    there are five metrics to measure an organization’s DevOps capabilities:'
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   - One metric is related to *operational performance*:

    +     - **Reliability**: This covers availability, latency, performance, and scalability

    +   - Four of the metrics are related to *software delivery performance*:

    +     - **Lead time for changes**: The time from when changes are committed until
    they are released to production

    +     - **Deployment frequency**: How often you deploy to production

    +     - **Change failure rate**: The percentage of deployments that either fail
    or require hot-fixing or another rework to make them work

    +     - **Mean time to restore**: This is related to the previous metric – measuring
    the time it takes to restore a service after a change failure or incident


    # Tip


    You can read the full 2022 DORA State DevOps report here:

    https://services.google.com/fh/files/misc/2022_state_of_devops_report.pdf.


    Let’s now turn to Salesforce.


    # Enhancing your Salesforce DevOps capabilities


    So, what does DevOps mean in a Salesforce platform context? It is optimizing how
    value is delivered to the users of your Salesforce platform and products.


    So, what’s different in the continuous improvement phase? In the hybrid agile
    model, the epics and user stories were defined upfront before starting'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'development, and they went through development and testing before a dedicated
    phase for SIT, UAT, production release, and user onboarding in the roll-out phase.
    Now, in the continuous improvement phase, you should aim to adopt DevOps to be
    able to execute all of those steps and frequently release changes.


    Let’s break down each of the eight steps of the DevOps process (refer to *Figure
    12.3*) and see what it means in a Salesforce context, and what tools your organization
    can consider to support it.


    # Streamlining your Salesforce operations


    While DevOps absolutely is an integrated process, there are parts that are predominantly
    ops focused, and some that are dev focused.


    We’ll start with Salesforce *ops*, also known as **Salesforce administration**,
    for the simple reason that if something is broken, you can’t effectively develop
    it.


    The goal of Salesforce administration is to ensure reliability, performance, and
    security.


    Core Salesforce administration entails the following:


    +   - Managing your Salesforce production environment and providing support for
    your users

    +   - Potentially managing a production support environment

    +   - User management:

    +     - Provisioning and de-provisioning new joiners and leavers

    +     - Employees change roles and need new permission sets, groups, and queue
    memberships'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Tip


    Read the Salesforce Admin blog post about the future of user management at https://admin.salesforce.com/blog/2022/the-future-of-user-management.


    Depending on an organization’s scale, Salesforce administration may also entail
    the following:


    +   - Managing, maintaining, and creating sandboxes – including data

    +   - Handling new feature requests from users

    +   - Handling bug reports from users

    +   - Maintaining training materials

    +   - The first line of support for questions following the training of new users/employees

    +   - Regression-testing key processes three times a year with every Salesforce
    release

    +   - The support and creation of reports and dashboards

    +   - Managing data and performing data load requests (we’ll cover data management
    and governance more in *Chapter 13, Managing Your Salesforce Data to Harvest the
    Fruits of Customer 360*)


    # Tip


    While ensuring a stable, secure, and reliable Salesforce organization for your
    users is essential, be careful not to trap yourself by becoming too rigid, super-optimizing
    admin processes, or assigning too many resources for *operations* at the expense
    of resources for *development*.


    Another key aspect of operations, which should be intertwined with Salesforce
    development, is **monitoring**. The goal of monitoring is to observe adoption,
    system performance, reliability, and security. Critically, the goal is also to
    *continuously collect feedback for improvement*.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'The following activities describe the ways you should be monitoring your Salesforce
    org:


    +   - Tracking and understanding the adoption and usage of your Salesforce products

    +   - Monitoring platform performance and security


    # Tip


    Check out the SalesforceBen article for free ways to monitor your Salesforce organization
    at https://www.salesforceben.com/free-ways-to-monitor-your-salesforce-org/.


    +   - Performing regular technical and security audits

    +   - Monitoring incoming feature requests

    +   - Monitoring incoming bugs

    +   - Facilitating sprint retrospectives and demos


    # Tip


    Here are a few ideas you can use to improve how you collect feedback:


    +   - Facilitate user feedback forums.

    +   - Regular cadence with superuser representatives from the users of your Salesforce
    products. Host forums per Salesforce product and user group.

    +   - You should provide a simple template and method for your users and other
    stakeholders to submit new feature requests and changes to existing ones.

    +   - Use a **product management system** to consolidate user feedback, validate
    ideas, create roadmaps, and integrate with your development tool. Leading product
    management system vendors include **Productboard**, **Aha!**, and **JIRA Discovery**.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '+   - While development-focused tools such as Jira and Azure DevOps have some
    of the same features as a dedicated product management system, their focus – and
    specialism – is to support the agile development process, *not* user insights
    collection, ideas validation, prioritization, and Salesforce product roadmap creation.


    Let’s move on to the development of new features for your Salesforce platform
    users.


    # Optimizing your Salesforce development process


    The Salesforce development process starts with **planning**. The goal of planning
    is to order the product backlog and get the user stories towards the top of the
    product backlog to meet the **definition of ready**.


    The definition of ready is unique to each organization. Let’s see how our scenario
    company, **Packt Manufacturing Equipment (PME)**, defined their definition of
    ready:


    +   - The user story title, need, purpose, context, and details

    +   - The epic it is related to

    +   - Acceptance criteria

    +   - Business value

    +   - The solution design


    Tip


    You should also consider requiring user stories to state any required maintenance
    of the solutions proposed.


    +   - **Change impact**, assessed for the following:'
  merge: -1
  img_proc: true
- pgno: 311
  md: '+   - **User impact**: How big a change does this user story provide for users?

    +   - **Technical impact**: How much does the user story impact your technical
    architecture?

    +   - **Regression test impact**: How much does the user story change and interfere
    with the business process in context? Technically, how many metadata components
    does the user story interfere with or change?


    # Tip


    There are many tools available to help you analyze the technical and potential
    regression test impact, including **Elements Cloud**, **Metazoa**, **Salto**,
    and **Happy Soup**.


    +   - If the nature* of the user story requires it, its solution design is reviewed
    by the **design authority (DA)**


    # *Tip


    You can opt to only require the DA to review user stories where the solutions
    contain changes that potentially pose a greater technical and security risk to
    your Salesforce platform. These can include data model changes, security and sharing
    model changes, integrations, programmatic development, and complex automations.
    You can read more about setting up a design authority in the *Governing your Salesforce
    project in the development phase* section in *Chapter 7*, *Building and Testing
    Your Initial Release*.


    Why is it important for user stories to meet the definition of ready before starting
    development? Because you need to know what is going to be developed and released
    is based on a clear understanding of user needs. Moreover, that it is designed
    in line with both your development guidelines and best practices, and in a way
    that ensures users will want to use it.'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'You may decide to hold regular **backlog refinement** sessions to support your
    product owner in creating and qualifying product backlog items and to order their
    product backlog. In a backlog refinement session, a product owner, a business
    analyst, a customer experience expert, and perhaps a solution architect will typically
    do the following:


    +   - Create and qualify product backlog items

    +   - Assess change requests and user feedback forum input

    +   - Review incoming bugs

    +   - Break new epics into user stories

    +   - Assign stories for solutioning ahead of design authority sessions

    +   - Order the backlog ahead of sprint planning


    # Tip


    Your product owner can use the following methods and measures to qualify user
    stories and determine their order in the product backlog:


    +   - How each item ties back to the product goals

    +   - The business value it delivers


    If you are using Scrum, **sprint planning** will happen on a regular cadence (every
    1–4 weeks), with the goal of determining a sprint goal and defining the sprint
    backlog by filling it up with user stories to the capacity of the agile development
    team. You may recall the options for defining and measuring sprint capacity in
    *Chapter 7, Building and Testing Your Initial Release*. To progress your agile
    maturity, you should consider using the pure agile concept of story points.


    Sprint planning goes as follows:


    +   1. Before sprint planning, the PO orders the product backlog.

    +   2. The PO presents the user story at the top of the product backlog.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '3. Story points are assigned using **scrum pokering**.


    # Tip


    For virtual story point pokering, https://www.scrumpoker-online.org is a great
    online tool.


    4. The user story is assigned to the sprint backlog by the scrum master.


    5. The process is repeated until team capacity (story points) are assigned.


    # Tip


    The first sprint planning when you introduce story point pokering will be an abstract
    exercise, as your team members won’t (yet) have a common, shared frame of reference
    of what the nature of a seven-story-point user story is. Neither does your team
    have a history of sprints to know what their capacity is. The important thing
    is just to get started – take a leap of faith. The common frame of reference is
    typically established quite quickly, within one or two sprint planning sessions.
    For development capacity, you need to go with a vote of confidence from the team
    members in the first sprint planning. Experienced developers have a good gut feeling
    of how big, complex, and risky different user stories are, and they will share
    when they are losing confidence in the team’s ability to complete the sprint backlog.


    Next is **coding** or the actual development done by functional consultants and
    developers. The goal with development – not surprisingly – is to configure and
    develop solutions on your Salesforce platform.


    Refer to the *Setting up your development model and environments* section in *Chapter
    7*, Building and Testing Your Initial Release.


    After development comes **building** or **continuous integration**, which entails
    merging the newly created or changed metadata with the existing version of your
    Salesforce source, and identifying any merge conflicts and resolving them. Refer
    to the *Deploying your Salesforce solution through*'
  merge: -1
  img_proc: true
- pgno: 314
  md: '*environments section in Chapter 9, Deploying Your Release and Migrating Data
    to Production, to read more about **system integration testing (SIT)**.*


    When choosing your deployment (CI/CD) setup and tooling, you face the same challenge
    as when deciding how to build your Salesforce features – use OOTB Salesforce,
    buy and use an AppExchange solution, or build your own solution. Let’s understand
    the options as of January 2023:


    +   - **Salesforce OOTB deployment tools**: Salesforce’s own tools include the
    following:

    +     - **Change Sets**: A legacy deployment tool. It’s cumbersome, inflexible,
    and doesn’t rely on a **version control system (VCS)**.

    +     - **DevOps Center**: This recently released feature (GA in winter 2023)
    has some capabilities somewhat similar to the **COTS (Commercial Off The Shelf)**
    tools described further on:

    +       - It currently does not include features such as impact analysis, data
    migration, and choosing delta or full deployment, and can’t be extended in the
    same way you potentially could if you built your own or were supported by some
    of the COTS CI/CD vendors.

    +   - **Buying a COTS CI/CD solution**: Investigate which one of the many vendor
    solutions is best for your organization. Popular vendors include the following:

    +     - **Gearset, Copado, Salto, Metazoa, and AutoRABIT**

    +   - **Building your own CI/CD pipeline**: This provides full flexibility but
    requires a dedicated team to manage and improve the setup.


    # Important note'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Engage a Salesforce technical architect and/or a DevOps architect to analyze
    which DevOps tooling and roadmap is best suited for your organization, keeping
    in mind your resources, capabilities, and the scale of your Salesforce platform.


    Most of the COTS CI/CD tools mentioned leverage a Git-based VCS. Setting up a
    VCS is one of the basic prerequisite steps in implementing DevOps. Setting up
    and working with a VCS for Salesforce can be a challenge for non-technical team
    members. As such, be mindful of your intended team members when selecting a tool
    – and be sure to allocate time for training on how to use it.


    To help you choose a course of action, read the blog post *Which Git hosting provider
    is right for your Salesforce team?* from Gearset at https://gearset.com/blog/which-git-hosting-provider/.


    Following a successful build or integration of components, the next step is **testing**.
    The goal of testing is three-fold:


    +   - Testing the individual functionality of the user story:

    +     - This includes positive and negative test cases

    +   - Regression-testing the process that the user story is part of to check that
    it works as intended

    +   - Unit testing


    When considering implementing an automated testing tool, be aware that regardless
    of how you execute regression testing, the tests need to be regularly updated
    as new features are added to your Salesforce organization, and this needs to be
    considered as part of the investment. Options to consider include **Provar**,
    **Testim**, and **Selenium**.


    The next step is **deployment** to production, which is getting your merged, integrated,
    and tested solution(s) deployed to your Salesforce production environment. The
    goal of deployment in DevOps is continuous deployment,'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'meaning that merged and tested solutions should be deployed as often as fast
    as possible to minimize the risk of them becoming outdated.


    Finally, there is the matter of **releasing** your solutions to users.


    Why are deployment and release separated? They aren’t always, but it makes sense
    from a conceptual standpoint. Simply deploying a solution does not ensure users
    will use them. The goal of releasing is to be able to **release on demand** (when
    you and your users are ready) and ensure usage and adoption.


    In Salesforce, **Custom Settings**, **Permission Sets**, and **Custom Permissions**
    are common ways to implement **feature flags** to release on demand.


    # Tip


    To learn more about using Custom Permissions for feature flagging, check out this
    blog post at https://blog.texei.com/why-we-should-use-custom-permissions-a8b5c22bbe94.


    To make sure users will use (and want to use) your new features, you need to help,
    guide, and support them – change management doesn’t stop in the continuous improvement
    phase of your Salesforce program. Your change management effort should correspond
    to the scale of change.


    Depending on the nature and scale of the change, your change and communication
    efforts could include the following:


    +   - Release notes

    +   - Training

    +   - Videos


    # Tip


    To enhance user adoption and minimize the need for synchronous training, consider
    using Salesforce **In-App Guidance** or, for more sophistication,'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'AppExchange solutions such as **Improved Help**.


    And with that, you have completed the loop from operations to releasing. Let’s
    now reflect on and assess your current Salesforce DevOps setup.


    # Reflecting on your Salesforce DevOps journey


    Your DevOps systems, as well as other sources, will tell you how well your DevOps
    capability is performing to deliver a stable operating environment, while continuously
    innovating for the benefit of your users and organization. It’s a never-ending
    journey to refine your DevOps capabilities.


    Tip


    Take the **DORA DevOps Quickcheck Quiz** at [https://www.devops-research.com/quickcheck.html](https://www.devops-research.com/quickcheck.html)
    to see how your organization’s Salesforce DevOps setup compares to your industry
    peers.


    Although the hardcore DevOps metrics will tell you how well your DevOps setup
    is performing, be sure to also measure how satisfied your Salesforce team members
    are with their work life. Job satisfaction of your team is inherently important
    to strive for, and also has a huge impact on the success of your Salesforce program.


    Important note


    Adopting a DevOps mindset and practices will require redefining your (IT) operating
    model and how your IT development department, operations department, and business
    stakeholders work together, and how they are organized.


    Let’s now wrap up this chapter!'
  merge: -1
  img_proc: true
