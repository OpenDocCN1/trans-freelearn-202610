    page layouts, Lightning record pages, and screen flows | Business logic: flows,
    process builder (retiring), and workflow rules (retiring) Integration: connectors,
    flow with outbound messages and enhanced External Services |

    | Customization components (low-code/pro-code) |  | LWCs, Visualforce (VF) pages,
    Aura components, Canvas Apps, and iFrame | Business logic: Apex triggers, Apex
    classes, and Salesforce functions Integration: Platform events, |'
