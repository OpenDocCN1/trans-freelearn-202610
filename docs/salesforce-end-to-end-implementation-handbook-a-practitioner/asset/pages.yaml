    +   - Determined your hypercare and ongoing support process

    +   - Allocated resources and aligned roles and responsibilities

    +   - Decided the criteria for transitioning from hypercare to ongoing support
    – hitting your adoption target


    Last, but certainly not least, you should do the following activities to monitor
    and drive the adoption of your Salesforce solution:


    +   - Created reports and dashboards to track login and usage of Salesforce

    +   - Sent out and analyzed responses to surveys to understand your user’s sentiment
    toward Salesforce

    +   - Carried out interviews to better understand your user’s perceptions and
    suggestions for improvement of your Salesforce solution

    +   - Carried out interventions with individuals or groups of users resistant
