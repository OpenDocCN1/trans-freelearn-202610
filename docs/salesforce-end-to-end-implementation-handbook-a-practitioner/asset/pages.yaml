- pgno: 79
  md: '![](img/307881206539c45e128c538a4b6912f8_79_0.png)


    Table 3.1 – Enterprise project types


    A key takeaway from comparing the types of enterprise projects in *Table 3.1*
    is regarding **development in production**. For business projects, this is simply
    not relevant as they are not IT projects. For the remaining project types, it
    may be the case that projects and solutions are developed directly in a production
    environment, simply because there are no supporting development environments for
    the system, or because the risk or the impact of the risk is considered low since
    the application is not mission critical for the company.


    Important note!


    For **enterprise-grade** Salesforce projects with solutions integrated into multiple
    systems and with mission-critical processes supported by Salesforce, *development
    should never be directly in production.*


    Let’s move on to Salesforce projects and programs.


    # Distinguishing between Salesforce projects and Salesforce programs'
