- pgno: 108
  md: '# Determining KPIs and targets for your required business capabilities


    If you want to be able to measure whether your Salesforce project is a success
    when it is rolled out, you need to establish how you will measure performance
    and what targets define success. Your Salesforce taskforce should not be setting
    the business targets; you should be engaging with your business stakeholders to
    determine what **key performance indicators (KPIs)** make sense to track and what
    **KPI targets** to aim for.


    This may seem like a big undertaking upfront but consider the opposite: if no
    KPIs or goals are set, project success measurement will rely on subjective qualitative
    input from various user groups rather than pre-determined and well-founded considerations.
    Furthermore, you will be thrilled to have done this exercise when you put together
    your business case and engage with Salesforce and implementation partners.


    In the following table, you will see some examples of how Packt **Manufacturing
    Equipment (PME)** is determining KPIs and targets for their business capabilities:


    | Domain | Capability | KPI | KPI Target |

    |---|---|---|---|

    | Marketing | Lead generation | Number of marketing-qualified leads generated
    | 10% increase |

    | Sales |  | Average lead processing time | 35% decrease |

    | Sales | Lead management | An increased lead conversion ratio | 5% points increase

    *For example, from a 25% to 30% conversion ratio* |

    | Sales | Opportunity management | Number of new opportunities created | 3% increase
    |'
  merge: -1
  img_proc: true
- pgno: 109
  md: '|  |  | by sales |  |

    |---|---|---|---|

    |  |  | Average duration from opportunity creation to closed-won | 20% decrease
    |

    |  |  | Average closed-won opportunity ratio | 2% points increase |

    | Customer service | Case management | Average handle time (AHT) | 20% decrease
    |

    | Customer service | Case management | Case resolution time | 15% decrease |

    | Customer service | Case management | Net promoter score (NPS) | 10% increase
    |


    Table 4.1 – Examples of KPIs and targets for business capabilities in PME’s Salesforce
    project


    # Tip


    If your company is currently not tracking these KPIs, your first task – as a member
    of the Salesforce taskforce – is to assist your business stakeholders in establishing
    a valid baseline before determining the targets for your Salesforce project.


    Having determined your KPIs and their targets, let’s move on to your business
    case.


    # Creating the business case for your Salesforce project


    Implementing Salesforce as a whole needs to make financial sense by putting your
    company in a better financial position compared to the status quo, as well as
    compared to implementing an alternative CRM solution. Recall how we distinguished
    between programs and projects in the previous'
