  md: 'evaluating the received proposals.


    # What to look for in partners


    Choosing an implementation partner for your Salesforce project can be overwhelming,
    and not only because of the sheer volume of information you need to consume and
    try to comprehend. Common procurement practices state you need to define a number
    of evaluation criteria for the RFP responses. These often include price, relevant
    technical expertise, and company risk.


    In addition to the usual suspects, I recommend you pay attention to the following
    characteristics of the implementation partners you have invited to participate
    in the RFP process:


    +   - Which implementation partner(s) *challenge you*, offer a different or new
    perspective on your business challenges, and suggest alternative technical solutions
    or different project phasing approaches?

    +   - *Think end-to-end*, even if you did not explicitly ask them to. For example,
    if an implementation partner asks several questions regarding reporting strategy
    or billing, invoicing, and payment processes – just for them to understand the
    end goal – that is a great sign that they consider your end-to-end business processes.

    +   - *Boldly highlight risks* and propose mitigation actions. Experienced professionals
    know what risks are common for your type of project and will know how to advise
    you to proceed.


    Let’s see what insights PME gained from the responses to their RFP.


    *PME selected four implementation partners to respond to their RFP. One implementation
    partner stood out, as they addressed some of the key assumptions PME included
    in the RFP:*


    +   - *PME included Marketing Cloud Account Engagement (Pardot) as an assumption
    for their marketing automation as it is mentioned to be ideal*'
  merge: -1
