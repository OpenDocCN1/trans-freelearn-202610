- pgno: 59
  md: 'At this stage, you are busy gathering information, creating process maps, understanding
    your company’s current business capabilities, and imagining new capabilities to
    be supported by your future Salesforce solution. As you progress through this
    stage, let’s look at how a RAID log will help you in your process.


    # Starting to build your RAID log


    At this stage, you will already have encountered many different stakeholders with
    various inputs, suggestions, and expectations of the project.


    Be sure to capture RAID items related to the project in a repository available
    to the Salesforce taskforce team and key stakeholders. RAID stands for the following:


    +   - **Risks**: Log any risks you may have uncovered as you progress through
    the phases of your Salesforce implementation. Capture any actions you are making
    to prevent or mitigate the risk.

    +   - **Probability-impact matrix**: Beyond a risk title and description, be sure
    to note down what the impact would be if the risk were to materialize, and what
    the probability is for the risk happening. This categorization helps you prioritize
    risks and focus on the prevention or mitigation of high-impact and high-probability
    risks.

    +   - **Assumptions**: For any assumptions you make throughout your Salesforce
    project, make sure to capture them. Add categories for easy sorting.

    +   - **Issues**: If a risk that has already occurred is having an impact, this
    is now an issue to be handled. Keep a log of ongoing issues, including actions
    you are taking to fix or mitigate them.

    +   - **Decisions**: Capture any decisions made by the Salesforce taskforce, independently
    or in agreement with your executive sponsor and wider leadership team. Be mindful
    that things are not yet set in stone. As such,'
  merge: -1
  img_proc: true
- pgno: 60
  md: '> decisions made in the first iteration of the pre-development phase may be
    modified as you capture more insights and gain more knowledge. Be open to change
    at this stage – the nature of your Salesforce project is being shaped to better
    fit with your organization’s business needs.

    > That’s a key factor for ensuring the success of your Salesforce project!


    Now that you have gathered all the business capabilities for your Salesforce solution,
    it is time to look at the important technical enablers for your solution to be
    able to function.


    # Determining the required technical enablers to support the identified business
    capabilities


    You have spent a great deal of effort understanding the business processes and
    desired new capabilities. What you might not have focused a lot on is the effort
    to understand and describe the technical enablers and non-functional requirements
    for your Salesforce solution.


    Let’s start by understanding technical enablers.


    # Technical enablers and non-functional requirements


    These requirements are critical capabilities to ensure the Salesforce solution
    will be performant and scalable, offer a seamless user experience, and maximize
    adoption.


    Let’s look at some of the most common technical enablers and non-functional requirements
    for Salesforce solutions:


    +   - Localization:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   - **Multi-language support**: For any company operating in more than one
    country, or in a country where there is the use of, or it is standard to offer
    more than one language for users of a system, multi-language is often a requirement.

    +   - **Multi-currency support**: Similar to the multi-language support requirement,
    for any company operating in multiple countries with multiple currencies in use,
    having a solution with multi-currency support is often a requirement.

    +   - **Identity and access management (IAM)**: As a company, you need to ensure
    that the right people (and systems) have access to the right features in the system,
    and you want to make sure only the users authorized for that access can, in fact,
    access your systems and features. This is where IAM comes in. Two of the most
    known use cases are shown in the proceeding list. You want to ensure security
    and ease of access for authorized persons:

    +     - **Single sign-on (SSO)**: SSO allows a person to only remember one set
    of credentials (username and password) to log in to multiple systems. It is commonly
    used for enterprise systems, where internal users log in to internal applications
    using SSO for seamless access for authorized users. The **provisioning** and management
    of user access is a significant part of IAM.

    +     - Another implementation use case for SSO is called **social sign-on** where
    external users use their social media accounts (for example, Facebook, Twitter,
    and LinkedIn) or other commonly used services (for example, Gmail and Amazon)
    to access digital services.

    +   - **Data security**: When your system identifies (*authenticates*) a user,
    your system should only provide that user with access to data that the user needs
    to execute their work. Data security is concerned with ensuring the right level
    of data access to the right users at the right time.

    +   - **Data and file archival**: As you migrate data from legacy systems, and
    your company users begin to work in your Salesforce org, data will be'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'created, and lots of it. You will need and want to have the ability to archive
    data for several reasons:


    +   - **Regulatory requirements**: Many regions, countries, and states only permit
    **personally identifiable information (PII)** data retention for a certain period,
    and only if there is a valid reason for the retention.

    +   - **Usability**: Without regular archival of old or irrelevant data, users
    will unnecessarily have to sift through all the data clutter, decreasing the user
    experience and productivity, and increasing the risk of errors and poor customer
    experiences.

    +   - **Performance**: If you don’t archive old or irrelevant data, when your
    users search for information, load record pages, or run reports, the load time
    will increase over time, diminishing the user experience and productivity.

    +   - **Cost**: Storage is a big cost driver for cloud solutions. While you can
    purchase additional storage, having an *efficient and automatic* archival solution
    in place will quickly outweigh the saved storage space cost.

    +   - **Backup and restore**: Whereas data and file archival is mostly relevant
    for old or irrelevant data, backup and restore is concerned with ensuring business
    continuity by making sure your critical operational Salesforce data is backed
    up regularly and easily restorable should data be unintentionally deleted, modified,
    or corrupted for any reason. There are robust Salesforce-specific **commercial
    off-the-shelf (COTS)** solutions available that provide these services – **OwnBackup**
    and **Odaseva** are the market-leading providers in the Salesforce ecosystem.

    +   - **Accessibility management**: Offering a Salesforce solution that is accessible
    for people living with some form of disability is not only ethical but also smart
    for business. In many countries, it is a legal requirement that goods and services
    offered to customers must be accessible also to people with disabilities. Furthermore,
    being able to offer employment to people with disabilities will increase your
    talent'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'pool – to the benefit of the people with disabilities as well as your company.


    +   - **Speed/performance:** Everyone wants solutions that are quick and easy
    to use with no wait time. In some use cases – for example, a customer service
    call – having a customer contact page load time exceed a certain number of seconds
    may not be acceptable to the business, as it would result in a poor customer experience.
    Other key performance aspects are running reports and dashboards and searching
    for records. These are examples of non-functional requirements.

    +   - **Reliability:** The percentage uptime of the system where users are able
    to log in and perform work is a characteristic of reliability. Although your company
    will be largely depending on Salesforce to ensure uptime, there are things you
    can do to minimize downtime. These include minimizing interruption of operations
    when deploying new features and building in exception handling to gracefully handle
    connection issues for your integrations.


    Many non-functional requirements are effectively provided and, to some extent,
    controlled by Salesforce since – in addition to being a SaaS solution – it provides
    infrastructure and a platform for its customers. However, how you design, configure,
    and develop your Salesforce org has a major impact on its level of security and
    performance.


    Tip!


    Engage a technical architect to support you in defining the technical enablers
    for your Salesforce project.


    Having covered some of the common technical enablers and non-functional requirements
    for Salesforce solutions, let’s look at data sources that are often integrated
    with Salesforce.


    # Data sources'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'While your company’s ambition and intention may be for Salesforce to be the
    main system for your marketing, sales, and customer service teams, there will
    inevitably be other systems and applications in your company’s **system landscape**.
    These other systems and applications serve their own unique purpose and hold data
    that is sometimes relevant for users in Salesforce, while other times it may be
    Salesforce that needs to send information to an application to complete a process.


    Let’s look at some systems that are often integrated with Salesforce:


    +   - **Enterprise resource planning (ERP) system**: These systems are used for
    operational purposes, covering production planning, stock management, logistics
    planning, order processing, and invoicing.

    +   - **Data warehouse (DWH)**: This is a database containing data from across
    the enterprise. It may have various levels of distribution and structure. For
    example, data lakes contain unstructured data for data scientists to model and
    leverage, whereas a highly structured and managed database can provide the basis
    for BI systems to provide a reporting layer to users.

    +   - **Active Directory (AD)**: An AD often serves as an **identity provider**
    or **identity store** used in relation to *IAM* to centrally manage provisioning
    and **deprovisioning** and access level changes.

    +   - **Website(s)**: Your company likely has at least one website describing
    your company and its products and services. The website may have a **contact form**
    for people to fill out with questions or to request information, which is then
    sent to your sales or customer service teams.

    +   - **Content management system (CMS) and digital asset management (DAM) system**:
    These systems store assets used across a number of applications, including your
    website and email marketing solutions.

    +   - **Product information management (PIM) system**: Stores information about
    your products (and services) used across a number of applications, including ERP,
    e-commerce stores, CRM, and product **configuration, pricing, and quoting (CPQ)**
    solutions.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Tip!


    Review your workshop products of *systems* and *data* as a baseline for integrations
    with your Salesforce solution. Engage an architect to support you in determining
    which systems and data (external to Salesforce) need to be integrated with your
