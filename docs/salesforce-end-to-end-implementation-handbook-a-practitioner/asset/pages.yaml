- pgno: 76
  md: '# Determining How to Deliver Your Salesforce Project


    In this chapter, you will learn about different **delivery methodologies**, and
    how to choose the delivery methodology most appropriate to your Salesforce project
    considering the nature of your project and your company’s circumstances and priorities.
    Next, you will come to understand why a well-thought-out **change management**
    strategy is critical to the success of your Salesforce project. Finally, you will
    learn to envision the structure of your **Salesforce Center of Excellence (CoE)**
    – the management and governance framework to oversee your Salesforce program.


    You will be introduced to **waterfall**, **agile**, and **hybrid agile** delivery
    methodologies, as well as the concepts of different project phasing approaches.
    You will get an understanding of how to craft a communication and change management
    strategy, along with the related activities required in the different phases of
    your project. Finally, you will be introduced to the roles and responsibilities
    in your Salesforce CoE, drafting its CoE **charter**, and how to create a **roadmap**
    for your Salesforce program.


    We will continue to follow our scenario company, Packt Manufacturing Equipment
    (PME), and their progress through the activities to determine how to deliver their
    Salesforce project.


    After determining how to deliver your project, you’ll be ready to move on to the
    next activities in the pre-development phase of your Salesforce implementation.


    This chapter will cover the following main topics:


    +   - Choosing your delivery methodology

    +   - Determining your change management strategy

    +   - Envisioning your Salesforce Center of Excellence'
  merge: -1
  img_proc: true
