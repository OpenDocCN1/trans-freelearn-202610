    # Important note


    Be sure to communicate with *all* stakeholder groups – and tailor the communication
    to each group and use the vehicle (i.e., the comms channel) that’s most appropriate.


    Bring representatives of your stakeholders together with a business change consultant
    and an adoption and communications specialist to create **persona-specific** communications
    for each stakeholder group. This will enable you to better understand and empathize
