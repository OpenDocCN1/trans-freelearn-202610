    Let’s go!


    # Introducing issues and root cause analysis


    Before jumping into what the common issues are in the pre-development phase of
    a Salesforce project, let’s get some definitions straight.


    In project management terms, **issues** are the manifestation of unaddressed risks.
    Moreover, unaddressed issues prevent a project from maximizing its potential for
    success.


    Issues have underlying causes. **Root cause analysis** is a simple and effective
    method of stating the hypotheses for possible underlying causes of an issue. An
    issue may be the symptom of a larger issue that needs to be addressed, rather
    than simply alleviating the symptom.


    In the next section, we will explore some of the most common issues that prevent
    a Salesforce project in the pre-development phase from moving forward. For each
    issue, we will cover possible root causes of the issue and provide strategies
    for mitigation and prevention.'
  merge: -1
  img_proc: true
