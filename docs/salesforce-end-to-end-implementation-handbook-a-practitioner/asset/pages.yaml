- pgno: 224
  md: '# Deploying Your Release and Migrating Data to Production


    Following the building and testing of your Salesforce solution in the previous
    chapters, in this first chapter of *Part 3, The Roll-Out Phase*, of your Salesforce
    project, you will be guided through the key activities and milestones in the **roll-out
    phase**. Next, we will dive into some of the key considerations and practicalities
    of **deploying** your Salesforce solution, as well as how to make the most of
    **user acceptance testing (UAT)**. Next, we will evaluate your preparedness for
    migrating your data to production and provide you with a final go-live checklist
    to verify you’ll be ready to **go live** after training your users.


    By the end of the chapter, you will understand the key milestones, outcomes, and
    activities in the roll-out phase of your Salesforce project. You will gain insights
    and practical advice for performing **system integration testing (SIT)** and driving
    UAT. Finally, you will understand that planning and performing dry runs is key
    to successful **data migration** and what to check before signing off for users
    to go live following training.


    In this chapter, we’ll cover the following main topics:


    +   - Overview of the roll-out phase of your Salesforce project

    +   - Deploying your Salesforce solution through environments

    +   - Driving UAT of your solution

    +   - Checking your data migration preparedness and signing it off to go live


    Let’s go!'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Overview of the roll-out phase of your Salesforce project


    In this phase of your Salesforce project, the focus is on getting your initial
    solution and legacy data to production and getting users set up for success.


    Let’s take a look at what you will be doing in this phase.


    # Key activities and milestones of the roll-out phase


    The roll-out phase of your Salesforce project begins when you have completed building
    the first version – the **initial release** – of your Salesforce solution.


    Historically, many organizations – and their implementation partners – have defined
    a successful roll-out to be when the solution is deployed to production, data
    is migrated, users have gone through training, logged in for the first time, and
    the number of new daily production support tickets drops below a predetermined
    threshold. Sounds familiar?


    But to maximize value from your investment in Salesforce, you must go beyond that
    to define success in the following way:


    A successful roll-out phase should be defined as the point when your organization,
    customers/partners, and users are using and gaining value from your Salesforce
    solution, and it delivers the target business outcomes you laid out in Chapter
    4, Securing Funding and Engaging with Salesforce and Implementation Partners.


    As such, to plan for a successful roll-out, we can summarize the key activities
    and milestones here (the highlighted activities are often overlooked in planning):'
  merge: -1
  img_proc: true
- pgno: 226
  md: '+   - Deploying your Salesforce solution through environments

    +   - Driving UAT of your solution

    +   - Migrating your data to Salesforce

    +   - Signing off to go live

    +   - *Planning, communicating, and managing change*

    +   - Training your users

    +   - Providing hypercare and managing production support

    +   - *Monitoring and driving adoption of your Salesforce solution*


    Having established *what* the overall activities and milestones consist of, let’s
    look at *how long* your roll-out phase may take.


    # Duration of the roll-out phase


    Depending on the following factors, the roll-out phase of your Salesforce project
    may take anywhere between *a few weeks to many months or quarters*:


    +   - The technical scope and the number of domains of your Salesforce solution
    to be deployed and released

    +   - The geographic scope of users and regions to work with your solution

    +   - The number of teams and users to be trained

    +   - The skills and resources available for deploying, migrating data, and communicating
    with and training your users


    # Tip


    In *Chapter 3*, *Determining How to Deliver Your Salesforce Project*, you considered
    how to phase your Salesforce project. If you are yet to determine this, go back
    to the chapter, and make your project phasing plan.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Let’s see who will be overseeing the roll-out of your Salesforce solution.


    # The role of your Salesforce CoE in the roll-out phase


    In *Chapter 3*, *Determining How to Deliver Your Salesforce Project*, you envisioned
    the structure and responsibilities of your **Salesforce Center of Excellence (CoE)**.
    Now it is time to execute and establish it.


    While deployment and data migration seem to be technical tasks, your Salesforce
    CoE is ultimately accountable for overseeing those activities and managing any
    escalated issues that may arise.


    In addition to that, in *Chapter 10*, *Communicating, Training, and Supporting
    to Drive Adoption*, you will learn how you and your Salesforce CoE will be planning
    and preparing change and communication plans, system cut-offs, user training,
    go-lives, and setting yourself up to provide hypercare and production support
    – all with the goal of ensuring adoption to reap the benefits of your investment.


    Let’s get started with the first topic!


    # Deploying your Salesforce solution through environments


    Salesforce deployments come in many forms, and their duration can span a few minutes
    to many hours or even days for heavily customized, old orgs with limited technical
    governance.


    While *what* you deploy is unique to your organization and project, the steps
    for *how* you deploy your entire solution from one sandbox to another – and finally
    to production – *at an abstract level* are as follows:


    +   - **Plan deployment:** There are two parts to planning a deployment:'
  merge: -1
  img_proc: true
- pgno: 228
  md: '+   - **Organization deployment planning**: Make sure you have aligned the
    following key things with your stakeholders and project team members:

    +     - What you want to deploy

    +     - When you want to deploy

    +     - Who you expect to be part of the deployment, and what they are expected
    to do

    +     - Any development freeze periods have been communicated

    +   - **Technical deployment planning**: Determine and prepare the following items
    before starting your deployment:

    +     - **Prepare a release artifact**: Depending on your development method (refer
    to *Table 7.2*), this could mean preparing a Change Set, preparing the `.zip`
    file with metadata components, or creating/updating a version of one or multiple
    unlocked packages

    +     - **Identify and list pre- and post-deployment steps**: Throughout the sprints
    in the development phase, your development team should have continuously been
    adding any deployment steps that cannot be deployed via Change Sets or Metadata
    API and hence will require manual deployment steps


    # Tip


    As mentioned, not all Salesforce metadata is deployable through Metadata API –
    visit the *Metadata Coverage* report at https://developer.salesforce.com/docs/metadata-coverage
    to find out whether any of your solution’s components require manual deployment.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   - **Decide on a fallback plan**: Determine what you will do if the deployment
    fails, takes longer than planned (fails), or does not pass smoke-test validation
    in the target environment


    +   - **Deploy your solution**: There are generally three parts to the technical
    deployment of your solution:

    +     1. **Execute pre-deployment steps**: These may include the following steps:


    +   i. Enabling various Salesforce features in the **Setup** menu. Some examples
    include setting **Web-to-Lead Enabled**, **Enable Web-to-Case**, **Allow users
    to relate a contact to multiple accounts**, and **Enable Field Service**.


    +   ii. Installing AppExchange apps.


    +   2. **Deploy the release artifact**: After having prepared your release artifact,
    deploying can be as easy as the click of a button (or typing an `sfdx force:source:deploy`
    command and pressing *Enter*). However, deploying a complete solution the first
    time can be hard, as it may be the first time all the components have been deployed
    together to a fresh Salesforce sandbox or production instance.


    +   3. **Execute post-deployment steps**: These may include the following steps:


    +   i. Execute manual post-deployment of components that are not deployable.


    +   ii. Creating or importing reference data, such as products, price books, price
    book entries, **configure price quote (CPQ)** configuration data, and Field Service
    Lightning configuration data.


    +   iii. If your solution integrates with external systems, you will likely have
    technical dependencies with them. This could be certificates or generating HTML
    snippets for a web form that your web development team needs for your website.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - **Deployment validation**: Smoke test validation of select features and
    functionality. You should limit creating or modifying data in production:

    +     - Your team will gain experience and develop a routine for how to deploy
    your solution as you deploy through your sandboxes to production. Develop a routine
    and maintain good discipline within your development team to make sure your deployment
    artifact and process is documented – and *critically* – updated after every sprint/release.


    # Tip


    A common artifact (sometimes agreed to be a project deliverable by your implementation
    partner) is a detailed deployment plan or deployment checklist (sometimes referred
    to as a runbook). Your detailed deployment plan is for the deployment team to
    follow for each deployment and should include the following items:


    +   - All pre- and post-deployment steps, including status, dependencies, exact
    timings, and ownership for each task in the plan

    +   - Deployment timeline and stakeholder communication plan

    +   - Description of how deployment sign-off is done by your product owner and
    other stakeholders


    Next, we’ll move beyond the technicalities of deployment.


    # Performing system integration testing


    You carry out system integration testing to ensure your developed solution works
    as intended when deployed *all together*. What do we mean by *all together*? It
    can mean two things depending on the type of Salesforce project:'
  merge: -1
  img_proc: true
- pgno: 231
  md: '+   • **Greenfield Salesforce implementation**: If this is your first Salesforce
    project and you are yet to have users live in production and if your development
    pipeline consists of *multiple streams/product teams or developers* with their
    own sandboxes and/or feature branches, merging them may cause conflict – and that’s
    the goal of SIT – *testing the integration of your system*:


    +   • Catching bugs now rather than later – in UAT or production – will make for
    smoother UAT and, ultimately, better adoption of your solution in production


    +   • **Brownfield Salesforce implementation**: If you already have users live
    on your Salesforce production instance, you want to make sure any new features
    or changes don’t break existing processes.


    You can opt for performing SIT at the end of each sprint or after the build phase.


    The exact activities and steps of performing SIT will depend on the nature of
    your Salesforce project, however, performing SIT typically consists of the following
    activities:


    +   1. **Deployment error identification and resolution**: As mentioned in the
    previous section, you are likely to encounter deployment errors the first time
    you deploy your entire solution. Resolving those deployment errors is your first
    step.


    # Tip


    Do deployment dry-runs before the first production deployment of your initial
    (or any major) release in a staging sandbox (preferably a full copy sandbox).
    This can be done as part of preparing a sandbox for SIT or UAT, and it gives your
    deployment team an opportunity to fine-tune the detailed deployment plan to make
    sure no steps are missed or done in the wrong order. You should also – throughout
    your development phase – be executing test deployments (or deployment validations)
    to understand the number and nature of deployment errors. These activities will
    help increase your'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'confidence that the production deployment will go smoothly by minimizing the
    risk of your deployment failing or taking too long.


    If you are overwhelmed or stuck resolving deployment errors, review this *SalesforceBen*
    article by Andrew Davis at https://www.salesforceben.com/checklist-for-debugging-salesforce-deployment-errors/.


    2. **Metadata merge conflict identification and resolution**: This can consist
    of one of the following two things depending on your Salesforce project. Once
    these are resolved, your solution can technically be deployed to the next environment:


    +   - **Greenfield**: Identify conflicts created when merging metadata components
    from different streams and resolve them

    +   - **Brownfield**: The same principle as greenfield applies here, except you
    are identifying conflicts between the changes in your Salesforce project and what
    is already in production


    3. **Regression testing**: Beyond technical deployment, you need to test that
    your incremental changes don’t break any existing processes. It can be executed
    through manual testing or **automated testing** using tools such as **Provar**
    or **Selenium**. They do, however, require setup (and cost) and training, so you
    need to weigh the benefits versus the cost and time. Another aspect of regression
    testing is testing that an integrated solution’s interfaces to other systems still
    function as before or – if any changes were modified or developed and tested in
    lower environments – as according to any new modifications.


    # Tip


    If you have a large, long-running project, you may consider implementing automation
    testing as part of your development life cycle. For smaller, short-lived projects
    – in Salesforce setups without an existing test automation tool available – you
    are likely better off dedicating time and resources to manual regression testing.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Next, let’s use UAT as a catalyst for adoption and a sense of ownership among
    your end users.


    # Driving UAT of your solution


    You have deployed your solution to the sandbox in which you intend to carry out
    UAT. Great!


    UAT is one of the key milestones of a Salesforce project. If your **acceptance
    testing team** (or customers and partners) don’t accept the solution you are building,
    nothing else really matters.


    Let’s see next what you need to prepare to plan for a successful UAT.


    # Planning for a successful UAT


    To set yourself up for a successful UAT, you need a plan. Let’s look to see what
    it should contain:


    +   - **Lean meetings**: These should be short meetings to share updates, and
    in some of them make decisions, though these are not meant for brainstorming or
    discussions:

    +     - **UAT kickoff**: Here, your project team introduces UAT to the acceptance
    testing team, including the duration, activities, processes, and outcomes of UAT

    +     - **Daily check-in/check-out**: These are quick status calls with your **project
    manager (PM)**, **product owner (PO)**, **business analyst (BA)**, and **quality
    assurance (QA)** specialist to assess the number of reported bugs, their classification,
    and their resolution status

    +     - **UAT sign-off**: Determine how UAT is officially signed off and finished'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   - **What should you test in UAT**: The following are the two things you
    should test in UAT:


    +   - **End-to-end test cases**: These are a collection of test scenarios based
    on the user stories in the scope of your solution. The QA specialist assigned
    to your project, together with your BA, should create the end-to-end test cases.


    +   - **Non-vanilla flows**: Invite your acceptance testing team to report bugs
    encountered when not following the test cases’ flow in the right order.


    # Important note


    A *well-architected and well-tested solution* will consider and manage edge cases
    and exceptions and will guide users to the right path if they try to do something
    “the wrong way”.


    +   - **Who should participate in UAT**: The following resources and stakeholders
    are key to a successful UAT:


    +   - **The sponsor**: They should kick off UAT by sharing the vision for your
    Salesforce project and explaining how important the acceptance testing team''s
    job and effort is.


    +   - **PO**: They are responsible for responding to reported bugs from the acceptance
    testing team. See the further point on *Define a process to follow*.


    +   - **Acceptance testing team**: You have already interacted with some of them
    (your target end-users) in the pre-development phase and throughout the development
    phase of your Salesforce project. Now it’s time to get them together as your acceptance
    testing team to test your solution from end to end.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Important note


    The end users of your solution whom you invite to participate in UAT may not have
    been part of UAT before – or may not have been part of an agile or hybrid agile
    project before. Managing the expectation of your UAT participants is key to a
    smooth process. To do so, be open and transparent about the approach you have
    chosen for your project and why. If you are building an MVP to bring value quickly
    for a limited scope, explain that. And let your UAT team know that more features
    are planned but are not included in the initial release being tested now in UAT.


    +   - It’s a balancing act to decide who and how many individuals should be part
    of this team. By involving too few end-user representatives, you risk not testing
    comprehensively enough, which could lead to a suboptimal, bug-prone solution that
    is poorly adopted. On the other hand, having too many people on the testing team
    can lead to you spending a lot of time and effort on upfront training and instructions
    – let alone handling the greater volume of reported bugs:

    +     - As a bare minimum, you need to have at least one test member for each
    persona – in Salesforce, this could (from a system-perspective) be represented
    by a combination of **record access grants** (`Role`, `Territory Assignments`,
    and `Queue Memberships`) and **system permissions** (`Profile` and `Permission
    Set Group`).


    # Tip


    To lay the groundwork for user training and to begin recruiting change agents,
    you should consider having at least one representative per domain in the scope
    of your solution (Sales, Service, Marketing) for each planned geography (region/country).
    If your solution is tailored to different subdomains or subdepartments, for example,
    telesales and key account management, which have different processes to test,
    you should have at least one representative per subdomain.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '+   - **BA and/or QA specialist**: Triage, assess, and categorize reported
    bugs and also potentially propose solutions to fix actual bugs

    +   - **Development team**: Fix identified and prioritized bugs


    +   - **Define a process to follow**: Establish and communicate how to report
    a bug and the process to triage and potentially fix the bugs:

    +     - Share the bug template with all acceptance testing team members. The bug
    template should – when correctly filled out – make it easy for the BA or QA specialist
    to triage, reproduce, and classify a bug. It should contain the following information
    as a minimum:

    +       - The username of the bug reporter

    +       - Test case name or ID

    +       - At what step of the test case the user encountered the bug

    +       - What the user expected to happen versus what actually happened

    +       - A link to the record/page

    +       - Screenshots of the entire browser window, including the URL bar, which
    sometimes provide the project team with valuable context about the issue and reduce
    back-and-forth communication with the tester

    +   - **Determine bug classifications and actions for each**: These typically
    include the following classifications but may vary depending on the nature of
    your Salesforce project:

    +     - **Change request**: Your PO should assess and address these by either
    communicating to the bug reporter that the request is considered and put in the
    backlog, or that it is not considered and why.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '+   - **Not a real bug** This could either be due to user error or faulty data.
    In either case, there is no development required to fix the issue. Your BA or
    QA specialist should show the bug reporter how they execute the test case and
    what data to set up beforehand.

    +   - **Bug**: The BA and developers can assess the bug, determine the reason
    for the behavior (root cause), find solutions to fix it, and estimate the effort
    to do so. The PO can review and determine the prioritization of the bug against
    the other bugs in the backlog.


    # Tip


    Many bugs reported during UAT are caused by wrong user setup (profiles permission
    sets, queues, and so on), because test cases are not followed, or because of **faulty
    test data.**


    To minimize the risk of bugs being reported due to these causes, make sure you
    provide adequate instructions to your testing team and double-check that test
    data is correctly set up and ready for the testing team. Test data includes the
    following:


    +   - Salesforce test user accounts to log in with

    +   - Master data, such as accounts and contacts

    +   - Transactional data, such as opportunities, orders, and cases

    +   - Reference data, such as products, price books, and price book entries


    Through the course of UAT, you will likely receive a lot of feedback or bugs from
    your acceptance testing team. Be open to feedback and thank the team for their
    effort.


    # Tip


    Srini Munagavalasa has written an entire chapter dedicated to UAT in a Salesforce
    context. I suggest you check out *The Salesforce Business Analyst*'
