    +   - The role of BA is sometimes taken up by a functional consultant in the development
    team as they – stereotypically – are more “business-oriented” and, therefore,
    should be more suited to interact with the PO and other business stakeholders
    to support them in the creation of user stories.


    # Important note


    Many functional consultants can also act as great BAs. But it is not always the
    case. Work with your implementation partner to make sure your agile team has solid
    business analysis skills in the team as the BA plays a key role in the success
    of your Salesforce project.


    # The quality assurance (QA) specialist (tester):


    +   - QA specialists are responsible for *testing user stories against the acceptance
    criteria*. They do this by writing positive and negative test cases based on the
    acceptance criteria of a user story and executing the test case to evaluate whether
    they pass or fail.

    +   - The QA specialist (or test manager in larger projects) will design the overall
    test strategy and testing regime of your Salesforce project.'
