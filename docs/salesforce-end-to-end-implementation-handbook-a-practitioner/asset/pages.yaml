  md: 'corresponding chapters and complete the activities to proceed with your Salesforce
    project.


    # Checklist for your Salesforce project in the roll-out phase


    In the roll-out phase, you should have gone through the following activities.


    When deploying your Salesforce solution through environments, you should have
    done the following:


    +   - Made sure you have perfected your deployment plan and checklist, also called
    a deployment runbook:

    +     - Critically including how you validate and sign off your deployments

    +   - Performed SIT to identify and resolve merge conflicts with concurrent streams
    and/or what’s already in production


    Next, you should have completed these activities to perform UAT of your solution:


    +   - Determined who should participate in and drive UAT

    +   - Defined and aligned what process your acceptance testing team should follow
    and what template to use to report bugs and change requests

    +   - Communicated back to bug and change request reporters the status and what
    you intend to do with them


    Next, you should have completed these activities to check your data migration
    preparedness:'
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   - Executed at least one successful dry run of data migration in a staging
    environment

    +   - Ensured that the team performing the data migration is aware of their tasks
    and is booked for it – including your business and technical stakeholders who
    are to sign off the data migration

    +   - Communicated the data migration plan and any expected downtime associated
    with it

    +   - Have a fallback plan in case your migration fails or takes longer than accepted


    Next, you should have planned, communicated, and managed the change to come by
    doing the following:


    +   - Understood clearly what will change and for what stakeholders

    +   - Created a phased roll-out plan if you are rolling out to multiple geographies

    +   - Created a change management plan template and adapted it as you progress
    with your roll-out in waves, including for each roll-out wave:

    +     - Change readiness assessment

    +     - Communications plan

    +     - Overall roll-out plan

    +     - Management and organizational enablement plan

    +     - Change agent recruitment and enablement

    +     - Local technical deployment plan

    +     - Local data migration plan


    Next, you should have done the following preparations to train your users:'
