  md: '+   - **Statement of work (SoW)**: This contract document describes the scope,
    pricing, invoice schedule, collaboration method, and how the delivered work is
    accepted in the project or engagement.

    +   - **Purchase order (PO)**: Following a co-signed SoW, a PO may be issued by
