    Next, let’s evaluate your Salesforce project in the development phase.


    # Evaluating the state of your Salesforce project


    We have covered a lot of topics and activities in the development phase of a Salesforce
    project. If your project gets stuck, or you are not pleased with the progress,
    the following subsection will support you in evaluating the state of your Salesforce
    project. For each item you cannot check, go back to the corresponding chapters
    and complete the activities to proceed with your Salesforce project.


    # Checklist for your Salesforce project in the development phase


    In the development phase, you should have gone through the following actions.
    When detailing the scope of your release, you should:


    +   - Make sure the required internal resources are allocated to your Salesforce
    project

    +   - Involve end users in the co-creation of business processes to be supported
    by your Salesforce solution

    +   - Make sure the PO for your Salesforce project is suitably qualified and empowered
    to detail user stories and provide acceptance criteria on behalf of the business
    stakeholders


    Next, you should complete these activities to create the architecture and design
    of your solution:'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   - Determine how much **architectural runway** you want to create before
    starting development

    +   - Have the artifacts described in *Chapter 6, Detailing the Scope and Design
    of Your Initial Release*, created and understood by your internal Salesforce project
    team members

    +   - Understand how customized your Salesforce solution will be and the implication
    on maintainability


    Next, you should complete these activities to establish your team’s development
    process to complete the build and testing of your release:


    +   - Made sure everyone in your Salesforce project understands each other’s roles
    and responsibilities

    +   - Understood the development effort of your Salesforce solution (assuming
    you went with estimating time rather than story points)

    +   - Created a tentative development plan allocating the epics in the scope of
