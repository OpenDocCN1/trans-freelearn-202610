- pgno: 319
  md: '# Managing Your Salesforce Data to Harvest the Fruits of Customer 360


    In this chapter of *Part 4, The Continuous Improvement Phase*, of your Salesforce
    program, we will cover how to manage your Salesforce data and how to leverage
    it to maximize the value of your Salesforce investments. First, we’ll introduce
    the life cycle of your Salesforce data and how to govern its quality, access,
    and usage. Next, we’ll explore the many use cases for leveraging your Salesforce
    data across different domains, using different Salesforce features and technologies
    to provide better user and customer experiences. Finally, we will show how you
    can inspire peers in your organization by showing the value of a successfully
    implemented, run, and leveraged Salesforce program and platform.


    You will learn what it means to manage the life cycle of your Salesforce data
    in order to optimize the user and customer experience and the performance of your
    Salesforce org and ensure **business continuity**. You will learn about the **attributes
    of data quality** and how to improve the quality of your Salesforce data. You
    will learn how your Salesforce **Center of Excellence (CoE)** can structure its
    **data governance** efforts by establishing and running a **data governance board**
    – when your data and its quality is managed and governed well, you can begin to
    reap the fruits of your **Customer 360** – the view (and data) of your customers.
    You will learn about the ways in which you can leverage the **Customer 360** data
    at your disposal to automate processes and create superior, personalized experiences
    that drive desirable business outcomes – unlocking the full value of your Salesforce
    investment. You will also learn how to **inspire** and **lead** your organization
    on its wider journey of digital transformation.


    In this chapter, we’ll cover the following main topics:


    +   - Managing and governing your Salesforce data

    +   - Leveraging your C360 data to maximize the return on your Salesforce investments'
  merge: -1
  img_proc: true
- pgno: 320
  md: '+   - Leading and inspiring the peers in your organization


    Let’s go!


    # Managing and governing your Salesforce data


    **Data** is the business currency of the present and the future. Some might even
    argue it is your organization’s most valuable asset, other than your employees,
    of course.


    Important as it is, many organizations struggle to truly leverage the data they
    have at their disposal. Next to siloed data, I would argue that data management
    and the **governance** of the quality of their data is the biggest challenge preventing
    organizations from reaching their full potential with Salesforce.


    Let’s jump right in and look at your data life cycle.


    # Managing the life cycle of your Salesforce data


    To be able to effectively manage and govern your Salesforce data, we first need
    to understand a few definitions and concepts.


    Let’s start by understanding the different **data categories** you manage in your
    Salesforce org:


    +   - **Master data**: This is data that is typically part of many types of systems
    within an enterprise, and as such, needs to be mastered in one system:

    +     - Examples include customers, suppliers, products, and assets'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - **Transactional data**: This is data that is created as a result of doing
    business with your customers, partners, and suppliers:

    +     - Examples include opportunities, quotes, orders, payments, cases, and activities

    +   - **Metadata**: Your Salesforce org is made up of metadata – the configuration
    and customization you have done to make Salesforce work for your organization.

    +   - **Reference data**: This data is a necessary supplement to the master data
    (but is *not* the same thing), as it provides context for your transactional data.
    It may come in the form of **metadata** or **configuration data**:

    +     - Examples include state and country picklist values, ISO codes, loyalty
    scheme tiers, customer segmentation names, and classification

    +   - **Reporting data**: This includes any data you have created solely for the
    purpose of reporting.


    # Important note


    Be sure to align your Salesforce reference data with your organization’s enterprise
    architect and data architect to ensure consistency across systems.


    In *Chapter 6, Detailing the Scope and Design of Your Initial Release*, we introduced
    the concept of a **data dictionary**. Make sure you keep it up to date beyond
    your initial Salesforce release so that it can add value to your stakeholders—the
    consumers of your Salesforce data—and accelerate development efforts for your
    continuous improvement teams.


    For each category of your Salesforce data objects, it is important for you to
    consider the life cycle of your Salesforce data – by data category and object.
    So, let’s get on the same page regarding what the data life cycle is:'
  merge: -1
  img_proc: true
- pgno: 322
  md: '+   - **Creation**: When is the data created and who can create records?

    +     - If the data is system-generated, what triggers that?

    +   - **Storage**: When is the data stored in your Salesforce org and what level
    of encryption is required (if any)?

    +   - **Usage**: Who needs to access the data, for what process, and for how long?

    +     - For how long does your organization need and want, or is allowed, to store
    the information?

    +   - **Archival**: When is it no longer value-adding to keep the data in Salesforce?
    What processes and tools (for example, batch jobs or enterprise tools) do you
    have in place to manage regular archiving (and backup process)?


    # Tip


    Consider using an enterprise Salesforce backup and restore solution to ensure
    business continuity, as well as performance and compliance. Leading vendors include
    **OwnBackup** and **Odaseva**.


    +   - **Deletion**: When should the data no longer exist in Salesforce or at all
    within your organization?


    With these concepts out of the way, let’s move on to data quality.


    # Governing the quality of your Salesforce data


    There are two sides to **data quality**. If your data quality is good generally,
    this is an enabler for a delightful user and customer experience and'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'ultimately great business outcomes. Conversely, if your data quality is generally
    poor, the opposite is a risk.


    Let’s start by looking at what **purpose** your data quality governance effort
    can aspire to:


    +   - Ensuring good user and customer experience

    +   - Enabling reliable use of data for the following ends:

    +     - Reporting and analytics

    +     - Communication

    +     - Automation

    +   - Complying with legal regulations or industry standards


    With the purpose of data quality governance squared away, let’s look at the dimensions
    that define data quality:


    +   - **Accuracy**: To what extent does your data represent the truth?

    +   - **Age**: How often is data updated? When was it created?

    +   - **Completeness**: To what degree are all (relevant) fields populated?

    +   - **Consistency**: How consistent is the captured information?

    +   - **Duplication**: What is the percentage of duplicate records per object?

    +   - **Usage**: To what extent is the data being used by users for automation
    and analytics?


    It’s important to note that data quality isn’t binary, but rather it’s a spectrum
    ranging from very low to very high. No organization scores 100% on all the attributes
    of data quality all the time.


    Tip'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'You can learn more about data quality by taking the *Data Quality* module on
    Trailhead:

    https://trailhead.salesforce.com/content/learn/modules/data_quality.


    As part of your Salesforce CoE, you should have a forum, a governing body responsible
    for overseeing your efforts to drive data quality. That body is your **data governance
    board**.


    In the following figure, you can see how our scenario company, **Packt Manufacturing
    Equipment (PME)**, has organized its Salesforce CoE in the continuous improvement
    phase of its Salesforce program:


    ![](img/307881206539c45e128c538a4b6912f8_324_0.png)


    Figure 13.1 – PME’s Salesforce CoE with a data governance board


    PME’s Salesforce data governance board sits within its CoE and consists of a data
    steward, domain data owners, and the product owners for the Agile product teams.
    As governance is a philosophy rather than a management/decision function, the
    charter of the board is to develop guidelines and principles to further PME’s
    Salesforce data management and quality improvement capabilities. PME’s data governance
    board also reviews the output of any analysis and explores initiatives to improve
    these capabilities.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Consider the following key activities you should perform to improve the quality
    of your Salesforce data – using the Lean Six Sigma **DMAIC** framework:


    ![](img/307881206539c45e128c538a4b6912f8_325_0.png)


    Figure 13.2 – Lean Six Sigma DMAIC


    Tip


    To learn more about the DMAIC framework, go here:

    https://kanbanize.com/lean-management/six-sigma/dmaic.


    Let’s go through each of the steps!


    # Defining


    Your **data steward** should lead the definition of your organization’s goals
    for data quality across all the domains supported by your Salesforce platform.
    Your data steward should not be alone in this exercise, but rather work together
    with **data owners** – consumers of the data and representatives from the domains
    of your platform.


    You can operationalize and make your goals concrete by using a data quality goal
    template:


    *The [Field_Object_RecordType] to be [Quality Definition] in order for [Stakeholder]
    to be able to [achieve business value]*


    An example of a practical data goal is as follows:


    *The “billing address on the Account object of Record Type Bill-To” to be “verified
    at least annually” in order for the “finance team” to be able to “invoice with
    minimum risk”*'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Measuring


    Once you have defined your data quality goals, you need to track how you are performing
    against them.


    You can – to some extent – use free tools to track and measure your data quality.
    These include the following:


    +   - *The Data Quality Analysis Dashboards* from **Salesforce Labs**, which you
    can find here: https://appexchange.salesforce.com/listingDetail?listingId=a0N300000016cshEAA&tab=e

    +   - *ZoomInfo Field Trip – Discover Unused Fields and Analyze Data Quality*
    by **ZoomInfo**, which you can check out here: https://appexchange.salesforce.com/listingDetail?listingId=a0N3000003HSXEEA4&tab=e


    To take your data quality to the next level, you may consider investing in a paid
    solution such as Delpha, which offers both automatic and manual merging of duplicate
    records. Check it out here: https://appexchange.salesforce.com/listingDetail?listingId=a0N3A00000FMpuXUAT&tab=e.


    # Analyzing


    Once you have a good method for tracking the quality of your data, you need to
    analyze it to spot trends and gaps. The outcome of your analyses should be ideas
    or initiatives to improve your data quality.


    Depending on your Salesforce CoE setup and the nature of the ideas for improvement,
    you can decide either to do one of the following:


    +   - Reviewing data quality analyses regularly (for example, monthly)

    +   - Reviewing ad hoc input for data quality improvement initiatives'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Depending on the scale of your Salesforce setup and CoE, it may be the responsibility
    of your Salesforce administrator, a central or local data analyst, or a BI/analytics
    team to set up reporting and track your data quality.


    # Improving


    Your Salesforce administrator(s) or other qualified persons should clean up the
    data based on the output of the analysis.


    This may range from record creation and updates to improving the quality of your
    Salesforce data. It may also entail archiving or deleting data deemed unnecessary
    or non-compliant to retain, or to improve your Salesforce performance and user
    experience.


    # Controlling


    Your data steward should recommend initiatives to your Salesforce (domain) product
    owner(s), as well as your Salesforce Platform Owner (PO). The PO can, together
    with your Salesforce platform architect, assess and determine which initiatives
    to pursue to mitigate and minimize the future risk of poor data quality – and
    improve it.


    The initiatives may include the following:


    +   - Process re-training to ensure process compliance and quality.

    +   - Modifying your application and system architecture and configuration. This
    may include creating/updating validation rules, automation, record access changes,
    and making changes to user permissions.


    You can consider implementing tools to automate regular data operations. Some
    tools to consider include the following:'
  merge: -1
  img_proc: true
- pgno: 328
  md: '+   - Salesforce **Scheduled Flows** is a (relatively) simple declarative tool,
    native to Salesforce (with volume and scheduling limitations to bear in mind)

    +   - **ETL** tools such as **MuleSoft** and **Informatica** are entirely at the
    other end of the spectrum


    For use cases that concern publicly available business information, such as addresses,
    search **AppExchange** for apps to sync the data. These solutions come at a cost,
    so weigh the cost of the app versus the cost (in time) for your Salesforce team
    to (manually) update the data.


    If your Salesforce team performs the same data cleansing/updating operation regularly,
    it’s typically a straightforward business case to invest in some form of simple
    automation.


    When considering deleting unused fields and *validating that with your product
    owner and potentially end user representatives*, make sure you perform the due
    diligence in terms of the impact analysis before this.


    # Tip


    As a best practice, delete fields in a two-step process. First, remove the field
    from page layouts or dynamic forms and remove field-level security access. After
    a month, if no stakeholders have asked where the field went or complained about
    missing information in dashboards, go ahead and back up any records with the field
    populated, and then delete the field.


    Data management and governance are some of the most important activities in the
    continuous improvement phase of your Salesforce program. Next, we’ll look at how
    you can get started, little by little, to improve.


    # Getting started with data quality governance'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'How well you manage your Salesforce data and its quality is not binary – it’s
    a spectrum.


    If you find yourself mostly putting out fires – doing reactive data loads to rectify
    poor data quality, for example – you are more toward the lower end of the maturity
    spectrum. Not to worry, this means you have plenty of potential to improve – which
    will bring great benefits to your users, customers, and your organization.


    # Tip


    To understand how mature your organization is at managing its data, check out
    this article from *Experian*: https://www.edq.com/blog/data-maturity-how-mature-are-you/.


    So how do you get started? Let’s look at an approach to consider:


    +   1. Establish a Salesforce **data governance board** to be anchored within
    your Salesforce CoE.

    +   2. Determine its charter, allocate sufficient resources, and ensure business
    stakeholder alignment and involvement from the start.

    +   3. Work with your business stakeholders to understand what data and which
    KPIs are most important for them (refer to *Chapter 4*, *Securing Funding and
    Engaging with Salesforce and Implementation Partners*, for inspiration).

    +   4. Evaluate and determine which tools you will use to support you in analyzing
    and managing your Salesforce data.

    +   5. From here on, follow the DMAIC model laid out earlier in this chapter.

    +   6. Lastly, don’t attempt to determine, analyze, and fix everything at once:

    +      1. Similar to your evolved Salesforce DevOps capabilities for bringing
    new features to your users, you should strive to **deliver consistent, incremental
    value** by continuously improving the quality of your data'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Tip


    To learn more about Salesforce data management and data quality, you may read
    the following:


    +   - *Salesforce Data Architecture and Management* by Ahsan Zafar (CTA) (https://www.amazon.com/Salesforce-Data-Architecture-Management-effectively/dp/1801073244)

    +   - The article *Data Management Best Practice Guide* from Salesforce here:
    https://help.salesforce.com/s/articleView?id=000393223&type=1


    Next, let’s turn to how you can enjoy the fruits of your investments in Salesforce
    and the quality of your data.


    # Leveraging your C360 data to maximize the return on your Salesforce investments


    Let’s get down to business by first assessing your organization’s data leverage
    maturity.


    There are different ways in which you can leverage the data at your disposal.
    If you think about how you use your Salesforce data, you will likely be able to
    allocate this to one of the following stages:


    +   - **Descriptive**: *Knowing what happened*

    +   - **Diagnostic**: *Knowing why something happened*

    +   - **Predictive**: *Foreseeing what is likely to happen*

    +   - **Prescriptive**: *Suggesting actions to manage or leverage what is predicted
    to happen*

    +   - **Cognitive**: *Acting based on events occurring and/or based on anticipation*'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Important note


    You can’t jump from descriptive to cognitive analytics. You have to progress through
    the stages. The critical success factors for mastering and gaining value from
    each level are quality data and the continuous validation of the accuracy and
    value that the initiative is bringing. The validation part is often missed by
    organizations attempting to skip steps. Validation is best done by a combination
    of visionaries imagining and striving for the next frontier for the business and
    people with intimate knowledge and context of the use case. These may be domain
    super-users who are most eager to rid themselves of rudimentary, repetitive tasks
    or who wish to improve a sales or service process.


    With the theory out of the way, let’s dive into how you can leverage your Salesforce
    data to unlock value for your users and organization.


    There are two main ways to leverage your Salesforce C360 data. These are as follows:


    +   - **Knowledge and insights:**

    +     - As the basis for optimized, data-driven decision making

    +   - **Automation:**

    +     - Of repetitive, responsive manual tasks for your users

    +     - Of responsive or proactive actions


    # Important note


    These two ways are not to be seen as discrete or disjointed, rather with the first
    being the catalyst for the latter. As your organization matures its ability to
    leverage your C360 data, the subtle line dissipates and will seem to fade.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Let’s look at potential use cases for leveraging your Salesforce C360 data.


    Next, let’s explore some of the most obvious and common use cases for leveraging
    your Salesforce C360 data by business domain and across business domains:


    +   - **Marketing**: Use cases include marketing operations insights and automation,
    including initiating or progressing customer journeys triggered by events.

    +   - **Sales**: Use cases include sales productivity powered by Sales Cloud **Einstein**
    for insights on what leads are most likely to convert and which opportunities
    are most likely to close. For commerce, product recommendations are a great use
    case for Einstein.

    +   - **Service**: There are numerous use cases for leveraging your Salesforce
    data to drive efficiency in your service organization. Key ones include case management
    productivity, such as automating case creation (web-to-case, self-service), or
    case assignment by combining Einstein Case Classification with **Omnichannel**
    skills-based routing. If you are currently providing (or considering providing)
    chat functionality to your customers, you should consider implementing chatbots
    to enable your customers to self-serve to deflect simple cases from being created
    in your Salesforce org. Start with menu-driven chatbots, and gradually, as you
    gather more data from chat, progress to intent-driven **AI chatbots**.

    +   - **Cross-domain**: For all domains, there are Salesforce platform features
    you can leverage to reach higher levels of productivity. These include **Next
    Best Action**, **CRM Analytics Predictions**, and **Salesforce Genie***, among
    many, many others.


    # Tip


    *Salesforce Genie is a new layer or suite of product offerings from Salesforce.
    You should do your own research and make any decisions based on the product information
    available. Learn more about the promise of Salesforce Genie at https://www.salesforce.com/products/genie/overview/.'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'To learn more about AI and Salesforce, you can read *Architecting AI Solutions
    on Salesforce* by Lars Malmqvist (CTA) ([https://www.amazon.com/Architecting-Solutions-Salesforce-state-art/dp/1801076014/](https://www.amazon.com/Architecting-Solutions-Salesforce-state-art/dp/1801076014/)).


    In addition to analytics and automation use cases *within* your Salesforce org,
    let’s consider use cases that integrate and automate processes with *external*
    systems:


    +   - **MuleSoft RPA**: Using MuleSoft to, amongst other things, use **Optical
    Character Recognition (OCR)** to process received documents and transform these
    into system-consumable data:

    +     - Use cases may include receiving an order by PDF, and instead of a human
    manually creating the order, MuleSoft can do it for you.

    +   - **MuleSoft Composer**: A declarative (no-code) solution enabling admins
    and functional consultants to set up cross-system process automation:

    +     - Although Composer is a declarative solution, make sure you follow the
    same design governance rigor as you would for any integration – require solution
    designs to be reviewed by your **Design Authority**.

    +     - Use cases include posting case updates to a Slack channel. A couple of
    things to consider are as follows:

    +       - Composer is designed for low-volume processes, not batch or bulk use
    cases.

    +       - There is no concept of sandboxes for testing, so be diligent when “turning
    on integrations” by connecting Composer flows to production.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '**MuleSoft Anypoint**: Anypoint is a leading, enterprise-grade middleware (ESB)
    and ETL tool and is part of the Salesforce portfolio of products. If you don’t
    have middleware or ETL on your enterprise architecture roadmap, you wish to pursue
    IT strategies such as **API-led connectivity/API economy**, and you are already
    using Salesforce for CRM, you should consider MuleSoft.


    Next, let’s prioritize your initiatives.


    # Prioritizing your analytics and automation initiatives


    As you identify potential initiatives for leveraging your Customer 360 data, it’s
    useful to know what to consider when prioritizing which initiatives to pursue.


    Let’s cover the overall objectives and points you should consider for each type
    of initiative:


    | Initiative type | Key objective | Key points to consider to create your business
    case for the initiative |

    |---|---|---|

    | Analytics | Gain insights to optimize decision-making | What’s the risk of not
    knowing (early or immediately)? For these initiatives, plotting the risks of different
    initiatives on a simple impact-likelihood matrix will provide you with guidance
    to choose the most valuable analytics initiatives to invest in.

    Weigh this up against the effort to deliver the insights in Salesforce. |

    | Efficiency | Alleviate rudimentary tasks | How often (per month or year) does
    the task occur and how long (in minutes) does it take? Extrapolate out to calculate
    the |'
  merge: -1
  img_proc: true
- pgno: 335
  md: '|  |  | potential time saved for all users who will benefit from the automation.

    Weigh this up against the effort to deliver the automation in Salesforce. |

    |---|---|---|

    | **Revenue** | Drive sales | How will faster, better, more reliable insights
    or automation increase your opportunity win rate and average deal size, or reduce
    their close time?

    Weigh this up (accounting for the average gross margin of your organization) against
    the effort to deliver the automation in Salesforce. |


    Table 13.1 – Business case considerations by type of initiative


    Keep only **one** product backlog for prioritizing both your data analytics and
    automation initiatives, against your other Salesforce development initiatives.


    # Important note


    The law regulating the development and use of AI is a quickly evolving legal field.
    Work closely with your legal team to understand the laws you need to comply with
    in regard to the management of your customer data and AI services.


    Let’s move on to the final topic of this chapter – inspiration!


    # Leading and inspiring the peers in your organization


    When you deliver value to your stakeholders, the word will spread that your platform,
    your program, and your team(s) are delivering improvements for your organization.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'Likely, when this starts to happen, you – and your Salesforce program and team
    – will have evolved the capabilities of delivering new functionality (DevOps),
    as well as analytics, and potentially AI services (DataOps and AIOps).


    Take the praise humbly and share the knowledge and learning from your journey
    to get where you are; you have arrived at the spearhead of your organization,
    leading its elusive **digital transformation**.


    Let’s wrap up this chapter!


    # Summary


    We covered a lot of topics in this chapter of the continuous improvement phase
    of your Salesforce program. First, you learned how to manage the life cycle of
    your Salesforce data and govern its quality to set your analytics and automation
    initiatives up for success. Next, you explored the many use cases for leveraging
    your Salesforce C360 data.


    You have now gained insights into the methods and activities you need to continuously
