    +   - Determined which agile ceremonies you will use and how you will maximize
    value from them

    +   - Defined a **definition of ready (DoR)** and a **definition of done (DoD)**
    for user stories

    +   - Determined the practical use of your Kanban board


    Next, you should consider putting in place the following mechanisms to govern
    the development of your Salesforce solution:


    +   - A **design authority** to ensure proposed solutions adhere to your target
    solution architecture and development guidelines

    +   - A **change control board** to have a forum to discuss and approve or reject
    proposed changes or new requested scope'
