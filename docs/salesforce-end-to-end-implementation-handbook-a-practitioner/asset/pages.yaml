    Next, let’s explore the common practices for engaging with potential implementation
    partners.


    # Requesting information from implementation partners


    When you send a **request for information (RFI)**, you are merely requesting information
    about potential implementation partners. Use an RFI to *pre-qualify* potential
    implementation partners without providing comprehensive and sensitive information
    about your company in the request. However, to make the implementation partner
    understand the seriousness and legitimacy of your request – to increase the likelihood
    of a proper response – you should include at least the following elements in your
    RFI:


    +   - Basic information about your company

    +   - The reason for your request

    +   - The requested due date of response

    +   - The information you are requesting – keep this as short as possible


    Why share this information at this stage? This is for the implementation partners
    to be able to internally qualify and assign the request to the appropriate team
    or person and respond.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Once you have received and compared the responses, it’s time to invite some
    of them to participate in the next step of the process.


    # Requesting a proposal from implementation partners


    Having pre-qualified some of the implementation partners who responded to your
    RFI, let’s continue the process. Next up is sending your **request for proposal
    (RFP)**.


    Tip


    Given the nature of many RFP responses having 50-100 pages or slides, it is recommended
    to invite *about* 4-7 potential implementation partners, depending on your confidence
    that they will want to participate in the RFP. For large implementation projects,
    include both specialty and global consulting firms.


    Instead of talking about it, let’s look at what an RFP should contain at a minimum
    for an implementation partner to be able to provide you with a proposal your company
    can effectively evaluate:


    +   - **Your company background, context, and challenges**: Share a condensed
    version of the analysis you carried out in *Chapter 1, Creating a Vision for Your
    Salesforce Project*.

    +   - **Nature of the project**: Include the business domain capabilities and
    the hypothetical technical scope you defined in *Chapter 2, Defining the Nature
    of Your Salesforce Project*. Highlight what **business users** need to benefit
    from your project and how ultimately, it will improve the **customer experience**.

    +   - **Enterprise architecture guidelines**: *Consult the enterprise architect
    at your company to provide this.*

    +   - **Concurrent programs/projects**: *Consult the enterprise architect at your
    company to provide this.*'
  merge: -1
  img_proc: true
