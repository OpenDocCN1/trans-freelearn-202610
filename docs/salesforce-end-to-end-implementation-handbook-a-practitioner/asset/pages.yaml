- pgno: 346
  md: '# You are *not evolving* your Salesforce *DevOps capabilities*.


    DevOps itself is an evolving field. The same is true for the Salesforce platform
    and related technologies. If you aren’t leveraging these improvements, you’re
    not able to get the most out of your investment in the platform – for the benefit
    of your users and organization.


    This means DevOps isn’t something you do, it’s a capability you should aim to
    continuously improve.


    It may seem overwhelming to comprehend where to begin, so consider the following
    steps as a starting point:


    +   1. Map out your current DevOps process.

    +   2. Identify areas of improvement that would bring the most value – improve
    the DevOps metrics (refer to DORA). The areas could be any of the ones mentioned
    in the *Enhancing your Salesforce DevOps capabilities* section of *Chapter 12*,
    *Evolving Your Salesforce Org and DevOps Capabilities*.

    +   3. Understand it’s a journey, so implement improvements *incrementally* –
    adopting DevOps doesn’t mean you have to make major changes all at once. Rather,
    taking just one small step can bring noticeable rewards.

    +   4. Assess the benefits realized by your improvements and continue onwards.


    # You struggle to achieve *adoption* of newly released features.


    The issue may not be the features themselves, but the way they are released.


    What you need to do is remember change management, communication, and training
    when releasing new features.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Refer to the *Planning, communicating, and managing change* section in *Chapter
    10*, *Communicating, Training, and Supporting to Drive Adoption*, for inspiration
    regarding what to do when releasing new features. Be mindful of and calibrate
    your efforts in the continuous improvement phase – minding the principle of proportionality
    to the change impact your new features represents.

    Make sure you create reports to track and *know* how your users are adopting your
    new features. Compliment usage reports with user interviews to understand adoption
    and the potential for improvements.


    Your production *deployment duration* is increasing and/or your *lead time* from
