    You have now established how your company and partners are organized. Let’s move
    on to understand to whom your organization sells, and what you sell.


    # Understanding who your customers are


    You should seek to understand the following key aspects of your customers:


    +   - How many customers do you have?

    +   - Do you have a few large customers that make up the bulk of your revenue
    or is revenue spread across many customers? Is there a change in this split?

    +   - How large are your customers typically in terms of revenue and number of
    employees? Seek to understand your median customer revenue.

    +   - What industries do your customers belong to?

    +   - Who are your customers’ end customers or consumers?


    # Understanding the products and services you sell


    You should seek to understand the following key aspects of your products and services:'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - What challenges do your products help your customers overcome?

    +     - If you have many product categories and/or customer segments, you should
    attempt to consolidate the answers into three to four key groupings for clarity
    and comprehension

    +   - How many products do you have?

    +     - Do you have a few products that make up the bulk of your revenue or is
    revenue spread across many products?

    +   - Are your products and services finished, pre-packaged products and/or services,
    or are they highly configurable?

    +     - Ensure you also determine whether your company has any plans for making
    your products and services configurable in the future


    # Tip


    Engage with sales and marketing leaders at both your company’s local and group
    levels to get an understanding of your customers and how your products and services
    add value to them. You may also request help from your finance or BI departments
    for data and insights about your customers.


    # Introducing the basics of strategy analysis


    While the literature on business strategy is vast and growing, some fundamental
    analysis of your company is needed to understand its situation and the imperative
    for change. In this section, we will cover the most used methods of analysis.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Tip


    If your company has its own framework of strategy analysis, you should utilize
    insights from that strategy analysis to understand your company’s situation.


    # PESTLE analysis


    The decade of the 2020s has begun with economic turmoil following the Covid-19
    pandemic, supply chain pressures, a new war in Europe, continuing wars in other
    parts of the world, and inflation. These are all macro-level phenomena that –
    in varying ways, depending on your industry and geography – impact your company’s
    situation.


    Using **PESTLE analysis**, you categorize these impacts into six factors:


    +   - **Political:** Political factors include any potential or realized political
    decisions that are impacting or may impact your company, such as taxes, subsidies,
    and reforms. *Your executive sponsor and senior management can quickly list the
    key current political trends they are keeping an eye on.*

    +   - **Economic:** These factors are numerous; some key examples are inflation,
    interest rates, consumer confidence, business confidence, and GDP growth of the
    markets your company serves. *Your CFO or finance business partner is your go-to
    source for input on economic factors influencing your company.*

    +   - **Social:** Social factors cover the demographic makeup and trends of your
    markets’ populations, as well as their cultural preferences. *Your marketing department
    should have great insights into shifting trends in your target demographic – consumer-
    or business-wise.*

    +   - **Technological:** These factors include advances in technology that may
    enable you (and your competitors) to produce and deliver your products and services
    more efficiently at a lower production cost, as well as being able to market and
    sell your products and services more effectively. Common examples include automation
    in manufacturing,'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'and more efficient truck engines or electric vehicles. Leveraging customer
    insights for better segmentation and targeting to market and selling more effectively
    are other examples of technological factors. *Talk with your company CTO or head
    of innovation to gather these insights.*


    +   - **Legal:** Legal factors include legal precedents relevant to your industry
    and operating geographies, as well as any specific legal issues and risks your
    company may be exposed to. *The general counsel of your company, your CFO, or
    the head of risk management will be able to discuss the legal factors with you,
    though you will not be able to gain insights into all areas as some may be confidential.*

    +   - **Environmental:** These environmental factors include key trends of the
    physical environment in the geographies your company operates in. Obvious examples
    are climate change and the direct and indirect effects of climate change. Although
    the direct impact of climate change may have less impact on your company, the
    indirect effects, such as political instability, change in consumer and business
    preference, and shifts in product and service demand may have a greater influence
    on your company’s situation. *Your executive sponsor and senior management can
    tell you whether any environmental factors are particularly influential to your
    company.*


    Having established the macro factors influencing your company, let’s move on to
    understand the competitor situation of your company.


    # Porter’s five forces


    This is a standard method created by Michael E. Porter, the renowned Harvard Business
    School professor of strategy and competition, for analyzing the forces that impact
    a business’s competitive situation.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/307881206539c45e128c538a4b6912f8_31_0.png)


    Figure 1.4 – Porter’s five forces


    Let’s go through each of the five forces:


    +   - **Industry rivalry**: You should seek to establish answers to these key
    questions when describing your company’s industry rivalry:

    +   - **Nature of your industry’s rivalry**: How are your company and your competitors
    competing? Examples include price cuts, guerilla marketing methods, and locking
    in customers with exclusivity contracts.

    +   - **Competitive situation**: Is your company a dominant player or one of many
    competitors in your operating markets? Who are the biggest competitors? Who is
    gaining and losing market share? Use the last reporting year versus the previous
    reporting year to see this trend.

    +   - **Threat of new entrants**: Are there any indications of or actual new entrants
    entering your industry? What is their operating model and means of differentiation?'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   - **Threat of new substitutes**: Are customers using alternative products
    or substitute products in new ways to meet their needs?

    +   - **Bargaining powers of suppliers**: If your company (and general industry)
    is relying increasingly on a smaller number of suppliers, then they will have
    an increase in bargaining powers with the result being increased prices.

    +   - **Bargaining powers of buyers**: Similar to the bargaining powers of suppliers,
    if you sell to a highly concentrated group of customers, your company will have
    less bargaining power.


    # Market development


    Determine whether the markets your company is operating in are growing, stagnant,
    or declining. Compare the **market developments** of your key markets. Also, note
    whether there are any cyclical patterns and seasonality in your market. *Your
    CFO or finance business partner is your source of information here.*


    # Company’s financial performance


    You may easily have access to these key figures from your company’s latest **annual
    report** (for example, if your company is publicly traded). If not, work with
    your executive sponsor and their finance business partner to get a perspective
    on your company’s financial situation.


    +   - **Top-line revenue growth**: This tells you whether your company is growing
    or not. If it is growing, great! But seek to understand this in the context of
    the overall market growth. If your company is growing slower than the market,
    your company is losing market shares to the competition. You should then seek
    to understand the reason for this. *The leaders of your sales and marketing organizations
    should be able to help you determine this.*'
  merge: -1
  img_proc: true
- pgno: 33
  md: "+   - *Your finance business partner will be able to help you understand the\
    \ drivers for revenue growth.* Ask for a **price-volume-mix (PVM) analysis** for\
    \ the revenue growth of last year versus the previous year to understand whether\
    \ your revenue is primarily growing due to more products or services being sold,\
    \ higher prices, or a change in the mix of the products and services sold.\n+\
    \   \n+   - **Gross margin %**: Determine whether your gross margin percentage\
    \ is increasing or decreasing. This is a sign of your *company's viability*. Compare\
    \ your company’s gross margin % with your key competitors. If it is lower than\
    \ your competitors, your competitors are either able to command higher prices\
    \ for their products and services or are more efficient in producing their products\
    \ at a lower cost, or both.\n+     - Your finance business partner will be able\
    \ to help you understand the drivers for change in gross margin % using the same\
    \ PVM analysis method\n+   \n+   - **Operating profit %**: Determine whether your\
    \ company’s operating profit % is increasing or decreasing. This figure is the\
    \ result of multiple factors in your company’s profit and loss statement. It is\
    \ a sign of your *company's financial sustainability*.\n+     - Request the help\
    \ of your finance business partner to interpret – and put into perspective – your\
    \ company’s operating profit %\n\nAnalysis of your company’s financial performance\
    \ is the last component of your strategy analysis. Next, we will put all the analysis\
    \ together.\n\n# Summarizing your company’s strategic situation"
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The last step of your strategy analysis is to consolidate and structure the
    key, most important, and influential facts, factors, and trends into an easily
    comprehensible overview. Let’s explore the classic **Strengths, Weaknesses, Opportunities,
    and Threats (SWOT)** analysis model:


    +   - **Strengths**: What are the key strengths of your company that make you
    stand out from the competition?

    +     - *Review your findings in Porter’s five forces analysis as well as your
    company’s financial performance analysis for input on this*

    +   - **Weaknesses**: What are the key weaknesses of your company that make you
    vulnerable to the competition?

    +     - *Review your findings in Porter’s five forces analysis as well as your
    company’s financial performance analysis for input on this*

    +   - **Opportunities**: What are the key opportunities present for your company
    to pursue?

    +     - *Review your PESTLE analysis as well as your market development analysis
    for input on this*

    +   - **Threats**: What are the key threats against your company that your company
    should actively mitigate?

    +     - *Review your PESTLE analysis as well as your market development analysis
    for input on this*


    To understand what a SWOT could contain, let’s have look at the SWOT analysis
    of our scenario company, PME:


    +   - **Strengths**:'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - *Trusted brand by existing customers*

    +   - *Large and experienced manufacturing capabilities to produce superior products
    versus competition*

    +   - **Weaknesses:**

    +     - *Company’s financial performance. Top-level revenue growth is slower than
    the competition – losing market share. PVM’s driver is simply volume*

    +     - *Lack of modern system support for a modern commercial organization*

    +     - *Declining customer experience and **customer satisfaction (CSAT)** compared
    to the competition*

    +   - **Opportunities:**

    +     - *Turning the service department into a profit center by commercializing
    service offerings*

    +     - *Several sub-segments in various geographies that are currently unserved*

    +   - **Threats:**

    +     - *Existing and new competitors are rapidly developing new ways to modernize
    their companies'' go-to-market strategies, thus gaining more market shares. The
    competition is providing customers with automated and personalized marketing communication,
    seamless omnichannel buying experiences, digital self-service, and predictive
    maintenance solutions.*

    +     - *Some competitors are also leveraging the **Internet of Things (IoT)**
    and **artificial intelligence (AI)** technology to provide advanced predictive
    and prescriptive insights to enhance their customer’s experience.*'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Having gathered insights into your company’s strategic position, now it’s time
    to put the insights to use to create a vision for your Salesforce project.


    # Defining the vision for your Salesforce project


    By consolidating your strategy analysis, you should have a good understanding
    of the potential purposes of your Salesforce project.


    To make it crystal clear to yourself, the Salesforce taskforce, and eventually
    your wider organization, make sure you can explain why now is the right time for
    your Salesforce project.


    # Why now?


    What is the main reason(s) why the Salesforce project is being considered now?


    Common reasons for implementing the Salesforce CRM include the following:


    +   - Loss of competitive advantage:

    +     - Competitors are gaining market shares by providing a superior customer
    experience in the buying process and your current customers are demanding to be
    better served

    +     - Your market analysis, competitor analysis, and SWOT should indicate whether
    this is the main reason'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Legacy CRM system reasons:


    +   - A home-grown CRM system is not maintainable/upgradable to support your company’s
    digital transformation ambitions

    +   - Your analysis (or your enterprise architect’s analysis) should have uncovered
    this

    +   - Legacy CRM system licenses and support expiring: this could either be due
    to a decision by your company to not continue with the existing CRM system, or
    it could mean your current provider decided your (on-premises) CRM system is reaching
    the end of its life

    +   - No system support:

    +     - Your company has no CRM system to support your business processes: your
    business users are using email and spreadsheets to manage their marketing, sales,
    and customer service operations


    *For our scenario company, PME, the main reason why now is the right time for
    the Salesforce project is that the current CRM system is not adequate for the
    digital transformation ambitions of PME''s leadership. In addition to that, several
    smaller countries are not utilizing the CRM system provided by PME as they find
    it cumbersome and unsatisfactory, altogether. Instead, they are resorting to emails
    and spreadsheets, and some have even acquired licenses for other smaller CRM providers
    and email marketing providers (much to the dismay of the IT team). Finally, customer
    churn is increasing, CSAT scores are decreasing, and customer service is overwhelmed
    with customer calls and emails.*


    Your company may well have other valid reasons for why *now* is the right time
    to embark on a new CRM journey. Whatever the reason is, make sure'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'you fully understand it and that your wider stakeholder group is aligned with
    them.


    Having concluded why *now* is the right time for your Salesforce project, let’s
    move on to craft the vision for your Salesforce project.


    # Creating a vision for your Salesforce project


    To make sure your **vision statement** will live up to its purpose, let’s first
    go through the characteristics of a Salesforce project vision statement.


    A vision statement should fit the following criteria:


    +   - Is a short, single-sentence paragraph

    +   - Describes the essence and goal of your Salesforce project

    +   - Should not be technical

    +   - Should be easy to understand for your stakeholders

    +   - Is addressing your employees as the audience

    +   - Should create excitement about the future and the Salesforce project


    You and your Salesforce taskforce may make several draft vision statements before
    settling on the right one.


    # Tip


    Have sessions with your executive sponsor to ensure you get this right.


    The Salesforce taskforce at PME has gone through several rounds of information
    gathering to create a consolidated view of PME’s situation, challenges, and reasons
    for why now is the right time for their Salesforce project. They have also come
    to the end of the first main activity in the pre-'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'development phase: they have created a vision for their Salesforce project
    aligned with their stakeholders:


    PME’s **Salesforce CRM** project will **enable us to focus** on value-adding,
    customer-facing activities across **marketing, sales, and customer service**,
    which are **stimulating to us** while **delivering delightful experiences for
    our customers**.


    Let’s break down the anatomy of PME’s vision statement. Firstly, it makes it clear
    *who* the project is intended for, namely employees across marketing, sales, and
    customer service. It also explicitly states *what* the project will enable PME
    to do, that is, to focus on value-adding, customer-facing activities, as opposed
    to the current state of a cumbersome, manual CRM system. Finally, PME’s vision
    statement addresses *why* the project is happening: to stimulate PME employees
    and delight customers.


    With a clear vision for your Salesforce project created, you are ready to move
    on to the next chapter of your Salesforce journey.


    # Iterating in the pre-development phase


    So far, you have been engaging with internal stakeholders of your company to understand
    it and to create a vision for your Salesforce project. Internal stakeholders are
    essential when defining a Salesforce project. As mentioned earlier, as you progress
    through the activities of the pre-development phase, you will likely come back
    and revise your organizational overview and strategy analysis as you become more
    knowledgeable and uncover new insights about your company and its environment.
    You may also find yourself tweaking the vision statement of your Salesforce project,
    and that’s okay as long as it is not a 180-degree change.


    Therefore, be mindful not to set things in stone as ultimate truths and holy decisions.
    Keep an open mind as you progress through the first iteration of the pre-development
    phase.'
  merge: -1
  img_proc: true
