    realm – products within the Salesforce org, add-ons, and any AppExchange apps
    you may include – and which are *external* to Salesforce.


    If you’re planning to replace any legacy CRM systems with Salesforce, the capabilities
    previously supported by those systems will in the future be supported by Salesforce
    solutions. Determine which Salesforce product covers your required business capability.'
