- pgno: 243
  md: '# Planning, communicating, and managing change


    The purpose of the following activities, in short, is to ensure that the business
    value you wish to achieve with your investment in Salesforce is unlocked, realized,
    and maximized.


    Let’s get started!


    # Understanding the scale of change to come


    In *Chapter 3*, *Determining How to Deliver Your Salesforce Project*, in the pre-development
    phase of your project, you identified the actors who would be affected by the
    change as a result of your Salesforce solution. A lot has happened since then.
    You have progressed through the pre-development and development phases, and many
    of the assumptions and hypothetical processes and solutions may have changed –
    to better fit your business needs.


    What you should ideally have done throughout the development phase is work with
    a **business change consultant** to identify how the new solution and processes
    differ from current ways of working, and for whom.


    Here are some of the typical stakeholders who are affected by the change as a
    Salesforce solution is implemented:


    +   - The end users

    +   - Managers of end users

    +   - The leadership of local organizations

    +   - Global leadership

    +   - Application management staff'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Data, BI, reporting, and analytics staff


    After you have identified the stakeholders who will be affected by the change,
    let’s move on and prepare for the change to come!


    # Preparing your change management plan template


    Traditionally, go-live is referred to as the point at which your users log in
    to Salesforce production for the first time and perform work in it.


    But what is the value of that? There isn’t any necessarily. Going live itself
    does not equal adoption, and certainly is not the assurance of the best, correct
    use of your solution.


    The traditional definition of go-live may be semantically accurate, however, from
    a change management and business value perspective, most of your future end users
    have never seen or worked with your solution or know about your solution’s capabilities,
    limitations, and potential.


    The change will happen for your stakeholders as you roll out your solution. Make
    sure you have a plan for managing it – before the change occurs. Keep your plan
    simple and update it as you learn from the roll-out.


    In Figure 10.1, you can see a consolidation of the many activities you need to
    consider and plan for go-live to make the onboarding and the change journey as
    smooth as possible – to ultimately reap the benefits of your Salesforce investment.
    The numbers at the top represent the weeks relative to go-live:'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/307881206539c45e128c538a4b6912f8_245_0.png)


    Figure 10.1 – Change management activities relative to go-live


    Let’s go through each activity:


    ● **Assessing change readiness**: Perform interviews with a limited number of
    people from the different stakeholder groups to assess their sentiment, sense
    of preparedness, and level of excitement or concern about changing to a new way
    of working in a new system. Depending on the assessment, initiate appropriate
    actions and communicate accordingly.


    # Tip


    Review the *Salesforce Change Readiness Assessment* document from **The Salesforce
    Way** at https://www.salesforce.com/content/dam/web/en_us/www/documents/services/the-salesforce-way-change-readiness-assessment.pdf.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   - **Communicating change**: Create a plan to communicate in the context
    of the user group(s) going live. You should engage with local leadership to understand
    the context and circumstances that affect the organization – also refer to the
    results of your change readiness assessment:

    +     - Your comms plans should include *what* to communicate *to whom*, *when*,
    and from *which sender* (ideally, the local leadership or **change agent**, also
    called the **champion**). Here are some examples of what you can communicate:

    +       - *Before training*: Build excitement yet manage expectations by not overpromising.

    +       - *During training*: Key aha moments of joy from the training sessions.

    +       - *After training*:

    +   - Success stories from users. Tips such as “did you know you can do or see
    this in Salesforce?”

    +   - Salesforce productivity tips if you have configured or enabled any of them
    – **Email Templates**, **Quick Text**, or **Macros**.

    +   - Responses to bugs reported/new features requested.

    +   - Key adoption metrics, such as top and bottom adoption by end user group.

    +     - In your communication, maintain a healthy balance of creating excitement
    and managing expectations – people are complex beings, able to hold multiple feelings
    at the same time: fear, excitement, eagerness for change, and, at the same time,
    resistance to it.

    +     - Remember the purpose and vision of your Salesforce project that you established
    in *Chapter 1*, *Creating a Vision for Your Salesforce Project*.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'In your communication, continuously answer this key question for your user
