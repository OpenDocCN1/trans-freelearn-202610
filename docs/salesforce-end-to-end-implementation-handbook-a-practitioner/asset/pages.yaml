    # Introducing development models in Salesforce


    A development model is a method for migrating your solution through environments,
    and there are different models available to you, each with its own considerations.


    The following table compares the available Salesforce development models:


    | Development model | Source of truth | Release artifact and deployment method
    | Level of sophistication, flexibility, and scalability |

    |---|---|---|---|

    | Manual deployment | Salesforce production org | Manually recreating configuration
    | Extremely low |

    | Change Set Development Model | Salesforce production org | Metadata deployed
    with change sets | Low |'
