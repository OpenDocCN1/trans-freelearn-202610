- pgno: 15
  md: '# Creating a Vision for Your Salesforce Project


    To start a journey, you need to determine where you want to go. This chapter guides
    you through methods of analysis to understand your company’s imperative for change,
    which will be the foundation for you to be able to create a vision for your **Salesforce
    project**.


    After creating a vision for your Salesforce project, you’ll then be ready to move
    on to the next activities in the pre-development phase of your Salesforce implementation.


    In this chapter, we’ll cover the following main topics:


    +   - Introducing the life cycle of Salesforce implementations

    +   - An overview of the pre-development phase of your Salesforce project

    +   - Understanding your company’s imperative for change

    +   - Defining the vision for your Salesforce project

    +   - Iterating in the pre-development phase


    Let’s go!


    # Introducing the life cycle of Salesforce implementations


    This book will provide a framework for approaching the entire implementation life
    cycle specific to Salesforce projects – from **project inception** in the pre-development
    phase to the continuous improvement phase. Here’s a brief overview of the phases
    involved:'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/307881206539c45e128c538a4b6912f8_16_0.png)


    Figure 1.1 – The project phases of a Salesforce implementation


    In Figure 1.1, you can see each phase of a Salesforce project. Let’s briefly define
    each phase:


    +   - **Pre-development phase**: In this phase, you are creating a vision for
    your Salesforce project, defining its nature, determining how to deliver it, securing
    a budget for it, and engaging with Salesforce and implementation partners. In
    this phase, you will also be setting up the governance body, which will own and
    oversee the delivery of your Salesforce project.

    +   - **Development phase**: This phase begins with a project kick-off event,
    following which the project team will start delivering the project. There are
    different methodologies for delivering Salesforce projects, which we will cover
    later in *Chapter 3, Determining How to Deliver Your Salesforce Project*. Whichever
    methodology you choose, the development phase is where your Salesforce solution’s
    scope is detailed, designed, built, and tested to ensure quality.

    +   - **Roll-out phase**: In this phase, you are deploying your release, migrating
    data, training your users, providing support, and closely monitoring how users
    are adopting your solution and responding accordingly.

    +   - **Continuous improvement phase**: Finally, you will find yourself in a state
    of continuous improvement. Your ability to evolve your **Salesforce org** to changing
    business needs, as well as managing and leveraging your data, is your top activity
    in this phase.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Salesforce projects – especially **greenfield implementations**, where an organization
    sets up their **Salesforce org** for first-time use – do not start at the project
    kick-off event. Neither should Salesforce projects end directly after user training
    in the roll-out phase.


    Now we have understood the overall phases of a Salesforce project. Let’s dive
    into the pre-development phase of your Salesforce project.


    # An overview of the pre-development phase of your Salesforce project


    Each phase of a Salesforce project has its own set of **key milestones**, along
    with activities to reach the milestones.


    Let’s get started with key milestones of the first phase of your Salesforce project.


    # Key milestones of the pre-development phase


    The pre-development phase of your Salesforce project starts at inception. Inception
    is defined as the point where your company has made a choice of technology from
    a range of CRM providers, and Salesforce has been chosen as your future **CRM
    platform**. Deciding on a CRM provider is outside the scope of this book.


    The key milestones of the pre-development phase are securing an initial budget
    for your Salesforce implementation and contracting with **Salesforce Inc.**, and
    most often an **implementation partner**, to assist you in the development and
    roll-out of your solution.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'To reach these milestones, several activities are required. We will go over
    these activities in the next section.


    # Activities in the pre-development phase


    The activities in the pre-development phase of your Salesforce project are illustrated
    in the following figure:


    ![](img/307881206539c45e128c538a4b6912f8_18_0.png)


    Figure 1.2 – Activities in the pre-development phase


    There are two key points to note from Figure 1.2:'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - Each activity in the pre-development phase is covered by a chapter in
    this book, so you can easily navigate to the part you want to dive into.

    +   - There are no arrows in the diagram. While the order of the activities generally
    means you should go clockwise through the process, it is not always the case.
    We will come back to this point in the *Iterating in the pre-development phase*
    section of this chapter.


    Now that we have established *what* the overall activities consist of in the pre-development
    phase, let’s look at *who* will be performing the activities.


    # Introducing the Salesforce taskforce


    To carry out the activities in the pre-development phase, the executive sponsor
    of the Salesforce implementation should create a **Salesforce taskforce**.


    The Salesforce taskforce should consist of three key roles, with representatives
    from the business organization, the IT organization, and your **Project Management
    Office (PMO)**. Finally, the Salesforce taskforce *must* have an executive sponsor.


    The roles and responsibilities of each member are described in *Table 1.1*:


    | Taskforce member role | Taskforce member responsibilities |

    |---|---|

    | Business owner | - Lead the analysis of the company’s strategic situation

    - Determine required business capabilities

    - Determine business KPIs to measure the success of the project |

    | Tech owner |  |'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - Based on the required business capabilities, determine high-level target
    technical scope

    +   - Ensure target technical scope aligns with enterprise architecture principles
    and plans


    PMO representative


    +   - Taskforce project management

    +   - Stakeholder management

    +   - Set meetings with internal and external stakeholders, capturing minutes
    and actions

    +   - Set and schedule taskforce meeting cadence, and report to the executive
    sponsor

    +   - Escalate issues and decisions not able to be taken by the taskforce


    Executive sponsor


    +   - Support and coach taskforce

    +   - Act as an escalation point


    Table 1.1 – The responsibilities of taskforce member roles


    # Duration of the pre-development phase


    During the beginning of the Covid-19 pandemic, some companies realized their imperative
    to change was urgent and turned around all the activities in the pre-development
    phase in a matter of a few weeks. While it may have rescued small- and medium-sized
    businesses in exposed industries, you should not rush through this phase.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'The solid preparation and organizational alignment work done in the pre-development
    phase will make your Salesforce project more robust and have a greater chance
    for success, compared to a rushed pre-development phase.


    Let’s continue to the next section where we will uncover your company’s need for
    change.


    # Understanding your company’s imperative for change


    In this section, we will analyze your company’s situation through various methods
    to be able to determine the vision for your Salesforce project.


    To help exemplify the methods used, let us first introduce the scenario company
    that we’ll follow throughout this book.


    # Introducing our scenario company – Packt Manufacturing Equipment (PME)


    Let’s look at some initial facts about the scenario company:


    +   - Company name: Packt Manufacturing Equipment (PME)

    +   - Industry: Manufacturing

    +   - Annual revenue: 300 million USD

    +   - Number of employees: 2,000 FTEs

    +   - Geography: Operating and selling globally; direct in mature PME markets,
    and through distributors in emerging PME markets


    Meet the PME Salesforce taskforce charged with shaping the project in the pre-development
    phase:'
  merge: -1
  img_proc: true
- pgno: 22
  md: '+   - **The business owner:** Kalinda Keen. Kalinda is a manufacturing industry
    veteran. She has held multiple roles, in many functions, within PME. Currently,
    she is working in the global commercial excellence department, responsible for
    building capabilities for local marketing, sales, and customer service organizations.
    Kalinda is closely aware of the market trends and forces affecting PME.

    +   - **The tech owner:** Cary Sharp. Cary is a rising star in the global IT department.
    Cary is a solution architect transitioning to an enterprise architect position
    and is extremely interested in cloud computing. He has worked at PME for 4 years
    and is well aware of the PME system landscape.

    +   - **The PMO representative:** Alicia Fast. Alicia is new to PME, having joined
    recently from another industry. She has lots of project management experience,
    and her recent job involved managing a Salesforce implementation.

    +   - **The executive sponsor:** Diane General. Diane is a **Senior Vice President
    (SVP)** of global commercial excellence, reporting to the CEO of PME. Kalinda
    reports to Diane. Diane has been with PME for over 10 years, in multiple managerial
    positions ranging from country leadership to functional management roles. She
    is well liked and trusted within the organization and has been part of PME’s board
    committee on digital transformation strategies.


    After getting to know the scenario company, PME, let’s return to your company.


    # Your company’s environment, situation, and challenges


    To lay out a path, in addition to knowing where you want to go, you also need
    to understand where you are coming from and, critically, why you need to move.
    Your first activity in the pre-development phase is, therefore, to analyze and
    establish your **company’s situation**.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'In the following section, we will cover basic methods of understanding how
    your company is organized, who your customers are, and the products and services
    you sell.


    # Important note


    Your role as part of the Salesforce taskforce should not be to produce the analysis
    output, but *to consolidate and understand what over arching forces drive your
    company’s imperative for change.*


    # Understanding how your company is organized


    Before you endeavor to perform any strategy analysis, you should first seek to
    establish how your company is organized. The simplest way to achieve this is by
    looking at your company’s org charts. *Charts* is a plural intentionally, as there
    will be many layers.


    You will want to understand the following regarding your company’s structure:


    +   - Your local organizations’ structure:

    +     - How many countries does your company directly operate in?

    +     - How are the countries or local organizations typically organized?

    +     - Does each country have its own leadership team or does each country’s
    sales, customer service, and marketing team report directly to group sales, customer
    service, and marketing management, respectively?

    +     - How much variation is there among the structures of your local organizations?'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   - How many people are employed in each country or sales organization?

    +     - How many are employed per country or sales organization?

    +     - How many are employed in marketing, sales, and customer service functions,
    respectively?

    +     - Beyond sales, marketing, and customer service, which other functions do
    local country or sales organizations manage, and to what extent? This could be
    back-office sales support functions, local logistics, and local IT support.

    +   - Your group-level organization:

    +     - This would typically be an org chart of your company’s group management

    +     - Pay special attention to IT governance:

    +       - Is group IT responsible for setting guidelines and providing ad hoc
    advice, or do they firmly own the enterprise IT landscape and work to ensure compliance?
    It may be somewhere in the middle but be sure to get a good understanding.

    +   - Your partner, reseller, or distributor network:

    +     - If your company sells its product or services through partners, how are
    the relationships with those partners managed?

    +     - Are the partner relationships managed at the group level or by the local
    sales organization? Or at some intermediary level?

    +     - How many partners does your company have agreements with?

    +     - What countries do your partners cover?'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   - Do your partners sell *all* your company’s products and/or services or
    only a subset?


    # Tip


    Engage with your HR department to understand how your internal company is structured.
    Regarding your partner network, you may have to do some investigation internally
    to find out who manages those relationships.


    Be aware that organizations are dynamic and that small organizational changes
    happen frequently, and larger changes also occur from time to time.


    *To understand how an org chart could look, let’s look at PME’s company structure
    in the following diagram:*'
  merge: -1
