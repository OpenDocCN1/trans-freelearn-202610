- pgno: 123
  md: 'You may find that the funding for your Salesforce project is not approved because
    senior management believes your business case is reliant on assumptions of costs
    but that you are approved to begin engaging with Salesforce and implementation
    partners to solidify your assumptions. You will gain insights and assistance for
    this in the next section, where we explore how you can effectively engage with
    Salesforce and implementation partners.


    Now, it is time to talk with Salesforce and implementation partners.


    # Engaging with Salesforce and implementation partners


    Once a budget for your Salesforce project has been pre-approved, you can begin
    to engage with both Salesforce and implementation partners simultaneously. In
    this section, we’ll cover the basics of how you can do so effectively.


    # Engaging with Salesforce


    To validate your business case assumptions for what your Salesforce license costs
    will be, you need to get a quote from Salesforce.


    Let’s see who you will engage with to get your quote.


    # Parties involved from Salesforce


