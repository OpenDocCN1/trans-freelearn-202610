- pgno: 256
  md: 'The period after user training is key and fragile. As such, a heightened level
    of support is required to be able to quickly respond to questions and issues faced
    by end users. That phase is called **hypercare** – let’s dive into it!


    # Providing hypercare


    Hypercare is a phase in your Salesforce project as much as it is a capability.


    Let’s break the capability into its parts:


    +   - **The hypercare process:** When your users begin working in Salesforce,
    they may get stuck, face issues, and require further assistance beyond the training
    and training materials you have provided. Be sure to communicate the process your
    users should follow to get help. It may be similar to the process you used for
    SIT and UAT, so use that as a starting point.

    +   - Depending on your setup and available resources, you need to determine what
    levels are involved in your hypercare process. Ask your end users to state the
    priority/severity when submitting bugs so your hypercare team can prioritize accordingly:

    +     - Depending on your project setup and the contract with your implementation
    partner, it may be helpful to define a specific **service-level agreement (SLA)**
    for each defined severity so your end users know by when to expect their bugs
    to be reviewed and/or resolved.

    +   - You want users to submit issues (potential bugs) using a pre-determined
    template (revisit the *Driving UAT of your solution* section of *Chapter 9*, Deploying
    Your Release and Migrating Data to Production).

    +   - Similarly, you should also have a process for how users communicate new
    ideas or change requests:'
  merge: -1
  img_proc: true
- pgno: 257
  md: "+   - Depending on the maturity of your organization and end users – that is,\
    \ whether they would struggle to distinguish a bug from a change request – you\
    \ may opt to only have one template for them to submit both bugs and change requests.\n\
    +   \n+   - **Hypercare people:** Who receives the submitted bugs can vary; it\
    \ may be your implementation partner’s *business analyst(s)*, your own *Salesforce\
    \ application management team*, or your *product owner*. Ideas should be received\
    \ and reviewed by your product owner, and the outcome communicated back to the\
    \ reporter. Here are the different responsibilities in hypercare and what roles\
    \ take them on in order to fix qualified and prioritized bugs:\n+     - You will\
    \ need to have functional consultants, developers, and QA specialists available\
    \ (at least one of each) – how many of each resource depends on the nature and\
    \ size of your Salesforce project.\n+     - You need to have your PO(s) fully\
    \ available – one for each of the business domains of your Salesforce solution\
    \ going live.\n+     - It is also best practice to have architects (or at least\
    \ one) available in case a fix requires a more complex redesign of solutions.\n\
    +   \n+   - **Hypercare systems:** You should also determine what system your\
    \ users should use to submit bugs and ideas:\n+     - For bug reporting, you can\
    \ use Salesforce `Cases` (this requires configuration to fit your organization\
    \ and process) or your help desk ticking system. It is important that triaged\
    \ bugs that need resolution should be registered and tracked in the system you\
    \ use to manage development activities – for example, *Jira* or *Azure DevOps*.\n\
    +     - For new ideas, you can utilize Salesforce’s `case` object (requiring configuration\
    \ to fit your organization and process), which allows users to create Case records\
    \ in Salesforce that you can assess and respond to."
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   - **Hypercare data**: From these systems, you should monitor and analyze
    the volume, trend, and resolution of bugs and ideas.


    # Tip


    Rather than obsessing over isolated user feedback, criticism, and resistance to
    change, have a balanced approach to user feedback; take note of valid concerns
    and improvement suggestions – and importantly – *respond patiently and empathetically
    to all user feedback!*


    Your organization and implementation partner will become more capable to support
    new users during hypercare as you progress with the roll-out of your Salesforce
    solution to more users.


    Having covered what hypercare is and how it is carried out, let’s discuss how
    and when to progress to ongoing support!


    # Transitioning to ongoing production support


    Hypercare is more expensive than regular ongoing production support. As such,
    it may be tempting to quickly transition to production support once hypercare
    bugs begin to decrease.


    Recall our definition of a successful roll-out from the previous chapter – to
    maximize value from your investment in Salesforce:


    A successful roll-out phase should be defined as the point at which your organization,
    customers/partners, and users use and gain value from your Salesforce solution,
    and it delivers the target business outcomes you laid out in *Chapter 4, Securing
    Funding and Engaging with Salesforce and Implementation Partners.*


    You should consider the following four points before deciding to transition from
    hypercare to ongoing production support:'
  merge: -1
  img_proc: true
- pgno: 259
  md: '1. Have you *defined and aligned your process* for ongoing production support
    and allocated sufficient resources to it – proportional to the nature of your
    Salesforce solution, its required maintenance, and the number of users living
    in it?


    2. Is the *team* that will be responsible for ongoing production support…:


    +   - Going to be an in-house team or staffed by an external partner as a managed
    service?

    +   - Trained in your Salesforce solution?

    +   - Onboarded to the bug and idea process?


    # Important note


    The team you have allocated to hypercare will likely include some of the same
    members of the development team of your Salesforce solution. They are experts
    on your Salesforce solution and therefore the best and quickest actors to reproduce
    bugs, troubleshoot, and fix them. If you transition prematurely, likely, some
    of these resources will be allocated to other projects.


    3. Are you reaching your *adoption* targets?


    +   - Critically, read the next section before considering transitioning to ongoing
    production support.


    4. Are you beginning to *achieve the business results* you laid out in the business
    case for your Salesforce project?


    Unless you can confidently say a resounding *yes!* to all four points, you should
    hesitate to transition from hypercare to ongoing production support.


    Next, let’s turn to the important topic of adoption!'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Monitoring and the driving adoption of your Salesforce solution


    In parallel with providing hypercare and support, you should closely monitor and
    try to understand the adoption of your Salesforce solution.


    As mentioned in *point 4* in the previous section, you shouldn’t consider transitioning
    from hypercare to ongoing production support before you reach your adoption targets.
    Why not? If your solution isn’t adopted in the hypercare phase of your roll-out,
    how will you make sure it is adopted later and whose responsibility will it be?
    When your project enters the continuous improvement phase, the focus for many
    stakeholders will shift to new feature development, and for your roll-out/local
    deployment team to prepare for the next wave.


    For these reasons, I would propose that you – as the one accountable for your
    Salesforce implementation – expand the scope of what hypercare entails, and when
    it may finish.


    Let’s move beyond simple quantitative bug reporting and login metrics!


    # Defining and measuring adoption


    According to Oxford Learner’s Dictionaries, the verb **adopt** has the following
    meaning within the context of adopting a method:


    > *“Adopt something to start to use a particular method or to show a particular
    attitude towards somebody/something.”*


    We could translate that definition to the following in a Salesforce context:


    > *“Enabling users to perform work in Salesforce and to perceive it to be a valuable
    improvement for their work life.”*'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Let’s break down the definition further into its two parts, and some of the
    key ways you can measure and track adoption in a Salesforce context:


    1. **Perform work in Salesforce**: You need to track whether your intended users
    are using your solution – and to what effect. This involves tracking two parameters:


    +   - Logins:

    +     - Daily, weekly, and monthly

    +   - Usage:

    +     - **Efficiency**: The number of records created – for example, **Leads**,
    **Opportunities**, **Cases**, and **Tasks** measured per timeframe (hour, day,
    or week).

    +     - **Effectiveness**: This could include the number of converted **Leads**,
    **Opportunities** closed (won/lost), and **Cases** closed per timeframe (hour,
    day, or week).


    # Tip


    The specific metrics relevant for you depend on the nature of your Salesforce
    solution and what users (or customers and partners) it is intended for. Work with
    your change and adoption consultant to define which metrics are appropriate for
    you. You can measure and track (most of) the quantitative, objective adoption
    metrics using the free Salesforce Adoption Dashboards by Salesforce Labs:


    https://appexchange.salesforce.com/appxListingDetail?listingId=a0N30000004gHhLEAU


    2. **Perceive Salesforce to be a valuable improvement**: A synonym of adopting
    is *embracing*. You should try to understand your users’'
  merge: -1
  img_proc: true
- pgno: 262
  md: "sentiments and how deeply they embrace your Salesforce solution.\nSome good\
    \ methods for doing this include surveys and interviews:\n\n# 1. Survey:\n\n+\
    \   i. Ask your users the classic **Net Promotor Score (NPS)** question, “How\
    \ likely are you to recommend using Salesforce to one of your colleagues?” or\
    \ a variation, “How likely are you to recommend using Salesforce to someone in\
    \ your network?”\n+   \n+   ii. Ask for comments – for example, “What’s the best\
    \ thing and the worst thing about the solution?”\n+   \n+   iii. Ask whether they\
    \ have noticed any improvements in the solution lately.\n+   \n+   iv. Use the\
    \ end of the survey as an opportunity to remind your users how they can get help,\
    \ report bugs, or make suggestions.\n\n# Tip\n\nThe trend of the responses to\
    \ your surveys will provide great insights. Send out surveys weekly the first\
    \ few months after go-live, then once every 1-3 months.\n\n# 2. Interview:\n\n\
    +   i. As many facets and factors influence a quantitative measure of adoption\
    \ and the answers to surveys, you should try to understand what the underlying\
    \ reasons may be.\n\n# Tip\n\nNot all people are comfortable submitting a bug\
    \ if they hit a snag in your system. It still harms their adoption; you are just\
    \ not aware of it. To avoid this blindside, make sure you regularly (daily during\
    \ hypercare) check any **Flow Error** emails (these are sent to the email of the\
    \ admin who last modified the flow or the Apex exception email recipients) as\
    \ well as **Apex Exception** emails (you set the email addresses to receive these\
    \ emails in `Setup`)."
  merge: -1
  img_proc: true
- pgno: 263
  md: 'If you are receiving complaints about page loading times or general performance
    issues, set up reports to track key metrics, such as **Experienced Page Time (EPT)**.
    Check out the *Measure Performance for Your Salesforce Org* help article, which
    describes how you may set it up, at https://help.salesforce.com/s/articleView?id=sf.technical_requirements_measuring_ept.htm&type=5.


    You should share the adoption metrics with your executive sponsor, local country
    leadership, and change agents. Engage with your change and adoption consultant
    to identify actions and initiatives to help improve the adoption of your Salesforce
    solution.


    # Setting targets for adoption and evaluating your original business case


    It should be your ambition to have a CRM system that is not only used, but also
    embraced and perhaps even something your employees are proud of. Providing superior
    solutions and user experiences not only raises employee satisfaction and retention
    rates but it’s also great for business!


    Now, Rome wasn’t built in a day, but you should begin to see a trend toward a
    positive sentiment regarding your Salesforce solution.


    For the quantitative, objective usage metrics, you need to relate your targets
    to the KPI targets you defined as part of your original business case in *Chapter
    4, Securing Funding and Engaging with Salesforce and Implementation Partners.*


    As hypercare progresses, you should – after an initial drop in performance due
    to your organization beginning to use a new system – begin to see your business
    performance improve. How quickly after go-live (for example 1, 3, 6, or 12 months)
    you begin to achieve the business results you laid out in the business case for
    your Salesforce project depends on the nature of your solution, what level of
    sophistication you are migrating from, and, of course, to what extent you have
    carried out your Salesforce project *by the book.*'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Summary


    Having read this chapter – and created your own change management and roll-out
    plan – you have set your Salesforce project up for a successful initial go-live,
    as well as successful further roll-outs. You prepared and executed your organizational
    enablement plan to manage the scale of change to come. You determined your overall
    training plan and determined which methods of training you will offer your users.
    You have learned how to provide hypercare after go-live and when to transition
    to ongoing production support. Finally, you have learned how to monitor and drive
    adoption, and you began to evaluate how the benefits compare to those of your
    original business case for your Salesforce project.


    In the next chapter, we’ll discuss typical issues you may encounter when rolling
    out your Salesforce solution, and how to mitigate and overcome them. You will
    also be provided with a checklist to evaluate the state of your Salesforce project
    in the roll-out phase.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Common Issues to Avoid in the Roll-Out Phase


