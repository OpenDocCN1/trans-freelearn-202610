- pgno: 41
  md: '# Defining the Nature of Your Salesforce Project


    In this chapter, you will learn how to scope the desired business capabilities
    of your Salesforce project and determine the high-level hypothetical technical
    scope required to support those capabilities. These two elements together will
    be referred to as the nature of your Salesforce project.


    You will be introduced to business process mapping and designing workshops for
    understanding current business processes and defining the business capabilities
    of your Salesforce solution. You will then be introduced to the Salesforce license
    types and learn how to determine the high-level hypothetical technical scope for
    your Salesforce solution.


    We will continue to follow our scenario company, **Packt Manufacturing Equipment
    (PME)**, and progress through the activities to define the nature of their Salesforce
    project.


    After the nature of your project is defined, you’ll be ready to move on to the
    next activities in the pre-development phase of your Salesforce implementation.


    This chapter will cover the following main topics:


    +   - Defining the capabilities to be supported by your Salesforce solution

    +   - Determining the high-level technical scope of your Salesforce solution

    +   - Iterating in the pre-development phase


    Let’s go!'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Defining the capabilities to be supported by your Salesforce solution


    In the previous chapter, you established your company’s situation and the overall
    purpose and vision for your Salesforce project. As illustrated in the following
    diagram, it is now time to get more specific and define the nature of your Salesforce
    project:


    ![](img/307881206539c45e128c538a4b6912f8_42_0.png)


    Figure 2.1 – Activities in the pre-development phase'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Before jumping into defining the business capabilities for your Salesforce
    project, let’s first understand what business capabilities are and why they are
    important to define.


    # Understanding business capabilities


    All companies and organizations have a number of **business capabilities**. But
    what are they really? A business capability is comprised of **people** with a
    skillset or area of competency who carry out work according to a **business process**,
    supported by one or more **systems** while having access to and the ability to
    create and update relevant **data** in order to achieve desired **business outcomes**.


    An example of a common business capability is **account and contact management**.
    Account and contact management covers a company’s ability and processes for managing
    customer and customer contacts’ data.


    As you may have figured out, business capabilities are important to understand
    and map for a company *before* being able to determine what the technical scope
    should be. The reason is that systems are a component of a business capability.
    Knowing what business capabilities and business outcomes your Salesforce solution
    should support is *critical* before diving into technical architecture and design.


    A business capability may be achieving the desired outcomes to a smaller or greater
    extent. We say business capabilities *vary in maturity* so let’s explore business
    capability maturity.


    # Understanding business capability maturity


    To understand the concept of maturity of business capabilities, let’s look at
    a simple example.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'If your company provides any kind of support for your customers, you implicitly
    have a *customer service* domain business capability. The exact business capability
    could be customer service ticket management or **case management**, as it is often
    referred to in a Salesforce solution. You may currently have little or no system
    support beyond a customer service phone number and people picking up the phone
    to answer customer inquiries. The customer service staff may have received little
    or no structured training in a predefined process and have no access to any data
    to help them provide customer service. In this case, your current case management
    business capability could be categorized as having *low maturity*.


    On the other hand, your customer service capability may consist of well-trained
    and skilled people who work according to a predefined process. They may also be
    supported by an aligned and fit-for-purpose system that provides adequate data
    insights to help your customer service staff in providing top-notch customer service.
    If these descriptions are valid, your case management business capability would
    be considered to have *higher maturity*.


    Next, let’s look at categorizing business capabilities.


    # Categorizing business capabilities


    Business capabilities are grouped by **domain**, where a domain represents an
    overall function of a company, such as marketing, sales, customer service, operations,
    finance, IT, and HR.


    Determining up front what overall business domains are in the scope of your Salesforce
    project is critical before diving into the specifics of business capabilities.


    In addition to grouping your company’s business capabilities by domain and assessing
    the maturity of each, you should be aware that every company is different. Different
    domains and business capabilities exist from industry to industry and within a
    company’s different business lines and geographies and are therefore important
    to identify on a case-by-case basis. It is important to understand which business
    capabilities are considered'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'strategic within your company and therefore given focus and resources to expand
    and mature – in order to achieve target business outcomes.


    As you progress through the activities of determining your current business capabilities,
    keep in mind what you have learned about the maturity of business capabilities
    and seek to identify which capabilities play a strategic role in the success of
    your company.


    Now let’s take a look at the role of the Salesforce taskforce in defining business
    capabilities for your Salesforce project.


    # The role of the Salesforce taskforce in defining business capabilities for your
    Salesforce project


    As a member of the Salesforce taskforce, you will be deeply engaged in carrying
    out activities to determine the business capabilities in the scope of your Salesforce
    project.


    Both the business owner and tech owner will be busy creating and consolidating
    the output and artifacts produced during these activities.


    # Determining your high-level business processes


    The first step is to create a high-level overview of your company’s overall business
    processes. An appropriate illustration method is a simple flow chart of the end-to-end
    process from marketing activities through to invoicing and after-sales customer
    service. In Figure 2.2, you’ll find an example of a simple flow chart of PME’s
    high-level business processes:'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/307881206539c45e128c538a4b6912f8_46_0.png)


    # Figure 2.2 – PME’s current high-level business process


    This simple flow chart is suitable at this stage as it does not allow for branching
    or decisions, forcing you to stay at a high abstraction level. The high abstraction
    level also means most, if not all, stakeholders you show it to will be able to
    understand and relate to it.


    Next, we will look at breaking the high-level business processes into business
    capabilities.


    # Creating an overview of your current business capabilities


    To determine your current business capabilities, start by determining the overall
    business functions, the domains. Next, go through each step in the high-level
    business process chart you created and break each step into'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'separate business capabilities. Keep the definition of business capabilities
    in mind as you name your business capabilities – distinguish between business
    processes where new people, systems, and data are introduced.


    Tip!


    Engage with an enterprise architect at your company to validate your overview
    of business capabilities. Make updates as required.


    Once you have all your company’s capabilities determined, create a business capability
    map for a simple illustration.


    Tip!


    Salesforce is *fundamentally and primarily* – among many other features – a CRM
    system. Therefore, you should focus on your business’ marketing, sales, and customer
    service domain capabilities as a starting point for your Salesforce project.


    In the following diagram, you can see PME’s business capability map – focused
    on customer relationship management business capabilities:


    ![](img/307881206539c45e128c538a4b6912f8_47_0.png)


    Figure 2.3 – PME’s current business capability map'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'In *Figure 2.3*, PME’s business capability map shows the business capabilities
    currently supported by PME’s current CRM **tech stack**. Tech stack means the
    systems used by one or more marketing, sales, or customer service persons to execute
    their work.


    Having determined the high-level business processes of your company, let’s move
    on to better understanding the identified capabilities and get your end users’
    perspectives.


    # Facilitating workshops to understand current key business processes


    Up until this point, you, the Salesforce taskforce, will have carried out desk
    research about your company’s overall business processes and engaged with an enterprise
    architect and your executive sponsor. To validate your understanding of your company’s
    CRM business capabilities, it’s critical to get your end users’ perspectives.


    Tip!


    Approach your Salesforce project from a change management perspective – early
    involvement of your end users in your Salesforce project will lay the groundwork
    for great adoption.


    The best way to get a group of people together to understand business processes
    is through workshops.


    Key items to keep in mind to facilitate effective workshops in a Salesforce project
    are as follows:


    +   - **Workshop goal**: Be sure to define the goal of the workshop and share
    this with the workshop participants upfront.

    +   - **Participants**: Ensure you include **subject matter experts (SMEs)** in
    the workshop. If you have had any indication of business processes varying by
    region or country, make sure you invite an SME from'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'multiple different regions or countries as far as is practically possible and
    make sure to align and validate your findings with remaining regions afterward.


    +   - **Workshop environment**: Ideally, you should try to get people together
    physically in the same room. If not, it can also be done virtually.

    +     - If physical, make sure the room(s) available are *not* set up in a classic
    desk structure, but in a manner that encourages moving around and interacting.
    Prepare brown paper bags or other paper you can plaster on a wall, and bring large
    post-its and pens.

    +     - If virtual, make sure you and the workshop participants have access to
    adequate online collaboration tools.

    +   - **Workshop invitation**: Strive to invite attendees at least 2 weeks in
    advance and share any preparation you expect the participants to have done before
    the workshop.

    +   - **Workshop agenda**: A lean workshop agenda will keep focus. A workshop
    agenda should include the following:

    +     - **Welcome and introduction**: The facilitator welcomes the participants,
    introduces the agenda and goal, and the participants introduce themselves.

    +     - **Workshop goal**: The goal of the workshop should be shared upfront to
    make sure the participants understand when the facilitator(s) may interrupt a
    discussion that is steering off course. Be transparent here to build trust; you
    are seeking the expert knowledge of the participants to be able to shape the CRM
    system of your company’s future. Share the vision statement you crafted in *Chapter
    1, Creating a Vision for Your Salesforce Project*.

    +     - **Parking lot**: This is a common and great workshop technique. Let participants
    know upfront that any topics not related to the goal of the workshop will be captured
    in the parking lot for review at the end of the workshop.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   - **Ground rules:** Ask the workshop participants to suggest ground rules
    for how to interact during the workshop. Share an initial suggestion, such as
    “all participants should feel empowered to be honest about their experiences.”

    +   - **Icebreaker(s):** Set aside time for icebreakers to get the group comfortable
    sharing and interacting.

    +   - **Breaks:** Set aside time for short 10-minute breaks every 45-60 minutes,
    depending on the nature of the exercise agenda. If you have just had break-out
    sessions of 30 minutes followed by 30 minutes of group sessions and presentations,
    you can opt for 60 minutes between breaks. If your workshop is virtual, be sure
    to stick to 45-minute breaks.

    +   - **Exercises:** Divide the overall goal into smaller exercises. For example,
    use the first exercise to determine the current **mid-level process** and identify
    the **actors** involved. Next, identify what systems and data are used in each
    process step. This first part could – if effectively led – be done over the course
    of a few hours, including breaks. Then, spend the second part of the workshop
    gathering input for what could be improved, what process steps are particularly
    cumbersome, and what ideas the participants have.

    +   - **Workshop closure:** Round the workshop off by thanking the participants
    for their input, recap the output of the workshop, and review any items captured
    for the parking lot.

    +   - **Workshop roles:** A good workshop has a few key roles, some of which may
    be the same person:

    +     - **Lead facilitator:** Leads the participants through the exercises, mediates
    if individuals disagree, and keeps the group moving forward. If you will not be
    facilitating the workshop yourself, make sure an experienced lead workshop facilitator
    is assigned and thoroughly briefed beforehand.

    +     - **Co-facilitator:** Supports the lead facilitator. It’s great to divide
    the facilitation work if multiple sub-groups need to work in parallel on'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'exercises.


    +   - **Scribe**: Someone should take notes throughout the workshop – at least
    in the group sessions. If you have two people facilitating, one could be a scribe
    if you are not able to have a dedicated scribe and timekeeper resource.

    +   - **Timekeeper**: Make sure you stay on track and are able to complete the
    planned agenda by assigning a timekeeper to state when there are 15, 10, and 2
    minutes left in each exercise.

    +   - **Workshop products**: The output of the workshop are the workshop products.
    These are the gems of knowledge you have been seeking to uncover by having the
    workshop. Here is a brief description of key workshop products you should seek
    to produce:

    +     - **Actors**: Identified actors (end user groups) involved in the current
    business process.

    +     - **Processes**: These are the process maps created in the workshop along
    with various overlays – see the following points:

    +       - **Variations**: *Pay extremely close attention* throughout the workshop
    for any process variations identified. For each variation, identify which of the
    following applies:

    +         - The variation is *consistent* across all business lines or geographies.
    Note down these variations as **type-1 variations**.

    +         - The variation is *inconsistent* across business lines and geographies.
    Note down these variations as **type-2 variations**.

    +     - **Systems**: The list of systems the actors work in throughout the process.

    +     - **Variations**: Pay the same attention as for process variations to any
    *system* variations identified. Follow the same notation for variations identified.'
  merge: -1
  img_proc: true
