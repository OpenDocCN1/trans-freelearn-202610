- pgno: 286
  md: '# Part 4: The Continuous Improvement Phase


    This part will teach you how to transform your organization into a product organization.
    We’ll cover what you need to do to deliver **continuous improvement (CI)** for
    your users and organization to maximize the value derived from your Salesforce
    investments. We’ll also discuss common issues so you can avoid or mitigate them.


    This part has the following chapters:


    +   - *Chapter 12*, Evolving Your Salesforce Org and DevOps Capabilities

    +   - *Chapter 13*, Managing Your Salesforce Data to Harvest the Fruits of Customer
    360

    +   - *Chapter 14*, Common Issues to Avoid in the Continuous Improvement Phase'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Evolving Your Salesforce Org and DevOps Capabilities


    Following the roll-out of your Salesforce solution in the previous chapters, in
    this first chapter in *Part 4, The Continuous Improvement Phase*, of your Salesforce
    program, you will be guided through the nature of and activities in the continuous
    improvement phase. Then, we’ll go through the concept of product organizations
    and why it matters for the success of your Salesforce program. Next, we’ll cover
    program and platform governance in the continuous improvement phase. Finally,
    we’ll introduce DevOps and how to evolve your Salesforce **DevOps** capabilities.


    By the end of the chapter, you will understand the key activities in the continuous
    improvement phase. You will learn why you should aspire to become a product organization,
    and how you can start the **transformation** of your organization. After reading
    this and applying the concepts, you will be able to update and maintain your Salesforce
    roadmap and manage technical debt on your Salesforce platform. You’ll be able
    to enhance your Salesforce DevOps capabilities to be successful in the continuous
    improvement phase of your Salesforce program.


    In this chapter, we’ll cover the following main topics:


    +   - An overview of the continuous improvement phase

    +   - Transforming your organization to become a product organization

    +   - Governing your Salesforce program and platform

    +   - Evolving your Salesforce DevOps capabilities


    Let’s go!'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# An overview of the continuous improvement phase


    This phase of the Salesforce program begins the moment you go live with your first
    users, as illustrated in Figure 12.1, and it doesn’t end (unless your organization
    decides to stop using Salesforce).


    ![](img/307881206539c45e128c538a4b6912f8_288_0.png)


    Figure 12.1 – Continuous improvement concurrent with roll-out


    We can summarize the key continuous activities as follows:


    +   - Transforming your organization to become a product organization

    +   - Governing your Salesforce program and platform

    +   - Evolving your Salesforce DevOps capabilities

    +   - Managing and governing the quality of your data

    +   - Leveraging your C360 data to maximize your Salesforce investments

    +   - Leading and inspiring the peers in your organization


    The last three topics will be covered in the next chapter.


    Let’s get started with product organizations.


    # Transforming your organization to become a product organization'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'In the last decade, digital transformation initiatives – recently accelerated
    by the COVID-19 pandemic – have become ubiquitous throughout medium and large
    organizations. Literature is quick to point to the failure rate of these initiatives
    – the reasons cited often being a lack of user involvement, cross-functional coordination,
    executive commitment, and strategic alignment. Most of these areas are addressed
    by the **product organization**.


    The concept of **product management** originated from Procter & Gamble, where
    Neil McElroy wrote a memo requesting to hire people and structure them around
    a single product or brand. The ultimate responsibility of *brand men* would be
    to manage the product life cycle, sales, and promotions – supported by field testing
    and customer interaction. Many additional and complementary concepts, theories,
    and practices have emerged since then, including Kanban (1940s), Kaizen (post-World
    War II), The Agile Manifesto (2001), DevOps (2007), and Lean Startup (2011).


    # Tip


    If the concepts of digital product management and product organizations are entirely
    new to you, you can start your learning journey by reading *The Lean Startup*
    by Eric Ries and *Inspired: How to Create Tech Products Customers Love* by Marty
    Cagan.


    That’s all great, but how does it all relate to a modern, tech product organization?
    Let’s start with some definitions.


    A product organization is an organization that is constantly trying to improve
    its product offerings, which are comprised of features to provide benefits to
    its customers.


    Let’s translate this to a Salesforce program context:


    It is an organization that is constantly trying to improve its Salesforce solutions
    to provide value to its Salesforce users (employees, customers, and partners).


    According to the **agile maturity model** in *Open Agile Architecture* – a standard
    of **the Open Group**, which you can check out at'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'https://pubs.opengroup.org/architecture/o-aa-standard-single/ – an organization
    cannot progress to the higher levels of agile maturity without adopting the traits
    and practices of product-led organizations.


    # Important note


    While a lot of literature primarily focuses on building great products for external
    customers, the concept and practices of a product organization can easily be translated
    to building Salesforce products for your external customers and partners, as well
    as all your internal users.


    Let’s start by identifying your Salesforce platform’s products.


    # Understanding your products


    Digital products are vehicles to deliver value. That may seem vague and abstract,
    which is why many organizations struggle to define their products, as illustrated
    by Figure 12.2:


    ![](img/307881206539c45e128c538a4b6912f8_290_0.png)


    Figure 12.2 – Comic Agile #218 – the product organization'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Jokes aside, what specifically your organization’s *Salesforce products* are
    depends on the nature of your organization, users, customers, and partners.


    Let’s see an example of *products* built on the Salesforce *platform* for PME’s
    *customers*:


    +   - A Salesforce *app* for PME’s *sales reps*

    +   - A Salesforce *app* for PME’s *customer service reps*

    +   - A **Commerce Cloud** *storefront* with self-service functionality for PME’s
    *customers* to place orders and log cases

    +   - A Salesforce **Experience Cloud** *site* for *distributors* to collaborate
    with PME on leads and opportunities


    Next, let’s get aligned.


    # Aligning the vision, strategy, and ownership of your Salesforce platform


    The good news is that if the development and roll-out of your initial Salesforce
    release have been similar to what is described in the previous sections of this
    book, then you have already *done* parts of what it takes to *act* as a product
    organization. You assigned and enabled a **product owner** to own the product
    you offer to your users.


    Now, *doing* and *acting* as a product organization is not the same as *being*
    a product organization – the transformation spans multiple dimensions, including
    the following key ingredients:


    +   - Deep and continuously growing *insights* into your Salesforce users’ pain
    points and needs, and what products (Salesforce solutions) you are offering them
    to make their life easier and more productive

    +   - *Organizational alignment* to transform from a project-based organization
    to a product organization, which includes the following:'
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   - Aligning your business strategy to your Salesforce platform and product
    strategy.

    +   - Transforming your funding model *from* funding projects (statements of work)
    *to* funding **cross-functional product teams** that continuously deliver incremental
    value. This critically includes tying funding to a product owner mandate to prioritize
    roadmap items – derived from a fine balance between user insights and the strategic
    intent of your organization.

    +   - Stakeholder buy-in and involvement in your Salesforce product roadmap.

    +   - Maturing your Salesforce platform governance structure, driven by your Salesforce
    **Center of Excellence (CoE)**

    +   - Redefining your (IT) **operating model** and enhancing your Salesforce DevOps
    capabilities


    With your platform and product vision, strategy, and ownership aligned, let’s
    set some goals.


    # Setting goals for your Salesforce platform and products


    Salesforce is a broad suite of SaaS clouds and add-ons, as well as a PaaS. This
    means you can extend and enhance the **out-of-the-box (OOTB)** functionality and
    apps – and build your own.


    For most organizations, investing in Salesforce is a strategic decision to unify
    and consolidate into one CRM platform. Their vision is rarely for their Salesforce
    platform to serve just a single user group with one solution (cloud, product,
    or app); rather, it is to be a **strategic platform** with multiple products for
    multiple user groups.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'If that’s also the goal for your organization, this means you need to consider
    and align your vision and strategy at both the Salesforce *platform* and *product*
    levels.


    # Tip


    If your organization’s vision and strategy aren’t crystal clear for you, engage
    with the sponsor of your Salesforce program. You can also recap *Chapter 1, Creating
    a Vision for Your Salesforce Project*, for methods and inspiration to go about
    determining a vision for your Salesforce program and platform.


    With your Salesforce platform and product strategy aligned, you need to set **product
    goals** for your Salesforce platform and products.


    If you have multiple products with different product owners, you should define
    product goals at the Salesforce platform level and for each product domain – for
    example, sales, customer service, field service, commerce, and digital marketing.


    # Important note


    **Organizing in cross-functional agile teams** – an agile team needs to have one,
    and only one, PO, and one agile team only has one backlog. A developer (functional
    or programmatic) should only be a member of one agile team (scrum masters and
    QA specialists can potentially serve up to two teams). The reason is simple; if
    a developer is part of multiple agile teams – with different POs – the question
    arises of how the developer should decide which product backlog to work on. Solving
    that puzzle would require inefficient inter-team planning between scrum masters
    to determine capacity allocation for each team, not to mention the inherent inefficiency
    caused by the daily context-switching of the developer.


    Platform and product goals serve the purpose of helping guide your teams to prioritize
    what to build next.


    # Important note'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Although, in this section, we have been discussing organizational transformation
    to become a product organization, you can – if the concept of a product organization
    is completely new to your organization – opt to start with your Salesforce program
    and platform to lead the way for your organization.


    Beware of potential resistance, and spend a lot of time engaging, discussing,
    and sharing the concepts with your stakeholders to get them on board. Your Salesforce
    program sponsor needs to be intimately involved in the process.


    In this section, you have learned about product organizations, how to go about
    transforming to become one, and how to align your organization’s strategy to your
    Salesforce platform strategy and vision. Let’s cover governance in the continuous
    improvement phase and how creating a roadmap ties into your strategy and product
    goals.


    # Governing your Salesforce program and platform


    With many changes happening to your Salesforce program and the platform to serve
    your organization, having solid governance in place is key for stability and growth.


    Let’s begin by looking at your Salesforce CoE role in the governance of your Salesforce
    program and platform.


    # Updating your Salesforce CoE


    Your Salesforce CoE is still the overarching governance body responsible for overseeing
    your Salesforce program. It consolidates knowledge, guidelines for ways of working,
    and change management, and manages the governance structures and forums for business,
    technical, and data governance.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'The key leadership roles in your Salesforce CoE in the continuous improvement
    phase are as follows:


    +   - **Salesforce platform owner**: This is the owner and overall accountable
    for your Salesforce platform, and its roadmap:

    +     - Some organizations also refer to this role as **chief product owner**
    or **product manager**. If your Salesforce platform offers multiple distinct solutions
    to different user groups, you may have different product owners of those products:

    +       - Although you may have multiple products, you can group them by domain
    or capability to simplify ownership and product management structure.


    # Important note


    It is critical that you tie the program, platform, and product funding mandate
    directly to the platform and product owner(s) to empower them and materialize
    ownership.


    You may think such a mandate is only to be given to senior leaders within your
    organizations – and you would be absolutely right. The Salesforce platform and
    product owner are indeed senior positions suitable for a senior, experienced professional.


    +   - **Salesforce platform architect**: They are responsible for the architecture
    vision of your Salesforce *platform*, as well as your Salesforce organization’s
    performance, reliability, security, and flexibility.

    +   - **Salesforce program owner**: They are responsible for organizing and structuring
    your Salesforce program, resourcing and budgeting, and facilitating governance
    forums.'
  merge: -1
