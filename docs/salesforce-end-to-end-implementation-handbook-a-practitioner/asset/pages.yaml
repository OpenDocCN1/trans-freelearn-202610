  md: '+   - Poorly governed solutions that have been extended beyond what they were
    intended and suitable for


    What you can do about it is a combination of *prevention* and *alleviation*:


    +   - Your PO should initially review and qualify bugs and new feature requests.
    If it’s not a valid bug (a broken feature) or a new request aligned with your
    product goals, no solution for it should be implemented.

    +   - Implement a design authority to review proposed solution designs before
    development can commence.

    +   - Ensure development guidelines are in place, communicated, understood, and
    used. They should also be continuously updated and refined.


    +   - Require agile product team members to explicitly state the required maintenance
    effort for their proposed solutions on the backlog item for review. Challenge
    solutions and the corresponding business requirements that require maintenance
    – or where the section is missing altogether.

    +   - Allocate 15%-25% of the PI or sprint capacity for continuous refactoring.
    This could either be by including refactoring backlog items in sprints, or by
    having a dedicated “refactoring” sprint at the end of each program increment.
    While the latter is less DevOps-friendly, it is sometimes easier to grasp, manage,
