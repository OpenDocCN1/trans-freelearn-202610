- pgno: 184
  md: '+   - Using story points is suitable for projects where less effort has been
    made up front to do user-story-level solution design.


    After estimating your development effort, let’s move on to creating your development
    plan.


    # Drafting your tentative development plan


    Assuming you have a budget and a deadline for your project, you need a plan for
    your development to know how you will respect them.


    Once you have each user story estimated, and thus each epic, you need to consider
    your available development capacity. This is the amount of time your functional
    consultants and developers have available for development tasks. You need to be
    mindful of the development estimates by development type. Next, you need to factor
    in time for agile ceremonies and possible backlog refinement, for which – although
    they are important sessions – the time is not available for development. The difference
    is referred to as sprint efficiency and is typically between 50% and 70% depending
    on your chosen delivery methodology and hence, the degree of upfront user story
    definition, detailing and providing solutions.


    # Tip


    As a general rule of thumb, you shouldn’t fill up more than ~85% of your agile
    development team’s net development sprint capacity (after applying sprint efficiency).
    The reason being when you progress through sprints – and see your solution come
    to life – you will be inspired to do more things or to modify a process that made
    sense in workshops but isn’t ideal for users after all.


    If the development capacity (resources) available in your project doesn’t match
    your total estimated effort or timeline, you have three options:'
