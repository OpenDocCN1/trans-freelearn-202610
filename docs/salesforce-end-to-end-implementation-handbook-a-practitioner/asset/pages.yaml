- pgno: 152
  md: '# Detailing the Scope and Design of Your Initial Release


    Following the hard work, you did in *Part 1, The Pre-Development Phase*, this
    first chapter in the **development phase** of your Salesforce project will guide
    you through key activities and milestones. Next, we cover how you break down the
    high-level scope you defined in the pre-development phase into **user stories**.
    Then, we will cover how to determine an appropriate level of upfront architecture,
    and what **Salesforce architecture artifacts** you should create. Finally, we’ll
    discuss how to understand user story solution design and illustrate your **target
    solution architecture**.


    The chapter provides best practices for creating user stories to maximize the
    chance of developing the *right* solution for your business. We describe which
    solution design artifacts you should create and maintain throughout the development
    phase of your Salesforce project, and beyond!


    In this chapter, we’ll cover the following main topics:


    +   - Overview of your Salesforce project in the development phase

    +   - Detailing the scope of your initial release

    +   - Creating the solution design for your initial release


    Let’s go!


    # Overview of the development phase of your Salesforce project


    This phase of your Salesforce project is the one architects, business analysts,
    project managers, scrum masters, and developers are most familiar'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'with. The focus is on detailing requirements, designing solutions, and building
    and testing them.


    Let’s take a look at the milestones of the phase.


    # Key activities and milestones of the development phase


    The phase starts at **project kickoff** where the project manager, business leaders,
    architects, and project sponsor introduce the project vision and nature to the
    project team members onboarded at this point.


    After the project kickoff, the next key milestones in the development phase are
    as follows:


    +   - Detailing the scope of your release

    +   - Completing the solution design of your release


    Note


    The activities to reach the first two milestones are sometimes referred to as
    the **prepare phase**, as the project is preparing to start building the solution.


    +   - Establishing your team’s development process

    +   - Completing the build and testing of your release

    +   - Creating your data migration plan

    +   - Detailing your initial roll-out, training, and change management plan


    Tip


    If you have chosen a pure agile delivery methodology for your project, you will
    find inspiration for your setup in *Chapter 12*, *Evolving Your Salesforce Org
    and DevOps Capabilities*.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Having established *what* the overall milestones and activities consist of
    in the development phase, let’s look at *how long* your development phase may
    take.


    # Duration of the development phase


    Depending on the following main factors, the development phase of your Salesforce
    project may take anywhere between *a few weeks to many months* to complete:


    +   - The scope of your Salesforce project

    +   - Your chosen delivery methodology:

    +     - **Pure agile**: You’ll be releasing working software to production on
    demand when features are developed

    +     - **Pure waterfall**: You deploy your release at the end of the project
    when the release has passed user acceptance testing

    +     - **Hybrid**: You may either be releasing as per the pure agile or pure
    waterfall delivery methodology

    +   - Allocated and available resources:

    +     - **Business resources**: This includes a dedicated **product owner (PO)**
    to own and gather the requirements, and validate the delivery of functionality.
    The availability, dedication, experience, and competence of the PO all have a
    major impact on the project.

    +     - **Technical resources**: These are architects, functional Salesforce consultants,
    Salesforce developers, and QA specialists (testers), as well as other technical
    resources that may need to make changes to the systems to be integrated with Salesforce.
    The coordination and timing of the availability of the required resources is a
    key task to optimize the project delivery.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Tip


    Unless your project is a greenfield implementation – meaning it’s the first time
    your company will use Salesforce – you should *limit the prepare phase* to a maximum
    of a few months for larger projects (for example, new clouds such as Field Service
    or major products such as CPQ) to ensure requirements input and target processes
    are still relevant.


    For the sake of simplicity, this section of the book will focus on a *hybrid agile
    delivery methodology* in which some activities are done to detail the scope of
    the Salesforce project and create upfront architecture before starting the build
    phase.


    # Important note


    The milestones and activities after project kickoff will either happen in sprints
    (pure agile), stages (waterfall), or a mix (hybrid agile).


    To refresh the differences, please see *Figure 3.2* in *Chapter 3*, *Determining
    How to Deliver Your Salesforce Project*.


    Let’s see who will be overseeing your Salesforce project.


    # The role of your Salesforce CoE in the development phase


    Recall the *Salesforce taskforce* that you were encouraged to establish to drive
    the activities in the pre-development phase. It included resources from three
    key areas of your company: business, technical, and project management office.
    *You* likely reside in one of these functions.


    Your Salesforce taskforce has established the capabilities and Salesforce clouds
    in the scope of your project – and secured a budget for at least the initial release.
    Your Salesforce taskforce has also contracted with an implementation partner to
    support delivering the initial release.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Your Salesforce taskforce shouldn’t be shut down after the pre-development
    phase, rather it should evolve into your Salesforce **Center of Excellence (CoE)**.
    The members of your Salesforce CoE are well suited for *governing the delivery
    of your initial release*.


    In *Chapter 3*, *Determining How to Deliver Your Salesforce Project*, you envisioned
    the structure and responsibilities of your Salesforce CoE. Now it is time to execute
    and establish it.


    The next activity – in the hybrid delivery methodology – is to break down the
    business capabilities into smaller backlog items that your implementation partner’s
    developers and functional consultants can consume and deliver working solutions
    for.


    # Detailing the scope of your initial release


    Your project’s next endeavor consists of translating the vision and capabilities
    – business processes – into product backlog items. Breaking down the business
    capabilities into smaller backlog items requires you to involve the end users
    of your Salesforce solution through a series of workshops.


    In *Chapter 3*, *Determining How to Deliver Your Salesforce Project*, we discussed
    the three overall delivery methodologies to choose from – *pure waterfall*, *hybrid
    agile*, and *pure agile*.


    As we are covering a hybrid agile delivery methodology in this section, let’s
    consider the activities to prepare for development:


    +   - An effort is made to establish foundational architecture including – but
    not limited to – determining a Salesforce org strategy, integration, data migration,
    data backup and archival, and reporting strategy, as well as a development and
    environment strategy'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   - Detail the business processes (the customer and user journeys), in the
    scope of your project, and create a solution design for it


    # Tip


    In hybrid agile – after establishing the foundational architecture – you can opt
    to detail all processes in the scope of your project – along with solutions and
    estimates. Alternatively, you can decide to detail a sufficient number of backlog
    items to fill the first couple of sprints, and, concurrently with the sprint development
    team, dedicate resources to continuous backlog refinement in a parallel design
    stream.


    Let’s get started detailing your company’s future business processes.


    # Co-creating your future business processes


    You may recall the activities in Chapter 2, Defining the Nature of Your Salesforce
    Project, where you facilitated workshops to determine current capabilities, their
    processes, and the current pain points and suggestions from the stakeholders.


    Whereas the purpose of those workshops was to determine and understand current
    processes, it is the purpose of the workshops in the development phase to create
    future processes supported by Salesforce.


    Plan and facilitate workshops for each of the capabilities – processes – in the
    scope of your initial release. Review the workshop structure proposed in Chapter
    2, Defining the Nature of Your Salesforce Project, but follow this proposed agenda:


    +   - **Welcome and introduction:** The facilitator welcomes the participants
    and introduces the agenda and goal, and the participants introduce themselves:'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - **Workshop goal**: Share the vision statement you crafted in *Chapter
    1, Creating a Vision for Your Salesforce Project*

    +     - You are seeking your participant’s valuable input to shape your company''s
    future CRM system

    +   - **Exercises**: Divide the overall workshop goal into smaller exercises divided
    by adequate breaks:

    +     - **First exercise**: Review the current process as you defined in *Chapter
    2, Defining the Nature of Your Salesforce Project*, and review the pain points
    and suggestions for improvement:

    +       - This approach – while valuable in itself – has the added benefit of
    creating a sense of urgency and sparking the desire for change

    +     - **Second exercise**: It’s time to start with a clean slate and begin co-creating
    the to-be processes. This can be daunting – staring at the blank canvas as a group.
    Here are a few methods to help you get started:

    +       - Determine the start and finish of the overall business process by briefly
    discussing what has happened before the starting point of the process, and what
    will happen after the finishing point.

    +       - State the over arching phases in the process: for example, creation,
    assignment, execution, and post-execution.

    +       - Create **swim lanes** by determining what **personas** are part of the
    business process – you may reuse the personas you determined for your current
    process.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Tip


    Keep the goal and focus of the workshop in mind, and guide your participants so
    they don’t get stuck overanalyzing minute details of each process step.


    +   - As mentioned earlier, pay *extreme attention to variations*. If your solution
    is to be used by multiple regions and/or lines of business, be sure to include
    stakeholders from each – where practically possible – if it is the ambition of
    the Salesforce project to harmonize business processes.


    # Tip


    Ensure you align with your implementation partner before designing the workshops
    to determine each party’s roles and responsibilities to maximize the output of
    the workshops. If you are working with an implementation partner, they should
    be able to provide experienced business analysts and/or architects to facilitate
    and drive the workshops.


    Depending on the scope and nature of the business capabilities in the scope of
    your Salesforce project, an experienced **Salesforce business analyst** may suffice
    to support your business stakeholders in co-creating your future business processes
    supported by Salesforce. For greenfield implementations, and for more complex
    implementations, be sure to include a **Salesforce solution architect** in the
    workshops. Their input and experience will make sure the proposed processes make
    sense from a Salesforce perspective.


    Let’s look at the next steps after each workshop.


    # Crafting user stories


    Following each workshop, your PO or your implementation partner will use the co-created
    future business processes to create backlog items, also known as **user stories**
    for each epic or business process.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'A user story should be an easy-to-understand sentence describing – from a *user’s
    perspective* – *what* they want to be able to do and *why*. Let’s break it down:


    +   - **Persona**: They may be internal or external persons who are part of the
    business process:

    +     - Internal persona examples: An employee in a specific function

    +     - External persona examples: A customer, partner, or supplier

    +   - **Need**: What does the persona want to be able to do in the process step?

    +   - **Purpose**: What business outcome does this achieve?

    +   - Be mindful that the purpose should tie back to the overall business objectives
    of the project. The purpose of a user story *is not* merely to be able to proceed
    to the next step in the business process.


    A user story should be written for each step in your business process.


    Some considerations to keep in mind when writing user stories are as follows:


    +   - They should not be written in Salesforce-specific language, rather it should
    be technology and system agnostic

    +   - They should focus on the business need, problem, and desired business outcomes,
    and not describe a desired solution


    Sticking to the preceding advice will ensure the expert consultants at your implementation
    partner seek to find the best solution for your business.


    # Important note'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Ensure that a PO is allocated to own each domain of your Salesforce solution.
    If a single business stakeholder does not represent all business domains in the
    scope of your solution, you can consider either promoting one to own all domains
    or allocating multiple POs responsible for different domains. Be vigilant about
    this decision, as you will need to have an assigned **chief PO** to make final
    decisions in case requirements from two POs are contradictive or overlapping.


    # Reviewing and detailing user stories


    Your PO *reviews all user stories* for the business processes they own.


    While the goal of the workshop was to ensure that the end-to-end business process
    for the capability is sound, lean, and logical, and one which will drive great
    user and customer experience, the goal at this stage is to ensure that the details
    and context of each user story are aligned and documented. As such, the PO should
    do the following:


    +   - **Review** the proposed user stories’ *user*, *need*, and *purpose*, and
    make required modifications.

    +   - Add **further context** to help other business stakeholders understand the
    situation from the persona’s perspective in the process step. This may include
    additional descriptions, documents, screenshots, lists, or other media.

    +   - While it may not be strictly required in pure agile, adding *short and simple*
    **acceptance criteria** statements to user stories is strongly recommended for
    three key reasons:

    +     - It enables each user story to be tied to the desired business outcomes
    of the epics included in your Salesforce project.

    +     - It provides clarity for other business stakeholders as to what the scope
    is for the user stories – and what is not. If it’s not a part of the acceptance
    criteria, it’s not in the scope.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   - It guides the implementation partner’s solution architect and developers
    to understand the expected outcome of the user story.


    The value in having your PO – and possibly a wider business stakeholder group
    – review and detail user stories are plentiful:


    +   - **Consolidates process ownership:** Having a dedicated PO who owns a business
    process is essential. It is a prerequisite, especially if variations exist in
    your current business processes and your future processes need to be harmonized
    amongst geographies and lines of business as part of your Salesforce project.

    +   - **Lowers cost by “shifting left”:** Ensuring business alignment and clarity
    early will save you money – conversely, the further down the development pipeline
    you fix an issue, the greater the cost:

    +     - If a piece of functionality is rejected later in UAT or, worse yet, not
    adopted by end users in production, it will carry a huge cost to rectify due to
    all the steps and people involved in getting a piece of functionality through
    the pipeline (specification, solutioning, testing, and deploying).

    +   - **Embeds change management in the development process:**

    +     - Recruiting and involving change agents in process co-creation workshops
    as well as validating acceptance criteria is an excellent strategy to continuously
    lay the groundwork for change management

    +     - Including end users early and often reduces the change management effort
    and pressure in later stages, such as UAT and training

    +     - Tightly related to the previous point, acceptance criteria can – when
    aggregated – form the basis for user acceptance testing'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Tip


    Capture user stories in fit-for-purpose tools. **Atlassian JIRA** and **Microsoft
    Azure DevOps** are the most commonly used tools for Salesforce projects. Simpler
    alternatives exist, including **Trello**, although with less functionality and
    suitability for enterprise Salesforce projects.


    Organizations with less experience with agile or hybrid agile methodologies often
    struggle with the mindset change from traditional waterfall projects. Being used
    to creating a giant **business requirements document** is fundamentally different
    from creating user stories with acceptance criteria.


    While most project team members get the hang of it after some time and practice
    – and guidance from implementation partners – investing in training courses or
    self-directed learning accelerates the process and delivers higher-quality user
    stories with better solutions and adoption rates.


    # Tip


    For more information, you can refer to the *Salesforce Business Analyst Handbook*
    (https://www.amazon.com/Salesforce-Business-Analyst-Handbook-techniques/dp/1801813426)
    by Srini Munagavalasa.


    As user stories are reviewed and detailed, let’s begin solutioning.


    # Creating the solution design for your initial release


    The user stories created for the business processes collectively define the scope
    of your Salesforce project. Although the solutions for each user story collectively
    make up your technical solution, you will benefit from *considering your overall
    and end-to-end architecture* to some degree before starting development.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Let’s start by looking at the architecture artifacts and components you should
    have create and maintain as part of your project – and beyond!


    # Understanding Salesforce architecture artifacts


    Governing the documentation for your solution is a key responsibility of the Salesforce
    CoE.


    While the source of the documentation components may be your implementation partner,
    it is your Salesforce CoE’s responsibility to ensure that the solution documentation
    is available, up to date, and understandable for the intended audiences – both
    business and technical stakeholders.


    Let’s take a look at the key artifacts for your Salesforce solution:


    +   - **Business capability map**: You created this in *Chapter 2, Defining the
    Nature of Your Salesforce Project*, but circumstances may have changed since then,
    so go ahead and update your business capability map to reflect the scope of your
    Salesforce project. This diagram will introduce the audience to the overall scope
    of your solution.

    +   - **Business processes diagrams**: You made these earlier in this chapter
    in the *Co-creating your future business processes* section.

    +   - **Actor and licenses diagram**: Show which actors (persona) will use or
    interact with your Salesforce solution. Highlight which actors are internal and
    which are external, as well as which Salesforce user license their users will
    have.

    +   - **Target system landscape**: This diagram illustrates the Salesforce clouds
    and AppExchange apps used within Salesforce, and critically, how Salesforce is
    connected to other systems in your enterprise system landscape. Each interface
    in the scope of your solution should be labeled, as well as the direction.

    +   - **Integration**: To supplement the system landscape diagram, you should
    have a table describing the integrations in the scope of your solutions,'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'including the following:


    +   - **Direction**: What system is the source and target for each interface,
    or whether it is a bi-directional interface.

    +   - **Layer**: Whether the integration is a data, process, or virtual integration.

    +   - **Timing**: Whether the integration is synchronous (blocking) or asynchronous
    (non-blocking or queued).

    +   - **Pattern**: The pattern for the integration. **Remote-process invocation
    fire-and-forget (RPI-FF)**, **batch data synchronization (BDS)**, and **data virtualization
    (DV)** are examples of standard integration patterns on the Salesforce platform.

    +   - **Authentication**: How each interface will gain access to the target system.

    +   - **Data model**: You critically need to create and maintain the data model
    for your Salesforce solution. The data model is a graphical representation of
    the objects and fields used in your Salesforce solution. Many objects and fields
    come **out of the box (OOTB)** with your Salesforce licenses, but you will extend
    that data model with your own custom fields and likely some custom objects as
    well:

    +     - **Object list**: To complement your data model, it is good practice to
    maintain an object list detailing the use of each object. Include the following
    attributes for each object: object name, standard/custom, what entities the object
    will hold, record types, record owner, org-wide default (internal and external),
    and volume estimate.

    +     - **Data security matrix**: State the object permissions (read, create,
    edit, and delete) for each object, profile, and persona.

    +     - **Data dictionary**: It is good practice to create and maintain a dictionary
    for all the fields used in your solution. Your data dictionary is valuable for
    integration architects and developers, as well as business users, who will find
    it useful when creating reports.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '+   - **Sharing model:** You should describe what mechanisms will be used to
    grant the right users the right access to the right records. The **role hierarchy**
    is an integral part of your sharing model and is complemented by a vast number
    of options to share data.

    +   - **Data backup and archival:** You will benefit later by already considering
    and deciding how to back up your data in Salesforce in case you need to restore
    it – and how (which tool) you plan to use for it. Determining your data archival
    policy and method by object should also be done at this stage to prevent you from
    hitting storage limits unexpectedly.

    +   - **Environment and development strategy:** The environment overview diagram
    should describe which Salesforce development environments (sandboxes) will be
    used in the development and deployment of your solution, as well as the tools
    used to migrate metadata and data between environments.


    While the input for creating some of the architecture artifacts is the output
    of the workshops where you co-created future processes, determining other aspects
    of your architecture requires separate workshops with a mix of technical and business
    stakeholders. These aspects include system landscape, integration, sharing model,
    environment, and development strategy.


    Tip!


    To understand in depth the technical architecture artifacts briefly described,
    you should read the *Becoming a Salesforce Certified Technical Architect* book,
    written by a Salesforce **Certified Technical Architect (CTA)**, Tameem Bahri.


    If your company has a diagramming framework, use that. If not, you can either
    use Salesforce’s diagramming framework (https://architect.salesforce.com/diagrams#framework)
    yourself or require your implementation partner to adopt it.


    Tip'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Salesforce provides templates for many of the Salesforce cloud data models
    and **industry reference architecture templates**, which are freely available
    to use in **LucidChart** or MS PowerPoint format at https://architect.salesforce.com/diagrams#design-patterns.


    Let’s move on to discuss what level of *initial* architecture makes sense to establish
    for your Salesforce project.


    # Determining the appropriate level of upfront architecture


    If you have chosen hybrid agile as the delivery methodology for your Salesforce
    project, you have a key decision to make:


    > “How much effort should my project allocate to architect my Salesforce solution
    before starting development?”


    You need to consider *two levels* of solution design: overall technical architecture,
    which we described in the previous sections, and the user story level. You should
    expect your implementation partner to provide solution design at both levels.


    Let’s jump right in and look at some of the benefits of creating architecture
    upfront:


    +   - Ensures the end-to-end architecture is cohesive and comprehensive and establishes
    the *technical foundation* to ensure your Salesforce solution can be secure, performant,
    and scalable

    +   - Identifies technical issues and gaps that can be handled and mitigated proactively

    +   - Guides the development team and provides guard rails

    +   - Increases **development velocity** through higher **sprint efficiency**
    because your team members don''t have to spend time creating solution designs
    in a sprint'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'If you don’t establish any architecture before starting development, you simply
    won’t have those benefits – and critically, you won’t know the gaps and risks,
    and as a result, you can expect to hit many obstacles when building your solution.


    The goal of your Salesforce project’s prepare phase is to establish stakeholder
    alignment and to create just enough **architectural runway** for the development
    team to be able to start sprinting.


    # Important note


    You should expect your implementation partner to make a recommendation for what
    level of architecture to determine upfront for your specific project. The contract
