    After you’ve created your development plan, let’s get your development life cycle
    and deployment process set up.


    # Setting up your development model and environments


    The **development model** and environments are part of your **deployment model**.
    Deployment means moving the technical components of your solution from one environment
    to another and eventually to production. You use different environments – **sandboxes**
    – to perform different types of testing in your development life cycle. The purpose
    of this is to make sure your solution works end to end as intended when it reaches
    production.


    Let’s begin by looking under the hood of Salesforce.


    # Understanding the components of your Salesforce solution


    The products Salesforce offers, such as Sales Cloud and Service Cloud, are cloud-based
    **software-as-a-service (SaaS)** products. That means your Salesforce org – depending
    on the licenses you have bought – comes with standard objects and standard fields
    **out of the box (OOTB)**.


    Salesforce is also a **platform as a service (PaaS)**, which means you can extend,
    enhance, configure, and customize the OOTB components within Salesforce to fit
    your business needs and processes. This includes creating custom objects and fields
    and automation, configuring and customizing the **user interface (UI)**. You can
    also use the Salesforce platform to build custom apps and integrations. The configuration
    and customization capabilities that allow you to quickly configure and customize
    Salesforce to'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'fit your business needs are one of the things that makes Salesforce a powerful
    platform.


    To better understand the configuration and customization of your solution, we
    need to understand the underlying architecture of the core Salesforce platform,
    which is based on a **model-view-controller (MVC)** architecture.


    Let’s have a deeper look at what MVC consists of by seeing some examples:


    |  | Model (data structure) | View (UI) | Controller (logic) |

    |---|---|---|---|

    | OOTB components | Standard objects, standard fields, and standard picklist values
    | Standard apps, default page layouts, and Lightning record pages | Standard duplicate/matching
    rules and lead conversion |

    | Configuration components (no-code) | Custom objects and custom fields (including
