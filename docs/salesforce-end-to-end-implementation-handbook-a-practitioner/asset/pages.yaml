- pgno: 296
  md: '**Salesforce program sponsor**: This is the executive sponsor from your organization’s
    senior leadership who provides guidance and support.


    Revisit *Chapter 3*, *Determining How to Deliver Your Salesforce Project*, for
    foundational CoE setup.


    Managing, governing, and leveraging your Salesforce data will be covered in *Chapter
    13*, *Managing Your Salesforce Data to Harvest the Fruits of Customer 360*.


    Let’s look at your partner model.


    # Adjusting your partner model in the continuous improvement phase


    As you transition from the development and roll-out of your initial Salesforce
    release to the continuous improvement phase, there are a number of reasons why
    you should consider modifying your partner model:


    +   - **Capabilities**: The implementation partner of your initial release was
    qualified and capable to support you in the implementation of the technical scope
    of your MVP but does not cover the upcoming capabilities on your Salesforce roadmap:

    +     - This makes sense, as most implementation partners are capable of supporting
    the implementation of core Salesforce clouds such as Sales Cloud and Service Cloud,
    but not all are experts in products such as **Commerce Cloud**, **Mulesoft**,
    **Revenue Cloud (CPQ)**, **Field Service Lightning**, and **Marketing Cloud**

    +   - **In-house strategy**: It is common for organizations to have an in-house
    team to focus on Salesforce administration, user management, ongoing maintenance,
    support, and the development of change and new feature requests to *existing*
    currently supported capabilities:'
  merge: -1
  img_proc: true
- pgno: 297
  md: '+   - Few organizations have the scale for their in-house team to be able to
    cover all the preceding items, in addition to having the business and technical
    skills to be able to drive large initiatives, such as extending with new clouds
    for new user groups


    Next, consider which of the following areas you think is the most appropriate
    to be managed by your internal team, a partner, or a combination:


    +   - Basic user management and simple help desk tickets

    +   - Managing small change requests

    +   - System monitoring and evaluating Salesforce’s three releases per year

    +   - Agile product teams delivering new features

    +   - Technical design governance

    +   - Program management and mid-term planning

    +   - Change management and communication


    When determining this, consider whether or not each area is within your organization’s
    core competencies. If an area is not within a core competency, consider leveraging
    the expertise of a partner.


    With your Salesforce CoE and partner model squared away, let’s move on to your
    Salesforce roadmap.


    # Revisiting and maintaining your Salesforce roadmap


    Recall the roadmap you created in *Chapter 2, Defining the Nature of Your Salesforce
    Project*. The business owner in the pre-development phase of your Salesforce journey
    may have become the product owner in the development phase of your initial Salesforce
    implementation.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'What should they do after your initial release is developed and being rolled
    out? Go back to their old job? No! There is a great (and continuous) job to do
    to further improve and maximize value from your Salesforce platform and products
    for your users and organization.


    Here are some of the sources for the backlog items your platform owner and product
    owner(s) need to comprehend, consolidate, and ultimately prioritize:


    +   - **At the beginning of the continuous improvement phase of your Salesforce
    program** (shortly after the initial go-live of your first release), do the following:

    +     - Review the capabilities your organization originally considered for your
    Salesforce project:

    +       - If you have phased your Salesforce roll-out by scope – for example,
    by business domain (such as sales, service, and marketing) – you will have these
    as input for your roadmap

    +     - Items that were de-scoped in different phases of your initial implementation:

    +       - De-scoped epics and user stories in the upfront architecture phase

    +       - Feature or change requests captured in sprint demos and UAT in the development
    phase

    +       - Feature or change requests captured during training, and during hypercare
    of the roll-out phase

    +   - **Continuously improve your Salesforce products:** The sources of input
    for the continuous improvement of your Salesforce platform products include the
    following:'
  merge: -1
  img_proc: true
- pgno: 299
  md: '+   - Change requests from users

    +   - New feature requests from users

    +   - Changing strategy and priorities

    +   - Changing market conditions

    +   - Organizational changes

    +   - Technical innovation – with three releases per year for most Salesforce
    products, there are plenty of new features to consider taking advantage of (if
    they would add value to your users and organization); after all, you are paying
    for them


    What most organizations struggle with is translating new medium-to-large feature
    requests into new capabilities (epics) for their existing Salesforce *products*.
    This makes great sense – your organization is paying for licenses that include
    many OOTB functionalities that could be configured and customized to make work
    easier and more productive for your users. Moreover, as your users start to use
    Salesforce, they become invested in making it work to their advantage and, therefore,
    request more features.


    Make sure you have a structured process for listening, collecting, and evaluating
    feedback, as well as for communicating your decisions.


    # Tip


    Consider using a **product management system** that serves as the dedicated system
    of record for features for product managers (Salesforce platform and product owners)
    and helps them create and maintain roadmaps.


    Let’s look at how you can distinguish the nature of different product backlog
    item types:


    | Type | Product backlog item example | Decision-making model | Lead-time target
    |

    |------|------------------------------|-----------------------|------------------|

    | Theme | Requests for new Salesforce | Similar to the | One or more |'
