- pgno: 66
  md: 'Figure 2.5 – Business capability map for PME’s Salesforce solution


    *In addition to the imagined new business capabilities, PME – being a global company
    – identified the need to have a localized solution offered in multiple languages
    and supporting multiple currencies. PME is also keen on ensuring solid security,
    both in terms of user access to and in Salesforce, as well as what data they can
    access. PME also sees the value in regularly archiving and backing up data and
    files to comply with regulations and making sure the solution is scalable and
    performant, and ensuring business continuity. Finally, PME wants to ensure their
    solution can be used by their employees with disabilities – as well as by people
    with disabilities working for their customers.*


    *PME identified – through workshops with end users as well as engaging with a
    technical architect – what key systems and data sources are required to work in
    conjunction with the future Salesforce solution.*


    Having summarized the capabilities to be supported by your Salesforce solution,
    you are ready to move on to determining the high-level technical scope required
    for your Salesforce solution.


    # Determining the high-level technical scope of your Salesforce solution


    Until now, we have not spent a lot of energy on Salesforce features. That will
    change now as we progress to define the high-level technical scope of your Salesforce
    solution.


    You have defined the business capabilities to be supported by your Salesforce
    solution. Now it’s time to understand what **hypothetical technical scope** is
    needed to support the business capabilities. It is *hypothetical* at this stage
    because you will undoubtedly have many assumptions and uncertainties. As you progress
    through the chapters in the'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'pre-development phase, the technical scope will become firmer until you finally
    contract with Salesforce.


    # The high-level technical scope


    At this stage, determining the high-level hypothetical technical scope serves
    the following purposes:


    +   - Being able to estimate the **license cost** of the solution

    +   - Being able to request one or more potential implementation partners to provide
    an estimate for the **implementation cost** of the solution

    +   - Being able to estimate the *cost of the* **target operating model** to maintain
    and run your Salesforce org

    +   - Being able to understand the technical impact and reach on your company’s
    overall system landscape


    All of these purposes are key for the proceeding activities in the pre-development
    phase, business case modeling, as well as being a key part of an RFP document
    should you choose to engage with an implementation partner to take part in the
    delivery of your project. More on that in *Chapter 4, Securing Funding and Engaging
    with Salesforce and Implementation Partners.*


    Let’s start by understanding the different Salesforce license types.


    # Salesforce license types


    The first concept to grasp is the most wide-reaching and fundamental – let’s take
    a look at Salesforce org editions.


    # Org editions


    Salesforce *core* comes in four different **editions** for commercial use, with
    a fifth edition, **Developer**, for non-commercial use. For simplicity, let’s
    focus'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'on the four editions for commercial use as described at the following link:

    https://help.salesforce.com/s/articleView?id=sf.overview_edition.htm&type=5.


    The edition of your Salesforce org determines what features and services you have
    access to and is also the baseline for the cost of your **user licenses**.


    You will want to study the differences between the editions in detail and weigh
    them against your company’s requirements. If you’re planning to use Salesforce
    to support both sales and customer service, study the *Compare editions and top
    features* section at the following page:

    https://www.salesforce.com/editions-pricing/sales-and-service-cloud.


    The following are a few key points to consider when deciding on which edition
    to go for:


    +   - You can upgrade your edition, but you *cannot downgrade it*. As such, if
    you are on the fence about which edition to choose – as you may not yet understand
    exactly what the different features mean – opt for the lower edition.

    +   - If you are a medium or large company and planning to have multiple **actors**,
    use Salesforce across multiple business domains, automate your business processes,
    and integrate with other systems, you should consider choosing either the *Enterprise*
    or *Unlimited* edition.


    Tip!


    If you are unsure which edition to choose and have decided – at this stage – to
    assume a lower edition will suffice, add this to the assumption section in your
    RAID log as well as to the risk section with a *high-impact* categorization as
    the cost of upgrading will have a great financial impact.


    Let’s move on to explore Salesforce clouds.


    # Salesforce clouds and add-ons'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Salesforce (the company) offers a vast variety of products and features bundled
    by domain, called **clouds**. In *Figure 2.6*, you’ll see how Salesforce illustrates
    its products, collectively making up the brand name **Salesforce Customer 360.**


    Salesforce products range from *core CRM* products, such as **Sales Cloud**, **Service
    Cloud**, and **Experience Cloud**, to **marketing**, **commerce**, **integrations**,
    and **analytics.**


    Sales Cloud and Service Cloud are priced on a per-user basis whereas the other
    clouds have varying cost models. For example, for Marketing Cloud, the cost model
    is on a per-contact basis, whereas for Commerce Cloud, it is based per order.


    To extend core Salesforce, there is an abundance of **add-ons** for almost every
    conceivable use case – and it is growing every year. You can view all the available
    add-ons in the document displayed at the following link: https://www.salesforce.com/content/dam/web/en_us/www/documents/pricing/all-add-ons.pdf.


    A key point about add-ons is that they are not all available with all editions,
    meaning *some add-ons require a higher edition* to be able to purchase them. For
    example, in order to purchase and use **Sales Cloud Einstein** for AI-powered
    sales intelligence, **Partner Relationship Management (PRM)** for building a community
    site to collaborate with partners, or **Field Service** to manage and support
    your customers with on-site technicians, you need to be on either **Enterprise**
    or **Unlimited** org edition.


    Next, we’ll explore how AppExchange can further support your Salesforce solution.


    # AppExchange


    To extend Salesforce clouds’ common use cases, **independent software vendors
    (ISVs)** develop and offer Salesforce **apps**, pre-built solutions, and templated
    Salesforce **Flows** – to accelerate the value delivery of your Salesforce project.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'AppExchange apps also include connectors for the most popular and widely used
    enterprise apps, such as **LinkedIn**, **SurveyMonkey**, **Slack**, and **CTI**
    solutions, to name but a *few*. Salesforce also has its own department called
    **Salesforce Labs** offering free AppExchange apps and solutions with a selection
    shown at the following link, where you’ll see an overview of AppExchange solutions
    specific to Salesforce clouds https://appexchange.salesforce.com.


    While some AppExchange products are paid for and others are free, you should be
    aware that none of them are legally or technically offered by Salesforce Ltd.
    Therefore, before including any AppExchange product in your (Salesforce) system
    landscape, be sure to carry out the same **due diligence** you would in relation
    to any other SaaS product purchase.


    Furthermore, also listed on AppExchange is a menu dedicated to official Salesforce
    *consultants*, also known as **system integrators (SIs)** or **implementation
    partners**, which is the term we are using in this book. We’ll return to explore
