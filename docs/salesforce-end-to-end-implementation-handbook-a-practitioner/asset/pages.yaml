    Next, let’s discuss how you can plan development.


    # Planning your build phase


    In a pure agile delivery methodology, the team plans their work continuously –
    either in sprint planning (Scrum) or by simply starting new work when new user
    stories meet the **definition of ready** and there is the capacity for it to be
    picked up (Kanban).


    However, having chosen a form of hybrid agile delivery methodology, you’ll likely
    want to have some indication of the estimated duration of the build phase – both
    for budgeting and roll-out planning purposes.


    In this section, we’ll discuss the advantages and disadvantages of various methods
    of **estimating development effort** and how you can plan development.


    Let’s look at two methods of estimating effort:


    +   - **Estimating development effort in time format:**

    +     - In the previous chapter, you broke down the overall scope into user stories
    and provided solutions for each of them. If you didn’t, go back and review this
    process.

    +     - To know the total number of estimated development hours, you would need
    to have each user story estimated (time: hours) by *development type* (configuration,
    data, and customization). Inherently, for an estimate to be somewhat accurate
    and hence'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'useful for planning purposes, each user story needs to have a solution design
    done beforehand.


    +   - Once all stories are estimated, you summarize the estimates by epic and
    then summarize all epics by theme/domain to know the total.

    +   - It is important to note that, at this point, the estimate is simply an estimate.
    It is not until the story or sprint is finished that you will know exactly how
    long it took.


    # Important note


    When summarizing the estimate effort - and thus cost - in the development phase,
    it sometimes exceeds the original budget for your Salesforce project. This is
    typically not because the implementation partner is trying to squeeze you. It
    is usually because the consultants ask questions and uncover requirements, rules,
    exceptions, edge cases, and enablers, which weren’t apparent to you before the
    scope was detailed.


    # Story points:


    +   - Story points are radically different from estimating in a time format. A
    user story’s story points *describe a mix of total effort, complexity, risks,
    and uncertainties* expected for the agile team to refine, design, develop, test,
    and deploy and release a user story. As you can see, the story point concept extends
    far beyond the hour estimate model, which focuses on the time for the development
    of the user story.

    +   - A key aspect of story points is that they are *relative to an agile team’s
    history of working together in the team*. This also means that assigning story
    points to all user stories upfront isn’t a meaningful exercise.

    +   - Story points are typically assigned to user stories in sprint planning.
    We’ll return to this later in the *Maximizing value from agile ceremonies* section.'
  merge: -1
