- pgno: 106
  md: '# Securing Funding and Engaging with Salesforce and Implementation Partners


    In this chapter, we enter the financial and legal dimensions of Salesforce projects.
    First, we will cover how to create and present a business case to secure funding
    for your project. Next, we explore engaging with Salesforce to get a quote for
    your license costs, and we’ll go through the intricacies of communicating with
    implementation partners, and what to look for when selecting one.


    You will be introduced to methods of financial forecasting, including how your
    Salesforce project will increase your company revenue and diving into what costs
    you need to consider – and forecast – as part of your Salesforce implementation.
    You will learn what roles you are likely to encounter when engaging with Salesforce
    and how to best request a quote from Salesforce. Finally, you will learn about
    the value of working with an implementation partner, what types are available,
    the selection process, and how to contract with one.


    After securing funding for your Salesforce project, acquiring Salesforce licenses
    from Salesforce, and contracting with an implementation partner, you’ll finally
    be ready to start the development phase of your Salesforce implementation.


    This chapter will cover the following main topics:


    +   - Creating a business case to secure funding

    +   - Engaging with Salesforce and implementation partners

    +   - Iterating in the pre-development phase


    Let’s go!'
  merge: -1
