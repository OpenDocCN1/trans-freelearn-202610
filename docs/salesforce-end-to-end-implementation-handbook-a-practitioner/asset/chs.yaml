  除了计算你的 Salesforce 项目的损益影响外，你还需要确定两个关键的财务投资指标：\n\n- **回收期**：在你的投资的负面财务影响——Salesforce\
  \ 许可、实施和推广成本，以及你的新 Salesforce CoE——被你的经营利润的正面财务影响所抵消（收回）之前的 *持续时间*：来自预期更优业务成果的增加收入和降低运营成本。\n\
  - **投资回报率（ROI）**：你的一次性投资与你的经营利润影响之间的简单 *比率*。在 PME 的情况下，一次性投资是实施和推广成本。\n\n由于组织在风险偏好方面的差异，可接受的回收期是多久，以及它愿意等待多久才能获得对\
  \ Salesforce 投资的财务回报，建议同时包含 3 年和 5 年的财务预测。\n\n你已经完成了所有基础工作并创建了一个很好的初步商业案例。现在是时候向公司的领导层展示它以获得资金支持了\n\
  \n针对您的 Salesforce 项目。\n\n## 展示您的 Salesforce 项目商业案例\n\n如果您一直遵循本书预开发阶段部分中的每一章，创建您的\
  \ **商业案例演示** 将会轻而易举。\n\n邀请以下关键利益相关者参加会议：执行赞助人、**首席执行官 (CEO)**、**首席信息官 (CIO)**、**首席财务官\
  \ (CFO)**、来自商业领导层的代表、企业架构师，以及所有 Salesforce 任务组成员。\n\n在您的 Salesforce 项目商业案例演示中包含以下部分：\n\
  \n- **执行摘要**：包含项目的关键财务指标以及提升公司创新能力的好处。\n- **愿景**：包含您在 *第 1 章* 中创建的愿景，*为您的 Salesforce\
  \ 项目创建愿景*。\n- **项目性质**：包含您在 *第 2 章* 中定义的业务领域能力和假设技术范围，*定义您的 Salesforce 项目的性质*。突出显示\
  \ **业务用户** 将如何从项目中受益以及它将如何改善 **客户体验**。\n- **项目治理**：展示您设想的 Salesforce CoE 将提供的治理和管理框架，参考您在\
  \ *第 3 章* 中对此所做的工作，*确定如何交付您的 Salesforce 项目*。\n- **交付方法与分阶段方法**：解释您计划如何交付 Salesforce\
  \ 项目，如 *第 3 章* 中所定义，*确定如何交付您的 Salesforce 项目*。\n- **指示性项目时间表**：根据您选择的交付方法与分阶段方法——结合您对实施成本的估算——突出显示您\
  \ Salesforce 项目的以下里程碑：项目启动、开发启动、UAT、首次上线，以及所有预期用户在解决方案上运行的目标月份或季度。\n- **变更管理策略**：如您在\
  \ *第 3 章，确定如何交付您的 Salesforce 项目* 中所确定的。\n- **间接收益**：突出显示能够创新、适应变化并降低业务连续性风险的好处。\n\
  - **实施成本**：参考本章前面关于财务预测的工作。\n- **项目投资**：\n  - 3 年和 5 年财务影响\n  - 项目投资回收期（月）\n  -\
  \ 项目投资回报率\n- **项目路线图**：在您的 Salesforce MVP 解决方案之外，包含您在 *第 3 章，确定如何交付您的 Salesforce\
  \ 项目* 中创建的路线图。\n\n您现在已向管理层展示了商业案例——做得好！\n\n如果这是第一次会议，并且您尚未与 Salesforce 和实施合作伙伴展开合作，您将基于假设和过往经验来确定许可成本和实施成本。\n\
  \n如果您在第一次会议中未获得资金，请询问并记录关键的反对意见和反馈。这将让您知道需要改进商业案例的哪些方面——您需要考虑要更改什么以及它如何改变其他组件和成本。可能需要修改范围、交付方法、分阶段、KPI\
  \ 和目标，从而改变财务预测。\n\n您可能会发现，您的 Salesforce 项目资金未获批准，因为高级管理层认为您的商业案例依赖于成本假设，但您已获批准开始与\
  \ Salesforce 和实施合作伙伴接触以巩固您的假设。您将在下一节中获得对此的见解和帮助，在该节中我们将探讨如何有效地与 Salesforce 和实施合作伙伴合作。\n\
  \n现在，是时候与 Salesforce 和实施合作伙伴交谈了。\n\n## 与 Salesforce 和实施合作伙伴的合作\n\n一旦您的 Salesforce\
  \ 项目预算获得预先批准，您就可以同时开始与 Salesforce 和实施合作伙伴展开合作。在本节中，我们将介绍如何有效地做到这一点的基础知识。\n\n###\
  \ 与 Salesforce 合作\n\n为了验证您关于 Salesforce 许可成本的商业案例假设，您需要从 Salesforce 获取报价。\n\n让我们看看您将与谁合作获取报价。\n\
  \n### 来自 Salesforce 的参与方\n\n当您访问 www.salesforce.com 并请求观看产品演示或下载白皮书并填写您的信息时，您将在\
  \ 24 小时内——或在大多数情况下在同一工作日内——收到联系。**业务发展代表** 将致电您以了解您是否希望与客户执行官交谈。\n\n随着您与 Salesforce\
  \ 的对话进展，您将被介绍到多个不同的角色：\n\n- **客户执行官 (AE)**：根据您公司的规模以及您希望请求报价的云/产品，您将被分配一名 **核心 AE**\
  \ 和一个或多个云/产品特定 AE，例如 **Marketing Cloud AE**\n- **解决方案工程师 (SE)**：与您合作了解您的业务需求并将其转化为可能满足需求的\
  \ Salesforce 产品\n\n接下来，让我们看看您如何从 Salesforce 获取报价。\n\n### 向 Salesforce 请求报价\n\n请求\
  \ Salesforce 报价的最佳方式是回顾您的用户是谁以及他们将在 Salesforce 中做什么。标准方法是创建 **参与者图** 或表格。\n\n以下是\
  \ PME Salesforce 项目第一阶段的参与者图示例：\n\n![](img/307881206539c45e128c538a4b6912f8_125_0.png)\n\
  \n图 4.6 – PME 参与者图\n\n请求中应包含的几个关键附加要素如下：\n\n- 包含您在第 1 章《为您的 Salesforce 项目创建愿景》中创建的愿景。\n\
  - 包含您在第 2 章《定义您的 Salesforce 项目的性质》中定义的业务领域能力和假设技术范围。\n- 如果您已完成第 2 章《定义您的 Salesforce\
  \ 项目的性质》中 Org 版本部分中的练习，请包含您认为需要的版本。如果没有，我建议您回去阅读该部分。\n- 考虑您可能实际开始功能开发/配置的时间。说明您何时需要多少个许可证——包含您在第\
  \ 3 章《确定如何交付您的 Salesforce 项目》中创建的路线图。\n\n太好了，您已准备好报价请求并发送给 Salesforce。让我们看看 Salesforce\
  \ 将如何回应。\n\n### 评估来自 Salesforce 的报价\n\n当您与 Salesforce 的客户执行官和解决方案工程师交谈时，他们会就您甚至尚未考虑的话题提出几个问题。他们使用这些探询性问题来了解哪些产品可能与您的公司相关。\n\
  \n请做好被惊讶和启发的准备。您可能会因所有选项和可能性而感到有点不知所措。在交付方法、项目分阶段和路线图创建方面，保持对迄今为止所做工作的灵感和信任之间的健康平衡。\n\
  \n您可能会发现自己需要更新各种文档以包含一些新功能和新的 Salesforce 产品。\n\n**提示**\n\n当您与实施合作伙伴合作并获得其提出的解决方案和所需许可证时，您可能会发现需要修改所需的许可证。为了确定所需的许可证，请与\
  \ Salesforce 和您选择的实施合作伙伴进行对齐通话。\n\n接下来，让我们与实施合作伙伴交谈。\n\n### 与实施合作伙伴合作\n\n在本节中，我们将介绍实施合作伙伴的类型、选择一个合作伙伴的过程、如何与他们沟通、选择时应注意什么以及签约时应注意什么。\n\
  \n### 实施合作伙伴的类型\n\n截至 2022 年 8 月 22 日，Salesforce AppExchange 上有 2,141 家注册咨询公司（https://appexchange.salesforce.com/consulting）提供实施服务。它们从个人经营到全球咨询公司不等。\n\
  \n让我们了解实施合作伙伴类型的差异：\n\n- **全球咨询公司**：这些是主要的咨询、IT 策略和实施公司。按定义，它们涵盖所有类型的 IT 服务和领域。它们是所有最大企业软件公司（Salesforce、Microsoft、SAP、Google\
  \ 和 AWS）的合作伙伴。它们还提供所有编程语言的定制软件开发服务，并拥有用于应用和系统开发以及托管服务的主要 **离岸** 中心。它们通常利用其规模和离岸中心作为竞争优势。\n\
  - **专业公司**：这类实施合作伙伴专注于 Salesforce 实施。它们从小型精品公司到提供战略和变革管理咨询服务以及 Salesforce 项目交付的全功能咨询公司不等。大多数专业公司专注于特定的云和/或行业细分。专业公司作为利基云和/或行业专家脱颖而出。\n\
  - **承包商**：这些是更喜欢不签订永久合同的个人。他们通常全职、独家地为一家公司签约 3-6 个月，合同期结束时可能续约。\n- **自由职业者**：他们与承包商类似，但与为一家公司独家签约不同，他们可能同时为多个客户工作。\n\
  - **Salesforce 专业服务**：Salesforce 的服务部门。与专业公司类似，因为它们仅专注于 Salesforce 实施服务。\n\n让我们看看您如何寻找\
  \ Salesforce 项目的实施合作伙伴。\n\n\n\n## 选择实施合作伙伴的过程\n\n选择实施合作伙伴的过程涉及一系列步骤——每个步骤都有其自身目的——如以下图表所示，本章后面将对每个步骤进行详细说明：\n\
  \n![](img/307881206539c45e128c538a4b6912f8_128_0.png)\n\n图 4.7 – Salesforce 实施合作伙伴选择过程的高层示例\n\
  \n图 4.7 描述了为您的 Salesforce 项目寻找合适的 Salesforce 实施合作伙伴的漏斗。漏斗最初包含超过 2,000 家潜在实施合作伙伴，然后在每个步骤中逐步减少，直到您与选定的合作伙伴签订合同，交付项目方可开始。\n\
  \n## 重要说明\n\n与采购部门联系以确保选择流程一致。采购流程各不相同，详细的采购流程不在本书的范围内。建议您与采购团队沟通，了解公司的指导方针，并由品类经理/采购经理与您合作，共同完成选择和与所选实施合作伙伴签约的过程。\n\
  \n接下来，让我们探讨与潜在实施合作伙伴接洽的常见做法。\n\n## 向实施合作伙伴请求信息\n\n当您发送 **请求信息（RFI）** 时，您只是请求有关潜在实施合作伙伴的信息。利用\
  \ RFI 在不向请求中提供公司全面且敏感信息的情况下对潜在实施合作伙伴进行 *预先资格审查*。然而，为了让实施合作伙伴理解您请求的严肃性和合法性——从而提高获得适当回复的可能性——您应在\
  \ RFI 中至少包含以下要素：\n\n- 公司基本信息\n- 请求原因\n- 所要求的回复截止日期\n- 您请求的信息——请尽量简短\n\n为什么在此阶段分享这些信息？这是为了让实施合作伙伴能够内部审核并将请求分配给合适的团队或人员以作出回应。\n\
  \n在收到并比较回复后，就该邀请其中一些参与流程的下一步。\n\n## 向实施合作伙伴请求提案\n\n在对回复您 RFI 的部分实施合作伙伴进行预先资格审查后，让我们继续流程。接下来是发送您的\
  \ **请求提案（RFP）**。\n\n### 提示\n\n鉴于许多 RFP 回复包含 50-100 页或幻灯片，建议邀请 *约* 4-7 家潜在实施合作伙伴，具体取决于您对其参与\
  \ RFP 的信心。对于大型实施项目，请同时纳入专业和全球咨询公司。\n\n与其空谈，让我们看看 RFP 至少应包含哪些内容，以便实施合作伙伴能够为您提供贵公司可以有效评估的提案：\n\
  \n- **贵公司背景、背景和挑战**：分享您在 *第 1 章，创建您的 Salesforce 项目愿景* 中进行的分析的精简版本。\n- **项目性质**：包含您在\
  \ *第 2 章，定义您的 Salesforce 项目的性质* 中定义业务领域能力和假设技术范围。突出 **业务用户** 需要从项目中受益的内容，以及最终如何改善\
  \ **客户体验**。\n- **企业架构指南**：*请咨询贵公司的企业架构师提供此项。*\n- **并发项目/计划**：*请咨询贵公司的企业架构师提供此项。*\n\
  - **假设交付方法**：包含您计划使用的交付方法的信息、您对其的理解以及选择它的原因。对实施合作伙伴的建议和论点保持开放——许多实施合作伙伴都有交付项目的既定模式。参考\
  \ *第 3 章，确定如何交付您的 Salesforce 项目*。\n  - 请确保将变更管理和沟通服务纳入提案回复的一部分。\n- **关键假设**：您迄今为止所做的关键假设——*参考您的\
  \ RAID 日志*。\n- **实施合作伙伴背景**：您应请求有关实施合作伙伴在您所在行业以及 Salesforce 项目技术范围内交付的以往项目的信息。\n\
  - **提案回复格式**：如果您没有偏好，请说明。采用此方法有利有弊。如果您不指定格式，您可能会被内容淹没；另一方面，您可以感受到参与的实施合作伙伴的工作方式和信息呈现方式。\n\
  \  - 至少，添加一份说明您要求受邀合作伙伴的提案在其回复中包含的内容的描述，可能包括以下内容：\n    - 建议的解决方案架构\n    - 所需许可证\n\
  \    - 实施估算\n    - 相关客户参考案例——行业或技术范围\n    - 团队结构\n    - 项目治理\n- 项目价格或拟议角色的费率\n-\
  \ **健康、安全和环境（HSE）信息**：如果您和贵公司认同在至少具备基本 HSE 措施的情况下，人们和团队才能发挥最佳工作水平，您应要求提供支持该主张的信息。请求可能有多种形式，具体取决于您的行业，从对实施合作伙伴如何运营并为员工提供适当工作条件的简单描述，到客观且外部认可的认证，例如来自\
  \ **国际标准化组织（ISO）**。\n- **法律**：咨询贵公司的法律顾问，以确定您是否可能要求实施合作伙伴在收到您的 RFP 文件前签署 **保密协议（NDA）**。\n\
  - **RFP 流程和时间表**：分享以下信息：\n  - 提交回复的截止日期\n  - 关于 RFP 文件和项目的提问流程\n  - 回复提交后的流程\n \
  \ - 目标签约日期\n  - 项目开始的目标日期\n\n## 提示\n\n尽可能坦诚地说明贵公司希望在 Salesforce 项目中解决的业务挑战。您越准确、简洁，RFP\
  \ 回复的质量就越好。\n\n太好了，您已编制好 RFP 文件并发送给预先资格审查的实施合作伙伴。接下来，让我们看看在评估收到的提案时应强调什么。\n\n##\
  \ 在合作伙伴中应寻找什么\n\n为您的 Salesforce 项目选择实施合作伙伴可能令人不知所措，不仅仅是因为您需要消化和理解的信息量巨大。常见的采购做法指出，您需要为\
  \ RFP 回复定义若干评估标准。这些标准通常包括价格、相关技术专长和公司风险。\n\n除了通常的因素外，我建议您关注以下受邀参与 RFP 流程的实施合作伙伴的特征：\n\
  \n- 哪些实施合作伙伴 *挑战您*，对您的业务挑战提供不同或新的视角，并建议替代技术解决方案或不同的项目分阶段方法？\n- *端到端思考*，即使您没有明确要求。例如，如果实施合作伙伴就报告策略或计费、开票和付款流程提出多个问题——只是为了理解最终目标——这是一个很好的迹象，表明他们考虑了您的端到端业务流程。\n\
  - *大胆突出风险*并提出缓解措施。有经验的专业人士知道您此类项目常见的风险，并会知道如何建议您继续进行。\n\n让我们看看 PME 从其 RFP 回复中获得了哪些见解。\n\
  \n*PME 选择了四家实施合作伙伴对其 RFP 作出回应。其中一家实施合作伙伴脱颖而出，因为他们解决了 PME 在 RFP 中包含的一些关键假设：*\n\n\
  - *PME 将 Marketing Cloud Account Engagement（Pardot）作为其营销自动化的假设纳入其中，因为据称它是理想的选择*\n\
  \n针对 B2B 公司。然而，一家实施合作伙伴在其回复中提到——由于 PME 的路线图包含电子商务商店——PME 应考虑 Marketing Cloud，因为它可能更适合\
  \ Commerce Cloud。\n\n- 中间件：PME 已有现有的中间件解决方案，连接其后端 ERP 系统和当前 CRM 系统。Cary——PME 的技术负责人——假设当前中间件适合现代企业架构。一家实施合作伙伴指出使用旧版中间件存在若干风险——其中之一是它不支持\
  \ **事件驱动架构**。\n\n除了解决关键假设外，一家实施合作伙伴还强调了处理客户数据的策略需求。由于 Salesforce 除了核心产品（Sales Cloud\
  \ 和 Service Cloud）外还提供多个云，多个 Salesforce 云将持有客户信息。管理系统之间客户数据流需要投入精力进行设置——要么利用提供的连接器，要么通过定制集成开发。PME\
  \ 还可以考虑实施 **客户数据平台 (CDP)**，作为客户主数据管理解决方案。实施合作伙伴建议 PME 与其企业和数据架构师讨论此事。\n\n收到并评估了您\
  \ RFP 的回复后，是时候进入签约阶段了。\n\n## 与实施合作伙伴签约\n\n在您付出努力遵循选型流程的步骤后，您希望确保项目在推进过程中不会因任何法律纠纷而受阻。经过仔细思考，您和实施合作伙伴可以使合同成为项目的指路明灯，而非行政负担。\n\
  \n让我们探索一下在此签约阶段您可能会遇到的一些文件：\n\n- **工作说明书 (SoW)**：该合同文件描述了项目或合作中的范围、定价、发票时间表、协作方式以及交付成果的验收方式。\n\
  - **采购订单 (PO)**：在签署 SoW 后，您的公司可能会签发一份 PO 并发送给您选择的实施合作伙伴。它用于会计目的，因为实施合作伙伴可以在其根据合同交付工作时开具的发票上列明\
  \ PO 号码作为参考。\n- **主服务协议 (MSA)**：补充并取代其他合同文件（SoW 和 PO）。\n- **条款和条件 (T&Cs)**：您的公司可能有一般性的\
  \ T&C，在每次合作基础上很少可协商。您的法律顾问会了解并指导您。\n\n## 重要说明\n\n请与您的采购合作伙伴以及法律顾问联系，以了解贵公司使用的结构。如果贵公司没有内部法律资源，强烈建议您聘请外部律师协助起草\
  \ Salesforce 项目的合同并谈判条款。\n\n无论您最终使用哪份法律文件，您 *需要描述*——除了其他法律和商业条款外——下表中所述的元素：\n\n\
  **各合同/合作类型下的典型合同条款描述：**\n\n| 合同/合作类型 | 固定价格项目 | 按时计费 (T&M) 合作 |\n|---|---|---|\n\
  | 交付方法 | 纯瀑布式。 | 纯敏捷。 |\n| 范围（实施合作伙伴有义务交付的内容） | 在业务需求文档 (BRD) 中定义。 | 高层产品愿景。确保分配给商定时间的资源具备适当能力。这可能更详细或更不详细。可以按角色（技术架构师、开发人员、业务分析师）、资历/经验水平划分，或按资源是否在岸或离岸可用划分。\
  \ |\n| 价格 | 按项目里程碑计价。 | 按资源角色的费率表。 |\n| 发票时间表 | 在项目里程碑完成后。 | 按报告的可计费工时每月开具。 |\n\
  | 项目管理负责人 | 供应商（实施合作伙伴）。 | 客户。 |\n| 协作方式和所需客户资源 | 客户方资源在项目里程碑时可用，以评估、接受或拒绝交付。 |\
  \ 客户方资源在整个合作期间可用，以提供需求并接受工作交付。 |\n| 范围交付的验收标准 | 在 UAT 和上线时：不同严重程度级别下发现的缺陷数量，以及解决时间。\
  \ | 工作在冲刺/迭代中持续验收。 |\n| 常见附录 | BRD。UAT 和超护理期间缺陷修复的 SLA。 | 不适用。 |\n\n表 4.2 – 各合同类型下的典型合同要素描述\n\
  \n如表 4.2 所强调的那样，必须注意元素描述通常如何根据您选择的交付方法而变化。\n\n## 重要说明\n\n表 4.2 描述了两种纯交付方法。在第 3 章《确定如何交付您的\
  \ Salesforce 项目》中，我们深入探讨了这些方法，同时也强调了常见的混合敏捷交付方法。您可能已为 Salesforce 项目选择了某种形式的混合敏捷作为交付方法。如果是这样，请务必相应地考虑并调整合同要素——并确保它们之间不会冲突。\n\
  \n无论您的合同或项目的标题是敏捷、瀑布还是其他名称，请务必与实施合作伙伴保持一致，并请律师了解各方的期望，并对每个要素/条款进行明确描述：固定价格或 T&M、交付、验收、时间线、范围等等。\n\
  \n## 在预开发阶段迭代\n\n如前所述，虽然本书的章节按线性方式排列，但在您准备好与 Salesforce 和您选择的\n实施合作伙伴签约之前，您将对这些章节中的活动和决策进行迭代。也许在向高级领导层展示\
