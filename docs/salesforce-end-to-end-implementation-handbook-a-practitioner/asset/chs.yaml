  \ Salesforce 实施过程中需要考虑——并预测——哪些成本。您将了解在与 Salesforce 接洽时可能遇到的角色以及如何最好地向 Salesforce\
  \ 请求报价。最后，您将了解与实施合作伙伴合作的价值，可用的类型、选择流程以及如何与其签订合同。\n\n在为 Salesforce 项目获得资金、从 Salesforce\
  \ 获取 Salesforce 许可证并与实施合作伙伴签订合同后，您终于可以开始 Salesforce 实施的开发阶段。\n\n本章将涵盖以下主要主题：\n\n\
