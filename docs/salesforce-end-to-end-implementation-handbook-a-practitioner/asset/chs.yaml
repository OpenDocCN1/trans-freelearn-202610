  \n图 2.4 – PME 当前线索管理流程的泳道示例\n\n线索管理工作坊取得了显著成功。SME 们互动良好，并热切分享了他们的工作方式（其流程）、执行工作的系统，以及他们依赖和创建的信息（数据）。\n\
  \nKalinda，PME Salesforce 工作组中的业务负责人，记录了工作坊中提到的差异。她记录的内容如下：\n\n- *流程差异：*\n  - 有些国家有一项业务规则，要求营销部门在将信息输入\
  \ PME 的 CRM 系统并将潜在客户分配给销售之前必须捕获特定信息。然而，CRM 系统并不支持这一点，但如果信息缺失，销售会抱怨。其他国家对潜在客户应具备哪些信息没有任何业务规则。\n\
  \  - 在某些国家，联系和资格认定潜在客户并在 PME 的 CRM 系统中更新信息的责任属于营销部门。在大多数国家，这是销售团队的责任。\n- *系统差异：*\n\
  \  - PME 各地国家组织使用多种不同的电子邮件营销系统——甚至包括 PME IT 团队未批准的系统。\n  - 有些国家使用 PME 提供的 CRM 系统；其他国家使用程度较少，同时在\
  \ CRM 外的电子表格中维护其他数据。\n\n工作坊参与者很乐意分享改进和创新想法的相关问题和建议。Kalinda 仔细记录了所有这些要点：\n\n- 工作坊参与者提出的问题：\n\
  \  - 营销协调员将线索转移到系统是一个繁琐的手工流程——错误会发生，这意味着加载了错误客户信息，更糟糕的是，潜在客户根本未被加载到 CRM 系统中，从而导致潜在销售丢失。\n\
  \  - PME 当前的 CRM 系统没有任何重复检查，因此当前系统中存在许多重复的潜在客户记录，使得难以获得概览，销售团队对系统的信任度总体较低。\n  -\
  \ 许多潜在客户记录非常陈旧且未被销售资格认定。在工作坊中，销售解释说他们并非全部了解（未受培训）如何将潜在客户转换为客户和联系人；相反——一旦获得资格——销售代表会直接创建客户和联系人，而不转换潜在客户。\n\
  \  - 销售提出了一个问题，即经常会出现潜在客户被销售经理分配给错误的销售代表——该代表缺乏特定产品见解或在错误的地理区域。他们随后必须将其重新分配回销售经理，销售经理再将其重新分配给另一位销售代表。\n\
  \  - 销售抱怨分配给他们的潜在客户质量。\n- 工作坊参与者的建议：\n  - 营销希望当前电子邮件营销系统能够自动将营销合格潜在客户转移到 PME 的 CRM\
  \ 系统\n  - 销售希望在潜在客户分配给他们之前具备一些关键信息，以便有效地对潜在客户进行资格认定\n  - 销售希望系统规则为所有潜在客户在分配给他们之前必须至少填写公司名称、姓名、电子邮件地址或电话号码以及产品兴趣\n\
  \  - *销售希望删除所有旧潜在客户*\n  - *销售建议对营销进行培训，了解销售的组织架构，以便他们能够正确地将潜在客户分配给他们*\n  - *销售希望获得更好的培训，了解如何转换潜在客户*\n\
  \n## 提示！\n\n定期与你的执行赞助人举行会议，汇报工作坊的进展和初步发现。分享已识别的流程和系统差异，并询问执行赞助人 Salesforce 项目是否也有意愿和意图在公司业务线和地方组织之间开展**流程协调**。\n\
  \n在分析和更好地了解公司当前业务能力之后，现在是确定 Salesforce 解决方案能力的下一步。\n\n## 设想由你的 Salesforce 解决方案支持的新业务能力\n\
  \n在 Salesforce 工作组迄今为止开展的活动中，你已从 SME 终端用户那里收集到大量改进建议，以提高效率、更好地服务客户并简化客户的购买体验。\n\n\
  请记住，虽然终端用户是关于改进建议的最有价值的信息来源之一，但终端用户的**可能性视野**可能仅限于现有系统和流程的边缘。\n\n作为 Salesforce 工作组的成员，*你的责任和特权*是超越微小的渐进式流程改进，重新构想公司未来\
  \ Salesforce 解决方案应支持的能力，以便创新公司提升竞争优势的方式。\n\n与*关键*利益相关者——包括公司的高级领导——召开工作坊，以了解他们希望未来解决方案包含的能力。\n\
  \n在工作坊之前，准备以下两项关键内容并与工作坊参与者分享：\n\n- 创建已开展工作坊的**执行摘要**——突出 SME 在工作坊中分享的问题和建议\n- 研究**趋势**在你的行业内外的发生情况，并尝试了解竞争对手如何创新地营销和服务客户\n\
  \n工作坊的目标应是为你提供 Salesforce 解决方案所需的新能力清单。\n\n*PME 的 Salesforce 工作组已确定了许多新的期望能力和现有业务能力的增强，这些内容显示在以下表格中：*\n\
  \n| 领域 | 新业务能力 | 描述 |\n|---|---|---|\n| 营销 | 基于账户的营销 | 销售和营销希望能够针对特定账户使用账户特定内容，无论是在潜在客户生成活动期间还是在销售机会进行期间。\
  \ |\n|  | 客户 | 营销希望创建不同的 |\n\n\n| 类别 | 主题 | 描述 |\n|---|---|---|\n|  | 旅程个性化 | 针对不同客户细分、角色和地区的潜在客户和入职旅程。\
  \ |\n|  | 同意和偏好管理 | 所有利益相关者都同意 PME 需要一个坚实、透明、全面且灵活的解决方案来管理和记录同意和偏好数据。 |\n| 销售 |\
  \ 销售预测管理 | 销售希望未来的 Salesforce 解决方案提供预测能力。 |\n| 销售 | 报价管理 | 销售希望有一个解决方案，可以在系统中创建报价（PDF），而无需使用\
  \ Excel 和 Word。 |\n| 销售 | 合同管理 | 销售希望对整个合同生命周期管理获得更好的系统支持。 |\n| 销售 | 电子商务商店 | 销售管理希望为客户提供通过电子商务商店购物的选项，除电话和电子邮件下单之外。\
  \ |\n| 销售 | 分销合作伙伴管理 | 销售希望更好地了解其分销合作伙伴的销售机会管道，并提供一个统一客户问题解决的平台。 |\n| 客户服务 | 服务等级协议（SLA）管理\
  \ | 客户服务希望未来的 Salesforce 解决方案能更好地跟踪和管理 PME 相对于自身 SLA 目标以及与客户合同约定的 SLA 的执行情况。 |\n\
  | 客户服务 | 知识管理 | 客户服务——以及更广泛的 PME 组织——拥有大量关于其产品如何工作以及如何排查和修复各种问题的知识和资产。他们希望在客户服务代理处理客户问题时，以结构化的方式使用这些信息。\
  \ |\n|  | 自助客户管理 | 客户服务希望为客户提供通过在线门户提交案例和寻求帮助的选项——除电话和电子邮件求助之外。他们设想之前知识管理能力中描述的资产可以在门户中展示。\
  \ |\n|  | 现场服务管理 | 客户服务有一个现场服务技术员的子部门，其工作是确保 PME 的产品在客户现场得到专业安装。PME 希望有一个系统来管理整个现场服务流程。\
  \ |\n| 全部 | 报告和分析 | 所有利益相关者都同意 PME 需要全面、可使用且灵活的报告和分析解决方案——以实现客户互动的 360 度视图，并利用客户数据的整合进行\
  \ AI 和 ML 预测和处方，以预测和响应客户需求。 |\n\n表 2.1 – PME Salesforce 解决方案所需的全新能力\n\nPME Salesforce\
  \ 工作组的某些关键发现是电子商务商店作为 PME 销售领域的全新业务能力，以及现场服务管理作为由新的 Salesforce 解决方案提供系统支持的全新能力。\n\
  \n在此阶段，您正忙于收集信息、创建流程图、了解公司当前的业务能力，并设想由未来的 Salesforce 解决方案支持的新能力。随着您在这个阶段的进展，让我们看看\
  \ RAID 日志如何帮助您的流程。\n\n## 开始构建您的 RAID 日志\n\n在此阶段，您已经遇到了许多不同的利益相关者，他们对项目有各种输入、建议和期望。\n\
  \n确保在 Salesforce 工作组团队和关键利益相关者可用的存储库中捕获与项目相关的 RAID 项目。RAID 代表以下内容：\n\n- **风险**：在\
  \ Salesforce 实施各阶段进展过程中记录您可能发现的任何风险。记录您为防止或减轻风险而采取的任何行动。\n- **概率-影响矩阵**：除了风险标题和描述之外，请务必记录如果风险\
  \ materialize 会产生什么影响，以及风险发生的概率。这种分类有助于您优先考虑风险，并专注于高影响和高概率风险的预防或缓解。\n- **假设**：在整个\
  \ Salesforce 项目中，您所做的任何假设都必须记录下来。添加类别以便轻松排序。\n- **问题**：如果已发生的风险正在产生影响，这现在就是需要处理的问题。保留正在进行的问题日志，包括您为修复或减轻问题而采取的行动。\n\
  - **决策**：记录 Salesforce 工作组做出的任何决策，无论是独立做出还是与您的执行赞助商和更广泛的领导团队达成一致。请注意事情尚未定案。因此，在预开发阶段的第一次迭代中做出的决策可能会随着您获取更多见解和知识而修改。在此阶段保持开放接受变化——您的\
  \ Salesforce 项目的性质正在塑造以更好地适应您组织的业务需求。这确保您 Salesforce 项目成功的关键因素！\n\n现在您已经收集了 Salesforce\
  \ 解决方案的所有业务能力，是时候查看解决方案能够正常运行所需的重要技术使能因素了。\n\n## 确定支持已识别业务能力所需的技术使能因素\n\n您在理解业务流程和期望的新能力上花费了大量精力。您可能没有过多关注的是理解和描述\
  \ Salesforce 解决方案的技术使能因素和非功能性需求的努力。\n\n让我们先从了解技术使能因素开始。\n\n## 技术使能因素和非功能性需求\n\n\
  这些需求是关键能力，以确保 Salesforce 解决方案具有性能和可扩展性，提供无缝的用户体验，并最大化采用率。\n\n让我们看看 Salesforce 解决方案最常见的一些技术使能因素和非功能性需求：\n\
  \n- 本地化：\n- **多语言支持**：对于在多个国家运营的任何公司，或在某个国家使用或标准做法是为系统用户提供一种以上语言的公司，多语言通常是一个需求。\n\
  - **多货币支持**：与多语言支持需求类似，对于在多个国家运营且使用多种货币的任何公司，拥有多货币支持的解决方案通常是一个需求。\n- **身份和访问管理（IAM）**：作为一家公司，您需要确保合适的人（和系统）可以访问系统中的正确功能，并且您希望确保只有获得授权访问的用户才能实际访问您的系统和功能。这就是\
  \ IAM 的作用所在。前面列表中显示了两个最知名的用例。您希望确保授权人员的安全性和访问便利性：\n  - **单点登录（SSO）**：SSO 允许一个人只需记住一套凭据（用户名和密码）即可登录多个系统。它通常用于企业系统，其中内部用户使用\
  \ SSO 登录内部应用程序，以便授权用户无缝访问。**配置**和用户访问管理是 IAM 的重要组成部分。\n  - 另一个 SSO 的实施用例称为 **社交登录**，外部用户使用其社交媒体账户（例如\
  \ Facebook、Twitter 和 LinkedIn）或其他常用服务（例如 Gmail 和 Amazon）来访问数字服务。\n- **数据安全**：当您的系统识别（*身份验证*）用户时，您的系统应仅向该用户提供其执行工作所需的数据访问权限。数据安全关注的是确保在正确的时间向正确用户提供正确级别的数据访问。\n\
  - **数据和文件归档**：当您从旧系统迁移数据，并且公司用户开始在您的 Salesforce org 中工作时，数据将\n\n创建了，而且很多。你将需要并且希望具备归档数据的能力，原因如下：\n\
  \n- **合规要求**：许多地区、国家和州仅允许在一定期限内保留**个人身份信息（PII）**数据，且只有在有正当保留理由的情况下才允许。\n- **可用性**：如果不定期归档旧数据或无关数据，用户将不必要地在所有数据杂乱中筛选，降低用户体验和生产力，并增加错误风险和糟糕的客户体验。\n\
  - **性能**：如果不归档旧数据或无关数据，当用户搜索信息、加载记录页面或运行报表时，加载时间会随时间增加，从而降低用户体验和生产力。\n- **成本**：存储是云解决方案的重要成本驱动因素。虽然可以购买额外存储，但拥有*高效且自动*的归档解决方案，其节省的存储空间成本很快就会超过其投入。\n\
  - **备份和恢复**：而数据和文件归档主要与旧数据或无关数据相关，备份和恢复则关注通过确保关键运营 Salesforce 数据定期备份并且在数据因任何原因被意外删除、修改或损坏时能够轻松恢复，从而确保业务连续性。提供这些服务的成熟的\
  \ Salesforce 专属**现成商业解决方案（COTS）**可用 – **OwnBackup** 和 **Odaseva** 是 Salesforce 生态系统中的市场领先提供商。\n\
  - **可访问性管理**：提供对某种残疾人士可访问的 Salesforce 解决方案不仅在道德上是正确的，对业务来说也是明智的。在许多国家，要求向客户提供的商品和服务也必须对残疾人士可访问是法律要求。此外，能够为残疾人士提供就业机会将扩大你的人才库\
  \ – 这对残疾人士和你的公司都有益。\n\n- **速度/性能：** 每个人都希望解决方案快速易用且无需等待。在某些用例中 – 例如，客户服务电话 – 如果客户联系页面加载时间超过一定秒数，可能对业务不可接受，因为这会导致糟糕的客户体验。其他关键性能方面包括运行报表和仪表板以及搜索记录。这些是非功能性需求的示例。\n\
  - **可靠性：** 用户能够登录并执行工作的系统正常运行时间百分比是可靠性的特征。虽然你的公司很大程度上依赖 Salesforce 来确保正常运行时间，但你可以做一些事情来最大限度地减少停机时间。这些包括在部署新功能时最大限度地减少运营中断，并在集成中构建异常处理以优雅地处理连接问题。\n\
  \n许多非功能性需求实际上由 Salesforce 提供并在一定程度上受其控制，因为 – 除了作为 SaaS 解决方案外 – 它还为其客户提供基础设施和平台。然而，你如何设计、配置和开发你的\
  \ Salesforce 组织对其安全性和性能水平有重大影响。\n\n提示！\n\n聘请技术架构师来支持你定义 Salesforce 项目的技术使能因素。\n\n\
  在涵盖了一些 Salesforce 解决方案的常见技术使能因素和非功能性需求后，让我们来看看经常与 Salesforce 集成的 数据源。\n\n## 数据源\n\
  \n虽然你的公司雄心和意图可能是让 Salesforce 成为营销、销售和客户服务团队的主要系统，但你的公司**系统环境**中不可避免地还会有其他系统和应用程序。这些其他系统和应用程序各有其独特目的，并持有有时对\
  \ Salesforce 中的用户相关的数据，而有时可能是 Salesforce 需要向应用程序发送信息以完成流程。\n\n让我们看看经常与 Salesforce\
  \ 集成的一些系统：\n\n- **企业资源规划（ERP）系统**：这些系统用于运营目的，涵盖生产计划、库存管理、物流计划、订单处理和开票。\n- **数据仓库（DWH）**：这是一个包含企业各处数据的数据库。它可能具有各种分布和结构级别。例如，数据湖包含数据科学家用于建模和利用的非结构化数据，而高度结构化和管理的数据库可以为\
  \ BI 系统提供基础，为用户提供报表层。\n- **Active Directory（AD）**：AD 通常充当与 *IAM* 相关的**身份提供者**或**身份存储**，用于集中管理配置和**取消配置**以及访问级别更改。\n\
  - **网站**：你的公司很可能至少有一个描述公司及其产品和服务的网站。网站可能有一个**联系表单**供人们填写问题或请求信息，然后发送给你的销售或客户服务团队。\n\
  - **内容管理系统（CMS）和数字资产管理系统（DAM）系统**：这些系统存储在多个应用程序中使用的资产，包括你的网站和电子邮件营销解决方案。\n- **产品信息管理系统（PIM）系统**：存储在多个应用程序中使用的有关你的产品（和服务）的信息，包括\
  \ ERP、电子商务商店、CRM 和产品**配置、定价和报价（CPQ）**解决方案。\n\n提示！\n\n将你的研讨会中关于*系统*和*数据*的成果作为与 Salesforce\
  \ 解决方案集成的基线。聘请架构师来支持你确定哪些系统和数据（Salesforce 外部）需要与你的 Salesforce 解决方案集成。\n\n接下来，我们将看看如何总结你的\
  \ Salesforce 解决方案的所有功能。\n\n## 总结你的 Salesforce 解决方案所需支持的功能\n\n在添加了技术使能因素后，你现在拥有了\
  \ Salesforce 项目范围内的完整功能集。让我们看看以下图中 PME 的业务能力图是什么样的：\n\n![](img/307881206539c45e128c538a4b6912f8_65_0.png)\n\
  \n图 2.5 – PME 的 Salesforce 解决方案业务能力图\n\n*除了设想的新业务功能外，PME——作为一家全球公司——确定了需要提供本地化解决方案的需求，该解决方案提供多种语言并支持多种货币。PME\
  \ 也非常重视确保坚实的安全性，既包括对 Salesforce 的用户访问，也包括他们可以访问的数据。PME 还认识到定期归档和备份数据和文件以遵守法规、确保解决方案可扩展且性能良好并确保业务连续性的价值。最后，PME\
  \ 希望确保其解决方案可供其残疾员工使用——以及为其客户工作的残疾人士使用。*\n\n*PME 通过与终端用户的研讨会以及与技术架构师的合作，确定了需要与未来\
  \ Salesforce 解决方案协同工作的关键系统和数据源。*\n\n在总结了你的 Salesforce 解决方案所需支持的功能后，你就可以继续确定你的 Salesforce\
  \ 解决方案所需的高级技术范围。\n\n## 确定你的 Salesforce 解决方案的高级技术范围\n\n到目前为止，我们还没有在 Salesforce 功能上花费太多精力。随着我们继续定义你的\
  \ Salesforce 解决方案的高级技术范围，这将发生变化。\n\n你已经定义了 Salesforce 解决方案所需支持的业务功能。现在是时候了解支持这些业务功能需要什么**假设性技术范围**。在此时它是*假设性*的，因为你无疑会有许多假设和不确定性。随着你在章节中的进展\n\
  \n在预开发阶段，技术范围将变得更加明确，直到你最终与 Salesforce 签约。\n\n## 高层技术范围\n\n在此阶段，确定高层假设技术范围的目的是：\n\
  \n- 能够估算该解决方案的 **许可成本**\n- 能够要求一个或多个潜在的实施合作伙伴提供该解决方案的 **实施成本** 估算\n- 能够估算维护和运行你的\
  \ Salesforce 组织的 *成本* **目标运营模式**\n- 能够了解对公司整体系统格局的技术影响和范围\n\n所有这些目的对于预开发阶段的后续活动、商业案例建模都是关键，也是你在选择与实施合作伙伴合作参与项目交付时\
  \ RFP 文件的关键组成部分。更多内容请参见 *第 4 章，获取资金并与 Salesforce 和实施合作伙伴接洽*。\n\n让我们开始了解不同的 Salesforce\
  \ 许可类型。\n\n## Salesforce 许可类型\n\n首先要掌握的概念是最广泛、最基础的概念——让我们来看看 Salesforce 组织版本。\n\n\
  ### 组织版本\n\nSalesforce *核心* 提供四种不同的 **版本** 用于商业用途，还有第五个版本 **开发者** 用于非商业用途。为简单起见，让我们专注于以下链接中描述的四种商业用途版本：\n\
  https://help.salesforce.com/s/articleView?id=sf.overview_edition.htm&type=5.\n\n\
  你的 Salesforce 组织的版本决定了你可访问的功能和服务，也是你 **用户许可** 成本的基础。\n\n你需要详细研究版本之间的差异并将其与公司需求进行权衡。如果你计划使用\
  \ Salesforce 同时支持销售和客户服务，请在以下页面研究 *比较版本和主要功能* 部分：\nhttps://www.salesforce.com/editions-pricing/sales-and-service-cloud.\n\
  \n在决定选择哪个版本时，需要考虑以下几点：\n\n- 你可以升级版本，但 *无法降级*。因此，如果你对选择哪个版本犹豫不决——因为你可能尚未完全理解不同功能意味着什么——请选择较低版本。\n\
  - 如果你是一家中型或大型公司，计划拥有多个 **参与者**，在多个业务领域使用 Salesforce，自动化业务流程并与其他系统集成，你应考虑选择 *企业版*\
  \ 或 *无限版*。\n\nTip!\n\n如果你不确定选择哪个版本，并且在此阶段决定假设较低版本就足够了，请将其添加到你的 RAID 日志的假设部分以及风险部分，并以\
  \ *高影响* 分类，因为升级成本将产生巨大的财务影响。\n\n让我们继续探索 Salesforce 云。\n\n## Salesforce 云和附加组件\n\n\
  Salesforce（公司）提供大量按领域捆绑的产品和功能，称为 **云**。在 *图 2.6* 中，你可以看到 Salesforce 如何展示其产品，共同构成品牌名称\
  \ **Salesforce Customer 360.**\n\nSalesforce 产品范围从 *核心 CRM* 产品，如 **Sales Cloud**、**Service\
  \ Cloud** 和 **Experience Cloud**，到 **营销**、**商务**、**集成** 和 **分析**。\n\nSales Cloud\
  \ 和 Service Cloud 按每用户计价，而其他云的成本模型各不相同。例如，对于 Marketing Cloud，成本模型按每联系人计价，而对于 Commerce\
  \ Cloud，则按每订单计价。\n\n为了扩展核心 Salesforce，有大量 **附加组件** 可用于几乎所有可想象的用例——并且每年都在增长。你可以在以下链接显示的文档中查看所有可用的附加组件：\
  \ https://www.salesforce.com/content/dam/web/en_us/www/documents/pricing/all-add-ons.pdf.\n\
  \n关于附加组件的一个关键点是它们并非在所有版本中都可用，这意味着 *某些附加组件需要更高版本* 才能购买。例如，为了购买和使用 **Sales Cloud Einstein**\
  \ 进行 AI 驱动的销售情报、**Partner Relationship Management (PRM)** 用于构建与合作伙伴协作的社区网站，或 **Field\
  \ Service** 用于通过现场技术人员管理和支持你的客户，你需要在 **企业版** 或 **无限版** 组织版本上。\n\n接下来，我们将探讨 AppExchange\
  \ 如何进一步支持你的 Salesforce 解决方案。\n\n## AppExchange\n\n为了扩展 Salesforce 云的常见用例，**独立软件供应商\
  \ (ISVs)** 开发并提供 Salesforce **应用**、预建解决方案和模板化 Salesforce **Flow**——以加速你的 Salesforce\
  \ 项目的价值交付。\n\nAppExchange 应用还包括最流行和广泛使用的企业应用的连接器，例如 **LinkedIn**、**SurveyMonkey**、**Slack**\
  \ 和 **CTI** 解决方案，仅举 *少数* 例子。Salesforce 还有一个名为 **Salesforce Labs** 的部门，提供免费的 AppExchange\
  \ 应用和解决方案，其中选择显示在以下链接，你将在其中看到特定于 Salesforce 云的 AppExchange 解决方案概览 https://appexchange.salesforce.com.\n\
  \n虽然一些 AppExchange 产品需要付费，其他则是免费的，但你应该意识到它们在法律上或技术上都不是由 Salesforce Ltd 提供的。因此，在将任何\
  \ AppExchange 产品纳入你的（Salesforce）系统格局之前，请务必进行与任何其他 SaaS 产品采购相同的 **尽职调查**。\n\n此外，AppExchange\
  \ 上还列出了一个专门针对官方 Salesforce *顾问* 的菜单，也称为 **系统集成商 (SIs)** 或 **实施合作伙伴**，这是我们在本书中使用的术语。我们将在\
  \ *第 4 章*、*获取资金并与 Salesforce 和实施合作伙伴接洽* 中进一步探讨这一部分。\n\n## 构建你的假设高层系统格局\n\n在确定了 Salesforce\
  \ 解决方案需要支持的功能，并介绍了 Salesforce 产品之后，现在是时候构建你的假设高层系统格局了。但从哪里开始？\n\n首先确定哪些系统和应用程序将成为\
  \ Salesforce 领域的一部分——组织内的产品、附加组件以及你可能包含的任何 AppExchange 应用——以及哪些 *外部* 于 Salesforce。\n\
  \n如果你计划用 Salesforce 替换任何遗留 CRM 系统，那些系统之前支持的功能将来将由 Salesforce 解决方案支持。确定哪个 Salesforce\
  \ 产品涵盖你的所需业务能力。\n\n对于所有其他系统和应用程序，请参考你的工作坊产品的执行摘要——当前使用的系统和数据的列表。这通常包括你的 ERP、DWH，以及如果你不考虑在\
  \ Salesforce 实施中替换它，可能的 **中间件** 解决方案。\n\n让我们看看 PME Salesforce 工作组在以下图表中构建的假设高层系统格局：\n\
  \n![](img/307881206539c45e128c538a4b6912f8_71_0.png)\n\n图 2.6 – PME Salesforce 解决方案的高层技术范围\n\
  \n*Cary Sharp，PME Salesforce 工作组的 **技术负责人**，负责研究并领导确定 PME Salesforce 解决方案的假设技术范围，以支持所需的业务能力。*\n\
  \n*首先，Cary 审查了可用的 Salesforce 组织版本，目前不确定是选择企业版还是无限版。他假设企业版至少在首次发布之前就足够了。*\n\n*让我们回顾一下\
  \ Cary 为 PME 系统格局确定的 **新组件**：*\n\n- *Salesforce 组件:*\n  - **Sales Cloud**: 为了支持\
  \ PME 在销售领域的业务能力，Sales Cloud 是基础的 Salesforce 产品。\n  - **Service Cloud**: 为了支持 PME\
  \ 在服务领域的业务能力，Service Cloud 是基础的 Salesforce 产品。\n  - **Field Service cloud add-on**:\
  \ 为了支持特定的现场服务管理能力，Cary Sharp 发现 Salesforce 有一款专门针对现场服务用例的专业产品，并将其加入系统架构。\n  - **Experience\
  \ Cloud**: Cary 很高兴得知 Salesforce 有用于创建面向客户解决方案的解决方案，因此 Experience Cloud 被加入以支持两个独立的能力。\n\
  \  - **Distribution partner site**: 一个 PME 的分销合作伙伴可以与 PME 协作销售机会并解决客户案例的站点。PME 将因此获得额外的好处，即对其分销合作伙伴绩效的可见性提升，从而进一步支持和培养关系。\n\
  \  - **Customer site**: 一个客户可以访问 PME 知识资源并通过创建案例请求帮助的站点。\n  - **Commerce Cloud**:\
  \ Cary 很惊讶地看到 Salesforce 产品组合中提供了一款商务产品。商务站点将支持 PME 让客户自行在线下单的愿景，而无需致电或发邮件给 PME\
  \ 繁忙的销售和客户服务部门。Commerce Cloud 还将连接到 PME 现有的 PIM 系统作为产品数据的来源。\n  - **Marketing Cloud**:\
  \ 为了支持 PME 的营销目标，Marketing Cloud 被加入目标系统架构。Cary 注意到有两种不同的 Marketing Cloud 解决方案可供选择，但不确定该选择哪一个。目前，他将\
  \ Marketing Cloud Account Engagement 记录为假设，因为据称它非常适合 B2B 公司。Marketing Cloud 还将连接到\
  \ PME 现有的 **DAM** 解决方案，用于数字营销活动的数字资产管理。\n  - **AppExchange**: 为了支持 **备份和恢复** 能力，Cary\
  \ 注意到这些产品将通过 AppExchange 应用连接到 PME 的 Salesforce org。\n\n接下来，让我们回顾将在 PME 系统架构中复用的\
  \ **现有组件**：\n\n- **AD**: 为了管理 PME Salesforce org 中 Salesforce 用户的配置、去配置和访问控制，Cary\
  \ 建议复用 PME 现有的 AD。\n- **Outlook**: 虽然 PME 的总体愿景是减少邮件使用，但 PME 认识到邮件仍然是关键的沟通工具——尤其是销售代表与客户互动时。Cary\
  \ 希望让销售代表同步其 Outlook 联系人和日历，以支持活动管理能力。\n- **ETL**: PME 拥有现有的 ETL，目前将其现有的本地 CRM 系统连接到其\
  \ **DWH**，用于数据归档和汇总 BI 报告。因此，Cary 希望复用该 ETL 并将其连接到其 Salesforce org。Cary 不确定 PME\
  \ 旧的 ETL 解决方案是否适合连接到基于云的 CRM，因此他将此项加入 RAID 日志的假设部分。\n- **Middleware**: PME 拥有现有的中间件解决方案，连接其后端\
  \ **ERP** 系统和当前 CRM 系统。Cary 的假设是当前中间件适合现代企业架构。他将此项加入 RAID 日志的假设部分。\n- **Website**:\
  \ PME 希望继续通过其当前网站 `www.PME.io` 收集线索，并将线索发送到其 Salesforce org 由销售处理。其网站依赖 CMS 进行内容和本地化管理。\n\
  \n最后，不会成为 PME 未来系统架构一部分的系统如下：\n\n- **Legacy CRM**: 目前为 PME 各地提供支持其当前 CRM 流程和数据的系统。\n\
  - **Spreadsheets**: Cary 清楚地记得工作坊中的发现，许多终端用户提到由于当前 CRM 系统无法满足其需求，因此离线在电子表格中处理和维护客户和活动数据。PME\
  \ 的 Salesforce 工作组一致认为，消除使用电子表格维护客户数据的行为应成为其 Salesforce 项目的关键目标。\n\n在 PME 的案例中，回想他们识别出一些流程差异，但由于这些差异在所有当地国家/地区都是一致的，Cary\
  \ 假设整个 PME 都可以在一个 Salesforce org 中工作。他将此项加入 RAID 日志的假设部分。\n\n## 重要提示！\n\n如果您在此阶段的工作坊和分析揭示了业务流程、报告要求或数据隔离要求方面的\
  \ *显著* 差异，您需要进行重要分析以确定您的 **org 策略**。Org 策略涉及确定贵公司是否需要一个或多个 Salesforce org 来支持公司需求。确定\
  \ org 策略超出了本书的范围。您需要聘请经验丰富的 Salesforce 技术架构师协助进行此分析。\n\n以下是关于您 Salesforce 解决方案假设技术范围当前状态的一些关键要点：\n\
  \n- 它将在预开发阶段及以后进一步修改、细化和详细丰富。\n\n> 它是为 Salesforce *简化的*，意味着贵公司可能存在众多其他系统 **系统架构**。因此，贵公司的完整系统架构将包含比\
  \ PME 简单示例中所示更多的组件。\n\n顺着这个思路，让我们看看您可以如何迭代定义 Salesforce 项目的性质。\n\n## 预开发阶段的迭代\n\n\
  对 Salesforce 项目进行范围界定是一项庞大而有趣的练习——它总是需要不止一次迭代。随着您推进预开发阶段的以下活动，您将返回审查 Salesforce\
  \ 解决方案所需支持的能力和高层技术范围。在此过程中，请确保更新您的 RAID 日志以记录决策和假设。您正朝着让 Salesforce 项目成形迈进。\n\n\
  ## 摘要\n\n您现在已经建立了 Salesforce 项目的业务和技术范围应为的假设——即您 Salesforce 项目的性质。您首先学习了如何收集输入并确定期望的业务能力。然后，您了解了\
  \ Salesforce 产品组合。最后，您首次尝试定义 Salesforce 解决方案的高层技术范围。\n\n到目前为止，您已经为 Salesforce 项目创建了愿景——*为什么*——以及其性质——*是什么*——并且您已准备好进入\
  \ Salesforce 实施的下一章：*第 3 章，如何交付您的 Salesforce 项目*。是时候看看交付 Salesforce 项目的最佳方式——*如何*。\n\
  \n## 如何交付您的 Salesforce 项目\n\n在本章中，您将了解不同的 **交付方法**，以及如何根据项目的性质以及贵公司的环境和优先事项选择最适合您\
  \ Salesforce 项目的交付方法。接下来，您将了解深思熟虑的 **变更管理** 策略对 Salesforce 项目成功至关重要的原因。最后，您将学习构想您的\
  \ **Salesforce 卓越中心 (CoE)** 的结构——用于监督 Salesforce 计划的管理和治理框架。\n\n您将了解 **瀑布**、**敏捷**\
  \ 和 **混合敏捷** 交付方法，以及不同项目分阶段方法的概念。您将了解如何制定沟通和变更管理策略，以及项目不同阶段所需的相关活动。最后，您将了解 Salesforce\
  \ CoE 中的角色和职责、起草其 CoE **章程**，以及如何为 Salesforce 计划创建 **路线图**。\n\n我们将继续关注我们的案例公司 Packt\
  \ Manufacturing Equipment (PME)，以及他们在确定如何交付 Salesforce 项目的活动中的进展。\n\n在确定如何交付项目后，您将准备好进入\
  \ Salesforce 实施预开发阶段的下一个活动。\n\n本章将涵盖以下主要主题：\n\n- 选择您的交付方法\n- 确定您的变更管理策略\n- 构想您的\
  \ Salesforce 卓越中心\n\n\n\n预开发阶段的迭代\n\n开始吧！\n\n## 选择交付方法\n\n在上一章中，您定义了 Salesforce\
  \ 项目的性质——期望的业务能力以及高层次的假设技术范围。如以下图所示，现在是确定如何交付您的 Salesforce 项目的时候了。\n\n![](img/307881206539c45e128c538a4b6912f8_77_0.png)\n\
  \n图 3.1 – 预开发阶段的活动\n\n在深入交付方法之前，让我们先简要了解一下企业项目，特别是 Salesforce 项目的特殊之处。\n\n## 企业项目\n\
  \n考虑到组织可能正在规划或当前交付的各种项目类型，重要的是要注意它们之间的差异。\n\n下表提供了一些最常见的企业项目类型之间细微差别的简单概述：\n\n|\
  \ 项目类型 | 示例 | 在生产环境中开发 | 涉及后端系统 | 面向客户 | 对业务连续性至关重要 |\n|---|---|---|---|---|---|\n\
  | 业务项目 | 战略项目、人力资源和重组项目。 | 不适用 | 否 | 或许 | 否 |\n| 营销微网站 | 用于新产品发布潜在客户生成的网站。 | 有时\
  \ | 否 | 是 | 否 |\n| ERP 项目 | SAP 或其他 ERP 实施，用于支持后台业务运营。 | 从不 | 是 | 否 | 是 |\n| CRM\
  \ 项目 | 从用于基本账户和联系人管理的简单应用程序到企业级 CRM 实施。 | 有时 | 有时 | 有时 | 有时 |\n| Salesforce 实施项目\
  \ | 从核心功能的基本使用到全功能实施。 | 绝不应该发生 | 大多数情况下 | 有时 | 大多数且日益常见 |\n\n![](img/307881206539c45e128c538a4b6912f8_79_0.png)\n\
  \n表 3.1 – 企业项目类型\n\n将 *表 3.1* 中的企业项目类型进行比较后得出的一个关键结论是关于 **在生产环境中开发**。对于业务项目而言，这完全不相关，因为它们不是\
  \ IT 项目。对于其余项目类型，可能存在项目和解决方案直接在生产环境中开发的情况，仅仅因为系统没有支持的开发环境，或者因为风险或风险的影响被认为较低，因为该应用程序对公司而言并非业务关键。\n\
  \n重要提示！\n\n对于 **企业级** Salesforce 项目，其解决方案集成到多个系统并且由 Salesforce 支持的业务关键流程，*开发绝不应直接在生产环境中进行。*\n\
  \n让我们继续讨论 Salesforce 项目和项目组合。\n\n## 区分 Salesforce 项目和 Salesforce 项目组合\n\n确定您正在处理的是\
  \ Salesforce 项目组合还是 Salesforce 项目非常重要。为了帮助理解这种区别，让我们探讨以下几点：\n\n## Salesforce 项目：\n\
  - 要交付一项或多项能力\n- 有目标截止日期\n\n## Salesforce 项目组合：\n- 包含处于不同阶段的 **项目组合** Salesforce\
  \ 项目和/或若干敏捷产品开发团队——这一概念我们将在 *第 12 章，发展您的 Salesforce Org 和 DevOps 能力* 中进一步探讨\n- 没有设定的结束日期：项目的目标应该是持续改进组织的业务领域能力\n\
  - 对于 *一家* 组织，只应有 *一个* Salesforce 项目组合\n\n项目概念与某些类型的 **交付方法** 更相关，我们将在本章后面再讨论。但首先，让我们通过介绍常用的\
  \ **术语** 来达成共识。\n\n## Salesforce 项目中常用的术语\n\n误解和错误使用的概念在整个生态系统中广泛存在。它是业务和技术利益相关者共同的主要混淆来源。\n\
  \n让我们看看 Salesforce 项目中最常用的一些术语：\n\n- **最小可行产品 (MVP)**：用于产品开发的术语，其中产品可能是有形的或非有形的（数字）。无论如何，MVP\
  \ 是目标 *产品*（解决方案）的一个版本，具有 *最小* 的 **必备** 功能集，同时仍是用户在 *生产环境* 中完成工作所需的 *可行* 解决方案。MVP\
  \ 本质上缺少许多它 **应该具备** 的功能或 **希望具备** 的功能。对许多组织而言，Salesforce 项目是创新项目。此时未来设想流程的许多方面仍是假设。认为组织能够提前准确知道哪些功能最重要并带来最大价值——更不用说这些功能的详细需求——对于大多数\
  \ Salesforce 项目来说是一种有风险且次优的方法。相反，定义 MVP 并获得快速、有价值的 *改进反馈*，通常是最快且最好的方法。\n- MVP 的概念可以在多个层面上应用：\n\
  \  - 在 *项目层面*，在确定哪些业务能力集合是使最终用户获得可行解决方案的最低限度时。\n  - 在 *能力层面*，MVP 涉及确定哪些功能是关键的，哪些不是。\n\
  - **试点**：一种 **推广** 方法，用于从解决方案的全部预期用户中的有限群体获取反馈——通常针对解决方案的 MVP 版本。然后可以将这些宝贵的反馈用于在向更多用户推广之前改进解决方案。\n\
  - **最小可销售产品 (MMP)**：在 MVP 概念的基础上，MMP 是被认为比早期 MVP 版本更有可能被市场（Salesforce 用户）接受或购买（采用）的产品（Salesforce\
  \ 解决方案）版本。\n- **概念验证 (PoC)**、**原型** 和 **预原型**：这些术语描述了尝试创建版本以查看其在概念上和技术上是否可行的活动。这些术语（解决方案版本）被归为一类，因为它们具有一个关键特征：它们永远不打算投入生产。PoC——即使它证明了一个概念（解决方案）在开发环境中可行——在准备投入生产之前始终需要进一步的完善、重新工程、设计优化、重建和测试\
  \ *before*。\n- 不幸的是，经验丰富和经验不足的专业人士经常不准确地使用这些术语。有些人使用这些术语来解释或请求快速交付并在生产中使用功能或项目的精简版本，而不提前明确或阐述目的，也不考虑对其他功能、系统或项目的必要技术使能因素或依赖关系。\n\
  - **解决方案**：指项目的技术交付成果，包括标准的 Salesforce 开箱即用组件，以及项目中构建的任何配置、定制和集成。\n- **实施**：常与项目和解决方案等术语同义使用。\n\
  - **发布**：这个词有两种含义，细微差别。一种含义是解决方案部署到生产环境时。另一种含义是——如果与功能一起实现了某种功能标志——当功能被 *打开* 并准备好使用时。我们将在\
  \ _第 7 章_、_构建和测试您的初始发布_ 中进一步介绍这一概念。\n- **Salesforce** 或 **Salesforce, Inc**：这可能指用户实际工作的系统，也可能指公司\
  \ _Salesforce, Inc_。\n\n前一节中描述的许多术语都与某种形式的敏捷开发方法相关，如果您选择使用实施合作伙伴进行交付，则应在合同中明确说明。我们将在\
  \ _第 4 章_、_获取资金并与 Salesforce 和实施合作伙伴合作_ 中再次讨论合同问题。\n\n提示！\n\n一个经验法则是——如果可能——您应优先考虑更紧凑的\
  \ MVP 范围以实现更快交付和更快反馈，而不是交付更慢、投入使用后过时风险更大的全面解决方案。\n\n一旦您的 MVP 在选定的用户组中进行试点，您就可以迭代改进\
  \ MVP，使其成为 MMP 以便进一步推广。\n\n敏捷是否是您 Salesforce 项目的正确交付方法将在下一节中介绍。\n\n## 理解交付方法\n\n\
  让我们直接开始，了解交付方法的两个极端，以及第三种更难定义但经常使用的方法。\n\n## 纯瀑布\n\n在纯瀑布 Salesforce 项目中，需求由业务利益相关者在业务分析师的帮助下提前以完整细节定义。所有需求都整齐地组织在庞大的业务需求文档（BRD）中。\n\
  \n接下来，架构师有时还有高级开发人员通过创建详细的低级解决方案设计开始工作。然后解决方案设计移交给开发团队以开发整个解决方案。如果解决方案是对现有实时系统的增强或扩展，则在用户验收测试（UAT）之前进行系统集成测试（SIT）。\n\
  \n然后，UAT 严格按照 BRD 中规定的验收标准进行，并且技术、性能和非功能需求也会被测试。如果一个或多个特定验收标准失败，项目领导需要迅速评估这些失败是否关键，必须在部署前修复，还是部署后再修复\n\
  \n在后续版本中。如果解决方案通过 UAT，则解决方案将被部署并推广给用户。\n\n如果您与实施合作伙伴签约交付项目，从根据 BRD 进行架构设计和开发解决方案到\
  \ UAT 开始并看到已开发的解决方案，*可能需要数月*的时间。\n\n### 提示\n\n了解更多关于瀑布交付方法的信息，可在以下链接中查阅 *Prince2*\
  \ (https://www.prince2.com/eur/what-is-prince2) 和 *PMP (Project Management Professional)*\
  \ (https://www.pmi.org/certifications/project-management-pmp)。\n\n## 纯敏捷\n\n在 **纯敏捷**\
  \ Salesforce 交付中，敏捷团队仅以简要的 **产品愿景** 作为指导。它由敏捷团队自行决定——由产品负责人领导——创建其产品待办列表，其中包含最重要的、最紧急的待交付功能。团队共同协作细化产品待办列表，并在\
  \ **冲刺计划** 时，团队使用 **故事点扑克** 来估算 **产品待办项 (PBIs)**（即 **用户故事**）的大小。一旦团队的冲刺容量（*用户故事点数*）被填满，团队便开始为\
  \ PBIs 创建解决方案设计、开发并测试它们，然后向利益相关者 **演示** 已开发的功能（一种形式的 UAT），最后发布已开发并被接受的 PBIs。**冲刺**（也称为\
  \ **迭代**，具体取决于团队选择的敏捷方法）通常持续一到四周，其中两周是最常见的。\n\n敏捷团队在 **自组织** 意义上是自组织的，即它将为作为 PBIs\
  \ 优先排序并创建的需求开发解决方案。PBIs 可以在各个层级组织，例如 **主题、史诗、功能、用户故事** 和 **任务**。PBIs 的组织方式并不是区分敏捷与瀑布交付的重要部分。理解纯敏捷的关键在于，团队在前期没有定义明确的范围——最多由资助方阐述一个产品愿景，PO\
  \ 必须将其转化为一组 PBIs，这些 PBIs *共同* 构成 **冲刺目标**。\n\n我们将在 *第 7 章*、*构建和测试您的初始版本* 中更详细地介绍这些主题和术语。\n\
  \n敏捷团队 *可能* 包含以下角色，具体形式化程度取决于敏捷方法的类型：\n\n- **产品负责人 (PO)**: 代表业务和解决方案的预期用户。\n- **Scrum\
  \ 主管**: 促进敏捷仪式，移除阻碍，指导团队使用敏捷方法，并确保为持续改进团队协作而商定的行动得到执行。Scrum 主管的关键职责是保护开发人员、功能顾问和\
  \ QA 专家免受干扰，例如会议和报告。\n- **开发人员 (编码员)**: 使用 **Apex** 和 **JavaScript** 等技术开发复杂逻辑、定制的\
  \ **用户界面 (UIs)** 和自定义集成。\n- **功能顾问 (配置员)**: 以 **声明式** 的方式配置功能——使用点击而非代码。在 Salesforce\
  \ 上下文中，**低代码/无代码** 是一个区别性特征，功能顾问在敏捷团队中通常比开发人员更多。\n- **业务分析师**: 一些敏捷团队设有专职业务分析师以支持\
  \ PO 进行 **待办事项细化**；在其他团队中，功能顾问或开发人员承担该角色。\n- **QA 专家 (测试员)**: 一些敏捷团队设有专职 QA 专家执行用户故事测试和回归测试；在其他团队中，功能顾问和开发人员共同承担用户故事测试责任，而\
  \ PO 负责回归测试——如果它是手动流程。我们将在 *第 7 章*、*构建和测试您的初始版本* 中介绍各种测试形式。毋庸置疑，对于组织通常认为的任务关键型系统——Salesforce——投资质量保证至关重要。\n\
  \n在下图中，您可以看到两种方法在视觉上的比较：\n\n![](img/307881206539c45e128c538a4b6912f8_86_0.png)\n\
  \n图 3.2 – 纯瀑布与纯敏捷交付\n\n图 3.2 中需要注意的两个关键点如下：\n\n- 在纯瀑布交付方法中，需求在前期详细定义，然后架构也详细设计。开发团队随后严格遵循设计的架构，并交付最初的\
  \ **预期架构**。是否 **预期架构** 是最佳且最 **适合用途的架构** 的架构，直到解决方案部署并收到终端用户反馈后才能得出结论。在这些 **易变、不确定、复杂、模糊\
  \ (VUCA)** 时代，对于大型或复杂项目，认为自己能够理解详细需求并 *主计划* 详细解决方案设计是冒险的做法。\n- 在纯敏捷交付方法中，架构随时间演进，被称为\
  \ **涌现式架构**。如果没有向敏捷团队提供零 **防护栏** 或 **开发指南**，纯涌现式 Salesforce 架构很少是最优架构。\n\n### 提示\n\
  \n了解更多关于敏捷交付方法的信息，可在以下链接中查阅：\n\n- **看板:** https://www.atlassian.com/agile/kanban\n\
  - **Scrum:** https://www.scrum.org/resources/what-is-scrum\n- **SAFe (规模化敏捷框架):**\
  \ https://scaledagile.com/what-is-safe\n\n正如本节开头所承诺的，有第三种交付方法更难定义但常用于 Salesforce\
  \ 项目。\n\n## 混合敏捷\n\n**混合敏捷** 有多种形式，因为它不是像传统敏捷和瀑布交付方法那样在框架中定义的模型。核心敏捷主义者可能会将 SAFe\
  \ 归类为混合敏捷框架，但解决这一争论超出了本书范围。\n\n在混合敏捷交付方法中，您将 *挑选元素* 两种极端的方法，以达到中间立场，该立场 *对您的组织更好*\
  \ 于任一极端的纯形式。\n\n混合敏捷交付的目的是对成本和解决方案架构有所 *指示*，但不会花费太多时间在前期确定所有最低级别的细节——以免需求在项目开发阶段开始前变得陈旧。\n\
  \n## 选择您的 Salesforce 交付方法\n\n如果以下情况适用，您应考虑选择 *纯瀑布* 交付方法：\n\n- 您可以在 BRD 中前期准确阐述组织和业务用户的详细需求——在\
  \ *Salesforce 上下文* 中。\n- 您认为提供需求后，在开发期间（数周、数月甚至数个季度）处于黑暗中等待不会导致初始需求在解决方案交付前过时。\n\
  - 您更看重在开发过程中知道最终成本和时间表，而不是持续检查解决方案并能够适应不断变化的需求、新知识或新发现的关键需求。\n- 您希望确保避免 **范围蔓延**。\n\
  - 您的项目范围有限，需求不复杂，且提供需求的业务利益相关者无法在较长时间内提供支持。\n- 您的项目 *仅* 涉及以下 *两者之一*：\n  - 不可协商的法律或合规功能\n\
  \  - 复杂集成，其中独立团队或人员依赖彼此在特定时间可用\n- 您已准备好为在 **固定预算固定范围** 模式与 **按时按材** 模式相比的交付 *可能*\
  \ 支付更高的价格。\n\n另一方面，如果以下所有条件都为真，您应考虑选择 *纯敏捷* 交付方法：\n\n- 您已在生产环境中拥有一个 Salesforce org\
  \ 运行，并且只是希望向 *现有 Salesforce 云* 添加新功能。\n- 您不需要对交付范围的总成本进行任何估算。\n\n\n\n\n- 你接受与 *纯粹涌现式架构*\
  \ 相关的 *风险*（除非同时建立合适的治理机制）。\n- 你更看重持续检查解决方案并能够适应变化的需求、新知识或新发现的关键需求 *优先于* 知道最终成本和时间线。\n\
  - 你相信你会想要并且需要做大量的原型 PoC 以了解解决方案将涉及的内容 – *并且接受这种方法需要时间和金钱*。\n- 如果你与实施合作伙伴合作，采用纯敏捷交付方法，你意识到并接受与按时按材合同模式相关的风险。\n\
  \n你应考虑选择一种 *混合敏捷* 交付方法——而非纯敏捷——如果以下情况适用：\n\n- 你的组织需要项目成本的 *至少一些指示*。\n- 你看到了在前期确定\
  \ *一定程度的架构* 的价值。\n- 你需要在瀑布方式下处理项目范围中的 *某些* 元素，例如法律要求、合规要求和集成，同时需要以敏捷方式处理 *其他* 元素。\n\
  \n*在我们与 PME 的场景中，Salesforce 任务组的项目被赋予开发包含营销、销售和服务能力的 MVP 解决方案并在全球推广的目标。该解决方案必须具有足够的[content]\n\
