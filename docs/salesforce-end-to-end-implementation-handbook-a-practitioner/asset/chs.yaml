  \ 升级任务小组无法处理的议题和决策 |\n| 执行赞助人 | - 支持并指导任务小组<br>- 担任升级联系点 |\n\nTable 1.1 – 任务小组成员角色的职责\n\
  \n## 预开发阶段的持续时间\n\n在新冠疫情初期，一些公司意识到变革的迫切性，并在一个月内完成了预开发阶段的所有活动。虽然这可能挽救了受影响行业的中小型企业，但您不应仓促通过此阶段。\n\
  \n在预开发阶段所做的扎实准备和组织对齐工作，将使您的Salesforce项目更加稳健，并相比仓促的预开发阶段具有更大的成功机会。\n\n让我们继续到下一节，在那里我们将揭示贵公司对变革的需求。\n\
