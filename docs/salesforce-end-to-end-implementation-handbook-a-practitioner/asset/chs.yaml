  - 如果你与实施合作伙伴合作，采用纯敏捷交付方法，你意识到并接受与按时按材合同模式相关的风险。\n\n你应考虑选择一种 *混合敏捷* 交付方法——而非纯敏捷——如果以下情况适用：\n\
