  ## 项目分阶段方法\n\n在旧时代，部署 IT 解决方案是以大爆炸的方式进行的，部署所有功能并让所有用户同时上线，盛大庆祝，香槟和蛋糕齐飞——据我所知。过去至少十年里，构建\
  \ MVP 以尽快发布可用的解决方案已成为常态和口号。\n\n对于许多类型的 IT 项目来说，构建 MVP 并在开发的产品能够通过更好的功能集、体验、业务成果和/或相比被取代的现有系统更低的成本来提供价值时就发布它是有意义的。然而，对于企业\
  \ IT 项目——Salesforce 实施项目就属于此类——存在充分的理由来抵制过早投入生产环境（首次上线）的冲动。\n\n不急于进行初始推广的最强论据是，一旦用户在生产环境中上线，你的\
  \ Salesforce 设置和复杂性相比开发阶段至少会翻倍。\n\n以下是一些你在上线后将拥有的关键驱动因素和责任，而在开发阶段至少不会以同等程度存在：\n\n\
  - 用户的配置和去配置：\n  - 员工更换角色，需要新的角色、权限集、组和队列成员资格\n- 新用户的培训\n- 管理生产环境\n- 可能管理生产支持环境\n\
  - 每次 Salesforce 发布时每年三次对关键流程进行回归测试\n- 处理来自用户的新的功能请求\n\n### 用户 bug 报告的处理\n\n这看起来工作量很大，如果在流程和架构上没有以最精简的方式管理，确实如此。我们将在\
  \ *第 12 章，演进你的 Salesforce Org 和 DevOps 能力* 中进一步介绍这一点。\n\n我绝不是建议你尽可能推迟初始发布。我只是指出\
  \ *需要考虑合适的时机*——考虑到建立这些流程所需的时间，其中一些需要在前期进行技术设置。\n\n可以通过分阶段实施来避免大爆炸，从而不会因前面提到的生产责任而不堪重负。\n\
  \n存在两种项目分阶段类型，乍一看可能似乎相同，但存在明显差异。\n\n### 按范围分阶段\n\n不同的业务领域能力会开发并发布给相关的 **功能用户组**。例如，你可以选择为你的\
  \ *销售* 组织开发并发布业务能力，然后再为你的 *营销* 和 *客户服务* 组织开发并发布。采用这种方法有优缺点，如下所述。\n\n这些是优点：\n\n-\
  \ 范围更小意味着增值、可用的解决方案的开发和推广更快\n- 已获取的 Salesforce 许可证比如果解决方案必须包含完整范围并等待所有能力开发完成后再让任何单个功能用户组开始使用\
  \ Salesforce 的情况更早得到利用\n- 培训和变革管理的并发工作更少\n- 任何一个业务能力无法正常工作并延迟整个解决方案部署的复合风险更低\n\n\
  这些是缺点：\n\n- 风险是陷入对少数能力的过度优化，超出投资回报，而牺牲了为其他用户组开发新能力。\n- 可能需要开发临时集成到遗留系统以获得完整的客户概览。例如，如果\
  \ Salesforce 解决方案最初是为销售用户构建且不包括客户服务，销售用户将无法在 Salesforce 中访问其客户的服务历史记录，他们要么必须使用两个\
  \ CRM 系统（用户体验不佳），要么需要开发临时集成以在 Salesforce 中显示来自遗留 CRM 的服务历史记录。\n\n### 提示！\n\n随着我们在本章活动中逐步推进，请牢记你不同业务能力成熟度和战略重要性，因为它们将指导你为初始\
  \ Salesforce 发布确定范围的优先级。\n\n让我们看看分阶段实施 Salesforce 项目的另一种策略。\n\n### 按地理分阶段\n\n在这种项目分阶段类型中，一个地理区域的用户将使用项目中开发的所有能力——但推广（和迁移）是分阶段进行的。\n\
  \n例如，你可能决定开发一个初始 MVP 解决方案，推广到澳大利亚和新西兰组织，然后进一步推广到其他地区或国家——批量或国家组。\n\n按地理分阶段的优点如下：\n\
  \n- 培训和变革管理的并发工作更少\n- 开发的解决方案不太可能与任何特定国家或地区不匹配的风险更低——阻碍采用\n\n按地理分阶段的缺点如下：\n\n- 风险是为一个国家或地区优化解决方案，而未进行预期的流程协调\n\
  \n### 提示！\n\n作为一般经验法则，当能力开发、测试并准备好使用时，优先尽快推广以获取反馈。根据收到的反馈改进解决方案，然后尽可能推广到尽可能多的地理区域，以确保构建的解决方案被整个组织采用——这样你就不会冒不同地理区域同时使用不同系统的风险。\n\
  \n在介绍完 Salesforce 项目交付方法论后，是时候谈谈变革了。\n\n## 确定你的变革管理策略\n\n在你的 Salesforce 项目过程中，你的组织会有许多变化。最重要的是，你的员工的工作方式会发生变化。你作为组织管理这些变化的能力对\
  \ Salesforce 项目的成功有直接且巨大的影响。你可以设计和交付最技术上复杂的解决方案，但如果你的用户不愿意、不需要或不知道如何使用你的解决方案，那么你的努力和投资将不会结出果实。\n\
  \n### 介绍变革管理\n\n**变革管理** 涵盖你为最大化组织所经历变化的积极成果而使用的所有努力、举措、活动和工具。\n\n你需要在 Salesforce\
  \ 项目中管理变革，以确保你的 Salesforce 解决方案的预期用户采用并使用你的 Salesforce 解决方案。**采用** 的水平是衡量 Salesforce\
  \ 项目成功与否的关键指标，我们将在 *第 4 章，获得资金并与 Salesforce 和实施合作伙伴互动* 中进一步介绍。\n\n采用率，然而，是你为管理变革所投入的集体努力的\
  \ *综合结果*。让我们看看你的 Salesforce 项目可能带来的变化范围。\n\n### Salesforce 项目中的变革程度\n\n通过实施 Salesforce\
  \ 增强业务能力——*超出了改变业务能力的系统组件*。\n\n实施 Salesforce 可能会以以下方式改变你的业务能力组件：\n\n- **系统**：可能用\
  \ Salesforce 取代遗留系统将影响你的整体系统格局，并可能影响 *你的企业系统如何集成*。\n- **数据**：数据作为 Salesforce 项目的一部分，其管理、存储、分配、消费和利用方式会受到影响。在当今的\
  \ **数据驱动型企业** 中，数据被认为是最重要的资产之一。你需要考虑并绘制因用 Salesforce 取代旧的工作方式（遗留系统）而受影响的利益相关者，设计你的未来数据管理和治理，并了解\n\
  \n\n建立新的报告和分析能力与资产所需的工作。聘请 **企业架构师** 和 **数据架构师** 在此练习中支持您。\n\n- **流程**：您面向客户并与客户互动的员工的业务流程将会发生变化。在整个\
  \ Salesforce 项目期间，您将把大部分变更管理工作集中在该变化如何影响您的员工上。\n- **人员**：随着系统和流程的变化和优化，之前从事基础数据录入和手动重复性任务的人员将腾出时间，专注于创造更多价值的活动，以实现更好的业务成果——所有这些都与您\
  \ Salesforce 项目的整体愿景保持一致。\n- 员工当前的能力和技能与从事增值活动所需的技能之间可能存在差距。这需要提升技能和培训——超出学习使用您的\
  \ Salesforce 解决方案的范围。当然，提升技能和培训的性质取决于您识别出的能力差距。如果您作为 Salesforce 项目的一部分正在改变公司的整体销售方法——例如，从传统的交易型销售转变为解决方案销售——您可能需要开展一系列销售培训课程。\n\
  - 在某些项目中，您可能会发现一些需要学习新技能以适应新工作方式的员工对变革不感兴趣和/或不具备变革能力。在这种情况下，您需要考虑他们在组织内可能适合的岗位，以便仍然保留这些员工所拥有的组织知识。最后的办法是，如果他们对您提供的机会不感兴趣，或者您无法在组织内为他们找到机会，您可能需要考虑让部分员工离职。\n\
  - 在开展识别不同员工群体变化的练习时，与您的人力资源业务合作伙伴密切合作，以捕捉职位描述和所需技能的变化。\n\n虽然这些要素目前可能由组织内不同部门负责，但确保所有要素都得到解决，是设计和交付用户将采用的解决方案的关键前提。稍后在本章中，我们将探讨如何锚定改变组织能力的集体责任。\n\
  \n## 识别受变革影响的利益相关者\n\n实施 Salesforce 时，变革将在组织的多個层面发生，而管理这些变革需要不同类型的活动。\n\n在上一节中，您已确定实施\
  \ Salesforce 带来的变革范围。现在让我们具体看看谁会受到变革的影响，以便您据此规划沟通和变更管理活动：\n\n- **终端用户**：他们的工作方式将会改变，因为他们将在\
  \ Salesforce 中工作。\n- **您的终端用户的经理**：Salesforce 将为他们提供有关员工工作的新的洞察。管理者的支持对于维持变革和采用您的\
  \ Salesforce 解决方案至关重要。很可能经理们需要提升技能和辅导，以便他们能够支持和鼓励员工采用您的 Salesforce 解决方案。\n- **本地销售组织的领导层**：本地领导层将有效地充当您\
  \ Salesforce 项目的本地执行赞助人。他们的支持和沟通对于采用至关重要。\n- **全球领导层**：假设您将拥有一个在整个公司使用的 **Salesforce\
  \ 组织**，您的全球领导层将能够以全新的方式深入了解营销、销售和客户服务绩效。这需要培训以及可能的能力提升，以充分发挥这一新层次洞察的最大价值。\n- **应用管理员工：**\
  \ 可能管理过您旧版 CRM 系统的员工将经历重大变革，因为他们必须学习管理您的 Salesforce 解决方案及其用户。\n- **数据、BI、报告和分析员工：**\
  \ 这些职能可能属于您的 IT 组织，也可能不属于。无论组织位置如何，他们的基础数据架构都将发生变化，因为他们——借助 Salesforce——将拥有新的数据源，以及为报告利益相关者创建和展示报告和仪表板的新的场所。\n\
  \n## 按 Salesforce 项目阶段安排变更管理活动的时间\n\n管理变革的方法和活动——您的工具箱——无论您为 Salesforce 项目选择哪种交付方法都是相同的。然而，变更管理举措的时机和力度则取决于您选择的交付方法。\n\
  \n让我们探讨一下举措的时机如何通常因交付方法而异：\n\n| 关键变更管理举措 | 瀑布式 | 混合敏捷 | 纯敏捷 |\n|---|---|---|---|\n\
  | 识别受变革影响的利益相关者 | 开发开始前 | 开发开始前 | 在产品待办事项列表细化或冲刺计划时 |\n| 使用愿景确定信息并制定沟通计划 | 开发开始前\
  \ | 开发开始前起草，持续调整 | 在产品待办事项列表细化时 |\n| 招募变革推动者 | UAT 之前 | 开发开始前 | 在冲刺计划中 |\n| 终端用户参与\
  \ | 直到 UAT 和培训阶段 | 在开发前阶段的工作坊中，在开发阶段的展示活动中 | 持续在展示活动和用户反馈论坛中 |\n| 用户培训 | 在推广阶段 |\
  \ 在推广阶段 | 在产品演示中以及在应用中使用 |\n| 监控并确保采用 | 在推广阶段 | 在推广阶段 | 持续进行 |\n\n表 3.2 – 按交付方法划分的关键变更管理举措的时机\n\
  \n接下来，让我们看看有哪些框架可供您使用。\n\n## 使用变更管理框架\n\n有很多变更管理框架可供您选择。一些最常用的框架包括 Prosci ADKAR®\
  \ 模型、Drucker 组织变革领导力学院，以及经典的 John Kotter 的《领导变革的 8 步流程》。\n\nTip!\n\n虽然详细说明每个变更管理框架的内容超出了本书的范围，但我鼓励您阅读它们并从中获得灵感。遵循一个整体经过验证的框架是有益的，但要注意不要让自己陷入过于僵化的结构——根据您公司的文化，将您认为对自己的变更管理策略有价值的元素纳入其中。\n\
  \n我们知道您的组织将经历变革，因为这是您 Salesforce 项目的目标，所以我们可以预测它。我们无法预料的是组织——受变革影响的人们——将如何反应和回应。\n\
  \n在整个 Salesforce 项目中，您将花费大量精力来了解员工当前的流程，并确定未来的、改进的或新的流程以了解变革的内容。我们无法确定这些关于改进和变革的假设是否成立——即使它们成立，也无法确定受影响的人是否会将其\
  \ *视为* 积极的变革。\n\nTip!\n\n随着您推进 Salesforce 项目，调整和完善您的变更管理策略。\n\n接下来，我们将转向了解如何治理和管理您的\
  \ Salesforce 项目和计划。\n\n## 设想您的 Salesforce 卓越中心\n\n截至目前，您的项目工作组由三个关键角色组成（参见第 1 章《为您的\
  \ Salesforce 项目创建愿景》），他们已出色地完成了工作到目前为止。现在是设想如何管理您的 Salesforce 项目并设想您的 **Salesforce\
  \ 卓越中心 (CoE)** 结构的时候了。您的 Salesforce 工作组成员将在新的 Salesforce 卓越中心中继续发挥关键作用。\n\n\n\n\
  ## 了解 Salesforce 卓越中心的用途\n\n您的 Salesforce CoE 将是您管理 Salesforce 项目的管理和治理框架。\n\n建立您的\
  \ Salesforce CoE 的好处是多方面的：\n\n- 确保 *及时交付* Salesforce 项目或功能，具体取决于您选择的交付方法\n- 确保您的整体\
  \ *Salesforce 解决方案符合* 公司所受的法规要求\n- 实现创新的 *更快交付* 并降低风险\n\n执行得当，这些收益的总和将在财务上产生重大影响，与没有设立\
  \ Salesforce CoE 相比可节省大量成本。\n\n## 为您的 Salesforce CoE 起草章程\n\n为您的 Salesforce CoE\
  \ 创建一份 **章程**，以使项目利益相关者和 Salesforce CoE 成员保持一致。\n\n您的 Salesforce CoE 章程应包含以下内容：\n\
  \n- 您 Salesforce 项目的愿景\n- 您 Salesforce CoE 的目标和职责\n- 衡量您 Salesforce 项目成功与否的指标\n\n\
  让我们来看看您 Salesforce CoE 的职责。\n\n## 确定 Salesforce CoE 的结构和职责\n\n您的 Salesforce CoE\
  \ 包含以下元素和团队——各自承担不同的职责——共同朝着同一目标努力。\n\n让我们来看看 CoE 职责背后的任务：\n\n![](img/307881206539c45e128c538a4b6912f8_101_0.png)\n\
  \n图 3.3 – Salesforce 卓越中心\n\n执行赞助人：贵公司高级领导层的代表，对 Salesforce 项目的成功有切身利益。可能是直接向公司\
  \ CEO 汇报的 SVP，具体取决于组织的规模和结构，有时甚至是 CEO 本人。\n\n- **指导委员会**：负责您 Salesforce 项目战术支持的团队。应由您的执行赞助人、CFO、CIO\
  \ 以及高级商业领导代表组成。您有时可能希望邀请 Salesforce 或实施合作伙伴等外部人员在指导委员会会议上进行演示。\n- **Salesforce 项目负责人：**\
  \ 负责监督和协调 Salesforce CoE 的职责。项目经理推动 Salesforce 项目组合管理，并根据业务和技术组织的意见制定项目路线图。项目负责人还负责监督\
  \ Salesforce 项目的交付，不过每个项目或交付流都应配备专职的 Salesforce 项目经理——或 Scrum Master。\n- **业务治理：**\
  \ 该团队负责收集和整合需求、业务流程定义、变更管理、报告支持以及发布管理的业务方面。\n- **技术治理：** 该团队负责确保您的 Salesforce org\
  \ 安全，其应用程序具有可扩展性和高性能。此外，该团队还监督质量保证、技术发布管理以及帮助台和管理员支持等领域，其中包括用户管理。\n\n您 Salesforce\
  \ CoE 中的团队和职责可能会根据 Salesforce 项目的特定性质、行业和组织而有所不同。\n\n在预开发阶段，一旦您为初始 Salesforce 项目获得资金，您的\
  \ Salesforce CoE 就会启动并开始运作。\n\n起草您的 Salesforce CoE 章程和结构是创建商业论证以获得 Salesforce 项目和项目资金的重要前提。一旦获得资金，您将希望开始为您的\
  \ Salesforce CoE 配备人员。\n\n接下来，让我们看看如何创建您的 **Salesforce 路线图**。\n\n## 为您的 Salesforce\
  \ 项目创建路线图\n\n这里有意使用 *program* 一词，因为该项目可能包含许多与 Salesforce 相关的项目和流——但不一定包含在初始 Salesforce\
  \ 项目的范围之内，或至少不包含在 Salesforce 解决方案的初始发布中。\n\n让我们看看我们的案例公司 PME 制定的 **Salesforce 项目路线图**，它以经典的\
  \ **转型图 (T-Map)** 形式呈现。\n\n![](img/307881206539c45e128c538a4b6912f8_103_0.png)\n\
  \n图 3.4 – PME 的 Salesforce 项目路线图\n\n*PME 的 Salesforce 任务组制定了其路线图。他们考虑了初始发布的项目分阶段和交付方法。他们决定通过创造性地为所需功能定义三个类别来保持简单：*\n\
  \n- **MVP Release**：MVP 发布包含 PME 现有电子邮件营销和 CRM 系统当前支持的功能，以及 PME 认为将为业务带来巨大价值的少数精选功能。\n\
  - **Later**：*这些功能非常受期待，但需要在开始构建之前具备若干基础功能。PME 不打算将 Later 类别的功能打包成一个项目，而是打算区分 MVP\
  \ 发布和 Later still 类别功能之间的交付时间。*\n- **Later still**：*这些功能也受期待，但仍依赖于在 MVP 发布和 Later\
  \ 类别中交付的功能。*\n\n*PME 已通过范围对 Salesforce 实施进行了有效分阶段，显著降低了实施风险。它也希望按地理区域对项目进行分阶段。*\n\
  \n## 在预开发阶段进行迭代\n\n确定如何交付您的 Salesforce 项目是一项重要工作。确定您的 Salesforce 项目路线图和初始 Salesforce\
  \ 项目的范围是一个迭代过程。随着您意识到依赖关系并更熟悉获取许可证和实施功能的成本，您将返回路线图并进行修改。迭代和修改非常好——您正在进一步塑造 Salesforce\
  \ 以适应您的组织。将任何更改和决策记录在您的 RAID 日志中。\n\n## 摘要\n\n在本章中，您已对如何最好地交付 Salesforce 项目进行了许多考虑。您考虑了哪种交付方法最适合您的特定项目和组织，并考虑了如何按范围和地理区域分阶段实施以降低风险并提高交付速度。然后，您了解了变更管理以及变更管理的程度。您还学习了如何识别因\
  \ Salesforce 项目而受到影响的众多利益相关者，以及应如何根据您选择的交付方法 *安排* 变更管理活动的时间。最后，您设想了您的 Salesforce\
  \ CoE，即监督 Salesforce 项目的管理和治理机构，并学习了如何创建 Salesforce 项目路线图。\n\n到目前为止，您已为 Salesforce\
  \ 项目创建了愿景——*为什么*——以及其本质——*是什么*——并且您刚刚确定了 *如何* 交付它。\n\n您现在准备进入 Salesforce 实施预开发阶段的最后一章：*第\
  \ 4 章，获得资金并与 Salesforce 和实施合作伙伴接洽*。是时候确定 *多少* 了。\n\n## 获得资金并与 Salesforce 和实施合作伙伴接洽\n\
  \n在本章中，我们进入 Salesforce 项目的财务和法律层面。首先，我们将介绍如何创建和呈现商业论证以获得项目的资金。接下来，我们将探讨如何与 Salesforce\
