- "## 演进你的 Salesforce Org 和 DevOps 能力\n\n在前几章中推广 Salesforce 解决方案之后，在你的 Salesforce\
  \ 项目的 *第 4 部分，持续改进阶段* 中的本第一章中，你将了解持续改进阶段的性质和活动。然后，我们将介绍产品型组织的概念以及它对 Salesforce 项目成功的重要性。接下来，我们将介绍持续改进阶段的项目和平台治理。最后，我们将介绍\
  \ DevOps 以及如何演进你的 Salesforce **DevOps** 能力。\n\n读完本章后，你将了解持续改进阶段的关键活动。你将学习为何应努力成为产品型组织，以及如何开始组织的\
  \ **转型**。在阅读并应用这些概念后，你将能够更新和维护你的 Salesforce 路线图，并在 Salesforce 平台上管理技术债务。你将能够增强你的\
  \ Salesforce DevOps 能力，以便在 Salesforce 项目的持续改进阶段取得成功。\n\n在本章中，我们将介绍以下主要主题：\n\n- \
  \  持续改进阶段概述\n-   将组织转变为产品型组织\n-   治理你的 Salesforce 项目和平台\n-   演进你的 Salesforce DevOps\
  \ 能力\n\n开始吧！\n\n### 持续改进阶段概述\n\nSalesforce 项目的这一阶段始于你与首批用户上线之时，如图 12.1 所示，并且不会结束（除非你的组织决定停止使用\
  \ Salesforce）。\n\n![](img/307881206539c45e128c538a4b6912f8_288_0.png)\n\n图 12.1\
  \ – 与推广同步的持续改进\n\n我们可以总结关键的持续活动如下：\n\n-   将组织转变为产品型组织\n-   治理你的 Salesforce 项目和平台\n\
  -   演进你的 Salesforce DevOps 能力\n-   管理和治理数据质量\n-   利用你的 C360 数据以最大化 Salesforce 投资\n\
  -   领导并激励组织内的同行\n\n最后三个主题将在下一章中介绍。\n\n让我们从产品型组织开始。\n\n### 将组织转变为产品型组织\n\n在过去十年中，数字化转型举措\
  \ – 近期因 COVID-19 大流行而加速 – 已在中大型组织中变得无处不在。文献很快指出这些举措的失败率 – 原因通常被归结为缺乏用户参与、跨职能协调、高层承诺和战略一致性。这些领域中的大多数都由\
  \ **产品型组织** 所解决。\n\n**产品管理** 的概念起源于宝洁公司，Neil McElroy 写了一份备忘录，要求招聘人员并围绕单一产品或品牌进行组织。*品牌经理*\
  \ 的最终责任是管理产品生命周期、销售和促销 – 由实地测试和客户互动支持。自那以后，出现了许多额外且互补的概念、理论和实践，包括看板（1940 年代）、Kaizen（战后）、敏捷宣言（2001\
  \ 年）、DevOps（2007 年）和精益创业（2011 年）。\n\n### 提示\n\n如果数字产品管理和产品型组织的概念对你来说完全陌生，你可以从阅读\
  \ Eric Ries 的 *The Lean Startup* 和 Marty Cagan 的 *Inspired: How to Create Tech Products\
  \ Customers Love* 开始你的学习之旅。\n\n这都很好，但这一切与现代技术产品型组织有何关系？让我们从一些定义开始。\n\n产品型组织是一个不断努力改进其产品组合的组织，其产品组合由功能组成，以为客户提供利益。\n\
  \n让我们将其翻译到 Salesforce 项目的背景下：\n\n它是一个不断努力改进其 Salesforce 解决方案以为其 Salesforce 用户（员工、客户和合作伙伴）提供价值的组织。\n\
  \n根据 *Open Agile Architecture* 中的 **敏捷成熟度模型** – **The Open Group** 的标准，你可以在 https://pubs.opengroup.org/architecture/o-aa-standard-single/\
  \ 查看 – 组织若不采用产品驱动型组织的特性和实践，就无法进入敏捷成熟度的更高水平。\n\n### 重要说明\n\n虽然大量文献主要关注为外部客户打造优秀产品，但产品型组织的概念和实践可以很容易地转化为为你的外部客户和合作伙伴以及所有内部用户构建\
  \ Salesforce 产品。\n\n让我们先开始识别你的 Salesforce 平台的产品。\n\n### 了解你的产品\n\n数字产品是传递价值的载体。这可能显得模糊和抽象，这也是许多组织难以定义其产品的原因，如图\
  \ 12.2 所示：\n\n![](img/307881206539c45e128c538a4b6912f8_290_0.png)\n\n图 12.2 – Comic\
  \ Agile #218 – 产品型组织\n\n\n\n闲话休提，你组织的 *Salesforce 产品* 具体是什么，取决于你组织、用户、客户和合作伙伴的性质。\n\
  \n让我们看一个在 Salesforce *平台* 上为 PME 的 *客户* 构建的 *产品* 示例：\n\n- 面向 PME 的 *销售代表* 的 Salesforce\
  \ *应用*\n- 面向 PME 的 *客户服务代表* 的 Salesforce *应用*\n- 一个 **Commerce Cloud** *商店前端*，具有自助功能，供\
  \ PME 的 *客户* 下单和记录案例\n- 一个 Salesforce **Experience Cloud** *站点*，供 *分销商* 与 PME 协作处理线索和商机\n\
  \n接下来，让我们达成一致。\n\n## 使你的 Salesforce 平台的愿景、战略和所有权保持一致\n\n好消息是，如果你初始 Salesforce 版本的开发和推广与本书前几节所述类似，那么你已经\
  \ *完成* 了作为产品组织所需采取的 *行动* 的一部分。你已指派并授权 **产品负责人** 负责向用户提供的产品。\n\n现在，*作为* 产品组织 *做事*\
  \ 和 *行动* 与 *成为* 产品组织并不相同——转型涵盖多个维度，包括以下关键要素：\n\n- 对 Salesforce 用户痛点和需求的深入且不断增长的\
  \ *洞察*，以及你提供的产品（Salesforce 解决方案）如何让他们的工作更轻松、更高效\n- *组织对齐*，以从项目制组织转型为产品组织，其中包括以下内容：\n\
  \  - 将你的业务战略与 Salesforce 平台和产品战略保持一致。\n  - 将你的资金模式从资助项目（工作说明书）*转变为* 资助 **跨职能产品团队**，这些团队持续交付增量价值。这至关重要地包括将资金与产品负责人授权挂钩，以优先考虑路线图项目——该项目源于用户洞察与组织战略意图之间的微妙平衡。\n\
  \  - 利益相关者对 Salesforce 产品路线图的认可和参与。\n  - 成熟你的 Salesforce 平台治理结构，由 Salesforce **卓越中心\
  \ (CoE)** 驱动\n  - 重新定义你的 (IT) **运营模式** 并提升 Salesforce DevOps 能力\n\n在你的平台和产品愿景、战略和所有权保持一致后，让我们设定一些目标。\n\
  \n## 为你的 Salesforce 平台和产品设定目标\n\nSalesforce 是一个广泛的 SaaS 云和附加组件套件，也是 PaaS。这意味着你可以扩展和增强\
  \ **开箱即用 (OOTB)** 功能和应用——并自行构建。\n\n对于大多数组织而言，投资 Salesforce 是将统一和整合到一个 CRM 平台的战略决策。它们的愿景很少是让\
  \ Salesforce 平台仅为单一用户群体提供一种解决方案（云、产品或应用）；而是成为拥有多个产品供多个用户群体使用的 **战略平台**。\n\n如果这也是你组织的目标，这意味着你需要在\
  \ Salesforce *平台* 和 *产品* 两个层面考虑并使你的愿景和战略保持一致。\n\n### 提示\n\n如果你组织的愿景和战略对你来说还不够清晰，请与\
  \ Salesforce 计划的赞助人沟通。你也可以回顾 *第 1 章，创建你的 Salesforce 项目愿景*，以获取方法并获得灵感来确定 Salesforce\
  \ 计划和平台的愿景。\n\n在你的 Salesforce 平台和产品战略保持一致后，你需要为你的 Salesforce 平台和产品设定 **产品目标**。\n\
  \n如果你有多个产品且有不同的产品负责人，你应该在 Salesforce 平台层面以及每个产品领域为其定义产品目标——例如，销售、客户服务、现场服务、商务和数字营销。\n\
  \n### 重要说明\n\n**在跨职能敏捷团队中组织**——一个敏捷团队需要且只能有一个 PO，且一个敏捷团队只有一个待办事项。开发人员（功能型或程序型）应仅是其中一个敏捷团队的成员（Scrum\
  \ Master 和 QA 专家最多可服务两个团队）。原因很简单；如果开发人员属于多个敏捷团队——拥有不同的 PO——就会出现开发人员应如何决定处理哪个产品待办事项的问题。解决这个难题需要\
  \ Scrum Master 之间进行低效的跨团队规划来确定每个团队的能力分配，更不用说开发人员日常上下文切换造成固有的低效。\n\n平台和产品目标的目的是帮助指导你的团队确定下一步优先构建什么。\n\
  \n### 重要说明\n\n尽管在本节中我们一直在讨论组织转型以成为产品组织，但如果你组织的产品组织概念完全陌生，你可以选择从 Salesforce 计划和平台开始，为你的组织引领方向。\n\
  \n警惕潜在的抵制，花大量时间与利益相关者互动、讨论和分享概念以让他们加入。你的 Salesforce 计划赞助人需要在该过程中深度参与。\n\n在本节中，你了解了产品组织、如何转型成为产品组织，以及如何使组织战略与\
  \ Salesforce 平台战略和愿景保持一致。让我们介绍持续改进阶段的治理，以及如何创建路线图并将其与你的战略和产品目标联系起来。\n\n## 管理你的 Salesforce\
  \ 计划和平台\n\n随着 Salesforce 计划和平台为你的组织服务而发生许多变化，拥有稳固的治理对于稳定和增长至关重要。\n\n让我们先来看看 Salesforce\
  \ CoE 在 Salesforce 计划和平台治理中的作用。\n\n## 更新你的 Salesforce CoE\n\n你的 Salesforce CoE 仍然是负责监督\
  \ Salesforce 计划的总体治理机构。它整合知识、工作方式指南和变更管理，并管理业务、技术和数据治理的治理结构和论坛。\n\n在持续改进阶段，你的 Salesforce\
  \ CoE 中的关键领导角色如下：\n\n- **Salesforce 平台负责人**：这是 Salesforce 平台及其路线图的负责人和总体责任人：\n \
  \ - 有些组织也将此角色称为 **首席产品负责人** 或 **产品经理**。如果你的 Salesforce 平台为不同用户群体提供多个不同的解决方案，你可能有这些产品的不同产品负责人：\n\
  \    - 尽管你可能有多个产品，但你可以按领域或能力对其进行分组，以简化所有权和产品管理结构。\n\n### 重要说明\n\n必须将计划、平台和产品资金授权直接与平台和产品负责人挂钩，以赋能他们并实现所有权。\n\
  \n你可能会认为这样的授权只能给予组织内的高级领导——你绝对是正确的。Salesforce 平台和产品负责人确实是适合资深、经验丰富的专业人士的高级职位。\n\n\
  - **Salesforce 平台架构师**：他们负责 Salesforce *平台* 的架构愿景，以及你 Salesforce 组织的性能、可靠性、安全性和灵活性。\n\
  - **Salesforce 计划负责人**：他们负责组织和构建 Salesforce 计划、资源配置和预算编制，并促进治理论坛。\n\n**Salesforce\
  \ 计划赞助人**：这是来自你组织高级领导层的执行赞助人，提供指导和支持。\n\n请回顾 *第 3 章*，*确定如何交付你的 Salesforce 项目*，以了解\
  \ CoE 的基础设置。\n\n管理、治理和利用你的 Salesforce 数据将在 *第 13 章*，*管理你的 Salesforce 数据以收获 Customer\
  \ 360 的成果* 中介绍。\n\n让我们看看你的合作伙伴模式。\n\n## 在持续改进阶段调整你的合作伙伴模式\n\n当你从初始 Salesforce 版本的开发和推广过渡到持续改进阶段时，有许多原因需要考虑修改你的合作伙伴模式：\n\
  \n- **能力**：你初始版本的实施合作伙伴具备资格和能力支持你在 MVP 技术范围内的实施，但未涵盖 Salesforce 路线图上的即将推出的能力：\n\
  \  - 这是有道理的，因为大多数实施合作伙伴能够支持 Sales Cloud 和 Service Cloud 等核心 Salesforce 云的实施，但并非所有人都精通\
  \ **Commerce Cloud**、**Mulesoft**、**Revenue Cloud (CPQ)**、**Field Service Lightning**\
  \ 和 **Marketing Cloud** 等产品\n- **内部策略**：组织通常设有内部团队，专注于 Salesforce 管理、用户管理、持续维护、支持，以及对\
  \ *现有* 当前受支持能力的变更和新功能请求的开发：\n\n- 很少有组织具备规模，使其内部团队能够覆盖前面提到的所有项目，同时还具备推动大型举措（如为新用户群扩展新云）所需的业务和技术技能\n\
  \n接下来，考虑以下哪些领域最适合由你的内部团队、合作伙伴或两者结合管理：\n\n- 基础用户管理和简单的服务台工单\n- 管理小型变更请求\n- 系统监控和评估\
  \ Salesforce 每年的三次发布\n- 敏捷产品团队交付新功能\n- 技术设计治理\n- 项目管理与中期规划\n- 变更管理与沟通\n\n在确定时，考虑每个领域是否在贵组织的核心能力范围内。如果某个领域不在核心能力范围内，请考虑利用合作伙伴的专业知识。\n\
  \n在 Salesforce CoE 和合作伙伴模式确定后，让我们继续讨论你的 Salesforce 路线图。\n\n## 重新审视和维护你的 Salesforce\
  \ 路线图\n\n回顾你在 *第 2 章，定义你的 Salesforce 项目的性质* 中创建的路线图。在 Salesforce 之旅的预开发阶段的业务负责人，可能已在初始\
  \ Salesforce 实施的开发阶段成为产品负责人。\n\n初始版本开发并正在推广后，他们应该做什么？回到老工作？不！还有一项伟大（且持续）的任务需要完成，以进一步改进并最大化\
  \ Salesforce 平台和产品为用户和组织带来的价值。\n\n以下是平台负责人和产品负责人（们）需要理解、整合并最终优先排序的待办事项来源：\n\n- **在\
  \ Salesforce 计划的持续改进阶段开始时**（在首个版本初始上线后不久），执行以下操作：\n  - 审查贵组织最初为 Salesforce 项目考虑的功能：\n\
  \    - 如果你按范围分阶段推出 Salesforce —— 例如按业务领域（例如销售、服务和营销）—— 你将把这些作为路线图的输入\n  - 在初始实施的不同阶段被取消范围的项目：\n\
  \    - 前期架构阶段中被取消范围的史诗和用户故事\n    - 开发阶段在冲刺演示和 UAT 中捕获的功能或变更请求\n    - 在推广阶段的培训期间以及超护理期间捕获的功能或变更请求\n\
  - **持续改进你的 Salesforce 产品：** 持续改进 Salesforce 平台产品的输入来源包括以下内容：\n\n- 来自用户的变更请求\n- 来自用户的新的功能请求\n\
  - 变化的战略和优先级\n- 变化的市场条件\n- 组织变更\n- 技术创新 —— 对于大多数 Salesforce 产品每年有三次发布，有大量新功能可供考虑利用（如果它们能为用户和组织增加价值）；毕竟，你为此付费了\n\
  \n大多数组织难以将新的中大型功能请求转化为现有 Salesforce *产品* 的新能力（史诗）。这很有道理 —— 你的组织为包含许多开箱即用功能性的许可证付费，这些功能性可以通过配置和定制来使工作更轻松、更高效。此外，随着用户开始使用\
  \ Salesforce，他们会投入精力使其发挥自身优势，因此会提出更多功能请求。\n\n确保你有一个结构化的流程来倾听、收集和评估反馈，以及传达你的决策。\n\
  \n### 提示\n\n考虑使用 **产品管理系统** 作为产品经理（Salesforce 平台和产品负责人）功能专用的记录系统，并帮助他们创建和维护路线图。\n\
  \n让我们看看如何区分不同产品待办事项类型的性质：\n\n| 类型 | 产品待办事项示例 | 决策模型 | 提前期目标 |\n|------|------------------|----------|------------|\n\
  | 主题 | 请求新的 Salesforce *产品*（例如，新的 Salesforce 云，如 **Service Cloud**、**Marketing Cloud**\
  \ 和 **Commerce Cloud**，或主要附加组件如 **CPQ** 和 **Field Service Lightning**）以支持 Salesforce\
  \ 平台上的新用户群。这些可能是你决定分阶段稍后实施的原始路线图想法，或基于创新和 Salesforce 提供的服务而提出的新请求。 | 类似于本书中 *第 1\
  \ 部分，预开发阶段* 描述的过程 | 一个或多个程序增量。或者，遵循混合交付方法来构建新解决方案的首个版本。 |\n| **史诗** | 支持 *当前使用云*\
  \ 上新能力的新、较大的功能请求。原始路线图史诗，分阶段在现有云上稍后实施。 | Salesforce PO 基于收益假设分析与 **项目委员会** 共享的史诗优先级排序\
  \ | 一个或多个冲刺，但少于一个程序增量。 |\n| **用户故事** | 对 *当前支持功能* 上现有功能的变更请求和增强请求。也为新史诗创建。 | PO\
  \ 通过按业务价值和与产品目标的一致性对 **产品待办事项** 进行排序来确定。 | 必须能够在一个冲刺内完成。如果不能，则拆分为更多用户故事。 |\n\n表\
  \ 12.1 – Salesforce 产品待办事项类型\n\n如表 12.1 所述，添加一个全新的主题（新的 Salesforce 云或主要附加组件）是一项庞大的工作，你应考虑以与本书前几部分所述大致相同的方式进行。\n\
  \n### 提示\n\n当你评估新功能和增强功能的请求时，请查看 Salesforce Roadmap Explorer，网址为 https://architect.salesforce.com/roadmaps/roadmap-explorer，以查看是否有任何即将发布的版本可能支持该请求。\n\
  \n通常计划采用新的开箱即用功能比自行构建更好。请注意，路线图浏览器描述的是意图，而非承诺 —— 请据此做出决策。\n\n你需要一个结构和流程来持续收集、筛选和优先排序新请求。SAFe\
  \ 提供了不同的配置来管理新想法，例如带有 **程序 KanBan** 的 **项目委员会**，以及定期节奏来审查、提供反馈并支持史诗向下一阶段的进展。PO 应该能够快速解释其决策和优先级排序，因为史诗的收益假设如何与产品目标挂钩应该一目了然。因此，项目委员会并非旨在成为决策机构，也不应成为冗长讨论和演示的论坛。\n\
  \n### 提示\n\n你的 PO 可以，除了收益假设和史诗与产品目标的一致性之外，使用 **加权最短作业优先（WSJF）** 模型，如 SAFe 框架所述。你可以在此处阅读更多相关信息：https://www.scaledagileframework.com/wsjf/。\n\
  \n你应确定如何将路线图史诗推进到开发管道。有不同的选项可以将 Salesforce 路线图转化为中期计划。根据 Salesforce 计划的规模和敏捷团队的数量，你可以选择较小的或较大的规划设置。\n\
  \n两个大型敏捷设置常见框架是 **Large-Scale Scrum (LeSS)**（[https://less.works/](https://less.works/)）和\
  \ SAFe 的 **程序增量（PI）规划**（[https://www.scaledagileframework.com/pi-planning/](https://www.scaledagileframework.com/pi-planning/)）。\n\
  \n### 重要说明\n\n你应选择一个适合 *你的* 组织需求、背景和敏捷成熟度以实现持续改进的框架。\n\n让我们现在转向难以捉摸的技术债务概念。\n\n\
  ## 管理技术债务\n\n技术债务最好通过其症状和产生方式来描述。\n\n技术债务的症状 —— 或影响 —— 包括系统可用性下降、性能变慢、数据损坏以及安全风险和问题增加。这些症状表现为错误报告数量增加、采用率下降以及创新速度放缓。\n\
  \n技术债务以以下方式产生或累积：\n\n- 基于以下原因对 Salesforce 平台进行不良更改：\n  - *设计不良* 的解决方案，其维护程度高，超过了解决方案本身的好处\n\
  \  - *治理不良* 的解决方案，已超出其原始用途的范围\n- 为 *错误的问题* 创建出色的解决方案：\n  - 如果解决方案设计良好但未解决正确的问题，它不会带来业务价值，只会造成混乱\
  \ —— 技术债务\n\n\n\n- *不做任何更改* 对你的 Salesforce 平台：\n  - 世界正以加速的速度变化，组织也在变化以保持领先或跟上这些变化。如果您向用户提供的产品——您的\
  \ Salesforce 解决方案——没有随组织一起变化，它们最终实际上会成为技术债务。\n\n不可能没有技术债务，而且消除现有债务并不是一次性活动；相反，这是一项持续的管理工作。这并不意味着你应该无所作为——恰恰相反！\n\
  \n你需要实施 *治理结构* 来限制引入到 Salesforce 平台的新技术债务量，并 *持续修复* 组织中阻碍进展的债务。\n\n## 重要说明\n\n确保您的\
  \ Salesforce 平台架构师与平台负责人和产品负责人(们)密切合作，以确保架构原则和技术使能（参见 [第 2 章](Chapter 2)，*定义您的 Salesforce\
  \ 项目的性质*）包含在对 Salesforce 平台的更改和新解决方案中。\n\n我们将在 [第 14 章](Chapter 14)，*持续改进阶段应避免的常见问题*\
  \ 中讨论防止和缓解技术债务的常见问题和策略。\n\n在建立了您的 Salesforce 路线图——在功能特性、技术使能和重构以管理技术债务之间取得平衡——之后，让我们现在转向您的\
  \ Salesforce DevOps 能力。\n\n## 演进您的 Salesforce DevOps 能力\n\n为了在 Salesforce 计划的持续改进阶段实现成功并安心地释放更多\
  \ Salesforce 投资的价值，您需要了解并提升组织的 DevOps 能力。\n\n您在初始 Salesforce 发布开发和推广阶段使用的流程和能力适用于这些阶段——初始实施和推广。*现在*，您需要设置\
  \ Salesforce 计划，以便能够 *持续* 收集反馈、构建、发布并确保新功能的使用和采用——同时确保您的 Salesforce 组织具有性能、可靠性和安全性。\n\
  \n让我们先介绍 DevOps。\n\n## 介绍 DevOps\n\n2004 年，Charles A. O’Reilly III 和 Michael L.\
  \ Tushman 发表了一篇题为 *兼具双重能力的组织* 的论文（您可以在此处阅读论文：https://hbr.org/2004/04/the-ambidextrous-organization）。\n\
  \n**兼具双重能力的组织** 的特征是能够同时很好地完成两件不同的事情。那两种能力是什么呢？*管理运营* 的能力以及 *发展组织* 的能力。听起来熟悉吗？是的，这与\
  \ DevOps 非常相似——这一运动直到 2007-2008 年几年后才真正开始。\n\n该论文证明，兼具双重能力的组织在其行业同行中表现最佳，其中 90%\
  \ 的组织始终实现了其设定的目标。\n\n毫不奇怪，我发现那些在实施和演进 Salesforce 方面最成功的组织，是能够在创建可用、高性能、可靠且安全的 Salesforce\
  \ 平台的同时，持续为用户提供增量业务价值的组织。这就是脚踏实地同时仰望星空的情况。\n\n虽然兼具双重能力的组织的理论是对整个企业的一般理论，但 DevOps\
  \ 关注且一直关注的是 IT 系统的开发和运营领域。\n\n## 理解 DevOps 的原则和目标\n\n随着敏捷交付方法自 2000 年代和 2010 年代兴起以来变得越来越普遍，开发团队交付新功能的速度加快了。尽管听起来很棒，但这在某种程度上是以降低系统可靠性为代价的。这意味着用户体验更不稳定，同时也给\
  \ IT 运营团队带来头痛。\n\nDevOps 运动应运而生，通过将 IT 开发和运营团队以及 *业务* 结合起来，以促进一种 *整体思维和共同目标*，即在保持稳定运营的同时如何交付价值，如图\
  \ 12.3 所示的持续 DevOps 循环所示：\n\n![](img/307881206539c45e128c538a4b6912f8_305_0.png)\n\
  \n图 12.3 – 持续 DevOps 循环的八个步骤\n\n根据 2022 年 **DevOps 研究与评估 (DORA)** 的 *DevOps 现状*，有五个指标可以衡量组织的\
  \ DevOps 能力：\n\n- 一个指标与 *运营绩效* 相关：\n  - **可靠性**：涵盖可用性、延迟、性能和可扩展性\n- 四个指标与 *软件交付绩效*\
  \ 相关：\n  - **变更前置时间**：从变更提交到发布到生产的时间\n  - **部署频率**：部署到生产环境的频率\n  - **变更失败率**：部署失败或需要热修复或其他返工才能正常工作的部署所占百分比\n\
  \  - **平均恢复时间**：这与前一个指标相关——衡量变更失败或事件后恢复服务所需的时间\n\n## 提示\n\n您可以在此处阅读完整的 2022 年 DORA\
  \ DevOps 现状报告：\nhttps://services.google.com/fh/files/misc/2022_state_of_devops_report.pdf.\n\
  \n现在让我们转向 Salesforce。\n\n## 提升您的 Salesforce DevOps 能力\n\n那么，在 Salesforce 平台环境中，DevOps\
  \ 意味着什么？它是在优化如何向 Salesforce 平台和产品的用户交付价值。\n\n那么，持续改进阶段有什么不同？在混合敏捷模型中，在开始之前就提前定义了史诗和用户故事，并在推广阶段的专门阶段进行开发和测试，然后进行\
  \ SIT、UAT、生产发布和用户入职。现在，在持续改进阶段，您应旨在采用 DevOps，以便能够执行所有这些步骤并频繁发布更改。\n\n让我们分解 DevOps\
  \ 流程的八个步骤（参见 *图 12.3*），看看它在 Salesforce 环境中意味着什么，以及您的组织可以考虑使用哪些工具来支持它。\n\n## 精简您的\
  \ Salesforce 运营\n\n虽然 DevOps 绝对是一个集成流程，但其中有些部分主要侧重于运营，有些则侧重于开发。\n\n我们将从 Salesforce\
  \ *运营* 开始，也称为 **Salesforce 管理**，原因很简单：如果出了问题，就无法有效地进行开发。\n\nSalesforce 管理的目标是确保可靠性、性能和安全性。\n\
  \n核心 Salesforce 管理包括以下内容：\n\n- 管理您的 Salesforce 生产环境并为用户提供支持\n- 可能管理生产支持环境\n- 用户管理：\n\
  \  - 为新入职和离职人员进行配置和取消配置\n  - 员工更换角色，需要新的权限集、组和队列成员资格\n\n## 提示\n\n阅读 Salesforce 管理员博客文章，了解用户管理的未来，网址为\
  \ https://admin.salesforce.com/blog/2022/the-future-of-user-management。\n\n根据组织的规模，Salesforce\
  \ 管理还可能包括以下内容：\n\n- 管理、维护和创建沙盒——包括数据\n- 处理用户的新功能请求\n- 处理用户的错误报告\n- 维护培训材料\n- 新用户/员工培训后问题的第一线支持\n\
  - 每次 Salesforce 发布时每年三次回归测试关键流程\n- 报告和仪表板的支持和创建\n- 管理数据并执行数据加载请求（我们将在 *第 13 章，管理您的\
  \ Salesforce 数据以收获客户 360 的成果* 中更详细地介绍数据管理和治理）\n\n## 提示\n\n虽然为用户确保稳定、安全和可靠的 Salesforce\
  \ 组织至关重要，但请注意不要让自己陷入困境——变得过于僵化，过度优化管理流程，或为 *运营* 分配过多资源而牺牲 *开发* 的资源。\n\n运营的另一个关键方面是\
  \ **监控**，它应与 Salesforce 开发交织在一起。监控的目标是观察采用情况、系统性能、可靠性和安全性。至关重要的是，目标还包括 *持续收集改进反馈*。\n\
  \n\n\nThe following activities describe the ways you should be monitoring your Salesforce\
  \ org:\n\n- 跟踪并了解您的 Salesforce 产品采用情况和使用情况\n- 监控平台性能和安全性\n\n### 提示\n\nCheck out\
  \ the SalesforceBen article for free ways to monitor your Salesforce organization\
  \ at https://www.salesforceben.com/free-ways-to-monitor-your-salesforce-org/.\n\n\
  - 定期进行技术和安全审计\n- 监控收到的功能请求\n- 监控收到的错误\n- 促进冲刺回顾和演示\n\n### 提示\n\nHere are a few ideas\
  \ you can use to improve how you collect feedback:\n\n- 促进用户反馈论坛。\n- 与 Salesforce\
  \ 产品用户中的超级用户代表保持定期节奏。按 Salesforce 产品和用户组举办论坛。\n- 您应为用户和其他利益相关者提供简单的模板和方法，以便提交新的功能请求以及对现有功能的更改。\n\
  - 使用 a **product management system** to consolidate user feedback, validate ideas,\
  \ create roadmaps, and integrate with your development tool. Leading product management\
  \ system vendors include **Productboard**, **Aha!**, and **JIRA Discovery**。\n\n\
  - While development-focused tools such as Jira and Azure DevOps have some of the\
  \ same features as a dedicated product management system, their focus – and specialism\
  \ – is to support the agile development process, *not* user insights collection,\
  \ ideas validation, prioritization, and Salesforce product roadmap creation.\n\n\
  Let’s move on to the development of new features for your Salesforce platform users.\n\
  \n## Optimizing your Salesforce development process\n\nThe Salesforce development\
  \ process starts with **planning**. The goal of planning is to order the product\
  \ backlog and get the user stories towards the top of the product backlog to meet\
  \ the **definition of ready**.\n\nThe definition of ready is unique to each organization.\
  \ Let’s see how our scenario company, **Packt Manufacturing Equipment (PME)**, defined\
  \ their definition of ready:\n\n- 用户故事标题、需求、目的、上下文和细节\n- 其相关的史诗\n- 验收标准\n- 业务价值\n\
  - 解决方案设计\n\n### 提示\n\nYou should also consider requiring user stories to state any\
  \ required maintenance of the solutions proposed.\n\n- **Change impact**, assessed\
  \ for the following:\n\n- **User impact**: How big a change does this user story\
  \ provide for users?\n- **Technical impact**: How much does the user story impact\
  \ your technical architecture?\n- **Regression test impact**: How much does the\
  \ user story change and interfere with the business process in context? Technically,\
  \ how many metadata components does the user story interfere with or change?\n\n\
  ### 提示\n\nThere are many tools available to help you analyze the technical and potential\
  \ regression test impact, including **Elements Cloud**, **Metazoa**, **Salto**,\
  \ and **Happy Soup**.\n\n- If the nature of the user story requires it, its solution\
  \ design is reviewed by the **design authority (DA)**\n\n### 提示\n\nYou can opt to\
  \ only require the DA to review user stories where the solutions contain changes\
  \ that potentially pose a greater technical and security risk to your Salesforce\
  \ platform. These can include data model changes, security and sharing model changes,\
  \ integrations, programmatic development, and complex automations. You can read\
  \ more about setting up a design authority in the *Governing your Salesforce project\
  \ in the development phase* section in *Chapter 7*, *Building and Testing Your Initial\
  \ Release*.\n\nWhy is it important for user stories to meet the definition of ready\
  \ before starting development? Because you need to know what is going to be developed\
  \ and released is based on a clear understanding of user needs. Moreover, that it\
  \ is designed in line with both your development guidelines and best practices,\
  \ and in a way that ensures users will want to use it.\n\nYou may decide to hold\
  \ regular **backlog refinement** sessions to support your product owner in creating\
  \ and qualifying product backlog items and to order their product backlog. In a\
  \ backlog refinement session, a product owner, a business analyst, a customer experience\
  \ expert, and perhaps a solution architect will typically do the following:\n\n\
  - Create and qualify product backlog items\n- Assess change requests and user feedback\
  \ forum input\n- Review incoming bugs\n- Break new epics into user stories\n- Assign\
  \ stories for solutioning ahead of design authority sessions\n- Order the backlog\
  \ ahead of sprint planning\n\n### 提示\n\nYour product owner can use the following\
  \ methods and measures to qualify user stories and determine their order in the\
  \ product backlog:\n\n- How each item ties back to the product goals\n- The business\
  \ value it delivers\n\nIf you are using Scrum, **sprint planning** will happen on\
  \ a regular cadence (every 1–4 weeks), with the goal of determining a sprint goal\
  \ and defining the sprint backlog by filling it up with user stories to the capacity\
  \ of the agile development team. You may recall the options for defining and measuring\
  \ sprint capacity in *Chapter 7, Building and Testing Your Initial Release*. To\
  \ progress your agile maturity, you should consider using the pure agile concept\
  \ of story points.\n\nSprint planning goes as follows:\n\n1. Before sprint planning,\
  \ the PO orders the product backlog.\n2. The PO presents the user story at the top\
  \ of the product backlog.\n3. Story points are assigned using **scrum pokering**.\n\
  \n### 提示\n\nFor virtual story point pokering, https://www.scrumpoker-online.org\
  \ is a great online tool.\n\n4. The user story is assigned to the sprint backlog\
  \ by the scrum master.\n5. The process is repeated until team capacity (story points)\
  \ are assigned.\n\n### 提示\n\nThe first sprint planning when you introduce story\
  \ point pokering will be an abstract exercise, as your team members won’t (yet)\
  \ have a common, shared frame of reference of what the nature of a seven-story-point\
  \ user story is. Neither does your team have a history of sprints to know what their\
  \ capacity is. The important thing is just to get started – take a leap of faith.\
  \ The common frame of reference is typically established quite quickly, within one\
  \ or two sprint planning sessions. For development capacity, you need to go with\
  \ a vote of confidence from the team members in the first sprint planning. Experienced\
  \ developers have a good gut feeling of how big, complex, and risky different user\
  \ stories are, and they will share when they are losing confidence in the team’s\
  \ ability to complete the sprint backlog.\n\nNext is **coding** or the actual development\
  \ done by functional consultants and developers. The goal with development – not\
  \ surprisingly – is to configure and develop solutions on your Salesforce platform.\n\
  \nRefer to the *Setting up your development model and environments* section in *Chapter\
  \ 7*, Building and Testing Your Initial Release.\n\nAfter development comes **building**\
  \ or **continuous integration**, which entails merging the newly created or changed\
  \ metadata with the existing version of your Salesforce source, and identifying\
  \ any merge conflicts and resolving them. Refer to the *Deploying your Salesforce\
  \ solution through environments section in Chapter 9, Deploying Your Release and\
  \ Migrating Data to Production, to read more about **system integration testing\
  \ (SIT)**.*\n\nWhen choosing your deployment (CI/CD) setup and tooling, you face\
  \ the same challenge as when deciding how to build your Salesforce features – use\
  \ OOTB Salesforce, buy and use an AppExchange solution, or build your own solution.\
  \ Let’s understand the options as of January 2023:\n\n- **Salesforce OOTB deployment\
  \ tools**: Salesforce’s own tools include the following:\n  - **Change Sets**: A\
  \ legacy deployment tool. It’s cumbersome, inflexible, and doesn’t rely on a **version\
  \ control system (VCS)**.\n  - **DevOps Center**: This recently released feature\
  \ (GA in winter 2023) has some capabilities somewhat similar to the **COTS (Commercial\
  \ Off The Shelf)** tools described further on:\n    - It currently does not include\
  \ features such as impact analysis, data migration, and choosing delta or full deployment,\
  \ and can’t be extended in the same way you potentially could if you built your\
  \ own or were supported by some of the COTS CI/CD vendors.\n- **Buying a COTS CI/CD\
  \ solution**: Investigate which one of the many vendor solutions is best for your\
  \ organization. Popular vendors include the following:\n  - **Gearset, Copado, Salto,\
  \ Metazoa, and AutoRABIT**\n- **Building your own CI/CD pipeline**: This provides\
  \ full flexibility but requires a dedicated team to manage and improve the setup.\n\
  \n## 重要说明\n\n\n\n委派 Salesforce 技术架构师和/或 DevOps 架构师来分析哪种 DevOps 工具和路线图最适合您的组织，同时考虑您的资源、能力以及\
  \ Salesforce 平台的规模。\n\n提及的大多数 COTS CI/CD 工具都利用基于 Git 的版本控制系统。设置 VCS 是实施 DevOps 的基本先决条件步骤之一。为\
  \ Salesforce 设置和使用 VCS 对非技术团队成员来说可能具有挑战性。因此，在选择工具时请注意您预期的团队成员——并确保为如何使用它分配培训时间。\n\
  \n为帮助您选择行动方案，请阅读 Gearset 的博客文章 *《哪种 Git 托管提供商适合您的 Salesforce 团队？》*，网址为 https://gearset.com/blog/which-git-hosting-provider/。\n\
  \n在成功构建或集成组件后，下一步是 **测试**。测试的目标有三方面：\n\n- 测试用户故事的单个功能：\n  - 这包括正向和负向测试用例\n- 对用户故事所属流程进行回归测试，以检查其是否按预期工作\n\
  - 单元测试\n\n在考虑实施自动化测试工具时，请注意，无论您如何执行回归测试，随着新功能添加到您的 Salesforce 组织中，测试都需要定期更新，这需要在投资中予以考虑。可考虑的选项包括\
  \ **Provar**、**Testim** 和 **Selenium**。\n\n下一步是 **部署** 到生产环境，即将合并、集成并经过测试的解决方案部署到您的\
  \ Salesforce 生产环境中。DevOps 中部署的目标是持续部署，这意味着合并并经过测试的解决方案应尽可能频繁、快速地部署，以最大限度降低其过时的风险。\n\
  \n最后，还有将解决方案发布给用户的问题 **发布**。\n\n为什么要将部署和发布分开？并非总是如此，但从概念上讲是有意义的。仅仅部署解决方案并不能保证用户会使用它们。发布的目标是能够\
  \ **按需发布**（当您和用户准备好时）并确保使用和采用。\n\n在 Salesforce 中，**自定义设置**、**权限集** 和 **自定义权限** 是实现按需发布的\
  \ **功能标志** 的常见方式。\n\n## 提示\n\n了解有关使用自定义权限进行功能标记的更多信息，请查看此博客文章 https://blog.texei.com/why-we-should-use-custom-permissions-a8b5c22bbe94。\n\
  \n为了确保用户会使用（并且想要使用）您的新功能，您需要帮助、指导和支持他们——变更管理不会在 Salesforce 计划的持续改进阶段停止。您的变更管理工作应与变更的规模相符。\n\
  \n根据变更的性质和规模，您的变更和沟通工作可能包括以下内容：\n\n- 发布说明\n- 培训\n- 视频\n\n## 提示\n\n为了增强用户采用并最大限度地减少对同步培训的需求，请考虑使用\
  \ Salesforce **应用内指导** 或更复杂的 AppExchange 解决方案，例如 **Improved Help**。\n\n至此，您已完成了从运营到发布的循环。让我们现在反思并评估您当前的\
  \ Salesforce DevOps 设置。\n\n## 反思您的 Salesforce DevOps 之旅\n\n您的 DevOps 系统以及其他来源将告诉您您的\
  \ DevOps 能力在提供稳定运营环境的同时不断创新以造福用户和组织方面表现如何。完善 DevOps 能力的旅程永无止境。\n\n提示\n\n在 [https://www.devops-research.com/quickcheck.html](https://www.devops-research.com/quickcheck.html)\
  \ 参加 **DORA DevOps Quickcheck Quiz**，看看您组织的 Salesforce DevOps 设置与行业同行相比如何。\n\n尽管硬核\
  \ DevOps 指标会告诉您 DevOps 设置的性能如何，但请务必同时衡量您的 Salesforce 团队成员对工作生活的满意度。团队的工作满意度本身就是一个重要的追求目标，并且对\
  \ Salesforce 计划的成功也有巨大影响。\n\n重要说明\n\n采用 DevOps 思维和实践需要重新定义您的（IT）运营模式以及 IT 开发部门、运营部门和业务利益相关者如何协作以及如何组织。\n\
  \n现在让我们总结本章！\n\n## 摘要\n\n我们在本 Salesforce 计划的 *第 4 部分，持续改进阶段* 的第一章中涵盖了大量主题。首先，您了解了持续改进阶段活动的性质。然后，我们介绍了产品组织的概念，为什么您应该努力成为其中之一，以及如何开始组织转型。接下来，我们讨论了持续改进阶段的计划和平台治理。最后，我们谈到了\
  \ DevOps 的历史以及如何发展您的 Salesforce DevOps 能力。\n\n您现在已顺利过渡到 Salesforce *计划* 的持续改进阶段——超越了最初的\
  \ *项目* 实施。随着您实施本章中概述的概念和结构，您应该开始看到向用户交付价值的速度增加以及更可靠的系统。\n\n在下一章中，我们将介绍管理并利用您的 **Customer360\
  \ 数据** 以释放 Salesforce 投资的全部潜力。\n"
- "## 管理您的 Salesforce 数据以收获 Customer 360 的成果\n\n在本 Salesforce 计划的 *第 4 部分，持续改进阶段*\
  \ 的本章中，我们将介绍如何管理您的 Salesforce 数据以及如何利用它来最大化 Salesforce 投资的价值。首先，我们将介绍 Salesforce\
  \ 数据的生命周期以及如何管理其质量、访问和使用。接下来，我们将探讨在不同领域利用 Salesforce 数据的众多用例，使用不同的 Salesforce 功能和技术提供更好的用户和客户体验。最后，我们将展示您如何通过展示成功实施、运行和利用的\
  \ Salesforce 计划和平台的价值来激励组织中的同行。\n\n您将了解管理 Salesforce 数据生命周期意味着什么，以便优化用户和客户体验以及 Salesforce\
  \ 组织的性能并确保 **业务连续性**。您将了解 **数据质量属性** 以及如何提高 Salesforce 数据的质量。您将了解您的 Salesforce **卓越中心\
  \ (CoE)** 如何通过建立和运行 **数据治理委员会** 来构建其 **数据治理** 工作——当您的数据及其质量得到良好管理和治理时，您就可以开始收获您的\
  \ **Customer 360**——客户的视图（和数据）的成果。您将了解如何利用您可用的 **Customer 360** 数据来自动化流程并创建卓越的个性化体验，从而推动理想的业务成果——释放\
  \ Salesforce 投资的全部价值。您还将了解如何 **激励** 和 **领导** 您的组织进行更广泛的数字化转型之旅。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n- 管理和治理您的 Salesforce 数据\n- 利用您的 C360 数据以最大化 Salesforce 投资回报\n- 领导并激励您组织中的同行\n\n\
  开始吧！\n\n### 管理和治理您的 Salesforce 数据\n\n**数据** 是现在和未来的商业货币。有些人甚至会认为，除了员工之外，它是您组织最宝贵的资产。\n\
  \n尽管它很重要，但许多组织在真正利用其可用的数据方面存在困难。除了数据孤岛之外，我认为数据管理和其数据质量的 **治理** 是阻止组织在 Salesforce\
  \ 中发挥全部潜力的最大挑战。\n\n让我们直接深入了解您的数据生命周期。\n\n### 管理 Salesforce 数据的生命周期\n\n为了能够有效地管理和治理您的\
  \ Salesforce 数据，我们首先需要了解一些定义和概念。\n\n让我们先了解您在 Salesforce 组织中管理的不同 **数据类别**：\n\n-\
  \ **主数据**：这是通常属于企业内多种类型系统的数据，因此需要在一个系统中进行主数据管理：\n  - 示例包括客户、供应商、产品和资产\n\n\n\n- **交易数据**:\
  \ 这是与客户、合作伙伴和供应商开展业务时产生的数据：\n  - 示例包括商机、报价、订单、付款、案例和活动\n- **元数据**: 您的 Salesforce\
  \ Org 由元数据组成——您所做的配置和定制以使 Salesforce 为您的组织服务。\n- **参考数据**: 此数据是主数据的必要补充（但*不是*同一回事），因为它为交易数据提供上下文。它可能以\
  \ **元数据** 或 **配置数据** 的形式出现：\n  - 示例包括州和国家选择列表值、ISO 代码、忠诚度计划层级、客户细分名称和分类\n- **报告数据**:\
  \ 这包括您仅为报告目的而创建的任何数据。\n\n## 重要提示\n\n务必将您的 Salesforce 参考数据与组织的企业架构师和数据架构师保持一致，以确保系统间的一致性。\n\
  \n在 *第 6 章，详细说明初始版本的范围和设计* 中，我们介绍了 **数据字典** 的概念。确保在初始 Salesforce 版本之后继续保持其最新状态，以便为利益相关者——Salesforce\
  \ 数据的消费者——增加价值，并加速持续改进团队的开发工作。\n\n对于 Salesforce 数据对象的每个类别，您需要考虑 Salesforce 数据的生命周期——按数据类别和对象。因此，让我们就数据生命周期达成共识：\n\
  \n- **创建**: 数据何时创建，谁可以创建记录？\n  - 如果数据是系统生成的，什么会触发它？\n- **存储**: 数据何时存储在您的 Salesforce\
  \ Org 中，需要什么级别的加密（如果有）？\n- **使用**: 谁需要访问数据，用于什么流程，多长时间？\n  - 您的组织需要、想要或被允许存储这些信息多长时间？\n\
  - **归档**: 何时保留数据在 Salesforce 中不再具有增值？您有哪些流程和工具（例如批处理作业或企业工具）来管理定期归档（和备份流程）？\n\n\
  ## 提示\n\n考虑使用企业级 Salesforce 备份和恢复解决方案以确保业务连续性以及性能和合规性。领先的供应商包括 **OwnBackup** 和 **Odaseva**。\n\
  \n- **删除**: 数据何时不应再存在于 Salesforce 中或组织中？\n\n这些概念讲完后，让我们继续讨论数据质量。\n\n## 管理您的 Salesforce\
  \ 数据质量\n\n**数据质量** 有两个方面。如果您的数据质量总体良好，这将有助于提供愉悦的用户和客户体验，并最终带来良好的业务成果。相反，如果数据质量总体较差，则相反的情况会带来风险。\n\
  \n让我们先看看您的 **数据质量治理** 工作可以追求的 **目的**：\n\n- 确保良好的用户和客户体验\n- 使数据能够可靠地用于以下目的：\n  -\
  \ 报告和分析\n  - 沟通\n  - 自动化\n- 遵守法律法规或行业标准\n\n数据质量治理的目的明确后，让我们来看一下定义数据质量的维度：\n\n- **准确性**:\
  \ 您的数据在多大程度上代表真相？\n- **时效性**: 数据多久更新一次？何时创建？\n- **完整性**: 所有（相关）字段填充的程度如何？\n- **一致性**:\
  \ 捕获的信息一致性如何？\n- **重复**: 每个对象的重复记录百分比是多少？\n- **使用情况**: 用户在多大程度上使用数据进行自动化和分析？\n\n\
  需要注意的是，数据质量不是二元的，而是一个从非常低到非常高的光谱。没有任何组织能在所有数据质量属性上始终获得 100% 的分数。\n\n## 提示\n\n您可以通过在\
  \ Trailhead 上学习 *数据质量* 模块来了解更多关于数据质量的信息：\nhttps://trailhead.salesforce.com/content/learn/modules/data_quality.\n\
  \n作为您 Salesforce CoE 的一部分，您应该有一个论坛，一个负责监督您推动数据质量工作的治理机构。该机构就是您的 **数据治理委员会**。\n\n\
  在下图中，您可以看到我们的示例公司 **Packt Manufacturing Equipment (PME)** 如何在其 Salesforce 计划的持续改进阶段组织其\
  \ Salesforce CoE：\n\n![](img/307881206539c45e128c538a4b6912f8_324_0.png)\n\n图 13.1\
  \ – 带有数据治理委员会的 PME 的 Salesforce CoE\n\nPME 的 Salesforce 数据治理委员会在其 CoE 内运作，由数据管理员、领域数据所有者和敏捷产品团队的产品负责人组成。由于治理是一种理念而非管理/决策职能，该委员会的章程是制定指导方针和原则，以进一步提升\
  \ PME 的 Salesforce 数据管理和质量改进能力。PME 的数据治理委员会还审查任何分析的输出并探索改进这些能力的举措。\n\n考虑使用精益六西格玛\
  \ **DMAIC** 框架，您应执行以下关键活动来提高 Salesforce 数据质量：\n\n![](img/307881206539c45e128c538a4b6912f8_325_0.png)\n\
  \n图 13.2 – 精益六西格玛 DMAIC\n\n## 提示\n\n要了解有关 DMAIC 框架的更多信息，请访问此处：\nhttps://kanbanize.com/lean-management/six-sigma/dmaic.\n\
  \n让我们逐步了解每个步骤！\n\n## 定义\n\n您的 **数据管理员** 应主导定义组织在 Salesforce 平台支持的所有领域的数据质量目标。您的\
  \ **数据管理员** 不应单独进行此练习，而应与 **数据所有者**——数据的消费者和平台各领域的代表——一起合作。\n\n您可以使用数据质量目标模板来使目标具体化并付诸实践：\n\
  \n*[Field_Object_RecordType] 应为 [Quality Definition]，以便 [Stakeholder] 能够 [achieve\
  \ business value]*\n\n一个实用的数据目标示例如下：\n\n*“Record Type 为 Bill-To 的 Account 对象上的‘账单地址’”应“至少每年核实一次”，以便“财务团队”能够“以最低风险开具发票”*\n\
  \n## 衡量\n\n一旦您定义了数据质量目标，就需要跟踪您在这些目标上的表现。\n\n您可以在一定程度上使用免费工具来跟踪和衡量数据质量。包括以下内容：\n\n\
  - *数据质量分析仪表板* 来自 **Salesforce Labs**，您可以在此处找到：https://appexchange.salesforce.com/listingDetail?listingId=a0N300000016cshEAA&tab=e\n\
  - *ZoomInfo Field Trip – 发现未使用的字段并分析数据质量* 由 **ZoomInfo** 提供，您可以在此处查看：https://appexchange.salesforce.com/listingDetail?listingId=a0N3000003HSXEEA4&tab=e\n\
  \n要将数据质量提升到下一个水平，您可以考虑投资 Delpha 等付费解决方案，它提供重复记录的自动和手动合并。您可以在此处查看：https://appexchange.salesforce.com/listingDetail?listingId=a0N3A00000FMpuXUAT&tab=e.\n\
  \n## 分析\n\n一旦您有了跟踪数据质量的好方法，就需要分析它以发现趋势和差距。分析的结果应是改进数据质量的想法或举措。\n\n根据您的 Salesforce\
  \ CoE 设置和改进想法的性质，您可以决定执行以下任一操作：\n\n- 定期审查数据质量分析（例如每月）\n- 审查数据质量改进举措的临时输入\n\n根据 Salesforce\
  \ 设置和 CoE 的规模，设置报告并跟踪数据质量的责任可能在于您的 Salesforce 管理员、中央或本地数据分析师，或 BI/分析团队。\n\n## 改进\n\
  \n您的 Salesforce 管理员或其他合格人员应根据分析结果清理数据。\n\n这可能从记录创建和更新到提高 Salesforce 数据质量不等。也可能涉及归档或删除被认为不必要或不符合保留要求的数据，或提高\
  \ Salesforce 性能和用户体验。\n\n## 控制\n\n您的 **数据管理员** 应向您的 Salesforce（领域）产品负责人以及您的 Salesforce\
  \ 平台负责人（PO）推荐举措。PO 可以与您的 Salesforce 平台架构师一起评估并确定应采取哪些举措以减轻和最小化未来数据质量不佳的风险——并加以改进。\n\
  \n举措可能包括以下内容：\n\n- 为确保流程合规性和质量而进行流程再培训。\n- 修改您的应用程序和系统架构及配置。这可能包括创建/更新验证规则、自动化、记录访问更改以及更改用户权限。\n\
  \n您可以考虑实施工具来自动化常规数据操作。一些可考虑的工具包括以下内容：\n\n- Salesforce **Scheduled Flows** 是一个（相对）简单的声明式工具，原生于\
  \ Salesforce（需注意其容量和调度限制）\n- **ETL** 工具如 **MuleSoft** 和 **Informatica** 则完全处于光谱的另一端\n\
  \n对于涉及公开业务信息（如地址）之类的用例，请在 **AppExchange** 上搜索用于同步数据的应用。这些解决方案需要付费，因此请权衡应用的成本与 Salesforce\
  \ 团队（手动）更新数据所需的时间成本。\n\n如果你的 Salesforce 团队定期执行相同的数据清洗/更新操作，那么投资某种形式的简单自动化通常是一个直接的商业案例。\n\
  \n在考虑删除未使用的字段并 *与你的产品负责人以及潜在的终端用户代表进行验证* 时，请务必在此之前进行尽职调查，包括影响分析。\n\n### Tip\n作为最佳实践，请分两步删除字段。首先，从页面布局或动态表单中移除该字段并移除字段级安全访问权限。一个月后，如果没有利益相关者询问该字段去哪了或抱怨仪表板中缺少信息，请先备份包含该字段数据的任何记录，然后再删除该字段。\n\
  \n数据管理和治理是 Salesforce 项目持续改进阶段最重要的活动之一。接下来，我们将看看你如何逐步开始改进。\n\n## 开始数据质量治理\n你管理 Salesforce\
  \ 数据及其质量的好坏并非二元对立——它是一个光谱。\n\n如果你发现自己主要是在救火——例如进行响应式数据加载来纠正糟糕的数据质量——那么你在成熟度光谱中更接近低端。别担心，这意味着你有很大的改进潜力——这将为你的用户、客户和组织带来巨大好处。\n\
  \n### Tip\n要了解你的组织在数据管理方面的成熟度如何，请查看来自 *Experian* 的这篇文章： https://www.edq.com/blog/data-maturity-how-mature-are-you/.\n\
  \n那么如何开始呢？让我们来看一个可考虑的方法：\n\n- 1. 成立一个 Salesforce **数据治理委员会**，并将其锚定在你的 Salesforce\
  \ CoE 内部。\n- 2. 确定其章程，分配足够的资源，并确保从一开始就获得业务利益相关者的认可和参与。\n- 3. 与业务利益相关者合作，了解对他们而言最重要的哪些数据和哪些\
  \ KPI（可参考 *第 4 章*，*获得资金并与 Salesforce 和实施合作伙伴互动*，以获取灵感）。\n- 4. 评估并确定将使用哪些工具来支持你分析和管理\
  \ Salesforce 数据。\n- 5. 从此以后，遵循本章前面介绍的 DMAIC 模型。\n- 6. 最后，不要试图一次性确定、分析和修复所有问题：\n\
  \  - 1. 类似于你为用户提供新功能而演进的 Salesforce DevOps 能力，你应努力通过持续改进数据质量来 **提供持续、增量的价值**\n\n\
  ### Tip\n要了解更多关于 Salesforce 数据管理和数据质量的信息，你可以阅读以下内容：\n\n- *Salesforce Data Architecture\
  \ and Management* 作者 Ahsan Zafar（CTA）(https://www.amazon.com/Salesforce-Data-Architecture-Management-effectively/dp/1801073244)\n\
  - Salesforce 的文章 *Data Management Best Practice Guide*，链接在此： https://help.salesforce.com/s/articleView?id=000393223&type=1\n\
  \n接下来，让我们转向如何享受你在 Salesforce 及其数据质量方面的投资成果。\n\n## 利用你的 C360 数据最大化 Salesforce 投资回报\n\
  让我们先评估你组织的数据利用成熟度，然后开始讨论正事。\n\n你可以利用手头数据的不同方式。如果你思考自己如何使用 Salesforce 数据，你很可能会将其归类到以下某个阶段：\n\
  \n- **描述性**：*知道发生了什么*\n- **诊断性**：*知道为什么会发生*\n- **预测性**：*预见可能发生什么*\n- **规范性**：*建议采取行动来管理或利用预测可能发生的情况*\n\
  - **认知性**：*基于正在发生的事件和/或基于预期采取行动*\n\n### Important note\n你不能从描述性分析直接跳到认知分析。你必须逐步通过各个阶段。掌握每个层级并从中获得价值的关键成功因素是高质量的数据以及对该举措带来的准确性和价值进行持续验证。验证部分经常被试图跳过步骤的组织所忽略。验证最好由具有远见、努力为业务开拓下一个前沿的人以及对用例有深入了解和背景的人共同完成。这些可能是领域超级用户，他们最渴望摆脱基础、重复的任务或希望改进销售或服务流程。\n\
  \n理论部分讲完后，让我们深入探讨如何利用你的 Salesforce 数据为用户和组织释放价值。\n\n利用 Salesforce C360 数据主要有两种方式。如下所示：\n\
  \n- **知识和洞察：**\n  - 作为优化、数据驱动决策的基础\n- **自动化：**\n  - 用户的重复性、响应式手动任务\n  - 响应式或主动式操作\n\
  \n### Important note\n这两种方式不应被视为独立或脱节的，前者是后者的催化剂。随着你的组织在利用 C360 数据方面的能力成熟，微妙的界限会逐渐消失，看起来会淡化。\n\
  \n让我们看看利用 Salesforce C360 数据的潜在用例。\n\n接下来，让我们按业务领域和跨业务领域探索一些最明显和常见的利用 Salesforce\
  \ C360 数据的用例：\n\n- **营销**：用例包括营销运营洞察和自动化，包括由事件触发的启动或推进客户旅程。\n- **销售**：用例包括由 Sales\
  \ Cloud **Einstein** 驱动的销售生产力，用于洞察哪些线索最有可能转化以及哪些商机最有可能成交。对于商务而言，产品推荐是 Einstein 的一个很好的用例。\n\
  - **服务**：利用 Salesforce 数据来提高服务组织效率的用例众多。关键用例包括案例管理生产力，例如通过自动化案例创建（web-to-case、自助服务）或将\
  \ Einstein Case Classification 与 **Omnichannel** 基于技能的路由相结合来进行案例分配。如果你目前正在为客户提供（或考虑提供）聊天功能，你应考虑实施聊天机器人，使客户能够自助服务，从而将简单案例从在你的\
  \ Salesforce 组织中创建中转移出去。从菜单驱动的聊天机器人开始，随着你收集更多聊天数据，逐步过渡到基于意图的 **AI 聊天机器人**。\n- **跨领域**：对于所有领域，你都可以利用\
  \ Salesforce 平台功能来实现更高水平的生产力。这些包括 **Next Best Action**、**CRM Analytics Predictions**\
  \ 和 **Salesforce Genie***，等等，还有很多。\n\n### Tip\n*Salesforce Genie 是 Salesforce 的一个新层或产品套件。你应自行研究并根据可用的产品信息做出任何决策。了解有关\
  \ Salesforce Genie 的更多信息，请访问 https://www.salesforce.com/products/genie/overview/.\n\
  \n要了解更多关于 AI 和 Salesforce 的信息，你可以阅读 Lars Malmqvist（CTA）撰写的 *Architecting AI Solutions\
  \ on Salesforce*（https://www.amazon.com/Architecting-Solutions-Salesforce-state-art/dp/1801076014/）。\n\
  \n除了在你的 Salesforce 组织 *内部* 的分析和自动化用例外，让我们考虑与 *外部* 系统集成并自动化流程的用例：\n\n- **MuleSoft\
  \ RPA**：使用 MuleSoft，其中包括使用 **光学字符识别 (OCR)** 处理收到的文档并将其转换为系统可消费的数据：\n  - 用例可能包括通过\
  \ PDF 接收订单，而不是人工手动创建订单，MuleSoft 可以为你完成。\n- **MuleSoft Composer**：一种声明式（无代码）解决方案，使管理员和功能顾问能够设置跨系统流程自动化：\n\
  \  - 尽管 Composer 是一种声明式解决方案，但请确保遵循与任何集成相同的设计治理严谨性——要求解决方案设计由你的 **Design Authority**\
  \ 审查。\n  - 用例包括将案例更新发布到 Slack 频道。需要考虑的几点如下：\n    - Composer 设计用于低量流程，而非批处理或批量用例。\n\
  \    - 没有用于测试的沙箱概念，因此在通过将 Composer 流程连接到生产环境来“启用集成”时要谨慎。\n\n\n\n**MuleSoft Anypoint**：Anypoint\
  \ 是领先的企业级中间件（ESB）和 ETL 工具，是 Salesforce 产品组合的一部分。如果您在企业架构路线图中没有中间件或 ETL，您希望追求诸如 **API\
  \ 驱动的连接/API 经济** 之类的 IT 战略，并且您已在使用 Salesforce 作为 CRM，您应考虑 MuleSoft。\n\n接下来，让我们优先考虑您的举措。\n\
  \n## 优先考虑您的分析和自动化举措\n\n在您确定利用 Customer 360 数据的潜在举措时，了解在优先考虑要推进的举措时应考虑什么内容会很有用。\n\
  \n让我们介绍每种类型举措的总体目标和您应考虑的要点：\n\n| 举措类型 | 关键目标 | 创建举措商业案例时需考虑的关键要点 |\n|---|---|---|\n\
  | Analytics | 获取洞察以优化决策 | 不知道（提前或立即）有什么风险？对于这些举措，将不同举措的风险绘制在简单的 影响-可能性 矩阵上，将为您提供指导，以选择最有价值的分析举措进行投资。将此与在\
  \ Salesforce 中交付洞察的努力进行权衡。 |\n| Efficiency | 缓解基础任务 | 该任务每月或每年发生多频繁？耗时（以分钟计）多长？推算出以计算所有受益于自动化的用户可节省的潜在时间。将此与在\
  \ Salesforce 中交付自动化的努力进行权衡。 |\n| **收入** | 推动销售 | 更快、更好、更可靠的洞察或自动化将如何提高您的商机胜率和平均交易规模，或减少其成交时间？在考虑您组织的平均毛利率的情况下，将其与在\
  \ Salesforce 中交付自动化的努力进行权衡。 |\n\n表 13.1 – 按举措类型划分的商业案例考量\n\n仅保留 **一个** 产品待办事项列表，用于优先考虑您的数据分析和自动化举措，以及其他\
  \ Salesforce 开发举措。\n\n## 重要说明\n\n规范 AI 开发和使用的法律是一个快速发展的法律领域。与您的法务团队密切合作，了解您在管理客户数据和\
  \ AI 服务方面需要遵守的法律。\n\n让我们继续本章的最后一个主题——灵感！\n\n## 领导并激励您组织中的同行\n\n当您为利益相关者提供价值时，消息会传开，您的平台、您的项目和您的团队正在为组织带来改进。\n\
  \n很可能，当这种情况开始发生时，您——以及您的 Salesforce 项目和团队——将已发展出交付新功能（DevOps）的能力，以及分析和潜在的 AI 服务（DataOps\
  \ 和 AIOps）。\n\n谦虚地接受赞扬，并分享您取得今天成就之旅中的知识和经验；您已成为组织的前沿，领导其难以捉摸的 **数字化转型**。\n\n让我们总结本章！\n\
  \n## 摘要\n\n我们在本章中涵盖了 Salesforce 项目持续改进阶段的许多主题。首先，您学习了如何管理 Salesforce 数据的生命周期并治理其质量，以为您的分析和自动化举措取得成功奠定基础。接下来，您探索了利用\
  \ Salesforce C360 数据的许多用例。\n\n您现在已深入了解需要持续执行和发展的 方法和活动，以便从 Salesforce、数据、分析和自动化举措的投资中\
  \ **最大化业务价值**。\n\n成功交付这些举措将帮助您激励组织内的同行，并让您承担更广泛、更大的举措。\n\n在下一章中，我们将讨论您在 Salesforce\
  \ 项目持续改进阶段可能遇到的典型问题，以及如何减轻和克服这些问题。我们还将提供评估 Salesforce 项目状态的清单。\n"
- "## 持续改进阶段应避免的常见问题\n\n在前两章中，我们介绍了您将在 Salesforce *项目* 持续改进阶段执行的活动。\n\n在本章中，我们将讨论\
  \ Salesforce 项目永续阶段最常见的问题。我们还将介绍防止或减轻这些问题出现的策略。\n\n在 *第 5 章，应避免的预开发阶段常见问题* 中，您已了解\
  \ **根本原因分析**，我们将继续使用该方法来剖析常见问题。\n\n本章结束时，您将获得一套 **检查清单**，您可以定期参考以评估 Salesforce 项目在持续改进阶段的状态。\n\
  \n本章将涵盖以下主要主题：\n\n- 持续改进阶段的常见问题及其根本原因\n- 评估 Salesforce 项目的状态\n\n开始吧！\n\n## 持续改进阶段的常见问题及其根本原因\n\
  \n让我们首先查看在持续改进阶段无法在持续交付增量业务价值的同时提供稳定 Salesforce 平台的一些最常见问题——用鱼骨图说明：\n\n![](img/307881206539c45e128c538a4b6912f8_338_0.png)\n\
  \n图 14.1 – 持续改进阶段常见问题的鱼骨图\n\n接下来，我们将讨论每个常见问题的可能根本原因以及减轻和预防的策略。\n\n## 在治理 Salesforce\
  \ 项目的同时努力实现向产品型组织的转型\n\n在表 14.1 中，您可以找到可能导致您在治理 Salesforce 项目的同时努力实现向产品型组织转型的原因——以及如果您已面临该问题时的缓解策略：\n\
  \n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n| *高级管理层未参与或未认同向产品型组织转型的概念和价值，因此看不到转型的必要性。*\
  \ | 产品型组织的概念、原则和方法是释放 Salesforce 项目价值的关键（请参阅 *第 12 章，发展您的 Salesforce 组织和 DevOps\
  \ 能力* 中的 *将您的组织转型为产品型组织* 部分）。如果您向高级管理层推介该概念的原始方案没有以起立鼓掌结束，请不要气馁——这种情况很少发生。组织转型是一项重大变革，应如此对待。与全有或全无的方法不同，这里有一个更易接受的行动方案供您考虑：获得授权，仅针对您的\
  \ Salesforce 项目试验产品型组织概念，而非整个组织。如果针对整个 Salesforce 项目不可行，请尝试获得一位高级经理/部门的认可，为业务领域试验该方法。在您的\
  \ Salesforce 项目范围内——在您的控制范围内——尽可能纳入尽可能多的产品型组织实践。随着您开始看到积极成果，请与您的同行和高级管理层分享——出于激励的目的。与您的同行和高级管理层互动时，持续使用产品型组织的语言。这将逐渐传播该概念，您的利益相关者将通过渗透慢慢采纳它。\
  \ |\n| 您的组织继续 *资助* 零散的项目，而非整个 Salesforce 项目，包括一致的敏捷产品团队。 | 这与前一个根本原因密切相关。资助持续交付价值的敏捷产品团队是成为产品型组织的基础。如果您的组织传统上使用基于全面\
  \ BRD 的水瀑项目方法论，转向自主的敏捷产品团队将会显得激进——并且不太可能立即得到高级管理层的支持。您需要做的是保持决心目标保持不变，同时提出妥协方案。可以是实施中期规划机制，例如\
  \ SAFe 项目增量。纯粹的敏捷主义者会很快称 SAFe 为规模化水瀑框架。虽然这可能是（部分）正确的，但即使是“做事方式”上的微小改变也比没有改变好，因为它将让您踏上旅程。这样，您就是将\
  \ SAFe 作为交付转型之旅转型架构中的一个组件来利用。随着进展，突出这种新工作方式对您组织的益处。灌输并鼓励精益求精（kaizen）的理念（日本的通过 |\n\
  \n\n(持续改进) 并使用冲刺回顾来了解你可以做出哪些改变以改进你的工作方式。\n\n你的 Salesforce 项目和平台的 *愿景* 和 *战略* 与你组织的\
  \ *愿景* 和 *战略* 脱节或不一致。因此，你难以为你的 Salesforce 平台及其产品设定目标。\n\n这一根本原因的症状是，你的 Salesforce\
  \ 团队可能非常高效——以令人印象深刻的速度产出用户故事——但你的 Salesforce 项目 *并未被视为为组织创造价值*。\n\n在持续改进阶段，Salesforce\
  \ 项目的对齐是成功的关键。\n\n那么，你可以做些什么来实现对齐？\n\n参考你在开始开发初始版本之前准备的原始商业案例。阅读 *第 4 章*，*获取资金并与\
  \ Salesforce 和实施合作伙伴展开合作*，以重新审视商业案例的组成部分，同时阅读 *第 1 章*，*为你的 Salesforce 项目创建愿景*，以理解并（重新）定义你的\
  \ Salesforce 项目的愿景。\n\n你应该对 Salesforce 产品的客户（用户）——即你的 Salesforce 平台服务的对象——有非常清晰的认识。\n\
  \n你可以使用 **Jobs-To-Be-Done (JTBD)** 框架，在其中你可以在以下维度上完善他们的角色描述：\n\n- **JTBD**：你的角色（用户）需要完成的职能性和情感性工作。\n\
  - **Pains**：这些角色面临的风险和障碍。考虑你的产品如何帮助缓解这些痛苦。\n- **Gains**：期望的结果是角色所追求的利益。\n\n确保你的敏捷产品团队、Salesforce\
  \ CoE 以及更广泛的利益相关者都能访问并理解角色描述。\n\n丰富的角色模型是很好的对话开端——尤其结合业务流程图中的泳道——以了解你的 Salesforce\
  \ 产品为何是或应该是某种特定方式。\n\n你为以下核心 Salesforce CoE 角色申请了资金：\n\n- Salesforce program owner\n\
  - Salesforce platform architect\n- Salesforce platform owner (chief product owner)\n\
  - Salesforce product owners for each agile product team\n\n但你未能获得全部预算的批准。你可能只获得了为其中\
  \ 2 或 3 个角色配备人员的资金。\n\n没有适当的资金，你就无法雇用人员来监督、管理并为你的用户、客户和组织持续交付改进。\n\n资金需要涵盖你的 Salesforce\
  \ CoE 以及敏捷产品团队和潜在的新项目。\n\n为了务实并最大化利用资金，你有以下选择，每个选择都有需要考虑的弊端：\n\n- 合并平台负责人和项目负责人角色。这通常是首选的折中方案。请注意由此产生的关注度降低，如果由不同人员负责\
  \ Salesforce 项目内的不同方面，你本可以拥有更集中的关注。\n- 让某些角色在你的 Salesforce 项目上的分配少于全职。这也会导致关注度降低，因为这些角色会有其他竞争性优先事项。\n\
  \n无论你的资金如何，都要充分利用它。随着你推进 Salesforce 项目并交付价值，你可以塑造商业案例以达到新的高度。\n\n你的 Salesforce 产品路线图的拥有权和决策授权仍在高级领导层——或部门/区域负责人的集体手中。此外，你的产品路线图是基于时间的版本发布表示。\n\
  \n如果优先级排序和决策是（纯粹）自上而下而非自下而上，你可能会构建无法验证为客户（用户）创造价值的功能。另一个后果是难以定期更新路线图。更好的做法——也是你需要尝试说服高级管理层的——是你的产品路线图应代表产品演进的意图。与其自上而下的优先级排序，你应致力于赋能产品负责人，让他们与终端用户互动以创建更具影响力的路线图，该路线图可以定期更新并——重要的是——传达给你的利益相关者。\n\
  \n你的运营模式——以及其中的合作伙伴模式——不支持或与你的 Salesforce 项目雄心不一致。这一根本原因的迹象是，你的组织，包括你的 Salesforce\
  \ CoE，缺乏实现产品型组织愿景的能力。\n\n如果你对 Salesforce 路线图有宏伟的雄心——意味着你希望交付许多代表用户巨大业务价值的功能——但没有支持它的运营模式，这只是空想。考虑你打算让谁参与路线图的持续交付。参考第\
  \ 12 章《演进你的 Salesforce 组织和 DevOps 能力》中“持续改进阶段调整你的合作伙伴模式”部分，以反思你 Salesforce 项目的未来运营和合作伙伴模式。\n\
  \n你在产品开发能力（如何构建）上的投资过度，而牺牲了产品发现（构建什么以及为什么）。如果没有成熟的手段和经验丰富的人员与用户互动以了解他们需要完成的工作、以及他们的痛苦和收益，你将难以理解他们的感受——从而交付次优的解决方案。\n\
  \n避免将 Agile（一种思维方式和用于协作设计、构建和测试事物的各种方法论的统称）混淆为确定构建什么以及为什么的方法。是的，《敏捷宣言》指出用户互动是关键，但并未进一步描述如何做到。\n\
  \n以下是你可以增强产品发现能力的一些方法：\n\n- 确保客户体验设计师是你的敏捷产品团队的一部分。\n- 针对不同的用户群体（角色）定期举办用户反馈论坛，在获取现有功能和使用的反馈之外，邀请他们分享对产品待办事项优先级排序的看法。在规划路线图时考虑他们的反馈。\n\
  - 保持用户反馈渠道畅通——并怀着感激之情回应。\n\n你的敏捷开发团队及其产品负责人陷入了构建陷阱，认为所有问题和功能请求只能通过技术解决方案解决。\n\n\
  技术很棒，许多问题可以在 Salesforce 等平台上相对快速地解决。但事实是，并非所有问题都需要技术解决方案。\n\n表 14.1 – 在治理 Salesforce\
  \ 项目的同时，将组织转型为产品型组织时可能遇到的困难的可能根本原因\n\n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n| 你的敏捷开发团队及其产品负责人陷入了构建陷阱，认为所有问题和功能请求只能通过技术解决方案解决。\
  \ | 在考虑解决方案类型之前，进行研究和分析以了解需要实现什么以及为什么。只有这样你才能确定最佳的解决方案类型可能是什么。它可能是技术解决方案，但通常可能是培训、沟通或第三种解决方案类型。\
  \ |\n| 你（出于好意）逐字实施了 SAFe 或其他框架以扩展敏捷，相信它会自动使你的组织敏捷。相反，你因规划和仪式（会议）而被开销淹没。 | 框架应为你服务，而不是相反。你应——审慎地——调整在你的组织环境中有意义的框架部分，并使其成为你自己的。如果你的\
  \ Salesforce 项目是你的组织首次接触敏捷，请考虑聘请合作伙伴指导你在规模化敏捷方面的转型之旅。 |\n\n让我们跳到持续改进阶段的下一个常见问题。\n\
  \n## 提升 Salesforce DevOps 能力方面的困难\n\n在表 14.2 中，你将找到可能导致你难以提升 Salesforce DevOps 能力的根本原因——以及如果你已面临该问题时的缓解策略：\n\
  \n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n\n\n\n\n## 你*并未演进*你的 Salesforce *DevOps 能力*。\n\
  \nDevOps 本身就是一个不断演进的领域。Salesforce 平台及其相关技术亦然。如果你没有利用这些改进，就无法充分发挥你在平台上的投资价值——以造福你的用户和组织。\n\
  \n这意味着 DevOps 不是你做的事情，而是一种你应努力持续改进的能力。\n\n开始的地方可能让人感到不知所措，因此请将以下步骤作为起点考虑：\n\n- 1.\
  \ 梳理你当前的 DevOps 流程。\n- 2. 识别能够带来最大价值的改进领域——改进 DevOps 指标（参考 DORA）。这些领域可能是 *第 12 章*、*演进你的\
  \ Salesforce 组织和 DevOps 能力* 中提到的 *增强你的 Salesforce DevOps 能力* 部分的任何一项。\n- 3. 理解这是一段旅程，因此以*增量*方式实施改进——采用\
  \ DevOps 不意味着你必须一次性做出重大改变。相反，迈出一个小步就能带来明显的回报。\n- 4. 评估改进所实现的收益并继续前行。\n\n## 你难以实现新发布功能的*采用*。\n\
  \n问题可能不在于功能本身，而在于它们发布的方式。\n\n你需要做的是在发布新功能时记住变更管理、沟通和培训。\n\n请参考 *第 10 章*、*通过沟通、培训和支持推动采用*\
  \ 中的 *规划、沟通和管理变更* 部分，以获取有关发布新功能时应如何做的灵感。在持续改进阶段要留意并校准你的工作——遵循与新功能所代表的变更影响相称的比例原则。\n\
  确保你创建报告来跟踪并*了解*用户如何采用你的新功能。用用户访谈补充使用报告，以了解采用情况以及改进的潜力。\n\n### 你的生产环境*部署时长*在增加和/或从新请求到发布的*前置时间*很高或在增加。\n\
  \n因此，你难以实现你的 *sprint 或 PI* 目标。\n\n如果你将此作为根本原因面对，许多后果使得采取行动加以补救变得势在必行：\n\n- *不满意的\
  \ Salesforce 团队成员*（你平台的守护者）\n- 组织对你的 Salesforce 计划失去信任，最终导致资金流失\n- 等待新功能的时间过长\n\
  - 团队成员的时间资源被浪费，这些时间本可用于开发新功能\n- 部署失败的高风险\n- 采用率降低的高风险\n\n通常，问题与未演进你的 DevOps 能力有关。\n\
  \n考虑以下方法以减少部署和前置时间：\n\n- 回顾并以 DevOps 的原则为目标——更小、更频繁的发布可降低部署和变更管理工作的风险和复杂性\n- 努力从完整部署转向部分、更小的部署\n\
  - 使用约束理论来减少 DevOps 流程中的瓶颈\n- 对团队成员进行 CI/CD 工具的培训和提升技能（并为 QA 制定检查），或外包技术部署管理\n- 考虑通过在\
  \ CI/CD 流水线中设置高级脚本来自动化手动部署任务（不可部署的组件）\n\n如果出于任何原因，你的 Salesforce 计划目前无法过渡到更小、更频繁的发布，你需要提高保持部署计划（运行手册）更新的警惕性。\n\
  \n### 你难以将*翻译*功能请求——大和小——转化为适当的产品待办事项或项目，因此你难以为请求决定适当的交付方式。\n\n如果你无法有效对请求进行分类，并在对请求的初步资格评估中对其进行估算，你将面临无法推进的风险。更糟的是，你可能会将一个请求误认为是一个大项目——并花费（浪费）许多人的时间来决定如何最好地实施它——而实际上这是一个只需简单修复的小请求。在相反的情况下，对快速交付的期望很快就会转为失望和延迟。\n\
  \n虽然你应采用更纯粹的敏捷交付方法来对 Salesforce 解决方案支持的现有能力进行产品*演进*，但它并非适用于所有计划的最佳方法。\n\n让你的产品负责人、业务分析师、客户体验设计师和解决方案架构师组合参与，以评估请求并将其转化为适当的产品待办事项或项目。\n\
  \n为组织你的产品待办事项层级制定框架。一个示例描述在 *表 12.1 - Salesforce 产品待办事项类型* 中。\n\n参考 *第 3 章*、*确定如何交付你的\
  \ Salesforce 项目* 的 *理解交付方法* 部分。\n\n如果你评估请求构成一个独立项目，请遵循本书的 *第 1-3 部分*。如果不是，请参考 *第\
  \ 12 章*、*演进你的 Salesforce 组织和 DevOps 能力*；你的敏捷产品团队应根据你的 DevOps 流程交付。\n\n### 难以管理多个*并发*敏捷产品团队和长期项目。\n\
  \n这可能是由于你仍在将初始（MVP）发布推广到更多地理区域的过程中。\n\n如果你遇到此问题，你可能会难以*优先*或分配资源以持续改进你的 Salesforce\
  \ 产品，以及由于同时运行太多承诺而导致团队倦怠和交付风险。\n\n需要记住的关键是基于手头资源所能实现的现实假设来管理期望的古老艺术。如果期望超过当前可能实现的，要么降低期望（移动推广时间表），要么增加更多资源——用于推广或持续改进。\n\
  \n并发流和长期项目的先决条件是复杂的 CI/CD 流水线和工具。务必咨询技术架构师和 DevOps 专家，为你的 Salesforce 计划实现雄心提供最佳行动方案指导。\n\
  \n### 你的产品路线图不包括技术使能器，也称为*架构跑道*。\n\n这通常发生在没有 Salesforce 架构师（平台、技术、解决方案）参与更新 Salesforce\
  \ 产品路线图或评估新功能请求时。\n没有技术跑道，交付风险和潜在的技术债务会累积——从长期来看阻碍你的敏捷性。\n你需要建立让 Salesforce 架构师参与评估新请求流程的做法。\n\
  接下来，你需要为中等和大型待办事项——以及任何项目型计划——的前期架构和设计分配适当的时间和架构资源。\n\n### 你没有结构化的方法来持续处理*技术债务*。\n\
  \n这通常与缺乏架构跑道密切相关。\n未解决和管理的技术债务的症状表现为你的团队成员因日益增加的维护和中间缺陷修复需求而不堪重负。与此同时，你的利益相关者可能在等待新功能开发和发布时耐心受考验。\n\
  如 *第 12 章*、*演进你的 Salesforce 组织和 DevOps 能力* 中 *管理技术债务* 部分所述，这主要源于：\n\n- 基于设计不良的解决方案对\
  \ Salesforce 平台进行的更改，这些解决方案需要高程度的维护，其成本超过了解决方案本身的好处\n- 被扩展超出其预期和适用范围的治理不善的解决方案\n\
  \n你可以采取的措施是*预防*和*缓解*的结合：\n\n- 你的 PO 应初步审查和确认缺陷和新功能请求。如果不是有效缺陷（损坏的功能）或与产品目标一致的新请求，就不应为其实施解决方案。\n\
  - 实施设计权威机构，在开发开始前审查拟议的解决方案设计。\n- 确保开发指南已到位、已传达、被理解并被使用。它们还应持续更新和完善。\n\n- 要求敏捷产品团队成员在待办事项中明确说明其拟议解决方案所需的维护工作量以供审查。挑战需要维护的解决方案以及相应的业务需求——或完全缺少该部分的情况。\n\
  - 为持续重构分配 PI 或冲刺容量的 15%-25%。这可以通过在冲刺中包含重构待办事项来实现，也可以通过在每个计划增量结束时设立专门的“重构”冲刺来实现。虽然后者对\
  \ DevOps 友好度较低，但有时更容易理解、管理、规划（因此会发生）——使其成为最佳 DevOps 方法的有吸引力的替代方案。\n\n你可以阅读 *Ian\
  \ Gotts* 的这篇文章以进一步了解技术债务：\n\nhttps://medium.com/salesforce-architects/how-architects-can-help-reduce-technical-debt-c0814bf8eaa.\n\
  \n文档和培训材料在上线后初期维护不善。\n\n这是一个显而易见的原因造成的问题；没有文档，新成员将难以理解你的 Salesforce 平台做什么以及为什么。现有的团队成员了解任何更改的基线也是一个问题。\n\
  \n培训材料——无论格式如何——对于现有用户和新用户的采用至关重要。\n\n保持文档和培训材料处于良好状态，依赖于你的人、流程和工具。\n\n在用户故事的完成定义中纳入更新文档（例如，业务流程图、数据模型、数据字典、培训文档等）。\n\
  \n对于文档，请考虑具有预建 Salesforce 模板可供开始使用的协作工具，例如 **LucidChart**。\n\n考虑利用组织分析工具，例如 **Elements\
  \ Cloud**、**Salto** 和 **Metazoa**。\n\n你被错误淹没，并且在解决一个错误后，你后来又遇到了相同或类似的错误。\n\n你的错误报告可能从性能不佳的报告和损坏或不连贯的\
  \ *自动化* 到 *杂乱的 UI* 和繁琐的 *导航* 不等。\n\n修复错误繁琐且耗时。虽然对于某些人来说，排查故障并找出错误根源在精神上可能令人兴奋，但实际上这是浪费时间。修复错误不是浪费，但如果能预防，时间本可以更好地利用。\n\
  \n如果你遇到大量错误，应该怎么办？\n\n- 1. *修复*：花相应比例的时间调查错误的根本原因，使用 **5 Whys 方法** 来发现并修复看似技术问题背后的人为原因。在这里查看\
  \ Eric Ries 关于该方法的视频：https://hbr.org/2012/02/the-5-whys.html。\n- 2. *预防*：实施设计权威，在开发开始前审查拟议的解决方案设计。此外，投入时间改进开发标准、指南、测试框架和开发人员入职流程。\n\
  \n表 14.2 – 增强 Salesforce DevOps 能力困难的可能根本原因\n\n让我们跳到持续改进阶段的下一个常见问题。\n\n## 无法有效管理和利用你的\
  \ Salesforce Customer 360 数据\n\n在 *表 14.3* 中，你将找到可能导致你无法有效管理和利用你的 C360 数据的可能根本原因——以及如果你已面临这些问题时的缓解策略：\n\
  \n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n| 你收到许多关于 *数据质量不佳* 的报告，并且你难以识别根本原因。 | 高品质数据是你想用\
  \ Salesforce 做任何事情的基础。遵循 *第 13 章*、*管理你的 Salesforce 数据以收获 Customer 360 的成果* 中 *管理你的\
  \ Salesforce 数据质量* 部分所述的 DMAIC 方法。<br><br>你可以通过以下方法尝试识别数据质量不佳报告的根本原因：<br>- 1. 确定被报告数据质量不佳的对象（们）的\
  \ *数据类别* 是什么。<br>- 2. 了解报告中数据质量的 *维度* 哪方面不佳。<br>- 3. 评估数据质量有多差。如果确实非常差且对业务有重大影响，请继续。<br>-\
  \ 4. 了解对象相关的 *业务流程*。<br>- 5. *分析* 以找到可能导致根本原因的趋势和模式。可检查的地方包括数据生命周期（质量问题是在记录创建、处理或使用时出现？）、记录类型、创建者或所有者的角色、销售组织、区域、类别、阶段/状态、数据访问权限和权限：<br>&nbsp;&nbsp;-\
  \ 1. 同时检查报告者和创建和编辑数据的人员——有时，问题不是数据质量，而是数据访问或权限。<br>&nbsp;&nbsp;- 2. 对于核心 *核心* 交易对象（Lead、Opportunity\
  \ 和 Case）；*年龄* 是关键的数据质量维度和通用 KPI 追踪指标。 |\n| 你在建立数据治理机构并在组织内确立所有权方面遇到困难。 | 你需要确保\
  \ *数据所有者* 分配并拥有其业务领域的数据。如果不是这样，请在你的 *Salesforce 数据治理委员会* 中提出问题，以便为数据所有权提供资源。 |\n\
  | 你难以 *优先安排* 你的数据质量改进工作。 | 在 *第 13 章*、*管理你的 Salesforce 数据以收获 Customer 360 的成果* 中\
  \ DMAIC 的 *定义* 部分，我们研究了 *数据质量目标* 的概念。如果你已为组织设定了这些目标，那就是你应该努力提高质量的数据。<br><br>如果你尚未建立数据质量目标，以下类型的数据应考虑优先排序：<br>-\
  \ 个人数据（Contacts 和 Leads），用于通信，因此如果数据质量不佳，你将面临糟糕的客户体验、满意度，最终影响客户生命周期价值。<br>- 跨组织具有影响和使用的主数据。这可能包括\
  \ Accounts、Products 和 Assets。<br>- 包含任何类型财务信息的数据（报价、订单、发票和付款）。<br>- 集成数据——如果你将数据发送到企业内部或外部的其他系统，请确保其质量很高。接收数据也一样——确保你能信任其质量，或在录入时进行验证。<br>-\
  \ 参考数据。<br><br>其他类型的数据可能对你的组织极其重要，因此在设定数据质量目标时务必进行评估。<br>数据始终保持高质量是目标。但当你需要优先改进时，请考虑数据需要在何时准确完整。例如，Lead\
  \ 在创建时可能不需要 100% 完整——只需足够联系并确认信息和兴趣即可。在 Lead 转换时，质量则需要很高。 |\n\n数据模型更改在引入时几乎没有或根本没有考虑其对集成、自动化或用户体验的影响——更不用说你的分析服务了。\n\
  \n确保包含数据模型更改的任何用户故事在开始开发前由你的设计权威提出并审查。\n\n将此准则传达给所有团队成员——内部以及外部。\n\n你难以找到利用 Customer\
  \ 360 数据的灵感。\n\n请参考第 13 章《管理你的 Salesforce 数据以收获 Customer 360 的成果》中《利用你的 C360 数据以最大化\
  \ Salesforce 投资回报》部分。\n\n此外，你可以通过多种方式获得灵感，包括：\n\n- 与 Salesforce 生态系统互动——通过参加团体活动参与\
  \ Trailblazer 社区：https://trailblazercommunitygroups.com/\n- 阅读书籍，例如 Lars Malmqvist\
  \ 所著的 Architecting AI Solutions：https://www.amazon.com/Architecting-Solutions-Salesforce-state-art/dp/1801076014/ref=tmm_pap_swatch_0?_encoding=UTF8&qid=&sr=\n\
  - 访问 Salesforce AI Research 网站以获取更多灵感：https://www.salesforceairesearch.com/\n\n\
  你在清楚了解用例、其上下文以及该举措的消费者/受益者（用户、客户）之前就启动了数据分析、自动化或 AI 举措。\n\n如果你不完全了解数据分析举措的上下文，就无法开发出切中要害的解决方案。\n\
  \n最好的情况是，用例是通用的，你的解决方案遵循该模式的通用最佳实践。最坏的情况是，你的解决方案偏离目标，留下绝望和技术债务的痕迹。\n\n不能强调太多，但在设计解决方案时要让你的预期用户参与——同样适用于数据分析、自动化和\
  \ AI 举措。\n\n你启动了数据分析、自动化或 AI 举措，而未确保适当的数据质量。\n\n这是导致糟糕体验、错误、低满意度以及潜在收入损失的失败配方。\n\
  \n你不应在未为所利用数据的质量设置护栏的情况下开发数据分析、自动化或 AI 举措。\n\n你难以管理、维护和改进你的数据分析和 AI 部署，例如聊天机器人或\
  \ Einstein 预测。\n\nAI 解决方案需要持续监控和改进才能发挥最大效益。持续改进也是跟上你的业务、客户和用户所必需的。\n\n因此，你需要考虑大约\
  \ 10%-20% 的初始设置工作量的持续维护工作。\n\n\n\n| | |\n|---|---|\n| 您在利用 Customer 360 数据的努力中难以看到\
  \ *进展*。 | 累积边际收益的原则同样适用于数据分析、自动化和人工智能举措。您成功交付的每项举措——每个功能、每次数据质量改进和每个分析能力——都会促进并放大您和\
  \ Salesforce 同事为组织带来的成功和价值。请记住，这是一段旅程——继续不断向前向上推进，结果就会随之而来。 |\n\n表 14.3 – 无法有效管理和利用您的\
  \ Salesforce Customer 360 数据的可能根本原因\n\n接下来，让我们评估您在持续改进阶段的 Salesforce 项目状态。\n\n##\
  \ 评估您的 Salesforce 项目状态\n\n我们已在您 Salesforce 项目的持续改进阶段涵盖了大量主题和活动。如果您遇到困难，或对进展不满意，以下部分将帮助您评估\
  \ Salesforce 项目的状态。\n\n对于您无法勾选的每项，请返回相关章节并完成活动，以提升能力，最大化投资回报。\n\n## 持续改进阶段 Salesforce\
  \ 项目检查清单\n\n*开始时*，在 Salesforce 项目的持续改进阶段——在 Salesforce 首次上线后——您应完成以下步骤：\n\n- 确保您的\
  \ Salesforce 项目和平台愿景与组织的愿景和战略保持一致\n- 使用核心角色更新您的 Salesforce CoE\n- 理解产品型组织的概念\n-\
  \ 了解 Salesforce 平台和产品的客户（用户）是谁\n- 了解您的 Salesforce 产品是什么\n- 招募或指定 Salesforce 产品负责人，并赋予他们真正拥有其产品的权力\n\
  - 为您的 Salesforce 平台和产品设定目标——与平台愿景保持一致\n- 从为离散项目（工作说明书）提供资金转变为为由敏捷产品团队组成的 Salesforce\
  \ 项目提供资金\n- 更新您的运营和合作伙伴模式\n- 更新您的 Salesforce 路线图\n- 建立跨职能敏捷产品团队\n- 评估您的敏捷成熟度和 DevOps\
  \ 能力——并启动演进行动\n\n在整个持续改进阶段，您应 *持续地* 执行以下操作：\n\n- 增强您对产品型组织的理解并推动活动，推动组织向其转型\n- 通过深入了解\
  \ Salesforce 用户的待办工作、痛点和收益来完善人物画像描述，并定期组织用户反馈论坛\n- 监控并了解用户对新功能和现有功能的采用和使用情况\n- 通过以下方式管理\
  \ Salesforce 平台的健康状况：\n  - 组织定期设计权威会议以审查新提出的解决方案\n  - 执行定期健康检查\n  - 保持文档最新\n  -\
  \ 定义并传达开发标准和指南\n- 朝着更小、更频繁的发布迈进\n- 定期评估您的 Salesforce DevOps 能力并推动提升行动\n- 通过运行数据治理委员会来管理\
  \ Salesforce 数据质量工作\n- 使用 DMAIC 框架改进 Salesforce 数据质量\n- 通过确定数据分析举措最常见的性质（描述性-诊断性-预测性-规范性-认知性）来评估您的数据成熟度\n\
  - 实施新的数据分析、自动化和人工智能举措并持续改进\n- 增强您的数据分析、自动化和人工智能能力以利用 Customer 360 数据\n- 管理、监控、维护和改进您的数据分析、自动化和人工智能举措\n\
  - 激励组织内的同行和领导层\n- 激励并与 Salesforce Trailblazer 社区互动\n- 分享您的知识和经验\n\n让我们总结本最后一章。\n\
  \n## 摘要\n\n在本章中，您已熟悉 Salesforce *项目* 持续改进阶段面临的一些最常见问题。如果您在自己的 Salesforce 项目中遇到一个或多个提及的问题，您现在知道如何减轻或完全防止其出现。\n\
  \n您还通过阶段检查清单评估了 Salesforce 项目的状态，以便知道将精力集中在哪些方面进行改进。\n\n随着您的 Salesforce 项目和平台不断发展，我留给您最后一点提示：\n\
  \n我们在工作和个人生活中都会面临挑战、风险和问题。我们处理它们的方式塑造了我们和我们的组织。\n\n我写这本书是因为我想分享我在帮助组织实施 Salesforce\
  \ 并最大化其投资回报时学到的经验。我的目的是提供我所见过有效和无效做法的见解，以便您能从中学习，并在与 Salesforce 合作的时间中获得最大收益。\n\n\
  如果您发现本书的某些部分有用，或者对某些部分有不同看法，我很乐意听取并从中学习。我邀请您请分享您的观点，以便我们共同创造 *#BetterSalesforceDelivery*。\n"
