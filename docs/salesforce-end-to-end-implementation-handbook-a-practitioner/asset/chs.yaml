  \n图 4.1 – 前期开发阶段的活动\n\n在能够创建财务预测之前，让我们具体说明您对 Salesforce 项目期望的业务成果。\n\n## 确定所需业务能力的\
  \ KPI 和目标\n\n如果您希望在推出时能够衡量 Salesforce 项目是否成功，您需要确定如何衡量绩效以及什么目标定义成功。您的 Salesforce\
  \ 任务组不应设定业务目标；您应与业务利益相关者沟通，以确定跟踪哪些 **关键绩效指标 (KPIs)** 是合理的以及应追求哪些 **KPI 目标**。\n\n\
  这在前期可能看起来是一项很大的工作，但请考虑相反的情况：如果没有设定 KPI 或目标，项目成功衡量将依赖于来自各个用户组的、主观的定性输入，而非预先确定的、充分论证的考虑。此外，当您\n\
  \n可以转化为成本节约或投入到更有价值的活动中。\n\n-   **Salesforce CoE 成本：** 用于治理、维护和运行您的 Salesforce 解决方案的新员工（非项目成本）。这些包括内部管理员和业务分析师，他们负责进行小规模的错误修复、实施小型功能请求以及用户管理\
  \ – *维持运转*。我们将在下一节中更详细地介绍这一点。\n-   **遗留系统运营成本：** 不再维护即将退役的遗留系统的员工。如果可能，您应该对这些人员进行再培训和提升技能，使其成为\
  \ Salesforce CoE 的一部分，因为他们对贵组织非常熟悉并拥有许多可转移技能，这些技能 – 结合 Salesforce 知识 – 将成为您新的 Salesforce\
  \ CoE 的宝贵资源。由于 Salesforce 对这些人来说可能是一个全新的平台，云计算也可能对他们来说是新的，因此在培训方面要谨慎细致 – 我们将在 *第12章*、*发展您的\
  \ Salesforce Org 和 DevOps 能力* 中再次讨论此主题。\n\n让我们看看您在实施合作伙伴模式方面的选择。\n\n## 选择您的实施合作伙伴模式\n\
  \n**康威定律** 指出，如果组织未获得外部输入，就会或多或少地将现有流程（和数据）原封不动地迁移到新系统中。如果您的公司投资于 Salesforce 这样闪亮的、尖端的技术、市场领先的\
  \ CRM 平台，却不改进其流程，那将是完美机会的巨大浪费。\n\n这正是 Salesforce 实施合作伙伴发挥作用的地方。\n\n让我们看看不同的合作伙伴模式：\n\
  \n-   **100% 内部实施：** 您的公司完全不与实施合作伙伴合作。对于 Salesforce 项目而言，对于初始的绿地实施来说，这不是推荐的做法。初始实施部署后，对现有云的错误修复和功能增强可以由内部团队执行，并得到明确定义的开发指南和治理的支持。\n\
  -   **100% 外包：** 您的公司除了一些高层治理和提供需求外，将所有工作外包。实施合作伙伴负责开发、部署、培训、用户管理和帮助台。选择 100% 外包是有正当理由的\
  \ – 例如，如果贵公司的 IT 资源有限，但您希望开发出优秀的解决方案并为用户提供及时支持。\n-   **折中方案：** 在此模式下，您自行处理 Salesforce\
  \ 的部分工作 – 最常见的是用户管理、报告支持、错误请求管理、新功能请求管理、培训和帮助台等元素。此模式有无穷无尽的变化，也是最普遍的。您需要明确的是，贵公司在哪些元素上比实施合作伙伴做得更好，以及原因。通常，这取决于涉及与终端用户沟通的元素。\n\
  \n您选择的合作伙伴模式并非一成不变。随着您在 Salesforce 实施各阶段的推进，了解什么有效、什么无效，并据此优化您的设置。\n\n## 重要说明\n\n\
  实施合作伙伴的成本属于您公司的 **资本支出（CAPEX）**，而您日常的内部运营费用则属于 **运营支出（OPEX）**。请与您的 CFO 或其他财务业务合作伙伴讨论，贵公司在选择\
  \ Salesforce 实施的合作伙伴模式时是否有偏好或考虑因素。\n\n让我们继续讨论您 Salesforce CoE 所需的资源。\n\n## 确定您的\
  \ Salesforce CoE 目标运营模式\n\n您需要将 Salesforce CoE 成员在交付 Salesforce 项目上花费的时间成本纳入其中。要确定这一点，我们首先需要了解需要成为\
  \ Salesforce CoE 的一部分的角色。\n\n为了帮助您确定在初始实施和推广后 *纯粹维护* 实施所需的角色，请查阅 Salesforce 帮助文章\
  \ *最佳实践：实现卓越的 CRM 管理*，网址为 https://help.salesforce.com/s/articleView?id=000327119&type=1。\n\
  \n文章中的模型基于最多 750 名用户。对于计划投资并实施 Salesforce 的企业组织而言，了解运行其 Salesforce 平台所需的关键资源因素至关重要，以便估算维护其解决方案的运营成本。\n\
  \n那么，让我们深入探讨这些考虑因素和因素。\n\n在所有 Salesforce org 中，您至少会有一名内部用户拥有配置 Salesforce org 的管理员权限。人数和时间取决于多个因素以及围绕运营模式的决策\
  \ – 以及您选择的合作伙伴模式。\n\n以下列表包括其中一些因素：\n\n-   您的 Salesforce org 是否已上线生产\n-   使用的 Salesforce\
  \ 云和附加产品的广度\n-   您的 Salesforce org 定制的程度\n-   您 Salesforce org 中解决方案的可维护性*\n\n*提示\n\
  可维护性是一个因素，您可以通过为 Salesforce 项目和计划制定正确的治理机制来 *可以影响*。我们将在 *第7章，构建和测试您的初始发布* 中更详细地介绍这一点。\n\
  \n-   内部 Salesforce 用户的数量\n-   您 Salesforce org 中业务线的数量\n-   销售区域或国家/地区的数量\n-  \
  \ 面向客户的应用程序的数量，例如 Experience Cloud 网站或商务商店\n\n其中一些因素纯粹基于事实，例如用户数量。\n\n您的 Salesforce\
  \ CoE 成员负责的领域不仅仅是用户管理 – 回顾上一章中的 Salesforce CoE 结构图。并非所有成员都会 100% 分配给 Salesforce\
