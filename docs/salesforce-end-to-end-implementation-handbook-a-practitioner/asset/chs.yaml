  \ 目标。\n\n如果您没有创建商业案例，您将处于盲目状态，无法知道投资是否正在产生回报。您可以做的是跟踪上线后几个季度业务的表现，并与上线前表现进行比较。请注意以下两点：\n\
  \n1. 不要将相关性等同于因果性——有无数因素在正面和负面影响您的业务表现。\n2. 推广 Salesforce 不会（必然）在一周或一个月内立即改善业务表现。用户需要时间适应在新系统中的工作方式。请记住，他们可能花费了数年时间精通“旧”工作方式，无论支持他们的系统是什么，他们可能没有。\n\
