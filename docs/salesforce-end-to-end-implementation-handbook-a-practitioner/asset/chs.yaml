  \n现在我们已经确定了预开发阶段整体活动包括*什么*，让我们来看一下*谁*将执行这些活动。\n\n## 介绍 Salesforce 任务小组\n\n为了开展预开发阶段的活动，Salesforce实施的执行赞助人应创建一个**Salesforce任务小组**。\n\
  \nSalesforce任务小组应由三个关键角色组成，分别来自业务组织、IT组织以及您的**项目管理办公室（PMO）**。最后，Salesforce任务小组*必须*有一名执行赞助人。\n\
