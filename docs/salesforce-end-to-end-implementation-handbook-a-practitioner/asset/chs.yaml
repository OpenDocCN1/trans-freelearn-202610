  \ 2 章《定义您的 Salesforce 项目的性质》，重新定义范围，考虑能力之间的依赖关系。\n\n一旦您完成该迭代，请继续进行循环——预开发阶段的章节——更新您的\
  \ RAID 日志和商业案例，并再次提交。\n\n## 摘要\n\n在本章中，您已在商业案例中总结了您的 Salesforce 项目，其中包含基于 Salesforce\
