  测试翻译\n\n通过在环境中部署 Salesforce 解决方案的实际操作以及如何推动用户验收测试。最后，我们将介绍如何在数据迁移和上线签核前确定您的准备情况。\n\
  \n第 10 章《沟通、培训与支持以推动采用》涵盖了规划、沟通和变革管理的关键活动。我们将讨论并提供分阶段推出计划的模板，以及不同的培训交付方式。我们将探讨您应如何提供超配支持以及何时可以安全地过渡到持续的生产支持。我们将探讨您应如何监控和推动\
  \ Salesforce 解决方案的采用，以最大化投资回报。\n\n第 11 章《上线阶段应避免的常见问题》介绍了 Salesforce 项目上线阶段的常见问题，并提供了缓解和预防策略。我们还将介绍上线阶段的汇总清单，帮助您评估\
  \ Salesforce 项目的状态。\n\n第 12 章《发展您的 Salesforce 组织和 DevOps 能力》首先概述了 Salesforce 计划的持续改进阶段。我们将探讨产品型组织的概念以及您为何应努力将组织转型为此类组织。我们将描述您如何通过更新的\
  \ Salesforce CoE 及其核心角色为 Salesforce 计划和平台实施合适的治理。最后，我们将深入探讨 Salesforce DevOps，并探索您如何发展\
  \ Salesforce DevOps 能力，以为用户和组织提供更大价值。\n\n第 13 章《管理您的 Salesforce 数据以收获 Customer 360\
  \ 的成果》涵盖了数据管理和治理这一重要领域。我们将介绍数据分类、数据生命周期和数据质量维度等基本概念。我们将向您展示如何治理、监控和改进 Salesforce\
  \ 数据的质量。然后我们将引导您评估自己的分析计划，并描述您如何考虑利用 Customer 360 数据以最大化 Salesforce 投资回报。\n\n*第\
  \ 14 章《持续改进阶段应避免的常见问题》*介绍了 Salesforce 计划持续改进阶段通常面临的常见问题，并提供了缓解和预防策略。我们还将介绍进入持续改进阶段时应做什么的清单，以及为了进一步为用户和组织释放价值而应持续做的事情。\n\
  \n## 如何充分利用本书\n\n如果您对基本业务、CRM 和项目管理概念有所了解，将有助于您充分利用本书。具备 Salesforce 的专业工作经验是有利的，但并非阅读本书的先决条件。\n\
  \n虽然 Salesforce 开发和技术架构是更明确的领域，但 Salesforce 交付则较少如此。这正是本书的目标——提供一个框架和一种视角。\n\n我主要参与为在本地和全球运营的欧洲公司推动\
  \ Salesforce 实施。您的观点和经验可能与我不同。我希望开启一次对话，并邀请您积极参与并分享您对 #BetterSalesforceDelivery\
