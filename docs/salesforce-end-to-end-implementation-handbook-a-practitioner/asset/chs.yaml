  \n在了解了示例公司PME之后，让我们回到贵公司。\n\n## 贵公司的环境、状况和挑战\n\n要制定路径，除了知道您想去哪里之外，您还需要了解您来自哪里，以及至关重要的是，为什么需要移动。因此，您在预开发阶段的第一个活动就是分析和确定您的**公司状况**。\n\
  \n\n\n在以下章节中，我们将介绍了解贵公司组织架构、客户以及所销售的产品和服务的基本方法。\n\n## 重要说明\n\n作为 Salesforce 工作组的成员，您的职责不应是产出分析结果，而是\
  \ *整合并理解推动贵公司变革迫切性的宏观力量*。\n\n## 了解贵公司的组织架构\n\n在进行任何战略分析之前，您应首先明确贵公司的组织架构。实现这一目标最简单的方法是查看贵公司的组织架构图。*图表*一词使用复数是有意为之，因为将存在多个层级。\n\
  \n您需要了解贵公司结构方面的以下内容：\n\n- 贵公司本地组织的架构：\n  - 贵公司直接在多少个国家运营？\n  - 国家或本地组织通常是如何组织的？\n\
  \  - 每个国家是否有自己的领导团队，还是各国销售、客户服务和市场营销团队分别直接向集团销售、客户服务和市场营销管理汇报？\n  - 贵公司本地组织的架构之间存在多大差异？\n\
  - 每个国家或销售组织雇用了多少人？\n  - 每个国家或销售组织雇用了多少人？\n  - 分别有多少人从事市场营销、销售和客户服务职能？\n  - 除销售、市场营销和客户服务之外，本地国家或销售组织还管理哪些其他职能，管理程度如何？这可能包括后台销售支持职能、本地物流和本地\
  \ IT 支持。\n- 集团层级组织：\n  - 这通常是贵公司集团管理的组织架构图\n  - 特别注意 IT 治理：\n    - 集团 IT 负责制定指导方针并提供临时建议，还是牢牢掌控企业\
  \ IT 架构并致力于确保合规？可能介于两者之间，但务必充分了解。\n- 合作伙伴、分销商或经销商网络：\n  - 如果贵公司通过合作伙伴销售产品或服务，这些合作伙伴关系是如何管理的？\n\
  \  - 合作伙伴关系是在集团层面管理，还是由本地销售组织管理？或在某个中间层级管理？\n  - 贵公司与多少家合作伙伴签订了协议？\n  - 贵公司的合作伙伴覆盖哪些国家？\n\
  \  - 贵公司的合作伙伴销售 *全部* 产品和/或服务，还是仅销售其中一部分？\n\n## 小贴士\n\n与人力资源部门沟通，了解贵公司内部的组织架构。关于合作伙伴网络，您可能需要内部调查以确定谁在管理这些关系。\n\
  \n请注意，组织是动态的，小规模的组织变动经常发生，大规模的变动也时有发生。\n\n*要了解组织架构图可能是什么样子，让我们来看一下以下图表中 PME 的公司结构：*\n\
