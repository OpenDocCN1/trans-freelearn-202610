  \nSalesforce项目的每个阶段都有其自己的**关键里程碑**，以及实现里程碑所需的活动。\n\n让我们开始了解您Salesforce项目第一阶段的关键里程碑。\n\
  \n## 预开发阶段的关键里程碑\n\n您Salesforce项目的预开发阶段始于构思。构思被定义为贵公司从一系列CRM提供商中做出技术选择，并且Salesforce被选为未来**CRM平台**的时点。决定CRM提供商超出了本书的范围。\n\
  \n预开发阶段的关键里程碑是为Salesforce实施争取初始预算，并与**Salesforce公司**签订合同，并且最常与**实施合作伙伴**签订合同，以协助您开发和推广解决方案。\n\
  \n要实现这些里程碑，需要进行多项活动。我们将在下一节介绍这些活动。\n\n## 预开发阶段的活动\n\n您Salesforce项目预开发阶段的活动如以下图所示：\n\
