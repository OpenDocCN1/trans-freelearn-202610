  \ 了解客户是谁\n\n您应寻求了解客户的以下关键方面：\n\n- 您有多少客户？\n- 您是否拥有少数大型客户占据了大部分收入，还是收入分散在众多客户中？这一比例是否发生变化？\n\
  - 从收入和员工人数来看，您的客户通常有多大？请了解客户收入的中位数。\n- 您的客户属于哪些行业？\n- 贵客户的终端客户或消费者是谁？\n\n## 了解您销售的产品和服务\n\
  \n您应寻求了解产品和服务的以下关键方面：\n\n- 您的产品如何帮助客户克服挑战？\n  - 如果您拥有多个产品类别和/或客户细分，您应尝试将答案整合为三到四个关键分组，以便清晰易懂\n\
  - 您有多少种产品？\n  - 您是否拥有少数产品占据了大部分收入，还是收入分散在众多产品中？\n- 您的产品和服务是成品、预包装产品和/或服务，还是高度可配置的？\n\
  \  - 同时确保您还确定贵公司是否有计划在未来使产品和服务可配置\n\n## 小贴士\n\n与贵公司本地和集团层面的销售和市场营销领导者沟通，了解您的客户以及您的产品和服务如何为他们创造价值。您还可以请求财务或\
  \ BI 部门提供有关客户的数据和见解方面的帮助。\n\n## 介绍战略分析基础\n\n虽然商业战略的文献浩繁且不断增长，但仍需要对贵公司进行一些基础分析，以了解其现状和变革的迫切性。在本节中，我们将介绍最常用的分析方法。\n\
  \n## 小贴士\n\n如果贵公司拥有自己的战略分析框架，您应利用该战略分析的见解来了解贵公司的现状。\n\n## PESTLE 分析\n\n2020 年代开始于\
  \ Covid-19 大流行后的经济动荡、供应链压力、欧洲的新战争、世界其他地区的持续战争以及通货膨胀。这些都是宏观层面的现象——根据行业和地理位置的不同，以不同方式影响贵公司的状况。\n\
  \n使用 **PESTLE 分析**，您可以将这些影响归类为六个因素：\n\n- **政治：** 政治因素包括任何可能影响或正在影响贵公司的潜在或已实现的政治决策，例如税收、补贴和改革。*您的执行赞助人和高级管理层可以迅速列出他们密切关注的关键当前政治趋势。*\n\
  - **经济：** 这些因素众多；一些关键示例包括通货膨胀、利率、消费者信心、企业信心以及贵公司所服务的市场的 GDP 增长。*您的 CFO 或财务业务合作伙伴是了解影响贵公司的经济因素的首要信息来源。*\n\
  - **社会：** 社会因素涵盖贵公司市场人口的构成和趋势，以及他们的文化偏好。*您的市场营销部门应能很好地洞察目标人群——无论是消费者还是企业——的转变趋势。*\n\
  - **技术：** 这些因素包括可能使您（以及竞争对手）能够以更低的生产成本更高效地生产和交付产品和服务的技术进步，以及更有效地营销和销售产品和服务。常见示例包括制造业自动化，以及更高效的卡车发动机或电动汽车。利用客户洞察进行更好的细分和市场定位以更有效地销售也是技术因素的其它示例。*与贵公司的\
  \ CTO 或创新负责人交谈以收集这些见解。*\n- **法律：** 法律因素包括与贵公司所在行业和运营地区相关的法律先例，以及贵公司可能面临的任何特定法律问题和风险。*贵公司的总法律顾问、您的\
  \ CFO 或风险管理负责人能够与您讨论法律因素，尽管您无法获得所有领域的见解，因为其中一些可能属于保密范围。*\n- **环境：** 这些环境因素包括贵公司运营地区物理环境的关键趋势。明显的例子是气候变化及其直接和间接影响。虽然气候变化的直接影响可能对贵公司影响较小，但间接影响，如政治不稳定、消费者和企业偏好的变化以及产品和服务需求的转变，可能对贵公司的状况产生更大影响。*您的执行赞助人和高级管理层可以告诉您是否有任何环境因素对贵公司特别有影响。*\n\
  \n在明确了影响贵公司的宏观因素后，让我们继续了解贵公司的竞争对手状况。\n\n## 波特五力模型\n\n这是由著名哈佛商学院战略与竞争教授迈克尔·E·波特创建的标准方法，用于分析影响企业竞争状况的各种力量。\n\
  \n\n\n![](img/307881206539c45e128c538a4b6912f8_31_0.png)\n\n图 1.4 – 波特五力模型\n\n让我们逐一分析五种力量：\n\
  \n- **行业竞争**：在描述贵公司行业竞争时，您应寻求回答以下关键问题：\n- **行业竞争的性质**：贵公司及其竞争对手是如何竞争的？示例包括降价、游击式营销方法以及通过独家合同锁定客户。\n\
  - **竞争态势**：贵公司在运营市场中是主导者还是众多竞争者之一？最大的竞争对手是谁？谁在获得市场份额，谁在失去市场份额？使用最近一个报告年度与前一个报告年度进行对比以观察这一趋势。\n\
  - **新进入者的威胁**：是否有迹象或实际的新进入者进入贵行业？他们的运营模式和差异化手段是什么？\n- **替代品的威胁**：客户是否以新的方式使用替代产品或替代品来满足其需求？\n\
  - **供应商的议价能力**：如果贵公司（以及整个行业）越来越依赖数量更少的供应商，那么他们将拥有更大的议价能力，从而导致价格上涨。\n- **买方的议价能力**：与供应商的议价能力类似，如果您向高度集中的客户群体销售，贵公司将拥有更少的议价能力。\n\
  \n## 市场发展\n\n确定贵公司运营的市场是增长、停滞还是衰退。比较贵司关键市场的 **市场发展状况**。此外，请注意贵市场是否存在任何周期性模式和季节性。*您的首席财务官或财务业务伙伴是此处的资讯来源。*\n\
  \n## 公司财务表现\n\n您可能可以轻松从贵公司最新的 **年度报告**（例如，如果贵公司是上市公司）获取这些关键数据。如果不能，请与您的执行赞助人和其财务业务伙伴合作，以了解贵公司财务状况的概况。\n\
  \n- **顶线收入增长**：这告诉您贵公司是否在增长。如果在增长，很好！但请在整体市场增长的背景下理解这一点。如果贵公司增长速度慢于市场，则意味着贵公司正在向竞争对手流失市场份额。您应随后寻求了解其原因。*您的销售和营销组织的负责人应该能够帮助您确定这一点。*\n\
  - *您的财务业务伙伴将能够帮助您了解收入增长的驱动因素。* 请索取 **价格-销量-组合（PVM）分析**，以了解去年与前一年的收入增长是否主要由于销售的产品或服务数量增加、价格提高，或产品和服务组合的变化。\n\
  - **毛利率 %**：确定贵公司的毛利率百分比是增加还是减少。这是贵公司 *生存能力* 的标志。将贵公司的毛利率 % 与主要竞争对手进行比较。如果低于竞争对手，则竞争对手要么能够为其产品和服务获得更高的价格，要么在以更低成本生产产品方面更有效率，或两者兼有。\n\
  \  - 您的财务业务伙伴将能够使用相同的 PVM 分析方法帮助您了解毛利率 % 变化的驱动因素\n- **营业利润 %**：确定贵公司的营业利润 % 是增加还是减少。该数据是贵公司损益表中多个因素的结果。它是贵公司\
  \ *财务可持续性* 的标志。\n  - 请您的财务业务伙伴协助解读并将贵公司的营业利润 % 置于适当背景中\n\n对贵公司财务表现的分析是战略分析的最后一个组成部分。接下来，我们将把所有分析整合在一起。\n\
  \n## 总结贵公司的战略状况\n\n战略分析的最后一步是将关键、最重要且最具影响力的事实、因素和趋势整合和结构化，形成易于理解的概览。让我们探讨经典的 **优势、劣势、机会和威胁（SWOT）**\
  \ 分析模型：\n\n- **优势**：贵公司有哪些关键优势使其在竞争中脱颖而出？\n  - *在 Porter 五力分析以及贵公司财务表现分析中的发现可为此提供参考*\n\
  - **劣势**：贵公司有哪些关键劣势使其容易受到竞争对手的攻击？\n  - *在 Porter 五力分析以及贵公司财务表现分析中的发现可为此提供参考*\n-\
  \ **机会**：贵公司可以追求的关键机会有哪些？\n  - *在 PESTLE 分析以及市场发展分析中的发现可为此提供参考*\n- **威胁**：针对贵公司的关键威胁有哪些，贵公司应积极缓解？\n\
  \  - *在 PESTLE 分析以及市场发展分析中的发现可为此提供参考*\n\n为了了解 SWOT 可能包含的内容，让我们来看一下我们案例公司 PME 的 SWOT\
  \ 分析：\n\n- **优势**：\n- *现有客户信赖的品牌*\n- *庞大且经验丰富的制造能力，能够生产出优于竞争对手的产品*\n- **劣势：**\n\
  \  - *公司财务表现。顶线收入增长慢于竞争对手——正在流失市场份额。PVM 的驱动因素仅是销量*\n  - *缺乏现代商业组织所需的现代系统支持*\n  -\
  \ *客户体验下降以及与竞争对手相比下降的 **客户满意度（CSAT）***\n- **机会：**\n  - *通过商业化服务产品，将服务部门转变为利润中心*\n\
  \  - *多个目前未被服务的细分市场，分布在各个地理区域*\n- **威胁：**\n  - *现有和新的竞争对手正在迅速开发新的方式来现代化其公司的进入市场策略，从而获得更多市场份额。竞争对手为客户提供自动化和个性化的营销沟通、无缝全渠道购买体验、数字自助服务和预测性维护解决方案。*\n\
  \  - *一些竞争对手还利用 **物联网（IoT）** 和 **人工智能（AI）** 技术提供先进的预测和指导性洞察，以提升其客户体验。*\n\n在收集了有关贵公司战略地位的见解后，现在是时候将这些见解用于创建\
  \ Salesforce 项目愿景了。\n\n## 定义 Salesforce 项目的愿景\n\n通过整合您的战略分析，您应该对 Salesforce 项目的潜在目的有良好的了解。\n\
  \n为了让您自己、Salesforce 工作组以及最终更广泛的组织都一目了然，请确保您能够解释为什么现在是开展 Salesforce 项目的正确时机。\n\n\
  ### 为什么是现在？\n\nSalesforce 项目现在被考虑的主要原因是什么？\n\n实施 Salesforce CRM 的常见原因包括以下内容：\n\n\
  - 丧失竞争优势：\n  - 竞争对手通过提供卓越的购买过程客户体验而获得市场份额，而您当前的客户要求得到更好的服务\n  - 您的市场分析、竞争对手分析和 SWOT\
  \ 应该表明这是否是主要原因\n\n### 旧版 CRM 系统原因：\n\n- 自建 CRM 系统无法维护/升级以支持贵公司数字化转型的雄心\n- 您的分析（或企业架构师的分析）应该已经发现这一点\n\
  - 旧版 CRM 系统许可证和支持即将到期：这可能是由于贵公司决定不再继续使用现有 CRM 系统，或可能是由于您当前的供应商决定您的（本地部署）CRM 系统已达到生命周期末期\n\
  - 无系统支持：\n  - 贵公司没有 CRM 系统来支持业务流程：您的业务用户使用电子邮件和电子表格来管理其营销、销售和客户服务运营\n\n*对于我们的案例公司\
  \ PME 而言，现在是 Salesforce 项目正确时机的最主要原因是，当前的 CRM 系统不足以满足 PME 领导层的数字化转型雄心。此外，几个较小的国家并未使用\
  \ PME 提供的 CRM 系统，因为他们认为它笨重且不令人满意。总的来说，他们转而使用电子邮件和电子表格，有些甚至为其他小型 CRM 供应商和电子邮件营销供应商购买了许可证（这让\
  \ IT 团队非常沮丧）。最后，客户流失率正在增加，CSAT 评分正在下降，客户服务部门被客户电话和电子邮件淹没。*\n\n贵公司可能还有其他正当理由说明为什么\
  \ *现在* 是开启新 CRM 之旅的正确时机。不管原因是什么，请确保\n\n你完全理解它，并且你的更广泛的利益相关者群体与之保持一致。\n\n在确定了 *现在*\
  \ 是 Salesforce 项目的正确时机之后，让我们继续为你的 Salesforce 项目制定愿景。\n\n## 为您的 Salesforce 项目创建愿景\n\
  \n为了确保你的 **愿景声明** 能达到其目的，让我们先了解一下 Salesforce 项目愿景声明的特征。\n\nA vision statement should\
  \ fit the following criteria:\n\n愿景声明应符合以下标准：\n\n- 是一个简短的单句段落\n- 描述你 Salesforce\
  \ 项目的本质和目标\n- 不应是技术性的\n- 你的利益相关者应易于理解\n- 面向员工作为受众\n- 应激发对未来和 Salesforce 项目的兴奋感\n\
  \n你和你的 Salesforce 工作组在确定合适的愿景声明之前可能会制作多个草案。\n\n## 提示\n\n与你的执行赞助人进行会议，以确保做对。\n\n\
  PME 的 Salesforce 工作组已进行多轮信息收集，以形成对 PME 情况、挑战以及为何现在是其 Salesforce 项目正确时机的综合看法。他们也完成了预开发阶段的第一个主要活动：他们已创建了与其利益相关者一致的\
  \ Salesforce 项目愿景：\n\nPME 的 **Salesforce CRM** 项目将 **使我们能够专注于** 跨 **营销、销售和客户服务**\
  \ 的增值、面向客户的活动，这些活动 **对我们来说具有刺激性**，同时 **为我们的客户提供愉悦的体验**。\n\n让我们分解 PME 愿景声明的结构。首先，它明确了项目\
  \ *面向谁*，即营销、销售和客户服务部门的员工。它还明确说明了项目将 *使* PME 能够做什么，即专注于增值、面向客户的活动，而非当前笨重、手动的 CRM\
  \ 系统状态。最后，PME 的愿景声明说明了项目发生的 *原因*：激发 PME 员工并取悦客户。\n\n在为你的 Salesforce 项目制定了清晰的愿景后，你已准备好进入\
  \ Salesforce 之旅的下一章。\n\n## 在预开发阶段进行迭代\n\n到目前为止，你一直与公司的内部利益相关者互动，以了解公司并为你的 Salesforce\
  \ 项目创建愿景。内部利益相关者在定义 Salesforce 项目时至关重要。如前所述，随着你在预开发阶段活动的推进，随着你获得更多知识并发现有关公司及其环境的新的见解，你可能会回过头来修改你的组织概述和战略分析。你也可能会对\
  \ Salesforce 项目的愿景声明进行微调，只要不是 180 度的转变，这都是可以的。\n\n因此，请注意不要将事情视为不可更改的终极真理和神圣决定。在预开发阶段的第一次迭代中保持开放的心态。\n\
  \n## 摘要\n\n自本章开始以来，你已经走了很远。首先，你了解了 Salesforce 项目实施生命周期的各个阶段。接下来，你了解了 Salesforce\
  \ 项目预开发阶段的关键里程碑、成果和活动。然后，你努力理解并描述了公司的情况和变革的必要性，从而能够为你的 Salesforce 项目创建愿景。\n\n在为你的\
  \ Salesforce 项目确立了愿景——the *why*——之后，你已准备好进入 Salesforce 实施的下一章，第 2 章，*Defining the\
  \ Nature of Your Salesforce Project.*\n\n## 定义您的 Salesforce 项目的性质\n\n在本章中，你将学习如何界定\
  \ Salesforce 项目所需的业务能力范围，并确定支持这些能力所需的高层次假设技术范围。这两个要素 together 将被称为你的 Salesforce\
  \ 项目的性质。\n\n你将了解业务流程映射和设计研讨会，以便了解当前业务流程并定义 Salesforce 解决方案的业务能力。然后，你将了解 Salesforce\
  \ 许可类型，并学习如何确定 Salesforce 解决方案的高层次假设技术范围。\n\n我们将继续关注我们的案例公司 **Packt Manufacturing\
  \ Equipment (PME)**，并逐步开展活动以定义其 Salesforce 项目的性质。\n\n在定义了项目的性质后，你将准备好进入 Salesforce\
  \ 实施预开发阶段的下一个活动。\n\n本章将涵盖以下主要主题：\n\n- 定义 Salesforce 解决方案应支持的能力\n- 确定 Salesforce\
  \ 解决方案的高层次技术范围\n- 在预开发阶段进行迭代\n\n开始吧！\n\n## 定义 Salesforce 解决方案应支持的能力\n\n在上一章中，你确定了公司的情况以及\
  \ Salesforce 项目的整体目的和愿景。如以下图表所示，现在是时候更具体地定义你的 Salesforce 项目的性质了：\n\n![](img/307881206539c45e128c538a4b6912f8_42_0.png)\n\
  \n图 2.1 – 预开发阶段的活动\n\n在开始定义 Salesforce 项目的业务能力之前，让我们先了解业务能力是什么以及为什么要定义它们。\n\n##\
  \ 了解业务能力\n\n所有公司和组织都有若干 **业务能力**。但它们到底是什么？业务能力由具备技能或专业领域的 **人员** 组成，他们根据 **业务流程**\
  \ 执行工作，由一个或多个 **系统** 支持，同时能够访问相关 **数据** 并创建和更新数据以实现期望的 **业务成果**。\n\n一个常见的业务能力的例子是\
  \ **账户和联系人管理**。账户和联系人管理涵盖公司管理客户及其联系人数据的能力和流程。\n\n如你所想，在确定技术范围应是什么之前，了解和绘制公司的业务能力非常重要。原因在于系统是业务能力的一个组成部分。在深入技术架构和设计之前，了解\
  \ Salesforce 解决方案应支持哪些业务能力和业务成果是 *至关重要* 的。\n\n业务能力可能在较小或较大程度上实现期望的成果。我们说业务能力 *成熟度各不相同*，因此让我们来探讨业务能力成熟度。\n\
  \n## 了解业务能力成熟度\n\n为了理解业务能力成熟度的概念，让我们看一个简单的例子。\n\n如果你的公司为客户提供任何形式的支持，你就隐含地拥有一个 *客户服务*\
  \ 领域的业务能力。具体业务能力可能是客户服务工单管理或在 Salesforce 解决方案中常被称为的 **案例管理**。你目前可能除了客户服务电话号码和有人接听电话回答客户咨询外，几乎没有系统支持。客户服务人员可能几乎没有接受过预定义流程的结构化培训，也无法访问任何有助于他们提供客户服务的数据。在这种情况下，你当前的案例管理业务能力可被归类为具有\
  \ *低成熟度*。\n\n另一方面，你的客户服务能力可能由受过良好培训且熟练的人员组成，他们按照预定义流程工作。他们还可能得到一个对齐且适合目的的系统支持，该系统提供足够的数据洞察，帮助客户服务人员提供一流的客户服务。如果这些描述成立，你的案例管理业务能力将被认为具有\
  \ *更高的成熟度*。\n\n接下来，让我们看看如何对业务能力进行分类。\n\n## 对业务能力进行分类\n\n业务能力按 **领域** 分组，其中领域代表公司的整体职能，例如营销、销售、客户服务、运营、财务、IT\
  \ 和人力资源。\n\n在深入业务能力的具体细节之前，提前确定 Salesforce 项目范围内的整体业务领域至关重要。\n\n除了按领域对公司的业务能力进行分组并评估每个能力的成熟度外，你还应意识到每个公司都不同。不同的领域和业务能力在不同行业以及公司不同的业务线和地区之间存在差异，因此需要逐案识别。了解哪些业务能力被认为\n\
