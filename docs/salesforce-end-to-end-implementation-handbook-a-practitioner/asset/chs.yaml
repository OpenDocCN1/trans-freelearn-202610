  \ 修复错误并对业务流程进行回归测试。2. 调查错误是如何重新出现的根本原因，然后进行修复。 |\n| 用户无法区分错误和新想法，因此将新想法报告为错误。 |\
  \ 在决定“只是修复错误”之前，分析它是否真的是错误、增强功能，还是只是“流程问题”。您可以通过将测试的功能追溯到用户故事或测试用例来做到这一点。这可能是您的产品负责人应将修复价值与其它待办事项进行优先排序的情况。如果不是，可能是测试用例写得不正确、变更请求或功能请求。无论此分析的结果如何，对于\
