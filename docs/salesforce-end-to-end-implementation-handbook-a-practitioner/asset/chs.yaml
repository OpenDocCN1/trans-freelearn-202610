  \ KPI 目标，但未达到采用目标或反之？整体市场是在增长还是放缓？\n3. 创建一个网格，以了解哪些国家/业务职能的表现优于原始商业案例中的目标，哪些表现不佳。\n\
  4. 如果业务表现与 Salesforce 解决方案的采用和使用之间存在相关性，则这是证明因果关系的先决条件。\n5. 与团队和本地团队分享您的发现，并制定适当的行动方案以改善业务表现。\n\
  \n表 11.3 – 难以采用和改善业务表现的可能根本原因\n\n接下来，让我们评估 Salesforce 项目在推广阶段的情况。\n\n## 评估您的 Salesforce\
  \ 项目状态\n\nSalesforce 项目的推广阶段涉及大量主题和活动。如果您遇到困难，或对推广进度不满意，本节将帮助您评估 Salesforce 项目的状态。对于您无法核对的每项内容，请返回相应章节并完成活动以继续推进您的\
  \ Salesforce 项目。\n\n## Salesforce 项目推广阶段检查清单\n\n在推广阶段，您应已完成以下活动。\n\n在通过环境部署 Salesforce\
  \ 解决方案时，您应已执行以下操作：\n\n- 确保您已完善部署计划和检查清单，也称为部署运行手册：\n  - 关键包括如何验证和签署您的部署\n- 执行 SIT\
  \ 以识别并解决并发流和/或已在生产环境中的合并冲突\n\n接下来，您应已完成以下活动以执行解决方案的 UAT：\n\n- 确定谁应参与并推动 UAT\n- 定义并明确验收测试团队应遵循的流程以及用于报告错误和变更请求的模板\n\
  - 向错误和变更请求报告者反馈状态以及您打算如何处理它们\n\n接下来，您应已完成以下活动以检查数据迁移准备情况：\n\n- 在暂存环境中成功执行至少一次数据迁移的演练\n\
  - 确保执行数据迁移的团队了解其任务并已安排时间——包括负责签署数据迁移的业务和技术利益相关者\n- 传达数据迁移计划及其相关的任何预期停机时间\n- 制定在迁移失败或耗时超过接受范围时的回退计划\n\
  \n接下来，您应已通过以下方式规划、传达并管理即将到来的变更：\n\n- 明确了解将发生什么变化以及针对哪些利益相关者\n- 如果向多个地理区域推广，则创建分阶段推广计划\n\
  - 创建变更管理计划模板，并在分波推广过程中根据进展进行调整，包括每个推广波：\n  - 变更准备度评估\n  - 沟通计划\n  - 整体推广计划\n  -\
  \ 管理和组织赋能计划\n  - 变更代理招募和赋能\n  - 本地技术部署计划\n  - 本地数据迁移计划\n\n接下来，您应已完成以下培训用户准备工作：\n\
  \n-   确定了培训方法的组合以最大化影响力\n-   考虑并规划了对用户以及本地领导层的培训\n-   沟通了培训计划并获得了本地组织的确认 - 并执行了该计划\n\
  -   对应用管理、支持团队、数据、BI、报告和分析人员进行了培训并赋能\n\n接下来，你应已完成以下准备工作以提供超期关怀并管理生产支持：\n\n-   确定了超期关怀和持续支持流程\n\
  -   分配了资源并明确了角色和职责\n-   决定了从超期关怀过渡到持续支持的标准 – 实现采用目标\n\n最后但绝非最不重要，你应执行以下活动以监控并推动\
  \ Salesforce 解决方案的采用：\n\n-   创建了报告和仪表板以跟踪 Salesforce 的登录和使用情况\n-   发送并分析了调查问卷的回复以了解用户对\
  \ Salesforce 的感受\n-   进行了访谈以更好地了解用户对 Salesforce 解决方案的看法和改进建议\n-   对抗拒变革的个人或用户群体进行干预\
  \ – 以了解根本原因并赋能和支持他们在 Salesforce 上取得成功\n-   评估了业务相对于 Salesforce 项目原始商业案例的表现 – 并看到其趋向于该目标\n\
  \n你可能会在 Salesforce 项目的推广阶段遇到重大阻力。如果你一直按部就班地推进 Salesforce 项目，你已非常接近（即时）终点线 – 为你的组织提供更优的\
  \ CRM 解决方案以释放更大的业务价值。\n\n不要忘记在继续尝试变革举措和干预措施的同时，对自己和团队表示祝贺 – 并为未来的推广阶段调整你的方法。\n\n\
  ## 摘要\n\n在本章中，你已熟悉推广阶段经常遇到的常见问题，并学会了如何减轻或防止其出现。你还通过阶段检查清单评估了 Salesforce 项目的状态。\n\
  \n在 Salesforce 解决方案的推广工作进展顺利的情况下，你已准备好将 Salesforce 项目提升到下一个阶段，即持续改进阶段，从第 12 章《演进你的\
  \ Salesforce Org 和 DevOps 能力》开始。\n"
- '## 第 4 部分：持续改进阶段


  本部分将教你如何将组织转变为产品型组织。我们将介绍你需要做什么来为用户和组织提供 **持续改进 (CI)**，以最大化从 Salesforce 投资中获得的价值。我们还将讨论常见问题，以便你能够避免或减轻它们。


  本部分包含以下章节：


  -   *第 12 章*，演进你的 Salesforce Org 和 DevOps 能力

  -   *第 13 章*，管理你的 Salesforce 数据以收获 Customer 360 的成果

  -   *第 14 章*，持续改进阶段应避免的常见问题

