  ## 前言\n\nSalesforce 已连续 9 年被评为 #1 CRM 提供商。在截至 2022 年 7 月的财季中，Salesforce 超越 SAP 成为全球最大的企业应用提供商。自成立以来，Salesforce\
  \ 通过构建和收购额外的互补产品，扩展了最初以销售领域为重点的 CRM 方案——现已涵盖销售、电子商务、服务、现场服务、营销自动化、集成、RPA、分析、AI 等诸多领域。\n\
  \n随着这巨大的增长和扩张，Salesforce 的实施也出现了业务和技术复杂性以及组织互联性和依赖性的激增，所有这些都影响了 Salesforce 项目和计划的交付方式。\n\
  \n关于 Salesforce 架构以及开发 Salesforce 解决方案的技术方面（无论是有代码还是无代码）的文献非常丰富，并且没有缺乏涵盖特定 Salesforce\
  \ 云的优秀实施手册。令人惊讶的是，没有一本书涵盖 Salesforce 项目或计划的实施生命周期。\n\n如果您的组织打算投资——或已经投资——Salesforce，您希望确保从该投资中获得最大价值。当\
  \ Salesforce 被您的组织精细调整并采用，并且持续为您的用户和组织提供增量价值时，价值就会得到释放。\n\n本书提出了一个框架，说明如何处理 Salesforce\
  \ 实施项目以及如何让您的组织成功管理 Salesforce 计划。在此过程中，本书将为您提供有关常见问题以及减轻或完全防止这些问题的策略的见解。\n\n为了能够涵盖一个范围广泛的主题，本书是跨职能和多维的。这意味着它涵盖了许多学科和领域，而不会成为专门针对某一特定主题的纯粹书籍。\n\
  \n涵盖的主题——全部在 Salesforce 背景下——包括以下内容：\n\n- 业务架构和战略\n- 企业架构\n- Salesforce 架构\n- 项目管理\n\
  - 敏捷\n- DevOps\n- 治理\n- 变更管理\n- 计划管理\n- 数据管理与分析\n- 产品管理\n\n我希望这种方法能让您全面了解 Salesforce\
  \ 项目和计划的性质——而不至于迷失在细节中。\n\n到本书结束时，您将获得知识，能够为 Salesforce 项目和计划的成功奠定基础，并从投资中获得最大价值。\n\
  \n### 本书适合谁\n\n本书面向计划为其组织实施 Salesforce 或已在实施 Salesforce 的 Salesforce 顾问、架构师、项目和计划经理以及产品负责人。Salesforce\
  \ 实施合作伙伴的 Salesforce 顾问和交付负责人阅读本书也会受益。\n\n如果您正在将职业生涯转向 Salesforce 生态系统——一个充满活力、包容性强、回报极高且不断发展的社区——本书将让您很好地了解在\
  \ Salesforce 项目和计划中工作时应期待什么。\n\n### 本书涵盖内容\n\n第 1 章，*为您的 Salesforce 项目创建愿景*，首先介绍了\
  \ Salesforce 实施的生命周期，并为您概述了 Salesforce 项目的开发前阶段。然后深入探讨战略分析和方法，帮助您了解公司变革的必要性。这将使您能够定义\
  \ Salesforce 项目的愿景——您的 *why*。\n\n第 2 章，*定义您的 Salesforce 项目的性质*，将带您了解在定义 Salesforce\
  \ 项目范围时将开展的活动。我们还将探讨您如何——在此早期阶段——开始考虑如何将其转化为 Salesforce 解决方案的高级技术范围，以及至关重要的是，通常应考虑哪些技术使能因素。这将使您能够定义\
  \ *what*。\n\n第 3 章，*确定如何交付您的 Salesforce 项目*，探讨交付方法、变更管理和治理等主题。您将了解在决定项目合适的交付方法时应考虑哪些方面，以及如何区分项目和计划。我们还将讨论项目分阶段的各种方法的优缺点。我们将介绍\
  \ Salesforce 项目通常会带来哪些变化，以及您应如何管理它。最后，我们将指导您为整体 Salesforce 治理奠定基础——您的 Salesforce\
  \ 卓越中心。本章使您能够回答 Salesforce 项目的 *how*。\n\n第 4 章，*获得资金并与 Salesforce 和实施合作伙伴[content]\n\
