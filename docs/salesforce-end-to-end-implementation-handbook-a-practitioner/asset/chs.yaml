  \ |\n\n\n\n> 我们将在第12章《演进您的Salesforce组织和DevOps能力》中讨论项目管理与持续改进。\n\n表5.3 – 预开发阶段进展缓慢的可能根本原因\n\
  \n接下来，让我们评估您的Salesforce项目。\n\n## 评估您的Salesforce项目的状态\n\n我们已在本Salesforce项目预开发阶段涵盖了许多主题、领域和活动。其目的是使您能够交付成功的Salesforce项目。\n\
  \n如果您的项目似乎陷入停滞，或您对进展不满意，以下部分将帮助您评估Salesforce项目的状态。对于您无法勾选的每项，请返回相应的章节并完成活动以继续推进您的Salesforce项目。\n\
  \n## 预开发阶段Salesforce项目的检查清单\n\n在预开发阶段开始时，您已完成以下基础步骤：\n\n- 为您的Salesforce项目聘请了一位高层赞助人\n\
  - 创建了一个Salesforce工作组来推动预开发阶段的活动\n\n接下来，您已完成以下活动以了解公司战略状况：\n\n- 了解公司组织结构\n- 了解您的客户是谁\n\
  - 了解公司销售的产品和服务\n- 了解公司的竞争状况\n- 了解*为何现在*是开展Salesforce项目的正确时机\n- 为您的Salesforce项目创建了*愿景*——与高层赞助人和关键利益相关者保持一致\n\
  \n接下来，您已完成以下活动以定义Salesforce项目的性质：\n\n- 了解范围内的业务能力\n  - 人、流程、系统和数据\n- 涉及终端用户\n- 设想未来能力\n\
  - 确定高层技术范围\n  - 已包含技术使能和非功能性需求\n- 开始构建您的**风险、假设、问题和决策** (**RAID**) 日志\n\n接下来，您已完成以下活动以决定如何交付您的Salesforce项目：\n\
  \n- 了解您是在准备Salesforce项目还是项目群\n- 选择了Salesforce项目的交付方法\n  - 如果是混合方法，您已阐述并描述了如何定义您的方法\n\
  - 考虑了项目分阶段方法（地理和范围）\n- 确定了变更管理和沟通策略\n  - 考虑了变更影响程度\n  - 考虑了变更管理活动的时机\n- 设想了您的Salesforce\
  \ **卓越中心 (CoE)**\n  - 创建了章程\n  - 确定了CoE的结构和职责\n  - 为您的Salesforce项目群创建了路线图\n\n接下来，您已完成以下步骤以确保Salesforce项目的资金：\n\
  \n- 定义了KPI及其目标\n- 创建了财务预测\n  - 估算了收入影响\n  - 估算了成本影响\n    - 运营成本\n    - 许可成本\n  \
  \  - 实施和推广\n- 确定了Salesforce CoE运营模式\n- 计算了Salesforce项目的**损益 (P&L)** 预测、ROI和投资回收期\n\
  - 向高级管理层提交了Salesforce项目商业案例\n\n在为项目获得资金后，您已执行以下操作：\n\n- 向Salesforce请求报价\n- 定义了选择实施合作伙伴的流程\n\
  - 评估并选择了实施合作伙伴\n- 与实施合作伙伴签订合同\n- 在合同中明确各方职责时保持谨慎\n- 建立了Salesforce CoE\n\n在预开发阶段之旅的每个章节中，您可能发现自己需要进行迭代。退一步，改变一些要素，然后继续前进。\n\
  \n## 总结\n\n在本章中，您已通过清单评估了Salesforce项目在预开发阶段的状态。您还熟悉了预开发阶段常见的常见问题，并学习了如何减轻或防止其出现。\n\
  \n在您的Salesforce项目状况良好后，您已准备好进入旅程的下一步，即开发阶段，从*第6章*、*详细说明初始版本的范围和设计*开始，在那里我们将共同创建您的业务流程、编写用户故事，并为您的初始Salesforce版本创建解决方案设计。\n\
  \n## 第2部分：开发阶段\n\n本部分将教您如何进一步定义Salesforce项目的范围并了解其解决方案设计。我们还将带您了解开发流程和测试活动，并讨论常见问题，以便您可以避免或减轻它们。\n\
  \n本部分包含以下章节：\n\n- *第6章*，详细说明初始版本的范围和设计\n- *第7章*，构建和测试初始版本\n- *第8章*，开发阶段应避免的常见问题\n\
  \n## 详细说明初始版本的范围和设计\n\n在*第1部分，预开发阶段*中您所做的艰苦工作之后，本Salesforce项目**开发阶段**的第一章将指导您完成关键活动和里程碑。接下来，我们将介绍如何将您在预开发阶段定义的高层范围分解为**用户故事**。然后，我们将介绍如何确定适当的前期架构水平，以及应创建哪些**Salesforce架构制品**。最后，我们将讨论如何理解用户故事解决方案设计并说明您的**目标解决方案架构**。\n\
  \n本章提供了创建用户故事的最佳实践，以最大化开发适合您业务的*正确*解决方案的机会。我们描述了您应在Salesforce项目开发阶段及以后创建和维护的解决方案设计制品！\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- Salesforce项目开发阶段概述\n- 详细说明初始版本的范围\n- 为初始版本创建解决方案设计\n\n\
  让我们开始吧！\n\n## Salesforce项目开发阶段概述\n\n本阶段是架构师、业务分析师、项目经理、Scrum Master和开发人员最熟悉的Salesforce项目阶段。重点在于详细说明需求、设计解决方案并构建和测试它们。\n\
  \n让我们来看看该阶段的里程碑。\n\n## 开发阶段的关键活动和里程碑\n\n该阶段始于**项目启动会**，项目经理、业务领导、架构师和项目赞助人向此时入职的项目团队成员介绍项目愿景和性质。\n\
  \n在项目启动会后，开发阶段的下一个关键里程碑如下：\n\n- 详细说明您的版本范围\n- 完成您版本的解决方案设计\n\n注意\n\n达到前两个里程碑的活动有时被称为**准备阶段**，因为项目正在准备开始构建解决方案。\n\
  \n- 建立团队的开发流程\n- 完成您版本的构建和测试\n- 创建您的数据迁移计划\n- 详细说明初始推广、培训和变更管理计划\n\n提示\n\n如果您为项目选择了纯敏捷交付方法，您将在*第12章*、*演进您的Salesforce组织和DevOps能力*中找到设置灵感。\n\
  \n在确定了开发阶段整体里程碑和活动*是什么*之后，让我们看看您的开发阶段可能需要*多长时间*。\n\n## 开发阶段的持续时间\n\n根据以下主要因素，Salesforce项目的开发阶段可能需要*从几周到数月*不等的时间来完成：\n\
  \n- 您的Salesforce项目的范围\n- 您选择的交付方法：\n  - **纯敏捷**：您将在功能开发完成后按需将工作软件发布到生产环境\n  - **纯瀑布**：您在项目结束时部署版本，当版本通过用户验收测试后\n\
  \  - **混合**：您可能会按照纯敏捷或纯瀑布交付方法进行发布\n- 分配和可用的资源：\n  - **业务资源**：这包括一位专职的**产品负责人 (PO)**\
  \ 来负责和收集需求，并验证功能交付。PO的可用性、投入度、经验和能力对项目都有重大影响。\n  - **技术资源**：这些是架构师、功能Salesforce顾问、Salesforce开发人员和QA专家（测试人员），以及可能需要对与Salesforce集成的系统进行更改的其他技术资源。所需资源可用性的协调和时机是优化项目交付的关键任务。\n\
  \n\n\n\n### 提示\n\n除非你的项目是绿地实施——意味着这是贵公司首次使用 Salesforce——对于大型项目（例如新的云产品如 Field Service\
  \ 或主要产品如 CPQ），你应将*限制准备阶段*最多控制在几个月内，以确保需求输入和目标流程仍然相关。\n\n为了简洁起见，本书本节将聚焦于*混合敏捷交付方法*，其中在开始构建阶段之前会进行一些活动来详细说明\
  \ Salesforce 项目的范围并创建前期架构。\n\n### 重要说明\n\n项目启动后的里程碑和活动将以冲刺（纯敏捷）、阶段（瀑布）或混合（混合敏捷）的形式进行。\n\
  \n为重温差异，请参阅*第 3.2 图*，位于*第 3 章*，*确定如何交付您的 Salesforce 项目*。\n\n让我们看看谁将监督你的 Salesforce\
  \ 项目。\n\n## 在开发阶段中你的 Salesforce CoE 的角色\n\n回顾你在预开发阶段被鼓励建立的*Salesforce 任务组*，它推动相关活动。它包括贵公司三个关键领域的资源：业务、技术和项目管理办公室。*你*很可能隶属于其中一个职能部门。\n\
  \n你的 Salesforce 任务组已确定项目范围内的能力和 Salesforce 云产品——并为至少初始版本 secured 预算。你的 Salesforce\
  \ 任务组还与实施合作伙伴签约，以支持交付初始版本。\n\n在预开发阶段之后，你的 Salesforce 任务组不应被解散，而应演变为你的 Salesforce\
  \ **卓越中心 (CoE)**。你的 Salesforce CoE 成员非常适合*管理初始版本的交付*。\n\n在*第 3 章*，*确定如何交付您的 Salesforce\
  \ 项目*中，你设想了 Salesforce CoE 的结构和职责。现在是执行并建立它的时机。\n\n在混合交付方法中，下一步活动是将业务能力分解为更小的待办事项，以便你的实施合作伙伴的开发人员和功能顾问可以消费并交付可工作的解决方案。\n\
  \n## 详细说明初始版本的范围\n\n你项目的下一步工作是将愿景和能力——业务流程——转化为产品待办事项。将业务能力分解为更小的待办事项需要你通过一系列研讨会让\
  \ Salesforce 解决方案的终端用户参与其中。\n\n在*第 3 章*，*确定如何交付您的 Salesforce 项目*中，我们讨论了三种可选择的整体交付方法——*纯瀑布*、*混合敏捷*和*纯敏捷*。\n\
  \n由于本节涵盖混合敏捷交付方法，让我们考虑为开发做准备的活动：\n\n- 做出努力建立基础架构，包括但不限于确定 Salesforce 组织策略、集成、数据迁移、数据备份和归档以及报告策略，以及开发和环境策略\n\
  - 详细说明项目范围内的业务流程（客户和用户旅程），并为其创建解决方案设计\n\n### 提示\n\n在混合敏捷中——在建立基础架构之后——你可以选择详细说明项目范围内的所有流程——以及解决方案和估算。或者，你可以决定详细说明足够数量的待办事项以填满最初几个冲刺，并与冲刺开发团队同时，投入资源在并行的设计流中进行持续的待办事项细化。\n\
  \n让我们开始详细说明贵公司未来的业务流程。\n\n## 共同创建未来的业务流程\n\n你可能还记得第 2 章《定义你的 Salesforce 项目的性质》中的活动，在那里你主持了研讨会以确定当前能力、其流程以及利益相关者的当前痛点和建议。\n\
  \n而那些研讨会的目的是确定和理解当前流程，开发阶段研讨会的目的是创建由 Salesforce 支持的未来流程。\n\n为初始版本范围内的每项能力——流程——计划并主持研讨会。回顾第\
  \ 2 章《定义你的 Salesforce 项目的性质》中提出的研讨会结构，但请遵循以下建议议程：\n\n- **欢迎和介绍：** 主持人欢迎参与者并介绍议程和目标，参与者进行自我介绍：\n\
  - **研讨会目标**：分享你在*第 1 章，创建你的 Salesforce 项目愿景*中制定的愿景声明\n  - 你正在寻求参与者宝贵的意见来塑造贵公司未来的\
  \ CRM 系统\n- **练习**：将整体研讨会目标分解为较小的练习，并在适当休息之间进行：\n  - **第一个练习**：回顾你在*第 2 章，定义你的 Salesforce\
  \ 项目的性质*中定义的当前流程，并回顾痛点和改进建议：\n    - 这种方法本身就很有价值——此外还有助于创造紧迫感并激发变革欲望\n  - **第二个练习**：是时候从零开始并开始共同创建未来流程了。这可能会令人望而生畏——作为一个团队盯着空白画布。以下是一些帮助你入门的方法：\n\
  \    - 通过简要讨论流程起点之前发生了什么以及终点之后会发生什么，来确定整体业务流程的开始和结束。\n    - 说明流程中的总体阶段：例如，创建、分配、执行和执行后。\n\
  \    - 通过确定哪些**角色**参与业务流程来创建**泳道**——你可以使用为当前流程确定的角色。\n\n### 提示\n\n牢记研讨会的目标和重点，并引导参与者避免陷入对每个流程步骤细节的过度分析。\n\
  \n- 如前所述，请对*变化*给予*极大关注*。如果你的解决方案将被多个区域和/或业务线使用，请务必在实际可行的情况下纳入每个区域的利益相关者——如果 Salesforce\
  \ 项目的目标是统一业务流程。\n\n### 提示\n\n在设计研讨会之前，确保与你的实施合作伙伴保持一致，以确定各方的角色和职责，从而最大化研讨会的产出。如果你正在与实施合作伙伴合作，他们应该能够提供经验丰富的业务分析师和/或架构师来主持和推动研讨会。\n\
  \n根据 Salesforce 项目范围内的业务能力的范围和性质，经验丰富的**Salesforce 业务分析师**可能足以支持你的业务利益相关者共同创建由 Salesforce\
  \ 支持的未来业务流程。对于绿地实施以及更复杂的实施，请务必在研讨会中纳入**Salesforce 解决方案架构师**。他们的意见和经验将确保所提出的流程从 Salesforce\
  \ 角度来看是合理的。\n\n让我们看看每次研讨会后的下一步。\n\n## 撰写用户故事\n\n在每次研讨会后，你的产品负责人或实施合作伙伴将使用共同创建的未来业务流程为每个史诗或业务流程创建待办事项，也称为**用户故事**。\n\
  \n用户故事应是一句易于理解的句子，描述——从*用户*的角度——他们*想要*能够做什么以及*为什么*。让我们分解一下：\n\n- **角色**：他们可能是业务流程的一部分的内部或外部人员：\n\
  \  - 内部角色示例：特定职能的员工\n  - 外部角色示例：客户、合作伙伴或供应商\n- **需求**：角色在流程步骤中想要能够做什么？\n- **目的**：这实现了什么业务成果？\n\
  - 请注意，目的应与项目的整体业务目标相联系。用户故事的*目的*不仅仅是为了能够进入业务流程的下一步。\n\n应为业务流程中的每个步骤编写用户故事。\n\n撰写用户故事时应注意以下几点：\n\
  \n- 它们不应使用 Salesforce 特定的语言编写，而应与技术和系统无关\n- 它们应关注业务需求、问题和期望的业务成果，而不应描述期望的解决方案\n\n\
  遵循上述建议将确保实施合作伙伴的专家顾问为你的业务寻找最佳解决方案。\n\n### 重要说明\n\n\n\n确保为您的 Salesforce 解决方案的每个领域分配一名\
  \ PO 负责。如果单个业务利益相关者不能代表解决方案范围内的所有业务领域，您可以考虑任命一人负责所有领域，或分配多名 PO 负责不同领域。对此决策保持警惕，因为您需要指定一名\
  \ **首席 PO**，以便在两个 PO 的需求相互矛盾或重叠时做出最终决策。\n\n## 审查和详细化用户故事\n\n您的 PO *审查所有用户故事* 负责的业务流程。\n\
  \n虽然研讨会的目的是确保该能力的端到端业务流程健全、精简且合乎逻辑，并且能够推动良好的用户和客户体验，但此阶段的目标是确保每个用户故事的细节和上下文保持一致并得到记录。因此，PO\
  \ 应执行以下操作：\n\n- **审查** 拟议用户故事的 *用户*、*需求* 和 *目的*，并进行必要的修改。\n- 添加 **进一步的上下文**，帮助其他业务利益相关者从流程步骤中角色的视角理解情况。这可能包括额外的描述、文档、屏幕截图、列表或其他媒体。\n\
  - 虽然在纯敏捷中可能并非严格必需，但向用户故事添加 *简短且简单* 的 **验收标准** 语句强烈建议，原因有三：\n  - 它使每个用户故事都能与 Salesforce\
  \ 项目中包含的史诗的预期业务成果相联系。\n  - 它为其他业务利益相关者提供了用户故事范围的清晰度——以及不在范围内的内容。如果它不是验收标准的一部分，就不在范围内。\n\
  - 它指导实施合作伙伴的解决方案架构师和开发人员了解用户故事的预期结果。\n\n拥有您的 PO——以及可能更广泛的业务利益相关者群体——审查和详细化用户故事的价值丰富：\n\
  \n- **整合流程所有权：** 拥有负责业务流程的专职 PO 至关重要。这是一个先决条件，特别是如果您当前的业务流程存在差异，并且作为 Salesforce\
  \ 项目的一部分，您的未来流程需要在地理区域和业务线之间实现协调。\n- **通过“左移”降低成本：** 尽早确保业务一致性和清晰度将为您节省资金——相反，您在开发管道中越晚修复问题，成本就越高：\n\
  \  - 如果某项功能在 UAT 阶段后期被拒绝，或者更糟糕的是，在生产环境中未被终端用户采用，由于将功能推过管道所涉及的步骤和人员（规范、解决方案设计、测试和部署），纠正它将产生巨大的成本。\n\
  - **将变更管理嵌入开发流程：**\n  - 在流程共同创建研讨会以及验证验收标准时招募和参与变革推动者，是持续为变更管理奠定基础的绝佳策略\n  - 尽早且经常地纳入终端用户，可以减少在后期阶段（如\
  \ UAT 和培训）中的变更管理工作和压力\n  - 与前一点密切相关，验收标准在汇总后可以形成用户验收测试的基础\n\n### 提示\n\n在合适的工具中捕获用户故事。**Atlassian\
  \ JIRA** 和 **Microsoft Azure DevOps** 是 Salesforce 项目中最常用的工具。还存在更简单的替代方案，包括 **Trello**，尽管其功能和对企业\
  \ Salesforce 项目的适用性较少。\n\n对敏捷或混合敏捷方法论经验较少的组织通常难以从传统瀑布项目转变思维习惯。习惯于创建庞大的 **业务需求文档**\
  \ 与创建带验收标准的用户故事有根本不同。\n\n虽然大多数项目团队成员在经过一段时间和实践——以及实施合作伙伴的指导——后会掌握它，但投资培训课程或自主学习可以加速流程并提供更高质量的用户故事、更好的解决方案和采用率。\n\
  \n### 提示\n\n如需更多信息，您可以参考 Srini Munagavalasa 所著的 *Salesforce 业务分析师手册* (https://www.amazon.com/Salesforce-Business-Analyst-Handbook-techniques/dp/1801813426)。\n\
  \n在用户故事被审查和详细化后，让我们开始进行解决方案设计。\n\n## 为初始版本创建解决方案设计\n\n为业务流程创建的用户故事共同定义了 Salesforce\
  \ 项目的范围。尽管每个用户故事的解决方案共同构成了您的技术解决方案，但在开始开发之前，您仍会受益于在一定程度上 *考虑整体和端到端架构*。\n\n让我们开始查看作为项目一部分——以及项目之外——您应创建和维护的架构工件和组件！\n\
  \n## 了解 Salesforce 架构工件\n\n管理解决方案的文档是 Salesforce CoE 的关键职责。\n\n虽然文档组件的来源可能是您的实施合作伙伴，但确保解决方案文档可供使用、最新且对预期受众——业务和技术利益相关者——都易于理解，是\
  \ Salesforce CoE 的责任。\n\n让我们来看看 Salesforce 解决方案的关键工件：\n\n- **业务能力图**：您在 *第 2 章，定义您的\
  \ Salesforce 项目的性质* 中创建了此图，但情况可能自那时以来发生了变化，因此请继续更新您的业务能力图以反映 Salesforce 项目的范围。此图将向受众介绍解决方案的整体范围。\n\
  - **业务流程图**：您已在本章的 *共同创建您的未来业务流程* 部分中制作了这些图。\n- **角色和许可图**：显示哪些角色（人物角色）将使用或与您的 Salesforce\
  \ 解决方案交互。突出显示哪些角色是内部的，哪些是外部的，以及他们的用户将拥有的 Salesforce 用户许可。\n- **目标系统架构**：此图说明了 Salesforce\
  \ 内使用的 Salesforce 云和 AppExchange 应用，以及至关重要的是，Salesforce 如何连接到企业系统架构中的其他系统。解决方案范围内的每个接口都应标记，以及方向。\n\
  - **集成**：为了补充系统架构图，您应有一张表描述解决方案范围内的集成，包括以下内容：\n  - **方向**：每个接口的源系统和目标系统是什么，或者它是否是双向接口。\n\
  \  - **层**：集成是数据、流程还是虚拟集成。\n  - **时序**：集成是同步的（阻塞）还是异步的（非阻塞或排队）。\n  - **模式**：集成的模式。**远程过程调用即发即弃\
  \ (RPI-FF)**、**批数据同步 (BDS)** 和 **数据虚拟化 (DV)** 是 Salesforce 平台上的标准集成模式示例。\n  - **身份验证**：每个接口将如何获得访问目标系统的权限。\n\
  \  - **数据模型**：您需要批判性地创建和维护 Salesforce 解决方案的数据模型。数据模型是 Salesforce 解决方案中使用的对象和字段的图形表示。许多对象和字段随您的\
  \ Salesforce 许可 **开箱即用 (OOTB)** 提供，但您将使用自己的自定义字段扩展该数据模型，很可能还有一些自定义对象：\n    - **对象列表**：为了补充您的数据模型，维护一个详细说明每个对象用途的对象列表是良好的做法。对每个对象包括以下属性：对象名称、标准/自定义、对象将保存的实体、记录类型、记录所有者、组织范围默认（内部和外部）以及容量估算。\n\
  \    - **数据安全矩阵**：说明每个对象、配置文件和角色的权限（读取、创建、编辑和删除）。\n    - **数据字典**：创建和维护解决方案中使用的所有字段的字典是良好的做法。您的数据字典对集成架构师和开发人员以及业务用户都很有价值，后者在创建报表时会发现它很有用。\n\
  \n\n\n- **共享模型：** 您应描述将使用哪些机制为合适的用户授予对正确记录的正确访问权限。**角色层级**是共享模型不可或缺的一部分，并辅以大量共享数据的选项。\n\
  - **数据备份和归档：** 您现在就考虑并决定如何在需要恢复时备份 Salesforce 中的数据——以及计划使用何种工具来实现——未来会受益。确定按对象的数据归档策略和方法也应在此时完成，以防止意外超出存储限制。\n\
  - **环境和开发策略：** 环境概览图应描述在解决方案的开发和部署中将使用哪些 Salesforce 开发环境（沙盒），以及在环境之间迁移元数据和数据所使用的工具。\n\
  \n创建部分架构制品的输入是您共同创建未来流程的工作坊的输出，但确定架构的其他方面需要与技术和业务利益相关者混合进行的单独工作坊。这些方面包括系统架构、集成、共享模型、环境和开发策略。\n\
  \nTip!\n\n深入了解简要描述的技术架构制品，您应阅读由 Salesforce **认证技术架构师 (CTA)** Tameem Bahri 所著的 *成为\
  \ Salesforce 认证技术架构师* 书籍。\n\n如果贵公司已有绘图框架，请使用它。如果没有，您可以自行使用 Salesforce 的绘图框架 (https://architect.salesforce.com/diagrams#framework)\
  \ 或要求您的实施合作伙伴采用它。\n\nTip\n\nSalesforce 为许多 Salesforce 云数据模型和 **行业参考架构模板** 提供了模板，可免费在\
  \ **LucidChart** 或 MS PowerPoint 格式中使用，网址为 https://architect.salesforce.com/diagrams#design-patterns。\n\
  \n让我们继续讨论为您的 Salesforce 项目建立何种程度的 *初始* 架构是合理的。\n\n## 确定适当的预先架构级别\n\n如果您选择混合敏捷作为\
  \ Salesforce 项目的交付方法，您需要做出一个关键决策：\n\n> “我的项目在开始开发前应分配多少精力来架构我的 Salesforce 解决方案？”\n\
  \n您需要考虑 *两个层级* 的解决方案设计：我们在前几节中描述的整体技术架构，以及用户故事层级。您应期望您的实施合作伙伴在两个层级都提供解决方案设计。\n\n\
  让我们直接来看一下预先创建架构的一些好处：\n\n- 确保端到端架构具有凝聚力和全面性，并建立 *技术基础* 以确保您的 Salesforce 解决方案安全、高性能且可扩展\n\
  - 识别可以主动处理和缓解的技术问题和差距\n- 指导开发团队并提供 guard rails\n- 通过更高的 **冲刺效率** 提高 **开发速度**，因为团队成员无需在冲刺中花费时间创建解决方案设计\n\
  \n如果您在开始开发前不建立任何架构，您就不会获得这些好处——更关键的是，您不会知道差距和风险，因此在构建解决方案时可以预期会遇到许多障碍。\n\n您 Salesforce\
  \ 项目准备阶段的目标是建立利益相关者的一致性，并为开发团队创建足够多的 **架构跑道** 以便开始冲刺。\n\n## 重要说明\n\n您应期望您的实施合作伙伴就针对您特定项目预先确定何种程度的架构提出建议。您与实施合作伙伴的合同可能会描述项目应如何交付，因此请确保双方就应遵循的方法论及其含义达成一致。\n\
  \n让我们继续讨论下一个层级的解决方案设计。\n\n## 创建用户故事解决方案设计\n\n在您与实施合作伙伴合作编写用户故事并确保验收标准使其能够为其提出解决方案后，您的实施合作伙伴可以开始为用户故事提供解决方案设计。\n\
  \n正如我们在 *详细说明初始版本的范围* 部分提到的，您可以选择在前期将所有业务流程拆分为用户故事，或拥有一个持续为开发团队准备用户故事的设计流。\n\n最佳方法取决于多个因素，包括您\
  \ Salesforce 项目范围的广度——不同业务能力的数量、您组织对 Salesforce 的熟悉程度，以及因此其表述和详细说明用户故事并理解所提议的 Salesforce\
  \ 解决方案的能力。\n\n作为 *粗略* 的经验法则，如果在预开发阶段，您的解决方案最初估计需要不到 5 个冲刺（10 周）由一个小型开发团队构建，您可以考虑将所有业务流程拆分为用户故事，并在开始开发前提出解决方案并进行估算。如果您选择这样做，您仍应注意在开始构建解决方案时某些事情可能会发生变化——您的产品负责人可能会受到启发或收到最终用户的新的输入。\n\
  \n## 评估用户故事解决方案设计\n\n您的实施合作伙伴应为您的用户故事提出解决方案设计。\n\n本节将为您提供方法，以便在无需任何技术能力的情况下理解、反思和质疑所提议的解决方案设计。\n\
  \n对于任何用户故事——以及整体业务流程——在选择解决方案时应考虑以下因素：\n\n- 1. 该功能是否可通过您当前的许可证开箱即用（OOTB）获得？\n- 2.\
  \ 调查 **AppExchange** 上是否存在免费解决方案。\n- 3. 购买。这里您可能有两个选项：\n  - 1. 检查是否可通过 Salesforce\
  \ 附加产品获得解决方案：\n    > 这样，您将受益于进一步的增强，并能够随平台一起成长，而无需持续投资以确保一致性（和回归测试）\n  - 2. 调查可用的付费\
  \ AppExchange 产品。\n- 4. 构建自己的解决方案：\n  - 1. 首先，调查 **配置解决方案**（无代码）在多大程度上可以满足需求。Salesforce\
  \ 以其广泛的无代码能力为傲，您应预期绝大多数所提议的解决方案都是配置：\n    如果用户故事只能部分通过配置解决方案解决，请与产品负责人一起考虑是否可以调整用户故事及其验收标准以允许配置解决方案\n\
  \  - 2. 接下来，考虑 **自定义解决方案**（代码）：\n    虽然并非总是如此，但通常自定义解决方案需要更多精力、成本更高且需要更多维护。因此，您应仅将自定义解决方案作为最后的手段考虑。\n\
  \n评估解决方案设计的另一个关键方面是其所需的 **维护** 的总体水平。如果您选择详细说明所有用户故事并为其提出解决方案设计，您可以——*并且应该*——现在就评估所提议解决方案所需的维护。如果您计划持续完善开发的产品待办事项，所需维护的水平是一个因素，您可以通过为\
  \ Salesforce 项目建立正确的治理机制在一定程度上加以影响。我们将在 *第 7 章，构建和测试您的初始版本* 中更详细地介绍这一点。\n\nTip\n\
  \n请要求您的实施合作伙伴为每个用户故事的所提议解决方案指定所需的维护。汇总此信息并将其与您的初始假设和目标 Salesforce CoE 运营模式进行比较。\n\
  \n\n\n除此之外，你可以计算一个有形的指标来了解所提议的整体解决方案的定制程度。通过用户故事的数量汇总提出定制化解决方案（代码）的百分比——了解你的实施合作伙伴计划对\
  \ 5%、10% 或 20%+ 的用户故事使用程序化开发，在开发工作量和所需维护方面会产生巨大差异。随着解决方案设计过程的继续，跟踪这一指标。\n\n让我们看看我们案例公司\
  \ **Packt Manufacturing Equipment (PME)** 的 Salesforce 解决方案中拟议用户故事解决方案类型的划分：\n\n\
  | 解决方案类型 | 用户故事数量 | 占总用户故事的比例 |\n|---|---|---|\n| 配置 | 109 | 84% |\n| 数据 | 7 | 5%\
  \ |\n| 定制化 | 13 | 10% |\n| 合计 | 129 | 100% |\n\n表 6.1 – PME 拟议用户故事解决方案类型的划分\n\n\
  在 PME 的 Salesforce 项目准备阶段，PME 及其实施合作伙伴的项目成员已决定在启动开发阶段之前提前拆分所有用户故事。PME 的领导层希望确保明确的目标解决方案架构得以建立并得到评估。他们还认为——根据实施合作伙伴的反馈——项目范围可以在四个开发冲刺内交付。\n\
  \n项目团队一直在记录每个用户故事所提议的解决方案类型，并创建了表 6.1 中呈现的汇总。\n\n分析划分的原因，他们得出了以下见解：\n\n- **配置**：这包括利用开箱即用功能的解决方案，以及提议免费\
  \ AppExchange 解决方案的方案，以及使用声明式工具构建功能的解决方案，包括 **Salesforce Flows**。\n- **数据**：Salesforce\
  \ 平台功能的某些部分依赖于数据，而非 **元数据** 来创建解决方案。对于 PME 而言，这些包括 **Products**、**Price Books**\
  \ 和 **Price Book Entries**。\n- **定制化**：尽管 PME 有意对其集成需求（**Enhanced External Services**\
  \ 和 **Platform Events**）采用声明式解决方案，但仍需要一些定制化解决方案，包括 **email-to-case handler**（**Apex\
  \ class**）。\n\n如果你发现为你的 Salesforce 项目拟议的解决方案中很大一部分是程序化解决方案，你应该挑战你的实施合作伙伴和你的 Salesforce\
  \ PO：\n\n*定制化用户故事是否可以稍作修改以允许更多配置解决方案？*\n\n## 说明你的整合解决方案架构\n\n为了以项目利益相关者能够理解的抽象级别传达你的未来\
  \ Salesforce 解决方案，你应该为你的 Salesforce 项目创建 **目标解决方案架构图**（并维护）。该图有时被称为 **功能架构图**，但本质上是同一件事。虽然你的系统景观图看起来相似，但解决方案架构图增加了更多上下文，包括关键对象、以及\
  \ Salesforce 的关键功能和产品。\n\n让我们在下图中查看 PME 的目标解决方案架构：\n\n![](img/307881206539c45e128c538a4b6912f8_173_0.png)\n\
  \n图 6.1 – PME 的目标解决方案架构\n\nPME 目标解决方案侧重于 **Salesforce Sales Cloud、Service Cloud**\
  \ 和 **Marketing Cloud Account Engagement**（以前以 **Pardot** 营销）。该解决方案利用开箱即用功能，仅对有限的关键功能进行定制。该解决方案通过\
  \ **Web-to-Case** 与 PME 的网站集成，允许客户通过填写表单创建案例。除 Web-to-Case 外，PME 还将利用 Pardot 表单从其网站收集潜在客户。\n\
  \n尽管 PME 的实施合作伙伴提议使用新的现代中间件，例如 **Mulesoft**，但 PME 的领导层表示不会将其作为初始 Salesforce 实施的一部分。他们意识到这需要在某个时候完成，并决定将其列入路线图。\n\
  \n为了使用户管理高效，PME 将配置并集成 Salesforce **Identity Connect** 以集中配置和取消配置用户并管理其访问权限。\n\n\
  ## 总结\n\n在本章中，你取得了很大进展。你了解了 Salesforce 项目开发阶段的关键里程碑和活动。接下来，你学习了如何将业务流程分解为具有验收标准的用户故事。然后，你了解了对\
  \ Salesforce 项目至关重要的 Salesforce 架构制品。最后，你学习了如何评估和解释用户故事的拟议解决方案并说明你的目标解决方案架构。\n\n\
  现在你已经为 Salesforce 项目建立了基础架构跑道和解决方案设计，可以继续进行 Salesforce 实施的下一章，第 7 章，*Building and\
  \ Testing Your Initial Release*。\n\n## 构建和测试你的初始发布\n\n在本章中，我们将介绍如何构建和测试你的 Salesforce\
  \ 解决方案以进行初始发布。我们将介绍你的解决方案在底层包含的内容、可用的 Salesforce 开发模型和沙盒。然后我们将描述敏捷团队角色、敏捷仪式的重要性以及如何有效地管理你的开发流程。我们将介绍你可以并且应该考虑建立的治理机制，以指导你的\
  \ Salesforce 项目及其过程中可能发生的变更。我们将描述你在开发阶段应熟悉的各种测试类型。最后，我们将介绍创建数据迁移计划的步骤。\n\n你将了解 Salesforce\
  \ 开发生命周期以及如何组织由内部和外部成员组成的敏捷团队，如何促进敏捷仪式，以及如何管理 Salesforce 项目的交付。你还将学习如何区分 Salesforce\
  \ 解决方案的不同测试类型。然后，我们将讨论衡量进展的方法。最后，你将学习如何为数据迁移规划执行尽职调查。\n\n我们将跟随 **Packt Manufacturing\
  \ Equipment (PME)** 的 Salesforce CoE，它监督并与公司的实施合作伙伴协作。\n\n在本章中，我们将介绍以下主要主题：\n\n\
  - 了解团队成员的角色和职责\n- 规划你的构建阶段\n- 设置你的开发模型和环境\n- 建立你的开发流程\n- 在开发阶段管理你的 Salesforce 项目\n\
  \n## 准备你的数据迁移计划\n\n开始吧！\n\n## 了解团队成员的角色和职责\n\n团队中的人将决定你的 Salesforce 项目成败。确保你投入资源使角色和职责明确，流程得到优化以尽可能有效地交付价值，并且你拥有学习和成长的心态以持续改进你的设置。\n\
  \n在上一章中，业务分析师和架构师与你的业务和技术利益相关者互动，将 Salesforce 项目的整体范围分解为用户故事并创建解决方案设计制品。\n\n在本章中，我们将介绍一种混合敏捷交付方法，并且由于我们处于开发阶段，我们将更深入地探讨其敏捷方面。\n\
  \n你将开始配置和开发你的 Salesforce 解决方案。根据你选择的交付方法，一些项目成员可能尚未入职——但他们即将入职。\n\n让我们先来看看常见的 Salesforce\
  \ 项目和敏捷团队成员角色及其主要职责：\n\n- **产品负责人 (PO)：**\n  - 拥有并管理其敏捷团队的待办事项列表，并在冲刺计划前对待办事项列表进行优先级排序。PO\
  \ 还负责\n\n从业务角度的利益相关者管理和发布管理。\n\n- 负责回答功能顾问和开发人员的提问，以对用户故事提供澄清和进一步细节。\n- 负责根据验收标准验证已开发的用户故事。\n\
  - 负责在产品演示中（与业务分析师一起）汇总利益相关者的反馈，创建用户故事，并将决策传达回利益相关者。\n\n## 提示\n如果您计划以冲刺方式进行开发——这是本章的底层假设——请确保您分配一名\
  \ *胜任且有权力的产品负责人* 在整个项目期间持续在敏捷开发团队中工作。您的产品负责人对于积压工作细化和验证开发团队开发的用户故事至关重要。\n\n## The\
  \ scrum master:\n- 促进敏捷仪式并指导团队成员理解其角色和职责、流程、敏捷仪式和价值观。\n- 移除障碍和阻碍，或在团队内部无法解决时升级问题。\n\
  - 应努力保护开发团队免受会议和行政工作的干扰，以便他们专注于构建解决方案。\n- 这通常是由您的实施合作伙伴履行的角色。许多实施合作伙伴都有其遵循的开发方法——因此，让他们配备\
  \ Scrum Master 角色是有意义的。如果您与实施合作伙伴的合同中包含任何固定价格和按时交付的方面，则该角色必须为外部角色以确保问责。\n\n### The\
  \ development team:\n这由执行重要低层解决方案设计、开发、测试和用户故事部署的人员组成。开发团队的每个成员可以根据其技能组合以及您的 Salesforce\
  \ 项目的性质和范围承担一个或多个职责。以下是在您的 Salesforce 项目开发团队中会找到的一些常见角色和职责：\n\n### The functional\
  \ consultant:\n- 负责在 Salesforce 平台上开发声明式解决方案（点按式）。\n- 可能精通一个或多个 Salesforce 产品或 CRM\
  \ 的子领域。没有功能顾问精通所有云，因此请确保您的团队拥有与您的 Salesforce 项目范围相匹配的相关知识和经验。\n- 这通常是由您的实施合作伙伴履行的角色，但如果您拥有具备\
  \ Salesforce 声明式开发技能的内部资源，您可以选择将他们纳入敏捷团队。再次注意您与实施合作伙伴合同中的规定。\n\n### The developer:\n\
  - 负责在 Salesforce 平台上开发程序化（代码）解决方案。\n- 可能精通一个或多个 Salesforce 产品和/或编程语言。开发人员精通所有产品和技术的情况并不常见。例如，作为\
  \ Marketing Cloud 开发人员，编码 AMPscript 与在核心平台上编码 Apex 并构建 **Lightning web components**（LWC）大不相同。请确保您的开发人员拥有与您的\
  \ Salesforce 项目范围相匹配的相关知识和经验。\n- 这通常是由您的实施合作伙伴履行的角色，但如果您拥有具备合适开发技能的内部资源，您可以选择将他们纳入敏捷团队，同时注意您与实施合作伙伴的合同。\n\
  \nIn a *Scrum* 模式下，产品负责人、Scrum Master 和开发团队 *共同负责* 确保架构健全且解决方案质量高、无缺陷，并负责发布、监控以及支持变更和采用。\n\
  \n然而，对于企业项目——包括 Salesforce 项目——在您的 Salesforce 项目的开发和推广阶段，将以下专业角色作为项目的一部分至关重要：\n\n\
  ### The Salesforce architect:\n- 在混合敏捷交付方法中，您会分配时间和精力来创建一定程度的前期解决方案架构。常见的情况是，情况和需求发生变化或假设被证明不正确。在任何这些情况下，让一个或多个架构师（解决方案架构师和/或技术架构师）提供支持，帮助开发团队提出替代或新的解决方案\
  \ *确保速度和与目标架构的一致性*。\n- 根据您的 Salesforce 项目（或项目组合）的规模，架构师可能部分或完全分配到您的项目，但通常不需要完全分配到单个敏捷团队。\n\
  \n### The business analyst (BA):\n- 在开发阶段，业务分析师与您的产品负责人合作完善用户故事并使它们 **准备好进行开发**。就绪的定义通常包括用户故事角色、需求、目的、额外背景和支持文档，以及至关重要的验收标准。根据您前期架构的程度和用户故事解决方案设计的水平，您的流程可能涉及业务分析师将用户故事分配给解决方案或技术架构师，在用户故事满足就绪定义之前提供解决方案设计。\n\
  - BA 的角色有时由开发团队中的功能顾问承担，因为他们——典型地——更“以业务为导向”，因此更适合与产品负责人和其他业务利益相关者互动，以支持他们创建用户故事。\n\
  \n## 重要说明\n许多功能顾问也可以担任出色的业务分析师。但并非总是如此。与您的实施合作伙伴合作，确保您的敏捷团队拥有扎实的业务分析技能，因为业务分析师在您的\
  \ Salesforce 项目的成功中发挥着关键作用。\n\n## The quality assurance (QA) specialist (tester):\n\
  - 质量保证专家负责 *根据验收标准测试用户故事*。他们通过根据用户故事的验收标准编写正向和负向测试用例并执行测试用例来评估其是否通过或失败来实现这一点。\n\
  - 质量保证专家（或大型项目中的测试经理）将设计您 Salesforce 项目的整体测试策略和测试制度。\n- 经验丰富的质量保证专家也是 *试图破坏解决方案*\
  \ 和流程的专家，这正是您希望他们在开发阶段所做的。您希望在开发阶段尽早了解风险并识别 **缺陷**（错误），以便现在修复，而不是在 **用户验收测试（UAT）**\
  \ 中，或更糟的是在生产环境中，从而影响生产力、危及采用，最终影响您在 Salesforce 上的投资价值。\n\n### The change manager:\n\
  - 变更经理将与您的敏捷团队、架构师、业务利益相关者和项目发起人合作，共同创建 *特定上下文的变更管理策略和计划*。我们将在 *第 10 章、沟通、培训和支持以推动采用*\
  \ 中介绍变更管理规划的具体内容。\n\n### The project manager (PM):\n- 项目经理负责您 Salesforce 项目的整体交付。这包括确保项目中及时提供充足的资源、管理问题、减轻风险、报告项目进展以及管理您的\
  \ Salesforce 项目的预算。\n- 当您与实施合作伙伴合作时，拥有内部客户方项目经理与实施合作伙伴的项目经理合作是有益的。\n- 根据您 Salesforce\
  \ 项目的规模和敏捷团队数量：\n  - Scrum Master 和项目经理角色可能由实施合作伙伴的一名人员担任。\n  - 实施合作伙伴的 **客户经理**\
  \ 可能成为项目组织的一部分以与您的\n\n内部项目领导和赞助商需规划超出当前实施项目的范围，担任风险和问题的升级联系点，并负责管理商业关系和合同。\n\n接下来，让我们讨论如何规划开发。\n\
  \n## 规划你的构建阶段\n\n在纯敏捷交付方法论中，团队会持续规划工作——要么在冲刺计划（Scrum）中进行，要么在新的用户故事满足 **就绪定义** 且有能力承接时直接开始新工作（Kanban）。\n\
  \n然而，由于你选择了某种混合敏捷交付方法论，你可能希望对构建阶段的预计持续时间有一个大致了解——既用于预算，也用于推广计划。\n\n在本节中，我们将讨论各种\
  \ **估算开发工作量** 方法的优缺点，以及如何规划开发。\n\n让我们来看两种估算工作量的方法：\n\n- **以时间格式估算开发工作量：**\n  - 在上一章中，你将整体范围分解为用户故事并为每个故事提供了解决方案。如果没有，请回头审阅此流程。\n\
  \  - 要知道总的预计开发工时，你需要让每个用户故事都按 *开发类型*（配置、数据和定制）进行估算（时间：小时）。本质上，为了使估算具有一定准确性从而可用于规划，每个用户故事在估算前都需要完成解决方案设计。\n\
  \  - 一旦所有故事都估算完毕，你按史诗汇总估算，然后再按主题/领域汇总所有史诗以得知总数。\n  - 需要注意的是，在此阶段，估算仅仅是估算。只有在故事或冲刺完成时，你才会知道实际花费了多长时间。\n\
  \n### 重要提示\n\n在开发阶段汇总估算工作量——从而估算成本时，有时超过了 Salesforce 项目的原始预算。这通常并非因为实施合作伙伴试图压榨你。通常是因为顾问提出问题并挖掘出在范围详细化之前你尚未意识到的需求、规则、例外情况、边界情况和使能条件。\n\
  \n### 故事点：\n\n- 故事点与以时间格式估算截然不同。用户故事的故事点 *描述了敏捷团队为细化、设计、开发、测试、部署和发布该用户故事所期望的总工作量、复杂性、风险和不确定性的混合*。正如你所见，故事点概念远远超出了以用户故事开发时间为重点的工时估算模型。\n\
  - 故事点的一个关键方面是它们 *相对于敏捷团队共同工作的历史*。这也意味着在前期为所有用户故事分配故事点并不是有意义的练习。\n- 故事点通常在冲刺计划中分配给用户故事。我们将在\
  \ *从敏捷仪式中最大化价值* 部分稍后回到这一点。\n- 使用故事点适用于前期较少投入进行用户故事级解决方案设计的项目。\n\n在估算完你的开发工作量后，让我们继续创建你的开发计划。\n\
  \n## 起草你的临时开发计划\n\n假设你有项目的预算和截止日期，你需要一个开发计划来了解如何遵守它们。\n\n一旦你对每个用户故事进行了估算，从而对每个史诗进行了估算，你需要考虑可用的开发能力。这是指你的功能顾问和开发人员可用于开发任务的时间。你需要关注按开发类型划分的开发估算。接下来，你需要考虑敏捷仪式和可能的待办事项列表细化的时间——尽管这些会议很重要——但时间不可用于开发。两者之间的差异称为冲刺效率，通常在\
  \ 50% 到 70% 之间，具体取决于你选择的交付方法论，以及前期用户故事定义、详细化和提供解决方案的程度。\n\n### 提示\n\n作为一般经验法则，你不应填满超过\
  \ ~85% 的敏捷开发团队的净开发冲刺能力（在应用冲刺效率后）。原因是在冲刺过程中——当你看到解决方案成形时——你会被启发去做更多事情，或修改在研讨会上看起来合理但最终对用户并不理想的流程。\n\
  \n如果项目中可用的开发能力（资源）与总估算工作量或时间表不匹配，你有三个选择：\n\n- *优先考虑* Salesforce 解决方案初始版本范围内的用户故事。\n\
  - 与实施合作伙伴合作 *寻找替代方案*——为某些用户故事提供更手动的解决方案选项。\n- *增加预算*，通过分配额外的开发资源来按初始时间表交付项目。增加开发资源仍能带来额外能力的上限取决于项目的性质、范围（领域数量）以及开发设置的复杂程度。我们将在下一节介绍开发模型和流程。或者，你也可以考虑延长构建阶段以交付范围。\n\
  \n在确定了范围和可用的开发能力后，你就可以通过考虑依赖关系，按冲刺分配史诗来创建你的临时开发计划。\n\n让我们来看一个示例公司 PME 的案例：\n\n![](img/307881206539c45e128c538a4b6912f8_185_0.png)\n\
  \n图 7.1 – PME 的临时开发计划\n\n*PME 的开发计划在功能史诗和技术使能之间存在依赖关系。除了功能范围外，在实际开发开始之前，还需要建立开始开发的技术基础。这包括为开发管道设置技术工具、创建开发环境（沙盒），以及为开发团队和产品负责人创建用户和测试用户。*\n\
  \n在创建完开发计划后，让我们设置你的开发生命周期和部署流程。\n\n## 设置你的开发模型和环境\n\n**开发模型**和环境是你的**部署模型**的一部分。部署意味着将解决方案的技术组件从一个环境移动到另一个环境，最终移动到生产环境。你使用不同的环境——**沙盒**——在开发生命周期中执行不同类型的测试。其目的是确保解决方案在到达生产环境时端到端按预期工作。\n\
  \n让我们开始深入了解 Salesforce 的内部结构。\n\n## 了解你的 Salesforce 解决方案的组件\n\nSalesforce 提供的产品，如\
  \ Sales Cloud 和 Service Cloud，是基于云的 **软件即服务（SaaS）** 产品。这意味着你的 Salesforce 组织——取决于你购买的许可证——附带标准对象和标准字段\
  \ **开箱即用（OOTB）**。\n\nSalesforce 也是一个 **平台即服务（PaaS）**，这意味着你可以在 Salesforce 内扩展、增强、配置和定制\
  \ OOTB 组件以适应你的业务需求和流程。这包括创建自定义对象和字段及自动化，配置和定制 **用户界面（UI）**。你也可以使用 Salesforce 平台构建自定义应用和集成。能够快速配置和定制\
  \ Salesforce 以适应你的业务需求的配置和定制能力，是 Salesforce 成为强大平台的原因之一。\n\n为了更好地理解解决方案的配置和定制，我们需要了解核心\
  \ Salesforce 平台的底层架构，该架构基于 **模型-视图-控制器（MVC）** 架构。\n\n让我们通过一些示例更深入地了解 MVC 的构成：\n\n\
  |  | 模型（数据结构） | 视图（UI） | 控制器（逻辑） |\n|---|---|---|---|\n| 开箱即用组件 | 标准对象、标准字段和标准选择列表值\
  \ | 标准应用、默认页面布局和 Lightning 记录页面 | 标准重复/匹配规则和线索转换 |\n| 配置组件（无代码） | 自定义对象和自定义字段（包括关系字段）、自定义元数据类型和自定义设置\
  \ | 自定义应用、页面布局、Lightning 记录页面和屏幕流 | 业务逻辑：流程、流程构建器（正在淘汰）和工作流规则（正在淘汰） 集成：连接器、带外发消息的流程和增强型外部服务\
  \ |\n| 自定义组件（低代码/专业代码） |  | LWC、Visualforce（VF）页面、Aura 组件、Canvas 应用和 iFrame | 业务逻辑：Apex\
  \ 触发器、Apex 类和 Salesforce 函数 集成：平台事件， |\n\n\n\n\n\n|  |  |  |  |\n|---|---|---|---|\n\
  |  |  |  | 增强的外部服务、Web 服务、OData 和标准 API |\n| AppExchange 组件 | 可由配置和定制 MVC 组件的组合构成\
  \ |  |  |\n\n表 7.1 – Salesforce 解决方案的 MVC 组件\n\n在了解了构成 Salesforce 解决方案的技术组件后，让我们看看为您开发和部署解决方案有哪些选项。\n\
  \n## 介绍 Salesforce 中的开发模型\n\n开发模型是将解决方案通过环境迁移的方法，您可以使用不同的模型，每个模型都有其自身的考虑因素。\n\n\
  下表比较了可用的 Salesforce 开发模型：\n\n| 开发模型 | 真实来源 | 发布制品和部署方法 | 复杂性、灵活性和可扩展性水平 |\n|---|---|---|---|\n\
  | 手动部署 | Salesforce 生产组织 | 手动重新创建配置 | 极低 |\n| 变更集开发模型 | Salesforce 生产组织 | 使用变更集部署的元数据\
  \ | 低 |\n| 组织开发模型 | Salesforce 生产组织或源代码控制仓库（如果使用） | 使用 Salesforce CLI 或其他 DevOps\
  \ 工具（见下一个提示框）部署元数据的 .zip 文件 | 中等 |\n| 模块化基于包的开发模型 | 源代码控制仓库 | 包含一组逻辑组件以支持用户组功能的未锁定包，通过安装未锁定包的最新版本进行部署\
  \ | 高 |\n\n表 7.2 – Salesforce 开发模型比较\n\n您应已与实施合作伙伴共同做出关于 Salesforce 项目使用哪种开发模型的审慎决定。\n\
  \n## 提示\n\n若干 **商用现成 (COTS)** DevOps 或 CI/CD 工具可用于完成大部分繁重工作并提供有关最常见部署错误的有用见解。一些最受欢迎的产品包括\
  \ *Gearset*、*Copado*、*Salto* 和 *AutoRABIT*。请自行研究并评估在项目生命周期的这个阶段 DevOps 工具是否对您的 Salesforce\
  \ 项目有益。\n\n关于开发模型和 DevOps 工具的决策需要考虑谁将在解决方案的初始发布 *之后* 管理您的 Salesforce 组织和持续改进。如果您计划自行管理\
  \ Salesforce 组织，所选的开发模型应与可用资源的胜任能力——或计划的培训和赋能——保持一致。\n\n让我们看看在 Salesforce 中进行开发和测试时应考虑的环境。\n\
  \n## 了解 Salesforce 沙盒\n\n创建 Salesforce 沙盒时，您是在创建 Salesforce 生产环境的副本。您也可以克隆沙盒并以这种方式创建新的沙盒。\n\
  \n如果您的 Salesforce 程序/项目遵循基于组织的开发模型或基于包的开发模型，您应使用版本控制仓库作为真实来源，从中将元数据迁移到新的沙盒。\n\n\
  您需要使用沙盒将开发和测试环境彼此分离并与生产环境分离。您绝不应在生产环境中开发，因为损坏的功能的影响可能会影响业务运营、损坏您的数据并危及安全合规性。\n\n\
  您需要为开发和不同类型的测试提供单独的环境——确定使用哪些沙盒被称为您的 **环境策略**。\n\n让我们看看我们的示例公司 PME 的沙盒设置和部署流程，该公司有多个开发流，多个团队在\
  \ Salesforce 解决方案上工作：\n\n![](img/307881206539c45e128c538a4b6912f8_190_0.png)\n\n\
  图 7.2 – PME 的沙盒设置\n\n让我们在下表中查看可用 Salesforce 沙盒类型之间的主要差异：\n\n| 沙盒 | 完整沙盒 | 部分复制沙盒\
  \ | 开发者专业版沙盒 | 开发者沙盒 |\n|---|---|---|---|---|\n| 适用用途 | 系统集成测试 (SIT)、UAT、批量数据、性能或负载测试、预发布和培训\
  \ | QA、SIT、UAT 和培训 | 开发和 QA | 开发和 QA |\n| 刷新时包含 | 元数据和所有数据 | 元数据和示例数据 | 元数据 | 元数据\
  \ |\n| 可用存储 | 与生产环境相同 | 数据：5 GB<br>文件：与生产环境相同 | 数据：1 GB<br>文件：1 GB | 数据：200 MB<br>文件：200\
  \ MB |\n| 沙盒模板 | 可用 | 必需 | 不可用 | 不可用 |\n| 刷新间隔 | 29 天 | 5 天 | 1 天 | 1 天 |\n| 按 Salesforce\
  \ 净支出百分比计算的成本 – 每增加一个沙盒 | 30% | 20% | 5% | 不适用 |\n\n## 表 7.3 – Salesforce 沙盒类型概览\n\
  \n您可用的不同沙盒类型数量取决于 Salesforce 组织的版本。您可以购买额外的沙盒。\n请参阅 *按类型划分的沙盒许可和存储限制* **Salesforce\
  \ 帮助** 文章，网址为 https://help.salesforce.com/s/articleView?id=sf.data_sandbox_environments.htm&type=5。\n\
  \n如果您使用基于组织的开发模型或基于包的开发模型进行开发，您可以选择使用 **scratch orgs**。它们是基于配置文件创建的短暂（1-30 天）开发环境。与使用传统的\
  \ Salesforce 沙盒相比，使用 scratch orgs 需要更高级的技能。\n\n## 提示\n\n您可以通过访问 Trail 混合 *架构师之旅：开发生命周期和部署*\
  \ 页面了解更多关于 Salesforce 开发模型和环境的信息，网址为 https://trailhead.salesforce.com/users/strailhead/trailmixes/architect-dev-lifecycle-and-deployment。\n\
  \n您可以在 *Salesforce DX 开发者指南* 文档中了解更多关于 scratch orgs 的信息，网址为 https://developer.salesforce.com/docs/atlas.en-us.sfdx_dev.meta/sfdx_dev/sfdx_dev_develop.htm。\n\
  \n在确定开发模型并设置沙盒后，让我们转向您的开发流程。\n\n## 建立您的开发流程\n\n开发流程的关键组件之一是 **sprint**。sprint 是\
  \ **Scrum** 中使用的术语，用来描述预定义的时间段，目标是在此期间开发可工作的软件。我们已经提到，sprint 的持续时间并非一成不变——可以决定其持续\
  \ 1-4 周。让我们看看在确定 sprint 持续时间时应考虑什么：\n\n- 在 sprint 期间用户故事是否需要细化？\n  - *如果需要*，这将占用开发时间。采用较短（1-2\
  \ 周）的 sprint 持续时间将使预期 sprint 效率超出合理范围，因为细化和敏捷仪式带来的开销大于可用于开发的时间。如果您需要持续的待办事项列表细化会议，请增加\
  \ sprint 持续时间。\n  - *如果不需要*，也就是说您已提前细化并提供用户故事的解决方案，那么您可以选择较短的 sprint 持续时间，不过在构建初始版本时不建议采用\
  \ 1 周的 sprint 持续时间。\n\n## 重要说明\n\n人们普遍误以为敏捷比瀑布需要更少的纪律。恰恰相反：运行纯敏捷设置需要巨大的纪律、明确定义的流程以及共同认可的就绪和完成定义。在瀑布模型中——在项目的任何一个阶段——只有一个总体任务，例如设计解决方案。在纯敏捷中，您的团队需要经历整个开发生命周期（或大部分）从用户故事创建、设计、构建、部署、测试到验证。由于许多步骤由不同的团队成员执行，需要高度的纪律来确保顺畅的交接和清晰的流程。运行纯敏捷设置的好处也与团队的综合经验、敏捷成熟度和纪律直接相关。\n\
  \n让我们更详细地深入开发流程。\n\n\n\n\n## 从敏捷仪式中最大化价值\n\n为了充分利用你的敏捷仪式，你首先需要对它们的性质、目的和价值有扎实的理解。\n\
  \n让我们来看看敏捷仪式：\n\n- **冲刺计划：** 冲刺计划的目标是拥有一个 *已承诺的冲刺待办事项* 的用户故事以及一个表述清晰的冲刺目标。\n- 在冲刺计划之前，产品负责人应对待办事项清单进行排序——这有时会与业务分析师一起在\
  \ **待办事项细化会议** 中完成。\n- 冲刺计划的典型议程如下：\n  - 审查冲刺的团队产能：\n    - 如果你使用时间格式估算用户故事，请考虑开发团队的可用资源并考虑冲刺效率。\n\
  \    - 如果你使用故事点，也要考虑可用资源，并根据之前的冲刺速度调整冲刺的目标故事点。对于第一次冲刺，这很棘手，因为没有历史记录：在[content]\n\
  ## 从敏捷仪式中最大化价值\n\n为了充分利用你的敏捷仪式，你首先需要对它们的性质、目的和价值有扎实的理解。\n\n让我们来看看敏捷仪式：\n\n- **冲刺计划：**\
  \ 冲刺计划的目标是拥有一个 *已承诺的冲刺待办事项* 的用户故事以及一个表述清晰的冲刺目标。\n- 在冲刺计划之前，产品负责人应对待办事项清单进行排序——这有时会与业务分析师一起在\
  \ **待办事项细化会议** 中完成。\n- 冲刺计划的典型议程如下：\n  - 审查冲刺的团队产能：\n    - 如果你使用时间格式估算用户故事，请考虑开发团队的可用资源并考虑冲刺效率。\n\
  \    - 如果你使用故事点，也要考虑可用资源，并根据之前的冲刺速度调整冲刺的目标故事点。对于第一次冲刺，这很棘手，因为没有历史记录：在处理用户故事时请依赖开发团队的评估。\n\
  \  - 接下来，产品负责人一次呈现一个用户故事，开发团队提出澄清问题。\n\n### 提示\n\n你可能需要也可能不需要用户故事满足你的就绪定义才能使其有资格参与冲刺计划——并且能够被拉入冲刺。如果允许这样做，请确保产品负责人、业务分析师和架构师在冲刺开始时分配时间来使它们为开发做好准备。\n\
  \n- 开发团队将用户故事拉入冲刺待办事项清单，直到开发团队的产能满足为止。\n- 如果你使用时间格式估算用户故事，当拉入冲刺的用户故事的累计总和达到团队在冲刺中的产能时，产能即满足。\n\
  - 如果你使用故事点方法，团队成员使用 **故事点扑克** 为用户故事提供估算，其中使用斐波那契数列中的数字。如果估算接近，团队可以轻松就故事的故事点达成一致并继续下一个用户故事。如果估算差异很大，估算高和低的团队成员会说明其估算的理由。这是一个很好的方式来确保团队成员对用户故事有共同的理解，并可能发现对所有成员来说并不明显复杂性。团队就故事的故事点达成一致并继续。\n\
  \n### 提示\n\n对于虚拟故事点扑克，https://www.scrumpoker-online.org 是一个很棒的在线工具。\n\n- 当团队的故事点产能满足时，被拉入冲刺的故事即被承诺。\n\
  - **每日站会**：这是一个简短（~15分钟）的会议，通常每天早上举行，每个敏捷团队成员回答三个简单问题：我昨天做了什么来推进冲刺目标，我今天计划做什么来推进冲刺目标，以及什么阻碍在阻止我？\n\
  - 每日站会 *不是项目状态会议*，也不是解决阻塞问题的会议。已识别的行动应在站会后离线执行。\n- **冲刺回顾（演示）**：冲刺回顾是你的敏捷团队向更广泛的利益相关者展示本冲刺完成工作的会议。冲刺回顾有两个主要目的：\n\
  \  - 向选定的终端用户（变革推动者）展示你的解决方案，从而在开发阶段嵌入变革管理。\n  - 获取对解决方案的反馈，可以评估并可能纳入后续冲刺。这为冲刺回顾的参与者创造了归属感——为他们在推出时充当你解决方案的大使奠定了坚实的基础。\n\
  \n### 提示\n\n理想情况下，敏捷团队的产品负责人主导冲刺回顾，演示开发的内容，并对参与者的反馈作出回应。这将确保解决方案所有权清晰，并使其逐渐为你的产品负责人和你的公司所内化。\n\
  \n虽然整合参与者反馈可能是你的实施合作伙伴的责任，但你的产品负责人最终负责确定每个反馈项的优先级并将决策传达回利益相关者。\n\n- **冲刺回顾**：在本次会议中，敏捷团队成员、产品负责人、Scrum\
  \ Master 和开发团队评估过去的冲刺进行得如何，以及他们可以在持续改进的精神下做出哪些改进来优化开发流程。\n- 它由 Scrum Master 促进，Scrum\
  \ Master 还负责确保在冲刺回顾中商定的行动得到执行。\n\n让我们看看冲刺之前和期间用户故事的流程。\n\n## 管理你的看板\n\n你敏捷团队如何管理用户故事的流程对冲刺速度有很大影响。你的敏捷团队成员应了解你的开发流程，以及至关重要的交接方式。\n\
  \n让我们看看看板可以如何设置（你 Salesforce 项目的具体配置将根据你选择的交付方法而有所不同）：\n\n![](img/307881206539c45e128c538a4b6912f8_197_0.png)\n\
  \n图 7.3 – 看板列示例\n\n一个新用户故事将从产品待办事项清单列开始。你的产品负责人将与业务分析师一起处理用户故事，使其达到就绪定义。这再次取决于你选择的交付方法，但应满足以下标准：\n\
  \n- 用户故事包含角色、需求和目的且完整。\n- 提供了额外的上下文和支持文档。\n- 已定义验收标准。\n- 在某些开发流程中，用户故事还必须提供解决方案设计并由设计负责人批准。我们将在\
  \ *开发阶段管理你的 Salesforce 项目* 部分更详细地介绍这一点。\n\n当用户故事满足你的就绪定义时，你的产品负责人将其移至 **就绪** 列。故事已准备好进行冲刺计划。\n\
  \n用户故事在冲刺计划期间被拉入 **冲刺待办事项清单** 列。随着冲刺开始，开发团队会挑选顶部的用户故事并将其移至 **开发** 列。每个开发团队 *成员*\
  \ 在同一时间只能有一个用户故事在开发中。\n\n### 提示\n\n虽然实际的 Salesforce 配置和开发不在本书范围内，但还有几本很棒的书籍涵盖了这些主题，包括\
  \ Enrico Murro 的 *使用 Salesforce 进行低代码应用开发*（https://www.amazon.co.uk/Hands-Low-Code-Application-Development-Salesforce/dp/1800209770）。\n\
  \n如果开发团队成员被阻止完成用户故事的开发，他们应将其移至 **阻塞** 列并通过在用户故事上写评论通知 Scrum Master。Scrum Master\
  \ 将优先解决阻塞问题。\n\n### 提示\n\n为了最大限度地降低用户故事变得陈旧或过时的风险，并减少因依赖关系而导致的等待时间，你应力求让用户故事在开发中（在看板列的冲刺待办事项清单右侧）的停留时间尽可能短。确保这一点的方法是让所有敏捷团队成员从看板\
  \ *右侧* 开始处理分配给他们的用户故事。例如，你的产品负责人应 *优先* 验证用户故事并将其移至 **已完成** 列 *之前* 再专注于使用户故事为开发做好准备。同样，开发人员应\
  \ *优先* 处理质量保证专家发现的缺陷 *之前* 再开始新用户故事的开发。\n\n当用户故事开发完成并部署到 QA 沙盒时，开发团队成员将用户故事移至 **测试**\
  \ 列并在用户故事上写下评论，让质量保证专家知道它\n\n准备好进行测试，并附带任何具体说明。在某些情况下，用户故事的开发人员需要提供测试脚本。\n\n测试通过后，QA\
  \ 专家会将用户 story 移至 **Validating** 列，供产品负责人（PO）根据验收标准验证用户故事。如果用户故事未通过测试，QA 专家将创建缺陷问题描述失败原因，然后将用户故事移回\
  \ Development 并重新分配给开发人员以修复问题。\n\n当用户故事由 PO 验证后，PO 将把用户故事移至 Done。\n\n## 重要说明\n\n\
  本章描述了在构建 Salesforce 解决方案初始版本时的用户故事流程——您尚未将其部署并发布到生产环境供用户使用。我们将在 *第 9 章*、*部署您的发布并将数据迁移到生产环境*\
  \ 中介绍该流程。\n\n初始版本在生产环境上线后，您将进入持续改进阶段，持续开发和部署用户故事。在这种设置下，您完成的定义将包括比本章所述更多的步骤。我们将在\
  \ *第 12 章*、*发展您的 Salesforce 组织和 DevOps 能力* 中更详细地讨论这一点。\n\n接下来，让我们看看如何在开发阶段管理您的 Salesforce\
  \ 项目。\n\n## 在开发阶段管理您的 Salesforce 项目\n\n在 Salesforce 项目的开发阶段有很多事情在发生，全面理解并获得概览可能会让人不堪重负。您在构建和测试初始版本中的责任很简单：\n\
  \n创建环境、结构和流程，以最大化开发团队的高质量价值产出。\n\n在高层次上，您希望确保您的敏捷开发团队是：\n\n- **建设正确的事情**：这意味着确保您的\
  \ Salesforce 解决方案将：\n  - 得到终端用户的认可并被使用\n  - 满足您在商业案例中设定的目标和财务指标\n- **高效**：这涉及确保您的敏捷开发团队以尽可能高效的方式构建解决方案：\n\
  \  - **价值**：产出 x 质量\n  - **成本效益高**\n\n在以下章节中，我们将分解这在实践中意味着什么。\n\n## Salesforce 项目治理\n\
  \n实际上，您需要在 Salesforce 项目中管理的两个关键治理方面是：\n\n- Salesforce 项目 *交付治理*\n- Salesforce *平台治理*\n\
  \n为了按照这些方面交付您的 Salesforce 项目，您应考虑建立以下治理机制：\n\n- **设计授权 (DA)**：在此论坛中，来自开发团队成员或架构师的拟议解决方案设计会持续审查，以确保引入到您的\
  \ Salesforce 组织中的解决方案与目标解决方案架构一致，遵守您定义的开发标准，并遵循声明式和编程式开发与架构的通用最佳实践。\n- DA 的参与者：\n\
  \  - DA 有许多配置，但需要注意的关键是它不仅仅是一次技术会议。您的 PO(s) 参与介绍用户故事（或新史诗）的背景至关重要。\n  - 技术架构师和解决方案架构师应参与审查拟议的解决方案设计，并向开发团队提供反馈和改进设计的建议。\n\
  - DA 的重点：\n  - DA 应从基于风险的角度关注拟议的解决方案，其中包括以下解决方案组件：\n  - 代码\n  - 数据模型变更\n  - 安全和数据共享\n\
  \  - 复杂自动化\n  - 集成\n\nDA 应注意汇总拟议解决方案的定制程度。\n\n- **变更控制委员会：** 随着您在开发阶段进行冲刺，您将更熟悉您的\
  \ Salesforce 解决方案。您的 PO 很可能会受到启发，并希望在原计划范围之外添加额外功能。为了管理这一流程（在固定价格/固定范围项目中很常见），您可以建立变更控制委员会来处理和管理开发阶段的变更请求。\n\
  - 应设定变更控制委员会应参与的变更级别的阈值：\n  - **小变更：** 授权您的敏捷团队管理这些\n  - **中等变更：** 可能根据其对项目时间线和风险的影响将这些提交给变更控制委员会\n\
  \  - **大变更：** 这些本质上会影响项目时间线，必须提交给变更控制委员会\n- 建议参与者：PO、项目发起人、PM 和 Salesforce 架构师\n\
  - **指导委员会：** 这是项目的最高升级点。指导委员会对项目负责，并通过为 PM 和架构师提供指导和支持来执行此职责。它定期（每两周或每月）召开会议执行以下工作：\n\
  \  - 跟踪开发进度和状态与计划的对比\n  - 跟踪项目支出与预算的对比\n  - 处理问题并降低风险\n\n## 重要说明\n\n请将开发团队成员与此次项目会议隔离。\n\
  \n## 重要说明\n\n您 Salesforce 项目的最优交付治理 *配置* 取决于 Salesforce 项目的性质和范围以及敏捷团队的数量。如果您有多个团队或流，您应考虑遵循更先进的\
  \ **规模化敏捷框架** (**SAFe**) 配置之一。\n\n让我们更深入地探讨测试您的 Salesforce 解决方案。\n\n## 管理您的 Salesforce\
  \ 解决方案的质量\n\n您的实施合作伙伴可能负责其交付的解决方案的质量，但贵公司最终对要求公司用户、客户和合作伙伴使用和交互的解决方案负责。因此，了解关键的测试和质量保证方法非常重要。\n\
  \n让我们回顾一下您需要了解的 Salesforce 中的两种测试类型：\n\n- **用户故事测试** (**功能测试**)：这是一种常用的手动测试方法，其中单个功能（或用户故事）被测试以确保其按预期工作。测试人员应确保正向和负向测试用例都能证明解决方案有效。我们在本章中\
  \ *管理您的看板* 部分之前已描述了详细信息——应为每个配置或开发的功能执行此操作。\n- **单元测试：** 这是 Salesforce 强制执行的测试类型，要求每次部署（带代码）至少有\
  \ 75% 的测试覆盖率。但它也可以——并且应该——用于测试业务关键流程，例如线索记录创建、联系人记录创建和线索转换。为配置功能创建测试类的前期工作量远远超过在\
  \ UAT 或生产环境中修复关键流程故障的痛苦。\n\n## 重要说明\n\n您和您的实施合作伙伴可以并且应该执行许多其他类型的测试，包括 SIT、**性能测试**\
  \ 和 **负载测试**。然而，它们超出了本书的范围。如果您想更深入地了解软件测试的迷人世界，**ISTQB** 和 **TMAP** 是两种最广泛使用的测试框架。对于大型\
  \ Salesforce 项目，贵组织投资建立测试自动化可能是值得的。与 Salesforce 架构师合作，调查使用 **Provar** 或 **Selenium**\
  \ 等工具的可能性。\n\n在开发阶段结束时，或在推广阶段开始时，您将进行 UAT，以确保更大群体的预期终端用户在发布到生产环境之前测试并接受您的 Salesforce\
  \ 解决方案。我们将在 _第 9 章_、_部署您的发布并将数据迁移到生产环境_ 中介绍这一点。\n\n## 提示\n\n随着您在 Salesforce 项目的各个阶段推进，您可能会遇到阻力并收到反馈。虽然重要的是\
  \ _认真对待反馈——可能做出必要的更改——_ 并尝试了解阻力的根本原因，但同样重要的是您也要 _坚定信念_ 于 Salesforce 项目的愿景，并相信您在项目预开发阶段的努力和分析。\n\
  \n让我们看看跟踪 Salesforce 解决方案开发进度的不同方式。\n\n\n\n## 在开发阶段衡量进度\n\n之前，您已估算了 Salesforce 解决方案范围的开发工作量。为了了解进展情况，请使用以下关键报告和\
  \ KPI：\n\n- **燃尽图**：显示冲刺范围剩余的故事点或工时。\n- **版本报告**：预测产品待办事项列表中剩余用户故事的完成日期。对于您的 Salesforce\
  \ 项目而言，要使版本报告有意义，您需要对所有用户故事进行估算（使用故事点或工时）。支持敏捷开发流程的工具会根据团队的交付一致性提供最佳情况和最坏情况的预测。\n\
  - **冲刺速度**：根据您的估算方法，您可以通过以下方式衡量冲刺速度：\n  - 冲刺中完成的故事点的总和。\n  - 冲刺中完成的故事的估算开发工时的总和。\n\
  - **增加的范围**：虽然增加的范围可能有价值，但它会降低效率，并增加项目按时交付的风险。您需要了解并管理增加范围的两个层面：\n  - **新范围**：为了管理范围蔓延并提高开发效率，跟踪添加到产品待办事项列表中的\
  \ *新用户故事* 的数量（和估算）是个好主意。\n  - **冲刺后期范围**：在 *冲刺计划之后* 添加到冲刺待办事项列表中的用户故事未在冲刺计划中讨论，因此开发团队成员无法评估并承诺交付它们。更糟糕的是，开发团队需要花费时间来了解用户故事的内容以及如何解决它们。\n\
  \n### 重要提示\n\n虽然试图让开发团队成员“工作更快或更聪明”以在更短时间内交付更多成果很诱人，但几乎总是更有效的策略是超越开发团队，改进诸如 *组织对齐、产品负责人赋能以及团队间依赖关系的消除*\
  \ 等领域。\n\n让我们继续讨论您的数据。\n\n## 准备您的数据迁移计划\n\n作为预开发阶段工作和分析的一部分（在第 2 章 *定义您的 Salesforce\
  \ 项目性质* 中介绍），您已确定目前用于支持业务能力的 *系统*。由于您正在基于 Salesforce 平台开发新解决方案，现在的任务是确定需要从您的 **遗留系统**\
  \ 迁移到 Salesforce 的数据以及如何迁移它。\n\n您的数据迁移策略应回答以下关键问题：\n\n- 您将从哪些 *系统* 迁移数据？\n- 您将移动哪些\
  \ *数据*？\n- 您将如何从遗留系统 *提取* 数据？\n- 您的数据 *映射* 到哪些 Salesforce 对象——数据将驻留在何处？\n- 您将如何\
  \ *转换* 您的数据以使其可被 Salesforce 使用？\n- 您将如何将数据 *加载* 到 Salesforce？\n\n首先列出所有遗留系统和数据（对象），并记录每个对象中的记录数。\n\
  \n### 重要提示\n\n确保识别任何潜在的 **大容量数据 (LDV)** 对象，因为它们会影响您决定如何从遗留系统提取数据以及如何将其加载到 Salesforce。有关\
  \ LDV 及其对 Salesforce 组织影响的更多信息，请参阅文章 *大容量数据部署的最佳实践*，网址为 https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_introduction.htm。\n\
  \n如果您已决定 *分阶段推出项目*（作为预开发阶段分析的一部分，在 *第 3 章、确定如何交付您的 Salesforce 项目* 中），您需要确定在各种推出中用户组的记录数。\n\
  \n然后您需要了解如何以何种格式从遗留系统提取数据。某些系统可以连接到数据 **提取转换加载 (ETL)** 工具，例如 Informatica，这可以加快提取和转换速度。\n\
  \n接下来，映射数据将驻留在哪些 Salesforce 对象中。这可能是一项棘手的练习，因为 **数据模型** 和 **数据规范化** 的级别在不同系统之间有所不同。请聘请\
  \ Salesforce 架构师或 **数据迁移专家** 来支持您完成此工作。\n\n### 提示\n\n创建一份 **数据字典**，描述 Salesforce\
  \ 解决方案中使用的所有对象和字段。确保它与开发团队保持一致并持续更新。\n\n您现在知道了数据的来源和目标，以及每个属性或字段的数据格式差异，并且可以确定转换方法以使数据为\
  \ Salesforce 做好准备。\n\n接下来，您需要确定如何将数据加载到 Salesforce。可用选项很多——其对您 Salesforce 项目的适用性取决于诸如数据集的大小（包括任何\
  \ LDV）以及您的 **数据迁移窗口** 长短等因素。这就引出了最后一点：数据迁移规划。\n\n一些企业仅在白天营业时间营业，这使得晚上、夜间和周末成为数据迁移窗口的合适选择，而不会中断业务。但如果您不在单一时区运营，或者您的用户可能也在晚上和夜间工作呢？在这种情况下，您将面临一些艰难的决定和两个总体选项：\n\
  \n- 您可以尝试以精细调整的累积方式规划和安排数据迁移时间：\n  - 这需要高级编排和规划，并且需要在预生产沙箱中进行多次 **演练**，以在上线时将数据移至生产环境之前优化执行。\n\
  \  - 这种方法还有另一个风险。如果数据迁移延迟，业务最终仍会被中断。\n- 接受对业务中断的影响。其好处是您可以在迁移数据时安排用户培训。\n\n### 提示\n\
  \n在上线时最大化您的数据迁移的关键提示：\n\n- 在开发阶段早期开始数据迁移规划以定义您的策略。\n- 优先考虑数据清洗。数据质量是许多公司的重大挑战。您投入在清理数据和删除重复项上的时间将增强用户体验并提高\
  \ Salesforce 组织的整体性能，从而带来更好的采用率。\n- 您的数据迁移策略应与您的开发原则保持一致。确保负责数据迁移策略的人员与敏捷开发团队之间保持密切协作。\n\
  \n我们将在 *第 9 章*、*部署您的版本并将数据迁移到生产环境* 中介绍数据迁移准备工作。\n\n### 提示\n\n为了更深入地了解将数据迁移到 Salesforce\
  \ 的复杂性以及一般管理方法，您可以阅读由 Ahsan Zafar（CTA）撰写的 *Salesforce Data Architecture and Management\
  \ Data* 书籍（https://www.amazon.com/Salesforce-Data-Architecture-Management-effectively/dp/1801073244）。\n\
  \n让我们总结本章。\n\n## 摘要\n\n您已完成了大量活动，从解决方案设计到构建和测试 Salesforce 解决方案的用户故事。您还创建了一个计划，以便在向用户推出\
  \ Salesforce 解决方案时将数据从遗留系统迁移到 Salesforce。完成这些活动后，您应评估 Salesforce 项目的状态，因为您即将接近 *第\
  \ 2 部分、开发阶段* 的结束。\n\n在下一章中，我们将讨论您在 Salesforce 项目开发阶段可能遇到的典型问题以及如何减轻和克服它们。您还将获得一份清单来评估\
  \ Salesforce 项目的状态。\n\n## 开发阶段应避免的常见问题\n\n在之前的两章中，您介绍了 Salesforce 项目开发阶段的活动：详细说明版本的范围、创建解决方案设计、建立团队的开发流程、完成版本的构建和测试，以及创建数据迁移计划。\n\
  \n在本章中，我们将讨论 Salesforce 项目开发阶段经常遇到的问题。我们还将介绍防止或减轻此类问题出现的策略。\n\n在 *第 5 章*、*预开发阶段应避免的常见问题*\
  \ 中，您已了解 **根本原因分析 (RCA)**，我们将继续使用该方法来剖析开发阶段面临的常见问题。在本章结束时，您将获得一套 **检查清单**，以便在完成开发阶段时评估\
  \ Salesforce 项目的状态。\n\n本章将涵盖以下主要主题：\n\n- 开发阶段的常见问题及其根本原因\n- 评估 Salesforce 项目的状态\n\
  \n开始吧！\n\n### 开发阶段的常见问题及其根本原因\n\n让我们从查看开发阶段最常见的问题开始——用鱼骨图说明：\n\n![](img/307881206539c45e128c538a4b6912f8_212_0.png)\n\
  \n图 8.1 – 开发阶段常见问题的鱼骨图\n\n接下来，我们将讨论每个常见问题的可能根本原因以及缓解和预防策略。\n\n## 无法遵循暂定的开发计划\n\n\
  在表 8.1 中，您可以找到可能导致无法遵循 Salesforce 项目暂定开发计划的根本原因，以及如果您已遇到该问题时的缓解策略：\n\n| 可能的根本原因\
  \ | 缓解和预防策略 |\n|---|---|\n| 组织的要求和优先级发生变化。 | 授权并期望您的 Salesforce 产品负责人 (PO) 挺身而出、主动承担责任，并获得业务利益相关者对初始版本优先级的认可。\
  \ |\n| 由于对预算与价值的错误二分法理解而削减或最小化技术使能因素。 | 确保您聘请 Salesforce 架构师提供建议，指出哪些技术使能因素是您 Salesforce\
  \ 解决方案的 *先决条件*。 |\n| “范围蔓延”或在途变更请求。 | 实施清晰的变更请求管理流程——为中大型 Salesforce 项目建立一个具有定期会议节奏的变更控制委员会来评估和处理变更请求是良好的实践。\
  \ |\n| 在初始冲刺中过度优化功能史诗，导致剩余史诗受损。 | 鼓励您的 PO 从全局考虑，并为 Salesforce 解决方案的所有外部和内部角色及终端用户提供端到端解决方案。确保开发工作（投资）与\
  \ Salesforce 项目范围内能力的战略重要性保持一致。 |\n| 在开发阶段及以后，所有项目团队成员的文档维护和可见性较差。 | 虽然讨论起来不够令人兴奋，但可见且最新的文档是开发效率的催化剂。优先建立良好的结构，使所有项目成员都能访问并对需求和解决方案文档进行评论（并选择角色更新）。\
  \ |\n| 对团队成员开发原则和指南的建立、培训和沟通不足。 | 建立您的指南。然后在项目的入职材料/演示文稿中添加一个部分，其中包含对指南的引用。传达指南并持续调整和改进它们。\
  \ |\n| 约束和瓶颈阻碍进展。 | 调查约束的性质——您看板中每个列的用户故事周期时间。您的敏捷开发团队成员很可能清楚根本原因是什么，因此您需要做的就是询问、倾听并迅速采取行动解决瓶颈。这可能涉及重新调配资源、修改开发流程，或增加人手不足的角色。\
  \ |\n| 技术工具和开发环境（沙盒）策略阻碍了您的开发团队。根本原因可能从开发人员在部署到公共 QA 沙盒时配置相同组件并覆盖彼此的更改，到开发团队使用变更集部署元数据不等。\
  \ | 与分配给您 Salesforce 项目的 Salesforce 技术架构师合作，并期望他们识别具体的根本原因并提出变更建议，以改进所使用的开发流程和工具。我们将在第\
  \ 12 章《发展您的 Salesforce Org 和 DevOps 能力》中更详细地讨论此主题。 |\n| 忽视变更管理工作。 | 确保所有利益相关者群体都代表在项目中并了解您的\
  \ Salesforce 项目。 |\n| 冲刺评审（演示）中利益相关者参与度低且反馈不佳。 | 考虑以下行动：- 邀请相关利益相关者参加相关演示 - 将用户故事分组以讲述更大的整体故事\
  \ - 使用业务语言并使用真实的测试数据——关注用户故事的业务价值，而非开发的技术复杂性和精妙之处 |\n| 开发估算的潜在假设被证明是错误的。由于在冲刺计划前需要更多回溯精炼会议，预期的冲刺效率可能低于预期。\
  \ | 迅速尝试了解假设是否普遍错误，这意味着所有用户故事的估算都错误或过低，还是只有部分用户故事受错误假设影响。根据情况调整您的开发计划。 |\n| 开发团队时间分配和技能不足：Scrum\
  \ Master、业务分析师、开发人员和 QA 专家。 | 为什么这是最后一点？这些团队成员很可能是交付 Salesforce 项目经验最丰富的人。虽然您可能会遇到缺乏经验的\
  \ Salesforce 专业人员，但您的 Salesforce 项目落后于暂定开发计划的根本原因很可能通过查看此前的要点找到并解决。 |\n\n表 8.1 –\
  \ 无法遵循暂定开发计划的可能根本原因\n\n让我们来看开发阶段的下一个常见问题。\n\n## 前期架构和用户故事解决方案设计耗时过长\n\n在表 8.2 中，您可以找到可能导致为\
  \ Salesforce 项目范围内的用户故事创建前期架构和解决方案设计耗时超出预期的根本原因：\n\n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n\
  | 与实施合作伙伴的架构师互动的内部技术资源分配不足。 | 技术架构如集成策略、集成模式确定、数据主数据管理和身份与访问管理 (IAM) 都需要与您企业的实践和能力保持一致。来自您\
  \ IT 组织的资源不足是 Salesforce 项目的风险。 |\n| 您在开发前阶段做出的技术假设被证明无效。 | 正如我们在本书的开发前阶段所讨论的，在开始\
  \ Salesforce 项目的开发阶段之前，您会做出很多假设。如果发现某个假设错误，请评估影响并相应调整设计和/或计划。 |\n| 用户故事及其验收标准的质量不适合进行解决方案设计。\
  \ | 让您的 Salesforce 项目的 PO 参加关于用户故事概念的速成课程——理想情况下，由业务部门主办此会议。此外，您的 PO 可以查看该主题的 Salesforce\
  \ Trailhead 模块：https://trailhead.salesforce.com/content/learn/module/story-creation/construct-a-user-story。\
  \ |\n| 分配具有 Salesforce 架构复杂性技能和经验的资源不足。 | Salesforce 是一个庞大的平台，涵盖传统 CRM、分析、集成、PaaS\
  \ 能力以及协作工具。您很少遇到精通所有方面和产品的架构师。确保您的 Salesforce 项目拥有充足的 Salesforce 架构师资源。 |\n| 在确定开发模型、沙盒和开发生命周期以及部署策略方面存在困难。\
  \ | 与实施合作伙伴的技术架构师合作，并期望他们主导这些主题的分析和建议。您的高级 IT 领导者和利益相关者应密切参与讨论并认可所做决策，因为这会影响您的长期成本和运营模式。\
  \ |\n| 您的 Salesforce 项目范围过大（8 个以上 2 周的冲刺），项目团队难以在前期充分理解并有效设计和估算。 | 考虑将您的 Salesforce\
  \ 项目分阶段进行，分为两个或多个更大的发布。或者，考虑仅为初始冲刺创建用户故事级别的解决方案设计，并为单独的并行设计流分配资源。如果您选择采用后者方法并设立单独的设计流，则必须在冲刺开始前由设计负责人完成并审查该冲刺的用户故事解决方案设计至关重要。否则，存在用户故事在冲刺期间无法完成的延期风险，进而需要更多冲刺并延长开发计划。\
  \ |\n\n表 8.2 – 前期架构和用户故事解决方案设计耗时过长的可能根本原因\n\n让我们跳到开发阶段的下一个常见问题。\n\n\n\n## 在详细规划\
  \ Salesforce 项目范围时遇到的困难\n\n如果您尚未详细规划 Salesforce 项目的范围，您可以继续阅读以了解需要注意的事项——然后回顾第 6\
  \ 章《详细规划初始版本的范围和设计》。\n\n在下面的表格中，您可以找到导致您在详细规划 Salesforce 项目范围时遇到困难的可能根本原因，以及如果您已面临该问题时的缓解策略：\n\
  \n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n| Salesforce 项目的愿景和初始高层范围不明确或在开始开发阶段前未确定。 |\
  \ 与 Salesforce 项目的赞助者一起识别并对齐愿景和高层范围。 |\n| 团队成员未得到妥善入职和介绍 Salesforce 项目。 | 创建一份入职简报，其中包含关键项目信息，以便新项目团队成员了解您的\
  \ Salesforce 项目。至少包括 Salesforce 项目的愿景和性质、项目团队成员的角色和职责、交付方法、开发指南、用于开发和部署的工具和流程，以及可用的项目文档（范围、需求、用户故事和设计）。\
  \ |\n| 为 Salesforce 项目分配的内部资源不足。经常情况下，一个组织在实施 Salesforce 的同时，还希望尝试敏捷或混合敏捷交付方法——并且在整个项目中对内部资源所需参与程度感到不堪重负。具体来说，您的\
  \ PO 可能缺乏经验、技能、时间分配，或承担该角色重大责任所需的授权/授权。 | 这种情况没有简单的解决办法。为了拥有终端用户愿意使用且能改善客户与贵组织互动体验的\
  \ Salesforce 解决方案，您需要*投入关键内部资源的时间*来提供输入共同创建解决方案。如果这些人从未参与过敏捷或混合敏捷项目，请确保他们在分配到项目前得到适当的提升技能/培训，并考虑聘请敏捷教练加入您的项目。\
  \ |\n| 项目团队中业务分析资源不足。经常情况下，有经验的功能顾问被要求充当业务分析师来开展研讨会、收集需求并挑战组织的假设和旧的工作方式。然而，扎实的业务分析技能与\
  \ Salesforce 平台上的声明式开发是不同的。虽然一些功能顾问是优秀的业务分析师，但并非全部如此。 | 为了解决这个问题，与您的实施合作伙伴合作，确保您拥有足够的业务分析技能来支持和指导您的\
  \ PO 创建用户故事和扎实的验收标准。 |\n\n表 8.3 – 详细规划 Salesforce 项目范围困难的可能根本原因\n\n接下来，让我们评估您在开发阶段的\
  \ Salesforce 项目。\n\n## 评估您的 Salesforce 项目状态\n\n我们已涵盖了 Salesforce 项目开发阶段的许多主题和活动。如果您的项目陷入停滞，或您对进展不满意，以下小节将帮助您评估\
  \ Salesforce 项目的状态。对于每个无法勾选的项目，请返回相应的章节并完成活动以继续推进您的 Salesforce 项目。\n\n## 开发阶段 Salesforce\
  \ 项目检查清单\n\n在开发阶段，您应已完成以下操作。在详细规划发布范围时，您应：\n\n-   确保所需内部资源已分配给您的 Salesforce 项目\n\
  -   让终端用户参与共同创建将由您的 Salesforce 解决方案支持的业务流程\n-   确保 Salesforce 项目的产品负责人具备合适的资质并获得授权，能够代表业务利益相关者详细说明用户故事并提供验收标准\n\
  \n接下来，您应完成以下活动以创建解决方案的架构和设计：\n\n-   确定在开始开发前您希望创建多少 **架构跑道**\n-   确保由 *第 6 章《详细规划初始版本的范围和设计》*\
  \ 中描述的工件由您的内部 Salesforce 项目团队成员创建并理解\n-   了解您的 Salesforce 解决方案将定制到何种程度以及对可维护性的影响\n\
  \n接下来，您应完成以下活动以建立团队的开发流程，完成发布的构建和测试：\n\n-   确保 Salesforce 项目中的每个人都了解彼此的角色和职责\n-\
  \   了解了 Salesforce 解决方案的开发工作量（假设您选择按时间估算而非故事点）\n-   创建了初步开发计划，根据估算的开发工作量将 Salesforce\
  \ 项目范围内的史诗分配到冲刺中\n-   确定了将使用哪些敏捷仪式以及如何最大化其价值\n-   为用户故事定义了 **就绪定义 (DoR)** 和 **完成定义\
  \ (DoD)**\n-   确定了看板的使用实践\n\n接下来，您应考虑建立以下机制来管理 Salesforce 解决方案的开发：\n\n-   一个 **设计权威机构**，以确保拟议的解决方案符合目标解决方案架构和开发指南\n\
  -   一个 **变更控制委员会**，作为讨论并批准或拒绝拟议变更或新请求范围的论坛\n-   一个指导委员会来指导和治理 Salesforce 项目的交付\n\
  -   确保已建立充分的测试制度以保证 Salesforce 解决方案的高质量\n-   了解在开发阶段跟踪和理解进展的关键方法\n-   如果您的 Salesforce\
  \ 项目有多个轨道或流，已有意识地考虑使用正式框架（如 **规模化敏捷框架—SAFe**）\n-   完成了创建数据迁移策略和计划的步骤\n\n让我们总结本章和开发阶段。\n\
  \n## 摘要\n\n在本章中，您已熟悉开发阶段经常遇到的常见问题，并学习了如何缓解或防止其出现。您还通过检查清单评估了 Salesforce 项目在开发阶段的状态。\n\
  \n在您的 Salesforce 项目状况良好后，您已准备好进入 Salesforce 之旅的下一步——推广阶段，从 *第 9 章《部署发布并将数据迁移到生产环境》*\
  \ 开始。\n"
- '## 第 3 部分：推广阶段


  本部分将带您了解 Salesforce 项目推广阶段的关键活动，并讨论常见问题，以便您避免或缓解它们。


  本部分包含以下章节：


  -   第 9 章，部署发布并将数据迁移到生产环境

  -   第 10 章，通过沟通、培训和支持来推动采用

  -   第 11 章，推广阶段应避免的常见问题

  '
- "## 部署发布并将数据迁移到生产环境\n\n在前几章构建和测试您的 Salesforce 解决方案后，在本 Salesforce 项目 *第 3 部分《推广阶段》*\
  \ 的本第一章中，您将了解 **推广阶段** 的关键活动和里程碑。接下来，我们将深入探讨 **部署** 您的 Salesforce 解决方案的关键考虑因素和实际操作，以及如何充分利用\
  \ **用户验收测试 (UAT)**。接下来，我们将评估您迁移数据到生产环境的准备情况，并为您提供最终的上线检查清单，以验证您在培训用户后是否准备好 **上线**。\n\
  \n在本章结束时，您将了解 Salesforce 项目推广阶段的关键里程碑、成果和活动。您将获得执行 **系统集成测试 (SIT)** 和推动 UAT 的见解和实用建议。最后，您将了解规划和执行演练是成功\
  \ **数据迁移** 的关键，以及在培训后用户上线前签署批准前需要检查的内容。\n\n在本章中，我们将涵盖以下主要主题：\n\n-   Salesforce 项目推广阶段概述\n\
  -   通过环境部署您的 Salesforce 解决方案\n-   推动您解决方案的 UAT\n-   检查您的数据迁移准备情况并签署以便上线\n\n开始吧！\n\
  \n\n\n## 您 Salesforce 项目推广阶段概述\n\n在此阶段，您的 Salesforce 项目重点在于将初始解决方案和遗留数据上线，并让用户顺利上手。\n\
  \n让我们来看看在此阶段您将开展的工作。\n\n## 推广阶段的关键活动和里程碑\n\n您的 Salesforce 项目的推广阶段始于您完成首个版本的构建——**初始发布**——之时。\n\
  \n历史上，许多组织——及其实施合作伙伴——将成功的推广定义为解决方案已部署到生产环境、数据已迁移、用户已接受培训并首次登录，且每日新增生产支持工单数量降至预定阈值以下。听起来很熟悉吗？\n\
  \n但为了最大化您在 Salesforce 上的投资价值，您必须在此基础上进一步定义成功：\n\n成功的推广阶段应被定义为您的组织、客户/合作伙伴以及用户都在使用\
  \ Salesforce 解决方案并从中获益，且其交付了您在第 4 章《获取资金并与 Salesforce 和实施合作伙伴》 中设定的目标业务成果。\n\n因此，为了规划一次成功的推广，我们可以总结此处的关键活动和里程碑（加粗的活动在规划中常被忽视）：\n\
  \n- 部署您的 Salesforce 解决方案到各环境\n- 推动解决方案的用户验收测试\n- 将您的数据迁移到 Salesforce\n- 签署上线批准\n\
  - *规划、沟通和管理变更*\n- 对您的用户进行培训\n- 提供超配支持并管理生产支持\n- *监控并推动您 Salesforce 解决方案的采用*\n\n\
  在明确了整体活动和里程碑的 *内容* 后，让我们来看一下您的推广阶段可能需要 *多长时间*。\n\n## 推广阶段的持续时间\n\n根据以下因素，您的 Salesforce\
  \ 项目的推广阶段可能需要 *从数周到数月或数个季度* 不等：\n\n- 要部署和发布的 Salesforce 解决方案的技术范围和领域数量\n- 与您的解决方案协作的用户和区域的地理范围\n\
  - 需要培训的团队和用户数量\n- 用于部署、迁移数据以及与用户沟通和培训的技能和资源\n\n### 提示\n\n在 *第 3 章*、*确定如何交付您的 Salesforce\
  \ 项目* 中，您考虑了如何分阶段进行 Salesforce 项目。如果您尚未确定，请返回该章节，并制定您的项目分阶段计划。\n\n让我们看看谁将监督您 Salesforce\
  \ 解决方案的推广。\n\n## 推广阶段中您 Salesforce CoE 的角色\n\n在 *第 3 章*、*确定如何交付您的 Salesforce 项目*\
  \ 中，您设想了您 **Salesforce 卓越中心 CoE** 的结构和职责。现在是执行并建立它的时机。\n\n虽然部署和数据迁移看起来是技术任务，但您的\
  \ Salesforce CoE 最终对监督这些活动并管理可能出现的升级问题负有责任。\n\n除此之外，在 *第 10 章*、*通过沟通、培训和支持来推动采用*\
  \ 中，您将了解您和您的 Salesforce CoE 将如何规划和准备变更和沟通计划、系统停用、用户培训、上线，以及为自己设置超配支持和生产支持——所有这些的目标都是确保采用，从而收获您的投资回报。\n\
  \n让我们从第一个主题开始！\n\n## 通过环境部署您的 Salesforce 解决方案\n\nSalesforce 部署形式多样，其持续时间可从几分钟到数小时甚至数天不等，尤其对于技术治理有限的高度定制化、老旧组织而言。\n\
  \n虽然 *您* 部署的内容* 针对您的组织和项目是独特的，但从一个沙盒到另一个沙盒——最终到生产环境——*在抽象层面* 上部署整个解决方案的步骤如下：\n\n\
  - **计划部署：** 部署计划分为两个部分：\n  - **组织部署规划**：确保您已与利益相关者和项目团队成员就以下关键事项达成一致：\n    - 您想要部署的内容\n\
  \    - 您想要部署的时间\n    - 预计参与部署的人员，以及他们应承担的职责\n    - 任何开发冻结期已得到沟通\n  - **技术部署规划**：在开始部署前确定并准备以下项目：\n\
  \    - **准备发布构件**：根据您的开发方法（请参阅 *表 7.2*），这可能意味着准备 Change Set、准备包含元数据组件的 `.zip` 文件，或创建/更新一个或多个未锁定包的版本\n\
  \    - **识别并列出部署前和部署后步骤**：在开发阶段的冲刺期间，您的开发团队应持续添加任何无法通过 Change Sets 或 Metadata API\
  \ 部署的部署步骤，因此需要手动部署步骤\n\n### 提示\n\n如前所述，并非所有 Salesforce 元数据都可通过 Metadata API 部署——请访问\
  \ *Metadata Coverage* 报告 https://developer.salesforce.com/docs/metadata-coverage\
  \ 以了解您解决方案的任何组件是否需要手动部署。\n\n- **确定回退计划**：确定如果部署失败、耗时超过计划（失败），或在目标环境中未通过冒烟测试验证时您将如何处理\n\
  - **部署您的解决方案**：技术上部署您的解决方案通常分为三个部分：\n  - **执行部署前步骤**：这些可能包括以下步骤：\n    - 在 **Setup**\
  \ 菜单中启用各种 Salesforce 功能。一些示例包括设置 **Web-to-Lead Enabled**、**Enable Web-to-Case**、**Allow\
  \ users to relate a contact to multiple accounts**，以及 **Enable Field Service**。\n\
  \    - 安装 AppExchange 应用。\n  - **部署发布构件**：在准备好发布构件后，部署可能只需点击一下按钮（或输入 `sfdx force:source:deploy`\
  \ 命令并按 *Enter*）。然而，首次部署完整解决方案可能很困难，因为这可能是所有组件首次一起部署到全新的 Salesforce 沙盒或生产实例。\n  -\
  \ **执行部署后步骤**：这些可能包括以下步骤：\n    - 执行不可部署组件的手动部署后操作。\n    - 创建或导入参考数据，例如产品、价格表、价格表条目、**配置价格报价\
  \ CPQ** 配置数据，以及 Field Service Lightning 配置数据。\n    - 如果您的解决方案与外部系统集成，您可能与它们存在技术依赖。这可能是证书或为您的网页开发团队在网站上使用的网络表单生成\
  \ HTML 片段。\n- **部署验证**：对所选功能和功能进行冒烟测试验证。您应限制在生产环境中创建或修改数据：\n  - 随着您通过沙盒部署到生产环境，您的团队将积累经验并形成部署解决方案的常规。制定常规并在开发团队内保持良好纪律，确保您的部署构件和流程得到记录——并且\
  \ *至关重要*——在每次冲刺/每次发布后更新。\n\n### 提示\n\n一个常见的构件（有时由实施合作伙伴同意为项目交付物）是详细的部署计划或部署清单（有时称为运行手册）。您的详细部署计划供部署团队在每次部署时遵循，并应包括以下项目：\n\
  - 计划中每个任务的状态、依赖关系、确切时间以及负责人，包括所有部署前和部署后步骤\n- 部署时间表和利益相关者沟通计划\n- 由您的产品负责人和其他利益相关者进行部署签署的方式说明\n\
  \n接下来，我们将超越部署的技术细节。\n\n## 执行系统集成测试\n\n您进行系统集成测试是为了确保在部署 *全部* 后，开发的解决方案按预期工作。我们所说的\
  \ *全部* 是什么意思？这取决于 Salesforce 项目的类型，可能意味着两种情况：\n\n- **Greenfield Salesforce实施**：如果这是你的第一个\
  \ Salesforce 项目，且用户尚未在生产环境中上线，并且你的开发流水线由 *多个流/产品团队或开发人员* 组成，他们拥有自己的沙盒和/或功能分支，合并它们可能会导致冲突——而这正是\
  \ SIT 的目标——*测试系统的集成*：\n\n- 现在及早发现 bug 而不是等到以后——在 UAT 或生产环境——将使 UAT 更顺利，并最终提高你在生产环境中解决方案的采用率\n\
  \n- **Brownfield Salesforce实施**：如果你已经在 Salesforce 生产实例上有用户在线，你需要确保任何新功能或更改不会破坏现有流程。\n\
  \n你可以选择在每个冲刺结束或构建阶段后执行 SIT。\n\n执行 SIT 的具体活动和步骤将取决于你的 Salesforce 项目的性质，然而，执行 SIT\
  \ 通常包括以下活动：\n\n1. **部署错误识别与解决**：如前一节所述，你在首次部署整个解决方案时很可能会遇到部署错误。解决这些部署错误是你的第一步。\n\
  \n### 提示\n\n在初始（或任何主要）版本首次生产部署之前，在暂存沙盒（最好是完整副本沙盒）中进行部署演练。这可以作为为 SIT 或 UAT 准备沙盒的一部分进行，并为你的部署团队提供机会来微调详细的部署计划，以确保没有步骤被遗漏或顺序错误。你还应该——在整个开发阶段——执行测试部署（或部署验证），以了解部署错误的数目和性质。这些活动将有助于提高你对生产部署顺利进行的信心，通过最大限度地降低部署失败或耗时过长的风险。\n\
  \n如果你在解决部署错误时感到不知所措或陷入困境，请查阅 Andrew Davis 在 https://www.salesforceben.com/checklist-for-debugging-salesforce-deployment-errors/\
  \ 上发表的这篇 *SalesforceBen* 文章。\n\n2. **元数据合并冲突识别与解决**：这可能取决于你的 Salesforce 项目而包括以下两种情况之一。解决后，你的解决方案在技术上可以部署到下一个环境：\n\
  \   - **Greenfield**：识别合并不同流的元数据组件时产生的冲突并解决它们\n   - **Brownfield**：与 greenfield\
  \ 相同的原则适用，只不过你是在识别 Salesforce 项目中的更改与生产环境中已存在的内容之间的冲突\n\n3. **回归测试**：除了技术部署之外，你还需要测试增量更改不会破坏任何现有流程。它可以通过手动测试或使用\
  \ **Provar** 或 **Selenium** 等工具的 **自动化测试** 来执行。然而，它们需要设置（以及成本）和培训，因此你需要权衡收益与成本和时间。回归测试的另一个方面是测试集成解决方案与其他系统的接口是否仍然像以前一样正常运行，或——如果有任何更改在较低环境中被修改、开发和测试——是否符合任何新的修改。\n\
  \n### 提示\n\n如果你的项目规模大、周期长，你可以考虑将自动化测试作为开发生命周期的一个部分实施。对于规模较小、生命周期短的项目——在 Salesforce\
  \ 环境中没有现有的测试自动化工具——你可能更明智的做法是投入时间和资源进行手动回归测试。\n\n接下来，让我们利用 UAT 作为推动采用和增强终端用户拥有感的催化剂。\n\
  \n## Driving UAT of your solution\n\n你已将解决方案部署到你打算进行 UAT 的沙盒中。太好了！\n\nUAT 是 Salesforce\
  \ 项目的关键里程碑之一。如果你的 **验收测试团队**（或客户和合作伙伴）不接受你正在构建的解决方案，其他一切都无关紧要。\n\n接下来让我们看看你需要准备什么来规划一次成功的\
  \ UAT。\n\n## Planning for a successful UAT\n\n为确保 UAT 成功，你需要一个计划。让我们看看它应包含什么内容：\n\
  \n- **Lean meetings**：这些应该是简短的会议，用于分享更新，并在其中做出一些决策，但这些会议并非用于头脑风暴或讨论：\n  - **UAT\
  \ kickoff**：在此，你的项目团队向验收测试团队介绍 UAT，包括 UAT 的持续时间、活动、流程和成果\n  - **Daily check-in/check-out**：这些是与你的\
  \ **项目经理 (PM)**、**产品负责人 (PO)**、**业务分析师 (BA)** 和 **质量保证 (QA)** 专家进行的快速状态通话，以评估报告的\
  \ bug 数量、其分类和解决状态\n  - **UAT sign-off**：确定 UAT 如何正式签署并完成\n\n- **What should you\
  \ test in UAT**：以下是在 UAT 中应测试的两件事：\n  - **End-to-end test cases**：这些是基于你解决方案范围内的用户故事的测试场景集合。分配给你的项目的\
  \ QA 专家应与你的 BA 一起创建端到端测试用例。\n  - **Non-vanilla flows**：邀请你的验收测试团队报告在未按正确顺序遵循测试用例流程时遇到的\
  \ bug。\n\n### 重要说明\n\n一个 *架构良好且经过充分测试的解决方案* 将考虑并管理边缘情况和异常，并在用户尝试以“错误的方式”做事时引导用户走上正确的路径。\n\
  \n- **Who should participate in UAT**：以下资源和利益相关者对成功的 UAT 至关重要：\n  - **The sponsor**：他们应通过分享你\
  \ Salesforce 项目的愿景并解释验收测试团队的工作和努力的重要性来启动 UAT。\n  - **PO**：他们负责回应验收测试团队报告的 bug。参见关于\
  \ *Define a process to follow* 的进一步说明。\n  - **Acceptance testing team**：你已在 Salesforce\
  \ 项目的开发前阶段和整个开发阶段与其中一些人（你的目标终端用户）互动过。现在是时候将他们聚集起来作为你的验收测试团队，从头到尾测试你的解决方案。\n\n###\
  \ 重要说明\n\n你邀请参与 UAT 的解决方案的终端用户可能以前从未参与过 UAT——或可能以前从未参与过敏捷或混合敏捷项目。管理 UAT 参与者的期望对顺利进行过程至关重要。为此，请对你为项目选择的方案及其原因保持开放和透明。如果你正在构建\
  \ MVP 以快速为有限范围带来价值，请解释这一点。并让你的 UAT 团队知道更多功能已计划，但不包含在现在在 UAT 中测试的初始版本中。\n\n- 决定谁以及多少人应成为团队的一部分是一个平衡行为。通过涉及过少的终端用户代表，你可能会冒着测试不够全面的风险，这可能导致次优、易出错的解决方案，且采用率不佳。另一方面，测试团队人数过多可能导致你花费大量时间和精力进行前期培训和说明——更不用说处理报告的\
  \ bug 数量增加：\n  - 作为最低要求，你需要为每个角色至少有一名测试成员——在 Salesforce 中，从系统角度来看，这可以由 **记录访问授权**（`Role`、`Territory\
  \ Assignments` 和 `Queue Memberships`）和 **系统权限**（`Profile` 和 `Permission Set Group`）的组合来表示。\n\
  \n### 提示\n\n为了为用户培训奠定基础并开始招募变革推动者，你应考虑为解决方案范围内的每个领域（销售、服务、营销）在每个计划的地理区域（地区/国家）至少安排一名代表。如果你的解决方案针对不同的子域或子部门，例如具有不同测试流程的电销和关键账户管理，你应为每个子域至少安排一名代表。\n\
  \n\n\n- **BA 和/或 QA 专家**：对报告的缺陷进行分诊、评估和分类，并可能提出修复实际缺陷的解决方案\n- **开发团队**：修复已识别并优先处理的缺陷\n\
  \n- **定义需遵循的流程**：建立并传达如何报告缺陷以及分诊和可能修复缺陷的流程：\n  - 与所有验收测试团队成员共享缺陷模板。缺陷模板在正确填写后应使\
  \ BA 或 QA 专家能够轻松地分诊、复现和分类缺陷。至少应包含以下信息：\n    - 缺陷报告者的用户名\n    - 测试用例名称或 ID\n    -\
  \ 用户在测试用例的哪个步骤遇到缺陷\n    - 用户期望发生的情况与实际发生情况的对比\n    - 到记录/页面的链接\n    - 整个浏览器窗口的截图，包括\
  \ URL 栏，有时可为项目团队提供有关问题的有价值背景，并减少与测试人员之间的来回沟通\n- **确定缺陷分类及各自的处理措施**：这些通常包括以下分类，但可能因您的\
  \ Salesforce 项目性质而有所不同：\n  - **Change request**：您的产品负责人应评估并处理这些请求，要么向缺陷报告者传达该请求已被考虑并放入待办清单，要么传达未被考虑及原因。\n\
  \  - **Not a real bug** 这可能是由于用户错误或数据错误造成的。在任何情况下，修复该问题都不需要开发。您的 BA 或 QA 专家应向缺陷报告者展示他们如何执行测试用例以及事先需要设置哪些数据。\n\
  \  - **Bug**：BA 和开发人员可以评估缺陷，确定行为的原因（根本原因），找到修复方案并估算所需工作量。产品负责人可以审阅并根据待办清单中的其他缺陷确定缺陷的优先级。\n\
  \n## 提示\n\n许多在 UAT 期间报告的缺陷是由用户设置错误（配置文件权限集、队列等）引起的，因为未遵循测试用例，或因为 **有缺陷的测试数据**。\n\
  \n为了最大限度地降低因这些原因报告缺陷的风险，请确保向测试团队提供充分的说明，并仔细检查测试数据是否已正确设置并准备就绪。测试数据包括以下内容：\n\n- 用于登录的\
  \ Salesforce 测试用户账号\n- 主数据，例如账号和联系人\n- 交易数据，例如商机、订单和案例\n- 参考数据，例如产品、价格表和价格表条目\n\n\
  在 UAT 过程中，您可能会收到验收测试团队的大量反馈或缺陷。请对反馈持开放态度并感谢团队的付出。\n\n## 提示\n\nSrini Munagavalasa\
  \ 撰写了整整一章专门介绍 Salesforce 上下文中的 UAT。我建议您查看 *The Salesforce Business Analyst Handbook*\
  \ (https://www.amazon.com/Salesforce-Business-Analyst-Handbook-techniques/dp/1801813426)。\n\
  \n接下来，让我们确保您已准备好将数据导入 Salesforce！\n\n## Checking your data migration preparedness\
  \ and signing off to go live\n\n您现在正处于开发阶段的最后阶段。您已成功部署 Salesforce 解决方案并执行了 SIT 和\
  \ UAT。\n\n在本节中，我们将重点介绍关键的实际考虑因素，以评估您是否真的准备好开始将数据迁移到 Salesforce 生产环境。\n\n## Evaluating\
  \ your data migration preparedness\n\n在开始将数据迁移到生产环境之前，请确保您已准备并演练了您的数据迁移计划。它应在开发阶段完成。\n\
  \n### 重要说明\n\n如果您尚未准备数据迁移计划，您需要暂停并查看 *Preparing your data migration plan* 部分在 *Chapter\
  \ 7*、*Building and Testing Your Initial Release*，并在继续之前开始着手。\n\n太好了，您的数据迁移计划已就位！这意味着您已确定如何从任何遗留系统、其他应用程序和来源技术上获取数据，并且您知道谁将如何以及将数据转换并加载到\
  \ Salesforce。\n\n让我们看看可用于评估您准备好开始将数据迁移到 Salesforce 的事项清单：\n\n- 您已在暂存沙盒中执行了成功的数据迁移演练。\n\
  - 您已确认您的 Salesforce 解决方案已部署到生产环境——包括其配置数据。\n- 您已事先与开发团队确认，自动化和验证是否设计为处理迁移数据，或者是否需要在数据迁移期间使其处于非活动状态。如果是后者，您已确认由谁在何时执行。\n\
  - 您已与 IT 和业务利益相关者达成一致并确认其可用性，以便在生产环境中验证和确认您的数据迁移。同样，源系统专家也应在需要通过新的源系统提取运行解决问题的情况下提供支持。\n\
  - 如果您的实施合作伙伴将参与迁移您的数据，请确保遵守您运营所在国家/地区适用的任何法律，具体取决于他们将有权访问和处理的数据性质。\n- 您已商定并确定迁移到生产环境所需的时间——并在至少一次演练中验证了其可行性。\n\
  - 您已制定回滚计划。没有人希望数据迁移失败，但事实是某些数据迁移确实会失败或花费的时间超过预期和利益相关者可接受的时间。因此，省去头痛并确定在迁移无法签署的情况下您将采取什么措施。\n\
  - 您已向即将上线团队传达了数据迁移时间以及对任何系统停机的影響。\n\n## 提示\n\n阅读 Ahsan Zafar (CTA) 撰写的 *Salesforce\
  \ Data Architecture and Management*，以了解并完善您的数据迁移策略、计划和执行的细节。\n\n您现在已将数据迁移到 Salesforce，并希望继续培训用户并让他们开始使用\
  \ Salesforce 为客户、合作伙伴和员工提供更好的体验。\n\n在让用户进入 Salesforce 之前，让我们进行一次最终的质量检查。\n\n## Signing\
  \ off to go live\n\n当您可以勾选以下项目时，您就可以让用户在 Salesforce 中上线：\n\n- 用户验收测试已成功完成。\n- 您的\
  \ Salesforce 解决方案已部署到生产环境并已验证。\n- 迁移到 Salesforce 的数据已由 IT 团队和即将上线的业务利益相关者双方验证。\n\
  - **User training** 已完成，面向即将上线的人员。为了最大限度地减少对业务运营的干扰，培训有时会与部署和数据迁移并行进行。我们将在 *Chapter\
  \ 10, Communicating, Training, and Supporting to Drive Adoption* 中介绍用户培训。\n- 您的用户已为您的\
  \ Salesforce 生产组织 **provisioned**。\n\n做得好！您已完成发布部署和将数据迁移到 Salesforce 的工作。\n\n让我们总结本章！\n\
  \n## Summary\n\n在本章中，您涵盖了大量内容。我们首先指导您完成发布阶段的关键活动和里程碑。接下来，我们介绍了通过环境部署 Salesforce\
  \ 解决方案的规划和步骤。\n\n您学习了如何执行 SIT 和 UAT，以确保您的解决方案从头到尾按预期工作，并得到目标终端用户代表的认可。最后，我们介绍了如何评估您迁移数据到生产环境的准备情况，并提供了上线检查清单。\n\
  \n在将 Salesforce 解决方案部署到生产环境后，您现在可以培训终端用户以确保他们成功，并与他们沟通和提供支持，帮助他们学习使用您的解决方案。更多内容将在\
  \ Salesforce 实施的下一章中介绍。\n\n\n"
- "## 沟通、培训与支持以推动采用\n\n在本章中，我们将重点关注准备您的 **变更管理计划模板**，以及规划您的 **推广** 活动分为 **阶段** 或 **波次**。作为此过程的一部分，您将重申随着\
  \ Salesforce 解决方案取代现有工作方式而发生的变化——并准备组织赋能计划来管理这些变化。我们将介绍各种培训模式以及使用每种模式时需要考虑的问题。然后，我们将介绍如何在上线后初期提供超配支持，以及如何以及何时过渡到生产支持运营。接下来，我们将讨论如何监控和推动采用。最后，我们将探讨如何开始评估和比较所实现收益与原始商业案例。\n\
  \n您将学习如何为推广设计变更管理和培训计划。然后，您将学习如何为使用您解决方案上线的人员提供高效的超配支持，以及如何监控和推动采用。\n\n我们将跟随我们的案例公司，**Packt\
  \ Manufacturing Equipment (PME)**，观察其 Salesforce 解决方案推广的进展。\n\n到本章结束时，您将了解需要计划和执行的关键活动，以确保通过让用户在\
  \ Salesforce 中工作来释放业务价值。\n\n本章将涵盖以下主要主题：\n\n- 规划、沟通和管理变更\n- 提供超配支持和管理生产支持\n- 监控和推动\
  \ Salesforce 解决方案的采用\n\n开始吧！\n\n## 规划、沟通和管理变更\n\n简而言之，以下活动的目的是确保您希望通过在 Salesforce\
  \ 上的投资实现的业务价值得到释放、实现并最大化。\n\n开始吧！\n\n### 了解即将到来的变更规模\n\n在 *第 3 章*、*确定如何交付您的 Salesforce\
  \ 项目* 中，在项目的预开发阶段，您已确定将因您的 Salesforce 解决方案而受到变更影响的参与者。自那以后发生了很多变化。您已完成预开发和开发阶段，许多假设和假设性流程和解决方案可能已经改变——以更好地适应您的业务需求。\n\
  \n在开发阶段，您理想中应该做的是与 **业务变更顾问** 合作，以确定新解决方案和流程与当前工作方式有何不同，以及对谁不同。\n\n以下是 Salesforce\
  \ 解决方案实施时受变更影响的典型利益相关者：\n\n- 终端用户\n- 终端用户经理\n- 地方组织的领导层\n- 全球领导层\n- 应用管理员工\n- 数据、BI、报告和分析员工\n\
  \n在您确定了将受变更影响的利益相关者后，让我们继续前进并为即将到来的变更做好准备！\n\n### 准备您的变更管理计划模板\n\n传统上，上线是指用户首次登录\
  \ Salesforce 生产环境并在其中执行工作的时点。\n\n但这有什么价值呢？不一定有。上线本身并不等于采用，也绝不保证对您解决方案的最佳、正确使用。\n\
  \n上线的传统定义在语义上可能是准确的，然而，从变更管理和业务价值的角度来看，您的大多数未来终端用户从未见过或使用过您的解决方案，也不知道您解决方案的功能、局限性和潜力。\n\
  \n随着您推广解决方案，利益相关者的变更将会发生。确保您在变更发生前制定管理计划。保持计划简单，并在从推广中学习时进行更新。\n\n在图 10.1 中，您可以看到需要考虑和规划的上线众多活动，以便使入职和变更之旅尽可能顺利——最终收获\
  \ Salesforce 投资的收益。顶部数字代表相对于上线的周数：\n\n![](img/307881206539c45e128c538a4b6912f8_245_0.png)\n\
  \n图 10.1 – 相对于上线的变更管理活动\n\n让我们逐一介绍每个活动：\n\n- **评估变更准备度**：与来自不同利益相关者群体的有限人数进行访谈，以评估他们对改变到新系统中的新工作方式的情绪、准备感以及兴奋或担忧程度。根据评估结果，启动适当行动并相应沟通。\n\
  \n**提示**\n\n请查阅来自 **The Salesforce Way** 的 *Salesforce 变更准备度评估* 文档，网址为 https://www.salesforce.com/content/dam/web/en_us/www/documents/services/the-salesforce-way-change-readiness-assessment.pdf。\n\
  \n- **沟通变更**：为上线用户组（群）的背景创建沟通计划。您应与当地领导层互动，以了解影响组织的环境和情况——同时参考您的变更准备度评估结果：\n  -\
  \ 您的沟通计划应包括向 *谁* 沟通 *什么*、*何时* 沟通以及来自 *哪个发送者*（理想情况下为当地领导层或 **变更代理**，也称为 **倡导者**）。以下是您可以沟通的一些示例：\n\
  \    - *培训前*：在不过度承诺的情况下营造兴奋感，同时管理期望。\n    - *培训期间*：培训课程中的关键顿悟喜悦时刻。\n    - *培训后*：\n\
  \      - 用户的成功案例。提示例如“您知道您可以在 Salesforce 中执行或查看此操作吗？”\n      - 如果您已配置或启用了其中任何一项，则提供\
  \ Salesforce 生产力提示——**电子邮件模板**、**快速文本** 或 **宏**。\n      - 对报告的错误/请求的新功能作出回应。\n \
  \     - 关键采用指标，例如按终端用户组划分的最高和最低采用率。\n  - 在沟通中，保持营造兴奋感和管理期望之间的健康平衡——人是复杂的存在，能够同时持有多种感受：恐惧、兴奋、渴望变革，同时也对其产生抵触。\n\
  \  - 请记住您在 *第 1 章*、*为您的 Salesforce 项目创建愿景* 中建立的 Salesforce 项目的目的和愿景。\n\n在您的沟通中，持续为用户组回答这个关键问题：“*对我有什么好处？*”\n\
  \n**重要说明**\n\n确保与 *所有* 利益相关者群体沟通——并根据每个群体量身定制沟通内容，并使用最合适的渠道（即沟通渠道）。\n\n将您的利益相关者代表与业务变更顾问以及采用和沟通专家召集在一起，为每个利益相关者群体创建\
  \ **基于角色** 的沟通内容。这将使您更好地理解和共情利益相关者，并制定针对性、相关且有效的沟通内容以实现最大影响。\n\n- **规划推广**：这包括根据\
  \ Salesforce 解决方案涉及的角色识别个人用户，以及执行 *图 10.1* 中所示活动所需参与的所有资源。您需要规划活动的时机，以确保每个人都可用。请注意任何语言方面的考虑。\n\
  - **管理赋能**：管理层的赋能和认可对推广的成功至关重要。您应使管理者能够应对其团队成员在推广和 Salesforce 解决方案使用过程中可能遇到的抵触和担忧。这包括向管理团队教育\
  \ Salesforce 解决方案的目的和功能，以及处理可能出现的任何普遍的变革恐惧——以及管理者如何帮助缓解它。初始培训后，用户经理是帮助支持和鼓励使用您解决方案的关键。\n\
  - **组织（再）设计**：在本节开始时，您已确定将受变更影响的利益相关者。变更的程度取决于 Salesforce 解决方案的性质：\n\n- 您的解决方案将要求员工使用新系统（Salesforce）。此变更可通过充分培训来管理（我们将在下一节中介绍）。\n\
  - 然而，如果您的新解决方案要求用户以新的方式（就流程而言）工作，与以往截然不同，并且更侧重于增值活动而非基础的数据录入和更新，则此变更可能需要员工可能拥有也可能不拥有的新技能和能力——并且他们对获取这些技能的易感程度可能高也可能低：\n\
  \  - 识别当前员工能力方面的差距并制定必要的培训计划（非 Salesforce）。\n  - 更新职位描述，确保未来招聘时考虑到这些职位所需的新技能。\n\
  \  - 对于任何当前不具备未来所需技能且不易获得这些技能的员工，制定重组计划，为他们在组织内部寻找替代机会。\n- **变更推动者招募与赋能**：如前所述，您应在整个\
  \ Salesforce 项目中让终端用户代表参与——以了解他们的情况并设计和构建改善其日常工作的解决方案。利用和赋能**变更推动者**是帮助终端用户解答问题的绝佳方法——因为他们了解使解决方案按其方式运作所考虑的因素。\n\
  \n## 重要说明\n\n尽早在项目中招募并赋能未来的变更推动者。如 *图 10.2* 所示，成为一名有效的变更推动者的旅程始于开发前阶段，并贯穿开发和推广阶段。\n\
  \n![](img/307881206539c45e128c538a4b6912f8_249_0.png)\n\n图 10.2 – 变更推动者的旅程\n\n-\
  \ **本地部署：** 如果您向多个地区推广，您可能决定创建一个“ MVP 模板”，该模板需要修改后才能用于本地使用。这通常包括以下内容：\n  - **用户和本地化设置：**\
  \ 设置以下方面的配置：\n    - **用户管理与访问：** 本地 **角色层级**、**队列**、**公共组** 和 **共享规则** 配置、本地货币设置，当然还包括使用当前\
  \ **配置文件** 和 **权限集** 以及用户区域设置创建和配置用户。\n    - **本地化：** 您可能创建了一个允许支持 *某些* 流程变异的解决方案。这可能需要本地配置，例如\
  \ **自定义设置** 和/或 **自定义元数据类型** 记录来保存参考配置数据以及翻译。\n  - **本地集成：** 如果您的本地组织拥有独立的后端系统或其他需要与\
  \ Salesforce 集成的系统，您需要在 Salesforce 项目的开发阶段就开始对此进行分析。\n  - **数据迁移：** 如果您向不同的本地组织推广，您需要为每次推广创建并协调数据迁移计划。\n\
  \n我们将在以下章节中介绍 *图 10.1* 中显示的剩余活动——**培训用户**、**提供超期护理**、**提供支持** 和 **监控并推动采用**。\n\n\
  本章中 Salesforce 项目的许多活动都是并行进行的，因此请保持所有工作同时推进以实现目标。一位智者曾说过，“perfect planning prevents\
  \ poor performance”，这对于推广来说绝对适用。\n\n让我们深入了解如何分阶段推广！\n\n## 分阶段推广您的 Salesforce 解决方案\n\
  \n虽然您可以为进一步的推广重用变更管理模板的许多元素，但您需要为推广的每个 *波次* 执行所有活动。因此，将一些本地组织分组或聚类到一个 **推广波次** 中是合理的。\n\
  \n分阶段推广方法有很多好处，但在选择时有一些重要的考虑因素。选择分阶段推广方法的主要后果是 **并行系统**。让我们先考虑在推广阶段可能需要并行系统的关键原因：\n\
  \n- 您的初始 Salesforce 版本（MVP）不支持遗留系统当前涵盖的所有功能\n- 不同地区将在不同时间点推广您的 Salesforce 解决方案，导致不同地区使用不同的系统\n\
  - 不同职能用户组（营销、销售和客户服务）将在不同时间点推广您的 Salesforce 解决方案，导致不同职能用户组使用不同的系统\n\n可能有许多原因和情况需要您保持两个系统同时运行。无论原因如何，并行运行可能产生以下影响，具体取决于\
  \ Salesforce 解决方案的性质和推广计划：\n\n- 同时使用两个系统的用户意味着他们将在两个系统中更新和输入新数据，导致数据不同步：\n  - 这可以通过定期进行增量数据迁移或（如果在经济上可行）在两个系统之间创建临时集成来缓解，直到旧系统可以退役：\n\
  \    - 有时旧系统仍可访问但处于只读状态，以便用户在需要时可以参考遗留数据。如果采用这种方法，应将其限制在上线后的短时间内。\n- 另一个考虑因素是与第三方系统集成的可行性：\n\
  \  - 新的 Salesforce 系统和遗留 CRM 是否可以同时与其他系统集成？\n  - 如果不能，选择 Salesforce 还是遗留 CRM 连接到第三方系统是一个重要的决策。\n\
  \n在图 10.3 中，您可以看到我们的示例公司 PME 如何选择分阶段推广其 Salesforce 解决方案：\n\n![](img/307881206539c45e128c538a4b6912f8_252_0.png)\n\
  \n图 10.3 – 分阶段推广与持续改进重叠的示例\n\n*PME 决定最初仅在一个国家上线——试点国家。*\n\n*其方法有三个主要优势。首先，项目团队计划和执行所有推广活动所需的努力更少（第一个国家使用该解决方案的人数较少）。其次，它允许项目团队收集有关解决方案的宝贵反馈，可用于在\
  \ Salesforce 项目进入持续改进阶段时确定变更的优先级。第三，项目团队可以测试变更管理和推广计划——并可在进一步推广之前据此进行优化。*\n\n*随着\
  \ PME Salesforce 项目团队向试点国家推广，他们优化其方法以使其工业化——使他们能够以递增的波次加速推广，每波次涉及的国家更多。*\n\n## 提示\n\
  \n与您公司的领导团队或 **项目管理组织（PMO）** 保持一致，以了解哪些限制或并行项目或举措可能会影响您希望推广的本地组织。在准备分阶段推广计划时纳入这些考虑因素。\n\
  \n此外，您应与本地组织的领导密切合作，以协调并确认其组织的变更管理和推广计划。\n\n让我们更仔细地看看用户培训！\n\n## 培训您的用户\n\n用户培训是\
  \ Salesforce 项目中的一个关键里程碑——如果您已为即将到来的变更很好地准备了利益相关者，那么最终能够使用 Salesforce 可以成为庆祝的理由！\n\
  \n培训是需要投入最多努力且在短时间内具有最大影响潜力的变更管理活动，因此请确保相应地计划和优先考虑它。\n\n在下表中，您可以比较不同的培训方法，以考虑哪种方法最适合您的\
  \ Salesforce 项目：\n\n| 培训方法 | 培训类型 | 准备工作量 | 效果 | 适用用途 |\n|---|---|---|---|---|\n\
  | 直接面对面培训 | 讲师主导 | 高 | 高 | 初始终端用户培训 |\n| 直接虚拟培训 | 讲师主导 | 中 | 中 | 面对面培训的更便宜替代方案。适合培训支持角色（BI/报告人员、人力资源和财务）。\
  \ |\n| 培训培训师 | 讲师主导 | 中 | N/A | 在直接终端用户培训之前并与其结合使用 |\n| 同伴互助 | 同伴主导 | 中 | 高 | 直接终端用户的绝佳方法\
  \ |\n\n\n\n\n| 培训 |  | （尚不可扩展） |  | 培训跟进以及为培训新员工和角色变动的员工 |\n|---|---|---|---|---|\n\
  | 培训视频 | 在线学习 | 中等 | 中等 | 直接面向终端用户培训的补充 |\n| Salesforce Trailhead | 在线学习 | 低 | 中等\
  \ | 适用于您的 Salesforce 管理员和生产支持人员 |\n| Salesforce MyTrailhead | 在线学习 | 高 | 中等 | 直接面向终端用户培训跟进以及培训新员工和角色变动员工的绝佳方法\
  \ |\n| 应用内指导 | 在岗培训 | 低/中等 | 中等 | 直接面向终端用户培训的补充 |\n\n表 10.1 – 常见培训方法及适用用途\n\n利用培训师培训模式，结合直接面向终端用户的培训，可以加速培训，因为它允许您同时开展多个培训课程。\n\
  \n## 重要说明\n\n- 人们对学习方法的偏好各不相同，因此在培训计划中应包含多种培训方法。\n- 如果您向从未使用过的人推出 Salesforce 解决方案的初始版本，则必须提供一种直接面向终端用户的培训形式或其他形式。\n\
  - 无论您选择哪种培训方法，都需要确保本地领导出席培训课程。您 Salesforce 项目的执行赞助人（或另一名高级管理人员）应在进行系统培训之前介绍新 Salesforce\
  \ 解决方案的愿景和目标。\n- 如果您在培训方法组合中包含视频，请确保保持简短（~30-120 s），让每个视频涵盖端到端流程中的小步骤。\n- 您可以考虑为每个角色创建一页纸文档（有时称为\
  \ **速查表**），列出关键主题培训领域。\n- 确保建立培训材料治理流程，以便随着解决方案的演进不断更新这些材料。\n- 确保为未来的 Salesforce\
  \ 管理员和更广泛的 IT 组织规划并执行培训：\n  - 这包括应用程序管理员工，以及数据、BI、报告和分析员工。\n  - 为未来的 Salesforce\
  \ 管理员和应用程序管理员工提供 Salesforce 管理以及您 Salesforce 解决方案范围内的云的培训，并鼓励和支持他们获得认证。\n  - 在初始版本中将解决方案移交给您的应用程序管理员工。除了解决方案支持的流程外，还要关注所需的用户管理和维护。\n\
  \n接下来，我们将介绍培训和上线后如何支持您的用户！\n\n## 提供超护理并管理生产支持\n\n用户培训后的时期至关重要且脆弱。因此，需要提高支持水平，以便能够快速响应终端用户面临的问题和疑问。这一阶段称为\
  \ **超护理** – 让我们深入了解！\n\n### 提供超护理\n\n超护理既是您 Salesforce 项目中的一个阶段，也是其能力之一。\n\n让我们将其能力分解为各个部分：\n\
  \n- **超护理流程：** 当您的用户开始在 Salesforce 中工作时，他们可能会遇到困难、面临问题，并需要超出您提供的培训和培训材料的进一步帮助。务必告知用户应遵循的获取帮助流程。它可能与您在\
  \ SIT 和 UAT 中使用的流程类似，因此可将其作为起点。\n- 根据您的设置和可用资源，您需要确定超护理流程中涉及哪些层级。请要求终端用户在提交错误时说明优先级/严重程度，以便您的超护理团队据此优先处理：\n\
  \  - 根据您的项目设置以及与实施合作伙伴的合同，为每个定义的严重程度定义具体的 **服务等级协议 (SLA)** 可能很有帮助，以便终端用户知道预计何时审查和/或解决其错误。\n\
  - 您希望用户使用预定模板提交问题（潜在错误）（请回顾 *推动您解决方案的 UAT* 部分的 *第 9 章*，《部署您的版本和将数据迁移到生产环境》）。\n-\
  \ 同样，您还应制定用户如何沟通新想法或变更请求的流程：\n  - 根据组织的成熟度和终端用户的情况——即他们是否难以区分错误和变更请求——您可以选择只提供一个模板供他们提交错误和变更请求。\n\
  - **超护理人员：** 接收提交的错误的人员可能有所不同；可能是您实施合作伙伴的 *业务分析师*，您自己的 *Salesforce 应用程序管理团队*，或您的\
  \ *产品负责人*。想法应由您的产品负责人接收和审查，结果应反馈给报告人。以下是超护理中的不同职责以及负责修复合格且已优先处理的错误的角色：\n  - 您需要有功能顾问、开发人员和\
  \ QA 专家可用（每种至少一人）——每种资源的数量取决于您 Salesforce 项目的性质和规模。\n  - 您需要让您的 PO(s) 完全可用——对于上线\
  \ Salesforce 解决方案的每个业务领域各配备一名。\n  - 最佳实践还包括在修复需要更复杂的解决方案重新设计时，有架构师（或至少一名）可用。\n-\
  \ **超护理系统：** 您还应确定用户应使用什么系统提交错误和想法：\n  - 对于错误报告，您可以使用 Salesforce `Cases`（这需要配置以适应您的组织和流程）或您的服务台票务系统。重要的是，经过分类需要解决的错误应注册并在您用于管理开发活动的系统中跟踪——例如，*Jira*\
  \ 或 *Azure DevOps*。\n  - 对于新想法，您可以利用 Salesforce 的 `case` 对象（需要配置以适应您的组织和流程），该对象允许用户在\
  \ Salesforce 中创建 Case 记录，以便您评估和响应。\n- **超护理数据**: 从这些系统中，您应监控和分析错误和想法的数量、趋势和解决情况。\n\
  \n### 提示\n\n与其痴迷于孤立的用户反馈、批评和变革阻力，不如对用户反馈采取平衡的方法；注意有效的关切和改进建议——重要的是——*耐心且富有同理心地回应所有用户反馈！*\n\
  \n随着您将 Salesforce 解决方案推广到更多用户，您的组织和实施合作伙伴在超护理期间支持新用户的能力将不断提高。\n\n在介绍了超护理是什么以及如何执行之后，让我们讨论如何以及何时过渡到持续支持！\n\
  \n## 过渡到持续生产支持\n\n超护理比常规的持续生产支持更昂贵。因此，在超护理错误开始减少后，可能会诱使您迅速过渡到生产支持。\n\n回顾上一章中我们对成功推广的定义——以最大化您在\
  \ Salesforce 上的投资价值：\n\n成功推广阶段应定义为您的组织、客户/合作伙伴和用户使用并从 Salesforce 解决方案中获得价值，并且它实现了您在\
  \ *第 4 章，获取资金并与 Salesforce 和实施合作伙伴合作* 中概述的目标业务成果的时刻。\n\n在决定从超护理过渡到持续生产支持之前，您应考虑以下四个要点：\n\
  \n1. 您是否已 *定义并协调* 持续生产支持的流程，并为其分配了足够的资源——与您的 Salesforce 解决方案的性质、所需维护以及使用该解决方案的用户数量成比例？\n\
  \n2. 负责持续生产支持的 *团队* 是否…：\n   - 将是内部团队还是由外部合作伙伴作为托管服务提供？\n   - 已接受您 Salesforce 解决方案的培训？\n\
  \   - 已加入错误和想法流程？\n\n### 重要说明\n\n您分配给超护理的团队可能包括 Salesforce 解决方案开发团队中的一些成员。他们是 Salesforce\
  \ 解决方案的专家，因此是重现错误、排除故障和修复错误的最佳和最快人员。如果过早过渡，很可能其中一些资源将被分配到其他项目。\n\n3. 您是否达到了 *采用*\
  \ 目标？\n   - 关键的是，在考虑过渡到持续生产支持之前，请先阅读下一节。\n\n4. 您是否开始实现您在 Salesforce 项目商业案例中概述的 *业务成果*？\n\
  \n除非您能自信地对全部四个要点都大声说出 *是！*，否则您应犹豫是否从超护理过渡到持续生产支持。\n\n接下来，让我们转向重要的采用主题！\n\n\n\n##\
  \ 监控并推动 Salesforce 解决方案的采用\n\n与提供超级关怀和支持并行，您应密切监控并尝试了解 Salesforce 解决方案的采用情况。\n\n\
  正如上一节中 *第 4 点* 所提到的，在达到采用目标之前，不应考虑从超级关怀过渡到持续生产支持。为什么不呢？如果您的解决方案在推出阶段的超级关怀阶段未被采用，您如何确保之后会被采用，其责任又在谁？当您的项目进入持续改进阶段时，许多利益相关者的关注点将转向新功能开发，而您的推出/本地部署团队则需为下一波做准备。\n\
  \n出于这些原因，我建议您——作为 Salesforce 实施的负责人——扩大超级关怀的范围，以及何时结束。\n\n让我们超越简单的定量错误报告和登录指标！\n\
  \n## 定义和衡量采用\n\n根据牛津学习词典，动词 **adopt** 在采用方法上下文中的含义如下：\n\n> *“Adopt something to\
  \ start to use a particular method or to show a particular attitude towards somebody/something.”*\n\
  \n我们可以将该定义翻译为 Salesforce 上下文中的以下内容：\n\n> *“Enabling users to perform work in Salesforce\
  \ and to perceive it to be a valuable improvement for their work life.”*\n\n让我们将定义进一步拆分为其两个部分，以及在\
  \ Salesforce 上下文中您可以衡量和跟踪采用的一些关键方式：\n\n1. **在 Salesforce 中执行工作**：您需要跟踪预期用户是否在使用您的解决方案——以及效果如何。这涉及跟踪两个参数：\n\
  - Logins:\n  - Daily, weekly, and monthly\n- Usage:\n  - **Efficiency**: The number\
  \ of records created – for example, **Leads**, **Opportunities**, **Cases**, and\
  \ **Tasks** measured per timeframe (hour, day, or week).\n  - **Effectiveness**:\
  \ This could include the number of converted **Leads**, **Opportunities** closed\
  \ (won/lost), and **Cases** closed per timeframe (hour, day, or week).\n\n### 提示\n\
  \n对您相关的具体指标取决于 Salesforce 解决方案的性质以及其预期面向的用户（或客户和合作伙伴）。与您的变革和采用顾问合作，以确定适合您的指标。您可以使用\
  \ Salesforce Labs 提供的免费 Salesforce 采用仪表板衡量和跟踪（大部分）定量的、客观的采用指标：\n\nhttps://appexchange.salesforce.com/appxListingDetail?listingId=a0N30000004gHhLEAU\n\
  \n2. **认为 Salesforce 是有价值的改进**：采用的同义词是 *embracing*。您应尝试了解用户对您的 Salesforce 解决方案的感受以及他们拥抱该解决方案的程度。\n\
  一些很好的方法包括调查和访谈：\n\n### 1. Survey:\n- i. Ask your users the classic **Net Promoter\
  \ Score (NPS)** question, “How likely are you to recommend using Salesforce to one\
  \ of your colleagues?” or a variation, “How likely are you to recommend using Salesforce\
  \ to someone in your network?”\n- ii. Ask for comments – for example, “What’s the\
  \ best thing and the worst thing about the solution?”\n- iii. Ask whether they have\
  \ noticed any improvements in the solution lately.\n- iv. Use the end of the survey\
  \ as an opportunity to remind your users how they can get help, report bugs, or\
  \ make suggestions.\n\n### 提示\n\n对您调查回复的趋势将提供极好的洞察。在上线后最初几个月每周发送调查，然后每 1-3 个月一次。\n\
  \n### 2. Interview:\n- i. As many facets and factors influence a quantitative measure\
  \ of adoption and the answers to surveys, you should try to understand what the\
  \ underlying reasons may be.\n\n### 提示\n\n并非所有人在系统出现问题时都愿意提交错误。这仍然会损害他们的采用；您只是不知道。为避免这种盲点，请确保您定期（在超级关怀期间每天）检查任何\
  \ **Flow Error** 电子邮件（这些发送给最后修改流程的管理员的电子邮件或 Apex 异常电子邮件收件人）以及 **Apex Exception**\
  \ 电子邮件（您在 `Setup` 中设置接收这些电子邮件的电子邮件地址）。\n\n如果您收到有关页面加载时间或整体性能问题的投诉，请设置报告以跟踪关键指标，例如\
  \ **Experienced Page Time (EPT)**。请查看 *Measure Performance for Your Salesforce Org*\
  \ 帮助文章，其中描述了如何设置它，网址为 https://help.salesforce.com/s/articleView?id=sf.technical_requirements_measuring_ept.htm&type=5。\n\
  \n您应与您的执行赞助商、当地国家领导层和变革推动者分享采用指标。与您的变革和采用顾问合作，以确定行动和举措来帮助改善 Salesforce 解决方案的采用。\n\
  \n## 为采用设定目标并评估原始商业案例\n\n您的目标应该是拥有一个不仅被使用，而且被接受，甚至员工引以为傲的 CRM 系统。提供卓越的解决方案和用户体验不仅能提高员工满意度和留存率，对业务也非常有益！\n\
  \n现在，罗马不是一天建成的，但您应该开始看到关于 Salesforce 解决方案的积极情绪趋势。\n\n对于定量的、客观的使用指标，您需要将目标与您在 *第\
  \ 4 章，获得资金并与 Salesforce 和实施合作伙伴合作* 中作为原始商业案例一部分定义的 KPI 目标相关联。\n\n随着超级关怀的进展，您应该——在组织开始使用新系统导致性能初步下降之后——开始看到业务绩效改善。在上线后多久（例如\
  \ 1、3、6 或 12 个月）开始实现您在 Salesforce 项目商业案例中列出的业务成果，取决于解决方案的性质、您从中迁移的成熟度水平，以及当然，您是否\
  \ *按书本* 开展 Salesforce 项目。\n\n## 摘要\n\n阅读本章后——并制定了自己的变革管理和推出计划——您已为 Salesforce 项目的成功首次上线以及后续的成功推出做好了准备。您准备并执行了组织使能计划，以管理即将到来的变革规模。您确定了整体培训计划，并确定了将为用户提供的培训方法。您已了解如何在上线后提供超级关怀以及何时过渡到持续生产支持。最后，您已了解如何监控和推动采用，并开始评估收益与\
  \ Salesforce 项目原始商业案例的比较。\n\n在下一章中，我们将讨论在推出 Salesforce 解决方案时可能遇到的典型问题，以及如何减轻和克服它们。您还将获得一份检查清单，以评估\
  \ Salesforce 项目在推出阶段的状态。\n"
- "## 推出阶段应避免的常见问题\n\n前两章涵盖了 Salesforce 项目推出阶段的活动。在本章中，我们将讨论该阶段 Salesforce 项目中经常面临的一些常见问题。我们还将介绍减轻问题或完全防止其出现的策略。\n\
  \n在 *第 5 章*，*在预开发阶段应避免的常见问题* 中，您被介绍了 **root cause analysis**，我们将继续使用该方法来剖析常见问题。\n\
  \n在本章结束时，您将获得一套 **checklists**，以便在项目完成推出阶段时评估 Salesforce 项目的状态。\n\n本章将涵盖以下主要主题：\n\
  - 推出阶段的常见问题及其根本原因\n- 评估 Salesforce 项目的状态\n\n让我们开始吧！\n\n## 推出阶段的常见问题及其根本原因\n\n让我们开始通过鱼骨图来查看一些最常见的无法推进或完成推出阶段的问题：\n\
  \n![](img/307881206539c45e128c538a4b6912f8_266_0.png)\n\n图 11.1 – 推广阶段常见问题的鱼骨图\n\
  \n让我们讨论每个常见问题的可能根本原因以及缓解和预防策略。\n\n## 在环境中部署和迁移数据时遇到困难\n\n在表 11.1 中，您可以找到项目在环境部署和数据迁移方面遇到困难的可能根本原因——以及如果您已面临该问题时的缓解策略：\n\
  \n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n| 部署和 SIT 可用资源不足。 | 提前确保所需内部和合作伙伴资源已分配并预订，用于他们预期参与的会议和活动，以执行部署和\
  \ SIT。 |\n| 部署、UAT 和数据迁移的规划和执行不足。 | 角色和职责的规划与对齐是成功部署、SIT、UAT 和数据迁移的前提。它要求您的 PM、BA、QA\
  \ 专家以及 **技术架构师 (TA)** 继续紧密合作。虽然您的 BA、QA 和 TA 应该了解执行所需的所有细节和应急方案，但确保所有相关资源保持一致、达成一致并了解各自职责是您\
  \ PM 的责任。在尝试将您的 Salesforce 解决方案部署到生产环境并迁移数据之前，请确保您拥有详细的部署计划/清单（即 Runbook）以及数据迁移计划。有关更多详细信息，请参阅\
  \ *第 9 章，部署您的版本并将数据迁移到生产环境*。 |\n| 对与您的 Salesforce 解决方案集成的系统进行更改或部署导致与您的 Salesforce\
  \ 部署冲突。 | 您可以通过了解组织内可能影响项目并导致与 Salesforce 解决方案产生依赖关系的其他举措来预防此问题。理想情况下，您的敏捷团队是一个\
  \ **跨职能团队**，具备与您的 Salesforce 解决方案相关的技术和系统方面的知识和专业技能。我们将在下一章进一步讨论跨职能团队。如果您发现自己正处于部署到\
  \ SIT、UAT 或——最坏情况——生产环境的中间阶段，您需要快速了解目标环境与较低环境相比有何不同。这最好由您的 Salesforce 技术架构师和 Salesforce\
  \ 集成开发人员，以及外部系统的相同角色，连同您的 QA 专家一起完成。通常，在确定冲突的技术根本原因时，解决问题的方案就会变得清晰。棘手的部分通常是识别根本原因，并且根据部署类型（SIT、UAT\
  \ 或生产环境），问题的严重程度不同。理想情况下，您在 SIT 中识别出问题（作为开发冲刺的一部分或开发后专门的 SIT），在这种情况下，您可以按照开头所述进行操作。同样，如果您正在部署到\
  \ UAT 沙盒（或执行 UAT）。不过，这里压力更大，因为用户通常会被分配并计划执行 UAT，随后进行培训。这意味着您需要快速了解修复需要多长时间，并评估是否需要更改计划。如果您正在部署到生产环境，您需要评估修复时间是否会影响您整体的部署和数据迁移计划——最终影响您的上线日期。\
  \ |\n| 您未能制定可靠的数据迁移计划，也未执行任何（成功的）数据迁移演练。 | 这相当于在没有任何训练的情况下跑马拉松——或者更贴切地说——在未经测试的情况下将配置和代码投入生产。如果您已因此根本原因遇到数据迁移问题，您需要决定以下其中一种行动方案：\
  \ - 继续进行正在进行的数据迁移——存在巨大的不足风险——并且您将不得不花费大量时间和资源（金钱）在上线后执行大量数据补丁。 - 推迟您的上线和数据迁移，为您提供时间进行演练以完善您的数据迁移计划。\
  \ |\n\n> 根据经验，第二种选择在长期来看（几乎）总是更好的选择。\n\n表 11.1 – 在环境中部署和迁移数据时遇到困难的可能根本原因\n\n让我们来看推广阶段的下一个常见问题。\n\
  \n## 创建、获得支持并执行变更管理及推广计划时遇到困难\n\n在表 11.2 中，您可以找到 Salesforce 项目变更管理和推广遇到困难的可能根本原因——以及如果您已面临该问题时的缓解策略：\n\
  \n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n| 创建变更管理模板和沟通计划困难。 | 不要让完美阻碍了良好——从小处着手，尝试并在学习过程中调整和完善您的变更管理模板和沟通计划。\
  \ |\n| 您在 Salesforce 项目的商业论证中为变更管理分配的预算不足。 | 不幸的是，这比不常见更常见，因为许多组织将 Salesforce 实施视为\
  \ *购买标准 SaaS 系统的许可证并为用户配置权限*。这是一个危险的迷思。事实是，随着您在组织中推广 Salesforce，变革将会发生。您投入变更管理的努力和资源决定了成功程度的差异（最大化您的\
  \ Salesforce 投资价值）。最坏的情况是，您冒着组织无法支持变革并采用 Salesforce 的风险。如果您的组织认真对待 Salesforce 的实施和推广，请将项目视为\
  \ IT 和组织变革转型各占一半。 |\n| 规划推广波次困难。 | 尝试按用户数量、收入和数字化成熟度对国家进行分组或细分。从一个用户数量和数字化成熟度适中的试点国家开始，规模较小。然后，随着您能够工业化本地部署和数据迁移执行，并完善变更管理模板和沟通计划，按递增波次分阶段进行推广。请参阅\
  \ *第 10 章*、*沟通、培训和支持以推动采用* 中的 *分阶段推广您的 Salesforce 解决方案* 部分。 |\n\n表 11.2 – 创建、获得支持并执行变更管理及推广计划时遇到困难的可能根本原因\n\
  \n让我们跳到推广阶段的下一个常见问题。\n\n## 采用困难且业务绩效提升受阻\n\n在表 11.3 中，您可以找到 Salesforce 解决方案采用率低以及未能达到原始商业论证目标的可能根本原因——以及如果您已面临这些问题时的缓解策略：\n\
  \n| 可能的根本原因 | 缓解和预防策略 |\n|---|---|\n| 您的变更管理努力未能充分做到以下几点： - 激发并 *激励* 您的用户接受 Salesforce\
  \ 解决方案为他们带来的积极变革——体现在您 Salesforce 项目的愿景（为什么）中 - *缓解* 用户对 Salesforce 解决方案带来的变革的 *恐惧*。\
  \ | 从您的变更管理努力和推广过程中获得的见解中学习。以以下方式解决每个要点： 1. 调整您的变更管理方法和沟通方式，更侧重于 Salesforce 解决方案将为用户工作生活带来的改善——例如，它可能减少手工工作，让他们能够专注于更有刺激性、更有成就感（并创造价值）的工作。请参阅您在\
  \ *第 1 章，创建您的 Salesforce 项目愿景* 结尾处建立的愿景。 2. 坦诚地说明作为您 Salesforce 项目带来的变革的一部分需要进行任何重组变更，以及受影响人员如何转向公司内部或外部的其他角色。对于您正在培训并支持使用\
  \ Salesforce 的人员，请确保任何计划进行的重组已经完成。 |\n| 您的变更管理举措与管理相关 | 您迫切需要获得团队层级和领导层的支持并参与推广\
  \ Salesforce 解决方案。他们的参与应包括以下内容： |\n\n\n组织赋能未执行或未有效执行。\n\n- 1. 在培训课程和上线前，与员工的直接主管进行沟通。\n\
  - 2. 通过亲临现场并主持会议来引领变革，强调他们对拟议的 Salesforce 解决方案的支持。\n- 3. 让您的本地领导团队与您的团队、超护理团队和支持团队以及本地代理人一起参与，以了解他们组织对您\
  \ Salesforce 解决方案的采用情况及其感受\n\n您在开发阶段和 UAT 中未充分让用户参与，因此您未能确保良好的用户体验，从而使他们成为您项目和 Salesforce\
  \ 解决方案的倡导者。不幸的是，这在 Salesforce 项目中是一个常见问题。\n\n您需要做的是开始让用户参与并与用户互动。\n您的方法可以与下一条中推荐的方法类似——但与其经历孤立的抵制，您更可能看到广泛的抵制\
  \ pockets，您的努力和做法应反映这一点。\n\n您有一小部分用户抱怨并对您的解决方案评价不佳，而沉默的大多数用户认为它对工作生活是一个很好的改进。\n\n\
