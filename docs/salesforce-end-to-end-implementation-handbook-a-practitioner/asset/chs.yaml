  \ 一个经验法则是，如果您是一家中型或大型公司，并且贵公司目前依赖电子表格和电子邮件来管理销售和客户服务职能，那么投资 CRM——在充分考虑和变更管理的前提下——将是一项有益的投资。如果您的项目范围是对现有组织的扩展——例如\
