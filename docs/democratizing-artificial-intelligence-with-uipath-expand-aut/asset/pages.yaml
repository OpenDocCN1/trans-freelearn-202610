- pgno: 166
  md: '# Reviewing the types of extractors


    Based on the requirements of your use case, you may be drawn to use one or more
    of the following extractors available in Document Understanding:


    +   - **Regex Based Extractor**: This is a simple extractor that extracts data
    based on regular expression matches. This extractor is best for simpler use cases,
    where the targeted data field is in a standard, predictable format. While this
    extractor can support both text fields and table fields, it cannot be retrained.
    If there is variability in your target data fields (in format and context), then
    the Form or Machine Learning extractors may be better choices.


    +   - **Form Extractor**: This is another simple extractor that extracts data
    based on standardized documents. The Form Extractor relies on a defined template
    to identify and extract values based on page-level anchors. It is not recommended
    to use this extractor if there are many different layouts to handle or if the
    documents are skewed (rotated, curved, or multiple sizes). This extractor cannot
    be retrained.


    +   - **Intelligent Form Extractor**: This is built on top of the Form Extractor,
    providing extra features such as handwriting recognition, handwritten data extraction,
    and signature detection. The Intelligent Form Extractor is great for documents
    that are printed or handwritten, or for use cases that require validation of a
    signature. This extractor cannot be retrained.


    +   - **Machine Learning Classifier**: This leverages an ML skill deployed to
    UiPath AI Center to extract documents. This extractor is great for structured
    or semi-structured documents of varying layouts. It can be retrained with the
    *Machine Learning Extractor Trainer*.


    +   - **FlexiCapture Extractor**: This is built by ABBYY to extract documents
    based on ABBYY FlexiCapture definitions. This extractor can be found within the
    `UiPath.Abbyy.Activities` package.


    We’ll discuss further how to use some of these extractors in later sections and
    chapters.


    # Validating extractors


    Like classification, we may require human validation of extractor output with
    the use of the **Validation Station**. The use of the Validation Station is generally
    recommended to enforce 100% accuracy – it is always best to have a human perform
    a quick check before returning to automation.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'The Validation Station is available for both attended and unattended automation
    through the use of the Present Validation Station activity for attended, and the
    Create Document Validation Action and Wait for Document Validation Action and
    Resume activities of UiPath Action Center.


    When presented with the Validation Station, the user will have the ability to
    review and correct extractions performed by automation. In the Validation Station,
    the user can rotate pages, validate document types, and validate extractions performed
    by an extractor (Figure 6.34):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_167_0.png)


    Figure 6.34 – The Validation Station


    With our extraction validation completed with the Validation Station, we can leverage
    our human validation to retrain and strengthen the classifiers used. In the next
    section, we''ll discuss how to train extractors.'
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Training extractors\n\nSimilar to classification, we can close the feedback\
    \ loop and retrain our extractors after validation. This retraining model helps\
    \ improve the performance of our extractors for future executions. Training of\
    \ classifiers is performed through the Train Extractors Scope activity. Within\
    \ the Train Extractors Scope activity, let's cover the Input parameters present:\n\
    \n+   - **Document Path**: The full path to our target document\n+   - **Document\
    \ Text**: The document text returned from digitization\n+   - **Document Object\
    \ Model**: The DOM returned from digitization\n+   - **Human Validated Data**:\
    \ The Validation Station results\n\nThe following extractors are retrainable:\n\
