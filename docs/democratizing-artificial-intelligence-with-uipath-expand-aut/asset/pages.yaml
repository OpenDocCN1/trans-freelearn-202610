    needed.


    With our model trained and evaluated, we can now deploy it into a skill usable
    with **robotic process automation (RPA)**. Proceed as follows:


    +   1. Navigate to **ML Skills** by clicking the **ML Skills** tab in the project
    dashboard.

    +   2. Click **Create New** to create a new ML skill, selecting the following:


    +   - **Name:** `Email_Spam_Classification`

    +   - **Choose Package:** `TextClassification`

    +   - **Choose package major version:** 6

