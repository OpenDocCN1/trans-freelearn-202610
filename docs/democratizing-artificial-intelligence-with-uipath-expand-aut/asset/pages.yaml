- pgno: 214
  md: '# Understanding the current state


    Before we jump into designing or building the use case, we need to understand
    the current state of the process. Every day, the Time and Expense (T&E) team of
    Company ABC needs to manually review receipts submitted from the business travels
    of their colleagues. As the T&E team reviews these receipts, they check them against
    their expense management tool to ensure that the employee submitted the expense
    report correctly. The following are the rules set by the T&E team (Figure 8.5):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_214_0.png)


    Figure 8.5 – The high-level process flow


    Reviewing the high-level process flow, the T&E team automatically receives expense
    reports once they are submitted by the employee. It is then up to the T&E analyst
    to open the report and check each expense and receipt for completeness and accuracy.
    If the report is accurate, the analyst can forward the report to the employee''s
    manager for final approval.


    Company ABC has a lot of employees that need to regularly travel, and the company
    has recently been hiring more employees, so the number of expense reports and
    receipts that the T&E team has to review is ever increasing. The T&E team has
    a turnaround time of 2 days, meaning they can review and approve an expense report
    2 days after it has been submitted by an employee.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Looking at the current state, there appears to be plenty of opportunity for
    automation – reverting to the characteristics of an automation opportunity from
    Chapter 4, Identifying Cognitive Opportunities, we can see that this automation
    opportunity has the following characteristics:


    +   - **Manual interactions with applications:** T&E analysts have to manually
    interact with the expense management tool.

    +   - **Repetitive in nature:** T&E analysts have to perform the same series of
    steps for each expense and receipt.

    +   - **Is time-consuming:** Reviewing individual receipts can be time-consuming
    for an analyst to perform.

    +   - **Is rule-based and structured:** The rules surrounding expense reports
    are mostly structured.


    The only area of concern with this process is with the receipts themselves, as
    receipts aren’t very structured and can vary from vendor to vendor. These points
    align with the characteristics of a cognitive automation opportunity also discussed
    in Chapter 4, Identifying Cognitive Opportunities:


    +   - High variability

    +   - Unstructured data


    However, from a feasibility standpoint, we can easily create automation that handles
    receipts for the T&E analyst with UiPath Document Understanding. Also, from a
    viability standpoint, automating portions of this process for these analysts can
    provide the following benefits:


    +   - **Increased throughput:** Implementing automation in the process can allow
    the analyst to complete reviews more quickly, reducing the 2-day turnaround time.

    +   - **Increased capacity:** Implementing automation in the process can allow
    the analyst to complete more reviews, allowing the team to absorb the increased
    volume of expense reports without having to increase the team size or increase
    the turnaround time.

    +   - **Error reduction:** Implementing automation can reduce errors made during
    manual review, minimizing the risk of approving an invalid expense.


    Automation within this process can provide a great deal of impact for the T&E
    team. While there are many areas of opportunity, for this use case, we will focus
    on the receipt portion of the process. In the next section, we will focus on creating
    a future state design for implementing automation to process receipts.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Creating the future state design


    When we look at the high-level design of the current state, there looks to be
    several automation opportunities that we can create future state automation for
    (Figure 8.6):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_216_0.png)


    Figure 8.6 – Automation opportunities with the expense report review process


    It appears that most of the steps taken by the T&E team in the process could potentially
    benefit from automation, through a mixture of automation ideas that hand off information
    to each other. However, since we want to focus on Document Understanding with
    this use case exercise, let''s only focus on the steps of the process that appear
    between Open Report and Send back to employee in case of error (Figure 8.7):'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/05268897c8ac5d80eb3fead1cc8a822a_217_0.png)


    Figure 8.7 – The steps between Open Report and Send back to employee in case of
    error


    As we can see, within the steps of **Open Report** and **Send back to employee
    in case of error**, we can apply Document Understanding, especially in the **Note
    Receipt Details** task of the process. So, we will focus on creating a future
    state design for this task.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'In the future state of this automation, the analyst will be asked to continue
    manually, opening expense reports and downloading receipts as they have always
    done in the past; however, in the future state, they will launch automation that
    will read the contents of the receipts for them (Figure 8.8):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_218_0.png)


    Figure 8.8 – The high-level future state design


    For this use case, we are going to take an incremental approach to solving the
    pain points of the T&E team by using automation to read the contents of each receipt.
    By creating automation that can read receipts, we can tackle one of the tougher
    parts of the process, allowing us to expand to other tasks in the future, potentially
    automating the full end-to-end process through a series of automations.


    Double-clicking into the read receipts task that we are automating, there is one
    large requirement to square away before creating the final future state – the
    fields we need to extract from each receipt. In the current state of the process,
    the analyst needs to note and confirm the following fields:


    +   - Vendor Name

    +   - Receipt Date

    +   - Tax Amount

    +   - Total Amount


    These fields will become important as we build out the taxonomy of the use case,
    as we touched upon in Chapter 6, Understanding Your Tools.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'To summarize – as the future state design of this use case, the project we
    intend to build will be an **attended automation** that prompts the end user for
    a folder location of downloaded receipts. The automation will then read and extract
    the relevant information from each receipt using UiPath Document Understanding,
    exporting the data into an Excel sheet on the end user''s machine. The end user
    can then more quickly validate expense reports, as all receipts have been read
    and data has been gathered for the analyst.


