- pgno: 152
  md: 'With the Classification Scope activity introduced, let''s continue with the
    Classifiers Wizard region within the Classification Scope activity.


    # Introducing the Classifiers Wizard


    Within the Classifiers Scope, you will notice an area to insert different classifiers;
