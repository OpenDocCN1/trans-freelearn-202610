    With our package created, let''s investigate creating a pipeline that can train
    our deployed ML package.


    # Introducing pipelines


    With our ML package selected, we can now venture into ML pipelines. An ML pipeline
    is a series of steps taken to produce an ML model. During the pipeline process,
    we will provide input, and once completed, the pipeline will produce a set of
    useable output and logs.


    In AI Center, there are three types of pipelines:


    +   - **A training pipeline:** Produces a newly trained ML package version from
    an input ML package and dataset

    +   - **An evaluation pipeline:** Produces a set of metrics and logs from a newly
    trained ML package version and dataset

    +   - **A full pipeline:** A full data process pipeline, performing both training
    and evaluation pipelines


    # Creating a pipeline


    For this exercise, we will use our training and testing datasets to run a training
    and evaluation pipeline:


    +   1. Navigate to **Pipelines** by clicking the **Pipelines** tab in the project
    dashboard.

