- pgno: 265
  md: '# # Use Case 2 – Email Classification with AI Center


    A classic use for **machine learning (ML)** is text classification. Every organization,
    irrespective of the industry, has a use case for classifying text. Examples of
    text classification use cases include routing emails to corresponding folders
    or routing service requests to relevant teams. A lot of this work is still manual,
    requiring an individual to review the text and use their judgment to interpret
    and classify the text''s contents. Fortunately, with UiPath''s AI Center, we can
    create cognitive automation to apply intelligent understanding of text, potentially
    reducing the need for manual work.


    By having a full understanding of AI Center, we will work together to build cognitive
    automation that can interpret and classify text. As we build a use case, we will
    follow a similar development life cycle as outlined in the previous chapters.
    We will start with understanding the current state of our automation opportunity,
    then design the future state of the process with automation involved. Once the
    future state is designed, we will build automation with UiPath Studio and AI Center,
    test the solution to ensure stability, and finally deploy the automation into
    production.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'In this chapter, *Use Case 2 – Email Classification with AI Center*, we will
    cover the following topics as we build automation to process receipts:


