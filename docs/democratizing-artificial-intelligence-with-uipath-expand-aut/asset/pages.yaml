    Document Understanding.


    # Getting started with UiPath Document Understanding


    UiPath Document Understanding unleashes the capability to intelligently process
    documents with Robotic Process Automation. With Document Understanding, we''ll
    be able to digitize, classify, and extract data from PDFs, scanned documents,
    and even handwriting.


    In this section, we''ll learn about how to build Document Understanding use cases
    with the Document Understanding framework and the Document Understanding Studio
    template. We will lastly dive deeper into the activities or building blocks of
