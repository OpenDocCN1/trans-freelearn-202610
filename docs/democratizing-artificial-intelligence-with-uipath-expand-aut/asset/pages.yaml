    # Building the Main workflow


    Every automation project starts with a Main workflow. The purpose of the Main
    workflow is to kick off the project, invoking other workflows in the process.
    In this Main workflow, we are going to use a switch statement to switch between
    tasks passed by our chatbot. Proceed as follows:


    +   1. Open Main.xaml and create three arguments, as shown in the following screenshot:


    | Name | Direction | Argument type | Default value |

    |---|---|---|---|

    | in_Task | In | String | Enter a VB expression |

    | in_Email | In | String | Enter a VB expression |

    | out_SRNumber | Out | String | Default value not supported |

    | Create Argument |  |  |  |

    | Variables | Arguments | Imports |  |


    Figure 10.19 – Main arguments'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'The purpose of each argument is this:


    +   - `in_Task`: To input the type of task from the chatbot

    +   - `in_Email`: To input an email address from the chatbot

    +   - `out_SRNumber`: A random SRN we will output in the chatbot


    +   2. Add a **Log Message** activity, with `in_Task` as the message and `Info`
    as the log level.

    +   3. Add a **Switch** activity, with `in_Task` as the expression.

    +   4. Create a case called `Upgrade_AppY`, with an `Invoke` workflow calling
    the `Upgrade_App` workflow we just created.

    +   5. Create another case called `Password_Reset`, with an `Invoke` workflow
    calling the `Password_Reset` workflow we just created.


    The process is illustrated in the following screenshot:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_336_0.png)


    Figure 10.20 – Main.xaml workflow'
  merge: -1
