  md: '# Testing the use case


    With our chatbot and automation both published, we can finally start testing our
    automation! To test out the automation, go back into DruID and converse with your
    chatbot. Once you click on one of the options to either reset a password or upgrade
    an application license, you will notice DruID sending a notification that the
