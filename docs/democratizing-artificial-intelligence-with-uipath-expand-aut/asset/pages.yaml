    https://docs.uipath.com/activities/docs/present-classification-station#using-classification-station.


    With our classification validation completed with the Classification Station,
    we can leverage our human validation to retrain and strengthen the classifiers
    used. In the next section, we''ll discuss how to train classifiers.


    # Training classifiers


    One of the great features of the Document Understanding framework is the ability
    to close the feedback loop and retrain classifiers after validation. Leveraging
    human input is a great way for automation to teach itself and improve performance
    for future executions. The training of classifiers is performed through the Train
    Classifiers Scope activity, as shown in the following screenshot:'
  merge: -1
