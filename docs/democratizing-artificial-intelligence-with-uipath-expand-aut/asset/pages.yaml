- pgno: 209
  md: '# 8

    Use Case 1 – Receipt Processing with Document Understanding


    Every organization, irrespective of the industry, has a team that requires receipt
    processing. Examples of receipt processing can be seen in procurement teams to
    pay for services delivered, or in HR teams to review expenses submitted by colleagues
    during business travel. While the use for receipt processing may differ between
    these teams, one similarity is that processing the receipts is usually a manual
    and potentially error-prone task to perform. Fortunately, with UiPath''s Document
    Understanding, we can create cognitive automation to apply Optical Character Recognition
    (OCR) to read, classify, and interpret receipts to eliminate manual work.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'By having a full understanding of Document Understanding and the *Document
    Understanding framework*, we can work together to build cognitive automation that
    can interpret the images of receipts. As we build the use case, we will follow
    a similar development life cycle to that outlined in the previous chapters. We
    will start with understanding the current state of our automation opportunity
    and then design the future state of the process with automation involved. Once
    the future state is designed, we will build the automation with Document Understanding,
    test the solution to ensure stability, and finally, deploy the automation into
    production.


    In this chapter, we will cover the following topics as we build automation to
    process receipts:


    +   - Understanding the current state

    +   - Creating the future state

    +   - Building the solution with the Document Understanding framework

    +   - Testing to ensure stability and improve accuracy

    +   - Deploying with the end user experience in mind


    # Technical requirements


    All code examples for this chapter can be found on GitHub at `https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter08`.


    Working with UiPath is very easy, and with the Community version, we can get started
    for free. However, for UiPath AI Center, we will need an enterprise license. You
    can acquire a 60-day enterprise trial license from `uipath.com`.


    With the 60-day enterprise trial, we will have access to the following:


    +   - Five RPA Developer Pro licenses – named user licenses include access to
    Studio, StudioX, Attended Robot, Apps, Action Center, and Task Capture

    +   - Five unattended robots, five testing robots, and two AI robots

    +   - AI Center, AI Computer Vision, Automation Hub, Data Service, Document Understanding,
    and Insights


    For this chapter, you will require the following:


    +   - UiPath Enterprise Cloud (with AI Center)

    +   - UiPath Studio 2021.4+'
  merge: -1
  img_proc: true
- pgno: 211
  md: '+   - The `UiPath.IntelligentOCR.Activites` package v.4.13.2 or higher

