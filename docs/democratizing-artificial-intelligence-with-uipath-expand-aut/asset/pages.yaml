- pgno: 283
  md: 'With our ML skill deployed in AI Center, we can move on to connect it with
    automation by building out our automation workflows. By way of review, in this
    section, we created a project in AI Center, loaded our datasets, created an ML
    package, created a training and evaluation pipeline, and—lastly—deployed an ML
    skill.


    # Building automation workflows


    With our ML skill deployed, we can move our focus on to creating automation workflows
    for the use case. Approaching this use case, we will build our project in a few
    steps, as follows:


    +   1. Creating a project

    +   2. Building an ML workflow

    +   3. Building supplemental workflows

    +   4. Building the **Main** workflow


    After completing these steps, we will have the foundation of our project complete
    and ready for testing.


    # Creating a project


    For this project, we''ll create a flowchart workflow using the **Transactional
    Process** template (Figure 9.13) in Studio. To start a project with the **Transactional
    Process** template, complete the following steps:


    +   1. Navigate to the **Templates** tab of UiPath Studio.

    +   2. Choose **Transactional Process**.

    +   3. Name your project `Email Classification`, and provide a folder location
    to save the project to.

    +   4. Click **Create** to create a project and to get started.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'The **Transactional Process** template is illustrated in the following screenshot:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_284_0.png)


    Figure 9.13 – Transactional Process template


    As you open the `Main.xaml` file of our newly created project, you will be presented
    with the **Transactional Process** template, a flowchart designed for basic automation
    projects. Within the **Main** flowchart, you will notice several premade containers,
    as outlined here:


    +   - **Data Input:** The purpose here is to retrieve the data necessary for running
    the project. In our use case, we''ll use this sequence to retrieve emails.

    +   - **Have input?:** The purpose here is to check if input data exists. In this
    use case, we''ll use this Flow Decision to check if any new emails were retrieved.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '+   - **Transaction Processing**: The purpose here is to perform a set of actions
    for each transaction. In this use case, we''ll use this flowchart to read and
    classify our email.

    +   - **End Process**: The purpose here is to perform any closing activities.
    In this use case, we''ll start by leaving it blank, but we may use it for testing
    later.


    Once our project is created, click **Manage Packages** in UiPath Studio and add
    the following dependencies into the project:


    +   - `UiPath.MLServices.Activities`

    +   - `UiPath.WebAPI.Activities`


    That concludes creating a project. We''ll revert to the **Main** workflow in a
    later section where we build out the **Main** workflow, but for now, we''ll transition
    into building ML and supplemental workflows.


    # Building an ML workflow


    With the automation project created, we can focus on creating some supplemental
    workflows that''ll become building blocks of our **Main** workflow. In the ML
    workflow, our objective is to create a modular workflow sequence that takes an
    email body as input, passes it through our newly deployed ML skill, and returns
    the classification and confidence of the skill.


    To start, let''s create a new workflow, as follows:


    +   1. In the `Email Classification` project, create a new workflow file called
    `Classify_Email`.

    +   2. Once the new workflow is created, create three arguments, as illustrated
    in the following screenshot:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_285_0.png)


    Figure 9.14 – Classify_Email arguments'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The purpose of each argument is this:


    +   - `in_EmailText`: To input text from our email''s body

    +   - `out_Classification`: To output a classification text of Spam or Ham

    +   - `out_Confidence`: To output a classification double as a percentage of confidence
    of the classification


    Once the arguments are added to the workflow, we can start adding activities to
    the blank canvas.


    3. Add a **Log Message** activity, with `in_EmailText` as the message and `Info`
    as the log level. This will allow the automation to log the text of the email
    body to the console when we run the automation—potentially helpful if we need
    to debug anything down the road.


    4. After the **Log Message** activity, add an **ML Skill** activity with the following
    parameters:


    +   - **Connection Mode**: Robot

    +   - **ML Skill**: `Email_Spam_Classification`

    +   - **Item**: `in_EmailText`

    +   - **JSON Response**: `json_response`


    Within the **ML Skill** activity, `json_response` should be a newly created variable
    of type `String`. This variable is responsible for holding the **JavaScript Object
    Notation (JSON)** response of our `Email_Spam_Classification` ML skill.


    With `json_response` being a string of key-value pairs, before we can query the
    JSON, we need to convert it into an object through deserialization.


    5. Drag a **Deserialize JSON Response** activity into the workflow with the following
    parameters:


    +   - **Json String**: `json_response`

    +   - **Type Argument**: `System.Collections.Generic.Dictionary<System.String,
    System.Object>`

    +   - **Json Object**: `json_object`'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Similar to `json_response`, `json_object` should be a newly created variable
    of type `System.Collections.Generic.Dictionary < System . String, System . Object>`.
    This will allow us to now query our JSON response with a set of keys.


    The JSON response of `Email_Spam_Classification` is going to return a prediction
    and a confidence that we need to assign to `out_Classification` and `out_Confidence`,
    respectively.


    6.  Drag an **Assign** activity into the workflow, with the following parameters:


    +   * **To:** `out_Classification`

    +   * **Value:** `json_object("prediction").ToString`


    7.  Drag another **Assign** activity into the workflow, with the following parameters:


    +   * **To:** `out_Confidence`

    +   * **Value:** `Convert.ToDouble (json_object ("confidence"))`


    With our last **Assign** activity dragged into the workflow, the `Classify_Email`
    activity is almost complete. To help with potential debugging in the future, let''s
    add one more **Log Message** activity to log our classification and confidence
    from the ML skill.


    8.  Add a **Log Message** activity, with `out_Classification` and `out_Confidence`
    within the message, and `Info` as the log level.'
  merge: -1
  img_proc: true
