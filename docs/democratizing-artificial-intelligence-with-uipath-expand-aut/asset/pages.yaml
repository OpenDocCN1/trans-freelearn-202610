  md: 'Within the prebuilt workflow, we are given the opportunity to add any prework
    (such as adding gray scaling, resizing, or rotating) prior to digitizing the document.
    The prebuilt workflow then digitizes the document using the **UiPath Document
    OCR** as the OCR engine.


    If we wanted to use a different OCR, we could simply replace the UiPath Document
    OCR with any of the OCR engines available. For this use case, we are going to
    use the UiPath Document OCR to digitize the receipts for us. Because of this,
    we don''t need to add any additional activities for digitization, as the template
    does all the heavy lifting for us.


    With the digitizer configured, we can now move on to the next section of the *Document
    Understanding framework*, which is **classification**.


    # ## Setting up the classifier


    Once the digitizer is configured with our OCR engine of choice, we can move on
