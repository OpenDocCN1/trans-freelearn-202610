- pgno: 341
  md: 'Because we built an attended automation, Druid communicates with UiPath using
    UiPath''s RobotJS connector. UiPath''s RobotJS allows developers to contextually
    embed local attended robots into applications such as chatbots. When you first
    run an automation from Druid, you may be prompted by your browser asking whether
    you want to open **UiPath Assistant**, and once accepted, you may notice a request
    pop up from **UiPath Assistant**, as illustrated in the following screenshot:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_341_0.png)


    Figure 10.25 – RobotJS prompt


    Once you click **Allow**, the automation will kick off, and you should see an
    SRN returned to the chatbot. Continue to keep testing with a combination of requests.
    Great job!


    **Important Note**

    If you would like to view a video of the use case in action, navigate to the following
    link: https://bit.ly/3DKdXul


    # Considerations for production


    As we deployed the automation and the chatbot in the last section, we are all
    set to deploy the automation in our production environment. However, even though
    our use case is complete, there are some considerations to take into account if
    you plan to build another use case by leveraging a chatbot.


    The first consideration is whether the automation component can be an Unattended
    Bot. In this use case, we leverage an Attended Robot, but most chatbots should
    leverage an Unattended Robot when executing the UiPath automation.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Use Case 3 -- Chatbots with DruID


    By leveraging the **Druid Integration Framework** available on the UiPath Marketplace
    (https://marketplace.uipath.com/listings/druid-integration-framework), you can
    have Druid trigger an automation by adding transaction items to a UiPath queue
    item, as illustrated in the following screenshot:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_342_0.png)


    Figure 10.26 – Druid Integration Framework'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Adding a queue item will trigger the UiPath unattended automation to begin,
    completing the process and sending back any relevant information to the Druid
    chatbot. For future projects, consider leveraging the **Druid Integration Framework**
    with unattended automation to quickly ramp up an Unattended Automation project.


    # Summary


    In this chapter, we covered building a chatbot use case with *Druid*. In the construction
    of the use case, we learned how to create a project in Druid, import a template
    chatbot, build a chatbot flow, and—finally—deploy the chatbot. We also learned
    how to leverage the connection of the chatbot with UiPath. With these foundations,
    you can now venture off and build your own cognitive automation.


    In the next chapter, we will look into some advanced topics with *UiPath AI Center*.'
  merge: -1
