- pgno: 158
  md: "# Classifying a document\n\nLet's continue our example with classification.\n\
    \nIn this example, we only have one invoice type on a page, so classification\
    \ is not completely necessary. However, if our input file contains multiple documents\
    \ (such as multiple invoices), then classification is required:\n\n+   1. Drag\
    \ a **Classify Document Scope** activity into the workflow after **Digitize Document**.\n\
    +   \n+   Within the **Classify Document Scope** activity, we need to insert our\
    \ file path, taxonomy, document text, and DOM as input, and assign a variable\
    \ as output to hold the classification result.\n\n+   2. Insert the path to the\
    \ invoice document as the **Document Path** input, and insert our taxonomy, document\
    \ text, and DOM variables into the **Taxonomy**, **Document Text**, and **Document\
    \ Object Model** inputs.\n\n+   3. Create a variable called `classification_results`\
    \ and insert it into the **Classification Results** output:\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_158_0.png)\n\
    \nFigure 6.26 – The Classify Document Scope activity before adding a classifier\n\
    \nSince this document is an embedded PDF, we can use the Keyword Based Classifier\
    \ for classification. The `Sliced Invoices` template appears very standardized,\
    \ with the text `Sliced Invoices` appearing at the beginning of the document,\
    \ so we can use that as our keyword to match."
  merge: -1
  img_proc: true
- pgno: 159
  md: '4. Save a blank JSON file called classification.json in the project folder.
    This JSON file will be used as we manage the learning of the Keyword Based Classifier.


    5. Click Manage Learning and choose our recently created classification.json file
    to start learning.


    Within the Keyword Based Classifier learning window, note the document type (Sliced
    Invoices) from our taxonomy. To start the learning process, we need to include
    common keywords within the document type. As mentioned earlier, the text Sliced
    Invoices is consistent with this type of invoice, so let''s use that as a keyword.


    6. Click Add new keyword set, and add the keywords "sliced invoices" and "sliced
    invoices" (Figure 6.27):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_159_0.png)


    Figure 6.27 – Learning the Keyword Based Classifier


    Let''s next configure our classifier. Configuring our classifiers will be extremely
    important if we leverage multiple classifiers at once; however, in this case,
    we are only using one classifier, so we must ensure that it''s enabled and that
    its confidence threshold is set to 0% so that all results from Keyword Based Classifier
    are returned.'
  merge: -1
