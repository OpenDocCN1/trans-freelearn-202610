- pgno: 317
  md: '# Understanding the current state of the use case


    Before we venture into designing and building a use case, we need to understand
    the current state of the opportunity. With an increase in hiring in *Company ABC*
    has come an influx of service requests to the **information technology (IT)**
    team. Some of these service requests are simple requests that can be resolved
    with little human interaction, such as the following:


    +   - Resetting passwords

    +   - Upgrading colleagues'' video conferencing software to the professional version


    With the increased hiring of *Company ABC*, a lot of the support representative''s
    time is spent resolving quick, simple requests. To increase the capacity of the
    support team, the IT team has been asked to automate these two requests.


    Given that the tasks of resetting passwords and upgrading application licenses
    are straightforward, we can see that this automation opportunity has the following
    characteristics:


    +   - **Repetitive in nature**: Support representatives must perform the same
    series of steps for each service request.

    +   - **Time-consuming**: Completing each service request can take time away from
    support representatives performing more meaningful tasks.

    +   - **Rules-based and structured**: Resetting a user''s password or upgrading
    their license type is very rule-based.


    Automation of these tasks can provide a great deal of impact for not only the
    IT team but also for colleagues within *Company ABC*. In the next section, we
    will focus on creating a future state design for implementing this IT helpdesk
    bot.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# # Creating a future state design


    With our new understanding of the current state and the pain points of the IT
    team, we can start by creating a future state design of the automation, as represented
    in the following diagram:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_318_0.png)


    Figure 10.1 – Future state design of the IT helpdesk bot


    In the future state design of the use case, we could have a human launch our Druid
    chatbot (which could be connected to Slack, Microsoft Teams, or via the web),
    and prompt the chatbot to help with either password resets or application upgrades.
    Once the chatbot receives the request, it can trigger UiPath automation with an
    input argument on the specific task (password reset or application upgrade).


    Before we go into details on the future state design, it''s important to know
    some of the basics of building a chatbot. All conversational flows contain intent
    and dialog, which are the building blocks of a chatbot. When we represent a conversation
    between a person and our chatbot, the dialog between the two will be based on
    some intent. This is outlined further here:


    +   - **Intent:** A purpose for starting the conversation (also known as an utterance)

    +   - **Dialog:** A conversation that is in response to an intent

    +   - **Flows:** A combination of intents and dialog'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'All Druid chatbots are based on this methodology, whereby a user initiates
    a conversation with a chatbot (an utterance). Based on that utterance, the chatbot
    best matches with an intent that then starts a dialog, which could contain free
    text, buttons, or other inputs.


    With this understanding, we can design the flows of our chatbot. By default, a
    chatbot should have the following flows configured:


    +   - **Welcome flow**: A flow to welcome the user once they initiate the chatbot

    +   - **Fallback flow**: A flow for the chatbot to fall back on if the bot does
    not know the answer or response to a user''s input


    In addition to leveraging the Welcome and Fallback flows, we will need to add
    one additional flow for our automation. This flow will be called UiPath_Flow,
    where we will provide a set of buttons for the user to choose from. Depending
    on the button the user chooses, Druid will trigger an automation with an argument
    to either reset their password or to upgrade their application license.


    That concludes our future state design. In this section, we discussed chatbot
    basics, created a diagram to resemble our future state design, and introduced
    the three flows we will build in our chatbot. In the next section, we will get
    started with development by building the Druid chatbot.


    # Building a solution with Druid


    As we venture into building our defined use case, we''ll start with building our
    chatbot component with Druid. For this use case, we''ll start out with Druid''s
    **Druid Starter** template to set the foundation of our chatbot. This template
    comes with a definition of system entities and common flows that every chatbot
    should leverage.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Creating a project


    To start a project with the Druid Starter template, complete the following steps:


    +   1. In the main menu, click on the Bot dropdown and select AddNewBot.


    +   2. Once the Create New Bot window appears, enter IT Help Desk Bot as the bot''s
