    # Creating the dispatcher


    You may have noticed from testing the use case during the last section that we
    can only run the automation for one receipt at a time. Because the *Document Understanding
    Process template* is configured to handle one document at a time, we need to create
    a mechanism that dispatches the Document Understanding Process template. The dispatcher
    will ask the user for a folder path as input and, for each file within the folder,
    call the Document Understanding Process template we created, meeting the requirements
    set with the future state design.'
