- pgno: 153
  md: "![](img/05268897c8ac5d80eb3fead1cc8a822a_153_0.png)\n\nFigure 6.22 – The Classifiers\
    \ Wizard\n\nIn this example, I have only defined one document type in the taxonomy\
    \ (**UiPath Invoice**); hence, only one row is shown in the wizard. To the right\
    \ of the **Document Types** column, note our two classifiers. Underneath each\
    \ classifier, we have a minimum confidence percentage and a checkbox:\n\n+   -\
    \ **Minimum Confidence %:** This is a threshold of acceptable confidence from\
    \ our classifiers. In the last section, as part of the classification result,\
    \ we mentioned confidence as an output. With the minimum confidence %, we can\
    \ control reporting based on the confidence return.\n\nIn *Figure 6.22*, we set\
    \ the **Minimum Confidence %** value of **Keyword Based Classifier** as 50. This\
    \ means that if the Keyword Based Classifier was able to classify our document\
    \ with a value greater than or equal to 50% confidence, then it will output that\
    \ classification. If confidence was less than 50%, the Classify Document Scope\
    \ will ignore that classification result and not report on it.\n\nIn this example,\
    \ if confidence was less than 50%, the Keyword Based Classifier's result would\
    \ not be reported. The Intelligent Keyword Classifier's result would then be reported\
    \ because it has a confidence threshold of 0%.\n\n> **Important Note**\n> \n>\
    \ Classifiers are executed with priority; those on the left are the highest priority."
  merge: -1
