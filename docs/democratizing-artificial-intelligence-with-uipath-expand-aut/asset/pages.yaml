- pgno: 3
  md: '# # Foreword


    The mere mention of the term AI creates a cascade of reactions. We have all heard
    about aspects of the technology, some real, some prospective, and this has evoked
    a spectrum of views. Some believe the application of this capability is a giant
    leap forward to help solve some of society''s most perplexing problems. Others
    are certain that it is opening the door to the marginalization of humanity and
    the subjugation of people to the whims of software. Regardless of your viewpoint,
    AI is rapidly becoming a widely used technology to help solve problems, both operationally
    challenging and predictively based, where large amounts of information are used
    to spot and specify trends and create valuable outputs.


    There are those of us who have been involved in this area of technology for years,
    who have a growing number of those pesky gray hairs appearing on our heads and
    have seen several new capabilities appear and grow to become part of the new normal.
    From the perspective of time, these new capabilities tend to follow a clear, general
    trend. A new technology is developed and applied in a few cases with highly impactful
    results. As more people learn of this, they begin to imagine broader adoption
    with the promise of a quantum leap forward in solution design. Whether as a result
    of over-enthusiastic ambition or a lack of application expertise, there comes
    a bit of a resetting of expectations, a real-world reset if you will. However,
    through these initial phases of adoption, there is a growing number of dedicated
    professionals who are learning the skills necessary for both envisioning the use
    of the new technology as well as seeing its application in a broad and growing
    domain that expands the impact of this technology. This is typically when the
    rapid and steady growth of adoption takes flight.


    This cycle of *Introduction – Over-hyped use or impact – Resetting of expectations
    – Democratization – Explosive growth* is a well-known trend. The democratization
    phase is one of the most impactful. When more practitioners understand and are
    skilled in the use of the technology, they can immediately begin to see possible
    applications in real-world situations. This phase accomplishes two things: one,
    it dramatically increases the skill base of practitioners, and two, it opens the
    aperture of deployment use cases and furthers the adoption of the new technology.'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'In this work, our authors have set out not only how to begin understanding
    and deploying this technology, but also to define and stratify the various levels
    of AI and clearly instruct the reader on how to use it. For the inquisitive reader,
    the road to expertise begins with the first steps and this book will guide you
    through those first steps. I encourage you to read this, understand and imagine
    the possible uses of AI, and let your own curiosity take you forward.


    *Foreword by Tom Torlone - Automation thought leader who has helped many companies
    scale their transformation programs.*'
  merge: -1
