- pgno: 44
  md: "# Applying differences between how humans and machines work in cognitive automation\
    \ design\n\nHumans and machines behave and perform differently. The following\
    \ figure illustrates how humans and machines function in problem solving, memory,\
    \ productivity, and emotions. These differences influence how we design cognitive\
    \ automation to achieve a seamless human-machine collaboration:\n\n| | Human |\
    \ Machine |\n|---|---|---|\n| Problem Solving | Heuristics:\nDepends on a rule\
    \ of thumb, or a mental shortcut | Algorithm:\nDepends on a series of sets of\
    \ defined steps |\n| Memory | Short-term / Working Memory of ~7 pieces of information\
    \ | Depends on RAM (Random Access Memory) capacity |\n| Productivity | Duration\
    \ of uninterrupted time | Any available runtime |\n| Emotion | Ability to feel\
    \ and empathize | No feelings and empathy |\n\nFigure 2.4 – Humans versus machines\n\
    \nLet's take a deeper dive into each of these areas, as follows:\n\n+   - **Problem\
    \ solving**\n+   \n+     *Cognitive automation design implication:* The first\
    \ step is to assess the type of problem at hand to determine the best-suited solution.\
    \ If the problems are predictable and have historical learnings, current automation\
    \ technologies are more likely to be effective, whereas if the problems have many\
    \ unexpected options, humans are more likely to be effective. With either humans\
    \ or machines, the key to perfecting the algorithm is trial and error.\n+   \n\
    +     In the following figure, you can see more information on how humans and\
    \ machines solve problems:"
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Problem Solving


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_45_0.png)


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_45_1.png)


    +   - Humans solve problems using **heuristics**. Humans rely on the rule of thumb
    and the mental shortcuts to solve problems. This approach allows humans to solve
    problems efficiently without exhausting millions of possibilities. In addition,
    heuristics allow humans to come to an acceptable solution for unexpected situations.


    +   - Machines solve problems using **algorithms** with output that is predictable
    and reproducible. Algorithms are a series of finite defined steps. Algorithms
    are best for predictable inputs and outputs.


    Figure 2.5 – Problem solving: humans versus machines


    # Memory


    *Cognitive automation design implication:* Humans process records one by one because
    of the limitation of short-term working memory. Machines have the choice of processing
    records one at a time or in batches. Using the same example, the design for machines
    is different than for humans.


    +   - For humans, the pattern could go like this:


    +   - Row 1: Step 1, Step 2

    +   - Row 2: Step 1, Step 2

    +   - ...

    +   - Row 100, Step 1, Step 2


    +   - For machines, the pattern might look like this:


    +   - Step 1: Row 1, Row 2, ..., Row 100

    +   - Step 2: Row 1, Row 2, ..., Row 100'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'In the following figure, you can see more information on the differences between
    machines and humans in terms of memory:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_46_0.png)


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_46_1.png)


    # Memory


    +   - Humans have short-term working memory. Short-term working memory holds approximately
    seven pieces of information. If there are a hundred rows of records to process
    and each row has five elements, humans can hold the information for only one to
    two rows at a time.

    +   - Machines memory depends on RAM capacity. Using the same example, machines
    can hold all rows of information for the next step of processing.


    Figure 2.6 – Memory: humans versus machines


    # Productivity


    Cognitive automation design implication: Since humans require an uninterrupted
    duration of time, it is an important design principle to ensure freed-up capacities
    are in a contiguous block of time. In practice, this means moving from sequential
    steps in the pre-automated stage to a batch mode in the post-automated stage.


    In the following figure, you can see more information on how productivity varies
    between humans and machines:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_46_2.png)


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_46_3.png)


    # Productivity


    +   - Humans require an uninterrupted duration of time to be productive. Resuming
    focus on a task after an interruption takes time. A free-up capacity of one hour
    can be impactful depending on how this one hour is distributed. If sixty 1-minute
    increments make up the one hour, the free-up capacity is not productive. However,
    if one 60-minute increment makes up the one hour, the free-up capacity is productive.

    +   - Machines work on any available runtime. Using the same example, a free-up
    capacity of one hour of run-time is impactful regardless. Machines can fill up
    the run time with tasks for sixty 1-minute increments or one 60-minute increment.


    Figure 2.7 – Productivity: humans versus machines'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Emotions


    *Cognitive automation design implication:* Technology has advanced to be able
    to mimic some feelings and empathy. However, the stakes are high if we apply automation
    in situations where maintaining a good stakeholder emotional state is important.
    During the cognitive automation design phase, we need to weigh the efficiency
    gain of replacing emotional responses with machines against the damage of having
    a wrong emotional response by machines.


    In the following figure, you can see more information on how humans and machines
    differ in their emotional responses:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_47_0.png)


    Figure 2.8 – Productivity: humans versus machines


    Now, let’s go back to the example we discussed earlier and apply these design
    principles. The following diagram illustrates the future-state design using cognitive
    automation design principles:


    # Example 1: Contract Processing


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_47_1.png)


    # Cognitive Automation Design


    +   1. **Problem Solving:** Most activities are expected and predictable making
    them good automation candidates.

    +   2. **Memory:** Group machines activities together to complete in batches

    +   3. **Productivity:** Segregate humans activities from machines activities
    for contiguous working time and free time

    +   4. **Emotions:** Designate activities that involve emotions to humans


    Figure 2.9 – Cognitive automation design illustration'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'In the contract processing example in the prior section, there are four sequential
    steps in the current state. In the future-state design, the process is regrouped
    into two. One is for the machines to complete, and one is for the humans to perform.
    We have applied each of the cognitive automation design principles to make the
    future-state design, as follows:


    +   - **Problem solving**: This process stores contracts in the system and resolves
    non-compliance issues. Most activities are either rule-based or have a predictable
    outcome with sufficient training data. The current automation technology stack
    can automate most of the steps.

    +   - **Memory and productivity**: Since humans and machines think and perform
    differently, the future-state design regroups activities into human activities
    and machine activities. The machine activities remain sequential and can be run
    at non-business hours to optimize the runtime schedule. Human activities are discrete
    and can be performed when it is the most convenient. Humans can decide to process
    a few activities at a time or all at once without dependencies on machines. The
    future state is designed with human-machine collaboration in mind.

    +   - **Emotions**: In this process, the only step that involves delicate stakeholder
    interactions is the non-compliance resolution step. Therefore, in the future-state
    design, this step remains with humans. However, NLP is used as much as possible
    to identify non-compliance issues for humans to review. Humans handle all stakeholder
    interactions. This is another form of human-machine collaboration design.


    # Practical tips


    Cognitive automation is a powerful tool to extend automation potentials. When
    human-machine collaboration is done right, it improves the **user experience (UX)**.
    We have shown you the spectrum of office work and cognitive automation design
    principles.


    Pick a past RPA project you have completed. Review the process to see if it is
    a cognitive automation candidate. If it is, apply the cognitive automation design
    principles you''ve learned about. Design a future state and compare it against
    what you have done with RPA alone. You will find that it is easy to extend automation
    benefits with just some tweaks on how you view the business problem and how you
    solve it with automation technologies.'
  merge: -1
  img_proc: true
