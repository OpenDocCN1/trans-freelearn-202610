- pgno: 337
  md: 'That concludes configuring the automation workflows of our use case project.
    In this section, we created our UiPath project and built our supplemental workflows.
    We then connected our supplemental workflows together within the Main.xaml file
    of our project. In the next section, we will test what we developed.


    # Testing to ensure stability and improve accuracy


    With our development of the chatbot and the automation complete, we can move on
    to testing both workflows together. Testing any automated workflow before deployment
    is crucial to ensure that the automation works as expected. In this section, we
    will publish both the UiPath automation and the Druid chatbot so that we can test
    the functionality between the two.


    # Publishing the Druid chatbot


    In order for us to be able to test our Druid chatbot and to make it available
    for users to chat with, we need to publish the bot. Publishing the bot automatically
    provisions all the required resources in the DRUID environment. A bot is not functional
    until it is successfully published.


    The steps we need to take to publish our chatbot are listed here:


    +   1. Click on the **Settings** icon to the right of **IT Help Desk Bot**, as
    illustrated in the following screenshot:

    +   2. Once in the **Edit** menu, navigate to the **Details** tab.

    +   3. Click **Publish**.


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_337_0.png)'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'Once **Publish** is clicked, you should see a notification confirming the request.
    It may take a few minutes for publishing to complete, but once it does, you can
    click on the green chat button on the page to test out the chatbot as an anonymous
    user. Your chatbot should function similarly to this:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_338_0.png)


    Figure 10.22 – The chatbot in action


    Feel free to test it out. In the next section, we''ll publish our automation so
    that the Druid chatbot can trigger it.


    # Publishing the UiPath automation


    In previous chapters, we have usually left publishing the automation as a step
    to be completed after testing. However, in this case, we need to have our automation
    published so that the Druid chatbot can trigger an automation to run.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '> **Important Note**

