- pgno: 315
  md: '# 10

    Use Case 3 –

    Chatbots with Druid


    We can bridge conversational artificial intelligence (AI) and UiPath automation
    with intelligent chatbots to modernize operations and enhance the user experience
    (UX). With chatbots, we can integrate intelligent communication tools into messaging
    apps or chat windows, giving end users an almost immediate resolution to their
    inquiries. With chatbots and UiPath, we can go one step further in fulfilling
    the requests of customers—not only can we respond to customer inquiries using
    intelligent chatbots, but we can also launch automation processes to provide end-to-end
    (E2E) fulfillment of customer requests.


    In this chapter, we will work together to build a chatbot that can interact with
    human users and launch UiPath automations. As we build the use case, we will follow
    a similar development life cycle as outlined in the previous chapters. We will
    start with understanding the current state of our automation opportunity, and
    then design the future state of the use case with automation involved. Once the
    future state is designed, we will build the chatbot with Druid and the automation
    with UiPath Studio.'
  merge: -1
  img_proc: true
