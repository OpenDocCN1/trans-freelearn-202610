- pgno: 110
  md: 'Manually scanned documents are feasible with automation and document understanding;
    however, first, try to check to see whether OCR can reliably extract the necessary
    information.


    Inquire about the volume of documents delivered, as any variation in delivery
    can impact the complexity of automation. For example, if you have a use case where
    80% of documents are saved to a shared drive, while the remaining 20% of documents
    are emailed to a shared inbox, then an RPA developer would have to create a connection
    to the shared drive to gather the majority of documents, in addition to filtering
    out an email inbox for a certain subject line or sender.


    +   • **Document structure:** Focus on the structure of the incoming documents
    – ask about the potential of structural changes or whether a file can contain
    multiple documents. Strive for structured or semi-structured documents/data –
    unstructured documents/data can raise process complexity.


    It''s extremely important to ask about the structure of each type of input document.
    For example, if you have an invoice process, ask the client for as many different
    types of invoices from as many clients as possible. This variation of input data
    will allow you to review the similarities and differences of each template type.
    If it''s not feasible to get every type of variation, ask for the invoice templates
    from the highest volumes to review.


    Probe into process redesign if the current state contains inconsistent document
    structures. Never be afraid to consider process redesign. Often, it can greatly
    improve the success of a project, while at the same time, not being too difficult
    to complete.


    +   • **Document extraction:** Probe what required fields need to be extracted
    from each document; often, fields can be deemed unnecessary for automation. We''ll
    probe into this a little more when gathering the full requirements of the automation
    opportunity, but it''s never too early to start working on the taxonomy of the
    automation process.


    Focus on the data types of each field; question whether there are multiple languages
    or formats that need to be considered. Remember, handwriting can raise process
    complexity.


    +   • **Document verification:** Ask for multiple copies of each type of document
    – small variations of documents can be unnoticeable to humans but can quickly
    raise process complexity.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Like document structure, primarily focus on the largest volume of document
    types for automation. Set expectations with the SMEs early on regarding data validation
    and human-in-the-loop capabilities.


    Finally, a data scientist can be extremely beneficial to have on preliminary workshop
    calls. This is because they can help probe for what data considerations would
    be necessary to build out the opportunity, such as the following:


    +   - **Data sample size:** Is there a large enough sample size to train a machine
    learning model?


    This is extremely important to know ahead of time. At times, gathering data can
    be very difficult for many reasons (for instance, insufficient access, security
    concerns, and corporate politics); therefore, it is important to know ahead of
    time that there is enough data available to work with. In later chapters, we’ll
    discuss how much data to target, but remember, we’ll need data to develop and
    test with, in addition to separate data to validate our development against.


    +   - **Data noise:** Does the dataset contain irrelevant information or randomness?


    As you gather data, make sure you are careful of any noise or randomness. Noisy
    data can often produce undesirable results as our models can start to think of
    the noise as a pattern. This pattern can then lead to generalizations by the model
    and incorrect assumptions. If you start to see irregularities or randomness in
    the dataset, one of the easiest ways to resolve these issues is to inquire for
    more data.


    +   - **Data completeness:** Does the data sample contain all the information
    necessary for modeling?


    In addition to data noise, it’s important to ensure that the data samples available
    contain all the fields that are necessary for implementation. Sometimes, the data
    sample might only include a snippet of the number of fields necessary to complete
    the process, with the remaining data fields coming from other sources – make sure
    that you probe the SMEs about the relevant data fields necessary for the process
    and their locations in the sample data.


    +   - **Data availability:** Do the stakeholders (process owners/SMEs) have access
    to produce data for modeling? Can production data be retrieved in a timely manner?


    Finally, like data sample size, it’s important for us to be able to get data in
    a timely manner. For example, if our SME needs to request data from other sources,
    make sure that you have a sense of the average turnaround time – waiting for data
    to become available can have a large impact on the implementation timelines.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'As we dive deeper into cognitive use cases, we will see the importance of these
    considerations, especially around source data. While you might not receive answers
    to some of these questions during early process workshops, keep these considerations
    in your back pocket as you jump into the implementation phases, as they will reappear
    when we discuss automation design, development, testing, and more in the upcoming
    chapters.


    # Summary


    In this chapter, we discussed the beginning of any automation program: creating
    an automation pipeline. We learned about the characteristics to look for in potential
    automation and cognitive automation opportunities and how to lead discovery exercises
    to search for automation opportunities. Following this, we learned how to investigate
    whether an automation opportunity is the best option to implement, and then we
    learned how to dive deeper into the current state of the automation opportunity
    to optimize the process in order to capture the most value. Every automation program
    should have a similar goal of providing value to the business. By learning how
    to search for automation opportunities, how to understand the details of each
    opportunity, and what to probe for when dealing with cognitive automation, we
    can ensure the automation opportunities developed provide value to the end users
    that leverage them.


    In *Chapter 5, Designing Automation with End User Considerations*, we will take
    the next step with our automation opportunities captured using the techniques
    of this chapter. We will learn how to gather user goals and requirements, and
    we will learn how to incorporate these goals into the design of a future state
    automation while properly scoping the process to reduce complexity.


    # QnA


    +   1. What are the characteristics of RPA?

    +      - It requires manual interaction with applications, is repetitive in nature,
    has standard inputs, is time-consuming, is rules-based, and is structured.

    +   2. What are the characteristics of an automation opportunity that requires
    cognitive technologies?

    +      - Probability in nature, high variability, and unstructured data'
  merge: -1
