- pgno: 186
  md: 'To interact with elements (such as text fields and buttons) on a page, traditional
    RPA automation leverages properties or attributes of these elements, called **selectors**.
    UiPath automation is typically compatible with most applications and able to find
    selectors for automation to interact with; however, there exist some technologies
    for which finding selectors is unfeasible, and alternate solutions are necessary.


    In the past, most use cases that contained applications without findable selectors
    were either descoped or solved with brittle solutions such as image recognition.
    In order to help bridge the gap and provide a solution to these types of use cases,
    UiPath developed Computer Vision, an ML-based method used to locate elements on
    a screen. This has opened up a new spectrum of automation opportunities that can
    be developed, as automation can now interact on user interfaces that were not
    automatable with extensions such as the UiPath Citrix or VMware extensions, or
    interfaces that were generally just too complex to interact with.


    In this section, we''ll learn about UiPath''s Computer Vision, how to use it,
    and its available activities.


    # Using Computer Vision


    Before using the Computer Vision activities, ensure you have the UI Automation
    package 19.10 or greater installed. An API key from Automation Cloud must also
    be generated:


    +   1. Navigate to the **Admin > Licenses** page of **Automation Cloud.**


    +   2. Click the refresh button next to **Computer Vision** to generate an API
    Key:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_186_0.png)


    Figure 6.52 – The Computer Vision API key through Automation Cloud'
  merge: -1
  img_proc: true
