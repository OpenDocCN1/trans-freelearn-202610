- pgno: 134
  md: 'In this chapter, we’re going to cover the following main topics:


    +   - Getting started with UiPath Document Understanding

    +   - Getting started with UiPath AI Center

    +   - Getting started with UiPath Computer Vision


    # Technical requirements


    All code examples for this chapter can be found on GitHub at https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter06.


    Working with UiPath is very easy, and with the Community version, we can get started
    for free. However, for UiPath AI Center, we will need an enterprise license. One
