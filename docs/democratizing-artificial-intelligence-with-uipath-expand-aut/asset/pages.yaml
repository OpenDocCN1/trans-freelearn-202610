- pgno: 302
  md: 'Once these two steps are completed, our automation can effectively retrain
    itself based on the feedback a human provides.


    # Building a full pipeline


    When we built the ML skill earlier in the chapter, we ran a training and evaluation
    pipeline to get our ML skill ready for automation. While we previously only ran
    these pipelines once, in a closed feedback loop model we need to continuously
    rerun these pipelines to train and evaluate our ML package over time.


    So, to effectively retrain our ML package, we need to schedule a full pipeline
    run that will run a pipeline with both our training and evaluation datasets. To
    create a full pipeline, complete the following steps:


    +   1. Navigate back to our `Email Classification` project in AI Center.

    +   2. On the **Pipelines** page, click **Create New** to create a new pipeline.

    +   3. Click **Create New** to create a new pipeline, selecting the following
    attributes:

    +      - **Pipeline type:** `Full run`

    +      - **Choose package:** `TextClassification`

    +      - **Choose package major version:** `6`

    +      - **Choose package minor version:** `0`

    +      - **Choose input dataset:** `Email Classification/Train`

    +      - **Choose evaluation dataset:** `Email Classification/Evaluation`

    +      - **Enable GPU:** Turn this off

    +      - **Schedule:** **Recurring, weekly**

    +   4. Under **Environment Variable**, add the following environment variables:

    +      - `input_column`: `text`

    +      - `target_column`: `label`'
  merge: -1
  img_proc: true
