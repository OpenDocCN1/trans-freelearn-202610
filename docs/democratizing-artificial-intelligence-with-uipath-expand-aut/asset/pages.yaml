- pgno: 73
  md: '![](img/05268897c8ac5d80eb3fead1cc8a822a_73_0.png)


    Figure 3.15 – UiPath AI Center: Core technical concepts


    UiPath AI Center uses five technical concepts. You need to be familiar with the
    concepts and how they relate to each other. They are used throughout the UiPath
    AI Center product. The five technical concepts are as follows:


    +   - **Project:** A project is a collection of resources – datasets, ML packages,
    pipeline ML skills, and logs. You use these resources to build a specific ML solution.
    It is best to create a separate project for each automation use case. Within **UiPath
    AI Center**, the dashboard provides an overview of all the projects with information
    on active pipelines and deployed packages.

    +   - **Dataset:** A dataset is a folder of data storage. You can create new data
    files or upload files from another application. A dataset is a local resource.
    It is available only within the project.

    +   - **ML Package:** An ML package is a folder with the code and metadata needed
    to train an ML model. An ML package can have multiple versions with associated
    change logs. In UiPath AI Center, there are 25+ OOTB ML packages to use.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - **Pipeline**: A pipeline is the linear sequence of steps required to
    prepare the data, tune the model, and transform the predictions. A pipeline specifies
    the functions and the order of executions of these functions. It also specifies
    inputs required to run the pipeline and outputs received from it. Once a pipeline
    is completed, a pipeline run has associated outputs and logs. There are three
    types of pipelines:

    +     - **Training pipeline**: A training pipeline is used to train a new ML model
    to produce a new package version.

    +     - **Evaluation pipeline**: An evaluation pipeline is used to evaluate a
    trained ML model.

    +     - **Full pipeline**: A full pipeline is used to train a new ML model and
    evaluate the performance of this new model. Additionally, a preprocessing step
    is run before training, allowing data manipulation and training of a trained ML
    model.

    +   - **ML Skill**: An ML skill is a consumer-ready, live deployment of an ML
    package. Once deployed, it is ready to be consumed within RPA workflows. In UiPath
    Studio, you simply drag and drop any ML skill activity into the RPA workflows.


