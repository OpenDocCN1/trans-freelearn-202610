- pgno: 358
  md: '# Interacting with UiPath automation


    With the ML Skill deployed into AI Center, the last step of the example is integrating
    it with UiPath automation:


    +   1. Open UiPath Studio and create a new blank project.

    +   2. Add the `UiPath.MLServices.Activities` package through the **Manage Packages**
    button.

    +   3. Add an *ML Skill* activity into the workflow, with the following parameters:

    +      - **Connection Mode**: Robot

    +      - **Skill**: LinearRegression


    With the connection to the ML Skill created, we can now test it out by passing
    inputs, as shown in Figure 11.12.


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_358_0.png)


    Figure 11.12 – Testing the ML Skill


    And by providing the input [10, 20, 30], we can see a result of 140 and three
    coefficients.


    And that''s it! In this section, we prepared a custom Python ML model for AI Center,
    zipped and uploaded the package to AI Center, and created an ML Skill and connected
    it to UiPath. With what we covered, you should be able to prepare and import a
    custom ML model into AI Center.'
  merge: -1
  img_proc: true
