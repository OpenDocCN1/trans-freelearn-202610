- pgno: 223
  md: 'Once persistence and background support are disabled, we need to configure
    the assets included with the *Document Understanding Process template* before
    we can get started building the use case. Assets are shared variables stored in
    UiPath Orchestrator that automation projects can reference as they execute. In
    the Document Understanding Process template, there are six assets that we need
    to assign values to in Orchestrator:


    +   - **ApiKey**: Our Document Understanding API key.

    +   - **AlwaysValidateClassification**: A boolean value telling UiPath whether
    a human will manually validate classification. If set to True, classification
    will always go through manual validation.

    +   - **AlwaysValidateExtraction**: A boolean value telling UiPath whether a human
    will manually validate extraction. If set to True, extraction will always go through
    manual validation.

    +   - **SkipClassifierTraining**: A boolean value telling UiPath to skip classifier
    training. If set to True, classifier training will not be performed.

    +   - **SkipExtractorTraining**: A boolean value telling UiPath to skip extractor
    training. If set to True, extractor training will not be performed.


    The steps to set the required assets are as follows:


    +   1. Log into UiPath Orchestrator and navigate to a modern folder or personal
    workspace where the assets will be stored (Figure 8.13):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_223_0.png)


    Figure 8.13 – The personal workspace in UiPath Orchestrator'
  merge: -1
  img_proc: true
