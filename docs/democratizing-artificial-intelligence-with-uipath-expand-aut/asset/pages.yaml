  md: '# # Contributors


    # ## About the authors


    **Fanny Ip** is a thought leader in automation, business transformation, and innovation.
    Currently, Fanny is the VP of the automation consulting innovation office at UiPath
    and leads a team of experienced management consultants in developing field-tested
    solutions for customers.


    Before joining UiPath, Fanny co-led McKinsey''s automation practice in North America
    and developed automation strategies for CXOs to deliver revenue growth and achieve
    a bottom-line impact. Before automation, Fanny has also led business transformation
    projects at PwC and Deloitte.


    Fanny earned a BA in economics from the University of Chicago and an MBA from
    the Anderson School of Management at UCLA. Originally from Hong Kong, Fanny resides
    in Los Angeles with her family.


    **Jeremiah Crowley** is a multi-disciplined developer with a wide technical and
    operational lens. His initial passion for software development and implementation
    led him to automation and process efficiency. He enjoys working on and solving
    problems, irrespective of their size and the technology involved.


    Jeremiah received his BA in computer science from New York University. His work
    history includes the likes of EY and McKinsey & Company, where he assumed roles
    within their automation and service operations practices. He is currently a director
    within UiPath''s automation consulting innovation office, assisting organizations
    in driving adoption and scaling automation by managing digital transformation
    initiatives and developing hyper-automation frameworks and methodologies.'
