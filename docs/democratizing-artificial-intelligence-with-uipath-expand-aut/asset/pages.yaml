- pgno: 246
  md: 'With the Document Understanding Process template, the exportation workflow
    is located within 70_Export.xaml. By default, this workflow will output an individual
    Excel sheet for each document processed through Document Understanding; however,
    for this use case, we want to export all our results into a single Excel sheet.
    To do this, we need to make a few modifications to the export workflow.


    The first modification necessary is standardizing the filename of the exported
    Excel sheet. By default, the Document Understanding Process template will use
    a combination of the Receipt filename and page number, such as 1000-receipt_1-1.xlsx.
    This works well for most use cases; however, we need to have one file to host
    the results of all the receipts:


    +   1. Within the **Assign Output File Name** activity of 70_Export.xaml, change
    the value to Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.Desktop),
    "Note_Receipt_Details.xlsx").


    By changing the output filename to just Note_Receipt_Details, we have one file
    that we can export receipt data into. Changing the directory to the desktop will
    also directly save the file to the user''s desktop folder.


    The second modification necessary is adding an **Append Range** activity to the
    workflow. Because the default Document Understanding Process template created
    an Excel sheet for each document, it only needed to use a **Write Range** activity
    to write a new Excel sheet for each document. If we wanted to store all results
    in one Excel sheet, using the **Write Range** activity would overwrite existing
    data, thus **Append Range** can be used to append data to the end of an existing
    Excel sheet.


    +   2. Within **For Each Exported Table**, add an IF statement, checking whether
    **outputFile** exists by using the following condition – File.Exists(outputPath).


    +   3. Place the **Write Range** activity within the **Else** block of the **If**
    statement.


    +   4. Drag an **Append Range** activity into the **Then** block of the **If**
    statement (Figure 8.35) with the following parameters:


    +   - **DataTable:** `table`

    +   - **SheetName:** `table.TableName`

    +   - **Workbook Path:** `outputPath`'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/05268897c8ac5d80eb3fead1cc8a822a_247_0.png)


    # Figure 8.35 – Modified for the Each Exported Table activity


    By adding the Append Range activity, the automation can add the results of a recently
    read receipt to the existing Excel workbook. If the workbook doesn''t exist, the
    automation can revert to using the Write Range activity to create a new output
    file.


    Do note that all exported data will be saved within Data\Exports of the project
    folder. This location can be changed by opening the Config.xlsx file located within
    the Data folder of the project and modifying the ExportsFolder entry.


    After configuring the exporter, the configuration of the Document Understanding
    Process template is complete. Try running the workflow with the receipts at this
    link: https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter08/Receipt%20Data.


    By following the steps of the Document Understanding framework, and using the
    Document Understanding Process template, we were able to quickly create an intelligent
    workflow to decipher receipts. In this section, we built the use case by leveraging
    the Document Understanding Process template and by following the Document Understanding
    Framework steps. In the next section, we will start testing our recently created
    workflow with sample data.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Testing to ensure stability and improve accuracy


    With the initial development of the use case complete, we can venture into testing
    out how well the automation performs with the ML Classifier and ML Extractor.
    Testing any automated workflow before deployment is crucial in order to ensure
    that the automation works as expected. In this section, we will investigate enabling
    the Validation Station for the ML Classifier and ML Extractor, as well as starting
    testing with sample data.


    # Enabling the Validation Station


    During the development of the use case earlier, we deployed both the DocumentUnderstanding
    classifier and the Receipts ML skill to act as our classifier and extractor respectively.
    One of the reasons why we deployed these skills to AI Center was the ability to
    retrain these skills using the Validation Station. This gives us the ability to
    manually validate automation performance and retrain ML models, something we call
    Closing the Feedback Loop (Figure 8.36):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_248_0.png)


    Figure 8.36 – Closing the Feedback Loop


    As discussed in Chapter 7, Testing and Refining Development Efforts, using the
    Validation Station to close the feedback loop can play a large factor in improving
    the performance of an ML model.


    By deploying both the DocumentUnderstanding classifier and Receipts extractor
    to AI Center, and by creating datasets within AI Center to store validation data,
    we can easily enable the Validation Station to close the feedback loop on our
    use case.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'When we were defining the settings of the Document Understanding Process template,
    we configured a couple of assets in our UiPath Orchestrator, specifically the
    following:


    +   - **AlwaysValidateClassification**: A boolean value telling UiPath to always
    go through manual validation for classification. If set to True, validation will
    always be performed.

    +   - **AlwaysValidateExtraction**: A boolean value telling UiPath to always go
    through manual validation for extraction. If set to True, validation will always
    be performed.


    During the configuration of the Document Understanding Process template settings,
    we set both of those assets to True (Figure 8.37), meaning that we were telling
    UiPath that we did not want to skip classifier or extractor training; instead,
    we wanted UiPath to launch the Validation Station and take our human input to
    retrain the classifier and extractor:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_249_0.png)


    Figure 8.37 – Asset configuration'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'For testing purposes, the Validation Station should be enabled to help retrain
    the extractor and classifier, thus both assets should be set to True. Once testing
    is completed, you may want to turn off validation by setting the assets to False,
    or by adding additional logic to the workflow to only present the Validation Station
    when the classifier or extractor returns low confidence. Another recommendation
    is to work with the business and agree on a success metric – for example, testing
    100 scenarios, resulting in a 90% positivity rate, before the Validation Station
    is disabled.


    # Testing with sample receipts


    With the Validation Station enabled, we can now test the performance of the deployed
    classifier and extractor and retrain both skills where necessary. To start testing,
    navigate to the following link to retrieve sample receipts: https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter08/Receipt%20Data.


    At the preceding link, you will find receipts to test with and receipts for use
    after testing is complete. We will be leveraging the receipts located within the
    Testing folder for the purpose of testing.


    In Chapter 7, Testing and Refining Development Efforts, we discussed that when
    training cognitive automation we should have multiple datasets to test our ML
    skill:


    +   - **Training dataset**: The initial dataset to train the ML model

    +   - **Evaluation dataset**: A smaller set of data used to evaluate the training
    of the ML model

    +   - **Testing dataset**: An unbiased dataset used to expose the trained ML model
    to real-life data


    Fortunately, for this use case, the ML skills we used (the **DocumentUnderstanding**
    Classifier and the **Receipts** Extractor) already come pre-trained and ready
    to use. That means that UiPath has already performed the initial training and
    evaluation for us, leaving us to only test the dataset with our unbiased data,
    retraining with the Validation Station where necessary.


    Within the testing folder, you will find 50 receipts to test with. Feel free to
    test with a subset of the 50 receipts, or to individually test with all 50. When
    testing, be sure to validate the classification (Figure 8.38) and extraction (Figure
    8.39) to further strengthen the ML skills deployed to AI Center:'
  merge: -1
  img_proc: true
