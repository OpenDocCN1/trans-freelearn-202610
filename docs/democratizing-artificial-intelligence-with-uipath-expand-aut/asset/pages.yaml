- pgno: 191
  md: '# 7


    # Testing and Refining Development Efforts


    Accurately and comprehensively testing automation prior to deployment is paramount
    in ensuring the longevity of the automation. By creating a proper testing approach
    to gather test data, create test cases, and execute tests, we can ensure full
    coverage when assessing automation development.


    In this chapter, we will review the approach to testing cognitive automation,
    how to prepare test data and test cases for user acceptance testing (UAT), and
    how to train and increase model accuracy by closing the feedback loop with human
    validation and UiPath''s built-in validation features.


    In this chapter, we''re going to cover the following main topics:


    +   - Approaching cognitive automation testing

    +   - Executing cognitive automation testing

    +   - Closing the feedback loop'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Approaching cognitive automation testing


    As we continue through the automation life cycle once we have developed our automation,
    we can continue to test what was developed. While adding a cognitive component
    (Document Understanding, machine learning (ML) skills, and so on) brings additional
    complexities to automation from traditional rules-based robotic process automation
    (RPA), testing cognitive automation isn''t too different from the traditional
    approach to testing automation.


    In Chapter 6, Understanding Your Tools, we saw that when developing cognitive
    automation, we were essentially developing two distinct components: RPA and cognitive
    automation—we would build the ML skill first, then build RPA to leverage that
    ML skill. With this mindset, we can think of RPA and cognitive automation as modular
    components of the broader automation project, mimicking the design principle called
    separation of concerns (SoC).


    > SoC

    > This is a software design pattern where we separate a computer program into
    distinct sections.


    In the case of cognitive automation, the RPA component only needs to be prepared
    to handle the outputs returned from the cognitive component, and our cognitive
    component only needs to be prepared to handle inputs it receives from the RPA
    component. With that in mind, we can test these expectations while also splitting
    the testing approach because these components (or sections) are separate, as illustrated
    in the following diagram:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_192_0.png)


    Figure 7.1 – Testing cognitive automation'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'As shown in Figure 7.1, we can approach testing cognitive automation in two
    parts, leveraging traditional RPA testing approaches and ML test approaches to
    each component. We''ll proceed as follows:


    +   - **Testing RPA**: We will approach testing RPA in the same manner that we
    test any RPA project, through a mixture of unit testing, integration testing,
    **end-to-end** (E2E) testing, and so on.

    +   - **Testing cognitive automation**: We will approach testing cognitive automation
    in a similar manner to how we test an ML model, through data-driven training,
    evaluating, and testing.


    Once we successfully test both RPA and cognitive automation in their own environments,
    we can bring both components together for UAT prior to deploying into production.


    Let''s take a look at how we can test RPA and cognitive development.


    # How to test RPA development


    Testing RPA development in a comprehensive manner is pivotal to gaining the confidence
    of the business and building a successful automation program. However, there are
    many components of RPA that could lead to exceptions, such as the following:


    +   - **Application issues**: Technical changes; customizations

    +   - **Automation issues**: Business logic changes

    +   - **Environment issues**: System updates; desktop changes


    Thus, when testing RPA, we need to take a prescriptive approach to ensure reliability.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Because RPA doesn''t deviate much from traditional programming, we can leverage
    traditional software development testing practices when testing automation. In
    software testing, there are many different types of testing leveraged to ensure
    code is performing as desired, as illustrated in the following diagram:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_194_0.png)


    Figure 7.2 – Hierarchy of development testing


    The following list covers the hierarchy in brief:


    +   - **Unit Testing:** Lowest level of testing—tests individual code components
    or functions used by software

    +   - **Integration Testing:** Verifies different modules or components work together

    +   - **Functional Testing:** Verifies business requirements, such as verifying
    the output of an action or logic is as expected

    +   - **End-to-End Testing:** Replicates user behavior and verifies theE2E flow
    is running as expected

    +   - **Acceptance Testing:** Series of formal tests to ensure development matches
    business requirements


    For more information on the types of software testing, you can refer to the following
    link:


    https://www.atlassian.com/continous-delivery/software-

    testing/types-of-software-testing


    While automation programs may have different levels of formal testing required
    during their automation life cycles, all development must undergo some levels
    of formal acceptance testing. This leaves the lower levels of testing (unit to
    E2E) to the development team to perform prior to UAT.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# How to test cognitive components


    When testing a cognitive component, all testing starts with our data. In Chapter
    6, Understanding Your Tools, we completed an AI Center example with a training
    and evaluation dataset and pipeline. However, as we approach deployment of an
    ML skill, we need to add another dataset—the training dataset, leaving us with
    the following datasets necessary when building cognitive automation:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_195_0.png)


    Figure 7.3 – Testing an ML skill


    These datasets are outlined in more detail here:


    +   - **Training dataset**: Initial dataset to train the ML model. This training
    set should simulate our ideal expected result—or *ground truth*, in other words.

    +   - **Evaluation dataset**: A smaller set of data used to evaluate the training
    of the ML model.

    +   - **Testing dataset**: An unbiased dataset used to expose the trained ML model
    to real-life data.


    **Important Note**

    For more information about *ground truth*, check out the following link:

    https://towardsdatascience.com/in-ai-the-objective-is-subjective-4614795d179b


    In summary, we can see that RPA and cognitive components require different types
    of testing. RPA requires more of a traditional **software development life cycle
    (SDLC)** testing approach, while cognitive automation requires an iterative, data-driven
    approach. While respecting the mindset of **SoC**, we can effectively silo development
    and testing of both RPA and cognitive automation to ensure both components work
    correctly before bridging them together for UAT. In the next section, we will
    venture into executing cognitive automation testing.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Executing cognitive automation testing


    For successful testing and deployment of cognitive automation, we should always
    prepare an approach to testing. In this section, let’s review details on gathering
    test data, executing RPA and cognitive tests, and tying it all together with executing
    UAT tests.


    # Gathering test data


    ML depends highly on data. Having the right types and the right amount of data
    is crucial in having a successful ML model deployed; therefore, data preparation
    is such an important part of the ML process.


    When gathering test data, many organizations ask how much data is necessary to
    get started. Unfortunately, there isn’t an explicit answer to this question, as
    there are many variables that can affect how much data is necessary, such as the
    following:


    +   - The complexity of the business problem ML must solve

    +   - The number of classifications (if necessary)

    +   - The complexity of the algorithm used


    If necessary, you can try to target the following estimations when gathering data.
    Of course, every problem may be slightly different, thus more data may be required
    to output satisfactory results:


    +   - **Text classification**: Try to have a couple of hundred examples of *EACH*
    classification.

    +   - **Tree-based Pipeline Optimization Tool (TPOT) tabular classification**:
    Again, a few hundred examples of each classification.


    In general, when trying to gather data from a business team, you want to strive
    for as many data points as possible. It’s always easier to have too much data
    and to cut down, versus going back to the business and requesting more data.


    After you gather the data necessary for the project, it is important to have enough
    data to train, validate, and test the ML model, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/05268897c8ac5d80eb3fead1cc8a822a_197_0.png)


    Figure 7.4 – Splitting our dataset


    A majority of our dataset should be used for training the ML model, while smaller
    datasets can be used to validate the model and to finally test the model. Here’s
    an estimated rule of thumb:


    +   - **Training Dataset**: 60-65%

    +   - **Validation Dataset**: 20-25%

    +   - **Testing Dataset**: 10-20%


    Once our data for executing testing is gathered, we can continue on to the next
    section of cognitive automation testing: execution.


    # Executing RPA testing


    As we test RPA, we should start with the hierarchy of development testing (Figure
    7.2) from earlier in the chapter. In order to easily enable this hierarchy, there
    are a few practices we should follow during development, as outlined here:


    +   - **Small workflows**: Workflows should have a distinct input and output,
    performing a set action (such as Log in to X, Navigate to Y, Read Z).

    +   - **Independent workflows**: A workflow (minus Main.xaml or Process.xaml)
    should not call other workflows.


    By creating smaller, modular workflows, we can more easily create unit tests to
    test the functionality of development.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'When creating test cases for unit testing, we want to follow a methodology
    that allows us to prepare our environment to run the workflow, test our workflow,
    and validate the workflow''s output. The methodology is known as the *Given-When-Then*
    formula of testing and is elaborated on here:


    +   - **Given** some context

    +   - **When** some action is carried out

    +   - **Then** some output should be obtained


    For more information on *Given-When-Then*, you can refer to the following link:


    ```

    https://www.agilealliance.org/glossary/gwt/

    ```


    As test cases are built out in UiPath, separate sequences are used to separate
    the *Given*, *When* and *Then* portions of the *Given-When-Then* formula, as illustrated
    in the following diagram:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_198_0.png)


    Figure 7.5 – Creating a test case'
  merge: -1
  img_proc: true
