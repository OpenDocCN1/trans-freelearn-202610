- pgno: 227
  md: '# Creating the taxonomy


    As the first step of the *Document Understanding framework*, we need to create
    a taxonomy to classify our documents and build a schema of the relevant information
    we want to extract from our receipts. As discussed in *Chapter 6, Understanding
    Your Tools*, a taxonomy is a system classification, and with Document Understanding,
    a taxonomy is a classification of **document types**.


    From our current state understanding of the process, we defined the following
    as necessary for this process:


    +   - Vendor name

    +   - Receipt date

    +   - Tax amount

    +   - Total amount


    Thus, as we build out our taxonomy, we must include these fields. One feature
    of the *Document Understanding Process template* is pre-built taxonomies for common
    documents, such as receipts. Let''s review the out-of-the-box taxonomy and determine
    whether it fits our use case:


    +   1. Open **Taxonomy Manager** within the design ribbon of UiPath Studio (*Figure
    8.17*):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_227_0.png)


    Figure 8.17 – UiPath Taxonomy Manager within the design ribbon


    With Taxonomy Manager, note the pre-existing document types that are loaded –
    **Documents, Semi-Structured Documents, and Structured Documents**. Let''s review
    the semi-structured documents.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '2. Click Semi-StructuredDocuments > Financial > Receipt (Figure 8.18):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_228_0.png)


