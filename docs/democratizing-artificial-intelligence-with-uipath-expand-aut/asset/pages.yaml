  md: 'Once completed, the evaluation pipeline will return a few artifacts as output,
    as follows:


    +   - `Evualation.csv`: Data used to evaluate the model

    +   - `Evaluation-report.pdf`: Output report of the pipeline run


    If you look at the evaluation report, you can see that pretty good performance
    can be achieved with relatively little data.


    The **key performance indicator (KPI)** to look for in the evaluation report is
    to achieve a greater-than-80% Fscore for binary classification problems or a greater-than-70%
    F-score for multi-class problems. In this case, we just reached 80%; however,
    if we wanted to increase this number, we could increase the size of our dataset
    or close the feedback loop with a retraining mechanism, which we''ll build later.


