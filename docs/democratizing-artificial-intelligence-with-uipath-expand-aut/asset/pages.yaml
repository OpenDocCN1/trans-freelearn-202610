- pgno: 254
  md: 'Once validated, you can click **Save** to continue, and UiPath will use that
    validation to retrain the **DocumentUnderstanding** classifier. Continue testing
    the automation with additional receipts from the testing folder. As you continue
    testing and retraining, performance should increase with the classifier and extractor.


    In summary, using the Validation Station to validate classification and extraction
    results is crucial during the testing phase. Any human validation is an opportunity
    to make our ML skills smarter and stronger. In this section, we learned how to
    enable the Validation Station within the *Document Understanding Process template*
    and then learned how to interact with the Validation Station. In the next section,
    we will prepare the use case for deployment by adding features to enhance the
    end user experience.


    # Deploying with the end user experience in mind


    With the initial development and testing of the use case complete, we can venture
    into deploying the automation into a production environment. However, before deploying
    into production, there are a few items we should add to the automation in order
    to improve the end user experience. In this section, we will create a **dispatcher**,
    an additional workflow to dispatch our `Main-Attended.xaml` file. After creating
