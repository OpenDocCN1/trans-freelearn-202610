- pgno: 160
  md: '7. Click **Configure Classifiers**. Set the minimum confidence to 0%, and make
    sure that the checkbox under **Keyboard Based Classifier** is filled:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_160_0.png)


    Figure 6.28 – Setting the Keyword Based Classifier to 0% confidence


    With that done, our Classifiers Scope is complete. The next step is checking the
    confidence of the classifier. In this case, if the confidence returned by our
    classifier is below a certain percentage, let''s have the automation launch the
    Classification Station to get a more accurate classification from the user.


    8. Drag an **If** activity after the Classification Scope, inserting the following
    as the condition:


    ```

    classification_results(0).Confidence < .5

    ```'
  merge: -1
