  md: "# Using AI Center\n\nIn this section, we will navigate around the key concepts\
    \ of AI Center. By getting familiar with these concepts, we will build experience\
    \ with leveraging AI Center, key for building automation with ML capabilities.\n\
    \nWhen creating an automation project, we generally want to follow two paths into\
    \ production:\n\n+   - **Use pretrained models:** The developer should follow\
    \ the following flow:\n+     1. Creating a project\n+     2. Leveraging an ML\
    \ package\n+     3. Deploying it as an ML skill\n+     4. Dragging and dropping\
    \ the ML model into RPA\n+   \n+   - **Use retrainable models:** The developer\
    \ should follow the following flow:\n+     1. Creating a project\n+     2. Uploading\
    \ a dataset\n+     3. Leveraging an ML package\n+     4. Deploying a training\
    \ pipeline to train the model\n+     5. Deploying it as an ML skill\n+     6.\
    \ Dragging and dropping the ML model into RPA\n+     7. Connecting RPA back with\
    \ the ML model, providing continuous feedback\n\nIn this section, we’ll investigate\
    \ the key concepts of AI Center to follow these two paths into production.\n\n\
