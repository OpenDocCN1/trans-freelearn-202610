- pgno: 83
  md: '# # 4

    Identifying Cognitive Opportunities


    As more organizations implement **Robotic Process Automation (RPA)** and cognitive
    automation within the workplace, generating value from these implementations has
    never been more important. As we work to identify automation opportunities, the
    value proposition of automation should always be the central focus, tying back
    to the higher-level targeted business objectives of the organization and the central
    vision of the automation program.


    When identifying potential use cases for cognitive automation, it is imperative
    to gather as much context and knowledge about an automation opportunity to ensure
    AI Center and Document Understanding can achieve the use case''s target goals.
    Therefore, in this chapter, first, we will focus on how to search for automation
    opportunities. In particular, we will learn about the characteristics of a traditional
    automation opportunity and a cognitive automation opportunity. How to set target
    goals for the enterprise, and how to lead search efforts to find automation opportunities.
    Following this, we will dive into understanding the automation opportunity: learning
    how to prioritize automation opportunities based on the dimensions of best fit,
    feasibility, and viability and learning how to best capture value by fully understanding
    the end-to-end process of an automation opportunity. By the end of the chapter,
    we''ll pivot into discussing what items to consider when probing a cognitive automation
    idea.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'In this chapter, we''re going to cover the following main topics:


    +   - Searching for automation opportunities

    +   - Understanding the opportunity

    +   - Probing for cognitive automation


    # ## Searching for automation opportunities


    Value assurance has never been more important, as organizations are laser-focused
    on creating immediate benefits from automation initiatives. Therefore, careful
    consideration should be made when identifying, sizing, and green-lighting automation
    candidates during the opportunity search. To ensure that the chosen opportunities
    are successful and realize the benefits advertised, you should be well versed
    in the characteristics of an automation opportunity, understand when to apply
    cognitive capabilities, and understand how to recognize the drivers of value automation
    can create. Once fully versed in the characteristics of an automation opportunity,
    you can take different approaches to identify an opportunity from a top-down or
    bottom-up perspective, and then apply your judgment to prioritize the opportunity
    for further analysis and development.


    In this section, we''re going to cover the following topics:


    +   - The characteristics of an automation opportunity

    +   - Identifying target goals

    +   - Seeking automation opportunities


    # ## The characteristics of an automation opportunity


    Before searching for automation opportunities within the enterprise, it is important
    to fully understand what traditional RPA can do, and more specifically, what additional
    benefits adding cognitive abilities to RPA can unlock. Fully grasping these concepts
    is pivotal when searching for opportunities – far too often, poorly scoped opportunities
    end up within an organization''s automation pipeline that are either not well
    fit for automation or unable to provide immediate benefit to outweigh the cost
    of development and support.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'In previous chapters, we gained a general understanding of what RPA is and
    what it can offer – a software robot residing on top of applications at the desktop
    level that can mimic human interaction to perform a series of steps. This automation
    can provide a lot of benefits, such as the following:


    +   - Logging into applications

    +   - Scraping data from websites and applications

    +   - Navigating through application windows and menus

    +   - Making calculations


    So, when identifying candidates for strictly RPA, we want to investigate opportunities
    that do the following:


    +   - Require manual interaction with applications

    +   - Are repetitive in nature

    +   - Have standard inputs

    +   - Are time-consuming

    +   - Are rules-based and structured


    However, it''s critical to understand that RPA alone can only perform a series
    of standardized, rules-driven system-based activities. In its basic form, RPA
    is very naïve, only following the instructions that it''s provided. Of course,
    this is similar to any kind of traditional programming or scripting – your executing
    agent (in our case, the UiPath robot) is simply going to follow the set of instructions
    you provide it. Unfortunately, this leaves us with a finite number of opportunities
    that are automatable, leaving out a lot of use cases that require a human-level
    form of judgment or thinking outside of the traditional if-else series of conditionals.


    Fortunately for us, we can now fill this gap with the addition of cognitive abilities
    to what I like to call "cognitive automation." This allows us to potentially reshape
    the future of automation, as we can scope more complex and judgmental types of
    opportunities that traditional rules-based automation couldn''t solve. Many organizations
    are leveraging this technology to improve their existing automations and to even
    investigate their automation pipelines and revisit previously descoped opportunities
    that can now be developed with cognitive automation.'
  merge: -1
  img_proc: true
- pgno: 86
