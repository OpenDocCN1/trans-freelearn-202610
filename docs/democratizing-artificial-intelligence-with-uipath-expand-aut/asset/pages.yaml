- pgno: 40
  md: 'The following diagram shows the available technologies across the spectrum
    of office work:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_40_0.png)


    Figure 2.2 – The automation technology stack


    RPA, application programming interface (API), ERP, and business process management
    (BPM) belong to a class of automation technologies that reduce the manual efforts
    of rule-based digital activities. AI, ML, and NLP belong to another class of automation
    technologies. They reduce the manual effort of activities that require cognitive
    thinking.


    As you learned in the preceding section, almost all activities have rule-based
    and cognitive components. Until recently, there were no platforms that allowed
    for seamless integration of these different technologies. Businesses look for
    a technology platform that allows users to take advantage of the different automation
    technologies. A new class of automation products called the cognitive automation
    platform has emerged. The cognitive automation platform simplifies the integration
    between systems and technologies. It also makes AI easy to develop and consume
    and bridges the gap between RPA and AI.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Practical tips


    There are tremendous opportunities to apply appropriate cognitive automation to
    the spectrum of work to generate benefits. The most common mistakes and solutions
    of early cognitive automation adopters were these:


    +   - They did not look at business problems holistically and were constrained
    by artificial boundaries such as **business units (BUs)**. This hurdle required
    upper-level engagement to break through business silos.

    +   - They wanted to test and deploy a specific technology and retrofit business
    problems to the technology. Many companies now have the mindset of business problems
    first and technology second.

    +   - They were too optimistic about AI technology maturity and overestimated
    the AI capability. A better understanding of the different technologies and how
    they work would help set the appropriate expectation.

    +   - They underestimated the importance of human elements, replacing delicate
    human touchpoints with technology without giving thought to the impact of such
    a replacement. Most recent digital transformation journeys include human-centric
    design in their discipline to avoid this problem.


    By now, you should have a good grasp of the spectrum of work, the automation potentials,
    and the technology stack. Let''s reimagine cognitive automation by perfecting
    human-machine collaboration.


    # Designing human-machine collaboration with cognitive automation


    In the previous section, we explored the spectrum of office work and its relative
    automation potentials. Companies look for a more efficient and effective way to
    perform office work by leveraging automation. Office work does not comprise a
    single *activity* but a sequence of activities that make up a *process*. Full
    automation of the **end-to-end (E2E)** process may be the eventual goal. However,
    a more realistic goal is good *human-machine collaboration* to drive efficiency
    and effectiveness with currently available technology. Therefore, it is important
    to understand how humans and machines work differently and the best way to think
    through a human-machine collaboration when designing cognitive automation.'
  merge: -1
  img_proc: true
