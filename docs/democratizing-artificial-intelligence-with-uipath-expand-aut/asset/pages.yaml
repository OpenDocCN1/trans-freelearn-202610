- pgno: 115
  md: '# 5

    Designing Automation with End User Considerations


    Once **automation** opportunities have been identified, the next milestone in
    the automation journey is focused on requirements gathering. During this phase,
    it is imperative to gather as much context as possible around the end user''s
    requirements and goals for automation to ensure that **cognitive automation**
    can achieve the end user''s **target goals**. Understanding the target goals of
    the use case will determine the future success of applying cognitive automation
    to an opportunity.


    Every automation should be designed with the end user''s considerations in mind.
    Automation that is difficult for the end user to interact with is automation that
    runs the risk of being unused; thus, in this chapter, we will first focus on gathering
    the end user''s requirements, then move toward setting the target goals of future
    state automation. Finally, we will dive into how to design a future state automation
    solution.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'In this chapter, we''re going to cover the following main topics:


    +   - Gathering requirements

    +   - Setting target goals

    +   - Designing the solution


    # Gathering requirements


    The foundation of any successful automation is an accurate understanding of the
    *current state* process and an accurate understanding of the *requirements of
    the future state process*. Being in sync with the current state of the end-to-end
    process allows us to fully understand the intricacies of the automation opportunity.
    By gathering the requirements of the current state process, and understanding
    the broader objective of using automation, we can gather valuable insights to
    help shape the future state design of the opportunity.


    # Gathering the current state


    During the requirements gathering phase of the automation life cycle, we start
    our journey by gathering the current manual steps an end user performs to complete
    the process we plan to automate. By gathering the details of how an end user manually
    completes the current state, we can search for inefficiencies within the process
    and start to evolve the process into a future state design, with automation and
    cognitive technologies incorporated.


    In order to gather the steps of the current state, we need to work with individuals
    closest to the process. In the last chapter, we discussed how a process owner
    could help with sizing an opportunity for automation, and how they may not be
    the best resource to provide step-by-step instructions for how to complete the
    process task; thus, we likely need to interact with other individuals who are
    familiar with completing the task manually on a regular cadence, such as **subject
    matter experts (SMEs)**. These SMEs will act as our main point of contact when
    gathering the current state, providing feedback on the future state design, and
    testing the effectiveness of the automation during **User Acceptance Testing (UAT)**.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# **Requirements Gathering**


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_117_0.png)


    Gathering the current state of an automation opportunity only takes a few steps:


    +   1. Gathering current state documentation

    +   2. Shadowing the process

    +   3. Understanding the objective


    Once these steps are completed, we should have enough context around how the current
    process is performed, and can then understand more accurately the objective of
    applying automation and a more effective solution for a future state design.


    # Gathering current state documentation


    Most automation opportunities are to do with processes that humans manually complete
    as part of their day-to-day business activities. Because humans complete these
    tasks, documentation is created to capture how to perform the task, and it is
    usually leveraged to train new employees, or for auditing purposes. Other benefits
    of documenting business processes include the following:


    +   - Auditability

    +   - Business continuity

    +   - Consistency and productivity among team members


    As you probe for documentation, note that teams may refer to these documents by
    different types of names, such as the following:


    +   - Desktop procedures

    +   - **Standard operating procedures (SOPs)**'
  merge: -1
  img_proc: true
- pgno: 118
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Process shadowing


    One of the best ways to understand a process is to simply watch how the process
    is completed. By sitting with the SME, we can gather the details of the process
    through observation, while asking questions as they complete the process.


    During **process shadowing**, we should always sit with the SME (either virtually
    or in person), observing the steps taken to complete the task at hand. During
    this observation, it is always recommended to record the session through a video
    conference, if possible. This allows us to have a reference to all the questions
    asked, or details of each step, without needing to take overly detailed notes.
    It also can be helpful when moving onto the development phase, as a recording
    of the manual process could augment any process documentation created for the
    automation (such as a **Process Design Document**).


    Process shadowing gives us the luxury to probe the SME. We can ask questions such
    as the following:


    +   - What works well?

    +   - What causes difficulty?

    +   - Why do we perform the task this way?


    During observation, we should probe the SME for any *pain points* or *potential
    improvements* that could be included in the automation design. Many business analysts
    fall into the trap of capturing the current state of the automation without challenging
    any of the steps or decisions made during the process. Actively listen to SMEs
    for pain points and requests for the future state. Never make assumptions about
    how you think the end user interacts with a process, or what the end user wants
    in a future state. Instead, ask open-ended questions that allow the SME to completely
    provide their input. If the process is inefficient, challenge the SME on why the
    process is performed that way. These identified pain points should be addressed
    in the future state design of the automation.


    # Understanding the objective


    As we uncover the current state details of an opportunity through process shadowing
    and documentation, we should be able to start understanding the broader objective
    of the process. By understanding the objective of the process, and understanding
    the end user''s requirements, we are better equipped to fit automation when finding
    a solution for the future state. This allows us to deliver better and more impactful
    automation to the business.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Automation must be designed with the end user''s experience in mind. As we
    shadow SMEs and gain an understanding of the current state, we should be keeping
    an eye on how the end user interacts with the current state process. By confirming
    the objectives and goals of the end user, we can gather a mutual understanding
    of what the project should achieve. Some questions that should be answered when
    understanding the objectives are as follows:


    +   - What is the purpose of the task/process?

    +   - What is automation set to achieve?

    +   - What are the expectations of automation?

    +   - How is the output of this task/process used by others?


    As we understand the objectives of the automation project, it''s important that
    we have the full picture of the end-to-end process prior to beginning development.
    As discussed in the last chapter, it''s advantageous to have the full context
    regarding the upstream and downstream processes of an automation opportunity.
    By knowing how the process connects to other tasks/processes upstream and downstream,
    we can more accurately judge how cognitive automation can fit into the use case,
    potentially allowing us to alter the upstream or downstream processes to better
    fit with the automation.


    By understanding the current state of the automation opportunity through current
    state documentation and process shadowing, and understanding the objective/needs
    of the end user, we can fully understand the opportunity for applying automation.
    With this newly acquired understanding, we can then continue with setting the
    right expectations and setting realistic goals for automation.


    # Setting target goals


    Very often, the cause of unsuccessful projects is *unclear requirements*, leading
    to *unrealistic target goals*. With automation, the end user (and their experience)
    should always be the top priority when designing a project. Automation that is
    developed without achievable target goals is likely to be abandoned and turned
    into *shelfware*. To mitigate this abandonment, we must understand the end user''s
    objectives for the automation, and then set realistic target goals for success.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Setting realistic target goals early in the development process is a large
    preventer of abandoned automation. Too often, automation deployed into production
    is abandoned by end users because it doesn’t perform to expectations, or doesn’t
    fully meet the end user’s requirements or objectives (Figure 5.3):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_121_0.png)


    Figure 5.3 – Causes of automation abandonment


    Prior to starting development, align with the end users on a set of success criteria
    for the *to-be* (or future state) cognitive automation. Some examples of success
    criteria include the following:


    +   - Time savings

    +   - Efficiency gains

    +   - Straight-through processing—the percentage of items (such as documents)
    that require no human intervention

    +   - Field accuracy

    +   - Ease of use

    +   - Speed/throughput

    +   - Total cost of ownership

    +   - Vendor relationship'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'With objectives and goals for the project aligned and an understanding of the
    full end-to-end process completed, we can set realistic target goals for the automation
    opportunity. It''s important to educate the end users about the success rate of
    cognitive technologies. Cognitive automation is not going to return a 100% accuracy
    rate. There is a chance for small variances, thus it is important to set the right
    expectations with end users early about the success rate of machine learning,
    **optical character recognition (OCR)**, or Document Understanding. This also
    allows the business to allocate human users to act as validators for exception
    handling and **human-in-the-loop (HITL)** capabilities.


    By fully understanding the objective of the automation opportunity, gathering
    context on the full end-to-end process, and listening of the end user''s requirements
    for automation, we can set realistic goals and expectations to the automation,
    and ensure proper documentation of the opportunity with UiPath templates, such
    as the **Process Definition Document (PDD)**. All these points help ensure a well-received
    product once deployed in production.


    # Designing the solution


    Building an automation takes a lot of investment from a time and material perspective,
    so we must ensure that any automation deployed in a production environment is
    designed in a manner that incentivizes the end users of the business to continue
    using the automation. Focusing on the end user when designing the solution includes
    the following:


    +   - Choosing the correct automation type

    +   - Designing for the best user experience


    By building an automation that''s easy for the end user to interact with and understand,
    we can achieve our forecasted benefits, as the end user has a positive experience
    when interacting with the automation.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Choosing the correct automation type


    When considering the design of a cognitive automation, one of the first decisions
    encountered is what automation type to leverage. With robotic process automation,
    there are two types of automation that impact the way end users interact with
    automation: attended and unattended automation (Figure 5.4), each providing different
    types of engagement with automation.


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_123_0.png)


    Figure 5.4 – Automation types


    Both types of automation come with different sets of requirements and considerations
    for implementation. However, by acquiring a deep understanding of the end user''s
    target goals, the choice of automation type should not be a difficult one to make.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# # Attended automation


    **Attended automation** can best be seen as a virtual assistant to the human user.
    These types of automation are run directly from the end user’s computer and must
    be triggered directly by the end user themselves. Attended automation tends to
    give the end user more control, as they get to choose when the automation runs
    and, at times, what data the automation can leverage. Additional points on attended
    automation are included in *Figure 5.5*:


    |  | **Attended Automation**  <br> **Virtual assistants, running with the assistance
    of a human user**  |

    | :--- | :--- |

    | What to Run | • Runs smaller, task-based jobs that are more “front office” |

    | When to Run | • Can run on a regular basis, but are also “ad hoc” types of tasks,
    running to assist a human whenever needed |

    | How to Run | • A human chooses to run the automation by pressing “play” in their
    UiPath Assistant |

    | Where to Run | • Runs directly on the user’s desktop, always available for the
    user to execute |

    | Why to Run | • Best for shorter, more personal tasks that fulfill an individual’s
    needs <br>• Typically require human input (in other words to enter a file path,
    a date range, etc.) <br>• Typically save smaller amounts of time as tasks are
    shorter (attended automations typically take only a few minutes to run) |

    | When to Choose | • When developing for a problem that is variable for each user
    and not standard, this requires human input <br>• Automation only provides smaller
    levels of benefits, usually not recovered by a full implementation effort |



    Figure 5.5 – Attended automation


    Because attended automation is triggered by the human end user, it gives automation
    developers an excellent opportunity to juggle information between the robot and
    the human. This allows developers to add message prompts to their automations,
    allowing the automation to ask human users for input during runtime, such as the
    following:


    +   - Prompting the human to input application credentials

    +   - Prompting the human to choose a local file for input

    +   - Prompting the human to input data that affects the logic of the bot (for
    example, the account number, and start and end dates)


    These types of prompts also allow automations to prompt for human validation in
    case of exception. Through the use of UiPath’s Validation Station, automation
    can ask the human to provide input when it faces a scenario of low confidence,
    such as not being able to categorize an email (*Figure 5.6*):'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/05268897c8ac5d80eb3fead1cc8a822a_125_0.png)


    Figure 5.6 – UiPath Validation Station


    With UiPath''s Validation Station, we can provide a pop-up window on the user''s
    desktop, asking them to provide input, or validation, on a particular item in
    a document. With these types of prompts, we can ask the end user for real-time
    input, placing automation as a real companion to the end user.


    # Considerations for using attended automation


    With the ad hoc nature of attended automation comes a few considerations around
    documentation and performance. Since attended automation can potentially be shared
    with the entire workforce, proper documentation should be created to teach end
    users how to interact with the automation and the expected inputs and outputs
    of the automation. Providing sufficient context and information on an automation
    is imperative, making the automation easy to use, and enhancing the end user''s
    experience.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'To educate the end user on the context of attended automation, development
    teams can provide detailed project descriptions, user guides, and prompts within
    the automation to guide end users through execution. End users are more likely
    to consume automations that contain detailed descriptions of what the automation
    entails; thus, project descriptions should outline what the automation will perform,
    dependencies for running the automation, and the expected output (Figure 5.7).
    Teams should host these project descriptions on a common site, such as UiPath
    Automation Hub or UiPath Marketplace.


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_126_0.png)


    # Summary


    This automation uses Microsoft Translator service to translate selected text and
    copies the translated text to your clipboard for further use.


    # Overview


    The Translate Text From My Screen automation allows you to quickly translate selected
    text on your screen using the Microsoft Translator API. It asks you to select
    text to be translated, sends the text to the Microsoft Translator API and copies
    the translated text to your clipboard. The automation is great for translating
    documents or emails, double-checking translations or learning a new language.


    Figure 5.7 – Project descriptions, like those on Automation Hub, are best practice'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'In addition to documentation, leveraging UiPath prompts, such as callouts,
    can help guide the user through confusing, or difficult steps of the automation
    process (Figure 5.8). Callouts are extremely helpful as they can be placed next
    to elements on a user''s desktop to direct the end user to interact with automation.


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_127_0.png)


    Figure 5.8 – Example of a callout in UiPath


    In addition to the consideration around documentation, computing performance must
    also be considered when building an attended automation. Attended automations
    are best for short tasks, providing immediate output to the end user. These tasks
    should not take too much time, as attended automation may take over a user''s
    machine while executing, leaving the human computerless. Leaving the end user
    computerless can be seen as a risk to potential benefit; if the end user can''t
    perform other tasks while an automation is running, they may just wait for the
    automation to complete, reducing time savings. While there are technologies that
    allow for background processing (such as UiPath''s Picture-in-Picture and Simulate/Send
    Windows Messages Interaction Frameworks), be sure to scope the attended automation
    precisely, keeping the impact on the user''s machine minimal.


    An attended automation is a great resource to leverage when dealing with short
    tasks that don''t have a definitive scheduled runtime. Allowing the end user to
    trigger the automation gives the automation the chance to also prompt the user
    for input. However, with these features also come considerations around documentation
    and performance that can impact the end user''s experience if handled incorrectly.
    With a lack of documentation, end users may not be convinced to try out the automation
    or may be confused on how to use it, while long-running attended automations may
    leave end users frustrated if they cannot use their computers for other tasks
    while the automation executes.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Unattended automation


    Unattended automation can best be seen as an *extension of the human user*. This
    type of automation is run from dedicated machines (such as virtual machines on
    the cloud) and must be triggered directly by **UiPath Orchestrator** through a
    triggering mechanism, such as a schedule. Unattended automation tends to unlock
    higher levels of impact than attended automations, as placing an automation on
    a dedicated machine allows businesses to run automation(s) as often as needed.
    Additional points on unattended automation are included in Figure 5.9:


    |  |  |

    |---|---|---|

    | **Unattended Automation**

    *An extension of the workforce, running independently without human assistance*
    |  |

    | What to Run | • Runs larger, end-to-end process-based jobs that are more “back
    office” |

    | When to Run | • Runs on a regular basis, whether schedule-based or event-based
    |

    | How to Run | • A trigger (scheduled-or event-based) will kick off an automation
    |

    | Where to Run | • Runs on an external machine, either on-premises or in the cloud
    |

    | Why to Run | • Best for longer, more generic tasks that fulfill a full team’s
    needs

    • Does not require human input; can run fully end to end without human intervention

    • Typically saves larger amounts of time, as the process automated is generally
    longer (unattended automations can typically run for hours a day or even 24x7)
    |

    | When to Choose | • When developing for a problem that is standardized across
    one or more teams, not necessitating human input

    • Automation provides large levels of benefits, providing a return on investment
    required by an implementation effort |


    Figure 5.9 – An overview of unattended automation


    Because unattended automation runs on external machines, we lose the ability to
    provide the end user with immediate prompts or guides, as we could with attended
    automation. On the bright side, UiPath has thought of this and has provided an
    alternative to Validation Station for unattended automations called **UiPath Action
    Center.**'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/05268897c8ac5d80eb3fead1cc8a822a_129_0.png)


    Figure 5.10 – UiPath Action Center


    With UiPath Action Center, an unattended automation can send **actions** to Action
    Center that can then be assigned to specific humans to review. This allows for
    similar prompting provided from Validation Station or from input dialogs, just
    with Action Center storing the action for the human to interact with. Once the
    human interacts with their assigned action, an unattended automation can then
    pick up the user''s input and continue with its task.


    # Considerations for using unattended automation


    With the scheduled nature of unattended automation come a few considerations around
    scheduling, documentation, and performance. Since unattended automations need
    a dedicated machine in order to perform automation jobs, there must be a machine
    available to run the automation, else the to-be performed automation must wait
    until a machine is freed up. If not planned correctly, this could lead to **service-level
    agreement (SLA)** issues with items not being completed in a timely manner. To
    resolve this, there could be a one-to-one mapping between automations and machines;
    that way, an automation always has a machine available when it''s scheduled to
    run. Unfortunately, this could bring up issues with machine allocation and licensing,
    as additional machines and licenses will incur additional costs to the automation
    program. Automation programs should carefully balance automation schedules based
    on the machines they have provisioned.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'In addition to scheduling challenges, documentation and performance are additional
    considerations for unattended automations. While the documentation for unattended
    automations doesn''t need to tell the end user how the automation works, it should
    tell the end user what to expect from the automation and how to handle issues,
    should exceptions arise. Performance-wise, it can be easy to over-allocate an
    unattended automation with transaction items, only to see that the bot cannot
    perform as many items as originally planned. To alleviate this, you need to investigate
    leveraging queues, allowing multiple bots to perform the task simultaneously.


    An unattended automation is a great resource to leverage when dealing with longer
    processes that can be scheduled. It allows the business to have an automation
    running in the background, and to complete transactions more timely, efficiently,
    and with greater frequency than a human user. However, with these features also
    come considerations around documentation and performance that can impact the end
    user''s experience and increase the implementation cost if handled incorrectly.
    With a lack of documentation, end users may not understand how to handle potential
    exceptions or errors from automation, leading to support requests that can burden
    a support team. This lack of documentation can also lead to a misunderstanding
    about the types of exceptions raised by unattended automation, where specific
    exceptions must be handled by the end user. This misunderstanding can leave a
    bad impression, as end users may lose faith in the performance of the automation.


    # Designing automation for the best user experience


    After choosing the type of automation that best fits the automation opportunity,
    we can move further into designing the overall solution. Successful automation
    implementations make it easy for users to engage and interact with automation;
    *the goal of automation is to augment human capacity, not burden it with additional
    rules and procedures to follow.* Thus, when designing for the best user experience,
    we should explore the inputs and outputs of the automation, and their interaction
    with the human user.


    Providing data is a common ask for humans to perform prior to an automation beginning
    its execution. This type of input could be data from a system, such as a Case
    ID of an opportunity in Salesforce, or very commonly a path to a file saved to
    a shared or local drive. Many automations ask the human user for an exact input,
    such as the following:


    +   - An exact filename (`ME_Report_MM.DD.YYYY.xlsx`)

    +   - An exact wording convention (`Subject: Month End Report MM.DD.YYYY`)'
  merge: -1
  img_proc: true
