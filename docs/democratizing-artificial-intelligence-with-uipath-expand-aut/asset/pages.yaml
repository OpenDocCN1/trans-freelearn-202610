- pgno: 95
  md: '# Best-fit assessment


    Not all opportunities are the best fit for sole automation; therefore, the **Best-Fit
    Assessment** is an initial exercise to test the suitability of an automation opportunity.
    Before diving into the details of feasibility and impact potential, the opportunity
    should be reviewed to determine whether RPA or another technology is the best
    fit for the opportunity.


    As we start assessing automation opportunities, we can leverage the following
    matrix to easily determine RPA suitability:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_95_0.png)


    Figure 4.5 – Automation opportunities can be plotted within one of the four quadrants


    +   - **No automation:** Generally, we want to be cautious of opportunities that
    involve frequent process and environment changes (for example, volatile system
    environments and frequent procedural changes). Thus, when assessing opportunities,
    we want to stay away from processes that are highly physical and contain volatile
    processes or systems.

    +   - **High-cost automation:** As opportunities drift toward being more digital,
    we start to cover use cases that are exclusively performed on computers. Consideration
    of the volatility of systems and environments is still necessary. However, process
    changes might require the integration of new software components or tools – in
    many cases, cognitive computing is necessary, such as image recognition.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '+   - **Semi-automation:** As we drift downward into more static processes
    and environments, opportunities that contain more physical steps can potentially
    be semi-automated. While RPA cannot cover the physical steps, there is still an
    opportunity to rescope or reengineer the opportunity for automation.

    +   - **Zero-touch automation:** Lastly, the best use case opportunities are fully
    digital and contain stable systems/environments. These are well suited for automation
    even if we need to include cognitive components.


    During the best-fit assessment, you should sit with the process owner or a **Subject-Matter
    Expert (SME)** of the process to probe into the details of the as-is process.
    By learning more about the process and how it''s performed, referencing a checklist
    such as in *Figure 4.6* can help you decide whether the opportunity is fit for
    automation:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_96_0.png)


    Figure 4.6 – An example best-fit checklist


    When reviewing an automation opportunity for best fit, first, we must review whether
    the opportunity contains the characteristics of typical automation (that is, requires
    manual interactions, is repetitive in nature, has standard inputs, is time-consuming,
    and is rules-based) or of cognitive automation (that is, probabilistic in nature,
    high variability, and unstructured data). If the opportunity does not conform
    to these characteristics, then the opportunity likely needs to undergo some process
    improvement exercises to make the process fit for automation.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'If the opportunity conforms to the characteristics of typical or cognitive
    automation, then we must next check to see whether the processing method can stay
    unchanged. If we find that the transactions of a process could be handled by an
    application (for example, using ServiceNow to handle service tickets instead of
    RPA), then the opportunity might be better fit for self-service than automation.


    If we can continue, then we need to ensure that the opportunity has enough volume
    to support the building of the automation. This will tie in with the viability
    assessment, but generally, we want to look at automation opportunities that are
    performed on a regular basis (daily, monthly, or even quarterly) that contain
    a high number of transactions. If the volume is low, the opportunity may be a
    better fit for another solution outside of automation.


    Finally, if we can continue, we need to check whether any system changes would
    be required for automation. For automation, we want to ensure application and
    system stability, so we want to check for the following:


    +   - The applications or systems aren''t changing soon.

    +   - There is already functionality (or upcoming functionality) within the existing
    applications and systems that would be best for the opportunity.


    In addition to the example best-fit checklist shown earlier, UiPath''s Automation
    Hub includes an automation potential score to indicate the best fit (*Figure 4.7*):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_97_0.png)


    Figure 4.7 – The automation potential score within Automation Hub'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'The automation potential score within UiPath Automation Hub will output a percentage
    based on the following:


    +   - How structured the input data is

    +   - Process variability

    +   - How digitized the input data is


    By completing the best-fit assessment, we can gauge the potential of fitting an
    opportunity with automation. With the best-fit assessment completed, we can move
    on to gauge how difficult implementing automation would be with the feasibility
    assessment.


    # Feasibility assessment


    Once RPA is determined as the best fit for the opportunity, the next assessment
    should be determining the ease of implementation, known as the Feasibility Assessment.


    When checking for feasibility, we want to check several factors that can raise
    the complexity of development efforts:


    +   - **The number of screens:** RPA works at the application layer, so with every
    new screen (or window) added to a process, a developer would need to configure
    automation to interact with elements on each page. The number of screens can also
    be taken as a proxy for the number of steps.

    +   - **The type of application:** The application type is a large contributor
    to complexity. Applications such as Java or Citrix might increase the complexity
    of development, while others such as Mainframe, Web, or Microsoft-based applications
    might decrease complexity. Another point to consider is not only the type of application
    but the number of applications too, as more applications in a process increase
    the amount of configuration a developer would need to develop.

    +   - **Variations/scenarios/exceptions:** Any variation in the process (for instance,
    the if-else types of rules) will lead to an increase in complexity, as more development
    time will be needed to handle each variation.

    +   - **Structured inputs:** Input type is another factor affecting complexity.
    Input type can vary between machine-readable inputs (text) and digital inputs
    (scanned PDFs), leading to different methods of reading text. In addition to the
    input type, the structure of the input (for example, standardized, semi-structured,
    or unstructured) also contributes to complexity. An automation that needs to interpret
    free text from an email body will be more complex to develop than an automation
    that searches for static email subject lines.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   - **Quality control**: Certain use cases might require a high level of
    accuracy and/or **strict service-level agreements (SLAs)**. While automation can
    improve accuracy by always having the same series of steps, processes that require
    more complex components (such as **Optical Character Recognition** or **OCR**)
    might be more difficult to maintain at a high level of accuracy.

    +   - **Image-based automation**: Automation that must interact with VDIs, Remote
    Desktop, or Citrix-based applications can increase development complexity. While
    UiPath''s Remote Desktop and Citrix extensions have made the development of remote
    desktops easier, some components of development could require image-based automation
    that can increase development and testing times.

    +   - **Regulatory compliance**: Many process opportunities come with regulatory
    obligations, especially from a banking or healthcare space. Regulatory compliance
    might require additional scope meetings, approvals, and audits to ensure automation
    is compliant.


    The responses from the preceding factors can be combined to get a rough estimate
    of process complexity. The following table (Table 4.3) can be referenced to show
    how process characteristics map to process complexity:


    | Process Characteristics (Non-Exhaustive) | Process Complexity | Low | Medium
    | High |

    |---|---|---|---|---|

    | # of Applications |  | 0 - 3 | 3 - 5 | 5 - 7 |

    | # of Fields |  | 1 - 99 | 100 - 200 | 201 - 300 |

    | # of Process Steps |  | 1 - 20 | 20 - 60 | 60+ |

    | # of Screens |  | 0 - 10 | 11 - 20 | 21 - 30 |

    | # of Variations |  | 0 - 3 | 4 - 6 | 7 - 8 |

    | # of Exceptions |  | 1 - 10 | 10 - 20 | 20+ |

    | Process SLAs? |  | No | Yes | Yes |

    | Image-Based Automation? |  | No | No | VDI/Remote Desktops |

    | Number of Input Formats |  | 2 - 3 | 3 - 5 | 5 - 7 |


    Table 4.3 – The process complexity matrix'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'By mapping all of the process characteristics that increase complexity within
    a matrix, we can effectively run a high-level estimate on the complexity of an
    automation opportunity by fitting the details of the opportunity into the matrix.
    Then, by assigning timelines to each process complexity (for example, low complexity
    taking 3–4 weeks), we can also run a high-level estimate of how long an implementation
    might take.


    Similar to the best-fit assessment shared earlier, UiPath''s Automation Hub includes
    an ease of implementation score to indicate feasibility (Figure 4.8):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_100_0.png)


    Figure 4.8 – The Ease of Implementation score within Automation Hub


    The ease of implementation score within UiPath Automation Hub will output a percentage
    based on the following:


    +   - Process stability

    +   - Application stability

    +   - How structured the input data is

    +   - Process variability

    +   - Process length

    +   - The number of applications used'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'By completing the feasibility assessment, we can gauge how difficult implementing
    automation would be to a particular process. If the automation opportunity passes
    the feasibility assessment, we then need to review the potential impact of the
    opportunity to justify the development cost with the viability assessment.


    # Viability assessment


    After determining the best fit and feasibility of the opportunity, a business
    case should be created to justify the value or impact of implementing automation.
    There are many ways to capture an automation''s value. The following list of benefits
    are examples of typical automation ROI:


    +   - **Cost savings**: Cost reduction from **Full-Time Equivalent (FTE)** savings

    +   - **Productivity gain**: Improvement in turnaround time or an increase in
    the number of volumes handled.

    +   - **Error reduction**: A reduction in error due to the automated nature versus
    the tendency for errors from manual human interaction

    +   - **Client satisfaction**: The increase in client (internal or external) satisfaction
    due to automation performance and output

    +   - **Flexibility**: The ability to scale and descale during changes in volume

    +   - **Business agility**: The indirect impact on downstream business units to
    act/respond at a quicker pace due to improved turnaround time by automation

    +   - **Compliance**: The increased ability to comply with regulatory requirements
    (such as the ability to fully audit automated transactions or the ability to restrict
    automation access)


    Ideally, the benefits derived from an automation opportunity should align with
    the target goals we discussed earlier, so an analyst should take all considerations
    into account when ranking an opportunity. While more emphasis is generally placed
    on the qualitative measures of impact (such as cost savings and productivity gain),
    softer types of impact (such as satisfaction and error reduction) can also be
    valuable measures of automation impact.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Similar to the best-fit and feasibility assessments, UiPath''s Automation Hub
    (*Figure 4.9*) provides a benefit score to measure viability:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_102_0.png)


    Figure 4.9 – The Benefit score within Automation Hub


    If you are trying to capture time savings, the benefit score within Automation
    Hub is a great way to estimate the potential benefit in hours saved per year.


    By completing the best-fit, feasibility, and viability assessments, we should
    be able to trim our backlog of automation opportunities into those most probable
    to provide value and impact to the organization. Now that our opportunities are
    vetted, we can continue with prioritizing the remaining opportunities within our
    pipeline.


    # Prioritizing the pipeline


    After an opportunity has gone through the evaluation of best fit, feasibility,
    and viability, the opportunity is now ready to be placed into the **Use Case Backlog**.
    This backlog consists of all the opportunities that have been vetted and are ready
    for development efforts.


    In order to prioritize this backlog, we can map each opportunity based on its
    complexity and its value, all derived from the assessment exercises we performed
    earlier. To help better compare opportunities, we can create a 2 x 2 matrix, with
    complexity as our y axis and benefits as our x axis:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/05268897c8ac5d80eb3fead1cc8a822a_103_0.png)


    Figure 4.10 – Mapping automation opportunities into quadrants


    Within this matrix, we will map opportunities into one of four quadrants:


    +   - **Long-term improvements**: These are higher complexity automations that
    provide little to no benefit. Generally, try to avoid these types of projects,
    and probe into other types of improvements such as system/application upgrades,
    process improvements, then automation.

    +   - **Must-do improvements**: These are opportunities that provide greater benefits
    but are more complex to develop. Most cognitive use cases would reside within
    this bucket. They are best to tackle must-do improvements once all the quick wins
    have been exhausted.

    +   - **Low-hanging fruit**: These are opportunities that provide fewer benefits
    but are easier to develop. They are best when needed to show the art of the possible,
    but should not be tackled if there are quick wins available.

    +   - **Quick wins**: These are the perfect type of opportunity; they should be
    at the top of any pipeline. Quick wins provide quick impact at a low cost, and
    all quick wins should be exhausted before moving on to the must-do improvements
    or low-hanging fruit.'
  merge: -1
  img_proc: true
- pgno: 104
  md: "From these four quadrants, we can start to create an implementation plan –\
    \ strategizing how we plan to build the automations within our pipeline. By taking\
    \ a phased approach, we can split our implementation plan into distinct waves,\
    \ aligning each of the quadrants into a distinct wave:\n\n+   - **Wave 1:** The\
    \ first wave of our implementation plan should be focused on showcasing value\
    \ and impact. Therefore, we should be selecting the use cases identified as *quick\
    \ wins* and *low-hanging fruit* first. These use cases should be lower complexity\
    \ with notable impact – not only showcasing the potential viability of automation\
    \ but also getting a broader buy-in from stakeholders.\n+   \n+   - **Wave 2:**\
    \ During the second wave, we want to continue showcasing the impact of the first\
    \ wave. We should keep our approach centered on completing all the *quick wins*\
    \ and *low-hanging fruit* within the pipeline. By the end of the second wave,\
    \ confidence and excitement around automation should be building. It is not uncommon\
    \ for the pipeline to continue organically growing as more business units see\
    \ the success of automation.\n+   \n+   - **Wave 3:** By the third wave, our original\
    \ list of *quick wins* and *low-hanging fruit* should be exhausted. By this point,\
    \ our focus can be shifted to the other quadrants, *must-do improvements* and\
    \ *long-term improvements*. Additionally, it is not uncommon to take on more complex\
    \ style use cases during this wave. Building on the value-generation theme of\
    \ waves one and two, wave three can be focused on showcasing the \"art of the\
    \ possible\" by venturing out into more complex use cases, such as the cognitive\
    \ style use cases, which we will focus on in later chapters.\n+   \n+   - **Wave\
    \ 4+:** By the fourth wave, the automation program should be churning out automation\
    \ projects like an assembly line. The development team should be working on the\
    \ *must-do improvements* and the *long-term improvements*, but we should also\
    \ be focusing on and prioritizing any incoming *quick wins* or *low-hanging fruit*\
    \ that come organically. Like in wave two, as business units see the value of\
    \ automation, it's not unheard of for those groups to start sending requests and\
    \ ideas for new automation opportunities. However, these opportunities must still\
    \ be assessed for best fit, feasibility, and viability before being placed into\
    \ the backlog of ready-to-implement opportunities.\n\nEven with our use case backlog\
    \ prioritized and ready for implementation, we should always be actively looking\
    \ for additional automation opportunities to keep the pipeline flowing – either\
    \ by reviewing the results of our top-down approach and targeting new business\
    \ units to showcase automation or casting a net by trying out more bottom-up approaches."
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Looking at the end-to-end process


    Now that we have our pipeline created and an implementation plan regarding how
    to prioritize the pipeline, we can get started with the first steps of implementation
    – reviewing the current state.


    Because of the general low complexity of implementing RPA, it is common with many
    organizations to leverage automation within the current state of an existing process.
    In general, RPA does not require much, if any, process reengineering since RPA
    interacts at the desktop level. This makes it very easy to fall into the trap
    of automating the *as-is* process. Automating the *as-is* nature of a process
    ensures quick development efforts and low change management, which is something
    that new automation programs gravitate toward in order to showcase quick value,
    but we run the risk of missing out on any additional value and impact that could
    be generated if the *as-is* process was investigated and reengineered into a *to-be*
    process. Every project that involves RPA, whether it be a *quick win* or a *long-term
    improvement* from the previous section, should be combined with some level of
    process understanding, analysis, and reengineering. Therefore, it is important
    to review the current state of an automation opportunity with a process reengineering
    hat on; we do this by looking to optimize the process before applying automation
    and by looking upstream and downstream within a process.


    Implementing automation in a particular process opens the window for revisiting
    the process as a whole and how it’s executed. Often, existing business processes
    are overly complex, usually a result of an old process that was never fully examined,
    and full of unnecessary steps that could be eliminated. To add to the complexity,
    most business processes are not fully standardized, nowhere near optimal, and
    most often, not documented. These are all great reasons to apply process reengineering
    exercises. Reengineering the process can provide us with benefits, such as the
    following:


    +   - **Process clarity**: Reengineering the steps of the process provides the
    opportunity to create updated process documentation – ensuring all colleagues
    understand the process and perform the process consistently.

    +   - **Standardized procedure**: The removal of unnecessary process steps and
    the standardization of inputs and process steps can streamline operations and
    improve the efficiency of the business process.

    +   - **Maximized impact**: By optimizing the process, we can more likely surpass
    the targeted business objectives of the business unit.

    +   - **Maximized ROI**: By reviewing the big picture, we can potentially generate
    an additional, indirect, level of impact and value provided to process the upstream
    and downstream of the automation opportunity.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'As part of understanding the automation opportunity, you should ask the process
    owner and SMEs for any existing documentation or standard operating procedures.
    Unfortunately, it is not uncommon for process knowledge and understanding to be
    quite low; what you might quickly start to realize is that a lot of these processes
    are not documented at all, and a lot of these processes are performed differently
    by each employee completing the task. Even with process documentation, you should
    schedule meetings with the SMEs to walk through the process live. We''ll discuss,
    in more detail, how to run these process walk-throughs in later chapters, but
    it''s important to hold walk-throughs with multiple SMEs completing multiple cases
    or variations within the process. Typically, each employee follows what they understand
    to be the best practice; this can lead to differing procedures by each employee.
    The benefit of capturing the steps of multiple employees is that you now get a
    glimpse of what steps work and what steps don''t work within a process. This should
    ultimately lead to significant improvements in the process being automated, as
    we only consider the most optimal steps within a business process.


    As part of current state process walk-throughs with SMEs, it''s important to question
    decision points within the process or any judgment calls made by the SMEs. Most
    decision points within the process should be definable with a set of business
    rules; always question whether an SME says the rule for a decision point is based
    on experience – often, you can create a set of rules for an automation to follow.
    Unfortunately, there might be times when a judgment call is required and automation
    cannot be followed by a set of rules. In that case, we can potentially turn to
    the cognitive techniques of later chapters to alleviate that gap.


    These process walk-throughs act as the first step in optimizing the process and
    getting it ready for automation. Conducting process walk-throughs will give us
    intimate knowledge about the process at a keystroke level, immersing us into the
    intimate details of the current state. It might be easier to be fully tunneled
    into the process and forget about the big picture; however, to truly optimize
    a process, and generate the most impact, it''s important to consider what the
    process connects from and what the process connects to, that is, upstream processes
    and downstream processes. Taking a step back to look at the big picture and analyze
    the upstream dependencies and downstream impacts of a process opens up the possibility
    of identifying additional benefits and opportunities for greater value extraction.


    Going back to our HR onboarding example from the *Identifying target goals* section,
    we can see that there are many subprocesses within the larger onboarding process
    (*Figure 4.11*). Most of these subprocesses likely have opportunities to integrate
    automation, but by focusing too much on one specific subprocess and not the entire
    process, we might not uncover the mammoth-sized opportunities that could generate
    a greater impact:'
  merge: -1
  img_proc: true
- pgno: 107
  md: <!-- no content -->
