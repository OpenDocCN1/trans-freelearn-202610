    started.


    +   3. In the main menu, click on the Solution dropdown and select Import Solution.


    +   4. Once the Solution Library page appears, select Druid Starter and then select
    Import Solution.


    With the Druid Starter template installed, we have a good foundation for us to
    build off of. Let''s get started with creating some conversational flows.


    # Editing the Welcome flow


    The first flow of the Druid Starter template is known as the Welcome flow. The
    purpose of this flow is to welcome the user when they first interact with a chatbot.
    If you navigate to the flows of the project (click Flows under Solution Contents),
    you will notice our Welcome flow, named first-welcome-flow, as illustrated in
    the following screenshot:'
