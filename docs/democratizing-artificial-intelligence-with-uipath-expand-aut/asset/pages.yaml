    # Understanding the critical success criteria in choosing a cognitive automation
    platform


    A few years ago, automation and Robotic Process Automation (RPA) were synonymous.
    Many companies began their automation journey with RPA alone. In addition, IT
    ran RPA in the backroom. Over the years, automation technologies have evolved.
    Nowadays, companies use RPA, Machine Learning (ML), AI, chatbots, and NLP in their
    cognitive automation programs. Also, it becomes apparent that robots cannot do
    it alone. Collaboration between humans and robots is the key to unlocking the
    potential of automation.


    It is important to select the right platform. You will learn the critical success
    criteria in choosing an automation platform that can support the cognitive automation
    transformation.'
