- pgno: 304
  md: "# Building an automation workflow\n\nWith the **First run** parameter set to\
    \ run every 7 days, the full pipeline is set to run with new datasets. In the\
    \ next section, we'll look into updating our datasets with validated data.\n\n\
    In order to close the feedback loop, we need a way for a human to validate the\
    \ automation's performance. With Document Understanding, we could use Validation\
    \ Station to retrain a classifier and extractor; however, in this use case, we'll\
    \ use email folders for the end user to move incorrect emails into.\n\nWith the\
    \ `Retrain-Not Spam` and `Retrain-Spam` folders, an end user can move an incorrectly\
    \ classified spam email into the `Not Spam` folder, and vice versa. Automation\
    \ can then look into these folders and add the email to the training set, retraining\
    \ our ML skill over time.\n\nThe first step is to build our retraining workflow.\
    \ The objective for the retraining workflow is to add each email from the `Retrain-Not\
    \ Spam` and `Retrain-Spam` folders to a singular CSV file, move each email to\
    \ its destination email folder, and then upload the CSV file to AI Center to be\
    \ added to our training dataset. Follow these next steps:\n\n+   1. In the `Email\
    \ Classification` project, create a new workflow named `Retrain_Model`.\n+   2.\
    \ Create two input parameters, as follows:\n+      - `in_listSpamEmails: List<MailMessage>`\n\
    +      - `in_listNotSpamEmails: List<MailMessage>`\n+   \n+   The parameters are\
    \ shown in the following screenshot:\n\n| Name | Direction | Argument type | Default\
    \ value |\n|---|---|---|---|\n| in_listSpamEmails | In | List<MailMessage> | Enter\
    \ a VB expression |\n| in_listNotSpamEmails | In | List<MailMessage> | Enter a\
    \ VB expression |\n\nFigure 9.29 – Retail_Model arguments\n\n> **Important Note**\n\
    > \n> Make sure to choose package minor version 0 for retraining."
  merge: -1
  img_proc: true
- pgno: 305
  md: '3. Drag a **Build Datatable** activity into the workflow, outputting to a new
    `retrain_DT` variable and building two columns, as follows:


    +   - `text:String`

    +   - `label:String`


    You can see what the data table looks like in the following screenshot:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_305_0.png)


    Figure 9.30 – retrain_DT data table


    4. Drag a **For Each** activity into the workflow, looping through each email
