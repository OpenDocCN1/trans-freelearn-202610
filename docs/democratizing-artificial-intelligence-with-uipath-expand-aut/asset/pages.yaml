- pgno: 271
  md: 'Once AI Center is enabled, we have completed the technical requirements for
    this chapter. In the next section, we will start gathering context about the use
    case by reviewing the current state.


    # Understanding the current state


    Let''s start this use case by learning a little about the current state of the
    process. Every day, the accounting team of *Company ABC* receives invoices submitted
    by vendors as part of its **procure-to-pay (P2P)** process, as illustrated in
    the following screenshot:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_271_0.png)


    Figure 9.5 – Company ABC''s P2P process


    As defined by *Company ABC*, vendors must send invoices to a central inbox that
    the accounting team maintains. As the accounting team receives these invoices,
    they are reviewed for correctness and entered into their system of record, where
    they are reconciled and forwarded to **Accounts Payable (AP)** for payment, if
    all is correct.


    *Company ABC* has been doing extremely well this year, thus has been purchasing
    more goods and services than in years past. This influx in purchasing has put
    a strain on the accounting team as it tries to maintain an efficient P2P process.
    A portion of this strain has been caused by the increase of spam emails received
    within the shared email inbox for invoices. The team wants to be able to effectively
    filter out spam emails so that it can focus on invoices.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Looking at the current state, there appears to be plenty of opportunity for
    automation—reverting to the characteristics of an automation opportunity from
    *Chapter 4, Identifying Cognitive Opportunities*, we can see that this automation
    opportunity has the following characteristics:


    +   - **Manual interactions with applications**: Accounting analysts manually
    interact with the shared email inbox.

    +   - **Repetitive in nature**: The same steps are performed for each email received
    in the shared inbox.

    +   - **Time-consuming**: Reviewing spam emails and cleaning the inbox can be
    time-consuming.


    From a feasibility standpoint, we can easily create automation that monitors an
    inbox for incoming emails, classifying between emails that are spam and not spam.
    Also, from a viability standpoint, automating portions of this process for these
    analysts can provide the following benefits:


    +   - **Increased capacity**: Implementing automation can allow analysts to spend
    more time performing high-value tasks, rather than cleaning an email inbox.

    +   - **Error reduction**: Implementing automation can create a cleaner inbox,
    ensuring that an invoice email is not missed by the accounting team.


    Automation within this process can provide a great deal of impact for the accounting
    team. Creating automation to filter out spam within an email inbox is one of the
    many potential use cases we can build for an accounting team. In the next section,
    we will focus on creating a future state design for implementing automation to
    process receipts.


    # ## Creating a future state design


    With our new understanding of the current state and the pain points of the accounting
    team, we can start with creating a future state design of the automation. Since
    this automation requires no human interaction, creating a future state design
    for this use case is generally straightforward, as depicted in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Future State Design


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_273_0.png)


    Figure 9.6 – High-level future state design


    For this use case, automation will have the responsibility of monitoring the accounting
    team''s shared inbox. The automation can run in the background in an attended
    or unattended scenario, scanning the shared inbox for new emails. Once an email
    is received, the automation will retrieve the email, read its contents, and classify
    the email as spam or not spam based on the contents of the email body. Lastly,
    based on the classification, the automation will route the email to a corresponding
    folder where an accounting analyst can review it. The folders that automation
    will route to are listed here:


    +   - Invoices

    +   - Low Confidence

    +   - Spam

    +   - Retrain-Not Spam

    +   - Retrain-Spam


    The reason for the Low Confidence email folder is to have a landing zone for any
    email that automation has low confidence in classifying. We wouldn''t want to
    have a scenario where an invoice is accidentally placed in the Spam folder, so
    any email the automation has difficulty with will be routed to the Low Confidence
    folder. We''ll also be adding a retraining component to the use case, where incorrectly
    classified emails can be moved to one of the Retrain folders to retrain our ML
    skill.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'To summarize, as the future state design of this use case, the project we intend
    to build can be leveraged in either an attended- or unattended-type scenario.
    The automation will monitor an email inbox and route incoming emails based on
    their body contents. Based on the automation''s classification, incoming emails
    will be routed to one of three folders. The end user can then more quickly review
    invoices, without needing to continually clean the shared inbox with this automation.


