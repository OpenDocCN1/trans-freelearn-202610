    Configure Classifiers


    Figure 6.21 – Leveraging multiple classifiers at once


    Within the Classification Scope activity, we place Keyword Based Classifier and
    Intelligent Keyword Classifier together to provide a more robust level of classification.
    We''ll cover the different types of classifiers later, but let''s configure a
    couple of classifiers with the Classifiers Wizard.


    By clicking the Configure Classifiers button in the Classifiers Scope, we are
    greeted with a wizard that showcases our two classifiers, and our document types
    defined in our taxonomy (Figure 6.22):'
