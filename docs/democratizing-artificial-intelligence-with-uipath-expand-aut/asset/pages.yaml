- pgno: 345
  md: '# 11


    # AI Center

    Advanced Topics


    In the previous chapters, we saw how we could leverage **machine learning (ML)**
    to assist with receipt processing and email classification. While these use cases
    are very popular, there are many other types of use cases that **Named Entity
    Recognition (NER)** models or custom ML models can be applied to.


    In this chapter, we will cover the following topics:


    +   - **Named Entity Recognition (NER)** with AI Center

    +   - Deploying your own custom models to AI Center


    We will introduce the concept of NER, a task that opens new types of use cases
    we can apply ML to. We will also venture into deploying custom Python ML models
    into AI Center, as there are many instances where organizations have their own
    prebuilt ML models that can be leveraged with RPA.


    Once complete, we will have an understanding of how to leverage UiPath''s NER
    capabilities, as well as how to connect your own custom Python models to AI Center.'
  merge: -1
  img_proc: true
