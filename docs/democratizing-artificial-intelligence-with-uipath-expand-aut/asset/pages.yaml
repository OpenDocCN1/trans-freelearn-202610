- pgno: 13
  md: '# # Preface


    **Artificial intelligence (AI)** enables enterprises to optimize business processes
    that require cognitive abilities, are probabilistic, and have high variability
    and unstructured data in terms of documents, images, and voice. RPA developers
    and tech-savvy business users do not have a high barrier to using AI to solve
    everyday business problems. This practical guide to AI with UiPath will help AI
    engineers and RPA developers working with business process optimization to put
    their knowledge to work. The book takes a hands-on approach to implementing automation
    in business use cases in no time.


    Complete with step-by-step explanations of essential concepts, practical examples,
    and self-assessment questions, this book begins by helping you understand the
    power of AI and gives you an overview of leveraging relevant out-of-the-box models.
    You''ll learn about cognitive AI in the context of RPA, the basics of machine
    learning, and how to apply cognitive automation within the development life cycle.
    You''ll then put your skills to the test by building three use cases with UiPath
    Document Understanding, UiPath AI Center, and DruId.


    By the end of this AI book, you''ll be able to build UiPath automation with the
    cognitive capabilities of Document Understanding and AI Center while understanding
    the development life cycle.


    # ## Who this book is for


    AI engineers and RPA developers who want to upskill and deploy out-of-the-box
    models using UiPath''s AI capabilities will find this guide useful. A basic understanding
    of robotic process automation and machine learning will be beneficial, but not
    mandatory, to get started with this UiPath book.


    # ## What this book covers


    *Chapter 1, Understanding Essential Artificial Intelligence Basics for RPA Developers,*
    will cover the key AI concepts that are relevant in your daily work as an RPA
    developer.


    *Chapter 2, Bridging the Gap between RPA and Cognitive Automation,* will explore
    in detail the benefits of adding cognitive automation to your **Robotic Process
    Automation (RPA)** toolkit.'
