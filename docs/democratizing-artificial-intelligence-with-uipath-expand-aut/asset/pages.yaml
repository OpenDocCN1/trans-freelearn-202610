- pgno: 149
  md: 'We will also leave the **DegreeOfParallelism** property to 1. By default, the
    property is set to 1. If we were to set it to -1, UiPath uses the number of cores
    on the machine to process pages in parallel. Any other positive value uses that
    specific number of logical processors to process pages.


    Additional information on the Digitize Document activity and when to use OCR can
    be found at https://docs.uipath.com/document-understanding/docs/digitization-overview.


    We have now loaded the taxonomy and digitized our invoice document. In the next
    section, we''ll learn about classifying the invoice document.


    # Introducing classification


    After digitizing our input data into machine-readable text, our automation can
    now interpret the text within our input document. However, while our automation
    can read the text, it still does not know what type of document it read; thus,
    the next step is to have the automation classify the text. Classification in the
    Document Understanding framework is using digitized input data to identify what
    type of document is input.


    Document classification becomes extremely important when an input document contains
    multiple document types (Figure 6.18):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_149_0.png)


    Figure 6.18 – Classifying documents from an input'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'For example, if we were to have a 15-page PDF containing a mixture of documents
    such as background forms, W2s, and 1099s, then with classification, we can split
    the 15-page document into small subsets based on the document type. If a file
    contains one document type, then classification will return just one classification
    result, but if a file contains multiple document types, then the classification
    result will return the document types found, along with their corresponding page
    ranges.


    In the next section, let''s look at the Classify Document Scope activity.


    # Introducing the Classifiers Scope


    Classification of a document is performed via the **Classify Document Scope**
    activity:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_150_0.png)


    Figure 6.19 – The Classify Document Scope activity'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Within the Classify Document Scope activity, notice the Input and Output parameters:


    +   - **Input:**

    +     - **Document Path**: The full path to our target document

    +     - **Taxonomy**: The taxonomy returned from the Taxonomy Manager

    +     - **Document Text**: The document text returned from digitization

    +     - **Document Object Model**: The DOM returned from digitization

    +   - **Output:**

    +     - **Classification Results**: The results stored in an IReadOnlyList<ClassificationResult>
    object, containing results such as classification confidence and OCR confidence
    (Figure 6.20):


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_151_0.png)


    Figure 6.20 – An example of the classification results'
  merge: -1
