- pgno: 108
  md: 'To wrap up, our automation pipeline should be prioritized in a manner that
    quickly generates the enterprise value. In the early stages of a program, our
    focus should be on building out *quick wins* and *low-hanging fruit*, that is,
    opportunities lower in complexity that generate value. As we venture out and gain
    more experience, we can dive into the *long-term improvements* and the *must-do
    improvements*. To ensure that we deliver value, as we choose automation opportunities
    from the pipeline, it is important to first sit down with the SMEs and review
    the current state of the process. During this analysis of the current state, we
    should consider optimizing the process, as implementing RPA into a process is
    a great opportunity to add process improvement, if possible. As part of process
    improvement, we should always take a step back and investigate any upstream and
    downstream dependencies, as improving those dependencies can provide additional
    layers of impact that generate the enterprise value.


    In this section, we reviewed how to evaluate potential automation opportunities
    with the best-fit, feasibility, and viability assessments. Then, we ventured into
    organizing the remaining opportunities that passed our assessments, prioritizing
    our pipeline. Once prioritized, we ventured into reviewing the full end-to-end
    state of the automation opportunity in order to grab a full understanding of the
    question at hand. These steps are all critical when trying to ensure our pipeline
    is filled with meaningful automations. As we venture into the next section, we
    will dive into the specific characteristics to probe for when assessing cognitive
    automation opportunities.


    # Probing for cognitive automation


    When assessing automation opportunities, there likely will be opportunities that
    are too complex for traditional automation but are compelling for cognitive automation.
    In addition to the characteristics of cognitive opportunities discussed earlier
    (*probabilistic in nature, high variability,* or *unstructured data*), it is pivotal
    to ask the correct questions with the correct participants when assessing automation
    opportunities for cognitive automation.


    For initial conversations about the automation opportunity, it''s important to
    have the following participants available for the process workshops:


    +   - Process owner

    +   - Data scientist (if available)

    +   - RPA solution architect

    +   - Process SME

    +   - RPA business analyst'
  merge: -1
  img_proc: true
- pgno: 109
  md: <!-- no content -->
