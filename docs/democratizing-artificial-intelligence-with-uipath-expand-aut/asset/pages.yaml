- pgno: 35
  md: '# # 2


    ## Bridging the Gap

    ## between RPA

    ## and Cognitive

    ## Automation


    In this chapter, we will explore in detail the benefits of **cognitive automation**
    over pure **robotic process automation (RPA)**. It is critical to deep dive into
    the **spectrum of office work** to understand the automation technology stack,
    the gap between RPA and cognitive automation, and the importance of human-machine
    coordination in making it work. We will also explore many real-life business problems
    for you to reimagine the art of possible automation potentials.


    In this chapter, we will cover the following main topics:


    +   - Understanding the spectrum of office work

    +   - Exploring the gap between RPA and cognitive automation

    +   - Designing human-machine collaboration with cognitive automation'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'By the end of the chapter, you will have learned how to approach business problems
    through a new lens of cognitive automation. You will know how to review automation
    opportunities holistically and how to design the optimal human-machine collaboration.


    # Understanding the spectrum of office work


    We all wear many hats at work. If we look closely at our daily activities, each
    activity requires a specific skill set. Some are predictable and rule-based, while
    others require more cognitive power. To achieve the fullest extent of automation
    potentials, we must explore the details of the spectrum of work. We will focus
    on office work and not physical work in this book.


    For any occupation, office work can be categorized into four categories.


    For more information, you can refer to the following link:


    ```

    https://www.mckinsey.com/~/media/mckinsey/business%20functions/mckinsey%20digital/our%20insights/where%20machines%20could%20replace%20humans%20and%20where%20they%20cant%20yet/where-machines-could-replace-humans-and-where-they-cant-yet.pdf

    ```


    The following diagram shows the breakdown of office work and its characteristics:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_36_0.png)


    Figure 2.1 – The spectrum of office work


    In the spectrum of office work, there are four categories of activities. They
    are **data collection, data processing, applying expertise,** and **stakeholder
    interaction.**'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# # Data collection


    **Data collection** is an activity that involves finding, extracting, and outputting
    data from many sources and systems to the destination system. In many cases, the
    most resource-intensive tasks are cleansing and formatting data according to a
    set of specific rules. These tasks generally have higher automation potentials.
    The following example illustrates different types of data collection efforts and
    challenges.


    In the hire-to-retire process in **human resources (HR)**, data collection takes
    up significant time. Employers spend a lot of time and resources in collecting
    employee life cycle data. Employers leverage **enterprise resource planning (ERP)**
    systems to minimize their efforts and time. However, there is still a lot of manual
    work and coordination that is not automated yet. Let''s look at the employee onboarding
    process. The onboarding process includes the following data input from a variety
    of sources:


    +   - A work authorization document is often a scanned copy of a physical document
    by the HR professional.

    +   - Employee basic demographics data is usually collected via the employee portal.

    +   - The background check result is transferred from the background check company
    to the employer electronically.


    # # Data processing


    **Data processing** is the manipulation of data elements into meaningful information.
    In data processing, rule-based straight-through processing is possible for clean
    data elements. Unfortunately, data is never 100% clean. There is always a need
    to process exceptions. Data processing is known as one of the first automated
    processes developed. With cognitive automation technology maturing, the automation
    potential to get rid of exception handling is increasing. The following example
    illustrates different types of data processing efforts and challenges.


    Auditing is a high-paying profession. Both internal and external auditors have
    gone through extensive education and on-the-job training to hone their skills.
    However, they are also burdened with many data processing activities to complete
    audit procedures and produce audit reports. They spend limited time on problem
    solving and working with their clients to communicate and influence better business
    practices. Here are some resource-intensive data processing activities by auditors
    that have automation potential:


    +   - Collect, follow up, and file requested documents for audits

    +   - Perform procedural testing on systems according to controls requirements

    +   - Download various system reports to ensure data integrity across systems'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   - Look for keywords and the associated context in documents for potential
    violations

    +   - Review handwriting, approval stamps, and signatures in hardcopy documents


    # Applying expertise


    **Applying expertise** is the ability to solve a problem with a collection of
    skills that are acquired through experience. There are two levels of expertise,
    as outlined here:


    +   - **Routine expertise:** This relies on repeated procedures from the past
    to consistently solve problems

    +   - **Adaptive expertise:** This is the ability to not just solve problems but
    solve them in new ways


    There are many activities in our office work that require expertise. Expertise
    demands higher cognitive ability and is harder to automate. **Machine learning
    (ML)** is successful in automating routine expertise but is still developing its
    algorithms to handle adaptive expertise. The two following examples illustrate
    different types of applying expertise efforts and challenges:


    +   - *Example 1:* Ingesting and interpreting invoices from paper or **Portable
    Document Format (PDF)** is a form of applying routine expertise. Before technology
    was available, companies had workers manually read invoices, determine the location
    and content of the invoice data, and then type it into the ERP system. For invoices,
    a data element such as an invoice number can be shown differently. A human worker
    understands that *Invoice Number, Inv. Number, Invoice No.,* and *Invoice #* are
    all referring to the data element invoice number based on many past transactions.
    Nowadays, ML and **natural language processing (NLP)** are available to apply
    this routine expertise to automate this activity.

    +   - *Example 2:* For physicians, decision making can be routine if the patient''s
    symptoms and the diagnosis are known. However, physicians encounter new or unexpected
    situations. **Artificial intelligence (AI)** is currently unable to determine
    what is relevant within new or unexpected situations. Adaptive expertise requires
    higher cognitive power and has lower automation potentials with available technology.'
  merge: -1
  img_proc: true
