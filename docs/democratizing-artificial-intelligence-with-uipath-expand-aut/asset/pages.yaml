    # Introducing digitization


    The next step of the Document Understanding process is digitization. Digitization
    is the process of taking input data and scanning it into machine-readable text.
    Once the data is digitized, we can classify and extract the relevant data fields
    to create actionable steps for automation.


    Digitization in the Document Understanding framework has two outputs:


    +   - The text from the input file (stored as a string variable)

    +   - The Document Object Model (DOM) of the file – the DOM is a JSON object containing
    detailed information about the document


    While digitization is the process of taking input data as machine-readable text,
    it is not just Optical Character Recognition (OCR). Digitization must be done
    with any type of input, digital and physical – any file that is already native
    text (unscanned PDFs or text files) can be read programmatically without the use
    of OCR.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'For documents that require OCR (such as scanned PDFs), an OCR engine can be
    used during the digitization process. OCR engines that are compatible with digitization
    in the UiPath Document Understanding framework are as follows:


    +   - UiPath Document OCR

    +   - OmniPage OCR

    +   - Google Cloud Vision OCR

    +   - Microsoft Azure Computer Vision OCR

    +   - Microsoft OCR

    +   - Tesseract OCR

    +   - ABBYY Document OCR


    Let''s continue with reviewing the Digitize Document activity before moving on
    to the exercise.


    # Digitize Document activity


    For UiPath to digitize a document into a DOM, the Digitize Document activity (Figure
    6.15) must be used within our automation project:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_146_0.png)


    Figure 6.15 – The Digitize Document activity using the OmniPage OCR engine'
  merge: -1
  img_proc: true
- pgno: 147
