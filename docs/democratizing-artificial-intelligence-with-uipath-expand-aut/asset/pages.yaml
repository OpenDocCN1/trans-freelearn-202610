- pgno: 88
  md: 'For many new automation programs, it might be compelling to automate low-complexity
    automations. However, by finding automation opportunities that align with a strategic
    priority, we can make more compelling value propositions and more compelling success
    stories when trying to rally engagement around automation. Therefore, the outcome-driven
    approach starts with leadership, setting a business objective, and forming a hypothesis
    (backed by data) to identify key pain points. Typical business objectives of automation
    programs include the following:


    +   - Growing revenue

    +   - Improving client experience

    +   - Scaling faster

    +   - Improving compliance/regulations

    +   - Reducing cost

    +   - Improving employee experience

    +   - Building a foundation for AI


    Once the business objectives are chosen, an investigation into the organization
    can lead us to create hypotheses that can be potentially resolved with automation.
    For example, if an organization wants to focus on improving employee experience,
    first, we need to dive into what impacts the experience of an employee – ideally,
    job satisfaction and support (for example, feeling valued).


    Knowing what factors influence our business objective, next, we can focus on data
    collection and the investigation into the enterprise. For this example, we are
    looking at employee satisfaction, so we should be collecting any data HR has related
    to satisfaction surveys, support tickets, and more (Figure 4.2):'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Survey Results


    +   1. 68% Found the onboarding process inhibiting productivity during an employee’s
    first months

    +   2. 60% Do not see their work as rewarding

    +   3. 35% Are unable to see professional growth within their position


    # Key Performance Indicators


    | KPI | CURRENT | TARGET |

    |---|---|---|

    | Employee Satisfaction | 70% | 85% |

    | Accuracy | 95% | 97% |

    | Timeliness | 65% | 80% |


    Figure 4.2 – An example of data collection results


    From the data collection, we can start to create hypotheses:


    +   1. A majority of respondents found onboarding to be inhibiting productivity.

    +   **Hypothesis:** Manual setup across multiple applications and systems leads
    to slower onboarding times and reduced productivity.

    +   2. 60% of respondents do not find their work rewarding.

    +   **Hypothesis:** Business units contain a lot of manual and tedious tasks that
    small teams must complete, thus reducing the amount of time that employees spend
    performing rewarding tasks.

    +   3. 35% of respondents cannot see professional growth.

    +   **Hypothesis:** Employees do not have a prescribed career trajectory.

    +   4. The service center has a poor turnaround time.

    +   **Hypothesis:** Many applications and slow data retrieval lead to increased
    turnaround times.


    And from these hypotheses, we can start to pinpoint areas that are necessary for
    further investigation. For this example, let’s investigate hypothesis 1 and venture
    into the onboarding journey of a new employee. In this case, we would want to
    dive into the employee life cycle, reviewing the journey from applying for roles,
    interviewing, accepting the offer, and onboarding. In order to do that, we would
    set up discovery meetings with respective stakeholders from the teams responsible
    for performing those activities. In the next section, we’ll look, in more detail,
    at how to run these types of discovery meetings.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Before we jump into the different approaches for seeking opportunities to automate,
    there are a number of success factors to consider:


    +   - Keep the targeted business outcome at the forefront of ideation.

    +   - Ensure executive alignment and buy-in to maximize impact.

    +   - Avoid exclusively focusing on cost reduction.

    +   - Focus on solving business problems.

    +   - Consider other types of methods and solutions – RPA is just one tool in
    the toolbox.


    Following these success factors can help ensure we identify automation opportunities
    that provide value to the business and the automation program as a whole.


    # Seeking automation opportunities


    As we seek automation opportunities throughout the enterprise, we will notice
    different levels of automation, including levels going from Bottom-Up to Top-Down.
    These types of automation can be referenced in Figure 4.3:


    ![](img/05268897c8ac5d80eb3fead1cc8a822a_90_0.png)


    Figure 4.3 – The types of automation opportunities


    +   - **Enterprise automation** looks at interdepartmental opportunities that
    impact a large population of the organization. These automations might include
    higher complexity technologies such as AI.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   - **Process automation** looks at departmental opportunities that are uniquely
    developed for a department''s set of procedures. These opportunities might provide
    high levels of impact with multiple colleagues confined within a department. Automations
    could include additional technologies such as document understanding, AI, or "human
    in the loop."

    +   - **Task automation** looks at low-complexity opportunities that are for the
    benefit of a limited number of individuals. These automations are built to automate
    the unique tasks an individual performs on a day-to-day basis. In general, these
    opportunities provide a lower impact on automation programs but can lead to a
    larger impact on the individual who is running the automation. These automations
    generally do not include higher complexity technologies.


    As great as enterprise automation is (in terms of impact), successful automation
    programs employ both a top-down and bottom-up approach for pinpointing automation
    opportunities. Not all automations will be at a company-wide level; therefore,
    it is imperative to also search for departmental-level and task-level automation
    opportunities. Let''s investigate a few approaches of top-down and bottom-up ideation
    (please refer to *Table 4.1* and *Table 4.2*):


    |  | **Top-Down Ideation** |

    |---|---|

    |  | *[Illustration of a top-down arrow/diagram]* |

    | **CoE Discovery Workshops** |  |

    | **Approach description** | • Smaller, more focused intake effort where the **Center
    of Excellence (CoE)** targets specific functional areas (of a business) to identify
    discrete automation opportunities in order to answer a general business objective.
    This effort happens in discrete workshops, qualifying ~6–10 opportunities at a
    time. |

    | **Key business responsibilities** | • Identify key resources to support ideation
    efforts and participate in education sessions.<br><br>• Survey opportunities across
    the business for review with CoE. |

    | **Key CoE responsibilities** | • Conduct RPA Education and guide businesses
    to identify opportunities.<br><br>• Facilitate intake workshops and meetings to
    qualify the business opportunities identified. |

    | **Key activities** | • Hold RPA education sessions (as needed) and understand
    the business objectives for leveraging automation.<br><br>• Business to investigate
    opportunities within desired space (or engage CoE to help ideation efforts).<br><br>•
    CoE to hold intake workshops/meetings to qualify opportunities. |


    Table 4.1 – The top-down approach; CoE discovery workshops'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Top-down automations are usually tied to larger enterprise-wide digital transformation
    initiatives. Because these initiatives are well-funded programs that focus on
    the strategic objectives of the company, it’s usually easier to get interdepartmental
    cooperation to participate in ideation exercises. With this cooperation, one of
    the best ways to identify opportunities from a top-down perspective is to submit
    data collection requests, asking for function organization charts (such as sub-functions/how
    teams are organized, headcount, and more). This data will allow us to focus on
    areas of high headcount that we can probe into.


    These identified areas can then be focused on with smaller intake efforts, where
    we can identify discrete opportunities for automation in order to answer a general
    business objective. Once a general business objective has been established (such
    as speeding up tasks for an accounting team), we can investigate the processes
    performed and qualify opportunities for automation:


    | Bottom-Up Ideation |

    |---|

    | Business Ideation and Submission |

    | Approach description | • Larger, exhaustive data collection effort where the
    CoE works with multiple functional areas to cast a net across the enterprise.
    This effort leverages multiple workshops/education sessions to build a pipeline
    of initiatives. |

    | Key business responsibilities | • Define an automation strategy and long-term
    plan.

    • Attend automation education sessions.

    • Submit ideas into Automation Hub for CoE engagement. |

    | Key CoE responsibilities | • Ensure that operating model control processes are
    being followed.

    • Work with the business to forecast demand and plan for building opportunities.
    |

    | Key activities | • CoE invites business leaders to education session(s) to share
    objectives and introduce RPA and Automation Hub.

    • CoE collects automation opportunities in Automation Hub from business leaders
    and participants across the organization.

    • CoE reviews opportunities and identifies use cases for further analysis and
    building. |


    Table 4.2 – The bottom-up approach; business ideation and submission


    From a bottom-up perspective, the approach is somewhat flipped from the top-down
    approach. With bottom-up ideation, ideas need to come from the organization versus
    the targeted approach of top-down.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'For bottom-up, we perform larger data collection efforts where the entire organization
    (or a subset) is given the opportunity to submit automation ideas that they believe
    are impactful. Participants are welcomed to education sessions where they can
    share the objective(s) of automation and the art of the possible. Once educated,
    participants are welcomed to submit potential automation ideas into a central
    repository (such as Automation Hub), where each idea is reviewed for further analysis
    and building.


    Once we''ve completed our exercises to probe for opportunities, our Master Opportunity
    Log should contain a number of opportunities for us to deep-dive into. This master
    opportunity log should be an organized list based on the following high-level
    information that we might have gathered from our ideation exercises, such as the
    following:


    +   - Value

    +   - Complexity (a rough estimate)

    +   - Suitability (a rough estimate)


    This master opportunity log can take many forms – some organizations choose a
    tried-and-true Excel sheet to keep track of the pipeline, but many organizations
    leverage tools such as UiPath''s Automation Hub or Jira to keep track of an automation
    pipeline:


    # Automation Pipeline


