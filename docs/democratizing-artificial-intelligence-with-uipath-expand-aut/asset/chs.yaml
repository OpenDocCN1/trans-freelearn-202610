  \  - `predict(self, input)`：在模型服务时调用的函数，返回字符串\n- 一个名为 `requirements.txt` 的文件，其中包含运行模型所需的依赖项。\n\
  \n如果我们想为 ML 模型添加重新训练和评估组件，则需要以下要求：\n\n- 一个名为 `train.py` 的文件，与 `main.py` 在同一目录中。\n\
  - 在 `train.py` 中，必须实现以下函数：\n\n\n\n\n\n- 3. 选择**上传 zip 文件**，以上传我们准备好的 zip 文件。\n-\
  \ 4. 当出现创建新包的屏幕时，提供一个包名称、描述、输入、Python 语言，并选择压缩包。\n\n我们的 Python 包应类似于图 11.10 所示：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_356_0.png)\n\n图 11.10 – 将包上传到 AI Center\n\
  \n将包上传到 AI Center 时，请务必选择开发模型时使用的正确 Python 版本。由于我们没有包含训练组件，**启用训练**处于禁用状态。\n\n包上传后，将处于*未部署*状态。我们的下一步是通过创建\
  \ ML 技能来部署该包：\n\n- 1. 导航到 AI Center 的**ML 技能**选项卡。\n- 2. 单击**新建**以创建新的 ML 技能。\n\
  - 3. 当出现**创建新的 ML 技能**屏幕时，提供以下内容：\n\n- * 技能名称\n- * *LinearRegression* 包\n- * 最新的包版本\n\
  \n我们的 ML 技能应类似于*图 11.11*：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_357_0.png)\n\
  \n部署后，ML 技能应显示*可用*状态，表示部署成功。在下一节中，我们将创建一个新的 UiPath 项目，并将其连接到我们新创建的 ML 技能。\n\n##\
  \ 与 UiPath 自动化交互\n\n将 ML 技能部署到 AI Center 后，本示例的最后一步是将其与 UiPath 自动化集成：\n\n- 1. 打开\
  \ UiPath Studio 并创建一个新的空白项目。\n- 2. 通过**管理包**按钮添加 `UiPath.MLServices.Activities`\
