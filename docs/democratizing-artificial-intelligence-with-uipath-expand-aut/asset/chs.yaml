- "# 4\n识别认知机会\n\n随着越来越多的组织在工作场所实施 **Robotic Process Automation (RPA)** 和认知自动化，从这些实施中产生价值的重要性从未如此之高。在我们努力识别自动化机会时，自动化的价值主张始终应是核心焦点，并与组织的更高层级目标业务目标和自动化项目的核心愿景相联系。\n\
  \n在识别认知自动化的潜在用例时，收集尽可能多的关于自动化机会的上下文和知识至关重要，以确保 AI Center 和 Document Understanding\
  \ 能够实现用例的目标。因此，在本章中，首先，我们将重点关注如何搜索自动化机会。特别是，我们将了解传统自动化机会和认知自动化机会的特征。如何为企业设定目标，以及如何领导搜索工作以找到自动化机会。在此之后，我们将深入了解自动化机会：学习如何根据最佳匹配、可行性和可行性的维度对自动化机会进行优先级排序，并学习如何通过充分理解自动化机会的端到端流程来最好地捕获价值。到本章结束时，我们将转向讨论在探究认知自动化想法时应考虑哪些项目。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- Searching for automation opportunities\n- Understanding\
  \ the opportunity\n- Probing for cognitive automation\n\n### Searching for automation\
  \ opportunities\n\n价值保障的重要性从未如此之高，因为组织正高度关注从自动化计划中创造即时效益。因此，在机会搜索期间识别、评估规模并批准自动化候选项目时应慎重考虑。为了确保所选机会成功并实现所宣传的效益，你应熟练掌握自动化机会的特征，了解何时应用认知能力，以及了解如何识别自动化可以创造的价值驱动因素。一旦充分掌握自动化机会的特征，你可以采用自上而下或自下而上的不同方法来识别机会，然后运用你的判断来优先考虑机会以进行进一步分析和开发。\n\
  \n在本节中，我们将涵盖以下主题：\n\n- The characteristics of an automation opportunity\n- Identifying\
  \ target goals\n- Seeking automation opportunities\n\n### The characteristics of\
  \ an automation opportunity\n\n在企业内部搜索自动化机会之前，重要的是要充分了解传统 RPA 能做什么，以及更具体地说，将认知能力添加到\
  \ RPA 中可以解锁哪些额外好处。充分掌握这些概念在搜索机会时至关重要——过于频繁地，范围界定不佳的机会会进入组织的自动化管道，这些机会要么不适合自动化，要么无法提供即时的效益来抵消开发和支持的成本。\n\
  \n在之前的章节中，我们对 RPA 是什么以及它能提供什么有了一般性的了解——一种驻留在桌面级别应用程序之上的软件机器人，可以模仿人类交互来执行一系列步骤。这种自动化可以提供很多好处，例如以下内容：\n\
  \n- Logging into applications\n- Scraping data from websites and applications\n\
  - Navigating through application windows and menus\n- Making calculations\n\n因此，在识别严格的\
  \ RPA 候选项目时，我们希望调查具有以下特征的机会：\n\n- 需要与应用程序进行手动交互\n- 具有重复性\n- 具有标准输入\n- 耗时\n- 基于规则且结构化\n\
  \n然而，至关重要的是要理解，RPA 单独只能执行一系列标准化、基于规则的系统活动。在其基本形式中，RPA 非常天真，只会遵循提供的指令。当然，这与任何传统编程或脚本编写类似——你的执行代理（在我们的例子中是\
  \ UiPath 机器人）只会遵循你提供的指令集。不幸的是，这使我们可自动化的机会数量有限，排除了许多需要人类水平的判断或超出传统 if-else 条件序列的思考的用例。\n\
  \n幸运的是，我们现在可以通过将认知能力添加到我喜欢称之为“认知自动化”的功能中来填补这一空白。这使我们有可能重塑自动化的未来，因为我们可以界定传统基于规则的自动化无法解决的更复杂和需要判断的类型机会。许多组织正在利用这项技术来改进其现有自动化，甚至调查其自动化管道并重新审视之前因范围缩小而被排除的、现在可以用认知自动化开发的机会。\n\
  \n对于许多新的自动化项目来说，自动化低复杂度的自动化可能很有吸引力。然而，通过找到与战略重点一致的自动化机会，我们可以提出更有说服力的价值主张，并在试图围绕自动化凝聚参与度时提供更有说服力的成功案例。因此，结果驱动的方法始于领导层，设定业务目标，并形成假设（有数据支持）以识别关键痛点。自动化项目的典型业务目标包括以下内容：\n\
  \n- Growing revenue\n- Improving client experience\n- Scaling faster\n- Improving\
  \ compliance/regulations\n- Reducing cost\n- Improving employee experience\n- Building\
  \ a foundation for AI\n\n一旦业务目标确定，对组织的调查可以引导我们创建假设，这些假设可以通过自动化得到潜在解决。例如，如果一个组织希望专注于改善员工体验，首先，我们需要深入了解影响员工体验的因素——理想情况下是工作满意度和支持（例如，感到被重视）。\n\
  \n了解影响我们业务目标的因素后，接下来我们可以专注于数据收集和对企业的调查。对于此示例，我们正在查看员工满意度，因此我们应该收集 HR 拥有的与满意度调查、支持票据等相关的任何数据（Figure\
  \ 4.2）：\n\n\n\n\n\n## 调查结果\n\n- 1. 68% 认为入职流程在员工的前几个月阻碍了生产力\n- 2. 60% 不认为自己的工作有回报\n\
  - 3. 35% 在其职位中看不到职业成长\n\n## 关键绩效指标\n\n| KPI | CURRENT | TARGET |\n|---|---|---|\n\
  | Employee Satisfaction | 70% | 85% |\n| Accuracy | 95% | 97% |\n| Timeliness |\
  \ 65% | 80% |\n\nFigure 4.2 – An example of data collection results\n\n从数据收集结果来看，我们可以开始建立假设：\n\
  \n- 1. 大多数受访者认为入职流程阻碍了生产力。\n- **Hypothesis:** 跨多个应用程序和系统的手动设置导致入职时间变慢和生产力下降。\n-\
  \ 2. 60% 的受访者不认为自己的工作有回报。\n- **Hypothesis:** 业务部门包含大量手动和繁琐的任务，小团队必须完成这些任务，从而减少员工从事有回报任务的时间。\n\
  - 3. 35% 的受访者看不到职业成长。\n- **Hypothesis:** 员工没有规定的职业发展轨迹。\n- 4. 服务中心周转时间较差。\n- **Hypothesis:**\
  \ 许多应用程序和缓慢的数据检索导致周转时间增加。\n\n根据这些假设，我们可以开始确定需要进一步调查的领域。对于本示例，让我们调查假设 1 并深入了解新员工的入职旅程。在这种情况下，我们希望深入了解员工生命周期，回顾从申请职位、面试、接受\
  \ offer 到入职的旅程。为了做到这一点，我们将与负责执行这些活动的团队的相关利益相关者安排发现会议。在下一节中，我们将更详细地介绍如何进行这些类型的发现会议。\n\
  \n在我们跳入寻求自动化机会的不同方法之前，有一些成功因素需要考虑：\n\n- 在构思过程中始终将目标业务成果放在首位。\n- 确保高层一致并获得支持以最大化影响。\n\
  - 避免 exclusively 专注于成本削减。\n- 专注于解决业务问题。\n- 考虑其他类型的方法和解决方案 – RPA 只是工具箱中的一种工具。\n\n\
  遵循这些成功因素可以帮助确保我们识别的自动化机会为业务和整个自动化项目带来价值。\n\n## Seeking automation opportunities\n\
  \n在整个企业中寻求自动化机会时，我们会注意到不同级别的自动化，包括从自下而上到自上而下的级别。这些类型的自动化可在 Figure 4.3 中参考：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_90_0.png)\n\
  \nFigure 4.3 – The types of automation opportunities\n\n- **Enterprise automation**\
  \ 关注跨部门的机会，影响组织中大量人群。这些自动化可能包括人工智能等更高复杂度的技术。\n- **Process automation** 关注部门级机会，这些机会是为部门的特定流程量身定制的。这些机会可能为部门内多名同事提供高水平的影响。自动化可能包括诸如文档理解、人工智能或“人工在环”等附加技术。\n\
  - **Task automation** 关注低复杂度的机会，仅惠及少数个人。这些自动化旨在自动化个人日常执行的独特任务。通常，这些机会对自动化项目的整体影响较低，但可能对运行自动化的个人产生更大的影响。这些自动化通常不包括更高复杂度的技术。\n\
  \n企业自动化虽然很棒（就影响而言），但成功的自动化项目采用自上而下和自下而上的方法来确定自动化机会。并非所有自动化都将在公司范围内；因此，寻找部门级和任务级自动化机会也至关重要。让我们调查几种自上而下和自下而上的构思方法（请参阅\
  \ *Table 4.1* 和 *Table 4.2*）：\n\n|  | **Top-Down Ideation** |\n|---|---|\n|  | *[Illustration\
  \ of a top-down arrow/diagram]* |\n| **CoE Discovery Workshops** |  |\n| **Approach\
  \ description** | • 更小、更集中的 intake 努力，其中 **Center of Excellence (CoE)** 针对特定的业务职能领域，以识别离散的自动化机会，从而回答一个总体业务目标。此工作在离散的研讨会中进行，每次筛选约\
  \ 6–10 个机会。 |\n| **Key business responsibilities** | • 识别关键资源以支持构思工作并参与教育会议。<br><br>•\
  \ 调查业务中的机会以供与 CoE 审查。 |\n| **Key CoE responsibilities** | • 进行 RPA 教育并指导业务识别机会。<br><br>•\
  \ 促进 intake 研讨会和会议以确定已识别的业务机会。 |\n| **Key activities** | • 举办 RPA 教育会议（视需要）并了解利用自动化的业务目标。<br><br>•\
  \ 业务在期望的领域内调查机会（或与 CoE 合作以帮助构思工作）。<br><br>• CoE 举办 intake 研讨会/会议以确定机会。 |\n\nTable\
  \ 4.1 – The top-down approach; CoE discovery workshops\n\n自上而下的自动化通常与更大规模的企业级数字化转型计划相关联。由于这些计划是资金充足、专注于公司战略目标的项目，因此更容易获得跨部门合作以参与构思练习。有了这种合作，从自上而下角度识别机会的最佳方式之一是提交数据收集请求，要求提供职能组织架构图（例如子职能/团队如何组织、员工人数等）。这些数据将使我们能够专注于员工人数众多的领域，以便深入调查。\n\
  \n这些已识别的领域然后可以进行更小的 intake 努力，在此我们可以识别离散的自动化机会以回答总体业务目标。一旦确定了总体业务目标（例如加快会计团队的任务），我们就可以调查执行的流程并确定自动化机会：\n\
  \n| Bottom-Up Ideation |\n|---|\n| Business Ideation and Submission |\n| Approach\
  \ description | • 更大、更详尽的数据收集工作，其中 CoE 与多个职能领域合作，在整个企业中撒网。此工作利用多个研讨会/教育会议来建立项目管道。\
  \ |\n| Key business responsibilities | • 定义自动化战略和长期计划。<br>• 参加自动化教育会议。<br>• 向 Automation\
  \ Hub 提交想法以供 CoE 参与。 |\n| Key CoE responsibilities | • 确保正在遵循运营模式控制流程。<br>• 与业务合作预测需求并规划机会建设。\
  \ |\n| Key activities | • CoE 邀请业务领导者参加教育会议以分享目标并介绍 RPA 和 Automation Hub。<br>• CoE\
  \ 在 Automation Hub 中收集来自业务领导者和组织各参与者的自动化机会。<br>• CoE 审查机会并确定进一步分析和构建的用例。 |\n\nTable\
  \ 4.2 – The bottom-up approach; business ideation and submission\n\n从自下而上的角度来看，方法与自上而下的方法有所不同。对于自下而上的构思，想法需要来自组织本身，而不是自上而下的针对性方法。\n\
  \n对于自下而上，我们进行更大规模的数据收集工作，整个组织（或其子集）有机会提交他们认为有影响力的自动化想法。参与者受邀参加教育会议，在会上他们可以分享自动化的目标以及可能的艺术。一旦接受教育，参与者将被邀请将潜在的自动化想法提交到中央存储库（例如\
  \ Automation Hub），每个想法都将被审查以进行进一步分析和构建。\n\n一旦我们完成了探测机会的练习，我们的主机会机会日志应包含大量机会供我们深入研究。此主机会机会日志应是基于我们从构思练习中可能收集到的以下高层信息的有序列表，例如以下内容：\n\
  \n- Value\n- Complexity (a rough estimate)\n- Suitability (a rough estimate)\n\n\
  此主机会机会日志可以采用多种形式 – 一些组织选择使用久经考验的 Excel 表格来跟踪管道，但许多组织利用诸如 UiPath 的 Automation Hub\
  \ 或 Jira 等工具来跟踪自动化管道：\n\n## Automation Pipeline\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_93_0.png)\n\
  \nFigure 4.4 – The master opportunity log in UiPath's Automation Hub\n\n\n\n\n\n\
  ## 最佳适配评估\n\n并非所有机会都最适合仅靠自动化；因此，**最佳适配评估**是初步练习，用于测试自动化机会的适用性。在深入研究可行性和影响潜力细节之前，应审查该机会，以确定\
  \ RPA 或其他技术是否最适合该机会。\n\n在开始评估自动化机会时，我们可以利用以下矩阵轻松确定 RPA 的适用性：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_95_0.png)\n\
  \n图 4.5 – 自动化机会可以绘制在四个象限之一中\n\n- **无自动化：** 通常，我们要谨慎对待涉及频繁流程和环境变化的机会（例如，不稳定的系统环境和频繁的程序变更）。因此，在评估机会时，我们要避开那些高度物理化且包含不稳定流程或系统的流程。\n\
  - **高成本自动化：** 随着机会向更数字化的方向发展，我们开始涵盖仅在计算机上执行的用例。仍需考虑系统和环境的波动性。然而，流程变更可能需要集成新的软件组件或工具——在许多情况下，需要认知计算，例如图像识别。\n\
  - **半自动化：** 随着我们向更静态的流程和环境下移，包含更多物理步骤的机会可能实现半自动化。虽然 RPA 无法覆盖物理步骤，但仍有机会重新规划或重新设计该机会以实现自动化。\n\
  - **零接触自动化：** 最后，最佳用例机会是完全数字化的，并且包含稳定的系统/环境。即使需要包含认知组件，这些也非常适合自动化。\n\n在最佳适配评估期间，您应与流程负责人或该流程的**主题专家\
  \ (SME)** 一起坐下，深入了解现状流程的细节。通过更多地了解流程及其执行方式，参考 *图 4.6* 中的清单可以帮助您判断该机会是否适合自动化：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_96_0.png)\n\n图 4.6 – 一个最佳适配清单示例\n\n在审查自动化机会的最佳适配时，首先，我们必须审查该机会是否包含典型自动化（即需要人工交互、具有重复性、具有标准输入、耗时且基于规则）或认知自动化（即具有概率性、高变异性和非结构化数据）的特征。如果机会不符合这些特征，则该机会可能需要进行一些流程改进练习以使其适合自动化。\n\
  \n如果机会符合典型或认知自动化的特征，那么我们必须接下来检查处理方法是否可以保持不变。如果我们发现流程的交易可以通过应用程序处理（例如，使用 ServiceNow\
  \ 处理服务工单而不是 RPA），那么该机会可能更适合自助服务而非自动化。\n\n如果可以继续，那么我们需要确保该机会具有足够的业务量来支持自动化构建。这将与可行性评估相关联，但通常，我们希望查看定期执行（每日、每月甚至每季度）的自动化机会，并且包含大量交易。如果业务量低，该机会可能更适合自动化之外的其他解决方案。\n\
  \n最后，如果可以继续，我们需要检查自动化是否需要任何系统变更。对于自动化，我们希望确保应用程序和系统的稳定性，因此我们需要检查以下内容：\n\n- 应用程序或系统不会很快发生变化。\n\
  - 现有应用程序和系统中已有功能（或即将推出的功能）最适合该机会。\n\n除了前面显示的示例最佳适配清单外，UiPath 的 Automation Hub 还包含自动化潜力评分以指示最佳适配（*图\
  \ 4.7*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_97_0.png)\n\n图 4.7 – Automation\
  \ Hub 中的自动化潜力评分\n\nUiPath Automation Hub 中的自动化潜力评分将根据以下内容输出百分比：\n\n- 输入数据的结构化程度\n\
  - 流程变异性\n- 输入数据的数字化程度\n\n通过完成最佳适配评估，我们可以衡量将机会与自动化匹配的潜力。完成最佳适配评估后，我们可以继续通过可行性评估来衡量实施自动化会有多困难。\n\
  \n## 可行性评估\n\n一旦确定 RPA 是该机会的最佳适配，下一步评估应是确定实施的难易程度，即可行性评估。\n\n在检查可行性时，我们希望检查可能增加开发工作复杂性的几个因素：\n\
  \n- **屏幕数量：** RPA 在应用程序层工作，因此流程中每增加一个新屏幕（或窗口），开发人员就需要配置自动化以与每个页面上的元素交互。屏幕数量也可以作为步骤数量的代理。\n\
  - **应用程序类型：** 应用程序类型是复杂性的重要贡献者。Java 或 Citrix 等应用程序可能会增加开发复杂性，而 Mainframe、Web 或基于\
  \ Microsoft 的应用程序可能会降低复杂性。另一个需要考虑的点不仅是应用程序类型，还有应用程序数量，因为流程中应用程序越多，开发人员需要开发的配置量就越大。\n\
  - **变体/场景/异常：** 流程中的任何变体（例如 if-else 类型的规则）都会导致复杂性增加，因为需要更多开发时间来处理每个变体。\n- **结构化输入：**\
  \ 输入类型是影响复杂性的另一个因素。输入类型可能在机器可读输入（文本）和数字输入（扫描的 PDF）之间变化，导致读取文本的方法不同。除了输入类型外，输入的结构（例如标准化、半结构化或非结构化）也会增加复杂性。需要解释电子邮件正文中的自由文本的自动化比搜索静态电子邮件主题行的自动化更复杂。\n\
  - **质量控制**：某些用例可能需要高准确度和/或**严格的服务水平协议 (SLA)**。虽然自动化可以通过始终保持相同的步骤序列来提高准确性，但需要更复杂组件（例如**光学字符识别**或**OCR**）的流程可能更难以在高准确度水平下维护。\n\
  - **基于图像的自动化**：必须与 VDI、远程桌面或基于 Citrix 的应用程序交互的自动化可能会增加开发复杂性。虽然 UiPath 的远程桌面和 Citrix\
  \ 扩展使远程桌面的开发变得更容易，但开发的某些组件可能需要基于图像的自动化，从而增加开发和测试时间。\n- **监管合规**：许多流程机会都伴随着监管义务，尤其来自银行或医疗领域。监管合规可能需要额外的范围会议、批准和审计，以确保自动化符合合规要求。\n\
  \n上述因素的响应可以结合起来，对流程复杂性进行粗略估计。以下表格（表 4.3）可供参考，显示流程特征如何映射到流程复杂性：\n\n| 流程特征（非详尽） |\
  \ 流程复杂性 | 低 | 中 | 高 |\n|---|---|---|---|---|\n| # of Applications |  | 0 - 3 | 3\
  \ - 5 | 5 - 7 |\n| # of Fields |  | 1 - 99 | 100 - 200 | 201 - 300 |\n| # of Process\
  \ Steps |  | 1 - 20 | 20 - 60 | 60+ |\n| # of Screens |  | 0 - 10 | 11 - 20 | 21\
  \ - 30 |\n| # of Variations |  | 0 - 3 | 4 - 6 | 7 - 8 |\n| # of Exceptions |  |\
  \ 1 - 10 | 10 - 20 | 20+ |\n| Process SLAs? |  | No | Yes | Yes |\n| Image-Based\
  \ Automation? |  | No | No | VDI/Remote Desktops |\n| Number of Input Formats |\
  \  | 2 - 3 | 3 - 5 | 5 - 7 |\n\n表 4.3 – 流程复杂性矩阵\n\n\n\n\n通过将所有增加复杂度的流程特征映射到一个矩阵中，我们就能根据机会的详细信息对其在矩阵中的位置，对自动化机会的复杂度进行高层面评估。然后，通过为每种流程复杂度设定时间线（例如，低复杂度需要3–4周），我们还可以对实施可能需要的时间进行高层面估算。\n\
  \n与之前分享的最佳匹配评估类似，UiPath 的 Automation Hub 包含一个实施难易度评分，用以指示可行性（图4.8）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_100_0.png)\n\
  \n图4.8 – Automation Hub 中的实施难易度评分\n\nUiPath Automation Hub 中的实施难易度评分会根据以下因素输出一个百分比：\n\
  \n- 流程稳定性\n- 应用程序稳定性\n- 输入数据的结构化程度\n- 流程可变性\n- 流程长度\n- 所用应用程序的数量\n\n通过完成可行性评估，我们可以衡量针对特定流程实施自动化的难度。如果自动化机会通过了可行性评估，我们接下来需要审查该机会的潜在影响，以通过价值评估来证明开发成本的合理性。\n\
  \n## 价值评估\n\n在确定机会的最佳匹配性和可行性之后，应创建一份商业论证，以证明实施自动化的价值或影响。捕捉自动化价值的方法有很多。以下收益列表是典型自动化投资回报率（ROI）的一些示例：\n\
  \n- **成本节约**：通过**全职等价（FTE）**人力节省带来的成本降低\n- **生产力提升**：周转时间缩短或处理业务量增加\n- **错误减少**：自动化特性带来的错误减少，相对于人工操作容易出错\n\
  - **客户满意度**：由于自动化性能和产出而提升的客户（内部或外部）满意度\n- **灵活性**：在业务量变化时进行扩展和缩减的能力\n- **业务敏捷性**：自动化缩短周转时间，间接影响下游业务部门，使其能够更快地行动/响应\n\
  - **合规性**：提高满足监管要求的能力（例如能够全面审计自动化交易，或限制自动化访问权限）\n\n理想情况下，自动化机会带来的收益应与我们之前讨论的目标保持一致，因此分析师在对机会进行排序时应综合考虑所有因素。虽然人们通常更重视一些量化的影响指标（如成本节约和生产力提升），但较软性的影响类型（如满意度和错误减少）也可以作为衡量自动化影响的有价值指标。\n\
  \n与最佳匹配和可行性评估类似，UiPath 的 Automation Hub（*图4.9*）提供了收益评分来衡量价值：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_102_0.png)\n\
  \n图4.9 – Automation Hub 中的收益评分\n\n如果你想量化时间节约，Automation Hub 中的收益评分是估算每年节省小时数这一潜在收益的好方法。\n\
  \n通过完成最佳匹配、可行性和价值评估，我们应该能够将自动化机会待办列表精简为那些最有可能为组织带来价值和影响的机会。现在我们的机会已通过审核，接下来可以继续对项目管道中剩余的机会进行优先级排序。\n\
  \n## 对项目管道进行优先级排序\n\n当一个机会完成了最佳匹配、可行性和价值评估后，它就可以放入**用例待办列表**中。该待办列表包含所有已经过审核、可投入开发的机会。\n\
  \n为了对待办列表进行优先级排序，我们可以根据每个机会的复杂度和价值对其进行映射，这些数据都来自之前执行的评估工作。为了更好地比较机会，我们可以创建一个2×2矩阵，以复杂度为y轴，以收益为x轴：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_103_0.png)\n\n图4.10 – 将自动化机会映射到四个象限\n\
  \n在这个矩阵中，我们会将机会映射到以下四个象限之一：\n\n- **长期改进项**：这些是复杂度较高但收益甚微或没有收益的自动化项目。通常应尽量避免这类项目，转而探索其他类型的改进，如系统/应用程序升级、流程改进，然后再考虑自动化。\n\
  - **必做改进项**：这些机会能带来更大收益，但开发复杂度也更高。大多数认知型用例都属于这一类。在完成所有速赢项之后，最适合着手处理必做改进项。\n- **低垂的果实**：这些机会收益较少，但开发起来更容易。当需要展示“可能性的艺术”时最为合适，但如果有速赢项可用，就不应优先处理。\n\
  - **速赢项**：这是最理想的机会类型，应放在任何项目管道的最顶端。速赢项以低成本快速产生影响，在转向必做改进项或低垂的果实之前，应优先完成所有速赢项。\n\n\
  从这四个象限出发，我们可以开始制定实施计划——规划如何构建项目管道中的自动化项目。通过采用分阶段的方法，我们可以将实施计划划分为不同的波次，并将每个象限对应到不同的波次：\n\
  \n- **第1波：** 实施计划的第一波应专注于展示价值和影响。因此，我们应该首先选择那些被识别为*速赢项*和*低垂的果实*的用例。这些用例应该复杂度较低、影响显著——不仅展示自动化的潜在价值，还能获得利益相关者更广泛的支持。\n\
  - **第2波：** 在第二波中，我们要继续展示第一波的影响。我们应该继续以完成项目管道中的所有*速赢项*和*低垂的果实*为核心。到第二波结束时，围绕自动化的信心和热情应当逐步建立起来。随着更多业务部门看到自动化的成功，项目管道继续自然增长的情况并不少见。\n\
  - **第3波：** 到第三波时，我们最初的*速赢项*和*低垂的果实*列表应已全部完成。此时，我们可以将重点转向其他象限，即*必做改进项*和*长期改进项*。此外，在这一波中承接更复杂类型的用例也并不少见。在延续第一波和第二波的价值创造主题基础上，第三波可以专注于通过探索更复杂的用例来展示“可能性的艺术”，例如我们将在后续章节重点介绍的认知型用例。\n\
  - **第4波及以后：** 到第四波时，自动化项目应该像流水线一样源源不断地产出自动化项目。开发团队应专注于*必做改进项*和*长期改进项*，同时也要关注并优先处理自然出现的*速赢项*或*低垂的果实*。与第二波类似，当业务部门看到自动化的价值后，这些部门开始提交新自动化机会的请求和想法也并不罕见。不过，这些机会在进入可实施机会待办列表之前，仍必须经过最佳匹配、可行性和价值评估。\n\
  \n即使我们的用例待办列表已经排好优先级并准备实施，我们也应始终保持积极主动，寻找更多自动化机会，让项目管道持续流动——无论是通过审视自上而下方法的结果，瞄准新的业务部门来展示自动化，还是通过尝试更多自下而上的方法来广撒网。\n\
  \n\n\n\n## 从端到端流程着手\n\n现在我们已经创建了流程管道，并且制定了关于如何优先排序管道的实施计划，我们可以开始实施的第一步——审视当前状态。\n\
  \n由于实施 RPA 的整体复杂度较低，许多组织通常会利用自动化在现有流程的当前状态下进行。在一般情况下，RPA 不需要太多，甚至不需要流程再造，因为 RPA\
  \ 在桌面级别进行交互。这使得很容易陷入自动化 *现状* 流程的陷阱。自动化流程的 *现状* 性质可确保快速的开发工作和较低的变更管理，这是新的自动化项目趋向于展示快速价值的方式，但我们可能会错过如果调查\
  \ *现状* 流程并将其再造为 *应有* 流程所能产生的额外价值和影响。每个涉及 RPA 的项目，无论是 *快速胜利* 还是前一节中的 *长期改进*，都应结合一定程度的流程理解、分析和再造。因此，重要的是以流程再造的视角审视自动化机会的当前状态；我们通过在应用自动化之前优化流程，并从流程的上游和下游着手来实现这一点。\n\
  \n在特定流程中实施自动化为重新审视整个流程及其执行方式打开了窗口。经常，现有业务流程过于复杂，通常是由于旧流程从未被彻底审视所致，并且充满了可以消除的不必要步骤。更增加了复杂性的是，大多数业务流程并未完全标准化，远非最优，而且最常见的是，未被记录。这些都是很好的理由来应用流程再造练习。再造流程可以为我们带来以下益处：\n\
  \n- **流程清晰度**：再造流程步骤提供了创建更新流程文档的机会——确保所有同事理解流程并一致地执行流程。\n- **标准化程序**：删除不必要的流程步骤并标准化输入和流程步骤可以简化运营并提高业务流程的效率。\n\
  - **最大化影响**：通过优化流程，我们更有可能超越业务部门的目标业务目标。\n- **最大化投资回报率**：通过审视大局，我们可能为自动化机会上游和下游的流程提供额外的、间接的影响和价值。\n\
  \n作为理解自动化机会的一部分，你应该向流程负责人和 SME 询问任何现有文档或标准操作程序。不幸的是，流程知识和理解程度很低的情况并不少见；你可能会很快意识到，其中许多流程根本没有文档记录，而且这些流程是由每位完成任务的员工以不同方式执行的。即使有流程文档，你也应安排与\
  \ SME 的会议，现场演示流程。我们将在后面的章节中更详细地讨论如何进行这些流程演练，但重要的是与多位完成流程中多个案例或变体的 SME 举行演练。通常，每位员工都会遵循他们认为的最佳实践；这可能导致每位员工的程序不同。记录多位员工步骤的好处是，你现在可以一窥哪些步骤在流程中有效，哪些步骤无效。这最终应导致被自动化流程的显著改进，因为我们只考虑业务流程中最优的步骤。\n\
  \n作为与 SME 的当前状态流程演练的一部分，重要的是质疑流程中的决策点或 SME 做出判断的情况。流程中的大多数决策点都应能用一套业务规则定义；始终质疑 SME\
  \ 是否说决策点的规则基于经验——通常，你可以为自动化创建一个规则集。不幸的是，可能存在需要做出判断的情况，而自动化无法遵循一套规则。在这种情况下，我们可以潜在地转向后面章节的认知技术来缓解这一差距。\n\
  \n这些流程演练是优化流程并使其为自动化做好准备的第一步。进行流程演练将使我们对流程的按键级别有深入了解，使我们沉浸在当前状态的细节中。完全专注于流程并忘记大局可能更容易；然而，要真正优化流程并产生最大影响，重要的是考虑流程连接自何处以及流程连接至何处，即上游流程和下游流程。退一步审视大局并分析流程的上游依赖和下游影响，可以打开识别额外收益和更大价值提取机会的可能性。\n\
  \n回到我们 *识别目标* 部分中的 HR 入职示例，我们可以看到在更大的入职流程中存在许多子流程（*图 4.11*）。这些子流程大多数可能有整合自动化的机会，但如果过于专注于某个特定的子流程而非整个流程，我们可能无法发现可能产生更大影响的庞大机会：\n\
  \n总结一下，我们的自动化管道应以快速产生企业价值的方式进行优先排序。在项目的早期阶段，我们的重点应放在构建 *快速胜利* 和 *低垂果实* 上，即复杂度较低且产生价值的机会。随着我们不断深入并积累更多经验，我们可以深入研究\
  \ *长期改进* 和 *必须进行的改进*。为了确保我们交付价值，在从管道中选择自动化机会时，重要的是首先与 SME 坐下来审视流程的当前状态。在此当前状态分析期间，我们应考虑优化流程，因为将\
  \ RPA 实施到流程中是添加流程改进的绝佳机会，如果可能的话。作为流程改进的一部分，我们应始终退一步调查任何上游和下游依赖，因为改进这些依赖可以提供额外的层级影响，从而产生企业价值。\n\
  \n在本节中，我们回顾了如何通过最佳匹配、可行性和可行性评估来评估潜在的自动化机会。然后，我们深入研究组织通过评估的剩余机会，优先排序我们的管道。优先排序后，我们深入研究自动化机会的完整端到端状态，以便全面了解手头的问题。这些步骤在确保我们的管道充满有意义的自动化时至关重要。随着我们进入下一节，我们将深入探讨在评估认知自动化机会时需要探查的具体特征。\n\
  \n## 探查认知自动化\n\n在评估自动化机会时，很可能存在对于传统自动化来说过于复杂但对于认知自动化来说很有吸引力的机会。除了前面讨论的认知机会特征（*本质上是概率性的、高变异性*\
  \ 或 *非结构化数据*）之外，在评估认知自动化的自动化机会时，提出正确的问题并与正确的参与者交谈至关重要。\n\n关于自动化机会的初步对话，流程研讨会应有以下参与者：\n\
  \n- 流程负责人\n- 数据科学家（如果有）\n- RPA 解决方案架构师\n- 流程 SME\n- RPA 业务分析师\n\n\n\n\n\n手动扫描的文档在自动化和文档理解的加持下是可行的；然而，首先，请尝试检查\
  \ OCR 是否能够可靠地提取必要的信息。\n\n询问交付的文档量，因为交付量的任何变化都可能影响自动化的复杂性。例如，如果你有一个用例，其中 80% 的文档保存在共享驱动器中，而剩余的\
  \ 20% 的文档则通过电子邮件发送到共享收件箱，那么 RPA 开发人员就必须创建与共享驱动器的连接以收集大部分文档，同时还要筛选出电子邮件收件箱中特定主题行或发件人的邮件。\n\
  \n- **文档结构：** 关注传入文档的结构——询问结构变化的可能性或文件是否可以包含多个文档。力求获得结构化或半结构化文档/数据——非结构化文档/数据会增加流程复杂性。\n\
  \n询问每种输入文档的结构非常重要。例如，如果你有一个发票流程，请客户提供尽可能多来自尽可能多客户的不同类型的发票。这种输入数据的变化将使你能够审视每种模板类型的相似性和差异性。如果无法获得每种变化类型，请索取最高量的发票模板进行审阅。\n\
  \n如果当前状态包含不一致的文档结构，请深入探讨流程再设计。永远不要害怕考虑流程再设计。通常，这可以极大地提高项目的成功率，同时完成起来也不算太困难。\n\n\
  - **文档提取：** 探究需要从每份文档中提取哪些必填字段；通常，一些字段可以被认为对自动化是不必要的。我们在收集自动化机会的完整需求时将进一步探究这一点，但现在开始着手自动化流程的分类法永远不会太早。\n\
  \n关注每个字段的数据类型；询问是否需要考虑多种语言或格式。请记住，手写会增加流程复杂性。\n\n- **文档验证：** 索取每种类型文档的多个副本——文档的小幅变化对人类来说可能不易察觉，但会迅速增加流程复杂性。与文档结构类似，主要关注自动化中文档类型最大的量。为数据验证和人工干预能力提前与\
  \ SME 设定期望。\n\n最后，在初步研讨会电话中拥有数据科学家会非常有益。这是因为他们可以帮助探究构建该机会所需的数据考虑因素，例如以下内容：\n\n-\
  \ **数据样本量：** 是否有足够大的样本量来训练机器学习模型？\n\n提前知道这一点非常重要。有时，出于多种原因，收集数据可能非常困难（例如，访问不足、安全问题和公司政治）；因此，提前知道是否有足够的数据可用非常重要。在后面的章节中，我们将讨论需要针对多少数据，但请记住，我们需要数据来进行开发和测试，同时还需要单独的数据来验证我们的开发。\n\
  \n- **数据噪声：** 数据集是否包含无关信息或随机性？\n\n在收集数据时，请确保注意任何噪声或随机性。噪声数据通常会产生不理想的结果，因为我们的模型可能会开始将噪声视为一种模式。这种模式随后可能导致模型泛化并产生错误假设。如果你在数据集中开始看到不规则性或随机性，最简单的解决方法之一是询问获取更多数据。\n\
  \n- **数据完整性：** 数据样本是否包含建模所需的所有必要信息？\n\n除了数据噪声外，还必须确保可用的数据样本包含实施所需的所有字段。有时，数据样本可能只包含完成流程所需字段数量的一小部分，其余数据字段来自其他来源——请确保你向\
  \ SME 询问流程所需的相关数据字段及其在样本数据中的位置。\n\n- **数据可用性：** 利益相关者（流程负责人/SME）是否有权获取用于建模的数据？生产数据能否及时检索？\n\
  \n最后，与数据样本量类似，我们必须能够及时获取数据。例如，如果我们的 SME 需要从其他来源请求数据，请确保你了解平均周转时间——等待数据可用可能会对实施时间表产生很大影响。\n\
  \n随着我们深入研究认知用例，我们将看到这些考虑因素的重要性，尤其是在源数据方面。虽然你在早期流程研讨会期间可能无法获得这些问题的所有答案，但请将这些考虑因素放在心上，因为在进入实施阶段时，它们会在我们讨论自动化设计、开发、测试等后续章节中再次出现。\n\
  \n## Summary\n\n在本章中，我们讨论了任何自动化程序的开始：创建自动化管道。我们了解了在潜在自动化和认知自动化机会中应寻找的特征，以及如何领导发现练习来寻找自动化机会。随后，我们学习了如何调查自动化机会是否是最好的实施选择，然后我们学习了如何深入研究自动化机会的当前状态，以优化流程以捕获最大价值。每个自动化程序都应具有为业务提供价值的相似目标。通过学习如何寻找自动化机会、如何了解每个机会的细节以及在处理认知自动化时应探究的内容，我们可以确保开发的自动化机会为使用它们的最终用户提供价值。\n\
  \n在 *第 5 章，使用最终用户考虑因素设计自动化* 中，我们将使用本章的技术捕获的自动化机会作为下一步。我们将学习如何收集用户目标和需求，并学习如何将这些目标纳入未来状态自动化的设计中，同时适当界定流程范围以降低复杂性。\n\
  \n## QnA\n\n1. 什么是 RPA 的特征？\n   - 它需要与应用程序进行手动交互，性质重复，输入标准，耗时，基于规则，且结构化。\n2. 需要认知技术才能实现的自动化机会有哪些特征？\n\
  \   - 性质概率性，可变性高，数据非结构化\n"
- "# 5 Designing Automation with End User Considerations\n\n一旦确定了 **自动化** 机会，自动化之旅中的下一个里程碑就集中在需求收集上。在此阶段，收集尽可能多的关于最终用户对自动化的需求和目标的背景信息至关重要，以确保\
  \ **认知自动化** 能够实现最终用户的 **目标目标**。了解用例的目标将决定将认知自动化应用于某个机会的未来成功。\n\n每个自动化都应以最终用户的考虑因素为设计前提。难以让最终用户交互的自动化存在被弃用的风险；因此，在本章中，我们首先将重点放在收集最终用户的需求上，然后转向设定未来状态自动化的目标。最后，我们将深入探讨如何设计未来状态自动化解决方案。\n\
  \n\n\n\n\n在本章中，我们将涵盖以下主要主题：\n\n- 收集需求\n- 设定目标\n- 设计解决方案\n\n## 收集需求\n\n任何成功的自动化的基础是对\
  \ *当前状态* 流程的准确理解，以及对 *未来状态* 流程需求的准确理解。与端到端流程的当前状态保持同步，使我们能够充分理解自动化机会的复杂性。通过收集当前状态流程的需求，并理解使用自动化的更广泛目标，我们可以收集有价值的见解，以帮助塑造该机会的未来状态设计。\n\
  \n## 收集当前状态\n\n在自动化生命周期的需求收集阶段，我们通过收集终端用户为完成计划自动化的流程所执行的当前手动步骤来开始我们的旅程。通过收集终端用户手动完成当前状态的细节，我们可以在流程中寻找低效率，并开始将流程演进为未来状态设计，其中融入了自动化和认知技术。\n\
  \n为了收集当前状态的步骤，我们需要与最接近流程的个人合作。在上一章中，我们讨论了流程负责人如何帮助评估自动化机会的规模，以及他们可能不是提供如何完成流程任务的逐步说明的最佳资源；因此，我们可能需要与其他熟悉定期手动完成任务的个人互动，例如\
  \ **主题专家 (SMEs)**。这些 SME 将在收集当前状态时担任我们的主要联系人，对未来状态设计提供反馈，并在 **用户验收测试 (UAT)** 期间测试自动化的有效性。\n\
  \n## 需求收集\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_117_0.png)\n\n收集自动化机会的当前状态只需要几个步骤：\n\
  \n1. 收集当前状态文档\n2. 跟踪流程\n3. 理解目标\n\n一旦这些步骤完成，我们应该对当前流程是如何执行的有一个足够的上下文，然后可以更准确地理解应用自动化的目标以及未来状态设计的更有效解决方案。\n\
  \n## 收集当前状态文档\n\n大多数自动化机会都与人类作为日常业务活动的一部分手动完成的流程有关。由于人类完成这些任务，因此会创建文档来记录如何执行任务，并且通常用于培训新员工或用于审计目的。记录业务流程的其他好处包括以下内容：\n\
  \n- 可审计性\n- 业务连续性\n- 团队成员之间的一致性和生产力\n\n当你探查文档时，请注意团队可能会用不同类型的名称来指代这些文档，例如以下内容：\n\
  \n- 桌面操作规程\n- **标准操作程序 (SOPs)**\n\n## 流程跟踪\n\n了解流程的最好方法之一就是简单地观察流程是如何完成的。通过与 SME\
  \ 坐在一起，我们可以通过观察在他们完成流程时提问来收集流程的细节。\n\n在 **流程跟踪** 期间，我们应始终与 SME 坐在一起（无论是虚拟还是面对面），观察完成手头任务所采取的步骤。在此观察期间，强烈建议尽可能通过视频会议录制会话。这使我们能够对所有提出的问题或每个步骤的细节有一个参考，而无需做过于详细的笔记。它在进入开发阶段时也很有帮助，因为手动流程的录制可以补充为自动化创建的任何流程文档（例如\
  \ **流程设计文档**）。\n\n流程跟踪给了我们询问 SME 的奢侈。我们可以提出以下问题：\n\n- 什么运作良好？\n- 什么导致困难？\n- 我们为什么要这样执行任务？\n\
  \n在观察期间，我们应询问 SME 任何 *痛点* 或 *潜在改进*，这些可以纳入自动化设计。许多业务分析师会陷入只捕获自动化当前状态的陷阱，而不质疑流程中做出的任何步骤或决策。积极倾听\
  \ SME 对痛点和对未来状态的要求。不要对你认为终端用户如何与流程交互或终端用户在未来状态中想要什么做出假设。相反，提出开放式问题，让 SME 完全提供他们的意见。如果流程效率低下，请质疑\
  \ SME 为什么要这样执行流程。这些已识别的痛点应在自动化的未来状态设计中得到解决。\n\n## 理解目标\n\n当我们通过流程跟踪和文档揭示机会的当前状态细节时，我们应该能够开始理解流程的更广泛目标。通过理解流程的目标并理解终端用户的需求，我们在为未来状态寻找解决方案时更好地配备了将自动化融入其中的能力。这使我们能够为业务提供更好、更有影响力的自动化。\n\
  \n自动化必须以终端用户体验为设计核心。当我们跟踪 SME 并了解当前状态时，我们应关注终端用户如何与当前状态流程交互。通过确认终端用户的目标，我们可以对项目应实现的目标达成共同理解。理解目标时应回答的一些问题如下：\n\
  \n- 任务/流程的目的是什么？\n- 自动化旨在实现什么？\n- 对自动化的期望是什么？\n- 此任务/流程的输出如何被他人使用？\n\n当我们了解自动化项目的目标时，在开始开发之前，重要的是我们要对端到端流程有一个完整的了解。如上一章所述，了解自动化机会的上游和下游流程的完整上下文是有利的。通过了解流程如何与上游和下游的其他任务/流程连接，我们可以更准确地判断认知自动化如何融入用例，可能允许我们更改上游或下游流程以更好地适应自动化。\n\
  \n通过当前状态文档和流程跟踪了解自动化机会的当前状态，并了解终端用户的目标/需求，我们可以充分理解应用自动化的机会。有了这种新获得的理解，我们就可以继续设定正确的期望并为自动化设定切合实际的目标。\n\
  \n## 设定目标\n\n非常经常，项目不成功的原因为 *需求不明确*，导致 *目标不切实际*。对于自动化而言，终端用户（及其体验）在设计项目时应始终是首要优先事项。没有可实现目标的自动化开发很可能会被放弃并变成\
  \ *架上软件*。为了减轻这种放弃，我们必须了解终端用户对自动化的目标，然后设定切合实际的成功目标。\n\n在开发过程早期设定切合实际的目标是防止自动化被放弃的重要因素。太多的自动化部署到生产环境后被终端用户放弃，因为它没有达到预期，或没有完全满足终端用户的需求或目标（图\
  \ 5.3）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_121_0.png)\n\n图 5.3 – 自动化放弃的原因\n\
  \n在开始开发之前，与终端用户就 *待实现*（或未来状态）认知自动化的成功标准达成一致。成功标准的一些示例包括以下内容：\n\n- 节省时间\n- 效率提升\n\
  - 直通处理——无需人工干预的项目（例如文档）的百分比\n- 字段准确性\n- 易用性\n- 速度/吞吐量\n- 总拥有成本\n- 供应商关系\n\n\n\n\n\
  \n在项目目标与愿景达成一致，并全面理解端到端流程之后，我们就可以为自动化机会设定切实可行的目标。向终端用户介绍认知技术的成功率非常重要。认知自动化无法实现100%的准确率，存在出现微小偏差的可能，因此尽早向终端用户说明机器学习、**光学字符识别（OCR）**\
  \ 或文档理解等技术的成功率，帮助他们建立合理预期至关重要。这也使得企业能够安排人工用户作为验证者，处理异常情况，并发挥**人在回路（HITL）** 能力的作用。\n\
  \n通过充分理解自动化的目标、收集端到端流程的上下文信息、倾听终端用户对自动化的需求，我们可以为自动化设定切实可行的目标和预期，并确保使用UiPath模板（如**流程定义文档（PDD）**）对自动化机会进行妥善记录。所有这些要点都有助于确保自动化在生产环境部署后能够获得良好的反响。\n\
  \n## 设计解决方案\n\n构建自动化需要在时间和材料方面投入大量资源，因此我们必须确保，部署在生产环境中的任何自动化在设计时都要能够激励业务终端用户持续使用。在设计解决方案时聚焦终端用户，包括以下方面：\n\
  \n-   选择正确的自动化类型\n-   设计最佳用户体验\n\n通过构建易于终端用户交互和理解的自动化，我们能够实现预期的收益，因为终端用户在与自动化互动时获得了积极的体验。\n\
  \n## 选择正确的自动化类型\n\n在设计认知自动化时，首先需要做出的决策之一就是采用哪种自动化类型。在机器人流程自动化中，有两种自动化类型会影响终端用户与自动化的交互方式：有人值守和无人值守自动化（图5.4），它们提供了不同类型的自动化交互方式。\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_123_0.png)\n\n图5.4 – 自动化类型\n\n这两种自动化类型在实施时都有不同的要求和考虑因素。然而，只要深入了解终端用户的目标，自动化类型的选择就不是一个难题。\n\
  \n## 有人值守自动化\n\n**有人值守自动化**（Attended Automation）可以被视为人类用户的虚拟助手。这类自动化直接在终端用户的计算机上运行，并且必须由终端用户自行触发。有人值守自动化往往赋予终端用户更多控制权，因为他们可以选择自动化何时运行，有时还可以决定自动化使用哪些数据。有关有人值守自动化的其他要点，请参阅*图5.5*：\n\
  \n|  | **有人值守自动化** <br> **在人类用户协助下运行的虚拟助手** |\n| :--- | :--- |\n| 运行什么 | • 运行更小型的、基于任务的工作，更偏“前台”性质\
  \ |\n| 何时运行 | • 可以定期运行，但也属于“临时”任务类型，在人类需要时随时提供协助 |\n| 如何运行 | • 人类用户在其UiPath助手中点击“播放”来选择运行自动化\
  \ |\n| 在哪里运行 | • 直接在用户的桌面上运行，用户可以随时执行 |\n| 为何运行 | • 最适合较短、更个人化的任务，以满足个人需求 <br>•\
  \ 通常需要人工输入（例如输入文件路径、日期范围等）<br>• 由于任务较短，通常节省的时间量较小（有人值守自动化通常只需几分钟即可运行完成） |\n| 何时选择\
  \ | • 当开发的问题对每个用户而言是可变的且非标准化的，需要人工输入时 <br>• 自动化仅带来较小程度的收益，通常无法通过完整的实施工作来收回成本 |\n\
  \n图5.5 – 有人值守自动化\n\n由于有人值守自动化由人类终端用户触发，这为自动化开发人员提供了在机器人和人类之间灵活传递信息的绝佳机会。这使得开发人员可以在自动化中添加消息提示，让自动化在运行期间向人类用户请求输入，例如：\n\
  \n-   提示用户输入应用程序凭据\n-   提示用户选择本地文件作为输入\n-   提示用户输入影响机器人逻辑的数据（例如账号、开始日期和结束日期）\n\n\
  这类提示还可以让自动化在遇到异常时请求人工验证。通过使用UiPath的验证工作站（Validation Station），当自动化遇到低置信度场景（例如无法对电子邮件进行分类）时，可以请求人工提供输入（*图5.6*）：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_125_0.png)\n\n图5.6 – UiPath验证工作站\n\n\
  借助UiPath的验证工作站，我们可以在用户桌面上弹出一个窗口，要求用户就文档中的特定项目提供输入或验证。通过这些类型的提示，我们可以实时请求终端用户输入，使自动化真正成为终端用户的得力助手。\n\
  \n## 使用有人值守自动化的注意事项\n\n由于有人值守自动化具有临时性特点，因此在文档记录和性能方面需要一些考虑。由于有人值守自动化有可能在整个员工队伍中共享，因此应创建适当的文档，教导终端用户如何与自动化交互，以及了解自动化的预期输入和输出。为自动化提供充分的上下文和信息至关重要，这能让自动化易于使用，并提升终端用户的体验。\n\
  \n为了让终端用户了解有人值守自动化的上下文，开发团队可以在自动化中提供详细的项目描述、用户指南和提示，以引导终端用户完成执行过程。终端用户更倾向于使用包含详细描述的自动化，这些描述可以说明自动化的具体内容；因此，项目描述应概述自动化将执行的操作、运行自动化的依赖项以及预期输出（图5.7）。团队应将项目描述发布在公共站点上，例如UiPath自动化中心（Automation\
  \ Hub）或UiPath市场（Marketplace）。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_126_0.png)\n\
  \n## 摘要\n\n此自动化使用Microsoft Translator服务翻译选定的文本，并将翻译后的文本复制到剪贴板以供进一步使用。\n\n## 概述\n\
  \n“翻译屏幕文本”自动化允许您使用Microsoft Translator API快速翻译屏幕上选定的文本。它会要求您选择要翻译的文本，将该文本发送至Microsoft\
  \ Translator API，然后将翻译后的文本复制到剪贴板。此自动化非常适合翻译文档或电子邮件、复核译文或学习新语言。\n\n图5.7 – 项目描述（如自动化中心中的描述）是最佳实践\n\
  \n除文档记录外，利用UiPath提示（例如标注）可以帮助引导用户完成自动化流程中令人困惑或困难的步骤（图5.8）。标注非常有用，因为它们可以放置在用户桌面上的元素旁边，以指导终端用户与自动化交互。\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_127_0.png)\n\n图5.8 – UiPath中标注的示例\n\n\
  除了文档记录方面的考虑外，在构建有人值守自动化时还必须考虑计算性能。有人值守自动化最适合短任务，为终端用户提供即时输出。这些任务不应花费太长时间，因为有人值守自动化在执行时可能会占用用户的机器，使人类用户无法使用计算机。让终端用户无法使用电脑可被视为对潜在收益的一种风险；如果终端用户在自动化运行期间无法执行其他任务，他们可能只会等待自动化完成，从而减少了时间节省。虽然有些技术支持后台处理（例如UiPath的画中画（Picture-in-Picture）和模拟/发送Windows消息交互框架），但一定要精确划定有人值守自动化的范围，将对其用户机器的影响降至最低。\n\
  \n在处理没有明确计划运行时间的短任务时，有人值守自动化是一个很好的选择。让终端用户触发自动化，也为自动化提供了提示用户输入的机会。然而，这些特性也带来了文档记录和性能方面的考虑，如果处理不当，可能会影响终端用户的体验。缺乏文档记录可能会导致终端用户不愿意尝试自动化，或者不知道如何使用它；而长时间运行的有人值守自动化如果导致终端用户在自动化执行期间无法使用计算机处理其他任务，也可能会让他们感到沮丧。\n\
  \n\n\n\n\n## 无人值守自动化\n\n无人值守自动化最好可被视为人类用户的*延伸*。这种类型的自动化是从专用机器（如云上的虚拟机）运行的，必须由 **UiPath\
  \ Orchestrator** 通过触发机制（如计划）直接触发。与有人值守自动化相比，无人值守自动化往往能释放更高级别的影响，因为将自动化放置在专用机器上可以让企业按需尽可能频繁地运行自动化。关于无人值守自动化的额外要点包含在图\
  \ 5.9 中：\n\n**无人值守自动化** — *工作力的延伸，独立运行无需人工协助*\n\n| 何时运行 | 运行更大、端到端的基于流程的作业，更偏向“后台”\
  \ |\n| 何时运行 | 定期运行，无论是基于计划还是基于事件 |\n| 如何运行 | 一个触发器（基于计划或基于事件）将启动一个自动化 |\n| 在何处运行\
  \ | 在外部机器上运行，无论是在本地还是在云中 |\n| 为什么运行 | - 最适合更长、更通用的任务，满足整个团队的需求<br>- 不需要人工输入；可以完全端到端运行而无需人工干预<br>-\
  \ 通常节省更多时间，因为自动化的流程通常更长（无人值守自动化通常可以每天运行数小时甚至 24x7） |\n| 何时选择 | - 当为一个在多个团队中标准化的、且不需要人工输入的问题开发时<br>-\
  \ 自动化提供大量收益，提供实施工作所需的投资回报 |\n\n图 5.9 – 无人值守自动化的概述\n\n由于无人值守自动化在外部机器上运行，我们失去了为终端用户提供即时提示或指南的能力，就像有人值守自动化那样。好消息是，UiPath\
  \ 已经考虑到了这一点，并为无人值守自动化提供了 Validation Station 的替代方案，称为 **UiPath Action Center。**\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_129_0.png)\n\n图 5.10 – UiPath Action\
  \ Center\n\n通过 UiPath Action Center，无人值守自动化可以向 Action Center 发送 **操作**，然后可以将这些操作分配给特定的人类进行审核。这允许提供与\
  \ Validation Station 或输入对话框类似的提示，只是 Action Center 将操作存储起来供人类交互。一旦人类与分配给他们的操作交互，无人值守自动化就可以接收用户的输入并继续其任务。\n\
  \n## 使用无人值守自动化的注意事项\n\n无人值守自动化具有计划性，因此在计划、文档和性能方面存在一些注意事项。由于无人值守自动化需要专用机器来执行自动化作业，因此必须有机器可用以运行自动化，否则待执行的自动化必须等待直到有机器空闲。如果计划不当，这可能导致\
  \ **服务等级协议 (SLA)** 问题，项目无法及时完成。为了解决这个问题，可以在自动化和机器之间建立一对一映射；这样，自动化在计划运行时总是有机器可用。不幸的是，这可能会引发机器分配和许可问题，因为额外的机器和许可证会给自动化项目带来额外成本。自动化项目应根据已配置的机器仔细平衡自动化计划。\n\
  \n除了计划挑战外，文档和性能也是无人值守自动化的额外考虑因素。虽然无人值守自动化的文档不需要告诉终端用户自动化是如何工作的，但它应该告诉终端用户可以从自动化中期望什么以及在出现异常时如何处理问题。从性能角度来看，很容易过度分配无人值守自动化的事务项目，最终发现机器人无法按原计划执行那么多项目。为缓解此问题，您需要调查利用队列的方法，允许多个机器人同时执行任务。\n\
  \n无人值守自动化是处理可计划的较长流程时的一个很好的资源。它允许企业在后台运行自动化，并比人类用户更及时、高效、更频繁地完成交易。然而，这些功能也带来了关于文档和性能的注意事项，如果处理不当，会影响终端用户的体验并增加实施成本。如果缺乏文档，终端用户可能不了解如何处理自动化产生的潜在异常或错误，从而导致支持请求，给支持团队带来负担。这种缺乏文档的情况也可能导致对无人值守自动化引发的异常类型的误解，其中特定异常必须由终端用户处理。这种误解会留下不良印象，因为终端用户可能会对自动化的性能失去信心。\n\
  \n## 为最佳用户体验设计自动化\n\n在选择最适合自动化机会的自动化类型后，我们可以进一步进入整体解决方案的设计。成功的自动化实施使用户易于参与和与自动化交互；*自动化的目标是增强人类能力，而不是让其因额外的规则和程序而负担。*因此，在为最佳用户体验设计时，我们应探索自动化的输入和输出，以及它们与人类用户的交互。\n\
  \n在自动化开始执行之前，要求人类提供数据是常见需求。这种类型的输入可能是来自系统的信息，例如 Salesforce 中机会的 Case ID，或非常常见的文件保存到共享或本地驱动器的路径。许多自动化要求人类用户提供精确输入，例如以下内容：\n\
  \n- 精确的文件名（`ME_Report_MM.DD.YYYY.xlsx`）\n- 精确的措辞约定（`Subject: Month End Report MM.DD.YYYY`）\n\
  \n## 总结\n\n在本章中，我们讨论了自动化之旅的下一个阶段；收集需求和设计解决方案。我们了解了如何为自动化机会收集需求，如何为自动化设定目标，以及如何以终端用户体验为出发点设计自动化。通过收集业务需求，通过设定目标来重新确认它们，并将此反馈纳入未来状态设计，我们可以确保成功的自动化部署。\n\
  \n在 *第 6 章，理解您的工具* 中，我们将以自动化生命周期的开发阶段为自动化机会迈出下一步。在下一章中，我们将通过深入了解其功能并学习如何使用每个工具来构建，来了解\
  \ UiPath 的认知工具 **Document Understanding**、**AI Center** 和 **Computer Vision** 的特性。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 开始使用 UiPath Document Understanding\n- 开始使用 UiPath AI Center\n\
  - 开始使用 UiPath Computer Vision\n\n## 技术要求\n\n本章的所有代码示例均可在 GitHub 上找到，网址为 https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter06。\n\
  \n使用 UiPath 非常容易，并且使用 Community 版本可以免费开始。然而，对于 UiPath AI Center，我们需要企业许可证。可以从 uipath.com\
  \ 获取 60 天企业试用许可证。\n\n使用 60 天企业试用，我们将拥有以下访问权限：\n\n- 五个 RPA Developer Pro 许可证 – 命名用户许可证包括\
  \ Studio、StudioX、有人值守机器人、Apps、Action Center 和 Task Capture 的访问权限\n- 五个无人值守机器人、五个测试机器人和两个\
  \ AI 机器人\n- AI Center、AI Computer Vision、Automation Hub、Data Service、Document Understanding\
  \ 和 Insights\n\n对于本节，您需要以下内容：\n\n- UiPath Enterprise Cloud\n- UiPath Studio 2021.4+\n\
  - UiPath.IntelligentOCR.Activities 包 v.4.13.2 或更高版本\n- UiPath.DocumentUnderstanding.ML.Activities\
  \ v1.7.0 或更高版本\n\n\n\n\n\n# 重要说明\n\n关于如何安装 UiPath 包的相关说明，请参阅 https://docs.uipath.com/studio/docs/managing-activities-packages。\n\
  \n## 在 UiPath 企业试用版中启用 AI Center\n\nUiPath Document Understanding 在 UiPath 社区版和企业版中均默认提供；然而，对于\
  \ UiPath AI Center，我们需要在企业试用版中启用该服务。您可以按照以下步骤启用该服务：\n\n- 1. 前往 **Automation Cloud**：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_135_0.png)\n\n- 2. 前往 **Admin**：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_136_0.png)\n\n图 6.2 – 点击 Admin\n\n- 3.\
  \ 在 **DefaultTenant** 中，点击三个点，然后点击 **Tenant Settings**：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_136_1.png)\n\
  \n图 6.3 – 点击 Tenant Settings\n\n4. 在 **Provision Services** 下选择 **AI Center**，然后点击\
  \ **Save**：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_137_0.png)\n\n一旦在 **Automation\
  \ Cloud** 中启用了 AI Center，我们就准备好开始探索 UiPath 的认知工具了。我们要探索的第一个工具是 UiPath Document Understanding。\n\
  \n## 开始使用 UiPath Document Understanding\n\nUiPath Document Understanding 释放了利用机器人流程自动化（RPA）智能处理文档的能力。借助\
  \ Document Understanding，我们将能够对 PDF、扫描文档甚至手写内容进行数字化、分类并提取数据。\n\n在本节中，我们将学习如何使用 Document\
  \ Understanding 框架和 Document Understanding Studio 模板来构建 Document Understanding 用例。最后，我们将深入探讨\
  \ Document Understanding 活动包的活动或构建块。\n\n既然引入了 Document Understanding 框架，让我们深入探讨每个组件，从分类学开始。\n\
  \n## 介绍分类学\n\nDocument Understanding 框架的第一步是创建分类学。\n分类学是一种系统分类，在 Document Understanding\
  \ 中，分类学是文档类型的分类。文档类型是业务流程处理的逻辑文档类型的分类。文档类型的示例可以包括以下内容：\n\n- 发票\n- 税表（W-2 和 1099）\n\
  - 合同\n- 记录\n\n## 分类学管理器\n\n在创建分类学的过程中，我们将对所需的文档类型进行分类，并确定每种文档类型中的字段 – 这基本上将成为我们数据的模式（结构）。为了创建我们的分类学，我们将使用\
  \ UiPath Studio 中的分类学管理器来创建字段和文档类型的分类学。可以在 UiPath Studio 的设计选项卡中找到分类学管理器（图 6.6）：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_139_0.png)\n\n图 6.6 – UiPath 设计选项卡中的分类学管理器\n\
  \n> **重要说明**\n> 分类学管理器要求安装 `UiPath.IntelligentOCR.Activities` 包作为项目的依赖项。安装完成后，Studio\
  \ 的设计选项卡中将出现一个分类学管理器按钮。\n\n在 **Taxonomy Manager** 中，我们将有机会定义 **Document Types**、**Document\
  \ Type Details** 以及数据字段，如 *Figure 6.7* 所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_140_0.png)\n\
  \n- **Document Types**：定义你的文档类型，并整理在你定义的分组下。\n- **Document Type Details**：定义文档类型详情以及文档中的任意数量的字段。\n\
  - **Edit Field**：定义字段的数据类型。\n\n## 创建分类学\n\n让我们开始创建分类学！在 UiPath Studio 中启动一个新项目并打开\
  \ `Main.xaml`。\n\n> 重要说明\n> 在开始此练习之前，请确保你已安装以下包：`UiPath.IntelligentOCR.Activities\
  \ package v.4.13.2` 或更高版本以及 `UiPath.DocumentUnderstanding.ML.Activities v1.7.0`。\n\
