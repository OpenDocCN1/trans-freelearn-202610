- "# 1 Understanding Essential Artificial Intelligence Basics for RPA Developers\n\
  \n在本章中，我们将介绍作为 RPA 开发者在日常工作中相关的一些关键 **artificial intelligence (AI)** 概念。我们将发现 **robotic\
  \ process automation (RPA)** 开发者在实施 RPA 用例中的认知自动化时可以在哪里产生最大影响，而无需成为数据科学家。我们还将了解当今\
  \ AI 解决的实际业务问题。\n\n在本章中，我们将涵盖以下主要主题：\n\n- Understanding key AI concepts\n- Understanding\
  \ cognitive automation\n- Exploring **out-of-the-box (OOTB) machine learning (ML)**\
  \ models for RPA developers\n\n到本章结束时，您将掌握常见的 AI 基础知识，并通过真实案例的启发，开始思考如何将 AI 应用于您的潜在用例。\n\
  \n## Understanding key AI concepts\n\n当您开始探索 AI 主题时，您可能会遇到许多术语。我们将解构 AI，并只呈现对您作为\
  \ RPA 开发者最相关的概念。请注意，您可能会遇到其他材料中基于不同上下文而略有不同的定义。\n\n### Differentiating between artificial\
  \ intelligence, machine learning, and deep learning\n\nAI、ML 和 **deep learning (DL)**\
  \ 相关但并不相同。以下图表说明了这些学习类型的层级关系：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_20_0.png)\n\
  \nFigure 1.1 – AI, ML, and DL\n\n- **AI:** 这相当于赋予机器或机器人思考的能力。它涵盖了 ML 和 DL。\n- **ML:**\
  \ 这是指机器或机器人通过算法在没有显式编程的情况下学习思考的方式。ML 是 AI 的子集。\n- **DL:** 这是指 ML 算法利用人工神经网络来模仿学习的方式。DL\
  \ 是 ML 的子集。\n\n接下来，我们将查看在 ML 和 DL 之间选择时需要考虑的三个关键因素。它们如下列出：\n\n- Data requirement\
  \ and availability\n- Computational power\n- Training time\n\n下表显示了 ML 和 DL 的比较：\n\
  \n|  | Machine Learning | Deep Learning |\n|---|---|---|\n| **Data Requirement and\
  \ Availability** | • Can work with small datasets | • Must have large data sets\
  \ |\n| **Computational Power** | • Machines with a Central Processing Unit (CPU)\
  \ are sufficient | • Machines with a Graphics Processing Unit (GPU) are required\
  \ |\n| **Training Time** | • Short training time | • Long training time |\n\nFigure\
  \ 1.2 – Comparison of ML and DL\n\n在 ML 中，研究对象的 *features* 被输入算法供机器学习。我们可以将 *features*\
  \ 视为我们给算法的提示。此步骤允许使用较小的数据集、较低的计算能力和更少的训练时间。\n\n在 DL 中，*features* 由人工神经网络确定。它需要付出更多努力来弄清\
  \ *features* 和学习模式。因此，它需要大量数据、高计算能力和长时间的训练。\n\n尽管 DL 很有价值，但对于大多数企业来说，开发 DL 模型来解决其业务问题超出了其能力范围。幸运的是，许多\
  \ DL 模型已由拥有时间和预算的公司预先训练，使其可供大量用户使用。\n\n这一选择的含义是，您作为 RPA 开发者的角色不是 *create* 这些模型。您作为\
  \ RPA 开发者是这些模型的 *trainer*。了解训练在 AI 中的作用非常重要。\n\n### Appreciating the relevance of\
  \ supervised learning, unsupervised learning, and reinforcement learning in AI\n\
  \n正如我们在上一节中所学，AI 是关于训练机器或机器人思考。就像人类一样，机器人需要学习。有三种不同的机器人学习方式。\n\n下图为 **supervised\
  \ learning**、**unsupervised learning** 和 **reinforcement learning** 提供了一些类比：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_22_0.png)\n\nFigure 1.3 – Supervised learning,\
  \ unsupervised learning, and reinforcement learning analogies\n\n下面的列表解释了各种类比：\n\
  \n- **Supervised learning**: 这基于过去的数据，*trainer* 指定输入以预测未来结果。这种训练类似于讲师主导的培训课程。它要求\
  \ *trainer* 监督学生或模型以实现期望的学习成果。Classification 和 regression 是监督学习的类型：\n  - **Classification**\
  \ 指将给定数据集分类到类别中的过程。例如，一组不同动物的图片被输入到 ML 模型中。每张图片都标记有动物名称。ML 模型被训练以从图像中识别动物。\n  -\
  \ **Regression** 有助于预测连续变量。例如，利润预测 ML 模型就是回归模型的例子。由研发、营销和行政支出、地理位置和利润组成的训练数据被输入模型。ML\
  \ 模型预测利润。\n- **Unsupervised learning**: 这依赖于算法从数据中识别未知模式。这种训练类似于自学课程。它要求学生或模型综合信息以实现期望的学习成果。Clustering\
  \ 是一种无监督学习方法：\n  - **Clustering** 指用于在训练数据集中寻找相似性和关系模式，然后根据 *features* 将这些数据集聚类到具有相似性的组中的方法。例如，聚类技术通常用于市场细分。ML\
  \ 模型查看性别、年龄、种族和地理位置等特征，将客户群体分组到细分市场，以更好地了解他们的购买习惯。\n- **Reinforcement learning**:\
  \ 这使用奖励和惩罚系统来学习。没有训练数据或 *trainer*。算法会根据反馈或奖励和惩罚随着时间的推移而改进。这种训练类似于在职培训。如果员工工作做得好，员工会获得加薪或晋升。如果员工表现不佳，员工不会获得加薪或晋升。当没有数据或特定专业知识可用时，这通常被使用。\n\
  \n### Practical tips\n\nAI 平台提供商的使命是让 AI 变得易于访问。其使命的一部分是努力开发产品功能以克服 AI 的复杂概念。具体来说，以下是\
  \ AI 民主化的一些显著努力：\n\n- Increased availability of pre-trained models to accelerate\
  \ the time to result\n- Simplification of the technical complexity of the ML training\
  \ life cycle\n\n我们以易于消化的格式介绍了关键 AI 概念。此概述使您能够快速上手 UiPath 等 AI 平台。您很快就能构建、部署和维护您的第一个\
  \ AI+RPA 用例。您不再需要花费数年时间掌握 AI 才能从头构建模型。相反，您是机器人的 *trainer*，教授它们需要掌握的不同技能。最重要的是，您拥有能够为您完成最复杂任务的工具。\n\
  \n现在您对关键 AI 概念有了良好的理解，让我们探索 **cognitive automation**，即 AI 与 RPA 的结合。\n\n\n\n\n\n\
  ## 理解认知自动化\n\n认知自动化或**智能流程自动化（IPA）**是指将 AI 与 RPA 结合使用。它为机器或机器人提供了大脑（AI）和四肢（RPA）。\n\
  \n尽管在高层面上，RPA 开发和认知自动化开发的通用**软件开发生命周期（SDLC）**看起来相同，但存在两个重要差异：\n\n- RPA 开发者在 SDLC\
  \ 中的角色\n- RPA 与认知自动化生命周期的最终产物\n\n现在，让我们详细看看这些差异。\n\n### 理解 RPA 开发者在认知自动化生命周期中扩展的角色\n\
  \nRPA 开发者在认知自动化 SDLC 中扮演着扩展的角色。下图展示了代表性 RPA SDLC 与代表性认知自动化 SDLC 之间的详细对比：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_24_0.png)\n\
  \n在 RPA SDLC 中，RPA 开发者就像任何其他软件包的传统开发者一样。在此过程中，典型的流程顺序如下：\n\n1. 业务分析师收集业务流程的端到端业务需求，详细说明输入、处理步骤和输出。\n\
  2. RPA 开发者编写 RPA 工作流代码并测试代码。\n3. 业务用户对 RPA 机器人进行用户验收测试。\n4. 最后，RPA 开发者创建部署到生产环境的软件包。\n\
  5. 生产之后，管理员管理 RPA 机器人的运营。\n6. 如果业务用户提出增强建议或报告缺陷，RPA 开发者会更新代码。\n\nRPA 开发者通过将业务需求转换为\
  \ RPA 语言，在 RPA SDLC 的选定步骤（构建、部署和改进）中发挥重要作用。\n\n在认知自动化 SDLC 中，RPA 开发者几乎在每一步都发挥作用，具体描述如下：\n\
  \n1. *RPA 开发者*收集数据特定的需求，为 ML 模型训练/再训练做准备。\n2. *RPA 开发者*通常不构建 ML 模型。相反，*RPA 开发者*要么使用数据科学家开发的\
  \ ML 模型，要么使用可用的 OOTB 模型。\n3. *RPA 开发者*根据具体用例准备训练和评估数据集，以训练/再训练 ML 模型。\n4. 当训练结果可接受时，*RPA\
  \ 开发者*会创建 ML 包以部署到生产环境。\n5. 然后，ML 技能可供*RPA 开发者*在任何 RPA 工作流中即插即用。\n6. 生产之后，*管理员*管理\
  \ RPA 机器人和 ML 技能的运营。\n7. *RPA 开发者*继续使用新的数据点对模型进行再训练，以改进模型。\n\n在认知自动化中，RPA 开发者在 SDLC\
  \ 中扮演着更广泛的角色，既是*训练师*，也是*数据管理员*。\n\n### 理解认知自动化生命周期与 RPA 生命周期的最终产物\n\nRPA 与认知自动化之间的另一个重要区别与最终产出的特征有关。RPA\
  \ 配置 RPA 机器人。认知自动化开发由 RPA 机器人利用的 ML 技能。下图说明了在初始部署中利益相关者对 RPA 机器人和 ML 技能期望的差异：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_26_0.png)\n\n图 1.5 – 初始部署中对 RPA 机器人和 ML\
  \ 技能的期望\n\nRPA 机器人按照 RPA 开发者设定的一组规则执行。结果是黑白分明的。只有正确编码的机器人才会被部署到生产环境中。认知自动化生命周期的产物是将训练好的\
  \ ML 技能与 RPA 工作流相结合。ML 技能被训练到可接受的置信度阈值，以便部署到生产中。几乎在所有情况下，ML 技能在首次部署时都不可能做到 100%\
  \ 正确。ML 技能预计会随着时间的推移而改进。\n\n### 实用建议\n\n企业已经通过 RPA 看到了自动化的力量并从中获益。然而，RPA 有其局限性。RPA\
  \ 只能自动化基于规则的任务，从而限制了其可自动化的流程范围。此外，基于规则的任务通常是价值较低的工作。为了向价值链上游移动，结合 AI 对于企业保持竞争优势至关重要。以下是一些可以带给你领导层的关键要点：\n\
  \n- 科技公司已经简化了 AI 技术，使其易于消费。AI 不再只是数据科学家可以使用的工具。\n- 现有的 RPA 团队可以开始整合 AI，而无需投入大量资金组建新团队。\n\
  - 整个组织中都存在有影响力的认知自动化用例。\n- 现在是时候给机器或机器人一个大脑了。\n\n既然你已经对认知自动化有了很好的理解，让我们探索一些最常用的\
  \ OOTB 模型，作为 AI 初学者你可以尝试这些模型。\n\n## 探索与 RPA 开发者相关的 OOTB 模型\n\n在 ML 模型方面，你有多种选择。有广泛可用的\
  \ OOTB 模型，你可以通过用自身数据进行再训练来使用它们。你也可以从头开发自己的 ML 模型。最后，你还可以与公司内的数据科学家合作，构建定制 ML 模型。\n\
  \n在本书中，我们将提供关于如何使用这些选项的建议。首先，我们建议你从 OOTB 模型开始。本节将概述最常用的 OOTB 模型。\n\n### 常用的 OOTB\
  \ 模型\n\nOOTB ML 模型适用于各种用例。它们通过大量数据进行了预训练。某些 OOTB 模型可以使用你的特定数据集进行再训练，而另一些则不可再训练。大多数自动化平台现在都包含\
  \ OOTB 模型。选择正确的 OOTB 模型可以节省你的时间并加速项目进度。下图展示了 OOTB 模型的不同类别：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_28_0.png)\n\
  \n图 1.6 – 按类别划分的 OOTB ML 模型\n\n这些 OOTB ML 模型将各种形式的非结构化数据转换为可用的格式。使用这些模型可以减少对人类花费数小时阅读、处理、理解和分析非结构化文档的依赖。非结构化文档可以表现为图像、语言、表格文本和文档等形式。\n\
  \n让我们仔细看看这些模型中的每一个：\n\n- **图像分析**：有两种图像分析 OOTB 模型。下图总结了这两种模型的主要特征：\n\n  ![](img/05268897c8ac5d80eb3fead1cc8a822a_29_0.png)\n\
  \n  图 1.7 – 图像分析 OOTB 模型\n\n  这两种 OOTB 图像分析模型对许多涉及分析图像以确定后续步骤的用例非常有用。例如，图像审核模型常用于社交媒体信息流审核。OOTB\
  \ 图像审核模型会审查数百万张图像，并标记可能存在问题以供人工验证的图像。\n\n- **语言翻译**：顾名思义，语言翻译取代了从一种语言到另一种语言的繁琐翻译工作。下图总结了该模型的主要特征：\n\
  \n  ![](img/05268897c8ac5d80eb3fead1cc8a822a_30_0.png)\n\n  图 1.8 – 语言翻译 OOTB 模型\n\
  \n  这种 ML 技能可用于多种用例，通常用于客户支持。例如，许多聊天机器人由 OOTB 语言翻译模型驱动，以处理不同语言的询问。\n\n- **语言理解**：语言理解是复杂的。它指的是像人类一样从文本中提取含义的能力。下图总结了三种可用模型的主要特征：\n\
  \n  ![](img/05268897c8ac5d80eb3fead1cc8a822a_30_1.png)\n\n  图 1.9 – 语言理解 OOTB 模型\n\
  \n  语言理解 ML 模型可以模拟人类的思维并进行推理。它们有广泛的实际用途。例如，语义相似性 OOTB 模型根据用户指示的偏好提供推荐。问答 OOTB 模型通常被用作构建自动常见问题解答（FAQ）数据库的基础。最后，文本摘要\
  \ OOTB 模型从书籍和文章中提取见解。\n\n- **语言分析**：语言分析指的是从文本中提取含义的技能。它使机器或机器人能够理解句子和段落。下图总结了三种模型的主要特征：\n\
  \n  ![](img/05268897c8ac5d80eb3fead1cc8a822a_31_0.png)\n\n  图 1.10 – 语言分析 OOTB 模型\n\
  \n  语言分析 ML 模型知道如何提取单个单词之间的上下文和关系。它们有广泛的实际用途。例如，情感分析 OOTB 模型常用于管理来自客户的电子邮件。该模型会优先标记负面邮件供人工审核。文本分类模型的一个流行用途是垃圾邮件分类。最后，命名实体识别模型常用于从客户反馈中提取关键部分。\n\
  \n\n\n\n+   - **表格数据：基于树的流水线优化工具（TPOT）** 是一种为你的数据寻找最佳流水线的工具。下图总结了两个可用模型的关键特征：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_32_0.png)\n\n图 1.11 – 表格数据 OOTB 模型\n\n\
  这个 OOTB 工具将流水线构建中最繁琐的部分自动化。此外，这也是初学者创建自定义模型的入门介绍。\n\n+   - **文档**：处理文档既耗时又繁琐。许多企业花费大量时间和人力资源，将模拟文档数字化并从中提取结构化信息。下图总结了三种模型的关键特征：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_32_1.png)\n\n图 1.12 – 文档 OOTB 模型\n\n\
  可用于文档数字化的 OOTB 模型有很多。它们通常使用相关文档类型的大型数据集进行预训练，可用于加速涉及文档的认知自动化。\n\n## 实用技巧\n\n正如我们在本节中所学到的，有许多现成的\
  \ OOTB 模型。它们已被广泛使用，并被证明行之有效，而且易于尝试。想一个涉及 AI 技能的简单用例，然后尝试使用本节提到的任一 OOTB 模型。实践能让你在本书中读到的理论变得鲜活起来。\n\
  \n## 总结\n\n在本章中，你学习了开始深入 AI 领域所需的关键 AI 概念。此外，你还了解了认知自动化在扩展自动化收益方面的力量，以及你在认知自动化实施中的角色。最后，你现在已经了解了常用的\
  \ OOTB 模型，可以开始动手探索了。\n\n在下一章中，我们将深入探索自动化谱系、可用技术，以及一个利用认知自动化的相关应用来重新构想和解决业务问题的框架。\n\
  \n## 延伸阅读\n\n+   - *MIT 开放课程 – 人工智能*：https://ocw.mit.edu/courses/electrical-engineering-and-computer-science/6-034-artificial-intelligence-fall-2010/index.htm\n\
  +   - 麦肯锡的*《高管 AI 指南》*：https://www.mckinsey.com/~/media/McKinsey/Business%20Functions/McKinsey%20Analytics/Our%20Insights/An%20executives%20guide%20to%20AI/An-executives-guide-to-AI.ashx\n"
- "# 2\n\n### 2 弥合 RPA 与认知自动化之间的鸿沟\n### \n### \n### \n\n在本章中，我们将详细探讨**认知自动化**相对于纯粹**机器人流程自动化（RPA）**的优势。深入探究**办公工作谱系**至关重要，因为这样才能理解自动化技术栈、RPA\
  \ 与认知自动化之间的差距，以及人机协调在使其发挥作用中的重要性。我们还将探讨许多现实中的业务问题，让你重新构想自动化潜力的各种可能。\n\n本章将涵盖以下主要内容：\n\
  \n+   - 了解办公工作谱系\n+   - 探索 RPA 与认知自动化之间的差距\n+   - 利用认知自动化设计人机协作\n\n到本章结束时，你将学会如何通过认知自动化这一新视角来处理业务问题。你将知道如何全面审视自动化机会，以及如何设计最优的人机协作。\n\
  \n## 了解办公工作谱系\n\n我们在工作中身兼数职。如果仔细观察日常活动，每项活动都需要特定的技能组合。有些活动是可预测且基于规则的，而另一些则需要更强的认知能力。为了充分发挥自动化潜力，我们必须深入探索工作谱系的细节。本书将重点讨论办公工作，而不是体力工作。\n\
  \n任何职业的办公工作都可以归为四类。\n\n如需了解更多信息，可参考以下链接：\n\n```\nhttps://www.mckinsey.com/~/media/mckinsey/business%20functions/mckinsey%20digital/our%20insights/where%20machines%20could%20replace%20humans%20and%20where%20they%20cant%20yet/where-machines-could-replace-humans-and-where-they-cant-yet.pdf\n\
  ```\n\n下图展示了办公工作的分类及其特征：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_36_0.png)\n\
  \n图 2.1 – 办公工作谱系\n\n在办公工作谱系中，有四种类型的活动，分别是**数据收集、数据处理、应用专业技能**和**利益相关者互动**。\n\n##\
  \ 数据收集\n\n**数据收集**是指从多个来源和系统中查找、提取数据，并将数据输出到目标系统的活动。在许多情况下，最耗费资源的任务是根据一组特定规则对数据进行清洗和格式化。这些任务通常具有较高的自动化潜力。以下示例说明了不同类型的数据收集工作和挑战。\n\
  \n在**人力资源（HR）**的“从招聘到退休”流程中，数据收集占用了大量时间。雇主在收集员工生命周期数据上花费大量时间和资源。雇主利用**企业资源规划（ERP）**系统，尽量节省人力和时间。然而，仍有很多手工工作和协调工作尚未自动化。我们来看一下员工入职流程。入职流程包括来自各种来源的以下数据输入：\n\
  \n+   - 工作授权文件通常是由 HR 专业人员对纸质文件进行扫描得到的副本。\n+   - 员工基本人口统计信息通常通过员工门户收集。\n+   - 背景调查结果由背景调查公司以电子方式传送给雇主。\n\
  \n## 数据处理\n\n**数据处理**是将数据元素加工成有意义的信息。在数据处理中，对于干净的数据元素，可以进行基于规则的直通式处理。遗憾的是，数据永远不可能\
  \ 100% 干净，总需要处理异常。数据处理被认为是最早开发的自动化流程之一。随着认知自动化技术的成熟，消除异常处理的自动化潜力正在不断增加。以下示例说明了不同类型的数据处理工作和挑战。\n\
  \n审计是一个高薪职业。内部和外部审计师都经过了大量的教育和在职培训来磨练技能。然而，他们也被大量数据处理工作所累，这些工作是为了完成审计程序、生成审计报告。他们只有有限的时间用于解决问题和与客户合作，以沟通和影响更好的业务实践。以下是审计师执行的一些资源密集型数据处理活动，这些活动具有自动化潜力：\n\
  \n+   - 收集、跟进并归档审计所需文件\n+   - 根据控制要求对系统执行程序性测试\n+   - 下载各种系统报告，确保跨系统数据完整性\n+   -\
  \ 在文档中查找关键词及相关上下文，以发现潜在违规行为\n+   - 检查纸质文档中的手写内容、审批印章和签名\n\n## 应用专业技能\n\n**应用专业技能**是指利用通过经验获得的一系列技能来解决问题的能力。如下所述，专业技能分为两个层级：\n\
  \n+   - **常规专业技能：** 依靠过去反复使用的程序，持续地解决问题。\n+   - **适应性专业技能：** 这种能力不仅能解决问题，还能以新的方式解决问题。\n\
  \n我们的办公工作中有许多活动需要专业技能。专业技能要求更高的认知能力，因此更难自动化。**机器学习（ML）**在自动化常规专业技能方面已经取得成功，但其算法仍在发展，以应对适应性专业技能。以下两个示例说明了应用专业技能的不同类型工作和挑战：\n\
  \n+   - *示例 1：* 从纸质文档或**便携式文档格式（PDF）**中读取和解读发票，是应用常规专业技能的一种形式。在技术尚未出现之前，企业需要员工手动阅读发票，确定发票数据的位置和内容，然后将其录入\
  \ ERP 系统。对于发票，诸如发票编号这样的数据元素可能有不同的展现方式。人类员工会明白，*发票编号、发票号、发票号码* 和 *发票#* 都是指发票编号这一数据元素，这是基于以往大量交易的经验。如今，ML\
  \ 和**自然语言处理（NLP）**已经可以应用这种常规专业技能来自动化这一活动。\n+   - *示例 2：* 对医生而言，如果患者的症状和诊断已知，决策可以是常规性的。然而，医生也会遇到新的或意外的情况。**人工智能（AI）**目前无法判断在新的或意外的情况中哪些信息是相关的。适应性专业技能需要更高的认知能力，并且在现有技术条件下的自动化潜力较低。\n\
  \n\n\n下图展示了办公领域整个价值链中可用的技术：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_40_0.png)\n\
  \n图 2.2 – 自动化技术栈\n\nRPA、应用程序编程接口（API）、企业资源计划（ERP）和业务流程管理（BPM）属于一类旨在减少基于规则的数字活动所需人工投入的自动化技术。AI、ML\
  \ 和 NLP 则属于另一类自动化技术，它们减少了需要认知思考的活动所需的人工投入。\n\n正如你在上一节中学到的，几乎所有活动都包含基于规则和认知的成分。直到最近，尚没有平台允许将这些不同的技术无缝集成。企业正在寻找一种技术平台，以便用户能够充分利用不同的自动化技术。一种被称为认知自动化平台的新类别自动化产品应运而生。认知自动化平台简化了系统和之间的集成。它还使\
  \ AI 的开发和使用变得更加简单，并弥合了 RPA 和 AI 之间的差距。\n\n## 实用技巧\n\n将适当的认知自动化应用于工作价值链以产生效益存在着巨大的机会。早期认知自动化采纳者犯的最常见错误及其解决方案如下：\n\
  \n- 他们未能从整体上看待业务问题，而是被诸如**业务单元（BU）**等人为边界所限制。这一障碍需要高层介入以打破业务孤岛。\n- 他们希望测试和部署特定技术，并将业务问题改装以适应该技术支持。如今，许多公司都确立了“业务问题优先，技术其次”的理念。\n\
  - 他们对 AI 技术的成熟度过于乐观，并高估了 AI 的能力。更好地了解不同技术及其工作原理将有助于设定适当的预期。\n- 他们低估了人类因素的重要性，在没有考虑这种替换影响的情况下，就用技术取代了细微的人类接触点。最近大多数数字化转型旅程在其学科中包含了以人为中心的设计，以避免此问题。\n\
  \n至此，你应该对工作价值链、自动化潜力和技术栈有了很好的掌握。让我们通过完善人机协作来重新构想认知自动化。\n\n## 设计认知自动化中的人机协作\n\n在上一节中，我们探讨了办公室工作及其相对的自动化潜力。公司希望通过利用自动化来寻找更高效和有效的方法执行办公室工作。办公室工作并不由单一的*活动*组成，而是由构成*流程*的一系列活动组成。**端到端（E2E）**流程的全面自动化可能是最终目标。然而，利用当前可用的技术实现良好的*人机协作*以提高效率和效果是更现实的目标。因此，理解人类和机器如何以不同的方式工作，以及在设计认知自动化时思考人机协作的最佳方式，至关重要。\n\
  \n- 3. *将数据录入合同系统（数据处理）*：此步骤已自动化。RPA 完成登录系统并根据一组规则输入从合同中提取的数据元素的步骤。\n- 4. *查找不合规合同条款并解决（应用专业知识及利益相关者互动）*：此步骤部分自动化。文档理解\
  \ ML 模型使用 NLP 从合同文档中提取相关合同条款。然而，人类负责解释及与利益相关者讨论以解决不合规问题。机器和人类协作完成此步骤。\n\n**贷款处理**的第二个例子展示了工作价值链中需要不同技能组合的四个步骤，如下所示：\n\
  \n- 1. *通过客户门户接收贷款申请（数据收集）*：此步骤已自动化。API 将数据从客户门户路由到 ML 模型。\n- 2. *运行 ML 模型确定初步审批状态（应用专业知识）*：此步骤已自动化。ML\
  \ 模型基于过去的历史数据确定审批状态。ML 会通过新的训练数据随时间进行微调，以确保预测性能。RPA 将初步审批状态路由到异常案例队列或处理队列。\n- 3.\
  \ *审查异常案例（应用专业知识及利益相关者互动）*：此步骤部分自动化，是人在回路中辅助 RPA 的一个例子。贷款专员审查 ML 模型置信度较低的案例。RPA\
  \ 为贷款专员提取额外数据作为参考资料，连同异常案例一起提供。贷款专员利用其经验和额外数据做出最终审批决定。机器和人类协作完成此步骤。\n- 4. *处理已批准和已拒绝的案例（数据处理及利益相关者互动）*：此步骤部分自动化。RPA\
  \ 根据已批准和已拒绝的工作流处理贷款申请。在某些情况下，贷款专员会联系客户以审查决定并提出建议。机器和人类协作完成此步骤。\n\n## 在认知自动化设计中应用人类和机器工作方式之间的差异\n\
  \n人类和机器的行为和表现是不同的。下图说明了人类和机器在解决问题、记忆、生产力和情感方面的运作方式。这些差异影响我们如何设计认知自动化以实现无缝的人机协作：\n\
  \n| | 人类 | 机器 |\n|---|---|---|\n| 解决问题 | 启发式：依赖于经验法则或心理捷径 | 算法：依赖于一系列定义的步骤集 |\n\
  | 记忆 | 短期/工作记忆约 7 条信息 | 取决于 RAM（随机存取存储器）容量 |\n| 生产力 | 不间断持续时间 | 任何可用的运行时 |\n| 情感\
  \ | 能够感受和情感共鸣 | 没有感受和共鸣 |\n\n图 2.4 – 人类与机器\n\n让我们深入了解这些领域的每一个，如下所示：\n\n- **解决问题**\n\
  \n*认知自动化设计启示：* 第一步是评估手头问题的类型，以确定最合适的解决方案。如果问题是可预测的且有历史经验，当前的自动化技术更可能有效；而如果问题有许多意外选项，人类则更可能有效。无论是人类还是机器，完善算法的关键都是试错。\n\
  \n在下图中，你可以看到更多关于人类和机器如何解决问题的信息：\n\n## 解决问题\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_45_0.png)\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_45_1.png)\n\n- 人类使用**启发式**方法解决问题。人类依赖经验法则和心理捷径来解决问题。这种方法允许人类在不耗尽数百万种可能性的情况下高效地解决问题。此外，启发式方法使人类能够在意外情况下得出可接受的解决方案。\n\
  \n- 机器使用**算法**解决问题，其输出是可预测和可重复的。算法是一系列有限的定义步骤。算法最适合可预测的输入和输出。\n\n图 2.5 – 解决问题：人类与机器\n\
  \n## 记忆\n\n*认知自动化设计启示：* 由于短期工作记忆的限制，人类逐个处理记录。机器可以选择逐条或批量处理记录。使用相同的示例，针对机器的设计与针对人类的不同。\n\
  \n- 对于人类，模式可能是这样的：\n\n- 第 1 行：步骤 1，步骤 2\n- 第 2 行：步骤 1，步骤 2\n- ...\n- 第 100 行，步骤\
  \ 1，步骤 2\n\n- 对于机器，模式可能是这样的：\n\n- 步骤 1：第 1 行，第 2 行，...，第 100 行\n- 步骤 2：第 1 行，第 2\
  \ 行，...，第 100 行\n\n\n\n\n\n在以下图中，您可以看到关于机器和人类在内存方面差异的更多信息：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_46_0.png)\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_46_1.png)\n\n## 内存\n\n-   人类拥有短期工作记忆。短期工作记忆大约可以保存七条信息。如果有百条记录需要处理，且每条记录包含五个元素，人类一次只能保存一到两条记录的信息。\n\
  -   机器的内存取决于 RAM 容量。使用相同的例子，机器可以保存所有行的信息以供下一步处理使用。\n\n图 2.6 – 内存：人类与机器\n\n## 生产力\n\
  \n认知自动化设计含义：由于人类需要不间断的时间段，确保释放出的时间容量是连续的，这是一个重要的设计原则。在实践中，这意味着从自动化前的顺序步骤过渡到自动化后的批处理模式。\n\
  \n在以下图中，您可以看到关于人类和机器生产力差异的更多信息：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_46_2.png)\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_46_3.png)\n\n## 生产力\n\n-   人类需要不间断的时间段才能高效工作。在中断后重新将注意力集中在任务上需要时间。释放一小时的空闲产能是否具有影响，取决于这一小时是如何分配的。如果这一小时由六十个一分钟的增量组成，那么释放的产能并不是高效的。然而，如果这一小时由一个六十分钟的增量组成，那么释放的产能是高效的。\n\
  -   机器利用任何可用的运行时间。使用相同的例子，无论释放的一小时运行时间是如何分配的，都具有影响。机器可以用六十个一分钟的增量或一个六十分钟的增量中的任务来填满运行时间。\n\
  \n图 2.7 – 生产力：人类与机器\n\n## 情感\n\n*认知自动化设计含义：* 技术已发展到可以模拟某些情感同理心的程度。然而，如果在利益相关者的情感状态维护至关重要的情况下应用自动化，风险极高。在认知自动化设计阶段，我们需要权衡用机器替代情感反应所带来的效率提升与机器产生错误情感反应所造成的损害。\n\
  \n在以下图中，您可以看到关于人类和机器在情感反应方面差异的更多信息：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_47_0.png)\n\
  \n图 2.8 – 生产力：人类与机器\n\n现在，让我们回到前面讨论的例子，并应用这些设计原则。下图展示了使用认知自动化设计原理的未来状态设计：\n\n##\
  \ 示例 1：合同处理\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_47_1.png)\n\n## 认知自动化设计\n\
  \n-   1. **问题解决：** 大多数活动都是可预见且可预测的，使其成为自动化的良好候选对象。\n-   2. **内存：** 将机器活动分组在一起以批处理完成\n\
  -   3. **生产力：** 将人类活动与机器活动分离，以实现连续的工作时间和空闲时间\n-   4. **情感：** 将涉及情感的活动指定给人类\n\n图\
  \ 2.9 – 认知自动化设计示意图\n\n在前一节的合同处理示例中，现状有四个顺序步骤。在未来状态设计中，流程被重新分组为两个部分。一部分由机器完成，另一部分由人类执行。我们应用了每一项认知自动化设计原则来构建未来状态设计，如下所示：\n\
  \n-   **问题解决**：此流程在系统中存储合同并解决不合规问题。大多数活动要么基于规则，要么在有足够的训练数据的情况下具有可预测的结果。当前的自动化技术栈可以自动化大部分步骤。\n\
  -   **内存与生产力**：由于人类和机器的思维和执行方式不同，未来状态设计将活动重新分组为人类活动和机器活动。机器活动保持顺序执行，并可以在非工作时间运行以优化运行时调度。人类活动是独立的，可以在最方便的时候执行。人类可以决定一次处理少数活动或一次性处理所有活动，而无需依赖机器。未来状态的设计考虑了人机协作。\n\
  -   **情感**：在此流程中，唯一涉及微妙利益相关者互动的步骤是不合规解决步骤。因此，在未来状态设计中，此步骤保留给人类。然而，尽可能使用 NLP 来识别不合规问题供人类审查。人类处理所有利益相关者互动。这是另一种形式的人机协作设计。\n\
  \n## 实用技巧\n\n认知自动化是扩展自动化潜力的强大工具。当人机协作做得好时，它会改善**用户体验 (UX)**。我们已经向您展示了办公室工作的频谱和认知自动化设计原则。\n\
  \n选择一个你已完成过去的 RPA 项目。审查流程，看看它是否是认知自动化的候选对象。如果是，应用你所学到的认知自动化设计原则。设计一个未来状态并将其与你仅使用\
  \ RPA 所做的进行对比。你会发现，只需调整看待业务问题和通过自动化技术解决问题的方式，就很容易扩展自动化的收益。\n\n## 摘要\n\n在本章中，我们涵盖了认知自动化的所有方面。我们了解了办公室工作的频谱及其特征。我们探索了自动化技术栈以及填补这一差距的认知平台。我们还学习了使用认知自动化进行人机协作设计的最佳实践。\n\
  \n你在本章中所学到的内容对于以全新方式探索自动化并扩展当前自动化收益潜力至关重要。在下一章中，我们将对 UiPath 的 E2E 平台在认知自动化生命周期中的概览进行介绍。我们将探索\
  \ UiPath 文档理解、UiPath AI 中心和 Druid 聊天机器人。\n"
- "# 3\n理解认知自动化生命周期中的 UiPath 平台\n\n在本章中，我们将探索 UiPath 平台。它是市场上领先的**自动化平台**之一。了解 UiPath\
  \ 平台中的元素对于欣赏如何使用该平台通过认知自动化来加速和放大至关重要。我们还将对该平台中的三款关键 AI 产品进行概览，你将在本书中详细探索这些产品。\n\n\
  在本章中，我们将涵盖以下主要主题：\n\n-   了解选择认知自动化平台的关键成功标准\n-   介绍 UiPath 的端到端认知自动化平台\n-   认识 UiPath\
  \ 文档理解\n-   认识 UiPath AI 中心\n-   认识具有 Druid 的 UiPath 聊天机器人\n\n本章结束时，你将充分理解 UiPath\
  \ 的端到端自动化平台。你将了解每个产品具有的具体认知自动化功能。你可以参考本书中的相关章节，获得亲身体验和示例，以使用各自的产品。\n\n## 了解选择认知自动化平台的关键成功标准\n\
  \n几年前，自动化和机器人流程自动化 (RPA) 是同义词。许多公司仅使用 RPA 开始了它们的自动化之旅。此外，IT 部门在幕后运行 RPA。多年来，自动化技术已经演变。如今，公司在其认知自动化项目中使用\
  \ RPA、机器学习 (ML)、AI、聊天机器人和 NLP。此外，显而易见的是，机器人无法独自完成所有工作。人类和机器人之间的协作是解锁自动化潜力的关键。\n\n\
  选择正确的平台非常重要。你将学习选择能够支持认知自动化转型的自动化平台的关键成功标准。\n\n\n\n\n\n# 多功能自动化平台的指导原则\n\n下图展示了强大自动化平台的指导原则和优势：\n\
  \n## 强大自动化平台的指导原则\n\n| 指导原则 | 细节 | 优势 |\n|---|---|---|\n| ♻ 可复用 | 开箱即用 (OOTB) 模板\
  \ | 民主化 |\n| 简单 | 低代码，无代码 | 民主化 |\n| 开放 | 与传统和最佳应用的简单集成 | 灵活性 |\n| 强大的配置 | 几乎无需定制即可满足多样化需求\
  \ | 快速上市 |\n| 安全 | 内置治理以实现企业级保护 | 企业级和规模化 |\n| 持续变化 | 无缝升级 | 低维护成本 |\n\n图 3.1 –\
  \ 强大自动化平台的指导原则\n\n指导原则如下：\n\n- **可复用：** UiPath 平台拥有许多内置的 **开箱即用 (OOTB)** 模板，并具备强大的可复用组件管理功能，以适应不同技术能力水平的用户。UiPath\
  \ Marketplace 收录了来自 UiPath、合作伙伴和社区贡献者的这些可复用组件。\n- **简单：** UiPath 平台始终将易用性放在首位。该平台为低代码/无代码，允许从开发和运行到管理自动化，民主化端到端生命周期。它还允许对各种自动化技术进行民主化，从\
  \ RPA 和文档理解到 ML。\n- **开放：** UiPath 平台允许与其他最佳自动化技术集成，因为 UiPath 了解它可能不是唯一选择。作为平台提供商，UiPath\
  \ 使客户能够轻松组装最合适的技术栈，并在平台内无缝运行。\n- **强大的配置：** UiPath 平台是低代码/无代码平台。它具有强大的配置能力，可让简单到复杂的函数轻松配置。\n\
  - **安全：** UiPath 平台专为企业使用而设计。每项功能集始终确保安全性和可扩展性。UiPath 平台符合以下行业标准：ISO/IEC 27001、Veracode\
  \ 持续认证和 SOC 2。\n- **适应变化：** UiPath 平台自动化流程。许多外部变化无法在客户的四面墙内控制。UiPath 平台具有内置预防控制功能，可最大程度地减少意外变化带来的影响。UiPath\
  \ 鼓励使用 REFramework 以确保代码设计的健壮性和可维护性。它还提倡使用可复用组件以实现关注点分离。通过将对象存储库元素纳入每个应用程序的独立库中，这使得\
  \ UiPath 主项目中只剩下逻辑而没有 UI 交互。最后，UiPath Test Suite 执行回归测试以识别意外变化。\n\n## 认知自动化中人机协作的设计原则\n\
  \n正如我们在 *第 2 章，弥合 RPA 与认知自动化之间的差距* 中讨论的那样，协作是扩展自动化潜力到认知自动化的关键。下图展示了 UiPath 为实现其平台上无缝人机协作而遵循的关键设计原则：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_54_0.png)\n\n图 3.2 – UiPath 认知自动化中人机协作的设计原则\n\
  \n认知自动化的设计原则如下：\n\n- **人类：** UiPath 平台专为不同技术技能水平的用户设计，从新手到专业开发人员。此外，UiPath 平台允许用户以不同的模式与平台互动——虚拟机、网页、移动设备和桌面。最重要的是，人机之间的界面必须直观且安全。\n\
  - **机器：** UiPath 平台是一个开放平台，允许 UiPath 的原生程序、与最流行系统预建的接口以及外部程序。UiPath 在 RPA 领域做得非常出色，但也选择成为\
  \ AI 部分的平台和基础设施提供商。开放平台也附带安全性和治理。\n\nUiPath 平台遵循多功能自动化平台的指导原则以及认知自动化人机协作的设计原则。它是一个您可以信赖的平台，用于执行您的变革性自动化项目。\n\
  \n## 介绍 UiPath 端到端认知自动化平台\n\nUiPath 曾是 RPA 应用提供商。过去几年，UiPath 扩展了其产品并重新定位为领先的自动化平台提供商之一。由于\
  \ UiPath 目标是更广泛的自动化市场而不仅仅是 RPA，它有意识地努力在平台中遵循人机协作的设计原则，以实现无缝认知自动化。\n\n让我们逐步了解 UiPath\
  \ 平台的端到端产品集。您将很好地了解如何在您的转型之旅中利用产品集以最大化自动化的潜力。\n\n如需更多信息，您可以参考以下网址：\n\n```\nhttps://www.uipath.com/product\n\
  ```\n\n下图展示了 UiPath 端到端自动化平台：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_56_0.png)\n\
  \n图 3.3 – UiPath 端到端自动化平台\n\n**UiPath 平台**涵盖了自动化生命周期的完整周期：发现、构建、管理、参与和运行。自动化生命周期的每个支柱都遵循多功能平台的指导原则：\n\
  \n- **发现、构建和参与支柱：** UiPath 产品旨在让各种技能水平的人都能够使用 UiPath 开始参与、发现和构建自动化。产品始终牢记预建模板、可复用组件、低代码/无代码选项和灵活配置。\n\
  - **维护和运行支柱：** UiPath 产品也专为企业扩展而设计。平台是安全的、可管理的，并具有治理中心，以确保从数据到应用程序的安全，能够承受内部和外部的持续变化，能够大规模优化资源，并能够监控和主动检测问题。\n\
  \n我们现在将在以下章节中查看每个支柱。\n\n## 发现支柱 – 发现、评估和管理自动化用例管道\n\n自动化开发生命周期的 **发现** 支柱是指寻找合格自动化机会的活动。传统上，这一阶段劳动密集且主观。UiPath\
  \ 平台为此支柱提供了四种产品，使其高效且客观。下图展示了 UiPath 产品如何针对发现支柱内的不同活动：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_57_0.png)\n\
  \n图 3.4 – UiPath：发现支柱\n\n这四种产品是 **Automation Hub**、**Process Mining**、**Task Mining**\
  \ 和 **Task Capture**：\n\n- **Automation Hub** 是发现支柱中的基石产品。它是协作流程识别、自动化管道管理和流程存储库工具。\n\
  - **Process Mining** 和 **Task Mining** 是 AI 增强型产品。**Process Mining** 将您 IT 系统中的数据转化为可视化交互式仪表板，了解根本原因和风险，并识别自动化重点领域。**Task\
  \ Mining** 收集员工桌面数据，包括每次用户操作时的屏幕截图和日志数据，以建议具有高自动化潜力的流程列表。\n- **Task Capture** 帮助您深入挖掘自动化想法，使您能够快速捕获、增强和加速自动化，通过分享您工作的具体细节。\n\
  \n\n\n\n\n五个产品是 **StudioX、Studio、Marketplace、Document Understanding 和 Automation\
  \ Ops**。这些产品专为公民开发者和 RPA 开发者设计：\n\n- **StudioX** 是一个面向非技术公民开发者的无代码平台，用于自动化其任务。此外，StudioX\
  \ 是 UiPath 平台的一部分，这意味着企业级治理和安全基础设施已到位，让企业安心无忧。\n- **Studio** 是一款先进的自动化软件，为专业的 RPA\
