  \ |\n|---|---|---|\n|  | 税 | $8.50 |\n|  | **总计** | **$93.50** |\n\n图 6.12 – 发票示例\n\
  \n8. 添加所有数据字段后，点击 **Save** 并关闭分类学管理器 – 结果应与 *Figure 6.13* 类似：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_144_0.png)\n\
  \n图 6.13 – 分类学创建的结果\n\n9. 最后，在 Main.xaml 中添加一个 Load Taxonomy 活动，创建一个名为 Taxonomy\
  \ 的输出变量：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_145_0.png)\n\n图 6.14 – 在 Main.xaml\
  \ 中添加 Load Taxonomy\n\n就这样！我们的分类学已创建并将在运行时加载到自动化流程中。请注意，在你的项目文件夹中，已创建一个 Taxonomy.json\
  \ 文件。此文件可以保存并在其他项目中使用，以随时间构建中央分类学。\n\n在下一节中，我们将学习如何对发票文档进行数字化。\n\n## 介绍数字化\n\nDocument\
  \ Understanding 过程的下一步是数字化。数字化是将输入数据扫描为机器可读文本的过程。一旦数据被数字化，我们就可以分类并提取相关数据字段，以创建自动化的可执行步骤。\n\
  \nDocument Understanding 框架中的数字化有两个输出：\n\n- 输入文件的文本（存储为字符串变量）\n- 文件的文档对象模型（DOM）\
  \ – DOM 是一个包含有关文档详细信息的 JSON 对象\n\n虽然数字化是将输入数据作为机器可读文本的过程，但它不仅仅是光学字符识别（OCR）。数字化必须对任何类型的输入进行，无论是数字的还是实体的\
  \ – 任何已经是原生文本的文件（未扫描的 PDF 或文本文件）都可以不使用 OCR 而通过编程方式读取。\n\n\n\n\n\n对于需要 OCR 的文档（例如扫描的\
  \ PDF），可以在数字化过程中使用 OCR 引擎。 与 UiPath Document Understanding 框架中的数字化兼容的 OCR 引擎如下：\n\
  \n- UiPath Document OCR\n- OmniPage OCR\n- Google Cloud Vision OCR\n- Microsoft\
  \ Azure Computer Vision OCR\n- Microsoft OCR\n- Tesseract OCR\n- ABBYY Document\
  \ OCR\n\n让我们继续在进入练习之前回顾 Digitize Document 活动。\n\n## Digitize Document 活动\n\n要使 UiPath\
  \ 将文档数字化为 DOM，必须在我们的自动化项目中使用 Digitize Document 活动（图 6.15）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_146_0.png)\n\
  \n图 6.15 – 使用 OmniPage OCR 引擎的 Digitize Document 活动\n\n在 **Digitize Document** 活动中，注意\
  \ **Input** 和 **Output** 参数：\n\n- **Input:**\n  - **Document Path:** 活动设置为数字化的文档的完整路径\n\
  - **Output:**\n  - **Document Text:** 输出数字化文档的字符串文本\n  - **Document Object Model:**\
  \ 输入文件的对应 DOM\n\n在下一节中，我们将利用 Digitize Document 活动尝试数字化一份文档。\n\n## 数字化文档\n\n让我们继续以数字化为例：\n\
  \n1. 在 **Load Taxonomy** 之后将 **Digitize Document** 活动拖到工作流中。\n\n在 **Digitize Document**\
  \ 活动中，我们需要插入文件路径作为输入，并分配变量作为输出以保存文档文本和 DOM。\n\n2. 插入发票文档的路径作为 **Document Path**\
  \ 输入，并创建一个名为 `document_text` 的变量作为 **Document Text** 输出。最后，添加一个名为 `dom` 的变量作为 **Document\
  \ Object Model** 输出：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_147_0.png)\n\n\
  图 6.16 – 将 Digitize Document 活动插入到我们的工作流中\n\n请注意，我们仍然有错误消息，提示我们插入 OCR 引擎。在此示例中，我们的文档已将文本嵌入到文档中（我们可以直接从\
  \ PDF 中突出显示并复制文本），因此我们不需要依赖 OCR，但仍需要在活动中拖入一个以消除错误消息。只有在传入文档需要 OCR 处理时才会使用 OCR 引擎。\n\
  \n3. 在 Digitize Document 活动的 **Drag OCR Engine here** 区域内拖入 **Tesseract OCR**。\n\
  \n> **Important Note**\n> 有关 UiPath 支持的 OCR 引擎的更多信息，请访问 https://docs.uipath.com/document-understanding/docs/ocr-engines。\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_148_0.png)\n\n图 6.17 – 添加 Tesseract OCR\
  \ 引擎\n\n在 **Digitize Document** 活动中，我们将 **ForceApplyOCR** 标志保持为 **False**，因为我们不需要对该发票使用\
  \ OCR，因为它是一个嵌入式 PDF。如果我们将标志设置为 **True**，则会对嵌入式 PDF 使用 OCR。\n\n我们还将 **DegreeOfParallelism**\
  \ 属性保持为 1。默认情况下，该属性设置为 1。如果我们将其设置为 -1，UiPath 将使用机器上的核心数并行处理页面。任何其他正值都将使用该特定数量的逻辑处理器来处理页面。\n\
  \n有关 Digitize Document 活动的更多信息以及何时使用 OCR，请访问 https://docs.uipath.com/document-understanding/docs/digitization-overview。\n\
  \n我们现在已加载分类法并数字化了我们的发票文档。在下一节中，我们将学习如何对发票文档进行分类。\n\n## 介绍分类\n\n将输入数据数字化为机器可读文本后，我们的自动化现在可以解释输入文档中的文本。然而，虽然我们的自动化可以读取文本，但它仍然不知道读取的是什么类型的文档；因此，下一步是让自动化对文本进行分类。Document\
  \ Understanding 框架中的分类是使用数字化输入数据来识别输入的是什么类型的文档。\n\n当输入文档包含多种文档类型时（图 6.18），文档分类变得非常重要：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_149_0.png)\n\n图 6.18 – 对输入进行文档分类\n\n\
  例如，如果我们有一个包含背景表格、W2 和 1099 等混合文档的 15 页 PDF，那么通过分类，我们可以根据文档类型将 15 页文档拆分为较小的子集。如果文件包含一种文档类型，则分类将只返回一个分类结果，但如果文件包含多种文档类型，则分类结果将返回找到的文档类型以及它们对应的页码范围。\n\
  \n在下一节中，让我们看一下 Classify Document Scope 活动。\n\n## 介绍 Classifiers Scope\n\n文档的分类是通过\
  \ **Classify Document Scope** 活动执行的：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_150_0.png)\n\
  \n图 6.19 – Classify Document Scope 活动\n\n在 Classify Document Scope 活动中，注意 Input\
  \ 和 Output 参数：\n\n- **Input:**\n  - **Document Path**: 我们目标文档的完整路径\n  - **Taxonomy**:\
  \ Taxonomy Manager 返回的分类法\n  - **Document Text**: 数字化返回的文档文本\n  - **Document Object\
  \ Model**: 数字化返回的 DOM\n- **Output:**\n  - **Classification Results**: 存储在 IReadOnlyList<ClassificationResult>\
  \ 对象中的结果，包含分类置信度和 OCR 置信度等结果（图 6.20）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_151_0.png)\n\
  \n图 6.20 – 分类结果示例\n\n在介绍了 Classification Scope 活动之后，让我们继续在 Classification Scope\
  \ 活动内的 Classifiers Wizard 区域。\n\n## 介绍 Classifiers Wizard\n\n在 Classifiers Scope\
  \ 中，您会注意到一个插入不同分类器的区域；这使我们能够根据优先级利用多个分类器，如图 6.21 所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_152_0.png)\n\
  \nConfigure Classifiers\n\n图 6.21 – 同时利用多个分类器\n\n在 Classification Scope 活动中，我们将\
  \ Keyword Based Classifier 和 Intelligent Keyword Classifier 一起放置以提供更强大的分类级别。我们稍后会介绍不同类型的分类器，但让我们使用\
  \ Classifiers Wizard 配置几个分类器。\n\n通过单击 Classifiers Scope 中的 Configure Classifiers\
  \ 按钮，我们会看到一个向导，其中展示了我们的两个分类器以及我们在分类法中定义的文档类型（图 6.22）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_153_0.png)\n\
  \n图 6.22 – Classifiers Wizard\n\n在此示例中，我只在分类法中定义了一种文档类型（**UiPath Invoice**）；因此，向导中只显示一行。在\
  \ **Document Types** 列的右侧，注意我们的两个分类器。在每个分类器下方，我们有一个最小置信度百分比和一个复选框：\n\n- **Minimum\
  \ Confidence %:** 这是我们分类器的可接受置信度阈值。在上一节中，作为分类结果的一部分，我们提到了置信度作为输出。通过最小置信度 %，我们可以根据返回的置信度控制报告。\n\
  \n在 *图 6.22* 中，我们将 **Keyword Based Classifier** 的 **Minimum Confidence %** 值设置为\
  \ 50。这意味着如果 Keyword Based Classifier 能够以大于或等于 50% 置信度的值对我们的文档进行分类，则它将输出该分类。如果置信度小于\
  \ 50%，Classify Document Scope 将忽略该分类结果并且不会报告它。\n\n在此示例中，如果置信度小于 50%，则不会报告 Keyword\
  \ Based Classifier 的结果。然后会报告 Intelligent Keyword Classifier 的结果，因为它的置信度阈值为 0%。\n\
  \n> **Important Note**\n> \n> 分类器按优先级执行；左侧的优先级最高。\n\n\n\n\n\n- **Checkbox**：每个分类器下方的复选框仅用于切换是否对特定文档类型使用该分类器。在以下示例（*图\
  \ 6.23*）中，请注意 **Keyword Based Classifier** 已为 **Type1** 文档类型启用，而 **Intelligent Keyword\
  \ Classifier** 已为 **Type2** 文档类型启用：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_154_0.png)\n\
  \n图 6.23 – 为不同文档类型启用分类器\n\n在本节中，我们回顾了使用 Keyword Based Classifier 和 Intelligent Keyword\
  \ Classifier 的 Classifiers Wizard。在下一节中，我们将回顾 Document Understanding 中提供的不同类型的分类器。\n\
  \n## Reviewing the types of classifiers\n\n根据用例的需求，您可能会倾向于使用 Document Understanding\
  \ 中提供的以下一个或多个分类器：\n\n- The Keyword Based Classifier\n- The Intelligent Keyword Classifier\n\
  - The FlexiCapture Classifier\n- The Machine Learning Classifier\n\n在呈现 Classification\
  \ Station 时，用户将能够查看和纠正自动化执行的分类。在 Classification Station 中，用户可以通过点击并拖动页面来重新排列页面，并验证分类器执行的分类（图\
  \ 6.24）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_156_0.png)\n\n图 6.24 – 使用 Classification\
  \ Station 验证分类的发票\n\nImportant Note\n有关 Classification Station 的更多信息可在 UiPath 文档中找到：https://docs.uipath.com/activities/docs/present-classification-station#using-classification-station.\n\
  \n在 Classification Station 完成分类验证后，我们可以利用人工验证来重新训练并加强所使用的分类器。在下一节中，我们将讨论如何训练分类器。\n\
  \n## Training classifiers\n\nDocument Understanding 框架的强大功能之一是能够在验证后关闭反馈循环并重新训练分类器。利用人工输入是自动化自我学习和提高未来执行性能的绝佳方式。分类器的训练是通过\
  \ Train Classifiers Scope 活动完成的，如以下屏幕截图所示：\n\n## Classifying a document\n\n让我们继续我们的分类示例。\n\
  \n在此示例中，我们的页面上只有一个发票类型，因此分类并非完全必要。但是，如果我们的输入文件包含多个文档（例如多张发票），则需要进行分类：\n\n1. 在 **Digitize\
  \ Document** 之后将 **Classify Document Scope** 活动拖入工作流。\n\n在 **Classify Document Scope**\
  \ 活动内，我们需要插入文件路径、分类法、文档文本和 DOM 作为输入，并分配一个变量作为输出以保存分类结果。\n\n2. 将发票文档的路径插入 **Document\
  \ Path** 输入，并将我们的分类法、文档文本和 DOM 变量插入 **Taxonomy**、**Document Text** 和 **Document\
  \ Object Model** 输入。\n\n3. 创建一个名为 `classification_results` 的变量并将其插入 **Classification\
  \ Results** 输出：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_158_0.png)\n\n图 6.26\
  \ – 在添加分类器之前 Classify Document Scope 活动\n\n由于此文档是嵌入式 PDF，我们可以使用 Keyword Based Classifier\
  \ 进行分类。`Sliced Invoices` 模板看起来非常标准化，文档开头会出现文本 `Sliced Invoices`，因此我们可以将其用作匹配关键字。\n\
  \n4. 在项目文件夹中保存一个空白 JSON 文件，命名为 classification.json。此 JSON 文件将在我们管理 Keyword Based\
  \ Classifier 的学习时使用。\n\n5. 点击 Manage Learning 并选择我们最近创建的 classification.json 文件以开始学习。\n\
  \n在 Keyword Based Classifier 学习窗口中，请注意来自我们分类法的文档类型（Sliced Invoices）。要开始学习过程，我们需要在文档类型中包含常用关键字。如前所述，文本\
  \ Sliced Invoices 与此类型发票一致，因此让我们将其用作关键字。\n\n6. 点击 Add new keyword set，并添加关键字 \"\
  sliced invoices\" 和 \"sliced invoices\"（图 6.27）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_159_0.png)\n\
  \n图 6.27 – 学习 Keyword Based Classifier\n\n接下来配置我们的分类器。如果我们同时使用多个分类器，配置分类器将非常重要；然而，在本例中，我们仅使用一个分类器，因此我们必须确保它已启用，并且其置信度阈值设置为\
  \ 0%，以便返回 Keyword Based Classifier 的所有结果。\n\n7. 点击 **Configure Classifiers**。将最小置信度设置为\
  \ 0%，并确保 **Keyword Based Classifier** 下方的复选框已填充：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_160_0.png)\n\
  \n图 6.28 – 将 Keyword Based Classifier 设置为 0% 置信度\n\n完成此操作后，我们的 Classifiers Scope\
  \ 就完成了。下一步是检查分类器的置信度。在本例中，如果分类器返回的置信度低于某个百分比，让自动化启动 Classification Station 以从用户那里获得更准确的分类。\n\
  \n8. 在 Classification Scope 之后拖入一个 **If** 活动，将以下内容作为条件插入：\n\n```\nclassification_results(0).Confidence\
  \ < .5\n```\n\n13. 最后，点击 Configure Classifiers，选择 Sliced Invoices 文档类型的 Keyword\
  \ Based Classifier Trainer（图 6.30）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_162_0.png)\n\
  \n图 6.30 – 保存 Keyword Based Classifier Trainer\n\n分类就到此为止！尝试运行自动化。如果 Classification\
  \ Station 未出现，请尝试提高 If 语句中的置信度阈值。也可以插入日志消息或消息框活动以打印置信度，并注意每次验证运行后置信度如何提高。\n\n现在，我们已加载分类法、数字化文本并对发票文档进行了分类。在下一节中，我们将学习如何从数字化文本中提取数据。\n\
  \n## Introducing extraction\n\n一旦我们的文档类型分类完成，自动化现在就可以从每个文档中提取相关信息。通过提取，自动化将根据 Document\
  \ Understanding 框架开始时创建的分类法提取相关数据字段。\n\n## Introducing the Data Extraction Scope\n\
  \n提取是通过 **Data Extraction Scope** 活动执行的：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_163_0.png)\n\
  \n图 6.31 – Data Extraction Scope\n\n在 **Data Extraction Scope** 活动中，让我们介绍存在的 **Input**\
  \ 和 **Output** 参数：\n\n- **Input**:\n  - **Document Path**：目标文档的完整路径\n  - **Taxonomy**：来自\
  \ Taxonomy Manager 的分类法\n  - **Classification Result**：分类结果\n  - **Document Text**：来自数字化的文档文本\n\
  \  - **Document Type Id**：Taxonomy Manager 中找到的文档类型 ID – 如果使用分类结果，此字段为可选\n  - **Document\
  \ Object Model**：来自数字化的 DOM\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_165_0.png)\n\
  \n# Figure 6.33 – Leveraging multiple classifiers at once\n\n请注意在每个提取器（**Regex Based\
  \ Extractor** 和 **Form Extractor** 来自 *图 6.33*）中，能够在文档类型内每个字段右侧切换复选框的功能。这使得可以采用混合方法，利用每个数据字段的多个分类器，允许我们为每个数据字段设置特定的提取器，或允许我们将多个提取器设置为“后备”提取器，如果最高优先级提取器返回的置信度较低。\n\
  \n\n\n\n\n## 查看提取器类型\n\n根据你的用例需求，你可能会倾向于使用“文档理解”中提供的以下一种或多种提取器：\n\n- **基于正则表达式的提取器**：这是一种基于正则表达式匹配来提取数据的简单提取器。此提取器最适合较简单的用例，即目标数据字段采用标准、可预测的格式。虽然此提取器支持文本字段和表格字段，但它无法重新训练。如果你的目标数据字段存在（格式和上下文上的）变化，那么表单提取器或机器学习提取器可能是更好的选择。\n\
  \n- **表单提取器**：这是另一种基于标准化文档提取数据的简单提取器。表单提取器依赖定义的模板，根据页面级锚点来识别和提取值。如果需要处理多种不同布局，或文档倾斜（旋转、弯曲或尺寸不一），不建议使用此提取器。此提取器无法重新训练。\n\
  \n- **智能表单提取器**：它在表单提取器的基础上构建，提供额外功能，如手写识别、手写数据提取和签名检测。智能表单提取器非常适合打印或手写文档，或需要验证签名的用例。此提取器无法重新训练。\n\
  \n- **机器学习分类器**：它利用部署到UiPath AI Center的机器学习技能来提取文档。此提取器非常适合各种布局的结构化或半结构化文档。它可以通过*机器学习提取器训练器*重新训练。\n\
  \n- **FlexiCapture提取器**：它由ABBYY构建，用于根据ABBYY FlexiCapture定义提取文档。此提取器可在`UiPath.Abbyy.Activities`包中找到。\n\
  \n我们将在后面的章节中进一步讨论如何使用其中一些提取器。\n\n## 验证提取器\n\n与分类一样，我们可能需要使用**验证站**对提取器输出进行人工验证。通常建议使用验证站以确保100%的准确率——在返回自动化之前，最好由人工进行快速检查。\n\
  \n验证站可用于有人值守和无人值守自动化，对于有人值守使用“呈现验证站”活动，对于无人值守使用UiPath操作中心的“创建文档验证操作”、“等待文档验证操作”和“恢复”活动。\n\
  \n当呈现验证站时，用户将能够查看和纠正自动化执行的提取。在验证站中，用户可以旋转页面、验证文档类型，以及验证提取器执行的提取（图6.34）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_167_0.png)\n\
  \n图6.34 – 验证站\n\n通过验证站完成提取验证后，我们可以利用人工验证来重新训练和强化所使用的分类器。在下一节中，我们将讨论如何训练提取器。\n\n\
  ## 训练提取器\n\n与分类类似，我们可以在验证后闭合反馈回路并重新训练提取器。这种重新训练模式有助于提高提取器在未来执行中的性能。分类器的训练通过“训练提取器范围”活动执行。在“训练提取器范围”活动中，我们将介绍以下输入参数：\n\
  \n- **文档路径**：目标文档的完整路径\n- **文档文本**：数字化返回的文档文本\n- **文档对象模型**：数字化返回的DOM\n- **人工验证数据**：验证站结果\n\
  \n以下提取器可以重新训练：\n\n- 机器学习分类器\n\n## 从文档中提取数据\n\n让我们继续示例，进行提取。\n\n我们将采用与分类类似的框架进行提取。让我们提取数据并验证置信度是否低于阈值：\n\
  \n1. 将**数据提取范围**拖到工作流中。\n2. 将文档文件路径、分类法、文档文本和DOM作为输入插入。在**分类结果**输入中，插入第0个分类结果，因为**分类结果**是分类结果的集合。\n\
  3. 创建一个名为`extraction_results`的变量（类型为`ExtractionResult`），并将其作为数据提取范围中的输出。\n\n对于此示例，我们将使用表单提取器，因为我们的发票只有一种布局，且其格式没有倾斜、旋转或缩放。\n\
  \n4. 将**表单提取器**拖入**数据提取范围**，并将你的API密钥插入该活动。\n\n```\nclassification_results(0)\n\
  ```\n\n**重要说明**\n你可以通过导航到 **Automation Cloud** 账户的 **管理员 > 许可证** 页面来获取API密钥。点击 **文档理解**\
  \ 旁边的刷新按钮即可生成API密钥。\n\n5. 在**表单提取器**中单击**管理模板**，并单击**创建模板**以开始创建新模板。\n\n6. 出现提示时，使用PDF发票作为模板，配置**创建新模板**表单（*图6.35*）：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_169_0.png)\n\n图6.35 – 创建新模板\n\n7. 打开后，系统将提示你选择第1页匹配信息。按住Ctrl并单击右上角的“发票”、页面底部的“感谢您选择……”句子以及页面底部的“第1页，共1页”：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_170_0.png)\n\n图6.36 – 设置第1页匹配信息\n\n8.\
  \ 对于分类法定义的数据字段，选择锚点选择模式（按键D+S），然后左键单击并高亮表单上的相关文本，在目标文本周围绘制蓝色框。\n\n9. 接下来，按住Ctrl并单击相关锚点来选择锚点：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_170_1.png)\n\n图6.37 – 选择发票编号的数据字段\n\n\
  10. 文本高亮后，要确认，请单击数据字段下方的“提取值”加号（按键F+C）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_171_0.png)\n\
  \n图6.38 – 确认我们的选择\n\n11. 对发票表格中的每个数据字段和每个数据行执行相同操作。单击“保存”以保存更改，单击“关闭”以关闭模板管理器。\n\
  \n12. 在“数据提取范围”中单击“配置提取器”，为“切片发票”文档类型选择“表单提取器”——我们将对“切片发票”文档类型的所有数据字段使用表单提取器：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_171_1.png)\n\n图6.39 – 配置提取器\n\n利用这些提取的数据，我们可以轻松继续自动化流程——无论是直接处理数据，还是将其插入Excel。\n\
  \n## 从文档导出数据\n\n让我们以导出操作来结束示例。\n\n导出已验证数据非常快速；我们只需使用**导出提取结果**活动将数据导出到数据表中，然后在自动化中稍后使用该数据（例如添加到Excel、发送电子邮件或添加更多逻辑）。\n\
  \n1. 将**导出提取结果**活动拖到工作流末尾。\n2. 将提取结果变量作为输入插入。\n3. 创建一个名为dataSet的变量（类型为DataSet），并将其作为输出插入：\n\
