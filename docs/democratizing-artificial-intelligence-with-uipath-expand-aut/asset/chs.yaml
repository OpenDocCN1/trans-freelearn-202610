  - Open source Language Comprehension\n- Open source Language Translation\n- Open\
  \ source Tabular Data\n- Open source Time Series\n\n在回顾了开箱即用的包后，让我们接下来看看如何创建包。\n\
  \n## 创建包\n\n由于我们正在进行文本分类练习，让我们选择 UiPath 的开箱即用 ML 包：\n\n- 1. 通过点击项目仪表板中的 **ML Packages**\
