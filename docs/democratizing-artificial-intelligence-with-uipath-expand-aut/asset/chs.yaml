  \ **Evaluation run** 作为管道类型，Test Classification 包的版本 6.1，以及测试数据集文件夹作为输入数据集：\n\n\
  # Create new pipeline run\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_180_0.png)\n\
