  \n创建与 ML 技能的连接后，我们现在可以通过传递输入来测试它，如图 11.12 所示。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_358_0.png)\n\
  \n图 11.12 – 测试 ML 技能\n\n通过提供输入 [10, 20, 30]，我们可以看到结果为 140 和三个系数。\n\n就是这样！在本节中，我们为\
  \ AI Center 准备了一个自定义 Python ML 模型，将包压缩并上传到 AI Center，并创建了一个 ML 技能并将其连接到 UiPath。通过我们介绍的内容，您应该能够准备自定义\
  \ ML 模型并将其导入 AI Center。\n\n## 总结\n\n在本章中，我们介绍了 NER 的概念以及如何将其应用于 UiPath AI Center。接着，我们通过一个线性回归\
  \ Python 模型的简单用例，学习了如何为 AI Center 准备自定义 Python 模型。有了这些基础，您现在可以进一步使用 NER 构建用例，或将您自己的自定义\
  \ Python 模型上传到 AI Center。\n\n至此，本书已接近尾声。此时，我们相信您已经具备识别、设计、构建和测试认知自动化机会的技能和基础。我们希望您享受这段旅程，并能在我们将认知自动化带给世界的过程中将所学提升到新的高度。\n"
