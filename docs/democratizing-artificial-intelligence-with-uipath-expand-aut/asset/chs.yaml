  \nupgrade_appY\n\nbuttonClass\n\nbuttonClass\n\n+ AddChoice\n\nIs first step?\n\n\
  Is last step?\n\nFigure 10.7 – Adding choices to the Self-Help flow step\n\n+ 6.\
  \ Click Save to save your choices.\n\nGreat! By clicking Save, we have added a choice\
  \ that will look similar to this when we test it out. Note that by checking BlockUserInput,\
  \ the user can only select from the two buttons and not add free text:\n\nWhat can\
