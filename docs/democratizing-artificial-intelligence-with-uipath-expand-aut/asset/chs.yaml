- '## Section 1: The Basics


  在本节中，RPA 开发者将学习相关的 AI 概念，了解认知自动化如何与 RPA 协同工作以提升自动化潜力，并对 UiPath 平台中的 AI 策略和方法有更深入的认识。


  本节包含以下章节：


  - Chapter 1, Understanding Essential Artificial Intelligence Basics for RPA Developers

  - Chapter 2, Bridging the Gap between RPA and Cognitive Automation

  - Chapter 3, Understanding the UiPath Platform in the Cognitive Automation Life
  Cycle

