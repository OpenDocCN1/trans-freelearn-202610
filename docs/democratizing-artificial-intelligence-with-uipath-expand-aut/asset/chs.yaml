  \ 日志。\n\n### 介绍日志\n\nAI Center 的日志页面是 AI Center 中发生的所有事件的汇总视图，例如 Orchestrator 的日志页面。\n\
  \n以下是在 AI Center 中记录的事件：\n\n- **ML 包验证事件：** 当模型更新时\n- **Pipeline 事件：** 当管道开始或失败时\n\
  - **ML 技能部署事件：** 当技能创建时\n- **ML 技能预测事件：** 当技能正在工作时，抛出失败：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_185_0.png)\n\
  \n图 6.51 – ML 日志示例\n\n我们了解了 AI Center 的各个组件以及如何使用它们。在后续章节中，我们将在构建用例示例时使用 AI Center，但现在，让我们继续使用\
  \ UiPath 的计算机视觉。\n\n## 开始使用 UiPath Computer Vision\n\nUiPath Computer Vision 为自动化提供了额外的能力，使其能够看到计算机屏幕并识别页面上的元素，而非通过传统的属性集对元素进行窥探。这释放了智能交互更复杂用例的能力，这些用例包括\
  \ VDI、不受支持的应用程序，甚至操作系统。\n\n为了与页面上的元素（如文本字段和按钮）进行交互，传统的 RPA 自动化利用这些元素的属性或属性，称为**选择器**。UiPath\
  \ 自动化通常与大多数应用程序兼容，并且能够为自动化与之交互找到选择器；然而，存在一些技术，对于这些技术来说，找到选择器是不可行的，需要替代解决方案。\n\n\
  在过去，大多数包含无法找到选择器的应用程序的用例要么被排除在范围之外，要么通过诸如图像识别等脆弱的解决方案来解决。为了帮助弥合差距并为这类用例提供解决方案，UiPath\
  \ 开发了 Computer Vision，这是一种基于 ML 的方法，用于在屏幕上定位元素。这开启了新的自动化机会光谱，因为自动化现在可以在以前无法使用扩展（如\
