  \n\n\n\n\nUiPath 已将 Druid 的无代码、AI 驱动的聊天机器人原生集成到 UiPath 平台中。集成 Druid 的 UiPath 平台具有诸多优势。Druid\
  \ 拥有超过 500 个预构建的对话技能、可配置的 NLP 和训练模型、多种部署选项、多种参与模式，以及与 UiPath 的原生集成。\n\n## Summary\n\
  \n在本章中，我们探讨了 UiPath 平台的各个方面。UiPath 平台非常适合希望通过认知自动化加速和放大其转型之旅的公司。我们学习了认知自动化平台的关键成功标准。我们提供了整个\
