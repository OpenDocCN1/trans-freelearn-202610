  \ Cloud 主页\n\n2. 导航到 Admin，如下面的屏幕截图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_268_0.png)\n\
  \n图 9.2 – 单击 Admin\n\n3. 在 **DefaultTenant** 中，单击 **Tenant Settings**，如下面的屏幕截图所示：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_269_0.png)\n\n图 9.3 – 单击 Tenant Settings\n\
  \n4. 在 **Provision Services** 下选择 **AI Center**，然后单击 **Save**。该过程如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_270_0.png)\n\
  \n图 9.4 – 勾选 AI Center，然后单击 Save\n\n一旦启用了 AI Center，我们就完成了本章的技术要求。在下一节中，我们将通过查看当前状态开始收集有关该用例的背景信息。\n\
  \n### 了解当前状态\n\n让我们通过了解该流程的当前状态来开始这个用例。每天，*Company ABC* 的会计团队都会收到供应商提交的发票，作为其 **采购到付款（P2P）**流程的一部分，如下面的屏幕截图所示：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_271_0.png)\n\n图 9.5 – Company ABC 的 P2P\
  \ 流程\n\n根据 *Company ABC* 的规定，供应商必须将发票发送到会计团队维护的中央收件箱。会计团队收到这些发票后，会对其正确性进行审核，并将其输入到记录系统中，在系统中进行核对，如果一切正确，则将其转发给**应付账款（AP）**部门进行付款。\n\
  \n*Company ABC* 今年表现非常好，因此采购的商品和服务比往年更多。采购量的激增给会计团队带来了压力，因为他们需要努力维持高效的 P2P 流程。造成这种压力的部分原因是共享发票收件箱中收到的垃圾邮件增多。团队希望能够有效过滤掉垃圾邮件，以便专注于处理发票。\n\
  \n从当前状态来看，这里似乎有大量的自动化机会——回顾 *第 4 章，识别认知机会* 中自动化机会的特征，我们可以看到这个自动化机会具有以下特征：\n\n- **与应用程序的手动交互**：会计分析师手动操作共享电子邮件收件箱。\n\
  - **重复性**：对于收件箱中收到的每封电子邮件，都执行相同的步骤。\n- **耗时**：审核垃圾邮件和清理收件箱可能非常耗时。\n\n从可行性的角度来看，我们可以轻松创建自动化来监控收件箱中收到的电子邮件，并区分垃圾邮件和非垃圾邮件。此外，从可行性的角度来看，为这些分析师自动化此流程的部分内容可以带来以下好处：\n\
  \n- **提高产能**：实施自动化可以让分析师将更多时间花在高价值任务上，而不是清理电子邮件收件箱。\n- **减少错误**：实施自动化可以创建一个更干净的收件箱，确保会计团队不会遗漏任何发票电子邮件。\n\
  \n该流程中的自动化可以为会计团队带来巨大的影响。创建自动化来过滤电子邮件收件箱中的垃圾邮件是我们可以为会计团队构建的众多潜在用例之一。在下一节中，我们将重点为实施自动化处理收据创建未来状态设计。\n\
  \n### 创建未来状态设计\n\n基于我们对当前状态和会计团队痛点的新的理解，我们可以开始为自动化创建未来状态设计。由于此自动化不需要人工交互，因此为此用例创建未来状态设计通常很简单，如下面的屏幕截图所示：\n\
  \n\n\n\n## 未来状态设计\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_273_0.png)\n\n图 9.6\
  \ – 高级未来状态设计\n\n对于这个用例，自动化的职责是监控会计团队的共享收件箱。自动化可以在后台运行，适用于有人值守或无人值守场景，扫描共享收件箱中的新邮件。一旦收到邮件，自动化将检索邮件、读取其内容，并根据邮件正文内容将邮件分类为垃圾邮件或非垃圾邮件。最后，根据分类结果，自动化将邮件路由到相应的文件夹，以便会计分析师可以审查它。自动化将路由到的文件夹列表如下：\n\
  \n- 发票\n- 低置信度\n- 垃圾邮件\n- 重新训练-非垃圾邮件\n- 重新训练-垃圾邮件\n\n设置“低置信度”邮件文件夹的原因，是为了为自动化分类信心不足的邮件提供一个落脚点。我们不希望出现发票被错误地放入垃圾邮件文件夹的情况，因此任何自动化处理起来有困难的邮件都将被路由到“低置信度”文件夹。我们还将为用例添加重新训练组件，可以将错误分类的邮件移动到其中一个“重新训练”文件夹中，以重新训练我们的\
  \ ML 技能。\n\n总之，作为本用例的未来状态设计，我们要构建的项目可以利用于有人值守或无人值守类型场景。自动化将监控电子邮件收件箱，并根据其正文内容路由传入的邮件。根据自动化的分类结果，传入的邮件将被路由到三个文件夹中的一个。最终用户随后可以更快速地审查发票，无需通过此自动化持续清理共享收件箱。\n\
  \n## 使用 AI Center 构建解决方案\n\n当我们着手构建用例时，可以将开发拆分为以下两个部分：\n\n1. 创建 ML 技能\n2. 构建自动化工作流\n\
  \n我们将首先把我们的 ML 技能部署到 AI Center，然后在 UiPath Studio 中创建自动化工作流。让我们从创建 ML 技能开始。\n\n###\
  \ 创建 ML 技能\n\n在本节中，我们将使用 AI Center 为我们的用例创建和训练一个 ML 技能。通过部署 ML 包，并加载数据集来训练和评估我们的\
  \ ML 模型，我们将构建一个准备好与自动化工作流配合测试的 ML 技能。\n\n### 创建 AI Center 项目\n\n在部署 ML 包或创建 ML 技能之前，我们必须在\
  \ AI Center 中创建一个项目。为此，请按照以下步骤操作：\n\n1. 导航到 UiPath Automation Cloud 并点击 AI Center\
  \ 开始，如下图中高亮所示：\n\n尽管**短信服务 (SMS)** 文本与电子邮件文本略有不同，但它仍然可以验证过滤垃圾邮件与非垃圾邮件的用例。对于这个项目，我们采用了*短信垃圾邮件数据集*，并将数据划分为*训练、评估、测试*和*生产*数据集，可以在以下\
  \ GitHub 链接中找到：\nhttps://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter09/Email%20Data.\n\
  \n> **重要提示**\n> 数据集已被划分为小型和大型数据集。大型数据集是全量数据集，而小型数据集只是大型数据集的一个子集。您可以自由选择使用哪一个，但请注意，使用大型数据集训练所需时间远长于使用小型数据集。\n\
  \n在将数据上传到 AI Center 之前，让我们快速查看一下训练数据集：\n\n| 文本 | 标签 |\n|---|---|\n| Go until jurong\
  \ point, crazy.. Available o | ham |\n| Ok lar... Joking wif u oni... | ham |\n\
  | Free entry in 2 a wkly comp to win FA Cu | spam |\n| U dun say so early hor...\
  \ U c already the | ham |\n| Nah I don't think he goes to usf, he lives | ham |\n\
  | FreeMsg Hey there darling it's been 3 we | spam |\n| Even my brother is not like\
  \ to speak wit | ham |\n| As per your request 'Melle Melle (Oru M | ham |\n| WINNER!!\
  \ As a valued network custome | spam |\n\n图 9.8 – 训练数据集\n\n在数据集中，我们有两列，**文本**和**标签**，包含以下信息：\n\
  \n- `text` 是短信信息的纯文本。\n- `label` 是垃圾邮件或普通邮件的分类。\n\n现在我们对数据集有了一点了解，让我们按照下一步将训练数据集添加到\
  \ AI Center：\n\n1. 在项目仪表盘中，点击**数据集**导航到**数据集**页面。\n2. 点击**创建新项**以创建新数据集，为我们的数据集提供名称\
  \ `Email Classification`。\n3. 数据集创建后，点击**上传**，将以下 GitHub 链接中的训练和评估文件夹上传到 AI Center：`https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter09/Email%20Data`。\n\
  \n上传完成后，Email Classification 数据集应该看起来像这样：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_277_0.png)\n\
  \n图 9.9 – Email Classification 数据集\n\n将数据集加载到 AI Center 后，我们现在可以继续部署 ML 包并运行我们的流水线。\n\
  \n### 创建 ML 包\n\n如*第 6 章，了解您的工具*中所述，AI Center 中的 ML 包是一个文件夹，包含服务 ML 模型所需的所有代码和关联文件。\n\
  \n由于我们要执行文本分类练习，我们将使用 UiPath 即开即用的 EnglishTextClassification ML 包。以下是您需要遵循的步骤：\n\
  \n1. 通过点击项目仪表板中的 **ML Packages** 标签导航到 **ML Packages**。\n2. 当显示**创建新包**时，点击**即开即用包**。\n\
  3. 在**即开即用包**下方，选择 **Language Analysis > EnglishTextClassification**，并选择 **Package\
  \ Version 6.0**。\n\n在为 ML 包提供名称后，您应该能在项目仪表板中看到您的新 ML 包。创建我们的包后，让我们探讨创建一个可以训练我们新部署的\
  \ ML 包的流水线。\n\n### 创建流水线\n\nML 流水线是一系列步骤，用于生成 ML 模型。在流水线过程中，我们将提供输入，一旦完成，流水线将产生一组可用的输出和日志，从而导致\
  \ ML 技能的创建。\n\n在 AI Center 中，有三种类型的流水线，如下所示：\n\n- **训练流水线**：从输入 ML 包和数据集中生成新训练的\
  \ **ML Package** 版本\n- **评估流水线**：从新训练的 **ML Package** 版本和数据集中生成一组指标和日志\n- **完整流水线**：完整的数据处理流水线，执行训练和评估流水线\n\
  \n对于这个用例，让我们使用我们新部署的训练和评估数据集来运行训练和评估流水线。请按以下步骤操作：\n\n1. 通过点击项目仪表板中的 **Pipelines**\
  \ 标签导航到 **Pipelines**。\n2. 点击**创建新项**以创建新流水线，选择以下内容：\n\n    - **流水线类型**：`Train run`\n\
  \    - **选择包**：`TextClassification`\n    - **选择包主版本**：`6`\n    - **选择包次版本**：`0`\n\
  \    - **选择输入数据集**：`Email Classification/train/`\n    - **启用 GPU**：关闭此选项\n\n   \
  \ 在**环境变量**下，添加以下环境变量：\n\n    - `input_column`：`text`\n    - `target_column`：`label`\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_279_0.png)\n\n图 9.10 – 创建训练流水线\n\n3.\
  \ 点击**创建**以启动训练流水线。\n\n> **重要提示**\n> 数据集的大小将影响流水线的持续时间。选择**启用 GPU**可以导致更快的输出，但 UiPath\
  \ 社区版没有**图形处理单元 (GPUs)**。\n\n4. 再次执行*步骤 2、3 和 4*，选择 `Evaluation run` 作为流水线类型，`TextClassification`\
  \ 包的版本 6.1，以及 `evaluation` 数据集文件夹作为输入数据集。您的屏幕现在应该看起来像这样：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_280_0.png)\n\
  \n图 9.11 – 创建评估流水线\n\n\n\n\n完成后，评估流水线将输出几个产物，如下所示：\n\n- `Evaluation.csv`：用于评估模型的数据\n\
  - `Evaluation-report.pdf`：流水线运行的输出报告\n\n如果查看评估报告，你会发现即使数据量相对较少，也能获得相当不错的性能。\n\n\
  在评估报告中要关注的**关键绩效指标（KPI）**是：对于二分类问题，F值应高于80%；对于多分类问题，F值应高于70%。在本例中，我们刚好达到了80%；不过，如果我们想提高这个数字，可以扩大数据集，或者通过重训练机制来闭合反馈回路，我们稍后会构建这一机制。\n\
  \n就这样！在下一节中，我们将部署ML技能。\n\n## 部署ML技能\n\n一旦部署到AI Center，ML技能便可供自动化使用。在UiPath Studio中选择**ML技能**活动，你可以从AI\
  \ Fabric上已部署的ML技能列表中进行选择，按需传入输入数据并利用输出数据。\n\n模型经过训练和评估后，我们现在可以将其部署为可与**机器人流程自动化（RPA）**一起使用的技能。操作步骤如下：\n\
  \n1. 在项目仪表板中，点击**ML技能**选项卡，导航至**ML技能**。\n2. 点击**创建新**来创建新的ML技能，并选择以下选项：\n   - **名称：**\
  \ `Email_Spam_Classification`\n   - **选择包：** `TextClassification`\n   - **选择包主版本：**\
  \ 6\n   - **选择包次版本：** 1\n   - **启用自动更新：** 打开此选项\n\n你的屏幕现在应如下所示：\n\n**创建新ML技能**\n\
  \n| 字段 | 值 |\n|-------|-------|\n| 名称* | Email_Spam_Classification |\n| 选择包* | TextClassification\
  \ |\n| 选择包主版本* | 6 |\n| 选择包次版本* | 1 |\n| 技能描述 | 输入技能描述 |\n| 启用GPU |  |\n| 启用自动更新\
  \ |  |\n| 非活动时间过后取消部署技能： | 1周 |\n\n图9.12 – 创建ML技能\n\n3. 点击**创建**来创建ML技能。\n\nML技能部署到AI\
  \ Center后，我们就可以继续通过构建自动化工作流将其与自动化连接起来。回顾一下，在本节中，我们在AI Center中创建了一个项目，加载了数据集，创建了ML包，创建了训练和评估流水线，最后还部署了一个ML技能。\n\
  \n## 构建自动化工作流\n\nML技能部署完成后，我们可以将重点转向为该用例创建自动化工作流。在实现这个用例时，我们将通过以下几个步骤来构建项目：\n\n\
  1. 创建项目\n2. 构建ML工作流\n3. 构建补充工作流\n4. 构建**Main**工作流\n\n完成这些步骤后，我们的项目基础就完成了，可以进入测试阶段。\n\
  \n### 创建项目\n\n对于这个项目，我们将在Studio中使用**事务处理**模板（图9.13）创建一个流程图工作流。要使用**事务处理**模板启动项目，请完成以下步骤：\n\
  \n1. 导航到UiPath Studio的**模板**选项卡。\n2. 选择**事务处理**。\n3. 将项目命名为`Email Classification`，并提供保存项目的文件夹位置。\n\
  4. 点击**创建**来创建项目并开始使用。\n\n**事务处理**模板如下面的截图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_284_0.png)\n\
  \n图9.13 – 事务处理模板\n\n当你打开新建项目的`Main.xaml`文件时，你会看到**事务处理**模板，这是一个为基本自动化项目设计的流程图。在**Main**流程图中，你会注意到几个预置的容器，如下所述：\n\
  \n- **数据输入：** 这里的目的是检索运行项目所需的数据。在我们的用例中，将使用此序列来检索邮件。\n- **是否有输入？** 这里的目的是检查是否存在输入数据。在本用例中，我们将使用此流程决策来检查是否检索到新邮件。\n\
  - **事务处理：** 这里的目的是对每个事务执行一组操作。在本用例中，我们将使用此流程图来读取和分类邮件。\n- **结束流程：** 这里的目的是执行收尾活动。在本用例中，我们最初将其留空，但后续可能会用其进行测试。\n\
  \n项目创建完成后，在UiPath Studio中点击**管理包**，并将以下依赖项添加到项目中：\n\n- `UiPath.MLServices.Activities`\n\
  - `UiPath.WebAPI.Activities`\n\n创建项目到此结束。我们将在后面的章节中回到**Main**工作流，并在那里构建**Main**工作流，但目前我们先来构建ML和补充工作流。\n\
  \n### 构建ML工作流\n\n自动化项目创建完成后，我们可以专注于创建一些补充工作流，这些工作流将成为**Main**工作流的构建模块。在ML工作流中，我们的目标是创建一个模块化的工作流序列，该序列以邮件正文为输入，将其传递给我们新部署的ML技能，并返回该技能的分类结果和置信度。\n\
  \n首先，按如下步骤创建新工作流：\n\n1. 在`Email Classification`项目中，创建一个名为`Classify_Email`的新工作流文件。\n\
  2. 新工作流创建完成后，创建三个参数，如下面的截图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_285_0.png)\n\
  \n图9.14 – Classify_Email 参数\n\n每个参数的用途如下：\n\n- `in_EmailText`：用于输入邮件正文文本\n- `out_Classification`：用于输出“垃圾邮件”（Spam）或“正常邮件”（Ham）的分类文本\n\
  - `out_Confidence`：用于以double类型输出分类置信度百分比\n\n参数添加到工作流后，我们就可以开始向空白画布添加活动。\n\n3. 添加一个**日志消息**活动，将`in_EmailText`作为消息，`Info`作为日志级别。这样，当我们运行自动化时，它可以将邮件正文文本记录到控制台，这在进行后续调试时可能很有帮助。\n\
  4. 在**日志消息**活动之后，添加一个**ML技能**活动，参数如下：\n   - **连接模式：** 机器人（Robot）\n   - **ML技能：**\
  \ `Email_Spam_Classification`\n   - **项：** `in_EmailText`\n   - **JSON响应：** `json_response`\n\
  \n在**ML技能**活动中，`json_response`应该是一个新建的`String`类型变量。该变量负责保存`Email_Spam_Classification`\
  \ ML技能的**JavaScript对象表示法（JSON）**响应。\n\n由于`json_response`是键值对字符串，因此在查询JSON之前，我们需要通过反序列化将其转换为对象。\n\
  \n5. 将一个**反序列化JSON响应**活动拖入工作流，参数如下：\n   - **JSON字符串：** `json_response`\n   - **类型参数：**\
  \ `System.Collections.Generic.Dictionary<System.String, System.Object>`\n   - **JSON对象：**\
  \ `json_object`\n\n与`json_response`类似，`json_object`应该是一个新建的`System.Collections.Generic.Dictionary<System.String,\
  \ System.Object>`类型变量。这样，我们现在就可以用一组键来查询JSON响应。\n\n`Email_Spam_Classification`的JSON响应将返回一个预测结果和一个置信度，我们需要将它们分别赋给`out_Classification`和`out_Confidence`。\n\
  \n6. 将一个**赋值**活动拖入工作流，参数如下：\n   - **目标：** `out_Classification`\n   - **值：** `json_object(\"\
  prediction\").ToString`\n7. 再将另一个**赋值**活动拖入工作流，参数如下：\n   - **目标：** `out_Confidence`\n\
  \   - **值：** `Convert.ToDouble(json_object(\"confidence\"))`\n\n将最后一个**赋值**活动拖入工作流后，`Classify_Email`活动就基本完成了。为了便于将来调试，我们再添加一个**日志消息**活动，用于记录来自ML技能的分类结果和置信度。\n\
  \n8. 添加一个**日志消息**活动，在消息中包含`out_Classification`和`out_Confidence`，日志级别设为`Info`。\n\n\
  \n\n\n在添加了最终的日志消息后，Classify_Email 工作流已完成。它应如下所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_288_0.png)\n\
  \n图 9.15 – Classify_Email 工作流\n\n如果您想测试工作流，请将 in_EmailText 的默认值设置为一组随机文本，如以下屏幕截图所示，然后尝试运行工作流：\n\
  \n| 名称 | 方向 | 参数类型 | 默认值 |\n|---|---|---|---|\n| in_EmailText | In | String | \"\
  hello, world!\" |\n| out_Classification | Out | String | 默认值不支持 |\n| out_Confidence\
  \ | Out | Double | 默认值不支持 |\n| Create Argument |  |  |  |\n\n图 9.16 – 设置默认值\n\n\
  在运行工作流时，请注意 UiPath Studio 的 Output 面板以及我们添加的日志消息。它应如下所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_289_0.png)\n\
  \n图 9.17 – hello, world! 测试的输出\n\n至此，我们的 ML 工作流开发已完成。在本节中，我们创建了一个工作流，它接受一个 String\
  \ 类型的邮件正文作为输入，将该输入通过我们的 ML 技能传递，反序列化 JSON 响应，并输出技能的置信度和分类。在下一节中，我们将在 Main 工作流中将所有内容整合在一起之前，先处理项目所需的其他补充工作流。\n\
  \n# 构建补充工作流\n\n在将整个项目整合到 Main 工作流中之前，我们可以再构建一个补充工作流。该工作流的目的是接受一封邮件消息和邮件文件夹作为输入，并将该邮件消息移动到指定的邮件文件夹中。\n\
  \n创建此工作流单独存在、而不是在 **Main** 工作流中复制粘贴的原因是，复制粘贴的代码最好放在自己的工作流中，而不是多次粘贴到另一个工作流中。通过拥有一个用于移动邮件的单独工作流，我们可以在\
  \ **Main** 工作流中根据需要随时调用此补充工作流，将邮件移动到不同的文件夹中。\n\n开始时，按如下方式创建一个新的工作流：\n\n+   1. 在\
  \ `Email Classification` 项目中，创建一个名为 `Move_Email` 的新工作流文件。\n+   \n+   2. 新工作流创建后，如以下屏幕截图所示创建两个参数：\n\
  \n| 名称 | 方向 | 参数类型 | 默认值 |\n|---|---|---|---|\n| `in_MailMessage` | In | MailMessage\
  \ | *Enter a VB expression* |\n| `in_Folder` | In | String | *Enter a VB expression*\
  \ |\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_290_0.png)\n\n*图 9.18 – Move_Email\
  \ 参数*\n\n每个参数的用途如下：\n\n+   - `in_MailMessage`：输入我们当前邮件的邮件消息\n+   - `in_Folder`：输入我们目标文件夹的文件夹位置\n\
  \n将参数添加到工作流后，我们可以开始向空白画布添加活动。\n\n+   3. 添加一个 **Log Message** 活动，将 `in_Folder` 作为消息，`Info`\
  \ 作为日志级别。这将允许自动化在运行自动化时将目标文件夹记录到控制台——如果以后需要调试任何内容，这可能很有帮助。\n+   \n+   4. 将 **Move\
  \ Mail Message** 活动拖入工作流，并设置以下参数：\n\n+   - **MailFolder**：`in_Folder`\n+   - **MailMessage**：`in_MailMessage`\n\
  \n## 构建 Main 工作流\n\n每个自动化项目都始于 **Main** 工作流。**Main** 工作流的目的是启动项目，并在过程中调用其他工作流。\n\
  \n根据我们的未来状态设计，用例的第一步是从收件箱检索邮件——我们可以通过在 Outlook 中添加一个名为 `Email Classification` 的文件夹并让自动化从该文件夹获取邮件来重现此步骤。按如下方式操作：\n\
  \n+   1. 打开 **Data Input** 序列。\n+   2. 在 **Assign** 之后，将 **Get Outlook Mail Messages**\
  \ 活动拖入工作流，设置以下属性：\n+      - **MailFolder**：`Inbox/Email Classification`\n+     \
  \ - **MarkAsRead**\n+      - **OnlyUnreadMessages**\n+      - **Top**：`1`\n+   \
  \   - **Output**：`list_emails`\n+   3. 将 **If** 语句拖入工作流，将条件设置为 `List_emails.count\
  \ > 0`。\n+   4. 在 **If** 语句的 **Then** 序列中，将 **Assign** 活动拖入工作流。\n+   5. 在 **Assign**\
  \ 活动中，将 **NewTransaction** 设置为 `True`。\n\n在 **If** 语句内添加 **Assign** 活动后，我们的 **Data\
  \ Input** 序列应如下所示：\n\n# 图 9.20 – Data Input 序列\n\n回顾 Data Input 序列，自动化将获取 Outlook\
  \ 邮件消息，并将其结果输出到 list_emails 变量。如果 list_emails.count 大于 0，则表示 Email Classification\
  \ 文件夹中有邮件，自动化可以将 NewTransaction 设置为 True。\n\n您可以在以下屏幕截图中看到流程决策：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_294_0.png)\n\
  \n图 9.21 – Have input? 流程决策\n\n通过将 **NewTransaction** 设置为 True，**Main** 工作流中的 **Have\
  \ input?** 流程决策将返回 `True`，从而引导自动化进入 **Transaction Processing** 流程图。\n\n在 **Main**\
  \ 工作流中，让我们用一个名为 **Classify Email** 的序列替换 **Transaction Processing** 流程图。您的屏幕现在应如下所示：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_294_1.png)\n\n图 9.22 – Main 工作流\n\n将\
  \ **Transaction Processing** 部分从流程图更改为序列的原因是，邮件的分类非常顺序化，业务变化很少。\n\n让我们按如下方式构建该序列：\n\
  \n+   1. 双击 **Classify Email** 以打开序列。\n\n+   2. 将 **Invoke Workflow File** 活动拖入工作流，并设置以下参数：\n\
  \n+   - **Workflow file name:** `Classify_Email.xaml`\n\n**Invoke Workflow File**\
  \ 活动的目的是调用我们之前创建的 ML 工作流。在该活动中，我们需要将主文件中的参数导入到 `Classify_Email` 工作流。\n\n+   3. 点击\
  \ **Import Arguments**，如以下屏幕截图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_295_0.png)\n\
  \n图 9.23 – 导入参数前的 Invoke Workflow File\n\n点击 **Import Arguments** 后，将弹出一个窗口，展示我们添加到\
  \ `Classify_Email` 的参数。\n\n+   4. 设置以下参数：\n\n+   - `in_EmailText:list_emails(0).Body`\n\
  \n+   - `out_Classification:email_classification`\n\n+   - `out_Confidence:email_confidence`\n\
  \n前面参数显示在以下屏幕截图中：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_296_0.png)\n\n图 9.24\
  \ – 已添加的参数\n\n由于 list_emails 是来自 Get Outlook Mail Messages 活动的邮件消息列表，我们需要使用 (0)\
  \ 索引第 0 封邮件，然后使用 .body 传递邮件的正文。email_classification 和 email_confidence 是我们需要创建的两个新变量，用于保存\
  \ Classify_Email 的输出。\n\n设置好 Invoke Workflow File 活动后，Classify Email 序列的下一步是检查 ML\
  \ 技能输出的置信度。在这种情况下，任何低于 75% 的置信度我们都将移动到 Low Confidence 文件夹。\n\n5. 将 If 活动拖入工作流，条件如下：\n\
  \n+   - email_confidence > .75\n\n6. 在 If 活动的 Else 块中，将 Invoke Workflow File 活动拖入工作流，并设置以下参数：\n\
  \n+   - Workflow file name: Move_Email.xaml\n\n与 Classify_Email Invoke Workflow\
  \ File 活动一样，对于此 Move_Email 文件活动，我们希望将低置信度邮件移动到我们的 Email Classification\\Low Confidence\
  \ 文件夹中。\n\n7. 点击 Import Arguments 并设置以下参数：\n\n+   - in_MailMessage: list_emails(0)\n\
  +   - in_Folder: \"Inbox\\Email Classification\\Low Confidence\"\n\n\n\n\n添加 `Move_Email`\
  \ 工作流后，我们的 **Classify Email** 序列应如下所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_297_0.png)\n\
  \n*图 9.25 – Classify Email 序列*\n\n目前，我们的工作流可以对电子邮件进行分类、检查其置信度，并在 `email_confidence`\
  \ 小于 75% 时将邮件移动到 Low Confidence 文件夹。但是，我们仍然需要在 `email_confidence` 大于或等于 75% 时添加逻辑。\n\
  \n8. 在 If 活动的 Then 块中，将一个 Switch 活动拖入工作流，设置以下参数：\n- 表达式：`email_classification`\n\
  - 类型：`String`\n\n在 Switch 语句中，我们要添加两个 case，一个用于 Spam，一个用于 Ham。Spam 分类结果将被移动到 Spam\
  \ 文件夹，而 Ham 分类结果将被移动到 Invoices 文件夹。\n\n9. 单击“添加新 Case”，并将该 case 命名为 `spam`。\n\n\
  10. 在该 case 中，将一个 Invoke Workflow File 活动拖入工作流，参数如下：\n- 工作流文件名：`Move_Email.xaml`\n\
  \n11. 单击“导入参数”并设置以下参数：\n- `in_MailMessage`：`list_emails(0)`\n- `in_Folder`：`\"Inbox\\\
  Email Classification\\Spam\"`\n\n现在，你应该能看到创建补充 `Move_Email` 工作流的好处了。在 Ham case 中，我们执行相同步骤，将\
  \ Ham 邮件移动到 Invoices 文件夹。\n\n12. 单击“添加新 Case”，并将该 case 命名为 `ham`。\n\n13. 在该 case\
  \ 中，将一个 Invoke Workflow File 活动拖入工作流，参数如下：\n- 工作流文件名：`Move_Email.xaml`\n\n14. 单击“导入参数”并设置以下参数：\n\
  - `in_MailMessage`：`list_emails(0)`\n- `in_Folder`：`\"Inbox\\Email Classification\\\
  Invoices\"`\n\n通过将 Ham case 添加到 Switch 语句中，我们的 **Classify Email** 序列应与下图类似：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_299_0.png)\n\n图 9.26 – Classify Email 工作流\n\
  \n以上就完成了我们用例项目中 **Classify Email** 序列和自动化工作流的配置。在本节中，我们创建了 UiPath 项目，并构建了 ML 工作流和补充工作流。然后，我们在项目的\
  \ `Main.xaml` 文件中将这些补充工作流连接在一起。在下一节中，我们将测试开发成果，并添加额外功能以闭环反馈回路并重新训练我们的 ML 技能。\n\n\
  在示例 UiPath 项目中，有一个名为 **Create Test Emails** 的工作流，可用于生成电子邮件。**Create Test Emails**\
  \ 会读取一个**逗号分隔值（CSV）**文件，并为 CSV 文件中的每一行创建一封电子邮件。在运行之前，请按照以下方式设置该工作流的两个参数：\n- `in_DataFile`：设置为你的数据\
  \ CSV 文件所在的文件路径\n- `in_To`：设置为你的电子邮件地址，以便向其发送电子邮件\n\n这两个参数如下面的屏幕截图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_301_0.png)\n\
  \n*图 9.27 – 设置 Create Test Emails 参数*\n\n> **重要说明**\n>\n> 如果你没有 Outlook，可能需要将 **Send\
  \ Outlook Mail Message** 活动改为适用于你的电子邮件提供商的活动。\n\n你可以使用 48 封邮件的子集进行测试，也可以使用所有邮件逐一测试。如果你发现结果不符合预期，那么可能需要使用完整数据集重新运行训练和评估流水线。在下一节中，我们将研究如何通过创建重新训练工作流来提高性能，从而自动重新训练我们的\
  \ ML 技能。\n\n## 构建重新训练工作流\n\n为了随着时间推移提高 ML 技能的性能，我们可以闭环反馈回路——本质上是建立向 ML 技能提供反馈的能力，并在新数据到来时训练该技能。\n\
  \n为我们的工作流添加重新训练能力需要以下两个步骤：\n- 1. 构建一个可用于重新训练的完整流水线。\n- 2. 构建一个自动化工作流，将新数据上传到我们的完整流水线。\n\
  \n完成这两个步骤后，我们的自动化流程就能根据人工提供的反馈有效地重新训练自身。\n\n### 构建完整流水线\n\n在本章前面构建 ML 技能时，我们运行了训练和评估流水线，使\
  \ ML 技能为自动化做好准备。虽然之前我们只运行过这些流水线一次，但在闭环反馈模型中，我们需要持续重新运行这些流水线，以随着时间推移不断训练和评估我们的 ML\
  \ 包。\n\n因此，为了有效重新训练我们的 ML 包，我们需要安排一次完整流水线运行，该运行将同时使用训练数据集和评估数据集运行流水线。要创建完整流水线，请完成以下步骤：\n\
  - 1. 在 AI Center 中返回到我们的 `Email Classification` 项目。\n- 2. 在 **流水线** 页面，单击 **新建**\
  \ 创建新流水线。\n- 3. 单击 **新建** 创建新流水线，并选择以下属性：\n  - **流水线类型：**`Full run`\n  - **选择包：**`TextClassification`\n\
  \  - **选择包主版本：**`6`\n  - **选择包次版本：**`0`\n  - **选择输入数据集：**`Email Classification/Train`\n\
  \  - **选择评估数据集：**`Email Classification/Evaluation`\n  - **启用 GPU：**关闭此选项\n  - **计划：**\
  \ **每周重复**\n- 4. 在 **环境变量** 下方，添加以下环境变量：\n  - `input_column`：`text`\n  - `target_column`：`label`\n\
  \n此时你的屏幕应如下所示：\n\n### 新建流水线运行\n\n流水线类型\n完整流水线运行\n\n选择包*\nTextClassification\n\n\
  选择包主版本*\n6\n\n选择包次版本*\n0\n\n选择输入数据集\nEmail Classification/train/\n\n选择评估数据集*\nEmail\
  \ Classification/evaluation/\n\n输入参数\n+ 添加新项\n\n| 环境变量 | 值 |\n|---|---|\n| input_column\
  \ | text |\n| target_column | label |\n\n启用 GPU\n\n立即运行\n基于时间\n定期重复\n\n首次运行，12:00\
  \ AM\n\n图 9.28 – 创建训练流水线\n\n5. 单击“创建”以启动训练流水线。\n\n### 构建自动化工作流\n\n将 **首次运行** 参数设置为每\
  \ 7 天运行一次后，完整流水线将使用新数据集运行。在下一节中，我们将研究如何使用经过验证的数据更新数据集。\n\n为了闭环反馈，我们需要一种让人类验证自动化性能的方法。使用\
  \ Document Understanding 时，我们可以借助 Validation Station 重新训练分类器和提取器；但在本用例中，我们将使用电子邮件文件夹，供最终用户将分类错误的邮件移入其中。\n\
  \n借助 `Retrain-Not Spam` 和 `Retrain-Spam` 文件夹，最终用户可以将被错误分类的垃圾邮件移动到 `Not Spam` 文件夹，反之亦然。然后，自动化可以检查这些文件夹，将邮件添加到训练集，并随着时间推移重新训练我们的\
  \ ML 技能。\n\n第一步是构建我们的重新训练工作流。重新训练工作流的目标是：将 `Retrain-Not Spam` 和 `Retrain-Spam` 文件夹中的每封邮件添加到一个\
  \ CSV 文件中，将每封邮件移动到其目标电子邮件文件夹，然后将 CSV 文件上传到 AI Center，以添加到我们的训练数据集。请执行以下步骤：\n- 1.\
  \ 在 `Email Classification` 项目中，创建一个名为 `Retrain_Model` 的新工作流。\n- 2. 创建两个输入参数，如下所示：\n\
  \  - `in_listSpamEmails: List<MailMessage>`\n  - `in_listNotSpamEmails: List<MailMessage>`\n\
  \n这些参数如下面的屏幕截图所示：\n\n| 名称 | 方向 | 参数类型 | 默认值 |\n|---|---|---|---|\n| `in_listSpamEmails`\
  \ | In | `List<MailMessage>` | 输入 VB 表达式 |\n| `in_listNotSpamEmails` | In | `List<MailMessage>`\
  \ | 输入 VB 表达式 |\n\n图 9.29 – Retrain_Model 参数\n\n> **重要说明**\n>\n> 请确保在重新训练时选择包次版本\
  \ 0。\n\n3. 将一个 **Build Datatable** 活动拖入工作流，输出到新的 `retrain_DT` 变量，并构建如下两列：\n- `text:String`\n\
  - `label:String`\n\n你可以从下面的屏幕截图中看到该数据表的样子：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_305_0.png)\n\
  \n图 9.30 – retrain_DT 数据表\n\n4. 将一个 **For Each** 活动拖入工作流，循环遍历 `in_listSpamEmails`\
  \ 中的每封邮件。\n\n5. 在 **For Each** 活动内，将一个 **Add Data Row** 活动拖入工作流，设置以下参数：\n- ArrayRow：`{email.Body,\
  \ \"spam\"}`\n- DataTable：`retrain_DT`\n\n\n\n\n6. 将 **Move Outlook Mail Message**\
  \ 活动拖入工作流，设置以下参数：\n\n- MailMessage: email\n- MailFolder: \"Inbox\\Email Classification\\\
  Spam\"\n- 参数显示在以下截图中：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_306_0.png)\n\n\
  图 9.31 – For Each Spam Email\n\n通过 for 循环，将每封垃圾邮件添加到我们的数据表中，并将每封垃圾邮件移动到 Spam 文件夹中，我们可以为非垃圾邮件添加相同的步骤：\n\
  \n1. 将 **For Each** 活动拖入工作流，循环遍历 in_listNotSpamEmails 中的每封邮件。\n2. 在 **For Each**\
  \ 活动内，将 **Add Data Row** 活动拖入工作流，设置以下参数：\n   - ArrayRow: {email.Body, \"ham\"}\n\
  \   - DataTable: retrain_DT\n3. 将 **Move Outlook Mail Message** 活动拖入工作流，设置以下参数：\n\
  \   - MailMessage: email\n   - MailFolder: \"Inbox\\Email Classification\\Invoices\"\
  \n\n遍历完两个邮件文件夹后，将其添加到 retrain_DT 并移动到各自的目标文件夹中，我们现在可以专注于将 retrain_DT 写入 CSV 文件并将\
  \ CSV 文件上传到 AI Center 训练数据集：\n\n1. 将 **Write CSV** 活动拖入工作流，设置以下参数：\n   - FilePath:\
  \ \"retrain.csv\"\n   - DataTable: retrain_DT\n   - **Add Headers**\n2. 将 **Upload\
  \ File** 活动拖入工作流，设置以下参数：\n   - **Project**: Email Classification\n   - **Dataset**:\
  \ Email Classification\n   - **Path into dataset**: \"train/\"\n   - **File**: \"\
  retrain.csv\"\n\n该过程在以下截图中进行了说明：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_308_0.png)\n\
  \n图 9.32 – 将 retrain_DT 上传到我们的训练数据集\n\n完成 Retrain_Model.xaml 后，我们可以专注于将其与 Main.xaml\
  \ 连接起来，并从 Retrain-Spam 和 Retrain-NotSpam 文件夹中获取邮件：\n\n1. 打开 Main.xaml 并打开 **End\
  \ Process** 序列。\n2. 将 **Get Outlook Mail Messages** 活动拖入工作流，设置以下参数：\n   - **MailFolder**:\
  \ \"Inbox\\Email Classification\\Retrain-Spam\"\n   - **Top**: -1\n   - **Output**:\
  \ list_retrainSpamEmails\n3. 再将一个 **Get Outlook Mail Messages** 活动拖入工作流，设置以下参数：\n\
  \   - **MailFolder**: \"Inbox\\Email Classification\\Retrain-NotSpam\"\n   - **Top**:\
  \ -1\n   - **Output**: list_retrainNotSpamEmails\n   提取邮件后，我们现在可以将它们传递给我们新创建的 Retrain_Model\
  \ 工作流，但我们只有在有邮件时才需要运行此工作流。\n4. 将 **If** 活动拖入工作流，将条件设置为 (list_retrainSpamEmails.Count\
  \ > 0) OR (list_retrainNotSpamEmails.Count > 0)。\n5. 在 **If** 活动内，将 **Invoke Workflow\
  \ File** 活动拖入工作流，设置以下参数：\n   - **Workflow file name**: \"Retrain_Model.xaml\"\n\
  \   - **in_listSpamEmails**: list_retrainSpamEmails\n   - **in_listNotSpamEmails**:\
  \ list_retrainNotSpamEmails\n\n就这样！在图 9.33 中，我们可以看到我们的 End Process 序列应该是什么样子。在本节中，我们通过首先构建一个完整的管道来每\
  \ 7 天重新训练我们的 ML 包，然后构建一个自动化工作流来提取已验证的邮件并将验证添加到我们的训练管道，从而成功地为我们的自动化项目添加了重新训练功能。开发和测试部分完成后，在下一节中，我们将进入将自动化部署到\
  \ UiPath Assistant 的阶段。\n\n## 部署时以终端用户体验为出发点\n\n初始开发和测试用例完成后，让我们进入将自动化部署到生产环境。 在本节中，我们将致力于将自动化部署到\
  \ UiPath Assistant，以便它可以在有人值守的场景中运行。\n\n### 部署项目\n\n在生产环境中，我们不应直接从 UiPath Studio\
  \ 运行自动化，也不应期望我们的终端用户能够访问 UiPath Studio。 因此，我们必须将自动化部署到 UiPath Orchestrator，以便其他人可以从\
  \ UiPath Assistant 运行我们的自动化。\n\n> **重要说明**\n> 有关部署自动化的更多信息，请访问以下链接：\n> `https://docs.uipath.com/studio/docs/about-publishing-automation-projects`\n\
  \n对于此用例，我们将快速将自动化发布到 UiPath Assistant 中的个人工作区。 请按照以下步骤操作：\n\n1. 在 `Email Classification`\
  \ 项目中，单击 UiPath Studio **Design** 功能区中的 **Publish** 按钮。\n2. 检查 **Publish to** 字段是否设置为\
  \ **Orchestrator Personal Workspace Feed**，如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_312_0.png)\n\
  \n图 9.34 – 发布自动化\n\n3. 单击 **Publish**。\n\n发布后，您应该能够在 UiPath Assistant 中看到自动化。它应如下所示：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_313_0.png)\n\n图 9.35 – 项目已部署到 UiPath\
  \ Assistant\n\n单击 `Email.Classification` 右侧的 **Play** 按钮将安装自动化到您的机器上并开始执行。\n\n部署后，您可以自由地直接从\
  \ UiPath Assistant 运行自动化。 对代码的任何更改都可以在 UiPath Studio 中进行，然后按照刚才讨论的步骤重新发布。 在本节中，我们通过将\
  \ `Email Classification` 项目部署到 UiPath Assistant 完成了用例构建——干得好！\n\n## 总结\n\n在本章中，我们介绍了使用\
  \ *UiPath AI Center* 构建认知自动化用例。 在用例的构建过程中，我们学习了如何在 AI Center 中创建项目、加载训练和评估数据集、构建训练和评估管道，以及——最后——部署\
  \ ML 技能。 我们还学习了如何在 UiPath 项目中利用 ML 技能，并学习了如何通过 UiPath 的 **Upload File** 活动关闭反馈循环，从而将训练数据上传回\
  \ AI Center 的训练数据集。 有了这些基础，您现在可以继续构建自己的认知自动化。\n\n在下一章中，我们将采取另一种实践方法，通过共同构建使用 UiPath\
  \ 和 Druid 的三个用例中的最后一个用例。 我们将学习如何集成聊天机器人和 UiPath。\n"
- "## 10\n用例 3 –\n使用 Druid 的聊天机器人\n\n我们可以通过智能聊天机器人将对话式人工智能（AI）与 UiPath 自动化连接起来，以实现运营现代化并增强用户体验（UX）。\
  \ 通过聊天机器人，我们可以将智能通信工具集成到消息应用程序或聊天窗口中，为终端用户提供几乎即时的查询解决方案。 通过聊天机器人和 UiPath，我们可以在满足客户请求方面更进一步——我们不仅可以使用智能聊天机器人响应客户查询，还可以启动自动化流程以提供客户请求的端到端（E2E）履行。\n\
  \n在本章中，我们将共同构建一个可以与人类用户交互并启动 UiPath 自动化的聊天机器人。 在构建用例时，我们将遵循与前几章中概述的类似的开发生命周期。 我们将从了解自动化机会的当前状态开始，然后设计涉及自动化的用例的未来状态。\
  \ 一旦未来状态设计完成，我们将使用 Druid 构建聊天机器人并使用 UiPath Studio 构建自动化。\n\n在本章 *用例 3 – 使用 Druid\
  \ 的聊天机器人* 中，我们将涵盖以下主题：\n\n- 了解用例的当前状态\n- 创建未来状态设计\n- 使用 Druid 构建解决方案\n- 构建自动化解决方案\n\
  - 测试以确保稳定性和提高准确性\n- 生产注意事项\n\n完成后，我们将使用 Druid 构建了一个聊天机器人，并与 UiPath 自动化相连接。\n\n##\
  \ 技术要求\n\n本章的所有代码示例均可在 GitHub 上的以下链接找到：\n\n```\nhttps://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter10.\n\
  ```\n\n使用 UiPath 非常容易，并且使用社区版，我们可以免费开始。\n\n对于本节，您需要以下内容：\n\n- UiPath Enterprise\
  \ Cloud\n- UiPath Studio 2021.4+\n- Druid Oxygen v1.57.0+\n\n> **重要说明**\n> Druid\
  \ 的试用许可证可在 https://www.druidai.com/license-activation 获取。\n\n请查看以下视频以观看代码实战：https://bit.ly/3rt4C5x\n\
  \n\n\n\n\n## 了解用例的当前状态\n\n在我们着手设计和构建用例之前，我们需要了解该机会的当前状态。随着 *Company ABC* 招聘人数的增加，**信息技术（IT）**\
  \ 团队收到了大量服务请求。其中一些服务请求是简单的请求，可以通过很少的人工交互解决，例如以下内容：\n\n- 重置密码\n- 将同事的视频会议软件升级到专业版\n\
  \n随着 *Company ABC* 招聘人数的增加，支持代表的大量时间都花费在解决快速、简单的请求上。为了提高支持团队的容量，IT 团队被要求自动化这两个请求。\n\
  \n鉴于重置密码和升级应用程序许可证的任务很直接，我们可以看到这种自动化机会具有以下特征：\n\n- **具有重复性**：支持代表必须为每个服务请求执行相同的步骤序列。\n\
  - **耗时**：完成每个服务请求可能会占用支持代表执行更有意义任务的时间。\n- **基于规则且结构化**：重置用户的密码或升级其许可证类型是非常基于规则的。\n\
  \n自动化这些任务可以为不仅 IT 团队而且 *Company ABC* 内部的同事带来很大的影响。在下一节中，我们将重点创建用于实施此 IT 服务台机器人的未来状态设计。\n\
  \n## 创建未来状态设计\n\n有了我们对当前状态和 IT 团队痛点的全新认识，我们可以开始创建自动化的未来状态设计，如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_318_0.png)\n\
  \n图 10.1 – IT 服务台机器人的未来状态设计\n\n在用例的未来状态设计中，我们可以让人工启动我们的 Druid 聊天机器人（可以连接到 Slack、Microsoft\
  \ Teams 或通过网络），并提示聊天机器人协助进行密码重置或应用程序升级。一旦聊天机器人收到请求，它就可以使用特定任务（密码重置或应用程序升级）的输入参数触发\
  \ UiPath 自动化。\n\n在我们深入介绍未来状态设计之前，了解构建聊天机器人的一些基础知识很重要。所有对话流程都包含意图和对话，它们是聊天机器人的构建块。当我们表示人与聊天机器人之间的对话时，两者之间的对话将基于某种意图。如下所述：\n\
  \n- **意图：** 开始对话的目的（也称为话语）\n- **对话：** 对意图的响应对话\n- **流程：** 意图和对话的组合\n\n所有 Druid 聊天机器人都基于此方法，即用户通过聊天机器人发起对话（话语）。根据该话语，聊天机器人会最好地匹配一个意图，然后开始一个对话，其中可能包含自由文本、按钮或其他输入。\n\
  \n有了这种理解，我们可以设计聊天机器人的流程。默认情况下，聊天机器人应配置以下流程：\n\n- **欢迎流程**：用户启动聊天机器人时欢迎用户的流程\n- **回退流程**：聊天机器人不知道用户输入的答案或响应时回退的流程\n\
  \n除了利用欢迎和回退流程外，我们还需要为自动化添加一个额外的流程。此流程将称为 UiPath_Flow，我们将在其中为用户提供一组按钮供其选择。根据用户选择的按钮，Druid\
  \ 将触发一个自动化，使用参数重置其密码或升级其应用程序许可证。\n\n这就结束了我们的未来状态设计。在本节中，我们讨论了聊天机器人基础知识，创建了一个图来模拟我们的未来状态设计，并介绍了我们将在聊天机器人中构建的三个流程。在下一节中，我们将开始开发，通过构建\
  \ Druid 聊天机器人。\n\n## 使用 Druid 构建解决方案\n\n当我们着手构建我们定义的用例时，我们将从使用 Druid 构建我们的聊天机器人组件开始。对于此用例，我们将从\
  \ Druid 的 **Druid Starter** 模板开始，为我们的聊天机器人奠定基础。此模板附带系统实体的定义和每个聊天机器人都应利用的常见流程。\n\n\
  ## 创建项目\n\n要使用 Druid Starter 模板开始项目，请完成以下步骤：\n\n1. 在主菜单中，单击 Bot 下拉菜单并选择 AddNewBot。\n\
  2. 一旦 Create New Bot 窗口出现，输入 IT Help Desk Bot 作为机器人的名称，选择 English (United States)\
  \ 作为默认语言，然后单击 Save。流程如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_320_0.png)\n\
  \n图 10.2 – 创建新机器人\n\n现在机器人已创建，让我们导入 Druid Starter 模板以便开始。\n\n3. 在主菜单中，单击 Solution\
  \ 下拉菜单并选择 Import Solution。\n4. 一旦 Solution Library 页面出现，选择 Druid Starter 然后选择 Import\
  \ Solution。\n\n安装了 Druid Starter 模板后，我们就有了良好的基础来构建。让我们开始创建一些对话流程。\n\n## 编辑欢迎流程\n\
  \nDruid Starter 模板的第一个流程被称为欢迎流程。此流程的目的是在用户首次与聊天机器人交互时欢迎用户。如果您导航到项目的流程（单击 Solution\
  \ Contents 下的 Flows），您会注意到我们的欢迎流程，名为 first-welcome-flow，如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_321_0.png)\n\
  \n图 10.3 – 欢迎流程\n\n在 `first-welcome-flow` 中，让我们添加我们的第一个提示，要求用户输入其电子邮件地址，如下所示：\n\n\
  1. 在 `first-welcome-flow` 中，单击 **Edit** 按钮以编辑流程。\n2. 在父消息中单击 **AddChildStep**，如下图所示：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_321_1.png)\n\n图 10.4 – 添加子步骤\n\n3. 一旦\
  \ **newMessage** 出现，单击 **Edit** 按钮以编辑子步骤，设置以下属性：\n\n- **步骤名称：** `Ask for Email`\n\
  - **类型：** `Prompt`\n- **步骤消息：** `Please input your email address`\n- **输入映射：** `@email`\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_323_0.png)\n\n图 10.6 – first-welcome-flow\n\
  \n目前，这就结束了欢迎流程。当我们构建其他流程时，我们将回来进行一些小编辑。\n\n## 创建自动化流程\n\n欢迎流程完成后，让我们进入聊天机器人的主要流程：自动化流程。在此流程中，我们将向用户展示可供选择的选项，根据用户的输入启动\
  \ UiPath 自动化。让我们开始，如下所示：\n\n1. 单击 **Create New Flow** 创建新流程，设置以下属性：\n   - **名称：**\
  \ UiPath_Flow\n   - **描述：** Main Flow for IT Help Desk Bot\n   - **话语：** help\n\
  \   - **类别：** Automation Flow\n\n流程创建后，让我们向流程添加一个选择步骤，让用户能够在重置密码或升级许可证类型之间进行选择。\n\
  \n2. 单击 + **Add new step** 创建新步骤，在 **General** 选项卡下设置以下属性：\n\n- **步骤名称：** `Self-Help`\n\
  - **类型：** `Choice`\n- **步骤消息：** `What can I help you with?`\n- **输入映射：** `@self_help_choice`\n\
  \n3. 在 `Self-Help` 步骤的 **Metadata** 选项卡中，设置以下属性：\n\n- **BlockUserInput：** `True`\n\
  - **Is first step?:** `True`\n\n此外，在 **Metadata** 选项卡中，您会看到添加选择的选项（见 *Figure 10.7*）。这些选择将是用户与聊天机器人交互时可供选择的按钮选项。\n\
  \n4. 单击 +**AddChoice**，设置以下属性：\n\n- **标题：** `Password Reset`\n- **值：** `pass_reset`\n\
  \n5. 单击 + **AddChoice**，设置以下属性：\n\n- **标题：** `Upgrade AppY`\n- **值：** `upgrade_appY`\n\
  \n以下屏幕截图描述了添加选择的流程：\n\n\n\n\n\n# 元数据\n\nIsRepeater\n\nBlockUserInput\n\nException\
  \ handler\n\nIs WhatsApp template\n\nAdvancedEditing\n\nChoice[edit]\n\nPreview\n\
