  \n7. 填写以下数据点的字段（图 6.12）：\n\n- **发票编号**（文本）\n- **订单编号**（文本）\n- **发票日期**（日期）\n- **到期日期**（日期）\n\
  - **应付总额**（数字）\n- **发件人**地址（文本）\n- **收件人**地址（文本）\n- 服务列表\n- **小计**（数字）\n- **税**（数字）\n\
  - **总计**（数字）\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_143_0.png)\n\n| 发票编号 |\
  \ INV-3337 |\n|---|---|\n| 订单编号 | 12345 |\n| 发票日期 | 2016 年 1 月 25 日 |\n| 到期日期 |\
