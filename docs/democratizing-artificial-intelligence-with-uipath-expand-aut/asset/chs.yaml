  Yes\"`\n\n18. Drag a connecting arrow from the `More Help` step to the `Self-Help`\
  \ step, as illustrated in the following screenshot:\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_331_0.png)\n\
  \n*Figure 10.14 – Completed UiPath_Flow process*\n\nWith the automation flow complete,\
  \ we have one last step before we can move on to building the UiPath automation.\
  \ We need to connect the Welcome flow with the UiPath flow.\n\n19. Navigate back\
  \ to `first-welcome-flow`.\n\n20. Edit the `Confirm email` step, setting the following\
  \ attributes:\n\n+ - **Subflow:** `UiPath_Flow`\n\nAnd that's it! We have successfully\
  \ created a chatbot flow with Druid that connects to UiPath. In subsequent sections,\
  \ we will build the UiPath automation component of this use case, and then test\
  \ out the functionality.\n\n# Building an automation solution\n\nWith our chatbot\
  \ built, we can shift our focus to creating automation workflows for the use case.\
  \ Approaching this use case, we will build our project in a couple of steps, as\
  \ follows:\n\n+ 1. Creating a project\n+ 2. Building `Reset_Password` and `Upgrade_App`\
  \ workflows\n+ 3. Building the **Main** workflow\n\nAfter completing these steps,\
  \ we will have the foundation of our project complete and ready for testing.\n\n\
  # Creating a project\n\nFor this project, we'll create a new blank project in Studio.\
  \ To start a project, complete the following steps:\n\n+ 1. Navigate to the **Start**\
  \ tab of UiPath Studio.\n+ 2. Choose **Process**.\n+ 3. Name your project `IT_Helpdesk_Chatbot`,\
  \ and provide a folder location to save the project to.\n+ 4. Click **Create** to\
  \ create a project and to get started.\n\nThat concludes creating a project. We'll\
  \ revert to the **Main** workflow in a later section where we build out the workflow,\
  \ but for now, we'll transition into building supplemental workflows.\n\n# Building\
  \ Reset_Password and Upgrade_App workflows\n\nWith an automation project created,\
  \ we can focus on creating some of the supplemental workflows that'll become building\
  \ blocks of our **Main** workflow. Because we don't have actual accounts to reset\
  \ or an application license to upgrade, our objective is to create modular workflow\
  \ sequences that can simulate password resets or application license upgrades.\n\
  \nTo start, let's create a `Reset_Password` workflow, as follows:\n\n+ 1. In the\
  \ `IT_Helpdesk_Chatbot` project, create a new workflow file called `Reset_Password`.\n\
  + 2. Once the new workflow is created, create two arguments, as shown in the following\
  \ screenshot:\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_333_0.png)\n\nFigure 10.15\
  \ – Reset_Password arguments\n\nThe purpose of each argument is this:\n\n+ - `in_Email`:\
  \ To input an email address from the chatbot\n+ - `out_SRNumber`: A random SRN that\
  \ we will output in the chatbot\n\nOnce the arguments are added to the workflow,\
  \ we can start adding activities to the blank canvas.\n\n+ 3. Add a **Message Box**\
  \ activity, with `\"Resetting Password for\"+in_Email` as the message and `Info`\
  \ as the log level. This will output a message box, simulating the steps that automation\
  \ could take if we were connected to a system that could reset passwords.\n+ \n\
  + 4. After the **Message Box** activity, add an **Assign** activity with the following\
  \ parameters:\n - **To:** `out_SRNumber`\n - **From:** `\"SR\"+Right(Now.Millisecond.ToString,2).ToString`\n\
  \nWith the **Assign** activity added and using **Right** to generate an almost random\
  \ number, we have a workflow that looks like this:\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_333_1.png)\n\
  \nFigure 10.16 – Reset_Password workflow\n\nThat concludes the Reset_Password activity.\
  \ Let's now focus on the Upgrade_App activity.\n\n+ 5. In the IT_Helpdesk_Chatbot\
  \ project, create a new workflow file called Upgrade_App.\n\n+ 6. Once this new\
  \ workflow is created, create two arguments, as shown in the following screenshot:\n\
  \n| Name | Direction | Argument type | Default value |\n| in_Email | In | String\
  \ | Enter a VB expression |\n| out_SRNumber | Out | String | Default value not supported\
  \ |\n| Create Argument |  |  |  |\n\nFigure 10.17 – Reset_Password arguments\n\n\
  The purpose of each argument is this:\n\n+ - in_Email: To input an email address\
  \ from the chatbot\n\n+ - out_SRNumber: A random SRN we will output in the chatbot\n\
