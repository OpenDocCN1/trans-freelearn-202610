  \ Understanding 通过文档理解活动实现用例自动化。下图展示了 UiPath Document Understanding 框架：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_68_0.png)\n\
  \n图 3.13 – UiPath Document Understanding\n\nUiPath Document Understanding 框架包括五个组件，如下所示：\n\
  \n1. **加载分类法**：第一步是定义要提取的文档类型和字段，以便在分类法管理器中创建专用的分类法结构。\n   - **用例**：从差旅和娱乐收据中提取信息，用于费用报销。\n\
  \   - **文档类型**：收据\n   - **要提取的字段**：交易日期、供应商、总金额、税额\n\n2. **数字化**：第二步是将文件转换为机器可读的内容。此步骤需要选择**光学字符识别（OCR）**引擎来数字化内容。UiPath\
  \ Document Understanding 内置了与最流行的 OCR 引擎的集成。这些 OCR 引擎包括 UiPath Document OCR、OmniPage\
  \ OCR、Google Cloud Vision OCR、Microsoft Azure Computer Vision OCR、Microsoft OCR、Tesseract\
  \ OCR 和 ABBYY Document OCR。\n\n3. **分类与验证**：第三步是识别机器人正在处理的文档类型。此步骤利用 AI/ML。此步骤包含三个子步骤：\n\
  \   - **文档分类**：此子步骤自动确定相关的文档类型。有四个开箱即用的分类器：基于关键字的分类器、智能关键字分类器、FlexiCapture 分类器和机器学习分类器。你也可以创建自己的分类器来实现自定义算法。\n\
  \   - **文档分类验证**：此子步骤允许使用**分类站**进行人工验证。使用分类站有两种方式：作为有人值守活动或作为 Action Center 任务。此子步骤是可选的，但如果你处理的是单个文件中的多种文档类型，或者需要\
  \ 100% 的准确率，则强烈建议使用。\n   - **文档分类训练**：此子步骤将人工验证的信息传回分类器，以改进其未来的预测。此子步骤为能够从人工反馈中学习的分类器形成了一个闭合的反馈回路。可用的分类器训练器包括基于关键字的分类器训练器、智能关键字分类器训练器和机器学习分类器训练器。\n\
  \n4. **提取与验证**：此步骤从文档中识别要提取的特定信息。此步骤利用 AI/ML。此步骤包含三个子步骤：\n   - **数据提取**：此子步骤根据分类法中的定义，从每种文档类型中自动提取相关信息。此步骤确保以正确的顺序、针对相关的字段列表以及正在处理的文件的指定页面范围调用配置的提取程序。有五个开箱即用的提取程序：基于正则表达式的提取程序、表单提取程序、智能表单提取程序、FlexiCapture\
  \ 提取程序和机器学习提取程序。你也可以创建自己的提取程序来实现自定义算法。\n\n## UiPath AI Center 的优势\n\n下图展示了在 UiPath\
  \ 平台中使用 UiPath AI Center 的优势：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_71_0.png)\n\
  \n来源：UiPath 网站\n\n图 3.14 – UiPath AI Center：优势\n\nUiPath AI Center 提供六大关键优势：\n\n\
  - 来自 UiPath 及合作伙伴的 OOTB 模型：\n\n**UiPath AI Center** 拥有来自 UiPath 的超过 25 个开箱即用模型，以及来自\
  \ UiPath 广泛合作伙伴网络的更多模型。这些开箱即用模型涵盖 UiPath Document Understanding、语言分析与理解、图像分析和表格数据。没有深厚\
  \ ML 背景的 RPA 开发人员也可以开始使用这些开箱即用模型，将 AI 融入其用例。\n\n- *自带模型：*\n**UiPath AI Center**\
  \ 支持用户将自己的 ML 模型带入 UiPath AI Center，以部署、持续训练并改进这些模型。此功能使 RPA 开发人员能够与公司内部的数据科学家协作，使用数据科学家融入其\
  \ RPA 工作流的模型。\n\n- *人工验证：*\n**UiPath AI Center** 允许人与机器并肩工作，验证数据并将其发回以进行模型再训练。为了最大化自动化潜力，有助于人机协作的功能必不可少。\n\
  \n- *持续改进与再训练：*\n**UiPath AI Center** 提供对模型使用、数据、模型性能、用户操作和流水线的端到端可见性。它还保持对版本的控制，并通过人在环和自动再训练实现无压力再训练。\n\
  \n- *多种部署选项：*\n**UiPath AI Center** 支持本地部署和云部署。这些选项满足所有行业的需求。\n\n- *直观且安全的数据管理：*\n\
  **UiPath AI Center** 拥有直观且安全的数据管理功能。创建和访问模型数据非常简单。它还允许用户上传自己的数据。此外，它使客户能够对其训练模型所用数据进行快照，从而获得完整的审计追踪，了解哪个模型做出了哪项预测，以及哪个模型使用了哪些数据进行训练。\n\
  \n## UiPath AI Center 技术概念\n\n让我们来了解 **UiPath AI Center** 的技术概念。你将全面了解每个概念及其相互关系。下图展示了\
  \ UiPath AI Center 的技术概念：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_73_0.png)\n\
  \n图 3.15 – UiPath AI Center：核心技术概念\n\nUiPath AI Center 使用五个技术概念。你需要熟悉这些概念及其相互关系。它们在\
  \ UiPath AI Center 产品中贯穿使用。这五个技术概念如下：\n\n- **项目：** 项目是资源的集合——数据集、ML 包、流水线 ML 技能和日志。你使用这些资源来构建特定的\
  \ ML 解决方案。最好为每个自动化用例创建一个单独的项目。在 **UiPath AI Center** 中，仪表板提供了所有项目的概览，包括活动流水线和已部署包的信息。\n\
  - **数据集：** 数据集是一个用于存储数据的文件夹。你可以创建新的数据文件或上传来自其他应用程序的文件。数据集是本地资源，仅在项目内可用。\n- **ML\
  \ 包：** ML 包是一个包含训练 ML 模型所需的代码和元数据的文件夹。一个 ML 包可以有多个版本，并带有相关的变更日志。在 UiPath AI Center\
  \ 中，有超过 25 个开箱即用的 ML 包可供使用。\n\n\n\n\n- **流水线**：流水线是准备数据、调整模型和转换预测所需的线性步骤序列。流水线指定了这些功能及其执行顺序，还指定了运行流水线所需的输入以及从流水线获得的输出。流水线完成后，一次流水线运行会产生相关的输出和日志。流水线有三种类型：\n\
  \  - **训练流水线**：训练流水线用于训练新的机器学习模型，以生成新的包版本。\n  - **评估流水线**：评估流水线用于评估已训练的机器学习模型。\n\
  \  - **完整流水线**：完整流水线用于训练新的机器学习模型并评估此新模型的性能。此外，在训练之前会运行预处理步骤，从而允许数据操作和训练已训练的机器学习模型。\n\
  - **ML 技能**：ML 技能是机器学习包的一种面向消费者的实时部署。一旦部署，它就可以在 RPA 工作流中使用。在 UiPath Studio 中，您只需将任意\
  \ ML 技能活动拖放到 RPA 工作流中即可。\n\n如您在本节中所见，借助 UiPath AI Center，您可以将 AI 和机器学习模型集成到 RPA\
  \ 自动化中，从而解决一系列新的用例。接下来，让我们了解 UiPath 平台如何通过 UiPath 聊天机器人（Druid）实现智能聊天机器人功能。\n\n##\
