  \n文档理解框架为我们提供了一组易于遵循的组件，用于构建文档理解用例。我们了解了框架的各种组件以及如何使用每个组件。现在让我们继续学习UiPath的AI Center。\n\
  \n## UiPath AI Center入门\n\nUiPath AI Center释放了将机器学习模型与RPA结合使用的能力。借助AI Center，我们能够部署、管理和重新训练开箱即用或自定义的机器学习模型。在本节中，我们将探讨AI\
  \ Center的核心概念，并深入了解AI Center活动包中的活动。\n\n\n\n\n\n## 使用 AI Center\n\n在本节中，我们将浏览 AI\
  \ Center 的关键概念。通过熟悉这些概念，我们将积累利用 AI Center 的经验，这对于构建具有机器学习能力的自动化至关重要。\n\n在创建自动化项目时，我们通常希望遵循两条通往生产环境的路径：\n\
  \n- **使用预训练模型：** 开发者应遵循以下流程：\n  1. 创建项目\n  2. 利用 ML 包\n  3. 将其部署为 ML 技能\n  4. 将\
  \ ML 模型拖放到 RPA 中\n  \n- **使用可重训模型：** 开发者应遵循以下流程：\n  1. 创建项目\n  2. 上传数据集\n  3. 利用\
  \ ML 包\n  4. 部署训练管道以训练模型\n  5. 将其部署为 ML 技能\n  6. 将 ML 模型拖放到 RPA 中\n  7. 将 RPA 连接回\
  \ ML 模型，提供持续反馈\n\n在本节中，我们将研究 AI Center 的关键概念，以便遵循这两条通往生产环境的路径。\n\n## 介绍项目\n\n每个\
  \ AI Center 用例都始于在 AI Center 中创建项目。项目是资源集合（ML 包、数据集和管道），您将在构建认知自动化用例时利用这些资源。\n\n\
  ## 创建项目\n\n让我们一起构建一个简单的文本分类项目，使用 AI Center，从在 AI Center 中创建项目开始我们的练习：\n\n- 1. 导航到您的\
  \ UiPath Cloud，并点击 AI Center 开始：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_175_0.png)\n\
  \n图 6.42 – UiPath Cloud 中的 AI Center 主页\n\n- 2. 进入 AI Center 后，点击 Create Project\
  \ 并提供描述性的项目名称和描述。\n\n提供名称和描述后，您将被导航到项目仪表板。在此项目仪表板中，您会注意到我们的数据集、包、管道和技能标签，我们将在后续章节中介绍。让我们继续进入\
  \ AI Center 中的数据集。\n\n## 介绍数据集\n\n现在我们已经创建了项目，让我们查看第一个标签 – 数据集。按定义，数据集仅仅是一组数据。在\
  \ AI Center 中也是如此，其中数据集是 AI Center 项目所利用的文件和文件夹集合。在数据集内，我们可以上传任何必要的文件和文件夹集，以便我们的\
  \ ML 模型访问数据。\n\n## 查看开箱即用的包\n\n如前几节所述，AI Center 为您提供了许多 UiPath 和开源 ML 包，让您能够快速开始认知自动化。以下开箱即用的包可用：\n\
