  \ with the following parameters:\n\n+ - To: out_SRNumber\n\n+ - From: \"SR\"+Right\
  \ (Now.Millisecond.ToString,2).ToString\n\nWith the Assign activity added and using\
  \ Right to generate an almost random number, we have a workflow that looks like\
  \ this:\n\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_335_0.png)\n\n图 10.18 – Upgrade_App\
  \ 工作流\n\n至此，我们完成了 Reset_Password 和 Upgrade_App 工作流的开发。在本节中，我们创建了接受字符串邮件正文作为输入的工作流，在消息框活动中显示邮件，生成随机\
  \ SRN，并输出结果。在下一节中，我们将把所有内容整合到 Main 工作流中。\n\n## 构建主工作流\n\n每个自动化项目都从 Main 工作流开始。Main\
  \ 工作流的目的是启动项目，并在过程中调用其他工作流。在此 Main 工作流中，我们将使用 switch 语句在聊天机器人传递的任务之间进行切换。操作步骤如下：\n\
  \n- 1. 打开 Main.xaml，并创建三个参数，如下图所示：\n\n| 名称 | 方向 | 参数类型 | 默认值 |\n|---|---|---|---|\n\
  | in_Task | 输入 | 字符串 | 输入 VB 表达式 |\n| in_Email | 输入 | 字符串 | 输入 VB 表达式 |\n| out_SRNumber\
  \ | 输出 | 字符串 | 不支持默认值 |\n| 创建参数 |  |  |  |\n| 变量 | 参数 | 导入 |  |\n\n图 10.19 – Main\
  \ 参数\n\n每个参数的用途如下：\n\n- - `in_Task`：用于从聊天机器人输入任务类型\n- - `in_Email`：用于从聊天机器人输入电子邮件地址\n\
  - - `out_SRNumber`：我们将在聊天机器人中输出的随机 SRN\n\n- 2. 添加一个 **Log Message** 活动，将 `in_Task`\
  \ 作为消息，`Info` 作为日志级别。\n- 3. 添加一个 **Switch** 活动，将 `in_Task` 作为表达式。\n- 4. 创建一个名为 `Upgrade_App`\
  \ 的分支，使用 `Invoke` 工作流调用我们刚刚创建的 `Upgrade_App` 工作流。\n- 5. 创建另一个名为 `Password_Reset`\
  \ 的分支，使用 `Invoke` 工作流调用我们刚刚创建的 `Password_Reset` 工作流。\n\n过程如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_336_0.png)\n\
  \n图 10.20 – Main.xaml 工作流\n\n至此，我们完成了示例项目自动化工作流的配置。在本节中，我们创建了 UiPath 项目，并构建了辅助工作流。然后，我们在项目的\
  \ Main.xaml 文件中将这些辅助工作流连接在一起。在下一节中，我们将测试已开发的内容。\n\n## 测试以确保稳定性并提高准确性\n\n随着聊天机器人和自动化的开发完成，我们可以继续对这两个工作流进行联合测试。在部署前测试任何自动化工作流至关重要，以确保自动化按预期工作。在本节中，我们将同时发布\
  \ UiPath 自动化和 Druid 聊天机器人，以便测试两者之间的功能。\n\n## 发布 Druid 聊天机器人\n\n为了能够测试我们的 Druid 聊天机器人，并让它可供用户聊天，我们需要发布该机器人。发布机器人会自动在\
  \ DRUID 环境中配置所有必需资源。机器人只有在成功发布后才能正常运行。\n\n发布聊天机器人所需步骤如下：\n\n- 1. 单击 **IT Help Desk\
  \ Bot** 右侧的 **Settings** 图标，如下图所示：\n- 2. 进入 **Edit** 菜单后，导航到 **Details** 选项卡。\n\
  - 3. 单击 **Publish**。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_337_0.png)\n\n\
  单击 **Publish** 后，您应该会看到一条确认请求的通知。发布可能需要几分钟才能完成，但完成后，您可以单击页面上的绿色聊天按钮，以匿名用户身份测试聊天机器人。您的聊天机器人应与此类似：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_338_0.png)\n\n图 10.22 – 运行中的聊天机器人\n\n\
  请随时测试。在下一节中，我们将发布自动化，以便 Druid 聊天机器人能够触发它。\n\n## 发布 UiPath 自动化\n\n在前面的章节中，我们通常将发布自动化留到测试之后完成。然而，在本案例中，我们需要发布自动化，以便\
  \ Druid 聊天机器人能够触发自动化运行。\n\n> **重要提示**\n> 有关部署自动化的更多信息，请参阅以下链接：https://docs.uipath.com/studio/docs/about-publishing-automation-projects。\n\
  \n对于本案例，我们将在 **UiPath Assistant** 中快速将自动化发布到我们自己的个人工作区，操作如下：\n\n- 1. 在 `IT_Helpdesk_Chatbot`\
  \ 项目中，单击 UiPath Studio 的 **Design** 功能区中的 **Publish** 按钮。\n- 2. 检查 **Publish to**\
  \ 字段是否设置为 `Orchestrator Personal Workspace Feed`，如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_339_0.png)\n\
  \n图 10.23 – 发布自动化\n\n- 3. 单击 **Publish**。\n\n发布完成后，您应该能够在 **UiPath Assistant** 中看到该自动化。单击\
  \ `IT_Helpdesk_Chatbot` 左侧的 **Play** 按钮将在您的计算机上安装自动化并开始执行。让我们进入下一节，一起测试聊天机器人和自动化！\n\
  \n## 测试用例\n\n聊天机器人和自动化都已发布，我们终于可以开始测试自动化了！要测试自动化，请返回 DruID 并与您的聊天机器人对话。当您单击重置密码或升级应用程序许可证的选项之一时，您会注意到\
  \ DruID 会发送通知，说明自动化已启动且请求已成功处理，如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_340_0.png)\n\
  \n图 10.24 – 从 Druid 启动 UiPath\n\n因为我们构建的是有人值守自动化，Druid 通过 UiPath 的 RobotJS 连接器与\
  \ UiPath 通信。UiPath 的 RobotJS 允许开发者将本地有人值守机器人上下文嵌入到聊天机器人等应用程序中。当您首次从 Druid 运行自动化时，浏览器可能会提示您是否要打开\
  \ **UiPath Assistant**，一旦接受，您可能会注意到 **UiPath Assistant** 弹出请求，如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_341_0.png)\n\
  \n图 10.25 – RobotJS 提示\n\n单击 **Allow** 后，自动化将启动，您应该会看到 SRN 返回给聊天机器人。请继续结合各种请求进行测试。干得好！\n\
  \n**重要提示**\n如果您想查看实际案例的视频，请访问以下链接：https://bit.ly/3DKdXul\n\n## 生产环境注意事项\n\n由于我们在上一节中部署了自动化和聊天机器人，我们已经准备好将自动化部署到生产环境中。然而，即使我们的用例已经完成，如果您计划借助聊天机器人构建另一个用例，仍有一些注意事项需要考虑。\n\
  \n第一个注意事项是自动化组件是否可以成为无人值守机器人。在本用例中，我们使用了有人值守机器人，但大多数聊天机器人在执行 UiPath 自动化时应该使用无人值守机器人。\n\
  \n## 用例 3 -- 使用 DruID 的聊天机器人\n\n通过利用 UiPath Marketplace 上提供的 **Druid Integration\
  \ Framework**（https://marketplace.uipath.com/listings/druid-integration-framework），您可以让\
  \ Druid 通过向 UiPath 队列项添加事务项来触发自动化，如下图所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_342_0.png)\n\
  \n图 10.26 – Druid 集成框架\n\n添加队列项将触发 UiPath 无人值守自动化启动，完成该过程并将任何相关信息发送回 Druid 聊天机器人。对于未来的项目，请考虑将\
  \ **Druid Integration Framework** 与无人值守自动化结合使用，以快速构建无人值守自动化项目。\n\n## 总结\n\n在本章中，我们介绍了使用\
  \ *Druid* 构建聊天机器人用例的过程。在构建用例时，我们学习了如何在 Druid 中创建项目、导入模板聊天机器人、构建聊天机器人流程，以及最终部署聊天机器人。我们还学习了如何利用聊天机器人与\
  \ UiPath 的连接。有了这些基础，您现在可以开始构建自己的认知自动化。\n\n在下一章中，我们将探讨 *UiPath AI Center* 的一些高级主题。\n\
