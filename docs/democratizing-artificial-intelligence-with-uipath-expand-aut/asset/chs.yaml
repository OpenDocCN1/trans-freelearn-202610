  \ 平台提供了内置连接器。最后，UiPath 已将 Druid 提供的无代码、AI 驱动的聊天机器人原生集成到 UiPath 平台中。由于 Druid 聊天机器人是\
  \ UiPath 平台的一部分，让我们深入了解一下。\n\n## UiPath 的 Druid 聊天机器人的优势\n\n下图展示了在 UiPath 平台中使用\
