  \ Orchestrator 中的个人工作区\n\n- 2. 单击“资产”以导航到资产页面（图 8.14）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_224_0.png)\n\
  \n图 8.14 – 导航到资产页面\n\n- 3. 通过单击“添加资产”按钮逐个添加每个资产；设置应如图 8.15 所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_225_0.png)\n\
  \n图 8.15 – 资产配置\n\n> **重要提示**\n> \n> 查找文档理解 API 密钥的详细信息可在 `https://docs.uipath.com/document-understanding/docs/api-key`\
  \ 找到。\n\n最后，在设置了项目配置和定义了资产之后，在进入构建用例阶段之前，我们需要定义的最后一项设置是设置主文件。如果你查看新创建项目的文件，你会注意到两个\
  \ `.xaml` 文件：\n\n- `Main-ActionCenter.xaml`\n- `Main-Attended.xaml`\n\n有两个主文件的原因在于，它们在无人值守和有人值守执行中各有细微差别。`Main-ActionCenter.xaml`\
  \ 文件包含 Action Center 活动，有助于无人值守场景下的验证。在有人值守执行中，这些活动并非必要，因为我们无需通过 Action Center 即可向用户显示验证站。\n\
  \n由于我们要构建的是有人值守用例，我们需要确保将 Main-Attended.xaml 设为主文件。每个 UiPath 项目都需要定义一个主文件，通常称为 Main.xaml，但在这种情况下，我们需要按照以下步骤将\
  \ Main-Attended.xaml 设为主文件：\n\n- 1. 在 UiPath Studio 的项目窗格下方，右键单击 **Main-Attended.xaml**。\n\
  - 2. 单击 **设为主文件** 以将该文件设为项目的主文件（*图 8.16*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_226_0.png)\n\
  \n图 8.16 – 设置项目的主文件\n\n在 *文档理解流程模板* 的必要设置完成后，我们现在可以继续构建用例，从 *文档理解框架* 的第一部分开始，即**分类法**。\n\
  \n\n\n\n\n## 创建分类法\n\n作为 *Document Understanding 框架* 的第一步，我们需要创建一个分类法来对文档进行分类，并构建我们希望从收据中提取的相关信息的架构。如\
  \ *第 6 章《了解你的工具》* 中所述，分类法是一种分类系统，而在 Document Understanding 中，分类法是对 **文档类型** 的分类。\n\
  \n根据我们对流程的当前理解，我们将以下内容定义为此流程所必需的：\n\n- 供应商名称\n- 收据日期\n- 税额\n- 总金额\n\n因此，在构建分类法的过程中，我们必须包含这些字段。*Document\
  \ Understanding 流程模板* 的一个功能是为常见文档（如收据）提供预建分类法。让我们回顾一下开箱即用的分类法，并确定它是否适合我们的用例：\n\n\
  1. 在 UiPath Studio 的设计功能区中打开 **Taxonomy Manager**（*图 8.17*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_227_0.png)\n\
  \n图 8.17 – 设计功能区中的 UiPath Taxonomy Manager\n\n使用 Taxonomy Manager，请注意已加载的现有文档类型\
  \ – **Documents、Semi-Structured Documents 和 Structured Documents**。让我们回顾一下半结构化文档。\n\
  \n2. 点击 Semi-Structured Documents > Financial > Receipt（图 8.18）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_228_0.png)\n\
  \n图 8.18 – 预建的 Receipt 文档类型\n\n如果我们查看预建 **Receipt** 文档类型的字段，可以看到这些字段与我们当前状态的理解相匹配（图\
  \ 8.19）：\n\n| **Taxonomy Design** |  |\n| --- | --- |\n| **Fields from Current State\
  \ understanding** | **Fields from prebuilt Document Type** |\n| Vendor Name | Receipt\
  \ Name |\n| Receipt Date | Receipt Date |\n| Tax Amount | Tax Amount |\n| Total\
  \ Amount | Total Value |\n\n图 8.19 – Taxonomy Design\n\n将我们当前状态理解中的字段与预建文档类型的字段进行映射可确保我们完全不需要编辑分类法。如果我们想要捕获的额外字段，我们可以轻松地将字段添加到\
  \ **Receipt** 文档类型或创建我们自己的文档类型。然而，在本例中，由于我们有映射，我们可以利用预建文档类型并继续进行 Document Understanding\
  \ 框架的下一部分，**digitization**。\n\n## 设置数字化器\n\n*Document Understanding 框架* 的下一步是数字化。数字化是将输入数据扫描为机器可读文本的过程。一旦数据被数字化，我们就可以对数据进行分类并提取相关数据字段，以创建用于自动化的可执行步骤。\n\
  \n设置数字化的步骤大部分由 *Document Understanding Process* 模板处理。在项目中，打开 `20_Digitize.xaml`\
  \ 文件以查看预建的数字化工作流，如图 8.20 所示：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_230_0.png)\n\
  \n图 8.20 – `20_Digitize.xaml` 工作流\n\n在预建工作流中，我们有机会在数字化文档之前添加任何预处理（例如添加灰度、调整大小或旋转）。预建工作流然后使用\
  \ **UiPath Document OCR** 作为 OCR 引擎来数字化文档。\n\n如果我们想使用不同的 OCR，我们可以简单地用任何可用的 OCR 引擎替换\
  \ UiPath Document OCR。对于此用例，我们将使用 UiPath Document OCR 来为我们数字化收据。由于此原因，我们不需要为数字化添加任何额外活动，因为模板为我们完成了繁重的工作。\n\
  \n数字化器配置完成后，我们现在可以进入 *Document Understanding 框架* 的下一部分，即 **classification**。\n\n\
  ## 设置分类器\n\n一旦数字化器配置了我们选择的 OCR 引擎，我们就可以进入 *Document Understanding Framework* 的下一步，分类。对于此用例，我们只有一个文档类型（收据），因此分类似乎是不必要的，但让我们设置\
  \ UiPath Machine Learning Classifier 以展示它如何能与 *Document Understanding Process template*\
  \ 快速设置。\n\n设置分类时，我们必须同时配置分类器本身和用于重新训练分类器的训练器。幸运的是，与数字化一样，分类的步骤大部分由 Document Understanding\
  \ Process 模板处理。为了回顾模板的分类工作流，打开 `30_Classify.xaml` 文件以查看预建的分类工作流（图 8.21）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_232_0.png)\n\
  \n图 8.21 – `30_Classify.xaml` 工作流\n\n在预建工作流中，我们有机会添加特定用例所需的分类器。默认情况下，Document Understanding\
  \ Process 模板将包含 UiPath 的 Intelligent Keyword Classifier，但对于此用例，让我们用 UiPath 的 Machine\
  \ Learning Classifier 替换 Intelligent Keyword Classifier。\n\nUiPath Machine Learning\
  \ Classifier 利用部署到 UiPath AI Center 的 ML 技能将文档分类为四个类别 – 收据、发票、采购订单和公用事业账单。因此，让我们先开始将相关\
  \ ML 技能部署到 AI Center：\n\n1. 导航到 **Automation Cloud** 中的 **AI Center** 并创建一个新项目，`Note\
  \ Receipt Details`。\n\n2. 创建一个数据集，命名为 `DocumentUnderstanding_Classifier`，供 ML 技能用于分类器训练（图\
  \ 8.22）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_233_0.png)\n\n图 8.22 – 收据数据集\n\
  \n3. 部署 **DocumentClassifier** 开箱即用的 ML 包，位于 **ML Packages > Out of the box Packages\
  \ > UiPath Document Understanding**（图 8.23）：\n\n> **重要说明**\n> 选择 **DocumentClassifier**\
  \ 技能的最新版本。无需包含可选字段，例如 OCR。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_234_0.png)\n\
  \n图 8.23 – DocumentClassifier 开箱即用包\n\n数据集和 ML 包创建后，我们必须接下来创建一个管道，以便用于持续训练我们的分类器。导航到\
  \ Pipelines 并创建一个新的 train run 管道，使用前面创建的数据集和 ML 包（图 8.24）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_235_0.png)\n\
  \n图 8.24 – 创建训练管道\n\n训练管道创建后，我们最后一步是部署一个 ML 技能以在我们的 UiPath 项目中利用。\n\n4. 导航到 ML Skills\
  \ 并创建一个新的 ML 技能，使用前面创建的 ML 包（图 8.25）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_236_0.png)\n\
  \n图 8.25 – 创建新的 ML 技能\n\n一旦 Machine Learning Classifier 部署，我们必须接下来将其连接到我们的 UiPath\
  \ 项目。\n\n5. 导航回工作流 `30_Classify.xaml`。\n\n6. 在 **Classify Document Scope** 中，用 **Machine\
  \ Learning Classifier** 活动替换 **Intelligent Keyword Classifier** 活动。\n\n7. 在 **Machine\
  \ Learning Classifier** 中，选择我们刚刚创建的 ML 技能（`ML_Classifier`）（图 8.26）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_237_0.png)\n\
  \n图 8.26 – 设置 Machine Learning Classifier\n\n一旦 Machine Learning Classifier 活动添加到工作流，我们必须配置分类器以对我们分类法中的\
  \ **Receipt** 文档类型进行分类。\n\n8. 点击 Configure Classifiers 并为 Receipt 文档类型选择 receipts（图\
  \ 8.27）：\n\n> **重要说明**\n> Machine Learning Classifier 适用于发票、采购订单、收据和公用事业账单，因此下拉菜单包含四个选项。\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_238_0.png)\n\n图 8.27 – Configure Classifiers\n\
  \n分类器部署并连接到我们的 UiPath 项目后，分类中的最后一步是设置训练器。如果我们需要手动验证 UiPath 机器人的分类结果，训练器将使用我们的手动输入重新训练我们的\
  \ ML 技能。\n\n\n\n\n+   9. 打开**40_TrainClassifers.xaml**工作流。\n+   10. 在**训练分类器范围**内，将**智能关键字分类器训练器**活动替换为**机器学习分类器训练器**活动。\n\
  +   11. 在机器学习分类器训练器中，选择我们之前创建的AI Center项目（**票据收据详情**）和数据集（**DocumentUnderstanding_Classifier**）（*图8.28*）：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_239_0.png)\n\n图8.28 – 设置机器学习分类器训练器\n\n\
  与机器学习分类器活动类似，在添加机器学习分类器训练器之后，我们必须配置分类器，以对我们的分类法中的**收据**文档类型进行分类。\n\n12. 点击“配置分类器”，并为“收据”文档类型选择receipts（图8.29）：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_240_0.png)\n\n图8.29 – 配置分类器\n\n配置完分类器训练器后，机器学习分类器的配置就完成了。\n\
  \n现在，我们可以利用ML技能对收据进行分类，并继续下一节的文档理解框架——抽取。\n\n与机器学习分类器不同，用于收据和发票的机器学习抽取器可以由UiPath外部托管，也可以由我们通过AI\
  \ Center在内部托管。因此，文档理解流程模板开箱即用，已经指向这些外部托管的抽取器。UiPath机器人被指示使用配置文件的**ReceiptsEndpoint**键中定义的抽取器。\n\
  \n对于此用例，我们将在AI Center上托管**收据**ML抽取器，以便我们可以像进行分类任务一样重新训练抽取器。托管抽取器的步骤与刚才执行的分类步骤类似，具体如下：\n\
  \n+   1. 在AI Center的**票据收据详情**项目中，创建一个新数据集**收据**，用于重新训练。\n+   2. 部署位于**ML Packages\
  \ > Out of the box Packages > UiPath Document Understanding**下的开箱即用ML包**收据**（*图8.31*）：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_242_0.png)\n\n图8.31 – 收据开箱即用包\n\n3. 导航到Pipelines，并使用Receipt数据集和新建部署的Receipt\
  \ ML包创建一个新的训练运行管道。将auto_retraining标志设置为True（图8.32）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_243_0.png)\n\
  \n图8.32 – 创建训练管道\n\n创建训练管道后，我们的最后一步是部署一个将在UiPath项目中使用的ML技能。\n\n+   4. 导航到**ML技能**，并使用之前创建的**收据**ML包创建一个新的ML技能。\n\
  \n一旦ML抽取器部署完成，我们接下来必须将其连接到我们的UiPath项目。\n\n+   5. 导航回**50_Extract.xaml**工作流。\n\n\
  +   6. 在**数据抽取范围**内，删除**收据ML抽取器**活动中的端点，并选择**ML技能**下拉菜单下的**收据**技能（*图8.33*）：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_244_0.png)\n\n图8.33 – 用已部署的ML技能替换端点\n\n\
  在部署收据抽取器并将其连接到我们的UiPath项目后，抽取的最后一步是设置训练器。\n\n+   7. 打开**60_TrainExtractors.xaml**工作流。\n\
  \n+   8. 在**训练分类器范围**内，在**收据抽取器训练器**活动中选择**票据收据详情**项目和**收据**数据集（*图8.34*）：\n\n使用文档理解流程模板，导出工作流位于70_Export.xaml中。默认情况下，此工作流将为通过文档理解处理的每个文档输出一个单独的Excel工作表；但是，对于此用例，我们希望将所有结果导出到一个Excel工作表中。为此，我们需要对导出工作流进行一些修改。\n\
  \n第一个必要的修改是标准化导出的Excel工作表的文件名。默认情况下，文档理解流程模板将使用收据文件名和页码的组合，例如1000-receipt_1-1.xlsx。这在大多数用例中效果很好；但是，我们需要一个文件来存放所有收据的结果：\n\
  \n+   1. 在70_Export.xaml的**分配输出文件名**活动中，将值更改为Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.Desktop),\
  \ \"Note_Receipt_Details.xlsx\")。\n\n通过将输出文件名更改为Note_Receipt_Details，我们就有了一个可以导出收据数据的文件。将目录更改为桌面也会直接将文件保存到用户的桌面文件夹。\n\
  \n第二个必要的修改是向工作流添加**追加范围**活动。由于默认的文档理解流程模板为每个文档创建了一个Excel工作表，因此它只需要使用**写入范围**活动为每个文档写入一个新的Excel工作表。如果我们想将所有结果存储在一个Excel工作表中，使用**写入范围**活动会覆盖现有数据，因此可以使用**追加范围**将数据追加到现有Excel工作表的末尾。\n\
  \n+   2. 在**对于每个导出的表**中，添加一个IF语句，使用以下条件检查**outputFile**是否存在——File.Exists(outputPath)。\n\
  \n+   3. 将**写入范围**活动放置在**If**语句的**Else**块中。\n\n+   4. 将一个**追加范围**活动拖到**If**语句的**Then**块中（图8.35），参数如下：\n\
  \n+   - **DataTable:** `table`\n+   - **SheetName:** `table.TableName`\n+   - **Workbook\
  \ Path:** `outputPath`\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_247_0.png)\n\n\
  图8.35 – 修改后的“对于每个导出的表”活动\n\n通过添加追加范围活动，自动化可以将最近读取的收据结果添加到现有的Excel工作簿中。如果工作簿不存在，自动化可以回退到使用写入范围活动来创建新的输出文件。\n\
  \n请注意，所有导出的数据都将保存在项目文件夹的Data\\Exports中。可以通过打开项目Data文件夹中的Config.xlsx文件并修改ExportsFolder条目来更改此位置。\n\
  \n配置完导出器后，文档理解流程模板的配置就完成了。尝试使用位于此链接的收据运行工作流：https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter08/Receipt%20Data.\n\
  \n通过遵循文档理解框架的步骤并使用文档理解流程模板，我们能够快速创建一个智能工作流来识别收据。在本节中，我们利用文档理解流程模板并遵循文档理解框架步骤构建了用例。在下一节中，我们将开始使用示例数据测试刚刚创建的工作流。\n\
  \n## 测试以确保稳定性并提高准确性\n\n用例的初始开发完成后，我们可以尝试测试自动化在ML分类器和ML抽取器中的表现。在部署之前测试任何自动化工作流对于确保自动化按预期工作至关重要。在本节中，我们将研究为ML分类器和ML抽取器启用验证站，并开始使用示例数据进行测试。\n\
  \n## 启用验证站\n\n在先前的用例开发过程中，我们部署了DocumentUnderstanding分类器和Receipts ML技能，分别充当我们的分类器和抽取器。我们将这些技能部署到AI\
  \ Center的原因之一是能够使用验证站重新训练这些技能。这使我们能够手动验证自动化性能并重新训练ML模型，我们称之为“关闭反馈循环”（图8.36）：\n\n\
  ![](img/05268897c8ac5d80eb3fead1cc8a822a_248_0.png)\n\n图8.36 – 关闭反馈循环\n\n正如第7章“测试和完善开发工作”中所讨论的，使用验证站关闭反馈循环可以在提高ML模型性能方面发挥重要作用。\n\
  \n通过将DocumentUnderstanding分类器和Receipts抽取器部署到AI Center，并在AI Center内创建数据集以存储验证数据，我们可以轻松启用验证站，在我们的用例上关闭反馈循环。\n\
  \n\n\n\n在定义文档理解流程模板的设置时，我们在 UiPath Orchestrator 中配置了几个资产，具体如下：\n\n- **AlwaysValidateClassification**：一个布尔值，告诉\
  \ UiPath 始终对分类进行人工验证。如果设置为 True，则将始终执行验证。\n- **AlwaysValidateExtraction**：一个布尔值，告诉\
  \ UiPath 始终对提取进行人工验证。如果设置为 True，则将始终执行验证。\n\n在配置文档理解流程模板设置期间，我们将这两个资产都设置为 True（图\
  \ 8.37），这意味着我们告诉 UiPath 不希望跳过分类器或提取器训练；相反，我们希望 UiPath 启动验证站，并利用我们的人工输入来重新训练分类器和提取器：\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_249_0.png)\n\n图 8.37 – 资产配置\n\n出于测试目的，应启用验证站以帮助重新训练提取器和分类器，因此这两个资产都应设置为\
  \ True。测试完成后，您可能希望通过将资产设置为 False 来关闭验证，或者在工作流中添加额外的逻辑，仅在分类器或提取器返回较低置信度时才显示验证站。另一个建议是与业务部门合作，并就成功指标达成一致——例如，在禁用验证站之前测试\
  \ 100 个场景，达到 90% 的正向率。\n\n## 使用示例收据进行测试\n\n启用验证站后，我们现在可以测试已部署的分类器和提取器的性能，并在必要时重新训练这两个技能。要开始测试，请导航到以下链接以获取示例收据：https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter08/Receipt%20Data。\n\
  \n在上述链接中，您会找到用于测试的收据，以及测试完成后使用的收据。我们将使用 Testing 文件夹中的收据进行测试。\n\n在第 7 章“测试和完善开发工作”中，我们讨论了在训练认知自动化时，我们应该有多个数据集来测试我们的\
  \ ML 技能：\n\n- **训练数据集**：用于训练 ML 模型的初始数据集\n- **评估数据集**：用于评估 ML 模型训练效果的一组较小数据\n- **测试数据集**：用于将训练好的\
  \ ML 模型暴露于真实数据中的无偏数据集\n\n幸运的是，对于这个用例，我们使用的 ML 技能（**文档理解**分类器和**收据**提取器）已经预先训练好并可供使用。这意味着\
  \ UiPath 已经为我们完成了初始训练和评估，我们只需使用无偏数据测试数据集，并在必要时通过验证站进行重新训练。\n\n在 Testing 文件夹中，您会找到\
  \ 50 张用于测试的收据。您可以随意使用这 50 张收据的一个子集进行测试，也可以单独测试全部 50 张。测试时，请务必验证分类（图 8.38）和提取（图 8.39），以进一步加强部署到\
  \ AI Center 的 ML 技能。\n\n与分类一样，您应手动验证提取返回的所有字段（图 8.39）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_252_0.png)\n\
  \n图 8.39 – 验证提取结果\n\n验证后，您应注意到百分比变为 100%。在某些情况下，提取器可能无法正确提取正确的信息，例如图 8.39 中的收据名称。请注意，提取器只提取了\
  \ Street，而不是 1660 India Street。这是一张棘手的收据，因为收据名称看起来像供应商的地址。\n\n要纠正此提取结果，请将鼠标悬停在文本上，然后按\
  \ *Ctrl + 左键单击*。这将在您要验证的文本周围放置一个红色虚线矩形（*图 8.40*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_253_0.png)\n\
  \n图 8.40 – 验证收据名称\n\n然后，单击**收据名称**字段下的三个点，并单击**更改提取的值**，将**收据名称**的值更改为我们已验证的值（*图\
  \ 8.41*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_253_1.png)\n\n图 8.41 – 收据名称已验证\n\
  \n根据收据的结构及其图像，您可能需要更改某些提取的字段。对于其他收据，您可能不需要更改任何值。如果不需要更改任何值，您仍应通过选中复选框来验证提取的值，将置信度百分比更改为**100%**。对于缺失值和表格项目也是如此，因为所有验证都有助于重新训练和强化模型。\n\
  \n> **重要说明**\n>\n> 有关如何与验证站交互的更多信息，请访问 `https://docs.uipath.com/activities/docs/present-validation-station#using-the-validation-station`。\n\
  \n验证后，您可以单击**保存**继续，UiPath 将使用该验证来重新训练**文档理解**分类器。继续使用 Testing 文件夹中的其他收据测试自动化。当您继续测试和重新训练时，分类器和提取器的性能应会提升。\n\
  \n总之，在测试阶段，使用验证站验证分类和提取结果至关重要。任何人工验证都是让我们的 ML 技能变得更智能、更强大的机会。在本节中，我们学习了如何在*文档理解流程模板*中启用验证站，然后学习了如何与验证站交互。在下一节中，我们将通过添加功能来增强最终用户体验，从而为部署用例做好准备。\n\
  \n## 以最终用户体验为中心的部署\n\n随着用例的初始开发和测试完成，我们可以着手将自动化部署到生产环境中。然而，在部署到生产环境之前，我们应该在自动化中添加一些项目，以改善最终用户体验。在本节中，我们将创建一个**调度器**，这是一个额外的工作流，用于调度我们的\
  \ `Main-Attended.xaml` 文件。创建调度器后，我们将添加几个对话框，让最终用户随时了解自动化的状态。完成后，我们将为最后一节——将自动化部署到生产环境做好准备。\n\
  \n### 创建调度器\n\n您可能已经注意到，在上一节测试用例时，我们一次只能为一个收据运行自动化。由于*文档理解流程模板*配置为一次处理一个文档，我们需要创建一种机制来调度文档理解流程模板。调度器将要求用户输入一个文件夹路径作为输入，对于文件夹中的每个文件，调用我们创建的文档理解流程模板，以满足未来状态设计中设定的要求。\n\
  \n要创建调度器，我们必须首先创建一个新工作流：\n\n1. 在**注明收据详细信息**项目中，创建一个名为 `Dispatcher` 的新工作流文件。\n2.\
  \ 创建后，将调度器文件设置为主文件（*图 8.42*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_255_0.png)\n\
  \n图 8.42 – 将 Dispatcher.xaml 设置为主文件\n\n一旦调度器被创建并设置为项目的主文件，我们就可以开始向工作流添加代码。\n\n3.\
  \ 在 `Dispatcher.xaml` 中，将一个**浏览文件夹**活动拖到主序列中，将输出保存为名为 `selected_folder` 的变量。\n4.\
  \ 接下来，将一个**文件夹中的每个文件**活动拖到序列中，将**文件夹**输入属性设置为 `selected_folder`。\n5. 在**文件夹中的每个文件**的**执行**序列中，拖入一个**调用工作流文件**活动，将**工作流文件名**输入属性设置为我们之前创建的文件\
  \ `Main-Attended.xaml`（*图 8.43*）。\n\n\n\n\n\n6. 在 **Invoke Workflow File** 活动中，单击\
  \ **Import Arguments** 并将 `in_TargetFile` 参数设置为 `CurrentFile.FullName.` 这将确保 Main-Attended\
  \ 工作流对文件夹内的每个文件运行：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_256_0.png)\n\n图 8.43\
  \ – 已完成的 Dispatcher.xaml 工作流\n\n通过添加一个带有 For Each File in Folder 活动的工作流，我们可以持续调用使用\
  \ Document Understanding Process 模板创建的 Main-Attended.xaml 工作流。在本节中，我们创建了一个新的工作流\
  \ Dispatcher，并将文件设为主项目的核心文件。在 Dispatcher.xaml 中，我们添加了一个文件夹选择器活动，以提示最终用户输入文件夹路径。然后我们添加了一个\
  \ for-each 循环来遍历文件夹中的文件，为每张收据调用 Main-Attended.xaml。在下一节中，我们将在部署自动化到生产环境之前添加一些额外的提示来指导最终用户完成自动化执行。\n\
  \n## 添加用户输入提示\n\n最佳实践的 attended 自动化始终应包含提示或消息框，以指导和/或告知用户自动化的进度。如第 5 章《Designing\
  \ Automation with End User Considerations》中所述，让自动化易于使用是确保自动化采用的简单方法。在本节中，我们将着手添加消息框和信息对话框，以在自动化执行期间让最终用户保持了解。\n\
  \n在上一节创建调度器时，我们添加了一个文件夹选择器来提示人工用户选择收据文件夹以供自动化提取。新的用户可能会发现此文件夹选择器令人困惑，因为他们可能不知道该选择什么，因此我们应在文件夹选择器之前添加一个消息框，指导用户选择哪个文件夹：\n\
  \n- 1. 在 Dispatcher.xaml 中，在 Browse for folder 活动之前拖入一个 Message Box 活动（图 8.44）。\n\
  - 2. 在 Text 输入属性中添加一个描述性消息，例如 Please choose a receipts folder：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_257_0.png)\n\
  \n图 8.44 – 向 Dispatcher 添加消息框\n\n通过在呈现文件夹选择器之前添加消息框，我们可以更准确地指导用户选择自动化要交互的正确文件夹。虽然添加消息框是让用户保持了解的一种方法，但另一种方法是呈现状态栏，让用户了解自动化的状态（图\
  \ 8.45）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_258_0.png)\n\n图 8.45 – 呈现状态栏\n\
  \nUiPath 团队创建了一组自定义活动，专门用于通过状态栏、进度条和消息框让用户保持更新。使用 Interactive Activities 自定义活动，我们可以快速轻松地将这些消息添加到工作流中。\n\
  \n> Important Note\n> 有关 Interactive Activities 的更多信息，请访问 https://marketplace.uipath.com/listings/notification-activities。\n\
  \n要在项目中安装 Interactive Activities，请按照以下步骤操作：\n\n- 1. 在 Note Receipt Details 项目的 Design\
  \ 功能区中单击 Manage Packages。\n- 2. 在 Manage Packages 窗口中，单击 Marketplace 并搜索 UiPathTeam.Interactive.Activities（图\
  \ 8.46）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_258_1.png)\n\n图 8.46 – 安装 Interactive\
  \ Activities\n\n- 3. 要安装，请选择最新版本并单击 **Save**。\n\n安装 Interactive Activities 后，即可将其添加到项目中。\n\
  \n为了最好地显示用户的进度，我们应在开始和完成收据时呈现状态栏，以及在 Document Understanding 框架的里程碑过程中呈现状态栏（数字化、分类、提取和导出）。让我们先在调度器中添加一个开始消息。\n\
  \n- 4. 在 **For Each File in Folder** 活动的 **Do** 序列内拖入一个 **Display Message** 活动。\n\
  - 5. 在 **Display Message** 活动中，在 **Message** 输入属性中添加一个描述性消息，并在 **Handle** 输出属性中创建\
  \ `windowIdentifier` 变量。\n\n如果您想多次替换状态栏消息，**Handle** 输出属性非常重要。句柄充当状态栏窗口的唯一标识符，如果在更新状态栏时未设置该属性，将导致多个状态栏彼此堆叠（*Figure\
  \ 8.47*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_259_0.png)\n\n图 8.47 – 状态栏彼此堆叠\n\
  \n- 6. 在 `Variables` 窗格中，将 `windowIdentifier` 的作用域设置为 main sequence 而不是 **Do**（*Figure\
  \ 8.48*）。这可确保在 for 循环的每次迭代中唯一标识符不会被重置：\n\n| Name | Variable type | Scope |\n|---|---|---|\n\
  | selected_folder | String | Main |\n| windowIdentifier | Int32 | Main |\n| Create\
  \ Variable | | Do |\n| | | Main |\n| | | Main |\n\n图 8.48 – 设置 windowIdentifier\
  \ 的作用域\n\n添加 **Display Message** 活动后，您的调度器工作流应如下图所示 *Figure 8.49*：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_260_0.png)\n\
  \n图 8.49 – 带有显示消息的调度器工作流\n\n可以在 Document Understanding Process 模板内部添加额外的状态消息，以调用数字化、分类、提取和导出。您可以将\
  \ **Display Message** 活动添加到每个单独的工作流中；只需确保传递在调度器工作流中设置的 `windowIdentifier` 以防止状态彼此堆叠。\n\
  \n通过添加消息框和状态消息，我们使自动化对最终用户更友好一些，通过指导他们选择哪个文件夹并让他们了解自动化的状态。现在这些活动已添加到工作流中，我们可以认为自动化已完成，并进入下一节部署自动化到生产环境。\n\
  \n## 部署到生产环境\n\n在生产环境中，我们不应直接从 UiPath Studio 运行自动化，也不应期望最终用户能够访问 UiPath Studio。因此，我们必须将自动化部署到\
  \ UiPath Orchestrator，以便其他人可以从他们的 UiPath Assistant 运行我们的自动化。\n\nUiPath Assistant\
  \ 是一款桌面工具，用于启动和与 UiPath 自动化交互，是一种启动板（图 8.50）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_261_0.png)\n\
  \n当自动化部署用于大规模使用时，它会部署到 UiPath Orchestrator，然后它会出现在最终用户的助手上供他们运行。\n\n> **Important\
  \ Note**\n> 有关部署自动化的更多信息，请访问 https://docs.uipath.com/studio/docs/about-publishing-automation-projects。\n\
  \n对于此用例，我们将快速将自动化发布到我们自己的 UiPath Assistant 中的个人工作区：\n\n- 1. 在 **Note Receipt Details**\
  \ 项目中，单击 UiPath Studio 的 **Design** 功能区中的 **Publish** 按钮。\n- 2. 检查 **Publish to**\
  \ 字段是否设置为 **Orchestrator Personal Workspace Feed**（*Figure 8.51*）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_262_0.png)\n\
  \n图 8.51 – 发布自动化\n\n- 3. 单击 **Publish**。\n\n发布后，您应该能在您的 UiPath Assistant 中看到自动化（图\
  \ 8.52）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_263_0.png)\n\n图 8.52 – 项目部署到\
  \ UiPath Assistant\n\n单击 Note.Receipt.Details 右侧的 Run 按钮将把自动化安装到您的机器上并开始执行。\n\n\
  部署后，您可以自由地直接从 UiPath Assistant 运行自动化。对代码的任何更改都可以在 UiPath Studio 中进行，然后按照刚才讨论的步骤重新发布。在本节中，我们通过将\
  \ Note Receipt Details 项目部署到我们的 UiPath Assistant 来完成了用例构建——干得好！\n\n\n\n\n\n## 摘要\n\
  \n在本章中，我们介绍了如何使用 *UiPath Document Understanding* 构建认知自动化用例。在构建该用例的过程中，我们利用 *UiPath\
  \ Document Understanding 流程模板*，遵循 *UiPath Document Understanding 框架*的最佳实践进行构建。通过全面理解\
  \ Document Understanding 和 Document Understanding 框架，我们构建了一个认知用例，该用例可以解读收据，供 T&E\
  \ 团队在费用报告审核流程中使用。\n\n在下一章中，我们将继续采用实践操作的方式，一起构建基于 UiPath 的三个用例中的第二个。我们将学习如何使用 UiPath\
  \ 的 AI Center 对电子邮件进行分类。\n\n### 用例 2 – 使用 AI Center 进行电子邮件分类\n\n**机器学习（ML）**的一个经典用途是文本分类。每个组织，无论属于哪个行业，都有对文本进行分类的用例。文本分类用例的示例包括将电子邮件路由到相应的文件夹，或将服务请求路由到相关团队。这类工作中有很多仍然是手动的，需要个人查看文本，并运用其判断力来解释和分类文本内容。幸运的是，借助\
  \ UiPath 的 AI Center，我们可以创建认知自动化，对文本进行智能理解，从而有可能减少人工操作的需求。\n\n在全面理解 AI Center 的基础上，我们将一起构建能够解释和分类文本的认知自动化。在构建用例时，我们将遵循前几章中概述的类似开发生命周期。我们将从了解当前自动化机会的状态开始，然后设计包含自动化的流程未来状态。一旦设计了未来状态，我们将使用\
  \ UiPath Studio 和 AI Center 构建自动化，测试解决方案以确保稳定性，最后将自动化部署到生产环境中。\n\n在本章 *用例 2 – 使用\
  \ AI Center 进行电子邮件分类* 中，我们将在构建处理收据的自动化时涵盖以下主题：\n\n- 了解当前状态\n- 创建未来状态设计\n- 使用 AI\
  \ Center 构建解决方案\n- 测试以确保稳定性并提高准确性\n- 考虑最终用户体验进行部署\n\n### 技术要求\n\n本章的所有代码示例都可以在 GitHub\
  \ 上找到，链接如下：\n\n```\nhttps://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter09\n\
  ```\n\n使用 UiPath 非常简单，使用社区版，我们可以免费开始。但是，对于 UiPath AI Center，我们需要企业版许可证。您可以从 uipath.com\
  \ 获取 60 天的企业试用许可证。\n\n有了 60 天的企业试用版，您将可以使用以下内容：\n\n- 五个 RPA Developer Pro 许可证——指定用户许可证包括\
  \ Studio、StudioX、Attended Robot、Apps、Action Center、Task Capture 的访问权限\n- 五个 Unattended\
  \ Robots、五个 Testing Robots、五个 AI Robots\n- AI Center、AI Computer Vision、Automation\
  \ Hub、Data Service、Document Understanding 和 Insights\n\n对于本章，您将需要以下内容：\n\n- UiPath\
  \ Enterprise Cloud（包含 AI Center）\n- UiPath Studio 2021.4+\n- `UiPath.MLServices.Activities`\
  \ 包 v1.2.0 或更高版本\n- `UiPath.WebAPI.Activities` 包 v1.9.2 或更高版本\n\n**重要说明**\n有关如何安装\
  \ UiPath 包的说明，可以在以下链接找到：\nhttps://docs.uipath.com/studio/docs/managing-activities-packages\n\
  \n请观看以下视频，查看 Code In Action：https://bit.ly/3udG6qL\n\n### 在 UiPath 企业试用版中启用 AI Center\n\
  \nUiPath Document Understanding 在 UiPath 社区版和企业版中开箱即用；但是，对于 UiPath AI Center，我们需要在企业试用版中启用该服务。您可以按照以下步骤启用该服务：\n\
  \n1. 导航到 Automation Cloud，网址为 https://cloud.uipath.com。Automation Cloud 主页如下所示：\n\
