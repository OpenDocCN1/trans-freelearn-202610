  \n资料来源：UiPath 网站\n\n图 3.16 – UiPath 聊天机器人（Druid）：优势\n\nUiPath 的 Druid 聊天机器人有六大关键优势：\n\
  \n- **500+ 预构建对话技能**：\n\nUiPath 的 Druid 聊天机器人拥有超过 500 个针对跨行业和多种角色的业务场景预构建的技能。这些对话技能包括回答问题、发送通知、交付报告、跟踪智能任务、填写表单以及转接人工。Druid\
