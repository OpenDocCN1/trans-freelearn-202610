- "## 11\n\n# AI 中心\n高级主题\n\n在之前的章节中，我们看到了如何利用 **机器学习 (ML)** 来协助收据处理和邮件分类。虽然这些用例非常流行，但还有许多其他类型的用例可以应用\
  \ **命名实体识别 (NER)** 模型或自定义 ML 模型。\n\n在本章中，我们将涵盖以下主题：\n\n- 使用 AI Center 进行 **命名实体识别\
  \ (NER)**\n- 将您自己的自定义模型部署到 AI Center\n\n我们将介绍 NER 的概念，这项任务开启了我们可以将 ML 应用于的新类型用例。我们还将涉足将自定义\
  \ Python ML 模型部署到 AI Center，因为在许多情况下，组织拥有自己的预建 ML 模型，可以与 RPA 结合使用。\n\n完成后，我们将了解如何利用\
  \ UiPath 的 NER 功能，以及如何将自己的自定义 Python 模型连接到 AI Center。\n\n## 技术要求\n\n本章的所有代码示例均可在\
  \ GitHub 上找到，地址为 `https://github.com/PacktPublishing/Democratizing-Artificial-Intelligence-with-UiPath/tree/main/Chapter11`。\n\
  \n使用 UiPath 非常容易，并且使用 Community 版本可以免费开始。然而，对于 UiPath AI Center，我们需要企业许可证。您可以从 `uipath.com`\
  \ 获取 60 天企业试用许可证。\n\n使用 60 天企业试用，我们将获得以下访问权限：\n\n- 5 个 RPA Developer Pro 许可证 – 命名用户许可证包括\
  \ Studio、StudioX、Attended Robot、Apps、Action Center 和 Task Capture 的访问权限\n- 5 个 Unattended\
  \ Robots、5 个 Testing Robots、2 个 AI Robots\n- AI Center、AI Computer Vision、Automation\
  \ Hub、Data Service、Document Understanding 和 Insights\n\n对于本章，您需要以下内容：\n\n- UiPath\
  \ Enterprise Cloud（带 AI Center）\n- UiPath Studio 2021.4+\n- `UiPath.MLServices.Activities`\
  \ 包 v.1.20.0 或更高版本\n\n> **重要说明**\n> \n> 有关如何安装 UiPath 包的说明，请参阅 `https://docs.uipath.com/studio/docs/managing-activities-packages`。\n\
  \n## 在 UiPath Enterprise 试用中启用 AI Center\n\n额外的技术要求包括利用 AI Center。UiPath Document\
  \ Understanding 默认随 UiPath Community 和 Enterprise 版本一起提供，然而，对于 UiPath AI Center，我们需要在\
  \ Enterprise 试用中启用该服务。您可以按照以下步骤启用该服务：\n\n1. 导航至 **Automation Cloud**：`https://cloud.uipath.com`。\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_347_0.png)\n\n图 11.1 – UiPath Automation\
  \ Cloud 主页\n\n2. 导航至 **Admin**。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_347_1.png)\n\
  \n图 11.2 – 点击 Admin\n\n3. 在 **DefaultTenant** 中，点击三个点，然后点击 **Tenant Settings**。\n\
  \n![](img/05268897c8ac5d80eb3fead1cc8a822a_348_0.png)\n\n图 11.3 – 点击 Tenant Settings\n\
  \n4. 在 **Provision Services** 下选择 **AI Center**，然后点击 **Save**。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_348_1.png)\n\
  \n图 11.4 – 勾选 AI Center，然后点击 Save\n\n启用 AI Center 后，我们已完成本章的技术要求。在下一节中，我们将通过回顾当前状态来开始收集用例的上下文。\n\
  \n这些类型的用例涵盖了大量自动化机会，包括来自上一章的邮件分类用例。\n\n要构建这些用例，UiPath 的 AI Center 提供了开源 NER 模型和\
  \ UiPath 预备的 NER 模型（*图 11.6*）。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_350_0.png)\n\
  \n图 11.6 – AI Center NER 模型\n\n在 **Open-Source Packages > Language Analysis** 中，您会找到一个名为\
  \ NamedEntityRecognition 的 ML 包。该 ML 包经过预训练，可识别 18 种不同类型的命名实体，列于 *表 11.1*。\n\n|\
  \ 实体 | 描述 |\n|---|---|\n| PERSON | 人物，包括虚构人物 |\n| NORP | 国籍、宗教、政治团体 |\n| FAC | 建筑物、机场、高速公路、桥梁\
  \ |\n| ORG | 公司、机构、组织 |\n| GPE | 国家、城市、州 |\n| LOC | 非 GPE 位置、山脉、水体 |\n| PRODUCT\
  \ | 物体、车辆、食物 |\n| EVENT | 命名的飓风、战役、战争、体育赛事 |\n| WORK_OF_ART | 书籍、歌曲的标题 |\n| LAW\
  \ | 被制定为法律的命名文件 |\n| LANGUAGE | 任何命名语言 |\n| DATE | 绝对或相对日期或时期 |\n| QUANTITY | 测量值，如重量或距离\
  \ |\n| ORDINAL | “第一”、“第二” |\n| CARDINAL | 不属于其他类型的数字 |\n\n表 11.1 – NamedEntityRecognition\
  \ 模型的实体\n\n如图所示，NamedEntityRecognition 开源模型可用于识别许多不同实体。该模型的唯一缺点是它已预训练且不可重新训练。在下一节中，我们将研究\
  \ UiPath 的自定义 NER ML 模型，用于需要可训练 NER 模型的用例。\n\n## 使用 UiPath 的自定义 NER\n\n对于我们需要 NER\
  \ 模型而不适合开源 NER 模型的 18 个实体，或需要重新训练的情况，我们可以使用 UiPath 即开即用的 CustomNamedEntityRecognition\
  \ ML 模型（图 11.7）。\n\nML Packages / Out of the box Packages / UiPath Language Analysis\n\
  \nUiPath Language Analysis\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_351_0.png)\n\
  \n图 11.7 – UiPath 的 CustomNamedEntityRecognition 即开即用 ML 模型\n\n该 ML 包允许我们使用自己的数据集，这些数据集已预先标记（或标注）了我们需要提取的实体。这可以为许多不同类型的实体开启许多新的用例类型，例如以下内容：\n\
  \n- 保险用例 – 车辆实体\n- 医疗保健 – 药物实体\n- 零售 – 服装实体\n\n使用此 ML 模型，我们需要提供一个预先标注了我们想要提取的实体的训练数据集。训练和评估数据集需要采用\
  \ CoNLL 格式，这可以使用名为 Label Studio 的工具完成。\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_352_0.png)\n\
  \n图 11.8 – Label Studio\n\nLabel Studio 是一个开源工具，可让您轻松标注音频、文本、图像等数据类型。使用 CustomNamedEntityRecognition\
  \ ML 模型时，Label Studio 将用于将标注数据导出为 CoNLL 2003 格式。\n\n重要说明\n\n有关如何使用 UiPath 的 Custom\
  \ NER 模型的逐步指南，请参阅 https://docs.uipath.com/ai-fabric/v0/docs/extracting-chemicals-from-research-paper-by-category。\n\
  \n将数据集上传到 AI Center 后，创建 ML 技能的方式与我们在前几章中执行的方式相同。\n\n在本节中，我们介绍了 NER 的概念，了解了它如何与多个适用用例场景相关，并了解了\
  \ UiPath AI Center 中可用的 NER 模型。在下一节中，我们将研究如何将自定义 Python ML 模型部署到 AI Center。\n\n\
  ## 将您自己的自定义模型部署到 AI Center\n\n我们在前几章中的示例都利用了由 UiPath 或开源社区开发和训练的即开即用 ML 模型。虽然这些即开即用模型可能适合大多数用例，但在某些情况下，您可能希望利用自定义\
  \ ML 模型进行自动化。UiPath AI Center 使部署预制的 Python 或 AutoML 模型变得非常容易。在本节中，我们将介绍以下内容：\n\n\
  - 为 AI Center 准备 Python 模型\n- 部署到 AI Center\n- 与 UiPath 自动化交互\n\n涵盖这些要点后，您应该具备将自己的预建模型部署到\
  \ UiPath AI Center 所需的技能。\n\n## 为 AI Center 准备 Python 模型\n\n在我们能够将 Python 模型部署到\
