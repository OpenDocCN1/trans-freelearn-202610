  在加入 UiPath 之前，Fanny 曾共同领导麦肯锡在北美的自动化业务，并为 CxO 制定自动化战略，以实现收入增长并取得利润成效。在从事自动化工作之前，Fanny
  还曾在普华永道和德勤领导业务转型项目。


  Fanny 拥有芝加哥大学经济学学士学位和加州大学洛杉矶分校安德森管理学院 MBA 学位。她出生于香港，现与家人居住在洛杉矶。


  **Jeremiah Crowley** 是一位跨学科开发者，拥有广阔的技术和运营视角。他最初对软件开发和实施的热情引导他走向自动化和流程效率领域。他喜欢处理并解决问题，无论问题大小或涉及何种技术。


  Jeremiah 毕业于纽约大学，获得计算机科学学士学位。他的工作经历包括安永和麦肯锡公司，在自动化与服务运营部门担任职务。目前，他是 UiPath 自动化咨询创新办公室的总监，通过管理数字化转型项目和开发超自动化框架与方法论，帮助组织推动采用并扩展自动化。


  ## 致谢


  **人工智能 (AI)** 使企业能够优化需要认知能力、具有概率性、以及在文档、图像和语音方面具有高变异性和非结构化数据的业务流程。RPA 开发人员和精通技术的业务用户使用
  AI 解决日常业务问题没有很高的门槛。本关于 UiPath 的 AI 实用指南将帮助 AI 工程师和从事业务流程优化的 RPA 开发人员将知识付诸实践。该书采用动手方法，在短时间内在业务用例中实施自动化。


  完整包含对基本概念的分步解释、实用示例和自我评估问题，本书首先帮助你理解 AI 的强大功能，并概述利用现成模型的优势。你将了解认知 AI 在 RPA 中的背景、机器学习的基础知识，以及如何在开发生命周期中应用认知自动化。然后你将通过使用
  UiPath Document Understanding、UiPath AI Center 和 Druid 构建三个用例来检验你的技能。


  在本 AI 书籍结束时，你将能够构建具有 Document Understanding 和 AI Center 认知能力的 UiPath 自动化，同时理解开发生命周期。


