  \ **Add New Document Type** 按钮添加一个新文档类型，**Sliced Invoices**（示例发票类型的名称）：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_142_0.png)\n\
  \n图 6.10 – 添加 Forms | Invoices | Sliced Invoices 后的分类学管理器\n\n6. 通过点击 **Document\
  \ Type Details** 下的 **New Field** 创建数据字段。在 **Edit Field** 中，添加相应的数据字段的名称和类型。完成后点击\
