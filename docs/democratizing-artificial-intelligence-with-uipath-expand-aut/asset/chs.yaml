  \ 管道运行的输出报告\n\n点击 **Pipelines** 页面上的评估管道将展示管道的输出和日志：\n\n![](img/05268897c8ac5d80eb3fead1cc8a822a_181_0.png)\n\
  \n图 6.47 – 评估管道输出\n\n就这样！在下一节中，我们将部署一个 ML 技能并将其附加到 RPA 工作流。\n\n## 介绍 ML 技能\n\n与包是\
