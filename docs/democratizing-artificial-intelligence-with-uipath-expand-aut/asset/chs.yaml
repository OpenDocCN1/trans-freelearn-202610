  not true | The robot:<br>- References Market Data portion of output email<br>- Sends
  Email:<br>  - To: team@company.com<br>  - Subject: UIP Alert: Market Data Rejects
  Over 5%<br>  - Body: Today''s Kyriba Status Report shows a high amount of Rejections.<br>-
  END PROCESS | 1 | APPROVED |

  | 2 | - Market Data Rejects > 5% of total Integrated<br>- Market_Data_Bypass is
  true | The robot:<br>- References Market Data portion of output email<br>- All other
  functions as expected; formats and distributes email as expected | 2 | APPROVED
  |

  | 3 | - Mark to Market Report Missing | The robot:<br>- References Market Data portion
  of output email<br>- Filters for ''mtm'' template<br>- Runs MTM Reporting using
  RPA _ FX MTM Generation template<br>- All other functions as expected; formats and
  distributes email as expected | 3 | APPROVED |

  | 4 | - Mark to Market Report is ''Warning'' | The robot:<br>- References Market
  Data portion of output email<br>- Filters for ''mtm'' template<br>- Sends Email:<br>  -
  To: team@company.com<br>  - Subject: UIP Alert Check MTM Status<br>  - Body: ''Mark
  to Market status is: Warning - please investigate''<br>- END PROCESS | 4 | APPROVED
  |

  | 5 | - Mark to Market Report is ''Error'' | The robot:<br>- References Market Data
  portion of output email<br>- Filters for ''mtm'' template<br>- Sends Email:<br>  -
  To: team@company.com<br>  - Subject: UIP Alert Check MTM Status<br>  - Body: ''Mark
  to Market status is: Error - please investigate''<br>- END PROCESS | 5 | APPROVED
  |


  ![](img/05268897c8ac5d80eb3fead1cc8a822a_203_0.png)


  退出标准可能取决于组织，但通常，UAT 退出标准包括以下内容：


  - No defects open

  - Successful completion of UAT test scenarios

  - Documented sign-off of UAT


  为了满足这些退出标准，业务分析师、UAT 测试人员或 SME 应该记录每个已完成测试场景的结果。根据组织的不同，每个测试场景可以通过屏幕截图、视频录制或仅对自动化输出进行签核来记录。一旦满足退出标准，UAT
  就可以完全完成，并且自动化可以部署到生产环境。


  ## 关闭反馈循环


  随着认知自动化从 UAT 转移到生产环境，它可能会遇到训练、评估和测试测试集中未见过的数据。我们期望部署的模型能够基于所进行的训练处理新数据，但有时模型可能会返回不令人满意的结果，或者根据它遇到的新数据存在进一步改进模型性能的机会。


  这就是关闭反馈循环可以在 ML 模型性能中发挥重要作用的地方。通过对 Document Understanding 或 AI Center ML 技能关闭反馈循环，我们可以捕获未见过的数据点，使用人工向
  ML 技能发送反馈并持续用新数据训练该技能。您可以在以下屏幕截图中看到关闭反馈循环的表示：


  ![](img/05268897c8ac5d80eb3fead1cc8a822a_204_0.png)


  Figure 7.11 – 关闭反馈循环


  使用 UiPath，开发人员可以使用置信度阈值来允许自动化继续使用 ML 技能的输出，或提示用户通过使用 Attended Automation（Validation
  Station）或使用 Action Center 输入。此反馈循环现在使我们能够使用新鲜、相关的数据持续测试和完善我们的模型。


