  ## 前言\n运行可扩展、并发且容错的应用是一项艰巨的任务。在学习了 Elixir 提供的抽象之后，开发者能够轻松构建此类应用。话虽如此，在 Elixir 上随意尝试与在生产环境中运行并提供实时请求之间存在很大差距。《精通\
  \ Elixir》帮助你弥合这一差距，它不仅详细介绍了 Elixir 的工作原理，还指导你借助具体示例将所学概念付诸实践。\n\n在本书中，你将学习如何构建一个坚如磐石的应用，从使用\
  \ Mix 创建新项目开始。你将探索如何使用 Erlang 的 OTP 以及建立在其之上的 Elixir 抽象，从而构建易于并行化和分发的应用程序。掌握了基础知识后，你将掌握\
  \ Supervisors 并理解它们是构建容错应用的基础。此外，你还将了解如何使用 Phoenix 为你的应用创建 Web 界面。\n\n在完成实现后，你将学习如何彻底测试和监控开发的文件服务器。最后，你将学习如何将此应用部署到云端，使用\
  \ Kubernetes 自动部署、扩展和管理它。\n## 本书适合谁\n《精通 Elixir》适合那些已经在一定程度上使用过 Elixir 并希望将其提升到下一个水平的程序员。本综合指南展示了如何构建、部署和维护健壮的应用，让你从在副项目中尝试\
  \ Elixir 过渡到在实时环境中使用它。然而，即使没有任何 Elixir 经验，也能享受本书涵盖的复杂主题。\n## 本书涵盖内容\n第 1 章，*为即将到来的旅程做准备*，通过介绍\
  \ Elixir 开始我们的奥德赛。它首先介绍 Elixir 的数据类型以及模式匹配的工作原理，然后探索如何创建模块和函数，同时也介绍如何处理集合和使用 Elixir\
  \ 中的控制流。阅读完本章后，你将熟悉 Elixir 的语法，以及如何使用它编写一些简单的函数。\n\n第 2 章，Elixir 项目的内部结构，通过分析构成\
  \ Elixir 应用的内容以及 Elixir 项目是什么来展开。它随后研究如何使用 Mix 工具创建项目并管理其依赖项。在这里，我们将为本书中将开发的 ElixirDrip\
  \ 应用创建一个伞形项目。\n\n第 3 章，进程 – 并发和容错的基础，首先探讨 BEAM VM 的工作原理及其并发模型，即 Actor 模型。然后，它展示如何在\
  \ Elixir 中创建和操作进程，以 ElixirDrip 应用的一部分为例。本章还探讨如何链接和监控进程，以及 Supervisors 如何在此基础上构建以检测崩溃的进程。最后，本章探讨如何将\
  \ Supervisors 分组以创建监督树，从而实现容错应用的创建。\n\n第 4 章，由 Erlang/OTP 驱动，介绍 OTP 并检查 Elixir 从\
  \ Erlang 继承的经过实战检验的 OTP 抽象，如 GenServer 和 Erlang Term Storage，以及 Elixir 带来的新抽象 Agent、Task\
  \ 和 Registry。每个抽象都通过实现媒体缓存、文本搜索函数和搜索结果缓存得到充分利用。\n\n第 5 章，按需驱动处理，详细解释了 Elixir 引入的\
  \ GenStage 和 Flow 抽象如何让开发者使用按需驱动范式处理数据。与尽可能快地处理数据以匹配数据产生的速率不同，这种方法反其道而行，迫使生产者在由数据消费者控制的速率下将新数据注入管道。本章中开发了\
  \ ElixirDrip 应用的上传和下载管道。\n\n第 6 章，元编程–代码编写代码，揭示了允许开发者通过编写生成更多代码的常规 Elixir 代码来轻松控制编译时发生情况的构造。本章首先通过迭代一个宏开始，该宏的目的是测量函数执行所需的时间，最后通过实现一个领域特定语言，显著简化了上一章中定义的媒体上传和下载管道。\n\
  \n第 7 章，使用 Ecto 持久化数据，探讨如何与数据库协作。它首先解释如何将应用连接到数据库以及如何将数据库结构更改作为迁移应用。然后它研究如何创建和强制执行表关系以及如何使用更改集持久化和更新数据。最后，分析了查询数据库的不同方式。\n\
  \n\n\n第8章，Phoenix：一个飞行的 Web 框架，介绍了 Phoenix 框架并解释了如何使用它为我们的 ElixirDrip 应用添加 Web 层。本章首先介绍常规主题，如路由器、控制器和视图，但在结尾部分也探讨了更先进的概念，如构建\
  \ JSON API 或使用 Phoenix Channels。\n\n第9章，通过测试寻找禅意，深入探讨了不同类型的测试。它从单元测试和集成测试开始，然后继续探索更复杂的话题，例如如何测试宏和\
  \ Phoenix 组件，以及如何编写属性测试。\n\n第10章，在云端部署，将 ElixirDrip 应用运行到其生产环境中，存储来自真实用户的媒体。本章首先解释如何使用\
  \ Distillery 以高效的方式打包应用程序，然后介绍应用程序容器化的概念以及它如何适用于我们应用程序的开发和部署阶段。本章后半部分探讨了如何将应用程序部署到\
  \ Kubernetes 集群中，并最终如何通过使用持续集成服务来自动化此过程。\n\n第11章，关注你的进程，教你如何监控应用程序以确保其按预期工作。你将首先学习如何从应用程序中收集指标。然后，我们将教你如何使用一个名为\
  \ Observer 的 Erlang 工具，它允许我们深入了解 BEAM 虚拟机内部正在发生的事情。你将学习如何从 BEAM（例如 CPU 和内存利用率）以及应用程序内部每个进程的状态获取统计信息。最后，我们将研究如何检查应用程序并查看其内部运行情况。你将学习如何通过分析\
  \ ElixirDrip 应用程序来调查瓶颈，同时还检查如何使用 Erlang 的标准库来跟踪对某个进程的调用。\n\n## 如何充分利用本书\n\n如前所述，阅读本书不需要任何\
  \ Elixir 方面的先验知识。在最初的章节中，我们提供了 Elixir 的介绍，涵盖了所有必要的概念，以便能够跟上本书后面探讨的更高级主题。\n\n为了充分利用本书，我们建议你在阅读每一章时跟随操作，通过构建和运行我们将在本书中开发的应用程序来学习。构建此应用程序时，我们尽可能使用了免费和开源软件。当这不可行时，我们使用了试用期较长的软件，以便你能够自行构建和运行应用程序。\n\
  \n## 下载示例代码文件\n\n你可以从 `www.packtpub.com` 上的账户下载本书的示例代码文件。如果你是在其他地方购买本书，可以访问 `www.packtpub.com/support`\
  \ 并注册以便将文件直接发送到你的邮箱。\n\n你可以按照以下步骤下载代码文件：\n\n- 1. 在 `www.packtpub.com` 登录或注册。\n-\
  \ 2. 选择 **SUPPORT** 选项卡。\n- 3. 点击 **Code Downloads & Errata**。\n- 4. 在 **Search**\
  \ 框中输入书名并按照屏幕上的说明操作。\n\n下载文件后，请确保使用最新版本的以下工具解压或提取文件夹：\n\n- 适用于 Windows 的 WinRAR/7-Zip\n\
  - 适用于 Mac 的 Zipeg/iZip/UnRarX\n- 适用于 Linux 的 7-Zip/PeaZip\n\n本书的代码包也在 GitHub 上托管，地址为\
  \ `https://github.com/PacktPublishing/Mastering-Elixir`。如果代码有更新，将会在现有的 GitHub 仓库中更新。\n\
  \n我们还有其他丰富的书籍和视频目录中的代码包可在 `https://github.com/PacktPublishing/` 获取。快去看看吧！\n\n##\
