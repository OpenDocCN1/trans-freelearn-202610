  \ 应用的顶级用户？\n\n## 使用聚合查找顶级用户\n\n在当前的 ElixirDrip 应用中，有四个用户，jose、xpto、daniel 和 andre：\n\
  \n```\niex> Repo.all(from u in User, select: map(u, [:id, :username, :email]))\n\
  \n10:48:41.609 [debug] QUERY OK source=\"users\" db=7.4ms queue=0.1ms\nSELECT u0.\"\
  id\", u0.\"username\", u0.\"email\" FROM \"users\" AS u0 []\n[\n%{email: \"jose@hey.ho\"\
  , id: \"13KvtrMQ9uRB8MqkJpKSSQZxnBa\", username:\n\"jose\"},\n%{email: \"xp@to.foo\"\
  , id: \"13ix90kpmblgJF4Fu1762gqb6m2\", username:\n\"xpto\"},\n%{email: \"daniel@right.here\"\
  , id: \"13ucVBdFw40QqbYjwm65jEm17P9\", username: \"daniel\"},\n%{email: \"andre@somewhere.com\"\
  , id: \"13ucZ46LTdsfvezCPviNJ96gYqu\", username: \"andre\"}\n]\n```\n\n注意我们如何使用\
  \ Query.API.map/2 函数为 Ecto 选择结果到一个仅包含 id、username 和 email 字段的 map 中，而不是手动定义 map\
  \ 如 %{id: u.id, ...}。我们本可以把查询定义为 from User, select: [:id, :username, :email]，但这样会得到一个\
  \ User schema 的列表，每个 schema 只有这三个字段被填充。\n\n由于我们为每个 Media 存储上传用户的 ID（media.user_id\
  \ 字段），因此我们只需查看此 schema 即可统计每个用户的[content]\n```\n%ElixirDrip.Storage.Owner{\n  __meta__:\
  \ #Ecto.Schema.Metadata<:loaded, \"users\">,\n  email: \"jose@hey.ho\",\n  files:\
  \ [\n    %ElixirDrip.Storage.Media{\n      file_name: \"proper_name.txt\",\n   \
  \   # ...\n    },\n  ]\n}\n```\n\n在下一节中，我们将学习如何在执行移动或重命名操作之前验证文件是否已存在。\n\n## 使用原始\
  \ SQL 进行查询\n\nmove/3 和 rename/3 这两个函数都依赖于私有的 _move/4 函数，该函数能够同时更改媒体文件的完整路径和文件名：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/storage.ex\ndefmodule ElixirDrip.Storage\
  \ do\n  # ...\n  def move(user_id, media_id, new_path),\n    do: _move(user_id,\
  \ media_id, new_path, nil)\n\n  def rename(user_id, media_id, new_name),\n    do:\
  \ _move(user_id, media_id, nil, new_name)\n\n  defp _move(user_id, media_id, new_path,\
  \ new_name), do: ...\n  # ...\nend\n```\n\n这个 _move/4 函数仅允许媒体文件的创建者更改其文件夹或文件名。然后，它获取媒体文件、新路径和文件名，并检查新路径上是否存在具有新名称的文件。如果一切顺利，它将创建\
  \ changeset，验证新的 full_path 和 file_name 字段，并更新 Media schema：\n\n```elixir\ndefp _move(user_id,\
  \ media_id, new_path, new_name) do\n  with {:ok, :creator} <- is_creator?(user_id,\
  \ media_id),\n    %Media{} = media <- get_media(media_id),\n    new_path <- new_path(media,\
  \ new_path),\n    new_name <- new_name(media, new_name),\n    {:ok, :nonexistent}\
  \ <- media_already_exists?(user_id, new_path, new_name)\n  do\n    media\n    |>\
  \ Changeset.cast(%{full_path: new_path, file_name: new_name},\n[:full_path, :file_name])\n\
  \    |> Media.validate_field(:full_path)\n    |> Media.validate_field(:file_name)\n\
  \    |> Repo.update()\n  else\n    error -> error\n  end\nend\n```\n\n我们现在将分析 media_already_exists?/3\
  \ 函数的工作原理。这里的思路是利用 user_media_query/1 函数并搜索具有给定 full_path 和 file_name 的媒体文件。\n\n\
  我们可以通过 Repo.all/1 运行此查询，如果有一行或多行，我们就知道具有给定 full_path 和 file_name 的文件已存在。然而，这种方法效率非常低，因为在我们的情况下，数据库一旦找到一个结果就可以停止查询。\n\
  \n我们在这里想要的是对我们构建的查询应用 SQL EXISTS 运算符。这样，只要有一个匹配条件的行，数据库就足以返回预期结果。\n\n为此，我们将使用 Repo.to_sql/2\
  \ 函数获取原始 SQL 查询，然后将 resulting 查询字符串包装在 SELECT TRUE WHERE EXISTS (...) SQL 语句中。我们得到的元组中的\
  \ vars 元素包含我们在查询中插值的 values 列表，即我们正在搜索的 user_id、full_path 和 file_name：\n\n```elixir\n\
  def media_already_exists?(user_id, full_path, file_name) do\n  user_media = user_media_query(user_id)\n\
  \n  query = from [_mo, m] in user_media,\n  where: m.full_path == ^full_path,\n\
  \  where: m.file_name == ^file_name\n\n  {query, vars} = Repo.to_sql(:all, query)\n\
  \  query = \"SELECT TRUE WHERE EXISTS (#{query})\"\n\n  Repo.query!(query, vars).rows\n\
  \  |> Enum.empty?()\n  |> case do\n  true -> {:ok, :nonexistent}\n  _ -> {:error,\
  \ :already_exists}\n  end\nend\n```\n\n然后我们将得到的 SQL 查询字符串和 vars 传递给 Repo.query!\
  \ /2 函数，以便最终从数据库获取结果。查询只有在子查询产生任何行时才返回 TRUE，因此我们检查 rows 字段是否为空以返回结果元组。\n\n正如你在这里看到的，Repo.query!\
  \ /2 返回一个 Postgrex.Result 结构体，其中除了其他字段外，还包含我们使用的 rows 字段。rows 字段由列表的列表组成，对应于从数据库获取的每一行：\n\
  \n```\niex> Repo.query!(\"SELECT * FROM users\", [])\n06:46:24.907 [debug] QUERY\
  \ OK db=11.9ms\nSELECT * FROM users []\n%Postgrex.Result{\n  columns: [\"id\", \"\
  username\", \"hashed_password\", \"inserted_at\",\n    \"updated_at\", \"email\"\
  ],\n  command: :select,\n  connection_id: 15974,\n  num_rows: 4,\n  rows: [\n  \
  \  [\n      \"13KvtrMQ9uRB8MqkJpKSSQZxnBa\",\n      # ...\n    ],\n    # ...\n \
  \ ]\n}\n```\n\n在这种情况下，我们没有使用 fragment，因为我们需要注入一个完整的子查询而不是更简单的 Ecto 表达式（Ecto 仅允许在\
  \ from 和 join 子句中使用子查询）。我们现在能够有效地检测是否存在具有特定路径和名称的媒体。\n\n在下一节中，我们将回答问题：谁是我们的 ElixirDrip\
  \ 应用的顶级用户？\n\n## 使用聚合查找顶级用户\n\n在当前的 ElixirDrip 应用中，有四个用户，jose、xpto、daniel 和 andre：\n\
  \n```\niex> Repo.all(from u in User, select: map(u, [:id, :username, :email]))\n\
  \n10:48:41.609 [debug] QUERY OK source=\"users\" db=7.4ms queue=0.1ms\nSELECT u0.\"\
  id\", u0.\"username\", u0.\"email\" FROM \"users\" AS u0 []\n[\n%{email: \"jose@hey.ho\"\
  , id: \"13KvtrMQ9uRB8MqkJpKSSQZxnBa\", username:\n\"jose\"},\n%{email: \"xp@to.foo\"\
  , id: \"13ix90kpmblgJF4Fu1762gqb6m2\", username:\n\"xpto\"},\n%{email: \"daniel@right.here\"\
  , id: \"13ucVBdFw40QqbYjwm65jEm17P9\", username: \"daniel\"},\n%{email: \"andre@somewhere.com\"\
  , id: \"13ucZ46LTdsfvezCPviNJ96gYqu\", username: \"andre\"}\n]\n```\n\n注意我们如何使用\
  \ Query.API.map/2 函数为 Ecto 选择结果到一个仅包含 id、username 和 email 字段的 map 中，而不是手动定义 map\
  \ 如 %{id: u.id, ...}。我们本可以把查询定义为 from User, select: [:id, :username, :email]，但这样会得到一个\
  \ User schema 的列表，每个 schema 只有这三个字段被填充。\n\n由于我们为每个 Media 存储上传用户的 ID（media.user_id\
  \ 字段），因此我们只需查看此 schema 即可统计每个用户的\n\n以下查询按上传文件数量以降序排列结果。如你所见，它只是在 schemaless_users_media\
  \ 查询中添加了 order_by 子句：\n\n```\niex> schemaless_ordered_users_media = from [u,m] in\
  \ schemaless_users_media,\n...> order_by: [desc: 1]\n```\n\n```\n#Ecto.Query<from\
  \ u in \"users\", left_join: s in \"storage_media\",\n on: u.id == s.user_id, group_by:\
  \ [u.id], order_by: [desc: 1],\n select: %{media_count: count(s.id), disk_usage:\
  \ sum(s.file_size),\n username: u.username}>\n```\n\n```\niex> Repo.all(schemaless_ordered_users_media)\n\
  ```\n\n```\n13:54:24.179 [debug] QUERY OK source=\"users\" db=1.5ms queue=0.1ms\n\
  SELECT count(s1.\"id\"), sum(s1.\"file_size\"), u0.\"username\" FROM \"users\" AS\
  \ u0 LEFT OUTER JOIN \"storage_media\" AS s1 ON u0.\"id\" = s1.\"user_id\" GROUP\
  \ BY u0.\"id\" ORDER BY 1 DESC []\n```\n\n```\n[\n %{disk_usage: 103, media_count:\
  \ 8, username: \"jose\"},\n %{disk_usage: 161, media_count: 7, username: \"andre\"\
  },\n %{disk_usage: 25, media_count: 1, username: \"xpto\"},\n %{disk_usage: nil,\
  \ media_count: 0, username: \"daniel\"}\n]\n```\n\nEcto 按文件数量降序排列结果，因为我们向 order_by/2\
  \ 宏传递了 [desc: 1] 关键字列表。1 表示我们希望按查询的第一个列排序——在我们的例子中，是包含计数结果的数据库列。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_341_0.png)\n\
  \n尽管 media_count 条目在查询结果的每个映射中都作为第二个条目出现（即 [%{disk_usage: 103, media_count: 8, username:\
  \ \"jose\"}, ...]），文件计数出现在查询的第一列（即 SELECT count(s1.\"id\"), sum(s1.\"file_size\"\
  ), u0.\"username\" ...），因此 desc: 1 排序条件指向结果的第一列。\n\n尽管排序符合预期，但指定列号并不直观，并且依赖于列顺序。让我们将之前的查询用作子查询，并看看如何动态定义排序列和方向，而不必依赖任意整数：\n\
  \n```\niex> sort_order = :desc\n:desc\n```\n\n```\niex> dynamic_order_schemaless_users_media\
  \ = from e in subquery(schemaless_users_media),\n...> order_by: [^sort_order, e.media_count}]\n\
  ```\n\n```\n#Ecto.Query<from u in subquery(from u in \"users\",\n    left_join:\
  \ s in \"storage_media\",\n    on: u.id == s.user_id,\n    group_by: [u.id],\n \
  \   select: %{media_count: count(s.id), disk_usage: sum(s.file_size),\n    username:\
  \ u.username}),\n    order_by: [desc: u.media_count]>\n\niex> Repo.all(dynamic_order_schemaless_users_media)\n\
  14:11:59.452 [debug] QUERY OK db=1.8ms queue=0.2ms\nSELECT s0.\"media_count\", s0.\"\
  disk_usage\", s0.\"username\" FROM (SELECT\ncount(s1.\"id\") AS \"media_count\"\
  , sum(s1.\"file_size\") AS \"disk_usage\",\nu0.\"username\" AS \"username\" FROM\
  \ \"users\" AS u0 LEFT OUTER JOIN\n\"storage_media\" AS s1 ON u0.\"id\" = s1.\"\
  user_id\" GROUP BY u0.\"id\") AS s0\nORDER BY s0.\"media_count\" DESC []\n[\n  %{disk_usage:\
  \ 103, media_count: 8, username: \"jose\"},\n  %{disk_usage: 161, media_count: 7,\
  \ username: \"andre\"},\n  %{disk_usage: 25, media_count: 1, username: \"xpto\"\
  },\n  %{disk_usage: nil, media_count: 0, username: \"daniel\"}\n]\n```\n\n由于 `order_by`\
  \ 子句期望一个关键字列表，我们将 `sort_order` 值作为 `{^sort_order, e.media_count}` 元组的第一个元素注入，将其转换为\
  \ `:asc` 或 `:desc` 键。我们还可以指向 `schemaless_users_media` 查询的 `media_count` 字段，而不是依赖列号，因为我们现在将其用作\
  \ `subquery`。\n\n此查询的最后一次迭代也将允许动态设置排序字段。为此，我们需要使用 `Query.API.field/2` 函数，该函数允许我们动态访问结构体字段：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/storage.ex\ndefmodule ElixirDrip.Storage\
  \ do\n  # ...\n  def get_top_users_by_usage(sort_field \\\\ :media_count, sort_order\
  \ \\\\\n:desc, top \\\\ 10) do\n    schemaless_users_media = from u in \"users\"\
  ,\n      # same query we previously defined ...\n\n    dynamic_schemaless_users_media\
  \ = from e in subquery\n      (schemaless_users_media),\n      order_by: [{^sort_order,\
  \ field(e, ^sort_field)}],\n      limit: ^top\n\n    Repo.all(dynamic_schemaless_users_media)\n\
  \  end\n```\n\n```\nend\n```\n\n通过将 top 变量传递给 limit/2 子句，之前的 get_top_users_by_usage/3\
  \ 函数限制了数据库返回的结果。实际上，这设置了我们在 ElixirDrip 排行榜上想要的最大用户数：\n\n```\niex> Storage.get_top_users_by_usage(:media_count,\
  \ :desc, 2)\n15:14:21.644 [debug] QUERY OK db=3.3ms queue=0.1ms\nSELECT s0.\"media_count\"\
  , s0.\"disk_usage\", s0.\"username\" FROM (SELECT count(s1.\"id\") AS \"media_count\"\
  , sum(s1.\"file_size\") AS \"disk_usage\", u0.\"username\" AS \"username\" FROM\
  \ \"users\" AS u0 LEFT OUTER JOIN \"storage_media\" AS s1 ON u0.\"id\" = s1.\"user_id\"\
  \ GROUP BY u0.\"id\") AS s0 ORDER BY s0.\"media_count\" DESC LIMIT $1 [2]\n[\n \
  \ %{disk_usage: 103, media_count: 8, username: \"jose\"},\n  %{disk_usage: 161,\
  \ media_count: 7, username: \"andre\"}\n]\n```\n\n要计算简单的聚合，你也可以依赖 Repo.aggregate/3\
  \ 回调。它接收一个可查询对象、聚合操作和字段，并计算给定的聚合：\n\n```\niex> Repo.aggregate(Media, :avg, :file_size)\n\
  15:24:44.901 [debug] QUERY OK source=\"storage_media\" db=1.6ms\nSELECT avg(s0.\"\
  file_size\") FROM \"storage_media\" AS s0 []\n#Decimal<18.062500000000000>\n```\n\
  \n前面的示例告诉我们，本地 ElixirDrip 实例中的平均文件大小为 18 字节。假设我们现在想要计算每个用户的平均文件数。由于我们仍然可以访问 schemaless_users_media\
  \ 查询，如果我们能直接将其传递给 Repo.aggregate(:avg, :media_count) 函数就好了。然而，当我们这样做时，我们会收到一个错误，提示\
  \ Ecto 不允许我们对已经包含 group_by 子句的查询进行聚合：\n\n```\niex> schemaless_users_media |> Repo.aggregate(:avg,\
  \ :media_count)\n** (Ecto.QueryError) cannot aggregate on query with group_by in\
  \ query:\n# ...\n```\n\n如果我们考虑到 Ecto 依赖可用的 SQL 函数来计算聚合，这完全合理。毕竟，在标准 SQL 中，包含多个 GROUP\
  \ BY 子句的查询是不合法的。因此，我们将 schemaless_users_media 包装在 subquery/2 中，从而修复 Repo.aggregate/3\
  \ 调用。通过使用 subquery，最外层的查询最终不再包含任何 GROUP BY 子句，从而允许 Repo.aggregate/3 添加自己的 GROUP\
  \ BY 子句：\n\n```\niex> subquery(schemaless_users_media) |> Repo.aggregate(:avg, :media_count)\n\
  15:40:50.854 [debug] QUERY OK db=4.5ms queue=0.1ms\nSELECT avg(s0.\"media_count\"\
  ) FROM (SELECT count(s1.\"id\") AS \"media_count\", sum(s1.\"file_size\") AS \"\
  disk_usage\", u0.\"username\" AS \"username\" FROM \"users\" AS u0 LEFT OUTER JOIN\
  \ \"storage_media\" AS s1 ON u0.\"id\" = s1.\"user_id\" GROUP BY u0.\"id\") AS s0\
  \ []\n#Decimal<4.0000000000000000>\n```\n\n我们现在知道，每个用户在 ElixirDrip 中平均存储四个文件。\n\n\
  正如本节所示，Ecto 为我们提供了一些出色的查询工具，提供了大量的功能和灵活性。你可以依赖已定义的模式来查询数据，也可以直接与数据库表交互并手动挑选要检索的字段。如果\
  \ Ecto 没有为你需要的特定 SQL 函数提供抽象，你可以直接从查询中调用 SQL 函数，无需任何问题。\n\n值得注意的是，我们完全不依赖于 Ecto 模式。对于计算聚合和/或跨越多个表的查询，采用无模式通常是最简单的解决方案，并且可以避免尝试将查询输出适配到你可能已有的现有模式的痛苦。\n\
  \n## Summary\n\n在本章中，我们不仅了解了 Ecto 是什么，还将它的四个主要概念——Repository、Schemas、Changesets\
  \ 和 Queries——应用到了我们的 ElixirDrip 伞形项目中：\n\n- 我们配置了应用程序仓库，以便能够（在 Ecto 适配器和数据库驱动程序的帮助下）连接到我们的\
  \ PostgreSQL 数据库\n- 我们定义了代表数据库表的模式\n- 我们学习了如何使用 changesets 来验证对数据库中存储的信息所做的更改\n\n\
  \n\n\n- 我们以多种不同的方式查询数据，从无模式查询到聚合查询，使用 Ecto 抽象的 SQL 函数以及其他需要通过 Ecto fragments 运行的函数\n\
  \n在这次旅程中，我们引入并随后运行了迁移，这些迁移使我们能够通过创建所需的表和约束来塑造数据库的结构。其中这些更改包括塑造 ElixirDrip schemas\
  \ 之间关系的 外键约束。我们在用户和媒体之间实现了一个多对多关系，使用了一个中间 schema，该 schema 还说明了如何一对多关系工作。\n\n作为 Ecto\
  \ 灵活性的证明，我们定义了多个由同一个 `users` 数据库表支持的 schema，以便在 `Accounts` 和 `Storage` 上下文中处理用户。这种可能性有助于开发者避免所谓的\
  \ *fat model* 反模式，并且与其它常见的数据库映射器形成对比，后者倾向于在每个数据库表和相应的代码表示之间进行一对一映射。\n\n在下一章中，你将看到所有这些后端工作被\
  \ Phoenix – 一个 Elixir Web 框架 精彩地呈现出来。\n"
- "# 8 Phoenix – A Flying Web Framework\n\n在了解了 Ecto 以及如何使用它为我们的应用程序添加持久层之后，我们现在将深入研究\
  \ Phoenix，即 Elixir 中最流行的 Web 框架。Phoenix 通常被描述为一个富有成效、可靠且快速的框架。\n\n**Productive**\
  \ 因为它尽可能地移除了样板代码，同时不会影响 Elixir 社区珍视的显式性。这样，你可以快速前进并利用 Phoenix 提供的宏和抽象，而无需降低应用程序的可维护性。此外，Phoenix\
  \ 非常适合构建交互式应用程序，因为它提供了 channels——客户端与服务器之间的永久连接。与传统的请求-响应模型绑定不同，你可以使用 channels 与客户端保持有状态的对话，这从根本上改变了构建交互式应用程序的方式。在本章的后半部分，我们将向我们的应用程序添加\
  \ channels，这将展示 Phoenix 为交互式应用程序带来的生产力提升。\n\n**Reliable** 因为它建立在经过实战检验的技术之上，例如 Erlang/OTP，该技术以在世界上一些最可靠的应用程序中使用而闻名。这是在任何应用程序中，无论应用程序类型或行业如何，都最重要的因素之一：我们总是希望最大化正常运行时间。这正是\
  \ Phoenix 展翅高飞的地方，使其与大多数 Web 框架区别开来。通过利用 Erlang 运行时的特性，Phoenix 中的请求彼此完全隔离，因为它们在单独的进程中处理。由于进程之间没有任何共享，等待数据库的长时间运行的请求不会减慢不与数据库通信的其他更简单的请求，从而最大化系统的整体吞吐量。此外，Phoenix\
  \ 使用 supervisors 和 supervision trees 来创建自愈组件，正如我们在 *Chapter 3, Processes – The Bedrock\
  \ for Concurrency and Fault-Tolerance.* 中所看到的那样。\n\n**Fast** 因为它优化了请求-响应流程中最关键的部分，例如路由请求或渲染响应。此外，由于每个请求都在单独的进程中处理，它们将并发运行并利用所有可用的\
  \ CPU 内核。Phoenix 以在某些情况下响应时间以微秒计而闻名。在本章中我们将指出一些使 Phoenix 具有如此惊人性能的方面。\n\n到上一章结束时，我们应用程序的核心已经完全构建。从现在开始，ElixirDrip\
  \ 内部的业务逻辑将不会改变。本章的目的是为我们的应用程序添加一个表示层，特别是使用 Phoenix 框架的 Web 层。\n\n这可能看起来是一个小细节，但在\
  \ Elixir 社区中经常被讨论，一般认为应该在你的领域逻辑和表示层之间有清晰的分离。例如，如果除了 Web 界面之外，你还想要应用程序的 **Command\
  \ Line Interface (CLI)**，你就不应该需要更改你的应用程序。CLI 呈现器只需调用应用程序公开的 API，并转换数据以不同的方式呈现它。Phoenix\
  \ *不是* 你的应用程序，而是一个用于为其添加 Web 表示层的框架。\n\n这就是为什么在 `Chapter 2, Innards of an Elixir\
  \ Project` 中，我们将 Phoenix 分离到一个名为 `elixir_drip_web` 的不同 umbrella 应用程序中。我们划清了一条清晰的界线，区分了应用程序的核心是什么以及与如何呈现它相关的内容。在这种分离到位后，`elixir_drip_web`\
  \ 应用程序将只调用 `elixir_drip` 应用程序的公共 API 的函数。\n\n即使我们没有在 umbrella 下拆分应用程序，Phoenix 也鼓励在单个应用程序内部分离关注点。尽管\
  \ Phoenix 是一个传统的 MVC Web 框架，但 *model* 这个词在 Phoenix 社区中几乎不被使用，并且从 Phoenix 1.3 开始，生成器将不再创建\
  \ `models/` 目录。其理由是应用程序域内的所有内容都是模型，而在 `models/` 目录内有一堆文件并不能传达任何意义。相反，Phoenix 鼓励你有意地设计并围绕上下文创建模型，借鉴了领域驱动设计方法的一些概念。上一章中展示了一个例子，其中\
  \ `user` 模型位于 `accounts` 上下文中，并且应用程序的其余部分始终通过此 `accounts` 上下文与 `user` 交互。然而请注意，在不同的上下文中可能还有另一个\
  \ `user` 模型，它可能具有不同的 schema，适应其所在的上下文。通过这种方法，我们只需查看目录结构，而无需阅读任何源代码，就能对我们正在探索的应用程序获得很多见解。这也告诉我们每个模型与我们应用程序的域的相关性，而不仅仅是反映底层数据库结构，就像\
  \ `models/` 目录的情况一样。\n\n在深入研究 Phoenix 之前，我们将先看看 Plug，即 Phoenix 建立其上的底层库。\n\n本章将涵盖以下内容：\n\
  - Plug 规范\n- 路由请求\n- 在控制器中处理请求\n- 渲染视图\n- 用户认证\n- 实现 JSON API\n- 使用 channels 构建交互式应用程序\n\
  \n### The Plug specification\n\nPlug 是 Phoenix 的一个非常核心的组件，正如文档中所说，*lives at the\
  \ heart of Phoenix’s HTTP layer*。Plug 规范允许我们在 Web 应用程序中组合模块，抽象出连接的概念。Plug 拥抱了 Elixir\
  \ 的函数式特性，并通过对连接进行一系列转换来处理 Web 请求，这些转换最终将用于渲染响应。\n\n有两种类型的 plugs：函数 plugs 和模块 plugs。无论类型如何，Plug\
  \ 的规范非常简单：一个 Plug 必须接受一个连接并返回一个（可能）被修改的连接。在本节后面，我们将探讨连接是什么。阅读这个基本描述，很难想象 Plug 是\
  \ Phoenix 的核心。然而，这个简单的概念非常强大，当你开始将 plugs 链接在一起以实现复杂的功能时就会变得明显。Phoenix 的许多强大构造，例如路由器和控制器，内部只是\
  \ plugs，这进一步证明了它们的强大。此外，Plug 也是不同 Web 服务器的连接适配器的抽象层，目前随附了 `cowboy` Web 服务器的适配器。\n\
  \n我们将在本章后面为 ElixirDrip 应用程序构建一个 plug，当我们为其添加身份验证时。现在，我们将看到如何构建模块和函数 plugs 的简单示例，以及如何将它们链接起来，以便第一个\
  \ plug 的连接转换可供第二个 plug 使用。\n\n\n\n## 创建模块插件\n\n一个模块插件必须导出两个函数：init 和 call。init 函数在编译时被调用，接收一个参数，其目的是准备将传递给\
  \ call 的选项。call 函数在运行时被调用，接收两个参数：连接和由 init 返回的选项。这个函数是我们根据需要转换连接的地方。有了 init，你就可以在编译期间完成插件的部分工作。这样，call\
  \ 可以更高效，因为它的重点仅在于处理请求。让我们看一个例子：\n\n```\n$ cat my_module_plug.ex\n\ndefmodule MyModulePlug\
  \ do\n  import Plug.Conn\n\n  def init(options), do: options\n\n  def call(conn,\
  \ _options) do\n    conn\n    |> assign(:username, \"Gabriel\")\n  end\nend\n```\n\
  \n在 init 中，我们什么也不做，只是返回传递给我们的选项。然后，在 call 函数中，我们调用 assign，由于我们在模块顶部导入了 Plug.Conn，因此在此上下文中可用。此函数将确保提供的键/值对保存在连接中，以便后续插件可以访问它。这些键/值对将在连接的\
  \ assigns 字段中可用。现在让我们看看函数插件是如何工作的，以及如何为这两个插件创建一个管道。\n\n## 创建函数插件\n\n函数插件与模块插件类似，但它们包含在函数中而不是模块中。这意味着我们不必调用\
  \ init 来安排选项。然而，函数插件接收两个参数，正如模块插件中的 call 函数一样：连接和选项。下面的函数是一个函数插件：\n\n```\ndef my_function_plug(conn,\
  \ _options) do\n  conn\n  |> put_resp_content_type(\"text/plain\")\n  |> send_resp(200,\
  \ \"Hello #{conn.assigns.username}\")\nend\n```\n\n在此函数中，我们获取连接并将其传递给 `put_resp_content_type`，它将修改连接以设置响应的内容类型。然后，我们使用此修改后的连接发送响应，将状态码设置为\
  \ 200 并返回一个简单字符串。请注意，我们将 `conn.assigns.username` 插值到此字符串中，该值之前由我们的模块插件填充。`put_resp_content_type`\
  \ 和 `send_resp` 都是从 `Plug.Conn` 导入的函数。该模块除了定义一些处理连接的便捷函数外，还定义了一个结构体 `%Plug.Conn{}`，它是我们一直在讨论的连接的表示。它将保存有关请求和响应的信息，包含诸如请求方法、请求和响应的头信息或请求参数等字段。有关此结构体中存在的所有字段的完整列表，请参阅官方文档\
  \ https://hexdocs.pm/plug/Plug.Conn.html。\n\n如何在模块插件和函数插件之间选择？如果你想在不同模块之间共享一个插件，则需要创建模块插件。如果你的插件需要对可能传递给它的选项进行大量前期准备工作，那么使用模块插件会更好，因为这样你的插件可能更高效。如果你的需求不符合上述任何条件，你可以简单地使用函数插件，它可以在任何其他模块内部创建。现在让我们看看如何将这两个插件链接在一起：\n\
  \n```\n$ cat my_plug_pipeline.ex\n\ndefmodule MyPlugPipeline do\n  use Plug.Builder\n\
  \n  plug MyModulePlug\n  plug :my_function_plug\n\n  def my_function_plug(conn,\
  \ _options) do\n    conn\n    |> put_resp_content_type(\"text/plain\")\n    |> send_resp(200,\
  \ \"Hello #{conn.assigns.username}!\")\n  end\nend\n```\n\n除了我们之前讨论的 `my_function_plug`\
  \ 函数外，此模块还包含我们的管道。`plug` 宏（由 `Plug.Builder` 导出）允许我们定义将成为管道一部分的插件。第一个是我们的模块插件 `MyModulePlug`，第二个是我们的函数插件\
  \ `my_function_plug`。如你所见，使用模块插件时我们传递模块的名称，而使用函数插件时我们提供函数名称作为原子。\n\n如果插件通过调用 `Plug.Conn.halt/1`\
  \ 函数来停止 Plug 管道，则后续插件将不再被调用。例如，如果 `MyModulePlug` 调用了 `halt/1` 函数，则 `my_function_plug`\
  \ 将不会被调用。我们将在本章后面实现身份验证时看到此示例。\n\n现在我们来试运行一下我们的管道。在 ElixirDrip 根目录下使用 `iex -S mix`\
  \ 启动一个 IEx 会话：\n\n```\niex> c(\"my_module_plug.ex\")\n[MyModulePlug]\niex> c(\"\
  my_plug_pipeline.ex\")\n[MyPlugPipeline]\niex> {:ok, _pid} = Plug.Adapters.Cowboy.http(MyPlugPipeline,\
  \ [])\n{:ok, #PID<0.481.0>}\n```\n\n编译完这两个模块后，我们启动 `cowboy` Web 服务器，将我们的 Plug 管道作为入口点传递。`cowboy`\
  \ 适配器将负责与 Web 服务器交互，创建连接，然后调用我们的 Plug 管道。`http` 的第二个参数是一组选项，对于本示例而言并不相关。服务器运行时，在浏览器中访问\
  \ `http://localhost:4000`，你将看到文本 **Hello Gabriel!**。这演示了我们的两个插件协同工作，第一个插件将信息放入连接中，第二个插件消费它。\n\
  \n我们现在已经完成了对 Plug 的巡览。如你所见，它既简单又强大，是 Phoenix 的基础。说到 Phoenix，是时候开始探索它了！我们将从了解 Phoenix\
  \ 中请求如何路由开始。\n\n## 路由请求\n\n我们现在将探索传统 HTTP 请求的流程，分析从请求到响应渲染的每个步骤。正如我们在上一节所看到的，Plug\
  \ 为 Cowboy Web 服务器提供了一个适配器，我们用它来演示我们创建的两个插件。Phoenix 也使用此适配器与 Cowboy Web 服务器交互。当请求到达服务器时，此适配器会处理它，创建一个新的\
  \ conn（一个 `%Plug.Conn{}` 结构体），并调用应用程序中配置的端点。默认情况下，端点名为 `<name_of_your_app>.Endpoint`。端点是\
  \ Web 服务器与我们应用程序代码之间的边界，因此本质上端点是请求的开始。让我们看看端点的配置：\n\n```\n$ cat apps/elixir_drip_web/config/config.exs\n\
  \nconfig :elixir_drip_web, ElixirDripWeb.Endpoint,\n```\n\n```\nurl: [host: \"localhost\"\
  ],\nsecret_key_base: \"ez09 ...9cbq\",\nrender_errors: [view: ElixirDripWeb.ErrorView,\
  \ accepts: ~w(html json)],\npubsub: [name: ElixirDripWeb.PubSub, adapter: Phoenix.PubSub.PG2]\n\
  ```\n\n这是端点的默认配置。`url` 选项配置整个应用程序的 URL 生成。在此情况下，主机名设置为 `localhost`。`secret_key_base`\
  \ 是用作生成用于加密或签名数据的密钥的基础，例如 cookie 或令牌。`render_errors` 选项配置在应用程序出现故障时调用的模块。我们将在本章后面讨论视图时进一步探讨这一点。最后，还有\
  \ `pubsub` 配置，它配置 Phoenix Channels 的 pubsub 层，我们将在本章末尾讨论它，并且我们使用此 pubsub 层来广播消息。\n\
  \n在了解了如何配置端点后，让我们看一下其模块的一个片段：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/endpoint.ex\n\
  ```\n\n```\ndefmodule ElixirDripWeb.Endpoint do\n  use Phoenix.Endpoint, otp_app:\
  \ :elixir_drip_web\n\n  # ...\n\n  plug(Plug.RequestId)\n  plug(Plug.Logger)\n\n\
  \  # ...\n\n  plug(ElixirDripWeb.Router)\nend\n```\n\n端点本身是一个插件，由插件管道组成。正如我们在本章开头所看到的，插件只是接收连接并返回（可能已修改的）连接的函数。端点管道包含执行生产\
  \ Web 服务器中典型操作的插件，例如记录请求、处理静态内容或解析参数。在之前的片段中，我们只展示了 Endpoint 中存在的一部分插件。第一个插件 `Plug.RequestId`\
  \ 负责从请求头（默认为 `x-request-id`）中获取请求 ID 或生成新的请求 ID，并将其放置在响应头中（再次以 `x-request-id` 为默认值）。第二个插件\
  \ `Plug.Logger` 负责记录每个请求。\n\n我们现在开始看到，在 Phoenix 中，处理请求是通过应用一系列函数来完成的，这些函数将转换连接，最终导致响应的创建。\n\
  \n\n\n你可以保持高效、快速推进，并直接使用默认配置，或轻松地根据自己的需求微调框架，因为这些只是可组合的小函数。例如，如果你不想在应用中记录任何请求，只需从\
  \ endpoint 中移除 plug(Plug.Logger) 行即可。这种模块化设计在长期来看非常重要，因为随着应用的演进和需求的变化，Phoenix（也借鉴自\
  \ Plug）的这种模块化设计非常重要。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_353_0.png)\n\n\
  虽然在 ElixirDripWeb 中我们只使用一个 endpoint，但一个应用运行多个 endpoint 是可能的。例如，你可以拥有一个具有不同 plug\
  \ 流水线的 endpoint，并强制执行特定的安全策略。然而这并不常见，因为你也可以通过在独立的 umbrella 应用中运行这些 endpoint 来实现这一点。\n\
  \n在之前的示例中，我们可以看到 endpoint 中的最后一个 plug 是 ElixirDripWeb.Router，它是我们的应用的路由器。现在让我们来看一下它：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/router.ex\n\ndefmodule ElixirDripWeb.Router\
  \ do\n  use ElixirDripWeb, :router\n\n  pipeline :browser do\n    plug(:accepts,\
  \ [\"html\"])\n    plug(:fetch_session)\n    plug(:fetch_flash)\n    plug(:protect_from_forgery)\n\
  \    plug(:put_secure_browser_headers)\n  end\n\n  pipe_through(:browser)\n\n  get(\"\
  /files\", ElixirDripWeb.FileController, :index)\n  get(\"/files/:id\", ElixirDripWeb.FileController,\
  \ :show)\n  get(\"/files/new\", ElixirDripWeb.FileController, :new)\n  post(\"/files\"\
  , ElixirDripWeb.FileController, :create)\n\n  get(\"/\", PageController, :index)\n\
  end\n```\n\n模块内部的第一行是 use ElixirDripWeb, :router。这行代码会运行 ElixirDripWeb 模块中的 router\
  \ 函数，该函数位于 apps/elixir_drip_web/lib/elixir_drip_web.ex。该函数会调用 use Phoenix.Router\
  \ 并导入一些模块，例如 Plug.Conn。相同的策略也适用于控制器、视图和通道。\n\n你可以编辑此文件，但要小心——例如，对 controller 函数所做的更改将应用于应用中的每个控制器。\n\
  \n如我们所见，我们的路由器有一个名为 :browser 的流水线。在讨论流水线之前，让我们先讨论路由器最重要的部分——路由。我们的第一个路由是：\n\n```\n\
  get(\"/files\", ElixirDripWeb.FileController, :index)\n```\n\n该路由由 get 创建，它是对应 HTTP\
  \ 动词 GET 的 Phoenix 宏。每个 HTTP 动词都有一个 Phoenix 宏，其名称始终对应该动词。传递给此宏的第一个参数是我们想要匹配的路径，而第二个和第三个参数则是将处理此请求的控制器及其内部的\
  \ action。当 get 宏被展开时，它会为 Phoenix.Router.match/5 函数生成一个子句。在我们的示例中，该子句为：\n\n```\n\
  def match(:get, \"/files\", ElixirDripWeb.FileController, :index, [])\n```\n\n对于其他\
  \ HTTP 动词对应的宏也会发生同样的情况。在本章开头，我们提到 Phoenix 令人难以置信的性能之一原因是它优化了传统请求-响应流程的核心部分。这里我们看到了这一点的第一个证据。虽然路由器看起来非常简洁易读，但在表面之下它由模式匹配驱动，特别是\
  \ Phoenix.Router.match/5 函数。这使得我们的路由层性能非常出色，因为模式匹配可以由 Erlang VM 进一步优化。\n\n现在让我们查看所有与\
  \ \"/files\" 路径相关的路由：\n\n```\nget(\"/files\", ElixirDripWeb.FileController, :index)\n\
  get(\"/files/:id\", ElixirDripWeb.FileController, :show)\nget(\"/files/new\", ElixirDripWeb.FileController,\
  \ :new)\npost(\"/files\", ElixirDripWeb.FileController, :create)\n```\n\n这种模式在 Phoenix\
  \ 应用中如此常见，以至于它提供了一个 resources 宏，允许我们用一行代码表达这四个路由：\n\n```\nresources(\"/files\",\
  \ ElixirDripWeb.FileController, only: [:index, :show, :new, :create])\n```\n\n默认情况下，resources\
  \ 宏会为八个 HTTP 动词生成路由，包括 PATCH 和 PUT。由于在该应用中我们并不需要全部，因此我们传递 only 选项，以便它仅为这些 action\
  \ 生成路由。我们也可以改用 except 选项，其作用相反。resources 宏也可以嵌套在其他 resources 宏内部。\n\n这将根据资源的层级关系生成嵌套路由。我们不会在\
  \ ElixirDrip 应用中探索此选项，但在构建更复杂的系统时这可能会很有用。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_355_0.png)\n\
  \nPhoenix 创建了一个名为 `mix phx.routes` 的 mix 任务，可让你查看应用的路由。此任务在构建应用的路由层时非常有帮助，因为它允许你查看存在的路由并调试潜在问题。\n\
  \n现在让我们查看路由器中的 `:browser` 流水线：\n\n```\npipeline :browser do\n  plug(:accepts, [\"\
  html\"])\n  plug(:fetch_session)\n  plug(:fetch_flash)\n  plug(:protect_from_forgery)\n\
  \  plug(:put_secure_browser_headers)\nend\n```\n\n流水线与 endpoint 类似，是一组 plug 的列表。这些\
  \ plug 会按顺序调用，除非其中一个终止了流水线。顾名思义，此流水线用于浏览器发出的请求。第一个 plug 会尊重 Accept 头，定义被接受的请求格式。然后，`fetch_session`\
  \ plug 会获取会话并将其添加到连接中。接下来的 plug `fetch_flash` 会获取在当前请求时可能存在的任何 flash 消息。然后，我们有两个与安全相关的\
  \ plug，它们保护表单提交免受诸如跨站请求伪造（CSRF）等攻击。\n\n`pipe_through` 函数配置对某个路由将调用哪些流水线。鉴于目前我们在路由器的根级别仅有\
  \ `pipe_through(:browser)`，`:browser` 流水线将在匹配任何路由时都被调用。目前我们不需要引入 scopes，因为我们只提供浏览器请求。当我们在本章后面构建\
  \ JSON API 时，你会看到路由器被更新以使用 scopes，这将允许我们根据请求的路径运行不同的流水线。请注意，Phoenix 生成器会创建一个 scope（用于根路径\
  \ \"/\"）并将 `pipe_through` 放在该 scope 内。目前我们简化并移除了该 scope，因为现在不需要——我们会在应用中需要时再讨论 scopes。\n\
  \n在进入控制器之前，让我们快速回顾一下请求的流程：\n\n- endpoint 从适配器接收请求并调用其流水线中的 plug，路由器是最后一个\n- 路由器会尝试为请求的路径找到一个路由\n\
  - 一旦找到，它会保存控制器模块的名称以及将在其上调用的 action\n- 在调用控制器之前，路由器会运行 `pipe_through` 调用中定义的 Plug\
  \ 流水线（如果有）\n- 在执行流水线中的所有 plug 之后，路由器会调用控制器上的 action，两者均在路由中配置\n\n到此为止，路由器的任务已完成。现在让我们看看控制器内部发生了什么。\n\
  \n## 在控制器中处理请求\n\n此时，请求已进入控制器，该控制器是根据我们描述的逻辑由路由器调用的。我们将构建在路由器中看到的 FileController，并逐步介绍我们为其创建了路由的四个\
  \ action：index、show、new 和 create。让我们从 index action 开始：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/controllers/file_controller.ex\n\
  ```\n\n```\ndefmodule ElixirDripWeb.FileController do\n  use ElixirDripWeb, :controller\n\
  \n  alias ElixirDrip.Storage\n\n  def index(conn, %{\"path\" => path}) do\n    with\
  \ {:ok, media} <- Storage.media_by_folder(\"hardcoded_user_id\", path) do\n    \
  \  render(conn, \"index.html\", files: media.files, folders: media.folders, current_path:\
  \ path)\n    else\n      {:error, :invalid_path} ->\n        conn\n        |> put_flash(:error,\
  \ \"The path provided is invalid.\")\n        |> redirect(to: file_path(conn, :index,\
  \ \"path\": \"$\"))\n      _ ->\n        conn\n        |> put_flash(:error, \"Unexpected\
  \ error.\")\n        |> redirect(to: file_path(conn, :index, \"path\": \"$\"))\n\
  \    end\n  end\nend\n```\n\n```\ndef index(conn, _params), do: redirect(conn, to:\
  \ file_path(conn,\n:index, \"path\": \"$\"))\nend\n```\n\n与路由器中发生的情况类似，use 宏会引入并导入控制器正常工作所需的模块。控制器的函数接收两个参数：第一个是连接，第二个是参数。我们的\
  \ index 函数在 action 为 index 时被调用，这意味着我们将列出特定路径下的文件和文件夹。我们为 index 函数提供了两个子句。第一个中，我们对参数进行模式匹配以获取\
  \ \"path\" 键并将其值保存到 path 变量中。path 是一个查询参数，包含用户想要查看的文件夹路径。当该键存在时，我们调用位于 elixir_drip\
  \ umbrella 应用中的 Storage.media_by_folder/2 函数。这个例子展示了将 ElixirDrip 应用拆分为两个 umbrella\
  \ 应用的一个优势。如你所见，我们的表现层非常精简，只调用核心应用的公共 API 中的函数。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_357_0.png)\n\
  \n如第一个 index 函数子句所示，参数映射使用字符串键。这是有意为之的，因为我们不能安全地将外部数据转换为原子，否则可能会超过 Erlang VM 对原子数量的限制，导致\
  \ VM 崩溃。在应用的边界处，我们可以以受控的方式将这些字符串转换为原子，然后在整个应用中使用原子键。\n\n目前，我们使用硬编码的用户 ID 调用此函数，因为我们还没有让用户登录应用的方式。我们将沿着这条路径继续，让\
  \ Storage 模块的函数在提供此 ID 时返回一个静态的文件夹和文件列表。我们将对该函数的调用包装在 with 块中，以便对其返回值进行模式匹配。当调用成功时，我们调用\
  \ Phoenix.Controller.render/3 函数。该函数的第一个参数是连接，第二个是想要渲染的模板名称，第三个是一个关键字列表，通常称为 assigns，将传递给视图。在下一节中，我们将看到它们在视图和模板中的使用方式。render\
  \ 函数的第二个参数 \"index.html\" 在本例中并非必需。如果未提供，Phoenix 将使用 action 的名称和请求的格式来查找要渲染的模板。由于本例遵循约定，我们可以直接省略它。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_358_0.png)\n\n虽然本章中我们只使用 `render` 函数来生成响应，但渲染响应还有其他可能性。我们可以使用\
  \ `text/2` 发送文本响应，使用 `json/2` 发送 JSON 响应，或使用 `html/2` 发送 HTML 响应。这些函数都位于 `Phoenix.Controller`\
  \ 模块中，且不需要视图即可返回响应。\n\n当 `media_by_folder` 函数返回 `{:error, :invalid_path}` 元组，表示提供的路径无效时，我们首先通过调用\
  \ `put_flash` 函数来处理错误，以便用户获得反馈，然后重定向到根路径 (`\"$\"`)，这是我们已知有效的路径。让我们进一步拆解，因为在这两行中发生了很多事情。\n\
  \n首先，`put_flash` 函数会将一条 flash 消息放入连接中。然后它会在浏览器中显示，因为在应用布局上有一个 `get_flash` 函数调用。我们将在下一节讨论布局。目前，由于一图胜千言，请看以下截图中\
  \ flash 消息的显示效果：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_358_1.png)\n\n其次，我们使用\
  \ `redirect/2` 函数将用户重定向到根路径。这个函数非常有用，因为它使重定向变得非常简单。该函数的第一个参数，如常，是连接，第二个参数是要重定向到的路径。为此，我们使用\
  \ `file_path` 函数，在本例中它会为文件控制器的 index action 生成路径，并将路径作为查询参数传递。该函数由 Phoenix 动态生成，通常称为路径助手。如你所猜，这些动态函数的名称源自路由定义中使用的控制器的名称。不是将路径硬编码，我们使用路径助手生成它们。\n\
  \n这样，当我们更新路由时，就不需要在整个应用中更新路径——只需更新路由本身即可。由于路径助手是基于路由动态生成的，即使路由发生变化，我们的应用仍能正常工作。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_359_0.png)\n\n为了增强安全性，redirect 函数的 :to\
  \ 选项只接受路径。如果要重定向到任意 URL，请使用 :external 选项。\n\n当发生不同类型的错误时，我们使用 _ 模式捕获它，并简单地放置一条 flash\
  \ 消息说明发生了意外错误，然后重定向到根路径，就像对无效路径错误的处理一样。\n\n最后，当在没有 path 参数的情况下调用 index action 时，我们将用户重定向到根路径，这将调用\
  \ index 函数的第一个子句。现在让我们转向 show action，其目的是展示某个文件的详细信息：\n\n```elixir\ndef show(conn,\
  \ %{\"id\" => id}) do\n  with {:ok, file} <- Storage.get_file_info(\"hardcoded_user_id\"\
  , id) do\n    render(conn, file: file)\n  else\n    {:error, :not_found} ->\n  \
  \    conn\n      |> put_flash(:error, \"File not found.\")\n      |> redirect(to:\
  \ file_path(conn, :index, \"path\": \"$\"))\n    _ ->\n      conn\n      |> put_flash(:error,\
  \ \"Unexpected error.\")\n      |> redirect(to: file_path(conn, :index, \"path\"\
  : \"$\"))\n  end\nend\n```\n\n此 action 的逻辑与 index 的非常相似。我们通过对第二个参数进行模式匹配从查询参数中提取\
  \ id，然后调用 elixir_drip umbrella 应用的 Storage 模块中的函数。我们对该函数调用的结果进行模式匹配以相应地处理每种情况。因此，这个\
  \ action 没有太多需要讨论的地方。然而，让我们借此机会演示一个非常强大的 Phoenix 特性：action fallbacks。\n\n如我们所见，catch\
  \ all 模式与 index action 中存在的完全相同。为了本例的 sake，假设 {:error, :not_found} 和 {:error, :invalid_path}\
  \ 的块也在其他 action 中重复出现。我们现在将看到 action fallback 如何允许我们消除这种重复并统一在此控制器中处理错误的方式。\n\n\
  首先，我们需要在 index 函数之前添加以下行：\n\n```\naction_fallback(ElixirDripWeb.FallbackController)\n\
  ```\n\nPhoenix.Controller.action_fallback/1 函数会将你作为参数传递的 plug 注册为控制器正在执行 action\
  \ 的回退。当控制器 action 失败且未返回有效的 %Plug.Conn{} 结构体时，会使用此回退。发生这种情况时，回退 plug 将接收两个参数：action\
  \ 被调用之前的连接，以及控制器 action 的返回值。\n\n现在让我们看看我们作为参数传递的模块的代码，即 fallback controller：\n\n\
  ```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/controllers/fallback_controller.ex\n\
  ```\n\n```\ndefmodule ElixirDripWeb.FallbackController do\n  use Phoenix.Controller\n\
  \  import ElixirDripWeb.Router.Helpers, only: [file_path: 3]\n\n  def call(conn,\
  \ {:error, :invalid_path}) do\n    conn\n    |> put_flash(:error, \"The path provided\
  \ is invalid.\")\n    |> redirect(to: file_path(conn, :index, \"path\": \"$\"))\n\
  \  end\n\n  def call(conn, {:error, :not_found}) do\n    conn\n    |> put_flash(:error,\
  \ \"File not found.\")\n    |> redirect(to: file_path(conn, :index, \"path\": \"\
  $\"))\n  end\n\n  def call(conn, _error) do\n    conn\n    |> put_flash(:error,\
  \ \"Unexpected error.\")\n    |> redirect(to: file_path(conn, :index, \"path\":\
  \ \"$\"))\n  end\nend\n```\n\n\n\n本质上，我们已将错误处理逻辑复制到此控制器中，并对控制器 action 返回的元组进行模式匹配，以便适当处理每种错误。这非常有益，因为错误处理逻辑通常分散在我们的应用程序各处。例如，匹配全部子句已在\
  \ index 和 show action 中重复出现。请注意，在 Elixir 中处理意外错误并不常见，因为我们通常更关注 happy path。\n\n然而，你可能希望确保客户端始终获得有效的响应，在我们的例子中这涉及重定向到根路径。在真实的生产部署中，我们很可能会将此错误标记到错误跟踪系统中，以便日后调查其原因。\n\
  \n使用 fallback controller 的另一个巨大优势是控制器可读性的提高。让我们查看此更改后 show action 的代码：\n\n```elixir\n\
  def show(conn, %{\"id\" => id}) do\n  with {:ok, file} <- Storage.get_file_info(\"\
  hardcoded_user_id\", id) do\n    render(conn, file: file)\n  end\nend\n```\n\n现在，我们的代码完全专注于\
  \ happy path，从而得到一个更容易理解的函数。这个函数如此简单，以至于 show action 中无需再添加任何内容。让我们通过最后两个 action\
  \ new 和 create 来结束本节。我们将一起讨论它们，因为这两个 action 是耦合的：new 用于渲染表单以允许用户上传新文件，而 create action\
  \ 用于处理表单提交。在下一节讨论视图和模板时，我们将看到此表单是如何创建和提交的。现在，让我们先看看 new action 的代码：\n\n```elixir\n\
  def new(conn, %{\"path\" => path}) do\n  render(conn, changeset: Storage.Media.create_changeset(%Storage.Media{}),\
  \ path: path)\nend\n```\n\n```elixir\ndef new(conn, _params) do\n  render(conn,\
  \ changeset: Storage.Media.create_changeset(%Storage.Media{}), path: \"$\")\nend\n\
  ```\n\n正如我们所见，此 action 的代码非常简单。当调用此 action 时，我们只需渲染 \"new.html\" 模板。正如我们在下一节将看到的，此模板需要一个\
  \ changeset。因此，我们生成一个空的 changeset 并将其传递给模板。我们有两个函数子句，就像 index action 一样：一个用于 \"\
  path\" 参数提供的情况，另一个用于未提供的情况。此 action 的代码只是将来自路由器的请求连接到正确的视图和模板的一种方式。现在让我们分析 create\
  \ action 的代码：\n\n```elixir\ndef create(conn, %{\"file\" => file_params}) do\n  file_content\
  \ =\n    file_params\n    |> Map.get(\"file\")\n    |> Map.get(:path)\n    |> File.read!()\n\
  \n  with {:ok, :upload_enqueued, _changeset} <- Storage.store(\n    \"hardcoded_user_id\"\
  , file_params[\"file_name\"],\n    file_params[\"full_path\"], file_content) do\n\
  \    conn\n    |> put_flash(:info, \"Your file upload is enqueued. A confirmation\
  \ will appear shortly.\")\n    |> redirect(to: file_path(conn, :index, \"path\"\
  : file_params[\"full_path\"]))\n  else\n    {:error, changeset} ->\n      conn\n\
  \      |> put_flash(:error, \"Unable to upload file. Please check the errors below.\"\
  )\n      |> render(:new, changeset: changeset, path: file_params[\"full_path\"])\n\
  \  end\nend\n```\n\n此 action 稍微复杂一些，让我们逐段分析。我们将 file_params 绑定到通过表单提交的数据。在这种情况下，它将是一个包含有关正在上传的文件的信息以及文件本身的\
  \ map。我们首先获取文件的二进制内容。我们使用 File.read!/1 是因为 Phoenix 为通过表单提交的文件创建了一个临时文件。我们将文件的二进制内容绑定到\
  \ file_content，然后将其传递给 Storage.store/4。除了内容本身之外，此函数还接收文件所有者的用户 ID，以及文件的名称和路径。\n\n\
  当文件正确存储时，我们会弹出一条 flash 消息以向用户提供反馈，并将其重定向到刚刚上传的文件的路径。请注意，此操作仅在管道上排队上传。当我们在本章末尾讨论\
  \ Phoenix Channels 时，我们将着手提供确认文件已成功上传的通知。\n\n当 store 函数返回错误时，我们会弹出一条 flash 消息说明发生了某些错误，并使用包含错误的\
  \ changeset 渲染 \"new.html\" 模板。此细节将允许我们直接从 changeset 渲染错误。我们将在下一节更详细地了解其工作原理。现在，我们只需要记住将失败的\
  \ changeset 传递给模板很重要。还值得指出的是，在这种情况下，我们需要将模板名称传递给 render 函数，因为如果省略它，Phoenix 将尝试渲染名为\
  \ \"create.html\" 的模板，而该模板不存在。在这种情况下，我们只传递一个原子 (:new)，而不是字符串 \"new.html\"。我们之所以可以这样做，是因为当向\
  \ render 传递原子时，Phoenix 将使用当前请求（在我们的例子中为 HTML）的格式来构建模板的完整名称。\n\n我们现在已经完成了控制器部分！接下来，我们将看看控制器完成所有处理并开始渲染视图后会发生什么。\n\
  \n## 渲染视图\n\n在探索了 Phoenix 中控制器的工作方式后，我们现在将看看下一步：渲染视图。视图是一个包含渲染函数的模块，其目的是将数据转换为最终用户可以消费的格式。延续我们在前两节中给出的示例，我们将查看文件以及它们在我们的应用程序中如何被渲染。我们将创建一个文件视图模块，命名为\
  \ ElixirDripWeb.FileView。以下是它的代码：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/views/file_view.ex\n\
  \ndefmodule ElixirDripWeb.FileView do\n  use ElixirDripWeb, :view\n\n  def parent_directory(path)\
  \ do\n    Path.dirname(path)\n  end\nend\n```\n\n首先，我们给这个模块起的名字很重要。正如我们在上一节中看到的，文件控制器在渲染响应时从未提及视图模块。我们之所以能够做到这一点，是因为\
  \ Phoenix 会根据控制器模块的名称推断出视图模块的名称。为避免在此问题上产生混淆，Phoenix 在模块名称中始终使用单数形式。如果由于某种原因你无法遵循这些规则，并且想要指定要调用的视图的名称，你只需要在控制器中调用\
  \ render 时传递视图模块的名称即可。这又是 Phoenix 让你保持高效并从应用程序中移除样板代码的另一个例子，同时也给你根据需要调整框架的选项。\n\n\
  在这个视图模块内部，我们只看到一个函数 parent_directory，它将在模板中使用，正如我们稍后将看到的那样。首先我们需要澄清 Phoenix 中的视图和模板是什么。在许多其他框架中，这两个词可以互换使用，但在该框架中它们是两个不同的概念。视图，正如我们之前描述的那样，是一个包含渲染函数的模块。这些渲染函数可以是模块本身中的\
  \ render 函数（就像其他任何 Elixir 函数一样），也可以从模板定义。模板是从包含标记语言与 EEx 代码混合的文件编译而来的，这使我们能够在模板中替换变量并对其进行循环。此文件的编译会在相应的视图模块中生成一个函数。视图与模板之间的关注点分离使我们能够以任何所需的形式渲染数据，无论是从常规的\
  \ Elixir 函数、模板引擎（如 EEx）还是其他任何形式。现在，我们将只使用模板来渲染视图，但在本章后面构建 JSON API 时，我们将看到直接在视图模块中使用\
  \ render 函数的示例。\n\n我们已经看到控制器如何将要渲染的模板名称传递给视图（或如何根据 action 名称推断它）。但视图是如何找到模板的呢？答案在于\
  \ Phoenix 使用的一种约定。它会在一个目录中查找模板，默认情况下是 lib/elixir_drip_web/templates。下一个目录的名称是从视图模块的名称推断出来的；在我们的例子中，视图模块名为\
  \ FileView，因此它会在 file 目录中查找模板。该目录包含以当前 action 命名的文件（或控制器传递的参数）。例如，文件索引 action 的模板位于\
  \ apps/elixir_drip_web/lib/elixir_drip_web/templates/file/index.html.eex。我们现在就来看看它。由于其中代码相当多，我们将逐段进行。你随时可以在我们提到的路径中查看完整文件。当为用户索引文件时，我们做的第一件事是渲染一个用于上传新文件的链接：\n\
  \n```\n<%= link(\"Upload File\", to: file_path(@conn, :new, \"path\": @current_path),\
  \ class: \"btn btn-primary\") %>\n```\n\n\n\n首先要指出的是 `<%= %>` 的使用。这些标签内的代码由 EEx\
  \ 引擎执行，结果会被注入到模板中。我们也可以在 `<% %>` 内放置代码，它同样会被 EEx 引擎执行，但在这种情况下结果不会被注入回模板。如你在本书其余部分会看到的，我们大多会使用\
  \ `<%= %>` 形式。\n\n然后，在这些标签内部，我们调用了 `link` 函数，它来自 `Phoenix.HTML.Link` 模块。这个函数以及我们在后续模板中会使用的其他\
  \ HTML 助手，在我们调用 `use ElixirDripWeb, :view` 时会被导入。这些助手非常有用，可以让我们在模板中创建常见的 HTML 结构。link\
  \ 函数会创建一个锚元素。第一个参数是锚上显示的文本，而第二个参数是一个关键字列表。`to:` 键指定了链接的目标。我们使用之前见过的路径助手来创建一个指向文件资源\
  \ `:new` 动作的链接。注意我们如何将当前路径传递给这个函数。EEx 允许我们通过在名称前加上 `@` 来引用传递给模板的 assigns。这种语法会在\
  \ `@current_path` 未传递给模板时生成异常。为了避免在这种情况下抛出异常，我们可以使用 `assigns[:current_path]`。最后，我们传递了\
  \ `class:` 键，它允许我们定义正在创建的锚的类——在这个例子中，我们用它来将链接样式化为按钮。这些类之所以可用，是因为 Phoenix 生成器导入了\
  \ Bootstrap CSS 库（默认情况下放置在 `apps/elixir_drip_web/assets/css/phoenix.css`）。\n\n现在让我们继续看下一部分：\n\
  \n```\n<%= if Enum.empty?(@folders) && Enum.empty?(@files) do %>\n  <p class=\"\
  lead\">This folder is empty!</p>\n  <% else %>\n  # ...\n<% end %>\n```\n\n现在，我们使用条件表达式来检查\
  \ assigns 中提供的 folders 和 files 是否都为空。如果是，我们插入一段说明此事的段落。否则，我们执行 `else` 块中的内容，我们接下来会看到。在此之前，重要的是要注意，即使使用\
  \ `if`，我们仍在使用 `<%= %>` 记法。如第一章所述，Elixir 中的一切都是表达式，因此如果我们希望将 `if` 的结果注入到模板中，就应该使用适当的记法。现在让我们看看\
  \ else 块中的内容：\n\n```\n<table class=\"table table-striped\">\n  <%= if @current_path\
  \ != \"/\" do %>\n    <tr>\n      <td><img src=\"<%= static_path(@conn, \"/images/folder.svg\"\
  ) %>\"></td>\n      <td colspan=\"3\"><%= link(\"..\", to: file_path(@conn, :index,\
  \ \"path\":\n        parent_directory(@current_path))) %></td>\n        </tr>\n\
  \        <% end %>\n```\n\n这里是我们开始渲染文件夹和文件的地方。我们首先打开一个 table 元素，在其中插入每个文件夹和文件。在遍历之前，我们检查当前路径是否不是根路径。如果不是，我们希望渲染一个指向当前目录父目录的虚拟文件夹。在链接之前，我们渲染一个图像，这展示了如何指向静态文件夹内的文件：使用\
  \ static_path 路径助手，将文件的相对路径作为参数传递。图像之后，我们渲染一个文本为 \"..\" 的链接，指向当前目录的父级。注意我们如何传递路径查询参数：通过调用在\
  \ FileView 模块上定义的 parent_directory 函数。该函数以当前路径作为参数并返回父目录的路径。请注意，我们不需要在函数名前加上其模块。猜猜为什么？因为此模板将被编译为该模块内部的一个函数，这意味着我们可以像在其中编写常规\
  \ Elixir 函数一样调用该模块中的函数。让我们继续看下一部分：\n\n```\n<%= for folder <- @folders do %>\n  \
  \  <tr>\n        <td><img src=\"<%= static_path(@conn, \"/images/folder.svg\") %>\"\
  ></td>\n        <td><%= link(folder.name, to: file_path(@conn, :index, \"path\"\
  : @current_path <> \"/\" <> folder.name)) %></td>\n        <td><%= folder.size %>\
  \ bytes</td>\n        <td><%= folder.files %> files</td>\n    </tr>\n<% end %>\n\
  ```\n\n这里，我们看到了模板中循环的第一个示例。也就是说，我们使用 comprehension 来遍历作为参数传递的 folders 列表中的每个文件夹。除此之外，逻辑与我们已经看到的示例非常相似。首先，我们渲染一个图像，然后是一个链接，这个链接允许用户进入当前文件夹。最后，我们不是注入两个空列，而是用当前文件夹的大小（其下文件和文件夹大小的总和）和当前文件夹拥有的文件数量来填充它们。让我们继续看此模板的最后一部分：\n\
  \n```\n<%= for file <- @files do %>\n    <tr>\n        <td><img src=\"<%= static_path(@conn,\
  \ \"/images/file.svg\") %>\"></td>\n        <td><%= link(file.name, to: file_path(@conn,\
  \ :show, file.id)) %></td>\n        <td colspan=\"2\"><%= file.size %> bytes</td>\n\
  \    </tr>\n<% end %>\n</table>\n```\n\n这个示例与上一个非常相似。不同之处在于，我们现在遍历的是 files 而不是 folders。我们渲染了一个不同的图像，并且我们创建的链接指向特定的文件（使用其\
  \ ID）。\n\n如前所述，模板会被编译为其各自视图模块内部的函数。这意味着在运行时，模板已经在内存中，不需要进行磁盘读取或模板引擎计算。此外，Phoenix\
  \ 使用链表构建模板，而不是像许多其他框架那样拼接巨大的字符串。这样，Phoenix 在渲染模板时就不会在字符串之间来回复制。由于 Elixir 中的数据类型是不可变的，Phoenix\
  \ 可以共享响应的静态部分，因为它们永远不会被修改。模板渲染时的这种效率是 Phoenix 的一个非常重要的部分，使其能够实现我们在本章开头描述的惊人性能。\n\
  \n在继续下一个模板之前，让我们看一下此模板运行时的截图：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_367_0.png)\n\
  \n我们现在将探索 show 动作的模板，它位于 `apps/elixir_drip_web/lib/elixir_drip_web/templates/file/show.html.eex`。在\
  \ show 动作的模板中，我们可能会复制 index 模板中渲染文件的内容，但这会造成逻辑重复。在本示例中，我们将看到如何嵌套模板，从而消除重复。首先，我们将创建一个新模板：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/templates/file/\nfile.html.eex\n\
  \n<tr>\n    <td><img src=\"<%= static_path(@conn, \"/images/file.svg\") %>\"></td>\n\
  \    <td><%= link(@file.name, to: file_path(@conn, :show, @file.id)) %></td>\n \
  \   <td><%= @file.size %> bytes</td>\n</tr>\n```\n\n```\n<td/>\n</tr>\n```\n\n这与我们在\
  \ index 模板最后一部分中展示的内容是一份拷贝，只是我们读取 file 的地方现在看到的是 @file，因为文件现在来自 assigns 而不是循环。现在，让我们在\
  \ show 模板中使用它：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/templates/file/show.html.eex\n\
  ```\n\n```\n<div>\n  <table class=\"table table-striped\">\n    <%= render(\"file.html\"\
  , conn: @conn, file: @file) %>\n    <tr>\n      <td> Full path: </td>\n      <td\
  \ colspan=\"3\"><%= @file.full_path %></td>\n    </tr>\n    <tr>\n      <td> Uploaded\
  \ at: </td>\n      <td colspan=\"3\"><%= @file.uploaded_at %></td>\n    </tr>\n\
  \  </table>\n  <%= link(\"Back to folder\", to: file_path(@conn, :index, \"path\"\
  : @file.full_path), class: \"btn btn-default\") %>\n</div>\n```\n\n为了使用 file 模板，我们只需调用\
  \ render，传递模板名称作为属性（连同必要的 assigns）。这样，我们在整个应用程序中就有了一种统一的方式来渲染文件，这不仅消除了重复，也促进了视觉一致性。我们还更新了\
  \ index 动作以使用 file 模板。由于这是 show 动作，除了渲染文件的一般信息外，我们还显示文件的完整路径以及上传时间。最后，我们渲染一个链接，允许用户返回此文件所属的文件夹。我们使用在\
  \ index 模板中看到的相同技术来实现这一点。\n\n我们现在将探索最后一个模板，在其中学习如何在 Phoenix 中生成表单。这是 new 动作的模板：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/templates/file/\nnew.html.eex\n\
  ```\n\n```\n<h1>Upload a File</h1>\n<%= form_for @changeset, file_path(@conn, :create),\
  \ [multipart: true, as: :file], fn f -> %>\n  <div class=\"form-group\">\n    <%=\
  \ text_input f, :file_name, placeholder: \"File Name\", class: \"form-control\"\
  \ %>\n    <%= error_tag f, :file_name %>\n```\n\n```\n</div>\n<div class=\"form-group\"\
  >\n  <%= text_input f, :full_path, value: @path, placeholder: \"Full Path\",\n \
  \   class: \"form-control\" %>\n  <%= error_tag f, :full_path %>\n</div>\n<div class=\"\
  form-group\">\n  <label>File</label>\n  <%= file_input f, :file, class: \"form-control\"\
  \ %>\n</div>\n<%= submit(\"Upload\", class: \"btn btn-primary\") %>\n<% end %>\n\
  ```\n\n模板的核心部分是 Phoenix.HTML.Form.form_for/4 函数。该函数的第一个参数可以是 changeset（正如我们在模板中所使用的），也可以是\
  \ connection——事实上，它可以是实现 Phoenix.HTML.FormData 协议的任何内容。这些随后被用来填充表单数据，例如默认值或错误信息。请记住，我们在控制器中调用\
  \ render 时将 changeset 传递给了模板。第二个参数是表单提交时调用的 action——在我们的例子中，是 file 控制器上的 create\
  \ action。第三个参数是一个关键字列表，允许我们配置表单的行为。在本例中，我们传递了两个选项：multipart: true，它将表单的 enctype\
  \ 设置为 multipart/form-data，使我们能够在此表单中上传文件；以及 as: :file，它定义了在服务器端收集表单所有参数的参数。这就是为什么在\
  \ file 控制器的 create action 中，我们对 file 参数进行模式匹配的原因。最后，form_for 的最后一个参数是一个接收表单作为参数的\
  \ lambda。form_for 函数将第一个参数（在我们的例子中是 changeset）转换为表单，并将其传递给上述 lambda。\n\n现在，我们使用\
  \ Phoenix.HTML.Form 模块中的辅助函数来生成我们想要的输入字段。这些函数接收表单 (f) 作为参数。使用表单，这些函数还可以从 changeset\
  \ 中获取数据并预填充字段。例如，如果我们的 changeset 为 filename 设置了默认值，它将自动显示在表单中。此外，Phoenix 表单与 Ecto\
  \ change set 之间的集成允许我们直接在表单中渲染 changeset 的错误。这就是为什么我们对两个输入都调用 error_tag 的原因。error_tag\
  \ 函数由 Phoenix 生成，默认位于应用程序的 ErrorHelpers 模块中（在我们的例子中是 ElixirDripWeb.ErrorHelpers）。\n\
  \n让我们通过有意在表单中生成错误来实际查看其效果：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_370_0.png)\n\
  \n我们在表单中插入了一条无效路径。后端检测到该路径无效，并返回了一个包含错误的 changeset。正如截图中所见，表单能够从 changeset 中获取错误并将其显示在对应字段旁边。如果未对\
  \ changeset 应用 action（或 action 为 :ignore），则错误不会显示，即使 changeset 的 :errors 字段中包含错误。通常，表单是使用空的\
  \ changeset 创建的，该 changeset 可能携带错误（例如由于缺少必填字段）。然而，我们不希望在用户对表单执行操作之前向其显示错误。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_370_1.png)\n\
  \n为了在应用程序中促进 HTML 安全，Phoenix 模板不会直接将数据类型转换为字符串。相反，Phoenix 为大多数数据类型实现了 `Phoenix.HTML.Safe`，从而保证返回安全的\
  \ HTML 表示。\n\n表单的最后一部分是对 `submit` 函数的调用，该函数生成一个用于提交表单的按钮。第一个参数是按钮上显示的文本，第二个参数是一个选项关键字列表，这些选项会转发给底层的按钮标签。最后关于表单的一个说明，我们想指出在\
  \ Phoenix 中，表单会自动生成一个 CSRF token。默认情况下，Phoenix 也会检查此 token（通过 `:protect_from_forgery`\
  \ plug），从而保护应用程序免受 CSRF 攻击。\n\n## 布局\n\n到目前为止，我们已经看到了一些模板示例以及它们如何用于渲染响应。然而，当控制器调用视图来渲染模板时，该视图并不会直接渲染；控制器首先渲染布局视图，然后布局视图再渲染模板本身。这样，我们可以在整个应用程序中保持一致的样式（例如设置页眉和页脚），而无需在各个模板中重复它们。\n\
  \n然而，布局是普通的模板。你对模板学到的所有内容同样适用于布局。Phoenix 生成器会创建一个 `app` 布局，在我们的例子中它位于 `apps/elixir_drip_web/lib/elixir_drip_web/templates/layout/app.html.eex`。该布局将被编译为\
  \ `ElixirDripWeb.LayoutView` 上的一个函数（位于 `apps/elixir_drip_web/lib/elixir_drip_web/views/layout_view.ex`）。\n\
  \n为了渲染你在控制器中设置的模板，Phoenix 会将该模板嵌套在 `app` 布局中。负责执行此操作的特定行是：\n\n```\n<%= render(@view_module,\
  \ @view_template, assigns) %>\n```\n\n类似于我们对 `file` 模板所做的操作，我们正在调用 `render` 函数在当前布局（它本身也是一个模板）内部渲染另一个模板。`@view_module`\
  \ 和 `@view_template` 变量由 Phoenix 分配，分别包含正在渲染的视图的模块名称和该视图内部的模板名称。如果出于某种原因你想更改正在渲染的布局，你有几个选项：调用控制器中的\
  \ `render` 时传递 `layout:` 选项；在控制器中调用 `put_layout/2` plug；或在路由器管道中调用 `put_layout/2`\
  \ plug，使此更改对通过该管道的每个请求都生效。\n\n在结束本节之前，我们想谈谈 `ErrorView`。该视图由 Phoenix 生成，是集中处理应用程序中错误渲染逻辑的地方。\n\
  \nPhoenix 会检测任何 400 或 500 级别的错误，并使用该视图中的 render/2 函数来渲染错误信息。以下是 Phoenix 生成的两个子句：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/views/error_view.ex\n\ndefmodule\
  \ ElixirDripWeb.ErrorView do\n  use ElixirDripWeb, :view\n\n  def render(\"404.html\"\
  , _assigns) do\n    \"Page not found\"\n  end\n\n  def render(\"500.html\", _assigns)\
  \ do\n    \"Internal server error\"\n  end\n\n  # ...\nend\n```\n\n这只会向浏览器返回文本，但在实际应用程序中，你可以自定义它以渲染你想要的适当的\
  \ 404 和 500 页面。如果 Phoenix 找不到与当前错误匹配的 render/2 函数子句，则会执行 template_not_found/2 函数：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/views/error_view.ex\n\ndefmodule\
  \ ElixirDripWeb.ErrorView do\n  # ...\n\n  def template_not_found(_template, assigns)\
  \ do\n    render(\"500.html\", assigns)\n  end\nend\n```\n\n正如我们所见，默认情况下它只会调用 \"\
  500.html\" 模板。我们将在本章后面实现应用程序的 JSON API 时再次涉及该模块。\n\n我们现在已经到达了视图部分的结尾。此时，我们已经涵盖了\
  \ Phoenix 工作原理的基础，从 endpoint 开始，经过 router，涉及 controller，最后结束于 view。结合我们在这些部分中获得的所有知识，我们现在将把它们应用到为我们的\
  \ ElixirDrip 应用程序添加身份验证。\n\n## 用户认证\n\n在上一章中，我们看到了如何在 Accounts 上下文中处理用户密码，使用 comeonin\
  \ 库对其进行签名和验证。在本章中，我们的重点是扩展我们的 Web 界面，以允许用户注册和登录我们的应用程序，并限制某些页面仅对已登录用户开放。Elixir 生态系统中有一系列库可以在几行代码内实现此功能。然而，实现我们自己的身份验证解决方案有两个好处：它将给我们机会更深入地探索\
  \ Phoenix，并且它将给予我们在身份验证方式上更大的自由度，使我们能够将其调整以适应我们的需求。\n\n为了让用户通过身份验证，我们首先需要在应用程序中创建用户的能力。我们将从下而上完成这部分工作，围绕用户身份验证构建逻辑，并在该部分完成后，我们将着手允许用户注册和登录。\n\
  \n正如我们在本章开头所暗示的，我们将使用 plugs 实现身份验证。我们将创建两个 plugs：第一个负责从 session 中提取用户 ID 并将对应的用户加载到连接中，第二个负责验证连接中是否存在当前用户，并在不存在时限制对某些内容的访问。让我们从第一个名为\
  \ FetchUser 的 plug 开始：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/plugs/fetch_user.ex\n\
  \ndefmodule ElixirDripWeb.Plugs.FetchUser do\n  import Plug.Conn\n\n  alias ElixirDrip.Accounts\n\
  \n  def init(options), do: options\n\n  def call(conn, _options) do\n    user_id\
  \ = get_session(conn, :user_id)\n    find_user(conn, user_id)\n  end\n\n  defp find_user(conn,\
  \ nil), do: conn\n  defp find_user(conn, user_id) do\n    user = Accounts.find_user(user_id)\n\
  \    assign_current_user(conn, user)\n  end\n\n  defp assign_current_user(conn,\
  \ nil), do: conn\n  defp assign_current_user(conn, user) do\n    conn\n```\n\n```\n\
  |> assign(:current_user, user)\n|> assign(:user_id, user.id)\nend\nend\n```\n\n\
  我们在本章开头看到了 plugs 的工作原理：它们接收一个 connection 并返回一个 connection，可能对其进行修改。这里是我们应用中第一个 plug\
  \ 的示例。init/1 函数只是返回传入的 options，而这些 options 在 call/2 函数中不会被使用。在 call/2 函数内部，我们首先从\
  \ session 中获取 :user_id 键的值。然后我们将该值传递给 find_user/2 函数。接着我们对函数子句使用模式匹配来检查该变量是否为 nil。如果是，我们就直接返回未修改的\
  \ connection。如果不是，我们就尝试查找对应 user_id 的用户。我们再次在 assign_current_user 函数上使用模式匹配。如果找不到具有该\
  \ ID 的用户，我们就直接返回 connection。如果能找到用户，我们就将其分配到 :current_user 键（并将其 ID 分配到 :user_id\
  \ 键），它将被存储在 connection 内部。assign/3 函数是从 Plug.Conn 模块导入的，用于在 connection 的 assigns\
  \ 字段中设置键/值对。在下一个 plug 中，我们将看到如何访问该字段中的对。让我们现在更新 router 中的 :browser pipeline 以调用此\
  \ plug：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/router.ex\n\ndefmodule\
  \ ElixirDripWeb.Router do\n  use ElixirDripWeb, :router\n\n  alias ElixirDripWeb.Plugs.FetchUser\n\
  \n  pipeline :browser do\n    plug(:accepts, [\"html\"])\n    plug(:fetch_session)\n\
  \    plug(:fetch_flash)\n    plug(:protect_from_forgery)\n    plug(:put_secure_browser_headers)\n\
  \    plug(FetchUser)\n  end\n\n  # ...\n\nend\n```\n\n现在，FetchUser plug 将为调用 :browser\
  \ pipeline 的所有请求运行，目前就是全部请求。如我们所见，此 plug 会尝试从 session 中加载 :user_id，如果找到，就将对应的用户放入\
  \ connection 的 assigns 字段中，后续的 plugs 可以使用它。让我们看看下一个名为 Auth 的 plug 如何查询此字段：\n\n```\n\
  $ cat apps/elixir_drip_web/lib/elixir_drip_web/plugs/auth.ex\n\ndefmodule ElixirDripWeb.Plugs.Auth\
  \ do\n  import Plug.Conn\n  import Phoenix.Controller, only: [put_flash: 3, redirect:\
  \ 2]\n  import ElixirDripWeb.Router.Helpers, only: [page_path: 2]\n\n  def init(options),\
  \ do: options\n\n  def call(conn, _options) do\n    case conn.assigns[:current_user]\
  \ do\n      nil ->\n        conn\n        |> put_flash(:error, \"You need to be\
  \ logged in to view this content.\")\n        |> halt()\n        |> redirect(to:\
  \ page_path(conn, :index))\n      _ ->\n        conn\n    end\n  end\nend\n```\n\
  \n除了一些必要的设置，例如导入模块和定义所需的 init/1 函数之外，此 plug 会检查 connection 的 assigns 字段中是否存在 :current_user，该字段可能已被\
  \ FetchUser plug 填充。然后我们对访问 conn.assigns[:current_user] 的结果进行模式匹配。如果它是 nil，意味着 session\
  \ 中没有 :user_id（或存在但不对应任何用户），因此 :current_user 未被加载到 connection 上。在这种情况下，我们会弹出一条 flash\
  \ 消息告知用户需要登录，调用 halt/1 函数，并将用户重定向到我们的应用的登陆页面，该页面不需要用户登录。请注意，halt/1 函数仅将 connection\
  \ 的 :halted 字段设置为 true，意味着后续的 plugs 不会被调用，而我们的重定向仍然会执行。\n\n那么，我们应该在哪里调用此 plug？在任何需要检查用户是否已登录的地方。为了举例，我们将\
  \ FileController 提供的任何 action 限制为已登录用户。实现此目的的方法不止一种。例如，我们可以在 router 中创建一个新的 scope\
  \ 和 pipeline，仅对某些路径调用此 plug。然而，我们尚未讨论 scopes，我们将在下一节看到一个示例。我们将借此机会演示另一种实现方式：在 controller\
  \ 内部调用 plug。让我们按如下方式更新我们的 file controller：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/controllers/\n\
  file_controller.ex\n\ndefmodule ElixirDripWeb.FileController do\n  use ElixirDripWeb,\
  \ :controller\n\n  alias ElixirDrip.Storage\n\n  plug ElixirDripWeb.Plugs.Auth\n\
  \n  # ...\n\nend\n```\n\n除了在 router 中定义的 pipeline(s) 之外，controllers 内部也可以拥有 plugs\
  \ 的 pipeline。在本例中，此 pipeline 仅包含一个元素，它将在 controller 的任何 action 执行之前被调用。如果我们只想在某些\
  \ action 上对用户进行身份验证，可以使用以下方式：\n\n```\nplug ElixirDripWeb.Plugs.Auth when action\
  \ in [:index]\n```\n\n这样将导致仅在 action 为 index 时调用 plug。由于我们已经建立了将已登录用户放在 conn.assigns\
  \ map 上的管道，现在可以将对 \"hardcoded_user_id\" 的引用替换为当前用户的 ID。例如，让我们看看 file controller\
  \ 的更新后的 index action：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/controllers/\n\
  file_controller.ex\n\ndefmodule ElixirDripWeb.FileController do\n\n  # ...\n\n \
  \ def index(conn, %{\"path\" => path}) do\n    user = conn.assigns.current_user\n\
  \n    with {:ok, media} <- Storage.media_by_folder(user.id, path) do\n```\n```\n\
  # ...\nend\n\n# ...\n\nend\n```\n\n有了这个设置，我们的应用现在会为当前已登录的用户加载文件和文件夹。我们也在 controller\
  \ 的其他 action 中更新了对 \"hardcoded_user_id\" 的其他引用。现在让我们在登录之前尝试访问我们的文件列表，以检查我们是否不被允许访问：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_377_0.png)\n\n如你所见，我们现在能够将应用的部分功能限制为已登录用户。唯一缺少的是允许用户注册或登录我们的应用。为了允许用户注册，我们将创建与本章中展示的文件非常相似的模块。我们首先在\
  \ router 中添加以下内容：\n\n```\nresources(\"/users\", ElixirDripWeb.UserController, only:\
  \ [:new, :create])\n```\n\n这一行将创建 GET /users/new 和 POST /users 路由。我们在此不会展示 user\
  \ controller、view 和 templates 的代码，因为它与我们为文件资源所做的工作类似。你可以在 lib/elixir_drip_web/controllers/user_controller.ex\
  \ 找到 controller 的代码，view 的代码在 lib/elixir_drip_web/views/user_view.ex，模板则在 elixir_drip_web\
  \ umbrella 应用文件夹内的 lib/elixir_drip_web/templates/user 文件夹中。\n\n在接下来的几段中，我们将看到在应用中何处使用与用户相关的资源。现在，让我们专注于身份验证部分。现在我们有了用户注册的方式，我们需要为已注册用户添加登录方式。为此，我们将创建一个\
  \ session controller，它将渲染并处理登录表单，同时也负责登出。首先，我们在 router 中添加以下内容：\n\n```\nresources(\"\
  /sessions\", ElixirDripWeb.SessionController, only: [:new,\n:create])\ndelete(\"\
  /sessions\", ElixirDripWeb.SessionController, :delete)\n```\n\nnew 和 create action\
  \ 与文件和用户的情况相同，分别与渲染表单和处理其提交相关。delete action 在用户想要退出系统时被调用。现在让我们转向 session controller：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/controllers/\nsession_controller.ex\n\
  \ndefmodule ElixirDripWeb.SessionController do\n  use ElixirDripWeb, :controller\n\
  \n  alias ElixirDrip.Accounts\n  alias ElixirDripWeb.Plugs.Auth\n\n  def new(conn,\
  \ _params), do: render(conn)\n\n  def create(conn, %{\"username\" => username, \"\
  password\" => password}) do\n    with {:ok, user} <- Accounts.login_user_with_pw(username,\
  \ password) do\n      conn\n      |> Auth.login(user)\n      |> put_flash(:info,\
  \ \"#{user.username}, you're now logged in. Welcome back!\")\n      |> redirect(to:\
  \ file_path(conn, :index))\n    else\n      :error ->\n        conn\n        |>\
  \ put_flash(:error, \"Invalid username/password combination.\")\n        |> render(:new)\n\
  \    end\n  end\n\n  def delete(conn, _params) do\n    conn\n    |> Auth.logout()\n\
  \    |> redirect(to: page_path(conn, :index))\n  end\nend\n```\n\n\n\n到目前为止，你可能已经对这种代码很熟悉了。无论如何，让我们逐个函数地过一遍。new/2\
  \ 函数非常简单，因为我们只是调用 render(conn)。这段代码的作用只是将请求与适当的模板连接起来，并在 session view 模块中渲染它。这个函数中唯一值得强调的点是，与文件和用户的\
  \ new action 相反，这里我们没有向模板传递 changeset。我们只是传递 connection，表单将根据 connection 中存在的信息创建，正如我们很快会看到的那样。\n\
  \n然后我们有 create/2 函数，用于处理登录表单提交。我们从 Accounts 模块调用 login_user_with_pw/2 来检查提供的用户名/密码组合是否有效。如果有效，我们调用\
  \ Auth.login/2 函数，显示一条欢迎用户的 flash 消息，并重定向到文件根目录。如果用户名或密码错误，我们会显示一条表明登录不成功的 flash\
  \ 消息，并再次渲染表单。最后，我们有 delete/2 函数，它调用 Auth.logout/1 函数并将用户重定向到我们应用的根路径。\n\n此时我们缺少\
  \ Auth 模块中的 login/2 和 logout/1 函数。在继续实现这些函数之前，让我们先看看 session view 以及 new action\
  \ 的模板：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/views/session_view.ex\n\
  \ndefmodule ElixirDripWeb.SessionView do\n  use ElixirDripWeb, :view\nend\n```\n\
  \n如你所见，这个模块几乎是空的，只是调用了 use ElixirDripWeb, :view。即使在这些情况下，你也必须为你的资源创建一个 view 模块，因为与其关联的模板将被编译成该模块内部的一个函数。现在让我们检查\
  \ new action 的模板：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/templates/session/new.html.eex\n\
  \n<h1>Login</h1>\n<%= form_for @conn, session_path(@conn, :create), fn f -> %>\n\
  \  <div class=\"form-group\">\n    <%= text_input f, :username, placeholder: \"\
  Username\", class: \"form-control\" %>\n  </div>\n  <div class=\"form-group\">\n\
  \    <%= password_input f, :password, placeholder: \"Password\", class: \"form-control\"\
  \ %>\n  </div>\n```\n\n```\n```eex\n<%= submit(\"Login\", class: \"btn btn-primary\"\
  ) %>\n<% end %>\n```\n```\n\n正如我们之前提到的，现在我们向 form_for/4 函数传递的是 connection，而不是 changeset。这意味着表单在可能的情况下将用来自\
  \ connection 的信息填充。例如，当我们登录失败时，表单将使用 connection 重新渲染。在这种情况下，connection 将在 conn.params[\"\
  username\"] 下包含用户名，这将使表单自动填充用户名输入框中的此信息。此表单使用了一个我们尚未见过的函数：password_input/3。这个函数与\
  \ text_input/3 类似，不同之处在于在此输入中输入的文本将被掩码（并且永远不会基于 connection 信息自动填充）。\n\n此时，身份验证工作几乎完成了。现在让我们用我们需要的函数扩展\
  \ Auth 模块：\n\n```\n```bash\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/plugs/auth.ex\n\
  ```\n```\n\n```\n```elixir\ndefmodule ElixirDripWeb.Plugs.Auth do\n  # ...\n\n \
  \ def login(conn, user) do\n    conn\n    |> put_session(:user_id, user.id)\n  \
  \  |> assign(:current_user, user)\n    |> configure_session(renew: true)\n  end\n\
  \n  def logout(conn), do: configure_session(conn, drop: true)\n\n  # ...\n\nend\n\
  ```\n```\n\nlogin/2 函数接收一个 connection 和一个 user，并分三步更新 connection：\n- 1. 首先，它将提供的用户的\
  \ ID 放入 session 中，键为 :user_id。这样，后续请求将可以访问此 :user_id，并且我们之前见过的 FetchUser plug 将能够找到对应此\
  \ ID 的用户。\n- 2. 其次，它将提供的用户分配给 :current_user 键。正如本章创建的两个 plug 所示，我们通过查看 :current_user\
  \ assign 并检查它是否为空来检查用户是否已登录。由于我们现在正在登录，我们也希望填充此 assign。\n- 3. 第三，它使用 :renew 选项设置为\
  \ true 调用 configure_session/2。这告诉 Phoenix 向客户端发送响应时使用不同的 session cookie 标识符，这使我们能够保护应用免受会话固定攻击。\n\
  \n为了让用户在注册后自动登录，我们已在 user controller 的 create action 中添加了对 Auth.login/2 的调用。你可以在\
  \ lib/elixir_drip_web/controllers/user_controller.ex（在 elixir_drip_web umbrella\
  \ 应用中）查看这段代码。\n\nlogout/1 函数只有一行，因为它只是使用 :drop 选项设置为 true 调用 configure_session/2\
  \ 函数。这意味着响应中将不包含 session cookie，本质上是在请求结束时删除 session。\n\n完成这两个函数后，我们现在准备将所有内容整合在一起，并为用户提供在\
  \ ElixirDrip 上注册和登录的方式。为此，我们将稍微修改应用布局，在 header 中包含这些操作的链接，就像大多数网站一样。我们将更新 <header>\
  \ 标签以包含以下内容：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/templates/layout/app.html.eex\n\
  \n<!-- ... -->\n\n<ul class=\"breadcrumb text-right\">\n  <%= if assigns[:current_user]\
  \ do %>\n    <li>Hi, <%= assigns[:current_user].username %>!</li>\n    <li><%= link(\"\
  Logout\", to: session_path(@conn, :delete), method: \"delete\") %></li>\n  <% else\
  \ %>\n    <li><%= link(\"Sign Up\", to: user_path(@conn, :new)) %></li>\n    <li><%=\
  \ link(\"Login\", to: session_path(@conn, :new)) %></li>\n  <% end %>\n</ul>\n\n\
  <!-- ... -->\n```\n\n我们首先检查 connection 中是否分配了 :current_user。如果有，我们向用户问好并显示注销链接。如果没有，我们渲染两个链接：一个用于注册，另一个用于登录。请注意，我们使用\
  \ path helpers 生成所有这些链接。在结束本节之前，让我们看几张截图，展示我们到目前为止所做的工作。\n\n首先，当我们访问应用的主页时，我们会在右上角看到两个链接，允许用户注册或登录：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_382_0.png)\n\n假设我们已经使用一个用户注册了，身份验证失败时登录表单如下所示：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_382_1.png)\n\n如我们所见，我们收到一条 flash 消息，告知我们用户名/密码组合无效。在输入正确的凭据后，我们会看到以下内容：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_383_0.png)\n\n登录后，我们会看到一条欢迎用户回来的 flash\
  \ 消息，并为已登录用户展示文件夹和文件列表。我们还可以观察到右上角的链接已发生变化，现在只有一个链接，允许用户注销。如果我们点击那里，我们会看到与本列表第一张截图中相同的页面。\n\
  \n我们现在已为 ElixirDrip 应用添加了身份验证，从头开始实现且毫无麻烦。通过整个请求生命周期跟踪身份验证逻辑，我们完全掌控应用中身份验证的执行方式。我们可以轻松扩展此实现以满足应用特定的安全要求。现在让我们继续看看如何为应用添加\
  \ JSON API。\n\n## 实现 JSON API\n\n到目前为止，我们一直专注于为浏览器请求提供服务并返回 HTML 响应。在本节中，我们将了解如何通过\
  \ JSON API 扩展 ElixirDrip 应用，使我们的用户能够在浏览器之外与文件交互。为了演示如何实现这一点，我们将实现 file controller\
  \ 的 index action，以及通过 API 登录的能力。像往常一样，让我们先看看更新后的 router：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/router.ex\n\
  \ndefmodule ElixirDripWeb.Router do\n  use ElixirDripWeb, :router\n\n  # ...\n\n\
  \  pipeline :api do\n    plug(:accepts, [\"json\"])\n  end\n\n  scope \"/\", ElixirDripWeb\
  \ do\n    pipe_through(:browser)\n\n    resources(\"/files\", FileController, only:\
  \ [:index, :new, :create,\n      :show])\n\n    # ...\n  end\n\n  scope \"/api\"\
  , ElixirDripWeb.Api as: :api do\n    pipe_through(:api)\n\n    get(\"/files\", FileController,\
  \ :index)\n  end\nend\n```\n\n我们创建了一个名为 :api 的新管道，目前它只是接受 JSON 请求。我们将在本节后面添加 API\
  \ 身份验证时更新此管道。接下来，我们可以看到如何在 Phoenix 路由器中定义作用域。作用域提供了一种方法，可以在公共前缀路径下对路由进行分组，并在该前缀路径下的路由上运行管道。\
  \ 在我们的例子中，我们将本章之前定义好的路由放在第一个作用域下，其前缀路径是根路径 \"/\"。这通常被称为应用程序作用域。对于此作用域内的路由，将调用 :browser\
  \ 管道，就像路由器之前的版本一样。还需要注意的是，我们为 scope 函数提供了第二个参数，它是可选的。该参数是模块名称前缀，将被添加到控制器模块名称之前。与路由器第一个版本相比，我们之前必须为控制器名称提供完全限定名称，现在我们只需写控制器名称，因为我们已将\
  \ ElixirDripWeb 作为此作用域的模块名称前缀。例如，我们之前在文件路由中使用 ElixirDripWeb.FileController，现在可以简单地写成\
  \ FileController。最后，我们提供的 :as 选项是命名辅助作用域。如果没有它，此作用域的路径辅助函数将与应用程序作用域的冲突；例如，对于 GET\
  \ \"/files\" 路由，它们都将使用 file_path(conn, :index) 调用，这是不正确的。\n\n通过传递此选项，我们可以将此路径辅助函数用作\
  \ api_file_path(conn, :index)，而应用程序作用域中的辅助函数则以相同的方式调用。\n\n现在看下一个作用域，可以看到路径前缀是 \"\
  api\"。我们将在此作用域中放置所有与 API 相关的路由，并且每个路由都会调用我们之前描述的 :api 管道。请注意，在此作用域中我们传递了不同的模块名称前缀\
  \ ElixirDripWeb.Api。这样我们将拥有不同的控制器来处理 API 请求。实现方式有多种。例如，我们可以让同一个控制器处理两种类型的请求，然后使用\
  \ `Phoenix.Controller.get_format/1` 函数来判断传入请求是 HTML 还是 JSON。\n\n我们选择使用独立的控制器，因为我们的文件控制器中存在针对\
  \ HTML 请求的特定代码，例如 put_flash 函数。我们认为，如果将每种类型请求的逻辑放在各自的模块中，代码会更容易阅读和理解。现在让我们来看一下 API\
  \ 请求的文件控制器：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/api/controllers/file_controller.ex\n\
  \ndefmodule ElixirDripWeb.Api.FileController do\n  use ElixirDripWeb, :controller\n\
  \n  alias ElixirDrip.Storage\n\n  def index(conn, %{\"path\" => path}) do\n    with\
  \ {:ok, media} <- Storage.media_by_folder(\"hardcoded_user_id\", path) do\n    \
  \  render(conn, files: media.files, folders: media.folders)\n    else\n      {:error,\
  \ :invalid_path} ->\n        render(conn, ElixirDripWeb.ErrorView, \"400.json\"\
  , message: \"The path provided is invalid.\")\n    end\n  end\n\n  def index(conn,\
  \ _params), do: render(conn, ElixirDripWeb.ErrorView, \"400.json\", message: \"\
  Missing 'path' query parameter\")\nend\n```\n\n目前我们通过 API 还没有身份验证，因此我们只是将一个硬编码的用户\
  \ ID 传递给 `media_by_folder/2` 函数。这段代码与 HTML 控制器中 index 动作的代码非常相似。当 `media_by_folder/2`\
  \ 返回预期结果时，我们调用 render 函数，并像在 HTML 控制器中一样传递 files 和 folders assigns。\n\n请注意，我们没有传递要渲染的模板名称，因为\
  \ Phoenix 会根据动作名称和请求格式推断出来。由于这是 index 动作且请求格式为 JSON，推断出的名称是 \"index.json\"。\n\n\
  当提供的路径无效时，`media_by_folder/2` 函数会返回错误，我们在 else 块中处理它。这里我们没有使用动作回退控制器，但如果此错误的处理在不同动作甚至控制器之间共享，我们也可以像在\
  \ HTML 控制器中那样使用它。在处理此错误时，我们还可以看到我们在调用 render 时传递了模块名称。这使我们能够将 JSON 错误视图集中在一个模块中，该模块将被\
  \ API 中的所有控制器使用。除了视图和错误名称（本例中为 \"400.json\"，意为 Bad Request）之外，我们还在 assigns 中传递了\
  \ :message 选项，这使我们能够提供有关此错误原因的一些详细信息。在查看 ErrorView 模块之前，请注意我们有 index 函数的第二个子句，用于在未提供\
  \ path 查询参数时。在这种情况下，我们也使用 \"400.json\" 调用 ErrorView，但这次传递了不同的消息：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/views/error_view.ex\n\
  \ndefmodule ElixirDripWeb.ErrorView do\n  use ElixirDripWeb, :view\n\n  def render(\"\
  400.json\", %{message: message}) do\n    %{\n      error: \"bad request\",\n   \
  \   details: message\n    }\n  end\n\n  # ...\n\n  end\n```\n\n我们正在为 render 函数定义一个函数子句，使用模式匹配对第一个参数进行匹配以设置错误类型，并对第二个参数进行匹配以提取控制器中传递的消息。然后我们对其进行格式化，返回给客户端的响应会告知用户这是一个无效请求，并提供有关此错误发生原因的一些详细信息。现在让我们来看一下\
  \ API 文件视图的代码：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/api/views/file_view.ex\n\
  \ndefmodule ElixirDripWeb.Api.FileView do\n  use ElixirDripWeb, :view\n\n  def render(\"\
  index.json\", %{files: files, folders: folders}) do\n```\n```\n%{\n  response: %{\n\
  \    files: render_many(files, __MODULE__, \"file.json\"),\n    folders: render_many(folders,\
  \ __MODULE__, \"folder.json\", as:\n    :folder)\n  }\n}\nend\n\ndef render(\"file.json\"\
  , %{file: file}) do\n  %{id: file.id, name: file.name, full_path: file.full_path,\
  \ size:\n  file.size}\nend\n\n  def render(\"folder.json\", %{folder: folder}) do\n\
  \  %{name: folder.name, size: folder.size, files: folder.files}\nend\nend\n```\n\
  \n与在 HTML 中我们始终使用模板来渲染响应不同，这里我们看到一个示例，说明如何直接在视图模块中使用 render 函数构建响应。与错误视图一样，我们对动作名称使用模式匹配，也用于提取\
  \ assigns。然后，我们使用 `Phoenix.View.render_many/4` 函数构建响应。files 和 folders 变量包含映射列表，这意味着我们本可以直接使用\
  \ files: files 而不是调用 render_many 函数。然而，这样做我们定义了文件或文件夹在 JSON 请求中的表示方式，一旦此视图模块中有更多动作，就能消除重复。除了这些列表之外，render_many\
  \ 函数还接收一个模块名称，在这两种情况下我们都将其设置为 `__MODULE__`，因为文件和文件夹的 render 函数都定义在当前模块中。下一个参数是模板名称，我们为文件和文件夹相应地设置它。最后，最后一个参数是\
  \ assigns 映射，它是可选的。对于文件夹，我们传递了 :as 选项并使用 :folder，这定义了提供给 render 函数的 assign 的名称（我们在\
  \ \"file.json\" 和 \"folder.json\" 模板的 render 函数中对其进行模式匹配）。默认情况下，Phoenix 会从当前视图模块名称推断名称。我们不需要指定名称，因为我们位于\
  \ FileView 模块内，Phoenix 会为我们推断。然而，对于文件夹这是必要的。\n\n现在分析最后两个函数，我们可以看到它们被用来定义文件或文件夹的表示。我们只是构建一个映射，其中包含我们感兴趣显示的键，并从每个资源中获取相应的信息。由于这是\
  \ index 动作，我们使用 render_many 函数遍历这些资源并呈现每一个。\n\n\n\n为了实现 show 操作，即我们想要展示单个资源，可以使用\
  \ `render_one` 函数，它与 `render_many` 函数非常相似，但不同于接收一个列表并渲染其中的每个元素，它只是渲染一个资源。\n\n此时，对于文件控制器的\
  \ index 操作，我们的 JSON API 已完全可用！我们现在可以向 API 发出请求，它将为我们硬编码的用户 ID 渲染文件和文件夹。我们目前还没有让用户在\
  \ API 中进行身份验证的方式，这正是我们在下一节要解决的问题。\n\n## 在 API 中对用户进行身份验证\n\n我们现在将了解如何为本节中创建的 API\
  \ 添加身份验证。我们将实现基于会话的身份验证，这可能不是在 API 中对用户进行身份验证最常见的方式——最常见的是基于令牌的身份验证。然而，我们想展示如何将我们为\
  \ HTML 请求构建的内容移植过来。此外，我们将在下一节演示如何在 Phoenix 中使用令牌进行身份验证，当我们为频道加入添加身份验证时。照常，让我们先来看一下更新后的路由器：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/router.ex\n\ndefmodule ElixirDripWeb.Router\
  \ do\n  # ...\n\n  pipeline :api do\n    plug(:accepts, [\"json\"])\n    plug(:fetch_session)\n\
  \    plug(FetchUser)\n  end\n\n  # ...\n\n  scope \"/api\", ElixirDripWeb.Api, as:\
  \ :api do\n    pipe_through(:api)\n\n    get(\"/files\", FileController, :index)\n\
  \n    post(\"/sessions\", SessionController, :create)\n    delete(\"/sessions\"\
  , SessionController, :delete)\n  end\nend\n```\n\n首先，我们更新了 :api pipeline，除了接受 JSON\
  \ 请求外，它现在还会获取会话和 cookie（使用 :fetch_session plug），最后调用我们创建的 FetchUser plug，如果会话中存在有效的\
  \ :user_id，它会将当前用户加载到连接中。\n\n我们还在 API 作用域中添加了两条路由，一条允许用户登录（post 路由），另一条允许用户注销（delete\
  \ 路由）。让我们继续并查看 API 会话控制器的代码：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/api/controllers/\n\
  session_controller.ex\n\ndefmodule ElixirDripWeb.Api.SessionController do\n  use\
  \ ElixirDripWeb, :controller\n\n  alias ElixirDrip.Accounts\n  alias ElixirDripWeb.Plugs.Auth\n\
  \n  def create(conn, %{\"username\" => username, \"password\" => password}) do\n\
  \    with {:ok, user} <- Accounts.login_user_with_pw(username, password) do\n  \
  \    conn\n      |> Auth.login(user)\n      |> render(\"login.json\", user: user)\n\
  \    else\n      _ ->\n        conn\n        |> put_status(:unauthorized)\n    \
  \    |> render(ElixirDripWeb.ErrorView, \"401.json\", message:\n        \"Invalid\
  \ username/password combination.\")\n        |> halt()\n    end\n  end\n\n  def\
  \ delete(conn, _params) do\n    conn\n    |> Auth.logout()\n    |> render(\"logout.json\"\
  )\n  end\nend\n```\n\n该模块中的逻辑与我们之前创建的会话控制器中的逻辑非常相似。要登录，我们使用 Accounts.login_user_with_pw/2\
  \ 函数，然后调用本章之前见过的 Auth.login/2 函数，它会将当前用户放入会话中。最后，我们渲染 \"login.json\" 模板，并将当前用户作为\
  \ assign 传递。如果登录不成功，我们会以与之前对 \"400.json\" 模板解释相同的方式，从 ErrorView 模块渲染 \"401.json\"\
  \ 模板。\n\n注销由 delete 操作处理，它仅调用 Auth.logout/1 函数，该函数会丢弃当前会话然后渲染 \"logout.json\" 模板。\n\
  \n现在让我们看看与此控制器配对的视图代码：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/api/views/session_view.ex\n\
  \ndefmodule ElixirDripWeb.Api.SessionView do\n  use ElixirDripWeb, :view\n\n  def\
  \ render(\"login.json\", %{user: user}) do\n    %{response: \"Logged in as #{user.username}\"\
  }\n  end\n\n  def render(\"logout.json\", _assigns) do\n    %{response: \"Logged\
  \ out\"}\n  end\nend\n```\n\n该模块包含从我们之前看到的控制器调用的 render 函数。与我们在 API 文件视图中所做的那样，我们只是使用映射来构建将返回给用户的响应。我们现在已经完成了在\
  \ API 中处理登录和注销的逻辑。此时，我们只缺少一件事：一种限制内容仅对已登录用户可见的方式。我们将遵循基于浏览器的身份验证的相同方法，并在文件控制器中调用我们的\
  \ Auth plug。以下是 API 文件控制器的更新代码：\n\n```\ndefmodule ElixirDripWeb.Api.FileController\
  \ do\n  # ...\n\n  plug ElixirDripWeb.Plugs.Auth, :json\n\n  # ...\nend\n```\n\n\
  与 HTML 文件控制器一样，我们在执行此控制器的任何操作之前调用 Auth plug，本质上要求所有操作都需要已登录用户。然而，有一个区别，我们向 plug\
  \ 传递了一个参数 :json。此更新是必需的，因为我们已更新 Auth plug 以处理 HTML 和 JSON 请求。因此，在调用它时我们需要提供此选项。对应的更新已在\
  \ HTML 文件控制器中完成，向 Auth plug 传递 :html。让我们检查此 plug 的更新版本：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/plugs/auth.ex\n\
  \ndefmodule ElixirDripWeb.Plugs.Auth do\n```\n\n```elixir\n# ...\n\ndef init(format),\
  \ do: format\n\ndef call(conn, format) do\n  case conn.assigns[:current_user] do\n\
  \    nil -> logged_out(conn, format)\n    _ -> conn\n  end\nend\n\n# ...\n\ndefp\
  \ logged_out(conn, :html) do\n  conn\n  |> put_flash(:error, \"You need to be logged\
  \ in to view this content.\")\n  |> halt()\n  |> redirect(to: page_path(conn, :index))\n\
  end\n\ndefp logged_out(conn, :json) do\n  conn\n  |> put_status(:unauthorized)\n\
  \  |> halt()\n  |> render(ElixirDripWeb.ErrorView, \"401.json\", message:\n    \"\
  Unauthenticated user.\")\nend\nend\n```\n\n处理已登录用户的逻辑没有改变。如果 conn.assigns 中存在当前用户，我们只需返回未修改的连接。只有在需要处理未登录用户时，请求的格式才变得必要。正如本章开头所见，传递给模块\
  \ plug 的选项随后作为 call/2 函数的第二个参数。现在，我们使用该参数并将其传递给 logged_out/2 函数。我们使用模式匹配来相应地处理每种请求格式。对\
  \ HTML 请求的未登录用户处理是我们在此模块中已有的功能；我们只是将其提取到此函数中。新部分是对 JSON 请求的未登录用户处理。在这种情况下，我们为响应设置正确的状态码，中断\
  \ Plug 管道，然后渲染错误视图，并将 \"Unauthenticated user.\" 作为 message assign 传递。\n\n我们将通过实际操作来结束本节。首先，我们发出请求列出当前用户在根路径\
  \ ($) 的文件（对 `api/files?path=$` 的 GET 请求）。由于我们尚未登录，我们收到的响应如下：\n\n```\n{\n  \"error\"\
  : \"Unauthenticated user.\"\n}\n```\n\n现在让我们通过向 `api/sessions` 发出 POST 请求来登录，并在请求体中传递用户名和密码。对此请求，我们收到的响应如下：\n\
  \n```\n{\n  \"response\": \"Logged in as gcaixinha\"\n}\n```\n\n如果我们重复列出文件的请求，现在会看到：\n\
  \n```\n{\n  \"response\": {\n    \"folders\": [\n      {\"size\": 1034634, \"name\"\
  : \"def\", \"files\": 2}\n    ],\n    \"files\": [\n      {\"size\": 115814, \"\
  name\": \"abc.ex\", \"id\": \"14...PZ\", \"full_path\": \"$\"}\n    ]\n  }\n}\n\
  ```\n\n这是为我们的用户渲染的 JSON 文件列表！如果我们想注销，只需向 `api/sessions` 发出 DELETE 请求即可。至此，我们已完成了对\
  \ Phoenix 中 JSON API 的巡览。我们现在将进入本章的最后一节，在那里我们将使用著名的 Phoenix Channels 为我们的应用程序添加交互性。\n\
  \n## 使用频道实现交互式应用程序\n\n到目前为止，我们一直在探索如何使用 Phoenix 构建传统的 Web 应用程序，其中服务器接收请求并返回响应。请求彼此隔离，服务器有责任保持与每个客户端的对话状态。这一直是大多数\
  \ Web 应用程序的构建方式，因为它使我们能够轻松扩展它们。由于每个请求都是无状态的，服务器始终可以将它们视为新的请求，从而使我们能够水平扩展应用程序。\n\n\
  \n\n在本节中，我们将重点关注为我们的应用程序添加通道，正如本章中我们将看到的那样，这显著简化了交互式应用程序的实现。与我们已经描述过的传统请求/响应流程（贯穿本章）不同，使用通道时，客户端与服务器之间会建立永久连接，该连接仅在其中一方退出或崩溃时才会被关闭。打开网页时，浏览器将连接到服务器上的一个通道，服务器会为每个客户端维护一个单独的进程。\n\
  \n此连接随后保持打开状态，允许客户端和服务器相互发送消息。这些消息通常被称为 *事件*。由于连接保持打开，我们在客户端和服务器之间进行有状态的对话。\n\n\
  从根本上说，Phoenix 通道是两个参与者之间的对话。正如我们所说，通信是双向的，因此消息的发送方和接收方可以随时切换角色。一次对话始终围绕一个主题展开，发送方在该主题上广播消息，接收方订阅该主题以获取这些消息。发送方和接收方都可能参与任意数量的主题。双向通信为我们的应用程序提供了很大的灵活性。与传统的请求/响应流程中客户端必须发起请求才能渲染内容不同，现在服务器只需在通道中发出一个事件，交付后客户端即可相应地采取行动。我们将在本节中看到一些示例。\n\
  \n这种解决方案并未被广泛采用，因为大多数 Web 服务器根本无法为每个客户端保持一个连接打开。Phoenix 利用了本书中描述的所有 Erlang 运行时特性，使我们能够做到这一点。Phoenix\
  \ 核心团队进行了一些基准测试，最终在单台服务器上实现了两百万个通道同时打开（更多细节请参见此处：http://phoenixframework.org/blog/the-road-to-2-million-websocket-connections）。该基准测试并不算新，博客文章发布于\
  \ 2015 年 11 月。尽管如此，这一惊人的数字表明 Phoenix 提供了一个能够实现这种架构的基础。\n\n在本节中，我们将把所有这些应用到我们的 ElixirDrip\
  \ 应用程序中，使用通道向用户发送下载准备就绪的通知，并提供下载文件的链接。正如我们在构建上传和下载文件的管道时所看到的，这些操作是异步的。每个管道的最后一步是调用\
  \ `Notifier` 模块，该模块负责通知相应用户操作（上传或下载）已完成。为了演示这一点，我们在文件控制器上实现了 `enqueue_download`\
  \ 和 `download` 动作，与本章前面展示的类似。现在让我们开始，先为通道准备服务器。\n\n## 准备服务器\n\n我们现在将调整服务器以允许客户端使用\
  \ Phoenix Channels 连接。与传统 Web 应用程序一样，我们的旅程始于 endpoint。当 Phoenix 生成 endpoint 模块时，它包含了以下行：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/endpoint.ex\n\ndefmodule ElixirDripWeb.Endpoint\
  \ do\n  # ...\n\n  socket(\"/socket\", ElixirDripWeb.UserSocket)\n\n  # ...\nend\n\
  ```\n\n`Phoenix.Endpoint.socket/2` 定义了 socket 处理程序的挂载点，其中将包含通道定义。在这种情况下，我们说想要连接到通道的客户端可以连接到\
  \ `/socket` 路径，该路径将由我们作为第二个参数传递的模块处理。现在让我们看看该模块的代码：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/channels/user_socket.ex\n\
  \ndefmodule ElixirDripWeb.UserSocket do\n  use Phoenix.Socket\n\n  ## Channels\n\
  \  channel \"users:*\", ElixirDripWeb.UserChannel\n\n  ## Transports\n  transport(:websocket,\
  \ Phoenix.Transports.WebSocket)\n  # transport :longpoll, Phoenix.Transports.LongPoll\n\
  \n  def connect(_params, socket) do\n    {:ok, socket}\n  end\n\n  def id(_socket),\
  \ do: nil\nend\n```\n\n首先，此模块定义了应用程序公开的通道。传递给 `channel` 函数（从 `Phoenix.Socket` 模块导入）的第一个参数是主题匹配模式。按照惯例，主题通常采用某种应用程序概念，然后是冒号，后跟该概念的\
  \ ID。在我们的例子中，由于我们将让每个用户通过自己的通道连接到服务器，因此我们创建了 `\"users:*\"` 匹配主题。这只是一个约定；你的主题也可以只是纯字符串，并且订阅了该主题的每个客户端都会收到该主题上的广播。传递给\
  \ `channel` 函数的第二个参数是模块，该模块将处理与此主题相关的事件的生命周期。可以说，该模块是通道的路由器，将每个主题映射到相应的处理器，在这种类比中即控制器。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_395_0.png)\n\n`channel` 函数有一个 `:via`\
  \ 选项，用于定义在此通道上接受的传输适配器。默认值是 `[:websocket, :longpoll]`。例如，如果你只想允许特定通道使用 WebSocket\
  \ 协议连接，可以将 `via: [:websocket]` 作为最后一个参数传递给 `Phoenix.Socket.channel/3` 函数。\n\nPhoenix\
  \ 生成器创建了以下两行，与 `Transports` 相关。这些定义了传输协议，将在通道上交换事件时使用。默认情况下，它附带 `WebSocket` 传输处于活动状态，而长轮询被注释掉。无论传输机制如何，最终结果都相同。随着我们在应用程序中添加或删除传输协议，我们的通道代码无需更改。传输仅提供客户端连接的方式，与通道的逻辑无关。如今，大多数\
  \ Web 浏览器都支持 WebSockets，但你可以取消长轮询传输的注释以支持通过不同机制连接的旧浏览器——仍然通过我们定义的通道运行。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_395_1.png)\n\
  \n如果你有特殊需求，可以通过实现 `Phoenix.Socket.Transport` behaviour 来构建自己的传输机制。\n\n然后，我们在此模块中有两个函数：`connect/2`\
  \ 和 `id/1`。`connect` 函数决定是否允许客户端连接。目前，我们简单地返回 `{:ok, socket}`，本质上允许所有连接通过。本节后面我们将处理身份验证，并更新此函数。`id`\
  \ 函数接收 `connect` 返回的 socket，并根据 socket 中存储的一些信息来标识 socket，通常将连接绑定到特定用户。\n\n目前，我们只是返回\
  \ nil，因为我们还没有身份验证。与 connect 函数一样，我们将在处理身份验证时稍后重新审视它。现在让我们继续查看用户通道模块，该模块是 `\"users:*\"\
  ` 主题的处理程序：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/channels/user_channel.ex\n\
  \ndefmodule ElixirDripWeb.UserChannel do\n  use ElixirDripWeb, :channel\n\n  def\
  \ join(\"users:\" <> user_id, _params, socket) do\n    {:ok, assign(socket, :user_id,\
  \ user_id)}\n  end\nend\n```\n\n我们看到了通道的第一个回调：join/3。当用户想要加入我们正在模式匹配的主题时，此函数会被调用，并且可用于决定是否允许客户端加入。同样，我们只是让所有人进入。注意我们如何使用函数子句上的二进制模式匹配来提取\
  \ user_id。然后，我们调用 `Phoenix.Socket.assign/3` 函数在 socket 中保存一些状态。这与我们对连接所见的工作方式类似。assign\
  \ 函数将返回更新后的 socket，这意味着我们实际上返回的是 `{:ok, socket}`，从而允许客户端加入此主题。与传统请求/响应流程中在返回响应时被转换并销毁的连接不同，socket\
  \ 在循环中被转换；只要连接可用，socket 的状态就可用。这样，被处理的每个事件都可以访问 socket 的更新状态，使客户端与服务器之间的对话具有状态。\n\
  \n除了 join 回调之外，Phoenix Channels 还必须实现 terminate/2、handle_in/3 和 handle_out/3。terminate/2\
  \ 回调在连接终止时被调用，接收错误原因和 socket。这可能由于多种原因发生，例如客户端离开或连接关闭。如果需要，你可以使用此回调执行一些清理工作。我们将在本节后面探索另外两个回调。有了这些设置，我们的服务器就可以接受连接并让用户加入通道。现在让我们看看客户端需要做什么。\n\
  \n\n\n## 在客户端加入频道\n\n在服务器准备就绪后，我们现在将探索 Phoenix Channels 的客户端部分。首先，我们将快速浏览 Phoenix\
  \ 为我们生成的结构，然后再看看如何对其进行更新。我们应用程序布局中，在 body 关闭之前的最后一行是：\n\n```\n<script src=\"<%=\
  \ static_path(@conn, \"/js/app.js\") %>\"></script>\n```\n\n这需要 app.js 文件，该文件存储在\
  \ apps/elixir_drip_web/assets/js/app.js 中。这是我们 JavaScript 代码的入口点。现在让我们分析其内容：\n\n\
  ```\n$ cat apps/elixir_drip_web/assets/js/app.js\n\nimport \"phoenix_html\"\nimport\
  \ socket from \"./socket\"\n\nimport Notification from \"./notification\"\nNotification.init(socket,\
  \ window.userId)\n```\n\n前两行由 Phoenix 生成，而最后两行由我们创建。除了导入一些处理 HTML 的通用辅助函数外，我们还在导入\
  \ socket 对象。我们可以在这里看到它的代码：\n\n```\n$ cat apps/elixir_drip_web/assets/js/socket.js\n\
  \nimport {Socket} from \"phoenix\"\n\nlet socket = new Socket(\"/socket\", {\n \
  \ params: {token: window.userToken},\n  logger: (type, message, data) => { console.log(`${type}:\
  \ ${message}`, data) }\n})\n\nexport default socket\n```\n\nPhoenix 自带了一个 socket\
  \ 实现，我们在第一行导入它。然后，我们实例化它，传入接受 socket 连接的路径（我们在服务器上定义的那个）。我们还将一个对象作为第二个参数传入。logger\
  \ 键只是定义了一个有用的调试消息，它将被打印到浏览器控制台。params 键包含将作为参数传递给服务器的内容。我们已经将 token 传递给服务器，但目前会被忽略。它包含在这里是因为\
  \ Phoenix 生成了这段代码，并且它正是我们用于执行身份验证的内容。正如我们所见，使用 Phoenix JavaScript channel 客户端的 socket\
  \ 定义非常简单。\n\n让我们看看我们的最后一个 JavaScript 文件，其中包含与通知相关的逻辑：\n\n```\n$ cat apps/elixir_drip_web/assets/js/notification.js\n\
  \nlet Notification = {\n  init(socket, userId) {\n    socket.connect()\n\n    let\
  \ userChannel = socket.channel(\"users:\" + userId)\n\n    userChannel.join()\n\
  \      .receive(\"ok\", resp => { console.log(\"Joined successfully\", resp) })\n\
  \      .receive(\"error\", reason => { console.log(\"Unable to join\", reason) })\n\
  \  }\n}\n\nexport default Notification\n```\n\n在这里，我们创建了 Notification 对象，其职责是从 Phoenix\
  \ Channels 接收事件并在页面中呈现它们。目前，我们将重点关注连接到 socket 并加入频道。正如我们已经看到的，init 函数接收两个参数：socket\
  \ 和用户的 ID。socket 是我们在之前分析过的对象。用户 ID，正如我们在 app.js 中看到的，是作为 window.userId 传递的。这是因为我们在应用程序布局中，在\
  \ require app.js 文件之前添加了以下行：\n\n```\n<script>window.userId = \"<%= assigns[:user_id]\
  \ %>\"</script>\n```\n\n这一行从连接的 assigns 中获取 :user_id，该 assigns 是本章中我们已创建的 plugs\
  \ 设置的。我们需要用户的 ID，因为它将用于标识主题，从而允许我们加入频道。这样，我们的应用程序中的每个用户都将拥有一个单独的频道。继续分析 Notification\
  \ 对象，在连接到 socket 之后，我们定义用户频道，将频道的主题作为参数传入。最后，我们尝试使用上一行指定的主题加入频道，在用户频道上调用 join。然后我们打印一些有用的调试消息，显示此操作的结果。\n\
  \n在此代码就位后，如果你打开浏览器控制台并访问我们应用程序中的页面，你将看到类似以下的输出：\n\n```\ntransport: connected to\n\
  ws://localhost:4000/socket/websocket?token=&vsn=2.0.0\nJoined successfully\n```\n\
  \n我们现在已通过 Phoenix channel 使用 WebSocket 协议连接到服务器。在完成连接步骤后，我们现在准备好开始在频道中交换事件。\n\n\
  ## 交换事件\n\n在建立频道连接后，我们现在可以专注于在频道上发送和接收事件。对于上传和下载管道来说，最后一步都是 notifier，它负责通知用户其上传/下载已完成。现在，我们需要修改此步骤以调用\
  \ ElixirDripWeb 伞形应用程序，以便发出通知用户其操作已完成的事件。以下是 notifier 步骤的更新代码：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/notifier.ex\n\
  \ndefmodule ElixirDrip.Storage.Pipeline.Notifier do\n  # ...\n\n  defp notify_step(%{media:\
  \ %{id: id}, user_id: user_id, type: :download})\n  do\n    ElixirDripWeb.Notifications.notify(:download,\
  \ id, user_id)\n  end\n\n  # ...\nend\n```\n\n当我们到达下载管道的末尾时，我们现在调用 ElixirDripWeb.Notifications.notify/3\
  \ 函数。现在让我们看看这个新创建的模块的代码：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/notifications/notifications.ex\n\
  \ndefmodule ElixirDripWeb.Notifications do\n  use GenServer\n  import ElixirDripWeb.Router.Helpers,\
  \ only: [file_path: 3]\n  alias ElixirDripWeb.Endpoint\n\n  def start_link do\n\
  \    GenServer.start_link(__MODULE__, :ok, name: __MODULE__)\n  end\n\n  def init(:ok)\
  \ do\n    {:ok, []}\n  end\n```\n\n```elixir\ndef notify(:download, id, user_id)\
  \ do\n  GenServer.cast(__MODULE__, {:download, id, user_id})\nend\n\ndef handle_cast({:download,\
  \ id, user_id}, state) do\n  link = file_path(Endpoint, :show, id) <> \"/download\"\
  \n  Endpoint.broadcast(\"users:#{user_id}\", \"download\", %{link: link,\n  message:\
  \ \"Your download is ready. Start it by clicking here.\"})\n  {:noreply, state}\n\
  end\nend\n```\n\n这是一个普通的 GenServer，其中 notify 函数调用 GenServer.cast，而它又将被旁边的 handle_cast\
  \ 函数回调处理。在此回调内部，我们首先使用其 ID 构建文件下载的链接。然后，我们调用 Endpoint.broadcast，将主题、事件和消息（必须是可以序列化的\
  \ map）作为参数传入。在这种情况下，事件是 \"download\"，消息通知用户下载已准备就绪。\n\n在这种情况下，我们需要传递主题，因为我们在 channel\
  \ 模块之外广播消息，这意味着我们没有 socket 的引用。对于这些情况，Phoenix.Endpoint 模块提供了 broadcast 回调，它允许我们在无需传递\
  \ socket 的情况下，通过提供主题来广播消息。我们很快将看到从用户 channel 模块广播事件的示例。\n\n当我们广播消息时，它将发送给所有对该主题感兴趣并连接到我们服务器的客户端。在实际完成之前，我们可能会在事件发送前拦截它，从而允许我们自定义负载甚至完全不发送它。这是通过在\
  \ channel 模块上调用 Phoenix.Channel.intercept/1 函数并实现相应的 handle_out/3 回调来完成的。虽然这在处理事件时提供了更大的灵活性，但请注意，这可能会严重影响应用程序的性能。在拦截消息时，广播将被编码的次数与该主题的订阅者数量相同，而不是在不拦截事件时仅进行一次编码。\n\
  \n最后，我们想指出，如果我们的应用程序部署在多个连接的节点上，其他节点链接的客户端也会接收到广播事件，因为 Phoenix 使用 Phoenix.PubSub\
  \ 在同一集群的节点之间中继事件。由于我们现在已在服务器上发出事件，让我们查看客户端接收此事件所需的更改：\n\n```\n$ cat apps/elixir_drip_web/assets/js/notification.js\n\
  \nlet Notification = {\n\n```\ninit(socket, userId) {\n  // ...\n  let infoArea\
  \ = document.getElementById(\"notify_info\")\n  let successArea = document.getElementById(\"\
  notify_success\")\n  userChannel.on(\"download\", ({link, message}) =>\n    this.renderDownloadNotification(infoArea,\
  \ successArea, message,\n    link))\n  },\n  renderDownloadNotification(infoArea,\
  \ successArea, message, link) {\n    infoArea.innerHTML = \"\"\n    successArea.innerHTML\
  \ = `<a href=\"${link}\">${message}</a>`\n  }\n}\n\nexport default Notification\n\
  ```\n\n我们已更改应用程序布局，为闪现消息元素添加 ID，以便在 init 函数中获取它们。获取这些元素后，我们可以看到如何在用户频道上定义事件处理程序。我们在上面调用\
  \ on 函数，传入我们将处理的事件名称和一个 lambda，每当接收到此类事件时就会调用该 lambda。请注意，lambda 将接收我们在广播消息上定义的关键字的取值作为参数——在此示例中为\
  \ link 和 message。在 lambda 内部，我们只是调用 renderDownloadNotification 函数，它将在 successArea\
  \ 元素中显示一个链接。在此之前，我们会清空 infoArea 元素，以便之前的闪现消息消失，我们只显示当前正在渲染的通知。\n\n让我们通过一些截图来看一下这一切的实际效果。当我们点击“Download\
  \ File”按钮时，会显示一条闪现消息，告知我们下载已排队，链接很快就会出现：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_402_0.png)\n\
  \n这将触发下载管道，其中包括从 Google Cloud Storage 下载文件、解密它并将其内容存储在内存中。最后一步是通知器，它将调用我们之前见过的 GenServer\
  \ 模块。该模块反过来会向当前用户的频道广播“download”事件，提供下载文件的链接。以下截图显示了此通知的显示方式，为用户提供下载文件的链接：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_402_1.png)\n\
  \n在结束本节并转到 socket 连接认证之前，让我们看看如何从客户端发送事件。为此，我们将创建允许用户与其他用户共享文件的功能。这将完全由频道驱动，路由器或控制器无需任何更改。\n\
  \n我们在文件的 show 操作中添加了一个按钮，并将该按钮的回调定义为以下函数：\n\n```\n$ cat apps/elixir_drip_web/assets/js/notification.js\n\
  \nlet Notification = {\n  // ...\n  sharePopUp(userChannel) {\n    let username\
  \ = prompt(\"Share file with:\", \"username\")\n    if (username != null && username\
  \ != \"\") {\n      let splitUrl = window.location.href.split('/')\n      let fileId\
  \ = splitUrl.pop() || splitUrl.pop()\n\n      userChannel.push(\"share\", {username:\
  \ username, file_id: fileId})\n    }\n  }\n}\n\nexport default Notification\n```\n\
  \n此函数接收 userChannel 参数，即我们在本文件中之前创建的频道。我们首先渲染一个提示，以便用户可以输入将与之共享此文件的用户的用户名。然后，我们有几行代码用于从当前路径中提取文件\
  \ ID。这只是对重要函数调用的准备工作：最后，我们向 userChannel 推送一个 share 消息。我们提供事件名称以及共享所需的必要参数。这将在当前用户的频道上发出事件。现在让我们看看如何在服务器上处理此事件。我们需要调整用户频道模块：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/channels/user_channel.ex\n\
  \ndefmodule ElixirDripWeb.UserChannel do\n  # ...\n  alias ElixirDripWeb.Endpoint\n\
  \  alias ElixirDrip.{Accounts, Storage}\n\n  def handle_in(\"share\", %{\"username\"\
  \ => username, \"file_id\" =>\n  file_id}, socket) do\n    sharee = Accounts.get_user_by_username(username)\n\
  \    case sharee do\n      nil -> broadcast_sharee_not_found(socket, username)\n\
  \      _ -> share_file(socket, socket.assigns.user_id, file_id, sharee)\n    end\n\
  \n{:noreply, socket}\nend\n\ndefp share_file(socket, owner_id, file_id, sharee)\
  \ do\n  case Storage.share(owner_id, file_id, sharee.id) do\n    {:ok, _media_owners}\
  \ ->\n      broadcast_to_owner(socket, sharee.username)\n      broadcast_to_sharee(sharee.id,\
  \ socket.assigns.user_id)\n    {:error, _reason} ->\n      broadcast_error_to_owner(socket,\
  \ sharee.username)\n  end\nend\n\ndefp broadcast_to_owner(socket, sharee_username)\
  \ do\n  broadcast(socket, \"share\", %{message: \"Successfully shared the file with\
  \ #{sharee_username}.\"})\nend\n\ndefp broadcast_to_sharee(sharee_user_id, owner_user_id)\
  \ do\n  owner = Accounts.find_user(owner_user_id)\n  Endpoint.broadcast(\"users:#{sharee_user_id}\"\
  , \"share\", %{message:\n  \"#{owner.username} has just shared a file with you!\"\
  })\nend\n\ndefp broadcast_sharee_not_found(socket, username) do\n  broadcast(socket,\
  \ \"share\", %{message: \"Couldn't find a user with #{username} username.\"})\n\
  end\n\ndefp broadcast_error_to_owner(socket, username) do\n  broadcast(socket, \"\
  share\", %{message: \"Couldn't share the file with #{username}.\"})\nend\nend\n\
  ```\n\n我们使用 handle_in 回调来处理服务器上的事件（这些事件可能来自客户端甚至另一个服务器）。我们在事件名称上进行模式匹配，也对执行此操作所需的参数进行模式匹配。请注意，此示例的规模相当大，但与频道相关的代码非常小。我们有代码来处理数据库中不存在的用户名，也处理共享文件时可能发生的错误（例如，文件已与该用户共享）。\n\
  \n让我们回顾一下此示例的高层逻辑。我们尝试查找具有提供用户名的用户，成功后，我们尝试与该用户共享文件。如果此操作也成功，我们将发出两个事件：一个针对拥有者用户，通知文件已成功共享；第二个针对我们共享文件的用户（被共享者），通知有人与他/她共享了文件。每当尝试共享文件时出现错误，我们仅向拥有者用户发出事件，通知文件共享未发生。在此截图中，我们可以看到两个用户之间成功共享的结果，以及他们收到的通知：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_405_0.png)\n\n两个用户之间成功共享的结果\n\n我们现在已经介绍了如何在\
  \ Phoenix 频道中交换事件。本节中我们为下载所做的管道和逻辑也应用于上传。你可以在随书附带的 ElixirDrip 应用程序的最终版本中查看。\n\n\
  在结束本节并转到为 socket 连接添加认证之前，我们想探讨在实时环境中使用频道的一些注意事项。虽然本书不涵盖如何处理网络分割和频道崩溃，但部署实际应用程序时考虑这一点很重要。这些事件最终会发生，你最好在设计应用程序时考虑到它们。好消息是\
  \ Phoenix 已经附带了一些有用的行为。例如，如果频道崩溃，Phoenix JavaScript 客户端将尝试使用指数退避策略重新连接到服务器，如果能够重新连接，它将尝试重新加入崩溃前订阅的主题。除此之外，你还应考虑网络错误情况下的消息传递保证（客户端和服务器）。官方\
  \ Phoenix Channels 指南，网址为 https://hexdocs.pm/phoenix/channels.html，包含了一些处理这些情况的有用提示。\n\
  \n## 认证 socket 连接\n\n到目前为止，我们一直允许应用程序的任何用户连接 socket，即使他们未经过认证。在这种情况下，由于 :user_id\
  \ 为 nil，他们都连接到 users: 主题。我们必须更新应用程序，以便只有已登录的用户才能连接 socket 并加入频道。在之前的章节中我们实现了基于会话的认证，这次我们将实现基于令牌的认证。这意味着我们将为每个已认证用户分配一个令牌，然后在用户想要连接\
  \ socket 时验证该令牌。\n\n当我们探索 apps/elixir_drip_web/assets/js/socket.js 中的代码时，我们看到我们已经使用\
  \ window.userToken 将令牌传递给服务器。让我们首先在应用程序布局中添加以下 script 标签，类似于我们为 window.userId 所做的操作：\n\
  \n```\n<script>window.userToken = \"<%= assigns[:user_token] %>\"</script>\n```\n\
  \n我们将此行添加到 window.userId 的那一行之后。现在，window.userToken 将保存 assigns[:user_token] 中的内容。现在让我们在有已登录用户时填充此\
  \ assign。为此，我们将使用以下内容更新本章前面创建的 FetchUser plug：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/plugs/fetch_user.ex\n\
  \ndefmodule ElixirDripWeb.Plugs.FetchUser do\n  # ...\n\n  defp assign_current_user(conn,\
  \ user) do\n    token = generate_token(conn, user.id)\n\n    conn\n    |> assign(:current_user,\
  \ user)\n    |> assign(:user_id, user.id)\n    |> assign(:user_token, token)\n \
  \ end\n\n  defp generate_token(conn, user_id) do\n    Phoenix.Token.sign(conn, \"\
  user socket auth\", user_id)\n  end\nend\n```\n\n\n\n在分配当前用户（即用户已登录）之前，我们调用 generate_token/2\
  \ 函数。该函数使用来自 Phoenix.Token 模块的 sign 函数。该函数接收连接、一个盐值和要编码的数据，并会创建一个签名令牌，我们将其绑定到 token\
  \ 变量。然后，在分配 :current_user 和 :user_id 键之后，我们还使用刚刚创建的令牌为 :user_token 键赋值。我们将连接作为第一个参数传递给\
  \ Phoenix.Token.sign/4 函数，这将使该模块使用配置在端点中的 :secret_key_base 对令牌进行签名，而该端点位于连接内部。我们同样可以轻松地直接传递端点或\
  \ secret key base 字符串。\n\n在完成此设置后，剩下的就是在用户尝试连接 socket 时验证此令牌。让我们看看更新后的 UserSocket\
  \ 模块：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/channels/user_socket.ex\n\
  \ndefmodule ElixirDripWeb.UserSocket do\n  # ...\n\n  @one_week_seconds 7 * 24 *\
  \ 60 * 60\n\n  def connect(%{\"token\" => token}, socket) do\n    case Phoenix.Token.verify(socket,\
  \ \"user socket auth\", token,\n    max_age: @one_week_seconds) do\n      {:ok,\
  \ user_id} -> {:ok, assign(socket, :user_id, user_id)}\n      {:error, _reason}\
  \ -> :error\n    end\n  end\n\n  def id(socket), do: \"users_socket:#{socket.assigns.user_id}\"\
  \nend\n```\n\n第一点不同之处在于，现在我们对第一个参数进行模式匹配，提取 \"token\" 参数的值。然后，我们使用 Phoenix.Token.verify/4\
  \ 函数验证用户提供的令牌。我们将 socket 作为第一个参数传递，它将被用来获取 secret key base——这与签名时使用的相同，因为端点相同。接下来需要注意的重要一点是，该函数可以接收\
  \ :max_age 选项（以秒为单位），允许我们在一定时间后使令牌过期。在此示例中，我们不接受超过一周的令牌，这意味着如果用户在过去一周内未登录，则无法连接到\
  \ socket。然后我们在 case 块内部使用模式匹配相应地处理每种情况。如果 verify 函数返回 {:ok, user_id}，我们接受连接，返回 {:ok,\
  \ socket}。我们已将 :user_id 在 socket 上的赋值移至此处，并从 UserChannel 模块中删除了它。当出现错误时，我们只需返回 :error，阻止该用户连接到\
  \ socket。最后，我们还更新了 id/1 函数，使其返回一个标识连接到此 socket 的用户的主题字符串。这样，我们就可以识别属于某个用户的所有 socket，例如，可以向该主题发送广播消息以终止特定用户的所有\
  \ socket 连接。\n\n现在，如果你在未登录的情况下打开浏览器控制台，你会看到一些错误消息，因为 socket 的连接失败了。如果你使用的是 Firefox，你会看到类似这样的错误消息：\n\
  \n```\nFirefox can't establish a connection to the server at\nws://localhost:4000/socket/websocket?token=&vsn=2.0.0.\n\
  ```\n\n此错误意味着我们已实现目标，只有已登录的用户才能连接到 socket。让我们继续本章的最后一部分，在其中将 Phoenix.Presence 整合到我们的\
  \ ElixirDrip 应用中。\n\n## 使用 Presence 跟踪用户状态\n\n为了完成本章，我们将快速了解一下如何向应用中添加在线用户列表，并在过程中展示使用\
  \ Phoenix Presence 实现这一功能是多么简单。该功能在 Phoenix 1.2 中发布，并构建在 Phoenix PubSub 和 Channels\
  \ 之上。Phoenix Presence 允许我们在主题上注册进程信息，该信息会在集群内部透明地复制。\n\nPresence 的一个特殊之处在于没有单一的事实来源，因此也没有单一的故障点。与之相比，在其他编程语言中，你可能会使用数据库（或其他中央组件）来存储每个用户的状态，而\
  \ Phoenix Presence 实现了使用无冲突复制数据类型（CRDT）跨集群节点同步状态的分布式 gossip 协议。这种方法相比中央数据存储有两个主要优势：你可以通过添加更多服务器来扩展系统，并且由于没有单一服务器保存数据，系统在出现故障（服务器崩溃或网络分区）时能够自我修复。正如\
  \ Chris McCord 所说，Phoenix 将前沿的计算机科学研究付诸实践！\n\n尽管 Presence 通常用于跟踪应用中用户的状态，这也是我们的示例，但它提供的抽象是通用的，使得该库可以在其他场景中使用。例如，Presence\
  \ 可用于服务发现。与 Channels 类似，Presence 结合了服务器端和客户端库。现在我们来看该功能的代码，首先从服务器端的更改开始。第一步是使用 Phoenix\
  \ 生成器，我们在 elixir_drip_web umbrella 应用的目录中运行它：\n\n```\napps/elixir_drip_web/$ mix\
  \ phx.gen.presence\n```\n\n此任务将在 apps/elixir_drip_web/lib/elixir_drip_web/ channels/presence.ex\
  \ 中创建一个文件，并且输出指示我们将新生成的模块添加到应用的监督树中。因此，我们在 children 变量中添加了 supervisor(ElixirDripWeb.Presence,\
  \ [])，该变量定义在 apps/elixir_drip_web/lib/elixir_drip_web/application.ex 中。让我们看看我们刚刚生成的\
  \ Presence 模块的代码：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/channels/presence.ex\n\
  ```\n\n```\ndefmodule ElixirDripWeb.Presence do\n  use Phoenix.Presence, otp_app:\
  \ :elixir_drip_web,\n                      pubsub_server: ElixirDripWeb.PubSub\n\
  end\n```\n\n通过调用 use Phoenix.Presence，我们设置该模块以拥有跟踪用户存在的所需函数。我们传递必要的配置，即 OTP 应用的名称以及\
  \ Presence 将使用的 PubSub 服务器。\n\n下一个更改在 user channel 模块中：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/channels/user_channel.ex\n\
  \ndefmodule ElixirDripWeb.UserChannel do\n  # ...\n  alias ElixirDripWeb.Presence\n\
  \  def join(\"users:lobby\", _auth_message, socket) do\n    send(self(), :after_join)\n\
  \    {:ok, socket}\n  end\n  def handle_info(:after_join, socket) do\n    push(socket,\
  \ \"presence_state\", Presence.list(socket))\n    user = ElixirDrip.Accounts.find_user(socket.assigns.user_id)\n\
  \    {:ok, _} =\n      Presence.track(socket, socket.assigns.user_id, %{\n     \
  \   username: user.username\n      })\n    {:noreply, socket}\n  end\nend\n```\n\
  \n我们定义了一个新的 join 回调，因为我们有一个名为 \"users:lobby\" 的新主题。迄今为止，我们为每个用户提供一个 channel。由于现在我们想要跟踪每个用户的存在，我们需要一个公共主题，在该主题中，channel\
  \ 的用户将被通知该 channel 上发生的加入和离开。在通过返回 {:ok, socket} 接受连接之前，我们向当前进程发送一条消息，该消息稍后将由 handle_info\
  \ 回调处理。这使得我们可以在 join 函数上保持较低的执行时间，因为它只需发送一条消息并接受连接，而 Presence 初始化则异步处理。\n\n在 handle_info\
  \ 回调中，我们首先向刚刚加入的用户发送一个事件，向其发送 presences 变量的当前状态（由 Presence.list/1 函数生成）。之后，我们调用\
  \ Accounts 上下文中的一个函数来获取 socket 中存在的 user_id 的用户，这将在稍后用于将用户名传递给 Presence.track/3\
  \ 函数。该函数告诉 Presence 模块开始跟踪当前用户。\n\n\n\n除了 socket 之外，`track` 函数还会接收一个用于标识我们正在跟踪的客户端的键（在我们的例子中是\
  \ `user_id`），以及一个包含我们可能想要为此连接跟踪的额外信息的映射。在我们的示例中，我们传递了该用户的用户名，以便稍后可以在客户端使用它来在在线用户列表中显示用户名。请注意，此信息不需要与用户模式相关。例如，我们也可以使用此映射来保存用户最后一次在线的时间戳。\n\
  \n在服务器端，为我们的应用程序添加 Presence 就只需要这些。让我们现在看看客户端。由于此逻辑与我们之前看到的通知没有真正关系，而且甚至使用的是不同的频道主题，在线用户列表位于不同的对象中。我们可以在这里看到它的代码：\n\
  \n```\n$ cat apps/elixir_drip_web/assets/js/online_users.js\n```\n\n```\nimport\
  \ {Presence} from \"phoenix\"\n\nlet OnlineUsers = {\n  init(socket) {\n    let\
  \ lobbyChannel = socket.channel(\"users:lobby\")\n    let presences = {}\n\n   \
  \ lobbyChannel.join()\n      .receive(\"ok\", resp => { console.log(\"Joined successfully\"\
  , resp) })\n      .receive(\"error\", reason => { console.log(\"Unable to join\"\
  , reason) })\n\n    lobbyChannel.on(\"presence_state\", state => {\n      presences\
  \ = Presence.syncState(presences, state)\n      this.renderOnlineUsers(presences)\n\
  \    })\n\n    lobbyChannel.on(\"presence_diff\", diff => {\n      presences = Presence.syncDiff(presences,\
  \ diff)\n      this.renderOnlineUsers(presences)\n    })\n  },\n\n  renderOnlineUsers(presences)\
  \ {\n    let response = \"\"\n\n    Presence.list(presences, (id, {metas: [user,\
  \ ...rest]}) => {\n      let count = rest.length + 1\n      response += `<li>${user.username}\
  \ (count: ${count})</li>`\n    })\n\n    document.getElementById(\"online_users\"\
  ).innerHTML =\n`<ul>${response}</ul>`\n  }\n}\n\nexport default OnlineUsers\n```\n\
  \n我们首先导入 Phoenix 提供的 Presence 库。然后，这段代码的第一部分与我们在上一节中看到的内容非常相似：我们加入之前提到的 \"users:lobby\"\
  \ 主题，并为该频道上发生的事件定义处理程序。特别是，我们关注两个事件：\"presence_state\" 和 \"presence_diff\"。\n\n\"\
  presence_state\" 事件会包含初始状态，并在用户加入频道时触发。\"presence_diff\" 事件在其他用户加入或离开频道时触发。Presence\
  \ 库包含两个函数来轻松处理这两个事件，称为 Presence.syncState 和 Presence.syncDiff。这些函数会保持 presences\
  \ 变量始终是最新的。\n\n在将事件负载与 presences 变量同步之后，在这两种情况下我们都会调用 renderOnlineUsers 函数来在浏览器中显示更新后的状态。此函数接收\
  \ presences 并遍历它们以构建在线用户列表。我们可以使用 Presence.list 函数轻松地遍历 presences。除了一个 Presences\
  \ 对象之外，此函数还接收一个回调函数，该函数会为每个 Presence 调用两次参数：Presence 的 ID 和一个 metas 列表。此列表将包含与同一\
  \ Presence ID 相同数量的项目。由于我们的 Presence ID 是 user_id，因此我们可以使用它来了解用户在线的设备数量。metas 列表中的每个元素都是一个对象，其中包含我们在用户频道模块中作为\
  \ track 函数的最后一个参数传递的额外信息。在这种情况下，我们使用额外信息来显示在线用户列表及其用户名（通过调用 user.username）。最后，我们更新\
  \ online_users 元素以渲染我们的列表，该元素是我们已添加到应用程序布局中的 div 元素。\n\n只需几段代码，我们的应用程序中就有了在线用户列表的工作版本，它会随着应用程序运行的服务器数量而扩展，并且在出现故障时也会自行恢复。让我们看一下它的实际运行截图：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_413_0.png)\n\n三个不同的浏览器窗口\n\n在此场景中，`gcaixinha`\
  \ 用户登录到两个不同的浏览器会话，而 `jalbuquerque` 用户登录到第三个浏览器会话。正如截图所示，每个用户都会获得正确的在线用户列表，并且 `gcaixinha`\
  \ 用户的计数显示为 2，因为他打开了两个会话。如果我们注销这些用户中的任何一个（或使用不同的用户登录），我们会看到在线用户列表相应地调整。随着在线用户列表的正常工作，我们已经到达本节的末尾。现在让我们总结一下，回顾本章最相关的要点。\n\
  \n## Summary\n\n在为我们的应用程序添加 Web 层的过程中，本章涵盖了很多内容。让我们回顾一下本章最重要的要点：\n\n- Phoenix 建立在\
  \ Plug 规范之上，该规范有两种形式：模块插件和函数插件。它们都接收一个连接并返回一个连接，可能在返回前对其进行修改。\n- 端点是我们 Web 应用程序所有请求开始的边界，默认情况下它包含一个对每个请求都运行的插件列表。\n\
  - 使用宏，Phoenix 中的路由器会被编译成高效的模式匹配。除了定义路由之外，我们还可以在路由器中创建管道，它是一组按顺序运行的插件。\n- 控制器操作是接收两个参数的函数：连接和请求的参数。通常，我们希望尽可能保持控制器代码尽可能简洁，调用其他模块并根据其响应渲染视图。\n\
  - 视图是带有渲染函数的普通模块。模板是从包含标记语言与 EEx 代码混合的文件编译成视图上的渲染函数。这种视图与模块之间的分离使我们能够以任何我们想要的形式渲染数据，无论是从常规的\
  \ Elixir 函数还是从模板引擎。\n- 基于会话的身份验证可以使用 Phoenix 随附的 `:fetch_session` 插件完成，我们可以使用它为每个请求加载会话。\n\
  - 连接的 assigns 提供了很大的灵活性，因为此功能允许我们在请求生命周期内保存状态，该状态将可供后续模块使用。我们看到了一些使用它的示例，例如在为应用程序添加身份验证时。\n\
  - Phoenix 路由器中的作用域是一种将路由分组在公共前缀路径下的方式。此外，我们能够指定模块前缀名称，从而为特定组的路由提供不同的控制器、视图和模板集合，就像我们在实现\
  \ JSON API 时所做的那样。\n- Phoenix channels 在我们构建应用程序的方式上是一个变革者，因为它们提供了一个简单且易于使用的抽象。在用户连接到我们的\
  \ socket 之后，连接保持打开状态，这使得客户端和服务器之间能够进行有状态的对话。你不需要努力去弄清请求的上下文，因为它保存在 socket 中。在这种模型中，你只需要发送和接收频道上的事件，并相应地对每个事件做出反应。\n\
  \n在下一章中，我们将处理一个经常被忽视但非常重要的主题：测试。随着 ElixirDrip 应用程序的完成，我们现在将看到如何从不同角度对其进行适当的测试。\n"
- "# 9 Finding Zen through Testing\n\n在功能方面，我们的 ElixirDrip 应用程序已经完成。然而，我们还没有任何测试，因此它实际上还不准备部署到实时环境。\n\
  尽管我们把测试留到了最后，但我们要指出，这并不是我们通常开发应用程序的方式。我们非常支持在构建应用程序功能的同时逐步创建测试。然而，我们认为这种方法会令人困惑，对本书的可读性弊大于利。\n\
  \n因此，我们在本章中汇总了我们将要探索的所有类型的测试。我们不会涵盖 ElixirDrip 的每个模块和函数，但我们将介绍测试此应用程序所需的所有概念。我们不会涵盖所有类型的测试——例如端到端测试——因为我们将重点关注在构建\
  \ Elixir 应用程序时更常用的测试类型。\n\n有一些测试原则在各种语言和框架中都是共享的。我们不会深入探讨每种原则的优点和缺点，因为这超出了本书的范围。尽管如此，让我们简要介绍一下适用于我们稍后将深入探讨的每种测试类型的一些原则：\n\
  \n- 测试应具有适当的隔离级别。在某些类型的测试中，我们希望使用模拟，而在其他类型中，我们希望测试所有真实组件之间的交互。\n- 测试结果应可重复。我们的测试套件的结果应该是确定的，因此不应依赖任何外部因素。测试套件中存在不稳定的测试会降低我们对它的信心，而这正是我们开始编写测试的最初原因。\n\
  - 运行整个测试套件应很快。*快* 的定义非常相对，但无论如何你都不应该考虑是否要运行它。它应该快到你会不断运行它，并获得非常短的反馈循环。\n\n\n\n\n\
  In this chapter, we'll cover the following topics:\n\n- Creating unit tests, with\
  \ and without mocks\n- Having separate repository tests, which will test the interaction\
  \ with the database\n- Using doctest to embed tests inside a function's documentation\n\
  - Writing integration tests, which verify that the application is working as a whole\n\
  - Creating tests for our Phoenix Channels, which verify the connection to the socket\
  \ and exchange of events work as expected\n- Testing macros in a maintainable way\n\
  - Creating property-based tests, and some considerations on how to integrate them\
  \ into an application\n\nLet's now write the first type of tests in our application:\
  \ unit tests.\n\n## Unit testing\n\nIn this section, we'll explore how to create\
  \ tests in Elixir, using ExUnit. We'll split it between tests that exercise functions\
  \ with and without side-effects, since we have different approaches for each type\
  \ of function. Let's begin by the simpler case: testing functions that don't have\
  \ side-effects.\n\n### Testing functions without side-effects\n\nA unit test exercises\
  \ a function from a certain module of the application. We might have more than one\
  \ test exercising the same function (with different inputs, for instance). Let's\
  \ begin by creating a simple test, which will allow us to analyze ExUnit in detail.\
  \ We'll be creating the tests for the is_valid_path? function, which belongs to\
  \ the ElixirDrip.Storage.Media module. For context, we present its implementation\
  \ as follows:\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/media.ex\n\
  defmodule ElixirDrip.Storage.Media do\n  # ...\n\n  def is_valid_path?(path) when\
  \ is_binary(path) do\n    valid? = String.starts_with?(path, \"$\" ) && !String.ends_with?\n\
  \    (path, \"/\")\n\n    case valid? do\n      true -> {:ok, :valid}\n        false\
  \ -> {:error, :invalid_path}\n    end\n    end\n\n    # ...\nend\n```\n\nThe logic\
  \ in this function is very straightforward: to validate a path, it checks if the\
  \ provided string starts with a $ and doesn't end with a /. Let's now see our first\
  \ test for this function:\n\n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/media_test.exs\n\
  defmodule ElixirDrip.Storage.MediaTest do\n  use ExUnit.Case, async: true\n\n  @subject\
  \ ElixirDrip.Storage.Media\n\n  test \"is_valid_path?/1 returns {:ok, :valid} for\
  \ a valid path\" do\n    path = \"$/abc\"\n\n    assert {:ok, :valid} == @subject.is_valid_path?(path)\n\
  \  end\nend\n```\n\nWe begin by calling use ExUnit.Case, which will make some macros\
  \ available in our test module. We're passing the async: true option, which will\
  \ make the tests in this module run concurrently. By default, the tests don't run\
  \ concurrently. Since in Elixir we generally try to write code that's side-effect\
  \ free, most of our tests will be able to run concurrently. Then we define a module\
  \ attribute, named @subject, which contains the module that we're testing. This\
  \ way, it's very clear which module is being tested, and also brings the benefit\
  \ of only needing to change one line in the event that we rename the module.\n\n\
  Let's now analyze the test macro, imported from ExUnit.Case. This macro receives\
  \ a string with the description for the test, and a block for the test code. In\
  \ this case, we're testing for when the path is valid. We then use the assert macro,\
  \ also from ExUnit.Case, to validate that the return value of the is_valid_path?\
  \ function is the expected one. Let's now run our test. Since we have an umbrella\
  \ application, running the tests in the root folder will target every application\
  \ inside the umbrella.\n\nFor now, we're only interested in the elixir_drip application,\
  \ so we change the working directory to apps/elixir_drip:\n\n```\n$ cd apps/elixir_drip\n\
  $ MIX_ENV=test mix test\n.\n\nFinished in 0.02 seconds\n1 test, 0 failures\n\nRandomized\
  \ with seed 69987\n```\n\nAs you can see, we run our tests with the mix test task.\
  \ Without any argument, it will run every test in our suite. You provide the path\
  \ to a test file to run the tests of a certain file, or even a path of a test file\
  \ with a colon and a line number suffixed, which will just run the test on that\
  \ line.\n\nIt's not mandatory to use the assert macro to check the outcome of each\
  \ test. We might as well just use plain old pattern matching to validate the return\
  \ values of our functions. However, we recommend the usage of the assert macro in\
  \ test cases, mainly because it'll yield better error messages when the tests fail,\
  \ allowing you to quickly understand what's going on. For instance, we've intentionally\
  \ made the previous test fail, by matching on {:ok, :validdd}. Running the test\
  \ with this change yields:\n\n![](img/c636f4cfb07f25f1db535995e50706ed_418_0.png)\n\
  \n```\n$ cd apps/elixir_drip\n$ MIX_ENV=test mix test\n1) test is_valid_path?/1\
  \ returns {:ok, :valid} for a valid path (ElixirDrip.Storage.MediaTest)\ntest/elixir_drip/storage/media_test.exs:6\n\
  Assertion with == failed\ncode: assert {:ok, :validdd} ==\n@subject.is_valid_path?(path)\n\
  left: {:ok, :validdd}\nright: {:ok, :valid}\nstacktrace:\ntest/elixir_drip/storage/media_test.exs:9:\
  \ (test)\nFinished in 0.02 seconds\n1 test, 1 failure\nRandomized with seed 69303\n\
  ```\n\nWe get both sides of the match we passed to assert, making it easy to understand\
  \ why the match failed.\n\nTo end this section, we'll test a different function\
  \ from the same module, which will allow us to explore ExUnit even further. We'll\
  \ test the create_initial_changeset/4 function, which is responsible for creating\
  \ the %Media{} changeset based on the provided attributes. Whereas in other frameworks,\
  \ you have the validation logic tightly coupled with the database, in Ecto, we're\
  \ able to test our validation logic as pure unit tests, which we're able to run\
  \ concurrently. This is possible because Ecto has a modular design, decoupling the\
  \ underlying database schema from the repository. Later in this chapter, we'll talk\
  \ about repository tests that will actually hit the database. For now, we'll just\
  \ focus on testing changesets.\n\nIn the previous test, the input data was created\
  \ inside the test itself. Now, we'll see how to use the setup macro to inject context\
  \ into our tests:\n\n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/media_test.exs\n\
  defmodule ElixirDrip.Storage.MediaTest do\n  use ExUnit.Case, async: true\n\n  @subject\
  \ ElixirDrip.Storage.Media\n\n  setup do\n    user_id = \"0ujsswThIGTUYm2K8FjOOXfXtY1K\"\
  \n    file_name = \"test.txt\"\n    full_path = \"$/abc\"\n    file_size = 123\n\
  \n    {:ok, user_id: user_id, file_name: file_name, full_path: full_path,\n    file_size:\
  \ file_size}\n  end\n\n  test \"create_initial_changeset/4 returns a valid changeset\"\
  , context do\n    changeset = @subject.create_initial_changeset(context.user_id,\n\
  \    context.file_name, context.full_path, context.file_size)\n\n    assert changeset.valid?\
  \ == true\n  end\n\n  # ...\nend\n```\n\nInside the setup block, we're creating\
  \ the variables we need and returning them in the block's response. This will be\
  \ injected into each test, and we can access it by binding it to a variable before\
  \ the test block. We could even use pattern matching here to extract a certain field\
  \ from the context map. Then, inside the test, we create a changeset with the context\
  \ data and use the assert macro to make sure the changeset is valid. This approach\
  \ allows us to define test data in only one place, which will then be shared by\
  \ all the tests in this module. The setup macro runs before each test. If you want\
  \ to run a certain block just once, for instance to initialize something that is\
  \ shared between the tests, you can use the setup_all macro.\n\nWhen creating unit\
  \ tests, we usually don't just cover the happy path, and also test the error cases.\
  \ Let's now create a test to check that a changeset isn't valid when we provide\
  \ incorrect data:\n\n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/media_test.exs\n\
  defmodule ElixirDrip.Storage.MediaTest do\n  # ...\n\n  describe \"when the file\
  \ name is invalid\" do\n    setup :invalid_file_name\n\n    test \"the changeset\
  \ isn't valid\", context do\n      changeset = @subject.create_initial_changeset(context.user_id,\n\
  \      context.file_name, context.full_path, context.file_size)\n\n      assert\
  \ changeset.valid? == false\n    end\n\n    test \"the changeset contains the expected\
  \ error message\", context do\n      changeset = @subject.create_initial_changeset(context.user_id,\n\
  \      context.file_name, context.full_path, context.file_size)\n\n      assert\
  \ changeset.errors == [file_name: {\"Invalid file name\", []}]\n    end\n  end\n\
  \n  # ...\n\n  defp invalid_file_name(_context) do\n    {:ok, file_name: \"a/bc\"\
  \ }\n  end\nend\n```\n\n\n\n我们使用 `describe` 函数来对具有相同上下文的测试进行分组。在此例中，我们为 `file_name`\
  \ 参数无效时创建了两个测试。在 `describe` 块内部，我们可以再次使用 `setup` 来为此测试用例准备上下文。在本示例中，我们还看到了一种不同的使用\
  \ `setup` 宏的方式。与之前示例中提供块不同，我们也可以提供一个原子，即本模块中用于设置所需上下文的函数名称。传递给 `setup` 的函数始终接收一个参数，即上下文映射，并返回可能被修改过的上下文。就像之前的示例一样，此上下文随后会被注入到\
  \ `describe` 块内的每个测试中。\n\n除了使用 `setup` 宏的不同之处外，此示例与前一个示例非常相似。我们使用上下文中的数据创建一个 `changeset`，然后对每个测试的预期进行断言。在本示例中，这是在检查\
  \ `changeset` 是否无效，并且包含预期的错误信息。\n\n我们想指出 `describe` 块的一个可能让你意外的特定方面：它们只能有一层。换句话说，不允许在其他\
  \ `describe` 块内部嵌套 `describe` 块。虽然这乍一看可能很奇怪，特别是如果你习惯在其他测试库中这样做，但这带来了很大的好处：每个测试的目的和上下文变得非常清晰。这是\
  \ Elixir 核心团队的有意决定，其理由是这些块中过多的嵌套会妨碍测试的可读性。你必须导航到最外层的块，将其上下文记在脑中，然后逐步向下移动直到找到期望的测试。通过不允许这种嵌套，ExUnit\
  \ 迫使我们在保持测试对其他人（或我们未来的自己）可理解的同时，使其更具描述性。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_421_0.png)\n\
  \n你可以向 `mix test` 任务传递 `--trace` 选项，以在测试运行时将每个测试的描述打印到终端。除了描述之外，你还可以获得每个测试完成的耗时。\n\
  \n我们现在已经到达本节的末尾。如你所见，通过将数据验证与存储库分离，我们能够并行运行与 `changeset` 函数交互的测试，因为这些函数没有副作用。然而，最终我们的应用程序中会包含一些具有副作用的函数。现在让我们探索如何为这些函数编写测试。\n\
  \n## 使用副作用的函数进行测试\n\n虽然我们在应用程序中力求编写纯函数，但这并不总是可能的。在本节中，我们将探讨如何测试具有副作用的函数。在大多数其他编程语言中，这是通过创建模拟来验证是否产生了正确的副作用来实现的。然而，在\
  \ Elixir 中，这类模拟尽可能被避免，因为它们通常依赖于全局更改某个模块或函数。这种更改使我们必须顺序运行测试，这会增加运行时间，从而从长远来看降低我们的生产力。\n\
  \n我们仍然会探讨如何在 Elixir 中创建模拟，但请注意它们的使用频率不如其他编程语言的测试框架那么高。如果你要测试的模块依赖于应用程序中另一个模块的简单纯函数，为它添加模拟有什么额外好处呢？这显然是我们每个人都必须处理的权衡，而走向另一个极端可能会导致冗余的覆盖以及所有相关问题。\n\
  \n无论你采用什么方法，某些情况下使用模拟可能是必要的。例如，当我们的应用程序联系外部实体时，我们可能希望创建一个模拟，以便测试不依赖于实际请求。我们现在将看到如何在\
  \ Elixir 中创建不改变全局状态的模拟，从而允许我们并发运行测试。\n\n## 使用 Mox 创建模拟\n\n如前所述，我们通常尽量避免在 Elixir\
  \ 中使用模拟，尤其是动态模拟（也称为临时模拟）。它们之所以被称为这样，是因为它们通常在每个测试内部动态创建，只是为了验证该测试上是否满足了某个期望。除了改变全局行为且不允许我们并发运行测试外，这类模拟还有另一个缺点：它们与所替代的真实实现没有任何关联，这使得模拟和真实实现可能逐渐脱节，可能导致所有测试都通过而你的应用程序在生产环境中却损坏。\n\
  \n出于所有这些原因，我们将使用由 José Valim 创建的 Mox 库来创建模拟，它试图解决前面描述的问题。在 Elixir 中创建模拟还有其他选择，但我们认为这是最符合\
  \ Elixir 哲学的方式。\n\n在进入测试本身之前，让我们先看看我们将要测试的函数。在第 6 章《元编程 – 编写代码的代码》中，我们构建了一个上传和下载管道，可用于将文件在\
  \ Google Cloud Storage 中移动。一个步骤是 :remote_storage 步骤，在此步骤中实际进行上传/下载。为了演示模拟的使用，我们将为此管道步骤的上传部分创建一个测试。让我们看看其实现：\n\
  \n```elixir\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/\nremote_storage.ex\n\
  defmodule ElixirDrip.Storage.Pipeline.RemoteStorage do\n  alias ElixirDrip.Storage.Providers.GoogleCloudStorageLive\n\
  \n  # ...\n\n  @impl GenStage\n  def handle_events(tasks, _from, _state) do\n  \
  \  processed = Enum.map(tasks, &remote_storage_step(&1))\n    {:noreply, processed,\
  \ @dummy_state}\n  end\n\n  defp remote_storage_step(%{media: %{id: id, storage_key:\
  \ storage_key}\n  = media, content: content, type: :upload} = task) do\n    Logger.debug(\"\
  #{inspect(self())}: Uploading media #{id} to #{storage_key}, size: #{byte_size(content)}\
  \ bytes.\")\n    {:ok, :uploaded} = GoogleCloudStorageLive.upload(storage_key,\n\
  \    content)\n    task\n  end\nend\n```\n\n我们正在测试 handle_events/3 函数，特别是当任务的类型为\
  \ :upload 时。我们想要引入的模拟是针对 GoogleCloudStorageLive 模块，因为我们不想在测试中实际联系 Google 的 API。我们现在将看到如何使用\
  \ Mox 库来实现这一点。首先，我们需要注入依赖，以便可以根据运行的环境进行替换。以下是我们更新后的模块：\n\n```elixir\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/remote_storage.ex\n\
  defmodule ElixirDrip.Storage.Pipeline.RemoteStorage do\n  @storage_provider Application.get_env(:elixir_drip,\
  \ :storage_provider)\n\n  # ...\n\n  defp remote_storage_step(%{media: %{id: id,\
  \ storage_key: storage_key}\n  = media, content: content, type: :upload} = task)\
  \ do\n    Logger.debug(\"#{inspect(self())}: Uploading media #{id} to #{storage_key},\
  \ size: #{byte_size(content)} bytes.\")\n    {:ok, :uploaded} = @storage_provider.upload(storage_key,\
  \ content)\n    task\n  end\nend\n```\n\n现在我们需要更新应用程序的配置。首先，我们在主配置文件中添加此条目：\n\n\
  ```elixir\n$ cat apps/elixir_drip/config/config.exs\nuse Mix.Config\n\n# ...\n\n\
  config :elixir_drip, storage_provider:\nElixirDrip.Storage.Providers.GoogleCloudStorageLive\n\
  \nimport_config \"#{Mix.env()}.exs\"\n```\n\n这样，实际实现就是默认实现，然后可以根据环境进行覆盖。这是通过 config.exs\
  \ 的最后一行实现的，在那里我们根据 MIX_ENV 环境变量导入新的配置文件。现在，我们更新测试环境的配置文件：\n\n```elixir\n$ cat apps/elixir_drip/config/test.exs\n\
  use Mix.Config\n\n# ...\n\nconfig :elixir_drip, storage_provider:\nElixirDrip.Storage.Providers.GoogleCloudStorageMock\n\
  ```\n\n在此阶段，根据环境的不同，会注入不同的模块作为存储提供者。在进入测试代码之前，让我们先设置 Mox。首先，我们需要在 Mix 文件中将其添加为依赖项：\n\
  \n```elixir\n$ cat apps/elixir_drip/mix.exs\n\ndefmodule ElixirDrip.Mixfile do\n\
  \  # ...\n  defp deps do\n    [\n      # ...\n      {:mox, \"~> 0.3\", only: :test}\n\
  \    ]\n  end\nend\n```\n\n```\n# ...\nend\n```\n\n请注意，修改后，我们需要运行 mix deps.get 来获取这个新的依赖。最后一步设置\
  \ Mox 是定义我们在测试中使用的模拟。与其它测试框架不同，使用 Mox 你需要在一个地方完成，而不是每个测试都做。其原因是你不应该在测试中生成动态模块作为模拟，而应在一个中心位置定义它们；例如，在\
  \ test_helper.exs 中，或在 setup_all 块中，如果出于某种原因需要在测试模块中执行此操作。在这个示例中，我们将在 test_helper.exs\
  \ 中执行此操作：\n\n```\n$ cat apps/elixir_drip/test/test_helper.exs\nExUnit.start()\n\n\
  Mox.defmock(ElixirDrip.Storage.Providers.GoogleCloudStorageMock, for:\nElixirDrip.Behaviours.StorageProvider)\n\
  ```\n\n我们使用 Mox.defmock/2 来定义一个模拟，其名称作为第一个参数给出，该名称基于第二个参数中 :for 选项传递的行为。Mox 不允许在不链接到行为的情况下创建模拟。虽然乍一看这可能感觉像是多余的工作，但请记住，这将确保模拟的\
  \ API 和真实实现不会产生偏差。秉承 Elixir 设计和哲学中存在的显式性，Mox 希望你定义明确的契约，实际实现和模拟都必须遵守。这样，你就不会出现测试全部通过但应用程序无法正常工作的情况，这通常是因为测试滥用模拟，并且与实际应用程序生活在不同的现实中。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_425_0.png)\n\n我们已经在第 2 章《Elixir 项目的内部结构》中创建了\
  \ ElixirDrip.Behaviours.StorageProvider 行为。\n\n如果我们还没有这样做，我们需要创建行为，让真实实现采用该行为，然后再在\
  \ test_helper.exs 中进行此更改。基础工作已完成。让我们现在检查测试本身：\n\n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/pipeline/\n\
  remote_storage_test.exs\ndefmodule ElixirDrip.Storage.Pipeline.RemoteStorageTest\
  \ do\n  use ExUnit.Case, async: true\n  import Mox\n\n  alias ElixirDrip.Storage.Providers.GoogleCloudStorageMock\n\
  ```\n\n```\n@subject ElixirDrip.Storage.Pipeline.RemoteStorage\n\nsetup :verify_on_exit!\n\
  \ntest \"on upload it calls the GoogleCloudStorage client with the right arguments\"\
  \ do\n  expect(GoogleCloudStorageMock, :upload, fn \"test_key\", \"test_content\"\
  \ -> {:ok, :uploaded} end)\n\n  task = %{type: :upload, media: %{id: \"test_id\"\
  , storage_key: \"test_key\"}, content: \"test_content\"}\n  @subject.handle_events([task],\
  \ nil, nil)\nend\nend\n```\n\n此测试的目的是检查我们的依赖是否使用正确的参数被调用。然后由该其他模块的单元测试负责检查其在给定正确参数时是否表现正确。首先，我们导入\
  \ Mox，然后调用 `setup :verify_on_exit!`。此设置调用将使 Mox 在进程退出之前立即验证当前进程中定义的所有期望是否已满足。然后，在测试本身中，我们使用\
  \ `expect` 函数（从 Mox 导入）为我们之前创建的模拟设置期望。第一个参数是我们设置期望的模块，第二个参数是函数名称，最后一个参数是一个 lambda，当模拟接收到此函数调用时将被调用。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_426_0.png)\n\n如果你想设置期望，使模拟接收该函数调用多次，可以向\
  \ `expect` 函数提供另一个参数，定义此函数在模拟上将被调用多少次。例如，扩展我们上一个示例，如果我们期望模拟中的 `:upload` 函数被调用三次，我们将使用：`expect(GoogleCloudStorageMock,\
  \ :upload, 3, fn \"test_key\", \"test_content\" -> {:ok, :uploaded} end)`\n\n我们使用\
  \ lambda 参数上的模式匹配来验证模拟是否使用正确的参数被调用。如果模拟使用不同的参数被调用，匹配将失败，进而导致测试失败。如果模拟使用正确的参数被调用，它将返回\
  \ lambda 的结果。在这种情况下，我们只是返回 `{:ok, :uploaded}`，以便在被测试的模块中模式匹配正常工作，使测试通过。\n\n设置此期望后，我们只需创建必要的测试数据，其中定义这是一个上传任务，然后将其传递给我们在主题上测试的函数。查看此测试，很清楚在此测试上设置了哪些期望，因此很容易理解其目的。如果不是设置期望，你只想存根该函数调用，可以直接调用\
  \ `Mox.stub/3` 函数。要查看此和其他 Mox 上可用的函数，请查看其文档，网址为 https://hexdocs.pm/mox/Mox.html。\n\
  \n请注意，我们在文件顶部仍然有 `async: true`，这意味着尽管我们使用模拟，此测试仍将并发运行。然而，这可能并不总是如此。特别是，如果你测试的代码正在生成新进程（例如生成一个\
  \ GenServer），你将无法对这些进程发出的函数调用设置期望。在这些情况下，你可以配置 Mox 以全局模式工作，其中每个进程都可以访问由不同进程设置的期望（并停止使用\
  \ `async: false` 并发运行测试），或明确允许某个进程访问期望（允许测试仍并发运行）。请查看前面提到的文档，了解如何使用这些模式的详细信息。\n\n\
  我们现在已经看到了如何使用 Mox 在 Elixir 中创建功能模拟。在结束本节关于带副作用函数的测试之前，让我们谈谈测试与存储库交互的函数。\n\n## 单独测试与存储库的交互\n\
  \n我们现在将探讨如何单独运行与应用程序存储库交互的测试。在本章开始时，我们为 `%Media{}` 结构体创建了一些测试，并了解了如何在不触及数据库的情况下测试\
  \ `changeset` 逻辑。现在，我们将看到如何实际运行命中数据库的测试。\n\n一个时不时被问到的问题是如何为存储库创建模拟，以便我们可以独立测试与之交互的函数。虽然存储库确实是另一个依赖项，但我们认为为其创建模拟毫无意义，因为在存储库测试中，我们希望验证我们的命令和查询按预期工作。我们已经在\
  \ `changeset` 测试中测试了业务逻辑，现在我们希望确保一切都按应有的方式粘合在一起。如果我们要模拟存储库，那么我们仍然需要创建集成测试来验证这一点，那么在这种情况下创建模拟有什么优势呢？\n\
  \n人们希望在测试中避免命中数据库的主要原因之一是它会减慢测试套件的速度，从而创建更慢、因此生产力更低的反馈循环。然而，我们能够并发运行与数据库交互的测试，大大消除了这种担忧的原因。让我们现在看看如何并发运行命中数据库的测试。首先，我们需要在测试环境中配置数据库池以使用特殊的沙箱适配器：\n\
  \n```\n$ cat apps/elixir_drip/config/test.exs\nuse Mix.Config\n\n# ...\n\nconfig\
  \ :elixir_drip, ElixirDrip.Repo,\n  pool: Ecto.Adapters.SQL.Sandbox\n```\n\n此适配器将每个数据库连接包装在事务中，从而创建一种安全机制来并发运行针对数据库的测试。尽管适配器的名称包含\
  \ SQL，并发模式不能用于所有 SQL 数据库。目前，它只能与 PostgreSQL 一起使用，因为将其与 MySQL 一起使用可能会导致死锁，从而创建脆弱的测试套件。现在，我们需要更新\
  \ test_helper.exs，以配置池模式：\n\n```\n$ cat apps/elixir_drip/test/test_helper.exs\n\
  # ...\nEcto.Adapters.SQL.Sandbox.mode(ElixirDrip.Repo, :manual)\n```\n\n这将把池模式配置为\
  \ :manual，这意味着在每个测试中我们将显式签出一个连接。让我们现在看看测试本身。尽管我们将对 %Media{} 模式进行查询测试，但由于我们的设计基于有界上下文，此模式的存储库交互位于\
  \ Storage 上下文中。因此，我们的测试将针对 Storage 模块。另外，请注意，我们将存储库测试分离到不同的文件中，这样我们可以清楚地看到哪些测试正在与存储库（和数据库）交互，哪些测试是纯单元测试。让我们检查此测试的代码：\n\
  \n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/storage_repo_test.exs\ndefmodule\
  \ ElixirDrip.StorageRepoTest do\n  use ExUnit.Case, async: true\n\n  @subject ElixirDrip.Storage\n\
  \n  setup do\n    :ok = Ecto.Adapters.SQL.Sandbox.checkout(ElixirDrip.Repo)\n  end\n\
  \n  describe \"when the user already uploaded some media\" do\n```\n\n```\nsetup\
  \ [:create_user, :create_media]\n\n@tag :repository\ntest \"finds the media by ID\"\
  , %{user: user, media: media} do\n  {:ok, :download_enqueued, retrieved_media} =\n\
  \    @subject.retrieve(user.id, media.id)\n\n  expected_media_id = media.id\n  assert\
  \ %{full_path: \"$\", id: ^expected_media_id, name:\n    \"test.txt\"} = retrieved_media\n\
  end\nend\n\ndefp create_user(_context) do\n  {:ok, user} =\n    ElixirDrip.Accounts.create_user(%{\n\
  \      username: \"test\",\n      password: \"12345678\",\n      email: \"test@test.com\"\
  \n    })\n\n  {:ok, user: user}\nend\n\ndefp create_media(%{user: user}) do\n  {:ok,\
  \ :upload_enqueued, media} = @subject.store(user.id,\n  \"test.txt\", \"$\", \"\
  some cool content\")\n  {:ok, media: media}\nend\nend\n```\n\n首先，我们有 `setup` 块，在其中我们从连接池检出一个连接，正如我们之前讨论的那样。这样我们的当前进程将成为该数据库连接的所有者。在测试的其余部分，我们使用本章中已学到的技术来创建描述性的测试。我们使用\
  \ `describe` 块为某个测试（或一组测试）设定上下文，然后在其内部使用 `setup` 来为测试运行安排必要的状态。在本例中，这意味着在数据库中创建一个新用户，然后为该用户创建一个新的媒体条目。然后，测试本身验证我们是否能够根据其\
  \ ID 和关联的用户 ID 获取媒体条目。最后，我们使用 `assert` 宏来验证我们刚刚从数据库中获取的记录是我们期望的记录。\n\n与 Mox 的情况类似，当你的测试（或正在测试的代码）生成新进程时，就需要做额外的工作。在这种情况下，适配器可以从\
  \ :manual 更改为 :shared 模式，或者为某个进程设置显式的允许。请参考适配器文档，网址为 https://hexdocs.pm/ecto/Ecto.Adapters.SQL.Sandbox.html，了解如何为这些情况配置适配器。\n\
  \n此测试的最后一个值得注意的部分是 @tag 属性的使用。标签允许我们为每个测试（或一组测试）添加元数据，然后可用于仅运行（或阻止运行）某个测试组。在本例中，我们将此测试标记为\
  \ :repository，因为它与存储库交互。有了此设置，我们就可以例如配置本地开发环境以运行除存储库测试之外的所有测试，而仅在 CI（持续集成）环境中运行完整的测试套件。我们可以通过以下方式运行除存储库测试之外的所有测试：\n\
  \n```\n$ MIX_ENV=test mix test --exclude repository:true\nExcluding tags: [repository:\
  \ \"true\"]\n.....\nFinished in 0.1 seconds\n7 tests, 0 failures, 1 skipped\n```\n\
  \n正如我们所见，我们有一个测试被跳过，即我们刚刚创建的存储库测试。相反，如果我们只想运行存储库测试，可以传递选项 --only repository:true。此时，我们将\
  \ :repository 标签放在测试本身上。当测试模块开始包含更多测试时，我们也希望这些测试被标记。为此，我们可以使用 @moduletag 指令，它将给定的标签放在当前模块的所有测试上：\n\
  \n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/storage_repo_test.exs\ndefmodule\
  \ ElixirDrip.StorageRepoTest do\n  use ExUnit.Case, async: true\n\n  @moduletag\
  \ :repository\n\n  # ...\nend\n```\n\n有了它，我们就到达了关于具有副作用的函数的部分的结尾。让我们现在探索 Elixir\
  \ 的一个非常不错的功能：测试文档。\n\n## 测试文档\n\n在本书中，我们一直说文档是 Elixir 的一等公民，这在为新人员上手该语言（甚至是让经验丰富的开发者接触到某个应用程序）时非常有帮助。其关键推动因素之一是能够在函数的文档中嵌入测试，这将确保文档与代码保持同步。\n\
  \n几乎每个开发者都认识到简洁且描述性文档的价值，因为它极大地帮助理解函数或模块，而无需在整个项目中跳转。文档的问题在于难以维护，因为代码可能在未相应更改文档的情况下更新，从而导致过时且误导性的文档。这导致某些社区干脆停止编写文档，因为没有文档比有欺骗性文档更好。为了解决这个问题，同时保留适当的文档带来的巨大价值，Elixir\
  \ 和 ExUnit 允许我们在文档中嵌入代码片段，这些片段将被执行并与文档中定义的预期输出进行比较。此功能的名称是 doctest。\n\n为了举例说明 doctest\
  \ 的创建，我们将为之前测试过的函数 ElixirDrip.Storage.Media.is_valid_path?/1 添加文档：\n\n```\n$ cat\
  \ apps/elixir_drip/lib/elixir_drip/storage/media.ex\ndefmodule ElixirDrip.Storage.Media\
  \ do\n  # ...\n\n  @doc\"\"\"\n  Verifies if the provided `path` is valid or not.\n\
  \n  ## Examples\n\n      iex> ElixirDrip.Storage.Media.is_valid_path?(\"$ /abc\"\
  )\n      {:ok, :valid}\n\nWhen we provide an invalid path (that either doesn't start\
  \ with `$` or ends with `/`), it returns {:error, :invalid_path}\n\n      iex> ElixirDrip.Storage.Media.is_valid_path?(\"\
  $ /abc/\")\n      {:error, :invalid_path}\n\n      iex> ElixirDrip.Storage.Media.is_valid_path?(\"\
  /abc\")\n      {:error, :invalid_path}\n  \"\"\"\n  def is_valid_path?(path) when\
  \ is_binary(path) do\n    # ...\n```\n```\nend\n  # ...\n  end\n```\n\n在这里我们使用 @doc\
  \ 模块属性编写文档，如常。然后，在其中我们引入以 iex> 开头的行，并在其后附加我们想要测试的代码。下一行包含预期输出。ExUnit 然后会提取 iex>\
  \ 之后的代码，运行它，并将其与下一行中写的内容进行比较。为了让这些测试作为我们测试套件的一部分运行，我们需要在该模块的测试文件中添加以下内容：\n\n```\n\
  $ cat apps/elixir_drip/test/elixir_drip/storage/media_test.exs\ndefmodule ElixirDrip.Storage.MediaTest\
  \ do\n  # ...\n\n  doctest @subject\n\n  # ...\nend\n```\n\n@subject 模块属性之前已定义，包含我们正在测试的模块的名称。通过添加这一行，ExUnit\
  \ 将把我们刚刚创建的 doctest 片段作为测试套件的一部分运行。让我们现在运行它们：\n\n```\n$ MIX_ENV=test mix test\n\
  ..........\n\nFinished in 12.6 seconds\n3 doctests, 7 tests, 0 failures\n```\n\n\
  正如我们所见，我们现在在测试套件中有 3 个 doctest。让我们现在故意让测试失败，以便在这种情况下观察其输出。我们修改了文档，使其期望返回值为 {:ok,\
  \ :other_atom}。让我们检查其输出：\n\n```\n$ MIX_ENV=test mix test\n......\n\n1) doctest ElixirDrip.Storage.Media.is_valid_path?/1\
  \ (1)\n(ElixirDrip.Storage.MediaTest)\n  test/elixir_drip/storage/media_test.exs:5\n\
  Doctest failed\ncode: ElixirDrip.Storage.Media.is_valid_path?(\"$ /abc\") === {:ok,\
  \ :other_atom}\nleft: {:ok, :valid}\nstacktrace:\n  lib/elixir_drip/storage/media.ex:74:\
  \ ElixirDrip.Storage.Media\n```\n```\n(module)\n..\nFinished in 0.3 seconds\n3 doctests,\
  \ 7 tests, 1 failure\n```\n\n在这种情况下，测试失败，我们会得到一个很好的错误消息，使其易于理解发生了什么并进行必要的更正。至此，我们完成了关于\
  \ doctest 的这一小节，也完成了关于单元测试的更广泛部分。让我们现在继续下一节，在那里我们将学习如何编写集成测试。\n\n## 集成测试\n\n在涵盖了单元测试之后，让我们现在转向集成测试。在这种类型的测试中，我们感兴趣的是断言应用程序的不同层按预期协同工作。这通常通过在系统的边缘进行测试来实现，让应用程序中的所有组件相互交互，然后验证响应是否符合预期。\n\
  \n还有其他类型的测试，例如端到端测试，它更进一步，从最终用户的角度测试系统。在我们的例子中，这将通过浏览器进行，点击应用程序中的按钮和链接，然后断言用户看到预期信息。虽然本书不涵盖这种类型的测试，但本节中我们将讨论的大部分内容也适用于端到端测试。\n\
  \n在这种从外部观察应用程序的测试中，我们不想测试可能发生的每一种状态组合。那应该在单元测试级别完成，检查被测对象的每个可能分支。在集成级别，我们测试用户可能采取的主要路径。\n\
  \n如前所述，这些测试将在系统的边界进行。这意味着我们将像浏览器一样命中端点，这将经过 Phoenix 管道和控制器，与 elixir_drip umbrella\
  \ 应用程序交互，最后通过渲染视图返回响应。作为集成测试的示例，我们将创建一个带有 GET /files 请求的测试，该请求将进入文件控制器的 index 动作。让我们现在检查它：\n\
  \n```\n$ cat apps/elixir_drip_web/test/elixir_drip_web/controllers/\nfile_controller_test.exs\n\
  defmodule ElixirDripWeb.FileControllerTest do\n  use ElixirDripWeb.ConnCase, async:\
  \ true\n```\n\n```\nsetup [:create_user, :login_user, :create_media]\n\ntest \"\
  GET /files lists the files for the current user\", %{conn: conn, media: media} do\n\
  \  response = get(conn, \"/files?path=$\")\n\n  assert html_response(response, 200)\
  \ =~ \"test.txt\"\n  assert html_response(response, 200) =~ \"/files/#{media.id}/download\"\
  \nend\n\ndefp create_user(_context) do\n  {:ok, user} =\n    ElixirDrip.Accounts.create_user(%{\n\
  \      username: \"test\",\n      password: \"12345678\",\n      email: \"test@test.com\"\
  \n    })\n\n  {:ok, user: user}\nend\n\ndefp login_user(%{conn: conn, user: user})\
  \ do\n  conn = Plug.Test.init_test_session(conn, user_id: user.id)\n  {:ok, conn:\
  \ conn}\nend\n\ndefp create_media(%{user: user}) do\n  {:ok, :upload_enqueued, media}\
  \ =\n    ElixirDrip.Storage.store(user.id, \"test.txt\", \"$\", \"some cool content\"\
  )\n\n  {:ok, media: media}\nend\nend\n```\n\n我们首先调用 use ElixirDripWeb.ConnCase，它会导入一些便捷模块用于在测试中创建和使用连接。如果你想查看其内容，它位于\
  \ apps/elixir_drip_web/test/support/conn_case.ex。我们随后有一个 setup，包含三个函数，它们会创建并登录一个用户，然后为该用户创建一个媒体文件。用户及其媒体的创建方式与我们在\
  \ StorageRepoTest 中看到的相同。这里的新内容是 login_user 函数。该 setup 函数使用 Plug.Test.init_test_session/2\
  \ 函数来初始化会话，本质上是对之前创建的用户进行登录。这样，我们的测试请求就会像真实请求一样运行，包括经过我们在上一章中创建的身份验证 Plugs。\n\n\
  在测试的设置完成之后，我们现在可以分析测试本身。如前所述，我们在测试头部使用模式匹配来获取在 setup 期间创建的 conn 和 media。然后我们使用 get\
  \ 函数发出请求，指定我们要测试的路径。请注意，我们并不是直接调用控制器，而是通过路由器和管道（如果适用），使我们的请求与真实请求非常相似。\n\n然后我们将此\
  \ GET 请求的响应绑定到 response。现在，我们需要对该响应的内容进行断言，以确保我们的应用程序按预期运行。为此，我们使用 html_response\
  \ 函数，这是一个 Phoenix 辅助函数，可以让我们的测试保持简洁和清晰。使用此辅助函数，我们断言响应的状态码为 200，并且它包含我们在测试中指定的二进制内容。在本例中，我们检查文件名称\
  \ test.txt 是否显示在响应中，并且下载此媒体的链接是否存在。\n\n在测试了 happy path 之后，让我们现在测试系统在接收到未登录用户请求时的行为是否符合预期。利用我们学到的知识，我们将创建两个上下文：一个用于用户已登录的情况，其中包含我们刚刚看到的测试，另一个用于用户未登录的情况。让我们查看更新后的测试文件：\n\
  \n```\n```elixir\n$ cat apps/elixir_drip_web/test/elixir_drip_web/controllers/file_controller_test.exs\n\
  defmodule ElixirDripWeb.FileControllerTest do\n  use ElixirDripWeb.ConnCase, async:\
  \ true\n\n  describe \"when the user is authenticated\" do\n    # ...\n  end\n\n\
  \  describe \"when the user is NOT authenticated\" do\n    setup [:create_user,\
  \ :create_media]\n\n    test \"GET /files redirects the user to '/'\", %{conn: conn}\
  \ do\n      response = get(conn, \"/files?path=$\")\n\n      assert html_response(response,\
  \ 302) =~ \"You are being <a href=\\\"/\\\">redirected</a>\"\n    end\n  end\n\n\
  \  # ...\nend\n```\n```\n\n此测试与我们之前看到的测试非常相似。不同之处在于，我们现在在 setup 中不再调用 `login_user`\
  \ 函数，因此我们的断言也不同。我们现在断言状态码为 302，并且我们被重定向到 /，该页面会提示用户登录。\n\n此时，你可能会想，随着测试用例越来越多，这种方法是否还能管理得过来。很可能还会有更多测试需要已登录的用户。为此，我们可以将此测试中的私有函数抽象到一个\
  \ `Case` 中，就像 Phoenix 生成器自动为我们提供 `ConnCase` 一样。要创建新的 case，我们只需创建一个新模块，调用 `use ExUnit.CaseTemplate`，然后提供一个\
  \ `setup` 块，在其中注入已创建的用户以及用户已登录的修改后连接。然后，每个需要已登录用户的测试只需使用 `use` 调用新创建的模块的名称即可。\n\n\
  减少测试中重复的另一种常见方法是使用工厂库，它们会自动为我们生成测试数据。我们认为只有在真正需要时才应采用此类库。在大多数情况下，仅使用生成测试数据的函数就足够了。这可能会在具有相似输入的模块测试之间引入一些重复，但我们认为立即知道测试需要什么所带来的明确性和可读性提升，超过了重复的成本。这是一个微妙的权衡，就像应用程序中的大多数决策一样，你应定期重新评估它。\n\
  \n为了结束本节，我们想谈谈直接测试控制器和视图。我们将在应用程序中直接测试它们，因为我们刚刚编写的集成测试已经覆盖了它们。一般来说，我们力求避免在控制器和视图中放置过多逻辑，因此集成测试已足够。我们不想专门为控制器和视图编写测试，因为这会导致冗余覆盖。然而，由于\
  \ Elixir 和 Phoenix 的函数式特性，控制器中的 action 和视图本身只是函数。如果由于某种原因你确实需要直接测试控制器或视图，可以使用本章中探讨的技术来完成。\n\
  \n现在我们有了第一个集成测试。用于测试 `GET /files` 的原则可用于测试应用程序的其他功能。请记住，我们不想在这里测试每一种可能的情况；我们只想测试部署应用程序时所需的足够多的内容。让我们现在继续创建\
  \ Phoenix Channels 的测试。\n\n## 测试 Phoenix Channels\n\n到目前为止，我们已经涵盖了单元测试和集成测试。现在，我们将探讨如何为上一章中创建的\
  \ Phoenix Channels 创建测试。这本身并不是一种测试类型，但仍很重要单独探索，因为它附带了一套自己的辅助工具。\n\n如上一章所述，连接到 channel\
  \ 是一个两步过程：我们首先连接到 socket（在我们的例子中是通过 UserSocket 模块）以建立与服务器的连接；然后，在 socket 已连接到服务器后，我们使用它加入我们感兴趣的\
  \ channels。因此，本节将有两个测试用例：一个用于 UserSocket 模块，我们将在其中测试该模块是否正确处理身份验证，另一个用于 UserChannel\
  \ 模块，我们将在其中测试 channel 是否对我们创建的事件做出预期反应。让我们从 UserSocket 测试开始：\n\n```\n$ cat apps/elixir_drip_web/test/elixir_drip_web/channels/user_socket_test.exs\n\
  defmodule ElixirDripWeb.UserSocketTest do\n  use ElixirDripWeb.ChannelCase, async:\
  \ true\n\n  @subject ElixirDripWeb.UserSocket\n\n  describe \"with a valid token\"\
  \ do\n    test \"it connects to the socket\" do\n      token = Phoenix.Token.sign(@endpoint,\
  \ \"user socket auth\", \"13\")\n\n      assert {:ok, socket} = connect(@subject,\
  \ %{\"token\" => token})\n      assert socket.assigns.user_id == \"13\"\n    end\n\
  \  end\n\n  describe \"with an invalid token\" do\n    test \"it doesn't connect\
  \ to the socket\" do\n      assert :error == connect(@subject, %{\"token\" => \"\
  010101\"})\n    end\n  end\n\n  describe \"without providing a token\" do\n    test\
  \ \"it doesn't connect to the socket\" do\n      assert :error == connect(@subject,\
  \ %{})\n    end\n  end\nend\n```\n\n\n\n与我们拥有 ConnCase 来为测试中的连接提供辅助函数一样，我们也有 ChannelCase\
  \ 来为测试内部的通道提供辅助函数。在此测试用例中，我们将使用 connect 函数，该函数允许我们为 socket 处理程序创建传输连接，以测试其身份验证机制。ChannelCase\
  \ 模块由 Phoenix 生成，其位于 apps/elixir_drip_web/test/support/channel_case.ex。\n\n在第一个测试中，我们提供一个有效的\
  \ token，然后断言 socket 的连接成功，并且 socket.assigns 中的 user_id 是我们期望的那个（即我们在签名 token 时提供的那个）。然后我们测试两个负面条件：当用户提供无效\
  \ token 时，以及当用户完全没有提供 token 时。这两个测试非常相似，因为我们在两个测试中都检查是否返回了 :error 原子，这意味着 socket\
  \ 的连接未建立。由于这些测试不会产生副作用，我们可以并发运行它们，这就是为什么我们在 ChannelCase 中将 async: true 作为选项设置的原因。\n\
  \n在有了这些测试之后，我们可以继续测试 UserChannel 模块。现在让我们查看它的代码：\n\n```\n$ cat apps/elixir_drip_web/test/elixir_drip_web/channels/user_channel_test.exs\n\
  defmodule ElixirDripWeb.UserChannelTest do\n  use ElixirDripWeb.ChannelCase\n\n\
  \  setup [:create_users, :create_media, :connect_to_socket]\n\n  test \"join users:lobby\
  \ pushes a 'presence_state' event to the joiner\", %{socket: socket} do\n    {:ok,\
  \ _reply, _socket} = subscribe_and_join(socket, \"users:lobby\")\n\n    assert_push\
  \ \"presence_state\", %{}\n  end\n\n  test \"'share' events are emitted to the owner\
  \ and sharee\", %{socket: socket, user: user, sharee: sharee, media: media} do\n\
  \    {:ok, _reply, socket} = subscribe_and_join(socket, \"users:#{user.id}\")\n\
  \    ElixirDripWeb.Endpoint.subscribe(self(), \"users:#{sharee.id}\")\n\n    push(socket,\
  \ \"share\", %{\"username\" => \"other_user\", \"file_id\" => media.id})\n\n   \
  \ assert_broadcast \"share\", %{message: \"Successfully shared the file with other_user.\"\
  }\n    assert_receive %Phoenix.Socket.Broadcast{\n    payload: %{message: \"test\
  \ has just shared a file with you!\"}\n    }\n    end\n\n    # ...\n    end\n```\n\
  \n在深入测试之前，让我们先回顾一下应用程序中拥有的通道，这样可以使测试更容易理解。首先，我们有 \"users:lobby\" 主题，所有用户都会连接到它。它用于跟踪当前在线的用户，并由\
  \ Phoenix.Presence 提供支持。然后我们为每个用户都有一个不同的主题。主题的格式为 \"users:<user_id>\"，其中 <user_id>\
  \ 表示连接到 socket 的用户的 ID。该通道用于仅向单个用户传递通知，例如下载或上传完成时。\n\n为了使解释更清晰，我们隐藏了 setup 函数，因为它们与我们已经看到的类似。我们开始看到一种模式，并且我们本可以从拥有自己的\
  \ Case 中受益，在其中创建用户和媒体。然而，请注意，在这种情况下需求有些不同。我们现在需要创建两个用户：一个名为 test 的用户，它是创建的媒体的所有者，另一个名为\
  \ other_user 的用户，它是我们将与之共享媒体的用户。如果我们过早地将用户创建抽象到 Case 中，现在就需要停止并尝试将其适配到这个新需求。我们的建议是尽可能推迟这种类型的提取，先建立应用程序将拥有的大部分测试。一旦有了它们，模式会自然浮现，你将能够看到可以在哪里去除重复，而不会妨碍测试的可读性。至于\
  \ connect_to_socket 函数，它只是使用 connect 函数来建立连接，就像我们在 UserSocket 测试中所做的那样。\n\n在我们的第一个测试中，我们检查加入\
  \ \"users:lobby\" 通道是否按预期工作。在这种情况下，我们希望验证 \"presence_state\" 事件是否被推送回刚刚加入的用户，因为这是加入该通道时发出的唯一事件。我们使用\
  \ assert_push 辅助函数，它将确保通道已为给定事件向用户推送消息。\n\n下一个测试稍微复杂一些。我们现在想要测试当服务器接收到 \"share\"\
  \ 事件时，它将调用必要的函数来与另一用户共享文件，同时也会向文件所有者和被分享者发出事件，告知共享成功。为了测试这一点，我们需要订阅两个通道：一个是文件所有者的通道，使用\
  \ subscribe_and_join 函数，如我们之前所做的那样；另一个是被分享者用户的通道，我们使用 ElixirDripWeb.Endpoint.subscribe\
  \ 函数来完成。\n\n完成此设置后，我们然后推送一个 \"share\" 事件，其中包含被分享者的用户名和我们想要共享的媒体的 ID。现在，我们想要断言正确的事件已被发出。首先，我们使用\
  \ assert_broadcast 来确保文件所有者收到了确认消息。其次，我们使用普通的 assert_receive 来检查测试进程是否收到了发给被分享者的消息。测试进程作为每个通道的常规客户端工作，这使我们能够做出我们一直在讨论的断言。\n\
  \n请注意，ElixirDripWeb.ChannelCase 提供的辅助函数使我们的测试简洁且描述性强。它们在幕后做了大量工作，简化了测试，使其清晰明了。\n\
  \n另一个需要注意的重要部分是，在此测试用例中我们没有 async: true。在此测试中与数据库交互的进程是通道进程，它在我们加入通道时动态生成。当并发运行测试时，这个新创建的进程不知道我们在测试进程中签出的数据库连接。因此，在这种情况下，我们需要使此测试顺序运行，以便\
  \ SQL.Sandbox 适配器以共享模式运行，允许进程共享数据库连接。然而，我们认为这不值得担心。如果我们的大多数测试已经并发运行，在运行测试套件时可能所有\
  \ CPU 内核都会被使用。如果在某些条件下你需要使测试串行运行，这不应对测试套件的运行时间产生明显影响。\n\n在某些情况下，没有必要使测试串行运行，因为我们可以定义显式许可来共享数据库连接。在此测试中无法做到这一点，因为当我们获得新创建的进程\
  \ ID（在加入之后）时，该进程已经在尝试查询数据库，即在处理它自己发送的 :after_join 消息时。请参考 Ecto 的文档以了解如何使用显式许可，网址为\
  \ https://hexdocs.pm/ecto/Ecto.Adapters.SQL.Sandbox.html。\n\n我们现在已经了解了如何为 Phoenix\
  \ Channels 创建测试，因此本节到此结束。现在让我们学习如何为宏创建测试。\n\n## 测试宏\n\n在本节中，我们将了解如何为宏创建测试。特别是，我们将为我们在第\
  \ 6 章《元编程 – 编写代码的代码》中创建的 defchrono 宏添加一个测试。与上一节中为 Phoenix Channels 添加测试一样，本节与某种测试类型无关，而是与展示如何测试我们创建的特定组件有关。\n\
  \n测试宏最常见且有效的方法是断言宏生成的代码的行为，而不是代码生成本身。直接测试生成的 AST 通常会导致脆弱且难以维护的测试。这些测试可以被视为宏的单元测试，因为它们测试的是宏展开本身。我们的重点应该是宏的集成测试。这意味着我们将创建一个测试模块，其唯一目的是在我们的宏上调用\
  \ use，然后在此测试模块上放置断言。让我们查看此测试的代码：\n\n```\n$ cat apps/elixir_drip/test/chronometer_test.exs\n\
  defmodule ElixirDrip.ChronometerTest do\n  use ExUnit.Case, async: true\n\n  import\
  \ ExUnit.CaptureIO\n\n  defmodule Factorial do\n    use ElixirDrip.Chronometer,\
  \ unit: :secs\n\n    defchrono calculate(x) do\n      _calc_factorial(x)\n    end\n\
  \n    defp _calc_factorial(0), do: 1\n    defp _calc_factorial(x) do\n      x *\
  \ _calc_factorial(x - 1)\n    end\n  end\n\n  test \"defchrono measures and prints\
  \ the function execution time\" do\n    assert capture_io(fn ->\n      Factorial.calculate(10000)\n\
  \    end) =~ ~r/Took \\d+\\.\\d+ secs to run\n    ElixirDrip.ChronometerTest.Factorial.calculate\\\
  /1/\n  end\nend\n```\n\n在我们的测试中，我们创建了一个名为 Factorial 的模块。该模块有一个函数 calculate/1，用于计算所提供数字的阶乘。在该模块内部，我们在要测试的宏上调用\
  \ use，然后对 calculate/1 函数使用 defchrono 宏。由于我们使用了 defchrono 宏，每当调用此函数时，它都会将执行时间写入标准输出。\n\
  \n\n\n鉴于这是宏的行为，我们的测试随后需要重点断言在调用 calculate/1 函数时，该消息会被打印到标准输出。为此，我们使用 ExUnit 提供的一个辅助函数，名为\
  \ capture_io。我们使用此函数来断言，当我们调用 Factorial.calculate(10000) 时，预期的消息会被发送到标准输出。我们使用正则表达式是因为此函数调用的运行时间是可变的，我们只关心正确的消息是否被打印，而不关心确切花费了多长时间。\n\
  \n在有了这个测试之后，我们可以验证宏工作正常，而无需为此放弃测试套件的可维护性。由于此测试像真实模块一样使用宏，我们可以确信宏的行为符合预期，这使我们能够在不担心引入回归的情况下对其进行更新和改进。如果由于某种原因你发现自己需要为宏创建单元测试，你可以使用\
  \ Macro.to_string/2 函数，将宏从 AST 转换为 Elixir 字符串。然后，你可以比较这个字符串来检查宏是否按预期展开。然而，正如我们之前所建议的，使用这种方法时要谨慎，你可能会创建脆弱的测试，并检查是否可以在不检查宏展开的情况下测试相同的行为。\n\
  \n我们现在已经结束了关于测试宏的简短章节。接下来，我们将讨论一种非常不同类型的测试方法：基于源代码属性创建测试。\n\n## Property-based testing\n\
  \n我们将通过讨论一种令人兴奋的新型测试方式来结束本章：基于属性的测试。我们称之为新是因为这种测试类型在 Erlang 和 Haskell 社区（以及可能其他社区）中已经使用了很长时间，现在正在进入\
  \ Elixir 社区。在撰写本文时，有强烈迹象表明基于属性的测试将成为 Elixir 核心的一部分，据说将在 Elixir 1.7 版本中发布。特别是，我们将在后面的示例中使用的库（stream_data）将被合并到\
  \ Elixir 本身。目前尚不清楚这将如何实现，以及库的 API 是否会发生变化。尽管如此，通过阅读本文并查看示例，你已经能够进入这种新的测试方式，即使未来做法有所不同。\n\
  \n在进入示例之前，我们需要讨论基于属性测试的目的和特征。与单元测试中我们作为开发者手动为每个测试定义输入条件不同，在基于属性的测试中，我们只需定义被测函数所具有的属性。在单元测试中，我们提前定义将要测试的条件，并检查我们认为重要的边界条件。在基于属性的测试中，在定义了属性之后，我们使用数据生成器创建大量输入数据，然后将其提供给被测函数。然后我们断言，由基于属性的测试框架生成的每个输入都尊重我们定义的属性。\n\
  \n在谈论基于属性的测试时，单元测试通常被称为 *example-based tests*。它们之所以这样称呼，是因为我们需要为每个函数想出示例进行测试。手工制作示例的一个缺点是，由于我们是编写代码的人，我们存在偏见。这些偏见会渗透到我们创建的示例中，导致测试套件不理想。另一方面，如果我们定义函数属性，并让测试框架生成输入数据，我们就不太可能遇到同样的缺点。\n\
  \n尽管更困难，但仍然可能创建有偏见或不准确的属性。但什么是属性？为了能够创建良好的属性，我们首先需要回答这个问题。属性是我们代码的特征行为，对于某些数据集而言是成立的。属性因被测函数而异，一开始很难定义它们。我们太习惯于传统的单元测试，以至于停下来思考代码的属性是非常困难的。虽然一开始这种做法会很痛苦，但随着时间的推移，你会越来越自信地定义你编写的代码的属性。除了通过用大量输入空间测试函数来提供更好的覆盖率之外，思考代码的属性也会在应用程序设计中带来好处。当我们停下来思考某个函数的属性，即对于某个输入空间始终成立的条件时，我们经常会发现一些之前未意识到的新范围，或开始思考与其他函数或模块发生的交互。\n\
  \n理论够多了！让我们查看我们第一个属性测试的代码：\n\n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/pipeline/media_property_test.exs\n\
  defmodule ElixirDrip.Storage.MediaPropertyTest do\n  use ExUnit.Case, async: true\n\
  \  use ExUnitProperties\n\n  @subject ElixirDrip.Storage.Media\n\n  property \"\
  is_valid_path?/1 with valid paths returns {:ok, :valid}\" do\n    check all path\
  \ <- string(:ascii),\n              String.last(path) != \"/\" do\n      assert\
  \ @subject.is_valid_path?(\"$\" <> path) == {:ok, :valid}\n    end\n  end\nend\n\
  ```\n\n我们将为我们创建单元测试的同一个函数添加属性测试：is_valid_path?/1。我们只是为了使示例更清晰才将属性测试分离到自己的文件中，但我们完全可以在\
  \ %Media{} 模式的现有测试模块内部创建这些属性测试。首先要指出的是，我们调用了 use ExUnitProperties。这将为基于属性的测试提供一些必要的函数，例如\
  \ property/3 和 check/1。\n\n然后，我们为有效输入范围定义属性，并且 is_valid_path?/1 将返回 {:ok, :valid}。为了定义有效输入范围，我们使用基于属性的测试框架提供的数据生成器。首先，我们生成一个包含\
  \ ASCII 字符的字符串。下一步是拒绝路径以 \"/\" 结尾的生成，因为那是无效路径。最后，在调用我们测试的函数之前，我们在路径前加上 \"$\"，以确保它以该字符开头。最后，我们的断言非常简单，匹配对于此输入范围函数始终返回\
  \ {:ok, :valid}。\n\n现在让我们运行这些测试。由于我们使用了 property 函数，我们已经为其设置了标签。这样，要仅运行属性测试，我们可以执行以下操作：\n\
  \n```\n$ MIX_ENV=test mix test --only property\nIncluding tags: [:property]\nExcluding\
  \ tags: [:test]\n.\n\nFinished in 0.1 seconds\n3 doctests, 1 property, 8 tests,\
  \ 0 failures, 11 skipped\n```\n\n全部通过！唯一运行的测试是属性测试。此属性测试仅花费了 0.1 秒运行。由于它运行得如此之快，让我们稍微增加运行次数，看看如何操作。要配置此库中的运行次数，我们执行以下操作：\n\
  \n```\n$ cat apps/elixir_drip/config/test.exs\nuse Mix.Config\n\n# ...\n\nconfig\
  \ :stream_data, max_runs: 500\n```\n\n默认值为 100。将它增加到 500，让我们再次运行测试：\n\n```\n$ MIX_ENV=test\
  \ mix test --only property\nIncluding tags: [:property]\nExcluding tags: [:test]\n\
  \n.\n\nFinished in 0.1 seconds\n3 doctests, 1 property, 8 tests, 0 failures, 11\
  \ skipped\n```\n\n我们现在拥有更广的输入空间，而我们的属性仍然只花费了 0.1 秒运行。在本地开发中，我们希望执行时间短以获得快速反馈循环。然而，在\
  \ CI 中执行时间并不那么重要，这使我们可以稍微增加这个数字并检查更大的输入范围，可能发现我们之前未意识到的边缘情况。现在让我们为 is_valid_path?/1\
  \ 函数添加一个新的基于属性的测试：\n\n```\n$ cat apps/elixir_drip/test/elixir_drip/storage/pipeline/media_property_test.exs\n\
  defmodule ElixirDrip.Storage.MediaPropertyTest do\n  # ...\n\n  property \"is_valid_path?/1\
  \ with invalid paths returns {:error, :invalid_path}\" do\n    check all path <-\
  \ string(:ascii),\n              String.first(path) != \"$\" do\n      assert @subject.is_valid_path?(path)\
  \ == {:error, :invalid_path}\n    end\n\n    check all path <- string(:ascii) do\n\
  \      assert @subject.is_valid_path?(path <> \"/\") == {:error, :invalid_path}\n\
  \    end\n  end\nend\n```\n\n这个新属性指出，对于所有无效路径，我们的函数返回 {:error, :invalid_path}。为了检查该属性对所有类型的无效路径都成立，我们在其中有两个生成器。一个生成器检查对于所有不以\
  \ \"$\" 开头的路径，函数是否返回预期值。另一个生成器检查对于所有以 \"/\" 结尾的路径，函数是否也返回预期值。现在让我们再次运行基于属性的测试：\n\
  \n```\n$ MIX_ENV=test mix test --only property\nIncluding tags: [:property]\nExcluding\
  \ tags: [:test]\n```\n\n```\nFinished in 0.3 seconds\n3 doctests, 2 properties,\
  \ 8 tests, 0 failures, 11 skipped\n```\n\n再次，一切都是绿色的！测试框架生成了一大批输入数据，对于所有这些输入，is_valid_path?/1\
  \ 函数的行为都符合预期。请注意，这并不意味着我们的函数没有 bug，因为基于属性的测试并不是软件的形式化验证。然而，我们对该函数编写正确有很大信心。在撰写本书时，我们未能让这些测试失败，但如果我们遇到失败，测试框架会将输入缩小到破坏该属性的最小可能输入。这非常有帮助，因为它使边界条件更容易理解，通常输入会被缩小到我们立即就能看出错误所在的地步。为了保持基于属性测试的可收缩性，请注意你必须使用\
  \ StreamData 库中的函数。\n\n那么基于属性的测试如何与其他类型的测试集成到应用程序中呢？与测试相关的大多数方面一样，这将取决于团队的偏好。通常，它们并不打算取代单元测试或集成测试。这两种测试类型仍然各有优势。例如，单元测试非常适合直接测试繁琐的边界情况的场景。此外，由于基于属性的测试通常需要一些时间运行（因为它们会生成大量测试执行），我们认为你不应该为应用程序中的每个函数都编写它们。这会导致测试套件缓慢且难以管理。或者，你可以选择对保持应用程序运行至关重要的若干函数或模块，并为这些函数或模块创建基于属性的测试。这将提高你对这些关键组件的信心，进而也会提高应用程序的健壮性。\n\
  \n正如本节所见，基于属性的测试为你的测试套件带来了一些好处。它们让我们能更有信心地发布代码，这正是所有类型测试的目的。由于这些测试在每次运行都会生成不同的输入数据，随着时间的推移，你的测试会更进一步。除了额外的执行时间外，采用这种测试类型的唯一缺点是陡峭的学习曲线。为我们的函数创建和定义属性需要改变思维方式，这在开始时感觉非常困难。正如任何手艺一样，经验会让你越来越好，随着时间的推移，你会发现为函数创建属性变得自然而然。在开始这段旅程时，你可以使用一些模式。例如，如果你测试的函数有一个逆函数，你可以创建一个属性，说明逆函数会撤销原始函数执行的操作。\n\
  \n另一个有用的技巧是使用已有的实现来断言你正在测试的函数的行为。例如，如果你正在测试 Erlang 标准库中可用的函数，那么你的函数的输出可能与 Erlang\
  \ 标准库中的输出相同。随着经验的积累，其他模式将会出现并成为你的工具箱的一部分。\n\n我们现在已经到达了这个令人兴奋的部分的结尾。让我们通过回顾本章的内容来结束本章。\n\
  \n## 总结\n\n在本章关于测试的内容中，我们涵盖了广泛的主题。让我们回顾最重要的内容：\n\n- Elixir 中的测试由功能全面的 ExUnit 框架驱动，它使我们能够创建描述性强且简洁的测试，并且能够并发运行。\n\
  - 我们可以在 Elixir 中使用 Mox 库创建函数 mock，使测试仍能并发运行。Mock 必须基于 behaviour 创建，以确保 mock 的 API\
  \ 和真实实现不会分歧。\n- Ecto 的模块化设计使我们能够将 changeset 测试（验证业务逻辑）与 repository 测试（验证查询和与数据库的交互）分开。在任何情况下，我们都能够并发运行测试。\n\
  - Elixir 提供了一个很棒的功能，称为 `doctest`，它使我们能够在编写的文档中嵌入测试。这些嵌入式测试确保文档保持最新，这是在 Elixir 社区中文档享有第一类地位的关键推动因素。\n\
  - 集成测试是通过从边缘测试我们的应用程序来完成的。在我们的例子中，边缘是 Web 界面。Phoenix 提供了一组有用的辅助工具，简化了我们在集成测试中需要进行的断言。\n\
  - 与集成测试类似，Phoenix 提供了一组用于测试 Channels 的辅助工具。特别是，它公开了不仅允许我们连接到 socket，还可以验证特定事件的广播是否发生，或服务器是否向\
  \ Channel 推送了特定事件的函数。\n- 对宏测试的关注应放在测试宏展开后的代码上，而不是代码展开本身。通常应避免测试展开本身，因为这可能导致脆弱的测试。\n\
  - 基于属性的测试是一种非常不同的测试方法，其中我们不是为每个测试想出示例，而是定义被测试函数所具有的属性，然后让测试框架生成输入数据。然后，框架会检查对于函数提供的每个输入，属性是否都得到尊重。\n\
  \n测试部分完成后，我们的应用程序已准备好部署到实时环境。这正是我们在下一章要做的事情，在那里我们将学习如何将 ElixirDrip 应用程序部署到云端。\n"
- "# 10 部署到云端\n\n到目前为止，我们能够提供在旅程开始时设想的所有媒体服务器功能，但 ElixirDrip 仍在本地运行。这一切将在本章中改变；在本章结束时，我们将拥有一个精简版的\
  \ ElixirDrip 运行在托管的 Kubernetes 环境中，并有多个连接的节点运行该应用程序。\n\n我们将遵循一些现有的最佳实践来将 ElixirDrip\
  \ 部署到生产环境。顺便说一下，我们将深入探讨发布、容器化、Kubernetes 和持续集成。这将是一次精彩的旅程！\n\n本章将涵盖以下主题：\n\n- 使用\
  \ Distillery 发布\n- 容器化我们的应用程序\n- 部署到 Kubernetes\n- 使用 Travis CI 进行持续部署\n- 连接已部署的\
  \ Elixir 节点\n\n### 使用 Distillery 发布\n\n到目前为止，我们一直使用 `mix` 或 `mix phx.server` 运行应用程序，并且在运行前代码是即时编译的。这样，只有在上次编译后更改的文件在运行应用程序前会被重新编译，有助于快速的开发体验。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_449_0.png)\n\n如果你在 IEx shell 中（即你使用 `iex\
  \ -S mix` 启动了应用程序），你也可以在想要编译刚刚所做的更改时调用 `recompile/0` 函数，而不必退出并重新启动应用程序。这仅在你在 Mix\
  \ 项目内部时才有效。\n\n我们运行的代码完全有能力在生产环境中履行其职责，但我们不想这样部署它。如果我们将 umbrella 项目文件夹复制到生产环境然后使用\
  \ mix phx.server 运行它，我们也会部署开发和测试依赖项以及应用程序的整个源代码，导致生产环境低效且不安全。\n\n由于其 Erlang 继承，Elixir\
  \ 应用程序也可以像 Erlang/OTP 发布版一样部署。发布的概念只不过是一种标准方式，用于打包运行一个或多个应用程序所需的一切，可选择包含 Erlang\
  \ 运行时（ERTS），从而使该捆绑包自给自足。\n\n与其使用 Erlang 工具为我们的 ElixirDrip umbrella 创建发布并处理 Erlang\
  \ 特定的细节，我们将依赖一个名为 Distillery 的库来创建自包含的发布。Distillery 获取任何 Mix 项目并生成符合规范的 Erlang/OTP\
  \ 发布版，其中包含你选择的运行时依赖项，可随时部署。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_450_0.png)\n\
  \n预计 Elixir 1.7 将为 Mix 带来发布工具。然而，该功能的初始版本不会涵盖 Distillery 当前拥有的所有功能（例如热升级）。因此，我们可以预期\
  \ Distillery 只有在 Mix 中的发布工具实现其所有功能时才会被弃用。\n\n由于 Distillery 是一个库，我们将通过将其作为依赖项添加到项目中来安装它（我们运行时不需要该库，因此相应地设置其\
  \ :runtime 选项）：\n\n```\n$ cat mix.exs\n# ...\n  defp deps do\n    [\n      {:distillery,\
  \ \"~> 1.5\", runtime: false},\n      {:credo, \"~> 0.3\", only: [:dev, :test],\
  \ runtime: false}\n    ]\n  end\n# ...\n```\n\n现在，我们只需要运行 mix do deps.get, compile\
  \ 即可执行 Distillery Mix 任务。\n\n在以下部分中，我们将配置并构建 ElixirDrip umbrella 项目的发布。\n\n\n\n\n\
  ## 配置发布\n\nDistillery 会在项目根目录中查找 rel 文件夹，以确定应如何构建发布。在最简单的形式下，该文件夹只需要包含一个 config.exs\
  \ 文件。\n\n要创建典型的发布配置，我们将在项目根目录中运行 Mix release.init 任务：\n\n```\n$ mix release.init\n\
  An example config file has been placed in rel/config.exs, review it,\nmake edits\
  \ as needed/desired, and then run `mix release` to build the\nrelease\n```\n\n生成的配置文件首先加载\
  \ rel/plugins 文件夹中可能存在的任何插件，然后使用 Mix.Releases.Config 模块以便使用其宏。因为我们将 :default_release\
  \ 设置为 :default，如果我们只是执行 mix release（即未选择任何 :release 配置），它将使用 rel/config.exs 文件中定义的第一个发布。我们还将\
  \ :default_environment 设置为 Mix.env()，意味着它将根据当前的 Mix 环境从此文件中获取其中一个发布环境。\n\n在以下片段中，默认配置还定义了一个\
  \ :dev 环境。通过将 :dev_mode 设置为 true，Distillery 不会将任何 BEAM 代码文件复制到发布文件夹中；相反，它只会创建符号链接，从而提高\
  \ :dev 中的发布速度。通过将 :include_erts 设置为 false，Erlang 运行时的副本不会被放置在发布中，因此当 :dev 发布运行时，它将使用可用的运行时。\n\
  \nDistillery 还为我们生成了一个 Erlang 魔法 cookie，它将在我们想要连接不同的 Erlang 节点时用作身份验证令牌。由于拥有此令牌的任何人可能都能够连接到我们的运行节点，因此你不应以明文形式将其存储在代码库中：\n\
  \n```\n$ cat rel/config.exs\nPath.join([\"rel\", \"plugins\", \"*.exs\"])\n|> Path.wildcard()\n\
  |> Enum.map(&Code.eval_file(&1))\n\nuse Mix.Releases.Config,\n    default_release:\
  \ :default,\n    default_environment: Mix.env()\n\nenvironment :dev do\n  set dev_mode:\
  \ true\n  set include_erts: false\n  set cookie: :\"c{E|>.dCI>YT>M7v@1iF&VNHs)^1M^?*e?=3dcD...\"\
  \nend\n# ...\n```\n\n我们在开发中不会使用发布，因此让我们分析配置 :prod 发布环境和单个 :elixir_drip 发布配置文件的其余部分。:prod\
  \ 环境包含 Erlang 运行时，并通过将 :include_src 选项设置为 false 来从发布中移除源代码。通过将运行时捆绑在发布中，我们确保应用程序能够在没有\
  \ Erlang 或 Elixir 可用的情况下运行。我们在此处设置的 cookie 将不会被使用，因为正如我们稍后将看到的，我们将通过自定义 vm.args\
  \ 文件来设置它。\n\n在以下片段中，你可以找到 Distillery 使用 mix release.init 设置初始值后所应用的更改：\n\n```\n\
  $ cat rel/config.exs\n# ...\nenvironment :prod do\n  set include_erts: true\n  set\
  \ include_src: false\n  set cookie: \":won't be used, we set it via a custom vm.args\
  \ file (rel/custom.vm.args)\"\nend\n\nrelease :elixir_drip do\n  set vm_args: \"\
  rel/custom.vm.args\"\n  set version: current_version(:elixir_drip)\n  set applications:\
  \ [\n    :runtime_tools,\n    elixir_drip: :permanent,\n    elixir_drip_web: :permanent\n\
  \  ]\nend\n```\n\n我们的 rel/config.exs 文件只定义了一个 :elixir_drip 发布，其中包含它将包含的 :applications\
  \ 实例。除了必需的 :runtime_tools 之外，Distillery 还将 :elixir_drip 和 :elixir_drip_web 伞形应用添加到列表中。它还将每个应用程序的启动类型设置为\
  \ :permanent，这意味着如果其中一个应用程序终止，所有其他应用程序以及整个 Erlang 节点都将被终止。\n\n我们使用 current_version/1\
  \ 宏将发布版本设置为 elixir_drip 伞形应用的版本。我们本可以改为设置一个简单的 \"0.1.0\" 字符串。\n\n通过设置 `:vm_args`\
  \ 值，我们告诉 Distillery 我们想要使用自己的 `vm.args` 文件，位于 `rel/custom.vm.args` 中。\n\n一个 `vm.args`\
  \ 文件让我们定义传递给 Erlang VM 的参数。如果我们不指定任何自定义 `vm.args`，Distillery 默认会为我们生成以下文件：\n\n```\n\
  # Name of the node\n-name elixir_drip@127.0.0.1\n\n# Cookie for distributed erlang\n\
  -setcookie a_random_big_and_complex_cookie_value\n\n# Enable SMP automatically based\
  \ on availability\n-smp auto\n```\n\n如你所见，默认情况下，Distillery 向 VM 传递三个参数：第一个 `name`，使用\
  \ `<name>@<host>` 格式设置 Erlang 节点的名称；第二个 `setcookie`，设置如果你想连接到 Erlang 节点所需的 cookie；第三个参数\
  \ `smp`，控制 Erlang 运行时是否应启用对称多处理功能启动。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_453_0.png)\n\
  \n你可以在 Erlang 文档 http://erlang.org/doc/man/erl.html#init_flags 中查看所有可用的 Erlang VM\
  \ 参数。在这里，我们只会使用 Distillery 默认设置的参数。\n\n因为我们在 `:elixir_drip` 发布配置中指向了一个自定义的 `vm.args`\
  \ 文件，Distillery 将不会从头生成 `vm.args` 文件，而是基于 `rel/custom.vm.args` 文件生成 `vm.args`：\n\
  \n```\n$ cat rel/custom.vm.args\n-name <%= release_name %>@${POD_IP}\n\n-setcookie\
  \ ${ERLANG_COOKIE}\n\n-smp auto\n```\n\n前一个文件将被解释为 **嵌入式 Elixir (EEx)** 模板，因此 `<%=\
  \ release_name %>` 将变为 `elixir_drip`，即发布配置的名称。另一个区别在于我们设置主机和 cookie 值的方式。我们没有使用实际值，而是使用\
  \ `${POD_IP}` 和 `${ERLANG_COOKIE}` 作为实际值的占位符。\n\n我们使用这种 ${...} 构造是因为我们只想在运行时设置这些值。对于主机值，这是硬性要求，因为我们只有在应用程序即将启动时才知道应用程序主机\
  \ IP。关于 cookie 值，我们完全可以在编译时、发布创建时设置它。尽管如此，鉴于其安全重要性，我们更倾向于在最后可能的时刻才设置它。\n\n在下一节中，我们将了解\
  \ ${...} 构造背后的原因。\n\n## 插值环境变量\n\n让我们先看看在本地开发时，我们如何在 elixir_drip 伞形应用中设置数据库配置：\n\
  \n```\n$ cat apps/elixir_drip/config/dev.exs\nuse Mix.Config\n\nconfig :elixir_drip,\
  \ ElixirDrip.Repo,\n  adapter: Ecto.Adapters.Postgres,\n  username: System.get_env(\"\
  DB_USER\"),\n  password: System.get_env(\"DB_PASS\"),\n  database: System.get_env(\"\
  DB_NAME\"),\n  hostname: System.get_env(\"DB_HOST\"),\n  port: System.get_env(\"\
  DB_PORT\"),\n  pool_size: 10\n```\n\n所有这些 Mix 配置条目都在运行时求值，因此当我们使用 mix 或 mix phx.server\
  \ 运行应用程序时，我们知道所有这些条目都将根据现有的 DB_* 环境变量设置。如果其中一个环境变量不存在，Mix 仍将能够运行项目，但相关配置条目将被设置为\
  \ nil。\n\n当我们构建发布时，这些配置文件（如 config/config.exs 和 config/dev.exs）会被求值并因此在 sys.config\
  \ 发布文件中被固定下来。看看如果我们在构建发布前设置一个奇怪的数据库主机名值会发生什么：\n\n```\n$ MIX_ENV=dev DB_HOST=weird_value_crystallized_forever\
  \ mix release\n  # ...\n==> Release successfully built!\n\n$ cat _build/dev/rel/elixir_drip/releases/0.0.8/sys.config\n\
  \  # ...\n{elixir_drip,\n  [{ecto_repos, ['Elixir.ElixirDrip.Repo']},\n{storage_provider,\n\
  'Elixir.ElixirDrip.Storage.Providers.GoogleCloudStorageLocal'},\n{'Elixir.ElixirDrip.Repo',\n\
  \  [{adapter, 'Ecto.Adapters.Postgres'},\n   {username,<<\"postgres\">>},\n   {password,<<\"\
  123456\">>},\n   {database,<<\"elixir_drip_dev\">>},\n   {hostname,<<\"weird_value_crystallized_forever\"\
  >>},\n   {port,<<\"5432\">>},\n   {pool_size,10}]},\n# ...\n```\n\n即使我们之后在设置了 DB_HOST\
  \ 环境变量的情况下运行发布，主机名配置也始终为 \"weird_value_crystallized_forever\"。\n\n为了解决这个问题，Distillery\
  \ 允许你设置用 ${...} 包裹的配置值（如 \"${DB_HOST}\"），这些值将在运行时由相应的环境变量替换。通过这种方法，我们在构建发布时不需要访问所有配置值。生产凭据或主机\
  \ IP 就是在运行时才可用的值的例子，原因有很多。在我们的案例中，发布将由外部持续集成服务 Travis CI 构建，这尤其有用。\n\n这就是为什么我们的\
  \ config/prod.exs 配置文件，由 :prod Mix 环境使用，看起来像这样：\n\n```\n$ cat apps/elixir_drip/config/prod.exs\n\
  use Mix.Config\n\nconfig :elixir_drip, ElixirDrip.Repo,\n  adapter: Ecto.Adapters.Postgres,\n\
  \  username: \"${DB_USER}\",\n  password: \"${DB_PASS}\",\n  database: \"${DB_NAME}\"\
  ,\n  hostname: \"${DB_HOST}\",\n  port: \"${DB_PORT}\",\n  pool_size: 15\n  # ...\n\
  ```\n\n构建 prod 发布后，你将在 sys.config 中找到以下内容：\n\n```\n$ cat _build/prod/rel/elixir_drip/releases/0.0.8/sys.config\n\
  # ...\n{elixir_drip,\n  [{ecto_repos,['Elixir.ElixirDrip.Repo']},\n   {storage_provider,\n\
  \    'Elixir.ElixirDrip.Storage.Providers.GoogleCloudStorageLive'},\n\n```\n{'Elixir.ElixirDrip.Repo',\n\
  \  [{adapter,'Elixir.Ecto.Adapters.Postgres'},\n   {username,<<\"${DB_USER}\">>},\n\
  \   {password,<<\"${DB_PASS}\">>},\n   {database,<<\"${DB_NAME}\">>},\n   {hostname,<<\"\
  ${DB_HOST}\">>},\n   {port,<<\"${DB_PORT}\">>},\n   {pool_size,15}]},\n# ...\n```\n\
  \n如果我们现在在将 REPLACE_OS_VARS 环境变量设置为 true 的情况下运行发布，Distillery 将会用对应的环境变量值替换 sys.config\
  \ 文件中所有的 \"${...}\" 值。\n\n与这种运行时和构建时二元性相关的常见陷阱（尤其是对于来自 Ruby 等解释型语言的开发者）是，定义其值来自环境变量的模块属性。\n\
  \n假设我们的应用程序需要使用唯一的 URL 向外部 API 发送信息。由于此 URL 是敏感信息，我们不能将其与代码库的其余部分一起存储，因此我们决定从环境变量中获取它，如下所示：\n\
  \n```\ndefmodule ExternalApi do\n  @url System.get_env(\"EXTERNAL_API_URL\")\n\n\
  \  def send_information(payload),\n    do: HTTPotion.post(@url, payload)\nend\n\
  ```\n\n一切在本地都能正常工作，因此我们决定发布此功能。当它到达生产环境时，一个晦涩的错误开始出现，我们无法找出原因。我们再次检查生产环境中设置的环境变量，可以看到\
  \ EXTERNAL_API_URL 已被正确设置。\n\n你能看出哪里出了问题吗？Elixir 是一种编译型语言；因此，我们的 ExternalApi 模块在构建发布时与应用程序的其他部分一起被编译。在编译时，EXTERNAL_API_URL\
  \ 环境变量未被设置，因此 @url 模块属性变为 nil，导致错误发生。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_457_0.png)\n\
  \n即使我们将 @url 值设置为 \"${EXTERNAL_API_URL}\"，错误仍然会发生，因为该值永远不会被实际的 URL 值替换（@url 值将始终为\
  \ \"${EXTERNAL_API_URL}\"）。只有 Distillery 才会在 sys.config 文件中放置 config.exs 配置项。在运行时，当\
  \ Distillery 检测到 REPLACE_OS_VARS 标志时，它会用实际环境变量的值替换 sys.config 文件中存在的所有 ${...} 占位符。\n\
  \n在了解了如何在运行时安全地使用环境变量来配置应用程序之后，让我们实际构建并运行发布！\n\n## 创建发布\n\n要构建发布，我们只需使用 mix release\
  \ 运行发布 Mix 任务。由于我们在 rel/config.exs 文件中设置了 default_environment: Mix.env()，因此发布的默认环境由\
  \ MIX_ENV 环境变量给出。\n\n在下面的代码片段中，我们正在构建发布。我们在 mix.exs 文件中将 elixir_drip 伞形应用的版本设置为\
  \ 0.0.8，因此发布变为 elixir_drip:0.0.8（elixir_drip 是发布名称，0.0.8 是在 rel/config.exs 文件中将发布版本设置为\
  \ current_version(:elixir_drip) 的结果）：\n\n```\n$ MIX_ENV=prod mix release\n==> elixir_drip\n\
  # ...\nGenerated elixir_drip app\n==> elixir_drip_web\nCompiling 12 files (.ex)\n\
  Generated elixir_drip_web app\n\n==> Assembling release..\n==> Building release\
  \ elixir_drip:0.0.8 using environment prod\n==> Including ERTS 9.3.1 from /usr/local/lib/erlang/erts-9.3.1\n\
  ==> Packaging release..\n==> Release successfully built!\n  You can run it in one\
  \ of the following ways:\n  Interactive: _build/prod/rel/elixir_drip/bin/elixir_drip\
  \ console\n  Foreground: _build/prod/rel/elixir_drip/bin/elixir_drip foreground\n\
  \  Daemon: _build/prod/rel/elixir_drip/bin/elixir_drip start\n```\n\n如果查看生成的 *.tar.gz\
  \ 发布归档内部，你会找到四个文件夹（如果不包含 ERTS 则为三个）：bin、erts-<version>、lib 和 releases/<app-version>。\n\
  \n在 bin 文件夹中，你会找到我们用来启动应用程序的 Shell 脚本，而在 lib 文件夹中，你会找到所有编译后的依赖项。\n\nreleases/<app-version>\
  \ 文件夹包含一个发布资源文件 *.rel、一个 *.script 文件和一个 *.boot 文件。因此，elixir_drip.rel 包含一个元组，其中包含此发布中包含的所有应用程序及其各自的版本。现在，elixir_drip.script\
  \ 是一个 Erlang 脚本，它将启动 Erlang 节点然后运行发布。Erlang 运行时将使用此脚本的二进制格式，即 elixir_drip.boot 文件，该文件也存在于此文件夹中。\n\
  \n要运行发布，我们首先需要为 Distillery 设置预期的环境变量以便在运行时进行插值，然后我们就可以使用 _build/prod/rel/elixir_drip/bin/elixir_drip\
  \ console 交互式运行发布：\n\n```\n$ export REPLACE_OS_VARS=true POD_IP=127.0.0.1 ERLANG_COOKIE=cookie\n\
  DB_HOST=postgres DB_PORT=5432 DB_NAME=elixir_drip_dev DB_USER=postgres\nDB_PASS=123456\n\
  \n$ env $(cat secrets/credentials.dev.env | xargs)\n_build/prod/rel/elixir_drip/bin/elixir_drip\
  \ console\n\nErlang/OTP 20 [erts-9.3.1] [source] [64-bit] [smp:4:4] [ds:4:4:10]\
  \ [async-threads:10] [hipe] [kernel-poll:false]\n\n04:29:37.923 [info] Running ElixirDripWeb.Endpoint\
  \ with Cowboy using\nhttp://:::4000\nInteractive Elixir (1.6.4) - press Ctrl+C to\
  \ exit (type h() ENTER for help)\niex(elixir_drip@127.0.0.1)1>\n```\n\n还记得我们在自定义\
  \ vm.args 文件中之前设置的 ${POD_IP} 和 ${ERLANG_COOKIE} 占位符吗？在运行发布之前，我们需要将它们定义为环境变量，以及 Distillery\
  \ 应插值并在 elixir_drip 和 elixir_drip_web config/prod.exs 配置文件中提到的每一个其他环境变量。\n\n通过在运行发布之前执行\
  \ env $(cat secrets/credentials.dev.env | xargs)，我们能够临时设置两个仅在当前发布运行期间存在的环境变量。这样，我们就可以避免永久设置包含敏感信息的\
  \ SECRET_KEY_BASE 和 GOOGLE_STORAGE_CREDENTIALS 环境变量：\n\n```\n$ cat secrets/credentials.dev.env\n\
  SECRET_KEY_BASE=vhlpO...\nGOOGLE_STORAGE_CREDENTIALS=ewogI...\n```\n\n在下一节中，我们将看到如何实现一个自定义发布任务，这将允许我们运行数据库迁移。\n\
  \n## 创建自定义发布任务\n\n当我们使用 Distillery 创建发布时，我们的 Elixir 应用程序会被转换为 Erlang/OTP 发布，与任何其他\
  \ Erlang 应用程序包无法区分。没有 Mix 项目，理想情况下也没有 Elixir 源代码，只有包含 BEAM 字节码的文件和启动发布所需的特定发布文件。\n\
  \n然而，这种节俭带来了问题：由于我们没有 Mix，使用 ecto.migrate Mix 任务与发布一起运行数据库迁移是不可能的。而且我们决心不将整个 Elixir\
  \ 项目发送到生产环境，因此我们需要找到一种不依赖 Mix 任务的方法。\n\n为了解决这个问题，我们将实现一个自定义发布任务，将迁移执行委托给 ElixirDrip.ReleaseTasks\
  \ 模块，该模块仅依赖于 :ecto 和 :postgrex 应用程序：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/release_tasks.ex\n\
  defmodule ElixirDrip.ReleaseTasks do\n  alias Ecto.Migrator\n\n  @start_apps [:postgrex,\
  \ :ecto]\n\n  def migrate_up, do: migrate(:up)\n  def migrate_down, do: migrate(:down)\n\
  \n  defp migrate(direction) do\n    options = case direction do\n      :up -> [all:\
  \ true]\n      :down -> [step: 1]\n    end\n\n    IO.puts(\"Loading ElixirDrip umbrella\
  \ app...\")\n    :ok = Application.load(:elixir_drip)\n\n    IO.puts(\"Starting\
  \ dependencies...\")\n    Enum.each(@start_apps, &Application.ensure_all_started/1)\n\
  \n    IO.puts(\"Starting ElixirDrip repo...\")\n    ElixirDrip.Repo.start_link(pool_size:\
  \ 1)\n\n    IO.puts(\"Running migrations for ElixirDrip...\")\n    run_migrations(direction,\
  \ options)\n\n    IO.puts(\"Success!\")\n    :init.stop()\n  end\n```\n\n```\ndefp\
  \ priv_dir(app), do: \"#{ :code.priv_dir(app) }\"\n\ndefp run_migrations(direction,\
  \ options) do\n  Migrator.run(ElixirDrip.Repo, migrations_path(:elixir_drip), direction,\
  \ options)\nend\n\ndefp migrations_path(app), do: Path.join([priv_dir(app), \"repo\"\
  , \"migrations\"])\nend\n```\n\n在此代码片段中，大部分工作由 migrate/1 私有函数执行。根据迁移方向，它会应用尚未运行的所有迁移（:up\
  \ 方向）或还原最后一次应用的迁移（:down 方向）。在依赖 Ecto.Migrator 运行迁移之前，它会加载 :elixir_drip 应用程序并等待 :ecto\
  \ 和 :postgrex 应用程序启动，因为我们需要它们处于运行状态才能正确应用/还原迁移。\n\n在重新构建发布后，我们可以通过依赖 Distillery\
  \ 提供的 command 工具来运行 ReleaseTasks.migrate_up/0 函数：\n\n```\n$ ERLANG_COOKIE=cookie\
  \ REPLACE_OS_VARS=true\n_build/prod/rel/elixir_drip/bin/elixir_drip command\nElixir.ElixirDrip.ReleaseTasks\
  \ migrate_up\nLoading ElixirDrip umbrella app...\nStarting dependencies...\nStarting\
  \ ElixirDrip repo...\nRunning migrations for ElixirDrip...\nSuccess!\n17:12:06.169\
  \ [info] Already up\n```\n\n请记住，每个 Elixir 模块都有一个 Elixir. 前缀（ElixirDrip.ReleaseTasks\
  \ == Elixir.ElixirDrip.ReleaseTasks 的计算结果为 true）。我们在之前的代码片段中必须为 ElixirDrip.ReleaseTasks\
  \ 添加前缀，因为我们处于 Erlang 的领域，因此没有 IEx 来自动为我们添加 Elixir. 前缀。\n\n与其使用 Distillery command\
  \ 工具，我们将在 rel/commands 文件夹中创建两个 shell 脚本 migrate_up.sh 和 migrate_down.sh，以帮助我们运行这些自定义任务。如你所见，migrate_up.sh\
  \ 脚本只是模仿了我们在上一个代码片段中所做的事情：\n\n```\n$ cat rel/commands/migrate_up.sh\n#!/bin/sh\n\
  $RELEASE_ROOT_DIR/bin/elixir_drip command Elixir.ElixirDrip.ReleaseTasks migrate_up\n\
  ```\n\n\n\nThe last step is to define two custom commands in the `:elixir_drip`\
  \ release, `migrate_up` and `migrate_down`, which will respectively run the previous\
  \ two shell scripts:\n\n```\n$ cat rel/config.exs\n  # ...\nrelease :elixir_drip\
  \ do\n  set vm_args: \"rel/custom.vm.args\"\n  set version: current_version(:elixir_drip)\n\
  \  set applications: [\n    :runtime_tools,\n    elixir_drip: :permanent,\n    elixir_drip_web:\
  \ :permanent\n  ]\n  set commands: [\n    \"migrate_up\": \"rel/commands/migrate_up.sh\"\
  ,\n    \"migrate_down\": \"rel/commands/migrate_down.sh\"\n  ]\nend\n```\n\nIf we\
  \ now run the `elixir_drip` release with no arguments, it shows the two custom commands\
  \ we've just created:\n\n```\n$ _build/prod/rel/elixir_drip/bin/elixir_drip\nUsage:\
  \ elixir_drip <task>\n\nService Control\n====================\n  # ...\nCustom Commands\n\
  ====================\n/opt/app/elixir_drip/_build/prod/rel/elixir_drip/releases/0.0.8/commands/migrate_down.sh\n\
  /opt/app/elixir_drip/_build/prod/rel/elixir_drip/releases/0.0.8/commands/migrate_up.sh\n\
  ```\n\nWe can now run the new custom commands as follows:\n\n```\n$ ERLANG_COOKIE=cookie\
  \ REPLACE_OS_VARS=true _build/prod/rel/elixir_drip/bin/elixir_drip migrate_up\n\
  Loading ElixirDrip umbrella app...\nStarting dependencies...\nStarting ElixirDrip\
  \ repo...\nRunning migrations for elixir_drip...\nSuccess!\n15:13:25.946 [info]\
  \ Already up\n```\n\nWe're well on our way to having our application running on\
  \ the cloud. In the next section, we'll use Docker to *containerize* our application.\n\
  \n## Containerizing our application\n\nBefore we start laying the foundation of\
  \ how we deploy our application to the cloud, we need to have our application running\
  \ inside containers. To introduce containers, let's first analyze the problem they\
  \ try to solve.\n\nTo build and run our ElixirDrip project, we need Erlang, Elixir,\
  \ and Node.js correctly installed and available in the current $PATH, ready to be\
  \ used. To deploy the application in production, we need to make sure those dependencies\
  \ have the exact same version and are installed in production in the exact same\
  \ way, because only then we can be sure the application behavior will be the same.\n\
  \nDoing things like this is cumbersome and time-consuming, but not an impossible\
  \ endeavor. If only we had a cleaner way of building the environment and then saving\
  \ it, so we could reuse it at a later time, wherever we needed it. This is exactly\
  \ what containers allow us to do.\n\nContainers are lightweight wrappers for applications,\
  \ which not only contain the applications themselves, but also everything needed\
  \ to successfully run them. Each container has its own processes, memory, and network\
  \ interfaces, and runs in a secure way, isolated from other containers and the host\
  \ operating system.\n\nSince a containerized application is self-contained, it can\
  \ be deployed to different environments as is. Because containers are lightweight,\
  \ their deployment is fast and requires a fewer resources than fully fledged virtual\
  \ machines.\n\nContainers are instantiated from *images*, which are nothing more\
  \ than snapshots of applications in their habitats. These images are created from\
  \ *recipes* that describe how the application code, its configuration, and dependencies\
  \ are set up inside the container. When we want to run a container, we indicate\
  \ from which image the container will be instantiated.\n\nAn application running\
  \ inside a container is able to write to the filesystem as it normally would, but\
  \ it will never change the underlying image. Images are read only, so you can be\
  \ sure that if an application runs locally with a given image, it will also run\
  \ in other environments with the same image.\n\n![](img/c636f4cfb07f25f1db535995e50706ed_463_0.png)\n\
  \nSo far, we have talked about generic container concepts. From this point forward,\
  \ we will analyze Docker examples, since this is the tool we'll use to create, manage,\
  \ and run our application containers. All the examples in this chapter could also\
  \ be achieved with other equivalent tools, such as rkt.\n\nWhen you want to use\
  \ an image you've just built locally on a remote machine, you can push it to a Docker\
  \ registry and then fetch it from there. Since the image will be the same in both\
  \ places, you can be sure the containers instantiated from it will be identical,\
  \ with no more unpleasant surprises after deploying.\n\n```\n$ cat examples/Dockerfile.simple\n\
  FROM elixir:1.6.4-alpine\n\nEXPOSE 4001\n\nCMD while true; do echo \"Hello World!\"\
  \ | nc -l -p 4001; done\n```\n\nIn the previous snippet, you can find Dockerfile,\
  \ a simple image recipe, based on an elixir:1.6.4-alpine image that already exists\
  \ in the Docker public registry. After fetching this image, Docker exposes port\
  \ 4001 and in the end runs a shell script forever that uses Netcat to deliver a\
  \ Hello World! message.\n\nTo build the previous image, we are specifying the image\
  \ tag (with -t) and indicating a specific examples/Dockerfile.simple (with -f).\
  \ The last argument is the context in which the image is created; in our case, it's\
  \ the examples folder:\n\n```\n$ docker build -t hello_world -f examples/Dockerfile.simple\
  \ examples\nSending build context to Docker daemon 53.25kB\nStep 1/3 : FROM elixir:1.6.4-alpine\n\
  ---> cb08ed0e151a\nStep 2/3 : EXPOSE 4001\n---> Using cache\n---> 43710db729b1\n\
  Step 3/3 : CMD while true; do echo \"Hello World!\" | nc -l -p 4001; done\n--->\
  \ Using cache\n---> 9d2c59bb56f7\nSuccessfully built 9d2c59bb56f7\nSuccessfully\
  \ tagged hello_world:latest\n```\n\nWe can now see the image labeled as hello_world:latest\
  \ with docker images:\n\n```\n$ docker images\nREPOSITORY TAG IMAGE ID CREATED SIZE\n\
  hello_world latest 9d2c59bb56f7 12 minutes ago 84.1MB\n```\n\nWe can now run the\
  \ image with docker run -p 4001:4001 hello_world:latest. The -p option binds port\
  \ 4001 in the container to port 4001 in the host. If we now open another terminal,\
  \ we can interact with the container by sending requests to local port 4001:\n\n\
  ```\n$ curl localhost:4001\nHello World!\n```\n\nWe can observe our running container\
  \ with docker ps. Since we are executing an infinite loop, the container will never\
  \ end on its own if we don't stop it:\n\n```\n$ docker ps\nCONTAINER ID IMAGE COMMAND\
  \ STATUS PORTS NAMES\neefca9fe7d54 hello_world:latest \"/bin/sh -c 'while...'\"\
  \ Up 4 minutes 0.0.0.0:4001->4001/tcp determined_shtrn\n```\n\nDocker named our\
  \ container determined_shtrn, so we can do all container operations with this name,\
  \ instead of using the unmemorable eefca9fe7d54 container ID. If we want to set\
  \ the container name, we can use the --name option when we do docker run. To stop\
  \ the container we've just started, it is just a matter of running docker stop <container\
  \ name|id>.\n\nAfter this crash course on Docker, we can now run our application\
  \ inside a Docker container.\n\n## Creating a development container\n\nTo create\
  \ our container, we need to define the recipe describing how the image is assembled.\
  \ Docker recipes are called Dockerfiles, and are nothing more than text files describing\
  \ the operations needed to build the images.\n\nThe following snippet shows our\
  \ Dockerfile.dev, since this is the Dockerfile that we'll use while developing:\n\
  \n```\n$ cat Dockerfile.dev\nFROM elixir:1.6.4-alpine\n\nENV TERM xterm\nENV LANG\
  \ en_US.UTF-8\nENV LANGUAGE en_US:en\nENV LC_ALL en_US.UTF-8\n\nENV REFRESHED_AT\
  \ 2018-06-05\n\nENV APP_PATH /opt/app\nENV APP_NAME elixir_drip\nENV HTTP_PORT 4000\n\
  ENV MIX_ENV dev\n\nRUN apk add --no-cache build-base git inotify-tools nodejs nodejs-npm\n\
  RUN mix archive.install https://github.com/phoenixframework/archives/raw/master/phx_new.ez\
  \ --force\nRUN mix local.hex --force && mix local.rebar --force\n\nCOPY . $APP_PATH/$APP_NAME\n\
  \nWORKDIR $APP_PATH/$APP_NAME\n\nEXPOSE $HTTP_PORT\n\nCMD [\"mix run --no-halt\"\
  ]\n```\n\nIn this Dockerfile, the first lines starting with FROM indicate the parent\
  \ image that we'll use; in our case, it will be the elixir:1.6.4-alpine image, which\
  \ already comes with Elixir and Erlang installed in a compact Linux distribution\
  \ called Alpine. We then set some environment variables (using the ENV instructions),\
  \ such as the application path, name, the port it will use, and the MIX_ENV that\
  \ controls the Mix environment.\n\nAfterward, we use the RUN Docker instruction\
  \ to install some dependencies in our container: git, nodejs, and the accompanying\
  \ npm are installed with apk (the package management tool of Alpine Linux, on which\
  \ our image is based). We then use mix to install Phoenix, Hex, and rebar3 (an Erlang\
  \ tool to create Erlang releases, used by many library dependencies).\n\nThe last\
  \ portion of the Dockerfile copies the current directory (the root of the umbrella\
  \ project) to the /opt/app/elixir_drip container path, sets the current directory\
  \ inside the container, exposes the port, and ends by running the project with mix\
  \ run --no-halt.\n\n![](img/c636f4cfb07f25f1db535995e50706ed_465_0.png)\n\nWe could\
  \ have run the application with CMD mix run --no-halt (without the command being\
  \ inside an array, that is, in shell form), but in this situation Docker prefixes\
  \ the command with /bin/sh -c '<command>', which may bring some funky behavior (in\
  \ this case, your command wouldn't be running as PID 1, among other shell subtleties).\
  \ Hence, it's usually better to run the command as we do in the Dockerfile with\
  \ the array, also called exec form.\n\nWe've just created our first Dockerfile.\
  \ Let's see how can we run it alongside other containers that we'll need.\n\n\n\n\
  \n## 协调多个容器\n\n每次启动 ElixirDrip 时，它都会尝试连接到正在运行的 Postgres 数据库。如果我们在本地开发环境中在容器内运行它，情况不会有所不同。在这种情况下，我们可以本地安装\
  \ Postgres，可以将应用程序设置为连接到作为服务提供的远程数据库，或者可以启动一个运行 Postgres 数据库的新容器。由于这仅用于本地开发目的，容器选项很适合我们。因为我们不在乎临时存储的数据，容器停止后它就可以被删除。\n\
  \n下一步可以是为数据库容器编写 Dockerfile，然后创建 Docker 网络管道以连接 ElixirDrip 和数据库容器。虽然这种方法可行，但有一个名为\
  \ Docker Compose 的工具可以帮助处理这种情况。\n\n与我们为 ElixirDrip Docker 镜像所做的工作类似，我们现在将创建说明如何运行和连接多个容器的配方。然后\
  \ docker-compose 工具会处理这个配方，即一个普通的 YAML 文件，并启动容器以及所有其他声明的 Docker 资源。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_466_0.png)\n\
  \n默认情况下，docker-compose 输入文件名为 docker-compose.yml。我们将其命名为 docker-compose.dev.yml，因为我们将有多个\
  \ docker-compose 文件（另一个文件将负责运行应用程序测试套件并创建应用程序发布版）。\n\n让我们先分析 docker-compose.dev.yml\
  \ 如何启动 ElixirDrip 应用程序：\n\n```\n$ cat docker-compose.dev.yml\nversion: '2.1'\nservices:\n\
  \  app:\n    image: elixir_drip:dev\n    build:\n      context: .\n      dockerfile:\
  \ Dockerfile.dev\n    env_file: ./env/dev.env\n    environment:\n      SECRET_KEY_BASE:\n\
  \      GOOGLE_STORAGE_CREDENTIALS:\n    ports:\n      - 4000:4000\n    command:\
  \ sh /opt/app/elixir_drip/script/start.sh\n    depends_on:\n```\n\n```\npostgres:\n\
  \  condition: service_healthy\n  networks:\n    - default\n  volumes:\n    - ./opt/app/elixir_drip\n\
  # ...\n```\n\n在之前的片段中，我们声明了一个名为 app 的服务，它将使用从 Dockerfile.dev 文件构建的镜像（该镜像将被标记为 elixir_drip:dev）。除了\
  \ Dockerfile 中设置的环境变量外，它还将设置 env/dev.env 文件中存在的新变量（该文件的每一行都有 <name>=<value> 格式）。\n\
  \n我们还在 environment 部分设置了 SECRET_KEY_BASE 和 GOOGLE_STORAGE_CREDENTIALS 环境变量，但未为其定义任何值。因为这是敏感信息，我们不会将其存储在\
  \ env/dev.env 文件中。由于我们未为这些变量设置值，在启动容器时，docker-compose 会在主机环境中查找这两个环境变量并将其值设置在容器内部。\n\
  \n然后，我们将主机端口 4000 绑定到相同的容器端口，并通过运行 script/start.sh shell 脚本来覆盖 Dockerfile.dev 中设置的初始命令。在\
  \ depends_on 部分，我们声明 app 服务依赖于 postgres 服务以健康状态运行（我们稍后会定义什么是健康）并且它应加入名为 default\
  \ 的网络。\n\n我们通过挂载卷来完成 app 服务的定义，这意味着当前目录（即 umbrella 项目根目录）中的每个更改都将反映在容器内的 /opt/app/elixir_drip\
  \ 文件夹中（反之亦然）。\n\n正如我们所见，app 服务依赖于 postgres 服务，但我们尚未定义它。让我们修复这个问题：\n\n```\n$ cat\
  \ docker-compose.dev.yml\nversion: '2.1'\nservices:\n  app:\n    # ...\npostgres:\n\
  \  environment:\n    POSTGRES_USER: postgres\n    POSTGRES_PASSWORD: \"123456\"\n\
  \    PSQL_TRUST_LOCALNET: 'true'\n    ENCODING: UTF8\n```\n\n```\nimage: postgres:9.6\n\
  healthcheck:\n  test: [\"CMD\", \"pg_isready\", \"-d\", \"postgres\", \"-U\", \"\
  postgres\"]\n  interval: 10s\n  timeout: 3s\n  retries: 10\nports:\n  - 5000:5432\n\
  networks:\n  - default\n```\n\n这个 postgres 服务更简单，因为它没有 Dockerfile 或自己的 env_file。我们声明其环境变量、用于启动容器的镜像，然后定义应如何执行健康检查。在这种情况下，如果\
  \ pg_isready -d postgres -U postgres shell 命令成功返回，Docker Compose 认为 postgres 服务是健康的，从而启动\
  \ app 服务。然后我们像之前一样映射端口，并确保 postgres 服务加入相同的 default 网络。\n\n正如你在这里看到的，当 app 服务启动时，script/start.sh\
  \ shell 脚本会获取所有 Mix 依赖项，创建并迁移数据库，然后启动 Phoenix 服务器：\n\n```\n$ cat script/start.sh\n\
  mix deps.get\nmix ecto.create && mix ecto.migrate\nmix phx.server\n```\n\n在第一次运行\
  \ compose 文件之前，我们只需在当前 shell 中设置 secret 环境变量。由于我们处于开发环境，可以简单地使用 export $(cat secrets/credentials.test.env\
  \ | xargs) 使用假的测试值。\n\n我们现在能够使用 docker-compose -f docker-compose.dev.yml up 运行 docker-compose.dev.yml\
  \ compose 文件。如果是第一次运行，你会看到 Docker 正在构建 Dockerfile.dev 镜像，获取 postgres:9.6 镜像，启动 postgres\
  \ 服务，然后启动 app 服务。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_469_0.png)\n\n使用 `docker-compose`\
  \ 启动所有容器时传递 `-d` 选项（即 `docker-compose -f docker-compose.dev.yml up -d`）以*分离*模式启动它们，这意味着它们不会占用当前的\
  \ `STDOUT` shell，并将在后台继续运行。如果你仍想查看 `docker-compose.dev.yml` 文件启动的所有容器的日志，请运行 `docker-compose\
  \ -f docker-compose.dev.yml logs -ft`，其中 `-f` 选项表示我们想要跟随所有容器的日志输出，`-t` 选项表示我们想要查看每条日志消息的时间戳。\n\
  \n我们也可以使用 `docker ps` 查看两个正在运行的容器（由于 `umbrella` 项目文件夹名称，两个容器名称都有 `umbrella_` 前缀）：\n\
  \n$ docker ps\n\n| 容器 ID | 镜像 | 命令 | 创建时间 | 状态 | 端口 | 名称 |\n|---|---|---|---|---|---|---|\n\
  | a1935721c401 | elixir_drip:dev | \"sh /opt/app/elixir_...\" | 8 minutes ago |\
  \ Up 5 minutes | 0.0.0.0:4000->4000/tcp | umbrella_app_1 |\n| a895dda2e1cd | postgres:9.6\
  \ | \"docker-entrypoint.s...\" | 8 minutes ago | Up 5 minutes (healthy) | 0.0.0.0:5000->5432/tcp\
  \ | umbrella_postgres_1 |\n\n你现在应该能够从主机机器访问容器内运行的 ElixirDrip 应用程序：\n\n```\n$ curl\
  \ http://localhost:4000\n<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n     \
  \   <meta charset=\"utf-8\">\n# ...\n```\n\n如果你想在 `umbrella_app_1` 容器内运行一个 shell，只需执行\
  \ `docker exec -it umbrella_app_1 sh` 即可。我们需要同时使用 `-i` 和 `-t` 选项才能与容器内运行的 shell\
  \ 进程进行交互。\n\n在下面的代码片段中，我们可以看到容器内运行的所有进程。启动脚本是 PID 1 进程，它生成了在 Erlang VM 之上运行我们应用程序的其他进程：\n\
  \n```\n$ docker exec -i -t umbrella_app_1 sh\n\n/opt/app/elixir_drip> ps aux\nPID\
  \ USER TIME COMMAND\n  1 root 0:00 sh /opt/app/elixir_drip/script/start.sh\n 152\
  \ root 0:02 /usr/local/lib/erlang/erts-9.3.1/bin/beam.smp -- -root\n/usr/local/lib/erlang\
  \ -progname erl -- -home /root -- -pa\n```\n\n```\n173 root 0:00 erl_child_setup\
  \ 1048576\n197 root 0:00 inet_gethost 4\n198 root 0:00 inet_gethost 4\n199 root\
  \ 0:00 sh\n204 root 0:00 ps aux\n```\n\n由于应用程序已经在运行并监听端口 4000，我们无法再次启动应用程序并附加 IEx\
  \ shell（即 `iex -S mix phx.server`）。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_470_0.png)\n\
  \n如果你想在通过 `docker-compose up` 启动容器时强制构建 `docker-compose.yml` 文件中存在的镜像，请传递 `--build`\
  \ 选项，如 `docker-compose -f docker-compose.dev.yml up --build -d`。\n\n为克服此问题，你可以暂时将\
  \ `start.sh` 脚本中的 `mix phx.server` 行替换为 `tail -f /dev/null` 并以相同方式再次启动容器。由于 `tail\
  \ -f /dev/null` 永不结束，它将使 app 服务容器无限期运行。当你再次在容器内运行 shell 时，你会发现：\n\n```\n$ docker\
  \ exec -i -t umbrella_app_1 sh\n\n/opt/app/elixir_drip> ps aux\nPID USER TIME COMMAND\n\
  1 root 0:00 sh /opt/app/elixir_drip/script/start.sh\n153 root 0:00 tail -f /dev/null\n\
  154 root 0:00 sh\n160 root 0:00 ps aux\n```\n\n由于没有应用程序在运行，我们现在能够*手动*使用 `iex -S\
  \ mix phx.server` 或如果不需要 IEx shell 则使用 `mix phx.server` 启动应用程序。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_470_1.png)\n\
  \n如果你不想更改 `start.sh` 脚本，也可以改用 `docker-compose -f docker-compose.dev.yml run -d app\
  \ tail -f /dev/null` 运行 app 服务来覆盖 `docker-compose.dev.yml` 文件中设置的命令。因为我们没有运行 `start.sh`\
  \ 脚本，在能够运行应用程序之前，我们仍需要在容器 shell 内运行 `mix deps.get` 和 `mix ecto.create && mix ecto.migrate`\
  \ 命令。\n\n\n\n\n我们现在拥有一个容器化的开发环境，可以轻松启动并进行试验。我们的部署也将大量依赖容器，因此在下一节中，我们将学习我们的解决方案如何随之改变以满足部署需求。\n\
  \n## 组合部署容器\n\n我们的目标是拥有一种自动化方式来运行项目测试套件，如果一切顺利，则构建一个仅包含发布版本的新镜像并推送到生产环境。\n\n为此，我们将使用特定的\
  \ compose 文件 docker-compose.test.yml，它执行两个步骤：首先，它启动构建发布、运行测试并将镜像标记为 release_prepared:latest\
  \ 的 release 服务。然后，它启动 app 服务，该服务通过从上一个镜像复制发布来创建最终镜像：\n\n```\n$ cat umbrella/docker-compose.test.yml\n\
  version: '2.3'\nservices:\n  app:\n    # ...\n  release:\n    image: release_prepared:latest\n\
  \    build:\n      context: .\n      dockerfile: Dockerfile\n    env_file:\n   \
  \   - ./env/test.env\n    working_dir: /opt/app/elixir_drip\n    command: [\"/bin/sh\"\
  , \"script/test.sh\"]\n    ports:\n      - 4000:4000\n    depends_on:\n      postgres:\n\
  \        condition: service_healthy\n  postgres:\n    # ...\n```\n\n如以下代码所示，Compose\
  \ `release` 服务使用的 `Dockerfile` 执行了发布所需的大部分工作。它首先获取依赖项，编译应用程序和 Phoenix 资产，然后构建发布。最后，它将\
  \ `elixir_drip.tar.gz` 复制到 `/tmp/elixir_drip` 文件夹。\n\n```\n$ cat Dockerfile\nFROM\
  \ elixir:1.6.4-alpine\n\n# Setting the needed environment variables\nENV APP_PATH\
  \ /opt/app\nENV APP_NAME elixir_drip\nENV APP_VERSION 0.0.8\nENV HTTP_PORT 4000\n\
  ENV HTTPS_PORT 4040\nENV MIX_ENV prod\n\n# Installing the dependencies\nRUN apk\
  \ add --no-cache build-base git nodejs nodejs-npm\nRUN mix archive.install https://github.com/phoenixframework/archives/raw/master/phx_new.ez\
  \ --force\nRUN mix local.hex --force && mix local.rebar --force\n\n# Copying the\
  \ host current folder to the container\nCOPY . $APP_PATH/$APP_NAME\nWORKDIR $APP_PATH/$APP_NAME\n\
  \n# Compiling the project and the Phoenix static assets\nRUN MIX_ENV=$MIX_ENV mix\
  \ do clean, deps.get, compile\nRUN cd apps/elixir_drip_web/assets \\\n    && npm\
  \ install \\\n    && ./node_modules/brunch/bin/brunch b -p\n\n# Building the release\n\
  RUN cd $APP_PATH/$APP_NAME \\\n    && MIX_ENV=$MIX_ENV mix phx.digest \\\n    &&\
  \ MIX_ENV=$MIX_ENV mix release --env=$MIX_ENV\n\n# Setting up the release to be\
  \ copied\nRUN mkdir -p /tmp/$APP_NAME\nRUN cp $APP_PATH/$APP_NAME/_build/$MIX_ENV/rel/$APP_NAME/releases/$APP_VERSION/$APP_NAME.tar.gz\
  \ /tmp/$APP_NAME\n\nWORKDIR /tmp/$APP_NAME\nRUN tar -xzf $APP_NAME.tar.gz\nRUN rm\
  \ -rf $APP_NAME.tar.gz\nRUN echo \"Release in place, ready to be copied.\"\n\nEXPOSE\
  \ $HTTP_PORT $HTTPS_PORT\n\nCMD [\"sh\", \"-c\", \"/bin/$APP_NAME foreground\"]\n\
  ```\n\n与之前的 release 服务相比，app 服务稍微简单一些。该服务基于 Dockerfile.deploy 配方构建镜像，并将其标记为 gcr.io/${PROJECT_ID}/elixir-drip-prod:${BUILD_TAG}。由于它依赖于\
  \ release 服务，app 服务只有在 release 已经启动后才会开始。\n\n在下一节中，我们将了解我们设置的镜像标签背后的原因，但现在，请注意此标签需要在\
  \ Compose docker-compose.test.yml 文件启动之前设置 PROJECT_ID 和 BUILD_TAG 环境变量：\n\n```\n\
  $ cat umbrella/docker-compose.test.yml\nversion: '2.3'\nservices:\n  app:\n    image:\
  \ gcr.io/${PROJECT_ID}/elixir-drip-prod:${BUILD_TAG}\n    build:\n      context:\
  \ .\n      dockerfile: Dockerfile.deploy\n    depends_on:\n      - release\n   \
  \ command: [\"echo\", \"Release image ready to be deployed.\"]\n  release:\n   \
  \ # ...\n  postgres:\n    # ...\n```\n\nDockerfile.deploy 文件的主要目的是将由 Compose release\
  \ 服务构建的 release_prepared:latest 镜像中的发布文件夹复制到将部署到生产环境的镜像中。为此，源镜像在第一个 FROM 命令中被别名为\
  \ builder，然后作为 COPY 命令的 --from 选项的源使用：\n\n```\n$ cat Dockerfile.deploy\nFROM release_prepared:latest\
  \ as builder\n\nRUN ls -la /tmp/elixir_drip \\\n&& echo \"Found the release, will\
  \ copy it to the final image.\"\n\nFROM elixir:1.6.4-alpine as runner\n# ...\nENV\
  \ APP_PATH /opt/app\nENV APP_NAME elixir_drip\nENV HTTP_PORT 4000\nENV HTTPS_PORT\
  \ 4040\nENV REPLACE_OS_VARS true\n\nRUN apk add --no-cache bash\n\nCOPY --from=builder\
  \ /tmp/$APP_NAME $APP_PATH/$APP_NAME\n\nWORKDIR $APP_PATH/$APP_NAME\n\nEXPOSE $HTTP_PORT\
  \ $HTTPS_PORT\n\nCMD [\"sh\", \"-c\", \"bin/$APP_NAME foreground\"]\n```\n\n通过这种方法，我们能够部署一个仅包含发布版本及其运行所需依赖项（即\
  \ bash）的镜像，将部署镜像的大小从 575 MB 减少到 122 MB：\n\n```\n$ docker images\nREPOSITORY TAG\
  \ IMAGE ID CREATED SIZE\ngcr.io/<project_id>/elixir-drip-prod v0.0.8 c8b38f6bbdb2\
  \ 7 hours ago 122MB\nrelease_prepared latest 7f7043ed9ac8 7 hours ago 575MB\n# ...\n\
  ```\n\n除了体积更小之外，部署的镜像不包含任何源代码，因此如果恶意用户获得了生产服务器之一的访问权限，其影响也会降低。\n\n如果我们现在运行 PROJECT_ID=<project_id>\
  \ BUILD_TAG=<build_tag> docker-compose -f docker-compose.test.yml run app，我们将触发刚刚分析的过程，最后，一个标记为\
  \ <project_id>:<build_tag> 的镜像将存在，准备好部署。\n\n在下一节中，我们将了解 ElixirDrip 生产环境的工作方式以及使应用程序在云上运行所需的步骤。\n\
  \n## 部署到 Kubernetes\n\n我们现在将 ElixirDrip 应用程序部署到 Google Kubernetes Engine (GKE)，这是\
  \ Google 提供的托管 Kubernetes (K8s) 解决方案。Kubernetes 是一个开源工具，它允许我们通过依赖配置文件并提供统一的自动化每项操作的方式来配置、编排和扩展大量容器。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_475_0.png)\n\nGoogle 提供 12 个月的免费试用期，附带\
  \ 300 美元的信用额度，用于尝试组成 Google Cloud Platform 的服务，包括 Google Kubernetes Engine（请查看 https://cloud.google.com/free/）。这使我们的读者能够免费尝试托管的\
  \ K8s 解决方案。作为替代方案，本节及以下各节中的所有示例也适用于 `minikube`，这是一种可在本地计算机上运行 K8s 集群的工具（请查看 https://kubernetes.io/docs/getting-started-guides/minikube/）。\n\
  \n在深入部署任务之前，我们需要澄清 Kubernetes 使用的一些概念和命名法。一个 **集群** 由一个或多个 **节点** 组成，每个节点都提供计算资源，例如\
  \ CPU、内存和磁盘。如果您想分离集群的资源，可以创建 **命名空间**，它们像虚拟集群一样工作。\n\n由于这些计算资源是集群化的，当您部署某项内容时，只需说明它需要多少\
  \ CPU 和内存，Kubernetes 就会确保应用程序拥有其工作所需的一切。请注意，您不需要指定应用程序运行在哪個节点上；您只需指定应用程序需求，Kubernetes\
  \ 就会为您处理负载分配。如果某个节点突然损坏，负载将被透明地转移到其他可用节点。\n\n在之前的章节中，我们已经对应用程序进行了容器化，但我们不会直接将容器部署到\
  \ Kubernetes。相反，K8s 有 **Pod** 的概念，它只不过是一组一个或多个容器。由于 pod 的创建方式，同一 pod 中的容器共享相同的 IP\
  \ 地址和端口空间。\n\n为了部署我们的 ElixirDrip 应用程序，我们将适当使用 **部署** 控制器，它描述了如何创建将为我们的应用程序提供服务的\
  \ pod。部署 pod 后，只要其资源需求得到满足，它就会愉快地运行。\n\n默认情况下，集群外部无法访问任何 pod，因此如果我们想用它来为客户端请求提供服务，就必须以某种方式将其暴露。在任何给定时刻，都可能启动\
  \ pod 以应对请求激增，那么我们如何将请求路由到本质上是临时的 pod 呢？这是通过创建 **服务** 实现的，该服务将从外部可访问的端口映射到由其标签而不是\
  \ IP 标识的特定 pod 组。\n\n\n\n同样重要的是要注意，所有这些 Kubernetes 对象，例如 pods、services 和 deployments，都使用相似的\
  \ YAML 配置文件表示。这是一个至关重要的方面，因为它有效地使你能够将基础设施作为代码存储在代码仓库中。此外，你与 Kubernetes 集群的所有交互，包括应用基础设施更改，都可以使用\
  \ `kubectl` 工具完成。使用单一的通用接口处理所有与 Kubernetes 相关的内容，显著简化了用户体验。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_476_0.png)\n\
  \n在 Google Cloud Platform 上创建账户后，安装并运行 Google Cloud SDK 工具（`gcloud init`）以登录并创建一个新项目。你现在可以使用\
  \ `gcloud container clusters create <cluster-name>` 创建集群。如果尚未安装 `kubectl`，请使用 `gcloud`\
  \ 安装（即 `gcloud components install kubectl`），它将被自动配置为访问集群。如果已安装 `kubectl`，请运行 `gcloud\
  \ container clusters get-credentials <cluster-name>` 以使用集群凭据更新你的 `kubectl` 配置。\n\
  \n此时，你应该已创建 Google Cloud Platform 项目，并且 Kubernetes 集群正在运行中：\n\n```\n$ gcloud projects\
  \ list\nPROJECT_ID NAME PROJECT_NUMBER\nintense-talent-188323 My First Project 5338223468\n\
  \n$ gcloud container clusters list\nNAME LOCATION MASTER_VERSION MASTER_IP MACHINE_TYPE\
  \ NODE_VERSION NUM_NODES STATUS\nelixir-drip-prod-cluster europe-west1-b 1.8.8-gke.0\
  \ 35.205.44.153 n1-standard-1 1.8.8-gke.0 1 RUNNING\n\n$ kubectl cluster-info\n\
  Kubernetes master is running at https://35.205.44.153\nGLBCDefaultBackend is running\
  \ at\nhttps://35.205.44.153/api/v1/namespaces/kube-system/services/default-http-backend:http/proxy\n\
  Heapster is running at\nhttps://35.205.44.153/api/v1/namespaces/kube-system/services/heapster/proxy\n\
  KubeDNS is running at\nhttps://35.205.44.153/api/v1/namespaces/kube-system/services/kube-dns:dns/proxy\n\
  kubernetes-dashboard is running at\nhttps://35.205.44.153/api/v1/namespaces/kube-system/services/https:kubernetes-dashboard:/proxy\n\
  ```\n\n我们将使用的大多数 Google Cloud Platform 服务都需要关联到一个计费账户。前往 https://console.cloud.google.com，选择左侧的\
  \ Billing，然后选择 New billing account 以创建并启用计费账户。创建账户后，使用其计费账户 ID 将当前项目链接到它：\n\n```\n\
  $ gcloud beta billing projects link intense-talent-188323 --billing-account=012345-6789AB-CDEF01\n\
  billingAccountName: billingAccounts/012345-6789AB-CDEF01\nbillingEnabled: true\n\
  name: projects/intense-talent-188323/billingInfo\nprojectId: intense-talent-188323\n\
  \n$ gcloud beta billing projects list --billing-account=012345-6789AB-CDEF01\nPROJECT_ID\
  \ BILLING_ACCOUNT_ID BILLING_ENABLED\nintense-talent-188323 012345-6789AB-CDEF01\
  \ True\n```\n\n我们还需要在项目上激活以下 Google API：Kubernetes Engine API（container.googleapis.com）、Container\
  \ Registry API（containerregistry.googleapis.com）、Cloud SQL（sql-component.googleapis.com）、Cloud\
  \ SQL API（sqladmin.googleapis.com）、Cloud Storage（storage-component.googleapis.com）以及\
  \ Cloud Storage JSON API（storage-api.googleapis.com）。要激活这些服务，请对每个 API URL 运行 gcloud\
  \ services enable <API> 命令，如下所示：\n\n```\n$ gcloud services enable container.googleapis.com\n\
  Waiting for async operation operations/tmo-acf.b1897824-... to complete...\nOperation\
  \ finished successfully.\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_477_0.png)\n\
  \n由于你拥有的额度，在免费试用期间不会被计费。尽管如此，请记住在完成工作后停止所有 Google Cloud Platform 服务并删除所有 Kubernetes\
  \ 对象，以避免仅因空闲计算而耗尽所有免费额度。快速停止所有操作的方法是关闭与项目关联的计费账户。\n\n让我们现在配置在部署到云端时将由我们的应用程序使用的数据库。\n\
  \n## 配置云数据库\n\n在本地开发环境中，我们每次使用 docker-compose up 启动应用程序时都会启动一个 Postgres 数据库。当我们将应用程序部署到\
  \ Kubernetes 集群时，我们不会采用这种方法，因为我们将使用 Google 提供的 Cloud SQL 数据库解决方案。\n\n使用 gcloud sql\
  \ 创建新的数据库实例（这需要几分钟时间）：\n\n```\n$ gcloud sql instances create elixir-drip-production\
  \ --database-version=POSTGRES_9_6\n# ...\n\n$ gcloud sql instances list\nNAME DATABASE_VERSION\
  \ LOCATION TIER ADDRESS STATUS\nelixir-drip-production POSTGRES_9_6 europe-west1-b\
  \ db-custom-1-3840 35.195.47.137 RUNNABLE\n```\n\n让我们现在创建应用程序将使用的 postgres 数据库用户：\n\
  \n```\n$ gcloud sql users create postgres % --instance=elixir-drip-production --password=a-really-c0mplex-password\n\
  Creating Cloud SQL user...done.\nCreated user [exampleuser].\n\n$ gcloud sql users\
  \ list --instance=elixir-drip-production\nNAME HOST\npostgres\n```\n\n由于 Cloud SQL\
  \ 的工作方式，没有任何应用程序应能够直接连接到数据库。相反，应用程序应连接到 Cloud SQL 代理，后者将安全地处理数据库连接。为此，我们将部署包含两个容器的\
  \ pods，一个运行我们的应用程序，另一个运行 SQL 代理。\n\n每次外部应用程序需要访问 Google Cloud 资源时，我们都需要为其创建一个服务账户。然后我们可以通过定义分配给服务账户的角色来限制外部应用程序的访问。在这种情况下，服务账户需要访问数据库，因此我们将为其分配\
  \ roles/cloudsql.client：\n\n```\n$ gcloud iam service-accounts create elixirdrip-prod-sql-client\
  \ --display-name \"ElixirDrip Prod SQL client\"\nCreated service account [elixirdrip-prod-sql-client].\n\
  \n$ gcloud projects add-iam-policy-binding intense-talent-188323 --member serviceAccount:elixirdrip-prod-sql-client@intense-talent-188323.iam.gserviceaccount.com\
  \ --role roles/cloudsql.client\n```\n\n```\nbindings:\n  # ...\n- members:\n  -\
  \ serviceAccount:elixirdrip-prod-sql-client@intense-talent-188323.iam.gserviceaccount.com\n\
  \    role: roles/cloudsql.client\n  # ...\n\n$ gcloud iam service-accounts keys\
  \ create secrets/elixirdrip-prod-sql.json --iam-account elixirdrip-prod-sql-client@intense-talent-188323.iam.gserviceaccount.com\n\
  created key [6fbd...] of type [json] as [secrets/elixirdrip-prod-sql.json]\nfor\
  \ [elixirdrip-prod-sql-client@intense-talent-188323.iam.gserviceaccount.com]\n$\
  \ cat secrets/elixirdrip-prod-sql.json\n{\n  \"type\": \"service_account\",\n  \"\
  project_id\": \"intense-talent-188323\",\n  \"private_key_id\": \"6fbd...\",\n \
  \ \"private_key\": \"abcdef...\"\n  # ...\n}\n```\n\n在之前的代码片段中，我们创建了 `elixirdrip-prod-sql-client`\
  \ 服务账户，为其分配了 `cloudsql.client` 角色，然后创建了一个服务账户密钥，该密钥将由 Cloud SQL 代理用于连接到数据库。\n\n\
  ![](img/c636f4cfb07f25f1db535995e50706ed_479_0.png)\n\n生成的密钥授予任何人更新数据库的权限，因此我们必须安全地存储它！不要将密钥与应用程序代码的其余部分一起存储！\n\
  \n当我们的应用程序 pod 部署时，Cloud SQL 代理容器将需要使用此密钥连接到数据库。为了使 pods 能够安全地访问此类敏感信息，Kubernetes\
  \ 提供了一种称为 **密钥** 的对象类型。\n\n密钥也按命名空间隔离，因此让我们在创建所有密钥之前先创建 `production` 命名空间。\n\n##\
  \ 创建命名空间\n\n由于我们使用的是单个集群，我们将创建两个命名空间，`staging` 和 `production`，以隔离分配给每个环境的资源。在实际场景中，你将拥有两个独立的集群，以降低\
  \ staging 故障影响生产应用程序的风险：\n\n```\n$ kubectl create namespace production\nnamespace\
  \ \"production\" created\n\n$ kubectl create namespace staging\nnamespace \"staging\"\
  \ created\n\n$ kubectl get namespaces\nNAME STATUS AGE\ndefault Active 31d\nkube-public\
  \ Active 31d\nkube-system Active 31d\nproduction Active 45s\nstaging Active 52s\n\
  ```\n\n这次我们只使用了 `kubectl` 命令行语法来创建命名空间，因为我们唯一需要配置的就是命名空间名称。尽管如此，我们也可以通过运行 `kubectl\
  \ apply -f deploy/elixir-drip-namespace-prod.yml` 实现相同的效果。如你所见，等效的 YAML 配置文件仅声明了一个名称为\
  \ `production` 的 Namespace 类型的资源：\n\n```\n$ cat deploy/elixir-drip-namespace-prod.yml\n\
  apiVersion: v1\nkind: Namespace\nmetadata:\n    name: production\n```\n\n在下一节中，我们将创建所有应用程序密钥。请注意，我们始终向\
  \ `kubectl` 传递 `-n production` 选项，因此在 `production` 命名空间中创建每个密钥。\n\n\n\n## 创建密钥\n\
  \n我们已经在 `secrets/elixirdrip-prod-sql.json` 中拥有 Cloud SQL 代理凭据，因此现在只需基于此文件创建一个密钥即可。在下面的片段中，我们正在创建一个名为\
  \ `cloudsql-proxy-credentials` 的密钥，其中包含一个名为 `credentials.json` 的基于文件的值，因此使用了 `--from-file`\
  \ 选项：\n\n```\n$ kubectl -n production create secret generic cloudsql-proxy-credentials\
  \ --from-file=credentials.json=secrets/elixirdrip-prod-sql.json\nsecret \"cloudsql-proxy-credentials\"\
  \ created\n```\n\n我们还需要将数据库用户凭据传递给应用程序容器。下面的 `cloudsql-postgres-credentials` 密钥有两个字面值，分别命名为\
  \ `username` 和 `password`：\n\n```\n$ kubectl -n production create secret generic\
  \ cloudsql-postgres-credentials --from-literal=username=postgres --from-literal=password=a-really-c0mplex-password\n\
  secret \"cloudsql-postgres-credentials\" created\n```\n\n我们将把用于连接运行应用程序的 Erlang\
  \ 节点的 Erlang cookie 值设置为 `erlang-cookie` 密钥，并将 Phoenix 用于加密和签名数据（如 cookies 和 token）的密钥设置为\
  \ `secret-key-base` 密钥：\n\n```\n$ kubectl -n production create secret generic erlang-cookie\
  \ --from-literal=cookie=a-really-long-big-and-difficult-to-memorize-string\nsecret\
  \ \"erlang-cookie\" created\n```\n\n```\n$ kubectl -n production create secret generic\
  \ secret-key-base --from-literal=value=complex-random-and-high-entropy-char-string\n\
  secret \"secret-key-base\" created\n```\n\n我们使用 Google Cloud Storage 服务来存储上传的文件，因此我们的应用程序需要一个与\
  \ `roles/storage.objectAdmin` 角色关联的服务账号。与为 SQL 代理服务账号所做的工作类似，为了配置 Cloud Storage\
  \ 服务账号，我们需要创建服务账号，将其分配给正确的角色，然后生成并下载密钥文件。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_481_0.png)\n\
  \n创建 Cloud Storage 服务账号与我们为 SQL 代理服务账号所做的工作类似，因此我们将其作为读者的练习留下来。\n\n不过，这次我们使用的 Elixir\
  \ 库期望凭据以 Base64 编码的字符串形式提供，因此在创建 `google-storage-credentials` 密钥之前，我们将把 `secrets/elixirdrip-prod-storage.json`\
  \ 文件转换为 Base64：\n\n```\n$ export STORAGE_CREDENTIALS=$(cat secrets/elixirdrip-prod-storage.json\
  \ | base64 -w 0)\n\n$ kubectl -n production create secret generic google-storage-credentials\
  \ --from-literal=base64-credentials=$STORAGE_CREDENTIALS\nsecret \"google-storage-credentials\"\
  \ created\n```\n\n所有密钥创建完成后，我们现在可以创建在 Kubernetes 中运行 ElixirDrip 应用程序所需的剩余 Kubernetes\
  \ 对象。\n\n## 发布生产镜像\n\n在部署第一个 Pod 之前，我们需要构建 Docker 生产镜像并将其推送到 Docker 镜像仓库。然后我们的 Pod\
  \ 定义将指向已推送的镜像。\n\n我们首先需要配置 `docker` 在向 `gcr.io`（Google 的私有 Docker 镜像仓库）推送镜像时使用 `gcloud`。要将\
  \ `gcloud` 添加为 Docker 凭据助手，只需运行 `gcloud auth configure-docker` 并按照说明操作即可。\n\n要构建镜像，我们将运行\
  \ `docker-compose.test.yml` compose 文件，最后我们将拥有准备发布的 `gcr.io/intense-talent-188323/elixir-drip-prod:manual_build`\
  \ 镜像：\n\n```\n$ PROJECT_ID=intense-talent-188323 BUILD_TAG=manual_build docker-compose\
  \ -f docker-compose.test.yml run app\nBuilding release\nStep 1/30 : FROM elixir:1.6.4-alpine\n\
  ---> 707fdc843c25\n# ...\nSuccessfully built ca929a3cf856\nSuccessfully tagged gcr.io/intense-talent-188323/elixir-drip-prod:manual_build\n\
  Release image ready to be deployed.\n\n$ docker images\nREPOSITORY TAG IMAGE ID\
  \ CREATED SIZE\ngcr.io/intense-talent-188323/elixir-drip-prod manual_build ca929a3cf856\
  \ 12 minutes ago 122MB\nrelease_prepared latest e3094176e0a7 12 minutes ago 493MB\n\
  # ...\n```\n\n要推送镜像，我们将使用标准的 Docker push 命令，由于镜像名称以 gcr.io 开头，它将使用 gcloud 作为凭据助手：\n\
  \n```\n$ docker push gcr.io/intense-talent-188323/elixir-drip-prod:manual_build\n\
  The push refers to repository [gcr.io/intense-talent-188323/elixir-drip-prod]\n\
  3e0c1e866df3: Pushed\n768e7e3dd3aa: Pushed\n8d66bb10e0bf: Pushed\n121882a60274:\
  \ Pushed\ncd7100a72410: Layer already exists\nmanual_build: digest:\nsha256:18d5b7b44c7ac87b347af3022069a959bef289320f28037f7b27b16dd07f90e9\n\
  size: 1373\n```\n\n现在我们可以在 Cloud Container 镜像仓库中看到该镜像，耐心等待发布：\n\n```\n$ gcloud container\
  \ images list\nNAME\ngcr.io/intense-talent-188323/elixir-drip-prod\n\n$ gcloud container\
  \ images list-tags gcr.io/intense-talent-188323/elixir-drip-prod\nDIGEST TAGS TIMESTAMP\n\
  18d5b7b44c7a manual_build 2018-06-13T17:02:14\n  # ...\n```\n\n完成所有配置和构建步骤后，我们终于可以部署第一个\
  \ Pod 了！\n\n## 部署第一个 Pod\n\n要部署第一个 Pod，我们将定义一个 Kubernetes Deployment 配置文件。该文件将声明部署策略（spec.strategy）、我们希望在任何给定时刻拥有的\
  \ Pod 数量（spec.replicas）、将提供给 Pod 的卷（spec.template.spec.volumes），以及用于启动 Pod 容器的配方（spec.template.spec.containers）：\n\
  \n```\n$ cat deploy/elixir-drip-deployment-prod.yml\napiVersion: extensions/v1beta1\n\
  kind: Deployment\nmetadata:\n  name: elixir-drip\n  namespace: production\n  labels:\n\
  ```\n\n```\napp: elixir-drip\n  env: production\nspec:\n  replicas: 3\n  strategy:\n\
  \    type: RollingUpdate\n    rollingUpdate:\n      maxUnavailable: 1\n      maxSurge:\
  \ 2\ntemplate:\n  metadata:\n    labels:\n      app: elixir-drip\n      env: production\n\
  \  spec:\n    volumes:\n      - name: cloudsql-proxy-creds-volume\n        secret:\n\
  \          secretName: cloudsql-proxy-credentials\n    containers:\n      # ...\n\
  ```\n\n除了定义两个标签（app 和 env）外，我们将部署命名为 elixir-drip 并将命名空间设置为 production。然后我们指定希望运行三个\
  \ Pod，并且在更新时，最多允许一个 Pod 不可用，并且同时最多运行五个 Pod（一个 Pod 已终止，三个新 Pod 运行）。\n\n在 spec.template\
  \ 部分，我们声明 Pod 配方：每个 Pod 将具有相同的 app 和 env 标签，并将具有基于先前创建的 cloudsql-proxy-credentials\
  \ 密钥的卷。在 spec.template.spec.containers 部分，我们定义 Pod 容器：\n\n```\n$ cat deploy/elixir-drip-deployment-prod.yml\n\
  apiVersion: extensions/v1beta1\nkind: Deployment\n  # ...\n  template:\n    # ...\n\
  \    spec:\n      # ...\n      containers:\n      - image: gcr.io/intense-talent-188323/elixir-drip-prod:manual_build\n\
  \        name: elixir-drip-prod\n        livenessProbe:\n          httpGet:\n```\n\
  \n```\npath: /health\nport: 4000\ninitialDelaySeconds: 60\ntimeoutSeconds: 15\n\
  readinessProbe:\n  httpGet:\n    path: /health\n    port: 4000\n  initialDelaySeconds:\
  \ 60\n  timeoutSeconds: 15\nports:\n  - name: http\n    containerPort: 4000\nenv:\n\
  \  # ...\n```\n\n第一个容器 elixir-drip-prod 将基于我们刚刚构建并推送到 Docker 镜像仓库的镜像。它定义了两个探针，一个存活探针和一个就绪探针，并暴露端口\
  \ 4000，然后定义启动应用程序所需的所有环境变量。顾名思义，就绪探针将由 Kubernetes 用于检测容器在部署后是否准备好接受请求，而存活探针则用于决定\
  \ Kubernetes 是否应重启容器。\n\n这里可以看到我们在容器内设置的一些环境变量。某些环境变量，例如 DB_HOST 和 DB_PORT，不包含敏感信息，因此我们以明文传递其值。其他变量，例如\
  \ GOOGLE_STORAGE_CREDENTIALS 和 DB_PASS，则从我们之前创建的密钥中获取其值。\n\n```\n$ cat deploy/elixir-drip-deployment-prod.yml\n\
  apiVersion: extensions/v1beta1\nkind: Deployment\n# ...\ntemplate:\n  # ...\n  spec:\n\
  \    # ...\n    containers:\n      - image: gcr.io/intense-talent-188323/elixir-drip-prod:manual_build\n\
  \        name: elixir-drip-prod\n        env:\n          # ...\n          - name:\
  \ DB_HOST\n            value: 127.0.0.1\n          - name: DB_PORT\n           \
  \ value: \"5432\"\n```\n\n```\n  - name: GOOGLE_STORAGE_CREDENTIALS\n    valueFrom:\n\
  \      secretKeyRef:\n        name: google-storage-credentials\n        key: base64-credentials\n\
  \  - name: DB_USER\n    valueFrom:\n      secretKeyRef:\n        name: cloudsql-postgres-credentials\n\
  \        key: username\n  - name: DB_PASS\n    valueFrom:\n      secretKeyRef:\n\
  \        name: cloudsql-postgres-credentials\n        key: password\n```\n\n还记得我们说过同一个\
  \ Pod 中的容器共享相同的 IP 和端口空间吗？这就是为什么我们告诉在 `elixir-drip-prod` 容器中运行的 ElixirDrip 应用连接到在\
  \ *本地* 端口 5432 上运行的数据库的原因，尽管这是运行在同一 Pod 中另一个容器里的 Cloud SQL 代理：\n\n```\n$ cat deploy/elixir-drip-deployment-prod.yml\n\
  apiVersion: extensions/v1beta1\nkind: Deployment\n  # ...\ntemplate:\n  # ...\n\
  spec:\n  volumes:\n    - name: cloudsql-proxy-creds-volume\n      secret:\n    \
  \    secretName: cloudsql-proxy-credentials\n  containers:\n    - image: gcr.io/cloudsql-docker/gce-proxy:1.11\n\
  \      name: cloudsql-proxy\n      command: [\"/cloud_sql_proxy\",\n           \
  \     \"--instances=intense-talent-188323:europe-west1:elixir-drip-production=tcp:5432\"\
  ,\n                \"--credential_file=/secrets/cloudsql/credentials.json\"]\n \
  \ ports:\n    - name: postgres\n      containerPort: 5432\n  volumeMounts:\n   \
  \ - name: cloudsql-proxy-creds-volume\n      mountPath: /secrets/cloudsql\n    \
  \  readOnly: true\n```\n\nCloud SQL 代理容器使用 Google 提供的 Docker 镜像，并通过传递 /secrets/cloudsql/credentials.json\
  \ 凭据文件来启动代理。该文件存在是因为我们在 /secrets/cloudsql 路径中将 cloudsql-proxy-creds-volume 挂载到容器内部，并且我们在创建\
  \ secret 时说过 cloudsql-proxy-credentials secret 只有一个 credentials.json 文件。\n\n在我们能够部署\
  \ Pod 之前，我们需要在生产数据库中运行项目的数据库迁移。如果不运行它们，ElixirDrip 应用在容器启动时会失败，因为它期望找到具有特定表和关系的数据库。\n\
  \n为了解决这个问题，我们将定义并稍后创建一个名为 elixir-drip-migrations 的 Kubernetes Job，负责运行迁移。\n\n##\
  \ 创建 Kubernetes Job\n\n我们的 elixir-drip-migrations Job 配置文件将与之前的 Deployment 配置非常相似，但我们不会运行容器的默认命令（即在\
  \ Dockerfile.deploy 上设置的 sh -c bin/$APP_NAME foreground），而是覆盖应用程序容器启动时运行的命令（即 sh\
  \ -c bin/$APP_NAME migrate_up）。我们还告诉 Kubernetes 永不重启这类 Job，并且无论如何都应在 300 秒后终止该 Job：\n\
  \n```\n$ cat deploy/elixir-drip-migrations-prod.yml\napiVersion: batch/v1\nkind:\
  \ Job\nmetadata:\n  generateName: elixir-drip-migrations\n  namespace: production\n\
  \  labels:\n    env: production\nspec:\n  activeDeadlineSeconds: 300\n  template:\n\
  \    metadata:\n      labels:\n        env: production\n    spec:\n      restartPolicy:\
  \ Never\n      volumes:\n        # ...\n      containers:\n      - image: gcr.io/intense-talent-188323/elixir-drip-prod:manual_build\n\
  \        name: elixir-drip-migrations\n        command: [\"sh\", \"-c\", \"bin/$APP_NAME\
  \ migrate_up\"]\n        env:\n          # ...\n```\n\n通常，当 Kubernetes 检测到相应的 Pod\
  \ 容器已结束时，Job 就会结束。运行完迁移后，elixir-drip-migrations 容器将返回一个退出代码（希望为 0），因此按预期终止。这里的问题在于\
  \ Cloud SQL 代理容器，它会无限期运行，即使在另一个容器结束之后也是如此。因此，我们依赖 activeDeadlineSeconds 来终止 Pod。\n\
  \n因为我们使用了 metadata.generateName 字段，Kubernetes 会为 elixir-drip-migrations Job 名称附加一个随机后缀。通过这种方式，我们可以确保永远不会有两个名称相同的\
  \ Job。\n\n其余的配置文件完全相同，因为我们运行的是完全相同的版本来运行数据库迁移（请回忆 migrate_up 任务是我们之前实现的自定义发布任务）。让我们运行迁移：\n\
  \n```\n$ kubectl -n production create -f deploy/elixir-drip-migrations-prod.yml\n\
  job.batch \"elixir-drip-migrationskv6tm\" created\n```\n\n```\n$ kubectl -n production\
  \ get jobs\n```\n\n| 名称 | 期望 | 成功 | 年龄 |\n|---|---|---|---|\n| elixir-drip-migrationskv6tm\
  \ | 1 | 0 | 4s |\n\n```\n$ kubectl -n production get pods\n```\n\n| 名称 | 就绪 | 状态\
  \ | 重启次数 | 年龄 |\n|---|---|---|---|---|\n| elixir-drip-646fb5cc94-7d2fs | 2/2 | 运行中\
  \ | 0 | 1d |\n| elixir-drip-646fb5cc94-dmt2c | 2/2 | 运行中 | 0 | 1d |\n| elixir-drip-646fb5cc94-pwgsq\
  \ | 2/2 | 运行中 | 0 | 1d |\n| elixir-drip-migrationskv6tm-lzx2n | 2/2 | 运行中 | 0 |\
  \ 7s |\n\n过了一会儿，我们看到其中一个 Pod 容器已完成：\n\n```\n$ kubectl -n production get pods\nNAME\
  \ READY STATUS RESTARTS AGE\n  # ...\nelixir-drip-migrationskv6tm-lzx2n 1/2 Completed\
  \ 0 56s\n```\n\n```\n$ kubectl -n production logs elixir-drip-migrationskv6tm-lzx2n\
  \ elixir-drip-migrations\nLoading ElixirDrip umbrella app...\nStarting dependencies...\n\
  Starting ElixirDrip repo...\nRunning migrations for ElixirDrip...\nSuccess!\n18:08:46.048\
  \ [info] Already up\n```\n\n我们现在终于能够将 Pod 部署到生产环境了：\n\n```\n$ kubectl -n production\
  \ apply -f deploy/elixir-drip-deployment-prod.yml\ndeployment.extensions \"elixir-drip\"\
  \ configured\n$ kubectl -n production get pods\n```\n\n| 名称 | 就绪 | 状态 | 重启次数 | 年龄\
  \ |\n|---|---|---|---|---|\n| elixir-drip-646fb5cc94-7d2fs | 2/2 | 终止中 | 0 | 1d\
  \ |\n| elixir-drip-646fb5cc94-dmt2c | 2/2 | 运行中 | 0 | 1d |\n| elixir-drip-646fb5cc94-pwgsq\
  \ | 2/2 | 运行中 | 0 | 1d |\n| elixir-drip-68b7944c95-c4nhd | 0/2 | 创建容器中 | 0 | 5s\
  \ |\n| elixir-drip-68b7944c95-ct6k7 | 0/2 | 创建容器中 | 0 | 5s |\n| elixir-drip-68b7944c95-kqqcv\
  \ | 0/2 | 创建容器中 | 0 | 5s |\n\n这里我们使用 kubectl 命令，因为如果对象已存在，它会更新具有相同名称的 Kubernetes\
  \ 对象，这正是我们想要的。过了一会儿，只有新的 Pod 在运行：\n\n```\n$ kubectl -n production get pods\n```\n\
  \n| 名称 | 就绪 | 状态 | 重启次数 | 年龄 |\n|---|---|---|---|---|\n| elixir-drip-68b7944c95-c4nhd\
  \ | 2/2 | 运行中 | 0 | 3m |\n| elixir-drip-68b7944c95-ct6k7 | 2/2 | 运行中 | 0 | 3m |\n\
  | elixir-drip-68b7944c95-kqqcv | 2/2 | 运行中 | 0 | 3m |\n\n要访问我们的应用程序，我们只需要借助 Kubernetes\
  \ Service 将其暴露给世界。\n\n## 将 Pod 暴露给世界\n\n在本节中，我们将创建一个 Kubernetes Service，负责暴露我们刚刚创建的\
  \ Pod。Service 根据 selector 部分的标签值将请求路由到特定的 Pod：\n\n```\n$ cat deploy/elixir-drip-loadbalancer-prod.yml\n\
  apiVersion: v1\nkind: Service\nmetadata:\n  name: elixir-drip-loadbalancer\n  namespace:\
  \ production\n  labels:\n    env: production\nspec:\n  type: LoadBalancer\n  selector:\n\
  \    app: elixir-drip\n    env: production\n  ports:\n    - port: 80\n      targetPort:\
  \ 4000\n```\n\n我们将通过负载均衡器的 80 端口到达的请求路由到带有 app=elixir-drip 和 env=production 标签的\
  \ Pod 的 4000 端口。创建像我们这样的 LoadBalancer Service 会使用云提供商的负载均衡器来暴露服务。这意味着一个 TCP 负载均衡器将在\
  \ Kubernetes 之外运行并拥有自己的 IP，并将请求路由到我们的 Pod。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_490_0.png)\n\
  \n使用 LoadBalancer Service 时，Kubernetes 会自动创建路由请求到 Pod 所需的对象，即 NodePort 和 ClusterIP。负载均衡器的工作方式取决于云提供商，但每个部署的服务始终拥有自己的负载均衡器，因此仅依赖负载均衡器可能成本高昂。更好的替代方案是使用\
  \ Kubernetes Ingress，它能够执行 SSL 终止、HTTP 路由等操作，并且可以在服务之间共享。在本书中，我们将只使用 LoadBalancer\
  \ Service。\n\n如果我们现在检查现有的服务，我们会看到以下内容（我们使用 --watch 选项，因此 kubectl 会在其中一个对象更新时更新其输出）：\n\
  \n```\n$ kubectl create -f deploy/elixir-drip-loadbalancer-prod.yml\nservice \"\
  elixir-drip-loadbalancer\" created\n\n$ kubectl -n production get service --watch\n\
  ```\n\n| 名称 | 类型 | 集群 IP | 外部 IP | 端口 | 年龄 |\n|---|---|---|---|---|---|\n| elixir-drip-loadbalancer\
  \ | 负载均衡器 | 10.43.254.164 | <待定> | 80:32153/TCP | 9s |\n| elixir-drip-loadbalancer\
  \ | 负载均衡器 | 10.43.254.164 | 35.205.152.228 | 80:32153/TCP | 1m |\n\n一开始，负载均衡器 IP\
  \ 为待定（可能是因为尚未配置），但在几分钟后，我们终于获得了外部 IP。我们现在可以从外部访问我们的应用程序，如下所示：\n\n```\n$ curl http://35.205.152.228\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n  \
  \  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n    <meta name=\"description\"\
  \ content=\"\">\n    <meta name=\"author\" content=\"\">\n```\n\n```\n<title>Welcome\
  \ to ElixirDrip!!!</title>\n<link rel=\"stylesheet\" href=\"/css/app-ddf53b1....css?vsn=d\"\
  >\n</head>\n# ...\n```\n\n我们从本节开始时应用程序在本地开发环境中运行，到结尾时它已上线并在托管的 Kubernetes 解决方案中运行，由三个冗余\
  \ Pod 提供服务。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_491_0.png)\n\n到目前为止，我们已经设置了\
  \ Kubernetes 生产环境并托管着我们的 ElixirDrip 应用。现在我们应该对 staging 环境做完全相同的事情，以便在实际发布前预览我们想要发布的功能。你可以通过创建新的\
  \ Kubernetes staging 命名空间来创建环境，然后继续操作，或者更进一步从一开始就创建一个新集群。再一次，新的集群意味着使用更多资源，所以请留意你的\
  \ Google Cloud 免费额度。\n\n然而，与其每次都与 Kubernetes 交互，我们希望在每次更改时都能重新部署应用程序，确保始终提供最新版本的实时请求。我们将借助\
  \ Travis CI 实现这一点。\n\n## 使用 Travis CI 进行持续部署\n\n与其每次都依赖之前的 kubectl 命令和 Kubernetes\
  \ 配置文件来更新我们的应用程序，我们希望自动化此过程。手动操作很繁琐、容易出错且不可确定。\n\n为了自动化此过程，我们将使用 Travis CI（https://travis-ci.org/），这是一项对开源项目免费的持续集成服务。要使用它，我们需要将源代码托管在\
  \ GitHub 仓库（https://github.com/）中，并让 Travis CI 访问我们的 GitHub 项目。每当代码仓库出现新的更改时，Travis\
  \ CI 就会检测到它并尝试构建项目，根据也属于项目源代码的配方文件（.travis.yml）进行操作。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_492_0.png)\n\
  \n将代码推送到 GitHub 后，在代码仓库中添加 Travis CI GitHub 应用。现在你需要使用 GitHub 凭据登录 Travis CI 并为仓库激活\
  \ Travis CI 自动构建。你可以在 https://docs.travis-ci.com/user/getting-started/ 找到更多信息。由于我们希望在提交到达特定分支时触发构建，请在\
  \ Travis CI 中激活 *构建推送分支* 选项。\n\n在我们的案例中，我们将要求 Travis CI 构建发布镜像（项目测试也在此阶段运行），运行 Kubernetes\
  \ 迁移任务，然后使用刚刚构建的发布镜像应用新的 Kubernetes 部署配置文件。\n\n我们现在将在项目根目录中创建一个 `.travis.yml` 文件，确定\
  \ Travis CI 将为我们执行的构建步骤：\n\n```\n$ cat .travis.yml\nsudo: required\n\nservices:\n\
  \  - docker\n\nenv:\n  global:\n    - PROJECT_ID=intense-talent-188323\n\nbefore_install:\n\
  \  # update Docker and install Docker Compose\n  # ...\n\nscript:\n  - BUILD_TAG=$TRAVIS_COMMIT\
  \ docker-compose -f docker-compose.test.yml run app\n\nbefore_deploy:\n  # install\
  \ gcloud and kubectl\n  # ...\n\ndeploy:\n  - provider: script\n    script: bash\
  \ deploy/travis_deploy.sh $TRAVIS_COMMIT production\n    skip_cleanup: true\n  \
  \  on:\n      branch: master\n\nafter_script:\n  - BUILD_TAG=$TRAVIS_COMMIT docker-compose\
  \ -f docker-compose.test.yml down\n```\n\n在之前的片段中，我们根据构建所处的阶段告诉 Travis 执行不同的操作。在\
  \ `before_install` 阶段，它会更新 Docker 并安装 Docker Compose。然后，在 `script` 阶段，它会启动 `docker-compose.test.yml`\
  \ compose 文件以构建镜像发布。如果上一步成功，它会在 `before_deploy` 阶段安装所需的 `gcloud` 和 `kubectl` 工具。在\
  \ `deploy` 阶段，Travis 将运行实际部署应用程序到 Kubernetes 的 `deploy/travis_deploy.sh` 脚本。最后的\
  \ `after_script` 步骤会停止并移除在之前的 `script` 阶段启动的容器。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_493_0.png)\n\
  \n由于我们使用了 `sudo: required` 选项，Travis 会为构建过程启动一台 Ubuntu 机器。`before_install` 和 `before_deploy`\
  \ 阶段为简洁起见被省略，但你可以在本书的代码中找到完整的 `.travis.yml` 文件。\n\n当 Travis 检测到 `master` Git 分支中的新提交时，它将启动一个临时虚拟机，从\
  \ GitHub 仓库获取特定代码版本，并开始之前描述的步骤。在 `.travis.yml` 文件中，我们设置了 `PROJECT_ID` 环境变量，但 Travis\
  \ 也会为我们设置 `TRAVIS_COMMIT` 变量（以及其他变量），我们将使用它来标记发布镜像。\n\n还记得 `docker-compose.test.yml`\
  \ compose 文件中 `app` 服务将生成的 Docker 镜像标记为 `gcr.io/${PROJECT_ID}/elixir-drip-prod:${BUILD_TAG}`\
  \ 吗？这就是为什么我们在启动 compose 文件之前需要设置 `PROJECT_ID` 和 `BUILD_TAG` 环境变量的原因（我们使用 Git 提交作为\
  \ `BUILD_TAG` 值）。\n\n在深入研究 `deploy/travis_deploy.sh` 脚本之前，我们需要创建一个 Google Cloud\
  \ 服务账号，Travis CI 将使用它来推送新的发布镜像并应用 Kubernetes 迁移任务和部署配置文件：\n\n```\n$ gcloud iam service-accounts\
  \ create travis-ci-k8s-deployment-prod --display-name \"Travis CI K8s Prod Account\"\
  \nCreated service account [travis-ci-k8s-deployment-prod].\n```\n\n```\n$ gcloud\
  \ projects add-iam-policy-binding intense-talent-188323 --member serviceAccount:travis-ci-k8s-deployment-prod@intense-talent-188323.iam.gserviceaccount.com\
  \ --role roles/container.developer\n```\n\n```\n$ gcloud projects add-iam-policy-binding\
  \ intense-talent-188323 --member serviceAccount:travis-ci-k8s-deployment-prod@intense-talent-188323.iam.gserviceaccount.com\
  \ --role roles/cloudbuild.builds.builder\n  # ...\n```\n\n```\n$ gcloud iam service-accounts\
  \ keys create secrets/travis-ci-k8s-prod.json --iam-account travis-ci-k8s-deployment-prod@intense-talent-188323.iam.gserviceaccount.com\n\
  created key [ca400...] of type [json] as [secrets/travis-ci-k8s-prod.json] for [travis-ci-k8s-deployment-prod@intense-talent-188323.iam.gserviceaccount.com]\n\
  ```\n\n我们为这个新的 `travis-ci-k8s-deployment-prod` 服务账号分配了 `container.developer` 和 `cloudbuild.builds.builder`\
  \ 角色并生成了密钥。我们现在将使用 `travis` Ruby gem 来加密服务账号密钥。我们首先需要登录，然后只需运行 `travis encrypt-file`\
  \ 即可：\n\n```\n$ travis login\nWe need your GitHub login to identify you.\nThis information\
  \ will not be sent to Travis CI, only to api.github.com.\nThe password will not\
  \ be displayed.\nTry running with --github-token or --auto if you don't want to\
  \ enter your password anyway.\nUsername: <username>\nPassword for <username>: ***********\n\
  Successfully logged in as <username>!\n```\n\n```\n$ travis encrypt-file secrets/travis-ci-k8s-prod.json\
  \ secrets/travis-ci-k8s-prod.json.enc --pro\nencrypting secrets/travis-ci-k8s-prod.json\
  \ for elixirdrip/ElixirDrip\nstoring result as secrets/travis-ci-k8s-prod.json.enc\n\
  storing secure env variables for decryption\n```\n\n请将以下内容添加到你的构建脚本中（例如 `.travis.yml`\
  \ 中的 `before_install` 阶段）：\n\n```\nopenssl aes-256-cbc -K $encrypted_69f31b87e2af_key\
  \ -iv $encrypted_69f31b87e2af_iv -in secrets/travis-ci-k8s-prod.json.enc -out secrets/travis-ci-k8s-prod.json\
  \ -d\n```\n\n专业提示：你可以通过使用 `--add` 运行来自动添加它。\n\n确保将 `secrets/travis-ci-k8s-prod.json.enc`\
  \ 添加到 git 仓库。确保不要将 `secrets/travis-ci-k8s-prod.json` 添加到 git 仓库。提交对 `.travis.yml`\
  \ 的所有更改。\n\n我们现在只需将建议的 openssl 命令作为 before_install 步骤添加到 .travis.yml 文件中：\n\n```\n\
  $ cat .travis.yml\n# ...\nbefore_install:\n  # ...\n  - openssl aes-256-cbc -K $encrypted_69f31b87e2af_key\
  \ -iv $encrypted_69f31b87e2af_iv -in secrets/travis-ci-k8s-prod.json.enc -out secrets/travis-ci-k8s-prod.json\
  \ -d\n```\n\n当 Travis 运行 before_install 阶段时，它将解密代码仓库中存在的 secrets/travis-ci-k8s-prod.json.enc\
  \ 并临时创建一个 secrets/travis-ci-k8s-prod.json 密钥用于部署。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_495_0.png)\n\
  \n我们需要在 deploy 阶段设置 skip_cleanup 选项，因为默认情况下 Travis 会清理之前阶段创建的所有产物，包括我们在 before_install\
  \ 阶段解密的服务账号密钥。\n\n现在让我们分析 deploy/travis_deploy.sh 脚本的作用。正如你在 deploy 阶段注意到的那样，此脚本使用两个参数调用，分别是提交\
  \ ID 和我们要部署到的环境。正如我们之前讨论的，我们使用 Kubernetes 命名空间来分隔 staging 和生产环境，因此每当我们使用 kubectl\
  \ 时，我们都会使用最后一个脚本参数作为命名空间值：\n\n```\n$ cat deploy/travis_deploy.sh\n#!/bin/bash\n\n\
  COMMIT=\"$1\"\nENVIRONMENT=\"$2\"\necho \"Deploying ${COMMIT} to ${ENVIRONMENT}\"\
  \n\ngcloud auth activate-service-account --key-file secrets/travis-ci-k8s-prod.json\n\
  \nZONE=europe-west1-b\nPROJECT_ID=intense-talent-188323\nCLUSTER=elixir-drip-prod-cluster\n\
  \ngcloud --quiet config set compute/zone ${ZONE}\ngcloud --quiet config set project\
  \ ${PROJECT_ID}\ngcloud --quiet config set container/cluster ${CLUSTER}\n```\n\n\
  ```\ngcloud --quiet container clusters get-credentials ${CLUSTER}\nyes | gcloud\
  \ auth configure-docker\ndocker push gcr.io/${PROJECT_ID}/elixir-drip-prod:${COMMIT}\n\
  cat deploy/elixir-drip-migrations-prod.yml | sed \"s/\\${BUILD_TAG}/\\${COMMIT}/g\"\
  \ > travis-migrations-prod.yml\nkubectl -n ${ENVIRONMENT} create -f travis-migrations-prod.yml\n\
  cat deploy/elixir-drip-deployment-prod.yml | sed \"s/\\${BUILD_TAG}/\\${COMMIT}/g\"\
  \ > travis-deployment-prod.yml\nkubectl -n ${ENVIRONMENT} apply -f travis-deployment-prod.yml\n\
  echo \"[SCRIPT] Success!\"\n```\n\n脚本首先配置 gcloud 使用我们迄今为止一直使用的服务账号密钥、项目和集群。然后它配置\
  \ docker 使用 gcloud 并将发布镜像推送到项目的 Docker 仓库。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_496_0.png)\n\
  \n要查找你的项目区域、项目 ID 和集群，请查看 `gcloud projects list` 和 `gcloud container clusters list`\
  \ 的输出。\n\n在运行迁移任务并执行部署之前，我们从 `elixir-drip-migrations-prod.yml` 和 `elixir-drip-deployment-prod.yml`\
  \ 模板生成 `travis-migrations-prod.yml` 和 `travis-deployment-prod.yml` 配置文件。因为 `kubectl`\
  \ 不会用相应的 VAR 环境变量替换任何 `${VAR}` 条目，所以我们将两个模板都通过 `sed` 处理，以将 `${BUILD_TAG}` 的任何实例替换为脚本开头设置的\
  \ COMMIT 变量的值。\n\n如果在上一节中我们在 Kubernetes job 和部署配置文件中都使用了 `manual_build` 标签，这次我们使用\
  \ `${BUILD_TAG}` 占位符来表示镜像标签将在之后设置：\n\n```\n$ cat deploy/elixir-drip-deployment-prod.yml\n\
  apiVersion: extensions/v1beta1\nkind: Deployment\n  # ...\n  template:\n    # ...\n\
  ```\n\n```\nspec:\n  # ...\n  containers:\n    - image: gcr.io/intense-talent-188323/elixir-drip-prod:${BUILD_TAG}\n\
  ```\n\n借助此 Travis CI 设置，每当我们向 master 分支推送一次提交时，Travis CI 就会为我们执行所有这些步骤。最终，我们将在云上运行\
  \ ElixirDrip 的更新版本。在下一节中，我们将连接已部署的 Elixir 节点，以便更好地使用我们之前实现的媒体缓存。\n\n## 连接已部署的 Elixir\
  \ 节点\n\n本节的目标是连接 Kubernetes 中运行的每个 ElixirDrip 节点。在当前设置下，每个 Elixir 节点都在自己的 Pod 中运行，甚至没有尝试连接其他\
  \ Pod。\n\n当我们介绍 Kubernetes 部署模板时，我们简要谈到了 readiness 和 liveness probe 使用的 /health\
  \ 端点。让我们使用此端点来获取对我们的 HTTP GET 请求做出响应的节点的信息。在这里你可以找到将处理对 /health 的请求的 Phoenix 控制器：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/controllers/health_controller.ex\n\
  defmodule ElixirDripWeb.HealthController do\n  @moduledoc false\n\n  use ElixirDripWeb,\
  \ :controller\n\n  def health(conn, _params) do\n    {_, timestamp} = Timex.format(DateTime.utc_now,\
  \ \"%FT%T%:z\", :strftime)\n\n    {:ok, hostname} = :inet.gethostname\n\n    json(conn,\
  \ %{\n      ok: timestamp,\n      hostname: to_string(hostname),\n      node: Node.self(),\n\
  \      connected_to: Node.list()\n    })\n  end\nend\n```\n\n除了时间戳之外，JSON 响应还会提供我们主机名、节点名称以及当前节点已连接的节点列表。控制器需要一个路由来处理请求，所以让我们实现我们的路由：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/router.ex\ndefmodule ElixirDripWeb.Router\
  \ do\n  use ElixirDripWeb, :router\n  # ...\n  get(\"/health\", ElixirDripWeb.HealthController,\
  \ :health)\n  # ...\nend\n```\n\n我们将 /health GET 请求路由到 HealthController 中的 :health\
  \ 操作。请注意，我们没有将任何管道（如 :api 或 :logger）关联到此路由条目，因为在响应请求之前我们不需要执行任何身份验证或日志记录逻辑。Kubernetes\
  \ 将不断使用此端点来评估运行应用程序的 Pod 容器的健康状况。\n\n在尝试新的端点之前，让我们检查当前运行我们应用程序的 Pod：\n\n```\n$ kubectl\
  \ -n production get pods\n```\n\n| 名称 | 就绪 | 状态 | 重启次数 | 年龄 |\n|------|-------|--------|----------|-----|\n\
  | elixir-drip-6c4d8d64dc-28vjc | 2/2 | Running | 0 | 7h |\n| elixir-drip-6c4d8d64dc-n5x29\
  \ | 2/2 | Running | 0 | 7h |\n| elixir-drip-6c4d8d64dc-rrvfg | 2/2 | Running | 0\
  \ | 7h |\n\n如果我们现在向负载均衡器的外部 IP 发送带有 /health 路径的 GET 请求，我们会得到以下内容：\n\n```\n$ curl\
  \ http://35.205.152.228/health\n{\"ok\":\"2018-06-16T16:09:16+00:00\",\"node\":\"\
  elixir_drip@10.40.2.70\",\"hostname\":\"elixir-drip-6c4d8d64dc-n5x29\",\"connected_to\"\
  :[]}\n\n$ curl http://35.205.152.228/health\n{\"ok\":\"2018-06-16T16:09:19+00:00\"\
  ,\"node\":\"elixir_drip@10.40.2.68\",\"hostname\":\"elixir-drip-6c4d8d64dc-28vjc\"\
  ,\"connected_to\":[]}\n```\n\n注意不同的请求最终会被不同的 Pod 处理。由于我们现在知道了两个 Pod 的 IP，让我们在 n5x29\
  \ Pod 内手动运行我们的应用程序并尝试连接到另一个 28vjc Pod：\n\n```\n$ kubectl -n production exec -it\
  \ elixir-drip-6c4d8d64dc-n5x29 -c elixir-drip-prod sh\n\n# sed -i.bak \"s/elixir_drip/console/g\"\
  \ releases/0.0.8/vm.args\n# PORT=5555 ./bin/elixir_drip console\nErlang/OTP 20 [erts-9.3.1]\
  \ [source] [64-bit] [smp:1:1] [ds:1:1:10] [async-threads:10] [hipe] [kernel-poll:false]\n\
  \n16:26:35.319 [info] Running ElixirDripWeb.Endpoint with Cowboy using\nhttp://:::5555\n\
  Interactive Elixir (1.6.4) - press Ctrl+C to exit (type h() ENTER for help)\niex(console@10.40.2.70)1>\
  \ # ...\n```\n\n我们通过使用 kubectl exec -it 在 n5x29 容器内打开一个 shell 来开始之前的代码片段（请注意与 docker\
  \ exec 语法的相似之处）。然后我们使用 console 选项在交互式 IEx shell 中运行 ElixirDrip 发布版。\n\n我们首先必须借助\
  \ sed 工具将 vm.args 中的名称从 elixir_drip 改为 console，因为容器内已经有一个 ElixirDrip 应用程序在运行。这也是我们必须让应用程序监听另一个端口而不是\
  \ 4000 的原因。\n\n如我们所见，这个控制台节点开始时未连接到任何节点，但我们可以轻松地将其连接到 28vjc Pod 中运行的节点：\n\n```\n\
  iex(console@10.40.2.70)> Node.list()\n[]\n\niex(console@10.40.2.70)> Node.connect(:\"\
  elixir_drip@10.40.2.68\")\ntrue\n\niex(console@10.40.2.70)> Node.list()\n[:\"elixir_drip@10.40.2.68\"\
  ]\n```\n\n为了在节点启动时自动连接节点，我们将使用 libcluster 库。有了这个库，每个节点都可以通过查询 Kubernetes API 获取\
  \ ElixirDrip Pod IP，然后连接到其他现有 Pod。该库还将定期查询 API 以检测 Pod 数量是否发生变化，确保节点始终连接到活动节点。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_500_0.png)\n\n我们能够连接到另一个节点是因为两个节点共享相同的\
  \ Erlang cookie。如果不是这样，我们可以通过使用 Node.set_cookie/2 函数在控制台中更新 cookie。\n\n除了在 mix.exs\
  \ 文件中添加 {:libcluster, \"~> 2.5\"} 条目之外，我们还需要对其进行配置。我们是这样做的：\n\n```\n$ cat apps/elixir_drip/config/prod.exs\n\
  use Mix.Config\n# ...\nconfig :libcluster,\n  topologies: [\n    elixir_drip_topology:\
  \ [\n      strategy: Cluster.Strategy.Kubernetes,\n      config: [\n        kubernetes_selector:\
  \ \"app=elixir-drip,env=production\",\n        kubernetes_node_basename: \"elixir_drip\"\
  ]]]\n```\n\n通过之前的配置，我们表示想要使用 Kubernetes 策略来查找要连接的其他节点，然后指定 libcluster 将搜索的端点标签。kubernetes_node_basename\
  \ 值定义了每个节点的基本名称。在我们的例子中，每个节点都命名为 elixir_drip@<pod-ip>（请记住我们使用 Distillery 设置的自定义\
  \ vm.args），因此 libcluster 将从 Kubernetes API 获取 Pod IP，例如 ip-a、ip-b 和 ip-c，然后连接到这三个\
  \ Erlang 节点中的两个，名称分别为 elixir_drip@ip-a、elixir_drip@ip-b 和 elixir_drip@ip-c。\n\n\
  因为我们使用的是 Kubernetes 负载均衡器，所以为每个 Pod 自动创建了一个端点。我们可以使用 kubectl describe 命令观察端点标签（同时请注意我们在第一种情况下是如何通过标签获取端点的；这与\
  \ libcluster 查询的做法类似）：\n\n```\n$ kubectl -n production get endpoints -l app=elixir-drip,env=production\n\
  ```\n\n| 名称 | 端点 | 年龄 |\n|------|-----------|-----|\n| elixir-drip-loadbalancer\
  \ | 10.40.2.68:4000,10.40.2.69:4000,10.40.2.70:4000 | 32d |\n\n```\n$ kubectl -n\
  \ production describe endpoints elixir-drip-loadbalancer\nName: elixir-drip-loadbalancer\n\
  Namespace: production\nLabels: app=elixir-drip\n        env=production\nAnnotations:\
  \ <none>\nSubsets:\n  Addresses: 10.40.2.68,10.40.2.69,10.40.2.70\n```\n\nNotReadyAddresses:\
  \ <none>\n端口:\n| 名称 | 端口 | 协议 |\n| --- | --- | --- |\n| <unset> | 4000 | TCP |\n\
  \n事件: <none>\n\n代码层面，我们不需要做任何其他更改。然而，在借助 `libcluster` 将节点连接起来后重新部署应用程序之前，我们需要做最后一次更改。默认情况下，`libcluster`\
  \ 将用于查询 Kubernetes API 的服务账号无权查询端点。因此，我们将创建一个自定义的 `list-endpoints` 角色，然后将此新角色绑定到默认的生产服务账号：\n\
  \n```\n$ cat deploy/elixir-drip-role-list-endpoints.yml\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: Role\nmetadata:\n  name: list-endpoints\n  namespace: production\nrules:\n\
  - apiGroups: [\"\"]\n  resources: [\"endpoints\"]\n  verbs: [\"get\", \"list\",\
  \ \"watch\"]\n```\n\n关联前一个角色与默认服务账号，我们需要创建以下 `RoleBinding` 对象：\n\n```\n$ cat deploy/elixir-drip-role-binding-default-service-account.yml\n\
  apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name:\
  \ default-service-account-lists-endpoints\n  namespace: production\nsubjects:\n\
  - kind: ServiceAccount\n  name: default\n  namespace: production\nroleRef:\n  kind:\
  \ Role\n  name: list-endpoints\n  apiGroup: rbac.authorization.k8s.io\n```\n\n默认情况下，只有管理员用户（不是我们一直使用的那个）才具有创建角色并绑定它们的权限。因此，我们需要从当前集群获取管理员凭据（运行\
  \ gcloud container clusters list 以获取集群名称）：\n\n```\n$ gcloud container clusters list\
  \ --format=\"table(name,zone)\"\nNAME LOCATION\nelixir-drip-prod-cluster europe-west1-b\n\
  \n$ gcloud container clusters describe elixir-drip-prod-cluster --zone europe-west1-b\
  \ | grep -A 1 password\npassword: <admin-password>\nusername: admin\n```\n\n现在我们拥有使用集群管理员凭据创建\
  \ list-endpoints 角色和相应角色绑定的所需的一切：\n\n```\n$ kubectl -n production --username=admin\
  \ --password=<admin-password> create -f deploy/elixir-drip-role-list-endpoints.yml\n\
  role.rbac.authorization.k8s.io \"list-endpoints\" created\n\n$ kubectl -n production\
  \ --username=admin --password=<admin-password> create -f deploy/elixir-drip-role-binding-default-service-account.yml\n\
  rolebinding.rbac.authorization.k8s.io \"default-service-account-lists-endpoints\"\
  \ created\n```\n\n重新部署应用程序后，libcluster 现在将能够查询具有所需 app 和 env 标签的现有端点。如果我们再次访问 /health\
  \ 端点，我们将得到以下内容：\n\n```\n$ curl http://35.205.152.228/health\n{\"ok\":\"2018-06-17T00:19:33+00:00\"\
  ,\"node\":\"elixir_drip@10.40.2.68\",\"hostname\":\"elixir-drip-6c4d8d64dc-28vjc\"\
  ,\"connected_to\":[\"elixir_drip@10.40.2.69\",\"elixir_drip@10.40.2.70\"]}\n\n$\
  \ curl http://35.205.152.228/health\n{\"ok\":\"2018-06-17T00:19:36+00:00\",\"node\"\
  :\"elixir_drip@10.40.2.69\",\"hostname\":\"elixir-drip-6c4d8d64dc-rrvfg\",\"connected_to\"\
  :[\"elixir_drip@10.40.2.68\",\"elixir_drip@10.40.2.70\"]}\n```\n\n太棒了，我们现在已连接所有节点！如果我们这么说的话，这相当令人印象深刻，因为这只是配置一个新库并允许服务账号查询\
  \ Kubernetes API 的问题。\n\n让我们现在看看如何对已连接的节点进行测试。\n\n## 测试已连接的节点\n\n还记得我们如何开始本节，通过登录到一个\
  \ Pod 并运行 ElixirDrip 控制台，以便手动连接到另一个 Pod 中的 Erlang 节点吗？这正是我们将要做的，但这次我们只需要分别在两个不同的\
  \ Pod 中运行 ElixirDrip 控制台，因为节点已经连接了。\n\n我正在 n5x29 和 28vjc Pod 中运行 ElixirDrip 控制台，这次当我在\
  \ 28vjc Pod（IP 以 .68 结尾）中启动控制台时，我们立即看到 libcluster 告诉我们它已成功连接到三个 Erlang 节点：\n\n```\n\
  # PORT=6666 ./bin/elixir_drip console\nErlang/OTP 20 [erts-9.3.1] [source] [64-bit]\
  \ [smp:1:1] [ds:1:1:10] [async-threads:10] [hipe] [kernel-poll:false]\n\n00:39:34.130\
  \ [info] [libcluster:elixir_drip_topology] connected to :\"elixir_drip@10.40.2.68\"\
  \n00:39:34.132 [info] [libcluster:elixir_drip_topology] connected to :\"elixir_drip@10.40.2.69\"\
  \n00:39:34.135 [info] [libcluster:elixir_drip_topology] connected to :\"elixir_drip@10.40.2.70\"\
  \n00:39:34.167 [info] Running ElixirDripWeb.Endpoint with Cowboy using http://:::6666\n\
  Interactive Elixir (1.6.4) - press Ctrl+C to exit (type h() ENTER for help)\niex(console@10.40.2.68)1>\
  \ Node.list()\n[:\"elixir_drip@10.40.2.68\", :\"elixir_drip@10.40.2.69\", :\"elixir_drip@10.40.2.70\"\
  , :\"console@10.40.2.70\"]\n```\n\n当我启动 ElixirDrip 控制台时，它仅在 libcluster 的帮助下连接到现有的\
  \ elixir_drip@<pod-ip> 节点。然而，由于 Erlang 连接默认是传递性的，两个控制台最终会相互连接，正如 Node.list/0 输出所示。\n\
  \n我们现在将在其中一个控制台（Pod n5x29，IP 以 .70 结尾）中上传一个文件：\n\n```\niex(console@10.40.2.70)>\
  \ user = Accounts.get_user_by_username(\"jose\")\n%ElixirDrip.Accounts.User{\n \
  \ id: \"167fsqnimMuu0pkSpBcuwiK3K7h\",\n  # ...\n}\n\niex(console@10.40.2.70)> Storage.store(user.id,\n\
  \"distributed_cache_test.txt\", \"$/distributed_test\",\n\"(•‿•)(•‿•)(•‿•)¯\\(ツ)/¯\
  \ (¬_¬)\")\n{:ok, :upload_enqueued, %ElixirDrip.Storage.Media{ ... }}\n```\n\n```\n\
  iex(console@10.40.2.70)10>\nCacheSupervisor.find_cache(\"168isa6wYsW6sz5CaX5be30YbLp\"\
  )\n#PID<0.2037.0>\n```\n\n一旦前一个文件被缓存，另一个控制台（Pod 28vjc）也能够立即从缓存中检索该文件：\n\n```\niex(console@10.40.2.68)>\
  \ user_id = \"167fsqnimMuu0pkSpBcuwiK3K7h\"\n\"167fsqnimMuu0pkSpBcuwiK3K7h\"\n```\n\
  \n```\niex(console@10.40.2.68)>\nCacheSupervisor.find_cache(\"168isa6wYsW6sz5CaX5be30YbLp\"\
  )\n#PID<37846.2037.0>\n```\n\n```\niex(console@10.40.2.68)> Storage.retrieve_content(user_id,\n\
  \"168isa6wYsW6sz5CaX5be30YbLp\")\n09:53:23.491 [info] Found cached content for 168isa6wYsW6sz5CaX5be30YbLp!\n\
  {:ok,\n%ElixirDrip.Storage.Media{ ... },\n\"(.•‿•.)(.•‿•.)(•‿•.)¯\\(ツ)/¯(¬_¬)\"\n\
  ```\n\n这只有在我们通过将它们命名为 {:global, {:cache, <media_id>}} 来全局注册 CacheWorker 进程时才有可能。当我们连接\
  \ Erlang 节点时，每个节点上运行的全局名称服务器能够协同工作并提供一个公共进程注册表。因此，运行在 28vjc Pod 中的控制台能够像与本地进程一样找到并与远程\
  \ CacheWorker 进程（#PID<37846.2037.0>）交互。而不是必须从云存储下载文件，它可以简单地从远程进程检索文件。\n\n采用这种方法，无论你向哪个\
  \ Pod 发送下载请求都不重要；如果媒体在某处被缓存，它将被从缓存中检索！\n\n## 总结\n\n我们以分布式且托管在云端并正在运行的 ElixirDrip\
  \ 版本结束了本章。从我们谦逊的开始，研究 Distillery 下发布的工作原理，到最后，应用程序在 Kubernetes 中运行并由 Travis CI 自动部署，我们应用了许多有趣的概念和工具。我们还对应用程序进行了容器化，并应用了一些主要\
  \ Kubernetes 构建块，例如 Pod、服务和密钥。\n\n你还应该注意，本章示例的安全性并不是主要关注点，因此不要认为这些详尽的示例已准备好应用于生产环境，而应将其视为几乎每个\
  \ Elixir 应用程序常见方面的可能起点：\n\n- 使用自定义发布任务配置 Distillery 发布\n- 对应用程序进行容器化，最终目标是构建精简的发布镜像并简化本地环境中的开发\n\
  - 通过使用 `kubectl` 并应用 Kubernetes 配置文件与 Kubernetes 集群交互\n- 使用 Travis CI 等持续集成工具来自动化部署流程\n\
  - 连接运行在不同 Kubernetes Pod 中的 Erlang 节点\n\n在云环境中的安全性、构建发布、容器化、Kubernetes 和持续部署都是复杂的话题，每个话题都值得一本书。本章是对这些概念的介绍，并展示了如何由一个人手持笔记本电脑，通过依赖当今存在的出色云工具，以稳健且可扩展的方式将应用程序提供给世界。\n\
  \n在下一章中，我们将学习如何收集应用程序指标并轻松检查、分析并追踪正在运行的进程，扩展我们对生产环境中应用程序发生情况的可见性。\n\n\n"
- "# 11 关注你的进程\n\n在我们的应用程序运行在云端时，我们应该在任何时刻都能持续了解正在发生的情况。为实现这一点，我们将配置两种不同的机制来获取有关正在运行的\
  \ ElixirDrip 实例的信息：\n\n- 一个 Prometheus 服务器持续收集有关正在运行应用程序的指标并通过 Grafana 仪表板公开它们\n\
  - 一种在连接到正在运行的 Erlang 节点时运行 Erlang observer 工具的方法，以便分析 Erlang VM 的整体状态和现有的正在运行的进程\n\
  - 两种深入了解生产系统发生情况的方式：对应用程序进行剖析和追踪函数\n\n让我们先了解 Prometheus 的工作原理以及它为何非常适合已建立的 ElixirDrip\
  \ 架构。\n\n## 收集指标\n\nPrometheus 是一个开源监控工具，采用拉取方式工作：而不是每个单独的应用程序将收集的指标发送到服务器，每个应用程序公开一个端点，Prometheus\
  \ 服务器会不断抓取可用的指标。它还能够动态发现要抓取的指标源，并且开箱即用地支持不同的源，例如 AWS EC2、Azure VM 和 Google Container\
  \ Engine 实例。\n\n在此基础上，Prometheus 提供强大的查询语言，还能够基于收集的数据发送警报。Prometheus 能够收集的指标类型如下：\n\
  \n- **计数器**：这允许你在发生某事时进行计数。按定义，计数器只能增加。\n- **仪表**：这让你可以跟踪随时间变化的数量，例如 CPU 时间或 BEAM\
  \ 中运行的 Elixir 进程数。每个数据点捕获特定时刻仪表指标的值。\n- **直方图**：这让你可以采样观测值，例如请求持续时间或响应大小，并将每个观测值计入预定义的桶中。对于每个直方图，Prometheus\
  \ 还会收集观测值的数量和观测值的总和（借助这些数据，你也可以计算观测值的平均值）。借助直方图收集的数据，你能够计算分布百分位。直方图对于了解任何应用程序发生的情况非常宝贵，因为它们可以告诉你，例如\
  \ 99% 的请求在 x 毫秒以内得到处理。\n- **摘要**：这与直方图类似，因为这种类型的指标也对观测值进行采样并具有关联的求和和计数指标，但百分位需要在事先配置并且在客户端计算。这降低了\
  \ Prometheus 服务器的负载，但不允许我们在之后计算不同的百分位。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_507_0.png)\n\
  \n也有可能直接从短生命周期的应用程序（如批处理作业）推送指标，但默认情况下 Prometheus 将从被监控的应用程序获取指标。\n\n无论指标类型如何，所有\
  \ Prometheus 时间序列数据都具有以下格式：\n\n```\n<metric_name>{<lbl1>=<lbl1_val>,<lbl2>=<lbl2_val>,...}\
  \ <value> <timestamp>\n```\n\n直方图观测值始终具有带有桶值的 le 标签；摘要观测值则使用 quantile 标签代替，而计数器指标的测量值始终递增。尽管它们各自具有不同的特性，Prometheus\
  \ 观测值共享一个通用格式。\n\n我们第一步是配置 ElixirDrip 应用程序以收集 Prometheus 指标并通过 /metrics 端点公开它们。然后，我们将在\
  \ ElixirDrip 旁边启动一个 Prometheus 服务器，该服务器将不时访问应用程序的 ElixirDrip /metrics 端点以收集所有可用指标。\n\
  \n## 公开 Prometheus 指标\n\n为了公开 Prometheus 指标，我们将使用一组 Elixir 库，这些库让我们可以发出新的指标并引入开箱即用的\
  \ Phoenix、Plug 和 Ecto 指标：\n\n```\n$ cat apps/elixir_drip/mix.exs\n  # ...\n  defp\
  \ deps do\n    [\n      # ...\n      {:prometheus, \"~> 4.0\", override: true},\n\
  \      {:prometheus_ex, \"~> 3.0\", override: true},\n      {:prometheus_ecto, \"\
  ~> 1.0\"},\n    ]\n  end\n  # ...\n```\n\n```\n$ cat apps/elixir_drip_web/mix.exs\n\
  \  # ...\n  defp deps do\n    [\n      # ...\n      {:prometheus_phoenix, \"~> 1.2\"\
  },\n      {:prometheus_plugs, \"~> 1.1\"},\n    ]\n  end\n  # ...\n```\n\n现在让我们从\
  \ Phoenix 指标开始。我们需要定义一个简单的 EndpointInstrumenter 模块，该模块将使用 PhoenixInstrumenter 模块：\n\
  \n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/prometheus/\nendpoint_instrumenter.ex\n\
  defmodule ElixirDripWeb.EndpointInstrumenter do\n  use Prometheus.PhoenixInstrumenter\n\
  end\n```\n\n我们需要在应用程序启动时调用此新模块的 setup/0 函数：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/application.ex\n\
  \  # ...\n  def start(_type, _args) do\n    # ...\n    ElixirDripWeb.EndpointInstrumenter.setup()\n\
  \    # ...\n  end\n```\n\n最后，我们应该将 EndpointInstrumenter 添加到端点配置中的 instrumenters\
  \ 列表中：\n\n```\n$ cat apps/elixir_drip_web/config/config.exs\n# ...\nconfig :elixir_drip_web,\
  \ ElixirDripWeb.Endpoint,\n# ...\ninstrumenters: [ElixirDripWeb.EndpointInstrumenter]\n\
  ```\n\n对于 Plug 和 Ecto 库来说过程非常相似：我们使用相应的 Prometheus 模块定义一个简单模块，在应用程序启动时对其进行配置，然后配置应用程序以使用它。对于\
  \ Plug 来说，该模块将在请求管道中作为普通 plug 被调用；对于 Ecto 来说，它将作为记录器进行配置。你可以查看应用程序代码以获取完整细节。\n\n\
  ![](img/c636f4cfb07f25f1db535995e50706ed_509_0.png)\n\n除了以与 EndpointInstrumenter\
  \ 完全相同的方式定义 PlugInstrumenter 外，我们还添加了一个 label_value/2 函数来定义自定义指标，基于传递给 def label_value(:request_path,\
  \ conn), do: conn.request_path 函数的 conn plug。这样，PlugInstrumenter 收集的所有指标都将包含一个自定义的\
  \ request_path 标签，其值为 conn.request_path。\n\n最后，我们需要公开收集到的指标。这可以通过定义一个 MetricsExporter\
  \ 模块以类似的方式完成：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/prometheus/metrics_exporter.ex\n\
  defmodule ElixirDripWeb.MetricsExporter do\n  use Prometheus.PlugExporter\nend\n\
  ```\n\n在应用程序启动时对其进行配置：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/application.ex\n\
  \  # ...\n  def start(_type, _args) do\n    # ...\n    ElixirDripWeb.MetricsExporter.setup()\n\
  \    # ...\n  end\n```\n\n然后，像其他任何 plug 一样将其添加到请求管道中，如下所示：\n\n```\n$ cat apps/elixir_drip_web/lib/elixir_drip_web/endpoint.ex\n\
  # ...\n    plug(ElixirDripWeb.MetricsExporter)\n    plug(ElixirDripWeb.Router)\n\
  \    end\n```\n\n我们现在可以访问 `/metrics` 端点。这段文字墙是 Prometheus 知道如何解析并转换为时间序列数据以便查询的：\n\
  \n```\n$ curl http://localhost:4000/metrics\n# TYPE http_requests_total counter\n\
  # HELP http_requests_total Total number of HTTP requests made.\nhttp_requests_total{status_class=\"\
  client-error\",method=\"GET\",host=\"...\",scheme=\"http\",request_path=\"/index.action\"\
  }\n1\nhttp_requests_total{status_class=\"success\",method=\"GET\",host=\"10.40.0.10\"\
  ,scheme=\"http\",request_path=\"/health\"} 3785\nhttp_requests_total{status_class=\"\
  success\",method=\"GET\",host=\"10.40.0.10\",scheme=\"http\",request_path=\"/metrics\"\
  } 633\nhttp_requests_total{status_class=\"success\",method=\"GET\",host=\"...\"\
  ,scheme=\"http\",request_path=\"/\"} 3\n# TYPE elixir_drip_cache_worker_hit_count\
  \ counter\n# HELP elixir_drip_cache_worker_hit_count Counter for each download served\
  \ by the CacheWorker instead of relying on the Cloud provider\nelixir_drip_cache_worker_hit_count\
  \ 1427\n# ...\n```\n\n借助当前的 Elixir `prometheus` 库，我们可以从多个角度了解应用程序的实际状态。但如果我们想测量函数花费的时间呢？或者如果你想在发生某事时发送自定义计数器呢？在这些场景中，`prometheus_ex`\
  \ 库允许我们发出任何自定义指标，只要它使用 Prometheus 支持的四种指标类型之一即可。\n\n让我们实现一个自定义指标来测量 `Storage.store/4`\
  \ 函数的执行时间。\n\n## 创建自定义 Prometheus 指标\n\n为了实现自定义指标，我们将遵循之前相同的步骤：我们首先配置自定义指标，然后创建一个新的\
  \ `Chronometer.defmeasured/2` 宏，该宏不仅定义新函数，还会基于函数名称和模块发出直方图指标。\n\n\n\n\n这次，不过，暴露\
  \ setup/0 函数的模块会更复杂一些，因为它需要注册指标，并且还要暴露 count/1、observe/2 和 observe_duration/2 函数：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/prometheus/instrumenter.ex\ndefmodule\
  \ ElixirDrip.Instrumenter do\n  use Prometheus\n\n  @histograms %{\"storage_store\"\
  \ => \"Time histogram for the Storage.store/4 function\"}\n\n  @counters %{\"cache_worker_hit\"\
  \ => \"Counter for each download served by the CacheWorker instead of relying on\
  \ the Cloud provider\"}\n\n  @default_buckets :prometheus_http.microseconds_duration_buckets()\n\
  \n  def setup do\n    @histograms\n    |> Enum.map(&__MODULE__.histogram_config(&1,\
  \ @default_buckets))\n    |> Enum.each(&Histogram.new(&1))\n\n    @counters\n  \
  \  |> Enum.map(&__MODULE__.counter_config(&1))\n    |> Enum.each(&Counter.new(&1))\n\
  \  end\n\n  def counter_config({name, help}), do: [name: counter_name(name), help:\
  \ help]\n  def histogram_config({name, help}, buckets), do: [name: histogram_name(name),\
  \ help: help, buckets: buckets]\n\n  def counter_name(name),\n    do: \"elixir_drip_\"\
  \ <> to_string(name) <> \"_count\" |> String.to_atom()\n  def histogram_name(name),\n\
  \    do: \"elixir_drip_\" <> to_string(name) <> \"_microseconds\" |>\n    String.to_atom()\n\
  \  # ...\nend\n```\n\n在之前的片段中，setup/0 函数会遍历 @histograms 和 @counters 模块属性，并分别调用 Histogram.new/1\
  \ 和 Counter.new/1 宏来配置我们想要设置的自定义直方图和计数器。\n\n为了生成指标名称，我们使用 elixir_drip_ 作为前缀，然后根据指标类型添加后缀。\n\
  \n需要注意的是，我们需要显式地将直方图指标的时间单位作为后缀添加（即 _microseconds），否则在发出指标之前库就不知道如何转换测量的时间（另一种选择是在指标规范中设置\
  \ duration_units 关键字，但将指标单位插值到其名称上是良好的实践）。\n\n要完成这个 Instrumenter 模块，我们只需要为新的计数器和直方图指标定义\
  \ count 和 observe 函数：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/prometheus/instrumenter.ex\n\
  defmodule ElixirDrip.Instrumenter do\n  # ...\n  @counters\n  |> Enum.map(&elem(&1,\
  \ 0))\n  |> Enum.map(&String.to_atom(&1))\n  |> Enum.map(fn counter ->\n    def\
  \ count(unquote(counter)), do: count(unquote(counter), 1)\n    def count(unquote(counter),\
  \ count), do: Counter.count([name: __MODULE__.counter_name(unquote(counter))], count)\n\
  \  end)\n\n  @histograms\n  |> Enum.map(&elem(&1, 0))\n  |> Enum.map(&String.to_atom(&1))\n\
  \  |> Enum.map(fn histogram ->\n    def observe(unquote(histogram), value), do:\
  \ Histogram.observe([name: __MODULE__.histogram_name(unquote(histogram))], value)\n\
  \n    def observe_duration(unquote(histogram), body), do:\n      Histogram.observe_duration([name:\
  \ __MODULE__.histogram_name(unquote(histogram))], body.())\n  end)\nend\n```\n\n\
  每当我们调用 Instrumenter.count(:cache_worker_hit, 2) 时，相应的 elixir_drip_cache_worker_hit_count\
  \ 指标将被发出。如果我们改为调用 Instrumenter.observe(:storage_store, 3_000_000)，则 elixir_drip_storage_store_microseconds_bucket\
  \ 指标以及 _count 和 _sum 直方图指标将被发出并在 /metrics 端点上可用。\n\n由于在之前的第 6 章 Metaprogramming—Code\
  \ That Writes Itself 中我们实现了一个 defchrono/2 宏来测量函数执行所需的时间，让我们在此基础上迭代，创建一个 defmeasured/2\
  \ 宏，它做同样的事情，但不是打印函数花费的时间，而是使用 Instrumenter.observe_duration/2 函数发出一个 Prometheus\
  \ 直方图指标：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/chronometer.ex\n# ...\n\
  defmacro defmeasured(function_definition, do: body) do\n  {function, args} = Macro.decompose_call(function_definition)\n\
  \  arity = length(args)\n\n  quote bind_quoted: [\n    function_definition: Macro.escape(function_definition),\n\
  \    body: Macro.escape(body),\n    function: function,\n    arity: arity\n  ] do\n\
  \    require Prometheus.Metric.Histogram, as: Histogram\n\n    def unquote(function_definition)\
  \ do\n      module_name = __MODULE__\n        |> Atom.to_string()\n        |> String.split(\"\
  .\")\n        |> Enum.at(-1)\n        |> String.downcase()\n\n      function_name\
  \ = Atom.to_string(unquote(function))\n\n      histogram = String.to_atom(\"#{module_name}_#{function_name}\"\
  )\n\n      Instrumenter.observe_duration(histogram, fn -> unquote(body)\n      end)\n\
  \    end\n  end\nend\n```\n\n这个 `defmeasured/2` 宏与我们之前做的事情非常相似，所以我们将只关注指标部分。我们首先获取模块和函数名称以获得\
  \ ElixirDrip 指标别名（例如，`:storage_store`）。该别名需要与 `Instrumenter` 模块的 `@histograms` 映射的键匹配，否则它将无法匹配任何\
  \ `observe_duration/2` 函数签名。然后，只需调用 `Instrumenter.observe_duration/2` 函数即可，该函数将依赖于\
  \ `Prometheus.Metric.Histogram` 模块中同名的函数。\n\n我们把更简单的计数器指标留到最后。每当 `CacheWorker` 提供其缓存的媒体时增加缓存命中计数器，只需在\
  \ `:get_media` 处理程序上调用 `Instrumenter.count/1` 函数即可：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/cache_worker.ex\n\
  # ...\ndef handle_call(:get_media, _from, %{hits: hits, content: content,\n    timer:\
  \ timer} = state) do\n        ElixirDrip.Instrumenter.count(:cache_worker_hit)\n\
  \        # ...\n    end\nend\n```\n\n现在我们只需要在应用程序启动时调用 Instrumenter.setup/0 即可：\n\
  \n```\n  $ cat apps/elixir_drip/lib/elixir_drip/application.ex\n    # ...\n    def\
  \ start(_type, _args) do\n      # ...\n      ElixirDrip.Instrumenter.setup()\n \
  \     # ...\n    end\n```\n\n现在 ElixirDrip 应用程序已配置为收集和公开 Prometheus 指标，我们将更新本地开发环境以运行一个\
  \ Prometheus 服务器。\n\n## 本地 Prometheus 服务器\n\n为了在本地测试 Prometheus，我们将使用 Docker Compose\
  \ 启动一个 Prometheus 容器，与我们已有的 Postgres 和 ElixirDrip 容器一起运行。Prometheus 容器还将暴露其端口，并访问\
  \ /metrics 端点以抓取应用程序指标。Prometheus 服务器通过配置文件了解其目标。让我们创建我们自己的配置：\n\n```\n  $ cat monitoring/prometheus.dev.yml\n\
  \  global:\n    scrape_interval: 15s\n\n  scrape_configs:\n    - job_name: 'prometheus'\n\
  \      static_configs:\n        - targets: ['localhost:9090']\n\n    - job_name:\
  \ 'elixir-drip'\n      static_configs:\n        - targets: ['app:4000']\n```\n\n\
  如你所见，这是一个指向可用 Prometheus 目标的 YAML 文件。我们的配置非常简单，但你可以用它配置每个方面。还记得我们说过 Prometheus 能够动态找到其他目标吗？\n\
  \n这被称为 *service discovery*，你可以在这里进行配置。\n\n在我们的例子中，我们有两个 *jobs*（`job` 标签将以 `job_name`\
  \ 的值为每个指标添加）：第一个告诉 Prometheus 从自身抓取指标，第二个告诉它从运行在端口 4000 上的 `app` 主机获取指标。由于我们将 ElixirDrip\
  \ 指标公开在 Prometheus 预期的默认 `/metrics` 端点上，我们不需要其他任何东西（要更改它，我们应该使用 `metrics_path` 配置字段）。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_515_0.png)\n\n请记住，运行在容器中的 Prometheus\
  \ 服务器能够通过使用 `app:4000` 地址访问 ElixirDrip 应用程序，因为在我们用于本地开发的 `docker-compose.dev.yml`\
  \ 文件中，运行应用程序的容器名为 `app`。\n\n如果你在不做任何更改的情况下运行 `prom/prometheus` Docker 镜像，你将能够在端口\
  \ 9090 上访问 Prometheus，但只有它自己的指标可用。我们必须将我们刚刚定义的配置文件复制到我们自己创建的自定义 Docker 镜像中：\n\n\
  ```\n$ cat monitoring/Dockerfile.prometheus\nFROM prom/prometheus\n\nCOPY monitoring/prometheus.dev.yml\
  \ /etc/prometheus/\n\nCMD [\"--config.file=/etc/prometheus/prometheus.dev.yml\"\
  ]\n```\n\n除了复制配置文件外，我们还在容器启动时覆盖运行命令。现在我们只需要更新 `docker-compose.dev.yml` 文件，以基于我们刚刚定义的\
  \ `Dockerfile` 启动一个 `prometheus` 容器：\n\n```\n$ cat docker-compose.dev.yml\nversion:\
  \ '2.3'\nservices:\n  prometheus:\n    build:\n      context: .\n      dockerfile:\
  \ monitoring/Dockerfile.prometheus\n    depends_on:\n      app:\n        condition:\
  \ service_started\n    ports:\n      - 9090:9090\n  app:\n    image: elixir_drip:dev\n\
  \    build:\n  # ...\n```\n\n\n\n现在，如果你像往常一样使用 `docker-compose -f docker-compose.dev.yml\
  \ up` 启动应用程序，你可以访问 http://localhost:9090/graph 并查看一些指标：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_516_0.png)\n\
  \n在本地环境运行后，让我们配置云端也托管一个 Prometheus 服务器（以及一些其他实用功能）。\n\n## 在 Kubernetes 中部署 Prometheus\n\
  \n如我们在上一章对应用程序所做的那样，我们可以基于 Prometheus Docker 镜像配置一个 Pod，然后就完事了。它能工作，但每当 Prometheus\
  \ Pod 轮换时，我们都会丢失所有指标，因为 Pod 本质上是短暂的。为了建立一个合适的监控解决方案，我们应该将 Prometheus 部署为它本身就是有状态的应用程序，并利用\
  \ Kubernetes 提供的抽象，如 StatefulSets 和 PersistentVolumes 等。\n\n然而，这并不那么简单，所以我们将改用 Helm\
  \ 来安装一个图表，该图表将为我们正确部署和配置 Prometheus 及其伙伴在 Kubernetes 集群中。你可以把 Helm 想象成 Kubernetes\
  \ 的包管理器（如 apt、chocolatey 或 homebrew）。图表不过是一组 Kubernetes 模板（一种 Kubernetes 配方）的捆绑包，Helm\
  \ 让我们可以在集群中安装它。要使用 Helm，我们还需要其服务器端对应物：Tiller。\n\nTiller 将在集群上运行，并根据你在机器上运行的 Helm\
  \ 提供的说明安装图表。让我们先创建一个将由 Tiller 使用的 tiller-sa ServiceAccount：\n\n```\n$ kubectl -n\
  \ kube-system create serviceaccount tiller-sa\nserviceaccount \"tiller-sa\" created\n\
  ```\n\n以下是将之前的服务账户关联到 cluster-admin 角色的角色绑定，以便 Tiller 拥有其可能需要的所有权限：\n\n```\n$ cat\
  \ monitoring/tiller-sa-role-binding.yml\napiVersion: rbac.authorization.k8s.io/v1beta1\n\
  kind: ClusterRoleBinding\nmetadata:\n  name: tiller-role-binding\nroleRef:\n  apiGroup:\
  \ rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: cluster-admin\nsubjects:\n\
  \  - kind: ServiceAccount\n    name: tiller-sa\n    namespace: kube-system\n```\n\
  \n现在，我们只需要应用之前的 ClusterRoleBinding 资源：\n\n```\n$ kubectl create -f monitoring/tiller-sa-role-binding.yml\n\
  clusterrolebinding.rbac.authorization.k8s.io \"tiller-role-binding\" created\n```\n\
  \n创建 tiller-sa 服务账户后，我们可以继续安装 Helm 及其兄弟 Tiller。按照 https://docs.helm.sh/using_helm/#installing-helm\
  \ 处的说明进行操作，你应该在路径中的某个位置得到 helm 二进制文件。由于我们已将 kubectl 上下文配置为访问我们的 GKE 集群，helm 将利用此上下文与集群交互并一次性安装其服务器端组件：\n\
  \n```\n$ helm init --service-account tiller-sa\nCreating /home/andre/.helm\nCreating\
  \ /home/andre/.helm/repository\nCreating /home/andre/.helm/repository/cache\nCreating\
  \ /home/andre/.helm/repository/local\nCreating /home/andre/.helm/plugins\nCreating\
  \ /home/andre/.helm/starters\nCreating /home/andre/.helm/cache/archive\nCreating\
  \ /home/andre/.helm/repository/repositories.yaml\nAdding stable repo with URL:\n\
  https://kubernetes-charts.storage.googleapis.com\nAdding local repo with URL: http://127.0.0.1:8879/charts\n\
  $HELM_HOME has been configured at /home/andre/.helm.\n\nTiller (the Helm server-side\
  \ component) has been installed into your Kubernetes Cluster.\n```\n\n之后，我们可以看到\
  \ kube-system 命名空间中正在运行的 tiller-deploy Pod：\n\n```\n$ kubectl get pods --all-namespaces\n\
  NAMESPACE NAME READY STATUS RESTARTS AGE\n# ...\nkube-system tiller-deploy-75d774db4f-fbxch\
  \ 1/1 Running 5 3d\n```\n\n我们将安装两个 Helm 图表：prometheus-operator 和 kube-prometheus。这两个图表由\
  \ CoreOS 提供，正在积极开发中。kube-prometheus 图表使用 prometheus-operator 引入的 Kubernetes 资源，并简化了在\
  \ Kubernetes 集群中管理 Prometheus 和 Grafana（以及其他工具）的过程（例如，持久存储的配置、应用程序升级的安全协调、灾难恢复等）。\n\
  \n除了 Prometheus，我们还将使用 Grafana。Grafana 是一个开源数据可视化工具，能够消费 Prometheus 指标（以及其他数据源）并用它们创建图表和仪表板。\n\
  \n我们首先需要安装 CoreOS 仓库，以便 helm 随后可以找到我们需要的图表：\n\n```\n$ helm repo add coreos\nhttps://s3-eu-west-1.amazonaws.com/coreos-charts/stable/\n\
  \"coreos\" has been added to your repositories\n```\n\n现在，只需在特定的 monitoring 命名空间上安装这两个图表即可。我们使用不同的命名空间来保持整洁，但\
  \ Prometheus 服务器仍然能够监控在生产命名空间中运行的 ElixirDrip Pod：\n\n```\n$ helm install coreos/prometheus-operator\
  \ --name prometheus-operator --namespace monitoring\nNAME: prometheus-operator\n\
  LAST DEPLOYED: Wed Jun 27 19:51:49 2018\nNAMESPACE: monitoring\nSTATUS: DEPLOYED\n\
  \  # ...\n```\n\n```\n$ helm install coreos/kube-prometheus --name kube-prometheus\
  \ --namespace monitoring\nNAME: kube-prometheus\nLAST DEPLOYED: Wed Jun 27 20:04:00\
  \ 2018\nNAMESPACE: monitoring\nSTATUS: DEPLOYED\n  # ...\n```\n\n```\n$ kubectl\
  \ -n monitoring get pods\nNAME READY STATUS RESTARTS AGE\nalertmanager-kube-prometheus-0\
  \ 2/2 Running 4 2h\nkube-prometheus-exporter-kube-state-5ffd856844-m6wbj 2/2 Running\
  \ 0 1h\nkube-prometheus-exporter-node-4ddt6 1/1 Running 2 2h\nkube-prometheus-exporter-node-ppj2g\
  \ 1/1 Running 0 1h\nkube-prometheus-grafana-6c9496d766-q7278 2/2 Running 4 2h\n\
  prometheus-kube-prometheus-0 3/3 Running 1 2h\nprometheus-operator-f454cb555-htqxx\
  \ 1/1 Running 2 2h\n```\n\n过了一会儿，你将能够看到这两个图表在 monitoring 命名空间中创建的所有 Pod 正在运行。\n\n\
  ![](img/c636f4cfb07f25f1db535995e50706ed_519_0.png)\n\n当我在只有一个 n1-standard-1 节点（1\
  \ vCPU 和 3.75 GB RAM）的 GKE 集群上尝试部署这两个 Helm 图表时，一些 Pod 无法启动，并且在 Google Cloud 控制台中出现了不可调度\
  \ Pod 的通知。在激活集群自动扩缩器并将其最大大小设置为 2 后，Kubernetes 自动将集群扩容以腾出空间给新 Pod。\n\n如果我们转发 `prometheus-kube-prometheus-0`\
  \ Pod 的 9090 端口，我们将能够访问刚刚部署的 Prometheus 服务器：\n\n```\n$ kubectl -n monitoring port-forward\
  \ prometheus-kube-prometheus-0 49090:9090\nForwarding from 127.0.0.1:49090 -> 9090\n\
  Forwarding from [::1]:49090 -> 9090\n# ...\n```\n\n如果你现在访问 http://localhost:9090/graph，你将看到与之前本地访问相同的\
  \ Prometheus 页面。然而，我们仍然没有任何 ElixirDrip 指标，因为我们尚未配置 Prometheus 从应用程序的 `/metrics`\
  \ 端点抓取指标。\n\n为了从我们的应用程序抓取指标，我们不需要直接更新 Prometheus 配置文件，因为 `prometheus-operator` 引入了一个名为\
  \ `ServiceMonitor` 的自定义 Kubernetes 资源，其唯一目的是配置 Prometheus 如何找到可用目标。\n\n在配置我们自己的\
  \ `ServiceMonitor` 之前，让我们先看看 operator 为我们创建的 `ServiceMonitors`：\n\n```\n$ kubectl\
  \ -n monitoring get servicemonitors\nNAME AGE\nkube-prometheus 3h\nkube-prometheus-alertmanager\
  \ 3h\nkube-prometheus-exporter-kube-controller-manager 3h\nkube-prometheus-exporter-kube-dns\
  \ 3h\nkube-prometheus-exporter-kube-etcd 3h\nkube-prometheus-exporter-kube-scheduler\
  \ 3h\nkube-prometheus-exporter-kube-state 3h\nkube-prometheus-exporter-kubelets\
  \ 3h\nkube-prometheus-exporter-kubernetes 3h\nkube-prometheus-exporter-node 3h\n\
  kube-prometheus-grafana 3h\nprometheus-operator 3h\n```\n\n正是 `kube-prometheus-exporter-kubelets`\
  \ 服务监控器告诉 Prometheus 如何从 Kubernetes 抓取指标。默认情况下，Prometheus 以安全的方式获取 Kubernetes 指标。然而，由于\
  \ Google Kubernetes Engine 的工作方式，我们需要更改此目标的服务监控器：\n\n```\n$ kubectl -n monitoring\
  \ get servicemonitor kube-prometheus-exporter-kubelets -o yaml | sed 's/https/http/'\
  \ | kubectl replace -f -\nservicemonitor.monitoring.coreos.com \"kube-prometheus-exporter-kubelets\"\
  \ replaced\n```\n\n在之前的片段中，我们获取 `kube-prometheus-exporter-kubelets` ServiceMonitor\
  \ 的 YAML 定义，将其 `https` 出现的地方替换为 `http`，然后用新的仅 HTTP 版本替换其资源。通过此更改，Prometheus 能够抓取\
  \ operator 开箱即用的所有目标配置。\n\n我们刚刚更新的 `ServiceMonitor` 资源是由 `prometheus-operator` 引入的自定义资源。它使我们能够通过依赖类似\
  \ Kubernetes 的概念（如标签选择器）来配置 Prometheus 目标，而无需实际更新任何 Prometheus 配置。以下是我们将创建的 `ServiceMonitor`\
  \ 定义，以将 ElixirDrip 设置为 Prometheus 目标：\n\n```\n$ cat monitoring/elixir-drip-service-monitor-prod.yml\n\
  apiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\nmetadata:\n  labels:\n\
  \    app: prometheus\n  name: elixir-drip-monitor\n  namespace: monitoring\nspec:\n\
  \  jobLabel: elixir-drip\n  endpoints:\n  - interval: 30s\n    port: web\n  namespaceSelector:\n\
  \    matchNames:\n    - production\n  selector:\n    matchLabels:\n      app: elixir-drip\n\
  ```\n\n\n\n我们正在自定义 ServiceMonitor 中设置 `app=prometheus` 标签，因为 `kube-prometheus` 资源（类型为\
  \ `Prometheus`，也是 Prometheus operator 引入的自定义资源）默认会搜索具有特定 `app` 标签值的 ServiceMonitor（`alertmanager`、`grafana`、`prometheus`\
  \ 等）：\n\n```\n$ kubectl -n monitoring get prometheus kube-prometheus -o yaml\napiVersion:\
  \ monitoring.coreos.com/v1\nkind: Prometheus\nmetadata:\n  # ...\n  name: kube-prometheus\n\
  \  namespace: monitoring\n  # ...\nserviceMonitorSelector:\n  matchExpressions:\n\
  \  - key: app\n    operator: In\n    values:\n    - alertmanager\n    - exporter-coredns\n\
  \    - exporter-kube-controller-manager\n    - exporter-kube-dns\n    - exporter-kube-etcd\n\
  \    - exporter-kube-scheduler\n    - exporter-kube-state\n    - exporter-kubelets\n\
  \    - exporter-kubernetes\n    - exporter-node\n    - grafana\n    - prometheus\n\
  \    - prometheus-operator\n```\n\n我们刚刚定义的 `elixir-drip-monitor` 将在 `production`\
  \ 命名空间中搜索带有 `app=elixir-drip` 标签的端点，然后配置 Prometheus 通过这些端点的 `web` 端口抓取指标。我们没有指定自定义指标路径，因为默认情况下\
  \ ServiceMonitor 通过 `/metrics` 路径获取指标：\n\n```\n$ kubectl create -f monitoring/elixir-drip-service-monitor-prod.yml\n\
  servicemonitor.monitoring.coreos.com \"elixir-drip-monitor\" created\n\n$ kubectl\
  \ -n monitoring get servicemonitors\nNAME AGE\nelixir-drip-monitor 16s\n# ...\n\
  ```\n\n创建 `elixir-drip-monitor` 后，我们能够在 http://localhost:49090/targets URL 暴露的其他\
  \ Prometheus 目标中看到 `elixir-drip-loadbalancer` 条目：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_523_0.png)\n\
  \n这意味着我们现在可以用 Prometheus 查询 ElixirDrip 指标。尽管 Prometheus 能够绘制我们的指标图表，但我们将使用 Grafana，这是一款开源数据可视化工具，能够使用\
  \ Prometheus 作为数据源。幸运的是，我们之前部署的 `prometheus-operator` 也部署了一个 `grafana` Pod，因此只需将\
  \ `kube-prometheus-grafana-6c9496d766-q7278` Pod 的 3000 端口暴露出来即可：\n\n```\n$ kubectl\
  \ -n monitoring get pods -l app=kube-prometheus-grafana\nNAME READY STATUS RESTARTS\
  \ AGE\nkube-prometheus-grafana-6c9496d766-q7278 2/2 Running 4 5d\n\n$ kubectl -n\
  \ monitoring port-forward kube-prometheus-grafana-6c9496d766-q7278 43000:3000\n\
  Forwarding from 127.0.0.1:43000 -> 3000\nForwarding from [::1]:43000 -> 3000\n```\n\
  \n如果你现在访问 `http://localhost:43000`，将会看到 Grafana 主页。如果你点击 **Home** 然后打开 **General**\
  \ 文件夹，就能找到一些 Kubernetes 仪表盘。这就是 **Kubernetes Capacity Planning** 仪表盘的外观：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_524_0.png)\n\
  \n在左下角使用 `admin/admin` 登录，以便我们可以创建我们的第一个仪表盘。通过点击加号并选择 **Create dashboard**，我们可以创建\
  \ ElixirDrip 仪表盘。在添加任何面板之前，先为其命名，然后按 `Ctrl + S` 保存。\n\n我们现在将添加一个面板，显示 Kubernetes\
  \ 用于评估我们的 ElixirDrip Pod 是否按预期工作 的 `/health` 端点的响应时间直方图。在 **New panel** 部分中，选择 `Graph`，一个带有虚拟数据（实际上是随机游走）的新图表将会出现：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_525_0.png)\n\n通过点击面板标题，我们可以编辑它。在这里我们可以更改面板标题（参见\
  \ **General** 选项卡），也是在这里我们将配置与图表相关的所有内容。让我们从 `Metrics` 选项卡开始并选择相关指标。\n\n因为我们使用了\
  \ `prometheus-operator`，Grafana 已经将 Prometheus 配置为数据源，只需选择它即可。如果你开始输入指标名称，Grafana\
  \ 会根据可用的 Prometheus 数据建议指标。输入 `http_request_duration_microseconds_bucket{request_path=\"\
  /health\"}` 作为第一个指标，图表将显示具有自定义标签 `request_path=\"/health\"` 的每个观测值的 `http_request_duration_microseconds_bucket`\
  \ 指标。\n\n默认情况下，每个图例键都会显示完整的标签集，包括 `pod` 和 `le` 标签（后者给出指标桶，是 *lower than or equal\
  \ to* 的简写）。为了简化，你可以在 `Legend format` 字段中写入 `{{pod}}` `{{le}}` 表达式，使每个图例仅包含 `pod`\
  \ 和 `le` 标签。然而，我们仍然会看到 60 个数据系列，因为我们目前有 20 个桶和三个 ElixirDrip Pod（几乎一半的数据系列甚至没有出现在下面的截图中）：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_526_0.png)\n\n如果我们不关心特定 Pod 的响应时间，可以使用\
  \ `avg` 聚合操作符对每个桶的值进行平均：\n\n```\navg(http_request_duration_microseconds_bucket{request_path=\"\
  /health\"}) by (le)\n```\n\n采用这种方法，我们不想知道数据点是由哪个 Pod 发出的，因此应从图例格式中删除 `{{pod}}` 部分。由于\
  \ HTTP 响应时间以微秒为单位测量，让我们在图例中添加 µs 单位（`{{le}}` µs）。\n\n让我们还更改 `Left Y axis`，将其标签设置为\
  \ `No. of requests`，单位设置为 `none`，以便可以看到完整的图例值。\n\n为了提高图表的可读性，在 Display 选项卡中将图表的绘制模式更改为点：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_527_0.png)\n\n通过查看图表中某个特定时间点，我们可以得出大多数观测值属于\
  \ +Inf、10 秒（10000000）、5 秒（5000000）、2.5 秒（2500000）、1 秒（1000000）和 0.5 秒（500000）桶。因此，让我们只考虑这些桶，使用以下指标表达式选择它们：\n\
  \n```\navg(http_request_duration_microseconds_bucket{\nrequest_path=\"/health\"\
  ,\nle=~\".+Inf|10000000|5000000|2500000|1000000|500000\"}) by (le)\n```\n\n我们现在有一个更整洁的图表，显示了\
  \ /health 平均响应时间在我们六个桶之间的分布：\n\n尽管如此，这个图表仍然无法一目了然地告诉我们应用程序发生了什么。让我们尝试使用百分位数来全面了解情况。\n\
  \n## 计算百分位数\n\n而不是查看按桶划分的观测频率，让我们使用 `histogram_quantile()` 查询函数来计算一些百分位数。这样，我们就能更好地了解\
  \ `/health` 响应时间的分布。我们将从计算第 50 百分位数开始，用以下表达式替换之前的指标：\n\n```\nhistogram_quantile(0.5,\n\
  \    rate(\n        http_request_duration_microseconds_bucket{request_path=\"/health\"\
  ,\n        pod=~\"elixir-drip.*\"}[5m]\n    ))\n```\n\n我们使用 `rate(...) [5m]` 函数来获取每个直方图桶中样本的\
  \ 5 分钟平均速率。因为直方图分位数是针对指标拥有的每个标签组合计算的，所以我们可以看到每个 Pod 的三个不同图表。我们还需要将 `Legend format`\
  \ 更改为 `50th percentile {{pod}}`，并将 `Left Y axis` 的单位更改为 `microseconds (µs)`。\n\n\
  我们现在可以观察到，在此时间段内，50% 的 `/health` 请求耗时少于 8 秒，且 8lts4 Pod 是最快的 Pod：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_528_0.png)\n\
  \n随着我们绘制的每个百分位数都有三个图表，很快就会变得混乱，因此让我们将此百分位数聚合为仅有一个数据系列：\n\n```\nhistogram_quantile(0.5,\n\
  \    sum without(instance, pod, host) (\n        rate(http_request_duration_microseconds_bucket{request_path=\"\
  /health\",\n        pod=~\"elixir-drip.*\"}[5m])\n    )\n```\n\n我们使用 sum without(...)\
  \ 来删除 Pod 之间不同的标签，以便 Pod 聚合按预期工作。然而，采用这种方法我们最终会丢失每个单独 Pod 的信息。我们希望能够轻松选择 Pod 标签表达式的值。幸运的是，Grafana\
  \ 允许我们定义变量，然后可以在图表中使用这些变量。\n\n## 设置 Grafana 变量\n\n如果你转到设置（右上角）并选择 Variables，我们可以添加一个新的\
  \ Pod 变量：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_529_0.png)\n\n除了变量名称外，我们将其类型设置为\
  \ query，以从 Prometheus http_request_duration_microseconds_bucket 查询中获取其值。然后我们设置 /.*pod=\"\
  ([^\"]*).*/ 作为正则表达式，从每个观测值中提取 Pod 标签值。\n\n\n\n回顾一下，每个 Prometheus 观测值的格式为\n`<metric_name>{<lbl1>=<lbl1_val>,<lbl2>=<lbl2_val>,...}`\n\
  `<value> <timestamp>`。\n\n`pod` 变量可以取 `pod` 标签的不同值，但由于我们还选择了 **Include All option**，我们可以说\
  \ **All** 值会插入一个自定义值；在我们的例子中，**All** 值将是 `.*`。这将使我们能够查看通过变量查询获得名称的其中一个 pod 的百分位，或者所有\
  \ pod 的聚合百分位。\n\n如果我们现在在之前的 50th 百分位指标表达式中将 `pod` 标签值设置为 `$pod`，我们就可以通过更改仪表板中的 `Pod`\
  \ 下拉菜单来控制其图表。你也可以在任何图例中使用变量，只需将指标图例更新为 `50th percentile {{$pod}}` 即可：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_530_0.png)\n\
  \n我们现在需要以相同的方式定义其他百分位，因此让我们为 90th、95th、99th 和 max 百分位定义以下指标，其中 `<percentile>` 分别为\
  \ `0.9`、`0.95`、`0.99` 和 `1`：\n\n```\nhistogram_quantile(<percentile>, sum without(instance,\
  \ pod, host) (\n  rate(http_request_duration_microseconds_bucket{request_path=\"\
  /health\",\n  pod=~\"$pod\"}[5m]))\n```\n\n如果我们现在查看图表，你可能会觉得奇怪，因为我们刚刚定义了五个百分位，但只能看到两个数据系列：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_531_0.png)\n\n这是使用 Prometheus 直方图时可能发生的常见错误。因为你需要在事先指定桶区间，所以你可能会定义出大多数观测值都落入顶部桶的桶。这导致我们在\
  \ 10 秒线处看到的平坦线，其中除 50th 之外的所有百分位都显示相同的值。\n\n在我们的例子中，因为我们没有覆盖由 :prometheus_phoenix\
  \ 库设置的默认 HTTP 桶，所以我们使用的是由 :prometheus_http.microseconds_duration_buckets/0 函数给出的默认\
  \ 20 个桶（下面显示的 19 个桶，外加一个 +Inf）：\n\n```\niex> :prometheus_http.microseconds_duration_buckets\n\
  [10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000,\n100000, 250000,\
  \ 500000, 1000000, 2500000, 5000000, 10000000]\n```\n\n为了解决这个问题，我们将通过设置从 500 微秒到\
  \ 25 秒的新桶来覆盖默认的 `ElixirDripWeb.EndpointInstrumenter` 配置：\n\n```\n$ cat apps/elixir_drip_web/config/config.exs\n\
  # ...\nconfig :prometheus, ElixirDripWeb.EndpointInstrumenter,\n  duration_buckets:\
  \ [500, 1000, 2500, 5000, 10_000, 25_000, 50_000,\n    100_000, 250_000, 500_000,\
  \ 1_000_000, 2_500_000, 5_000_000,\n    10_000_000, 12_500_000, 15_000_000, 17_500_000,\
  \ 20_000_000]\n```\n\n然而，Phoenix 并没有那么慢，特别是考虑到 `/health` 路由是由 `HealthController.health/2`\
  \ 函数提供服务的，该函数只是生成一个时间戳并返回当前节点连接到的节点列表。如果你觉得有什么不对劲，你是对的：我在 `health/2` 函数中添加了一个随机休眠（即\
  \ `Process.sleep(:rand.uniform(13_000))`），休眠时间在 1 到 13,000 毫秒之间，以便我们有更分散的响应时间。\n\
  \n尽管如此，原则仍然成立；在获得足够的生产数据后，你很可能会需要稍后调整你的桶。在我们的例子中，我们将移除随机休眠并相应地添加更多桶。更改部署后，相同的图表如下所示：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_532_0.png)\n\n如果我们现在放大，就会发现所有响应都在 2.5\
  \ ms 以下，99th 百分位在 1 ms 以下，而不是之前的奇怪响应时间：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_533_0.png)\n\
  \n响应时间现在快得多，并且符合预期的 Phoenix 敏捷性，当处理由我们简单的 HealthController.health/2 支持的请求时。让我们检查\
  \ Prometheus 直方图创建的另外两个指标。\n\n因为我们对 HTTP 响应时间使用了直方图，所以 _sum 和 _count 指标也在被收集。这些指标使我们能够计算平均\
  \ HTTP 请求持续时间。顾名思义，_sum 指标是一个计数器，累积观测值，而 _count 指标则计算观测次数。借助这两个指标，我们可以在给定周期内计算平均\
  \ /health 响应时间：\n\n```\nrate(http_request_duration_microseconds_sum{request_path=\"\
  /health\", pod=~\"$pod\"}[5m])\n/\nrate(http_request_duration_microseconds_count{request_path=\"\
  /health\", pod=~\"$pod\"}[5m])\n```\n\n这将为我们提供每个 pod 的平均响应时间。然而，如果我们将 pod 变量设置为\
  \ All，我们将得到与 pod 数量一样多的 Average 数据系列。为了解决这个问题，我们可以通过取其最大值来聚合之前的表达式。这样，我们将只有一个 Average\
  \ 数据系列，它在任何给定时间都对应于所有现有 pod 的最大平均响应时间：\n\n```\nmax(rate(http_request_duration_microseconds_sum{request_path=\"\
  /health\", pod=~\"$pod\"}[5m])\n/\nrate(http_request_duration_microseconds_count{request_path=\"\
  /health\", pod=~\"$pod\"}[5m]))\n```\n\n当平均响应时间与其它百分位一起显示在同一图表中时，它似乎几乎没有变化，因为图表的时间轴是为百分位时间准备的（平均响应时间始终保持在\
  \ 1 ms 以下）。为了解决这个问题，我们可以使用右侧的新 y 轴绘制它。\n\n在任何 Grafana 图表中，你可以点击图例中的彩色线并将 **Y Axis**\
  \ 设置为 **Right**。在我们的例子中，有点棘手：因为我们有与不同的 `pod` 变量值一样多的平均响应时间数据系列，所以我们想要使用 **Series\
  \ specific overrides** 一次影响所有数据系列。进入 **Display** 选项卡，添加一个新的覆盖，并将其正则表达式字段设置为 `/Average/`。然后，点击\
  \ + 号并选择 **Y-axis: 2** 覆盖，如以下屏幕截图所示：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_534_0.png)\n\
  \n这将把名称中包含 `Average` 的每个图表数据系列绘制在右侧 y 轴上。我们现在只需要在 `Axes` 选项卡中将右侧 y 轴的单位设置为 `microseconds\
  \ (µs)`。\n\n平均响应时间现在可以更详细地看到：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_535_0.png)\n\
  \n掌握了这些知识后，你现在可以为我们之前设置的自定义 `Storage.store/4` 直方图和缓存命中计数器指标创建图表。\n\n## 通往节点的窗口\n\
  \n在我们设计一种查看和与远程应用程序交互的方式之前，让我们分析一下 Elixir 鉴于其 Erlang  heritage，在分布式环境中是如何工作的。当你运行一个\
  \ IEx shell 或 ElixirDrip release 时，会启动一个 Erlang VM。每个 VM 被称为一个 *node*，你可以在同一台计算机上运行多个节点。\n\
  \n要启动一个节点，你需要定义它的 `name` 和 `magic cookie`，然后节点会尝试在本地 **Erlang Port Mapper Daemon\
  \ (EPMD)** 上注册自己。这个 EPMD 是一种名称服务器，默认在端口 `4369` 上运行，并注册每个主机上运行的节点。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_536_0.png)\n\
  \ncookie 确实被描述为 magic；请查看 Erlang 文档 http://erlang.org/doc/reference_manual/distributed.html。任何知道\
  \ cookie 值的人都能够使用它连接到节点，无需质疑，因此非常重要它要足够长并且以安全的方式存储。默认情况下，Erlang 以明文形式组成节点集群，因为假设集群运行在受信任的网络上；因此网络上的任何人都可以拦截节点之间交换的数据。\n\
  \n在以下示例中，我们启动一个休眠 20 秒的节点，然后查询本地 EPMD 当前运行哪些节点：\n\n```\n$ elixir --name simple@localhost\
  \ --cookie yummy -e \"Process.sleep(20000)\" &\n\n$ epmd -names\nepmd: up and running\
  \ on port 4369 with data:\nname simple at port 35351\n```\n\n如你所见，端口 35351 被分配给了\
  \ simple 节点。EPMD 为每个节点分配一个随机的高编号端口。如果远程节点想要连接到我们的 simple 节点，它需要设置相同的 yummy cookie，然后执行\
  \ Node.connect(:\"simple@<local-hostname>\")，其中 <local-hostname> 是本地主机名。这将向在端口 4369\
  \ 上运行的 <local-hostname> EPMD 发送关于 simple 节点的查询，后者将成功回复端口 35351。有了这些信息，远程节点就可以通过端口\
  \ 35351 连接到 simple 节点。\n\n我们的第一步是连接到在本地 Docker 容器中运行的 ElixirDrip 节点，这样我们就可以看到节点内部发生了什么。\n\
  \n## 连接到容器化节点\n\n在连接到节点之前，我们必须公开将用于连接节点的容器端口。编辑你的 docker-compose.dev.yml 文件并添加以下内容：\n\
  \n```\n$ cat docker-compose.dev.yml\n# ...\napp:\n  image: elixir_drip:dev\n# ...\n\
  ports:\n  - 4000:4000\n```\n\n  - 4369\n  - 9001-9004\n  # ...\n\n`9001-9004` 端口范围是\
  \ EPMD 为新节点分配端口的范围。我们将通过在运行 Elixir 时以及在启动应用程序发布时传递 `inet_dist_listen_min` 和 `inet_dist_listen_max`\
  \ 参数来告知 EPMD 遵守此范围。要在运行发布时传递这些参数，我们需要在发布配置中设置 `erl_opts` 选项：\n\n```\n$ cat rel/config.exs\n\
  \  # ...\nenvironment :prod do\n  set include_erts: true\n  set include_src: false\n\
  \  set cookie: :\"won't be used, we set it via a custom vm.args file (rel/custom.vm.args)\"\
  \n  set erl_opts: \"-kernel inet_dist_listen_min 9001 inet_dist_listen_max 9004\"\
  \nend\n  # ...\n```\n\n如果我们对 `inet_dist_listen_min` 和 `inet_dist_listen_max` 参数设置相同的值，则在每个主机上只能运行单个节点，因为节点数量不能超过此范围内的端口数。这将阻止我们在\
  \ pod 内运行其他节点，例如控制台，即使用 `elixir_drip console` 运行发布，如我们在上一章中所做的那样。这就是我们设置四个端口的范围的原因。\n\
  \n在暴露端口后，使用 `docker-compose -f docker-compose.dev.yml up -d` 在本地启动容器（-d 表示 *detached*，因此容器将在后台运行），在\
  \ `app` 容器内运行一个 shell，然后使用 `epmd -d` 以调试模式启动 EPMD，以便我们可以查看与它的所有交互：\n\n```\n$ docker-compose\
  \ -f docker-compose.dev.yml up -d\numbrella_postgres_1\numbrella_app_1\numbrella_prometheus_1\n\
  \n$ docker exec -i -t umbrella_app_1 bash\n\n# epmd -d\nepmd: Sun Jul 8 11:01:00\
  \ 2018: epmd running - daemon = 0\n```\n\n现在，通过在主机 shell 上运行 `docker inspect` 来查找\
  \ `app` 容器的 IP：\n\n```\n$ docker inspect umbrella_app_1 | grep \"IPAddress\"\n \
  \   \"SecondaryIPAddresses\": null,\n    \"IPAddress\": \"\",\n    \"IPAddress\"\
  : \"172.21.0.3\",\n```\n\n在另一个容器 shell 上，设置其名称、cookie 和可用端口范围后运行应用程序：\n\n```\n$\
  \ docker exec -i -t umbrella_app_1 bash\n\n# iex --name inside@172.21.0.3 --cookie\
  \ testing --erl \"-kernel inet_dist_listen_min 9001 inet_dist_listen_max 9004\"\
  \ -S mix phx.server\n# ...\nInteractive Elixir (1.6.4) - press Ctrl+C to exit (type\
  \ h() ENTER for help)\niex(inside@172.21.0.3)1>\n```\n\n你会立即看到 EPMD 注册 `inside`\
  \ 节点：\n\n```\nepmd: Sun Jul 8 11:19:42 2018: epmd running - daemon = 0\nepmd: Sun\
  \ Jul 8 11:20:45 2018: ** got ALIVE2_REQ\nepmd: Sun Jul 8 11:20:45 2018: registering\
  \ 'inside:1', port 9001\nepmd: Sun Jul 8 11:20:45 2018: type 77 proto 0 highvsn\
  \ 5 lowvsn 5\nepmd: Sun Jul 8 11:20:45 2018: ** sent ALIVE2_RESP for \"inside\"\n\
  ```\n\n我们现在可以连接到容器内运行的节点。让我们在主机上启动一个名为 `outside` 的节点，然后启动 `observer` 工具：\n\n```\n\
  $ iex --name outside@0.0.0.0 --cookie testing --erl \"-kernel inet_dist_listen_min\
  \ 9001 inet_dist_listen_max 9004\"\nInteractive Elixir (1.6.4) - press Ctrl+C to\
  \ exit (type h() ENTER for help)\niex(outside@0.0.0.0)1> :observer.start\n:ok\n\
  ```\n\n观察者界面将会出现，我们可以进入 Nodes -> Connect Node 来插入容器内运行的节点名称：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_539_0.png)\n\
  \n我们现在可以从 Nodes 菜单中选择 inside@172.21.0.3 节点并查看有关它的所有信息，包括每个运行应用程序的现有监督树；深入了解任何进程的状态；观察节点的\
  \ CPU、内存和 IO 负载；等等：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_540_0.png)\n\n让我们现在应用类似的策略来连接到我们的\
  \ ElixirDrip 远程节点。\n\n## 在 Kubernetes 中连接到 Erlang 节点\n\n在上一节中，我们公开了一系列容器端口，允许我们从外部连接到容器内运行的\
  \ Erlang 节点。然而，这次我们不想通过更新 Kubernetes `elixir-drip-loadbalancer` 服务来公开已部署 pod 的 `4369`\
  \ 和 `9001-9004` 端口，因为 EPMD 连接不安全，即使你使用 TLS 连接节点也是如此。\n\n因此，我们将借助 kubectl port-forward\
  \ 将 EPMD 端口转发到本地环境。由于 EPMD 运行在 4369 端口上，在转发端口之前请确保使用 pkill epmd 没有本地运行的 EPMD，否则你将无法转发\
  \ 4369 端口：\n\n```\n$ pkill epmd\n\n$ kubectl -n production port-forward elixir-drip-7bb9b84d85-ksc4h\
  \ 4369 9001 9002 9003 9004\nForwarding from 127.0.0.1:4369 -> 4369\nForwarding from\
  \ 127.0.0.1:9001 -> 9001\nForwarding from 127.0.0.1:9002 -> 9002\nForwarding from\
  \ 127.0.0.1:9003 -> 9003\nForwarding from 127.0.0.1:9004 -> 9004\n```\n\n我们现在可以通过与本地端口\
  \ 4369 交互来访问 ksc4h pod 中运行的 EPMD 实例：\n\n```\n$ epmd -names\nepmd: up and running\
  \ on port 4369 with data:\nname elixir_drip at port 9001\n```\n\n请记住，我们已使用自定义 vm.args\
  \ 文件将每个 ElixirDrip 节点命名为 elixir_drip@<pod-ip>，因此我们需要将每个节点连接到 Node.connect(\":\\\"\
  elixir_drip@<pod-ip>\\\"\")，其中 <pod-ip> 是通过以下命令获得的 pod IP：\n\n```\n$ kubectl -n\
  \ production exec -t elixir-drip-7bb9b84d85-ksc4h -c elixir-drip-prod -- env | grep\
  \ POD_IP\nPOD_IP=10.40.0.41\n```\n\n通过在 ksc4h pod 内运行 env | grep POD_IP，我们知道 pod\
  \ IP。然而，IP 10.40.0.41 是 Kubernetes 内部 IP，在本地环境中没有有意义的值。如果我们尝试使用 Node.connect/1 函数连接到\
  \ elixir_drip@10.40.0.41，后续对 10.40.0.41 地址上运行的 EPMD 的查询将无法工作，因为从本地角度来看，没有办法到达此地址。\n\
  \n为克服这一点，我们将 10.40.0.41 pod IP 转发到 localhost 地址。首先，确保在 /etc/sysctl.conf 配置文件中取消注释\
  \ net.ipv4.ip_forward=1 行，以便我们可以设置 IPv4 转发规则。然后，使用以下命令转发 IP：\n\n```\n$ sudo iptables\
  \ -t nat -A OUTPUT -d 10.40.0.41 -j DNAT --to-destination 127.0.0.1\n```\n\n```\n\
  $ ping 10.40.0.41\nPING 10.40.0.41 (10.40.0.41) 56(84) bytes of data.\n64 bytes\
  \ from 10.40.0.41: icmp_seq=1 ttl=64 time=0.079 ms\n64 bytes from 10.40.0.41: icmp_seq=2\
  \ ttl=64 time=0.086 ms\n^C\n```\n\n我们现在可以 ping pod IP，即使实际上是 localhost 在回复。让我们现在启动一个本地\
  \ IEx shell，类似于我们之前所做的，但这次我们将命名为 console@10.40.0.41：\n\n```\n$ iex --name console@10.40.0.41\
  \ --cookie <cookie>\nErlang/OTP 20 [erts-9.3] [source] [64-bit] [smp:4:4] [ds:4:4:10]\
  \ [async-threads:10] [hipe] [kernel-poll:false]\n\nInteractive Elixir (1.6.4) -\
  \ press Ctrl+C to exit (type h() ENTER for help)\niex(console@10.40.0.41)>\n```\n\
  \n我们现在传递的 cookie 值（<cookie>）在上一章中已作为 Kubernetes secret 设置。我们现在必须在运行 console@10.40.0.41\
  \ 节点时设置相同的 cookie 值，以便后者可以连接到 pod 中运行的节点。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_542_0.png)\n\
  \n如果你不记得在 Kubernetes secret 上设置的 cookie，你始终可以在 pod 容器内运行 ElixirDrip 控制台（PORT=5678\
  \ ./bin/elixir_drip console）并检查 Node.get_cookie/0 值。在我们的例子中，这更简单，因为我们是从名为 ERLANG_COOKIE\
  \ 的环境变量设置 cookie，所以 kubectl exec -t <pod-name> -c <container-name> - env | grep\
  \ ERLANG_COOKIE 就足够了。\n\n在之前的端口和 IP 转发设置之后，如果我们运行 epmd -names，我们会看到两个节点（console\
  \ 和 elixir_drip）已注册。请记住，我们正在查询本地端口 4369 上的 EPMD，该端口转发到 ksc4h pod 上的同一端口，因此我们实际上是在查询远程\
  \ pod 中运行的 EPMD：\n\n```\n$ epmd -names\nepmd: up and running on port 4369 with data:\n\
  name console at port 43323\nname elixir_drip at port 9001\n```\n\n我们现在可以连接到 pod\
  \ 中运行的节点并启动 observer 工具：\n\n```\niex(console@10.40.0.41)> Node.connect(:\"elixir_drip@10.40.0.41\"\
  )\ntrue\n\niex(console@10.40.0.41)> :observer.start\n:ok\n```\n\n\n\n因为我们之前已经连接到节点，所以它已经出现在\
  \ Nodes 菜单中。我们再次从正在运行的 IEx shell 启动了 observer，但我们也可以立即使用 Erlang 启动 observer 工具：\n\
  \n```\n$ erl -name console@10.40.0.41 -setcookie <cookie> -hidden -run observer\n\
  ```\n\n使用 Erlang 方法，我们从一开始就没有连接到任何节点，因此你仍需要使用 Nodes -> Connect Node 选项连接到 elixir_drip@10.40.0.41\
  \ 节点。\n\n此外，请注意我们这次传递的 -hidden 标志。通过将本地控制台节点作为隐藏节点启动，它只会连接到单个节点，而不是默认尝试连接到所有可用的已连接节点（由于分布式\
  \ Erlang 的传递性）：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_543_0.png)\n\n现在让我们了解如何在一个远程节点内部运行\
  \ IEx shell。\n\n## 使用远程 shell\n\n如果 observer 提供的信息不足，在此设置下，你也可以从本地 shell 的舒适环境中运行远程\
  \ shell：\n\n```\n$ iex --name console@10.40.0.41 --cookie $COOKIE --remsh\n\"elixir_drip@10.40.0.41\"\
  \nErlang/OTP 20 [erts-9.3] [source] [64-bit] [smp:4:4] [ds:4:4:10] [async-threads:10]\
  \ [hipe] [kernel-poll:false]\n\nInteractive Elixir (1.6.4) - press Ctrl+C to exit\
  \ (type h() ENTER for help)\niex(elixir_drip@10.40.0.41)> node()\n:\"elixir_drip@10.40.0.41\"\
  \niex(elixir_drip@10.40.0.41)> Node.list\n[:\"elixir_drip@10.40.2.143\", :\"elixir_drip@10.40.0.42\"\
  ,\n:\"console@10.40.0.41\"]\n```\n\n如你所见，当前节点（由 Kernel.node/0 函数给出）是远程节点（elixir_drip@10.40.0.41），因此你运行的任何内容都将在远程节点上运行。由于我们使用\
  \ libcluster 库连接了 ElixirDrip 节点，因此 Node.list/0 函数返回了三个节点。\n\n让我们通过远程 shell 存储一个文件，然后使用\
  \ observer 查看其内容，从而让远程 shell 和 observer 工具为我们工作：\n\n```\niex(elixir_drip@10.40.0.41)>\
  \ jose_user =\nElixirDrip.Accounts.get_user_by_username(\"jose\")\n%ElixirDrip.Accounts.User{\n\
  \  # ...\n  username: \"jose\"\n}\n\niex(elixir_drip@10.40.0.41)> ElixirDrip.Storage.store(jose_user.id,\n\
  \"remote_shell_test.txt\", \"$/foo/bar\", \"f○e? V○eV ... ( ^_ ) ( ^_^ ) Hello from\
  \ Remote Shell\")\n{:ok, :upload_enqueued,\n%ElixirDrip.Storage.Media{\n  file_name:\
  \ \"remote_shell_test.txt\",\n  file_size: 95,\n  full_path: \"$/foo/bar\",\n  id:\
  \ \"173aBUSCM8nVJKPUDB e6EondStn\",\n  # ...\n}}\n```\n\n在我们刚刚启动的 **Observer** 中，前往\
  \ **Applications** 选项卡，并在左侧窗格中选择 `elixir_drip` 应用。然后，在监督树中查找一个 `CacheWorker` 进程，其父进程为\
  \ `Supervisors.CacheSupervisor` 进程：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_545_0.png)\n\
  \n在我们的例子中，`CacheWorker` 进程的 PID 为 `11724.6869.0`。如果右键单击它并选择 **Process info**，你就可以查看进程状态：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_546_0.png)\n\n在 State 选项卡中，我们可以看到 CacheWorker\
  \ 状态：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_546_1.png)\n\n```\n#{content =>\
  \ <<202,149,226,128,162,225,180,165,226,128,162,202,148,32,86,226,128,162,\n225,180,165,226,128,162,86,32,224,184,133,94,226,128,162,239,187,140,\n\
  226,128,162,94,224,184,133,32,239,188,136,94,95,94,239,188,137,111,\n232,135,170,232,135,170,111,239,188,136,94,95,94,32,239,188,137,72,101,\n\
  108,108,111,32,102,114,111,109,32,82,101,109,111,116,101,32,83,104,101,\n108,108>>,\n\
  hits => 0, timer => #Ref<11724.4183008082.2270429185.76865>}\n```\n\n如果你将进程状态中的二进制内容复制到\
  \ IEx shell 并打印它，你会发现，正如预期的那样，就是我们刚刚上传的文件内容：\n\n```\n$ iex\nErlang/OTP 20 [erts-9.3]\
  \ [source] [64-bit] [smp:4:4] [ds:4:4:10] [async-threads:10] [hipe] [kernel-poll:false]\n\
  \nInteractive Elixir (1.6.4) - press Ctrl+C to exit (type h() ENTER for help)\n\
  iex> content = <<202,149,226, ...>>\n\"\U0001D557\U0001D560\U0001D560? \U0001D567\
  \U0001D560\U0001D563? \U0001D552... (^_^) (^_^) Hello from Remote Shell\"\n```\n\
  \n如果你觉得将 observer 工具连接到远程节点的步骤过于繁琐，请查看 wobserver 库，它与 Phoenix 集成，允许你使用浏览器访问 observer\
  \ 工具提供的所有信息。你可以在本书的源代码中找到如何配置此库的示例。\n\nwobserver 库还公开了 Prometheus 指标（默认在 /wobserver/metrics\
  \ 路径上），因此我们甚至可以设置一个新的 Kubernetes ServiceMonitor 来抓取 Wobserver 库公开的有关 VM（使用的内存和 IO\
  \ 字节）的指标，从而允许我们创建新的 Grafana 图表。现在让我们进入本章的最后一节，在那里我们将探讨如何调查我们在生产中运行的应用发生了什么。\n\n\
  ## 检查应用行为\n\n在本章开始时，我们学习了如何在整个应用中收集指标。这是成功维护在生产中平稳运行的应用的第一步。通过收集指标并定期分析它们，我们了解应用的性能如何。在此分析过程中，我们肯定会发现某些函数或模块的异常值或异常行为，这将促使我们分析其原因。\n\
  \n除了学习如何收集指标外，我们还看到了如何运行连接到生产中应用的远程 shell。我们也将使用远程 shell 来运行我们的实验。请注意，在生产中运行它们是危险的。由于我们使用的是实时环境，我们冒着因粗心的实验或仅仅是系统额外负载而导致客户服务中断的风险。\n\
  \n虽然这是事实，我们也建议在执行此类任务时格外小心，但我们也认为这是获得有意义结果的唯一方法。我们在生产中观察到的奇怪行为可能只会在这些确切条件下表现出来。\n\
  \n如果你尝试在本地机器上复制它，你可能只会得到无关紧要的数据，并且永远无法找到你试图解决的问题的根源。\n\nElixir 依托 Erlang，具有在生产中安全地分析并追踪应用的强大支持。正如我们之前所说，在实时环境中执行此类操作需要格外小心。尽管如此，从\
  \ Erlang VM 获得如此强大的支持来在应用中进行分析/追踪是极其有用的。\n\n需要注意的是，与其他系统相反，我们不会通过设置断点并逐步执行来窥探生产应用以尝试分析上下文。我们所做的所有观察都是间接的，并且永远不会停止生产中运行的任何进程。在本书的第一章中，我们看到了如何使用\
  \ IEx 助手从 shell 设置断点。这是在本地开发应用时调试应用的有用技术，但不适合在生产中检查应用。\n\n本节分为两个子部分：在第一个部分中，我们探讨使用\
  \ Mix 内置的一个分析器来了解应用中某个函数发生了什么，而在后者中，我们使用 Erlang 的 `:dbg` 模块来追踪实时请求是如何处理的。\n\n##\
  \ 使用 fprof 分析器进行分析\n\n我们现在将学习如何使用随 Mix 一起提供的分析器之一来分析应用中某个函数的性能。我们将使用的分析器基于 Erlang\
  \ 的 `fprof` 分析器。Mix 通过一个 Mix 任务公开此分析器，这也是我们将与之交互的方式。\n\n我们将对 `ElixirDrip.Storage.store/4`\
  \ 函数进行分析，该函数负责在数据库上创建新的 `Media` 条目并触发上传任务。为了模拟该函数完成所需的时间远长于预期，我们将在 `store` 函数调用的函数之一\
  \ `ElixirDrip.Storage.Media.create_initial_changeset` 函数中插入一个 `Process.sleep/1`\
  \ 调用。\n\n令人着迷且有趣的分析案例只有在应用部署在实时环境中、被实际用户使用并产生不可预测的工作负载时才会出现。尽管如此，使用 `Process.sleep/1`\
  \ 调用允许我们演示重要方面，这将使你能够在需要时进行自己的分析。\n\n\n\n为了分析我们的应用程序，我们将使用 mix profile.fprof 任务：\n\
  \n```\n$ mix profile.fprof -e\n'ElixirDrip.Storage.store(\"177VXwhSuI7vjzkZOU7uvowAZzO\"\
  , \"test.txt\", \"$\",\n\"some file content\")'\n```\n\n```\nWarmup...\nReading\
  \ trace data...\nEnd of trace!\nProcessing data...\nCreating output...\nDone!\n\
  \                CNT    ACC\n(ms)      OWN (ms)\nTotal                         \
  \          4023\n2047.954     28.076\n:fprof.apply_start_stop/4              0\n\
  2047.954     0.015\nanonymous fn/0 in :elixir_compiler_1.__FILE__/1   1\n2047.935\
  \     0.004\nElixirDrip.Storage.store/4            1\n2047.931     0.016\nElixirDrip.Instrumenter.observe_duration/2\
  \   1\n2047.837     0.010\nanonymous fn/4 in ElixirDrip.Storage.store/4   1\n2047.658\
  \     0.020\n:suspend                               14\n2019.878     0.000\nElixirDrip.Storage.Media.create_initial_changeset/4\
  \   1\n2006.250     0.038\nProcess.sleep/1                        1\n2000.888  \
  \   0.020\nDBConnection.run/3                     4\n38.715      0.047\nDBConnection.run_begin/3\
  \              2\n37.645      0.017\nElixirDrip.Repo.insert/1              1\n35.661\
  \      0.004\nElixirDrip.Repo.insert/2              2\n35.657      0.008\nEcto.Repo.Schema.insert/4\
  \             2\n35.653      0.009\n# ...\n```\n\n我们裁剪了此命令的输出以便于阅读。例如，运行此任务实际上会创建一个上传任务，因为我们在生产环境中运行被分析的代码。\n\
  \n为了分析 store 函数，我们传递了 -e 参数，其中包含将被求值的代码。\n\n分析器首先进行预热，然后进行分析本身，最后对生成的数据进行分析，结果打印到终端。\n\
  \n分析器进行预热是为了确保生成的数据尽可能接近真实请求。在此阶段，分析器在不进行任何测量的情况下运行代码。这很重要，因为第一次运行可能需要执行一些初始设置，例如连接到数据库，从而使第二次运行（即被测量的运行）可以使用第一次运行所做的设置。\n\
  \n现在让我们分析前一个代码块中最重要的部分：分析器的输出。输出由一个表格组成，其中第一列包含被测量的函数名称，其余列包含与该函数对应的数据。第一个数据列称为\
  \ CNT，包含在分析期间该函数被调用的次数。然后，我们有两个与时间测量相关的列：ACC 和 OWN，均以毫秒为单位。ACC 列包含在该函数中花费的总时间，而\
  \ OWN 列包含在该函数中花费的时间，不考虑其调用的函数所花费的时间。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_550_0.png)\n\
  \n默认情况下，profile.fprof 任务的输出按 ACC 时间排序，但我们也可以通过向 Mix 任务传递 --sort own 选项按 OWN 时间排序。\n\
  \n查看此表格，很清楚问题所在：我们有从大约 20 ms 到大约 38 ms 的巨大跳跃。这是使用合成示例的副产品，因为在现实世界中，我们可能不会看到两个函数之间花费时间如此明显的分界。另一个表明这是合成示例的线索是\
  \ ACC 和 OWN 时间之间的巨大差异。由于我们刚刚让 create_initial_changeset 函数中的进程休眠，这会使进程进入挂起状态，因此我们看不到它具有很大的\
  \ OWN 时间跨度。然而，在真实世界的示例中，您还应关注 OWN 列中显示的时间，它会迅速指出哪些函数在内部花费了最多的时间（不考虑对其他函数的调用）。\n\n\
  让我们再次运行分析器，但这次传递 --callers 选项。这将为我们提供有关时间花费的更详细视图（以生产系统额外负载为代价）。让我们分析这次运行的输出：\n\n\
  ```\n$ mix profile.fprof --callers -e\n'ElixirDrip.Storage.store(\"177VXwhSuI7vjzkZOU7uvowAZzO\"\
  , \"test.txt\", \"$\",\n\"some file content\")'\nWarmup...\n# ...\nElixirDrip.Instrumenter.observe_duration/2\
  \              1      2024.454\n0.016\nanonymous fn/4 in ElixirDrip.Storage.store/4\
  \              1      2024.454\n0.016 <--\n    ElixirDrip.Storage.Media.create_initial_changeset/4\
  \    1      2004.626\n0.027\n    ElixirDrip.Repo.insert/1                      \
  \         1      14.972\n0.005\n    ElixirDrip.Storage.get_owner/1             \
  \            1      4.518\n0.002\n    Ecto.Changeset.put_assoc/3               \
  \              1      0.312\n0.004\nElixirDrip.Storage.Workers.QueueWorker.enqueue/2\
  \          1      0.010\n0.001\n\nanonymous fn/4 in ElixirDrip.Storage.store/4 \
  \             1      2004.626\n0.027\n    ElixirDrip.Storage.Media.create_initial_changeset/4\
  \    1      2004.626\n0.027 <--\n    Process.sleep/1                           \
  \             1      2000.753\n0.033\n    ElixirDrip.Storage.Media.create_changeset/2\
  \           1      1.870\n0.024\n    KsuId.generate/0                          \
  \            1      1.141\n0.043\n    ElixirDrip.Storage.Media.generate_storage_key/2\
  \       1      0.572\n0.012\n    ElixirDrip.Storage.Providers.Encryption.Simple.generate_\
  \ 1      0.263\n0.003\n\n# ...\n```\n\n正如我们在第一次运行中所做的那样，我们裁剪了此命令的输出。当传递此选项时，我们会为第一次运行中看到的每个被分析函数获得一个专用块。在右侧，我们可以看到每个块上都有一个箭头，它表示当前块的标记函数。块中其余所有数字都相对于带有箭头的行。例如，在第一个块中，我们可以看到标记的函数是\
  \ `ElixirDrip.Storage.store`。在此分析器中，我们只有一个调用者，因此所有在 `store` 函数中花费的时间都来自该单个调用者。\n\
  \n更进一步，在 `store` 函数调用的函数中，我们可以详细地看到时间花费在哪里。我们可以观察到对 `ElixirDrip.Storage.Media.create_initial_changeset`\
  \ 的调用花费了大约两秒，而下一个最长的调用是对 `ElixirDrip.Repo.insert` 的调用，花费了大约 15 毫秒。\n\n再次，与第一个示例一样，存在巨大差距，在真实的分析会话中不太可能找到这种巨大差异。尽管如此，我们可以看到问题必须存在于\
  \ `ElixirDrip.Storage.Media.create_initial_changeset` 中。由于我们现在使用了 `--callers` 选项，我们现在可以继续分析此函数专用的块，我们在第一个块之后显示了它。在这个第二个块中，我们可以看到对于\
  \ `create_initial_changeset` 函数调用的函数，大部分时间（再次，大约两秒）花费在调用 `Process.sleep` 函数上。此函数调用之后，该块中最长的条目属于\
  \ `ElixirDrip.Storage.Media.create_changeset` 函数，花费了大约 2 毫秒。因此，我们找到了罪魁祸首！下一步将是修复它，然后密切监控它以尝试评估问题是否确实已解决。如果没有，调查将重新开始，但现在系统不同，这将导致不同的分析结果。\n\
  \n我们现在已经完成了一次分析会话，并学习了如何使用 `fprof` 分析器来分析代码的行为。然而，`fprof` 并不是随 Mix 一起提供的唯一分析器。我们还拥有\
  \ `eprof` 和 `cprof`，它们与 `fprof` 一样，都是 Erlang 分析器。您应该使用最适合您将进行的分析类型的分析器。`eprof` 分析器是基于时间的分析器（如\
  \ `fprof`），但以不同的方式呈现信息。除了每个函数的总调用次数外，它还显示每个函数花费的时间百分比，并显示每个函数的每次函数调用的微秒数。`cprof`\
  \ 分析器仅显示每个被分析函数的函数调用次数，这本质上是我们之前在 `fprof` 输出中看到的第一列。如果您只对该指标感兴趣，使用 `cprof` 而不是 `fprof`\
  \ 是有利的，因为它对生产系统的影响会更低。我们建议您查看这些 Mix 任务的官方文档，以了解所有可用选项。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_552_0.png)\n\
  \n`fprof` 的文档可在 https://hexdocs.pm/mix/Mix.Tasks.Profile.Fprof.html 获取，`eprof` 的文档可在\
  \ https://hexdocs.pm/mix/master/Mix.Tasks.Profile.Eprof.html 获取，`cprof` 的文档可在 https://hexdocs.pm/mix/Mix.Tasks.Profile.Cprof.html\
  \ 获取。\n\n我们已经到达了分析部分的结尾。现在让我们继续下一个主题，在那里我们将学习如何跟踪我们的实时应用程序。\n\n\n\n## 使用 :dbg 模块进行追踪\n\
  \n在了解了如何分析应用程序的模块和函数性能之后，让我们现在探索如何在实时环境中进行追踪。虽然在上一节中，我们需要将要分析函数的输入数据作为输入提供，在本节中我们将采用不同的方法。我们将告诉\
  \ VM 我们想要追踪的函数，然后观察用户在生产环境中发出的实时调用。这非常有趣，因为我们使用真实数据分析应用程序的行为，这通常能让我们得出更好的结论。此外，正如我们之前讨论的，某些错误只会在实时环境中显现。在这种情况下，我们需要能够接入实时请求并尝试弄清楚发生了什么。\n\
  \n为了进行追踪，我们将使用 Erlang 的 :dbg 模块。执行追踪实验有一些更底层的构造，例如 :erlang.trace 函数。我们认为直接处理这些构造与仅使用\
  \ :dbg 相比并无额外价值，而 :dbg 提供了有用的抽象层，可以在不必担心太多细节的情况下进行追踪实验。此外，我们认为直接使用 :dbg 已经足够危险了，因为如果使用不当，可能会对生产环境造成巨大损害。更底层的命令通常更容易出错，因此直接使用它们会增加在生产环境中产生意外副作用的可能性。\n\
  \n让我们检查一下追踪实验通常是如何进行的。我们开始在 IEx 会话中调用以下命令：\n\n```\niex> :dbg.tracer\n{:ok, #PID<0.661.0>}\n\
  ```\n\n调用 tracer 函数会生成一个新进程，称为追踪器进程，它负责收集此追踪实验相关的事件。该进程会根据我们定义的追踪模式接收邮件箱中的消息。在以下示例中，我们只是将追踪事件打印到控制台，但可以配置\
  \ :dbg 将追踪输出保存到文件中，这在你想稍后分析时非常方便。\n\n要选择我们想要追踪的函数，我们将使用 :dbg.tp 函数：\n\n```\niex>\
  \ :dbg.tp(Elixir.Drip.Storage, :store, 4, [])\n{:ok, [{:matched, :elixir_drip@10.40.0.41,\
  \ 1}]}\n```\n\n使用 tp 函数，我们指定要追踪的模块、函数和元数。我们可以省略函数的元数，这将导致追踪该函数名的所有元数。同样，我们可以省略函数名，这将导致追踪该模块的所有函数。\n\
  \n最后一个参数是一个空列表，是一个匹配规范。它允许我们进一步细化想要追踪的函数调用类型，我们稍后会探索它。\n\n在定义了追踪模式后，启动追踪实验的最后一步是：\n\
  \n```\niex> :dbg.p(:new, :c)\n{:ok, [{:matched, :elixir_drip@10.40.0.41, 0}]}\n\
  ```\n\n这样调用 p 函数会指示 VM 根据我们之前定义的追踪模式，对调用该函数时不存在的新进程和端口进行函数调用追踪。这里我们可以使用一些不同的选项。在第一个参数中，除了\
  \ :new 之外，我们也可以使用 :all，这将追踪 VM 中的所有进程。另一个选项是使用 self()，这将只追踪 shell 进程的函数调用——在某些条件下，这可能正是我们需要的。至于第二个参数，除了追踪函数调用之外，我们可能还想追踪某个进程发送和接收的消息。在这种情况下，你可以在第二个参数中使用\
  \ :m，这将追踪具有第一个参数 PID 的进程的发送和接收消息。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_554_0.png)\n\
  \n不要在覆盖 VM 中所有进程时尝试追踪消息。换句话说，在调用 :dbg.p 函数时不要同时使用 :all 和 :m 选项，否则可能会在生产环境中引起麻烦。\n\
  \n这样一来，我们就可以开始追踪 store 函数的调用了。由于我们的应用程序没有真实用户，我们模拟了一个用户与系统交互并通过 Web 应用程序上传了一个新文件。执行此操作后，我们在\
  \ IEx 会话中观察到以下条目：\n\n```\n(<0.769.0>) call\n'Elixir.Drip.Storage':store(<<\"17fVtjzyIYW4aKmfKXUG754u4AI\"\
  >>,<<\"testing_tracing.txt\">>,<<\"$\">>,<<\"some live content\\n\">>)\n```\n\n\
  我们可以看到 store 函数被调用了，并且带有哪些参数。仅凭这一点可能无法回答我们所有的疑问，但我们可以迭代并尝试在系统中放置更多探针，这将为我们提供更多信息来了解发生了什么。例如，假设我们已经分析了存储函数的代码，并怀疑在排队新的上传任务时存在问题。我们也会开始追踪该函数：\n\
  \n```\niex> :dbg.tp(Elixir.Drip.Storage.Workers.QueueWorker, :enqueue, 2, [])\n\
  {:ok, [{:matched, :elixir_drip@10.40.0.41, 1}]}\n```\n\n现在，在应用程序中触发新的文件上传后，我们看到以下内容：\n\
  \n```\n(<0.935.0>) call\n'Elixir.Drip.Storage':store(<<\"17fVtjzyIYW4aKmfKXUG754u4AI\"\
  >>,<<\"testing_tracing_with_queue.txt\">>,<<\"$\">>,<<\"some live content\\n\">>)\n\
  (<0.935.0>) call\n'Elixir.Drip.Storage.Workers.QueueWorker':enqueue('Elixir.Drip.Storage.Workers.QueueWorker.Upload',#{content\
  \ => <<\"some live content\\n\">>, media =>\n  file_name => <<\"testing_tracing_with_queue.txt\"\
  >>,file_size => 6,\n  full_path => <<\"$\">>,id => <<\"17fXKLprLRyY9E5xfzsOz7KCw0\"\
  >>,\n  storage_key => <<\"17fXKLprLRyY9E5xfzsOz7KCw0_20180720T232423.txt\">>,\n\
  \  inserted_at =>\n  #{~__struct__} => 'Elixir.NaiveDateTime',\n  calendar => 'Elixir.Calendar.ISO',\
  \ day => 20, hour => 23,\n  microsecond => {844068,6},\n  minute => 24, month =>\
  \ 7, second => 23, year => 2018},\n  updated_at =>\n  #{~__struct__} => 'Elixir.NaiveDateTime',\n\
  \  calendar => 'Elixir.Calendar.ISO', day => 20 ,hour => 23,\n  microsecond => {844088,6},\n\
  \  minute => 24, month => 7, second => 23, year => 2018},\n  uploaded_at => nil,user_id\
  \ => <<\"17fVtjzyIYW4aKmfKXUG754u4AI\">>},\n  type => upload,\n  # ...\n  user_id\
  \ => <<\"17fVtjzyIYW4aKmfKXUG754u4AI\">>})\n```\n\n我们现在可以看到 enqueue 函数正在被追踪，并且可以检查其参数。在这种情况下，我们可以检查传递给它的\
  \ %Media{} 结构体，这为我们提供了一些有价值的信息，有助于调试真实情况。如果我们仍然找不到任何东西，我们将重复该过程并尝试缩小我们要解决的问题。只需确保不要同时追踪太多函数，因为这可能会给\
  \ Erlang VM 带来过大的负载。\n\n现在让我们简要探索匹配规范以及它们如何帮助我们缩小追踪范围。为了本示例的目的，假设我们有理由相信我们要解决的问题只会在用户上传文件到根路径\
  \ (\"$\") 时发生。在这种情况下，我们可以设置我们的追踪模式，只捕获上传到此路径的文件。以下是创建此模式的函数调用：\n\n```\niex> :dbg.tp(Elixir.Drip.Storage,\
  \ :store, 4, [{[:_, :_, \"$\", :_], [], []}])\n{:ok, [{:matched, :elixir_drip@10.40.0.41,\
  \ 1}, {:saved, 1}]}\n```\n\n这与我们之前看到的类似，唯一的区别在于最后一个参数。正如我们之前所说，最后一个参数是匹配规范，由三部分组成：head、conditions\
  \ 和 body。在这里，我们只使用了 head。从概念上讲，我们在这里做的事情类似于对函数子句进行模式匹配。在这种情况下，我们的 store 函数有四个参数，我们说我们只关心第三个参数并希望将其与\
  \ \"$\" 匹配。这是 Erlang 世界中一个非常复杂的话题，我们不会在本 书中深入细节。如果你想进一步探索这个话题，请查看官方文档 at http://erlang.org/doc/apps/erts/match_spec.html。\n\
  \n使用此匹配规范，我们将只从上传到该路径的文件中获取追踪，与我们已经看到的类似。你可以将此技术推广并在需要根据特定参数值过滤追踪时应用它。\n\n为了结束本节，我们将学习如何更改匹配规范以在追踪输出中获取被追踪函数的返回值。在某些情况下，仅访问被追踪函数接收的参数是不够的，我们需要访问其返回值才能弄清楚发生了什么。对于这些情况，我们可以按如下方式调整匹配规范：\n\
  \n```\niex> :dbg.tp(Elixir.Drip.Storage, :store, 4, [{[:_, :_, \"$\", :_], [], [{:return_trace}]}])\n\
  {:ok, [{:matched, :elixir_drip@10.40.0.41, 1}, {:saved, 2}]}\n```\n\n为了查看我们正在追踪的函数的返回值，我们需要在匹配规范的主体（其最后一个参数）中插入\
  \ {:return_trace}。在更新了追踪模式后，我们现在可以在 Web 界面上进行新的文件上传，这将在我们的 IEx 会话中生成以下输出：\n\n```\n\
  (<0.784.0>) call\n'Elixir.Drip.Storage':store(<<\"17fVtjzyIYW4aKmfKXUG754u4AI\"\
  >>,<<\"testing_tracing_return_value.txt\">>,<<\"$\">>,<<\"some live content\\n\"\
  >>)\n(<0.784.0>) returned from 'Elixir.Drip.Storage':store/4 ->\n{ok, upload_enqueued,\
  \ file_name =>\n<<\"testing_tracing_return_value.txt\">>,\nfile_size => 6,\nfull_path\
  \ => <<\"$\">>,\nid => <<\"17fwfSOqxQnKxp2OhjB1eebDWrd\">>,\nstorage_key =>\n<<\"\
  17fwfSOqxQnKxp2OhjB1eebDWrd_20180721T025245\">>,\n# ...\nuser_id => <<\"17fVtjzyIYW4aKmfKXUG754u4AI\"\
  >>}\n```\n\n\n\n从之前的代码片段可以看出，我们现在获得了 store 函数的返回值，一个 {:ok, :upload_enqueued, %Media{}}\
  \ 元组。\n\n现在是任何追踪会话的最后一步：停止所有追踪。要实现这一点，我们只需要调用以下函数：\n\n```\niex> :dbg.stop_clear\n\
  :ok\n```\n\n这是一个非常简单的步骤。尽管如此，它非常重要，因为跳过执行可能会导致一些不愉快的意外。\n\n在本节中，我们学习了几种根据手头任务需要追踪应用程序的技术。请注意，这些技术不必孤立使用；正是将它们结合起来，才能更好地了解正在发生的事情与我们的\n\
  \n最后，我们想指出，本章中描述的工具并不是用于分析/追踪应用程序的唯一有用工具。特别是，我们想提到 XProf (https://github.com/Appliscale/xprof)\
  \ 和 Tracer (https://github.com/gabiz/tracer) 库。我们选择演示如何使用 :dbg 模块，因为我们认为这有助于更好地理解\
  \ Erlang VM 上追踪的工作原理。然而，在日常工作中，你可能会求助于更高级别的抽象，例如我们刚刚提到的这两个库。现在让我们总结本章并回顾我们在其中探索的最重要的概念。\n\
  \n## 摘要\n\n在本章中，我们分析了在生产环境中运行的 Elixir 项目内部发生情况的不同方式。持续用收集到的指标为仪表板提供数据，可以让你快速评估应用程序的当前状态。\n\
  \n使用 Prometheus 和 Grafana，你可以深入挖掘指标数据并理解那些乍一看可能被忽视的行为和模式。我们还学习了如何通过在 Elixir 代码中添加仪器调用来发出自定义\
  \ Prometheus 指标，当 Prometheus 库套件开箱即用的指标不足时。\n\n有时，拥有对已部署运行代码的最新且有根据的视图是必不可少的。在这些情况下，你可以连接到应用程序并借助强大的\
  \ Observer 工具查看它。在将应用程序部署到云上后，连接它会更困难，但并非不可能，这要归功于 Erlang 继承的令人难以置信的分布式工具。\n\n确保你始终了解应用程序健康状况的另一个重要方面是告警。我们没有涵盖它，但\
  \ Prometheus 和 Grafana 都能够根据一组规则触发告警，然后通过不同的渠道传递，从通常的电子邮件到满足你需求的自定义解决方案。\n\n配置你的监控架构是一个持续的过程，你会根据日常操作中发现的问题和瓶颈创建新图表并更新现有仪表板。与软件工程的大多数主题类似，这里也没有万能的解决方案。努力设置一些告警并尽可能多地进行仪器化，以便你对系统的每个部分都有一个大致的了解，然后再逐步微调。\n\
  \n我们已经看到了几种了解生产环境中应用程序发生情况的方法，通过了解如何分析并追踪其中的函数。我们探索的技术旨在最大程度地减少对生产系统的影响，而无需停止任何进程进行调试。就像我们的\
  \ Elixir 应用程序一样，调试和追踪技术基于进程之间的异步消息传递。\n\n在本章中，我们涵盖了以下主题：\n\n- Prometheus，一个在许多生产项目中广泛使用的流行开源监控解决方案\n\
  - 安装和配置 `prometheus` Elixir 库套件以收集有关我们的 ElixirDrip 应用程序的指标\n- 发出自定义直方图和计数器指标以衡量函数执行所需的时间并统计缓存命中次数\n\
  - 在本地使用 Prometheus 并借助 `helm` 图表将 Prometheus 和 Grafana 捆绑解决方案部署到 Kubernetes\n- 配置部署在\
  \ Kubernetes 中的 Prometheus 实例以自动发现并抓取新 ElixirDrip Pod 发出的指标\n- 使用 Grafana 创建美观且富有表现力的仪表板，以有意义的方式呈现大量收集的指标\n\
  - 分布式 Erlang 及其如何允许我们运行和连接多个 Elixir 节点\n- 使用 Observer 查看正在运行的应用程序，无论是在云上还是在本地容器中运行\n\
  - 在 Kubernetes Pod 内部的远程节点中运行 shell\n- 使用 `mix profile.fprof` 任务分析某个函数，以及我们可以传递给它的一些可能选项\n\
  - 使用 Erlang 的 `:dbg` 模块追踪正在运行的应用程序中函数调用和交换的消息\n\n这是本书的最后一章！我们衷心希望你阅读本书的乐趣与我们写作时的乐趣一样多。虽然我们已经到达了本书的结尾，但我们一起开始的旅程并未结束——永远不会结束。\n\
  \n在涵盖本书中介绍的广泛主题时，沿途我们留下了指向文档或有趣项目的链接，以便你能够继续我们一起开始的旅程，并将你的 Elixir 学习提升到更高的水平。我们很幸运能成为这样一个充满活力和朝气的社区的一部分，我们只能想象这个不可思议的群体将带来怎样的惊人事物。\n\
