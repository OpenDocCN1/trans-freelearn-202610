  \nThis created a Phoenix application as the elixir_drip_web umbrella application,\
  \ so we now have two umbrella applications in the apps folder. Our web interface\
  \ will expose the business logic implemented by the elixir_drip application, so\
  \ we have to add the latter to the elixir_drip_web dependencies by editing its mix.exs\
  \ file.\n\nTo access modules defined by the elixir_drip application from the elixir_drip_web\
  \ application, we just need to add {:elixir_drip, in_umbrella: true} as one of the\
  \ web application dependencies:\n\n```\n$ cat apps/elixir_drip_web/mix.exs\ndefmodule\
  \ ElixirDripWeb.Mixfile do\n  use Mix.Project\n\n  def project do\n    [\n     \
  \ # ...\n    ]\n  end\n\n  def application do\n    [\n      mod: {ElixirDripWeb.Application,\
  \ []},\n      extra_applications: [:logger, :runtime_tools]\n    ]\n  end\n  # ...\n\
  \  defp deps do\n    [\n      {:elixir_drip, in_umbrella: true},\n      {:phoenix,\
  \ \"~> 1.3.0\"},\n      {:phoenix_pubsub, \"~> 1.0\"},\n      {:phoenix_ecto, \"\
  ~> 3.2\"},\n      {:phoenix_html, \"~> 2.10\"},\n      {:phoenix_live_reload, \"\
  ~> 1.0\", only: :dev},\n      {:gettext, \"~> 0.11\"},\n      {:cowboy, \"~> 1.0\"\
  }\n    ]\n  end\n  # ...\nend\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_94_0.png)\n\
  \nWe could have used the `mix phx.new elixir_drip -- umbrella` command to create\
  \ an umbrella project with both the `elixir_drip` and `elixir_drip_web` applications\
  \ in one fell swoop, with the first being able to interact with the database, using\
  \ Ecto, and the latter being a Phoenix web app. But with that approach, we would\
  \ miss all the fun. You now know what the `phx.new <project_name> -- umbrella` task\
  \ does behind the scenes.\n\nBy observing how easy it is to create an umbrella project\
  \ with several applications, you may be tempted to use this strategy by default\
  \ when bootstrapping your project. After all, it gives you a way to precisely define\
  \ your project boundaries and the concerns of each application, while keeping your\
  \ code under the same code repository.\n\nHowever, when resorting to an umbrella\
  \ project you should be aware that no circular dependencies between your applications\
  \ may exist, and version conflicts between your dependencies may also arise. Remember\
  \ that all dependencies, even the ones of the applications you depend on, are placed\
  \ in a common `deps` folder in the umbrella root. If one of your umbrella applications\
  \ depends on the version X of `utility` and the dependency `remote_dep`, fetched\
  \ from Hex, depends on the version Y of the same `utility`, you have a version conflict\
  \ and Mix won't be able to fix it for you. You can solve this type of conflict by\
  \ using the already mentioned `override` option.\n\nYou could also find yourself\
  \ creating a `common` or `core` umbrella application on which your other umbrella\
  \ applications will depend. However, the newly created `common` application may\
  \ not even need to live under the same umbrella project, since it is just a bundle\
  \ of modules with utility functions that do not belong anywhere else. In this case,\
  \ you may consider to create it as a completely separate project and import it as\
  \ a \"normal\" dependency (from its Git repository, or, even better, a Hex repository).\
  \ The first iteration of extracting that common logic from the project was to place\
  \ all those modules inside the `common` umbrella application. You can now easily\
  \ pull this umbrella application out of the project afterwards if you want to. If\
  \ you remember, an umbrella application is an independent and fully working Elixir\
  \ application in the first place.\n\nAt the end of the day, umbrella projects give\
  \ you more flexibility when deciding your project architecture. One of the main\
  \ benefits is that you don't need to change your code if you want to pull your application\
  \ from the umbrella afterwards. You may also decide further down the road that having\
  \ an umbrella project is overkill. In this case, you will have to merge all the\
  \ umbrella application modules and their dependencies into a single Elixir project,\
  \ being aware of how each application was previously started. For web-facing projects,\
  \ our recommendation is to create an umbrella project similar to what we did here:\
  \ one for the business logic and the other for the web interface. This way, we can\
  \ achieve a really concise and thin web layer, since its responsibility is solely\
  \ to call the service logic and present its results.\n\n![](img/c636f4cfb07f25f1db535995e50706ed_95_0.png)\n\
  \nKeep in mind that you should always be able to use every feature of your project\
  \ without having to pass through the web layer. This will only be possible if your\
  \ web interface is really thin. A good rule of thumb is to design your project in\
  \ a way that lets you use every feature from the comfort of an IEx session.\n\n\
  With the creation of our `elixir_drip` umbrella, we now have two of the umbrella\
  \ applications that will compose our project. In the next section, we will properly\
  \ introduce the project and its aspirations, and how its features will exemplify\
  \ the ideas demonstrated in the chapters ahead.\n\n## ElixirDrip – our showcase\
  \ application\n\nTo clearly illustrate how you may incorporate the concepts and\
  \ strategies in this book, we will develop a fully fledged web application named\
  \ ElixirDrip, which was kick-started by the umbrella project we have just created.\n\
  \nElixirDrip aims to be a fast and scalable web storage service, allowing the user\
  \ to easily store and share their files living on the cloud. Our users will be able\
  \ to upload files to their cloud storage and then share those files with other ElixirDrip\
  \ users.\n\nWe will be adding features to the ElixirDrip umbrella application as\
  \ we progress, taking it closer to our final goal with each chapter. The most important\
  \ features of our application will be tackled in specific chapters throughout this\
  \ book. Consider the following:\n\n- The design and implementation of our domain\
  \ model will be analyzed in Chapter 7, Persisting Data Using Ecto, when we talk\
  \ about data persistence and the usage of Ecto to efficiently query and update our\
  \ application data.\n- User account management and user authentication, along with\
  \ our web interface for files and folders, will be tackled in `Chapter 8`, *Phoenix\
  \ – a Flying Web Development Framework*.\n- The steps that apply to each processed\
  \ file, whether it is being uploaded or downloaded to or from ElixirDrip, will be\
  \ first defined with the **GenStage** behaviour in `Chapter 5`, *Demand-Driven Processing*.\
  \ We will implement the steps responsible for the remote media storage and for the\
  \ real-time notifications shown to the user.\n- Afterward, we will improve on the\
  \ previous steps definition by creating a **domain-specific language** (DSL) that\
  \ will better express how we process each file before reaching the cloud or being\
  \ downloaded. This will be done in `Chapter 6`, *Metaprogramming– Code That Writes\
  \ Itself*.\n- In `Chapter 8`, *Phoenix – a Flying Web Development Framework*, our\
  \ notification mechanism will be implemented. Every notification pushed to our users\
  \ will be delivered over Phoenix Channels, a fast and bi-directional way of communicating\
  \ with a Phoenix backend.\n- The correctness of our application will be put to test\
  \ in `Chapter 9`, *Finding Zen through Testing*, when we talk about testing best\
  \ practices, unit and integration testing.\n- We will create the ElixirDrip release\
  \ using **Distillery**, and then deploy and run it on the cloud with **Kubernetes**.\
  \ Every Elixir node deployed by us will be connected to its peers, improving the\
  \ performance of our application. We will discuss all of this and more in `Chapter\
  \ 10`, *Deploying in the Cloud*.\n- Our journey does not end with our application\
  \ serving live requests. We also need to make sure it stays healthy and that everything\
  \ runs smoothly. In `Chapter 11`, *Keeping an Eye on Your Processes*, we will implement\
  \ some best practices for monitoring and metric collection, ensuring we always stay\
  \ on top. Moreover, we will also learn how to profile and trace our application\
  \ while it's running in production.\n\nWe will keep the two already-created umbrella\
  \ applications, `elixir_drip` and `elixir_drip_web`. The first will be responsible\
  \ for the business logic, and the latter will be responsible for the web interface.\
  \ However, on the business logic side, we will create specific modules (let's call\
  \ them *contexts*) to aggregate related functionalities under a public interface.\
  \ One of those contexts is the `ElixirDrip.Storage` module, which will encapsulate\
  \ all media operations. The other context is the `ElixirDrip.Accounts` context,\
  \ which is responsible for user management and authentication.\n\n\n\n\n下图展示了 ElixirDrip\
  \ umbrella 应用的宏观视角：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_97_0.png)\n\n我们在用\
  \ Application 模块为 elixir_drip umbrella 应用定义应用模块回调时已经使用过 behaviour 概念。现在让我们了解其目的。\n\
  \n## 使用 behaviours\n\n我们项目的核心部分之一是如何代表用户在云端存储和检索文件。我们决定不将此组件放在其自己的 umbrella 应用下，因为可以在同一个\
  \ umbrella 应用下在 ElixirDrip 业务逻辑与其存储对应部分之间定义清晰的边界。为了实现关注点分离，我们将把所有存储逻辑封装在 ElixirDrip.Storage\
  \ 模块下。该模块将成为每个存储相关操作的单一入口点，同时封装实际的实现细节。\n\n我们将首先创建一个 StorageProvider behaviour，它定义了两个需要实现的回调，并依赖\
  \ typespecs 来指示每个回调的参数及其可能的返回值。behaviour 使我们能够建立每个存储提供者必须遵守的契约。来看一下：\n\n```\n$ cat\
  \ apps/elixir_drip/lib/elixir_drip/behaviours/storage_provider.ex\ndefmodule ElixirDrip.Behaviours.StorageProvider\
  \ do\n  @type path :: binary()\n  @type content :: bitstring()\n  @type reason ::\
  \ atom()\n  @type details :: map()\n\n  @callback upload(path, content) ::\n   \
  \   {:ok, :uploaded}\n      | {:error, reason}\n      | {:error, reason, details}\n\
  \  @callback download(path) ::\n    {:ok, content}\n  | {:error, reason}\n  | {:error,\
  \ reason, details}\nend\n```\n\n然后我们将用两个模块实现该 behaviour，即 `Local` 和 `Live` 模块，分别用于本地开发和生产环境。使用\
  \ behaviour 可确保我们的模块始终遵守相同的契约，无论是前面两个模块，还是我们在第 9 章《Finding Zen through Testing》中创建测试时用来伪造对提供者实际调用的\
  \ mock 模块。\n\n每个实现模块只需使用 `@behaviour` 模块属性来标注其实现的 behaviour。从现在开始，对于每个实现 behaviour\
  \ 的模块，编译器都会检查它是否以正确数量的参数实现了 behaviour 回调：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/providers/google_cloud_storage/local.ex\n\
  defmodule ElixirDrip.Storage.Providers.GoogleCloudStorageLocal do\n  @behaviour\
  \ ElixirDrip.Behaviours.StorageProvider\n\n  require Logger\n\n  def upload(path,\
  \ content) do\n    Logger.debug(\"Uploading #{inspect(byte_size(content))} bytes\
  \ to Google Cloud Storage, path: #{path}\")\n    {:ok, :uploaded}\n  end\n\n  def\
  \ download(path) do\n    Logger.debug(\"Downloading #{path} from Google Cloud Storage\"\
  )\n    {:ok, \"downloaded_content\"}\n  end\nend\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_98_0.png)\n\
  \n我们选择 Google Cloud Storage 作为 ElixirDrip 的存储提供者。由于其访问逻辑已通过 `StorageProvider` 自定义\
  \ behaviour 完全抽象化，未来可以轻松切换到其他存储提供者。这个假设的新提供者只需要遵守相同的 `StorageProvider` behaviour，因此需要同时实现\
  \ `upload/2` 和 `download/1` 回调。\n\n在 Local 或 Live 实现之间做出选择，只需调整全局或生产配置文件即可。这是一种常见模式，当我们想根据当前的\
  \ Mix 环境注入不同的模块时就会使用它：\n\n```\n$ cat apps/elixir_drip/config/config.exs\nuse Mix.Config\n\
  \  # ...\nconfig :elixir_drip,\n  storage_provider: ElixirDrip.Storage.Providers.GoogleCloudStorageLocal\n\
  \nimport_config \"#{Mix.env()}.exs\"\n```\n\n正如以下代码所示，在 prod.exs 配置中，我们指向 ElixirDrip.Storage.Providers.GoogleCloudStorageLive\
  \ 模块，该模块将实际与云存储提供者交互。由于此配置文件是在主 config.exs 配置文件之后导入的，它将覆盖之前的 storage_provider 配置项：\n\
  \n```\n$ cat apps/elixir_drip/config/prod.exs\nuse Mix.Config\n  # ...\nconfig :elixir_drip,\n\
  \  storage_provider: ElixirDrip.Storage.Providers.GoogleCloudStorageLive\n```\n\n\
  最后一步是创建通用的 ElixirDrip.Storage.Provider 模块，该模块将委托给由 :storage_provider 配置项指定的 StorageProvider\
  \ 实现。此模块通过将 Provider.upload/2 或 Provider.download/1 调用委托给 Application.get_env(elixir_drip,\
  \ :storage_provider) 配置返回的模块，从而将实际的存储提供者实现隐藏在调用者之外。\n\n因为我们使用了 defdelegate/2 宏，Elixir\
  \ 要求 @target 模块定义 upload/2 和 download/1 公共函数，否则委托将无法工作：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/provider.ex\n\
  defmodule ElixirDrip.Storage.Provider do\n  @moduledoc false\n\n  @target Application.get_env(:elixir_drip,\
  \ :storage_provider)\n\n  defdelegate upload(path, content), to: @target\n  defdelegate\
  \ download(path), to: @target\nend\n```\n\n之前，我们决定通过 `ElixirDrip.Storage` 模块公开所有与存储相关的函数，该模块代表我们的\
  \ `Storage` 上下文。因此，此上下文将依赖之前的 `ElixirDrip.Storage.Provider` 与我们的存储提供者交互。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_100_0.png)\n\
  \n如果我们不想让这个中间的 `ElixirDrip.Storage.Provider` 模块委托给实际的存储提供者模块，我们可以在消费者 `ElixirDrip.Storage`\
  \ 模块中直接从配置中获取 `Local` 或 `Live` 模块（即使用 `Application.get_env(:elixir_drip, :storage_provider)`）。\n\
  \n这个上下文在接下来的几章中会做更多的事情，但目前它只公开两个函数，`store/2` 和 `retrieve/1`，两者都依赖于通用的存储提供者：\n\n\
  ```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/storage.ex\ndefmodule ElixirDrip.Storage\
  \ do\n  alias ElixirDrip.Storage.Media\n  alias ElixirDrip.Storage.Provider\n\n\
  \  def store(%Media{} = media, content) do\n    media\n    |> generate_storage_key()\n\
  \    |> Map.get(:storage_key)\n    |> Provider.upload(content)\n  end\n\n  def retrieve(%Media{storage_key:\
  \ storage_key}) do\n    Provider.download(storage_key)\n  end\n\n  # ...\nend\n\
  ```\n\n我们现在将通过 `xref` 工具的视角来看待我们的 ElixirDrip 应用。\n\n## 使用 xref 查看交叉引用\n\n自 Elixir\
  \ 1.3 起，每次编译代码时，你也在使用 `xref` 来查找对不存在的模块和函数的调用。如果我们在 ElixirDrip 应用配置（`config/config.exs`）中指向的模块有拼写错误，我们会得到以下输出：\n\
  \n```\n$ mix clean && mix compile\n==> elixir_drip\nCompiling 10 files (.ex)\nwarning:\
  \ function ElixirDrip.Storage.Providers.Typo.upload/2 is undefined\n(module ElixirDrip.Storage.Providers.Typo\
  \ is not available)\nlib/elixir_drip/storage/provider.ex:6\n\nwarning: function\
  \ ElixirDrip.Storage.Providers.Typo.download/1 is undefined\n(module ElixirDrip.Storage.Providers.Typo\
  \ is not available)\nlib/elixir_drip/storage/provider.ex:7\n\nGenerated elixir_drip\
  \ app\n==> elixir_drip_web\nCompiling 11 files (.ex)\nGenerated elixir_drip_web\
  \ app\n```\n\n在幕后，编译器运行 mix xref warnings，这会产生这两个警告，告诉我们通用提供者正在将 upload/2 和 download/1\
  \ 函数委托给一个缺失的模块。\n\nxref 的另一个有用功能是 graph 模式，它通过打印应用依赖图来展示应用文件之间的依赖关系。让我们生成我们的 umbrella\
  \ 项目的依赖图：\n\n```\n$ mix xref graph --format dot\n==> elixir_drip\nGenerated \"xref_graph.dot\"\
  \ in the current directory. To generate a PNG:\n    dot -Tpng xref_graph.dot -o\
  \ xref_graph.png\n\nFor more options see http://www.graphviz.org/.\n==> elixir_drip_web\n\
  Generated \"xref_graph.dot\" in the current directory. To generate a PNG:\n    dot\
  \ -Tpng xref_graph.dot -o xref_graph.png\n\nFor more options see http://www.graphviz.org/.\n\
  ```\n\nxref 检测到我们有一个 umbrella 项目，因此它为每个 umbrella 应用生成了依赖图。\n\n\n\n如果我们查看下面针对业务逻辑应用的图表（此处为简洁起见已重新排列），可以观察到\
  \ application.ex 文件引用了 repo.ex 文件，我们本地的存储提供者实现指向了 StorageProvider behaviour，而我们的\
  \ Storage 上下文则同时指向 Storage.Media schema 和通用的提供者实现：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_102_0.png)\n\
  \n你还可以使用图模式来查看特定文件引用的所有文件，或引用给定文件的所有文件，分别使用 --source 或 --sink 选项。这在你需要重构现有代码库并想知道每个依赖于即将更改的文件的模块时尤其方便。以下是图模式应用于我们\
  \ umbrella 项目的两个示例。\n\n通过将相关的逻辑和模块封装在同一个上下文中，你的依赖图将显示出每个上下文的或多或少自包含的中心，该中心连接到它封装的所有资源：\n\
  \n```\n$ cd apps/elixir_drip\n$ mix xref graph --format dot --source lib/elixir_drip/storage/storage.ex\n\
  Generated \"xref_graph.dot\" in the current directory. To generate a PNG:\n    dot\
  \ -Tpng xref_graph.dot -o xref_graph.png\nFor more options see http://www.graphviz.org/.\n\
  ```\n\n通过使用 --source 选项运行 mix xref graph 命令，我们可以获取 lib/elixir_drip/storage/storage.ex\
  \ 文件引用的所有文件。在我们的例子中，我们发现它引用了两个文件，storage/media.ex 和 storage/provider.ex，这是有道理的，因为这两个文件定义的模块都位于\
  \ Storage 上下文下。上一个命令的结果也可以在前一个图表的底部看到，在那里可以看到 storage.ex 文件与这两个文件之间的关系。\n\n现在让我们通过向\
  \ mix xref 传递 --sink 选项来查找所有引用 media.ex 文件的文件：\n\n```\n$ cd apps/elixir_drip\n$\
  \ mix xref graph --format dot --sink lib/elixir_drip/storage/media.ex\nGenerated\
  \ \"xref_graph.dot\" in the current directory. To generate a PNG:\n\ndot -Tpng xref_graph.dot\
  \ -o xref_graph.png\n\nFor more options see http://www.graphviz.org/\n```\n\n通过要求\
  \ xref 显示每个使用 media.ex 文件的模块，我们观察到，目前只有 Storage 上下文文件使用它。这证实了我们的 storage/media.ex\
  \ 文件仅在它本应被使用在其中的上下文内部使用：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_103_0.png)\n\
  \n我们尚未查看 ElixirDripWeb 应用的文件依赖图，因为它是由 Phoenix 生成器自动创建的。然而，使用 xref 来快速浏览你正在深入的代码库确实很有价值。你会立即识别出具有通用逻辑并被几乎每个模块使用的模块，以及那些奇怪地孤立存在的模块。在这种情况下，请考虑是否真的想要保留它们。例如，如果你查看\
  \ ElixirDrip 的图，你会看到 lib/elixir_drip.ex 文件与所有其他文件断开连接。打开该文件，你会发现一个空模块，因此可以安全地删除它。\n\
  \n自 Elixir 1.6 版本起，xref Mix 任务还接受 --include-siblings 选项。传递该选项时，它会考虑项目的全部 umbrella\
  \ 依赖关系，因此它还会显示不同 umbrella 应用中模块之间的相互依赖关系。\n\n我们现在将查看一些可用于确保每个 Elixir 代码库保持可读并遵守既定最佳实践的工具。\n\
  \n## 采用一致的编码风格\n\n在项目启动期间，最重要的步骤之一就是决定如何构建项目。这里做出的选择将从长远来看影响你如何维护和演进你的应用。静态代码分析工具的使用也有助于提高项目维护的便捷性，让你能够尽快捕获错误、语法错误和奇怪的代码风格。\n\
  \n在这里，我们将配置 Credo 来分析我们的代码，查找可能的重构、常见错误和不一致之处，然后使用 Elixir 1.6 格式化程序格式化应用的所有代码。\n\
  \n我们不想在生产环境中运行静态分析工具，因此我们只会将 Credo 添加为 dev 和 test 环境的依赖。我们还将通过将其 runtime 选项设置为 false\
  \ 来确保在运行项目时 Credo 保持不动。这样 Mix 就知道 Credo 不是运行时应用，因此不会尝试启动它。看一下这个：\n\n```\n$ cat mix.exs\n\
  defmodule ElixirDrip.Umbrella.Mixfile do\n  use Mix.Project\n  # ...\n  defp deps\
  \ do\n    [\n      {:credo, \"~> 0.3\", only: [:dev, :test], runtime: false}\n \
  \   ]\n  end\nend\n```\n\n在使用 mix do deps.get, deps.compile 获取并编译依赖项后，我们现在可以运行 mix\
  \ credo，因为其安装添加了一个新的 Mix 任务：\n\n```\n$ mix credo\nChecking 36 source files ...\n\
  ```\n\n```\nCode Readability\n| [R] → Modules should have a @moduledoc tag.\n| apps/elixir_drip_web/lib/elixir_drip_web/application.ex:1:11\n\
  #(ElixirDripWeb.Application)\n\nPlease report incorrect results: https://github.com/rrrene/credo/issues\n\
  \nAnalysis took 0.5 seconds (0.3s to load, 0.1s running checks)\n54 mods/funs, found\
  \ 1 code readability issue.\n```\n\nCredo 告诉我们缺少 ElixirDripWeb.Application 模块的文档。对于上一次执行，我们使用了\
  \ Credo 随附的默认配置。然而，建议为每个项目提供一个配置文件，以确保每个项目都根据相同的静态分析标准进行检查，而不论代码在哪里分析。我们可以使用 credo.gen.config\
  \ Mix 任务生成本地配置文件：\n\n```\n$ mix credo.gen.config\n* creating .credo.exs\n\n$ cat\
  \ .credo.exs\n%{\n  configs: [\n    %{\n      checks: [\n        {Credo.Check.Readability.ModuleDoc},\n\
  \      ]\n      # ...\n    }\n  ]\n}\n```\n\n在生成的配置文件中，除了其他多个检查之外，还存在 ModuleDoc\
  \ 检查，它检测没有文档的模块。如果我们通过在其检查元组后附加 false 来禁用此检查，Credo 将停止查找没有文档的模块，从而在我们的项目中找不到任何问题：\n\
  \n```\n$ mix credo\nChecking 36 source files ...\n\nPlease report incorrect results:\
  \ https://github.com/rrrene/credo/issues\n\nAnalysis took 0.5 seconds (0.3s to load,\
  \ 0.1s running checks)\n54 mods/funs, found no issues.\n```\n\n目前，我们将保留生成的配置文件。为了阻止\
  \ Credo 因不存在的模块文档而报告问题，我们需要将有问题的模块的 @moduledoc 属性设置为 false。通过这种方法，我们表示 ElixirDripWeb.Application\
  \ 不需要定义模块文档，因此 ExDoc（负责为项目生成文档的工具）不会在模块内部查找它。这样，Credo 也不会抱怨模块缺少文档。\n\n我们不仅希望将常见错误和不一致之处排除在代码库之外，还希望在整个代码中保持一致的风格。这里的目标是拥有看起来像是出自一人之手的代码。Credo\
  \ 包含一个风格指南，因此可以通过使用 --strict 选项运行它来检查源代码是否采用一致的代码风格。\n\n然而，我们将改用在 Elixir 1.6 版本中引入的代码格式化程序。这主要是因为所有核心\
  \ Elixir 代码库都已使用此新工具进行格式化（查看 https://github.com/elixir-lang/elixir/issues/6643），因此它很快将成为事实上的标准。\n\
  \nElixir 格式化程序可用于格式化一个或多个 Elixir 文件，例如 mix format path/to/elixir/source1.ex path/to/source2.ex。或者，项目的根文件夹可以有一个\
  \ .formatter.exs 配置文件，指示应格式化哪些文件。在这里我们将采用后一种方法，通过指向所有 Elixir 文件：\n\n```\n$ cat .formatter.exs\n\
  [\n  inputs: [\n    \"mix.exs\",\n    \"apps/*/{config,lib,test}/**/*.{ex,exs}\"\
  \n  ]\n]\n```\n\n在之前的配置中，该配置位于 umbrella 项目的根目录，我们正在告诉格式化程序格式化 mix.exs 以及我们在每个 umbrella\
  \ 应用中 config、lib 和 test 文件夹内存在的所有 Elixir 文件。\n\n在 umbrella 项目内部运行 mix format 后，我们可以看到\
  \ elixir_drip 和 elixir_drip_web 两个 umbrella 应用中的文件都发生了更改。请记住，我们借助 Phoenix 提供的 Mix\
  \ 任务生成了我们的 umbrella 应用，因此格式化程序更改的代码之前已为我们自动生成。\n\n\n\n以下是运行 `mix format` 时被格式化的项目文件列表：\n\
  \n```\n$ git status\n# ...\nmodified: apps/elixir_drip/config/config.exs\nmodified:\
  \ apps/elixir_drip/lib/elixir_drip/application.ex\nmodified: apps/elixir_drip/test/test_helper.exs\n\
  modified: apps/elixir_drip_web/config/config.exs\nmodified: apps/elixir_drip_web/config/dev.exs\n\
  modified: apps/elixir_drip_web/lib/elixir_drip_web.ex\nmodified: apps/elixir_drip_web/lib/elixir_drip_web/application.ex\n\
  modified: apps/elixir_drip_web/lib/elixir_drip_web/channels/user_socket.ex\nmodified:\
  \ apps/elixir_drip_web/lib/elixir_drip_web/controllers/page_controller.ex\nmodified:\
  \ apps/elixir_drip_web/lib/elixir_drip_web/endpoint.ex\nmodified: apps/elixir_drip_web/lib/elixir_drip_web/router.ex\n\
  modified: apps/elixir_drip_web/lib/elixir_drip_web/views/error_helpers.ex\nmodified:\
  \ apps/elixir_drip_web/lib/elixir_drip_web/views/error_view.ex\nmodified: apps/elixir_drip_web/test/elixir_drip_web/controllers/page_controller_test.exs\n\
  modified: apps/elixir_drip_web/test/elixir_drip_web/views/error_view_test.exs\n\
  modified: apps/elixir_drip_web/test/support/channel_case.ex\nmodified: apps/elixir_drip_web/test/support/conn_case.ex\n\
  modified: apps/elixir_drip_web/test/test_helper.exs\nmodified: mix.exs\n```\n\n\
  ![](img/c636f4cfb07f25f1db535995e50706ed_107_0.png)\n\n在前面的代码片段中，以及下面的段落中，我们使用 `git`\
  \ 来检查哪些文件被格式化程序更改过；请随意使用最适合你的工具。\n\n生成后的代码由格式化程序保证有效，但尽管如此，我们仍可以看到许多风格上的变化。如果我们观察\
  \ `elixir_drip` 应用中 `config/config.exs` 的更改，可以看到格式化程序为 `Mix.env` 函数调用添加了空括号：\n\n\
  ```\n$ git diff apps/elixir_drip/config/config.exs\n# ...\nconfig :elixir_drip,\
  \ ecto_repos: [ElixirDrip.Repo]\n\n-import_config \"#{Mix.env}.exs\"\n+import_config\
  \ \"#{Mix.env()}.exs\"\n```\n\n在同一个 umbrella 应用中，你可以看到定义应用回调模块的 application.ex 文件中的更改。格式化程序更改了启动数据库仓库监督器代码部分的缩进。如你所见，`Supervisor.start_link`\
  \ 调用现在跨越七行，但可以说比以前更易读：\n\n```\n$ git diff apps/elixir_drip/lib/elixir_drip/application.ex\n\
  # ...\n  def start(_type, _args) do\n    import Supervisor.Spec, warn: false\n-\
  \   Supervisor.start_link([\n-     supervisor(ElixirDrip.Repo, []),\n-   ], strategy:\
  \ :one_for_one, name: ElixirDrip.Supervisor)\n+   Supervisor.start_link(\n+    \
  \ [\n+       supervisor(ElixirDrip.Repo, []),\n+     ],\n+     strategy: :one_for_one,\n\
  +     name: ElixirDrip.Supervisor\n+   )\n  end\nend\n```\n\n这些只是格式化程序所执行工作的一些具体示例。自动代码格式化在许多其他语言中也发挥着作用（例如\
  \ Go 编程语言）。它旨在使代码更易于编写、更易于学习、阅读和审查，也更易于维护。\n\n让我们通过创建一个 lint Mix 别名来结束这一部分，当我们执行\
  \ mix lint 时，它会一步运行格式化程序和 Credo。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_108_0.png)\n\
  \n为了执行我们的静态分析规则，你甚至可以创建一个自动运行 mix lint 的方法。如果你使用 git，可以创建一个 pre-commit 钩子来运行格式化程序，并且只有在格式化程序未更改任何文件且\
  \ Credo 未报告任何问题时才允许你继续。\n\n从这段代码可以看出，当我们执行 mix lint 时，format 和 credo 任务都会被运行。请注意，这些别名不会出现在\
  \ mix help 返回的列表中：\n\n```elixir\n$ cat mix.exs\ndefmodule ElixirDrip.Umbrella.Mixfile\
  \ do\n  use Mix.Project\n\n  def project do\n    [\n      # ...\n      aliases:\
  \ aliases()\n    ]\n  end\n\n  defp deps do\n    [\n      # ...\n    ]\n  end\n\n\
  \  defp aliases do\n    [\n      \"lint\": [\"format\", \"credo\"]\n    ]\n  end\n\
  end\n```\n\n这个别名定义只是一个示例，用来展示定义自己的别名是多么容易。如果你需要从头创建一个 Mix 任务，可以定义一个名称以 Mix.Tasks.\
  \ 前缀开头的模块。该模块需要使用 Mix.Task 模块并定义一个 run/1 函数：\n\n```elixir\ndefmodule Mix.Tasks.MyCustomTask\
  \ do\n  use Mix.Task\n\n  def run(_args), do: IO.puts(\"Hello from custom task\"\
  )\nend\n```\n\n在本书后面，当我们分析项目发布时，我们将看到如何创建完全不依赖 Mix 的自定义任务。\n\n## 摘要\n\n在本章中，我们从不同角度审视了一个\
  \ Elixir 项目。在 Elixir 随附的多功能 Mix 工具的陪伴下，我们以两个 umbrella 应用启动了我们的 ElixirDrip umbrella\
  \ 项目作为本章的结束。这里我们讨论的关键思想是：\n\n- 一个 Elixir 应用定义了一个应用回调函数，当 VM 启动任何项目时会被调用，例如其他语言的\
  \ `main` 入口点。如果你不需要启动你的应用，就不需要实现回调函数。在这种情况下，你的代码将只是一个没有状态的模块和函数的简单集合。\n- Mix `compile`\
  \ 任务将我们的代码编译为 BEAM 字节码，并将每个模块放置在扁平的文件夹结构下，自动为我们的项目创建 `.app` 文件，以便 VM 知道如何启动每个所需的应用。\n\
  - 一个 Elixir 项目由一个 `mix.exs` 文件和三个文件夹 `config`、`lib` 和 `test` 组成。创建项目后，你可以开箱即用地管理配置值、运行测试套件，以及设置和获取项目依赖。\n\
  - 无论你的依赖来自何处，Mix 都允许你从 Hex.pm、你的代码仓库、本地路径，甚至另一个 umbrella 应用获取依赖。\n- umbrella 项目让你能够在同一个\
  \ Elixir 项目下轻松拥有多个应用。我们使用 Phoenix 提供的 Mix 任务生成了我们的业务逻辑和面向 Web 的 umbrella 应用。\n-\
  \ ElixirDrip，一个 Web 存储服务，将在整本书中作为 umbrella 项目开发。它将作为我们探索的许多概念的孵化器。\n- 为了避免被单一存储提供商束缚，我们使用\
  \ Elixir behaviours 来抽象使用特定提供商的实现细节。\n- 可维护性和可读性是任何项目的必备品质。为了让 ElixirDrip 符合我们的标准，我们使用了\
  \ Credo 和 Elixir 1.6 格式化程序作为静态分析工具。\n\n在下一章中，我们将通过查看从 Erlang 借鉴的基本概念来弄清楚 Elixir\
  \ 如何实现其并发和容错特性。对这些想法的扎实理解将带来回报，因为 Elixir 背后的概念模型与命令式语言的世界显著不同。你将再也不会以同样的方式看待面向对象语言了！\n"
- "# 3 进程 – 并发和容错的基石\n\n在学会如何在 Elixir 中创建新项目之后，我们现在将深入 Elixir 的一个基石之一（继承自 Erlang）：**进程**。理解如何使用它们对于在\
  \ Elixir 中创建并发和容错应用至关重要。你的典型应用很容易包含数百个，如果不是数千个并发运行的进程。\n\n如果上一句话让你担心在单台机器上运行数千个进程，请注意我们指的是\
  \ Erlang VM 进程，它们比 **操作系统 (OS)** 进程轻量得多。在本章以及整本书中，*进程* 指的是 Erlang VM 进程——除非我们直接提到\
  \ OS 进程。\n\n在本章中，我们将涵盖以下主题：\n\n- Erlang VM 的内部工作原理和并发模型\n- 创建进程并在它们之间传递消息\n- 使用进程维护状态\n\
  - 构建我们 ElixirDrip 应用的组件之一 – 缓存工作进程\n- 使用监督器使我们的应用具有容错性\n- 构建监督树以在错误恢复中获得更高的粒度\n\n\
  \n\n\n## BEAM 内部\n\nErlang VM 通常被称为 **BEAM（博格丹/比约恩的 Erlang 抽象机）**。它被设计用于运行高度可靠的系统，这些系统通常具有多位九的可用性，并且几乎总是能够响应客户端请求。我们现在将研究\
  \ BEAM 背后的一些设计决策，以及它们如何实现此类系统的创建和部署。\n\n进程是 BEAM 内部并发执行的单元。正如本章所述，它们是实现可扩展、健壮、容错系统创建的构建块。在深入探讨使用进程时的一些运行时注意事项之前，让我们先探索进程之间如何相互交互。\n\
  \n关于 BEAM 是否是卡尔·休伊特在 1970 年代描述的 actor 模型的合法实现，存在很多讨论。Erlang 的共同创建者 Robert Virding\
  \ 反复表示，在开发 Erlang 期间，他们偶然得到了一个类似于 actor 模型的实现，直到 much later 才真正了解 actor 模型本身。不管怎样，术语\
  \ *参与者* 在 Elixir/Erlang 社区中并不广泛使用——我们主要只是使用术语 *进程*。\n\nBEAM 中的每个进程都维护自己的私有状态，该状态永远不能与其他进程共享。进程通过异步消息传递进行通信，每个进程都有自己的邮箱，用于存储发送给该进程的消息。在接收到消息后，进程可以仅通过执行某些计算来回复它，向其他进程发送消息，生成新进程，或更改其自身内部状态。从邮箱中入队和出队消息是原子的，并且进程按顺序处理它们。\n\
  \n要向进程发送消息，您必须知道其 PID（一种基本类型，正如我们在 *第 1 章，准备踏上旅程* 中学到的）或其注册别名。进程也可以向自身发送消息，这将在其自己的邮箱中创建一个新消息，并在将来处理。从一个参与者发送到另一个参与者的消息保证在接收者的邮箱中保持其顺序，但请注意，由多个进程发送的多个消息的交错在接收者端是不确定的，您绝不应依赖它。\n\
  \n处理传入消息时，进程可以使用模式匹配。借助此机制，我们可以构建进程，使其监听、过滤特定类型的消息，或根据消息不同而不同地表现。\n\n如前所述，消息传递是异步的，但仅从发送者角度来看——在接收消息时，进程会被阻塞，等待邮箱中的新消息，正如我们在下一节中将进一步解释的那样。\n\
  \n虽然这种隔离、无共享的进程模型可能会引起一些性能问题，因为每条交换的消息都必须深度复制，但它也带来了一些令人难以置信的好处，例如：\n\n- 构建并发应用程序很容易。由于没有共享状态，因此不需要互斥锁或信号量。进程并发运行（如果至少有两个\
  \ CPU 核心，则可能并行运行），让您充分利用硬件。\n- 进程崩溃后可以立即被替换。正如我们将在本章后面学到的，我们可以拥有仅负责监督其他进程的进程，并在它们宕机时采取特定操作。同样，由于没有共享状态，某个进程的崩溃在大多数情况下只需重新启动即可解决。\n\
  - 没有 Stop-the-World 垃圾回收。由于每个进程都维护自己的堆，垃圾回收发生在进程级别。此外，当进程退出时，其内存空间可以简单地被回收。垃圾回收不会停止整个\
  \ VM，这意味着当某个进程因垃圾回收而停止时，您的进程仍可以继续回复请求。\n- 分布式和水平扩展非常简单。鉴于进程是隔离的，您可以通过增加计算能力来扩展应用程序，这反过来又增加了创建更多进程的能力。凭借\
  \ BEAM 的出色工作，与本机上的进程或集群中其他机器上的进程通信几乎是相同的。\n\n正如我们之前所建议的，BEAM 内部的进程非常轻量级，可以以最小的开销生成或销毁。通常，创建新进程只需要几微秒，而其初始内存使用量在\
  \ 1 到 2 KB 之间。为了便于理解，默认情况下，在 Linux x86 系统上，一个线程仅用于栈就使用 2 MB。这使您可以在单台机器上运行数百万个进程。\n\
  \nBEAM 在单个操作系统进程上运行，然后根据可用核心数量，默认情况下在该进程下生成线程。每个线程将运行一个调度程序，该调度程序将抢占式地管理每个进程的 CPU\
  \ 时间。BEAM 是一个软实时系统，这种抢占式调度促进了公平性和活性。\n\n这样，长时间运行的 CPU 密集型进程不会影响其他进程的性能。想象一下，在这种模型中运行\
  \ HTTP 服务器，其中每个请求由不同的进程处理。如果某个客户端的请求需要更长时间才能响应，它不会影响 HTTP 服务器的其他用户，保持系统对大多数用户保持活跃。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_114_0.png)\n\n我们已经说过，您可以在 BEAM 内部运行数百万个进程，但默认情况下，其上限约为\
  \ 256,000。您可以通过在启动 `elixir` 或 `iex` 时使用 `--erl` 标志传递选项来增加此限制，例如：`iex --erl \"+P\
  \ 10000000\"`。`+P` 选项控制 BEAM 内部同时进程的最大数量。您可以在 http://erlang.org/doc/man/erl.html\
  \ 查看其他选项。\n\n大多数程序员都知道构建并发应用程序是一项艰苦的工作。经常情况下，使应用程序并发不仅被延迟，有时还是最后的手段，并且在性能要求没有其他解决方案时才进行。这可能是因为他们知道这是一些可怕且难以找到的\
  \ bug 的来源，并且通常这种更改使程序更难推理。\n\n虽然对于传统的并发原语（如线程）来说这是正确的，但我们想说明对于 BEAM 进程来说并非如此。Erlang\
  \ 的共同创建者 Joe Armstrong 在谈论 Erlang 时偶尔会使用一个非常有趣的表达：并发导向编程。其哲学是并发应该从一开始就融入我们的程序中，并且它是分布式和容错的基础。\n\
  \n好了，理论够多了！让我们现在探索如何使用 BEAM 进程。\n\n## 使用进程\n\n在了解了 BEAM 内部进程的工作概念模型后，我们现在将了解如何使用它们。具体来说，我们将介绍如何使用进程、如何在它们之间传递消息，并且为了展示如何使用进程来维护状态，我们将构建\
  \ ElixirDrip 应用的一个组件，即缓存工作进程。\n\n## 创建进程\n\n您通过调用 Kernel.spawn/1 函数来创建进程，该函数接收一个无参数的匿名函数：\n\
  \n```\niex> self()\n#PID<0.85.0>\niex> spawn(fn ->\n...>   :timer.sleep(2000)\n\
  ...>   IO.puts \"I'm running in process #{inspect(self())}\"\n...> end)\n#PID<0.91.0>\n\
  I'm running in process #PID<0.91.0>\n```\n\n在此示例中，我们首先调用 self()，它返回当前进程的 PID。在这种情况下，它返回了\
  \ shell 进程的 PID。然后，我们使用 spawn 函数创建新进程。如前所述，它接收一个将在新创建的进程中运行的匿名函数。我们传递给 spawn 的匿名函数使用\
  \ timer Erlang 库休眠两秒，然后使用 IO 模块的 puts 函数将字符串打印到终端。该字符串打印当前进程的 PID。从前面的输出可以看出，当直接从\
  \ IEx 调用 self() 时，我们得到其 PID <0.85.0>，但打印到终端的字符串显示的是 <0.91.0> PID——即由 spawn 函数创建的进程的\
  \ PID。请注意，此函数的返回值是刚刚创建的进程的 PID，这将在我们开始在进程之间传递消息时变得很重要。\n\n另一个需要指出的重要方面是，spawn 函数的调用者在进程创建后立即恢复其工作。我们在匿名函数中引入了\
  \ sleep，以便轻松观察此行为。如果您在 IEx 会话中运行此示例，您会看到在调用 spawn 后立即返回 shell——这意味着 shell 进程已完成创建新进程并准备接收输入。然后，大约两秒后，您会看到我们之前讨论的字符串被打印到屏幕上。这意味着\
  \ sleep 仅发生在新进程上，而 spawn 的调用者在更早时就被解除阻塞了。\n\n现在让我们看一些更有趣的东西。在下面的示例中，我们将把在外部作用域中定义的变量传递给新创建的进程：\n\
  \n```\niex> x = 4\n4\niex> spawn(fn ->\n...>   x = x * x\n...>   IO.puts \"The number\
  \ squared is #{x}\"\n...> end)\n```\n\n\n\n```\nThe number squared is 16\n#PID<0.109.0>\n\
  iex> x\n4\n```\n\n我们首先创建一个变量 x，将其绑定到 4。然后，我们像前面的示例一样使用 spawn，并创建一个新进程，该进程将接收此变量并对其进行平方。注意，在这个新进程中我们重新绑定了\
  \ x，然后打印其新值。由于 x 为 4，因此看到控制台打印出 16 是合理的。然而请注意，之后在 shell 进程中，我们打印 x 的值，它仍然是 4。外部作用域中的变量通过闭包机制传递给在新进程上运行的匿名函数，我们在第\
  \ 1 章《为旅程做好准备》中见过这一点。由于进程不共享内存，匿名函数引用的变量会被深度复制，新进程中对 x 的重新绑定不会影响 shell 进程中定义的 x。\n\
  \n通常，我们不仅对生成新进程感兴趣，还希望在稍后阶段收集其结果。现在让我们看看消息传递，并了解如何实现这一点。\n\n## 进程之间的消息传递\n\n在初次接触\
  \ Elixir 之后，当我们开始构建具有一定复杂度的应用程序时，我们经常需要并发进程相互协作。如前所述，进程不共享内存——它们通过相互传递消息进行通信。这些消息包含\
  \ Elixir 项——基本上任何可以存储在变量中的内容都可以作为消息发送。\n\n发送消息的本质是将它存储在接收者的邮箱中。进程的邮箱是无界的——然而，实际上它受可用内存的限制。现在让我们通过向\
  \ shell 进程自身发送一条消息来实际操作一下。要发送消息，可以使用 Kernel.send/2 函数，将进程 ID 作为第一个参数，消息本身作为第二个参数：\n\
  \n```\niex> send(self(), \"hey, I'm messaging myself\")\n\"hey, I'm messaging myself\"\
  \n```\n\n在此，我们使用 Kernel.self/0 函数获取自己的 PID，从而将此消息发送到自己的邮箱。请记住消息传递是异步的，send 的调用者在将消息放入接收者的邮箱后立即恢复执行。现在\
  \ shell 进程的邮箱中有一条消息。要获取它，我们使用 receive 构造：\n\n```\niex> receive do\n...>  message\
  \ -> IO.puts message\n...> end\nhey, I'm messaging myself\n:ok\n```\n\n如你所见，receive\
  \ 能够从邮箱中获取我们之前发送的消息，并且该消息本身被打印到 shell 中。如果你只想处理特定类型的消息，可以在提供给 receive 的子句上使用模式匹配：\n\
  \n```\niex> send(self(), {:result, 2+2-1})\n{:result, 3}\niex> receive do\n...>\
  \  {:result, result} -> IO.puts \"The result is #{result}\"\n...> end\nThe result\
  \ is 3\n:ok\n```\n\n此示例与之前显示的示例类似，但现在我们只从邮箱中获取第一个元素为 :result 原子的、由两个元素组成的元组消息。需要指出的是，如果一条消息与\
  \ receive 块中的任何子句都不匹配，它将保留在邮箱中以便稍后处理。这意味着如果一个进程频繁接收到在 receive 块中永远不匹配的消息，其邮箱将无限增长，这最终可能导致\
  \ BEAM 因内存使用过度而崩溃。为避免此问题，可以提供一个始终匹配的子句，以防止邮箱失控增长：\n\n```\niex> send(self(), {:other_result,\
  \ 3+3-2})\n{:other_result, 4}\niex> receive do\n...>  {:result, result} -> IO.puts\
  \ \"The result is #{result}\"\n...>  _ -> {:error, :unexpected_message}\n...> end\n\
  {:error, :unexpected_message}\n```\n\n这样，_ 将匹配未在之前子句中匹配的消息，为该消息提供响应并将其从邮箱中移除。然后，我们返回一个错误元组，该元组还可以包含报告（无论是日志还是错误跟踪系统），以便以后可以分析它，并可能追踪意外消息的来源。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_118_0.png)\n\n在 IEx 会话中进行开发和/或调试时，使用\
  \ `IEx.Helpers.flush/0` 函数可能会有所帮助，该函数将 shell 进程邮箱中的所有消息移除并打印到终端。\n\n如我们所见，`receive`\
  \ 将从进程的邮箱中获取一条消息，并尝试将其与提供的子句匹配。到目前为止，我们只在向 shell 进程发送消息后才调用 `receive`。如果我们用空邮箱调用它，`receive`\
  \ 将阻塞，等待消息：\n\n```\n```elixir\niex> receive do\n...>   message -> IO.puts \"Message\
  \ is #{message}\"\n...> end\n```\n```\n\nshell 现在被阻塞了，你必须手动终止它（例如按 `Ctrl-\\`）。如果邮箱中有未匹配任何提供子句的消息，我们会观察到相同的行为。如果我们不希望\
  \ `receive` 无限期地等待消息，可以提供一个 `after` 子句，指定 `receive` 等待的时间（以毫秒为单位）：\n\n```\n```elixir\n\
  iex> receive do\n...> message -> IO.puts \"Message is #{message}\"\n...> after\n\
  ...> 2000 -> IO.puts \"Timed out. No message received in 2 seconds.\"\n...> end\n\
  Timed out. No message received in 2 seconds.\n:ok\n```\n```\n\n正如你在第一章中学到的那样，Elixir\
  \ 中的一切都是表达式。与 `case` 构造发生的情况类似，`receive` 的返回值是已执行子句中最后一个表达式的结果。\n\n我们将以一个更复杂的示例结束本节。现在我们知道如何创建进程，也知道如何在它们之间传递消息，让我们把这一切联系起来，同时展示并发运行进程的一些优势。\n\
  \n首先，让我们定义一个匿名函数，它通过休眠半秒来象征一个长时间运行的计算：\n\n```\n```elixir\niex> long_running_computation\
  \ = fn number ->\n...> :timer.sleep(500)\n...> \"result for #{number}\"\n...> end\n\
  #Function<6.99386804/1 in :erl_eval.expr/5>\n```\n```\n\n它接收一个数字作为参数，表示将要应用长时间运行计算的数字。为了后续比较，让我们创建一个包含\
  \ 1 到 50 的整数的列表，并在此列表的每个元素上运行此长时间计算。现在，我们将使用 Enum.map/2 顺序执行：\n\n```\n```elixir\n\
  iex> computation_results = fn ->\n...> (1..50)\n...> |> Enum.map(long_running_computation)\n\
  ...> end\n#Function<20.99386804/0 in :erl_eval.expr/5>\n```\n```\n\n我们将其定义在匿名函数内部，以便可以使用\
  \ timer Erlang 模块中的 tc 函数检查执行所需的时间，如下所示：\n\n```\n```elixir\niex(3)> :timer.tc(computation_results,\
  \ [])\n{25063563,\n[\"result for 1\", \"result for 2\", \"result for 3\", \"result\
  \ for 4\",\n\"result for 5\", \"result for 6\", \"result for 7\", \"result for 8\"\
  , ...]}\n```\n```\n\n此函数返回一个元组，第一元素为执行时间（以微秒为单位），第二元素为被计时函数的执行结果。注意，出于简洁考虑，函数的执行结果被裁剪，但它包含到第\
  \ 50 个元素的结果。如我们所见，顺序版本大约花费了 25 秒，这很容易解释，因为对列表中的每个元素都发生了 50 次半秒的休眠。\n\n由于我们现在知道如何生成进程并与之通信，让我们对列表中的每个元素并发地执行此计算，为每个元素生成一个进程，然后在之后聚合结果。\n\
  \n首先，让我们定义一个函数来接收发送到 shell 进程的消息：\n\n```\n```\niex> fetch_result = fn ->\n... >\
  \ receive do\n... > {:computation_result, result} -> result\n... > _ -> {:error,\
  \ :unexpected_message}\n... > end\n... > end\n#Function<20.99386804/0 in :erl_eval.expr/5>\n\
  ```\n```\n\n此函数将从邮箱中获取一条消息。如果该消息格式符合预期，我们返回结果本身。对于任何不匹配我们期望格式的消息，我们只返回一个错误元组。现在让我们在并发版本中使用此匿名函数：\n\
  \n```\n```\niex> me = self()\n#PID<0.85.0>\niex> concurrent_computation_results\
  \ = fn ->\n... > (1..50)\n... > |> Enum.map(&(spawn(fn -> send(me, {:computation_result,\n\
  long_running_computation.(&1)})) end))\n... > |> Enum.map(fn _ -> fetch_result.()\
  \ end)\n... > end\n#Function<20.99386804/0 in :erl_eval.expr/5>\n```\n```\n\n让我们分解这个示例，因为这段代码非常密集。我们首先将当前进程的\
  \ PID 绑定到 me。这很重要，因为我们稍后会在 spawn 函数内部使用它，以便新进程知道其调用者的 PID 并发送回响应。我们取 50 个整数的列表，并为每个整数创建一个进程。每个进程随后会向其调用者（使用\
  \ me 变量）发送一条消息，每条消息的内容都是一个包含两个元素的元组：第一个只是标识消息用途的原子；第二个是执行长时间运行计算的结果，我们将列表中当前整数元素作为参数传递给它。在最后两个片段中，你可以看到进程的创建和它们之间的消息传递的实际操作！\n\
  \n现在让我们计时此版本的执行：\n\n```\n```\niex> :timer.tc(concurrent_computation_results, [])\n\
  {513566,\n[\"result for 1\", \"result for 2\", \"result for 3\", \"result for 9\"\
  ,\n\"result for 4\", \"result for 10\", \"result for 5\", \"result for 6\", ...]}\n\
  ```\n```\n\n\n\nAs we can see, the execution time dropped drastically, to nearly\
  \ half a second. This result was obtained in a quad-core machine. This example is\
  \ a bit synthetic (since the processes are just sleeping and returning a result),\
  \ so the important takeaway is not from the absolute values, but the concept itself.\
  \ Imagine that these processes are not sleeping but doing some sort of request to\
  \ an external system (a third-party API, for instance). In this case, the process\
  \ is idle for a long time as well, and you can reap great benefits from parallelizing\
  \ its execution.\n\nHowever, note that sometimes you can over-parallelize. For instance,\
  \ if you want to calculate the square of each number in our integers list, you'd\
  \ be better off doing it sequentially in one process. The overhead of creating the\
  \ processes and then aggregating the results will make the parallel approach slower\
  \ than the single-process one. The best solution depends on the computation we're\
  \ aiming to parallelize, and this trade-off should be taken into account when architecting\
  \ your program.\n\nWhat we've achieved here is essentially a parallel map, and we\
  \ can easily change its purpose by plugging in different anonymous functions. However,\
  \ in practice, you don't have to create processes with `spawn` to parallelize your\
  \ programs—you can use the abstractions Elixir provides, for instance the `Task`\
  \ module, which will be covered in the next chapter. It's also noteworthy to point\
  \ out that by running our computation concurrently, we have lost the original order\
  \ when aggregating the results, as they arrive in a non-deterministic order. This\
  \ is observable in the response from the preceding example, where the result for\
  \ 9 comes in fourth place. If the order of the results matters, one possible solution\
  \ would be to have some logic to sort the results properly when aggregating them.\n\
  \nHaving seen how we can exchange messages between processes, it's now time to see\
  \ how we can use processes to maintain state in our applications.\n\n## Building\
  \ a cache worker\n\nProcesses in Elixir aren't solely used to run certain tasks\
  \ concurrently. Often, they are also used as entities that maintain state. These\
  \ processes frequently run for a long time (or possibly forever), and know how to\
  \ handle a certain type of requests. Via message passing, other processes can query\
  \ and/or modify the internal state of these processes. These types of processes\
  \ are frequently called **Server Processes.**\n\nAs we stated at the beginning of\
  \ this chapter, inside the BEAM, a process is the unit of concurrent execution.\
  \ This means that multiple server processes may run concurrently, which is important\
  \ for scalability and fault tolerance.\n\nLet's remind you that there's no `loop`\
  \ construct in Elixir. As we've depicted in `Chapter 1`, *Preparing for the Journey\
  \ Ahead*, looping in Elixir is always done through recursion. The same holds true\
  \ for making processes run in a loop–you use recursion. Particularly, we have to\
  \ use endless-tail recursion, to ensure that no additional memory is consumed as\
  \ a result of the process calling itself over and over again. If the last thing\
  \ a function does is call another function, or itself, the usual stack push doesn't\
  \ occur and instead a simple jump is performed. This means that using tail recursion\
  \ won't consume any additional memory or cause a stack overflow.\n\nWhen iterating\
  \ through an enumerable, we don't need to code the recursion ourselves, we simply\
  \ use abstractions provided by the language. Similar to this, most of the time we\
  \ won't create server processes by coding the recursion by hand. We can use abstractions,\
  \ which allow the removal of most boilerplate code. In the next chapter, you'll\
  \ be introduced to the OTP framework, which, among other things, provides some abstractions\
  \ to create server processes (namely, `GenServer`). However, we think it's important\
  \ to show a lower-level view of how to work with processes, so that you understand\
  \ how they work, which will empower you to create your own solutions when the abstractions,\
  \ either provided by the language or a library, don't suit your needs.\n\nTo implement\
  \ a server process, we have it executing an endless loop, waiting for a message\
  \ on each iteration of the loop. Upon receiving a message, the process handles it\
  \ and continues the loop. If you're concerned that having the process constantly\
  \ running the loop may degrade performance, note that generally the loop isn't CPU\
  \ intensive–most of the time, the process is waiting for a message (using the `receive`\
  \ construct), which puts the process in a suspended state and doesn't consume CPU\
  \ cycles.\n\nWe'll now see an example of a stateful server process. To avoid synthetic\
  \ examples, we'll be implementing a component of the ElixirDrip application, presented\
  \ in the previous chapter. The component is the cache worker, which is made up of\
  \ the processes spawned by the cache supervisor to maintain the content that we\
  \ want to cache. Whenever one of our users wants to download a certain file, our\
  \ application will download it, and the cache supervisor process (further detailed\
  \ in the next section) spawns a new process for this file, which will live for a\
  \ certain amount of time (60 seconds, in the next example). This way, if the user\
  \ wants to access this file again within this time frame, we won't have to fetch\
  \ and decrypt the file again, and can just serve it from memory.\n\nNote that this\
  \ implementation is not the final one, as this worker will be implemented again\
  \ in the next chapter using some abstractions. Let's now see the code for this server\
  \ process:\n\n```\n$ cat examples/cache_worker.ex\ndefmodule CacheWorker do\n  require\
  \ Logger\n\n  @expire_time 60_000\n\n  def init(content) do\n    spawn(fn ->\n \
  \     timer = Process.send_after(self(), :expire, @expire_time)\n      Logger.debug(\"\
  #{inspect(self())}: CacheWorker started. Will expire in #{Process.read_timer(timer)}\
  \ milliseconds.\")\n      loop(%{hits: 0, content: content, timer: timer})\n   \
  \ end)\n  end\n\n  defp loop(state) do\n    new_state = receive do\n      {:get_content,\
  \ caller} -> get_content(state, caller)\n      :refresh -> refresh_timer(state)\n\
  \      :expire -> terminate(state)\n      message -> unexpected_message(state, message)\n\
  \    end\n\n    loop(new_state)\n  end\n\n  defp get_content(%{content: content,\
  \ hits: hits} = state, caller) do\n    Logger.debug(\"Serving request for get_content.\
  \ Content is #{content}\")\n    send(caller, {:response, content})\n    new_state\
  \ = refresh_timer(state)\n\n    %{new_state | hits: hits + 1}\n  end\n\n  defp refresh_timer(%{timer:\
  \ timer} = state) do\n    Process.cancel_timer(timer)\n    new_timer = Process.send_after(self(),\
  \ :expire, @expire_time)\n    expires_in = Process.read_timer(new_timer)\n    Logger.debug(\"\
  #{inspect(self())}: Canceled the previous expiration timer. Will now expire in #{expires_in}\
  \ milliseconds.\")\n\n    %{state | timer: new_timer}\n  end\nend\n\ndefp terminate(%{hits:\
  \ hits}) do\n  Logger.debug(\"#{inspect(self())}: Terminating process... Served\
  \ the cached content #{hits} times.\")\n  Process.exit(self(), :normal)\nend\n\n\
  defp unexpected_message(state, message) do\n  Logger.warn(\"#{inspect(self())}:\
  \ Received unexpected message: #{inspect(message)}\")\n  state\nend\nend\n```\n\n\
  The preceding code block is quite dense, so let's go through it, bit by bit.\n\n\
  First of all, we have the `init` function. This function is responsible for creating\
  \ our process, and initializing its state. It uses the `send_after` function from\
  \ the `Process` module to send a message to itself in the future–60 seconds after\
  \ the creation in this case. The message itself is `:expire`, which will cause our\
  \ process to exit. This is a very powerful and concise way of having a process alive\
  \ for a certain amount of time, which is especially useful for caches. Then, this\
  \ function calls the loop function with our initial state–the number of cache hits\
  \ is set to 0, the content we'll serve is the argument passed to `init`, and our\
  \ timer is also kept in the state, so that we can manipulate it later.\n\nNow we\
  \ have our process running the `loop` recursive function. This function will fetch\
  \ a message from the mailbox (or block here if the mailbox is empty, waiting for\
  \ a message) and match it against the provided clauses. This server knows how to\
  \ handle three types of messages:\n\n- `:get_content`: Used to retrieve the content\
  \ this process is holding\n- `:refresh`: Used to refresh the timer of the current\
  \ process, making it stay alive for at least another 60 seconds\n- `:expire`: Used\
  \ to signal the end of the current process, meaning that 60 seconds have passed\
  \ without the timer being reset\n\n\n\n无论接收到什么消息，每个子句都必须返回新的状态（可能与旧状态相同），因为 receive\
  \ 的返回值绑定到 new_state 变量。然后该变量被传递给 loop 函数，本质上为循环的下一步设置状态。这是一种常见的有状态服务器方法，根据接收到的消息计算新状态，并使用新状态递归循环。\n\
  \nThe get_content function 发送一条消息回调用者，其中包含状态中存在的内容。然后，它刷新当前进程的计时器，该计时器包含在新状态中，同时还包含当前进程已有的更新后的访问次数。\n\
  \nrefresh_timer 函数负责取消当前计时器（以免我们的进程过早终止），并创建一个新的计时器，该计时器被添加到新状态中。\n\nterminate 函数非常简单，因为它只是使用\
  \ Process.exit/2 函数来终止当前进程。该函数的第二个参数是 :normal，即退出原因。此退出原因可以是任意项，但它具有特殊含义——它表示进程因生命周期结束而退出，而不是因崩溃或运行时错误。我们将在下一节再次讨论退出原因。\n\
  \n最后，我们有 unexpected_message 函数，它只是记录一条警告，说明该进程收到了意外的消息，并保持状态不变。\n\n让我们现在看看这个模块的实际运行情况：\n\
  \n```\niex> cache_worker_pid = CacheWorker.init(\"some binary content\")\n#PID<0.90.0>\n\
  03:36:07.427 [debug] #PID<0.90.0>: CacheWorker started. Will expire in 59997 milliseconds.\n\
  iex> send(cache_worker_pid, {:get_content, self()})\n03:36:18.094 [debug] Serving\
  \ request for get_content. Content is some binary content\n03:36:18.099 [debug]\
  \ #PID<0.90.0>: Canceled the previous expiration timer. Will now expire in 60000\
  \ milliseconds.\n{:get_content, #PID<0.88.0>}\niex> send(cache_worker_pid, :refresh)\n\
  03:36:25.200 [debug] #PID<0.90.0>: Canceled the previous expiration timer. Will\
  \ now expire in 60000 milliseconds.\n:refresh\niex> send(cache_worker_pid, {:get_content,\
  \ self()})\n03:36:26.750 [debug] Serving request for get_content. Content is some\
  \ binary content\n03:36:26.750 [debug] #PID<0.90.0>: Canceled the previous expiration\
  \ timer. Will now expire in 60000 milliseconds.\n{:get_content, #PID<0.88.0>}\n\
  iex> flush\n{:response, \"some binary content\"}\n{:response, \"some binary content\"\
  }\n:ok\niex> send(cache_worker_pid, :other_message)\n03:36:35.178 [warn] #PID<0.90.0>:\
  \ Received unexpected message:\n:other_message\n:other_message\niex>\n03:37:26.755\
  \ [debug] #PID<0.90.0>: Terminating process... Served the cached content 2 times.\n\
  ```\n\n我们首先调用 init 函数，它返回新创建进程的 PID。我们将其绑定到一个变量，以便我们可以向其发送消息。然后，我们发送对应于获取内容的消息。需要注意的是，请求由服务器异步处理。服务器可能在我们发出下一个命令（刷新计时器）时已经向我们响应了结果，但我们可以继续自己的执行，并在需要时再收集结果。发送刷新消息后，我们可以看到调试消息，说明计时器已更新。然后，我们发出另一个获取内容的请求。现在，我们使用\
  \ flush 函数，它会从 shell 进程的邮箱中移除消息并打印它们。预期地，我们在那里有两个消息。最后，我们发送服务器不理解的消息，我们可以看到它记录了该事件。等待几秒钟后，我们还可以看到日志消息，告知我们服务器进程已终止，因为它没有收到更多获取内容或刷新计时器的消息。\n\
  \n我们的服务器进程按预期工作，到目前为止我们已经知道如何使用进程来维护状态。在结束本节之前，还有一个最终的更改需要进行。目前，我们的服务器进程的调用者需要知道我们能处理的\
  \ exact 消息格式。这样，我们就泄露了通信协议，如果将来想要更改它，这可能是一个问题。为了规避这个问题，通常服务器进程都有接口函数，它们是调用实现函数（我们之前介绍的那些）的包装器。让我们扩展我们的模块以包含接口函数：\n\
  \n```\n$ cat examples/cache_worker_with_interface_functions.ex\ndefmodule CacheWorker\
  \ do\n  # ...\n\n  def get_content(server_pid) do\n    send(server_pid, {:get_content,\
  \ self()})\n\n    receive do\n      {:response, content} -> content\n    after\n\
  \      5000 -> {:error, :timeout}\n    end\n    end\n\n    def refresh(server_pid)\
  \ do\n      send(server_pid, :refresh)\n    end\n\n    # ...\n    end\n```\n\n请注意，我们没有为\
  \ :expire 消息定义接口函数。虽然我们的服务器知道如何解释该消息，但它是服务器内部使用的，在这种情况下我们不想将其暴露给客户端。除了抽象通信协议之外，接口函数还允许我们创建同步调用的假象——因为我们发送请求消息并在等待响应后立即阻塞，看起来就像对服务器进行了同步调用。我们还可以根据每个函数的语义具有不同的行为。例如，对于\
  \ refresh 接口函数，我们只是发出 fire-and-forget 请求，不关心响应（请注意，在这种情况下，我们无法确定该消息是否实际被传递）。让我们看看这两个函数在实际中的运行情况：\n\
  \n```\niex> cache_worker_pid = CacheWorker.init(\"some binary content\")\n#PID<0.90.0>\n\
  04:07:40.574 [debug] #PID<0.90.0>: CacheWorker started. Will expire in 59997 milliseconds.\n\
  iex> CacheWorker.get_content(cache_worker_pid)\n04:07:49.738 [debug] Serving request\
  \ for get_content. Content is some binary content\n04:07:49.738 [debug] #PID<0.90.0>:\
  \ Canceled the previous expiration timer. Will now expire in 60000 milliseconds.\n\
  \"some binary content\"\niex> CacheWorker.refresh(cache_worker_pid)\n04:07:55.703\
  \ [debug] #PID<0.90.0>: Canceled the previous expiration timer. Will now expire\
  \ in 60000 milliseconds.\n:refresh\niex>\n04:08:55.704 [debug] #PID<0.90.0>: Terminating\
  \ process... Served the cached content 1 times.\n```\n\n正如我们所见，对于 `get_content`\
  \ 函数，shell 进程只有在返回我们请求的内容后才恢复执行，而对于 `refresh` 函数，它立即返回。请注意，我们现在在 `CacheWorker` 模块中有函数在不同的进程中运行。这是在\
  \ Elixir 和 Erlang 应用程序中常见的模式，因为模块和进程之间没有特定的关系。模块中存在的函数可以被任何进程调用。\n\n我们现在已经介绍了如何构建有状态的服务器进程，它们知道如何处理特定类型的请求并且可能长时间运行。现在让我们看看如何链接和监控进程，这是\
  \ Elixir 中容错的核心组件。\n\n## 通过链接和监控进程检测错误\n\n到目前为止，我们主要关注进程的并发方面。然而，进程还用于创建容错和可靠的系统，即使在出现错误的情况下也能继续运行。\n\
  \n要拥有容错应用程序，你必须首先认识到故障的存在，其中大多数是意外的。这些故障范围从我们的依赖项宕机（例如数据库）到硬件故障。此外，如果你运行的是分布式系统，你可能会遇到其他问题，例如远程机器变得不可用，或存在网络分区。无论原因如何，这些故障都必须被检测到，以便我们限制其影响并希望在没有人工干预的情况下从中恢复。\n\
  \n几乎不可能预见到所有可能使应用程序停止运行的场景。更有效的方法是接受任何事情都可能失败，并设计系统以做出反应。当应用程序中的某个组件确实失败时，你不需要对系统的所有组件采取行动——与失败组件完全无关的组件应继续其工作，使应用程序尽可能多地为其客户端提供服务。这些是可靠和自愈系统的特征——它们能够尽快从不可预见的错误中恢复。\n\
  \n\n\n正如我们在 `Chapter 1`，*为即将到来的旅程做准备* 中看到的，错误可以在多种情况下被引发。例如，当模式匹配失败或当我们尝试将一个数字除以\
  \ 0 时。当这类错误发生时，执行的控制权会沿着调用栈向上转移到错误处理代码。如果没有这段代码，则发生错误的进程将被终止。除了错误（例如，通过调用 `raise`\
  \ 创建）和 throws（一种控制流的最后手段），它们都在第一章中有所介绍，`exit` 在 Elixir 中也被视为运行时错误（当进程以 `:normal`\
  \ 以外的原因终止时发生）。无论运行时错误的种类如何，我们也已经看到如何使用熟悉的 `try` 和 `rescue` 机制来处理它。\n\n与更常见的主流编程语言相比，在\
  \ Elixir 中捕获运行时错误的需要要少得多。更普遍的惯用法是 *让进程崩溃*，然后再采取行动（通常是重启进程）。\n\n虽然这种技术乍看似乎有争议，但其背后有其道理。在开发系统时，大多数\
  \ bug 要么在单元测试或集成测试中被捕获，要么最终由 QA/验收团队发现。剩下的那些是不可预测的 bug，它们只会在时断时续地、并在特定情况下发生，使其非常难以复现。这类错误的通常原因在于某种形式的不一致状态。因此，一个可能的解决方案是让进程终止，然后之后再启动一个新进程。记录此类错误通常是一种良好的实践，这样你就可以稍后调查其原因。尽管如此，以这种方式设计你的应用程序允许你几乎瞬间从错误中恢复，使其成为可靠且健壮的应用程序。在\
  \ Elixir 和 Erlang 社区中，这种思考和设计应用程序的方式通常被称为 *let it crash*，因为我们没有显式捕获错误而是让进程崩溃。这种思维方式鼓励快乐路径编程，即我们首先关注没有错误条件的场景，让我们能够集中于应用程序的目的（并在之后处理异常路径）。\n\
  \n值得注意的是，容错的核心原则是并发。正如我们在本章开头解释的那样，BEAM 内部的进程彼此完全分离——它们不共享内存，并且一个进程的崩溃默认情况下不会导致另一个进程崩溃。这种进程隔离使我们能够限制运行时错误对进程（或一组相关进程）的负面影响，在大多数情况下保持系统的绝大部分按预期工作。\n\
  \n这种隔离本身就为我们的应用程序提供了某种程度的弹性。使用上一节中定义的缓存工作进程，持有某些内容的 worker 的崩溃不会影响其他 worker 的执行流程，它们将继续工作并提供服务。然而，这种隔离不足以拥有容错应用程序。我们现在将学习\
  \ Elixir 提供的用于检测和响应进程崩溃的机制。\n\n## 使用链接\n\n检测进程崩溃的一种方式是通过使用链接。当两个进程被链接，并且其中一个退出时，另一个将收到一个退出信号，通知我们某个进程已崩溃。一个链接始终包含两个进程，连接是双向的。一个进程可以链接到任意数量的其他进程，系统中创建链接的数量没有预定义限制。\n\
  \n除了崩溃进程的 PID 外，退出信号还包含退出原因，它是一个描述进程终止原因的任意项。如果终止是正常的，这意味着已启动的进程已完成其执行，则退出原因是 :normal。默认情况下，除非退出原因是\
  \ :normal，否则当进程收到退出信号时，它也会被终止，连同被链接的进程一起终止。\n\n要创建链接，我们可以使用 Process.link/1 函数，它将调用进程连接到作为参数提供的\
  \ PID 的进程。然而，更常见的做法是在进程被启动时创建链接，通过 spawn_link/1 函数，该函数以原子方式创建一个新进程并将其链接到调用进程。让我们通过修改我们的\
  \ CacheWorker.init/1 函数以使用 spawn_link/1 来实际看看这一点：\n\n```\n$ cat examples/cache_worker_with_spawn_link.ex\n\
  defmodule CacheWorker do\n  # ...\n\n  def init(content) do\n    spawn_link(fn ->\n\
  \      timer = Process.send_after(self(), :expire, @expire_time)\n      Logger.debug(\"\
  #{inspect(self())}: CacheWorker started. Will expire\nin #{Process.read_timer(timer)}\
  \ milliseconds.\")\n      loop(%{hits: 0, content: content, timer: timer})\n   \
  \ end)\n  end\n\n  # ...\nend\n```\n\n现在让我们在 IEx 会话中使用它：\n\n```\niex> cache_worker_pid\
  \ = CacheWorker.init(\"some binary content\")\n#PID<0.90.0>\n20:57:24.470 [debug]\
  \ #PID<0.90.0>: CacheWorker started. Will expire in 59989 milliseconds.\niex> CacheWorker.get_content(cache_worker_pid)\n\
  20:57:35.401 [debug] Serving request for get_content. Content is some binary content\n\
  20:57:35.401 [debug] #PID<0.90.0>: Canceled the previous expiration timer. Will\
  \ now expire in 60000 milliseconds.\n\"some binary content\"\n20:58:35.402 [debug]\
  \ #PID<0.90.0>: Terminating process... Served the cached content 1 times.\niex>\
  \ cache_worker_pid = CacheWorker.init(\"some other binary content\")\n21:00:33.380\
  \ [debug] #PID<0.93.0>: CacheWorker started. Will expire in 60000 milliseconds.\n\
  #PID<0.93.0>\niex> CacheWorker.get_content(cache_worker_pid)\n21:00:35.956 [debug]\
  \ Serving request for get_content. Content is some other binary content\n21:00:35.956\
  \ [debug] #PID<0.93.0>: Canceled the previous expiration timer. Will now expire\
  \ in 60000 milliseconds.\n\"some other binary content\"\niex> Process.exit(cache_worker_pid,\
  \ :kill)\n** (EXIT from #PID<0.88.0>) shell process exited with reason: killed\n\
  ```\n\n我们首先调用 init 函数，它将启动一个新进程。请注意，我们现在使用 spawn_link/1，因此该进程现在与 shell 进程链接。我们然后发出\
  \ get_content 请求，它按预期工作并返回内容。然后我们等待该进程的计时器过期，我们可以看到日志消息指出该进程正在终止。由于该进程以 :normal\
  \ 原因终止，我们的 shell 进程不受影响。然后，我们启动一个新进程，发出请求获取其内容，并使用 Process.exit/2 函数手动杀死它，提供 :kill\
  \ 作为退出原因。退出原因可以是任何项，但 :kill 被特殊对待。当用作退出原因时，它确保目标进程无条件终止，即使它正在捕获退出（我们很快会讨论）。正如我们从最后一条消息中看到的那样，shell\
  \ 进程也被终止了，因为它与我们刚刚杀死的进程链接。\n\n链接在某种程度上破坏了我们在上一节中谈到的进程隔离。然而，这只会在你显式链接它们时发生。这种技术非常强大，如果例如我们想要始终确保某个相关进程组作为一个整体被杀死，不留下悬空进程时，就可能派上用场。\n\
  \n如果我们不想让自己的进程被终止，而只是想被通知链接进程的崩溃，以便我们可以采取行动怎么办？这就是 *trapping exits* 概念派上用场的地方。当进程捕获退出时，它在收到退出信号时不会被终止。相反，该退出信号会以消息的形式传递到该进程的邮箱。这样，捕获的进程就可以接收该消息并相应地采取行动。\n\
  \n要设置退出捕获，你使用 `Process.flag(:trap_exit, true)`，这将使当前进程捕获退出信号。传递给捕获退出的进程的消息具有以下格式：`{:EXIT,\
  \ from_pid, exit_reason}`。在此消息中，`from_pid` 是崩溃进程的 PID，而 `exit_reason` 是我们之前描述的退出原因。现在让我们重新运行之前的示例，但这次\
  \ shell 进程捕获退出：\n\n```\niex> Process.flag(:trap_exit, true)\nfalse\niex> cache_worker_pid\
  \ = CacheWorker.init(\"some binary content\")\n#PID<0.91.0>\n21:41:38.453 [debug]\
  \ #PID<0.91.0>: CacheWorker started. Will expire in 59995 milliseconds.\niex> CacheWorker.get_content(cache_worker_pid)\n\
  21:41:50.465 [debug] Serving request for get_content. Content is some binary content\n\
  21:41:50.466 [debug] #PID<0.91.0>: Canceled the previous expiration timer. Will\
  \ now expire in 60000 milliseconds.\n\"some binary content\"\niex> Process.exit(cache_worker_pid,\
  \ :kill)\ntrue\niex> flush\n{:EXIT, #PID<0.91.0>, :killed}\n:ok\n```\n\n首先，我们使 shell\
  \ 进程捕获退出。它返回 `false`，因为此函数返回该标志的先前值。然后，示例与我们已经看到的类似。有趣的部分是调用 `Process.exit/2` 函数后会发生什么。现在，调用后我们的\
  \ shell 进程没有终止，而且，正如我们通过使用 `flush` 函数所看到的那样，它在其邮箱中收到了消息，通知我们其链接进程的崩溃。\n\n让我们现在看看检测错误的另一种机制：监视器。\n\
  \n\n\n## 使用监视器\n\n在某些场景下，最好让错误沿单一方向传播。这就是监视器的用例。监视器类似于链接，但后者始终是双向的，而前者始终是单向的。此外，与其他进程链接的进程在其中一个进程终止时可能会终止（除非它捕获退出信号），而监视器永远不会导致监视其他进程的进程终止，并且默认行为是它始终在其邮箱中接收消息。单个进程可以创建多个监视器。\n\
  \n要监视一个进程，你需要调用 `Process.monitor/1` 函数，并提供要监视的进程的 PID 作为参数。你也可以提供已注册进程的别名，我们尚未介绍过它们。它们将在下一章中介绍。调用此函数的结果是一个引用（Elixir\
  \ 中的一种基本类型），它标识新创建的监视器。如果被监视的进程退出，监视进程会收到格式如下的消息：{:DOWN, monitor_reference, :process,\
  \ from_pid, exit_reason}。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_133_0.png)\n\
  \n如果需要停止监视某个进程，可以使用 `Process` 模块中的 `demonitor` 函数，并提供作为 `Process.monitor/1` 调用返回的监视引用作为参数。\n\
  \n让我们现在通过示例中的 `CacheWorker` 进程来实际操作一下：\n\n```elixir\niex> cache_worker_pid = CacheWorker.init(\"\
  some binary content\")\n#PID<0.90.0>\n22:13:41.448 [debug] #PID<0.90.0>: CacheWorker\
  \ started. Will expire in 59996 milliseconds.\niex> CacheWorker.get_content(cache_worker_pid)\n\
  22:13:51.540 [debug] Serving request for get_content. Content is some binary content\n\
  22:13:51.541 [debug] #PID<0.90.0>: Canceled the previous expiration timer. Will\
  \ now expire in 60000 milliseconds.\n\"some binary content\"\niex> monitor_reference\
  \ = Process.monitor(cache_worker_pid)\n#Reference<0.3261553142.1274281985.104407>\n\
  22:14:51.552 [debug] #PID<0.90.0>: Terminating process... Served the cached content\
  \ 1 times.\niex> flush\n{:DOWN, #Reference<0.3261553142.1274281985.104407>, :process,\
  \ #PID<0.90.0>, :normal}\n:ok\n```\n\n请注意，我们使用的是使用 `spawn`（而不是 `spawn_link`）的 `CacheWorker`\
  \ 版本，这意味着 shell 进程未链接到 `CacheWorker` 进程。在生成 `CacheWorker` 进程并向其发出请求后，我们使用 `Process.monitor/1`\
  \ 函数来监视此进程。在此示例中，我们不需要使用 `Process.exit/2`，因为即使退出原因为 `:normal`，我们也会收到消息。因此，我们只需等待计时器结束，然后检查\
  \ shell 进程的邮箱，发现我们收到了预期的消息。在实际应用中，我们可以从邮箱中获取此消息并据此采取行动。\n\n本节介绍的错误检测机制使我们能够跟踪我们感兴趣的进程。在下一节中，我们将介绍监视器，它们使用这些机制来检测错误，但也允许我们在进程崩溃时做出反应，为错误恢复铺平道路。\n\
  \n## 使用监视器和监督树从错误中恢复\n\n在上一节的开始，我们解释了 *let it crash* 哲学，以及为什么你应该遵循它来构建可靠、容错的应用。了解了\
  \ Elixir 提供的检测错误的机制后，我们现在将介绍 *supervisors*，它们建立在这些机制之上，为我们提供从错误中恢复的方法。\n\n在深入介绍监视器之前，我们想指出一个关于遵循\
  \ *let it crash* 哲学 的应用程序中错误处理的重要方面。我们一直在讨论这种方法如何改变你处理错误的方式，并且它提供容错能力，因为你可以通过检测错误并采取纠正措施来从错误中恢复。然而，这种方法不应该用于你在程序正常执行流程中事先知道可能发生的错误，特别是如果你有干净的处理方式时。例如，一个负责通过其\
  \ HTTP API 联系外部依赖的进程，在响应中遇到 404 状态码时不应该崩溃。这是一个有效的响应，你可以在应用程序中通过返回 `{:error, :not_found}`\
  \ 元组给调用者来处理这种情况，等等。预期错误的定义差异很大，因为它取决于应用程序的领域。尽管如此，在构建应用程序时，请考虑花一些时间定义可能发生的预期错误，以及你的应用程序将如何处理它们。\n\
  \n监视器是一个其唯一职责是监视其他进程的进程。鉴于它们具有这种有限的目的，通常监视器代码非常简单直接。这很重要，因为它降低了监视器出现运行时错误的可能性，使它们不太可能崩溃。\n\
  \n监视器是 Elixir 和 Erlang 应用程序的核心组件，因此它们是 OTP behaviour。在第一章中，我们看到了如何使用 behaviour 来提供其他模块可以采用的接口。Behaviour\
  \ 还可以用来将通用代码提取到一个地方，然后另一个模块可以插入其中，实现一些特定的回调，这些回调将包含特定于我们希望在该模块中实现的目标的代码。这是对 behaviour\
  \ 工作原理的非常简单的解释，但它只是你完成本章所需的。在下一章中，我们将研究 OTP 及其提供的 behaviour，并更详细地解释这一概念。\n\n在进入一些示例之前，让我们看看监视器进程的流程。进程创建后，监视器将配置自身以捕获退出信号。然后，它将自己与每个子进程之间创建链接。有了这个设置，如果子进程崩溃，监视器将收到退出信号，使其能够根据启动时提供的配置对该事件做出反应。监视器使用链接而不是监视器，因为双向通信意味着如果监视器崩溃，其所有子进程也将被立即终止，这有助于避免系统中出现悬空进程。\n\
  \n让我们现在看看如何定义和启动一个监视器，以及如何使用模块插入到监视器 behaviour 中。\n\n## 定义和启动监视器\n\n我们现在将看到一个监视器的示例。现在，我们将把\
  \ `CacheWorker` 模块放在一边，因为它将在下一节中使用，我们将在那里使用动态监视器。在此示例中，我们将创建上传管道监视器。在我们的应用程序中，我们将创建两个管道，一个用于下载，另一个用于上传，当用户执行相应操作时使用。这些管道包含为每次下载或上传操作执行的步骤集。其中一个步骤是加密/解密步骤，它将在将上传文件保存到远程存储之前对其进行加密，并解密下载的文件。\n\
  \n我们在本示例中展示的模块并不是最终应用程序中使用的模块。例如，Encryption 模块将使用 GenStage（在下一章中进一步解释），这会使我们的示例变得混乱。事实上，Encryption\
  \ 模块被简化到极致，它只是一个在循环中运行的进程，等待消息并将收到的消息打印到终端。这种简化将使我们能够完全专注于监视器，而本节的重点正是监视器。请注意，你始终可以通过从书籍网站下载来查看所有源代码。\n\
  \n要将模块插入到监视器的 behaviour 中，我们只需要实现一个回调：init/1。此回调将提供由该监视器启动的进程的规范以及一些配置。要与监视器交互，我们使用\
  \ Elixir 提供的 Supervisor 模块。让我们看看上传管道监视器的代码：\n\n```\n$ cat examples/upload_pipeline_supervisor.ex\n\
  defmodule ElixirDrip.Storage.Supervisors.Upload.Pipeline do\n  use Supervisor\n\
  \  require Logger\n  alias ElixirDrip.Storage.Pipeline.Encryption\n\n  def start_link()\
  \ do\n    Supervisor.start_link(__MODULE__, :ok)\n  end\n\n  def init(:ok) do\n\
  \    Logger.debug(\"#{inspect(self())} Starting the Upload Pipeline Supervisor module...\"\
  )\n\n    Supervisor.init(\n      [worker(Encryption, [], restart: :transient)],\n\
  \      strategy: :one_for_one\n    )\n  end\nend\n```\n\n从 init 函数开始，我们可以看到它接收一个参数。在这种情况下，我们匹配到\
  \ :ok，因为我们不会使用它，但此参数可用于从调用进程传递选项列表。除了一些有助于调试的日志记录之外，此函数所做的唯一事情就是调用 `Supervisor.init/2`，它将启动我们作为参数传递的子进程。正如我们之前所说，我们需要向监视器提供将在该监视器下启动的进程的规范——子进程列表。这是传递给\
  \ `Supervisor.init/2` 的第一个参数。\n\n\n\n在这种情况下，列表只有一个元素，即调用 worker 函数的结果。该函数是在我们在模块顶部调用\
  \ use Supervisor 时从 Supervisor.Spec 模块导入的。该函数将返回子进程的规范。第一个参数是将在子进程中运行的模块的名称，第二个参数是要提供给该模块的\
  \ start_link 函数的参数列表。请注意，你不需要特别指定要调用此函数。这是由于 start_link 名称是默认的。你可以覆盖它并使用不同的名称（通过在选项列表中提供\
  \ :function），但我们认为最好遵循社区使用的约定，这将帮助其他软件开发者理解你的代码。最后，worker 函数的最后一个参数是一个选项列表。在这种情况下，我们提供了\
  \ restart 值。:transient 表示子进程只有在异常终止时才会被重启。我们也可以使用 :temporary，子进程永远不会被重启；或 :permanent，子进程总会被重启，即使它以\
  \ :normal 退出原因终止。\n\n传递给 Supervisor.init/2 的第二个参数是一个选项列表。在这种情况下，我们提供了 :strategy\
  \ 选项，它定义了 supervisor 如何处理子进程的崩溃。在我们的示例中，我们使用 :one_for_one，这意味着当子进程终止时，supervisor\
  \ 会在其位置生成一个新的进程。其他可能的值有 :one_for_all，表示当一个子进程崩溃时，该 supervisor 的所有子进程都会被重启；还有 :rest_for_one，它会使在崩溃进程之后启动的子进程按顺序重启（连同崩溃的进程本身，它是第一个）。这意味着当我们使用此策略时，启动\
  \ supervisor 子进程的顺序很重要。请注意，直到 Elixir 1.6，我们还拥有 :simple_one_for_one 策略，它用于让 supervisor\
  \ 动态启动子进程。然而，在 Elixir 1.6 中它已被弃用，转而使用 DynamicSupervisor 模块，这将在下一节中介绍。\n\n这里使用 worker\
  \ 函数意味着该子进程不是一个 supervisor。我们也可以使用 supervisor 函数，它将返回 supervisor 的子进程规范。在此上下文中，worker\
  \ 指任何不是 supervisor 的东西。让 supervisor 生成其他 supervisor 将导致一个监督树，我们将在本章最后一节介绍。\n\nsupervisor\
  \ 终止子进程的方式也可以通过 :shutdown 选项进行配置。默认情况下，如果子进程是 worker，supervisor 会向其发送退出信号并等待五秒钟，如果在此间隔内未终止，则会强制杀死该子进程。如果子进程是\
  \ supervisor，默认情况下它会无限期等待。如果你有兴趣配置此项，请查看官方 Supervisor 文档 https://hexdocs.pm/elixir/Supervisor.html，其如同大多数\
  \ Elixir 文档一样非常详尽，并包含有用的示例。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_138_0.png)\n\
  \n在本节中，我们将只使用基于模块的 supervisor，因为它们在教学上更有利，因为我们对 supervisor 如何初始化有更大的控制权。然而，请注意你不需要为每个想要的\
  \ supervisor 创建一个模块。你可以将 Supervisor 模块中函数的调用嵌入到其他模块中，这在你熟悉后可能会简化你的代码。请查看 Supervisor\
  \ 模块文档以了解如何操作的示例：https://hexdocs.pm/elixir/Supervisor.html。\n\n现在让我们关注 start_link\
  \ 函数。此函数只是 Supervisor.start_link/2 的包装器，类似于我们在为 CacheWorker 引入接口函数时所做的。另一个值得注意的点是使用\
  \ __MODULE__，它是一种特殊形式，在编译期间会被当前模块的名称所替代，这意味着传递给 Supervisor.start_link/2 的第一个参数是当前模块的名称。\n\
  \n现在让我们在 IEx 会话中使用它：\n\n```\niex> c(\"examples/encryption.ex\")\n[ElixirDrip.Storage.Pipeline.Encryption]\n\
  iex> c(\"examples/upload_pipeline_supervisor.ex\")\n[ElixirDrip.Storage.Supervisors.Upload.Pipeline]\n\
  iex> {:ok, supervisor_pid} =\nElixirDrip.Storage.Supervisors.Upload.Pipeline.start_link()\n\
  19:37:33.693 [debug] #PID<0.97.0>: Starting the Upload Pipeline Supervisor module...\n\
  19:37:33.695 [debug] #PID<0.98.0>: Starting the Encryption module...\n{:ok, #PID<0.97.0>}\n\
  iex> send(pid(0, 98, 0), \"some message\")\n#PID<0.98.0>: Encryption module received\
  \ a message: some message\n\"some message\"\niex> Process.exit(pid(0, 98, 0), :kill)\n\
  true\n```\n\n```\n19:39:11.208 [debug] #PID<0.102.0>: Starting the Encryption module...\n\
  iex> send(pid(0, 102, 0), \"some message\")\n#PID<0.102.0>: Encryption module received\
  \ a message: some message\n\"some message\"\n```\n\n首先，我们编译运行此示例所需的文件。在之前的示例中我们省略了这一点，因为它们只使用单个文件。由于此示例稍微复杂一些，我们明确地编译它们。然后，我们调用\
  \ supervisor 的 `start_link/0` 函数，它将启动 supervisor 本身及其唯一的子进程，正如我们从调试消息中观察到的那样。之后，我们向加密模块发送一条消息，以验证它是否正常工作。在这种情况下，它只是将我们发送的内容打印到终端。现在我们确定\
  \ worker 进程正在运行，使用 `Process.exit/2` 函数将其杀死。我们也可以通过在代码中某处放置 `raise` 来模拟 worker 中的运行时错误，但这种方法使示例更明确。杀死进程后，我们可以看到一条调试消息，指出\
  \ `Encryption` 模块正在重新启动。这就是 supervisor 的作用！它检测到其子进程的崩溃并在其位置启动了一个新进程。最后，我们向新的 `Encryption`\
  \ 进程发出请求，以证明它完全可用。\n\n需要指出的是，如果一个子进程不断崩溃，supervisor 不会永远重启它——它依赖于最大 *restart frequency*。正如我们在上一节开头所说，拥有\
  \ supervisor 的原因在于存在一种只在某些情况下发生的错误类型。重启进程使其从头开始，具有干净的状态。如果进程不断重启，问题可能不是由某些复杂的状态引起的。默认情况下，supervisor\
  \ 允许在五秒间隔内进行三次重启。如果超过此限制，supervisor 将终止自身以及其所有子进程。在这些条件下让 supervisor 终止自身非常重要，因为它允许错误在监督树中传播，正如我们将在本章最后一节看到的那样。时间段内的错误数量和时间段本身可以在启动\
  \ supervisor 时通过分别传递 `:max_restarts` 和 `:max_seconds` 选项进行配置。\n\n## Streamlined\
  \ child specs\n\nElixir 1.5 引入了 streamlined child specs，它允许在模块中定义子进程规范。不同于依赖于 `Supervisor.Spec`\
  \ 模块中的 `worker` 和 `supervisor` 函数，supervisor 现在接收模块列表作为子进程，并将对每个子模块调用 `child_spec/1`\
  \ 函数。这允许子模块控制它们在 supervisor 下的运行方式。\n\n让我们现在使用 streamlined child specs 查看上一示例中呈现的模块。在\
  \ supervisor 中，我们仅将 init/1 函数更改为以下内容：\n\n```\n$ cat examples/upload_pipeline_supervisor_with_streamlined_child_specs.ex\n\
  defmodule ElixirDrip.Storage.Supervisors.Upload.Pipeline do\n  # ...\n\n  def init(:ok)\
  \ do\n    Logger.debug(\"#{inspect(self())} Starting the Upload Pipeline Supervisor\
  \ module...\")\n    Supervisor.init([Encryption], strategy: :one_for_one)\n  end\n\
  end\n```\n\nsupervisor 上的代码现在更简单，因为部分配置已移至子进程。在 Encryption 模块中，我们现在有以下函数：\n\n```\n\
  def child_spec(_) do\n  %{\n    id: __MODULE__,\n    start: {__MODULE__, :start_link,\
  \ []},\n    restart: :transient,\n    shutdown: 10000,\n    type: :worker\n  }\n\
  end\n```\n\n此函数有一个参数，我们未使用，但可用于允许 supervisor 在此子进程上配置某些选项。我们现在需要提供一个 id，以前它隐式为模块名称。此外，在其他版本中，shutdown（即\
  \ supervisor 等待子进程终止的时间，以毫秒为单位）默认为 5,000 ms，而这里我们看到了如何配置它的示例。与之前版本相比的另一个不同之处在于子进程规范现在只是映射，而不是依赖于\
  \ worker 和 supervisor 函数的 API。\n\n你可能不必在每次都定义 child_spec/1 函数。例如，下一章中解释的 Agent 和\
  \ Task 模块定义了 child_spec/1 函数，如果你使用其中一个模块，可以跳过此函数的创建。请注意，在这种情况下，你始终可以覆盖它并提供自定义的子进程规范。\n\
  \n\n\n这目前是 Elixir 社区定义子规范的首选方式。我们想向你展示定义子规范的两种方式，因为你在浏览源代码时很可能会同时遇到这两种方式。然而，在从头开始一个项目（或重构某些代码）时，请选择我们现在介绍的选项，因为你的代码将遵循社区约定，使其他人更容易理解其内容。\n\
  \n## 使用动态监管器在运行时启动子进程\n\n我们现在已经了解如何使用监管器来从错误中恢复，它会根据我们提供的配置重启崩溃的进程。然而，到目前为止，我们必须在启动前预先定义监管器的子进程，这些子进程会在监管器启动后立即启动。有时这并不能满足我们的需求，我们需要在运行时生成监管器的新子进程。这就是动态监管器变得有用的地方。\n\
  \nElixir 1.6 版本引入了 DynamicSupervisor 模块。如我们所述，这个新模块弃用了常规监管器的 :simple_one_for_one\
  \ 策略。之所以进行这种提取有很多原因，其中两个主要原因是 :simple_one_for_one 策略改变了监管器初始化和关闭的语义，而且 Elixir 标准库中的某些\
  \ API 会根据监管策略期望不同的输入（甚至可能不可用）。\n\n为了演示这一概念，我们将创建一个 CacheSupervisor 模块，它将负责监管本章中一直使用的\
  \ CacheWorker 进程。然而，CacheWorker 进程需要进行一些更改，因为我们需要注册进程（在别名下），以便我们的监管正常工作。请注意，在之前的示例中，我们能够观察到监管器对\
  \ Encryption 进程崩溃的反应，通过启动一个新的进程，但在实际应用中我们需要注册被监管的进程，否则它们的客户端仍可能联系到已经终止的进程。\n\n当我们引入监管器时，保留先前创建进程的\
  \ PID 的做法就变得无关紧要了，因为随着进程崩溃和监管器创建新进程，PID 会发生变化。我们尚未介绍 GenServer 行为，将在下一章开头进行介绍。你仍然可以毫无困难地跟随此示例，因为主要关注点是监管器——事实上，我们在这里不会展示新的\
  \ CacheWorker 的代码，因为它与示例无关。如往常一样，如果你好奇，可以在 本章的源代码中找到它。\n\n现在让我们看看缓存监管器的代码：\n\n```\n\
  $ cat examples/cache_supervisor.ex\ndefmodule ElixirDrip.Storage.Supervisors.CacheSupervisor\
  \ do\n  use DynamicSupervisor\n  alias ElixirDrip.Storage.Workers.CacheWorker\n\n\
  \  def start_link() do\n    DynamicSupervisor.start_link(__MODULE__, [], name: __MODULE__)\n\
  \  end\n\n  def init(_) do\n    DynamicSupervisor.init(strategy: :one_for_one, max_children:\
  \ 100)\n  end\n\n  def put(id, content) when is_binary(id) and is_bitstring(content)\
  \ do\n    case find_cache(id) do\n      nil -> start_worker(id, content)\n     \
  \ pid -> {:ok, pid}\n    end\n  end\n\n  def get(id) when is_binary(id) do\n   \
  \ case find_cache(id) do\n      nil -> {:error, :not_found}\n      pid -> CacheWorker.get_media(pid)\n\
  \    end\n  end\n\n  def refresh(id) when is_binary(id) do\n    case find_cache(id)\
  \ do\n      nil -> {:error, :not_found}\n      pid -> CacheWorker.refresh(pid)\n\
  \    end\n  end\n\n  defp start_worker(id, content) when is_binary(id) and is_bitstring(content),\n\
  \    do: DynamicSupervisor.start_child(__MODULE__, cache_worker_spec(id, content))\n\
  \n  defp find_cache(id) when is_binary(id) do\n    GenServer.whereis(CacheWorker.name_for(id))\n\
  \  end\n\n  defp cache_worker_spec(id, content) do\n    Supervisor.child_spec(\n\
  \      start: {CacheWorker, :start_link, [id, content]},\n      restart: :transient\n\
  \    )\n  end\nend\n```\n\n让我们探索一下这里与之前示例相比的差异。除了模块名称不同之外，现在 init/1 不再声明任何子进程。它只是通过提供一些配置来启动监管器。在定义策略之后，我们可以看到\
  \ :max_children 选项，这是 DynamicSupervisor 模块特有的。它配置了该进程可以生成的子进程的最大数量。你可以使用它来限制并发，这也会限制资源使用。在我们的示例中，如果让缓存进程无限增长，我们可能会耗尽所有可用内存，导致\
  \ BEAM 崩溃。\n\n该监管器管理我们已经描述过的 CacheWorker 进程。但是请注意，其接口略有变化，因为我们将每个内容与一个 id 关联。当尝试从缓存中放入或获取内容时，它会使用\
  \ find_cache 函数，而该函数又使用 GenServer.whereis/1 函数。\n\n通过这样做，我们检查为提供的 id 是否已存在进程。如果存在，我们只需返回包含该进程\
  \ PID 的元组（使用 put 时）或使用 CacheWorker.get_media/1 函数检索对应给定 id 的内容（使用 get 时）。如果不存在，我们将创建一个新进程来保存该\
  \ id 的内容（使用 put 时）或返回一个元组表示未找到进程（使用 get 时）。当我们调用 put 且该 id 的进程尚不存在时，监管器会介入并动态创建新的子进程。这发生在\
  \ start_worker 函数中，该函数又使用 DynamicSupervisor.start_child/2。\n\n最后，请注意我们如何传递这个动态子进程的子规范。我们本可以直接使用前面提到的简化的子规范，在\
  \ CacheWorker 模块上有一个 child_spec/1 函数。那也是完全正确的。我们只是这样做是为了让你看到如何从监管器配置子规范，从而允许你覆盖任何感兴趣的特定字段。让我们在\
  \ IEx shell 中看看它是如何工作的：\n\n```\niex> c(\"examples/cache_worker_under_supervisor.ex\"\
  )\n[ElixirDrip.Storage.Workers.CacheWorker]\niex> c(\"examples/cache_supervisor.ex\"\
  )\n[ElixirDrip.Storage.Supervisors.CacheSupervisor]\niex> ElixirDrip.Storage.Supervisors.CacheSupervisor.start_link()\n\
  {:ok, #PID<0.97.0>}\niex> ElixirDrip.Storage.Supervisors.CacheSupervisor.put(\"\
  abc\", \"def\")\n04:13:04.744 [debug] #PID<0.99.0>: CacheWorker started. Will expire\
  \ in\n60000 milliseconds.\n{:ok, #PID<0.99.0>}\niex> ElixirDrip.Storage.Supervisors.CacheSupervisor.get(\"\
  abc\")\n04:13:17.550 [debug] #PID<0.99.0>: Received :get_media and served 3\nbytes\
  \ 1 times.\n04:13:17.550 [debug] #PID<0.99.0>: Canceled the previous expiration\
  \ timer.\nWill now expire in 60000 milliseconds.\n{:ok, \"def\"}\niex> ElixirDrip.Storage.Supervisors.CacheSupervisor.get(\"\
  xyz\")\n{:error, :not_found}\n04:14:17.565 [debug] #PID<0.99.0>: Terminating process...\
  \ Served the cached\ncontent 1 times.\niex> ElixirDrip.Storage.Supervisors.CacheSupervisor.get(\"\
  abc\")\n{:error, :not_found}\niex> ElixirDrip.Storage.Supervisors.CacheSupervisor.put(\"\
  abc\", \"def\")\n04:14:25.386 [debug] #PID<0.104.0>: CacheWorker started. Will expire\
  \ in\n60000 milliseconds.\n{:ok, #PID<0.104.0>}\niex> Process.exit(pid(0, 104, 0),\
  \ :kill)\ntrue\n04:14:42.485 [debug] #PID<0.106.0>: CacheWorker started. Will expire\
  \ in\n60000 milliseconds.\niex> ElixirDrip.Storage.Supervisors.CacheSupervisor.get(\"\
  abc\")\n04:14:46.674 [debug] #PID<0.106.0>: Received :get_media and served 3\nbytes\
  \ 1 times.\n{:ok, \"def\"}\n04:14:46.674 [debug] #PID<0.106.0>: Canceled the previous\
  \ expiration timer.\nWill now expire in 60000 milliseconds.\n04:15:46.675 [debug]\
  \ #PID<0.106.0>: Terminating process... Served the\ncached\ncontent 1 times.\n```\n\
  \n编译所需文件后，我们演示了此 `CacheSupervisor` 的常规用法。然后，我们让计时器过期，可以看到监管器没有重启进程。这是因为重启策略是 `:transient`，并且进程正常退出。然后我们通过再次将内容放入缓存来启动新进程。之后，我们杀死这个新创建的进程，立即看到一条日志消息指出\
  \ `CacheWorker` 已启动。这次，由于退出原因是 `:kill`（而不是 `:normal`），监管器介入，在崩溃进程的位置启动了新进程。正如示例所示，即使我们的服务器进程崩溃，我们仍然可以访问我们的\
  \ `id` 的内容。\n\n我们现在已经了解了如何使用动态监管器，并见证了它们能为我们的应用程序带来的灵活性。让我们进入本章的最后一部分：监管树。\n\n\n\
  \n## 使用监督树最小化错误影响\n\n在上一节中，我们使用过 supervisor 并观察到它们如何实现错误恢复。它们是在构建容错应用程序时至关重要的组件，并且它们显著改变了人们对常见错误恢复机制（如\
  \ `try/catch`）的思维方式。在了解了如何使用 supervisor 检测和恢复运行时错误之后，我们现在将重点关注如何将它们组合起来，创建 *监督树*，以便在应用程序中实现细粒度的错误恢复，减少错误对整个系统的影响。\n\
  \n构建监督树时，你必须考虑当某个进程因错误终止时对系统其余部分的影响。这样，你可以将密切相关的进程分组在一起，可以作为一个整体启动和停止，提供一致的行为。构建监督树时，你隐式地编码了进程之间的依赖关系。如果设计得当，监督树可以最大限度地减少错误对系统某一部分的影响，让其余部分照常运行。例如，在我们的\
  \ `ElixirDrip` 示例中，某个文件的上传管道中的错误不应影响缓存 supervisor 部分，后者可以在上传管道尝试从错误中恢复的同时继续提供缓存内容。监督树的要点是首先尝试在本地恢复错误，仅影响真正需要的进程。如果这样不起作用，因为被重启的进程不断崩溃，那么\
  \ supervisor 本身就会崩溃，在树中向上移动，并将下一步行动的决策委托给其 supervisor。\n\n经常可以看到 Elixir 被宣传为一种允许开发可靠且容错应用程序的语言——包括本书中多次提及。虽然这是真的，我们认为重要的是要重申，可靠性和容错性属性是在我们围绕它们设计应用程序时才存在的。Elixir\
  \ 为你提供了构建此类系统的工具——这些属性并非 Elixir 构建的应用程序固有的。设计你的监督树是在构建具有这些特征的应用程序时的重要步骤，因此应给予适当的重视。虽然如果你不习惯以这种方式创建应用程序，这看起来可能令人不知所措，但请注意，使用进程和\
  \ supervisor 设计的技能会随着时间的推移自然增长——甚至可能成为设计新系统时你的首选方法。这一步将迫使你停下来思考系统不同部分之间的依赖关系，这将导致更简洁、更简单的设计，进而提高应用程序的可靠性。\n\
  \n让我们现在看看监督树在实际中的运行情况。对于此示例，我们将使用本章中开发的模块。然而，它们将在一个名为 `SimpleElixirDrip` 的新应用程序中使用，该应用程序是用\
  \ `mix` 工具创建的，你在上一章中了解过它（特别是，它是用 `mix new simple_elixir_drip --sup` 创建的）。与其使用真实的\
  \ `ElixirDrip` 应用程序，这会使以下示例变得杂乱，我们只需使用这个仅包含我们关心的模块的更简单版本。\n\n在下面的图表中，我们可以看到 `SimpleElixirDrip`\
  \ 应用程序中配置的监督树：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_146_0.png)\n\n如我们所见，我们使用的是已经讨论过的模块，缓存\
  \ worker 是缓存 supervisor 的子进程，加密模块是上传管道 supervisor 的子进程。此示例的新颖之处在于，现在这两个 supervisor\
  \ 都是一个名为 `SimpleElixirDrip.Supervisor` 的 supervisor 的子进程。在此应用程序中，这是根 supervisor。通常，根\
  \ supervisor 定义在 `application.ex` 文件中，这是我们应用程序的起点。请注意，如果你在用 Mix 创建新项目时使用 `--sup`\
  \ 标志，这将由生成器自动完成。\n\n我们现在将启动应用程序。在 simple_elixir_drip 目录的 shell 中，我们使用 iex -S mix\
  \ 启动应用程序并拥有一个 IEx 会话，其中包含应用程序的所有模块已编译并加载。在开始使用此 IEx 会话杀死一些进程并查看监督树的工作情况之前，让我们先使用它在\
  \ observer Erlang 工具中获取我们监督树的可视化。首先，在我们的 IEx 中，执行以下命令：\n\n```\niex> SimpleElixirDrip.Storage.Supervisors.CacheSupervisor.put(\"\
  abc\", \"def\")\n23:30:15.139 [debug] #PID<0.118.0>: CacheWorker started. Will expire\
  \ in 60000 milliseconds.\n{:ok, #PID<0.118.0>}\niex> :observer.start()\n:ok\n```\n\
  \n首先，我们使用缓存 supervisor 模块中的 put/2 函数，以便其进程监督一个子进程。然后，我们调用 :observer.start()，它将启动此工具。如果你点击\
  \ Applications 选项卡，你将看到我们之前定义的监督树映射在 observer 中，如以下屏幕截图所示：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_147_0.png)\n\
  \n这是在开发应用程序时检查你的监督树的一种便捷方式！Observer 是一个不可思议的工具，其功能远不止于展示进程树。我们将在第 11 章《Keeping an\
  \ Eye on Your Processes》中进一步探索此工具。\n\n现在，让我们回到 IEx 会话并操作监督树。如我们在前几节中讨论的，supervisor\
  \ 提供了一种从其子进程中的故障中恢复的方法，通过检测崩溃并在旧进程的位置启动新进程。如果缓存 worker 崩溃，缓存 supervisor 将检测到这一点并在其位置启动新的缓存\
  \ worker。我们还讨论过，如果子进程不断崩溃，这不会永远发生。supervisor 会根据其配置容忍一定的重启频率。如果没有提供配置（正如我们在 SimpleElixirDrip\
  \ 应用程序中的情况），supervisor 将容忍五秒窗口内的三次重启。如果超过此限制，supervisor 将终止其所有子进程，然后终止自身。\n\n让我们现在在缓存\
  \ supervisor 的一个子进程上在短时间内诱发大量故障，以便我们观察其行为：\n\n```\niex> SimpleElixirDrip.Storage.Supervisors.CacheSupervisor.put(\"\
  ghj\", \"klm\")\n00:05:36.881 [debug] #PID<0.401.0>: CacheWorker started. Will expire\
  \ in\n60000 milliseconds.\n{:ok, #PID<0.401.0>}\niex> SimpleElixirDrip.Storage.Supervisors.CacheSupervisor.get(\"\
  ghj\")\n00:05:42.253 [debug] #PID<0.401.0>: Received :get_media and served 3\nbytes\
  \ 1 times.\n{:ok, \"klm\"}\n00:05:42.253 [debug] #PID<0.401.0>: Canceled the previous\
  \ expiration timer.\nWill now expire in 60000 milliseconds.\niex> (1..4) \\\n...>\
  \ |> Enum.map(fn _ ->\n...> SimpleElixirDrip.Storage.Workers.CacheWorker.name_for(\"\
  ghj\")\n...> |> GenServer.whereis()\n...> |> Process.exit(:kill)\n...> :timer.sleep(500)\n\
  ...> end)\n00:05:50.641 [debug] #PID<0.411.0>: CacheWorker started. Will expire\
  \ in\n60000 milliseconds.\n00:05:50.843 [debug] #PID<0.412.0>: CacheWorker started.\
  \ Will expire in\n60000 milliseconds.\n00:05:51.044 [debug] #PID<0.413.0>: CacheWorker\
  \ started. Will expire in\n60000 milliseconds.\n00:05:51.244 [debug] #PID<0.414.0>:\
  \ CacheWorker started. Will expire in\n60000 milliseconds.\n[:ok, :ok, :ok, :ok]\n\
  ```\n\n我们首先将一些内容放入缓存中，然后立即获取它，只是为了证明进程是活跃的。之后，我们连续四次杀死负责我们刚刚创建的 id 的进程。由于我们现在使用的是注册进程（由别名引用），我们利用它来找到我们感兴趣的进程——再次注意，注册进程将在下一章中介绍。获得进程的\
  \ PID 后，我们通过发送退出信号来终止它。之后，我们休眠半秒钟，只是为了确保新进程已启动，然后再继续迭代的下一步。\n\n看看之后出现的调试消息。我们可以看到在我们引发的前三次崩溃中初始化了一个\
  \ CacheWorker 进程。在第四次时，supervisor意识到它已超过重启频率，并终止了其所有子进程以及自身。缓存 supervisor 的终止被根\
  \ supervisor SimpleElixirDrip.Supervisor 检测到，后者通过生成新的缓存 supervisor 来尝试从这种情况中恢复。这就是我们在监督树中寻找的行为。\n\
  \n\n\n请注意，错误的冒泡可能会持续下去，如果缓存主管崩溃的频率超过了根主管的重启频率，那么根主管将导致自身终止，从而停止我们的应用程序。\n\n正如我们所见，监督树允许我们通过尽可能在本地解决错误来最小化错误的影响。当这不可能时，错误会冒泡，下一级主管会尝试通过重启系统更宽泛的部分来解决它。\n\
  \n## 摘要\n\n在本章中，我们探讨了进程如何成为 Elixir 应用中并发和容错的关键。让我们通过回顾最重要的要点来总结本章：\n\n-   在 BEAM\
  \ 内部，进程彼此完全隔离，之间不共享内存。\n-   进程在资源方面非常轻量，允许在单台机器上创建数百万个进程。\n-   进程之间通过异步消息传递进行通信。\n\
  -   进程可以通过使用无限递归在循环中运行。此外，它还可以通过递归的参数来保持状态。\n-   进程可以使用链接或监视器检测另一个进程的崩溃。链接始终是双向的，并且默认情况下，在接收到退出信号时，会导致所有链接的进程也终止。监视器是单向的，如果被监视的进程崩溃，监视进程将收到一条消息。\n\
  -   通过捕获退出，进程能够在其中一个链接进程终止时继续运行。当进程捕获退出时，如果其中一个链接进程被终止，它将收到一条消息，从而允许它对该事件做出反应。\n\
  -   监督者是一个进程，其唯一职责是监督其他进程。当其中一个子进程崩溃时，监督者会根据其配置采取某些行动。经常情况下，监督者会启动一个新进程来替代崩溃的进程。\n\
  -   动态监督者允许我们在运行时启动子进程。我们可以配置在动态监督者下可以生成的子进程的最大数量。\n-   一个监督者可能在监督其他监督者，从而生成监督树。监督树是容错系统的重要组成部分，因为它允许我们最小化错误的影响，例如，当我们能够在树叶附近修复错误时。当这不可能时，错误会通过树冒泡，使应用程序保持一致，从而不会留下悬空进程。\n\
  \n本章包含了一些非常重要的底层构造，例如 `receive`，但它们可能不会在你的日常编码中使用。在下一章中，我们将介绍 Elixir 和 Erlang 世界中最重要的主题之一：OTP\
  \ 框架提供的抽象（以及 Elixir 提供的其他抽象）。\n"
- "# 4 由 Erlang/OTP 驱动\n\n正如我们在上一章中所看到的，一个常见的惯用法，在 Erlang 中也很常见，就是生成进程来保持状态并并发执行计算，其副作用之后可以通过某种方式检索。这种方法为你提供了无限的可能性，但更冗长且容易出错，因为它要求你从一开始就构建在现有的基本原语之上。\n\
  \n为了解决之前的问题，Erlang 的创建者决定为一些常见用例创建更高级别的抽象，并收集了在编写 Erlang 项目时应应用的推荐设计原则。因此，一组名为 **开放电信平台\
  \ (OTP)** 的库诞生了。\n\n在本章中，我们将深入探讨 Elixir 从 Erlang 继承的那些非常有用的 OTP behaviours，例如 GenServer，以及\
  \ Elixir 在其之上提供的一些抽象，例如 Agent、Task 和 Registry。除此之外，我们还将分析 **Erlang 术语存储 (ETS)**\
  \ 及其磁盘对应物，它提供了一种有用的数据存储方式。\n\n在本章中，我们将介绍以下主题：\n\n-   GenServer 如何工作以及我们如何使用它来实现一个\
  \ `CacheWorker` 进程\n-   Agent behaviour 以及它如何促进使用进程来保持状态\n-   使用 Task 模块运行异步和并行任务\n\
  -   使用 ETS 及其基于磁盘的版本高效存储和检索数据\n-   使用进程注册表命名进程以及使用 Elixir 1.4 引入的 registry\n\n##\
  \ GenServer\n\n我们现在知道 Erlang VM 允许数百万个进程各自愉快地运行，与它们通信只能通过消息交换来实现，即将消息入队到每个进程的邮箱中。\n\
  \n这种进程之间的交互可以被视为客户端-服务器交互，因为一个进程通过将消息入队到其邮箱来请求另一个进程代表它做某事。为了实现服务，服务器进程必须设计其 `receive`\
  \ 循环，在循环中传递内部状态、处理意外消息等等。在实现服务器端逻辑时，还必须提前考虑可能破坏服务器内部状态或使其陷入死锁情况、无法再处理任何请求的边缘情况。\n\
  \n在处理爱立信的电信项目时，并在实现大量服务器进程之后，爱立信的优秀人士发现了一组共同特征，这些特征总是被实现。这些模式普遍存在到足以证明为它们创建抽象是合理的，以便它们可以轻松地应用于任何地方。因此，OTP\
  \ 诞生了，定义了所谓的 OTP behaviours。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_152_0.png)\n\
  \n无论你身处大西洋的哪一边，在 Elixir 用语中，你会看到 behaviours 带 u，所以我们在这里也采用它。有趣的是，Erlang 接受两种拼写。\n\
  \n如果我们使用 `GenServer`（**通用服务器** 的简称）等 OTP behaviour 实现一个计算器服务器，我们只需要对特定的回调函数实现计算器逻辑，而\
  \ GenServer behaviour 将负责处理错误、保持状态、正确回复同步调用或对异步调用根本不回复等等，所有这些都在为我们提供在经过实战检验的代码之上提供计算器功能时的宁静和安心感，该代码在生产环境中实现了九个“九”的可用性。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_152_1.png)\n\n九个“九”，即 99.9999999% 的可用性，指的是\
  \ Erlang 在电话交换机上的使用，每周服务 4000 万次呼叫，而每年仅停机 31 毫秒。你可以查看此链接以获取有关 Erlang 的更多信息，该信息来自其创建者之一\
  \ Joe Armstrong：`http://www.rabbitmq.com/resources/armstrong.pdf`。\n\n遵循同样的方法，Elixir\
  \ 也提供了一些有用的 behaviours，允许开发人员尽可能专注于手头问题的具体细节，而不必还要考虑从头开始开发并发系统的复杂性。我们将在下一章查看一些 Elixir\
  \ behaviours。现在，让我们好好利用 GenServer behaviour。\n\n## GenServer 为您服务\n\n正如我们之前简要提到的，我们可以利用\
  \ GenServer behaviour 实现一个进程，该进程将通过定义良好的公共接口提供某种服务。为此，只需在模块中使用 GenServer 并实现必要的回调即可：\n\
  \n```\niex> defmodule Calculator do\n...>   use GenServer\n...> \n...>   def handle_call({:mult5,\
  \ number}, _from, state) do\n...>     {:reply, number*5, state}\n...>   end\n...>\
  \ end\n\n{:module, Calculator,\n <<70, 79, 82, 49, 0, 0, 12, 224, 66, 69, 65, 77,\
  \ 65, 116,\n 85, 56, 0, 0, 1, 138,\n 0, 0, 0, 42, 17, 69, 108, 105, 120, 105, 114,\
  \ 46, 67,\n 97, 108, 99, 117, 108, 97, 116, 8, 95, 95, 105, 110, ...>>,\n {:handle_call,\
  \ 3}}\n\niex> {:ok, calc} = GenServer.start_link(Calculator, [])\n{:ok, #PID<0.461.0>}\n\
  \niex> GenServer.call(calc, {:mult5, 7})\n35\n```\n\n在前面的示例中，我们定义了一个简单的 Calculator\
  \ 模块，它只知道如何回答同步的 {:mult5, number} 调用。我们知道这一点是因为它只实现了 handle_call/3 回调函数，该函数对提到的元组进行模式匹配。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_153_0.png)\n\n请记住，如果你需要更好地理解模块函数或特定回调，文档读起来很愉快，并且距离一个\
  \ IEx shell 只有一步之遥。使用 h Module.function/arity 查看函数，使用 b Module.callback/arity 查看回调。\n\
  \n\n\n我们正在启动一个 Calculator 进程并随后使用 start_link/2 和 call/2 函数调用它，这两个函数都属于 GenServer\
  \ 模块。为了查看调用计算器进程时实际发送的消息，让我们创建一个仅将收到的消息回显到 stdout 的虚拟进程：\n\n```\niex> defmodule\
  \ Echo do\n...> def echoes() do\n...> receive do\n...> message ->\n...> IO.puts\
  \ \"Echo on #{inspect(self())}: #{inspect(message)}\"\n...> end\n...> end\n...>\
  \ echoes()\n...> end\n...> end\n```\n\n```\n{:module, Echo,\n<<70, 79, 82, 49, 0,\
  \ 0, 5, 148, 66, 69, 65, 77, 65, 116,\n85, 56, 0, 0, 0, 145, 0, 0, 0, 16, 11, 69,\
  \ 108, 105,\n120, 105, 114, 46, 69, 99, 104, 111, 8, 95, 95, 105,\n110, 102, 95,\
  \ 95, 9, 102, ...>>,\n{:echoes, 0}}\n```\n\n```\niex> echo = Process.spawn(&Echo.echoes/0\
  \ , [])\n#PID<0.467.0>\n```\n\n如果我们现在使用 GenServer 通过 call/2 向 echo 进程发送同步消息，就可以看到发送的消息结构。消息的格式为\
  \ {:\"$gen_call\", from, contents}，其中元组的第二个元素是标识发送者和消息的 {pid, reference} 元组，最后一个元素是我们通过调用传递的内容。我们出现了超时，因为\
  \ GenServer.call/2 是同步的，因此调用方期望在遵守 GenServer 协议的同时得到回复，但它没有收到任何回复：\n\n```\niex>\
  \ GenServer.call(echo, {:hello, :echo})\nEcho on #PID<0.467.0>: {:\"$gen_call\"\
  , {#PID<0.448.0>,\n#Reference<0.2270275367.1586495491.177847>}, {:hello, :echo}}\n\
  \n** (exit) exited in: GenServer.call(#PID<0.467.0>, {:hello, :echo}, 5000)\n**\
  \ (EXIT) time out\n(elixir) lib/gen_server.ex:774: GenServer.call/3\n```\n\n我们现在将使用\
  \ GenServer.cast/2 发送异步请求，以便观察其消息结构。与之前的同步消息相比，它缺少标识发送者和消息的元组的第二个元素。这完全合理，因为处理请求的服务器不需要对消息进行回复。\n\
  \n我们也没有出现超时，因为我们没有等待服务器的任何响应：\n\n```\niex> GenServer.cast(echo, {:hi_again, :echo})\n\
  Echo on #PID<0.467.0>: {:\"$gen_cast\", {:hi_again, :echo}}\n:ok\n```\n\n通过使用 GenServer\
  \ behaviour，当进程异常结束时，我们可以免费获得更好的错误报告。我们还获得了默认的 child_spec 定义，以便轻松地将 GenServer 进程置于监督树下。要查看回调的完整列表，我们可以检查\
  \ IEx 建议的可能补全，从 Calculator 模块开始：\n\n```\niex> Calculator.<tab>\nchild_spec/1 code_change/3\
  \ handle_call/3 handle_cast/2\nhandle_info/2 init/1 terminate/2\n```\n\n正如以下错误输出所示，除了实际的\
  \ FunctionClauseError 之外，我们还可以了解到最后处理的邮件及其发送者、当时进程的内部状态以及有关客户端的信息，即它是否仍然存活以及调用来自何处：\n\
  \n```\niex> {:ok, calc} = GenServer.start(Calculator, [])\n{:ok, #PID<0.526.0>}\n\
  \niex> GenServer.call(calc, :unexpected)\n** (exit) exited in: GenServer.call(#PID<0.526.0>,\
  \ :unexpected, 5000)\n  ** (EXIT) an exception was raised:\n  ** (FunctionClauseError)\
  \ no function clause matching in\nCalculator.handle_call/3\n  # ...\n\n16:50:40.976\
  \ [error] GenServer #PID<0.526.0> terminating\n** (FunctionClauseError) no function\
  \ clause matching in\nCalculator.handle_call/3\n  iex:14: Calculator.handle_call(:unexpected,\
  \ {#PID<0.515.0>,\n  #Reference<0.2270275367.1586495489.187163>}, [])\n  (stdlib)\
  \ gen_server.erl:636: :gen_server.try_handle_call/4\n  (stdlib) gen_server.erl:665:\
  \ :gen_server.handle_msg/6\n  (stdlib) proc_lib.erl:247: :proc_lib.init_p_do_apply/3\n\
  Last message (from #PID<0.515.0>) : :unexpected\nState: []\nClient #PID<0.515.0>\
  \ is alive\n  (stdlib) gen.erl:169: :gen.do_call/4\n  (elixir) lib/gen_server.ex:771:\
  \ GenServer.call/3\n  (stdlib) erl_eval.erl:670: :erl_eval.do_apply/6\n  (elixir)\
  \ src/elixir.erl:239: :elixir.eval_forms/4\n  (iex) lib/iex/evaluator.ex:231: IEx.Evaluator.handle_eval/5\n\
  ```\n\n```\n(iex) lib/iex/evaluator.ex:212: IEx.Evaluator.do_eval/3\n(iex) lib/iex/evaluator.ex:190:\
  \ IEx.Evaluator.eval/3\n(iex) lib/iex/evaluator.ex:89: IEx.Evaluator.loop/1\n```\n\
  \n正如本节所见，GenServer behaviour 为我们做了大量繁重的工作。通过使用它，开发人员无需实现客户端和服务器之间的通信细节，而能够专门开发特定的服务器逻辑。让我们在\
  \ ElixirDrip 应用中使用这种行为。\n\n## Implementing a CacheWorker with GenServer\n\n我们现在将在\
  \ ElixirDrip 上实现一个 CacheWorker 进程，我们将用它来在内存中保留最近的媒体。通过使用这种缓存机制，我们希望减少文件下载所需的时间，并避免为\
  \ ElixirDrip 处理的每次下载都运行完整的下载管道。\n\n我们的 CacheWorker 将在一段时间内将一些内容保存在内存中，并与特定的缓存键关联。在我们的例子中，缓存键将是媒体的\
  \ id。由于我们不想为同一媒体生成多个缓存进程，我们还将使用媒体 id 作为进程名称。这样，如果有人尝试缓存已存在于缓存中的媒体，就会收到已存在同名进程的通知：\n\
  \n```\niex> CacheWorker.start_link(\"1\", \"content\")\n{:ok, #PID<0.468.0>}\n\n\
  iex> CacheWorker.start_link(\"1\", \"other content\")\n{:error, {:already_started,\
  \ #PID<0.468.0>}}\n```\n\n当我们使用媒体 id 和相应的内容调用 CacheWorker.start_link/2 函数时，将使用 CacheWorker\
  \ 模块、要缓存的内容以及 :name 选项调用 GenServer.start_link/3。传递给它的模块必须实现 init/1 函数回调，该回调将负责服务器的初始化。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_156_0.png)\n\n我们在注册进程时使用 {:global, {:cache,\
  \ <media_id>}} 元组，以避免为每个进程使用原子作为名称的需求。通过这种方法，每个缓存进程都将命名为 {:cache, <media_id>}。应避免将原子用作进程名称，因为它们不会被垃圾回收，因此，如果我们使用它们来标识动态生成的进程，就有达到原子最大数量的风险。你可以在本章末尾了解有关注册进程的所有信息。\n\
  \n需要注意的是，`GenServer.start_link/3` 函数调用仍由生成 `GenServer` 的进程完成，而 `init/1` 函数已在生成的服务器上运行。对\
  \ `GenServer.start_link/3` 的调用将阻塞直到 `init/1` 回调结束，因此你应检查你的 `init/1` 函数是否花费时间过长。传递给\
  \ `GenServer.start_link/3` 函数的第二个参数始终传递给 `init/1` 函数，即使生成的服务器不需要初始化参数。在我们的例子中，我们需要将媒体内容传递给\
  \ `init/1` 函数，以便生成的进程将其存储在其内部状态中。\n\n如果 `init/1` 上的初始化过程花费时间过长，只需在初始化期间向当前进程发送异步消息，然后再执行实际的服务器初始化工作，完全不阻塞生成进程。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_157_0.png)\n\n这意味着在返回 `init/1` 调用之前执行\
  \ `GenServer.cast(self(), {:initialize, some_args})`，然后在 `handle_cast({:initialize,\
  \ some_args}, _state)` 函数上执行实际的缓慢初始化过程，返回一个 `{:noreply, new_state}` 元组，其中包含新的进程状态。\n\
  \n我们还将在缓存进程上保存它提供缓存内容的次数。你可以在以下代码片段中看到 `CacheWorker` 的当前状态。它启动并将内容保存在内存中，但目前我们仍无法访问进程的内部状态，包括缓存内容：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.CacheWorker do\n  use GenServer\n\n  def start_link(media_id,\
  \ content) do\n    GenServer.start_link(__MODULE__, content, name: name_for(media_id))\n\
  \  end\n\n  defp name_for(media_id), do: {:global, {:cache, media_id}}\n\n  def\
  \ init(content) do\n    {:ok, %{hits: 0, content: content}}\n  end\nend\n```\n\n\
  缓存应允许其客户端检索其存储的内容，而我们目前的缓存不能。\n\n\n\n通过创建 handle_call/3 函数回调来修复它，该回调知道如何回复 :get_media\
  \ 消息：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.CacheWorker do\n  use GenServer\n\n  def start_link(media_id,\
  \ content) do\n    GenServer.start_link(__MODULE__, content, name: name_for(media_id))\n\
  \  end\n\n  defp name_for(media_id), do: {:global, {:cache, media_id}}\n\n  def\
  \ init(content) do\n    {:ok, %{hits: 0, content: content}}\n  end\n\n  def handle_call(:get_media,\
  \ _from, %{hits: hits, content: content} = state) do\n    {:reply, {:ok, content},\
  \ %{state | hits: hits + 1}}\n  end\nend\n```\n\n我们现在能够以以下方式获取缓存内容：\n\n```\niex>\
  \ {:ok, cache} = CacheWorker.start_link(\"3\", \"some content\")\n{:ok, #PID<0.516.0>}\n\
  \niex> GenServer.call(cache, :get_media)\n{:ok, \"some content\"}\n```\n\n我们当前的缓存版本会永久驻留在内存中，而不是在一段时间后过期。它只有在我们显式终止时才会停止。我们需要的是一个过期机制。让我们在进程启动时向其自身发送一条延迟的\
  \ :expire 消息，然后当该消息实际到达时，我们将正常终止缓存进程：\n\n```\niex> timer = Process.send_after(self(),\
  \ :a_10min_delayed_message, 600_000)\n#Reference<0.1448220797.3761766401.179853>\n\
  \niex> Process.read_timer(timer)\n574847\n\niex> Process.cancel_timer(timer)\n554295\n\
  \niex> Process.cancel_timer(timer)\nfalse\n```\n\n如果媒体现在被访问，它可能在之后立即再次被访问。因此，每当发生缓存命中时，我们也希望推迟发送\
  \ :expire 消息。我们将采用与前一个示例类似的方法，通过保存 Process.send_after/3 返回的引用，以便稍后可以取消它，并在缓存命中时发出新的延迟\
  \ :expire 消息。\n\n在添加过期机制后，我们的缓存如下所示：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.CacheWorker do\n  use GenServer\n\n  @expire_time\
  \ 60_000\n\n  def start_link(media_id, content) do\n    GenServer.start_link(__MODULE__,\
  \ content, name: name_for(media_id))\n  end\n\n  def name_for(media_id), do: {:global,\
  \ {:cache, media_id}}\n\n  def init(content) do\n    timer = Process.send_after(self(),\
  \ :expire, @expire_time)\n    {:ok, %{hits: 0, content: content, timer: timer}}\n\
  \  end\n\n  def handle_info(:expire, %{hits: hits} = state) do\n    IO.puts \"#{inspect(self())}:\
  \ Terminating cache, served #{hits} hits\"\n    {:stop, :normal, state}\n  end\n\
  \n  def handle_info(msg, state), do: super(msg, state)\n\n  def get_media(pid),\
  \ do: GenServer.call(pid, :get_media)\n\n  def handle_call(:get_media, _from, %{hits:\
  \ hits, content: content, timer: timer} = state) do\n    {:reply, {:ok, content},\
  \ %{state | hits: hits + 1, timer: refresh_timer(timer)}}\n  end\n\n  defp refresh_timer(timer)\
  \ do\n    Process.cancel_timer(timer)\n    Process.send_after(self(), :expire, @expire_time)\n\
  \  end\nend\n```\n\n你可能已经注意到，我们正在使用 `handle_info/2` 函数回调来处理 `:expire` 消息，而不是我们到目前为止使用的\
  \ `call` 和 `cast` 回调。这是因为当我们执行 `Process.send_after/3` 时，我们发送的是 *plain* 消息，而不是由 GenServer\
  \ 行为定制的消息。所有不遵循 GenServer 消息协议的消息都将由可用的 `handle_info/2` 回调处理，包括我们的 `:expire` 消息。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_160_0.png)\n\n对于所有其他 *plain* 消息，我们 simply\
  \ 委托给默认的 `handle_info/2` GenServer 实现。这也很重要，因为诸如 `{:EXIT, _, _}` 和 `{:DOWN, _, _,\
  \ _, _}` 之类的消息元组可能会发送到你的 GenServer 进程。当你在捕获退出时尝试使用 `Process.exit/2` 结束它时，你的进程会收到第一条消息。当你的进程监视另一个进程并且后者因任何原因退出时，`:DOWN`\
  \ 消息会到达你的进程。如果你不想自己显式处理这些 `:EXIT` 和 `:DOWN` 消息，让默认的 `handle_info/2` 为你处理即可。\n\n\
  让我们看看我们的过期机制现在是如何工作的：\n\n```\niex> alias ElixirDrip.Storage.Workers.CacheWorker\n\
  ElixirDrip.Storage.Workers.CacheWorker\n\niex> CacheWorker.start_link(\"5\", \"\
  some content\")\n{:ok, #PID<0.904.0>}\n\n#PID<0.904.0>: Terminating cache, served\
  \ 0 hits # after a minute\n\niex> {:ok, cache} = CacheWorker.start_link(\"6\", \"\
  other content\")\n{:ok, #PID<0.906.0>}\n\niex> 1..3 |> Enum.map(fn _ -> GenServer.call(cache,\
  \ :get_media) end)\n[ok: \"other content\", ok: \"other content\", ok: \"other content\"\
  ]\n\n#PID<0.906.0>: Terminating cache, served 3 hits # after a minute\n```\n\n在此基础上，我们还可以添加一种无需检索其内容即可刷新缓存的方法。这将允许我们通过使用\
  \ `GenServer.cast(cache_pid, :refresh)` 发送异步 `:refresh` 消息来刷新缓存：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.CacheWorker do\n  use GenServer\n  # ...\n\
  \  def handle_cast(:refresh, %{timer: timer} = state),\n    do: {:noreply, %{state\
  \ | timer: refresh_timer(timer)}}\n```\n\n```\n# ...\nend\n```\n\n我们现在有一个合适的缓存工作进程，可以存储我们抛给它的任何内容。我们只是没有讨论一个小细节：为什么我们称它为工作进程？将受监督的进程命名为\
  \ worker 是一个常见的惯用法。在我们的例子中，每个缓存进程都由其自己的 CacheSupervisor 监督，因此得名 CacheWorker。这将是我们在上一章中讨论的动态监督的一个例子，因为在应用程序启动时不会存在任何缓存进程，我们将在运行时根据需要逐步生成进程。\n\
  \n我们现在将在我们的 supervisor 中添加两个函数，CacheSupervisor.put/2 和 CacheSupervisor.get/1，它们将生成一个新的缓存进程（如果不存在相同\
  \ media id 的进程）并从现有缓存进程中检索缓存的媒体内容。后者依赖于我们之前创建的 CacheWorker.name_for/1 函数，并根据 media\
  \ id 为我们提供为每个进程使用的名称元组：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/supervisors/cache_supervisor.ex\n\
  defmodule ElixirDrip.Storage.Supervisors.CacheSupervisor do\n  use DynamicSupervisor\n\
  \  alias ElixirDrip.Storage.Workers.CacheWorker\n  # ...\n  def put(id, content)\n\
  \    when is_binary(id) and is_bitstring(content) do\n    DynamicSupervisor.start_child(\n\
  \      __MODULE__,\n      cache_worker_spec(id, content)\n    )\n  end\n\n  def\
  \ get(id) when is_binary(id) do\n    case find_cache(id) do\n      nil -> nil\n\
  \      pid -> CacheWorker.get_media(pid)\n    end\n  end\n\n  def find_cache(id)\
  \ when is_binary(id) do\n    GenServer.whereis(CacheWorker.name_for(id))\n  end\n\
  end\n```\n\n让我们现在分析 Elixir 引入的一个抽象，以简化创建单一目的为保持内部状态的服务器。\n\n## Agent\n\n正如我们在上一节中所看到的，GenServer\
  \ 允许你创建一个服务器进程，可以处理与其客户端的同步和异步交互，同时还提供了一种使用 handle_info/2 回调处理其他类型的低级消息（使用 Process.send/3\
  \ 发送）的方法。\n\n然而，有时你可能不想控制通信是同步还是异步。你不需要处理带外消息，你只想生成一个进程，该进程能够正确地在其内部状态中存储信息，并在需要时共享它。在这种情况下，GenServer\
  \ 对于手头的任务来说显得过于复杂。\n\n相反，你可以使用 Agent 来完成它。把它想象成一个专门用于执行内部状态管理的 GenServer。让我们尝试将我们的\
  \ CacheWorker 实现为一个 Agent，看看效果如何。\n\n我们的 AgentCacheWorker 将像之前的 GenServer 版本一样，保持一个映射，其中\
  \ hits 作为提供缓存内容的次数的计数器，content 条目为内容本身。我们将公开一个 get_media/1 模块函数，与我们为 CacheWorker\
  \ 提供的类似，以便我们的客户端可以轻松地从 agent 状态中检索内容：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/agent_cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.AgentCacheWorker do\n  use Agent\n  alias ElixirDrip.Storage.Workers.CacheWorker\n\
  \n  def start_link(media_id, content) do\n    Agent.start_link(fn ->\n      %{hits:\
  \ 0, content: content}\n    end, name: CacheWorker.name_for(media_id))\n  end\n\n\
  \  def get_media(pid),\n    do: Agent.get(pid,\n      fn (%{hits: hits, content:\
  \ content}) ->\n        hits = hits + 1\n        content\n      end)\nend\n```\n\
  \n如果我们现在尝试我们的缓存 agent，看起来它工作完美无缺。但最终，当我们求助于 Agent.get/2 来查看 agent 的完整内部状态时，我们会发现\
  \ hits 的数量在我们三次访问后并未更新：\n\n```\niex> alias ElixirDrip.Storage.Workers.AgentCacheWorker,\
  \ as: AgentCache\nElixirDrip.Storage.Workers.AgentCacheWorker\n\niex> {:ok, agent}\
  \ = AgentCache.start_link(\"1\", \"content\")\n{:ok, #PID<0.473.0>}\n\niex> 1..3\
  \ |> Enum.map(fn _ -> AgentCache.get_media(agent) end)\n[\"content\", \"content\"\
  , \"content\"]\n\niex> Agent.get(agent, &(&1))\n%{content: \"content\", hits: 0}\n\
  ```\n\n让我们通过将 Agent.get/2 函数改为 Agent.get_and_update/2 来修复前面的问题，并将 lambda 的返回值改为包含两个元素的元组，其中第一个是返回给客户端的值，第二个是新的状态值，这次\
  \ hits 条目会递增：\n\n```\ndefmodule ElixirDrip.Storage.Workers.AgentCacheWorker do\n\
  \  use Agent\n  alias ElixirDrip.Storage.Workers.CacheWorker\n  # ...\n  def get_media(pid),\n\
  \    do: Agent.get_and_update(pid,\n      fn (%{hits: hits, content: content} =\
  \ state) ->\n        {state.content, %{state | hits: hits + 1}}\n      end)\nend\n\
  ```\n\n如果我们现在使用 Agent.get_and_update/2 从一个新 agent 获取内容，就能得到正确的 hits 数量：\n\n```\n\
  iex> {:ok, agent2} = AgentCache.start_link(\"2\", \"other content\")\n{:ok, #PID<0.539.0>}\n\
  \niex> 1..3 |> Enum.map(fn _ -> AgentCache.get_media(agent2) end)\n[\"other content\"\
  , \"other content\", \"other content\"]\n\niex> Agent.get(agent, &(&1))\n%{content:\
  \ \"other content\", hits: 3}\n```\n\n需要注意的一点是，我们作为第二个参数传递的 lambda 在 Agent 进程上运行，因此在\
  \ lambda 执行期间，agent 会将其他请求挂起。如果你希望 Agent 状态能被多个客户端更新，你应该始终在服务器进程上执行状态更新（在 lambda\
  \ 函数作用域内执行）。这样可以避免竞态条件，即在你忙于确定新状态时，agent 状态可能被另一个客户端更新。\n\n乍一看，在所有相关方面，我们的 AgentCacheWorker\
  \ 看起来与它的 CacheWorker 对应物做的事情一样。我们可以通过 start_link/2 启动它，传入媒体 id 和其内容，并可以使用 AgentCacheWorker.get_media/1\
  \ 函数获取缓存内容。然而，我们的 agent 进程会永远存活，因为我们没有实现过期机制。我们可能设计的任何过期机制都必须在 agent 之外，因为正如我们将看到的，Agent\
  \ 无法使用 handle_info/2 回调处理带外消息。如果我们像下面这样为 AgentCacheWorker 添加 handle_info/2 函数，它仍然无法处理通过\
  \ Process.send/3 发送的消息：\n\n```elixir\ndefmodule ElixirDrip.Storage.Workers.AgentCacheWorker\
  \ do\n  use Agent\n  alias ElixirDrip.Storage.Workers.CacheWorker\n  # ...\n  def\
  \ handle_info(message, state) do\n    Logger.debug(\"#{inspect(self())} Just got\
  \ an OOB message: #{message}\")\n    {:noreply, state}\n  end\nend\n```\n\n如果我们向\
  \ AgentCacheWorker 进程发送 :oob_message，我们将在 IEx shell 上收到错误消息，提示该消息未被预期，即使 handle_info/2\
  \ 已在模块上定义：\n\n```\niex> {:ok, agent} = AgentCache.start_link(\"6\", \"alchemy for\
  \ beginners\")\n{:ok, #PID<0.475.0>}\n\niex> Process.send(agent, :oob_message, [])\n\
  :ok\n\n22:24:07.362 [error] Agent.Server #PID<0.475.0> received unexpected\nmessage\
  \ in handle_info/2: :oob_message\n```\n\n因此，使用 Process.send_after/3 和 handle_info/2\
  \ 函数回调的优雅过期机制在 Agent 进程中不起作用。一种可行但可能过于复杂的替代方案是在 Agent 初始化期间生成一个链接进程，该进程随后依赖 Process.send_after/3\
  \ 函数向自身发送一个 :expire 消息。收到此消息后，进程将执行 Process.exit(agent, :expired)。由于 agent 没有预期\
  \ :expired 退出信号并且未捕获退出，它将简单地以 :expired 原因退出。\n\n我们将之前的建议留作读者的练习。请记住，如果手头的抽象从一开始就不能提供你所需的灵活性，有时最好一开始就避免使用它。查看我们的\
  \ `Agent` 示例，由于我们希望在一段时间后使缓存内容过期，选择 `GenServer` 路线更简单。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_165_0.png)\n\
  \n> 你写的代码越少，引入 bug 的概率就越小。在 Elixir 中，如果你尽可能多地依赖 OTP 抽象，你就能很好地保持代码在未来几年内以最少的中断运行。\n\
  \n我们现在将查看 `Task` 模块以及它如何允许我们并行执行一次性计算，并在需要时等待其结果。\n\n## 任务\n\n正如我们之前看到的，在 Elixir\
  \ 中生成进程成本很低，因为我们始终处于 BEAM 的领域。这为我们提供了在需要时随时生成进程的完美条件。如果你需要并行做某事，可以生成一个进程。如果你需要并行做很多事，可以生成很多进程。虚拟机不会感到吃力，你很快就会拥有一支进程大军来完成你需要的任何任务。\n\
  \n然而，进程通信很繁琐，因此如果你需要这些并行计算的结果，你必须通过消息传递接收结果，并在之后终止进程。\n\n在这种情况下，我们可以借助 `Task` 模块，使用其\
  \ `Task.async/1` 函数生成任务，然后在需要之前生成任务的结果时使用 `Task.await/1`。\n\n假设我们想告诉用户他们相对于当前使用的磁盘空间的排名。获取每个用户的磁盘空间可能是一次昂贵的查询，因此我们希望将其卸载到并行任务中，并在真正需要时才查看这些值：\n\
  \n```\ndisk_space_by_user_task = Task.async(fn ->\n  # expensive query\n  [\n  \
  \  %{user_id: 4, disk_space: 600},\n    %{user_id: 2, disk_space: 123},\n    %{user_id:\
  \ 1, disk_space: 1024},\n    %{user_id: 5, disk_space: 50},\n    %{user_id: 3, disk_space:\
  \ 0.5}\n  ]\nend)\n\n# performing other work here\n\n{%{disk_space: disk_space},\
  \ user_rank} = disk_space_by_user_task\n|> Task.await(timeout)\n|> Enum.sort(&(&1.disk_space\
  \ <= &2.disk_space))\n|> Enum.with_index(1)\n|> Enum.find(&(elem(&1, 0).user_id\
  \ == current_user))\n\nNotifications.send(current_user, \"You're using #{disk_space}\
  \ MB, making you the \\##{user_rank} user in terms of disk usage.\")\n```\n\n在前面的示例中，我们将昂贵的查询委托给异步\
  \ Task，因此当前进程可以继续工作，直到真正需要任务结果。当需要任务结果继续时，进程会尝试使用 Task.await/2 获取它们。如果任务在超时到期前未返回，当前进程将退出，因此在我们的例子中，我们可以确定如果磁盘使用统计数据未到达，就不会发送通知。\n\
  \n注意当前进程在 Task.await/2 调用处如何有效地停止等待。我们如何生成多个任务然后聚合它们的结果？不用多说，让我们深入探讨并行任务。\n\n##\
  \ 并行任务\n\n为了帮助我们理解任务的工作方式，我们需要一种惰性缓存机制。为此，让我们定义一个 SlowCacheSupervisor 进程，它将 put/2\
  \ 和 get/1 委托给已引入的良好行为的 CacheSupervisor，但在那之前，它会休眠与接收到的媒体 id 相等秒数的时间：\n\n```elixir\n\
  defmodule ElixirDrip.Storage.Supervisors.SlowCacheSupervisor do\n  @behaviour ElixirDrip.Behaviours.CacheSupervisor\n\
  \n  alias ElixirDrip.Storage.Supervisors.CacheSupervisor, as: RealCache\n\n  def\
  \ put(id, content), do: RealCache.put(id, content)\n\n  def get(id) do\n    secs_to_nap\
  \ = case Integer.parse(id) do\n      {sleep_time, _} -> sleep_time\n      _ -> 1\n\
  \    end\n\n    Process.sleep(secs_to_nap * 1000)\n    RealCache.get(id)\n  end\n\
  \  # ...\nend\n```\n\n我们现在想要为我们的应用程序创建一个并行文本搜索。此 Search 模块将公开一个 search_for/2 函数，它将接收媒体标识符列表（或单个媒体\
  \ id）和一个表达式，并为给定表达式搜索每个媒体内容。我们假设我们需要的所有媒体都已存在于缓存中。\n\n这里最小的工作单元由在单个媒体上执行搜索的函数完成。它从缓存中获取内容，将其拆分为行，然后使用\
  \ Stream.with_index/1 将每一行与其行号配对。之后，我们对刚刚创建的流进行归约，如果在当前行找到表达式，则将包含行号和内容的元组添加到结果列表中：\n\
  \n```elixir\ndefmodule ElixirDrip.Storage.Search do\n  alias ElixirDrip.Storage.Supervisors.SlowCacheSupervisor,\
  \ as: Cache\n  # ...\n  def search_for(media_id, expression) do\n    raw_content_lines\
  \ = media_id\n      |> Cache.get()\n      |> elem(1)\n      |> String.split(\"\\\
  n\")\n\n    result = raw_content_lines\n    |> Stream.with_index()\n    |> Enum.reduce(\n\
  \      [],\n      fn({content, line}, accum) ->\n        case found?(expression,\
  \ content) do\n          nil -> accum\n          _ -> accum ++ [{line + 1, content}]\n\
  \        end\n      end)\n\n    {media_id, result}\n  end\n\n  defp found?(expression,\
  \ content) do\n    regex = ~r/#{expression}/\n    Regex.run(regex, content, return:\
  \ :index)\n  end\nend\n```\n\n\n\n我们现在将实现我们的第一个搜索，恰当地命名为 naive_search_for/2，因为它只是依次搜索每一件媒体：\n\
  \n```\ndefmodule ElixirDrip.Storage.Search do\n  # ...\n  def naive_search_for(media_ids,\
  \ expression) when is_list(media_ids) do\n    media_ids\n    |> Enum.map(&search_for(&1,\
  \ expression))\n    |> Enum.into(%{})\n  end\nend\n```\n\n前面的实现完全没有利用 Elixir 轻松创建数百万个进程的特性。让我们填充缓存数据，以便我们可以实现改进的搜索：\n\
  \n```\niex> alias ElixirDrip.Storage.Supervisors.SlowCacheSupervisor, as: Cache\n\
  ElixirDrip.Storage.Supervisors.SlowCacheSupervisor\n\niex> fill_cache = fn (how_many,\
  \ offset) ->\n...> offset..(offset + (how_many-1))\n...> |> Enum.each(&Cache.put(to_string(&1),\
  \ \"Media content #{&1}.\"))\n...> end\n#Function<12.99386804/2 in :erl_eval.expr/5>\n\
  \niex> fill_cache.(3, 6)\n14:17:40.483 [debug] Spawning a slow cache for 6, content\
  \ size: 16 bytes.\n14:17:40.485 [debug] #PID<0.452.0>: CacheWorker started. Will\
  \ expire in a while.\n14:17:40.485 [debug] Spawning a slow cache for 7, content\
  \ size: 16 bytes.\n14:17:40.485 [debug] #PID<0.453.0>: CacheWorker started. Will\
  \ expire in a while.\n14:17:40.485 [debug] Spawning a slow cache for 8, content\
  \ size: 16 bytes.\n14:17:40.485 [debug] #PID<0.454.0>: CacheWorker started. Will\
  \ expire in a while.\n:ok\n```\n\n使用之前的代码片段，我们在缓存中存储了三个 id 为 \"6\"、\"7\" 和 \"8\"\
  \ 的文件。如果我们随后并行从缓存中检索这些文件，我们将不得不等待八秒钟才能获取这三个文件的内容。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_168_0.png)\n\
  \n回想一下，SlowCacheSupervisor.get/1 函数会休眠媒体 id 所指示的秒数。如果我们并行调用此函数，所有调用返回所需的时间等于最慢调用所需的时间。\n\
  \n我们的改进搜索将为每次搜索生成一个任务，然后再等待所有任务完成。请注意，我们使用的是 Task.async/3 函数，它接收模块、函数名和参数，而不是像之前那样使用\
  \ lambda：\n\n```\ndefmodule ElixirDrip.Storage.Search do\n  # ...\n  def task_search_for(media_ids,\
  \ expression, timeout \\\\ 10_000) when\n  is_list(media_ids) do\n    media_ids\n\
  \    |> Enum.map(&Task.async(__MODULE__, :search_for, [&1, expression]))\n    |>\
  \ Enum.map(&Task.await(&1, timeout))\n  end\nend\n```\n\n你可以在以下代码中看到它的表现。完整的调用花费了八秒钟才返回结果：启动后\
  \ 1 毫秒，每个任务尝试获取缓存内容，然后三个缓存工作进程在 6、7 和 8 秒后作出响应：\n\n```\niex> Logger.debug \"#{inspect(self())}\
  \ Start\"; ElixirDrip.Utils.measure(fn -> Search.task_search_for_verbose([\"8\"\
  , \"7\", \"6\"], \"media\") end)\n\n09:57:04.368 #PID<0.613.0> Start\n\n09:57:04.369\
  \ #PID<0.613.0> Spawned a search for 8, PID: #PID<0.740.0>\n09:57:04.369 #PID<0.613.0>\
  \ Spawned a search for 7, PID: #PID<0.741.0>\n09:57:04.369 #PID<0.613.0> Spawned\
  \ a search for 6, PID: #PID<0.742.0>\n\n09:57:04.369 #PID<0.613.0> Will now wait\
  \ for task PID: #PID<0.740.0>\n\n09:57:04.369 Fetching cached content for 8...\n\
  09:57:04.369 Fetching cached content for 7...\n09:57:04.369 Fetching cached content\
  \ for 6...\n\n09:57:10.370 #PID<0.560.0>: Received :get_media and served '\"Content\
  \ of media 6.\"' bytes 1 times.\n09:57:11.370 #PID<0.561.0>: Received :get_media\
  \ and served '\"Content of media 7.\"' bytes 1 times.\n09:57:12.370 #PID<0.562.0>:\
  \ Received :get_media and served '\"Content of media 8.\"' bytes 1 times.\n\n09:57:12.371\
  \ #PID<0.613.0> Task PID: #PID<0.740.0> returned with 1 result(s) for 8\n09:57:12.371\
  \ #PID<0.613.0> Will now wait for task PID: #PID<0.741.0>\n\n09:57:12.371 #PID<0.613.0>\
  \ Task PID: #PID<0.741.0> returned with 1 result(s) for 7\n09:57:12.371 #PID<0.613.0>\
  \ Will now wait for task PID: #PID<0.742.0>\n```\n\n```\n09:57:12.371 #PID<0.613.0>\
  \ Task PID: #PID<0.742.0> returned with 1\nresult(s) for 6\n\n09:57:12.372 Took:\
  \ 8.002136 secs\n```\n\n一切看起来都不错；只是请注意，我们是依次等待每个任务完成，因此只有在当前 Task.await/1 调用返回时，我们才会为下一个任务运行\
  \ Task.await/1。这就是为什么我们立即看到 shell 进程 <0.613.0> 等待第一个任务（PID 为 <0.740.0>），但随后它要等到八秒后、第一个任务返回后，才对剩余任务执行相同的操作。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_170_0.png)\n\n在前一个示例中调用的 task_search_for_verbose/2\
  \ 函数等同于 task_search_for/2 函数，只是添加了对 Logger.debug/1 的调用，因此我们可以观察底层发生的情况。\n\n现在，考虑以下情况：我们必须在\
  \ 10 秒后返回，无论如何，并且缓存中有一个 id 为 \"25\" 的非常大的文件，因此从我们的慢速缓存中获取它需要 25 秒。如果我们调用 Search.task_search_for([\"\
  8\", \"25\"], \"media\")，它将终止当前进程（该进程生成了两个搜索任务），因为第二个任务在超时之前没有结束（并且我们没有捕获退出）。然而，正如你在以下代码中看到的，它在\
  \ 18 秒后结束，因为它等待了八秒钟让第一个任务完成，然后在 Task.await/1 对第二个任务的调用返回之前，又阻塞了另外 10 秒（await/1 调用上通过的超时）：\n\
  \n```\niex> Logger.debug \"#{inspect(self())} Start\"; ElixirDrip.Utils.measure(fn\
  \ -> Search.task_search_for_verbose([\"8\", \"25\"], \"media\") end)\n```\n\n```\n\
  12:10:06.878 #PID<0.613.0> Start\n\n12:10:06.878 #PID<0.613.0> Spawned a search\
  \ for 8, PID: #PID<0.947.0>\n12:10:06.878 #PID<0.613.0> Spawned a search for 25,\
  \ PID: #PID<0.948.0>\n12:10:06.878 #PID<0.613.0> Will now wait for task PID: #PID<0.947.0>\n\
  12:10:06.878 Fetching cached content for 8...\n12:10:06.878 Fetching cached content\
  \ for 25...\n\nSeconds elapsed: 1 secs\n# ...\nSeconds elapsed: 7 secs\n\n12:10:14.879\
  \ #PID<0.562.0>: Received :get_media and served '\"Content of media 8.\"' bytes\
  \ 1 times.\n12:10:14.882 #PID<0.613.0> Task PID: #PID<0.947.0> returned with 1\n\
  result(s) for 8\n```\n\n```\n12:10:14.882 #PID<0.613.0> Will now wait for task PID:\
  \ #PID<0.948.0>\n\nSeconds elapsed: 8 secs\n# ...\nSeconds elapsed: 17 secs\n\n\
  ** (exit) exited in: Task.await(%Task{owner: #PID<0.613.0>, pid: #PID<0.948.0>,\
  \ ref: #Reference<0.3922080717.158334979.65414>}, 10000)\n  ** (EXIT) time out\n\
  \  (elixir) lib/task.ex:493: Task.await/2\n  (elixir_drip) lib/elixir_drip/storage/search.ex:34:\
  \ anonymous fn/1 in ElixirDrip.Storage.Search.task_search_for_verbose/2\n  (elixir)\
  \ lib/enum.ex:1294: Enum.\"-map/2-lists^map/1-0-\"/2\n  (elixir) lib/enum.ex:1294:\
  \ Enum.\"-map/2-lists^map/1-0-\"/2\n  (elixir_drip) lib/elixir_drip/utils.ex:19:\
  \ anonymous fn/1 in ElixirDrip.Utils.safe_function/1\n  (stdlib) timer.erl:166:\
  \ :timer.tc/1\n  (elixir_drip) lib/elixir_drip/utils.ex:11: ElixirDrip.Utils.measure/1\n\
  ```\n\n如果我们想使用之前的方法在一段时间后超时，我们需要跟踪到超时的剩余时间，并相应地等待每个任务。幸运的是，生成并行任务是并发编程中非常常见的模式，因此\
  \ Elixir 1.4 引入了 Task.async_stream 函数，它让我们能够（在其他不错的功能中）为其生成的所有任务设置单个超时。\n\nTask.async_stream\
  \ 函数将生成一个新的进程，并将其链接到当前进程，然后此中间进程将生成所有必需的任务，并在任务完成后聚合任务结果。我们仍然在 Task 领域，因此默认行为应该很熟悉：如果生成的任务超时或意外死亡，其退出信号将被发送到中间进程，然后该进程将终止剩余任务并将退出信号传播到原始进程。\n\
  \n现在让我们使用 Task.async_stream/5 函数实现我们的文本搜索功能，这样我们就可以确保它只等待 10 秒钟获取任务结果。此函数赋予我们与 Stream\
  \ 模块关联的语义，因为每个任务将是惰性执行的。默认情况下，同时运行的任务数量由 VM 中的调度程序数量决定。我们也可以通过 :max_concurrency\
  \ 选项来控制这一点。将此方法与之前的方法进行比较，在之前的方法中，我们预先生成了所有任务，而不考虑可用调度程序的数量。如果每个任务都需要使用有限的资源，例如数据库连接，那么使用许多任务的急切方法可能会迅速耗尽可用资源池：\n\
  \n```\ndefmodule ElixirDrip.Storage.Search do\n  # ...\n  def task_stream_search_for(media_ids,\
  \ expression, concurrency\n```\n\n```\n\\\\ 4, timeout \\\\ 10_000) when is_list(media_ids)\
  \ do\n  options = [max_concurrency: concurrency, timeout: timeout]\n\n  media_ids\n\
  \  |> Task.async_stream(__MODULE__, :search_for, [expression],\n  options)\n  |>\
  \ Enum.map(&elem(&1, 1))\n  |> Enum.into(%{})\nend\nend\n```\n\nTask.async_stream/5\
  \ 函数除了 :max_concurrency 和 :timeout 选项外，还接收一个集合以及每个任务将处理的模块、函数和附加参数。集合中的每个元素都将作为第一个参数传递给函数。在我们的例子中，每次调用的第一个参数将是\
  \ media id，而我们将把搜索表达式作为最后一个参数传递。每个任务都会产生一个 {:ok, result} 元组，因此我们在将其注入到映射之前，会从每个元组的结果中提取最后一个元素：\n\
  \n```\niex> Logger.debug \"#{inspect(self())} Start\"; ElixirDrip.Utils.measure(fn\
  \ -> Search.task_stream_search_for([\"6\", \"7\", \"8\"], \"media\") end)\n\n07:04:42.859\
  \ #PID<0.883.0> Start\n\n07:04:50.801 Took: 8.01131 secs\n```\n\n正如我们之前看到的，Task.async_stream\
  \ 函数具有相同的 Task 语义，因此如果任何任务超时，退出信号将被传播到生成这些任务的进程。由于我们没有捕获退出，该进程将与所有其他任务一起退出，而此时这些任务可能已经完成。你可以在下面的代码中看到，生成两个任务的结果分别需要\
  \ 25 秒和 8 秒，超时时间为 10 秒：\n\n```\niex> Logger.debug \"#{inspect(self())} Start\";\
  \ ElixirDrip.Utils.measure(fn -> Search.task_stream_search_for([\"25\", \"8\"],\
  \ \"media\") end)\n\n07:23:00.315 #PID<0.883.0> Start\n\n07:23:00.321 Fetching cached\
  \ content for 25...\n07:23:00.321 Fetching cached content for 8...\n\nSeconds elapsed:\
  \ 1 secs\n# ...\nSeconds elapsed: 7 secs\n```\n\n```\n07:23:08.252 #PID<0.895.0>:\
  \ Received :get_media and served\n\"Content of media 8.\" bytes 7 times.\n\nSeconds\
  \ elapsed: 8 secs\nSeconds elapsed: 9 secs\n\n** (exit) exited in: Task.Supervised.stream(10000)\n\
  \  ** (EXIT) time out\n(elixir) lib/task/supervised.ex:269: Task.Supervised.stream_reduce/7\n\
  (elixir) lib/enum.ex:1919: Enum.map/2\n(elixir_drip) lib/elixir_drip/storage/search.ex:44:\n\
  ElixirDrip.Storage.Search.task_stream_search_for/4\n(stdlib) timer.erl:166: :timer.tc/1\n\
  (elixir_drip) lib/elixir_drip/utils.ex:13: ElixirDrip.Utils.measure/1\n\nSeconds\
  \ elapsed: 10 secs\n```\n\n我们想要的是在 10 秒后返回我们已有的结果，而不是因为某个任务在截止时间前未结束而完全不返回。对于这种情况，我们有\
  \ :on_timeout 选项。其默认值是 :exit，意味着它会传播来自任务的退出信号，因此生成任务的进程也会退出。这就是我们刚刚观察到的行为。我们也可以将其设为\
  \ :kill_task，这样耗时过长的任务就会被简单地终止。当任务以这种方式被终止时，它产生的结果始终是一个 {:exit, :timeout} 元组，而不是成功的\
  \ {:ok, result}：\n\n```\ndefmodule ElixirDrip.Storage.Search do\n  # ...\n  def\
  \ safe_task_stream_search_for(media_ids, expression, concurrency \\\\ 4, timeout\
  \ \\\\ 10_000) when is_list(media_ids) do\n    options = [max_concurrency: concurrency,\
  \ timeout: timeout,\n    on_timeout: :kill_task]\n\n    media_ids\n    |> Task.async_stream(__MODULE__,\
  \ :search_for, [expression],\n    options)\n    |> Enum.map(&elem(&1, 1))\n    |>\
  \ Enum.reject(&(&1 == :timeout))\n    |> Enum.into(%{})\n  end\nend\n```\n\n请记住，针对\
  \ media \"25\" 的搜索任务超时，因此它产生了一个 {:exit, :timeout} 元组，该元组在返回结果之前会通过 Enum.reject/2\
  \ 调用进行过滤。使用这个版本，对 media id 为 \"25\"、\"8\"、\"6\" 和 \"7\" 的搜索在 10 秒后产生以下结果：\n\n```\n\
  iex> Logger.debug \"#{inspect(self())} Start\";\nSearch.safe_task_stream_search_for([\"\
  25\", \"8\", \"6\", \"7\"], \"media\")\n\n10:14:06.861 #PID<0.463.0> Start\n\n10:14:06.873\
  \ Fetching cached content for 25...\n10:14:06.873 Fetching cached content for 8...\n\
  10:14:06.873 Fetching cached content for 6...\n10:14:06.874 Fetching cached content\
  \ for 7...\n\n# ...\nSeconds elapsed: 6 secs\n10:14:12.874 #PID<0.473.0>: Received\
  \ :get_media and served\n\"Content of media 6.\" bytes 1 times.\n\n10:14:13.868\
  \ Seconds elapsed: 7 secs\n10:14:13.874 #PID<0.474.0>: Received :get_media and served\n\
  \"Content of media 7.\" bytes 1 times.\n\n10:14:14.869 Seconds elapsed: 8 secs\n\
  10:14:14.874 #PID<0.475.0>: Received :get_media and served\n\"Content of media 8.\"\
  \ bytes 1 times.\n\n# ...\n10:14:16.871 Seconds elapsed: 10 secs\n\n%{\n  \"6\"\
  \ => [{1, \"Content of media 6.\"}],\n  \"7\" => [{1, \"Content of media 7.\"}],\n\
  \  \"8\" => [{1, \"Content of media 8.\"}]\n}\n```\n\n我们终于可以观察到文本搜索的结果：对于每个 media\
  \ id，它返回一个包含匹配搜索表达式的行号和内容的列表。它始终在我们定义的时间范围内返回，因此我们可以向用户提供更迅速的结果。\n\n让我们现在看看如何使用随\
  \ Erlang/OTP 提供的 ETS 工具来存储在 ElixirDrip 上执行的文本搜索结果。\n\n## 使用 (D)ETS\n\n在上一节中，我们使用\
  \ Task.async_stream/5 实现 ElixirDrip 文本搜索功能，以便同时搜索多个文本文件。文本搜索函数位于 ElixirDrip.Storage.Search\
  \ 模块中，其最后一个迭代可以这样使用：\n\n```\niex> alias ElixirDrip.Storage.Search\n\niex> media_ids\
  \ = [\"25\", \"8\", \"6\", \"7\"]\n\niex> search_expression = \"media\"\n\niex>\
  \ Search.safe_task_stream_search_for(media_ids,\nsearch_expression)\n\n%{\n  \"\
  6\" => [{1, \"Content of media 6.\"}],\n  \"7\" => [{1, \"Content of media 7.\"\
  }],\n  \"8\" => [{1, \"Content of media 8.\"}]\n}\n```\n\n它返回一个映射，其中包含在分配时间内结束搜索的每个搜索文件的条目。对于每个\
  \ media id，它产生一个由两个元素组成的元组列表，其中第一个元组元素对应于找到表达式的行，第二个元素包含该行的实际内容。\n\n请记住，ElixirDrip\
  \ 会生成一个 CacheWorker 以将文件保留在内存中一段时间以加快连续下载，但会在一段时间后回收这些进程以控制内存使用。执行实际文件搜索的 Search.search_for/2\
  \ 函数假定要搜索的文件已有 CacheWorker 进程。因此，如果我们想搜索特定的文本文件，就必须先下载它，然后再进行搜索。\n\n此处的目标是实现一个缓存来存储搜索结果，以便改进后续搜索。而不是立即下载文件仅为了搜索其内容，我们将首先查看搜索结果缓存，以确定是否已执行过相同的搜索。\n\
  \n我们将使用 ETS 实现此缓存，ETS 是 Erlang OTP 的一种构造，允许我们高效地在内存中存储和查询任意 Erlang 项。我们在这里使用高效这个词，是因为\
  \ ETS 表提供恒定的访问时间，无论你在其上存储的数据大小如何。由于 ETS 数据存储在内存中，如果我们告诉你每个 ETS 表都属于一个特定进程，就不会令人惊讶。在需要保留\
  \ ETS 数据的场景中，我们必须谨慎处理持有对应 ETS 表的进程的终止，以确保表不会丢失。\n\n让我们创建一个基于 GenServer 的 SearchCacheWorker\
  \ 模块来封装我们的搜索结果缓存的逻辑。由于我们只有一个 SearchCacheWorker，我们将其注册在 ElixirDrip.Storage.Workers.SearchCacheWorker\
  \ 别名下（即其模块名）。\n\n这样，我们就不需要知道 SearchCacheWorker 的 PID 就可以向其发送消息：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/\n\
  search_cache_worker.ex\ndefmodule ElixirDrip.Storage.Workers.SearchCacheWorker do\n\
  \  @moduledoc false\n\n  use GenServer\n  require Logger\n\n  @search_cache :search_cache\n\
  \n  def start_link() do\n    GenServer.start_link(__MODULE__, [], name: __MODULE__)\n\
  \  end\n\n  def init(_) do\n    Logger.debug(\"#{inspect(self())}: SearchCacheWorker\
  \ started.\")\n    search_cache = :ets.new(@search_cache, [:named_table, :set,\n\
  \      :protected])\n\n    {:ok, search_cache}\n  end\nend\n```\n\n正如我们所观察到的，这是一个普通的\
  \ GenServer，它在初始化期间创建一个名为 :search_cache 的新 ETS 表，并将表名存储在其状态中。如果我们没有向 :ets.new/2\
  \ 函数传递 :named_table 选项，我们将获得表的引用而不是其名称。:set 选项使 ETS 表作为标准映射工作，其中每个键必须是唯一的，并且每个键只指向一个值。我们还将表的访问模式设置为\
  \ :protected，这意味着只有进程所有者可以写入表，而其他进程可以从中读取。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_176_0.png)\n\
  \n除了 :set 之外，ETS 表还可以像 :ordered_set、:bag 或 :duplicate_bag 一样工作。:ordered_set 按键保持表有序，而\
  \ :bag 每个键可以有多个唯一值。:duplicate_bag 去除了后者的唯一性要求。关于表的访问模式，除了 :protected 之外，你还可以将其设置为\
  \ :private 或 :public，分别表示除了进程所有者之外无人可以访问它，或每个人都有读写访问权限。\n\n为了将文本搜索结果存储在我们的 ETS 表中，我们将实现一个\
  \ cache_search_result/3 函数，它接收 media_id、search_expression 以及我们想要存储的关联搜索结果。\n\n\n\
  \n由于表只能由其进程所有者写入，此函数将简单地向进程所有者执行一次 GenServer.call/2 调用，然后由其在对应的 handle_call/3 回调中负责更新\
  \ ETS 表：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/\nsearch_cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.SearchCacheWorker do\n  # ...\n  def cache_search_result(media_id,\
  \ search_expression, result) do\n    GenServer.call(__MODULE__, {:put, media_id,\
  \ search_expression,\n    result})\n  end\n\n  def handle_call({:put, media_id,\
  \ search_expression, result}, _from,\n  search_cache) do\n    created_at = :os.system_time(:seconds)\n\
  \n    result = :ets.insert_new(search_cache, {{media_id,\n    search_expression},\
  \ {created_at, result}})\n\n    {:reply, {:ok, result}, search_cache}\n  end\nend\n\
  ```\n\n为了向 ETS 表中插入新值，我们将表名（存储在进程状态中）和新条目传递给 :ets.insert_new/2 函数。此新条目始终必须是一个以键为第一个元素的元组。在我们的例子中，我们将\
  \ {{media_id, search_expression}, {created_at, result}} 作为第二个参数传递，因此我们的键是 {media_id,\
  \ search_expression} 元组，其值是另一个包含 created_at 时间戳和实际文本搜索结果的元组（在本节末尾，你将明白我们为什么也要存储时间戳）。:ets.insert_new/2\
  \ 调用将返回一个布尔值，表示操作是否成功：\n\n```\niex> SearchCacheWorker.cache_search_result(\"1\"\
  , \"media\",\n\"lorem ipsum media 1 contents\")\n{:ok, true}\n\niex> SearchCacheWorker.cache_search_result(\"\
  1\", \"media\",\n\"this can't be cached\")\n{:ok, false}\n\niex> SearchCacheWorker.cache_search_result(\"\
  1\", \"other\",\n\"other phrase found on media 1 contents\")\n{:ok, true}\n```\n\
  \n我们将表的访问模式设置为 :protected，因此每个进程都可以读取其内容。\n\n在此场景中，我们无需要求所有者进程为我们获取表中存储的数据，可以直接与其交互。这就是为什么我们将表名存储在\
  \ @search_cache 模块属性上的原因：由于每个进程都可以从表中读取，表名不能仅存在于进程所有者的状态中。\n\n要访问表条目，可以使用 :ets.lookup/2\
  \ 函数，它接收表名或引用以及我们要查找的键。该函数返回具有该键的条目列表。在我们的例子中，每个返回的列表只有一个元素，因为我们使用的是 :set ETS 表：\n\
  \n```\niex> :ets.lookup(:search_cache, {\"1\", \"media\"})\n[{\"1\", \"media\",\
  \ {1518475143, \"lorem ipsum media 1 contents\"}}]\n\niex> :ets.lookup(:search_cache,\
  \ {\"1\", \"unknown\"})\n[]\n```\n\n正如你刚才看到的，当存在该键的条目时，我们会得到一个包含 {key, value} 元组的列表。为了更方便地获取存储的值，我们将\
  \ :ets.lookup/2 函数封装在了 search_result_for/2 函数中：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/search_cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.SearchCacheWorker do\n  # ...\n  @search_cache\
  \ :search_cache\n\n  def search_result_for(media_id, search_expression) do\n   \
  \ case :ets.lookup(@search_cache, {media_id, search_expression}) do\n      [] ->\n\
  \        nil\n      [{_key, {_created_at, search_result}}] ->\n        search_result\n\
  \    end\n  end\nend\n```\n\n使用之前的函数，我们无法获取给定 media_id 缓存的所有文本搜索。如果要实现它，我们需要查询只查看键元组的第一个元素，其中包含\
  \ media_id。:ets.match_object/2 函数正好可以做到这一点：使用它，你可以对特定字段进行模式匹配：\n\n```\niex> :ets.match_object(:search_cache,\
  \ {{\"1\", :\"_\"}, :\"_\"})\n[\n  {{\"1\", \"other\"}, {1518509888, \"other phrase\
  \ found on media 1 contents\"}},\n  {{\"1\", \"media\"}, {1518475143, \"lorem ipsum\
  \ media 1 contents\"}}\n]\n```\n\n让我们创建一个 all_search_results_for/1 函数，对键元组的 media_id\
  \ 元素进行模式匹配，类似于我们刚才的做法。我们使用了特殊形式 : \"_\" 来表示，对于我们的 {{media_id, search_expression},\
  \ {created_at, result}} 条目，我们不关心 search_expression 元组元素，也不关心每个条目值对应的最后一个元组：\n\n\
  ```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/\nsearch_cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.SearchCacheWorker do\n  # ...\n  @search_cache\
  \ :search_cache\n\n  def all_search_results_for(media_id) do\n    case :ets.match_object(@search_cache,\
  \ {{media_id, :\"_\"}, : \"_\"}) do\n      [] ->\n        nil\n      all_objects\
  \ ->\n        all_objects\n        |> Enum.map(fn {key, value} ->\n          {elem(key,\
  \ 1), elem(value, 1)}\n        end)\n    end\n  end\nend\n```\n\n:ets.match_object/2\
  \ 返回一个包含所有匹配我们搜索条件的条目的列表。为了只返回每个条目的 search_expression 和结果，我们对结果列表进行映射，分别从条目键中获取第一个元素，从条目值中获取后者：\n\
  \n```\niex> SearchCacheWorker.all_search_results_for(\"1\")\n[{\"other\", \"other\
  \ phrase found on media 1 contents\"}, {\"media\",\n  \"lorem ipsum media 1 contents\"\
  }]\n```\n\n最后，让我们使用每次缓存搜索结果时存储的 created_at 时间戳。这里的想法是创建一个 SearchCacheWorker.expired_search_results/0，它将返回所有创建时间超过\
  \ @expiration_secs 的搜索结果键。为此，我们必须使用 :ets.select/2 函数。此结构允许我们对正在模式匹配的每个条目应用守卫子句，这正是我们在这里想要的：\n\
  \n```\niex> expiration_secs = 60\n60\n\niex> expiration_time = :os.system_time(:seconds)\
  \ - expiration_secs\n1518512436\n```\n\n```\niex> query = [\n...> {\n...> {:\"$1\"\
  , {:\"$2\", :_}},\n...> [{:<, :\"$2\", {:const, expiration_time}}],\n...> [:\"$1\"\
  ]\n...> }\n...> ]\n[\n{{:\"$1\", {:\"$2\", :_}}, [{:<, :\"$2\", {:const, 1518512436}}],\
  \ [:\"$1\"]}\n]\n```\n\n查询结构并不友好，但暂时不要担心。:ets.select 查询由一个或多个子句组成，每个子句都是一个三元素元组。让我们检查我们的单个子句查询。子句的第一个元素，{:\"\
  $1\", {:\"$2\", :_}}，是我们将应用于表中每个条目的模式。这里，我们将 :\"$1\" 变量关联到 {media_id, search_expression}\
  \ 键，将 :\"$2\" 关联到 created_at 元组元素。\n\n第二个元素，[{:<, :\"$2\", {:const, expiration_time}}]，是守卫子句，告诉我们只会选择\
  \ :\"$2\" 值小于此作用域中定义的 expiration_time 的条目。子句元组的最后一个元素，[:\"$1\"]，显示了我们希望如何返回查询的值。如果我们想返回表中存储的完整条目，可以使用\
  \ :\"$ _\" 变量代替 :\"$1\"。\n\n在查询就绪后，让我们使用它来查看哪些搜索结果已过期。首先，让我们缓存一个新的搜索结果，以确保查询正常工作：\n\
  \n```\niex> SearchCacheWorker.cache_search_result(\"7\", \"media\", \"really fresh\
  \ media 7 contents\")\n{:ok, true}\n\niex> :ets.select(:search_cache, query)\n[{\"\
  1\",\"other\"}, {\"1\",\"media\"}, {\"5\",\"media\"}]\n```\n\n:ets.select/2 调用没有返回我们刚刚缓存的搜索结果的键，所以一切正常。我们现在可以实现\
  \ SearchCacheWorker.expired_search_results/0 函数，它利用了我们刚刚创建的代码。我们将查询封装在私有 expired_search_results_query/1\
  \ 中，只是为了整理一下：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/\n\
  search_cache_worker.ex\ndefmodule ElixirDrip.Storage.Workers.SearchCacheWorker do\n\
  \  # ...\n  @search_cache :search_cache\n```\n\n\n\n```\n@expiration_secs 60\n\n\
  def expired_search_results(expiration_secs \\\\ @expiration_secs) do\n  query =\
  \ expired_search_results_query(expiration_secs)\n\n  :ets.select(@search_cache,\
  \ query)\nend\n\ndefp expired_search_results_query(expiration_secs) do\n  expiration_time\
  \ = :os.system_time(:seconds) - expiration_secs\n\n  [\n    {\n      {:\"$1\", {:\"\
  $2\", :\"_\"}},\n      [{:<, :\"$2\", {:const, expiration_time}}],\n      [:\"$1\"\
  ]\n    }\n  ]\nend\n```\n\n即使我们现在能够理解这些 :ets.select/2 查询的语法，它们的奇特表达性意味着一两个月后，我们可能需要花点时间才能理解像这样的查询的作用。为了帮助解决这一困难，:ets\
  \ Erlang 模块提供了 :ets.fun2ms/1 函数，它接收一个 lambda 函数并输出一个具有正确语法的查询，可传递给 :ets.select/3\
  \ 函数。这就是我们获取过期条目等效查询的方式：\n\n```\niex> query = :ets.fun2ms(\n...> fn {key, {created_at,\
  \ result}} when created_at < expiration_time ->\n...>   key\n...> end)\n\n[\n  {\n\
  \    {:\"$1\", {:\"$2\", :\"$3\"}},\n    [{:<, :\"$2\", {:const, 1518520114}}],\n\
  \    [:\"$1\"]\n  }\n]\n```\n\n正如你所见，:ets.fun2ms/1 调用比我们之前的内容更易理解。它将表条目作为唯一参数接收，对\
  \ created_at 字段应用守卫以过滤掉仍然有效的条目，然后返回过期条目的键。不过有个问题：如果你在自己的模块中调用 :ets.fun2ms/1，你会得到一个\
  \ :badarg 错误，提示我们传递的函数必须是在 shell 中生成的函数，或者需要在使用前通过 Erlang 解析转换进行转换。\n\nThe *parse\
  \ transform* is a feature of Erlang that allows one to access the code tree representation,\
  \ a sort of Erlang metaprogramming. The introduction of Elixir 1.5 deprecated the\
  \ use of these *parse transform* constructs, so we are left with using `:ets.fun2ms/1`\
  \ with shell functions, like we just did previously.\n\n![](img/c636f4cfb07f25f1db535995e50706ed_182_0.png)\n\
  \n如果你仍想使用基于 `:ets.fun2ms/1` 的方法，请查看 `ex2ms` 包 (https://hex.pm/packages/ex2ms)，它允许你使用\
  \ Elixir 宏实现相同的功能。对于我们的特定用例，只需在 IEx shell 中使用 `:ets.fun2ms/1` 生成 `select` 查询，然后将结果复制到\
  \ `SearchCacheWorker.expired_search_results_query/1` 就足够了。\n\n现在让我们创建一个从搜索结果缓存中删除条目的方法。由于此操作会更改\
  \ ETS 表，因此必须由其处理器所有者执行，因此使用了 `GenServer.call/2` 函数。我们有两个 `delete_cache_search` 函数，其中一个使用接收到的\
  \ `media_id` 和 `search_expression` 创建元组键，然后执行 `GenServer.call/2`，而另一个只是将接收到的键列表传递给它：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/\nsearch_cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.SearchCacheWorker do\n  # ...\n  def delete_cache_search(media_id,\
  \ search_expression) do\n    GenServer.call(__MODULE__, {:delete, [{media_id, search_expression}]})\n\
  \  end\n\n  def delete_cache_search(keys) when is_list(keys) and\n    length(keys)\
  \ > 0 do\n    GenServer.call(__MODULE__, {:delete, keys})\n  end\n\n  def handle_call({:delete,\
  \ keys}, _from, search_cache)\n    when is_list(keys) do\n      result = delete(keys)\n\
  \        |> Enum.reduce(true, fn r, acc -> r && acc end)\n\n      {:reply, {:ok,\
  \ result}, search_cache}\n  end\n\n  defp delete([]), do: []\n  defp delete([key|rest]),\n\
  \    do: [delete(key)] ++ delete(rest)\n  defp delete(key), do: :ets.delete(@search_cache,\
  \ key)\n```\n\ndelete_cache_search 调用都由同一个 pattern matching {:delete, keys} 的 handle_call/3\
  \ 回调处理。此处理程序依赖于私有函数 delete/1 来实际执行 :ets.delete/2 调用，并递归迭代接收到的键列表。另请注意，我们只是为了形式而对所有删除操作的结果进行归约，因为\
  \ :ets.delete/2 无论如何总是返回 true。\n\n现在我们可以将 SearchCacheWorker.expired_search_results/0\
  \ 的结果管道传输到 SearchCacheWorker.delete_cache_search/1，以便清除那些较旧的缓存搜索结果：\n\n```\niex>\
  \ SearchCacheWorker.expired_search_results\n[{\"1\", \"other\"}, {\"1\", \"media\"\
  }, {\"5\", \"media\"}]\n\niex> SearchCacheWorker.expired_search_results() |> SearchCacheWorker.delete_cache_search()\n\
  {:ok, true}\n\niex> SearchCacheWorker.expired_search_results\n[]\n```\n\n考虑到我们使用\
  \ GenServer 作为 ETS 表守护进程，我们可以实现之前在 CacheWorker 上采用的相同方法使其自行过期，但这次我们将定期清理旧的缓存结果 instead。我们将此改进作为对读者的建议留下。\n\
  \n我们的 SearchCacheWorker 愉快地驻留在内存中并按预期运行，为其存储的数百万搜索结果提供恒定的访问时间。但正如以下代码所示，ETS 表驻留在内存中，一旦其进程所有者死亡，它就会进入\
  \ /dev/null：\n\n```\niex> :ets.info(:search_cache)\n[\n  read_concurrency: false,\n\
  \  write_concurrency: false,\n  compressed: false,\n  memory: 331,\n  owner: #PID<0.672.0>,\n\
  \  heir: :none,\n  name: :search_cache,\n  size: 1,\n  node: :nonode@nohost,\n \
  \ named_table: true,\n  type: :set,\n  keypos: 1,\n  protection: :protected\n]\n\
  ```\n\n```\niex> guardian = #PID<0.672.0>\n#PID<0.672.0>\n\niex> Process.alive?\
  \ guardian\ntrue\n\niex> Process.exit guardian, :bye\ntrue\n\niex> Process.alive?\
  \ guardian\nfalse\n\niex> :ets.info(:search_cache)\n:undefined\n```\n\n现在让我们检查如何将\
  \ ETS 表持久化到磁盘。\n\n## 基于磁盘的 ETS\n\n可能存在你希望将存储在 ETS 表中的信息持久化到磁盘的场景。你会失去内存数据结构的性能，但如果出现问题，你的信息会被存储到磁盘。为此，Erlang\
  \ 提供了 DETS，这是一种基于磁盘的 ETS 解决方案，几乎完全遵守你已知的和期望的相同 ETS 契约。你不能使用它如果需要 :ordered_set 表，因为数据限制为\
  \ 2 GB；相反，你必须以不同的方式启动它并正确关闭它，本质上就是这样。\n\n现在让我们实现一个 FlexibleSearchCacheWorker 模块，根据传递给其\
  \ start_link/1 函数的参数，使用 DETS 或 ETS 存储搜索结果。该模块将实现 SearchCacheWorker 提供的所有函数，但我们需要做的更改非常小：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/\nflexible_search_cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.FlexibleSearchCacheWorker do\n  use GenServer\n\
  \  require Logger\n\n  @search_cache :search_cache\n\n  def start_link(storage \\\
  \\ :ets) do\n    GenServer.start_link(__MODULE__, storage, name: __MODULE__)\n \
  \ end\n\n  def init(storage) do\n```\n```elixir\nLogger.debug(\"#{inspect(self())}:\
  \ FlexibleSearchCacheWorker started with #{storage}.\")\nsearch_cache = case storage\
  \ do\n  :ets -> :ets.new(@search_cache, [:named_table, :set,\n    :protected])\n\
  \  :dets ->\n    {:ok, name} = :dets.open_file(@search_cache, [type: :set])\n  \
  \  name\nend\n\n{:ok, {storage, search_cache}}\nend\nend\n```\n\n正如你所见，根据 storage\
  \ 值（:ets 或 :dets 之一），我们初始化 ETS 或 DETS 表。然后我们将 storage 和 search_cache 值都保存在进程状态中。默认情况下，:dets.open_file/2\
  \ 函数如果文件尚不存在则会使用表名创建一个文件。下次启动基于 DETS 的 FlexibleSearchCacheWorker 进程时，它将从文件读取而不是从头创建表。\n\
  \n请记住\nElixirDrip.Storage.Workers.FlexibleSearchCacheWorker 实际上是一个模块别名，会扩展为一个原子（例如，:\"\
  Elixir.ElixirDrip.Storage.Workers.FlexibleSearchCacheWorker\"）。同样，所有 Erlang 模块都表示为原子。这就是我们使用\
  \ :ets.new(...) 来调用 :ets 模块的 new/2 函数的原因，也是我们可以调用像 storage.lookup(...) 这样的函数的原因。\n\
  \n现在让我们看看我们为 FlexibleSearchCacheWorker 所做的更改，以便它也具有 search_result_for/2 函数。之前，我们没有使用\
  \ GenServer.call/2，而是直接在 SearchCacheWorker.search_result_for/2 上进行查找。在这里，我们使用 GenServer\
  \ 方法是因为我们需要从进程状态中获取 storage 值，以便知道哪个 Erlang 模块将处理我们的函数调用。其余部分保持不变。这只有在 :ets 和 :dets\
  \ API 可以互换时才可能：\n\n```bash\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/\n\
  flexible_search_cache_worker.ex\n```\n```elixir\ndefmodule ElixirDrip.Storage.Workers.FlexibleSearchCacheWorker\
  \ do\n  # ...\n  def search_result_for(media_id, search_expression) do\n    GenServer.call(__MODULE__,\
  \ {:search_result_for, media_id,\n    search_expression})\n```\n\n\n```\nend\n\n\
  def handle_call({:search_result_for, media_id, search_expression},\n_from, {storage,\
  \ search_cache}) do\n  result = case storage.lookup(search_cache, {media_id,\n \
  \ search_expression}) do\n    [] ->\n      nil\n    [{_key, {_created_at, search_result}}]\
  \ ->\n      search_result\n  end\n\n  {:reply, {:ok, result}, {storage, search_cache}}\n\
  end\nend\n```\n\n剩余的所有 FlexibleSearchCacheWorker 函数都将以相同方式实现：使用存储变量上保存的原子，而不是显式使用\
  \ :ets，并将每个 SearchCacheWorker 函数转换为普通的 GenServer.call/2 调用，并配合相应的 handle_call/3\
  \ 回调，以便首先能够访问存储值。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_186_0.png)\n\n我们在这里不会分析所有\
  \ SearchCacheWorker 函数，但你可以查看 ElixirDrip 源代码中 FlexibleSearchCacheWorker 模块的完整实现。\n\
  \n由于我们在初始化期间创建了一个文件，我们应该做一个好公民，在进程退出时关闭文件。为此，我们将实现 terminate/2 回调：\n\n```\n$ cat\
  \ apps/elixir_drip/lib/elixir_drip/storage/workers/\nflexible_search_cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.FlexibleSearchCacheWorker do\n  # ...\n  def\
  \ terminate(reason, {storage, search_cache}) do\n    Logger.debug(\"#{inspect(self())}:\
  \ FlexibleSearchCacheWorker\n    using #{storage} ending due to #{reason}.\")\n\n\
  \    case storage do\n      :dets ->\n        storage.close(search_cache)\n    \
  \  _ ->\n        :noop\n    end\n  end\nend\nend\n```\n\n我们对 storage 值进行模式匹配，只有在进程使用\
  \ :dets 表进行存储时才执行操作。如果进程异常结束（例如，它从监督器接收到 :brutal_kill 或除 :normal 之外的退出信号），此回调将不会被调用，因此在某些情况下\
  \ DETS 表可能未被关闭。如果发生这种情况，下次打开表时，:dets 会对其进行修复。此修复过程是一项成本高昂的操作，可能需要一段时间来修复大型表，因此最好始终正确关闭表。\n\
  \n有了 FlexibleSearchCacheWorker，我们现在可以快速地在内存中的 ETS 表和基于磁盘的版本之间切换，反之亦然。这种灵活性之所以可能，只是因为\
  \ :ets 和 :dets 模块对于大多数常用函数具有相同的契约。\n\nErlang 提供的下一级数据存储是 Mnesia。我们在这本书中不会讨论它，但你应该知道它提供了更接近人们对数据库期望的抽象，包括更友好的查询语言和原子事务。它可以通过不同的节点透明地复制，允许你在不知道数据实际位置的情况下查询数据。它也可以同时持久化到内存和磁盘。把它想象成\
  \ ETS 和 DETS 模块的神童（它实际上是由它们支持的）。\n\n我们现在将结束对 ETS 和 DETS 的分析，并深入到令人惊叹的进程注册世界。没有它们，我们就必须知道应用程序产生的所有进程的\
  \ PID，生活会困难得多。\n\n## Registry\n\n当我们启动基于 GenServer 的 CacheWorker 时，你可能还记得我们将 {:global,\
  \ {:cache, <media_id>}} 用作 :name 选项的值，以便我们可以使用 {:cache, <media_id>} 元组作为其名称。在幕后，我们的缓存进程是使用\
  \ :global Erlang 模块注册的，该模块随每个运行的应用程序启动，并在连接多个节点时充当单个分布式进程注册表。在此阶段，我们仍然运行单个节点，因此据我们所知，我们可以使用\
  \ Registry，这是在 1.4 版本中引入的 Elixir 进程注册表。\n\n进程注册表让我们可以将名称与给定进程关联。让我们在生成两个缓存工作进程后查询\
  \ :global 注册表：\n\n```\niex> alias ElixirDrip.Storage.Supervisors.CacheSupervisor,\
  \ as: Cache\nElixirDrip.Storage.Supervisors.CacheSupervisor\n\niex> Cache.put(\"\
  5\", \"something\")\n```\n```\n{:ok, #PID<0.685.0>}\n\niex> Cache.put(\"7\", \"\
  something else\")\n{:ok, #PID<0.687.0>}\n\niex> :global.registered_names()\n[{:cache,\
  \ \"5\"}, {:cache, \"7\"}]\n```\n\n由于注册表会监控已注册的 PID，当已注册进程退出时，注册表会相应地更新其状态。让我们终止\
  \ {:cache, \"5\"} 进程，看看会发生什么：\n\n```\niex> :global.registered_names()\n[{:cache,\
  \ \"5\"}, {:cache, \"7\"}]\n\niex> cache5 = :global.whereis_name({:cache, \"5\"\
  })\n#PID<0.685.0>\n\niex> Process.exit(cache5, :some_reason)\ntrue\n\niex> Process.alive?(cache5)\n\
  false\n\niex> :global.registered_names()\n[{:cache, \"7\"}]\n\niex> :global.whereis_name({:cache,\
  \ \"5\"})\n:undefined\n```\n\n如果我们想用 Registry 替换 CacheWorker 进程中使用 :global，我们必须启动一个命名的注册表实例，我们称之为\
  \ ElixirDrip.Registry，然后必须将 {:global, {:cache, <media_id>}} 改为 {:via, Registry,\
  \ {ElixirDrip.Registry, {:cache, <media_id>}}}。这个 :via 元组告知 GenServer.start_link/3\
  \ 函数它应该如何注册即将生成的进程。在我们的例子中，它应该使用 Registry 模块将进程 PID 注册到名为 ElixirDrip.Registry 的现有进程上，该模块实现了\
  \ register_name/2 函数。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_188_0.png)\n\n\
  进程注册表应实现四个函数，register_name/2、unregister_name/1、whereis_name/1 和 send/2，实际上模仿 :global\
  \ Erlang 模块所做的工作。所有这些（以及更多内容）都可以在 Erlang 文档（http://erlang.org/doc/man/gen_server.html#start_link-3）中找到。\n\
  \n让我们开始在应用程序初始化期间，将 ElixirDrip.Registry 作为工作进程启动到我们的主监督树下：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/application.ex\n\
  defmodule ElixirDrip.Application do\n  use Application\n\n  def start(_type, _args)\
  \ do\n    import Supervisor.Spec, warn: false\n\n    Supervisor.start_link(\n  \
  \    [\n        supervisor(ElixirDrip.Repo, []),\n        supervisor(CacheSupervisor,\
  \ [], name: CacheSupervisor),\n        worker(Registry, [[keys: :unique, name: ElixirDrip.Registry]])\n\
  \      ],\n      strategy: :one_for_one,\n      name: ElixirDrip.Supervisor\n  \
  \  )\n  end\nend\n```\n\n我们现在只需要更改为每个 CacheWorker 生成名称的方式。如前所述，唯一的区别是我们现在返回一个 :via\
  \ 元组，而不是之前的 :global 元组：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/workers/cache_worker.ex\n\
  defmodule ElixirDrip.Storage.Workers.CacheWorker do\n  use GenServer\n  # ...\n\
  \  def start_link(media_id, content) do\n    GenServer.start_link(__MODULE__, content,\
  \ name: name_for(media_id))\n  end\n\n  def name_for(media_id), do: {:via, Registry,\
  \ {ElixirDrip.Registry,\n    {:cache, media_id}}}\n  # ...\nend\n```\n\n我们现在可以与\
  \ ElixirDrip.Registry 交互，并且每个生成的 CacheWorker 都将被注册到它上面。当我们使用 CacheSupervisor.put/2\
  \ 时，会生成一个 CacheWorker 并在 CacheWorker.name_for/1 函数返回的名称下注册。如果我们尝试使用相同的名称生成进程，我们会得到一个\
  \ :already_started 错误元组：\n\n```\niex> alias ElixirDrip.Storage.Supervisors.CacheSupervisor\n\
  ElixirDrip.Storage.Supervisors.CacheSupervisor\n```\n```\niex> alias ElixirDrip.Storage.Workers.CacheWorker\n\
  ElixirDrip.Storage.Workers.CacheWorker\n\niex> CacheSupervisor.put(\"3\", \"2 +\
  \ 2 is four, minus 1 is three.\")\n{:ok, #PID<0.452.0>}\n\niex> CacheSupervisor.put(\"\
  3\", \"2 + 2 is four, minus 1 is three.\")\n{:error, {:already_started, #PID<0.452.0>}}\n\
  \niex> Registry.lookup(ElixirDrip.Registry, {:cache, \"3\"})\n[{#PID<0.452.0>, nil}]\n\
  \niex> Registry.lookup(ElixirDrip.Registry, :nonexistent)\n[]\n\niex> Registry.whereis_name({ElixirDrip.Registry,\
  \ {:cache, \"3\"}})\n#PID<0.452.0>\n\niex> name = CacheWorker.name_for(\"3\")\n\
  {:via, Registry, {ElixirDrip.Registry, {:cache, \"3\"}}}\n\niex> pid = GenServer.whereis(name)\n\
  #PID<0.452.0>\n\niex> GenServer.call(pid, :get_media)\n{:ok, \"2 + 2 is four, minus\
  \ 1 is three.\"}\n```\n\n在前面的示例中，我们使用 Registry.lookup/2、Registry.whereis_name/1，最后使用\
  \ GenServer.whereis/1 获得了 PID。在第一种情况下，我们传递正在运行的注册表（ElixirDrip.Registry）和 {:cache,\
  \ \"3\"} 键，并使用特定的 Registry API 来检索 PID。\n\n我们在第二种情况下使用 whereis_name/1 回调。想要使用 :via\
  \ 元组提供进程注册的模块需要实现此回调并模仿其 :global 对应项。由于它只接收一个参数，正在运行的注册表的名称作为名称元组的第一个元素传递。我们传递给此回调的值与\
  \ :via 元组的第三个元素匹配。\n\n在最后一种情况下，我们使用 GenServer.whereis/1，它知道如何处理 :via 元组。因此，我们可以将\
  \ CacheWorker.name_for/1 的返回值传递给它，它将返回相应 CacheWorker 进程的 PID。\n\n\n\n\n![](img/c636f4cfb07f25f1db535995e50706ed_191_0.png)\n\
  \n如果你启动一个 IEx shell 并尝试对 `Registry.` 进行 *Tab* 自动补全，你将看不到 `register_name/2`、`unregister_name/1`、`whereis_name/1`\
  \ 和 `send/2` 这几个函数。你应该会觉得这很奇怪；毕竟进程就是通过这些函数进行注册的，因为我们使用的是 `:via` 元组，即使它是一个由 Elixir\
  \ `Registry` 支持的 fancy 元组。这里的诀窍是这四个函数都用 `@doc false` 进行了注解，因此在 IEx shell 中尝试 *Tab*\
  \ 自动补全时它们不会出现。你可以通过查看 https://github.com/elixir-lang/registry/blob/master/lib/registry.ex\
  \ 上的 `Registry` 源码来自行确认。\n\n如果我们想实现自己的进程注册表，比如 `ElixirDrip.ProcessRegister`，我们可以使用一个\
  \ `GenServer`，它将 map 作为状态，使用每次 `register_name/2` 调用时传入的名称作为键。然后我们需要在应用程序启动时启动这个\
  \ `ProcessRegister`，并修改 `CacheWorker.name_for/1` 函数使其返回 `{:via, ElixirDrip.ProcessRegister,\
  \ {:cache, <media_id>}}`。这些改动足以让我们的进程注册表运行起来。你可以在 `./apps/elixir_drip/lib/elixir_drip/process_register.ex`\
  \ 找到这个 `ElixirDrip.ProcessRegister` 的一个可能实现。\n\n我们刚刚看到如何使用进程注册表来管理进程名称，而不必总是使用 PID。现在考虑以下情况：如果注册表不监控其包含的进程，而只是一个简单的名称到\
  \ PID 的 map，我们可能会得到已结束进程的注册 PID，而我们的注册表需要为每个死亡的注册进程手动更新。进程注册表通过在进程注册期间调用 `Process.monitor/1`\
  \ 并实现 `handle_info/2` 回调来处理 `:DOWN` 元组的到来，从而克服这种情况。这样，注册表会在其中一个注册进程死亡时收到通知，从而可以安全地从其内部状态中移除对应的条目。\n\
  \n在对进程注册和 `:via` 元组进行这次深入探讨之后，我们将结束本节，仍然为我们的 `CacheWorker` 进程使用 `:global` 元组。由于目前我们只运行单个\
  \ Erlang 节点，使用全局注册表或本地注册表（例如 `Registry`）感觉像是次要的决定。尽管如此，当我们为 `ElixirDrip` 应用程序启动多个节点时，这对我们的缓存命中率将至关重要。\n\
  \n让我们分析如果我们有两个相互连接的运行节点，都进行本地进程注册会发生什么。在这种情况下，每个节点都不可能知道另一个节点上生成了哪些进程。如果第一个节点收到对媒体\
  \ \"1\" 的请求，并且不存在名称为 {:cache, \"1\"} 的进程，它将获取媒体内容，然后以该名称生成一个新的 CacheWorker。在这种多节点场景下，我们的节点位于负载均衡器后面，因此相同的请求可能会被路由到不同的节点。如果另一个对媒体\
  \ \"1\" 的请求到达并被路由到另一个节点，该节点将找不到名称为 {:cache, \"1\"} 的进程（因为我们进行的是本地进程注册），并且需要再次获取媒体内容，而无法利用另一个节点上的热缓存。\n\
  \n为了利用之前情况下的热缓存，我们只需要将 CacheWorker.name_for/1 改为返回 {:global, {:cache, <media_id>}}\
  \ 元组即可；其他一切保持不变。通过全局注册生成的 CacheWorker 进程，处理媒体 \"1\" 第二次请求的节点将能够找到在另一个节点上运行的名为 {:cache,\
  \ \"1\"} 的远程进程，然后将请求分派给它。节点连接并使用 :global 模块进行进程注册时，我们可以确定缓存的媒体只存在于单个节点中。无论由哪个节点处理，每次媒体请求如果该媒体的\
  \ CacheWorker 进程已存在，都将被路由到正确的节点。我们仅通过改变进程注册方式就在多个节点之上构建了一个分布式缓存。相当令人印象深刻，如果你问我们的话。\n\
  \n## Summary\n\n在本章中，我们将不同的 OTP 构造应用到我们的 ElixirDrip 应用程序中，现在我们可以用这套新工具来解决更广泛的问题。这些工具不是完整的解决方案或框架，而是在不妨碍的情况下帮助你构建应用程序的工具。Elixir\
  \ 也秉持着提供工具而非解决方案的信条，这一表述由 Erlang 的创造者之一 Robert Virding 提出。\n\n本章强调了 Elixir 为你提供的一些优秀工具。说了很多，并介绍了许多不同的概念：\n\
  \n- 我们首先实现了一个基于 GenServer 的缓存工作进程，以将最近的媒体保留在内存中以加快访问速度。为了控制内存使用，我们决定在一段时间后使缓存进程过期，并通过向进程发送延迟的\
  \ :expire 消息来实现这一点。\n- 我们还分析了更简单的基于 `GenServer` 的 `Agent` 抽象，用于那些只需要生成一个进程来为我们存储状态的情况。\n\
  - 通过 `Task` 模块，我们分析了如何通过运行异步任务来充分利用多个处理器。基于我们对任务工作原理的理解，我们实现了一个 `Search` 模块，能够搜索缓存中存储的文本文件。搜索函数的第一个迭代是顺序工作的，但在本节结束时，我们拥有了一个健壮的并行搜索，即使某些并行任务可能已超时，也能返回所有可用的搜索结果。\n\
  - 后来，我们检查了 Erlang Term Storage 及其基于磁盘的对应物如何提供灵活的键值存储，让我们可以通过 `:ets` 和 `:dets` 系列函数存储、管理和查询任意数据。在构建\
  \ `SearchCacheWorker` 模块时，我们使用了其中许多函数，该模块负责缓存文本搜索结果。\n- 我们通过检查将进程注册在名称下时会发生什么来结束本章。我们分析了\
  \ `:global` 进程注册表，并查看了 `Registry`，这是一个在 1.4 版本中引入的 Elixir 模块，也执行进程注册。我们最后研究了我们使用全局进程注册的原因以及我们将如何利用它来提高缓存命中率。\n\
  \n在下一章中，我们将定义一个按需驱动的媒体管道来处理所有的下载和上传请求。你将看到在不同阶段处理事件是多么容易，而不必担心其中一个阶段会使管道停滞。\n\n\
  # 5 按需驱动处理\n\n## Demand-Driven Processing\n\n我们已经看到 Elixir 特别适合生成数百万个进程。这种能力让开发者可以轻松运行同时执行的流程，仅受机器上可用处理器数量的限制。\n\
  \n然而，如果有大量数据持续流向你的应用程序，所有这些能力可能都不够。如果处理速度不够快，你进程的邮箱会开始堆积，最终耗尽所有内存，导致应用程序停滞。\n\n\
  在本章中，我们将分析 Elixir 如何通过使用最近引入的 GenStage 行为来控制数据处理的速率，从而解决这个问题。稍后，我们将把这种行为应用到 ElixirDrip\
  \ 应用程序中，以定义每个下载和上传操作执行的步骤。\n\n最后，我们将看到 Flow 模块如何构建在 GenStage 之上，以流线型的方式提供其处理能力，并提供一组与我们在\
  \ Enum 和 Stream 模块中期望找到的功能相当的函数。\n\n在本章中，我们将涵盖以下主题：\n\n- GenStage 以及它如何让你以按需方式处理数据\n\
  - 使用 GenStage 实现下载和上传管道\n- 使用 Flow 创建可组合的惰性查询\n\n### GenStage\n\nGenStage 是一个 Elixir\
  \ 行为，开发了很长时间。计划是将其包含在 Elixir 标准库中，但它发展到足以证明其拥有自己的 :gen_stage 库。\n\n\n\nElixir 允许你使用\
  \ `Stream` 模块惰性地处理集合，我们之前看到过如何通过为集合中的每个元素生成任务来并行处理集合。然而，如果我们传递集合的流程包含多个步骤，使用 `Task.async_stream`\
  \ 并不是最佳方案，因为对于每个步骤，它会等待所有任务返回或超时，然后再调用下一轮 `Task.async_stream`。\n\n我们想要的是能够生成必要的进程来并行消费集合，但无需在每个步骤结束时进行同步。而且由于我们考虑的是多个步骤，其中某个步骤会更慢是完全可能的。在这种情况下，执行该步骤的进程不可避免地会成为整个\
  \ *assembly line* 的瓶颈。而且如果我们处理的数据足够大，我们可以通过填满试图应对数据流入的进程的邮箱来堵塞我们的生产线。\n\n`GenStage`\
  \ 抽象为我们提供了一种优雅的方式来解决这个问题，通过以不同的方式看待它。不是让每个步骤孤立地工作，简单地执行其任务然后将结果传递给下一步，`GenStage`\
  \ 引入了一种让后续步骤向之前的步骤发出信号的方式，表明它们已准备好接收更多输入。这样，我们可以确保每个步骤只处理其所能处理的内容，不多也不少。这种策略称为反压，它让我们能够尽可能快地处理输入数据，而不会停止\
  \ *assembly line*。数据处理的速率不再由数据生产者控制，而是由处理数据的人控制，因此数据处理是需求驱动的。\n\n每个 `GenStage` 管道中的步骤都将是一个\
  \ `Producer`、`Consumer` 或 `ProducerConsumer` 进程。这些进程通过消息传递相互通信；在 `GenStage` 的术语中，这些消息称为\
  \ `events`。管道的最后一步将是 `Consumer`，其特征是仅消费从管道到达它的 `events`。由于 `Consumer` 阶段之后没有更多阶段，`Consumer`\
  \ 进程永远不会从后续阶段接收需求。\n\n在任何 `GenStage` 管道的开始，我们都有一个 `Producer` 进程：这些进程的唯一职责是处理下游进程的需求，通过在管道中引入新事件。任何\
  \ `Producer` 都必须遵守接收到的需求，绝不会产生超过当前需求的事件。这正是 `GenStage` 能够在不同阶段转换大量事件，而从不停止整个流程的关键所在。\n\
  \n一个 `GenStage` 管道将拥有一个 `Producer` 和一个 `Consumer` 阶段。如果我们想要一个或多个中间阶段，这些阶段必须同时从上游消费事件并向下游推送事件，就像同时是一个\
  \ `Producer` 和一个 `Consumer`。这些中间阶段是 `ProducerConsumer` 阶段，它们知道如何处理来自后续阶段的需求以及如何向上游发送需求：\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_196_0.png)\n\n我们谈论的是一个 Elixir behaviour；因此为管道创建阶段将像添加\
  \ `use GenStage` 然后实现适当的函数回调一样简单。每个 `ProducerConsumer` 和 `Consumer` 都需要订阅之前的 `GenStage`\
  \ 进程，以便从上游接收事件。这些订阅选项决定了阶段如何监听来自前一个进程的事件，通常在进程初始化期间传递。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_196_1.png)\n\
  \n你也可以单独启动阶段（例如 `GenStage.start_link/3`），然后再使用 `GenStage.sync_subscribe/2` 创建订阅。然而，我们将在它们的\
  \ `init/1` 回调上订阅我们的阶段，以确保阶段始终以有效的订阅开始，即使它之前崩溃并由其 supervisor 重启。\n\n`Consumer` 必须在\
  \ `init/1` 上返回一个 `{:consumer, state, subscription_options}` 元组，而 `ProducerConsumer`\
  \ 将返回一个类似的元组，但在第一个元素上使用 `:producer_consumer`。正如你可能猜到的那样，由于 `Producer` 不从任何人接收事件，因此它不需要订阅选项。它的\
  \ `init/1` 回调简单地返回一个 `{:producer, state}` 元组。\n\n在 `Consumer` 或 `ProducerConsumer`\
  \ 阶段初始化期间传递的 `:subscribe_to` 选项应指向我们订阅的 `GenStage` 进程，而 `:min_demand` 和 `:max_demand`\
  \ 选项将分别定义通过该管道阶段的事件的最小和最大数量。\n\n你可以在以下代码片段中看到一个假设的 Shipping 阶段的订阅选项示例。该阶段将订阅 Packaging\
  \ 阶段，并且最多从前一阶段请求 10 个事件。这意味着在任何给定时间，通过该阶段的事件不会超过 10 个：\n\n```\ndefmodule Shipping\
  \ do\n  use GenStage\n  # ...\n  @dummy_state []\n\n  def start_link() do\n    subscription_options\
  \ = [\n      subscribe_to: [{Packaging, min_demand: 3, max_demand: 10}]\n    ]\n\
  \n    GenStage.start_link(__MODULE__, subscription_options, name:\n    __MODULE__)\n\
  \  end\n\n  def init(subscription_options),\n    do: {:consumer, @dummy_state, subscription_options}\n\
  \n  def handle_events(tasks, _from, _state) do\n    Enum.each(tasks, &perform_step(&1))\n\
  \n    {:noreply, [], @dummy_state}\n  end\nend\n```\n\n让我们分析 Shipping 阶段的需求在 GenStage\
  \ 管道中是如何管理的：\n\n- `:min_demand` 选项定义了触发新需求的阈值。启动时，Shipping 阶段请求 10 个事件（对应于 `:max_demand`\
  \ 值），因为它没有任何事件需要处理。\n- Packaging 阶段只有五个事件可发送，因此 Shipping 阶段将只接收五个事件进行处理。由于 `:min_demand`\
  \ 阈值为三，Shipping 阶段将等待再接收两个事件后才向 upstream 请求更多事件。\n- 当这两个事件到达时，Shipping 阶段已从最初请求的\
  \ 10 个事件中接收了七个事件，因此达到了其 `:min_demand` 阈值三。此时，它将请求另外七个事件，从而再次等待达到 `:max_demand` 数量的事件。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_198_0.png)\n\nGenStage behaviour 基于 GenServer\
  \ 构建，这意味着你也可以使用它的 handle_call/3 和 handle_cast/2 回调。然而，这两个回调允许你通过分别返回 {:reply, reply,\
  \ [events], new_state} 和 {:noreply, [event], new_state} 来发出事件（注意 [events] 元素）。你可以将\
  \ GenStage 进程视为一个定制的 GenServer 进程，它还知道如何处理 handle_events/3（在 Consumer 或 ProducerConsumer\
  \ 的情况下）或 handle_demand/2（在 Producer 的情况下）。\n\n任何 Consumer 阶段也必须实现 handle_events/3\
  \ 回调，通过它接收需要处理的事件。最后，它需要返回一个 {:noreply, [], state} 元组，其中第二个元素是要发出的事件，最后一个是 GenStage\
  \ 进程的新状态。由于我们考虑的是 Consumer 阶段，第二个元素将始终为空列表，因为根据定义，Consumer 阶段不发出事件。\n\nProducerConsumer\
  \ 阶段也必须实现相同的 handle_events/3 回调，但与之相反，它需要发出新事件。为了发出事件，该阶段需要返回一个类似的 {:noreply, events,\
  \ state} 元组，其中 events 元素包含要传递到下游的事件。\n\n我们刚刚观察到如何通过在初始化期间传递它们的订阅选项来启动 Consumer 和\
  \ ProducerConsumer 阶段。Producer 阶段启动起来更简单，因为它不订阅任何前一阶段。Producer 阶段的 init/1 函数只需要返回一个\
  \ {:producer, state} 元组。然后，它需要实现一个不同的回调 handle_demand/2，以便通过产生新事件来响应新需求，从而在将事件传递到下游时有效地启动管道。\n\
  \n我们的 ElixirDrip 应用将有两个由多个步骤组成的管道。用户的文件上传将启动一系列步骤，负责加密文件、将其存储在云端，最后通知用户上传已成功完成。在相反的方向上，当用户点击下载文件时，下载过程将开始，从云端获取文件、解密它，然后最终通知用户。\n\
  \n让我们开始彻底分析上传流程的工作方式。\n\n\n\n## 上传管道\n\n与其手动启动 GenStage 管道的每个阶段，我们将在监督树下监督上传和下载管道。每个管道监督者负责像往常一样启动和监控其子进程，但在这种情况下，它还会将订阅选项传递给它启动的每个阶段。\n\
  \n每个阶段都将使用名称进行注册，这样我们就可以通过使用它应接收事件的阶段的名称来订阅阶段。鉴于此，我们将在上传和下载管道上都使用阶段，因此我们需要一种根据其所属的管道为阶段生成唯一名称的方法。下面的\
  \ Common.stage_name/2 函数接收一个 GenStage 模块和管道方向（一个 :upload 或 :download 原子）并返回一个有效的阶段名称。例如，如果我们向它传递\
  \ ElixirDrip.Storage.Pipeline.Notifier 和 :upload 参数，它将返回 ElixirDrip.Storage.Pipeline.Notifier.Upload：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/common.ex\ndefmodule\
  \ ElixirDrip.Storage.Pipeline.Common do\n  def stage_name(stage, direction) do\n\
  \    direction = direction |> Atom.to_string() |> String.capitalize()\n\n    Module.concat(stage,\
  \ direction)\n  end\nend\n```\n\n上传管道将由四个阶段组成：Starter、Encryption、RemoteStorage 和\
  \ Notifier，它们相互订阅。我们的 Notifier 模块将是 Consumer 阶段，我们将有两个 ProducerConsumer 阶段，而 Starter\
  \ 模块将是我们的 Producer 阶段，负责在管道中引入新事件。每个阶段都是一个工作进程，我们像往常一样向其传递初始化参数。我们将向每个阶段传递它应使用的名称及其订阅选项。由于\
  \ Starter 阶段是我们的 Producer，因此它将接收管道的方向而不是订阅选项，从而使其能够决定从哪个队列提取事件：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/supervisors/upload_pipeline_supervisor.ex\n\
  defmodule ElixirDrip.Storage.Supervisors.Upload.Pipeline do\n  use Supervisor\n\
  \  alias ElixirDrip.Storage.Pipeline.{\n    Common,\n    Starter,\n    Encryption,\n\
  \    RemoteStorage,\n    Notifier\n  }\n}\n@direction :upload\n@starter_name Common.stage_name(Starter,\
  \ @direction)\n@encryption_name Common.stage_name(Encryption, @direction)\n@storage_name\
  \ Common.stage_name(RemoteStorage, @direction)\n@notifier_name Common.stage_name(Notifier,\
  \ @direction)\n\ndef start_link(),\n  do: Supervisor.start_link(__MODULE__, [],\
  \ name: __MODULE__)\n\ndef init(_) do\n  # defining the subscription options for\
  \ each stage\n  encryption_subscription = [subscribe_to: [{@starter_name,\n  min_demand:\
  \ 1, max_demand: 10}]]\n  remote_storage_subscription = [subscribe_to: [{@encryption_name,\n\
  \  min_demand: 1, max_demand: 10}]]\n  notifier_subscription = [subscribe_to: [{@storage_name,\n\
  \  min_demand: 1, max_demand: 10}]]\n\n  # starting each stage as a worker\n  #\
  \ supervised by the current Supervisor module\n  Supervisor.init([\n    worker(Starter,\
  \ [@starter_name, @direction], restart:\n    :permanent),\n    worker(Encryption,\
  \ [@encryption_name, encryption_subscription],\n    restart: :permanent),\n    worker(RemoteStorage,\
  \ [@storage_name,\n    remote_storage_subscription], restart: :permanent),\n   \
  \ worker(Notifier, [@notifier_name, notifier_subscription],\n    restart: :permanent)\n\
  \  ],\n  strategy: :rest_for_one,\n  name: __MODULE__\n  )\nend\nend\n```\n\n请注意，我们使用的是通用监督者，即使子进程是\
  \ GenStage 进程，这次我们选择了 :rest_for_one 监督策略。这样我们就可以确保如果例如 Starter 进程意外终止，监督者将终止所有其他管道进程，因为它们现在将没有可消费的内容。我们还将\
  \ :restart 选项定义为 :permanent，以确保管道监督者始终重启其子进程（这是 GenStage 生成的子规范的默认值）。\n\n## 通知器阶段\n\
  \n现在让我们从最后的 Notifier 阶段开始分析我们的 ElixirDrip 上传阶段。正如我们刚才看到的，当管道监督树启动时，它会向每个阶段传递名称和订阅选项。在这种情况下，我们以消费者身份启动进程，且没有相关状态：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/notifier.ex\ndefmodule\
  \ ElixirDrip.Storage.Pipeline.Notifier do\n  use GenStage\n  require Logger\n\n\
  \  @dummy_state []\n\n  def start_link(name, subscription_options),\n    do: GenStage.start_link(__MODULE__,\
  \ subscription_options, name: name)\n\n  def init(subscription_options),\n    do:\
  \ {:consumer, @dummy_state, subscription_options}\n\n  # implementing the GenStage.handle_events/3\
  \ callback\n  # we delegate the event processing to the notify_step/1 function\n\
  \  def handle_events(tasks, _from, _state) do\n    Enum.each(tasks, &notify_step(&1))\n\
  \n    {:noreply, [], @dummy_state}\n  end\n\n  defp notify_step(%{media: media,\
  \ content: content, type: :upload}) do\n    # Invoke the notifier instead!\n\n \
  \   Logger.debug(\"#{inspect(self())}: NOTIFICATION! Uploaded media #{media.id}\
  \ to #{media.storage_key} with size: #{byte_size(content)} bytes.\")\n  end\nend\n\
  ```\n\n由于 Notifier 模块是一个消费者，我们必须实现 handle_events/3 回调。此回调会在有事件需要处理时被调用。在我们的例子中，我们将使用\
  \ notify_step/1 函数遍历接收到的任务，该函数负责向相关用户发送通知。我们将空列表作为回调返回值中的第二个元素返回，因为消费者按定义不会发出事件。\n\
  \nNotifier 阶段处理的每个事件都是一个映射，其中包含 media（保存 ElixirDrip 中存储的所有媒体信息的结构）、实际媒体内容以及事件类型。正如你所见，我们明确地将映射的\
  \ type 字段与 :upload 值进行模式匹配，以确保此 notify_step/1 仅处理 :upload 事件。\n\n## 远程存储阶段\n\nNotifier\
  \ 阶段将接收之前 RemoteStorage 阶段发出的事件。RemoteStorage 阶段的唯一职责是将收到的每个事件的内容存储在云端。上传成功后，它只需存储上传时间戳并更新媒体结构。对于收到的每个上传事件并执行后，它将向下游发出事件。\n\
  \n我们也不需要在此阶段保留状态，因此初始化后我们只需返回一个 {:producer_consumer, _, subscription_options} 元组。每个事件都经过\
  \ remote_storage_step/1 函数。此函数依赖于 Storage.Provider.upload/2 函数，使用特定的媒体 storage_key\
  \ 将内容上传到云端，并使用 Storage.set_upload_timestamp/1 函数更新上传时间戳：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/remote_storage.ex\n\
  defmodule ElixirDrip.Storage.Pipeline.RemoteStorage do\n  use GenStage\n  require\
  \ Logger\n  alias ElixirDrip.Storage\n  alias Storage.Provider\n  alias Storage.Supervisors.CacheSupervisor,\
  \ as: Cache\n\n  @dummy_state []\n\n  def start_link(name, subscription_options),\n\
  \    do: GenStage.start_link(__MODULE__, subscription_options,\n      name: name)\n\
  \n  def init(subscription_options),\n    do: {:producer_consumer, @dummy_state,\
  \ subscription_options}\n  # implementing the GenStage.handle_events/3 callback\n\
  \  # we delegate the event processing to the remote_storage_step/1 function\n  def\
  \ handle_events(tasks, _from, _state) do\n    processed = Enum.map(tasks, &remote_storage_step(&1))\n\
  {:noreply, processed, @dummy_state}\nend\n\ndefp remote_storage_step(%{media: %{id:\
  \ id, storage_key: storage_key} = media, content: content, type: :upload} = task)\
  \ do\n  Process.sleep(2000)\n\n  Logger.debug(\"#{inspect(self())}: Uploading media\
  \ #{id} to #{storage_key}, size: #{byte_size(content)} bytes.\")\n\n  {:ok, :uploaded}\
  \ = Provider.upload(storage_key, content)\n\n  %{task | media: Storage.set_upload_timestamp(media)}\n\
  end\nend\n```\n\n存储在 ElixirDrip 中的每个文件在上传到云端之前都会被加密。现在让我们检查刚刚分析的 RemoteStorage 阶段之前的\
  \ Encryption 阶段。\n\n## 加密阶段\n\n上传管道的 Encryption 模块也是一个 ProducerConsumer 阶段，因此它也将实现\
  \ handle_events/3 回调。与之前的阶段类似，它不保留状态，并使用自己的 encryption_step/1 函数转换收到的每个事件：\n\n```\n\
  $ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/encryption.ex\ndefmodule\
  \ ElixirDrip.Storage.Pipeline.Encryption do\n  @dummy_state []\n\n  use GenStage\n\
  \  require Logger\n  alias ElixirDrip.Storage.Providers.Encryption.Simple, as: Provider\n\
  \  alias ElixirDrip.Storage.Supervisors.CacheSupervisor, as: Cache\n\n  def start_link(name,\
  \ subscription_options),\n    do: GenStage.start_link(__MODULE__, subscription_options,\
  \ name: name)\n\n  def init(subscription_options),\n    do: {:producer_consumer,\
  \ @dummy_state, subscription_options}\n\n  # implementing the GenStage.handle_events/3\
  \ callback\n  # we delegate the event processing to the encryption_step/1 function\n\
  \  def handle_events(tasks, _from, _state) do\n```\n\n\n\n```\nencrypted = Enum.map(tasks,\
  \ &encryption_step(&1))\n\n{:noreply, encrypted, @dummy_state}\nend\n\ndefp encryption_step(%{media:\
  \ %{id: id, encryption_key:\nencryption_key},\ncontent: content, type: :upload}\
  \ = task) do\n  Process.sleep(1000)\n\n  Cache.put(id, content)\n\n  %{task | content:\
  \ Provider.encrypt(content, encryption_key)}\nend\nend\n```\n\n然而，这个 encryption_step/1\
  \ 函数比其 RemoteStorage.remote_storage_step/1 对应函数做得更多。在实际加密媒体内容之前，该阶段通过 Cache.put/2\
  \ 调用生成一个 CacheWorker 进程来缓存明文内容。不展开细节，这将允许我们在下载的媒体已存在于内存中的情况下绕过下载管道。如果我们尝试下载几秒前上传的媒体，响应会快得多，因为无需进行解密。这种策略的缺点是\
  \ CacheWorker 用于在内存中保留媒体内容一段时间而额外占用的内存。\n\n现在让我们来看 Starter 阶段，其名称暗示它正是触发整个 Upload\
  \ 管道的阶段。\n\n## Starter 阶段\n\n我们终于到达了本次上传管道 walk-through 的第一个阶段。作为事件生产者，我们的 Starter\
  \ 阶段将实现 handle_demand/2 回调，而不是迄今为止为 Consumer 和 ProducerConsumer 阶段实现的 handle_events/3。这也将是唯一会保留状态的阶段。作为\
  \ Producer 阶段，Starter 阶段需要始终知道从中获取新上传任务的队列以及已接收但尚未满足的未决需求。因此，其 init/1 回调将返回一个 {:producer,\
  \ state} 元组，其中 state 包含队列、此 Starter 阶段将创建的事件类型以及未决需求。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_205_0.png)\n\
  \n使用 `:upload` 调用 `QueueWorker.queue_name/1` 将返回包含上传队列的 `QueueWorker` 进程名称，类似于我们使用\
  \ `Pipeline.Common.stage_name/1` 函数为管道的每个阶段生成进程名称的方式。\n\n我们刚刚看到的 `Encryption` 阶段订阅了\
  \ `Starter` 阶段。`Encryption` 阶段启动时需求会向上游发送，因此 `Starter` 阶段通过 `handle_demand/2` 回调接收需求。传递给回调的第一个参数是整数，对应订阅者能够接收的事件数量，而另一个参数是进程状态。\n\
  \n每次有新的需求到达时，`Starter` 阶段会尝试尽可能生产事件以满足总需求，因为它不仅考虑新获得的需求，还考虑之前调用中遗留的未决需求。然后它尝试从队列中弹出所需数量的事件，并发出所有这些事件以启动上传过程。如果从队列中获取的事件不足以满足总需求，我们会将未满足的需求保留在进程状态中：\n\
  \n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/starter.ex\ndefmodule\
  \ ElixirDrip.Storage.Pipeline.Starter do\n  use GenStage\n  require Logger\n  alias\
  \ ElixirDrip.Storage.Workers.QueueWorker\n\n  @queue_polling 5000\n\n  def start_link(name,\
  \ type),\n    do: GenStage.start_link(__MODULE__, type, name: name)\n\n  def init(type)\
  \ do\n    {\n      :producer,\n      %{queue: QueueWorker.queue_name(type), type:\
  \ type, pending: 0}\n    }\n  end\n\n  # implementing the GenServer.handle_info/2\
  \ callback\n  # to check if there are more events in the queue to fulfill\n  # pending\
  \ demand\n  def handle_info(:try_again, %{queue: queue, pending: demand} = state),\n\
  \    do: send_events_from_queue(queue, demand, state)\n\n  # implementing the GenStage.handle_demand/2\
  \ callback\n  # we end up using the send_events_from_queue/1 function\n  # to respond\
  \ to the received demand\n  def handle_demand(demand, %{queue: queue, pending: pending}\
  \ = state)\nwhen demand > 0 do\n  total_demand = demand + pending\n\n  send_events_from_queue(queue,\
  \ total_demand, state)\nend\n\ndefp send_events_from_queue(queue, how_many, %{type:\
  \ type} = state) do\n  tasks = queue\n    |> QueueWorker.dequeue(how_many)\n   \
  \ |> Enum.map(&Map.put(&1, :type, type))\n\n  if length(tasks) < how_many do\n \
  \   Process.send_after(self(), :try_again, @queue_polling)\n  end\n\n  {:noreply,\
  \ tasks, %{state | pending: how_many - length(tasks)}}\nend\nend\n```\n\n你可能已经注意到我们还实现了一个\
  \ handle_info/2 回调来响应 :try_again 消息。当此消息到达时，进程会再次尝试满足其未决需求。我们在 send_events_from_queue/3\
  \ 函数中使用 Process.send_after/3 函数发送该消息，并在检查从队列获取的事件是否足以满足当前需求之后。为什么需要这样做？\n\n如果没有这种轮询策略，我们的\
  \ Starter 生产者永远不会自行满足未决需求。请考虑以下 NaiveStarter 模块，它与 Starter 模块类似，只是它不会向自身发送任何 :try_again\
  \ 消息：\n\n```\n```elixir\ndefmodule Pipeline.NaiveStarter do\n  # ...\n  defp send_events_from_queue(queue,\
  \ how_many, %{type: type} = state) do\n    tasks = queue\n      |> QueueWorker.dequeue(how_many)\n\
  \      |> Enum.map(&Map.put(&1, :type, type))\n\n    # Don't send any :try_again\
  \ message\n    # if length(tasks) < how_many do\n    # Process.send_after(self(),\
  \ :try_again, @queue_polling)\n    # end\n\n    {:noreply, tasks, %{state | pending:\
  \ how_many - length(tasks)}}\n  end\nend\n```\n```\n\n初始化后，`Encryption` 阶段向 `NaiveStarter`\
  \ 阶段请求 10 个事件并等待新事件。因此，`handle_demand/2` 回调被调用，`NaiveStarter` 生产者尝试从队列获取事件。尽管如此，只有四个事件可用，所以\
  \ `NaiveStarter` 阶段将这四个事件发送到下游，并将其 `pending` 需求更新为六。`Encryption` 阶段随后会接收并处理这四个事件。鉴于其\
  \ `min_threshold` 为三，并且它只获得了之前请求的 10 个事件中的四个，`Encryption` 阶段不会向上游发送新的需求。从 `NaiveStarter`\
  \ 阶段的角度来看，情况也不乐观：由于它只对新需求做出反应，如果 `Encryption` 阶段不请求，它永远不会尝试将新事件推送到队列。在这种 *deadlock*\
  \ 场景中，`Encryption` 阶段会永远等待剩余的六个事件，而 `NaiveStarter` 阶段会永远等待新的需求。\n\n这就是为什么我们的 `Starter`\
  \ 阶段会定期检查队列是否有足够的事件来满足未决需求，如果有事件，则立即将其推送到下游。毕竟，如果我们已注册需求，就能确定订阅者正在等待事件。由此得出的推论是，订阅者只会一次沟通其需求，因此你的生产者不仅需要跟踪未决需求，还需要尽快响应它们。\n\
  \n我们现在将对下载管道执行同样的 walk-through。\n\n## 下载管道\n\n与之前的管道类似，下载管道也由相同的四个阶段组成：`Starter`、`RemoteStorage`、`Encryption`\
  \ 和 `Notifier`。然而，这次 `Encryption` 阶段是在我们获取云端存储的实际加密内容之后执行的。该管道始于下载请求被入队。然后，`Starter`\
  \ 阶段从队列中获取该请求并从中生成一个事件，该事件将被 `RemoteStorage` 阶段处理。该阶段会检查请求的媒体是否已有 `CacheWorker`\
  \ 进程。如果是这样，它会将明文缓存内容放置在事件上，并将事件 `status` 设置为 `:original`，从而告知后续阶段该事件已包含 *original*\
  \ 媒体内容。当 `:download` 事件到达 `Encryption` 阶段时，只有在事件上不存在 `:original` `status` 时内容才会被解密。最后，`Notifier`\
  \ 步骤会通知用户媒体现在可以下载了。\n\n\n\n与上传管道监督者相比，下载管道监督者仅在不同阶段之间的订阅顺序上有所不同（现在 RemoteStorage\
  \ 阶段是第二个而不是第三个），以及 @direction 模块属性的值，现在为 :download。\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/supervisors/download_pipeline_supervisor.ex\n\
  defmodule ElixirDrip.Storage.Supervisors.Download.Pipeline do\n  use Supervisor\n\
  \  # ...\n  @direction :download\n  # ...\n  def init(_) do\n    remote_storage_subscription\
  \ = [subscribe_to: [{@starter_name, min_demand: 1, max_demand: 10}]]\n    encryption_subscription\
  \ = [subscribe_to: [{@storage_name, min_demand: 1, max_demand: 10}]]\n    notifier_subscription\
  \ = [subscribe_to: [{@encryption_name, min_demand: 1, max_demand: 10}]]\n\n    Supervisor.init([\n\
  \      # ...\n    ],\n    strategy: :rest_for_one,\n    name: __MODULE__\n    )\n\
  \  end\nend\n```\n\n再一次，让我们从下载管道的末端开始，通过分析其消费者 Notifier 阶段。\n\n## Notifier 阶段\n\n\
  下载管道的 Notifier 阶段订阅 Encryption 阶段。该阶段使用与上传管道相同的 Notifier 模块。区别在于赋予下载 Notifier 进程的进程别名（ElixirDrip.Storage.Pipeline.Notifier.Download），以及\
  \ notify_step/1 函数的新实现，该函数现在对事件类型键的 :download 值进行模式匹配。其余部分保持不变：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/notifier.ex\n\
  defmodule ElixirDrip.Storage.Pipeline.Notifier do\n  # ...\n  def start_link(name,\
  \ subscription_options),\n    do: GenStage.start_link(__MODULE__, subscription_options,\
  \ name: name)\n\n  def init(subscription_options),\n    do: {:consumer, @dummy_state,\
  \ subscription_options}\n\n  def handle_events(tasks, _from, _state) do\n    Enum.each(tasks,\
  \ &notify_step(&1))\n\n    {:noreply, [], @dummy_state}\n  end\n\n  defp notify_step(%{media:\
  \ %{id: id}, content: content, type:\n  :download}) do\n    # Invoke the notifier\
  \ instead!\n\n    Logger.debug(\"#{inspect(self())}: NOTIFICATION! Downloaded media\n\
  \    #{id}, content: #{inspect(content)}, size: #{byte_size(content)}\n    bytes.\"\
  )\n  end\nend\n```\n\n如你所见，处理下载事件的 notify_step/1 函数目前与处理上传事件的函数相同（唯一变化的是日志消息）。我们只是使用\
  \ Logger.debug/1 函数向控制台记录一条消息，但一旦我们使用 Phoenix Channels 实现用户通知，这一点就会改变。\n\n现在让我们检查\
  \ Encryption 阶段如何处理下载事件。\n\n## Encryption 阶段\n\n在下载管道中，Encryption 阶段订阅来自 RemoteStorage\
  \ 阶段的事件。与 Notifier 阶段类似，处理该阶段下载事件的函数与处理上传事件的函数并存。\n\n然而，这次 Encryption 模块有两个 encryption_step/1\
  \ 函数来处理下载事件：一个对状态事件字段的 :original 值进行模式匹配，另一个处理所有其他下载事件，对应于媒体内容仍被加密的情况：\n\n```\n\
  $ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/encryption.ex\ndefmodule\
  \ ElixirDrip.Storage.Pipeline.Encryption do\n  # ...\n  def start_link(name, subscription_options),\n\
  \    do: GenStage.start_link(__MODULE__, subscription_options, name: name)\n\n \
  \ def init(subscription_options),\n      do: {:producer_consumer, @dummy_state,\
  \ subscription_options}\n\n  # the GenStage.handle_events/3 callback\n  # delegates\
  \ the processing of each event to another encryption_step\n  /1 function\n  # that\
  \ pattern-matches on %{type: :download}\n  def handle_events(tasks, _from, _state)\
  \ do\n      encrypted = Enum.map(tasks, &encryption_step(&1))\n\n      {:noreply,\
  \ encrypted, @dummy_state}\n  end\n\n  # the %{status: :original} indicates the\
  \ content is ready to be delivered\n  defp encryption_step(%{media: media, content:\
  \ _content, status:\n  :original, type: :download} = task),\n      do: task\n\n\
  \  # given there's no %{status: :original}, we need to decrypt the content\n  defp\
  \ encryption_step(%{media: %{id: id, encryption_key:\n  encryption_key},\n  content:\
  \ content, type: :download} = task) do\n      Process.sleep(1000)\n\n      clear_content\
  \ = Provider.decrypt(content, encryption_key)\n      Cache.put(id, clear_content)\n\
  \n      %{task | content: clear_content}\n  end\nend\n```\n\n在第一种情况下，下载事件到达 Encryption\
  \ 阶段时已带有原始媒体内容（因为文件在之前的阶段已从缓存中获取）。因此，encryption_step/1 函数仅返回收到的相同事件。如果下载事件在 status\
  \ 字段上没有 :original 值，则意味着事件中存在的媒体内容需要在向下游发出新事件之前使用媒体 encryption_key 进行解密。媒体内容在解密后会被缓存以加快后续下载速度。\n\
  \n## RemoteStorage 阶段\n\n在 RemoteStorage 阶段的 remote_storage_step/1 函数中，我们尝试查找下载事件中包含的媒体是否存在\
  \ CacheWorker。该阶段从 Starter 事件生产者接收下载事件，并向下游发出带有媒体内容的事件。如果媒体存在 CacheWorker，则该阶段发出的事件内容对应于媒体原始内容，因此事件会使用\
  \ status 事件字段标记为 :original；如果不存在，则该阶段只是从云提供商获取媒体加密内容并传递下去：\n\n```elixir\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/\n\
  remote_storage.ex\ndefmodule ElixirDrip.Storage.Pipeline.RemoteStorage do\n  # ...\n\
  \  def start_link(name, subscription_options),\n    do: GenStage.start_link(__MODULE__,\
  \ subscription_options, name: name)\n\n  def init(subscription_options),\n    do:\
  \ {:producer_consumer, @dummy_state, subscription_options}\n\n  # the GenStage.handle_events/3\
  \ callback\n  # delegates the processing of each event to another\n  # remote_storage_step/1\
  \ function\n  # that pattern-matches on %{type: :download}\n  def handle_events(tasks,\
  \ _from, _state) do\n    processed = Enum.map(tasks, &remote_storage_step(&1))\n\
  \n    {:noreply, processed, @dummy_state}\n  end\n\n  defp remote_storage_step(%{media:\
  \ %{id: id, storage_key:\n  storage_key}, type: :download} = task) do\n    Process.sleep(2000)\n\
  \n    result = case Cache.get(id) do\n      nil ->\n        {:ok, content} = Provider.download(storage_key)\n\
  \        %{content: content}\n\n      {:ok, content} ->\n        %{content: content,\
  \ status: :original}\n    end\n\n    Map.merge(task, result)\n  end\nend\n```\n\n\
  ## Starter 阶段\n\n当我们之前分析上传管道的 Starter 阶段的工作方式时，我们看到如何将 type 作为初始化参数传递，以便上传 Starter\
  \ 阶段知道应从哪个 QueueWorker 进程获取新的上传请求。对于下载 Starter 阶段，采用的方法完全相同：我们在下载管道监督者上使用 @starter_name\
  \ 和 @direction 参数初始化 Starter 进程，在本例中它们的值分别为 ElixirDrip.Storage.Pipeline.Starter.Download\
  \ 和 :download。这足以让 Starter 阶段开始在下载管道上生成事件：\n\n```\niex> alias ElixirDrip.Storage.Pipeline.Common\n\
  ElixirDrip.Storage.Pipeline.Common\n\niex> alias ElixirDrip.Storage.Pipeline.Starter\n\
  ElixirDrip.Storage.Pipeline.Starter\n\niex> starter_name = Common.stage_name(Starter,\
  \ :download)\nElixirDrip.Storage.Pipeline.Starter.Download\n\niex> starter_process\
  \ = Process.whereis(starter_name)\n#PID<0.426.0>\n\niex> Process.alive?(starter_process)\n\
  true\n```\n\n由于从 QueueWorker 进程获取新的下载请求并将其注入下载管道的逻辑与我们在上传管道中已使用的逻辑完全相同，因此 Starter.handle_demand/2\
  \ 和 Starter.handle_info/2 回调使用的 send_events_from_queue/3 函数的实现也可以完全相同。该函数可同时服务于下载和上传管道，因为在从队列检索传输请求（无论是上传还是下载）之后，对\
  \ send_events_from_queue/3 的调用也会在事件映射上放置 type 条目：\n\n```\n$ cat apps/elixir_drip/lib/elixir_drip/storage/pipeline/starter.ex\n\
  defmodule ElixirDrip.Storage.Pipeline.Starter do\n  # ...\n  defp send_events_from_queue(queue,\
  \ how_many, %{type: type} = state) do\n    tasks = queue\n      |> QueueWorker.dequeue(how_many)\n\
  \      |> Enum.map(&Map.put(&1, :type, type))\n```\n\n\n\n```\nif length(tasks)\
  \ < how_many do\n  Process.send_after(self(), :try_again, @queue_polling)\nend\n\
  \n{:noreply, tasks, %{state | pending: how_many - length(tasks)}}\nend\nend\n```\n\
  \n本节我们已经涵盖了 GenStage 的很多内容。不过我们还有一点内容需要完成。\n\n## 最后说明\n\n尽管 GenStage 及其表亲 Flow 都是令人印象深刻的工具，但它们并不是万能的解决方案。使用这些抽象会因初始设置而产生一定的开销。请记住，在底层，进程正在被创建，消息正在被交换并可能被缓冲。因此，请考虑你是否真的需要使用\
  \ GenStage，还是只需要一个多步骤的管道来处理事件，而不需要背压机制。如果你追求的是并行处理，我们之前讨论过的 Task.async_stream/1\
  \ 可能就能胜任。\n\n你可以通过 Process.info/1 结果中的 :message_queue_len 条目来了解某个进程当前邮件箱中有多少条消息。以下片段展示了使用\
  \ Process.info/1 的情况，其中进程只是无限等待：\n\n```\niex> pid = spawn(fn -> Process.sleep(:infinity)\
  \ end)\n#PID<0.450.0>\n\niex> Process.info(pid, [:message_queue_len])\n0\n\niex>\
  \ Process.send(pid, :hi_there, [])\n:ok\n\niex> Process.send(pid, :hows_the_weather,\
  \ [])\n:ok\n\niex> Process.info(pid, [:message_queue_len])\n2\n\niex> Process.info(pid)\n\
  [\n  current_function: {Process, :sleep, 1},\n  initial_call: {:erlang, :apply,\
  \ 2},\n  status: :waiting,\n  message_queue_len: 2,\n  messages: [:hi_there, :hows_the_weather],\n\
  \  # ...\n]\n```\n\n在软件工程中，我们应避免过早优化。如果你发现进程变慢且消息队列堆积，这表明某些进程无法应对需求，此时你可以考虑使用 GenStage\
  \ 来解决该问题。\n\n你还应避免在 GenStage 模块上编写业务逻辑。毕竟，它们的唯一目的是在运行时控制事件的流向。将业务逻辑代码放在单独的模块中，可以更轻松地修改、测试它，并清晰地了解每个步骤在做什么。应用\
  \ GenStage 只是编排这些步骤执行方式的一种特定方法。\n\n另一个值得注意的方面是，我们以每个阶段一个工作进程的方式启动了两个 GenStage 管道，因此每个步骤只创建了一个进程。这有助于说明\
  \ GenStage 的工作原理，但并不意味着你必须这样做。你可以在每个步骤中创建多个工作进程（即 Consumer 或 ProducerConsumer 阶段），然后将它们全部订阅到一个或多个生产者（即\
  \ Producer 或 ProducerConsumer 阶段）。这就是为什么 :subscribe_to 选项接收一个元组列表的原因，每个元组配置一个特定的订阅。通过采用这种方法，你可以控制执行每个步骤的并行进程数量，从而扩展成为瓶颈的特定阶段。\n\
  \n如果你想看一个具有并行步骤的 GenStage 管道示例，可以在我们的 ElixirDrip 伞形项目 examples/parallel_genstage\
  \ 文件夹中找到一个。它与 ElixirDrip 应用一起编译，因此要查看其运行效果，只需启动一个 IEx shell 并运行 ParallelGenStage.Supervisor.start_link\
  \ 即可。你也可以查看下一章，我们在其中实现了一种领域特定语言，以便轻松定义新的管道，并可选择为每个阶段定义应创建多少个工作进程。\n\n我们现在将研究 Flow，这是一个基于\
  \ GenStage 的 Elixir 库，可让我们轻松并行处理集合。\n\n## Flow\n\n从早期开始，Elixir 就允许我们使用 `Enum` 和\
  \ `Stream` 模块轻松处理集合。在前一种情况下，集合会在到达 `Enum` 调用时立即遍历，如果改用相应的 `Stream` 函数，则可以将集合的实际枚举延迟到最后一刻。这就是我们说\
  \ `Stream` 函数是惰性的而 `Enum` 函数是急切的原因。\n\n因此，如果我们通过链接 `Enum.map/2` 调用来转换集合，则对每个 `Enum`\
  \ 函数的调用都会创建一个中间集合。这种行为与链接一堆 `Stream.map/2` 调用所得到的行为形成对比。在后一种情况下，整个集合最多只会被遍历一次，并且仅当生成的流到达\
  \ `Enum` 函数（如 `Enum.to_list/1`）时，才会强制评估流的每个元素。\n\n`Enum` 和 `Stream` 模块提供了处理集合的宝贵工具集，但并未利用\
  \ Elixir 并行运行多个执行流的能力。在引入 `Flow` 之前，如果有人想并行处理集合，就必须实现实际的处理逻辑，创建负责执行它的进程，最后定义如何聚合这些多个执行流的结果。\n\
  \n`Flow` 的创建是为了简化这种场景。与其以困难的方式实现并行处理，人们只需使用熟悉的一组函数，如 `each/2`、`map/2`、`filter/2`\
  \ 或 `reduce/3`，但由 `Flow` 模块提供即可。这些函数在语义上等同于 `Enum` 模块上同名函数，但内置了并行因子。\n\n`Flow` 使用相同的事件、`Producer`\
  \ 和 `Consumer` 阶段的概念，并且可以有多个中间阶段，即 `ProducerConsumer` 阶段，我们的事件通过这些阶段流动，因此不足为奇的是\
  \ `Flow` 利用了在 `GenStage` 行为上所做的一切出色工作。`Flow` 甚至能够处理直接来自其他 `GenStage` 进程的事件，将这些进程转变为正在创建的新\
  \ `Flow` 的 `Producers` 阶段。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_216_0.png)\n\
  \n你应该知道，默认情况下，Flow 以 500 个元素的批次处理输入集合。如果你与天真的急切解决方案相比时没有看到性能测试的改善，这可能是原因。尝试微调 :min_demand\
  \ 和 :max_demand 参数，它们有效地控制每次并行处理的元素数量。此外，如果使用 Flow 无法获得更好的性能，这可能意味着对于那种类型的数据和数据量，你最好不用它。\n\
  \n即使目前我们还没有一种高效查询 ElixirDrip 中存储的媒体的方法，让我们尝试应用 Flow 工具集来找出每个用户使用的磁盘空间。\n\n## 示例数据\n\
  \n要执行查询，我们需要数据。让我们创建 ElixirDrip.Search.SampleData 模块来封装所有负责数据创建的方法。我们将从 users/0\
  \ 函数开始，它返回一个包含九个用户的列表，将每个用户的 id 与其电子邮件关联：\n\n```\n$ cat examples/sample_data.exs\n\
  defmodule ElixirDrip.Search.SampleData do\n  @moduledoc false\n\n  def users do\n\
  \    [\n      %{id: 1, email: \"andre_albuquerque@elixir.pt\"},\n      %{id: 2,\
  \ email: \"daniel_caixinha@elixir.pt\"},\n      %{id: 3, email: \"jose_valim@elixir.br\"\
  },\n      %{id: 4, email: \"joe_armstrong@erlang.uk\"},\n      %{id: 5, email: \"\
  robert_virding@erlang.se\"},\n      %{id: 6, email: \"mike_williams@erlang.wls\"\
  },\n      %{id: 7, email: \"jose_lusquinos@panda.pt\"},\n      %{id: 8, email: \"\
  atenas@meow.cat\"},\n      %{id: 9, email: \"billy_boy@woof.dog\"},\n    ]\n  end\n\
  end\n```\n\n我们的目标是了解每个用户的磁盘使用情况，但我们也希望用户信息尽可能易于理解，以便可以在某种仪表板上显示。让我们创建一些函数来改进我们对用户的相关信息：\n\
  \n```\n$ cat examples/sample_data.exs\ndefmodule ElixirDrip.Search.SampleData do\n\
  # ...\ndef set_name_domain(%{email: email} = user) do\n{name, domain} = email\n\
  |> String.split(\"@\")\n|> List.to_tuple()\n\nuser\n|> Map.put(:name, name)\n|>\
  \ Map.put(:domain, domain)\nend\n\ndef set_full_name(%{name: name} = user) do\n\
  full_name = name\n|> String.split(\" \")\n|> Enum.map(&String.capitalize(&1))\n\
  |> Enum.join(\" \")\n\nMap.put(user, :full_name, full_name)\nend\n\ndef set_country(%{domain:\
  \ domain} = user) do\ncountry = domain\n|> String.split(\".\")\n|> Enum.reverse()\n\
  |> Enum.at(0)\n|> String.upcase()\n\nMap.put(user, :country, country)\nend\n\ndef\
  \ set_preferences(%{domain: domain} = user) do\npreferences = domain\n|> String.split(\"\
  .\")\n|> Enum.at(0)\n\nMap.put(user, :preferences, preferences)\nend\nend\n```\n\
  \n我们现在将使用 import_file/1 函数，该函数由 IEx.Helpers 模块提供，在我们的 search.exs 脚本中使用之前的示例数据模块。正如我们将看到的，如果我们将用户通过由这些函数中的每一个组成的数据转换过程，我们将获得更美观的信息集：\n\
  \n```\n$ cat examples/search.exs\nimport_file(\"./examples/sample_data.exs\")\n\n\
  alias ElixirDrip.Search.SampleData, as: Data\n```\n\n\n\n```\nusers = Data.users()\n\
  \npretty_users = users\n|> Flow.from_enumerable(max_demand: 1)\n|> Flow.map(&Data.set_name_domain(&1))\n\
  |> Flow.map(&Data.set_full_name(&1))\n|> Flow.map(&Data.set_country(&1))\n|> Flow.map(&Data.set_preferences(&1))\n\
  ```\n\n由于其惰性特性，Flow 并不会立即枚举集合。为了强制执行挂起的 Flow 操作，我们必须将其结果传递给一个急切的函数，例如 Enum.to_list/1。请注意我们正是这样做的，通过将前一个\
  \ search.exs 脚本中的 pretty_users 变量的值传递给 Enum.to_list/1 函数：\n\n```\niex> import_file(\"\
  ./examples/search.exs\")\n# ...\n\niex> pretty_users |> Enum.to_list()\n[\n  # ...\n\
  \n  %{\n    country: \"WLS\",\n    domain: \"erlang.wls\",\n    email: \"mike_williams@erlang.wls\"\
  ,\n    full_name: \"Mike Williams\",\n    id: 6,\n    name: \"mike_williams\",\n\
  \    preferences: \"erlang\"\n  },\n  %{\n    country: \"PT\",\n    domain: \"panda.pt\"\
  ,\n    email: \"jose_lusquinos@panda.pt\",\n    full_name: \"Jose Lusquinos\",\n\
  \    id: 7,\n    name: \"jose_lusquinos\",\n    preferences: \"panda\"\n  },\n\n\
  \  # ...\n]\n```\n\n如果我们关注 pretty_users 值，就会看到定义该数据管道实际如何处理的 Flow 配方。在我们的例子中，可以看到四个\
  \ map 操作，它们从包含用户初始形式的枚举集合中获取输入。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_219_0.png)\n\
  \nimport_file/1 函数运行脚本，就好像它是在当前 shell 中输入的一样。我们能够访问 pretty_users 变量是因为求值改变了当前作用域。如果我们不想改变当前作用域，可以使用\
  \ Code.eval_file/1 函数，它返回一个 {result, bindings} 元组。如果使用后者，pretty_users 变量只能通过 bindings[:pretty_users]\
  \ 变量访问。\n\n同时请注意为我们默认声明的阶段数。这些阶段是并行执行流的数量，它们将处理我们的数据，默认情况下对应于可用调度器的数量（由 System.schedulers_online/0\
  \ 给出）。我的笔记本电脑配备了 Intel i5 处理器，有两个核心，每个核心可运行两个线程，因此有四个阶段：\n\n```\niex> pretty_users\n\
  %Flow{\n  operations: [\n    {:mapper, :map, [&ElixirDrip.Search.SampleData.set_preferences/1]},\n\
  \    {:mapper, :map, [&ElixirDrip.Search.SampleData.set_country/1]},\n    {:mapper,\
  \ :map, [&ElixirDrip.Search.SampleData.set_full_name/1]},\n    {:mapper, :map, [&ElixirDrip.Search.SampleData.set_name_domain/1]}\n\
  \  ],\n  options: [stages: 4, max_demand: 1],\n  producers: {:enumerables,\n  [\n\
  \  [\n  %{email: \"andre_albuquerque@elixir.pt\", id: 1},\n  %{email: \"daniel_caixinha@elixir.pt\"\
  , id: 2},\n  %{email: \"jose_valim@elixir.br\", id: 3},\n  %{email: \"joe_armstrong@erlang.uk\"\
  , id: 4},\n  %{email: \"robert_virding@erlang.se\", id: 5},\n  %{email: \"mike_williams@erlang.wls\"\
  , id: 6},\n  %{email: \"jose_lusquinos@panda.pt\", id: 7},\n  %{email: \"atenas@meow.cat\"\
  , id: 8},\n  %{email: \"billy_boy@woof.dog\", id: 9}\n  ]\n  ]},\n  window: %Flow.Window.Global{periodically:\
  \ [], trigger: nil}\n}\n```\n\n我们现在有一组用户，但仍没有可查询的媒体。让我们通过在 SampleData 模块上创建一些辅助函数来生成媒体来解决这个问题：\n\
  \n```\n$ cat examples/sample_data.exs\ndefmodule ElixirDrip.Search.SampleData do\n\
  \  # ...\n  def media_set do\n    [\n      generate_media_for_user(1, 3),\n    \
  \  generate_media_for_user(4, 3),\n      generate_media_for_user(6, 3),\n      generate_media_for_user(2,\
  \ 2),\n      generate_media_for_user(3, 1),\n      generate_media_for_user(5, 4),\n\
  \    ]\n  end\n\n  defp generate_media_for_user(id, user_id) do\n    possible_extensions\
  \ = [\".bmp\", \".jpg\", \".png\", \".mp3\", \".md\",\n      \".doc\", \".pdf\"\
  ]\n\n    file_name = 10\n      |> :crypto.strong_rand_bytes()\n      |> Base.encode32()\n\
  \      |> String.downcase()\n\n    %Media{\n      id: id,\n      user_id: user_id,\n\
  \      file_name: file_name <> random_from(possible_extensions),\n      file_size:\
  \ :rand.uniform(10_000)\n    }\n  end\n\n  defp random_from([]), do: nil\n  defp\
  \ random_from([item]), do: item\n  defp random_from(collection) do\n    index =\
  \ :rand.uniform(length(collection) - 1)\n    Enum.at(collection, index)\n  end\n\
  end\n```\n\n之前的 SampleData.media_set/0 函数将返回一个包含六个 Media 结构的集合，其中三个属于用户 3，其余项目属于用户\
  \ 2、1 和 4。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_221_0.png)\n\n在本节中，在显示的每个\
  \ IEx shell 输出之前，我们都会运行 `import_file(\"./examples/search.exs\")`，与我们在上一个 IEx 交互示例中所做的类似。这样可以在与结果交互之前运行\
  \ `examples/search.exs` 脚本的当前版本。我们将通过添加一个 # 'search.exs' already evaluated 注释来表示这一点，而不是每次都显示之前的片段。\n\
  \n如果我们现在生成一个新的媒体集，将会得到与以下示例类似的结果。那些额外的字段出现是因为我们实际上是在创建由 Ecto schema 支持的 `Storage.Media`\
  \ 结构。我们将在第 7 章 *Persisting Data Using Ecto* 中创建这些 schema 时对此进行彻底分析，但现在你可以忽略这些新字段：\n\
  \n```\niex> raw_media_set = SampleData.media_set()\n[\n  %ElixirDrip.Storage.Media{\n\
  \    __meta__: #Ecto.Schema.Metadata<:built, \"storage_media\">,\n    encryption_key:\
  \ nil,\n    file_name: \"kignrrplwpcvtnsa.mp3\",\n    file_size: 4152,\n    full_path:\
  \ nil,\n    id: 1,\n    inserted_at: nil,\n    metadata: %{},\n    storage_key:\
  \ nil,\n    updated_at: nil,\n    uploaded_at: nil,\n    user_id: 3\n  },\n  %ElixirDrip.Storage.Media{\n\
  \    __meta__: #Ecto.Schema.Metadata<:built, \"storage_media\">,\n    encryption_key:\
  \ nil,\n    file_name: \"b2zj7loja6ie4cnp.md\",\n    file_size: 285,\n    full_path:\
  \ nil,\n    id: 2,\n    inserted_at: nil,\n    metadata: %{},\n    storage_key:\
  \ nil,\n    updated_at: nil,\n    uploaded_at: nil,\n    user_id: 2\n  },\n  # ...\n\
  ]\n```\n\n```\n] \n\niex> raw_media_set |> Enum.count()\n6\n```\n\n让我们在 search.exs\
  \ 脚本中过滤 raw_media_set，以便只保留集合中所需的字段：\n\n```\n$ cat examples/search.exs\nimport_file(\"\
  ./examples/sample_data.exs\")\n# ...\nmedia_set = raw_media_set\n  |> Flow.from_enumerable()\n\
  \  |> Flow.map(&Map.take(&1, [:id, :user_id, :file_name,\n:file_size]))\n  |> Enum.to_list()\n\
  ```\n\n通过运行之前的脚本，我们现在得到一个精简的 media_set 列表，只包含我们需要的字段：\n\n```\n# 'search.exs' already\
  \ evaluated\n\niex> media_set\n[\n%{file_name: \"ylcab53cvp5gauei.doc\", file_size:\
  \ 8915, id: 1, user_id: 3},\n%{file_name: \"5clgulo2hg241ayj.mp3\", file_size: 7644,\
  \ id: 4, user_id: 3},\n%{file_name: \"ym5yj435shtlenih.png\", file_size: 5309, id:\
  \ 6, user_id: 3},\n%{file_name: \"qvs3igorje7gc4ko.mp3\", file_size: 540, id: 2,\
  \ user_id: 2},\n%{file_name: \"cgdsam3gqp56gzvk.mp3\", file_size: 8695, id: 3, user_id:\
  \ 1},\n%{file_name: \"m4yijgulci jddvmp.mp3\", file_size: 5922, id: 5, user_id:\
  \ 4}\n]\n```\n\nmedia_set 准备好后，我们现在就可以开始将其“流式传输”到我们的数据查询管道中。\n\n## 惰性查询\n\n我们想要做的第一件事是使用\
  \ Flow 来统计每个用户当前在 ElixirDrip 上存储了多少文件。实际上，我们想要通过为每个文件递增每个用户的计数器来减少我们的 media_set。朴素的方法可能如下所示：\n\
  \n```\n$ cat examples/search.exs\nimport_file(\"./examples/sample_data.exs\")\n\
  # ...\nfiles_by_user_v1 = media_set\n  |> Flow.from_enumerable(max_demand: 1)\n\
  ```\n\n```\n|> Flow.reduce(fn -> %{} end,\n              fn media, accum ->\n  \
  \              Map.update(accum, media.user_id, 1, &(&1 + 1))\n              end)\n\
  ```\n\n然而，如果我们运行脚本并检查 files_by_user_v1 flow 的结果，我们会看到一个奇怪的结果：\n\n```\n# 'search.exs'\
  \ already evaluated\n\niex> files_by_user_v1 |> Enum.to_list()\n[{1, 1}, {3, 1},\
  \ {2, 1}, {3, 2}, {4, 1}]\n```\n\n这里发生的事情的解释在于集合元素如何在不同阶段之间分布。请记住，由于我们的集合是与 Flow\
  \ 并行处理的，并且我们将 max_demand 参数设置为 1，因此它将以单个元素的批次形式被消费。我们正在并行减少集合，因此在四个阶段的情况下，有四个并发的\
  \ reduce 操作正在进行。由于我们直接将 from_enumerable/2 的结果传递给 reduce/3 函数，Flow 只是将第一步阶段发出的输入批次发送到最后的\
  \ reduce 阶段，而不考虑这些下游发送的消息是否发送到了正确的 reduce 阶段。\n\n在这种情况下，有六个媒体元素被传递给四个阶段，因此属于用户 3\
  \ 的文件之一可能到达一个 reduce 阶段，而其余两个文件则进入其他阶段。这正是前面输出中发生的情况；在结果列表中，我们有用户 3 的两个元组 {3, 1}\
  \ 和 {3, 2}，这表明一个阶段只处理了一个文件，而另一个阶段获得了同一用户的剩余文件。\n\n我们需要一种方法来控制将哪些元素传递给每个 reduce 阶段。Flow\
  \ 允许我们使用 Flow.partition/2 函数将事件路由到特定的 reduce 阶段。此函数根据特定条件创建一组新的中间阶段，从而允许我们将同一用户的\
  \ fiy 文件定向到同一个 reduce 阶段。\n\n让我们通过定义 Flow.partition/2 函数用于创建新阶段的哈希函数来实现这一点：\n\n\
  ```\n$ cat examples/search.exs\nimport_file(\"./examples/sample_data.exs\")\n# ...\n\
  files_by_user_v2 = media_set\n  |> Flow.from_enumerable(max_demand: 1)\n  |> Flow.partition(hash:\
  \ fn m -> {m, m.user_id-1} end)\n  |> Flow.reduce(fn -> %{} end,\n  fn media, accum\
  \ ->\n```\n\n```\nMap.update(accum, media.user_id, 1, &(&1 + 1))\nend\n```\n\n在前面的函数中，我们将一个\
  \ lambda 函数作为 :hash 选项传递给 Flow.partition/2 调用。此 lambda 接收集合中的一个元素，并必须生成一个包含两个元素的元组，其中包含将被发出的结果元素以及将指向正确阶段的哈希函数的值。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_224_0.png)\n\n我们从 user_id 值中减去一：partition/2\
  \ 调用创建的每个阶段都是基于 0 的索引，因此对于从 id=1 开始的 N 个用户，我们希望从 0 开始的 N-1 个哈希值。如果我们错误地将 :hash lambda\
  \ 定义为 fn m -> {m, m.user_id} end，我们将得到类似 [{2, 1}, {1, 1}, {3, 3}] 的结果。可以看出，拥有单个文件的用户\
  \ 4 没有被考虑，因为它被分配到了阶段 4，而我们只有 0 到 3 的阶段。\n\n使用这个 :hash 函数，我们现在得到了预期的结果。你还应该注意，使用\
  \ Flow 时结果默认不会排序。我们无法控制结果产生的速度，因此无法保证顺序。我们现在可以看到用户 3 在 ElixirDrip 上有三个文件，而其他三个用户各有一个：\n\
  \n```\n# 'search.exs' already evaluated\n\niex> files_by_user_v2 |> Enum.to_list()\n\
  [{1, 1}, {2, 1}, {4, 1}, {3, 3}]\n```\n\n在我们想要按阶段分发集合项并且每个项都由一个键唯一标识的情况下，我们可以改用\
  \ Flow.partition/2 函数的 :key 选项。此选项允许你完全不实现哈希函数。如果你将 {:key, :user_id} 元组作为此选项值传递，它假定所有项都是映射，以便使用项的\
  \ :user_id 字段作为哈希值。如果你改为传递 {:elem, 2}，它假定所有项都是元组，并且应使用第三个元素（元组是基于 0 的索引）作为哈希值来将项路由到阶段。\n\
  \n让我们再对前面已经正常工作的版本迭代一次：\n\n```\n$ cat examples/search.exs\nimport_file(\"./examples/sample_data.exs\"\
  )\n# ...\nfiles_by_user_v3 = media_set\n|> Flow.from_enumerable(max_demand: 1)\n\
  |> Flow.partition(key: {:key, :user_id})\n|> Flow.reduce(fn -> %{} end,\nfn media,\
  \ accum ->\nMap.update(accum, media.user_id, 1, &(&1 + 1))\nend\n```\n\n查看前面的查询，可以很容易地辨别其步骤：我们获取\
  \ media_set，使用 :user_id 字段创建一组新的阶段来划分项，然后按用户统计现有媒体文件。与此查询的 eager 版本相比，我们所做的更改并不大，实际的\
  \ reduce 操作与 eager reduce 操作具有完全相同的语义。只需最小的努力，我们就获得了一个可以利用机器所有可用资源的惰性并行查询。这是每个想要最大化代码效率的程序员的乐趣所在。\n\
  \n## 磁盘使用量排名查询\n\n在上一节中，我们最终得到了每个用户的[content]\n```\nMap.update(accum, media.user_id,\
  \ 1, &(&1 + 1))\nend\n```\n\n在前面的函数中，我们将一个 lambda 函数作为 :hash 选项传递给 Flow.partition/2\
  \ 调用。此 lambda 接收集合中的一个元素，并必须生成一个包含两个元素的元组，其中包含将被发出的结果元素以及将指向正确阶段的哈希函数的值。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_224_0.png)\n\
  \n我们从 user_id 值中减去一：partition/2 调用创建的每个阶段都是基于 0 的索引，因此对于从 id=1 开始的 N 个用户，我们希望从 0\
  \ 开始的 N-1 个哈希值。如果我们错误地将 :hash lambda 定义为 fn m -> {m, m.user_id} end，我们将得到类似 [{2,\
  \ 1}, {1, 1}, {3, 3}] 的结果。可以看出，拥有单个文件的用户 4 没有被考虑，因为它被分配到了阶段 4，而我们只有 0 到 3 的阶段。\n\
