- "# 1 为即将开始的旅程做准备\n\n欢迎踏上这段不可思议的旅程！这是奥德赛的开始，将带你了解 Elixir 的众多特性，以及如何使用它们来构建、测试、部署和维护应用程序。如果你尚未熟悉函数式编程，这段旅程可能需要你转变思维方式以及对编程（以及一般问题解决）的思考方式。\n\
  \n在深入阅读本书之前，我们想指出，本入门章节是有意保持简短的。尽管我们将介绍该语言、其工具和生态系统，但这不会是一份完整的参考指南。Elixir 将文档视为一等公民，这体现在其模块和函数的出色文档中。因此，我们决定教你如何搜索所需内容，并以本书的核心概念——构建一个\
  \ Elixir 应用程序为目标。我们认为这种务实的方法能为你带来最大价值，因为你能够跟随一个应用程序从其诞生到生产环境，包括有时被忽视的部署和监控。\n\n\
  在本章中，我们将涵盖以下主题：\n\n- Elixir 中的数据类型\n- 使用模式匹配及其如何应用于各种类型\n- 使用函数并将它们打包到模块中\n- 使用集合\n\
  - 使用经典的控制流结构（如 `case`）\n- 在函数上使用类型规范\n- 创建行为，并在其他模块中采用它们\n- 使用协议使我们的函数具有多态性\n- Elixir\
  \ 自带的一些最有用的工具\n- 直接调用 Erlang 库\n- 通过端口与操作系统进程交互\n\n### 为什么是函数式编程？\n\n我们本身来自面向对象的背景，不能过分强调这种转变的价值。采用函数式编程范式会带来一些好处，例如以下几点：\n\
  \n- 数据转换流程变得更加明显。这与面向对象编程中通常发生的情况形成对比，在面向对象编程中，对象力求封装数据；而在函数式编程中，我们使用函数来改变数据。这使得应用于数据的转换变得明确，进而使以这种方式编写的应用程序更容易理解。\n\
  - 函数（大多）是无副作用的。有了不可变数据，你可以确信你持有的某个变量的引用值将保持不变，因为如果另一个函数或进程想要更改它，必须先创建副本——并在该副本上操作。这使得代码更容易分析和理解，因为你可以确信你的变量会保持你所期望的状态。然而，请注意，由于\
  \ Elixir 不是纯函数式语言，你的代码仍可能产生副作用。例如，如果一个函数写入文件，就会产生副作用。\n- 程序可以轻松并行化。作为不可变性的额外好处，通常非常简单地并行化这种类型的程序，因为不存在共享状态。\n\
  \n具有不可变数据的一个可能缺点是，你可能会产生性能损失，因为每次需要更改某物时，都必须复制它。这在很大程度上取决于实现方式，虽然这种担忧通常是合理的，但 Elixir\
  \ 在编译代码时采用了巧妙的技术来最大程度地减少这种影响。例如，在某些条件下，Elixir 在创建新变量时可以直接指向现有变量，因为它知道所有变量都是不可变的并且永远不会改变。\n\
  \n如果你被所有这些函数式编程术语弄得不知所措，就躺下放松吧，因为我们将在整本书中更详细地探讨这些概念。\n\n\n\n## Elixir 与 Erlang\n\
  \nElixir 由 José Valim 创建，运行在 Erlang VM（也称为 BEAM）上。Erlang 由 Ericsson 在 30 多年前开发，旨在提高公司电信系统的可靠性和可扩展性。如今，它被用于多种不同的场景，从数据库系统到聊天应用。Erlang\
  \ 的设计中内置了容错和分布式特性，以运行具有九个九可靠性的系统而闻名。\n\nErlang 的运行时天生就是分布式的，因为它被设计为可同时部署在多个电信交换机上。在\
  \ Erlang VM 上运行的程序可以通过轻松地将应用程序分布到多个节点上来利用这一点，也可以在多个 CPU 上分布——因为多核只是分布式系统的一种特殊情况。这是在当今环境下\
  \ Erlang VM（因此也是 Elixir）的一个令人难以置信的卖点，因为 CPU 的速度并没有变得更快，我们看到的是具有越来越多核心的 CPU 出现。\n\
  \n在本章开头，我们将介绍 Elixir。从其数据类型开始，我们还将介绍模式匹配、匿名和命名函数、模块以及一些控制流结构。然后，我们将了解如何处理集合，之后将简要介绍行为和协议。本章将以\
  \ Elixir 提供的令人难以置信的工具概述结束，以及一些利用 Elixir 与 Erlang 之间现有互操作性的方式。\n\n## Elixir 的数据类型\n\
  \n我们现在将描述 Elixir 的数据类型，它们扩展了 Erlang 的数据类型。Elixir 是一种动态编程语言。因此，你不需要声明每个变量的类型——它取决于变量在每个时刻所持有的值。\n\
  \n为提高学习体验，我们将在过程中提供一些示例。目前，我们将只使用 Elixir 的 REPL，IEx（Interactive Elixir 的缩写）。要启动\
  \ IEx 会话，你必须在机器上安装 Elixir。如果尚未安装，Elixir 有一个官方页面提供说明，无论使用包管理器、预编译版本，还是自行从源代码编译：\n\
  \n```\nhttp://elixir-lang.github.io/install.html\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_22_0.png)\n\
  \n我们不会深入探讨 Elixir 中每种类型的内存使用情况。如果你对此感兴趣，官方 Erlang 文档包含详细的信息：http://erlang.org/doc/efficiency_guide/advanced.html.\n\
  \n前提是你已在机器上安装了 Elixir，输入 `iex` 在终端启动新的 IEx 会话。通过它，你可以在机器上运行本章中的示例。请注意，你默认的 `iex`\
  \ 提示符包含括号中的数字，表示当前会话中已输入的表达式数量，例如 `iex>(1)`。为使输出更简洁，我们在示例中去掉了这个数字。\n\n我们将在本章末尾的\
  \ *工具和生态系统* 部分更详细地探讨 IEx。在以下各小节中，我们将提及 Elixir 中的一些内置模块。我们将在 *函数和模块* 部分探讨模块是什么——目前，知道模块是一个函数集合就足够了。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_22_1.png)\n\n当你完成 IEx 会话后，可以按两次 `Ctrl\
  \ + C` 或 `Ctrl + \\`. 这将终止运行 Erlang 运行时（以及所有后台作业）的操作系统进程。或者，你也可以通过在 shell 中输入 `System.halt`\
  \ 以更礼貌的方式停止系统。\n\n## 整数\n\n此类型包含如你所料，不能带小数部分的数字。整数的大小会根据其大小动态调整——你不必担心这一点：整数在增长时会简单地占用内存中更多的字。以下是使用整数的一些基本算术：\n\
  \n```\niex> 25 + 8\n33\n```\n\n为了提高代码的可读性，你还可以在整数的数字之间使用下划线，如下所示：\n\n```\niex> 1_000_000\
  \ - 500_000\n500000\n```\n\n除了十进制外，Elixir 还支持以二进制、八进制和十六进制（分别使用 0b、0o 和 0x）书写的整数：\n\
  \n```\niex> 0b10001\n17\niex> 0o21\n17\niex> 0x11\n17\n```\n\n## 浮点数\n\n在 Elixir\
  \ 中，浮点数用小数点书写，小数点前后都有数字，这意味着 .1 在 Elixir 中不是有效的浮点数（如 JavaScript 中那样）。在 Elixir 中，你必须明确并写出前导\
  \ 0——因此在这种情况下，你应写 0.1。以下是两个浮点数相乘的示例：\n\n```\niex> 0.1 * 0.5\n0.05\n```\n\n你也可以使用指数表示法书写浮点数，如下所示：\n\
  \n```\niex> 0.1e3\n100.0\n```\n\n浮点数以 IEEE 754 双精度表示，可提供 15 到 17 位有效十进制数字。如往常一样，在比较浮点数相等时应谨慎。\n\
  \n请注意，除法运算符（/）始终返回浮点数，即使除法的结果可以是整数：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_23_0.png)\n\
  \n```\niex> 4/2\n2.0\n```\n\n如果你想规避这种行为，请使用 Kernel 模块中自动导入的 div 函数。另外，如果你想获取除法的余数，请使用\
  \ rem 函数。\n\n## 原子\n\n*原子* 是一种常量，其值就是其自身名称。它们始终以冒号（:）为前缀，后跟字母数字字符（可能还包括 _ 或 @）。它们可能以感叹号或问号结尾。原子与\
  \ C 中的枚举和 Ruby 中的符号类似。以下是一些原子的示例：\n\n```\niex> :ok\n:ok\niex> :error\n:error\niex>\
  \ :some_descriptive_name!\n:some_descriptive_name!\niex> :value@start\n:value@start\n\
  ```\n\n你可以使用以下语法创建包含任意字符的原子：\n\n```\niex> :\"Atom name with arbitrary characters#$%^\"\
  \n:\"Atom name with arbitrary characters#$%^\"\n```\n\n与 Elixir 中的所有数据结构一样，原子在创建后不能被修改。此外，它们不会被垃圾回收。原子保存在\
  \ *原子表* 中，并在编译时，其值被替换为该表中条目的引用。这使得比较原子非常高效。正如你在本书中将学到的，这是 Elixir 中原子的主要用途之一，因为我们不断将函数的返回值与某个期望的原子进行匹配。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_24_0.png)\n\n由于原子不会被垃圾回收，不要从你无法控制的来源动态创建原子，否则你很容易用完为原子表分配的全部空间。例如，如果你正在解析\
  \ JSON 响应并从中创建映射，不要使用原子作为其键——改用字符串（这两种类型，映射和字符串，将在本章后面描述）。\n\n## 布尔值\n\nElixir 有三个与布尔运算相关的值：`true`、`false`\
  \ 和 `nil`（其中 `nil` 表示值的缺失——类似于大多数其他语言中的 `null`）。然而，这些只是一些语法糖，因为在内部它们表示为同名的原子，如以下示例所示：\n\
  \n```\niex> true == :true\ntrue\niex> false == :false\ntrue\niex> nil == :nil\n\
  true\n```\n\n你有常见的布尔运算符 `or`、`and` 和 `not`：\n\n```\niex> true or false\ntrue\niex>\
  \ true and false\nfalse\niex> not false\ntrue\n```\n\n然而，这些运算符在第一个参数上是类型严格的：它们只接受\
  \ `true` 或 `false`。如果你传入其他参数，将会得到 `BadBooleanError`。\n\n这就是 *真值性* 和 *假值性* 概念的用武之地。与\
  \ Ruby 或 C 中发生的情况类似，`false` 和 `nil` 被视为 *假值* 值，而其他所有值都被视为 *真值*。处理 *假值* 和 *真值* 值的运算符是\
  \ `&&`（and）、`||`（or）和 `!`（not）：\n\n```\niex> \"a value\" || false\n\"a value\"\n\
  iex> \"a value\" && false\nfalse\niex> nil && \"a value\"\nnil\niex> !\"a value\"\
  \nfalse\n```\n\n注意这些运算符如何根据参数进行短路。对于 `||`，它返回第一个 *真值* 值，而对于 `&&`，它返回第一个 *假值* 值（在两种情况下，如果这些条件永远不成立，它们将返回最后一个值）。\n\
  \n你还有其他正常的比较运算符，例如大于（`>`）和不相等（`!=`）——完整列表可在 https://hexdocs.pm/elixir/operators.html\
  \ 找到。其中值得指出的是 *严格相等* 运算符，它除了比较值外，还比较类型：\n\n```\niex> 3 == 3.0\ntrue\niex> 3 ===\
  \ 3.0\nfalse\n```\n\n\n\n## 元组\n\n*元组* 用于将固定数量的元素组合在一起。它们可以保存任何值——甚至是其他元组。它们在内存中连续存储，这提供了对元组内部元素恒定的访问时间。你可以通过花括号（{\
  \ 和 }）将元素包围起来创建元组，并用逗号分隔元素：\n\n```\niex> {:ok, 3.14}\n{:ok, 3.14}\n```\n\n在 Elixir\
  \ 中，元组的常见用法是对函数的结果进行模式匹配，以确保其成功（通常使用一个 :ok 原子）或处理错误。我们将在本章后面学习模式匹配和函数。\n\n要访问元组内部的元素，我们使用\
  \ elem 函数（来自 Kernel 模块），提供元组和一个基于零的索引：\n\n```\niex> result = {:ok, 3.14}\n{:ok,\
  \ 3.14}\niex> elem(result, 1)\n3.14\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_26_0.png)\n\
  \nKernel 模块中的函数会被自动导入。因此，我们不需要用模块名作为前缀。\n\n要更改元组上的元素，可以使用 put_elem 函数。其参数与 elem\
  \ 函数类似，但你还需要提供该位置的新值：\n\n```\niex> put_elem(result, 1, 1.61)\n{:ok, 1.61}\niex>\
  \ result\n{:ok, 3.14}\n```\n\n注意 result 变量没有改变。正如我们在本章开头讨论的那样，Elixir 中的数据是不可变的。因此，虽然我们用新值更新了元组，但原始元组并未改变——Elixir\
  \ 在原始元组的副本上更新了值。这样我们的代码就是无副作用的，任何持有 result 变量引用的其他函数都不会有意外。\n\n在 Elixir 中，普遍的建议是元组应保存最多四个元素——如果超过这个数量，你可能应该使用其他类型。\n\
  \n## 列表\n\n列表是通过用方括号（[ 和 ]）将我们想要的元素包围起来创建的，用逗号分隔值。内部，列表被实现为单向链表，这意味着访问列表元素是一个 O(n)\
  \ 操作。列表不像其他语言中的数组那样在内存中连续存储。与元组一样，列表元素可以是任何类型：\n\n```\niex> [1, :an_atom, 0.5]\n\
  [1, :an_atom, 0.5]\n```\n\n我们有 ++ 和 -- 运算符，它们是列表独有的，分别用于连接和减去列表：\n\n```\niex> [0,\
  \ 1, 1] ++ [2, 3, 5]\n[0, 1, 1, 2, 3, 5]\niex> [0, 1, 1] -- [1, 2, 3]\n[0, 1]\n\
  ```\n\n要检查某个元素是否存在于列表中，可以使用 in 运算符：\n\n```\niex> 1 in [0, 1, 1, 2, 3, 5]\ntrue\n\
  iex> 99 in [0, 1, 1, 2, 3, 5]\nfalse\n```\n\n要获取列表的头部，我们使用 hd 函数，而要获取列表的尾部，我们使用\
  \ tl 函数：\n\n```\niex> hd([0, 1, 1, 2, 3, 5])\n0\niex> tl([0, 1, 1, 2, 3, 5])\n[1,\
  \ 1, 2, 3, 5]\n```\n\n注意，这里尾部的语义是指不包含其头部的列表（它本身也是一个列表），而不是列表的最后一个元素。我们将在 Working\
  \ with collections 部分更深入地探讨这一概念，并提供更多关于如何操作列表的示例。参考资料，你可以在 https://hexdocs.pm/elixir/List.html\
  \ 找到有关列表可执行操作的详细列表。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_27_0.png)\n\n向列表追加是一个\
  \ O(n) 操作，因为我们需要遍历整个列表。向列表 prepend 是 O(1)。要向列表 prepend 一个元素，可以使用以下语法：[new_element\
  \ | list]。\n\n## 映射\n\n映射是键值数据结构，其中键和值可以是任何类型。它们类似于 Ruby 中的哈希和 Python 中的字典。要创建映射，你将键值对用\
  \ %{ } 包围，并在键和值之间放置一个 =>，如下例所示：\n\n```\niex> %{ :name => \"Gabriel\", :age => 1}\n\
  %{age: 1, name: \"Gabriel\"}\n```\n\n在这种情况下，键都是同一类型，但这不是必需的。如果你的键是原子，可以使用以下语法使映射声明更简单：\n\
  \n```\niex> %{name: \"Gabriel\", age: 1}\n%{age: 1, name: \"Gabriel\"}\n```\n\n\
  要访问与某个键关联的值，将键放在映射前方的方括号内：\n\n```\niex> map = %{name: \"Gabriel\", age: 1}\n%{age:\
  \ 1, name: \"Gabriel\"}\niex> map[:name]\n\"Gabriel\"\n```\n\n与映射声明一样，当键是原子时，我们对其有语法糖：\n\
  \n```\niex> map.name\n\"Gabriel\"\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_28_0.png)\n\
  \n当你尝试获取映射中不存在的键时，使用 map.key 语法会引发 KeyError 错误——与 map[key] 语法不同，后者会返回 nil。\n\n要更新映射中的键，可以使用\
  \ %{map | key => new_value}。如果键是原子，我们可以使用前面描述的相同记法：\n\n```\niex> %{map | age: 2}\n\
  %{age: 2, name: \"Gabriel\"}\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_28_1.png)\n\
  \n如果你来自面向对象编程背景，你可能会本能地使用以下语法来更改键的值：map[key] = new_value。记住在 Elixir 中所有类型都是不可变的，你永远不会对数据结构本身进行操作，而总是对其副本进行操作。\n\
  \n这仅适用于映射中已存在的键——这一限制允许 Elixir 在更新映射时优化并重用字段列表。如果想插入新键，使用 Map 模块中的 put 函数：\n\n```\n\
  iex> Map.put(map, :gender, \"Male\")\n%{age: 1, gender: \"Male\", name: \"Gabriel\"\
  }\n```\n\n与其他所有类型一样，在官方文档 https://hexdocs.pm/elixir/Map.html 中，你可以找到关于可以对映射做什么的相当详细的参考。\n\
  \n## 二进制\n\n二进制是一组连续的字节。你可以通过 << 和 >> 包围字节序列来创建它们。这里我们创建了一个两字节的二进制：\n\n```\niex>\
  \ <<5, 10>>\n<<5, 10>>\n```\n\n在十进制中，一个字节只能包含最高 255 的值（否则会溢出）。如果我们想存储大于 255 的值，需要告诉运行时使用更多空间来存储此二进制：\n\
  \n```\niex> <<5, 256>>\n<<5, 0>>\niex> <<5, 256::16>>\n<<5, 1, 0>>\n```\n\n如你所见，当我们指定大小（本例中为\
  \ 16 位）时，输出会多出一个字节并且溢出没有发生。大小不必是 8 的倍数。在这种情况下，二进制通常称为位串。\n\n大多数程序员不会处理如此低级别的数据，因此你使用二进制的频率可能不会很高。然而，在某些场景下它们非常有用，例如处理文件的头部以找到魔数并识别文件类型，甚至在手动处理网络数据包时。\n\
  \n## 字符串和字符列表\n\n字符串是包含 UTF-8 代码点的二进制。你可以用通常的双引号语法创建字符串：\n\n```\niex> \"hey, a string\"\
  \n\"hey, a string\"\n```\n\n字符列表顾名思义，是字符代码的列表。你可以使用单引号语法创建它们：\n\n```\niex> 'hey,\
  \ a charlist'\n'hey, a charlist'\n```\n\n由于这只是一个列表，你可以使用 hd 函数获取第一个字符的代码：\n\n```\n\
  iex> hd('hey, a charlist')\n104\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_30_0.png)\n\
  \n你可以使用 ? 运算符找出某个字符的代码。例如，要找出小写字母 d 的字符代码，你可以使用 ?d。\n\n两种表示都支持字符串插值：\n\n```\niex>\
  \ \"two plus two is: #{2+2}\"\n\"two plus two is: 4\"\niex> 'four minus one is:\
  \ #{4-1}'\n'four minus one is: 3'\n```\n\n两种表示也都支持 heredoc 记法，这通常用于编写文档。要创建它，使用三个单引号或双引号：\n\
  \n```\niex> \"\"\"\n...> a string with heredoc notation\n...> \"\"\"\n\"a string\
  \ with heredoc notation\\n\"\niex> '''\n...> a charlist with heredoc notation\n\
  ...> '''\n'a charlist with heredoc notation\\n'\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_30_1.png)\n\
  \nheredoc 字符串/字符列表的结束分隔符必须单独占一行。\n\nElixir 提供了 sigils 作为声明字符串或字符列表的另一种语法，如果你想在字符串中包含引号，这会很有用。你可以使用\
  \ ~s 创建字符串，使用 ~c 创建字符列表（它们的 uppercase 版本 ~S 和 ~C 类似，但不进行插值或转义字符）：\n\n```\niex> ~s(a\
  \ string created by a sigil)\n\"a string created by a sigil\"\n```\n\n\n\n```\n\
  iex> ~c(a charlist created by a sigil)\n'a charlist created by a sigil'\n```\n\n\
  还有一个值得提及的 sigil：~r，它用于正则表达式。在下面的代码片段中，我们使用 Regex 模块中的 run 函数来示例 ~r sigil 的用法：\n\n\
  ```\niex> Regex.run(~r{str}, \"a string\")\n[\"str\"]\niex> Regex.run(~r{123}, \"\
  a string\")\nnil\n```\n\n你可以在 http://elixir-lang.github.io/getting-started/sigils.html\
  \ 找到支持的 sigil 列表（以及如何创建自己的 sigil！）。\n\n在 Elixir 社区中，约定只在指代双引号格式时使用术语 string。这一区别很重要，因为它们的实现非常不同。String\
  \ 模块中的函数只适用于双引号格式。你应该始终使用双引号格式，除非需要使用 charlist——例如在使用 Erlang 库时就是这种情况。你可以使用以下函数在两种格式之间进行转换：\n\
  \n```\niex> String.to_charlist(\"converting to charlist\")\n'converting to charlist'\n\
  iex> List.to_string('converting to string')\n\"converting to string\"\n```\n\n##\
  \ 其他类型\n\n我们现在将简要描述一些其他类型。我们将从一些已描述类型的构建之上开始：关键字列表、范围、mapsets 和 IO 列表。\n\n### 关键字列表\n\
  \n关键字列表是一个列表，其元素具有特定格式：它们是元组，其中第一个元素是原子（第二个元素可以是任何类型），如下例所示：\n\n```\niex> [name:\
  \ \"Gabriel\", age: 1] = [{:name, \"Gabriel\"}, {:age, 1}]\n[name: \"Gabriel\",\
  \ age: 1]\n```\n\n我们可以使用以下语法创建关键字列表：\n\n```\niex> keyword_list = [name: \"Gabriel\"\
  , age: 1]\n[name: \"Gabriel\", age: 1]\niex> keyword_list[:name]\n\"Gabriel\"\n\
  ```\n\n从前面的代码片段可以看出，关键字列表确实是一个以原子开头的元组列表；你可以使用与在 map 中相同的语法访问关键字列表中的值。或者，你可以使用 Keyword\
  \ 模块中的 get 函数。请注意，这种声明关键字列表的方式只是语法糖，因为内部仍然是元组列表——这意味着在关键字列表中搜索项目的时间复杂度是 O(n)，而不是像\
  \ map 中那样是 O(1)。\n\n在关键字列表中，与 map 不同，你可以为给定键拥有多个值。此外，你可以控制其元素的顺序。通常，关键字列表用于允许函数接收任意数量的可选参数。我们将在本章后面讨论命名函数时展示此示例。你可以在\
  \ https://hexdocs.pm/elixir/Keyword.html 找到可以在关键字列表上执行的所有操作。\n\n### 范围\n\n范围，与 Ruby\
  \ 中的情况类似，表示两个整数之间的区间。要创建范围，我们使用以下方式：\n\n```\niex> 17..21\n17..21\niex> 19 in 17..21\n\
  true\n```\n\n与列表的处理方式类似，我们可以使用 in 运算符检查某个数字是否在范围的开始和结束之间。\n\n### MapSets\n\n如果你在\
  \ Elixir 中寻找 set 的实现，你要找的就是 MapSet。你可以使用 MapSet 模块中的函数创建和操作它们。以下是一些示例：\n\n```\n\
  iex> set = MapSet.new\n#MapSet<[]>\niex> set = MapSet.put(set, 1)\n#MapSet<[1]>\n\
  ```\n\n```\niex> set = MapSet.put(set, 2)\n#MapSet<[1, 2]>\niex> set = MapSet.put(set,\
  \ 1)\n#MapSet<[1, 2]>\n```\n\n集合按定义不能包含重复项。因此，插入已存在的值不会产生任何效果。你可以在 https://hexdocs.pm/elixir/MapSet.html\
  \ 找到 MapSet 模块的文档。\n\n在结束本节之前，我们必须提及三种与底层 Erlang VM 相关的类型。它们如下：\n\n- **引用：** 引用是一种由\
  \ Kernel.make_ref 函数创建的类型。该函数创建几乎唯一的引用，大约每 2^82 次调用会重复一次。我们在本书中不会使用引用。\n- **端口：**\
  \ 端口是对资源的引用。Erlang VM 使用它与外部资源（如操作系统进程）交互。我们将在本章后面讨论 Elixir 与 Erlang 之间的互操作性时，再多谈一些关于端口的内容。\n\
  - **PID：** PID 是用于标识 Erlang VM 中进程的类型。你将在本书后面开始使用 Erlang VM 进程时看到 PID 的实际应用。\n\n\
  为了完成本节，有一个我们想要强调的函数：i 函数，它是从 Kernel 模块自动导入的。你可以使用它来了解有关数据类型更多信息。它将打印你作为参数传递的项的数据类型信息。以下是使用字符串的示例：\n\
  \n```\niex> i(\"a string\")\nTerm\n\"a string\"\nData type\n  BitString\nByte size\n\
  \  8\nDescription\n  This is a string: a UTF-8 encoded binary. It's printed surrounded\
  \ by\n  \"double quotes\" because all UTF-8 encoded codepoints in it are printable.\n\
  Raw representation\n  <<97, 32, 115, 116, 114, 105, 110, 103>>\nReference modules\n\
  \  String, :binary\nImplemented protocols\n  IEx.Info, Collectable, List.Chars,\
  \ String.Chars, Inspect\n```\n\n至此，我们已经完成了对 Elixir 数据类型的巡览！我们没有深入细节，但通过本节中留下的链接，你会看到\
  \ Elixir 文档是多么出色，以及弄清楚某个函数的作用或某个参数的用途是多么容易。\n\n我们现在将进入 Elixir 最突出的特性之一（也是肯定会改变你编写程序方式的特性）：模式匹配。\n\
  \n## 模式匹配\n\n当我们描述 Elixir 的数据类型时，我们使用 = 运算符将某种类型的值绑定到变量。我们没有停下来解释实际发生了什么，因为语法与大多数动态编程语言非常相似。事实上，它如此相似，以至于乍一看我们假设它工作方式相同。\n\
  \n如果你没有函数式编程背景，你的第一反应会把 = 运算符称为赋值运算符。然而，在 Elixir 中，它被称为匹配运算符。让我们通过一些示例来看看这种命名差异的原因：\n\
  \n```\niex> x = 3\n3\niex> x * 3\n9\niex> 3 = x\n3\niex> 2 = x\n**(MatchError) no\
  \ match of right hand side value: 3\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_34_0.png)\n\
  \n我们在 IEx 会话中看到了第一个异常被抛出。我们将在本章后面讨论控制流时再讨论它们。\n\n前两个语句类似于你在使用赋值运算符时看到的情况——我们只是将\
  \ x 变量设为 3，然后将该变量乘以 3，得到预期的结果 9。现在，注意接下来几行发生了什么。我们在 = 运算符的左侧有一个整数字面量，这是一个有效表达式，返回值为\
  \ 3。你正在看到匹配运算符的实际效果。\n\n与代数中的方程类似，该运算符尝试将左侧的模式与右侧的项进行匹配。在前一个代码片段的第一行，这意味着将左侧的 x\
  \ 变量与右侧的 3 项进行匹配。\n\nElixir 可以通过将 x 变量绑定到 3 项使匹配成功。在第三行，我们再次匹配左右两侧，并且成功，因为 x 的值为\
  \ 3，因此两侧相等。在下一行，我们尝试将字面量 2 与 x 变量匹配。Elixir 找不到使此匹配工作的方法，这导致抛出错误。需要指出的是，变量绑定只发生在\
  \ = 运算符的左侧——当它们在右侧时，变量 simply 被其值替换。\n\n从这个代码片段中，我们还可以注意到我们始终有一个返回值——即使在进行模式匹配时也是如此。这是预期的行为，因为\
  \ Elixir 中的一切都是表达式——没有语句。你可以执行的每个操作都会始终返回一个值，无论你是在控制台打印内容还是发出 HTTP 请求。虽然你可以用表达式和语句实现同样的事情，但始终有返回值非常有用，因为你可以将函数链接在一起，并根据返回的值定义程序流程。在模式匹配的情况下，当它成功时，我们总是得到右侧匹配的项。\n\
  \n匹配运算符并不局限于将变量绑定到简单值——它实际上是一个非常强大的运算符，能够解构复杂的数据类型（并使你的代码变得极其易读）。我们现在将展示如何将此运算符用于上一节中介绍的几种类型，同时演示模式匹配过程的其他方面。\n\
  \n### 元组的模式匹配\n\n下面的代码片段展示了如何在元组上进行模式匹配：\n\n```\niex> {number, representation} =\
  \ {3.1415, \"π\"}\n{3.1415, \"π\"}\niex> number\n3.1415\niex> representation\n\"\
  π\"\n```\n\n这里的过程与我们在前一个代码片段中描述的相同。通过在左侧设置 {number, description} 模式，我们声明我们期望一个包含两个值的元组——同样，如果不是这种情况，将会抛出\
  \ MatchError。在这种情况下，匹配成功，我们可以看到变量 number 和 representation 被绑定到预期值。\n\n\n\n与 Erlang\
  \ 不同，Elixir 允许你重新绑定变量，这就是为什么以下代码可以工作：\n\n```\niex> a = 1\n1\niex> a = 7\n7\n```\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_36_0.png)\n\n然而，一个变量在每次匹配中只能绑定一次：\n\n\
  ```\niex> {a, a} = {3, 3}\n{3, 3}\niex> {a, a} = {2, 3}\n** (MatchError) no match\
  \ of right hand side value: {2, 3}\n```\n\n在第一行，匹配成功是因为每个 a 都绑定到相同的值 3。在第二行，我们得到\
  \ MatchError，因为我们在同一匹配中将 a 绑定到两个不同的值。本章后面我们将看到如何通过使用 pin 运算符使 Elixir 在这方面表现得像 Erlang。\n\
  \n我们可以进一步设定期望，使用左侧的字面量：\n\n```\niex> {3.1415, representation} = {3.1415, \"π\"}\n\
  {3.1415, \"π\"}\niex> representation\n\"π\"\n```\n\n现在我们的期望是一个包含两个元素的元组，其中第一个是 3.1415\
  \ 浮点字面量。我们也可以将此用于 Elixir 的其他类型，例如列表或映射。当我们将此技术应用于函数时，它会变得更有成效，我们将在下一节看到。\n\n## 列表上的模式匹配\n\
  \n列表上的模式匹配类似于元组上的模式匹配。下面是一个简单示例：\n\n```\niex> [first, second, third] = [\"α\", \"\
  β\", \"γ\"]\n[\"α\", \"β\", \"γ\"]\niex> first\n\"α\"\niex> second\n\"β\"\niex>\
  \ third\n\"γ\"\n```\n\n这里没有什么新东西。如果例如我们不关心列表的第二个元素呢？这时 _（下划线）匿名变量就很方便：\n\n```\n\
  iex> [first, _, third] = [\"δ\", \"ε\", \"ζ\"]\n[\"δ\", \"ε\", \"ζ\"]\niex> first\n\
  \"δ\"\niex> third\n\"ζ\"\n```\n\n我们再次匹配一个包含三个元素的列表，但现在将第二个元素绑定到 _ 变量，这意味着我们接受该位置的任何内容，并且不会使用其值。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_37_0.png)\n\n_ 变量永远不能被读取——如果这样做，你将得到一个\
  \ CompileError：\n\n```\niex> _\n** (CompileError) iex:83: unbound variable _\n```\n\
  \n这样，Elixir 保护你免于无意中读取此变量，这很容易导致应用程序出现意外行为。\n\n正如我们在数据类型部分提到的，你可以使用 Kernel 模块中的\
  \ hd 和 tl 函数来获取列表的头和尾。你也可以使用模式匹配来实现相同目的：\n\n```\niex> [first | rest_of_list] = [\"\
  α\", \"β\", \"γ\"]\n[\"α\", \"β\", \"γ\"]\niex> first\n\"α\"\niex> rest_of_list\n\
  [\"β\", \"γ\"]\n```\n\n虽然在这个人为的示例中，这种方法没有带来好处，但该技术是使用递归操作列表的基本要素。我们将在《使用集合》部分更详细地介绍这一点。\n\
  \n## 地图上的模式匹配\n\n要在映射上使用模式匹配，我们使用想要匹配的键值对设置模式，如以下示例所示：\n\n```\niex> %{\"name\" =>\
  \ name, \"age\" => age} = %{\"name\" => \"Gabriel\", \"age\" => 1}\n%{\"age\" =>\
  \ 1, \"name\" => \"Gabriel\"}\niex> name\n\"Gabriel\"\niex> age\n1\n```\n\n请注意，在这种情况下我们匹配了映射的所有键，但这不是必要的——例如，我们只匹配\
  \ age 即可。然而，你的模式只能包含正在匹配的映射上存在的键，否则会引发 MatchError。\n\n有时，你可能想匹配变量的值，而不是将其重新绑定到新值。为此，你可以使用由\
  \ ^ 字符表示的 pin 运算符：\n\n```\niex> name = \"Gabriel\"\n\"Gabriel\"\niex> %{name: ^name,\
  \ age: age} = %{name: \"Gabriel\", age: 1}\n%{age: 1, name: \"Gabriel\"}\niex> %{name:\
  \ ^name, age: age} = %{name: \"Jose\", age: 1}\n** (MatchError) no match of right\
  \ hand side value: %{age: 1, name: \"Jose\"}\n```\n\n正如前面的代码片段所示，我们将 name 变量绑定到\
  \ \"Gabriel\"。然后我们像本节前面那样匹配一个映射，这次使用 name 变量的内容。这等同于在左侧使用 \"Gabriel\" 字面量。当我们尝试匹配具有与\
  \ pin 变量不同的值的映射时，我们会得到 MatchError，正如预期的那样。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_38_0.png)\n\
  \n使用 pin 运算符时，你使用的变量必须已经绑定，因为如果它不存在，运算符不会绑定该变量。如果你对不存在的变量使用 pin 运算符，你会得到一个 CompileError，指出你尝试使用的变量未绑定。\n\
  \n## 二进制和字符串上的模式匹配\n\n以下示例展示了如何对二进制数据使用模式匹配：\n\n```\niex> <<first_byte, second_byte>>\
  \ = <<100, 200>>\n<<100, 200>>\niex> first_byte\n100\niex> second_byte\n200\n```\n\
  \n如在描述二进制数据时之前所述，当你直接处理字节时，例如从给定网络协议解析数据包，这会非常有帮助。通过将模式匹配应用于二进制数据，你可以根据需要提取位或字节，同时代码保持极其简洁表达。\n\
  \n由于字符串在底层只是二进制数据，我们可以使用前面代码片段中相同的策略：\n\n```\niex> <<first_byte, second_byte>> =\
  \ \"YZ\"\n\"YZ\"\niex> first_byte\n89\niex> second_byte\n90\n```\n\n然而，当处理字符串时这并不是很有帮助，因为你得到的是字符在\
  \ UTF-8 中的十进制编码（此外，由于 UTF-8 是变长编码，一个码点可能占用多个字节）。要匹配字符串，最好的方法是使用 String 模块中的函数，例如\
  \ starts_with?、ends_with? 或 contains?。\n\n正如本节开头所解释的，Elixir 中的一切都是表达式，在模式匹配中，匹配成功时表达式的右侧会被返回。由于这种行为并考虑到\
  \ Elixir 会重新绑定左侧的变量，我们可以编写如下表达式，将多个变量绑定到相同的值：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_39_0.png)\n\
  \n```\niex> x = y = 100\n100\niex> x\n100\niex> y\n100\n```\n\n## 函数和模块\n\n尽管在数据类型部分没有提到，函数在\
  \ Elixir 中也是一种类型——事实上，它们是 first-class 公民，可以分配给变量并作为参数传递给其他函数。\n\n与大多数函数式编程语言一样，函数是一种重要类型，因此它们有自己的章节，与其他内置类型分开。\n\
  \n我们将首先探索匿名函数，然后解释模块和命名函数，最后用模块属性和指令的快速概览结束本节。\n\n## 匿名函数\n\n匿名函数，通常称为 lambda，是使用\
  \ fn 关键字创建的，如以下示例所示：\n\n```\niex> plus_one = fn (x) -> x + 1 end\n#Function<6.99386804/1\
  \ in :erl_eval.expr/5>\niex> plus_one.(10)\n11\n```\n\n在这里，我们定义了一个接受一个参数的函数，我们将其命名为\
  \ x，并简单地将 1 加到提供的参数上。然后我们将此匿名函数绑定到名为 plus_one 的变量，并使用前面代码片段中可以看到的语法用 10 作为参数执行它。如预期，我们得到\
  \ 11。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_40_0.png)\n\nElixir 中没有 return\
  \ 关键字——函数的返回值是其最后一个表达式返回的值。\n\n匿名函数也可以根据提供的参数的值和/或类型具有多个实现。让我们通过示例来看看：\n\n```\n\
  iex> division = fn\n...> (_dividend, 0) -> :infinity\n...> (dividend, divisor) ->\
  \ dividend / divisor\n...> end\n#Function<12.99386804/2 in :erl_eval.expr/5>\niex>\
  \ division.(10, 2)\n5.0\niex> division.(10, 0)\n:infinity\n```\n\n假设我们想要一个特殊的除法函数，而不是在除以\
  \ 0 时引发 ArithmeticError，而是直接返回 :infinity 原子。这就是这里看到的匿名函数所实现的功能。使用模式匹配，我们说当第二个参数（除数）为\
  \ 0 时，我们简单地返回 :infinity。否则，我们只需使用 / 算术运算符执行正常除法。\n\n除了具有多个体的 lambda，注意我们用下划线（_）作为前缀来标记未使用的变量，如\
  \ _dividend。这样做除了提高代码可读性外，还会使 Elixir 编译器在你使用 supposedly 未使用的变量时发出警告。相反，如果你不使用某个变量但没有用下划线作为前缀，编译器也会发出警告。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_41_0.png)\n\n匿名函数参数周围的括号是可选的。你可以将我们之前介绍的\
  \ plus_one 函数写成 fn x -> x + 1 end。\n\n除了接受参数外，匿名函数还可以访问外部作用域的变量：\n\n```\niex> x\
  \ = 3\n3\niex> some_fun = fn -> \"variable x is #{x}\" end\n#Function<20.99386804/0\
  \ in :erl_eval.expr/5>\niex> some_fun.()\n\"variable x is 3\"\niex> x = 5\n5\niex>\
  \ some_fun.()\n\"variable x is 3\"\n```\n\n正如你所见，我们的匿名函数可以访问外部作用域的变量。此外，变量可以绑定到另一个值，而我们的函数仍将保留匿名函数定义时变量所持有的值的引用。这通常称为闭包：函数捕获其内部使用的所有变量的内存位置。由于\
  \ Elixir 中的每种类型都是不可变的，每个内存引用上的该值不会改变。然而，这也意味着这些内存位置不能立即被垃圾回收，因为 lambda 仍持有对其的引用。\n\
  \n我们将通过介绍一个新的运算符——捕获运算符（由 & 表示）来结束本节关于匿名函数的讨论。\n\n\n\n此运算符允许你以更紧凑的方式定义 lambda：\n\
  \n```\niex> plus_one = &(&1 + 1)\n#Function<6.99386804/1 in :erl_eval.expr/5>\n\
  iex> plus_one.(10)\n11\n```\n\n此语法等价于之前介绍的 plus_one 函数的写法。&1 表示此 lambda 函数的第一个参数——更一般地，&n\
  \ 将表示函数的第 nᵗʰ 个参数。与 fn 记法类似，括号是可选的。然而最好使用它们，因为在实际应用中，没有括号这些 lambda 函数会变得难以阅读。\n\n\
  ![](img/c636f4cfb07f25f1db535995e50706ed_42_0.png)\n\n除了提供一种更简短的定义 lambda 函数的方式之外，捕获运算符也可以与命名函数一起使用。我们将在下一节进一步探讨这一点。\n\
  \n## 模块和命名函数\n\n在 Elixir 中，模块将函数分组在一起，就像命名空间一样。通常，位于同一模块中的函数彼此相关。你使用 defmodule 构造来创建模块：\n\
  \n```\niex> defmodule StringHelper do\n...>   def palindrome?(term) do\n...>   \
  \  String.reverse(term) == term\n...>   end\n...> end\n{:module, StringHelper,\n\
  <<70, 79, 82, 49, 0, 0, 4, 0, 66, 69, 65, 77, 65, 116, 85, 56, 0, 0, 0,\n119, 0,\n\
  0, 0, 11, 19, 69, 108, 105, 120, 105, 114, 46, 83, 116, 114, 105, 110,\n103,\n72,\
  \ 101, 108, 112, 101, 114, 8, 95, 95, ...>>, {:palindrome?, 1}}\niex> StringHelper.palindrome?(\"\
  abcd\")\nfalse\niex> StringHelper.palindrome?(\"abba\")\ntrue\n```\n\n在前面的示例中，我们还在\
  \ StringHelper 模块内部使用 def 构造创建了一个函数，用于检查给定的字符串是否为回文。这是一个命名函数，与匿名函数相反，必须在模块内部创建。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_43_0.png)\n\n函数名与变量名类似，以小写字母开头，如果包含多个单词，则用下划线分隔。它们可以以\
  \ ! 和 ? 结尾。在 Elixir 社区中的惯例是，以 ! 结尾的函数名表示该函数可能会引发错误，而以 ? 结尾的函数名表示该函数返回 true 或 false——这正是我们\
  \ palindrome? 函数的情况。\n\n请注意，与匿名函数不同，调用命名函数时我们不需要在函数名和括号之间加点。这是有意为之，目的是明确区分对匿名函数和命名函数的调用。\n\
  \n由于我们的 palindrome? 函数实现非常小，我们可以用以下语法将其内联：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_43_1.png)\n\
  \n```\ndef palindrome?(term), do: String.reverse(term) == term\n```\n\n这适用于使用 do\
  \ ... end 语法的其他构造，例如 defmodule 或 if。我们将在控制流部分探讨 if（以及其他经典控制流机制）。\n\n在继续之前，由于我们的示例越来越大，我们必须讨论如何将\
  \ Elixir 代码写入文件。如前例所示，你可以在 IEx 会话中定义模块——然而，编写时出现任何拼写错误都会导致必须从头开始。\n\n将上一个示例的内容放入一个文件中——我们称之为\
  \ \"string_helper.ex\"（我们通常用正在定义的模块的名称来命名文件）。Elixir 源代码文件可能有两种扩展名：.ex 或 .exs。它们的区别在于，前者会被编译到磁盘（创建\
  \ .beam 文件），而后者仅在内存中编译。我们在实际应用中主要使用 .ex 扩展名，除了测试文件使用 .exs 扩展名（因为将它们编译到磁盘没有意义）。\n\
  \n文件创建后，你可以在终端中使用 elixirc 命令编译它，传入你想要编译的文件名。更有趣的是，你可以将文件名传递给 iex 命令（在我们的例子中为 iex\
  \ string_helper.ex）。这将使 Elixir 编译你的文件，从而使我们的 StringHelper 模块（及其函数）在 IEx 会话中可用。如果你已经在\
  \ IEx 会话中并想编译新文件，可以使用 c 命令，并将文件名作为字符串传入：\n\n```\niex> c(\"examples/string_helper.ex\"\
  )\n[StringHelper]\n```\n\n你也可以嵌套模块：\n\n```\n$ cat examples/nesting_modules.ex\n\
  defmodule Helpers do\n  defmodule StringHelper do\n    # StringHelper code goes\
  \ here\n  end\nend\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_44_0.png)\n\n\
  在前面的示例中，以 # 开头的行是注释。这是 Elixir 中注释行的语法。没有多行注释的语法——如果想注释一段代码，请为该块的每一行加上 # 前缀。\n\n\
  然而，在编译期间，Elixir 会将外部模块名添加到内部模块名前，并用点分隔。这只是一种便利，因为这两个模块之间没有关系。此语法等价于以下语法，而后者在 Elixir\
  \ 应用中更为常用：\n\n```\n$ cat examples/nesting_modules_inline.ex\ndefmodule Helpers.StringHelper\
  \ do\n  # StringHelper code goes here\nend\n```\n\n我们现在将以我们的 `palindrome?` 函数为例来解释\
  \ arity 的概念。在 Elixir 中，命名函数由其模块名、函数本身的名称及其 arity 标识。函数的 arity 是它接收的参数数量。考虑到这一点，我们的\
  \ `palindrome?` 函数被标识为 `Helpers.StringHelper.palindrome?/1`，其中 `/1` 表示函数的 arity。在浏览\
  \ Elixir 文档时，你会经常看到这种记法。\n\n这个概念很重要，因为同名但 arity 不同的函数实际上是两个不同的函数。然而对人类来说，两个同名（但\
  \ arity 不同）的函数毫无关系是不合理的。因此，只有在相关时才对不同的函数使用相同的名称。\n\nElixir 中的常见模式是让低 arity 函数作为对同名但\
  \ arity 更高函数的调用来实现。让我们用一个 `emphasize` 函数扩展我们的模块：\n\n```\n$ cat examples/string_helper_emphasize.ex\n\
  defmodule StringHelper do\n  def palindrome?(term) do\n    String.reverse(term)\
  \ == term\n  end\n```\n\n```\ndef emphasize(phrase) do\n  emphasize(phrase, 3)\n\
  end\n\ndef emphasize(phrase, number_of_marks) do\n  upcased_phrase = String.upcase(phrase)\n\
  \  exclamation_marks = String.duplicate(\"!\", number_of_marks)\n  \"#{upcased_phrase}#{exclamation_marks}\"\
  \nend\n```\n\n这里，我们可以看到它的实际效果：\n\n```\niex> StringHelper.emphasize(\"wow\")\n\"\
  WOW!!!\"\niex> StringHelper.emphasize(\"wow\", 1)\n\"WOW!\"\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_45_0.png)\n\
  \n我们使用 def 构造来创建函数。通过使用它，我们的函数会被导出并可在其他模块中调用。如果你想改变这种行为，并使函数仅在定义它的模块内可用，请使用 defp\
  \ 构造。\n\narity 为 1 的函数只是简单地调用 emphasize/2。这在你想为模块提供一个宽泛的接口时很有用，这样一些客户端只需调用 emphasize/1\
  \ 而无需指定感叹号的数量，而另一些客户端则可以调用 emphasize/2 并指定感叹号的数量。\n\n当代码像本例一样简单时，这种多重函数是不必要的，因为你可以使用默认参数达到相同的最终结果。我们通过在参数名前使用\
  \ \\\\ 运算符，然后指定其应有的默认值来实现这一点：\n\n```\n$ cat examples/string_helper_emphasize_with_default_args.ex\n\
  def emphasize(phrase, number_of_marks \\\\ 3) do\n  upcased_phrase = String.upcase(phrase)\n\
  \  exclamation_marks = String.duplicate(\"!\", number_of_marks)\n  \"#{upcased_phrase}#{exclamation_marks}\"\
  \nend\n```\n\n这将生成两个同名但 arity 不同的函数，如上一个片段所示。如果你的函数有多个主体，如下一个示例所示，你必须定义一个函数头，并在其中定义默认参数：\n\
  \n```\n$ cat examples/string_helper_emphasize_with_function_header.ex\ndef emphasize(phrase,\
  \ number_of_marks \\\\ 3)\n```\n\n\n\n```\ndef emphasize(_phrase, 0) do\n  \"This\
  \ isn't the module you're looking for\"\nend\ndef emphasize(phrase, number_of_marks)\
  \ do\n  upcased_phrase = String.upcase(phrase)\n  exclamation_marks = String.duplicate(\"\
  !\", number_of_marks)\n  \"#{upcased_phrase}#{exclamation_marks}\"\nend\n```\n\n\
  在这个示例中，我们还看到了一种在命名函数中使用模式匹配的方法。请注意函数定义的顺序很重要。Elixir 会从上到下搜索匹配的条款。如果我们将第二个参数匹配为 0\
  \ 的条款放在末尾，emphasize 函数的该定义将变得无法到达，因为另一个定义更通用且始终匹配。Elixir 会帮助你避免这些情况，因为它在编译期间会发出警告，提醒你这种情况。\n\
  \n除了使用模式匹配（正如我们在本示例和匿名函数中所见），在命名函数上我们还可以使用 guard 子句，它扩展了模式匹配机制并允许我们对函数设置更广泛的期望。要在函数上使用\
  \ guard 子句，我们在参数列表之后使用 when 子句。\n\n为了举例说明，我们将在 palindrome? 函数上使用 guard 子句。到目前为止，我们接受任何类型的参数。如果向此函数传递整数，将会引发错误，因为我们会尝试对整数调用\
  \ String.reverse。让我们更改它：\n\n```\n$ cat examples/string_helper_palindrome_with_guard_clause.ex\n\
  def palindrome?(term) when is_bitstring(term) do\n  String.reverse(term) == term\n\
  end\ndef palindrome?(_term), do: {:error, :unsupported_type}\n```\n\n我们现在声明我们期望参数为\
  \ bitstring。我们还创建了函数的另一个定义，当第一个定义不匹配时运行。它在实际中的表现如下：\n\n```\niex> StringHelper.palindrome?(\"\
  abba\")\ntrue\niex> StringHelper.palindrome?(123)\n{:error, :unsupported_type}\n\
  ```\n\n在函数中使用 guard 子句可能导致大量重复，因为我们可能一遍又一遍地重复相同的子句。为了解决这个问题，Elixir 1.6 引入了 defguard\
  \ 构造，它允许我们定义可重用的子句。\n\n此外，使用这种构造可能会提高代码的可读性，因为我们可以提取复杂的 guard 子句并为其赋予描述性的名称。让我们看看使用\
  \ defguard 实现的先前示例：\n\n```\n$ cat examples/string_helper_palindrome_with_defguard.ex\n\
  defguard is_string(term) when is_bitstring(term)\n\ndef palindrome?(term) when is_string(term)\
  \ do\n  String.reverse(term) == term\nend\ndef palindrome?(_term), do: {:error,\
  \ :unsupported_type}\n```\n\n在这个简单示例中，使用这种构造并没有明显的优势。然而，随着你的模块以及 guard 子句变得更加复杂，这种技术变得非常有用。请注意，你可以使用\
  \ defguardp 定义一个未导出的 guard 子句，只能在定义它的模块内部使用。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_47_0.png)\n\
  \n你可以在 guard 子句中使用其他类型检查函数，以及比较运算符，还有一些其他函数。你可以在 https://hexdocs.pm/elixir/guards.html\
  \ 找到完整列表。\n\n为了结束本节，我们现在将展示该语言最杰出的特性之一：管道 (|>) 运算符。此运算符允许你链接函数调用，使函数流程易于阅读和理解。此运算符取其左侧的项，并将其作为右侧函数的第一个参数注入。这个看似平淡无奇的特性提高了代码的可读性，这很惊人，因为代码被阅读的次数远多于被编写的次数。为了演示此运算符，让我们在\
  \ palindrome? 函数中添加更多逻辑：我们现在将从检查的项中删除前导或尾随空白，并且我们还将使比较不区分大小写。结果如下：\n\n```\n$ cat\
  \ examples/string_helper_palindrome_with_pipe_operator.ex\ndef palindrome?(term)\
  \ do\n  formatted_term = term\n    |> String.trim()\n    |> String.downcase()\n\n\
  \  formatted_term |> String.reverse() == formatted_term\nend\n```\n\n虽然在这种简单示例中影响似乎微不足道，但随着我们在书中构建应用程序，你会看到此运算符带来的表达力。\n\
  \n## 模块属性、指令和用法\n\nElixir 中的模块可能包含 *属性*。它们通常用于其他语言中使用常量的地方。你可以使用以下语法定义模块属性：\n\n\
  ```\n$ cat examples/string_helper_with_module_attribute.ex\ndefmodule StringHelper\
  \ do\n  @default_mark \"!\"\n\n  # rest of the StringHelper code\nend\n```\n\n然后，我们可以在该模块的函数内部使用\
  \ `@default_mark` 模块属性。此属性仅在编译时存在，因为它在该过程中会被其值替换。\n\n模块属性还有其他一些用例：你可以注册它们，使其在运行时可访问。例如，Elixir\
  \ 注册了 `@moduledoc` 和 `@doc` 属性，分别可用于为模块和函数提供文档。然后，其他 Elixir 工具可以在运行时访问此文档，我们将在 *工具和生态系统*\
  \ 部分进行探讨。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_48_0.png)\n\n我们现在第一次提到宏。宏是\
  \ Elixir 进行元编程的机制——生成编写代码的代码。我们不会在本入门章节中涉及宏，因为它们将在 *第 6 章，元编程 – 编写代码的代码* 中得到适当探讨。\n\
  \nElixir 提供了三种词法作用域的指令来管理模块，外加一个名为 `use` 的宏。我们现在来描述它们：\n\n- `alias` 用于为其他模块创建别名。你可以这样使用\
  \ `alias Helpers.StringHelper, as: StrHlp`，然后可以将该模块称为 `StrHlp`。`as:` 部分是可选的，如果你不提供它，别名将被设置为模块名称的最后一部分。\n\
  - 当我们想调用给定模块中定义为宏的内容时，我们使用 `require`。正如官方文档所述，`Integer` 模块中的 `is_odd/1` 被定义为宏。要在另一个模块中使用它，你必须\
  \ require 它：`require Integer.`\n- 当我们想要访问其他模块的函数而无需使用完全限定名称时，我们使用 import。当我们导入某个模块时，我们也会自动\
  \ require 它。例如，如果我们不断使用 String.reverse/1，我们可以导入它：import String, only: [reverse:\
  \ 1]。现在我们就可以直接在模块中使用 reverse。除了 only: 之外，你还可以使用 except: 来导入除给定数量函数之外的所有函数。除了函数名，only:\
  \ 和 except: 还接受 :modules 和 :functions（它们不言自明）。你也可以不带任何选项使用 import，但这不推荐，因为它会污染模块的作用域——使用\
  \ import 时始终尝试传递 only: 选项。\n- 最后但同样重要的是，我们有 use，它是一个宏。这通常用于为我们的模块带来额外功能。在表面之下，use\
  \ 调用 require 指令，然后调用 __using__/1 回调，这允许被使用的模块向我们的上下文注入代码。\n\n现在，你不需要知道所有这些是如何工作的。知道你有这些构造来处理模块就足够了。当我们在本书后面深入研究宏时，所有这些都会变得更加清晰。\n\
  \n## 处理集合\n\n与最常见的编程语言相反，Elixir 没有 while 或 do ... while 构造，这是有道理的，因为所有数据类型都是不可变的。在\
  \ Elixir 中迭代的方式是通过递归，通过函数调用自身。你在处理集合时的大多数需求都由 Elixir 提供的<|message|>抽象覆盖，这意味着在编写\
  \ Elixir 应用程序时你可能几乎不会使用递归。\n\n尽管如此，我们将首先简要描述递归，并展示 Elixir 中递归函数的示例。然后，我们将了解如何使用\
  \ Enum 模块处理集合，并以讨论惰性处理集合的好处以及如何使用 Stream 模块实现它来结束本节。\n\n\n\n## 通过递归循环\n\n我们将通过两个简单示例向你展示如何创建递归函数：对列表中的每个元素进行加倍，以及对列表中连续元素进行相乘。如前所述，虽然你在日常编码中可能不会使用它，但理解其工作原理仍然非常重要。这样，如果\
  \ Elixir 提供的抽象不足以满足你的使用场景，你就可以自行创建递归函数来实现所需功能。\n\n在进入示例之前，让我们先总体解释一下递归函数的工作原理。在\
  \ Elixir 中，它们通常被实现为多子句函数，使用模式匹配来控制其执行流程。第一个子句设置停止递归的条件，其后跟着其他更宽泛的子句来应用递归。\n\n在第一个示例中，我们希望将整数列表作为输入，并返回一个新列表，其中每个元素都乘以二。让我们看看这样一个函数的代码：\n\
  \n```\n$ cat examples/double.ex\ndefmodule Recursion do\n  def double([]), do: []\n\
  \n  def double([head | tail]) do\n    [head * 2 | double(tail)]\n  end\nend\n```\n\
  \n以下是其结果：\n\n```\niex> Recursion.double([2, 4, 6])\n[4, 8, 12]\n```\n\n除了使用多子句函数外，我们还在两种方式下使用模式匹配：判断何时到达末尾（空列表）并相应处理；以及提取列表的头和尾，这与我们在模式匹配部分展示的内容类似。递归发生在我们调用\
  \ double(tail) 时。由于我们只将尾部传递给递归调用，本质上是在遍历列表。当到达空列表时，第一个子句匹配，我们返回空列表，所有中间调用会展开并创建我们的新列表。\n\
  \n如果我们不想返回新列表，而是想返回单个值怎么办？我们将通过相乘列表中连续的元素来举例说明。以下是实现此功能的代码：\n\n```\n$ cat examples/multiply.ex\n\
  defmodule Recursion do\n  def multiply([]), do: 1\n\n  def multiply([head | tail])\
  \ do\n    head * multiply(tail)\n  end\nend\n```\n\n在 IEx 会话中对其的使用如下：\n\n```\niex>\
  \ Recursion.multiply([1, 2, 3])\n6\n```\n\n策略与前一个示例所示类似，不同之处在于，我们不再在每一步向列表添加元素，而是现在将\
  \ head 用作累加器。另外，需要注意的是，由于我们执行的是乘法，停止条件必须返回 1（该操作的单位元）。停止条件的定义因不同问题而异，这 arguably\
  \ 是递归定义函数时最重要步骤之一。\n\n处理递归函数时常见的担忧是其内存使用情况，因为会有多个函数调用进入栈。Erlang 运行时在可能的情况下会采用尾调用优化，这意味着递归调用不会产生新的栈压入。为了让运行时执行此优化，你必须确保函数最后做的事情是调用另一个函数（包括自身）——换句话说，进行尾调用。以下是更新后的\
  \ multiply 函数，使其进行尾调用：\n\n```\n$ cat examples/multiply_with_tail_recursion.ex\n\
  def multiply(list, accum \\\\ 1)\ndef multiply([], accum), do: accum\ndef multiply([head\
  \ | tail], accum) do\n  multiply(tail, head * accum)\nend\n```\n\n通常的策略是传递一个累加器，这使得我们能够使用尾调用优化。请注意，这里存在权衡：一方面，在处理大型集合时，此优化很重要（因为函数调用不会消耗额外内存）；另一方面，不使用此优化的代码通常更易于阅读和理解，因为它通常更简洁。在进行递归时，请考虑每种解决方案的优缺点。\n\
  \n## 使用 Enum 模块的急切处理\n\n在了解了 Elixir 中递归的工作原理后，我们现在将展示一些建立在其之上的抽象的示例。我们将探索 Enum 模块，它包含了一组用于操作集合的函数。我们已在\
  \ Elixir 数据类型部分见过集合的一些示例，例如列表或映射。更一般地说，我们可以在实现 Enumerable 协议的集合上使用 Enum 模块。\n\n\
  ![](img/c636f4cfb07f25f1db535995e50706ed_52_0.png)\n\n我们尚未介绍协议。我们将在《协议》部分进行介绍。\n\
  \n让我们以递归部分中的两个示例为例，看看使用 Enum 模块如何变得非常简单地实现：\n\n```\niex> Enum.map([2, 4, 6], &(&1\
  \ * 2))\n[4, 8, 12]\niex> Enum.reduce([1, 2, 3], 1, &(&1 * &2))\n6\n```\n\nmap 函数接收一个集合和一个\
  \ lambda，并返回一个新列表，其中 lambda 应用于集合的每个元素。\n\nreduce 函数接收一个集合、一个累加器和一个 lambda。lambda\
  \ 接收集合的当前元素和累加器，其结果是下一次迭代的累加器。迭代结束时，reduce 返回最终的累加器值。\n\n我们使用捕获操作符来定义 lambda。如前所述，你也可以用它来捕获命名函数。在以下示例中，我们使用\
  \ Integer.is_even/1 函数来检查集合中哪些数字是偶数：\n\n![](img/c636f4cfb07f25f1db535995e50706ed_52_1.png)\n\
  \n```\niex> require Integer\nInteger\niex> Enum.map([1, 2, 3], &Integer.is_even/1)\n\
  [false, true, false]\n```\n\n你将在本书中构建的应用中看到 Enum 模块的使用。有关 Enum 模块的进一步使用，请查阅其文档 https://hexdocs.pm/elixir/Enum.html。\n\
  \n## 推导式\n\nElixir 提供了另一种迭代集合的构造：推导式。与 Enum 模块的函数一样，推导式适用于实现 Enumerable 协议的任何内容。让我们看一个简单示例：\n\
  \n```\niex> for x <- [2, 4, 6], do: x * 2\n[4, 8, 12]\n```\n\n虽然在这个简单示例中它与 Enum.map/2\
  \ 类似，但推导式还带来了一些其他有趣的功能。例如，你可以遍历多个集合并应用过滤器。让我们在以下示例中看看这两者的应用：\n\n```\niex> for x\
  \ <- [1, 2, 3], y <- [4, 5, 6], Integer.is_odd(x), do: x * y\n[4, 5, 6, 12, 15,\
  \ 18]\n```\n\n这里我们进行嵌套迭代——对于第一个可枚举项的每个元素（由 x 表示），我们将遍历第二个可枚举项的所有元素（由 y 表示）。此外，我们还应用了过滤器，只有当\
  \ x 为奇数时，我们的推导式主体才会被执行。\n\n我们在本书中构建的应用中不会使用推导式。然而，提到它们很重要，因为在某些情况下，使用推导式而不是 Enum\
  \ 模块的函数会使代码更优雅、更具表现力。\n\n在我们的示例中，所有推导式都返回列表，这是默认行为。我们可以通过传递 into: 选项来更改它，如本示例所示：\n\
  \n```\niex> for x <- [1, 2, 3], into: %{}, do: {x, x + 1}\n%{1 => 2, 2 => 3, 3 =>\
  \ 4}\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_53_0.png)\n\n如你所见，现在我们得到的是一个映射。into:\
  \ 选项接受一个集合，用于接收推导式的结果。该集合必须实现 Collectable 协议。该协议可以被视为 Enumerable 协议的相反，用于从现有集合的值创建新结构。这在推导式之外也有用途——Enum.into/2\
  \ 函数使用此协议基于可枚举项创建新集合。\n\n## 使用 Stream 模块的惰性处理\n\n我们现在将讨论一种不同的处理集合的方式，这在函数式编程中可能需要转变你的思维方式。在讨论惰性处理之前，让我们列举一下使用\
  \ Enum 模块的一些不足。Enum 模块被称为急切的。这意味着在处理集合时，该模块会将整个集合加载到内存中。此外，如果你有一系列想要应用于集合的函数，Enum\
  \ 模块会遍历你的集合，次数与函数应用的次数一样多。让我们通过一个示例进一步说明：\n\n```\niex> [1, 2, 3, 4, 5] \\\n...>\
  \ |> Enum.map(&(&1 + 10)) \\\n...> |> Enum.zip([\"a\", \"b\", \"c\", \"d\", \"e\"\
  ])\n[{11, \"a\"}, {12, \"b\"}, {13, \"c\"}, {14, \"d\"}, {15, \"e\"}]\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_54_0.png)\n\
  \n前两行末尾的 \\ 用于阻止我们的 Elixir 控制台立即评估该行，而是等待新行。这样，我们就可以使用管道操作符在多行上编写这些操作，使其更易读。\n\n\
  我们取初始集合并遍历它，为其中的每个元素加上 10。这会生成一个新列表，该列表被传递给下一个函数。该函数将两个列表一起 zip，这会产生一个新列表并返回给我们。在这个简单示例中，我们需要遍历列表两次才能构建所需结果。\n\
  \n这正是 Stream 模块和惰性处理变得有优势的地方。在处理惰性可枚举项时，整个集合永远不会被加载到内存中，而且与我们习惯的不同，计算不会立即进行。结果在需要时才产生。让我们用\
  \ Stream 模块看看同一个示例：\n\n```\niex> [1, 2, 3, 4, 5] \\\n...> |> Stream.map(&(&1 + 1))\
  \ \\\n...> |> Stream.zip([\"a\", \"b\", \"c\", \"d\", \"e\"])\n#Function<66.40091930/2\
  \ in Stream.zip/1>\n```\n\n如你所见，我们没有得到最终的列表。当我们将列表提供给 Stream.map 时，列表不会被遍历。相反，将应用于它的函数会保存到一个结构中（连同我们正在处理的集合一起）。然后我们可以将此结构传递给下一个函数，该函数会进一步保存一个要应用于列表的新函数。这真的很酷！但我们如何让它返回我们期望的结果呢？只需将其视为常规（急切）可枚举项，通过应用\
  \ Enum 模块的函数，它就会开始产生结果。\n\n\n\n为了举例说明，我们将使用 Enum.take/2 函数，它允许我们从可枚举对象中取出指定数量的项：\n\
  \n```\niex> [1, 2, 3, 4, 5] \\\n...> |> Stream.map(&(&1 + 10)) \\\n...> |> Stream.zip([\"\
  a\", \"b\", \"c\", \"d\", \"e\"]) \\\n...> |> Enum.take(1)\n[{11, \"a\"}]\n```\n\
  \n如你所见，我们现在得到了预期的结果。请注意，这并不是先对整个列表应用计算然后再取第一个元素的结果。我们本质上只为第一个元素计算了结果，因为这就是所必需的。如果你最终想要完整的列表，可以使用\
  \ Enum.to_list/1 函数。\n\n流是一种非常灵活的方式来处理大型，甚至无限的集合。想象一下，你正在解析一个巨大的 CSV 文件中的值，然后对其运行一些函数。如果你像大多数人现在一样在云上运行应用程序，你可能只有有限的内存。使用惰性处理，你可以避免加载整个文件，按行处理它。如果你正在处理无限集合，例如\
  \ RSS 订阅源，惰性处理也是一个很好的解决方案，因为你可以随着元素的到达逐步处理集合中的每个元素。\n\n请注意，虽然 Stream 模块很棒，但它不会取代你对\
  \ Enum 模块的使用。对于非常大的集合，或者当你有一长串函数应用于集合并且只想遍历一次时，它确实很棒。然而，对于小或中等大小的集合，Stream 模块的性能会更差，因为你增加了很多开销，例如必须保存要应用的函数而不是立即应用它们。在为特定任务选择使用\
  \ Enum 或 Stream 模块时，务必仔细分析你的情况并将此考虑在内。\n\n我们将在本书中构建的应用程序中使用 Stream 模块中的函数。你将在第 4\
  \ 章 Powered by Erlang/OTP 中了解更多关于 Stream 模块的内容。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_55_0.png)\n\
  \nElixir 提供了一些包装构建流的大部分复杂部分的函数。如果你想构建自己的惰性流，请查看 Stream 模块中的这些函数：cycle、repeatedly、iterate、unfold\
  \ 和 resource。Stream 的完整文档可以在 https://hexdocs.pm/elixir/Stream.html 找到。\n\n## 控制流\n\
  \n我们现在介绍控制流构造。在 Elixir 中，它们不像在传统的命令式语言中那样常用，因为我们可以通过模式匹配、多子句函数和守卫子句的组合来满足控制流需求。每当你准备使用本节介绍的构造之一时，请停下来检查是否可以采用更函数式的方法。没有这些传统控制流构造的代码通常更容易理解和测试。如果你到了有嵌套条件语句的地步，几乎可以肯定你可以通过使用我之前提到的其中一种方法来简化它。无论如何，你偶尔会使用这些构造，因此了解它们存在很重要。\n\
  \n### if 和 unless\n\n这两个构造可以用以下语法使用：\n\n```\nif <expression> do\n  # expression\
  \ was truthy\nelse\n  # expression was falsy\nend\n```\n\n```\nunless <expression>\
  \ do\n  # expression was falsy\nelse\n  # expression was truthy\nend\n```\n\n与 `def`\
  \ 构造一样，它们可以内联。对于 `if`，你可以这样做：\n\n```\nif <expression>, do: # expression was truthy,\
  \ else: # expression was falsy\n```\n\n对于这两个构造，`else` 子句是可选的。如果主子句不匹配且未提供 `else`\
  \ 子句，它们将返回 `nil`。\n\n### cond\n\n`cond` 可以被视为多路 `if` 语句，其中第一个 *truthy* 条件将运行其关联的代码。这可以替代\
  \ `if` ... `else if` 块的链。让我们在 IEx 上用一个例子来看一下：\n\n```\niex> x = 5\n```\n\n```\n5\n\
  iex> cond do\n...>   x * x == 9 -> \"x was 3\"\n...>   x * x == 16 -> \"x was 4\"\
  \n...>   x * x == 25 -> \"x was 5\"\n...>   true -> \"none of the above matched\"\
  \n...> end\n\"x was 5\"\n```\n\n条件中的 true 将作为默认条件，当没有其他子句匹配时运行。\n\n### case\n\n\
  case 接受一个表达式和一个或多个模式，这些模式将与表达式的返回值匹配。这些模式可能包含守卫子句。这些模式按从上到下的顺序匹配，并将运行第一个匹配表达式关联的代码。这是一个简单的例子：\n\
  \n```\niex> case Enum.random(1..10) do\n...>   2 -> \"The lucky ball was 2\"\n...>\
  \   7 -> \"The lucky ball was 7\"\n...>   _ -> \"The lucky ball was not 2 nor 7\"\
  \n...> end\n\"The lucky ball was not 2 nor 7\"\n```\n\n请注意，运行此示例时你的输出可能不同，因为我们正在匹配\
  \ Enum.random/1。在这里，默认条件是通过在模式中使用 _ 来表示的，它将匹配任何内容。虽然更紧凑一些，case 构造与多子句函数类似。\n\n###\
  \ with\n\n这个在 Elixir 1.2 中引入的控制流构造接受一个或多个表达式、一个 do 块以及可选的 else 块。它允许你对每个表达式的返回值使用模式匹配，如果每个模式都匹配则运行\
  \ do 块。如果某个模式不匹配，可能会发生两件事：如果提供了 else 块，则会执行它；否则，它将返回与表达式不匹配的值。实际上，with 允许你用它替换 case\
  \ 的嵌套链或一组多子句函数。\n\n为了演示 with 的有用性，让我们看一个例子：\n\n```\niex> options = [x: [y: [z: \"\
  the value we're after!\"]]]\n[x: [y: [z: \"the value we're after!\"]]]\niex> case\
  \ Keyword.fetch(options, :x) do\n...>   {:ok, value} -> case Keyword.fetch(value,\
  \ :y) do\n...>     {:ok, inner_value} -> case Keyword.fetch(inner_value, :z) do\n\
  ...>       {:ok, inner_inner_value} -> inner_inner_value\n...>       _ -> \"non-existing\
  \ key\"\n...>     end\n...>     _ -> \"non-existing key\"\n...>   end\n...>   _\
  \ -> \"non-existing key\"\n...> end\n\"the value we're after!\"\n```\n\n我们使用 Keyword.fetch/2\
  \ 函数从关键字列表中获取键的值。此函数在键存在时返回 {:ok, value}，否则返回 :error。我们想要检索嵌套在三个关键字列表中的值。然而，假设如果我们尝试获取关键字列表中不存在的键，我们必须返回\
  \ \"non-existing key\"。让我们使用 with 实现相同的行为，操作与前一个示例相同的 options 列表：\n\n```\niex> with\
  \ {:ok, value} <- Keyword.fetch(options, :x),\n...>   {:ok, inner_value} <- Keyword.fetch(value,\
  \ :y),\n...>   {:ok, inner_inner_value} <- Keyword.fetch(inner_value, :z),\n...>\
  \ do: inner_inner_value\n\"the value we're after!\"\n```\n\n请注意，由于我们的表达式非常小，我们使用了简写的\
  \ do: 语法（但我们也可以使用常规的 do ... end 块）。如你所见，我们得到了相同的结果。让我们尝试获取一个不存在的键：\n\n```\niex>\
  \ with {:ok, value} <- Keyword.fetch(options, :missing_key),\n...>   {:ok, inner_value}\
  \ <- Keyword.fetch(value, :y),\n...>   {:ok, inner_inner_value} <- Keyword.fetch(inner_value,\
  \ :z),\n...> do: inner_inner_value\n:error\n```\n\n由于我们没有提供 else 块，我们得到的返回值是不匹配的值，即当提供的关键字列表中不存在键时\
  \ Keyword.fetch/2 的返回值。让我们做同样的事情，但提供一个 else 块：\n\n```\niex> with {:ok, value} <-\
  \ Keyword.fetch(options, :missing_key),\n...> {:ok, inner_value} <- Keyword.fetch(value,\
  \ :y),\n...> {:ok, inner_inner_value} <- Keyword.fetch(inner_value, :z) do\n```\n\
  \n```\n...> inner_inner_value\n...> else\n...> :error -> \"non-existing key\"\n\
  ...> _ -> \"some other error\"\n...> end\n\"non-existing key\"\n```\n\n由于我们现在提供了\
  \ `else` 块，我们现在可以相应地处理错误情况。如你所见，`else` 接受要匹配的模式列表。就像使用 `case` 一样，你可以使用 `_` 作为默认子句，当上面的模式（如果有）不匹配时运行。\n\
  \n如你所见，`with` 是一个非常有用的构造，它允许我们创建简洁且易于阅读的非常富有表现力的代码。此外，你可以使用 `else` 块内的模式匹配单独控制如何处理每个错误。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_59_0.png)\n\n提供给 `with` 的第一个表达式必须与 `with`\
  \ 本身在同一行，否则你会得到 `SyntaxError`。如果你确实想让 `with` 位于自己的行上，请将提供给它的表达式用括号括起来。\n\n## 异常\n\
  \n就像 `if` 和 `else` 一样，异常在 Elixir 中不像在其他流行的命令式语言中那样常用。异常不用于控制流，而是留给真正异常的情况。当它们发生时，你的进程通常在监督树下运行，并且在崩溃时，你的进程的监督者将被通知并（可能取决于策略）重启它。然后，在重启后，你回到了已知且稳定的状态，异常事件的影响不再存在。在\
  \ Elixir 和 Erlang 社区中，这通常被称为 \"Let it crash!\" 哲学。我们将在 `Chapter 3, Processes – The\
  \ Bedrock for Concurrency and Fault Tolerance` 中更详细地研究这个问题，当我们谈论进程、监督者和监督树时。\n\n\
  现在，我将列出传统的错误处理构造。你可以使用 `raise` 构造引发错误，它接受一个或两个参数。如果你只提供一个参数，它将引发 `RuntimeError`，参数作为消息。如果你提供两个参数，第一个参数是错误的类型，而第二个是该错误的\
  \ attributes 关键字列表（所有错误至少必须接受 `message:` 属性）。让我们看看实际效果：\n\n```\niex> raise \"Something\
  \ very strange occurred\"\n** (RuntimeError) Something very strange occurred\n```\n\
  \n```\niex> raise ArithmeticError, message: \"Some weird math going on here\"\n\
  ** (ArithmeticError) Some weird math going on here\n```\n\n你可以通过使用 `rescue` 构造来捕获错误（你可以从\
  \ `try` 块或整个函数中捕获，与 `def` 配对）。你可以在 rescue 子句上定义模式。你可以使用 `_` 来匹配任何内容。如果没有任何模式匹配，错误将不会被捕获，程序的行为将如同没有\
  \ rescue 子句一样：\n\n```\niex> try do\n...> 5 / 0\n...> rescue\n...> e in ArithmeticError\
  \ -> \"Tried to divide by 0.\"\n...> _ -> \"None of the above matched\"\n...> end\n\
  \"Tried to divide by 0.\"\n```\n\n由于我们并没有对错误做任何处理，只是返回一个字符串，我们可以直接在模式中使用 `ArithmeticError`。只有当你想捕获错误本身时才使用这种语法。当没有任何模式匹配时，我们会在控制台中得到错误：\n\
  \n```\niex> try do\n...> 5 / 0\n...> rescue\n...> ArgumentError -> \"ArgumentError\
  \ was raised.\"\n...> end\n** (ArithmeticError) bad argument in arithmetic expression\n\
  ```\n\n此外，你还可以为 `try/rescue` 块传递 `else` 和/或 `after` 块。`else` 块会在 `try` 主体在未引发任何错误的情况下完成时，对其结果进行匹配。至于\
  \ `after` 构造，它将始终被执行，无论是否引发了错误。这通常用于清理某些资源（例如关闭文件描述符）。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_60_0.png)\n\
  \n我们在本节中提到我们不使用异常来控制程序的流程，但事实上 Elixir 为此提供了一个特殊的构造。其语法与前面所示类似，但你使用 `throw` 代替 `raise`，并使用\
  \ `catch` 代替 `rescue`。正如官方 *入门指南* 中所述（http://elixir-lang.github.io/getting-started/try-catch-and-rescue.html），这应该在除非使用\
  \ throw 和 catch 否则无法检索值的情况下使用。文中还提到在实践中这种情况相当罕见。\n\n## 类型规范和行为\n\n正如本章开头已提到的，Elixir\
  \ 是一种动态编程语言。因此，我们不声明每个变量的类型，因为它取决于每个变量在每个时刻绑定的值。\n\n通常动态编程语言会带来更高的生产力，因为程序员无需声明类型，可以专注于应用程序的逻辑开发。然而，这是有代价的：在静态类型语言中会在编译时捕获的某些错误，在动态语言中可能只能在运行时捕获。使用动态语言节省的时间随后会被（往往过度地）用于生产环境的调试。\n\
  \n我们并不提倡静态类型语言——毕竟这本书是关于 Elixir 的。但如果可以兼得两者之长呢？\n\n事实证明你可以！类型规范，或 typespecs，是一种用于用相应的类型（参数和返回值）为函数签名做注解的机制。Typespecs\
  \ 也用于创建自定义数据类型。让我们在深入行为之前更详细地探索它们。\n\n### 类型规范\n\nTypespecs 是使用 `@spec` 模块指令编写的，后跟\
  \ `function_name(argument_type) :: return_type`。此模块指令放置在我们要注解的函数定义正前方。\n\n为了演示如何将\
  \ typespecs 应用于函数，让我们重新引入我们的 `palindrome?` 函数：\n\n```elixir\n$ cat examples/string_helper.ex\n\
  defmodule StringHelper do\n  def palindrome?(term) do\n    String.reverse(term)\
  \ == term\n  end\nend\n```\n\n鉴于模块名为 `StringHelper`，并且它使用 `String` 模块中的函数，我们可以看到此函数接收一个字符串。由于它使用了\
  \ `==` 运算符，并且函数名尾部的 `?` 也暗示了这一点，我们知道此函数返回一个布尔值。有了这些信息，为此函数编写 typespec 很直接：\n\n```elixir\n\
  $ cat examples/string_helper_palindrome_with_typespec.ex\ndefmodule StringHelper\
  \ do\n  @spec palindrome?(String.t) :: boolean\n  def palindrome?(term) do\n   \
  \ String.reverse(term) == term\n  end\nend\n```\n\n你也可以使用 @type 指令在模块内定义自己的类型以在\
  \ typespecs 中使用（通常是在该类型使用最多的模块中）。假设你在模块中经常使用一个元组，其第一个元素是国家名称，第二个元素是其人口，如 {\"Portugal\"\
  , 10_309_573}。你可以用以下方式为此数据结构创建一个类型：\n\n```\n@type country_with_population :: {String.t,\
  \ integer}\n```\n\n然后，你就可以像使用任何其他类型一样在 typespecs 中使用 country_with_population。\n\n\
  在模块中定义类型会将其导出，使其可供所有模块使用。如果你希望类型私有且仅限于定义它的模块，请使用 @typep 指令。与用于分别记录模块和函数的 @moduledoc\
  \ 和 @doc 指令类似，你可以使用 @typedoc 指令为特定类型提供文档。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_62_0.png)\n\
  \n在 typespecs 中，字符串类型通常由 String.t 表示。你也可以使用 string，但 Elixir 社区不鼓励这样做，目的是避免与表示 Erlang\
  \ 中字符串的 charlist 类型混淆。如果你在使用 typespecs 时使用 string，编译器会发出警告。\n\nTypespecs 还提供了很好的文档，因为我们可以快速了解此函数接受和返回的类型。此示例仅展示了可用的类型子集——请参阅官方文档以获取完整列表，网址为\n\
  \nhttps://hexdocs.pm/elixir/typespecs.html.\n\n### Dialyzer\n\nDialyzer (http://erlang.org/doc/man/dialyzer.html)\
  \ 是随 Erlang 一起提供的工具，用于对代码进行静态分析。它分析编译后的 .beam 文件，因此适用于所有在 Erlang VM 上运行的编程语言（如 Elixir！）。虽然\
  \ Dialyzer 在没有 typespecs 的项目上也很有帮助（例如可以查找冗余代码），但其威力在函数带有 typespecs 注解的项目上最大化。这样，Dialyzer\
  \ 就能够报告类型错误，使你更接近静态类型语言所能提供的安全性。\n\n尽管本书不会探讨 Dialyzer，我们强烈推荐使用它，因为它非常有帮助。特别是，我们认为\
  \ Dialyxir 库（https://github.com/jeremyjh/dialyxir）是将 Dialyzer 集成到 Elixir 项目中的一种很好的方式，因为它抽象掉了直接处理\
  \ Dialyzer 的部分复杂性。\n\n### 行为\n\n行为提供了一种描述模块必须实现的一组函数的方式，同时确保模块实现了该集合中的函数。如果你来自面向对象编程背景，可以将行为视为定义接口的抽象基类。在声明行为后，我们可以创建采用此行为的其他模块。行为创建了一个明确的契约，说明采用该行为的模块需要实现什么。这样，我们可以将业务逻辑绑定到抽象（行为）而不是具体实现。我们可以用很少且本地化的更改在应用程序中交换同一行为的两个实现——即在我们定义要使用的行为实现的位置。\n\
  \n让我们用一个例子来演示这个概念。我们将定义一个名为 Presenter 的行为，它只有一个函数：present。然后我们将定义一个采用此行为的模块，称为 CLI.Presenter。我们也可以有其他采用此行为的模块，例如\
  \ GraphicalPresenter。行为是使用模块内的 @callback 指令创建的，为该行为包含的每个函数提供 typespec。因此，要定义我们的\
  \ Presenter 行为，我们使用以下内容：\n\n```\n$ cat examples/presenter.ex\ndefmodule Presenter\
  \ do\n  @callback present(String.t) :: atom\nend\n```\n\n现在我们定义将采用此行为的模块：\n\n```\n\
  $ cat examples/cli_presenter.ex\ndefmodule CLI.Presenter do\n  @behaviour Presenter\n\
  \n  @impl true\n  def present(text) do\n    IO.puts(text)\n  end\nend\n```\n\n\n\
  \n我们可以在下一个代码片段中看到该模块的工作情况：\n\n```\niex> CLIPresenter.present(\"printing text to\
  \ the command line\")\nprinting text to the command line\n:ok\n```\n\n从 Elixir 1.5\
  \ 开始，我们可以使用 @impl 指令来标记作为行为回调而实现的功能。在我们的例子中，我们会在 present 函数上方放置 @impl 指令：\n\n```\n\
  $ cat examples/cli_presenter_with_impl_annotation.ex\ndefmodule CLIPresenter do\n\
  \  @behaviour Presenter\n\n  @impl true\n  def present(text) do\n    IO.puts(text)\n\
  \  end\nend\n```\n\n我们可以更具体一些，使用 @impl Presenter 来说明该函数是来自 Presenter 行为的回调。这带来了两个主要优势：\n\
  \n- 可读性提高，因为现在明确了哪些函数构成我们 API 的一部分，哪些函数是回调实现。\n- 一致性更高，因为 Elixir 编译器会检查你用 @impl\
  \ 标记的函数是否属于模块所采用的行为的一部分。\n\n请注意，当你在模块上设置 @impl 时，必须将其设置在该模块的所有回调函数上，否则会发出警告。此外，你只能在回调函数上使用\
  \ @impl，否则也会发出编译警告。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_64_0.png)\n\n你可以使用\
  \ @optional_callbacks 在采用某个行为时将一个或多个函数标记为可选。你需要提供一个关键字列表，其中函数名作为键，元数为值。如果我们希望 Presenter\
  \ 行为中的 present/1 函数是可选的，我们将使用：\n\n```\n$ cat examples/presenter_with_optional_callbacks.ex\n\
  defmodule Presenter do\n  @callback present(String.t) :: atom\n  @optional_callbacks\
  \ present: 1\nend\n```\n\n如果我们没有实现 Presenter 行为中声明的所有函数（例如通过注释掉 CLI 的 Presenter.present/1\
  \ 函数），Elixir 编译器将发出以下警告：\n\n```\nwarning: undefined behaviour function present/1\
  \ (for behaviour Presenter)\n```\n\n行为帮助我们遵循开闭原则，因为我们可以扩展系统而无需修改已有内容。如果将来需要一种新的呈现器类型，我们只需创建一个采用\
  \ Presenter 行为的新模块，而无需更改行为或其当前实现。我们将在本书中构建的应用程序中使用行为，你将在下一章再次看到它们的使用。\n\n## 协议\n\
  \n在本入门章节中，我们多次提到 Elixir 有协议，其中 Enumerable 就是一个例子。在本节中，我们将深入探讨协议，甚至自己定义一个！\n\n协议与上一节中看到的行为类似，定义了一组必须实现的功能。从这个意义上说，这两种结构都可以用作在\
  \ Elixir 中实现多态的一种方式——能够表现出多种行为形式，但都链接到单一接口。虽然行为定义了模块需要实现的一组函数，因此与模块绑定，但协议定义了数据类型必须实现的一组函数。这意味着，使用协议时，我们具有数据类型多态性，并且能够编写根据参数类型而行为不同的函数。\n\
  \n现在让我们看看如何创建一个新协议。我们将采用并扩展官方入门指南（位于 http://elixir-lang.github.io/getting-started/protocols.html）中的示例。我们将定义一个\
  \ Size 协议，将由每种数据类型实现。要定义新协议，我们使用 defprotocol 构造：\n\n```\n$ cat examples/size.ex\n\
  defprotocol Size do\n  @doc \"Calculates the size of a data structure\"\n  def size(data)\n\
  end\n```\n\n我们声明我们的 Size 协议期望实现它的数据类型必须定义一个 size/1 函数，其中参数是我们想要知道其大小的数据结构。\n\n你可以使用\
  \ @doc 指令为此函数添加文档，就像你通常对模块内部的命名函数所做的那样。现在我们可以使用 defimpl 构造为我们感兴趣的数据类型定义此协议的实现：\n\
  \n```\n$ cat examples/size_implementations_basic_types.ex\ndefimpl Size, for: BitString\
  \ do\n  def size(string), do: byte_size(string)\nend\n\ndefimpl Size, for: Map do\n\
  \  def size(map), do: map_size(map)\nend\n\ndefimpl Size, for: Tuple do\n  def size(tuple),\
  \ do: tuple_size(tuple)\nend\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_66_0.png)\n\
  \n我们没有为列表定义实现，因为在 Elixir 中，size 通常用于其大小预先计算的数据结构。对于需要按需计算的类型，例如列表，则使用 length 而不是\
  \ size。这一点可以通过查看获取列表维度的函数名称进一步观察到：\nKernel.length/1.\n\n在此定义后，我们可以看到我们的协议在实际运行：\n\
  \n```\niex> Size.size(\"a string\")\n8\niex> Size.size(%{a: \"b\", c: \"d\"})\n\
  2\niex> Size.size({1, 2, 3})\n3\n```\n\n如果我们尝试在未定义实现的类型上使用我们的协议，将会引发错误：\n\n```\n\
  iex> Size.size([1, 2, 3, 4])\n** (Protocol.UndefinedError) protocol Size not implemented\
  \ for [1, 2, 3, 4]\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_66_1.png)\n\n\
  你可以在所有 Elixir 数据类型上为协议定义实现：Atom、BitString、Float、Function、Integer、Tuple、List、Map、PID、Port\
  \ 和 Reference。请注意，BitString 也用于二进制类型。\n\n为所有类型实现协议可能会很快变得单调乏味。你可以通过为 Any 实现协议来为未实现协议的类型定义回退行为。让我们为我们的\
  \ Size 协议这样做：\n\n```\n$ cat examples/size_implementation_any.ex\ndefimpl Size, for:\
  \ Any do\n  def size(_), do: 0\nend\n```\n\n你必须定义当类型未实现协议时的期望行为。在这种情况下，我们说它的大小为\
  \ 0（这可能没有意义，因为数据类型可能的大小不同于 0，但让我们忽略这个细节）。\n\n现在我们有两种选择来使用此实现：要么用 @derive [Size]\
  \ 标记我们想要此回退行为的模块（例如 List 模块），要么在 Size 协议的定义中使用 @fallback_to_any true。前者更费力，因为你必须为每个想要假设\
  \ Any 行为的模块进行注解，而后者更简单，因为只需更改协议定义即可使其适用于所有数据类型。在 Elixir 社区中，通常更偏好显式性，因此在 Elixir\
  \ 项目中你更有可能看到 @derive 方法。\n\n虽然为 Elixir 的数据类型实现协议已经开启了无限可能，但只有将它们与结构体混合使用时，我们才能充分利用\
  \ Elixir 的可扩展性。我们尚未讨论结构体，因此将在下一节中介绍它们。\n\n## 结构体\n\n结构体是构建在映射之上的抽象。我们在模块内部使用 defstruct\
  \ 构造来定义结构体。结构体的名称是定义它的模块的名称（这意味着每个模块只能定义一个结构体）。对于 defstruct，我们传递一个关键字列表，其中包含定义结构体具有的字段的键值对以及它们的默认值。让我们定义一个\
  \ Folder 结构体：\n\n```\n$ cat examples/folder.ex\ndefmodule Folder do\n  defstruct\
  \ name: \"new folder\", files_info: [], path: nil\nend\n```\n\n现在我们可以在 IEx 会话中使用它：\n\
  \n```\niex> %Folder{}\n%Folder{files_info: [], name: \"new folder\", path: nil}\n\
  iex> %Folder{}.name\n\"new folder\"\niex> %Folder{}.files_info\n[]\n```\n\nElixir\
  \ 已有 File 模块，提供多个处理文件的函数。其中之一是 File.stat/2，它返回一个包含所提供路径信息的 %File.Stat{} 结构体。我们 %Folder{}\
  \ 结构体中的 files_info 字段是一个列表，将包含 %File.Stat{} 结构体作为元素。让我们用一个文件初始化一个文件夹：\n\n```\niex>\
  \ folder = %Folder{files_info: [File.stat!(\"string_helper.ex\")]}\n%Folder{files_info:\
  \ [%File.Stat{access: :read_write,\n  atime: {{2017, 12, 31}, {16, 58, 56}}, ctime:\
  \ {{2017, 12, 30}, {3, 40, 29}},\n  gid: 100, inode: 3290229, links: 1, major_device:\
  \ 65024, minor_device: 0,\n  mode: 33188, mtime: {{2017, 12, 30}, {3, 40, 29}},\
  \ size: 509, type: :regular,\n  uid: 1000}], name: \"new folder\", path: nil}\n\
  ```\n\n请注意，此示例假定你在启动 iex 的目录中有 \"string_helper.ex\" 文件。另请注意，我们使用的是 File.stat!，它与\
  \ File.stat 类似，但不是返回 {:ok, result} 元组，而是直接返回结果本身。\n\n现在我们有一个包含一个文件的文件夹 %Folder{}\
  \ 结构体。现在我们可以向你展示更新结构体的语法，它与在映射中使用的语法类似（或者你可以使用 Map 模块中的函数）。假设你在当前工作目录中也有 \"recursion.ex\"\
  \ 文件，你可以使用此语法来更新结构体：\n\n```\niex> folder = %Folder{ folder | files_info: [File.stat!(\"\
  recursion.ex\") | folder.files_info]}\n%Folder{files_info: [%File.Stat{access: :read_write,\n\
  \  atime: {{2017, 12, 30}, {20, 8, 29}}, ctime: {{2017, 12, 30}, {20, 8, 25}},\n\
  \  gid: 100, inode: 3278529, links: 1, major_device: 65024, minor_device: 0,\n \
  \ mode: 33188, mtime: {{2017, 12, 30}, {20, 8, 25}}, size: 270, type: :regular,\n\
  \  uid: 1000},\n  %File.Stat{access: :read_write, atime: {{2017, 12, 31}, {16, 58,\
  \ 56}},\n  ctime: {{2017, 12, 30}, {3, 40, 29}}, gid: 100, inode: 3290229, links:\
  \ 1,\n  major_device: 65024, minor_device: 0, mode: 33188,\n  mtime: {{2017, 12,\
  \ 30}, {3, 40, 29}}, size: 509, type: :regular, uid: 1000}],\nname: \"new folder\"\
  , path: nil}\niex> folder.files_info\n```\n\n```\n[%File.Stat{access: :read_write,\
  \ atime: {{2017, 12, 30}, {20, 8, 29}}, ctime: {{2017, 12, 30}, {20, 8, 25}}, gid:\
  \ 100, inode: 3278529, links: 1, major_device: 65024, minor_device: 0, mode: 33188,\
  \ mtime: {{2017, 12, 30}, {20, 8, 25}}, size: 270, type: :regular, uid: 1000}, %File.Stat{access:\
  \ :read_write, atime: {{2017, 12, 31}, {16, 58, 56}}, ctime: {{2017, 12, 30}, {3,\
  \ 40, 29}}, gid: 100, inode: 3290229, links: 1, major_device: 65024, minor_device:\
  \ 0, mode: 33188, mtime: {{2017, 12, 30}, {3, 40, 29}}, size: 509, type: :regular,\
  \ uid: 1000}]\n```\n\n如你所见，我们现在在 %Folder{} 结构体中有两个文件。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_69_0.png)\n\
  \n虽然结构体是基于 map 实现的，但它们与 Map 模块不共享协议实现。这意味着开箱即用时你无法遍历结构体，因为它没有实现 Enumerable 协议。\n\
  \n我们将以关于结构体的两个额外信息结束这次小小的探索。首先，如果在定义结构体字段时未提供默认值，则 nil 将被视为其默认值。其次，你可以在创建结构体时强制要求某些字段。你可以通过\
  \ @enforce_keys 模块属性来实现这一点。如果我们想确保在创建 %Folder{} 结构体时提供 path，我们会按如下方式定义它：\n\n```\n\
  $ cat examples/folder_with_enforce_keys.ex\ndefmodule Folder do\n  @enforce_keys\
  \ :path\n\n  defstruct name: \"new folder\", files_info: [], path: nil\nend\n```\n\
  \n如果在创建此结构体时未提供 path，将会引发 ArgumentError：\n\n```\niex> %Folder{}\n** (ArgumentError)\
  \ the following keys must also be given when building struct Folder: [:path]\n \
  \ expanding struct: Folder.__struct__/1\n    iex:46: (file)\niex> %Folder{path:\
  \ \"/a/b/c/\"}\n%Folder{files_info: [], name: \"new folder\", path: \"/a/b/c/\"\
  }\n```\n\n## 将结构体与协议结合\n\n现在 %Folder{} 结构体已定义，我们可以为其定义 Size 协议的实现。\n\n我们首先为 %File.Stat{}\
  \ 结构体定义实现，因为之后可以利用它来实现 %Folder{} 的协议。以下是 %File.Stat{} 的实现：\n\n```\n$ cat examples/size_implementations_file_stat_and_folder.ex\n\
  defimpl Size, for: File.Stat do\n  def size(file_stat), do: file_stat.size\nend\n\
  \n# ...\n```\n\n在此基础上，我们的 %Folder{} 结构体的实现如下：\n\n```\n$ cat examples/size_implementations_file_stat_and_folder.ex\n\
  # ...\n\ndefimpl Size, for: Folder do\n  def size(folder) do\n    folder.files_info\n\
  \    |> Enum.map(&Size.size(&1))\n    |> Enum.sum()\n  end\nend\n```\n\n要找出文件夹的大小，我们将其中每个文件大小相加。因此，此实现会遍历\
  \ files_info 列表，使用 %File.Stat{} 的 Size 实现获取每个文件的大小，最后将所有大小求和。在下面的代码片段中，我们可以看到此实现被应用于我们刚刚定义的\
  \ folder 变量：\n\n```\niex> Size.size(folder)\n779\n```\n\n通过这点，我们可以看到混合结构体和协议的强大之处，它让我们可以根据参数的数据类型拥有多态函数。我们现在有一个通用接口\
  \ Size.size(data)，它允许我们找出几乎任何我们想要的大小，前提是我们为感兴趣的数据类型实现了 Size 协议。\n\n## 工具与生态系统\n\n\
  本章的最后一节专门介绍 Elixir 最为人称道的特性之一：其令人难以置信的工具链。此外，由于我们可以直接使用 Erlang 库，我们可以利用一个已经存在数十年的非常成熟的生态系统。首先，让我们从\
  \ Elixir 的交互式 shell IEx 开始。\n\n## IEx\n\n在本章开头，我们提供了启动和停止 Elixir shell 的一些说明。你在本章中已多次看到它的使用。现在我们将向你展示在\
  \ IEx 中可以做的其他一些有趣的事情。\n\n在本章中，我们为你提供了多个 Elixir 模块的官方文档链接。你可以直接从 IEx 中使用 h 命令访问这些文档。假设你想了解更多关于\
  \ Enum 模块的信息：\n\n```\niex> h Enum\nEnum\n#...,\n```\n\n前面的代码提供了一组根据 Enumerable 协议对可枚举对象进行枚举的算法。\n\
  \n请注意，出于简洁考虑，此命令的输出已被裁剪。\n\n你甚至可以传递一个完全限定的函数名来获取其信息。例如，假设你不记得 Enum.map/2 函数参数的顺序：\n\
  \n```\niex> h Enum.map/2\ndef map(enumerable, fun)\n@spec map(t(), (element() ->\
  \ any())) :: list()\n\nReturns a list where each item is the result of invoking\
  \ fun on each corresponding item of enumerable.\nFor maps, the function expects\
  \ a key-value tuple.\n## Examples\n\niex> Enum.map([1, 2, 3], fn(x) -> x * 2 end)\n\
  [2, 4, 6]\n\niex> Enum.map([a: 1, b: 2], fn({k, v}) -> {k, -v} end)\n[a: -1, b:\
  \ -2]\n```\n\n另一个非常有趣的功能，从 Elixir 1.5 开始提供，即能够从 IEx 设置断点。为了展示这一点，让我们在 Functions\
  \ and modules 部分定义的 StringHelper.palindrome?/1 函数上创建一个断点，该函数位于 \"string_helper.ex\"\
  \ 文件中：\n\n```\niex> break! StringHelper.palindrome?/1\n1\niex> StringHelper.palindrome?(\"\
  abba\")\nBreak reached: StringHelper.palindrome?/1 (string_helper.ex:2)\n```\n\n\
  ```\n1: defmodule StringHelper do\n2:   def palindrome?(term) when is_bitstring(term)\
  \ do\n3:     String.reverse(term) == term\n4:   end\n```\n\n```\npry(1)> term\n\"\
  abba\"\npry(2)> whereami\nLocation: string_helper.ex:2\n```\n\n```\n1: defmodule\
  \ StringHelper do\n2:   def palindrome?(term) when is_bitstring(term) do\n3:   \
  \  String.reverse(term) == term\n4:   end\n```\n\n如你所见，你可以访问传递给函数的参数 `term`，也可以使用\
  \ `whereami` 来显示断点停止执行的位置。要恢复执行，你可以使用 `continue` 命令进入下一个断点，或使用 `respawn` 退出并启动一个新的\
  \ shell。\n\n从 Elixir 1.6 开始，设置断点时你也可以使用模式匹配和守卫子句。我们之前定义的断点也可以设置为 `break! StringHelper.palindrome?(\"\
  abba\")`，这样当该函数以 \"abba\" 作为参数被调用时断点才会生效。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_72_0.png)\n\
  \n你也可以使用 `IEx.pry` 在源代码文件上设置断点，而不是通过 IEx 来设置。使用你最喜欢的方法即可。\n\n为了结束本节，我们将向你展示 IEx\
  \ 的一个实用功能：从历史记录中访问值。有时，你调用某个函数后才意识到想要将该函数调用的结果绑定到一个变量。如果发生这种情况，你可以使用 `v/1` 函数。你可以传递一个数字，表示你想要检索值的表达式的位置（从\
  \ 1 开始）。你也可以传递一个负数，这会使位置相对于 shell 中的当前表达式。你也可以不带参数调用此函数，这等同于调用 `v(-1)`——这意味着我们获取的是上一个表达式的值。让我们看一个例子：\n\
  \n```\niex> 7 * 3\n21\niex> a = v\n21\niex> a * 2\n42\n```\n\n```\niex> v(-3)\n\
  21\n```\n\nIEx 还可以做更多事情，例如配置它或连接到远程 shell。请参考官方文档（位于 https://hexdocs.pm/iex/IEx.html）了解\
  \ IEx 的更多使用示例。\n\n## Mix\n\nMix 是 Elixir 工具的瑞士军刀。它用于编译和运行你的应用程序、管理依赖项、运行测试，甚至用于分析代码。你可以通过在终端输入\
  \ `mix help` 来查看可用的 Mix 任务。我们在这里不会解释其用法，因为下一章的目的是向你展示如何使用 Mix 创建和维护 Elixir 项目。\n\
  \n## ExUnit\n\nElixir 附带了一个功能完善的单元测试框架：ExUnit。我们将使用它为本书中构建的应用程序编写测试。第 9 章 Finding\
  \ Zen Through Testing 专门介绍测试，我们将在其中演示如何为你的应用程序编写测试，让你安心入睡。\n\n## Erlang 互操作性\n\n\
  正如本章开头所述，Elixir 目标于 Erlang 运行时。Elixir 编译为可在 Erlang VM（或 BEAM）上运行的字节码，并且 Erlang 库可以在你的\
  \ Elixir 项目中使用（反之亦然）。Elixir 社区的理念是不重复造轮子，在适当时直接使用 Erlang 库。创建仅包装底层 Erlang 库的 Elixir\
  \ 库的做法是不鼓励的，因为你可以直接从 Elixir 代码调用 Erlang 库。\n\n我们不仅可以利用 Erlang 库，还可以利用其工具。例如，Erlang\
  \ 附带了一个名为 Observer 的工具，它允许你监控服务器并提供大量关于 Erlang VM 的有用信息，例如正在运行的进程或负载的动态图表。我们将在第\
  \ 11 章 Keeping an Eye on Your Processes 中更详细地探讨此工具，当我们谈论监控时。\n\n\n\n要使用 Erlang 库，你将其名称写成原子，然后在其上调用函数。Elixir\
  \ 没有 Math 模块，因此当需要更高级的数学运算符时，通常会调用 math Erlang 库。让我们使用此库来计算 10 的自然对数：\n\n```\niex>\
  \ :math.log(10)\n2.302585092994046\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_74_0.png)\n\
  \n你可以在 http://erlang.org/doc/apps/stdlib/index.html 查看 Erlang 的标准库。\n\n当我们在 Elixir\
  \ 中介绍数据类型时，我们提到了 Port 类型，它是对 Erlang VM 用于与外部资源交互的资源的引用。现在让我们看看如何使用它们与操作系统进程交互。要与端口交互，我们使用\
  \ Port 模块中的函数。在下面的示例中，我们将使用 whoami UNIX 命令，该命令打印与当前用户关联的用户名。为此，我们打开一个端口并提供要运行的可执行文件的名称：\n\
  \n```\niex> port = Port.open({:spawn, \"whoami\"}, [:binary])\n#Port<0.3730>\n```\n\
  \n我们传递了 [:binary] 选项，以便将结果作为二进制而不是字节列表获取。我们现在使用 IEx flush() 辅助函数来打印端口接收到的消息：\n\n\
  ```\niex> flush()\n{#Port<0.3730>, {:data, \"dcaixinha\\n\"}}\n:ok\n```\n\n由于我们的操作系统进程在返回结果后已终止，端口也已关闭。如果不是这种情况，我们可以使用\
  \ Port.close/1 函数显式关闭端口。另请注意，这是一个非常简单的示例。你可以通过使用 Kernel.send/2 函数动态向端口发送消息（其中包含命令）来实现更复杂的交互。在端口的官方文档中（可在\
  \ https://hexdocs.pm/elixir/Port.html 获取），你可以了解如何实现这一点。\n\n如果我们只关心运行操作系统命令并获取其结果，可以使用\
  \ System.cmd/3 函数，它是建立在端口之上的抽象，可让我们轻松实现此目的。\n\n## 摘要\n\n我们现在已经到达第一章的结尾，该章包含对 Elixir\
  \ 的精简介绍。我们没有涉及语言的每个方面，但提供了一些值得探索的链接。我们的目标是为你提供必要的知识，以便跟上后面的章节，在那里我们将构建一个复杂的应用程序。本章涵盖了很多内容，因此如果你记不住我们涵盖的每个概念是很正常的。让我们回顾一下最重要的要点：\n\
  \n- Elixir 是一种动态语言，变量的类型由其所持有的值决定。\n- 每个数据类型都是不可变的，这意味着你永远不会真正更改变量的内容，你操作的是其副本。然而，你可以重新绑定变量，这将使其指向新的内存位置，而旧内容保持不变。\n\
  - Elixir 代码组织在模块中，模块包含一组函数。\n- 函数是第一类对象，因为你可以将它们分配给变量并作为参数传递给其他函数。\n- Elixir 中的迭代始终通过递归完成。没有\
  \ `while` 或 `do ... while` 构造。Elixir 提供了 `Enum` 和 `Stream` 等模块来抽象递归，让你高效地处理集合。\n\
  - 通常的控制流构造，例如 `if` 和 `else` 语句，在 Elixir 中并不常见。你偶尔仍会使用它们，但通常会使用模式匹配和多子句函数组合来控制程序的流程。\n\
  - 异常不用于控制流。相反，它们用于真正异常的事件。我们依赖于监督树（我们将在第 3 章 *Processes – The Bedrock for Concurrency\
  \ and Fault Tolerance* 中讨论）来从异常中恢复。\n- 你可以用 typespecs 或类型规范为函数添加注解，将静态类型语言的一些安全性带入动态语言。这些注解也充当函数的一种文档。\n\
  - Elixir 提供了很好的机制来使代码具有可扩展性，例如 Behaviours 和 Protocols。\n- Elixir 捆绑了出色的工具，你还可以利用\
  \ Erlang 生态系统中的所有库。\n\n在下一章中，我们将学习如何使用 Mix 创建新项目，同时描述我们将在本书中构建的应用程序。这是唯一包含临时示例的章节，在接下来的章节中，我们将始终使用我们的应用程序来举例说明我们想要解释的概念。\n"
- "# 2 Elixir 项目的内部结构\n\n在上一章查看了构建块之后，我们现在将探索任何 Elixir 项目的基本方面。需要遵循一些规则，但幸运的是，每一条都很容易采用，并有助于形成易于理解的项目结构。一个在整个生产生命周期中不会阻碍演进和维护任务的应用程序，是与之合作的人的喜悦，这正是我们的目标。\n\
  \n我们将从学习什么是 Elixir 应用程序以及如何构建 Elixir 项目开始，同时介绍一些你可以利用的现有良好实践。我们将介绍 **Umbrella applications**\
  \ 以及它们如何帮助你在项目组件之间定义更严格的边界。在创建伞形项目时，我们将使用一些常见的脚手架 mix 任务，它们可以让你从头开始快速创建 Elixir 项目。之后，我们将讨论\
  \ **ElixirDrip**，这是一个精致的 Web 文件服务器，我们将在本旅程中开发它。由于我们正在为应用程序奠定基础，我们还将建立一些关于代码风格的规则和最佳实践，使用\
  \ Credo 和新的 Elixir 1.6 代码格式化程序。\n\n在本章中，你将学习以下主题：\n\n- 什么是 Elixir 应用程序\n- 如何构建 Elixir\
  \ 项目\n- 指定项目依赖关系的不同方式\n- 什么是伞形项目以及它如何帮助构建项目\n- 使用 *mix new* 快速让新项目启动\n- 为我们将在本书中开发的项目\
  \ ElixirDrip 奠定基础\n- 定义 behaviours，以允许不同的行为实现\n- 使用 *xref* 来了解项目文件之间的依赖关系\n- 使用\
  \ Credo 和 Elixir 格式化程序建立一致的代码风格\n\n## Elixir 应用\n\nElixir 从 Erlang/OTP 继承了许多概念，应用程序的行为就是其中之一。对于\
  \ Erlang VM，应用程序是可以作为一个整体启动和停止的组件，并由 .app 文件描述（例如，hello_world.app），该文件定义了 Application\
  \ Module Callback 等内容。这是一个需要实现 start/2 函数的模块，该函数负责启动应用程序，通常通过生成其顶级监督者（在下一章中，你将了解有关监督者的所有内容）。某种程度上，你可以将\
  \ start/2 函数视为用其他编程语言开发的应用程序的常见 main 入口点。\n\n由于我们使用的是 Elixir，因此无需显式指定 .app 文件。Elixir\
  \ 编译器会通过查找使用 Application behaviour 的模块来找到正确的应用程序模块回调，然后为我们生成 .app 文件。\n\n让我们使用 mix\
  \ 生成一个带监督者的示例项目，以实践这些 Application 概念：\n\n```\n$ mix new sample_project --sup\n*\
  \ creating README.md\n* creating .gitignore\n* creating mix.exs\n* creating config\n\
  * creating config/config.exs\n* creating lib\n* creating lib/sample_project.ex\n\
  * creating lib/sample_project/application.ex\n* creating test\n* creating test/test_helper.exs\n\
  * creating test/sample_project_test.exs\n\nYour Mix project was created successfully.\n\
  You can use \"mix\" to compile it, test it, and more:\n\ncd sample_project\nmix\
  \ test\n```\n\n我们刚刚运行了一个名为 new 的 Mix 任务，并传递了两个参数 sample_project 和 --sup。Mix 是随 Elixir\
  \ 提供的工具，可帮助你创建、组织和维护 Elixir 项目。例如，每当你需要获取项目依赖项或运行应用程序时，都可以通过运行 mix <task> <arguments>\
  \ 使用 Mix。由于依赖项也可以添加自己的 Mix 任务，你将能够以完全相同的方式运行它们。\n\n\n\n我们正在下面的 SampleProject.Application\
  \ 模块中定义 application start/2 回调函数。该函数将在项目初始化期间被调用，因为该模块使用了 Application behaviour。此回调策略也是在其他场景中应用的常见模式。\n\
  \n作为应用程序的入口点，您应该利用这个机会启动之后所需的一切。在我们的例子中，我们创建了一个带有 supervisor 的示例项目，以便在应用程序初始化期间看到\
  \ start/2 函数为我们启动一个 supervisor：\n\n```\n$ cat lib/sample_project/application.ex\n\
  defmodule SampleProject.Application do\n  use Application\n\n  def start(_type,\
  \ _args) do\n    children = []\n\n    opts = [strategy: :one_for_one, name: SampleProject.Supervisor]\n\
  \    Supervisor.start_link(children, opts)\n  end\nend\n```\n\n如果我们没有使用初始 supervisor\
  \ 创建项目（通过省略 --sup 标志），我们将不会拥有实现 start/2 回调的 SampleProject.Application 模块，因此我们的项目无需启动。这可能是当您想要创建一个主要作为模块和函数的集合的项目时出现的情况，这些模块和函数可能包含在其他项目中，但本身不需要启动。\n\
  \nmix.exs 文件定义了您的 Mix 项目，并显示了在运行项目时启动哪些应用程序等信息。查看位于项目根目录的 mix.exs 中的 application/0\
  \ 函数，您可以看到 SampleProject.Application 与 logger 应用程序一起启动，后者将作为额外应用程序启动。这意味着当您的应用程序启动时，logger\
  \ 应用程序已经处于运行状态。mod 和 extra_applications 条目中引用的每个应用程序都需要实现相同的 start/2 应用程序模块回调，以便能够正确启动。请看下面的代码块：\n\
  \n```\n$ cat mix.exs\ndefmodule SampleProject.Mixfile do\n  use Mix.Project\n\n\
  \  def project do\n  [\n```\n```\napp: :sample_project,\n    version: \"0.1.0\"\
  ,\n    elixir: \"~> 1.4\",\n    start_permanent: Mix.env == :prod,\n    deps: deps()\n\
  \  ]\nend\n\ndef application do\n  [\n    extra_applications: [:logger],\n    mod:\
  \ {SampleProject.Application, []}\n  ]\nend\n\ndefp deps do\n  []\nend\nend\n```\n\
  \n我们也可以通过使用 `iex` 启动应用程序并调用 `Application.started_applications/0` 函数来确认这一点。我们可以观察到，除了\
  \ Elixir 启动的其他应用程序外，我们还有 `sample_project` 和 `logger` 额外应用程序。请看下面的代码：\n\n```\n$ iex\
  \ -S mix\niex> Application.started_applications()\n[{:sample_project, 'sample_project',\
  \ '0.1.0'}, {:logger, 'logger',\n'1.5.2'},\n{:mix, 'mix', '1.5.2'}, {:iex, 'iex',\
  \ '1.5.2'}, {:elixir, 'elixir',\n'1.5.2'},\n{:compiler, 'ERTS CXC 138 10', '7.1.3'},\n\
  {:stdlib, 'ERTS CXC 138 10', '3.4.2'}, {:kernel, 'ERTS CXC 138 10',\n'5.4'}]\n```\n\
  \n在之前的代码片段中，我们正在 IEx shell 中运行脚本（由于 `-S` 选项），`mix`。当我们运行 Mix 而不指定任何 `task` 时，它将运行默认的\
  \ `run` task，负责启动并运行当前应用程序及其依赖项。因此，我们在这里所做的事情相当于使用 `iex -S mix run` 执行 `run` task。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_81_0.png)\n\n如果您的应用程序没有通过使用 `Application`\
  \ 模块来实现上述的 `start/2` 回调函数，您仍然会在 `Application.started_applications/0` 函数返回的其他已启动应用程序中看到它。然而，由于您的应用程序不需要启动，即使您先使用\
  \ `Application.stop(:your_app)` 停止应用程序，您也可以调用其任何函数。\n\n在用 `mix compile` 编译应用程序后，查看\
  \ `_build/dev/lib/sample_project/ebin` 文件夹。您将找到编译模块的扁平层次结构以及一个 `sample_project.app`\
  \ 文件。该文件使用 Erlang 术语定义您的应用程序，其目的是让 Erlang VM 知道如何启动您的应用程序。Mix 会通过查看 `mix.exs` 文件自动为我们生成此文件。在下面的代码片段中，您可以看到从\
  \ `mix.exs` 文件的 `application/0` 和 `project/0` 函数设置的值中获得的 `vsn`、`extra_applications`\
  \ 和 `mod` 条目。请看下面的代码块：\n\n```\n$ cat _build/dev/lib/sample_project/ebin/sample_project.app\n\
  {application,sample_project,\n    [{applications, [kernel,stdlib,elixir,logger]},\n\
  \     {description,\"sample_project\"},\n     {modules, ['Elixir.SampleProject',\n\
  \     'Elixir.SampleProject.Application']},\n     {registered, []},\n     {vsn,\"\
  0.1.0\"},\n     {extra_applications, [logger]},\n     {mod, {'Elixir.SampleProject.Application',\
  \ []}}]}.\n```\n\n使用 Elixir 开发的一个令人信服的方面是，最终每个模块都会编译为自己的 BEAM 字节码文件（使用完整的模块名称作为文件名）并放置在相应的应用程序文件夹中。请看下面的代码：\n\
  \n```\n$ ls _build/dev/lib/sample_project/ebin\nElixir.SampleProject.Application.beam\n\
  Elixir.SampleProject.beam\nsample_project.app\n```\n\n此外，Elixir 中没有命名空间。当您需要从另一个模块调用函数时，您必须使用其全名或定义显式别名，即使您调用的模块位于同一应用程序下。同样，也没有隐藏的魔法在幕后根据特定的文件夹结构为我们加载模块。\n\
  \n这种对显式性的倾向是 Elixir 中的一个常见方面，其中几乎没有什么（或很少）内容对开发者隐藏。Elixir 的另一个定义特征是其相对较小的语言概念和抽象集合。这种节俭直接源于\
  \ Elixir 核心团队，*他们认为一种语言可以在不妨碍其学习且不导致社区分裂的情况下提供的功能是有限的*。无论您看向何处，您都会发现显式性和简单性是 Elixir\
  \ 生态系统的两个主要驱动因素。\n\n## Elixir 项目结构\n\n在上一节中，我们使用 Mix 创建了一个示例项目，但没有彻底探索它。尽管没有强制执行严格的结构且看起来非常简单，Elixir\
  \ 项目结构为每个项目设定了基线，使您在面对新代码库时能够快速上手。\n\n让我们创建一个更简单的项目，使用 `mix new simple_project`\
  \ 为我们生成初始文件夹结构。除了创建 `.gitignore` 和 `README.md` 文件外，它还创建了 `mix.exs` 文件和三个单独的文件夹：`config`、`lib`\
  \ 和 `test`。请看下面的内容：\n\n```\n$ mix new simple_project\n* creating README.md\n* creating\
  \ .gitignore\n* creating mix.exs\n* creating config\n* creating config/config.exs\n\
  * creating lib\n* creating lib/simple_project.ex\n* creating test\n* creating test/test_helper.exs\n\
  * creating test/simple_project_test.exs\n\nYour Mix project was created successfully.\n\
  You can use \"mix\" to compile it, test it, and more:\n\n    cd simple_project\n\
  \    mix test\n\nRun \"mix help\" for more commands.\n```\n\n您可以在 `config` 文件夹中找到主配置文件\
  \ `config.exs`。在这里放置应用程序配置。配置文件首先使用 `Mix.Config` 模块，因此我们可以使用 `config/2` 宏定义配置条目。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_83_0.png)\n\n此配置文件仅由当前运行的应用程序考虑。如果您的应用程序作为依赖项被另一个应用程序使用，其配置文件将不会被考虑。如果您的应用程序需要从\
  \ `config/config.exs` 文件获取某些配置条目，您的文档应明确说明这一点，因为这些配置需要显式添加到主应用程序的配置文件中。\n\n下面的代码示例展示了我们\
  \ `:simple_project` 应用程序的可能配置。最后，我们通过在导入的配置文件名上插值 `Mix.env` 值来导入特定环境的配置文件。这在我们需要根据当前\
  \ Mix 环境使用不同的配置值时特别有用。然后每个配置条目都可以通过 `Application.get_env(:simple_project, :configuration_key)`\
  \ 获取。如果以下配置语法感觉很奇怪，请记住配置条目的最后一个元素是一个关键字列表，由大小可变的包含两个元素的元组列表组成（即：`[{:timeout_secs,\
  \ 20}, {:max_number_of_processes, 1000}, {:max_upload_size_bytes, 10_000}]`）。请看下面的内容：\n\
  \n```\n$ cat config/config.exs\nuse Mix.Config\n\nconfig :simple_project,\n  timeout_secs:\
  \ 20,\n  max_number_of_processes: 1000,\n  max_upload_size_bytes: 10_000\n\nimport_config\
  \ \"#{Mix.env}.exs\"\n```\n\n代码将放置在 `lib` 文件夹中。Mix 在 `lib/simple_project.ex` 文件中创建了一个空的\
  \ `SimpleProject` 模块，并且在 `lib` 文件夹中您也会找到实现 `start/2` 应用程序模块回调的模块。需要注意的是，Elixir 不强制执行任何\
  \ `lib/` 文件夹结构以及内部实际定义模块的文件组织方式。您可以拥有一个 `lib/foo.ex` 文件，定义 `Xyz.SomeContext.My.Super.Module`，它将被编译为\
  \ `Elixir.Xyz.SomeContext.My.Super.Module.beam` 文件。\n\n为我们创建的最后一个文件夹是 `test` 文件夹。您创建的所有测试都应放在这里。Mix\
  \ 还创建了 `test_helper.exs`，负责启动 ExUnit，即随 Elixir 提供的测试框架。您可以使用此助手来配置测试运行。\n\n\n\n\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_84_0.png)\n\n`test` 文件夹中的每个测试文件都必须以 `_test.exs`\
  \ 结尾。如果不是这样，当你执行 `mix test` 时，你的测试用例将不会运行。Mix 只会在 `test` 文件夹中存在名称以 `_test` 结尾但没有预期扩展名的测试文件时发出警告；如果名称与\
  \ `*_test` 不匹配，它将不会发出任何警告继续执行，你的测试文件根本不会运行。\n\n现在让我们检查如何定义 Elixir 项目的依赖项。\n\n##\
  \ 项目依赖\n\n我们已经分析了 `mix.exs` 文件的目的。它的重要性至关重要，因为其中包含的信息定义了 Erlang VM 实际如何运行你的 Elixir\
  \ 项目。然而，我们还没有研究 Mix 如何实际使用此文件来了解我们应用程序的依赖项以及应如何获取和启动它们。\n\nMix 会在由 `mix.exs` 文件定义的模块的\
  \ `project/0` 函数返回的 `deps` 条目中查找应用程序依赖项。此列表中的每个条目都是一个元组，指向我们的应用程序所依赖的应用程序。\n\n为了帮助开发者查找库，Elixir\
  \ 核心团队创建了 Hex (https://github.com/hexpm/hex)，这是一个 Erlang VM 的包管理器，Mix 默认使用它。你可以在\
  \ hex.pm (https://hex.pm/) 上找到所有公开可用的库，并且也可以将你的库上传到由 hex.pm 主办的私有仓库。\n\n如果你只在 `mix.exs`\
  \ 文件中设置依赖名称和版本（也就是说，`{:library, \"~> 1.0.1\"}`），它将从 hex.pm 获取。如果你的依赖位于私有仓库中，你应该在\
  \ `deps` 列表中的依赖条目中添加 `organization` 选项。\n\n你也可以为每个依赖项传递额外的选项。通过使用 `git` 或 `path`\
  \ 选项，你可以分别从 Git 仓库或本地路径获取依赖项。正如你接下来会看到的，伞形应用程序内部的依赖管理也利用了相同的依赖机制：如果你的依赖项位于同一个伞形项目下，你可以通过将\
  \ `in_umbrella` 选项设置为 `true` 来使用它。\n\nElixir 让管理依赖变得轻而易举：默认情况下，Elixir 会将你的依赖添加到所谓的\
  \ *运行时应用程序* 中。这确保了你的依赖在应用程序启动时全部运行，并在你创建应用程序发布包时包含在内。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_85_0.png)\n\
  \n在之前的 Elixir 版本中，依赖项并不总是被视为运行时应用程序，因此开发者需要手动将它们添加到 `mix.exs` 文件中 `project` 函数返回的\
  \ `applications` 条目中。这是一个困惑的来源，因为即使是库应用程序（不实现应用程序模块回调，仅由一组模块和函数组成），也需要与其它运行时应用程序一起提及，否则它们将不会包含在包发布中。由于这种令人困惑的行为，自\
  \ Elixir 1.4 起，应用程序默认被视为运行时应用程序。\n\nMix 还允许你使用 `override` 选项锁定特定包版本。这在你的 `deps`\
  \ 列表中的某个包依赖于你已依赖的包的不同版本时尤其有用。如果你的代码依赖于使用 Poison 版本 ~> 2.0 的 `http_client` 依赖项，但你在\
  \ `deps` 列表中也指定需要 Poison 版本 ~> 3.0，你将遇到冲突。向你的 `poison` 条目添加 `override` 选项将强制 Mix\
  \ 获取并使用该包的 3.* 版本。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_85_1.png)\n\n在整本书中，你会在一些代码示例中看到一些\
  \ # ... 片段。这用于表示我们省略了实际代码，因为它与我们的示例无关，可能会妨碍理解。\n\n最后，你还可以设置仅在特定 Mix 环境中使用和获取的依赖项。将\
  \ `only` 选项定义为 `Mix.env` 值列表，例如 [:dev, :test]，将允许你在构建和运行应用程序时仅在这些环境中使用该依赖项。你可以使用这种方法从发布版本中清除开发依赖项，例如测试报告格式化程序、基准测试工具、调试器等：\n\
  \n```\ndefmodule SimpleProject.Mixfile do\n  use Mix.Project\n\n  def project do\n\
  \    [\n      app: :simple_project,\n      deps: deps(),\n      # ...\n    ]\n \
  \ end\n  # ...\n  defp deps do\n    [\n      {:dep_from_hexpm, \"~> 3.3.0\"},\n\
  \      {:private_dep_from_hexpm, \"~> 0.2.0\", organization: \"coding_co\"},\n \
  \     {:dep_from_git, git: \"https://github.com/elixir-lang/my_dep.git\", tag: \"\
  2.1.0\"},\n      {:local_dep, path: \"../packages/local_dep\"},\n      {:umbrella_dep,\
  \ in_umbrella: true},\n      {:specific_dep, \"0.7.1\", override: true},\n     \
  \ {:dev_test_dep, \">= 1.0\", only: [:dev, :test]}\n    ]\n  end\nend\n```\n\n在下一节中，我们将了解什么是伞形项目以及如何使用它来为我们的应用程序奠定基础。\n\
  \n## 伞形项目\n\n在上一节中，我们首先使用 Mix 定义并创建了一个示例 Elixir 应用程序。通过使用应用程序的行为，我们能够将其作为一个单元启动和停止，并且其他应用程序可以通过在其依赖项中指向该应用程序来依赖它。\n\
  \n随着时间的推移，你的应用程序变得越来越大，你开始思考如何将其划分为具有明确职责的更小的独立组件。此时，你会为最近提取的逻辑从头创建一个项目并将其添加为依赖项吗？可能不会，因为现在，这些提取的组件只有在原始应用程序的上下文中才有意义。\n\
  \n伞形项目可以帮助你解决这个问题，因为它允许你在同一个 Elixir 项目下拥有多个应用程序。Mix 通过将你的各个应用程序放置在伞形项目的 apps 文件夹下来实现这一点，同时仍然允许你在同一项目内单独运行每个应用程序。将来，如果你想将其中一个伞形应用程序提取到自己的项目中，只需将相应的应用程序文件夹内容复制到新的代码仓库即可。\n\
  \n这种方法的优点之一是，你可以在同一个代码仓库中管理独立的 Elixir 应用程序，并具有清晰的边界。而且由于它不仅允许我们在同一个伞形下分组 OTP 应用程序，还可以建立这些应用程序之间的明确定义的接口，因此伞形项目是帮助你设计项目的宝贵工具。通过解耦你的伞形应用程序，你将能够独立实现甚至运行它们。\n\
  \n![](img/c636f4cfb07f25f1db535995e50706ed_87_0.png)\n\n为了简化命名法，在整本书中我们将明确使用术语 *umbrella\
  \ project* 和 *umbrella application* 分别指代根项目及其包含的每个应用程序。\n\n为了说明伞形项目如何让我们的生活更轻松，让我们开始为整本书中将要构建的项目奠定基础。在下面的片段中，我们正在创建一个新的\
  \ `elixir_drip` 伞形项目，其中包含 `ElixirDrip.Umbrella` 顶层模块。我们还将项目 OTP 应用程序命名为 `elixir_drip_umbrella`：\n\
  \n```\n$ mix new elixir_drip --module ElixirDrip.Umbrella --app elixir_drip_umbrella\
  \ --umbrella\n\n* creating .gitignore\n* creating README.md\n* creating mix.exs\n\
  * creating apps\n* creating config\n* creating config/config.exs\n```\n\n你的伞形项目已成功创建。\n\
  在你的项目内部，你会找到一个 apps/ 目录，你可以在其中创建并托管许多应用程序：\n\n```\ncd elixir_drip\ncd apps\nmix\
  \ new my_app\n```\n\n```\nCommands like \"mix compile\" and \"mix test\" when executed\
  \ in the umbrella project root will automatically run for each application in the\
  \ apps/ directory.\n```\n\n![](img/c636f4cfb07f25f1db535995e50706ed_87_1.png)\n\n\
  在模块和应用程序名称中添加 *umbrella* 参考使它更清楚地表明这确实是一个伞形项目，并且将让我们在稍后使用名称 `elixir_drip` 来命名负责业务逻辑的伞形应用程序。\n\
  \n我们现在可以分析生成的 `mix.exs` 文件了。如你所见，我们有一个新的 `apps_path` 条目由 `project/0` 函数返回，并且我们没有任何依赖项。Mix\
  \ 使用它来知道伞形应用程序位于何处。另请注意模块的名称：我们使用 `mix new` 命令传递的 `--module ElixirDrip.Umbrella`\
  \ 选项设置了它的前缀。\n\n\n\n\n否则，模块名称前缀将是传递给 `mix new <project_name>` 任务的项目名称的小驼峰版本（即 ProjectName）。请看这段代码：\n\
  \n```\n$ cat mix.exs\ndefmodule ElixirDrip.Umbrella.Mixfile do\n  use Mix.Project\n\
  \n  def project do\n    [\n      apps_path: \"apps\",\n      start_permanent: Mix.env\
  \ == :prod,\n      deps: deps()\n    ]\n  end\n\n  # Dependencies listed here are\
  \ available only for this\n  # project and cannot be accessed from applications\
  \ inside\n  # the apps folder.\n  #\n  # Run \"mix help deps\" for examples and\
  \ options.\n  defp deps do\n    []\n  end\nend\n```\n\n现在我们第一个伞形项目已准备就绪。可惜的是，它目前还没有任何伞形应用程序：\n\
  \n```\n$ tree\n.\n├── apps\n├── config\n│   └── config.exs\n├── deps\n├── mix.exs\n\
  └── README.md\n\n3 directories, 3 files\n```\n\n如果尝试使用 iex -S mix 命令运行它，什么也不会发生；你只会得到\
  \ Elixir 交互式 shell 的空闲状态，等待你的输入。让我们通过创建项目的第一个伞形应用程序来解决这个问题。\n\n我们现在将使用 Phoenix 及其\
  \ Mix 任务，这些任务依赖于已安装的 Elixir 和 Erlang。为了使用 Phoenix Mix 任务，我们需要先安装 Phoenix。\n\n![](img/c636f4cfb07f25f1db535995e50706ed_89_0.png)\n\
  \n要全局安装 Phoenix，请运行 `mix archive.install https://github.com/phoenixframework/archives/raw/master/phx_new.ez`。如果我们采用这种方式，即使在伞形项目等项目中未将\
  \ Phoenix 显式设为依赖项，也可以使用 Phoenix Mix 任务。另一种在项目中启用 Phoenix Mix 任务的方法是，在伞形项目的 `mix.exs`\
  \ 文件中将 Phoenix 添加为依赖项，然后运行 `mix deps.get` 将其作为项目依赖项的一部分获取。\n\n在 `apps` 文件夹中，我们将创建一个\
  \ Elixir 应用程序，它将负责封装业务逻辑和所有数据访问流程。为此，我们将利用 Mix `phx.new.ecto` 任务，它将创建一个包含仓库和使用 Ecto\
  \ 开始与数据库交互所需的一切的简易应用程序（我们将在第 7 章《使用 Ecto 持久化数据》中更深入地探讨 Ecto）。请看这段：\n\n```\n$ cd\
  \ apps\n$ mix phx.new.ecto elixir_drip --database postgres\n* creating elixir_drip/config/config.exs\n\
  * creating elixir_drip/config/dev.exs\n* creating elixir_drip/config/prod.exs\n\
  * creating elixir_drip/config/prod.secret.exs\n* creating elixir_drip/config/test.exs\n\
  * creating elixir_drip/lib/elixir_drip/application.ex\n* creating elixir_drip/lib/elixir_drip.ex\n\
  * creating elixir_drip/test/test_helper.exs\n* creating elixir_drip/README.md\n\
  * creating elixir_drip/mix.exs\n* creating elixir_drip/.gitignore\n* creating elixir_drip/lib/elixir_drip/repo.ex\n\
  * creating elixir_drip/priv/repo/seeds.exs\n* creating elixir_drip/test/support/data_case.ex\n\
  \nFetch and install dependencies? [Y/n] Y\n* running mix deps.get\n```\n\n一切就绪！我们刚刚创建了第一个\
  \ `elixir_drip` 伞形应用程序。\n\n查看我们刚刚创建的 `elixir_drip` 应用程序的 `mix.exs` 文件，可以看到 Mix 自动为\
  \ `build_path`、`config_path`、`deps_path` 和 `lockfile` 设置了正确的值，并将其指向伞形项目根目录下的相应位置。\n\
  \n创建 elixir_drip 应用程序后，mix new 任务在 lockfile 配置项指向的路径上创建了一个 mix.lock 文件。该文件是在应用程序创建过程中我们也运行了\
  \ mix deps.get（请查看上面的命令输出）而创建的。此文件存储项目所依赖的每个依赖项的具体版本，应与代码的其余部分一起纳入版本控制系统。这样，我们就能确保代码的每次执行都依赖于相同的依赖项版本。创建应用程序发布时也会考虑\
  \ mix.lock 文件中包含的相同依赖项版本。因此，你的应用程序将在生产环境中使用完全相同的依赖项集运行。\n\n请注意，lockfile 和 deps_path\
  \ 条目指向伞形项目根目录中的 mix.lock 文件和 deps 文件夹。这使我们能够将伞形应用程序的所有依赖项分组并管理在一个公共文件夹中，并在同一个 lock\
  \ 文件中收集它们：\n\n```\n$ cat apps/elixir_drip/mix.exs\ndefmodule ElixirDrip.Mixfile\
  \ do\n  use Mix.Project\n\n  def project do\n    [\n      app: :elixir_drip,\n \
  \     version: \"0.0.1\",\n      build_path: \"../../build\",\n      config_path:\
  \ \"../../config/config.exs\",\n      deps_path: \"../../deps\",\n      lockfile:\
  \ \"../../mix.lock\",\n      elixir: \"~> 1.4\",\n      elixirc_paths: elixirc_paths(Mix.env),\n\
  \      start_permanent: Mix.env == :prod,\n      aliases: aliases(),\n      deps:\
  \ deps()\n    ]\n  end\n\n  def application do\n    [\n      mod: {ElixirDrip.Application,\
  \ []},\n      extra_applications: [:logger, :runtime_tools]\n    ]\n  end\n\n  defp\
  \ elixirc_paths(:test), do: [\"lib\", \"test/support\"]\n  defp elixirc_paths(_),\
  \ do: [\"lib\"]\n\n  defp deps do\n    [\n      {:postgrex, \">= 0.0.0\"},\n   \
  \   {:ecto, \"~> 2.1\"}\n    ]\n  end\n\n  defp aliases do\n    [\n      \"ecto.setup\"\
  : [\"ecto.create\", \"ecto.migrate\", \"run priv/repo/seeds.exs\"],\n      \"ecto.reset\"\
  : [\"ecto.drop\", \"ecto.setup\"],\n      \"test\": [\"ecto.create --quiet\", \"\
  ecto.migrate\", \"test\"]\n    ]\n  end\nend\n```\n\n还值得注意的是之前 mix.exs 文件的两个方面：根据\
  \ Mix.env 值如何将编译路径指向编译器（例如，test/support 路径仅在测试环境中编译），以及由于我们的应用程序依赖于 Ecto 而为我们创建的任务别名。关于后者，我们现在可以在此应用程序文件夹中使用\
  \ mix ecto.reset 来删除数据库并随后重新设置。这些别名对于简化频繁命令非常有用，你应根据需要自由使用它们。\n\n无论伞形项目中包含多少个伞形应用程序，启动项目（从而启动其所有伞形应用程序）只需在项目根目录运行\
  \ mix 即可。相反，如果你想运行每个伞形应用程序的测试套件，则应运行 mix test。现在我们在伞形项目下有一个应用程序，因此如果运行项目，我们肯定会看到一些事情发生。让我们试试：\n\
  \n```\n$ iex -S mix\nErlang/OTP 20 [erts-9.1.5] [source] [64-bit] [smp:4:4] [ds:4:4:10]\
  \ [async-threads:10] [hipe] [kernel-poll:false]\n\nInteractive Elixir (1.5.2) -\
  \ press Ctrl+C to exit (type h() ENTER for help)\niex(1)>\n16:22:21.146 [error]\
  \ Postgrex.Protocol (#PID<0.202.0>) failed to connect: ** (DBConnection.ConnectionError)\
  \ tcp connect (localhost:5432): connection refused - :econnrefused\n\nBREAK: (a)abort\
  \ (c)ontinue (p)roc info (i)nfo (l)oaded\n      (v)ersion (k)ill (D)b-tables (d)istribution\n\
  a\n```\n\n我们收到的错误意味着 elixir_drip 伞形应用程序已启动，但在尝试连接到其 config/config.exs 文件中指定的数据库时失败，因为端口\
