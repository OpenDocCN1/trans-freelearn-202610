- '# Apache Axis2 Web 服务

  '
- "# 前言\n\n第一条 为进一步提高我市城乡居民基本医疗保险待遇水平，减轻参保居民门诊慢特病医疗费用负担，规范门诊慢特病管理，根据《商洛市城乡居民基本医疗保险市级统筹实施办法（试行）》（商政发〔2020〕17号）等文件精神，结合我市实际，制定本办法。\n\
  \n\n第8章，编写Axis2模块——了解如何通过一个自包含的包扩展Axis2核心功能。\n\n第9章，客户端API——了解如何使用Axis2调用其他服务、可用的API以及如何使用它们。\n\
  \n第10章，会话管理——超越单次调用，学习如何使用Axis2特性提供更好、更高效的有状态服务。\n\n第11章，开发JAX-WS Web服务——学习开发基于JAX-WS的Web服务的基础知识，这是Java开发人员最常用的Web服务开发技术。\n\
  \n第12章，Axis2集群——了解Apache Axis2的集群，这将允许你在大规模生产环境中部署Axis2。\n\n第13章，企业集成模式——了解一些利用底层Axis2集群基础设施的企业SOA部署模式。\n\
  \n第14章，Axis2高级特性与用法——超越简单特性，了解REST、MTOM以及其他几个高级特性。\n\n第15章，构建安全可靠的Web服务——学习如何使用Axis2及相关组件使你的服务更加安全可靠。\n\
  \n## 本书所需准备\n\n- Java 5或更高版本（Axis2仅支持JDK 1.5及以上版本）\n- 最新版本的Axis2（Axis2 1.5.4）\n\n\
  ## 本书读者对象\n\n本书面向有兴趣使用Apache Axis2构建Web服务的Java开发人员。假定读者熟悉SOAP、WSDL和XML解析等Web标准。\n\
  \n## 惯例\n\n在本书中，你会发现多种不同的文本样式，用以区分不同类型的信息。以下是这些样式的一些示例，以及对其含义的说明。\n\n## 问题\n\n如果你在本书的任何方面遇到问题，可以通过questions@packtpub.com联系我们，我们将尽力解决。\n\
  \n## 面向服务的架构（SOA）\n\n孤立计算机的时代已经结束。如今，“连接则立，孤立则亡”正成为计算领域的格言。网络和通信设施以前所未有的方式连接了世界。世界上已有能够支持连接数千台计算机系统的硬件，这些系统有能力发挥曾经只能梦想的力量。\n\
  \n然而，计算机科学缺乏利用已建立的通信网络的技术和抽象。分布式计算的目标就是提供这样的抽象。RPC、RMI、IIOP和CORBA是一些为开发人员提供网络抽象的方案，可供其在此基础上构建。\n\
  \n这些方案未能考虑问题的关键本质。系统是由众多异构子系统组成的，但这些方案要求所有参与者共享一种或少数几种编程语言。**面向服务的架构（SOA）** 通过定义一组概念和模式来集成同质和异构组件，从而给出了答案。SOA提供了一种更好的方式来实现松散耦合的系统，因此具有更强的可扩展性和灵活性。此外，与面向对象编程（OOP）类似，SOA实现了高度的可重用性。人们可以通过三种主要方式在其系统和应用中启用SOA能力：\n\
  \n- 现有消息系统：例如IBM MQSeries、Tibco、JMS等\n- 普通XML（POX）：例如XML/HTTP、REST等\n- Web服务：例如SOAP、WSDL、WS-*\n\
  \n在常用的消息系统中，**Java消息服务（JMS）** 在行业中扮演着重要角色，并已成为消息系统的通用API。我们可以找到多种JMS消息类型，例如文本、字节、名值对、流和对象。这类消息系统的主要缺点之一是它们没有统一的线路格式（序列化格式）。因此，互操作性是一个大问题：如果两个应用程序使用JMS进行通信，那么它们必须使用相同的实现。Sonic、Tibco和IBM是商业市场的领导者，JBoss、Manta和ActiveMQ是常用的开源实现。\n\
  \n普通XML（POX）是在系统中暴露功能并启用SOA的另一种方式。随着Web的广泛使用，POX方法变得更加流行。大多数Web应用暴露XML API，我们可以开发组件并与它们通信。Google\
  \ Maps、自动完成和Amazon服务是大量使用XML API暴露功能的几个应用示例。在大多数情况下，POX与REST（表述性状态转移）结合使用。**REST**\
  \ 是Web底层架构的一种模型，它基于每个URL标识资源的理念。GET、PUT、POST和DELETE是REST架构中使用的动词。REST常常与理论观点相关联，因此，REST通常不用于复杂的交互。\n\
  \n在三种常用的SOA实现方法中，Web服务可以被认为是最标准和最灵活的方式。Web服务扩展了POX的思想，并增加了额外的标准，使通信更加有条理和标准化。Web服务成为最流行的支持SOA的机制，其原因如下：\n\
  \n- Web服务使用WSDL描述，WSDL可以捕获任何复杂的应用以及所需的服务质量。\n- Web服务使用SOAP作为消息传输机制，因为SOAP是一种特殊的XML。它从XML获得了所有可扩展性特性。\n\
  - 有许多标准机构负责创建和执行Web服务标准。\n- 有多种开源和商业Web服务实现。通过使用标准和流程，Web服务提供了与应用程序和编程语言无关的集成和通信机制。不同的编程语言可能为Web服务定义不同的实现，但它们可以互操作，因为它们对共享信息的格式达成一致。\n\
  \nWS-I的主要功能是提供标准和规范，以确保互操作性、可组合性和概要描述。换句话说，即创建标准和流程，以在各类Web服务框架之间强制执行所需的互操作性水平。OASIS的主要目标是提高Web服务的服务质量，包括安全性、可靠性、事务和资源管理。W3C是Web服务标准机构之一，它将Web服务定义为一种软件系统，旨在通过网络支持可互操作的机器对机器交互。它的接口以一种既可由机器处理又可由人阅读的格式描述。这种格式被称为**Web服务描述语言（WSDL）**。其他应用程序按照其描述所规定的方式，使用**简单对象访问协议（SOAP）**\
  \ 消息与Web服务通信，通常通过HTTP结合XML序列化以及其他Web相关标准来传输。\n\nWeb服务是众所周知的开源技术标准，它提供了以下许多好处：\n\n\
  - 提高互操作性，从而降低维护成本\n- 提高可重用性和可组合性（例如，使用公开可用的服务并重用或集成它们以提供新服务）\n- 增加供应商之间的竞争，从而降低产品价格\n\
  - 易于从一个产品切换到另一个产品，从而降低培训成本\n- 更高的采用率和标准寿命，供应商和用户的大量使用导致更高的接受度\n\n可以说，Web服务概念是从面向对象系统到服务系统的逻辑演变。与面向对象系统一样，Web服务中的一些基本概念是封装、消息传递和动态绑定。然而，基于服务的概念已扩展到方法签名之外，因为与服务功能、位置、调用方式、服务质量以及安全策略相关的信息也可以发布在服务接口（WSDL）中。\n\
  \n### 组织如何转向Web服务？\n\n组织可能用来转向Web服务的方式主要有三种，如下所示：\n\n- 从零开始创建新的Web服务。开发人员创建服务的功能以及描述。\n\
  \n\n\n\n\n消息传递标准旨在为分布式环境中的信息交换提供框架。这些标准必须可靠，以确保消息只发送一次，并且只有预期的接收者才能收到。这是当前研究的主要领域之一，因为一切都依赖于消息传递能力。\n\
  \n接下来，我们将详细讨论其中一些标准。首先，我们从 XML-RPC 开始，它后来发展为 SOAP。\n\n## XML-RPC\n\n**XML-RPC**\
  \ 标准由 Dave Winer 于 1998 年与微软共同创建。现有的 RPC 系统非常庞大。因此，为了创建一个轻量级系统，开发者通过仅规定必要的部分并只定义少量的数据类型和命令来简化它。该协议使用\
  \ XML 对调用进行编码，并以 HTTP 作为传输机制。消息以 POST 请求发送，其中请求正文为 XML 格式。服务器上执行一个过程，其返回值也被格式化为\
  \ XML。参数可以是标量、数字、字符串、日期，以及复杂的记录和列表结构。\n\n随着新功能的引入，XML-RPC 演变为现在所称的 SOAP，接下来将对此进行讨论。不过，仍有一些人更喜欢使用\
  \ XML-RPC，因为它简单、极简且易于使用。\n\n## SOAP\n\n最初，SOAP 被定义为简单对象访问协议（Simple Object Access\
  \ Protocol）。然而，最新版本（SOAP 1.2）已经超越了其最初的定义。SOAP 标准最初由四位开发者在微软的支持下设计，作为一种对象访问协议。该协议规定了基于\
  \ XML 的消息在计算机网络中的传输方式，且与传输机制无关。开发者选择 XML 作为标准消息格式，是因为主要组织和开源计划广泛使用它。此外，还有各种各样免费可用的工具，可以轻松过渡到基于\
  \ SOAP 的实现。\n\n**SOAP** 的概念是一种无状态、单向的消息交换。然而，应用程序可以通过将这种单向交换与底层协议提供的功能以及特定于应用程序的信息相结合，创建更复杂的交互模式——例如请求-响应、请求-多响应等。SOAP\
  \ 对其所传递的任何特定于应用程序的数据的语义保持沉默，就如同对 SOAP 消息的路由、可靠数据传输、防火墙穿越等问题一样。但是，SOAP 提供了一种框架，通过该框架，特定于应用程序的信息可以以可扩展的方式进行传递。\n\
  \n## Web 服务寻址（WS-Addressing）\n\n如果在 Web 服务网络中，有一种标准方式来表达消息应被传递到何处，那将会非常有用。这可以减轻开发者的工作量，因为他们能够简化\
  \ Web 服务的通信和开发，并避免需要临时开发成本高昂且通常难以跨平台互操作的解决方案。在与人类应用程序交互时，我们在浏览器中输入地址（或 URL），然后导航到该页面。我们点击内部链接，它就会带我们到一个新页面。当涉及到应用程序到应用程序的通信（如\
  \ Web 服务）时，应该有一种指定这些地址的标准方式。因此，WS-Addressing 通过定义一种标准机制来识别和交换多个端点之间的 Web 服务消息，使组织能够构建可靠且可互操作的\
  \ Web 服务应用程序。\n\n该标准提供了与传输无关的机制来寻址消息和识别 Web 服务，对应于 Web 服务架构中描述的*地址*和*消息关联*概念。该标准定义了\
  \ XML 元素，用于识别 Web 服务端点并确保消息中端到端的端点标识安全。这使得消息传递系统能够通过包含处理节点（如端点管理器、防火墙和网关）的网络以传输中立的方式支持消息传输。\n\
  \n## 服务描述\n\n当我们购买产品时，我们可以找到它的操作手册；当我们购买软件应用程序时，我们应该有使用它的手册或文档。对于面向对象编程，我们有描述公共操作的接口，同样，Java\
  \ 文档提供有关可用方法及其使用方式的信息。因此，重要的是要注意，Web 服务的描述对于分类、发现和使用服务至关重要。描述应该既能被人类理解，也能被应用程序理解。他们还提到，Web\
  \ 服务描述需要在语义和语法两个层面上提供。语义信息必须包含关于服务提供者、服务功能以及可靠性、安全性和消息排序等特征的详细信息。语义信息使服务请求者能够决定服务是否满足其需求。此外，代理可以使用语义信息对服务进行分类。语法信息描述如何使用服务，也可能涉及非功能性需求，如可靠性、安全性和事务。最重要的是，服务描述成为外部文档，用于阅读和更多地了解服务。\n\
  \n## Axis2 的特性\n\n- 传输框架：Axis2 有一个简洁明了的抽象，用于集成和使用传输（即，通过 SMTP、FTP、面向消息的中间件等各种协议进行\
  \ SOAP 的发送方和监听方），并且引擎核心完全与传输无关。\n- WSDL 支持：Axis2 支持 Web 服务描述语言（1.1 和 2.0 版本），这使您可以轻松构建存根以访问远程服务，还可以自动从\
  \ Axis2 导出所部署服务的机器可读描述。\n- 附加组件：已经整合了多个 Web 服务规范，包括用于安全的 WSS4J（Apache Rampart）、用于可靠消息传递的\
  \ Sandesha。Kandula 是 WS-Coordination、WS-AtomicTransaction 和 WS-BusinessActivity\
  \ 的封装。\n- 组合和可扩展性：模块和阶段提高了对可组合性和可扩展性的支持。模块支持可组合性，也可以以简单明了的方式支持新的 WS-* 规范。但是，它们不能热部署，因为它们会改变系统的整体行为。\n\
  \n## 下载并安装 Apache Axis2\n\nApache Axis2 1.0 版本于 2006 年发布，之后有许多版本发布。当前的稳定版本是 1.5。本书的上一版本《Quickstart\
  \ Apache Axis》（Deepal Jayasinghe 著，Packt Publishing 出版）基于 Axis2 1.2 版本。本书基于 1.5\
  \ 版本。从 1.2 到 1.5，Axis2 引入了一系列新特性以及 API 更改。其中一个关键变化是从 JDK 1.4 迁移到 1.5。当前版本的 Axis2\
  \ 仅支持 JDK 1.5 及更高版本。尽管如此，大多数常用的 API 仍然保持不变。\n\n有三种类型的软件：自由软件、开源软件和商业软件。自由软件的主要理念是您可以免费下载该软件；但是，您无法访问源代码或开发工作。另一方面，开源软件由开放社区设计和开发；任何人都可以参与讨论并为项目做出贡献，最后，一旦产品发布，用户既可以访问产品也可以访问源代码。用户可以修改源代码、修复问题、重新分发等等。由于\
  \ Axis2 也是一个开源项目，您可以下载 Axis2 并访问二进制代码和源代码。然而，在专有软件中，许可协议非常严格，通常用户看不到源代码；用户只能获得二进制代码。\n\
  \n\n\n\n\n你可以从 Axis2 官方网站或任何镜像站点下载最新版本（或 1.5）。下载链接如下所示：\n\n```\nhttp://ws.apache.org/axis2/download/1_5_1/download.cgi\n\
  ```\n\n进入下载页面后，你可以找到四种不同的发行版本（构件）：\n\n- 二进制发行版\n- WAR 发行版\n- 源码发行版\n- 文档发行版\n\n\
  此外，你还可以从 Axis2 官方网站下载 IDE 插件（IDE 工具包括 Eclipse 和 IntelliJ IDEA）。\n\n## 二进制发行版\n\n\
  Axis2 二进制发行版包含所有相关的第三方库、一组示例以及 Axis2 运行时。安装二进制发行版只需将 ZIP 归档文件解压到你想放置的位置即可。下载并解压二进制发行版后，你将看到其中包含一组子目录（bin、lib、samples、repository、webapp\
  \ 和 conf）。解压后的二进制发行版典型结构如下所示：\n\n![](img/e2fb05de168053e6227dab034eff9353_38_0.png)\n\
  \nAxis2 二进制发行版是一个完整的软件包，你可以在其中部署服务，并使用 SimpleAxisServer 将其公开。SimpleAxisServer 是一个功能完备的服务器，可以用作公开\
  \ Web 服务的后端服务器。它支持 servlet 版本所支持的所有特性，包括会话管理、线程管理、自动 WSDL 生成等。\n\n我们还可以使用 Axis2\
  \ 二进制发行版来调用远程服务。为此，你需要将 Axis2 及其他相关库添加到类路径中，并使用 Axis2 客户端 API 来调用服务。一种常用的做法是将这些库添加到你的\
  \ IDE 以及基于该 IDE 开发的客户端应用程序中。\n\n之后，它应该会显示你所下载的 Axis2 的版本字符串。一旦看到版本号，就说明我们已经成功地将\
  \ Axis2 部署到了 Tomcat 中。接下来，你可以向 Axis2 上传或部署新的服务。\n\n```\n<ns:getVersionResponse>\n\
  \  <ns:return>Hi - the Axis2 version is SNAPSHOT</ns:return>\n</ns:getVersionResponse>\n\
  ```\n\n在 Axis2 中，要添加新的 Web 服务，我们需要将相应的资源（服务归档文件）添加到 WAR 文件的解压位置。然而，大多数应用服务器不会解压\
  \ WAR 文件。在这种情况下，你需要遵循额外的步骤来配置你的 WAR 文件。为此，你需要解压 WAR 文件，对 web.xml 文件进行必要的修改，然后重新创建\
  \ WAR 文件并进行部署。如果你的应用服务器会解压 WAR 文件，我们可以将新的 Web 服务直接放入解压位置。这种方法仅用于快速测试——真正的开发和生产使用中，建议使用\
  \ Ant（或 Maven）来为特定部署生成 WAR 文件，也就是说，不要手动调整 WAR 文件的内容。我们将在本书后面详细学习 Axis2 Web 服务。届时，我们将能够理解添加新\
  \ Web 服务的含义。\n\n安装 WAR 发行版包括以下几个步骤：\n\n- 1. 安装应用服务器：如果你的机器上没有应用服务器，那么你需要下载并安装应用服务器。在可用的应用服务器中，Apache\
  \ Tomcat 可以被认为是最好的应用服务器之一（它不支持 J2EE 的所有特性）。因此，让我们下载 Tomcat（5.x 或更高版本）并安装。\n- 2.\
  \ 根据应用服务器的不同，你可以找到需要部署 WAR 文件的位置。以 Tomcat 为例，你需要将 WAR 文件放入 webapps 目录。因此，让我们将 Axis2\
  \ WAR 发行版放入应用服务器的 webapps 目录中。\n- 3. 最后一步，打开浏览器并输入 http://localhost:8080/axis2。我们可以看到\
  \ Axis2 Web 应用程序（如前面图示所示）的主页（此处的 URL 可能因应用服务器而异）。\n\n## 源码发行版\n\n顾名思义，源码发行版包含用于构建二进制发行版的源代码。由于\
  \ Apache Axis2 是在 Apache 许可证下发布的，我们可以对源代码做任何操作。其理念是用户可以使用 Axis2 并根据自己的需求进行修改。此外，如果他们认为某项修改对其他人也有用，可以提交补丁，并请求项目社区将这些更改合并到主源代码库中。\n\
  \n当我们开发真实应用程序时，除了文档之外，手边有源代码也总是有助于调试应用程序。同时，源码发行版包含 Maven 脚本（http://maven.apache.org），我们可以使用它们来创建二进制发行版、WAR\
  \ 发行版，甚至 JAR 发行版。\n\n## 文档发行版\n\n文档发行版提供了理解项目中不同特性和功能所需的所有必要资源。它提供了 Java 文档和教程，解释如何使用不同的特性，\n\
  \n## JAR 发行版\n\nWeb 服务的关键步骤之一是开发服务和客户端。在该阶段，我们需要访问 Web 服务框架及其库。为了访问 API 和其他相关资源，常见的做法是将所需的库添加到集成开发环境（IDE）中。Axis2\
  \ JAR 发行版提供了一种便捷的方式来下载并将 Axis2 运行时嵌入到 IDE 中。你可以从以下链接单独下载 Axis2 库文件，或者从 Axis2 二进制发行版或\
  \ WAR 发行版中获取这些文件：\n\n```\nhttp://people.apache.org/repo/m2-ibiblio-archived/org/apache/axis2/\n\
  ```\n\n## XML 处理模型\n\n正如*第 1 章“Apache Web 服务与 Axis2”*中所提到的，与 Axis 1.x 相比，Axis2 构建在全新的架构之上。引入\
  \ Axis2 的关键原因之一是拥有更好、更高效的 XML 处理模型。Axis 1.x 使用 DOM 作为其 XML 表示机制，这要求将完整的对象层次结构（对应于传入消息）保存在内存中。对于小规模消息来说，这不是问题。但当涉及大规模消息时，这就成了一个难题。为了克服这一问题，Axis2\
  \ 引入了一种新的 XML 表示方式。\n\nAXIOM（AXIS2 对象模型）构成了 Axis2 中每个基于 SOAP 的消息的 XML 表示基础。AXIOM\
  \ 相对于其他 XML InfoSet 表示的优势在于它基于 pull 解析器技术，而大多数其他技术基于 PUSH 解析器技术。\n\npull 与 push\
  \ 的主要区别在于，在 pull 技术中，调用方对解析器拥有完全的控制权，它可以请求下一个事件并对其做出响应；而在 PUSH 的情况下，解析器的控制能力有限，它将大部分功能委托给处理程序，这些处理程序响应文档处理过程中触发的事件。\n\
  \n由于 AXIOM 基于 pull 解析器技术，它具有“按需构建”的能力，即只有在需要时才构建对象模型。如果需要，可以直接从 AXIOM 访问底层的 pull\
  \ 解析器，并使用它，而不是构建一个**对象模型（OM）**。\n\n## SOAP 处理模型\n\n发送、接收和处理 SOAP 消息是 SOAP 处理引擎的关键工作之一。Axis2\
  \ 的架构提供了两个管道（或流）来执行两个基本操作。RPC 等旧式消息系统是围绕请求和响应构建的。而 Axis 则超越了这一点，引入了单向消息处理。这样，就可以有请求而不需要任何响应。\n\
  \nAxis2 的 AxisEngine（引擎或驱动程序）定义了 `send()` 和 `receive()` 两个方法来实现这两个管道。这两个管道分别命名为\
  \ **InFlow** 和 **OutFlow**。复杂的消息交换模式（MEPs）通过组合这两种类型的管道来构建。需要注意的是，除了这两个管道之外，还有另外两个管道，它们用于帮助处理传入和发送*故障*消息。\n\
  \n\n\n\n如前所述，SOAP 处理框架的关键任务就是处理 SOAP 消息。然而，仅仅处理消息还不够，还需要提供额外的功能，例如服务质量。因此，系统必须具有可扩展性。SOAP\
  \ 处理模型的可扩展性是通过处理器来提供的。当 SOAP 消息被处理时，已注册的处理器将被执行。处理器可以在全局、服务或操作范围内注册，最终的处理链由所有范围内的处理器组合而成。\n\
  \n处理器充当拦截器，处理 SOAP 消息的各个部分，并提供*服务质量*特性（服务质量的一个典型例子是安全性或可靠性）。通常处理器处理 SOAP 标头，但也可能访问或修改\
  \ SOAP 正文。\n\n流的概念很简单，它由一系列阶段组成，其中阶段指处理器的集合。对于给定的方法调用，相关的流数量可能根据 MEP（消息交换模式）的不同而变化。\n\
  \n### In-Only MEP（仅入站）\n\n对于 In-Only MEP，相应的方法调用只有一个管道，即消息只会经过入站管道（inflow）。\n\n\
  ### In-Out MEP（入站/出站）\n\n另一方面，对于 In-Out MEP，消息将经过两个管道，即入站管道（inflow）和出站管道（outflow）。当\
  \ SOAP 消息被发送时，`OutFlow` 将启动。\n\n### 故障流（Fault-Flow）\n\n`OutFlow` 调用处理器，并以**传输发送器**结束，该发送器将\
  \ SOAP 消息发送到目标端点。在目标端点，SOAP 消息由该处的**传输接收器**接收，接收器读取 SOAP 消息并启动 `InFlow`。`InFlow`\
  \ 由处理器组成，并以**消息接收器**结束，该接收器处理实际的业务逻辑调用。\n\n阶段是一个或多个处理器的逻辑集合，有时阶段本身充当处理器。Axis2 引入阶段概念，作为扩展核心功能的简便方式。在\
  \ Axis 1.x 中，如果要将处理器添加到处理链中，我们需要更改全局配置文件。而 Axis2 通过阶段和阶段规则的概念简化了这一过程。阶段规则规定了特定阶段内给定处理器集合的排序方式。下图展示了一个流及其阶段：\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_47_0.png)\n\n![](img/e2fb05de168053e6227dab034eff9353_49_0.png)\n\
  \n我们将在*第 6 章“信息模型”*中更详细地讨论此图，届时将逐一讨论每个项目，并详细描述它们如何相互连接。\n\n## 部署模型\n\nAxis 的早期版本（Axis\
  \ 1.x）满足了产品开发阶段所提出的需求。然而，随着 SOA 和 Web 服务变得流行，许多新需求应运而生。其中，易用性是最需要考虑的重要因素之一。\n\n\
  在 Axis 1.x 中，用户必须手动调用管理客户端并更新服务器 `classpath`。之后，用户需要重启服务器才能应用更改。这种繁琐的部署模型对初学者来说无疑是一道障碍。Axis2\
  \ 的设计旨在克服这一缺点，并提供了灵活、用户友好且易于配置的部署模型。\n\n- 传输级非阻塞调用，其中调用发生在两个传输中（可以是两个单通道传输，如 SMTP，也可以是两个双通道传输，如\
  \ HTTP）\n\nAxis2 客户端 API 支持这两种非阻塞调用场景。\n\nAxis2 引入了一个非常方便的客户端 API 来调用服务，该 API 包含两个类：`ServiceClient`\
  \ 和 `OperationClient`。`ServiceClient` API 用于常规使用，即只需发送和接收 XML 时。另一方面，OperationClient\
  \ 面向高级用法，当需要处理 SOAP 标头或执行其他高级任务时使用。使用 `ServiceClient`，你只能访问 SOAP 正文或有效负载。虽然我们可以添加\
  \ SOAP 标头，但无法通过 `ServiceClient` 检索 SOAP 标头。要实现此功能，我们需要使用 OperationClient。\n\n`ServiceClient`\
  \ 提供了以下用于调用服务的 API：\n\n- **sendRobust**：此 API 的核心思想是向 Web 服务发送 XML 请求，而不关心其响应。但是，如果出现问题，你也会需要知道。因此，此\
  \ API 调用没有返回值但会抛出异常的服务。\n- **fireAndForget**：此 API 仅用于发送 XML 请求，既不关心响应，也不关心异常。因此，它适用于调用\
  \ In-Only MEP。\n- **sendReceive**：此 API 调用具有返回值的服务。这是最常用的 API 之一。因此，它用于调用 In-Out\
  \ MEP。\n- **sendReceiveNonBlocking**：此方法以非阻塞方式调用服务。当服务有返回值时可以使用此方法。要使用此方法，我们必须传递一个回调对象，该对象在调用完成后被调用。\n\
  \n如前所述，`OperationClient` 面向高级用户，使用 `OperationClient` 需要深入了解 Axis2。在使用 `ServiceClient`\
  \ 时，你无需了解 SOAP 信封、消息上下文等任何内容。但使用 `OperationClient` 时，用户必须在调用服务之前自行创建这些内容。使用 `OperationClient`\
  \ 创建和调用服务涉及以下步骤：\n\n1. 创建一个 `ServiceClient`。\n2. 然后，使用你创建的 `ServiceClient` 创建 `OperationClient`。\n\
  3. 创建一个 SOAP 信封。\n4. 创建消息上下文。\n5. 将 SOAP 信封添加到消息上下文。\n6. 将 `MessageContext` 添加到\
  \ `OperationClient`。\n7. 调用 `OperationClient`。\n8. 如果有响应，从 `OperationClient` 获取响应消息上下文。\n\
  \n## 传输\n\n在 Axis2 中，每个传输都由两部分组成，即传输发送器和传输接收器。你可以在 Axis2 全局配置中定义传输以及发送器和接收器。传输接收器是\
  \ `AxisEngine` 接收消息的途径，而传输发送器是发送消息的途径。Axis2 的一个重要方面是，其核心完全独立于传输发送器和接收器。\n\nAxis2\
  \ 旨在支持以下传输协议：\n\n- HTTP/HTTPS：在 HTTP 传输中，传输监听器是一个 servlet 或 Axis2 提供的 `org.apache.axis2.transport.http.SimpleHTTPServer`。传输发送器使用公共\
  \ HTTP 客户端进行连接并发送 SOAP 消息。\n- TCP：这是最简单的传输，需要 WS-Addressing 支持才能正常工作。\n- SMTP：这需要一个电子邮件帐户。传输接收器是一个线程，按固定时间间隔检查电子邮件。\n\
  - JMS：这提供了一种使用 JMS 方式调用 Web 服务的方法。\n- XMPP：这提供了一种与 Jabber 服务器通信并使用 XMPP 协议调用 Web\
  \ 服务的标准方式。\n\n## 其他模块\n\n其他模块指的是可选模块，它们提供附加功能或实用工具：例如，需要生成 Axis2 服务和服务代理的模块。Axis2\
  \ 在运行时不会使用这些模块，如前所述，它们仅用于提供附加功能。Axis2 将它们作为工具模块，用于生成服务端代码和客户端代码。\n\n- 代码生成：Axis2\
  \ 提供了一个代码生成工具，可生成服务端（骨架）和客户端（存根或代理）代码，以及描述符和测试用例。生成的代码将简化服务的部署和调用。这将提高 Axis2 的易用性。\n\
  \n\n\n\n## Axis2 的可扩展性\n\n在 Axis2 中，有许多扩展功能的方式。在本书中，我们将讨论其中几种，列在这里：\n\n- 模块的服务扩展\n\
  - 自定义部署器\n- 消息接收器\n\n### 服务扩展或模块\n\nAxis1 和 Axis2 都有处理程序的概念。但与 Axis 1.x 相比，Axis2\
  \ 指定和部署处理程序的方式有几处变化。在 Axis 1.x 中，如果你想添加一个处理程序，则需要更改全局配置文件然后重启系统。同时，它没有动态添加或更改处理程序的方式。\n\
  \n为了解决这个问题以及添加新功能，Axis2 引入了 Web 服务扩展或模块的概念，其中模块的主要目的是扩展核心功能。它类似于在 Axis1.x 中添加处理程序链。Axis2\
  \ 模块相对于 Axis 1.x 处理程序链的优势在于，你可以在不更改任何全局配置文件的情况下添加新模块。\n\n模块是一个自包含的包，其中包括处理程序、第三方库、模块相关资源和模块配置文件。\n\
  \n模块可以作为归档文件部署。Axis2 为模块设计了一种新的文件扩展名，称为 .mar。模块归档文件中最重要的文件是模块配置文件或 module.xml。如果没有\
  \ module.xml 文件，模块将无法运行。模块配置文件主要指定处理程序及其阶段规则。因此，一旦我们根据阶段规则启用模块，处理程序将被放置在不同的流中（inflow、outflow\
  \ 等）。\n\n模块的想法非常简单。为了在我们的服务中实现对 WS-Addressing 或 WS-Security 的支持，我们需要下载相应的模块并将其放入\
  \ Axis2 仓库的 modules 目录。我们可以在部署时通过向 axis2.xml（全局配置文件）中添加 `<module ref=\"module name\"\
  />` 来启用模块。除此之外，如果我们想在运行时启用模块，我们可以通过多种方式做到，例如使用 Axis2 web 管理、处理程序等。\n"
- "# 3 Axis2 XML 模型（AXIOM）\n\nAXIOM 代表 Axis2 Object Model，指的是一种 XML InfoSet 模型，最初作为\
  \ Apache Axis2 的一部分开发，后来作为 WS commons 项目迁移，以便除 Axis2 之外的项目也能受益。XML InfoSet 指的是 XML\
  \ 内部包含的信息，对于程序化操作，将此 XML InfoSet 以语言特定的方式表示是很方便的。对于面向对象的语言，显而易见的选择是由对象组成的模型。DOM\
  \ 和 JDOM 就是两种这样的 XML 模型。AXIOM 在外部行为上概念上类似于此类 XML 模型，但其内部却大不相同。在本章结束时，你将了解 AXIOM\
  \ 的基础知识以及使用 AXIOM 时应遵循的最佳实践。\n\n本章将涵盖：\n\n- AXIOM 架构\n- Pull 解析\n- 使用 AXIOM\n- AXIOM\
  \ 的高级操作\n\n### AXIOM 及其特性的概述\n\nApache Axiom 的设计目的是提供快速且更好的 XML，这已成为任何给定 XML 处理系统的核心。Axiom\
  \ 是一个轻量级实现，建立在延迟解析技术之上。更具体地说，它是 StAX（JSR 173）的实现，即标准流式 pull 解析器 API。其主要意图之一是提供标准操作\
  \ API。因此 AXIOM 对象模型可以像任何其他对象模型（例如 JDOM）一样灵活操作，但在底层，对象仅在绝对需要时才会被创建（即按需构建）。这导致编程更省内存。\n\
  \n使用 pull 解析，用户对解析器有完全控制权。用户可以要求处理下一个事件和下一个事件。换句话说，在 pull 解析中，解析器仅在用户命令下才继续。用户可以决定存储或丢弃从解析器生成的事件。这类似于水龙头，你打开水龙头，取水，然后关闭水龙头。当你再次需要水时，再次打开水龙头并继续过程。因此，用户对水流和过程有完全控制权。pull\
  \ 解析也是如此，用户创建解析器并请求事件，然后它给出事件。用户处理事件并请求下一个事件，直到文件结束。\n\n### 架构\n\n当我们考虑 AXIOM 架构时，它并不像你想象的那么复杂。如前所述，许多\
  \ API 都非常类似于 JDOM API。值得注意的是，AXIOM 对二进制数据和 MTOM 有原生支持，这对于 Axis2 这样的 SOAP 处理框架很重要。AXIOM\
  \ 还对 XML 处理提供完全支持，并对 SOAP 处理提供增强支持。\n\nAXIOM 也被称为对象模型（OM），OM Builder 通过 StAX reader\
  \ API 将原始 XML 字符流包装起来。因此，pull 事件流的复杂性对用户是透明的。\n\n如前所述，延迟构建是 AXIOM 的主要特性之一。此外，缓存和非缓存也可以被视为另一个有用的特性。缓存的想法取决于对象模型是否存储在内存中。如果对象模型存储在内存中，则为缓存，否则为非缓存。之所以如此重要，是因为在某些情况下可以关闭缓存。如果发生这种情况，解析器将继续进行而不构建对象结构。用户可以从\
  \ AXIOM 中提取原始 pull 流并使用它代替 AXIOM。在这种情况下，有时关闭缓存是有益的。\n\n### 使用 AXIOM\n\n你可以下载 AXIOM\
  \ 二进制文件，也可以从源分发版（或源仓库）构建二进制文件。如你所知，虽然 AXIOM 最初是作为 Axis2 的一部分启动的，但现在它有自己的发布周期。因此，你可以从\
  \ AXIOM 发布版下载 AXIOM 二进制文件，也可以在 Axis2 发布版中找到 AXIOM 二进制文件。\n\n一旦你拥有 AXIOM 二进制文件，下一步是将二进制文件添加到你的类路径中（以及依赖的二进制文件）；只有这样你才能开始使用\
  \ AXIOM。如果你的应用程序有构建系统，例如 Maven，你可以添加依赖项，让它自动下载 AXIOM JAR。\n\n### 创建 Axiom\n\n你可以以三种方式创建\
  \ AXIOM（对象模型实例），如以下图所示。首先，你可以使用 pull 事件流创建 Axiom。其次，你可以使用 push 事件流创建 Axiom，或者你可以以编程方式创建\
  \ AXIOM。在本章中，你将学习如何使用 pull 事件流创建 Axiom，以及如何以编程方式创建，因为这两种是最常用的创建 Axiom 的方法。\n\n![](img/e2fb05de168053e6227dab034eff9353_60_0.png)\n\
  \n首先，让我们看看如何使用 pull 事件流创建 Axiom（我们将交替使用 AXIOM 和 Axiom）。Axiom 提供了工厂和构建器的概念来创建对象。工厂有助于将代码保持在接口级别并将实现分开。Axiom\
  \ 紧密绑定到 StAX API（pull 解析器 API），因此应首先使用所需输入流创建符合 StAX 的 reader。然后可以选择 AXIOM 中提供的众多构建器之一。在\
  \ Axiom 中，你可以找到不同类型的构建器，主要为用户方便。Axiom 有 OM 构建器（纯 XML 处理）以及 SOAP 构建器（针对 SOAP 优化的\
  \ SOAP 处理），因此你可以根据需要使用合适的构建器。StAXOMBuilder 将构建符合纯 XML InfoSet 的对象模型，而 SOAPModelBuilder\
  \ 通过其构建器方法返回 SOAP 特定对象（例如 SOAPEnvelope，它是 OMElement 的子类）。\n\n#### 从输入流创建 Axiom\n\
  \n以下代码片段显示了从文件输入流（输入流可以是文件流、套接字流或任何其他流）创建 Axiom 文档的正确方法：\n\n```\n//First, create\
  \ the parser\nXMLStreamReader parser = XMLInputFactory.newInstance().\ncreateXMLStreamReader(new\
  \ FileInputStream(file));\n//create an OM builder, the most recommended approach\
  \ is to use the\n//factory, but here we simply create it\n```\n\n\n\n\n\n当遍历一个 Axiom\
  \ 对象时，你可以使用常规的树遍历方式：获取一个节点，查找其子节点，然后对每个子节点重复相同操作。值得注意的是，在 Axiom 中你得到的不是列表，而是迭代器：其思想是通过迭代器来封装延迟构建。以下代码示例演示了如何访问子节点。子节点的类型为\
  \ `OMNode`，可以是 `OMText` 或 `OMElement` 类型。\n\n```\nIterator childNodes = root.getChildren();\n\
  while(childNodes.hasNext()){\n    OMNode node = (OMNode) childNodes.next();\n}\n\
  ```\n\n此方法展示了如何使用迭代器访问子节点列表；除此之外，一旦处理了某个特定元素，你还可以获取它的兄弟节点。此外，你可以分别使用 `nextSibling()`\
  \ 和 `previousSibling()` 方法访问下一个兄弟节点和上一个兄弟节点。\n\n你还可以使用 `getChildrenWithName(QName)`\
  \ 方法只过滤一组节点（例如，具有特定名称的元素），`getChildrenWithName(QName)` 方法返回一个迭代器，其中包含所有具有给定 QName\
  \ 的子节点。\n\n## 序列化\n\n现在你已经对创建和遍历 Axiom 树有了很好的理解。因此，下一个最重要的部分是学习如何将 Axiom 对象模型序列化或写入到输出流中。\n\
  \nAxiom 既可以作为纯对象模型（例如一组 Java 对象）进行序列化，也可以作为拉式事件流（例如写入文件或任何其他输出流）进行序列化。序列化使用 `XMLStreamWriter`\
  \ 对象来写出输出，因此可以使用相同的序列化机制来写入不同类型的输出（例如文本、二进制等）。虽然本书未讨论，当前版本的 Axis2 使用了这一机制，并提供了多种不同的消息格式（例如\
  \ REST、JSON 等）。\n\n## 创建 SOAP 1.1 文档\n\n如下面的代码所示，首先创建一个 `book` 元素作为 SOAP 消息的正文，然后创建一个默认的\
  \ SOAP 1.1 信封，并将创建的 `book` 元素添加为正文：\n\n```\nOMFactory factory = OMAbstractFactory.getOMFactory();\n\
  \    OMNamespace axis2 = factory.createOMNamespace(\"axis2\", \"ns\");\n    OMElement\
  \ root = factory.createOMElement(\"book\", axis2);\n    OMAttribute type = factory.createOMAttribute(\"\
  type\",null,\"web-services\");\n    root.addAttribute(type);\n    OMElement name\
  \ = factory.createOMElement(\"name\", axis2);\n    OMElement isbn = factory.createOMElement(\"\
  isbn\", axis2);\n    root.addChild(name);\n    root.addChild(isbn);\n    SOAPFactory\
  \ soapFactory = OMAbstractFactory.getSOAP11Factory();\n    //get the default envelope\n\
  \    SOAPEnvelope env = soapFactory.getDefaultEnvelope();\n    //add the created\
  \ child\n    env.getBody().addChild(root);\n    System.out.println( env);\n```\n\
  \n如你所见，首先创建 `book` 元素作为 SOAP 消息的正文，然后创建默认的 SOAP 1.1 信封，并将创建的 `book` 元素添加为正文。\n\n\
  ## 创建 SOAP 1.2 文档\n\n创建 SOAP 1.2 文档与前面的示例几乎相同，只是工厂不同；这里需要使用 1.2 工厂而不是 1.1 工厂：\n\n\
  ```\nOMFactory factory = OMAbstractFactory.getOMFactory();\n    OMNamespace axis2\
  \ = factory.createOMNamespace(\"axis2\", \"ns\");\n    OMElement root = factory.createOMElement(\"\
  book\", axis2);\n    OMAttribute type = factory.createOMAttribute(\"type\",null,\"\
  web-services\");\n    root.addAttribute(type);\n    OMElement name = factory.createOMElement(\"\
  name\", axis2);\n    OMElement isbn = factory.createOMElement(\"isbn\", axis2);\n\
  \    root.addChild(name);\n    root.addChild(isbn);\n    SOAPFactory soapFactory\
  \ = OMAbstractFactory.getSOAP12Factory();\n    //get the default envelope\n    SOAPEnvelope\
  \ env = soapFactory.getDefaultEnvelope();\n    //add the created child\n    env.getBody().addChild(root);\n\
  \    System.out.println( env);\n```\n\n## 小结\n\n在本章中，我们讨论了 Axiom 的一点历史、为什么引入它，以及它所基于的标准规范。随后，我们讨论了它提供的一些功能，并通过代码示例进行了演示。虽然我们没有明确提及，但\
  \ Axiom 最初仅被设计用于处理 SOAP，后来经过改进以处理任何类型的 XML 消息。因此，目前 Axiom 是一个完整的 XML 处理框架，你可以在 Axis2\
  \ 之外使用它。\n\n在下一章中，我们将讨论 Axis2 的基本特性之一——执行框架。在那里，我们将讨论处理器链、处理器、阶段、阶段规则，以及这一切如何为 Axis2\
  \ 提供可扩展的特性。\n"
- "# 4 执行链\n\n任何 Web 服务框架的关键功能都是处理传入消息并将其传递给目标应用程序（服务），一旦产生结果，再将其传递给客户端。如今，对于业务关键型应用程序，我们需要的远不止处理消息。因此，需要支持可靠性、安全性、事务和节流等功能。此外，框架还应该易于扩展，以支持新的客户需求和其他质量服务。为了提供这些特性，大多数\
  \ SOAP 处理框架都利用了管道（pipe）的概念，任何传入或传出的消息都会经过管道，而可扩展的管道被划分为多个小块。这样的一块被称为拦截器（interceptor）。可以添加新的拦截器、修改或删除它们，以满足需求。\n\
  \n在本章中，我们将更详细地讨论以下主题：\n\n- 处理器\n- 阶段\n- 阶段规则\n- 流的概念\n- Axis2 发行版附带的一些默认处理器\n\n\
  ## 处理器\n\n处理器是 Axis1 项目引入的最重要、最有用的特性之一。事实上，处理器的思想在业界已经使用很久了。有些人将处理器称为消息拦截器。在任何消息传递系统中，拦截器在消息传递的语境中也有其实际含义，它会拦截消息流并执行分配给它的任何任务。实际上，拦截器是消息传递系统中最小的执行单元，因此，作为\
  \ Axis 中的拦截器，处理器也做同样的事情。\n\n在 Axis 中，处理器是无状态的，这意味着它们不会在内存中保留过去的执行状态。处理器可以看作一个逻辑调用器，其逻辑评估的输入仅从\
  \ `MessageContext` 获取。处理器对 `MessageContext`（MC）和传入的 SOAP 消息具有读写访问权限。因此，处理器可以读取 SOAP\
  \ 消息，从消息中删除元素（主要是消息头），添加新元素（消息头），或修改元素，以及添加、删除或修改 `MessageContext` 中的内容。\n\n为了便于后续讨论，我们可以将\
  \ `MessageContext` 视为一个属性包，它保存传入或传出的消息，以及（可能两者都有）在消息通过执行链时所需的其他参数和属性。另一方面，通过 MC，我们可以访问整个系统，例如系统运行时、全局参数、属性服务以及操作。我们将在第\
  \ 6 章“信息模型”中讨论更多与 MC 相关的操作。\n\n在大多数情况下，处理器只处理 SOAP 消息的头块，即读取一个或多个消息头、添加消息头或移除消息头。然而，这并不意味着处理器不能处理\
  \ SOAP 正文。有时处理器也会处理正文；一个很好的例子是加密。在读取过程中，如果某个消息头面向某个处理器，而该处理器无法正确执行（消息可能有错误），则应抛出异常，下一个链驱动程序（在\
  \ Axis2 中是引擎）将采取必要的操作。带有一些消息头的典型 SOAP 消息如下图所示：\n\n![](img/e2fb05de168053e6227dab034eff9353_72_0.png)\n\
  \n\n\n\n\n![](img/e2fb05de168053e6227dab034eff9353_75_0.png)\n\n阶段（phase）旨在支持阶段规则。阶段规则告诉\
  \ Axis2 在执行链中应将处理器放在何处。稍后我们会看到，有诸如 phaseFirst 和 phaseLast 这样的规则。因此，在一个阶段中，有保留的插槽用于放置阶段第一个和阶段最后一个处理器。其余的处理器将保存在另一个列表中。一个阶段可以图形化表示如下：\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_75_1.png)\n\n一旦引擎调用阶段的 invoke 方法，它将按照以下顺序执行：\n\
  \n1. 首先检查前置条件是否满足。\n   - 如果不满足，则抛出异常并停止处理消息。\n2. 然后检查阶段第一个处理器是否存在。如果存在，则调用它。\n3.\
  \ 接下来，调用除阶段最后一个处理器之外的其余处理器。\n4. 如果阶段最后一个处理器存在，则调用它。\n5. 最后，检查后置条件是否满足以转发消息。\n  \
  \ - 如果不满足，则停止执行并抛出异常。\n\n## 执行链\n\n所有全局阶段从其名称中也具有语义含义：\n\n- 传输阶段（Transport phase）：包含一个执行依赖于传输类型任务的处理器。\n\
  - 安全阶段（Security phase）：WS-security 实现会添加它们的处理器，但不限于此，任何其他模块或用户也可以添加处理器。\n- 预分发（PreDispatch）：顾名思义，它包含一组执行分发所需任务的处理器。像\
  \ WS-addressing 这样的处理器将始终位于此阶段。\n- 分发阶段（Dispatch phase）：该阶段通过为传入消息查找相应的服务和操作来执行分发。因此，分发阶段由分发处理器组成。我们也可以添加新的全局阶段，然后向其添加处理器，这需要修改\
  \ `axis2.xml` 文件。\n\n请注意，如有必要，用户可以通过编辑 `axis2.xml` 轻松添加新阶段。\n\n### 操作阶段\n\n例如，假设我们有一个处理器，不需要为到达系统的每条消息运行它，但需要为选定的操作运行它。这就是操作阶段发挥作用的地方。操作阶段是位于分发阶段之后的阶段，用户可以添加任意数量的阶段。添加操作阶段不会改变其他操作在其链中的结构。\n\
  \n### 阶段规则\n\n阶段规则的主要思想是正确定位处理器相对于阶段内另一个处理器的位置，可能是在部署时或运行时。Axis1 没有阶段或阶段规则的概念。它只有一个全局配置文件，在其中定义处理器。但这有很多局限性；尤其是，你会失去处理器链的动态特性。因此，阶段规则的一个方面是解决动态执行链构建能力的问题。\n\
  \n### 描述阶段规则的特征\n\n阶段规则的特征可以基于以下一个或多个属性：\n\n- 阶段名称（Phase name）：处理器必须被放置到的阶段的名称\n\
  - 第一阶段（`phaseFirst`）：阶段中的第一个处理器\n- 最后阶段（`phaseLast`）：阶段中的最后一个处理器\n- 之前（`before`）：将处理器定位在另一个处理器之前\n\
  - 之后（`after`）：将处理器定位在另一个处理器之后\n- 之前和之后：将处理器放置在两个处理器之间\n\n### 阶段名称\n\n阶段是任何阶段规则的一个强制属性，该规则给出了处理器必须适配的阶段名称。为了使规则成为有效的阶段名称，该名称必须为系统所知，并且必须是全局阶段名称或操作特定的阶段。\n\
  \n### phaseFirst\n\n顾名思义，如果你希望某个处理器在给定阶段中作为第一个处理器被调用，而不考虑该阶段中的其他处理器，则必须将 phaseFirst\
  \ 属性设置为 true。一个其阶段规则仅包含 phaseFirst 和阶段名的处理器如下所示：\n\n```\n<handler name=\"simple_Handler\"\
  \ class=\"org.apache.axis.handlers.SimpleHandler\">\n    <order phase=\"userphase1\"\
  \ phaseFirst=\"true\"/>\n</handler>\n```\n\n### phaseLast\n\n与 phaseFirst 类似，如果希望处理器在给定阶段中最后运行，而不考虑其他处理器，则必须将\
  \ phaseLast 设置为 true。因此，带有 phaseLast 的处理器如下所示：\n\n```\n<handler name=\"simple_Handler\"\
  \ class=\"org.apache.axis.handlers.SimpleHandler\">\n    <order phase=\"userphase1\"\
  \ phaseLast=\"true\"/>\n</handler>\n```\n\n如果某个阶段规则同时将 phaseFirst 和 phaseLast 设置为\
  \ true，那么该阶段不能再有任何其他处理器。换句话说，该阶段只有一个处理器。\n\n### before\n\n可能会存在这样的情况：一个处理器应该总是在某个其他处理器之前运行，无论其确切位置如何。一个实际用例可以是安全处理器需要在\
  \ RM 处理器之前运行。逻辑必须按如下方式编写，并且 before 属性的值是被引用的处理器名称：\n\n- 如果某个处理器的阶段规则同时将 `phaseFirst`\
  \ 和 `phaseLast` 设置为 `true`，那么该特定阶段不能有多个处理器。如果有人试图编写一个将其他处理器插入到同一阶段的阶段规则，则该第二个阶段规则无效。\n\
  - 一个阶段中不能有两个处理器的 `phaseFirst` 属性设置为 `true`。\n- 一个阶段中不能有两个处理器的 `phaseLast` 属性设置为\
  \ `true`。\n- 如果规则中的 `before` 属性被引用为 `phaseFirst` 处理器，则该规则无效。\n- 如果规则中的 `after` 属性被引用为\
  \ `phaseLast` 处理器，则该规则无效。\n\n```\n<handler name=\"simple_HandlerError\" class=\"\
  org.apache.axis.handlers.SimpleHandlerError\">\n    <order phase=\"userphase1\"\
  \ before=\"simple_Handler\" phaseFirst=\"true\"/>\n</handler>\n```\n\n阶段规则是为每个基本处理器定义的，系统中的任何处理器都必须归入系统中的某个阶段。\n\
  \n### 流程\n\n流程只是阶段的一个集合，流程内阶段的顺序在 `axis2.xml` 中定义。由于阶段是一个逻辑集合，实际上是一个虚拟概念，流程可以被视为执行链（处理器的集合）。Axis2\
  \ 中有四种类型的流程：\n\n- `InFlow`：当消息进入时（请求消息），消息必须经过 `InFlow`。然后 `InFlow` 中的所有处理器都将被调用。`InFlow`\
  \ 与 `OutFlow` 有些不同。一个流程由两部分组成。第一部分是从开始到分发器（直到并包括分发阶段）。第二部分仅在分发阶段结束时找到相应服务时才存在。因此，流程的第二部分是传入消息对应操作的\
  \ `InFlow`。所以 `InFlow` 由一个全局部分和一个操作部分组成。\n- `InFaultFlow`：如果传入请求是错误请求（HTTP 状态码为\
  \ 500 的请求），将调用此流程。\n- `OutFlow`：当消息从服务器传出（比如响应）时，将调用此流程。因此，传出消息始终绑定到一个操作，并且在传出路径中没有类似分发的东西。\n\
  \n改变流程的唯一方法是将一个或多个处理器添加到流程中的某个阶段。因此，模块参与将动态地改变处理器链。模块可以动态（运行时）或静态（部署时）参与。如果你想静态地参与一个模块，你需要在描述文件中指定它。如果它是针对服务或操作的，则在\
  \ `services.xml` 中指定；如果是全局参与，则在 `axis2.xml` 中指定。\n\n### 链中的特殊处理器\n\n当你考虑执行链时，可以在执行链中发现四种类型的特殊处理器：\n\
  \n- 传输接收器\n- 分发器\n- 消息接收器\n- 传输发送器\n\n### 传输接收器\n\n每当消息首先进入系统时，它会到达传输接收器。传输接收器可以被视为等待接受传入消息的东西（在应用服务器的情况下，传输接收器可以是\
  \ `Servlet`）。因此，执行链的 `InFlow` 总是从传输接收器开始。\n\n### 分发器\n\n正如我们之前讨论的，SOAP 处理框架的基本目标之一是将传入消息传递到目标应用程序。找到正确的目标应用程序的过程称为**分发**。在\
  \ Axis2 中，分发将在传入执行链的中间进行。因此，分发器是链中的处理器。在 Axis2 中，有几种方式可以执行分发：\n\n- 使用传输头和传输层数据\n\
  - 使用 WS-Addressing 信息\n- 使用传入的 SOAP 消息\n\n\n\n\n\n为了满足提到的调度类型，Axis2 拥有一组默认调度器，你可以使用\
  \ `axis2.xml` 来更改它们的执行顺序。如果你查看 `InFlow` 元素，我们在 *Global phases* 部分讨论过，你可以在调度阶段找到可用调度器的集合。\n\
  \n- `RequestURIBasedDispatcher`: 尝试使用传输 URI 查找服务和操作\n- `SOAPActionBasedDispatcher`:\
  \ 尝试使用 SOAP 操作查找操作\n- `AddressingBasedDispatcher`: 使用 WS-A 头中的寻址信息查找服务和操作\n- `SOAPMessageBodyBasedDispatcher`:\
  \ 使用并导航 SOAP 消息，特别是主体以查找操作。\n- `HTTPLocationBasedDispatcher`: 这将用于调度 WSDL 2.0 相关\
  \ SOAP 消息\n\n## Message receiver\n\n消息接收器本身就是一个处理器，但唯一的区别是 Axis2 对此处理器的处理方式与其他处理器不同。如果消息在执行链中顺利通过（链中间没有发生异常），引擎将把消息交给消息接收器进行业务逻辑调用。下图显示了\
  \ `MessageReceiver` 在执行链中的位置：\n\n![](img/e2fb05de168053e6227dab034eff9353_84_0.png)\n\
  \n另一方面，消息接收器是直接与实际服务实现类和 Axis Engine 交互的组件（服务本身也可能是消息接收器的情况）。Axis 1.x 具有 **pivot\
  \ point** 的概念，即请求路径和响应路径汇合的地方，也是实际服务调用发生的地方。如前所述，消息接收器是 `InFlow` 的末端，与服务 `impl`\
  \ 类交互。因此，Axis2 在将消息交给消息接收器后不再关心该消息。值得注意的是，是否发送响应消息以及如何处理消息完全由消息接收器决定。\n"
- "# 5 部署 Axis2\nDeployment Model\n\n现在趋势不仅仅是拥有功能，而是以非常用户友好的方式拥有它们。时间是他们唯一关心的东西，没有人喜欢花几天时间做一件小事。在\
  \ Apache Axis 的早期版本中，用户友好性并不是首要考虑因素，因为它们主要用于验证 Web 服务概念。因此，在 Axis 1.x 中，用户必须手动调用管理客户端，更新服务器\
  \ `classpath`，然后重启服务器以应用更改。这种繁琐的部署模型对初学者来说无疑是障碍。因此，Axis2 被设计用来克服这一缺点，并提供灵活、用户友好且易于配置的部署模型。\n\
  \n在本章中，我们将讨论：\n\n- Axis2 部署模型，特别是基于归档的部署模型\n- 热部署和热更新\n- 仓库的概念\n- 不同的部署描述符\n- 几个动手示例\n\
  \n## What is new in Axis2 deployment?\n\n如第一章 Apache Web Services and Axis2 中所述，Axis2\
  \ 设计的主要目标之一是提供更强的用户友好性；同时为系统提供更好的可扩展性和灵活性。谈到用户友好性，服务部署是用户需要更少工作的领域之一。因此，与 Apache\
  \ Axis1 相比，Axis2 支持一种非常方便的部署模型，并具有许多新功能。其中一些常用且有用的功能集如下所示：\n\n- J2EE-like 部署机制（基于归档）\n\
  - 热部署和热更新\n- 仓库的概念\n- 部署处理器（模块）方式的改变\n- 部署描述符\n- 部署选项\n\n下图显示了 J2EE-like 部署机制：\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_88_0.png)\n\n在任何 J2EE 应用服务器中，你都可以将应用程序作为自包含包部署，其中你可以将所有资源、配置文件和二进制文件捆绑到一个文件中并部署它。\n\
  \n这不是很容易而且有用吗？嗯，显而易见的答案是肯定的，它是有用的。\n\n这就是为什么 Axis2 也引入了相同的机制以非常方便的方式部署服务（和模块）。\n\
  \n让我们考虑一个场景：你有一个服务，包含多个第三方依赖项和多个属性文件。进一步假设你没有 J2EE-like 部署机制。那么你需要做的就是将所有依赖的 JAR\
  \ 文件和属性文件放入应用程序类路径中。如果有一台或两台服务器，这项工作就会翻倍，但如果你处于拥有数百个副本的集群环境中会怎样？在这种情况下，不可能去为每个副本都添加依赖的\
  \ JAR 文件和其他资源到类路径中。因此，当你拥有 J2EE-like 部署机制时，你无需担心此类问题。你只需将自包含包——在这种情况下是服务归档文件——放入副本中即可。这肯定减少了你的工作量，也避免了常见的人为错误。\n\
  \nAxis2 自包含包（或归档文件）的内部结构如图所示。Axis2 服务归档和模块归档具有非常相似的结构，只有细微差异。\n\n对于 Axis 服务归档，`descriptor.xml`\
  \ 文件变为 `services.xml`，而在另一种情况下，它变为 `module.xml`。\n\nAxis2 服务归档的文件扩展名为 .aar，模块为 .mar（服务归档或模块归档只是文件扩展名更改为\
  \ .aar 或 .mar 的 ZIP 文件）。\n\n![](img/e2fb05de168053e6227dab034eff9353_89_0.png)\n\
  \n如前所述，对于服务，`descriptor.xml` 文件将是 `services.xml`。因此，在服务归档文件中，你可以在 `META-INF` 目录下找到一个名为\
  \ `services.xml` 的文件。另一方面，对于模块归档，`META-INF` 将包含一个名为 `module.xml` 的文件。\n\n- 对于服务归档：`descriptor.xml\
  \ ---> services.xml`\n- 对于模块归档：`descriptor.xml ---> module.xml`\n\n## Hot deployment\
  \ and hot update\n\n可用性是企业级应用程序的一个大问题，在这种情况下，即使是一小段时间也非常宝贵。因此，重启服务器不是现实的选择，需要的是在不关闭系统的情况下更新和更改系统。这就是热部署和热更新发挥作用的地方。当你的应用程序具有这些功能时，你无需关闭系统即可更新系统。\n\
  \n尽管热部署和热更新的概念对技术范式来说并不是新术语，但它们是 Apache Web 服务栈 Axis 中的新功能。\n\n在 Axis2 中，热部署和热更新通过定时器不断监控仓库中的更改来工作。更具体地说，当用户更改给定文件的最后修改日期时，它会将其视为热更新。相比之下，当它发现新文件时则视为热部署。热部署的架构如下一节图所示。\n\
  \n## Hot deployment\n\n**Hot deployment** 是在系统运行时部署新服务的能力。例如，假设你有 *service1* 和 *service2*\
  \ 正在运行，并且你在不关闭系统的情况下部署了一个名为 *service3* 的新服务。系统随后也会使 *service3* 成为运行中的服务。这种特定场景称为热部署。\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_91_0.png)\n\n作为系统管理员，如果你不喜欢服务的热部署，可以通过更改\
  \ Axis2 全局配置文件 `axis2.xml` 轻松关闭它。更改全局配置只是更改一个参数，如下所示：\n\n```\n<parameter name=\"\
  hotdeployment\">false</parameter>\n```\n\n## Hot update\n\n热更新是在不关闭系统的情况下对现有 Web\
  \ 服务进行更改的能力。这是一个重要功能，在测试环境中是必需的。然而，不建议在实时系统中<|message|>使用热更新，因为热更新可能导致系统进入未知状态。此外，存在丢失该服务现有服务数据的可能性。为了防止这种情况，Axis2\
  \ 默认将热更新参数设置为 FALSE，如果你想要此功能，可以通过更改配置参数来实现，如下所示：\n\n```\n<parameter name=\"hotupdate\"\
  >true</parameter>\n```\n\n## Repository\n\nAxis2 仓库只是在文件系统中的一个具有特定结构的目录。另一方面，仓库可以位于本地或远程机器上。仓库的想法是为了以非常方便的方式支持基于归档的部署和热部署功能而引入的。\n\
  \n\n\n\n\n仓库目录由两个主要子目录组成，名为 `services` 和 `modules`。此外，你可能还有一个可选的子目录名为 `lib`。如果你想部署一个服务，你需要将服务归档文件放入\
  \ `services` 目录。类似地，如果你想部署一个模块，那么你需要将模块归档文件放入 `modules` 目录。`lib` 目录的想法是存储将要在服务和模块之间共享的第三方库。参考下一张截图以查看目录结构：\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_92_0.png)\n\n如果 `modules` 目录中的一个或多个模块需要共享某些资源，那么它们可以将这些资源添加到\
  \ `modules` 目录内的 `lib` 目录中。类似地，如果 `services` 目录中的服务想要共享一些通用资源，适当的位置是 `services`\
  \ 目录内的 `lib` 目录。\n\n## 处理程序（模块）部署方式的变更\n\n**服务扩展**的概念是 Apache Axis 范式中的一个新功能，但开发者在\
  \ Axis 1.x 中通过艰难的工作实现了相同的目标。因此，想法是扩展系统的核心功能或提供服务质量。在 Axis 1.x 的情况下，如果你需要扩展其核心功能，你需要编写一个处理程序（执行链中的最小单元），更改全局配置文件以添加处理程序，最后重启系统。\n\
  \n## 全局描述符或 axis2.xml\n\n如前所述，Axis2 中的配置可以使用 XML 描述符指定。这为扩展和更改 Axis2 提供了更大的灵活性。无需去更改代码以获得不同的配置。即使对于核心功能也是如此。如果你考虑\
  \ Axis2 的全局配置文件——axis2.xml——它包含了运行 Axis2 所需的所有最小配置。Axis2 的最小配置包括：\n\n- 配置参数\n- 传输发送器\n\
  - 传输监听器\n- 执行链和阶段\n- 默认调度器\n- 默认消息接收器\n- 默认客户端侧配置\n- 全局模块\n- WS-Policy（全局级别策略）\n\
  \n其中一些给定的术语对你来说可能不熟悉，但你现在无需担心。我们将在后续章节中讨论这些术语。Axis2 附带默认的 axis2.xml，它具有启动 Axis2\
  \ 所需的最小配置。然而，你可以根据自己的意愿更改它，并使用自己的 axis2.xml 启动 Axis2。这里需要记住的关键点是，如果你对 axis2.xml\
  \ 做了任何更改，你必须重启系统才能使这些更改生效。\n\n## 服务描述符（services.xml）\n\n正如我们在上一节讨论的，axis2.xml 指定了影响整个系统的配置。然而，services.xml\
  \ 用于配置特定服务或服务组。在下一节中，我们将查看在 Axis2 中部署服务的可用方式。基于归档的部署和基于目录的部署可以被认为是两种最常用的技术。在这两种情况下，对于一个服务要成为有效服务，需要有一个\
  \ services.xml 文件。服务描述符用于指定以下类型的配置（其中一些是可选的）：\n\n- 服务名称\n- 服务的目标名称空间\n- 会话作用域\n\
  - 暴露传输\n- 服务级别和操作级别参数\n- 消息接收器\n- 服务级别模块\n- 操作 – 暴露操作以及非暴露操作\n- Bean 映射\n- 对象提供者\n\
  - 服务和操作级别策略\n\n我们将在第 7 章《编写 Axis2 服务》中更深入地学习 services.xml 以及如何编写和创建服务。\n\n## 模块描述符或\
  \ module.xml\n\n现在显而易见，module.xml 用于配置 Axis2 模块；因此它也有不同类型的配置：\n\n- 处理程序及其阶段规则\n\
  - 模块参数\n- 端点\n- WS-Policy\n\n在第 8 章《编写 Axis2 模块》中，我们将更深入地学习 Axis2 模块以及如何编写它们。\n\n\
  ## 可用的部署选项\n\n在 Axis2 的初始阶段，它仅具有基于归档的部署。然而，后来它引入了许多便捷的部署选项。这使得服务作者的工作变得更容易。全部加起来，Axis2\
  \ 具有以下服务部署选项：\n\n- 基于归档的部署\n- 基于目录的部署\n- 使用归档文件以编程方式部署\n- 以编程方式将 Java 类制作成 Web 服务\n\
  - 纯 Java 对象（POJO）部署支持以及注解\n- 一行代码部署并启动 Axis2\n\n## 基于归档的部署\n\n在 Axis2 中部署服务的**基于归档的部署**是最常见且推荐的方法。在这里，你可以获得许多配置选项，与其他类型相比更灵活。在本章中，我们将通过示例讨论更多关于基于归档的部署。\n\
  \n## 基于目录的部署\n\n**基于目录的部署**几乎与基于归档的部署相同；唯一的区别是，与创建归档文件相比，你可以作为目录部署服务。目录的结构与归档文件相同。\n\
  \n## 以编程方式部署服务\n\n以归档文件以编程方式部署服务并不是真正用户的需求；而是模块作者的需求，其中某些模块需要在运行时部署 Web 服务以提供该特定模块的完整功能。\n\
  \n要以编程方式创建服务（`ServiceGroup`），你需要有表示服务归档文件的 file 对象以及指向 Axis2 运行时或 `ConfigurationContext`\
  \ 的指针。一旦你拥有这两个，我们就可以创建 Web 服务，如以下代码片段所示。这种方法的优点是你不需要将服务归档文件复制到仓库中，它仅在你的服务运行时可见。\n\
  \n```\n//Need to have a reference to ConfigurationContext\nConfigurationContext\
  \ configContext = getConfigurationContext();\nFile serviceArchiveFile = new File(\"\
  Location of the file\");\n//Now let's create AxisServiceGroup which contains the\
  \ service we want to have\nAxisServiceGroup serviceGroup = DeploymentEngine.loadServiceGroup(\n\
  \    serviceArchiveFile,\n    configContext);\n```\n\n一旦你创建了服务，下一步就是将服务添加到系统中。你可以按如下方式操作：\n\
  \n```\n//Getting a pointer to AxisConfiguration\nAxisConfiguration axiConfiguration\
  \ = configContext.\ngetAxisConfiguration();\n//Adding the created service\naxiConfiguration.addServiceGroup(serviceGroup);\n\
  ```\n\n现在，如果你尝试使用以下 URL 访问 add 方法，你应该得到与之前相同的结果：\n\n```\nhttp://localhost:6060/axis2/services/MyService/add?a=10&b=15\n\
  <ns:addResponse>\n    <return>25</return>\n</ns:addResponse>\n```\n\n## 总结\n\n在本章中，我们讨论了\
  \ Axis2 部署的工作方式、可用部署描述符的类型及其结构。此外，我们还讨论了 Axis2 中可用的不同类型的配置文件。在本章末尾，我们学习了最重要的内容，即\
  \ Axis2 中可用的部署选项。我们也通过示例测试了这些选项。下一步将是创建更多服务并看看会发生什么。\n\n在下一章中，我们将讨论更多关于 Axis2 信息模型的内容。在那里，我们将讨论静态和动态数据层次结构、层次结构中的不同实体、它们是如何创建的，以及哪些描述符负责不同的实体。\n\
  \n\n\n\n\n以下图表展示了 Axis2 中各种类型描述或元数据之间的关系：\n\n![](img/e2fb05de168053e6227dab034eff9353_104_0.png)\n\
  \n如我们所见，层级结构中最顶层的组件是 AxisConfiguration，它负责跟踪所有配置数据，无论是直接还是间接的。图中显示了三种主要类型的对象。首先，AxisModule\
  \ 源自名为 module.xml 的描述文件，因此当我们在 Axis2 中部署一个模块时，将会有一个新的 AxisModule 对象来跟踪该特定模块的配置数据。其次，中间的对象层级是在我们在\
  \ Axis2 中部署服务时创建的。最后，还有从 axis2.xml 直接读取的传输和其他数据。\n\n## AxisConfiguration\n\nAxisConfiguration\
  \ 是静态数据层级中最顶层的组件。尽管如此，需要注意的是，虽然我们称 AxisConfiguration 为静态层级，但这并不意味着它是不可变的。在某些情况下其内容会发生变化，但这些变化非常少见。整个\
  \ AxisConfiguration 对象实际上是从 axis2.xml、一组 module.xml 文件和一组 services.xml 文件中收集的数据。创建\
  \ AxisConfiguration 的方式也有很多种。可以利用本地文件系统、远程仓库，甚至数据库来创建 AxisConfiguration。我们将在第 15\
  \ 章《构建安全可靠的 Web 服务》中讨论这些选项。在本章中，重点将放在使用本地文件系统的默认 axis2.xml 文件创建 AxisConfiguration。以下图表展示了一个典型的\
  \ axis2.xml，其中包含启动 Axis2 服务器所需的最小配置数据（图表后会给出元素结构的详细解释）：\n\n```\nclass=\"o.a.a.t.h.SimpleHTTPServer\"\
  \n<parameter name=\"port\">6060</parameter>\n</transportReceiver>\n</axisconfig>\n\
  ```\n\n参数有一个作用域。与 axis2.xml 中的直接子元素一起定义的参数可以被系统中的任何描述符访问。如果参数是在 axis2.xml 的第一级子元素内部定义（例如\
  \ transportSender），那么该参数只能在该特定子元素内部访问，在本例中即该特定的 transportSender。\n\n在访问参数时，Axis2\
  \ 首先检查参数是否在当前描述中定义。如果没有，它会检查直接父级中是否存在该参数。如果找到，则返回该参数；否则，将检查父级的父级，以此类推。以这种方式，当请求参数时，它会在层级中进行搜索。\n\
  \n## MessageReceiver\n\n在第 4 章《执行链》中，我们更详细地讨论了 MessageReceiver 及其用法。我们将为服务使用的所有消息接收器都应指定在\
  \ axis2.xml 中。你可以根据需要在 services.xml 中使用任意数量的消息接收器并使用合适的接收器。在 axis2.xml 中指定消息接收器的方式如下所示：\n\
  \n```\n<messageReceivers>\n<messageReceiver mep=\"MEP\"\nclass=\"o.a.a.r.RawXMLINOnlyMessageReceiver\"\
  />\n</messageReceivers>\n```\n\n注意：在前面的 XML 元素中，MEP 代表 MessageReceiver 可以处理的 Message\
  \ Exchange Patterns。Class 属性用于指定 MR 的实际实现类。你可以注册任意数量的消息接收器并附带唯一的 MEP。例如，WSDL 2.0\
  \ 允许 8 种类型的 MEP。\n\n### MessageFormatters and MessageBuilders\n\n在 HTTP 中，我们使用 content-type\
  \ 头来指定消息体中的数据类型。此外，根据内容类型，消息的线格式也会有所不同，例如 XML、JSON、base64 等。Axis2 也支持多种不同的消息类型，因此需要将消息序列化并反序列化为正确的格式。为此，Axis2\
  \ 引入了 `MessageFormatters` 和 `MessageBuilders`；前者用于将消息序列化为线格式，后者用于从传入的消息流构建 SOAP\
  \ 消息。我们已经知道，Axis2 中任何类型的消息都使用 Axiom 表示，而在序列化消息时，需要根据内容类型进行格式化。`MessageFormatters`\
  \ 就是为我们完成这项工作。我们可以在 axis2.xml 中与内容类型一起指定 `MessageFormatters`。另一方面，进入 Axis2 的消息可能是也可能不是\
  \ XML。然而，为了让它通过 Axis2，需要创建 Axiom 元素。因此，`MessageBuilders` 被用来根据内容类型构建消息。\n\n这两种类型的描述可以被视为复杂类型，并且用户不太可能更改它们，因此用户可以很满意地使用默认的\
  \ axis2.xml，因为它已经配置了所有常用的内容类型以及对应的构建器和格式化器。axis2.xml 中 XML 元素的结构如下所示：\n\n```xml\n\
  <messageFormatters>\n    <messageFormatter contentType=\"application/x-www-form-urlencoded\"\
  \n    class=\"o.a.a.t.h.XFormURLEncodedFormatter\"/>\n</messageFormatters>\n\n<messageBuilders>\n\
  \    <messageBuilder contentType=\"application/xml\"\n    class=\"o.a.a.b.ApplicationXMLBuilder\"\
  />\n</messageBuilders>\n```\n\n如图所示，你可以使用内容类型和实现类来指定消息构建器和格式化器。在运行时，Axis2 会选择合适的组件来序列化和反序列化消息。\n\
  \n### TransportReceiver and TransportSender\n\nAxis2 与传输无关，因此可以使用多种传输与 Axis2 通信。例如，Axis2\
  \ 内置支持 HTTP、TCP、SMTP 和 JMS。所有这些都可以通过 axis2.xml 进行配置。\n\n```\n</phaseOrder>\n<phaseOrder\
  \ type=\"OutFlow\">\n    <phase name=\"OperationOutPhase\"/>\n    ........................................................\n\
  </phaseOrder>\n<phaseOrder type=\"InFaultFlow\">\n    <phase name=\"PreDispatch\"\
  />\n    ........................................................\n</phaseOrder>\n\
  <phaseOrder type=\"OutFaultFlow\">\n    <phase name=\"OperationOutFaultPhase\"/>\n\
  \    ........................................................\n</phaseOrder>\n```\n\
  \n到目前为止，我们已经讨论了来自 axis2.xml 的不同类型的配置数据。现在让我们来看其他类型的描述。\n\n## AxisModule\n\n简单来说，AxisModule\
  \ 是 module.xml 的运行时表示。因此，module.xml 中找到的所有配置数据都存在于 AxisModule 中。一个典型的模块配置文件或 module.xml\
  \ 包含以下数据：\n\n- 模块名称\n- 模块描述\n- 处理器和阶段规则\n- 端点和操作\n- WS-Policy\n- 参数\n\n在部署时，AxisModule\
  \ 使用 module.xml 中的数据进行填充。在运行时，可以通过同一个 AxisModule 检索此数据的任何部分。一旦数据填充完成且模块完成，AxisModule\
  \ 的父描述符就成为 AxisConfiguration。\n\n## AxisMessage\n\nAxisMessage 是服务层级的叶子元素，且 AxisMessage\
  \ 的直接父级是 AxisOperation。如我们所讨论的，AxisService 可以有任意数量的 AxisOperation。然而，AxisOperation\
  \ 不能有任意数量的 AxisMessage 元素。操作中 AxisMessages 的数量由消息交换模式决定。例如，如果操作是 in-out，则其中将只有两个\
  \ AxisMessage 元素，一个表示入消息配置，另一个表示出消息配置。AxisMessage 具有以下数据集合：\n\n- 参数\n- WS-Policy\n\
  - 消息标签\n- 对应模式元素的 Element QName（可选）\n\n> 注意：消息元素是可选元素，因此我们可以有零个消息元素的操作元素。只有在要覆盖消息时，例如添加新策略，才需要添加消息元素。\n\
  \n现在，我们对 Axis2 静态数据及其更改方式有了良好的理解，因此下一步是学习动态数据层级以及静态数据与运行时数据之间的关系。以下图表展示了描述层级与上下文或运行时数据层级之间的关系。\n\
  \n## Axis2 contexts\n\nAxis2 上下文层级是 Axis2 的运行时数据表示。运行时数据只有在 Axis2 接收到消息时才会出现（与描述不同）。运行时数据用于在多次调用之间或一次调用中的多个处理器之间共享数据。当我们讨论描述层级时，我们谈到参数如何作为主要配置机制。在上下文中，主要的配置或数据共享机制是使用\
  \ Properties。与参数不同，我们不需要在任何地方定义属性，因为我们可以即时创建并使用它们。属性以名称-值对的形式存储在上下文层级中。因此，如果我们向上下文添加一个属性，则该属性可以被其任何子上下文访问和覆盖。\n\
  \n以下图表展示了 Axis2 中静态数据与运行时数据之间的关系：\n\n\n\n![](img/e2fb05de168053e6227dab034eff9353_113_0.png)\n\
  \n如你在左侧所见，层级结构中最顶层的组件是 ConfigurationContext。ConfigurationContext 与其他上下文相比，唯一的区别在于，它是系统中在接收消息之前就已存在的唯一上下文。ConfigurationContext\
  \ 持有对 AxisConfiguration 的引用，要创建 ConfigurationContext，必须有一个可用的 AxisConfiguration。\n\
  \n### ConfigurationContext\n\nConfigurationContext 是整个系统的运行时表示。要启动 Axis2，你需要有一个配置上下文。配置上下文的生命周期就是系统的生命周期，因此如果我们存储一个状态（一个属性），它将永远保留在那里（也就是说，直到系统关闭）。ConfigurationContext\
  \ 不仅是所有其他上下文的父级，还可以被视为整个 Axis2 系统的发起者元素。\n\n### ServiceGroupContext\n\n当 Axis2 收到消息时，会创建一个\
  \ ServiceGroupContext 来存储和共享数据。要创建 ServiceGroupContext，需要有一个可用的 AxisServiceGroup\
  \ 对象。一个 AxisServiceGroup 可能有一个或多个 ServiceGroupContext。不过，与该上下文关联的 AxisServiceGroup\
  \ 只有一个。ServiceGroupContext 的生命周期取决于服务作用域（例如，应用、传输、SOAP 会话和请求）。如果服务作用域是应用，那么其生命周期将与系统生命周期相同。然而，如果服务作用域是“请求”，那么每次调用都会创建一个\
  \ ServiceGroupContext。如果我们希望在运行时在同一个服务组中的多个服务之间共享数据，那么 ServiceGroupContext 提供了实现这一目标的手段。\n\
  \n### ServiceContext\n\nServiceContext 表示给定服务的运行时数据。要创建 ServiceContext，我们需要有可用的\
  \ ServiceGroupContext 对象和 AxisService 对象。ServiceContext 的生命周期取决于服务作用域。如果我们希望在同一个服务的多次调用之间共享数据，那么可以使用\
  \ ServiceContext 作为存储这些数据的占位符。\n\n例如，假设我们有一个包含三个操作的服务——login、doSomething 和 logout。同时，假设我们需要在这三个操作之间共享数据。这里，可以使用\
  \ ServiceContext 来实现这些目标。一个 ServiceGroupContext 中 ServiceContext 的数量取决于对应 AxisServiceGroup\
  \ 中 AxisService 的数量。\n\n### OperationContext\n\nOperationContext 表示一个消息交换模式（MEP）的生命周期。通常情况下，操作上下文的生命周期比服务上下文的生命周期短。我们可以使用\
  \ OperationContext 在 MEP 的消息之间共享数据。例如，如果我们希望在请求和响应之间共享数据，那么可以使用 OperationContext\
  \ 来实现。ServiceContext 中 OperationContext 上下文的数目与 AxisService 中 AxisOperation 操作的数目无关；它只取决于调用次数，例如，每次调用对应一个\
  \ OperationContext。\n"
- "# 7 编写 Axis2 服务\n\n在前几章中，我们介绍并讨论了各种 Axis2 概念，并强调了它们的重要性。从本章开始，我们将讨论如何在现实世界中使用这些概念。每一章都为你提供了一套全面的示例，帮助你清楚地理解这些概念。在你自己的环境中重复这些示例，将有助于你从每一章中获得最大收获。Axis2\
  \ 为其 Web 服务引入了若干新特性。例如，注解支持、会话支持，以及在信息层次结构、POJO 和基于 Spring 的 Web 服务中存储会话感知数据的方法。\n\
  \n正如我们在前面章节中已经讨论过的，任何 Web 服务框架都有两个主要方面：首先，为 Web 服务提供托管环境；其次，为访问远程服务提供调用框架。托管服务包括实现服务、部署服务和管理服务生命周期。在第\
  \ 5 章中，我们简要介绍了若干不同的服务部署方式。在本章中，我们将讨论如何实现服务并将其部署到 Axis2 Web 服务托管环境中。此外，本章将涵盖业界创建\
  \ Web 服务常用的两种基本方法。学完本章后，你将深入理解如何创建 Web 服务并在 Axis2 中部署它。在第 9 章“客户端 API”中，我们将讨论如何调用部署在\
  \ Axis2 或其他地方的 Web 服务。\n\n- 现在打开浏览器，输入以下 URL，查看结果。这里需要注意的是，根据你在 Tomcat 中指定的端口，你可能需要修改\
  \ 8080。\n\n```\nhttp://localhost:8080/axis2/services/HelloWorld/sayHello?name=Axis2\n\
  ```\n\n现在，你应该能在浏览器中看到 Hello Axis2。你可以通过更改 name 参数来进行测试，你会发现该服务会对输入的任何名称回复 Hello。\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_121_0.png)\n\n这一切意味着你已成功部署了服务；更具体地说，你已经以\
  \ REST（表述性状态转移）方式调用了该服务。\n\n如前所述，前面的方法可以被视为在 Axis2 中编写和部署服务最简单的方法之一。虽然我们选择的示例非常简单，但这并不是说你就不能以这种方式编写非常复杂的服务。然而，唯一的限制是，你的服务类不能放在默认包之外的任何包中。如果你希望服务类位于自己的包结构中，则必须遵循一条略有不同的路径，我们将在本章稍后部分讨论。\n\
  \n考虑到 Axis2 提供的 POJO 支持，你应该知道，你可以部署带注解的 Java 类和不带注解（普通）的 Java 类。这里需要提及的是，Axis2 支持\
  \ JSR 181 注解规范。如果你不熟悉 Java 注解，那么可以这样说：注解是在使用 POJO 时提供元数据的一种机制。一个带有基本 JSR 181 注解的简单\
  \ Java 类可以写成如下形式。需要注意的是，使用这一特性可以提供大量数据并创建复杂的应用程序。\n\n```\nimport javax.jws.WebService;\n\
  import javax.jws.WebMethod;\nimport javax.jws.WebParam;\n\n@WebService (targetNamespace\
  \ = \"http://sample.org/helloWorld\", name = \"HelloWorld\")\npublic class HelloWorld\
  \ {\n@WebMethod (action = \"urn:sayHello\" ,operationName = \"sayHello\")\npublic\
  \ String sayHello(@WebParam (partName = \"name\") String name)\n{\n    return \"\
  Hello \" + name;\n}\n}\n```\n\n注解仅在 JDK 1.5 或更高版本中受支持。此外，此时你无需担心缺乏注解使用经验。你这里的主要目标应该是学习\
  \ Axis2 概念，之后，使用注解就会非常简单。\n\n### 带包的 POJO\n\n正如我们在上一节中讨论的，当以单个 .class 文件部署 POJO\
  \ 时，你不能将 Java 类声明在自定义包中。但如果你确实需要这样做，或者如果你的 POJO 的运行需要多个类，而你又不能再使用单个类的 POJO 方法，那么你需要采用我们接下来要讨论的方法。\n\
  \n现在让我们考虑如下类：\n\n```\npackage book.sample;\nimport javax.jws.WebService;\n@WebService\n\
  public class AddressService {\n    public Address getAddress(String name) {\n  \
  \      Address address = new Address();\n        address.setStreet(\"Street\");\n\
  \        address.setNumber(\"Number 15\");\n        return address;\n    }\n}\n\
  ```\n\n你可以看到，我们为 AddressService 类添加了注解。对应的 Address 类如下所示：\n\n```\npackage book.sample;\n\
  public class Address {\n    private String street;\n    private String number;\n\
  \    public String getStreet() {\n        return street;\n    }\n}\n```\n\n\n\n\n\
  ## 在服务级别为整个服务指定消息接收器\n\n想象这样一个场景：你需要在 services.xml 文件中发布大量操作。在这种情况下，为每个操作都添加消息接收器似乎很令人头疼。然而，如果你可以为整个服务指定一个消息接收器，那么服务编写者的工作就会更轻松，同时也会简化\
  \ services.xml。\n\nAxis2 内置支持 W.S.D.L. 2.0 定义的全部八种消息交换模式（MEP）。在 services.xml 中，你可以指定一种\
  \ MEP 及其对应的消息接收器，然后根据操作所属的 MEP，Axis2 会自动选取消息接收器并将其设置到该操作上。\n\n在 operation 标签内，你可以添加一个属性来指定操作的\
  \ MEP，如下所示：\n\n```\n<operation name=\"sayHello\" mep=\"http://www.w3.org/2004/08/wsdl/in-out\"\
  \ />\n```\n\n以下示例展示了为给定服务定义服务级消息接收器的方法：\n\n```\n<service>\n    <Description>\n \
  \       This is my first service, which will say Hello.\n    </Description>\n  \
  \  <messageReceivers>\n        <messageReceiver mep=\"http://www.w3.org/2006/01/wsdl/in-only\"\
  \ class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"/>\n        <messageReceiver\
  \ mep=\"http://www.w3.org/2006/01/wsdl/in-out\" class=\"org.apache.axis2.rpc.receivers.RPCMessageReceiver\"\
  />\n    </messageReceivers>\n    <parameter name=\"ServiceClass\" locked=\"false\"\
  >HelloWorld</parameter>\n    <operation name=\"sayHello\" mep=\"http://www.w3.org/2004/08/wsdl/in-out\"\
  \ />\n</service>\n```\n\n根据 `services.xml`，`org.apache.axis2.rpc.RPCMessageReceiver`\
  \ 是服务中所有 in-out 操作（任何属于 in-out MEP 的操作都会将该消息接收器分配为其消息接收器）的消息接收器。而对于 in-only MEP，服务级消息接收器是\
  \ `RPCInOnlyMessageReceiver`。如果你使用新的 `services.xml` 重新部署 `HelloWorld` 服务，当你再次调用该服务时，肯定会得到相同的结果。\n\
  \n## 指定服务级消息接收器并通过操作覆盖它们\n\n有时，服务作者可能希望为某些操作使用不同的消息接收器，即使他已经定义了服务级消息接收器。要让某个操作覆盖服务级消息接收器，只需向要分配不同消息接收器的操作添加一个消息接收器元素即可。下面展示了一个采用这种技术的\
  \ `services.xml` 示例：\n\n```\n<service>\n    <Description>\n        This is my first\
  \ service, which will say Hello.\n    </Description>\n    <messageReceivers>\n \
  \       <messageReceiver mep=\"http://www.w3.org/2006/01/wsdl/in-only\" class=\"\
  org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"/>\n        <messageReceiver\
  \ mep=\"http://www.w3.org/2006/01/wsdl/in-out\" class=\"org.apache.axis2.rpc.receivers.RPCMessageReceiver\"\
  />\n    </messageReceivers>\n    <parameter name=\"ServiceClass\" locked=\"false\"\
  >HelloWorld</parameter>\n    <operation name=\"sayHello\">\n        <messageReceiver\
  \ class=\"org.apache.axis2.receivers.RawXMLINOutMessageReceiver\"/>\n    </operation>\n\
  </service>\n```\n\n操作 `sayHello` 使用了与其服务级消息接收器不同的消息接收器。\n\n无论你是否在 `services.xml`\
  \ 中指定它们，服务实现类中的所有公共方法都会暴露。Axis2 通过检查操作对应的 Java 方法来计算其 MEP。如果方法的返回类型是 void，那么 MEP\
  \ 将为 in-only，否则将为 in-out。根据 MEP，将设置正确的消息接收器。\n\n## 添加第三方资源\n\n在很多情况下，你希望在 Web 服务中使用第三方库。此外，到目前为止，你应该知道\
  \ Axis2 中的每个服务和模块都是隔离的。因此，每个服务都有自己独立的类加载器。当你需要将第三方库包含到 Web 服务中时，Axis2 提供了一种机制来实现这一点。只需在服务归档文件中创建一个名为\
  \ lib 的文件夹，并将库或资源放入其中即可。\n\n想象你有一个服务，需要使用名为 foo.jar 和 bar.jar 的库，以及名为 xyz.properties\
  \ 的资源。那么你的服务归档文件应类似于以下截图：\n\n![](img/e2fb05de168053e6227dab034eff9353_130_0.png)\n\
  \n## 服务 WSDL 和 Schema\n\n当你开始编写相对更复杂的应用程序时，你会觉得需要在服务归档文件中包含 WSDL 文档和 Schema 文件。对于企业级应用程序，你不能让客户端依赖自动生成的\
  \ WSDL 文档。为了拥有一个可靠且定义明确的 WSDL 文档，有必要将服务与 WSDL 文档文件以及相应的 XML Schema 文件一起部署。因此，当你想要添加\
  \ WSDL 文档文件时，应该将其放在服务归档的 META-INF 目录中。这样做时你唯一需要记住的是，services.xml 中给出的服务名称与 WSDL\
  \ 文档中定义的服务名称应该相同。包含 WSDL 文件的服务归档文件将具有以下结构：\n\n## 填充服务骨架\n\nAxis2 会生成一个服务骨架类，其中的方法可以抛出\
  \ UnsupportedOperation。我们所需要做的就是根据你想要提供的业务逻辑来实现这个服务骨架类。\n\n## 运行 Ant 构建文件\n\n完成服务骨架后，下一步是使用修改后的生成代码创建服务归档文件。为了让这项任务更简单，Axis2\
  \ 会为你生成一个 Ant 构建文件来创建服务归档文件。你只需打开命令行控制台，进入你输出生成代码的文件夹，然后在控制台中输入 ant build 来运行 Ant\
  \ 构建文件。服务归档文件将随即为你创建。\n\n在本章中，我们只是粗略地了解了契约优先方法。在本书后面的内容中，你将更详细地学习代码生成和数据绑定。我们还将介绍一些示例以及可用的工具。\n\
  \n## 小结\n\n在 Axis2 中，将 Java 类转换为 Web 服务非常简单。一旦你知道如何正确编写 `services.xml` 文件，你就可以创建更复杂的应用程序，而不仅仅是\
  \ POJO。部署服务只需创建服务归档文件并将其放入 Axis2 仓库中的 services 目录即可。WSDL 优先方法是创建服务最简单的方法，因为 Axis2\
  \ 内置了对代码生成的支持，并且它提供了一套工具来让这项工作更加轻松。\n\n在本章中，我们讨论了如何将简单的类文件转换为 Web 服务，以及如何以 REST\
  \ 方式访问该服务。我们讨论了当服务因添加包名而变得稍复杂时会发生什么。我们还讨论了如何使用基于归档的部署机制。最后，我们简要讨论了契约优先方法。\n\n在下一章中，我们将讨论如何扩展\
  \ Axis2 的核心功能，并使用 Axis2 模块提供额外的服务质量。\n"
- "# 8 编写 Axis2 模块\n\n## 编写 Axis2 模块\n\nWeb 服务在行业中越来越受欢迎，并已成为应用程序集成的主要推动力之一。此外，由于使用\
  \ Web 服务的灵活性和优势，每个人都在尝试为其应用程序提供 Web 服务支持。因此，Web 服务框架需要支持新的、更加定制化的需求。正如我们在前面章节中已经讨论过的，Web\
  \ 服务框架的主要目标之一是将传入的消息交付给目标服务。然而，仅仅将消息传递给服务是不够的；当今的应用程序还需要可靠性、安全性、事务性以及其他服务质量。\n\n\
  由于 Web 服务的普及，标准机构正在制定新的 Web 服务标准，而如果 Web 服务框架不够灵活，就很难支持这些新标准。从 Axis2 诞生之初，灵活性和可扩展性就是两个主要的设计考虑因素。Axis2\
  \ 模块的理念是在不修改核心系统的情况下扩展系统的核心功能。例如，Axis2 将可靠性和安全性作为两个独立的模块来支持，而核心引擎完全独立于这两个服务质量模块。\n\
  \n在本章中，我们将讨论 Axis2 模块的强大功能，以及如何使用它们扩展 Axis2 以支持你自己的需求。具体来说，我们将讨论以下内容：\n\n- Axis2\
  \ 模块的简要历史\n- 介绍模块概念\n- 模块的结构\n- 模块配置文件（`module.xml`）\n- 可选的模块实现类\n- 编写 `module.xml`\
  \ 文件的步骤\n- 部署和启用模块\n- WS-Policy 及其在模块中使用的简要概述\n\n\n\n\n## 处理器与阶段规则\n\n正如我们讨论过的，模块是处理器的集合，因此一个模块可以包含一个或多个处理器。无论模块中有多少个处理器，`module.xml`\
  \ 都提供了一种便捷的方式来指定它们。最重要的是，`module.xml` 可用于提供足够的配置选项，将处理器添加到系统中，并指定模块作者希望处理器在何处运行。在第4章“执行链”中，我们了解了阶段规则（phase\
  \ rules）作为一种机制，可以让 Axis2 将处理器放入执行链中的特定位置，因此现在是时候通过一个示例来深入了解它们了。\n\n在编写阶段规则以及在 `module.xml`\
  \ 中指定处理器之前，让我们先看看如何编写处理器。在 Axis2 中有两种编写处理器的方式：\n\n- 实现 `org.apache.axis2.engine.Handler`\
  \ 接口\n- 继承 `org.apache.axis2.handlers.AbstractHandler` 抽象类\n\n在本章中，我们将编写一个简单的应用程序，以便更好地理解模块。此外，为了让示例应用程序更简单，我们将忽略\
  \ Handler API 的一些复杂性。我们将采用继承 `AbstractHandler` 的方式。当我们继承这个抽象类时，只需要实现一个名为 `invoke`\
  \ 的方法即可。下面的示例代码将演示如何实现 `invoke` 方法：\n\n```\npublic class IncomingCounterHandler\
  \ extends AbstractHandler implements CounterConstants {\npublic InvocationResponse\
  \ invoke(MessageContext messageContext) throws AxisFault {\n    //get the counter\
  \ property from the configuration context\n    ConfigurationContext configurationContext\
  \ = messageContext.getConfigurationContext();\n    Integer count = (Integer) configurationContext.getProperty(INCOMING_MESSAGE_COUNT_KEY);\n\
  \    //increment the counter\n    count = Integer.valueOf(count.intValue() + 1);\n\
  \    //set the new count back to the configuration context\n    configurationContext.setProperty(INCOMING_MESSAGE_COUNT_KEY,\
  \ count);\n    //print it out\n    System.out.println(\"The incoming message count\
  \ is now \" + count);\n    return InvocationResponse.CONTINUE;\n}\n}\n```\n\n```\n\
  AxisModule axisModule) throws AxisFault {\n    //initialize our counters\n    System.out.println(\"\
  inside the init : module\");\n    initCounter(configurationContext, INCOMING_MESSAGE_COUNT_KEY);\n\
  \    initCounter(configurationContext, OUTGOING_MESSAGE_COUNT_KEY);\n}\n\nprivate\
  \ void initCounter(ConfigurationContext configurationContext,\n                \
  \         String key) {\n    Integer count = (Integer) configurationContext.getProperty(key);\n\
