  \ 客户端\n\n当你想在 XML 消息级别工作或在 JAX-WS 级别工作而无需任何已生成的工件时，你将使用此客户端。Dispatch 客户端 API 要求应用程序客户端以\
  \ XML 的形式构造消息或有效负载，这需要对消息或消息有效负载有详细的了解。Dispatch 客户端支持以下类型的对象：\n\n- `javax.xml.transform.Source`：你将使用\
  \ Source 对象使客户端能够直接使用 XML API。你可以在 SOAP 或 HTTP 绑定中使用 Source 对象。\n- **JAXB 对象**：你将使用\
  \ JAXB 对象，以便客户端可以使用从 XML 模式生成的 JAXB 对象来创建和操作 JAX-WS 应用程序中的 XML。JAXB 对象只能与 SOAP 或\
  \ HTTP 绑定一起使用。\n- `javax.xml.soap.SOAPMessage`：你将使用 SOAPMessage 对象，以便客户端可以处理 SOAP\
  \ 消息。你只能将 SOAPMessage 对象与 SOAP 绑定一起使用。\n- `javax.activation.DataSource`：你将使用 DataSource\
  \ 对象，以便客户端可以处理多用途互联网邮件扩展 MIME 消息。DataSource 只能与 HTTP 绑定一起使用。\n\n以下示例演示了如何使用 JAX-WS\
  \ Dispatch 客户端 API。此客户端与 HelloService 通信，其中包含单个操作，即 greet。该选项接收单个字符串参数。请特别注意突出显示的代码。正如你所见，由于使用了\
  \ Message 服务模式，客户端必须构造 SOAP 信封、头、主体和主体内容：\n\n```java\npackage org.apache.jaxwsclient;\n\
  \nimport javax.xml.namespace.QName;\nimport javax.xml.soap.*;\nimport javax.xml.ws.Dispatch;\n\
  import javax.xml.ws.Service;\nimport javax.xml.ws.soap.SOAPBinding;\npublic class\
  \ DispatchClient {\n    public static void main(String[] args) {\n        try {\n\
  \            String endpointUrl = \"http://localhost:8080/axis2/services/HelloService\"\
  ;\n            QName serviceName = new QName(\"http://apache.org/types\", \"HelloService\"\
  );\n            QName portName = new QName(\"http://apache.org/types\", \"HelloServiceHttpSoap11Endpoint\"\
  );\n\n            /** Create a service and add at least one port to it. **/\n  \
  \          Service service = Service.create(serviceName);\n            service.addPort(portName,\
  \ SOAPBinding.SOAP11HTTP_BINDING, endpointUrl);\n\n            /** Create a Dispatch\
  \ instance from a service.**/\n            Dispatch<SOAPMessage> dispatch = service.createDispatch(portName,\
  \ SOAPMessage.class, Service.Mode.MESSAGE);\n\n            /** Create SOAPMessage\
  \ request. **/\n            // compose a request message\n            MessageFactory\
  \ mf = MessageFactory.newInstance(SOAPConstants.SOAP_1_1_PROTOCOL);\n\n        \
  \    // Create a message. This example works with the SOAPPART.\n            SOAPMessage\
  \ request = mf.createMessage();\n            SOAPPart part = request.getSOAPPart();\n\
  \n            // Obtain the SOAPEnvelope and header and body elements.\n       \
  \     SOAPEnvelope env = part.getEnvelope();\n            SOAPHeader header = env.getHeader();\n\
  \            SOAPBody body = env.getBody();\n\n            // Construct the message\
  \ payload.\n            SOAPElement operation = body.addChildElement(\"greet\",\
  \ \"ns2\", \"http://apache.org/types\");\n            SOAPElement age = operation.addChildElement(\"\
  name\");\n            age.addTextNode(\"Packt\");\n            request.saveChanges();\n\
  \n            /** Invoke the service endpoint. **/\n            SOAPMessage response\
  \ = dispatch.invoke(request);\n            System.out.println(response.getSOAPBody().getFirstChild().toString());\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
  \    }\n}\n```\n\n你需要 JDK 1.5 或更高版本来编译上述类。\n\n\n\n\n\n## 动态代理客户端\n\nJAX-WS 的静态客户端编程模型称为动态代理客户端。动态代理客户端基于提供的服务端点接口调用\
  \ Web 服务。在创建代理后，客户端应用程序可以像标准实现一样在代理上调用方法。对于使用动态代理编程模型的 JAX-WS Web 服务客户端，请使用 JAX-WS\
  \ 工具 wsimport 处理 WSDL 文件并生成用于创建 Web 服务客户端的可移植 Java 工件。\n\n在下面的示例中，org.apache.types.HelloService\
  \ 和 org.apache.types.HelloServicePortType 类是由随 JDK 一起提供的 wsimport 工具生成的。该示例展示了如何在\
  \ ProxyClient 类中使用生成的类。正如你所见，与 DispatchClient 不同，代码行数要少得多，但你对底层操作的控制也更少：\n\n```\n\
  package org.apache.jaxwsclient;\n\nimport org.apache.types.HelloService;\nimport\
  \ org.apache.types.HelloServicePortType;\n\npublic class ProxyClient {\n    public\
  \ static void main(String[] args) {\n        HelloService service = new HelloService();\n\
  \        HelloServicePortType portType = service.getHelloServiceHttpSoap11Endpoint();\n\
  \        System.out.println(portType.greet(\"Packt\"));\n    }\n}\n```\n\n## 使用\
  \ JAX-WS 服务的 MTOM\n\n消息传输优化机制（MTOM）是一种高效地向 Web 服务发送和接收二进制数据的方法。要在 JAX-WS 服务中使用 MTOM，首先必须使用\
  \ BindingType 注解将绑定类型设置为 SOAP11 MTOM。你将使用 javax.activation.DataHandler 在参数或返回类型中表示二进制数据。让我们看一个启用了\
  \ MTOM 的 JAX-WS 服务示例。uploadFile Web 服务操作展示了如何将二进制数据用作操作的输入参数。下面的 getBinaryTestData\
  \ 操作说明了如何将二进制数据用作操作的输出：\n\n高亮字段显示 BindingType 被设置为 SOAP11HTTP_MTOM_BINDING 和 DataHandler。Java\
  \ bean 类型类也可以包含 DataHandler。你需要 JDK 1.5 或更高版本来编译上述类。\n\n## JAX-WS 服务的异步调用\n\nJAX-WS\
  \ 支持从客户端异步调用服务。JAX-WS 在异步调用 Web 服务时为回调模型和轮询模型提供支持。回调模型和轮询模型均由 Dispatch 客户端和代理客户端支持。\n\
  \nWeb 服务的异步调用会向服务端点发送请求，然后立即将控制权返回给客户端，而无需等待响应从服务返回。JAX-WS 异步 Web 服务客户端使用回调方法或轮询方法使用\
  \ Web 服务。\n\n### 轮询模型\n\n在轮询模型中，客户端可以发出请求并接收响应对象，通过轮询来确定服务器是否已响应。当服务器响应时，会检索实际响应。响应对象在调用\
  \ get 方法时会返回响应内容。客户端从 invokeAsync 方法接收到 javax.xml.ws.Response 类型的对象。该 Response 对象用于监控向服务器的请求状态，确定操作是否已完成，并检索响应结果。\n\
  \n### 回调模型\n\n在回调模型中，客户端提供回调处理程序来接收和处理入站响应对象。当结果可用时，处理程序的 handleResponse 方法会被调用。为了实现使用回调模型的异步调用，客户端提供\
  \ AsyncHandler 实例来接收和处理入站响应对象。客户端回调处理程序实现 javax.xml.ws.AsyncHandler 接口，该接口包含在从服务器接收到异步响应时执行的应用程序代码。javax.xml.ws.AsyncHandler\
  \ 接口包含 handleResponse(javax.xml.ws.Response) 方法，该方法在运行时接收并处理来自服务器的异步响应后被调用。响应以 javax.xml.ws.Response\
  \ 对象的形式传递给回调处理程序。响应对象在调用 get() 方法时会返回响应内容。\n\n## 编写高可用可集群的 Web 服务\n\n通常，你无需做任何额外工作即可使\
  \ Web 服务可集群。一般来说，任何常规 Web 服务都是可集群的。对于有状态的 Web 服务，你需要将 Java 可序列化可复制属性存储在 Axis2 ConfigurationContext、ServiceGroupContext\
  \ 或 ServiceContext 中。请注意，你在其他地方维护的有状态变量将不会被复制。如果正确配置了 Axis2 集群以进行状态复制，则 Axis2 基础设施将为你复制这些属性。在下一节中，你将能够查看为状态复制配置集群的详细信息。让我们看一个部署在\
  \ soapsession 范围内的简单有状态 Axis2 Web 服务：\n\n```\npublic class ClusterableService {\n\
  \    private static final String VALUE = \"value\";\n\n    public void setValue(String\
  \ value) {\n        ServiceContext serviceContext = MessageContext.getCurrentMessageContext().getServiceContext();\n\
  \        serviceContext.setProperty(VALUE, value);\n    }\n\n    public String getValue()\
  \ {\n        ServiceContext serviceContext = MessageContext.getCurrentMessageContext().getServiceContext();\n\
  \        return (String) serviceContext.getProperty(VALUE);\n    }\n}\n```\n\n你可以在集群中的两个\
  \ Axis2 节点上部署此服务。你可以编写一个客户端，在第一个节点上调用 setValue 操作，然后在第二个节点上调用 getValue 操作。你将能够看到你在第一个节点上设置的值可以从第二个节点检索到。发生的情况是，当你在第一个节点上调用\
  \ setValue 操作时，值会被设置在相应的 ServiceContext 中，并复制到第二个节点。因此，当你在第二个节点上调用 getValue 时，复制的值已正确设置在相应的\
  \ ServiceContext 中。正如你可能已经注意到的那样，你无需做任何额外工作即可使 Web 服务可集群。Axis2 会透明地进行状态复制。然而，如果你需要控制状态复制，Axis2\
  \ 也提供了该选项。让我们重写同一个 Web 服务，同时控制状态复制：\n\n```\npublic class ClusterableService {\n\
  \    private static final String VALUE = \"value\";\n    public void setValue(String\
  \ value) {\n```\n\n![](img/e2fb05de168053e6227dab034eff9353_221_0.png)\n\n## 增加水平可扩展性\n\
  \n如图所示，为了实现水平可扩展性，Axis2 集群将由负载均衡器前端（下图中用 LB 表示）。负载均衡器将根据某种负载均衡算法在 Axis2 集群中分配负载。轮询负载均衡算法就是这样一种流行且简单的算法，当所有节点上的硬件和软件都相同的情况下效果很好。通常，水平可扩展的集群将保持其响应时间，并在负载增加时不会降低性能。在这种设置下吞吐量也会随着负载的增加而增加。通常，集群中的节点数量是预期最大峰值负载的函数。在这种集群中，所有节点都是活动的。\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_221_1.png)\n\n### AvoidInitiation\n\n\
  此参数指示在构建 `AxisConfiguration` 时集群是否需要自动初始化。如果设置为 true，则不会在该阶段进行初始化，而必须由其他方显式初始化集群。在\
  \ Axis2 被第三方嵌入的情况下，他们可能需要控制集群初始化过程。因此提供了此参数。例如，我们可以将此参数设置为 true，以便在服务器完全启动并且相关传输已初始化后初始化集群。\n\
  \n### membershipScheme\n\n在此设置中使用成员关系方案。目前支持的唯一值是 multicast 和 WKA。\n\n- **multicast:**\
  \ 基于多播的成员管理。成员关系使用多播自动发现。为了使其工作，多播必须在网络中允许，并且集群中的所有成员必须使用相同的多播地址（由 `mcastAddress`\
  \ 参数定义）和确切的多播端口（由 `mcastPort` 参数定义）。\n- **众所周知地址 (WKA)：** 基于众所周知地址的成员管理。成员关系在运行在众所周知地址的一个或多个节点的帮助下发现。加入集群的新成员将首先连接到众所周知节点，向众所周知节点注册，并从其获取成员列表。当新成员加入时，众所周知节点中的一个将通知组中的其他节点。当成员离开集群或被认为已离开集群时，它将通过\
  \ **Group Membership Service (GMS)** 使用 TCP ping 机制检测到。当多播成员发现不可行时，需要基于 WKA 的成员关系。例如，在\
  \ Amazon EC2 上，不允许多播，并且无法控制分配给 EC2 实例的 IP 地址。因此，在这种情况下，往往会使用基于 WKA 的成员发现。\n\n###\
  \ domain\n\n集群域/组：请注意，“domain”和“group”一词可互换使用。不同组中的节点之间不会有任何干扰。从组外成员接收的消息通常会被忽略。然而，特殊消息，例如来自组外成员的集群管理消息或成员关系消息将被允许。\n\
  \n\n\n\n## synchronizeAll\n\n当收到并处理一个Web服务请求时，是否应该在响应发送给客户端之前，更新集群中所有成员的状态？如果此参数的值设置为true，则只有在所有成员都更新完毕之后，才会向客户端发送响应。显然，这可能会很耗时。在某些情况下，如果这种开销不可接受，则应将此参数的值设置为false。这种做法的风险在于，当响应发送给客户端时，所有成员不会处于相同的状态。这种情况必须由用户处理。总而言之，此参数定义了我们是否应该在向客户端发送响应之前同步组内所有成员的状态。\n\
  \n## maxRetries\n\n此参数定义在放弃并向特定成员发送消息并认为该节点故障之前，我们需要重试的最大次数。达到maxRetries次重试后，我们便放弃。\n\
  \n## mcastAddress\n\n这是要使用的多播地址。仅当membershipScheme设置为multicast时，才会考虑此参数。\n\n## mcastPort\n\
  \n这是要使用的多播端口。仅当membershipScheme设置为multicast时，才会考虑此参数。\n\n## mcastFrequency\n\n此参数定义发送成员关系多播消息的频率。该值应以毫秒为单位指定。仅当membershipScheme设置为multicast时，才会考虑此参数。\n\
  \n## memberDropTime\n\n此参数定义了一个时间间隔，如果某个成员在此时间间隔内没有响应，则视为该成员已离开组。该值应以毫秒为单位指定。\n\n\
  ## mcastBindAddress\n\n此参数定义了多播必须绑定到的网络接口的IP地址。多播将使用此接口进行。仅当`membershipScheme`设置为`multicast`时，才会考虑此参数。请注意，此地址可以与`localMemberHost`参数不同。因此，我们可以在`localMemberHost`网络接口上监听点对点消息，同时在绑定到`mcastBindAddress`的网络接口上监听多播消息。\n\
  \n## localMemberHost\n\n此参数定义该成员的主机名或IP地址。这是该成员在加入组并发送消息时宣告的IP地址。应将其设置为除localhost或127.0.0.1以外的有效值。在大多数情况下，将其设置为用于与组内成员通信的网络接口所绑定的IP地址即可。\n\
  \n## localMemberPort\n\n此参数定义该成员使用的TCP端口。其他成员将通过此端口与该成员联系。此端口的默认值为4000。\n\n## preserveMessageOrder\n\
  \n此参数指示应保持消息顺序。这将按照发送方的顺序进行。此参数的默认值为true。\n\n## atmostOnceMessageSemantics\n\n此参数指示需要保持“至多一次”的消息处理语义。它保证给定的集群消息将至多传递一次到目标进程或节点。此参数的默认值为true。\n\
  \n## properties\n\n有一些特定于该成员的属性。这些属性就是简单的名-值对。当成员加入组时，这些属性会绑定到该成员上，以便组内的其他成员能够检测到这些属性。在需要进行集中式集群管理的情况下，可以使用这些属性。\n\
  \n例如：假设有一个可由独立服务器管理的Axis2集群。每个Axis2成员将提供两个成员属性，即backendServerURL和mgtConsoleURL。backendServerURL属性用于连接成员的后端管理Web服务。类似地，如果该成员希望公开自己的管理控制台，则可以通过提供“mgtConsoleURL”属性来实现。backendServerURL属性使用<property\
  \ name=\"backendServerURL\" value=\"https://${hostName}:${httpsPort}/services/\"\
  />条目来指定。这里，${hostName}表示hostName成员属性，${httpsPort}表示httpsPort成员属性。hostName和httpsPort是两个隐式成员属性。httpPort是另一个隐式成员属性。先前已声明的属性可以在后续的属性定义中使用。例如，我们可以按如下方式定义一个新属性：<property\
  \ name=\"foo\" value=\"${backendServerURL}/foo\"/>。\n\n## 状态管理\n\n如果需要在集群组的成员之间同步状态，则需要启用stateManager元素。需要提供org.apache.axis2.clustering.state.StateManager的实现作为class属性的值。在默认的基于Apache\
  \ Tribes的实现中，我们提供了org.apache.axis2.clustering.state.DefaultStateManager类。用户可以选择不复制某些属性。这可以通过提供属性名模式来实现。让我们看下面的例子：\n\
  \n```\n<stateManager class=\"org.apache.axis2.clustering.state.DefaultStateManager\"\
  \ enable=\"true\">\n  <replication>\n    <defaults>\n      <exclude name=\"local_*\"\
  />\n      <exclude name=\"LOCAL_*\"/>\n    </defaults>\n    <context class=\"org.apache.axis2.context.ConfigurationContext\"\
  >\n      <exclude name=\"UseAsyncOperations\"/>\n      <exclude name=\"SequencePropertyBeanMap\"\
  />\n    </context>\n    <context class=\"org.apache.axis2.context.ServiceGroupContext\"\
  >\n      <exclude name=\"my.sandesha.*\"/>\n    </context>\n  </replication>\n</stateManager>\n\
  ```\n\n![](img/e2fb05de168053e6227dab034eff9353_233_0.png)\n\n静态成员在每个成员的axis2.xml文件中指定如下：\n\
  \n```\n<members>\n    <member>\n        <hostName>S1</hostName>\n        <port>4000</port>\n\
  \    </member>\n    <member>\n        <hostName>S2</hostName>\n        <port>4000</port>\n\
  \    </member>\n</members>\n```\n\n如上图所示，属于域Group H并且至少知道组内一个静态成员的新成员N，可以加入该组。这个新成员将首先联系其中一个静态成员，并了解组成员信息。静态成员将告知N组成员信息{S1,\
  \ S2, D1, D2, D3}，然后通知组内每个成员N已加入组，如下面的时序图所示：\n\n![](img/e2fb05de168053e6227dab034eff9353_233_1.png)\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_235_0.png)\n\n为了管理如上图所示的两个组Group H和Group\
  \ D，集群管理器需要有以下配置：\n\n```\n<groupManagement enable=\"true\">\n    <applicationDomain\
  \ name=\"GroupH\"\n        description=\"This is the first group\" agent=\"org.apache.\n\
  axis2.clustering.management.DefaultGroupManagementAgent\"/>\n\n    <applicationDomain\
  \ name=\"GroupD\"\n        description=\"This is the second group\" agent=\"org.apache.\n\
  axis2.clustering.management.DefaultGroupManagementAgent\"/>\n</groupManagement>\n\
  ```\n\n## 高可用负载均衡\n\n为了避免单点故障，工作Axis2集群——**Group H**和**Group D**——可以由负载均衡器集群**Group\
  \ LB**作为前端，如下图所示。**Group LB**中的一个负载均衡器将作为主负载均衡器。Apache Synapse负载均衡器可以以这种方式部署，并使用底层的Axis2集群机制。Web服务客户端将与主负载均衡器中的端点通信，而不会感知到后端工作节点Axis2集群。\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_236_0.png)\n\n## Axis2集群管理API\n\nAxis2集群的设计方式是，所有功能都通过一组接口进行抽象。通过实现这些接口并在集群配置部分提供实现类，可以插入任何不同的集群实现。Axis2中的默认集群实现基于Apache\
  \ Tribes（Apache Tribes n.d.），这是Apache Tomcat（Apache Tomcat n.d.）使用的流行的组管理框架。有时可能需要使用自己选择的组管理框架，在这种情况下，可以实现这些接口，然后通过`axis2.xml`文件中的集群配置部分将它们插入。我们将在本章后面讨论这些接口的用法。\n\
  \n\n\n\n\nThere can also be several `parameter` elements, which are children of\
  \ the `clustering` element in the `axis2.xml` file. Generally, these parameters\
  \ will be specific to the `ClusteringAgent` implementation. In the default Apache\
  \ Tribes-based implementation, there are several parameters that are required to\
  \ initialize the Tribes Channel properly.\n\n## org.apache.axis2.clustering.state.StateManager\n\
  \nThis interface is responsible for handling state replication. This is an optional\
  \ interface and if state replication is not required, then this interface can be\
  \ omitted. The word 'state' here means the serializable values stored in the Axis2\
  \ context hierarchy which need to be kept in sync across all the members of a cluster\
  \ group. Property changes (state changes) in the Axis2 context hierarchy in the\
  \ node that runs this `StateManager` will be propagated to all other nodes in its\
  \ group. In the default Axis2 clustering implementation, we have only enabled replication\
  \ of serializable objects stored in the Apache Axis2 `ConfigurationContext`, `ServiceGroupContext`,\
  \ and `ServiceContext`. Hence, if a user requires state replication, it is this\
  \ user's responsibility to store these values in the proper Axis2 contexts. Generally,\
  \ web services authors do not have to handle state replication, as it is handled\
  \ by the clustering implementation just before request completion. This is done\
  \ at the Axis2 `MessageReceivers`. However, if the developer writes his own `MessageReceiver`,\
  \ he will need to call the `org.apache.axis2.clustering.state.Replicator#replicate()`\
  \ method. Also, note that at any point, `org.apache.axis2.clustering.state.Replicator#replicate()`\
  \ can be called, if the developer wishes to force state replication.\n\nIt is not\
  \ mandatory to have a `StateManager` in a node. If we are not interested in high\
  \ availability, we may disable state replication. In such a scenario, in general,\
  \ the purpose of a clustered deployment is to achieve scalability. In addition,\
  \ one may also enable clustering without state replication simply to utilize the\
  \ group communication capabilities of the underlying **Group Communication Framework\
  \ (GCF)**. In such a case, the purpose of a clustered deployment may also be management\
  \ of the cluster using the underlying GCF. The implementation of this interface\
  \ is set by reading the `stateManager` element in the `axis2.xml` clustering section.\n\
  \n## WSO2 ESB\n\n**WSO2 ESB** is an open source Enterprise Service Bus (ESB) released\
  \ by the open source middleware company, WSO2 Inc. It is shipped under the Apache\
  \ Software License v2.0. The runtime of WSO2 ESB has been designed to be completely\
  \ asynchronous, non-blocking, and streaming, based on the Apache Synapse mediation\
  \ engine. This also means that WSO2 ESB has been built on top of Apache Axis2, as\
  \ Apache Synapse is based on Apache Axis2. This ESB allows system administrators\
  \ and SOA architects to simply and easily configure message routing, virtualization,\
  \ intermediation, transformation, logging, task scheduling, load balancing, failover\
  \ routing, event brokering, and many enterprise integration patterns.\n\nWSO2 ESB\
  \ supports many application layer protocols and messaging standards, collectively\
  \ known as **transports**, including HTTP, HTTPS, e-mail, **Java Message Service\
  \ (JMS)**, and **Virtual File System (VFS)**. It also supports a range of domain-specific\
  \ protocols such as **Financial Information eXchange (FIX)**, **Advanced Message\
  \ Queuing Protocol (AMQP)**, and **Health Level 7 (HL7)**. New transports can be\
  \ easily plugged into the server due to the extensibility offered by the Axis2 transports\
  \ framework. The following figure illustrates how the different transports can be\
  \ plugged into the ESB and how the Apache Synapse runtime fits into the WSO2 ESB:\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_243_0.png)\n\n## OpenESB\n\n**OpenESB**\
  \ is an open source **Java Business Integration (JBI)** standard-centric Enterprise\
  \ Service Bus, originally from Sun Microsystems, now Oracle Inc. JBI is built on\
  \ a web services model and provides a pluggable architecture for a container that\
  \ hosts service producer and consumer components. Services connect to the container\
  \ via binding components or can be hosted inside the container as part of a service\
  \ engine. The services model used is Web Services Description Language (WSDL) 2.0.\
  \ OpenESB consists of a runtime, a design time, and a management console. The runtime\
  \ consists of a lightweight JBI core and several components. OpenESB comes with\
  \ several components for data transformation, orchestration, and connectivity. There\
  \ is support for HTTP and web services, JMS, databases, MQ Series, SAP, IMS, HL7,\
  \ and others. Logic can be expressed in BPEL, EJBs, or POJOs.\n\nIn the rest of\
  \ this chapter, we will be looking at the following SOA integration patterns. Please\
  \ note that Apache Synapse has been shown as the ESB in the diagrams, but it can\
  \ be replaced by any of the ESBs we have discussed in this chapter:\n\n- Protocol\
  \ bridging\n- External authentication and authorization\n- Dynamic routing combined\
  \ with auditing\n- **Event Driven Architecture (EDA)** with **Master Data Management\
  \ (MDM)**\n- Push and pull\n- Fault tolerant autoscaling with dynamic load balancing\n\
  \n## Protocol bridging\n\n**Protocol bridging** refers to the request coming on\
  \ one transport protocol, and being sent in for processing on a different protocol.\
  \ For example, the corporate policy may dictate that all incoming traffic should\
  \ be on HTTPS. Some web services may exist that are exposed only via a transport\
  \ such as JMX. In such a case, there should be a way of bridging from HTTPS to JMX.\
  \ Furthermore, the backend web services, which may be deployed on Axis2, may be\
  \ highly secured within a **High Security Zone (HSZ)**, and the policies may dictate\
  \ that only certain calls from the **Demilitarized Zone (DMZ)** can be made to those\
  \ web services. We may also implement message validation and request throttling\
  \ outside the highly secured LAN. This scenario is shown in the following figure.\
  \ External web service clients talk to the endpoints on the ESB in the DMZ. This\
  \ ESB will run validations and other Quality of Service (QoS) functionality on these\
  \ incoming messages, and if those messages meet the requirements, it will switch\
  \ to a protocol that is compatible with the backend service deployment, and send\
  \ the message into the LAN.\n\nIn the following figure, we have shown another optional\
  \ ESB deployment, which can further deal with things such as transformations. However,\
  \ that ESB can be omitted, if required, and the request can be directly routed to\
  \ Axis2. Once Axis2 receives the request, it will dispatch it to the relevant web\
  \ service and send the response back. The ESB in the DMZ will again perform a protocol\
  \ transformation, and send the response back to the client that originated the request.\n\
  \n![](img/e2fb05de168053e6227dab034eff9353_247_0.png)\n\n## External authentication\
  \ and authorization\n\nIn medium to large scale enterprise deployments, authentication\
  \ and authorization are handled by an external identity management server such as\
  \ WSO2 Identity Server. The web service client or the server can participate in\
  \ authentication and authorization.\n\nIn these two scenarios, authentication and\
  \ authorization handling can be done within a pure Axis2 instance as well, but the\
  \ reason for bringing in an ESB into the picture is to handle all authentication\
  \ and authorization functionality in one central place. Otherwise, if there are\
  \ multiple Axis2 instances in an enterprise deployment, each of those Axis2 instances\
  \ would have to separately talk to the identity management server. In addition,\
  \ additional mediation steps can be introduced in the ESB, when the system evolves\
  \ over time.\n\n## Dynamic routing combined with auditing\n\nIn some enterprise\
  \ deployments, there is a requirement to route the request to different Axis2 service\
  \ implementations or different Axis2 servers, depending on certain criteria or other\
  \ parameters such as the time of the day. For example, during the peak hours, requests\
  \ may be routed to a server having more resources in terms of memory and processing\
  \ power. In some cases, the requests may need more processing power, depending on\
  \ the input parameter values. Requests are dynamically routed in order to optimize\
  \ resource usage and maintain throughput. Note that the service contracts will not\
  \ change and only the service implementation or deployment location will change.\
  \ Hence this is transparent to the client.\n\nDynamic routing may be combined with\
  \ auditing. In this case, each of the requests, along with other relevant metadata,\
  \ will be asynchronously logged into a file or database for future auditing purposes.\n\
  \nAs shown in the following figure, the Synapse ESB is used as a dynamic router\
  \ and the central point for auditing. The Synapse configuration is loaded from a\
  \ configuration repository and this configuration can change over the course of\
  \ the day so that requests are dynamically routed to different Axis2 service implementations\
  \ or Axis2 servers. A log mediator is used for logging the incoming requests and\
  \ outgoing responses to a database. In the case where the Synapse configuration\
  \ is changed at preconfigured times of the day, the server is put into maintenance\
  \ mode using the JMX management API.\n\n\n\n\n\n在维护模式下，服务器将暂时停止接受新请求，但会继续处理已收到的请求。一旦所有现有请求处理完毕，将加载新配置，并使用新配置初始化\
  \ Synapse 服务器。配置的重新加载可以手动完成，也可以通过运行脚本的 Cron 作业或任务自动完成。\n\n![](img/e2fb05de168053e6227dab034eff9353_250_0.png)\n\
  \n## 用于集成遗留系统的事件驱动架构（EDA）与主数据管理（MDM）\n\n这种模式是事件驱动架构（EDA）和主数据管理（MDM）的结合。你将看到如何使用此模式使遗留系统启用\
  \ SOA 并实现集成。\n\n### 事件驱动架构（EDA）\n\n事件驱动架构（EDA）是一种软件架构模式，系统基于事件的创建、消费和反应来运行。事件化是解耦\
  \ SOA 系统的常用方式之一。实际上，事件驱动架构非常松耦合且分布良好。事件可以是任何事物；任何消息都可以被视为事件。\n\n### 主数据管理（MDM）\n\
  \n**主数据** 指对业务运营至关重要的信息。这些信息可能包括客户、产品、员工、供应商等数据。主数据本质上是非事务性的，但可以支持事务流程和操作。主数据通常被多个职能组使用，并存储在整个组织的不同数据系统中，可能被集中引用，也可能不被集中引用。因此，存在重复和/或不准确主数据的可能性。MDM\
  \ 包含一组一致地定义和管理主数据的流程和工具。MDM 的目标是提供在整个组织中收集、聚合、匹配、合并、质量保证、持久化和分发主数据的流程，以确保这些信息在持续维护和应用使用中的一致性和控制。\n\
  \n组织中的大多数遗留系统对相同主数据有不同的表示。这是集成这些遗留系统的主要挑战之一。我们将探讨如何使用 EDA 与 MDM 来集成此类遗留系统。\n\n![](img/e2fb05de168053e6227dab034eff9353_251_0.png)\n\
  \n我们将使用前图所示的示例场景来演示 EDA 与 MDM。系统 1-3 是遗留系统，它们对组织的主数据有不同的表示。例如，Person 实体在系统 1 中以某种格式表示，而在系统\
  \ 2 和 3 中以另一种格式表示。这些系统拥有各自的数据库来存储主数据。当某个系统中添加新主数据或更改现有主数据时，必须通知所有其他系统，以便它们相应地更新数据库。让我们详细了解每个子系统。\n\
  \n### 适配器层\n\n我们使用基于 Axis2 Web 服务的适配器来集成这些系统。适配器扮演双重角色；它们与各自的后端遗留系统原生通信，并在相应遗留系统的主数据发生变化时发布事件。这些适配器也可以视为转换器，将**通用业务对象（GBO）**转换为**应用特定业务对象（ASBO）**。每个适配器只关心特定主数据类型的更改。因此，每个适配器都会订阅由不同主题空间表示的特定事件类型。这里使用基于\
  \ Axis2 Savan 模块的 WS-Eventing。当事件服务器发布针对这些特定主题的事件时，相关适配器会接收它们。类似地，当主数据变化时，每个适配器会向相关主题发布事件。适配器\
  \ Web 服务部署在同一个逻辑 Axis2 服务器上，物理上可以部署为集群。\n\n### 集成服务器\n\n**集成服务器** 是一个充当事件代理的 Synapse\
  \ 服务器。该服务器负责管理 WS-Eventing 订阅。部署在适配器服务器上的适配器将是订阅者。当收到特定事件时，该服务器将咨询逻辑服务器，如果这是一个新事件，它会将其转换为\
  \ GBO 并发布到相关主题。\n\n## 具有动态负载均衡的容错自动伸缩\n\n容错性、高可用性和可伸缩性是任何企业应用部署的基本前提。企业应用架构师的主要关注点之一是避免单点故障。**自动伸缩**\
  \ 是指系统在负载增加时扩展、负载减少时收缩的行为。这种方法对于按实际消耗计算能力收费的云部署（如 Amazon EC2）至关重要。理想情况下，从客户的角度来看，在自动伸缩系统中，响应时间应保持恒定，系统的整体吞吐量应增加。动态负载均衡是指负载均衡器本身使用组通信和组成员机制来发现负载分布域的一种机制。在传统设置中，单个负载均衡器位于一组应用节点之前。在这种情况下，负载均衡器可能成为单点故障。传统上，使用\
  \ Linux HA 等技术来克服这一问题。然而，这种传统方案有相当大的开销，并且要求备份系统与主系统非常接近。\n\n如下图所示，客户端直接与主 Synapse\
  \ ESB 通信。Synapse 可以配置为作为负载均衡器运行。该负载均衡器将根据预配置的负载均衡算法将请求路由到 Axis2 工作节点。负载均衡器本身部署在它自己的集群中。主负载均衡器和备份负载均衡器属于同一个\
  \ Axis2 集群域。请记住，Synapse 构建在 Axis2 之上，因此使用 Axis2 的内置集群机制。如果主负载均衡器发生故障，备份负载均衡器将接管，并成为主负载均衡器。它还会启动另一个备份负载均衡器。在云上，由于无法进行多播，因此使用基于知名地址的成员管理。主负载均衡器将是知名成员。主负载均衡器和备份负载均衡器也启用了组管理，因此它们可以检测\
  \ Axis2 工作节点集群中的成员变化。\n\n在下一章中，我们将讨论 Apache Axis2 的一些高级特性，包括 Axis2 中的 REST（表述性状态转移）支持、MTOM（消息传输优化机制）、理解\
  \ Axis2 类加载器层次结构，以及在其他各种应用服务器上部署 Axis2。\n"
- "# 14 Axis2 高级特性和用法\n\n在前面的章节中，我们讨论了如何安装 Axis2、编写简单的 Web 服务、编写简单的模块、调用 Web 服务以及许多其他内容。如果你认真跟随并完成了所有示例，现在你应该已经扎实掌握了\
  \ Axis2 的基础知识。因此，在本章中，可以这么说，我们将深入探讨 Axis2 的更高级特性。但不必恐慌！在前面的章节中，你已经在不知不觉中使用 Axis2\
  \ 的大多数高级特性。现在是时候正确地学习它们，并将它们应用到你的应用程序中。当你想要开发复杂的 Web 服务应用程序时，Axis2 提供了许多你需要了解的有趣特性。\n\
  \n在本章中，我们将讨论 Axis2 的几个高级特性，当你需要超越基本的 Web 服务调用时，你就会用到它们。具体来说，我们将讨论以下内容：\n\n- 表述性状态转移（REST）及其特性\n\
  - REST 在 Axis2 中的使用\n- 消息传输优化机制（MTOM）\n- 客户端对 MTOM 的支持\n- 服务端对 MTOM 的支持\n- 用于创建更定制化\
  \ Axis2 的 AxisConfigurators\n- 以异步方式调用和处理 Web 服务\n\n在本章中，我们将讨论几个不同的特性及其用法。但是，应该注意，每个单独的章节都有其自身的含义和应用。此外，当你想要进行复杂或更定制化的工作时，你将需要这些特性。\n\
  \n\n\n\n\n## Representational State Transfer (REST)\n\n我们从本章开始介绍 Representational\
  \ State Transfer（REST）及其特性。REST 是 Roy Fielding 在其博士论文中提出的一个术语，用来描述网络系统的架构风格。REST\
  \ 的动机是为了捕捉使 Web 取得成功的特性。随后，这些特性被用来指导 Web 的演进。REST 并不是一个标准，而是一种架构风格，这就解释了为什么你在 W3C\
  \ 中找不到任何规范。\n\n### Features of REST\n\nWeb 由资源组成。简单来说，资源是任何具有某种兴趣的项目。例如，亚马逊在线商店可能会为其新款佳能相机（DSLR）定义一个资源，客户端可以使用以下\
  \ URL 访问该资源页面：http://www.amazon.com/canon/dslr。\n\n点击链接后，会返回资源的表示（例如，canon_dslr.html）。该表示将客户端应用程序置于一种状态。客户端在\
  \ canon_dslr.html 中遍历超链接的结果是它访问另一个资源。新的表示将客户端应用程序置于另一种状态。因此，客户端应用程序随着每次访问的资源表示而改变（转移）状态，因此我们称之为\
  \ Representational State Transfer！\n\n以下是 Roy Fielding 对 Representational State\
  \ Transfer 含义的解释：\n\n> \"Representational State Transfer 旨在唤起这样一种图像：一个设计良好的 Web\
  \ 应用程序的行为：一个 Web 页面网络（一个虚拟状态机），用户通过选择链接（状态转换）在应用程序中进展，从而将下一个页面（代表应用程序的下一个状态）传输给用户并为其使用进行渲染。\"\
  \n\nWeb 是一个 REST 系统！你多年来一直在使用的许多 Web 服务——图书订购服务、搜索服务、在线词典服务等等——都是基于 REST 的 Web 服务，这表明你一直在不知不觉中使用\
  \ REST 并构建 REST 服务。\n\n### REST services in Axis2\n\nWeb Service Description Language（WSDL），尤其是\
  \ WSDL 2.0 HTTP Binding 定义了一种在 Web 服务中支持 REST API 的方法。Axis2 实现了 HTTP 绑定规范中定义的大部分内容。Axis2\
  \ 的 REST 实现假设以下属性：\n\n- REST Web 服务是同步的，并且具有请求-响应特性。\n- 当通过 GET 访问 REST Web 服务时，服务和操作是基于\
  \ URL 识别的。参数被假定为 Web 服务的参数（HTTP GET 请求中的名称-值对 `name=Axis2&value=1.5`）。在这种情况下，基于\
  \ GET 的 REST Web 服务仅支持简单类型作为参数，并且应遵循 IRI 风格。\n- 基于 POST 的 Web 服务不需要 SOAP 信封或 SOAP\
  \ 主体。它只发送 XML 有效负载或 URL 参数，如 GET。\n\n在 Axis2 中，默认情况下，任何给定的 Web 服务都同时作为 SOAP 和 REST\
  \ 暴露。结果是，作为服务作者，你无需做额外的工作。然而，需要注意的是，对于一些使用 REST API 暴露的服务将无法工作。例如，如果应用程序接收一个复杂对象，很难使用\
  \ REST GET API 暴露它。因此，存在需要用户更改自动生成的 WSDL 文件以提供正确信息的情况。Axis2 为 WSDL 1.1 和 WSDL 2.0\
  \ 生成 REST 绑定，更重要的是，使用 WSDL 2.0，用户可以获得更多自定义 REST 绑定的功能，因为 WSDL 2.0 比 WSDL 1.1 更专注于\
  \ REST。\n\n### REST web service with GET and POST\n\n部署在 Axis2 中的服务可以通过 HTTP POST\
  \ 或 GET 请求访问。然而，在 GET 的情况下，你必须将请求作为 URL 参数发送（记住 IRI 风格）。IRI 风格在编码或序列化复杂对象时存在一些限制，因此，实际上你只能使用\
  \ REST GET 方法调用一组服务，但你几乎可以使用 REST POST 方法调用所有服务。例如，如果 Web 服务方法以复杂类型作为其方法参数，则你不能使用\
  \ HTTP GET 方法。因此，像以下这样的服务无法使用 HTTP GET 访问：\n\n```java\npublic class Man {\n    String\
  \ name;\n    int age;\n    Address address;\n}\n\npublic String getName(Man man)\
  \ {\n    //processing logic\n}\n```\n\n> 如前面的代码段所示，Man 对象包含两个简单类型属性（name 和 age）和一个复杂类型属性（address）。因此\
  \ Man 类可以被视为一个复杂对象。\n\n然而，像以下这样的服务可以很容易地使用 HTTP GET 方法访问：\n\n```java\npublic String\
  \ getName(String id, int age) {\n}\n```\n\n要调用这样的服务，你可以按如下方式发送请求：\n\n```\nhttp://localhost:8080/axis2/services/ServiceName/getName?id=ID&age=10\n\
  ```\n\n使用 HTTP POST 方法，没有像 HTTP GET 那样的限制。你可以将其作为编码的 URL 或作为请求体发送（在 POX 消息中）。当使用\
  \ HTTP POST 将消息作为请求体发送时，你只发送 SOAP 主体。\n\n你可以使用任何给定的 HTTP 客户端以 REST 方式调用托管在 Axis2\
  \ 中的 Web 服务，使用 GET 或 POST 方法。然而，正如我们之前讨论的，你将不得不根据 Web 服务操作的方法签名来判断是否使用 GET 或 POST。你甚至可以使用\
  \ ServiceClient 以 REST 方式（使用 GET 或 POST）调用远程服务。以下代码演示了使用 POST 以 REST 方式调用服务：\n\n\
  ```java\nServiceClient client = new ServiceClient();\nOptions opts = new Options();\n\
  opts.setTo(new EndpointReference(\"address of the service \"));\nopts.setAction(\"\
  soap action \");\nopts.setProperty(Constants.Configuration.ENABLE_REST, Boolean.TRUE);\n\
  client.setOptions(opts);\nOMElement res = client.sendReceive(createPayLoad());\n\
  ```\n\n当你调用此代码时，如果你通过 TCP 监视器发送请求，你会看到它只发送请求有效负载（仅 SOAP 主体），并且你也只会得到响应的有效负载。\n\n\
  要将请求作为 GET 请求发送，你需要设置以下标志：\n\n```java\nopts.setProperty(Constants.Configuration.HTTP_METHOD_GET,\
  \ Boolean.TRUE);\n```\n\n这将以 URL 编码格式发送请求（如果可以 URL 编码）。\n\n### Message Transmission\
  \ Optimization Mechanism (MTOM)\n\n无论 XML 的灵活性、互操作性和全球接受度如何，都有时将数据序列化为 XML 毫无意义的时候。Web\
  \ 服务用户可能希望将各种二进制附件，如图像、绘图、XML 文档等，与 SOAP 消息一起传输。这种数据通常最初以某种二进制格式可用。\n\n处理在 XML 中发送二进制数据的两种传统方法如下。\n\
  \n#### By value\n\n通过值发送二进制数据是通过将不透明数据（当然在进行某种形式的编码之后）嵌入为 XML 组件数据的元素或属性内容来实现的。这种技术的最大优点是它使应用程序能够仅基于数据的\
  \ XML 组件来处理和描述数据。XML 通过使用 base64 或十六进制文本编码来支持内容中的不透明数据。不幸的是，这两种技术都会使数据的大小膨胀。对于底层文本编码\
  \ UTF-8，base64 编码会使二进制数据的大小增加到原始大小的近 1.33 倍，而十六进制编码会使数据扩大约 2 倍。如果使用 UTF-16 文本编码，上述因子将被翻倍。另一个令人担忧的问题是这些格式的处理成本开销（实际和感知），尤其是在解码回原始二进制数据时。\n\
  \n#### By reference\n\n通过引用发送二进制数据是通过将纯二进制数据作为 XML 文档外部未解析的通用实体附加，然后将引用这些实体的 URI\
  \ 嵌入为 XML 中的元素或属性值来实现的。这可以防止数据不必要的膨胀和处理能力的浪费。使用这些未解析实体的主要障碍是它们对 DTD 的高度依赖，这阻碍了模块化以及\
  \ XML 命名空间的使用。在 Web 服务世界中引入了几种规范来处理使用“通过引用”技术解决此二进制附件问题；SOAP with Attachments（SWA）就是一个这样的例子。由于\
  \ SOAP 禁止消息中的文档类型声明（DTD），这导致了数据无法作为消息 infoset 的一部分表示的问题，从而创建了两个数据模型。这种情况类似于发送电子邮件附件。即使这些附件与消息内容相关，它们也不包含在消息中。这导致了\n\
  \n\n\n基于数据的 XML 组件来处理和描述数据的技术会发生故障。WS-Security 就是这样一个例子。\n\nMTOM 是另一种专注于解决“附件”问题的规范。MTOM\
  \ 试图通过尝试将上述两种技术合并来利用它们的优势。MTOM 显然是一种“按引用”方法。MTOM 优化消息的线格式与 SOAP with Attachments\
  \ 消息相同，这使其与 SwA 端点向后兼容。MTOM 最显著的特征是使用 XOP: Include 元素，该元素在 XML Binary Optimized\
  \ Packaging (XOP) 规范中定义，用于引用消息的二进制附件（外部未解析的通用实体）。使用此专用元素，附加的二进制内容在逻辑上会与 SOAP 文档内联（按值），即使它实际上是单独附加的。这通过使仅使用一个数据模型工作成为可能，从而将这两个领域合并。这允许应用程序仅通过查看\
  \ XML 部分来处理和描述数据，使对 DTD 的依赖变得过时。另请注意，MTOM 已标准化了 SwA 的引用机制。\n\nAXIOM（参见第 3 章 Axis2\
  \ XML 模型（AXIOM）），用于 Axis2，是一种具有保存二进制数据能力的对象模型。它具有这种能力，因为 OMText 可以以 javax.activation.DataHandler\
  \ 类的形式保存原始二进制内容。选择 OMText 用于此目的有两个原因。一个原因是 XOP（MTOM）只能优化以 XML Schema base64Binary\
  \ 数据类型的规范词法形式存在的 base64 编码 Infoset 数据。另一个原因是保留发送方和接收方的 infoset（无论是否优化，都将二进制内容存储在同一种对象中）。MTOM\
  \ 允许您选择性地编码消息的部分内容，这有助于将 base64 编码的数据以及由 'XOP' 元素引用的外部附加的原始二进制数据（优化内容）作为 SOAP 消息发送。您可以在构造该节点时或之后指定包含原始二进制数据或\
  \ base64 编码二进制数据的 OMText 节点是否符合优化条件。为了实现 MTOM 的最佳效率，建议用户使用 base64 编码（非优化）发送较小的二进制附件，并将较大的附件作为优化内容发送。\n\
  \n```java\nOMElement imageElement = fac.createOMElement(\"image\", omNs);\n\n//\
  \ Creating the Data Handler for the file. Any implementation of\n// javax.activation.DataSource\
  \ interface can fit here.\njavax.activation.DataHandler dataHandler = new javax.activation.\n\
  DataHandler(new FileDataSource(\"SomeFile\"));\n\n//create an OMText node with the\
  \ above DataHandler and set optimized to true\nOMText textData = fac.createOMText(dataHandler,\
  \ true);\nimageElement.addChild(textData);\n```\n\n```java\n//User can set optimized\
  \ to false by using the following\n//textData.doOptimize(false);\n```\n\n此外，用户可以使用\
  \ base64 编码的字符串创建可优化的二进制内容节点，该字符串包含编码的二进制内容，并附带实际二进制表示的 MIME 类型。\n\n```java\nString\
  \ base64String = \"some_base64_encoded_string\";\nOMText binaryNode = fac.createOMText(base64String,\"\
  image/jpg\",true);\n```\n\n> Axis2 使用 javax.activation.DataHandler 来处理二进制数据。如果未启用\
  \ MTOM，所有优化的二进制内容节点都将序列化为 Base64 字符串。您还可以创建在任何情况下都不会被优化的二进制内容节点。它们将被序列化并作为 Base64\
  \ 字符串发送。\n\n```java\n//create an OMText node with the above DataHandler and set\
  \ \"optimized\" to false\n//This data will be sent as Base64 encoded strings regardless\
  \ of whether MTOM is enabled or not\n\njavax.activation.DataHandler dataHandler\
  \ = new javax.activation.DataHandler(new FileDataSource(\"SomeFile\"));\nOMText\
  \ textData = fac.createOMText(dataHandler, false);\nimage.addChild(textData);\n\
  ```\n\n## MTOM on the client side\n\n要在客户端启用 MTOM，您需要在发送消息时将 options 对象中的 enableMTOM\
  \ 属性设置为 True。\n\n```java\nServiceClient serviceClient = new ServiceClient();\nOptions\
  \ options = new Options();\noptions.setTo(targetEPR);\noptions.setProperty(Constants.Configuration.ENABLE_MTOM,\
  \ Boolean.TRUE);\nserviceClient.setOptions(options);\n```\n\n当此属性设置为 True 时，任何 SOAP\
  \ 信封，无论是否包含可优化内容，都将被序列化为 MTOM 优化的 MIME 消息。Axis2 将所有二进制内容节点序列化为 Base64 编码的字符串，无论它们是否符合优化条件。\n\
  \n以下代码演示了作为 Web 服务响应的获取二进制数据：\n\n```java\nServiceClient sender = new ServiceClient();\n\
  Options options = new Options();\noptions.setTo(targetEPR);\n// enabling MTOM\n\
  options.set(Constants.Configuration.ENABLE_MTOM, Boolean.TRUE);\nOMElement result\
  \ = sender.sendReceive(payload);\nOMElement ele = result.getFirstElement();\nOMText\
  \ binaryNode = (OMText) ele.getFirstOMChild();\n\n//Retrieving the DataHandler &\
  \ then do whatever processing required to the data\nDataHandler actualDH;\nactualDH\
  \ = binaryNode.getDataHandler();\n```\n\n> DataHandler 是在 Java 中访问和表示二进制数据的标准方法。用户可以通过提供文件位置来创建\
  \ DataHandler，然后 API 让我们可以读取和写入指定的文件。\n\n## MTOM on the service side\n\nAxis2 服务器根据\
  \ content-type 自动识别传入的 MTOM 优化消息并相应地反序列化它们。用户可以为传出消息在服务器端启用 MTOM。\n\n要为所有服务全局启用\
  \ MTOM，用户可以在 axis2.xml 中将 enableMTOM 参数设置为 True。设置后，所有传出消息都将被序列化并作为 MTOM 优化的 MIME\
  \ 消息发送。如果未设置，所有二进制内容节点中的二进制数据都将被序列化为 Base64 编码的字符串。此配置可以在 services.xml 中按服务和按操作覆盖。\n\
  \n```xml\n<parameter name=\"enableMTOM\">true</parameter>\n```\n\n请注意，设置此参数后必须重新启动服务器（如果您在\
  \ axis2.xml 中设置了该参数）。\n\n您可以编写如下服务来执行二进制数据处理：\n\n```java\npublic class MTOMService\
  \ {\n    public void uploadFileUsingMTOM(OMElement element) throws Exception\n \
  \   {\n        OMText binaryNode = (OMText) (element.getFirstElement()).\n     \
  \   getFirstOMChild();\n```\n\n```java\nSimpleHTTPServer simpleServer = new SimpleHTTPServer(configCtx,\
  \ 8070);\nsimpleServer.start();\n```\n\n使用 URL 仓库时需要记住的一件事是，services 目录必须有一个名为 services.list\
  \ 的文件，列出所有服务归档文件。例如，如果您有名为 foo.aar 和 bar.aar 的服务，则 services.list 将如下所示：\n\n```text\n\
  foo.aar\nbar.aar\n```\n\n同样，modules 目录应包含一个名为 modules.list 的文件，列出所有模块。\n\n## Deploying\
  \ Axis2 in various application servers\n\n正如我们在第 1 章 Apache Web Services and Axis2\
  \ 中讨论的那样，Axis2 以多种发行版的形式提供。应用程序服务器发行版是其中之一。您可以从 Axis2 网站下载 Axis2 应用程序服务器发行版或 WAR\
  \ 发行版，或从二进制发行版构建它们。一旦获得 WAR 发行版，部署它只是将 WAR 文件复制到应用程序服务器的 webapps 目录的问题。在 Apache\
  \ Tomcat 的情况下，它是 webapps 文件夹，而在 Sun Glassfish 的情况下，它是 autodeploy 文件夹，等等。因此，根据应用程序服务器，您必须确定将\
  \ WAR 文件放置的正确位置。\n\n有些应用程序服务器会在永久或临时位置帮助解包 WAR 发行版。例如，Apache Tomcat 会将 WAR 文件解包到永久位置。您可以在那里进行更改，并且当应用程序服务器重新启动时，所有这些更改都将可用。然而，有些应用程序服务器不会这样做。也有一些应用程序服务器根本不会解包\
  \ WAR 文件。即使在 Apache Tomcat 中，您也可以配置是否要解包。取决于应用程序服务器配置，热部署和热更新也会有所不同。例如，如果应用程序服务器不打算解包\
  \ WAR 文件，则根本没有热部署可用。\n\n\n\n\n\n## 使用 Axis2 的异步 Web 服务\n\n无论使用哪种应用服务器，都可以通过编辑 Axis2.war\
  \ 分发版的 web.xml 文件，让 Axis2 从自定义仓库工作。完成此操作后，就无需担心应用服务器是否会解压 WAR，以及解压到何处等问题。甚至可以将基于应用服务器的\
  \ Axis2 配置为使用远程仓库启动。首先，让我们看看如何配置 Axis2.war 以使用本地文件系统。在此，你需要在 web.xml 文件的 servlet\
  \ 部分添加以下初始化参数：\n\n```\n<servlet>\n    <servlet-name>AxisServlet</servlet-name>\n\
  \    <display-name>Apache-Axis Servlet</display-name>\n    <servlet-class>org.apache.axis2.transport.http.AxisServlet</servlet-class>\n\
  \    <init-param>\n        <param-name>axis2.xml.path</param-name>\n        <param-value>path\
  \ to custom axis2.xml (you need this only if you want to override the default axis2.xml)</param-value>\n\
  \    </init-param>\n    <init-param>\n        <param-name>axis2.repository.path</param-name>\n\
  \        <param-value>full path to the custom repository</param-value>\n    </init-param>\n\
  \    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n如前所述，你可以将 web.xml\
  \ 文件配置为从 URL 仓库启动 Axis2。在这种情况下，你需要添加以下两个参数：\n\n```\n<servlet>\n    <servlet-name>AxisServlet</servlet-name>\n\
  \    <display-name>Apache-Axis Servlet</display-name>\n    <servlet-class>org.apache.axis2.transport.http.AxisServlet</servlet-class>\n\
  \    <init-param>\n        <param-name>axis2.xml.url</param-name>\n        <param-value>http://localhost/myrepo/axis2.xml</param-value>\n\
  \    </init-param>\n    <init-param>\n        <param-name>axis2.repository.url</param-name>\n\
  \        <param-value>http://localhost/myrepo</param-value>\n    </init-param>\n\
  \    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n如图所示，我们添加了两个名为 axis2.xml.url\
  \ 和 axis2.repository.url 的参数。你可以根据环境设置修改这些值。\n\n异步 Web 服务的概念是一个非常重要的特性，用户可以调用一个\
  \ Web 服务并继续其工作，直到收到回复。在传统的同步模型中，客户端必须等待（或阻塞）直到收到响应。更重要的是，在 Axis2 中，你在客户端和服务器端都获得了异步支持。在客户端，我们可以以阻塞或非阻塞方式调用服务。选择调用方式非常简单。在服务器端，我们可以拥有处理时间很长的服务。在这种情况下，服务可以以非阻塞方式处理，一旦收到消息，就会发送确认，并在稍后发送响应。Axis2\
  \ 在客户端支持两种不同的异步 Web 服务调用方式；其中一种需要 WS 地址支持，另一种不需要。我们将分别用代码示例讨论它们。\n\n### 什么是同步 Web\
  \ 服务？\n\n如前所述，同步 Web 服务是阻塞式服务调用，应用程序在收到响应之前会被阻塞。通过这种类型的调用，用户必须等待直到收到想要的响应。如果这是一个\
  \ GUI 应用程序，那么在收到回复之前应用程序将变得无响应。\n\n### 什么是异步 Web 服务？\n\n在上一节中，我们讨论了同步 Web 服务。异步\
  \ Web 服务与之相反。异步 Web 服务是非阻塞调用，用户可以在不阻塞用户应用程序的情况下调用服务。\n\n### 客户端异步\n\nAxis2 的主要设计目标之一是提供非常好的异步\
  \ Web 服务支持，而异步支持对客户端更有用。因此，Axis2 对客户端的异步服务调用提供了非常好的支持。Axis2 在客户端支持两种类型的异步调用：\n\n\
  - **应用级异步支持**：在这种情况下，我们只有应用级异步支持。然而，在传输层（传输发送器），我们有阻塞行为。换句话说，当我们调用服务时，我们提供一个回调对象，然后\
  \ Axis2 将其注册到传输层。一旦传输层收到响应，它就会调用回调。为了实现这种类型的异步支持，它不需要 WS-Addressing 支持，因为我们在传输层没有异步行为。\n\
  \n```\npublic class MyCallBack implements AxisCallback {\n    public void onMessage(MessageContext\
  \ messageContext) {\n        SOAPBody msg = messageContext.getEnvelope().getBody();\n\
  \        System.out.println(msg);\n    }\n\n    public void onFault(MessageContext\
  \ messageContext) {\n        messageContext.getFailureReason().printStackTrace();\n\
  \    }\n\n    public void onError(Exception e) {\n        System.err.println(e.getMessage());\n\
  \    }\n\n    public void onComplete() {\n        System.out.println(\"Invocation\
  \ is complete\");\n        //In real application you do not need to terminate the\
  \ program\n        System.exit(0);\n    }\n}\n```\n\n如我们所见，接口中有四个方法。现在让我们逐一查看：\n\
  \n- **onMessage**：如前所述，WSDL 2.0 定义了 MEP 或消息交换模式。其背后的思想是客户端和服务器之间的消息调用模式。客户端可以发送两条消息并得到一个响应（in-in-out），或客户端发送请求并得到响应（in-out），等等。onMessage\
  \ 背后的思想是在收到消息时调用用户操作。在我们的实现中，我们需要打印消息，但根据需求，我们可以在方法内部实现我们的代码。\n- **onFault**：有时我们可能会在服务调用中收到故障，用户可能对此感兴趣。因此此方法有助于实现它。\n\
  - **onError**：在调用服务时，如果客户端出现问题，它将使用此方法通知用户。\n- **onComplete**：当 MEP 完成时，用户将通过此方法收到通知。在此示例中，当\
  \ Axis2 调用 onComplete 方法时，我们终止应用程序。然而，在实际应用程序中，我们可以在那里实现我们的用户操作。\n\n```\n(\"http://localhost:8080/axis2/services/EchoService\"\
  );\nopts.setAction(\"urn:echo\");\nclient.engageModule(\"addressing\");\nopts.setUseSeparateListener(true);\n\
  client.setOptions(opts);\nclient.sendReceiveNonBlocking(createPayLoad(), new MyCallBack());\n\
  System.out.println(\"send the message\");\nwhile (true) {\n    Thread.sleep(100);\n\
  }\n}\n```\n\n第一个高亮行显示了我们如何启用 addressing 模块，第二个高亮行显示了如何通过在 Option 对象中设置 Option 值在客户端启用单独的监听器。\n\
  \n### 总结\n\n在本章中，我们讨论了 Axis2 的许多高级特性，并附带示例。特别是 REST 和 MTOM 在 Web 服务的上下文中非常有用。你可以使用\
  \ REST 作为优化消息线格式的一种方式，你可以使用 MTOM 以高效的方式发送二进制数据。然后我们讨论了使用自定义仓库创建 Axis2，该仓库可能位于本地或远程。接下来，我们研究了在各种应用服务器中部署\
  \ Axis2。最后，我们讨论了如何使用 Axis2 以异步方式调用服务。\n\n现在我们已经涵盖了 Axis2 的大部分必要概念和特性。我们讨论了如何将 Axis2\
  \ 用作服务器和客户端。\n\n在下一章（本书的最后一章）中，我们将讨论如何为你的 Web 服务添加服务质量。特别是，我们将讨论安全性和可靠性以及如何通过代码示例使用它们。\n\
  \n\n\n\n```\n}\n    public void ping{String in}{\n        System.out.println(\"\
  Received text:\" + in);\n    }\n}\n```\n\n接下来，创建一个 `services.xml` 文件，使用 RPC 消息接收器，如下面的代码片段所示：\n\
  \n```\n<service name=\"RMSampleService\">\n    <parameter name=\"ServiceClass\"\
  >RMSampleService</parameter>\n    <description>\n        My Sample service for RM.\n\
  \    </description>\n    <module ref=\"sandesha2\" />\n    <module ref=\"addressing\"\
  \ />\n    <messageReceivers>\n        <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-out\"\
  \ class=\"org.apache.axis2.rpc.receivers.RPCMessageReceiver\"/>\n        <messageReceiver\
  \ mep=\"http://www.w3.org/2004/08/wsdl/in-only\" class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"\
  />\n    </messageReceivers>\n</service>\n```\n\n现在，创建服务归档文件并部署服务。正如你在 `services.xml`\
  \ 文件中所看到的，我们已为这个服务启用了 Sandesha2 模块。打开 Web 控制台，尝试访问服务的 WSDL。如果你能访问到它，说明你已经成功部署了服务及\
  \ Sandesha2 模块。\n\n> 在进入下一步之前，你还需要将 Sandesha2 和 addressing 模块部署到客户端类路径中。如果你有客户端的\
  \ Axis2 仓库，请将下载的 Sandesha2 模块复制到 `modules` 目录中。同时，记得将 RM 阶段添加到客户端侧的 `axis2.xml`\
  \ 中。此外，还要将 Sandesha2 的 JAR 文件复制到客户端类路径中。\n\n## 单向调用\n\n单向调用的思想是：将消息可靠地发送到接收方，发送方不需要应用程序应答，但需要消息的可靠投递。这里我们使用以下客户端发送三条消息。\n\
  \n### 全局配置：\n\n```\npublic class PingClient {\n    private static final String tns\
  \ = \"http://ws.axis2.apache.org\";\n    private static String toEPR = \"http://127.0.0.1:8070/axis2/services/RMSampleService\"\
  ;\n    private static String CLIENT_REPO = \"location to client repository\";\n\
  \    public static void main(String[] args) throws AxisFault {\n    String axis2_xml\
  \ = CLIENT_REPO + File.separator + \"client_axis2.xml\";\n    ConfigurationContext\
  \ configContext = ConfigurationContextFactory.createConfigurationContextFromFileSystem(CLIENT_REPO,axis2_xml);\n\
  ```\n\n### 创建并配置客户端：\n\n```\nOptions clientOptions = new Options ();\nclientOptions.setTo(new\
  \ EndpointReference (toEPR));\nServiceClient serviceClient = new ServiceClient (configContext,null);\n\
  clientOptions.setAction(\"urn:wsm:Ping\");\nserviceClient.setOptions(clientOptions);\n\
  serviceClient.engageModule(new QName (\"sandesha2\"));\nserviceClient.engageModule(new\
  \ QName (\"addressing\"));\nserviceClient.fireAndForget(createElement(\"ping1\"\
  ));\nserviceClient.fireAndForget(createElement(\"ping2\"));\nclientOptions.setProperty(SandeshaClientConstants.LAST_MESSAGE,\n\
  \    \"true\");\nserviceClient.fireAndForget(createElement(\"ping3\"));\nserviceClient.cleanup();\n\
  }\n```\n\n### 创建负载：\n\n```\nprivate static OMElement createElement(String text)\
  \ {\n    OMFactory fac = OMAbstractFactory.getOMFactory();\n    OMNamespace namespace\
  \ = fac.createOMNamespace(tns,\"ns1\");\n    OMElement pingElem = fac.createOMElement(\"\
  ping\", namespace);\n    OMElement textElem = fac.createOMElement(\"in\", namespace);\n\
  \    textElem.setText(text);\n    pingElem.addChild(textElem);\n    return pingElem;\n\
  }\n}\n```\n\n当你使用 Sandesha2 时，它首先会创建一个序列（特定于可靠消息传递的会话）并发送消息；当客户端标记最后一条消息时，它会终止该序列。在上述代码示例中，`ping1`\
  \ 和 `ping2` 消息位于 Sandesha2 会话中，而 `ping3` 不在会话中。Sandesha2 为 `ping1` 和 `ping2` 提供可靠投递，但不为\
  \ `ping3` 提供。\n\n## 请求-应答调用\n\n在这里，我们介绍如何使用 Sandesha2 进行请求-应答消息调用。与前面的示例一样，`echo1`\
  \ 和 `echo2` 位于 Sandesha2 会话中，并获得可靠性支持。`echo3` 无法获得可靠性支持，因为在发送 `echo3` 之前，已经发送了最后一条消息。\n\
  \n```\npublic class EchoClient {\n    private static final String tns = \"http://ws.axis2.apache.org\"\
  ;\n    private final static String echoString = \"echoString\";\n    private static\
  \ String toEPR = \"http://127.0.0.1:8070/axis2/services/RMSampleService\";\n   \
  \ private static String CLIENT_REPO = \"Location of Client repository\";\n    public\
  \ static void main(String[] args) throws Exception {\n        String axis2_xml =\
  \ CLIENT_REPO + File.separator +\"client_axis2.xml\";\n        ConfigurationContext\
  \ configContext = ConfigurationContextFactory.createConfigurationContextFromFileSystem(CLIENT_REPO,axis2_xml);\n\
  ```\n\n创建客户端：\n\n```\nServiceClient serviceClient = new ServiceClient (configContext,null);\n\
  Options clientOptions = new Options ();\nclientOptions.setTo(new EndpointReference\
  \ (toEPR));\nclientOptions.setUseSeparateListener(true);\nserviceClient.setOptions(clientOptions);\n\
  serviceClient.engageModule(new QName (\"sandesha2\"));\nserviceClient.engageModule(new\
  \ QName (\"addressing\"));\nCallback callback1 = new TestCallback (\"Callback1\"\
  );\n```\n\n调用服务（第一次）：\n\n```\nserviceClient.sendReceiveNonBlocking (createElement(\"\
  echo1\"),callback1);\nCallback callback2 = new TestCallback (\"Callback2\");\n```\n\
  \n### 调用服务（第二次）：\n\n```\nserviceClient.sendReceiveNonBlocking(createElement(\"echo2\"\
  ),callback2);\n```\n\n### 发送最后一条消息：\n\n```\nclientOptions.setProperty(SandeshaClientConstants.LAST_MESSAGE,\n\
  \"true\");\nCallback callback3 = new TestCallback (\"Callback3\");\n```\n\n### 调用服务（第三次）：\n\
  \n```\nserviceClient.sendReceiveNonBlocking(createElement(\"echo3\"),callback3);\n\
  while (!callback3.isComplete()) {\n    Thread.sleep(1000);\n}\nThread.sleep(2000);\n\
  }\n```\n\n### 创建负载：\n\n```\nprivate static OMElement createElement(String text)\
  \ {\nOMFactory fac = OMAbstractFactory.getOMFactory();\nOMNamespace applicationNamespace\
  \ = fac.createOMNamespace(tns,\"ns1\");\nOMElement echoStringElement = fac.createOMElement(echoString,\n\
  applicationNamespace);\nOMElement textElem = fac.createOMElement(\"in\",applicationNamespace);\n\
  \ntextElem.setText(text);\nechoStringElement.addChild(textElem);\n\nreturn echoStringElement;\n\
  }\n```\n\n### 实现 Callback 类：\n\n```\nstatic class TestCallback extends Callback\
  \ {\nString name = null;\npublic TestCallback (String name) {\nthis.name = name;\n\
  }\n\npublic void onComplete(AsyncResult result) {\nSOAPBody body = result.getResponseEnvelope().getBody();\n\
  ```\n\n```\nSystem.out.println(\"Callback '' + name + ''\ngot result:\" + body);\n\
  }\npublic void onError (Exception e) {\nSystem.out.println(\"Error reported for\
  \ test call back\");\n    e.printStackTrace();\n}\n}\n}\n```\n\n如果你运行上述代码并通过 TCP\
  \ 监视器观察，你会看到只有前两条消息处于 RM 会话中，最后一条消息不是在 RM 会话内调用的。\n\n## 管理序列\n\n在上一节中，我们讨论了 Sandesha2\
  \ 序列，并提到它会在内部创建序列并发送消息，直到用户指定最后一条消息。在这里，我们将讨论如何使用 Sandesha2 API 管理序列。Sandesha2 提供了一个名为\
  \ `SandeshaClient` 的工具类，它在内部使用 `ServiceClient` 实例。因此，创建 `SandeshaClient` 的实例需要 `ServiceClient`\
  \ 的实例。\n\n> 默认情况下，Sandesha2 会假定发往同一端点的消息应当属于同一个 RM 序列。只有当消息的 WS-Addressing To 地址不同时，消息才会被放入不同的\
  \ RM 序列。但如果需要，你也可以指示 Sandesha2 将具有相同 WS-Addressing To 地址的消息放入两个或多个序列中。为此，你需要设置一个名为\
  \ Sequence Key 的属性。\n\n下面一行代码展示了如何使用序列 ID 来区分不同的序列：\n\n```\nclientOptions.setProperty(SandeshaClientConstants.SEQUENCE_KEY,<sequence\
  \ id>);\n```\n\n\n\n\n\n## 创建序列而不发送消息\n\n在某些应用程序中，您需要在不向服务器发送任何应用程序消息的情况下启动序列。在这种情况下，可以使用以下\
  \ API。当您提出此要求时，Sandesha2 将执行一次 Create Sequence 消息交换，并从服务器获取新的序列 ID。此方法将返回新建序列的 `sequenceKey`\
  \ 值，可用于执行消息调用。此方法还有一个布尔参数，用于指示是否为响应端提供序列。\n\n```\nString sequenceKey = SandeshaClient.createSequence\
  \ (serviceClient, booleanOffer);\n```\n\n## 终止序列\n\n您可以使用以下代码终止序列；Sandesha2 将发送所需控制消息，并同时移除客户端和服务器端的会话：\n\
  \n```\nSandeshaClient.terminateSequence (serviceClient);\n```\n\n> Sandesha2 还提供了许多其他功能，可用于配置并实现更好的定制；不过我们不在这里讨论。建议您参阅在线文档以更好地理解这些功能。\n\
  \n## 保护 Web 服务安全\n\n在上一节中，我们讨论了如何为服务添加可靠性。在本节中，我们将讨论如何为服务提供安全性。在 Axis2 中，我们使用 Apache\
  \ Rampart 来提供安全支持。\n\n下载最新版本的 Apache Rampart 并解压。将 `rampart-version.mar` 文件复制到 `AXIS2_HOME`\
  \ 目录的模块目录中。接下来，将解压后的其他 JAR 文件复制到 `lib` 目录（例如 `TOMCAT_HOME/axis2/WEB-INF/lib`）。然后，重启\
  \ Axis2，登录管理控制台并启用 Rampart 模块。几秒钟后，如果在已启用模块下看到 Rampart 模块，说明您已成功为 Web 服务框架添加了安全支持。\n\
  \n前面的代码片段包含我们将用于此示例的密码回调类。如您所见，我们已硬编码了密码；但在编写复杂的回调类时，您可以检索逻辑并设置正确的密码。\n\n## 创建策略元素\n\
  \nRampart 在服务器端和客户端均使用基于策略的配置。因此，要配置服务，我们需要提供所需的 WS-Policy 配置。这里我们不详细讨论 WS-Policy，只提供服务所需的策略配置，如下代码片段所示：\n\
  \n```\n<wsp:Policy wsu:Id=\"UsernameTokenOverHTTPS\"\n    xmlns:wsu=\"http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wsssecurity-utility-1.0.xsd\"\
  \n    xmlns:wsp=\"http://schemas.xmlsoap.org/ws/2004/09/policy\">\n    <wsp:ExactlyOne>\n\
  \        <wsp:All>\n            <sp:TransportBinding\n            xmlns:sp=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\"\
  >\n                <wsp:Policy>\n                    <sp:TransportToken>\n     \
  \                   <wsp:Policy>\n                            <sp:HttpsToken\n \
  \                           </wsp:Policy>\n                        </sp:TransportToken>\n\
  \                        <sp:AlgorithmSuite>\n                            <wsp:Policy>\n\
  \                                <sp:Basic256/>\n                            </wsp:Policy>\n\
  \                        </sp:AlgorithmSuite>\n                        <sp:Layout>\n\
  \                            <wsp:Policy>\n                                <sp:Lax/>\n\
  \                            </wsp:Policy>\n                        </sp:Layout>\n\
  \                        <sp:IncludeTimestamp/>\n                    </wsp:Policy>\n\
  \                </sp:TransportBinding>\n                <sp:SignedSupportingTokens\
  \ xmlns:sp=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\">\n         \
  \           <wsp:Policy>\n                        <sp:UsernameToken sp:IncludeToken=\"\
  http://schemas.xmlsoap.org/ws/2005/07/securitypolicy/IncludeToken/AlwaysToRecipient\"\
  \ />\n                    </wsp:Policy>\n                </sp:SignedSupportingTokens>\n\
  ```\n\n```\n<ramp:RampartConfig xmlns:ramp=\"http://ws.apache.org/rampart/policy\"\
  >\n    <ramp:passwordCallbackClass>PWCallbackHandler</ramp:passwordCallbackClass>\n\
  </ramp:RampartConfig>\n</wsp:All>\n</wsp:ExactlyOne>\n</wsp:Policy>\n```\n\n如果您熟悉\
  \ WS-Security 和 WS-Policy，可以看出它包含两个主要安全断言：传输绑定断言和签名支持令牌断言。传输绑定断言定义了使用基于 HTTPS 传输令牌断言的\
  \ SSL 传输要求。签名支持令牌定义了对用户名令牌的要求，该令牌应在传输层受到完整性保护。\n\n现在万事俱备。接下来，我们需要使用以下代码为示例服务创建 `services.xml`\
  \ 文件：\n\n```\n<service>\n    <module ref=\"rampart\"/>\n    <parameter name=\"ServiceClass\"\
  >SecureService</parameter>\n    <messageReceivers>\n        <messageReceiver mep=\"\
  http://www.w3.org/2004/08/wsdl/in-out\" class=\"org.apache.axis2.rpc.receivers.RPCMessageReceiver\"\
  />\n        <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-only\" class=\"\
  org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"/>\n    </messageReceivers>\n\
  \    <wsp:Policy wsu:Id=\"UsernameTokenOverHTTPS\" xmlns:wsu=\"http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wssecurity-utility-1.0.xsd\"\
  \ xmlns:wsp=\"http://schemas.xmlsoap.org/ws/2004/09/policy\">\n    </wsp:Policy>\n\
  </service>\n```\n\n现在，编译服务类和回调对象，并使用上述 `services.xml` 文件创建服务归档文件。您可以登录 Web 管理控制台验证服务部署。如果正确遵循上述步骤，应该一切正常。\n\
