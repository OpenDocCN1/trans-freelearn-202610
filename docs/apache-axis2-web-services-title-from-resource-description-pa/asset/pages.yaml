    # Deploying Axis2 in various application servers


    As we discussed in Chapter 1, Apache Web Services and Axis2, Axis2 is available
    in the form of several distributions. The application server distribution is one
    of them. You can download the Axis2 application server distribution or the WAR
    distribution from the Axis2 website or build them from the binary distribution.
    Once you have the WAR distribution, deploying it is just a matter of copying the
    WAR file into the webapps directory of the application server. In the case of
    Apache Tomcat, it is the webapps folder, whereas in the case of Sun Glassfish,
    it is the autodeploy folder, and so on. So, depending on the application server,
    you have to figure out the correct location to drop the WAR file.


    There are some application servers that will help in unpacking the WAR distribution
    to a permanent or temporary location. For example, Apache Tomcat will unpack the
    WAR file to a permanent location. You can make changes there, and when the application
    server restarts, all of those changes will be available. However, there are some
    application servers that do not do this. Also, there are application servers that
    will not unpack the WAR file. Even in Apache Tomcat, you can configure whether
    you want to unpack or not. Depending upon the application server configuration,
    hot deployment and hot update also vary. For example, if the application server
    is not going to unpack the WAR file, you do not have the hot deployment available
    at all.'
  merge: -1
  img_proc: true
- pgno: 269
  md: "Irrespective of the application server, you can get Axis2 to work from a custom\
    \ repository by editing the web.xml file of the Axis2.war distribution. Once this\
    \ is done, you do not need to worry about whether the application server will\
    \ unpack the WAR or not, and if it is, where it is going to unpack and so on.\
    \ You can even configure the application-server-based Axis2 to start up with a\
    \ remote repository. First, let's look at how to configure Axis2.war to work with\
    \ a local filesystem. Here, you need to add the following init parameters to the\
    \ servlet section of the web.xml file:\n\n```\n<servlet>\n    <servlet-name>AxisServlet</servlet-name>\n\
    \    <display-name>Apache-Axis Servlet</display-name>\n    <servlet-class>org.apache.axis2.transport.http.AxisServlet</servlet-class>\n\
    \    <init-param>\n        <param-name>axis2.xml.path</param-name>\n        <param-value>path\
    \ to custom axis2.xml (you need this only if you want to override the default\
    \ axis2.xml)</param-value>\n        <param-name>axis2.repository.path</param-name>\n\
    \        <param-value>full path the custom repository</param-value>\n    </init-param>\n\
    \    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\nAs mentioned earlier,\
    \ you can configure the web.xml file to start Axis2 from a URL repository. In\
    \ this case, you need to add the following two parameters:\n\n```\n<servlet>\n\
    \    <servlet-name>AxisServlet</servlet-name>\n    <display-name>Apache-Axis Servlet</display-name>\n\
    \    <servlet-class>org.apache.axis2.transport.http.AxisServlet</servlet-class>\n\
    \    <init-param>\n        <param-name>axis2.xml.url</param-name>\n        <param-value>http://localhot/myrepo/axis2.xml</param-value>\n\
    \        <param-name>axis2.repository.url</param-name>\n        <param-value>http://localhot/myrepo</param-value>\n\
    \    </init-param>\n    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\
    \nAs shown here, we have added two parameters called axis2.xml.url and axis2.repository.url.\
    \ You can modify the values to suit your environment settings."
