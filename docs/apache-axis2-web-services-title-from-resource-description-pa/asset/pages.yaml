    \n# AxisModule\n\nIn simple terms, an AxisModule is a runtime representation of\
    \ a module.xml. So all the configuration data found in module.xml is in AxisModule.\
    \ A typical module configuration file or module.xml contains the following data:\n\
    \n+   - Module name\n+   - Module description\n+   - Handlers and phase rules\n\
    +   - End point and operations\n+   - WS-Policy\n+   - Parameters\n\nAt the time\
    \ of deployment, an AxisModule is populated using the data from a module.xml.\
    \ At runtime, any part of this data can be retrieved via the same AxisModule.\
    \ Once the data is populated and the module is complete, the parent description\
    \ of the AxisModule becomes the AxisConfiguration."
