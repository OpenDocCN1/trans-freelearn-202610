    FileDataSource("SomeFile"));

    OMText textData = fac.createOMText(dataHandler, false);

    image.addChild(textData);

    ```


    # MTOM on the client side


    To enable MTOM on the client side, you need to set the enableMTOM property in
    the options object to True when sending messages.


    ```

    ServiceClient serviceClient = new ServiceClient();

    Options options = new Options();

    options.setTo(targetEPR);

    options.setProperty(Constants.Configuration.ENABLE_MTOM, Boolean.TRUE);

    serviceClient.setOptions(options);

    ```


    When this property is set to True, any SOAP envelope, regardless of whether it
    contains optimizable content or not, will be serialized as an MTOM-optimized MIME
    message.


    Axis2 serializes all binary content nodes as Base64 encoded strings, regardless
    of whether they are qualified to be optimized or not.'
