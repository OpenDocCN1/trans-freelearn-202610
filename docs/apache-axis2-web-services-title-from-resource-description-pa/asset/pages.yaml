- pgno: 284
  md: "```\nSystem.out.println(\"Callback '' + name + ''\ngot result:\" + body);\n\
    }\npublic void onError (Exception e) {\nSystem.out.println(\"Error reported for\
    \ test call back\");\n    e.printStackTrace();\n}\n}\n}\n```\n\nIf you run the\
    \ given code and observe it through The TCP monitor, you will see that only the\
    \ first two messages are in the RM session and the last one is not invoked inside\
    \ the RM session.\n\n# Managing sequences\n\nIn the previous section, we discussed\
    \ Sandesha2 sequences, and we mentioned that it internally creates a sequence\
    \ and sends the messages until the user specifies the last message. Here, we will\
    \ discuss how to manage sequences using Sandesha2 API. Sandesha2 provides a utility\
    \ class called SandeshaClient that internally uses instances of ServiceClient.\
    \ Hence, creating an instance of SandeshaClient requires an instance of ServiceClient.\n\
    \n> By default, Sandesha2 assumes that messages going to the same endpoint should\
    \ go in the same RM sequence. Messages will be sent in different RM sequences\
    \ only if their WS-Addressing To address is different. However, if required, you\
    \ can instruct Sandesha2 to send messages that have the same WS-Addressing To\
    \ address in two or more sequences. To do this, you will have to set a property\
    \ called Sequence Key.\n\nThe following line represents how to use the sequence\
    \ ID to differentiate between sequences:\n\n```\nclientOptions.setProperty(SandeshaClientConstants.SEQUENCE_KEY,<sequnce\
    \ id>);\n```"
