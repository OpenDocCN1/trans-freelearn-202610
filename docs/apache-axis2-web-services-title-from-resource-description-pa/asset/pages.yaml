- pgno: 112
  md: '# AxisMessage


    AxisMessage is the leaf element of the service hierarchy, and the immediate parent
    of the AxisMessage is an AxisOperation. As we discussed, AxisService can have
    any number of AxisOperation. However, AxisOperation cannot have any number of
    AxisMessage elements. The number of AxisMessages in an operation is determined
    by the message exchange pattern. As an example, if the operation is in-out, there
    will be only two AxisMessage elements in it, one to represent the in message configuration
    and another to represent the out message configuration. AxisMessage has the following
    set of data:


    +   - Parameters

    +   - WS-Policy

    +   - Message label

    +   - Element QName of the corresponding schema element (optional)


    > Note: A message element is an optional element, thus, we can have operation
    elements with zero message elements. You need to add message elements only if
    you are going to override the message, such as adding a new policy.


    Now, we have a good understanding of Axis2 static data and how to change them,
    hence the next step is to learn about dynamic data hierarchy and the relationship
    between static data and runtime data. The following figure shows the relationship
    between the descriptions hierarchy and the contexts or the runtime data hierarchy.


    # Axis2 contexts


    The Axis2 context hierarchy is the runtime data representation of Axis2. Runtime
    data comes into the picture only when Axis2 receives a message, (unlike descriptions).
    The runtime data is used to share data across multiple invocations or among the
    handlers in one invocation. When we were discussing the description hierarchy,
    we talked about how parameters act as the main configuration mechanism. In context,
    the main configuration or data sharing mechanism is the use of Properties. Unlike
    parameters, we do not need to define properties anywhere, as we can create them
    on-the-fly and use them. Properties are stored as name-value pairs in the context
    hierarchy. Hence, if we add a property to the context, then that property can
    be accessed and overridden by any other of its child contexts.


    The following figure shows the relationship between static data and runtime data
    in Axis2:'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/e2fb05de168053e6227dab034eff9353_113_0.png)


    As you can see on the left-hand side, the top most component of the hierarchy
    is ConfigurationContext. The only difference, when ConfigurationContext is compared
    to other contexts, is that it is the only context that exists in the system before
    receiving a message. ConfigurationContext has a reference to an AxisConfiguration,
    and to create ConfigurationContext, it is required to have an AxisConfiguration
    available.


    # ConfigurationContext


    A ConfigurationContext is a runtime representation of the whole system. To start
    Axis2, you need to have a configuration context. The lifetime of the configuration
    context will be the lifetime of the system, so if we store a state (a property),
    it stays there forever (that is, until the system is shut down). ConfigurationContext
    is not only the parent of all other context, it can also be considered as an originator
    element of the entire Axis2 system.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# ServiceGroupContext


    When a message is received by Axis2, a ServiceGroupContext is created to store
    and shared data. To create a ServiceGroupContext, it is required to have an AxisServiceGroup
    object available. One AxisServiceGroup may have one or many ServiceGroupContext.
    Nevertheless, there is only one AxisServiceGroup associated with the context.
    The lifetime of the ServiceGroupContext depends on the service scope (for example,
    application, transport, SOAP session, and request). If the service scope is application,
    then the lifetime will be the same as system lifetime. However, if the service
    scope is "request", then there will be a ServiceGroupContext created for each
    and every invocation. If we want to share data across multiple services in one
    service group at runtime, then the ServiceContext provides the means to do so.


    # ServiceContext


    A ServiceContext represents the runtime data for a given service. To create a
    ServiceContext, we need to have a ServiceGroupContext object and an AxisService
    object available. The lifetime of the ServiceContext depends on the scope of the
    service. If we want to share data across multiple invocations of the same service,
    then ServiceContext can be used as the placeholder to store that data.


    For example, let''s say we have a service with three operations—login, doSomething,
    and logout. Also, assume that we need to share data across these three operations.
    Here, ServiceContext can be used to achieve these objectives. The number of ServiceContexts
    in one ServiceGroupContext is dependent on the number of AxisServices in the corresponding
    AxisServiceGroup.


    # OperationContext


    An OperationContext represents the lifetime of an MEP. More often than not, the
    lifetime of an operation context is less than the lifetime of the service context.
    We can use OperationContext to share data among messages in an MEP. For example,
    if we want to share data between a request and the response, then OperationContext
    can be used to achieve that. The number of OperationContext contexts in a ServiceContext
    is not related to the number of AxisOperation operations in an AxisService; it
    only depends on the number of invocations, for example, one OperationContext for
    each invocation.'
  merge: -1
  img_proc: true
