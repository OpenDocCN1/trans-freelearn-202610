- pgno: 83
  md: 'The only way of changing a flow is by adding a handler(s) to a phase in the
    flow. Therefore, module engagement will cause a change to the handler chain dynamically.
    A module can be engaged dynamically (at runtime) or statically (at deployment
    time). If you want to engage a module statically, you need to specify it in the
    description files. If it is to be a service or to be an operation, then do so
    in `services.xml`. If it is to be engaged globally, then in `axis2.xml`.


    # Special handlers in the chain


    When you consider the execution chain, you can find four types of special handlers
    in the execution chain:


    +   - Transport receiver

    +   - Dispatcher(s)

    +   - Message receiver

    +   - Transport sender


    # Transport receiver


    Whenever a message comes into a system first, it will reach a transport receiver.
    A transport receiver can be considered as something that is waiting to accept
    an incoming message (in the case of the application server, a transport receiver
    could be `Servlet`). Therefore, `InFlow` of an execution chain always starts with
    the transport receiver.


    # Dispatchers


    As we discussed earlier, one of the fundamental goals of a SOAP processing framework
    is to deliver an incoming message to the targeted application. The process of
    finding the correct targeted application is called **dispatching**. In Axis2,
    dispatching will be taking place in the middle of the incoming execution chain.
    So, dispatchers are handlers in the chain. In Axis2, there are a number of ways
    to perform the dispatching:


    +   - Using transport headers and transport level data

    +   - Using WS-Addressing information

    +   - Using an incoming SOAP message'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'To cater to the mentioned types of dispatching, Axis2 has a set of default
    dispatchers, and you can change the order of their execution using `axis2.xml`.
    If you look at the `InFlow` element, which we have discussed in the *Global phases*
    section, you can find the set of available dispatchers in the dispatch phase.


    +   - `RequestURIBasedDispatcher`: Try to find a service and operation using transport
    URI

    +   - `SOAPActionBasedDispatcher`: Try to find the operation using the SOAP action

    +   - `AddressingBasedDispatcher`: Uses addressing information in the WS-A header
    to find the service and operation

    +   - `SOAPMessageBodyBasedDispatcher`: Uses and navigates the SOAP message, especially
    the body to find the operation.

    +   - `HTTPLocationBasedDispatcher`: This will be used to dispatch WSDL 2.0-related
    SOAP messages


    # Message receiver


    The message receiver is a handler in itself, but the only difference is that Axis2
    treats this handler differently than others. If the message has gone through the
    execution chain without having any problem (no exceptions have occurred in the
    middle of the chain), the engine will hand over the message to the message receiver
    to do the business logic invocation. The following figure shows the location of
    the `MessageReceiver` in the execution chain:


    ![](img/e2fb05de168053e6227dab034eff9353_84_0.png)


    On the other hand, the message receiver is the one who directly interacts with
    both the actual service implementation class and Axis Engine (there may be instances
    where a service would be a message receiver). Axis 1.x has the concept of **pivot
    point**, where the request path and response path are met together and where actual
    service invocation takes place. As mentioned earlier, the message receiver is
    the end of `InFlow` that interacts with the service `impl` class. Therefore, Axis2
    does not care about the message after handing it over to the message receiver.
    Notably, it is up to the message receiver to process the message and decide whether
    to send the response message or not, if there is any.'
  merge: -1
  img_proc: true
