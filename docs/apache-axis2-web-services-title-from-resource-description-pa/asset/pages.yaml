- pgno: 171
  md: "+   - `ServiceContext`: This will represent the runtime of one service and\
    \ the context lifetime will be the lifetime of the session. There can be one or\
    \ many service contexts in the system, depending on the session scope of the corresponding\
    \ service.\n+   - `OperationContext`: This context is to represent the life time\
    \ of a MEP (Message Exchange Patterns). The lifetime of an operation context is\
    \ mostly less than the lifetime of the `ServiceContext`.\n+   - `MessageContext`:\
    \ The lifetime of an incoming message is represented by the message context. If\
    \ two handlers in a given execution chain want to share data, then the best way\
    \ is to store them in the message context. One `OperationContext` may have one\
    \ or more `MessageContexts`.\n\n# Session initializing and session invalidating\n\
    \nWhen talking about the session management, one thing that comes to mind is the\
    \ lifetime of the session. Most of the Web applications, like e-commerce, banking,\
    \ hotel reservation, and so on, have a predefine lifetime. If you are not active\
    \ for that time, it will automatically terminate your session and prompt you to\
    \ log in again. Hence, there is a particular time when a session gets started\
    \ and another when the session finishes. So whoever writes a session aware service\
    \ might need to know when a session starts and when it finishes. To facilitate\
    \ this, Axis2 uses Java reflection and optional interfaces to inform the service\
    \ implementation class. Actually, there are two ways that a service author is\
    \ notified when a session starts and finishes, irrespective of the session scope.\n\
    \n# Java reflection\n\nIn this case, the service author has to implement the following\
    \ two methods in his/her service implementation class, if he/she wants to be notified\
    \ as to when the session starts and finishes. At runtime, when a session starts,\
    \ Axis2 looks to see whether the following methods are there in the service implementation\
    \ class; if so, it calls the right method:\n\n```\n//This method will be called\
    \ when a session start\npublic void init(ServiceContext serviceContext) {\n  \
    \  // Our code goes here\n}\n//This method will be called when a session finishes.\n\
    public void destroy(ServiceContext serviceContext) {\n    // Our code goes here\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: "# Using the optional interface\n\nWhen we use Java reflection, there is a very\
    \ slight probability of making mistakes in the method's name and parameters, so\
    \ it is good to user interface. That would lead you to use the method in the correct\
    \ manner and avoid mistakes. The corresponding interface that Axis2 provides is\
    \ called org.apache.axis2.service.Lifecycle, which has the same two methods we\
    \ discussed earlier. If you want to get a notification as to when a session starts,\
    \ you should write your service implementation class to implement that particular\
    \ interface; then Axis2 will automatically call the right method. So we can write\
    \ our service implementation class as shown below:\n\n```\npublic class MyService\
    \ implements Lifecycle {\n    public void init(ServiceContext context) throws\
    \ AxisFault {\n    }\n    public void destroy(ServiceContext context) {\n    }\n\
    }\n```\n\n# Accessing MessageContext\n\nIn the first part of the chapter, we discussed\
    \ that keeping class variables anywhere in Axis2 is not a good practice (for example,\
    \ service implementation class, handler class). There, we also mentioned the fact\
    \ that keeping local variables also leads to issues in the concurrent environments.\
    \ Hence, it is not a good idea to keep variables inside the service implementation\
    \ class. When managing sessions, the right way is to store the data in one of\
    \ the context and access them whenever needed. Though Axis2 passes ServiceContext\
    \ when the session starts, storing it inside the service implementation is not\
    \ the right approach (storing as a class variable). Therefore, we need to have\
    \ a mechanism to access those contexts. As we learned before, if you have access\
    \ to MessageContext, then you can access the entire context hierarchy using that.\
    \ Thus, if we can get access to the current MessageContext, we can consider accessing\
    \ the entire context hierarchy. So the next question is how do we get the current\
    \ MessageContext inside to the service class? That is very straightforward; Axis2\
    \ sets MessageContext into ThreadLocal, so from that, we can access the MessageContext.\
    \ Let's say that we want to access the MessageContext inside the method called\
    \ foo. We can do that as follows:\n\n```\npublic void foo(){\n    MessageContext\
    \ messageContext = MessageContext.getCurrentMessageContext();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 173
  md: "This can be used to access the current MessageContext, irrespective of the\
    \ session scope we use.\n\nHaving discussed all the necessary pieces of session\
    \ management, now it is time to discuss about the different types of available\
    \ sessions in Axis2. As mentioned above, there are four different types of sessions.\
    \ We will discuss all of them in detail here.\n\n# Request session scope\n\nRequest\
    \ session scope is the default session scope in Axis2. When we deploy a service\
    \ without knowing anything about session management, our service will be deployed\
    \ in the request session scope. The lifetime of this session is limited to the\
    \ method invocation lifetime or the request processing time. When we deploy a\
    \ service in the request scope, it simply means that we are not going to worry\
    \ about the session management at all. So it is like having no session management.\n\
    \nOnce we deploy a service in the request session scope, for each and every invocation,\
    \ a new service implementation class will be created. Say we have to deploy a\
    \ service called Foo in the request scope; then if a client invokes the service\
    \ ten times, 10 instances of the service class will be created.\n\nIf we want\
    \ to specify the scope explicitly, we can still do that by adding a scope attribute\
    \ to the service element in services.xml, as follows. However, as mentioned earlier,\
    \ deploying a service in the request scope does not require any modifications\
    \ (the following is optional):\n\n```\n<service name=\"Foo\" scope=\" request\"\
    >\n</service>\n```\n\nTo get an understanding about request scope, create a service\
    \ using the following service class, deploy it, and invoke it:\n\n```\npublic\
    \ class MyService implements Lifecycle {\n    public void init(ServiceContext\
    \ context) throws AxisFault {\n        System.out.println(\"I'm inside init method\
    \ \");\n    }\n    public void destroy(ServiceContext context) {\n        System.out.println(\"\
    I'm inside destroy method\");\n    }\n    public String foo(String foo) {\n  \
    \      return foo;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 174
  md: 'To invoke the service, we just type the following in the browser:


    ```

    http://localhost:8080/axis2/services/MyService/foo?foo=foo

    ```


    We will see the following in the server console:


    ![](img/e2fb05de168053e6227dab034eff9353_174_0.png)


    If we continue to do so, we will see it getting printed every time we invoke the
    service.


    It should be noted here that even if we deploy a service in a request scope, there
    are many ways of keeping our service as a state full service. One way is to store
    the state in Axis2 global runtime (ConfigurationContext) and retrieve whenever
    necessary. Notably, this will add more overhead to the system, as there is only
    one ConfigurationContext, and if everything tries to access it, it will be a bottleneck.


    # SOAP session scope


    The idea of SOAP session is to have a transport-independent way of managing a
    session between two SOAP nodes; obviously, between the client and the server.
    Here, Axis2 uses SOAP headers in order to manage the session. In the SOAP session
    scope, it has a slightly longer lifetime than the request session scope, and deploying
    a service in a SOAP session is required to change services.xml as well. Managing
    a SOAP session requires both the client and the service to be aware of the sessions,
    that is, the client has to send the session-related data if he/she wants to access
    the same session and the service has to validate the user using the session-related
    data.


    > SOAP-based session management is not interoperable; part of the reason is that
    there''s no agreement upon a standard specification to manage the session. There
    is a standard specification called WS-Context, but none of the commonly used web
    service frameworks have implemented it.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "In order to manage a SOAP session, a client has to send an additional reference\
    \ parameter in the SOAP header, which is named as serviceGroupId (it will be sent\
    \ to the client when he invokes a service that deploys in SOAP session the first\
    \ time). In the meantime, a SOAP session has to provide a way to manage sessions\
    \ across not only a single service invocation, but also for multiple services\
    \ in a service group. As long as we are in the same SOAP session, we can manage\
    \ service related data in ServiceContext and if we want to share data across other\
    \ services in the group, then we can use ServiceGroupContext to store the session-related\
    \ data.\n\nWhen we deploy a service in a SOAP session and when a client tries\
    \ to access the service the first time, Axis2 will generate serviceGroupId and\
    \ send that to the client as a reference parameter in wsa:ReplyTo, as shown next.\
    \ However, we should mention here that to have SOAP session support both the client\
    \ and the server, it has to have WS-addressing support.\n\n```\n<wsa:ReplyTo>\n\
    \    <wsa:Address>http://www.w3.org/2005/08/addressing/anonymous</wsa:Address>\n\
    \    <wsa:ReferenceParameters>\n<axis2:ServiceGroupId xmlns:axis2=\"http://ws.apache.org/namespaces/axis2\"\
    >urn:uuid:65E9C56F702A398A8B11513011677354</axis2:ServiceGroupId>\n    </wsa:ReferenceParameters>\n\
    </wsa:ReplyTo>\n```\n\nSo if a client wants to live in the same session, then\
    \ he/she has to copy that reference parameter and send it back to the server when\
    \ he/she invokes the service the second time. As long as a client sends the valid\
    \ ServiceGroupId, he/she can use the same session, and a service can maintain\
    \ the session-related data. Unlike request session scope, SOAP session has a default\
    \ timeout period, if the client does not touch the service for a period of 30\
    \ seconds, then the session will expire, and if the client sends the old serviceGroupId,\
    \ he/she will get an AxisFault. We can change the default timeout period by changing\
    \ the server's axis2.xml file as follows:\n\n```\n<parameter name=\"ConfigContextTimeoutInterval\"\
    >30000</parameter>\n```\n\nBy changing the parameter value, we can have a timeout\
    \ interval that we want.\n\nAs mentioned earlier, deploying a service in a SOAP\
    \ session requires that we change services.xml as follows:\n\n```\n<service name=\"\
    MyService\"  scope=\" soapsession\">\n</service>\n```"
  merge: -1
  img_proc: true
