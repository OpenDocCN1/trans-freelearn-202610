- pgno: 46
  md: '# XML processing model


    As mentioned in *Chapter 1, Apache Web Services and Axis2*, Axis2 is built on
    a completely new architecture as compared to Axis 1.x. One of the key reasons
    for introducing Axis2 was to have a better and efficient XML processing model.
    Axis 1.x used DOM as its XML representation mechanism, which required the complete
    objects hierarchy (corresponding to incoming messages) to be kept in the memory.
    This will not be a problem for small-sized messages. But when it comes to large-sized
    messages, it becomes an issue. To overcome this problem, Axis2 has introduced
    a new XML representation.


    AXIOM (AXIS2 Object Model) forms the basis of the XML representation for every
    SOAP-based message in Axis2. The advantage of AXIOM over the other XML InfoSet
    representations is that it is based on pull parser technique, whereas most others
    are based on PUSH parser technique.


    The main difference of pull over push is that in pull technique, the invoker has
    full control over the parser, and it can request for the next event and act upon
    that, whereas in the case of PUSH, the parser has limited control and delegates
    most of the functionality to handlers that respond to the events that are fired
    during the course of processing the document.


    As AXIOM is based on pull parser technique, it has "on-demand-building" capability
    wherein object model will be built only if it is asked to do so. If required,
    one can directly access underline pull parser from AXIOM, and use that rather
    than build an **Object Model (OM)**.


    # SOAP processing model


    Sending, receiving, and processing a SOAP message is one of the key jobs of the
    SOAP-processing engine. The architecture in Axis2 provides two pipes (or flows)
    in order to perform two basic actions. Old messaging systems such as RPC were
    built around request and response. In Axis, it goes beyond that and introduces
    one-way message processing. With this, there can be request without any responses.


    The AxisEngine or driver of Axis2 defines two methods, `send()` and `receive()`,
    to implement these two pipes. The two pipes are named **InFlow** and **OutFlow**.
    The complex Message Exchange Patterns (MEPs) are constructed by combining these
    two types of pipes. It should be noted that in addition to these two pipes, there
    are two other pipes as well, which help in handling incoming and sending *fault*
    messages.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'As mentioned earlier, the key job of the SOAP processing framework is to process
    the SOAP message. However, just processing the message is not enough. It is necessary
    to provide additional functionalities, such as quality of service. Thus, it is
    required to have extensibility built onto the system. Extensibility of the SOAP
    processing model is provided through handlers. When a SOAP message is being processed,
    the handlers that are registered will be executed. The handlers can be registered
    in global, service, or in operation scopes, and the final handler chain is calculated
    by combining the handlers from all the scopes.


    The handlers act as interceptors and they process the parts of the SOAP message
    and provide the *quality of service* features (a good example of quality of service
    could be security or reliability). Usually handlers work on the SOAP headers,
    yet they may access or change the SOAP body as well.


    The concept of a flow is very simple and it consists a series of phases wherein
    a phase is referred as a collection of handlers. Depending on the MEP for a given
    method invocation, the number of flows associated with it may vary.


    **In-Only MEP:** In the case of an In-Only MEP, the corresponding method invocation
    has only one pipe, that is, the message will only go through in-pipe (inflow).


    **In-Out MEP:** On the other hand, in the case of an In-Out MEP, the message will
    go through two pipes, that is, in-pipe (inflow) and out-pipe (outflow). When a
    SOAP message is being sent, an `OutFlow` would begin.


    **Fault-Flow:** The `OutFlow` invokes the handlers and ends with a **transport
    sender** that sends the SOAP message to the target endpoint. The SOAP message
    is received by a **transport receiver** at the target endpoint, which reads the
    SOAP message and starts the `InFlow`. The `InFlow` consists of handlers and ends
    with the **message receiver,** which handles the actual business logic invocation.


    A phase is a logical collection of one or more handlers, and sometimes a phase
    itself acts as a handler. Axis2 introduced the phase concept as an easy way of
    extending core functionalities. In Axis 1.x, we needed to change the global configuration
    files if we want to add a handler into a handler chain. But Axis2 makes it easier
    by using the concept of phases and phase rules. Phase rules specify how a given
    set of handlers inside a particular phase are ordered. The following figure illustrates
    a flow and its phases:


    ![](img/e2fb05de168053e6227dab034eff9353_47_0.png)'
  merge: -1
  img_proc: true
