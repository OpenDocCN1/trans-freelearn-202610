- pgno: 54
  md: '# Extensible nature of Axis2


    In Axis2, there are many ways to extend the functionalities. In this book, we
    will be discussing a few of them, which are listed here:


    +   - Service extension of the module

    +   - Custom deployers

    +   - Message receivers


    # Service extension or the module


    Both Axis1 and Axis2 have the concept of handlers. But when compared to Axis 1.x,
    there are few changes in the way Axis2 specifies and deploys handlers. In Axis
    1.x, if you want to add a handler, then you need to change the global configuration
    file and then restart the system. In the meantime, it does not have a way to add
    or change handlers dynamically.


    To overcome this problem as well as to add new features, Axis2 introduced the
    concept of web service extensions or a module where the main purpose of a module
    is to extend the core functionality. It is similar to adding handler chains in
    Axis1.x. The advantage of the Axis2 module over the Axis 1.x handler chain is
    that you can add new modules without changing any global configuration files.


    A module is a self-contained package that includes handlers, third-party libraries,
    module-related resources, and a module configuration file.


    A module can be deployed as an archive file. Axis2 came up with a new file extension
    for modules called .mar. The most important file in a module archive file is the
    module configuration file or module.xml. A module will not be functional unless
    it has a module.xml file. A module configuration file mainly specifies handlers
    and their phase rules. So once we engage a module depending on the phase rule,
    the handlers will be placed in different flows (inflow, outflow, and so on).


    The idea of modules is very simple. To implement support for WS-Addressing or
    WS-Security in our services, we need to download the corresponding module and
    drop it into the modules directory of the Axis2 repository. We can engage the
    module at the time of deployment by adding <module ref="module name"/> to axis2.xml
    (global configuration file). In addition to that, if we want to engage a module
    at runtime, we can do that in many ways, such as by using Axis2 web admin, handlers,
    and so on.'
  merge: -1
  img_proc: true
