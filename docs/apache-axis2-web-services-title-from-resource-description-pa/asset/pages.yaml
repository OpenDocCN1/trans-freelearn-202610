    props.setProperty(OUTGOING_MESSAGE_COUNT_KEY,\n                  configurationContext.getProperty(OUTGOING_MESSAGE_\n\
    COUNT_KEY).toString());\n//write to a file\nprops.store(new FileOutputStream(countFile),\
    \ COUNTS_\nCOMMENT);\n} catch (IOException e) {\n    //if we have exceptions we'll\
    \ just print a message and let\nit go\n    System.out.println(\"Saving counts\
    \ failed! Error is \" +\ne.getMessage());\n}\n}\n}\n}\n```\n```\n\nAs we can see,\
    \ there are a number of methods in the previous module implementation class. However,\
    \ notably not all of them are in the module interface. The module interface has\
    \ only the following methods, but here we have some other methods for supporting\
    \ our counter module-related stuff:\n\n+   - `init`\n+   - `engageNotify`\n+ \
    \  - `applyPolicy`\n+   - `shutdown`\n\nAt the system startup time, the init method\
    \ will be called, and at that time, the module can perform various initialization\
    \ tasks. In our sample module, we have initialized both in-counter and out-counter.\n\
    \nWhen we engage this particular module to the whole system, to a service, or\
    \ to an operation, the engageNotify method will be called. At that time, a module\
    \ can decide whether the module can allow this engagement or not; say for an example,\
    \ we try to engage the security module to a service, and at that time, the module\
    \ finds out that there is a conflict in the encryption algorithm. In this case,\
    \ the module will not be able to engage and the module throws an exception and\
    \ Axis2 will not engage the module. In this example, we will do nothing inside\
    \ the engageNotify method."
