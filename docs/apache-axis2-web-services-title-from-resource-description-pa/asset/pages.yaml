  md: "Let us look at a simple example that demonstrates the usage of the OneWay annotation.\
    \ Here, the process operation has been declared as an in-only operation using\
    \ the OneWay attribute.\n\n```\n@WebService\npublic class Processor {\n    @WebMethod(operationName=\"\
    process\", action=\"urn:process\")\n    @OneWay\n    public void process(String\
    \ id) {\n        System.out.println(\"Processing \" + id);\n    }\n}\n```\n\n\
    # javax.jws.WebParam\n\nYou can use this annotation for customizing the mapping\
    \ of a single parameter to a WSDL message part or an XML element. This annotation\
    \ is defined as follows:\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n@Target({PARAMETER})\n\
    public @interface WebParam {\n    public enum Mode {\n        IN,\n        OUT,\n\
    \        INOUT\n    };\n    String name() default \"\";\n    String targetNamespace()\
    \ default \"\";\n    Mode mode() default Mode.IN;\n    boolean header() default\
    \ false;\n    String partName() default \"\";\n}\n```\n\nLet us take a look at\
    \ the properties of the WebParam annotation.\n\n# name\n\nFor RPC bindings, this\
    \ is the name of the wsdl:part representing the parameter. For document/literal\
    \ wrapped bindings, this is the local name of the XML element, representing this\
    \ parameter. This property is not used for document/literal bare bindings."
