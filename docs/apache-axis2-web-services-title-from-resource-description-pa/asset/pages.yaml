  md: "# operationName\n\nThis property defines the name of the wsdl:operation in\
    \ WSDL 1.1 corresponding to this method. The namespace of this name is taken from\
    \ the value WebService.targetNamespace or its default value. The default value\
    \ of this property is the name of the annotated Java method.\n\n# action\n\nThis\
    \ property defines the action of this method's web service operation. It defaults\
    \ to \"\" (an empty string).\n\n# exclude\n\nThis property is used for excluding\
    \ certain methods from a web service. Such methods will not show up as web service\
    \ operations. The default value is false.\n\nLet us look at an example where the\
    \ WebMethod annotation is used along with some of its attributes. In this example,\
    \ the add method will be exposed as a web service operation with the name addInt\
    \ and the action will be set to urn:addInt. The print method will not be exposed\
    \ as a web service, as the exclude attribute of the WebMethod annotation has been\
    \ set to false.\n\n```\n@WebService\npublic class CalculatorImpl {\n    @WebMethod(operationName=\"\
    addInt\", action=\"urn:addInt\")\n    public int add(int a, int b) {\n       \
    \ print(a, b);\n        return a + b;\n    }\n\n    @WebMethod(exclude=\"true\"\
    )\n    public void print(int a, int b) {\n        System.out.println(\"a=\" +\
    \ a + \", b=\" + b);\n    }\n}\n```\n\n# javax.jws.OneWay\n\nThis annotation is\
    \ used for marking a method as a one-way method. The corresponding web service\
    \ operation will be an in-only operation. This annotation has no properties and\
    \ is defined as follows:\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n@Target({METHOD})\n\
    public @interface Oneway {\n}\n```"
