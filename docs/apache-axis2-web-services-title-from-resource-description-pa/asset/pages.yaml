  md: "```\npublic class MyCallBack implements AxisCallback {\n    public void onMessage(MessageContext\
    \ messageContext) {\n        SOAPBody msg = messageContext.getEnvelope().getBody();\n\
    \        System.out.println(msg);\n    }\n\n    public void onFault(MessageContext\
    \ messageContext) {\n        messageContext.getFailureReason().printStackTrace();\n\
    \    }\n\n    public void onError(Exception e) {\n        System.err.println(e.getMessage());\n\
    \    }\n\n    public void onComplete() {\n        System.out.println(\"Invocation\
    \ is complete\");\n        //In real application you do not need to terminate\
    \ the program\n        System.exit(0);\n    }\n}\n```\n\nAs we can see here, there\
    \ are four methods in the interface. Now let's look at each one-by-one:\n\n+ \
    \  - **onMessage**: As we discussed previously, WSDL 2.0 defined MEP or message\
    \ exchange patterns. The idea behind it is that of the message invocation patterns\
    \ between the client and the server. The client can send two messages and get\
    \ one response (in-in-out), or the client sends the request and gets the response\
    \ (in-out), and so on. The idea behind onMessage is to invoke user action when\
    \ a message is received. In our implementation, we have to print the message,\
    \ but depending on the requirements, we can implement our code inside the method.\n\
    +   - **onFault**: Sometimes we may receive a fault as part of the service invocation,\
    \ and a user might be interested in that. So this method helps to achieve it.\n\
    +   - **onError**: While invoking the service, if something went wrong at the\
    \ client side, it will use this method to let the user know about it.\n+   - **onComplete**:\
    \ When the MEP is complete, the user will be notified using this method. In this\
    \ example, we terminate the application when Axis2 calls the onComplete method.\
    \ However, in a real application, we can implement our user action there."
