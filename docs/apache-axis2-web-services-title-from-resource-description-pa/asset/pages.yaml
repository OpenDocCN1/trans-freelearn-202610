    </phaseOrder>\n<phaseOrder type=\"OutFaultFlow\">\n    <phase name=\"OperationOutFaultPhase\"\
    />\n    ........................................................\n</phaseOrder>\n\
    ```\n\nSo far, we have discussed the different types of configuration data that\
