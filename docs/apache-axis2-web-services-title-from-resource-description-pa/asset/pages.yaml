- pgno: 282
  md: "When you use Sandesha2, it first creates a sequence (reliable messaging-specific\
    \ session) and sends the messages, and when the client marks the last message,\
    \ it terminates the sequence. In the preceding code sample, the ping1 and ping2\
    \ messages are in the Sandesha2 session, while ping3 is not in the session. Sandesha2\
    \ provides the reliable delivery to ping1 and ping2, but not to ping3.\n\n# Request-reply\
    \ invocation\n\nHere, we provide how to use request-reply message invocation with\
    \ Sandesha2. Just like the preceding example, echo1 and echo2 are in the Sandesha2\
    \ session and they get the reliable support. echo3 does not get the reliable support\
    \ because prior to sending echo3, it sends the last message.\n\n```\npublic class\
    \ EchoClient {\n    private static final String tns = \"http://ws.axis2.apache.org\"\
    ;\n    private final static String echoString = \"echoString\";\n    private static\
    \ String toEPR = \"http://127.0.0.1:8070/axis2/services/RMSampleService\";\n \
    \   private static String CLIENT_REPO = \"Location of Client repository\";\n \
    \   public static void main(String[] args) throws Exception {\n        String\
    \ axis2_xml = CLIENT_REPO + File.separator +\"client_axis2.xml\";\n        ConfigurationContext\
    \ configContext = ConfigurationContextFactory.createConfigurationContextFromFileSystem(CLIENT_REPO,axis2_xml);\n\
    \n```\n\nCreating the client:\n\n```\nServiceClient serviceClient = new ServiceClient\
    \ (configContext,null);\nOptions clientOptions = new Options ();\nclientOptions.setTo(new\
    \ EndpointReference (toEPR));\nclientOptions.setUseSeparateListener(true);\nserviceClient.setOptions(clientOptions);\n\
    serviceClient.engageModule(new QName (\"sandesha2\"));\nserviceClient.engageModule(new\
    \ QName (\"addressing\"));\nCallback callback1 = new TestCallback (\"Callback1\"\
    );\n```\n\nInvoking the service (first time):\n\n```\nserviceClient.sendReceiveNonBlocking\
    \ (createElement(\"echo1\"),callback1);\nCallback callback2 = new TestCallback\
    \ (\"Callback2\");\n```"
