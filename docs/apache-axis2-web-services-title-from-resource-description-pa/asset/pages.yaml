  md: "The preceding code snippet has the password callback class we will be using\
    \ for this sample. As you can see, we have hardcoded the password; but when you\
    \ write complex callback classes, you can retrieve the logic and set the correct\
    \ password.\n\n# Creating the policy element\n\nRampart uses policy-based configuration\
    \ for its server and client side. So to configure the service, we need to provide\
    \ the required WS-policy configuration. Here we are not going to discuss the WS-policy\
    \ in detail. We simply provide the required policy configuration for the service,\
    \ as shown in the following code snippet:\n\n```\n<wsp:Policy wsu:Id=\"UsernameTokenOverHTTPS\"\
    \n    xmlns:wsu=\"http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wsssecurity-utility-1.0.xsd\"\
    \n    xmlns:wsp=\"http://schemas.xmlsoap.org/ws/2004/09/policy\">\n    <wsp:ExactlyOne>\n\
    \        <wsp:All>\n            <sp:TransportBinding\n            xmlns:sp=\"\
    http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\">\n                <wsp:Policy>\n\
    \                    <sp:TransportToken>\n                        <wsp:Policy>\n\
    \                            <sp:HttpsToken\n                            </wsp:Policy>\n\
    \                        </sp:TransportToken>\n                        <sp:AlgorithmSuite>\n\
    \                            <wsp:Policy>\n                                <sp:Basic256/>\n\
    \                            </wsp:Policy>\n                        </sp:AlgorithmSuite>\n\
    \                        <sp:Layout>\n                            <wsp:Policy>\n\
    \                                <sp:Lax/>\n                            </wsp:Policy>\n\
    \                        </sp:Layout>\n                        <sp:IncludeTimestamp/>\n\
    \                    </wsp:Policy>\n                </sp:TransportBinding>\n \
    \               <sp:SignedSupportingTokens xmlns:sp=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\"\
    >\n                    <wsp:Policy>\n                        <sp:UsernameToken\
    \ sp:IncludeToken=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy/IncludeToken/AlwaysToRecipient\"\
    \ />\n                    </wsp:Policy>\n                </sp:SignedSupportingTokens>\n\
    ```"
