- pgno: 87
  md: '# 5

    Deployment Model


    Now the trend is not just to have features, but to have them in a very user-friendly
    manner. Time is the only thing they care about, and no one likes to spend days
    doing a small thing. In the previous versions of Apache Axis, user friendliness
    did not have a high priority because those were mainly to prove the web service
    concepts. Therefore, in Axis 1.x, the user has to invoke the admin client manually,
    update the server `classpath`, and then restart the server to apply the changes.
    This burdensome deployment model was a definite barrier for beginners. Therefore,
    Axis2 was engineered to overcome this drawback and provide a flexible, user-friendly,
    and an easily configurable deployment model.


    In this chapter, we will be discussing:


    +   - The Axis2 deployment model, specifically the archive-based deployment model

    +   - Hot deployment and hot update

    +   - The concept of repository

    +   - The different deployment descriptors

    +   - A few hands on examples'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# What is new in Axis2 deployment?


    As mentioned in Chapter 1, Apache Web Services and Axis2, one of the main goals
    of the Axis2 design is to provide more user friendliness; in the meantime, providing
    better extendibility and flexibility to the system. When it comes to user friendliness,
    service deployment is one area where the user needs less work. As a result, Axis2
    supports a very convenient deployment model with a number of new features, compared
    to Apache Axis1. Some of the commonly used and useful sets of features are shown
    here:


    +   - J2EE-like deployment mechanism (archive-based)

    +   - Hot deployment and hot update

    +   - Idea of repository

    +   - Change in the way of deploying handlers (modules)

    +   - Deployment descriptors

    +   - Deployment options


    The following figure shows the J2EE-like deployment mechanism:


    ![](img/e2fb05de168053e6227dab034eff9353_88_0.png)


    In any J2EE application server, you can deploy an application as a self-contained
    package, where you can bundle all your resources, configuration files, and binary
    files together into one file, and deploy it.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Isn''t that easy and useful? Well, the obvious answer is yes, it is useful.


    This is why Axis2 has introduced the same mechanism to deploy services (and modules)
    as well in a very convenient manner.


    Let''s think about a scenario where you have a service with several third-party
    dependencies and a number of property files. Further, assume that you do not have
    a J2EE-like deployment mechanism. Then what you have to do is put all those dependent
    JAR files and property files into the application classpath. This work is doubled
    if you have one or two servers, but what will happen if you are in a clustered
    environment with hundreds of replicates? In that case, it won''t be practical
    to go and add the dependent JAR files and other resources into the classpath of
    each and every replica. So when you have the J2EE-like deployment mechanism, you
    do not need to worry about such issues. You can just drop the self-contained package—in
    this case, the service archive file—into the replicates. This definitely reduces
    your work and prevents common human errors as well.


    The internal structure of the Axis2 self-contained package (or archive file) is
    as shown in the following figure. Both the Axis2 services archive and the module
    archive have a very similar structure, with only minor disparities.


    In the case of the Axis service archive, the descriptor.xml file becomes services.xml,
    and in the other case, it becomes module.xml.


    File extension for the Axis2 service archive is .aar and that for the module is
    .mar (the service archive or module archive is just a ZIP file with a changed
    file extension to .aar or .mar).


    ![](img/e2fb05de168053e6227dab034eff9353_89_0.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'As mentioned earlier, in the case of a service the `descriptor.xml` file would
    be `services.xml`. So in the service archive file, you can find a file called
    `services.xml` inside the `META-INF` directory. On the other hand, for the module
    archive, `META-INF` will have a file called `module.xml`.


    +   - For a service archive: `descriptor.xml ---> services.xml`

    +   - For a module archive: `descriptor.xml ---> module.xml`


    # Hot deployment and hot update


    Availability is a big concern when it comes to enterprise-level applications,
    and in such a situation, even a fraction of time is highly valuable. Therefore,
    restarting a server is not a realistic option, and what is required is to update
    and change the system without shutting it down. This is where the hot deployment
    and hot update come into the picture. When your application has those features,
    you do not need to shut the system down in order to update the system.


    Though the concepts of hot deployment and hot update are not new terminologies
    to the technical paradigm, these are new features in the Apache web service stack
    Axis.


    In Axis2, hot deployment and hot update work by constantly monitoring the changes
    in the repository by a timer. More specifically, when the user changes the last
    modified date of a given file, it will treat it as a hot update. In contrast,
    when it finds a new file it treats it as a hot deployment. The architecture of
    hot deployment is shown in the figure in the next section.


    # Hot deployment


    **Hot deployment** is the capability of deploying new services while the system
    is up and running. As an example, let''s say that you have two services, *service1*
    and *service2*, up and running, and you deploy a new service called *service3*
    without shutting the system down. The system then makes *service3* a running service
    as well. This particular scenario is called hot deployment.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/e2fb05de168053e6227dab034eff9353_91_0.png)


    As a system administrator, if you do not like the hot deployment of a service,
    you can turn that off easily by changing the Axis2 global configuration file called
    axis2.xml. Changing the global configuration is just changing a parameter, shown
    as follows:


    ```

    <parameter name="hotdeployment">false</parameter>

    ```


    # Hot update


    A hot update is the ability to make changes to an existing web service without
    shutting down the system. This is an important feature and is required in a testing
    environment. However, it is not advisable to use a hot update in a real-time system,
    because a hot update could result in the system leading into an unknown state.
    Additionally, there is a possibility of loosening the existing service data of
    that service. To prevent this, Axis2 comes with the hot update parameter set to
    FALSE by default, and if you want to have this feature, you could do that by changing
    the configuration parameter as follows:


    ```

    <parameter name="hotupdate">true</parameter>

    ```


    # Repository


    The Axis2 repository is just a directory in the filesystem with a specific structure.
    On the other hand, the repository can be located locally or in a remote machine.
    The idea of a repository was introduced to support archive-based deployment and
    hot deployment features in a very convenient manner.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'The repository directory consists of two main sub directories called `services`
    and `modules`. Also, you may have an optional sub directory called `lib` as well.
    If you want to deploy a service, you need to drop the service archive file into
    the `services` directory. Similarly, if you want to deploy a module, then you
    need to drop a module archive file into the `modules` directory. The idea behind
    the `lib` directory is to store the third-party libraries that are going to be
    shared across both services and modules. Refer to the next screenshot to see the
    directory structure:


    ![](img/e2fb05de168053e6227dab034eff9353_92_0.png)


    If one or more modules in the `modules` directory are required to share some resources,
    then they can add those resources into the `lib` directory inside the `modules`
    directory. Similarly, if the services in the `services` directory want to share
    some common resources, the proper place is the `lib` directory inside the `services`
    directory.


    # Change in the way of deploying handlers (modules)


    The concept of **service extension** is a new feature to the Apache Axis paradigm,
    but the developers have achieved the same goal doing a hard job in Axis 1.x. So
    the idea is to extend the core functionality of the system or to provide quality
    of services. In the case of Axis 1.x, if you need to extend its core functionality,
    you need to write a handler (the smallest unit in the execution chain), change
    the global configuration files to add the handler, and finally restart the system.'
  merge: -1
  img_proc: true
