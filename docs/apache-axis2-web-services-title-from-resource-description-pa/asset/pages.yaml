- pgno: 223
  md: '# # AvoidInitiation


    This parameter indicates whether the cluster has to be automatically initialized
    when the `AxisConfiguration` is built. If set to true, the initialization will
    not be done at that stage, and some other party will have to explicitly initialize
    the cluster. In the case where Axis2 is embedded by third parties, they may need
    to take control over the cluster initialization process. Hence this parameter
    has been provided. For example, we can set this parameter to true so that the
    cluster can be initialized after the server has completely started and the relevant
    transports have been initialized.


    # # membershipScheme


    The membership scheme is used in this setup. The only values supported at the
    moment are multicast and WKA.


    +   - **multicast:** Multicast-based membership management. Membership is automatically
    discovered using multicasting. In order for this to work, multicasting should
    be allowed in the network and all members in the cluster should use the same multicast
    address (as defined by the `mcastAddress` parameter) and the exact multicast port
    (as defined by the `mcastPort` parameter).

    +   - **Well-known address (WKA):** Membership management based on well-known
    address. Membership is discovered with the help of one or more nodes running at
    a well-known address. New members joining a cluster will first connect to a well-known
    node, register with the well-known node, and get the membership list from it.
    When new members join, one of the well-known nodes will notify the others in the
    group. When a member leaves the cluster, or is deemed to have left the cluster,
    it will be detected by the **Group Membership Service (GMS)** using a TCP ping
    mechanism. WKA-based membership is necessary when multicast-based membership discovery
    is not possible. For example, on Amazon EC2, multicasting is not allowed and there
    is no control over the IP address assigned to EC2 instances. Hence, in such a
    scenario, WKA-based membership discovery tends to be used.


    # # domain


    The clustering domain/group: Note that the words ''domain'' and ''group'' are
    used synonymously. There will not be any interference between nodes in different
    groups. Messages received from members outside the group will generally be ignored.
    However, special messages, such as cluster management messages or membership messages
    from members outside the group will be allowed.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# synchronizeAll


    When a web service request is received, and processed, should we update the states
    of all members in the cluster prior to the response being sent to the client?
    If the value of this parameter is set to true, the response to the client will
    be sent only after all the members have been updated. Obviously, this can be time
    consuming. In some cases, where this overhead may not be acceptable, the value
    of this parameter should be set to false. The risk in this case will be that all
    members will not be in the same state when the response is sent to the client.
    This condition will have to be handled by the user. In summary, this parameter
    defines whether or not we should synchronize the state of all members in the group
    before we send the response to the client.


    # maxRetries


    This defines the maximum number of times we need to retry to send a message to
    a particular member before giving up and considering that node to be faulty. After
    reaching the maxRetries number of retries, we give up.


    # mcastAddress


    This is the multicast address to be used. This parameter will only be taken into
    consideration when the membershipScheme is set to multicast.


    # mcastPort


    This is the multicast port to be used. This parameter will only be taken into
    consideration when the membershipScheme is set to multicast.


    # mcastFrequency


    This defines the frequency of sending membership multicast messages. The value
    should be specified in milliseconds. This parameter will only be taken into consideration
    when the membershipScheme is set to multicast.


    # memberDropTime


    This defines the time interval within which, if a member does not respond, the
    member is deemed to have left the group. The value should be specified in milliseconds.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# mcastBindAddress


    This defines the IP address of the network interface to which the multicasting
    has to be bound to. Multicasting would be done using this interface. This parameter
    will only be taken into consideration when the `membershipScheme` is set to `multicast`.
    Note that this can be different from the `localMemberHost` parameter. So we can
    listen for point-to-point messages on the `localMemberHost` network interface,
    while listening for multicast messages on the network interface bound to the `mcastBindAddress`.


    # localMemberHost


    This defines the hostname or IP address of this member. This is the IP address
    advertised by this member when it joins the group and sends messages. This should
    be set to a valid value other than localhost or 127.0.0.1. In most cases, it would
    suffice to set it to the IP address bound to the network interface, which is used
    for communicating with members in the group.


    # localMemberPort


    This defines the TCP port used by this member. This is the port through which
    other members will contact this member. The default value for this port is 4000.


    # preserveMessageOrder


    This parameter indicates that message ordering should be preserved. This will
    be done according to the sender order. The default value for this parameter is
    true.


    # atmostOnceMessageSemantics


    This parameter indicates that atmost once message processing semantics need to
    be maintained. It guarantees that a given clustering message will be delivered
    at most once to the target process or node. The default value for this parameter
    is true.'
  merge: -1
  img_proc: true
- pgno: 226
  md: "# properties\n\nThere are properties specific to this member. These properties\
    \ are simply name-value pairs. When a member joins groups, these properties are\
    \ bound to this member so that other members in the group can detect these properties.\
    \ These properties can be used in cases where central cluster management needs\
    \ to be carried out.\nFor example: Let's think of a situation where an Axis2 cluster\
    \ can be managed by a separate server. Each Axis2 member will provide two member\
    \ properties, namely, backendServerURL and mgtConsoleURL. The backendServerURL\
    \ property is used to connect to the backend management web services of a member.\
    \ Similarly, if this member wishes to expose its own management console, it can\
    \ do so by providing the \"mgtConsoleURL\" property. The backendServerURL property\
    \ is specified using the <property name=\"backendServerURL\" value=\"https://${hostName}:${httpsPort}/services/\"\
    /> entry. Here, ${hostName} signifies the hostName member property and ${httpsPort}\
    \ denotes the httpsPort member property. hostName and httpsPort are two implicit\
    \ member properties. httpPort is another implicit member property. Properties\
    \ that have been previously declared can be used in subsequent property definitions.\
    \ For example, we may define a new property as follows: <property name=\"foo\"\
    \ value=\"${backendServerURL}/foo\"/>\n\n# State management\n\nThe stateManager\
    \ element needs to be enabled if you are required to synchronize state across\
    \ members in a cluster group. An implementation of the org.apache.axis2.clustering.state.StateManager\
    \ needs to be provided as the value of the class attribute. In the default Apache\
    \ Tribes-based implementation, we provide the org.apache.axis2.clustering.state.DefaultStateManager\
    \ class. The user can choose not to replicate certain properties. This is done\
    \ by providing a property name pattern. Let us look at the following example:\n\
    \n```\n<stateManager class=\"org.apache.axis2.clustering.state.DefaultStateManager\"\
    \ enable=\"true\">\n  <replication>\n    <defaults>\n      <exclude name=\"local_*\"\
    />\n      <exclude name=\"LOCAL_*\"/>\n    </defaults>\n    <context class=\"\
    org.apache.axis2.context.ConfigurationContext\">\n      <exclude name=\"UseAsyncOperations\"\
    />\n      <exclude name=\"SequencePropertyBeanMap\"/>\n    </context>\n    <context\
    \ class=\"org.apache.axis2.context.ServiceGroupContext\">\n      <exclude name=\"\
    my.sandesha.*\"/>\n    </context>\n  </replication>\n</stateManager>\n```"
  merge: -1
  img_proc: true
