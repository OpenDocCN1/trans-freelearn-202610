  md: "# javax.xml.ws.WebFault\n\nThis annotation is generated by the JAX-WS tools\
    \ into service-specific exception classes generated from a WSDL to customize the\
    \ local and namespace name of the fault element and the name of the fault bean\
    \ and to mark the service-specific exception as one generated from WSDL. It contains\
    \ three attributes—name, targetNamespace, and faultBean.\n\n# name\n\nThis property\
    \ defines the local name of the XML element representing the corresponding fault\
    \ in the WSDL, and the default value is \"\" (an empty string).\n\n# targetNamespace\n\
    \nThis property defines the namespace of the XML element representing the corresponding\
    \ fault in the WSDL, and the default value is \"\" (an empty string).\n\n# faultBean\n\
    \nThis property defines the qualified name of the Java class that represents the\
    \ details of the fault message, and the default value is an empty string \"\"\
    .\n\nThe following example shows the usage of this annotation:\n\n```\n@javax.xml.ws.WebFault(name=\"\
    AddNumbersException\",\n                targetNamespace=\"http://axis.apache.org/axis2/\n\
    \    jaxws\")\npublic class AddNumbersException_Exception extends Exception {\n\
    \    private org.apache.axis2.jaxws.AddNumbersException fault;\n}\n```\n\n# javax.xml.ws.WebServiceClient\n\
    \nThe information specified in this annotation is sufficient to uniquely identify\
    \ a wsdl:service element inside a WSDL document. This wsdl:service element represents\
    \ the web service for which the generated service interface provides a client\
    \ view. This annotation can contain three attributes—name, targetNamespace, and\
    \ wsdlLocation.\n\n# name\n\nThis property defines the local name of the wsdl:serviceName\
    \ in the WSDL, and the default value is \"\"."
