  md: '# Message Transmission Optimization Mechanism (MTOM)


    Regardless of the flexibility, interoperability, and global acceptance of XML,
    there are times when serializing data into XML just does not make sense. Web services
    users may want to transmit binary attachments of various sorts such as images,
    drawings, XML documents, and so on. together with a SOAP message. Such data is
    often originally available in a particular binary format.


    There are two traditional approaches to dealing with the sending of binary data
    in XML.


    # By value


    Sending binary data by value is achieved by embedding opaque data (after some
    form of encoding has taken place of course) as an element or an attribute content
    of the XML component of data. The main advantage of this technique is that it
    gives applications the ability to process and describe data based only on the
    XML component of the data. XML supports opaque data as content through the use
    of either base64 or hexadecimal text encoding. Unfortunately, both of these techniques
    bloat the size of the data. For underlying text encoding of UTF-8, base64 encoding
    increases the size of the binary data by a factor of nearly 1.33 of the original
    size, while hexadecimal encoding expands data by a factor of about 2. The above
    factors will be doubled if UTF-16 text encoding is used. Also of concern is the
    overhead in processing costs (both real and perceived) for these formats, especially
    when decoding back into raw binary data.


    # By reference


    Sending binary data by reference is achieved by attaching pure binary data as
    external unparsed general entities outside the XML document and then embedding
    reference URIs to those entities as elements or attribute values in the XML. This
    prevents the unnecessary bloating of data and the waste of processing power. The
    primary obstacle for using these unparsed entities is their heavy reliance on
    DTDs, which impedes modularity as well as the use of XML namespaces. There were
    several specifications introduced in the web services world to deal with this
    binary attachment problem using the "by reference" technique; SOAP with Attachments
    (SWA) is one such example. Since SOAP prohibits document type declarations (DTD)
    in messages, this leads to the problem of not representing the data as part of
    the message infoset, thereby creating two data models. This scenario is akin to
    sending attachments with an e-mail message. Even though these attachments are
    related to the message content, they are not contained inside the message. This
    causes the'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'technologies that process and describe the data based on the XML component
    of the data to malfunction. One such example is WS-Security.


    MTOM is another specification that focuses on solving the ''attachments'' problem.
    MTOM tries to leverage the advantages of the above two techniques by attempting
    to merge them. MTOM is clearly a ''by reference'' method. The wire format of an
    MTOM optimized message is the same as a SOAP with Attachments message, which makes
    it backward compatible with SwA endpoints. The most notable feature of MTOM is
    the use of the XOP: Include element, which is defined in the XML Binary Optimized
    Packaging (XOP) specification to refer to the binary attachments (external unparsed
    general entities) of the message. With the use of this exclusive element, the
    attached binary content logically becomes inline (by value) with the SOAP document,
    even though it is actually attached separately. This merges the two realms by
    making it possible to work only with one data model. This allows the applications
    to process and describe the data by only looking at the XML part, making the reliance
    on DTDs obsolete. On another note, MTOM has standardized the referencing mechanism
    of SwA.


    AXIOM (see Chapter 3, Axis 2 XML Model (AXIOM)), used in Axis2, is an Object Model
    that has the ability to hold binary data. It has this ability since OMText can
    hold raw binary content in the form of a javax.activation.DataHandler class. OMText
    has been chosen for this purpose for two reasons. One is that XOP (MTOM) is capable
    of optimizing only base64-encoded Infoset data that is in the canonical lexical
    form of XML Schema base64Binary datatype. The other reason is to preserve the
    infoset in both the sender and receiver (to store the binary content in the same
    kind of object, regardless of whether it is optimized or not). MTOM allows you
    to selectively encode portions of the message, which facilitates the sending of
    base64encoded data as well as externally attached raw binary data referenced by
    the ''XOP'' element (optimized content) to be sent in a SOAP message. You can
    specify whether an OMText node that contains raw binary data or base64encoded
    binary data is qualified to be optimized at the time of construction of that node
    or later. For optimum efficiency of MTOM, a user is advised to send smaller binary
    attachments using base64encoding (non-optimized) and larger attachments as optimized
    content.


    ```

    OMElement imageElement = fac.createOMElement("image", omNs);


    // Creating the Data Handler for the file. Any implementation of

    // javax.activation.DataSource interface can fit here.

    javax.activation.DataHandler dataHandler = new javax.activation.

    DataHandler(new FileDataSource("SomeFile"));


    //create an OMText node with the above DataHandler and set optimized

    to true

    OMText textData = fac.createOMText(dataHandler, true);

    imageElement.addChild(textData);

    ```'
