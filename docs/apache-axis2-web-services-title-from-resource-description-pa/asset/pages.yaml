- pgno: 135
  md: '# 8


    # Writing an Axis2 Module


    Web services are gaining a lot of popularity in the industry and have become one
    of the major enabler for application integration. In addition, due to the flexibility
    and advantages of using web services, everyone is trying to enable web service
    support for their applications. As a result, web service frameworks need to support
    new and more custom requirements. As we have already discussed in the previous
    chapters, one of the major goals of a web service framework is to deliver incoming
    messages into the target service. However, just delivering the message to the
    service is not enough; today''s applications are required to have reliability,
    security, transaction, and other quality services.


    Due to the popularity of web services, standard bodies are producing new web service
    standards, and it is hard to support those new standards if the web service framework
    is not flexible enough. From the very beginnings of Axis2, flexibility and extensibility
    were the two main design considerations. The idea of Axis2 modules is to extend
    the core functionality of the system without performing any changes to the core
    system. For example, Axis2 supports reliability and security as two separate modules,
    and the core engine is fully independent of those two qualities of service modules.


    In this chapter, we will discuss the power of Axis2 modules and how to use them
    to extend Axis2 to support for your own requirements. In particular, we will discuss
    the following items:


    +   - Brief history of the Axis2 module

    +   - Introducing module concept

    +   - Structure of the module

    +   - Module configuration file (`module.xml`)

    +   - Optional module implementation class

    +   - Steps to writing a `module.xml` file

    +   - Deploying and engaging a module

    +   - Brief overview of the WS-Policy and its usage in modules'
  merge: -1
