    \"true\");\nCallback callback3 = new TestCallback (\"Callback3\");\n```\n\n# Invoking\
    \ the service (third time):\n\n```\nserviceClient.sendReceiveNonBlocking(createElement(\"\
    echo3\"),callback3);\nwhile (!callback3.isComplete()) {\n    Thread.sleep(1000);\n\
