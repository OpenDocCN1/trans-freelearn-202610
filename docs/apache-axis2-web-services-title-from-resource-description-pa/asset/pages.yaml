- pgno: 246
  md: '# OpenESB


    **OpenESB** is an open source **Java Business Integration (JBI)** standard-centric
    Enterprise Service Bus, originally from Sun Microsystems, now Oracle Inc. JBI
    is built on a web services model and provides a pluggable architecture for a container
    that hosts service producer and consumer components. Services connect to the container
    via binding components or can be hosted inside the container as part of a service
    engine. The services model used is Web Services Description Language (WSDL) 2.0.
    Open ESB consists of a runtime, a design time, and a management console. The runtime
    consists of a lightweight JBI core and several components. OpenESB comes with
    several components for data transformation, orchestration, and connectivity. There
    is support for HTTP and web services, JMS, databases, MQ Series, SAP, IMS, HL7,
    and others. Logic can be expressed in BPEL, EJBs, or POJOs.


    In the rest of this chapter, we will be looking at the following SOA integration
    patterns. Please note that Apache Synapse has been shown as the ESB in the diagrams,
    but it can be replaced by any of the ESBs we have discussed in this chapter:


    +   - Protocol bridging

    +   - External authentication and authorization

    +   - Dynamic routing combined with auditing

    +   - **Event Driven Architecture (EDA)** with **Master Data Management (MDM)**

    +   - Push and pull

    +   - Fault tolerant autoscaling with dynamic load balancing


    # Protocol bridging


    **Protocol bridging** refers to the request coming on one transport protocol,
    and being sent in for processing on a different protocol. For example, the corporate
    policy may dictate that all incoming traffic should be on HTTPS. Some web services
    may exist that are exposed only via a transport such as JMX. In such a case, there
    should be a way of bridging from HTTPS to JMX. Furthermore, the backend web services,
    which may be deployed on Axis2, may be highly secured within a **High Security
    Zone (HSZ)**, and the policies may dictate that only certain calls from the **Demilitarized
    Zone (DMZ)** can be made to those web services. We may also implement message
    validation and request throttling outside the highly secured LAN. This scenario
    is shown in the following figure. External web service clients talk to the endpoints
    on the ESB in the DMZ. This ESB will run validations and other Qualities of Service
    (QoS) functionality on these incoming messages, and if those messages meet the
    requirements, it will switch to a protocol that is compatible with the backend
    service deployment, and send the message into the LAN.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'In the following figure, we have shown another optional ESB deployment, which
    can further deal with things such as transformations. However, that ESB can be
    omitted, if required, and the request can be directly routed to Axis2. Once Axis2
    receives the request, it will dispatch it to the relevant web service and send
    the response back. The ESB in the DMZ will again perform a protocol transformation,
    and send the response back to the client that originated the request.


    ![](img/e2fb05de168053e6227dab034eff9353_247_0.png)


    # External authentication and authorization


    In medium to large scale enterprise deployments, authentication and authorization
    are handled by an external identity management server such as WSO2 Identity Server.
    The web service client or the server can participate in authentication and authorization.'
  merge: -1
  img_proc: true
- pgno: 248
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 249
  md: 'In these two scenarios, authentication and authorization handling can be done
    within a pure Axis2 instance as well, but the reason for bringing in an ESB into
    the picture is to handle all authentication and authorization functionality in
    one central place. Otherwise, if there are multiple Axis2 instances in an enterprise
    deployment, each of those Axis2 instances would have to separately talk to the
    identity management server. In addition, additional mediation steps can be introduced
    in the ESB, when the system evolves over time.


    # Dynamic routing combined with auditing


    In some enterprise deployments, there is a requirement to route the request to
    different Axis2 service implementations or different Axis2 servers, depending
    on certain criteria or other parameters such as the time of the day. For example,
    during the peak hours, requests may be routed to a server having more resources
    in terms of memory and processing power. In some cases, the requests may need
    more processing power, depending on the input parameter values. Requests are dynamically
    routed in order to optimize resource usage and maintain throughput. Note that
    the service contracts will not change and only the service implementation or deployment
    location will change. Hence this is transparent to the client.


    Dynamic routing may be combined with auditing. In this case, each of the requests,
    along with other relevant metadata, will be asynchronously logged into a file
    or database for future auditing purposes.


    As shown in the following figure, the Synapse ESB is used as a dynamic router
    and the central point for auditing. The Synapse configuration is loaded from a
    configuration repository and this configuration can change over the course of
    the day so that requests are dynamically routed to different Axis2 service implementations
    or Axis2 servers. A log mediator is used for logging the incoming requests and
    outgoing responses to a database. In the case where the Synapse configuration
    is changed at preconfigured times of the day, the server is put into maintenance
    mode using the JMX management API.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'In maintenance mode, a server will temporarily stop accepting new requests,
    but will continue to serve the requests that have already been received. Once
    all the existing requests are served, the new configuration will be loaded, and
    the Synapse server will be initialized with the new configuration. Reloading the
    configuration can either be done manually or can be automated using a Cron job
    or task that runs a script.


    ![](img/e2fb05de168053e6227dab034eff9353_250_0.png)


    # Event Driven Architecture (EDA) with Master Data Management (MDM) for Integrating
    Legacy Systems


    This pattern is a combination of Event Driven Architecture (EDA) and Master Data
    Management (MDM). You will see how legacy systems can be SOA-enabled and integrated
    using this pattern.


    # Event Driven Architecture (EDA)


    Event Driven Architecture (EDA) is a software architecture pattern where the system
    runs based on the creation, consumption, and reaction to events. Eventing is one
    of the popular ways of decoupling SOA systems. In fact, an event-driven architecture
    is extremely loosely coupled and well distributed. An event can be anything; any
    message can be considered an event.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Master Data Management (MDM)


    **Master data** refers to the information that is key to the operation of a business.
    This information may include data about customers, products, employees, suppliers,
    and so on. Master data is non-transactional in nature, but can support transactional
    processes and operations. Master data is often used by several functional groups
    and stored in different data systems across an organization and may or may not
    be referenced centrally. Therefore, the possibility exists for duplicate and/or
    inaccurate master data. MDM comprises a set of processes and tools that consistently
    defines and manages the master data. The objective of MDM is to provide processes
    for collecting, aggregating, matching, consolidating, quality-assuring, persisting,
    and distributing master data throughout an organization to ensure consistency
    and control in the ongoing maintenance and application use of this information.


    Most legacy systems in an organization have different representations of the same
    master data. This is one of the main challenges in integrating these legacy systems.
    We will look at how EDA with MDM can be used for integrating such legacy systems.


    ![](img/e2fb05de168053e6227dab034eff9353_251_0.png)'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'We will demonstrate EDA with MDM using the example scenario illustrated in
    the preceding figure. Systems 1-3 are legacy systems that have different representations
    of the master data of the organization. For example, a Person entity is represented
    in one format in System 1 and in a different format in Systems 2 and 3. These
    systems have their own databases to store the master data. When new master data
    is added or existing master data is changed in one system, all other systems have
    to be notified so that they can correspondingly update their databases. Let us
    look into each of the subsystems in detail.


    # Adaptor layer


    We use Axis2 Web Service-based adaptors to integrate these systems. The adaptors
    play a dual role; they natively communicate with the respective backend legacy
    systems and publish events when a change in the master data of the corresponding
    legacy system takes place. These adaptors can also be considered as converters
    that convert **Generic Business Objects (GBO)** into **Application Specific Business
    Objects (ASBO)**. Each adaptor is interested in changes only to specific master
    data types. Hence, each of these adaptors will subscribe to specific event types,
    represented by different topic spaces. The Axis2 Savan module-based WS-Eventing
    is used here. When events to these specific topics are published by the event
    server, they will be picked up by the relevant adaptors. Similarly, when master
    data changes, each adaptor will publish events to the relevant topic. The adaptor
    web services are deployed on the same logical Axis2 server, which can physically
    be deployed as a cluster.


    # Integration server


    The **Integration server** is a Synapse server that acts as an event broker. This
    server is responsible for managing WS-Eventing subscriptions. The adaptors deployed
    on the adaptor server will be the subscribers. When a particular event is received,
    this server will consult the logic server, and if it is a new event, it will convert
    that into a GBO and publish it to the relevant topics.'
  merge: -1
