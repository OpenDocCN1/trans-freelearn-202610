    +   - `javax.annotation.PreDestroy`\n\n# javax.annotation.Resource\n\nThis annotation\
    \ is used to mark a WebServiceContext resource that is needed by a web service.\
    \ It is applied to a field or a method for JAX-WS endpoints. The container will\
