- pgno: 117
  md: '# 7


    # Writing an Axis2 Service


    In the previous chapters, we introduced and discussed various Axis2 concepts and
    highlighted the importance of them. Starting from this chapter, we are going to
    discuss how to use those concepts in the real world. Each chapter provides you
    with a comprehensive set of examples, which help you to understand the concepts
    clearly. Repeating the example in your own environment would help you to gain
    the most out of each chapter. Axis2 introduces several new features to its web
    services. For example, annotation support, session support, and ways to store
    session-aware data in the information hierarchy, POJO, and Spring-based web services.


    As we have already discussed in the previous chapters, there are two main aspects
    to any given web service framework; firstly, to provide a hosting environment
    for web services, and secondly, to provide an invocation framework to access a
    remote service. Hosting a service includes implementing a service, deployment
    of the service, and lifecycle management of the service. In Chapter5, we briefly
    discussed a number of different ways to deploy a service. Here, in this chapter,
    we are going to discuss how to implement a service and deploy it on the Axis2
    Web Service hosting environment. Moreover, in this chapter, we will cover the
    two fundamental approaches that are commonly used in the industry to create web
    services. At the end of this chapter, you will have a good understanding of how
    to create a web service and deploy it in Axis2. In Chapter 9, The Client API,
    we will discuss how to consume a web service deployed in Axis2 or elsewhere.'
  merge: -1
