- pgno: 27
  md: 'The main functionality of WS-I is to provide standards and specifications to
    ensure interoperability, composablity, and profiling. In other words, to create
    standards and procedures to enforce the required level of interoperability among
    various web service frameworks. OASIS''s main goal is to improve the quality of
    services of web services, which include security, reliability, transaction, and
    resource management. W3C, one of the web services standard bodies, defines a web
    service as a software system designed to support interoperable machine-to-machine
    interaction over a network. It has an interface described in a format that can
    be processed by machine and read by human. The format is known as **Web Services
    Description Language (WSDL)**. Other applications communicate with the web service
    in a manner prescribed by its description using **Simple Object Access Protocol
    (SOAP)** messages, typically conveyed using HTTP with an XML serialization, in
    conjunction with other web-related standards.


    A web service is a well-known open technology standard, which provides a number
    of benefits as listed here:


    +   - Increased interoperability, resulting in lower maintenance costs

    +   - Increased reusability and composablity (for example, use publicly available
    services and reuse them or integrate them to provide new services)

    +   - Increased competition among vendors, resulting in lower product costs

    +   - Easy transition from one product to another, resulting in lower training
    costs

    +   - Greater degree of adoption and longevity for a standard, a large degree
    of usage from vendors and users leading to a higher degree of acceptance


    One can argue that the web service concept is the logical evolution from object-oriented
    systems to systems of services. As in object-oriented systems, some of the fundamental
    concepts in web services are encapsulation, message passing, and dynamic binding.
    However, the service-based concept is extended beyond method signatures, as information
    related to what the service does, where it is located, how it is invoked, the
    quality of service, and security policy related to the service can also be published
    in the service interface (WSDL).


    # How do organizations move into web services?


    There are three main ways in which an organization could possibly use to move
    into the web services, listed next:


    +   - Create a new web service from scratch. The developer creates the functionalities
    of the services as well as the description.'
  merge: -1
  img_proc: true
