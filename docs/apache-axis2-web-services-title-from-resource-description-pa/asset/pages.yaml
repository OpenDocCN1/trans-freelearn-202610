- pgno: 71
  md: '# 4

    Execution Chain


    The key functionality of any given web service framework is processing an incoming
    message and delivering it to the targeted application (service), and once the
    result is produced, delivering it to the client. Today, for business critical
    applications, we need a lot more than just processing the messages. Thus, support,
    for example reliability, security, transactions, and throttling is required. In
    addition, a framework should also be easily extensible to support new customer
    requirements and other quality services. To provide those features, most of the
    SOAP processing frameworks utilize the concept of pipes, where any incoming or
    outgoing message goes through the pipe and the extensible pipe is divided into
    small pieces. Such a piece is known as an interceptor. One can add new interceptors,
    change them, or delete them, to cope with the requirements.


    In this chapter, we will discuss the following topics in more detail:


    +   - Handlers

    +   - Phase

    +   - Phase rules

    +   - Concept of flows

    +   - Some of the default handlers that come with Axis2 distribution'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Handler


    A handler is one of the most important and useful features introduced by the Axis1
    project. In fact, the idea of a handler has been used in the industry for a long
    time. Some refer to handler as the message interceptor. In any messaging system,
    the interceptor has its factual meaning in the context of messaging too, which
    intercepts the messaging flow and does whatever task it is assigned to do. In
    fact, the interceptor is the smallest execution unit in a messaging system so
    that, as the interceptor in Axis, handler does the same thing.


    Handlers, in Axis, are stateless, meaning they do not keep their past execution
    states in memory. A handler can be considered as a logic invoker with the input
    for the logic evaluation taken only from the MessageContext. Handler has both
    read and write access to MessageContext (MC) and to incoming SOAP messages. Thus,
    a handler can read SOAP messages, remove elements from the message (mostly headers),
    add new elements (headers), or modify elements as well as add, delete, or modify
    content from the MessageContext.


    For continuation purposes, we can consider MessageContext as a property bag that
    keeps incoming or outgoing messages and other (maybe both) required parameters
    and properties to carry the message through the execution chain. On the other
    hand, via the MC, we can access the whole system, such as system runtime, global
    parameters, properties services, and operations. We will discuss more operations
    associated with MC in Chapter 6, Information Model.


    In most of the cases, a handler only touches the header block of the SOAP message,
    which will read a header (or headers), add header(s), or remove header(s). However,
    it does not mean that the handler cannot touch the SOAP body. There are situations
    where handlers also process the body; a good example is encryption. In the process
    of reading, if a header is targeted to a handler and if it cannot execute properly
    (message might be faulty), it should throw an exception and the next chain driver
    (in Axis2, it is engine) would take the necessary action. A typical SOAP message
    with some headers is shown in the following figure:


    ![](img/e2fb05de168053e6227dab034eff9353_72_0.png)'
