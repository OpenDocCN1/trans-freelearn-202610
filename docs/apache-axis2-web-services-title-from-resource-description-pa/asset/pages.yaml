- pgno: 104
  md: 'The following figure shows the relationship among various types of descriptions
    or metadata in Axis2:


    ![](img/e2fb05de168053e6227dab034eff9353_104_0.png)


    As we can see, the top-most component in the hierarchy is AxisConfiguration that
    keeps track of all the configuration data, either directly or indirectly. There
    are three major types of objects shown in the figure. Firstly, AxisModule originates
    from a descriptor file called module.xml, so that when we deploy a module in Axis2,
    there will be a new AxisModule object to keep track of that particular module''s
    configuration data. Secondly, the middle object hierarchy is created when we deploy
    a service in Axis2. Finally, there are the transports and other data that are
    read directly from axis2.xml.


    # AxisConfiguration


    AxisConfiguration is the top-most component of the static data hierarchy. Nevertheless,
    it should be noted that although we call AxisConfiguration as a static hierarchy,
    it does not mean that it is immutable. There are a number of instances where it
    changes the content, but these changes are very infrequent. The whole AxisConfiguration
    object is effectively a collection of data coming from axis2.xml, a set of module.xml
    files, and a set of services.xml files. There are many ways to create AxisConfiguration
    as well. One could create an AxisConfiguration using the local filesystem, using
    a remote repository, or even by using a database. We will discuss these options
    in Chapter 15, Building a Secure Reliable Web Service. In this chapter, the focus
    will be on creating an AxisConfiguration using the default axis2.xml file from
    the local filesystem. A typical axis2.xml, which has the bare minimum configuration
    data to start an Axis2 server, is shown in the following figure (a detailed explanation
    of the element structure is given after the figure):'
