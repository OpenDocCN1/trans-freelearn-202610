- pgno: 18
  md: 'Chapter 8, Writing an Axis2 Module - Learn how to extend Axis2 core functionality
    through a self-contained package.


    Chapter 9, The Client API - Learn how to use Axis2 to invoke other services, available
    APIs, and how to use them.


    Chapter 10, Session Management - Go beyond single invocation and learn how to
    use Axis2 features to provide better and more efficient statefull service.


    Chapter 11, Developing JAX-WS Web Services - Learn the fundamentals of developing
    JAXWS based web services, the most popular web service development technology
    used by Java developers.


    Chapter 12, Axis2 Clustering - Learn about clustering Apache Axis2, which will
    allow you to deploy Axis2 in large scale production deployments.


    Chapter 13, Enterprise Integration Patterns - Learn about some enterprise SOA
    deployment patterns that make use of the underlying Axis2 clustering infrastructure.


    Chapter 14, Axis2 Advanced Features and Usage - Go beyond simple features and
    learn about REST, MTOM, and several other advanced features.


    Chapter 15, Building a Secure Reliable Web Service - Learn how to use Axis2 and
    related components to make your service more secure and reliable.


    # What you need for this book


    +   - Java 5 or above (Axis2 support only JDK 1.5 and above)

    +   - Latest version of Axis2 (Axis2 1.5.4)


    # Who this book is for


    This book is for Java developers who are interested in building web services using
    Apache Axis2. Familiarity with web standards such as SOAP, WSDL, and XML parsing
    is assumed.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.'
