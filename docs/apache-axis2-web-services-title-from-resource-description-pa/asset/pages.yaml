    # Asynchronous invocation of JAX-WS services


    JAX-WS supports asynchronous invocation of services from clients. JAX-WS provides
    support for both a callback and polling model when calling web services asynchronously.
    Both the callback model and the polling model are supported by the Dispatch client
    and the Proxy client.


    An asynchronous invocation of a web service sends a request to the service endpoint
    and then immediately returns control to the client without waiting for the response
    to return from the service. JAX-WS asynchronous web service clients consume web
    services using either the callback approach or the polling approach.


    # Polling model


    In the polling model, a client can issue a request and receive a response object
    that is polled to determine if the server has responded. When the server responds,
    the actual response is retrieved. The response object returns the response content
    when the get method is called. The client receives an object of type javax.xml.ws.Response
    from the invokeAsync method. That Response object is used to monitor the status
    of the request to the server, determine when the operation has completed, and
    to retrieve the response results.


    # Callback model


    In the callback model, the client provides a callback handler to accept and process
    the inbound response object. The handleResponse method of the handler is called
    when the result is available. In order to implement an asynchronous invocation
    that uses the callback model, the client provides an AsynchHandler instance to
    accept and process the inbound response object. The client callback handler implements
    the javax.xml.ws.AsynchHandler interface, which contains the application code
    that is executed when an asynchronous response is received from the server. The
    javax.xml.ws.AsynchHandler interface contains the handleResponse(java.xml.ws.Response)
    method that is called after the runtime has received and processed the asynchronous
    response from the server. The response is delivered to the callback handler in
    the form of a javax.xml.ws.Response object. The response object returns the response
    content when the get() method is called.'
