- pgno: 65
  md: "When traversing an Axiom object, you can use the conventional way of navigating\
    \ the tree, where you get a node and look for its children, and then for each\
    \ child node you do the same. Notably, in Axiom you do not get a list, rather\
    \ you get an iterator: the idea is to encapsulate the deferred building by using\
    \ an iterator. The following code sample shows how the children can be accessed.\
    \ The children are of the type OMNode and can either be of type OMText or OMElement.\n\
    \n```\nIterator childNodes = root.getChildren();\nwhile(childNodes.hasNext()){\n\
    \    OMNode node = (OMNode) childNodes.next();\n}\n```\n\nThis method shows how\
    \ to access a list of children using an iterator; in addition to this, once you\
    \ process a particular element, you can get its siblings as well. Moreover, you\
    \ can access previous siblings and next siblings using nextSibling() and previousSibling()\
    \ methods respectively.\n\nYou can also filter only a set of nodes (for example,\
    \ elements with a certain name) using getChildrenWithName(QName) methods, where\
    \ getChildrenWithName(QName) methods returns an iterator with all the child nodes,\
    \ which have the given QName.\n\n# Serialization\n\nNow you have a good understanding\
    \ of creating and traversing the Axiom tree. Therefore, the next most important\
    \ part is to learn how to serialize or write Axiom object model into an output\
    \ stream.\n\nAxiom can be serialized either as the pure object model (for example,\
    \ a set of Java objects) or the pull event stream (for example, writing to a file\
    \ or any other output stream). The serialization uses an XMLStreamWriter object\
    \ to write out the output and hence the same serialization mechanism can be used\
    \ to write different types of outputs (such as text, binary, and others). Although\
    \ not discussed in the book, the current version of Axis2 uses this and provides\
    \ a number of different message formats (for example, REST, JSON, and so on)."
