- pgno: 255
  md: '# Fault tolerant autoscaling with dynamic load balancing


    Fault tolerance, high availability, and scalability are essential prerequisites
    for any enterprise application deployment. One of the major concerns of enterprise
    application architects is avoiding single points of failure. **Autoscaling** refers
    to the behavior where the system scales up when the load increases and scales
    down when the load decreases. Such an approach is essential for cloud deployments
    such as Amazon EC2 where the charge is based on the actual computing power consumed.
    Ideally, from the clients'' point of view, in an autoscaling system, the response
    time should be constant and the overall throughput of the system should increase.
    Dynamic load balancing refers to a mechanism where the load balancer itself uses
    group communication and group membership mechanisms to discover the domains across
    which the load is distributed. In a traditional setup, a single load balancer
    fronts a group of application nodes. In such a scenario, the load balancer can
    be a single point of failure. Traditionally, techniques such as Linux HA have
    been used to overcome this. However, such traditional schemes have quite a bit
    of overhead and also require the backup system to be in close proximity to the
    primary system.


    As shown in the following figure, the clients directly talk to the primary Synapse
    ESB. Synapse can be configured to run as a load balancer. This load balancer will
    route the requests to the Axis2 worker nodes according to a preconfigured load
    balancing algorithm. The load balancer is itself deployed in its own cluster.
    The primary and backup load balancers belong to the same Axis2 clustering domain.
    Remember, Synapse is built on Axis2, hence uses Axis2''s built in clustering mechanism.
    If the primary load balancer fails, the backup load balancer will take over, and
    will become the primary load balancer. It will also start another backup load
    balancer. On the cloud, well-known address-based membership management is used,
    as multicasting is not possible. The primary load balancer will be the well-known
    member. Group management has also been enabled in the primary and backup load
    balancers, so they can detect membership changes in the Axis2 worker node cluster.'
  merge: -1
  img_proc: true
