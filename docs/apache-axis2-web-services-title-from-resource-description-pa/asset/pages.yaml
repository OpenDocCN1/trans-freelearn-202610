    \n# javax.xml.ws.ServiceMode\n\nWeb service endpoints may choose to work at the\
    \ XML message level by implementing the Provider interface. This is achieved by\
    \ implementing either Provider<Source>, Provider<SOAPMessage>, or Provider<DataSource>.\
    \ The endpoint accesses the message or message payload using this low-level, generic\
    \ API. All the Provider endpoints must have the @WebServiceProvider annotation.\
    \ The @ServiceMode annotation is used to convey whether the endpoint wants to\
    \ access the message (Service.Mode.MESSAGE) or payload (Service.Mode.PAYLOAD).\
    \ If there is no @ServiceMode annotation on the endpoint, the payload is the default\
    \ value. This annotation contains a single attribute value, which conveys whether\
    \ the Provider endpoint wants to access the entire message (MESSAGE) or just the\
    \ payload (PAYLOAD), and the default value is PAYLOAD. The following example demonstrates\
    \ the usage of this annotation:\n\n```\n@ServiceMode(value=Service.Mode.PAYLOAD)\n\
    public class AddNumbersImpl implements Provider<Source> {\n    public Source invoke(Source\
    \ source) throws RemoteException {\n    }\n}\n```\n\n# javax.xml.ws.WebEndpoint\n\
    \nThis annotation is used to annotate the getPortName() methods of a generated\
    \ service interface. The information specified in this annotation is sufficient\
    \ to uniquely identify a wsdl:port element inside a wsdl:service. It has a single\
    \ attribute, name, which defines the local name of the XML element representing\
    \ the corresponding port in the WSDL and defaults to \"\" (an empty string). The\
    \ following example demonstrates this annotation:\n\n```\n@WebServiceClient(name\
    \ = \"AddNumbersImplService\",\ntargetNamespace = \"http://axis.apache.org/axis2/jaxws\"\
    , wsdlLocation = \"http://localhost:8080/services/addnumbers?wsdl\")\npublic class\
    \ NumberAdder {\n    ...\n    @WebEndpoint(name = \"AddNumbersImplPort\")\n  \
    \  public AddNumbersImpl getAddNumbersImplPort() {\n        ...\n    }\n}\n```"
