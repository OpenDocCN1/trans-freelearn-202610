  md: "# The Dynamic Proxy client\n\nThe static client programming model for JAX-WS\
    \ is the called the dynamic proxy client. The dynamic proxy client invokes a Web\
    \ service based on a service endpoint interface that is provided. After you create\
    \ the proxy, the client application can invoke methods on the proxy just like\
    \ a standard implementation of those interfaces. For JAX-WS Web service clients\
    \ using the dynamic proxy programming model, use the JAX-WS tool, wsimport, to\
    \ process a WSDL file and generate portable Java artifacts that are used to create\
    \ a Web service client.\n\nIn the following example, the org.apache.types.HelloService\
    \ and org.apache.types.HelloServicePortTye classes have been generated by using\
    \ the wsimport tool that ships with the JDK. The example shows how the generated\
    \ classes can be used in the ProxyClient class. As you can see, unlike in the\
    \ case of the DispatchClient, the number of lines of code is much less, but you\
    \ have less control over what goes on underneath the hood:\n\n```\npackage org.apache.jaxwsclient;\n\
    \nimport org.apache.types.HelloService;\nimport org.apache.types.HelloServicePortType;\n\
    \npublic class ProxyClient {\n    public static void main(String[] args) {\n \
    \       HelloService service = new HelloService();\n        HelloServicePortType\
    \ portType = service.getHelloServiceHttpSoap11Endpoint();\n        System.out.println(portType.greet(\"\
    Packt\"));\n    }\n}\n```\n\n# MTOM with JAX-WS Services\n\nMessage Transmission\
    \ Optimization Mechanism (MTOM) is a method of efficiently sending binary data\
    \ to and from the web services. To use MTOM in JAX-WS services, first of all,\
    \ you will have to use the BindingType annotation to set the binding type to SOAP11\
    \ MTOM. You will be using javax.activation.DataHandler to represent your binary\
    \ data in your parameters or return types. Let us look at an example MTOM enabled\
    \ JAX-WS service. The uploadFile web service operation shows how binary data is\
    \ used as the input parameter to an operation. The following getBinaryTestData\
