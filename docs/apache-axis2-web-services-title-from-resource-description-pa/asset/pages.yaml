- pgno: 153
  md: 'In the case of asynchronous type invocation, the user application (for example,
    GUI) does not block, so the user can continue working. Axis2''s way of utilizing
    a service in asynchronous is shown in the following figure:


    ![](img/e2fb05de168053e6227dab034eff9353_153_0.png)


    The preceding figure shows how a typical asynchronous message works, where the
    application uses Axis2 client and asks to send the message. When calling the Axis2
    client, the application creates a callback object and passes that to the call.
    Axis2 uses the callback and returns the control back to the client. Thus, the
    client does not get blocked. When the reply comes, the Axis2 client uses the callback
    and notifies it, by which, the application gets to know about the message arrival
    as well and acts upon it.


    # Looking into Axis2 client API


    In today''s world, people do not like and do not want to waste time to get a simple
    thing done. Thus, user friendliness is one of the key considerations for any product.
    In Axis2, one of the key designs of the Axis2 client API is to provide asynchronous
    web service invocation support. Meantime, Axis2 has the key consideration of user
    friendliness, so combining both together, the new client API is very convenient
    to work with. To make the web consumer''s or the end user''s job easier, the Axis2
    client API consists of two sub APIs called ServiceClient and OperationClient,
    one for average users and the other for advanced users, respectively.


    # ServiceClient API


    As we mentioned earlier, ServiceClient is mainly designed for average users or
    the users who have just moved to the web services field. Nevertheless, it has
    the notion of interacting with a service and providing all the necessary support
    to invoke any complex type of web service. Let''s assume a calculator as an example
    of a web service, and further assume that the service has operations such as "add",
    "deduct", "multiply", and "divide. So the idea of a service client is to provide
    an API to invoke any of those operations in a very convenient manner.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "# Available options to create a ServiceClient\n\nThere are multiple ways to\
    \ create a ServiceClient instance, and of course, we can choose the most suitable\
    \ constructors for us. No matter how we create a ServiceClient, it is required\
    \ to have an an Axis2 runtime (ConfigurationContext) to invoke the service. Either\
    \ user explicitly provides an instance of configuration context or Axis2 creates\
    \ it internally.\n\nEarlier, we discussed ConfigurationContext and how to create\
    \ it. So we can use those techniques to create ConfigurationContext when creating\
    \ a ServiceClient, or as we will see, we can create ServiceClient with ConfigurationContext\
    \ as null and let Axis2 create ConfigurationContext for us.\n\n# Type 1: Creating\
    \ a ServiceClient using its default constructor\n\nThe easiest way to create a\
    \ ServiceClient is to use its default constructor, as shown below. In this case,\
    \ it creates a ConfigurationContext using the Axis2 default configuration file,\
    \ which is available in the Axis2 JAR file. In the meantime, it creates an anonymous\
    \ (dummy service) service with three operations (three operations to support WSDL\
    \ 2.0 MEPs). Even though we create a service client this manner, we can use the\
    \ created client to asses any web service.\n\n```\nServiceClient serviceClient\
    \ = new ServiceClient();\n```\n\nWhen we are trying to create serviceClient inside\
    \ an Axis2 system (as an example, a handler tries to create a ServiceClient to\
    \ invoke a service, or if service tries to invoke some other service), then it\
    \ is created using server's ConfigurationContext. In this case, all the properties,\
    \ transports, and modules in the server are accessible to the ServiceClient, and\
    \ that scenario is called as a client running inside a server.\n\n# Type 2: Creating\
    \ a ServiceClient with your own ConfigurationContext\n\nWhen we want to create\
    \ a ServiceClient with our own configuration data, we can use the following constructor.\
    \ As we know by now, there are a number of ways to create ConfigurationContext.\
    \ At the same time, there are many instances where we want to create ServiceClient\
    \ with our own AxisService, which might have configured with custom QoS (Quality\
    \ of Service), parameters, WS-Policy, and so on.\n\n```\nServiceClient serviceClient\
    \ =\n    new ServiceClient (configContext, axisService);\n```"
  merge: -1
  img_proc: true
- pgno: 155
  md: "In this case, either (or both) of the arguments can be null. If both are null,\
    \ that is obviously equivalent to the default constructor case of ServiceClient.\
    \ If ConfigurationContext is null, depending on the location you are trying to\
    \ create the ServiceClient, either a new one will be created using the Axis2 default\
    \ configuration or a server's ConfigurationContext will be used. Similarly, if\
    \ AxisService is null, an anonymous service is created.\n\n# Type 3: Creating\
    \ a dynamic client (client on the fly)\n\nThe idea behind a dynamic client is\
    \ to create a ServiceClient on the fly, or simply create a client for a given\
    \ WSDL at runtime and use the created ServiceClient to invoke the corresponding\
    \ service. When we create the ServiceClient in this manner, the corresponding\
    \ AxisService object is configured according to the WSDL document. We will see\
    \ the advantages of the dynamic client in the middle of this chapter. The constructor\
    \ for creating a dynamic client is given as follows:\n\n```\nServiceClient dynamicClient\
    \ =new ServiceClient(\nconfigContext,wsdlURL, wsdlServiceName, portName);\n```\n\
    \n+   - configContext: configurationContext can be null; if it is null, the logic\
    \ mentioned in Option 2 will be applied.\n+   - wsdlURL: This argument should\
    \ not be null as it specifies the URL for the WSDL file.\n+   - wsdlServiceName:\
    \ As you know, the WSDL document might have multiple service elements. So if you\
    \ want to pick a specific service element, you can pass the QName of that service\
    \ element. The value of this argument can be null. If it is null, the first one\
    \ from the service element list will be considered as the service element.\n+\
    \   - portName : As you know, a service element in a WSDL file might have multiple\
    \ ports as well. So if you want to select a specific port, you can pass the name\
    \ of the port as the value of this argument. Then, if the value is null again,\
    \ the first one from the port list will be selected as the port.\n\nA sample WSDL\
    \ to understand what the mentioned service elements can be is shown here (the\
    \ ports are shown here as well):\n\n```\n<wsdl:service name=\"MyService\">\n \
    \   <wsdl:port name=\"ServicePort1\" binding=\"axis2:ServiceBinding1\">\n    <soap:address\
    \ location=\"http://127.0.0.1:8080/axis2/services/\n                MyService\"\
    />\n    </wsdl:port>\n    <wsdl:port name=\"ServicePort2\" binding=\"axis2: ServiceBinding2\
    \ \">\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: "# ServiceClient with working samples\n\nNow we know the available ways for\
    \ creating a service client, but there is nothing like code to explain those.\
    \ So the best way to understand ServiceClient API is to write a few real samples.\
    \ But first, we need to start the Axis2 server and deploy the following sample\
    \ service in the server. Only after that can we write a useful client to invoke\
    \ the service. We can create and deploy a service by using the following steps:\n\
    \n+   1. Open your favorite IDE and write the following Java class or the service\
    \ implementation class.\n\n```\npublic class MyService {\n    //method which has\
    \ a return value\n    public String echo(String value) {\n        return value;\n\
    \    }\n    // does not have a return value\n    public void update(int value)\
    \ {\n        System.out.println(\"value is :\" + value);\n    }\n}\n```\n\nSample\
    \ service implementation class has two methods—one has a return value and the\
    \ other does not.\n\n+   2. Writing the services.xml file for the service, your\
    \ services.xml will look like the following. See the references section to learn\
    \ about Axis2 deployment.\n\n```\n<serviceGroup>\n    <service name=\"MyService\"\
    >\n        <messageReceivers>\n            <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-only\"\
    \ class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"/>\n      \
    \      <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-out\" class=\"\
    org.apache.axis2.rpc.receivers.RPCMessageReceiver\"/>\n        </messageReceivers>\n\
    \        <parameter name=\"ServiceClass\" locked=\"false\">\n            MyService\n\
    \        </parameter>\n    </service>\n</serviceGroup>\n```\n\n```\n<soap12:address\
    \ location=\"http://127.0.0.1:8080/axis2/services/MyService\"/>\n</wsdl:port>\n\
    </wsdl:service>\n```"
  merge: -1
  img_proc: true
- pgno: 157
  md: "3. Create a service archive file and deploy the service in Axis2 server.\n\n\
    The first step of creating the service archive file is to compile the source code.\
    \ Next, go to the compile directory and create a directory called META-INF, and\
    \ copy the created services.xml file into it. Next, use any of the archive tools\
    \ and create a ZIP archive (you can also use the JAR file creation), and name\
    \ it as myservice.aar.\n\n> Axis2 comes with IDE tools and Maven plugins that\
    \ help you to create a service archive file.\n\nOnce you have the service archive\
    \ file, you can deploy it using any of the mechanism we discussed in the Deployment\
    \ section.\n\nNow that we have deployed the service in the server, what remains\
    \ is to invoke the service. Here we will look at a number of scenarios to understand\
    \ the concept clearly.\n\n# Scenario 1: Invoking a service in a blocking manner\
    \ (sendReceive())\n\nThe most commonly used service invocation pattern is the\
    \ request response invocation pattern (in-out MEP in WSDL 2.0 terminology). Most\
    \ of the services are written in a manner such that they have an input(s) and\
    \ an output. So we need to use a request response invocation pattern. In Axis2,\
    \ that can be done in two ways—a blocking manner or non-blocking manner. The first\
    \ sample demonstrates invoking a service in the blocking manner:\n\n+   1. Create\
    \ a ServiceClient using any of the constructors we mentioned earlier.\n\n+   2.\
    \ Create an OMElement for payload (first child of SOAP body). In Axis2, XML representation\
    \ is built on AXIOM. That is why you need to create OMElement (See the references\
    \ section to learn about AXIOM).\n\nWe can use the following code snippet to create\
    \ the payload that we need to invoke the service. If you look at the service WSDL,\
    \ then you can understand how to create the request element.\n\n```\npublic OMElement\
    \ createPayLoad() {\n    OMFactory fac = OMAbstractFactory.getOMFactory();\n \
    \   OMNamespace omNs = fac.createOMNamespace(\n        \"http://ws.apache.org/axis2\"\
    , \"ns1\");\n    OMElement method = fac.createOMElement(\"echo\", omNs);\n   \
    \ OMElement value = fac.createOMElement(\"value\", omNs);\n    value.setText(\"\
    Hello , my first service utilization\");\n    method.addChild(value);\n```"
  merge: -1
  img_proc: true
