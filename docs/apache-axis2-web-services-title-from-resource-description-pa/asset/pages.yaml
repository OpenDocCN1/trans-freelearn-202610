  md: '```

    class="o.a.a.t.h.SimpleHTTPServer"

    <parameter name="port">6060</parameter>

    </transportReceiver>

    </axisconfig>

    ```


    There is a scope associated with a parameter. A parameter defined in axis2.xml
    as an immediate child can be accessed by any of the descriptors in the system.
    If a parameter is defined inside a first level child of axis2.xml (for example,
    transportSender), then that parameter can only be accessed inside that particular
    child, in this case that specific transportSender.


    When accessing a parameter, Axis2 first checks whether the parameter is defined
    in the current description where we are. If not, it checks the immediate parent
    to see whether the parameter exists there. If found, the parameter will be returned;
    otherwise, the parent''s parent will be checked, and so on. In this manner, it
    will search the hierarchy when a request for a parameter is made.


    # MessageReceiver


    In Chapter 4, Execution Chain, we discussed more about MessageReceiver and its
    usage. All the message receivers we are going to use for our services should be
    specified in axis2.xml. You can have as many message receivers as you want and
    use the right one at the services.xml. The way to specify the message receiver
    in axis2.xml is shown next:


    ```

    <messageReceivers>

    <messageReceiver mep="MPE"

    class="o.a.a.r.RawXMLINOnlyMessageReceiver"/>

    </messageReceivers>

    ```


    Note: In the preceding XML element, MEP stands for the Message Exchange Patterns
    that the MessageReceiver can handle. Class attribute is to specify the actual
    implementation class of the MR. You can register any number of message receivers
    alone with a unique MEP. For example, WSDL 2.0 allows 8 types of MEPs.'
  merge: -1
  img_proc: true
- pgno: 107
  md: "# # MessageFormatters and MessageBuilders\n\nIn HTTP, we use a content-type\
    \ header to specify the type of data in the message body. Moreover, depending\
    \ on the content type, the wire format of the message varies, for example, XML,\
    \ JSON, base64, and so on. Axis2 also supports a number of different message types,\
    \ thus it requires serializing and deserializing a message into the correct format.\
    \ To facilitate, Axis2 has introduced `MessageFormatters` and `MessageBuilders`;\
    \ the first one is to serialize the message into the wire format and the second\
    \ one is to build the SOAP message from the incoming message stream. We already\
    \ know that any kind of message is represented in Axis2 using Axiom, and when\
    \ we serialize the message, it needs to be formatted, based on the content type.\
    \ `MessageFormatters` exist to do that job for us. We can specify `MessageFormatters`\
    \ along with the content type in axis2.xml. On the other hand, a message coming\
    \ into Axis2 may or may not be XML. However, for it to go through Axis2, an Axiom\
    \ element needs to be created. Therefore, `MessageBuilders` are employed to construct\
    \ the message, depending on the content type.\n\nThese two types of descriptions\
    \ can be considered complex, and as users are not likely to change them, users\
    \ can happily live with the default axis2.xml, as it will have configured all\
    \ the commonly used content types along with their corresponding builders and\
    \ formatters. The structure of XML elements in axis2.xml is shown next:\n\n```\n\
    ```xml\n<messageFormatters>\n    <messageFormatter contentType=\"application/x-www-form-\n\
    \    urlencoded\"\n    class=\"o.a.a.t.h.XFormURLEncodedFormatter\"/>\n</messageFormatters>\n\
    \n<messageBuilders>\n    <messageBuilder contentType=\"application/xml\"\n   \
    \ class=\"o.a.a.b.ApplicationXMLBuilder\"/>\n</messageBuilders>\n```\n```\n\n\
    As shown here, you can specify message builders and formatters with content type\
    \ and the implementation class. At runtime, Axis2 picks the right one to serialize\
    \ and de-serialize the message.\n\n# # TransportReceiver and TransportSender\n\
    \nAxis2 is transport independent, and hence one can communicate with Axis2 using\
    \ a number of transports. For example, Axis2 has inbuilt support for HTTP, TCP,\
    \ SMTP, and JMS. All of these are configurable through axis2.xml."
  merge: -1
  img_proc: true
