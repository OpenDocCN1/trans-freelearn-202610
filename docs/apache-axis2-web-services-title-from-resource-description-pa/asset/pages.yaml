- pgno: 57
  md: '# 3


    # Axis 2 XML Model (AXIOM)


    AXIOM stands for Axis2 Object Model and refers to the XML InfoSet model that was
    initially developed as part of Apache Axis2, but later it moved as a WS commons
    project so that projects other than Axis2 were able to benefit from it. XML InfoSet
    refers to the information included inside the XML, and for programmatic manipulation
    it is convenient to have a representation of this XML InfoSet in a language-specific
    manner. For an object-oriented language, the obvious choice is a model made up
    of objects. DOM and JDOM are two such XML models. AXIOM is conceptually similar
    to such an XML model by its external behavior, but deep down it is very much different.
    At the end of this chapter, you will understand the basics of AXIOM and the best
    practices to be followed while using AXIOM.


    This chapter will cover:


    +   - AXIOM architecture

    +   - Pull parsing

    +   - Working with AXIOM

    +   - Advanced operations with AXIOM


    # Overview of AXIOM and its features


    Apache Axiom was designed to provide fast and better XML, which became the heart
    of any given XML-processing system. Axiom is a lightweight implementation built
    on deferred parsing technology. More concretely, it is an implementation of StAX
    (JSR 173), the standard streaming pull parser API. One of the main intentions
    of this was to provide a standard manipulation API. Thus the AXIOM object model
    can be manipulated flexibly as any other object model (for example, JDOM), but
    underneath, the objects will be created only when they are absolutely required
    (that is, on-demand building). This leads to less memory-intensive programming.'
  merge: -1
  img_proc: true
- pgno: 58
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 59
  md: 'With pull parsing, the user has full control over the parser. The user can
    ask for the next event process and for the next event. In other words, in pull
    parsing, the parser only proceeds at the user''s command. The user can decide
    to store or discard events generated from the parser. This is similar to a water
    tap where you open the tap, get the water, and close the tap. When you want the
    water again, you open the tap again and continue the process. Thus, the user has
    full control over the flow and process of the water. The same thing happens with
    pull parsing where the user creates the parser and asks for the events and then
    it gives the event. The user processes the events and asks for the next event,
    until it reaches the end of the file.


    # Architecture


    When we consider the AXIOM architecture, it is not as complex as you may think.
    As mentioned earlier, many APIs are very similar to JDOM APIs. Notably, AXIOM
    has native support for binary data and MTOM, which is important for a SOAP processing
    framework such as Axis2. AXIOM also has full support for XML processing and enhanced
    support for SOAP processing.


    AXIOM is also known as Object Model (OM), and the OM Builder wraps the raw XML
    character stream through the StAX reader API. Hence, the complexities of the pull
    event stream are transparent to the user.


    As mentioned previously, deferred building is one of the main features of AXIOM.
    In addition, caching and non-caching can also be considered as another useful
    feature. The idea of caching depends upon whether the object model is stored in
    the memory or not. If the object model is stored in the memory, it is cached,
    otherwise it is non-cached. The reason why this is so important is because caching
    can be turned off in certain situations. If this happens, the parser proceeds
    without building the object structure. Users can extract raw pull stream from
    AXIOM and use that instead of the AXIOM. In this case, it is sometimes beneficial
    to switch off caching.


    # Working with AXIOM


    You can either download AXIOM binary or you can build the binary using the source
    distribution (or from source repository). As you already know, though AXIOM was
    started as a part of Axis2, now it has its own release cycle. Therefore, you can
    either download AXIOM binary from AXIOM release or you can find AXIOM binary in
    the Axis2 release.


    Once you have AXIOM binary, the next step is to add the binary into your classpath
    (and the dependent binary files as well); only then can you start to work with
    AXIOM. If your application has a build system such as Maven, you can add the dependency
    to that and let it download AXIOM JARs automatically.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Creating Axiom


    You can create AXIOM (instance of object model) in three ways, as shown in the
    following figure. First, you can create Axiom using a pull event stream. Second,
    you can create Axiom using a push event stream, or you can create AXIOM programmatically.
    In this chapter, you will learn how to create Axiom using a pull event stream
    and also programmatically because these are the two most common methods you use
    to create Axiom.


    ![](img/e2fb05de168053e6227dab034eff9353_60_0.png)


    First, let us look at how to create Axiom (we will be using AXIOM and Axiom interchangeably)
    using a pull event stream. Axiom provides a notion of a factory and a builder
    to create objects. The factory helps to keep the code at the interface level and
    the implementations separately. Axiom is tightly bound to StAX API (API for pull
    parser), thus a StAX-compliant reader should be created first with the desired
    input stream. One can then select one of the many builders available in AXIOM.
    In Axiom, you can find different types of builders as well, and those are mainly
    for user convenience. Axiom has OM builders (pure XML processing) as well as SOAP
    builders (SOAP processing optimized for SOAP), so you can use the appropriate
    builder for your requirement. StAXOMBuilder will build a pure XML InfoSet-compliant
    object model, while the SOAPModelBuilder returns SOAP-specific objects (such as
    the SOAPEnvelope, which are subclasses of the OMElement) through its builder methods.


    # Creating Axiom from an input stream


    The following piece of code shows the correct method of creating an Axiom document
    from a file input stream (input stream can be file stream, socket stream or any
    other stream):


    ```

    //First, create the parser

    XMLStreamReader parser = XMLInputFactory.newInstance().

    createXMLStreamReader(new FileInputStream(file));

    //create an OM builder, the most recommend approach is to use the //

    factory, but here we simply create it

    ```'
  merge: -1
