- pgno: 51
  md: '+   - The transport level non-blocking invocation where invocation occurs in
    two transports (it could either be two single-channel transports, such as SMTP,
    or two double-channel transports such as HTTP)


    Axis2 client API supports both non-blocking invocation scenarios.


    Axis2 introduces a very convenient client API for invoking a service that consists
    of two classes called `ServiceClient` and `OperationClient`. `ServiceClient`.
    API is intended for regular usage when you just require sending and receiving
    XML. On the other hand, Operation client is meant for advanced usage, when there
    is a need to work with SOAP headers and some other advanced tasks. With `ServiceClient`,
    you can only access SOAP body or the pay load. Although we can add SOAP headers,
    you do not have any way to retrieve the SOAP header by using the `ServiceClient`.
    We need to use an operation client for such a function.


    `ServiceClient` has the following API for invoking a service:


    +   - **sendRobust**: The whole idea of this API is to send an XML request to
    the web service and not care about its response. However, if something goes wrong,
    you would be required to know that too. So this API invokes a service where it
    does not have a return value but would throw an exception.


    +   - **fireAndForget**: This API is for just sending an XML request and not caring
    about neither the response, nor the exception. Hence, this is useful in invoking
    an In-Only MEP.


    +   - **sendReceive**: This invokes a service that has a return value. This is
    one of the most commonly used APIs. Hence, this is used for invoking an In-Out
    MEP.


    +   - **sendReceiveNonBlocking**: This invokes a service in a non-blocking manner.
    This method can be used when the service has a return value. In order to use this
    method, we have to pass a callback object that is called once the invocation is
    complete.


    As mentioned earlier, the `OperationClient` is for advanced users, and working
    with `OperationClient` requires you to know Axis2 in depth. In `ServiceClient`,
    you do not have to know anything about SOAP envelope, message context, and others.
    But when it comes to `OperationClient`, the users have to create these by themselves
    before invoking a service. Creating and invoking a service using `OperationClient`
    involves the following steps:


    +   1. Create a `ServiceClient`.

    +   2. After that, create `OperationClient` with the use of `ServiceClient` that
    you have created.

    +   3. Create a SOAP envelop.

    +   4. Create message context.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   5. Add the SOAP envelope to the message context.

    +   6. Add the `MessageContext` to `OperationClient`.

    +   7. Invoke the `OperationClient`.

    +   8. If there is a response, get the response message context from the `OperationClient`.


    # Transports


    In Axis2, each and every transport consists of two parts, namely transport senders
    and transport receivers. You can define transports along with senders and receivers
    in Axis2 global configuration. The transport receiver is the one through which
    the `AxisEngine` receives the message, whereas the transport sender is the one
    that sends out the message. One of the important aspects of Axis2 is that its
    core is completely independent of the transport sender and receiver.


    Axis2 is built in order to support the following transport protocols:


    +   - HTTP/HTTPS: In HTTP transport, the transport listener is a servlet or `org.apache.axis2.transport.http.SimpleHTTPServer`
    provided by Axis2. The transport sender uses a common HTTP client for connection
    and sends the SOAP message.

    +   - TCP: This is the simplest transport and it needs WS-Addressing support in
    order to be functional.

    +   - SMTP: This requires a single e-mail account. The transport receiver is a
    thread that checks for e-mails at fixed intervals of time.

    +   - JMS: This provides a way to invoke a web service by using the JMS way.

    +   - XMPP: This provides a standard way to communicate with the Jabber server
    and to invoke web services using XMPP protocol.


    # Other modules


    The idea of other modules is optional modules that provide additional functionalities
    or utilities: for example, modules that need to generate Axis2 services and service
    proxies. Axis2 does not use these modules at the runtime, and as mentioned earlier,
    those are only to provide additional features. Axis2 uses them as tooling modules
    to generate service-side code and client-side code.


    +   - Code generation: Axis2 provides a code generation tool that generates server-side
    (skeleton) and client-side code (stub or proxy) along with descriptors and a test
    case. The generated code would simplify the service deployment and the service
    invocation. This would increase the usability of Axis2.'
  merge: -1
  img_proc: true
