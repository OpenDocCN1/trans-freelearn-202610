- pgno: 168
  md: 'As stated earlier, by design, web services are said to be stateless. However,
    it is difficult to implement complex applications without having session management
    support. To understand the neediness of session support, let us consider a typical
    bank application. If we consider the sequence of events associated with a typical
    banking application, we get an idea as to why we need sessions:


    +   - First the user logs in to his/her account (invoking the `login` method)

    +   - Withdraw money (invoking some operation on his/her account)

    +   - Log out (complete the transaction)


    We can easily understand that the three operations stated earlier are interrelated
    and the same user does all those invocations. So this means that someone needs
    to keep a track of the user and the user data throughout the invocation of the
    methods. This simply indicates the requirement of session management to implement
    the banking application in the web-services way. Of course, there will be alternative
    ways of implementing the same application; then there is a need to have some other
    mechanism in place to identify and authenticate the user.


    # Stateless nature of Axis2


    As we know by now, Axis2 architecture keeps logic and data separate. In the meantime,
    Axis2 has two types of data models — **static data** and **runtime data**. We
    have already discussed these in detail. In this chapter, we will discuss more
    about Axis2 dynamic data hierarchy because session management fully depends on
    the runtime data. The samples in this chapter will help you understand more about
    runtime and static data, and most importantly, where to use what.


    In Axis2 framework, each individual component is said to be **stateless**. In
    other words, service implementation class or handlers should not try to store
    any local variable. Having stateless instances provides better support to reduce
    the concurrency control issues; this is due to the race conditions. In Axis2 handlers,
    `MessageReceivers`, `TransportSenders`, `TransportReceivers`, and even `AxisEngine`,
    are said to be stateless. So they do not keep any state in those classes. As a
    result of that, we do not mind whether we have one instance or a number of instances
    of the same handlers. As Axis2 has the notion of stateless nature in handlers,
    when you write handlers you need to write it in such a way that it does not keep
    any state in it. For example, we cannot consider the following handler implementation
    as a good approach. As we can see, it has a class variable to store the `messageContext`.
    So when we deploy Axis2 in a concurrent environment, we will definitely have issues.
    So, as the best practice, we need to keep in mind not to use any class variables
    inside our code.'
  merge: -1
  img_proc: true
- pgno: 169
  md: "```\npublic class InvalidHandler extends AbstractHandler {\n    //Class variable\
    \ to keep current MC\n    private MessageContext currentMessageContext;\n    public\
    \ InvocationResponse invoke(MessageContext msgContext) throws AxisFault {\n  \
    \      currentMessageContext = msgContext;\n        //We need to write whatever\
    \ the log we need to have here\n        return InvocationResponse.CONTINUE;\n\
    \    }\n}\n```\n\nThe preceding code sample shows that the handler that keeps\
    \ the class variable calls currentMessageContext. This has serious issues when\
    \ multiple concurrent requests are being handled. Thus the correct approach would\
    \ be to not use class variables. You can solve this by either using a method variable\
    \ or by storing it in some other context; we will discuss this later in this chapter.\
    \ The following code sample demonstrates the correct way of handling variables:\n\
    \n```\npublic InvocationResponse invoke(MessageContext msgContext) throws AxisFault\
    \ {\n    MessageContext currentMessageContext = msgContext;\n    //We need to\
    \ write whatever the log we need to have here\n    return InvocationResponse.CONTINUE;\n\
    }\n```\n\nThis does not mean that we cannot maintain state in Axis2; it simply\
    \ tells us that keeping states in an implementation class is not the right approach.\
    \ The most recommended way is to use the context hierarchy to store necessary\
    \ data and manage sessions.\n\n# The available type of sessions in Axis2\n\nAs\
    \ mentioned earlier, it is very difficult to implement enterprise level applications\
    \ using a web service without having proper session management support. On the\
    \ other hand, it is not a mandatory requirement to have session management support\
    \ in a web service framework. We might have services that do not require session\
    \ management at all."
  merge: -1
