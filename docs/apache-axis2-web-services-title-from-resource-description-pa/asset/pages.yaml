  md: '# Summary


    In this chapter, we discussed a little history of Axiom, why it was introduced,
    and the standard specifications it was built on. We then discussed some of the
    features it provides and demonstrated them with code samples. Although we did
    not explicitly mention it, Axiom was initially designed only to handle SOAP, but
    later it was improved to handle any type of XML messages. Thus, currently Axiom
    is a complete XML-processing framework, which you can use outside Axis2.


    In the next chapter, we will discuss one of the fundamental features of Axis2
    – the execution framework. There we will discuss the handler chain, handler, phase,
    phase rules, and how everything provides extensible flavor to Axis2.'
