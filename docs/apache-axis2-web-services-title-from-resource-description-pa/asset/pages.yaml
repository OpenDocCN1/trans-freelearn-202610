- pgno: 262
  md: '> As shown in the preceding code segment, the Man object contains two simple
    type attributes (name and age) and one complex type attribute (address). Hence
    the Man class can be considered as a complex object.


    However, a service like the following can be easily accessed using the HTTP GET
    method:


    ```

    public String getName(String id, int age) {

    }

    ```


    To invoke a service like this, you can send the request as follows:


    ```

    http://localhost:8080/axis2/services/ServiceName/getName?id=ID&age=10

    ```


    With the HTTP POST method, there is no limitation, like in HTTP GET. You can send
    the request as an encoded URL or as a request body (in a POX message). When sending
    the message as the request body with HTTP POST, you only send the SOAP body.


    You can use any given HTTP client to invoke a web service hosted in Axis2 in REST
    manner, using either the GET or the POST method. However, as we discussed earlier,
    you will have to make a judgment call, depending on the method signature of the
    web service operation, on whether to use GET or POST. You can even use ServiceClient
    to invoke a remote service in REST manner (with either GET or POST). The following
    code demonstrates invoking a service in REST manner using POST:


    ```

    ServiceClient client = new ServiceClient();

    Options opts = new Options();

    opts.setTo(new EndpointReference("address of the service "));

    opts.setAction("soap action ");

    opts.setProperty(Constants.Configuration.ENABLE_REST, Boolean.TRUE);

    client.setOptions(opts);

    OMElement res = client.sendReceive(createPayLoad());

    ```


    When you invoke this code, if you send the request via a TCP monitor, you will
    see that it only sends the request payload (only the SOAP body) and you will get
    only the payload for the response as well.


    To send the request as a GET request, you need to set the following flag:


    ```

    opts.setProperty(Constants.Configuration.HTTP_METHOD_GET, Boolean.

    TRUE);

    ```


    This will send the request in a URL-encoded format (if it can be URL encoded).'
