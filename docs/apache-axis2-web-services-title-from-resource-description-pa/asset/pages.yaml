  md: "# # The Dispatch client\n\nYou will be using this client when you want to work\
    \ at the XML message level or when you want to work without any generated artifacts\
    \ at the JAX-WS level. The Dispatch client API requires application clients to\
    \ construct messages or payloads as XML, which requires a detailed knowledge of\
    \ the message or message payload. The Dispatch client supports the following types\
    \ of objects:\n\n+   - `javax.xml.transform.Source`: You will use Source objects\
    \ to enable clients to use XML APIs directly. You can use Source objects with\
    \ SOAP or HTTP bindings.\n+   - **JAXB objects**: You will use JAXB objects so\
    \ that clients can use JAXB objects that are generated from an XML schema to create\
    \ and manipulate XML with JAX-WS applications. JAXB objects can only be used with\
    \ SOAP or HTTP bindings.\n+   - `javax.xml.soap.SOAPMessage`: You will use SOAPMessage\
    \ objects so that clients can work with SOAP messages. You can only use SOAPMessage\
    \ objects with SOAP bindings.\n+   - `javax.activation.DataSource`: You will use\
    \ DataSource objects so that clients can work with Multipurpose Internet Mail\
    \ Extension (MIME) messages. DataSource can be used only with HTTP bindings.\n\
    \nThe following example demonstrates how the JAX-WS Dispatch Client APIs can be\
    \ used. This client talks to a HelloService, which contains a single operation,\
    \ namely, greet. This option takes in a single string parameter. Pay special attention\
    \ to the highlighted code. As you can see, the client has to construct the SOAP\
    \ envelope, header, body, and body contents since the Message Service mode is\
    \ used:\n\n```\npackage org.apache.jaxwsclient;\n\nimport javax.xml.namespace.QName;\n\
    import javax.xml.soap.*;\nimport javax.xml.ws.Dispatch;\nimport javax.xml.ws.Service;\n\
    import javax.xml.ws.soap.SOAPBinding;\npublic class DispatchClient {\n    public\
    \ static void main(String[] args) {\n        try {\n            String endpointUrl\
    \ = \"http://localhost:8080/axis2/services/HelloService\";\n            QName\
    \ serviceName = new QName(\"http://apache.org/types\", \"HelloService\");\n  \
    \          QName portName = new QName(\"http://apache.org/types\", \"HelloServiceHttpSoap11Endpoint\"\
    );\n```"
  merge: -1
  img_proc: true
- pgno: 211
  md: "```\n/** Create a service and add at least one port to it. **/\nService service\
    \ = Service.create(serviceName);\nservice.addPort(portName, SOAPBinding.SOAP11HTTP_BINDING,\
    \ endpointUrl);\n\n/** Create a Dispatch instance from a service.**/\nDispatch<SOAPMessage>\
    \ dispatch = service.createDispatch(portName, SOAPMessage.class, Service.Mode.MESSAGE);\n\
    \n/** Create SOAPMessage request. **/\n// compose a request message\nMessageFactory\
    \ mf = MessageFactory.newInstance(SOAPConstants.SOAP_1_1_PROTOCOL);\n\n// Create\
    \ a message. This example works with the SOAPPART.\nSOAPMessage request = mf.createMessage();\n\
    SOAPPart part = request.getSOAPPart();\n\n// Obtain the SOAPEnvelope and header\
    \ and body elements.\nSOAPEnvelope env = part.getEnvelope();\nSOAPHeader header\
    \ = env.getHeader();\nSOAPBody body = env.getBody();\n\n// Construct the message\
    \ payload.\nSOAPElement operation = body.addChildElement(\"greet\", \"ns2\", \"\
    http://apache.org/types\");\nSOAPElement age = operation.addChildElement(\"name\"\
    );\nage.addTextNode(\"Packt\");\nrequest.saveChanges();\n\n/** Invoke the service\
    \ endpoint. **/\nSOAPMessage response = dispatch.invoke(request);\nSystem.out.println(response.getSOAPBody().getFirstChild().toString());\n\
    } catch (Exception e) {\n e.printStackTrace();\n}\n}\n```\n\nYou will need JDK\
    \ 1.5 or higher to compile the abovementioned class."
