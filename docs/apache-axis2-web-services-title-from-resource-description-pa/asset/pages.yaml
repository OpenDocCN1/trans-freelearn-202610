- pgno: 144
  md: "As you might already know, WS-policy is one of the key standards and plays\
    \ a major role in the web service configuration. When you engage a particular\
    \ module to a service, the module policy should be applied to the service and\
    \ should be visible when we view the WSDL of that service. So the applyPolicy\
    \ method sets the module policy to corresponding services or operations when we\
    \ engage the module. In this particular example, we do not have any policy associated\
    \ with the module, so we do not need to worry about this method as well.\n\nAs\
    \ we discussed in the init method, the method shutdown will be called when the\
    \ system has to shut down. So if we want to do any kind of processing at that\
    \ time, we can add this logic into that particular method. In our example, for\
    \ demonstration purposes, we have added code to store the counter values in a\
    \ file.\n\n# Writing the module.xml file\n\nSo far, we have written two handlers\
    \ and module implementation classes. Now, the only remaining thing to do is to\
    \ write the module descriptor file. When writing module.xml, we have to use phase\
    \ rules to specify the location of handlers and we have discussed phase rules\
    \ before (it is time to refresh our mind about the phase rule). The most simple\
    \ module.xml file for our module is shown here:\n\n```\n<module name=\"counterModule\"\
    \ class=\"org.apache.axis2.sample.module.request.CounterModule\">\n    <Description>\n\
    \        Counts the incoming and outgoing messages\n    </Description>\n    <InFlow>\n\
    \        <handler name=\"IncomingMessageCountHandler\" class=\"org.apache.axis2.sample.module.request.IncomingCounterHandler\"\
    >\n            <order phase=\"Transport\" after=\"RequestURIBasedDispatcher\"\
    \ before=\"SOAPActionBasedDispatcher\"/>\n        </handler>\n    </InFlow>\n\
    \    <OutFlow>\n        <handler name=\"OutgoingMessageCountHandler\" class=\"\
    org.apache.axis2.sample.module.request.OutgoingCounterHandler\">\n           \
    \ <order phase=\"MessageOut\"/>\n        </handler>\n    </OutFlow>\n</module>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 145
  md: 'In the file `module.xml`, we have specified the description of the module as
    "Counts the incoming and outgoing messages"; in the meantime, it has specified
    the two handlers we implemented earlier with phase rules.


    As you can see, we try to put our incoming message counter into the transport
    phase and the exact location is after `RequestURIBasedDispatcher` and before `SOAPActionBasedDispatcher`.
    If you look at the default `axis2.xml` file, you can see the two handlers in the
    `inFlow`. Meanwhile, in the outgoing message, a counter is added to the message-out
    phase and this does not specify the exact location.


    If you look carefully, you can see in the root element that there is an attribute
    called "class", which specifies the module interface class. We need to remember
    that this attribute is an optional one and some modules may or may not have this
    attribute.


    > There are instances where the module author needs to use a new phase for the
    module. In such a situation, one can edit the `axis2.xml` and specify the new
    phase(s) one wants. Once specified, phases can be used inside the `module.xml`.


    In the `module.xml` file, we have not discussed how to add the fault handlers,
    as we already know, there are two flows for fault processing: `InFaultFlow` and
    `OutFaultFlow`. The `InFaultFlow` is executed when there is an incoming fault.
    Similarly, `OutFaultFlow` is executed when there is an outgoing message. If you
    want to add handler(s) to any of those phases, you can do that just like you did
    with the other two flows.


    # Deploying and engaging the module


    Now we have written everything you need for a valid module, the only remaining
    thing is to create the module archive file and deploy it to the repository. First
    we compile our source code and then, as we know, it creates `.class` files.


    Assuming `org.apache.axis2.sample.module.request` is the package name of our source
    file, we can find all the `.class` files under `classes/org/apache/axis2/sample/module/request`.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Now create a directory called `META-INF` under the classes directory and copy
    the `module.xml` file into it. Then our `classes` directory should look like the
    following screenshot:


    ![](img/e2fb05de168053e6227dab034eff9353_146_0.png)


    Now create a ZIP file from the classes directory and rename the ZIP file into
    the `counter-module.mar`.


    Deploying the module is as simple as dropping the file into the `TOMCAT_HOME/webapps/axis2/WEB-INF/modules`
    or `repository/modules` directory. In this case, let''s focus on deploying the
    module in Tomcat or your favorite web application server. As we know, Axis2 does
    not support module hot deployment, so just dropping the module will not make any
    changes to the runtime system. To deploy our module and apply the necessary changes
    to runtime, we need to restart Axis2; in other words, we need to restart the application
    server.


    It should be noted that just deploying a module does not add its handlers into
    the handler chain; to add handlers into the system, it is necessary to engage
    the module. Now, let''s see how we engage a module in Axis2. For this purpose,
    we can use the Axis2 web administration console. Moreover, to make the story simple,
    let''s try to engage the module to all the services in the system using the web
    administration console (we can engage to a single service also using the administration
    console). We can engage the module to the system by carrying out the following
    steps:


    +   1. Go to http://localhost:8080/axis2/.

    +   2. Click on the Administration tab. This will open up a new page and ask for
    the username and password.'
  merge: -1
  img_proc: true
