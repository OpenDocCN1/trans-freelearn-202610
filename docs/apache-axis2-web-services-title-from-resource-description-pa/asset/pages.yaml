- pgno: 160
  md: "```\npublic void onError(Exception e) {\n    e.printStackTrace();\n}\n\npublic\
    \ void onComplete() {\n    complete = true;\n}\n};\n//invoking the service\nsc.sendReceiveNonBlocking(createPayLoad(),\
    \ callback);\nSystem.out.println(\"------Invoke the service-------\");\nint index\
    \ = 0;\n//wait till you get the response, in real applications you do not need\n\
    //to do this, since once the response arrive axis2 will notify //\n//callback,\n\
    // then you can implement callback to do whatever you want, may be to\n//update\
    \ GUI\nwhile (!complete) {\n    Thread.sleep(1000);\n    index++;\n    if (index\
    \ > 10) {\n        throw new AxisFault(\"Time out\");\n    }\n}\n```\n\nKey differences\
    \ in Scenario 1 and Scenario 2 are as follows:\n\n+   - It's necessary to create\
    \ the AxisCallback object\n+   - sendReceiveNonBlocking is a void operation\n\n\
    Once you run the code sample, you would get the following output:\n\n```\n------Invoke\
    \ the service-------\n<ns:echoResponse\n    xmlns:ns=\"http://ws.apache.org/axis2/xsd\"\
    >\n<return>\n    Hello , my first service utilization\n</return>\n</ns:echoResponse>\n\
    ```\n\nSimilar to Scenario1, if we create ServiceClient using our own AxisService\
    \ or as a dynamic client, then we need to use the following method with a qualified\
    \ operation name.sendReceiveNonBlocking\n\n```\n(QName operation, OMElement elem,AxisCallback\
    \ callback);\n```"
  merge: -1
  img_proc: true
- pgno: 161
  md: "# Scenario 3: Utilizing a service using two transports\n\n![](img/e2fb05de168053e6227dab034eff9353_161_0.png)\n\
    \nIn this case, the request goes through one transport and is received through\
    \ another transport. For example, request can go though HTTP and come through\
    \ TCP; or thr request can go though one HTTP connection and come via another HTTP\
    \ connection. To invoke a service in the given manner, we need to have WS-Addressing\
    \ support. Therefore, we need to engage the addressing module in both client and\
    \ server sides. In Scenario 2, what we had was only application-level asynchronous\
    \ support, but here we have transport level asynchronous support.\n\nBy changing\
    \ step 3 in Scenario 2 in the following manner, we can invoke the service via\
    \ two transports. Let's send request via HTTP and try to get the response via\
    \ TCP:\n\n```\nServiceClient sc = new ServiceClient();\nOptions opts = new Options();\n\
    opts.setTo(new EndpointReference(\n    \"http://127.0.0.1:8080/axis2/services/MyService\"\
    ));\n//engaging addressing module\nsc.engageModule(new QName(\"addressing\"));\n\
    //I need to use separate listener for my response\nopts.setUseSeparateListener(true);\n\
    // Need to receive via TCP\nopts.setTransportInProtocol(Constants.TRANSPORT_TCP);\n\
    opts.setAction(\"urn:echo\");\nsc.setOptions(opts);\n```\n\nIt should be noted\
    \ here that we can send a message using HTPP and receive a message via HTTP as\
    \ well. In this case, Axis2 will start up a new HTTP listener to receive the incoming\
    \ message."
  merge: -1
  img_proc: true
- pgno: 162
  md: "# Scenario 4: Utilizing an in-only MEP (fireAndForget)\n\nIf we want to send\
    \ data to a server but we worry neither about response nor exceptions, then we\
    \ could use this API. In WSDL 2.0 terminology, this API is to invoke an in-only\
    \ MEP. Let's try to invoke the update operation in MyService.\n\n+   1. Create\
    \ a ServiceClient.\n+   2. Create the payload OMElement , you need to create a\
    \ new payload since the method name is different in this case.\n+   3. When we\
    \ run the following code, you can see the value is :10 in the server's console,\
    \ and we don't get any response or exception even if something goes wrong in the\
    \ server:\n\n```\npublic OMElement createPayLoad() {\n    OMFactory fac = OMAbstractFactory.getOMFactory();\n\
    \    OMNamespace omNs = fac.createOMNamespace(\n                    \"http://ws.apache.org/axis2\"\
    , \"ns1\");\n    OMElement method = fac.createOMElement(\"update\", omNs);\n \
    \   OMElement value = fac.createOMElement(\"value\", omNs);\n    value.setText(\"\
    10\");\n    method.addChild(value);\n    return method;\n}\n```\n\n```\nServiceClient\
    \ sc = new ServiceClient();\nOptions opts = new Options();\nopts.setTo(new EndpointReference(\n\
    \        \"http://127.0.0.1:8080/axis2/services/MyService\"));\nopts.setAction(\"\
    urn:update\");\nsc.setOptions(opts);\nsc.fireAndForget(createPayLoad());\n```\n\
    \nReplace setTo with an invalid one and see whether you are getting any exception;\
    \ obviously, you will get nothing.\n\n# Scenario 5: Utilizing an in-only MEP (sendRobust)\n\
    \nThis API is also used to invoke a one way operation, but the only difference\
    \ from Scenario 4 is if something goes wrong in the server, the client will be\
    \ informed about that. We can use the Scenario 4 code with minor changes to invoke\
    \ the service in a robust manner, step 1 and step 2 remain unchanged; however,\
    \ step 3 needs to change in the following manner:\n\n```\nServiceClient sc = new\
    \ ServiceClient();\nOptions opts = new Options();\n```"
  merge: -1
  img_proc: true
- pgno: 163
  md: "```\nopts.setTo(new EndpointReference(\n    \"http://127.0.0.1:8080/axis2/services/MyService\"\
    ));\nopts.setAction(\"urn:update\");\nsc.setOptions(opts);\nsc.sendRobust(createPayLoad());\n\
    ```\n\nReplace setTo with an invalid one and see whether you are getting any exception.\n\
    \n# Working with the OperationClient\n\nAs we already know, with ServiceClient,\
    \ we have only access to payload in both, the sending and receiving sides. But\
    \ that is not enough if we are trying to implement the enterprise level web applications.\
    \ There, we need to have more control. In those cases, we might want to add custom\
    \ headers into an outgoing SOAP message as well as we need to access the incoming\
    \ SOAP process directly or we would be required to access incoming and outgoing\
    \ message contexts. With ServiceClient, we can do none of these (however, we can\
    \ get the current OperationContext once we invoke the service, and from this,\
    \ we can access both, the request and the response MessageContexts). The solution\
    \ is to use the operation client for these scenarios. Let's invoke the echo operation\
    \ using the operation client to understand the API:\n\n+   1. Create a ServiceClient\
    \ instance.\n+      ServiceClient sc = new ServiceClient();\n+   2. Create an\
    \ OperationClient (to create an operation client, we need to pass the full qualified\
    \ operation name , as it is in the dynamic client case)\n+      OperationClient\
    \ opClient = sc.createClient(\n+          ServiceClient.ANON_OUT_IN_OP);\n+  \
    \ When we create a service client using its default constructor, it creates the\
    \ antonyms service with three operations, and the constant ServiceClient.ANON_OUT_IN_OP\
    \ is one of them.\n+   3. Create a message context and set properties to its Option\
    \ object:\n\n```\n//creating message context\nMessageContext outMsgCtx = new MessageContext();\n\
    //assigning message context's option object into instance variable\nOptions opts\
    \ = outMsgCtx.getOptions();\n//setting properties into option\nopts.setTo(new\
    \ EndpointReference(\n    \"http://127.0.0.1:8000/axis2/services/MyService\"));\n\
    opts.setAction(\"urn:echo\");\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: "# The Client API\n\n+   4. Create SOAPEnvelope and add that to the message\
    \ context (not how we added in the previous cases). Here, you need to create a\
    \ full SOAP envelop.\n+   \n+   `outMsgCtx.setEnvelope(creatSOAPEnvelop());`\n\
    \nThe creatSOAPEnvelop method will look like the next snippet of code:\n\n```\n\
    public SOAPEnvelope creatSOAPEnvelop() {\n    SOAPFactory fac = OMAbstractFactory.getSOAP11Factory();\n\
    \    SOAPEnvelope envlope = fac.getDefaultEnvelope();\n    OMNamespace omNs =\
    \ fac.createOMNamespace(\n            \"http://ws.apache.org/axis2\", \"ns1\"\
    );\n    OMEleмent method = fac.createOMElement(\"echo\", omNs);\n    OMEleмent\
    \ value = fac.createOMElement(\"echo\", omNs);\n    value.setText(\"Hello\");\n\
    \    method.addChild(value);\n    envelope.getBody().addChild(method);\n\n   \
    \ return envelope;\n}\n```\n\nIn this sample, what we have is the default SOAPEnvelope\
    \ with a sample payload, but we can create a complex SOAPEnvelope, depending on\
    \ our requirements.\n\n+   5. Add a message context into the operation client:\n\
    +   \n+   `opClient.addMessageContext(outMsgCtx);`\n\n+   6. To send the message,\
    \ we need to call the execute method in the operation client:\n+   \n+   `opClient.execute(true);`\n\
    \nThe Boolean method argument is to say whether we want to invoke it in a blocking\
    \ manner or a non-blocking manner. If the value is true, invocation will be a\
    \ blocking one.\n\n+   7. To access a response message context and response SOAPEnvelope:\n\
    +   \n+   ```java\n+   //pass message label as method argument\n+   MessageContext\
    \ inMsgCtx = opClient.getMessageContext(\"In\");\n+   \n+   SOAPEnvelope response\
    \ = inMsgCtx.getEnvelope();\n+   System.out.println(response);\n+   ```\n\nWhen\
    \ we are invoking an in-out MEP, as in this sample, the message label of the request\
    \ is Out and value of the response is In; that is why we have to pass In as the\
    \ message label value to get the response message context."
  merge: -1
  img_proc: true
- pgno: 165
  md: "Once we have the message context, we can use that to access the SOAPEnvelop,\
    \ properties, transport headers, and so on. And when we run this code sample,\
    \ we should get the following as the console output:\n\n```\n<?xml version='1.0'\
    \ encoding='utf-8'?>\n<soapenv:Envelope\n    xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n    <soapenv:Header />\n    <soapenv:Body>\n        <ns:echoResponse\n    \
    \        xmlns:ns=\"http://ws.apache.org/axis2/xsd\">\n            <return>\n\
    \                Hello\n            </return>\n        </ns:echoResponse>\n  \
    \  </soapenv:Body>\n</soapenv:Envelope>\n```\n\nHere, we discussed OperationClient\
    \ as the means of accessing the incoming and outgoing MessageContext. One of the\
    \ most useful use cases of accessing outgoing MessageContext or the SOAPEnvelop\
    \ is to add headers. However, the ServiceClient API can also be used to add SOAP\
    \ headers, as shown here:\n\n```\nsc.addHeader(SOAPHeaderBlock);\n```\n\nOr we\
    \ could add headers, as shown here:\n\n```\nsc.addStringHeader(new QName(\"http://sample.org/header\"\
    ,\"MyHeader\"), \"headervalue\");\n```\n\nIf we intercept the message using the\
    \ TCP monitor or similar mechanisms, we can see the SOAP header in the SOAP message:\n\
    \n```\n<soapenv:Header>\n    <axis2ns1:MyHeader xmlns:axis2ns1=\n        \"http://sample.org/header\"\
    >headervalue</axis2ns1:MyHeader>\n</soapenv:Header>\n```\n\nIn the meantime, we\
    \ can access the last OperationContext using ServiceClient, as shown here:\n\n\
    ```\nOperationContext operationContext = sc.getLastOperationContext();\n```\n\n\
    From operationContext, we can get either In messageContexts or Out messageContexts."
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Summary


    In this chapter, we discussed one of the key components of Axis2 known as Axis2
    client API. We discussed how to create the Axis2 client instances in multiple
    ways as well as various ways of configuring them.


    Next, we discussed the most commonly used APIs and we used code samples to explain
    the scenarios better. The Axis2 client API is very convenient and it has a number
    of cool features such as asynchronous web service invocations, multiple transport
    selection, and so on. After running the sample, we can easily understand the basis
    of the Axis2 client API; understating the rest of the API required us to write
    complex samples.'
