- pgno: 259
  md: '# 14

    Axis2 Advanced Features

    and Usage


    In the preceding chapters, we discussed how to install Axis2, write a simple web
    service, write a simple module, invoke a web service, and many other things. If
    you followed them thoroughly along with the samples, you should now be in a good
    position in terms of the Axis2 basics. So, in this chapter, we will be thrown
    in at the deep end, so to speak, with more advanced features of Axis2. But there''s
    no need to panic! You have being using most of the advanced features of Axis2
    already without knowing it in the previous chapters. Now it''s time to learn them
    in a proper manner and use them in your applications. Axis2 offers a number of
    interesting features that you need to know when you want to develop a complex
    web service application.


    In this chapter, we will discuss several advanced features of Axis2, which you
    will need when you go beyond the basic web service invocation. Particularly, we
    will discuss the following:


    +   - Representational State Transfer (REST) and its features

    +   - Use of REST in Axis2

    +   - Message Transmission Optimization Mechanism (MTOM)

    +   - MTOM support on the client side

    +   - MTOM support on the server side

    +   - AxisConfigurators for creating more customized Axis2

    +   - Invoking and processing web services in an asynchronous manner


    In this chapter, we will discuss several different features and their usage. However,
    it should be noted that each individual section has its own meaning and application.
    Moreover, you will need these features when you want to do complex or more customized
    works.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Representational State Transfer (REST)


    We start this chapter by introducing Representational State Transfer (REST) and
    its features. REST is a term introduced by Roy Fielding in his Ph.D. dissertation
    to describe an architectural style of networked systems. The motivation behind
    REST was to capture the characteristics of the Web that made it a success. Subsequently,
    these characteristics are being used to guide the evolution of the Web. REST is
    not a standard but an architectural style, which accounts for the fact that you
    cannot find any specification in W3C.


    # Features of REST


    The Web consists of resources. Simply put, a resource is any item which holds
    some interest. For example, the Amazon online store may define a resource for
    their new Canon camera (DSLR), and the client may access the resource page using
    the following URL: http://www.amazon.com/canon/dslr.


    Upon clicking the link, a representation of the resource is returned (for example,
    canon_dslr.html). The representation places the client application in a state.
    The result of the client traversing a hyperlink in canon_dslr.html is it accesses
    another resource. The new representation places the client application in yet
    another state. Thus, the client application changes (transfers) state with each
    resource representation it accesses, and hence, we have Representational State
    Transfer!


    Here is Roy Fielding''s explanation of the meaning of Representational State Transfer:


    > "Representational State Transfer is intended to evoke an image of how a well-designed
    web application behaves: a network of web pages (a virtual state-machine) where
    the user progresses through an application by selecting links (state transitions),
    resulting in the next page (representing the next state of the application) being
    transferred to the user and rendered for their use."


    The Web is a REST system! Many of those web services that you have been using
    these many years—book-ordering services, search services, online dictionary services,
    and so on—are REST-based web services, which goes to show that you have been using
    REST and building REST services without even knowing it.


    # REST services in Axis2


    Web Service Description Language (WSDL), especially WSDL 2.0 HTTP Binding defines
    a way to support REST APIs in web services. Axis2 implements most of what is defined
    in the HTTP binding specification. The Axis2 REST implementation assumes the following
    properties:'
  merge: -1
  img_proc: true
- pgno: 261
  md: "+   - REST web services are synchronous and request some response in nature.\n\
    +   - When REST web services are accessed through GET, the service and the operations\
    \ are identified based on the URL. The parameters are assumed as parameters of\
    \ the web service (name values pairs in HTTP GET request `name=Axis2&value=1.5`).\
    \ In this case, the GET-based REST web services support only simple types as arguments\
    \ and it should adhere to the IRI style.\n+   - POST-based web services do not\
    \ need a SOAP envelope or a SOAP body. It only sends the XML payload or URL parameters,\
    \ as in GET.\n\nIn Axis2, by default, any given web service is exposed as both\
    \ SOAP and REST. The result is that as a service author, you do not need to do\
    \ additional work. However, it should be noted that for some services that are\
    \ exposed using REST API will not work. For example, if the application takes\
    \ a complex object, it is hard to expose that using REST GET API. Hence, there\
    \ are situations where the user is required to change the auto-generated WSDL\
    \ file to provide the correct information. Axis2 generates REST binding for both\
    \ WSDL 1.1 and WSDL 2.0, and more importantly, with WSDL 2.0, users get more features\
    \ to customize the REST binding, as WSDL 2.0 is more focused on REST than WSDL\
    \ 1.1.\n\n# REST web service with GET and POST\n\nA service deployed in Axis2\
    \ can be accessed through an HTTP POST or a GET request. However, in the case\
    \ of a GET, you have to send the request as URL parameters (remember the IRI style).\
    \ The IRI style has some limitations when encoding or serializing complex objects,\
    \ thus, in reality, you can only invoke only a set of service using the REST GET\
    \ method, but you can invoke almost all the services using the REST POST method.\
    \ For example, if the web service method takes a complex type as its method parameter,\
    \ then you cannot use the HTTP GET method. Therefore, a service like the following\
    \ cannot be accessed using HTTP GET:\n\n```\npublic class Man {\n    String name;\n\
    \    int age;\n    Address address;\n}\n\npublic String getName(Man man) {\n \
    \   //processing logic\n}\n```"
