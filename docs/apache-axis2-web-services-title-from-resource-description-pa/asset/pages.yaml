- pgno: 78
  md: '# Execution Chain


    All the global phases have semantic meanings from their names as well:


    +   - Transport phase: This consists of a handler that performs tasks that depend
    on the type of transport.

    +   - Security phase: WS-security implementation will add their handlers, but
    they are not limited to it, and any other modules or users can also add handlers.

    +   - PreDispatch: As the name implies, this has a set of handlers that perform
    tasks that are needed for dispatching. Handlers, like WS-addressing, will always
    be in this phase.

    +   - Dispatch phase: This is the phase that does the dispatching by simply finding
    the corresponding service and the operation for the incoming message. Therefore,
    the dispatch phase consists of dispatching handlers. We can also add new global
    phases and then handlers into it, which requires modification of the `axis2.xml`
    file.


    Note that if necessary the user can easily add new phases by editing `axis2.xml`.


    # Operation phases


    Say, for instance, we have a handler and we do not need to run that for every
    message coming to the system, but we need to run that for selected operations.
    This is where the operation phase comes into the picture. Operational phases are
    the phases that come after the dispatch phase, and the user can add any number
    of phases. Adding operation phases does not change the structure of the other
    operations in their chains.


    # Phase rules


    The main idea of phase rules is to correctly locate a handler relative to the
    one inside a phase, maybe at the deployment time or at the runtime. Axis1 did
    not have the concept of phases or phase rules. What it had was a global configuration
    file where you go and define you handlers. But that had a number of limitations;
    in particular, you lose the dynamic nature of the handler chain. Therefore, one
    aspect of phase rules is to address the issues of dynamic execution chain building
    capability.


    # Characterizing a phase rule


    Characterizing a phase rule can be based on one or more of the following properties:


    +   - Phase name: Name of the phase that the handler must be placed in

    +   - First phase (`phaseFirst`): The first handler of the phase'
  merge: -1
  img_proc: true
- pgno: 79
  md: "+   - Last phase(phaseLast): The last handler of the phase\n+   - Before (before):\
    \ Positions the handler before another handler\n+   - After (after): Positions\
    \ the handler after another handler\n+   - Before and after: Places the handler\
    \ between two handlers\n\n# Phase name\n\nphase is a compulsory attribute for\
    \ any phase rule which gives the name of the phase in which the handler must fit.\
    \ In order for the rule to be a valid phase name, it should be known to the system,\
    \ which must be either a global phase name or an operation specific phase.\n\n\
    # phaseFirst\n\nAs the name implies, if you want a handler to be invoked as the\
    \ first handler in a given phase, irrespective of other handlers in the phase,\
    \ you have to set phaseFirst attribute to true. A handler which is having the\
    \ phase rule only with phaseFirst and a phase looks as follows:\n\n```\n<handler\
    \ name=\"simple_Handler \" class=\"org.apache.axis.handlers.\nSimpleHandler \"\
    >\n    <order phase=\"userphase1\" phaseFirst=\"true\"/>\n</handler>\n```\n\n\
    # phaseLast\n\nLike phaseFirst, if one wants the handler to be run last in a given\
    \ phase, irrespective of other handlers, one has to set phaseLast to true. So\
    \ the handler with phaseLast will look as follows:\n\n```\n<handler name=\"simple_Handler\
    \ \" class=\"org.apache.axis.handlers.\nSimpleHandler \">\n    <order phase=\"\
    userphase1\" phaseLast=\"true\"/>\n</handler>\n```\n\nIf there is a phase rule\
    \ with both phaseFirst and phaseLast set to true, then that phase cannot have\
    \ any more handlers. In other words, the phase has only one handler.\n\n# before\n\
    \nThere may be situations when a handler should always run before some other handler,\
    \ no matter what the exact location is. A real-time use case for this can be the\
    \ security handler that wants to run before the RM handler. The logic has to be\
    \ written as follows and the value of the before attribute is the referred handler\
    \ name:"
  merge: -1
  img_proc: true
