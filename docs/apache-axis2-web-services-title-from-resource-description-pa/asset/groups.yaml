    We will see the following in the server console:


    ![](img/e2fb05de168053e6227dab034eff9353_174_0.png)


    If we continue to do so, we will see it getting printed every time we invoke the
    service.


    It should be noted here that even if we deploy a service in a request scope, there
    are many ways of keeping our service as a state full service. One way is to store
    the state in Axis2 global runtime (ConfigurationContext) and retrieve whenever
    necessary. Notably, this will add more overhead to the system, as there is only
    one ConfigurationContext, and if everything tries to access it, it will be a bottleneck.


    # SOAP session scope


    The idea of SOAP session is to have a transport-independent way of managing a
    session between two SOAP nodes; obviously, between the client and the server.
    Here, Axis2 uses SOAP headers in order to manage the session. In the SOAP session
    scope, it has a slightly longer lifetime than the request session scope, and deploying
    a service in a SOAP session is required to change services.xml as well. Managing
    a SOAP session requires both the client and the service to be aware of the sessions,
    that is, the client has to send the session-related data if he/she wants to access
    the same session and the service has to validate the user using the session-related
    data.


    > SOAP-based session management is not interoperable; part of the reason is that
    there''s no agreement upon a standard specification to manage the session. There
    is a standard specification called WS-Context, but none of the commonly used web
    service frameworks have implemented it.'
  md: "\n- `ServiceContext`: This will represent the runtime of one service and the\
    \ context lifetime will be the lifetime of the session. There can be one or many\
    \ service contexts in the system, depending on the session scope of the corresponding\
    \ service.\n- `OperationContext`: This context is to represent the life time of\
    \ a MEP (Message Exchange Patterns). The lifetime of an operation context is mostly\
    \ less than the lifetime of the `ServiceContext`.\n- `MessageContext`: The lifetime\
    \ of an incoming message is represented by the message context. If two handlers\
    \ in a given execution chain want to share data, then the best way is to store\
    \ them in the message context. One `OperationContext` may have one or more `MessageContexts`.\n\
    \n## Session initializing and session invalidating\n\nWhen talking about the session\
    \ management, one thing that comes to mind is the lifetime of the session. Most\
    \ of the Web applications, like e-commerce, banking, hotel reservation, and so\
    \ on, have a predefine lifetime. If you are not active for that time, it will\
    \ automatically terminate your session and prompt you to log in again. Hence,\
    \ there is a particular time when a session gets started and another when the\
    \ session finishes. So whoever writes a session aware service might need to know\
    \ when a session starts and when it finishes. To facilitate this, Axis2 uses Java\
    \ reflection and optional interfaces to inform the service implementation class.\
    \ Actually, there are two ways that a service author is notified when a session\
    \ starts and finishes, irrespective of the session scope.\n\n## Java reflection\n\
    \nIn this case, the service author has to implement the following two methods\
    \ in his/her service implementation class, if he/she wants to be notified as to\
    \ when the session starts and finishes. At runtime, when a session starts, Axis2\
    \ looks to see whether the following methods are there in the service implementation\
    \ class; if so, it calls the right method:\n\n```\n//This method will be called\
    \ when a session start\npublic void init(ServiceContext serviceContext) {\n  \
    \  // Our code goes here\n}\n//This method will be called when a session finishes.\n\
    public void destroy(ServiceContext serviceContext) {\n    // Our code goes here\n\
    }\n```\n\n## Using the optional interface\n\nWhen we use Java reflection, there\
    \ is a very slight probability of making mistakes in the method's name and parameters,\
    \ so it is good to user interface. That would lead you to use the method in the\
    \ correct manner and avoid mistakes. The corresponding interface that Axis2 provides\
    \ is called org.apache.axis2.service.Lifecycle, which has the same two methods\
    \ we discussed earlier. If you want to get a notification as to when a session\
    \ starts, you should write your service implementation class to implement that\
    \ particular interface; then Axis2 will automatically call the right method. So\
    \ we can write our service implementation class as shown below:\n\n```\npublic\
    \ class MyService implements Lifecycle {\n    public void init(ServiceContext\
    \ context) throws AxisFault {\n    }\n    public void destroy(ServiceContext context)\
    \ {\n    }\n}\n```\n\n## Accessing MessageContext\n\nIn the first part of the\
    \ chapter, we discussed that keeping class variables anywhere in Axis2 is not\
    \ a good practice (for example, service implementation class, handler class).\
    \ There, we also mentioned the fact that keeping local variables also leads to\
    \ issues in the concurrent environments. Hence, it is not a good idea to keep\
    \ variables inside the service implementation class. When managing sessions, the\
    \ right way is to store the data in one of the context and access them whenever\
    \ needed. Though Axis2 passes ServiceContext when the session starts, storing\
    \ it inside the service implementation is not the right approach (storing as a\
    \ class variable). Therefore, we need to have a mechanism to access those contexts.\
    \ As we learned before, if you have access to MessageContext, then you can access\
    \ the entire context hierarchy using that. Thus, if we can get access to the current\
    \ MessageContext, we can consider accessing the entire context hierarchy. So the\
    \ next question is how do we get the current MessageContext inside to the service\
    \ class? That is very straightforward; Axis2 sets MessageContext into ThreadLocal,\
    \ so from that, we can access the MessageContext. Let's say that we want to access\
    \ the MessageContext inside the method called foo. We can do that as follows:\n\
    \n```\npublic void foo(){\n    MessageContext messageContext = MessageContext.getCurrentMessageContext();\n\
    }\n```\n\nThis can be used to access the current MessageContext, irrespective\
    \ of the session scope we use.\n\nHaving discussed all the necessary pieces of\
    \ session management, now it is time to discuss about the different types of available\
    \ sessions in Axis2. As mentioned above, there are four different types of sessions.\
    \ We will discuss all of them in detail here.\n\n## Request session scope\n\n\
    Request session scope is the default session scope in Axis2. When we deploy a\
    \ service without knowing anything about session management, our service will\
    \ be deployed in the request session scope. The lifetime of this session is limited\
    \ to the method invocation lifetime or the request processing time. When we deploy\
    \ a service in the request scope, it simply means that we are not going to worry\
    \ about the session management at all. So it is like having no session management.\n\
    \nOnce we deploy a service in the request session scope, for each and every invocation,\
    \ a new service implementation class will be created. Say we have to deploy a\
    \ service called Foo in the request scope; then if a client invokes the service\
    \ ten times, 10 instances of the service class will be created.\n\nIf we want\
    \ to specify the scope explicitly, we can still do that by adding a scope attribute\
    \ to the service element in services.xml, as follows. However, as mentioned earlier,\
    \ deploying a service in the request scope does not require any modifications\
    \ (the following is optional):\n\n```\n<service name=\"Foo\" scope=\" request\"\
    >\n</service>\n```\n\nTo get an understanding about request scope, create a service\
    \ using the following service class, deploy it, and invoke it:\n\n```\npublic\
    \ class MyService implements Lifecycle {\n    public void init(ServiceContext\
    \ context) throws AxisFault {\n        System.out.println(\"I'm inside init method\
    \ \");\n    }\n    public void destroy(ServiceContext context) {\n        System.out.println(\"\
    I'm inside destroy method\");\n    }\n    public String foo(String foo) {\n  \
    \      return foo;\n    }\n}\n```\n\nTo invoke the service, we just type the following\
    \ in the browser:\n\n```\nhttp://localhost:8080/axis2/services/MyService/foo?foo=foo\n\
    ```\n\nWe will see the following in the server console:\n\n![](img/e2fb05de168053e6227dab034eff9353_174_0.png)\n\
    \nIf we continue to do so, we will see it getting printed every time we invoke\
    \ the service.\n\nIt should be noted here that even if we deploy a service in\
    \ a request scope, there are many ways of keeping our service as a state full\
    \ service. One way is to store the state in Axis2 global runtime (ConfigurationContext)\
    \ and retrieve whenever necessary. Notably, this will add more overhead to the\
    \ system, as there is only one ConfigurationContext, and if everything tries to\
    \ access it, it will be a bottleneck.\n\n## SOAP session scope\n\nThe idea of\
    \ SOAP session is to have a transport-independent way of managing a session between\
    \ two SOAP nodes; obviously, between the client and the server. Here, Axis2 uses\
    \ SOAP headers in order to manage the session. In the SOAP session scope, it has\
    \ a slightly longer lifetime than the request session scope, and deploying a service\
    \ in a SOAP session is required to change services.xml as well. Managing a SOAP\
    \ session requires both the client and the service to be aware of the sessions,\
    \ that is, the client has to send the session-related data if he/she wants to\
    \ access the same session and the service has to validate the user using the session-related\
    \ data.\n\n> SOAP-based session management is not interoperable; part of the reason\
    \ is that there's no agreement upon a standard specification to manage the session.\
    \ There is a standard specification called WS-Context, but none of the commonly\
    \ used web service frameworks have implemented it.\n"
  mdcn: "\n\n- `ServiceContext`：此上下文表示一个服务的运行时，其生命周期与会话的生命周期一致。系统中可以有一个或多个服务上下文，具体取决于相应服务的会话范围。\n\
    - `OperationContext`：此上下文用于表示 MEP（消息交换模式）的生命周期。操作上下文的生命周期通常短于`ServiceContext`的生命周期。\n\
    - `MessageContext`：传入消息的生命周期由消息上下文表示。如果给定执行链中的两个处理器想要共享数据，最好的方法是将数据存储在消息上下文中。一个`OperationContext`可能有一个或多个`MessageContext`。\n\
    \n## 会话初始化和会话失效\n\n谈到会话管理，首先想到的就是会话的生命周期。大多数Web应用（如电子商务、银行、酒店预订等）都有预定义的生命周期。如果你在该时间内没有活动，系统会自动终止你的会话并提示你重新登录。因此，会话有特定的开始时间和结束时间。所以，任何编写会话感知服务的人可能都需要知道会话何时开始、何时结束。为了便于实现这一点，Axis2使用Java反射和可选接口来通知服务实现类。实际上，无论会话范围如何，服务作者在会话开始和结束时都会通过两种方式收到通知。\n\
    \n## Java反射\n\n在这种情况下，如果服务作者希望收到会话开始和结束的通知，他/她必须在服务实现类中实现以下两个方法。在运行时，当会话开始时，Axis2会检查服务实现类中是否存在以下方法；如果存在，则调用相应的方法：\n\
    \n```\n//此方法将在会话开始时被调用\npublic void init(ServiceContext serviceContext) {\n  \
    \  // 我们的代码写在这里\n}\n//此方法将在会话结束时被调用\npublic void destroy(ServiceContext serviceContext)\
    \ {\n    // 我们的代码写在这里\n}\n```\n\n## 使用可选接口\n\n当我们使用Java反射时，方法名称和参数出现错误的可能性非常小，因此最好使用接口。这样可以引导你以正确的方式使用方法并避免错误。Axis2提供的对应接口称为org.apache.axis2.service.Lifecycle，其中包含我们之前讨论的同样两个方法。如果你想在会话开始时收到通知，应该编写服务实现类来实现该特定接口；然后Axis2会自动调用正确的方法。因此，我们可以如下编写服务实现类：\n\
    \n```\npublic class MyService implements Lifecycle {\n    public void init(ServiceContext\
    \ context) throws AxisFault {\n    }\n    public void destroy(ServiceContext context)\
    \ {\n    }\n}\n```\n\n## 访问MessageContext\n\n在本章的第一部分，我们讨论了在Axis2中将类变量保留在任何位置都不是好习惯（例如，服务实现类、处理器类）。在那里，我们还提到保留局部变量也会导致并发环境中的问题。因此，将变量保留在服务实现类内部并不是一个好主意。在管理会话时，正确的方法是将数据存储在某个上下文中，并在需要时访问它们。尽管Axis2在会话开始时传递ServiceContext，但将其存储在服务实现中（作为类变量存储）并不是正确的方法。因此，我们需要一种机制来访问这些上下文。如前所述，如果你可以访问MessageContext，那么就可以通过它访问整个上下文层次结构。因此，如果我们能够访问当前的MessageContext，就可以考虑访问整个上下文层次结构。那么下一个问题是，如何在服务类内部获取当前的MessageContext？这非常简单；Axis2将MessageContext设置到ThreadLocal中，因此我们可以从中访问MessageContext。假设我们想在名为foo的方法内访问MessageContext，可以按如下方式操作：\n\
    \n```\npublic void foo(){\n    MessageContext messageContext = MessageContext.getCurrentMessageContext();\n\
    }\n```\n\n这可以用来访问当前的MessageContext，无论我们使用什么会话范围。\n\n在讨论了会话管理的所有必要部分之后，现在该讨论Axis2中可用的不同类型的会话了。如上所述，有四种不同类型的会话。我们将在这里详细讨论它们全部。\n\
    \n## 请求会话范围\n\n请求会话范围是Axis2中的默认会话范围。当我们在不了解任何会话管理的情况下部署服务时，我们的服务将在请求会话范围内部署。此会话的生命周期仅限于方法调用生命周期或请求处理时间。当我们在请求范围内部署服务时，这仅仅意味着我们完全不担心会话管理。因此，这就像没有会话管理一样。\n\
    \n一旦我们在请求会话范围内部署服务，每次调用都会创建一个新的服务实现类。假设我们必须在请求范围内部署一个名为Foo的服务；如果客户端调用该服务十次，则会创建十个服务类实例。\n\
    \n如果我们想显式指定范围，仍然可以通过在services.xml的服务元素中添加scope属性来实现，如下所示。然而，如前所述，在请求范围内部署服务不需要任何修改（以下内容是可选的）：\n\
    \n```\n<service name=\"Foo\" scope=\" request\">\n</service>\n```\n\n为了理解请求范围，请使用以下服务类创建一个服务，部署它并调用它：\n\
    \n```\npublic class MyService implements Lifecycle {\n    public void init(ServiceContext\
    \ context) throws AxisFault {\n        System.out.println(\"I'm inside init method\
    \ \");\n    }\n    public void destroy(ServiceContext context) {\n        System.out.println(\"\
    I'm inside destroy method\");\n    }\n    public String foo(String foo) {\n  \
    \      return foo;\n    }\n}\n```\n\n要调用服务，我们只需在浏览器中键入以下内容：\n\n```\nhttp://localhost:8080/axis2/services/MyService/foo?foo=foo\n\
    ```\n\n我们将在服务器控制台中看到以下内容：\n\n![](img/e2fb05de168053e6227dab034eff9353_174_0.png)\n\
    \n如果我们继续这样做，我们会看到它每次调用服务时都会打印。\n\n这里应该注意，即使我们在请求范围内部署服务，也有很多方法可以使我们的服务成为有状态服务。一种方法是将状态存储在Axis2全局运行时（ConfigurationContext）中，并在必要时检索。值得注意的是，这会给系统增加更多开销，因为只有一个ConfigurationContext，如果所有内容都试图访问它，它将成为瓶颈。\n\
    \n## SOAP会话范围\n\nSOAP会话的思想是拥有一种与传输无关的方式，在两个SOAP节点之间（显然是在客户端和服务器之间）管理会话。这里，Axis2使用SOAP头来管理会话。在SOAP会话范围中，其生命周期比请求会话范围稍长，并且在SOAP会话中部署服务也需要修改services.xml。管理SOAP会话要求客户端和服务都感知会话，也就是说，如果客户端想要访问同一会话，必须发送与会话相关的数据，而服务必须使用与会话相关的数据来验证用户。\n\
    \n> 基于SOAP的会话管理不具备互操作性；部分原因是没有就管理会话的标准规范达成一致。有一个名为WS-Context的标准规范，但常用的Web服务框架中没有一个实现它。\n\
    \n"
