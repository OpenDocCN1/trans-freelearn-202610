    Packt\"));\n    }\n}\n```\n\n## 使用 JAX-WS 服务的 MTOM\n\n消息传输优化机制（MTOM）是一种高效地向 Web\
    \ 服务发送和接收二进制数据的方法。要在 JAX-WS 服务中使用 MTOM，首先必须使用 BindingType 注解将绑定类型设置为 SOAP11 MTOM。你将使用\
    \ javax.activation.DataHandler 在参数或返回类型中表示二进制数据。让我们看一个启用了 MTOM 的 JAX-WS 服务示例。uploadFile\
    \ Web 服务操作展示了如何将二进制数据用作操作的输入参数。下面的 getBinaryTestData 操作说明了如何将二进制数据用作操作的输出：\n\n\
    高亮字段显示 BindingType 被设置为 SOAP11HTTP_MTOM_BINDING 和 DataHandler。Java bean 类型类也可以包含\
    \ DataHandler。你需要 JDK 1.5 或更高版本来编译上述类。\n\n## JAX-WS 服务的异步调用\n\nJAX-WS 支持从客户端异步调用服务。JAX-WS\
    \ 在异步调用 Web 服务时为回调模型和轮询模型提供支持。回调模型和轮询模型均由 Dispatch 客户端和代理客户端支持。\n\nWeb 服务的异步调用会向服务端点发送请求，然后立即将控制权返回给客户端，而无需等待响应从服务返回。JAX-WS\
    \ 异步 Web 服务客户端使用回调方法或轮询方法使用 Web 服务。\n\n### 轮询模型\n\n在轮询模型中，客户端可以发出请求并接收响应对象，通过轮询来确定服务器是否已响应。当服务器响应时，会检索实际响应。响应对象在调用\
    \ get 方法时会返回响应内容。客户端从 invokeAsync 方法接收到 javax.xml.ws.Response 类型的对象。该 Response\
    \ 对象用于监控向服务器的请求状态，确定操作是否已完成，并检索响应结果。\n\n### 回调模型\n\n在回调模型中，客户端提供回调处理程序来接收和处理入站响应对象。当结果可用时，处理程序的\
    \ handleResponse 方法会被调用。为了实现使用回调模型的异步调用，客户端提供 AsyncHandler 实例来接收和处理入站响应对象。客户端回调处理程序实现\
    \ javax.xml.ws.AsyncHandler 接口，该接口包含在从服务器接收到异步响应时执行的应用程序代码。javax.xml.ws.AsyncHandler\
    \ 接口包含 handleResponse(javax.xml.ws.Response) 方法，该方法在运行时接收并处理来自服务器的异步响应后被调用。响应以\
    \ javax.xml.ws.Response 对象的形式传递给回调处理程序。响应对象在调用 get() 方法时会返回响应内容。\n\n## 编写高可用可集群的\
    \ Web 服务\n\n通常，你无需做任何额外工作即可使 Web 服务可集群。一般来说，任何常规 Web 服务都是可集群的。对于有状态的 Web 服务，你需要将\
    \ Java 可序列化可复制属性存储在 Axis2 ConfigurationContext、ServiceGroupContext 或 ServiceContext\
    \ 中。请注意，你在其他地方维护的有状态变量将不会被复制。如果正确配置了 Axis2 集群以进行状态复制，则 Axis2 基础设施将为你复制这些属性。在下一节中，你将能够查看为状态复制配置集群的详细信息。让我们看一个部署在\
    \ soapsession 范围内的简单有状态 Axis2 Web 服务：\n\n```\npublic class ClusterableService\
    \ {\n    private static final String VALUE = \"value\";\n\n    public void setValue(String\
    \ value) {\n        ServiceContext serviceContext = MessageContext.getCurrentMessageContext().getServiceContext();\n\
    \        serviceContext.setProperty(VALUE, value);\n    }\n\n    public String\
    \ getValue() {\n        ServiceContext serviceContext = MessageContext.getCurrentMessageContext().getServiceContext();\n\
    \        return (String) serviceContext.getProperty(VALUE);\n    }\n}\n```\n\n\
    你可以在集群中的两个 Axis2 节点上部署此服务。你可以编写一个客户端，在第一个节点上调用 setValue 操作，然后在第二个节点上调用 getValue\
    \ 操作。你将能够看到你在第一个节点上设置的值可以从第二个节点检索到。发生的情况是，当你在第一个节点上调用 setValue 操作时，值会被设置在相应的 ServiceContext\
    \ 中，并复制到第二个节点。因此，当你在第二个节点上调用 getValue 时，复制的值已正确设置在相应的 ServiceContext 中。正如你可能已经注意到的那样，你无需做任何额外工作即可使\
    \ Web 服务可集群。Axis2 会透明地进行状态复制。然而，如果你需要控制状态复制，Axis2 也提供了该选项。让我们重写同一个 Web 服务，同时控制状态复制：\n\
    \n```\npublic class ClusterableService {\n    private static final String VALUE\
    \ = \"value\";\n    public void setValue(String value) {\n```\n\n![](img/e2fb05de168053e6227dab034eff9353_221_0.png)\n\
    \n## 增加水平可扩展性\n\n如图所示，为了实现水平可扩展性，Axis2 集群将由负载均衡器前端（下图中用 LB 表示）。负载均衡器将根据某种负载均衡算法在\
    \ Axis2 集群中分配负载。轮询负载均衡算法就是这样一种流行且简单的算法，当所有节点上的硬件和软件都相同的情况下效果很好。通常，水平可扩展的集群将保持其响应时间，并在负载增加时不会降低性能。在这种设置下吞吐量也会随着负载的增加而增加。通常，集群中的节点数量是预期最大峰值负载的函数。在这种集群中，所有节点都是活动的。\n\
    \n![](img/e2fb05de168053e6227dab034eff9353_221_1.png)\n\n### AvoidInitiation\n\
    \n此参数指示在构建 `AxisConfiguration` 时集群是否需要自动初始化。如果设置为 true，则不会在该阶段进行初始化，而必须由其他方显式初始化集群。在\
    \ Axis2 被第三方嵌入的情况下，他们可能需要控制集群初始化过程。因此提供了此参数。例如，我们可以将此参数设置为 true，以便在服务器完全启动并且相关传输已初始化后初始化集群。\n\
    \n### membershipScheme\n\n在此设置中使用成员关系方案。目前支持的唯一值是 multicast 和 WKA。\n\n- **multicast:**\
    \ 基于多播的成员管理。成员关系使用多播自动发现。为了使其工作，多播必须在网络中允许，并且集群中的所有成员必须使用相同的多播地址（由 `mcastAddress`\
    \ 参数定义）和确切的多播端口（由 `mcastPort` 参数定义）。\n- **众所周知地址 (WKA)：** 基于众所周知地址的成员管理。成员关系在运行在众所周知地址的一个或多个节点的帮助下发现。加入集群的新成员将首先连接到众所周知节点，向众所周知节点注册，并从其获取成员列表。当新成员加入时，众所周知节点中的一个将通知组中的其他节点。当成员离开集群或被认为已离开集群时，它将通过\
    \ **Group Membership Service (GMS)** 使用 TCP ping 机制检测到。当多播成员发现不可行时，需要基于 WKA 的成员关系。例如，在\
    \ Amazon EC2 上，不允许多播，并且无法控制分配给 EC2 实例的 IP 地址。因此，在这种情况下，往往会使用基于 WKA 的成员发现。\n\n\
    ### domain\n\n集群域/组：请注意，“domain”和“group”一词可互换使用。不同组中的节点之间不会有任何干扰。从组外成员接收的消息通常会被忽略。然而，特殊消息，例如来自组外成员的集群管理消息或成员关系消息将被允许。\n\
    \n"
