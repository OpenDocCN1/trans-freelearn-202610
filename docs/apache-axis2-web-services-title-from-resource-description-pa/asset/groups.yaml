  - '[PAGE 153]


    In the case of asynchronous type invocation, the user application (for example,
    GUI) does not block, so the user can continue working. Axis2''s way of utilizing
    a service in asynchronous is shown in the following figure:


    ![](img/e2fb05de168053e6227dab034eff9353_153_0.png)


    The preceding figure shows how a typical asynchronous message works, where the
    application uses Axis2 client and asks to send the message. When calling the Axis2
    client, the application creates a callback object and passes that to the call.
    Axis2 uses the callback and returns the control back to the client. Thus, the
    client does not get blocked. When the reply comes, the Axis2 client uses the callback
    and notifies it, by which, the application gets to know about the message arrival
    as well and acts upon it.


    # Looking into Axis2 client API


    In today''s world, people do not like and do not want to waste time to get a simple
    thing done. Thus, user friendliness is one of the key considerations for any product.
    In Axis2, one of the key designs of the Axis2 client API is to provide asynchronous
    web service invocation support. Meantime, Axis2 has the key consideration of user
    friendliness, so combining both together, the new client API is very convenient
    to work with. To make the web consumer''s or the end user''s job easier, the Axis2
    client API consists of two sub APIs called ServiceClient and OperationClient,
    one for average users and the other for advanced users, respectively.


    # ServiceClient API


    As we mentioned earlier, ServiceClient is mainly designed for average users or
    the users who have just moved to the web services field. Nevertheless, it has
    the notion of interacting with a service and providing all the necessary support
    to invoke any complex type of web service. Let''s assume a calculator as an example
    of a web service, and further assume that the service has operations such as "add",
    "deduct", "multiply", and "divide. So the idea of a service client is to provide
    an API to invoke any of those operations in a very convenient manner.'
  - "[PAGE 154]\n\n# Available options to create a ServiceClient\n\nThere are multiple\
    \ ways to create a ServiceClient instance, and of course, we can choose the most\
    \ suitable constructors for us. No matter how we create a ServiceClient, it is\
    \ required to have an an Axis2 runtime (ConfigurationContext) to invoke the service.\
    \ Either user explicitly provides an instance of configuration context or Axis2\
    \ creates it internally.\n\nEarlier, we discussed ConfigurationContext and how\
    \ to create it. So we can use those techniques to create ConfigurationContext\
    \ when creating a ServiceClient, or as we will see, we can create ServiceClient\
    \ with ConfigurationContext as null and let Axis2 create ConfigurationContext\
    \ for us.\n\n# Type 1: Creating a ServiceClient using its default constructor\n\
    \nThe easiest way to create a ServiceClient is to use its default constructor,\
    \ as shown below. In this case, it creates a ConfigurationContext using the Axis2\
    \ default configuration file, which is available in the Axis2 JAR file. In the\
    \ meantime, it creates an anonymous (dummy service) service with three operations\
    \ (three operations to support WSDL 2.0 MEPs). Even though we create a service\
    \ client this manner, we can use the created client to asses any web service.\n\
    \n```\nServiceClient serviceClient = new ServiceClient();\n```\n\nWhen we are\
    \ trying to create serviceClient inside an Axis2 system (as an example, a handler\
    \ tries to create a ServiceClient to invoke a service, or if service tries to\
    \ invoke some other service), then it is created using server's ConfigurationContext.\
    \ In this case, all the properties, transports, and modules in the server are\
    \ accessible to the ServiceClient, and that scenario is called as a client running\
    \ inside a server.\n\n# Type 2: Creating a ServiceClient with your own ConfigurationContext\n\
    \nWhen we want to create a ServiceClient with our own configuration data, we can\
    \ use the following constructor. As we know by now, there are a number of ways\
    \ to create ConfigurationContext. At the same time, there are many instances where\
    \ we want to create ServiceClient with our own AxisService, which might have configured\
    \ with custom QoS (Quality of Service), parameters, WS-Policy, and so on.\n\n\
    ```\nServiceClient serviceClient =\n    new ServiceClient (configContext, axisService);\n\
    ```"
  - "[PAGE 155]\n\nIn this case, either (or both) of the arguments can be null. If\
    \ both are null, that is obviously equivalent to the default constructor case\
    \ of ServiceClient. If ConfigurationContext is null, depending on the location\
    \ you are trying to create the ServiceClient, either a new one will be created\
    \ using the Axis2 default configuration or a server's ConfigurationContext will\
    \ be used. Similarly, if AxisService is null, an anonymous service is created.\n\
    \n# Type 3: Creating a dynamic client (client on the fly)\n\nThe idea behind a\
    \ dynamic client is to create a ServiceClient on the fly, or simply create a client\
    \ for a given WSDL at runtime and use the created ServiceClient to invoke the\
    \ corresponding service. When we create the ServiceClient in this manner, the\
    \ corresponding AxisService object is configured according to the WSDL document.\
    \ We will see the advantages of the dynamic client in the middle of this chapter.\
    \ The constructor for creating a dynamic client is given as follows:\n\n```\n\
    ServiceClient dynamicClient =new ServiceClient(\nconfigContext,wsdlURL, wsdlServiceName,\
    \ portName);\n```\n\n+   - configContext: configurationContext can be null; if\
    \ it is null, the logic mentioned in Option 2 will be applied.\n+   - wsdlURL:\
    \ This argument should not be null as it specifies the URL for the WSDL file.\n\
    +   - wsdlServiceName: As you know, the WSDL document might have multiple service\
    \ elements. So if you want to pick a specific service element, you can pass the\
    \ QName of that service element. The value of this argument can be null. If it\
    \ is null, the first one from the service element list will be considered as the\
    \ service element.\n+   - portName : As you know, a service element in a WSDL\
    \ file might have multiple ports as well. So if you want to select a specific\
    \ port, you can pass the name of the port as the value of this argument. Then,\
    \ if the value is null again, the first one from the port list will be selected\
    \ as the port.\n\nA sample WSDL to understand what the mentioned service elements\
    \ can be is shown here (the ports are shown here as well):\n\n```\n<wsdl:service\
    \ name=\"MyService\">\n    <wsdl:port name=\"ServicePort1\" binding=\"axis2:ServiceBinding1\"\
    >\n    <soap:address location=\"http://127.0.0.1:8080/axis2/services/\n      \
    \          MyService\"/>\n    </wsdl:port>\n    <wsdl:port name=\"ServicePort2\"\
    \ binding=\"axis2: ServiceBinding2 \">\n```"
