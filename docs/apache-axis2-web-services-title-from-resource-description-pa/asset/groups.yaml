  md: "\n## javax.jws.WebService\n\n### targetNamespace\n\nThis property defines the\
    \ XML namespace of the WSDL and some of the XML elements generated from this Java\
    \ class or interface annotated with the WebService annotation. The default value\
    \ is the namespace derived from the package name of this web service. For example,\
    \ if the web service is part of the org.apache.axis2.sample package, the default\
    \ namespace will be http://sample.axis2.apache.org.\n\n### serviceName\n\nThis\
    \ property defines the name of the wsdl:service in the WSDL 1.1 document. The\
    \ default value is the unqualified name of the annotated Java class or interface,\
    \ suffixed with the string \"service\".\n\n### endpointInterface\n\nThis property\
    \ defines the qualified name of the Service Endpoint Interface (SEI). This annotation\
    \ allows the separation of the interface contract from the implementation. The\
    \ endpoint implementation class is not required to implement the endpointInterface.\n\
    \n> If endpointInterface property is specified, all other WebService properties\
    \ are ignored as are all other JSR 181 annotations. Only the annotations on the\
    \ service endpoint interface will be taken into consideration.\n\n### portName\n\
    \nThis property defines the wsdl:portName in the WSDL 1.1 document. The default\
    \ value of this property is WebService.name suffixed with the string \"port\"\
    .\n\n### wsdlLocation\n\nThis property is a WSDL URL that points to an existing\
    \ WSDL 1.1 document. This property is used only if an existing WSDL is in use.\
    \ In a pure code first approach, this property will not be used.\n\nLet us look\
    \ at a simple example where the WebService annotation is used along with some\
    \ of its attributes. The following code will declare CalculatorImpl to be a web\
    \ service with the name Calculator and the targetNamespace of that web service\
    \ will be http://axis.apache.org:\n\n```\n@WebService(name = \"Calculator\", targetNamespace\
    \ = \"http://axis.apache.org\")\n\npublic class CalculatorImpl {\n    public int\
    \ add(int a, int b) {\n        return a + b;\n    }\n}\n```\n\nIf you wish to\
    \ separate the interface from the implementation class, you can do it as shown\
    \ here using the endpointInterface property. Here, the endpointInterface is declared\
    \ to be org.apache.axis2.jaxws.sample.ICalculator.\n\n```\n@WebService(endpointInterface\
    \ = \"org.apache.axis2.jaxws.sample.ICalculator\")\npublic class CalculatorImpl\
    \ {\n    public int add(int a, int b) {\n        return a + b;\n    }\n}\n```\n\
    \nThe ICalculator interface is declared to be a web service with the name Calculator\
    \ and targetNamespace http://axis.apache.org:\n\n```\n@WebService(name=\"Calculator\"\
    , targetNamespace = \"http://axis.apache.org\")\npublic interface ICalculator{\n\
    \    int add(int a, int b);\n}\n```\n\n## javax.jws.WebMethod\n\nThis annotation\
    \ can be used to customize a method which is exposed as a web service operation.\
    \ This annotation is defined as follows:\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n\
    @Target({METHOD})\npublic @interface WebMethod {\n    String operationName() default\
    \ \"\";\n    String action() default \"\";\n    boolean exclude() default false;\n\
    }\n```\n\nLet us look at the properties of the WebMethod annotation.\n\n### operationName\n\
    \nThis property defines the name of the wsdl:operation in WSDL 1.1 corresponding\
    \ to this method. The namespace of this name is taken from the value WebService.targetNamespace\
    \ or its default value. The default value of this property is the name of the\
    \ annotated Java method.\n\n### action\n\nThis property defines the action of\
    \ this method's web service operation. It defaults to \"\" (an empty string).\n\
    \n### exclude\n\nThis property is used for excluding certain methods from a web\
    \ service. Such methods will not show up as web service operations. The default\
    \ value is false.\n\nLet us look at an example where the WebMethod annotation\
    \ is used along with some of its attributes. In this example, the add method will\
    \ be exposed as a web service operation with the name addInt and the action will\
    \ be set to urn:addInt. The print method will not be exposed as a web service,\
    \ as the exclude attribute of the WebMethod annotation has been set to true.\n\
    \n```\n@WebService\npublic class CalculatorImpl {\n    @WebMethod(operationName=\"\
    addInt\", action=\"urn:addInt\")\n    public int add(int a, int b) {\n       \
    \ print(a, b);\n        return a + b;\n    }\n\n    @WebMethod(exclude=true)\n\
    \    public void print(int a, int b) {\n        System.out.println(\"a=\" + a\
    \ + \", b=\" + b);\n    }\n}\n```\n\n## javax.jws.OneWay\n\nThis annotation is\
    \ used for marking a method as a one-way method. The corresponding web service\
    \ operation will be an in-only operation. This annotation has no properties and\
    \ is defined as follows:\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n@Target({METHOD})\n\
    public @interface OneWay {\n}\n```\n\nLet us look at a simple example that demonstrates\
    \ the usage of the OneWay annotation. Here, the process operation has been declared\
    \ as an in-only operation using the OneWay attribute.\n\n```\n@WebService\npublic\
    \ class Processor {\n    @WebMethod(operationName=\"process\", action=\"urn:process\"\
    )\n    @OneWay\n    public void process(String id) {\n        System.out.println(\"\
    Processing \" + id);\n    }\n}\n```\n\n## javax.jws.WebParam\n\nYou can use this\
    \ annotation for customizing the mapping of a single parameter to a WSDL message\
    \ part or an XML element. This annotation is defined as follows:\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n\
    @Target({PARAMETER})\npublic @interface WebParam {\n    public enum Mode {\n \
    \       IN,\n        OUT,\n        INOUT\n    };\n    String name() default \"\
    \";\n    String targetNamespace() default \"\";\n    Mode mode() default Mode.IN;\n\
    \    boolean header() default false;\n    String partName() default \"\";\n}\n\
    ```\n\nLet us take a look at the properties of the WebParam annotation.\n\n###\
    \ name\n\nFor RPC bindings, this is the name of the wsdl:part representing the\
    \ parameter. For document/literal wrapped bindings, this is the local name of\
    \ the XML element, representing this parameter. This property is not used for\
    \ document/literal bare bindings.\n\n### targetNamespace\n\nThis is the namespace\
    \ of this operation parameter. It is only used with document/literal wrapped bindings.\
    \ The default value of this property is the targetNamespace of the web service.\n\
    \n### mode\n\nThis property represents the parameter flow direction for this method.\
    \ Possible values are IN, INOUT, and OUT.\n\n### header\n\nThis property defines\
    \ whether the annotated parameter should be carried in the SOAP header. The default\
    \ value is false.\n\n### partName\n\nThis property defines the wsdl:part for the\
    \ annotated parameter with RPC or document/bare operations. The default value\
    \ is WebParam.name.\n\nThe following example illustrates how the WebParam annotation\
    \ is used in practice. The add operation has been declared to have two web service\
    \ parameters with the names intA and intB:\n\n```\n@WebService(name = \"Calculator\"\
    , targetNamespace = \"http://axis.apache.org\")\npublic class CalculatorImpl {\n\
    \    @WebMethod(operationName=\"addInt\", action=\"urn:addInt\")\n    public int\
    \ add(@WebParam(name=\"intA\") int a,\n        @WebParam(name=\"intB\") int b)\
    \ {\n        return a + b;\n    }\n}\n```\n\n## javax.jws.WebResult\n\nIf you\
    \ wish to customize the mapping of the return value of a web service method to\
    \ a wsdl:part or an XML element, you should use the WebResult annotation. This\
    \ annotation is defined as follows:\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n\
    @Target({METHOD})\npublic @interface WebResult {\n    String name() default \"\
    return\";\n    String targetNamespace() default \"\";\n    boolean header() default\
    \ false;\n    String partName() default \"\";\n}\n```\n\nLet us look at the properties\
    \ of the WebResult annotation.\n\n### name\n\nThis property defines the name of\
    \ the return value in the WSDL. For RPC bindings, this is the part name of the\
    \ return value in the response message. For document bindings, this is the local\
    \ name of the XML element representing the return value.\n\n### targetNamespace\n\
    \nThis is the XML namespace of the return value and defaults to the targetNamespace\
    \ of the web service.\n\n### header\n\nThis property specifies whether the return\
    \ value needs to be carried in the SOAP header and the default value is false.\n\
    \n### partName\n\nThis property specifies the wsdl:part of the return value. It\
    \ defaults to WebResult.name.\n\nThe following examples illustrate the usage of\
    \ this annotation. The WebResult annotation declares that the name of the return\
    \ type should be return:\n\n```\n@WebService(name = \"Calculator\", targetNamespace\
    \ = \"http://axis.apache.org\")\npublic class CalculatorImpl {\n    @WebMethod(operationName=\"\
    addInt\", action=\"urn:addInt\")\n    @WebResult(name=\"return\")\n    public\
    \ int add(@WebParam(name=\"intA\") int a,\n                   @WebParam(name=\"\
    intB\") int b) {\n        return a + b;\n    }\n}\n```\n"
  mdcn: "\n\n## javax.jws.WebService\n\n### targetNamespace\n\n此属性定义 WSDL 的 XML 命名空间，以及带有\
    \ WebService 注解的 Java 类或接口所生成的部分 XML 元素的命名空间。默认值是从此 Web 服务的包名派生的命名空间。例如，如果该 Web\
    \ 服务属于 org.apache.axis2.sample 包，则默认命名空间将为 http://sample.axis2.apache.org。\n\n\
    ### serviceName\n\n此属性定义 WSDL 1.1 文档中 wsdl:service 的名称。默认值是所注解 Java 类或接口的非限定名称，并追加字符串\
    \ \"service\" 作为后缀。\n\n### endpointInterface\n\n此属性定义服务端点接口（SEI）的限定名称。该注解允许将接口契约与实现分离。端点实现类不要求实现\
    \ endpointInterface。\n\n> 如果指定了 endpointInterface 属性，则所有其他 WebService 属性以及所有其他\
    \ JSR 181 注解都将被忽略。只有服务端点接口上的注解才会被考虑。\n\n### portName\n\n此属性定义 WSDL 1.1 文档中的 wsdl:portName。此属性的默认值是\
    \ WebService.name 后追加字符串 \"port\"。\n\n### wsdlLocation\n\n此属性是一个指向现有 WSDL 1.1\
    \ 文档的 WSDL URL。此属性仅在使用现有 WSDL 时才会用到。在纯代码优先的方法中，不会使用此属性。\n\n让我们看一个简单示例，该示例将 WebService\
    \ 注解与其部分属性结合使用。以下代码将声明 CalculatorImpl 为一个名为 Calculator 的 Web 服务，且该 Web 服务的 targetNamespace\
    \ 将为 http://axis.apache.org：\n\n```\n@WebService(name = \"Calculator\", targetNamespace\
    \ = \"http://axis.apache.org\")\n\npublic class CalculatorImpl {\n    public int\
    \ add(int a, int b) {\n        return a + b;\n    }\n}\n```\n\n如果你希望将接口与实现类分离，可以像下面这样使用\
    \ endpointInterface 属性。在这里，endpointInterface 被声明为 org.apache.axis2.jaxws.sample.ICalculator。\n\
    \n```\n@WebService(endpointInterface = \"org.apache.axis2.jaxws.sample.ICalculator\"\
    )\npublic class CalculatorImpl {\n    public int add(int a, int b) {\n       \
    \ return a + b;\n    }\n}\n```\n\nICalculator 接口被声明为一个名为 Calculator 的 Web 服务，其\
    \ targetNamespace 为 http://axis.apache.org：\n\n```\n@WebService(name=\"Calculator\"\
    , targetNamespace = \"http://axis.apache.org\")\npublic interface ICalculator{\n\
    \    int add(int a, int b);\n}\n```\n\n## javax.jws.WebMethod\n\n此注解可用于自定义作为 Web\
    \ 服务操作暴露的方法。该注解定义如下：\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n@Target({METHOD})\n\
    public @interface WebMethod {\n    String operationName() default \"\";\n    String\
    \ action() default \"\";\n    boolean exclude() default false;\n}\n```\n\n让我们看一下\
    \ WebMethod 注解的属性。\n\n### operationName\n\n此属性定义与此方法对应的 WSDL 1.1 中 wsdl:operation\
    \ 的名称。该名称的命名空间取自 WebService.targetNamespace 的值或其默认值。此属性的默认值是所注解 Java 方法的名称。\n\n\
    ### action\n\n此属性定义此方法的 Web 服务操作的 action。其默认值为 \"\"（空字符串）。\n\n### exclude\n\n\
    此属性用于从 Web 服务中排除某些方法。此类方法将不会作为 Web 服务操作出现。默认值为 false。\n\n让我们看一个将 WebMethod 注解与其部分属性结合使用的示例。在此示例中，add\
    \ 方法将作为名为 addInt 的 Web 服务操作暴露，action 将设置为 urn:addInt。print 方法将不会作为 Web 服务暴露，因为\
    \ WebMethod 注解的 exclude 属性已设置为 true。\n\n```\n@WebService\npublic class CalculatorImpl\
    \ {\n    @WebMethod(operationName=\"addInt\", action=\"urn:addInt\")\n    public\
    \ int add(int a, int b) {\n        print(a, b);\n        return a + b;\n    }\n\
    \n    @WebMethod(exclude=true)\n    public void print(int a, int b) {\n      \
    \  System.out.println(\"a=\" + a + \", b=\" + b);\n    }\n}\n```\n\n## javax.jws.OneWay\n\
    \n此注解用于将方法标记为单向方法。相应的 Web 服务操作将是仅入站操作。此注解没有属性，定义如下：\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n\
    @Target({METHOD})\npublic @interface OneWay {\n}\n```\n\n让我们看一个演示 OneWay 注解用法的简单示例。在这里，process\
    \ 操作已通过 OneWay 属性被声明为仅入站操作。\n\n```\n@WebService\npublic class Processor {\n  \
    \  @WebMethod(operationName=\"process\", action=\"urn:process\")\n    @OneWay\n\
    \    public void process(String id) {\n        System.out.println(\"Processing\
    \ \" + id);\n    }\n}\n```\n\n## javax.jws.WebParam\n\n你可以使用此注解来自定义单个参数到 WSDL\
    \ 消息部件或 XML 元素的映射。该注解定义如下：\n\n```\n@Retention(value=RetentionPolicy.RUNTIME)\n\
    @Target({PARAMETER})\npublic @interface WebParam {\n    public enum Mode {\n \
    \       IN,\n        OUT,\n        INOUT\n    };\n    String name() default \"\
    \";\n    String targetNamespace() default \"\";\n    Mode mode() default Mode.IN;\n\
    \    boolean header() default false;\n    String partName() default \"\";\n}\n\
    ```\n\n让我们看一下 WebParam 注解的属性。\n\n### name\n\n对于 RPC 绑定，这是表示该参数的 wsdl:part 的名称。对于\
    \ document/literal wrapped 绑定，这是表示该参数的 XML 元素的本地名称。此属性不用于 document/literal bare\
    \ 绑定。\n\n### targetNamespace\n\n这是此操作参数的命名空间。它仅用于 document/literal wrapped 绑定。此属性的默认值是\
    \ Web 服务的 targetNamespace。\n\n### mode\n\n此属性表示此方法的参数流向。可能的值有 IN、INOUT 和 OUT。\n\
    \n### header\n\n此属性定义所注解的参数是否应放在 SOAP 头中。默认值为 false。\n\n### partName\n\n此属性为带有\
    \ RPC 或 document/bare 操作的所注解参数定义 wsdl:part。默认值为 WebParam.name。\n\n以下示例演示了 WebParam\
    \ 注解的实际用法。add 操作被声明为具有两个名为 intA 和 intB 的 Web 服务参数：\n\n```\n@WebService(name =\
    \ \"Calculator\", targetNamespace = \"http://axis.apache.org\")\npublic class\
    \ CalculatorImpl {\n    @WebMethod(operationName=\"addInt\", action=\"urn:addInt\"\
    )\n    public int add(@WebParam(name=\"intA\") int a,\n        @WebParam(name=\"\
    intB\") int b) {\n        return a + b;\n    }\n}\n```\n\n## javax.jws.WebResult\n\
    \n如果你希望自定义 Web 服务方法的返回值到 wsdl:part 或 XML 元素的映射，则应使用 WebResult 注解。该注解定义如下：\n\n\
    ```\n@Retention(value=RetentionPolicy.RUNTIME)\n@Target({METHOD})\npublic @interface\
    \ WebResult {\n    String name() default \"return\";\n    String targetNamespace()\
    \ default \"\";\n    boolean header() default false;\n    String partName() default\
    \ \"\";\n}\n```\n\n让我们看一下 WebResult 注解的属性。\n\n### name\n\n此属性定义返回值在 WSDL 中的名称。对于\
    \ RPC 绑定，这是响应消息中返回值的部件名称。对于 document 绑定，这是表示返回值的 XML 元素的本地名称。\n\n### targetNamespace\n\
    \n这是返回值的 XML 命名空间，默认与 Web 服务的 targetNamespace 相同。\n\n### header\n\n此属性指定返回值是否需要放在\
    \ SOAP 头中，默认值为 false。\n\n### partName\n\n此属性指定返回值的 wsdl:part。其默认为 WebResult.name。\n\
    \n以下示例演示了此注解的用法。WebResult 注解声明返回类型的名称应为 return：\n\n```\n@WebService(name = \"\
    Calculator\", targetNamespace = \"http://axis.apache.org\")\npublic class CalculatorImpl\
    \ {\n    @WebMethod(operationName=\"addInt\", action=\"urn:addInt\")\n    @WebResult(name=\"\
    return\")\n    public int add(@WebParam(name=\"intA\") int a,\n              \
    \     @WebParam(name=\"intB\") int b) {\n        return a + b;\n    }\n}\n```\n\
    \n"
