    \ XML 元素的命名空间，默认值为包含该 Java 属性的类的命名空间。\n\n## JSR 250（通用注解）\n\n本节将介绍 JSR 250（通用注解）规范中引入的一些有用注解。我们将介绍以下注解：\n\
