    # Writing an Axis2 Module


    If we look at the Sandesha module.xml, we will be able to learn and find out more
    about writing a module.xml file.


    # Summary


    In this chapter, you learned about the importance of the Axis2 module. We also
    learned that the Axis2 module provides a very flexible way to extend the Axis2
    core functionality and provides quality service. Moreover, we discussed the module
    and related concepts by writing a sample module and demonstrating most of the
    commonly used configuration settings. In our sample application, we discussed
    how to write handlers, how to write module implementation classes, and finally,
    how to put everything together and deploy the module. At the end of the chapter,
    we learned how to engage a module to Axis2.


    In this chapter, we discussed how to write and deploy services and how to write
    and deploy modules. In the next chapter, we are going to discuss how to invoke
    a remote service. There, we will discuss how to use Axis2 as a client and invoke
    services in a number of ways.'
  - '[PAGE 151]


    # # The Client API


    Web service is one of the commonly used approaches for applications integration
    (composition), when integrating applications; an application can act as either
    a consumer (client) or a producer (server). A web service framework should be
    able to deploy services as well as access the services. So far, we have discussed
    the deployment side of it. Thus, in this chapter, we will focus on the client
    side and how to use Axis2 to access remote services. In high level, Axis2 runtime
    does not differentiate between the client side and the server side. Moreover,
    it uses the same execution framework at the server side as well as the client
    side. As we already discussed, in the server side, we have services. Thus, to
    keep the symmetry in the client side as well, Axis2 creates a dummy service when
    we use the client API. In this chapter, we will look at the various aspects of
    the client API, with the example use case.


    In this chapter, we will discuss most of the commonly used APIs of the Axis2 client,
    as well as explaining how to use them with sample code. First, we will discuss
    the various ways of creating the Axis2 client instance. Then, we will discuss
    the available APIs and finally, we will discuss the more advanced uses of Axis2
    client APIs. Particularly, we will be covering the following items in detail:


    +   - The idea of the web service client

    +   - Synchronous and asynchronous service invocation

    +   - Axis2 client APIs, namely, `ServiceClient` and `OperationClient`

    +   - Demonstrate `ServiceClient` APIs with examples

    +   - Demonstrate `OperationClient` APIs with examples'
