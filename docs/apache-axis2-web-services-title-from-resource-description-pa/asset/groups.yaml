    \ to access the service the first time, Axis2 will generate serviceGroupId and\
    \ send that to the client as a reference parameter in wsa:ReplyTo, as shown next.\
    \ However, we should mention here that to have SOAP session support both the client\
    \ and the server, it has to have WS-addressing support.\n\n```xml\n<wsa:ReplyTo>\n\
    \    <wsa:Address>http://www.w3.org/2005/08/addressing/anonymous</wsa:Address>\n\
    \    <wsa:ReferenceParameters>\n<axis2:ServiceGroupId xmlns:axis2=\"http://ws.apache.org/namespaces/axis2\"\
    >urn:uuid:65E9C56F702A398A8B11513011677354</axis2:ServiceGroupId>\n    </wsa:ReferenceParameters>\n\
    </wsa:ReplyTo>\n```\n\nSo if a client wants to live in the same session, then\
    \ he/she has to copy that reference parameter and send it back to the server when\
    \ he/she invokes the service the second time. As long as a client sends the valid\
    \ ServiceGroupId, he/she can use the same session, and a service can maintain\
    \ the session-related data. Unlike request session scope, SOAP session has a default\
    \ timeout period, if the client does not touch the service for a period of 30\
    \ seconds, then the session will expire, and if the client sends the old serviceGroupId,\
    \ he/she will get an AxisFault. We can change the default timeout period by changing\
    \ the server's axis2.xml file as follows:\n\n```xml\n<parameter name=\"ConfigContextTimeoutInterval\"\
    >30000</parameter>\n```\n\nBy changing the parameter value, we can have a timeout\
    \ interval that we want.\n\nAs mentioned earlier, deploying a service in a SOAP\
    \ session requires that we change services.xml as follows:\n\n```xml\n<service\
    \ name=\"MyService\" scope=\"soapsession\">\n</service>\n```\n\nThe createPayLoad\
    \ method is shown here:\n\n```java\npublic static OMElement createPayLoad(int\
    \ intValue) {\n    OMFactory fac = OMAbstractFactory.getOMFactory();\n    OMNamespace\
    \ omNs = fac.createOMNamespace(\n        \"http://ws.apache.org/axis2\"\n```\n\
    \nOnce we run the code, we will see following output on the client side:\n\n```text\n\
    10\n10\n```\n\nThis means that though we invoke the service twice, we have gotten\
    \ the same output. This simply means no session has taken place, so now let's\
    \ change our client code a bit and see what we are getting. Just add the following\
    \ line of code and run the client again:\n\n```java\nopts.setManageSession(true);\n\
    sc.setOptions(opts);\n```\n\nNow you should see the following output on the client\
    \ side:\n\n```text\n10\n20\n```\n\nSo this simply tells us that we have invoked\
    \ the service in a session-aware manner.\n\n### Option 2: Using the service client\n\
    \nWhen we use the service client, once we set the session management flag to true,\
    \ it will send back the transport cookie as well. So if we run the following code,\
    \ we will see the following outcome:\n\n```java\nServiceClient sc = new ServiceClient();\n\
    Options opts = new Options();\nopts.setTo(new EndpointReference(\n\"http://127.0.0.1:8000/axis2/services/MyService\"\
    ));\nopts.setAction(\"urn:add\");\nopts.setManageSession(true);\nsc.setOptions(opts);\n\
    OMElement ele = sc.sendReceive(createPayLoad(10));\nSystem.out.println(ele.getFirstElement().getText());\n\
    ele = sc.sendReceive(createPayLoad(10));\nSystem.out.println(ele.getFirstElement().getText());\n\
    ```\n\n![](img/e2fb05de168053e6227dab034eff9353_179_0.png)\n\nIt simply tells\
    \ us that we have to invoke the service deployed in the transport session (invoked\
    \ in a session-aware manner). In this case, we do not need to have the addressing\
    \ module.\n\n### Application scope\n\nApplication scope has the longest lifetime\
    \ compared to all the others and the lifetime of the application session is equal\
    \ to the lifetime of the system. If we deploy a service in the application scope,\
    \ there will be only one instance of that service and obviously there will be\
    \ only one ServiceContext for that service too. In the world of Axis2, if we consider\
    \ the memory footprint and if we don't want to manage a session, then a good idea\
    \ is to deploy the service in the application scope.\n\nWhen we deploy a service\
    \ in the application scope, a client does not need to send any additional data\
    \ to use the same session.\n\nTo deploy a service in the application scope, we\
    \ need to change axis2.xml, as shown here:\n\n```xml\n<service name=\"foo\" scope=\"\
    application\">\n</service>\n```\n\n> Service deployed in the application session\
    \ scope is not guaranteed to be threading-safe.\n\n### Managing sessions using\
    \ ServiceClient\n\nAs we know by now, managing a session in the client side involves\
    \ a bit of work. As mentioned earlier, both in the SOAP session and transport\
    \ session, a client has to send the session-related data, if he/she wants to live\
    \ in the same session. Maybe he can do that for a SOAP session by copying the\
    \ required reference parameters. However, with transport session, how can a user\
    \ get access to transport, to copy, and send cookies?\n\nTo make life easier,\
    \ Axis2 has the inbuilt capability of managing sessions in the client session\
    \ by just setting a flag, and we have used that already. Then, depending on the\
    \ service-side session, it will send the corresponding data as long as we use\
    \ the same service client. So, the main requirement is to use the same service\
    \ client to invoke the service if you want to live in the same session.\n\nIf\
    \ we want to live in the same session, we can create a service client, shown as\
    \ follows, and re-use the created service client object to invoke the service:\n\
    \n```java\nOptions options = new Options();\noptions.setManageSession(true);\n\
    ServiceClient sender = new ServiceClient();\nsender.setOptions(options);\n```\n\
    \nOnce we create the ServiceClient, as shown here, if the service deploys in a\
    \ SOAP session, it will copy the serviceGroupId and send that from the second\
    \ invocation onwards. If the server sends the session ID, such as HTTP cookies,\
    \ it will copy that to ServiceContext (in the client side) and send it back to\
    \ the server when the client invokes the service for the second time.\n\n### Summary\n\
    \nStateless nature is one of the main characteristics of web services. However,\
    \ this is a limitation for the advanced web services developers. Developing an\
    \ enterprise level application using web services is not easy, unless we have\
    \ a session management layer. Axis2 has the level four of sessions to address\
    \ enterprises level web service development issues. In this chapter, we discussed\
    \ different types of sessions available in Axis2. After that, we used a sample\
    \ service and a sample client to demonstrate the different sessions and how they\
    \ work.\n\nIn the next chapter, we will focus on another very good web service\
    \ specification, called JAXWS. There, we covered the JAXWS annotations, deployment,\
    \ and some examples to illustrate how to use it.\n\n## 11 Developing JAX-WS Web\
    \ Services\n\nJava API for XML-based web services is a popular standard, targeting\
    \ Java developers who write web services and web service clients. The conventional\
    \ **contract first** approach, which consists of defining the web service contract\
    \ in a WSDL and then generating the appropriate code from those WSDLs, is not\
    \ the most natural way of programming for Java developers. The JAX-WS specifications\
    \ allow you to write a regular Java code and annotate the code appropriately,\
    \ in order to make them into web services. Therefore, JAX-WS is a **code first**\
    \ approach for developing web services and clients in Java. The ease of development\
    \ is achieved through writing everything as Java classes and not having to write\
    \ any specific deployment descriptor file such as `services.xml` files utilized\
    \ by Axis2 AAR services. Older Java Web Service specifications such as JAX-RPC\
    \ required the web service classes to implement a specific interface. With JAX-WS,\
    \ there is no such restriction and regular POJOs can be made into web services\
    \ with minimal changes. JAX-WS also allows contract first development. You will\
    \ see how JAX-WS-annotated web services can be generated starting from WSDL using\
    \ the wsimport tool later in this chapter. At the time of writing, Axis2 only\
    \ supports the JAX-WS 2.0 specification.\n\nIn this chapter, we will be looking\
    \ at:\n\n- JAX-WS Annotations\n- Server-side JAX-WS\n- Client-side JAX-WS\n\n\
    By the end of this chapter, you will have a good understanding about JAX-WS annotations\
    \ and how to develop JAX-WS services and clients in Apache Axis2.\n"
  mdcn: "\n\n为了管理一个 SOAP 会话，客户端需要在 SOAP 头部发送一个额外的引用参数，命名为 serviceGroupId（当客户端第一次调用部署在\
    \ SOAP 会话中的服务时，该参数会发送给客户端）。与此同时，SOAP 会话必须提供一种方式来跨不仅单个服务调用，而且服务组中的多个服务来管理会话。只要我们处于同一个\
    \ SOAP 会话中，我们就可以在 ServiceContext 中管理与服务相关的数据，如果我们想在组中的其他服务之间共享数据，那么我们就可以使用 ServiceGroupContext\
    \ 来存储会话相关的数据。\n\n当我们在 SOAP 会话中部署一个服务并且客户端第一次尝试访问该服务时，Axis2 会生成 serviceGroupId\
    \ 并将其作为引用参数发送给客户端，位于 wsa:ReplyTo 中，如下所示。然而，我们在这里应该提到的是，要使 SOAP 会话得到支持，客户端和服务器都必须具有\
    \ WS-addressing 支持。\n\n```xml\n<wsa:ReplyTo>\n    <wsa:Address>http://www.w3.org/2005/08/addressing/anonymous</wsa:Address>\n\
    \    <wsa:ReferenceParameters>\n<axis2:ServiceGroupId xmlns:axis2=\"http://ws.apache.org/namespaces/axis2\"\
    >urn:uuid:65E9C56F702A398A8B11513011677354</axis2:ServiceGroupId>\n    </wsa:ReferenceParameters>\n\
    </wsa:ReplyTo>\n```\n\n因此，如果客户端想保持在同一个会话中，那么他/她必须复制该引用参数，并在第二次调用服务时将其发送回服务器。只要客户端发送有效的\
    \ ServiceGroupId，他/她就可以使用同一个会话，并且服务可以维护会话相关的数据。与请求会话作用域不同，SOAP 会话有一个默认的超时时间，如果客户端在\
    \ 30 秒的时间段内未访问服务，则会话将过期，如果客户端发送旧的 serviceGroupId，他/她将收到一个 AxisFault。我们可以通过按如下方式更改服务器的\
    \ axis2.xml 文件来更改默认超时时间：\n\n```xml\n<parameter name=\"ConfigContextTimeoutInterval\"\
    >30000</parameter>\n```\n\n通过更改参数值，我们可以获得我们想要的超时间隔。\n\n如前所述，将服务部署在 SOAP 会话中需要我们按如下方式更改\
    \ services.xml：\n\n```xml\n<service name=\"MyService\" scope=\"soapsession\">\n\
    </service>\n```\n\ncreatePayLoad 方法如下所示：\n\n```java\npublic static OMElement createPayLoad(int\
    \ intValue) {\n    OMFactory fac = OMAbstractFactory.getOMFactory();\n    OMNamespace\
    \ omNs = fac.createOMNamespace(\n        \"http://ws.apache.org/axis2\"\n```\n\
    \n一旦我们运行代码，我们将在客户端看到以下输出：\n\n```text\n10\n10\n```\n\n这意味着尽管我们调用了服务两次，但我们得到了相同的输出。这仅仅意味着没有会话发生，所以现在让我们稍微更改一下客户端代码，看看我们得到什么。只需添加以下代码行并再次运行客户端：\n\
    \n```java\nopts.setManageSession(true);\nsc.setOptions(opts);\n```\n\n现在你应该在客户端看到以下输出：\n\
    \n```text\n10\n20\n```\n\n这就简单地告诉我们，我们已以会话感知的方式调用了服务。\n\n### Option 2: Using the\
    \ service client\n\n当我们使用服务客户端时，一旦我们将会话管理标志设置为 true，它也会发送回传输 cookie。因此，如果我们运行以下代码，我们将看到以下结果：\n\
    \n```java\nServiceClient sc = new ServiceClient();\nOptions opts = new Options();\n\
    opts.setTo(new EndpointReference(\n\"http://127.0.0.1:8000/axis2/services/MyService\"\
    ));\nopts.setAction(\"urn:add\");\nopts.setManageSession(true);\nsc.setOptions(opts);\n\
    OMElement ele = sc.sendReceive(createPayLoad(10));\nSystem.out.println(ele.getFirstElement().getText());\n\
    ele = sc.sendReceive(createPayLoad(10));\nSystem.out.println(ele.getFirstElement().getText());\n\
    ```\n\n![](img/e2fb05de168053e6227dab034eff9353_179_0.png)\n\n它简单地告诉我们，我们必须以会话感知的方式调用部署在传输会话中的服务。在这种情况下，我们不需要地址模块。\n\
    \n### Application scope\n\n与所有其他作用域相比，Application 作用域具有最长的使用寿命，并且应用程序会话的生命周期等于系统的生命周期。如果我们在应用程序作用域中部署一个服务，那么该服务只有一个实例，显然该服务也只有一个\
    \ ServiceContext。在 Axis2 的世界中，如果我们考虑内存占用并且不想管理会话，那么一个好主意是将服务部署在应用程序作用域中。\n\n当我们在应用程序作用域中部署服务时，客户端不需要发送任何额外数据来使用同一个会话。\n\
    \n要将服务部署在应用程序作用域中，我们需要更改 axis2.xml，如下所示：\n\n```xml\n<service name=\"foo\" scope=\"\
    application\">\n</service>\n```\n\n> 部署在应用程序会话作用域中的服务不能保证是线程安全的。\n\n### Managing\
    \ sessions using ServiceClient\n\n正如我们现在所知，在客户端管理会话涉及一些工作。如前所述，在 SOAP 会话和传输会话中，客户端必须发送会话相关数据，如果他/她想保持在同一个会话中。也许他可以为\
    \ SOAP 会话通过复制所需的引用参数来做到这一点。然而，对于传输会话，用户如何访问传输以复制和发送 cookie？\n\n为了让生活更轻松，Axis2\
    \ 具有内置的能力，通过设置一个标志来在客户端会话中管理会话，我们已经使用了它。然后，根据服务端的会话，只要我们使用同一个服务客户端，它就会发送相应的数据。因此，主要要求是如果你想保持在同一个会话中，使用同一个服务客户端来调用服务。\n\
    \n如果我们想保持在同一个会话中，我们可以创建如下所示的服务客户端，并重用创建的服务客户端对象来调用服务：\n\n```java\nOptions options\
    \ = new Options();\noptions.setManageSession(true);\nServiceClient sender = new\
    \ ServiceClient();\nsender.setOptions(options);\n```\n\n一旦我们创建了 ServiceClient，如上所示，如果服务部署在\
    \ SOAP 会话中，它将复制 serviceGroupId 并从第二次调用开始发送该 ID。如果服务器发送会话 ID，例如 HTTP cookie，它将将其复制到\
    \ ServiceContext（在客户端）并在客户端第二次调用服务时将其发送回服务器。\n\n### Summary\n\n无状态特性是 Web 服务的主要特征之一。然而，这对于高级\
    \ Web 服务开发人员来说是一个限制。开发企业级应用程序使用 Web 服务并不容易，除非我们有一个会话管理层。Axis2 具有四级会话来解决企业级 Web\
    \ 服务开发问题。在本章中，我们讨论了 Axis2 中可用的不同类型的会话。之后，我们使用示例服务和示例客户端来演示不同的会话以及它们的工作方式。\n\n\
    在下一章中，我们将重点关注另一个非常好的 Web 服务规范，称为 JAXWS。在那里，我们将介绍 JAXWS 注释、部署以及一些示例来说明如何使用它。\n\n\
    ## 11 Developing JAX-WS Web Services\n\nJava API for XML-based web services 是一个流行的标准，面向编写\
    \ Web 服务和 Web 服务客户端的 Java 开发人员。传统的 **contract first** 方法，即在 WSDL 中定义 Web 服务契约，然后从这些\
    \ WSDL 生成适当代码，并不是 Java 开发人员最自然的编程方式。JAX-WS 规范允许你编写常规的 Java 代码并适当地注释代码，以便将其制作成\
    \ Web 服务。因此，JAX-WS 是在 Java 中开发 Web 服务和客户端的 **code first** 方法。开发的简便性是通过将所有内容作为\
    \ Java 类编写来实现的，而无需编写任何特定的部署描述符文件，例如 Axis2 AAR 服务使用的 `services.xml` 文件。旧的 Java\
    \ Web 服务规范如 JAX-RPC 要求 Web 服务类实现特定的接口。使用 JAX-WS，没有此类限制，常规 POJOs 可以通过最少的更改制作成 Web\
    \ 服务。JAX-WS 也允许 contract first 开发。你将在本章后面看到如何使用 wsimport 工具从 WSDL 开始生成 JAX-WS\
    \ 注释的 Web 服务。截至撰写本文时，Axis2 仅支持 JAX-WS 2.0 规范。\n\n在本章中，我们将介绍：\n\n- JAX-WS Annotations\n\
    - Server-side JAX-WS\n- Client-side JAX-WS\n\n到本章结束时，你将对 JAX-WS 注释有很好的理解，并且了解如何在\
    \ Apache Axis2 中开发 JAX-WS 服务和客户端。\n\n"
