  - "[PAGE 287]\n\nThe preceding code snippet has the password callback class we will\
    \ be using for this sample. As you can see, we have hardcoded the password; but\
    \ when you write complex callback classes, you can retrieve the logic and set\
    \ the correct password.\n\n# Creating the policy element\n\nRampart uses policy-based\
    \ configuration for its server and client side. So to configure the service, we\
    \ need to provide the required WS-policy configuration. Here we are not going\
    \ to discuss the WS-policy in detail. We simply provide the required policy configuration\
    \ for the service, as shown in the following code snippet:\n\n```\n<wsp:Policy\
    \ wsu:Id=\"UsernameTokenOverHTTPS\"\n    xmlns:wsu=\"http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wsssecurity-utility-1.0.xsd\"\
    \n    xmlns:wsp=\"http://schemas.xmlsoap.org/ws/2004/09/policy\">\n    <wsp:ExactlyOne>\n\
    \        <wsp:All>\n            <sp:TransportBinding\n            xmlns:sp=\"\
    http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\">\n                <wsp:Policy>\n\
    \                    <sp:TransportToken>\n                        <wsp:Policy>\n\
    \                            <sp:HttpsToken\n                            </wsp:Policy>\n\
    \                        </sp:TransportToken>\n                        <sp:AlgorithmSuite>\n\
    \                            <wsp:Policy>\n                                <sp:Basic256/>\n\
    \                            </wsp:Policy>\n                        </sp:AlgorithmSuite>\n\
    \                        <sp:Layout>\n                            <wsp:Policy>\n\
    \                                <sp:Lax/>\n                            </wsp:Policy>\n\
    \                        </sp:Layout>\n                        <sp:IncludeTimestamp/>\n\
    \                    </wsp:Policy>\n                </sp:TransportBinding>\n \
    \               <sp:SignedSupportingTokens xmlns:sp=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\"\
    >\n                    <wsp:Policy>\n                        <sp:UsernameToken\
    \ sp:IncludeToken=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy/IncludeToken/AlwaysToRecipient\"\
    \ />\n                    </wsp:Policy>\n                </sp:SignedSupportingTokens>\n\
    ```"
  - "[PAGE 288]\n\n```\n<ramp:RampartConfig xmlns:ramp=\"http://ws.apache.org/rampart/policy\"\
    >\n    <ramp:passwordCallbackClass>PWC BHandler</ramp:passwordCallbackClass>\n\
    </ramp:RampartConfig>\n</wsp:All>\n</wsp:ExactlyOne>\n</wsp:Policy>\n```\n\nIf\
    \ you are familiar with WS-security and WS-policy, you can see that it contains\
    \ two main security assertions — transport binding assertion and signed supporting\
    \ token assertion. Transport binding assertion defines the requirement of using\
    \ an SSL transport using the HTTPS transport token assertion. Signed supporting\
    \ token defines the requirement of a username token that should be integrity-protected\
    \ at the transport level.\n\nNow we have everything. Next, we need to create the\
    \ services.xml file for our sample service with the following code:\n\n```\n<service>\n\
    \    <module ref=\"rampart\"/>\n    <parameter name=\"ServiceClass\">SecureService</parameter>\n\
    \    <messageReceivers>\n        <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-out\"\
    \ class=\"org.apache.axis2.rpc.receivers.RPCMessageReceiver\"/>\n        <messageReceiver\
    \ mep=\"http://www.w3.org/2004/08/wsdl/in-only\" class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"\
    />\n    </messageReceivers>\n    <wsp:Policy wsu:Id=\"UsernameTokenOverHTTPS\"\
    \ xmlns:wsu=\"http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wssecurity-utility-1.0.xsd\"\
    \ xmlns:wsp=\"http://schemas.xmlsoap.org/ws/2004/09/policy\">\n    </wsp:Policy>\n\
    </service>\n```\n\nNow compile the service class and the callback object and create\
    \ the service archive file by using the services.xml file mentioned. You can validate\
    \ the service deployment by logging in to the web administrative console. If you\
    \ follow the preceding procedure correctly, you should be in good shape."
