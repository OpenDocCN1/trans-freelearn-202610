    You can download the latest version (or 1.5) from the Axis2 official website or
    any mirror site. The download link is shown here:


    ```

    http://ws.apache.org/axis2/download/1_5_1/download.cgi

    ```


    Once you go the download page, you can find four different distributions (artifacts):


    +   - Binary distribution

    +   - WAR distribution

    +   - Source distribution

    +   - Document distribution


    In addition, you can also download IDE plugins from Axis2''s official website
    (IDE tools include both Eclipse and IntelliJ IDEA).


    # Binary distribution


    Axis2 binary distribution consists of all the relevant third-party libraries,
    a set of samples, and Axis2 runtime. Installing binary distribution is just a
    matter of extracting ZIP archive files into a location where you want. Once you
    download and extract the binary distribution, you will be able to see a set of
    subdirectories inside it (bin, lib, samples, repository, webapp, and conf). A
    typical structure of an extracted binary distribution is shown below:


    ![](img/e2fb05de168053e6227dab034eff9353_38_0.png)


    Axis2 binary distribution is a complete package where you can deploy services
    and expose them using SimpleAxisServer. SimpleAxisServer is a fully functional
    server that can be used as the backend server to expose the web service. It supports
    all the features that the servlet version supports, including session management,
    thread management, auto WSDL generation, and others.


    We can also use Axis2 binary distribution to invoke remote services. For this
    you need to add Axis2 and other related libraries into the class path and use
    Axis2 Client APIs to invoke the service. One of the commonly used approaches is
    to add those libraries into your IDE and client applications developed from that.'
