    +   - The transport level non-blocking invocation where invocation occurs in two
    transports (it could either be two single-channel transports, such as SMTP, or
    two double-channel transports such as HTTP)


    Axis2 client API supports both non-blocking invocation scenarios.


    Axis2 introduces a very convenient client API for invoking a service that consists
    of two classes called `ServiceClient` and `OperationClient`. `ServiceClient`.
    API is intended for regular usage when you just require sending and receiving
    XML. On the other hand, Operation client is meant for advanced usage, when there
    is a need to work with SOAP headers and some other advanced tasks. With `ServiceClient`,
    you can only access SOAP body or the pay load. Although we can add SOAP headers,
    you do not have any way to retrieve the SOAP header by using the `ServiceClient`.
    We need to use an operation client for such a function.


    `ServiceClient` has the following API for invoking a service:


    +   - **sendRobust**: The whole idea of this API is to send an XML request to
    the web service and not care about its response. However, if something goes wrong,
    you would be required to know that too. So this API invokes a service where it
    does not have a return value but would throw an exception.


    +   - **fireAndForget**: This API is for just sending an XML request and not caring
    about neither the response, nor the exception. Hence, this is useful in invoking
    an In-Only MEP.


    +   - **sendReceive**: This invokes a service that has a return value. This is
    one of the most commonly used APIs. Hence, this is used for invoking an In-Out
    MEP.


    +   - **sendReceiveNonBlocking**: This invokes a service in a non-blocking manner.
    This method can be used when the service has a return value. In order to use this
    method, we have to pass a callback object that is called once the invocation is
    complete.


    As mentioned earlier, the `OperationClient` is for advanced users, and working
    with `OperationClient` requires you to know Axis2 in depth. In `ServiceClient`,
    you do not have to know anything about SOAP envelope, message context, and others.
    But when it comes to `OperationClient`, the users have to create these by themselves
    before invoking a service. Creating and invoking a service using `OperationClient`
    involves the following steps:


    +   1. Create a `ServiceClient`.

    +   2. After that, create `OperationClient` with the use of `ServiceClient` that
    you have created.

    +   3. Create a SOAP envelop.

    +   4. Create message context.'
