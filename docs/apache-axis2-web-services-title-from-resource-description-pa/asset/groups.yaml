    public class CalculatorImpl {\n    public int add(int a, int b) {\n        return\
    \ a + b;\n    }\n}\n```\n\n# JSR 224 (JAX-WS) annotations\n\nIn this section,\
    \ we will be looking at some of the useful annotations introduced in the JSR 224\
