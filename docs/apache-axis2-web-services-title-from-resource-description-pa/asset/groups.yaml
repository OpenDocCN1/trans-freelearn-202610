  - '[PAGE 46]


    # XML processing model


    As mentioned in *Chapter 1, Apache Web Services and Axis2*, Axis2 is built on
    a completely new architecture as compared to Axis 1.x. One of the key reasons
    for introducing Axis2 was to have a better and efficient XML processing model.
    Axis 1.x used DOM as its XML representation mechanism, which required the complete
    objects hierarchy (corresponding to incoming messages) to be kept in the memory.
    This will not be a problem for small-sized messages. But when it comes to large-sized
    messages, it becomes an issue. To overcome this problem, Axis2 has introduced
    a new XML representation.


    AXIOM (AXIS2 Object Model) forms the basis of the XML representation for every
    SOAP-based message in Axis2. The advantage of AXIOM over the other XML InfoSet
    representations is that it is based on pull parser technique, whereas most others
    are based on PUSH parser technique.


    The main difference of pull over push is that in pull technique, the invoker has
    full control over the parser, and it can request for the next event and act upon
    that, whereas in the case of PUSH, the parser has limited control and delegates
    most of the functionality to handlers that respond to the events that are fired
    during the course of processing the document.


    As AXIOM is based on pull parser technique, it has "on-demand-building" capability
    wherein object model will be built only if it is asked to do so. If required,
    one can directly access underline pull parser from AXIOM, and use that rather
    than build an **Object Model (OM)**.


    # SOAP processing model


    Sending, receiving, and processing a SOAP message is one of the key jobs of the
    SOAP-processing engine. The architecture in Axis2 provides two pipes (or flows)
    in order to perform two basic actions. Old messaging systems such as RPC were
    built around request and response. In Axis, it goes beyond that and introduces
    one-way message processing. With this, there can be request without any responses.


    The AxisEngine or driver of Axis2 defines two methods, `send()` and `receive()`,
    to implement these two pipes. The two pipes are named **InFlow** and **OutFlow**.
    The complex Message Exchange Patterns (MEPs) are constructed by combining these
    two types of pipes. It should be noted that in addition to these two pipes, there
    are two other pipes as well, which help in handling incoming and sending *fault*
    messages.'
