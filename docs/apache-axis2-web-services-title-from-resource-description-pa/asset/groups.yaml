    \ Sandesha2 模块。\n\n> 在进入下一步之前，你还需要将 Sandesha2 和 addressing 模块部署到客户端类路径中。如果你有客户端的\
    \ Axis2 仓库，请将下载的 Sandesha2 模块复制到 `modules` 目录中。同时，记得将 RM 阶段添加到客户端侧的 `axis2.xml`\
    \ 中。此外，还要将 Sandesha2 的 JAR 文件复制到客户端类路径中。\n\n## 单向调用\n\n单向调用的思想是：将消息可靠地发送到接收方，发送方不需要应用程序应答，但需要消息的可靠投递。这里我们使用以下客户端发送三条消息。\n\
    \n### 全局配置：\n\n```\npublic class PingClient {\n    private static final String\
    \ tns = \"http://ws.axis2.apache.org\";\n    private static String toEPR = \"\
    http://127.0.0.1:8070/axis2/services/RMSampleService\";\n    private static String\
    \ CLIENT_REPO = \"location to client repository\";\n    public static void main(String[]\
    \ args) throws AxisFault {\n    String axis2_xml = CLIENT_REPO + File.separator\
    \ + \"client_axis2.xml\";\n    ConfigurationContext configContext = ConfigurationContextFactory.createConfigurationContextFromFileSystem(CLIENT_REPO,axis2_xml);\n\
    ```\n\n### 创建并配置客户端：\n\n```\nOptions clientOptions = new Options ();\nclientOptions.setTo(new\
    \ EndpointReference (toEPR));\nServiceClient serviceClient = new ServiceClient\
    \ (configContext,null);\nclientOptions.setAction(\"urn:wsm:Ping\");\nserviceClient.setOptions(clientOptions);\n\
    serviceClient.engageModule(new QName (\"sandesha2\"));\nserviceClient.engageModule(new\
    \ QName (\"addressing\"));\nserviceClient.fireAndForget(createElement(\"ping1\"\
    ));\nserviceClient.fireAndForget(createElement(\"ping2\"));\nclientOptions.setProperty(SandeshaClientConstants.LAST_MESSAGE,\n\
    \    \"true\");\nserviceClient.fireAndForget(createElement(\"ping3\"));\nserviceClient.cleanup();\n\
    }\n```\n\n### 创建负载：\n\n```\nprivate static OMElement createElement(String text)\
    \ {\n    OMFactory fac = OMAbstractFactory.getOMFactory();\n    OMNamespace namespace\
    \ = fac.createOMNamespace(tns,\"ns1\");\n    OMElement pingElem = fac.createOMElement(\"\
    ping\", namespace);\n    OMElement textElem = fac.createOMElement(\"in\", namespace);\n\
    \    textElem.setText(text);\n    pingElem.addChild(textElem);\n    return pingElem;\n\
    }\n}\n```\n\n当你使用 Sandesha2 时，它首先会创建一个序列（特定于可靠消息传递的会话）并发送消息；当客户端标记最后一条消息时，它会终止该序列。在上述代码示例中，`ping1`\
    \ 和 `ping2` 消息位于 Sandesha2 会话中，而 `ping3` 不在会话中。Sandesha2 为 `ping1` 和 `ping2` 提供可靠投递，但不为\
    \ `ping3` 提供。\n\n## 请求-应答调用\n\n在这里，我们介绍如何使用 Sandesha2 进行请求-应答消息调用。与前面的示例一样，`echo1`\
    \ 和 `echo2` 位于 Sandesha2 会话中，并获得可靠性支持。`echo3` 无法获得可靠性支持，因为在发送 `echo3` 之前，已经发送了最后一条消息。\n\
    \n```\npublic class EchoClient {\n    private static final String tns = \"http://ws.axis2.apache.org\"\
    ;\n    private final static String echoString = \"echoString\";\n    private static\
    \ String toEPR = \"http://127.0.0.1:8070/axis2/services/RMSampleService\";\n \
    \   private static String CLIENT_REPO = \"Location of Client repository\";\n \
    \   public static void main(String[] args) throws Exception {\n        String\
    \ axis2_xml = CLIENT_REPO + File.separator +\"client_axis2.xml\";\n        ConfigurationContext\
    \ configContext = ConfigurationContextFactory.createConfigurationContextFromFileSystem(CLIENT_REPO,axis2_xml);\n\
    ```\n\n创建客户端：\n\n```\nServiceClient serviceClient = new ServiceClient (configContext,null);\n\
    Options clientOptions = new Options ();\nclientOptions.setTo(new EndpointReference\
    \ (toEPR));\nclientOptions.setUseSeparateListener(true);\nserviceClient.setOptions(clientOptions);\n\
    serviceClient.engageModule(new QName (\"sandesha2\"));\nserviceClient.engageModule(new\
    \ QName (\"addressing\"));\nCallback callback1 = new TestCallback (\"Callback1\"\
    );\n```\n\n调用服务（第一次）：\n\n```\nserviceClient.sendReceiveNonBlocking (createElement(\"\
    echo1\"),callback1);\nCallback callback2 = new TestCallback (\"Callback2\");\n\
    ```\n\n### 调用服务（第二次）：\n\n```\nserviceClient.sendReceiveNonBlocking(createElement(\"\
    echo2\"),callback2);\n```\n\n### 发送最后一条消息：\n\n```\nclientOptions.setProperty(SandeshaClientConstants.LAST_MESSAGE,\n\
    \"true\");\nCallback callback3 = new TestCallback (\"Callback3\");\n```\n\n###\
    \ 调用服务（第三次）：\n\n```\nserviceClient.sendReceiveNonBlocking(createElement(\"echo3\"\
    ),callback3);\nwhile (!callback3.isComplete()) {\n    Thread.sleep(1000);\n}\n\
    Thread.sleep(2000);\n}\n```\n\n### 创建负载：\n\n```\nprivate static OMElement createElement(String\
    \ text) {\nOMFactory fac = OMAbstractFactory.getOMFactory();\nOMNamespace applicationNamespace\
    \ = fac.createOMNamespace(tns,\"ns1\");\nOMElement echoStringElement = fac.createOMElement(echoString,\n\
    applicationNamespace);\nOMElement textElem = fac.createOMElement(\"in\",applicationNamespace);\n\
    \ntextElem.setText(text);\nechoStringElement.addChild(textElem);\n\nreturn echoStringElement;\n\
    }\n```\n\n### 实现 Callback 类：\n\n```\nstatic class TestCallback extends Callback\
    \ {\nString name = null;\npublic TestCallback (String name) {\nthis.name = name;\n\
    }\n\npublic void onComplete(AsyncResult result) {\nSOAPBody body = result.getResponseEnvelope().getBody();\n\
    ```\n\n```\nSystem.out.println(\"Callback '' + name + ''\ngot result:\" + body);\n\
    }\npublic void onError (Exception e) {\nSystem.out.println(\"Error reported for\
    \ test call back\");\n    e.printStackTrace();\n}\n}\n}\n```\n\n如果你运行上述代码并通过 TCP\
    \ 监视器观察，你会看到只有前两条消息处于 RM 会话中，最后一条消息不是在 RM 会话内调用的。\n\n## 管理序列\n\n在上一节中，我们讨论了 Sandesha2\
    \ 序列，并提到它会在内部创建序列并发送消息，直到用户指定最后一条消息。在这里，我们将讨论如何使用 Sandesha2 API 管理序列。Sandesha2\
    \ 提供了一个名为 `SandeshaClient` 的工具类，它在内部使用 `ServiceClient` 实例。因此，创建 `SandeshaClient`\
    \ 的实例需要 `ServiceClient` 的实例。\n\n> 默认情况下，Sandesha2 会假定发往同一端点的消息应当属于同一个 RM 序列。只有当消息的\
    \ WS-Addressing To 地址不同时，消息才会被放入不同的 RM 序列。但如果需要，你也可以指示 Sandesha2 将具有相同 WS-Addressing\
    \ To 地址的消息放入两个或多个序列中。为此，你需要设置一个名为 Sequence Key 的属性。\n\n下面一行代码展示了如何使用序列 ID 来区分不同的序列：\n\
    \n```\nclientOptions.setProperty(SandeshaClientConstants.SEQUENCE_KEY,<sequence\
    \ id>);\n```\n\n"
