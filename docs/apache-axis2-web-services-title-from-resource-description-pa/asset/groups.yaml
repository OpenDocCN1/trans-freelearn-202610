  - '[PAGE 37]


    +   - Transport framework: Axis2 has a clean and simple abstraction for integrating
    and using Transports (that is, senders and listeners for SOAP over various protocols
    such as SMTP, FTP, message-oriented middleware, and so on), and the core of the
    engine is completely transport-independent.

    +   - WSDL support: Axis2 supports the Web Service Description Language (versions
    1.1 and 2.0), which allows you to easily build stubs to access remote services,
    and also to automatically export machine-readable descriptions of your deployed
    services from Axis2.

    +   - Add-ons: Several web service specifications have been incorporated, including
    WSS4J for security (Apache Rampart), Sandesha for reliable messaging. Kandula
    is an encapsulation of WS-Coordination, WS-AtomicTransaction, and WS-BusinessActivity.

    +   - Composition and extensibility: Modules and phases improve support for composability
    and extensibility. Modules support composability and can also support new WS-*
    specifications in a simple and clean manner. They are, however, not hot deployable,
    as they change the overall behavior of the system.


    # Downloading and installing Apache Axis2


    Apache Axis2 version 1.0 was released in 2006 and after that there were a number
    of releases. The current stable release is 1.5. The previous version of this book,
    "Quickstart Apache Axis", Deepal Jayasinghe, Packt Publishing, was based on version
    1.2 of Axis2. This one is based on version 1.5. From 1.2 to 1.5, Axis2 introduced
    a set of new features as well as API changes. One of the key changes was moving
    from JDK 1.4 to 1.5. The current version of Axis2 only supports JDK 1.5 and higher.
    Nevertheless, most of the commonly used APIs still remain the same.


    There are three types of software: free software, open source software, and commercial
    software. The main idea of free software is that you can download the software
    for free; however, you do not get access to the source code or the development
    work. On the other hand, open source software is designed and developed by an
    open community; anyone can participate in the discussions and contribute to the
    project, and finally, once the product is released, the user can have access to
    both the product and the source code. The user can modify the source code, fix
    issues, redistribute, and so on. As Axis2 is also an open source project, you
    can download Axis2 and get access to both binary and source codes. However, in
    the proprietary software, the license agreement is very restricted, and usually
    the user does not get to see the source code; the user only gets the binary.'
