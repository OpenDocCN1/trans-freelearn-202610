    # Master Data Management (MDM)


    **Master data** refers to the information that is key to the operation of a business.
    This information may include data about customers, products, employees, suppliers,
    and so on. Master data is non-transactional in nature, but can support transactional
    processes and operations. Master data is often used by several functional groups
    and stored in different data systems across an organization and may or may not
    be referenced centrally. Therefore, the possibility exists for duplicate and/or
    inaccurate master data. MDM comprises a set of processes and tools that consistently
