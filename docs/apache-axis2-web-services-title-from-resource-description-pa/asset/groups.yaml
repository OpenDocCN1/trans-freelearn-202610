  - '[PAGE 249]


    In these two scenarios, authentication and authorization handling can be done
    within a pure Axis2 instance as well, but the reason for bringing in an ESB into
    the picture is to handle all authentication and authorization functionality in
    one central place. Otherwise, if there are multiple Axis2 instances in an enterprise
    deployment, each of those Axis2 instances would have to separately talk to the
    identity management server. In addition, additional mediation steps can be introduced
    in the ESB, when the system evolves over time.


    # Dynamic routing combined with auditing


    In some enterprise deployments, there is a requirement to route the request to
    different Axis2 service implementations or different Axis2 servers, depending
    on certain criteria or other parameters such as the time of the day. For example,
    during the peak hours, requests may be routed to a server having more resources
    in terms of memory and processing power. In some cases, the requests may need
    more processing power, depending on the input parameter values. Requests are dynamically
    routed in order to optimize resource usage and maintain throughput. Note that
    the service contracts will not change and only the service implementation or deployment
    location will change. Hence this is transparent to the client.


    Dynamic routing may be combined with auditing. In this case, each of the requests,
    along with other relevant metadata, will be asynchronously logged into a file
    or database for future auditing purposes.


    As shown in the following figure, the Synapse ESB is used as a dynamic router
    and the central point for auditing. The Synapse configuration is loaded from a
    configuration repository and this configuration can change over the course of
    the day so that requests are dynamically routed to different Axis2 service implementations
    or Axis2 servers. A log mediator is used for logging the incoming requests and
    outgoing responses to a database. In the case where the Synapse configuration
    is changed at preconfigured times of the day, the server is put into maintenance
    mode using the JMX management API.'
