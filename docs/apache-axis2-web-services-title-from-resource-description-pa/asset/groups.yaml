  - "[PAGE 269]\n\nIrrespective of the application server, you can get Axis2 to work\
    \ from a custom repository by editing the web.xml file of the Axis2.war distribution.\
    \ Once this is done, you do not need to worry about whether the application server\
    \ will unpack the WAR or not, and if it is, where it is going to unpack and so\
    \ on. You can even configure the application-server-based Axis2 to start up with\
    \ a remote repository. First, let's look at how to configure Axis2.war to work\
    \ with a local filesystem. Here, you need to add the following init parameters\
    \ to the servlet section of the web.xml file:\n\n```\n<servlet>\n    <servlet-name>AxisServlet</servlet-name>\n\
    \    <display-name>Apache-Axis Servlet</display-name>\n    <servlet-class>org.apache.axis2.transport.http.AxisServlet</servlet-class>\n\
    \    <init-param>\n        <param-name>axis2.xml.path</param-name>\n        <param-value>path\
    \ to custom axis2.xml (you need this only if you want to override the default\
    \ axis2.xml)</param-value>\n        <param-name>axis2.repository.path</param-name>\n\
    \        <param-value>full path the custom repository</param-value>\n    </init-param>\n\
    \    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\nAs mentioned earlier,\
    \ you can configure the web.xml file to start Axis2 from a URL repository. In\
    \ this case, you need to add the following two parameters:\n\n```\n<servlet>\n\
    \    <servlet-name>AxisServlet</servlet-name>\n    <display-name>Apache-Axis Servlet</display-name>\n\
    \    <servlet-class>org.apache.axis2.transport.http.AxisServlet</servlet-class>\n\
    \    <init-param>\n        <param-name>axis2.xml.url</param-name>\n        <param-value>http://localhot/myrepo/axis2.xml</param-value>\n\
    \        <param-name>axis2.repository.url</param-name>\n        <param-value>http://localhot/myrepo</param-value>\n\
    \    </init-param>\n    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\
    \nAs shown here, we have added two parameters called axis2.xml.url and axis2.repository.url.\
    \ You can modify the values to suit your environment settings."
  - '[PAGE 270]


    # Asynchronous web services with Axis2


    The concept of an asynchronous web service is a very important feature, where
    a user can invoke one web service and continue his/her work until he/she gets
    the reply. In a traditional synchronous model, a client has to wait (or block)
    until he gets the response. More importantly, in Axis2, you get asynchronous support
    both on the client side and the server side. In the client side, we can invoke
    the service in a blocking or non-blocking manner. Selecting which way to invoke
    is very straightforward. In the server side, we can have services that take a
    long time to process. In such a situation, a service can be processed in a non-blocking
    manner, where once the message is received, it will send the acknowledgment, and
    at a later time, send the response. Axis2 supports asynchronous web service invocations
    on the client side in two different ways; one of them needs WS addressing support
    and the other does not. We will discuss each of them separately with code sample.


    What is a synchronous web service?

    As we discussed earlier, a synchronous web service is a blocking service invocation,
    where the application gets blocked until it receives the response. With this type
    of invocation, the user will have to wait until he/she gets the response he/she
    wants. If this is a GUI application, then the application becomes non-responsive
    until it receives the reply.


    What is an asynchronous web service?

    In the previous section, we discussed about synchronous web services. An asynchronous
    web service is the opposite of that. An asynchronous web service is a non-blocking
    invocation, where the user can invoke the service without blocking the user application.


    # Client side asynchronous


    One of the main design goals of Axis2 is to have very good support for asynchronous
    web service support, and asynchronous support is much more useful for the client
    side. Thus, Axis2 has very good support for asynchronous service invocation on
    the client side. Axis2 supports two types of asynchronous invocation on the server
    side:


    +   - Application level asynchronous support: In this case, we only have application
    level asynchronous support. However, at the transport (transport sender), we have
    blocking behavior. In other words, when we invoke the service, we provide a callback
    object and then Axis2 registers that with transport. Once the transport gets the
    response, it invokes the callback. To have this type of asynchronous support,
    it does not need to have WS-Addressing support, because we do not have any asynchronous
    behavior at the transport level.'
