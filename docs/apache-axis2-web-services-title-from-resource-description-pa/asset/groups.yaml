  mdcn: '


    消息传递标准旨在为分布式环境中的信息交换提供框架。这些标准必须可靠，以确保消息只发送一次，并且只有预期的接收者才能收到。这是当前研究的主要领域之一，因为一切都依赖于消息传递能力。


    接下来，我们将详细讨论其中一些标准。首先，我们从 XML-RPC 开始，它后来发展为 SOAP。


    ## XML-RPC


    **XML-RPC** 标准由 Dave Winer 于 1998 年与微软共同创建。现有的 RPC 系统非常庞大。因此，为了创建一个轻量级系统，开发者通过仅规定必要的部分并只定义少量的数据类型和命令来简化它。该协议使用
    XML 对调用进行编码，并以 HTTP 作为传输机制。消息以 POST 请求发送，其中请求正文为 XML 格式。服务器上执行一个过程，其返回值也被格式化为
    XML。参数可以是标量、数字、字符串、日期，以及复杂的记录和列表结构。


    随着新功能的引入，XML-RPC 演变为现在所称的 SOAP，接下来将对此进行讨论。不过，仍有一些人更喜欢使用 XML-RPC，因为它简单、极简且易于使用。


    ## SOAP


    最初，SOAP 被定义为简单对象访问协议（Simple Object Access Protocol）。然而，最新版本（SOAP 1.2）已经超越了其最初的定义。SOAP
    标准最初由四位开发者在微软的支持下设计，作为一种对象访问协议。该协议规定了基于 XML 的消息在计算机网络中的传输方式，且与传输机制无关。开发者选择 XML
    作为标准消息格式，是因为主要组织和开源计划广泛使用它。此外，还有各种各样免费可用的工具，可以轻松过渡到基于 SOAP 的实现。


    **SOAP** 的概念是一种无状态、单向的消息交换。然而，应用程序可以通过将这种单向交换与底层协议提供的功能以及特定于应用程序的信息相结合，创建更复杂的交互模式——例如请求-响应、请求-多响应等。SOAP
    对其所传递的任何特定于应用程序的数据的语义保持沉默，就如同对 SOAP 消息的路由、可靠数据传输、防火墙穿越等问题一样。但是，SOAP 提供了一种框架，通过该框架，特定于应用程序的信息可以以可扩展的方式进行传递。


    ## Web 服务寻址（WS-Addressing）


    如果在 Web 服务网络中，有一种标准方式来表达消息应被传递到何处，那将会非常有用。这可以减轻开发者的工作量，因为他们能够简化 Web 服务的通信和开发，并避免需要临时开发成本高昂且通常难以跨平台互操作的解决方案。在与人类应用程序交互时，我们在浏览器中输入地址（或
    URL），然后导航到该页面。我们点击内部链接，它就会带我们到一个新页面。当涉及到应用程序到应用程序的通信（如 Web 服务）时，应该有一种指定这些地址的标准方式。因此，WS-Addressing
    通过定义一种标准机制来识别和交换多个端点之间的 Web 服务消息，使组织能够构建可靠且可互操作的 Web 服务应用程序。


    该标准提供了与传输无关的机制来寻址消息和识别 Web 服务，对应于 Web 服务架构中描述的*地址*和*消息关联*概念。该标准定义了 XML 元素，用于识别
    Web 服务端点并确保消息中端到端的端点标识安全。这使得消息传递系统能够通过包含处理节点（如端点管理器、防火墙和网关）的网络以传输中立的方式支持消息传输。


    ## 服务描述


    当我们购买产品时，我们可以找到它的操作手册；当我们购买软件应用程序时，我们应该有使用它的手册或文档。对于面向对象编程，我们有描述公共操作的接口，同样，Java
    文档提供有关可用方法及其使用方式的信息。因此，重要的是要注意，Web 服务的描述对于分类、发现和使用服务至关重要。描述应该既能被人类理解，也能被应用程序理解。他们还提到，Web
    服务描述需要在语义和语法两个层面上提供。语义信息必须包含关于服务提供者、服务功能以及可靠性、安全性和消息排序等特征的详细信息。语义信息使服务请求者能够决定服务是否满足其需求。此外，代理可以使用语义信息对服务进行分类。语法信息描述如何使用服务，也可能涉及非功能性需求，如可靠性、安全性和事务。最重要的是，服务描述成为外部文档，用于阅读和更多地了解服务。


    ## Axis2 的特性


    - 传输框架：Axis2 有一个简洁明了的抽象，用于集成和使用传输（即，通过 SMTP、FTP、面向消息的中间件等各种协议进行 SOAP 的发送方和监听方），并且引擎核心完全与传输无关。

    - WSDL 支持：Axis2 支持 Web 服务描述语言（1.1 和 2.0 版本），这使您可以轻松构建存根以访问远程服务，还可以自动从 Axis2 导出所部署服务的机器可读描述。

    - 附加组件：已经整合了多个 Web 服务规范，包括用于安全的 WSS4J（Apache Rampart）、用于可靠消息传递的 Sandesha。Kandula
    是 WS-Coordination、WS-AtomicTransaction 和 WS-BusinessActivity 的封装。

    - 组合和可扩展性：模块和阶段提高了对可组合性和可扩展性的支持。模块支持可组合性，也可以以简单明了的方式支持新的 WS-* 规范。但是，它们不能热部署，因为它们会改变系统的整体行为。


    ## 下载并安装 Apache Axis2


    Apache Axis2 1.0 版本于 2006 年发布，之后有许多版本发布。当前的稳定版本是 1.5。本书的上一版本《Quickstart Apache
    Axis》（Deepal Jayasinghe 著，Packt Publishing 出版）基于 Axis2 1.2 版本。本书基于 1.5 版本。从 1.2
    到 1.5，Axis2 引入了一系列新特性以及 API 更改。其中一个关键变化是从 JDK 1.4 迁移到 1.5。当前版本的 Axis2 仅支持 JDK
    1.5 及更高版本。尽管如此，大多数常用的 API 仍然保持不变。


    有三种类型的软件：自由软件、开源软件和商业软件。自由软件的主要理念是您可以免费下载该软件；但是，您无法访问源代码或开发工作。另一方面，开源软件由开放社区设计和开发；任何人都可以参与讨论并为项目做出贡献，最后，一旦产品发布，用户既可以访问产品也可以访问源代码。用户可以修改源代码、修复问题、重新分发等等。由于
    Axis2 也是一个开源项目，您可以下载 Axis2 并访问二进制代码和源代码。然而，在专有软件中，许可协议非常严格，通常用户看不到源代码；用户只能获得二进制代码。


    '
