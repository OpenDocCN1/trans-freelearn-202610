    \ and javax.xml.ws.ResponseWrapper\n\nThe javax.xml.ws.RequestWrapper annotation\
    \ annotates methods in the SEI with the request wrapper bean to be used at runtime.\
    \ The javax.xml.ws.ResponseWrapper annotation annotates the methods in the SEI,\
    \ with the response wrapper bean to be used at runtime. These annotations have\
