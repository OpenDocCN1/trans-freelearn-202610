    \ Provider 接口，在 XML 消息级别进行工作。具体来说，可以实现 `Provider<Source>`、`Provider<SOAPMessage>`\
    \ 或 `Provider<DataSource>`。端点通过这种低级别的通用 API 访问消息或消息负载。所有 Provider 端点都必须具有 `@WebServiceProvider`\
    \ 注解。\n\n`@ServiceMode` 注解用于说明端点希望访问消息（Service.Mode.MESSAGE）还是消息负载（Service.Mode.PAYLOAD）。如果端点上没有\
