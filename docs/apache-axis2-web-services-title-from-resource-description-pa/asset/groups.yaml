  - '[PAGE 30]


    The messaging standards are intended to give the framework for exchanging information
    in a distributed environment. These standards have to be reliable so that the
    message will be sent only once and only the intended receiver will receive it.
    This is one of the primary areas where research is being conducted, as everything
    depends on the messaging ability.


    Next, we are going to discuss some of these standards in details. Firstly, we
    will start with XML-RPC, which later evolved into SOAP.


    # XML-RPC


    The **XML-RPC** standard was created by Dave Winer in 1998 with Microsoft. The
    existing RPC systems were very bulky. Therefore, to create a light-weight system,
    the developer simplified it by specifying only the essentials and defined only
    a handful of data types and commands. This protocol uses XML to encode its calls
    to HTTP as a transport mechanism. The message is sent as a POST request in which
    the body of the request is in XML. A procedure is executed on the server and the
    value it returns is also formatted into XML. The parameters can be scalars, numbers,
    strings, dates, as well as complex record and list structures.


    As new functionalities were introduced, XML-RPC evolved into what is now known
    as SOAP, which is discussed next. Still, some people prefer using XML-RPC because
    of its simplicity, minimalism, and the ease of use.


    # SOAP


    Initially, SOAP was defined as Simple Object Access Protocol. However, the latest
    version (SOAP 1.2) has moved beyond its original definition. The SOAP standard
    was originally designed by four developers with the backing of Microsoft as an
    object-access protocol. The protocol specifies exchange of XML-based messages
    over computer networks in transport independent manner. The developers had chosen
    XML as the standard message format because of its widespread use by major organizations
    and open source initiatives. Also, there is a wide variety of freely available
    tools that ease the transition to a SOAP-based implementation.


    The concept of **SOAP** is a stateless, one-way message exchange. However, applications
    can create more complex interaction patterns – such as request-response, request-multiple
    responses, and so on – by combining such one-way exchanges with features provided
    by an underlying protocol and application-specific information. SOAP is silent
    on the semantics of any application-specific data it conveys as it is on issues
    such as routing of SOAP messages, reliable data transfer, firewall traversal,
    and so on. However, SOAP provides the framework by which application-specific
    information may be conveyed in an extensible manner.'
  - '[PAGE 31]


    # Web Services Addressing (WS-Addressing)


    It would have been quite useful if there was a standard way to express where a
    message should be delivered in a web services network. This could reduce the work
    load of the developers when they are able to simplify web services communication
    and development, and avoid the need to develop costly solutions ad hoc that are
    often difficult to interoperate across platforms. When interacting with human
    applications, we enter the address (or URL) in the browser and then navigate the
    page. We click on the internal links and it takes us to a new page. When it comes
    to application-application communication, such as web services, there should be
    a standard way of specifying those addresses. Thus, WS-Addressing enables organizations
    to build reliable and interoperable web service applications by defining a standard
    mechanism for identifying and exchanging Web Services messages between multiple
    end points.


    The standard provides transport independent mechanisms to address messages and
    identifies web services, corresponding to the concepts of *address* and *message
    correlation* described in the web services architecture. The standard defines
    XML elements to identify web services endpoints and to secure end-to-end endpoint
    identification in messages. This enables messaging systems to support message
    transmission through networks that include processing nodes such as endpoint managers,
    firewalls, and gateways in a transport-neutral manner.


    # Service description


    When we buy a product we can find the operational manual for it or when we buy
    a software application, we should have the manuals or documentation to use it.
    When it comes to OOP, we have interfaces that describe the public operation and
    in the same way Java docs provide information about the available methods and
    how to use them. Hence, it is important to note that the description of a web
    service is essential for classifying, discovering, and using a service. The description
    should be understandable to both humans as well as for applications. They further
    mention that the web service description is required to be at both semantic and
    syntactic level. Semantic information has to contain details about the service
    provider, what the service does, and characteristics such as reliability, security,
    and sequencing of messages. The semantic information enables service requesters
    to decide whether a service satisfies their needs or not. Also, brokers can use
    the semantic information to categorize the service. Syntactic information describes
    how to use the service and may also concern non-functional requirements, such
    as reliability, security, and transactions. Above all, service description becomes
    the external documentation to read and understand more about the service.'
