    \ W3C 中找不到任何规范。\n\n### Features of REST\n\nWeb 由资源组成。简单来说，资源是任何具有某种兴趣的项目。例如，亚马逊在线商店可能会为其新款佳能相机（DSLR）定义一个资源，客户端可以使用以下\
    \ URL 访问该资源页面：http://www.amazon.com/canon/dslr。\n\n点击链接后，会返回资源的表示（例如，canon_dslr.html）。该表示将客户端应用程序置于一种状态。客户端在\
