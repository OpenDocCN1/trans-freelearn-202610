    \nThis property defines the localName of the XML Schema element representing this\
    \ request/response wrapper and defaults to the operationName, as defined by javax.jws.WebMethod.\n\
    \n# targetNamespace\n\nThis property defines the namespace of the request/response\
    \ wrapper element and the default value is targetNamespace of the SEI.\n\n# className\n\
    \nThis property defines the name of the class representing the request/response\
