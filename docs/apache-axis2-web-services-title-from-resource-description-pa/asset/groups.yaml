    parser), thus a StAX-compliant reader should be created first with the desired
    input stream. One can then select one of the many builders available in AXIOM.
    In Axiom, you can find different types of builders as well, and those are mainly
    for user convenience. Axiom has OM builders (pure XML processing) as well as SOAP
    builders (SOAP processing optimized for SOAP), so you can use the appropriate
    builder for your requirement. StAXOMBuilder will build a pure XML InfoSet-compliant
    object model, while the SOAPModelBuilder returns SOAP-specific objects (such as
    the SOAPEnvelope, which are subclasses of the OMElement) through its builder methods.


