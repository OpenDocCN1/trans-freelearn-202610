    \ invokes a Web service based on a service endpoint interface that is provided.\
    \ After you create the proxy, the client application can invoke methods on the\
    \ proxy just like a standard implementation of those interfaces. For JAX-WS Web\
    \ service clients using the dynamic proxy programming model, use the JAX-WS tool,\
