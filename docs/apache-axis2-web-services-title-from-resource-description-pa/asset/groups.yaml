    # targetNamespace


    This property defines the XML namespace of the WSDL and some of the XML elements
    generated from this Java class or interface annotated with the WebService annotation.
    The default value is the namespace derived from the package name of this web service.
    For example, if the web service is part of the org.apache.axis2.sample package,
    the default namespace will be http://sample.axis2.apache.org.


    # serviceName


    This property defines the name of the wsdl:service in the WSDL 1.1 document. The
    default value is the unqualified name of the annotated Java class or interface,
    suffixed with the string "service".


    # endpointInterface


    This property defines the qualified name of the Service Endpoint Interface (SEI).
    This annotation allows the separation of the interface contract from the implementation.
    The endpoint implementation class is not required to implement the endpointInterface.


    > If endpointInterface property is specified, all other WebService properties
    are ignored as are all other JSR 181 annotations. Only the annotations on the
    service endpoint interface will be taken into considerations.


    # portName


    This property defines the wsdl:portName in the WSDL 1.1 document. The default
    value of this property is WebService.name suffixed with the string "port".


    # wsdlLocation


    This property is a WSDL URL that points to an existing WSDL 1.1 document. This
    property is used only if an existing WSDL is in use. In a pure code first approach,
    this property will not be used.


    Let us look at a simple example where the WebService annotation is used along
    with some of its attributes. The following code will declare CalculatorImpl to
    be a web service with the name Calculator and the targetNamespace of that web
    service will be http://axis.apache.org:


    ```

    @WebService(name = "Calculator", targetNamespace = "http://axis.apache.org")


    public class CalculatorImpl {

