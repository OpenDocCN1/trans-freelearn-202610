  - "[PAGE 157]\n\n3. Create a service archive file and deploy the service in Axis2\
    \ server.\n\nThe first step of creating the service archive file is to compile\
    \ the source code. Next, go to the compile directory and create a directory called\
    \ META-INF, and copy the created services.xml file into it. Next, use any of the\
    \ archive tools and create a ZIP archive (you can also use the JAR file creation),\
    \ and name it as myservice.aar.\n\n> Axis2 comes with IDE tools and Maven plugins\
    \ that help you to create a service archive file.\n\nOnce you have the service\
    \ archive file, you can deploy it using any of the mechanism we discussed in the\
    \ Deployment section.\n\nNow that we have deployed the service in the server,\
    \ what remains is to invoke the service. Here we will look at a number of scenarios\
    \ to understand the concept clearly.\n\n# Scenario 1: Invoking a service in a\
    \ blocking manner (sendReceive())\n\nThe most commonly used service invocation\
    \ pattern is the request response invocation pattern (in-out MEP in WSDL 2.0 terminology).\
    \ Most of the services are written in a manner such that they have an input(s)\
    \ and an output. So we need to use a request response invocation pattern. In Axis2,\
    \ that can be done in two ways—a blocking manner or non-blocking manner. The first\
    \ sample demonstrates invoking a service in the blocking manner:\n\n+   1. Create\
    \ a ServiceClient using any of the constructors we mentioned earlier.\n\n+   2.\
    \ Create an OMElement for payload (first child of SOAP body). In Axis2, XML representation\
    \ is built on AXIOM. That is why you need to create OMElement (See the references\
    \ section to learn about AXIOM).\n\nWe can use the following code snippet to create\
    \ the payload that we need to invoke the service. If you look at the service WSDL,\
    \ then you can understand how to create the request element.\n\n```\npublic OMElement\
    \ createPayLoad() {\n    OMFactory fac = OMAbstractFactory.getOMFactory();\n \
    \   OMNamespace omNs = fac.createOMNamespace(\n        \"http://ws.apache.org/axis2\"\
    , \"ns1\");\n    OMElement method = fac.createOMElement(\"echo\", omNs);\n   \
    \ OMElement value = fac.createOMElement(\"value\", omNs);\n    value.setText(\"\
    Hello , my first service utilization\");\n    method.addChild(value);\n```"
