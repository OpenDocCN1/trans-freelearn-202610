    \ options to add a handler into the system and specify the exact location where\
    \ the module author would like to see the handler running. In Chapter 4, Execution\
    \ Chain, we learnt more about phase rules as a mechanism to tell Axis2 to put\
    \ handlers into a particular location in the execution chain, so now it is time\
    \ to look at them with an example.\n\nBefore learning how to write phase rules\
    \ and specifying handlers in a module.xml, let's look at how to write a handler.\
    \ There are two ways to write a handler in Axis2:\n\n+   - Implement the org.apache.axis2.engine.Handler\
    \ interface\n+   - Extend the org.apache.axis2.handlers.AbstractHandler abstract\
    \ class\n\nIn this chapter, we are going to write a simple application to provide\
    \ a better understanding of the module. Furthermore, to make the sample application\
    \ easier, we are going to ignore some of the difficulties of the Handler API.\
    \ In our approach, we will extend the AbstractHandler. When we extend the abstract\
    \ class, we only need to implement one method called invoke. So the following\
