  - '[PAGE 236]


    # Highly available load balancing


    In order to avoid single points of failure, the worker Axis2 clusters — **Group
    H** and **Group D** — can be fronted by a load balancer cluster, **Group LB**,
    as shown in the following figure. One load balancer in **Group LB** will be the
    primary load balancer. The Apache Synapse load balancer can be deployed in this
    manner, and uses the underlying Axis2 clustering mechanism. The web service clients
    will talk to the endpoints in the primary load balancer and will be unaware of
    the backend worker node Axis2 clusters.


    ![](img/e2fb05de168053e6227dab034eff9353_236_0.png)


    # The Axis2 clustering management API


    Axis2 clustering is designed in a way that all functionality is abstracted out
    by a set of interfaces. By implementing these interfaces and providing the implementation
    classes in the clustering configuration section, any different clustering implementation
    can be plugged in. The default clustering implementation in Axis2 is based on
    Apache Tribes (Apache Tribes n.d.), the popular group management framework used
    by Apache Tomcat (Apache Tomcat n.d.). One may be required to use a group management
    framework of one''s choice, in which case, he/she can implement these interfaces
    and then plug them using the clustering configuration section in the `axis2.xml`
    file. We will be taking a look at the usages of these interfaces later in this
    chapter.'
  md: "\n## synchronizeAll\n\nWhen a web service request is received, and processed,\
