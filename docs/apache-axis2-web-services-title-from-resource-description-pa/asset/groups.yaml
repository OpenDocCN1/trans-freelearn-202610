    \ once message processing semantics need to be maintained. It guarantees that\
    \ a given clustering message will be delivered at most once to the target process\
    \ or node. The default value for this parameter is true.\n\n## properties\n\n\
    There are properties specific to this member. These properties are simply name-value\
