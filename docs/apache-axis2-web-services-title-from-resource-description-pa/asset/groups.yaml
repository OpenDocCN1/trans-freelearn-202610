    # Deployment model


    The previous versions of Axis (Axis 1.x) addressed the requirements presented
    on development stages of the product. However, once the SOA and web service became
    popular, a number of new requirements came into the picture. Among them, usability
    is one of the most important factors to be considered.


    In Axis 1.x the user has to manually invoke the admin client and update the server
    `classpath`. After this, the user needs to restart the server in order to apply
    the changes. This burdensome deployment model was a definite barrier for beginners.
    Axis2 was engineered to overcome this drawback, and provided a flexible, user-friendly,
    and easily configurable deployment model.'
