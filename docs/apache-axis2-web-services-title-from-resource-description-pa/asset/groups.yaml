  - '[PAGE 285]


    # Creating a sequence without sending a message


    In some of the applications, you need to start a sequence without sending any
    application messages to the server. In that case, you can use the following API.
    When you ask for this, Sandesha2 will do a Create Sequence message exchange and
    obtain a new sequence ID from the server. The sequenceKey value of the newly created
    sequence will be returned from this method, which could be used do message invocations
    with it. This method also has a boolean parameter, which tells whether to offer
    a sequence for the response side.


    ```

    String sequenceKey = SandeshaClient.createSequence (serviceClient, booleanOffer);

    ```


    # Terminate a sequence


    You can terminate the sequence by using the following code; there Sandesha2 will
    send the required control messages and remove the sessions from both the client
    and the server:


    ```

    SandeshaClient.terminateSequence (serviceClient);

    ```


    > Sandesha2 provides many other features that you can use to configure and achieve
    better customization; however, we are not going to discuss them here. I encourage
    you to refer to online documentation to understand them better.


    # Secure web services


    In the previous section, we discussed how to add the reliability to your service.
    In this section, we will discuss how to provide the security to your service.
    In Axis2, we use Apache Rampart to provide the security support.


    Download the latest version of Apache Rampart and extract it. Copy the rampart-version.mar
    file into the module directory of your AXIS2_HOME directory. Next, copy the other''s
    JAR files from the extracted location to the lib directory (for example, TOMCAT_HOME/axis2/WEB-INF/lib).
    Now, restart Axis2 and log in to the administrative console and engage the Rampart
    module. After a few seconds, if you see the Rampart module under the engaged module,
    then you have successfully added the security support to your web service framework.'
