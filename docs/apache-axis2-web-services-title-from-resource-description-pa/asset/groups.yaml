    如前所述，SOAP 处理框架的关键任务就是处理 SOAP 消息。然而，仅仅处理消息还不够，还需要提供额外的功能，例如服务质量。因此，系统必须具有可扩展性。SOAP
    处理模型的可扩展性是通过处理器来提供的。当 SOAP 消息被处理时，已注册的处理器将被执行。处理器可以在全局、服务或操作范围内注册，最终的处理链由所有范围内的处理器组合而成。


    处理器充当拦截器，处理 SOAP 消息的各个部分，并提供*服务质量*特性（服务质量的一个典型例子是安全性或可靠性）。通常处理器处理 SOAP 标头，但也可能访问或修改
    SOAP 正文。


    流的概念很简单，它由一系列阶段组成，其中阶段指处理器的集合。对于给定的方法调用，相关的流数量可能根据 MEP（消息交换模式）的不同而变化。


    ### In-Only MEP（仅入站）


    对于 In-Only MEP，相应的方法调用只有一个管道，即消息只会经过入站管道（inflow）。


    ### In-Out MEP（入站/出站）


    另一方面，对于 In-Out MEP，消息将经过两个管道，即入站管道（inflow）和出站管道（outflow）。当 SOAP 消息被发送时，`OutFlow`
    将启动。


    ### 故障流（Fault-Flow）


    `OutFlow` 调用处理器，并以**传输发送器**结束，该发送器将 SOAP 消息发送到目标端点。在目标端点，SOAP 消息由该处的**传输接收器**接收，接收器读取
    SOAP 消息并启动 `InFlow`。`InFlow` 由处理器组成，并以**消息接收器**结束，该接收器处理实际的业务逻辑调用。


    阶段是一个或多个处理器的逻辑集合，有时阶段本身充当处理器。Axis2 引入阶段概念，作为扩展核心功能的简便方式。在 Axis 1.x 中，如果要将处理器添加到处理链中，我们需要更改全局配置文件。而
    Axis2 通过阶段和阶段规则的概念简化了这一过程。阶段规则规定了特定阶段内给定处理器集合的排序方式。下图展示了一个流及其阶段：


    ![](img/e2fb05de168053e6227dab034eff9353_47_0.png)


    ![](img/e2fb05de168053e6227dab034eff9353_49_0.png)


    我们将在*第 6 章“信息模型”*中更详细地讨论此图，届时将逐一讨论每个项目，并详细描述它们如何相互连接。


    ## 部署模型


    Axis 的早期版本（Axis 1.x）满足了产品开发阶段所提出的需求。然而，随着 SOA 和 Web 服务变得流行，许多新需求应运而生。其中，易用性是最需要考虑的重要因素之一。


    在 Axis 1.x 中，用户必须手动调用管理客户端并更新服务器 `classpath`。之后，用户需要重启服务器才能应用更改。这种繁琐的部署模型对初学者来说无疑是一道障碍。Axis2
    的设计旨在克服这一缺点，并提供了灵活、用户友好且易于配置的部署模型。


    - 传输级非阻塞调用，其中调用发生在两个传输中（可以是两个单通道传输，如 SMTP，也可以是两个双通道传输，如 HTTP）


    Axis2 客户端 API 支持这两种非阻塞调用场景。


    Axis2 引入了一个非常方便的客户端 API 来调用服务，该 API 包含两个类：`ServiceClient` 和 `OperationClient`。`ServiceClient`
    API 用于常规使用，即只需发送和接收 XML 时。另一方面，OperationClient 面向高级用法，当需要处理 SOAP 标头或执行其他高级任务时使用。使用
    `ServiceClient`，你只能访问 SOAP 正文或有效负载。虽然我们可以添加 SOAP 标头，但无法通过 `ServiceClient` 检索 SOAP
    标头。要实现此功能，我们需要使用 OperationClient。


    `ServiceClient` 提供了以下用于调用服务的 API：


    - **sendRobust**：此 API 的核心思想是向 Web 服务发送 XML 请求，而不关心其响应。但是，如果出现问题，你也会需要知道。因此，此
    API 调用没有返回值但会抛出异常的服务。

    - **fireAndForget**：此 API 仅用于发送 XML 请求，既不关心响应，也不关心异常。因此，它适用于调用 In-Only MEP。

    - **sendReceive**：此 API 调用具有返回值的服务。这是最常用的 API 之一。因此，它用于调用 In-Out MEP。

    - **sendReceiveNonBlocking**：此方法以非阻塞方式调用服务。当服务有返回值时可以使用此方法。要使用此方法，我们必须传递一个回调对象，该对象在调用完成后被调用。


    如前所述，`OperationClient` 面向高级用户，使用 `OperationClient` 需要深入了解 Axis2。在使用 `ServiceClient`
    时，你无需了解 SOAP 信封、消息上下文等任何内容。但使用 `OperationClient` 时，用户必须在调用服务之前自行创建这些内容。使用 `OperationClient`
    创建和调用服务涉及以下步骤：


    1. 创建一个 `ServiceClient`。

    2. 然后，使用你创建的 `ServiceClient` 创建 `OperationClient`。

    3. 创建一个 SOAP 信封。

    4. 创建消息上下文。

    5. 将 SOAP 信封添加到消息上下文。

    6. 将 `MessageContext` 添加到 `OperationClient`。

    7. 调用 `OperationClient`。

    8. 如果有响应，从 `OperationClient` 获取响应消息上下文。


    ## 传输


    在 Axis2 中，每个传输都由两部分组成，即传输发送器和传输接收器。你可以在 Axis2 全局配置中定义传输以及发送器和接收器。传输接收器是 `AxisEngine`
    接收消息的途径，而传输发送器是发送消息的途径。Axis2 的一个重要方面是，其核心完全独立于传输发送器和接收器。


    Axis2 旨在支持以下传输协议：


    - HTTP/HTTPS：在 HTTP 传输中，传输监听器是一个 servlet 或 Axis2 提供的 `org.apache.axis2.transport.http.SimpleHTTPServer`。传输发送器使用公共
    HTTP 客户端进行连接并发送 SOAP 消息。

    - TCP：这是最简单的传输，需要 WS-Addressing 支持才能正常工作。

    - SMTP：这需要一个电子邮件帐户。传输接收器是一个线程，按固定时间间隔检查电子邮件。

    - JMS：这提供了一种使用 JMS 方式调用 Web 服务的方法。

    - XMPP：这提供了一种与 Jabber 服务器通信并使用 XMPP 协议调用 Web 服务的标准方式。


    ## 其他模块


    其他模块指的是可选模块，它们提供附加功能或实用工具：例如，需要生成 Axis2 服务和服务代理的模块。Axis2 在运行时不会使用这些模块，如前所述，它们仅用于提供附加功能。Axis2
    将它们作为工具模块，用于生成服务端代码和客户端代码。


    - 代码生成：Axis2 提供了一个代码生成工具，可生成服务端（骨架）和客户端（存根或代理）代码，以及描述符和测试用例。生成的代码将简化服务的部署和调用。这将提高
    Axis2 的易用性。

