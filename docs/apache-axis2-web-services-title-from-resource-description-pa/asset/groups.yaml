    \ way that all functionality is abstracted out by a set of interfaces. By implementing\
    \ these interfaces and providing the implementation classes in the clustering\
    \ configuration section, any different clustering implementation can be plugged\
    \ in. The default clustering implementation in Axis2 is based on Apache Tribes\
    \ (Apache Tribes n.d.), the popular group management framework used by Apache\
    \ Tomcat (Apache Tomcat n.d.). One may be required to use a group management framework\
    \ of one's choice, in which case, he/she can implement these interfaces and then\
    \ plug them using the clustering configuration section in the `axis2.xml` file.\
    \ We will be taking a look at the usages of these interfaces later in this chapter.\n"
  mdcn: "\n## synchronizeAll\n\n当收到并处理一个Web服务请求时，是否应该在响应发送给客户端之前，更新集群中所有成员的状态？如果此参数的值设置为true，则只有在所有成员都更新完毕之后，才会向客户端发送响应。显然，这可能会很耗时。在某些情况下，如果这种开销不可接受，则应将此参数的值设置为false。这种做法的风险在于，当响应发送给客户端时，所有成员不会处于相同的状态。这种情况必须由用户处理。总而言之，此参数定义了我们是否应该在向客户端发送响应之前同步组内所有成员的状态。\n\
    \n## maxRetries\n\n此参数定义在放弃并向特定成员发送消息并认为该节点故障之前，我们需要重试的最大次数。达到maxRetries次重试后，我们便放弃。\n\
    \n## mcastAddress\n\n这是要使用的多播地址。仅当membershipScheme设置为multicast时，才会考虑此参数。\n\n##\
    \ mcastPort\n\n这是要使用的多播端口。仅当membershipScheme设置为multicast时，才会考虑此参数。\n\n## mcastFrequency\n\
    \n此参数定义发送成员关系多播消息的频率。该值应以毫秒为单位指定。仅当membershipScheme设置为multicast时，才会考虑此参数。\n\n\
    ## memberDropTime\n\n此参数定义了一个时间间隔，如果某个成员在此时间间隔内没有响应，则视为该成员已离开组。该值应以毫秒为单位指定。\n\n\
    ## mcastBindAddress\n\n此参数定义了多播必须绑定到的网络接口的IP地址。多播将使用此接口进行。仅当`membershipScheme`设置为`multicast`时，才会考虑此参数。请注意，此地址可以与`localMemberHost`参数不同。因此，我们可以在`localMemberHost`网络接口上监听点对点消息，同时在绑定到`mcastBindAddress`的网络接口上监听多播消息。\n\
    \n## localMemberHost\n\n此参数定义该成员的主机名或IP地址。这是该成员在加入组并发送消息时宣告的IP地址。应将其设置为除localhost或127.0.0.1以外的有效值。在大多数情况下，将其设置为用于与组内成员通信的网络接口所绑定的IP地址即可。\n\
    \n## localMemberPort\n\n此参数定义该成员使用的TCP端口。其他成员将通过此端口与该成员联系。此端口的默认值为4000。\n\n##\
    \ preserveMessageOrder\n\n此参数指示应保持消息顺序。这将按照发送方的顺序进行。此参数的默认值为true。\n\n## atmostOnceMessageSemantics\n\
    \n此参数指示需要保持“至多一次”的消息处理语义。它保证给定的集群消息将至多传递一次到目标进程或节点。此参数的默认值为true。\n\n## properties\n\
    \n有一些特定于该成员的属性。这些属性就是简单的名-值对。当成员加入组时，这些属性会绑定到该成员上，以便组内的其他成员能够检测到这些属性。在需要进行集中式集群管理的情况下，可以使用这些属性。\n\
    \n例如：假设有一个可由独立服务器管理的Axis2集群。每个Axis2成员将提供两个成员属性，即backendServerURL和mgtConsoleURL。backendServerURL属性用于连接成员的后端管理Web服务。类似地，如果该成员希望公开自己的管理控制台，则可以通过提供“mgtConsoleURL”属性来实现。backendServerURL属性使用<property\
    \ name=\"backendServerURL\" value=\"https://${hostName}:${httpsPort}/services/\"\
    />条目来指定。这里，${hostName}表示hostName成员属性，${httpsPort}表示httpsPort成员属性。hostName和httpsPort是两个隐式成员属性。httpPort是另一个隐式成员属性。先前已声明的属性可以在后续的属性定义中使用。例如，我们可以按如下方式定义一个新属性：<property\
    \ name=\"foo\" value=\"${backendServerURL}/foo\"/>。\n\n## 状态管理\n\n如果需要在集群组的成员之间同步状态，则需要启用stateManager元素。需要提供org.apache.axis2.clustering.state.StateManager的实现作为class属性的值。在默认的基于Apache\
    \ Tribes的实现中，我们提供了org.apache.axis2.clustering.state.DefaultStateManager类。用户可以选择不复制某些属性。这可以通过提供属性名模式来实现。让我们看下面的例子：\n\
    \n```\n<stateManager class=\"org.apache.axis2.clustering.state.DefaultStateManager\"\
    \ enable=\"true\">\n  <replication>\n    <defaults>\n      <exclude name=\"local_*\"\
    />\n      <exclude name=\"LOCAL_*\"/>\n    </defaults>\n    <context class=\"\
    org.apache.axis2.context.ConfigurationContext\">\n      <exclude name=\"UseAsyncOperations\"\
    />\n      <exclude name=\"SequencePropertyBeanMap\"/>\n    </context>\n    <context\
    \ class=\"org.apache.axis2.context.ServiceGroupContext\">\n      <exclude name=\"\
    my.sandesha.*\"/>\n    </context>\n  </replication>\n</stateManager>\n```\n\n\
    ![](img/e2fb05de168053e6227dab034eff9353_233_0.png)\n\n静态成员在每个成员的axis2.xml文件中指定如下：\n\
    \n```\n<members>\n    <member>\n        <hostName>S1</hostName>\n        <port>4000</port>\n\
    \    </member>\n    <member>\n        <hostName>S2</hostName>\n        <port>4000</port>\n\
    \    </member>\n</members>\n```\n\n如上图所示，属于域Group H并且至少知道组内一个静态成员的新成员N，可以加入该组。这个新成员将首先联系其中一个静态成员，并了解组成员信息。静态成员将告知N组成员信息{S1,\
    \ S2, D1, D2, D3}，然后通知组内每个成员N已加入组，如下面的时序图所示：\n\n![](img/e2fb05de168053e6227dab034eff9353_233_1.png)\n\
    \n![](img/e2fb05de168053e6227dab034eff9353_235_0.png)\n\n为了管理如上图所示的两个组Group H和Group\
    \ D，集群管理器需要有以下配置：\n\n```\n<groupManagement enable=\"true\">\n    <applicationDomain\
    \ name=\"GroupH\"\n        description=\"This is the first group\" agent=\"org.apache.\n\
    axis2.clustering.management.DefaultGroupManagementAgent\"/>\n\n    <applicationDomain\
    \ name=\"GroupD\"\n        description=\"This is the second group\" agent=\"org.apache.\n\
    axis2.clustering.management.DefaultGroupManagementAgent\"/>\n</groupManagement>\n\
    ```\n\n## 高可用负载均衡\n\n为了避免单点故障，工作Axis2集群——**Group H**和**Group D**——可以由负载均衡器集群**Group\
    \ LB**作为前端，如下图所示。**Group LB**中的一个负载均衡器将作为主负载均衡器。Apache Synapse负载均衡器可以以这种方式部署，并使用底层的Axis2集群机制。Web服务客户端将与主负载均衡器中的端点通信，而不会感知到后端工作节点Axis2集群。\n\
    \n![](img/e2fb05de168053e6227dab034eff9353_236_0.png)\n\n## Axis2集群管理API\n\nAxis2集群的设计方式是，所有功能都通过一组接口进行抽象。通过实现这些接口并在集群配置部分提供实现类，可以插入任何不同的集群实现。Axis2中的默认集群实现基于Apache\
    \ Tribes（Apache Tribes n.d.），这是Apache Tomcat（Apache Tomcat n.d.）使用的流行的组管理框架。有时可能需要使用自己选择的组管理框架，在这种情况下，可以实现这些接口，然后通过`axis2.xml`文件中的集群配置部分将它们插入。我们将在本章后面讨论这些接口的用法。\n\
    \n"
