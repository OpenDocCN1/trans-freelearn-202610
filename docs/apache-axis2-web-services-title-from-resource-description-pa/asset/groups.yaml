  - '[PAGE 94]


    # Global descriptor or axis2.xml


    As mentioned earlier, the configuration in Axis2 can be specified using XML descriptors.
    This gives you much more flexibility for extending and changing Axis2. No need
    to go and change the code to have a different configuration. Even for core functionality,
    it''s the same. If you consider Axis2''s global configuration file—axis2.xml—it
    has all the minimal configurations that are needed to run Axis2. Axis2''s minimal
    configuration includes:


    +   - Configuration parameters

    +   - Transport senders

    +   - Transport listeners

    +   - Execution chains and phases

    +   - Default dispatchers

    +   - Default message receivers

    +   - Default client-side configurations

    +   - Global modules

    +   - WS-Policy (global level policy)


    Some of the given terms are not familiar to you, but you do not need to worry
    about them now. We will discuss these terms in the following chapters. Axis2 comes
    with default axis2.xml, and it has the minimum configuration required for starting
    Axis2. However, you can change it as you wish and can start Axis2 with your own
    axis2.xml. The key thing to remember here is that if you make any changes to axis2.xml,
    you have to restart the system in order to make those changes effective.


    # Service descriptor (services.xml)


    As we discussed in the previous section, axis2.xml specifies the configuration
    that affects the whole system. However, services.xml is for configuring a particular
    service or a service group. In the next section, we will look at the available
    ways of deploying services in Axis2. Archive-based deployment and directory-based
    deployment can be considered as the two most commonly used techniques. In these
    two cases, for a service to be a valid service, it is required to have a services.xml
    file. A service descriptor is used to specify the following types of configurations
    (some of these are optional):


    +   - Name of the service

    +   - Target name spaces of the service

    +   - Session scope'
  - '[PAGE 95]


    +   - Expose transports

    +   - Service level and operation level parameters

    +   - Message receivers

    +   - Service level modules

    +   - Operations – expose operations as well as non expose operations

    +   - Bean mapping

    +   - Object suppliers

    +   - Service and operation level policy


    We will learn more about services.xml and how to write and create services in
    Chapter 7, Writing an Axis2 Service.


    # Module descriptor or module.xml


    It is so obvious now that module.xml is for configuring Axis2 modules; so it also
    has different types of configurations:


    +   - Handlers and their phase rules

    +   - Module parameters

    +   - End points

    +   - WS-Policy


    In Chapter 8, Writing an Axis2 Module, we will learn more about Axis2 modules
    and how to write them.


    # Available deployment options


    In the initial stage of Axis2, it only had archive-based deployment. However,
    later it introduced a number of convenient deployment options. This relay made
    the service authors'' jobs easier. Adding them all together, Axis2 has the following
    deployment options for service deployment:


    +   - Archive-based deployment

    +   - Directory-based deployment

    +   - Deploying programmatically using archive files

    +   - Programmatically making the Java class into a web service

    +   - Plain Old Java Object (POJO) deployment support alone with annotation

    +   - Deploy and start Axis2 in one line'
  - "[PAGE 96]\n\n# Archive-based deployment\n\nThe most common and recommended approach\
    \ for deploying a service in Axis2 is **archive-based deployment**. There you\
    \ get many configuration options and more flexibility compared to other types.\
    \ In this chapter, we will discuss more about archive-based deployment with samples.\n\
    \n# Directory-based deployment\n\n**Directory-based deployment** is almost identical\
    \ to archive-based deployment; the only difference is that rather than creating\
    \ an archive file, you can deploy a service as a directory. The structure of the\
    \ directory is identical to that of an archive file.\n\n# Deploying a service\
    \ programmatically\n\nTo deploy a service programmatically using an archive file\
    \ is not really a user requirement; rather it is module author's requirement,\
    \ where some modules require a web service to be deployed at runtime in order\
    \ to provide the full functionality of that particular module.\n\nTo create a\
    \ service (`ServiceGroup`) programmatically, you need to have the file object\
    \ representing the service archive file and a pointer to an Axis2 runtime or `ConfigurationContext`.\
    \ Once you have those two, we can create a web service, as shown in the following\
    \ code fragment. The advantage of this approach is that you do not need to copy\
    \ your service archive file into the repository and it is only visible at the\
    \ runtime of your service.\n\n```\n//Need to have a reference to ConfigurationContext\n\
    ConfigurationContext configContext = getConfigurationContext();\nFile serviceArchiveFile\
    \ = new File(\"Location of the file\");\n//Now let's create AxisServiceGroup which\
    \ contains the service we want to have\nAxisServiceGroup serviceGroup = DeploymentEngine.loadServiceGroup(\n\
    \    serviceArchiveFile,\n    configContext);\n```\n\nOnce you have created a\
    \ service, the next step is to add the service into the system. You can do that\
    \ as follows:\n\n```\n//Getting a pointer to AxisConfiguration\nAxisConfiguration\
    \ axiConfiguration = configContext.\ngetAxisConfiguration();\n//Adding the created\
    \ service\naxiConfiguration.addServiceGroup(serviceGroup);\n```"
