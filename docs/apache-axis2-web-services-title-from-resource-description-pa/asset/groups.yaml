    \ Obviously, this can be time consuming. In some cases, where this overhead may\
    \ not be acceptable, the value of this parameter should be set to false. The risk\
    \ in this case will be that all members will not be in the same state when the\
    \ response is sent to the client. This condition will have to be handled by the\
    \ user. In summary, this parameter defines whether or not we should synchronize\
    \ the state of all members in the group before we send the response to the client.\n\
    \n## maxRetries\n\nThis defines the maximum number of times we need to retry to\
    \ send a message to a particular member before giving up and considering that\
