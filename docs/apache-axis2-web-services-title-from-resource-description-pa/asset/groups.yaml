    In Axis2, hot deployment and hot update work by constantly monitoring the changes
    in the repository by a timer. More specifically, when the user changes the last
    modified date of a given file, it will treat it as a hot update. In contrast,
    when it finds a new file it treats it as a hot deployment. The architecture of
