  - "[PAGE 275]\n\n```\n(\"http://localhost:8080/axis2/services/EchoService\");\n\
    opts.setAction(\"urn:echo\");\nclient.engageModule(\"addressing\");\nopts.setUseSeparateListener(true);\n\
    client.setOptions(opts);\nclient.sendReceiveNonBlocking(createPayLoad(), new MyCallBack());\n\
    System.out.println(\"send the message\");\nwhile (true) {\n    Thread.sleep(100);\n\
    }\n}\n```\n\nThe first highlighted line shows how we have engaged the addressing\
    \ module, and the second highlighted line shows how to enable a separate listener\
    \ in the client side by setting the Option value in the Option object.\n\n# Summary\n\
    \nIn this chapter, we have discussed a number of the advanced features of Axis2,\
    \ with examples. In particular, REST and MTOM are very useful in the context of\
    \ web services. You can use REST as a way of optimizing the wire format of the\
    \ message and you can use MTOM to send binary data in an efficient manner. Then\
    \ we discussed creating Axis2 using a custom repository, which may be located\
    \ locally or remotely. Next, we looked into deploying Axis2 in various application\
    \ servers. Finally, we discussed how to use Axis2 to invoke services in an asynchronous\
    \ manner.\n\nNow we have covered most of the necessary concepts and features of\
    \ Axis2. We have discussed how to use Axis2, both as a server and a client.\n\n\
    In the next chapter (the last chapter of the book), we will discuss how to add\
    \ quality of services to your web service. Particularly, we will discuss security\
    \ and reliability and how to use them with code examples."
