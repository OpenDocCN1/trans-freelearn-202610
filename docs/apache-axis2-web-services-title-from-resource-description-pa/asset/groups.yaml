    The repository directory consists of two main sub directories called `services`
    and `modules`. Also, you may have an optional sub directory called `lib` as well.
    If you want to deploy a service, you need to drop the service archive file into
    the `services` directory. Similarly, if you want to deploy a module, then you
    need to drop a module archive file into the `modules` directory. The idea behind
    the `lib` directory is to store the third-party libraries that are going to be
    shared across both services and modules. Refer to the next screenshot to see the
    directory structure:


    ![](img/e2fb05de168053e6227dab034eff9353_92_0.png)


    If one or more modules in the `modules` directory are required to share some resources,
    then they can add those resources into the `lib` directory inside the `modules`
    directory. Similarly, if the services in the `services` directory want to share
    some common resources, the proper place is the `lib` directory inside the `services`
    directory.


    # Change in the way of deploying handlers (modules)


    The concept of **service extension** is a new feature to the Apache Axis paradigm,
    but the developers have achieved the same goal doing a hard job in Axis 1.x. So
    the idea is to extend the core functionality of the system or to provide quality
    of services. In the case of Axis 1.x, if you need to extend its core functionality,
    you need to write a handler (the smallest unit in the execution chain), change
    the global configuration files to add the handler, and finally restart the system.'
