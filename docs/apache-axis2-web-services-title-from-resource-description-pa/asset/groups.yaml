    \nThe createSOAPEnvelop method will look like the next snippet of code:\n\n```\n\
    public SOAPEnvelope createSOAPEnvelop() {\n    SOAPFactory fac = OMAbstractFactory.getSOAP11Factory();\n\
    \    SOAPEnvelope envelope = fac.getDefaultEnvelope();\n    OMNamespace omNs =\
    \ fac.createOMNamespace(\n            \"http://ws.apache.org/axis2\", \"ns1\"\
    );\n    OMElement method = fac.createOMElement(\"echo\", omNs);\n    OMElement\
    \ value = fac.createOMElement(\"echo\", omNs);\n    value.setText(\"Hello\");\n\
    \    method.addChild(value);\n    envelope.getBody().addChild(method);\n\n   \
    \ return envelope;\n}\n```\n\nIn this sample, what we have is the default SOAPEnvelope\
    \ with a sample payload, but we can create a complex SOAPEnvelope, depending on\
    \ our requirements.\n\n+   5. Add a message context into the operation client:\n\
    +   \n+   `opClient.addMessageContext(outMsgCtx);`\n\n+   6. To send the message,\
    \ we need to call the execute method in the operation client:\n+   \n+   `opClient.execute(true);`\n\
    \nThe Boolean method argument is to say whether we want to invoke it in a blocking\
    \ manner or a non-blocking manner. If the value is true, invocation will be a\
    \ blocking one.\n\n+   7. To access a response message context and response SOAPEnvelope:\n\
    +   \n   ```java\n   //pass message label as method argument\n   MessageContext\
    \ inMsgCtx = opClient.getMessageContext(\"In\");\n   \n   SOAPEnvelope response\
    \ = inMsgCtx.getEnvelope();\n   System.out.println(response);\n   ```\n\nWhen\
    \ we are invoking an in-out MEP, as in this sample, the message label of the request\
    \ is Out and value of the response is In; that is why we have to pass In as the\
    \ message label value to get the response message context.\n\nOnce we have the\
    \ message context, we can use that to access the SOAPEnvelop, properties, transport\
    \ headers, and so on. And when we run this code sample, we should get the following\
    \ as the console output:\n\n```\n<?xml version='1.0' encoding='utf-8'?>\n<soapenv:Envelope\n\
    \    xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\">\n    <soapenv:Header\
    \ />\n    <soapenv:Body>\n        <ns:echoResponse\n            xmlns:ns=\"http://ws.apache.org/axis2/xsd\"\
    >\n            <return>\n                Hello\n            </return>\n      \
    \  </ns:echoResponse>\n    </soapenv:Body>\n</soapenv:Envelope>\n```\n\nHere,\
    \ we discussed OperationClient as the means of accessing the incoming and outgoing\
    \ MessageContext. One of the most useful use cases of accessing outgoing MessageContext\
    \ or the SOAPEnvelop is to add headers. However, the ServiceClient API can also\
    \ be used to add SOAP headers, as shown here:\n\n```\nsc.addHeader(SOAPHeaderBlock);\n\
    ```\n\nOr we could add headers, as shown here:\n\n```\nsc.addStringHeader(new\
    \ QName(\"http://sample.org/header\",\"MyHeader\"), \"headervalue\");\n```\n\n\
    If we intercept the message using the TCP monitor or similar mechanisms, we can\
    \ see the SOAP header in the SOAP message:\n\n```\n<soapenv:Header>\n    <axis2ns1:MyHeader\
    \ xmlns:axis2ns1=\n        \"http://sample.org/header\">headervalue</axis2ns1:MyHeader>\n\
    </soapenv:Header>\n```\n\nIn the meantime, we can access the last OperationContext\
    \ using ServiceClient, as shown here:\n\n```\nOperationContext operationContext\
    \ = sc.getLastOperationContext();\n```\n\nFrom operationContext, we can get either\
    \ In messageContexts or Out messageContexts.\n\n## Summary\n\nIn this chapter,\
    \ we discussed one of the key components of Axis2 known as Axis2 client API. We\
    \ discussed how to create the Axis2 client instances in multiple ways as well\
    \ as various ways of configuring them.\n\nNext, we discussed the most commonly\
    \ used APIs and we used code samples to explain the scenarios better. The Axis2\
    \ client API is very convenient and it has a number of cool features such as asynchronous\
    \ web service invocations, multiple transport selection, and so on. After running\
    \ the sample, we can easily understand the basis of the Axis2 client API; understanding\
    \ the rest of the API required us to write complex samples.\n\nAs stated earlier,\
    \ by design, web services are said to be stateless. However, it is difficult to\
    \ implement complex applications without having session management support. To\
    \ understand the need for session support, let us consider a typical bank application.\
    \ If we consider the sequence of events associated with a typical banking application,\
    \ we get an idea as to why we need sessions:\n\n- First the user logs in to his/her\
    \ account (invoking the `login` method)\n- Withdraw money (invoking some operation\
    \ on his/her account)\n- Log out (complete the transaction)\n\nWe can easily understand\
    \ that the three operations stated earlier are interrelated and the same user\
    \ does all those invocations. So this means that someone needs to keep a track\
    \ of the user and the user data throughout the invocation of the methods. This\
    \ simply indicates the requirement of session management to implement the banking\
    \ application in the web-services way. Of course, there will be alternative ways\
    \ of implementing the same application; then there is a need to have some other\
    \ mechanism in place to identify and authenticate the user.\n\n## Stateless nature\
    \ of Axis2\n\nAs we know by now, Axis2 architecture keeps logic and data separate.\
    \ In the meantime, Axis2 has two types of data models — **static data** and **runtime\
    \ data**. We have already discussed these in detail. In this chapter, we will\
    \ discuss more about Axis2 dynamic data hierarchy because session management fully\
    \ depends on the runtime data. The samples in this chapter will help you understand\
    \ more about runtime and static data, and most importantly, where to use what.\n\
    \nIn Axis2 framework, each individual component is said to be **stateless**. In\
    \ other words, service implementation class or handlers should not try to store\
    \ any local variable. Having stateless instances provides better support to reduce\
    \ the concurrency control issues; this is due to the race conditions. In Axis2\
    \ handlers, `MessageReceivers`, `TransportSenders`, `TransportReceivers`, and\
    \ even `AxisEngine`, are said to be stateless. So they do not keep any state in\
    \ those classes. As a result of that, we do not mind whether we have one instance\
    \ or a number of instances of the same handlers. As Axis2 has the notion of stateless\
    \ nature in handlers, when you write handlers you need to write it in such a way\
    \ that it does not keep any state in it. For example, we cannot consider the following\
    \ handler implementation as a good approach. As we can see, it has a class variable\
    \ to store the `messageContext`. So when we deploy Axis2 in a concurrent environment,\
    \ we will definitely have issues. So, as the best practice, we need to keep in\
    \ mind not to use any class variables inside our code.\n\n```\npublic class InvalidHandler\
    \ extends AbstractHandler {\n    //Class variable to keep current MC\n    private\
    \ MessageContext currentMessageContext;\n    public InvocationResponse invoke(MessageContext\
    \ msgContext) throws AxisFault {\n        currentMessageContext = msgContext;\n\
    \        //We need to write whatever the log we need to have here\n        return\
    \ InvocationResponse.CONTINUE;\n    }\n}\n```\n\nThe preceding code sample shows\
    \ that the handler that keeps the class variable calls currentMessageContext.\
    \ This has serious issues when multiple concurrent requests are being handled.\
    \ Thus the correct approach would be to not use class variables. You can solve\
    \ this by either using a method variable or by storing it in some other context;\
    \ we will discuss this later in this chapter. The following code sample demonstrates\
    \ the correct way of handling variables:\n\n```\npublic InvocationResponse invoke(MessageContext\
    \ msgContext) throws AxisFault {\n    MessageContext currentMessageContext = msgContext;\n\
    \    //We need to write whatever the log we need to have here\n    return InvocationResponse.CONTINUE;\n\
    }\n```\n\nThis does not mean that we cannot maintain state in Axis2; it simply\
    \ tells us that keeping states in an implementation class is not the right approach.\
    \ The most recommended way is to use the context hierarchy to store necessary\
    \ data and manage sessions.\n\n## The available type of sessions in Axis2\n\n\
    As mentioned earlier, it is very difficult to implement enterprise level applications\
    \ using a web service without having proper session management support. On the\
    \ other hand, it is not a mandatory requirement to have session management support\
    \ in a web service framework. We might have services that do not require session\
    \ management at all.\n"
