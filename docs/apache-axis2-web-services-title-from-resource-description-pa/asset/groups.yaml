  - "[PAGE 171]\n\n+   - `ServiceContext`: This will represent the runtime of one\
    \ service and the context lifetime will be the lifetime of the session. There\
    \ can be one or many service contexts in the system, depending on the session\
    \ scope of the corresponding service.\n+   - `OperationContext`: This context\
    \ is to represent the life time of a MEP (Message Exchange Patterns). The lifetime\
    \ of an operation context is mostly less than the lifetime of the `ServiceContext`.\n\
    +   - `MessageContext`: The lifetime of an incoming message is represented by\
    \ the message context. If two handlers in a given execution chain want to share\
    \ data, then the best way is to store them in the message context. One `OperationContext`\
    \ may have one or more `MessageContexts`.\n\n# Session initializing and session\
    \ invalidating\n\nWhen talking about the session management, one thing that comes\
    \ to mind is the lifetime of the session. Most of the Web applications, like e-commerce,\
    \ banking, hotel reservation, and so on, have a predefine lifetime. If you are\
    \ not active for that time, it will automatically terminate your session and prompt\
    \ you to log in again. Hence, there is a particular time when a session gets started\
    \ and another when the session finishes. So whoever writes a session aware service\
    \ might need to know when a session starts and when it finishes. To facilitate\
    \ this, Axis2 uses Java reflection and optional interfaces to inform the service\
    \ implementation class. Actually, there are two ways that a service author is\
    \ notified when a session starts and finishes, irrespective of the session scope.\n\
    \n# Java reflection\n\nIn this case, the service author has to implement the following\
    \ two methods in his/her service implementation class, if he/she wants to be notified\
    \ as to when the session starts and finishes. At runtime, when a session starts,\
    \ Axis2 looks to see whether the following methods are there in the service implementation\
    \ class; if so, it calls the right method:\n\n```\n//This method will be called\
    \ when a session start\npublic void init(ServiceContext serviceContext) {\n  \
    \  // Our code goes here\n}\n//This method will be called when a session finishes.\n\
    public void destroy(ServiceContext serviceContext) {\n    // Our code goes here\n\
    }\n```"
  - "[PAGE 172]\n\n# Using the optional interface\n\nWhen we use Java reflection,\
