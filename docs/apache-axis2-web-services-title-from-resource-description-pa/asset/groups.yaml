    ## 5

    Deployment Model


    现在趋势不仅仅是拥有功能，而是以非常用户友好的方式拥有它们。时间是他们唯一关心的东西，没有人喜欢花几天时间做一件小事。在 Apache Axis 的早期版本中，用户友好性并不是首要考虑因素，因为它们主要用于验证
    Web 服务概念。因此，在 Axis 1.x 中，用户必须手动调用管理客户端，更新服务器 `classpath`，然后重启服务器以应用更改。这种繁琐的部署模型对初学者来说无疑是障碍。因此，Axis2
    被设计用来克服这一缺点，并提供灵活、用户友好且易于配置的部署模型。


    在本章中，我们将讨论：


    - Axis2 部署模型，特别是基于归档的部署模型

    - 热部署和热更新

    - 仓库的概念

    - 不同的部署描述符

