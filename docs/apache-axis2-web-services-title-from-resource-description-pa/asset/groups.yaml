  - "[PAGE 219]\n\n# Writing a highly available clusterable web service\n\nIn general,\
    \ you do not have to do anything extra to make your web service clusterable. Any\
    \ regular web service is clusterable in general. In the case of stateful web services,\
    \ you need to store the Java serializable replicable properties in the Axis2 ConfigurationContext,\
    \ ServiceGroupContext, or ServiceContext. Please note that stateful variables\
    \ you maintain elsewhere will not be replicated. If you have properly configured\
    \ the Axis2 clustering for state replication, then the Axis2 infrastructure will\
    \ replicate these properties for you. In the next section, you will be able to\
    \ look at the details of configuring a cluster for state replication. Let us look\
    \ at a simple stateful Axis2 web service deployed in the soapsession scope:\n\n\
    ```\npublic class ClusterableService {\n    private static final String VALUE\
    \ = \"value\";\n\n    public void setValue(String value) {\n        MessageContext.getCurrentMessageContext().getServiceContext();\n\
    \        serviceContext.setProperty(VALUE, value);\n    }\n\n    public String\
    \ getValue() {\n        MessageContext.getCurrentMessageContext().getServiceContext();\n\
    \        return (String) serviceContext.getProperty(VALUE);\n    }\n}\n```\n\n\
    You can deploy this service on two Axis2 nodes in a cluster. You can write a client\
    \ that will call the setValue operation on the first, and then call the getValue\
    \ operation on the second node. You will be able to see that the value you set\
    \ in the first node can be retrieved from the second node. What happens is, when\
    \ you call the setValue operation on the first node, the value is set in the respective\
    \ ServiceContext, and replicated to the second node. Therefore, when you call\
    \ getValue on the second node, the replicated value has been properly set in the\
    \ respective ServiceContext. As you may have already noticed, you do not have\
    \ to do anything additional to make a web service clusterable. Axis does the state\
    \ replication transparently. However, if you require control over state replication,\
    \ Axis2 provides that option as well. Let us rewrite the same web service, while\
    \ taking control of the state replication:\n\n```\npublic class ClusterableService\
    \ {\n    private static final String VALUE = \"value\";\n    public void setValue(String\
    \ value) {\n```"
