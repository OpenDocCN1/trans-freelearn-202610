    }\n```\n\n# javax.xml.ws.ServiceMode\n\nWeb service endpoints may choose to work\
    \ at the XML message level by implementing the Provider interface. This is achieved\
    \ by implementing either Provider<Source>, Provider<SOAPMessage>, or Provider<DataSource>.\
    \ The endpoint accesses the message or message payload using this low-level, generic\
    \ API. All the Provider endpoints must have the @WebServiceProvider annotation.\
    \ The @ServiceMode annotation is used to convey whether the endpoint wants to\
    \ access the message (Service.Mode.MESSAGE) or payload (Service.Mode.PAYLOAD).\
    \ If there is no @ServiceMode annotation on the endpoint, the payload is the default\
    \ value. This annotation contains a single attribute value, which conveys whether\
    \ the Provider endpoint wants to access the entire message (MESSAGE) or just the\
    \ payload (PAYLOAD), and the default value is PAYLOAD. The following example demonstrates\
    \ the usage of this annotation:\n\n```\n@ServiceMode(value=Service.Mode.PAYLOAD)\n\
    public class AddNumbersImpl implements Provider<Source> {\n    public Source invoke(Source\
