    \ Web 服务常用的两种基本方法。学完本章后，你将深入理解如何创建 Web 服务并在 Axis2 中部署它。在第 9 章“客户端 API”中，我们将讨论如何调用部署在\
    \ Axis2 或其他地方的 Web 服务。\n\n- 现在打开浏览器，输入以下 URL，查看结果。这里需要注意的是，根据你在 Tomcat 中指定的端口，你可能需要修改\
    \ 8080。\n\n```\nhttp://localhost:8080/axis2/services/HelloWorld/sayHello?name=Axis2\n\
    ```\n\n现在，你应该能在浏览器中看到 Hello Axis2。你可以通过更改 name 参数来进行测试，你会发现该服务会对输入的任何名称回复 Hello。\n\
    \n![](img/e2fb05de168053e6227dab034eff9353_121_0.png)\n\n这一切意味着你已成功部署了服务；更具体地说，你已经以\
    \ REST（表述性状态转移）方式调用了该服务。\n\n如前所述，前面的方法可以被视为在 Axis2 中编写和部署服务最简单的方法之一。虽然我们选择的示例非常简单，但这并不是说你就不能以这种方式编写非常复杂的服务。然而，唯一的限制是，你的服务类不能放在默认包之外的任何包中。如果你希望服务类位于自己的包结构中，则必须遵循一条略有不同的路径，我们将在本章稍后部分讨论。\n\
    \n考虑到 Axis2 提供的 POJO 支持，你应该知道，你可以部署带注解的 Java 类和不带注解（普通）的 Java 类。这里需要提及的是，Axis2\
    \ 支持 JSR 181 注解规范。如果你不熟悉 Java 注解，那么可以这样说：注解是在使用 POJO 时提供元数据的一种机制。一个带有基本 JSR 181\
    \ 注解的简单 Java 类可以写成如下形式。需要注意的是，使用这一特性可以提供大量数据并创建复杂的应用程序。\n\n```\nimport javax.jws.WebService;\n\
    import javax.jws.WebMethod;\nimport javax.jws.WebParam;\n\n@WebService (targetNamespace\
    \ = \"http://sample.org/helloWorld\", name = \"HelloWorld\")\npublic class HelloWorld\
    \ {\n@WebMethod (action = \"urn:sayHello\" ,operationName = \"sayHello\")\npublic\
    \ String sayHello(@WebParam (partName = \"name\") String name)\n{\n    return\
    \ \"Hello \" + name;\n}\n}\n```\n\n注解仅在 JDK 1.5 或更高版本中受支持。此外，此时你无需担心缺乏注解使用经验。你这里的主要目标应该是学习\
    \ Axis2 概念，之后，使用注解就会非常简单。\n\n### 带包的 POJO\n\n正如我们在上一节中讨论的，当以单个 .class 文件部署 POJO\
    \ 时，你不能将 Java 类声明在自定义包中。但如果你确实需要这样做，或者如果你的 POJO 的运行需要多个类，而你又不能再使用单个类的 POJO 方法，那么你需要采用我们接下来要讨论的方法。\n\
    \n现在让我们考虑如下类：\n\n```\npackage book.sample;\nimport javax.jws.WebService;\n@WebService\n\
    public class AddressService {\n    public Address getAddress(String name) {\n\
    \        Address address = new Address();\n        address.setStreet(\"Street\"\
    );\n        address.setNumber(\"Number 15\");\n        return address;\n    }\n\
    }\n```\n\n你可以看到，我们为 AddressService 类添加了注解。对应的 Address 类如下所示：\n\n```\npackage book.sample;\n\
    public class Address {\n    private String street;\n    private String number;\n\
    \    public String getStreet() {\n        return street;\n    }\n}\n```\n\n"
