    \ be taken into consideration when the membershipScheme is set to multicast.\n\
    \n## mcastFrequency\n\nThis defines the frequency of sending membership multicast\
    \ messages. The value should be specified in milliseconds. This parameter will\
    \ only be taken into consideration when the membershipScheme is set to multicast.\n\
    \n## memberDropTime\n\nThis defines the time interval within which, if a member\
    \ does not respond, the member is deemed to have left the group. The value should\
    \ be specified in milliseconds.\n\n## mcastBindAddress\n\nThis defines the IP\
    \ address of the network interface to which the multicasting has to be bound to.\
    \ Multicasting would be done using this interface. This parameter will only be\
    \ taken into consideration when the `membershipScheme` is set to `multicast`.\
    \ Note that this can be different from the `localMemberHost` parameter. So we\
    \ can listen for point-to-point messages on the `localMemberHost` network interface,\
    \ while listening for multicast messages on the network interface bound to the\
    \ `mcastBindAddress`.\n\n## localMemberHost\n\nThis defines the hostname or IP\
    \ address of this member. This is the IP address advertised by this member when\
    \ it joins the group and sends messages. This should be set to a valid value other\
    \ than localhost or 127.0.0.1. In most cases, it would suffice to set it to the\
    \ IP address bound to the network interface, which is used for communicating with\
    \ members in the group.\n\n## localMemberPort\n\nThis defines the TCP port used\
    \ by this member. This is the port through which other members will contact this\
