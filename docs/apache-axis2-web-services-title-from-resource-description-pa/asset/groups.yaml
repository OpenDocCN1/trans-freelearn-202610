  mdcn: "\n\n![](img/e2fb05de168053e6227dab034eff9353_75_0.png)\n\n阶段（phase）旨在支持阶段规则。阶段规则告诉\
    \ Axis2 在执行链中应将处理器放在何处。稍后我们会看到，有诸如 phaseFirst 和 phaseLast 这样的规则。因此，在一个阶段中，有保留的插槽用于放置阶段第一个和阶段最后一个处理器。其余的处理器将保存在另一个列表中。一个阶段可以图形化表示如下：\n\
    \n![](img/e2fb05de168053e6227dab034eff9353_75_1.png)\n\n一旦引擎调用阶段的 invoke 方法，它将按照以下顺序执行：\n\
    \n1. 首先检查前置条件是否满足。\n   - 如果不满足，则抛出异常并停止处理消息。\n2. 然后检查阶段第一个处理器是否存在。如果存在，则调用它。\n\
    3. 接下来，调用除阶段最后一个处理器之外的其余处理器。\n4. 如果阶段最后一个处理器存在，则调用它。\n5. 最后，检查后置条件是否满足以转发消息。\n\
    \   - 如果不满足，则停止执行并抛出异常。\n\n## 执行链\n\n所有全局阶段从其名称中也具有语义含义：\n\n- 传输阶段（Transport phase）：包含一个执行依赖于传输类型任务的处理器。\n\
    - 安全阶段（Security phase）：WS-security 实现会添加它们的处理器，但不限于此，任何其他模块或用户也可以添加处理器。\n- 预分发（PreDispatch）：顾名思义，它包含一组执行分发所需任务的处理器。像\
    \ WS-addressing 这样的处理器将始终位于此阶段。\n- 分发阶段（Dispatch phase）：该阶段通过为传入消息查找相应的服务和操作来执行分发。因此，分发阶段由分发处理器组成。我们也可以添加新的全局阶段，然后向其添加处理器，这需要修改\
    \ `axis2.xml` 文件。\n\n请注意，如有必要，用户可以通过编辑 `axis2.xml` 轻松添加新阶段。\n\n### 操作阶段\n\n例如，假设我们有一个处理器，不需要为到达系统的每条消息运行它，但需要为选定的操作运行它。这就是操作阶段发挥作用的地方。操作阶段是位于分发阶段之后的阶段，用户可以添加任意数量的阶段。添加操作阶段不会改变其他操作在其链中的结构。\n\
    \n### 阶段规则\n\n阶段规则的主要思想是正确定位处理器相对于阶段内另一个处理器的位置，可能是在部署时或运行时。Axis1 没有阶段或阶段规则的概念。它只有一个全局配置文件，在其中定义处理器。但这有很多局限性；尤其是，你会失去处理器链的动态特性。因此，阶段规则的一个方面是解决动态执行链构建能力的问题。\n\
    \n### 描述阶段规则的特征\n\n阶段规则的特征可以基于以下一个或多个属性：\n\n- 阶段名称（Phase name）：处理器必须被放置到的阶段的名称\n\
    - 第一阶段（`phaseFirst`）：阶段中的第一个处理器\n- 最后阶段（`phaseLast`）：阶段中的最后一个处理器\n- 之前（`before`）：将处理器定位在另一个处理器之前\n\
    - 之后（`after`）：将处理器定位在另一个处理器之后\n- 之前和之后：将处理器放置在两个处理器之间\n\n### 阶段名称\n\n阶段是任何阶段规则的一个强制属性，该规则给出了处理器必须适配的阶段名称。为了使规则成为有效的阶段名称，该名称必须为系统所知，并且必须是全局阶段名称或操作特定的阶段。\n\
    \n### phaseFirst\n\n顾名思义，如果你希望某个处理器在给定阶段中作为第一个处理器被调用，而不考虑该阶段中的其他处理器，则必须将 phaseFirst\
    \ 属性设置为 true。一个其阶段规则仅包含 phaseFirst 和阶段名的处理器如下所示：\n\n```\n<handler name=\"simple_Handler\"\
    \ class=\"org.apache.axis.handlers.SimpleHandler\">\n    <order phase=\"userphase1\"\
    \ phaseFirst=\"true\"/>\n</handler>\n```\n\n### phaseLast\n\n与 phaseFirst 类似，如果希望处理器在给定阶段中最后运行，而不考虑其他处理器，则必须将\
    \ phaseLast 设置为 true。因此，带有 phaseLast 的处理器如下所示：\n\n```\n<handler name=\"simple_Handler\"\
    \ class=\"org.apache.axis.handlers.SimpleHandler\">\n    <order phase=\"userphase1\"\
    \ phaseLast=\"true\"/>\n</handler>\n```\n\n如果某个阶段规则同时将 phaseFirst 和 phaseLast\
    \ 设置为 true，那么该阶段不能再有任何其他处理器。换句话说，该阶段只有一个处理器。\n\n### before\n\n可能会存在这样的情况：一个处理器应该总是在某个其他处理器之前运行，无论其确切位置如何。一个实际用例可以是安全处理器需要在\
    \ RM 处理器之前运行。逻辑必须按如下方式编写，并且 before 属性的值是被引用的处理器名称：\n\n- 如果某个处理器的阶段规则同时将 `phaseFirst`\
    \ 和 `phaseLast` 设置为 `true`，那么该特定阶段不能有多个处理器。如果有人试图编写一个将其他处理器插入到同一阶段的阶段规则，则该第二个阶段规则无效。\n\
    - 一个阶段中不能有两个处理器的 `phaseFirst` 属性设置为 `true`。\n- 一个阶段中不能有两个处理器的 `phaseLast` 属性设置为\
    \ `true`。\n- 如果规则中的 `before` 属性被引用为 `phaseFirst` 处理器，则该规则无效。\n- 如果规则中的 `after`\
    \ 属性被引用为 `phaseLast` 处理器，则该规则无效。\n\n```\n<handler name=\"simple_HandlerError\"\
    \ class=\"org.apache.axis.handlers.SimpleHandlerError\">\n    <order phase=\"\
    userphase1\" before=\"simple_Handler\" phaseFirst=\"true\"/>\n</handler>\n```\n\
    \n阶段规则是为每个基本处理器定义的，系统中的任何处理器都必须归入系统中的某个阶段。\n\n### 流程\n\n流程只是阶段的一个集合，流程内阶段的顺序在\
    \ `axis2.xml` 中定义。由于阶段是一个逻辑集合，实际上是一个虚拟概念，流程可以被视为执行链（处理器的集合）。Axis2 中有四种类型的流程：\n\
    \n- `InFlow`：当消息进入时（请求消息），消息必须经过 `InFlow`。然后 `InFlow` 中的所有处理器都将被调用。`InFlow` 与\
    \ `OutFlow` 有些不同。一个流程由两部分组成。第一部分是从开始到分发器（直到并包括分发阶段）。第二部分仅在分发阶段结束时找到相应服务时才存在。因此，流程的第二部分是传入消息对应操作的\
    \ `InFlow`。所以 `InFlow` 由一个全局部分和一个操作部分组成。\n- `InFaultFlow`：如果传入请求是错误请求（HTTP 状态码为\
    \ 500 的请求），将调用此流程。\n- `OutFlow`：当消息从服务器传出（比如响应）时，将调用此流程。因此，传出消息始终绑定到一个操作，并且在传出路径中没有类似分发的东西。\n\
    \n改变流程的唯一方法是将一个或多个处理器添加到流程中的某个阶段。因此，模块参与将动态地改变处理器链。模块可以动态（运行时）或静态（部署时）参与。如果你想静态地参与一个模块，你需要在描述文件中指定它。如果它是针对服务或操作的，则在\
    \ `services.xml` 中指定；如果是全局参与，则在 `axis2.xml` 中指定。\n\n### 链中的特殊处理器\n\n当你考虑执行链时，可以在执行链中发现四种类型的特殊处理器：\n\
    \n- 传输接收器\n- 分发器\n- 消息接收器\n- 传输发送器\n\n### 传输接收器\n\n每当消息首先进入系统时，它会到达传输接收器。传输接收器可以被视为等待接受传入消息的东西（在应用服务器的情况下，传输接收器可以是\
    \ `Servlet`）。因此，执行链的 `InFlow` 总是从传输接收器开始。\n\n### 分发器\n\n正如我们之前讨论的，SOAP 处理框架的基本目标之一是将传入消息传递到目标应用程序。找到正确的目标应用程序的过程称为**分发**。在\
    \ Axis2 中，分发将在传入执行链的中间进行。因此，分发器是链中的处理器。在 Axis2 中，有几种方式可以执行分发：\n\n- 使用传输头和传输层数据\n\
    - 使用 WS-Addressing 信息\n- 使用传入的 SOAP 消息\n\n"
