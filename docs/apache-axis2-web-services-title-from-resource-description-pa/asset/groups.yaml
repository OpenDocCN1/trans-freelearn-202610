    # Hot deployment and hot update


    Availability is a big concern when it comes to enterprise-level applications,
    and in such a situation, even a fraction of time is highly valuable. Therefore,
    restarting a server is not a realistic option, and what is required is to update
    and change the system without shutting it down. This is where the hot deployment
