    ```

    class="o.a.a.t.h.SimpleHTTPServer"

    <parameter name="port">6060</parameter>

    </transportReceiver>

    </axisconfig>

    ```


    There is a scope associated with a parameter. A parameter defined in axis2.xml
    as an immediate child can be accessed by any of the descriptors in the system.
    If a parameter is defined inside a first level child of axis2.xml (for example,
    transportSender), then that parameter can only be accessed inside that particular
    child, in this case that specific transportSender.


    When accessing a parameter, Axis2 first checks whether the parameter is defined
    in the current description where we are. If not, it checks the immediate parent
    to see whether the parameter exists there. If found, the parameter will be returned;
    otherwise, the parent''s parent will be checked, and so on. In this manner, it
    will search the hierarchy when a request for a parameter is made.


    # MessageReceiver


    In Chapter 4, Execution Chain, we discussed more about MessageReceiver and its
    usage. All the message receivers we are going to use for our services should be
    specified in axis2.xml. You can have as many message receivers as you want and
    use the right one at the services.xml. The way to specify the message receiver
    in axis2.xml is shown next:


    ```

    <messageReceivers>

    <messageReceiver mep="MPE"

    class="o.a.a.r.RawXMLINOnlyMessageReceiver"/>

    </messageReceivers>

    ```


    Note: In the preceding XML element, MEP stands for the Message Exchange Patterns
    that the MessageReceiver can handle. Class attribute is to specify the actual
    implementation class of the MR. You can register any number of message receivers
    alone with a unique MEP. For example, WSDL 2.0 allows 8 types of MEPs.'
