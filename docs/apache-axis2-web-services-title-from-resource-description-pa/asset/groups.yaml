  - "[PAGE 127]\n\n# Specifying message receivers at the service level for the whole\
    \ service\n\nThink of a scenario where you have a large number of operations to\
    \ be published in the services.xml file. In this case, adding message receivers\
    \ for each and every operation seems like a headache. However, if you can specify\
    \ a message receiver for the whole service, it would make the service author's\
    \ job easier and would simplify the services.xml as well.\n\nAxis2 has inbuilt\
    \ support for all of the eight Message Exchange Patterns (MEPs) defined in W.S.D.L.\
    \ 2.0. In a services.xml, you can specify an MEP and the corresponding message\
    \ receiver, and then, depending on the MEP the operation belongs to, Axis2 will\
    \ automatically pick up the message receiver and set it to the operation.\n\n\
    Inside the operation tag, you can add an attribute to specify the MEP of the operation\
    \ as follows:\n\n```\n<operation name=\"sayHello\" mep=\"http://www.w3.org/2004/08/wsdl/in-out\"\
    \ />\n```\n\nAn example of defining service level message receivers for a given\
    \ service is shown here:\n\n```\n<service>\n    <Description>\n        This is\
    \ my first service, which will say Hello.\n    </Description>\n    <messageReceivers>\n\
    \        <messageReceiver mep=\"http://www.w3.org/2006/01/wsdl/in-only\" class=\"\
    org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"/>\n        <messageReceiver\
    \ mep=\"http://www.w3.org/2006/01/wsdl/in-out\" class=\"org.apache.axis2.rpc.receivers.RPCMessageReceiver\"\
    />\n    </messageReceivers>\n    <parameter name=\"ServiceClass\" locked=\"false\"\
    >HelloWorld</parameter>\n    <operation name=\"sayHello\" mep=\"http://www.w3.org/2004/08/wsdl/in-out\"\
    \ />\n</service>\n```"
  - "[PAGE 128]\n\nAccording to the `services.xml`, `org.apache.axis2.rpc.RPCMessageReceiver`\
    \ is the message receiver for all of the in-out operations (any operation that\
    \ belongs to the in-out MEP will assign this message receiver as its message receiver)\
    \ in the service. Whereas, the service level message receiver for an in-only MEP\
    \ is `RPCInOnlyMessageReceiver`. If you redeploy the `HelloWorld` service with\
    \ the new `services.xml`, you will definitely get the same result when you invoke\
    \ the service again.\n\n# Specifying the service level message receiver and overriding\
    \ them through operations\n\nThere may be an instance where a service author wants\
    \ to use different message receivers for some of the operations while he/she has\
    \ already defined service level message receivers. The overriding of a service\
    \ level message receiver by an operation can be easily achieved by just adding\
    \ a message receiver element to the operation that you want to assign a different\
    \ message receiver to. A sample `services.xml` that follows this technique is\
    \ shown next:\n\n```\n<service>\n    <Description>\n        This is my first service,\
    \ which will say Hello.\n    </Description>\n    <messageReceivers>\n        <messageReceiver\
    \ mep=\"http://www.w3.org/2006/01/wsdl/in-only\" class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"\
    />\n        <messageReceiver mep=\"http://www.w3.org/2006/01/wsdl/in-out\" class=\"\
    org.apache.axis2.rpc.receivers.RPCMessageReceiver\"/>\n    </messageReceivers>\n\
    \    <parameter name=\"ServiceClass\" locked=\"false\">HelloWorld</parameter>\n\
    \    <operation name=\"sayHello\">\n        <messageReceiver class=\"org.apache.axis2.receivers.RawXMLINOutMessageReceiver\"\
    />\n    </operation>\n</service>\n```\n\nOperation `sayHello` uses a different\
    \ message receiver than its service level message receivers.\n\nAll the public\
    \ methods in the service implementation class are exposed whether you specify\
    \ them in the `services.xml` or not. Axis2 calculates the MEP of an operation\
    \ by checking its corresponding Java method. If the method's return type is void,\
    \ then the MEP will be in-only, or else it will be in-out. Depending on the MEP,\
    \ the correct message receiver will be set."
