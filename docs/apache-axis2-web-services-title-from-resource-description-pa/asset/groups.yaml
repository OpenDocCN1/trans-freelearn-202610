    \ if the value is null again, the first one from the port list will be selected\
    \ as the port.\n\nA sample WSDL to understand what the mentioned service elements\
    \ can be is shown here (the ports are shown here as well):\n\n```\n<wsdl:service\
    \ name=\"MyService\">\n    <wsdl:port name=\"ServicePort1\" binding=\"axis2:ServiceBinding1\"\
    >\n    <soap:address location=\"http://127.0.0.1:8080/axis2/services/\n      \
    \          MyService\"/>\n    </wsdl:port>\n    <wsdl:port name=\"ServicePort2\"\
    \ binding=\"axis2: ServiceBinding2 \">\n```\n\n```\n<soap12:address location=\"\
    http://127.0.0.1:8080/axis2/services/MyService\"/>\n</wsdl:port>\n</wsdl:service>\n\
    ```\n\n## ServiceClient with working samples\n\nNow we know the available ways\
    \ for creating a service client, but there is nothing like code to explain those.\
    \ So the best way to understand ServiceClient API is to write a few real samples.\
    \ But first, we need to start the Axis2 server and deploy the following sample\
    \ service in the server. Only after that can we write a useful client to invoke\
    \ the service. We can create and deploy a service by using the following steps:\n\
    \n- 1. Open your favorite IDE and write the following Java class or the service\
    \ implementation class.\n\n```\npublic class MyService {\n    //method which has\
    \ a return value\n    public String echo(String value) {\n        return value;\n\
    \    }\n    // does not have a return value\n    public void update(int value)\
    \ {\n        System.out.println(\"value is :\" + value);\n    }\n}\n```\n\nSample\
    \ service implementation class has two methods—one has a return value and the\
    \ other does not.\n\n- 2. Writing the services.xml file for the service, your\
    \ services.xml will look like the following. See the references section to learn\
    \ about Axis2 deployment.\n\n```\n<serviceGroup>\n    <service name=\"MyService\"\
    >\n        <messageReceivers>\n            <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-only\"\
    \ class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"/>\n      \
    \      <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-out\" class=\"\
    org.apache.axis2.rpc.receivers.RPCMessageReceiver\"/>\n        </messageReceivers>\n\
    \        <parameter name=\"ServiceClass\" locked=\"false\">\n            MyService\n\
    \        </parameter>\n    </service>\n</serviceGroup>\n```\n"
  mdcn: "\n\n在异步类型调用的情况下，用户应用程序（例如 GUI）不会被阻塞，因此用户可以继续工作。Axis2 在异步中使用服务的方式如下图所示：\n\n\
    ![](img/e2fb05de168053e6227dab034eff9353_153_0.png)\n\n上图展示了典型的异步消息的工作方式，其中应用程序使用\
    \ Axis2 客户端并请求发送消息。调用 Axis2 客户端时，应用程序会创建一个回调对象并将其传递给调用。Axis2 使用该回调并将控制权返回给客户端。因此，客户端不会被阻塞。当回复到来时，Axis2\
    \ 客户端使用回调进行通知，通过这种方式，应用程序也会得知消息到达并据此采取行动。\n\n## 深入了解 Axis2 客户端 API\n\n在当今世界，人们不喜欢也不愿意浪费时间去完成一件简单的事情。因此，用户友好性是任何产品的关键考虑因素之一。在\
    \ Axis2 中，Axis2 客户端 API 的关键设计之一是提供异步 Web 服务调用支持。同时，Axis2 也非常注重用户友好性，将两者结合起来后，新的客户端\
    \ API 非常方便使用。为了让 Web 消费者或最终用户的工作更轻松，Axis2 客户端 API 由两个子 API 组成，分别称为 ServiceClient\
    \ 和 OperationClient，一个面向普通用户，另一个面向高级用户。\n\n## ServiceClient API\n\n如前所述，ServiceClient\
    \ 主要面向普通用户或刚进入 Web 服务领域的用户。尽管如此，它具有与服务交互的概念，并提供调用任何复杂类型 Web 服务所需的所有支持。让我们假设计算器是一个\
    \ Web 服务的示例，并进一步假设该服务具有诸如“add”、“deduct”、“multiply”和“divide”等操作。因此，服务客户端的想法是提供一个\
    \ API，以非常方便的方式调用这些操作中的任何一个。\n\n## 创建 ServiceClient 的可用选项\n\n创建 ServiceClient 实例有多种方式，当然我们可以选择最适合我们的构造函数。不管我们如何创建\
    \ ServiceClient，都需要有一个 Axis2 运行时（ConfigurationContext）来调用服务。配置上下文的实例要么由用户显式提供，要么由\
    \ Axis2 内部创建。\n\n前面我们讨论了 ConfigurationContext 以及如何创建它。因此，我们可以在创建 ServiceClient\
    \ 时使用这些技术来创建 ConfigurationContext，或者正如我们将看到的，我们可以创建 ServiceClient 时将 ConfigurationContext\
    \ 设为 null，让 Axis2 为我们创建 ConfigurationContext。\n\n### 类型 1：使用默认构造函数创建 ServiceClient\n\
    \n创建 ServiceClient 的最简单方法是使用其默认构造函数，如下所示。在这种情况下，它会使用 Axis2 默认配置文件创建一个 ConfigurationContext，该文件位于\
    \ Axis2 JAR 文件中。同时，它会创建一个匿名（虚拟服务）服务，其中包含三个操作（三个操作用于支持 WSDL 2.0 MEP）。即使我们以这种方式创建服务客户端，我们也可以使用创建的客户端来访问任何\
    \ Web 服务。\n\n```\nServiceClient serviceClient = new ServiceClient();\n```\n\n\
    当我们在 Axis2 系统内部尝试创建 serviceClient 时（例如，处理程序尝试创建 ServiceClient 来调用服务，或服务尝试调用其他服务），则它会使用服务器的\
    \ ConfigurationContext 创建。在这种情况下，服务器中的所有属性、传输和模块都可供 ServiceClient 使用，这种场景称为在服务器内部运行的客户端。\n\
    \n### 类型 2：使用自己的 ConfigurationContext 创建 ServiceClient\n\n当我们想要使用自己的配置数据创建 ServiceClient\
    \ 时，可以使用以下构造函数。如今我们已知，创建 ConfigurationContext 有多种方式。同时，在许多情况下，我们希望使用自己的 AxisService\
    \ 创建 ServiceClient，该服务可能已配置了自定义 QoS（服务质量）、参数、WS-Policy 等。\n\n```\nServiceClient\
    \ serviceClient =\n    new ServiceClient (configContext, axisService);\n```\n\n\
    在这种情况下，任一（或两者）参数都可以为 null。如果两者都为 null，则显然等同于 ServiceClient 的默认构造函数情况。如果 ConfigurationContext\
    \ 为 null，则根据您尝试创建 ServiceClient 的位置，将使用 Axis2 默认配置创建一个新的，或使用服务器的 ConfigurationContext。类似地，如果\
    \ AxisService 为 null，则会创建一个匿名服务。\n\n### 类型 3：创建动态客户端（即时客户端）\n\n动态客户端背后的想法是在运行时即时创建\
    \ ServiceClient，或为给定的 WSDL 创建客户端并使用创建的 ServiceClient 调用相应的服务。当我们以这种方式创建 ServiceClient\
    \ 时，对应的 AxisService 对象会根据 WSDL 文档进行配置。我们将在本章中段看到动态客户端的优势。创建动态客户端的构造函数如下所示：\n\n\
    ```\nServiceClient dynamicClient =new ServiceClient(\nconfigContext,wsdlURL, wsdlServiceName,\
    \ portName);\n```\n\n- configContext：configurationContext 可以为 null；如果为 null，则将应用选项\
    \ 2 中提到的逻辑。\n- wsdlURL：此参数不应为 null，因为它指定了 WSDL 文件的 URL。\n- wsdlServiceName：如你所知，WSDL\
    \ 文档可能包含多个 service 元素。因此，如果你想选择特定的 service 元素，可以传递该 service 元素的 QName。此参数的值可以为\
    \ null。如果为 null，则服务元素列表中的第一个将被视为服务元素。\n- portName ：如你所知，WSDL 文件中的 service 元素也可能包含多个端口。因此，如果你想选择特定的端口，可以将端口名称作为此参数的值传递。然后，如果该值为\
    \ null，则端口列表中的第一个将被选为端口。\n\n下面是一个示例 WSDL，用于理解提到的 service 元素是什么（端口也显示在这里）：\n\n\
    ```\n<wsdl:service name=\"MyService\">\n    <wsdl:port name=\"ServicePort1\" binding=\"\
    axis2:ServiceBinding1\">\n    <soap:address location=\"http://127.0.0.1:8080/axis2/services/\n\
    \                MyService\"/>\n    </wsdl:port>\n    <wsdl:port name=\"ServicePort2\"\
    \ binding=\"axis2: ServiceBinding2 \">\n```\n\n```\n<soap12:address location=\"\
    http://127.0.0.1:8080/axis2/services/MyService\"/>\n</wsdl:port>\n</wsdl:service>\n\
    ```\n\n## 带有工作示例的 ServiceClient\n\n现在我们知道了创建服务客户端的可用方法，但没有代码来解释这些就毫无意义。因此，理解 ServiceClient\
    \ API 的最佳方式是编写几个实际示例。但首先，我们需要启动 Axis2 服务器并在服务器中部署以下示例服务。只有在那之后，我们才能编写有用的客户端来调用该服务。我们可以通过以下步骤创建和部署服务：\n\
    \n- 1. 打开你喜欢的 IDE 并编写以下 Java 类或服务实现类。\n\n```\npublic class MyService {\n    //method\
    \ which has a return value\n    public String echo(String value) {\n        return\
    \ value;\n    }\n    // does not have a return value\n    public void update(int\
    \ value) {\n        System.out.println(\"value is :\" + value);\n    }\n}\n```\n\
    \n示例服务实现类有两个方法——一个有返回值，另一个没有。\n\n- 2. 为服务编写 services.xml 文件，你的 services.xml 将如下所示。参见参考部分了解\
    \ Axis2 部署。\n\n```\n<serviceGroup>\n    <service name=\"MyService\">\n       \
    \ <messageReceivers>\n            <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-only\"\
    \ class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"/>\n      \
    \      <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-out\" class=\"\
    org.apache.axis2.rpc.receivers.RPCMessageReceiver\"/>\n        </messageReceivers>\n\
    \        <parameter name=\"ServiceClass\" locked=\"false\">\n            MyService\n\
    \        </parameter>\n    </service>\n</serviceGroup>\n```\n\n"
