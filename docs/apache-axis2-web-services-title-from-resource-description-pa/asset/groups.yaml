    # Source distribution


    As the name implies, source distribution consist of the source code that is used
    to build binary distribution. As Apache Axis2 is released under Apache license,
    we can do anything with the source code. The idea is that the user can use Axis2
    and modify to suit their requirements. Additionally, if they think that a modification
    is useful for other people, they can submit a patch and ask the project community
    to merge the changes to the main source repository.


    When we develop a real application, it is always useful to have the source code
    around in addition to the documentation that helps to debug the application as
    well. In the meantime, source distribution consists of Maven scripts (http://maven.apache.org)
    and we can use them to create either binary distribution, WAR distribution, or
    even JAR distribution.


    # Document distribution


    The document distribution provides all the necessary resources to understand the
    different features and functionality in the project. It provides Java documentation
    and tutorials, explaining how to use different features,


    # JAR distribution


    One of the key steps of a web service is developing the Services and Clients.
    In that stage, we need to have access to the web service framework and their libraries.
    To access the APIs and other relevant resources, it is a common practice to add
    the required libraries into the Integrated Development Environment (IDE). Axis2
    JAR distribution provides a convenient way to download and embed Axis2 runtime
    into the IDE. You can download Axis2 library files separately from the following
    links, or you can get those from Axis2 binary or WAR distribution:


    ```

    http://people.apache.org/repo/m2-ibiblio-archived/org/apache/axis2/

    ```'
