    \ value of this property is the name of the annotated Java method.\n\n# action\n\
    \nThis property defines the action of this method's web service operation. It\
    \ defaults to \"\" (an empty string).\n\n# exclude\n\nThis property is used for\
    \ excluding certain methods from a web service. Such methods will not show up\
    \ as web service operations. The default value is false.\n\nLet us look at an\
    \ example where the WebMethod annotation is used along with some of its attributes.\
    \ In this example, the add method will be exposed as a web service operation with\
    \ the name addInt and the action will be set to urn:addInt. The print method will\
    \ not be exposed as a web service, as the exclude attribute of the WebMethod annotation\
    \ has been set to false.\n\n```\n@WebService\npublic class CalculatorImpl {\n\
