    \ base64 编码的字符串创建可优化的二进制内容节点，该字符串包含编码的二进制内容，并附带实际二进制表示的 MIME 类型。\n\n```java\n\
    String base64String = \"some_base64_encoded_string\";\nOMText binaryNode = fac.createOMText(base64String,\"\
    image/jpg\",true);\n```\n\n> Axis2 使用 javax.activation.DataHandler 来处理二进制数据。如果未启用\
    \ MTOM，所有优化的二进制内容节点都将序列化为 Base64 字符串。您还可以创建在任何情况下都不会被优化的二进制内容节点。它们将被序列化并作为 Base64\
    \ 字符串发送。\n\n```java\n//create an OMText node with the above DataHandler and set\
    \ \"optimized\" to false\n//This data will be sent as Base64 encoded strings regardless\
    \ of whether MTOM is enabled or not\n\njavax.activation.DataHandler dataHandler\
    \ = new javax.activation.DataHandler(new FileDataSource(\"SomeFile\"));\nOMText\
    \ textData = fac.createOMText(dataHandler, false);\nimage.addChild(textData);\n\
    ```\n\n## MTOM on the client side\n\n要在客户端启用 MTOM，您需要在发送消息时将 options 对象中的 enableMTOM\
    \ 属性设置为 True。\n\n```java\nServiceClient serviceClient = new ServiceClient();\n\
    Options options = new Options();\noptions.setTo(targetEPR);\noptions.setProperty(Constants.Configuration.ENABLE_MTOM,\
    \ Boolean.TRUE);\nserviceClient.setOptions(options);\n```\n\n当此属性设置为 True 时，任何\
    \ SOAP 信封，无论是否包含可优化内容，都将被序列化为 MTOM 优化的 MIME 消息。Axis2 将所有二进制内容节点序列化为 Base64 编码的字符串，无论它们是否符合优化条件。\n\
    \n以下代码演示了作为 Web 服务响应的获取二进制数据：\n\n```java\nServiceClient sender = new ServiceClient();\n\
    Options options = new Options();\noptions.setTo(targetEPR);\n// enabling MTOM\n\
    options.set(Constants.Configuration.ENABLE_MTOM, Boolean.TRUE);\nOMElement result\
    \ = sender.sendReceive(payload);\nOMElement ele = result.getFirstElement();\n\
    OMText binaryNode = (OMText) ele.getFirstOMChild();\n\n//Retrieving the DataHandler\
    \ & then do whatever processing required to the data\nDataHandler actualDH;\n\
    actualDH = binaryNode.getDataHandler();\n```\n\n> DataHandler 是在 Java 中访问和表示二进制数据的标准方法。用户可以通过提供文件位置来创建\
    \ DataHandler，然后 API 让我们可以读取和写入指定的文件。\n\n## MTOM on the service side\n\nAxis2\
    \ 服务器根据 content-type 自动识别传入的 MTOM 优化消息并相应地反序列化它们。用户可以为传出消息在服务器端启用 MTOM。\n\n要为所有服务全局启用\
    \ MTOM，用户可以在 axis2.xml 中将 enableMTOM 参数设置为 True。设置后，所有传出消息都将被序列化并作为 MTOM 优化的 MIME\
    \ 消息发送。如果未设置，所有二进制内容节点中的二进制数据都将被序列化为 Base64 编码的字符串。此配置可以在 services.xml 中按服务和按操作覆盖。\n\
    \n```xml\n<parameter name=\"enableMTOM\">true</parameter>\n```\n\n请注意，设置此参数后必须重新启动服务器（如果您在\
    \ axis2.xml 中设置了该参数）。\n\n您可以编写如下服务来执行二进制数据处理：\n\n```java\npublic class MTOMService\
    \ {\n    public void uploadFileUsingMTOM(OMElement element) throws Exception\n\
    \    {\n        OMText binaryNode = (OMText) (element.getFirstElement()).\n  \
    \      getFirstOMChild();\n```\n\n```java\nSimpleHTTPServer simpleServer = new\
    \ SimpleHTTPServer(configCtx, 8070);\nsimpleServer.start();\n```\n\n使用 URL 仓库时需要记住的一件事是，services\
    \ 目录必须有一个名为 services.list 的文件，列出所有服务归档文件。例如，如果您有名为 foo.aar 和 bar.aar 的服务，则 services.list\
    \ 将如下所示：\n\n```text\nfoo.aar\nbar.aar\n```\n\n同样，modules 目录应包含一个名为 modules.list\
    \ 的文件，列出所有模块。\n\n## Deploying Axis2 in various application servers\n\n正如我们在第 1\
    \ 章 Apache Web Services and Axis2 中讨论的那样，Axis2 以多种发行版的形式提供。应用程序服务器发行版是其中之一。您可以从\
    \ Axis2 网站下载 Axis2 应用程序服务器发行版或 WAR 发行版，或从二进制发行版构建它们。一旦获得 WAR 发行版，部署它只是将 WAR 文件复制到应用程序服务器的\
    \ webapps 目录的问题。在 Apache Tomcat 的情况下，它是 webapps 文件夹，而在 Sun Glassfish 的情况下，它是 autodeploy\
    \ 文件夹，等等。因此，根据应用程序服务器，您必须确定将 WAR 文件放置的正确位置。\n\n有些应用程序服务器会在永久或临时位置帮助解包 WAR 发行版。例如，Apache\
    \ Tomcat 会将 WAR 文件解包到永久位置。您可以在那里进行更改，并且当应用程序服务器重新启动时，所有这些更改都将可用。然而，有些应用程序服务器不会这样做。也有一些应用程序服务器根本不会解包\
    \ WAR 文件。即使在 Apache Tomcat 中，您也可以配置是否要解包。取决于应用程序服务器配置，热部署和热更新也会有所不同。例如，如果应用程序服务器不打算解包\
    \ WAR 文件，则根本没有热部署可用。\n\n"
