  mdcn: "\n\n当遍历一个 Axiom 对象时，你可以使用常规的树遍历方式：获取一个节点，查找其子节点，然后对每个子节点重复相同操作。值得注意的是，在 Axiom\
    \ 中你得到的不是列表，而是迭代器：其思想是通过迭代器来封装延迟构建。以下代码示例演示了如何访问子节点。子节点的类型为 `OMNode`，可以是 `OMText`\
    \ 或 `OMElement` 类型。\n\n```\nIterator childNodes = root.getChildren();\nwhile(childNodes.hasNext()){\n\
    \    OMNode node = (OMNode) childNodes.next();\n}\n```\n\n此方法展示了如何使用迭代器访问子节点列表；除此之外，一旦处理了某个特定元素，你还可以获取它的兄弟节点。此外，你可以分别使用\
    \ `nextSibling()` 和 `previousSibling()` 方法访问下一个兄弟节点和上一个兄弟节点。\n\n你还可以使用 `getChildrenWithName(QName)`\
    \ 方法只过滤一组节点（例如，具有特定名称的元素），`getChildrenWithName(QName)` 方法返回一个迭代器，其中包含所有具有给定 QName\
    \ 的子节点。\n\n## 序列化\n\n现在你已经对创建和遍历 Axiom 树有了很好的理解。因此，下一个最重要的部分是学习如何将 Axiom 对象模型序列化或写入到输出流中。\n\
    \nAxiom 既可以作为纯对象模型（例如一组 Java 对象）进行序列化，也可以作为拉式事件流（例如写入文件或任何其他输出流）进行序列化。序列化使用 `XMLStreamWriter`\
    \ 对象来写出输出，因此可以使用相同的序列化机制来写入不同类型的输出（例如文本、二进制等）。虽然本书未讨论，当前版本的 Axis2 使用了这一机制，并提供了多种不同的消息格式（例如\
    \ REST、JSON 等）。\n\n## 创建 SOAP 1.1 文档\n\n如下面的代码所示，首先创建一个 `book` 元素作为 SOAP 消息的正文，然后创建一个默认的\
    \ SOAP 1.1 信封，并将创建的 `book` 元素添加为正文：\n\n```\nOMFactory factory = OMAbstractFactory.getOMFactory();\n\
    \    OMNamespace axis2 = factory.createOMNamespace(\"axis2\", \"ns\");\n    OMElement\
    \ root = factory.createOMElement(\"book\", axis2);\n    OMAttribute type = factory.createOMAttribute(\"\
    type\",null,\"web-services\");\n    root.addAttribute(type);\n    OMElement name\
    \ = factory.createOMElement(\"name\", axis2);\n    OMElement isbn = factory.createOMElement(\"\
    isbn\", axis2);\n    root.addChild(name);\n    root.addChild(isbn);\n    SOAPFactory\
    \ soapFactory = OMAbstractFactory.getSOAP11Factory();\n    //get the default envelope\n\
    \    SOAPEnvelope env = soapFactory.getDefaultEnvelope();\n    //add the created\
    \ child\n    env.getBody().addChild(root);\n    System.out.println( env);\n```\n\
    \n如你所见，首先创建 `book` 元素作为 SOAP 消息的正文，然后创建默认的 SOAP 1.1 信封，并将创建的 `book` 元素添加为正文。\n\
    \n## 创建 SOAP 1.2 文档\n\n创建 SOAP 1.2 文档与前面的示例几乎相同，只是工厂不同；这里需要使用 1.2 工厂而不是 1.1 工厂：\n\
    \n```\nOMFactory factory = OMAbstractFactory.getOMFactory();\n    OMNamespace\
    \ axis2 = factory.createOMNamespace(\"axis2\", \"ns\");\n    OMElement root =\
