  - "[PAGE 188]\n\n# targetNamespace\n\nThis is the namespace of this operation parameter.\
    \ It is only used with document/literal wrapped bindings. The default value of\
    \ this property is the targetNamespace of the web service.\n\n# mode\n\nThis property\
    \ represents the parameter flow direction for this method. Possible values are\
