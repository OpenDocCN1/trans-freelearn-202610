    \ the wsimport tool that ships with the JDK. The example shows how the generated\
    \ classes can be used in the ProxyClient class. As you can see, unlike in the\
    \ case of the DispatchClient, the number of lines of code is much less, but you\
    \ have less control over what goes on underneath the hood:\n\n```\npackage org.apache.jaxwsclient;\n\
    \nimport org.apache.types.HelloService;\nimport org.apache.types.HelloServicePortType;\n\
    \npublic class ProxyClient {\n    public static void main(String[] args) {\n \
