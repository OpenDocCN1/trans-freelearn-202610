  - '[PAGE 83]


    The only way of changing a flow is by adding a handler(s) to a phase in the flow.
    Therefore, module engagement will cause a change to the handler chain dynamically.
    A module can be engaged dynamically (at runtime) or statically (at deployment
    time). If you want to engage a module statically, you need to specify it in the
    description files. If it is to be a service or to be an operation, then do so
    in `services.xml`. If it is to be engaged globally, then in `axis2.xml`.


    # Special handlers in the chain


    When you consider the execution chain, you can find four types of special handlers
    in the execution chain:


    +   - Transport receiver

    +   - Dispatcher(s)

    +   - Message receiver

    +   - Transport sender


    # Transport receiver


    Whenever a message comes into a system first, it will reach a transport receiver.
    A transport receiver can be considered as something that is waiting to accept
    an incoming message (in the case of the application server, a transport receiver
    could be `Servlet`). Therefore, `InFlow` of an execution chain always starts with
    the transport receiver.


    # Dispatchers


    As we discussed earlier, one of the fundamental goals of a SOAP processing framework
    is to deliver an incoming message to the targeted application. The process of
    finding the correct targeted application is called **dispatching**. In Axis2,
    dispatching will be taking place in the middle of the incoming execution chain.
    So, dispatchers are handlers in the chain. In Axis2, there are a number of ways
    to perform the dispatching:


    +   - Using transport headers and transport level data

    +   - Using WS-Addressing information

    +   - Using an incoming SOAP message'
