  mdcn: "\n\n## 创建序列而不发送消息\n\n在某些应用程序中，您需要在不向服务器发送任何应用程序消息的情况下启动序列。在这种情况下，可以使用以下 API。当您提出此要求时，Sandesha2\
    \ 将执行一次 Create Sequence 消息交换，并从服务器获取新的序列 ID。此方法将返回新建序列的 `sequenceKey` 值，可用于执行消息调用。此方法还有一个布尔参数，用于指示是否为响应端提供序列。\n\
    \n```\nString sequenceKey = SandeshaClient.createSequence (serviceClient, booleanOffer);\n\
    ```\n\n## 终止序列\n\n您可以使用以下代码终止序列；Sandesha2 将发送所需控制消息，并同时移除客户端和服务器端的会话：\n\n```\n\
    SandeshaClient.terminateSequence (serviceClient);\n```\n\n> Sandesha2 还提供了许多其他功能，可用于配置并实现更好的定制；不过我们不在这里讨论。建议您参阅在线文档以更好地理解这些功能。\n\
    \n## 保护 Web 服务安全\n\n在上一节中，我们讨论了如何为服务添加可靠性。在本节中，我们将讨论如何为服务提供安全性。在 Axis2 中，我们使用\
    \ Apache Rampart 来提供安全支持。\n\n下载最新版本的 Apache Rampart 并解压。将 `rampart-version.mar`\
    \ 文件复制到 `AXIS2_HOME` 目录的模块目录中。接下来，将解压后的其他 JAR 文件复制到 `lib` 目录（例如 `TOMCAT_HOME/axis2/WEB-INF/lib`）。然后，重启\
    \ Axis2，登录管理控制台并启用 Rampart 模块。几秒钟后，如果在已启用模块下看到 Rampart 模块，说明您已成功为 Web 服务框架添加了安全支持。\n\
    \n前面的代码片段包含我们将用于此示例的密码回调类。如您所见，我们已硬编码了密码；但在编写复杂的回调类时，您可以检索逻辑并设置正确的密码。\n\n## 创建策略元素\n\
    \nRampart 在服务器端和客户端均使用基于策略的配置。因此，要配置服务，我们需要提供所需的 WS-Policy 配置。这里我们不详细讨论 WS-Policy，只提供服务所需的策略配置，如下代码片段所示：\n\
    \n```\n<wsp:Policy wsu:Id=\"UsernameTokenOverHTTPS\"\n    xmlns:wsu=\"http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wsssecurity-utility-1.0.xsd\"\
    \n    xmlns:wsp=\"http://schemas.xmlsoap.org/ws/2004/09/policy\">\n    <wsp:ExactlyOne>\n\
    \        <wsp:All>\n            <sp:TransportBinding\n            xmlns:sp=\"\
    http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\">\n                <wsp:Policy>\n\
    \                    <sp:TransportToken>\n                        <wsp:Policy>\n\
    \                            <sp:HttpsToken\n                            </wsp:Policy>\n\
    \                        </sp:TransportToken>\n                        <sp:AlgorithmSuite>\n\
    \                            <wsp:Policy>\n                                <sp:Basic256/>\n\
    \                            </wsp:Policy>\n                        </sp:AlgorithmSuite>\n\
    \                        <sp:Layout>\n                            <wsp:Policy>\n\
    \                                <sp:Lax/>\n                            </wsp:Policy>\n\
    \                        </sp:Layout>\n                        <sp:IncludeTimestamp/>\n\
    \                    </wsp:Policy>\n                </sp:TransportBinding>\n \
    \               <sp:SignedSupportingTokens xmlns:sp=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy\"\
    >\n                    <wsp:Policy>\n                        <sp:UsernameToken\
    \ sp:IncludeToken=\"http://schemas.xmlsoap.org/ws/2005/07/securitypolicy/IncludeToken/AlwaysToRecipient\"\
    \ />\n                    </wsp:Policy>\n                </sp:SignedSupportingTokens>\n\
    ```\n\n```\n<ramp:RampartConfig xmlns:ramp=\"http://ws.apache.org/rampart/policy\"\
    >\n    <ramp:passwordCallbackClass>PWCallbackHandler</ramp:passwordCallbackClass>\n\
    </ramp:RampartConfig>\n</wsp:All>\n</wsp:ExactlyOne>\n</wsp:Policy>\n```\n\n如果您熟悉\
    \ WS-Security 和 WS-Policy，可以看出它包含两个主要安全断言：传输绑定断言和签名支持令牌断言。传输绑定断言定义了使用基于 HTTPS\
    \ 传输令牌断言的 SSL 传输要求。签名支持令牌定义了对用户名令牌的要求，该令牌应在传输层受到完整性保护。\n\n现在万事俱备。接下来，我们需要使用以下代码为示例服务创建\
    \ `services.xml` 文件：\n\n```\n<service>\n    <module ref=\"rampart\"/>\n    <parameter\
    \ name=\"ServiceClass\">SecureService</parameter>\n    <messageReceivers>\n  \
    \      <messageReceiver mep=\"http://www.w3.org/2004/08/wsdl/in-out\" class=\"\
    org.apache.axis2.rpc.receivers.RPCMessageReceiver\"/>\n        <messageReceiver\
    \ mep=\"http://www.w3.org/2004/08/wsdl/in-only\" class=\"org.apache.axis2.rpc.receivers.RPCInOnlyMessageReceiver\"\
    />\n    </messageReceivers>\n    <wsp:Policy wsu:Id=\"UsernameTokenOverHTTPS\"\
    \ xmlns:wsu=\"http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wssecurity-utility-1.0.xsd\"\
    \ xmlns:wsp=\"http://schemas.xmlsoap.org/ws/2004/09/policy\">\n    </wsp:Policy>\n\
    </service>\n```\n\n现在，编译服务类和回调对象，并使用上述 `services.xml` 文件创建服务归档文件。您可以登录 Web 管理控制台验证服务部署。如果正确遵循上述步骤，应该一切正常。\n\
