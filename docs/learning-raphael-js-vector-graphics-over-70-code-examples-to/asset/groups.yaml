  - "[PAGE 70]\n\n# # The drag-and-drop functionality\n\nThe drag-and-drop functionality\
    \ is a powerful feature of Raphaël. In particular, we are offered a good deal\
    \ of control over drag events, which affords us the ability to create more usable\
    \ applications.\n\n# # The Element.drag() method\n\nThe drag method of an element\
    \ has the following syntax:\n\n```\nElement.drag(\n    onmove, onstart, onend,\
    \ [mcontext], [scontext], [econtext]\n)\n```\n\nThe onmove, onstart, and onend\
    \ functions are callback functions invoked during the life cycle of a dragged\
    \ element, while mcontext, scontext, and econtext define the this variable in\
    \ the scope of these functions (defaulting to the element that is being dragged).\n\
    \n# # The onstart event handler\n\nThe onstart event handler is called when element\
    \ dragging is first initiated. It is usually used as an initializer to mark the\
    \ start x and y points of the element that we are modifying.\n\n# # The onend\
    \ event handler\n\nThe onend event handler is called when element dragging finishes,\
    \ for example, when the mouse is released after moving an element from one point\
    \ to another. It is commonly used to:\n\n+   - Reinitialize an element after dragging\n\
    +   - Check the current position of an element in our drawing context\n+   - Define\
    \ any other actions that should occur subsequent to a drag-and-drop\n\n# # The\
    \ onmove event handler\n\nThe onmove event handler is called every time an element\
    \ is moved during dragging. It has the parameters dx and dy that describe the\
    \ amount by which the element has been dragged in x and y respectively."
  - "[PAGE 71]\n\n# # Dragging by example\n\nConsider for example dragging a square.\
    \ We first define our element and keep a reference to its start _x_ and _y_ positions\
    \ in the `onstart` event handler. To highlight that our element is in a \"drag\"\
    \ state, we also paint it pink. In our `onend` event handler, we reset the fill\
    \ to be black to indicate that dragging has finished:\n\n```\n```\nvar startX,\
    \ startY;\nfunction onstart() {\n    startX = this.attr('x');\n    startY = this.attr('y');\n\
    \    this.attr('fill', 'pink');\n}\n```\n```\n\n```\n```\nfunction onend() {\n\
    \    this.attr('fill', '#000');\n}\n```\n```\n\nOur `onmove` event handler is\
    \ responsible for setting the _x_ and _y_ positions of the element based on the\
    \ original _x_ and _y_ positions plus `dx` and `dy` as follows:\n\n```\n```\n\
    function onmove(dx, dy) {\n    this.attr({\n        x: startX + dx,\n        y:\
    \ startY + dy\n    });\n}\n```\n```\n\nFinally, we invoke drag on our element,\
    \ passing in the individual event handlers:\n\n```\n```\nsquare.drag(onmove, onstart,\
    \ onend);\n```\n```\n\nThe resultant transformation is demoed in the sample code\
    \ accompanying this chapter.\n\n> > Note that `dx` and `dy` are commonly used\
    \ in mathematics to refer to small changes in _x_ and _y_. Every time that the\
    \ `onmove` event handler is called, its `dx` and `dy` parameters will have values\
    \ representing a small change in each direction."
  - "[PAGE 72]\n\n# # Dropping elements\n\nAt the end of dragging an element, we can\
    \ perform checks to see where it has\nended up relative to other elements. A **drop**\
    \ is essentially a check to see whether\nour element falls within some particular\
    \ set of bounds.\n\n# # Bounding box overlapping\n\nEvery element has a bounding\
    \ box that defines the smallest rectangular region\ncontaining all points of an\
    \ element. By checking to see whether two bounding boxes\noverlap we can determine\
    \ whether or not an element was \"dropped\" on to another.\n\nConsider defining\
    \ a target rectangle alongside our square:\n\n```\n```\nvar target = paper.rect(400,\
    \ 100, 200, 200);\nvar square = paper.rect(100, 100, 100, 100);\n```\n```\n\n\
    Our `onstart` and `onmove` event handlers are defined as per the example in the\n\
    previous section and are responsible for initialization and movement respectively.\n\
    \nThis time, in our `onend` event handler, we get the bounding boxes of each of\
    \ our\nsquare and target element using the `getBBox` method and then check whether\
    \ or\nnot the elements overlap using `isBBoxIntersect`:\n\n```\n```\nfunction\
    \ onend() {\n    var bbox = this.getBBox(),\n        targetBBox = target.getBBox();\n\
    \n    if(Raphael.isBBoxIntersect(bbox, targetBBox)) {\n        this.undrag();\n\
    \        this.attr({\n            x: 450,\n            y: 150\n        });\n \
    \   }\n}\n```\n```\n\nWhen the elements do overlap, we remove all `drag` event\
    \ handlers on the element by\ninvoking `undrag` and setting its `x` and `y` positions\
    \ to some arbitrary values that fall\nwithin the bounding box of our target."
  - "[PAGE 73]\n\n# # Bounding box inside bounding box\n\nWhile the `isBBoxIntersect`\
    \ method is convenient, we sometimes need to know whether or not all points on\
    \ an element are inside another. Going back to the previous example, we could\
    \ check to see whether the top-left vertex and bottom-right vertex of our square's\
    \ bounding box fall within the target bounding box using the `isPointInsideBBox`\
    \ method like so:\n\n```\n```javascript\nfunction onend() {\n    var targetBBox\
    \ = target.getBBox();\n    var topLeftVertex = {\n        x: this.attr('x'),\n\
    \        y: this.attr('y')\n    };\n    var bottomRightVertex = {\n        x:\
    \ this.attr('x') + this.attr('width'),\n        y: this.attr('y') + this.attr('height')\n\
    \    };\n\n    var point1InsideBox = Raphael.isPointInsideBBox(\n        targetBBox,\
    \ topLeftVertex.x, topLeftVertex.y\n    );\n    var point2InsideBox = Raphael.isPointInsideBBox(\n\
    \        targetBBox, bottomRightVertex.x, bottomRightVertex.y\n    );\n    if(point1InsideBox\
    \ && point2InsideBox) {\n        this.undrag();\n        this.attr({ x: 450, y:\
    \ 150 });\n    }\n}\n```\n```\n\nThe top-left vertex of the square is defined\
    \ by its x and y attribute while the bottom-right vertex is described by the (x,\
    \ y) point plus the width and height of the element. Only when both points lie\
    \ within the bounding box of our target do we uninitialize the `drag` event handling.\n\
    \nThis approach works really well for target elements whose overall shape is defined\
    \ accurately by a rectangular bounding box. In those cases where a shape is not\
    \ defined particularly well by a rectangular bounding box, a more suitable mathematical\
    \ approach would be sought."
  - '[PAGE 74]


    # # Summary


    In this chapter we have covered a lot of ground relating to both event handling
    and transformations. You should be familiar with some of the ways that we are
    able to interact with our drawings and transform them at will.


    We are in a prime position now to look at truly bringing our drawings to life
    by animating them and will do so in the next chapter.'
  - '[PAGE 75]


    # # Vector Animation


    Till now we have looked at drawing static graphics and interacting with and transforming
    them instantaneously. Animation affords us the ability to change graphics with
    regard to time, that is, we can modify the attributes of a vector graphic over
    some non-zero time interval.


    Prior to the emergence of the JavaScript frameworks of the early 2000s, animation
    was largely achieved by Flash and to a lesser extent by Java applets. With the
    advent of these frameworks, animation of the DOM lead to slicker and more intuitive
    user interfaces and more semantic websites. In more recent years, HTML5, CSS3,
    WebGL, and SVG afford developers the ability to create more complex, fully fledged
    animations and interactive user interfaces.


    Raphaël makes animating vector graphics straightforward and in the course of this
    chapter we look at some of the different ways you can animate graphics using the
    library. We will be covering the following topics in particular:


    +   - Animating method and basic attribute animation

    +   - Animating paths

    +   - Easing using the cubic Bézier syntax

    +   - Animating transformations

    +   - Animation using custom attributes and animation along a path'
  - "[PAGE 76]\n\n# # Basic animation\n\nAnimation is accomplished using the `animate`\
    \ method of an element. The method\ntakes the following parameters in the order\
    \ that they’re defined:\n\n| Parameter | Type | Description |\n|---|---|---|\n\
    | attributes | Object | Key-value pair attributes as per the `Element`. `attr()`\
    \ method |\n| duration | Number | The number of milliseconds that the duration\
    \ should last for |\n| easing (optional) | String | A string describing the rate\
    \ of change of an attribute with regard to time |\n| callback (optional) | Function\
    \ | A function that is executed at the point at which the animation ends |\n\n\
    To demonstrate animation, consider a circle whose center point is at (100, 100)\
    \ with\nradius 50px:\n\n```\n```\nvar circle = paper.circle(100, 100, 50).attr({fill:\
    \ 'green'});\n```\n```\n\nWe could animate the circle to a point (500, 100) and\
    \ a reduced radius of 15px\nas follows:\n\n```\n```\ncircle.animate({\n cx: 500,\n\
    \ r: 15\n }, 1000);\n```\n```\n\nThe circle is animated over a period of a second\
    \ and its initial and final states are\nshown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_76_0.png)\n\
    \n> > To really appreciate the examples given in this chapter you should make\n\
    > recourse to the source code demos or site accompanying this book.\n\n[ 66 ]"
