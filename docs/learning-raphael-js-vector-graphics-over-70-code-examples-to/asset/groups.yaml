    \ the anchor points on the circle. The leftmost point is used to control the width\
    \ of the circle, the topmost point controls the height while the rightmost point\
    \ is used to change the end point. Click-and-drag on the rightmost breakpoint:\
    \ dragging inside the circle draws a straight line from the end point to the start\
    \ point while dragging outside creates a segment.\n\n## Working with Existing\
    \ SVGs\n\nThe result of dragging outside of the circle by an angle of a few degrees\
    \ is shown in the following screenshot:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_94_0.png)\n\
    \nFor our web-based projects, the document size is usually going to be that defined\
    \ by the constituent objects. Click on **File | Document Properties | Page** and\
    \ then expand the **Resize** page to a content drop-down menu. Here you can define\
    \ custom widths and heights for the document. Clicking on **Resize page to drawing\
    \ or selection** will resize the page and the dimensions of the selected element\
    \ (or all drawn elements if none is selected).\n\nWhat this actually does is it\
    \ applies a translation to all elements on the current layers, that is, the paths\
    \ are drawn and then a transformation is applied. If we want all paths to be drawn\
    \ relative to the \"new\" origin point (which is usually the case) the following\
