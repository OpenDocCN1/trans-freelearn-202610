    \ https://commons.wikimedia.org/wiki/File:World_population_density_map.PNG 和 https://en.wikipedia.org/wiki/File:ElectoralCollege2012.svg\
    \ 的 Wikimedia Commons 图片编译而成，展示了制图学（左）和数据可视化（右）的应用：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_102_0.png)\n\
    \n## 创建栅格地图\n\n通常，当你需要将数据与某个地理区域或地区关联时，最佳方法是利用现有的 SVG 格式地图，然后根据你的需求进行定制（手动修改原始\
    \ XML 或使用 Inkscape 等图形编辑器）。为了演示，我们将使用来自 http://en.wikipedia.org/wiki/File:England_Regions_within_UK.svg\
    \ 的英国现有地图。\n\n如果你下载此地图并在 XML 编辑器中打开，你会发现英格兰的区被定义为带有 ID 的单个 `<path>` 元素（例如，`<path\
    \ id=\"London\">` 代表伦敦地区，而 `<path id=\"north-west\">` 描绘整个西北英格兰地区）。Ready Set Raphael\
    \ 处理此问题非常出色，因为它为每个带有 ID 的路径定义了变量：\n\n```javascript\nvar london = rsr.path(...);\n\
    var northwest = rsr.path(...);\n```\n\n你可以使用 Ready Set Raphael 转换器转换上述图像，并将生成的\
    \ JavaScript 导入 HTML 文档。运行此代码时，你会发现转换器在保持路径及其关联属性方面做得非常好。\n\n英格兰共有九个官方区域（行政区划），它们都绘制在生成的地图上。这些地区的人口如下，表中显示了\
    \ Ready Set Raphael 创建的相应变量名：\n\n| 区域 | 变量名 | 人口 |\n|---|---|---|\n| 西北英格兰 | northwest\
    \ | 7,052,000 |\n| 东北英格兰 | northeast | 2,597,000 |\n| 约克郡和亨伯 | yorkshireandhumber\
    \ | 5,284,000 |\n| 西密德兰兹 | westmidlands | 5,602,000 |\n| 东密德兰兹 | eastmidlands\
    \ | 4,533,000 |\n| 英格兰东部 | eastengland | 5,847,000 |\n| 伦敦 | london | 8,174,000\
    \ |\n| 东南英格兰 | southeast | 8,635,000 |\n| 西南英格兰 | southwest | 5,289,000 |\n\n\
    所有人口总和为 53,013,000。\n\n在 Ready Set Raphael 创建的代码末尾，我们定义了一个对象数组，将 `path` 属性与表中列出的路径变量及其关联人口相关联。这种合理化很有用，因为它允许我们将地区人口与定义的路径关联起来：\n\
    \n```javascript\nvar data = [\n {\n   path: northwest,\n   population: 7052000\n\
    \ },\n {\n   path: northeast,\n   population: 2597000\n },\n // ... and so on\
    \ ...\n];\n```\n\n## 使用现有 SVG\n\n现在，为了可视化不同的人口，我们定义了一个名为 shading 的自定义属性，该属性基于\
    \ 0 色相和 0 饱和度返回填充，其中只有亮度变化。这将根据人口大小对国家进行着色：\n\n```javascript\nrsr.customAttributes.shading\
    \ = function(population, min, max, total) {\n    var brightness = 1 - ((population\
    \ - min) / (max - min));\n    return {\n        fill: 'hsb(0, 0, ' + brightness\
    \ + ')'\n    };\n};\n```\n\n亮度定义如下：\n\nbrightness = 1 - \\(\\frac{population -\
    \ smallest population}{largest population - smallest population}\\)\n\n该方程根据最大和最小人口大小对亮度进行归一化。当人口大小等于最大人口时，亮度将为零（黑色）；当人口大小等于最小人口时，亮度将等于\
    \ 1（白色）。人口的所有其他值都返回 0 到 1 之间的值（灰色阴影）。\n\n我们通过遍历定义绘制路径及其关联人口的数据数组来利用此属性：\n\n```javascript\n\
    var totalPopulations = 530130000;\nvar minPopulation = 25970000;\nvar maxPopulation\
    \ = 86350000;\nfor(var i = 0, ii = data.length; i < ii; i+=1) {\n    var path\
    \ = data[i].path;\n    var population = data[i].population;\n    path.attr({\n\
    \        shading: [population, minPopulation, maxPopulation,\n        totalPopulations]\n\
    \    });\n}\n```\n\n每个地区的人口，以及总人口、最大人口和最小人口，都会传递给我们的自定义属性，进而相应地填充区域。此操作的结果如下图所示：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_105_0.png)\n\n你可以看到，东北地区（人口最少）被涂成白色，而东南地区（人口最多）被涂成黑色。\n\
    \n伦敦的人口规模几乎与该国东南地区的人口规模一样大，这很不幸，因为这使得无法区分伦敦地区和东南地区。在这种情况下，可以通过在遍历数据数组时为每个区域应用较浅颜色的描边来解决：\n\
    \n```javascript\npath.attr({\n    shading: [population, minPopulation, maxPopulation,\n\
    \    totalPopulations],\n    'stroke': '#bbb'\n});\n```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_105_1.png)\n\
    \n## 开源 SVG\n\nOpen Clip Art Library (http://openclipart.org) 上有许多可用的 SVG。该网站拥有一个出色的\
    \ SVG 编辑器，允许你即时编辑托管的 SVG 并查看其底层源代码或下载它们。\n\n## 摘要\n\n你现在应该能够在 Raphaël 驱动的项目中熟练使用现有\
    \ SVG。你应该对 Inkscape 有基本了解，并能够使用它创建基本 SVG 并检查图形的 XML 结构。正如我们对栅格地图的介绍所显示的，在线 SVG\
    \ 转 Raphaël 转换器非常宝贵，你现在应该能够处理更复杂的图形，其特性为我们向最终用户提供的内容提供了额外的可能性。\n\n## 创建社交媒体可视化套件\n\
    \n我们现在已经介绍了 Raphaël JavaScript 库的所有主要方面，在本章中，我们将探讨基于社交媒体统计数据创建数据可视化演示。\n\n近年来，数据可视化真正兴起。随着我们试图理解并传达可用的海量数据，在线信息图表和数据相关展示的数量继续增长。话虽如此，现有的许多优秀示例都是\
    \ _静态_ 的，利用矢量绘图库创建动态和交互式数据可视化有很大的空间，这使得 Raphaël 库成为一种非常真实且有效的应用。\n\n在本章中，我们将探讨：\n\
    \n- 创建社交网络使用统计数据可视化\n- 创建显示推文数量随时间变化的动态环形图\n- 讨论 Raphaël 库的未来\n\n### 社交网络使用\n\n\
    人们可以通过计算机网络进行通信和交互的想法可以追溯到，嗯，万维网之前（第一封网络电子邮件发送于 1971 年），但真正在过去十年左右，我们开始看到社交网络的广泛且确实巨大的使用。Facebook\
    \ 目前是世界上最大的社交网络，拥有十亿注册用户，而 Twitter 和 Google+ 等平台各拥有近五亿用户。\n\n"
