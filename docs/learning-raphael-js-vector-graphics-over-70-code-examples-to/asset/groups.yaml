    # # Embedding custom fonts


    The font converter and renderer Cufón has been superseded by @font-face for

    general web font rendering. However, fonts generated by Cufón have fully defined

    paths and integrate seamlessly with Raphaël meaning that we can manipulate such

    fonts in many of the same ways that we would for shapes. A demo of this can be
    seen

    at http://raphaeljsvectorgraphics.com/the-graphical-web/custom-fonts.


    Cufón supports generating custom fonts from **TrueType (TTF), OpenType (OTF),

    Printer Font Binary (PFB) and PostScript** font files. To generate a custom font

    using Cufón, go to http://cufon.shoqolate.com/generate/ and fill in the font

    generator form. Ensure that you enter Raphael.registerFont in the textbox

    (or click on the small Raphaël logo next to it) under the heading **Customization

    (for 3rd-party scripts only)** as shown in the following screenshot:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_39_0.png)


    Your generated font will be a JavaScript file. You should include this in your
    HTML

    document just after the Raphaël library, that is, as follows:


    `<script type="text/javascript" src="raphael.min.js"></script>

    <script type="text/javascript" src="MyFont.font.js"></script>`


    In order to use the font in your canvas, you will use the print method

    (http://raphaeljs.com/reference.html#Paper.print). Consider,

    for example, embedding a font named Pacifico.font.js:


    `<script type="text/javascript" src="Pacifico.font.js"></script>`'
