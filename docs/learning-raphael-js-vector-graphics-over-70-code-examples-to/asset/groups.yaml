    \n## 总结\n\n在本章中，我们在特定绘图区域或画布的背景下介绍了 Raphaël 中的许多基本绘图和绘画示例。您现在应该能够使用该库绘制基本矢量图形，并探索\
    \ http://raphaeljs.com 上的文档。\n\n在下一章中，我们将探讨使用路径绘制更复杂的元素。\n\n## 3 绘制路径\n\n绘制和操作路径的能力是\
    \ Raphaël 的一项非常强大的功能。在上一章中，我们根据路径的几何属性（如宽度、高度和半径）绘制了基本形状。路径允许我们通过定义由线条、弧线和曲线连接的点来绘制各种形状，这些点代表形状本身的轮廓。\n\
    \n路径（如基本形状）是 _元素_，这意味着用户交互、绘制、变换和动画都可以应用于路径。Raphaël 提供了许多用于绘制和操作路径的方法，因此这将是本书其余部分的重点。\n\
    \n绘制路径的语法由 SVG 规范定义。理解此语法对于创建复杂形状至关重要，在本章过程中，我们将对其非常熟悉。\n\n为了让您了解可以使用路径实现什么，`http://raphaeljs.com/chart.html`\
    \ 上的演示将向您展示如何使用平滑曲线连接数据点，这在图表应用程序中很常见。确实，复杂的 SVG 插图（例如，使用 Adobe Illustrator 或\
    \ Inkscape 等图形包创建的插图）由许多路径组成，一个有趣的演示可以在 `http://raphaeljs.com/tiger.html` 上查看。\n\
    \n本章对路径的覆盖非常全面，因此建议您在每节结束时停下来回顾和实验所涵盖的概念。在本章中，我们将探讨以下主题：\n\n- 路径绘制背后的概念\n- moveto、lineto\
    \ 和 closepath 命令\n- 绘制二次和三次贝塞尔曲线\n- 弧线绘制命令\n- Raphaël 中用于处理路径的实用方法\n- 由数据插值示例的\
    \ Catmull-Rom 曲线\n\n## 路径绘制概念\n\n在纸上用笔绘制的过程可以分解为以下步骤：\n\n1. 您将笔放在纸上的某个特定点上。\n\
