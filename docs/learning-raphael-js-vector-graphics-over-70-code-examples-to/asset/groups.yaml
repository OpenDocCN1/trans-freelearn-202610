    # # The subtend custom attribute


    The extent to which an arc is curved, or _subtended_, is dependent upon the time
    elapsed

    during an animation. Initially, the arc subtends a sector of zero length, gradually

    increasing in length until the angle subtended by the arc reaches 360 degrees.


    To achieve this, we define a custom attribute named `subtend` that returns a path

    based on the angle of the arc at a particular time and its innate center-_x_,
    center-_y_, and

    radius attributes. The _x_ and _y_ coordinates of a curve''s end point vary sinusoidally

    with regard to the angle subtended by it, meaning we can define a path that arcs

    from our start point (the center point in _x_ and the center point in _y_ minus
    the radius)

    as follows:


    ```

    paper.customAttributes.subtend = function(angle, cx, cy, r) {

    var x = cx + r * Math.cos(Raphael.rad(90 - angle));

    var y = cy - r * Math.sin(Raphael.rad(90 - angle));

    var path = [

    ''M'', cx, cy - r,

    ''A'', r, r, 0, +(angle > 180), 1, x, y

    ];

    return {

    path: path

    };

    };

    ```


    Note the subpath definition `''A'', r, r, 0, +(angle > 180), 1, x, y` describes

    an arc whose radius is fixed at `r` and whose large arc flag is 0 for when the
    subtended

    angle is less than or equal to 180 degrees (where we want to draw the smaller
    of the

    available arcs) and 1 when the angle is greater than 180 degrees (when we want
    to

    draw the larger arc).'
  - "[PAGE 116]\n\n# # The counts custom attribute\n\nOur visualization will display\
    \ the number of tweets as text based on the proportion (expressed as a factor\
    \ between 0 and 1) of the animation that has passed and the total tweets for that\
    \ timer. We define the counts custom attribute to return this ratio of time elapsed\
    \ to total tweets as text as follows:\n\n```\n```\npaper.customAttributes.counts\
    \ = function(ratio, total) {\n    return {\n        text: Math.round(ratio * total)\n\
    \    };\n};\n```\n```\n\n# # Updating the timer\n\nWhen the animation of a timer\
    \ initially begins, or is reset after traversing a full 360 degrees (the length\
    \ of one animation), we run an update method that is responsible for setting the\
    \ \"start\" values of our arc. The arc starts at 0 degrees and is given a 20px\
    \ stroke that gives it the arcing clock effect:\n\n```\n```\nfunction update(i)\
    \ {\n    // Get properties from our timers data array\n    var cx = timers[i].cx,\
    \ cy = timers[i].cy,\n        radius = timers[i].r, interval = timers[i].interval;\n\
    \n    // Draw a new path for this particular timer\n    paths[i] = paper.path().attr({\n\
    \        subend: [0, cx, cy, radius],\n        'stroke-width': 20,\n        stroke:\
    \ '#009ec4'\n    });\n\n    animate(i, cx, cy, radius, timers[i].interval);\n\
    }\n```\n```\n\nThe helper method animate is called at the end of this function\
    \ in order to initialize our animation from 0 degrees to 360 degrees. Note that\
    \ our paths are stored in the paths array so that we can refer to them by their\
    \ index later."
  - "[PAGE 117]\n\n# # The animate helper method\n\nThe purpose of the `animate` function\
    \ is to animate:\n\n+   - The arc from its initial arc path to the final arc path\n\
    +   - The number of tweets counted over the time interval elapsed\n\nIn the code\
    \ given here, we animate our arc to subtend 360 degrees and our text counts as\
    \ a proportion of the total number of tweets:\n\n```\n```\nfunction animate(i,\
    \ cx, cy, r, interval) {\n    // Animate the path\n    paths[i].animate({\n  \
    \      subtend: [360, cx, cy, r]\n    }, interval, function() {\n        paths[i].remove();\n\
    \        setTimeout(function() {\n            update(i);\n        });\n    });\n\
    \    // Animate the counts\n    counts[i].animate({\n        counts: [1, timers[i].total]\n\
    \    }, interval, function() {\n        counts[i].attr({\n            'counts':\
    \ [0, timers[i].total]\n        });\n    });\n}\n```\n```\n\nThe `animate` method\
    \ is run over the duration specified in our `timers` array based on the index\
    \ of that timer passed as the first parameter. Note that when the animation of\
    \ the arc is complete, we run the `update` function again to restart the whole\
    \ process. Likewise, the `counts` text is reset to 0."
