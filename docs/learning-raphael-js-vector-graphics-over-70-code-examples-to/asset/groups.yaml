    \nThe following diagram describes a minor arc (large-arc-flag = 0) drawn in a\
    \ counterclockwise direction:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_56_0.png)\n\
    \n## Utility methods for working with paths\n\nRaphaël provides a number of convenient\
    \ utility methods for working with paths. We will demonstrate these methods by\
    \ example.\n\n## Element.getTotalLength()\n\nBy combining a major arc and a cubic\
    \ Bézier curve, we can draw a bowling pin shape as follows:\n\n```\nvar pin =\
    \ paper.path({\n 'M', 130, 350,\n 'A', 100, 180, 0, 1, 0, 210, 350,\n 'C', 290,\
    \ 100, 50, 100, 130, 350,\n 'z'\n});\n```\n\nThis path starts at (130, 350), arcs\
    \ to (210, 350), and then curves back to the start point with Bézier control points\
    \ (290,100) and (50, 100). We get the total length of the path using the getTotalLength\
    \ method. We retrieve this value and then display it to two decimal places on\
    \ our canvas as follows:\n\n```\nvar totalLength = pin.getTotalLength();\npaper.text(\n\
    \ 180, 50,\n \"Total Length: \" + totalLength.toPrecision(2)\n);\n```\n\n"
  mdcn: "\n\n有两个二次贝塞尔曲线命令，其语法如下：\n\n| 命令 | 参数 | 示例 |\n|---------|------------|---------|\n\
    | Q 或 q | (x1, y1, x, y)+ | Q 100 50 200 250 |\n| T 或 t | (x y)+ | T 400 250 |\n\
    \nq 命令（或用于相对点的 q）描述从路径上的当前点到点 (x, y) 并使用 (x1, y1) 作为控制点绘制的曲线。例如，请考虑以下代码：\n\n```\n\
    paper.path(['M', 50, 150, 'Q', 225, 20, 400, 150]);\n```\n\n这将绘制所示的二次贝塞尔曲线。使用命令小写形式的等效路径为\
    \ \"M 50,150 q 175,-130 350,0\"，其中 (x, y) 和 (x1, y1) 参数是相对于起点 (50, 100) 的相对距离：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_49_0.png)\n\n移动控制点会影响路径的绘制方式。例如，路径\
    \ \"M 50, 150 Q 100,40 400,150\" 显示为：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_49_1.png)\n\
    \n## 绘制路径\n\n与我们迄今遇到的其他命令一样，参数可以重复，这使我们可以绘制多个连接的二次贝塞尔曲线。请考虑以下代码：\n\n```\npaper.path([\n\
    \t'M', 50, 150\n\t'Q', 225, 20, 400, 150,\n\t575, 20, 750, 150\n]);\n```\n\n这将从\
    \ (400, 150) 绘制第二条曲线到点 (750, 150)，控制点位于 (575, 20)：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_50_0.png)\n\
    \n`T` 或 `t` 命令是一种简写，不指定控制点坐标。相反，控制点自动确定为前一个控制点的反射。请考虑以下代码绘制的路径：\n\n```\npaper.path([\n\
    \t'M', 50, 150,\n\t'Q', 225, 20, 400, 150,\n\t'T', 750, 150\n]);\n```\n\n这将创建如下截图所示的两条曲线。由\
    \ `T` 绘制的路径起点处的当前点为 (400, 150)。相对于此点，前一个控制点 (225, 20) 的反射为 (575, 280)：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_51_0.png)\n\
    \n## 三次贝塞尔曲线\n\n绘制三次贝塞尔曲线的原理与二次贝塞尔曲线类似，只是三次贝塞尔曲线有两个控制点。同样，为了理解三次贝塞尔曲线的绘制方式，您应该查看\
    \ http://www.jasondavies.com/animated-bezier/ 上的动画演示。三次贝塞尔曲线的路径（在截图中以红色突出显示）从\
    \ P0 开始，朝 P1 方向前进，然后从 P2 方向到达终点 P3：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_51_1.png)\n\
    \n有两个三次贝塞尔曲线命令，其语法如下表所示：\n\n| 命令 | 参数 | 示例 |\n|---|---|---|\n| C 或 c | (x1, y1,\
    \ x2, y2, x, y)+ | C 150 25 350 50 500 300 |\n| S 或 s | (x2, y2, x y)+ | t 200\
    \ -100 200 50 |\n\n## 绘制路径\n\nc 命令要求我们指定两个控制点。以下代码的效果是从点 (200, 20) 绘制一条曲线到 (200,\
    \ 120)，经过控制点 (400, 140) 和 (400, 180)。请注意，我们还关闭了路径并应用了 fill 属性：\n\n```\npaper.path([\n\
    \t'M', 200, 20,\n\t'C', 400, 140, 400, 180, 200, 120,\n\t'z'\n]).attr({fill: '#222'});\n\
    ```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_52_0.png)\n\ns 命令与\
    \ T 命令类似，会自动创建关于当前点反射的控制点。它实际做的是将第二个控制点关于当前点反射，这成为我们新子路径的第一个控制点，我们现在需要为其指定第二个控制点。此处给出的代码通过使用\
    \ s 命令绘制子路径来扩展前面的示例：\n\n```\npaper.path([\n\t'M', 200, 20,\n\t'C', 400, 140, 400,\
    \ 180, 200, 120,\n\t'S', 0, 100, 200, 220,\n\t'z'\n]);\n```\n\ns 路径从当前点 (200,\
    \ 120) 开始，在 (200, 220) 结束，如所示。我们第一条曲线的第二个控制点定义在 (400, 180)，它关于当前点反射，从而创建一个位于 (0,\
    \ 60) 的控制点。然后我们指定了一个位于 (0, 100) 的第二个控制点：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_53_0.png)\n\
    \n使用贝塞尔曲线最困难的地方在于决定在哪里定义控制点。通常通过以下方法之一来解决：\n\n- 试错法\n- 数学计算\n- 使用 Inkscape 等图形包来辅助绘制\n\
    \n## 绘制弧线\n\n绘制弧线的语法是所有绘制命令中最复杂的。这是因为当我们从一个点绘制弧线到另一个点时，有四种可能的弧线路径可供选择，如下所示——有两个椭圆，其圆周上可以位于起点和终点。前两个弧线称为**次要**弧线，而后两个弧线称为**主要**弧线。生成的弧线也受从起点到终点的角度方向的影响：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_53_1.png)\n\n绘制弧线的语法如下表所示：\n\n| 命令\
    \ | 参数 | 示例 |\n|---|---|---|\n| A 或 a | (rx, ry, x-rotation, large-arc-flag, sweep-flag,\
    \ x, y)+ | a 25 50 0 1 0 100 200 |\n\n下表描述了各个参数：\n\n| 参数 | 描述 |\n|---|---|\n|\
    \ rx 和 ry | 由于弧线是椭圆的一部分，它在 x 和 y 方向上都有半径 |\n| x-rotation | 绘制弧线的椭圆的逆时针旋转（以度为单位的值）\
    \ |\n| large-arc-flag | 我们的弧线是作为主要（1）还是次要（0）弧线绘制 |\n| sweep-flag | 弧线是以正（1）即顺时针，还是负（0）即逆时针的角度方向绘制\
    \ |\n| x 和 y | 我们弧线的终点 |\n\n这些参数或许最好通过示例来说明。请考虑绘制 sweep-flag 等于 1 的主要弧线路径：\n\n\
    ```\npaper.path([\n\t'M', 50, 60,\n\t'a', 150, 80, 0, 1, 1, 0, 80\n]);\n```\n\n\
    我们首先移动到当前点 (50, 60)，然后绘制一个 x 半径为 150、y 半径为 80 的弧线。我们将 x-rotation 值设置为 0，并通过将 large-arc-flag\
    \ 设置为 1 来识别我们正在绘制大弧线。sweep-flag 值等于 1，我们使用小写形式，即 A 命令的相对变体，这意味着我们的最终 x 和 y 参数\
    \ (0, 80) 是相对于起点的单位，即：x 方向额外 0 像素，y 方向额外 60 像素，从而得到终点坐标 (50, 140)。生成的弧线如下所示。\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_55_0.png)\n\n如果我们指定 `large-arc-flag`\
