    \ where user experience is tailored to satisfy a range of viewport dimensions.\
    \ Satisfying a range of viewport dimensions is often referred to as **responsive\
    \ design**.\n\nWhile SVG itself has limited support in older browsers, we can\
    \ still provide vector graphics solutions. We now see that vector graphics are\
