    \ elements, have had transformations applied to them. In the case where they have\
    \ transformation applied to them, you will need to apply the same transformation\
    \ to the `path` elements that you create.\n\n## SVG to Raphaël conversion tools\n\
    \nThere are a number of good SVGs to Raphaël JS converters out there that will\
    \ convert an SVG image into Raphaël automatically and without too much pain.\n\
    \n### Ready Set Raphaël\n\nReady Set Raphaël (http://www.readysetraphael.com)\
    \ is a web-based SVG converter that allows you to upload an image and grab the\
    \ resultant Raphaël code. It supports SVG groups, ellipses, polygons, text, circles,\
    \ paths, and rectangles and parses all associated styling information into element\
    \ attributes:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_100_0.png)\n\nTo use\
    \ it, you simply upload an existing SVG image and click on the **Copy the Code**\
    \ button.\n\nTo test this out, download one of the sample files from http://www.readysetraphael.com\
    \ at the bottom of the page and copy and paste the resultant code into an HTML\
    \ document between the `<script></script>` tags. Note that you will need to create\
    \ an HTML element with an ID `rsr`:\n\n"
  mdcn: "\n\n## Inkscape\n\nInkscape 是一个开源的 SVG 编辑器，其功能集与 Adobe Illustrator 相似。许多设计师使用它，原因如下：\n\
    \n- 它是开源的，并且积极维护/开发\n- 在线上有大量可用的教程\n- 它拥有全面的功能集\n- 它符合 W3C 标准 SVG\n\nInkscape\
    \ 还具有跨平台的优势，可供下载的版本包括 Windows、Mac 和 Linux。\n\n## 下载 Inkscape\n\nInkscape 可在 `http://inkscape.org/download/`\
    \ 下载。建议下载最新的稳定版本，撰写本文时该版本为 0.48.4。\n\n## 开始使用 Inkscape\n\n虽然对 Inkscape 的深入介绍超出了本书的范围，但我们将使用以下步骤，通过\
    \ Inkscape 创建一些基本的 SVG：\n\n1. 首先，打开 Inkscape，从菜单中选择 **文件 | 新建**。Inkscape 自带多种预定义的文档尺寸，您应选择最适合所创建图形的尺寸。目前，请选择\
    \ **默认**。\n\n在左侧，您会看到 Inkscape 拥有多种形状绘制工具，用于绘制基本形状、文本、自由手绘和 Bézier 路径。\n\n2. 选择圆形。\n\
    3. 在画布上任意位置单击并拖动。\n4. 释放鼠标时，您的圆形将如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_93_0.png)\n\
    \n注意圆上的锚点。最左侧的点用于控制圆的宽度，最上方的点控制高度，而最右侧的点用于更改终点。在最右侧断点上单击并拖动：在圆内拖动会从终点到起点绘制一条直线，而在圆外拖动则会创建一个线段。\n\
    \n## 处理现有 SVG\n\n在圆外按几度角拖动的结果如下截图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_94_0.png)\n\
    \n对于基于 Web 的项目，文档尺寸通常由组成对象定义。单击 **文件 | 文档属性 | 页面**，然后展开 **调整页面大小以适应内容** 下拉菜单。在此处，您可以为文档定义自定义宽度和高度。单击\
    \ **将页面大小调整为绘图或选择** 将调整页面和所选元素的尺寸（如果未选中任何元素，则调整所有绘制元素的尺寸）。\n\n这实际上是对当前图层上的所有元素应用平移，即先绘制路径，然后应用变换。如果我们希望所有路径相对于“新”原点绘制（通常是这种情况），则应执行以下步骤：\n\
    \n1. 将文档大小调整为所需尺寸。\n2. 转到 **图层 | 图层...**\n3. 通过单击图层窗格上的 **+** 符号创建新图层。\n4. 选择上一图层中的所有对象。\n\
    5. 选择 **图层 | 将选择移动到上方图层**。\n6. 删除上一图层。\n\n结果如下：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_95_0.png)\n\
    \n我们可用的最佳工具或许是钢笔工具，它用于绘制 Bézier 曲线路径：\n\n1. 选择钢笔工具（*Shift + F6*）。\n2. 在文档中任意位置单击一次。\n\
    3. 在文档中的另一点单击并拖动。\n\n## 处理现有 SVG\n\n您会注意到，每次单击都定义一个锚点，该锚点决定曲线的弯曲程度，如下截图所示：\n\n\
    ![](img/d8ec653db4cab13fec8b3f5718174af6_96_0.png)\n\n每次后续单击都定义一个新的锚点，路径通过将其连接到起点锚点来闭合：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_96_1.png)\n\n## 检查路径\n\n由于我们熟悉向 Raphaël\
    \ 的 `path` 方法提供原始路径字符串数据，不言而喻，我们可以从 SVG 复制路径字符东并以这种方式绘制路径。对于复杂图形，SVG 的原始 XML 不总是易于处理，操作多个路径可能会很麻烦，但这种处理现有\
    \ SVG 的方法确实让我们对正在操作的图形拥有完全控制权。\n\n## Inkscape 的 XML 编辑器\n\nInkscape 的一个出色功能是能够直接查看和编辑\
    \ SVG 的 XML 标记。考虑上一节中的圆形示例。如果单击 **编辑 | XML 编辑器**，您将看到 SVG 的文档结构。单击左侧您创建的元素——`svg:path`\
    \ 元素——将列出对象的所有属性，包括 `d` 属性，该属性是在应用变换之前元素的路径。单击 `d` 属性将显示元素的路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_97_0.png)\n\
    \n## 处理现有 SVG\n\n如果我们获取此路径并在 Raphaël 中按以下方式使用：\n\n```javascript\nvar initialPath\
    \ = 'M 197,94.46 '\n + 'A 98.5,94.5 0 1 1 167.39,26.92 L 98.5,94.46 z';\nvar pac\
    \ = paper.path(initialPath);\npac.attr({fill: '#09c', 'stroke-width': 0});\n```\n\
    \n然后它将绘制到我们的画布上，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_98_0.png)\n\n\
    返回 Inkscape，移动弧形锚点以关闭我们创建的线段的“嘴巴”：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_98_1.png)\n\
    \n与之前一样，我们使用 XML 编辑器获取此元素的路径。\n\n我们可以使用路径动画，以相对较少的努力实现一个有趣的效果，从之前的“张嘴”路径动画到之后的“闭嘴”路径。首先，我们定义一个名为\
    \ move 的函数，该函数根据旋转（初始化为零）确定 pac 元素的 x 和 y 坐标：\n\n```javascript\nvar rotation =\
    \ 0;\nvar move = function() {\n    var x = Math.cos(Raphael.rad(rotation)) * 800;\n\
    \    var y = Math.sin(Raphael.rad(rotation)) * 800;\n}\n```\n\n接下来，我们将元素动画化到新路径或“闭嘴”路径：\n\
    \n```javascript\npac.animate({\n    path: 'M 197,94.46 ',\n    + 'a 98.5,94.5\
    \ 0 1 1 -2.1e-4,-0.194727, L 98.5,94.46 z',\n    transform: ['...T', x, y]\n},\
    \ 500, function() {\n    // Rotate our element and reset the path\n    rotation\
    \ += 90;\n    pac.attr({\n        path: initialPath\n    }).transform(['...R',\
    \ 90]);\n    setTimeout(move);\n});\n```\n\n我们根据元素的 x 和 y 坐标在半秒内应用平移。动画完成后，我们旋转元素。请注意，变换前缀带有省略号，这确保任何平移在考虑旋转后都会被计入；90\
    \ 度旋转后，平移将沿 y 轴进行。通过对 move 函数调用 setTimeout，此过程无限重复。\n\n运行此代码时，“嘴巴”在一次动画过程中从张开变为闭合，然后在应用旋转的情况下重复。旋转的效果是使我们的元素沿容器边缘移动（此演示可在本书附带的源代码和网站中找到）。\n\
    \n## 从现有 SVG 图像中提取路径\n\n由于 SVG 图像只是 XML 文件，您可以在文本编辑器中打开它们以获取路径信息。通常，只需从 XML 中的单个\
    \ `path` 元素复制并粘贴路径信息即可。如前所述，虽然这种方法很麻烦，但还有其他问题。主要问题是元素或元素组是否应用了变换。如果应用了变换，您需要将相同的变换应用到您创建的\
    \ `path` 元素上。\n\n## SVG 到 Raphaël 转换工具\n\n有许多优秀的 SVG 到 Raphaël JS 转换工具，可以自动且轻松地将\
    \ SVG 图像转换为 Raphaël。\n\n### Ready Set Raphaël\n\nReady Set Raphaël (http://www.readysetraphael.com)\
    \ 是一个基于 Web 的 SVG 转换器，允许您上传图像并获取生成的 Raphaël 代码。它支持 SVG 组、椭圆、多边形、文本、圆形、路径和矩形，并将所有相关样式信息解析为元素属性：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_100_0.png)\n\n使用它，您只需上传现有 SVG 图像并单击\
    \ **复制代码** 按钮。\n\n要测试此功能，请从 http://www.readysetraphael.com 页面底部下载示例文件之一，并将生成的代码复制并粘贴到\
    \ HTML 文档的 `<script></script>` 标签之间。请注意，您需要创建一个 ID 为 `rsr` 的 HTML 元素：\n\n"
