  mdcn: '


    ## Instant RaphaelJS 入门


    ISBN: 978-1-78216-985-7        平装本: 62 页


    快速上手 RaphaelJS - 一个功能强大的跨浏览器矢量图形库，轻松创建交互式 2D 图形和动画


    - 即学即用！一本简短、快速、专注的指南，立即带来效果

    - 创建跨浏览器无图像绘图和动画，支持 DOM 访问

    - 使用简单且有示意图的技术，创建你自己的形状，几乎可以是任何形状

    - 一次编写，在几乎所有浏览器中运行，包括 IE6


    ## Ext JS 4 初探


    ISBN: 978-1-84951-666-2        平装本: 340 页


    一本实用指南，包含 Ext JS 4 新功能的示例以及从 Ext JS 3 迁移的技巧


    - 根据本指南中提供的示例，轻松将 Ext JS 3 应用程序迁移到 Ext JS 4

    - 包含大量图表、插图和分步说明，用于开发实际应用程序

    - 由示例驱动，并解释事物的工作原理


    请查看 [www.PacktPub.com](https://www.PacktPub.com) 了解我们书名的信息


    ![](img/d8ec653db4cab13fec8b3f5718174af6_128_0.png)


    ![](img/d8ec653db4cab13fec8b3f5718174af6_128_1.png)


    ## Sencha Touch 移动 JavaScript 框架


    ISBN: 978-1-84951-510-8        平装本: 316 页


    使用这个首个 HTML5 移动框架，为 Apple iOS 和 Google Android 触摸屏设备构建 Web 应用程序


    - 通过示例学习使用 Sencha Touch 开发在 Apple iOS 和 Google Android 触摸屏设备上看起来和感觉都原生的 Web 应用程序

    - 设计分辨率独立且图形化的表示，如按钮、图标和选项卡，具有无与伦比的灵活性

    - 添加自定义事件，如点按、双击、滑动、长按、捏合和旋转


    ## Processing 2：创意编程食谱


    ISBN: 978-1-84951-794-2        平装本: 306 页


    超过 90 个高效食谱，通过交互式艺术、图形、计算机视觉、3D 等释放你的创造力


    - 探索 Processing 语言，包含大量用于计算艺术和图形的实用食谱

    - 广泛涵盖主题，包括交互式艺术、计算机视觉、可视化、3D 绘图以及 Processing 中的更多内容

    - 创建交互式艺术装置，并学习将你的作品导出用于打印、屏幕、互联网和移动设备


    请查看 **[www.PacktPub.com](https://www.PacktPub.com)** 了解我们书名的信息


