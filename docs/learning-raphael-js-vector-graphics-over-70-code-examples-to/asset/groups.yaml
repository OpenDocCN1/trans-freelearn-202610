    \ command as follows:\n\n```\n```\nvar hexagon = paper.path(\n ['M', 250, 15,\n\
    \ 'l', sideLength, 0,\n x, y,\n -x, y,\n -sideLength, 0,\n -x, -y,\n 'z' // in\
    \ place of the line to (x, -y)\n ]\n);\n```\n```\n\nIn this instance, the path’s\
    \ start and end points are joined. Note that the closepath\ncommand can be either\
    \ uppercase or lowercase but this has no effect on its behavior.\n\n# # Drawing\
    \ curves\n\nThere are three types of curve path: quadratic Bézier curves, cubic\
    \ Bézier curves,\nand arcs. Bézier curves are curves defined between a start and\
    \ end point but whose\ndirection we can determine by using control points, while\
