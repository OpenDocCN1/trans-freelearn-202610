  md: "\n\n## The future of Raphaël\n\nThe current maintainer of Raphaël, Tomás Alabés,\
    \ kindly contacted me with information pertaining to the future of the library.\
    \ Going forward, we expect increased adoption of the library and changes are being\
    \ put in place to enable more open source collaboration of Raphaël.\n\n## Milestones\n\
    \nThe Raphaël project currently has four milestones as shown in the following\
    \ table:\n\n| Version | Milestone |\n|---------|-----------|\n| 2.1.1 | Addressed\
    \ bug fixes contributed by the community |\n| 2.2.0 | Brought in enhancements\
    \ from contributors' pull requests |\n| 2.2.1 | Addressed bug fixes from issues\
    \ created by the community |\n| 2.3.0 | Developed enhancements suggested in issues\
    \ created by the community |\n\nAs you can see, the forthcoming versions of Raphaël\
    \ will address a number of existing bug fixes but perhaps more interestingly,\
    \ start to implement features that have either been contributed or suggested by\
    \ the community. This makes for a solid library that continues to evolve.\n\n\
    ## Long term goals\n\nTomás is especially eager to encourage open source collaboration\
    \ on Raphaël. He has already begun making commits to the source (https://github.com/DmitryBaranovskiy/raphael/)\
    \ that will help facilitate wider collaboration.\n\nAdditionally, when VML-compatible\
    \ browsers start to lose market share and supporting them is no longer a requirement,\
    \ the library will begin to focus exclusively on SVG which will bring with it\
    \ a number of features and improvements that are inhibited by VML.\n\n## Summary\n\
    \nHaving come to the end of this book, you will hopefully have a firm grip on\
    \ the capabilities of the Raphaël library and have gained an understanding of\
    \ some of the ways in which it can be used and the approaches taken to drawing\
    \ vector graphics and visualizing data. You are reminded to explore the library’s\
    \ documentation and experiment with all of its available features and invest your\
    \ time in researching the concepts driving your future applications, be they in\
    \ data visualization or game development or cartography. The true power of any\
    \ library is at the behest of the one utilizing it.\n\nIt is hoped that you have\
    \ enjoyed reading this book as much as I have enjoyed writing it.\n\n## Index\n\
