    \ to which the curve\nbends: from start to finish, the curve starts off heading\
    \ in the direction of the control\npoint P1 and then bends towards the end point\
    \ P2 from the direction of P1.\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_48_0.png)\n\
