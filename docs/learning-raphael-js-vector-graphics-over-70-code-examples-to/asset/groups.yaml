  md: "\n\nFinally, we create an arc back to the point (100, 180) to complete the\
    \ path:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_43_0.png)\n\nThe example of\
    \ the arbelos demonstrates the drawing of a single path, where we did not lift\
    \ up the pen at any point during the drawing process. Were we to lift up the pen,\
    \ the subsequent drawing would technically create **subpaths** on the main path\
    \ element. In the example, creating a triangle as a subpath has the effect of\
    \ _adding_ to our single path element. Notice also that the fill attribute is\
    \ applied to the _overall_ path rather than individual subpaths:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_43_1.png)\n\
    \n## Path drawing commands\n\nPaths are based on a number of drawing commands\
    \ executed in the order in which they’re defined. Commands are expressed as a\
    \ single letter that is either uppercase, meaning that a subsequent drawing uses\
    \ absolute coordinates in the drawing context, or lowercase, meaning that a subsequent\
    \ drawing uses coordinates relative to the current point. Most commands take parameters\
    \ as arguments that determine the behavior of the command. Consider, for example,\
    \ the following path string:\n\"M100,180 a140,140,0,0,1,280,0\"\n\n## Drawing\
    \ Paths\n\nThis path string is used in drawing the arbelos of the previous section.\
    \ Drawing is started using the `M` command and subsequent arcs are then drawn\
    \ using the `a` command.\n\nWe draw paths in Raphaël using the `path` method,\
    \ which accepts either a path string or an array as a parameter. Arrays are usually\
    \ a more convenient and more readable way of defining paths. Consider the following\
    \ code:\n\n```\nvar xStart = 100;\nvar yStart = 180;\nvar path = paper.path([\n\
    \t'M', xStart, yStart,\n\t'a', 140, 140, 0, 0, 1, 280, 0\n]);\n```\n\nThis draws\
    \ the path described by the previous path string. The array format is more readable\
    \ and is a much cleaner way of dealing with parameter values assigned to the xStart\
    \ and yStart variables.\n\n> In the interests of brevity, we will use both formats\
    \ for defining a path interchangeably throughout this book.\n\n## The moveto command\n\
    \nThe **moveto** command establishes a new current point. In the pen analogy detailed\
    \ in the previous section, issuing a moveto command has the effect of lifting\
    \ the pen off the page and placing it at a given point. All paths start with a\
    \ moveto command.\n\nThe moveto command has the following syntax:\n\n| Command\
    \ | Parameters | Example |\n|---------|------------|---------|\n| M or m | (x,\
    \ y)+ | M 50,50 100,100 |\n\nIn the example of the arbelos, `M 100,180` has the\
    \ effect of placing the pen at the point x = 100, y = 180. Subsequent commands\
    \ then use these coordinates as the starting point of the drawing.\n\nYou may\
    \ have noticed that the moveto syntax allows us to repeat the `x` and `y` parameters\
    \ (indicated by the `+` symbol). Consider, for example, the following path:\n\n\
    `\"M 50,50 100,150\"`\n\nThe first (x, y) pair moves the pen to the point (50,\
    \ 50) on our canvas as we would expect. However, the second (x, y) pair has the\
    \ effect of drawing a line to the point (100, 150), as well as moving the current\
    \ point. This behavior means that the moveto command can be used to draw polygons.\
    \ The following code draws a triangle with vertices at (250, 50), (200, 100),\
    \ and (300, 100) using only the moveto command:\n\n```\nvar path = paper.path([\n\
    \ 'M', 250, 50\n 200, 100,\n 300, 100,\n 250, 50\n ]);\n```\n\nYou should notice\
    \ that all the (x, y) points mentioned are absolute, that is, defined relative\
    \ to the origin point of our canvas. Were we to specify the lowercase variant\
    \ of the command, m, every successive (x, y) pair would be relative to the previous\
    \ one (but note that the first (x, y) pair is always positioned using absolute\
    \ coordinates regardless of the M command’s case). The same triangle defined using\
    \ relative coordinates is described by the path string, m 250,50 -50,50 100,0\
    \ -50,-50.\n\nA number of examples of the moveto command are shown here:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_45_0.png)\n\
    \n## The lineto commands\n\nThe **lineto** commands draw straight lines from the\
    \ current point to a point specified. There are three lineto commands:\n\n- `L`\
    \ for drawing lines to any (x, y) point\n- `H` for drawing horizontal lines in\
    \ x\n- `V` for drawing vertical lines in y\n\n| Command | Parameters | Example\
    \ |\n|---|---|---|\n| L or l | (x, y) + | L 100 100 |\n| H or h | x+ | H 75 |\n\
    | V or v | y+ | V -75 |\n\nBy way of example, a line from the point (10, 10) to\
    \ the point (75, 100) would be drawn as follows:\n\nvar line = paper.path(['M',\
    \ 10, 10, 'L', 75, 100]);\n\nNote that because we use the uppercase command, L,\
    \ the line is drawn from the point (0, 0) and not relative to our start point\
    \ (10, 10). Had we used the lowercase variant, l, the line would have been drawn\
    \ from (10, 10) to the point (10 + 75, 10 + 100) = (85, 110).\n\nBy repeating\
    \ parameters, we can draw polygons (like we did in the previous section with moveto,\
    \ except that lineto can be specified from any current point, not just moveto\
    \ points). For example, a regular hexagon with side length 100 starting at the\
    \ point (200, 15) could be drawn as follows:\n\nvar sideLength = 100;\nvar x =\
    \ sideLength * Math.cos(Raphael.rad(60));\nvar y = sideLength * Math.sin(Raphael.rad(60));\n\
    \nvar hexagon = paper.path(\n['M', 250, 15,\n'l', sideLength, 0,\nx, y,\n-x, y,\n\
    -sideLength, 0,\n-x, -y,\nx, -y,\nx\n]);\n\nWe use the fact that an exterior angle\
    \ of a hexagon is 60 degrees (as shown in the following diagram) in conjunction\
    \ with the trigonometric functions sin and cos to calculate the x and y coordinates\
    \ of the point to which we want to draw. Starting from the point (250, 15), we\
    \ draw a line 250 pixels relative in x and 0 pixels in y; we then draw a line\
    \ that is x pixels in x and y pixels in y relative to this point. Since the hexagon\
    \ is regular, the magnitudes of the relative x- and y-points are equal for sides\
    \ for which y is greater than zero (all edges except the top and bottom edges),\
    \ hence we are able to draw in factors of x and y back to the start point.\n\n\
    ![](img/d8ec653db4cab13fec8b3f5718174af6_47_0.png)\n\nNote that in JavaScript,\
    \ the trigonometric functions expect a value of angle measured in radians to be\
    \ passed so we have used the `rad` utility method on the `Raphael` object to convert\
    \ 60 degrees into radians.\n\n## The closepath command\n\nThe **closepath** command\
    \ draws a straight line from the current point to the starting point of the current\
    \ subpath. In the example of the hexagon, even though we drew back to the start\
    \ point, the path's start and end points are not joined. The effect is pronounced\
    \ when applying a large `stroke-width` value to the path as shown:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_47_1.png)\n\
    \n## Drawing Paths\n\nThe closepath command character is z and does not accept\
    \ any parameters. Since in the previous example we drew a straight line back to\
    \ the end point, we could instead close the path using the closepath command as\
    \ follows:\n\n```\nvar hexagon = paper.path(\n ['M', 250, 15,\n 'l', sideLength,\
    \ 0,\n x, y,\n -x, y,\n -sideLength, 0,\n -x, -y,\n 'z' // in place of the line\
    \ to (x, -y)\n ]\n);\n```\n\nIn this instance, the path’s start and end points\
    \ are joined. Note that the closepath command can be either uppercase or lowercase\
    \ but this has no effect on its behavior.\n\n## Drawing curves\n\nThere are three\
    \ types of curve path: quadratic Bézier curves, cubic Bézier curves, and arcs.\
    \ Bézier curves are curves defined between a start and end point but whose direction\
    \ we can determine by using control points, while arcs are a portion of the circumference\
    \ of an ellipse.\n\n## Quadratic Bézier curves\n\nA quadratic Bézier curve is\
    \ a curve between two points with a single control point. To appreciate how quadratic\
    \ Bézier curves are drawn, you should experiment with the animated demo at http://www.jasondavies.com/animated-bezier/.\
    \ As shown here, the curve is drawn from a point P0 to a point P2 with a control\
    \ point P1. The control point P1 relative to P0 and P2 determines the extent to\
    \ which the curve bends: from start to finish, the curve starts off heading in\
    \ the direction of the control point P1 and then bends towards the end point P2\
    \ from the direction of P1.\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_48_0.png)\n\
    \nwww.it-ebooks.info\n"
  mdcn: "\n\n最后，我们创建一条回到点 (100, 180) 的弧线以完成路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_43_0.png)\n\
    \n阿贝洛斯的示例演示了单个路径的绘制，在绘制过程中我们任何时候都没有抬起笔。如果我们抬起笔，随后的绘制在技术上将在主路径元素上创建 **子路径**。在示例中，将三角形作为子路径创建的效果是\
    \ _添加_ 到我们的单个路径元素。还要注意，fill 属性应用于 _整体_ 路径，而不是单个子路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_43_1.png)\n\
    \n## 路径绘制命令\n\n路径基于按定义顺序执行的多个绘制命令。命令表达为一个字母，该字母可以是大写，表示后续绘制在绘图上下文中使用绝对坐标，也可以是小写，表示后续绘制使用相对于当前点的坐标。大多数命令将参数作为参数来确定命令的行为。例如，考虑以下路径字符串：\n\
    \"M100,180 a140,140,0,0,1,280,0\"\n\n## 绘制路径\n\n此路径字符串用于绘制上一节中的阿贝洛斯。绘制使用 `M` 命令开始，随后的弧线使用\
    \ `a` 命令绘制。\n\n我们在 Raphaël 中使用 `path` 方法绘制路径，该方法接受路径字符串或数组作为参数。数组通常是定义路径更方便且更易读的方式。考虑以下代码：\n\
    \n```\nvar xStart = 100;\nvar yStart = 180;\nvar path = paper.path([\n\t'M', xStart,\
    \ yStart,\n\t'a', 140, 140, 0, 0, 1, 280, 0\n]);\n```\n\n这将绘制前一路径字符串描述的路径。数组格式更易读，也是处理分配给\
    \ xStart 和 yStart 变量的参数值的更清晰方式。\n\n> 为了简洁起见，我们将在本书中交替使用这两种格式来定义路径。\n\n## moveto\
    \ 命令\n\n**moveto** 命令建立一个新的当前点。在上一节详细介绍的笔类比中，发出 moveto 命令的效果是将笔从页面上抬起并放置在给定点。所有路径都以\
    \ moveto 命令开始。\n\nmoveto 命令具有以下语法：\n\n| 命令 | 参数 | 示例 |\n|---------|------------|---------|\n\
    | M 或 m | (x, y)+ | M 50,50 100,100 |\n\n在阿贝洛斯示例中，`M 100,180` 的效果是将笔放置在 x = 100,\
    \ y = 180 的点。随后的命令将这些坐标用作绘制的起点。\n\n您可能已经注意到，moveto 语法允许我们重复 `x` 和 `y` 参数（由 `+`\
    \ 符号表示）。例如，考虑以下路径：\n\n`\"M 50,50 100,150\"`\n\n第一个 (x, y) 对将笔移动到画布上的点 (50, 50)，正如我们所期望的那样。然而，第二个\
    \ (x, y) 对的效果是绘制一条线到点 (100, 150)，并移动当前点。这种行为意味着 moveto 命令可以用于绘制多边形。以下代码仅使用 moveto\
    \ 命令绘制一个顶点位于 (250, 50)、(200, 100) 和 (300, 100) 的三角形：\n\n```\nvar path = paper.path([\n\
    \ 'M', 250, 50\n 200, 100,\n 300, 100,\n 250, 50\n ]);\n```\n\n您应该注意到，提到的所有 (x,\
    \ y) 点都是绝对的，即相对于画布的原点定义。如果我们指定命令的小写变体 m，则每个连续的 (x, y) 对将相对于前一个点（但请注意，第一个 (x, y)\
    \ 对始终使用绝对坐标定位，无论 M 命令的大小写如何）。使用相对坐标定义的相同三角形由路径字符串 m 250,50 -50,50 100,0 -50,-50\
    \ 描述。\n\n以下是 moveto 命令的多个示例：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_45_0.png)\n\
    \n## lineto 命令\n\n**lineto** 命令从当前点绘制直线到指定点。有三个 lineto 命令：\n\n- `L` 用于绘制到任何 (x,\
    \ y) 点的线\n- `H` 用于在 x 中绘制水平线\n- `V` 用于在 y 中绘制垂直线\n\n| 命令 | 参数 | 示例 |\n|---|---|---|\n\
    | L 或 l | (x, y) + | L 100 100 |\n| H 或 h | x+ | H 75 |\n| V 或 v | y+ | V -75\
    \ |\n\n例如，从点 (10, 10) 到点 (75, 100) 的线将绘制如下：\n\nvar line = paper.path(['M', 10,\
    \ 10, 'L', 75, 100]);\n\n请注意，因为我们使用大写命令 L，线是从点 (0, 0) 绘制的，而不是相对于我们的起点 (10, 10)。如果我们使用小写变体\
    \ l，线将从 (10, 10) 绘制到点 (10 + 75, 10 + 100) = (85, 110)。\n\n通过重复参数，我们可以绘制多边形（就像我们在上一节中使用\
    \ moveto 时一样，只不过 lineto 可以从任何当前点指定，而不仅仅是 moveto 点）。例如，从点 (200, 15) 开始的边长为 100\
    \ 的正六边形可以绘制如下：\n\nvar sideLength = 100;\nvar x = sideLength * Math.cos(Raphael.rad(60));\n\
    var y = sideLength * Math.sin(Raphael.rad(60));\n\nvar hexagon = paper.path(\n\
    ['M', 250, 15,\n'l', sideLength, 0,\nx, y,\n-x, y,\n-sideLength, 0,\n-x, -y,\n\
    x, -y,\nx\n]);\n\n我们利用六边形的外角为 60 度（如下图所示）的事实，结合三角函数 sin 和 cos 来计算我们想要绘制到的点的 x\
    \ 和 y 坐标。从点 (250, 15) 开始，我们绘制一条在 x 方向相对 250 像素、y 方向 0 像素的线；然后我们绘制一条相对于该点在 x 方向\
    \ x 像素、y 方向 y 像素的线。由于六边形是正六边形，对于 y 大于零的边（除顶边和底边外），相对 x 和 y 点的大小相等，因此我们能够以 x 和\
    \ y 的倍数绘制回起点。\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_47_0.png)\n\n请注意，在 JavaScript\
    \ 中，三角函数期望传入以弧度为单位的角度值，因此我们使用 `Raphael` 对象上的 `rad` 实用方法将 60 度转换为弧度。\n\n## closepath\
    \ 命令\n\n**closepath** 命令从当前点绘制一条直线到当前子路径的起点。在六边形示例中，尽管我们绘制回了起点，但路径的起点和终点并未连接。当对路径应用较大的\
    \ `stroke-width` 值时，效果很明显，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_47_1.png)\n\
    \n## 绘制路径\n\nclosepath 命令字符是 z，不接受任何参数。由于在前一个示例中我们绘制了一条直线回到终点，我们可以改用 closepath\
    \ 命令关闭路径，如下所示：\n\n```\nvar hexagon = paper.path(\n ['M', 250, 15,\n 'l', sideLength,\
    \ 0,\n x, y,\n -x, y,\n -sideLength, 0,\n -x, -y,\n 'z' // 代替绘制到 (x, -y) 的线\n\
    \ ]\n);\n```\n\n在这种情况下，路径的起点和终点已连接。请注意，closepath 命令可以是大写或小写，但这对其行为没有影响。\n\n##\
    \ 绘制曲线\n\n有三种类型的曲线路径：二次贝塞尔曲线、三次贝塞尔曲线和弧线。贝塞尔曲线是定义在起点和终点之间的曲线，但其方向可以通过使用控制点来确定，而弧线是椭圆周长的一部分。\n\
    \n## 二次贝塞尔曲线\n\n二次贝塞尔曲线是两点之间具有一个控制点的曲线。要理解二次贝塞尔曲线的绘制方式，您应该尝试 http://www.jasondavies.com/animated-bezier/\
    \ 上的动画演示。如图所示，曲线从点 P0 绘制到点 P2，并带有控制点 P1。控制点 P1 相对于 P0 和 P2 决定了曲线弯曲的程度：从开始到结束，曲线最初朝向控制点\
    \ P1 的方向，然后从 P1 的方向弯曲到终点 P2。\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_48_0.png)\n\
    \nwww.it-ebooks.info\n\n"
