    \nEvery element has a bounding box that defines the smallest rectangular region\
    \ containing all points of an element. By checking to see whether two bounding\
    \ boxes overlap we can determine whether or not an element was \"dropped\" on\
    \ to another.\n\nConsider defining a target rectangle alongside our square:\n\n\
    ```\nvar target = paper.rect(400, 100, 200, 200);\nvar square = paper.rect(100,\
    \ 100, 100, 100);\n```\n\nOur `onstart` and `onmove` event handlers are defined\
    \ as per the example in the previous section and are responsible for initialization\
    \ and movement respectively.\n\nThis time, in our `onend` event handler, we get\
    \ the bounding boxes of each of our square and target element using the `getBBox`\
    \ method and then check whether or not the elements overlap using `isBBoxIntersect`:\n\
    \n```\nfunction onend() {\n    var bbox = this.getBBox(),\n        targetBBox\
    \ = target.getBBox();\n\n    if(Raphael.isBBoxIntersect(bbox, targetBBox)) {\n\
    \        this.undrag();\n        this.attr({\n            x: 450,\n          \
    \  y: 150\n        });\n    }\n}\n```\n\nWhen the elements do overlap, we remove\
    \ all `drag` event handlers on the element by invoking `undrag` and setting its\
    \ `x` and `y` positions to some arbitrary values that fall within the bounding\
    \ box of our target.\n\n## Bounding box inside bounding box\n\nWhile the `isBBoxIntersect`\
    \ method is convenient, we sometimes need to know whether or not all points on\
    \ an element are inside another. Going back to the previous example, we could\
    \ check to see whether the top-left vertex and bottom-right vertex of our square's\
    \ bounding box fall within the target bounding box using the `isPointInsideBBox`\
    \ method like so:\n\n```javascript\nfunction onend() {\n    var targetBBox = target.getBBox();\n\
    \    var topLeftVertex = {\n        x: this.attr('x'),\n        y: this.attr('y')\n\
    \    };\n    var bottomRightVertex = {\n        x: this.attr('x') + this.attr('width'),\n\
    \        y: this.attr('y') + this.attr('height')\n    };\n\n    var point1InsideBox\
    \ = Raphael.isPointInsideBBox(\n        targetBBox, topLeftVertex.x, topLeftVertex.y\n\
    \    );\n    var point2InsideBox = Raphael.isPointInsideBBox(\n        targetBBox,\
    \ bottomRightVertex.x, bottomRightVertex.y\n    );\n    if(point1InsideBox &&\
    \ point2InsideBox) {\n        this.undrag();\n        this.attr({ x: 450, y: 150\
    \ });\n    }\n}\n```\n\nThe top-left vertex of the square is defined by its x\
    \ and y attribute while the bottom-right vertex is described by the (x, y) point\
    \ plus the width and height of the element. Only when both points lie within the\
    \ bounding box of our target do we uninitialize the `drag` event handling.\n\n\
    This approach works really well for target elements whose overall shape is defined\
    \ accurately by a rectangular bounding box. In those cases where a shape is not\
    \ defined particularly well by a rectangular bounding box, a more suitable mathematical\
    \ approach would be sought.\n\n## Summary\n\nIn this chapter we have covered a\
    \ lot of ground relating to both event handling and transformations. You should\
    \ be familiar with some of the ways that we are able to interact with our drawings\
    \ and transform them at will.\n\nWe are in a prime position now to look at truly\
    \ bringing our drawings to life by animating them and will do so in the next chapter.\n\
    \n## Vector Animation\n\nTill now we have looked at drawing static graphics and\
    \ interacting with and transforming them instantaneously. Animation affords us\
    \ the ability to change graphics with regard to time, that is, we can modify the\
    \ attributes of a vector graphic over some non-zero time interval.\n\nPrior to\
    \ the emergence of the JavaScript frameworks of the early 2000s, animation was\
    \ largely achieved by Flash and to a lesser extent by Java applets. With the advent\
    \ of these frameworks, animation of the DOM lead to slicker and more intuitive\
    \ user interfaces and more semantic websites. In more recent years, HTML5, CSS3,\
    \ WebGL, and SVG afford developers the ability to create more complex, fully fledged\
    \ animations and interactive user interfaces.\n\nRaphaël makes animating vector\
    \ graphics straightforward and in the course of this chapter we look at some of\
    \ the different ways you can animate graphics using the library. We will be covering\
    \ the following topics in particular:\n\n- Animating method and basic attribute\
    \ animation\n- Animating paths\n- Easing using the cubic Bézier syntax\n- Animating\
    \ transformations\n- Animation using custom attributes and animation along a path\n\
    \n## Basic animation\n\nAnimation is accomplished using the `animate` method of\
    \ an element. The method takes the following parameters in the order that they’re\
    \ defined:\n\n| Parameter | Type | Description |\n|---|---|---|\n| attributes\
    \ | Object | Key-value pair attributes as per the `Element`. `attr()` method |\n\
    | duration | Number | The number of milliseconds that the duration should last\
    \ for |\n| easing (optional) | String | A string describing the rate of change\
    \ of an attribute with regard to time |\n| callback (optional) | Function | A\
    \ function that is executed at the point at which the animation ends |\n\nTo demonstrate\
    \ animation, consider a circle whose center point is at (100, 100) with radius\
    \ 50px:\n\n```\nvar circle = paper.circle(100, 100, 50).attr({fill: 'green'});\n\
    ```\n\nWe could animate the circle to a point (500, 100) and a reduced radius\
    \ of 15px as follows:\n\n```\ncircle.animate({\n cx: 500,\n r: 15\n }, 1000);\n\
    ```\n\nThe circle is animated over a period of a second and its initial and final\
    \ states are shown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_76_0.png)\n\
    \n> To really appreciate the examples given in this chapter you should make recourse\
    \ to the source code demos or site accompanying this book.\n"
  mdcn: "\n\n## 拖放功能\n\n拖放功能是 Raphaël 的一个强大功能。特别是，我们对拖动事件有很好的控制，这使我们能够创建更易用的应用程序。\n\
    \n## Element.drag() 方法\n\n元素的 drag 方法具有以下语法：\n\n```\nElement.drag(\n    onmove,\
    \ onstart, onend, [mcontext], [scontext], [econtext]\n)\n```\n\nonmove、onstart\
    \ 和 onend 函数是在拖动元素生命周期中调用的回调函数，而 mcontext、scontext 和 econtext 定义了这些函数作用域中的 this\
    \ 变量（默认为正在拖动的元素）。\n\n## onstart 事件处理程序\n\n当元素拖动首次启动时，会调用 onstart 事件处理程序。它通常用作初始化程序，用于标记我们正在修改的元素的起始\
    \ x 和 y 点。\n\n## onend 事件处理程序\n\n当元素拖动结束时，会调用 onend 事件处理程序，例如，在将元素从一个点移动到另一个点后释放鼠标时。它通常用于：\n\
    \n- 拖动后重新初始化元素\n- 检查绘图上下文中元素的当前位置\n- 定义拖放后应发生的任何其他操作\n\n## onmove 事件处理程序\n\n每次拖动过程中移动元素时，都会调用\
    \ onmove 事件处理程序。它具有 dx 和 dy 参数，分别描述元素在 x 和 y 方向上拖动的量。\n\n## 拖放示例\n\n例如，考虑拖动一个正方形。我们首先定义元素，并在\
    \ `onstart` 事件处理程序中保留其起始 _x_ 和 _y_ 位置的引用。为了突出显示我们的元素处于“拖动”状态，我们还将其涂成粉色。在我们的 `onend`\
    \ 事件处理程序中，我们将填充重置为黑色，以指示拖动已结束：\n\n```\nvar startX, startY;\nfunction onstart()\
    \ {\n    startX = this.attr('x');\n    startY = this.attr('y');\n    this.attr('fill',\
    \ 'pink');\n}\n\nfunction onend() {\n    this.attr('fill', '#000');\n}\n```\n\n\
    我们的 `onmove` 事件处理程序负责根据原始 _x_ 和 _y_ 位置加上 `dx` 和 `dy` 来设置元素的 _x_ 和 _y_ 位置，如下所示：\n\
    \n```\nfunction onmove(dx, dy) {\n    this.attr({\n        x: startX + dx,\n \
    \       y: startY + dy\n    });\n}\n```\n\n最后，我们在元素上调用 drag，传入各个事件处理程序：\n\n```\n\
    square.drag(onmove, onstart, onend);\n```\n\n生成的变换在本章附带的示例代码中演示。\n\n> 请注意，`dx`\
    \ 和 `dy` 在数学中通常用于指代 _x_ 和 _y_ 的微小变化。每次调用 `onmove` 事件处理程序时，其 `dx` 和 `dy` 参数将具有表示每个方向微小变化的值。\n\
    \n## 放置元素\n\n在拖动元素结束时，我们可以执行检查，以查看它相对于其他元素的位置。**放置**本质上是检查我们的元素是否落在某个特定边界内。\n\n\
    ## 边界框重叠\n\n每个元素都有一个边界框，它定义了包含元素所有点的最小矩形区域。通过检查两个边界框是否重叠，我们可以确定元素是否被“放置”到了另一个元素上。\n\
    \n考虑与我们的正方形一起定义一个目标矩形：\n\n```\nvar target = paper.rect(400, 100, 200, 200);\n\
    var square = paper.rect(100, 100, 100, 100);\n```\n\n我们的 `onstart` 和 `onmove`\
    \ 事件处理程序按上一节中的示例定义，分别负责初始化和移动。\n\n这次，在我们的 `onend` 事件处理程序中，我们使用 `getBBox` 方法获取正方形和目标元素的边界框，然后使用\
    \ `isBBoxIntersect` 检查元素是否重叠：\n\n```\nfunction onend() {\n    var bbox = this.getBBox(),\n\
    \        targetBBox = target.getBBox();\n\n    if(Raphael.isBBoxIntersect(bbox,\
    \ targetBBox)) {\n        this.undrag();\n        this.attr({\n            x:\
    \ 450,\n            y: 150\n        });\n    }\n}\n```\n\n当元素重叠时，我们通过调用 `undrag`\
    \ 并将其 `x` 和 `y` 位置设置为落在目标边界框内的某些任意值，来删除元素上的所有 `drag` 事件处理程序。\n\n## 边界框在边界框内\n\n\
    虽然 `isBBoxIntersect` 方法很方便，但我们有时需要知道元素上的所有点是否在另一个元素内。回到前面的示例，我们可以使用 `isPointInsideBBox`\
    \ 方法检查正方形边界框的左上角顶点和右下角顶点是否落在目标边界框内，如下所示：\n\n```javascript\nfunction onend() {\n\
    \    var targetBBox = target.getBBox();\n    var topLeftVertex = {\n        x:\
    \ this.attr('x'),\n        y: this.attr('y')\n    };\n    var bottomRightVertex\
    \ = {\n        x: this.attr('x') + this.attr('width'),\n        y: this.attr('y')\
    \ + this.attr('height')\n    };\n\n    var point1InsideBox = Raphael.isPointInsideBBox(\n\
    \        targetBBox, topLeftVertex.x, topLeftVertex.y\n    );\n    var point2InsideBox\
    \ = Raphael.isPointInsideBBox(\n        targetBBox, bottomRightVertex.x, bottomRightVertex.y\n\
    \    );\n    if(point1InsideBox && point2InsideBox) {\n        this.undrag();\n\
    \        this.attr({ x: 450, y: 150 });\n    }\n}\n```\n\n正方形的左上角顶点由其 x 和 y 属性定义，而右下角顶点由\
    \ (x, y) 点加上元素的宽度和高度描述。只有当两个点都位于目标边界框内时，我们才会取消初始化 `drag` 事件处理。\n\n这种方法对于其整体形状由矩形边界框准确定义的目标元素效果很好。在那些形状不太适合由矩形边界框定义的情况下，会寻求更合适的数学方法。\n\
    \n## 摘要\n\n在本章中，我们涵盖了与事件处理和变换相关的大量内容。您应该熟悉我们能够与绘图交互并随意转换它们的一些方法。\n\n我们现在处于绝佳的位置，可以通过动画让我们的绘图真正“活”起来，并将在下一章中这样做。\n\
    \n## 矢量动画\n\n到目前为止，我们已经研究了绘制静态图形以及即时与之交互和转换它们。动画使我们能够随时间改变图形，也就是说，我们可以在非零时间间隔内修改矢量图形的属性。\n\
    \n在 2000 年代初期 JavaScript 框架出现之前，动画主要由 Flash 实现，以及在较小程度上由 Java 小程序实现。随着这些框架的出现，DOM\
    \ 的动画带来了更流畅、更直观的用户界面和更具语义的网站。在近年来，HTML5、CSS3、WebGL 和 SVG 使开发人员能够创建更复杂、功能齐全的动画和交互式用户界面。\n\
    \nRaphaël 使矢量图形动画变得简单，在本章中，我们将探讨使用该库为图形制作动画的不同方式。我们将特别涵盖以下主题：\n\n- Animating 方法和基本属性动画\n\
    - 动画路径\n- 使用三次贝塞尔语法进行缓动\n- 动画变换\n- 使用自定义属性进行动画以及沿路径动画\n\n## 基本动画\n\n动画是使用元素的 `animate`\
    \ 方法完成的。该方法按定义顺序接受以下参数：\n\n| 参数 | 类型 | 描述 |\n|---|---|---|\n| attributes | Object\
    \ | 按照 `Element` 的 `attr()` 方法的键值对属性 |\n| duration | Number | 动画持续的毫秒数 |\n| easing（可选）\
    \ | String | 描述属性随时间变化率的字符串 |\n| callback（可选） | Function | 在动画结束时执行的函数 |\n\n为了演示动画，请考虑一个圆，其中心点在\
    \ (100, 100)，半径为 50px：\n\n```\nvar circle = paper.circle(100, 100, 50).attr({fill:\
    \ 'green'});\n```\n\n我们可以将圆动画到点 (500, 100) 并将半径减小到 15px，如下所示：\n\n```\ncircle.animate({\n\
    \ cx: 500,\n r: 15\n }, 1000);\n```\n\n圆在一秒钟内动画，其初始状态和最终状态如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_76_0.png)\n\
    \n> 要真正欣赏本章中给出的示例，您应该参考本书附带的源代码演示或网站。\n\n"
