  - '[PAGE 91]


    # # Working with Existing SVGs


    Most designers use a mixture of raster and vector graphics in their projects and
    so are familiar with vector graphics editors such as Adobe Illustrator and Inkscape.
    The usefulness of these tools has grown considerably in recent years inline with
    advances in digital media — in particular, designers need to be able to create
    resolution-independent graphics that work in different contexts.


    The mobile and tablet market, for example, encourages designers to create images
    that scale appropriately at really low resolutions (around 320 x 240) and really
    high resolutions (2,048 x 1,536). Desktop browsing is pretty much the same nowadays
    where user experience is tailored to satisfy a range of viewport dimensions. Satisfying
    a range of viewport dimensions is often referred to as **responsive design**.


    While SVG itself has limited support in older browsers, we can still provide vector
    graphics solutions. We now see that vector graphics are utilized more readily
    in websites and applications. By this token, we''re witnessing a shift in design
    from rigid, albeit more polished artwork to flexible vector-based designs.


    With this said, there is now greater importance placed on being able to work with
    the vector graphics produced by graphics editing software. While there is no silver
    bullet approach to working with existing SVGs in Raphaël, with a little determination
    we can utilize the existing SVGs in our projects.


    In this chapter we will look at the following:


    +   - The Inkscape vector graphics editor

    +   - The manual method of inspecting SVG paths

    +   - SVG to Raphaël conversion tools

    +   - Choropleth maps as an example of an existing SVG'
  md: "\n\n## Vector Animation\n\nWe define a custom attribute, popDensity, for a\
    \ visual representation of this data as per the aforementioned rules:\n\n```javascript\n\
    paper.customAttributes.popDensity = function(population, density) {\n    var radius\
    \ = 25 + (25 * population),\n        fillColor = 'hsb(0,0,' + (1 - density) +\
    \ ')'; \n    return {\n        fill: fillColor,\n        r: radius\n    };\n};\n\
    ```\n\nThis method defines a radius that is 25px plus 25 multiplied by the relative\
    \ population of the country meaning that the most populous country has a radius\
    \ of 50px, the least populous has a radius of 25px and all other countries have\
    \ a radius somewhere in between these two values. The fill color is determined\
    \ as a proportion of the brightness where hue and saturation are fixed. The formula,\
    \ (1 – density), will return a value of 1 (a saturation giving a white color)\
    \ for the least densely populated countries and a value of 0 (a saturation giving\
    \ a black color) for the most densely populated countries. All values of saturation\
    \ in between 0 and 1 give rise to shades of gray.\n\nGiven that we define our\
    \ dataset as an array of objects like so:\n\n```javascript\nvar data = [\n   \
    \ {\n        name: 'Taiwan',\n        population: 0.1,\n        density: 1\n \
    \   },\n    {\n        name: 'South Korea',\n        population: 0.32,\n     \
    \   density: 0.5\n    },\n    // ...\n];\n```\n\nWe can iterate over each country\
    \ and draw a circle with a popDensity attribute as follows:\n\n```javascript\n\
    var currentX = 70;\nfor(var i = 0, ii = data.length; i < ii; i+=1) {\n    var\
    \ country = data[i];\n    paper.circle(currentX, 150, 50).attr({\n        popDensity:\
    \ [country.population, country.density],\n        'stroke-width': 4\n    });\n\
    \    paper.text(currentX, 225, country.name).attr({\n        'font-size': 14\n\
    \    });\n\n    currentX += 100;\n}\n```\n\nDuring each iteration of the loop,\
    \ the population density attributes are determined from our data objects and are\
    \ drawn to our canvas. We have labeled each circle with the country's name as\
    \ text and incremented the x-point so that successive circles are drawn to the\
    \ right of the previous one. The result is shown here:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_85_0.png)\n\
    \nAs you can see, the most populous countries do not necessarily have the largest\
    \ population densities. While Taiwan and the Netherlands have roughly equal populations,\
    \ Taiwan has significantly more people per square kilometer than the Netherlands.\n\
    \nAs mentioned, we can animate custom attributes from one set of values to another\
    \ set of values. Consider what happens if we set the population and density values\
    \ equal to zero for all of our elements when they are initialized in the loop\
    \ and then animate to the real values of population and density:\n\n```javascript\n\
    var currentX = 70;\nfor(var i = 0, ii = data.length; i < ii; i+=1) {\n    var\
    \ country = data[i];\n    var circle = paper.circle(currentX, 150, 50).attr({\n\
    \        popDensity: [0, 0],\n        'stroke-width': 4\n    });\n    circle.animate({\n\
    \        popDensity: [country.population, country.density]\n    }, 1000, 'easeOut');\n\
    \    paper.text(currentX, 225, country.name).attr({\n        'font-size': 14\n\
    \    });\n    currentX += 100;\n}\n```\n\nYou will notice when running this code\
    \ that both the radius and fill attributes are animated to their final states.\n\
    \n## Animation along a path\n\nOver the course of an animation, attribute values\
    \ vary according to the easing specified and the time that has elapsed. Custom\
    \ attributes work in the same way. In that, the values passed to a custom attribute\
    \ function are dependent on the easing and the time elapsed. We can utilize this\
    \ feature to animate elements along a given path.\n\nTo begin, we draw a cubic\
    \ Bézier curve along which a circle will be animated:\n\n```javascript\nvar path\
    \ = paper.path([\n    'M', 100, 100,\n    'C', 100, 0, 400, 200, 400, 100,\n \
    \   'S', 100, 200, 100, 100,\n    'z'\n]).attr({'stroke-width': 2});\nvar circle\
    \ = paper.circle(0, 0, 13).attr({\n    fill: '#09c', cursor: 'pointer'\n});\n\
    ```\n\nOur circle is initialized to the (0, 0) point since we are going to apply\
    \ a custom attribute to it to determine its initial position.\n\nOur custom attribute,\
    \ which we'll name `pathFactor`, determines the point on the path at which our\
    \ circle should lie given how much of the animation has elapsed. If we define\
    \ `distance = 0` as the start point of our animation and `distance = 1` as the\
    \ end point, we can multiply distance by the total length of the path to determine\
    \ how much of its length our circle should traverse:\n\n```javascript\npaper.customAttributes.pathFactor\
    \ = function(distance) {\n    var point = path.getPointAtLength(distance * pathLength);\n\
    \    var dx = point.x,\n        dy = point.y;\n    return {\n        transform:\
    \ ['T', dx, dy]\n    };\n};\n```\n\nWe always return an absolute transformation\
    \ that uses the (_x_, _y_) point on the path to determine where on the path our\
    \ circle lies.\n\nIn order to animate our circle, we first initialize its `pathFactor`\
    \ attribute to zero. This has the effect of placing it at the zero-length point\
    \ of our path, which is the point at which we started drawing it, which is, (100,\
    \ 100):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_87_0.png)\n\nTo animate our\
    \ circle along the path, we define and execute a `runloop` function that initializes\
    \ an animation of our `pathFactor` attribute to a value of 1. Our end of the animation\
    \ callback resets `pathFactor` to zero and then invokes `runloop` recursively.\
    \ You will notice that our recursive function call is done as a callback to `setTimeout`;\
    \ this is to ensure that the minimum time required for the browser to progress\
    \ to the next iteration in the cycle elapses before the animation is repeated:\n\
    \n```javascript\nfunction runloop() {\n    circle.animate({pathFactor: 1}, 4000,\
    \ function() {\n        this.attr({pathFactor: 0}); // Reset\n        setTimeout(runloop);\n\
    \    });\n}\nrunloop();\n```\n\nWhen this code is executed, you will see that\
    \ our circle is animated along our path forever, taking four seconds to traverse\
    \ the path from the start point and back again.\n\n## Pausing and resuming animation\n\
    \nWe have not yet looked at the ability to pause and resume animations. Consider,\
    \ in the example of animating along a path, if we define click and double-click\
    \ event handlers on our circle as part of our run loop like so:\n\n```javascript\n\
    function runloop() {\n    circle.animate({pathFactor: 1}, 4000, function() {\n\
    \        this.attr({pathFactor: 0}); // Reset\n        setTimeout(runloop);\n\
    \    });\n    circle.unclick().click(function() {\n        this.pause();\n   \
    \ });\n    circle.undblclick().dblclick(function() {\n        this.resume();\n\
    \    });\n}\nrunloop();\n```\n\nWe unregister and then re-register the click and\
    \ double-click event handlers on each animation run since a new animation is started\
    \ each time. When running this code, you will see that the pause and resume methods\
    \ have the effect of pausing the current animation that is running on the circle\
    \ when clicked and double-clicked respectively. The result of pausing the animation\
    \ at a quarter of the way through its cycle (t = 0.25) or three quarters of the\
    \ way through its cycle (t = 0.75) is shown:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_88_0.png)\n\
    \n## Summary\n\nOver the course of this chapter we have looked at the concepts\
    \ driving animation and the different ways in which we can attribute elements\
