    | Japan | 1.00 | 0.00 |'
  md: "\nLikewise, a rectangle at (100, 50) is animated to a point (400, 100) in x\
    \ and y with increased width, reduced opacity, and a larger stroke-width as follows:\n\
    \n```javascript\nvar rectangle = paper.rect(100, 50, 20, 50).attr({\n    fill:\
    \ '#345'\n});\nrectangle.animate({\n    opacity: 0.6,\n    x: 400,\n    y: 100,\n\
    \    width: 100,\n    'stroke-width': 10\n}, 1000);\n```\n\nThe result is as follows:\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_77_0.png)\n\n## Animating paths\n\n\
    The `path` attribute of an element allows us to animate paths in the same way\
    \ that we animated attributes in the previous section. While the basic shapes\
    \ have intrinsic `x` and `y` or `cx` and `cy` attributes and width and height,\
    \ paths do not and so we will animate custom paths from one path to another.\n\
    \nConsider drawing a star as follows:\n\n```javascript\nvar star = paper.path(\n\
    \    'M 100,40 40,210 190,90 10,90 160,210 z'\n);\n```\n\n## Vector Animation\n\
    \nThe star is a polygon whose lines overlap. This makes for an interesting effect\
    \ when animating the star to an arbelos shape. To demonstrate this, we define\
    \ a square that when clicked initializes a path animation as follows:\n\n```javascript\n\
    var square = paper.rect(500, 100, 50, 50).attr({\n    'fill': '#09c', cursor:\
    \ 'pointer'\n});\nsquare.click(function() {\n    star.animate({\n        path:\
    \ [\n            'M', 100, 180,\n            'a', 140, 140, 0, 0, 1, 280, 0,\n\
    \            90, 90, 0, 0, 0, -180, 0,\n            50, 50, 0, 0, 0, -100, 0\n\
    \        ]\n    }, 1000);\n});\n```\n\nWhen running this code, you will see that\
    \ the triangle is smoothly translated into an arbelos as shown:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_78_0.png)\n\
    \nThere is a particularly good example of path animation on the Raphaël website\
    \ at http://raphaeljs.com/chart.html. The example demonstrates the cubic Bézier\
    \ curve animation when toggling through months. We can achieve something similar\
    \ using the Catmull-Rom curves we encountered in Chapter 3, Drawing Paths. We\
    \ begin by defining initial and end Catmull-Rom paths and drawing the first one\
    \ on to our canvas:\n\n```javascript\nvar pathStart = [\n    'M', 50, 250,\n \
    \   'R', 100, 100, 150, 150, 200, 140, 250, 200, 300, 80,\n    350, 130, 400,\
    \ 250,\n    'H', 50,\n    'z'\n];\nvar pathEnd = [\n    'M', 50, 250,\n    'R',\
    \ 100, 130, 150, 220, 200, 200, 250, 100, 300, 200,\n    350, 180, 400, 250,\n\
    \    'H', 50,\n    'z'\n];\nvar curve = paper.path(pathStart).attr({\n    'stroke-width':\
    \ 0,\n    'stroke-linejoin': 'round',\n    'fill': 'green'\n});\n```\n\nYou will\
    \ notice that we have joined a straight line to the start point on each path.\
    \ This is because simply closing a Catmull-Rom curve will continue with the curvature\
    \ of the path and not give us a straight line. On clicking on a square, we animate\
    \ the curve to the end path as follows:\n\n```javascript\nsquare.click(function()\
    \ {\n    curve.animate({\n        path: pathEnd\n    }, 500);\n});\n```\n\nThe\
    \ result is shown here:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_79_0.png)\n\
    \n## Animation easing\n\n**Easing** describes how the value of an attribute varies\
    \ with regard to time. By default, the value of an attribute changes consistently\
    \ — that is, _linearly_ — over the course of an animation but by specifying a\
    \ particular easing type, we can change the way in which the attribute is animated.\
    \ Consider the following graph that demonstrates three of the available easing\
    \ types:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_80_0.png)\n\nFor each easing\
    \ type, the rate at which the attribute changes varies along the graph in the\
    \ time axis. Each easing type can be described as such:\n\n- **Linear**: The value\
    \ varies consistently from its start value to its end value over the course of\
    \ the animation\n- **Ease Out**: The value increases quickly towards its end point\
    \ before slowing down towards the end of the animation\n- **Ease In Out**: The\
    \ value decreases slowly at first and then increases quickly before finally slowing\
    \ down to its end point towards the end of the animation\n\n## Built-in easing\
    \ formulas\n\nRaphaël has a number of built-in easing types including those detailed\
    \ in the previous section and others such as 'elastic' or 'bounce'. The effect\
    \ of each is well-demonstrated at http://raphaeljs.com/easing.html wherein the\
    \ cx and opacity of circles are animated with different easing types. As an example,\
    \ consider applying an easing type of 'bounce' to our Catmull-Rom path animation\
    \ curve:\n\n```javascript\nsquare.click(function() {\n    curve.animate({\n  \
    \      path: pathEnd\n    }, 500, 'bounce');\n});\n```\n\nIn this instance, the\
    \ attribute value is `path`, which is quickly animated to its end point and then\
    \ back again until finally coming to rest. The change in the path with regard\
    \ to time is illustrated here:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_81_0.png)\n\
    \n## Custom easing using the cubic Bézier format\n\nThe format for CSS3 transitions\
    \ describing animation easing can be used to define custom easing paths in Raphaël.\
    \ The syntax is `cubic-bezier(point1_x, point1_y, point2_x, point2_y)`, where\
    \ each parameter defines the _x_ and _y_ positions of anchor points describing\
    \ a cubic Bézier curve from (0, 0) to (1,1) in attribute value and time. Consider\
    \ the easing path that describes an attribute value that increases very sharply\
    \ and then almost comes to a stop before finally easing in to its end point:\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_81_1.png)\n\nThe CSS3 syntax that describes\
    \ this path is `cubic-bezier(0.1, 0.97, 0.08, 0.03)`. This was generated using\
    \ a useful tool at `http://www.roblaplaca.com/examples/bezierBuilder/` that allows\
    \ you to visually construct your custom easing path and get the `cubic-bezier`\
    \ values for the resultant easing.\n\nBy way of example consider two circles,\
    \ one of which is animated in `cx` with this easing while the other has linear\
    \ easing:\n\n```javascript\ncircle.animate({\n    cx: 450\n}, 1000, \"cubic-bezier(0.10,0.97,0.08,0.03)\"\
    );\ncircle2.animate({\n    cx: 450\n}, 1000, 'linear');\n```\n\nWhen this code\
    \ is run you will see that the first circle sets off much quicker than the second\
    \ but by the end of the animation the `cx` value varies approximately linearly\
    \ for both circles.\n\n## Animating transformations\n\nAs with paths, an element’s\
    \ transform is an attribute on the element meaning we can animate in the same\
    \ manner. Consider, for instance, a square that we can rotate on a click:\n\n\
    ```javascript\nsquare.click(function() {\n    this.animate({\n        transform:\
    \ '...r 45'\n    }, 300);\n});\n```\n\nThe ellipsis ensures that every successive\
    \ click will rotate the square from its current position by 45 degrees in the\
    \ clockwise direction.\n\nSimilarly, we can animate more complex transformations.\
    \ Consider, for instance, successively animating a square with a 5-degree shear\
    \ in `x`:\n\n```javascript\nvar anim = Raphael.animation({\n    transform: [\n\
    \        '...', 'M', 1, 0, Math.tan(Raphael.rad(5)), 1, 0, 0\n    ]\n}, 300);\n\
    square.click(function() {\n    this.animate(anim);\n});\n```\n\nSuccessive clicks\
    \ of the square give rise to an additional shear of five degrees relative to the\
    \ _y_-axis. You will notice that in this example we have defined an `animation`\
    \ object and then passed this to the `animate` method on the square when clicked.\
    \ This is an alternative way of defining animations and is useful in that we can\
    \ re-use them.\n\n## Animation using custom attributes\n\nRaphaël facilitates\
    \ advanced animation via **custom attributes**. Custom attributes can be used\
    \ to apply, or animate, multiple attributes on a particular element based on custom-defined\
    \ logic.\n\n## Custom attributes\n\nA custom attribute is a custom-defined function\
    \ that returns a set of attributes to be applied to an element. It can be thought\
    \ of as a helper function for which existing attributes are derived based on calculation.\
    \ A custom attribute is defined as an attribute of the `customAttributes` namespace\
    \ as follows:\n\n```javascript\nPaper.customAttributes.yourAttribute = function(a1,\
    \ a2, ...){ };\n```\n\nHere, the `a1`, `a2`, ... arguments are numeric and `yourAttribute`\
    \ is the name of the custom attribute. A custom attribute can then be used in\
    \ the same ways that we have used other element attributes so far.\n\nAs an example,\
    \ consider that we need to represent population data using the following:\n\n\
    - The radius of a circle to indicate relative population size\n- The color of\
    \ a circle to indicate how densely populated a country is\n\nThe following data\
    \ represents the relative populations and population densities of five countries:\n\
    \n| Country | Population (normalized between 0 and 1) | Population density (normalized\
    \ between 0 and 1) |\n|---------|-----------------------------------------|-------------------------------------------------|\n\
    | Taiwan | 0.10 | 1.00 |\n| South Korea | 0.32 | 0.50 |\n| Netherlands | 0.05\
    \ | 0.22 |\n| Belgium | 0.00 | 0.07 |\n| Japan | 1.00 | 0.00 |\n"
  mdcn: "\n\n同样，位于 (100, 50) 的矩形在 x 和 y 方向上被动画化到点 (400, 100)，同时宽度增加，不透明度降低，描边宽度增大，如下所示：\n\
    \n```javascript\nvar rectangle = paper.rect(100, 50, 20, 50).attr({\n    fill:\
    \ '#345'\n});\nrectangle.animate({\n    opacity: 0.6,\n    x: 400,\n    y: 100,\n\
    \    width: 100,\n    'stroke-width': 10\n}, 1000);\n```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_77_0.png)\n\
    \n## 动画路径\n\n元素的 `path` 属性允许我们像在上一节中动画化属性一样动画化路径。虽然基本形状具有内在的 `x` 和 `y` 或 `cx`\
    \ 和 `cy` 属性以及宽度和高度，但路径没有，因此我们将从一个路径动画化到另一个自定义路径。\n\n考虑绘制一个五角星，如下所示：\n\n```javascript\n\
    var star = paper.path(\n    'M 100,40 40,210 190,90 10,90 160,210 z'\n);\n```\n\
    \n## 矢量动画\n\n五角星是一个线条相互重叠的多边形。当将五角星动画化为阿贝洛斯形状时，这会产生一个有趣的效果。为了演示这一点，我们定义一个正方形，当点击时初始化一个路径动画，如下所示：\n\
    \n```javascript\nvar square = paper.rect(500, 100, 50, 50).attr({\n    'fill':\
    \ '#09c', cursor: 'pointer'\n});\nsquare.click(function() {\n    star.animate({\n\
    \        path: [\n            'M', 100, 180,\n            'a', 140, 140, 0, 0,\
    \ 1, 280, 0,\n            90, 90, 0, 0, 0, -180, 0,\n            50, 50, 0, 0,\
    \ 0, -100, 0\n        ]\n    }, 1000);\n});\n```\n\n运行此代码时，您将看到三角形被平滑地转换为阿贝洛斯形状，如下所示：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_78_0.png)\n\nRaphaël 网站上有一个非常好的路径动画示例，网址为\
    \ http://raphaeljs.com/chart.html。该示例演示了在切换月份时的三次贝塞尔曲线动画。我们可以使用在第 3 章“绘制路径”中遇到的\
    \ Catmull-Rom 曲线来实现类似的效果。我们首先定义初始和结束的 Catmull-Rom 路径，并将第一个绘制到画布上：\n\n```javascript\n\
    var pathStart = [\n    'M', 50, 250,\n    'R', 100, 100, 150, 150, 200, 140, 250,\
    \ 200, 300, 80,\n    350, 130, 400, 250,\n    'H', 50,\n    'z'\n];\nvar pathEnd\
    \ = [\n    'M', 50, 250,\n    'R', 100, 130, 150, 220, 200, 200, 250, 100, 300,\
    \ 200,\n    350, 180, 400, 250,\n    'H', 50,\n    'z'\n];\nvar curve = paper.path(pathStart).attr({\n\
    \    'stroke-width': 0,\n    'stroke-linejoin': 'round',\n    'fill': 'green'\n\
    });\n```\n\n您会注意到我们在每个路径的起点处连接了一条直线。这是因为简单地闭合 Catmull-Rom 曲线将继续沿着路径的曲率，而不会给我们一条直线。点击正方形时，我们将曲线动画化到结束路径，如下所示：\n\
    \n```javascript\nsquare.click(function() {\n    curve.animate({\n        path:\
    \ pathEnd\n    }, 500);\n});\n```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_79_0.png)\n\
    \n## 动画缓动\n\n**缓动**描述了属性值随时间变化的方式。默认情况下，属性值在动画过程中均匀变化——即 _线性_ 变化——但通过指定特定的缓动类型，我们可以改变属性的动画方式。请参考下图，该图演示了三种可用的缓动类型：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_80_0.png)\n\n对于每种缓动类型，属性值的变化率在时间轴上的图表中有所不同。每种缓动类型可以描述如下：\n\
    \n- **线性**：值在动画过程中从起始值一致地变化到结束值\n- **缓出**：值快速增加到其终点，然后在动画结束前减速\n- **缓入缓出**：值起初缓慢减少，然后快速增加，最后在动画结束前减速到其终点\n\
    \n## 内置缓动公式\n\nRaphaël 拥有多种内置缓动类型，包括上一节中详细介绍的那些，以及诸如 'elastic' 或 'bounce' 等其他类型。每种效果在\
    \ http://raphaeljs.com/easing.html 上都有很好的演示，其中圆形的 cx 和不透明度使用不同的缓动类型进行动画化。例如，考虑将\
    \ 'bounce' 缓动类型应用于我们的 Catmull-Rom 路径动画曲线：\n\n```javascript\nsquare.click(function()\
    \ {\n    curve.animate({\n        path: pathEnd\n    }, 500, 'bounce');\n});\n\
    ```\n\n在此示例中，属性值为 `path`，它快速动画化到其终点，然后再返回，直到最终停止。路径随时间的变化如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_81_0.png)\n\
    \n## 使用三次贝塞尔格式自定义缓动\n\nCSS3 过渡中描述动画缓动的格式可以用于在 Raphaël 中定义自定义缓动路径。语法为 `cubic-bezier(point1_x,\
    \ point1_y, point2_x, point2_y)`，其中每个参数定义描述从 (0, 0) 到 (1,1) 的三次贝塞尔曲线的锚点的 _x_ 和\
    \ _y_ 位置，用于属性值和时间。请考虑描述一个属性值非常急剧增加，然后几乎停止，最后缓入到其终点的缓动路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_81_1.png)\n\
    \n描述此路径的 CSS3 语法为 `cubic-bezier(0.1, 0.97, 0.08, 0.03)`。这是使用 `http://www.roblaplaca.com/examples/bezierBuilder/`\
    \ 上的一个有用工具生成的，该工具允许您直观地构建自定义缓动路径并获得生成的缓动的 `cubic-bezier` 值。\n\n例如，考虑两个圆形，其中一个使用此缓动在\
    \ `cx` 中动画化，而另一个具有线性缓动：\n\n```javascript\ncircle.animate({\n    cx: 450\n}, 1000,\
    \ \"cubic-bezier(0.10,0.97,0.08,0.03)\");\ncircle2.animate({\n    cx: 450\n},\
    \ 1000, 'linear');\n```\n\n运行此代码时，您将看到第一个圆形启动速度比第二个快得多，但到动画结束时，两个圆形的 `cx` 值均大致呈线性变化。\n\
    \n## 动画变换\n\n与路径一样，元素的变换是元素上的一个属性，因此我们可以以同样的方式进行动画化。例如，考虑一个我们可以在点击时旋转的正方形：\n\n\
    ```javascript\nsquare.click(function() {\n    this.animate({\n        transform:\
    \ '...r 45'\n    }, 300);\n});\n```\n\n省略号确保每次连续点击都会使正方形从当前位置顺时针旋转 45 度。\n\n同样，我们可以动画化更复杂的变换。例如，考虑依次对正方形进行\
    \ x 方向 5 度的剪切：\n\n```javascript\nvar anim = Raphael.animation({\n    transform:\
    \ [\n        '...', 'M', 1, 0, Math.tan(Raphael.rad(5)), 1, 0, 0\n    ]\n}, 300);\n\
    square.click(function() {\n    this.animate(anim);\n});\n```\n\n连续点击正方形会产生相对于\
    \ y 轴额外五度的剪切。您会注意到，在此示例中，我们定义了一个 `animation` 对象，然后在点击正方形时将其传递给正方形的 `animate` 方法。这是定义动画的另一种方法，很有用，因为我们可以重复使用它们。\n\
    \n## 使用自定义属性进行动画\n\nRaphaël 通过 **自定义属性** 促进高级动画。自定义属性可用于基于自定义逻辑对特定元素应用或动画化多个属性。\n\
    \n## 自定义属性\n\n自定义属性是一个自定义函数，返回一组要应用于元素的属性。它可以被视为一个辅助函数，其中现有属性基于计算得出。自定义属性定义为 `customAttributes`\
    \ 命名空间的一个属性，如下所示：\n\n```javascript\nPaper.customAttributes.yourAttribute = function(a1,\
    \ a2, ...){ };\n```\n\n这里，`a1`、`a2` 等参数是数字，`yourAttribute` 是自定义属性的名称。然后，自定义属性可以像我们迄今使用的其他元素属性一样使用。\n\
    \n例如，假设我们需要使用以下方式表示人口数据：\n\n- 圆的半径表示相对人口规模\n- 圆的颜色表示国家的人口密度\n\n以下数据表示五个国家的相对人口和人口密度：\n\
    \n| 国家 | 人口（0 到 1 之间归一化） | 人口密度（0 到 1 之间归一化） |\n|---------|-----------------------------------------|-------------------------------------------------|\n\
    | 台湾 | 0.10 | 1.00 |\n| 韩国 | 0.32 | 0.50 |\n| 荷兰 | 0.05 | 0.22 |\n| 比利时 | 0.00\
    \ | 0.07 |\n| 日本 | 1.00 | 0.00 |\n\n"
