    \ rounds this value up to the nearest one person.\n\nHaving determined the number\
    \ of icons we need to highlight, we then iterate over them using the `forEach`\
    \ method of the set object:\n\n```\n```javascript\npeople.forEach(function(o)\
    \ {\n  if(o.id < numPeople) {\n    o.animate({opacity: 1}, 500);\n    return true;\n\
    \  }\n  return false;\n});\n```\n```\n\nThe `forEach` method passes the object\
    \ in the set to the function it accepts as the first parameter. This object has\
    \ an `id` attribute corresponding to its indexed position in the set. It is a\
    \ zero-based ID meaning that we can compare its value during looping to see if\
    \ it is less than the `numPeople` variable that should be highlighted. If it is,\
    \ we animate it to an opacity of 1 that differentiates between all other defined\
    \ icons whose opacity is 0.3. The time taken to iterate over all paths in the\
    \ `people` set is negligible meaning that all animations appear to take place\
