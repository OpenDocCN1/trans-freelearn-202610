    # ## Ready Set Raphaël


    Ready Set Raphaël (http://www.readysetraphael.com) is a web-based SVG converter
    that allows you to upload an image and grab the resultant Raphaël code. It supports
    SVG groups, ellipses, polygons, text, circles, paths, and rectangles and parses
    all associated styling information into element attributes:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_100_0.png)


    To use it, you simply upload an existing SVG image and click on the **Copy the
    Code** button.


    To test this out, download one of the sample files from http://www.readysetraphael.com
    at the bottom of the page and copy and paste the resultant code into an HTML document
    between the `<script></script>` tags. Note that you will need to create an HTML
    element with an ID `rsr`:'
  md: "\n\n## Inkscape\n\nInkscape is an open source SVG editor whose feature set\
    \ is similar to that of Adobe Illustrator. It is used by many designers given\
    \ that:\n\n- It is open source and actively maintained / developed\n- There are\
    \ a good number of tutorials available available online\n- It has a comprehensive\
    \ feature set\n- It conforms to the W3C standards SVG\n\nInkscape also has the\
    \ advantage of being cross-platform with releases available for Windows, Mac,\
    \ and Linux.\n\n## Downloading Inkscape\n\nInkscape is available for download\
    \ at `http://inkscape.org/download/`. It is recommended that you download the\
    \ latest stable release, which is 0.48.4 at the time of writing.\n\n## Getting\
    \ started with Inkscape\n\nWhile an in-depth coverage of Inkscape is beyond the\
    \ scope of this book, we will look at creating some basic SVGs using Inkscape\
    \ using the following steps:\n\n1. To begin, open up Inkscape and choose **File\
