    # # Path drawing concepts


    The process of drawing with a pen on paper can be broken down into the following
    steps:


    +   1. You place your pen at a particular point on a piece of paper.

    +   2. You press and move the pen freely from this point to another point.

    +   3. You keep your pen at this point or lift up the pen and place it at another
    point on the paper.

    +   4. The process is repeated until you have finished drawing.


    Path drawing works in much the same way. The point at which you place your pen,
    known as the **current point**, defines the start of a path while the free movement
    of the pen describes the path itself.


    Consider drawing an arbelos shape. We first place our pen at a point (100, 180)
    on our canvas and draw an arc to the point (380, 180) as shown:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_42_0.png)


    We then create an arc from the point (380, 180) to the point (200, 180):


    ![](img/d8ec653db4cab13fec8b3f5718174af6_42_1.png)'
