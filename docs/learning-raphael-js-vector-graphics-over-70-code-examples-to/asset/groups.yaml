    # # Animation using custom attributes


    Raphaël facilitates advanced animation via **custom attributes**. Custom attributes
    can be used to apply, or animate, multiple attributes on a particular element
    based on custom-defined logic.


    # # Custom attributes


    A custom attribute is a custom-defined function that returns a set of attributes
    to be applied to an element. It can be thought of as a helper function for which
    existing attributes are derived based on calculation. A custom attribute is defined
    as an attribute of the `customAttributes` namespace as follows:


    ```

    `Paper.customAttributes.yourAttribute = function(a1, a2, ...){ };`

    ```


    Here, the `a1`, `a2`, ... arguments are numeric and `yourAttribute` is the name
    of the custom attribute. A custom attribute can then be used in the same ways
    that we have used other element attributes so far.


    As an example, consider that we need to represent population data using the following:


    +   - The radius of a circle to indicate relative population size

    +   - The color of a circle to indicate how densely populated a country is


    The following data represents the relative populations and population densities
    of five countries:


    | Country | Population (normalized between 0 and 1) | Population density (normalized
    between 0 and 1) |

    |---------|-----------------------------------------|-------------------------------------------------|

    | Taiwan | 0.10 | 1.00 |

    | South Korea | 0.32 | 0.50 |

    | Netherlands | 0.05 | 0.22 |

