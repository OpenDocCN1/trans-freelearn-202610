    \nOne of the great features of Inkscape is the ability to view and edit an SVG’s\
    \ XML markup directly. Consider the example of the circle in the previous section.\
    \ If you click on **Edit | XML Editor**, you will be presented with the SVG’s\
    \ document structure. Clicking on the element you have created on the left—the\
    \ `svg:path` element—will list all of the object’s attributes including the `d`\
    \ attribute, which is the element’s path prior to the transformations being applied.\
    \ Clicking on the `d` attribute reveals the path for the element:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_97_0.png)\n\
    \n## Working with Existing SVGs\n\nIf we take this path and use it in Raphaël\
    \ as follows:\n\n```javascript\nvar initialPath = 'M 197,94.46 '\n + 'A 98.5,94.5\
    \ 0 1 1 167.39,26.92 L 98.5,94.46 z';\nvar pac = paper.path(initialPath);\npac.attr({fill:\
    \ '#09c', 'stroke-width': 0});\n```\n\nThen it is drawn onto our canvas as shown:\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_98_0.png)\n\nGoing back into Inkscape,\
    \ move the arc anchor point so as to close the \"mouth\" of the segment that we\
    \ created:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_98_1.png)\n\nAs before,\
    \ we get the path for this element using the XML Editor.\n\nWe can achieve an\
    \ interesting effect here with relatively little effort using path animation,\
    \ animating from the former \"open mouth\" path to the latter \"closed mouth\"\
    \ path. To begin, we define a function named move that determines the x and y\
    \ coordinates of our pac element based on rotation (which is initialized to zero\
    \ to begin with):\n\n```javascript\nvar rotation = 0;\nvar move = function() {\n\
    \    var x = Math.cos(Raphael.rad(rotation)) * 800;\n    var y = Math.sin(Raphael.rad(rotation))\
    \ * 800;\n}\n```\n\nNext we animate the element to our new path or \"closed mouth\"\
    \ path:\n\n```javascript\npac.animate({\n    path: 'M 197,94.46 ',\n    + 'a 98.5,94.5\
    \ 0 1 1 -2.1e-4,-0.194727, L 98.5,94.46 z',\n    transform: ['...T', x, y]\n},\
    \ 500, function() {\n    // Rotate our element and reset the path\n    rotation\
    \ += 90;\n    pac.attr({\n        path: initialPath\n    }).transform(['...R',\
    \ 90]);\n    setTimeout(move);\n});\n```\n\nWe apply a translation based on the\
    \ x and y coordinates of our element over half a second. Once the animation has\
    \ finished, we rotate our element. Note that the transformation is prefixed with\
    \ an ellipsis that ensures that any translation takes the rotation into account\
    \ after a 90-degree rotation, translations will be along the y-axis. This is repeated\
    \ ad infinitum by calling setTimeout on our move function.\n\nWhen this code is\
    \ run, the \"mouth\" goes from being open to closed during the length of one animation\
    \ and is then repeated with an applied rotation. The rotation has the effect of\
    \ moving our element along the edge of our container (this demo is available in\
    \ the source code and website accompanying this book).\n\n## Taking paths from\
    \ an existing SVG image\n\nSince SVG images are just XML files, you can open them\
    \ in your text editor in order to obtain the path information. Often it is just\
    \ as simple as copying and pasting path information from individual `path` elements\
    \ in the XML. While this is, as mentioned, cumbersome, there are other problems\
