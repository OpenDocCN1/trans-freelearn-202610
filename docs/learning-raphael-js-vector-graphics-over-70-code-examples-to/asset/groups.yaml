    \ For example, applying the transformation string \"m 1 0 0.5 1 0 0\" (Sx = 0.5,\
    \ Sy = 0) to a square has the effect of transforming it into a rhombus in x:\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_69_0.png)\n\nUsually we want to apply\
    \ a shear at angles relative to the x and y axis respectively. This is demonstrated\
    \ at http://raphaeljsvectorgraphics.com/the-graphical-web/css3-raphael-transforms.\
    \ In order to achieve this, we use the following transformation matrix:\n\n```\n\
    ⎡a   c   e⎤   ⎡1   tan(α)   0⎤\n⎢b   d   f⎥ = ⎢tan(β)   1   0⎥\n⎣0   0   1⎦  \
    \ ⎣0   0   1⎦\n```\n\nIn this form, the angle β is the angle of shear clockwise\
    \ relative to the x-axis (giving a resultant shear in y) and α is the angle of\
    \ shear counterclockwise relative to the y-axis (giving a resultant shear in x).\
    \ Consider the following transformation on a square:\nSquare.transform(\n\t['m',\
    \ 1, 0, Math.tan(Raphael.rad(25)), 1, 0, 0]\n\t);\nA 25 degrees transformation\
    \ is applied relative to the y-axis giving a shear in x.\n\n"
  mdcn: "\n\n## 转换与事件处理\n\n在此，我们已合并命令。在此示例中，转换是相互独立的，这意味着每个命令的大小写无关紧要。但是，请考虑绕点旋转：\n\
    \n```\ntriangleCopy.transform(\"t 100 0 r 180 220 100\");\n```\n\n此转换首先将我们的三角形在\
    \ _x_ 方向上平移 100px，然后顺时针旋转 180 度。我们的旋转点 (220, 100) 并非三角形旋转的点，因为旋转点实际上在 _x_ 方向上平移了\
    \ 100px 到新点 (320, 100)。此处需要注意的重要点是，**小写转换命令会考虑之前的转换**：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_64_0.png)\n\
    \n在绝对旋转命令 R 的情况下，绕点 (220, 100) 的旋转同样发生在平移之后，但结果与下图所示截然不同。转换字符串 `t 100,0 R 180,220,100`\
    \ 始终绕点 (220, 100) 旋转元素，与之前的转换无关：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_64_1.png)\n\
    \n## 缩放\n\n缩放可以在所有点上均等地关于缩放点进行，也可以在 x 和 y 方向上按因子进行。t 300 0 s 0.5 转换的缩放将所有点按其原始大小的\
    \ 0.5 倍关于元素中心点进行缩放，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_65_0.png)\n\
    \n转换字符串 t 310 0 s 1.2 0.5 在 x 和 y 方向上按因子进行缩放，将元素在 x 方向上缩放 1.2 倍，在 y 方向上缩放 0.5\
    \ 倍，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_65_1.png)\n\n## 基本事件处理\n\
    \nRaphaël 支持在元素上注册和注销一整套事件处理程序。我们鼓励您尝试可用的事件处理程序，其中一些我们将通过示例演示。\n\n## 注册基本事件处理程序\n\
    \n我们将演示在 salinon 图形上注册双击、鼠标悬停和鼠标移出事件处理方法。首先，我们可以按以下方式绘制 salinon：\n\n```\nvar salinon\
    \ = paper.path([\n    'M', 100, 200,\n    'a', 150, 150, 0, 0, 1, 300, 0,\n  \
    \  50, 50, 0, 0, 0, -100, 0,\n    50, 50, 0, 0, 1, -100, 0,\n    50, 50, 0, 0,\
    \ 0, -100, 0\n]);\n```\n\n然后我们按以下方式定义上述事件处理程序，其中每个程序在元素上创建一个转换：\n\n```\nsalinon.mouseover(function()\
    \ {\n    this.transform('R 180');\n});\nsalinon.dblclick(function() {\n    this.transform('r\
    \ 45');\n});\nsalinon.mouseout(function() {\n    this.transform('');\n});\n```\n\
    \n这产生的效果是：\n\n- 当将鼠标移到元素上时，它将旋转 180 度\n- 当双击元素时，它将旋转 45 度\n- 当将鼠标移出元素时，转换将被重置\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_66_0.png)\n\n关于转换的重置，向 transform 方法传递空字符串的效果是将图形返回到其原始位置。\n\
    \n您会发现，运行前面的代码时，45 度旋转是相对于其初始位置执行的，而不是相对于 180 度旋转定义的位置。这是因为 transform 方法的每次调用都相对于元素的原始状态。但是，如果我们想要从元素的当前状态（即前一次\
    \ transform 调用所产生的状态）转换元素，我们可以在转换命令前加上省略号，以追加新的转换。请考虑以下转换：\n\n```\nsalinon.click(function()\
    \ {\n    this.transform('t 300 0 R 180');\n});\nsalinon.dblclick(function() {\n\
    \    this.transform('...t 200 0 r 45');\n});\n```\n\n第一个转换在单击时调用，将元素在 x 方向上平移\
    \ 300px，并顺时针旋转 180 度。第二个转换在双击时调用，其起始命令前加有省略号，将在当前旋转的基础上再平移 200px 并顺时针旋转 45 度。请注意，x\
    \ 方向上的额外 100px 平移是在负 x 方向上，这是因为我们考虑了之前的 180 度旋转。这意味着我们的 salion 现在“面向”相反的方向。\n\n\
    请注意，this 关键字指的是绑定事件处理程序的元素。\n\n## 注销基本事件处理程序\n\n为了注销事件处理程序，Raphaël 为我们提供了方法，其名称是注册事件处理程序的名称加上\
    \ \"un-\" 前缀。例如，click 事件处理程序使用 unclick 来注销。\n\n注销事件处理程序是您已注册事件处理程序的元素的方法，并将事件处理函数作为参数接受。请考虑一个正方形，在单击时相对于其当前位置顺时针旋转\
    \ 15 度：\n\n```\nvar square = paper.rect(50, 50, 100, 100);\nvar clickHandler =\
    \ function() {\n    this.transform('...r 15');\n};\nsquare.click(clickHandler);\n\
    ```\n\n我们在当前作用域中定义了一个事件处理程序 clickHandler，并将其作为参数传递给 click 方法以注册它。我们按以下方式在正方形上注销\
    \ click 事件处理程序：\n\n```\ncircle.dblclick(function() {\n    square.unclick(clickHandler);\n\
    }\n```\n\n这产生的效果是，当圆被双击时，clickHandler 不再被调用。\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_67_0.png)\n\
    \n## 使用矩阵\n\n**矩阵**是按行和列排列的元素矩形数组。在引用矩阵大小时，惯例是先指定行数，因此 3 行 2 列的矩阵，例如，将是：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_68_0.png)\n\
    \n矩阵中的每个元素可以被视为将某个点映射到另一个点的组件。例如，点 (_x_, _y_) 可以映射到 (_p_, _q_)，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_68_1.png)\n\
    \n此矩阵定义了 2D 空间中一个点到新 2D 空间点的转换。新 _x_ 点 _p_ 被缩放 2 倍，而新 _y_ 点 _q_ 被缩放 2 倍并按原始 _x_\
    \ 平移（这种效果称为**剪切**）。\n\n## 转换矩阵\n\nRaphaël 中的转换称为**仿射变换**。其思想是将 2D 空间中的每个点视为 3D\
    \ 空间中的点，这使我们能够使用矩阵表示转换。3D 点固定为 1，因此 (_x_, _y_) 点表示为 (_x_, _y_, 1)，即它在第三维上不变。\n\
    \n在此表示法中，由转换产生的点 (_p_, _q_) 如下推导：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_68_2.png)\n\
    \n元素 _a_、_b_、_c_、_d_、_e_ 和 _f_ 根据赋予它们的值表示各种转换。\n\n## 使用转换矩阵\n\n创建转换时，您可以使用语法 `\"\
    M a, b, c, d, e, f\"` 将矩阵参数直接传递给转换字符串。这产生的效果是将转换矩阵应用于元素上的每个点。\n\n## 使用转换矩阵执行剪切\n\
    \n剪切转换的矩阵如下：\n\n```\n⎡a c e⎤   ⎡1   Sx  0⎤\n⎢b d f⎥ = ⎢Sy   1  0⎥\n⎣0 0 1⎦   ⎣0\
    \   0   1⎦\n```\n\nSx 和 Sy 分别表示 x 和 y 点被剪切的因子。例如，将转换字符串 \"m 1 0 0.5 1 0 0\"（Sx\
    \ = 0.5, Sy = 0）应用于正方形，其效果是将其在 x 方向上转换为菱形：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_69_0.png)\n\
    \n通常，我们希望相对于 x 轴和 y 轴分别按角度应用剪切。这在 http://raphaeljsvectorgraphics.com/the-graphical-web/css3-raphael-transforms\
    \ 上有演示。为了实现这一点，我们使用以下转换矩阵：\n\n```\n⎡a   c   e⎤   ⎡1   tan(α)   0⎤\n⎢b   d   f⎥\
    \ = ⎢tan(β)   1   0⎥\n⎣0   0   1⎦   ⎣0   0   1⎦\n```\n\n在此形式中，角度 β 是相对于 x 轴顺时针的剪切角度（产生\
    \ y 方向上的剪切结果），α 是相对于 y 轴逆时针的剪切角度（产生 x 方向上的剪切结果）。请考虑对正方形进行以下转换：\nSquare.transform(\n\
    \t['m', 1, 0, Math.tan(Raphael.rad(25)), 1, 0, 0]\n\t);\n相对于 y 轴应用了 25 度的转换，产生\
    \ x 方向上的剪切。\n\n"
