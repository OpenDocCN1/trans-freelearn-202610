    我们还提供一个包含本书中截图/图表彩色图片的 PDF 文件。彩色图片将帮助你更好地理解输出/结果的变化。\n\n你可以从 http://www.packtpub.com/sites/default/\
    \ files/downloads/9161OS_Images.pdf 下载此文件。\n\n## 勘误\n\n尽管我们已尽力确保内容的准确性，但错误难免会发生。如果你在我们的某本书中发现错误——无论是文本还是代码中的错误——我们将不胜感激如果你能将其报告给我们。这样做，你可以帮助其他读者避免沮丧，并帮助我们改进本书的后续版本。如果你发现任何勘误，请访问\
    \ http://www.packtpub. com/support，选择你的书，点击 **errata submission form** 链接，并输入你的勘误详细信息。一旦你的勘误得到验证，你的提交将被接受，勘误将上传到我们的网站，或添加到该书名下勘误部分的任何现有勘误列表中。\n\
    \n## 盗版\n\n互联网上受版权材料的盗版是跨所有媒体的持续问题。在 Packt，我们非常重视对我们的版权和许可的保护。如果你在互联网上以任何形式发现我们作品的非法副本，请立即向我们提供位置地址或网站名称，以便我们可以采取补救措施。\n\
    \n请通过 <copyright@packtpub.com> 与我们联系，并提供涉嫌盗版材料的链接。\n\n我们感谢你在保护我们的作者以及我们为你提供有价值内容的能力方面提供的帮助。\n\
    \n## 问题\n\n如果你在本书的任何方面遇到问题，可以通过 <questions@packtpub.com> 联系我们，我们将尽力解决。\n\n## 第\
    \ 1 章 图形 Web\n\n在当今的在线环境中，在 Web 浏览器中绘制图形非常重要。虽然在经验科学、数学和印刷媒体中长期存在有效表达信息的需求，但自\
    \ Web 出现以来，这种需求获得了新的生命力。随着我们现在生成的海量数据以及我们可以用来与用户通信的大量设备的存在，在线可视化数据的愿望和能力都有所提升。此外，浏览器已从进入信息世界的便捷入口发展成为真正的交互式媒体渠道。\n\
    \n已出现许多技术来实现基于浏览器的绘图，包括但不限于 VML 和 SVG、HTML5 Canvas 和 WebGL。每种技术通常适用于特定目的——VML\
    \ 和 SVG 用于 2D 矢量绘图，HTML5 Canvas 用于位图绘图，WebGL 用于 3D 图形渲染。\n\n本书介绍了使用 **Raphaël**\
    \ 进行 2D 矢量绘图，Raphaël 是一个轻量级、开源的 JavaScript 库，它使用 SVG 和 VML 在浏览器中绘制矢量图形。它提供了一系列方便的方法，用于路径绘制、矢量变换、通过\
    \ DOM 实现的交互性以及路径动画，并支持位图图像嵌入和文本绘制。该库通过这些方法大大简化了绘图过程，充当底层（SVG 和 VML）规范的 _适配器_。\n\
    \n虽然在本书中，我们会力求让读者了解 SVG 规范，因为这将帮助我们充分发挥库的全部功能，但不需要深入理解 SVG 的工作原理，而且根本不涉及 VML。Raphaël\
    \ 负责在 SVG/VML 规范级别输出图形，这意味着我们只需要关注如何使用该库本身。\n\n"
