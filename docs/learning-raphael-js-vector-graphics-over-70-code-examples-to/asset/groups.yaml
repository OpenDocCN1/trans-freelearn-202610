  md: "\n\nThere are two quadratic Bézier curve commands, the syntax for which is\
    \ given here:\n\n| Command | Parameters | Example |\n|---------|------------|---------|\n\
    | Q or q | (x1, y1, x, y)+ | Q 100 50 200 250 |\n| T or t | (x y)+ | T 400 250\
    \ |\n\nThe q command (or q for relative points) describes a curve drawn from the\
    \ current point on a path to the point (x, y) using (x1, y1) as a control point.\
    \ For example, consider the following code:\n\n```\npaper.path(['M', 50, 150,\
    \ 'Q', 225, 20, 400, 150]);\n```\n\nThis draws the quadratic Bézier curve shown.\
    \ The equivalent path using the lowercase variant of the command would be \"M\
    \ 50,150 q 175,-130 350,0\", where the (x, y) and (x1, y1) parameters are the\
    \ relative distances from the start point (50, 100):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_49_0.png)\n\
    \nMoving the control point affects the way that the path is drawn. For example,\
    \ the path \"M 50, 150 Q 100,40 400,150\" is shown as:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_49_1.png)\n\
    \n## Drawing Paths\n\nAs with the other commands we have encountered so far, parameters\
    \ can be repeatable, which allows us to draw multiple connected quadratic Bézier\
    \ curves. Consider the following code:\n\n```\npaper.path([\n\t'M', 50, 150\n\t\
    'Q', 225, 20, 400, 150,\n\t575, 20, 750, 150\n]);\n```\n\nThis has the effect\
    \ of drawing a second curve from (400, 150) to the point (750, 150) with a control\
    \ point at (575, 20):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_50_0.png)\n\n\
    The `T` or `t` command is shorthand whereby the control point coordinates are\
    \ not specified. Instead, the control point is determined automatically as a reflection\
    \ of the previous control point. Consider the path drawn by the following code:\n\
    \n```\npaper.path([\n\t'M', 50, 150,\n\t'Q', 225, 20, 400, 150,\n\t'T', 750, 150\n\
    ]);\n```\n\nThis creates two curves as shown in the following screenshot. The\
    \ current point at the start of the path drawn by `T` is (400, 150). Relative\
    \ to this point, a reflection of the previous control point (225, 20) is (575,\
    \ 280):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_51_0.png)\n\n## Cubic Bézier\
    \ curves\n\nThe principles behind drawing cubic Bézier curves are similar to those\
    \ for quadratic Bézier curves except that cubic Bézier curves have two control\
    \ points. Again, in order to appreciate how cubic Bézier curves are drawn, you\
    \ should take a look at the animated demo at http://www.jasondavies.com/animated-bezier/.\
    \ The cubic Bézier curve’s path (highlighted in red in the screenshot) starts\
    \ from P0 and heads in the direction of P1 before arriving at the end point P3\
    \ from the direction of P2:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_51_1.png)\n\
    \nThere are two cubic Bézier curve commands, the syntax for which is shown in\
    \ the table given:\n\n| Command | Parameters | Example |\n|---|---|---|\n| C or\
    \ c | (x1, y1, x2, y2, x, y)+ | C 150 25 350 50 500 300 |\n| S or s | (x2, y2,\
    \ x y)+ | t 200 -100 200 50 |\n\n## Drawing Paths\n\nThe c command requires that\
    \ we specify both control points. The following code\nhas the effect of drawing\
    \ a curve from the point (200, 20) to (200, 120) via the control\npoints (400,\
    \ 140) and (400, 180). Note also that we have closed the path and applied\nan\
    \ attribute fill:\n\n```\npaper.path([\n\t'M', 200, 20,\n\t'C', 400, 140, 400,\
    \ 180, 200, 120,\n\t'z'\n]).attr({fill: '#222'});\n```\n\nThe result is shown\
    \ as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_52_0.png)\n\nThe s command\
    \ has a similar effect to the T command in automatically creating a\ncontrol point\
    \ reflected about the current point. What it actually does is to reflect the\n\
    second control point about the current point and this becomes the first control\
    \ point\nfor our new subpath, for which we now have to specify our second control\
    \ point.\nThe code given here extends the previous example with a subpath drawn\
    \ using\nthe s command:\n\n```\npaper.path([\n\t'M', 200, 20,\n\t'C', 400, 140,\
    \ 400, 180, 200, 120,\n\t'S', 0, 100, 200, 220,\n\t'z'\n]);\n```\n\nThe s path\
    \ starts from the current point (200, 120) and finishes at (200, 220) as shown.\n\
    The second control point from our first curve, defined at (400, 180), is reflected\
    \ about\nthe current point, which creates a control point at (0, 60). We have\
    \ then specified a\nsecond control point at (0, 100):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_53_0.png)\n\
    \nThe hardest thing about working with Bézier curves is deciding where to define\
    \ your control points. Figuring these out is usually achieved by one of the following:\n\
    \n- Trial and error\n- Mathematical computation\n- Using a graphics package such\
    \ as Inkscape to aid you in drawing\n\n## Drawing arcs\n\nThe syntax for drawing\
    \ arcs is the most involved of all the drawing commands.\nThis is because when\
    \ we draw an arc from one point to another, there are four\npossible arc paths\
    \ available to us as shown here—there are two ellipses on whose\ncircumference\
    \ the start and end points can lie. The first two arcs are known as **minor**\n\
    arcs while the latter two arcs are known as **major** arcs. The resultant arc\
    \ is also\naffected by the angular direction taken in going from the start point\
    \ to the end point:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_53_1.png)\n\n\
    The syntax for arc drawing is given in the following table:\n\n| Command | Parameters\
    \ | Example |\n|---|---|---|\n| A or a | (rx, ry,\nx-rotation,\nlarge-arc-flag,\n\
    sweep-flag,\nx, y)+ | a 25 50 0 1 0 100 200 |\n\nThe following table describes\
    \ each of the individual parameters:\n\n| Parameters | Description |\n|---|---|\n\
    | rx and ry | Since an arc is a portion of an ellipse, it has a radius in x and\
    \ y |\n| x-rotation | The counterclockwise rotation of the ellipse along which\
    \ the arc is drawn (a value in degrees) |\n| large-arc-flag | Whether our arc\
    \ is drawn as a major (1) or minor (0) arc |\n| sweep-flag | Whether the arc is\
    \ drawn in a positive (1), that is, clockwise or negative (0), that is, counterclockwise,\
    \ angular direction |\n| x and y | The end point of our arc |\n\nThese parameters\
    \ are perhaps best illustrated by example. Consider drawing a major arc path with\
    \ a sweep-flag equal to 1:\n\n```\npaper.path([\n\t'M', 50, 60,\n\t'a', 150, 80,\
    \ 0, 1, 1, 0, 80\n]);\n```\n\nWe first move to the current point (50, 60) and\
    \ then draw an arc with an x-radius of 150 and a y-radius of 80. We set the x-rotation\
    \ value equal to 0 and identify that we’re drawing the large arc by setting large-arc-flag\
    \ equal to 1. The sweep-flag value is equal to 1 and we use the lowercase, that\
    \ is, relative, variant of the A command meaning our final x and y parameters\
    \ (0, 80) are units relative to the start point, that is: 0 additional pixels\
    \ in x and 60 additional pixels in y giving end point coordinates of (50, 140).\
    \ The resultant arc is shown as follows.\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_55_0.png)\n\
    \nWere we to specify a `large-arc-flag` value equal to 0, the minor arc of the\
    \ ellipse passing through (50, 60) and (50, 140) would be drawn as shown:\n\n\
    ![](img/d8ec653db4cab13fec8b3f5718174af6_55_1.png)\n\nWere we to specify `sweep-flag`\
    \ equal to 0, for example, for the path described by `M 350,60 a 150,80 0 1 0\
    \ 0,80` in the case of the major arc or `M 350,60 a 150,80 0 0 0 0,80` in the\
    \ case of the minor arc, the arc would be drawn in a counterclockwise direction.\n\
    \nThe following image describes a major arc (`large-arc-flag = 1`) drawn in a\
