    \ Choose **Layer | Move Selection to Layer Above**.\n6. Delete the previous layer.\n\
    \nThe result is as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_95_0.png)\n\
    \nArguably the best tool we have at our disposal is the pen tool, which is used\
    \ to draw Bézier curve paths:\n\n1. Select the pen tool (*Shift + F6*).\n2. Single\
    \ click anywhere in the document.\n3. Click-and-drag at another point in the document.\n\
    \n## Working with Existing SVGs\n\nYou will notice that each click defines an\
    \ anchor point that defines the extent to which the curve is curved as shown in\
    \ the following screenshot:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_96_0.png)\n\
    \nEach successive click defines a new anchor point and the path is closed by joining\
    \ it to the start point anchor point:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_96_1.png)\n\
    \n## Inspecting paths\n\nSince we’re familiar with supplying raw path string data\
    \ to the `path` method in Raphaël, it goes without saying that we can copy a path\
    \ string from an SVG and draw paths this way. For complex graphics, the raw XML\
    \ of an SVG is not always easy to work with and manipulating multiple paths can\
    \ be cumbersome but this approach of working with existing SVGs does give us complete\
