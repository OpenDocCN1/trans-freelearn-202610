    \n为了说明 Catmull-Rom 曲线，请考虑存储在数组中的以下数据点：\n\n```\nvar data = [\n\t{x: 50, y: 250},\t\
    \t{x: 100, y: 100},\t\t{x: 150, y: 150},\n\t{x: 200, y: 140},\t\t{x: 250, y: 250},\t\
    \t{x: 300, y: 200},\n\t{x: 350, y: 180},\t\t{x: 400, y: 230}\n];\n```\n\n要绘制这些数据点，我们遍历数组并在每个\
    \ x 和 y 位置绘制一个圆（请注意，点被分组到一个集合中，这使得向它们应用属性更加容易）：\n\n```\nvar plottedPoints = paper.set();\n\
    for(var i = 0, num = data.length; i < num; i+=1) {\n\tvar point = data[i];\n\t\
    plottedPoints.push(paper.circle(point.x, point.y, 5));\n};\nplottedPoints.attr({fill:\
    \ '#09c', 'stroke-width':0});\n```\n\n在构建路径字符串或路径数组时，我们使用 M 命令将第一个数据点设为当前点，并追加\
    \ R 命令以开始绘制 Catmull-Rom 曲线：\n\n```\nvar path = ['M', data[0].x, data[0].y];\n\
    path.push('R');\n```\n\n然后我们遍历所有剩余点（除第一个点外的所有点），并将它们的值追加到路径数组中：\n\n```javascript\n\
    for(var i = 1, num = data.length; i < num; i+=1) {\n  path.push(data[i].x);\n\
    \  path.push(data[i].y);\n}\nvar curve = paper.path( path );\n```\n\n使用 `path`\
    \ 命令绘制的结果曲线如图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_60_0.png)\n\n## 摘要\n\
    \n我们现在已经介绍了 Raphaël 中的所有主要绘图方法，您应该熟悉用于绘制路径的语法。此时，尝试我们介绍过的路径命令和实用方法来创建您自己的独特图形绝对值得一试。\n\
    \n我们现在准备好开始研究与绘图进行交互和操作了。到目前为止，我们创建的图形只绘制一次且不会改变。在下一章中，我们将研究响应用户触发的事件以及转换我们创建的元素。\n\
    \n# 4 转换和事件处理\n\n在花费了前两章绘制静态图形之后，我们现在将开始研究如何转换它们以及如何在浏览器中与它们进行交互。\n\n当您在 Raphaël\
    \ 中创建一个元素时，您实际上是在创建一个 **文档对象模型 (DOM)** 对象。与您已经熟悉的 DOM 对象一样，绘制在画布上的元素在用户与之交互时会触发事件。Raphaël\
    \ 提供了一些方便的跨浏览器方法来与元素进行交互，还提供了便于拖放功能的方法。\n\n转换同样灵活：Raphaël 允许我们使用 **转换字符串** 的概念轻松地转换（平移、缩放和旋转）元素。\n\
    \n在本章中，我们将同时研究事件处理和转换，结合库的这两个方面来产生交互式图形。总体而言，我们将涵盖：\n\n- transform 方法和基本转换\n-\
    \ 矩阵转换\n- 注册和注销基本事件处理程序\n- 实现拖放功能\n\n## 基本转换和事件处理\n\n我们在 Raphaël 中使用元素上的 `transform`\
    \ 方法执行转换，该方法接受一个转换字符串作为参数。转换字符串定义要在特定元素上执行的一系列转换。\n\n您也可以使用 `transform` 属性转换元素和集合。当我们同时更改多个属性时，这通常很方便。您将在第\
    \ 5 章 矢量动画 中看到此示例。\n\n### 基本转换\n\n与路径字符串一样，转换字符串由许多命令组成，按其应被解释的顺序排列。基本命令的语法如下，其中括号表示可选参数：\n\
    \n| 命令 | 参数 | 示例 |\n|---------|------------|---------|\n| T 或 t | x, y | t 50,100\
    \ |\n| R 或 r | 顺时针旋转角度，(旋转点_x_, 旋转点_y_) | R 45,0,0 |\n| S 或 s | scale_x, scale_y,\
    \ (缩放点_x_, 缩放点_y_) 或 scale_factor, (缩放点_x_, 缩放点_y_) | S 2,4.5,75,125 |\n\n与路径字符串一样，转换字符串有大写和小写变体。大写变体意味着无论之前的转换如何，我们都会进行转换，而小写变体会考虑之前的转换。以下示例演示了基本转换。\n\
    \n## 平移\n\n首先，考虑绘制一个三角形并使用 `clone` 方法创建其副本：\n\n```\nvar triangle = paper.path(\"\
    M 150 20 1 100 160 1 -200 0 z\").attr({\n 'stroke-dasharray': '- ',\n 'stroke-width':\
    \ 5\n});\n```\n\n```\nvar triangleCopy = triangle.clone(); // 克隆我们的对象\ntriangleCopy.attr({\n\
    \ 'stroke-dasharray': ''\n});\n```\n\n克隆后，复制的三角形具有与原始三角形相同的所有属性，因此我们取消设置 `stroke-dasharray`\
    \ 以使其具有实心轮廓。然后我们在 x 轴上执行 300px 的平移，在 y 轴上执行 0px 的平移，如下所示：\n\n```\ntriangleCopy.transform(\"\
    T 300 0\");\n```\n\n这会将我们克隆的三角形在 `x` 方向上移动，如下图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_63_0.png)\n\
    \n请注意，虽然 `clone` 方法很方便，但已知在克隆多个元素时会对性能产生不利影响。在克隆多个元素时，建议使用原始路径创建新元素。\n\n## 旋转\n\
    \n现在创建另一个克隆的三角形，并使用以下转换字符串对其进行转换，这会使三角形在 x 轴上平移 350px，在 y 轴上平移 -35px 后，绕其中心点（当我们不指定旋转点时的默认值）顺时针旋转\
    \ 45 度。\n\n```\ntriangleCopy.transform(\"t 350 -35 r 45\");\n```\n\n\n"
