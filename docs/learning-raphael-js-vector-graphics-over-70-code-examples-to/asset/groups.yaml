    \ r, r, 0, +(angle > 180), 1, x, y` describes\nan arc whose radius is fixed at\
    \ `r` and whose large arc flag is 0 for when the subtended\nangle is less than\
    \ or equal to 180 degrees (where we want to draw the smaller of the\navailable\
    \ arcs) and 1 when the angle is greater than 180 degrees (when we want to\ndraw\
    \ the larger arc).\n\n## The counts custom attribute\n\nOur visualization will\
    \ display the number of tweets as text based on the proportion (expressed as a\
    \ factor between 0 and 1) of the animation that has passed and the total tweets\
    \ for that timer. We define the counts custom attribute to return this ratio of\
    \ time elapsed to total tweets as text as follows:\n\n```\npaper.customAttributes.counts\
    \ = function(ratio, total) {\n    return {\n        text: Math.round(ratio * total)\n\
    \    };\n};\n```\n\n## Updating the timer\n\nWhen the animation of a timer initially\
    \ begins, or is reset after traversing a full 360 degrees (the length of one animation),\
    \ we run an update method that is responsible for setting the \"start\" values\
    \ of our arc. The arc starts at 0 degrees and is given a 20px stroke that gives\
    \ it the arcing clock effect:\n\n```\nfunction update(i) {\n    // Get properties\
    \ from our timers data array\n    var cx = timers[i].cx, cy = timers[i].cy,\n\
    \        radius = timers[i].r, interval = timers[i].interval;\n\n    // Draw a\
    \ new path for this particular timer\n    paths[i] = paper.path().attr({\n   \
    \     subend: [0, cx, cy, radius],\n        'stroke-width': 20,\n        stroke:\
    \ '#009ec4'\n    });\n\n    animate(i, cx, cy, radius, timers[i].interval);\n\
    }\n```\n\nThe helper method animate is called at the end of this function in order\
    \ to initialize our animation from 0 degrees to 360 degrees. Note that our paths\
    \ are stored in the paths array so that we can refer to them by their index later.\n\
    \n## The animate helper method\n\nThe purpose of the `animate` function is to\
    \ animate:\n\n+   - The arc from its initial arc path to the final arc path\n\
    +   - The number of tweets counted over the time interval elapsed\n\nIn the code\
    \ given here, we animate our arc to subtend 360 degrees and our text counts as\
    \ a proportion of the total number of tweets:\n\n```\nfunction animate(i, cx,\
    \ cy, r, interval) {\n    // Animate the path\n    paths[i].animate({\n      \
    \  subtend: [360, cx, cy, r]\n    }, interval, function() {\n        paths[i].remove();\n\
    \        setTimeout(function() {\n            update(i);\n        });\n    });\n\
    \    // Animate the counts\n    counts[i].animate({\n        counts: [1, timers[i].total]\n\
    \    }, interval, function() {\n        counts[i].attr({\n            'counts':\
    \ [0, timers[i].total]\n        });\n    });\n}\n```\n\nThe `animate` method is\
    \ run over the duration specified in our `timers` array based on the index of\
    \ that timer passed as the first parameter. Note that when the animation of the\
    \ arc is complete, we run the `update` function again to restart the whole process.\
    \ Likewise, the `counts` text is reset to 0.\n\n## Iterating over our timers and\
    \ starting the animation\n\nTo initialize the animation, we iterate over our timers,\
    \ defining our `counts` text with an initial value of `0` positioned at the center-x\
    \ and center-y point of our arc. We then run our `update` function on each timer,\
    \ which has the effect of animating the arcs in a recursive manner as we have\
    \ discussed.\n\n```\nfor(var i = 0, ii = timers.length; i < ii; i+=1) {\n\t(function(i)\
    \ {\n\t\t// Draw descriptive text beneath the timer\n\t\tpaper.text(timers[i].cx,\
    \ timers[i].cy + timers[i].r + 30,\n\t\ttimers[i].text);\n\t\t// Define counts\
    \ text\n\t\tcounts[i] = paper.text(\n\t\t\ttimers[i].cx, timers[i].cy, '0'\n\t\
    \t).attr({\n\t\t\t'counts': [0, timers[i].total]\n\t\t});\n\t\tupdate(i);\n\t\
    })(i);\n}\n```\n\n## Supplementary material\n\nTwo additional data visualization\
    \ demos have been written up at `http://raphaeljsvectorgraphics.com` and are available\
    \ to you as supplementary material.\n\n## Facebook usage by year\n\nA simple timeline\
    \ visualization has been created to demonstrate the rise in the number of users\
    \ by year. The timeline is a Catmull-Rom curve that can be panned in the x-direction\
    \ as shown in the following screenshot:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_119_0.png)\n\
    \nThe supplementary material for this visualization is available at http://raphaeljsvectorgraphics.com/book/supplementary/facebook-usage-by-year.\n\
    \n## Golden tweets\n\nTwitter published an article at the end of 2012 discussing\
    \ some of the tweets that were re-tweeted the highest number of times. These have\
    \ been marketed as _golden tweets_ given the high levels of participation that\
    \ they encouraged.\n\nA bar chart visualization has been created to represent\
    \ the number of times that these tweets were re-tweeted:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_119_1.png)\n\
    \nThe supplementary material for this visualization is available at http://raphaeljsvectorgraphics.com/book/supplementary/golden-tweets.\n\
    \n[ 109 ]\n"
  mdcn: "\n\n# 按时间分布的推文\n\n此人物路径在画布上的位置是任意的。我们将其放置在路径边界框高度的八倍处，使其刚好出现在六行人物的下方。\n\n\
    平均每秒约有 3,000 条推文，这意味着在 5 分钟内大约会产生一百万条推文。在本节中，我们将创建一个有趣的动画环形图可视化，利用路径弧来说明特定数量的推文被创建所需的时间：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_113_0.png)\n\n## 开始使用\n\n我们的 HTML 标记定义了一个画布，页面加载时我们将在其中绘制四条动画弧路径。我们将在\
    \ tweets-by-time.js 中编写 JavaScript：\n\n```html\n<h1>Tweets with respect to time</h1>\n\
    <p>There are approximately 3,000 tweets every ...</p>\n<div id=\"tweets-timed\"\
    ></div>\n<script type=\"text/javascript\"\n src=\"raphael-2.1.0-min.js\"></script>\n\
    <script type=\"text/javascript\"\n src=\"jquery-1.9.1.min.js\"></script>\n<script\
    \ type=\"text/javascript\"\n src=\"tweets-by-time.js\"></script>\n```\n\n我们定义了一个宽度为\
    \ 770px、高度为 450px 的绘图画布，以容纳这些计时器：\n\n```javascript\nvar paper = Raphael('tweets-timed',\
    \ 770, 450);\n```\n\n我们还定义了两个数组，用于保存我们将要绘制的路径的引用以及与时间相关的推文计数：\n\n```javascript\n\
    var paths = Array(), counts = Array();\n```\n\n## 按时间分布的推文数据\n\n基于每秒约 3,000 条推文，我们定义了以下数值的计时器：\n\
    \n| 时间间隔   | 推文数量 |\n|-----------------|------------------|\n| 1 秒        | 3,000\
    \            |\n| 3.333 秒   | 10,000           |\n| 30 秒      | 100,000      \
    \    |\n| 5 分钟       | 1,000,000        |\n\n在我们的 JavaScript 文件中，我们创建了一个包含这些值的数组对象，以及一些相关文本和弧路径的中心\
    \ x、中心 y 和半径：\n\n```javascript\nvar timers = [\n {\n  cx: 225,\n  cy: 100,\n \
    \ r: 50,\n```\n\n```\ninterval: 1000,\ntotal: 3000,\ntext: '~ 3,000 tweets per\
    \ second'\n},\n// ...\n```\n\n出于简洁起见，此代码被截断。完整代码请下载本书附带的源代码。\n\n## subtend 自定义属性\n\
    \n弧线的弯曲程度，即 _subtend_（所对的角度），取决于动画过程中经过的时间。起初，弧线所对的扇区长度为零，逐渐增加，直到弧线所对的角度达到 360\
    \ 度。\n\n为了实现这一点，我们定义了一个名为 `subtend` 的自定义属性，它根据特定时间下弧线的角度以及其固有的中心 _x_、中心 _y_ 和半径属性来返回一个路径。曲线终点的\
    \ _x_ 和 _y_ 坐标随其所对的角度呈正弦变化，这意味着我们可以定义一条从起点（中心点的 _x_ 坐标和中心点的 _y_ 坐标减去半径）开始弧形的路径，如下所示：\n\
    \n```\npaper.customAttributes.subtend = function(angle, cx, cy, r) {\nvar x =\
    \ cx + r * Math.cos(Raphael.rad(90 - angle));\nvar y = cy - r * Math.sin(Raphael.rad(90\
    \ - angle));\nvar path = [\n'M', cx, cy - r,\n'A', r, r, 0, +(angle > 180), 1,\
    \ x, y\n];\nreturn {\npath: path\n};\n};\n```\n\n请注意，子路径定义 `'A', r, r, 0, +(angle\
    \ > 180), 1, x, y` 描述了一个半径固定为 `r` 的弧，当所对角度小于或等于 180 度时，其大弧标志为 0（此时我们要绘制可用弧中的较小者），当角度大于\
    \ 180 度时，其大弧标志为 1（此时我们要绘制较大的弧）。\n\n## counts 自定义属性\n\n我们的可视化将根据动画经过的比例（表示为 0 到\
    \ 1 之间的因子）以及该计时器的推文总数，以文本形式显示推文数量。我们定义了 counts 自定义属性，以文本形式返回经过时间与总推文数的比率，如下所示：\n\
    \n```\npaper.customAttributes.counts = function(ratio, total) {\n    return {\n\
    \        text: Math.round(ratio * total)\n    };\n};\n```\n\n## 更新计时器\n\n当计时器的动画初次开始，或者在遍历完整的\
    \ 360 度（一次动画的长度）后被重置时，我们会运行一个更新方法，该方法负责设置弧的“起始”值。弧从 0 度开始，并被赋予 20px 的描边，从而产生时钟弧形效果：\n\
    \n```\nfunction update(i) {\n    // Get properties from our timers data array\n\
    \    var cx = timers[i].cx, cy = timers[i].cy,\n        radius = timers[i].r,\
    \ interval = timers[i].interval;\n\n    // Draw a new path for this particular\
    \ timer\n    paths[i] = paper.path().attr({\n        subend: [0, cx, cy, radius],\n\
    \        'stroke-width': 20,\n        stroke: '#009ec4'\n    });\n\n    animate(i,\
    \ cx, cy, radius, timers[i].interval);\n}\n```\n\n辅助方法 animate 在此函数末尾被调用，以便将我们的动画从\
    \ 0 度初始化到 360 度。请注意，我们的路径存储在 paths 数组中，以便我们稍后可以通过索引引用它们。\n\n## animate 辅助方法\n\n\
    `animate` 函数的目的是对以下内容进行动画处理：\n\n+   - 弧线从其初始弧路径到最终弧路径\n+   - 经过的时间间隔内计数的推文数量\n\
    \n在给出的代码中，我们将弧线动画化为所对 360 度，并将文本计数作为推文总数的比例进行动画化：\n\n```\nfunction animate(i,\
    \ cx, cy, r, interval) {\n    // Animate the path\n    paths[i].animate({\n  \
    \      subtend: [360, cx, cy, r]\n    }, interval, function() {\n        paths[i].remove();\n\
    \        setTimeout(function() {\n            update(i);\n        });\n    });\n\
    \    // Animate the counts\n    counts[i].animate({\n        counts: [1, timers[i].total]\n\
    \    }, interval, function() {\n        counts[i].attr({\n            'counts':\
    \ [0, timers[i].total]\n        });\n    });\n}\n```\n\n`animate` 方法在我们 `timers`\
    \ 数组中指定的持续时间内运行，基于作为第一个参数传递的计时器的索引。请注意，当弧线的动画完成时，我们会再次运行 `update` 函数以重新启动整个过程。同样，`counts`\
    \ 文本会被重置为 0。\n\n## 遍历我们的计时器并启动动画\n\n为了初始化动画，我们遍历我们的计时器，将我们的 `counts` 文本定义为初始值\
    \ `0`，位于弧线的中心 x 和中心 y 点。然后我们对每个计时器运行 `update` 函数，其效果是以我们讨论过的递归方式对弧线进行动画处理。\n\n\
    ```\nfor(var i = 0, ii = timers.length; i < ii; i+=1) {\n\t(function(i) {\n\t\t\
    // Draw descriptive text beneath the timer\n\t\tpaper.text(timers[i].cx, timers[i].cy\
    \ + timers[i].r + 30,\n\t\ttimers[i].text);\n\t\t// Define counts text\n\t\tcounts[i]\
    \ = paper.text(\n\t\t\ttimers[i].cx, timers[i].cy, '0'\n\t\t).attr({\n\t\t\t'counts':\
    \ [0, timers[i].total]\n\t\t});\n\t\tupdate(i);\n\t})(i);\n}\n```\n\n## 补充材料\n\
    \n另外两个数据可视化演示已在 `http://raphaeljsvectorgraphics.com` 上编写，并作为补充材料提供给您。\n\n## 按年份划分的\
    \ Facebook 使用情况\n\n创建了一个简单的时间轴可视化，以展示用户数量随年份的增长。时间轴是一条 Catmull-Rom 曲线，可以沿 x 方向平移，如下面的屏幕截图所示：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_119_0.png)\n\n此可视化的补充材料可在 http://raphaeljsvectorgraphics.com/book/supplementary/facebook-usage-by-year\
    \ 获取。\n\n## 黄金推文\n\nTwitter 在 2012 年底发表了一篇文章，讨论了一些被转发次数最多的推文。这些推文被营销为 _黄金推文_，因为它们鼓励了高水平的参与。\n\
    \n创建了一个柱状图可视化，以表示这些推文被转发的次数：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_119_1.png)\n\
    \n此可视化的补充材料可在 http://raphaeljsvectorgraphics.com/book/supplementary/golden-tweets\
    \ 获取。\n\n[ 109 ]\n\n"
