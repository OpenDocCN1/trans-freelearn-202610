    \ tools\n- Choropleth maps as an example of an existing SVG\n\n"
  mdcn: "\n\n## 矢量动画\n\n我们定义了一个自定义属性 `popDensity`，用于根据上述规则对数据进行可视化表示：\n\n```javascript\n\
    paper.customAttributes.popDensity = function(population, density) {\n    var radius\
    \ = 25 + (25 * population),\n        fillColor = 'hsb(0,0,' + (1 - density) +\
    \ ')'; \n    return {\n        fill: fillColor,\n        r: radius\n    };\n};\n\
    ```\n\n此方法定义了一个半径，其值为 25px 加上 25 乘以国家的相对人口数，这意味着人口最多的国家半径为 50px，人口最少的国家半径为 25px，而所有其他国家的半径介于这两个值之间。填充颜色由亮度比例决定，其中色相和饱和度固定。公式\
    \ (1 – density) 对于人口密度最低的国家将返回值 1（饱和度呈现白色），对于人口密度最高的国家将返回值 0（饱和度呈现黑色）。0 到 1 之间的所有饱和度值都会产生灰色调。\n\
    \n鉴于我们将数据集定义为对象数组，如下所示：\n\n```javascript\nvar data = [\n    {\n        name: 'Taiwan',\n\
    \        population: 0.1,\n        density: 1\n    },\n    {\n        name: 'South\
    \ Korea',\n        population: 0.32,\n        density: 0.5\n    },\n    // ...\n\
    ];\n```\n\n我们可以遍历每个国家，并绘制一个带有 `popDensity` 属性的圆，如下所示：\n\n```javascript\nvar currentX\
    \ = 70;\nfor(var i = 0, ii = data.length; i < ii; i+=1) {\n    var country = data[i];\n\
    \    paper.circle(currentX, 150, 50).attr({\n        popDensity: [country.population,\
    \ country.density],\n        'stroke-width': 4\n    });\n    paper.text(currentX,\
    \ 225, country.name).attr({\n        'font-size': 14\n    });\n\n    currentX\
    \ += 100;\n}\n```\n\n在循环的每次迭代中，人口密度属性从我们的数据对象中确定并绘制到画布上。我们已将每个圆标记为国家名称文本，并递增 x\
    \ 坐标，以便后续圆在前一个圆的右侧绘制。结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_85_0.png)\n\
    \n如您所见，人口最多的国家不一定具有最大的人口密度。虽然台湾和荷兰的人口大致相等，但台湾每平方公里的人口数量远多于荷兰。\n\n如前所述，我们可以将自定义属性从一组值动画化到另一组值。考虑一下，如果我们在循环中初始化元素时将人口和密度值设置为零，然后动画化到人口和密度的实际值，会发生什么：\n\
    \n```javascript\nvar currentX = 70;\nfor(var i = 0, ii = data.length; i < ii;\
    \ i+=1) {\n    var country = data[i];\n    var circle = paper.circle(currentX,\
    \ 150, 50).attr({\n        popDensity: [0, 0],\n        'stroke-width': 4\n  \
    \  });\n    circle.animate({\n        popDensity: [country.population, country.density]\n\
    \    }, 1000, 'easeOut');\n    paper.text(currentX, 225, country.name).attr({\n\
    \        'font-size': 14\n    });\n    currentX += 100;\n}\n```\n\n运行此代码时，您会注意到半径和填充属性都会动画化到其最终状态。\n\
    \n## 路径动画\n\n在动画过程中，属性值根据指定的缓动和已过的时间而变化。自定义属性的工作方式相同。也就是说，传递给自定义属性函数的值取决于缓动和已过的时间。我们可以利用此功能将元素沿给定路径动画化。\n\
    \n首先，我们绘制一条三次贝塞尔曲线，圆将沿其动画化：\n\n```javascript\nvar path = paper.path([\n    'M',\
    \ 100, 100,\n    'C', 100, 0, 400, 200, 400, 100,\n    'S', 100, 200, 100, 100,\n\
    \    'z'\n]).attr({'stroke-width': 2});\nvar circle = paper.circle(0, 0, 13).attr({\n\
    \    fill: '#09c', cursor: 'pointer'\n});\n```\n\n我们的圆初始化为 (0, 0) 点，因为我们将应用一个自定义属性来确定其初始位置。\n\
    \n我们的自定义属性，我们将其命名为 `pathFactor`，它确定圆应该位于路径上的哪个点，具体取决于动画已进行了多少。如果我们将 `distance\
    \ = 0` 定义为动画的起点，将 `distance = 1` 定义为终点，我们可以将 distance 乘以路径的总长度，以确定圆应该遍历路径的多少长度：\n\
    \n```javascript\npaper.customAttributes.pathFactor = function(distance) {\n  \
    \  var point = path.getPointAtLength(distance * pathLength);\n    var dx = point.x,\n\
    \        dy = point.y;\n    return {\n        transform: ['T', dx, dy]\n    };\n\
    };\n```\n\n我们始终返回一个绝对变换，它使用路径上的 (_x_, _y_) 点来确定圆位于路径上的哪个位置。\n\n为了动画化我们的圆，我们首先将其\
    \ `pathFactor` 属性初始化为零。这会将其放置在路径的零长度点，即我们开始绘制路径的点，也就是 (100, 100)：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_87_0.png)\n\
    \n为了沿路径动画化我们的圆，我们定义并执行一个 `runloop` 函数，该函数将我们的 `pathFactor` 属性动画化到值 1。动画结束的回调函数将\
    \ `pathFactor` 重置为零，然后递归调用 `runloop`。您会注意到，我们的递归函数调用是作为 `setTimeout` 的回调执行的；这是为了确保在动画重复之前，浏览器进入循环下一次迭代所需的最短时间已过去：\n\
    \n```javascript\nfunction runloop() {\n    circle.animate({pathFactor: 1}, 4000,\
    \ function() {\n        this.attr({pathFactor: 0}); // Reset\n        setTimeout(runloop);\n\
    \    });\n}\nrunloop();\n```\n\n执行此代码时，您会看到我们的圆沿着路径永久动画化，花费四秒钟从起点遍历路径并返回。\n\n\
    ## 暂停和恢复动画\n\n我们尚未研究暂停和恢复动画的功能。考虑一下，在沿路径动画化的示例中，如果我们在运行循环中为圆定义单击和双击事件处理程序，如下所示：\n\
    \n```javascript\nfunction runloop() {\n    circle.animate({pathFactor: 1}, 4000,\
    \ function() {\n        this.attr({pathFactor: 0}); // Reset\n        setTimeout(runloop);\n\
    \    });\n    circle.unclick().click(function() {\n        this.pause();\n   \
    \ });\n    circle.undblclick().dblclick(function() {\n        this.resume();\n\
    \    });\n}\nrunloop();\n```\n\n由于每次都会启动新动画，我们在每次动画运行时都会注销并重新注册单击和双击事件处理程序。运行此代码时，您会看到，单击和双击时，`pause`\
    \ 和 `resume` 方法分别会暂停和恢复圆上当前运行的动画。在动画周期的四分之一处（t = 0.25）或四分之三处（t = 0.75）暂停动画的结果如下所示：\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_88_0.png)\n\n## 摘要\n\n在本章中，我们探讨了驱动动画的概念以及将元素归属于属性的不同方式。您现在应该能够舒适地使用\
    \ Raphaël 库创建、转换和动画化矢量图形，并且应该能够毫无困难地利用 Raphaël 文档来基于我们所涵盖的内容进行扩展，并按照自己的意图操作图形。\n\
    \n在下一章中，我们将探讨如何在 Raphaël 中使用现有的 SVG。\n\n## 使用现有 SVG\n\n大多数设计师在其项目中使用栅格图形和矢量图形的混合体，因此熟悉\
    \ Adobe Illustrator 和 Inkscape 等矢量图形编辑器。这些工具的实用性近年来随着数字媒体的进步而大幅增长——特别是，设计师需要能够创建分辨率独立的图形，这些图形可以在不同的上下文中工作。\n\
    \n例如，移动和平板电脑市场鼓励设计师创建在非常低分辨率（约 320 x 240）和非常高分辨率（2,048 x 1,536）下都能适当缩放的图像。如今，桌面浏览器也大致相同，用户体验被定制以满足一系列视口尺寸。满足一系列视口尺寸通常被称为\
    \ **响应式设计**。\n\n虽然 SVG 本身在旧版浏览器中支持有限，但我们仍然可以提供矢量图形解决方案。我们现在看到，矢量图形在网站和应用程序中被更广泛地利用。由此可见，我们正在见证设计从僵硬但更精美的艺术作品向灵活的基于矢量的设计转变。\n\
    \n话虽如此，现在更加重视能够使用图形编辑软件生成的矢量图形。虽然在 Raphaël 中使用现有 SVG 没有银弹式的方法，但只要有一定的决心，我们就可以在项目中利用现有的\
    \ SVG。\n\n在本章中，我们将探讨以下内容：\n\n- Inkscape 矢量图形编辑器\n- 检查 SVG 路径的手动方法\n- SVG 到 Raphaël\
    \ 转换工具\n- 现有 SVG 的示例：分级地图\n\n"
