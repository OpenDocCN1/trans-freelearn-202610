    \ would for other shapes. Text is created using the `text` method and its properties\
    \ (such as `size` and `font-family`) are modifiable as attributes. The `text`\
    \ method has the following definition, where the `text` parameter is our text\
    \ string and accepts the standard escape sequence `\\n` as input, which places\
    \ the proceeding text onto a new line:\n\nPaper.text(x, y, text)\n\nThe following\
    \ code creates two pieces of text using this method and then groups them into\
    \ a set in order to apply `font-size` and `font-family` attributes to both elements:\n\
    \n```javascript\nvar text1 = paper.text(0, 15, 'I am text anchored start.');\n\
    text1.attr({\n    'text-anchor': 'start',\n});\nvar text2 = paper.text(270, 100,\
    \ 'I am text\\nanchored middle');\ntext2.attr({\n    'text-anchor': 'middle'\n\
    });\nvar group = paper.set(text1, text2);\ngroup.attr({\n    'font-size': 20,\n\
    \    'font-family': 'serif'\n});\n```\n\n## Embedding custom fonts\n\nThe font\
    \ converter and renderer Cufón has been superseded by @font-face for general web\
    \ font rendering. However, fonts generated by Cufón have fully defined paths and\
    \ integrate seamlessly with Raphaël meaning that we can manipulate such fonts\
    \ in many of the same ways that we would for shapes. A demo of this can be seen\
    \ at http://raphaeljsvectorgraphics.com/the-graphical-web/custom-fonts.\n\nCufón\
    \ supports generating custom fonts from **TrueType (TTF), OpenType (OTF), Printer\
    \ Font Binary (PFB) and PostScript** font files. To generate a custom font using\
    \ Cufón, go to http://cufon.shoqolate.com/generate/ and fill in the font generator\
    \ form. Ensure that you enter Raphael.registerFont in the textbox (or click on\
    \ the small Raphaël logo next to it) under the heading **Customization (for 3rd-party\
    \ scripts only)** as shown in the following screenshot:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_39_0.png)\n\
    \nYour generated font will be a JavaScript file. You should include this in your\
    \ HTML document just after the Raphaël library, that is, as follows:\n\n`<script\
    \ type=\"text/javascript\" src=\"raphael.min.js\"></script>\n<script type=\"text/javascript\"\
    \ src=\"MyFont.font.js\"></script>`\n\nIn order to use the font in your canvas,\
    \ you will use the print method (http://raphaeljs.com/reference.html#Paper.print).\
    \ Consider, for example, embedding a font named Pacifico.font.js:\n\n`<script\
    \ type=\"text/javascript\" src=\"Pacifico.font.js\"></script>`\n\nWe print text\
    \ using our custom font onto our canvas as follows:\n\n```javascript\nvar text\
    \ = paper.print(\n    50,\n    50,\n    'Vi veri veniversum vivus vici',\n   \
    \ paper.getFont('Pacifico'),\n    38\n);\n```\n\nThis draws custom text with a\
    \ font size of 38px onto our canvas at the point (50, 50). The `getFont` method\
    \ simply references the name of the family of the font that you have embedded,\
    \ whereas Cufón should have taken care of registering the font with Raphaël.\n\
    \nAttributes can be applied to custom font text in the same way that we have already\
    \ applied them to shapes and text. For example:\n\n```javascript\ntext.attr({\n\
    \    fill: '315-#000-#666',\n    'stroke-width': 0\n});\n```\n\nThis produces\
    \ the text shown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_40_0.png)\n\
    \n## Summary\n\nIn this chapter we have covered many examples of basic drawing\
    \ and painting in Raphaël in the context of a particular drawing area or canvas.\
    \ You should now be comfortable drawing basic vector graphics using the library\
    \ and exploring the documentation at http://raphaeljs.com.\n\nIn the next chapter,\
    \ we will look at drawing more complex elements using paths.\n\n## 3 Drawing Paths\n\
    \nThe ability to draw and manipulate paths is an extremely powerful feature of\
    \ Raphaël. In the previous chapter we drew basic shapes based on the paths' geometric\
    \ properties such as width, height, and radius. Paths allow us to draw all manner\
    \ of shapes by defining points connected by lines, arcs, and curves representing\
    \ the outline of the shape itself.\n\nPaths, such as basic shapes, are _elements_\
    \ meaning that user interaction, painting, transformations, and animation are\
    \ all possible with paths. Raphaël provides a number of methods for drawing and\
    \ manipulating paths to this end so it will be the focus of the rest of this book.\n\
    \nThe syntax for drawing paths is defined by the SVG specification. Understanding\
    \ this syntax is essential for creating complex shapes and over the course of\
    \ this chapter we will become intimately familiar with it.\n\nTo give you an idea\
    \ of what you can achieve with paths, a demo at `http://raphaeljs.com/chart.html`\
    \ will show you how smooth curves are used to join data points as is common in\
    \ charting applications. Indeed, complex SVG illustrations (for example, those\
    \ created using a graphics package such as Adobe Illustrator or Inkscape) are\
    \ composed of many paths, an interesting demo of which can be seen at `http://raphaeljs.com/tiger.html`.\n\
    \nThis chapter is quite comprehensive in its coverage of paths and so it is suggested\
    \ that you break off at the end of each section to review and experiment with\
    \ the concepts covered. In this chapter we will look at the following topics:\n\
    \n- The concepts behind path drawing\n- The moveto, lineto, and closepath commands\n\
    - Drawing quadratic and cubic Bezier curves\n- The arc drawing commands\n- Utility\
    \ methods in Raphaël for working with paths\n- The Catmull-Rom curve as exemplified\
    \ by data interpolation\n\n## Path drawing concepts\n\nThe process of drawing\
    \ with a pen on paper can be broken down into the following steps:\n\n1. You place\
    \ your pen at a particular point on a piece of paper.\n2. You press and move the\
    \ pen freely from this point to another point.\n3. You keep your pen at this point\
    \ or lift up the pen and place it at another point on the paper.\n4. The process\
    \ is repeated until you have finished drawing.\n\nPath drawing works in much the\
    \ same way. The point at which you place your pen, known as the **current point**,\
    \ defines the start of a path while the free movement of the pen describes the\
    \ path itself.\n\nConsider drawing an arbelos shape. We first place our pen at\
    \ a point (100, 180) on our canvas and draw an arc to the point (380, 180) as\
    \ shown:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_42_0.png)\n\nWe then create\
    \ an arc from the point (380, 180) to the point (200, 180):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_42_1.png)\n\
    \n"
