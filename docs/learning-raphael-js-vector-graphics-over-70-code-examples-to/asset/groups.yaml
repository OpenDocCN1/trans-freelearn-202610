    ## Creating Raphaël JavaScript applications


    The most important aspect of learning how to utilize a new technology is understanding
    the concepts driving it. Code samples will be used where appropriate throughout
    this book but reams of unnecessary code will be omitted in favor of concentrating
    on the core aspects of the task at hand. Where appropriate, you should refer to
    the source code and website (http://raphaeljsvectorgraphics.com) accompanying
    this book.


    ## Project structure and optimization


    The projects in this book will be fairly self-contained and so the project structure
    will be kept quite simple. As your own projects grow, you should pay careful attention
    to project structure.


    You should also consider merging and compressing your CSS and JavaScript files
    when pushing your work into production. This will have the effect of increasing
    the responsiveness of your site or application and reducing load on your web server.
    Useful tools for achieving this are **minify** (http://code.google.com/p/minify/)
    and Google''s **Closure Tools** (https://developers.google.com/closure/).


    ## Summary


    It is often remarked that vector drawing in the browser is an under-utilized technology.
    Developers are often impressed by demonstrations of the technology but are not
    always sure to what extend it may be used. Hopefully after reading this chapter
    you will have a better understanding of what Raphaël does and the types of problems
    it is able to solve.


    In the next chapter, we will look at basic drawing with Raphaël and creating our
    first vector drawings in the browser.


    ## 2 Basic Drawing with Raphaël


    Raphaël supports three fundamental types of graphics elements: shapes, images,
    and text. Shapes can be predefined shapes such as a rectangle, circle, or ellipse
    or they can be a combination of lines, curves, and paths. Vector graphics are
    by their very definition the sum of such shapes, and throughout the next two chapters
    we will create a number of interesting drawings based on them. Images are either
    bitmap images (such as .png or .jpeg) or existing SVG images, and can be manipulated
    by Raphaël in many of the ways that shapes can be.


    Shapes and text can be painted, that is, filled and stroked (given an outline).
    Fills can be either a single color or a linear or radial gradient. Strokes can
    only be filled by a single color but the way in which a shape is stroked is modifiable.


    Some examples of painted shapes can be seen at http://raphaeljsvectorgraphics.com/basic-drawing/shapes-and-attributes.


    In this chapter we will:


    - Look at the browser as the context in which we draw

    - Draw basic shapes

    - Apply fills, strokes, and other attributes to elements

    - Apply gradient fills to elements

    - Work with custom text and look at embedding custom fonts


    ### The drawing context


    In order to be able to draw graphics we need to define a space into which our
    content can be rendered. Like an artist, we need a canvas onto which we can draw.
    The visible region of the browser window, or **viewport**, defines a region in
    which we can draw our **canvas**.


    The SVG specification refers to the drawing area itself as the viewport. Strictly
    speaking, a viewport is any rectangular viewing region. We will always refer to
    the browser window as the _viewport_ and our drawing region as the _canvas_ (not
    to be confused with the HTML5 Canvas).


    We can create a canvas using the `Raphael` constructor as follows:


    ```

    var paper = Raphael(50, 100, 500, 300);

    ```


    This creates a canvas of width 500px and height 300px at 50px to the left of the
    viewport and 100px from the top of the viewport as shown in the following diagram.
    The `paper` variable holds a reference to a `Paper` object which is our canvas
    and we will use it for all future drawing:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_24_0.png)


    More commonly we will want to use an existing DOM element as a container for our
    canvas rather than the viewport. In this case, the left-/right- (x-/ y-) offsets
    are not required as the canvas will always be rendered at the top-left corner
    of the element. Consider the element:


    ```

    <div id="my-canvas"></div>

    ```


    We would create our 500px wide, 300px high canvas using the following code:


    ```

    var paper = Raphael(''my-canvas'', 500, 300);

    ```


    When using this form of the constructor, we always pass an element ID when passing
    a string as the first parameter. Alternatively, we can pass a DOM element as the
    first parameter like so:


    ```

    Raphael(document.getElementById(''my-canvas''), 500, 300);

    ```


    ### Canvas coordinates


    The following diagram illustrates the default coordinate system of the canvas
    created using the `Raphael` constructor. The **origin** of the canvas is defined
    as the point at which _x_ and _y_ are both equal to zero. A point on the canvas
    at _x_ = 300 and _y_ = 200, or (300, 200) in vector notation, is the point 300px
    to the right of the origin _x_-point and 200px down from the origin _y_-point
    as shown:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_25_0.png)


    Likewise, a point at (-125, 50) is that relative to the origin in _x_ and _y_
    as shown in this diagram:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_25_1.png)


    ### Drawing basic shapes


    Raphaël provides the `rect`, `circle`, and `ellipse` methods for drawing basic
    shapes. These are methods of the `Paper` object that is returned when we create
    our canvas. The `rect` method for example has the following syntax (taken from
    the Raphaël documentation at http://raphaeljs.com/reference.html#Paper.rect):


    ```

    Paper.rect(x, y, width, height, [r]);

    ```


    The `x` and `y` coordinates describe the top-left point of the rectangle and the
    fifth parameter, `r`, is the radius of rounded corners where the square brackets
    indicate that it is optional (by default the corners have a radius of 0). A rectangle
    of width 50px and height 100px at x = 200px, y = 150px is created as follows:


    ```

    var paper = Raphael(''my-canvas'', 500, 300);

    var rectangle = paper.rect(200, 150, 50, 100);

    ```


    Similarly, we create a square of width 75px with a corner radius of 15px by:


    ```

    var square = paper.rect(300, 150, 75, 75, 15);

    ```


    ![](img/d8ec653db4cab13fec8b3f5718174af6_26_0.png)


    Note that graphics drawn at negative `x` or `y` points will be drawn starting
    from outside of the visible region of the canvas meaning that they will be partially
    or fully hidden from the viewer as illustrated in the following diagram:


    Both rectangles are shown in the following diagram. Note that drawing is from
    the top-left corner of the rectangle in the positive _x_ and _y_ directions:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_27_0.png)


    The syntax for a circle (http://raphaeljs.com/reference.html#Paper.circle) is:

    Paper.circle(x, y, r);


    While the _x_ and _y_ coordinates of a rectangle describe its top-left point,
    for a circle they define its **center** point. The third parameter, _r_, is the
    radius of the circle. A circle at _x = 100_, _y = 100_ with a radius of 50px is
    drawn by:

    var paper = Raphael(''my-canvas'', 500, 300);

    var circle = paper.circle(100, 100, 50);


    The syntax for an ellipse (http://raphaeljs.com/reference.html#Paper.ellipse)
    is very similar to a circle except that we specify the individual x- and y-radii:

    Paper.ellipse(x, y, x-radius, y-radius);


    An ellipse whose x-radius is twice its y-radius is given by:

    var ellipse = paper.ellipse(300, 100, 100, 50)

