  - '[PAGE 41]


    # # 3 Drawing Paths


    The ability to draw and manipulate paths is an extremely powerful feature of Raphaël.
    In the previous chapter we drew basic shapes based on the paths'' geometric properties
    such as width, height, and radius. Paths allow us to draw all manner of shapes
    by defining points connected by lines, arcs, and curves representing the outline
    of the shape itself.


    Paths, such as basic shapes, are _elements_ meaning that user interaction, painting,
    transformations, and animation are all possible with paths. Raphaël provides a
    number of methods for drawing and manipulating paths to this end so it will be
    the focus of the rest of this book.


    The syntax for drawing paths is defined by the SVG specification. Understanding
    this syntax is essential for creating complex shapes and over the course of this
    chapter we will become intimately familiar with it.


    To give you an idea of what you can achieve with paths, a demo at `http://raphaeljs.com/chart.html`
    will show you how smooth curves are used to join data points as is common in charting
    applications. Indeed, complex SVG illustrations (for example, those created using
    a graphics package such as Adobe Illustrator or Inkscape) are composed of many
    paths, an interesting demo of which can be seen at `http://raphaeljs.com/tiger.html`.


    This chapter is quite comprehensive in its coverage of paths and so it is suggested
    that you break off at the end of each section to review and experiment with the
    concepts covered. In this chapter we will look at the following topics:


    +   - The concepts behind path drawing

    +   - The moveto, lineto, and closepath commands

    +   - Drawing quadratic and cubic Bezier curves

    +   - The arc drawing commands

    +   - Utility methods in Raphaël for working with paths

    +   - The Catmull-Rom curve as exemplified by data interpolation'
