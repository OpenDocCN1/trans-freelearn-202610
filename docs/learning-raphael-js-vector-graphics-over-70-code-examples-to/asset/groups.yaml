    ## 创建 Raphaël JavaScript 应用程序


    学习如何利用新技术最重要的方面是理解驱动它的概念。本书将在适当的地方使用代码示例，但会省略大量不必要的代码，以便专注于手头任务的核心方面。在适当的时候，您应该参考随本书附带的源代码和网站（http://raphaeljsvectorgraphics.com）。


    ## 项目结构和优化


    本书中的项目将相当独立，因此项目结构将保持相当简单。随着您自己的项目不断增长，您应该仔细关注项目结构。


    您还应该考虑在将工作推送到生产环境时合并和压缩 CSS 和 JavaScript 文件。这将提高网站或应用程序的响应速度并减少 Web 服务器的负载。实现此目的的有用工具包括
    **minify**（http://code.google.com/p/minify/）和 Google 的 **Closure Tools**（https://developers.google.com/closure/）。


    ## 摘要


    人们常指出，浏览器中的矢量绘图是一项未被充分利用的技术。开发人员通常对该技术的演示印象深刻，但并不总是确定它可以被应用到何种程度。希望阅读本章后，您能更好地理解
    Raphaël 的功能以及它能够解决的问题类型。


    在下一章中，我们将探讨使用 Raphaël 进行基本绘图，并在浏览器中创建我们的第一批矢量图形。


    ## 2 使用 Raphaël 进行基本绘图


    Raphaël 支持三种基本类型的图形元素：形状、图像和文本。形状可以是预定义的形状，例如矩形、圆形或椭圆，也可以是线条、曲线和路径的组合。矢量图形本质上就是这些形状的总和，在接下来的两章中，我们将基于它们创建许多有趣的图形。图像可以是位图图像（如
    .png 或 .jpeg）或现有的 SVG 图像，Raphaël 可以以许多与形状相同的方式操作图像。


    形状和文本可以进行绘制，即填充和描边（添加轮廓）。填充可以是单一颜色，也可以是线性或径向渐变。描边只能用单一颜色填充，但形状的描边方式是可修改的。


    已绘制形状的示例可以在 http://raphaeljsvectorgraphics.com/basic-drawing/shapes-and-attributes
    上查看。


    在本章中，我们将：


    - 将浏览器视为绘图的上下文

    - 绘制基本形状

    - 将填充、描边和其他属性应用于元素

    - 将渐变填充应用于元素

    - 使用自定义文本并探索嵌入自定义字体


    ### 绘图上下文


    为了能够绘制图形，我们需要定义一个可呈现内容的空间。就像艺术家一样，我们需要一张可以绘图的画布。浏览器窗口的可见区域，即 **视口**，定义了我们可以绘制
    **画布** 的区域。


    SVG 规范将绘图区域本身称为视口。严格来说，视口是任何矩形观看区域。我们始终将浏览器窗口称为 _视口_，将我们的绘图区域称为 _画布_（不要与 HTML5
    Canvas 混淆）。


    我们可以使用 `Raphael` 构造函数创建画布，如下所示：


    ```

    var paper = Raphael(50, 100, 500, 300);

    ```


    这将在视口左侧 50px、顶部 100px 处创建一个宽 500px、高 300px 的画布，如下图所示。`paper` 变量保存对 `Paper` 对象的引用，该对象就是我们的画布，我们将使用它进行所有后续绘图：


    ![](img/d8ec653db4cab13fec8b3f5718174af6_24_0.png)


    更常见的是，我们希望使用现有的 DOM 元素作为画布的容器，而不是视口。在这种情况下，不需要左/右（x-/ y-）偏移量，因为画布始终会在元素的左上角呈现。考虑以下元素：


    ```

    <div id="my-canvas"></div>

    ```


    我们将使用以下代码创建宽 500px、高 300px 的画布：


    ```

    var paper = Raphael(''my-canvas'', 500, 300);

    ```


    使用这种构造函数形式时，当第一个参数为字符串时，我们始终传递元素 ID。或者，我们可以将 DOM 元素作为第一个参数传递，如下所示：


    ```

    Raphael(document.getElementById(''my-canvas''), 500, 300);

    ```


    ### 画布坐标


    下图说明了使用 `Raphael` 构造函数创建的画布的默认坐标系统。画布的 **原点** 定义为 _x_ 和 _y_ 均等于零的点。画布上 _x_ = 300
    且 _y_ = 200 的点，即矢量表示法中的 (300, 200)，是相对于原点 _x_ 点向右 300px、相对于原点 _y_ 点向下 200px 的点，如下图所示：


    ![](img/d8ec653db4cab13fec8b3f5718174af6_25_0.png)


    同样，(-125, 50) 处的点相对于原点在 _x_ 和 _y_ 方向上的位置，如下图所示：


    ![](img/d8ec653db4cab13fec8b3f5718174af6_25_1.png)


    ### 绘制基本形状


    Raphaël 提供了 `rect`、`circle` 和 `ellipse` 方法来绘制基本形状。这些是我们创建画布时返回的 `Paper` 对象的方法。例如，`rect`
    方法的语法如下（摘自 Raphaël 文档 http://raphaeljs.com/reference.html#Paper.rect）：


    ```

    Paper.rect(x, y, width, height, [r]);

    ```


    `x` 和 `y` 坐标描述矩形的左上角点，第五个参数 `r` 是圆角的半径，方括号表示它是可选的（默认情况下圆角半径为 0）。在 x = 200px、y
    = 150px 处创建宽 50px、高 100px 的矩形，如下所示：


    ```

    var paper = Raphael(''my-canvas'', 500, 300);

    var rectangle = paper.rect(200, 150, 50, 100);

    ```


    同样，我们可以通过以下方式创建宽 75px、圆角半径 15px 的正方形：


    ```

    var square = paper.rect(300, 150, 75, 75, 15);

    ```


    ![](img/d8ec653db4cab13fec8b3f5718174af6_26_0.png)


    请注意，在负 `x` 或 `y` 点绘制的图形将从画布可见区域之外开始绘制，这意味着它们会被部分或完全隐藏，如下图所示：


    两个矩形在下图中显示。请注意，绘图是从矩形的左上角沿正 _x_ 和 _y_ 方向进行的：


    ![](img/d8ec653db4cab13fec8b3f5718174af6_27_0.png)


    圆的语法（http://raphaeljs.com/reference.html#Paper.circle）为：

    Paper.circle(x, y, r);


    虽然矩形的 _x_ 和 _y_ 坐标描述其左上角点，但对于圆形，它们定义其 **中心** 点。第三个参数 _r_ 是圆的半径。在 _x = 100_、_y
    = 100_ 处绘制半径为 50px 的圆，如下所示：

    var paper = Raphael(''my-canvas'', 500, 300);

    var circle = paper.circle(100, 100, 50);


    椭圆的语法（http://raphaeljs.com/reference.html#Paper.ellipse）与圆非常相似，只是我们分别指定 x 和 y
    半径：

    Paper.ellipse(x, y, x-radius, y-radius);


    x 半径是 y 半径两倍的椭圆如下所示：

    var ellipse = paper.ellipse(300, 100, 100, 50)


    '
