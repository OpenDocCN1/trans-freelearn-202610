- pgno: 41
  md: '# # 3 Drawing Paths


    The ability to draw and manipulate paths is an extremely powerful feature of Raphaël.
    In the previous chapter we drew basic shapes based on the paths'' geometric properties
    such as width, height, and radius. Paths allow us to draw all manner of shapes
    by defining points connected by lines, arcs, and curves representing the outline
    of the shape itself.


    Paths, such as basic shapes, are _elements_ meaning that user interaction, painting,
    transformations, and animation are all possible with paths. Raphaël provides a
    number of methods for drawing and manipulating paths to this end so it will be
    the focus of the rest of this book.


    The syntax for drawing paths is defined by the SVG specification. Understanding
    this syntax is essential for creating complex shapes and over the course of this
    chapter we will become intimately familiar with it.


    To give you an idea of what you can achieve with paths, a demo at `http://raphaeljs.com/chart.html`
    will show you how smooth curves are used to join data points as is common in charting
    applications. Indeed, complex SVG illustrations (for example, those created using
    a graphics package such as Adobe Illustrator or Inkscape) are composed of many
    paths, an interesting demo of which can be seen at `http://raphaeljs.com/tiger.html`.


    This chapter is quite comprehensive in its coverage of paths and so it is suggested
    that you break off at the end of each section to review and experiment with the
    concepts covered. In this chapter we will look at the following topics:


    +   - The concepts behind path drawing

    +   - The moveto, lineto, and closepath commands

    +   - Drawing quadratic and cubic Bezier curves

    +   - The arc drawing commands

    +   - Utility methods in Raphaël for working with paths

    +   - The Catmull-Rom curve as exemplified by data interpolation'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # Path drawing concepts


    The process of drawing with a pen on paper can be broken down into the following
    steps:


    +   1. You place your pen at a particular point on a piece of paper.

    +   2. You press and move the pen freely from this point to another point.

    +   3. You keep your pen at this point or lift up the pen and place it at another
    point on the paper.

    +   4. The process is repeated until you have finished drawing.


    Path drawing works in much the same way. The point at which you place your pen,
    known as the **current point**, defines the start of a path while the free movement
    of the pen describes the path itself.


    Consider drawing an arbelos shape. We first place our pen at a point (100, 180)
    on our canvas and draw an arc to the point (380, 180) as shown:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_42_0.png)


    We then create an arc from the point (380, 180) to the point (200, 180):


    ![](img/d8ec653db4cab13fec8b3f5718174af6_42_1.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Finally, we create an arc back to the point (100, 180) to complete the path:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_43_0.png)


    The example of the arbelos demonstrates the drawing of a single path, where we
    did

    not lift up the pen at any point during the drawing process. Were we to lift up
    the

    pen, the subsequent drawing would technically create **subpaths** on the main
    path

    element. In the example, creating a triangle as a subpath has the effect of _adding_
    to

    our single path element. Notice also that the fill attribute is applied to the
    _overall_

    path rather than individual subpaths:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_43_1.png)


    # # Path drawing commands


    Paths are based on a number of drawing commands executed in the order in which

    they’re defined. Commands are expressed as a single letter that is either uppercase,

    meaning that a subsequent drawing uses absolute coordinates in the drawing

    context, or lowercase, meaning that a subsequent drawing uses coordinates relative

    to the current point. Most commands take parameters as arguments that determine

    the behavior of the command. Consider, for example, the following path string:

    "M100,180 a140,140,0,0,1,280,0"


    [ 33 ]'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# # Drawing Paths\n\nThis path string is used in drawing the arbelos of the\
    \ previous section. Drawing\nis started using the `M` command and subsequent arcs\
    \ are then drawn using the\n`a` command.\n\nWe draw paths in Raphaël using the\
    \ `path` method, which accepts either a path string\nor an array as a parameter.\
    \ Arrays are usually a more convenient and more readable\nway of defining paths.\
    \ Consider the following code:\n\n```\n```\nvar xStart = 100;\nvar yStart = 180;\n\
    var path = paper.path([\n\t'M', xStart, yStart,\n\t'a', 140, 140, 0, 0, 1, 280,\
    \ 0\n]);\n```\n```\n\nThis draws the path described by the previous path string.\
    \ The array format is more\nreadable and is a much cleaner way of dealing with\
    \ parameter values assigned to the\nxStart and yStart variables.\n\n> In the interests\
    \ of brevity, we will use both formats for defining a path\n> interchangeably\
    \ throughout this book.\n\n# # The moveto command\n\nThe **moveto** command establishes\
    \ a new current point. In the pen analogy detailed in\nthe previous section, issuing\
    \ a moveto command has the effect of lifting the pen off\nthe page and placing\
    \ it at a given point. All paths start with a moveto command.\n\nThe moveto command\
    \ has the following syntax:\n\n| Command | Parameters | Example |\n|---------|------------|---------|\n\
    | M or m | (x, y)+ | M 50,50 100,100 |\n\nIn the example of the arbelos, `M 100,180`\
    \ has the effect of placing the pen at the point\nx = 100, y = 180. Subsequent\
    \ commands then use these coordinates as the starting\npoint of the drawing.\n\
    \nYou may have noticed that the moveto syntax allows us to repeat the `x` and\
    \ `y`\nparameters (indicated by the `+` symbol). Consider, for example, the following\
    \ path:\n\n`\"M 50,50 100,150\"`\n\n[ 34 ]"
  merge: -1
  img_proc: true
- pgno: 45
  md: "The first (x, y) pair moves the pen to the point (50, 50) on our canvas as\
    \ we would expect. However, the second (x, y) pair has the effect of drawing a\
    \ line to the point (100, 150), as well as moving the current point. This behavior\
    \ means that the moveto command can be used to draw polygons. The following code\
    \ draws a triangle with vertices at (250, 50), (200, 100), and (300, 100) using\
    \ only the moveto command:\n\n```\nvar path = paper.path([\n 'M', 250, 50\n 200,\
    \ 100,\n 300, 100,\n 250, 50\n ]);\n```\n\nYou should notice that all the (x,\
    \ y) points mentioned are absolute, that is, defined relative to the origin point\
    \ of our canvas. Were we to specify the lowercase variant of the command, m, every\
    \ successive (x, y) pair would be relative to the previous one (but note that\
    \ the first (x, y) pair is always positioned using absolute coordinates regardless\
    \ of the M command’s case). The same triangle defined using relative coordinates\
    \ is described by the path string, m 250,50 -50,50 100,0 -50,-50.\n\nA number\
    \ of examples of the moveto command are shown here:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_45_0.png)\n\
    \n# ## The lineto commands\n\nThe **lineto** commands draw straight lines from\
    \ the current point to a point specified. There are three lineto commands:\n\n\
    +   - `L` for drawing lines to any (x, y) point\n+   - `H` for drawing horizontal\
    \ lines in x\n+   - `V` for drawing vertical lines in y"
  merge: -1
  img_proc: true
- pgno: 46
  md: '| Command | Parameters | Example |

    |---|---|---|

    | L or l | (x, y) + | L 100 100 |

    | H or h | x+ | H 75 |

    | V or v | y+ | V -75 |


    By way of example, a line from the point (10, 10) to the point (75, 100) would
    be drawn as follows:


    var line = paper.path([''M'', 10, 10, ''L'', 75, 100]);


    Note that because we use the uppercase command, L, the line is drawn from the
    point (0, 0) and not relative to our start point (10, 10). Had we used the lowercase
    variant, l, the line would have been drawn from (10, 10) to the point (10 + 75,
    10 + 100) = (85, 110).


    By repeating parameters, we can draw polygons (like we did in the previous section
    with moveto, except that lineto can be specified from any current point, not just
    moveto points). For example, a regular hexagon with side length 100 starting at
    the point (200, 15) could be drawn as follows:


    var sideLength = 100;

    var x = sideLength * Math.cos(Raphael.rad(60));

    var y = sideLength * Math.sin(Raphael.rad(60));


    var hexagon = paper.path(

    [''M'', 250, 15,

    ''l'', sideLength, 0,

    x, y,

    -x, y,

    -sideLength, 0,

    -x, -y,

    x, -y,

    x

    ]);


    We use the fact that an exterior angle of a hexagon is 60 degrees (as shown in
    the following diagram) in conjunction with the trigonometric functions sin and
    cos to calculate the x and y coordinates of the point to which we want to draw.
    Starting from the point (250, 15), we draw a line 250 pixels relative in x and
    0 pixels in y; we then draw a line that is x pixels in x and y pixels in y relative
    to this point. Since the hexagon is regular, the magnitudes of the relative x-
    and y-points are equal for sides for which y is greater than zero (all edges except
    the top and bottom edges), hence we are able to draw in factors of x and y back
    to the start point.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/d8ec653db4cab13fec8b3f5718174af6_47_0.png)


    Note that in JavaScript, the trigonometric functions expect a value of angle measured
    in radians to be passed so we have used the `rad` utility method on the `Raphael`
    object to convert 60 degrees into radians.


    # # The closepath command


    The **closepath** command draws a straight line from the current point to the
    starting point of the current subpath. In the example of the hexagon, even though
    we drew back to the start point, the path''s start and end points are not joined.
    The effect is pronounced when applying a large `stroke-width` value to the path
    as shown:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_47_1.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# # Drawing Paths\n\nThe closepath command character is z and does not accept\
    \ any parameters. Since in\nthe previous example we drew a straight line back\
    \ to the end point, we could instead\nclose the path using the closepath command\
    \ as follows:\n\n```\n```\nvar hexagon = paper.path(\n ['M', 250, 15,\n 'l', sideLength,\
    \ 0,\n x, y,\n -x, y,\n -sideLength, 0,\n -x, -y,\n 'z' // in place of the line\
    \ to (x, -y)\n ]\n);\n```\n```\n\nIn this instance, the path’s start and end points\
    \ are joined. Note that the closepath\ncommand can be either uppercase or lowercase\
    \ but this has no effect on its behavior.\n\n# # Drawing curves\n\nThere are three\
    \ types of curve path: quadratic Bézier curves, cubic Bézier curves,\nand arcs.\
    \ Bézier curves are curves defined between a start and end point but whose\ndirection\
    \ we can determine by using control points, while arcs are a portion of the\n\
    circumference of an ellipse.\n\n# # Quadratic Bézier curves\n\nA quadratic Bézier\
    \ curve is a curve between two points with a single control point.\nTo appreciate\
    \ how quadratic Bézier curves are drawn, you should experiment with\nthe animated\
    \ demo at http://www.jasondavies.com/animated-bezier/. As\nshown here, the curve\
    \ is drawn from a point P0 to a point P2 with a control point P1.\nThe control\
    \ point P1 relative to P0 and P2 determines the extent to which the curve\nbends:\
    \ from start to finish, the curve starts off heading in the direction of the control\n\
    point P1 and then bends towards the end point P2 from the direction of P1.\n\n\
    ![](img/d8ec653db4cab13fec8b3f5718174af6_48_0.png)\n\n[ 38 ]\n\nwww.it-ebooks.info"
  merge: -1
  img_proc: true
- pgno: 49
  md: 'There are two quadratic Bézier curve commands, the syntax for which is given
    here:


    | Command | Parameters | Example |

    |---------|------------|---------|

    | Q or q | (x1, y1, x, y)+ | Q 100 50 200 250 |

    | T or t | (x y)+ | T 400 250 |


    The q command (or q for relative points) describes a curve drawn from the current
    point on a path to the point (x, y) using (x1, y1) as a control point. For example,
    consider the following code:


    ```

    ```

    paper.path([''M'', 50, 150, ''Q'', 225, 20, 400, 150]);

    ```

    ```


    This draws the quadratic Bézier curve shown. The equivalent path using the lowercase
    variant of the command would be "M 50,150 q 175,-130 350,0", where the (x, y)
    and (x1, y1) parameters are the relative distances from the start point (50, 100):


    ![](img/d8ec653db4cab13fec8b3f5718174af6_49_0.png)


    Moving the control point affects the way that the path is drawn. For example,
    the path "M 50, 150 Q 100,40 400,150" is shown as:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_49_1.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# # Drawing Paths\n\nAs with the other commands we have encountered so far,\
    \ parameters can be repeatable, which allows us to draw multiple connected quadratic\
    \ Bézier curves. Consider the following code:\n\n```\n```\npaper.path([\n\t'M',\
    \ 50, 150\n\t'Q', 225, 20, 400, 150,\n\t575, 20, 750, 150\n]);\n```\n```\n\nThis\
    \ has the effect of drawing a second curve from (400, 150) to the point (750,\
    \ 150) with a control point at (575, 20):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_50_0.png)\n\
    \nThe `T` or `t` command is shorthand whereby the control point coordinates are\
    \ not specified. Instead, the control point is determined automatically as a reflection\
    \ of the previous control point. Consider the path drawn by the following code:\n\
    \n```\n```\npaper.path([\n\t'M', 50, 150,\n\t'Q', 225, 20, 400, 150,\n\t'T', 750,\
    \ 150\n]);\n```\n```\n\nThis creates two curves as shown in the following screenshot.\
    \ The current point at the start of the path drawn by `T` is (400, 150). Relative\
    \ to this point, a reflection of the previous control point (225, 20) is (575,\
    \ 280):\n\n[ 40 ]\n\nwww.it-ebooks.info"
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/d8ec653db4cab13fec8b3f5718174af6_51_0.png)


    # # Cubic Bézier curves


    The principles behind drawing cubic Bézier curves are similar to those for quadratic
    Bézier curves except that cubic Bézier curves have two control points. Again,
    in order to appreciate how cubic Bézier curves are drawn, you should take a look
    at the animated demo at http://www.jasondavies.com/animated-bezier/. The cubic
    Bézier curve’s path (highlighted in red in the screenshot) starts from P0 and
    heads in the direction of P1 before arriving at the end point P3 from the direction
    of P2:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_51_1.png)


    There are two cubic Bézier curve commands, the syntax for which is shown in the
    table given:


    | Command | Parameters | Example |

    |---|---|---|

    | C or c | (x1, y1, x2, y2, x, y)+ | C 150 25 350 50 500 300 |

    | S or s | (x2, y2, x y)+ | t 200 -100 200 50 |'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Drawing Paths\n\nThe c command requires that we specify both control points.\
    \ The following code\nhas the effect of drawing a curve from the point (200, 20)\
    \ to (200, 120) via the control\npoints (400, 140) and (400, 180). Note also that\
    \ we have closed the path and applied\nan attribute fill:\n\n```\npaper.path([\n\
    \t'M', 200, 20,\n\t'C', 400, 140, 400, 180, 200, 120,\n\t'z'\n]).attr({fill: '#222'});\n\
    ```\n\nThe result is shown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_52_0.png)\n\
    \nThe s command has a similar effect to the T command in automatically creating\
    \ a\ncontrol point reflected about the current point. What it actually does is\
    \ to reflect the\nsecond control point about the current point and this becomes\
    \ the first control point\nfor our new subpath, for which we now have to specify\
    \ our second control point.\nThe code given here extends the previous example\
    \ with a subpath drawn using\nthe s command:\n\n```\npaper.path([\n\t'M', 200,\
    \ 20,\n\t'C', 400, 140, 400, 180, 200, 120,\n\t'S', 0, 100, 200, 220,\n\t'z'\n\
    ]);\n```\n\nThe s path starts from the current point (200, 120) and finishes at\
    \ (200, 220) as shown.\nThe second control point from our first curve, defined\
    \ at (400, 180), is reflected about\nthe current point, which creates a control\
    \ point at (0, 60). We have then specified a\nsecond control point at (0, 100):"
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/d8ec653db4cab13fec8b3f5718174af6_53_0.png)


    The hardest thing about working with Bézier curves is deciding where to define
    your control points. Figuring these out is usually achieved by one of the following:


    +   - Trial and error

    +   - Mathematical computation

    +   - Using a graphics package such as Inkscape to aid you in drawing


    # # Drawing arcs


    The syntax for drawing arcs is the most involved of all the drawing commands.

    This is because when we draw an arc from one point to another, there are four

    possible arc paths available to us as shown here—there are two ellipses on whose

    circumference the start and end points can lie. The first two arcs are known as
    **minor**

    arcs while the latter two arcs are known as **major** arcs. The resultant arc
    is also

    affected by the angular direction taken in going from the start point to the end
    point:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_53_1.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: "The syntax for arc drawing is given in the following table:\n\n| Command |\
    \ Parameters | Example |\n|---|---|---|\n| A or a | (rx, ry,\nx-rotation,\nlarge-arc-flag,\n\
    sweep-flag,\nx, y)+ | a 25 50 0 1 0 100 200 |\n\nThe following table describes\
    \ each of the individual parameters:\n\n| Parameters | Description |\n|---|---|\n\
    | rx and ry | Since an arc is a portion of an ellipse, it has a radius in x and\
    \ y |\n| x-rotation | The counterclockwise rotation of the ellipse along which\
    \ the arc is drawn (a value in degrees) |\n| large-arc-flag | Whether our arc\
    \ is drawn as a major (1) or minor (0) arc |\n| sweep-flag | Whether the arc is\
    \ drawn in a positive (1), that is, clockwise or negative (0), that is, counterclockwise,\
    \ angular direction |\n| x and y | The end point of our arc |\n\nThese parameters\
    \ are perhaps best illustrated by example. Consider drawing a major arc path with\
    \ a sweep-flag equal to 1:\n\n```\npaper.path([\n\t'M', 50, 60,\n\t'a', 150, 80,\
    \ 0, 1, 1, 0, 80\n]);\n```\n\nWe first move to the current point (50, 60) and\
    \ then draw an arc with an x-radius of 150 and a y-radius of 80. We set the x-rotation\
    \ value equal to 0 and identify that we’re drawing the large arc by setting large-arc-flag\
    \ equal to 1. The sweep-flag value is equal to 1 and we use the lowercase, that\
    \ is, relative, variant of the A command meaning our final x and y parameters\
    \ (0, 80) are units relative to the start point, that is: 0 additional pixels\
    \ in x and 60 additional pixels in y giving end point coordinates of (50, 140).\
    \ The resultant arc is shown as follows."
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/d8ec653db4cab13fec8b3f5718174af6_55_0.png)


    Were we to specify a `large-arc-flag` value equal to 0, the minor arc of the ellipse
