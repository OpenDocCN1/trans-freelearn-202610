    \ + 10,\n (bBox.height * 8) + 18,\n '= 50 million people'\n).attr('text-anchor',\
    \ 'start');\n```\n\nThe position of this person path on our canvas is arbitrary.\
    \ We place it at eight times the height of the paths bounding box so that it appears\
    \ just below our six rows of people.\n\n# # Tweets by time\n\nThere are approximately\
    \ 3,000 tweets every second on average, meaning that over the space of 5 minutes\
