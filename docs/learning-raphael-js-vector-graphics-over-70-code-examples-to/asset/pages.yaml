  md: "# # Basic animation\n\nAnimation is accomplished using the `animate` method\
    \ of an element. The method\ntakes the following parameters in the order that\
    \ they’re defined:\n\n| Parameter | Type | Description |\n|---|---|---|\n| attributes\
    \ | Object | Key-value pair attributes as per the `Element`. `attr()` method |\n\
    | duration | Number | The number of milliseconds that the duration should last\
    \ for |\n| easing (optional) | String | A string describing the rate of change\
    \ of an attribute with regard to time |\n| callback (optional) | Function | A\
    \ function that is executed at the point at which the animation ends |\n\nTo demonstrate\
    \ animation, consider a circle whose center point is at (100, 100) with\nradius\
    \ 50px:\n\n```\n```\nvar circle = paper.circle(100, 100, 50).attr({fill: 'green'});\n\
    ```\n```\n\nWe could animate the circle to a point (500, 100) and a reduced radius\
    \ of 15px\nas follows:\n\n```\n```\ncircle.animate({\n cx: 500,\n r: 15\n }, 1000);\n\
    ```\n```\n\nThe circle is animated over a period of a second and its initial and\
    \ final states are\nshown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_76_0.png)\n\
    \n> > To really appreciate the examples given in this chapter you should make\n\
    > recourse to the source code demos or site accompanying this book.\n\n[ 66 ]"
  merge: -1
  img_proc: true
