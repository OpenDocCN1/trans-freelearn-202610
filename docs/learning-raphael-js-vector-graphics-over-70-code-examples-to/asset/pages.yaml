    \t'M', 100, 100,\n\t'C', 100, 0, 400, 200, 400, 100,\n\t'S', 100, 200, 100, 100,\n\
    \t'z'\n]).attr({'stroke-width': 2});\nvar circle = paper.circle(0, 0, 13).attr({\n\
    \tfill: '#09c', cursor: 'pointer'\n});\n```\n\nOur circle is initialized to the\
    \ (0, 0) point since we are going to apply a custom attribute to it to determine\
    \ its initial position.\n\nOur custom attribute, which we'll name `pathFactor`,\
    \ determines the point on the path at which our circle should lie given how much\
    \ of the animation has elapsed. If we define `distance = 0` as the start point\
    \ of our animation and `distance = 1` as the end point, we can multiply distance\
    \ by the total length of the path to determine how much of its length our circle\
    \ should traverse:"
