- pgno: 57
  md: '# # Element.getPointAtLength(length)


    We can get the _x_ and _y_ coordinates of any point along the length of a path
    using the getPointAtLength method. This method returns an object with _x_ and
    _y_ attributes. Using the example of a bowling pin from the previous section,
    we plot two circular points at the one-eighth and one-half of the total length
    of the path as follows:


    ```

    var totalLength = pin.getTotalLength();

    p1 = pin.getPointAtLength(totalLength / 8);

    p2 = pin.getPointAtLength(totalLength / 2);

    paper.circle(p1.x, p1.y, 10);

    paper.circle(p2.x, p2.y, 10);

    ```


    Another attribute of the object returned by getPointAtLength is the alpha attribute.
    This returns the positive angle relative to the x-axis subtended by the gradient
    or derivative line at the point specified as illustrated:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_57_0.png)


    Knowing the derivative at a point is useful as it informs us of the extent to
    which the arc is changing in _x_ and _y_ at that particular point.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "# # Element.getSubpath(from, to)\n\nGiven a path element, the `getSubpath`\
    \ method calculates the path string for a subsection of its path. Given two points\
    \ on a path, it returns the path string that describes the original path between\
    \ just those two points. Consider the cubic Bézier curve between the points (100,\
    \ 100) and (300, 100) with anchor points at (100, 200) and (300, 0):\n\n```\n\
    var path = paper.path([\n\t'M', 100, 100, 'c', 0, 100, 200, -100, 200, 0\n]);\n\
    path.attr('stroke-width', 5);\n```\n\nWe retrieve the subpath between the point\
    \ one-quarter along its length to the point at one half of its total length as\
    \ follows:\n\n```\nvar totalLength = path.getTotalLength();\nvar subPath = path.getSubpath(\n\
    \ttotalLength / 4, totalLength / 2\n);\n```\n\nThe `getSubpath` method returns\
    \ a path string that can be re-used. For example:\n`paper.path(subPath).attr('stroke-width',\
    \ 15);`\n\nThis code draws a shorter, thicker section of our original path as\
    \ shown here:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_58_0.png)\n\n> > There\
    \ are a number of other utility methods on the `Raphael` object that are particularly\
    \ useful when working with Bézier curves in the context of transformation and\
    \ animation. We will look in more detail at some of these methods in the remainder\
    \ of this book."
  merge: -1
  img_proc: true
- pgno: 59
  md: "# # Catmull-Rom curves\n\nIn those cases where we need to draw a curve that\
    \ passes through a prescribed\nset of points, a Catmull-Rom curve is often appropriate.\
    \ Catmull-Rom curves are\ncommonly used in charting (that is, in data plotting)\
    \ and gaming (for example, to\nmove a character along a predefined trajectory).\n\
    \nRaphaël provides a path command to facilitate the drawing of Catmull-Rom curves.\n\
    The syntax for drawing Catmull-Rom curves is given:\n\n| Command | Parameters\
    \ | Example |\n|---------|------------|---------|\n| R or r | x1,y1 (xi, yi)+\
    \ | a 25 50 0 1 0 100 200 |\n\nThe point (x1, y1) is the second point the curve\
    \ should pass through while the\n(xi, yi) points are every subsequent point. The\
    \ first point should always be our\ncurrent point, from which the curve starts.\n\
    \nTo illustrate Catmull-Rom curves, consider the following data points stored\
    \ in\nan array:\n\n```\n```\nvar data = [\n\t{x: 50, y: 250},\t\t{x: 100, y: 100},\t\
    \t{x: 150, y: 150},\n\t{x: 200, y: 140},\t\t{x: 250, y: 250},\t\t{x: 300, y: 200},\n\
    \t{x: 350, y: 180},\t\t{x: 400, y: 230}\n];\n```\n```\n\nTo plot these data points,\
    \ we iterate over the array and draw a circle at each x and y\nposition (note\
    \ that the points are grouped in to a set which makes applying attributes\nto\
    \ them easier):\n\n```\n```\nvar plottedPoints = paper.set();\nfor(var i = 0,\
    \ num = data.length; i < num; i+=1) {\n\tvar point = data[i];\n\tplottedPoints.push(paper.circle(point.x,\
    \ point.y, 5));\n};\nplottedPoints.attr({fill: '#09c', 'stroke-width':0});\n```\n\
    ```\n\nWhen constructing our path string or path array, we make the current point\
    \ our first\ndata point using the M command and append the R command to begin\
    \ drawing our\nCatmull-Rom curve:\n\n```\n```\nvar path = ['M', data[0].x, data[0].y];\n\
    path.push('R');\n```\n```"
  merge: -1
  img_proc: true
- pgno: 60
  md: "We then iterate over all remaining points (all points except the first) and\
    \ append their values to our path array:\n\n```javascript\nfor(var i = 1, num\
    \ = data.length; i < num; i+=1) {\n  path.push(data[i].x);\n  path.push(data[i].y);\n\
    }\nvar curve = paper.path( path );\n```\n\nThe resultant curve drawn using the\
    \ `path` command is shown here:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_60_0.png)\n\
    \n# ## Summary\n\nWe have now covered all the main drawing methods in Raphaël\
    \ and you should be familiar with the syntax used to draw paths. At this point,\
    \ it is definitely worth experimenting with the path commands and utility methods\
    \ we have covered in order to create your own unique graphics.\n\nWe are nicely\
    \ poised to begin looking at interacting with and manipulating our drawings. Up\
    \ to now, the graphics we have created are drawn once and do not change. In the\
    \ next chapter we will look at responding to events triggered by a user and transforming\
    \ the elements that we create."
  merge: -1
  img_proc: true
- pgno: 61
  md: '# # 4 Transformations and Event Handling


    Having spent the past two chapters drawing static graphics, we will now start
    to look at how we can transform them and how we can interact with them in the
    browser.


    When you create an element in Raphaël, you are effectively creating a **Document
    Object Model (DOM)** object. Like the DOM objects you are already familiar with
    elements drawn on to our canvas will trigger events when interacted with by a
    user. Raphaël provides a number of convenient, cross-browser methods for interacting
    with elements and also provides methods that facilitate the drag-and-drop functionality.


    Transformations are equally versatile: Raphaël gives us the ability to transform
    (translate, scale, and rotate) elements with ease using the concept of a **transformation
    string**.


    Over the course of this chapter, we will look at event handling and transformations
    alongside each other, combining both facets of the library to yield interactive
    graphics. Overall, we will cover:


    +   - The transform method and basic transformations

    +   - Matrix transformations

    +   - Registering and unregistering basic event handlers

    +   - Achieving the drag-and-drop functionality'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# # Basic transformations and event handling


    We perform transformations in Raphaël using the `transform` method on elements,

    which accepts as an argument a transformation string. Transformation strings define

    a sequence of transformations to take place on a particular element.


    You can also transform elements and sets using the `transform` attribute. This
    is often

    convenient when we are changing multiple attributes at the same time. You will
    see

    examples of this in Chapter 5, Vector Animation.


    # ## Basic transformations


    Like a path string, a transformation string is composed of a number of commands

    defined in the order in which they are to be interpreted. The syntax for the basic

    commands is as follows, where brackets indicate optional parameters:


    | Command | Parameters | Example |

    |---------|------------|---------|

    | T or t | x, y | t 50,100 |

    | R or r | angle of clockwise rotation,

    (rotation_point_x,

    rotation_point_y) | R 45,0,0 |

    | S or s | scale_x,

    scale_y,

    (scale_point_x,

    scale_point_y)

    or

    scale_factor,

    (scale_point_x,

    scale_point_y) | S 2,4.5,75,125 |


    As with a path string, transformation strings have uppercase and lowercase

    variants. The uppercase variant means that we transform, irrespective of the

    previous transformation, while the lowercase variant takes previous transformations

    into account. The following examples demonstrate the basic transformations.'
  merge: -1
  img_proc: true
- pgno: 63
  md: "# # Translation\n\nFirst off, consider drawing a triangle and creating a copy\
    \ of it using the `clone` method:\n\n```\n```\nvar triangle = paper.path(\"M 150\
    \ 20 1 100 160 1 -200 0 z\").attr({\n 'stroke-dasharray': '- ',\n 'stroke-width':\
    \ 5\n});\n```\n```\n\n```\n```\nvar triangleCopy = triangle.clone(); // Clones\
    \ our object\ntriangleCopy.attr({\n 'stroke-dasharray': ''\n});\n```\n```\n\n\
    When cloned, the copied triangle has all the same attributes as the original triangle\
    \ so we unset `stroke-dasharray` to give it a solid outline. We then perform a\
    \ translation of 300px on the x-axis and 0px on the y-axis as follows:\n\n```\n\
    ```\ntriangleCopy.transform(\"T 300 0\");\n```\n```\n\nThis has the effect of\
    \ moving our cloned triangle in `x` as shown in the following diagram:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_63_0.png)\n\
    \nNote that while the `clone` method is convenient, it is known to affect performance\
    \ adversely when cloning multiple elements. When cloning multiple elements, creating\
    \ a new element using the original path is advised.\n\n# # Rotation\n\nCreating\
    \ another cloned triangle now and transforming it with the transformation string\
    \ below gives us a triangle rotated 45 degrees clockwise about its own center\
    \ point (the default when we do not specify a rotation point) after being translated\
    \ 350px in x and -35px in y.\n\n```\n```\ntriangleCopy.transform(\"t 350 -35 r\
    \ 45\");\n```\n```"
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Transformations and Event Handling


    Here we have combined the commands. In this instance, the transformations are
    mutually independent meaning that the case of each command is unimportant. However,
    consider rotation about a point:


    ```

    ```

    triangleCopy.transform("t 100 0 r 180 220 100");

    ```

    ```


    This transformation first translates our triangle by 100px in _x_ and then rotates
    it by 180 degrees clockwise. Our rotation point (220, 100) is not the point that
    the triangle is rotated about because the rotation point is effectively translated
    100px in _x_ to the new point (320, 100). The important point to note here is
    that _the lowercase transformation command takes the previous transformation into
    account_:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_64_0.png)


    In the case of the absolute rotation command, R, rotation about the point (220,
    100) likewise occurs after translation but the results are markedly different
    as shown in the following diagram given here. The `t 100,0 R 180,220,100` transformation
    string always rotates an element about the point (220, 100) irrespective of the
    previous transformations:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_64_1.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# # Scaling\n\nScaling can be performed either equally on all points about\
    \ a scaling point or a factor\nin x and y. The scaling for the t 300 0 s 0.5 transformation\
    \ scales all points by 0.5\ntimes their original about the center point of the\
    \ element as shown:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_65_0.png)\n\n\
    Scaling in x and y by the t 310 0 s 1.2 0.5 transformation string scales the\n\
    element 1.2 times in x and 0.5 times in y as shown:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_65_1.png)\n\
    \n# # Basic event handling\n\nRaphaël supports registering and unregistering a\
    \ whole bunch of event handlers\non elements. You are encouraged to experiment\
    \ with the available event handlers,\na number of which we will demonstrate by\
    \ example.\n\n# # Registering basic event handlers\n\nWe will demonstrate registering\
    \ the double-click, mouse over, and mouse out event\nhandling methods on a salinon\
    \ shape. Firstly, we can draw a salinon as follows:\n\n```\n```\nvar salinon =\
    \ paper.path([\n    'M', 100, 200,\n    'a', 150, 150, 0, 0, 1, 300, 0,\n    50,\
    \ 50, 0, 0, 0, -100, 0,\n    50, 50, 0, 0, 1, -100, 0,\n    50, 50, 0, 0, 0, -100,\
    \ 0\n]);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 66
  md: "We then define the aforementioned event handlers as follows, where each creates\
    \ a transformation on an element:\n\n```\nsalinin.mouseover(function() {\n   \
    \ this.transform('R 180');\n});\nsalinin.dblclick(function() {\n    this.transform('r\
    \ 45');\n});\nsalinin.mouseout(function() {\n    this.transform('');\n});\n```\n\
    \nThis has the effect of:\n\n+   - When moving your mouse over the element, it\
    \ is rotated by 180 degrees\n+   - When double-clicking the element, it is rotated\
    \ by 45 degrees\n+   - When moving your mouse outside of the element, the transformation\
    \ is reset\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_66_0.png)\n\nConcerning\
    \ the resetting of transformations, passing an empty string to the transform method\
    \ has the effect of returning the shape to its original position.\n\nYou will\
    \ notice by running the previous code that the 45 degree rotation is performed\
    \ relative to its initial position, not that defined by the 180 degrees rotation.\
    \ This is because every invocation of the transform method is relative to the\
    \ original state of the element. If, however, we want to transform an element\
    \ from its current state—that resulting from the previous invocation of transform—we\
    \ can prefix our transformation commands with an ellipsis in order to append a\
    \ new transformation. Consider the following transformations:\n\n```\nsalinin.click(function()\
    \ {\n    this.transform('t 300 0 R 180');\n});\nsalinin.dblclick(function() {\n\
    \    this.transform('...t 200 0 r 45');\n});\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: "The first transformation, invoked on a single click, translates the element\
    \ 300px in x\nand also rotates it by 180 degrees clockwise. The second transformation,\
    \ invoked on\na double-click, where the start command is prefixed by an ellipsis,\
    \ is translated by\nan additional 200px and rotated 45 degrees clockwise relative\
    \ to the current rotation.\nNote that the additional 100px translation in x is\
    \ in the negative x-direction, this is\nbecause we take the previous 180 degrees\
    \ rotation into account. This means that our\nsalion now \"faces\" the opposite\
    \ way.\n\nNote that the this keyword refers to the element to which the event\
    \ handler\nis bound.\n\n# # Unregistering basic event handlers\n\nIn order to\
    \ unregister event handlers, Raphaël provides us with methods whose\nnames are\
    \ the names of the registering event handler prefixed with \"un-\". The click\n\
    event handler, for example, is unregistered using unclick.\n\nThe unregistering\
    \ event handlers are methods of the element to which you have\nregistered event\
    \ handlers and accepted as a parameter the event handling function.\nConsider\
    \ a square that is rotated by 15 degrees clockwise relative to its current\nposition\
    \ when clicked:\n\n```\n```\nvar square = paper.rect(50, 50, 100, 100);\nvar clickHandler\
    \ = function() {\n\tthis.transform('...r 15');\n};\nsquare.click(clickHandler);\n\
    ```\n```\n\nWe have defined an event handler, clickHandler, in our current scope\
    \ and passed\nthis as a parameter to our click method in order to register it.\
    \ We unregister the\nclick event handler on the square as follows:\n\n```\n```\n\
    circle.dblclick(function() {\n\tsquare.unclick(clickHandler);\n}\n```\n```\n\n\
    This has the effect of clickHandler no longer being called when the circle is\n\
    double-clicked.\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_67_0.png)"
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Working with matrices


    A **matrix** is a rectangular array of elements arranged in rows and columns.
    It is convention to specify the number of rows first when referring to the size
    of a matrix, so a 3-by-2 matrix, for example, would be:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_68_0.png)


    Each element in a matrix can be thought of as a component that maps some point
    to another point. The point (_x_, _y_), for example, can be mapped to (_p_, _q_)
    as follows:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_68_1.png)


    This matrix defines a transformation from one point in 2D space to a new point
    in 2D space. The new _x_-point, _p_, is scaled by 2 while the new _y_-point, _q_,
    is scaled by 2 and translated by the original _x_ (this effect is known as **shear**).


    # # Transformation matrices


    Transformations in Raphaël are known as **affine transformations**. The idea is
    that we treat every point in 2D space as a point in 3D space, which allows us
    to represent a transformation using matrices. The 3D point is fixed at 1 so that
    an (_x_, _y_) point is represented as (_x_, _y_, 1), that is, it does not vary
    in the third dimension.


    In this notation, a point resulting from a transformation, (_p_, _q_), is derived
    as follows:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_68_2.png)


    The elements _a_, _b_, _c_, _d_, _e_, and _f_ represent a variety of transformations
    depending on the values assigned to them.


    # # Using transformation matrices


    When creating transformations, you can pass matrix parameters directly to a transformation
    string using the syntax `"M a, b, c, d, e, f"`. This has the effect of applying
    a transformation matrix to every point on an element.


    [ 58 ]'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# # Using transformation matrices to perform shear\n\nThe matrix for shear\
    \ transformations is as follows:\n\n```\n```\n⎡a c e⎤   ⎡1   Sx  0⎤\n⎢b d f⎥ =\
    \ ⎢Sy   1  0⎥\n⎣0 0 1⎦   ⎣0   0   1⎦\n```\n```\n\nSx and Sy represent the factor\
    \ by which x and y points are sheared respectively. For example, applying the\
    \ transformation string \"m 1 0 0.5 1 0 0\" (Sx = 0.5, Sy = 0) to a square has\
    \ the effect of transforming it into a rhombus in x:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_69_0.png)\n\
    \nUsually we want to apply a shear at angles relative to the x and y axis respectively.\
    \ This is demonstrated at http://raphaeljsvectorgraphics.com/the-graphical-web/css3-raphael-transforms.\
    \ In order to achieve this, we use the following transformation matrix:\n\n```\n\
    ```\n⎡a   c   e⎤   ⎡1   tan(α)   0⎤\n⎢b   d   f⎥ = ⎢tan(β)   1   0⎥\n⎣0   0  \
    \ 1⎦   ⎣0   0   1⎦\n```\n```\n\nIn this form, the angle β is the angle of shear\
    \ clockwise relative to the x-axis (giving a resultant shear in y) and α is the\
    \ angle of shear counterclockwise relative to the y-axis (giving a resultant shear\
    \ in x). Consider the following transformation on a square:\nSquare.transform(\n\
    \t['m', 1, 0, Math.tan(Raphael.rad(25)), 1, 0, 0]\n\t);\nA 25 degrees transformation\
    \ is applied relative to the y-axis giving a shear in x."
  merge: -1
  img_proc: true
- pgno: 70
  md: "# # The drag-and-drop functionality\n\nThe drag-and-drop functionality is a\
    \ powerful feature of Raphaël. In particular, we are offered a good deal of control\
    \ over drag events, which affords us the ability to create more usable applications.\n\
    \n# # The Element.drag() method\n\nThe drag method of an element has the following\
    \ syntax:\n\n```\nElement.drag(\n    onmove, onstart, onend, [mcontext], [scontext],\
    \ [econtext]\n)\n```\n\nThe onmove, onstart, and onend functions are callback\
    \ functions invoked during the life cycle of a dragged element, while mcontext,\
    \ scontext, and econtext define the this variable in the scope of these functions\
    \ (defaulting to the element that is being dragged).\n\n# # The onstart event\
    \ handler\n\nThe onstart event handler is called when element dragging is first\
    \ initiated. It is usually used as an initializer to mark the start x and y points\
    \ of the element that we are modifying.\n\n# # The onend event handler\n\nThe\
    \ onend event handler is called when element dragging finishes, for example, when\
    \ the mouse is released after moving an element from one point to another. It\
    \ is commonly used to:\n\n+   - Reinitialize an element after dragging\n+   -\
    \ Check the current position of an element in our drawing context\n+   - Define\
    \ any other actions that should occur subsequent to a drag-and-drop\n\n# # The\
    \ onmove event handler\n\nThe onmove event handler is called every time an element\
    \ is moved during dragging. It has the parameters dx and dy that describe the\
    \ amount by which the element has been dragged in x and y respectively."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# # Dragging by example\n\nConsider for example dragging a square. We first\
    \ define our element and keep a reference to its start _x_ and _y_ positions in\
    \ the `onstart` event handler. To highlight that our element is in a \"drag\"\
    \ state, we also paint it pink. In our `onend` event handler, we reset the fill\
    \ to be black to indicate that dragging has finished:\n\n```\n```\nvar startX,\
    \ startY;\nfunction onstart() {\n    startX = this.attr('x');\n    startY = this.attr('y');\n\
    \    this.attr('fill', 'pink');\n}\n```\n```\n\n```\n```\nfunction onend() {\n\
    \    this.attr('fill', '#000');\n}\n```\n```\n\nOur `onmove` event handler is\
    \ responsible for setting the _x_ and _y_ positions of the element based on the\
    \ original _x_ and _y_ positions plus `dx` and `dy` as follows:\n\n```\n```\n\
    function onmove(dx, dy) {\n    this.attr({\n        x: startX + dx,\n        y:\
    \ startY + dy\n    });\n}\n```\n```\n\nFinally, we invoke drag on our element,\
    \ passing in the individual event handlers:\n\n```\n```\nsquare.drag(onmove, onstart,\
    \ onend);\n```\n```\n\nThe resultant transformation is demoed in the sample code\
    \ accompanying this chapter.\n\n> > Note that `dx` and `dy` are commonly used\
    \ in mathematics to refer to small changes in _x_ and _y_. Every time that the\
    \ `onmove` event handler is called, its `dx` and `dy` parameters will have values\
    \ representing a small change in each direction."
  merge: -1
  img_proc: true
- pgno: 72
  md: "# # Dropping elements\n\nAt the end of dragging an element, we can perform\
    \ checks to see where it has\nended up relative to other elements. A **drop**\
    \ is essentially a check to see whether\nour element falls within some particular\
    \ set of bounds.\n\n# # Bounding box overlapping\n\nEvery element has a bounding\
    \ box that defines the smallest rectangular region\ncontaining all points of an\
    \ element. By checking to see whether two bounding boxes\noverlap we can determine\
    \ whether or not an element was \"dropped\" on to another.\n\nConsider defining\
    \ a target rectangle alongside our square:\n\n```\n```\nvar target = paper.rect(400,\
    \ 100, 200, 200);\nvar square = paper.rect(100, 100, 100, 100);\n```\n```\n\n\
    Our `onstart` and `onmove` event handlers are defined as per the example in the\n\
    previous section and are responsible for initialization and movement respectively.\n\
    \nThis time, in our `onend` event handler, we get the bounding boxes of each of\
    \ our\nsquare and target element using the `getBBox` method and then check whether\
    \ or\nnot the elements overlap using `isBBoxIntersect`:\n\n```\n```\nfunction\
    \ onend() {\n    var bbox = this.getBBox(),\n        targetBBox = target.getBBox();\n\
    \n    if(Raphael.isBBoxIntersect(bbox, targetBBox)) {\n        this.undrag();\n\
    \        this.attr({\n            x: 450,\n            y: 150\n        });\n \
    \   }\n}\n```\n```\n\nWhen the elements do overlap, we remove all `drag` event\
    \ handlers on the element by\ninvoking `undrag` and setting its `x` and `y` positions\
    \ to some arbitrary values that fall\nwithin the bounding box of our target."
  merge: -1
  img_proc: true
- pgno: 73
  md: "# # Bounding box inside bounding box\n\nWhile the `isBBoxIntersect` method\
    \ is convenient, we sometimes need to know whether or not all points on an element\
    \ are inside another. Going back to the previous example, we could check to see\
    \ whether the top-left vertex and bottom-right vertex of our square's bounding\
    \ box fall within the target bounding box using the `isPointInsideBBox` method\
    \ like so:\n\n```\n```javascript\nfunction onend() {\n    var targetBBox = target.getBBox();\n\
    \    var topLeftVertex = {\n        x: this.attr('x'),\n        y: this.attr('y')\n\
    \    };\n    var bottomRightVertex = {\n        x: this.attr('x') + this.attr('width'),\n\
    \        y: this.attr('y') + this.attr('height')\n    };\n\n    var point1InsideBox\
    \ = Raphael.isPointInsideBBox(\n        targetBBox, topLeftVertex.x, topLeftVertex.y\n\
    \    );\n    var point2InsideBox = Raphael.isPointInsideBBox(\n        targetBBox,\
    \ bottomRightVertex.x, bottomRightVertex.y\n    );\n    if(point1InsideBox &&\
    \ point2InsideBox) {\n        this.undrag();\n        this.attr({ x: 450, y: 150\
    \ });\n    }\n}\n```\n```\n\nThe top-left vertex of the square is defined by its\
    \ x and y attribute while the bottom-right vertex is described by the (x, y) point\
    \ plus the width and height of the element. Only when both points lie within the\
    \ bounding box of our target do we uninitialize the `drag` event handling.\n\n\
    This approach works really well for target elements whose overall shape is defined\
    \ accurately by a rectangular bounding box. In those cases where a shape is not\
    \ defined particularly well by a rectangular bounding box, a more suitable mathematical\
    \ approach would be sought."
  merge: -1
  img_proc: true
- pgno: 74
  md: '# # Summary


    In this chapter we have covered a lot of ground relating to both event handling
    and transformations. You should be familiar with some of the ways that we are
    able to interact with our drawings and transform them at will.


    We are in a prime position now to look at truly bringing our drawings to life
    by animating them and will do so in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Vector Animation


    Till now we have looked at drawing static graphics and interacting with and transforming
    them instantaneously. Animation affords us the ability to change graphics with
    regard to time, that is, we can modify the attributes of a vector graphic over
    some non-zero time interval.


    Prior to the emergence of the JavaScript frameworks of the early 2000s, animation
    was largely achieved by Flash and to a lesser extent by Java applets. With the
    advent of these frameworks, animation of the DOM lead to slicker and more intuitive
    user interfaces and more semantic websites. In more recent years, HTML5, CSS3,
    WebGL, and SVG afford developers the ability to create more complex, fully fledged
    animations and interactive user interfaces.


    Raphaël makes animating vector graphics straightforward and in the course of this
    chapter we look at some of the different ways you can animate graphics using the
    library. We will be covering the following topics in particular:


    +   - Animating method and basic attribute animation

    +   - Animating paths

    +   - Easing using the cubic Bézier syntax

    +   - Animating transformations

    +   - Animation using custom attributes and animation along a path'
  merge: -1
  img_proc: true
