- pgno: 82
  md: "# # Vector Animation\n\nThe CSS3 syntax that describes this path is `cubic-bezier(0.1,\
    \ 0.97, 0.08, 0.03)`. This was generated using a useful tool at `http://www.roblaplaca.com/\
    \ examples/bezierBuilder/` that allows you to visually construct your custom easing\
    \ path and get the `cubic-bezier` values for the resultant easing.\n\nBy way of\
    \ example consider two circles, one of which is animated in `cx` with this easing\
    \ while the other has linear easing:\n\n```\n```\ncircle.animate({\n cx: 450\n\
    }, 1000, \"cubic-bezier(0.10,0.97,0.08,0.03)\");\ncircle2.animate({\n cx: 450\n\
    }, 1000, 'linear');\n```\n```\n\nWhen this code is run you will see that the first\
    \ circle sets off much quicker than the second but by the end of the animation\
    \ the `cx` value varies approximately linearly for both circles.\n\n# # Animating\
    \ transformations\n\nAs with paths, an element’s transform is an attribute on\
    \ the element meaning we can animate in the same manner. Consider, for instance,\
    \ a square that we can rotate on a click:\n\n```\n```\nsquare.click(function()\
    \ {\n this.animate({\n transform: '...r 45'\n }, 300);\n});\n```\n```\n\nThe ellipsis\
    \ ensures that every successive click will rotate the square from its current\
    \ position by 45 degrees in the clockwise direction.\n\nSimilarly, we can animate\
    \ more complex transformations. Consider, for instance, successively animating\
    \ a square with a 5-degree shear in `x`:\n\n```\n```\nvar anim = Raphael.animation({\n\
    \ transform: [\n '...', 'M', 1, 0, Math.tan(Raphael.rad(5)), 1, 0, 0\n ]\n}, 300);\n\
    square.click(function() {\n this.animate(anim);\n});\n```\n```\n\n[ 72 ]\n\nwww.it-ebooks.info"
