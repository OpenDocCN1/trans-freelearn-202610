- pgno: 23
  md: '# # 2 Basic Drawing with Raphaël


    Raphaël supports three fundamental types of graphics elements: shapes, images,

    and text. Shapes can be predefined shapes such as a rectangle, circle, or ellipse
    or

    they can be a combination of lines, curves, and paths. Vector graphics are by
    their

    very definition the sum of such shapes, and throughout the next two chapters

    we will create a number of interesting drawings based on them. Images are

    either bitmap images (such as .png or .jpeg) or existing SVG images, and

    can be manipulated by Raphaël in many of the ways that shapes can be.


    Shapes and text can be painted, that is, filled and stroked (given an outline).
    Fills

    can be either a single color or a linear or radial gradient. Strokes can only
    be filled

    by a single color but the way in which a shape is stroked is modifiable.


    Some examples of painted shapes can be seen at

    http://raphaeljsvectorgraphics.com/basic-drawing/shapes-and-attributes.


    In this chapter we will:


    +   - Look at the browser as the context in which we draw

    +   - Draw basic shapes

    +   - Apply fills, strokes, and other attributes to elements

    +   - Apply gradient fills to elements

    +   - Work with custom text and look at embedding custom fonts


    # ## The drawing context


    In order to be able to draw graphics we need to define a space into which our

    content can be rendered. Like an artist, we need a canvas onto which we can draw.

    The visible region of the browser window, or **viewport**, defines a region in
    which

    we can draw our **canvas**.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The SVG specification refers to the drawing area itself as the viewport. Strictly
    speaking, a viewport is any rectangular viewing region. We will always refer to
    the browser window as the _viewport_ and our drawing region as the _canvas_ (not
    to be confused with the HTML5 Canvas).


    We can create a canvas using the `Raphael` constructor as follows:


    ```

    var paper = Raphael(50, 100, 500, 300);

    ```


    # Downloading the example code


    You can download the example code files for all Packt books you have purchased
    from your account at http://www.packtpub.com. If you purchased this book elsewhere,
    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you. The demos for each of the code samples in this book can be found
    at http://raphaeljsvectorgraphics.com. Readers are strongly encouraged to open
    the demos alongside reading the book in order to best relate to the content covered.


    This creates a canvas of width 500px and height 300px at 50px to the left of the
    viewport and 100px from the top of the viewport as shown in the following diagram.
    The `paper` variable holds a reference to a `Paper` object which is our canvas
    and we will use it for all future drawing:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_24_0.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'More commonly we will want to use an existing DOM element as a container for
    our canvas rather than the viewport. In this case, the left-/right- (x-/ y-) offsets
    are not required as the canvas will always be rendered at the top-left corner
    of the element. Consider the element:


    ```

    <div id="my-canvas"></div>

    ```


    We would create our 500px wide, 300px high canvas using the following code:


    ```

    var paper = Raphael(''my-canvas'', 500, 300);

    ```


    When using this form of the constructor, we always pass an element ID when passing
    a string as the first parameter. Alternatively, we can pass a DOM element as the
    first parameter like so:


    ```

    Raphael(document.getElementById(''my-canvas''), 500, 300);

    ```


    # # Canvas coordinates


    The following diagram illustrates the default coordinate system of the canvas
    created using the `Raphael` constructor. The **origin** of the canvas is defined
    as the point at which _x_ and _y_ are both equal to zero. A point on the canvas
    at _x_ = 300 and _y_ = 200, or (300, 200) in vector notation, is the point 300px
    to the right of the origin _x_-point and 200px down from the origin _y_-point
    as shown:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_25_0.png)


    Likewise, a point at (-125, 50) is that relative to the origin in _x_ and _y_
    as shown in this diagram:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_25_1.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Drawing basic shapes


    Raphaël provides the `rect`, `circle`, and `ellipse` methods for drawing basic
    shapes. These are methods of the `Paper` object that is returned when we create
    our canvas. The `rect` method for example has the following syntax (taken from
    the Raphaël documentation at http://raphaeljs.com/reference.html#Paper.rect):


    ```

    Paper.rect(x, y, width, height, [r]);

    ```


    The `x` and `y` coordinates describe the top-left point of the rectangle and the
    fifth parameter, `r`, is the radius of rounded corners where the square brackets
    indicate that it is optional (by default the corners have a radius of 0). A rectangle
    of width 50px and height 100px at x = 200px, y = 150px is created as follows:


    ```

    var paper = Raphael(''my-canvas'', 500, 300);

    var rectangle = paper.rect(200, 150, 50, 100);

    ```


    Similarly, we create a square of width 75px with a corner radius of 15px by:


    ```

    var square = paper.rect(300, 150, 75, 75, 15);

    ```


    ![](img/d8ec653db4cab13fec8b3f5718174af6_26_0.png)


    Note that graphics drawn at negative `x` or `y` points will be drawn starting
    from outside of the visible region of the canvas meaning that they will be partially
    or fully hidden from the viewer as illustrated in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Both rectangles are shown in the following diagram. Note that drawing is from
    the top-left corner of the rectangle in the positive _x_ and _y_ directions:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_27_0.png)


    The syntax for a circle

    (http://raphaeljs.com/reference.html#Paper.circle) is:

    Paper.circle(x, y, r);


    While the _x_ and _y_ coordinates of a rectangle describe its top-left point,
    for a circle they define its **center** point. The third parameter, _r_, is the
    radius of the circle. A circle at _x = 100_, _y = 100_ with a radius of 50px is
    drawn by:

    var paper = Raphael(''my-canvas'', 500, 300);

    var circle = paper.circle(100, 100, 50);


    The syntax for an ellipse (http://raphaeljs.com/reference.html#Paper.ellipse)
    is very similar to a circle except that we specify the individual x- and y-radii:

    Paper.ellipse(x, y, x-radius, y-radius);


    An ellipse whose x-radius is twice its y-radius is given by:

    var ellipse = paper.ellipse(300, 100, 100, 50)'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'It should be clear that the circle is in fact just a special case of the ellipse
    where x-radius is equal to y-radius. The resultant circles and ellipses are shown
    in the following diagram:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_28_0.png)


    Raphaël is well documented at http://raphaeljs.com/reference.html. For complete
    coverage of the methods used throughout this book, you are strongly advised to
    make extensive reference to this documentation.


    # # Embedding images


    Raphaël allows us to embed bitmap (.jpg or .png) images into our canvas. It does
    so using the image method of the the Paper object. The following code demonstrates
    embedding a .jpg image:


    ```

    ```

    var paper = Raphael(''my-canvas'', 600, 252);

    paper.image(''stella.jpg'', 15, 15, 144, 192);

    ```

    ```


    The .jpg image is included at (15, 15) and its width and height are scaled to
    144px and 192px respectively.


    # # Element attributes


    The shapes that we have drawn can have fills, strokes, and a number of other attributes
    applied to them. When we create a shape, an Element object is returned. This object
    has an attr method that accepts a number of key-value pair attributes. In this
    section we will look at the various attributes that can be applied to our drawings
    using this method (see http://raphaeljs.com/reference.html#Element.attr).'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # Basic fills


    In order give an element a background, we fill it using the `fill` attribute.

    For single-color fills, the format is that specified by the CSS specification
    (that is,

    `#rrggbb` or the `#rgb` shorthand, the `rgb(r, g, b)` string or a color keyword,

    for example, `navy`). To fill rectangles black, for example, we can write:


    ```

    ```

    var rect = paper.rect(200, 50, 200, 100);

    rect.attr({fill: ''#000''});

    var square = paper.rect(450, 50, 50, 50);

    square.attr({fill: ''rgb(0, 0, 0)''});

    ```

    ```


    Similarly, to fill a circle pink we could write:


    ```

    ```

    var circle = paper.circle(100, 100, 50);

    circle.attr({fill: ''pink''});

    ```

    ```


    The following is what you will find as a result:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_29_0.png)


    # # Image fills


    Raphaël also allows you to fill an element with an image. Consider the

    following code:


    ```

    ```

    var circle = paper.circle(100, 100, 80);

    circle.attr({fill: ''url(bg_pattern.png)''});

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 30
  md: "This creates a circle whose fill is a pattern image named `bg_pattern.png`\
    \ as shown in the following screenshot. Image fills are always repeated in `x`\
    \ and `y`:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_30_0.png)\n\n# ## Applying\
    \ strokes\n\nElements can have a number of different stroke attributes. The most\
    \ common are the `stroke` and `stroke-width` attributes. The `stroke` attribute\
    \ takes a string value for color in line with the CSS specification while `stroke-width`\
    \ is a number in pixels. The following code has the effect of applying a 10px-wide\
    \ lime-green stroke to a circle:\n\n```\n```\nvar circle = paper.circle(100, 100,\
    \ 70);\ncircle.attr({\n    fill: '#09c',\n    stroke: 'limegreen',\n    'stroke-width':\
    \ 10\n});\n```\n```\n\nThe resulting circle is shown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_30_1.png)\n\
    \nStrokes are drawn centrally meaning that half of the visible stroke width is\
    \ inside the element and half is outside of it."
  merge: -1
  img_proc: true
- pgno: 31
  md: "You will notice in some of the earlier examples in this chapter that even though\
    \ we did not apply attributes to them they were still stroked. This is because\
    \ the default stroke-width value is 1px. To remove the stroke when drawing shapes,\
    \ we must always specify a stroke-width value of 'none'.\n\nSome other useful\
    \ stroke attributes are stroke-dasharray and stroke-linejoin as demonstrated.\
    \ The former allows us to specify a pattern of dashes, dots, and spaces by which\
    \ the resultant stroke will be drawn using them while the latter dictates how\
    \ path lines should be joined together:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_31_0.png)\n\
    \nYou can find out more about the different stroke attributes at http://raphaeljs.com/reference.html#Element.attr\
    \ and http://www.w3.org/TR/SVG/painting.html#StrokeProperties.\n\n# ## Other attributes\n\
    \nBesides strokes and fills, there are a number of other attributes that you may\
    \ want to use when creating elements. We will demonstrate some of them in this\
    \ section.\n\n# ## href\n\nThe elements that we create are registered in the DOM\
    \ and specifying a href attribute allows them to behave as hyperlinks. For example:\n\
    \n```\n```\nvar rect = paper.rect(30, 30, 140, 140);\nrect.attr({\n    href: 'http://www.packtpub.com'\n\
    });\n```\n```\n\nThis will create a rectangle that links to the Packt Publishing\
    \ website when clicked on."
  merge: -1
  img_proc: true
- pgno: 32
  md: "# # opacity\n\nThe opacity of elements can be set to a value between 0 (complete\
    \ transparency) and 1 (complete opacity). We can also set the opacity on the fill\
    \ and stroke separately by using the `stroke-opacity` and `fill-opacity` attributes:\n\
    \n![](img/d8ec653db4cab13fec8b3f5718174af6_32_0.png)\n\nAn unfortunate side effect\
    \ of strokes always being drawn centrally is that half of the stroke overlaps\
    \ the fill meaning that `stroke-opacity` has limited applicability.\n\n> > Specifying\
    \ 'stroke-opacity': 0.5 in combination with a stroke color that matches the fill\
    \ color gives a very smooth edge to your shape, effectively anti-aliasing it.\n\
    \n# # clip-rect\n\nRaphaël supports rectangular clipping of elements using the\
    \ `clip-rect` attribute. Clipping allows us to show only part of an element. We\
    \ define a rectangular clipping region as follows:\n\n```\n```javascript\nvar\
    \ circle = paper.circle(100, 100, 80, 80);\ncircle.attr({\n    fill: 'pink',\n\
    \    'stroke-width': 0,\n    'clip-rect': '20 20 80 80'\n});\n```\n```\n\nThis\
    \ creates a circle of radius 80px centered on the point (100, 100). The `clip-rect`\
    \ attribute defines a rectangular region from a space-separated string of the\
    \ form:\n\n```\n```\n\"x y width height\"\n```\n```"
  merge: -1
  img_proc: true
- pgno: 33
  md: "This has the effect of only showing the part of the circle that is overlapped\
    \ by the\nrectangular clipping region '20 20 80 80':\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_33_0.png)\n\
    \n# # Applying gradients\n\nRaphaël supports applying linear and gradient fills\
    \ to elements. To achieve this,\nrather than specifying a color string on the\
    \ fill attribute, we specify a string of\nthe following form in order to create\
    \ linear gradients:\n\n```\n`<angle>-<color>[-<color>[:<offset>]]*-<color>`\n\
    ```\n\nThe following syntax is in order to create radial gradients:\n\n```\n`r[(<fx>,\
    \ <fy>)]<color>[-<color>[:<offset>]]*-<color>`\n```\n\nThis syntax is best illustrated\
    \ by an example.\n\n# # Linear gradients\n\nThe most basic form of a linear gradient\
    \ fill is of the form:\n\n```\n`<angle>-<color1>-<color2>`\n```\n\nThis specifies\
    \ a gradient drawn at an angle angle degrees from color1 to color2.\nFor example:\n\
    \n```\n```javascript\nvar rect = paper.rect(20, 20, 160, 160);\nrect.attr({\n\t\
    'stroke-width': 0,\n\tfill: '0-#f00-#000'\n});\n```\n```"
  merge: -1
  img_proc: true
- pgno: 34
  md: 'This draws a rectangle with a linear gradient from red to black at an angle
    of 0

    degrees as shown on the left in the following figure. The rectangle on the right

    is created with a fill value of ''90-#f00-#000'', where this time the gradient
    is

    drawn at an angle of 90 degrees:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_34_0.png)


    Note that the angle of drawing is that defined from the positive x axis going

    counterclockwise as shown in the following figure for a 45 degrees gradient

    running blue to white:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_34_1.png)


    Linear gradients can be composed of any number of colors and the points at which

    the colors make up the gradient defined as **offsets**. This is what is meant
    by the

    following syntax:


    [-<color>[:<offset>]]*


    Here any number of -color:offset combinations can be created. For example,

    consider a gradient created with the following string:


    fill: "0-#00a9e0-#323490:20-#ea1688:40-#eb2e2e:60-#fde92d:80-#009e54"'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'This has the effect of creating a rainbow-style pattern as shown in the following
    figure. Each color is offset by an additional 20 percent from the previous color.
    The first and last colors have implied offsets of 0 percent and 100 percent respectively:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_35_0.png)


    Technically, since the difference between each offset is equal for all colors
    (20 percent), we could have omitted the offset values from the string in the previous
    example. The gradient described by the following expression yields the same result:


    ```

    "0-#00a9e0-#323490-#ea1688-#eb2e2e-#fde92d-#009e54"

    ```


    # # Radial gradients


    Radial gradients are similar to linear gradients except that they are drawn _radially
    outwards_ from a fixed point on an element (the center point of an element by
    default). The most basic form a radial gradient is given by the syntax `r<color>-<color>`.
    For example:


    ```

    var circle = paper.circle(100, 100, 80); circle.attr({

    ''stroke-width'': 0,

    fill: ''r#fff-#000''

    });

    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'This describes a circle with a gradient from white at the center to black at
    its edges:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_36_0.png)


    As with linear gradients, we can define multiple colors with an optional offset

    for each. The string ‘r:#fff-#f00-#00f:90-#000’, for example, creates a radial

    gradient from white to red to blue at an offset of 90 percent to black at the
    edges.


    The point from which a radial gradient is drawn, known as the **focal point**,
    can be

    specified using the `(<fx>, <fy>)` syntax where `fx` and `fy` have values between

    0 and 1. The center point of an element has the focal point definition (0.5, 0.5).

    Reducing or increasing the `fx` value has the effect of shifting the focal point
    to the

    left and right in `x`, while increasing and decreasing the value of `fy` has the
    effect

    of moving the focal point up and down in `y`. The following diagram shows how

    changing the value of `fx` and `fy` affects the position of the focal point:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_36_1.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: "> Note that radial gradients cannot be applied to a `Path` element\n> (see\
    \ Chapter 3, Drawing Paths) owing to a bug in VML and so only\n> really applies\
    \ to the basic shapes we cover in this chapter.\n\n# # Grouping elements\n\nThere\
    \ are times when we wish to apply the same attributes, transformations, or\nanimations\
    \ to _multiple_ elements. We can group elements in Raphaël by using the\nset method.\
    \ Consider the following shapes:\n\n```\n```\nvar paper = Raphael('my-canvas',\
    \ 540, 200);\nvar circle = paper.circle(100, 100, 80);\nvar rect = paper.rect(205,\
    \ 40, 120, 120);\nvar ellipse = paper.ellipse(430, 100, 80, 60);\n```\n```\n\n\
    By creating a **set** that contains references to all of these shapes, we can\
    \ apply the\nsame attributes to all of them by invoking the `attr` method _on\
    \ the set_ rather than each\nindividual element. We create a set containing all\
    \ elements and hold a reference to it\nin a variable named `group` as follows:\n\
    \n```\n```\nvar group = paper.set();\ngroup.push(circle, rect, ellipse);\n```\n\
    ```\n\nWe then apply the following attributes to the set we have just created:\n\
    \n```\n```\ngroup.attr({\n    fill: '180-#09c-#fff:30-#f00',\n    stroke: '#000',\n\
    \    'stroke-width': 5\n});\n```\n```"
  merge: -1
  img_proc: true
- pgno: 38
  md: "The result is shown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_38_0.png)\n\
    \n# # Working with text\n\nDrawing text in the canvas rather than as HTML markup\
    \ with CSS styling allows us\nto animate and transform it in the same way as we\
    \ would for other shapes. Text is\ncreated using the `text` method and its properties\
    \ (such as `size` and `font-family`)\nare modifiable as attributes. The `text`\
    \ method has the following definition, where the\n`text` parameter is our text\
    \ string and accepts the standard escape sequence `\\n` as\ninput, which places\
    \ the proceeding text onto a new line:\n\nPaper.text(x, y, text)\n\nThe following\
    \ code creates two pieces of text using this method and then groups\nthem into\
    \ a set in order to apply `font-size` and `font-family` attributes to\nboth elements:\n\
    \n```\n```\nvar text1 = paper.text(0, 15, 'I am text anchored start.');\ntext1.attr({\n\
    \    'text-anchor': 'start',\n});\nvar text2 = paper.text(270, 100, 'I am text\\\
    nanchored middle');\ntext2.attr({\n    'text-anchor': 'middle'\n});\nvar group\
    \ = paper.set(text1, text2);\ngroup.attr({\n    'font-size': 20,\n    'font-family':\
    \ 'serif'\n});\n```\n```\n\n[ 28 ]"
  merge: -1
  img_proc: true
- pgno: 39
  md: '# # Embedding custom fonts


    The font converter and renderer Cufón has been superseded by @font-face for

    general web font rendering. However, fonts generated by Cufón have fully defined

    paths and integrate seamlessly with Raphaël meaning that we can manipulate such

    fonts in many of the same ways that we would for shapes. A demo of this can be
    seen

    at http://raphaeljsvectorgraphics.com/the-graphical-web/custom-fonts.


    Cufón supports generating custom fonts from **TrueType (TTF), OpenType (OTF),

    Printer Font Binary (PFB) and PostScript** font files. To generate a custom font

    using Cufón, go to http://cufon.shoqolate.com/generate/ and fill in the font

    generator form. Ensure that you enter Raphael.registerFont in the textbox

    (or click on the small Raphaël logo next to it) under the heading **Customization

    (for 3rd-party scripts only)** as shown in the following screenshot:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_39_0.png)


    Your generated font will be a JavaScript file. You should include this in your
    HTML

    document just after the Raphaël library, that is, as follows:


    `<script type="text/javascript" src="raphael.min.js"></script>

    <script type="text/javascript" src="MyFont.font.js"></script>`


    In order to use the font in your canvas, you will use the print method

    (http://raphaeljs.com/reference.html#Paper.print). Consider,

    for example, embedding a font named Pacifico.font.js:


    `<script type="text/javascript" src="Pacifico.font.js"></script>`'
  merge: -1
  img_proc: true
- pgno: 40
  md: "We print text using our custom font onto our canvas as follows:\n```javascript\n\
    var text = paper.print(\n    50,\n    50,\n    'Vi veri veniversum vivus vici',\n\
    \    paper.getFont('Pacifico'),\n    38\n);\n```\n\nThis draws custom text with\
    \ a font size of 38px onto our canvas at the point (50, 50).\nThe `getFont` method\
    \ simply references the name of the family of the font that you\nhave embedded,\
    \ whereas Cufón should have taken care of registering the font\nwith Raphaël.\n\
    \nAttributes can be applied to custom font text in the same way that we have already\n\
    applied them to shapes and text. For example:\n```javascript\ntext.attr({\n  \
    \  fill: '315-#000-#666',\n    'stroke-width': 0\n});\n```\n\nThis produces the\
    \ text shown as follows:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_40_0.png)\n\
    \n# # Summary\n\nIn this chapter we have covered many examples of basic drawing\
    \ and painting\nin Raphaël in the context of a particular drawing area or canvas.\
    \ You should now\nbe comfortable drawing basic vector graphics using the library\
    \ and exploring the\ndocumentation at http://raphaeljs.com.\n\nIn the next chapter,\
    \ we will look at drawing more complex elements using paths.\n\n[ 30 ]"
