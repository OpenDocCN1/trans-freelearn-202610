  md: "# # Vector Animation\n\nWe define a custom attribute, popDensity, for a visual\
    \ representation of this data as per the aforementioned rules:\n\n```\n```\npaper.customAttributes.popDensity\
    \ = function(population, density) {\n    var radius = 25 + (25 * population),\n\
    \        fillColor = 'hsb(0,0,' + (1 - density) + ')'; \n    return {\n      \
    \  fill: fillColor,\n        r: radius\n    };\n};\n```\n```\n\nThis method defines\
    \ a radius that is 25px plus 25 multiplied by the relative population of the country\
    \ meaning that the most populous country has a radius of 50px, the least populous\
    \ has a radius of 25px and all other countries have a radius somewhere in between\
    \ these two values. The fill color is determined as a proportion of the brightness\
    \ where hue and saturation are fixed. The formula, (1 – density), will return\
    \ a value of 1 (a saturation giving a white color) for the least densely populated\
    \ countries and a value of 0 (a saturation giving a black color) for the most\
    \ densely populated countries. All values of saturation in between 0 and 1 give\
    \ rise to shades of gray.\n\nGiven that we define our dataset as an array of objects\
    \ like so:\n\n```\n```\nvar data = [\n    {\n        name: 'Taiwan',\n       \
    \ population: 0.1,\n        density: 1\n    },\n    {\n        name: 'South Korea',\n\
    \        population: 0.32,\n        density: 0.5\n    },\n    // ...\n];\n```\n\
    ```\n\nWe can iterate over each country and draw a circle with a popDensity attribute\
    \ as follows:\n\n```\n```\nvar currentX = 70;\nfor(var i = 0, ii = data.length;\
    \ i < ii; i+=1) {\n    var country = data[i];\n    paper.circle(currentX, 150,\
    \ 50).attr({\n```\n```"
