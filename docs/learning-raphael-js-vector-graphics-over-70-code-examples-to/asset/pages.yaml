- pgno: 102
  md: '# # Choropleth maps


    **Choropleth maps** are maps that show some particular area or region with an
    associated measurement or statistic. They are commonly used in cartography to
    depict population densities and similar metrics and are used regularly to visualize
    data with geographical significance. The following image, compiled using the https://commons.wikimedia.org/wiki/File:World_population_density_map.
    PNG and https://en.wikipedia.org/wiki/File:ElectoralCollege2012.svg Wikimedia
    Commons images, demonstrates applications in cartography (left) and in data visualization
    (right):


    ![](img/d8ec653db4cab13fec8b3f5718174af6_102_0.png)


    # # Creating choropleth maps


    Often when you need to associate data with some geographical region or area, the
    best approach is to utilize an existing map in SVG format that you can then tailor
    to your needs (manually by modifying the raw XML or using a graphics editor such
    as Inkscape). For the purposes of demonstration, we will work with an existing
    map of the United Kingdom taken from http://en.wikipedia.org/wiki/File:England_
    Regions_within_UK.svg.


    If you download this map and open it up in your XML editor you will see that the
    districts of England are defined as individual <path> elements with IDs on them
    (for example, <path id="London"> represents the London region while <path id="north-west">
    depicts the entire North West England). Ready Set Raphael handles this really
    well in that it defines variables for each of the paths with IDs:


    ```

    ```

    var london = rsr.path(...);

    var northwest = rsr.path(...);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 103
  md: "You can convert the aforementioned image using the Ready Set Raphael converter\
    \ and import the resultant JavaScript into your HTML document. When running this\
    \ code, you will see that the converter does a really good job of maintaining\
    \ the paths and associated attributes.\n\nThere are a total of nine official regions\
    \ (administrative divisions) of England that are all drawn on the resultant map.\
    \ These regions have the following populations where the resultant variable names\
    \ created by Ready Set Raphael are shown in the table:\n\n| Region | Variable\
    \ name | Population |\n|---|---|---|\n| North West England | northwest | 7,052,000\
    \ |\n| North East England | northeast | 2,597,000 |\n| Yorkshire and the Humber\
    \ | yorkshireandhumber | 5,284,000 |\n| West Midlands | westmidlands | 5,602,000\
    \ |\n| East Midlands | eastmidlands | 4,533,000 |\n| East of England | eastengland\
    \ | 5,847,000 |\n| London | london | 8,174,000 |\n| South East England | southeast\
    \ | 8,635,000 |\n| South West England | southwest | 5,289,000 |\n\nThe sum of\
    \ all populations is 53,013,000.\n\nAt the end of the code created by Ready Set\
    \ Raphael, we define an array of objects that relate a `path` property to the\
    \ path variable listed in the table with the associated populations. This rationalization\
    \ is useful as it allows us to associate a region's population with the defined\
    \ path:\n\n```\n```\nvar data = [\n {\n   path: northwest,\n   population: 7052000\n\
    \ },\n {\n   path: northeast,\n   population: 2597000\n },\n // ... and so on\
    \ ...\n];\n```\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "# # Working with Existing SVGs\n\nNow, in order to visualize the varying populations,\
    \ we define a custom attribute\nnamed shading that returns a fill based on 0 hue\
    \ and 0 saturation where only\nbrightness varies. This will have the effect of\
    \ shading the countries according\nto their population sizes:\n\n```\nrsr.customAttributes.shading\
    \ = function(population, min, max, total) {\n    var brightness = 1 - ((population\
    \ - min) / (max - min));\n    return {\n        fill: 'hsb(0, 0, ' + brightness\
    \ + ')'\n    };\n};\n```\n\nThe brightness is defined as follows:\n\nbrightness\
    \ = 1 - \\(\\frac{population - smallest population}{largest population - smallest\
    \ population}\\)\n\nThis equation normalizes the brightness based on the largest\
    \ and smallest population\nsizes. When the population size is equal to the largest\
    \ population, the brightness\nwill be zero (black) and when the population size\
    \ is equal to that of the smallest\npopulation, the brightness will be equal to\
    \ 1 (white). All other values of the\npopulation return a value between 0 and\
    \ 1 (a gray shade).\n\nWe utilize this attribute by iterating through our data\
    \ array that defines the drawn\npaths and associated populations:\n\n```\nvar\
    \ totalPopulations = 530130000;\nvar minPopulation = 25970000;\nvar maxPopulation\
    \ = 86350000;\nfor(var i = 0, ii = data.length; i < ii; i+=1) {\n    var path\
    \ = data[i].path;\n    var population = data[i].population;\n    path.attr({\n\
    \        shading: [population, minPopulation, maxPopulation,\n        totalPopulations]\n\
    \    });\n}\n```\n\nEach region's population, as well as the total, maximum, and\
    \ minimum populations,\nare passed to our custom attribute which in turn fills\
    \ the region accordingly.\nThe result of this operation is shown in the following\
    \ image:\n\n[ 94 ]\n\nwww.it-ebooks.info"
  merge: -1
  img_proc: true
- pgno: 105
  md: "![](img/d8ec653db4cab13fec8b3f5718174af6_105_0.png)\n\nYou can see that the\
    \ north-east region—which has the lowest population—is colored white while the\
    \ south-east region—which has the largest population—is colored black.\n\nOne\
    \ unfortunate effect of London having a population size that is nearly as large\
    \ as that of the south-east region of the country is that it is impossible to\
    \ distinguish between the London region and the south-east. This can be addressed\
    \ in this instance by applying a lighter-colored stroke to each region when looping\
    \ through our data array:\n\n```\n```\npath.attr({\n    shading: [population,\
    \ minPopulation, maxPopulation,\n    totalPopulations],\n    'stroke': '#bbb'\n\
    });\n```\n```\n\nThe result is as shown:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_105_1.png)"
  merge: -1
  img_proc: true
- pgno: 106
  md: '# # Open source SVGs


    There are a number of SVGs available via the Open Clip Art Library at

    http://openclipart.org. The site features an excellent SVG editor that allows

    you to edit hosted SVGs on the fly and view their underlying source code or

    download them.


    # # Summary


    You should now be comfortable working with the existing SVGs in the context of

    your Raphaël-driven projects. You should have a basic understanding of Inkscape

    and be able to utilize it to create basic SVGs and inspect the XML makeup of

    graphics. Online SVG to Raphaël converters are invaluable as our coverage of

    chloropleth maps demonstrates, and you should now be able to work with more

    complex graphics whose characteristics give us additional scope in what we''re

    able to offer to the end user.'
  merge: -1
