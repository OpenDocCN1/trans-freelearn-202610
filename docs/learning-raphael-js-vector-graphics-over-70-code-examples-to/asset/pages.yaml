    \ on our circle as part of our run loop like so:\n\n```\n```\nfunction runloop()\
    \ {\n circle.animate({pathFactor: 1}, 4000, function() {\n this.attr({pathFactor:\
    \ 0}); // Reset\n setTimeout(runloop);\n });\n circle.unclick().click(function()\
    \ {\n this.pause();\n });\n circle.undblclick().dblclick(function() {\n this.resume();\n\
    \ });\n });\n};\nrunloop();\n```\n```\n\nWe unregister and then re-register the\
    \ click and double-click event handlers on\neach animation run since a new animation\
    \ is started each time. When running this\ncode, you will see that the pause and\
    \ resume methods have the effect of pausing\nthe current animation that is running\
    \ on the circle when clicked and double-clicked\nrespectively. The result of pausing\
