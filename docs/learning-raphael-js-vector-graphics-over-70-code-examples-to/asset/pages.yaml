    ![](img/d8ec653db4cab13fec8b3f5718174af6_94_0.png)


    For our web-based projects, the document size is usually going to be that defined
    by the constituent objects. Click on **File | Document Properties | Page** and
    then expand the **Resize** page to a content drop-down menu. Here you can define
    custom widths and heights for the document. Clicking on **Resize page to drawing
    or selection** will resize the page and the dimensions of the selected element
    (or all drawn elements if none is selected).


    What this actually does is it applies a translation to all elements on the current
    layers, that is, the paths are drawn and then a transformation is applied. If
    we want all paths to be drawn relative to the "new" origin point (which is usually
    the case) the following steps should be performed:


    +   1. Resize the document to the desired size.

    +   2. Go to **Layer | Layers...**


