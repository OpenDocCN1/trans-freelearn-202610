    # # Custom easing using the cubic Bézier format


    The format for CSS3 transitions describing animation easing can be used to define
    custom easing paths in Raphaël. The syntax is `cubic-bezier(point1_x, point1_y,
    point2_x, point2_y)`, where each parameter defines the _x_ and _y_ positions of
    anchor points describing a cubic Bézier curve from (0, 0) to (1,1) in attribute
    value and time. Consider the easing path that describes an attribute value that
    increases very sharply and then almost comes to a stop before finally easing in
    to its end point:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_81_1.png)'
  merge: -1
