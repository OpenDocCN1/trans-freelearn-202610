  md: "The following diagram describes a minor arc (large-arc-flag = 0) drawn in a\
    \ counterclockwise direction:\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_56_0.png)\n\
    \n# # Utility methods for working with paths\n\nRaphaël provides a number of convenient\
    \ utility methods for working with paths. We will demonstrate these methods by\
    \ example.\n\n# # Element.getTotalLength()\n\nBy combining a major arc and a cubic\
    \ Bézier curve, we can draw a bowling pin shape as follows:\n\n```\n```\nvar pin\
    \ = paper.path({\n 'M', 130, 350,\n 'A', 100, 180, 0, 1, 0, 210, 350,\n 'C', 290,\
    \ 100, 50, 100, 130, 350,\n 'z'\n});\n```\n```\n\nThis path starts at (130, 350),\
    \ arcs to (210, 350), and then curves back to the start point with Bézier control\
    \ points (290,100) and (50, 100). We get the total length of the path using the\
    \ getTotalLength method. We retrieve this value and then display it to two decimal\
    \ places on our canvas as follows:\n\n```\n```\nvar totalLength = pin.getTotalLength();\n\
    paper.text(\n 180, 50,\n \"Total Length: \" + totalLength.toPrecision(2)\n);\n\
    ```\n```"
