- pgno: 114
  md: "# # Getting started\n\nOur HTML markup defines a canvas into which we will\
    \ draw four animated arc paths on page load. We will write our JavaScript in tweets-by-time.js:\n\
    \n```\n```html\n<h1>Tweets with respect to time</h1>\n<p>There are approximately\
    \ 3,000 tweets every ...</p>\n<div id=\"tweets-timed\"></div>\n<script type=\"\
    text/javascript\"\n src=\"raphael-2.1.0-min.js\"></script>\n<script type=\"text/javascript\"\
    \n src=\"jquery-1.9.1.min.js\"></script>\n<script type=\"text/javascript\"\n src=\"\
    tweets-by-time.js\"></script>\n```\n```\n\nWe define a drawing canvas whose width\
