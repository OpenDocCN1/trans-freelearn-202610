- pgno: 87
  md: "```\npaper.customAttributes.pathFactor = function(distance) {\n    var point\
    \ = path.getPointAtLength(distance * pathLength);\n    var dx = point.x,\n   \
    \     dy = point.y;\n    return {\n        transform: ['T', dx, dy]\n    };\n\
    };\n```\n\nWe always return an absolute transformation that uses the (_x_, _y_)\
    \ point on the path to\ndetermine where on the path our circle lies.\n\nIn order\
    \ to animate our circle, we first initialize its `pathFactor` attribute to zero.\
    \ This\nhas the effect of placing it at the zero-length point of our path, which\
    \ is the point at\nwhich we started drawing it, which is, (100, 100):\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_87_0.png)\n\
    \nTo animate our circle along the path, we define and execute a `runloop` function\
    \ that\ninitializes an animation of our `pathFactor` attribute to a value of 1.\
    \ Our end of the\nanimation callback resets `pathFactor` to zero and then invokes\
    \ `runloop` recursively.\nYou will notice that our recursive function call is\
    \ done as a callback to `setTimeout`;\nthis is to ensure that the minimum time\
    \ required for the browser to progress to the\nnext iteration in the cycle elapses\
    \ before the animation is repeated:\n\n```\nfunction runloop() {\n    circle.animate({pathFactor:\
    \ 1}, 4000, function() {\n        this.attr({pathFactor: 0}); // Reset\n     \
    \   setTimeout(runloop);\n    });\n});\n};\nrunloop();\n```"
