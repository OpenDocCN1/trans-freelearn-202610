- pgno: 11
  md: '# # Preface


    Learning Raphaël JS Vector Graphics takes you on a tour of the Raphaël JavaScript
    library and its potential applicability in today’s online landscape. While it
    is a "mini", it is by no means limited. Coverage is given to all of the library’s
    main facets and applications thereof and on completion of this book you will be
    able to create vector drawings and interactive applications in the browser.


    # # What this book covers


    Chapter 1, The Graphical Web, gives an introduction to Raphaël: what it is, its
    applications, and its relevance in the context of the Web.


    Chapter 2, Basic Drawing with Raphaël, looks at how we can draw and embellish
    the fundamental graphics elements.


    Chapter 3, Drawing Paths, covers drawing and manipulating more complex shapes
    using paths.


    Chapter 4, Transformations and Event Handling, covers transforming graphics elements,
    basic event handling, the Events library, and the drag-and-drop functionality.


    Chapter 5, Vector Animation, looks at bringing our elements to life by way of
    animation. We look at different ways in which we can animate graphics and lead
    by example.


    Chapter 6, Working with Existing SVGs, explains how we can use Raphaël to work
    with the existing SVGs with an overview of Inkscape and a discussion on choropleth
    maps.


    Chapter 7, Creating a Suite of Social Media Visualizations, looks at building
    four social media data visualization demos based on everything we have covered
    in the previous chapters.'
  merge: -1
  img_proc: true
- pgno: 12
  md: "# # Who this book is for\n\nThis book is for any and all developers with an\
