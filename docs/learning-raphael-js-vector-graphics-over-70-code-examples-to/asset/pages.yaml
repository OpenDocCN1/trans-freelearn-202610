    \ lines or items are set in bold:\n\n```\n```\npaths[i].animate({\n    subtend:\
    \ [360, cx, cy, r]\n}, interval, function() {\n    paths[i].remove();\n    setTimeout(function()\
    \ {\n        update(i);\n    });\n});\n```\n```\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_12_0.png)\n\
