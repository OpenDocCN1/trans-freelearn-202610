- pgno: 107
  md: '# # Creating a Suite of Social Media Visualizations


    We have now covered all of the main facets of the Raphaël JavaScript library and

    over the course of this chapter we will look at creating data visualization demos

    based on social media statistics.


    Data visualization has really boomed in recent years. The number of infographics

    and data-related expositions online continue to grow as we try to make sense of
    and

    convey the wealth of data available to us. That said, many of the fine examples
    in

    existence are _static_ and there is plenty of scope for utilizing vector drawing
    libraries

    to create dynamic and interactive data visualizations, making this a very real
    and

    valid application of the Raphaël library.


    Over the course of this chapter we will look at:


    +   - Creating a social network usage statistics data visualization

    +   - Creating an animated donut chart showing number of tweets with

    +     regard to time

    +   - Discussing the future of the Raphaël library


    # ## Social network usage


    The idea that people could communicate and interact over a computer network

    goes back to, well, before the days of the World Wide Web (the first network e-mail

    was sent in 1971), but it is really in the past ten or so that we''ve started
    to see a

    widespread and indeed colossal usage of social networks. Facebook is currently
    the

    world''s largest social network and boasts of one billion registered users while
    the

    likes of Twitter and Google+ have close to half a billion users each.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# # Creating a Suite of Social Media Visualizations


    In this section we will create an interactive visualization similar to a histogram
    / area chart that demonstrates just how significant these figures are by comparing
    the number of social network users to the total world population (six billion).
    It will use a common technique of highlighting icons to indicate the proportion
    of users relative to all world citizens when the relevant social network is selected.
    The end result is shown as follows:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_108_0.png)


    # # Getting started


    To get started, we first create a basic HTML file with markup containing social
    media icon images and include all relevant JavaScript files just before the closing
    `body` tag. We will write our JavaScript in the `social-network-usage.js` file:


    ```

    ```html

    <body>

    <h1>Social Network Usage</h1>

    <p>The ratio of users to the total world population,

    based on a world population of 6,000,000,000.</h1>

    <div id="world-population-usage"></div>

    <div class="networks">

    <img class="facebook" src="icons/facebook_32.png" />

    <img class="twitter" src="icons/twitter_32.png" />

    <img class="flickr" src="icons/flickr_32.png" />

    <img class="linkedin" src="icons/linkedin_32.png" />

    <img class="myspace" src="icons/myspace_32.png" />

    <img class="googleplus" src="icons/google_plus_32.png" />

    <img class="orkut" src="icons/orkut_32.png" />

    <img class="lastfm" src="icons/lastfm_32.png" />

    </div>

    <script type="text/javascript"

    src="raphael-2.1.0.min.js"></script>

    <script type="text/javascript"

    src="jquery-1.9.1.min.js"></script>

    <script type="text/javascript"

    src="social-network-usage.js"></script>

    </body>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'When a social media icon is clicked on, the number of highlighted persons will
    be

    updated to reflect the total number of users of that network. The icons are provided

    courtesy of komodomedia.com and are distributed along with the source code

    accompanying this book.


    # # Using jQuery


    You will notice in the markup of the previous section that we have included the

    jQuery JavaScript library. This will be used to facilitate DOM interaction throughout

    this chapter.


    You can download jQuery from http://jquery.com/. The latest version at the time

    of writing was 1.9.1 and it is the version we will use throughout this chapter.


    For those of you that are not familiar with jQuery, there are many resources available

    online. Your first port of call should be http://docs.jquery.com/.


    # # Social network usage data


    The data used for this visualization is taken from http://en.wikipedia.org/wiki/

    List_of_social_networking_websites where usage is measured based on the

    number of registered users and this figure is rounded to the nearest 50 million
    users:


    | Social network | Number of registered users (rounded to nearest 50,000,000)
    |

    |---|---|

    | Facebook | 1,000,000,000 |

    | Twitter | 500,000,000 |

    | Flickr | 50,000,000 |

    | LinkedIn | 150,000,000 |

    | Myspace | 50,000,000 |

    | Google+ | 400,000,000 |

    | Orkut | 100,000,000 |

    | last.fm | 50,000,000 |'
  merge: -1
  img_proc: true
- pgno: 110
  md: "We define this data as an object where the keys correspond to the class names\
    \ defined in the preceding markup and the values are the number of registered\
    \ users:\n\n```\nvar usage = {\n    facebook: 1000000000,\n    twitter: 500000000,\n\
    \    flickr: 50000000,\n    linkedin: 150000000,\n    myspace: 50000000,\n   \
    \ googleplus: 400000000,\n    orkut: 100000000,\n    lastfm: 50000000\n};\n```\n\
    \n# # Drawing people icons\n\nAs usual, we define our canvas and store a reference\
    \ to it in the `paper` variable. Based on the default width and height of the\
    \ icons we're using, a 770px wide and 220px high canvas suits our purposes nicely:\n\
    \n```\nvar paper = Raphael('world-population-usage', 770, 220);\n```\n\nThe person\
    \ icon that we are using comes courtesy of Dmitry Baranovskiy who has created\
    \ no less than 266 icons as paths at http://raphaeljs.com/icons/. Each icon on\
    \ this page comes with an associated path string that we can use directly in our\
    \ code. We hold a reference to one of the path strings in a variable called `personPath`\
    \ so that we may re-use it (note that the path shown here is truncated for the\
    \ sake of brevity):\n\n```\nvar personPath = \"M20.771,12.364c0,0,0.849-3.51 ...\"\
    \n```\n\nGiven this, we now draw 120 of these icons in six rows of 20 each. Each\
    \ icon represents 50 million people meaning that 120 icons represent the world\
    \ population of 6 billion people:\n\n```\nvar people = paper.set();\nfor(var j\
    \ = 0; j < 6; j+=1) {\n    for(var i = 0; i < 20; i+=1) {\n        var path =\
    \ paper.path(personPath).attr({\n            fill: '#666',\n            'stroke-width':\
    \ 0,\n            opacity: 0.3\n        });\n        var bBox = path.getBBox();\
    \ // width/height of icon\n        var xTranslation = (bBox.width + 4) * i;\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 111
  md: '```

    var yTranslation = (bBox.height + 4) * j;

    path.transform(''T'', xTranslation, yTranslation);

    people.push(path);

    }

    }

    ```


    In the given code, we iterate over i columns and j rows. We draw the icon using

    the path method and then get its bounding box in order to ascertain the width
    and

    height of the space it occupies. We then translate the icon by this width and
    height

    plus a small padding of 4px for each iteration. The number of widths that we wish

    to translate the icon in x is determined by the column index i while the number
    of

    heights by which we translate the icon in y is determined by the column index
    j:


    ```

    var xTranslation = (bBox.width + 4) * i;

    var yTranslation = (bBox.height + 4) * j;

    ```


    Finally, we store our created people paths in a set named people. This will allow
    us

    to operate on all people based on which social media icon is clicked:

    people.push(path);


    Note that each icon is drawn at an opacity of 0.3, which will allow us to

    differentiate between users of a social network and non-users that make

    up the world''s population.


    # # Responding to icon clicks


    We register a click event handler on each of the social media icons defined in
    our

    markup. When an icon is clicked, we will operate on the people set that we created

    in the previous section:

    $('' .networks img'').click(function() {

    // Operate on people Set

    });


    On click, we end any existing animations on all of the paths stored in our people
    set

    and reset the opacity to 0.3. The stop method prevents an animation from continuing

    to its target attributes and is necessary to prevent future animations conflicting
    with

    ongoing ones:

    people.stop().attr({opacity: 0.3});'
  merge: -1
  img_proc: true
- pgno: 112
  md: "# # Creating a Suite of Social Media Visualizations\n\nWe then get the class\
    \ name of the element that was clicked and use it to get the number of users for\
    \ this particular social network:\n\n```\n```javascript\nvar className = $(this).attr('class');\n\
    var numPeople = Math.ceil(\n  people.length * (usage[className] / 6000000000)\n\
    );\n```\n```\n\nSince the class name maps to a usage value stored in our `usage`\
    \ object, we calculate the usage as a proportion of the total population and then\
    \ multiply this figure by the total number of people in our `people` set. This\
    \ will give us a value between 0 and 120, that is, the number of icons that should\
    \ be highlighted based on 50 million users per icon. The `ceil` method rounds\
    \ this value up to the nearest one person.\n\nHaving determined the number of\
    \ icons we need to highlight, we then iterate over them using the `forEach` method\
    \ of the set object:\n\n```\n```javascript\npeople.forEach(function(o) {\n  if(o.id\
    \ < numPeople) {\n    o.animate({opacity: 1}, 500);\n    return true;\n  }\n \
    \ return false;\n});\n```\n```\n\nThe `forEach` method passes the object in the\
    \ set to the function it accepts as the first parameter. This object has an `id`\
    \ attribute corresponding to its indexed position in the set. It is a zero-based\
    \ ID meaning that we can compare its value during looping to see if it is less\
    \ than the `numPeople` variable that should be highlighted. If it is, we animate\
    \ it to an opacity of 1 that differentiates between all other defined icons whose\
    \ opacity is 0.3. The time taken to iterate over all paths in the `people` set\
    \ is negligible meaning that all animations appear to take place at the same time.\
    \ When the Facebook icon is clicked, for example, the first 20 icons in the `people`\
    \ set are animated to an opacity of 1.\n\n# # Drawing a key\n\nFinally, to identify\
    \ that one icon is equivalent to 50 million people, we redraw our person path\
    \ and add some accompanying text:\n\n```\n```javascript\nvar keyPerson = paper.path(personPath).attr({\n\
    \  fill: '#666',\n  'stroke-width': 0\n});\nvar bBox = keyPerson.getBBox();\n\
    ```\n```\n\n[ 102 ]\n\nwww.it-ebooks.info"
  merge: -1
  img_proc: true
- pgno: 113
