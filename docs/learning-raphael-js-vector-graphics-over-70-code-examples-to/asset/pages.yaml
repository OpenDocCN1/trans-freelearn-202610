    # # Golden tweets


    Twitter published an article at the end of 2012 discussing some of the tweets
    that were re-tweeted the highest number of times. These have been marketed as
    _golden tweets_ given the high levels of participation that they encouraged.


    A bar chart visualization has been created to represent the number of times that
