- pgno: 91
  md: '# # Working with Existing SVGs


    Most designers use a mixture of raster and vector graphics in their projects and
    so are familiar with vector graphics editors such as Adobe Illustrator and Inkscape.
    The usefulness of these tools has grown considerably in recent years inline with
    advances in digital media — in particular, designers need to be able to create
    resolution-independent graphics that work in different contexts.


    The mobile and tablet market, for example, encourages designers to create images
    that scale appropriately at really low resolutions (around 320 x 240) and really
    high resolutions (2,048 x 1,536). Desktop browsing is pretty much the same nowadays
    where user experience is tailored to satisfy a range of viewport dimensions. Satisfying
    a range of viewport dimensions is often referred to as **responsive design**.


    While SVG itself has limited support in older browsers, we can still provide vector
    graphics solutions. We now see that vector graphics are utilized more readily
    in websites and applications. By this token, we''re witnessing a shift in design
    from rigid, albeit more polished artwork to flexible vector-based designs.


    With this said, there is now greater importance placed on being able to work with
    the vector graphics produced by graphics editing software. While there is no silver
    bullet approach to working with existing SVGs in Raphaël, with a little determination
    we can utilize the existing SVGs in our projects.


    In this chapter we will look at the following:


    +   - The Inkscape vector graphics editor

    +   - The manual method of inspecting SVG paths

    +   - SVG to Raphaël conversion tools

    +   - Choropleth maps as an example of an existing SVG'
  merge: -1
  img_proc: true
- pgno: 92
  md: "# # Inkscape\n\nInkscape is an open source SVG editor whose feature set is\
    \ similar to that of Adobe Illustrator. It is used by many designers given that:\n\
    \n+   - It is open source and actively maintained / developed\n+   - There are\
    \ a good number of tutorials available online\n+   - It has a comprehensive feature\
    \ set\n+   - It conforms to the W3C standards SVG\n\nInkscape also has the advantage\
    \ of being cross-platform with releases available for Windows, Mac, and Linux.\n\
    \n# # Downloading Inkscape\n\nInkscape is available for download at `http://inkscape.org/download/`.\
    \ It is recommended that you download the latest stable release, which is 0.48.4\
    \ at the time of writing.\n\n# # Getting started with Inkscape\n\nWhile an in-depth\
    \ coverage of Inkscape is beyond the scope of this book, we will look at creating\
    \ some basic SVGs using Inkscape using the following steps:\n\n+   1. To begin,\
    \ open up Inkscape and choose **File | New** from the menu. Inkscape comes with\
    \ a number of predefined document sizes out of the box and you will want to select\
    \ the one best suited to the graphic that you're creating. For now, choose **default**.\n\
    +   \n+   On the left-hand side, you will see that Inkscape has a number of shape\
    \ drawing tools for drawing basic shapes, text, freehand, and Bézier paths."
  merge: -1
  img_proc: true
