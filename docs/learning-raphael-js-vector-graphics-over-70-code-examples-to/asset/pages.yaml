- pgno: 97
  md: '# # Inspecting paths


    Since we’re familiar with supplying raw path string data to the `path` method
    in

    Raphaël, it goes without saying that we can copy a path string from an SVG and

    draw paths this way. For complex graphics, the raw XML of an SVG is not always

    easy to work with and manipulating multiple paths can be cumbersome but this

    approach of working with existing SVGs does give us complete control over the

    graphics that we are manipulating.


    # # Inkscape''s XML Editor


    One of the great features of Inkscape is the ability to view and edit an SVG’s
    XML

    markup directly. Consider the example of the circle in the previous section. If

    you click on **Edit | XML Editor**, you will be presented with the SVG’s document

    structure. Clicking on the element you have created on the left—the `svg:path`

    element—will list all of the object’s attributes including the `d` attribute,
    which is the

    element’s path prior to the transformations being applied. Clicking on the `d`
    attribute

    reveals the path for the element:


    ![](img/d8ec653db4cab13fec8b3f5718174af6_97_0.png)'
  merge: -1
  img_proc: true
