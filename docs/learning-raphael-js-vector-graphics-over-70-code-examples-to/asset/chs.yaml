- '### 关于作者


  **Damian Dawber** 是一名网页开发人员，致力于中型到大型电子商务网站以及定制网页和移动应用程序的开发。他同时使用前端和服务器端技术，曾为中小型企业直至富时
  100 指数公司参与过各种项目。


  他在接触到用于解决物理问题的编程后开始了自己的职业生涯，并从此决定每天编写代码。


  > 我自然希望感谢所有在某种程度上塑造我个人和职业发展的人。特别是，我想感谢我的家人、同事以及现任和前任雇主，感谢他们让我有机会在这个行业发展。

  >

  > 特别感谢本书的技术审稿人 Charles Thomas 和 Lee Turver。他们的意见非常宝贵。

  >

  > 我也想感谢 Tomás Alabés 为我提供有关 Raphaël 库未来的内容。

  '
- '### 关于审稿人


  离开学校并从事过包括见习会计师和士兵在内的各种职业后，**Charles Thomas** 在 1990 年为一家他担任实验室主管的公司提供了软件解决方案。1992
  年，他因公司裁员而失业，随后完成了进一步的软件培训（1994 年获得计算机研究 HNC 证书）。


  自 1994 年以来，他一直参与处于“技术前沿”的项目，并且非常享受这些工作。在他的职业生涯中，他曾作为软件工程师在英国、欧洲、加拿大和美国为不同的公司工作（这些公司包括欧洲银行、GE（阿姆斯特丹）、Associated
  Newspapers / Daily Mail 和 HSBC）。他目前生活在英国并工作，根据有意公司的要求，以合同形式担任图形前端开发人员。


  他还为 Packt Publishing 出版的《Instant RaphaelJS Starter》做过一次较小的审阅。


  > 我想感谢 Tomás Alabés（最新 Raphaël 版本的主要协作者），感谢他提供有关 Raphaël 未来的信息，这些信息出现在本书的最后一章。


  **Lee Turver** 是一位位于曼彻斯特的 PHP 开发人员，拥有近 10 年使用各种 Web 相关技术的经验。目前在西北地区一家领先的数字代理机构工作，为知名客户构建高质量解决方案。


  你可以在 Twitter 上关注 Lee @LeeTurver。

