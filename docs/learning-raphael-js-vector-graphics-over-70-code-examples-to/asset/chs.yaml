- "### 前言\n\n《Learning Raphaël JS Vector Graphics》带你探索 Raphaël JavaScript 库及其在当今在线环境中的潜在应用。虽然它是一本“迷你”书，但绝非功能有限。本书涵盖了该库的所有主要方面及其应用，读完本书后，你将能够在浏览器中创建矢量图形和交互式应用程序。\n\
  \n### 本书内容\n\n第 1 章，图形 Web，介绍了 Raphaël：它是什么，它的应用，以及它在 Web 环境中的相关性。\n\n第 2 章，使用 Raphaël\
  \ 进行基础绘图，探讨如何绘制和装饰基本图形元素。\n\n第 3 章，绘制路径，介绍使用路径绘制和操作更复杂形状的方法。\n\n第 4 章，变换和事件处理，介绍图形元素的变换、基础事件处理、Events\
  \ 库以及拖放功能。\n\n第 5 章，矢量动画，探讨如何通过动画让元素“活”起来。我们将探讨不同的图形动画方式，并以示例引导。\n\n第 6 章，处理现有 SVG，介绍如何使用\
  \ Raphaël 处理现有 SVG，包括 Inkscape 概述和栅格地图讨论。\n\n第 7 章，创建社交媒体可视化套件，探讨基于前面章节所学内容构建四个社交媒体数据可视化演示。\n\
  \n### 适合读者\n\n本书适合所有对前端技术感兴趣的开发者。\n非常适合那些希望在 Web 浏览器中创建交互式应用程序或矢量图形的人。\n\n假设读者具备\
  \ JavaScript 的基础理解或熟悉度。\n\n### 约定\n\n在本书中，你会发现多种文本样式，用于区分不同类型的信息。以下是一些示例及其含义说明。\n\
  \n正文中的代码词显示如下：\"使用命令小写形式的等效路径为 \"M 50,150 q 175,-130 350,0\"，其中 (x, y) 和 (x1, y1)\
  \ 参数是相对距离...\"\n\n代码块显示如下：\n\n```\nvar bBox = path.getBBox(); // width/height of\
  \ icon\nvar xTranslation = (bBox.width + 4) * i;\nvar yTranslation = (bBox.height\
  \ + 4) * j;\npath.transform(['T', xTranslation, yTranslation]);\n```\n\n当我们希望引起你对代码块中特定部分的注意时，相关行或项目将以粗体显示：\n\
  \n```\npaths[i].animate({\n    subtend: [360, cx, cy, r]\n}, interval, function()\
  \ {\n    paths[i].remove();\n    setTimeout(function() {\n        update(i);\n \
  \   });\n});\n```\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_12_0.png)\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_12_1.png)\n\
  \n### 读者反馈\n\n我们始终欢迎读者反馈。请告诉我们你对本书的看法——你喜欢或不喜欢的地方。读者反馈对我们开发真正让你受益的书籍非常重要。\n\n如需发送一般反馈，只需发送电子邮件至\
  \ <feedback@packtpub.com>，并在邮件主题中注明书名。\n\n如果你在某个主题上有专业知识，并有兴趣撰写或参与编写书籍，请参阅我们在 www.packtpub.com/authors\
  \ 上的作者指南。\n\n### 客户支持\n\n既然你是 Packt 图书的自豪拥有者，我们有许多资源可以帮助你充分利用购买。\n\n### 下载示例代码\n\
