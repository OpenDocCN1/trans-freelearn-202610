- "# 第 1 章 图形 Web\n\n在当今的在线环境中，在 Web 浏览器中绘制图形非常重要。虽然在经验科学、数学和印刷媒体中长期存在有效表达信息的需求，但自\
  \ Web 出现以来，这种需求获得了新的生命力。随着我们现在生成的海量数据以及我们可以用来与用户通信的大量设备的存在，在线可视化数据的愿望和能力都有所提升。此外，浏览器已从进入信息世界的便捷入口发展成为真正的交互式媒体渠道。\n\
  \n已出现许多技术来实现基于浏览器的绘图，包括但不限于 VML 和 SVG、HTML5 Canvas 和 WebGL。每种技术通常适用于特定目的——VML 和\
  \ SVG 用于 2D 矢量绘图，HTML5 Canvas 用于位图绘图，WebGL 用于 3D 图形渲染。\n\n本书介绍了使用 **Raphaël** 进行\
  \ 2D 矢量绘图，Raphaël 是一个轻量级、开源的 JavaScript 库，它使用 SVG 和 VML 在浏览器中绘制矢量图形。它提供了一系列方便的方法，用于路径绘制、矢量变换、通过\
  \ DOM 实现的交互性以及路径动画，并支持位图图像嵌入和文本绘制。该库通过这些方法大大简化了绘图过程，充当底层（SVG 和 VML）规范的 _适配器_。\n\n\
  虽然在本书中，我们会力求让读者了解 SVG 规范，因为这将帮助我们充分发挥库的全部功能，但不需要深入理解 SVG 的工作原理，而且根本不涉及 VML。Raphaël\
  \ 负责在 SVG/VML 规范级别输出图形，这意味着我们只需要关注如何使用该库本身。\n\n\n\n\n\n## 图形化 Web\n\n该库的创建者兼 JavaScript\
  \ 大师，**Dmitry Baranovskiy**，在 http://raphaeljs.com/ 上对 Raphaël 进行了出色的文档编写，我们将在本书过程中广泛参考该文档，以便在浏览器中制作高品质的定制矢量图形。\n\
  \n在本章中，我们将：\n\n- 讨论 Web 上的矢量绘图\n- 更多地了解 Raphaël 和 SVG 规范\n- 查看 Raphaël 的一些潜在应用\n\
  - 下载 Raphaël 库\n\n### Web 上的矢量绘图\n\n矢量图形由许多基本几何对象组成，例如点、线、图形和多边形。每个单独的对象由数学表达式表示，而不是某个固定的物理点。缩放矢量图形意味着更改构成对象的数学属性，而不是对象本身，因此不会损失质量。固定点（即位图）图形受特定分辨率的限制，这意味着当它们被放大时，质量会丢失：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_16_0.png)\n\n来源：Wikimedia Commons\n(http://en.wikipedia.org/wiki/File:Bitmap_VS_SVG.svg)\n\
  \n所有图形最终都在固定点（即像素）级别呈现。毕竟，你的显示器是数百万个这些点的总和。位图和矢量图形之间的区别在于，对于矢量图形，呈现是在_最后一刻_完成的。放大位图意味着基于现有像素创建新像素，而对于矢量图形，像素是基于对象的抽象数学定义，在最终图形呈现的分辨率下创建的。\n\
  \nWeb 上的矢量绘图主要采用以下两种形式：\n\n- **矢量标记语言 (VML)** 由微软制定并于 1998 年提交给 W3C，描述了一种基于 XML\
  \ 的文件格式，可用于在 Internet Explorer 5 到 9 版本中创建矢量图形\n- **可缩放矢量图形 (SVG)** 由 W3C 自身于 2001\
  \ 年提出，描述了一种基于 XML 的文件格式，已被所有主要现代浏览器采用，包括 Firefox、Google Chrome、Safari 和 Opera\n\n\
  确实，Internet Explorer 的第 9 版和第 10 版对 SVG 提供原生支持，VML 已被弃用，取而代之的是 SVG。\n\n### 矢量绘图库\n\
  \n有许多可用于绘制矢量图形的 JavaScript 库。除了 Raphaël，两个流行的库是 **Paper.js** (`http://paperjs.org`)\
  \ 和 **D3.js** (`http://d3js.org`)。每个库最适合不同的任务，你使用哪个取决于你想要实现什么。\n\n下表总结了 Raphaël、Paper.js\
  \ 和 D3.js 库：\n\n| 库 | IE 6, 7, 8 支持 | 开箱即用（通用）可视化 | 低级（定制）可视化 |\n|---------|-------------------|------------------------------------------|-----------------------------------|\n\
  | Raphaël | 是               | 否                                       | 是      \
  \                         |\n| D3.js   | 否                | 是                  \
  \                    | 否                                |\n| Paper.js| 否       \
  \         | 否                                       | 否                        \
  \        |\n\nRaphaël 特别适合创建定制矢量图形，因为它为 SVG 规范提供了低级 API。它非常擅长处理基本矢量图形，并为处理现有 SVG\
  \ 图像提供了空间。D3.js 使创建数据可视化变得简单，因为其 API 非常面向数学运算和数据操作，但在处理较低级别的矢量图形时，它不提供与 Raphaël\
  \ 相同的灵活性。Paper.js 使用 HTML5 Canvas 进行矢量图形绘制，因此在操作矢量方面较少，但它确实具有非常好的图像操作和路径处理功能。\n\n\
  Raphaël 是唯一支持 VML 规范的框架，并在不支持原生 SVG 的浏览器（IE 6、7 和 8）中回退到使用 VML（从技术上讲，Paper.js 可以在旧浏览器上工作，但该项目不支持它们）。尽管开发者社区做出了最大努力，支持旧浏览器仍然是许多公司的要求。\n\
  \n### SVG 规范\n\nSVG 是当今 Web 上实现的最广泛的矢量图形规范。所有现代浏览器都对该格式提供全面支持，最新的移动浏览器至少提供对 SVG\
  \ 的基本支持（包括 Safari 3.2 及更高版本、Blackberry 浏览器和 Android 版 Chrome）。\n\nSVG 指定了一种基于 XML\
  \ 的文件格式，用于创建矢量图形。例如，定义一条从某个任意坐标系统中 x=50、y=50 的点到 x=10、y=10 的点的黑色实线，宽度为 1 的基本路径，由以下代码描述：\n\
  \n```\n<path d=\"M50 50 L10 10\" stroke-width=\"1\" stroke=\"#000\" />\n```\n\n\
  除了路径，SVG 还支持形状绘制、文本、填充和渐变、动画以及交互，SVG 图像可以响应用户触发的事件。你可以在 http://raphaeljsvectorgraphics.com/the-graphical-web/raw-svg/\
  \ 上查看一些 SVG 示例。\n\nRaphaël 广泛使用基于 XML 的语言，在本书过程中你将熟悉 SVG 的一些语法，尤其是与路径绘制相关的部分。\n\n\
  ### 使用 Raphaël 而非直接编写 SVG\n\n除了浏览器支持之外，使用 Raphaël 而非编写原始 SVG 的一个好理由是，它使矢量绘图_更容易_。例如，使用原始\
  \ SVG 绘制一个矩形并将其宽度从 50 像素动画化到 100 像素：\n\n```\n<rect x=\"10\" y=\"10\" width=\"50\"\
  \ height=\"30\">\n  <animate attributeType=\"XML\"\n           attributeName=\"\
  width\"\n           to=\"100\"\n           fill=\"freeze\"\n           dur=\"1s\"\
  \ />\n</rect>\n```\n\n这里我们使用 `<rect>` 元素在 (10, 10) 处绘制一个宽度为 50、高度为 30 的矩形。嵌套的 `<animate>`\
  \ 元素随后定义了矩形宽度在一秒内动画化到总宽度 100，其中 `fill=\"freeze\"` 用于在动画完成后保留矩形的状态（否则其宽度将被重置为 50）。考虑到我们想要实现的目标相当简单，这相当冗长。Raphaël\
  \ 中的等效动画由以下代码实现：\n\n```\nvar rect = paper.rect(10, 10, 50, 30);\nrect.animate({\n\
  \  width: 100\n}, 1000);\n```\n\n这里，`animate` 和 `rect` 方法更加简洁。\n\nRaphaël 还与其他库（例如\
  \ jQuery）集成良好，因为它体积小巧且命名空间合适（它只创建一个名为 Raphael 的全局变量）。\n\n### Raphaël 的应用\n\nRaphaël\
  \ 已被用于各种项目，从 _Town Hall @ the White House_ 事件期间的地图可视化（`http://askobama.twitter.com/`）到\
  \ **Ebocs** (`http://www.dejapong.com/ebocs/`) 等在线游戏。前者展示了该库的一个流行应用，即制图，而后者是该库在创建低精灵（位图图像）数量的游戏方面可行但不太常见的应用。\n\
  \nRaphaël 特别适合制图，因为该库使我们能够为 DOM 元素添加交互性，并可以在不损失质量的情况下缩放图形。一个很好的示例可以在 http://raphaeljs.com/australia.html\
  \ 找到，其中演示了澳大利亚的交互式分级色图（我们将在第 6 章“使用现有 SVG”中介绍如何创建分级色图）。\n\n该库还有其他一些更微妙的应用。虽然 CSS3\
  \ 变得越来越普遍，但许多属性尚未在所有浏览器中统一，旧浏览器中几乎没有或根本没有支持。在某些情况下，使用 Raphaël 实现相同效果可能更适合你正在进行的项目。一个关于图像转换的演示可以在\
  \ http://raphaeljsvectorgraphics.com/the-graphical-web/css3-raphael-transforms/\
  \ 找到。\n\n### 下载 Raphaël\n\n在本书过程中，我们将使用 Raphaël 2.1.0 版，这是撰写本书时该库的最新版本。该库的最新版本可以从\
  \ http://raphaeljs.com 下载。该项目托管在 GitHub 上，网址为 https://github.com/DmitryBaranovskiy/raphael/，旧版本的库标记在\
  \ https://github.com/DmitryBaranovskiy/raphael/tags，以防你需要它们。\n\n建议在开始新项目时下载库的压缩版和未压缩版。在开发过程中，你应该使用\
  \ Raphaël 的未压缩版：你可能希望参考源代码中的特定方法，并且调试消息在未压缩版中更有意义。对于生产环境，你应该始终使用压缩版。压缩版的文件大小显著更小，使用它将减少服务器负载并缩短页面响应时间。\n\
  \n你可以通过 gzip 压缩进一步减小 Raphaël 的大小。你的 Web 服务器通常负责压缩静态内容。例如，Apache 的 mod_gzip 可以压缩\
  \ HTML、文本、CSS 和 JavaScript 文件（有关更多信息，请查阅 Web 服务器的文档）。\n\n\n\n\n\n### 创建 Raphaël\
  \ JavaScript 应用程序\n\n学习如何利用新技术最重要的方面是理解驱动它的概念。本书将在适当的地方使用代码示例，但会省略大量不必要的代码，以便专注于手头任务的核心方面。在适当的时候，您应该参考随本书附带的源代码和网站（http://raphaeljsvectorgraphics.com）。\n\
  \n### 项目结构和优化\n\n本书中的项目将相当独立，因此项目结构将保持相当简单。随着您自己的项目不断增长，您应该仔细关注项目结构。\n\n您还应该考虑在将工作推送到生产环境时合并和压缩\
  \ CSS 和 JavaScript 文件。这将提高网站或应用程序的响应速度并减少 Web 服务器的负载。实现此目的的有用工具包括 **minify**（http://code.google.com/p/minify/）和\
  \ Google 的 **Closure Tools**（https://developers.google.com/closure/）。\n\n### 摘要\n\
  \n人们常指出，浏览器中的矢量绘图是一项未被充分利用的技术。开发人员通常对该技术的演示印象深刻，但并不总是确定它可以被应用到何种程度。希望阅读本章后，您能更好地理解\
  \ Raphaël 的功能以及它能够解决的问题类型。\n\n在下一章中，我们将探讨使用 Raphaël 进行基本绘图，并在浏览器中创建我们的第一批矢量图形。\n"
- "# 2 使用 Raphaël 进行基本绘图\n\nRaphaël 支持三种基本类型的图形元素：形状、图像和文本。形状可以是预定义的形状，例如矩形、圆形或椭圆，也可以是线条、曲线和路径的组合。矢量图形本质上就是这些形状的总和，在接下来的两章中，我们将基于它们创建许多有趣的图形。图像可以是位图图像（如\
  \ .png 或 .jpeg）或现有的 SVG 图像，Raphaël 可以以许多与形状相同的方式操作图像。\n\n形状和文本可以进行绘制，即填充和描边（添加轮廓）。填充可以是单一颜色，也可以是线性或径向渐变。描边只能用单一颜色填充，但形状的描边方式是可修改的。\n\
  \n已绘制形状的示例可以在 http://raphaeljsvectorgraphics.com/basic-drawing/shapes-and-attributes\
  \ 上查看。\n\n在本章中，我们将：\n\n- 将浏览器视为绘图的上下文\n- 绘制基本形状\n- 将填充、描边和其他属性应用于元素\n- 将渐变填充应用于元素\n\
  - 使用自定义文本并探索嵌入自定义字体\n\n## 绘图上下文\n\n为了能够绘制图形，我们需要定义一个可呈现内容的空间。就像艺术家一样，我们需要一张可以绘图的画布。浏览器窗口的可见区域，即\
  \ **视口**，定义了我们可以绘制 **画布** 的区域。\n\nSVG 规范将绘图区域本身称为视口。严格来说，视口是任何矩形观看区域。我们始终将浏览器窗口称为\
  \ _视口_，将我们的绘图区域称为 _画布_（不要与 HTML5 Canvas 混淆）。\n\n我们可以使用 `Raphael` 构造函数创建画布，如下所示：\n\
  \n```\nvar paper = Raphael(50, 100, 500, 300);\n```\n\n这将在视口左侧 50px、顶部 100px 处创建一个宽\
  \ 500px、高 300px 的画布，如下图所示。`paper` 变量保存对 `Paper` 对象的引用，该对象就是我们的画布，我们将使用它进行所有后续绘图：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_24_0.png)\n\n更常见的是，我们希望使用现有的 DOM 元素作为画布的容器，而不是视口。在这种情况下，不需要左/右（x-/\
  \ y-）偏移量，因为画布始终会在元素的左上角呈现。考虑以下元素：\n\n```\n<div id=\"my-canvas\"></div>\n```\n\n\
  我们将使用以下代码创建宽 500px、高 300px 的画布：\n\n```\nvar paper = Raphael('my-canvas', 500, 300);\n\
  ```\n\n使用这种构造函数形式时，当第一个参数为字符串时，我们始终传递元素 ID。或者，我们可以将 DOM 元素作为第一个参数传递，如下所示：\n\n```\n\
  Raphael(document.getElementById('my-canvas'), 500, 300);\n```\n\n## 画布坐标\n\n下图说明了使用\
  \ `Raphael` 构造函数创建的画布的默认坐标系统。画布的 **原点** 定义为 _x_ 和 _y_ 均等于零的点。画布上 _x_ = 300 且 _y_\
  \ = 200 的点，即矢量表示法中的 (300, 200)，是相对于原点 _x_ 点向右 300px、相对于原点 _y_ 点向下 200px 的点，如下图所示：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_25_0.png)\n\n同样，(-125, 50) 处的点相对于原点在\
  \ _x_ 和 _y_ 方向上的位置，如下图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_25_1.png)\n\
  \n## 绘制基本形状\n\nRaphaël 提供了 `rect`、`circle` 和 `ellipse` 方法来绘制基本形状。这些是我们创建画布时返回的 `Paper`\
  \ 对象的方法。例如，`rect` 方法的语法如下（摘自 Raphaël 文档 http://raphaeljs.com/reference.html#Paper.rect）：\n\
  \n```\nPaper.rect(x, y, width, height, [r]);\n```\n\n`x` 和 `y` 坐标描述矩形的左上角点，第五个参数\
  \ `r` 是圆角的半径，方括号表示它是可选的（默认情况下圆角半径为 0）。在 x = 200px、y = 150px 处创建宽 50px、高 100px 的矩形，如下所示：\n\
  \n```\nvar paper = Raphael('my-canvas', 500, 300);\nvar rectangle = paper.rect(200,\
  \ 150, 50, 100);\n```\n\n同样，我们可以通过以下方式创建宽 75px、圆角半径 15px 的正方形：\n\n```\nvar square\
  \ = paper.rect(300, 150, 75, 75, 15);\n```\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_26_0.png)\n\
  \n请注意，在负 `x` 或 `y` 点绘制的图形将从画布可见区域之外开始绘制，这意味着它们会被部分或完全隐藏，如下图所示：\n\n两个矩形在下图中显示。请注意，绘图是从矩形的左上角沿正\
  \ _x_ 和 _y_ 方向进行的：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_27_0.png)\n\n圆的语法（http://raphaeljs.com/reference.html#Paper.circle）为：\n\
  Paper.circle(x, y, r);\n\n虽然矩形的 _x_ 和 _y_ 坐标描述其左上角点，但对于圆形，它们定义其 **中心** 点。第三个参数 _r_\
  \ 是圆的半径。在 _x = 100_、_y = 100_ 处绘制半径为 50px 的圆，如下所示：\nvar paper = Raphael('my-canvas',\
  \ 500, 300);\nvar circle = paper.circle(100, 100, 50);\n\n椭圆的语法（http://raphaeljs.com/reference.html#Paper.ellipse）与圆非常相似，只是我们分别指定\
  \ x 和 y 半径：\nPaper.ellipse(x, y, x-radius, y-radius);\n\nx 半径是 y 半径两倍的椭圆如下所示：\n\
  var ellipse = paper.ellipse(300, 100, 100, 50)\n\n\n\n\n\n应该清楚，圆实际上只是椭圆的一种特殊情况，其中\
  \ x 半径等于 y 半径。生成的圆和椭圆如下图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_28_0.png)\n\
  \nRaphaël 的文档详尽，可在 http://raphaeljs.com/reference.html 查阅。为了全面掌握本书中使用的方法，强烈建议广泛参考该文档。\n\
  \n## 嵌入图像\n\nRaphaël 允许我们将位图（.jpg 或 .png）图像嵌入到画布中。它通过 Paper 对象的 image 方法实现。以下代码演示了嵌入\
  \ .jpg 图像：\n\n```\nvar paper = Raphael('my-canvas', 600, 252);\npaper.image('stella.jpg',\
  \ 15, 15, 144, 192);\n```\n\n.jpg 图像位于 (15, 15)，其宽度和高度分别缩放为 144px 和 192px。\n\n##\
  \ 元素属性\n\n我们绘制的形状可以应用填充、描边以及许多其他属性。当我们创建一个形状时，会返回一个 Element 对象。该对象有一个 attr 方法，接受若干键值对属性。在本节中，我们将探讨可以使用此方法应用于绘图的各种属性（参见\
  \ http://raphaeljs.com/reference.html#Element.attr）。\n\n## 基本填充\n\n为了给元素添加背景，我们使用\
  \ `fill` 属性进行填充。\n对于单色填充，格式遵循 CSS 规范（即，`#rrggbb` 或 `#rgb` 简写，`rgb(r, g, b)` 字符串或颜色关键字，例如\
  \ `navy`）。例如，要将矩形填充为黑色，可以编写：\n\n```\nvar rect = paper.rect(200, 50, 200, 100);\n\
  rect.attr({fill: '#000'});\nvar square = paper.rect(450, 50, 50, 50);\nsquare.attr({fill:\
  \ 'rgb(0, 0, 0)'});\n```\n\n同样，要将圆形填充为粉色，可以编写：\n\n```\nvar circle = paper.circle(100,\
  \ 100, 50);\ncircle.attr({fill: 'pink'});\n```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_29_0.png)\n\
  \n## 图像填充\n\nRaphaël 还允许你使用图像填充元素。考虑以下代码：\n\n```\nvar circle = paper.circle(100,\
  \ 100, 80);\ncircle.attr({fill: 'url(bg_pattern.png)'});\n```\n\n这将创建一个圆形，其填充为名为\
  \ `bg_pattern.png` 的模式图像，如下图所示。图像填充始终在 `x` 和 `y` 方向重复：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_30_0.png)\n\
  \n## 应用描边\n\n元素可以有多种不同的描边属性。最常见的是 `stroke` 和 `stroke-width` 属性。`stroke` 属性采用符合 CSS\
  \ 规范的字符串颜色值，而 `stroke-width` 是以像素为单位的数字。以下代码的效果是给圆形应用 10px 宽的石灰绿色描边：\n\n```\nvar\
  \ circle = paper.circle(100, 100, 70);\ncircle.attr({\n    fill: '#09c',\n    stroke:\
  \ 'limegreen',\n    'stroke-width': 10\n});\n```\n\n生成的圆形如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_30_1.png)\n\
  \n描边是居中绘制的，这意味着可见描边宽度的一半在元素内部，另一半在元素外部。\n\n你会注意到本章前面的一些示例中，即使我们没有应用属性，它们仍然被描边了。这是因为默认的\
  \ stroke-width 值为 1px。要在绘制形状时移除描边，必须始终指定 stroke-width 值为 'none'。\n\n其他一些有用的描边属性包括\
  \ stroke-dasharray 和 stroke-linejoin，如下所示。前者允许我们指定由虚线、点和空格组成的模式，生成的描边将使用它们绘制，而后者决定路径线条应如何连接在一起：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_31_0.png)\n\n你可以在 http://raphaeljs.com/reference.html#Element.attr\
  \ 和 http://www.w3.org/TR/SVG/painting.html#StrokeProperties 上了解更多关于不同描边属性的信息。\n\n\
  ## 其他属性\n\n除了描边和填充之外，创建元素时可能还想使用许多其他属性。我们将在本节中演示其中一些。\n\n## href\n\n我们创建的元素已注册到\
  \ DOM 中，指定 href 属性允许它们表现为超链接。例如：\n\n```\nvar rect = paper.rect(30, 30, 140, 140);\n\
  rect.attr({\n    href: 'http://www.packtpub.com'\n});\n```\n\n这将创建一个矩形，点击时会链接到 Packt\
  \ Publishing 网站。\n\n## opacity\n\n元素的不透明度可以设置为 0（完全透明）到 1（完全不透明）之间的值。我们还可以使用 `stroke-opacity`\
  \ 和 `fill-opacity` 属性分别设置描边和填充的不透明度：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_32_0.png)\n\
  \n描边始终居中绘制的一个不幸副作用是，一半的描边与填充重叠，这意味着 `stroke-opacity` 的适用性有限。\n\n> 将 'stroke-opacity':\
  \ 0.5 与与填充颜色匹配的描边颜色结合使用，可以使形状边缘非常平滑，实际上对其进行抗锯齿处理。\n\n## clip-rect\n\nRaphaël 支持使用\
  \ `clip-rect` 属性对元素进行矩形裁剪。裁剪允许我们只显示元素的一部分。我们定义矩形裁剪区域如下：\n\n```javascript\nvar circle\
  \ = paper.circle(100, 100, 80, 80);\ncircle.attr({\n    fill: 'pink',\n    'stroke-width':\
  \ 0,\n    'clip-rect': '20 20 80 80'\n});\n```\n\n这将创建一个半径为 80px、中心位于点 (100, 100)\
  \ 的圆。`clip-rect` 属性定义一个矩形区域，由空格分隔的字符串形式如下：\n\n```\n\"x y width height\"\n```\n\n\
  这将只显示圆中被矩形裁剪区域 '20 20 80 80' 重叠的部分：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_33_0.png)\n\
  \n## 应用渐变\n\nRaphaël 支持对元素应用线性和径向渐变填充。要实现这一点，我们不在 fill 属性上指定颜色字符串，而是指定以下形式的字符串以创建线性渐变：\n\
  \n```\n`<angle>-<color>[-<color>[:<offset>]]*-<color>`\n```\n\n以下语法用于创建径向渐变：\n\n\
  ```\n`r[(<fx>, <fy>)]<color>[-<color>[:<offset>]]*-<color>`\n```\n\n这种语法最好通过示例来说明。\n\
  \n## 线性渐变\n\n最基本的线性渐变填充形式如下：\n\n```\n`<angle>-<color1>-<color2>`\n```\n\n这指定了一个从\
  \ color1 到 color2 按 angle 度角绘制的渐变。例如：\n\n```javascript\nvar rect = paper.rect(20,\
  \ 20, 160, 160);\nrect.attr({\n\t'stroke-width': 0,\n\tfill: '0-#f00-#000'\n});\n\
  ```\n\n这将绘制一个矩形，其线性渐变从红色到黑色，角度为 0 度，如下图左侧所示。右侧的矩形使用填充值 '90-#f00-#000' 创建，这次渐变以 90\
  \ 度角绘制：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_34_0.png)\n\n请注意，绘制角度是从正 x 轴逆时针定义的，如下图所示，适用于从蓝色到白色的\
  \ 45 度渐变：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_34_1.png)\n\n线性渐变可以由任意数量的颜色组成，颜色构成渐变的点定义为\
  \ **offsets**。这就是以下语法的含义：\n\n[-<color>[:<offset>]]*\n\n这里可以创建任意数量的 -color:offset\
  \ 组合。例如，考虑使用以下字符串创建的渐变：\n\nfill: \"0-#00a9e0-#323490:20-#ea1688:40-#eb2e2e:60-#fde92d:80-#009e54\"\
  \n\n这将创建类似彩虹的图案，如下图所示。每种颜色相对于前一种颜色偏移额外的 20 个百分点。第一种和最后一种颜色的隐含偏移量分别为 0 个百分点和 100\
  \ 个百分点：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_35_0.png)\n\n从技术上讲，由于每个偏移量之间的差异对所有颜色都相等（20\
  \ 个百分点），我们可以在前面示例的字符串中省略偏移量值。以下表达式描述的渐变产生相同的结果：\n\n```\n\"0-#00a9e0-#323490-#ea1688-#eb2e2e-#fde92d-#009e54\"\
  \n```\n\n## 径向渐变\n\n径向渐变与线性渐变类似，只是它们从元素上的固定点（默认为元素中心点）_向外辐射_绘制。最基本的径向渐变由语法 `r<color>-<color>`\
  \ 给出。例如：\n\n```\nvar circle = paper.circle(100, 100, 80); circle.attr({\n'stroke-width':\
  \ 0,\nfill: 'r#fff-#000'\n});\n```\n\n\n\n\n\n这描述了一个从中心白色到边缘黑色的渐变圆：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_36_0.png)\n\
  \n与线性渐变一样，我们可以为每个颜色定义多个颜色及可选偏移量。例如，字符串 ‘r:#fff-#f00-#00f:90-#000’ 创建了一个从白色到红色再到蓝色的径向渐变，在\
  \ 90% 的偏移处过渡到边缘的黑色。\n\n绘制径向渐变的起点，称为**焦点**，可以使用 `(<fx>, <fy>)` 语法指定，其中 `fx` 和 `fy`\
  \ 的值在 0 到 1 之间。元素的中心点的焦点定义为 (0.5, 0.5)。减小或增大 `fx` 值会将焦点在 `x` 轴上向左或向右移动，而增大或减小 `fy`\
  \ 值会将焦点在 `y` 轴上向上或向下移动。下图显示了改变 `fx` 和 `fy` 的值如何影响焦点的位置：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_36_1.png)\n\
  \n> 注意，由于 VML 中的一个错误，径向渐变不能应用于 `Path` 元素（参见第 3 章，绘制路径），因此实际上仅适用于本章介绍的基本形状。\n\n##\
  \ 分组元素\n\n有时我们希望将相同的属性、变换或动画应用于 _多个_ 元素。我们可以在 Raphaël 中使用 set 方法对元素进行分组。请考虑以下形状：\n\
  \n```javascript\nvar paper = Raphael('my-canvas', 540, 200);\nvar circle = paper.circle(100,\
  \ 100, 80);\nvar rect = paper.rect(205, 40, 120, 120);\nvar ellipse = paper.ellipse(430,\
  \ 100, 80, 60);\n```\n\n通过创建一个包含对所有这些形状引用的 **set**，我们可以通过在 **set 上** 调用 `attr` 方法而不是对每个单独元素调用，将相同的属性应用于所有形状。我们创建一个包含所有元素的\
  \ set，并将其引用保存在名为 `group` 的变量中，如下所示：\n\n```javascript\nvar group = paper.set();\n\
  group.push(circle, rect, ellipse);\n```\n\n然后我们将以下属性应用于刚刚创建的 set：\n\n```javascript\n\
  group.attr({\n    fill: '180-#09c-#fff:30-#f00',\n    stroke: '#000',\n    'stroke-width':\
  \ 5\n});\n```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_38_0.png)\n\
  \n## 使用文本\n\n在画布上绘制文本，而不是作为带有 CSS 样式的 HTML 标记，允许我们像对待其他形状一样对其进行动画和变换。文本使用 `text`\
  \ 方法创建，其属性（如 `size` 和 `font-family`）可作为属性进行修改。`text` 方法的定义如下，其中 `text` 参数是我们的文本字符串，并接受标准转义序列\
  \ `\\n` 作为输入，这会将后续文本放在新行上：\n\nPaper.text(x, y, text)\n\n以下代码使用此方法创建两段文本，然后将它们分组到一个\
  \ set 中，以便对两个元素应用 `font-size` 和 `font-family` 属性：\n\n```javascript\nvar text1 =\
  \ paper.text(0, 15, 'I am text anchored start.');\ntext1.attr({\n    'text-anchor':\
  \ 'start',\n});\nvar text2 = paper.text(270, 100, 'I am text\\nanchored middle');\n\
  text2.attr({\n    'text-anchor': 'middle'\n});\nvar group = paper.set(text1, text2);\n\
  group.attr({\n    'font-size': 20,\n    'font-family': 'serif'\n});\n```\n\n## 嵌入自定义字体\n\
  \n字体转换器和渲染器 Cufón 已被 @font-face 取代，用于常规 Web 字体渲染。但是，由 Cufón 生成的字体具有完全定义的路径，并与 Raphaël\
  \ 无缝集成，这意味着我们可以以许多与形状相同的方式来操作此类字体。此演示可以在 http://raphaeljsvectorgraphics.com/the-graphical-web/custom-fonts\
  \ 上查看。\n\nCufón 支持从 **TrueType (TTF)、OpenType (OTF)、Printer Font Binary (PFB) 和\
  \ PostScript** 字体文件生成自定义字体。要使用 Cufón 生成自定义字体，请访问 http://cufon.shoqolate.com/generate/\
  \ 并填写字体生成表单。确保在标题 **Customization (for 3rd-party scripts only)** 下的文本框中输入 Raphael.registerFont（或单击其旁边的小\
  \ Raphaël 标志），如下图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_39_0.png)\n\n生成的字体将是一个\
  \ JavaScript 文件。您应该在 Raphaël 库之后将其包含在 HTML 文档中，即如下所示：\n\n`<script type=\"text/javascript\"\
  \ src=\"raphael.min.js\"></script>\n<script type=\"text/javascript\" src=\"MyFont.font.js\"\
  ></script>`\n\n要在画布上使用该字体，您将使用 print 方法（http://raphaeljs.com/reference.html#Paper.print）。例如，嵌入名为\
  \ Pacifico.font.js 的字体：\n\n`<script type=\"text/javascript\" src=\"Pacifico.font.js\"\
  ></script>`\n\n我们使用自定义字体在画布上打印文本，如下所示：\n\n```javascript\nvar text = paper.print(\n\
  \    50,\n    50,\n    'Vi veri veniversum vivus vici',\n    paper.getFont('Pacifico'),\n\
  \    38\n);\n```\n\n这将在画布上的点 (50, 50) 绘制字体大小为 38px 的自定义文本。`getFont` 方法只是引用您嵌入的字体系列的名称，而\
  \ Cufón 应该已经负责将字体注册到 Raphaël 中。\n\n属性可以以与我们已经对形状和文本应用属性的相同方式应用于自定义字体文本。例如：\n\n```javascript\n\
  text.attr({\n    fill: '315-#000-#666',\n    'stroke-width': 0\n});\n```\n\n这将生成如下所示的文本：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_40_0.png)\n\n## 总结\n\n在本章中，我们在特定绘图区域或画布的背景下介绍了\
  \ Raphaël 中的许多基本绘图和绘画示例。您现在应该能够使用该库绘制基本矢量图形，并探索 http://raphaeljs.com 上的文档。\n\n在下一章中，我们将探讨使用路径绘制更复杂的元素。\n"
- "# 3 绘制路径\n\n绘制和操作路径的能力是 Raphaël 的一项非常强大的功能。在上一章中，我们根据路径的几何属性（如宽度、高度和半径）绘制了基本形状。路径允许我们通过定义由线条、弧线和曲线连接的点来绘制各种形状，这些点代表形状本身的轮廓。\n\
  \n路径（如基本形状）是 _元素_，这意味着用户交互、绘制、变换和动画都可以应用于路径。Raphaël 提供了许多用于绘制和操作路径的方法，因此这将是本书其余部分的重点。\n\
  \n绘制路径的语法由 SVG 规范定义。理解此语法对于创建复杂形状至关重要，在本章过程中，我们将对其非常熟悉。\n\n为了让您了解可以使用路径实现什么，`http://raphaeljs.com/chart.html`\
  \ 上的演示将向您展示如何使用平滑曲线连接数据点，这在图表应用程序中很常见。确实，复杂的 SVG 插图（例如，使用 Adobe Illustrator 或 Inkscape\
  \ 等图形包创建的插图）由许多路径组成，一个有趣的演示可以在 `http://raphaeljs.com/tiger.html` 上查看。\n\n本章对路径的覆盖非常全面，因此建议您在每节结束时停下来回顾和实验所涵盖的概念。在本章中，我们将探讨以下主题：\n\
  \n- 路径绘制背后的概念\n- moveto、lineto 和 closepath 命令\n- 绘制二次和三次贝塞尔曲线\n- 弧线绘制命令\n- Raphaël\
  \ 中用于处理路径的实用方法\n- 由数据插值示例的 Catmull-Rom 曲线\n\n## 路径绘制概念\n\n在纸上用笔绘制的过程可以分解为以下步骤：\n\
  \n1. 您将笔放在纸上的某个特定点上。\n2. 您按下笔并从这一点自由移动到另一点。\n3. 您将笔保持在此点，或者抬起笔并将其放在纸上的另一点上。\n4.\
  \ 重复该过程，直到您完成绘制。\n\n路径绘制的工作方式大致相同。您放置笔的点，称为 **当前点**，定义了路径的起点，而笔的自由移动描述了路径本身。\n\n\
  考虑绘制一个 arbelos 形状。我们首先将笔放在画布上的点 (100, 180)，并绘制一条弧线到点 (380, 180)，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_42_0.png)\n\
  \n然后我们从点 (380, 180) 创建一条弧线到点 (200, 180)：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_42_1.png)\n\
  \n\n\n\n\n最后，我们创建一条回到点 (100, 180) 的弧线以完成路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_43_0.png)\n\
  \n阿贝洛斯的示例演示了单个路径的绘制，在绘制过程中我们任何时候都没有抬起笔。如果我们抬起笔，随后的绘制在技术上将在主路径元素上创建 **子路径**。在示例中，将三角形作为子路径创建的效果是\
  \ _添加_ 到我们的单个路径元素。还要注意，fill 属性应用于 _整体_ 路径，而不是单个子路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_43_1.png)\n\
  \n## 路径绘制命令\n\n路径基于按定义顺序执行的多个绘制命令。命令表达为一个字母，该字母可以是大写，表示后续绘制在绘图上下文中使用绝对坐标，也可以是小写，表示后续绘制使用相对于当前点的坐标。大多数命令将参数作为参数来确定命令的行为。例如，考虑以下路径字符串：\n\
  \"M100,180 a140,140,0,0,1,280,0\"\n\n## 绘制路径\n\n此路径字符串用于绘制上一节中的阿贝洛斯。绘制使用 `M` 命令开始，随后的弧线使用\
  \ `a` 命令绘制。\n\n我们在 Raphaël 中使用 `path` 方法绘制路径，该方法接受路径字符串或数组作为参数。数组通常是定义路径更方便且更易读的方式。考虑以下代码：\n\
  \n```\nvar xStart = 100;\nvar yStart = 180;\nvar path = paper.path([\n\t'M', xStart,\
  \ yStart,\n\t'a', 140, 140, 0, 0, 1, 280, 0\n]);\n```\n\n这将绘制前一路径字符串描述的路径。数组格式更易读，也是处理分配给\
  \ xStart 和 yStart 变量的参数值的更清晰方式。\n\n> 为了简洁起见，我们将在本书中交替使用这两种格式来定义路径。\n\n## moveto\
  \ 命令\n\n**moveto** 命令建立一个新的当前点。在上一节详细介绍的笔类比中，发出 moveto 命令的效果是将笔从页面上抬起并放置在给定点。所有路径都以\
  \ moveto 命令开始。\n\nmoveto 命令具有以下语法：\n\n| 命令 | 参数 | 示例 |\n|---------|------------|---------|\n\
  | M 或 m | (x, y)+ | M 50,50 100,100 |\n\n在阿贝洛斯示例中，`M 100,180` 的效果是将笔放置在 x = 100,\
  \ y = 180 的点。随后的命令将这些坐标用作绘制的起点。\n\n您可能已经注意到，moveto 语法允许我们重复 `x` 和 `y` 参数（由 `+` 符号表示）。例如，考虑以下路径：\n\
  \n`\"M 50,50 100,150\"`\n\n第一个 (x, y) 对将笔移动到画布上的点 (50, 50)，正如我们所期望的那样。然而，第二个 (x,\
  \ y) 对的效果是绘制一条线到点 (100, 150)，并移动当前点。这种行为意味着 moveto 命令可以用于绘制多边形。以下代码仅使用 moveto 命令绘制一个顶点位于\
  \ (250, 50)、(200, 100) 和 (300, 100) 的三角形：\n\n```\nvar path = paper.path([\n 'M',\
  \ 250, 50\n 200, 100,\n 300, 100,\n 250, 50\n ]);\n```\n\n您应该注意到，提到的所有 (x, y) 点都是绝对的，即相对于画布的原点定义。如果我们指定命令的小写变体\
  \ m，则每个连续的 (x, y) 对将相对于前一个点（但请注意，第一个 (x, y) 对始终使用绝对坐标定位，无论 M 命令的大小写如何）。使用相对坐标定义的相同三角形由路径字符串\
  \ m 250,50 -50,50 100,0 -50,-50 描述。\n\n以下是 moveto 命令的多个示例：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_45_0.png)\n\
  \n## lineto 命令\n\n**lineto** 命令从当前点绘制直线到指定点。有三个 lineto 命令：\n\n- `L` 用于绘制到任何 (x,\
  \ y) 点的线\n- `H` 用于在 x 中绘制水平线\n- `V` 用于在 y 中绘制垂直线\n\n| 命令 | 参数 | 示例 |\n|---|---|---|\n\
  | L 或 l | (x, y) + | L 100 100 |\n| H 或 h | x+ | H 75 |\n| V 或 v | y+ | V -75 |\n\
  \n例如，从点 (10, 10) 到点 (75, 100) 的线将绘制如下：\n\nvar line = paper.path(['M', 10, 10, 'L',\
  \ 75, 100]);\n\n请注意，因为我们使用大写命令 L，线是从点 (0, 0) 绘制的，而不是相对于我们的起点 (10, 10)。如果我们使用小写变体\
  \ l，线将从 (10, 10) 绘制到点 (10 + 75, 10 + 100) = (85, 110)。\n\n通过重复参数，我们可以绘制多边形（就像我们在上一节中使用\
  \ moveto 时一样，只不过 lineto 可以从任何当前点指定，而不仅仅是 moveto 点）。例如，从点 (200, 15) 开始的边长为 100 的正六边形可以绘制如下：\n\
  \nvar sideLength = 100;\nvar x = sideLength * Math.cos(Raphael.rad(60));\nvar y\
  \ = sideLength * Math.sin(Raphael.rad(60));\n\nvar hexagon = paper.path(\n['M',\
  \ 250, 15,\n'l', sideLength, 0,\nx, y,\n-x, y,\n-sideLength, 0,\n-x, -y,\nx, -y,\n\
  x\n]);\n\n我们利用六边形的外角为 60 度（如下图所示）的事实，结合三角函数 sin 和 cos 来计算我们想要绘制到的点的 x 和 y 坐标。从点\
  \ (250, 15) 开始，我们绘制一条在 x 方向相对 250 像素、y 方向 0 像素的线；然后我们绘制一条相对于该点在 x 方向 x 像素、y 方向 y\
  \ 像素的线。由于六边形是正六边形，对于 y 大于零的边（除顶边和底边外），相对 x 和 y 点的大小相等，因此我们能够以 x 和 y 的倍数绘制回起点。\n\n\
  ![](img/d8ec653db4cab13fec8b3f5718174af6_47_0.png)\n\n请注意，在 JavaScript 中，三角函数期望传入以弧度为单位的角度值，因此我们使用\
  \ `Raphael` 对象上的 `rad` 实用方法将 60 度转换为弧度。\n\n## closepath 命令\n\n**closepath** 命令从当前点绘制一条直线到当前子路径的起点。在六边形示例中，尽管我们绘制回了起点，但路径的起点和终点并未连接。当对路径应用较大的\
  \ `stroke-width` 值时，效果很明显，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_47_1.png)\n\
  \n## 绘制路径\n\nclosepath 命令字符是 z，不接受任何参数。由于在前一个示例中我们绘制了一条直线回到终点，我们可以改用 closepath 命令关闭路径，如下所示：\n\
  \n```\nvar hexagon = paper.path(\n ['M', 250, 15,\n 'l', sideLength, 0,\n x, y,\n\
  \ -x, y,\n -sideLength, 0,\n -x, -y,\n 'z' // 代替绘制到 (x, -y) 的线\n ]\n);\n```\n\n\
  在这种情况下，路径的起点和终点已连接。请注意，closepath 命令可以是大写或小写，但这对其行为没有影响。\n\n## 绘制曲线\n\n有三种类型的曲线路径：二次贝塞尔曲线、三次贝塞尔曲线和弧线。贝塞尔曲线是定义在起点和终点之间的曲线，但其方向可以通过使用控制点来确定，而弧线是椭圆周长的一部分。\n\
  \n## 二次贝塞尔曲线\n\n二次贝塞尔曲线是两点之间具有一个控制点的曲线。要理解二次贝塞尔曲线的绘制方式，您应该尝试 http://www.jasondavies.com/animated-bezier/\
  \ 上的动画演示。如图所示，曲线从点 P0 绘制到点 P2，并带有控制点 P1。控制点 P1 相对于 P0 和 P2 决定了曲线弯曲的程度：从开始到结束，曲线最初朝向控制点\
  \ P1 的方向，然后从 P1 的方向弯曲到终点 P2。\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_48_0.png)\n\
  \nwww.it-ebooks.info\n\n\n\n\n\n有两个二次贝塞尔曲线命令，其语法如下：\n\n| 命令 | 参数 | 示例 |\n|---------|------------|---------|\n\
  | Q 或 q | (x1, y1, x, y)+ | Q 100 50 200 250 |\n| T 或 t | (x y)+ | T 400 250 |\n\
  \nq 命令（或用于相对点的 q）描述从路径上的当前点到点 (x, y) 并使用 (x1, y1) 作为控制点绘制的曲线。例如，请考虑以下代码：\n\n```\n\
  paper.path(['M', 50, 150, 'Q', 225, 20, 400, 150]);\n```\n\n这将绘制所示的二次贝塞尔曲线。使用命令小写形式的等效路径为\
  \ \"M 50,150 q 175,-130 350,0\"，其中 (x, y) 和 (x1, y1) 参数是相对于起点 (50, 100) 的相对距离：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_49_0.png)\n\n移动控制点会影响路径的绘制方式。例如，路径 \"\
  M 50, 150 Q 100,40 400,150\" 显示为：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_49_1.png)\n\
  \n## 绘制路径\n\n与我们迄今遇到的其他命令一样，参数可以重复，这使我们可以绘制多个连接的二次贝塞尔曲线。请考虑以下代码：\n\n```\npaper.path([\n\
  \t'M', 50, 150\n\t'Q', 225, 20, 400, 150,\n\t575, 20, 750, 150\n]);\n```\n\n这将从\
  \ (400, 150) 绘制第二条曲线到点 (750, 150)，控制点位于 (575, 20)：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_50_0.png)\n\
  \n`T` 或 `t` 命令是一种简写，不指定控制点坐标。相反，控制点自动确定为前一个控制点的反射。请考虑以下代码绘制的路径：\n\n```\npaper.path([\n\
  \t'M', 50, 150,\n\t'Q', 225, 20, 400, 150,\n\t'T', 750, 150\n]);\n```\n\n这将创建如下截图所示的两条曲线。由\
  \ `T` 绘制的路径起点处的当前点为 (400, 150)。相对于此点，前一个控制点 (225, 20) 的反射为 (575, 280)：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_51_0.png)\n\
  \n## 三次贝塞尔曲线\n\n绘制三次贝塞尔曲线的原理与二次贝塞尔曲线类似，只是三次贝塞尔曲线有两个控制点。同样，为了理解三次贝塞尔曲线的绘制方式，您应该查看\
  \ http://www.jasondavies.com/animated-bezier/ 上的动画演示。三次贝塞尔曲线的路径（在截图中以红色突出显示）从 P0\
  \ 开始，朝 P1 方向前进，然后从 P2 方向到达终点 P3：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_51_1.png)\n\
  \n有两个三次贝塞尔曲线命令，其语法如下表所示：\n\n| 命令 | 参数 | 示例 |\n|---|---|---|\n| C 或 c | (x1, y1,\
  \ x2, y2, x, y)+ | C 150 25 350 50 500 300 |\n| S 或 s | (x2, y2, x y)+ | t 200 -100\
  \ 200 50 |\n\n## 绘制路径\n\nc 命令要求我们指定两个控制点。以下代码的效果是从点 (200, 20) 绘制一条曲线到 (200, 120)，经过控制点\
  \ (400, 140) 和 (400, 180)。请注意，我们还关闭了路径并应用了 fill 属性：\n\n```\npaper.path([\n\t'M',\
  \ 200, 20,\n\t'C', 400, 140, 400, 180, 200, 120,\n\t'z'\n]).attr({fill: '#222'});\n\
  ```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_52_0.png)\n\ns 命令与 T\
  \ 命令类似，会自动创建关于当前点反射的控制点。它实际做的是将第二个控制点关于当前点反射，这成为我们新子路径的第一个控制点，我们现在需要为其指定第二个控制点。此处给出的代码通过使用\
  \ s 命令绘制子路径来扩展前面的示例：\n\n```\npaper.path([\n\t'M', 200, 20,\n\t'C', 400, 140, 400,\
  \ 180, 200, 120,\n\t'S', 0, 100, 200, 220,\n\t'z'\n]);\n```\n\ns 路径从当前点 (200, 120)\
  \ 开始，在 (200, 220) 结束，如所示。我们第一条曲线的第二个控制点定义在 (400, 180)，它关于当前点反射，从而创建一个位于 (0, 60)\
  \ 的控制点。然后我们指定了一个位于 (0, 100) 的第二个控制点：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_53_0.png)\n\
  \n使用贝塞尔曲线最困难的地方在于决定在哪里定义控制点。通常通过以下方法之一来解决：\n\n- 试错法\n- 数学计算\n- 使用 Inkscape 等图形包来辅助绘制\n\
  \n## 绘制弧线\n\n绘制弧线的语法是所有绘制命令中最复杂的。这是因为当我们从一个点绘制弧线到另一个点时，有四种可能的弧线路径可供选择，如下所示——有两个椭圆，其圆周上可以位于起点和终点。前两个弧线称为**次要**弧线，而后两个弧线称为**主要**弧线。生成的弧线也受从起点到终点的角度方向的影响：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_53_1.png)\n\n绘制弧线的语法如下表所示：\n\n| 命令 |\
  \ 参数 | 示例 |\n|---|---|---|\n| A 或 a | (rx, ry, x-rotation, large-arc-flag, sweep-flag,\
  \ x, y)+ | a 25 50 0 1 0 100 200 |\n\n下表描述了各个参数：\n\n| 参数 | 描述 |\n|---|---|\n| rx\
  \ 和 ry | 由于弧线是椭圆的一部分，它在 x 和 y 方向上都有半径 |\n| x-rotation | 绘制弧线的椭圆的逆时针旋转（以度为单位的值） |\n\
  | large-arc-flag | 我们的弧线是作为主要（1）还是次要（0）弧线绘制 |\n| sweep-flag | 弧线是以正（1）即顺时针，还是负（0）即逆时针的角度方向绘制\
  \ |\n| x 和 y | 我们弧线的终点 |\n\n这些参数或许最好通过示例来说明。请考虑绘制 sweep-flag 等于 1 的主要弧线路径：\n\n```\n\
  paper.path([\n\t'M', 50, 60,\n\t'a', 150, 80, 0, 1, 1, 0, 80\n]);\n```\n\n我们首先移动到当前点\
  \ (50, 60)，然后绘制一个 x 半径为 150、y 半径为 80 的弧线。我们将 x-rotation 值设置为 0，并通过将 large-arc-flag\
  \ 设置为 1 来识别我们正在绘制大弧线。sweep-flag 值等于 1，我们使用小写形式，即 A 命令的相对变体，这意味着我们的最终 x 和 y 参数 (0,\
  \ 80) 是相对于起点的单位，即：x 方向额外 0 像素，y 方向额外 60 像素，从而得到终点坐标 (50, 140)。生成的弧线如下所示。\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_55_0.png)\n\
  \n如果我们指定 `large-arc-flag` 值等于 0，则通过 (50, 60) 和 (50, 140) 的椭圆的次要弧线将如下绘制：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_55_1.png)\n\
  \n如果我们指定 `sweep-flag` 等于 0，例如，对于由 `M 350,60 a 150,80 0 1 0 0,80` 描述的路径（在主要弧线的情况下）或\
  \ `M 350,60 a 150,80 0 0 0 0,80`（在次要弧线的情况下），弧线将以逆时针方向绘制。\n\n以下图像描述了以逆时针方向绘制的主要弧线（`large-arc-flag\
  \ = 1`）：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_55_2.png)\n\n以下图表描述了以逆时针方向绘制的次要弧线（large-arc-flag\
  \ = 0）：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_56_0.png)\n\n## 用于处理路径的实用方法\n\
  \nRaphaël 提供了一些方便的实用方法来处理路径。我们将通过示例演示这些方法。\n\n## Element.getTotalLength()\n\n通过组合一个主要弧线和一个三次贝塞尔曲线，我们可以按以下方式绘制一个保龄球瓶形状：\n\
  \n```\nvar pin = paper.path({\n 'M', 130, 350,\n 'A', 100, 180, 0, 1, 0, 210, 350,\n\
  \ 'C', 290, 100, 50, 100, 130, 350,\n 'z'\n});\n```\n\n此路径从 (130, 350) 开始，弧线到 (210,\
  \ 350)，然后使用贝塞尔控制点 (290,100) 和 (50, 100) 曲线返回起点。我们使用 getTotalLength 方法获取路径的总长度。我们检索此值，然后在画布上以两位小数显示它，如下所示：\n\
  \n```\nvar totalLength = pin.getTotalLength();\npaper.text(\n 180, 50,\n \"Total\
  \ Length: \" + totalLength.toPrecision(2)\n);\n```\n\n\n\n\n\n## Element.getPointAtLength(length)\n\
  \n我们可以使用 getPointAtLength 方法获取路径上任意一点的 _x_ 和 _y_ 坐标。该方法返回一个带有 _x_ 和 _y_ 属性的对象。沿用上一节中的保龄球瓶示例，我们在路径总长度的八分之一和二分之一处绘制两个圆点，如下所示：\n\
  \n```\nvar totalLength = pin.getTotalLength();\np1 = pin.getPointAtLength(totalLength\
  \ / 8);\np2 = pin.getPointAtLength(totalLength / 2);\npaper.circle(p1.x, p1.y, 10);\n\
  paper.circle(p2.x, p2.y, 10);\n```\n\ngetPointAtLength 返回的对象的另一个属性是 alpha 属性。它返回相对于\
  \ x 轴的正角度，由指定点处的梯度或导数线所张成，如图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_57_0.png)\n\
  \n了解某点处的导数很有用，因为它告诉我们在该特定点处弧在 _x_ 和 _y_ 方向上变化的程度。\n\n## Element.getSubpath(from,\
  \ to)\n\n给定一个路径元素，`getSubpath` 方法计算其路径中一段子路径的路径字符串。给定路径上的两个点，它返回描述原始路径中仅这两个点之间的路径字符串。考虑点\
  \ (100, 100) 和 (300, 100) 之间的三次贝塞尔曲线，其锚点位于 (100, 200) 和 (300, 0)：\n\n```\nvar path\
  \ = paper.path([\n\t'M', 100, 100, 'c', 0, 100, 200, -100, 200, 0\n]);\npath.attr('stroke-width',\
  \ 5);\n```\n\n我们检索从路径长度四分之一处到总长度一半处的子路径，如下所示：\n\n```\nvar totalLength = path.getTotalLength();\n\
  var subPath = path.getSubpath(\n\ttotalLength / 4, totalLength / 2\n);\n```\n\n\
  `getSubpath` 方法返回一个可重复使用的路径字符串。例如：\n`paper.path(subPath).attr('stroke-width', 15);`\n\
  \n这段代码绘制了原始路径的一段更短、更粗的部分，如图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_58_0.png)\n\
  \n> `Raphael` 对象上还有许多其他实用方法，在转换和动画的上下文中处理贝塞尔曲线时特别有用。我们将在本书剩余部分更详细地介绍其中一些方法。\n\n\
  ## Catmull-Rom 曲线\n\n在需要绘制通过一组指定点的曲线的情况下，Catmull-Rom 曲线通常很合适。Catmull-Rom 曲线常用于图表（即数据绘图）和游戏（例如，沿预定义轨迹移动角色）。\n\
  \nRaphaël 提供了一个路径命令来方便地绘制 Catmull-Rom 曲线。绘制 Catmull-Rom 曲线的语法如下：\n\n| 命令 | 参数 |\
  \ 示例 |\n|---------|------------|---------|\n| R 或 r | x1,y1 (xi, yi)+ | a 25 50\
  \ 0 1 0 100 200 |\n\n点 (x1, y1) 是曲线应经过的第二个点，而 (xi, yi) 点是每个后续点。第一个点应始终是我们的当前点，曲线从该点开始。\n\
  \n为了说明 Catmull-Rom 曲线，请考虑存储在数组中的以下数据点：\n\n```\nvar data = [\n\t{x: 50, y: 250},\t\
  \t{x: 100, y: 100},\t\t{x: 150, y: 150},\n\t{x: 200, y: 140},\t\t{x: 250, y: 250},\t\
  \t{x: 300, y: 200},\n\t{x: 350, y: 180},\t\t{x: 400, y: 230}\n];\n```\n\n要绘制这些数据点，我们遍历数组并在每个\
  \ x 和 y 位置绘制一个圆（请注意，点被分组到一个集合中，这使得向它们应用属性更加容易）：\n\n```\nvar plottedPoints = paper.set();\n\
  for(var i = 0, num = data.length; i < num; i+=1) {\n\tvar point = data[i];\n\tplottedPoints.push(paper.circle(point.x,\
  \ point.y, 5));\n};\nplottedPoints.attr({fill: '#09c', 'stroke-width':0});\n```\n\
  \n在构建路径字符串或路径数组时，我们使用 M 命令将第一个数据点设为当前点，并追加 R 命令以开始绘制 Catmull-Rom 曲线：\n\n```\nvar\
  \ path = ['M', data[0].x, data[0].y];\npath.push('R');\n```\n\n然后我们遍历所有剩余点（除第一个点外的所有点），并将它们的值追加到路径数组中：\n\
  \n```javascript\nfor(var i = 1, num = data.length; i < num; i+=1) {\n  path.push(data[i].x);\n\
  \  path.push(data[i].y);\n}\nvar curve = paper.path( path );\n```\n\n使用 `path` 命令绘制的结果曲线如图所示：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_60_0.png)\n\n## 摘要\n\n我们现在已经介绍了 Raphaël\
  \ 中的所有主要绘图方法，您应该熟悉用于绘制路径的语法。此时，尝试我们介绍过的路径命令和实用方法来创建您自己的独特图形绝对值得一试。\n\n我们现在准备好开始研究与绘图进行交互和操作了。到目前为止，我们创建的图形只绘制一次且不会改变。在下一章中，我们将研究响应用户触发的事件以及转换我们创建的元素。\n"
- "# 4 转换和事件处理\n\n在花费了前两章绘制静态图形之后，我们现在将开始研究如何转换它们以及如何在浏览器中与它们进行交互。\n\n当您在 Raphaël\
  \ 中创建一个元素时，您实际上是在创建一个 **文档对象模型 (DOM)** 对象。与您已经熟悉的 DOM 对象一样，绘制在画布上的元素在用户与之交互时会触发事件。Raphaël\
  \ 提供了一些方便的跨浏览器方法来与元素进行交互，还提供了便于拖放功能的方法。\n\n转换同样灵活：Raphaël 允许我们使用 **转换字符串** 的概念轻松地转换（平移、缩放和旋转）元素。\n\
  \n在本章中，我们将同时研究事件处理和转换，结合库的这两个方面来产生交互式图形。总体而言，我们将涵盖：\n\n- transform 方法和基本转换\n- 矩阵转换\n\
  - 注册和注销基本事件处理程序\n- 实现拖放功能\n\n## 基本转换和事件处理\n\n我们在 Raphaël 中使用元素上的 `transform` 方法执行转换，该方法接受一个转换字符串作为参数。转换字符串定义要在特定元素上执行的一系列转换。\n\
  \n您也可以使用 `transform` 属性转换元素和集合。当我们同时更改多个属性时，这通常很方便。您将在第 5 章 矢量动画 中看到此示例。\n\n###\
  \ 基本转换\n\n与路径字符串一样，转换字符串由许多命令组成，按其应被解释的顺序排列。基本命令的语法如下，其中括号表示可选参数：\n\n| 命令 | 参数 |\
  \ 示例 |\n|---------|------------|---------|\n| T 或 t | x, y | t 50,100 |\n| R 或 r\
  \ | 顺时针旋转角度，(旋转点_x_, 旋转点_y_) | R 45,0,0 |\n| S 或 s | scale_x, scale_y, (缩放点_x_,\
  \ 缩放点_y_) 或 scale_factor, (缩放点_x_, 缩放点_y_) | S 2,4.5,75,125 |\n\n与路径字符串一样，转换字符串有大写和小写变体。大写变体意味着无论之前的转换如何，我们都会进行转换，而小写变体会考虑之前的转换。以下示例演示了基本转换。\n\
  \n## 平移\n\n首先，考虑绘制一个三角形并使用 `clone` 方法创建其副本：\n\n```\nvar triangle = paper.path(\"\
  M 150 20 1 100 160 1 -200 0 z\").attr({\n 'stroke-dasharray': '- ',\n 'stroke-width':\
  \ 5\n});\n```\n\n```\nvar triangleCopy = triangle.clone(); // 克隆我们的对象\ntriangleCopy.attr({\n\
  \ 'stroke-dasharray': ''\n});\n```\n\n克隆后，复制的三角形具有与原始三角形相同的所有属性，因此我们取消设置 `stroke-dasharray`\
  \ 以使其具有实心轮廓。然后我们在 x 轴上执行 300px 的平移，在 y 轴上执行 0px 的平移，如下所示：\n\n```\ntriangleCopy.transform(\"\
  T 300 0\");\n```\n\n这会将我们克隆的三角形在 `x` 方向上移动，如下图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_63_0.png)\n\
  \n请注意，虽然 `clone` 方法很方便，但已知在克隆多个元素时会对性能产生不利影响。在克隆多个元素时，建议使用原始路径创建新元素。\n\n## 旋转\n\n\
  现在创建另一个克隆的三角形，并使用以下转换字符串对其进行转换，这会使三角形在 x 轴上平移 350px，在 y 轴上平移 -35px 后，绕其中心点（当我们不指定旋转点时的默认值）顺时针旋转\
  \ 45 度。\n\n```\ntriangleCopy.transform(\"t 350 -35 r 45\");\n```\n\n\n\n\n\n\n##\
  \ 转换与事件处理\n\n在此，我们已合并命令。在此示例中，转换是相互独立的，这意味着每个命令的大小写无关紧要。但是，请考虑绕点旋转：\n\n```\ntriangleCopy.transform(\"\
  t 100 0 r 180 220 100\");\n```\n\n此转换首先将我们的三角形在 _x_ 方向上平移 100px，然后顺时针旋转 180 度。我们的旋转点\
  \ (220, 100) 并非三角形旋转的点，因为旋转点实际上在 _x_ 方向上平移了 100px 到新点 (320, 100)。此处需要注意的重要点是，**小写转换命令会考虑之前的转换**：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_64_0.png)\n\n在绝对旋转命令 R 的情况下，绕点 (220,\
  \ 100) 的旋转同样发生在平移之后，但结果与下图所示截然不同。转换字符串 `t 100,0 R 180,220,100` 始终绕点 (220, 100) 旋转元素，与之前的转换无关：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_64_1.png)\n\n## 缩放\n\n缩放可以在所有点上均等地关于缩放点进行，也可以在\
  \ x 和 y 方向上按因子进行。t 300 0 s 0.5 转换的缩放将所有点按其原始大小的 0.5 倍关于元素中心点进行缩放，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_65_0.png)\n\
  \n转换字符串 t 310 0 s 1.2 0.5 在 x 和 y 方向上按因子进行缩放，将元素在 x 方向上缩放 1.2 倍，在 y 方向上缩放 0.5 倍，如下所示：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_65_1.png)\n\n## 基本事件处理\n\nRaphaël 支持在元素上注册和注销一整套事件处理程序。我们鼓励您尝试可用的事件处理程序，其中一些我们将通过示例演示。\n\
  \n## 注册基本事件处理程序\n\n我们将演示在 salinon 图形上注册双击、鼠标悬停和鼠标移出事件处理方法。首先，我们可以按以下方式绘制 salinon：\n\
  \n```\nvar salinon = paper.path([\n    'M', 100, 200,\n    'a', 150, 150, 0, 0,\
  \ 1, 300, 0,\n    50, 50, 0, 0, 0, -100, 0,\n    50, 50, 0, 0, 1, -100, 0,\n   \
  \ 50, 50, 0, 0, 0, -100, 0\n]);\n```\n\n然后我们按以下方式定义上述事件处理程序，其中每个程序在元素上创建一个转换：\n\n\
  ```\nsalinon.mouseover(function() {\n    this.transform('R 180');\n});\nsalinon.dblclick(function()\
  \ {\n    this.transform('r 45');\n});\nsalinon.mouseout(function() {\n    this.transform('');\n\
  });\n```\n\n这产生的效果是：\n\n- 当将鼠标移到元素上时，它将旋转 180 度\n- 当双击元素时，它将旋转 45 度\n- 当将鼠标移出元素时，转换将被重置\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_66_0.png)\n\n关于转换的重置，向 transform 方法传递空字符串的效果是将图形返回到其原始位置。\n\
  \n您会发现，运行前面的代码时，45 度旋转是相对于其初始位置执行的，而不是相对于 180 度旋转定义的位置。这是因为 transform 方法的每次调用都相对于元素的原始状态。但是，如果我们想要从元素的当前状态（即前一次\
  \ transform 调用所产生的状态）转换元素，我们可以在转换命令前加上省略号，以追加新的转换。请考虑以下转换：\n\n```\nsalinon.click(function()\
  \ {\n    this.transform('t 300 0 R 180');\n});\nsalinon.dblclick(function() {\n\
  \    this.transform('...t 200 0 r 45');\n});\n```\n\n第一个转换在单击时调用，将元素在 x 方向上平移 300px，并顺时针旋转\
  \ 180 度。第二个转换在双击时调用，其起始命令前加有省略号，将在当前旋转的基础上再平移 200px 并顺时针旋转 45 度。请注意，x 方向上的额外 100px\
  \ 平移是在负 x 方向上，这是因为我们考虑了之前的 180 度旋转。这意味着我们的 salion 现在“面向”相反的方向。\n\n请注意，this 关键字指的是绑定事件处理程序的元素。\n\
  \n## 注销基本事件处理程序\n\n为了注销事件处理程序，Raphaël 为我们提供了方法，其名称是注册事件处理程序的名称加上 \"un-\" 前缀。例如，click\
  \ 事件处理程序使用 unclick 来注销。\n\n注销事件处理程序是您已注册事件处理程序的元素的方法，并将事件处理函数作为参数接受。请考虑一个正方形，在单击时相对于其当前位置顺时针旋转\
  \ 15 度：\n\n```\nvar square = paper.rect(50, 50, 100, 100);\nvar clickHandler = function()\
  \ {\n    this.transform('...r 15');\n};\nsquare.click(clickHandler);\n```\n\n我们在当前作用域中定义了一个事件处理程序\
  \ clickHandler，并将其作为参数传递给 click 方法以注册它。我们按以下方式在正方形上注销 click 事件处理程序：\n\n```\ncircle.dblclick(function()\
  \ {\n    square.unclick(clickHandler);\n}\n```\n\n这产生的效果是，当圆被双击时，clickHandler 不再被调用。\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_67_0.png)\n\n## 使用矩阵\n\n**矩阵**是按行和列排列的元素矩形数组。在引用矩阵大小时，惯例是先指定行数，因此\
  \ 3 行 2 列的矩阵，例如，将是：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_68_0.png)\n\n矩阵中的每个元素可以被视为将某个点映射到另一个点的组件。例如，点\
  \ (_x_, _y_) 可以映射到 (_p_, _q_)，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_68_1.png)\n\
  \n此矩阵定义了 2D 空间中一个点到新 2D 空间点的转换。新 _x_ 点 _p_ 被缩放 2 倍，而新 _y_ 点 _q_ 被缩放 2 倍并按原始 _x_\
  \ 平移（这种效果称为**剪切**）。\n\n## 转换矩阵\n\nRaphaël 中的转换称为**仿射变换**。其思想是将 2D 空间中的每个点视为 3D 空间中的点，这使我们能够使用矩阵表示转换。3D\
  \ 点固定为 1，因此 (_x_, _y_) 点表示为 (_x_, _y_, 1)，即它在第三维上不变。\n\n在此表示法中，由转换产生的点 (_p_, _q_)\
  \ 如下推导：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_68_2.png)\n\n元素 _a_、_b_、_c_、_d_、_e_\
  \ 和 _f_ 根据赋予它们的值表示各种转换。\n\n## 使用转换矩阵\n\n创建转换时，您可以使用语法 `\"M a, b, c, d, e, f\"` 将矩阵参数直接传递给转换字符串。这产生的效果是将转换矩阵应用于元素上的每个点。\n\
  \n## 使用转换矩阵执行剪切\n\n剪切转换的矩阵如下：\n\n```\n⎡a c e⎤   ⎡1   Sx  0⎤\n⎢b d f⎥ = ⎢Sy   1 \
  \ 0⎥\n⎣0 0 1⎦   ⎣0   0   1⎦\n```\n\nSx 和 Sy 分别表示 x 和 y 点被剪切的因子。例如，将转换字符串 \"m 1 0\
  \ 0.5 1 0 0\"（Sx = 0.5, Sy = 0）应用于正方形，其效果是将其在 x 方向上转换为菱形：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_69_0.png)\n\
  \n通常，我们希望相对于 x 轴和 y 轴分别按角度应用剪切。这在 http://raphaeljsvectorgraphics.com/the-graphical-web/css3-raphael-transforms\
  \ 上有演示。为了实现这一点，我们使用以下转换矩阵：\n\n```\n⎡a   c   e⎤   ⎡1   tan(α)   0⎤\n⎢b   d   f⎥ =\
  \ ⎢tan(β)   1   0⎥\n⎣0   0   1⎦   ⎣0   0   1⎦\n```\n\n在此形式中，角度 β 是相对于 x 轴顺时针的剪切角度（产生\
  \ y 方向上的剪切结果），α 是相对于 y 轴逆时针的剪切角度（产生 x 方向上的剪切结果）。请考虑对正方形进行以下转换：\nSquare.transform(\n\
  \t['m', 1, 0, Math.tan(Raphael.rad(25)), 1, 0, 0]\n\t);\n相对于 y 轴应用了 25 度的转换，产生 x\
  \ 方向上的剪切。\n\n\n\n\n\n## 拖放功能\n\n拖放功能是 Raphaël 的一个强大功能。特别是，我们对拖动事件有很好的控制，这使我们能够创建更易用的应用程序。\n\
  \n## Element.drag() 方法\n\n元素的 drag 方法具有以下语法：\n\n```\nElement.drag(\n    onmove,\
  \ onstart, onend, [mcontext], [scontext], [econtext]\n)\n```\n\nonmove、onstart 和\
  \ onend 函数是在拖动元素生命周期中调用的回调函数，而 mcontext、scontext 和 econtext 定义了这些函数作用域中的 this 变量（默认为正在拖动的元素）。\n\
  \n## onstart 事件处理程序\n\n当元素拖动首次启动时，会调用 onstart 事件处理程序。它通常用作初始化程序，用于标记我们正在修改的元素的起始\
  \ x 和 y 点。\n\n## onend 事件处理程序\n\n当元素拖动结束时，会调用 onend 事件处理程序，例如，在将元素从一个点移动到另一个点后释放鼠标时。它通常用于：\n\
  \n- 拖动后重新初始化元素\n- 检查绘图上下文中元素的当前位置\n- 定义拖放后应发生的任何其他操作\n\n## onmove 事件处理程序\n\n每次拖动过程中移动元素时，都会调用\
  \ onmove 事件处理程序。它具有 dx 和 dy 参数，分别描述元素在 x 和 y 方向上拖动的量。\n\n## 拖放示例\n\n例如，考虑拖动一个正方形。我们首先定义元素，并在\
  \ `onstart` 事件处理程序中保留其起始 _x_ 和 _y_ 位置的引用。为了突出显示我们的元素处于“拖动”状态，我们还将其涂成粉色。在我们的 `onend`\
  \ 事件处理程序中，我们将填充重置为黑色，以指示拖动已结束：\n\n```\nvar startX, startY;\nfunction onstart() {\n\
  \    startX = this.attr('x');\n    startY = this.attr('y');\n    this.attr('fill',\
  \ 'pink');\n}\n\nfunction onend() {\n    this.attr('fill', '#000');\n}\n```\n\n\
  我们的 `onmove` 事件处理程序负责根据原始 _x_ 和 _y_ 位置加上 `dx` 和 `dy` 来设置元素的 _x_ 和 _y_ 位置，如下所示：\n\
  \n```\nfunction onmove(dx, dy) {\n    this.attr({\n        x: startX + dx,\n   \
  \     y: startY + dy\n    });\n}\n```\n\n最后，我们在元素上调用 drag，传入各个事件处理程序：\n\n```\nsquare.drag(onmove,\
  \ onstart, onend);\n```\n\n生成的变换在本章附带的示例代码中演示。\n\n> 请注意，`dx` 和 `dy` 在数学中通常用于指代 _x_\
  \ 和 _y_ 的微小变化。每次调用 `onmove` 事件处理程序时，其 `dx` 和 `dy` 参数将具有表示每个方向微小变化的值。\n\n## 放置元素\n\
  \n在拖动元素结束时，我们可以执行检查，以查看它相对于其他元素的位置。**放置**本质上是检查我们的元素是否落在某个特定边界内。\n\n## 边界框重叠\n\n\
  每个元素都有一个边界框，它定义了包含元素所有点的最小矩形区域。通过检查两个边界框是否重叠，我们可以确定元素是否被“放置”到了另一个元素上。\n\n考虑与我们的正方形一起定义一个目标矩形：\n\
  \n```\nvar target = paper.rect(400, 100, 200, 200);\nvar square = paper.rect(100,\
  \ 100, 100, 100);\n```\n\n我们的 `onstart` 和 `onmove` 事件处理程序按上一节中的示例定义，分别负责初始化和移动。\n\
  \n这次，在我们的 `onend` 事件处理程序中，我们使用 `getBBox` 方法获取正方形和目标元素的边界框，然后使用 `isBBoxIntersect`\
  \ 检查元素是否重叠：\n\n```\nfunction onend() {\n    var bbox = this.getBBox(),\n       \
  \ targetBBox = target.getBBox();\n\n    if(Raphael.isBBoxIntersect(bbox, targetBBox))\
  \ {\n        this.undrag();\n        this.attr({\n            x: 450,\n        \
  \    y: 150\n        });\n    }\n}\n```\n\n当元素重叠时，我们通过调用 `undrag` 并将其 `x` 和 `y`\
  \ 位置设置为落在目标边界框内的某些任意值，来删除元素上的所有 `drag` 事件处理程序。\n\n## 边界框在边界框内\n\n虽然 `isBBoxIntersect`\
  \ 方法很方便，但我们有时需要知道元素上的所有点是否在另一个元素内。回到前面的示例，我们可以使用 `isPointInsideBBox` 方法检查正方形边界框的左上角顶点和右下角顶点是否落在目标边界框内，如下所示：\n\
  \n```javascript\nfunction onend() {\n    var targetBBox = target.getBBox();\n  \
  \  var topLeftVertex = {\n        x: this.attr('x'),\n        y: this.attr('y')\n\
  \    };\n    var bottomRightVertex = {\n        x: this.attr('x') + this.attr('width'),\n\
  \        y: this.attr('y') + this.attr('height')\n    };\n\n    var point1InsideBox\
  \ = Raphael.isPointInsideBBox(\n        targetBBox, topLeftVertex.x, topLeftVertex.y\n\
  \    );\n    var point2InsideBox = Raphael.isPointInsideBBox(\n        targetBBox,\
  \ bottomRightVertex.x, bottomRightVertex.y\n    );\n    if(point1InsideBox && point2InsideBox)\
  \ {\n        this.undrag();\n        this.attr({ x: 450, y: 150 });\n    }\n}\n\
  ```\n\n正方形的左上角顶点由其 x 和 y 属性定义，而右下角顶点由 (x, y) 点加上元素的宽度和高度描述。只有当两个点都位于目标边界框内时，我们才会取消初始化\
  \ `drag` 事件处理。\n\n这种方法对于其整体形状由矩形边界框准确定义的目标元素效果很好。在那些形状不太适合由矩形边界框定义的情况下，会寻求更合适的数学方法。\n\
  \n## 摘要\n\n在本章中，我们涵盖了与事件处理和变换相关的大量内容。您应该熟悉我们能够与绘图交互并随意转换它们的一些方法。\n\n我们现在处于绝佳的位置，可以通过动画让我们的绘图真正“活”起来，并将在下一章中这样做。\n"
- "## 矢量动画\n\n到目前为止，我们已经研究了绘制静态图形以及即时与之交互和转换它们。动画使我们能够随时间改变图形，也就是说，我们可以在非零时间间隔内修改矢量图形的属性。\n\
  \n在 2000 年代初期 JavaScript 框架出现之前，动画主要由 Flash 实现，以及在较小程度上由 Java 小程序实现。随着这些框架的出现，DOM\
  \ 的动画带来了更流畅、更直观的用户界面和更具语义的网站。在近年来，HTML5、CSS3、WebGL 和 SVG 使开发人员能够创建更复杂、功能齐全的动画和交互式用户界面。\n\
  \nRaphaël 使矢量图形动画变得简单，在本章中，我们将探讨使用该库为图形制作动画的不同方式。我们将特别涵盖以下主题：\n\n- Animating 方法和基本属性动画\n\
  - 动画路径\n- 使用三次贝塞尔语法进行缓动\n- 动画变换\n- 使用自定义属性进行动画以及沿路径动画\n\n## 基本动画\n\n动画是使用元素的 `animate`\
  \ 方法完成的。该方法按定义顺序接受以下参数：\n\n| 参数 | 类型 | 描述 |\n|---|---|---|\n| attributes | Object\
  \ | 按照 `Element` 的 `attr()` 方法的键值对属性 |\n| duration | Number | 动画持续的毫秒数 |\n| easing（可选）\
  \ | String | 描述属性随时间变化率的字符串 |\n| callback（可选） | Function | 在动画结束时执行的函数 |\n\n为了演示动画，请考虑一个圆，其中心点在\
  \ (100, 100)，半径为 50px：\n\n```\nvar circle = paper.circle(100, 100, 50).attr({fill:\
  \ 'green'});\n```\n\n我们可以将圆动画到点 (500, 100) 并将半径减小到 15px，如下所示：\n\n```\ncircle.animate({\n\
  \ cx: 500,\n r: 15\n }, 1000);\n```\n\n圆在一秒钟内动画，其初始状态和最终状态如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_76_0.png)\n\
  \n> 要真正欣赏本章中给出的示例，您应该参考本书附带的源代码演示或网站。\n\n\n\n\n\n同样，位于 (100, 50) 的矩形在 x 和 y 方向上被动画化到点\
  \ (400, 100)，同时宽度增加，不透明度降低，描边宽度增大，如下所示：\n\n```javascript\nvar rectangle = paper.rect(100,\
  \ 50, 20, 50).attr({\n    fill: '#345'\n});\nrectangle.animate({\n    opacity: 0.6,\n\
  \    x: 400,\n    y: 100,\n    width: 100,\n    'stroke-width': 10\n}, 1000);\n\
  ```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_77_0.png)\n\n## 动画路径\n\
  \n元素的 `path` 属性允许我们像在上一节中动画化属性一样动画化路径。虽然基本形状具有内在的 `x` 和 `y` 或 `cx` 和 `cy` 属性以及宽度和高度，但路径没有，因此我们将从一个路径动画化到另一个自定义路径。\n\
  \n考虑绘制一个五角星，如下所示：\n\n```javascript\nvar star = paper.path(\n    'M 100,40 40,210\
  \ 190,90 10,90 160,210 z'\n);\n```\n\n## 矢量动画\n\n五角星是一个线条相互重叠的多边形。当将五角星动画化为阿贝洛斯形状时，这会产生一个有趣的效果。为了演示这一点，我们定义一个正方形，当点击时初始化一个路径动画，如下所示：\n\
  \n```javascript\nvar square = paper.rect(500, 100, 50, 50).attr({\n    'fill': '#09c',\
  \ cursor: 'pointer'\n});\nsquare.click(function() {\n    star.animate({\n      \
  \  path: [\n            'M', 100, 180,\n            'a', 140, 140, 0, 0, 1, 280,\
  \ 0,\n            90, 90, 0, 0, 0, -180, 0,\n            50, 50, 0, 0, 0, -100,\
  \ 0\n        ]\n    }, 1000);\n});\n```\n\n运行此代码时，您将看到三角形被平滑地转换为阿贝洛斯形状，如下所示：\n\n\
  ![](img/d8ec653db4cab13fec8b3f5718174af6_78_0.png)\n\nRaphaël 网站上有一个非常好的路径动画示例，网址为\
  \ http://raphaeljs.com/chart.html。该示例演示了在切换月份时的三次贝塞尔曲线动画。我们可以使用在第 3 章“绘制路径”中遇到的\
  \ Catmull-Rom 曲线来实现类似的效果。我们首先定义初始和结束的 Catmull-Rom 路径，并将第一个绘制到画布上：\n\n```javascript\n\
  var pathStart = [\n    'M', 50, 250,\n    'R', 100, 100, 150, 150, 200, 140, 250,\
  \ 200, 300, 80,\n    350, 130, 400, 250,\n    'H', 50,\n    'z'\n];\nvar pathEnd\
  \ = [\n    'M', 50, 250,\n    'R', 100, 130, 150, 220, 200, 200, 250, 100, 300,\
  \ 200,\n    350, 180, 400, 250,\n    'H', 50,\n    'z'\n];\nvar curve = paper.path(pathStart).attr({\n\
  \    'stroke-width': 0,\n    'stroke-linejoin': 'round',\n    'fill': 'green'\n\
  });\n```\n\n您会注意到我们在每个路径的起点处连接了一条直线。这是因为简单地闭合 Catmull-Rom 曲线将继续沿着路径的曲率，而不会给我们一条直线。点击正方形时，我们将曲线动画化到结束路径，如下所示：\n\
  \n```javascript\nsquare.click(function() {\n    curve.animate({\n        path: pathEnd\n\
  \    }, 500);\n});\n```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_79_0.png)\n\
  \n## 动画缓动\n\n**缓动**描述了属性值随时间变化的方式。默认情况下，属性值在动画过程中均匀变化——即 _线性_ 变化——但通过指定特定的缓动类型，我们可以改变属性的动画方式。请参考下图，该图演示了三种可用的缓动类型：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_80_0.png)\n\n对于每种缓动类型，属性值的变化率在时间轴上的图表中有所不同。每种缓动类型可以描述如下：\n\
  \n- **线性**：值在动画过程中从起始值一致地变化到结束值\n- **缓出**：值快速增加到其终点，然后在动画结束前减速\n- **缓入缓出**：值起初缓慢减少，然后快速增加，最后在动画结束前减速到其终点\n\
  \n## 内置缓动公式\n\nRaphaël 拥有多种内置缓动类型，包括上一节中详细介绍的那些，以及诸如 'elastic' 或 'bounce' 等其他类型。每种效果在\
  \ http://raphaeljs.com/easing.html 上都有很好的演示，其中圆形的 cx 和不透明度使用不同的缓动类型进行动画化。例如，考虑将\
  \ 'bounce' 缓动类型应用于我们的 Catmull-Rom 路径动画曲线：\n\n```javascript\nsquare.click(function()\
  \ {\n    curve.animate({\n        path: pathEnd\n    }, 500, 'bounce');\n});\n```\n\
  \n在此示例中，属性值为 `path`，它快速动画化到其终点，然后再返回，直到最终停止。路径随时间的变化如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_81_0.png)\n\
  \n## 使用三次贝塞尔格式自定义缓动\n\nCSS3 过渡中描述动画缓动的格式可以用于在 Raphaël 中定义自定义缓动路径。语法为 `cubic-bezier(point1_x,\
  \ point1_y, point2_x, point2_y)`，其中每个参数定义描述从 (0, 0) 到 (1,1) 的三次贝塞尔曲线的锚点的 _x_ 和 _y_\
  \ 位置，用于属性值和时间。请考虑描述一个属性值非常急剧增加，然后几乎停止，最后缓入到其终点的缓动路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_81_1.png)\n\
  \n描述此路径的 CSS3 语法为 `cubic-bezier(0.1, 0.97, 0.08, 0.03)`。这是使用 `http://www.roblaplaca.com/examples/bezierBuilder/`\
  \ 上的一个有用工具生成的，该工具允许您直观地构建自定义缓动路径并获得生成的缓动的 `cubic-bezier` 值。\n\n例如，考虑两个圆形，其中一个使用此缓动在\
  \ `cx` 中动画化，而另一个具有线性缓动：\n\n```javascript\ncircle.animate({\n    cx: 450\n}, 1000,\
  \ \"cubic-bezier(0.10,0.97,0.08,0.03)\");\ncircle2.animate({\n    cx: 450\n}, 1000,\
  \ 'linear');\n```\n\n运行此代码时，您将看到第一个圆形启动速度比第二个快得多，但到动画结束时，两个圆形的 `cx` 值均大致呈线性变化。\n\
  \n## 动画变换\n\n与路径一样，元素的变换是元素上的一个属性，因此我们可以以同样的方式进行动画化。例如，考虑一个我们可以在点击时旋转的正方形：\n\n```javascript\n\
  square.click(function() {\n    this.animate({\n        transform: '...r 45'\n  \
  \  }, 300);\n});\n```\n\n省略号确保每次连续点击都会使正方形从当前位置顺时针旋转 45 度。\n\n同样，我们可以动画化更复杂的变换。例如，考虑依次对正方形进行\
  \ x 方向 5 度的剪切：\n\n```javascript\nvar anim = Raphael.animation({\n    transform:\
  \ [\n        '...', 'M', 1, 0, Math.tan(Raphael.rad(5)), 1, 0, 0\n    ]\n}, 300);\n\
  square.click(function() {\n    this.animate(anim);\n});\n```\n\n连续点击正方形会产生相对于 y\
  \ 轴额外五度的剪切。您会注意到，在此示例中，我们定义了一个 `animation` 对象，然后在点击正方形时将其传递给正方形的 `animate` 方法。这是定义动画的另一种方法，很有用，因为我们可以重复使用它们。\n\
  \n## 使用自定义属性进行动画\n\nRaphaël 通过 **自定义属性** 促进高级动画。自定义属性可用于基于自定义逻辑对特定元素应用或动画化多个属性。\n\
  \n## 自定义属性\n\n自定义属性是一个自定义函数，返回一组要应用于元素的属性。它可以被视为一个辅助函数，其中现有属性基于计算得出。自定义属性定义为 `customAttributes`\
  \ 命名空间的一个属性，如下所示：\n\n```javascript\nPaper.customAttributes.yourAttribute = function(a1,\
  \ a2, ...){ };\n```\n\n这里，`a1`、`a2` 等参数是数字，`yourAttribute` 是自定义属性的名称。然后，自定义属性可以像我们迄今使用的其他元素属性一样使用。\n\
  \n例如，假设我们需要使用以下方式表示人口数据：\n\n- 圆的半径表示相对人口规模\n- 圆的颜色表示国家的人口密度\n\n以下数据表示五个国家的相对人口和人口密度：\n\
  \n| 国家 | 人口（0 到 1 之间归一化） | 人口密度（0 到 1 之间归一化） |\n|---------|-----------------------------------------|-------------------------------------------------|\n\
  | 台湾 | 0.10 | 1.00 |\n| 韩国 | 0.32 | 0.50 |\n| 荷兰 | 0.05 | 0.22 |\n| 比利时 | 0.00 |\
  \ 0.07 |\n| 日本 | 1.00 | 0.00 |\n\n\n\n\n\n## 矢量动画\n\n我们定义了一个自定义属性 `popDensity`，用于根据上述规则对数据进行可视化表示：\n\
  \n```javascript\npaper.customAttributes.popDensity = function(population, density)\
  \ {\n    var radius = 25 + (25 * population),\n        fillColor = 'hsb(0,0,' +\
  \ (1 - density) + ')'; \n    return {\n        fill: fillColor,\n        r: radius\n\
  \    };\n};\n```\n\n此方法定义了一个半径，其值为 25px 加上 25 乘以国家的相对人口数，这意味着人口最多的国家半径为 50px，人口最少的国家半径为\
  \ 25px，而所有其他国家的半径介于这两个值之间。填充颜色由亮度比例决定，其中色相和饱和度固定。公式 (1 – density) 对于人口密度最低的国家将返回值\
  \ 1（饱和度呈现白色），对于人口密度最高的国家将返回值 0（饱和度呈现黑色）。0 到 1 之间的所有饱和度值都会产生灰色调。\n\n鉴于我们将数据集定义为对象数组，如下所示：\n\
  \n```javascript\nvar data = [\n    {\n        name: 'Taiwan',\n        population:\
  \ 0.1,\n        density: 1\n    },\n    {\n        name: 'South Korea',\n      \
  \  population: 0.32,\n        density: 0.5\n    },\n    // ...\n];\n```\n\n我们可以遍历每个国家，并绘制一个带有\
  \ `popDensity` 属性的圆，如下所示：\n\n```javascript\nvar currentX = 70;\nfor(var i = 0, ii\
  \ = data.length; i < ii; i+=1) {\n    var country = data[i];\n    paper.circle(currentX,\
  \ 150, 50).attr({\n        popDensity: [country.population, country.density],\n\
  \        'stroke-width': 4\n    });\n    paper.text(currentX, 225, country.name).attr({\n\
  \        'font-size': 14\n    });\n\n    currentX += 100;\n}\n```\n\n在循环的每次迭代中，人口密度属性从我们的数据对象中确定并绘制到画布上。我们已将每个圆标记为国家名称文本，并递增\
  \ x 坐标，以便后续圆在前一个圆的右侧绘制。结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_85_0.png)\n\
  \n如您所见，人口最多的国家不一定具有最大的人口密度。虽然台湾和荷兰的人口大致相等，但台湾每平方公里的人口数量远多于荷兰。\n\n如前所述，我们可以将自定义属性从一组值动画化到另一组值。考虑一下，如果我们在循环中初始化元素时将人口和密度值设置为零，然后动画化到人口和密度的实际值，会发生什么：\n\
  \n```javascript\nvar currentX = 70;\nfor(var i = 0, ii = data.length; i < ii; i+=1)\
  \ {\n    var country = data[i];\n    var circle = paper.circle(currentX, 150, 50).attr({\n\
  \        popDensity: [0, 0],\n        'stroke-width': 4\n    });\n    circle.animate({\n\
  \        popDensity: [country.population, country.density]\n    }, 1000, 'easeOut');\n\
  \    paper.text(currentX, 225, country.name).attr({\n        'font-size': 14\n \
  \   });\n    currentX += 100;\n}\n```\n\n运行此代码时，您会注意到半径和填充属性都会动画化到其最终状态。\n\n## 路径动画\n\
  \n在动画过程中，属性值根据指定的缓动和已过的时间而变化。自定义属性的工作方式相同。也就是说，传递给自定义属性函数的值取决于缓动和已过的时间。我们可以利用此功能将元素沿给定路径动画化。\n\
  \n首先，我们绘制一条三次贝塞尔曲线，圆将沿其动画化：\n\n```javascript\nvar path = paper.path([\n    'M',\
  \ 100, 100,\n    'C', 100, 0, 400, 200, 400, 100,\n    'S', 100, 200, 100, 100,\n\
  \    'z'\n]).attr({'stroke-width': 2});\nvar circle = paper.circle(0, 0, 13).attr({\n\
  \    fill: '#09c', cursor: 'pointer'\n});\n```\n\n我们的圆初始化为 (0, 0) 点，因为我们将应用一个自定义属性来确定其初始位置。\n\
  \n我们的自定义属性，我们将其命名为 `pathFactor`，它确定圆应该位于路径上的哪个点，具体取决于动画已进行了多少。如果我们将 `distance =\
  \ 0` 定义为动画的起点，将 `distance = 1` 定义为终点，我们可以将 distance 乘以路径的总长度，以确定圆应该遍历路径的多少长度：\n\n\
  ```javascript\npaper.customAttributes.pathFactor = function(distance) {\n    var\
  \ point = path.getPointAtLength(distance * pathLength);\n    var dx = point.x,\n\
  \        dy = point.y;\n    return {\n        transform: ['T', dx, dy]\n    };\n\
  };\n```\n\n我们始终返回一个绝对变换，它使用路径上的 (_x_, _y_) 点来确定圆位于路径上的哪个位置。\n\n为了动画化我们的圆，我们首先将其\
  \ `pathFactor` 属性初始化为零。这会将其放置在路径的零长度点，即我们开始绘制路径的点，也就是 (100, 100)：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_87_0.png)\n\
  \n为了沿路径动画化我们的圆，我们定义并执行一个 `runloop` 函数，该函数将我们的 `pathFactor` 属性动画化到值 1。动画结束的回调函数将\
  \ `pathFactor` 重置为零，然后递归调用 `runloop`。您会注意到，我们的递归函数调用是作为 `setTimeout` 的回调执行的；这是为了确保在动画重复之前，浏览器进入循环下一次迭代所需的最短时间已过去：\n\
  \n```javascript\nfunction runloop() {\n    circle.animate({pathFactor: 1}, 4000,\
  \ function() {\n        this.attr({pathFactor: 0}); // Reset\n        setTimeout(runloop);\n\
  \    });\n}\nrunloop();\n```\n\n执行此代码时，您会看到我们的圆沿着路径永久动画化，花费四秒钟从起点遍历路径并返回。\n\n##\
  \ 暂停和恢复动画\n\n我们尚未研究暂停和恢复动画的功能。考虑一下，在沿路径动画化的示例中，如果我们在运行循环中为圆定义单击和双击事件处理程序，如下所示：\n\
  \n```javascript\nfunction runloop() {\n    circle.animate({pathFactor: 1}, 4000,\
  \ function() {\n        this.attr({pathFactor: 0}); // Reset\n        setTimeout(runloop);\n\
  \    });\n    circle.unclick().click(function() {\n        this.pause();\n    });\n\
  \    circle.undblclick().dblclick(function() {\n        this.resume();\n    });\n\
  }\nrunloop();\n```\n\n由于每次都会启动新动画，我们在每次动画运行时都会注销并重新注册单击和双击事件处理程序。运行此代码时，您会看到，单击和双击时，`pause`\
  \ 和 `resume` 方法分别会暂停和恢复圆上当前运行的动画。在动画周期的四分之一处（t = 0.25）或四分之三处（t = 0.75）暂停动画的结果如下所示：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_88_0.png)\n\n## 摘要\n\n在本章中，我们探讨了驱动动画的概念以及将元素归属于属性的不同方式。您现在应该能够舒适地使用\
  \ Raphaël 库创建、转换和动画化矢量图形，并且应该能够毫无困难地利用 Raphaël 文档来基于我们所涵盖的内容进行扩展，并按照自己的意图操作图形。\n\
  \n在下一章中，我们将探讨如何在 Raphaël 中使用现有的 SVG。\n"
- "## 使用现有 SVG\n\n大多数设计师在其项目中使用栅格图形和矢量图形的混合体，因此熟悉 Adobe Illustrator 和 Inkscape 等矢量图形编辑器。这些工具的实用性近年来随着数字媒体的进步而大幅增长——特别是，设计师需要能够创建分辨率独立的图形，这些图形可以在不同的上下文中工作。\n\
  \n例如，移动和平板电脑市场鼓励设计师创建在非常低分辨率（约 320 x 240）和非常高分辨率（2,048 x 1,536）下都能适当缩放的图像。如今，桌面浏览器也大致相同，用户体验被定制以满足一系列视口尺寸。满足一系列视口尺寸通常被称为\
  \ **响应式设计**。\n\n虽然 SVG 本身在旧版浏览器中支持有限，但我们仍然可以提供矢量图形解决方案。我们现在看到，矢量图形在网站和应用程序中被更广泛地利用。由此可见，我们正在见证设计从僵硬但更精美的艺术作品向灵活的基于矢量的设计转变。\n\
  \n话虽如此，现在更加重视能够使用图形编辑软件生成的矢量图形。虽然在 Raphaël 中使用现有 SVG 没有银弹式的方法，但只要有一定的决心，我们就可以在项目中利用现有的\
  \ SVG。\n\n在本章中，我们将探讨以下内容：\n\n- Inkscape 矢量图形编辑器\n- 检查 SVG 路径的手动方法\n- SVG 到 Raphaël\
  \ 转换工具\n- 现有 SVG 的示例：分级地图\n\n\n\n\n\n## Inkscape\n\nInkscape 是一个开源的 SVG 编辑器，其功能集与\
  \ Adobe Illustrator 相似。许多设计师使用它，原因如下：\n\n- 它是开源的，并且积极维护/开发\n- 在线上有大量可用的教程\n- 它拥有全面的功能集\n\
  - 它符合 W3C 标准 SVG\n\nInkscape 还具有跨平台的优势，可供下载的版本包括 Windows、Mac 和 Linux。\n\n## 下载 Inkscape\n\
  \nInkscape 可在 `http://inkscape.org/download/` 下载。建议下载最新的稳定版本，撰写本文时该版本为 0.48.4。\n\
  \n## 开始使用 Inkscape\n\n虽然对 Inkscape 的深入介绍超出了本书的范围，但我们将使用以下步骤，通过 Inkscape 创建一些基本的\
  \ SVG：\n\n1. 首先，打开 Inkscape，从菜单中选择 **文件 | 新建**。Inkscape 自带多种预定义的文档尺寸，您应选择最适合所创建图形的尺寸。目前，请选择\
  \ **默认**。\n\n在左侧，您会看到 Inkscape 拥有多种形状绘制工具，用于绘制基本形状、文本、自由手绘和 Bézier 路径。\n\n2. 选择圆形。\n\
  3. 在画布上任意位置单击并拖动。\n4. 释放鼠标时，您的圆形将如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_93_0.png)\n\
  \n注意圆上的锚点。最左侧的点用于控制圆的宽度，最上方的点控制高度，而最右侧的点用于更改终点。在最右侧断点上单击并拖动：在圆内拖动会从终点到起点绘制一条直线，而在圆外拖动则会创建一个线段。\n\
  \n## 处理现有 SVG\n\n在圆外按几度角拖动的结果如下截图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_94_0.png)\n\
  \n对于基于 Web 的项目，文档尺寸通常由组成对象定义。单击 **文件 | 文档属性 | 页面**，然后展开 **调整页面大小以适应内容** 下拉菜单。在此处，您可以为文档定义自定义宽度和高度。单击\
  \ **将页面大小调整为绘图或选择** 将调整页面和所选元素的尺寸（如果未选中任何元素，则调整所有绘制元素的尺寸）。\n\n这实际上是对当前图层上的所有元素应用平移，即先绘制路径，然后应用变换。如果我们希望所有路径相对于“新”原点绘制（通常是这种情况），则应执行以下步骤：\n\
  \n1. 将文档大小调整为所需尺寸。\n2. 转到 **图层 | 图层...**\n3. 通过单击图层窗格上的 **+** 符号创建新图层。\n4. 选择上一图层中的所有对象。\n\
  5. 选择 **图层 | 将选择移动到上方图层**。\n6. 删除上一图层。\n\n结果如下：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_95_0.png)\n\
  \n我们可用的最佳工具或许是钢笔工具，它用于绘制 Bézier 曲线路径：\n\n1. 选择钢笔工具（*Shift + F6*）。\n2. 在文档中任意位置单击一次。\n\
  3. 在文档中的另一点单击并拖动。\n\n## 处理现有 SVG\n\n您会注意到，每次单击都定义一个锚点，该锚点决定曲线的弯曲程度，如下截图所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_96_0.png)\n\
  \n每次后续单击都定义一个新的锚点，路径通过将其连接到起点锚点来闭合：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_96_1.png)\n\
  \n## 检查路径\n\n由于我们熟悉向 Raphaël 的 `path` 方法提供原始路径字符串数据，不言而喻，我们可以从 SVG 复制路径字符东并以这种方式绘制路径。对于复杂图形，SVG\
  \ 的原始 XML 不总是易于处理，操作多个路径可能会很麻烦，但这种处理现有 SVG 的方法确实让我们对正在操作的图形拥有完全控制权。\n\n## Inkscape\
  \ 的 XML 编辑器\n\nInkscape 的一个出色功能是能够直接查看和编辑 SVG 的 XML 标记。考虑上一节中的圆形示例。如果单击 **编辑 | XML\
  \ 编辑器**，您将看到 SVG 的文档结构。单击左侧您创建的元素——`svg:path` 元素——将列出对象的所有属性，包括 `d` 属性，该属性是在应用变换之前元素的路径。单击\
  \ `d` 属性将显示元素的路径：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_97_0.png)\n\n## 处理现有\
  \ SVG\n\n如果我们获取此路径并在 Raphaël 中按以下方式使用：\n\n```javascript\nvar initialPath = 'M 197,94.46\
  \ '\n + 'A 98.5,94.5 0 1 1 167.39,26.92 L 98.5,94.46 z';\nvar pac = paper.path(initialPath);\n\
  pac.attr({fill: '#09c', 'stroke-width': 0});\n```\n\n然后它将绘制到我们的画布上，如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_98_0.png)\n\
  \n返回 Inkscape，移动弧形锚点以关闭我们创建的线段的“嘴巴”：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_98_1.png)\n\
  \n与之前一样，我们使用 XML 编辑器获取此元素的路径。\n\n我们可以使用路径动画，以相对较少的努力实现一个有趣的效果，从之前的“张嘴”路径动画到之后的“闭嘴”路径。首先，我们定义一个名为\
  \ move 的函数，该函数根据旋转（初始化为零）确定 pac 元素的 x 和 y 坐标：\n\n```javascript\nvar rotation = 0;\n\
  var move = function() {\n    var x = Math.cos(Raphael.rad(rotation)) * 800;\n  \
  \  var y = Math.sin(Raphael.rad(rotation)) * 800;\n}\n```\n\n接下来，我们将元素动画化到新路径或“闭嘴”路径：\n\
  \n```javascript\npac.animate({\n    path: 'M 197,94.46 ',\n    + 'a 98.5,94.5 0\
  \ 1 1 -2.1e-4,-0.194727, L 98.5,94.46 z',\n    transform: ['...T', x, y]\n}, 500,\
  \ function() {\n    // Rotate our element and reset the path\n    rotation += 90;\n\
  \    pac.attr({\n        path: initialPath\n    }).transform(['...R', 90]);\n  \
  \  setTimeout(move);\n});\n```\n\n我们根据元素的 x 和 y 坐标在半秒内应用平移。动画完成后，我们旋转元素。请注意，变换前缀带有省略号，这确保任何平移在考虑旋转后都会被计入；90\
  \ 度旋转后，平移将沿 y 轴进行。通过对 move 函数调用 setTimeout，此过程无限重复。\n\n运行此代码时，“嘴巴”在一次动画过程中从张开变为闭合，然后在应用旋转的情况下重复。旋转的效果是使我们的元素沿容器边缘移动（此演示可在本书附带的源代码和网站中找到）。\n\
  \n## 从现有 SVG 图像中提取路径\n\n由于 SVG 图像只是 XML 文件，您可以在文本编辑器中打开它们以获取路径信息。通常，只需从 XML 中的单个\
  \ `path` 元素复制并粘贴路径信息即可。如前所述，虽然这种方法很麻烦，但还有其他问题。主要问题是元素或元素组是否应用了变换。如果应用了变换，您需要将相同的变换应用到您创建的\
  \ `path` 元素上。\n\n## SVG 到 Raphaël 转换工具\n\n有许多优秀的 SVG 到 Raphaël JS 转换工具，可以自动且轻松地将\
  \ SVG 图像转换为 Raphaël。\n\n### Ready Set Raphaël\n\nReady Set Raphaël (http://www.readysetraphael.com)\
  \ 是一个基于 Web 的 SVG 转换器，允许您上传图像并获取生成的 Raphaël 代码。它支持 SVG 组、椭圆、多边形、文本、圆形、路径和矩形，并将所有相关样式信息解析为元素属性：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_100_0.png)\n\n使用它，您只需上传现有 SVG 图像并单击 **复制代码**\
  \ 按钮。\n\n要测试此功能，请从 http://www.readysetraphael.com 页面底部下载示例文件之一，并将生成的代码复制并粘贴到 HTML\
  \ 文档的 `<script></script>` 标签之间。请注意，您需要创建一个 ID 为 `rsr` 的 HTML 元素：\n\n\n\n\n\n## 其他转换器\n\
  \n值得注意的是，网上有许多其他优秀的 SVG 转 Raphaël 转换器可供使用。你可能会发现，每个转换器在转换原生 SVG 时的结果各不相同，因此你应该进行实验，找出哪个最适合你。\n\
  \nCharles Thomas 的 SVG 转 HTML 转换器 (http://www.irunmywebsite.com/raphael/SVGTOHTML_LIVE.php)\
  \ 将所有基本形状转换为路径，并确保所有路径都使用绝对坐标，而 http://toki-woki.net/p/SVG2RaphaelJS/ 上的转换器则速度快且轻量。\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_101_0.png)\n\n示例企鹅文件的渲染结果如下所示：\n\n| 下载示例文件\
  \ |\n|-----------------------|\n| 试用这些 SVG 文件。(168kb 压缩包) |\n| 查看我们的交互式地图示例 |\n\n\
  ## 栅格地图\n\n**栅格地图** 是显示某个特定区域或地区及其关联测量值或统计数据的地图。它们通常用于制图学中描绘人口密度和类似指标，并常用于可视化具有地理意义的数据。下图使用\
  \ https://commons.wikimedia.org/wiki/File:World_population_density_map.PNG 和 https://en.wikipedia.org/wiki/File:ElectoralCollege2012.svg\
  \ 的 Wikimedia Commons 图片编译而成，展示了制图学（左）和数据可视化（右）的应用：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_102_0.png)\n\
  \n## 创建栅格地图\n\n通常，当你需要将数据与某个地理区域或地区关联时，最佳方法是利用现有的 SVG 格式地图，然后根据你的需求进行定制（手动修改原始 XML\
  \ 或使用 Inkscape 等图形编辑器）。为了演示，我们将使用来自 http://en.wikipedia.org/wiki/File:England_Regions_within_UK.svg\
  \ 的英国现有地图。\n\n如果你下载此地图并在 XML 编辑器中打开，你会发现英格兰的区被定义为带有 ID 的单个 `<path>` 元素（例如，`<path\
  \ id=\"London\">` 代表伦敦地区，而 `<path id=\"north-west\">` 描绘整个西北英格兰地区）。Ready Set Raphael\
  \ 处理此问题非常出色，因为它为每个带有 ID 的路径定义了变量：\n\n```javascript\nvar london = rsr.path(...);\n\
  var northwest = rsr.path(...);\n```\n\n你可以使用 Ready Set Raphael 转换器转换上述图像，并将生成的 JavaScript\
  \ 导入 HTML 文档。运行此代码时，你会发现转换器在保持路径及其关联属性方面做得非常好。\n\n英格兰共有九个官方区域（行政区划），它们都绘制在生成的地图上。这些地区的人口如下，表中显示了\
  \ Ready Set Raphael 创建的相应变量名：\n\n| 区域 | 变量名 | 人口 |\n|---|---|---|\n| 西北英格兰 | northwest\
  \ | 7,052,000 |\n| 东北英格兰 | northeast | 2,597,000 |\n| 约克郡和亨伯 | yorkshireandhumber\
  \ | 5,284,000 |\n| 西密德兰兹 | westmidlands | 5,602,000 |\n| 东密德兰兹 | eastmidlands |\
  \ 4,533,000 |\n| 英格兰东部 | eastengland | 5,847,000 |\n| 伦敦 | london | 8,174,000 |\n\
  | 东南英格兰 | southeast | 8,635,000 |\n| 西南英格兰 | southwest | 5,289,000 |\n\n所有人口总和为\
  \ 53,013,000。\n\n在 Ready Set Raphael 创建的代码末尾，我们定义了一个对象数组，将 `path` 属性与表中列出的路径变量及其关联人口相关联。这种合理化很有用，因为它允许我们将地区人口与定义的路径关联起来：\n\
  \n```javascript\nvar data = [\n {\n   path: northwest,\n   population: 7052000\n\
  \ },\n {\n   path: northeast,\n   population: 2597000\n },\n // ... and so on ...\n\
  ];\n```\n\n## 使用现有 SVG\n\n现在，为了可视化不同的人口，我们定义了一个名为 shading 的自定义属性，该属性基于 0 色相和 0 饱和度返回填充，其中只有亮度变化。这将根据人口大小对国家进行着色：\n\
  \n```javascript\nrsr.customAttributes.shading = function(population, min, max, total)\
  \ {\n    var brightness = 1 - ((population - min) / (max - min));\n    return {\n\
  \        fill: 'hsb(0, 0, ' + brightness + ')'\n    };\n};\n```\n\n亮度定义如下：\n\nbrightness\
  \ = 1 - \\(\\frac{population - smallest population}{largest population - smallest\
  \ population}\\)\n\n该方程根据最大和最小人口大小对亮度进行归一化。当人口大小等于最大人口时，亮度将为零（黑色）；当人口大小等于最小人口时，亮度将等于\
  \ 1（白色）。人口的所有其他值都返回 0 到 1 之间的值（灰色阴影）。\n\n我们通过遍历定义绘制路径及其关联人口的数据数组来利用此属性：\n\n```javascript\n\
  var totalPopulations = 530130000;\nvar minPopulation = 25970000;\nvar maxPopulation\
  \ = 86350000;\nfor(var i = 0, ii = data.length; i < ii; i+=1) {\n    var path =\
  \ data[i].path;\n    var population = data[i].population;\n    path.attr({\n   \
  \     shading: [population, minPopulation, maxPopulation,\n        totalPopulations]\n\
  \    });\n}\n```\n\n每个地区的人口，以及总人口、最大人口和最小人口，都会传递给我们的自定义属性，进而相应地填充区域。此操作的结果如下图所示：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_105_0.png)\n\n你可以看到，东北地区（人口最少）被涂成白色，而东南地区（人口最多）被涂成黑色。\n\
  \n伦敦的人口规模几乎与该国东南地区的人口规模一样大，这很不幸，因为这使得无法区分伦敦地区和东南地区。在这种情况下，可以通过在遍历数据数组时为每个区域应用较浅颜色的描边来解决：\n\
  \n```javascript\npath.attr({\n    shading: [population, minPopulation, maxPopulation,\n\
  \    totalPopulations],\n    'stroke': '#bbb'\n});\n```\n\n结果如下所示：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_105_1.png)\n\
  \n## 开源 SVG\n\nOpen Clip Art Library (http://openclipart.org) 上有许多可用的 SVG。该网站拥有一个出色的\
  \ SVG 编辑器，允许你即时编辑托管的 SVG 并查看其底层源代码或下载它们。\n\n## 摘要\n\n你现在应该能够在 Raphaël 驱动的项目中熟练使用现有\
  \ SVG。你应该对 Inkscape 有基本了解，并能够使用它创建基本 SVG 并检查图形的 XML 结构。正如我们对栅格地图的介绍所显示的，在线 SVG 转\
  \ Raphaël 转换器非常宝贵，你现在应该能够处理更复杂的图形，其特性为我们向最终用户提供的内容提供了额外的可能性。\n"
- "## 创建社交媒体可视化套件\n\n我们现在已经介绍了 Raphaël JavaScript 库的所有主要方面，在本章中，我们将探讨基于社交媒体统计数据创建数据可视化演示。\n\
  \n近年来，数据可视化真正兴起。随着我们试图理解并传达可用的海量数据，在线信息图表和数据相关展示的数量继续增长。话虽如此，现有的许多优秀示例都是 _静态_ 的，利用矢量绘图库创建动态和交互式数据可视化有很大的空间，这使得\
  \ Raphaël 库成为一种非常真实且有效的应用。\n\n在本章中，我们将探讨：\n\n- 创建社交网络使用统计数据可视化\n- 创建显示推文数量随时间变化的动态环形图\n\
  - 讨论 Raphaël 库的未来\n\n### 社交网络使用\n\n人们可以通过计算机网络进行通信和交互的想法可以追溯到，嗯，万维网之前（第一封网络电子邮件发送于\
  \ 1971 年），但真正在过去十年左右，我们开始看到社交网络的广泛且确实巨大的使用。Facebook 目前是世界上最大的社交网络，拥有十亿注册用户，而 Twitter\
  \ 和 Google+ 等平台各拥有近五亿用户。\n\n\n\n\n\n## 创建社交媒体可视化套件\n\n在本节中，我们将创建一个交互式可视化，类似于直方图/面积图，通过将社交网络用户数量与总世界人口（六十亿）进行比较，来展示这些数字有多么显著。它将使用一种常见的技术，即在选择相关社交网络时，通过高亮显示图标来指示用户相对于所有世界公民的比例。最终结果如下所示：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_108_0.png)\n\n## 开始使用\n\n要开始，我们首先创建一个基本的\
  \ HTML 文件，其中包含社交媒体图标图片的标记，并在 `body` 标签闭合之前包含所有相关的 JavaScript 文件。我们将在 `social-network-usage.js`\
  \ 文件中编写 JavaScript：\n\n```html\n<body>\n<h1>Social Network Usage</h1>\n<p>The ratio\
  \ of users to the total world population,\nbased on a world population of 6,000,000,000.</h1>\n\
  <div id=\"world-population-usage\"></div>\n<div class=\"networks\">\n<img class=\"\
  facebook\" src=\"icons/facebook_32.png\" />\n<img class=\"twitter\" src=\"icons/twitter_32.png\"\
  \ />\n<img class=\"flickr\" src=\"icons/flickr_32.png\" />\n<img class=\"linkedin\"\
  \ src=\"icons/linkedin_32.png\" />\n<img class=\"myspace\" src=\"icons/myspace_32.png\"\
  \ />\n<img class=\"googleplus\" src=\"icons/google_plus_32.png\" />\n<img class=\"\
  orkut\" src=\"icons/orkut_32.png\" />\n<img class=\"lastfm\" src=\"icons/lastfm_32.png\"\
  \ />\n</div>\n<script type=\"text/javascript\"\nsrc=\"raphael-2.1.0.min.js\"></script>\n\
  <script type=\"text/javascript\"\nsrc=\"jquery-1.9.1.min.js\"></script>\n<script\
  \ type=\"text/javascript\"\nsrc=\"social-network-usage.js\"></script>\n</body>\n\
  ```\n\n当点击社交媒体图标时，高亮显示的人数将更新以反映该网络的总用户数。这些图标由 komodomedia.com 提供，并随本书附带的源代码一起分发。\n\
  \n## 使用 jQuery\n\n你会注意到在上一节的标记中，我们包含了 jQuery JavaScript 库。这将用于在本章中方便地进行 DOM 交互。\n\
  \n你可以从 http://jquery.com/ 下载 jQuery。编写时的最新版本是 1.9.1，我们将在本章中使用该版本。\n\n对于不熟悉 jQuery\
  \ 的人，网上有许多资源可供参考。你的首选应该是 http://docs.jquery.com/。\n\n## 社交网络使用数据\n\n本可视化使用的数据取自\
  \ http://en.wikipedia.org/wiki/List_of_social_networking_websites，其中使用量基于注册用户数量进行测量，并且该数字四舍五入到最近的\
  \ 5000 万用户：\n\n| 社交网络 | 注册用户数量（四舍五入到最近的 50,000,000） |\n|---|---|\n| Facebook | 1,000,000,000\
  \ |\n| Twitter | 500,000,000 |\n| Flickr | 50,000,000 |\n| LinkedIn | 150,000,000\
  \ |\n| Myspace | 50,000,000 |\n| Google+ | 400,000,000 |\n| Orkut | 100,000,000\
  \ |\n| last.fm | 50,000,000 |\n\n我们将此数据定义为一个对象，其中键对应于前面标记中定义的类名，值为注册用户数量：\n\n```javascript\n\
  var usage = {\n    facebook: 1000000000,\n    twitter: 500000000,\n    flickr: 50000000,\n\
  \    linkedin: 150000000,\n    myspace: 50000000,\n    googleplus: 400000000,\n\
  \    orkut: 100000000,\n    lastfm: 50000000\n};\n```\n\n## 绘制人形图标\n\n像往常一样，我们定义画布并将其引用存储在\
  \ `paper` 变量中。根据我们使用的图标的默认宽度和高度，一个宽 770px、高 220px 的画布非常适合我们的目的：\n\n```javascript\n\
  var paper = Raphael('world-population-usage', 770, 220);\n```\n\n我们使用的人形图标由 Dmitry\
  \ Baranovskiy 提供，他创建了不少于 266 个作为路径的图标，可在 http://raphaeljs.com/icons/ 上找到。该页面上的每个图标都带有一个相关的路径字符串，我们可以直接在代码中使用。我们将其中一个路径字符串的引用保存在名为\
  \ `personPath` 的变量中，以便重复使用（注意，此处显示的路径为了简洁而被截断）：\n\n```javascript\nvar personPath\
  \ = \"M20.771,12.364c0,0,0.849-3.51 ...\"\n```\n\n鉴于此，我们现在绘制 120 个这样的图标，每行 20 个，共六行。每个图标代表\
  \ 5000 万人，这意味着 120 个图标代表 60 亿的世界人口：\n\n```javascript\nvar people = paper.set();\n\
  for(var j = 0; j < 6; j+=1) {\n    for(var i = 0; i < 20; i+=1) {\n        var path\
  \ = paper.path(personPath).attr({\n            fill: '#666',\n            'stroke-width':\
  \ 0,\n            opacity: 0.3\n        });\n        var bBox = path.getBBox();\
  \ // width/height of icon\n        var xTranslation = (bBox.width + 4) * i;\n  \
  \      var yTranslation = (bBox.height + 4) * j;\n        path.transform('T', xTranslation,\
  \ yTranslation);\n        people.push(path);\n    }\n}\n```\n\n在给定的代码中，我们遍历 i 列和\
  \ j 行。我们使用 path 方法绘制图标，然后获取其边界框，以确定其占据的空间宽度和高度。然后我们将图标按此宽度和高度加上每次迭代的 4px 小间距进行平移。我们希望在\
  \ x 方向上平移图标的宽度数量由列索引 i 决定，而在 y 方向上平移图标的高度数量由行索引 j 决定：\n\n```javascript\nvar xTranslation\
  \ = (bBox.width + 4) * i;\nvar yTranslation = (bBox.height + 4) * j;\n```\n\n最后，我们将创建的人形路径存储在名为\
  \ people 的集合中。这将允许我们根据点击的社交媒体图标对所有人进行操作：\npeople.push(path);\n\n请注意，每个图标的不透明度为 0.3，这将使我们能够区分社交网络用户和构成世界人口的非用户。\n\
  \n## 响应图标点击\n\n我们在标记中定义的每个社交媒体图标上注册一个点击事件处理程序。当点击图标时，我们将对在上一节中创建的 people 集合进行操作：\n\
  \n```javascript\n$(' .networks img').click(function() {\n    // Operate on people\
  \ Set\n});\n```\n\n点击时，我们结束 people 集合中存储的所有路径上的任何现有动画，并将不透明度重置为 0.3。stop 方法防止动画继续到其目标属性，并且是防止未来动画与正在进行的动画冲突所必需的：\n\
  \n```javascript\npeople.stop().attr({opacity: 0.3});\n```\n\n然后我们获取被点击元素的类名，并使用它来获取该特定社交网络的用户数量：\n\
  \n```javascript\nvar className = $(this).attr('class');\nvar numPeople = Math.ceil(\n\
  \  people.length * (usage[className] / 6000000000)\n);\n```\n\n由于类名映射到我们 `usage`\
  \ 对象中存储的使用值，我们将使用量计算为总人口的比例，然后将此数字乘以我们 `people` 集合中的人总数。这将给出一个 0 到 120 之间的值，即基于每个图标\
  \ 5000 万用户应高亮显示的图标数量。`ceil` 方法将此值向上舍入到最近的一个人。\n\n在确定需要高亮显示的图标数量后，我们使用集合对象的 `forEach`\
  \ 方法遍历它们：\n\n```javascript\npeople.forEach(function(o) {\n  if(o.id < numPeople)\
  \ {\n    o.animate({opacity: 1}, 500);\n    return true;\n  }\n  return false;\n\
  });\n```\n\n`forEach` 方法将集合中的对象传递给它作为第一个参数接受的函数。该对象有一个 `id` 属性，对应于其在集合中的索引位置。它是一个基于零的\
  \ ID，这意味着我们可以在循环期间比较其值，看它是否小于 `numPeople` 变量（即应高亮显示的数量）。如果是，我们将其动画化为不透明度 1，以区别于所有其他不透明度为\
  \ 0.3 的定义图标。遍历 `people` 集合中所有路径所需的时间可以忽略不计，这意味着所有动画似乎同时发生。例如，当点击 Facebook 图标时，`people`\
  \ 集合中的前 20 个图标将动画化为不透明度 1。\n\n## 绘制图例\n\n最后，为了识别一个图标相当于 5000 万人，我们重新绘制人形路径并添加一些伴随文本：\n\
  \n```javascript\nvar keyPerson = paper.path(personPath).attr({\n  fill: '#666',\n\
  \  'stroke-width': 0\n});\nvar bBox = keyPerson.getBBox();\n```\n\n\n\n\n\n## 按时间分布的推文\n\
  \n此人物路径在画布上的位置是任意的。我们将其放置在路径边界框高度的八倍处，使其刚好出现在六行人物的下方。\n\n平均每秒约有 3,000 条推文，这意味着在\
  \ 5 分钟内大约会产生一百万条推文。在本节中，我们将创建一个有趣的动画环形图可视化，利用路径弧来说明特定数量的推文被创建所需的时间：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_113_0.png)\n\
  \n### 开始使用\n\n我们的 HTML 标记定义了一个画布，页面加载时我们将在其中绘制四条动画弧路径。我们将在 tweets-by-time.js 中编写\
  \ JavaScript：\n\n```html\n<h1>Tweets with respect to time</h1>\n<p>There are approximately\
  \ 3,000 tweets every ...</p>\n<div id=\"tweets-timed\"></div>\n<script type=\"text/javascript\"\
  \n src=\"raphael-2.1.0-min.js\"></script>\n<script type=\"text/javascript\"\n src=\"\
  jquery-1.9.1.min.js\"></script>\n<script type=\"text/javascript\"\n src=\"tweets-by-time.js\"\
  ></script>\n```\n\n我们定义了一个宽度为 770px、高度为 450px 的绘图画布，以容纳这些计时器：\n\n```javascript\n\
  var paper = Raphael('tweets-timed', 770, 450);\n```\n\n我们还定义了两个数组，用于保存我们将要绘制的路径的引用以及与时间相关的推文计数：\n\
  \n```javascript\nvar paths = Array(), counts = Array();\n```\n\n### 按时间分布的推文数据\n\
  \n基于每秒约 3,000 条推文，我们定义了以下数值的计时器：\n\n| 时间间隔   | 推文数量 |\n|-----------------|------------------|\n\
  | 1 秒        | 3,000            |\n| 3.333 秒   | 10,000           |\n| 30 秒    \
  \  | 100,000          |\n| 5 分钟       | 1,000,000        |\n\n在我们的 JavaScript 文件中，我们创建了一个包含这些值的数组对象，以及一些相关文本和弧路径的中心\
  \ x、中心 y 和半径：\n\n```javascript\nvar timers = [\n {\n  cx: 225,\n  cy: 100,\n  r:\
  \ 50,\n```\n\n```\ninterval: 1000,\ntotal: 3000,\ntext: '~ 3,000 tweets per second'\n\
  },\n// ...\n```\n\n出于简洁起见，此代码被截断。完整代码请下载本书附带的源代码。\n\n### subtend 自定义属性\n\n弧线的弯曲程度，即\
  \ _subtend_（所对的角度），取决于动画过程中经过的时间。起初，弧线所对的扇区长度为零，逐渐增加，直到弧线所对的角度达到 360 度。\n\n为了实现这一点，我们定义了一个名为\
  \ `subtend` 的自定义属性，它根据特定时间下弧线的角度以及其固有的中心 _x_、中心 _y_ 和半径属性来返回一个路径。曲线终点的 _x_ 和 _y_\
  \ 坐标随其所对的角度呈正弦变化，这意味着我们可以定义一条从起点（中心点的 _x_ 坐标和中心点的 _y_ 坐标减去半径）开始弧形的路径，如下所示：\n\n```\n\
  paper.customAttributes.subtend = function(angle, cx, cy, r) {\nvar x = cx + r *\
  \ Math.cos(Raphael.rad(90 - angle));\nvar y = cy - r * Math.sin(Raphael.rad(90 -\
  \ angle));\nvar path = [\n'M', cx, cy - r,\n'A', r, r, 0, +(angle > 180), 1, x,\
  \ y\n];\nreturn {\npath: path\n};\n};\n```\n\n请注意，子路径定义 `'A', r, r, 0, +(angle >\
  \ 180), 1, x, y` 描述了一个半径固定为 `r` 的弧，当所对角度小于或等于 180 度时，其大弧标志为 0（此时我们要绘制可用弧中的较小者），当角度大于\
  \ 180 度时，其大弧标志为 1（此时我们要绘制较大的弧）。\n\n### counts 自定义属性\n\n我们的可视化将根据动画经过的比例（表示为 0 到\
  \ 1 之间的因子）以及该计时器的推文总数，以文本形式显示推文数量。我们定义了 counts 自定义属性，以文本形式返回经过时间与总推文数的比率，如下所示：\n\
  \n```\npaper.customAttributes.counts = function(ratio, total) {\n    return {\n\
  \        text: Math.round(ratio * total)\n    };\n};\n```\n\n### 更新计时器\n\n当计时器的动画初次开始，或者在遍历完整的\
  \ 360 度（一次动画的长度）后被重置时，我们会运行一个更新方法，该方法负责设置弧的“起始”值。弧从 0 度开始，并被赋予 20px 的描边，从而产生时钟弧形效果：\n\
  \n```\nfunction update(i) {\n    // Get properties from our timers data array\n\
  \    var cx = timers[i].cx, cy = timers[i].cy,\n        radius = timers[i].r, interval\
  \ = timers[i].interval;\n\n    // Draw a new path for this particular timer\n  \
  \  paths[i] = paper.path().attr({\n        subend: [0, cx, cy, radius],\n      \
  \  'stroke-width': 20,\n        stroke: '#009ec4'\n    });\n\n    animate(i, cx,\
  \ cy, radius, timers[i].interval);\n}\n```\n\n辅助方法 animate 在此函数末尾被调用，以便将我们的动画从 0\
  \ 度初始化到 360 度。请注意，我们的路径存储在 paths 数组中，以便我们稍后可以通过索引引用它们。\n\n### animate 辅助方法\n\n`animate`\
  \ 函数的目的是对以下内容进行动画处理：\n\n+   - 弧线从其初始弧路径到最终弧路径\n+   - 经过的时间间隔内计数的推文数量\n\n在给出的代码中，我们将弧线动画化为所对\
  \ 360 度，并将文本计数作为推文总数的比例进行动画化：\n\n```\nfunction animate(i, cx, cy, r, interval) {\n\
  \    // Animate the path\n    paths[i].animate({\n        subtend: [360, cx, cy,\
  \ r]\n    }, interval, function() {\n        paths[i].remove();\n        setTimeout(function()\
  \ {\n            update(i);\n        });\n    });\n    // Animate the counts\n \
  \   counts[i].animate({\n        counts: [1, timers[i].total]\n    }, interval,\
  \ function() {\n        counts[i].attr({\n            'counts': [0, timers[i].total]\n\
  \        });\n    });\n}\n```\n\n`animate` 方法在我们 `timers` 数组中指定的持续时间内运行，基于作为第一个参数传递的计时器的索引。请注意，当弧线的动画完成时，我们会再次运行\
  \ `update` 函数以重新启动整个过程。同样，`counts` 文本会被重置为 0。\n\n### 遍历我们的计时器并启动动画\n\n为了初始化动画，我们遍历我们的计时器，将我们的\
  \ `counts` 文本定义为初始值 `0`，位于弧线的中心 x 和中心 y 点。然后我们对每个计时器运行 `update` 函数，其效果是以我们讨论过的递归方式对弧线进行动画处理。\n\
  \n```\nfor(var i = 0, ii = timers.length; i < ii; i+=1) {\n\t(function(i) {\n\t\t\
  // Draw descriptive text beneath the timer\n\t\tpaper.text(timers[i].cx, timers[i].cy\
  \ + timers[i].r + 30,\n\t\ttimers[i].text);\n\t\t// Define counts text\n\t\tcounts[i]\
  \ = paper.text(\n\t\t\ttimers[i].cx, timers[i].cy, '0'\n\t\t).attr({\n\t\t\t'counts':\
  \ [0, timers[i].total]\n\t\t});\n\t\tupdate(i);\n\t})(i);\n}\n```\n\n### 补充材料\n\n\
  另外两个数据可视化演示已在 `http://raphaeljsvectorgraphics.com` 上编写，并作为补充材料提供给您。\n\n### 按年份划分的\
  \ Facebook 使用情况\n\n创建了一个简单的时间轴可视化，以展示用户数量随年份的增长。时间轴是一条 Catmull-Rom 曲线，可以沿 x 方向平移，如下面的屏幕截图所示：\n\
  \n![](img/d8ec653db4cab13fec8b3f5718174af6_119_0.png)\n\n此可视化的补充材料可在 http://raphaeljsvectorgraphics.com/book/supplementary/facebook-usage-by-year\
  \ 获取。\n\n### 黄金推文\n\nTwitter 在 2012 年底发表了一篇文章，讨论了一些被转发次数最多的推文。这些推文被营销为 _黄金推文_，因为它们鼓励了高水平的参与。\n\
  \n创建了一个柱状图可视化，以表示这些推文被转发的次数：\n\n![](img/d8ec653db4cab13fec8b3f5718174af6_119_1.png)\n\
  \n此可视化的补充材料可在 http://raphaeljsvectorgraphics.com/book/supplementary/golden-tweets\
  \ 获取。\n\n[ 109 ]\n\n\n\n\n\n### Raphaël 的未来\n\nRaphaël 的当前维护者 Tomás Alabés 友好地联系了我，提供了关于该库未来的相关信息。展望未来，我们预计该库的采用率将提高，并且正在实施一些变更，以便实现\
  \ Raphaël 更开放的开源协作。\n\n### 里程碑\n\nRaphaël 项目目前有四个里程碑，如下表所示：\n\n| 版本 | 里程碑 |\n|---------|-----------|\n\
  | 2.1.1 | 解决社区贡献的错误修复 |\n| 2.2.0 | 引入贡献者拉取请求中的增强功能 |\n| 2.2.1 | 解决社区创建的问题中的错误修复\
  \ |\n| 2.3.0 | 开发社区创建的问题中建议的增强功能 |\n\n如您所见，Raphaël 的即将发布的版本将解决许多现有的错误修复，但也许更有趣的是，开始实施由社区贡献或建议的功能。这使得该库变得稳固，并持续发展。\n\
  \n### 长期目标\n\nTomás 特别渴望鼓励 Raphaël 的开源协作。他已经开始向源代码（https://github.com/DmitryBaranovskiy/raphael/）提交提交，这将有助于促进更广泛的协作。\n\
  \n此外，当 VML 兼容浏览器开始失去市场份额且支持它们不再是要求时，该库将开始专注于 SVG，这将带来许多功能和改进，而这些功能和改进受到 VML 的限制。\n\
  \n### 摘要\n\n读完本书后，您希望能够牢牢掌握 Raphaël 库的功能，并了解它可以使用的一些方式以及绘制矢量图形和可视化数据所采用的方法。请提醒您探索该库的文档，尝试其所有可用功能，并投入时间研究驱动未来应用程序的概念，无论这些应用程序是数据可视化、游戏开发还是制图。任何库的真正力量都取决于使用它的人。\n\
  \n希望您阅读本书的乐趣与我编写它一样多。\n"
