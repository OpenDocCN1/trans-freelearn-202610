  \n\n\n\n\n#### 10 调优性能\n\n在本章中，我们将介绍在 Lightning Platform 上设计 Salesforce 应用程序时可用于调优性能的各种方法。我们将重新审视已经讨论过的几个概念，深入探讨一些场景，以展示所强调技术的实际应用。在本章结束时，你将了解在\
  \ Salesforce Platform 上设计可扩展解决方案时可用的各种性能调优技术，特别是关于数据性能方面。\n\n在本章中，我们将介绍以下主题：\n\n\
  - 瘦表和其他**大数据量（LDV）**缓解技术\n- 查询和搜索优化\n- 任务锁\n- **主键（PK）**分块以提高性能\n- 加载海量数据\n\n我们将首先了解\
  \ LDV 缓解技术，以及在使用海量数据时如何调优我们的 Salesforce 实现。\n\n##### 瘦表和其他 LDV 缓解技术\n\n**瘦表**是一种\
  \ LDV 缓解技术，当用户对 Salesforce 数据库执行查询时遇到缓慢的读取操作时非常有用。这是因为标准对象的基础（虚拟）数据库架构实际上是跨两个表的连接。标准对象有标准字段和自定义字段。例如，当性能受到影响时，对于从\
  \ Account 等标准对象查询数据（同时包含 Account 对象的标准字段和自定义字段）的查询，使用瘦表可能会带来好处。\n\n##### 选择性过滤条件\n\
  \n为了提升 SOQL 查询性能，可以使用选择性过滤条件。你可以通过在 Developer Console 中运行查询并查看查询统计信息来确定某个过滤条件是否具有选择性。你可以与\
  \ Salesforce 支持合作，为选择性字段应用索引，以加快查询和报告性能。简而言之，当索引应用于选择性过滤条件字段时，查询将更高效地运行。在 Salesforce\
  \ 应用程序逻辑中，当发出查询时，Lightning Platform 查询优化器会确定 SOQL 查询、报告或列表视图的过滤条件选择性。\n\n通过确认报告、SOQL\
  \ 和列表视图中的过滤条件具有选择性，然后对这些字段应用索引，Lightning Platform 查询优化器在查找目标数据时就不必执行完整数据集扫描。这意味着在这种情况下性能将是最优的。\n\
  \n##### 分区（Divisions）\n\n分区（Divisions）是 Salesforce 的一项特殊数据性能功能，可用于对数据进行分区，并减少 SOQL\
  \ 查询返回的记录数。这能有效提升用户运行数据查询和报告时的性能。要启用分区（Divisions），你需要向 Salesforce 支持提交一个案例。\n\n\
  既然已经重新审视了瘦表和其他 LDV 缓解技术，下面我们来看一下搜索和查询的优化。\n\n##### 查询和搜索优化\n\n正如我们在*第 6 章“理解大数据量”*中所探讨的，Salesforce\
  \ 执行搜索分为两个部分。第一部分是创建结果集，然后用于执行实际搜索。让我们快速回顾一下结果集是如何生成的。当发起搜索时（无论是通过 Salesforce 用户界面、Salesforce\
  \ API 还是 Apex 代码），Salesforce 首先会搜索已为相应记录创建的索引。取得这些结果后，Salesforce 会应用访问权限、搜索限制以及任何其他过滤器或过滤逻辑，将结果缩小为结果集。然后，该结果集用于在底层数据库中执行实际记录搜索。\n\
  \n加速搜索的方法是在搜索时仔细考虑所用字段的索引，以提升这些搜索的性能。如*第 6 章“理解大数据量”*所述，开箱即用地会自动应用多个索引。当与自定义索引（在\
  \ Salesforce 支持的协助下启用）结合使用时，可以提高搜索性能。\n\n提醒一下，当 Salesforce 执行索引搜索时，如果查询的过滤条件匹配不到前一百万条记录的\
  \ 30%（以及不到额外记录的 15%），则会使用标准索引，最多达一百万条记录。\n\n自定义索引（你需要与 Salesforce 支持合作来启用这些索引）用于查询过滤器匹配不到总记录数的\
  \ 10% 的情况，最多达 333,333 条记录。\n\n现在我们已经介绍了可以对查询和搜索进行的优化，接下来让我们看看任务锁。\n\n##### 任务锁\n\
  \n在加载数据时，由于多种问题可能会发生记录锁定。在处理任务时，需要注意一些与任务记录关联的记录被锁定的情况。具体如下：\n\n- 当插入任务时，Account\
  \ 记录以及 WhoId 和 WhatId 字段引用的记录会被锁定，但仅当任务记录的状态不是“已完成”且活动日期已设置（不等于 null）时。\n- 当更新任务时，Account\
  \ 记录以及 WhoId 和 WhatId 字段引用的记录会被锁定，无论任务记录的值如何。\n- 当删除任务时，Account 记录以及 WhoId 和 WhatId\
  \ 字段引用的记录会被锁定，无论任务记录的值如何。\n\n当我们分析任务记录可用的记录关联时，主要涉及两个字段——即 WhoId 和 WhatId 字段。WhoId\
  \ 是 Contact 或 Lead 记录，而 WhatId 是任何其他类型的记录，例如 Account 或 Opportunity。\n\n当 WhoId 引用\
  \ Contact 记录时，会通过 Contact 和 Account 记录之间的关系引用父 Account 记录。WhatId 如果不是直接引用 Account\
  \ 记录，则会是另一个最终解析为 Account 记录的对象记录。理解了这些信息后，任务记录可以按最终引用的账户进行组织，并使用 Bulk API 以并行方式分批次加载。\n\
  \n另一种加载任务的方式是使用串行作业（按顺序处理的作业），如果最终的父 Account 记录相同，这种方法可能很适用。当单个 Account 记录关联的任务记录超过\
  \ 10,000 条，或者由于引用对象之间的关系可能导致锁竞争时，这种方法是必要的。\n\n如果作业是作为夜间批处理或类似流程的一部分进行调度的，Salesforce\
  \ 最佳实践是确保批处理作业执行中内置时间缓冲。这是为了确保记录不会因计划作业运行时间过于接近而重叠，从而导致记录被锁定并引发竞争。\n\n现在我们已经了解了任务锁，接下来让我们转向查询大量数据，以及如何使用\
  \ PK 分块来提高性能。\n\n##### PK 分块以提高性能\n\nPK 分块是一种机制，旨在允许提取整个 Salesforce 表数据——例如，作为备份例程的一部分。PK\
  \ 分块有效地将记录 ID 添加为 WHERE 子句参数，以批量查询来自 Salesforce 实体的数据。\n\n通常，如果 Salesforce 中的对象超过\
  \ 1000 万行，则在导出其数据时应使用 PK 分块。如果你发现数据查询经常超时，请使用 PK 分块。\n\n鉴于 PK 分块通过添加 WHERE 子句并使用有序\
  \ ID 范围，将一个大的查询有效地拆分为多个独立的查询，因此可以设置批处理大小。默认值为 100,000（即每个批次默认返回 100,000 条记录），但最高可达\
  \ 250,000。因此，对于 1000 万行的实体，批处理大小为 250,000 时将返回 40 个数据批次。\n\n在*第 7 章“数据迁移”*中，我们通过一个实际示例了解了\
  \ PK 分块的工作原理。需要注意的是，可以将过滤查询与 PK 分块一起使用（即它们已经带有 WHERE 子句）。在这种情况下，每个子查询返回的记录数可能少于指定的批处理（或分块）大小。另外值得注意的是，由于查询针对整个表，它会返回（但会省略）软删除的记录。由于这些记录在给定查询的结果中被省略，因此返回的批处理大小可能小于该特定子查询指定的分块大小。\n\
  \n在 Salesforce 中查看 PK 分块作业时，其初始状态为 NOT_PROCESSED。任何失败的批次将具有 FAILED 状态，但后续批次仍将作为整个作业的一部分进行处理。\n\
  \n> **重要说明**\n>\n> 在启用 PK 分块的作业中进行过滤时，使用 ORDER BY 子句或任何形式的 ID 字段都会有效禁用 PK 分块，并且不会带来任何性能提升。\n\
  \n要启动 PK 分块批处理作业，请随编程请求发送 `Sforce-Enable-PKChunking` 头。以下是一个示例：\n\n```\nSforce-Enable-PKChunking:\
  \ chunkSize=250000;\nstartRow=001A0000000abcdef\n```\n\n在此示例中，分块大小已设置为 250000，查询的起始\
  \ ID 为 001A0000000abcdef。\n\n现在我们已经了解了查询大量数据以及如何使用 PK 分块来提高此类操作的性能，接下来让我们看看如何将海量数据反方向导入\
  \ Salesforce。\n\n\n\n\n\n### 加载海量数据\n\n在向 Salesforce 平台加载大量数据时，我们主要关心的是如何在尽可能短的时间内，可靠地将尽可能多的数据导入\
  \ Salesforce 实例。假设我们要加载 2000 万条记录。从串行与并行处理的角度思考，我们可以从两个角度来看待加载场景：\n\n- 顺序（串行）加载\
  \ 2000 万条记录\n- 将 2000 万条记录拆分成较小的批次，并行插入，从而以更短的时间并行加载 2000 万条记录\n\n为了快速加载海量数据，我们需要优化并行数据加载。在加载任何数据之前，我们可以采取几个步骤来加速加载操作。将共享计算推迟到加载操作完成之后，意味着共享重计算只会运行一次，而不是在处理的每个记录批次上都运行。禁用数据加载时可能运行的任何逻辑（例如工作流规则、流和触发器），将确保加载数据时不会浪费宝贵的处理时间来运行这些自动化操作。当然，这依赖于数据以预处理状态插入，因为自动化操作不运行意味着某些字段值更新等操作不会被调用，因此需要离线手动处理。\n\
  \n接下来，让我们考虑可能出现的各种偏斜类型。例如，是否会有单个客户记录包含超过 10,000 个子记录？是否会有某个记录所有者拥有超过 10,000 条记录？是否会有超过\
  \ 10,000 个查找指向同一条记录？\n\n通过考虑各种类型的偏斜，我们可以在加载数据时规划并缓解这些潜在偏斜。我们可以设置多个客户记录来缓解客户偏斜，设置多个记录所有者来缓解所有权偏斜，并移除这些所有者的角色（但如果没有进行适当的影响分析，不要这样做），等等。针对预期的最终数据状态所带来的已知影响进行规划，对于加载大量数据大有裨益。\n\
  \n接下来应考虑记录锁。了解根据所加载记录的类型，记录将如何被锁定，意味着可以将源数据划分、排序，并以离散的并行批次加载。请注意任务锁定行为以及主从关系中明细记录的行为。\n\
  \n最后，可以根据数据量调整批次大小。例如，以顺序操作方式加载 2000 万条记录，与以 200 个批次、每批 100,000 条记录的方式加载，会产生不同程度的性能、记录锁定行为和數據偏斜。通过正确的规划，并考虑禁用自动化、延迟共享计算等因素，可以使用\
  \ Bulk API 高效加载数百万条记录。\n\n现在我们已经探讨了在向 Salesforce 加载海量数据时可以使用的技术，接下来总结一下本章涵盖的内容。\n\
  \n#### 总结\n\n在本章中，我们涉及了许多不同的概念，所有这些概念都与在 Salesforce 中处理数据时提高性能相关。我们首先回顾了 LDV 并介绍了瘦表。然后我们继续讨论了搜索和查询的优化，接着研究了任务锁及其对性能的影响。\n\
  \n本章接下来的议程是考虑将大量数据移出和移入 Salesforce。为此，我们介绍了 PK 分块，然后研究了在加载数百万条记录的情况下，以高性能方式将数据移入\
  \ Salesforce。\n\n在下一章中，我们将了解如何将数据移入和移出 Salesforce 用于数据备份和恢复场景。\n\n#### 练习题\n\n通过尝试回答以下问题来测试你对本章主题和概念的理解：\n\
  \n- 1. 哪种数据 API 支持以并行批次方式异步处理数据？\n- 2. 哪种 LDV 缓解技术可用于分区数据并减少 SOQL 查询返回的记录数？\n- 3.\
  \ 启用 PK 分块需要哪个标头？\n- 4. 使用 Bulk API 加载数据时，哪种模式被认为是最高效的——串行还是并行？\n- 5. 当 Salesforce\
  \ 执行索引搜索时，如果查询的过滤条件匹配什么，将使用标准索引？\n- 6. 当查询过滤条件匹配什么时，会使用自定义索引？\n- 7. 在缓解必须拥有角色的用户的所有权偏斜时，该角色应位于角色层次结构中的什么位置？\n\
  - 8. 对还是错？启用瘦表需要 Salesforce 支持。\n- 9. 对还是错？在缓解所有权偏斜时，应考虑移除与拥有 10,000 条或更多记录的用户相关联的角色。\n\
  - 10. 对还是错？加载大量数据时，禁用工作流规则和触发器之类的自动化操作并不是最佳实践。\n\n#### 答案\n\n练习题做得怎么样？在这里查看你的答案：\n\
  \n- 1. Bulk API\n- 2. 分区（Divisions）\n- 3. Sforce-Enable-PKChunking\n- 4. 并行\n- 5.\
  \ 前 100 万条记录中少于 30%（以及后续记录中少于 15%），最多 100 万条记录\n- 6. 总记录数中少于 10%，最多 333,333 条记录\n\
  - 7. 位于顶层\n- 8. 对\n- 9. 对\n- 10. 错\n\n#### 延伸阅读\n\n要了解有关本章所涵盖概念的更多信息，请查看以下资源：\n\n\
  - PK 分块：https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/async_api_headers_enable_pk_chunking.htm\n\
  - 瘦表：https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_infrastructure_skinny_tables.htm\n"
- "# 11\n\n## 备份与恢复\n\n虽然 Salesforce 在提供平台和底层数据设施以处理客户数据和自定义数据方面表现出色，但我们也应考虑如何将数据从\
  \ Salesforce 平台备份出来以及恢复到 Salesforce 平台。我们将研究可用于执行数据备份和数据恢复操作的各种方法。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 在 Salesforce Lightning 平台上备份和恢复数据的方法\n- 促进数据备份和恢复的 AppExchange 和外部软件\n\n在进入本章内容之前，让我们明确一点：我们将研究数据和元数据的备份与恢复。元数据是描述数据的数据，也是你对\
  \ Salesforce 平台进行自定义的格式。数据是存储在 Salesforce 组织中的实际数据，例如客户和商机数据。\n\n让我们开始探索备份和恢复，首先研究在\
  \ Salesforce 平台上进行数据备份和恢复时可用的方法。\n\n### 在 Salesforce Lightning 平台上备份和恢复数据的方法\n\n\
  在我们深入探讨备份和恢复数据的方法之前，让我们详细说明本章涉及的两个数据定义，即数据和元数据，因为在备份和恢复方面，两者交互方式不同。让我们从元数据开始。\n\n\
  ### 元数据简介\n\n元数据是描述数据的数据。当我们想到可扩展标记语言（XML）文件时，本质上它是一个包含数据（值）和元数据（标签）的文件。例如，请参见以下内容：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<person>\n\
  \    <firstname>Aaron</firstname>\n    <lastname>Allport</lastname>\n</person>\n\
  ```\n\n代码示例展示了一个简单的人物 XML 结构，包含名字和姓氏。在这里，我们可以使用元数据（person、firstname 和 lastname 标签）来推断我们表示的是一个名叫\
  \ Aaron Allport 的人。\n\nSalesforce 将对实例进行的一组自定义表示为一组元数据文件。例如，一个公用组 XML 表示如下：\n\n\
  ```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Group xmlns=\"http://soap.sforce.com/2006/04/metadata\"\
  >\n    <doesIncludeBosses>true</doesIncludeBosses>\n    <fullName>Packt</fullName>\n\
  \    <name>Packt</name>\n</Group>\n```\n\n在这里，我们可以从 XML 中推断出，有一个名为 Packt 的公用组，允许与该组共享的记录同时共享给组成员的经理。\n\
  \nSalesforce 将绝大多数自定义表示为 XML，因此它们可以轻松地被提取和存储。\n\n现在我们已经介绍了元数据如何用于描述数据，以及它在 Salesforce\
  \ 平台上对你的自定义的作用，接下来让我们看看什么是数据。\n\n### 什么是数据？\n\n在 Salesforce 领域中，数据被定义为已自定义的标准对象和已创建的自定义对象中存储在实例中的记录数据。虽然联系记录元数据可能定义了\
  \ FirstName 字段，但该字段中为每条记录存储的值就是该记录的数据。当数据从 Salesforce 平台导入或导出时，通常以逗号分隔值（CSV）格式表示，其中文件的第一行提供字段，后续行是每条记录的数据（每条记录在文件中表示为一行）。\n\
  \n\n\n\n\n其他格式也是可能的，使用中间件等进行一些转换逻辑。例如，一个 CSV 文件在导出几条 *联系人记录* 时看起来如下：\n\n```\nId,FirstName,LastName,Email\n\
  003abcdefghi123456,Aaron,Allport,aaron@aaronallport.com\n003jklmnopqr789012,John,Smith,j.smith@example.com\n\
  ```\n\n在理解了数据与元数据之间的区别之后，让我们质疑为什么我们首先应该备份数据和元数据。\n\n### 为什么备份数据和元数据？\n\n让我们快速了解一下备份数据和元数据的重要性。首先，Salesforce\
  \ 不会自动为你备份数据。因此，如果出现用户或自动化流程意外导致从你的 Salesforce 实例中无意丢失数据的情况，那么拥有可用于恢复操作的数据副本是有意义的。定期备份数据以防意外数据丢失或因业务运营需要进行数据导出，是被认为良好的做法。\n\
  \n正如备份数据被认为是良好的做法一样，Salesforce 提供了备份元数据的能力，有效地允许你保存组织的大部分（但不是全部）配置。这在从 Salesforce\
  \ 沙盒环境开发元数据更改时尤其有用，同时确保你保留 Salesforce 环境配置的备份。\n\n现在我们已经介绍了备份数据的一些场景，让我们探索导出和导入数据及元数据的各种方法。我们将从备份数据开始。\n\
  \n### 备份数据\n\nSalesforce 提供了三种平台原生方式来导出你的数据。虽然中间件可以促进更高级的数据检索和转换，但备份数据的相对直接的需求可以使用以下方式实现：\n\
  \n- 数据导出服务\n- 数据加载器\n- 报表导出\n\n让我们依次探索其中的每一个，从数据导出服务开始。\n\n- 一个 **仅明细** 报表，它导出所有报表行而不带任何格式。此格式支持选择导出文件类型，例如\
  \ Excel（.xls 和 .xlsx 均可）和 CSV。\n\n报表导出在调用导出时立即下载。\n\n数据导出的方法现在已介绍完毕，让我们探索如何将数据导入平台作为恢复数据的一种方式。\n\
  \n### 导入数据\n\n要原生地将数据导入 Salesforce 平台，当然有我们在其他章节中介绍过的 API，例如 Bulk API。然而，值得简要提及数据加载器应用程序和\
  \ Salesforce 用户界面中的数据加载器功能。\n\n#### 使用数据加载器应用程序导入数据\n\n正如数据加载器应用程序可用于从你的 Salesforce\
  \ 实例导出数据，它也可以用于导入数据。为此，必须提前准备用于对象数据的 CSV 文件，作为要导入的数据。在调用数据加载器应用程序导入数据时，要导入的 CSV\
  \ 的列可以映射到正在导入的对象的字段。\n\n#### 使用 Salesforce 用户界面中的数据加载器功能导入数据\n\nSalesforce 设置支持使用\
  \ CSV 文件将数据导入对象，与数据加载器独立应用程序的方式大致相同，包括为目标对象映射列。\n\n现在我们已经介绍了导入数据，让我们继续导出元数据。\n\n\
  ### 备份元数据\n\n当谈到备份 Salesforce 实例的元数据时，有几种方法可以利用来做到这一点。这些包括以下内容：\n\n- 沙盒刷新\n- 变更集\n\
  - SFDX\n- Ant 迁移工具\n\n让我们依次探索其中的每一个。\n\n### 沙盒刷新\n\n可能最简单地从生产 Salesforce 实例备份元数据的方式是启动沙盒刷新。此功能使用生产元数据的副本创建或刷新指定的沙盒环境（但根据沙盒环境类型，数据可能存在也可能不存在）。\n\
  \n沙盒刷新已介绍完毕，让我们研究变更集。\n\n#### 变更集\n\n变更集通常是许多 Salesforce 管理员和开发人员学习的第一种方式，用于将选定的元数据更改从沙盒环境移动到生产环境。变更集对开发人员不友好，本质上充当非开发人员在\
  \ Salesforce 环境之间移动一组元数据的默认方式。虽然大多数变更集的使用是为了将更改移入生产环境，但变更集也可以用于将更改从生产环境移动到特定的沙盒环境。\n\
  \n在了解了变更集如何用于在环境之间选择性地移动元数据之后，让我们了解一下 Salesforce Developer Experience（SFDX）。\n\n\
  ##### SFDX\n\n作为一套面向开发者的命令行实用工具，SFDX 允许将元数据更改从生产环境或用户具有登录访问权限的从生产环境创建的任何沙盒导出和导入。了解\
  \ SFDX 使用的具体细节对于考试并不重要，但知道开发者可以使用它从 Salesforce 导出元数据是有用的。\n\n##### Ant 迁移工具\n\n\
  与 SFDX 类似，Ant 迁移工具是另一个用于在本地目录和 Salesforce 实例之间移动 Salesforce 元数据的命令行实用工具。同样，与 SFDX\
  \ 一样，Ant 迁移工具可用于将 Salesforce 元数据从生产环境移动到本地目录。\n\n现在我们已经探索了备份元数据，让我们继续导入元数据。\n\n\
  ### 导入元数据\n\n正如你现在可以想象的那样，除了沙盒刷新流程之外，所有方法都可用于导入元数据，作为将元数据恢复到 Salesforce 实例的一种方式。让我们从变更集开始。\n\
  \n#### 变更集\n\n通过捕获选定的元数据工件集并将其从一个 Salesforce 环境移动到另一个环境，变更集可用于将一组更改从一个环境恢复到另一个环境。想象一下\
  \ Salesforce 环境意外地从生产环境刷新——如果有另一个包含更新的元数据工件集的 Salesforce 环境，那么变更集就可以作为执行元数据恢复的一种手段。\n\
  \n让我们现在探索 SFDX 作为恢复元数据的手段。\n\n##### SFDX\n\n使用 SFDX，可以使用本地文件系统或源代码存储库来存储元数据文件。因此，这是一个合适的手段，可以从本地文件存储或存储库对特定环境执行选择性元数据恢复活动。\n\
  \nSFDX 重新介绍完毕后，让我们简要了解一下 Ant 迁移工具。\n\n##### Ant 迁移工具\n\n同样，与 SFDX 类似，Ant 迁移工具可用于从本地文件目录对特定\
  \ Salesforce 环境执行元数据恢复，尤其是在恢复场景中为生产环境。\n\n现在我们已经探索了导入元数据，让我们现在研究 AppExchange 和促进数据和元数据备份与恢复的外部软件。\n\
  \n### AppExchange 和促进数据备份与恢复的外部软件\n\n在 Salesforce 平台上处理数据备份和恢复时，自然会有开发人员和软件供应商探索数据备份和恢复如何超越\
  \ Salesforce 提供的原生平台功能。正如平台上许多用例的常态，例如为特定行业垂直领域提供的业务逻辑行业特定扩展，也存在 AppExchange 套件和完整的外部软件来支持数据备份和恢复操作。\n\
  \n例如，Salesforce Backup and Restore 是你 Salesforce 订阅的付费附加组件，可促进对 Salesforce 实例中保存的数据和元数据的定期自动备份。然后可以使用这些备份根据需要将数据和元数据恢复到你的\
  \ Salesforce 实例，而不论最初需要该操作的原因是什么，例如人为错误。\n\n有一些 AppExchange 套件可促进 Salesforce 数据和元数据的自动备份和恢复，通常备份到平台外设施。这些会产生与\
  \ Salesforce 订阅分开的费用，因为它们涉及与不同的软件供应商签约。这随后允许使用 AppExchange 套件作为到该外部平台的各种操作的中介，例如数据备份和恢复。要了解更多关于促进数据和元数据在\
  \ Salesforce 平台内外备份和恢复的 AppExchange 套件的信息，请阅读更多内容 https://appexchange.salesforce.com/appxSearchKeywordResults?keywords=backup%20and%20recovery。\n\
  \n\n\n\n\n接下来，还有一些功能完善的外部软件包支持数据和元数据的备份与恢复，通常与 SFDX 集成以进行元数据操作。对这些软件包的复杂理解超出了考试范围（因此也超出了本书范围），但它们都自动化并促进了自动化的沙盒配置以及数据和元数据的备份与恢复，并且通常作为\
  \ **持续集成/持续部署 (CI/CD)** 管道的一部分与自动化工作流集成。\n\n让我们现在总结一下本章所涵盖的内容。\n\n#### Summary\n\
  \n在本章中，我们研究了在 Salesforce 平台上工作时备份和恢复数据和元数据的各种方法。我们首先分解了数据和元数据之间的区别，然后再进入从原生或平台角度来看备份和恢复元数据和数据时可用的工具。\n\
  \n接下来，我们研究了 AppExchange 和外部软件，这些软件促进备份和恢复，涵盖了它们为促进甚至加快此任务所做的工作。最后，我们研究了导出和导入数据时的一些最佳实践。\n\
  \n在下一章中，我们将探讨 Territory Management 以完成我们的学习材料。\n\n#### Practice questions\n\n通过尝试以下练习题来测试你对本章所涵盖概念的理解：\n\
  \n- 1. Which Salesforce feature allows for selected metadata changes to be migrated\
  \ from one environment to another?\n- 2. What is the name of the standalone application\
  \ that facilitates data imports and exports to and from the Salesforce platform?\n\
  - 3. Which report export format supports CSV, XLS, and XLSX?\n- 4. Which facility\
  \ allows for monthly backups?\n- 5. What format is the file from a monthly backup?\n\
  - 6. What is metadata?\n- 7. What metadata backup facility is used to create a production-like\
  \ instance of Salesforce?\n- 8. Which two metadata backup and restore technologies\
  \ work with local or source-controlled copies of metadata?\n- 9. What does CSV stand\
  \ for?\n- 10. In a CSV file, the first row of data is the what?\n\n#### Answers\n\
  \n你在回答练习题时表现如何？在此查看你的答案：\n\n- 1. Change sets\n- 2. Data Loader\n- 3. Details Only\n\
  - 4. The Data Export service\n- 5. A zip file containing several CSVs\n- 6. Data\
  \ that describes data\n- 7. Sandbox refreshes\n- 8. SFDX and the Ant Migration Tool\n\
  - 9. Comma-Separated Value\n- 10. The field names to which the values in the following\
  \ rows pertain\n\n#### Further reading\n\n有关本章所涵盖的概念和主题的更多信息，请参阅以下资源：\n\n- *Best\
  \ practices to backup Salesforce data:* https://help.salesforce.com/s/articleView?id=000334121&type=1\n\
  - *Export data using Data Loader:* https://help.salesforce.com/s/articleView?id=sf.exporting_data.htm&type=5\n\
  - *Export data using report exports:* https://help.salesforce.com/s/articleView?id=sf.reports_export.htm&type=5\n\
  - *Export data using weekly backups:* https://help.salesforce.com/s/articleView?id=sf.admin_exportdata.htm&type=5\n\
  - *Create a Sandbox:* https://help.salesforce.com/s/articleView?id=sf.data_sandbox_create.htm&type=5\n\
  - *Ant Migration Tool Guide:* https://developer.salesforce.com/docs/atlas.en-us.daas.meta/daas/meta_development.htm\n\
  - *SFDX:* https://developer.salesforce.com/tools/sfdxcli\n\n在内部，Enterprise Territory\
  \ Management 是一种共享方式。出于这个本质，Salesforce 利用规则引擎，根据你如何设置 Enterprise Territory Management\
  \ 来执行共享和相关实时重新计算。\n\n在我们深入了解 Enterprise Territory Management 的具体设置方式之前，让我们先介绍一些特定于\
  \ Enterprise Territory Management 的术语，如下所示：\n\n- **Territory**\n- **Territory Type**\n\
  - **Territory Type Priority**\n- **Territory Model**\n- **Territory Model State**\n\
  - **Territory Hierarchy**\n\n我们将逐一介绍这些术语，从 territory 的定义开始。\n\n### Territory\n\n\
  **territory** 可以被视为对 Salesforce 实例中账户记录的分组以及处理这些账户记录的用户。Territories 是从 territory\
  \ types 创建的。Territories 可以是分层的。例如，完全可以有一个名为美国的 territory，其子 territory 为西北、东北、西南、东南和中部。Territory\
  \ 记录包含以下几个关键信息：\n\n- 分配给 territory 的用户\n- 任何分配的账户\n- Territory/Account Assignment\
  \ Rules（账户的特征意味着它将被分配到此 territory）\n\n接下来，让我们查看 territory type 的定义。\n\n#### Territory\
  \ Type\n\n**Territory Types** 用于根据账户规模、账户账单州或指定账户等标准组织和创建 Territories。创建 Territories\
  \ 时，它们是从 territory type 创建的。Territory Types 不会出现在 Territory Management 设置过程中创建的\
  \ territory model 层级中。\n\n例如，可以创建一个名为 *UK County-Based Accounts* 的 territory，其中\
  \ territories 可以根据 Account 记录中 **state** 列表中的 **UK County** 值创建。\n\n在了解了 territory\
  \ type 之后，让我们转向 territory type Priority。\n\n#### Territory Type Priority\n\n**Territory\
  \ Type Priority** 是一个自定义方案，你可以定义它，用于在从你定义的 territory types 创建 territory 记录时提供帮助。例如，你可能有\
  \ 1 到 5 的 territory type Priority 值，以表示在创建 territory 记录时与企业销售策略保持一致的优先级。这可能意味着西南\
  \ Territory 被赋予 1 的优先级，因为企业预计在下一个财政年度在此地看到最多的增长。本质上，Territory Type Priority 用于确保在创建新的\
  \ territory 记录时，正确的 territory types 具有优先权。\n\n现在我们已经介绍了 Territory Type Priority\
  \ 的定义，让我们来探索 territory model。\n\n#### Territory Model\n\nterritory model 是你为 Salesforce\
  \ 实例定义的完整 territory management 系统的表示。你可以有多个 territory models，但同一时间只能有一个处于活动状态。Salesforce\
  \ 提供了一个漂亮的 territory models 图形层级结构，有助于我们可视化 Territories 的组织方式，包括层级结构。territory models\
  \ 允许你测试账户和用户记录分配的工作方式，因此允许你在激活它之前尝试查看实现特定 territory model 会产生什么影响。\n\n> **Important\
  \ note**\n> \n> Salesforce Enterprise Edition 仅允许同时存在两个 territory models。Performance\
  \ 和 Unlimited 版本可以有四个 territory models。相同的限制适用于从使用这些 Salesforce 版本的生产实例创建的 Salesforce\
  \ 沙盒环境。记住同一时间只能有一个 territory model 处于活动状态。\n\n在介绍了 territory model 之后，让我们现在查看 territory\
  \ model state 的定义。\n\n#### Territory Model State\n\nTerritory Models 被分配一个 **state**\
  \ 值，以便快速允许给定 territory model 的状态。有三个可用值，如下所示：\n\n- **Planning:** 所有 territory models\
  \ 默认此值。可以认为它表示 territory model 正在开发中/处于草稿状态。\n- **Active:** territory model 处于活动状态。记住，同一时间只能有一个\
  \ territory model 处于活动状态。\n- **Archived:** 之前处于活动的 territory model 已归档，因为另一个 territory\
  \ model 已被激活。一旦 territory model 被归档，就无法重新激活。\n\n> **Important note**\n> \n> 当 territory\
  \ model 被归档（或你决定删除活动 territory model 上的一个 territory）时，Opportunity 记录上的 **Territory**\
  \ 字段将被设置为空白值，适用于之前分配了活动 territory 的 Opportunity 记录。\n\n在激活或归档 territory model 时，可能会发生错误。如果发生这种情况，territory\
  \ model 的状态将被设置为 **Activation Failed** 或 **Archiving Failed**。Salesforce 将向你发送一封电子邮件，其中包含失败原因的详细信息。\n\
  \n接下来，让我们查看 Territory Hierarchy。\n\n#### Territory Hierarchy\n\n**Territory Hierarchy**\
  \ 显示 territory model 的结构化视图。Territory Hierarchy 是与 territory model 的主要交互点，也是可以创建、编辑和删除\
  \ Territories 的地方。它也是可以执行分配规则并将 Opportunities 分配到 Territories 的地方。\n\n在介绍了 Territory\
  \ Hierarchy 的定义之后，让我们深入了解 Enterprise Territory Management 的设置方式。\n\n#### Implications\
  \ of territory management on data model design and sharing records\n\n**Territory\
  \ management** 本质上促进了基于规则集的记录自动共享，该规则集由在你的 Salesforce 实例中激活的 territory model 定义。**Organization-Wide\
  \ Defaults (OWDs)** 的设置方式将影响 territory management 实现在你的组织中的工作方式。这是因为 territory management\
  \ 提供的共享以及账户和机会的分配可能不会在已有的共享之外提供任何进一步的记录访问。在这种记录共享没有差异的情况下，territory management 本质上成为组织记录的工具。可以利用\
  \ Territory management 报表类型，根据活动 territory model 将账户和机会分配给用户提供报告。\n\n在默认账户和机会模型设置为\
  \ **Private** 的情况下，territory management 可用于设置与用户共享的账户和机会记录的访问级别。例如，账户和机会可能根据你 Salesforce\
  \ 实例的 OWD 配置为 **Private**。Territory Management 可用于将与用户共享的 Opportunity 记录的记录访问配置为只读或读写。\n\
  \n\n\n\n\n如果一个区域属于区域层级结构，那么区域层级结构中位于已分配区域之上的区域记录会继承该已分配区域的共享设置。让我们通过一个示例来更详细地解释这一点。\n\
  \n让我们假设以下图表中显示的区域层级结构已被配置。假设组织范围默认共享设置已设置为“私有”，针对账户和商机记录，并且在未使用区域管理的情况下，被分配到区域的用户否则无法访问这些记录。以下图表中表示的共享将是为区域层级结构中每个区域设置的共享：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_179_0.png)\n\n图 12.1 – 一个区域模型示例\n\n在我们的示例中，被分配到东盎格利亚区域记录的用户将对埃塞克斯、萨福克和诺福克区域记录具有读取访问权限。尽管东盎格利亚区域上的访问权限为\
  \ R/W（读取/写入），但区域访问权限不会被继承。因此，对子埃塞克斯/萨福克/诺福克记录的访问仍保持为只读。\n\n#### 重要说明\n\n对商机记录的自动区域分配需要编辑生成的\
  \ Apex 类，这需要 Apex 编程技能。Apex 编程超出了考试范围，因此本书中不会涵盖。\n\n账户记录的区域分配可以配置为在从区域模型层级屏幕创建账户分配规则时作为声明式功能的一部分自动运行。\n\
  \n现在我们了解了区域管理是如何在 Salesforce 共享模型中为账户和商机记录共享提供另一层，接下来让我们思考一下区域管理如何将共享扩展到与账户或商机关联的其他子记录。\n\
  \n例如，一个具有到账户的 **主从** 查找的自定义对象意味着该自定义对象的记录如果通过区域管理共享给用户的账户，则用户将可以看到这些记录。这可能会无意中打开超出在实施区域管理前设想的记录访问权限，因此应考虑区域模型。分层应用适用于已共享账户或商机记录的基于标准的共享规则可能会导致其他非预期副作用。因此，彻底测试你的模型对于成功在组织中推广至关重要。\n\
  \n作为提醒，主从关系意味着用户在处理子记录时继承他们对父记录的访问权限。这对数据模型的设计可能产生深远影响，因为区域管理可能会给其他对象数据带来非预期的更高访问权限（例如根据区域设置可能获得编辑权限）。因此，数据模型设计、对象之间的关系以及与数据模型设置相关的其他因素都将受到区域管理实施的影响。\n\
  \n让我们快速看一个示例来解释实施区域管理可能产生的一些非预期副作用，这意味着数据模型可能需要修订：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_180_0.png)\n\
  \n图 12.2 – 数据模型示例\n\n以此数据模型示例作为指导，我们可以看到私有 OWD 正在生效。请注意从 **账户** 到自定义账户计划对象（表示为 **AcctPlan__c**）的主从关系。\n\
  \n现在，假设我们启用了一个区域模型，该模型以读取和编辑访问权限将账户记录共享给某些用户。这些用户现在可以访问账户计划，甚至可以编辑账户计划记录。假设只有账户所有者才应能够创建或编辑账户记录的账户计划。因此，从一开始将关系类型设置为从账户计划到账户的查找类型可能更明智（因为查找允许根据\
  \ OWD 设置指定的共享默认值）。当然，事后诸葛亮总是好事，但仔细规划也会带来回报，尤其是在处理共享的副作用时。Salesforce 提供了其他记录共享方法，这意味着在区域管理下账户计划记录可以实现私有、只读访问。\n\
  \n回顾 OWD 和 Salesforce 实例设置的基础知识，对于账户记录的内部 OWD 为“公开只读”或“公开读写”的组织而言，用户不会看到记录可见性的增加。具有公开只读权限的组织可以使用区域管理为某些账户记录向用户授予更高级别的访问权限，如果共享用例适合区域管理。\n\
  \n现在我们已经介绍了区域管理如何影响共享，以及实施区域管理可能如何影响数据模型的设计，让我们总结一下本章所涵盖的内容。\n\n#### 总结\n\n在本章中，我们研究了企业区域管理，并探讨了它如何影响\
  \ Salesforce 平台上的解决方案设计和共享。我们现在了解了区域管理如何影响数据模型设计以及记录共享如何受到影响。我们通过几个示例来阐述这些要点，并强调在实施区域管理之前，彻底评估数据模型设计、共享以及与\
  \ Salesforce 实例设置相关的其他因素至关重要。\n\n在掌握了企业区域管理之后，我们可以在第 13 章《练习考试题目》中检验我们对本书所涵盖内容的知识。\n\
  \n#### 练习题\n\n通过尝试以下练习题来测试你对本章所学材料的掌握：\n\n- 1. Salesforce 曾经有两种区域管理类型，但现在只支持一种。它被称为什么？\n\
  - 2. 什么功能允许你配置父/子区域关联？\n- 3. 区域管理的哪个特性允许在从区域类型创建区域时对某些区域类型进行优先级排序？\n- 4. 假设有一个活跃的区域模型，授予选定用户对属于某个区域的账户记录的读写访问权限。账户记录与一个包含与账户记录关联的子记录的自定义对象具有主从关系。用户对这些自定义对象记录有什么访问权限？\n\
  - 5. 真或假？区域管理模型可以在激活前进行测试。\n- 6. 真或假？开箱即用，只有账户记录可以通过声明式方式使用区域管理进行分配。\n- 7. 如何使用区域管理配置选定（即使用筛选器）的商机记录分配？\n\
  - 8. 用最简单的定义，区域管理做什么？\n- 9. 使用区域管理，如果用户被分配到属于某个特定区域的账户，且访问级别为只读，他们对父区域有什么访问权限？\n\
  - 10. 区域模型有哪三种状态？\n\n#### 答案\n\n你在回答练习题时表现如何？在这里查看你的答案：\n\n- 1. 企业区域管理。\n- 2. 区域层级结构。\n\
  - 3. 区域类型优先级。\n- 4. 读写。\n- 5. 真。\n- 6. 真\n- 7. 它们不会以这种方式配置。区域管理商机分配是通过编辑 Apex 类来工作的。\n\
  - 8. 它根据与记录关联的标准共享账户和商机记录，以选择一组用户。\n- 9. 只读，因为区域管理会向上传播共享访问权限。\n- 10. 规划、活跃和已归档。\n\
  \n#### 延伸阅读\n\n要了解更多关于区域管理的信息，请查阅 *Territory Management Implementation Guide*，网址为\
  \ https://resources.docs.salesforce.com/latest/latest/en-us/sfdc/pdf/salesforce_implementing_territory_mgmt2_guide.pdf。\n"
