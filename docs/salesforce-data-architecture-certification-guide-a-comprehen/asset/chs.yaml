  \n## Other Books You May Enjoy 232\n\n## Preface\n\nSalesforce 技能，尤其是 Salesforce\
  \ 架构师的技能，随着 Salesforce 生态系统在全球范围内的不断发展而持续增长。本书聚焦于 Salesforce 架构师课程的一个主题领域，即数据架构。Salesforce\
  \ 认证数据架构师考试在初次阅读考试大纲时可能显得有些令人生畏，我自己当时也是如此。但不必如此。我很幸运第一次就通过了考试，这得益于我在数月时间内收集信息并研读\
  \ Salesforce 文档。本书是我在备考时希望拥有的书籍，因为它专门涵盖了考试理论部分所需的材料。\n\n我们将依次逐一讲解考试大纲中涵盖的各个领域，从数据建模、主数据管理、Salesforce\
  \ 数据管理、数据治理和大数据量到数据迁移。理解这些对于覆盖考试中测试的理论至关重要。而且，这些理论可以直接应用于你在担任 Salesforce 架构师角色时所构建和维护的解决方案中。\n\
  \n然后我们将把注意力转向通过额外的主题来应用概念，这些主题虽然不总是明确列在教学大纲中，但将完善你对应用 Salesforce 数据原则的了解。这些主题包括对账户和联系人、API\
  \ 和 Apex、性能调优、备份和恢复以及区域管理的深入探讨。这些主题中的每一个都将解释数据模型、共享以及因此以这些主题为出发点构建的任何解决方案是如何受到影响的。\n\
  \n最后，我们将查看练习题（附答案）和一些复习辅助资料。读完本书后，你将掌握通过 Salesforce 认证数据架构师考试所需的主题，并能够在日常的 Salesforce\
  \ 架构师工作中实施 Salesforce 数据设计最佳实践。\n\n第 10 章《性能调优》探讨了在 Salesforce 平台上设计可扩展应用程序时可用的各种性能调优方法。\n\
  \n第 11 章《备份和恢复》概述了将数据从 Salesforce 平台导出和导入的可用方法，重点关注数据备份和恢复。\n\n第 12 章《区域管理》介绍了 Salesforce\
  \ 区域管理以及它与 Salesforce 平台上的数据模型和用法设计的关系。\n\n第 13 章《模拟考试题》提供了类似考试的题目，以进一步实践你所学到的理论并加强你对考试课程主题领域的理解。\n\
  \n第 14 章《速查表》介绍了实用的参考速查表，为复习或日常工作提供快速参考指南。\n\n第 15 章《更多资源》重点介绍了其他信息链接，可以增强你对本书所涵盖材料的理解。\n\
  \n第 16 章《如何参加考试》描述了你参加考试所需执行的操作。\n\n第 17 章《练习题答案》提供了第 13 章《模拟考试题》中问题的答案。\n\n## To\
