  ```\n\nSalesforce数据存储分配：\n\n```\nhttps://help.salesforce.com/s/articleView?id=sf.overview_storage.htm&type=5\n\
  ```\n\nCDP：\n\n```\nhttps://www.salesforce.com/ap/solutions/customer-360/\n```\n\
