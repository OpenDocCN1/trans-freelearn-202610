  \ Salesforce Data Architect Journey*\n- *Chapter 2, Data Modeling and Database Design*\n\
  - *Chapter 3, Master Data Management*\n- *Chapter 4, Salesforce Data Management*\n\
  - *Chapter 5, Data Governance*\n- *Chapter 6, Understanding Large Data Volumes*\n\
  - *Chapter 7, Data Migration*\n\n#### Introducing the Salesforce Data Architect\
  \ Journey\n\nSalesforce Certified Data Architect 认证是每个 Salesforce 架构师认证之旅中的重要组成部分。它构成了\
  \ Certified Technical Architect 认证中 Application Architect 领域的组成部分，但鉴于通过考试所需的各种复杂性和知识，它也可以独立存在。作为架构师，我们受托构建可扩展的基础，供我们的用户有效执行，而数据是企业的生命线。了解数据与\
  \ Salesforce 平台的关系、怪癖和注意事项对于设计为用户提供价值的应用程序至关重要。通过该认证证明了对这些概念的先进知识。本书将为您提供通过考试所需的理论和技能。\n\
  \n在本章中，我们将通过介绍各个课程领域以及为什么了解它们不仅对通过考试很重要，而且对在 Salesforce 架构师日常角色的这一方面取得卓越也很重要，来了解\
  \ Salesforce Certified Data Architect 认证。\n\n接下来，我们将概述本书中涵盖的学习之旅。\n\n在本章结束时，您将能够了解构成该认证的主题领域，了解\
  \ Salesforce 数据架构师是什么，并了解本书中学习之旅的结构。\n\n在本章中，我们将涵盖以下主题：\n\n- What is the Data Architecture\
  \ and Management credential?\n- Introducing the exam\n- Profile of a Salesforce\
  \ Data Architect\n- Introducing the learning journey\n\n#### What is the Data Architecture\
  \ and Management credential?\n\n**Salesforce Certified Data Architect credential**\
  \ 是 Salesforce 引入的多个认证之一，最初旨在解决三个主要挑战：\n\n- 随着 Salesforce 实施规模和复杂性的增加，对良好的数据管理的需求日益增加，包括\
  \ Salesforce 中数据架构和管理方面的最佳实践。数据是许多企业的生命线，而 Salesforce 作为保存数据的平台的架构很重要。\n- Certified\
  \ Technical Architect 认证与其他可用认证之间所需的知识存在巨大差距。过去 CTA 的唯一先决条件是您必须持有 Salesforce Certified\
  \ Administrator 认证并回答多项选择题 *pre-exam*！\n- 并不是每个人都想成为一名全面的 Salesforce Certified Technical\
  \ Architect。相反，他们可能希望专注于一个或多个特定的技术领域或 Salesforce 平台的方面。\n\n简单来说，该认证将重点放在 Salesforce\
  \ 平台的数据架构方面。通过该认证的候选人必须学习构成该认证教学大纲的广泛理论、技术和注意事项，这些内容基于 Salesforce Customer 360 平台上数据架构师所需的实际知识。通过学习通过\
  \ Salesforce Certified Data Architect 认证所需的一切，候选人将拥有知识和理解工具箱，可以从中汲取灵感，从而提高他们在考虑\
  \ Salesforce 平台数据方面的能力，提供解决方案的能力。\n\n#### Introducing the exam\n\n考试格式包括 60 道多项选择题，考生有\
  \ 105 分钟完成考试。截至撰写本文时所需的通过分数为 58%，考试没有书面先决条件（尽管，正如您很快就会发现的那样，如果没有必要的学习和对 Salesforce\
  \ 平台的基础知识，直接参加这项考试极具挑战性）。不熟悉 Salesforce 平台的人将难以理解本书中介绍的许多概念，因此更实际的做法是拥有足够的平台经验，以了解数据模型的工作方式、有哪些标准对象等等。这通常相当于使用该平台几年，但这取决于之前的经验。\n\
  \n分解题目数量、测试时间和所需通过分数，我们可以得出以下结论：\n\n- 我们有 1 分钟 45 秒来回答每个问题。\n- 我们需要 35 个正确答案才能通过考试。\n\
  \n考试在虚拟环境中进行，可以在测试中心或在线进行，均使用 Webassessor。相关流程将在本书末尾介绍。\n\n**Preparing for Success**\n\
  正如您可能已经知道的那样，网上有资源，例如 Trailhead（`https://trailhead.salesforce.com`）——具体来说是 Data\
  \ Architect and Management Trail mix（`https://trailhead.salesforce.com/en/users/strailhead/trail\
  \ mixes/architect-data-architecture-and-management`）——以及涵盖特定主题理论的博客。为了增强您的学习之旅，我想介绍一些您可以采用的习惯，以提高成功的潜力。\n\
  \n#### Playground environments\n\nSalesforce 提供免费的 **Developer Edition** 组织（有时称为\
  \ **DE** 组织），它们具有核心 Salesforce 平台的许多付费功能（因此不包括 Marketing Cloud 或 Tableau 等）。这些允许候选人在真实的\
  \ Salesforce 环境中尝试本书中解释的许多概念，以探索特定概念或功能的实际影响。例如，完全可以创建一个与外部数据源交互的外部对象，以便我们了解以这种方式与平台外数据交互时的可用性和其他限制。我强烈建议您在学习工具包中至少拥有一个\
  \ DE 组织。您可以在 `https://developer.salesforce.com/signup` 注册 DE 组织。\n\n#### Documenting\
  \ designs and design decisions\n\n另一种有助于学习过程及以后的习惯是开始记录以下内容：\n\n- Artifacts\n- Design\
  \ decisions\n\n虽然这可能不是每个人的最终目标，但 **Certified Technical Architect (CTA)** 评审委员会考试要求候选人制作多个工件。这些包括数据模型、系统集成景观、参与者/许可证、角色层级等等。\n\
  \n\n\n\n每个需求的行项目，其中包含*功能考虑*和*技术考虑*列，用于记录此类项目。\n\n#### Application Architect 领域中的其他\
  \ Salesforce 认证\n\n如您所知，每个 CTA 领域都有多项 Salesforce 认证。具体到 Application Architect 领域，其包含以下认证：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_25_0.png)\n\n图 1.2 – Application Architect\
  \ 领域\n\n您可能已经拥有 Application Architect 领域中的部分或全部其他认证。对于那些可能还没有的人，我强烈建议您在成为 Salesforce\
  \ Data Architect 的旅程中，获取 Platform App Builder 和 Platform Developer 1 认证。这两项考试都包含与平台数据相关的基础问题，可以成为获得\
  \ Salesforce Certified Data Architect 认证的另一个*推动因素*。\n\nSharing and Visibility Designer\
  \ 认证与 Data Architect 认证会有一些重叠，因为 Salesforce 平台上的数据和共享相对紧密相连。完成此认证后，我建议您继续学习 Sharing\
  \ and Visibility Designer 认证，因为本书中将介绍的一些概念与该认证相关。您可以看到 Application Architect 认证之间的关系，以及如果您尚未获得\
  \ Platform Developer 1 和 Platform App Builder 认证中介绍的基础知识，那么获得这些基础知识是有用的（尽管这些并非参加\
  \ Data Architect 考试的严格先决条件）。根据上图，完成相应考试后会自动获得 Application Architect 领域认证。\n\n既然我们了解了认证和考试的形式（包括一些有助于加强学习的技巧和习惯），让我们来分析一下\
  \ Salesforce Data Architect 的工作职责。\n\n#### Salesforce Data Architect 的简介\n\n根据**Salesforce\
  \ Certified Data Architect 考试指南**（位于 https://trailhead.salesforce.com/help?article=Salesforce-Certified-Data-Architecture-and-Management-Designer-Exam-Guide），Salesforce\
  \ Data Architect 是指具备以下能力的人：\n\n> ...评估架构环境和需求，并在 Customer 360 平台上设计健全、可扩展且高性能的解决方案，这些解决方案与企业数据管理相关。候选人熟悉信息架构框架，涵盖主要构建模块，如数据源、集成/移动、持久化、主数据管理、元数据管理和语义协调、数据治理、安全和交付。\n\
  \n> 候选人还拥有评估客户在数据质量方面的需求并创建解决方案以确保高质量数据（例如，无重复、数据正确）的经验，并且可以推荐组织变革以确保适当的数据管理。候选人拥有向业务利益相关者传达解决方案和设计权衡的经验。\n\
  \n让我们稍微分解一下这个定义。\n\n该定义的第一段包含很多术语，但最终，它描述了一个能够理解需求并在制定解决方案或设计时应用数据架构原则和经验的人。对我来说，这是我们日常工作的一部分：理解需求和设计解决方案。其中还提到了性能、数据管理、安全性、可扩展性和治理。第二段侧重于数据质量和管理。所有这些方面都将在本书中涵盖。\n\
  \n当我们关注 Data Architect 的职责时，可以发现许多与谦逊的 Salesforce 管理员、顾问或架构师的相似之处——我们倾听利益相关者的需求，并设计满足这些要求的解决方案，同时始终注意在此过程中可能出现的考虑因素和权衡取舍。\n\
  \nData Architect 运用其对 Salesforce Customer 360 平台数据架构的知识，包括其功能及其在设计或解决方案时对系统的影响，例如以下方面：\n\
  \n- 基于对象之间关系选择的共享和安全影响\n- 大数据量的考虑和缓解措施\n- 知道在何处使用哪种类型的对象（标准、自定义、大对象或外部对象）\n- 索引\n\
  - 性能\n- 数据管理和治理\n- 从平台加载和提取数据，以及可用于影响这些操作性能的方法\n\n在稍微分解了 Salesforce Data Architect\
  \ 的职责定义之后，我们可以将注意力转向本书将要介绍的学习旅程。\n\n#### 学习旅程简介\n\n在本书中，认证学习旅程将分为考试的理论部分和设计者部分。理论部分将与考试指南中描述的课程紧密对应，而*设计者*部分则专门学习理论中引用的实际概念——例如，了解\
  \ Person Accounts 及其如何影响数据模型和共享。\n\n学习旅程从考试背后的理论概念开始：\n\n- 数据建模和数据库设计：\n  - 理解 Salesforce\
  \ 数据模型的架构方式、其背后的设计决策，以及该模型如何影响共享和安全性。\n  - 理解不同类型的对象，以及它们如何融入数据模型设计策略。\n  - 理解数据倾斜，这将帮助您理解\
  \ Salesforce 中的这一概念。\n- 主数据管理：\n  - 理解如何在 Salesforce 平台上有效设计和实施**主数据管理（MDM）**策略。\n\
  \  - 能够阐述*黄金记录*的概念，跨多个数据源保持数据可追溯性，并理解这如何影响业务规则运行的上下文。\n- Salesforce 数据管理：\n  - Salesforce\
  \ 许可证类型如何影响数据模型和可用的共享选项。理解这些以及如何治理平台上的数据，对于设计可扩展、高性能的解决方案（这些方案组合来自一个或多个 Salesforce\
  \ 实例的数据）至关重要。\n- **数据治理：**\n  - 能够保护 Salesforce 平台上的数据是 Salesforce Data Architect\
  \ 角色的关键部分。本章涵盖构建合规解决方案背后的概念，以及 Salesforce 平台如何支撑企业数据治理策略。\n- **大数据量：**\n  - 虽然 Salesforce\
  \ 平台可以处理大量数据，但对于更大/海量的数据（称为*大数据量*）以及平台性能如何受到影响，需要考虑一些因素。\n  - 本章涵盖 LDV 的考虑因素和缓解措施，以及可扩展的数据模型设计和数据归档策略。\n\
  - **数据迁移：**\n  - 如何将高质量数据导入 Salesforce 平台？\n  - 如何确保大量数据的加载顺畅、可靠、可重复且及时？\n  - 如何有效地从\
  \ Salesforce 平台导出数据？\n\n接下来，我们将了解设计者概念，这些概念应用实践知识和实践来完善理论：\n\n- **账户和联系人：**\n  -\
  \ 我们将介绍 Account/Contact 模型，包括 Person Accounts、Contacts to Multiple Accounts、账户倾斜，以及这对查询和报告性能的影响。\n\
  - **数据 API 和 Apex：**\n  - 我们将了解各种 Lightning Platform API 和 Apex 操作（包括数据库、批处理和异步操作），以及如何在\
  \ Salesforce Customer 360 平台上设计数据操作时有效部署它们。\n- **性能调优：**\n  - 我们将了解在 Salesforce\
  \ Customer 360 平台上设计 Salesforce 应用时可用的各种性能调优方法。\n- **备份和恢复：**\n  - 我们将了解可用于从 Salesforce\
  \ 平台导出数据和将数据导回的方法，重点在于数据备份和恢复。当您在设计作为整体 Salesforce IT 环境一部分的 ETL 和其他解决方案时，这非常有用。\n\
  \n\n\n+   - 区域管理：\n+     - 我们将了解区域管理，以及它如何与 Salesforce Lightning 平台上的数据模型及其使用设计相关联。\n\
  \n最后，本书有一节专门讨论考试成功，重点关注以下内容：\n\n+   - 练习题和答案\n+   - 速查表\n+   - 介绍本书中提到的某些概念和主题的进一步阅读资料\n\
  +   - Webassessor 概述，包括如何注册和参加考试\n\n#### 总结\n\n在本章中，我们了解了 Salesforce 认证数据架构师认证为何存在、考试形式以及\
  \ Salesforce 数据架构师的概况，从而真正理解该考试背后的概念为何对您的日常工作有用。最后，我们介绍了本书的学习路径，为本书其余部分定下基调。\n\n\
  在*第2章“数据建模与数据库设计”*中，我们将开始学习之旅，重新审视 Salesforce 数据模型、不同对象如何影响它，并涉及数据倾斜和所有权倾斜等概念。我们将介绍如何在适当考虑共享、记录数和性能的情况下有效描述\
  \ Salesforce 数据模型。\n\n#### 练习题\n\n回答以下问题以测试您对本章的掌握情况：\n\n+   1. 什么是 Salesforce 认证数据架构师认证？\n\
  +   2. 为什么该认证存在？\n+   3. Salesforce 数据架构师的典型概况是什么？\n\n#### 进一步阅读\n\n*阅读 Salesforce\
  \ 官方考试指南：* https://trailhead.salesforce.com/help?article=Salesforce-Certified-Data-Architecture-and-Management-Designer-Exam-Guide.\n\
  \n#### 数据建模与数据库设计\n\n在本章中，我们将开始探索认证大纲背后的理论，从数据建模和数据库设计开始。您将了解 Salesforce 数据模型是如何架构的、其背后的设计决策，以及您作为\
  \ Salesforce 数据架构师在工作中创建的数据模型如何影响共享和安全性。我们将介绍 Salesforce 共享模型，以便您在考虑数据访问选项时对可用内容有一个概览。\n\
  \n接下来，我们将研究不同类型的对象（例如标准对象、自定义对象、外部对象和大对象），以及它们如何融入数据模型设计策略。同时，我们还将介绍不同的关系类型，以便您了解何时应用它们。\n\
  \n转向性能方面，我们将介绍数据倾斜，让您理解 Salesforce 中的这一概念。然后，我们将介绍图表绘制技术，以便您能够开始有效地设计和表示 Salesforce\
  \ 数据模型。\n\n在本章中，我们将涵盖以下主题：\n\n+   - Salesforce 数据模型\n+   - 理解 Salesforce 共享与安全\n\
  +   - 探索标准对象、自定义对象、外部对象和大对象\n+   - 克服数据倾斜\n+   - 通过数据建模将所有内容整合在一起\n\n#### Salesforce\
  \ 数据模型\n\nSalesforce 通过为其给定客户组织中的对象提供一种伪 RDBMS 视图，抽象化了其数据库中的底层数据结构。例如，查看 Sales Cloud\
  \ ERM 时看到的图表，位于 https://architect.salesforce.com/diagrams/template-gallery/sales-cloud-overview-data-model：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_32_0.png)\n\n图 2.1 – Salesforce Sales\
  \ Cloud 数据模型\n\n正如我们所见，联系人记录将有一个 Account Id，以查找关系表示（在 RDBMS 术语中相当于外键）。以 Schema Builder\
  \ 中一个新 Developer Edition 组织的 Account 和 Contact 为例：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_33_0.png)\n\
  \n图 2.2 – 全新 Developer Edition 组织中 Schema Builder 中表示的 Account 和 Contact\n\n#####\
  \ 自己动手尝试\n\n您可以随时在 https://developer.salesforce.com/signup 注册（完全免费的）Developer Edition\
  \ Salesforce 组织，以便跟随本书中的示例进行操作，包括探索 Schema Builder。\n\nSalesforce 会让您认为 Account\
  \ 和 Contact 作为两个独立的数据库表存在（实际上，模式中的每个标准或自定义对象都有一个单独的表）。事实上，作为 Salesforce 数据架构师，在日常工作中以这种方式思考对象是完全正常的。\n\
  \n然而，事实是 Salesforce 有几个大型的底层数据库表（一个用于对象，一个用于字段，一个用于映射到这些对象和字段的数据，透视表等等），它们为每个组织提供了在运行时物化的虚拟数据结构。一个虚拟存储区域包含标准对象和标准字段，另一个包含标准对象和自定义字段，另一个包含自定义对象及其自定义字段。这在\
  \ https://developer.salesforce.com/wiki/multi_tenant_architecture 中有更详细的解释。本质上，标准对象/标准字段存储区域在创建新组织时填充，而自定义存储区域则在添加新自定义对象或自定义字段时添加（无论该自定义字段是添加到标准对象还是自定义对象）。因此，可以如下表示此结构，假设向标准\
  \ Account 和 Contact 对象各添加一个自定义字段：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_34_0.png)\n\
  \n图 2.3 – Salesforce 数据库的表示（仅对象数据），其中向 Account 和 Contact 标准对象添加了自定义字段\n\n现在让我们添加一个自定义对象，看看虚拟存储如何受影响，以及该更改在\
  \ Schema Builder 中如何显示：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_35_0.png)\n\n\
  图 2.4 – Salesforce 数据库的表示（仅对象数据），其中向组织添加了一个自定义对象，并向该新自定义对象添加了自定义字段\n\n*图 2.5* 在模式中包含了自定义对象和自定义字段：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_35_1.png)\n\n图 2.5 – Schema Builder，其中显示了新添加的自定义对象和自定义字段\n\
  \n了解了底层 Salesforce 数据模型的表示方式（这对性能调优等很重要，将在本书后面讨论）后，我们现在可以将注意力转向 Salesforce 中可用的标准对象。这些对象是为了解决常见用例而创建的（例如用\
  \ Account 表示公司，用 Contact 表示人），因此应尽可能使用。这不仅减少了重复造轮子，而且 Salesforce 还扩展了标准功能以应对特定用例，例如客户团队。客户团队扩展了\
  \ Account 的共享模型，允许在协作处理某个 Account 的团队之间进行定制共享。类似的功能也可用于 Case 和 Opportunity（分别称为**案例团队**和**机会团队**）。此团队功能是\
  \ Salesforce 数据模型支持的标准功能的一个示例，该功能并未扩展到自定义对象。\n\nSalesforce 中可用对象及其字段的完整详尽列表由 API\
  \ 文档提供（可在 https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_objects_list.htm\
  \ 获取），但一些最常用的对象如下：\n\n+   - **Account** – 代表您可能与之开展业务的公司或机构。\n+   - **Contact**\
  \ – 代表一个人（通常与一个或有时多个 Account 关联）。\n+   - **Lead** – 代表一个潜在客户或未合格销售线索。潜在客户通常用于售前场景，目标是将潜在客户转换为\
  \ Account、Contact，以及可选的 Opportunity。\n+   - **Person Account** – 一个 *分组* 的 Account/Contact\
  \ 对象（主要允许将 Opportunity 关联到个人买家而不是 Account/公司）。这本质上是将 Account/Contact 关系从查找关系改为 *由父级控制*。这对共享和数据可见性有影响。\n\
  +   - **Case** – 代表需要关注的跟踪问题或工作项。通常由支持人员使用。\n+   - **Opportunity** – 代表一笔业务交易。\n\
  +   - **Opportunity Line Item** – 构成 Opportunity 的一部分并用于驱动其价值的项目。\n\n> **标准对象数据模型图**\n\
  > Salesforce 标准数据模型可在 https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/data_model.htm\
  \ 获取（请记住，它们显示的是对象的逻辑表示及其关系，而不是物理数据库结构）。\n\n现在我们已经了解了标准对象，以及支撑标准对象/标准字段、标准对象/自定义字段、自定义对象/自定义字段的三张表，我们可以开始关注数据查询如何工作，并关注这些表之间的性能。\n\
  \n\n\n当向 Salesforce 数据库发出数据查询（例如 Salesforce 对象查询语言（SOQL）或 REST API 调用）时，该请求会被转换为底层数据库的系统生成\
  \ SQL。虽然无法调整生成的 SQL，但留意我们的数据查询方式会如何影响 SQL 的生成，可以让我们在一定程度上施加影响。我们正是在这些参数范围内优化数据查询。\n\
  \n例如，考虑以下 SOQL 查询，它用于获取按字母顺序排序的列表中的前 10 个客户（Account）记录名称：\n\n```\nSELECT Name FROM\
  \ Account ORDER BY Name ASC LIMIT 10\n```\n\n由于我们查询的是标准对象的标准字段，Salesforce 只需从 Account\
  \ 的标准对象/标准字段表中检索数据。\n\n当在查询中加入自定义字段（为便于说明，假设该字段名为 CustomField），我们实际上是在要求底层数据库查询执行\
  \ JOIN，以便能够从标准对象/自定义字段表中检索数据。因此，即使是这样简单的查询，也会导致从多个底层数据库表中检索数据：\n\n```\nSELECT Name,\
  \ CustomField__c FROM Account ORDER BY Name ASC LIMIT 10;\n```\n\n现在考虑第三种场景。我们要查询一个自定义对象（名为\
  \ CustomObj__c），它有一个指向 Account（客户）的查找关系（名为 Account__c），并且还要将上一个例子中的客户名称和客户自定义字段放入结果中：\n\
  \n```\nSELECT Name, Account__c.Name, Account__c.CustomField__c FROM CustomObj__c\
  \ ORDER BY Name ASC LIMIT 10;\n```\n\n此时，我们查询了自定义对象/自定义字段表、标准对象/自定义字段表以及标准对象/标准字段表，而这一切只是为了从\
  \ 3 个字段中检索 10 行数据！\n\n因此，最佳实践是尽可能避免在数据访问查询中使用 JOIN，从而确保获得最佳性能。考虑到底层 Salesforce 数据的组织方式，拥有良好结构的数据模型（尽可能避免\
  \ JOIN）意味着报表、仪表板（dashboard）和列表视图都能获得良好的性能。\n\n第 6 章“理解大数据量”（Understanding Large\
  \ Data Volumes）描述了大数据量可能引发的问题（尤其是性能问题）以及如何缓解这些问题。\n\n现在我们已经介绍了 Salesforce 数据模型，接下来将把注意力转向共享与安全，它们会影响数据的访问方式。\n\
  \n#### 理解 Salesforce 的共享与安全\n\nSalesforce 中的任何数据访问都由一个分层安全模型决定。随着每一层的递进，数据访问权限会逐渐开放。因此，必须在最底层充分理解共享与安全需求，以便恰当地配置安全设置。Salesforce\
  \ 安全模型的各层可如下图所示：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_38_0.png)\n\n图 2.6\
  \ – Salesforce 安全模型各层的可视化表示\n\n本节将解释构成安全模型的各层、它们的配置方式及其影响。\n\n#### 组织范围默认值（Organization-Wide\
  \ Defaults）\n\n用户默认对彼此记录的访问权限是在 Salesforce 实例的组织范围默认值（OWD）中指定的。本质上，OWD 将数据访问锁定在最严格的级别，然后通过其他共享和数据访问工具（将在后续章节中说明）逐步向用户开放数据访问权限。例如，将\
  \ Account 的 OWD 设置为只读，意味着用户默认无法编辑客户记录。如果用户只需要编辑自己拥有的客户记录，则可以通过配置文件（Profile）或权限集授予对象级别的编辑和读取访问权限，同时将\
  \ Account 的 OWD 保持为只读。内部用户和外部用户（通过 Salesforce Community 或其他方式访问）分别有各自的 OWD。访问的前提相同，但外部\
  \ OWD 有助于默认锁定到更严格的数据访问模型。例如，\n\n你可以选择让所有常规（有时称为内部）Salesforce 用户默认对所有客户记录拥有只读访问权限，而通过社区访问\
  \ Salesforce 的外部用户对客户记录则使用私有（Private）OWD，这样外部用户只能看到自己拥有的客户记录。可用的 OWD 设置值将在以下小节中说明。\n\
  \n##### OWD 值\n\n在 Salesforce 实例中设置 OWD 时有多个选项可供选择，它们都会影响给定对象或关联记录/对象的数据访问方式。\n\n\
  ###### 私有（Private）\n\n只有记录所有者，或角色层级中高于记录所有者角色的用户，才能查看、编辑和报告此对象的记录。\n\n###### 公开只读（Public\
  \ Read-Only）\n\n所有用户都可以查看此对象类型的记录，但只有记录所有者以及角色层级中高于记录所有者角色的用户才能查看、编辑和报告此对象的记录。\n\
  \n###### 公开读/写（Public Read/Write）\n\n所有用户都可以查看、编辑和报告此对象记录中的数据。\n\n###### 公开读/写/移交（Public\
  \ Read/Write/Transfer）\n\n仅适用于 Case（个案）和 Lead（潜在客户）对象。如果设置了此选项，所有用户都可以查看、编辑、移交和报告潜在客户或个案记录中的数据。\n\
  \n###### 公开完整访问（Public Full Access）\n\n仅适用于 Campaign（营销活动）对象。如果设置了此选项，所有用户都可以查看、编辑、删除、移交和报告营销活动记录中的数据。\n\
  \n###### 由父项控制（Controlled by Parent）\n\n用户基于对父记录的访问权限，对相关记录（例如编辑或删除）执行操作。例如，如果自定义对象\
  \ Invoice（发票）以 Account 作为父对象，且 Invoice 的 OWD 设置为“由父项控制”，那么用户对 Account 的访问权限会自动意味着他们可以访问与该客户记录关联的发票记录。如果用户对客户拥有编辑权限，则他们会自动拥有对关联发票记录的编辑访问权限。\n\
  \n#### OWD 的正确性至关重要\n\nOWD 直到不久之前仍是限制用户访问记录的唯一方式。更改 OWD 会对整个 Salesforce 组织产生影响（尤其是执行共享重算所需的时间），并可能导致用户看到超出其应有权限的数据。因此，在实施\
  \ OWD 之前，必须充分了解用户的数据访问需求。自 Winter ’22 版本起，一项名为限制规则（restriction rules）的功能可帮助限制特定用户组对某些记录的访问。这将在“限制规则”一节中进一步说明。限制规则用于限制用户，但不能替代设计良好的\
  \ OWD 策略。\n\n#### 配置文件（Profile）与权限集\n\n指定对象级安全访问权限是配置文件的主要功能（尽管配置文件中还存在其他设置，例如登录时段、IP\
  \ 地址范围等，但这些不在本考试范围内）。通过为特定对象指定创建（Create）、读取（Read）、编辑（Edit）和删除（Delete）权限，可以进一步开放用户对这些对象的访问权限，使其超出组织中已设置的\
  \ OWD。字段级安全性也是在配置文件和权限集中设置的，因此对特定字段的读取或编辑访问权限也是在此处配置的。\n\n每个用户都必须被分配一个配置文件。权限集可用于通过权限集中可用的组织设置，进一步授予对对象和其他功能的选择性访问权限。托管包（Managed\
  \ Package）通常使用权限集来让被分配的用户访问托管包所提供的功能。\n\n#### 关于 View All 与 Modify All 的简要说明\n\n\
  View All（全部查看）和 Modify All（全部修改）本质上允许用户对组织内给定对象拥有全面的读取或编辑访问权限。它们会忽略特定对象的共享规则。因此，如果分配给用户的配置文件或权限集对\
  \ Account 设置了 View All，则他们将拥有对所有客户记录的读取访问权限。同理，对 Account 设置 Modify All 将授予用户对组织中任何客户记录的编辑访问权限。View\
  \ All Data（查看所有数据）和 Modify All Data（修改所有数据）权限是在组织级别设置的，拥有这些权限的用户实际上会忽略共享规则，从而获得对组织中所有对象和记录的读取或编辑访问权限。\n\
  \n#### 角色层级（Role Hierarchy）\n\n与组织结构类似，角色层级用于确定用户组的数据访问权限，并确保经理始终拥有与其下属员工相同级别的数据访问权限（无论该对象的\
  \ OWD 如何设置）。角色层级的每一级都应与特定用户组所需的数据访问级别相对应。因此，角色层级与组织结构图略有不同，因为系统管理员通常位于层级中较高的角色。根据\
  \ Salesforce 组织的许可配置，外部用户也可能被分配角色，因此他们可能是某个内部角色的下属。\n\n\n\n\n#### 手动共享\n\n在先前已介绍的机制未涵盖的定制共享场景中，手动共享提供了一种功能，可以手动共享记录，向无权访问该记录的用户授予读取和编辑权限。顾名思义，手动共享是一个用户驱动的过程，涉及在\
  \ Salesforce 用户界面中进行点击，以向其他用户授予记录访问权限。也可以通过编程方式创建手动共享（有关更多信息，请参阅专门介绍*编程式共享*的小节）。\n\
  \n与其他用户共享记录会在 Salesforce 数据库中创建一条共享记录。编程式解决方案需要管理除*手动共享*以外的共享原因对应的记录共享。使用记录上的**共享**按钮可以维护行原因为*手动共享*的编程式共享，这与开箱即用的共享按钮功能非常相似。\n\
  \n#### 手动共享何时失效\n\n如果共享记录的所有者发生变更，则手动共享会被移除。如果共享未授予超出该对象 OWD 设置的访问权限，则一开始就不会创建共享。这两种情况同样适用于编程式共享场景。\n\
  \n#### 团队访问\n\n客户、商机和个案都有*团队*记录共享概念，借助这一概念，用户组可以协作处理客户、商机或个案。记录所有者、角色层级中更高层的人员（因此继承了相同级别的记录访问权限）或管理员都可以向团队添加人员，以便协作处理记录，或修改访问级别（例如，从只读改为读取/写入）。\n\
  \n团队通常用于向 Salesforce 中的特定用户授予更高级别的记录访问权限，以便他们可以协作处理客户、商机或个案。例如，如果用户已经对某个特定客户记录拥有写入访问权限，那么在针对该记录的客户团队中将其添加为读取/写入成员不会产生任何影响。\n\
  \n针对客户、商机或个案记录创建团队，会在 Salesforce 数据库中创建一条团队记录和一条关联的共享记录。编程式解决方案必须同时维护这两类记录。有关编程式共享的更多信息，请参阅专门的小节。\n\
  \n#### 多个团队访问一条记录怎么办？\n\n如果需要多个团队访问特定记录，那么区域管理或编程式共享可能更合适。每个客户、商机或个案只有一个团队，因此不支持针对单条记录设置多个团队的概念。\n\
  \n#### 区域层级访问\n\n可以创建层级结构来表示组织的销售区域。这实质上有助于根据条件自动分配客户，以表明其属于区域模型的特定分支。第 12 章“区域管理”将更详细地介绍区域管理。\n\
  \n#### 编程式共享\n\n当数据访问需求无法使用前述任何方式满足时，编程式共享（即以前所称的 Apex 托管共享）允许使用代码构建共享设置。基于代码的共享解决方案可以非常精巧和复杂，但也同样需要谨慎管理，因此在着手采用基于代码的共享解决方案之前，理解编程式共享的工作原理非常重要。\n\
  \nSalesforce 中的每个对象都有一个关联的共享对象。这有两种命名约定（一种用于标准对象，另一种用于自定义对象）。对于标准对象，关联的共享对象命名为 objectShare，例如\
  \ AccountShare、CaseShare 等。对于自定义对象，关联的共享对象使用类似于 object__Share 的格式命名。例如，对于名为 MyObject__c\
  \ 的自定义对象，其关联的共享对象称为 MyObject__Share。\n\n位于主从关系从属侧的对象没有关联的共享对象，因为对关系主控侧对象的访问会隐式授予对从属侧对象的访问。具有“公共读取/写入”OWD\
  \ 的自定义对象也没有关联的共享对象。\n\n使用代码以编程方式共享记录时，关联的共享对象需要一条带有行原因（row cause）的记录，用于存储共享发生的原因。通过\
  \ Salesforce UI 与用户共享记录，会在关联的共享对象中创建一条行原因为 manual share 的记录。编程式共享可以使用 manual share\
  \ 行原因创建条目，也可以使用自定义行原因值。共享对象条目中的值如下：\n\n- ParentID：被共享记录的 ID。该值在记录创建后无法更改。\n- RowCause：如上一段所述，这是记录被共享的原因。它可以模拟在\
  \ Salesforce UI 中按下“共享”按钮的手动共享，也可以使用自定义原因。自定义共享原因需要先在 Salesforce UI 中创建，然后才能使用。在\
  \ Salesforce 设置中，对象在“管理设置”中具有 Apex 共享原因相关列表。\n- UserOrGroupId：记录被共享给的用户或组的 Salesforce\
  \ ID。\n- `objectAccessLevel`：作为共享一部分授予的访问级别。该属性的名称是所共享记录对应的共享对象名称后跟 AccessLevel。例如，`CaseShareAccessLevel`。值可以分别是编辑、读取，或编辑/只读访问。\n\
  \n> **关于以手动共享行原因通过编程方式共享的记录的一点说明**\n> 当以*手动共享*行原因共享的记录（无论通过编程方式还是 UI）更改所有者时，任何手动共享行原因记录都会从关联的共享对象中移除。自定义行共享在共享记录的所有者变更时会被保留。\n\
  \n#### 限制规则\n\n限制规则自 Winter '22 版本起正式可用，可用于控制特定用户组允许查看的记录。根据创建限制规则的文档（https://help.salesforce.com/s/articleView?id=sf.security_restriction_rule_create.htm&type=5），*当限制规则应用于用户时，该用户通过组织级默认值、共享规则和其他共享机制可以访问的数据，会按您指定的记录条件进行过滤。*\n\
  \n在撰写本文时，限制规则适用于以下对象：\n\n- 自定义对象\n- 合同\n- 事件\n- 任务\n- 工时表\n- 工时表条目\n\n在 Enterprise\
  \ 版和 Developer 版中，每个受支持的对象最多可以创建两个限制规则；在 Performance 版和 Unlimited 版中，每个受支持的对象最多可以创建五个限制规则。\n\
  \n现在我们已经了解了 Salesforce 平台上的共享和安全机制，以及它们如何影响数据访问，接下来可以逐一了解每种 Salesforce 对象类型了。\n\n\
  #### 探索标准对象、自定义对象、外部对象和大对象\n\nSalesforce 对象大致可以分为四种类型之一。尽管您肯定使用过平台上可用的标准对象和自定义对象功能，但有必要在更底层了解它们的工作原理，才能真正理解针对这些对象类型发出\
  \ SOQL 查询意味着什么，以及它如何影响性能。其次，您以前可能没有使用过外部对象和大对象。在数据存储和访问方面，这些对象有所不同（外部对象数据不存储在平台上，而是通过外部数据源按需访问。大对象数据可确保一致的性能，但数据位于\
  \ Salesforce 平台中与标准/自定义对象不同的位置）。\n\n> **sObject**\n> \n> **sObject** 是任何 Salesforce\
  \ 对象的通用形式。标准 Salesforce 对象和您创建的自定义对象都是 sObject 的具体类型（它们都继承通用属性和行为）。另一种理解 sObject\
  \ 的方式是，它抽象了任何 Salesforce 对象的实际表示，很像 **Java** 编程语言中的对象都继承自 *Object* 基类。\n\n#####\
  \ 标准对象\n\n根据您的许可证类型，Salesforce 提供对许多标准对象的访问，这些对象旨在以极少的定制满足多种业务用例。\n\n这些对象及其字段在开箱即用状态下都将存放在标准对象/标准字段的底层数据库表中。从对象访问的角度来看，额外的\
  \ Salesforce 许可证（如 *Service Cloud*）实质上会授予对底层 Service Cloud 标准对象（如 milestone 和 entitlement）及其开箱即用字段的访问权限。\n\
  \n标准对象和标准字段没有特殊后缀，因此在发出 SOQL 查询时，它们分别表示为 Account（标准对象名称示例）和 Name（标准字段名称示例）。下面是一个示例：\n\
  \n```\n```sql\nSELECT Name FROM Account\n```\n```\n\n在没有任何定制的情况下，查询标准对象数据非常快。这是因为只查询一个数据库表。一旦向标准对象添加单个自定义字段，该字段就会在“自定义对象/自定义字段”表中创建，因此对该字段的任何查询实际上都会导致向底层\
  \ Salesforce 数据库发出 JOIN 查询，因为现在需要从两个表获取结果。\n\n##### 自定义对象\n\n自定义对象及其自定义字段全部在底层 Salesforce\
  \ 数据库的“自定义对象/自定义字段”表中创建。自定义对象数据驻留在 Salesforce 数据库中，并且自定义对象和自定义字段都有 __c 后缀。例如，针对名为\
  \ MyObject 的对象中名为 MyField 的自定义字段中的数据进行 SOQL 查询时，语法如下：\n\n```\n```sql\nSELECT MyField__c\
  \ FROM MyObject__c\n```\n```\n\n\n\nQueries on data held purely within these objects\
  \ will be relatively quick, but any data on parent objects (especially where that\
  \ object is a standard object) will incur a small performance penalty as the results\
  \ will require the use of a JOIN in the underlying SQL query issued to the Salesforce\
  \ database.\n\n##### 外部对象\n\n标准对象和自定义对象的数据都存储在 Salesforce 数据库的平台内，而外部对象的数据则存储在平台外的外部数据源中，通常位于另一个应用程序中。外部对象的理念是数据存储在平台外，但最终用户可以像在平台内一样与其交互。Salesforce\
  \ 使用 Web 服务调用实时访问外部数据。外部数据可通过 Salesforce 实时供用户使用，并且外部对象始终会返回来自外部数据源的最新的数据。\n\n外部对象需要在\
  \ Salesforce 实例中定义外部数据源，然后再用于确定如何访问外部系统。\n\n在 Salesforce 中，外部对象以对象名称后加 __x 后缀表示。例如，来自\
  \ SAP 的订单在 Salesforce 中的发票数据将命名为 Invoice__x。外部对象支持间接和外部查找，以将数据与您的 Salesforce 记录关联起来。\n\
  \n外部对象在 Salesforce API 版本 32 及更高版本中受支持，并可与 Salesforce Connect 和 Files Connect 配合使用。\n\
  \n#### 大对象\n\n大对象用于存储和管理海量数据（开箱即用可达 100 万条记录，但可通过额外付费扩展至数千万甚至数十亿条记录）。大对象提供一致的性能。根据我的经验，大对象通常适用于审计和归档用例，但任何需要在处理数亿或数十亿条记录时保持一致性能的场景都是大对象的设计目标。\n\
  \n大对象使用分布式数据库运行，并且本质上不是事务性的。因此，除了对象和字段权限外，大对象不支持共享。此外，这意味着工作流、流程、触发器等自动化在大对象上不受支持。\n\
  \n> **幂等性**\n> 当完全相同的记录表示（即记录的完全相同的数据集）多次插入到大对象时，只会创建一条记录。这是为了使对大对象的写入保持幂等性。将相同的记录表示插入到\
  \ sObject（标准或自定义）将导致多个条目。\n\n#### 对象关系类型\n\nSalesforce 对象通过多种方式通过关系链接在一起。这些关系会影响共享和数据访问。各种关系类型在此进行说明。\n\
  \n##### 主从关系\n\n主从关系紧密地将两个对象链接在一起，以至于子记录的某些行为会受到影响。这包括共享，其中对主记录（或父记录）的访问会授予对明细记录（或子记录）的访问权限。主从关系还支持汇总求和。\n\
  \n当主记录被删除时，所有子记录都会被删除。但是，取消删除主记录会恢复所有子记录。当明细记录被删除时，它会被移至回收站。如果明细记录被删除，随后主记录被删除，则明细记录无法恢复，因为它不再有主记录可关联。\n\
  \n##### 多对多\n\n查找和主从关系类型都是“一对多”（其中多个记录可以链接到另一条记录，例如一个账户拥有多个联系人）。多对多关系（例如，将一个案例链接到多个自定义错误记录，以及多个自定义错误记录链接到同一个案例）是通过两个主从关系通过连接对象连接来表示的（一个具有两个主从关系的自定义对象）。因此，多对多关系只能用于将一个对象连接到另一个对象。在我们的案例和错误示例中，我们有标准案例对象与\
  \ BugCaseAssociation 连接对象之间的主从关系，以及自定义错误对象与 BugCaseAssociation 连接对象之间的主从关系。这可以图示表示：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_47_0.png)\n\n图 2.7 – 使用两个主从关系表示多对多关系\n\
  \n在介绍了主从和多对多关系之后，让我们来看其他关系类型。\n\n##### 查找关系\n\n查找关系将两个对象链接在一起，但共享不受影响（因此子对象可以具有单独的共享，与主从关系不同，主从关系会影响共享），并且不支持汇总求和。查找关系支持将两个对象链接在一起，但这可以包括查找同一对象类型的记录（想想账户层次结构，其中一个账户记录可以有一个父账户记录来表示公司集团结构的层次结构）。一个对象对自身具有查找关系称为自引用关系。当用户对象查找自身时，应改用层次关系（参见“层次”部分）。\n\
  \n##### 外部查找\n\n当将外部对象记录链接到 Salesforce 标准或自定义对象，并且外部对象是父对象时，则使用外部查找关系。父外部对象上的标准外部\
  \ ID 字段与子对象外部查找关系字段的值进行匹配。\n\n##### 间接查找\n\n当将外部对象记录链接到其数据存在于 Salesforce 中的标准或自定义对象的父对象时，应使用间接查找关系将记录关联起来。创建间接查找时，您指定要在父对象中匹配的字段以及在外部对象上匹配的字段，从而关联记录。父对象上会选择一个自定义、唯一、外部\
  \ ID 字段，以匹配来自外部数据源的子外部对象的间接查找字段。\n\n#### 层次\n\n仅在用户对象上可用，层次关系是一种特殊的查找，用于将一个用户关联到另一个用户（其中记录不直接或间接引用自身）。将用户的经理存储为对另一个用户记录的查找是此功能的常见用例。\n\
  \n现在我们知道了将对象及其数据相互关联的不同方式，让我们来看一下当将过多记录关联到单个祖先记录或用户时性能会受到怎样的影响。\n\n##### 自定义层次（父/子）关系\n\
  \n可以通过利用自定义子对象来实现自定义父/子层次，该对象对要创建父/子关系的对象执行双重查找（类型为查找关系）。一个查找的名称格式为 Parent，另一个为\
  \ Sub。例如，要创建父/子机会关系，请创建一个名为 SubOpportunity 的自定义对象，其中包含一个名为 ParentOpportunity 的查找和另一个\
  \ SubOpportunity，它们都查找机会对象。有关详细信息，请参阅 https://help.salesforce.com/s/articleView?id=000326493&type=1。\n\
  \n#### 克服数据倾斜\n\n随着特定对象的记录数量增加，Salesforce 平台的自动扩展是预期功能。客户在系统中存在数万条相同类型的记录时，会要求保持一致的性能水平。在少数特定用例中会出现一些性能下降，具体如下：\n\
  \n- 一个用户拥有超过 10,000 条相同类型的记录（例如一个用户拥有超过 10,000 条账户记录）。这称为 **所有权倾斜**。\n- 单个账户记录拥有大量子记录，例如\
  \ 10,000 条或更多联系人记录，其 Account Id 查找为同一账户。这称为 **账户倾斜**。\n- 类似于账户倾斜，当大量子记录（10,000+）与同一父记录关联时，可能会出现性能问题。这称为\
  \ **查找倾斜**。\n\n我们将研究每种情况的原因以及如何缓解。\n\n##### 所有权倾斜\n\n当单个用户或队列拥有超过 10,000 条特定类型的记录（例如联系人）时，可能会出现由于所有权倾斜导致的性能问题。在\
  \ Salesforce 实例中，通常有一个默认用户或队列拥有所有未分配或未使用的记录。更改共享设置或其他与共享相关的操作会影响性能，因为基于拥有用户角色更改或其他与共享相关的计算重新计算共享会导致长时间运行的\
  \ Salesforce 操作，在此操作期间记录会被锁定。\n\n###### 所有权倾斜缓解\n\n为缓解所有权倾斜，请考虑以下措施：\n\n- 根据会导致单个所有者的大量记录的数据预测（例如线索记录的默认所有者），请考虑为此类所有权场景设置多个所有者。分配规则可用于线索和案例（通常具有高数据量的标准对象），但也可以使用其他自动化技术根据记录的标准将记录分配给适当的所有者。\n\
  - 如果必须使用一个用户，则可以通过不将该用户分配到角色来减少性能影响。这消除了共享计算中的任何基于角色的影响。\n- 如果拥有用户必须具有角色，则该角色应位于角色层次结构的顶部。因此用户无需在层次结构中移动，减少了共享计算成为长时间运行过程的影响。\n\
  \n\n\n\n\n- 确保任何拥有者用户都不是用于任何共享规则条件中的公共组的成员。如果是这种情况，更改记录拥有者将触发这些共享规则的重新计算，从而进一步减慢速度。\n\
  \n##### 账户倾斜\n\n某些标准 Salesforce 对象维护一种特殊的数据关系，以促进在私有共享模型下的记录访问。这对于账户和商机尤其如此（事实上，这也是账户和商机团队在共享和访问特定记录方面得以实现的方式）。\n\
  \n账户倾斜是账户记录拥有大量子记录的结果。我曾在一些客户处见过这种情况表现为一个名为 Unassigned Accounts 的单个账户记录下有数万条子账户记录，这些记录可能很旧、未使用或未分配。此场景会导致性能和记录锁定问题。\n\
  \n当对子记录进行更新时，Salesforce 会锁定父账户记录（以在数据库中维护记录完整性）。因此，在同一账户记录下更新大量子记录可能会导致争用（多个进程或操作同时尝试访问同一事物），并尝试锁定父记录（这是使用单独的系统线程完成的）。\n\
  \n当对父账户记录进行更新时，例如更改拥有者，则必须对所有子记录重新计算所有共享。这可能会触发连锁反应，因为共享规则、角色层级计算以及与共享相关的许多其他操作都必须进行。这将导致长时间运行的进程以及潜在的记录锁定问题。\n\
  \n###### 账户倾斜缓解\n\n为缓解账户倾斜，将子记录分布到多个父账户记录中。10,000 就是这里的 magic number。通过将记录分布到多个账户，我们可以避免账户倾斜及其与记录锁定和共享操作相关的性能影响。\n\
  \n##### 查找倾斜\n\n查找倾斜与账户倾斜在原则上相似，当通过子记录上的查找字段与单个父记录关联的子记录数量很大时就会发生。虽然账户倾斜特定于账户对象，但查找倾斜会影响多个对象。\n\
  \n###### 查找倾斜缓解\n\n尝试以下方法来缓解查找倾斜：\n\n- 删除受影响对象中不必要的 workflow、process builder 或 flow，以减少创建或保存受影响对象的记录时的保存时间。\n\
  - 将倾斜分布到多个记录中。例如，为子记录上的查找提供单独的父对象记录，以减少甚至消除记录锁定和共享重新计算。\n- 使用 picklist 值而不是查找。这意味着不会链接到实际的父记录，但可以通过对这些\
  \ picklist 值的报告来查询给定父记录的关联数据。此缓解技术不适用于大量查找值，因此仅应在 picklist 值数量较少时使用。\n\n#### 数据倾斜总结\n\
  \n我们已探讨了 Salesforce 中的三种数据倾斜类型以及如何缓解它们。在 Salesforce 内部设计有效的数据管理策略时，请注意数据倾斜及其对性能的影响。通过在构建数据策略之初就为数据倾斜进行设计，即使是最大的\
  \ org 也能保持性能不下降。\n\n现在我们了解了不同类型的数据倾斜及其影响，让我们结合本章所涵盖的内容。\n\n#### 将其与数据建模结合起来\n\n\
  本章我们涵盖了很多内容，但现在是时候将理论付诸实践，并以数据模型的形式产出有形的东西。现在我们知道了可以设置的 OWD、可以影响的对象间关系以及记录的拥有者，我们可以将它们结合起来生成一个数据模型。\n\
  \n在本書中，任何数据模型图都将按照以下格式绘制（本质上是从第 1 章《Introducing the Salesforce Data Architect Journey》中的示例图中扩展的图例）：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_52_0.png)\n\nFigure 2.8 – The format\
  \ for diagramming Salesforce objects used throughout this book\n\n现在我们已经了解了数据建模格式，让我们来看一个数据建模示例。\n\
  \n#### 数据建模示例和说明\n\n数据建模格式已介绍完毕，让我们来看一个示例数据模型，以展示我们能从单个工件中获得多少信息。以下是示例，与第 1 章《Introducing\
  \ the Salesforce Data Architect Journey》中分享的示例类似：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_53_0.png)\n\
  \n*Figure 2.9 – Example data model*\n\n让我们查看数据模型并看看我们可以从中确定什么：\n\n- 采用的是私有 OWD 模型，因此只有\
  \ Account 和 Contact 的记录拥有者以及角色层级中更高层级的角色才能查看和编辑记录（除非使用本章中解释的其他方法之一，例如手动共享来共享记录）。\n\
  - *Sales Exec* 角色被指定为账户和联系人的拥有者，而 *Finance* 是 *Invoice__c* 自定义对象的拥有者。然而，我们可以看到 *Invoice__c*\
  \ 的 OWD 设置为 Controlled by Parent，因此拥有账户记录的 Sales Exec 人员也将能够查看和编辑 *Invoice__c* 记录。\n\
  - *Invoice__c* 对象已被指定为 *LDV*，鉴于数据量，我们需要确保考虑数据倾斜。在这种情况下，我们同时需要考虑账户倾斜和拥有者倾斜，因此应确保没有任何账户记录是超过\
  \ 10,000 条 *Invoice__c* 记录的父级，并且财务部门的任何个人也不拥有超过 10,000 条 *Invoice__c* 记录，否则可能会出现性能问题（如\
  \ *Overcoming data skew* 部分所述）。\n\n正如你所同意的，看似小的图中包含了很多信息，但可以快速确定默认数据访问情况以及关系的共享影响，我们也能及早了解\
  \ LDV 的影响。\n\n在回答与数据访问及其对其他对象的影响相关的练习题时，尝试在有意义的情况下将问题可视化为图表，以便得出正确答案。\n\n> **The\
  \ Importance of the Data Model in the Certified Technical Architect (CTA) review\
  \ board**\n> 那些希望追求 **CTA** 评审委员会的人将被要求制作一个与本书中我们将制作的类似性质的数据模型。数据模型被视为评审委员会的核心工件，因此重要的是你知道如何快速制作清晰的数据模型图，以传达适当的信息量。\n\
  \n#### Summary\n\n我们已开始学习之旅，并从数据建模和设计的概念开始。我们涵盖了共享和安全，深入探讨了 Salesforce 中用于控制数据访问的各种机制。我们特别关注了\
  \ OWD 和角色层级如何对用户可以访问的数据产生深远影响。我们看到了 OWD 如何影响 Salesforce 平台上解决方案的数据模型设计，以及为什么在构建满足客户需求的\
  \ Salesforce 解决方案时，基于对特定 OWD 设置影响的充分理解，正确设置这些设置很重要。\n\n我们还涵盖了平台上可用的不同对象类型，强调了标准、自定义、外部和大对象之间的差异以及各自的各种用例。再次，某些对象类型的使用（特别是大对象和外部对象）会影响用户在数据访问方面的用户体验。\n\
  \n我们涵盖了关系及其对 Salesforce 功能和数据访问的影响，并看到了在 Salesforce 平台上将对象及其数据放在一起的不同方法，强调了我们如何将外部数据源中保存的数据与\
  \ Salesforce 内部保存的数据相关联。\n\n我们还研究了与数据相关的性能问题，涉及数据倾斜以及可用于缓解用户拥有超过 10,000 条记录或账户作为超过\
  \ 10,000 条子记录的父账户的影响的方法。\n\n在掌握了本章重点介绍的概念后，你现在明白了为什么从 Salesforce 数据模型的初始设计开始就为未来进行规划很重要，以缓解与数据倾斜和其他影响性能的因素相关的风险。\n\
  \n最后，我们将建模数据解决方案的概念结合起来，并引入了数据模型图的标准。\n\n\n\n在第3章“主数据管理”中，我们将深入探讨什么是主数据管理（MDM），并学习如何在Salesforce平台上有效设计和实施MDM策略。我们将了解黄金记录的概念，保持跨多个数据源的数据可追溯性，并学习这会如何影响业务规则运行的上下文。\n\
  \n#### 练习题\n\n- 1. 公开读写/转移的组织级默认设置（OWD）适用于哪些对象？\n- 2. 与拥有超过10,000条子记录的账户记录相关的性能问题被称为什么？\n\
  - 3. 对于营销活动（Campaign）对象，哪些OWD是其他对象所没有的？\n- 4. 哪种Salesforce对象用于实时访问外部系统中保存的数据？\n\
  - 5. 判断对错：大数据对象会多次存储同一数据行的相同表示。\n- 6. 哪种OWD会使对象继承与其关联对象相同的数据访问权限？\n- 7. 多对多关系是如何创建的？\n\
  - 8. 哪种类型的关系仅适用于用户对象？\n- 9. 在主从关系中，当主记录被删除时，子记录会发生什么情况？\n- 10. 判断对错：使用查找关系时，子对象的共享会受到影响。\n\
  \n#### 答案\n\n- 1. 潜在客户（Lead）和个案（Case）。\n- 2. 账户倾斜。\n- 3. 公开完全访问。\n- 4. 外部对象。\n-\
  \ 5. 错误——对于同一数据表示的多次提交，大数据对象只存储一行数据。\n- 6. 受父项控制。\n- 7. 两个主从关系，每个对象上一个，使彼此相互关联。\n\
  - 8. 层级关系。\n- 9. 子记录也会被删除。\n- 10. 错误。\n\n#### 延伸阅读\n\n- *Salesforce 数据访问：* https://developer.salesforce.com/docs/atlas.en-us.dat.meta/dat/dat_components.htm\n\
  - *Salesforce 标准对象：* https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_objects_list.htm\n\
  - *Salesforce 数据模型图：* https://architect.salesforce.com/diagrams#template-gallery\n\
  - *Salesforce 对象关系概览：* https://help.salesforce.com/articleView?id=overview_of_custom_object_relationships.htm&type=0\n\
  - *限制规则：* https://help.salesforce.com/s/articleView?id=release-notes.rn_forcecom_sharing_restriction_rules.htm&type=5&release=234\n\
  \n#### MDM简介\n\nMDM是确定并维护企业内共享数据单一事实来源的学科。你大概可以想象，在企业IT系统中维护同一信息的多个副本效率低下，还可能导致数据不一致。除非人员与技术实现百分之百协同，否则维护同一数据的多个副本几乎是不可能的。孤岛式企业（各部门在人员和技术上有效分离）往往面临数据不一致的问题，其持有的数据质量和分类也常常存在缺陷。这些场景需要将不同系统持有的数据汇集成一个数据主库，即单一事实来源。\n\
  \n单一事实来源在概念上可以直观表示如下：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_58_0.png)\n\n\
  图3.1 – 将不同系统持有的数据汇集起来形成单一事实来源\n\n我最近就亲身体验了一个MDM不当的例子，与我当地的一家汽车经销商有关。我曾向他们咨询并最终购买了一辆车，因此关于我和我所购车辆的数据便存入了销售团队的数据库。这对经销商来说很重要，因为他们可以在我的汽车需要保养等时候给我发送提醒。不幸的是，经销商的营销部门与销售部门之间没有集成，因此我仍会收到经销商发来的营销邮件，诱导我购买我已拥有的车。\n\
  \n这一场景之所以发生，是因为汽车经销商各部门之间的系统互不连通。在这家IT企业内，我被记录了两次：在一个系统中我是潜在客户，在另一个系统中我是合格（且已转化）的销售线索。如果汽车经销商各部门的数据被集中到一个单一事实来源中，他们就能看到我已经买了车，也许就能将营销重点转向追加销售和交叉销售活动，例如汽车配件优惠或保养套餐。\n\
  \nMDM应是一个持续的过程，是更广泛的组织数据战略的一部分。例如，当一个组织收购另一个组织时，后者的数据必须经过清理、去重、分类，并与收购方持有的数据进行核对。将数据整合到一个共享的单一事实来源中，能够确保组织中的人使用最新、已清理且分类正确的数据。这个单一事实来源通常被称为黄金记录。我们将在本章后面的“黄金记录”一节中介绍这一概念。\n\
  \n##### 关键术语\n\n接下来，我们介绍MDM中使用的一些关键术语及其定义。\n\n以下术语在MDM领域非常常用。作为Salesforce数据架构师，在处理MDM相关情况时，你可能会遇到它们。\n\
  \n###### 数据统一化\n\n**数据统一化**是将来自多个来源的数据进行处理（通常通过机器学习和自动化），使其变成标准、准确且全面的格式的实践，这意味着任何与数据交互的人都可以以相同的方式（利用共同的数据语言）进行交互。例如，将产品称为**库存单位（SKU）**，而不是在内部称*产品代码*、在外部称*产品*。\n\
  \n###### 数据整合\n\n顾名思义，**数据整合**是将来自多个数据源的数据汇集并整合到一个集中管理的*数据主库*或*数据中心*的实践。需要注意的是，这与黄金记录略有不同，因为黄金记录指的是信息的呈现，而数据整合指的是对整合后数据的实际管理（尽管从MDM数据中心呈现黄金记录也完全可以接受）。\n\
  \n###### 数据存留\n\n数据存留关注的是，在企业IT系统中被识别为重复的数据会如何处理。通常，数据记录存留策略可分为以下几类：\n\n- **适者生存式：**\
  \ 采用被认为最合适的记录作为要使用的记录。\n- **形成黄金记录：** 将适当识别的数据片段（由数据质量方面的业务规则决定）汇集在一起，形成单一事实来源。\n\
  - **上下文感知的数据存留：** 重复数据记录实际上不会被更改，也就是说，它们不会被合并到其他记录、归档或删除。这通常用于需要形成不同数据视图的企业（可以想象，根据数据被查看或交互的上下文不同，会产生不同的黄金记录）。正如你所预料的那样，这种方法涉及额外一层数据管理，因此可能带来性能方面的顾虑。\n\
  \n###### 阈值和权重\n\n匹配数据时，权重是赋予数据记录的值，而阈值则决定对这些记录采取什么动作。例如，某个阈值可能会使两条记录自动关联，或者将两条记录标记为需要人工干预。权重用于计算匹配得分，而匹配得分会输入到阈值中。例如，匹配到相同的电子邮件地址、邮政编码和姓氏，会比仅根据名字匹配两条记录得分更高，因为名字在数据集中可能很常见。我们高权重的记录匹配结果可能会进入某个阈值，从而自动将记录关联起来。\n\
  \n###### 规范建模\n\n规范数据模型是一种以最简单形式对数据进行建模的方式。通常，这用于中间件场景，即数据在源系统中以不同的方式进行建模。规范数据模型可以用作一种通用格式，既可以从中生成特定于系统的数据模型，也可以将数据输入其中。\n\
  \n规范数据建模的一个示例是：一个客户主记录（Salesforce）和一个需要通过中间件层在两个不同连接系统中创建的新联系人。由于两个源系统以不同格式表示联系人，中间件将获取Salesforce中的联系人，并将其转换为规范（或最简单）格式，从而可以针对每个需要交互以创建联系人的源系统，将其转换为特定于系统的格式。新的连接系统可以立即利用这种建模逻辑。\n\
  \n\n\n\n#### 层级管理\n\n这是一个相对简单的概念，用来表示各种数据记录和元素的层级关系。例如，你可以将公司的地理区域或市场划分为 EMEA（欧洲、中东和非洲），然后按国家细分。你可能还有账户层级，表示为集团账户，然后是区域账户，最后是本地办公室账户。\n\
  \n现在我们从理论层面了解了 MDM 是什么，我们可以转向实施 MDM 时需要考虑的问题。\n\n#### 实施 MDM\n\n作为 MDM 策略的基础设计的一部分，应考虑组织在实施\
  \ MDM 时的系统环境、预算和技术能力。存在多种实施模型，可以大致归为以下几类：\n\n- 源系统\n- 中央注册表\n- 整合的黄金记录\n- 黄金记录的共存\n\
  \n这些不同的实施方法在此进行说明。\n\n#### 源系统\n\n可以确定一个系统作为源系统或信息权威来源。所有数据操作都在该单一系统或应用程序中执行。这种实施模型极其简单，因此不适用于部门孤立的组织或需要数据联合的场景。以我对汽车经销商的经历为例。我在\
  \ IT 企业中被代表了两次，在一个系统中作为潜在客户，在另一个系统中作为合格的（且已转化）销售线索。因此，这就是汽车经销商 IT 企业中存在两个源系统（即数据孤岛）的案例。这种场景仅适用于最简单的\
  \ IT 企业，即所有内容都由一个应用程序管理。也可能是 Salesforce 用于销售和服务，并与财务系统进行简单集成以开具和处理发票。Salesforce\
  \ 是系统记录，因为财务系统本身不会直接执行任何操作；它实际上按 Salesforce 的指令行事。\n\n#### 中央注册表\n\n中央注册表通过使用 ID\
  \ 和匹配记录（在识别时可以进行清洗和去重）将来自多个系统的数据链接在一起。主数据更改仍在各自的源系统中进行，通过在需要时实时从源系统汇总数据，按需创建一个单一事实来源。当组织中难以确定权威数据源时，此方法可能适用。存在成本考虑，因为在实施\
  \ MDM 策略之前可能没有可用的系统用作中央注册表，并且此外，注册表随时间的填充和维护还涉及相关流程。\n\n#### 整合的黄金记录\n\n从多个来源识别的主数据被合并以形成黄金记录，或单一事实来源。对黄金记录的任何更新都会应用到原始来源，通常使用中间件。采用此方法存在成本考虑，即实施中间件流程以促进向源系统的数据更新的成本。当实施\
  \ Salesforce 时，这可能是最常见的实施场景，因为它通常被引入 IT 企业成为事实上的单一真相来源。然而，要实现这一点，数据必须从源系统获取。简而言之，如果组织中有一个系统被确定为客户的单一视图，并且当客户信息在\
  \ Salesforce 中更新时，有多个下游系统需要更新，那么这种方法最适用。\n\n#### 黄金记录的共存\n\n与前面简要说明的整合黄金记录实施方法类似，MDM\
  \ 更改可以在黄金记录系统和任何主数据源系统中发生。虽然这种方法实施时间可能更长，但数据可以在黄金记录系统或任何主数据源系统中进行主数据管理。随着数据的同步，任何给定系统中的质量保持一致。因此数据质量的访问得到改善，因为公司某个部门的用户可能只使用一个系统，而不一定是黄金记录系统。实施使用中间件工具的流程的相同成本考虑也适用于此。这种场景可能适用于组织可能拥有由某些职能使用的专业或遗留应用程序的情况。以拥有一个用于关键职能的专业系统且由特定用户群体作为其唯一系统积极使用的组织为例，鉴于其工作性质，他们需要查看客户的黄金记录。因此此场景适用，因为该系统可能应用的更新需要传回\
  \ Salesforce。黄金记录的这种并行或共存对于某些应用程序需要与 Salesforce 相同的质量黄金记录信息的情况可能是必要的。\n\n#### 哪种实施方法最好？\n\
  \n每种实施方法都有其优点，可能取决于多种因素。作为架构师，我们的工作是根据组织的目标和战略举措提供建议，同时考虑可维护性。\n\n#### 这与 Salesforce\
  \ 有什么关系？\n\n现在我们知道了 MDM 是什么，以及实施它的理论，让我们把注意力转向 MDM 和 Salesforce。通常，Salesforce 被实施以整合公司企业的数据，打破信息孤岛，并在各个业务单元或部门之间提供数据的一致视图。因此，Salesforce\
  \ 成为事实上的事实来源，并在此类场景中实施时立即成为数据主系统。我们的单一事实来源因此存在于 Salesforce 中。\n\nSalesforce 几乎总是需要与一个或多个系统通信数据更改。因此，通常使用中间件系统来促进构成\
  \ Salesforce 中黄金记录的连接系统之间通信和数据字段映射。作为 Salesforce 系统设计的一部分，为在 Salesforce 中创建的对象和字段生成的数据字典可以传递给中间件团队，以便促进数据映射，以便在\
  \ Salesforce 和连接系统之间中介数据更新。\n\n向 Salesforce 的初始数据迁移练习应被用作从源系统构建给定记录的单一事实来源的时机，在加载到\
  \ Salesforce 并在上线日期后仅在连接的源系统中执行更改的集成开启之前，根据需要或适当进行清洗、去重和丰富。\n\n现在我们知道了 MDM 是什么，让我们更详细地探讨单一事实来源的概念。\n\
  \n#### 黄金记录\n\n正如我们现在所知，**黄金记录**，或**单一事实来源**，本质上是一个数据记录，其中存储了业务运营编排的权威信息来源。用户应能够查看黄金记录以查看信息\
  \ piece 的正确版本。虽然用户的信息权威来源可能是黄金记录，但相关系统的集成可能负责对该数据的更新，或将黄金记录数据更新推送到这些相关系统，如上一节所述。\n\
  \n黄金记录不一定包含企业中所有系统中保存的每条信息，而可能仅包含检索该信息所需的标识符。作为 Salesforce 架构师，我们的工作是确定在 Salesforce\
  \ 是黄金记录所在的情况下，哪些信息应保存在 Salesforce 内部，哪些应保存在外部。某些信息应保存在 Salesforce 中，在那里进行主数据管理是有意义的；其他信息需要在\
  \ Salesforce 中呈现但不一定需要在 Salesforce 平台上驻留的信息，应在查看时按需提取。\n\n#### 黄金记录中应包含哪些数据？\n\n\
  在设计黄金记录时，考虑用户、他们需要访问的数据以及何时需要。流程关键数据应引入 Salesforce 平台，但不会经常访问或报告的数据可以在需要时从外部系统按需显示。\n\
  \n例如，银行的客户记录可能在 Salesforce 中存在为 Person Account，并与之关联的是另一个系统中的实际银行账户记录。根据系统环境以及如何与这些其他系统交互，这些单独银行账户记录的标识符可能位于以下之一：\n\
  \n- Salesforce（在 Person Account 记录上，或与其关联的记录上）\n- 中间件系统，例如 MuleSoft\n- 一个单独的系统，由中间件或如果没有中间件则由\
  \ Salesforce 进行查询\n\n在 MDM 策略的一部分中确定黄金记录将驻留的位置时，请考虑以下几点：\n\n- 黄金记录上需要表示哪些信息？\n-\
  \ 哪些信息需要在黄金记录上物理定位，哪些信息可以引用以供按需检索？\n- 所有黄金记录数据源位于何处？\n- 是否需要新的集成？\n- 现有集成是否需要更新或捕获额外属性？\n\
  - 黄金记录的每个字段的正确数据源是什么？\n- 需要为对黄金记录的更新或来自黄金记录的更新制定哪些规则？\n\n还记得《介绍 MDM》部分中的图 3.1 中的图表吗？我们将使用该黄金记录的概念概述作为我们使用以下实施技术进行探索的需求。在继续之前，请再次查看图\
  \ 3.1 中的图表。\n\n\n\n\n\n在我们的概念场景中，我们希望将来自这三个不同系统的数据汇聚起来，形成客户的黄金记录。基于本节开头介绍的黄金记录驻留示例，让我们来看看这些差异将如何表示。\n\
  \n#### Salesforce 持有黄金记录关联\n\n在 Salesforce 被视为客户信息数据主体的场景中，连接系统的标识符可以表示为特定记录上的自定义字段，或与记录关联的自定义对象。\n\
  \n例如，Salesforce 中的联系人记录是企业内与个人相关数据的黄金记录。为了确保当 Salesforce 中的数据更新时（例如不应驻留在 Salesforce\
  \ 中的人力资源系统数据），关联记录得到正确更新，中间件平台（例如 MuleSoft）需要查询 Salesforce，以确定在联系人记录更新时需要更新的关联系统及其记录标识符。这本质上在数据更新或检索操作中增加了往返，因为需要在\
  \ Salesforce 中查询 ID 才能知道应影响哪些关联系统记录。\n\n下图显示了当 Salesforce 持有记录关联时，这可能如何排序：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_65_0.png)\n\
  \n1 从 Salesforce 调用数据更新\n\n2 中间件查询与 Salesforce 记录关联的系统标识符\n\n3 对与 Salesforce 记录关联的系统进行数据更新\n\
  \n图 3.2 – Salesforce 持有黄金记录关联\n\n在下一节中，我们将研究当中间件持有记录关联时黄金记录的表示方式。\n\n#### 中间件持有黄金记录关联\n\
  \n以上一节的示例为例，如果中间件（例如 MuleSoft）持有黄金记录关联，我们基本上可以让 Salesforce 只关心自身在记录完整性方面的事，而将确保对关联系统的数据操作正确性的责任转移给中间件。这确实减少了最初查询\
  \ Salesforce 以确定这些关联系统 ID 的需求，但需要额外建立一个流程，以确保当关联系统被添加到 IT 企业或从中移除时，中间件能够得到适当更新。\n\
  \n下图显示了当中间件持有记录关联时，这可能如何排序：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_66_0.png)\n\
  \n- 1. 从 Salesforce 调用数据更新\n- 2. 中间件从内部数据库查询与 Salesforce 记录关联的系统标识符\n- 3. 对与 Salesforce\
  \ 记录关联的系统进行数据更新\n\n图 3.3 – 中间件持有黄金记录关联\n\n接下来，让我们看看当单独的系统或外部注册表持有记录关联时黄金记录的表示方式。\n\
  \n#### 单独的系统持有黄金记录关联\n\n需要调用另一个单独的注册表系统或类似系统（通常通过中间件如 MuleSoft 协调），黄金记录不一定知道构成它的记录是什么，因此，使用标识符注册表来拼凑记录信息，然后协调对其他单独系统的调用。此操作可以由\
  \ Salesforce 调用中间件启动，使用 Salesforce 记录 ID 拼凑黄金记录，然后在注册表系统中引用以协调多个系统调用并将返回的数据处理回用户。或者，中间件或批处理系统可以按计划协调对黄金记录的数据更新。\n\
  \n下图显示了当单独的系统持有记录关联时数据更新可能如何排序：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_67_0.png)\n\
  \n1 从 Salesforce 调用数据更新\n\n2 中间件从外部注册表查询与 Salesforce 记录关联的系统标识符\n\n3 对与 Salesforce\
  \ 记录关联的系统进行数据更新\n\n图 3.4 – 查询外部注册表以获取与 Salesforce 记录关联的系统标识符\n\n当然，有时你可能希望使用保存在\
  \ Salesforce 之外的數據。\n\n#### 使用 Salesforce Connect 实时拉取数据用于只读目的\n\n在 Salesforce 记录上的数据不一定需要驻留在\
  \ Salesforce 内的场景中（按需从一个或多个系统或数据源拉取），Salesforce Connect 可用于有效地向用户呈现数据，就好像它驻留在 Salesforce\
  \ 内一样（具有相同的用户界面和一定程度的交互性）。Salesforce Connect 使用适配器原则从外部源引入数据。例如，开箱即用提供 OData 2.0、OData\
  \ 4.0 和跨组织（Salesforce 到 Salesforce）适配器，并且在 Apex 中提供编写自定义适配器的框架。\n\n如果没有中间件解决方案（例如\
  \ MuleSoft）或确实不希望使用，则可能需要为数据访问目的建立到外部系统的点对点集成，而这正是 Salesforce Connect 的完美用例。\n\n\
  使用 Salesforce Connect 时，外部对象（正如你在第 2 章《数据建模和数据库设计》中回忆的那样）映射到外部系统中的数据表。此数据可以在 Salesforce\
  \ 中执行操作时被用户查询和使用，例如搜索、在外部系统中的数据与 Salesforce 中保存的数据之间关联数据（使用外部或间接查找关系），或查看记录动态。\n\
  \n默认情况下，Salesforce 中的外部数据源是只读的，但可以使其可写。例如，想象一下从 SAP 查看订单数据，与 Salesforce 中保存的自定义账户关联。可以将外部数据源启用为可写的外部对象，以便可以从\
  \ Salesforce 创建新订单，将其写回 SAP，并在那里创建订单。\n\n设置 Salesforce Connect 时，可能需要一种身份验证机制，以便\
  \ Salesforce 可以安全地与另一系统通信。这可能采用 Salesforce 将用于在外部系统执行查询的用户用户名/密码的形式，也可能采用更复杂的设置，例如使用外部身份验证服务（如\
  \ Microsoft Azure Active Directory）的开放式身份验证（OAuth）。\n\n#### 使用 OData 2.0 或 OData\
  \ 4.0 适配器进行外部数据检索\n\nOData 是建立在表述性状态转移（REST）之上的协议。如 https://www.odata.org 所定义，OData\
  \ 被描述为一个开放协议，允许以简单和标准的方式创建和消费可查询且互操作的 REST-ful API。\n\n如果外部数据源可以作为 OData RESTful\
  \ Web 服务公开，则可以使用 OData 2.0 或 OData 4.0 Salesforce Connect 适配器允许其在 Salesforce UI\
  \ 中显示。\n\n#### 使用跨组织适配器进行外部数据检索\n\n可以使用 Salesforce Connect 的跨组织适配器从另一个 Salesforce\
  \ 实例拉取数据。这使用 Lightning Platform REST API 来访问存储在另一个 Salesforce 实例（也称为组织或 org）中的数据，尽管实现对设置\
  \ Salesforce Connect 跨组织适配器的 Salesforce 管理员来说是隐藏的。因此，可以将一个 Salesforce 实例中的数据拉取到另一个实例中。\n\
  \n例如，如果你的公司收购了另一家也使用 Salesforce 的公司，但决定被收购的公司将继续保持一定程度的独立性并保留其单独的 Salesforce 系统，那么机会数据可以拉入你的\
  \ Salesforce 实例，以便可以对更完整的销售数据进行报告。\n\n#### 使用自定义适配器进行外部数据检索\n\n在现有适配器不合适的场景中，可以使用\
  \ Apex Connector Framework 在 Apex 中创建自定义适配器。编写此类适配器的编码知识不在考试或本书的范围内，但文档可以在此处找到：https://developer.salesforce.com/docs/atlas.en-us.234.0.apexcode.meta/apexcode/apex_connector_top.htm。\n\
  \n当外部数据源既不兼容 OData 2.0 或 OData 4.0，也不是另一个 Salesforce 实例时，通常需要自定义适配器。在这些场景中，需要自定义适配器与外部数据源通信，以便其数据可以在\
  \ Salesforce UI 中直接呈现、搜索和查询。\n\n在了解了通过与保存在其他系统中的数据（系统标识符）的关系构建黄金记录数据的各种方法后，让我们探讨如何整合来自这些系统的数据属性。\n\
  \n#### 从多个来源整合数据属性\n\n在设计 MDM 策略时，我们需要确定构成黄金记录的数据属性以及数据属性的来源。当多个来源可能包含相同属性时，可能需要实施清洗和去重流程，以确保企业范围内的数据属性值保持一致。根据使用的\
  \ MDM 实现方法，可能需要允许任何源系统促进对黄金记录的数据属性更新，然后触发流程将该更新推送到该数据属性的所有源系统。因此，在首次实施黄金记录时，数据质量和分类至关重要，因此应为初始黄金记录填充的一部分的数据清洗、匹配和去重策略留出时间。然后明智的做法是考虑锁定源系统以供用户创建新记录，以便在录入系统中捕获重复记录，并将创建新记录的权限几乎完全保留给集成或流程用户。这样，用户在单一位置输入数据，并在出现数据重复问题时立即被告知，源系统保持尽可能干净的状态。\n\
  \n\n\n\n\n不可避免地，随着时间的推移可能会出现数据问题，而报告和分析将有助于推断这些问题的原因。用户行为可以通过对数据录入系统进行培训和修改（通过使用验证和审批流程）来影响，并且可以通过对构建它们的规则库进行更改来调整自动化流程。\n\
  \n在了解了我们掌握的多个系统之间的数据属性整合后，让我们现在看看在处理来自黄金记录的数据时如何保留可追溯性和上下文。\n\n#### 保留可追溯性和业务规则上下文\n\
  \n与我们建立黄金记录或单一事实来源一致，重要的是 MDM 策略能很好地与现有的业务规则协同工作，并且对数据的更改在整个组织中得到保留。例如，从 Salesforce\
  \ Financial Services Cloud 实例中在连接的系统中创建银行账户的过程将由代表 Salesforce 行事的用户完成——这提供了一些关于该操作由何而起的可追溯性。记录在连接系统中创建或更新的规则在很大程度上仍然成立（尽管有些可能需要为\
  \ MDM 策略引入的流程进行调整）。\n\n客户在银行的地址更新之前可能已在源系统中受到审批流程的约束。将此审批流程上移至记录系统（如我们银行示例中的 Salesforce\
  \ Financial Services Cloud）可保留业务规则的上下文，以便审批仍然进行。将业务规则移至适当的系统仍可保留其上下文，便于数据管理的“谁、何时做了什么”性质。\n\
  \nSalesforce 提供了多种用于保留可追溯性和捕获元数据的功能。\n\n#### 事件监控\n\n用户事件可以在 Salesforce 事件监控中捕获，例如登录/注销事件、网页点击、API\
  \ 调用、Apex 执行和报表导出。有关 Salesforce 事件监控的更多信息，请在此处查看：https://trailhead.salesforce.com/content/learn/modules/event_monitoring。\n\
  \n#### 设置审核跟踪\n\n设置审核跟踪是 Salesforce 对在 Salesforce 设置区域中执行的操作所保留的日志，有助于确定系统管理员和具有某些设置权限的人员已采取了哪些操作。\n\
  \n#### 字段历史跟踪\n\n字段历史跟踪允许记录和保存对 Salesforce 对象特定字段的更改（在 Salesforce 设置中配置）。这包括进行更改的用户、更改的日期/时间、旧值和新值。默认情况下，您可以跟踪每个对象的最多\
  \ 20 个字段的历史记录。\n\n#### 字段审核跟踪\n\n字段审核跟踪是 Salesforce 的一项功能，用于定义归档字段历史数据的保留策略。这可以从数据被归档时起保留\
  \ 10 年（与未启用字段审核跟踪时 Salesforce 允许的 18 个月相对）。字段历史跟踪是字段审核跟踪的先决条件（例如需要旧值和新值）。启用字段审核跟踪后，可跟踪的每个\
  \ Salesforce 对象的字段数量限制从 20 增加到 60。保留策略使用 Salesforce 元数据 API 定义。更多信息可在此处找到：https://help.salesforce.com/s/articleView?id=sf_field_audit_trail.htm&type=5。\n\
  \n#### 自定义元数据类型和自定义设置\n\n自定义元数据和自定义设置便于创建和存储特定于组织 Salesforce 实施的元数据。这可能包括专有配置信息，以及例如业务逻辑的值存储。\n\
  \n让我们现在总结一下本章所涵盖的内容。\n\n#### 摘要\n\n在本章中，我们涵盖了 MDM 背后的大量理论、数据记录的单一事实来源，以及一些实施方法及其注意事项。虽然\
  \ Salesforce 通常被实施为事实上的事实来源，但了解为什么这通常推动这些决策以及它带来的好处很重要，因此花时间研究 MDM 理论是有意义的。在理解了该理论后，应能清楚\
  \ Salesforce 如何融入组织的 MDM 策略。\n\n我们研究了数据质量在 MDM 背景下的重要性，以及为什么要保留构成单一事实来源或黄金记录的企业系统中数据属性的重要性。\n\
  \n我们将注意力转向 Salesforce 中的 MDM 实施，涉及中间件的使用，并强调 Salesforce 上线时必然伴随的数据迁移工作。\n\n我们介绍了黄金记录是什么，并研究了在确定黄金记录的数据字段驻留位置以及源系统中的哪些数据字段构成黄金记录时需要考虑的各种因素。与\
  \ IT 企业中不同系统与黄金记录关联相关的架构会影响数据操作的工作方式和业务规则的运行，因此我们也涵盖了其背后的理论。我们还研究了如何保留数据质量并确保操作和流程的可追溯性和业务规则上下文，强调由于\
  \ IT 环境中引入新的数据主系统，流程运行的系统可能会发生变化。\n\n在 *第 4 章，Salesforce 数据管理* 中，我们将深入探讨 Salesforce\
  \ 许可类型如何影响数据模型和可用的共享选项。我们还将研究如何在平台上治理数据，因为这是设计可扩展、高性能的解决方案以组合来自一个或多个 Salesforce\
  \ 实例的数据的关键。\n\n#### 练习题\n\n+ 1. *单一事实来源* 另称为什么？\n+ 2. *源记录* MDM 实施方法是什么？\n+ 3. 在实施\
  \ MDM 时，合并的黄金记录与黄金记录共存之间有什么区别？\n+ 4. 在 Salesforce 与另一系统之间简单的点对点集成中，另一系统中记录的 ID（与\
  \ Salesforce 记录关联）应存储在哪里？\n+ 5. 如果没有外部注册表且外部系统 ID 不存储在 Salesforce 中，但 Salesforce\
  \ 通过中间件连接到其他系统，记录 ID 关联的理想存储位置在哪里？\n\n#### 答案\n\n+ 1. 黄金记录。\n+ 2. 每个人都使用单一系统访问同一单一信息集。\n\
  + 3. 合并的黄金记录是连接系统中更改的发起者。黄金记录共存意味着任何连接系统都可能发起数据更新（双向数据同步）。\n+ 4. 在 Salesforce 中。\n\
  + 5. 在中间件中。\n\n#### 延伸阅读\n\n- *MDM 初学者指南:* https://www.dataqualitypro.com/blog/beginners-guide-to-mdm-master-data-management\n\
  - *什么是主数据管理（MDM）？* https://www.mulesoft.com/resources/esb/what-is-master-data-management-mdm\n\
  - *Salesforce Connect:* https://developer.salesforce.com/docs/atlas.en-us.234.0.apexcode.meta/apexcode/platform_connect_about.htm\n\
  \n#### Salesforce 数据管理\n\n在掌握了 **主数据管理（MDM）** 概念后，我们现在可以研究 Salesforce 数据管理。本章中，我们将研究\
  \ Salesforce 数据模型和 Salesforce 许可如何协同工作。所选择的许可类型会影响可用的对象。这可以扩展到 Experience Cloud\
  \ 许可类型情况下可用的记录共享功能。\n\n我们将研究 Salesforce 平台上的数据持久性是什么样的，以及在 Salesforce 平台上治理解决方案时如何运作。\n\
  \n接下来，我们将扩展来自 *第 3 章，主数据管理* 的 *黄金记录* 理论，以解释 Salesforce 平台上的 **单一客户视图（SCV）** 是什么样，以及来自多个\
  \ Salesforce 云和多个 Salesforce 实例的数据如何拼凑在一起。\n\n因此，本章将涵盖以下主题：\n\n- 分析 Salesforce 许可类型和对象访问\n\
  - 持久化数据\n- 在 Salesforce 平台上表示客户的单一视图\n- 整合来自多个 Salesforce 实例的数据\n\n#### 分析 Salesforce\
  \ 许可类型和对象访问\n\n在本节中，我们将介绍不同的 Salesforce 许可选项如何影响用户可用的对象和标准功能。鉴于 Salesforce 产品中可用的庞大功能阵列，重要的是要确定所需的对象和功能（从内部和外部访问角度）是什么，以便购买正确的许可证。如预期，某些许可证比其他许可证更昂贵——例如，Service\
  \ Cloud 许可证比 Sales Cloud 更昂贵。在 Experience Cloud 的情况下，此类许可证不仅会影响用户可用的对象，还会影响共享规则和角色层级。我们将在本节后面讨论这些影响。\n\
  \n\n\n\n\n由于正确获取许可的重要性至关重要，认证技术架构师（CTA）评审委员会产生的一个重要成果是《角色与许可》。这本质上是不同用户类型及其为与所提议的解决方案正确交互所需的许可的清单。作为\
  \ Salesforce 架构师，你应将此练习视为解决方案的支柱。如果出错，它会对用户的工作方式产生深远影响。\n\n#### 重要说明\n\n**Experience\
  \ Cloud = Community Cloud：** Salesforce 已将 Community Cloud 重新品牌为 Experience Cloud。这是有意为之，代表着\
  \ Communities 从外部用户访问 Salesforce 数据的视角转变。驱动 Community Cloud/Experience Cloud 的技术已经发展到可以从中驱动整个数字体验和电子商务商店的前端，因此进行了重新品牌。为了避免疑问，Community\
  \ Cloud、Communities 和 Experience Cloud 是同一事物。在撰写本文时，Salesforce 文档尚未完全更新，因此请注意你仍可能不时看到对\
  \ Community Cloud 和 Communities 的引用。\n\n让我们现在深入探讨 Salesforce 平台上的不同许可类型。\n\n####\
  \ 标准平台许可\n\n核心 Salesforce 平台由以下几个产品组成：\n\n- **Lightning Platform**\n- **Sales Cloud**\n\
  - **Service Cloud**\n- **Experience Cloud**\n\n这些产品都围绕着支撑 Salesforce 平台的核心应用框架和关系数据库构建。事实上，Sales\
  \ Cloud、Service Cloud 和 Experience Cloud 都可以被视为对核心 Lightning Platform 的增强。例如，Sales\
  \ Cloud 拥有（其中包括）Account、Contact、Opportunity 和 Lead 对象。这些是预定义且相互关联的对象，可快速轻松地设置和促进销售流程。它们也可以被视为一组预定义的对象和相关功能，建立在\
  \ Lightning Platform 的基础之上——即关系数据库和应用层。\n\nService Cloud 在 Sales Cloud 可用的功能之上构建（尽管\
  \ Service Cloud 和 Sales Cloud 设计用于解决不同的用例）。由于向用户公开的功能不同，Service Cloud 采用与 Sales\
  \ Cloud 不同的成本模型，因此被归类为不同的产品许可。\n\nExperience Cloud 可以被视为进入 Salesforce 数据的透镜，并且有几种\
  \ Experience Cloud 许可类型可用。这些将在下一节中解释。Experience Cloud 仅公开对核心平台上对象的访问，因此包括 Sales\
  \ Cloud 对象、Service Cloud 对象（如果已许可）和自定义对象。\n\n在设计需要数据驻留在 Salesforce 平台上的解决方案时，请考虑你的内部用户所需的标准平台许可。一般来说，如果\
  \ Sales 或 Service Cloud 提供的标准对象旨在保存特定类型的数据或用于执行特定功能，则建议利用其周围构建的功能。\n\n例如，当你需要潜在客户开发功能时，使用\
  \ Sales Cloud，因为这是开箱即用的 **Lead** 对象提供的功能。还有诸如 **Lead Assignment Rules** 和转换以创建 **Account**、**Contact**\
  \ 和 **Opportunity** 记录等功能。自己重新创建这些对象是无效的。同样，当你对客户案例有 **服务等级协议（SLA）** 功能需求时，Service\
  \ Cloud 为此目的提供了 **Entitlement** 和 **Milestone** 对象。如果你希望为客户提供访问权限，以便他们可以提出支持查询或对你出售给他们的产品提出问题，Experience\
  \ Cloud 提供了实现这一目的的手段。\n\n现在我们已经介绍了内部用户的标准平台许可，让我们来看一下外部用户访问的 Experience Cloud 许可。\n\
  \n#### Experience Cloud 许可\n\nExperience Cloud 是外部用户（非公司内部人员）访问 Salesforce 的方式。在本节中，我们将查看为外部用户提供的许可类型。\n\
  \nExperience Cloud 许可与标准平台许可的工作方式不同，因为每种许可类型都会影响对对象和记录共享的访问。设计解决方案时有不同类型的 Experience\
  \ Cloud 许可可供使用——具体如下：\n\n- **External Apps.** 用于自定义数字体验，包括客户参与和品牌忠诚度。对 Salesforce\
  \ 对象的访问有限。此许可类型可与 Person Accounts 配合使用。\n- **Customer Community.** 用于 **面向消费者（B2C）**\
  \ 体验，拥有大量需要访问 **Case** 对象或 Salesforce 知识库的用户。此许可类型可与 Person Accounts 配合使用。\n- **Customer\
  \ Community Plus.** 用于 B2C 体验，其中用户需要访问报表和仪表板并需要高级共享。此许可类型可与 Person Accounts 配合使用。\n\
  - **Partner Community.** **企业对企业（B2B）** 体验，其中用户需要访问 **合作伙伴关系管理（PRM）** 对象，例如 **Lead**\
  \ 和 **Opportunity**。此许可类型不能与 Person Accounts 配合使用。\n\n这在以下图表中进行了说明：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_79_0.png)\n\
  \n图 4.1 – Experience Cloud 许可类型差异\n\n#### 重要说明\n\n**何时使用不同的 Experience Cloud 许可类型：**\
  \ 简而言之，有一种相对简单的方法来确定 Experience Cloud 站点应使用哪种许可类型。\n\n一般来说，从 Customer Community\
  \ 许可类型开始，然后根据你的需求进行调整，如下所示：\n\n如果需要高级共享（超出共享集）对报表和仪表板的只读访问，请升级到 Customer Community\
  \ Plus 许可。\n\n如果需要 **Lead** 或 **Opportunity** 对象访问，或需要创建报表和仪表板的能力，请选择 Partner Community。\n\
  \n当然，还有额外的细微差别（在 https://help.salesforce.com/s/articleView?language=en_US&type=5&id=sf.users_license_types_communities.htm\
  \ 中进行了解释），但这应该是学习考试时入门的好方法。\n\n#### 非核心平台的 Salesforce 产品许可\n\nSalesforce 套件中的 *非核心*\
  \ 产品（如 Commerce Cloud 和 Marketing Cloud）许可方式不同。它们的许可不在考试范围内，因此本书中不会涵盖。\n\n#### 完整产品与\
  \ Salesforce 管理包\n\n核心平台上的 Salesforce 产品——如 Sales Cloud、Service Cloud 和 Experience\
  \ Cloud——按每用户每月进行许可。每个许可都会打开更多功能并访问 Salesforce *核心* 平台上的不同实体。\n\nSalesforce 套件中的某些产品是单独许可的，并通过连接器与核心平台交互，例如\
  \ Marketing Cloud、Pardot 或 Commerce Cloud。考试大纲涵盖核心平台使用，因此复习应集中在 *核心* 平台产品提供的数据实体和功能上。\n\
  \n为核心平台构建的 Salesforce 管理包，包括但不限于 Financial Services Cloud、Manufacturing Cloud 和\
  \ Health Cloud，本质上是许可的管理包，可在 *核心* 平台上安装额外的实体、应用和其他功能（如流程）。\n\n让我们现在来看一下包许可，这也适用于托管和\
  \ AppExchange 包。\n\n#### AppExchange 和包许可\n\n根据 AppExchange、托管或非托管包的许可要求，权限集许可通常是许可付费包的典型方法。正如你所知，在从\
  \ AppExchange 安装包时（或直接从 Salesforce 安装，例如 Financial Services Cloud 等产品），用户需要获得正确的权限集许可，才能访问该包特有的任何对象或其他功能。在设计需要访问包公开的数据实体和其他功能的解决方案时，需要为需要访问该功能的用户授予一个或多个与该托管包关联的权限集许可。\n\
  \n正如你现在所知，作为 Salesforce 架构师，我们在平台上构建稳健、可扩展的解决方案以向合适的用户提供合适的功能时，有多种许可选项可供选择。这扩展到外部用户以受控方式与你的\
  \ Salesforce **组织（org）** 中保存的数据进行交互。我们现在可以转向以一致的方式在 Salesforce 平台上持久化数据。\n\n\n\n\
  \n#### 持久化数据\n\n确保数据以一致的方式持久化对于 Salesforce 实施的长期成功至关重要。因此，了解数据质量问题的成因以及改善数据质量的可用技术非常重要，但理想情况下应尽可能在问题发生前就加以预防。\n\
  \n数据质量问题可能源于数据的年龄、数据的完整性和准确性、是否存在重复数据，以及数据使用方式的一致性。数据质量问题可能导致用户看到不完整或错误的信息，从而花费更多时间收集这些信息（这可能需要他们在多个系统或多个数据源中花费时间）。更糟糕的是，客户可能会因账户经理或服务代理掌握的信息不完整或不正确而受到糟糕的客户服务。最后，沮丧的用户可能会被阻止使用系统记录（SOR），转而采用离线流程，这意味着系统采用率降低或下降。幸运的是，Salesforce\
  \ 提供了多种功能来解决这些潜在问题。\n\n从数据重复开始，Salesforce 能够指定匹配和重复规则，以便识别并合并特定类型的记录，例如重复线索（如同一人多次通过\
  \ Web2Lead 捕获却存在多条线索记录的示例）。开箱即用的匹配和重复规则基于合理的默认值构建，例如共享电子邮件地址的线索或联系人可能是潜在重复项。用户会在\
  \ Salesforce 用户界面（UI）上收到通知，从中他们可以采取补救措施，例如丢弃当前记录（或潜在重复项）或合并记录信息。\n\n在数据输入方面，可以利用验证规则来确保满足公式化条件，从而防止记录创建或更新，使用户在输入正确数据时遵守特定格式。例如，如果线索被推进到某个阶段之外，就可以使用验证规则来确保选择了某个行业字段或已输入有效的电话号码（精确到格式）。其次，可以使用选择列表（预定义的值列表）来限制用户可以对记录输入的值。当使用选择列表而不是自由文本值时，用户会被限制（以积极的方式）从受管理的列表中选择值。由此，报告和搜索变得更快、更轻松。还有依赖选择列表的概念，即一个选择列表中的值会根据另一个选择列表进行过滤或限制。这再次可用于引导用户从特定值集中选择，以推动数据质量。这些值集可以在多个选择列表之间共享，以确保所选值的<|message|>一致性（因为底层值是共享并集中管理的）。\n\
  \nSalesforce 具有以工作流规则和流程形式存在的声明式自动化。工作流规则可以被视为一组指令的容器，用于基于定义的标准（可以是时间限制）自动执行操作，例如发送电子邮件或更新字段。这些指令可以被视为采用“如果这样，就那样”的格式。\n\
  \n流程可用于执行某些记录操作，以推动数据的一致行为。例如，当创建账户时，可以运行一个流程，最终触发对信用机构的外部调用，以获取与账户记录相关的公司信用评级信息。\n\
  \n自动化类别中的下一个是**审批流程**。Salesforce 平台的此功能促进记录更改由用户的经理、指定用户或一组审批者提交审批。审批可以进行配置（以便一组中的一人或整组都需要批准请求），并提供变更发生的虚拟纸质\
  \ trail。例如，销售人员尝试对超过一定阈值的报价申请折扣时可能需要销售总监的批准。Salesforce 的审批流程机制非常适合这种行为。\n\n最后，可能还需要数据清理。Salesforce\
  \ 本身不包含原生数据清理功能，但 AppExchange 套件和外部工具存在，可促进数据的实时清理、丰富和去重，无论是在平台上原位进行（对于 AppExchange\
  \ 套件而言），还是在平台外进行，其中需要数据的导出/导入（对于功能齐全的离线工具而言）。\n\n虽然数据清理功能本身并非平台原生，但有一些字段类型和配置选项可以利用，使在分类、清理和去重数据时生活更轻松。这些通常是选择列表、复选框和查找过滤器。\n\
  \n简而言之，**选择列表**用于将输入限制为一组预定义值之一（可以是全局值集以实现组织范围内的选项统一）。**复选框**用于真/假值选择，而**查找过滤器**可以确保待选值的范围被缩小到根据过滤标准确定的适用值。\n\
  \n在制定数据管理策略时，考虑要灌输（并在可能的情况下应用报告和验证）何种约定可能是明智的。例如，对于**英国（UK）**公司，始终将后缀 *Limited*\
  \ 缩写为 *Ltd*。虽然这是一个过于简化的示例，但其原则是数据创建、更新和查看的一致性可确保在处理数据时不会产生混淆，并且数据可以保持一致状态。\n\n这就自然引出了数据质量如何被监控的问题。应从一开始就设计一个计划，以确定如何识别数据以及将如何处理它，直至此类活动的负责人和所有者。例如，销售团队需要在每个月末审查并更新所有不完整的线索记录，以符合业务的数据完整性或格式要求。这样一来，团队就知道每个月开始时的数据集比上个月结束时更好。\n\
  \n现在我们已经介绍了如何在 Salesforce 平台上以一致的方式持久化数据，我们现在可以看看 Salesforce 如何在其平台上解决*客户单一视图*的概念。\n\
  \n#### 在 Salesforce 平台上表示客户的单一视图\n\n客户的单一视图（有时称为 SCV，但含义完全相同），代表每个客户统一的 360° 视图。如第\
  \ 3 章《主数据管理》所述，可以使用集成层来生成黄金记录，其中它从多个来源整合数据（使用标识符（ID）注册表或 Salesforce 中的 ID 与记录相对应）。此外，数据清理、去重和丰富可以包含在整合客户数据的过程中。\n\
  \n你可能知道也可能不知道，并非所有 Salesforce 云都位于相同的底层基础设施上，因此 Salesforce 提供了各种连接器和加速器来克服这一点。示例包括以下内容：\n\
  \n- Marketing Cloud 连接器——连接 Marketing Cloud 和 Sales Cloud\n- Pardot 连接器——连接 Pardot\
  \ 和 Sales Cloud\n- Commerce Cloud（B2B 和 B2C）的 MuleSoft 加速器和连接器\n\nSalesforce 将各种技术和连接器整合形成一个名为\
  \ Customer 360 的产品。例如，可以使用连接器和 MuleSoft 作为集成平台，从多个 Salesforce 云中整合数据来构建全局配置文件。例如，客户的\
  \ B2C Commerce Cloud 配置文件、Service Cloud 配置文件、Experience Cloud 配置文件、Marketing Cloud\
  \ 配置文件和外部系统数据都可以整合在单个全局配置文件 ID 下。其示例是零售的 Salesforce 架构，网址为 https://help.salesforce.com/s/articleView?id=sf.icx_b2c_solution_architecture_overview.htm&type=5。\n\
  \n让我们现在来看看 Customer 360 平台的不同元素。\n\n#### Customer 360 平台的元素\n\nCustomer 360 平台有几个区域对数据架构考试有用。接下来将进行说明。\n\
  \n#### Salesforce Customer 360 Data Manager\n\nCustomer 360 Data Manager 是 Salesforce\
  \ 的解决方案，用于连接 Salesforce 产品、Salesforce 实例、Commerce Cloud B2C 实例和其他数据源中的以客户为中心的数据。数据通过一个视图呈现，以提供客户的单一视图。\n\
  \nSalesforce 然后在其上叠加 Einstein 仪表板，提供数据验证功能。已匹配以形成全局配置文件的源记录数据可以从单个位置进行管理，包括编辑和删除源数据。\n\
  \n\n\n\n\nThere is also the concept of a **Cloud Information Model (CIM)** that\
  \ maps data to a common schema. This provides a single representation of that data\
  \ in connected data sources.\n\nSalesforce technologies such as Marketing Cloud,\
  \ MuleSoft, and Commerce Cloud form part of a Data Manager solution, as data points\
  \ exposed in these technologies form the data points of the customer representation.\n\
  \nThese concepts should be familiar given the concepts and theory we covered in\
  \ *Chapter 3, Master Data Management.*\n\nNext up, let's look at Customer Identity.\n\
  \n#### *Salesforce Customer Identity*\n\nSalesforce Customer Identity is a name\
  \ given to a suite of technologies that allow (from an **Identity and Access Management**,\
  \ or **IAM**, perspective) customers and partners to access your Salesforce instance\
  \ and interact with your brand. Salesforce Identity concepts apply here, with the\
  \ addition of Experience Cloud sites as the means upon which your brand is interacted\
  \ with. As you may already know, Experience Cloud sites can be set up to use **Open\
  \ Authentication (OAuth)**, **Single Sign-On (SSO)** (if not through an OAuth provider\
  \ such as Facebook or Google), and passwordless login. It's also possible to use\
  \ Customer Identity to embed a login experience into an existing website (such as\
  \ an e-commerce site at the checkout stage). This provides a touchpoint to customers\
  \ and allows for the collection of information such as an email address, currency\
  \ preference, and so on.\n\nThis functionality requires External Identity or Community\
  \ license types.\n\nLastly, let's investigate the **Customer Data Platform (CDP)**.\n\
  \n#### *Salesforce CDP*\n\nIn what can be thought of as an evolution of the traditional\
  \ **Customer Relationship Management (CRM)** system, Salesforce CDP layers on engagement\
  \ information (from Marketing Cloud) and buying information (from Commerce Cloud),\
  \ along with integrated data sources using MuleSoft. In a nutshell, it is used to\
  \ unify and segment data so that experiences for customers that are powered by the\
  \ Salesforce Platform can be targeted and personalized to them. Customers can be\
  \ engaged using their preferred channels and have a personalized experience that\
  \ transcends sales, service, commerce, and marketing because these technologies\
  \ are all connected, and the single view of the customer is exposed through the\
  \ Salesforce Platform.\n\nNow that we've explored how we can represent a single\
  \ view of the customer on the Salesforce Platform, let's now look at how an important\
  \ part of that process—data from multiple Salesforce instances—can be achieved.\n\
  \n#### Pulling together data from multiple Salesforce instances\n\nSalesforce data\
  \ architects must be able to design how to effectively consolidate, process, and\
  \ leverage data from multiple Salesforce instances. While there are pros and cons\
  \ of using multiple Salesforce instances within the boundaries of an **Information\
  \ Technology (IT)** enterprise, there are instances where knowing how to best leverage\
  \ the data from those multiple instances together across the IT enterprise can unlock\
  \ value for your users. Salesforce offers several options or solutions in bringing\
  \ data from several instances of Salesforce. These can include the following:\n\n\
  - Salesforce Connect\n- Salesforce to Salesforce\n- Bulk API\n- Batch Apex\n\nThese\
  \ are explained in the following sections.\n\n#### Salesforce Connect\n\nAs explained\
  \ in *Chapter 3, Master Data Management*, Salesforce Connect is a method for pulling\
  \ in data from external data sources, using the OAuth 2.0 protocol, OAuth 4.0 protocol,\
  \ or a custom Apex adapter for external data access.\n\nSalesforce Connect is useful\
  \ for surfacing data that isn't mastered in Salesforce yet can form part of the\
  \ **Single Source Of Truth (SSOT)**. Consider a financial institution that has bank\
  \ account information in Salesforce. Given the relative frequency in which transactions\
  \ on a bank account may occur, it may make sense to surface that data on demand\
  \ rather than store the transactions in Salesforce. This is a perfect use case for\
  \ Salesforce Connect.\n\nRead more about Salesforce Connect at https://help.salesforce.com/s/articleView?id=sf.platform_connect_about.htm&type=5.\n\
  \n#### Salesforce to Salesforce\n\nSalesforce to Salesforce is a technology that's\
  \ used to share data across Salesforce instances. Essentially, a connection is made\
  \ between Salesforce instances, and then data sharing is set up so that users can\
  \ see shared data and updated information from another Salesforce instance in their\
  \ own Salesforce instance. Users only have access to shared records as they are\
  \ mapped to records in their own org, and therefore the original data records in\
  \ the external Salesforce org aren't directly accessible to users in your org. Custom\
  \ reports can be created to report on external data. Field subscriptions can also\
  \ be set up to map fields in an external Salesforce instance to fields in your Salesforce\
  \ instance.\n\nSalesforce to Salesforce is useful in scenarios such as a company\
  \ that has different divisions that cannot or do not share business logic. This\
  \ may be since the company has made a merger or acquisition or has a group structure,\
  \ such as rolling up sales data from one **Business Unit (BU)** to a parent or group\
  \ BU. Salesforce to Salesforce can be one-directional or bi-directional in terms\
  \ of information transfer.\n\nMore information on Salesforce to Salesforce can be\
  \ found at `https://help.salesforce.com/s/articleView?id=sf.business_network_intro.htm&type=5`.\n\
  \n#### Bulk API\n\nSalesforce Bulk API (version 2.0 at the time of writing) is a\
  \ **Representational State Transfer (REST)**-based Salesforce-specific **Application\
  \ Programming Interface (API)** used to asynchronously read, upload, or delete large\
  \ quantities of data on the Salesforce Platform. A good rule of thumb is that any\
  \ datasets of 2,000 records or more are suitable candidates for Bulk API operations.\
  \ As per Salesforce’s documentation at `https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/asynch_api_intro.htm`,\
  \ datasets of fewer than 2,000 records should be used with *bulkified* synchronous\
  \ API calls (adhering to governor limits, using either REST or **Simple Object Access\
  \ Protocol (SOAP)** protocols with the Salesforce Platform).\n\nAddressing the question\
  \ of using Bulk API for the bringing together of data from multiple instances, this\
  \ API is a candidate for cases where large amounts of data are moved from one instance\
  \ of Salesforce to another. Requests are processed asynchronously, with Salesforce\
  \ returning a job ID upon accepting the request that can be queried for periodic\
  \ updates of the status of the job.\n\nRead more on getting started with Bulk API\
  \ at `https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/asynch_api_quickstart.htm`.\n\
  \n#### Batch Apex\n\nComplex, long-running processes that run on the Salesforce\
  \ Lightning Platform can utilize a technology called Batch Apex. Essentially, large\
  \ datasets are queried, broken down into manageable chunks of data, and then processed.\
  \ It is commonplace to perform whole data-type operations on a nightly basis as\
  \ Batch Apex, such as processing and archiving all accounts that have had no activity\
  \ past a certain date. Batch Apex utilizes the Database.Batchable interface and\
  \ the Apex scheduler can be used to facilitate a Batch Apex class being run at certain\
  \ times (such as hourly or nightly).\n\nBatch Apex lends itself well to scenarios\
  \ that call for business-logic operations that need to work with lots of data. In\
  \ the UK, educational institutions and schools are regularly inspected by a regulatory\
  \ body. Imagine that schools, inspectors, and information such as holidays booked\
  \ by inspectors and term dates of schools are all held in Salesforce. A nightly\
  \ Batch Apex job is the perfect candidate to initiate and process the data when\
  \ scheduling inspections for schools, which could in theory require processing down\
  \ to the area an inspector is responsible for.\n\nRead about using Batch Apex at\
  \ https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_batch_interface.htm.\n\
  \n> **Important note**\n> \n> **Batch Apex is an interface:** Batch Apex is exposed\
  \ as an interface that requires a developer to write an implementation for. Therefore,\
  \ Apex coding skills are required for Batch Apex operations as they require running\
  \ queries and processing using bespoke code.\n\nAs we delved into *Chapter 3, Master\
  \ Data Management*, an SSOT approach can be defined and then used to consolidate\
  \ data when presenting data to users. This may manifest itself in a *golden record*.\
  \ One such example for data consolidation whereby data is brought together from\
  \ multiple data sources and forms a single view of the customer is Salesforce Customer\
  \ 360 Data Manager, as explained earlier in the *Representing a single view of the\
  \ customer on the Salesforce Platform* section.\n\n#### Summary\n\nIn this chapter,\
  \ we covered a range of topics related to data on the Salesforce Platform. We started\
  \ by looking at licensing and how different types of licenses affect the solutions\
  \ we build as Salesforce architects. Different license types afford different object/entity\
  \ access and functionality. For example, the Service Cloud license allows for entitlements\
  \ and milestones, meaning it facilitates an SLA mechanism. Without this license,\
  \ users don't have access to the entities for entitlements and milestones.\n\nWe\
  \ also looked at external user access to the Salesforce Platform through the use\
  \ of Experience Cloud license types. We covered the differences afforded in terms\
  \ of object access and sharing functionality and looked at the different use cases\
  \ for each license type for Experience Cloud.\n\nYou may have questioned why licensing\
  \ was important to cover at the start of this chapter, but by now, you'll hopefully\
  \ appreciate that licensing can have a profound impact on the data access of the\
  \ solutions we architect.\n\nNext, we looked at data persistence. We revisited the\
  \ concept of an SCV on the Salesforce Platform, bringing in our knowledge from *Chapter\
  \ 3, Master Data Management*, and understood how Salesforce addresses the notion\
  \ of a single customer through its product suite.\n\nWe also built upon knowledge\
  \ acquired in *Chapter 3, Master Data Management*, in bringing together data from\
  \ multiple Salesforce instances, covering the options available to us to achieve\
  \ this.\n\nIn *Chapter 5, Data Governance*, we'll look at how data on the Salesforce\
  \ Platform can be safeguarded and governed, including visiting the concepts that\
  \ underpin compliant solutions.\n\n\n\n\n\n#### 练习题\n- 1. 在B2C场景中，需要访问报表时，需要哪种Experience\
  \ Cloud许可类型？\n- 2. 哪种Experience Cloud许可类型会暴露**报价**对象？\n- 3. 访问知识库需要哪种Experience\
  \ Cloud许可类型？\n- 4. 哪种Experience Cloud许可类型仅通过共享集促进记录共享？\n- 5. 哪种Experience Cloud许可类型允许创建仪表板？\n\
  - 6. 哪些Experience Cloud许可类型允许使用共享规则？\n- 7. 哪种Experience Cloud许可类型允许创建报表？\n- 8. 哪种Experience\
  \ Cloud许可类型会暴露**潜在客户**和**商机**对象？\n- 9. 哪种技术用于以**开放数据协议（OData）** 2.0或OData 4.0格式展示外部数据？\n\
  - 10. 哪种技术用于在Salesforce平台上处理和执行跨整个数据集的长时运行Apex操作？\n- 11. 哪种技术用于在Salesforce平台上读取、上传或删除大型数据集？\n\
  - 12. 哪种技术用于将一个Salesforce实例中的数据展示给另一个Salesforce实例？\n- 13. Customer 360是Salesforce提供的一种解决方案，旨在提供什么？\n\
  - 14. Marketing Cloud和Salesforce使用什么连接？\n- 15. 在Customer 360中，推荐使用哪种技术将外部数据源的数据整合到Salesforce平台上？\n\
  \n#### 答案\n- 1. Customer Community Plus\n- 2. Partner Community\n- 3. Customer Community\n\
