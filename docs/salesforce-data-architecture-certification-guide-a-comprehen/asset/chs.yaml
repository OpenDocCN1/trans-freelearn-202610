  ```\n\nBulk API 2.0简介：\n\n```\nhttps://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/asynch_api_intro.htm\n\
  ```\n\n#### 数据治理\n\n保护**Salesforce**平台上的数据是Salesforce数据架构师角色的关键部分。本章涵盖*构建合规解决方案*背后的概念，以及Salesforce平台如何提供有助于企业**数据治理**战略技术基础的功能。\n\
  \n在本章中，我们将讨论以下主题：\n\n- 实施合规数据模型的注意事项\n- 企业数据治理\n\n虽然有些人可能认为数据治理是一个有点*枯燥*或无聊的话题，但请继续阅读，你会发现为什么在设计*可扩展、安全*的Salesforce平台解决方案时它很重要。数据治理占认证大纲的10%，因此在参加考试时可以获得一些宝贵的分数。\n\
  \n本章是数据管理、安全性和治理方面相互交织的几个主题的集大成者。在本章结束时，你将理解合规数据模型背后的概念和法规，例如**通用数据保护条例（GDPR）**、**个人身份信息（PII）**等，并且能够阐明企业数据治理是什么以及它与Salesforce平台的关系。\n\
  \n让我们从理解实施合规数据模型的注意事项开始。\n\n#### 实施合规数据模型的注意事项\n\nSalesforce认证数据架构师认证大纲在数据治理的背景下讨论了实施**合规**数据模型。作为Salesforce数据架构师，我们有责任确保能够推荐一种设计数据模型的方法，使其符合以下等法规中规定的**合规标准**：\n\
  \n- **通用数据保护条例（GDPR）**，欧盟\n- **加州消费者隐私法案（CCPA）**，美国\n- **个人信息保护法（PIPA）**，日本\n- **通用数据保护法（LGPD）**，巴西\n\
  - **个人信息保护和电子文件法案（PIPEDA）**，加拿大\n\n这包括审查可用于识别、分类和保护敏感数据的各种选项。\n\n我们现在来看这样一项法规，即GDPR。\n\
  \n##### 什么是GDPR？\n\nGDPR是欧洲数据保护法，规定了如何处理欧盟个人的个人信息。\n\nGDPR旨在控制组织或政府如何使用信息。个人有权知道他们的信息是如何被收集、处理和存储的。他们有权要求公司、政府或实体提供其持有的关于他们的信息，并有权被遗忘。如果提出这样的请求，持有数据的组织必须删除该数据，但须遵守公平数据处理原则（个人在自由选择加入收集此信息的公司或实体时必须已被告知该原则）。公司有法律义务公平地收集信息，仅将其用于所需的特定目的，安全地存储信息，并在不再需要时删除信息。如果公司违反GDPR，罚款可能高达2000万欧元或年度全球营业额的4%中的较高者（这是根据GDPR本身的规定）。\n\
  \n从软件应用程序的角度来看，遵守GDPR的影响包括确保应用程序数据模型能够记录同意和隐私偏好。正如我们已经知道的，Salesforce包含几个标准对象来帮助记录偏好和同意（例如Individual对象）。可以根据特定需求添加额外的自定义对象。\n\
  \n##### Individual对象\n\n根据https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_objects_individual.htm上的Salesforce文档，`Individual`对象代表客户的数据隐私和保护偏好。基于Individual对象的数据隐私记录存储客户的偏好。数据隐私记录与相关的潜在客户、联系人、个人账户和用户相关联。\n\
  \n当启用`Individual`对象时，可以通过将`Individual`字段添加到**潜在客户**、**联系人**和**个人账户**页面布局来向用户公开。\n\
  \n> **重要说明**\n> 启用`Individual`对象：如果在Salesforce中启用了**数据保护和隐私**，则`Individual`对象可用。这可以通过在**Salesforce设置**中的**数据保护和隐私**下选择**在记录中提供数据保护详细信息**来完成。\n\
  \n##### *处理GDPR数据*\n\n个人数据和敏感个人数据受GDPR保护，需要**识别**、**分类**和**保护**。Salesforce如何帮助解决数据保护问题？Salesforce包含多项功能来帮助保护数据免受未经授权的访问，包括以下内容：\n\
  \n- Classic和平台Shield加密\n- 数据掩码\n- 字段级安全\n- 共享设置\n- 事件监控\n- 会话安全\n- 字段历史跟踪\n\n让我们详细讨论这些主题。\n\
  \n##### *Classic加密*\n\n包含在基础许可证中的**classic加密**使用128位**高级加密标准（AES）**为自定义字段（一种独特的自定义字段类型）的静态数据提供加密。用户需要在其配置文件或通过分配的权限集启用**查看加密数据**配置文件权限才能读取加密字段值。Classic加密有助于对没有权限读取值的用户掩码加密字段。他们将看到一系列星号。使用classic加密的加密字段无法搜索，也不能用于Flow、审批流程、工作流更新等自动化操作。因此，在加密某些仅以掩码方式存储数据、供不应查看记录的人查看的字段时，请考虑使用classic加密。如果字段需要静态加密、需要用户可搜索或可在Flow等自动化场景中读取，请考虑改用Shield加密。\n\
  \n\n\n\n> **重要提示**\n> 经典加密实际上是*免费*的：它随任何基础许可证提供，因此不会产生额外费用。\n\n#### Shield 加密\n\n\
  **Shield 加密**（需额外付费）使用 256 位 **AES** 提供静态数据加密。虽然 Shield 加密不提供字段值的数据脱敏，但它允许对标准字段和自定义字段进行加密，且无需特殊字段类型。配置字段时，可以设置加密参数。使用\
  \ Shield 加密的字段可以被搜索，并可用于 **Flow** 等自动化工具中。此外，**Salesforce Shield** 允许你加密**文件和附件**。你可以在\
  \ https://developer.salesforce.com/docs/atlas.en-us.securityImplGuide.meta/securityImplGuide/security_pe_vs_classic_encryption.htm\
  \ 了解更多关于经典加密和 Shield 加密之间的差异。\n\n> **重要提示**\n> Shield 加密适用于标准对象：经典加密不适用于标准对象。因此，如果需要加密标准对象上的数据，你就需要投入采用\
  \ Shield 加密。\n\n#### 字段级安全性\n\n正如*第 2 章“数据建模与数据库设计”*中所述，**字段级安全性**在配置文件和权限集级别设置，简单来说，它决定用户是否可以看到某个字段、读取其中的值，或编辑该字段中的值。字段级安全性是一种实际可行的方法，用于判断用户是否应有权访问某个字段，以及如果应该有，该访问权限是只读还是读/写。\n\
  \n#### 共享设置\n\n同样在*第 2 章“数据建模与数据库设计”*中提到的，**共享设置**（如**组织级默认值（OWDs）**）可用于规定用户对 Salesforce\
  \ 实例数据的默认访问级别。\n\n#### 事件监控\n\n作为 Salesforce Shield 套件的一部分，**事件监控**允许访问一个名为 **EventLogFile**\
  \ 的仅限 API 的对象、**LoginEvent** 对象、**事务安全**，以及一个 **Event Monitoring Analytics** 应用程序。\n\
  \n启用事件监控后，可以通过 API 或使用 Tableau CRM 应用直观查看事件类型来理解事件并对其采取行动。当通过 API 对事件采取行动时，可以判断出诸如“不可能行程”之类的使用情况。不可能行程是指在时间上接近但地理位置相距遥远的登录或页面请求，使得在特定时间内从这些位置进行访问不可能实现，并可能具有恶意。\n\
  \n你可以访问 `https://help.salesforce.com/s/articleView?id=000339868&type=1.` 了解如何启用事件监控。\n\
  \n#### 会话安全设置\n\n可以为用户在访问 Salesforce 时配置与会话安全相关的设置，以保护平台中组织数据的安全访问。\n\n会话设置涵盖广泛的主题，包括**超时设置、缓存、多因素身份验证**，以及用于访问敏感数据的**高保障会话**。\n\
  \n你可以在 `https://help.salesforce.com/s/articleView?id=sf.admin_sessions.htm&type=5.`\
  \ 了解更多关于会话安全的信息。\n\n#### 字段历史跟踪\n\n最后（但绝不是最不重要的），**字段历史跟踪**是一个强大的工具，可以了解谁对特定的一组对象字段做了何种更改。某些字段更改可能需要贵公司进行跟踪——例如，谁更改了\
  \ **Opportunities** 上的 **Stage** 选择列表，记录旧值和新值、更改者以及更改时间。字段级安全性允许通过 Salesforce *开箱即用*地跟踪每个对象的\
  \ 20 个字段，不过 Shield（需要单独的订阅/付费）可以将每个对象的该限制提升至 60 个字段。此外，使用 Shield 时，字段历史数据会在 18 个月后归档，并保存\
  \ 10 年。\n\n你可以在 `https://help.salesforce.com/s/articleView?id=sf.tracking_field_history.htm&type=.`\
  \ 了解更多关于字段历史跟踪的信息。\n\n现在我们已经了解了如何实现合规的数据模型（包括 Salesforce 平台上可用的各种工具和技术），接下来让我们把注意力转向企业数据治理。\n\
  \n#### 企业数据治理\n\n作为数据架构师，我们必须审视设计企业数据治理策略并将其在组织中实施时的各种方法和考虑因素。\n\n为了更好地理解这一点，下图显示了企业数据治理策略的组成部分：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_96_0.png)\n\n图 5.1 – 企业数据治理策略的组成部分\n\n\
  企业数据治理策略包含几个关键要素，包括以下几点：\n\n- **数据政策和标准：**\n  - 数据必须遵守哪些外部政策、规定或标准？例如，企业是否是金融服务机构，因而在数据治理方面需要考虑监管机构的要求？\n\
  \  - 数据必须遵守哪些内部政策？例如，是否有与 PII（个人身份信息）相关的内部政策？\n- **数据的所有权和问责制：**\n  - 谁拥有数据？\n \
  \ - 谁对数据负责？\n- **数据规则：**\n  - 围绕数据已经制定了哪些规则？\n  - 需要制定哪些规则？\n  - 谁来监督这些规则？\n- **数据定义：**\n\
  \  - 数据字典在哪里定义、存储和管理？\n- **数据监控：**\n  - 对数据进行了哪些监控？\n  - 需要监控哪些系统？\n  - 监控的目的是什么？\n\
  - **数据使用度量：**\n  - 数据使用情况是根据哪些度量或**关键绩效指标（KPIs）**来衡量的？\n\n在介绍了这些企业数据策略组成部分之后，应该明确的是，所提出的这些问题本身就凸显了制定健全的数据治理策略的重要性。鉴于数据对组织的价值（以及确保其受到如此对待的法律法规），从收集、定义、使用、监控到度量，对数据进行治理对于保护这一或许是组织最宝贵的资产至关重要。\n\
  \n现在，让我们来看看数据治理中涉及的一些角色和职责。\n\n#### 角色与职责\n\n企业数据治理框架可能包含不同的角色和职责，这就是为什么每个组织会有不同的需求。每家公司都需要根据其具体需求实施合适的数据治理模型。\n\
  \n让我们以可视化方式呈现数据治理框架中的角色：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_98_0.png)\n\
  \n图 5.2 – 企业数据治理角色框架\n\n在各种数据治理框架中，以下角色通常具有共性：\n\n- 指导委员会\n- 数据所有者\n- 数据管家\n\n让我们更详细地了解每个角色。\n\
  \n#### 指导委员会\n\n**指导委员会**是由高级管理层、负责特定业务职能（如销售或服务）的人员以及 C 级高管（几乎肯定包括**首席信息官（CIO）**，有时还有**首席信息安全官（CISO）**）组成的一个议事机构。\n\
  \n该委员会承担多项职责，包括制定数据治理策略、与数据管家合作，以及确保数据治理职能能够被问责（其中可能包括各种具有特定交付物、成果和截止日期的工作计划或项目）。\n\
  \n#### 数据所有者\n\n**数据所有者**是指负责确保某个数据域中的信息在组织 IT 企业系统和业务职能（如销售）中得到治理的个人或团队。数据所有者可能是指导委员会的成员（如果数据所有者同时也是\
  \ C 级高管或负责某个业务职能，如服务部门）。数据所有者通常负责以下事项：\n\n- 批准数据定义（关于数据的描述或元数据）。\n- 确保整个企业信息的准确性。\n\
  - 数据的质量。\n- 参与、审查、完善并批准主数据管理的业务方法。这可能包括审查或定义影响主数据管理方法及其实施的计划及其他附加工作项或工件。\n- 与其他数据所有者协作，处理整个企业范围内的数据问题并加以解决。\n\
  - 与指导委员会合作，特别是在解决方案上提供意见（数据所有者可提供 SME 知识）。此外，他们必须对软件的选择和使用提供意见，并定义和审查其数据域的政策或其他监管要求（例如，英国金融服务组织的一个例子是**金融行为监管局（FCA）**，该局对数据处理有严格要求）。\n\
  \n#### 数据管家\n\n**数据管家**负责企业中数据的日常管理。他们是**主题专家（SME）**，能够理解并传达其业务领域中数据的含义、定义和用途（以及其业务线中的其他相关信息）。数据管家与整个业务范围内的其他数据管家合作，围绕业务数据的治理做出决策。\n\
  \n简而言之，数据管家负责以下事项：\n\n- 成为其特定数据领域的 SME（主题专家）\n- 识别、处理并解决其自身及其他数据管家数据中的问题\n- 向特定数据域内的数据所有者和其他相关利益相关者汇报\n\
  - 在整个业务范围内开展工作，确保其数据得到其他数据管家和数据所有者的管理和理解\n\n\n\n\n正如你现在所知，在企业数据治理框架下存在不同的角色，每个角色都有明确的职责。沟通是确保这些角色协同工作的关键驱动因素。这就是为什么指导委员会如此重要，它能够对数据所有者和数据管理员进行问责。\n\
  \n让我们总结一下本章我们所学的内容。\n\n#### 摘要\n\n数据治理占 Salesforce 认证数据架构师考试测试标准的 10%。\n\n首先，我们研究了合规性，以及在\
  \ Salesforce 中实施数据模型时必须如何考虑合规性（以 GDPR 为例）。一些公司和行业需要在保护个人数据时根据特定法规或法律法案证明其合规性。例如，英国银行需要遵守\
  \ GDPR 以保护客户数据。如果其 Salesforce 解决方案未考虑 GDPR 而实施，他们可能会面临罚款并被迫采取补救措施。随后，我们介绍了如何遵守某些数据标准或法规的实用技巧，例如使用经典加密或\
  \ Shield Encryption。\n\n之后，我们将注意力转向企业数据治理，深入探讨组织在保护、处理和管理数据时所涉及的各种角色和职责。\n\n将本章内容与第\
  \ 4 章《Salesforce 数据管理》中所涵盖的理论相结合，你现在可以理解，有效管理和治理数据对于在 Salesforce 平台上构建可扩展且合规的数据解决方案至关重要，以及\
  \ Salesforce 提供了大量功能来促进这一目标。\n\n在第 6 章《理解大型数据量》中，我们将研究如何在 Salesforce 平台上保护和治理数据，包括探讨合规解决方案背后的概念。\n\
  \n#### 练习题\n\n通过回答以下问题来测试你对本章所涵盖主题的掌握程度：\n\n- 1. 负责制定整体数据治理策略的职能名称是什么？\n- 2. 在企业数据治理模型中，哪种角色负责识别数据问题并与志同道合的人合作解决这些问题？\n\
  - 3. 哪种 Salesforce 加密技术允许对标准对象字段进行加密？\n- 4. 哪种 Salesforce 加密技术允许对自定义对象字段使用星号进行掩码？\n\
  - 5. 默认情况下，对给定对象的多少个字段可以使用字段历史跟踪进行跟踪？\n- 6. 使用 Salesforce Shield 字段历史跟踪时，对给定对象的多少个字段可以进行跟踪？\n\
  - 7. 哪种 Salesforce 对象旨在捕获联系人的数据隐私偏好？\n- 8. 欧盟数据隐私法规的缩写是什么？\n- 9. Individual 对象如何在\
  \ Salesforce 中启用？\n- 10. 哪个企业数据治理角色负责批准数据定义？\n- 11. Individual 对象如何向用户公开？\n- 12.\
  \ 哪种 Salesforce 安全措施控制用户对对象的默认访问权限？\n- 13. 事件监控分析应用是什么？\n- 14. 在极短的时间内从相距甚远的两个地点发生的两次登录事件被称为什么？\n\
  - 15. 哪个企业数据治理角色负责数据质量？\n\n#### 答案\n\n以下是前面问题的答案。你能正确回答其中多少个？在此核对你对前面问题的答案：\n\n\
  - 1. 指导委员会\n- 2. 数据管理员\n- 3. Shield Encryption\n- 4. Classic encryption\n- 5. 20\n\
  - 6. 60\n- 7. Individual 对象\n- 8. GDPR\n- 9. 通过在 Salesforce 设置中启用数据保护和隐私\n- 10.\
  \ 数据所有者\n- 11. 通过将其添加到线索、联系人和人员账户页面布局中\n- 12. OWDs\n- 13. 一个从 LoginEvent 和 EventLogFile\
  \ 对象读取数据的 Tableau CRM 应用\n- 14. 不可能的旅程\n- 15. 数据所有者\n\n#### 延伸阅读\n\n请参阅以下资源以获取有关本章所涵盖内容的更多信息：\n\
  \n- *Individual Object:* https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_objects_individual.htm\n\
  - *Salesforce Shield Encryption versus Salesforce Classic Encryption:* https://developer.salesforce.com/docs/atlas.en-us.securityImplGuide.meta/securityImplGuide/security_pe_vs_classic_encryption.htm\n\
  - *Enabling Salesforce Shield Event Monitoring:* https://help.salesforce.com/s/articleView?id=000339868&type=1\n\
  - *Session Security:* https://help.salesforce.com/s/articleView?id=sf.admin_sessions.htm&type=5\n\
  - *Field History Tracking:* https://help.salesforce.com/s/articleView?id=sf.tracking_field_history.htm&type=5\n\
  \n#### 理解大型数据量\n\n虽然 Salesforce 平台可以处理大量数据，但对于较大/海量数据（称为 **大型数据量 (LDV)**）以及平台性能受影响的情况，需要考虑一些因素。本章涵盖\
  \ LDV 注意事项和缓解措施，以及可扩展数据模型设计和数据归档策略。\n\n在本章中，我们将涵盖以下主题：\n\n- 设计可扩展的数据模型\n- LDV 性能缓解策略\n\
  - 数据归档策略\n\n与使用数据库的传统应用程序不同，Salesforce 将所有数据存储在少数几个大型数据库表中。因此，与数据库相关的传统性能调优技术并不一定适用于\
  \ Salesforce 平台。相反，作为数据架构师，我们必须设计 Salesforce 实施方案以处理大量数据。这最好通过了解 LDV、它们对 Salesforce\
  \ 性能的影响以及如何缓解 LDV 造成的影响来实现。本章中，我们将深入探讨可能影响性能的一些因素并讨论其缓解技术。\n\n#### 设计可扩展的数据模型\n\n\
  随着 Salesforce 实施规模和复杂性的增长，数据的量也在增加。Salesforce 作为多租户架构，会自动处理扩展，但随着数据量的增长，某些操作的处理时间也会增加。\n\
  \n通常，不同的数据架构或配置会影响 Salesforce 平台上的两个方面：\n\n- 加载或更新大量记录。这可以通过 UI（直接）或一个或多个集成来完成。\n\
  - 提取数据，无论是通过报表还是其他数据视图，或查询数据。\n\n优化数据模型通常涉及以下操作：\n\n- 仅托管基于业务目的和意图真正需要在 Salesforce\
  \ 平台上驻留的数据\n- 在执行某些数据操作时，推迟或临时禁用共享更改处理和其他业务规则逻辑\n- 为与数据相关的给定任务或作业选择最佳（最有效）的操作\n\n\
  在我们深入探讨如何根据 LDV 进行识别和缓解之前，值得重新回顾一下 Salesforce 如何组织和查询数据背后的一些理论。\n\n在第 2 章《数据建模和数据库设计》中，我们研究了\
  \ Salesforce 并非为我们 Salesforce 实例中的每个对象提供物理数据库表，而是基于少数几个（非常）大的物理数据库表对标准和自定义对象字段的存储进行虚拟化。\n\
  \n为了避免在多租户平台上为每个客户的 Salesforce 实例管理不断变化的数据结构，Salesforce 使用这种虚拟化技术。与数据库相关的传统性能调优技术并不一定适用于\
  \ Salesforce 平台，因为你 Salesforce 实例的底层数据结构与向用户和管理员展示的感知数据结构不同。Account 和 Contact 被视为两个不同的数据实体，在传统的\
  \ Relational Database Management System（RDBMS）中它们将是单独的表。然而，在 Salesforce 中，它们是从与同一节点上的其他\
  \ Salesforce 组织共享的大表虚拟化而来的，例如 EU6。如果你尝试基于 Salesforce 组织的虚拟化数据和架构应用 RDBMS 性能调优技术，你不会在实例的实际底层数据结构（或就此而言\
  \ Salesforce 节点）上看到预期的效果。完整的 Salesforce 节点列表可在 https://trust.salesforce.com 找到。\n\
  \n现在，让我们来看一下搜索数据、理解索引以及它们如何影响搜索性能。\n\n#### 搜索 Salesforce 数据\n\n简而言之，搜索是通过自由格式文本查询两条记录的行为（即向搜索引擎输入一个字符串并返回结果）。Salesforce\
  \ 搜索架构与对象和记录数据的存储位置不同。它在 Salesforce 应用架构中使用自己的数据存储，专门为搜索自由格式文本而设计。这基本上就是 Salesforce\
  \ 平台上如何实现自由格式文本搜索操作。\n\n\n\n\n作为 Salesforce 数据架构师，您可能已经熟悉向实例用户展示搜索功能的各种方式。Salesforce\
  \ 在应用程序的多个位置提供搜索功能，包括以下位置：\n\n- 全局搜索\n- 高级搜索\n- 查找字段\n- 重复处理（基于匹配规则）\n- 知识库\n- 建议解决方案\n\
  - Web2Lead\n- Web2Case\n- Salesforce 对象搜索语言 (SOSL)，与 Apex 一起使用，并通过应用程序编程接口 (API)\
  \ 使用\n\n让我们来看看索引数据，以及 Salesforce 在执行搜索时如何使用这些索引。\n\n#### 索引数据\n\n要在 Salesforce 中搜索数据，必须先对数据进行索引。Salesforce\
  \ 有一组独立的搜索索引服务器用于**索引**操作，当发生新建或修改数据事件时，这些服务器会生成并处理索引操作的队列条目。因此，搜索索引是一个异步操作。Salesforce\
  \ 建议（根据 https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_concepts_search_architecture.htm）被索引的文本可能需要\
  \ 15 分钟（甚至更长时间，具体取决于已创建或修改的数据量）才能变为可搜索。\n\n#### Salesforce 如何执行索引搜索\n\n当用户通过 UI、API\
  \ 或需要通过 Apex 代码调用搜索的操作执行搜索时，Salesforce 将搜索为相应记录创建的索引。Salesforce 会利用这些结果，然后应用访问权限、搜索限制以及任何其他筛选条件或筛选逻辑，将结果缩小为*结果集*。结果集通常包含对调用搜索的用户或操作最相关的结果。当*结果集*达到预定义大小（由\
  \ Salesforce 查询优化器在内部指定）时，搜索结果中的其余记录将被丢弃。然后使用*结果集*来调用实际数据库查询，以返回用户将看到的记录，或者操作将返回到调用进程（如果是由\
  \ Salesforce API 或通过 Apex 代码调用的记录搜索）。\n\n既然我们已经了解了 Salesforce 如何查询数据，接下来让我们看看与记录相关的操作如何受到单个父记录的过多子记录（也称为数据倾斜）的影响。\n\
  \n#### 数据倾斜及其对性能的影响\n\n在考虑和设计 Salesforce 中的记录所有权策略时，请始终将 10,000 这个数字牢记在心。当 Salesforce\
  \ 中同一父记录拥有超过 10,000 个子记录时，就会出现称为数据倾斜的问题。\n\n数据倾斜有三种不那么令人愉快的类型：\n\n- 账户数据倾斜\n- 所有权倾斜\n\
  - 查找倾斜\n\n我们稍后将更详细地探讨每种数据倾斜类型，但请记住，如果您设计的数据策略有助于分散记录所有权，使任何一条记录都不会成为超过 10,000 个子记录的父记录，那么您就不必担心数据倾斜会影响\
  \ Salesforce 实例的用户。\n\n##### 账户数据倾斜\n\n某些 Salesforce 标准对象（包括 Account 和 Opportunity\
  \ 对象）具有特殊的数据关系，在私有共享模型下维护父记录和子记录的访问权限。账户数据倾斜是指一个账户拥有过多子记录。因此，在考虑账户记录所有权策略时，请考虑适当分散记录。不要创建一个通用的未分配或桶式父账户记录，并认为这样就足够了，因为当神奇的\
  \ 10,000 个子记录数量达到时，您的用户会不高兴。账户数据倾斜出现时，会发生两个主要问题，即记录锁定问题和共享问题。\n\n想象一下更新属于同一账户的大量子记录（例如联系人或机会）。由于\
  \ Salesforce 维护数据库的完整性，当对子记录进行更新时，它会同时锁定正在更新的记录和父账户。当更新大量属于同一账户的子记录时，这些锁可能导致错误，例如一条记录更新锁定了父账户。这意味着其他子记录的更新可能无法进行，您的用户将看到错误提示。这可不妙。\n\
  \n现在，让我们将注意力转向在更改父账户或子记录的共享时可能出现的共享问题。由于 Salesforce 会重新计算对父账户或子记录的访问权限，这种共享重新计算将花费时间。您猜怎么着？这些记录在共享重新计算期间也会被全部锁定。当我们考虑到涉及角色层次结构和共享规则的重新计算时，这些锁的持续时间可能会超过预期，并导致向用户返回错误。\n\
  \n##### 所有权倾斜\n\n当同一对象类型（例如 Contact）的大量记录（想想我们的神奇数字 10,000）由单个用户拥有时，会导致称为所有权倾斜的性能问题。Salesforce\
  \ 中的每条记录都必须有一个所有者（由于基于所有权的数据模型），因此在需要共享计算来管理由同一用户拥有的所有这些记录的可见性时，这可能会导致性能问题。同样，这也是尽可能避免使用通用的单一未分配或桶式父记录的另一个原因。\n\
  \n当导致所有权倾斜的用户存在于角色层次结构中时，记录删除或记录所有权更改等操作需要 Salesforce 平台从（导致倾斜的）所有者以及角色层次结构中指定的所有者的所有父用户，最后从通过共享规则获得访问权限的所有用户那里移除记录的共享。记录所有权更改本就被视为一项代价高昂的操作，因为它们会锁定记录并在重新计算共享时花费大量时间。所有权倾斜加剧了这一过程。\n\
  \n在无法避免所有权倾斜的情况下，Salesforce 建议不要为该用户分配角色。这样，角色层次结构实际上就会从任何共享或权限计算中移除，从而在执行这些操作时对性能的影响较小。\n\
  \n##### 查找倾斜\n\nSalesforce 中的查找字段类型应被视为对象之间的外键关系。每次用户插入或更新记录时，Salesforce 平台都会锁定该记录上每个查找字段所引用的记录（例如，正在创建或更新的\
  \ Contact 记录的父账户）。通过锁定引用的记录，Salesforce 确保当记录的插入或更新数据提交到数据库时，这些记录之间的引用完整性得以保持。因此，10,000\
  \ 条或更多记录查找同一条记录可能会因 Salesforce 为维护数据库完整性而锁定记录导致的争用而降低速度或引发错误。\n\n由于查找倾斜更难发现，因此更容易从一开始就计划适当分散记录，避免超过\
  \ 10,000 个子记录查找同一个父记录，从而避免查找倾斜。\n\n既然已经讨论了数据倾斜及其对性能的影响，接下来让我们将注意力转向数据虚拟化。\n\n####\
  \ 数据虚拟化\n\n数据架构师应该问自己的一个关键问题是，我是否需要在 Salesforce 中存储这些数据？\n\n虽然 Salesforce 提供了可扩展的架构，让用户能够访问执行其业务活动所需的数据，但对于不断变化或大量数据的访问，可以通过允许\
  \ Salesforce 在用户需要时向其展示外部系统保存的数据来满足。想想银行账户交易、ERP 中的行项目或客户购买交易。这种技术称为数据虚拟化。\n\n\n\
  \n\n\n#### 自定义索引\n\n为了加快查询性能，Salesforce 支持创建 **自定义索引**。可以将索引理解为一种按构成索引的参数排序记录的方式。通过使用排序后的索引，可以提高记录检索速度。自定义索引的启用需要联系\
  \ **Salesforce Support**。在考虑这样做之前，值得先了解一下 Salesforce 平台对大多数对象自动索引的字段：\n\n- `RecordTypeId`\n\
  - `Division`\n- `CreatedDate`\n- `SystemModstamp (LastModifiedDate)`\n- `Name`\n\
  - `Email (for Contact and Lead records)`\n- `Foreign key relationships (Lookup and\
  \ Master-Detail)`\n- `The (unique) Salesforce record ID, which is the primary key\
  \ for each object`\n\n> **重要说明**\n> 自定义索引可以创建在几乎所有类型的字段上，除了多选列表、文本区域（长文本或富文本）、非确定性公式字段和加密文本字段。外部\
  \ ID 字段类型默认会在该字段上创建索引，但仅支持自动编号、电子邮件、数字和文本类型用于创建外部 ID 字段类型。\n\nSalesforce 的底层数据库架构使得自定义字段的实际数据表不适合传统的数据库索引（因为我们本质上是在谈论一个包含\
  \ Salesforce 实例中对象所有字段的大型单一物理表）。为克服此索引限制，Salesforce 会为每个运行 Salesforce 应用的基础设施节点创建一个单独的索引表，该表本质上包含该节点中的对象字段数据的副本，以及有关对象字段数据类型的信息。然后\
  \ Salesforce 可以（通过其应用层）在此单独的索引表上构建和维护传统的数据库索引。索引表对索引搜索能够有效返回的记录数设置了上限，因为只有在将查询结果返回给发出查询的进程或用户之前被视为返回的那些索引记录，才会被考虑，然后才默认为更宽泛（因此性能更差）的非索引搜索。\n\
  \n默认情况下，索引表不包含空记录（有时称为 null 记录，尽管 Salesforce 支持可以根据需要启用包含 null 记录的自定义索引）。如果在自定义字段上创建了自定义索引，则必须显式启用并重建索引，才能将空值行包含在索引中。\n\
  \n还值得知道的是，Salesforce 查询优化器（Salesforce 应用层的一项功能）维护着一个单独的数据库表，其中包含每个索引中对象和字段数据分布的统计信息。Salesforce\
  \ 的查询优化器使用此表在自动化进程、用户或报表发出查询时执行预查询，以确定使用索引是否可以加快查询速度（从而提高性能）。\n\n#### 标准索引字段\n\n\
  当 SOQL 查询过滤器匹配数据库中返回的第一百万条记录中少于 30% 且数据库中额外记录中少于 15%，总计不超过 100 万条记录时，Salesforce\
  \ 的标准索引字段会被使用。\n\n例如，标准索引在以下情况下使用：\n\n- 当针对包含 200 万条记录的对象表发出 SOQL 查询时，且过滤器匹配大约 450,000\
  \ 条或更少的记录（因为 100 万的 30% 大约为 300,000，而剩余 100 万的 15% 大约为 150,000）\n- 当针对包含 500 万条记录的对象表发出\
  \ SOQL 查询时，且过滤器匹配大约 900,000 条或更少的记录（因为 100 万的 30% 大约为 300,000，而剩余 400 万的 15% 大约为\
  \ 600,000）\n\n在了解了标准索引字段后，让我们来看一下自定义索引字段及其使用时机。\n\n#### 自定义索引字段\n\n与标准索引不同，自定义索引在\
  \ SOQL 查询过滤器匹配总记录数中少于 10%，最高不超过 333,333 条记录时使用。\n\n例如，自定义索引在以下情况下使用：\n\n- 当针对包含\
  \ 500,000 条记录的对象表执行 SOQL 查询时，且过滤器匹配 50,000 条或更少的记录（因为 500,000 的 10% 为 50,000）\n\
  - 当针对包含 500 万条记录的对象表执行 SOQL 查询时，且过滤器匹配 333,333 条或更少的记录（因为 500 万的 10% 为 500,000，但上限为\
  \ 333,333 条记录，因此使用 333,333 的值）\n\n有关索引的一些复杂细节的更多信息，请参阅 https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_infrastructure_indexes.htm。\n\
  \n现在你已经了解了索引，让我们关注一个有助于我们避免表连接以优化基于读取的操作的解决方案。\n\n#### 精简表\n\n为了加快对单个对象的某些只读操作的性能，可以创建\
  \ **精简表** 以避免跨标准字段和自定义字段的连接。当精简表启用时，它们会在适当时自动使用。你不能直接创建、访问或修改精简表，因为这是由 Salesforce\
  \ Support 完成的。从本质上讲，你可以与它们协作来定义精简表应包含的内容，以优化对特定字段的只读查询，例如针对账户。如果你优化的报表、列表视图或查询（因此为其创建了精简表）发生变化（例如添加新字段以响应业务用户在报表中需要额外值），你将需要联系\
  \ Salesforce 来更新你的精简表定义。\n\n还值得注意的是，精简表不包含软删除的记录，因此当查询使用精简表覆盖标准底层表中的更广泛对象数据时，它们将不可用。\n\
  \n仅引用精简表中定义的字段的只读操作不需要跨标准和自定义对象字段表进行额外连接，因此可以获得更好的性能。根据 Salesforce 的说法（在 https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_infrastructure_skinny_tables.htm），精简表的使用最适合包含数百万条数据记录的\
  \ Salesforce 对象，以提高对这些记录的只读操作的性能，例如执行报表和仪表板或列表视图。\n\n精简表可以创建在所有自定义对象以及以下标准对象上：\n\
  \n- Account\n- Contact\n- Opportunity\n- Lead\n- Case\n\n精简表还有一些其他注意事项。例如，精简表最多可包含\
  \ 100 列，并且不能包含来自其他对象的字段。可以将它们视为针对单个对象的只读操作的优化表。\n\n让我们看一个精简表的视觉示例：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_112_0.png)\n\
  \n图 6.1 – 精简表示例\n\n它们是为了在向单个对象发出只读查询以读取数据时消除跨标准字段和自定义字段的连接而创建的。\n\n##### 选择性过滤条件\n\
  \n**选择性过滤条件** 可用于你的 **Salesforce 对象查询语言 (SOQL)** 查询中以提高性能。在 Salesforce 应用逻辑内部，Salesforce\
  \ 平台的查询优化器功能会做出此决定，并在查询运行时确定已发出 SOQL 查询（包括报表和列表视图所需的查询）的过滤条件选择性。\n\n在处理相对简单的 SOQL\
  \ 查询时，你可以通过使用多种工具收集其统计信息来轻松确定特定过滤条件是否具有选择性，但谦逊的 **Developer Console Query Editor**\
  \ 就足够了。在对选择性字段应用索引后，相关过滤条件的查询将更高效地执行。\n\n通过确认报表、SOQL 和列表视图中的过滤条件具有选择性，然后对这些字段应用索引，Lightning\
  \ Platform 查询优化器在查找目标数据时就不必执行全数据集扫描。这意味着在这种使用场景中性能将达到最佳。\n\n#### 分区\n\n**分区** 可用于划分数据并减少\
  \ SOQL 查询返回的记录数，从而提高调用查询的用户或进程的性能。Salesforce 为按分区划分数据提供了特殊支持（可以将其视为数据的逻辑部分），但这需要通过联系\
  \ Salesforce 客户支持专门启用。\n\n\n\n\n\n现在我们已经了解了 LDV 缓解方法，让我们来看一下归档数据的各种方法。正如本章前面所介绍的，最理想的情况是平台上只有正确且相关的用户数据。话虽如此，让我们来探索数据归档的策略。\n\
  \n#### 数据归档策略\n\n正如我们在 Salesforce 上为用户存储数据一样，也存在需要将数据归档到平台之外的情况。这可能是由于各种原因，例如监管合规性（某些数据需要保留），或保持平台上的最优数据量（例如仅保留正在使用的数据，并自动归档超过特定年龄的数据）。幸运的是，归档\
  \ Salesforce 数据有各种选项，例如使用平台内解决方案如大对象，或将数据存储在外部系统或数据仓库中。我们将在以下小节中查看这些选项。\n\n####\
  \ 大对象\n\n正如第 2 章《数据建模和数据库设计》中所述，**大对象**用于存储和管理海量数据（默认最多 100 万条记录，尽管这可以通过额外费用扩展到数千万甚至数十亿条记录）。\n\
  \n大对象无论加载多少记录都能提供一致的性能，这对于审计和归档用例非常有用，而大对象正是为此而设计的。任何需要在处理数亿或数十亿条记录时保持一致性能的需求，都是大对象所设计的使用场景。\n\
  \n大对象使用与主 Salesforce 平台不同的分布式数据库，并且是非事务性的。需要提醒的是，除了对象和字段权限外，大对象不支持共享。此外，这意味着自动化（例如工作流、流程和触发器）在大对象上不受支持。\n\
  \n#### 数据加载器\n\n谦逊的 Salesforce 数据加载器可用于导入和导出数据。这将在下一章第 7 章《数据迁移》中详细介绍，但现在我们知道 Salesforce\
  \ 数据加载器支持使用两种不同模式将数据导入和导出 Salesforce，**串行**和**批量**，它们支持不同的批处理大小和并发选项。虽然数据加载器通常是手动调用的工具，但它可以用作归档数据的简单解决方案，通过将\
  \ Salesforce 数据导出为一个或多个 CSV 文件，然后可以存储或在平台外摄取，例如在本地服务器、共享驱动器或数据仓库工具上。\n\n#### ETL\n\
  \n**提取、转换、加载（ETL）**工具可用于通过 Salesforce REST、Partner 和/或 Bulk API 自动归档数据。作为定期夜间作业的一部分，可以运行来自\
  \ **MuleSoft** 等中间件解决方案的自动化流程或计划作业，其中会发出查询以检索自上次作业成功运行以来符合归档条件的数据。然后可以将此数据保存到离线数据存储中或插入到**企业数据仓库（EDW）**中。\n\
  \n#### 总结\n\n在本章中，我们深入探讨了数据架构及其潜在陷阱和缓解策略。了解数据倾斜发生的原因有助于我们设计更好的父/子记录所有权策略。此外，了解 Salesforce\
  \ 如何使用索引可确保我们能够创建报告、列表视图并构建查询，这些查询与多租户架构平台的约束一起工作，而不是与其对抗。因此，我们研究了 LDV 问题和缓解策略，了解诸如选择性过滤条件和精简表等概念如何用于确保我们能够有效地处理大量数据。\n\
  \n接下来，我们将注意力转向数据归档策略以及我们可用的各种选项，确保我们遵守数据保留和归档的监管要求（如果适用），并确保我们仅使用与用户相关的数据。\n\n在\
  \ *第 7 章，数据迁移* 中，我们将基于对 Salesforce 平台上数据如何被索引和组织的知识进行构建，以便我们开始构建将数据导入和导出平台的有效策略。\n\
  \n#### 练习题\n\n通过回答以下问题来测试您对本章所涵盖主题的了解：\n\n- 1. LDV 代表什么？\n- 2. 用于存储 100 万条或更多记录的\
  \ Salesforce 对象类型是什么？\n- 3. 包含超过 10,000 条子记录的一个账户被称为什么？\n- 4. 超过 10,000 条记录查找单个父记录被称为什么？\n\
  - 5. 利用托管在外部系统上的数据是一种被称为什么的技术？\n- 6. 可以用来分区数据并减少 SOQL 查询和报告返回的记录数的是什么？\n- 7. 可以用来避免查询中对单个对象内数据的连接并加快只读操作的是什么？\n\
  - 8. 属于同一父记录的超过 10,000 条子记录被称为什么？\n- 9. 指定以下场景中使用的索引类型：\n  - 当对包含 400,000 条记录的对象数据执行\
  \ SOQL 查询时，且过滤器匹配 40,000 条或更少的记录\n  - 当对包含 1500 万条记录的对象数据执行 SOQL 查询时，且过滤器匹配 333,333\
  \ 条或更少的记录\n- 10. 是否可以在多选列表上创建自定义索引？\n\n#### 答案\n\n以下是前面问题的答案。您能正确回答多少个？在此检查您对前面问题的答案：\n\
  \n- 1. Large Data Volume\n- 2. Big object\n- 3. Account skew\n- 4. Lookup skew\n\
  - 5. Data virtualization\n- 6. Divisions\n- 7. Skinny tables\n- 8. Ownership skew\n\
  - 9. Custom index\n- 10. False\n\n#### 进一步阅读\n\n有关本章所涵盖内容的更多信息，请参阅以下资源：\n\n- *Salesforce\
  \ Trust:* https://trust.salesforce.com\n- *Search Architecture:* https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_concepts_search_architecture.htm\n\
  - *Indexes:* https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_infrastructure_indexes.htm\n\
  - *Skinny tables*: https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_infrastructure_skinny_tables.htm\n\
  \n#### 数据迁移\n\n数据迁移本质上是从一个或多个系统获取数据，对其执行操作（例如清洗、转换和丰富），然后随后将该数据加载到一个或多个系统中。\n\n\
  通常，在实施 Salesforce 时，数据迁移被视为一个独立的工作流，需要回答的问题。如何将高质量数据导入 Salesforce 平台？如何确保加载大量数据是顺畅、可靠、可重复且及时的？如何有效地从\
  \ Salesforce 平台导出数据？导入或导出数据到或从 Salesforce 平台时应遵循的正确步骤是什么？从哪里开始？\n\n在本章中，我们将学习可用于将数据导入\
  \ Salesforce 平台的方法，包括调优和优化技术。然后，我们将探讨在进行任何大规模数据在 Salesforce 平台内外的移动时需要考虑和理解的概念和流程。我们还将学习如何有效地从\
  \ Salesforce 平台导出数据。\n\n数据迁移由于多种原因而需要，例如当实施了新系统（例如 Salesforce）作为单一客户视图，或公司收购了另一家公司并将数据合并到另一个系统中时。另一个例子是当数据定期购买或获取时，并且该数据需要迁移到公司\
  \ CRM。因此，数据迁移是一个重要且持续进行的流程。\n\n一些人认为数据迁移是庞大、令人恐惧的，最好交给别人，但一旦理解了概念，将数据迁移到或从 Salesforce\
  \ 平台就不必畏惧。数据迁移占考试大纲的 15%。通过理解本章的材料，您将能够理解围绕数据移动和 Salesforce 平台的流程、概念和复杂性。\n\n\n\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 理解数据迁移及其注意事项\n- 加载高质量数据\n- 将大量数据迁移到 Salesforce\n- 从 Salesforce\
  \ 导出数据\n\n#### 理解数据迁移及其注意事项\n\n在本节中，我们将介绍数据迁移涉及的各个阶段，以及为什么在数据迁移的定义阶段投入时间很重要。当考虑将数据从一个系统移动到另一个系统时，重要的是要问自己以下问题：\n\
  \n- 迁移这些数据是否合适？\n- 迁移数据能带来什么好处？\n- 数据的质量是否足够高？\n- 长期来看，这些数据将如何维护？\n- 应该制定哪些治理或其他流程？\n\
  \n通过解决这些问题，我们实际上已经开始了数据迁移过程。虽然 IT 企业中的某个系统可能存储了部分数据，但如果仅仅因为目标系统是 IT 企业中的亮眼新组件而将数据迁移过去，这并不一定是合理的。例如，我曾与一位客户合作，他们投资了\
  \ Salesforce 以提供更好的营销和客户服务，并且在实施过程中，他们立刻认为维修管理系统中的所有数据都需要迁移到 Salesforce。这家客户生产用于测量水果和蔬菜等新鲜农产品重量的物理设备。当这些设备出现问题时，他们的检查和维修流程会使用一个仅支持人员和维修工程师才能访问的基于云的系统。当\
  \ Salesforce 被引入作为 IT 企业中客户数据的新记录系统时，他们花时间评估了 Salesforce 需要与之交互的系统，以确定哪些数据需要呈现给营销、销售和支持代理，以便与所谓的“互联客户”互动。本质上，我们谈论的是\
  \ Salesforce 将从多个数据源整合数据（听起来熟悉吗？我们在第 4 章“Salesforce 数据管理”中涵盖了这一场景背后的概念。）\n\n在与客户交流时，他们希望重新定义服务流程，因此我们决定，将\
  \ Salesforce 作为新的客户主数据管理系统，实施基于案例的工作流。对于现有的维修数据，我们决定不从一个最终将在几年内退役并进入只读状态的系统中导入数据。为满足这一需求，我们决定使用外部对象来呈现维修数据，但将其保留在现有系统中。然而，我们实际决定做的是引入与服务权利和支持合同相关的信息，这些信息将来由\
  \ Salesforce 驱动。本质上，客户希望通过仅迁移必要数据来通过 Salesforce 提供更好的服务。通过允许现有记录在 Salesforce 中呈现，只有所需的数据被迁移过来。\n\
  \n在数据迁移过程开始时进行的提问环节引导我们得出了我在此解释的关于即将迁移哪些数据的设计。\n\n质疑数据迁移过程的下一步是了解数据质量是否足够高。在与客户交谈时，有些客户相当坦率地承认他们的主要系统中有大量重复或不完整的字段。其他客户可能无法如实回答其数据质量到底如何。幸运的是，我们可以与客户合作定义指标，这些指标将明确数据质量对他们的意义。例如，哪些字段被认为是必要的？在分析数据时，我们可以快速确定哪些字段，在总记录数中所占百分比，完全没有值，或者只有非常低的填充率。我们应该质疑这些字段是否是构建质量数据集图景所必需的。我们还应该查看数据的完整性、重复计数等。我们将在下一节中更详细地讨论这一点。对于我的客户来说，数据在迁移前并不算太差。字段完整性不错，但大约\
  \ 5% 的迁移记录是重复的。因此，客户需要做出决定——在迁移数据之前还是之后修复重复项。他们决定在迁移完成后修复它们。\n\n在我们完成迁移数据的考虑之前，我们需要考虑长期的数据维护。在迁移期间或之后是否需要制定任何控制措施或程序？在访问和修改数据权限方面，源系统会发生什么？是否需要定期处理或丰富数据的流程？这是手动还是自动化的操作？哪些指标使该过程成功？这略微涉及数据迁移的治理方面，因为通常围绕数据维护的流程将构成更广泛的治理结构的一部分。对于我的客户，他们决定将\
  \ Salesforce 的匹配和去重功能作为避免重复的账户和联系人记录被录入系统的主要方式。他们将使用 Salesforce 的报告功能监控该过程，并决定如果未来出现数据质量问题，将采购合适的工具。\n\
  \n现在，让我们学习如何定义数据迁移流程。在下一节中，我们将介绍在其余数据迁移过程中将采取的步骤。\n\n#### 定义数据迁移流程\n\n在完成了关于数据迁移*是什么*和*为什么*的追问之后，就可以考虑采用更正式的流程。以下步骤序列是从一个或多个系统迁移到另一个系统的典型过程，某些步骤可以根据特定要求省略或调整位置——例如，在迁移之前或之后进行数据去重。\n\
  \n在多个 Salesforce 实施项目中，我在数据迁移工作流中使用了以下步骤序列：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_120_0.png)\n\
  \n图 7.1 – 数据迁移流程\n\n接下来，让我们探讨每个阶段以了解通常涉及的内容。\n\n##### 定义\n\n我们首先定义目标数据模型和客户关系管理（CRM）数据层级。这很可能是通过捕获和验证关于如何最好地支持目标业务流程的需求来完成的。定义了目标数据模型后，我们可以将注意力转向确定\
  \ IT 企业中主数据所在的位置。正如本章前面提到的，分析数据对于确定从中迁移数据的源系统中数据的质量和完整性非常有用。\n\n接下来，有必要了解源系统的现状数据模型，以便在处理过程的提取阶段能够理解数据结构。想象一下从另一个\
  \ CRM 系统（如 Dynamics 365）迁移。虽然 Dynamics 365 具有账户、联系人和商机的概念，但它构建在 SQL Server 之上，因此使用更传统的\
  \ SQL 数据库来存储数据。在检查现状数据模型时，需要理解该实例的 SQL Server 数据库架构。我们的数据字典应该从“定义”阶段开始建立。随着我们对数据源和目标数据结构的了解加深，可以生成定义字段类型和格式（包括需要应用的任何规则）的数据字典。\n\
  \n确定了源系统、数据结构、选定实体和字段后，我们可以开始映射数据。我们通过定义源实体和字段将如何映射到目标数据模型（包括可能需要应用的任何转换）来实现这一点。接下来，可以定义清理、去重和丰富数据（如果需要）的策略，包括这些步骤应在流程中的哪个位置进行（例如，提取前或提取后）。\n\
  \n##### 清理\n\n数据清理可以简单地定义为执行数据清洗操作的行为，无论是手动过程还是使用自动化和软件工具。对每个 IT 企业而言，清洗在数据方面的定义会有所不同；例如，确保任何联系人姓名不包含无效字符。所有清洗活动通常包括定义要用于协助该过程的任何工具，以及任何匹配规则和评分阈值。\n\
  \n\n\n\n\n#### 提取\n\n提取数据涉及从源系统中获取已定义的源数据。因此，要有效地提取数据，必须对源系统、现状数据模型以及任何其他相关信息进行明确定义和充分理解。如果在所有数据提取完成后需要执行任何清洗、去重或扩充活动，则可以将所有提取的数据合并到一个暂存区中。\n\
  \n#### 转换\n\n在数据被提取之后，或者在全自动**提取、转换、加载（ETL）**流程的提取阶段之后，通常需要在数据加载到目标系统之前对其进行转换。为了成功完成此操作，有必要了解在转换时要应用的任何实体映射、字段映射以及其他规则、条件或逻辑。\n\
  \n#### 加载\n\n现在，我们处于流程中可以将数据加载到目标系统的阶段。在完成所有这些定义并仔细准备要加载的数据之后，我们可以选择用于加载活动的工具，例如不起眼的\
  \ Salesforce Data Loader。你可能会惊讶地发现，通过脚本让 Data Loader 在命令行上运行，或将其作为更广泛的自动化流程的一部分时，可以实现如此多的自动化。我们还需要考虑可接受的加载性能。我们可能需要加载数百万条记录，因此在可接受的时间范围内完成加载可能会有所不同，具体取决于数据迁移项目的参数、客户行业等。例如，我曾监督一家银行的数据迁移流程，该流程自然只能在银行不营业时进行（并且需要完成）。幸运的是，我们多次测试了该流程，因此在周五晚上及时完成数据加载是相对简单直接的。\n\
  \n#### 测试\n\n通常有两种适用于数据迁移的测试类型：\n\n- 按规格测试\n- 按意图测试\n\n简而言之，按规格测试涉及确保加载了正确数量的数据。例如，提取为我们提供了\
  \ 1,000 条公司记录，因此我们向 Salesforce 加载了 1,000 条 Account 记录。如果加载计数为 990，则说明 1% 的数据未加载成功，我们需要调查原因。理想情况下，这应该在测试过程中被发现并纠正，但我理解在生产数据迁移当天，情况可能并不总是如此。\n\
  \n按意图测试可以被视为针对数据的**用户验收测试（UAT）**。加载的数据能否经受住真实环境的使用？我们的用户能否借助加载的数据按预期履行职责？数据关系是否正确关联？\n\
  \n在流程的测试环节中，还需要考虑的另一件事是数据的对账策略。考虑到我们已经应用的转换，我们如何确保来自各个源系统和目标系统的数据集保持一致？在覆盖了规格、意图和对账之后，我们应该能够说：我们加载了正确数量的记录，这些记录按用户的预期正常工作，并且根据转换逻辑的规定，其最终的期望状态是正确的。\n\
  \n#### 去重\n\n如前所述，数据迁移流程中的去重步骤可能在流程早期进行，但如果认为更合适，也可以在迁移后进行。在对数据进行去重时，可以使用合适的工具来辅助该流程。通常会给该工具一组规则，以确定使用什么条件来匹配数据。这反过来又用于生成数据重复可能性的评分，因此应考虑将其删除。例如，构建一条匹配具有相同电子邮件地址和邮政编码的\
  \ Contact 记录的规则并非完全不合理。这些记录很可能是同一个人，因此可以将其标记为需要干预（在这种情况下，标记为删除）。如果你要将数据迁移到新的数据主库，则可能值得考虑关于传播数据更改以及将重复记录发送到下游系统的预期行为。\n\
  \n#### 扩充\n\n一旦数据被加载并处于干净状态，可能希望通过纳入一次性或持续性的流程来扩充数据。例如，Salesforce 拥有大量可用的 AppExchange\
  \ 软件包，可以提供扩充的公司地址和员工信息、信用评分信息等。如果有扩充数据的需求，通常对已清洗、去重的数据集进行扩充是有意义的。\n\n#### 维护\n\n\
  到目前为止，我们已经定义了一个流程，仔细地映射了我们的数据，并通过提取、转换和加载数据来构建和执行该流程。在此过程中，我们对数据进行了清洗、去重和扩充。但在这个流程完成之前，我们需要覆盖最后一步（有些人可能会认为这是最难的一步）：我们需要考虑如何维护我们已经花费了如此长时间和如此多精力以正确方式送入目标系统的数据。维护自然会根据拥有目标系统的业务特征的不同而采取不同的形式。Salesforce\
  \ 提供了各种工具（甚至包括基本报告），可以帮助确保数据尽可能保持良好的状态。这包括随着用户采用和使用系统，数据如何随着时间的推移而不断添加。\n\n现在我们已经了解了数据迁移流程和步骤，让我们更深入地探讨如何加载高质量数据。\n\
  \n#### 加载高质量数据\n\n当用户与数据交互时，数据必须具备良好的质量才能发挥其作用。例如，销售人员可能会查看 Salesforce 中的 Contact\
  \ 记录，以拨打电话尝试向该客户进行追加销售或交叉销售。如果用户看到同一个人的多条 Contact 记录（重复记录），并且这些记录的完整程度各不相同，他们最终可能会非常恼火。因此，这些用户可能无法获得某个\
  \ Contact 的全部信息，或者更糟糕的是，他们仍然需要在记录之间来回跳转，以推断出应拨打的正确电话号码或应使用的电子邮件地址。\n\n如前所述，在数据迁移流程中可以采取实际步骤。在加载前准备数据时，或者在数据加载到目标系统后，必须进行清洗、去重和（可选）扩充。在考虑数据的数量和质量时，对于一些企业来说，在加载之前执行清洗、去重和扩充活动可能更有意义。这样，将加载最小、最完整且无重复的数据集。\n\
  \n让我们将注意力转向在 Salesforce 中可以采取哪些措施来促进加载高质量数据，我们有几个工具可供使用。验证规则可用于强制字段值采用正确的格式。这可以确保记录达到基线级别的完整性。这包括确保某些字段被填写（例如，除非与销售相关的某些字段已完成，否则无法将\
  \ Opportunity 设置为特定阶段）。我们还有匹配和重复规则，用于标记重复记录并帮助用户防止创建重复记录。可以利用系统中的匹配规则来生成 Salesforce\
  \ 报告，以突出显示那些需要注意的记录。最后，Flow 可用于在创建和更新数据记录时以自动化方式执行操作。在批量处理记录时，通常应关闭自动化。在日常逐条处理记录时，可以使用\
  \ Flow 等自动化来提高记录或相关记录上数据的完整性。\n\n现在我们已经介绍了与数据质量相关的各个方面，接下来让我们看看如何将大量数据（LDVs）迁移到\
  \ Salesforce。\n\n#### 将大量数据迁移到 Salesforce\n\n在向 Salesforce 加载大量数据（数十万或数百万条记录）时，有多种工具和注意事项需要牢记。首先，用于将数据加载到\
  \ Salesforce 的应用程序编程接口（API）会产生巨大的影响。Bulk API 可用于并行加载大量数据（通过将其设置为并行模式）。这可能会导致记录锁定问题，即由于父记录被锁定而无法加载记录。然而，与一次一批地加载数据（称为串行模式）相比，这通常会产生更快的加载时间。减少记录锁定问题可能性的一种方法是按父记录对待加载的记录进行排序\n\
  \n\n\nIDs。纯粹从性能角度考虑，Bulk API 的并行模式是在最短时间内将数百万条记录加载到 Salesforce 中的最快方式。外部 ID 字段可用于在导入记录时避免重复，因为外部系统\
  \ ID 用于标识记录。这在执行例如脚本化数据加载任务时尤其有用，因为外部 ID 可用作关联父记录和子记录的键。\n\n接下来，考虑将用于创建和更新数据的操作。Salesforce\
  \ 提供了 **insert**、**update** 和 **upsert** 操作。Insert 用于数据创建，update 用于更新现有记录，而 upsert\
  \ 用于更新现有记录，或在找不到要更新的记录时创建新记录。可以想象，upsert 操作在 Salesforce 资源方面的成本更高，因为在确定要执行的操作时，会对每条记录进行实时计算。因此，最佳实践是在将\
  \ LDV 迁移到 Salesforce 平台时使用 insert 和 update 操作，因为它们比 upsert 更快。\n\n最后，重要的是要记住，Salesforce\
  \ 上的数据存储是有限的，通常与购买的用户许可证数量相关联。如果你不断地将数百万条记录加载到 Salesforce 中，最终你的数据存储会用完。然而，当 Salesforce\
  \ 环境被配置时，限制相当宽松。通常，数据存储设置为 10 GB（对于 2019 年 3 月下旬起配置的 Salesforce 组织）加上每个许可用户 20 MB\
  \ 或 120 MB，具体取决于购买的 Salesforce 版本（因此，Salesforce Professional Edition 的 20 用户组织将拥有\
  \ 10.4 GB 的数据存储）。\n\n**重要说明**\n有关数据分配和存储限制的更多详细信息，请访问 https://help.salesforce.com/s/articleView?id=sf.overview_storage.htm&type=5。\n\
  \n这很好地引出了下一节，我们将在其中查看从 Salesforce 导出数据。\n\n#### 从 Salesforce 导出数据\n\n尽管我们可能希望通过将数据移入\
  \ Salesforce 来最大化客户在 Salesforce 上的投资，但我们应考虑围绕从 Salesforce 导出数据的要求。这可能涉及导出某些数据（例如，到数据仓库平台），这通常涉及在计划的间隔（例如每晚）执行自动化流程。预期有几种技术可用于完成此任务。\n\
  \n##### 数据导出\n\nSalesforce 提供两种开箱即用的导出数据方法。第一种是数据导出服务，可从 Salesforce 设置中访问。数据导出可用于手动每周或每月导出数据（取决于你拥有的\
  \ Salesforce 版本），以及安排每周（每 7 天）或每月（每 29 天）定期数据导出。\n\n导出数据的第二种方法是来自 Salesforce 的简朴数据加载器应用程序。这可用于提取对象数据，并且如果需要，可以使用查询来过滤数据，例如按当天的最后修改日期过滤所有账户。数据加载器也可用于导出操作进行脚本编写，因为它支持仅在\
  \ Windows 操作系统上可用的命令行界面。\n\n#### Bulk API\n\nSalesforce 的 Bulk API 在处理数百万条记录时，用于导出数据与导入数据一样有效。例如，可以使用\
  \ Bulk API 查询高效查询大量数据（最多 15 GB），拆分为（最多 15 个）1 GB 批次。查询必须在 2 分钟内返回（否则会返回 QUERY_TIMEOUT\
  \ 错误）。如果结果在 1 GB 批次大小限制内，并且批次在 10 分钟时限内处理，则会处理批次并返回结果。Salesforce 将尝试 15 次批次尝试（因此为\
  \ 15 GB 限制），因此如果超出此限制，批次将被视为不成功并返回 Retried more than 15 times 错误。\n\n##### PK 分块\n\
  \nPrimary Key（PK）分块于 2015 年添加到 Bulk API 中，用于提高从 Salesforce 平台下载大量数据的性能。所有自定义对象和大多数标准对象都支持\
  \ PK 分块（完整列表可在 https://developer.salesforce.com/docs/atlas.en-us.234.0.api_asynch.meta/api_asynch/async_api_headers_enable_pk_chunking.htm\
  \ 获取）。\n\nPK 分块的工作方式是，当在 Bulk API 请求中启用它时，连同分块大小（例如 250,000），Salesforce 会获取要返回的数据集的最小和最大\
  \ ID，然后创建一组 SOQL 语句，每个语句都包含一个 WHERE 子句以检索给定分块大小的记录。Salesforce 合并所有结果并返回完整数据集。如果我们举例说明我们选择\
  \ Salesforce 中每个联系人的所有电子邮件地址，我们将编写一个 SELECT SOQL 语句，如下所示：\n\n```\nSELECT Email FROM\
  \ Contact\n```\n\n现在，假设我们在 Salesforce 中有 100 万个联系人，并且我们设置分块大小为 100,000。这里，Salesforce\
  \ 将生成 10 个 SOQL 语句，类似于以下代码块中所示的内容（其中 <ID of record x> 占位符将被实际记录 ID 替换）：\n\n```\n\
  SELECT Email FROM Contact WHERE Id >= <ID of record 1> AND Id < <ID of record 100,000>\n\
  SELECT Email FROM Contact WHERE Id >= <ID of record 100,000> AND Id < <ID of record\
  \ 200,000>\nSELECT Email FROM Contact WHERE Id >= <ID of record 200,000> AND Id\
  \ < <ID of record 300,000>\n```\n\n- 4. 当从 Salesforce 导出大量数据时，用于加快大型 SELECT SOQL\
  \ 查询性能的方法是什么？\n- 5. 哪个数据 API 促进数据以并行批次进行异步处理？\n- 6. 按其父记录 ID 对要导入的记录进行排序会降低发生什么的可能性？\n\
  - 7. 真或假：upsert 在加载大量数据时被认为对性能有好处。\n- 8. PK 分块是哪个 Salesforce API 的功能？\n- 9. 任何数据迁移过程中的第一步是什么？\n\
  - 10. 为什么 PK 分块被认为比直接的 *Export All* 操作更快？\n\n#### 答案\n\n以下是前面问题的答案。你能正确回答多少个？在此检查你对前面问题的答案：\n\
  \n- 1. Large Data Volume\n- 2. Primary key\n- 3. Data Export\n- 4. PK Chunking\n\
  - 5. Bulk API\n- 6. Parent record locking\n- 7. False. Use insert and then update\
  \ as separate operations.\n- 8. The Bulk API\n- 9. Define\n- 10. Because by breaking\
  \ the query down into sub-queries, the Salesforce Query Optimizer threshold isn’t\
  \ reached and therefore the performance of each query is optimal.\n\n#### 延伸阅读\n\
  \n请参阅以下资源。有关本章所涵盖内容的更多信息：\n\n- 从 Salesforce 导出数据选项：https://trailhead.salesforce.com/content/learn/modules/lex_implementation_data_management/lex_implementation_data_export\n\
  - Salesforce 中的 PK 分块：https://developer.salesforce.com/docs/atlas.en-us.234.0.api_asynch.meta/api_asynch/async_api_headers_enable_pk_chunking.htm\n\
  - 数据分配和存储限制：https://help.salesforce.com/s/articleView?id=sf.overview_storage.htm&type=5\n\
  - Bulk API 查询：https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/asynch_api_bulk_query_intro.htm\n\
  \n### 第 2 部分：\nSalesforce 数据\n架构设计\n\n将注意力转向专注于数据的 Salesforce 平台上解决方案的有效设计，本书的这一部分涵盖了有关核心数据模型、Apex\
  \ 的有效使用、获取数据的选项、性能调优以及领地管理的主题。就像本书的第一部分一样，所概述的主题将在你作为 Salesforce 数据架构师的日常工作中成为一个方便的参考。\n\
  \n本节包含以下章节：\n\n- 第 8 章，Accounts and Contacts\n- 第 9 章，Data APIs and Apex\n- 第 10\
  \ 章，Tuning Performance\n- 第 11 章，Backup and Restore\n- 第 12 章，Territory Management\n\
  \n\n\n\n\n#### 账户与联系人\n\n在核心平台云（如 Sales Cloud 和 Service Cloud）中，两个核心对象是 Account（账户）和\
  \ Contact（联系人）。这两个对象值得单独一章来描述 Salesforce 平台赋予它们的特殊行为。\n\n在本章中，我们将介绍 Account 和 Contact\
  \ 模型，包括 Person Accounts（个人账户）以及联系人关联多个账户启用带来的影响、Account Skew（账户倾斜），以及这对查询和报表性能的影响。我们还将查看与账户和联系人相关联的标准\
  \ Salesforce 数据模型中的对象。\n\n阅读完本章后，你将理解 Account 和 Contact 数据模型，包括启用个人账户时会发生什么。你还将理解启用联系人关联多个账户功能的影响和注意事项。此外，你将了解与\
  \ Account 和 Contact 相关联的对象。最后，你将理解 Account Skew 是什么以及它如何影响你的用户。\n\n在本章中，我们将介绍以下主题：\n\
  \n- 理解 Account 和 Contact 模型\n- 介绍个人账户\n- 探索联系人关联多个账户功能\n- 探索与账户和联系人相关联的对象\n- 综合应用\n\
  - 重新审视 Account Skew\n\n##### 理解 Account 和 Contact 模型\n\n**Account** 对象是许多 Salesforce\
  \ 核心平台云产品（如 Sales Cloud、Service Cloud、Financial Services Cloud 和 Experience Cloud）的核心。**Contact**\
  \ 对象代表与 Account 记录相关联的人员。\n\n在最基本的解释中，**Account 记录**代表一家公司或类似实体，可以与一个或多个 Contact\
  \ 记录相关联，例如员工。因此，Account 记录可以被视为一家公司或企业。一个 Account 记录可以拥有多个 Contact 记录，代表该公司或企业的员工。\n\
  \n让我们看看这种简单结构是如何在图表中表示的：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_132_0.png)\n\
  \n图 8.1 – 简化的 Account 和 Contact 对象关系\n\n正如你所预期的那样，由于 Salesforce 最初专注于销售团队/销售（因此得名），Account\
  \ 对象包含许多有用的标准字段，可以在最小化自定义的情况下使用。\n\n这些标准字段包括以下内容：\n\n- **Industry**：账户可能所属的行业选择列表，例如农业或运输\n\
  - **Shipping address**：邮寄地址\n- **Billing address**：发票和文件发送的位置\n- **Number of employees**\n\
  - **Ownership**：表示公司所有权结构是私有、公开、有限等\n- **Standard Industry Classification (SIC)**\
  \ 代码\n- **Ticker symbol**：公开股票交易代码 - 例如，Salesforce 交易代码为 **Customer Relationship\
  \ Management (CRM)**，其交易代码为 CRM\n- **Website**：网站地址\n\n还有其他标准字段可供使用，你可以在 https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_account.htm\
  \ 提供的 Account 对象文档中了解更多信息。\n\n现在我们了解了 Account 对象，让我们探索 Account 层级结构。\n\n##### Account\
  \ 层级结构\n\nAccount 记录也可以拥有父级 Account，代表公司层级。例如，你可能有一家名为 *MadeUp* 的公司，其 Account 记录包括\
  \ MadeUp Incorporated（全球集团实体）、MadeUp North America、MadeUp **Europe, Middle East,\
  \ and Africa**（EMEA），以及该公司在各国的国家特定 Account 记录。\n\n让我们用以下图表可视化我们的 Account 层级结构：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_133_0.png)\n\n图 8.2 – 可视化的 Account 层级结构\n\
  \nAccount 层级结构可以通过 Account 记录的 ParentId 字段填充父级 Account 记录的 Salesforce ID 来实现。这是一个标准字段，无需功能启用或自定义。\n\
  \n在了解了账户和联系人的业务视角后，让我们来看一下个人账户。\n\n##### 介绍个人账户\n\n在账户和联系人的业务视角中，账户是一家公司，联系人是该公司的员工，业务交易（Opportunities）与\
  \ Account 记录相关。在向个人销售时，例如 Financial Services Cloud 实施中的银行客户，我们需要将 Opportunities\
  \ 与这些人相关联，就像它们是 Account 记录一样。这就是 Person Account 概念的用武之地。\n\n**Person Account** 是一种特殊的\
  \ Account 记录类型，它将单个相关联 Contact 记录的部分但非全部信息提取到 Account 上。这允许将有关该人员的信息（来自相关联的 Contact\
  \ 信息）在将业务交易（Opportunity）与该人员相关联时得到体现。Opportunity 仍与 Account 记录相关联以形成 Person Account。\n\
  \n启用 Person Account 时，Account 和 Contact 的 **Organization-Wide Defaults (OWDs)**\
  \ 需要设置为 Private，或者 Contact 需要设置为 Controlled by Parent。启用后，可使用 Person Account 记录类型。之后可以根据需要创建其他\
  \ Person Account 记录类型，用于页面布局/配置文件分配以及为用户提供正确体验所需的其他功能。\n\n要启用 Person Account，需要向\
  \ Salesforce 支持部门提交案例。启用后，Person Account 无法被禁用。此外，这对共享模型有永久性影响。鉴于启用 Person Account\
  \ 的先决条件是将 Contact 的 OWD 设置为 Controlled By Parent 或 Private，请考虑启用这种广泛共享设置的永久影响。不构成\
  \ Person Account 的联系人将需要通过 Salesforce 的其他共享功能（如角色层级和共享规则）显式与用户共享。\n\n> **重要说明**\n\
  > \n> 可以启用 Person Account 并继续像以前一样使用 Account 和 Contact 记录。以需要启用 Person Account 的\
  \ Financial Services Cloud 银行为例，银行可以针对公司和个人创建 Opportunities，分别由其 Account 和 Person\
  \ Account 记录表示。\n\n使用 Person Account 时请注意，Leads（代表人员）不会转换为单独的 Account、Contact 或\
  \ Opportunity。相反，你必须将 Lead 转换为 Person Account 和 Opportunity。\n\n此外，Parent Account\
  \ 字段不会出现在 Person Account 上，因为你无法使用 Person Account 表示 Account 层级。在绘制和可视化 Person Account\
  \ 时，我更喜欢在合并的 Account 和 Contact 周围画一个虚线框，如下图所示：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_135_0.png)\n\
  \n图 8.3 – Person Account 的图表表示\n\n现在我们已经介绍了 Person Account，让我们学习如何在 Salesforce 中将一个\
  \ Contact 记录与多个 Account 记录相关联。\n\n##### 探索联系人关联多个账户功能\n\n如你所料，联系人关联多个账户功能允许一个 Contact\
  \ 记录与多个 Account 记录相关联。启用联系人关联多个账户后，Contact 记录本质上具有一个主要 Account 记录关系和零个或多个间接 Account\
  \ 关系。\n\n> **重要说明**\n> \n> 禁用联系人关联多个账户功能将有效地删除你 Contact 记录的所有间接 Account 关系。\n\n\
  启用后，Account 对象的标准 Contacts 相关列表可以在页面布局上替换为 **Related Contacts** 列表。Contact 页面布局可以添加\
  \ **Related Accounts** 列表。Person Account 的页面布局可以同时添加这两个相关列表。\n\n> **重要说明**\n> \n\
  > 默认情况下，与 Contact 记录相关联的任何活动都会汇总到该联系人的主要 Account 记录。可以取消选择 **Salesforce Setup**\
  \ 中 **Activities Settings** 中的 **Roll up activities to a contact’s primary account**\
  \ 选项来禁用此默认行为。\n\n\n\n\n\n现在，让我们探索围绕 Account 和 Contact 对象的更广泛对象模型。\n\n#### 探索与账户和联系人关联的对象\n\
  \n尽管两者之间存在明确的关系，其中多个 Contact 记录可以属于同一个 Account，但还有几个额外的对象可以为这两个对象的记录之间的关系提供上下文。\n\
  \n现在，让我们从 AccountContactRelation 开始，探索各种 Account 和 Contact 对象的关联。\n\n##### AccountContactRelation\n\
  \n我们在本章前面描述了联系人关联多个账户的功能，因此涵盖了单个 Contact 记录如何与多个账户关联。嗯，AccountContactRelation 对象就是实现这一\
  \ Salesforce 功能的底层数据模型实体。\n\nAccountContactRelation 对象本质上充当 Account 和 Contact 之间的连接对象。一些标准字段用于提供\
  \ Contact 与 Account 之间关系的上下文。这些可能包括关系开始和结束的开始/结束日期等内容。它们还可能包括他们在账户中可能扮演的角色，其中可以多选。其他字段可能包括表示关系是否活跃以及关系是否指向联系人的主要账户等信息（使用\
  \ IsDirect 字段）。\n\n该实体的底层数据模型可以可视化如下：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_136_0.png)\n\
  \n图 8.4 – AccountContactRelation 在标准 Salesforce 数据模型中的位置（OWDs 已有意省略）\n\n现在，让我们学习如何为相关账户和联系人之间的关系提供上下文。\n\
  \n##### AccountContactRole\n\n为了表示特定 Contact 记录相对于 Account 记录所扮演的实际角色，例如决策者、买方等，AccountContactRole\
  \ 对象是一种轻量级的方式来关联联系人，从而提供上下文。\n\n想象一下，你是一名使用 Salesforce 的销售人员，正在向某家公司（Account）销售。知道是谁（Contact\
  \ 记录）在做什么（AccountContactRole 记录）可以使销售更有针对性，并有助于确保你能与合适的人进行正确的对话。\n\nAccountContactRole\
  \ 对象是一个连接对象，因为它包含对 Account 和 Contact 对象的查找——即 AccountId 和 ContactID 字段。顾名思义，它也是用于捕获联系人所执行角色的对象。这由\
  \ Role 字段表示。\n\n该连接对象可以在数据模型中与 Account 和 Contact 一起表示如下：\n\n![](img/7cca8452e237cf62a2d0e00a080d3fe9_137_0.png)\n\
  \n图 8.5 – AccountContactRole 在标准 Salesforce 数据模型中的位置（OWDs 已有意省略）\n\n在介绍了 AccountContactRole\
  \ 对象之后，让我们来看一下账户团队。\n\n##### 账户团队\n\n**账户团队**代表在账户中扮演角色的 Salesforce 用户。例如，在向账户销售或服务时，你的组织中可能有\
  \ Salesforce 用户负责管理关系、作为升级联系点等。\n\n账户团队提供了一种将你的 Salesforce 用户与账户关联起来的方式，除了 Salesforce\
  \ 中已为你的组织配置的共享模型之外。例如，你可能有一个私有账户、联系人和机会共享模型，以及一个已设置的角色层级，其中销售团队成员位于该角色层级的同一位置。默认情况下，这些用户不会自动访问所有账户记录。他们需要通过共享规则或手动共享等方式显式共享。账户团队提供了一种打开对账户和其他对象（包括联系人、机会和案例）的访问权限的方式。此访问权限可以按每个账户团队成员进行指定。\n\
  \n负责此功能的 Salesforce 实体称为 AccountTeamMember。除了对 User 和 Account 的查找之外，该对象还提供 AccountAccessLevel、CaseAccessLevel、ContactAccessLevel\
  \ 和 OpportunityAccessLevel 选项列表字段。这些字段可以具有 None、Read 和 Edit 值，可用于设置各自的访问级别。\n\n\
  ![](img/7cca8452e237cf62a2d0e00a080d3fe9_138_0.png)\n\n现在我们已经介绍了围绕核心账户和联系人数据模型的关联对象，让我们来看一个示例，将本章中的所有内容结合起来。\n\
  \n#### 综合应用\n\n让我们使用本章中涵盖的账户和联系人概念中的实际示例，将本章中学到的内容结合起来。\n\n让我们想象一家虚构的银行，它既与个人打交道，也与企业打交道（以及为该企业工作的员工）。该虚构银行拥有处理企业客户的销售团队、处理非企业银行客户的个人银行家，以及可以参与多个公司业务的某些客户个人，例如法律专业人士。让我们想象一下账户和联系人部分的数据模型如何可视化：\n\
  \n![](img/7cca8452e237cf62a2d0e00a080d3fe9_139_0.png)\n\n在这里，我们可以看到如何使用 Person Accounts\
  \ 功能和三个连接对象实现账户和联系人之间几种不同类型的关系。我们的虚构银行可以使用单独的账户和联系人记录来处理企业（类似于开箱即用的 Salesforce 功能），或使用个人账户来处理个人。\n\
  \n联系人在账户中扮演的角色由 AccountContactRole 对象表示，因此多个人员可以由同一个企业客户处理。\n\n对于与多个公司打交道的法律专业人士的需求，可以使用\
  \ `AccountContactRelation` 对象。\n\n最后，使用 `AccountTeamMember` 对象可以满足处理企业客户的用户团队的需求。\n\
  \n虽然对象模型纯粹关注账户和联系人（因为未包含 OWD），但可以看到如何以简单的方式使用标准 Salesforce 对象实现多个业务需求。\n\n现在我们已经介绍了一个将所有内容结合起来的示例，让我们重新审视一个影响账户和联系人的性能问题：账户倾斜。\n\
  \n#### 重新审视账户倾斜\n\n如 *第 2 章、数据建模和数据库设计* 中所述，**账户倾斜**是账户记录包含 10,000 个或更多子记录的结果。这会导致性能和记录锁定问题。\n\
  \n当对账户的子记录进行更新时，Salesforce 会锁定父账户记录以在数据库中维护记录完整性。在同一账户记录下更新大量子记录可能会导致问题，因为这些子记录操作都将尝试锁定父账户记录。\n\
  \n此外，当对账户记录进行影响共享的更新时，例如更改记录所有者这样看似无害的操作，那么该账户的所有共享都必须重新计算。这适用于账户的所有子记录。这可能导致许多相互关联的流程失败，因为共享规则、角色层级计算和其他共享操作必须进行。如果任何操作锁定记录或花费时间过长，可能会发生争用。\n\
  \n#### 缓解账户倾斜\n\n缓解账户倾斜的简单规则是将子记录分布到多个父账户记录中。记住，10,000 是特定账户记录在出现账户倾斜之前建议的最大子记录数。\n\
  \n在重新审视了账户倾斜之后，让我们总结一下本章中我们所涵盖的内容。\n\n#### 总结\n\n在本章中，我们深入研究了账户和联系人模型，了解其在许多核心 Salesforce\
  \ 云产品更广泛数据模型中心的位置。首先，我们研究了启用个人账户所涉及的细微差别，并研究了联系人关联多个账户的功能。还探索了围绕账户和联系人对象的更广泛数据模型。最后，我们重新审视了账户倾斜，以了解其在性能方面的意义。\n\
  \n\n\n\n\n在 *第 9 章，数据 API 和 Apex* 中，我们将介绍考试的实际方面。\n\n#### 练习题\n\n通过尝试回答以下练习题来测试你对本章所学内容的掌握：\n\
  \n1. 哪个对象负责管理联系人与账户的关系，其中该联系人可能与多个账户关联？\n2. 当未启用“联系人与多个账户”功能时，哪个对象负责管理联系人与账户的关系？\n\
  3. 什么术语描述了一个行为类似于联系人，但可以与商机关联的账户记录？\n4. 哪个对象将用户记录与账户关联，而不通过所有权和配置的组织范围共享模型？\n5.\
  \ 在账户记录上，`ParentId` 字段用于什么？\n6. 真或假？可以并行使用个人账户和企业账户。\n7. 真或假？一旦启用个人账户，就无法禁用它们。\n\
  8. 真或假？在启用“联系人与多个账户”功能后，联系人的活动历史将汇总到联系人的指定主账户记录。\n9. 使用账户团队时，**AccessLevel** 列表值的设置必须是什么？\n\
  10. 什么是账户倾斜？\n\n#### 答案\n\n你在回答练习题时表现如何？在此核对你的答案：\n\n1. `AccountContactRelation`\n\
  2. `AccountContactRole`\n3. 个人账户\n4. `AccountTeamMember`\n5. 账户层次结构\n6. 真\n7. 真\n\
  8. 真\n9. 高于相应对象的组织范围默认值的数值\n10. 记录锁定、共享或其他长时间运行的进程，这些进程可能因账户记录拥有过多子记录而失败\n\n####\
  \ 进一步阅读\n\n以下资源将有助于巩固你在本章中学到的内容：\n\n- 账户对象 API 文档：<https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_account.htm>\n\
  - 联系人对象 API 文档：<https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_contact.htm>\n\
  - *启用个人账户*：<https://help.salesforce.com/s/articleView?id=sf.account_person_enable.htm&type=5>\n\
  - *设置联系人与多个账户*：<https://help.salesforce.com/s/articleView?id=sf.shared_contacts_set_up.htm&type=5>\n\
  - *比较联系人与多个账户与其他选项*：<https://help.salesforce.com/s/articleView?id=sf.shared_contacts_comparison.htm&type=5>\n\
  - AccountContactRelation API 文档：<https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_accountcontactrelation.htm>\n\
  - AccountContactRole API 文档：<https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_accountcontactrole.htm>\n\
  - AccountTeamMember API 文档：<https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_accountteammember.htm>\n\
  \n#### 数据 API 和 Apex\n\n在本章中，我们将探讨与数据操作相关的各种 Salesforce 应用程序编程接口（API）。了解各种 API 和\
  \ Apex 操作对于完善你对 Salesforce 平台在数据操作方面的编程能力知识至关重要。在参加考试时，你可能会遇到涉及根据 Salesforce API\
  \ 的使用或使用 Apex 代码来实现特定数据操作来回答的假设场景问题。因此，这对于完善你作为 Salesforce 数据架构师的知识至关重要。本章中，我们还将介绍与数据相关的\
  \ Apex 功能，包括数据库操作、使用批量数据方法以及异步 Apex。\n\n在本章中，我们将介绍以下主题：\n\n- 如何调用 API\n- Lightning\
  \ Platform 数据 API\n- Apex 数据库操作\n- 批量 Apex\n- 异步 Apex\n\n在本章结束时，你将能够很好地理解在设计涉及 Salesforce\
  \ Lightning Platform 上数据操作的解决方案时，如何适当部署所涵盖的每个主题。让我们从了解如何调用 API 开始。\n\n##### 如何调用\
  \ API\n\n虽然 API 的设计和实现超出了本书的范围，但我们将简要介绍如何调用 API，即 Salesforce REST API。从高层次来看，API\
  \ 本质上是对端点（URL）的请求，附带 XML 或 JSON 正文（称为请求负载）。端点将返回响应负载，其格式可能为 XML 或 JSON，具体取决于其配置方式。\n\
  \n恭喜！你已通过发出查询（请求）调用了 Salesforce API，并返回了一份账户记录列表，其中包含每个记录的 Name 字段（响应）。\n\n让我们开始探索\
  \ Lightning Platform 数据 API。\n\n##### Lightning Platform 数据 API\n\nSalesforce Lightning\
  \ Platform 上有 11 个 API 可用，涵盖各种操作，包括处理元数据（Metadata API）、构建允许用户与 Salesforce 记录交互的用户界面（User\
  \ Interface API），以及在构建自定义开发模块或应用程序时使用（Tooling API）。\n\n我理解并非阅读本书的每个人都是软件工程师，因此了解\
  \ API 的复杂工作原理。 然而，了解 Salesforce 如何以编程方式公开与数据相关的操作是必要的。这将让你更全面地了解数据如何通过 Salesforce\
  \ 平台上的操作而受到影响，而不仅仅是通过通用用户界面交互。\n\n简而言之，API 提供了两种软件应用程序之间相互通信的手段。通常，一个应用程序公开一组可供其他应用程序调用的操作。API\
  \ 还支持身份验证，Salesforce 也不例外。在使用 Salesforce API 调用操作之前，必须以编程方式对 Salesforce 进行身份验证。正如用户使用用户界面与\
  \ Salesforce 交互一样，所有 API 操作都是作为用户执行的，因此它受与其他用户相同的权限模型约束。我见过为此目的专门设置 *集成用户* 账户。相同权限模型适用于其他软件工具使用的用户账户的优点是，可以使用相同的权限设施（组织范围默认设置、角色层次结构、配置文件、权限集、共享规则、手动共享等）来确保只有适当的数据可访问。\n\
  \n在以下小节中，我们将重点关注以下 API，因为它们允许我们在 Salesforce 平台上处理数据：\n\n- REST API\n- SOAP API\n\
  - Bulk API\n\n让我们依次介绍这些 Salesforce API，首先从 REST API 开始。\n\n##### REST API\n\n与 **简单对象访问协议（SOAP）**\
  \ API 类似，Salesforce **表述性状态转移（REST）** API 提供了与 Salesforce 交互的编程接口。由于 REST 在数据包大小方面是一个更轻量级的框架，因此它更受移动应用程序的青睐。\n\
  \n**重要说明**\n\nREST 涉及利用标准的一组 HTTP 方法来获取数据或将数据推送到和从端点。REST API 调用是无状态的，即每次调用都被视为一个独立的操作。REST\
  \ 支持 JSON 或 XML 作为负载格式。\n\nSOAP 比 REST 更重量级，但允许在调用特定端点上的操作时确定要调用的方法方面具有更大的灵活性。SOAP\
  \ API 调用是有状态的，即操作或数据的状态在每次传递时都会在前后传递。SOAP 使用 XML 作为负载格式。\n\nSalesforce 提供了相同的底层数据模型，并且无论使用\
  \ REST 还是 SOAP API 调用操作，相同的 governor 限制都适用。\n\n使用 REST API，可以在对查询端点的请求中调用 Salesforce\
  \ 数据查询，其中 SOQL 查询可以作为请求的一部分传递。例如，调用以下端点的 GET 操作将返回所有账户记录 Name 值，符合 REST API 规范：<https://login.salesforce.com/services/data/v54.0/query?q=SELECT+Name+FROM+Account>。\n\
  \n要创建记录，请在创建记录的对象的端点上调用 POST 操作（例如 `/services/data/v20.0/sobjects/Account/`，负载为字段名称和值映射）。这可能如下所示：\n\
  \n```\n{\n  \"Name\": \"Packt\",\n  \"Industry\": \"Publishing\"\n}\n```\n\n值得注意的是，Salesforce\
  \ REST API 是无状态的，即调用应用程序需要在请求中包含所有必要的信息，以便 Salesforce 理解如何处理该请求。如果你使用 Salesforce\
  \ REST API 开发，你会很快注意到它使用通用的 HTTP 方法（GET、POST 等），因此所有资源和操作都是通过通用接口访问的。\n\nREST API\
  \ 支持使用 OAuth 2.0 协议对 Salesforce 进行身份验证，这是一种用于对 RESTful 应用程序进行 Salesforce 身份验证的完善记录的方法。\n\
  \n现在我们已经介绍了 REST API，让我们探索相对相似的 SOAP API。\n\n\n\n\n#### SOAP API\n\nSOAP API 与 REST\
  \ API 的工作方式类似，你可以通过 Web 服务调用来处理对象数据。SOAP API 在使用上不如 REST API 轻量，因为状态会随着每个请求和响应来回传输。SOAP\
  \ Web 服务调用必须使用 XML 作为负载数据格式，并且可以被任何支持 Web 服务的编程语言使用。\n\nSOAP Web 服务通过使用 Web 服务描述语言（WSDL）文件来定义，该文件描述了可执行的方法、任何参数以及对这些操作的调用的示例请求和响应。你的\
  \ Salesforce 实例的 WSDL 可以从 Setup 下载，方法是在搜索框中输入 API，然后选择返回的 API 菜单项。然后，你可以下载两个 WSDL\
  \ 文件之一：\n\n- 1. Enterprise WSDL：这特定于你的 Salesforce 实例，并考虑了你所做的自定义（例如自定义对象的创建）。\n\
  - 2. Partner WSDL：这是一个使用通用类型工作的 WSDL 文件（所有对象都通过 Object 操作进行交互，而不是直接操作 Account 实体、Contact\
  \ 实体等）。\n\n在使用 SOAP API 时，你首先会调用一个操作，以你想要执行操作的用户身份登录 Salesforce，这会生成一个会话标识符。该会话标识符随后用于所有后续请求。\n\
  \n以我们在本章 REST API 部分创建 Account 记录的示例为例，SOAP 表示如下（假设登录操作已完成）：\n\n```xml\n<soapenv:Envelope\
  \ xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:urn=\"urn:enterprise.soap.sforce.com\"\
  \ xmlns:urn1=\"urn:sobject.enterprise.soap.sforce.com\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  >\n    <soapenv:Header>\n        <urn:SessionHeader>\n            <urn:sessionId>[sessionId\
  \ retrieved from a login() call]</urn:sessionId>\n        </urn:SessionHeader>\n\
  \    </soapenv:Header>\n    <soapenv:Body>\n        <urn:create>\n            <urn:sObjects\
  \ xsi:type=\"urn1:Account\">\n                <Name>Packt</Name>\n<Industry>Publishing</Industry>\n\
  \            </urn:sObjects>\n</urn:create>\n</soapenv:Body>\n</soapenv:Envelope>\n\
  ```\n\n如你所见，与 REST 示例相比，SOAP API 调用更具描述性。<urn:create> 标签指定这是一个 SOAP 插入操作，<urn:sObjects\
  \ xsi:type=\"urn1:Account\"> 标签指定这是一个 Account 对象，然后子标签指定字段。REST API 通过向 Account\
  \ 端点发送 POST 请求，也假定相同的事情。\n\n虽然本节偏技术性，但 SOAP 和 REST API 在数据库操作方面具有同等能力。区别在于它们的交互方式。可以说，数据库操作可以通过编程方式执行。鉴于所有操作都在用户上下文中运行，Salesforce\
  \ 权限模型适用。\n\n现在我们已经介绍了 SOAP API，接下来让我们看看 Bulk API。\n\n#### Bulk API\n\nSalesforce\
  \ Bulk API 主要用于两个目的：数据导入和查询。简化这些术语来说，你可以使用 Bulk API 执行插入、更新、upsert 或删除操作（导入），或者检索数据（查询）。使用\
  \ Bulk API 的关键原因在于要导入或查询的数据量。任何涉及超过 2,000 条记录的操作都适合使用 Bulk API。\n\n在执行导入操作时，Bulk\
  \ API 会将操作分成一组较小的批处理以提高性能。启动导入批处理作业时，首先必须创建一个 CSV 文件，表示要处理的记录（就像使用 Salesforce Data\
  \ Loader 一样）。作业指定操作是什么（插入、更新、upsert 或删除），以及要操作的对象，例如 Account 或 Contact。当你启动作业时，Salesforce\
  \ 将负责优化作业，以减少性能问题、超时和批处理失败的可能性。\n\n在执行查询操作时，Bulk API 将根据指定的查询返回记录。同样，Salesforce\
  \ 会优化作业以提高性能，并尽可能减少超时或失败的可能性。\n\n在执行导入作业时，Salesforce 会将数据按每 10,000 条记录分成批次（每日限制为\
  \ 1.5 亿条记录）。Salesforce 会尝试处理批次中的每条记录，但如果批次未在 10 分钟内完成，则该批次失败。Salesforce 会重试任何失败的批次，最多重试\
  \ 10 次。如果批次在重试 10 次后仍然失败，则整个批处理作业被标记为失败。在这种情况下，你可以使用调用 Bulk API 的 Failed Record\
  \ Results 或 Unprocessed Record Results 端点返回的结果来检索未处理的记录，并在纠正任何错误或问题后使用这些记录启动新作业。\n\
  \n查询作业自然更容易管理，因为数据在作业完成后返回。但是，如果查询作业重试超过 15 次，它将失败。在这种情况下，最简单的解决方法是向查询应用过滤条件，以提高性能并减少返回的记录数。\n\
  \n现在我们已经了解了 Bulk API，接下来让我们看看 Apex 数据库操作。\n\n#### Apex 数据库操作\n\n在 Apex 代码中，可以通过两种方式之一与\
  \ Salesforce 数据库交互：使用数据库操作语言（DML）语句或使用 Apex Database 类方法。DML 语句采用插入、更新、upsert 或删除操作的形式。以下是一个\
  \ DML 插入语句的示例：\n\n```apex\npublic class dmlStatementTest {\n    public void testStatement()\
  \ {\n        List<Account> accounts;\n        accounts.add(new Account(Name='Packt\
  \ UK'));\n        accounts.add(new Account(Name='Packt India'));\n\n        insert\
  \ accounts;\n    }\n}\n```\n\nApex 数据库方法的工作方式略有不同，因为不是使用 insert 或 update 等关键字，而是调用\
  \ Database 类的方法。我认为，这提供了更大的灵活性，但代价是等效 DML 操作的代码更冗长。这是因为 Database 类方法允许通过参数指定在遇到错误时是否尝试部分记录处理。我们之前使用的相同示例，但使用\
  \ Apex Database 类，可以表示如下：\n\n```apex\npublic class apexDatabaseClassTest {\n   \
  \ public void testStatement() {\n        List<Account> accounts;\n        accounts.add(new\
  \ Account(Name='Packt UK'));\n        accounts.add(new Account(Name='Packt India'));\n\
  \n        Database.SaveResult[] accountSaveResult = Database.insert(accounts, false);\n\
  \        // You would iterate through the\n        // Database.SaveResult list here\n\
  \    }\n}\n```\n\n`Database.insert` 操作的第二个参数是一个布尔值，指定是否尝试部分记录处理。如果传入 true 值，则一旦一条记录无法处理，所有剩余记录都不会被尝试，并且会抛出异常。如果传入\
  \ false 值，则所有记录都会被尝试，每条记录的状态将返回到 `Database.SaveResult` 数组。可以对此进行迭代，并采取适当的操作。\n\n\
  要确定最合适的 Apex 方法，请考虑是否需要抛出异常并立即中断代码的执行。如果需要，则使用 DML 语句是合适的。如果你希望允许处理某些记录，并根据所有记录的状态采取操作而不中断代码流程，则考虑改用\
  \ Apex Database 类方法调用。\n\n> **重要说明**\n> \n> 数据库事务控制以及回滚数据库操作的能力仅在 Apex Database\
  \ 类中可用。此外，Apex Database 类允许你清空回收站并使用 `convertLead` 方法转换潜在客户。\n\n现在我们已经介绍了使用 Apex\
  \ 的数据库操作，让我们转向另一个 Apex 数据处理工具，称为批量 Apex。\n\n#### 批量 Apex\n\n顾名思义，批量 Apex 用于批量调用和处理可能大量的记录，其中记录数由向\
  \ Salesforce 发出查询确定。这种执行方式非常适合可能需要处理大量记录，但确切记录数未知的情况，例如在夜间批处理过程中更新记录。\n\n批量 Apex\
  \ 类必须实现 `Database.Batchable` 接口，因此必须实现 `start`、`execute` 和 `finish` 方法。一个用于实现 `Database.Batchable`\
  \ 接口的极简 Apex 类类似于以下内容：\n\n```apex\npublic class myBatchClass implements Database.Batchable\
  \ {\n    public Database.QueryLocator start(Database.BatchableContext info){}\n\
  \    public void execute(Database.BatchableContext info, List<SObject> scope){}\n\
  }\n```\n\n\n```apex\npublic void finish(Database.BatchableContext info){}\n}\n```\n\
  \n`start` 方法用于定义查询。返回的 `Database.QueryLocator` 用于在指定的批大小中有效地检索查询结果（如果未指定，则为 200）。\n\
  \n`execute` 方法用于定义 Apex 类逻辑的大部分内容，并处理在该记录批次中返回的记录。\n\n`finish` 方法用于任何后处理逻辑。我在夜间批处理作业类定义中使用它来调用一封电子邮件，汇总作业的统计信息（处理的总记录数、成功和失败）。\n\
  \n要调用批处理 Apex 类，必须对其进行调度。这可以在 Developer Console 中作为匿名 Apex 执行来完成：\n\n```apex\nId\
  \ batchJobId = Database.executeBatch(new BatchClass(), 150);\n```\n\n在此示例中，我们的批处理\
  \ Apex 类名为 `BatchClass`，我们以每次 150 条记录的批大小执行它（因此每次批处理都会由批处理类的 `execute` 方法处理 150\
  \ 条记录）。\n\n作为示例，让我们编写一个批处理类，返回我们 Salesforce 实例中今天创建的所有 Account 记录，并为每个记录附加短语“processed”。然后，我们将使用默认批大小\
  \ 200 进行调用：\n\n```apex\npublic class appendAccountNameBatch implements Database.Batchable\
  \ {\n    public Database.QueryLocator start(Database.BatchableContext info) {\n\
  \        return Database.getQueryLocator('SELECT Id, Name FROM Account WHERE CreatedDate\
  \ = TODAY');\n    }\n\n    public void execute(Database.BatchableContext info, List<sObject>\
  \ scope) {\n        List<Account> accounts = new List<Account>();\n        for (sObject\
  \ s : scope) {\n            Account act = (Account)s;\n            act.Name = act.Name\
  \ + ' processed';\n            accounts.add(act);\n        }\n        update accounts;\n\
  \    }\n\n    public void finish(Database.BatchableContext info) {\n        // Do\
  \ nothing\n    }\n}\n```\n\n该类将按如下方式调用：\n\n```apex\nId batchJobId = Database.executeBatch(new\
  \ appendAccountNameBatch());\n```\n\nBatch Apex 作业可以在 Salesforce Setup 中通过在快速查找框中输入\
  \ Apex Jobs 来查看（并停止）。如果作业为 **Completed**，则表示它已无错误运行。状态为 **Aborted** 或 **Failed**\
  \ 的作业需要调查，因为它们未成功执行。\n\n完全可以按计划安排 Batch Apex 作业运行，例如每晚运行一次。为此，您需要为批处理 Apex 类创建一个包装类，该类实现\
  \ Schedulable 接口，然后根据使用类似 Unix 的 cron 格式定义的计划安排该类执行。\n\n> **重要说明**\n>\n> **Unix**\
  \ cron 格式用于指定可调度作业的运行频率。它源自 Unix 操作系统上的 cron 实用程序。它遵循六个值的日/时间格式（年份可选为第七个）。它表示为字符串，例如\
  \ `0 0 17 * * ?`，表示每天下午 5 点执行。有关 cron 字符串格式的更多信息，请参阅 `https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_scheduler.htm`。\n\
  \n例如，让我们将 appendAccountNameBatch 类包装起来以允许其被调度：\n\n```apex\npublic class scheduledAppendAccountNameBatch\
  \ implements Schedulable {\n    public void execute(SchedulableContext sc) {\n \
  \       appendAccountNameBatch b = new appendAccountNameBatch();\n        // your\
  \ batch class\n        Database.executeBatch(b);\n    }\n}\n```\n\n然后，我们可以使用匿名 Apex\
  \ 调用此可调度类：\n\n```apex\nSystem.schedule('Nightly scheduledAppendAccountNameBatch\
  \ Job', '0 0 1 * * ?', new scheduledAppendAccountNameBatch());\n```\n\n这将导致我们的批处理类每晚凌晨\
  \ 1 点运行。通过了解 Apex 代码如何被调用以及记录批处理如何帮助我们在 governor limits 内工作，我们可以有效地使用 Apex 代码处理大量记录。\n\
  \n现在我们掌握了 Batch Apex，让我们探索使用 Lightning Platform 上的 Apex 进行异步操作。\n\n#### Asynchronous\
  \ Apex\n\nApex 代码可以使用批处理类以异步方式运行，并随后排队或调度。Apex 代码也可以通过在方法上使用 `@future` 注解来编写以在后台运行。所有\
  \ Apex Web 服务调用都是 `@future` 方法，具有 `callout=true` 参数，即它们被强制异步运行，在后台运行，用户界面操作不会因其调用而被阻塞。\n\
  \n另一种思考异步 Apex 的方式是它本质上在自己的时间执行。使用 `@future` 方法的好处是 governor limits 更高，这意味着 SOQL\
  \ 查询大小和堆大小限制更宽松，因为执行是在自己的时间、在自己的系统线程上进行。\n\n编写使用 `@future` 注解的 Apex 方法时，它们必须是静态的，并且只能返回\
  \ void 返回类型——即不返回任何内容。\n\n下面是一个最基本的异步 Apex 类示例：\n\n```apex\npublic class asyncClass\
  \ {\n    @future\n    public static void anAsyncMethod() { }\n}\n```\n\n现在我们了解了异步\
  \ Apex，让我们总结一下本章所涵盖的内容。\n\n#### Summary\n\n在本章中，我们探讨了 Salesforce 平台在数据操作方面的更具编程性的元素。我们在查看\
  \ Bulk API 之前先查看了 REST 和 SOAP API。然后，我们将注意力转向 Apex Database 类操作、Batch Apex，以及使用\
  \ `@future` 注解的异步 Apex。理解了这些概念后，您作为 Salesforce 数据架构师，现在已熟练掌握可对解决方案状态产生影响的编程行为的决策。\n\
  \n在下一章中，我们将通过实际示例探索更多关于如何缓解 **Large Data Volume (LDV)** 问题的概念，以及如何加载大量数据。\n\n####\
  \ Practice questions\n\n通过回答以下问题来测试您对本章所涵盖主题的了解：\n\n1. 适合 SOAP API 请求的唯一数据格式是什么？\n\
  2. Bulk API 用于哪两种作业类型？\n3. 用于描述可由调用应用程序导入的 SOAP API 提供的操作的资源类型是什么？\n4. Bulk API\
  \ Query 操作尝试多少次重试？\n5. 运行 Bulk API Ingest 操作时记录被分成什么批大小？\n6. Bulk API Ingest 作业支持哪些操作？\n\
  7. 编写 Apex 批处理类时扩展了什么接口？\n8. 异步 Apex 方法使用什么注解？\n9. Apex `insert` 语句，后跟特定对象类型的记录列表，是在处理\
  \ Salesforce 数据库时哪种类型方法的示例？\n10. Apex `Database` 类的 insert/update/upsert/delete\
  \ 方法有一个布尔参数，它的作用是什么？\n\n#### Answers\n\n以下是前面问题的答案。您能正确回答多少个？在此检查您对前面问题的答案：\n\n\
