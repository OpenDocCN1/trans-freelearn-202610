  \ Community Plus\n- 7. Customer Community Plus\n- 8. Partner Community\n- 9. Salesforce\
  \ Connect\n- 10. Batch Apex\n- 11. Bulk API\n- 12. Salesforce to Salesforce\n- 13.\
  \ 客户的360度视图\n- 14. 适用于Salesforce平台的Marketing Cloud连接器\n- 15. MuleSoft\n\n#### 延伸阅读\n\
