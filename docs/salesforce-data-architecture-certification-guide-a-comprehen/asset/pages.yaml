- pgno: 103
  md: '# Understanding Large Data Volumes


    While the Salesforce platform can cope with large amounts of data, some considerations
    apply to larger/massive amounts of data (referred to as **Large Data Volumes (LDV)**)
    and how performance on the platform is affected. This chapter covers LDV considerations
    and mitigations, as well as scalable data model design and data archiving strategies.


    In this chapter, we will cover the following topics:


    +   - Designing a scalable data model

    +   - LDV performance mitigation strategies

    +   - Data archiving strategies


    Unlike traditional applications that utilize a database, Salesforce stores all
    data in a few, large database tables. Therefore, traditional performance tuning
    techniques associated with databases don''t necessarily apply to the Salesforce
    platform. Instead, we, as data architects, must design our Salesforce implementations
    to handle large amounts of data. This is best achieved by understanding LDVs,
    their impact on Salesforce performance, and how impacts caused by LDVs can be
    mitigated. In this chapter, we''ll dive into some of the things that can affect
    performance and discuss their mitigation techniques.


    # Designing a scalable data model


    As Salesforce implementations grow in size and complexity, so does the volume
    of data. Salesforce, being a multi-tenant architecture, handles the scaling up
    automatically, but as the volume of data grows, the processing time for certain
    operations increases too.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Typically, two areas are affected by different data architectures or configurations
    on the Salesforce platform:


    +   - Loading or updating large amounts of records. This can be through the UI
    (directly) or with one or more integrations.

    +   - Extracting data, be it through reports or other views into the data or querying
    the data.


    Optimizing the data model generally involves doing the following:


    +   - Only hosting data that truly needs to reside on the Salesforce platform
    based on business purpose and intent

    +   - Deferring or temporarily disabling sharing change processing and other business
    rule logic when performing certain data operations

    +   - Choosing the best (most efficient) operation for a given task or job related
    to data


    Before we delve into how we can identify and mitigate based on LDV, it’s worth
    revisiting some of the theory behind how Salesforce organizes and queries data.


    In Chapter 2, Data Modeling and Database Design, we looked at how Salesforce doesn’t
    have physical database tables for each object in our instance of Salesforce, but
    instead virtualizes storage of standard and custom object fields based on a few
    (very) large physical database tables.


    Instead of managing the changing data structures for each customer’s Salesforce
    instance on its multi-tenant platform, Salesforce uses this virtualization technique.
    Traditional performance tuning techniques associated with databases don’t necessarily
    apply to the Salesforce platform, because the underlying data structure for your
    Salesforce instance is different from the perceived data structure presented to
    your users and admins. Account and Contact are perceived as two distinct data
    entities, which would be separate tables in a traditional Relational Database
    Management System (RDBMS). However, in Salesforce, they are virtualized from large
    tables shared with other Salesforce orgs on the same node, such as EU6. If you
    try to apply RDBMS performance-tuning techniques based on the virtualized data
    and schema of your Salesforce org, you won’t see the effect you expect on the
    actual, underlying data structures of your instance (or the Salesforce node for
    that matter). A full list of Salesforce nodes can be found at https://trust.salesforce.com.


    Now, let’s look at searching for data, understanding indexes, and how they affect
    search performance.


    # Searching for Salesforce data


    In a nutshell, searching is the act of querying two records based on free-form
    text (that is, putting a string into the search engine and having results returned).
    The Salesforce search architecture differs from where your object and record data
    are stored. It uses its own data store in the Salesforce application architecture,
    which is specifically designed for searching for free-form text. This is essentially
    how free-form text search operations are facilitated on the Salesforce Platform.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'As a Salesforce Data Architect, you may already be familiar with the various
    ways in which search capabilities are surfaced to the users of your instance.
    Salesforce provides search capabilities in several places throughout the application,
    including the following:


    +   - Global Search

    +   - Advanced Search

    +   - Lookup fields

    +   - Duplicate processing (based on matching rules)

    +   - Knowledge Base

    +   - Suggested Solutions

    +   - Web2Lead

    +   - Web2Case

    +   - Salesforce Object Search Language (SOSL), used with Apex and via an Application
    Programming Interface (API)


    Let’s look at indexing data, and how Salesforce uses those indexes when performing
    searches.


    # Indexing data


    To search for data in Salesforce, the data must be indexed. Salesforce has a separate
    set of search indexing servers for **indexing** operations that, when new or modified
    data events occur, generate and process queue entries for the indexing operations.
    Therefore, search indexing is an asynchronous operation. Salesforce suggests (according
    to https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_concepts_search_architecture.htm)
    that it could take 15 minutes (or even longer, depending on how much data has
    been created or modified) for the text being indexed to become searchable.


    # How Salesforce performs indexed searches


    When a user runs a search through the UI, the API, or through an action requiring
    a search to be invoked using Apex code, Salesforce will search the indexes that
    have been created for the appropriate records. Taking those results, Salesforce
    will then apply access permissions, search limits, and any other filters or filter
    logic to narrow down the results into a *result set*. This will typically contain
    the most relevant results for the user or operation invoking the search. When
    the *result set* reaches a pre-determined size, as specified internally by the
    Salesforce query optimizer, the remaining records from the search results are
    discarded. The *result set* is then used to invoke the actual database query to
    return the records that the user will see, or the operation will return to a calling
    process (in the case of a record search invoked by the Salesforce API or through
    Apex code).'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Now that we have seen how Salesforce queries data, let’s look at how operations
    related to records can be affected by too many child records of a single parent
    record, otherwise known as data skew.


    # Data skew and its impacts on performance


    When thinking about and designing a record ownership strategy in Salesforce, always
    keep the number 10,000 at the front of your mind. When more than 10,000 child
    records belong to the same parent record in Salesforce, an issue known as data
    skew arises.


    Data skew comes in three not-so-delicious flavors:


    +   - Account data skew

    +   - Ownership skew

    +   - Lookup skew


    We’ll explore each type of data skew in more detail shortly but remember that
    if you design a data strategy that facilitates distributing record ownership so
    that no one record is the parent for more than 10,000 child records, then you
    don’t have to worry about data skew affecting the users of your Salesforce instance.


    # Account data skew


    Certain Salesforce standard objects, including the Account and Opportunity objects,
    have a special data relationship that maintains parent and child record access
    under a private sharing model. Account data skew is where one account has too
    many child records. Therefore, when thinking about your account record ownership
    strategy, think about distributing records appropriately. Don’t create a generic
    unassigned or bucket parent account record and think that will be enough as when
    the magic 10,000 child record number is reached, your users won’t be happy. Two
    main issues occur when account data skew makes its presence known, namely record
    locking issues and sharing issues.


    Think about updating a lot of child records that belong to the same account (such
    as contacts or opportunities). Because Salesforce maintains integrity in the database,
    it will lock both the record being updated and the parent account when updates
    are made to the child record. When updating lots of records that all are children
    of the same account, those locks can result in errors, where one record update
    has locked the parent account. This means that other child record updates may
    not occur and your users will be presented with an error instead. Not good.


    Now, let’s turn our attention to sharing issues that may occur when changing the
    sharing of either the parent account or the child record. Because Salesforce will
    re-calculate access to either the parent account or the child records, this sharing
    re-calculation will take time. Guess what? Those records will all be locked during
    that sharing re-calculation too. When we factor in recalculations that consider
    role hierarchy and sharing rules, these locks can be in place for longer than
    anticipated and cause errors to be returned to users.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Ownership skew


    In situations where lots of records (think of our magic number 10,000) of the
    same object type (such as Contact) are owned by a single user, this causes a performance
    issue known as ownership skew. Every record in Salesforce is required to have
    an owner (due to the ownership-based data model), so this can cause performance
    issues when sharing calculations are required to manage the visibility of all
    of those records owned by the same user. Again, this is another reason to try
    and plan to avoid generic single-unassigned or bucket parent records as much as
    possible.


    When the user causing the ownership skew exists in the role hierarchy, operations
    such as record deletes or record ownership changes require the Salesforce platform
    to remove the sharing of the record from the (skew-causing) owner and all parent
    users of the owner, as specified within the role hierarchy, and then finally from
    all users given access by sharing rules. Record ownership changes are already
    considered a costly operation in that they lock records and take a lot of time
    while sharing is recalculated. Ownership skew exacerbates that process.


    Where ownership skew can’t be avoided, Salesforce suggests not giving that user
    a role. This way, the role hierarchy is effectively removed from any sharing or
    permissions calculations, meaning performance is less affected as a result when
    performing these operations.


    # Lookup skew


    Lookup field types in Salesforce should be thought of as akin to foreign key relationships
    between objects. Every time a user inserts or updates a record, the Salesforce
    platform locks the records that are referenced by each lookup field on that record
    (for example, a parent account for a Contact record being created or updated).
    By locking the referenced records, Salesforce ensures that when the inserted or
    updated data for the record is committed to the database, the referential integrity
    between those records is maintained. Therefore, 10,000 records or more looking
    up to a single record can slow things down or cause errors due to contention where
    Salesforce is locking records to maintain database integrity.


    Since lookup skew is harder to spot, it’s easier to plan to distribute records
    appropriately to avoid more than 10,000 child records looking up to a single parent
    to avoid lookup skew in the first place.


    With data skew and its impact on performance now covered, let’s turn our attention
    to data virtualization.


    # Data virtualization


    A key question data architects should be asking themselves is, do I need to store
    this data in Salesforce?


    While Salesforce provides a scalable architecture to allow your users to access
    the data they need to perform their business activities, access to constantly
    changing or large amounts of data can be served by allowing Salesforce to present
    data held on an external system to users as and when they need it. Think bank
    account transactions, line items from an ERP, or customer-purchase transactions.
    This technique is known as data virtualization.'
  merge: -1
  img_proc: true
