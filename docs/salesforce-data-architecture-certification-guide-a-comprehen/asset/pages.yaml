- pgno: 157
  md: '# 10


    # Tuning Performance


    In this chapter, we’ll cover the various methods available to tune performance
    when designing Salesforce applications on Lightning Platform. We’ll revisit several
    concepts we’ve already looked at, diving a little deeper into some scenarios to
    demonstrate the practical application of the techniques highlighted. By the end
    of this chapter, you’ll know of the various performance tuning techniques available
    when designing scalable solutions on the Salesforce Platform, with particular
    regard to data performance.


    In this chapter, we’ll cover the following topics:


    +   - Skinny tables and other **Large Data Volume (LDV)** mitigation techniques

    +   - Query and search optimization

    +   - Task locks

    +   - **Primary Key (PK)** chunking to improve performance

    +   - Loading massive amounts of data


    We’ll begin by looking at LDV mitigation techniques and tuning our Salesforce
    implementations when working with massive amounts of data.


    # Skinny tables and other LDV mitigation techniques


    **Skinny tables** are an LDV mitigation technique that is useful when users experience
    slow read operations for queries against the Salesforce database. This is since
    the underlying (virtual) database schema for a standard object is actually a join
    across two tables. There are standard object standard fields and standard object
    custom fields. For example, a query for data from a standard object such as Account
    that includes both standard and custom fields of the Account object may benefit
    from skinny tables when performance is impacted.'
  merge: -1
  img_proc: true
