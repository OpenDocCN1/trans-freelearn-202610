- pgno: 42
  md: '# Manual sharing


    In bespoke sharing scenarios not covered by the mechanisms we''ve covered already,
    manual sharing exists to provide a facility to manually share a record, granting
    read and edit permissions, with users who don''t have access to the record. Manual
    sharing, as the name implies, is a user-driven process that involves clicks in
    the Salesforce user interface to grant record access to other users. It is possible
    to create manual shares programmatically (for more information, see the dedicated
    subsection on *Programmatic sharing*).


    Sharing a record with another user creates a share record in the Salesforce database.
    Programmatic solutions will need to manage record shares for share reasons other
    than *manual share*. Programmatic shares with a *manual share* row cause can be
    maintained using the **Share** button on the record, much like the out-of-the-box
    share button functionality.


    # When Manual Shares Cease to Work


    If a record owner of a shared record changes, then the manual share is removed.
    If the sharing doesn''t open up access beyond what is set in the OWD for that
    object, the share isn''t created in the first place. Both of these statements
    are also true in programmatic scenarios.


    # Team access


    Accounts, opportunities, and cases have a *teams* record-sharing concept, whereby
    groups of users can work collaboratively on accounts, opportunities, or cases.
    The record owner, someone higher in the role hierarchy (who therefore inherits
    the same level of record access), or administrators can add people to a team to
    work collaboratively on a record or modify the access level (say, from read-only
    to read/write).


    Teams are generally used to give specific users in Salesforce an elevated level
    of access to a record so that they can work collaboratively on an account, opportunity,
    or case. For example, if a user already has write access to a particular account
    record, adding them as read/write in the account team for that record has no effect.


    Creating a team against an account, opportunity, or case record creates a team
    record and an associated share record in the Salesforce database. Programmatic
    solutions will have to maintain both of these records. See the dedicated subsection
    for more information on programmatic sharing.


    # What About Multiple Teams Accessing One Record?


    If multiple teams are required to access a particular record, then territory management
    or programmatic sharing may be more suitable. There is only one team per account,
    opportunity, or case, and therefore the concept of multiple teams against a single
    record is not supported.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Territory hierarchy access


    It is possible to create a hierarchy to represent your organization''s sales territories.
    This essentially facilitates automatic account assignment based on criteria to
    denote it belonging to a particular branch of the territory model. Chapter 12,
    Territory Management, covers territory management in further detail.


    # Programmatic sharing


    Using what used to be known as Apex managed sharing, programmatic sharing allows
    the use of code to build sharing settings when data access requirements cannot
    be fulfilled using any of the means described in the preceding sections. Code-based
    sharing solutions can be quite fancy and sophisticated, but equally require careful
    management, and therefore it is important to understand how programmatic sharing
    works before embarking on a code-based sharing solution.


    Each object in Salesforce has an associated share object. This has two naming
    conventions (one for standard objects and another for custom objects). For standard
    objects, the associated share object is named objectShare, such as AccountShare,
    CaseShare, and so on. For custom objects, the associated share objects are named
    using a format similar to object__Share. In the example of a custom object called
    MyObject__c, the associated share object is called MyObject__Share.


    Objects that are on the detail side of a master-detail relationship don''t have
    an associated share object because access to the object on the Master side of
    the relationship grants implicit access to the object on the detail side. Custom
    objects that have a Public Read/Write OWD also do not have an associated share
    object.


    When programmatically sharing a record using code, the associated share object
    requires an entry with a row cause to essentially store the reason the sharing
    has taken place. Sharing a record with a user through the Salesforce UI creates
    an entry in the associated share object with a row cause of manual share. Programmatic
    sharing can create entries with using the manual share row cause, but custom row
    cause values can be used. The values in a share object entry are as follows:


    +   - ParentID: ID of the record being shared. This value cannot be changed once
    the row is created.

    +   - RowCause: As explained in the previous paragraph, this is the reason why
    the record is being shared. This can be manual sharing to simulate the Share button
    in the Salesforce UI being pressed, or a custom reason can be used. Custom sharing
    reasons need to be created in the Salesforce UI before they can be used. Objects
    have an Apex sharing reasons related list in the Management Settings of the object
    in Salesforce Setup.

    +   - UserOrGroupId: The Salesforce ID of the user or group that the record is
    being shared with.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   - `objectAccessLevel`: The level of access being granted as part of the
    share. The name of the property is the share object name of which the record is
    being shared followed by AccessLevel. For example, `CaseShareAccessLevel`. Values
    can be edit, or read, or edit or read-only access, respectively.


    > **A Note on Records Shared Programmatically with Manual Share Row Causes**

    > When records that are shared with row causes of *manual share* (both programmatically
    and through the UI) change owner, any manual share row cause records are removed
    from the associated share object. Custom row shares are persisted when a shared
    records owner changes.


    # Restriction rules


    Generally available as of the Winter ''22 release, restriction rules can be used
    to control the records a specific user group is allowed to see. As per the documentation
    for creating a restriction rule (https://help.salesforce.com/s/articleView?id=sf.security_restriction_rule_create.htm&type=5),
    *When a restriction rule is applied to a user, the data that the user has access
    to via org-wide defaults, sharing rules, and other sharing mechanisms is filtered
    by the record criteria that you specify.*


    At the time of writing, restriction rules are available for the following objects:


    +   - Custom objects

    +   - Contracts

    +   - Events

    +   - Tasks

    +   - Time sheets

    +   - Time sheet entries


    Up to two restriction rules can be created per supported object in the Enterprise
    and Developer editions, and up to five restriction rules per supported object
    in the Performance and Unlimited editions.


    Now that we have an understanding of sharing and security on the Salesforce platform
    and how it affects data access, we can now look at each Salesforce object type.


    # Exploring standard, custom, external, and big objects


    Salesforce objects can broadly fit into one of four types. While you will no doubt
    have worked with the standard and custom object functionality available on the
    platform, it is necessary to understand how they work at a lower level to truly
    understand what it means to issue SOQL queries against those object types and
    how it affects performance. Secondly, you may not have worked with external objects'
