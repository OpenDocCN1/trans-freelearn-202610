    \ and standard fields don't have a special suffix and therefore are represented\
    \ as Account (in the example of a standard object name) and Name (in the example\
    \ of a standard field name) when issuing SOQL queries. Here's an example:\n\n\
    ```\n```sql\nSELECT Name FROM Account\n```\n```\n\nWithout any customization,\
