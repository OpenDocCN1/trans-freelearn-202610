- pgno: 146
  md: 'Congratulations! You’ve called a Salesforce API by issuing a query (a request)
    and have a list of Account records returned with their Name field against each
    (the response).


    Let’s begin by exploring the Lightning Platform Data APIs.


    # Lightning Platform Data APIs


    There are 11 APIs available on the Salesforce Lightning Platform that cover all
    sorts of operations, including working with metadata (the Metadata API), building
    user interfaces that let users interact with Salesforce records (the User Interface
    API), and for use when building custom development modules or applications (the
    Tooling API).


    I appreciate that not everyone reading this book will be a software engineer and
    therefore understand the intricacies of how APIs work. However, understanding
    how Salesforce programmatically exposes data-related operations is necessary.
    This will give you a more complete understanding of how data can be affected by
    operations on the Salesforce platform outside of general user interface interaction.


    In a nutshell, an API provides a means by which two software applications can
    talk to each other. Typically, one of the applications exposes a select set of
    operations that other applications can invoke. APIs also support authentication,
    and Salesforce is no exception. Before invoking operations with a Salesforce API,
    it is a requirement to authenticate (programmatically) to Salesforce. As is the
    case for users interacting with Salesforce using the user interface, all API operations
    are done as a user, and therefore it is subject to the same permission model as
    other users. I’ve seen specific *Integration User* accounts set up for this purpose.
    The upshot of the same permission model applying to user accounts used by other
    software tooling means that the same permission facilities (Organization-Wide
    Defaults, Role Hierarchy, Profiles, Permission Sets, Sharing Rules, Manual Sharing,
    and so on) can be used to ensure that only the appropriate data is accessible.


    In the following subsections, we’re going to focus on the following APIs because
    they allow us to work with data on the Salesforce platform:


    +   - REST API

    +   - SOAP API

    +   - Bulk API


    Let’s cover each of these Salesforce APIs in turn, starting with the REST API.


    # REST API


    In the same vein as the **Simple Object Access Protocol (SOAP)** API, the Salesforce
    **Representational State Transfer (REST)** API provides a programmatic interface
    for interacting with Salesforce. Because REST is a more lightweight framework
    in terms of the size of data packets going backward and forward to Salesforce,
    it is preferred for mobile applications.'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# Important note\n\nREST involves utilizing a standard set of HTTP methods\
    \ for getting data or pushing data to and from an endpoint. REST API calls are\
    \ stateless, in that each call is treated as a discrete operation. REST supports\
    \ JSON or XML for the payload format.\n\nSOAP is a bit more heavyweight than REST\
    \ but allows for more flexibility in determining the methods to be called when\
    \ invoking operations on a particular endpoint. SOAP API calls are stateful in\
    \ that the state of the operation or data is passed backward and forward each\
    \ time. SOAP uses XML for the payload format.\n\nSalesforce provides the same\
    \ underlying data model and the same governor limits apply to operations, irrespective\
    \ of being called using the REST or SOAP API.\n\nUsing the REST API, Salesforce\
    \ data queries can be invoked as part of a request to the query endpoint, where\
    \ the SOQL query can be passed as part of the request. For example, invoking a\
    \ GET operation on the following endpoint would return all Account record Name\
    \ values, in accordance with the REST API specification: https://login.salesforce.com/services/data/v54.0/query?q=SELECT+Name+FROM+Account.\n\
    \nTo create a record, invoke a POST operation on the endpoint for the object you\
    \ are creating the record for (such as /services/data/v20.0/sobjects/Account/,\
    \ with a payload of field name and value mappings). This could look as follows:\n\
    \n```\n{\n  \"Name\": \"Packt\",\n  \"Industry\": \"Publishing\"\n}\n```\n\nIt\
    \ is worth noting that the Salesforce REST API is stateless, in that the calling\
    \ application needs to have all of the information necessary in the request to\
    \ Salesforce for Salesforce to understand how to process that request. If you\
    \ develop with the Salesforce REST API, you’ll quickly notice that it works using\
    \ generic HTTP methods (GET, POST, and so on), and therefore all resources and\
    \ operations are accessed using a generic interface.\n\nThe REST API supports\
    \ authentication to Salesforce using the OAuth 2.0 protocol, which is a well-documented\
    \ method for authenticating RESTful applications to Salesforce.\n\nNow that we’ve\
    \ been introduced to the REST API, let’s explore the relatively similar SOAP API."
  merge: -1
  img_proc: true
- pgno: 148
  md: "# SOAP API\n\nThe SOAP API works similarly to the REST API in that you can\
    \ work with object data using web service calls. The SOAP API is not as lightweight\
    \ in use as the REST API as state is transferred backward and forward with each\
    \ request and response. SOAP web service calls must use XML as the payload data\
    \ format and can be used by any programming language that supports web services.\n\
    \nSOAP web services are defined by consuming a Web Service Description Language\
    \ (WSDL) file, which describes the methods available to be executed, any parameters,\
    \ and example requests and responses to calls to those operations. The WSDL for\
    \ your Salesforce instance can be downloaded from Setup and typing API in the\
    \ search box, then selecting the API menu item returned. Then, you can download\
    \ one of two WSDL files:\n\n+   1. Enterprise WSDL: This is specific to your Salesforce\
    \ instance and takes the customizations you have made into account (such as the\
    \ creation of custom objects).\n+   2. Partner WSDL: This is a WSDL file that\
    \ works using generic types (all objects are interacted with through Object operations,\
    \ rather than operating directly on an Account entity, Contact entity, and so\
    \ on).\n\nWhen working with the SOAP API, you’ll first invoke an operation to\
    \ log in to Salesforce as the user under whom you wish to execute the operations,\
    \ which generates a session identifier. This session identifier is then used in\
    \ all subsequent requests.\n\nTaking our example of creating an Account record\
    \ from the REST API section of this chapter, a SOAP representation would look\
    \ as follows (it’s assumed that the login operation has been done):\n\n```\n<soapenv:Envelope\
    \ xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:urn=\"urn:enterprise.soap.sforce.com\"\
    \ xmlns:urn1=\"urn:sobject.enterprise.soap.sforce.com\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    >\n    <soapenv:Header>\n        <urn:SessionHeader>\n            <urn:sessionId>[sessionId\
    \ retrieved from a login() call]</urn:sessionId>\n        </urn:SessionHeader>\n\
    \    </soapenv:Header>\n    <soapenv:Body>\n        <urn:create>\n           \
    \ <urn:sObjects xsi:type=\"urn1:Account\">\n                <Name>Packt</Name>\n\
    <Industry>Publishing</Industry>\n            </urn:sObjects>\n```"
  merge: -1
  img_proc: true
- pgno: 149
  md: '```

    </urn:create>

    </soapenv:Body>

    </soapenv:Envelope>

    ```


    As you can see, compared to the REST example, the SOAP API call is a lot more
    descriptive. The <urn:create> tag specifies that this is a SOQL insert operation,
    the <urn:sObjects xsi:type="urn1:Account"> tag specifies that this is an Account
    object, and then the child tags specify the fields. The REST API, by POSTing to
    an Account endpoint, assumes the same thing.


    While this section has been technical, the SOAP and REST APIs have parity in terms
    of database operations. The difference is in the way they are interacted with.
    Suffice it to say, database operations can be executed programmatically. Given
    that all operations run under the context of a user, then the Salesforce permission
    model applies.


    With the SOAP API now covered, let’s look at the Bulk API.


    # Bulk API


    The Salesforce Bulk API is used for two main purposes: to ingest and query. To
    simplify those terms, you can use the Bulk API to perform insert, update, upsert,
    or delete operations (ingest), or you can retrieve data (query). The key reason
    the Bulk API is used is due to the size of the data being ingested or queried.
    Any operation that involves more than 2,000 records is a suitable candidate for
    the Bulk API.


    When performing an ingest operation, the Bulk API divides the operation into a
    set of smaller batches to improve performance. When starting an ingestion batch
    job, first, you must create a CSV file that represents the records to process
    (much like you’d use with Salesforce Data Loader). The job specifies what the
    operation is (insert, update, upsert, or delete), and the object to operate on,
    such as Account or Contact. When you start the job, Salesforce will take care
    of optimizing the job to reduce the likelihood of performance issues, timeouts,
    and batch failures.


    When performing a query operation, the Bulk API will return the records as per
    the specified query. Again, Salesforce will optimize the job for performance and
    reduce the likelihood of timeouts or failures as much as possible.


    When performing an ingest job, Salesforce will divide the data into batches for
    every 10,000 records (there is a daily limit of 150 million records). Salesforce
    attempts to process each record in a batch, but if a batch doesn’t complete within
    10 minutes, the batch fails. Salesforce will retry any failed batches up to 10
    times. If a batch still fails after 10 retries, the whole batch job is marked
    as failed. In this scenario, you’d use the results returned from calling either
    the Failed Record Results or Unprocessed Record Results endpoints of the Bulk
    API to retrieve those records that were not processed and start a new job using
    those, after correcting any errors or issues first.'
