- pgno: 131
  md: '# Accounts and Contacts


    Two of the core objects in core platform clouds (such as Sales Cloud and Service
    Cloud) are Account and Contact. These two objects deserve a chapter of their own
    to describe the special behavior that the Salesforce platform gives to them.


    In this chapter, we will cover the Account and Contact model, including Person
    Accounts and the Contacts to multiple Accounts enablement implications, Account
    Skew, and the implications this has on the performance of queries and reports.
    We’ll also look at the objects in the standard Salesforce data model that are
    associated with Accounts and Contacts.


    By the end of this chapter, you’ll understand the Account and Contact data model,
    including what happens when personal accounts are enabled. You’ll also understand
    the implications and considerations for enabling the Contacts to multiple Accounts
    feature. Furthermore, you’ll understand the objects that are associated with Account
    and Contact. Lastly, you’ll understand Account Skew in terms of what it is and
    how it impacts your users.


    In this chapter, we will cover the following topics:


    +   - Understanding the Account and Contact model

    +   - Introducing person accounts

    +   - Exploring the Contacts to multiple Accounts feature

    +   - Exploring objects associated with Accounts and Contacts

    +   - Putting it all together

    +   - Revisiting Account Skew


    # Understanding the Account and Contact model


    The **Account** object is at the heart of many Salesforce core platform cloud
    products, such as Sales Cloud, Service Cloud, Financial Services Cloud, and Experience
    Cloud. The **Contact** object represents a person that is associated with an Account
    record.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'At its most basic interpretation, an **Account record** represents a company
    or similar entity from which one or more Contact records can be associated, such
    as employees. Therefore, an Account record can be thought of as a company or business.
    An Account record can have many Contact records, representing the employees of
    that company or business.


    Let’s look at how this simple structure is represented diagrammatically:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_132_0.png)


    Figure 8.1 – Simplified Account and Contact object relationship


    As you would expect with Salesforce originally being focused on sales teams/selling
    (hence the company name), the Account object contains many useful standard fields
    that can be utilized with minimal customization.


    These standard fields include the following:


    +   - **Industry**: A picklist of industries the account may belong to, such as
    agriculture or transport

    +   - **Shipping address**: The mailing address

    +   - **Billing address**: Where invoices and paperwork are sent

    +   - **Number of employees**

    +   - **Ownership**: Denoting if the company ownership structure is private, public,
    limited, and so on

    +   - **Standard Industry Classification (SIC)** code

    +   - **Ticker symbol**: The public stock ticker trading code – for example, **Customer
    Relationship Management (CRM)** for Salesforce as it trades under the CRM symbol

    +   - **Website**: The website’s address'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Other standard fields are available, which you can find out more about in the
    Account object documentation available at https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_account.htm.


    Now that we understand the Account object, let’s explore Account Hierarchies.


    # Account Hierarchies


    Account records can also have parent Accounts, representing hierarchies of companies.
    For example, you may have a company called *MadeUp* that has Account records for
    MadeUp Incorporated (the global group entity), MadeUp North America, MadeUp **Europe,
    Middle East, and Africa** (EMEA), and country-specific Account records for the
    MadeUp entity for that country.


    Let’s visualize our Account Hierarchy with the following diagram:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_133_0.png)


    Figure 8.2 – An Account Hierarchy visualized


    Account Hierarchies can be achieved by having an Account record with its ParentId
    field populated with the parent Account record’s Salesforce ID. This is a standard
    field that requires no feature enablement or customization.


    Having looked at the business view of Accounts and Contacts, let’s look at Person
    Accounts.'
  merge: -1
  img_proc: true
- pgno: 134
  md: "# # Introducing Person Accounts\n\nIn the business view of Accounts and Contacts,\
    \ where an Account is a company and a Contact is an employee of that company,\
    \ the business deals (Opportunities) are related to the Account record. When selling\
    \ to individual people, such as a banking client in the case of a Financial Services\
    \ Cloud implementation, we need to associate Opportunities with those people as\
    \ if they were Account records. This is where the Person Account concept comes\
    \ in.\n\nA **Person Account** is a special type of Account record that pulls through\
    \ some, but not all, information of a single associated Contact record onto it.\
    \ This allows the information about the person (from the associated Contact information)\
    \ to be represented when associating a business deal (Opportunity) with that person.\
    \ The Opportunity is still associated with the Account record to form the Person\
    \ Account.\n\nWhen enabling a Person Account, the Account and Contact **Organization-Wide\
    \ Defaults (OWDs)** need to be set to Private or Contact needs to be set to Controlled\
    \ by Parent. When enabled, a Person Account record type is available for use.\
    \ Other Person Account record types can then be created as needed for page layout/profile\
    \ assignment and other features necessary for the correct experience for your\
    \ users.\n\nTo enable Person Accounts, a case needs to be raised with Salesforce\
    \ Support. When enabled, Person Accounts cannot be disabled. Additionally, this\
    \ has a permanent effect on the sharing model. Given that when you enable Person\
    \ Accounts a prerequisite is to set the OWD of Contact to be either Controlled\
    \ By Parent or Private, consider the permanent effects of enabling such a far-reaching\
    \ sharing setting. Contacts that do not form part of a Person Account will need\
    \ to be shared explicitly with users following the other sharing features of Salesforce,\
    \ such as Role Hierarchy and Sharing Rules.\n\n> **Important note**\n> \n> It\
    \ is possible to have Person Accounts enabled and use Account and Contact records\
    \ as before. Taking the example of a bank with Financial Services Cloud that requires\
    \ Person Accounts to be enabled, the bank can create Opportunities against both\
    \ companies and individual people, as represented by their Account and Person\
    \ Account records, respectively.\n\nWhen using Person Accounts, consider that\
    \ Leads (which represent people) are not converted into a separate Account, Contact,\
    \ or Opportunity. Instead, you must convert the Lead into a Person Account and\
    \ an Opportunity.\n\nAdditionally, the Parent Account field won’t be present on\
    \ the Person Account, as you can’t represent Account Hierarchies using Person\
    \ Accounts. When diagramming and visualizing Person Accounts, I prefer to draw\
    \ a dashed box around the combined Account and Contact, as shown in the following\
    \ diagram:"
  merge: -1
  img_proc: true
- pgno: 135
  md: "![](img/7cca8452e237cf62a2d0e00a080d3fe9_135_0.png)\n\nFigure 8.3 – A diagrammatic\
    \ representation of a Person Account\n\nNow that we’ve covered Person Accounts,\
    \ let’s learn how to associate a Contact record with more than one Account record\
    \ in Salesforce.\n\n# Exploring the Contacts to multiple Accounts feature\n\n\
    As you would expect, the Contacts to multiple Accounts feature allows a Contact\
    \ record to be associated with more than one Account record. When Contacts to\
    \ multiple Accounts is enabled, Contact records essentially have a primary Account\
    \ record relationship and zero or more indirect Account relationships.\n\n> **Important\
    \ note**\n> \n> Disabling the Contacts to multiple Accounts feature will effectively\
    \ delete all indirect Account relationships for your Contact records.\n\nWhen\
    \ enabled, the Account object’s standard Contacts-related list can be replaced\
    \ on page layouts with the **Related Contacts** list instead. Contact page layouts\
    \ can have the **Related Accounts** list added to them. Person Accounts can have\
    \ both related lists added to their page layouts.\n\n> **Important note**\n> \n\
    > By default, any activities associated with a Contact record will roll up to\
    \ the primary Account record for the contact. It is possible to disable this default\
    \ behavior by unselecting the **Roll up activities to a contact’s primary account**\
    \ option in **Activities Settings** in **Salesforce Setup**."
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Now, let’s explore the wider object model that surrounds the Account and Contact
    objects.


    # Exploring objects associated with Accounts and Contacts


    Despite having an explicit relationship between each other, where multiple Contact
    records can belong to the same Account, there are a couple of additional objects
    that allow for context to be given to the relationship between the records of
    these two objects.


    Now, let’s explore the various Account and Contact object associations, starting
    with AccountContactRelation.


    # AccountContactRelation


    We described the Contacts to multiple Accounts feature earlier in this chapter,
    thus covering how a single Contact record can be associated with more than one
    account. Well, the AccountContactRelation object is the underlying data model
    entity that facilitates this Salesforce feature.


    The AccountContactRelation object essentially acts as a junction object between
    Account and Contact. Some standard fields are used to provide context about the
    relationship a Contact has to an Account. These can include things such as Start/End
    dates for when the Contact relationship with the Account started and ended. They
    may also include the Roles they may play on the Account, where more than one can
    be selected. Other fields may include denoting information such as if the relationship
    is active, and if the relationship is to the Contacts primary account (using the
    IsDirect field).


    The underlying data model for this entity can be visualized as follows:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_136_0.png)


    Figure 8.4 – AccountContactRelation as it fits within the standard Salesforce
    data model (OWDs intentionally omitted)'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Now, let’s learn how to provide context to the relationship between related
    Accounts and Contacts.


    # AccountContactRole


    To represent the actual role that a particular Contact record plays against an
    Account record, such as Decision Maker, Buyer, and so on, the AccountContactRole
    object is a lightweight way of associating Contacts in a way that provides context.


    Imagine that you are a salesperson using Salesforce and are selling to a particular
    company (Account). Knowing who (the Contact records) does what (the AccountContactRole
    records) makes selling more targeted and helps ensure you can have the right conversations
    with the right people.


    The AccountContactRole object is a junction object, in that it contains lookups
    to the Account and Contact objects – that is, the AccountId and ContactID fields,
    respectively. As you’d expect, it is also the object that’s used to capture the
    role the Contact performs. This is represented by the Role field.


    This junction object can be represented in a data model with Account and Contact
    as follows:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_137_0.png)


    Figure 8.5 – AccountContactRole as it fits within the standard Salesforce data
    model (OWDs intentionally omitted)


    With the AccountContactRole object covered, let’s look at Account Teams.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Account Teams


    **Account Teams** represent the Salesforce users that play a role in the Account.
    For example, when selling to or serving an Account, you may have Salesforce users
    in your organization that are responsible for managing the relationship, being
    a point of escalation, and so on.


    Account teams provide a way of associating your Salesforce users to Accounts in
    addition to what’s offered by the sharing model that’s already been configured
    in Salesforce for your organization. For example, you may have a private Account,
    Contact, and Opportunity sharing model, as well as a Role Hierarchy set up, that
    has sales team members in the same place of that Role Hierarchy. By default, those
    users would not automatically have access to all Account records. They would need
    to be explicitly shared using a Sharing Rule or Manual Sharing, for example. Account
    teams provide a way of opening up access to Accounts and other objects (including
    Contact, Opportunity, and Case). This access can be specified on a per-Account
    Team Member basis.


    The Salesforce entity responsible for this functionality is called AccountTeamMember.
    As well as lookups to User and Account, this object provides AccountAccessLevel,
    CaseAccessLevel, ContactAccessLevel, and OpportunityAccessLevel picklist fields.
    These fields can have the None, Read, and Edit values and can be used to set the
    respective access level.


    > **Important note**

    > The AccessLevel picklist values must be set to values higher than the **Organization-Wide
    Defaults (OWDs)** for the respective object. For example, AccountAccessLevel must
    be set to **Edit** if the OWD provides Public Read-Only by default.


    A representation of the AccountTeamMember object in the data model is as follows:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_138_0.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Now that we’ve covered the associated objects around the core Account and Contact
    data model, let’s look at an example where we can bring everything in this chapter
    together.


    # Putting it all together


    Let’s put what we’ve learned throughout this chapter together using a practical
    example from the Account and Contact concepts we have covered in this chapter.


    Let’s imagine that there’s a fictitious bank that deals with both individuals
    and businesses (and therefore the people that work for that business). The fictitious
    bank has sales teams that deal with corporate clients, personal bankers that deal
    with non-corporate banking clients, and certain customer individuals who can be
    privy to the dealings of more than one company, such as a legal professional.
    Let’s imagine how the Account and Contact parts of the data model can be visualized:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_139_0.png)


    Here, we can see how several different relationship types between Accounts and
    Contacts can be achieved using the Person Accounts feature and three join objects.
    Our fictitious bank can deal with businesses using separate Account and Contact
    records (much like the out-of-the-box Salesforce functionality), or with individuals
    using Person Accounts.


    The roles that Contacts play in Accounts are represented using the AccountContactRole
    object, so multiple people can be dealt with by the same corporate client.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'For the requirement relating to legal professionals that deal with multiple
    companies, the `AccountContactRelation` object can be used.


    Lastly, the requirement for teams of users dealing with corporate clients is possible
    using the `AccountTeamMember` object.


    While the object model focuses purely on Accounts and Contacts (since no OWDs
    are included), it’s possible to see how several business requirements can be achieved
    in a straightforward manner using standard Salesforce objects.


    Now that we’ve covered an example that brings everything together, let’s revisit
    a performance issue that affects Accounts and Contacts: Account Skew.


    # Revisiting Account Skew


    As introduced in *Chapter 2, Data Modeling and Database Design*, **Account Skew**
    is the result of an Account record containing 10,000 or more child records. This
    causes performance and record locking issues.


    When updates are made to the child record of an Account, Salesforce locks the
    parent Account record to maintain record integrity in the database. Updating a
    large number of child records under the same Account record may cause issues since
    each of those child record operations will be trying to lock the parent’s Account
    record.


    Additionally, when updates are made to an Account record that affects sharing,
    such as a seemingly harmless action such as changing the record owner, then all
    sharing for that Account will have to be recalculated. This goes for all child
    records of the account. This can cause many inter-connected processes to fail
    since sharing rules, Role Hierarchy calculations, and other sharing operations
    will have to take place. If any of these operations lock a record or take too
    long, contention may occur.


    # Mitigating Account Skew


    The simple rule for mitigating Account Skew is to distribute child records across
    multiple parent Account records. Remember, 10,000 is the maximum advised number
    of child records for a particular account record before Account Skew may occur.


    With Account Skew revisited, let’s summarize what we’ve covered in this chapter.


    # Summary


    In this chapter, we dug deep into the Account and Contact model, understanding
    its position at the center of the wider data model for many core Salesforce cloud
    products. First, we looked at the nuances involved in enabling Person Accounts
    and looked at the Contacts to multiple Accounts feature. The wider data model
    that surrounds the Account and Contact objects was also explored. Finally, we
    revisited Account Skew to understand its importance in terms of performance.'
  merge: -1
