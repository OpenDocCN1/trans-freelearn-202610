- pgno: 154
  md: "Then, we can call this schedulable class using anonymous Apex:\n\n```\nSystem.schedule('Nightly\
    \ scheduledAppendAccountNameBatch Job', '0 0 1 * * ?', new scheduledAppendAccountNameBatch());\n\
    ```\n\nThis would cause our batch class to run every night at 1 A.M. By understanding\
    \ how the Apex code is invoked and how the batching of records facilitates us\
    \ working within governor limits, we can effectively process lots of records using\
    \ Apex code.\n\nWith batch Apex now under our belts, let’s explore asynchronous\
    \ operations using Apex on the Lightning Platform.\n\n# Asynchronous Apex\n\n\
    Apex code can be run in an asynchronous manner using batch classes, and subsequently\
    \ queued or scheduled. Apex code can also be written to run in the background\
    \ when it’s asynchronous by using the @future annotation on methods. All Apex\
    \ web service callouts are @future methods, with a callout=true parameter, in\
    \ that they are forced to run asynchronously, and in the background, user interface\
    \ operations are not held up by their invocation.\n\nAnother way to think about\
    \ asynchronous Apex is that it essentially executes in its own time. A bonus of\
    \ using @future methods is that the governor limits are higher, meaning SOQL query\
    \ size and heap size limits are more generous as the execution is in its own time,\
    \ on its own system thread.\n\nWhen writing Apex methods that are annotated using\
    \ @future, they must be static and only return a void return type – that is, return\
    \ nothing.\n\nHere’s an example of a bare-bones asynchronous Apex class:\n\n```\n\
    public class asyncClass {\n    @future\n    public static void anAsyncMethod()\
    \ { }\n}\n```\n\nWith asynchronous Apex now understood, let’s summarize what we’ve\
    \ covered in this chapter.\n\n# Summary\n\nIn this chapter, we explored the more\
    \ programmatic elements of the Salesforce platform when it comes to manipulating\
    \ data. We looked at the REST and SOAP APIs before looking at the Bulk API. Then,\
    \ we turned our attention to Apex Database class operations, batch Apex, and asynchronous\
    \ Apex using @future annotations. With these concepts understood, you, as a Salesforce\
    \ Data Architect, are now well versed to make decisions on programmatic behavior\
    \ affecting the state of a solution."
