- pgno: 109
  md: '# Custom indexes


    To speed up query performance, Salesforce supports the creation of **custom indexes**.
    Think of an index as a way of sorting records in an order that''s based on the
    parameters that form the index. By using a sorted index, record retrieval speed
    can be increased. Custom indexes are enabled by contacting **Salesforce Support**.
    Before considering doing so, it''s worth touching on which fields are automatically
    indexed by the Salesforce platform for most objects:


    +   - `RecordTypeId`

    +   - `Division`

    +   - `CreatedDate`

    +   - `Systemmodstamp (LastModifiedDate)`

    +   - `Name`

    +   - `Email (for Contact and Lead records)`

    +   - `Foreign key relationships (Lookup and Master-Detail)`

    +   - `The (unique) Salesforce record ID, which is the primary key for each object`


    > **Important note**

    > Custom indexes can be created on almost all types of fields, except for multi-select
    picklists, text areas (long or rich), non-deterministic formula fields, and encrypted
    text fields. External ID field types cause an index to be created on that field
    by default, but only Auto Number, Email, Number, and Text types are supported
    for the creation of external ID field types.


    Salesforce''s underlying database architecture makes the actual data table for
    custom fields unsuitable for traditional database indexing (because we''re essentially
    talking about a large single physical table that contains all the fields for the
    objects in your Salesforce instance). To overcome this indexing limitation, Salesforce
    creates a separate index table (for each Salesforce infrastructure node running
    the Salesforce application) that essentially contains a copy of the object field
    data in that node, along with information about the data types of the object fields.
    Salesforce then can (through its application layer) build and maintain a traditional
    database index on this separate index table. The index table places upper limits
    on the number of records that an indexed search can effectively return, as only
    those indexed records are considered to be returned to the process or the user
    issuing the query before defaulting to a much wider (and therefore less performant)
    non-indexed search.


    By default, the index tables do not include empty records (sometimes known as
    null records, although Salesforce support can enable custom indexes that contain
    null records if desired). If custom indexes are created on custom fields, then
    you must explicitly enable and rebuild the indexes to get the empty-value rows
    included in the index.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'It is also worth knowing that the Salesforce query optimizer (a feature of
    the Salesforce application layer) maintains a separate database table that contains
    statistics about the distribution of object and field data in each index. Salesforce’s
    query optimizer uses this table to perform pre-queries when an automated process,
    user, or report issues a query to determine whether using an index can speed up
    the query (and therefore increase performance).


    # Standard indexed fields


    Salesforce’s standard indexed fields are used when a SOQL query filter matches
    less than 30% of the first million returned records in the database and less than
    15% of additional records in the database, up to a total of 1 million records.


    For example, a standard index is used in the following cases:


    +   - When a SOQL query is issued against an object table with 2 million records,
    and the filter matches roughly 450,000 or fewer records (as 30% of 1 million is
    roughly 300,000 and 15% of the remaining 1 million is roughly 150,000)

    +   - When a SOQL query is issued against an object table with 5 million records,
    and the filter matches roughly 900,000 or fewer records (as 30% of 1 million is
    roughly 300,000 and 15% of the remaining 4 million is roughly 600,000)


    With standard indexed fields covered, let’s look at custom indexed fields and
    when they are used.


    # Custom indexed fields


    Unlike standard indexes, custom indexes are used when a SOQL query filter matches
    less than 10% of the total records, up to a maximum of 333,333 records.


    For example, a custom index is used in the following cases:


    +   - When a SOQL query is executed against an object table with 500,000 records,
    and the filter matches 50,000 or fewer records (as 10% of 500,000 is 50,000)

    +   - When a SOQL query is executed against an object table with 5 million records,
    and the filter matches 333,333 or fewer records (as 10% of 5 million is 500,000,
    yet the upper limit is 333,333 records so the value of 333,333 is used)


    For more information about some of the intricacies concerning indexes, see https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_infrastructure_indexes.htm.


    Now that you have understood indexing, let’s focus on a solution that helps us
    avoid joins in tables for optimizing read-based operations.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Skinny tables


    To speed up the performance of certain read-only operations on a single object,
    **skinny tables** can be created to avoid joins across the standard and custom
    fields. When skinny tables are enabled, they are used automatically where appropriate.
    You can''t create, access, or modify skinny tables directly since this is done
    by Salesforce Support. In essence, you work with them to define what the skinny
    table should contain when optimizing read-only queries to, say, accounts for specific
    fields. If the report, list view, or query you''re optimizing (and therefore getting
    the skinny table created for) changes (such as adding a new field to respond to
    business users needing an extra value in a report), you''ll need to contact Salesforce
    to update your skinny table definition.


    It''s also worth noting that skinny tables don''t contain soft-deleted records,
    so they won''t be available when queries are using the skinny table over the broader
    object data in the standard underlying tables.


    Read-only operations that reference only those fields defined in a skinny table
    won''t require an extra join across the standard and custom object field tables,
    and therefore they can perform better. According to Salesforce (at https://developer.salesforce.com/docs/atlas.en-us.salesforce_large_data_volumes_bp.meta/salesforce_large_data_volumes_bp/ldv_deployments_infrastructure_skinny_tables.htm),
    the use of skinny tables is best employed with Salesforce objects containing millions
    of data records to improve the performance of read-only operations on those records,
    such as executing reports and dashboards or list views.


    Skinny tables can be created on all custom objects and the following standard
    objects:


    +   - Account

    +   - Contact

    +   - Opportunity

    +   - Lead

    +   - Case


    Some other considerations apply to skinny tables. For example, skinny tables can
    contain a maximum of 100 columns, and they cannot contain fields from other objects.
    Think of them as optimized tables for read-only operations for a single object.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Let’s look at a visual example of a skinny table:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_112_0.png)


    Figure 6.1 – Example of a skinny table


    They are created to remove joins across standard and custom fields when issuing
    read-only queries to read data from a single object.


    # Selective filter conditions


    **Selective filter conditions** can be used in your **Salesforce Object Query
    Language (SOQL)** queries to improve performance. Within the Salesforce application
    logic, the Salesforce platform’s query optimizer feature makes this decision and
    determines the filter condition selectivity for an issued SOQL query (including
    those required for reports and list views) when queries are run.


    When dealing with relatively simple SOQL queries, you can easily determine whether
    a specific filter condition is selective by gathering statistics on it using several
    tools, but the humble **Developer Console Query Editor** will do just fine. After
    you apply an index to a selective field, queries with related filter conditions
    will perform more efficiently.


    By confirming that filter conditions in reports, SOQL, and list views are selective,
    then by applying indexes to those fields, the Lightning Platform query optimizer
    doesn’t have to perform full dataset scans when looking for target data. This
    means that the performance will be optimal in such use cases.


    # Divisions


    **Divisions** can be used to partition data and reduce the number of records returned
    by SOQL queries, therefore increasing performance for the user or process calling
    the query. Salesforce provides special support for partitioning data by divisions
    (which can be thought of as logical sections of data), but this needs to be specifically
    enabled by contacting Salesforce Customer Support.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Now that we’ve looked at LDV mitigation methods, let’s look at the various
    methods for archiving data. As we covered earlier in this chapter, optimally,
    we only have the right, relevant data on the platform. With that said, let’s explore
    the strategies for data archiving.


    # Data archiving strategies


    Just as we have data on Salesforce for our users, there are situations where data
    needs to be archived off the platform. This may be due to various reasons, such
    as regulatory compliance (where certain data needs to be retained), or to keep
    the optimum amount of data in the platform (such as only the data that is being
    used being kept on the platform, and automatically archiving data over a certain
    age). Luckily, various options are available for archiving Salesforce data, such
    as using on-platform solutions such as big objects or storing data off-platform
    in an external system or data warehouse. We’ll take a look at these options in
    the following subsections.


    # Big objects


    As covered in Chapter 2, Data Modeling and Database Design, **big objects** are
    used to store and manage huge amounts of data (up to 1 million records by default,
    though this can be scaled up at an additional cost to tens of millions or even
    billions of records).


    Big objects provide consistent performance no matter how many records are loaded
    into them, which is useful in auditing an archiving use case that big objects
    are suited to. Anything that requires consistent performance when working with
    hundreds of millions or billions of records is the use case that big objects are
    designed for.


    Big objects work using a separate, distributed database to the main Salesforce
    platform, and are not transactional. As a reminder, sharing isn’t supported on
    big objects other than object and field permissions. Additionally, this means
    that automation (for example, workflows, flows, and triggers) is not supported
    on big objects.


    # Data Loader


    The humble Salesforce Data Loader can be used for both importing and exporting
    data. This will be covered in more detail in the next chapter, Chapter 7, Data
    Migration, but for now, we know that the Salesforce Data Loader supports getting
    data in and out of Salesforce using two different modes, **Serial** and **Bulk**,
    which support different batch sizes and concurrency options. While Data Loader
    is generally a manually invoked tool, it can be used as a simple solution for
    archiving data by exporting Salesforce data as one or more CSV files that can
    be stored or ingested off-platform, such as on a local server, shared drive, or
    data warehousing tool.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# ETL


    **Extract, Transform, Load (ETL)** tools can be used to automate the archival
    of data using the Salesforce REST, Partner, and/or Bulk APIs. As part of a regular
    nightly job, an automated process or scheduled job from a middleware solution
    such as **MuleSoft** can run, whereby a query is issued to retrieve data that
    meets the archival criteria since the last successful run of the job. This data
    can then be saved to an offline data store or inserted into an **Enterprise Data
    Warehouse (EDW)**.


    # Summary


    In this chapter, we dug deep into the data architecture and its potential pitfalls
    and mitigation strategies. Understanding why data skew happens helps us design
    better parent/child record ownership strategies. Also, understanding the way Salesforce
    uses indexes ensures that we can create reports, list views, and build queries
    that work with the constraints of the multi-tenant architecture nature of the
    platform, not against them. Due to this, we looked at LDV issues and mitigation
    strategies, understanding how concepts such as selective filter conditions and
    skinny tables can be used to ensure we can work with our large amounts of data
    effectively.


    Next, we turned our attention to data archiving strategies and the various options
    we have at our disposal, ensuring that we are keeping to regulatory requirements
    for data retention and archival (if appropriate) and ensuring that we only use
    the data that is relevant to our users.


    In *Chapter 7, Data Migration*, we’re going to build upon our knowledge of how
    the data on the Salesforce platform is indexed and organized so that we can start
    building effective strategies to get data in and out of the platform.


    # Practice questions


    Test your knowledge of the topics covered in this chapter by answering the following
    questions:


    +   1. What does LDV stand for?

    +   2. Which type of Salesforce object is used to store 1 million or more records?

    +   3. One account that contains over 10,000 child records is known as what?

    +   4. More than 10,000 records looking up to a single parent record is known
    as what?

    +   5. Utilizing data hosted on an external system is a technique known as what?

    +   6. What can be used to partition data and reduce the number of records returned
    by SOQL queries and reports?

    +   7. What can be used to avoid joins within queries to data held within a single
    object and speed up read-only operations?

    +   8. More than 10,000 child records belonging to the same parent record is known
    as what?'
