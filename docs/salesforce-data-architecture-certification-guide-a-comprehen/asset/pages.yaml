- pgno: 165
  md: '# 11


    # Backup and Restore


    Whilst Salesforce is fabulous at providing a platform and underlying data facility
    for working with customer data and custom data, consideration should be paid to
    how data can be backed up from and restored to the Salesforce platform. We''re
    going to investigate the various methods available to perform both data backup
    and data restore operations.


    In this chapter, we''ll cover the following topics:


    +   - Methods for backing up and restoring data on the Salesforce Lightning Platform

    +   - AppExchange and external software that facilitates data backup and restoration


    Before we get into the contents of this chapter, let''s be clear that we''re going
    to investigate backing up and restoring both data and metadata. Metadata is data
    that describes data and is the format your customizations to the Salesforce platform
    take. Data is the actual data stored in your Salesforce org for customers and
    opportunities.


    Let''s begin our exploration of backup and restoration by investigating the methods
    available to us when working with data backup and restoration on the Salesforce
    platform.


    # Methods for backing up and restoring data on the Salesforce Lightning Platform


    Before we jump into methods for backing up and restoring data, let''s elaborate
    on the two data definitions we''re covering in this chapter, namely data and metadata,
    as both are interacted with differently when it comes to backup and restoration.
    Let''s start with metadata.'
  merge: -1
  img_proc: true
- pgno: 166
  md: "# Introduction to metadata\n\nMetadata is data that describes data. When we\
    \ think of an eXtensible Markup Language (XML) file, that essentially is a file\
    \ with data (the values) and metadata (the tags). For example, see the following:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<person>\n\
    \    <firstname>Aaron</firstname>\n    <lastname>Allport</lastname>\n</person>\n\
    ```\n\nThe code example shows a simple XML structure for a person with a first\
    \ name and last name. Here, we can use the metadata (the person and the firstname\
    \ and lastname tags) to infer that we are representing a person called Aaron Allport.\n\
    \nSalesforce represents the customizations to make to your instance as a set of\
    \ metadata files. For example, a public group XML is represented as follows:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Group xmlns=\"http://soap.sforce.com/2006/04/metadata\"\
    >\n    <doesIncludeBosses>true</doesIncludeBosses>\n    <fullName>Packt</fullName>\n\
    \    <name>Packt</name>\n</Group>\n```\n\nHere, we can infer from the XML that\
    \ there is a group called Packt that allows records shared with that group to\
    \ be shared with managers of group members.\n\nSalesforce represents the vast\
    \ majority of customizations as XML, and as such, they can easily be extracted\
    \ and stored.\n\nNow that we have covered how metadata is used to describe data,\
    \ and, indeed, its use for your customizations on the Salesforce platform, let's\
    \ now look at what data is.\n\n# What is data?\n\nIn the realm of Salesforce,\
    \ data is defined as the record data for the standard objects you have customized\
    \ and the custom objects you have created stored in your instance. Whereas the\
    \ metadata for the contact record may define a field for FirstName, the value\
    \ stored in that field for each record is the data of the record. When data is\
    \ imported or exported from the Salesforce platform, it is usually represented\
    \ in the Comma-Separated Value (CSV) format, where the first row of the file provides\
    \ the fields and the following rows are the data for each record (with each record\
    \ represented as a row in the file)."
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Other formats are possible using some transformation logic with middleware
    and the like. An example CSV file would look like the following for exporting
    a couple of *contact records*:


    ```

    Id,FirstName,LastName,Email

    003abcdefghi123456,Aaron,Allport,aaron@aaronallport.com

    003jklmnopqr789012,John,Smith,j.smith@example.com

    ```


    Having understood the difference between data and metadata, let’s question why
    we should back up data and metadata in the first place.


    # Why back up data and metadata?


    Let’s quickly touch upon why backing up data and metadata is important. First,
    Salesforce doesn’t automatically back up your data for you. Therefore, if there
    were to be a situation in which a user or automated process accidentally caused
    an unintentional loss of data from your Salesforce instance, it would make sense
    to have a copy of data from which a restore operation could take place. It’s considered
    good practice to take regular backups of your data in case of unexpected data
    loss or in case a data export is required for business operational reasons.


    Just like backing up your data is considered good practice, Salesforce offers
    the ability to back up your metadata, effectively allowing you to save most (but
    not all) of the configuration of your org. This is especially useful in the development
    of metadata changes from Salesforce sandbox environments, in addition to ensuring
    you keep a backup of your Salesforce environment configuration.


    Now we’ve covered some scenarios for backing up data, let’s explore the various
    methods to export and import data and metadata. We’ll begin with backing up data.


    # Backing up data


    Salesforce offers three platform-native ways to export your data. Whilst middleware
    can facilitate more advanced data retrieval and transformation, the relatively
    straightforward requirement to back up data can be facilitated using the following:


    +   - The Data Export service

    +   - Data Loader

    +   - Report Exports


    Let’s explore each of these in turn, starting with the Data Export service.'
  merge: -1
  img_proc: true
- pgno: 168
