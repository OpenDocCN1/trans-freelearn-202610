    # Practice questions


    +   1. The Public Read/Write/Transfer OWD is applicable to which objects?

    +   2. Performance issues related to an account record that has more than 10,000
    child records is known as what?

    +   3. What OWD is available for the campaign object that isn’t available to others?

    +   4. What type of Salesforce object is used to access data held in an external
