  md: 'We touched upon indexing when exploring LDV, so let’s recap that here:


    # Salesforce Query Optimizer – Standard Indexes


    30% of up to 1 Million Records + 15% of Additional Records over 1 Million, up
    to a total of 1 Million Records


    Examples:

    2 million records – 300,000 + 150,000 = 450,000 records

    6 million records – 300,000 + 700,000 = 1 Million records


    # Salesforce Query Optimizer – Custom Indexes


    10% of up to 1 Million Records + 5% of Additional Records over 1 Million, up to
    a total of 333,333 records


    Examples:

    2 million records – 100,000 + 50,000 = 150,000 records

    6 million records – 100,000 + 233,333 = 333,333 Million records


    Figure 14.10 – Salesforce Query Optimizer index thresholds


