- pgno: 150
  md: "Query jobs are naturally a lot simpler to manage, as the data is returned once\
    \ the job completes. If, however, a query job retries more than 15 times, it will\
    \ fail. The simplest workaround in this scenario is to apply filter criteria to\
    \ the query to improve performance and reduce the number of records that are returned.\n\
    \nNow that we’ve looked at the Bulk API, let’s look at Apex Database Operations\
    \ next.\n\n# Apex Database operations\n\nIn Apex code, it is possible to interact\
    \ with the Salesforce database in one of two ways: as Database Manipulation Language\
    \ (DML) statements or using Apex Database class methods. DML statements take the\
    \ form of insert, update, upsert, or delete operations. Take the following example\
    \ of a DML insert statement:\n\n```\npublic class dmlStatementTest {\n    public\
    \ void testStatement() {\n        List<Account> accounts;\n        accounts.add(new\
    \ Account(Name='Packt UK'));\n        accounts.add(new Account(Name='Packt India'));\n\
    \n        insert accounts;\n    }\n}\n```\n\nDatabase Apex methods work slightly\
    \ differently because rather than using a keyword such as insert or update, you\
    \ call a method of the Database class instead. I’d argue that this offers more\
    \ flexibility at the expense of more verbose code for the equivalent DML operation.\
    \ This is because the Database class methods allow for an argument to specify\
    \ whether to attempt partial record processing if errors are encountered. The\
    \ same example that we used previously but using the Apex Database class can be\
    \ represented as follows:\n\n```\npublic class apexDatabaseClassTest {\n    public\
    \ void testStatement() {\n        List<Account> accounts;\n        accounts.add(new\
    \ Account(Name='Packt UK'));\n        accounts.add(new Account(Name='Packt India'));\n\
    \n        Database.SaveResult[] accountSaveResult = Database.\ninsert(accounts,\
    \ false);\n        // You would iterate through the\n```"
  merge: -1
