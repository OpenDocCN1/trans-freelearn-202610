    up and restoring metadata and data.


    Next, we moved on to looking at AppExchange and external software that facilitates
    backup and restoration, covering what they do to facilitate and even speed up
    this task. Lastly, we looked at some best practices when exporting and importing
    data.


    In the next chapter, we’ll explore Territory Management to conclude our learning
    material.


