- pgno: 129
  md: '# Section 2:

    Salesforce Data

    Architect Design


    Turning our attention to the effective design of solutions on the Salesforce platform
    that focus on data, this part of the book covers topics regarding the core data
    model, the effective use of Apex, knowing what options exist to get data in and
    out of the platform, tuning for performance, and territory management. Much like
    the first part of this book, the topics outlined will become a handy reference
    in your day-to-day job as a Salesforce Data Architect.


    This section comprises the following chapters:


    +   - Chapter 8, Accounts and Contacts

    +   - Chapter 9, Data APIs and Apex

    +   - Chapter 10, Tuning Performance

    +   - Chapter 11, Backup and Restore

    +   - Chapter 12, Territory Management'
