- pgno: 234
  md: '# Taking the exam virtually


    As with taking the exam in person, we must register for it first:


    +   1. To do this, log in to Webassessor using your credentials (if you are not
    already logged in), and click the **Register for an exam** tab.

    +   2. Next, expand the **Architect Exams** section to access the exams that form
    the Salesforce architect exam curriculum.

    +   3. Expand the **Salesforce Certified Data Architect** section and click **Register**
    next to **Online Proctored**.

    +   4. You''ll then be presented with a list of available virtually proctored
    dates and times. Check the checkbox next to an appropriate test center and click
    **Select**.

    +   5. Next, choose a date and time. Check the checkbox to acknowledge that you''ve
    read the text in the textbox and click **Select**.

    +   6. If you have a voucher code, enter it into the payment screen – otherwise,
    go to **Check Out** and pay using an accepted payment method. Your exam is now
    booked.


    In order to prepare for the exam, you''ll be required to create biometric identification
    on your laptop and download a piece of software called **Sentinel**. Instructions
    for doing this will be in the confirmation email you receive when the exam is
    booked.


    When it comes to exam time, be sure to find a room that you will not be disturbed
    in, is free from noise, and doesn''t contain any notes or similar that could indicate
    cheating. The exam is of a closed book format, meaning no notes or materials are
    to be referenced.


    When taking the exam, you will be asked to temporarily remove and show your glasses
    to the proctor (if you wear glasses, of course), and you may be asked to show
    the proctor your test-taking area from time to time.


    Now that we''ve covered taking the exam virtually, let''s turn our attention to
    the result of the exam.


    # The result


    Irrespective of the format of the exam (whether in person or virtual), when you
    finish your exam, you are immediately presented with the result and a breakdown
    of your scoring in each area of the exam (represented as a percentage). If you
    pass, congratulations! If you didn''t pass, then use the score breakdown in order
    to determine where to revisit and revise. Book a retake using the same process
    as booking for the exam. The retake will incur a fee, although this is cheaper
    than the initial exam fee. Don''t see a failure to pass as a bad thing. You''re
    given feedback so that you can score better and pass next time, as your revision
    can be more targeted the second time around.


    Now that we have seen what format the results take, let''s now summarize what
    we''ve covered.'
  merge: -1
  img_proc: true
