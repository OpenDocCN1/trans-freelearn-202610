- pgno: 21
  md: '# Introducing the Salesforce Data Architect Journey


    The Salesforce Certified Data Architect credential is an important part of every
    Salesforce Architect''s certification journey. It forms a constituent part of
    the Application Architect domain of the Certified Technical Architect credential,
    but it can stand alone, given the varying complexities and knowledge required
    to pass the exam. As architects, we''re entrusted to build scalable foundations
    that our users can execute effectively upon, and data is the life-blood of a business.
    Understanding the relationship, quirks, and considerations of data and the Salesforce
    platform is crucial for designing applications that give users value. Passing
    this credential demonstrates advanced knowledge of these concepts. This book will
    arm you with the theory and skills necessary to pass the exam.


    In this chapter, we''ll learn about the Salesforce Certified Data Architect credential
    by covering the various curriculum areas and why they are important to understand
    to not just pass the exam, but also excel in this aspect of the day-to-day role
    of a Salesforce Architect.


    Next, we''ll get an overview of the learning journey covered in this book.


    By the end of this chapter, you''ll be able to understand the topic areas that
    constitute the credential, know what a Salesforce Data Architect is, and understand
    how the learning journey throughout this book is structured.


    In this chapter, we''ll cover the following topics:


    +   - What is the Data Architecture and Management credential?

    +   - Introducing the exam

    +   - Profile of a Salesforce Data Architect

    +   - Introducing the learning journey'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# What is the Data Architecture and Management credential?


    The **Salesforce Certified Data Architect credential** is one of several introduced
    by Salesforce to initially address three main challenges:


    +   - As Salesforce implementations increase in size and complexity, there is
    an increasing need for good data management, including best practices in data
    architecture and management in Salesforce. Data is the life-blood for many businesses,
    and the architecture of Salesforce as the platform to hold that data is important.

    +   - There was a huge gap in the knowledge required between the Certified Technical
    Architect credential and the other credentials available. The only prerequisite
    for CTA in the past was that you had to hold the Salesforce Certified Administrator
    certification and answer a multiple-choice *pre-exam*!

    +   - Not everyone wants to necessarily be a full-blown Salesforce Certified Technical
    Architect. Instead, they may want to focus on one or more specific technical domains
    or aspects of the Salesforce platform.


    Simply put, this credential puts the focus on the data architecture aspects of
    the Salesforce platform. Candidates who pass this credential will have had to
    learn about the wide range of theory, techniques, and considerations that constitute
    the credential syllabus, which is based on the real-world knowledge that''s required
    of a Data Architect on the Salesforce Customer 360 platform. By learning everything
    that''s required to pass the Salesforce Certified Data Architect credential, candidates
    will have a toolkit of knowledge and understanding to draw from, improving their
    ability to deliver solutions while considering the data aspects of the Salesforce
    platform.


    # Introducing the exam


    The exam format consists of 60 multiple-choice questions, and candidates are given
    105 minutes to complete the exam. The passing score that''s required at the time
    of writing is 58%, and there are no written prerequisites for the exam (although,
    as you will discover quite quickly, it is extremely challenging to dive straight
    into this exam without the required learning and foundational knowledge of the
    Salesforce platform). Those unfamiliar with the Salesforce platform will struggle
    with many of the concepts introduced in this book, so it would be more practical
    to have experience in the platform at a sufficient capacity to understand how
    the data model works, what standard objects are available, and so on. This would
    typically equate to a few years of working with the platform, but this is subjective
    based on previous experience.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Breaking down the question count, testing time, and passing score required,
    we can deduce the following:


    +   - We have 1 minute and 45 seconds to answer each question.

    +   - We require 35 correct answers to pass the exam.


    The exam is taken virtually, either at a test center or online, both using Webassessor.
    The mechanics of this will be covered toward the end of this book.


    **Preparing for Success**

    As you most likely already know, resources are available online such as Trailhead
    (`https://trailhead.salesforce.com`) – specifically, the Data Architect and Management
    Trail mix (`https://trailhead.salesforce.com/en/users/strailhead/trail mixes/architect-data-architecture-and-management`)
    – and blogs that cover the theory around a specific topic. To bolster your learning
    journey, I’d like to introduce some habits that you can employ to boost your potential
    for success.


    # Playground environments


    Salesforce provides free **Developer Edition** orgs (sometimes referred to as
    **DE** orgs) that have many of the paid-for features of the core Salesforce platform
    (so this won’t include Marketing Cloud or Tableau, for example). These allow candidates
    to try out many of the concepts explained in this book in a real Salesforce environment
    to explore what the real implications of a particular concept or feature are.
    For example, it is entirely possible to create an external object that interacts
    with an external data source so that we can see what the usability and other limitations
    are when interacting with off-platform data in this way. I would fully encourage
    you to have at least one DE org in your learning toolkit. You can sign up for
    a DE org at `https://developer.salesforce.com/signup`.


    # Documenting designs and design decisions


    Another habit to aid in the learning process and beyond is to start documenting
    the following:


    +   - Artifacts

    +   - Design decisions


    While it may not be an end goal for everyone, the **Certified Technical Architect
    (CTA)** review board exam requires candidates to produce several artifacts. These
    include a data model, system integration landscape, actors/licenses, role hierarchy,
    and so on.'
  merge: -1
  img_proc: true
