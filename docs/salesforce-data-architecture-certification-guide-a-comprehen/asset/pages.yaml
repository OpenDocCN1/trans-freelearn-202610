- pgno: 15
  md: 'Chapter 10, Tuning Performance, looks at the various methods available to tune
    performance when designing scalable applications on the Salesforce Platform.


    Chapter 11, Backup and Restore, outlines the methods available to get data out
    of and back into the Salesforce Platform, focussing on data backup and restore.


    Chapter 12, Territory Management, introduces Salesforce Territory Management and
    how it pertains to the data model and usage design on the Salesforce Platform.


    Chapter 13, Practice Exam Questions, presents exam-like questions to further put
    into practice the theory you will have learned and bolster your understanding
    of the topic areas of the exam curriculum.


    Chapter 14, Cheat Sheets, introduces handy reference cheat sheets that provide
    a quick reference guide for aiding revision or for the day-to-day job.


    Chapter 15, Further Resources, highlights links to other information that can
    enhance your understanding of the material we cover in this book.


    Chapter 16, How to Take the Exam, describes what you will need to do to take the
    exam.


    Chapter 17, Answers to Practice Questions, provides the answers to the questions
    provided in Chapter 13, Practice Exam Questions.


    # To get the most out of this book


    You will need to be familiar with general Salesforce terminology and have a working
    knowledge of Salesforce in order to fully grasp the concepts covered in this book.
    All topics covered assume basic familiarity with the theory behind the Salesforce
    multitenant architecture.


    | Software/hardware covered in the book | Operating system requirements |

    |---|---|

    | Salesforce | Windows, macOS, or Linux with a web browser |


    We cover how to sign up for and obtain a Salesforce Developer Edition instance,
    which can be used for all topics, examples, and scenarios covered in this book.


    # Download the color images


    We also provide a PDF file that has color images of the screenshots and diagrams
    used in this book. You can download it here: https://packt.link/YQqWX.'
