- pgno: 32
  md: '# The Salesforce data model


    Salesforce abstracts the underlying data structure in its database for a given
    customer org by providing a faux RDBMS view of the objects within it. For example,
    take the diagram you find when viewing the Sales Cloud ERM at https://architect.salesforce.com/diagrams/template-gallery/sales-cloud-overview-data-model:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_32_0.png)


    Figure 2.1 – The Salesforce Sales Cloud data model


    As we can see, a contact record will have an Account Id represented as a lookup
    (which would be a foreign key in RDBMS terminology). Take this example for Account
    and Contact from Schema Builder for a brand-new Developer Edition org:'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/7cca8452e237cf62a2d0e00a080d3fe9_33_0.png)


    Figure 2.2 – Account and Contact represented in Schema Builder in a brand-new
    Developer Edition org


    # See for Yourself


    Feel free to sign up for a (completely free) Developer Edition Salesforce org
    at https://developer.salesforce.com/signup in order to follow along with the examples
    in this book, including exploring Schema Builder.


    Salesforce would have you think that Account and Contact exist as two separate
    database tables (and indeed there would be a separate table for each standard
    or custom object in the schema). Indeed, it is perfectly normal to think about
    the objects in this way in your day-to-day work as a Salesforce Data Architect.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The truth is, however, that Salesforce has a few large, underlying database
    tables (one for objects, one for fields, one for data that maps to those objects
    and fields, pivot tables, and so on) that provide for a virtual data structure
    for each org that is materialized at runtime. One virtual storage area contains
    standard objects and standard fields, another contains standard objects and custom
    fields, and another contains custom objects and their custom fields. This is explained
    in further detail at https://developer.salesforce.com/wiki/multi_tenant_architecture.
    In essence, the standard object/standard fields storage area is populated when
    a new org is provisioned, and the custom storage areas are added to whenever a
    new custom object or custom field is added (no matter whether that custom field
    is added to a standard or custom object). This structure can therefore be represented
    as follows, imagining a custom field is added to each of the standard Account
    and Contact objects:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_34_0.png)


    Figure 2.3 – Representation of the Salesforce database (object data only) with
    a custom field added to the Account and Contact standard objects


    Let''s now add a custom object to see how the virtual storage is affected and
    what that change looks like in Schema Builder:'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/7cca8452e237cf62a2d0e00a080d3fe9_35_0.png)


    Figure 2.4 – Representation of the Salesforce database (object data only) with
    a custom object added to the org and a custom field added to that new custom object


    *Figure 2.5* includes both the custom object and the custom field in the schema:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_35_1.png)


    Figure 2.5 – Schema Builder with the representation of the newly added custom
