- pgno: 155
  md: 'In the next chapter, we’ll explore more of the concepts around how you can
    mitigate **Large Data Volume (LDV)** concerns through practical examples and how
    to load massive amounts of data.


    # Practice questions


    Test your knowledge of the topics covered in this chapter by answering the following
    questions:


    +   1. What is the only data format that’s suitable for SOAP API requests?

    +   2. What are the two job types that the Bulk API is used for?

    +   3. What type of resource is used to describe the operations that are offered
    by a SOAP API that can be imported by calling applications?

