- pgno: 169
  md: '+   - A **Details Only** report, which exports all report rows without any
    formatting. This format supports choosing an export file type, such as Excel (both
    .xls and .xlsx) and CSV.


    Report Exports are downloaded immediately upon invoking the export.


    With the methods of exporting data now covered, let’s explore how to import data
    into the platform as a means of restoring data.


    # Importing data


    To import data into the Salesforce platform natively, there are, of course, the
    APIs that we have covered in other chapters, such as the Bulk API. However, it’s
    worth briefly mentioning the Data Loader application and the Data Loader facility
    in the Salesforce user interface.


    # *Importing data using the Data Loader application*


    Just as the Data Loader application can be used to export data from your Salesforce
    instance, it can also be used to import data. To do so, CSV files for the object
    data must be prepared in advance to serve as the data to be imported. When invoking
    the Data Loader application to import data, the columns of the CSV to be imported
    can be mapped to the fields of the object being imported.


    # *Importing data using the Data Loader facility through the Salesforce user interface*


    Salesforce setup supports importing data into an object using a CSV file, much
    in the same way that the Data Loader standalone application does, including the
    mapping of columns for the destination object.


    Now we’ve covered importing data, let’s move on to exporting metadata.


    # Backing up metadata


    When it comes to backing up the metadata for a Salesforce instance, there are
    several methods that can be exploited to do so. These include the following:


    +   - Sandbox refreshes

    +   - Change sets

    +   - SFDX

    +   - The Ant Migration Tool


    Let’s explore each of these in turn.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Sandbox refreshes


    Probably the easiest way to back up metadata from your production Salesforce instance
    is by initiating a sandbox refresh. This facility either creates or refreshes
    a designated sandbox environment with a copy of the production metadata (but depending
    on the sandbox environment type, data may or may not be present).


    With sandbox refreshes covered, let’s investigate change sets.


    # Change sets


    Change sets are often the first way that many Salesforce administrators and developers
    learn to move selective metadata changes from a sandbox environment to the production
    environment. Change sets are non-developer friendly and essentially act as the
    de facto way for non-developers to move sets of metadata between Salesforce environments.
    Whilst most change set usage is for moving changes up into the production environment,
    change sets can also be used for moving changes from the production environment
    to a specific sandbox environment.


    Having understood how change sets are used for selective metadata movement between
    environments, let’s touch upon Salesforce Developer Experience (SFDX).


    # SFDX


    A developer-focused suite of command-line utilities, SFDX allows for metadata
    changes to be exported and imported from the production environment or any sandbox
    created from the production environment to which the user has login access. Knowledge
    of the specifics of SFDX usage is not important for the exam but it is useful
    to know that it can be used by developers to export metadata from Salesforce.


    # The Ant Migration Tool


    Much like SFDX, the Ant Migration Tool is another command-line utility for moving
    your Salesforce metadata between a local directory and a Salesforce instance.
    Again, as with SFDX, the Ant Migration Tool can be used to move Salesforce metadata
    from a production environment to a local directory.


    Now that we’ve explored backing up metadata, let’s move on to importing metadata.


    # Importing metadata


    As you can probably imagine by now, all methods besides the sandbox refresh process
    can be used to import metadata as a way of restoring the metadata to a Salesforce
    instance. Let’s start with change sets.


    # Change sets


    By capturing a selected set of metadata artifacts and moving them from one Salesforce
    environment to another, change sets can be used to restore a set of changes from
    one environment to another. Imagine a Salesforce environment refreshed from production
    by accident – if there were another Salesforce'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'environment that contained the updated set of metadata artifacts, then change
    sets could be used as a means of performing the metadata restoration.


    Let’s now explore SFDX as a means to restore metadata.


    # *SFDX*


    With SFDX, it is possible to use a local filesystem or source code repository
    to store the metadata files. This is therefore a suitable means from which to
    perform selective metadata restoration activities to a specific environment from
    a local file store or repository.


    With SFDX re-visited, let’s briefly touch on the Ant Migration Tool.


    # *The Ant Migration Tool*


    Again, much like SFDX, the Ant Migration Tool can be used to perform metadata
    restorations from local file directories to specific Salesforce environments,
    notably production in the case of a restoration scenario.


    Now that we’ve explored importing metadata, let’s now investigate AppExchange
    and external software that facilitates backup and restoration of data and metadata.


    # AppExchange and external software that facilitates data backup and restoration


    When working with data backup and restoration on the Salesforce platform, naturally,
    there are developers and software vendors that have explored how far data backup
    and restoration extend beyond the native platform offerings provided by Salesforce.
    As is the norm for many use cases on the platform, such as industry-specific extensions
    to business logic for a given industry vertical, there are also AppExchange packages
    and full-blown external software that support data backup and restore operations.


    For example, Salesforce Backup and Restore is a paid add-on to your Salesforce
    subscription that facilitates regular, automatic backups of the data and metadata
    held within your Salesforce instance. Those backups can then be used to restore
    data and metadata to your Salesforce instance as required, irrespective of the
    operations that necessitated the action in the first place, such as human error.


    There are AppExchange packages that facilitate the automated backup and restoration
    of Salesforce data and metadata, often to off-platform facilities. These incur
    a separate charge to the Salesforce subscription, as they involve contracting
    with a different software vendor. This then allows operations to be performed
    using the AppExchange package as a conduit for the various operations to and from
    that external platform, such as data backup and restoration. To learn more about
    AppExchange packages that facilitate the backup and restoration of data and metadata
    to and from the Salesforce platform, please read more at https://appexchange.salesforce.com/appxSearchKeywordResults?keywords=backup%20and%20recovery.'
  merge: -1
  img_proc: true
