- pgno: 79
  md: 'This is explained in the following diagram:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_79_0.png)


    Figure 4.1 – Experience Cloud License type differences


    # Important note


    **When to use the different Experience Cloud license types:** In short, there
    is a relatively simple way to determine which license type to use for Experience
    Cloud sites.


    Generally, start with the Customer Community license type, and then adapt this
    according to your requirements, as follows:


    If advanced sharing (beyond sharing sets) read-only access to reports and dashboards
    is required, move to Customer Community Plus licenses.


    If **Lead** or **Opportunity** object access is required, or the ability to create
    reports and dashboards is required, choose Partner Community.


    Of course, there are additional nuances (explained at https://help.salesforce.com/s/articleView?language=en_US&type=5&id=sf.users_license_types_communities.htm),
    but this should be a good way to get started when learning for the exam.'
  merge: -1
