- pgno: 46
  md: 'Queries on data held purely within these objects will be relatively quick,
    but any data on parent objects (especially where that object is a standard object)
    will incur a small performance penalty as the results will require the use of
    a JOIN in the underlying SQL query issued to the Salesforce database.


    # External objects


    While the data for both standard and custom objects is held on-platform within
    the Salesforce database, external object data is held off-platform in an external
    data source, typically within another application. The idea behind external objects
    is that data is held off-platform, but end users interact with it as if it were
    on-platform. Salesforce uses web service callouts to access external data in real
    time. External data is available to users in real time through Salesforce, and
    the external object will always return the most up-to-date data from the external
    data source.


    External objects require an external data source definition in the Salesforce
    instance, which is then used to determine how to access the external system.


    External objects are denoted in Salesforce with a __x suffix in the object name.
    For example, invoice data from SAP for an order within Salesforce will have the
    name Invoice__x. External objects support indirect and external lookups to link
    the data with your Salesforce records.


    External objects are supported in Salesforce API version 32 and later and are
    available with Salesforce Connect and Files Connect.


    # Big objects


    Big objects are used to store and manage huge amounts of data (up to 1 million
    records out of the box, but this can be scaled up at an additional cost to tens
    of millions or even billions of records). Big objects provide consistent performance.
    In my experience, big objects tend to lend themselves to auditing and archiving
    use cases, but anything that requires consistent performance when working with
    hundreds of millions or billions of records is what big objects are designed for.


    Big objects work using a distributed database and are not transactional in nature.
    Therefore, sharing isn’t supported on big objects other than object and field
    permissions. Additionally, this means that automation from workflow, to flow,
    to triggers is not supported on big objects.


    > **Idempotence**

    > When the same record representation (that is, exactly the same set of data for
    a record) is inserted multiple times to a big object, only a single record is
    created. This is so that writes to the big object can remain idempotent. Inserting
    the same record representation into an sObject (whether standard or custom) will
    result in multiple entries.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Object relationship types


    Salesforce objects are linked together through relationships in one of several
    ways. These relationship can affect sharing and data access. The various relationship
    types are explained here.


    # Master/detail relationship


    A Master/detail relationship closely links two objects together, so much so that
    certain behavior of the child record is affected. This includes sharing, where
    access to the Master (or parent) record gives access to the detail (or child)
    record. Master/detail relationships also support roll-up summaries.


    When Master records are deleted, all child records are deleted. However, un-deleting
    a Master record restores all child records. When a detail record is deleted, it
    is moved to the recycle bin. If a detail record is deleted and subsequently the
    Master record is deleted, the detail record cannot be restored as it no longer
    has a Master record to associate to.


    # Many-to-many


    Lookup and master-detail relationship types are both one-to-many (where many records
    can be linked to one other record, for example an account having multiple contacts).
    Many-to-many relationships (for example, linking a case to more than one custom
    bug record, and multiple custom bug records to the same case) are represented
    using two master/detail relationships connected via a junction object (a custom
    object with two master-detail relationships). Many-to-many relationships can only
    therefore be used to connect one object to a different object. In our cases and
    bugs example, we have the standard case object with a master-detail relationship
    to our BugCaseAssociation junction object, and a custom bug object with a master-detail
    relationship to our BugCaseAssociation junction object. This can be represented
    pictorially:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_47_0.png)


    Figure 2.7 – Representing a many-to-many relationship with two master-detail relationships


    With master/detail and many-to-many relationships now covered, let''s look at
    the other relationship types.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Lookup relationship


    A lookup relationship links two objects together, except that sharing is not affected
    (and therefore the child object can have separate sharing, unlike that of master-detail
    relationships where sharing is affected), and roll-up summaries aren''t supported.
    Lookup relationships support linking two objects together, but that can include
    looking up to records of the same object type (think account hierarchies where
    an account record can have a parent account record to represent the hierarchy
    of a company group structure). An object with a lookup relationship to itself
    is called a self-relationship. The user object should instead use a hierarchy
    relationship (see the Hierarchical section) when looking up to itself.


    # External lookup


    When linking external object records to a Salesforce standard or custom object,
    and the external object is the parent object, then an external lookup relationship
    is used. The standard external ID field on the parent external object is matched
    against the values of the child object''s external lookup relationship field.


    # Indirect lookup


    When linking external object records to a parent object whose data exists in Salesforce
    as either a standard or custom object, an indirect lookup relationship should
    be used to associate the records. When creating an indirect lookup, you specify
    which field in the parent object and which field on the external object to match
    against and therefore associate records. A custom, unique, external ID field is
    selected on the parent object to match against the child external object''s indirect
    lookup field, which comes from the external data source.


    # Hierarchical


    Only available on the user object, a hierarchical relationship is a special type
    of lookup to associate one user to another (where the record does not directly
    or indirectly refer to itself). Storing a users manager as a lookup to another
    user record is a common use-case for this functionality.


    Now we know the different ways in which we can relate objects and their data to
    each other, let''s look at what happens when performance is affected by relating
    too many records to a single ancestor record or user.


    # Custom hierarchy (parent/child) relationships


    It is possible to create custom parent/child hierarchies by utilizing a custom
    Sub object that does a double lookup (of type lookup relationship) on the object
    you wish to create the parent/child relationship for. One lookup has a name format
    of Parent, the other Sub. For example, to create a parent/child opportunity relationship,
    create a custom object called SubOpportunity with a lookup called ParentOpportunity
    and another SubOpportunity that both look up to the opportunity object. This is
    explained in more detail at https://help.salesforce.com/s/articleView?id=000326493&type=1.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Overcoming data skew


    Automatic scaling is an expected feature of the Salesforce platform, particularly
    as the count of records for a particular object increases. Customers will demand
    a consistent level of performance when tens of thousands of records of the same
    type are present within the system. There are a couple of performance degradations
    that happen in a couple of select use cases. These are as follows:


    +   - A user owns more than 10,000 records of the same type (such as a user owning
    over 10,000 account records). This is known as **ownership skew**.

    +   - A single account record has a large number of child records, such as 10,000
    or more contact records with the same account as their Account Id lookup. This
    is known as **account skew**.

    +   - Similar to account skew, when a large number of child records (10,000+)
    are associated with the same parent there can be performance problems. This is
    known as **lookup skew**.


    We''ll look at the causes for each of these and how they can be mitigated.


    # Ownership skew


    When a single user or queue is the owner for more than 10,000 records of a particular
    type (such as contact), then performance issues due to ownership skew may arise.
    In Salesforce instances, it is very common to have a default user or queue that
    owns all otherwise unassigned or unused records. Changes to sharing settings or
    other sharing-related operations affect performance because re-calculating sharing
    based on a change of role for the owning user or another sharing-related calculation
    will result in a long-running Salesforce operation, locking the records while
    this operation takes place.


    # Ownership skew mitigation


    To mitigate ownership skew, consider the following:


    +   - Based on the data projections for large amounts of records that will result
    in a single owner (such as a default owner for lead records), consider having
    multiple owners for such ownership scenarios. Assignment rules are available for
    leads and cases (standard objects that tend to have high volumes), but other automation
    techniques are available to assign records based on the criteria of the record
    to an appropriate owner.

    +   - If one user must be used, performance impacts can be reduced by not assigning
    the user to a role. This removes any role-based impacts from sharing calculations.

    +   - If the owning user must have a role, then that role should exist at the
    top of the role hierarchy. The user therefore will not need to be moved around
    the hierarchy, reducing the impact of sharing calculations being a long-running
    process.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   - Ensure any owning user is not a member of a public group that is used
    in the criteria for any sharing rules. If this is the case, changes to the record
    owner will trigger re-calculations of those sharing rules also, further slowing
    things down.


    # Account skew


    Some standard Salesforce objects maintain a special data relationship to facilitate
    record access under private sharing models. This is especially true of accounts
    and opportunities (and, in fact, is how account and opportunity teams are facilitated
    with regard to sharing and access to select records).


    Account skew is the result of an account record having a large number of child
    records. I''ve seen this manifest with some clients as a single account record
    called Unassigned Accounts that has many tens of thousands of child account records
    that may be old, unused, or otherwise unassigned accounts. This scenario causes
    issues with performance and record locking.


    When updates are made to a child record, Salesforce will lock the parent account
    record (to maintain record integrity in the database). Therefore, updating a large
    number of child records under the same account record will potentially cause contention
    (where multiple processes or operations try to access the same thing at the same
    time) with trying to lock the parent record (which is done using a separate system
    thread).


    When updates are made to the parent account record, such as changing the owner,
    then all sharing will have to be recalculated on all child records. This can trigger
    a chain reaction because sharing rules, role hierarchy calculations, and many
    other operations related to sharing will have to take place. This will lead to
    long-running processes and potentially record locking issues.


    # Account skew mitigation


    To mitigate account skew, distribute child records across multiple parent account
    records. 10,000 is the magic number here. By distributing records across multiple
    accounts, we can avoid account skew and its performance impacts related to record
    locking and sharing operations.


    # Lookup skew


    Similar in principle to account skew, lookup skew can happen when there are a
    large number of child records associated (via the lookup field on those child
    records) with a single parent record. While account skew is specific to the account
    object, lookup skew can affect multiple objects.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Lookup skew mitigation


    Try the following to mitigate lookup skew:


    +   - Remove unnecessary workflows, process builders, or flows from affected objects
    in order to reduce saving time when records for affected objects are created or
    saved.

    +   - Distribute the skew across multiple records. For example, have separate
    parent object records for the lookups on the child records to reduce or even eliminate
    record locking and sharing recalculations.

    +   - Use picklist values instead of lookups. This will mean that there won’t
    be linking to actual parent records but reports on those picklist values can instead
    be used to query the associated data for a given parent record. This mitigation
    technique doesn’t lend itself to large amounts of lookup values, and therefore
    should only be used when the number of picklist values is low.


    # Data skew summary


    We’ve explored the three types of data skew in Salesforce and how to mitigate
    them. When designing an effective data management strategy within Salesforce,
    be mindful of data skew and how it can affect performance. By designing for data
    skew from the outset when building a data strategy, even the largest orgs can
    perform without degradation.


    Now we understand the different types of data skew and their impact, let’s combine
    what we’ve covered throughout this chapter.


    # Bringing it all together with data modeling


    We’ve covered a lot in this chapter, but now it is time to put the theory into
    practice and produce something tangible in the form of a data model. Now we know
    the OWDs we can set, the relationships between objects we can influence, and the
    owners of records, we can bring them together to produce a data model.'
  merge: -1
  img_proc: true
