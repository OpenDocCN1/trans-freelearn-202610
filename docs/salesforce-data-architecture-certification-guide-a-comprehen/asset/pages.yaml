- pgno: 229
  md: '# 16


    # How to Take the Exam


    When you feel ready to take the exam, you''ll need to go through the process of
    registering for it and then taking the exam either virtually or in person. Read
    on to find out more about how this process works. By the end of this chapter,
    you''ll know exactly what you need to do in order to take the exam. If you have
    already used Webassessor to take a Salesforce exam, you can skip this chapter
    if you wish.


    We''ll cover the following topics in this chapter:


    +   - Webassessor

    +   - Taking the exam in person

    +   - Taking the exam remotely

    +   - The result


    Now, let''s dive into how to take the exam, starting by introducing the Webassessor
    platform.


    # Webassessor


    **Kryterion Webassessor** is a platform used for scheduling, paying for, and taking
    exams. Used by Salesforce, **Amazon Web Services (AWS)**, and other organizations
    to administer credential exams, it provides a secure mechanism from which to book
    and pay for your exam, and then launch the exam itself. Results are stored forever,
    which means that all of your test-taking history for a given product suite (such
    as Salesforce) is kept in one place.


    Let''s look at how to sign up for a Webassessor account now.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Signing up for a Webassessor account


    In order to schedule an exam, you must sign up for a Webassessor account first
    if you do not already have one for Salesforce exams.


    To do this, first, navigate to https://www.webassessor.com/salesforce and click
    the Create a new Webassessor login now link:


    Schedule your Salesforce Certification Exam


    Due to the coronavirus (COVID-19) outbreak, many exam testing centers are closed.
    View the list of open testing centers here: https://www.kryteriononline.com/locate-test-center.
    For additional information on the COVID-19 situation, view this FAQ: https://sfdc.co/CertCovid-19.


    Connect with the Trailblazer Community

    Ask Salesforce-related questions and connect with Trailblazers from around the
    world by joining the Trailblazer Community.


    Information about Salesforce Exams

    Learn about each credential, prerequisites, and check out the exam guides.


    Prepare for your exam

    Continue learning and improving your Salesforce knowledge by visiting Trailhead
    or schedule a Trailhead Academy class to learn more from certified instructors.


    Additional questions

    Visit Trailhead Help to view relevant articles or to contact us.


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_230_0.png)


    Figure 16.1 – The Webassessor login screen


    When filling out the form details, be sure to use the same email account that
    you use for your Trailhead account. When all fields are filled out, click the
    Save button:'
