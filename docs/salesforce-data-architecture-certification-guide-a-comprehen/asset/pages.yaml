- pgno: 91
  md: '# Data Governance


    Being able to safeguard data on the **Salesforce** platform is a key part of the
    Salesforce Data Architect’s role. This chapter covers the concepts *behind building
    compliant solutions* and how the Salesforce platform offers features that can
    help in the technological underpinning of an enterprise **data governance** strategy.


    In this chapter, we’ll cover the following topics:


    +   - Considerations for implementing a compliant data model

    +   - Enterprise data governance


    While data governance may be perceived by some as a somewhat *dry* or boring topic,
    read on and you’ll find out why it is important when designing *scalable, secure*
    solutions on the Salesforce platform. Data governance accounts for 10% of the
    certification syllabus, so that’s some valuable points that can be attained when
    taking the exam.


    This chapter is the culmination of several topics that are interwoven when it
    comes to data management, security, and governance. By the end of this chapter,
    you’ll understand the concepts and regulations behind a compliant data model,
    such as the **General Data Protection Regulation (GDPR)**, **Personally Identifiable
    Information (PII)**, and more, and be able to articulate both what enterprise
    data governance is and how it relates to the Salesforce platform.


    Let’s begin by understanding the considerations for implementing a compliant data
    model.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Considerations for implementing a compliant data model


    The Salesforce Certified Data Architect credential syllabus talks about implementing
    a **compliant** data model in the context of data governance. As Salesforce Data
    Architects, it is on us to ensure that we can recommend an approach for designing
    a data model that conforms to the **compliance standards** that are set out in
    regulations such as the following:


    +   - **General Data Protection Regulation (GDPR)**, European Union

    +   - **California Consumer Privacy Act (CCPA)**, United States

    +   - **Personal Information Protection Act (PIPA)**, Japan

    +   - **Lei Geral de Proteção de Dados (LGPD)**, Brazil

    +   - **Personal Information Protection and Electronic Documents Act (PIPEDA)**,
    Canada


    This includes going over the various options available for identifying, classifying,
    and protecting sensitive data.


    We''ll look at one such regulation now, namely the GDPR.


    # What is the GDPR?


    The GDPR is the European data protection law that defines how personal information
    regarding EU individuals needs to be handled.


    The GDPR is there to control how information is used by organizations or governments.
    Individuals have a legal right to know how their information is collected, processed,
    and stored. They have a right to request the information a company, government,
    or entity holds about them, and a right to be forgotten. If such a request is
    made, the organization holding the data is required to delete it, subject to the
    fair processing of data (which the person must have been made aware of when they
    freely opted into the company or entity collecting this information). Companies
    are legally required to collect information fairly, only use it for the specific
    purposes they need it for, store it securely, and erase it when it''s no longer
    needed. If a company falls foul of the GDPR, the greater figure out of a maximum
    of €20 million or 4% of their annual global turnover is what the fine could be
    (this is according to the GDPR itself).


    The impacts of complying with the GDPR from a software application perspective
    include ensuring that the application data model can record consent and privacy
    preferences. As we already know, Salesforce includes several standard objects
    to assist with recording preferences and consent (such as the Individual object).
    Additional custom objects can be added for specific requirements.


    # The Individual object


    According to the Salesforce documentation available at https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_objects_individual.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'htm, the `Individual` object represents a customer''s data privacy and protection
    preferences. Data privacy records based on the Individual object store your customers
    preferences. Data privacy records are associated with related leads, contacts,
    person accounts, and users.


    When the `Individual` object is enabled, it can be exposed to users by adding
    the `Individual` field to the **Lead**, **Contact**, and **Person Account** page
    layouts.


    > **Important note**

    > Enabling the `Individual` object: The `Individual` object is available if **Data
    Protection and Privacy** is enabled in Salesforce. This can be done by selecting
    **Make data protection details available in records** under **Data Protection
    and Privacy** in **Salesforce Setup**.


    # *Dealing with GDPR data*


    Personal data and sensitive personal data are covered by the GDPR and need to
    be **identified**, **classified**, and **protected**. How does Salesforce help
    address data protection? Well, Salesforce includes several features to assist
    with protecting data from unauthorized access, including the following:


    +   - Classic and platform Shield Encryption

    +   - Data masking

    +   - Field-level security

    +   - Sharing settings

    +   - Event Monitoring

    +   - Session security

    +   - Field history tracking


    Let''s look at these topics in detail.


    # *Classic encryption*


    Included with a base license, **classic encryption** provides encryption for data
    at rest for custom fields (a distinct custom field type) using the 128-bit **Advanced
    Encryption Standard (AES)**. Users will need the **View Encrypted Data** profile
    permission enabled within their profile or via an assigned permission set to read
    encrypted field values. Classic encryption facilitates masking encrypted fields
    from users who don''t have permission to read the values. They will be presented
    with a series of asterisks instead. Encrypted fields that use classic encryption
    cannot be searched or used in automation such as Flow, approval processes, workflow
    updates, and so on. Therefore, consider classic encryption when encrypting certain
    data fields that simply store data in a manner that is masked to those who shouldn''t
    see it when viewing the record. If the field requires data to be encrypted at
    rest, needs to be searchable by users, or readable in automation scenarios such
    as Flow, consider Shield Encryption instead.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '> **Important note**

    > Classic encryption is effectively *free*: it is available with any base license,
    so it doesn’t incur an extra fee.


    # Shield Encryption


    Available for an additional fee, **Shield Encryption** provides encryption at
    rest using 256-bit **AES**. While Shield Encryption doesn’t provide data masking
    of values, it does allow for the encryption of both standard and custom fields,
    not requiring a special field type. When configuring the fields, encryption parameters
    can be set. Fields encrypted using Shield Encryption can be searched and used
    in automation facilities such as **Flow**. Additionally, **Salesforce Shield**
    allows you to encrypt **Files and Attachments**. You can read more about the differences
    between classic encryption and Shield Encryption at https://developer.salesforce.com/docs/atlas.en-us.securityImplGuide.meta/securityImplGuide/security_pe_vs_classic_encryption.htm.


    > **Important note**

    > Shield Encryption works on standard objects: classic encryption doesn’t extend
    to standard objects. Therefore, if the need to encrypt data on standard objects
    arises, you’ll need to invest in Shield Encryption.


    # Field-level security


    As covered in *Chapter 2, Data Modeling and Database Design*, **field-level security**
    is set at the profile and permission set levels, and simply determines if users
    should be able to see a field, read the values, or edit the values in that field.
    Field-level security is a de facto way to determine if users should have access
    to a field, and if they should, whether that access is read-only or read/write.


    # Sharing settings


    As also covered in *Chapter 2, Data Modeling and Database Design*, **sharing settings**
    such as **Org-Wide Defaults (OWDs)** can be used to state the default level of
    access users should have to a Salesforce instance’s data.


    # Event Monitoring


    As part of the Salesforce Shield suite, **Event Monitoring** enables access to
    an API-only object called **EventLogFile**, the **LoginEvent** object, **Transaction
    Security**, and an **Event Monitoring Analytics** app.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'With Event Monitoring enabled, it is possible to understand events and act
    on them, either through the API or by visually looking at event types using a
    Tableau CRM app. When acting on the events using the API, it is possible to determine
    usage such as impossible journeys. Impossible journeys are logins or page requests
    close together in time yet from locations far apart, making access from those
    locations within a specific time impossible and potentially malicious.


    You can read about how to enable Event Monitoring at `https://help.salesforce.com/s/articleView?id=000339868&type=1.`


    # Session security settings


    It’s possible to configure settings related to the security of a users session
    for when they are accessing Salesforce to safeguard access to your org data held
    on the platform.


    Session settings cover a wide range of topics, including **timeout settings, caching,
    multi-factor authentication,** and **high-assurance sessions** for accessing sensitive
    data.


    You can read more about session security at `https://help.salesforce.com/s/articleView?id=sf.admin_sessions.htm&type=5.`


    # Field history tracking


    Lastly (but by no means least), **field history tracking** is a powerful tool
    for understanding who made what change to a custom subset of object fields. Certain
    field changes may be required for tracking by your company – for example, who
    changes the **Stage** picklist on **Opportunities**, recording the old and new
    value, who made the change, and when. Field-level security allows for 20 fields
    per object to be tracked *out-of-the-box* with Salesforce, although Shield (which
    incurs a separate subscription/charge) can raise this limit to 60 fields per object.
    Additionally, with Shield, the field history data is archived after 18 months
    and stored for 10 years.


    You can read more about field history tracking at `https://help.salesforce.com/s/articleView?id=sf.tracking_field_history.htm&type=.`


    Now that we’ve looked at how to implement a compliant data model (looking at the
    various tools and techniques available on the Salesforce platform to do so), let’s
    turn our attention to enterprise data governance.


    # Enterprise data governance


    As data architects, we must look at the various approaches and considerations
    when designing an enterprise data governance strategy for implementation within
    an organization.


    To understand this better, the following diagram shows the components of an enterprise
    data governance strategy:'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/7cca8452e237cf62a2d0e00a080d3fe9_96_0.png)


    Figure 5.1 – Components of an enterprise data governance strategy


    An enterprise data governance strategy contains several key things, including
    the following:


    +   - **Policies and standards for data:**

    +     - What external policies, rulings, or standards must data adhere to? For
    example, is the business a financial services organization, and therefore are
    there regulatory body requirements that need to be considered for the governance
    of data?

    +     - What internal policies must data adhere to? For example, are there internal
    policies relating to PII?'
  merge: -1
  img_proc: true
- pgno: 97
  md: '+   - **Ownership and accountability of data:**

    +     - Who owns the data?

    +     - Who is accountable for the data?

    +   - **Rules for data:**

    +     - What rules are in place surrounding the data?

    +     - What rules need to be put in place?

    +     - Who oversees those?

    +   - **Definitions of data:**

    +     - Where is the data dictionary defined, stored, and managed?

    +   - **Data monitoring:**

    +     - What monitoring is in place for the data?

    +     - What systems need to be monitored?

    +     - What is the monitoring for?

    +   - **Measurement of data usage:**

    +     - What measures or **Key Performance Indicators (KPIs)** is data usage measured
    against?


    Having introduced these enterprise data strategy components, it should be clear
    that the questions posed contribute to the importance of having a sound data governance
    strategy in the first place. Given how valuable data is to an organization (and
    the laws and regulations that ensure it is treated as such), governing that data
    from collection to definition, usage, monitoring, and measurement is paramount
    to safeguarding what some may argue is its most valuable asset.


    Now, let’s take a look at some roles and responsibilities involved in data governance.


    # Roles and responsibilities


    An enterprise data governance framework may contain different roles and responsibilities,
    which is why each organization will have differing requirements. Each company
    needs to implement a suitable data governance model based on its specific requirements.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Let’s visualize the roles as they would sit in a data governance framework:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_98_0.png)


    Figure 5.2 – An enterprise data governance role framework


    There is typically commonality in the following role across data governance frameworks:


    +   - The steering committee

    +   - Data owner

    +   - Data steward


    Let’s look at each role in more detail.


    # Steering committee


    A **steering committee** is a forum of senior management, those accountable for
    certain business functions (such as Sales or Service), and C-level individuals
    (almost certainly the **Chief Information Officer (CIO)** and sometimes the **Chief
    Information Security Officer (CISO)**).


    This committee has several responsibilities, which include setting the data governance
    strategy, working with the data stewards, and ensuring the data governance function
    is held to account (which may include various programs or projects of work that
    have specific deliverables, outcomes, and deadlines).'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Data owner


    A **data owner** is a person or team responsible for ensuring information within
    a data domain is governed across the systems in the organization’s IT enterprise
    and business functions, such as sales. Data owners may be part of the steering
    committee (if the data owner is also a C-level member or in charge of a business
    function, such as Service). Data owners are typically responsible for the following:


    +   - Approving the data definitions (the descriptions or metadata about the data).

    +   - Ensuring the accuracy of information across the entire enterprise.

    +   - The quality of the data.

    +   - Contributing to, reviewing, refining, and approving the business approach
    to master data management. This can include reviewing or defining plans and other
    additional work items or artifacts that affect the master data management approach
    and its implementation.

    +   - Working with the other data owners to collaborate on data issues across
    the enterprise and resolve them.

    +   - Working with the steering committee, particularly to input on solutions
    (where the data owners have SME knowledge to offer). Additionally, they must give
    input on the selection and use of software and define and review policies or other
    regulatory requirements of their data domain (an example of a financial services
    organization in the United Kingdom is the **Financial Conduct Authority (FCA)**,
    which has strict requirements around handling data).


    # Data steward


    **Data stewards** are accountable for the day-to-day management of the data in
    the enterprise. They are the **Subject Matter Experts (SMEs)** who can both understand
    and communicate the meaning, definitions, and uses of the data in their business
    domain (and additionally, other related information across their business line).
    Data stewards work with other data stewards across the business to make decisions
    around the governance of the business data.


    In a nutshell, data stewards are responsible for the following:


    +   - Being the SMEs for their particular data domain

    +   - Identifying, working through, and resolving issues with their and other
    data stewards data

    +   - Reporting to the data owner and other applicable stakeholders within a particular
    data domain

    +   - Working across the entire business to ensure that their data is managed
    and understood by other data stewards and data owners'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'As you now know, there are different roles, each with discrete responsibilities,
    under an enterprise data governance framework. Communication is the key driver
    in ensuring these roles work well together. This is why the steering committee
    is of such importance to hold data owners and data stewards to account.


    Let’s summarize what we’ve learned in this chapter.


    # Summary


