- pgno: 75
  md: '# Salesforce Data Management


    With a grasp of **Master Data Management (MDM)** concepts under our belt, we can
    now look at Salesforce Data Management. In this chapter, we''ll look at how the
    Salesforce data model and Salesforce licensing work together. The license types
    chosen for a solution have an impact on the objects available. This can extend
    to record sharing facilities available in the case of Experience Cloud license
    types.


    We''ll look at what data persistence looks like on the Salesforce Platform and
    how that works when governing solutions on the Salesforce Platform.


    Next, we''ll expand on our *golden record* theory from *Chapter 3, Master Data
    Management,* to explain what a **Single Customer View (SCV)** looks like on the
    Salesforce Platform, and how data from multiple Salesforce clouds and multiple
    Salesforce instances can be pieced together.


    Therefore, in this chapter, we''ll cover the following topics:


    +   - Analyzing Salesforce license types and access to objects

    +   - Persisting data

    +   - Representing a single view of the customer on the Salesforce Platform

    +   - Pulling together data from multiple Salesforce instances


    # Analyzing Salesforce license types and access to objects


    In this section, we''re going to cover how the different Salesforce licensing
    options affect the objects and standard functionality available to users. Given
    the vast array of functionality available in Salesforce products, it is important
    to ascertain what the required objects and functionality will be (from both an
    internal and external access perspective) so that the correct licenses can be
    purchased. As expected, certain licenses are more expensive than others—for example,
    Service Cloud licenses are more expensive than Sales Cloud. In the case of Experience
    Cloud, this type of license not only affects the objects available for users but
    can affect sharing rules and role hierarchy too. We''ll get to those implications
    further along in this section.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Because of the cruciality of getting licensing correct, an important artifact
    produced during the Certified Technical Architect (CTA) review board is Actors
    and Licenses. This is essentially a listing of different user types and the licenses
    those different user types (also known as personas) need to interact correctly
    with the proposed solution. As a Salesforce architect, you should therefore consider
    this exercise as a pillar to your solution. If it is wrong, it can have profound
    impacts on the way users work.


    # Important note


    **Experience Cloud = Community Cloud:** Salesforce has rebranded Community Cloud
    to become Experience Cloud. This is intentional and represents a shift from Communities
    being a lens into your Salesforce data for external users. The technology that
    powers Community Cloud/Experience Cloud has evolved so much that entire digital
    experiences and commerce storefronts can be powered from it, hence the rebranding.
    For the avoidance of doubt, Community Cloud, Communities, and Experience Cloud
    are one and the same. The Salesforce documentation isn''t fully updated at the
    time of writing, so be mindful that you may still see references to Community
    Cloud and Communities from time to time.


    Let''s now delve deeper into the different types of licensing on the Salesforce
    Platform.


    # Standard platform licensing


    The core Salesforce Platform consists of several products, as follows:


    +   - **Lightning Platform**

    +   - **Sales Cloud**

    +   - **Service Cloud**

    +   - **Experience Cloud**


    These products are all built around the core application framework and relational
    database that underpins the Salesforce Platform. In fact, Sales Cloud, Service
    Cloud, and Experience Cloud can all be thought of as enhancements to the core
    Lightning Platform. For example, Sales Cloud has (among others) the Account, Contact,
    Opportunity, and Lead objects. These are predefined and interrelated objects that
    allow for a sales process to be quickly and easily set up and facilitated. They
    can also be thought of as a predefined set of objects and associated functionality
    that build upon the foundations of the Lightning Platform—namely, a relational
    database and application tier.


    Service Cloud builds upon the functionality available in Sales Cloud (although
    Service Cloud and Sales Cloud are designed to address different use cases). Service
    Cloud attracts a different cost model than Sales Cloud, given the difference in
    exposed functionality to users, and subsequently is classed as a different product
    license.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Experience Cloud can be thought of as a lens into your Salesforce data, and
    several Experience Cloud license types are available. These are explained in the
    following section. Experience Cloud only exposes access to objects on the core
    platform, so that includes Sales Cloud objects, Service Cloud objects (if licensed),
    and Custom objects.


    When designing solutions that require data to reside on the Salesforce Platform,
    consider the Standard platform licenses that will be required for your internal
    users. Generally, if a standard object offered by Sales or Service Cloud is designed
    to hold a specific type of data or is used to perform a certain function, then
    it is advisable to take advantage of it for the functionality built around it.


    For example, use Sales Cloud when you require prospecting functionality because
    this is offered by the out-of-the-box **Lead** object. There are also features
    such as **Lead Assignment Rules** and conversion to create an **Account**, **Contact**,
    and **Opportunity** record. It would be ineffective to reinvent the wheel to create
    these objects yourself. Similarly, when you have requirements for **Service-Level
    Agreement (SLA)** functionality for your customers cases, Service Cloud offers
    the **Entitlement** and **Milestone** objects for this purpose. If you wish to
    provide access to your customers so that they can raise support queries or have
    issues with the products you''ve sold them, Experience Cloud provides the means
    to do this.


    Now that we''ve covered Standard platform licensing for your internal users, let''s
    look at Experience Cloud licensing for external user access.


    # Experience Cloud licensing


    Experience Cloud is the way external users (those not internal to your company)
    access Salesforce. In this section, we''re going to look at the license types
    available for your external users.


    Experience Cloud licensing works differently from Standard platform licensing
    in that each license type affects access to objects and record sharing differently.
    There are different types of Experience Cloud licenses to use when designing solutions—namely,
    these ones:


    +   - **External Apps.** Used for custom digital experiences, including customer
    engagement and brand loyalty. Limited access to Salesforce objects. This license
    type can be used with Person Accounts.

    +   - **Customer Community.** Used for **Business-to-Consumer (B2C)** experiences
    with large numbers of users that need access to the **Case** object or Salesforce
    Knowledge. This license type can be used with Person Accounts.

    +   - **Customer Community Plus.** Used for B2C experiences where users need access
    to reports and dashboards and need advanced sharing. This license type can be
    used with Person Accounts.

    +   - **Partner Community.** **Business-to-business (B2B)** experiences where
    users need access to **Partner Relationship Management (PRM)** objects such as
    **Lead** and **Opportunity**. This license type cannot be used with Person Accounts.'
  merge: -1
  img_proc: true
