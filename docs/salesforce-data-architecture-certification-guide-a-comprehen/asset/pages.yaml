- pgno: 151
  md: "```\n```apex\n// Database.SaveResult list here\n}\n}\n```\n```\n\nThe second\
    \ argument to the `Database.insert` operation is a Boolean that specifies whether\
    \ to attempt partial record processing. If a value of true is passed, then as\
    \ soon as one record cannot be processed, all remaining records are not attempted\
    \ and an exception is thrown. If a value of false is passed, all records are attempted,\
    \ and the status for each record is returned to the `Database.SaveResult` array.\
    \ This can be iterated on and action can be taken as appropriate.\n\nTo determine\
    \ the most appropriate Apex approach to use, think about whether you need exceptions\
    \ to be thrown and immediately interrupt the execution of your code. If this is\
    \ desired, then using a DML statement would be appropriate. If you wish to allow\
    \ some records to be processed and take action on all records based on their status\
    \ without interrupting the flow of your code, then consider an Apex Database class\
    \ method call instead.\n\n> **Important note**\n> \n> Database transaction control\
    \ and the ability to roll back database operations are only available in the Apex\
    \ Database class. In addition, the Apex Database class allows you to empty the\
    \ recycle bin and convert a Lead (using the `convertLead` method).\n\nNow that\
    \ we’ve covered database operations using Apex, let’s turn to another Apex data\
    \ working facility called batch Apex.\n\n# Batch Apex\n\nAs its name suggests,\
    \ batch Apex is used to invoke and process a potentially large number of records\
    \ in batches, where the number of records is determined by issuing a query to\
    \ Salesforce. This execution typically lends itself well to situations where a\
    \ potentially large number of records could need processing, yet the exact number\
    \ of records isn’t known, such as updating records as part of an overnight batch\
    \ procedure.\n\nbatch Apex classes must implement the `Database.Batchable` interface\
    \ and therefore the `start`, `execute`, and `finish` methods. A bare-bones Apex\
    \ class for implementing the `Database.Batchable` interface would look similar\
    \ to the following:\n\n```\n```apex\npublic class myBatchClass implements Database.Batchable\
    \ {\n    public Database.QueryLocator start(Database.BatchableContext\ninfo){}\n\
    \    public void execute(Database.BatchableContext info,\nLists<SObject> scope){}\n\
    ```\n```"
