    > Test Taking Policy: When completing a Salesforce.com Certification exam, you
    are required to adhere to the Salesforce.com Certification Program Agreement.
    For more information, visit: https://trailhead.salesforce.com/help?article=User-Agreement.
    Additionally, you must comply with all instructions and requirements provided
    to you in your registration confirmation email and by your exam proctor. Failure
    to comply with the Program Agreement, proctor instructions, or test taking policies
    will result in disciplinary action. Cancellation and Reschedule Policy: If your
    exam is scheduled at a testing center, you can reschedule or cancel your exam
    72 hours before your scheduled start time without incurring a fee. If your exam
    is scheduled as online proctored, you can reschedule or cancel your exam 24 hours
    before your scheduled start time without incurring a fee. To reschedule or cancel
    within 72 hours of your testing center exam or within 24 hours of your online
    proctored exam, you will be charged a $75 fee and you must open a case with the
    Salesforce Certification team in order to process the change. The above policy
    excludes the Certified Technical Architect review board exam, which requires cancellation
    and rescheduling requests a minimum of 10 business days prior to the scheduled
    exam start date and time. If you do not complete the exam at the scheduled time
    and did not contact the Salesforce Certification team in advance, you will be
    considered a no-show and charged the full exam fee. For assistance rescheduling
    or cancelling an exam, please open a case with the Salesforce Certification team:
    https://trailhead.salesforce.com/help?support=home


    I acknowledge that I have read and understood all the information stated in the
    above text box and agree to abide by these terms and rules.


    Figure 16.6 – Picking a date and time to take the exam


    5. If you have a voucher code, enter it into the payment screen – otherwise, go
    to Check Out and pay using an accepted payment method. Your exam is now booked.


    The next step is to attend the test center in person at your scheduled time and
    take the exam. You’ll be required to show identification to prove who you are.
    The nature of each test center means that you may be solo or sharing a room with
    other test takers, but suffice to say, the exam will be delivered by you sitting
    at a computer and using your computer mouse.


    Now that we understand how the exam works when taking it in person, let’s explore
    what it means to take the exam virtually.'
