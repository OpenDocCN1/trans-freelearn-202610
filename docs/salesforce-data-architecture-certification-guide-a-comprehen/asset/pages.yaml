- pgno: 143
  md: '# Data APIs and Apex


    In this chapter, we’re going to explore the various Salesforce Application Programming
    Interfaces (APIs) that relate to data operations. Understanding the various APIs
    and Apex operations is important in rounding out your knowledge of the programmatic
    capabilities of the Salesforce platform as it relates to data operations. When
    taking the exam, you may get quizzed on hypothetical scenario questions that involve
    answering based on use of a Salesforce API or the use of Apex code to achieve
    a certain data operation. Therefore, this is crucial in rounding out your knowledge
    as a Salesforce Data Architect. In this chapter, we’re also going to look at Apex
    facilities relating to data, including database operations, working with batch
    data methods, and asynchronous Apex.


    In this chapter, we will cover the following topics:


    +   - How to call an API

    +   - Lightning Platform Data APIs

    +   - Apex Database operations

    +   - Batch Apex

    +   - Asynchronous Apex


    By the end of this chapter, you’ll be in a good position to understand the appropriate
    ways to deploy each of the topics covered when designing solutions involving data
    operations on the Salesforce Lightning Platform. Let’s begin with understanding
    how to call an API.


    # How to call an API


    While the design and implementation of APIs is out of the scope of this book,
    we’ll briefly cover how to call an API, namely the Salesforce REST API. At a high-level,
    an API is essentially a request to an endpoint (a URL) with an XML or JSON body
    (known as the request payload). The endpoint will return a response payload, which
    may be XML or JSON depending on how it is configured.'
