- pgno: 36
  md: 'Armed with the knowledge of how the underlying Salesforce data model is represented
    (which is important for performance tuning and the like, covered later in this
    book), we can now turn our attention to what standard objects are available in
    Salesforce. These objects have been created to address common use cases (such
    as accounts to represent companies and contacts to represent people), and therefore
    should be used as much as possible. This not only reduces reinventing the wheel,
    but also Salesforce has extended the standard functionality to account for specific
    use cases, such as account teams. Account teams extend the sharing model for accounts
    to allow bespoke sharing among a team of folks that will collaboratively work
    on an account. Similar functionality is available for cases and opportunities
    (called **case teams** and **opportunity teams**, respectively). This teams functionality
    is an example of a standard feature supported in the Salesforce data model that
    isn’t extended to custom objects.


    A full and exhaustive listing of the available objects in Salesforce and their
    fields is provided by the API documentation (available at https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_objects_list.htm),
    but some of the most commonly used objects are as follows:


    +   - **Account** – Represents a company or institution that you may do business
    with.

    +   - **Contact** – Represents a person (who is normally associated with one or
    sometimes many accounts).

    +   - **Lead** – Represents a prospect or unqualified sale. Leads are typically
    used in a presales scenario, with the goal of converting the lead into an account,
    contact, and optionally, an opportunity.

    +   - **Person Account** – A *grouping* account/contact object (mainly to allow
    opportunities to be associated to individual buyers instead of accounts/companies).
    This is essentially the account/contact relationship changed from a lookup to
    *Controlled By Parent*. This has effects on sharing and data visibility.

    +   - **Case** – Represents a tracked issue or work item requiring attention.
    It’s typically used by support staff.

    +   - **Opportunity** – Represents a business deal.

    +   - **Opportunity Line Item** – An item that forms part of the opportunity and
    is used to drive its value.


    > **Standard Object Data Model Diagrams**

    > The Salesforce standard data models are available at https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/data_model.htm
    (remember, they show the logical representation of the objects and their relationships,
    not the physical database structure).


    Now we are aware of the standard objects, and the three tables that facilitate
    standard objects/standard fields, standard objects/custom fields, and custom objects/custom
    fields, we can now turn our attention to understanding how data queries work,
    paying attention to performance across these tables.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'When issuing a form of query to the Salesforce database for data, such as Salesforce
    Object Query Language (SOQL) or a REST API call, that request is turned into system-generated
    SQL for the underlying database. It is not possible to tune the SQL that is generated
    but being mindful of how our data queries will affect the generation of the SQL
    provides us with something that we can affect to a certain extent. It is within
    these parameters that we can optimize our data queries.


    For example, consider this SOQL query for the first 10 account record names as
    they would appear in an alphabetically sorted list:


    ```

    SELECT Name FROM Account ORDER BY Name ASC LIMIT 10

    ```


    Given that we’re querying a standard field from a standard object, Salesforce
    will only need to retrieve data from the standard objects/standard fields table
    for Account.


    When adding a custom field into the mix (which we’ll assume is unimaginatively
    called CustomField for the purposes of this explanation), we’re then asking the
    underlying database query to have a JOIN in order to allow data from the Standard
    Object/Custom Fields table to be retrieved. Therefore, a query as simple as this
    will cause data to be retrieved from more than one underlying database table:


    ```

    SELECT Name, CustomField__c FROM Account ORDER BY Name ASC LIMIT 10;

    ```


    Now consider a third scenario. We are going to query a custom object (called CustomObj__c)
    that has a lookup to an account (called Account__c), and also place the name of
    the account and the custom account field from the last example in the results:


    ```

    SELECT Name, Account__c.Name, Account__c.CustomField__c FROM CustomObj__c ORDER
    BY Name ASC LIMIT 10;

    ```


    We’ve now queried the Custom Object/Custom Fields, Standard Object/Custom Fields,
    and Standard Object/Standard Fields tables, all for the retrieval of 10 rows worth
    of data from 3 fields!


    It is therefore best practice to design our data access queries to avoid joins
    as much as possible, therefore ensuring we get the best performance possible.
    Given the way in which the underlying Salesforce data is structured, having a
    well-structured data model (avoiding joins as much as possible) means reporting,
    dashboards, and list views will perform well.


    Chapter 6, Understanding Large Data Volumes, describes the issues that can arise
    with large amounts of data (particularly with performance) and how to mitigate
    them.


    With the Salesforce data model now introduced, let’s turn our attention to sharing
    and security, which affect how data is accessed.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Understanding Salesforce sharing and security


    Any data access in Salesforce is determined by a layered security model. With
    each layer, data access is gradually opened up. Therefore, it is imperative that
    at the lowest level the sharing and security requirements are well understood
    in order to configure the security settings as appropriate. The layers of the
    Salesforce security model can be visualized as follows:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_38_0.png)


    Figure 2.6 – A visual representation of the layers of the Salesforce security
    model


    The layers that make up the security model, how they are configured, and their
    impacts are explained in this section.


    # Organization-Wide Defaults


    The access that users have to each other''s records by default is specified in
    the Organization-Wide Defaults (OWDs) for a Salesforce instance. Essentially,
    OWDs lock data access down to the most restrictive level, and then the other sharing
    and data access tools (explained in the following sections) are used to gradually
    open up data access to your users. For example, setting a read-only account OWD
    will mean that users cannot edit accounts by default. If users require the ability
    to only edit accounts they own, grant edit and read access at the object level
    through the use of a profile or permission set, leaving the OWD set to read-only
    for accounts. There are separate OWDs for internal and external (through a Salesforce
    Community or otherwise) users. The premise of access is the same, but the external
    OWDs facilitate locking down to a more restrictive data access model by default.
    For example,'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'you may opt for all regular (sometimes referred to as internal) Salesforce
    users having read-only access to all accounts by default, with external users
    accessing Salesforce through a community having an OWD of private for account
    records so that those external users can only see account records they own. The
    values available to be set for OWDs are explained in the following subsections.


    # OWD values


    There are several options available when setting OWDs in your Salesforce instance,
    and they all have an impact on how data access works for a given object or associated
    records/objects.


    # Private


    Only the record owner, or those users higher than the record owner''s role in
    the role hierarchy can view, edit, and report on records of this object.


    # Public Read-Only


    All users can see records of this object type, but only the record owner and those
    folks higher than the record owner''s role in the role hierarchy can view, edit,
    and report on records of this object.


    # Public Read/Write


    All users can view, edit, and report on data held in records of this object.


    # Public Read/Write/Transfer


    Only applicable to case and lead objects, all users can view, edit, transfer,
    and report on data held in lead or case records where this option is set.


    # Public Full Access


    This is only applicable to the campaign object. All users can view, edit, delete,
    transfer, and report on data held in campaign records if this option is set.


    # Controlled by Parent


    Users can perform actions on related records (such as edit or delete) based on
    access to the parent record. For example, if a custom object called Invoice has
    Account as its parent object, and Invoice''s OWD is set to Controlled by Parent,
    then a users access to Account automatically means they have access to the invoice
    record associated with the account record. If the user has edit permissions on
    an account, then they will automatically have edit access to the associated invoice
    record.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# It Is Imperative That OWDs Are Correct


    OWDs were until recently the only way to restrict user access to a record. Changing
    an OWD will have an impact throughout the Salesforce Org (not least on the time
    it will take to perform sharing re-calculations), resulting in users potentially
    being able to see more data than they should do. Therefore, it is crucial that
    a users data access is thoroughly understood before implementing OWDs. Since the
    release of Winter ’22, a feature called restriction rules facilitates restricting
    access to certain records to a select group of users. This is explained in further
    detail in the Restriction rules section. Restriction rules are used to restrict
    users and are not a substitute for a well-designed OWD strategy.


    # Profiles and permission sets


    Specifying the object-level security access is the main function of profiles (although
    additional settings are present, such as login hours, IP ranges, and the like,
    that aren’t in the scope of this exam). By specifying Create, Read, Edit, and
    Delete access to specific objects, users access to those objects can be further
    opened up beyond the OWDs already set in the organization. Field-level security
    is also set in profiles and permission sets, so it is here where Read or Edit
    access to specific fields is done.


    Every user must have a profile assigned to them. Permission sets can be used to
    grant further selective access to objects and other features through organization
    settings available in the permission set. Managed packages typically use permission
    sets to allow assigned users access to the functionality offered by the managed
    package.


    # A Quick Word on View All and Modify All


    View All and Modify All essentially allow users to be given blanket Read or Edit
    access across the organization for a given object. They effectively ignore sharing
    rules for a specific object. Therefore, if users are assigned a profile or permission
    set with View All set for accounts, they will have read access to every account.
    Similarly, Modify All against accounts gives edit access to any account in the
    organization. View All Data and Modify All Data permissions are set at the organization
    level, and sharing is effectively ignored to grant read or edit access to all
    objects and records in the organization to users that have this permission.


    # Role Hierarchy


    Much like the structure of an organization, the role hierarchy is used to determine
    data access for groups of users and ensures that managers always have the same
    level of data access as their employees (regardless of the OWDs in place for that
    object). Each level of the role hierarchy should align with a level of data access
    needed by a particular group of users. Role hierarchies therefore deviate slightly
    from an organization chart as the system administrator will typically sit in a
    role toward the top of the hierarchy. Depending on the licensing in place for
    your Salesforce org, external users may have roles assigned, and therefore they
    may be subordinates to one of the internal roles.'
  merge: -1
  img_proc: true
