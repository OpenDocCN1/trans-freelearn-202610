- pgno: 58
  md: '# Introducing MDM


    MDM is the discipline of determining and maintaining a single source of truth
    for shared data across an enterprise. As you can probably imagine, maintaining
    multiple copies of the same information across an IT enterprise is inefficient
    and can lead to data inconsistencies. Unless people and technology are 100% aligned,
    maintaining multiple copies of the same data is virtually impossible. Siloed businesses
    (where each business division is effectively separated in terms of people and
    technology) suffer from data inconsistencies, and the quality and classification
    of data they hold is often flawed. These scenarios require bringing together the
    data held by different systems into a data master, or single source of truth.


    A single source of truth can be visualized conceptually as follows:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_58_0.png)


    Figure 3.1 – Bringing data held in different systems to form a single source of
    truth


    An example of inadequate MDM was realized by myself recently, and it involves
    my local car dealership. I enquired about, and ultimately purchased, a car from
    them, and as such, data about me and my purchased vehicle was on the sales team
    database. This is important to the dealership because they can send me reminders
    of when my car is due for a service and the like. Unfortunately for me, the dealership’s
    marketing department doesn’t have integration with the sales department, and as
    such, I continue to receive marketing emails from the dealership enticing me to
    purchase the car I already own.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'This particular scenario happened because the car dealership departments have
    unconnected systems. I''m represented twice in the IT enterprise, as a prospect
    in one system and a qualified (and converted) sales lead in another. If the car
    dealership''s different departments'' data was centralized into a single source
    of truth, they could see that I had purchased a car, and perhaps turn their marketing
    efforts to upselling and cross-selling activities, such as deals on car accessories
    or a servicing package.


    MDM should be an ongoing process, as part of a wider organizational data strategy.
    For example, when one organization acquires another organization, its data must
    be cleansed, de-duplicated, classified, and reconciled with that held by the acquiring
    organization. The benefits of consolidating data into a shared single source of
    truth ensure people in organizations are using the latest, cleansed, and correctly
    classified data. The single source of truth is often referred to as the golden
    record. We''ll cover this concept in the section titled The golden record, later
    in this chapter.


    Let''s now cover some key terms used in MDM and their definitions.


    # Key terms


    The following terms are used a lot in the field of MDM. When dealing with MDM
    situations as a Salesforce Data Architect, you may come across these.


    # Harmonizing data


    **Data harmonization** is the practice of taking data from multiple sources and
    processing it (often through machine learning and automation) into a standard,
    accurate, and comprehensive format, meaning anyone interacting with the data can
    do so in the same way (utilizing a common data language). For example, calling
    a product a **Stock Keeping Unit (SKU)** instead of a *product code* internally
    and a *product* externally.


    # Consolidating data


    As the name would suggest, **data consolidation** is the practice of bringing
    together and consolidating data from several data sources into a centrally managed
    *data master* or *hub*. It should be noted that this is slightly different from
    the golden record, as that refers to the surfacing of information, whereas data
    consolidation refers to the actual management of consolidated data (although it
    is perfectly acceptable to surface golden records from the MDM data hub).'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# ## Data survivorship


    Data survivorship is concerned with what happens to data that is identified as
    a duplicate across the IT enterprise. Typically, data record survivorship can
    be categorized as follows:


    +   - **A survival-of-the-fittest approach:** The record deemed most suitable
    is taken as the one to use.

    +   - **Forming a golden record:** The suitably identified pieces of data (as
    determined by business rules on data quality) are brought together to form a single
    source of truth.

    +   - **Context-aware survivorship:** Duplicate data records aren''t actually
    altered, in that they aren''t merged into other records, archived, or deleted.
    This is typically used in enterprises that need to form different views of data
    (think different golden records depending on the context in which data is being
    viewed or interacted with). As you would expect, this approach involves an extra
    layer of data management and, therefore, may have performance concerns associated
    with it.


    # ## Thresholds and weights


    When matching data, weights are the values given to data records, and thresholds
    are what determine the action to be taken on those records. For example, a threshold
    may cause two records to automatically be linked, or flag two records for manual
    intervention. Weights are what calculate the matching score that feeds into the
    thresholds. For example, a matched email address, postcode, and surname would
    give a higher score than matching two records purely on a first name, as these
    may be common across the data set. Our high-weighted record match may feed into
    a threshold that automatically links the records together.


    # ## Canonical modeling


    A canonical data model is a way of modeling data in its simplest form. Typically,
    this is used in a middleware scenario whereby data is modeled differently in source
    systems. A canonical data model can be used as a common format from which system-specific
    data models can be generated or fed into.


    An example of a canonical data example would be for a customer master (Salesforce)
    and a new contact requiring creation in two different connected systems through
    a middleware layer. Because the two source systems represent contacts in different
    formats, the middleware would take the Salesforce contact and convert it into
    a canonical (or simplest) format, from which a transformation can be done to the
    system-specific format for each source system requiring interaction to create
    the contact. New connected systems can immediately take advantage of this modeling
    logic.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Hierarchy management


    This is a relatively simple concept whereby the hierarchy of various data records
    and elements is represented. For example, you may break company geographies or
    markets into EMEA (Europe, Middle East, and Africa), then by country. You may
    have account hierarchies represented as group accounts, then regional accounts,
    followed by local office accounts.


    Now that we know what MDM is from a theoretical standpoint, we can turn to the
    considerations for implementing MDM.


    # Implementing MDM


    As part of the fundamental design of an MDM strategy, consideration should be
    given to the system landscape, budget, and technical capabilities within an organization
    for implementing MDM. Several models for implementation exist and can be broadly
    bucketed into the following categories:


    +   - Source of record

    +   - Central registry

    +   - Consolidated golden record

    +   - Coexistence of the golden record


    These different implementation methods are explained here.


    # Source of record


    A single system can be identified as the source of record or definitive source
    of information. All data operations are performed in that one system or application.
    This implementation model is extremely simple, and therefore doesn’t lend itself
    well to organizations of siloed departments or where data federation is necessary.
    Take my experience of the car dealership. I’m represented twice in the IT enterprise,
    as a prospect in one system and a qualified (and converted) sales lead in another.
    This, therefore, is a case of two sources of record (known as data silos) existing
    in the IT enterprise in the car dealership. This scenario only lends itself to
    the most simple of IT enterprises, where everything is managed from one application.
    It may be the case that Salesforce is used for sales and service, with simple
    integration to a finance system for the issuance and processing of invoices. Salesforce
    is the system of record, as the finance system doesn’t have any operations performed
    in it directly; it effectively acts on the instructions of Salesforce.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Central registry


    A central registry links data from multiple systems together through the use of
    IDs and matched records (which can be cleansed and de-duplicated when identified).
    Master data changes are still made in the respective source system, with a single
    source of truth being created on demand by pulling together data from source systems
    in real time when needed. When it is difficult to determine an authoritative data
    source in an organization, this method may be suitable. There is a cost consideration
    as a system to be used as the central registry may not be available prior to implementing
    the MDM strategy, and additionally, there are processes associated with the population
    and maintenance of the registry over time.


    # Consolidated golden record


    Master data, as identified from multiple sources, is combined to form a golden
    record, or single source of truth. Any updates to the golden record are applied
    to the original sources, typically using middleware. There is a cost consideration
    to this approach in the implementation of the middleware processes to facilitate
    data updates to the source systems. This is probably the most common implementation
    scenario when implementing Salesforce, as it typically is introduced to the IT
    enterprise to be the definitive source of truth. In order to get there, however,
    data must be taken from source systems. In short, if there is one system identified
    as a single view of a customer in an organization, and a number of downstream
    systems require updating when customer information is updated in Salesforce, this
    approach is most suitable.


    # Coexistence of the golden record


    Similar to the consolidated golden record implementation method briefly explained
    previously, MDM changes can happen in both the golden record system and any source
    system for master data. While this approach can take longer to implement, data
    can be mastered in the golden record system or any of the master data source systems.
    As data is synchronized, the quality in any given system is consistent. Access
    to quality data is therefore improved, as users in a given company department
    may only use one system and not necessarily the golden record system. The same
    cost considerations for the implementation of processes using a middleware tool
    would apply here. This scenario is perhaps useful in scenarios where an organization
    may have specialist or legacy applications used by certain functions. Take an
    organization with a specialist system that is used for a critical function and
    is actively used by a select group of users as their only system given the nature
    of their job, yet they need to see the golden record of the customer. This scenario
    would therefore apply because the system may have updates applied to it that need
    to make their way back up to Salesforce. This parallel or coexistence of the golden
    record may be necessary for the scenarios where certain applications need to have
    the same quality golden record information as Salesforce.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Which implementation method is best?


    Each implementation method has its own merits and may be suitable depending on
    a number of factors. As architects, it is our job to advise according to the goals
    and strategic initiatives of the organization, giving consideration to maintainability.


    # What has any of this got to do with Salesforce?


    Now we know what MDM is, and the theory behind how to implement it, let''s turn
    our attention to MDM and Salesforce. Typically, Salesforce is implemented to bring
    together data from a company''s enterprise in order to break down information
    silos and provide a consistent view of the data across various business units
    or departments. Salesforce is therefore a de facto source of truth and immediately
    becomes the data master when implemented in such scenarios. Our single source
    of truth would therefore exist in Salesforce.


    Salesforce almost always needs to communicate data changes with one or more systems.
    Therefore, implementing a middleware system is typically used to facilitate the
    communication and data field mapping between connected systems that constitute
    our golden record in Salesforce. As part of the Salesforce system design, the
    produced data dictionary for the objects and fields created in Salesforce can
    be passed to the middleware team in order to facilitate the data mapping in order
    to broker data updates between Salesforce and connected systems.


    The initial data migration exercise to Salesforce should be used as the point
    in which the single source of truth for a given record is constructed from the
    source systems, cleansed, de-duplicated, and enriched as required or appropriate
    prior to loading into Salesforce and then turning on the integration for changes
    to only be enacted in connected source systems after the go-live date.


    Now we know what MDM is, let''s explore the concept of the single source of truth
    in more detail.


    # The golden record


    As we now know, the **golden record**, or **single source of truth**, is essentially
    a data record where the definitive source of information is stored in order to
    orchestrate business operations. Users should be able to view a golden record
    to see the correct version of a piece of information. While the definitive source
    of information for users may well be the golden record, integration of associated
    systems may be responsible for the updates to that data, or pushing golden record
    data updates to those associated systems, as explained in the previous section.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Golden records may not necessarily contain every piece of information held
    across all systems in the enterprise but may instead contain the identifiers necessary
    for the retrieval of that information. As Salesforce architects, it is our job
    to determine where the line is between which information should be held inside
    and outside of Salesforce, depending on whether Salesforce is where the golden
    record resides. Some information should be inside Salesforce, where it makes sense
    to master it in there; other information, that needs to be surfaced in Salesforce
    but not necessarily to live on the Salesforce platform, should be pulled in as
    necessary upon viewing.


    # What data should reside in the golden record?


    When designing the golden record, think about the users, what data they need access
    to, and when. Process-critical data should be brought into the Salesforce platform,
    but data that won''t be frequently accessed or reported on can be shown on-demand
    from an external system when required.


    For example, a customer record for a bank may exist as a Person Account in Salesforce,
    and associated with it will be the actual bank account records in a separate system.
    Depending on the system landscape and how those other systems are interacted with,
    the identifiers for those separate bank account records may be located in one
    of the following:


    +   - Salesforce (either against the Person Account record, or a record associated
    with it)

    +   - A middleware system, such as MuleSoft

    +   - A separate system to be interrogated by the middleware, or Salesforce if
    no middleware exists


    When determining where the golden record will reside as part of an MDM strategy,
    consider the following:


    +   - What information needs to be represented on the golden record?

    +   - What information needs to be physically located on the golden record, and
    what information can be referenced for on-demand retrieval?

    +   - Where do all the golden record data sources reside?

    +   - Are new integrations required?

    +   - Do existing integrations need to be updated or capture additional attributes?

    +   - What is the right data source for each field for the golden record?

    +   - What rules need to be put in place for data updates to or from the golden
    record?


    Remember the diagram in Figure 3.1 from the Introducing MDM section? We''re going
    to use that conceptual overview of a golden record as our requirement to be explored
    using several implementation techniques that follow. Look at that diagram in Figure
    3.1 again before moving on.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'In our conceptual scenario, we want data from these three different systems
    to be brought together to form a golden record of our customers. Taking the golden
    record residency examples introduced at the start of this section, let''s look
    at how those differences would be represented.


    # Salesforce holding the golden record associations


    In scenarios where Salesforce is to be considered as the data master for customer
    information, connected system identifiers can be represented as either custom
    fields on a particular record, or as a custom object associated with the record.


    For example, a contact record in Salesforce is the golden record for data relating
    to a person across a company''s enterprise. In order to ensure associated records
    are correctly updated when data in Salesforce is updated (such as HR system data
    that shouldn''t reside on Salesforce), a middleware platform (such as MuleSoft)
    will need to interrogate Salesforce to determine the associated systems and record
    identifiers in those systems that require updating when the contact record is
    updated. This essentially adds a round-trip into data update or retrieval operations,
    as IDs in Salesforce need to be queried to know which associated system records
    to affect.


    The following diagram shows an example of how this may be sequenced when Salesforce
    holds the record associations:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_65_0.png)


    1 Invocation of data update from Salesforce


    2 Middleware queries for system identifiers associated with Salesforce record


    3 Data updates made to systems associated with Salesforce record


    Figure 3.2 – Salesforce holding the golden record associations'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'In the next section, we''ll take a look at the representation of a golden record
    when middleware holds the record associations.


    # Middleware holding the golden record associations


    Taking our example from the previous section, if the middleware (such as MuleSoft)
    holds golden record associations, we can essentially have Salesforce only care
    about itself in terms of record integrity, with the onus being passed to the middleware
    to ensure that data operations to or from associated systems are correct. This
    does reduce the initial querying of Salesforce to determine those associated system
    IDs, but an additional process needs to be put in place to ensure that the middleware
    is updated appropriately if an associated system is added to, or removed from,
    the IT enterprise.


    The following diagram shows an example of how this may be sequenced when middleware
    holds the record associations:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_66_0.png)


    +   1. Invocation of data update from Salesforce

    +   2. Middleware queries for system identifiers associated with Salesforce record
    from internal database

    +   3. Data updates made to systems associated with Salesforce record


    Figure 3.3 – Middleware holding the golden record associations


    Next, let''s look at the representation of a golden record when a separate system
    or external registry holds the record associations.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# A separate system holding the golden record associations


    Requiring a callout to another separate registry system or similar (typically
    orchestrated through the use of middleware, such as MuleSoft), the golden record
    doesn''t necessarily know what records constitute it, and therefore, a registry
    of identifiers to piece together record information is used to then orchestrate
    the callouts to other separate systems. This action could be initiated by Salesforce
    calling the middleware to piece together a golden record using the Salesforce
    record ID, which is then referenced in the registry system to orchestrate a number
    of system callouts and process the returned data back to the user. Alternatively,
    middleware, or a batch-processing system, could orchestrate data updates into
    the golden record on a scheduled basis.


    The following diagram shows an example of how data updates may be sequenced when
    a separate system holds the record associations:


    ![](img/7cca8452e237cf62a2d0e00a080d3fe9_67_0.png)


    1 Invocation of data update from Salesforce


    2 Middleware queries for system identifiers associated with Salesforce record
    from external registry


    3 Data updates made to systems associated with Salesforce record


    Figure 3.4 – Querying an external registry for the system identifiers associated
    with the Salesforce record


    Of course, sometimes you may wish to use data that is kept outside of Salesforce.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Using Salesforce Connect to pull in data in real time for read-only purposes


    In scenarios where data on a Salesforce record doesn''t necessarily need to reside
    within Salesforce (pulled on-demand from one or more systems or data sources),
    Salesforce Connect can be used to effectively present data to a user as if it
    resides within Salesforce (having the same user interface and a degree of interactivity).
    Salesforce Connect uses the principle of adapters to bring in data from an external
    source. For example, there are adapters for OData 2.0, OData 4.0, and Cross-Org
    (Salesforce to Salesforce) available out of the box, and there is a framework
    for writing a custom adapter available in Apex.


    If a middleware solution (such as MuleSoft) is not available (or indeed not desirable),
    then point-to-point integrations to external systems for the purpose of data access
    may be necessary, and that''s a perfect use case for Salesforce Connect.


    When using Salesforce Connect, external objects (as you''ll remember from Chapter
    2, Data Modeling and Database Design) are mapped to data tables in external systems.
    This data can be interrogated and used by users when performing operations in
    Salesforce such as search, associating data in external systems with data held
    within Salesforce (using either an external or indirect lookup relationship),
    or viewing a record feed.


    By default, external data sources are read-only in Salesforce, but it is possible
    to make them writable. For example, imagine there was order data being viewed
    from SAP, associated with a custom account held in Salesforce. It is possible
    to enable the external data source as a writable external object, so that new
    orders could be created from Salesforce, writing back to SAP, and creating the
    order there.


    When setting up Salesforce Connect, an authentication mechanism may be required
    so that Salesforce can communicate securely with the other system. This may take
    the form of a username/password of the user Salesforce will use to perform queries
    in the external system, or it may be a more sophisticated setup, such as using
    Open Authentication (OAuth) with an external authentication service, such as Microsoft
    Azure Active Directory.


    # External data retrieval using the OData 2.0 or OData 4.0 adapters


    OData is a protocol built upon Representational State Transfer (REST). As defined
    at https://www.odata.org, OData is described as an open protocol to allow the
    creation and consumption of queryable and interoperable REST-ful APIs in a simple
    and standard way.


    If an external data source can be exposed as an OData RESTful web service, then
    the OData 2.0 or OData 4.0 Salesforce Connect adapter can be used to allow for
    its display in the Salesforce UI.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# External data retrieval using the Cross-Org adapter


    It is possible to pull in data from another Salesforce instance using the Cross-Org
    adapter for Salesforce Connect. This uses the Lightning Platform REST API to access
    data stored in another Salesforce instance (also referred to as an org or organization),
    although the implementation is hidden from the Salesforce administrator setting
    up the Salesforce Connect Cross-Org adapter. It''s therefore possible to pull
    data held in one Salesforce instance to another.


    If, for instance, your company acquired another company that also used Salesforce,
    yet it was decided that the acquired company would continue to have a degree of
    independence and keep their separate Salesforce system, then the opportunity data
    could be pulled into your Salesforce instance so that a more complete set of sales
    data could be reported on.


    # External data retrieval using a custom adapter


    In scenarios where an existing adapter isn''t suitable, a custom adapter can be
    created in Apex, using the Apex Connector Framework. The knowledge of coding such
    an adapter isn''t in the scope of the exam or this book, but documentation can
    be found here: https://developer.salesforce.com/docs/atlas.en-us.234.0.apexcode.meta/apexcode/apex_connector_top.htm.


    A custom adapter is generally required when an external data source isn''t OData
    2.0 or OData 4.0 compatible, and the external data source also isn''t another
    Salesforce instance. In these scenarios, a custom adapter is required for communication
    with the external data source so that its data can be presented, searched, and
    queried right within the Salesforce UI.


    With an understanding of the various methods on how to construct the golden record
    data through relationships to data held in other systems (the system identifiers),
    let''s explore how we can consolidate data attributes from those systems.


    # Consolidating data attributes from multiple sources


    When designing an MDM strategy, we need to determine what data attributes constitute
    the golden record, along with the source of the data attributes. Where multiple
    sources may contain the same attribute, it may be necessary to implement a cleansing
    and de-duplication process in order to ensure that the same data attribute values
    are preserved throughout the enterprise. Depending on the MDM implementation method
    being used, it may be necessary to allow any source system to facilitate the update
    of a data attribute to the golden record, which then invokes a process to push
    that update down to all source systems for that data attribute. Therefore, when
    implementing the golden record for the first time, data quality and classification
    are crucial, and so time should be given to a data cleansing, matching, and de-duplication
    strategy as part of the initial golden record population. It may then be wise
    to consider locking down the source systems for new record creation by users,
    so that duplicate records can be caught in the system of entry, with permissions
    to create new records in source systems reserved almost exclusively for an integration
    or process user. This way, users are entering data in a single place, and are
    told immediately if there are data duplication issues, and source systems remain
    in the cleanest state possible.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Invariably, data issues may occur over time, and reporting and analytics will
    help deduce the cause of these. User behavior can be influenced by training and
    modification of the data entry system (through the use of validation and approval
    processes), and automated processes can be tweaked with changes to the rule-base
    from which they are built to operate.


    With an understanding of data attribute consolidation across the multiple systems
    that constitute under our belts, let''s now look at how to preserve traceability
    and context when working with our data from the golden record.


    # Preserving traceability and business rule context


    In line with our establishment of a golden record, or single source of truth,
    it is important that an MDM strategy plays nicely with existing business rules,
    and changes to data are preserved throughout the organization. For example, the
    process of creating a bank account in a connected system from a Salesforce Financial
    Services Cloud instance would be done as a user acting on behalf of Salesforce
    – this provides some traceability as to what instigated that action. The rules
    in which records are created or updated in connected systems should still largely
    hold true (albeit some may need adjusting for the processes introduced by the
    MDM strategy).


    The updating of an address for a customer in a bank may have previously been subject
    to an approval process in the source system. Moving up this approval process to
    the system of record (such as Salesforce Financial Services Cloud in our banking
    example) preserves the context of the business rule, so the approval still takes
    place. Moving business rules to the appropriate system still preserves their context,
    facilitating the who did what when nature of data management.


    There are several facilities offered by Salesforce for preserving traceability
    and capturing metadata.


    # Event Monitoring


    User events can be captured in Salesforce Event Monitoring, such as login/logout
    events, web clicks, API calls, Apex executions, and report exports. More information
    on Salesforce Event Monitoring can be found here: https://trailhead.salesforce.com/content/learn/modules/event_monitoring.


    # Setup Audit Trail


    Setup Audit Trail is the log that Salesforce keeps of actions performed in the
    Setup area of Salesforce, useful in determining what actions have been taken by
    system administrators and those with certain setup privileges.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Field History Tracking


    Field History Tracking allows for the recording and preservation of changes to
    specific fields on Salesforce objects (configured in Salesforce Setup). This includes
    the user that made the change, the date/time of the change, the old value, and
    the new value. By default, you can track the field history for up to 20 fields
    per object.


    # Field Audit Trail


    Field Audit Trail is a Salesforce feature for defining a policy for the retention
    of archived field history data. This can be for 10 years from when the data was
    archived (as opposed to the 18 months Salesforce allows without Field Audit Trail
    enabled). Field History Tracking is a pre-requisite for Field Audit Trail (as
    the old and new values are required, for example). When Field Audit Trail is enabled,
    the limit of the number of fields to be tracked per Salesforce object is increased
    from 20 to 60. The retention policy is defined using the Salesforce Metadata API.
    More information can be found here: https://help.salesforce.com/s/articleView?id=sf_field_audit_trail.htm&type=5.


    # Custom metadata types and custom settings


    Custom metadata and custom settings facilitate the creation and storage of metadata
    specific to an organization''s Salesforce implementation. This may include bespoke
    configuration information, and the storage of values for business logic, for example.


    Let''s now summarize what we''ve covered in this chapter.


    # Summary


    In this chapter, we covered a lot of the theory behind MDM, having a single source
    of truth for data records, and some methods for its implementation, along with
    considerations for doing so. While Salesforce is often implemented to act as the
    de facto source of truth, it is important to understand why that often drives
    these decisions and the benefits it gives, hence spending time on the theory of
    MDM. With that theory understood, it should become clear how Salesforce fits into
    an organization''s MDM strategy.


    We''ve looked at why data quality is important in the context of MDM, and why
    it is important to preserve data attributes across the systems in the enterprise
    that constitutes the single source of truth, or golden record.


    We turned our attention to MDM implementation in Salesforce, touching on the use
    of middleware, and highlighting the data migration exercise that will invariably
    accompany a Salesforce go-live.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'We have covered what a golden record is and looked at the various things to
    consider when determining where a golden record’s data fields reside, and what
    data fields from source systems constitute the golden record. The architecture
    related to associating different systems in the IT enterprise with the golden
    record can have an impact on how data operations work and business rules run,
    so we covered the theory behind that also. We also then looked at how to preserve
    data quality and ensure traceability and business rule context for operations
    and procedures, highlighting that the system in which a process runs may change
    due to the introduction of a new data master in the IT estate.


    In *Chapter 4, Salesforce Data Management*, we’ll dive into how Salesforce license
    types affect the data model and the sharing options available to work with. We’ll
    also look at how to govern the data on the platform, as it is crucial to designing
    scalable, performant solutions that combine data from one or more Salesforce instances.


    # Practice questions


    +   1. A *single source of truth* is otherwise known as what?

    +   2. What is the *source of record* MDM implementation method?

    +   3. What’s the difference between a consolidated golden record and the coexistence
    of the golden record when implementing MDM?

    +   4. In a simple point-to-point integration between Salesforce and one other
    system, where should the ID of the record in the other system (as linked to the
    Salesforce record) live?

    +   5. If no external registry is available and external system IDs are not to
    be stored in Salesforce, yet Salesforce is connected through a middleware to other
    systems, where is the ideal place to store record ID associations?


    # Answers


    +   1. A golden record.

    +   2. A single system being used by everyone for access to the same single set
    of information.

    +   3. A consolidated golden record is the initiator of change in connected systems.
    The coexistence of the golden record means any connected system may initiate a
    data update (bi-directional data sync).

    +   4. In Salesforce.

    +   5. In the middleware.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Further reading


