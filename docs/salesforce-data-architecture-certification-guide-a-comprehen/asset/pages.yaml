    need to demonstrate compliance when safeguarding people’s data according to a
    particular regulation or act of law. For example, a UK bank needs to adhere to
    the GDPR to safeguard customer data. If their Salesforce solution weren’t implemented
    with a consideration of the GDPR, they may be subject to fines and forced to take
    remedial action. Then, we covered practical tips on how we can adhere to certain
