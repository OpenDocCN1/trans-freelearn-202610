  \ SageMaker。然而，AWS 也在其 SDK 上提供了 KNN 算法的自己的实现，该实现针对在 AWS 环境中运行进行了优化。在这里，KNN 是内置算法的一个例子。\n\
  \n正如你所见，AWS 上的可能性是无穷无尽的，因为你既可以利用内置算法，也可以将自己的算法带入 SageMaker 来创建模型。最后，为了非常明确，这里是如何从\
