  \ logs\n\n在本节中，我们学习了如何实现 Amazon Rekognition AI 服务来检测图像中的对象并为每个对象提供置信度分数。我们将在后续章节中看到\
  \ Amazon Rekognition 的更多用例，当我们检测图像中的文本时。在下一节中，我们将学习 Amazon 的文本转语音服务并实现它。\n\n###\
  \ Text to speech with Amazon Polly\n\nAmazon Polly 负责将文本转换为语音，并使用预训练的深度学习模型来实现。它是一个完全托管的服务，因此我们无需做任何事情。你提供纯文本作为合成的输入，或以语音合成标记语言\
  \ Speech Synthesis Markup Language (SSML) 格式提供，以便返回音频流。它还提供多种语言和语音选择，包括男性和女性选项。Amazon\
  \ Polly 的输出音频可以以 MP3 格式保存以供应用程序（Web 或移动）进一步使用，也可以是用于书面语音的 JSON 输出。\n\n例如，如果我们将文本\
  \ “Baba went to the library” 输入到 Amazon Polly，输出语音标记对象将如下所示：\n\n```\n{\"time\":370,\"\
  type\":\"word\",\"start\":5,\"end\":9,\"value\":\"went\"}\n```\n\n单词 “went” 在音频流开始后\
  \ 370 毫秒开始，并在给定的输入文本的字节 5 开始、字节 9 结束。\n\n它还以 `ogg_vorbis` 和 `pcm` 格式返回输出。当使用 `pcm`\
  \ 时，返回的内容是 audio/pcm，采用有符号 16 位、1 通道（单声道）、小端格式。\n\nAmazon Polly 的一些常见用途如下：\n\n+\
  \   - 可用作阅读网页内容的辅助工具。\n+   - 可与 Amazon Rekognition 集成以帮助视障人士阅读标志。你可以用文字拍照并将其馈送到\
  \ Amazon Rekognition 以提取文本。输出文本可作为 Polly 的输入，它将返回语音输出。\n+   - 可用于公共广播系统，管理员团队只需传递要广播的文本，Amazon\
  \ Polly 即可完成其余工作。\n+   - 通过将 Amazon Polly 与 **Amazon Connect**（电话后端服务）结合，你可以构建 **audio/video\
  \ receiver (AVR)** 系统。\n+   - 诸如智能电视、智能手表和 **Internet of Things (IoT)** 设备等智能设备可将其用于音频输出。\n\
  +   - 旁白生成。\n+   - 与 Amazon Lex 结合时，可为应用程序开发功能齐全的语音用户界面。\n\n现在，让我们探索 Amazon Polly\
  \ 的优势。\n\n### Exploring the benefits of Amazon Polly\n\n使用 Amazon Polly 的一些优势如下：\n\
  \n+   - 该服务是完全托管的，不需要任何管理成本来维护或管理资源。\n+   - 它提供即时语音校正和增强功能。\n+   - 你可以使用 Amazon\
  \ Polly 的 HTTP API 开发自己的访问层。由于支持大量语言，如 Python、Ruby、Go、C++、Java 和 Node.js，开发变得简单。\n\
  +   - 对于某些神经语音，可以使用 Newscaster 风格进行语音合成，使其听起来像电视或广播播音员。\n+   - Amazon Polly 还允许你修改特定单词的发音或使用新单词。\n\
  \n接下来，我们将亲手操作 Amazon Polly。\n\n### Getting hands-on with Amazon Polly\n\n在本节中，我们将构建一个管道，将\
  \ AWS Lambda 与 Amazon Polly 集成以读取文本文件，然后将相同的 MP3 文件生成到同一存储桶的另一个文件夹中。我们将在 CloudWatch\
  \ 日志中监控任务进度。\n\n我们将首先为 Lambda 创建一个 IAM 角色。让我们开始：\n\n+   1. 导航到 IAM 控制台页面。\n+   2.\
  \ 从左侧菜单选择 Roles。\n+   3. 选择 Create role。\n+   4. 选择 Lambda 作为受信任实体。\n+   5. 添加以下托管策略：\n\
  +      - AmazonS3FullAccess\n+      - AmazonPollyFullAccess\n+      - CloudWatchFullAccess\n\
  +   6. 将角色保存为 polly-lambda-role。\n\n接下来，我们将创建一个 Lambda 函数：\n\n+   1. 导航到 Lambda\
  \ > Functions > Create Function。\n+      - 将函数命名为 polly-lambda\n+      - 将运行时设置为\
  \ python 3.6。\n+      - 使用现有角色；即 polly-lambda-role\n+   2. 将代码粘贴到 https://github.com/PacktPublishing/AWS-Certified-Machine-Learning-Specialty-MLS-C01-Certification-Guide/tree/master/Chapter-2/Amazon%20Rekognition%20Demo/lambda_code\
  \ 中到你的 lambda 函数中，并在 CloudWatch 控制台中检查其进度。我们将对该代码使用 Amazon Polly 的 start_speech_synthesis_task\
  \ API；它是一个异步合成任务。\n+   3. 向下滚动并在 Basic Settings 部分将 Timeout 更改为 59 秒，如以下屏幕截图所示，然后点击\
  \ Save：\n\n> **Important note**\n> 默认值为 3 秒。由于这是一个异步操作，任何重试尝试都会创建更多文件。\n\n\n\n\n\
  \nFigure 2.7 – Edit basic settings window\n\n现在，我们将创建一个桶来触发一个事件。\n\n+   4. 导航到 AWS\
  \ S3 控制台并创建一个名为 polly-test-baba 的桶。\n\n+   5. 创建一个名为 input-text 的文件夹（在此示例中，我们将只上传\
  \ .txt 文件）。\n\n6. 导航到 **Properties > Events > Add notification**。填写所需的字段，如下所示，然后单击\
