  ```\n\n你将在第 9 章《Amazon SageMaker 建模》中学习如何在 SageMaker 上创建模型。现在，只需了解 AWS 有自己的库集，其中实现了这些内置算法。\n\
  \n要训练和评估模型，你需要训练数据和测试数据。在实例化你的估计器之后，你应该用这些数据集为其提供数据。我不想剧透第 9 章《Amazon SageMaker\
  \ 建模》，但你应该提前了解数据通道的概念。\n\n数据通道是与输入数据相关的配置，你可以在创建训练作业时将其传递给 SageMaker。你应该设置这些配置，只是为了告知\
  \ SageMaker 你的输入数据的格式。\n\n在第 9 章《Amazon SageMaker 建模》中，你将学习如何创建训练作业以及如何设置数据通道。截至目前，你应该知道，在配置数据通道时，可以设置内容类型（ContentType）和输入模式（TrainingInputMode）。让我们更仔细地看看训练数据应该存储在何处以及如何存储，以便能够正确地与\
  \ AWS 的内置算法集成。\n\n\n\n\n\n### 存储训练数据\n\n首先，你可以使用多个 AWS 服务来为机器学习准备数据，例如 EMR、Redshift、Glue\
  \ 等。预处理训练数据后，你应该将其存储在 S3 中，采用算法期望的格式。下表显示了每种算法可接受的数据格式列表：\n\n| Data format | Algorithm\
  \ |\n| application/x-image | Object Detection Algorithm, Semantic Segmentation |\n\
