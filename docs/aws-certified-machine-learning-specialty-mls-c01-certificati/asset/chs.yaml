  \n我们几乎准备好了！现在，让我们快速了解一下一些建模定义，这将帮助你理解一些更高级的算法。\n\n### 关于集成模型的一点说明\n\n在开始深入研究算法之前，有一个重要的建模概念你应该了解，称为\
  \ **ensemble**。术语 ensemble 用于描述使用多个算法创建模型的方法。\n\n例如，与其创建一个模型来预测欺诈交易，你可以创建多个执行相同任务的模型，并使用一种投票系统来选择预测结果。下表说明了这个简单示例：\n\
  \n| Transaction | Model A | Model B | Model C | Prediction |\n|---|---|---|---|---|\n\
  | 1 | Fraud | Fraud | Not Fraud | Fraud |\n| 2 | Not Fraud | Not Fraud | Not Fraud\
  \ | Not Fraud |\n| 3 | Fraud | Fraud | Fraud | Fraud |\n| 4 | Not Fraud | Not Fraud\
  \ | Fraud | Not Fraud |\n\nFigure 7.2 – An example of a voting system on ensemble\
  \ methods\n\n同样的方法也适用于回归问题，其中，我们可以对每个模型的结果取平均值，并将其用作最终结果。\n\n投票和平均只是集成方法的两个例子。其他强大的技术包括\
  \ **blending** 和 **stacking**，其中你可以创建多个模型，并使用每个模型的结果作为主模型特征。回顾前面的表格，列 \"Model A\"\
  、\"Model B\" 和 \"Model C\" 将用作预测最终结果的特征。\n\n事实证明，许多机器学习算法在训练时以嵌入方式使用集成方法。这些算法可以分为两大类：\n\
  \n- **Bootstrapping Aggregation or Bagging**：采用这种方法，会在数据的不同样本上训练多个模型。然后，通过投票或平均系统进行预测。该类别的主要算法被称为\
  \ **Random Forest**。\n- **Boosting**：采用这种方法，会在数据的不同样本上训练多个模型。然后，一个模型试图通过惩罚错误预测来纠正下一个模型的错误。该类别的主要算法被称为\
  \ **Stochastic Gradient Boosting** 和 **AdaBoost**。\n\n现在你知道了集成模型是什么，让我们继续研究一些可能出现在你考试中的机器学习算法。并非所有算法都使用集成方法，但我相信这会让你更容易识别出来。\n\
  \n我们将根据 AWS 算法类别将接下来的几个部分拆分：\n\n- Supervised learning\n- Unsupervised learning\n\
  - Textual analysis\n- Image processing\n\n最后，我们将提供 AWS 中强化学习的概述。\n\n### Supervised\
  \ learning\n\nAWS 提供用于通用目的的监督学习算法（回归和分类任务）和用于更特定目的的监督学习算法（预测和向量化）。可在这些子类别中找到的内置算法列表如下：\n\
  \n- Linear learner algorithm\n- Factorization machines algorithm\n- XGBoost algorithm\n\
  - K-Nearest Neighbor algorithm\n- Object2Vec algorithm\n- DeepAR Forecasting algorithm\n\
  \n让我们从回归模型和线性学习算法开始。\n\n### 使用回归模型\n\n好吧；我知道现实问题通常既不线性也不简单。然而，研究 **linear regression**\
  \ 模型是了解 **regression models** 总体内部情况的好方法（是的，回归模型可以是线性和非线性的）。这是每个数据科学家必备的知识，也可以帮助你解决实际挑战。我们将在以下小节中更详细地研究这个问题。\n\
  \n### 介绍回归算法\n\n线性回归模型旨在根据一个或多个变量（X）预测数值（Y）。在数学上，我们可以将这种关系定义为 Y = f(X)，其中 Y 被称为因变量，X\
  \ 被称为自变量。\n\n对于回归模型，我们想要预测的成分（Y）始终是一个连续数字；例如，房屋价格或交易数量。我们在第 1 章《Machine Learning\
  \ Fundamentals》表 2 中看到过这一点，当时我们在根据目标变量选择合适的监督学习算法类型。我们可以随时回顾一下。\n\n当我们只使用一个变量来预测\
  \ Y 时，我们将此问题称为简单线性回归。另一方面，当我们使用多个变量来预测 Y 时，我们说我们有一个多元线性回归问题。\n\n还有另一类回归模型，称为非线性回归。然而，让我们先放下这个问题，理解简单线性回归的含义。\n\
  \n回归模型属于机器学习的监督侧（另一侧是非监督）因为算法试图根据自变量和因变量之间已有的相关性来预测值。\n\n但 Y=f(X) 中的 \"f\" 是什么意思？\"\
  f\" 是负责根据 X 预测 Y 的回归函数。换句话说，这就是我们想要弄清楚的函数！当我们开始谈论简单线性回归时，请注意以下三个问题和答案：\n\n1. 线性回归中\
  \ \"f\" 的形状是什么？\n   线性的，当然！\n2. 我们如何表示线性关系？\n   使用一条直线（你将在几分钟内明白原因）。\n3. 那么，定义一条线的函数是什么？\n\
  \   ax + b（只需查看任何数学书籍）。\n\n就是这样！线性回归模型由 y = ax + b 给出。一旦我们试图根据 X 预测 Y，我们只需要找出 \"\
  a\" 和 \"b\" 的值。我们可以采用相同的逻辑来弄清楚其他种类回归的内部原理。\n\n\n\n\n\n而且相信我，找出“a”和“b”的值并不是我们要做的唯一事情。知道“a”也被称为**alpha系数**，或**斜率**，并代表线的倾斜度，而“b”也被称为**beta系数**，或**y截距**，并代表线在由\
  \ x 和 y 组成的二维平面中与 y 轴相交的位置，这很有用。你将在下一小节看到这两个术语。\n\n另外值得知道的是，每一个我们无法控制的预测因子都存在一个误差。让我们将其命名为“e”，并正式定义简单线性回归为\
  \ **y = a x + b + e**。在数学上，该误差由预测值与真实值之间的差异表示。\n\n好吧，让我们找到 alpha 和 beta 并给本节一个圆满的结局！\n\
  \n### 最小二乘法\n\n有不同的方法可以找到一条线的斜率和 y 截距，但最常用的方法被称为**最小二乘法**。该方法背后的原理很简单：我们必须找到*能减少平方误差之和的最佳直线*。\n\
  \n在下面的图中，我们可以看到一个包含多个点和线的笛卡尔平面。“线 a”代表该数据的最佳拟合——换句话说，这就是这些点的最佳线性回归函数。但我怎么知道呢？很简单：如果我们计算每个点相关的误差，就像我们在下面的图中放大显示的那样，我们会意识到“线\
  \ a”包含最小的平方误差之和：\n\n![](img/209e007237d34506e7ba16180f2e905c_228_0.png)\n\n图 7.3\
  \ – 可视化最小二乘法的原理\n\n从头开始理解线性回归是有价值的，不仅是为了认证考试，更主要的是为了你作为数据科学家的职业生涯。为了给你一个完整的示例，我们开发了一张包含我们将要逐步看到的所有计算的电子表格！我们鼓励你使用这份支持材料并进行一些模拟。让我们看看实际效果。\n\
  \n### 从头开始创建线性回归模型\n\n我们将使用一个非常简单的数据集，只包含两个变量：\n\n- X：代表个人的工作年限\n- Y：代表个人的平均薪资\n\
  \n我们想要了解 X 和 Y 之间的关系，如果可能的话，基于工作年限 X 预测薪资 Y。正如我之前提到的，通常，真实问题有更多独立变量，并且不一定是线性的。然而，我相信这个示例将给你掌握更复杂算法所需的基准知识。\n\
  \n要找出 alpha 和 beta 系数，也就是斜率和 y 截距，如果你愿意的话，我们需要找到与数据集相关的一些统计数据，所以让我们看看这里显示的数据和辅助统计数据：\n\
  \n| X (自变量) | Y (因变量) | X 均值 | Y 均值 | 协方差 (X,Y) | X 方差 | Y 方差 |\n|---|---|---|---|---|---|---|\n\
  | 1 | 1,000 |  |  | 21,015 | 20 | 21,808,900 |\n| 2 | 1,500 |  |  | 14,595 | 12\
  \ | 17,388,900 |\n| 3 | 3,700 |  |  | 4,925 | 6 | 3,880,900 |\n| 4 | 5,000 |  |\
  \  | 1,005 | 2 | 448,900 |\n| 5 | 4,000 |  |  | 895 | 0 | 2,788,900 |\n| 6 | 6,500\
  \ |  |  | 145 | 0 | 688,900 |\n| 7 | 7,000 |  |  | 1,995 | 2 | 1,768,900 |\n| 8\
  \ | 9,000 |  |  | 8,325 | 6 | 11,088,900 |\n| 9 | 9,000 |  |  | 11,655 | 12 | 11,088,900\
  \ |\n| 10 | 10,000 |  |  | 19,485 | 20 | 18,748,900 |\n| COUNT | 10 | 550 | 567,000\
  \ | 842,500 | 825 | 897,010,000 |\n\n图 7.4 – 基于工作年限预测平均薪资的数据集\n\n正如我们所见，X 和 Y 之间存在几乎完美的线性关系。随着工作年限的增加，薪资也随之增加。除了\
  \ X 和 Y 之外，我们还需要计算以下统计数据：记录数、X 的均值、Y 的均值、X 和 Y 的协方差、X 的方差以及 Y 的方差。以下公式分别提供了方差和协方差的数学表示，其中\
  \ x  bar、y  bar 和 n 分别代表 X 的均值、Y 的均值和记录数：\n\n```\ns² = Σ(xᵢ - x̄) / n\n\nCov(X,\
  \ Y) = Σᵢ=1ⁿ (xᵢ - x̄)(yᵢ - ȳ) / n\n```\n\n如果你想查看表 7.2 中这些辅助统计数据的每个公式的计算细节，请参考随本书提供的支持材料。在那里，你会发现这些公式已经为你实现。\n\
  \n这些统计数据很重要，因为它们将被用来计算我们的 alpha 和 beta 系数。下面的图像解释了我们将如何计算这两个系数，以及相关系数 R 和 R 平方。这最后两个指标将让我们了解模型的优劣，其中模型越接近\
  \ 1，模型越好：\n\n![](img/209e007237d34506e7ba16180f2e905c_230_0.png)\n\n图 7.5 – 计算简单线性回归系数的方程\n\
  \n应用这些公式后，我们将得到以下结果：\n\n| 系数 | 描述 | 值 |\n|---|---|---|\n| Alpha | 线倾斜度 | 1,021,212,121\
  \ |\n| Beta | 截距 | 53 |\n| R | 相关性 | 0,979,364,354 |\n| R^2 | 决定系数 | 0,959,154,538\
  \ |\n\n图 7.6 – 寻找回归系数\n\n上表已经包含了我们需要的所有信息，以便对新数据进行预测。如果我们在原始方程 y = ax + b + e 中替换系数，我们将发现回归公式如下：\n\
  \nY = 1021,212 * X + 53,3\n\n从这一点开始，要进行预测，我们所要做的就是用工作年限的数值替换 X。结果，我们将得到 Y，即预测薪资。我们可以在下面的图中看到模型拟合，以及图\
  \ 7.8 中的一些模型预测：\n\n![](img/209e007237d34506e7ba16180f2e905c_231_0.png)\n\n图 7.7\
  \ – 将数据拟合到回归方程中\n\n我们在这里看到预测值：\n\n| 输入 | 预测 | 误差 |\n|---|---|---|\n| 1 | 1,075 |\
  \ 75 |\n| 2 | 2,096 | 596 |\n| 3 | 3,117 | - 583 |\n| 4 | 4,138 | - 862 |\n| 4 |\
  \ 5,159 | 1,159 |\n| 5 | 6,181 | - 319 |\n| 6 | 7,202 | 202 |\n| 7 | 8,223 | - 777\
  \ |\n| 8 | 9,244 | 244 |\n| 9 | 10,265 | 265 |\n| 10 | 11,287 |  |\n| 11 | 12,308\
  \ |  |\n| 12 | 13,329 |  |\n| 13 | 14,350 |  |\n| 14 | 15,372 |  |\n| 15 | 16,393\
  \ |  |\n| 16 | 17,414 |  |\n| 17 | 18,435 |  |\n| 18 | 19,456 |  |\n| 19 | 20,478\
  \ |  |\n\n图 7.8 – 模型预测\n\n当你分析回归模型时，你应该能够理解你的模型质量好坏。我们在第 1 章《机器学习基础》中讨论了许多建模问题，例如过拟合，你已经知道你总是必须检查模型性能。\n\
  \n回归模型的一个良好方法是执行所谓的**残差分析**。在这里，我们将模型的误差绘制在散点图中，并检查它们是否如预期般随机分布，或不是。如果误差*不是*随机分布，这意味着你的模型无法泛化数据。下面的图显示了我们示例的残差分析：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_233_0.png)\n\n这里的结论是误差是随机分布的。这样的证据，加上较高的\
  \ R 平方评级，可以作为支持使用该模型的论据。\n\n**重要说明**\n在*第 8 章，评估和优化模型*中，我们将学习关于评估指标的知识。例如，我们将了解到每种类型的模型可能都有其自己的评估指标集。回归模型通常使用**均方误差\
  \ (MSE)** 和**均方根误差 (RMSE)** 进行评估。换句话说，除了 R、R 平方和残差分析之外，理想情况下，你将把模型在测试集上执行以提取其他性能指标。你甚至可以使用交叉验证系统来检查模型性能，就像我们在*第\
  \ 1 章，机器学习基础*中学到的那样。\n\n\n\n\n\n非常频繁地，当模型残差呈现出模式且并非随机分布时，这通常是因为数据中存在的关联并非线性，而是非线性，因此必须采用另一种建模技术。现在，让我们来看看如何解读模型的結果。\n\
  \n### 解读回归模型\n\n了解如何解读线性回归模型也是很有帮助的。有时，我们使用线性回归并非一定是为了创建预测模型，而是为了进行回归分析，在其中我们可以理解自变量与因变量之间的关系。\n\
  \n回顾我们的回归方程（Y = 1021.2 * X + 53.3），我们可以看到两个项：alpha 或斜率（1021.2）和 beta 或 y 截距（53.3）。我们可以这样解读该模型：每增加一年的工作经验，你的薪水将增加\
  \ $1,021.3 美元。此外，请注意，当“工作年限”等于零时，预计薪水将为 $53.3 美元（这是我们直线与 y 轴相交的点）。\n\n从一般角度来看，你的回归分析应回答以下问题：对于自变量（斜率）增加的每个额外单位，因变量的平均变化是多少？请做笔记并确保你知道如何解读简单线性回归模型——作为一名数据科学家，你的日常活动中这是非常重要的一件事！让我们继续，看看关于线性回归的一些最终考虑。\n\
  \n### 检查调整后 R 平方\n\n到目前为止，我希望你对回归模型有了更深入的了解！还有一个非常重要的话题，无论它是否会在考试中出现，你都应该了解，那就是模型的简约性方面。\n\
  \n我们已经在第 1 章《机器学习基础》中谈到过简约性。这是指你优先选择简单模型而非复杂模型的能力。研究回归模型时，你可能需要使用多个特征来预测结果。这也被称为多元回归模型。\n\
  \n在这种情况下，R 和 R 平方系数倾向于奖励具有更多特征的更复杂模型。换句话说，如果你不断向多元回归模型中添加新特征，你将得到更高的 R 和 R 平方系数。这就是为什么你不能仅基于这两个指标来做出决策。\n\
  \n另一个你可以使用的额外指标（除了 R、R 平方、MSE 和 RMSE）被称为 **调整后 R 平方**。当我们向模型中添加不带来任何实际增益的额外特征时，该指标会被惩罚。在下面的表格中，我们举了一个假设的例子，只是为了向你展示何时开始失去简约性：\n\
  \n| 特征数量 | R 平方 | 调整后 R 平方 |\n|---|---|---|\n| 1 | 81 | 79 |\n| 2 | 83 | 82 |\n\
  | 3 | 88 | 87 |\n| 4 | 90 | 86 |\n| 5 | 92 | 85 |\n\n图 7.10 – 比较 R 平方和调整后 R 平方\n\
  \n在这里，我们可以得出结论，保持模型中的三个变量比保持四个或五个变量更好。将四个或五个变量添加到该模型中会增加 R 平方（正如预期的那样），但会降低调整后 R\
  \ 平方。\n\n好吧；到目前为止，你应该对回归模型有非常好的理解。现在，让我们看看 AWS 在此类模型方面提供的内置算法。这对你的考试很重要，所以让我们来看看。\n\
  \n### AWS 上的回归建模\n\nAWS 有一个内置算法称为 **线性学习器**，我们可以在其中实现线性回归模型。内置的线性学习器使用 **随机梯度下降（SGD）**\
  \ 来训练模型。\n\n> **重要提示**\n> 我们在谈论神经网络时会更深入地学习 SGD。现在，我们可以将 SGD 看作是另一种替代我们刚刚剖析的流行的最小二乘误差方法。\n\
  \n线性学习器内置算法提供了一个可以在训练过程之前对数据进行归一化的超参数。该超参数的名称是 `normalize_data`。这非常有帮助，因为线性模型对数据的尺度很敏感，通常会利用数据归一化。\n\
  \n> **重要提示**\n> 我们在 *第 3 章，数据准备和转换* 中谈到了数据归一化。如果需要，请复习该章节。\n\n线性学习器算法的其他重要超参数是 **L1**\
  \ 和 **wd**，它们分别扮演 **L1 正则化** 和 **L2 正则化** 的角色。\n\nL1 和 L2 正则化有助于线性学习器（或任何其他回归算法实现）避免过拟合。传统上，我们称实现\
  \ L1 正则化的回归模型为 **Lasso 回归** 模型，而对于具有 L2 正则化的回归模型，我们称之为 **Ridge 回归** 模型。\n\n虽然听起来可能很复杂，但实际上并非如此！实际上，回归模型方程仍然相同；即\
  \ **y = ax + b + e**。变化在于损失函数，该函数用于找到最能最小化误差的系数。如果你回顾图 7.3，你会看到我们已将误差函数定义为 **e =\
  \ (ŷ - y)2**，其中 **ŷ** 是回归函数值，**y** 是真实值。\n\nL1 和 L2 正则化在损失函数中添加了惩罚项，如下公式所示（请注意我们用\
  \ ax + b 替换了 ŷ）：\n\nL₁ = ( a x + b − y )² + λ | a |\n\nL₂ = ( a x + b − y )² + λ\
  \ a²\n\nλ（lambda）参数必须大于 0 并且需要手动调优。非常高的 lambda 值可能会导致欠拟合问题，而非常低的 lambda 可能不会在最终结果中产生明显的改变（如果你的模型过拟合，它将保持过拟合）。\n\
  \n在实践中，L1 和 L2 正则化之间的主要区别在于 L1 会将不重要的系数收缩为零，从而迫使该特征被丢弃（充当特征选择器）。换句话说，如果你的模型因特征数量过多而过拟合，L1\
  \ 正则化应该可以帮助你解决这个问题。\n\n> **重要提示**\n> 在考试期间，请记住 L1 和 L2 正则化的基础，特别是在它们之间的关键区别，其中 L1\
  \ 作为特征选择器效果很好。\n\n最后但并非最不重要的一点是，许多内置算法可以用于多种建模目的。线性学习器算法可用于回归、二元分类和多类分类。确保你在考试期间记住这一点（它\
  \ *不仅仅* 是关于回归模型）。\n\n继续沿着这个方向，AWS 还有其他内置算法可用于回归和分类问题；即 **因子分解机、K 近邻（KNN）** 和 **XGBoost**\
  \ 算法。由于这些算法也可以用于分类目的，我们将在关于分类算法的部分中介绍它们。\n\n> **重要提示**\n> 你刚刚获得了一个在考试期间需要记住的非常重要的提示：线性学习器、因子分解机、K\
  \ 近邻和 XGBoost 都适用于回归和分类问题。这些算法通常被称为通用算法。\n\n至此，我们已经完成了本节关于回归模型的介绍。我希望你喜欢它；在参加考试之前，请记得查看我们的支持材料。顺便说一下，你可以在日常活动中也使用该参考资料！现在，让我们继续另一个经典的机器学习问题示例：分类模型。\n\
  \n### 处理分类模型\n\n你在本书中一直在学习分类模型是什么。然而，现在，我们将讨论一些适合分类问题的算法。请记住，外面有数百种分类算法，但由于我们正在为\
  \ AWS 机器学习专业考试做准备，我们将介绍 AWS 预先构建的那些。\n\n我们已经知道线性学习器做什么（并且我们知道它适用于回归和分类任务），所以让我们来看看其他通用目的的内置算法（包括分类任务）。\n\
  \n我们将从 **因子分解机** 开始。因子分解机被认为是对线性学习器的扩展，优化用于在高维稀疏数据集中找到特征之间的关系。\n\n> **重要提示**\n>\
  \ 因子分解机的一个非常传统的用例是 *推荐系统*，其中我们通常在数据中具有高水平的稀疏性。在考试期间，如果你面临一个通用问题（回归或二元分类任务），并且底层数据集是稀疏的，那么从算法角度来看，因子分解机可能是最好的答案。\n\
  \n\n\n\n\n当我们在回归模型中使用 Factorization Machines 时，**均方根误差 (RMSE)** 将用于评估模型。另一方面，在二元分类模式下，算法将使用对数损失、准确率和\
  \ F1 分数来评估结果。我们将在 *第 8 章，评估和优化模型* 中对评估指标进行更深入的讨论。\n\n你应该注意，Factorization Machines\
  \ 仅接受 **recordIO-protobuf** 格式的输入数据。这是因为数据稀疏性问题，recordIO-protobuf 在数据处理方面比 text/.csv\
  \ 格式做得更好。\n\n下一个适用于分类问题的内置算法被称为 K-最近邻，或简称为 KNN。顾名思义，该算法会尝试找到与输入数据最接近的 K 个点，并返回以下预测之一：\n\
  \n- 如果是分类任务，则为 k 个最近点中最常出现的类别\n- 如果是回归任务，则为 k 个最近点标签的平均值\n\n我们说 KNN 是一个 **基于索引的算法**，因为它计算点之间的距离，为这些点分配索引，然后存储排序后的距离及其索引。有了这种类型的数据结构，KNN\
  \ 可以轻松选择前 K 个最近点来做出最终预测。\n\n请注意，K 是一个 KNN 的超参数，应在建模过程中进行优化。\n\n另一个可用于通用目的的 AWS 内置算法，包括分类，被称为\
  \ **eXtreme Gradient Boosting**，或简称为 **XGBoost**。这是一个基于集成决策树的模型。\n\nXGBoost 使用一组\
  \ **较弱** 的模型（决策树）来预测目标变量，可以是回归任务、二元分类或多分类。这是一个非常流行的算法，已被顶尖选手在机器学习竞赛中使用。\n\nXGBoost\
  \ 在添加新树时使用梯度下降算法来最小化损失，使用梯度下降学习策略，即一个模型试图纠正前一个模型的错误。它之所以被称为“gradient”，是因为它使用了梯度下降算法。\n\
  \n> **重要说明**\n> 在此上下文中，术语 weaker 用于描述非常简单的决策树。\n\n尽管 XGBoost 比单个决策树更稳健，但在考试中进入时，清楚地了解决策树是什么及其主要配置仍然很重要。顺便说一下，它们是许多集成算法的基础模型，例如\
  \ AdaBoost、Random Forest、Gradient Boost 和 XGBoost。\n\n决策树是基于规则的算法，以树的<|message|>\
  \ 组织决策，如下图所示：\n\n![](img/209e007237d34506e7ba16180f2e905c_239_0.png)\n\n图 7.11 –\
  \ 决策树模型示例\n\n它们由根节点（树的顶部）、中间或决策节点（树的中间）以及叶节点（底部无分裂的节点）组成。树的深度由根节点与最末叶节点之间的差异给出。例如，在前面的图中，树的深度为\
  \ 3。\n\n树的深度是此类模型最重要的超参数之一，通常称为 max depth。换句话说，max depth 控制决策树可以达到的最大深度。\n\n决策树模型的另一个非常重要的超参数被称为叶节点中的最小样本/观测数。它也用于控制树的生长。\n\
  \n决策树还有许多其他类型的超参数，但这两种对于控制模型的过拟合尤其重要。深度较高或叶节点中观测数非常少的决策树在外推/预测期间很可能遇到问题。\n\n原因很简单：决策树使用叶节点的数据进行预测，基于属于该节点的每个观测/目标变量的比例（对于分类任务）或平均值（对于回归任务）。因此，节点应有足够的数据以便在训练集之外做出良好预测。\n\
  \n如果你在考试中遇到 **CART** 术语，你应该知道它代表 **Classification and Regression Trees**，因为决策树可用于分类和回归任务。\n\
  \n为了选择最佳变量来分割树中的数据，模型会选择那些最大化目标变量在节点间分离的变量。此任务可以通过不同方法执行，例如 **Gini** 和 **信息增益**。\n\
  \n### 预测模型\n\n**时间序列**，或简称为 **TS**，是指以规律方式收集且具有有序依赖的数据点。时间序列具有度量、事实和时间单位，如下图所示：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_240_0.png)\n\n图 7.12 – 时间序列陈述\n\n此外，时间序列可分为\
  \ **单变量** 或 **多变量**。单变量时间序列在一段时间内只有一个变量相关，而多变量时间序列在一段时间内有两个或多个变量相关。以下图表显示了我们在前一图像中展示的单变量时间序列：\n\
  \n### 每日批准提案数\n\n![](img/209e007237d34506e7ba16180f2e905c_241_0.png)\n\n图 7.13 –\
  \ 时间序列示例\n\n时间序列可分解如下：\n\n- **观测值** 或 **水平**：序列的平均值\n- **趋势**：递增、递减模式（有时没有趋势）\n\
  - **季节性**：特定时间段的规律性峰值（有时没有季节性）\n- **噪声**：我们无法解释的东西\n\n有时，我们还可以在序列中找到孤立的峰值，无法在预测模型中捕捉。在这种情况下，我们可能希望将这些峰值视为异常值。以下是前面图表中显示的时间序列的分解：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_242_0.png)\n\n图 7.14 – 时间序列分解\n\n还值得强调的是，我们可以使用\
  \ **加法** 或 **乘法** 方法来分解时间序列。加法模型表明你的时间序列 *加上* 每个分量来解释目标变量；即，**y(t) = level + trend\
  \ + seasonality + noise.**\n\n乘法模型则表明你的时间序列 *乘以* 每个分量来解释目标变量；即，**y(t) = level *\
  \ trend * seasonality * noise.**\n\n在下一节中，我们将更仔细地查看时间序列分量。\n\n### 检查时间序列的平稳性\n\n\
  分解时间序列并了解其分量如何在加法和乘法模型中相互作用是一项伟大的成就！然而，我们学得越多，就越质疑自己。也许你已经意识到，没有趋势和季节性的时间序列比具有所有这些分量的时间序列更容易预测！\n\
  \n这自然是正确的。如果你不需要理解趋势和季节性，如果你无法控制噪声，你所要做的就是探索观测值并找到它们之间的回归关系。\n\n我们将一段时间内均值和方差恒定的时间序列称为\
  \ **平稳**。通常，*具有* 趋势和季节性的时间序列 *不是* 平稳的。可以对序列应用数据转换，将其转换为平稳时间序列，从而使建模任务变得更容易。这种类型的转换称为\
  \ **差分**。\n\n当你探索时间序列时，可以通过应用假设检验来检查平稳性，例如 **Dickey-Fuller**、**KPSS** 和 **Philips-Perron**，仅举几例。如果你发现它是非平稳的，那么你可以应用差分使其成为平稳时间序列。一些算法已经内置了这种能力。\n\
  \n### 探索、探索、再探索\n\n到目前为止，我相信我不必提醒你，探索任务在数据科学中无时不在。这里也不例外。当你构建时间序列模型时，你可能想要查看数据并检查它是否适合这种类型的建模。\n\
  \n**自相关图** 是你可用于时间序列分析的工具之一。自相关图允许你检查时间序列中滞后之间的相关性。以下图表显示了这种可视化的示例：\n\n![](img/209e007237d34506e7ba16180f2e905c_243_0.png)\n\
  \n图 7.15 – 自相关图\n\n记住，如果你正在处理单变量时间序列，你的时间序列只有一个变量，因此在你的唯一变量的滞后之间寻找自相关对于理解你是否可以构建一个好的模型至关重要。\n\
  \n\n\n\n\n而且是的，有时会出现你面前没有时间序列的情况。此外，无论你如何努力，你都无法将此数据建模为时间序列。这种类型的数据通常被称为 **白噪声**。\n\
  \n另一种我们无法预测的序列被称为 **随机游走**。随机游走本质上是随机的，但它们依赖于之前的时间步。例如，随机游走的下一个点可能是一个介于 0 和 1 之间的随机数，并且也是序列的最后一个点。\n\
  \n> **重要说明**\n> 如果你在考试中遇到这些术语，请小心并记住将它们与时间序列中的随机性联系起来。\n\n至此，我们已经涵盖了时间序列建模的主要理论。你还应该知道，目前用于处理时间序列的最流行算法被称为\
  \ **自回归积分滑动平均 (ARIMA)** 和 **指数平滑 (ETS)**。我们不会查看这两种模型的细节。相反，我们将看看 AWS 在时间序列建模方面能为我们提供什么。\n\
  \n### 理解 DeepAR\n\n**DeepAR** 预测算法是内置于 SageMaker 的算法，用于使用 **循环神经网络 (RNN)** 预测一维时间序列。\n\
  \n传统的时序算法，如 ARIMA 和 ETS，都是为每个时间序列拟合一个模型。例如，如果你想按地区预测销售额，你可能需要为每个地区创建一个模型，因为每个地区的销售行为可能不同。另一方面，DeepAR\
  \ 允许你在单个模型中操作多个时间序列，这对于更复杂的使用场景来说似乎是一个巨大的优势。\n\nDeepAR 的输入数据，如预期的一样，是一个或多个时间序列。这些时间序列中的每一个都可以与以下内容相关联：\n\
  \n- 由 `cat` 字段控制的静态（与时间无关）分类特征向量\n- 由 `dynamic_feat` 控制的动态（与时间相关）时间序列向量\n\n> **重要说明**\n\
  > 在多个时间序列上进行训练和预测的能力与静态分类特征向量密切相关。在定义 DeepAR 将训练的时间序列时，你可以设置分类变量来指定每个时间序列所属的组。\n\
  \nDeepAR 的两个主要超参数是 context_length，用于控制模型在训练过程中可以看到的过去范围，以及 prediction_length，用于控制模型将输出预测的未来范围。\n\
  \nDeepAR 还可以处理缺失值，在这种情况下是指时间序列中存在的间隙。DeepAR 的一个非常有趣的功能是它能够从时间序列中创建派生特征。这些派生特征由基本时间频率创建，有助于算法学习时间依赖模式。下表显示了\
  \ DeepAR 根据其训练的时间序列类型创建的所有派生特征：\n\n| 时间序列的频率 | 派生特征 |\n|---|---|\n| Minute | Minute-of-hour,\
  \ hour-of-day, day-of-week, day-of-month, day-of-year |\n| Hour | Hour-of-day, day-of-week,\
  \ day-of-month, day-of-year |\n| Day | Day-of-week, day-of-month, day-of-year |\n\
  | Week | Day-of-month, week-of-year |\n| Month | Month-of-year |\n\nFigure 7.16\
  \ – DeepAR derived features per frequency of time series\n\n我们现在已经完成了关于预测模型的这一部分。接下来，我们将查看关于监督学习的最后一个算法；即\
  \ Object2Vec 算法。\n\n### Object2Vec\n\nObject2Vec 是内置于 SageMaker 的算法，它推广了众所周知的 word2vec\
  \ 算法。Object2Vec 用于为高多维对象创建嵌入空间。这些嵌入空间根据定义是原始对象的压缩表示，可用于多种目的，例如特征工程或对象比较：\n\n![](img/209e007237d34506e7ba16180f2e905c_245_0.png)\n\
  \nFigure 7.17 – A visual example of an embedding space\n\n上图说明了我们所说的嵌入空间。神经网络模型的第一个和最后一个层只是将输入数据映射到自身（由相同向量大小表示）。\n\
  \n当我们继续进入模型的内部层时，数据会被越来越压缩，直到达到该架构中间的层，即嵌入层。在该特定层中，我们有一个较小的向量，旨在成为第一层中高维原始向量的准确且压缩的表示。\n\
  \n至此，我们刚刚完成了 AWS 中机器学习算法的第一部分。接下来，我们将查看一些无监督算法。\n\n### 无监督学习\n\nAWS 为以下任务提供了几种无监督学习算法：\n\
  \n- 聚类：\n  - K-means algorithm\n- 降维：\n  - **主成分分析 (PCA)**\n- 模式识别：\n  - IP Insights\n\
  - 异常检测：\n  - **随机切割森林算法 (RCF)**\n\n让我们从聚类开始谈起，以及最流行的聚类算法是如何工作的：K-means。\n\n### 聚类\n\
  \n聚类算法在数据科学中非常流行。基本上，它们旨在识别给定数据集中的组。从技术上讲，我们称这些发现或组为 **簇**。聚类算法属于非监督学习领域，这意味着它们不需要标签或响应变量进行训练。\n\
  \n这太棒了，因为标记数据曾经稀缺。然而，它也带来了一些限制。主要问题是聚类算法会为你提供簇，但不会提供每个簇的含义。因此，作为领域专家的人必须分析每个簇的属性来定义它们的含义。\n\
  \n有许多类型的聚类方法，例如层次聚类和划分聚类。在每种方法中，我们都会找到几种算法。然而，**K-Means** 可能是最流行的聚类算法，你很可能在考试中遇到它，所以让我们更仔细地看看它。\n\
  \n当我们使用 K-means 时，我们 somehow 必须指定要创建的簇的数量。然后，我们必须将数据点分配到每个簇中，以便每个数据点属于单个簇。这正是我们在聚类过程结束时期望的结果！\n\
  \n你作为用户，必须指定要创建的簇的数量并将其传递给 K-means。然后，算法将随机初始化每个簇的中心点，这也称为 **质心** 初始化。\n\n一旦我们有了每个簇的质心，我们需要做的就是为每个数据点分配一个簇。为此，我们必须使用邻近或距离度量！让我们采用距离度量这个术语。\n\
  \n**距离度量** 负责计算数据点与质心之间的距离。数据点将属于距离度量下更接近的簇质心！\n\n最知名且最常用的距离度量称为 **欧几里得距离**，其背后的数学非常简单：想象你的数据集的点由两个维度\
  \ X 和 Y 组成。因此，我们可以将点 a 和 b 视为如下：\n\n- a (X=1, Y=1)\n- b (X=2, Y=5)\n\n点 a 和 b 之间的欧几里得距离由以下公式给出，其中\
  \ X1 和 Y1 指点 a 的值，X2 和 Y2 指点 b 的值：\n\nDist = √((x₁ − x₂)² + (y₁ − y₂)²)\n\n相同的函数可以通过以下方程进行概括：√[∑ᵢ₌₁ⁿ\
  \ (xᵢ − yᵢ)²]\n\n一旦我们完成了此过程并为每个数据点分配了一个簇，我们就必须重新计算簇质心。此过程可以通过不同的方法完成，例如 **单链接**、**平均链接**\
  \ 和 **完全链接**。\n\n\n\n\n\n由于这个质心刷新，我们必须不断检查每个数据点最近的簇并不断刷新质心。我们必须**迭代地**重新执行步骤 1 和\
  \ 2，直到簇质心收敛或达到允许的最大迭代次数。\n\n好的；让我们回顾一下构成 K-means 方法的组件：\n\n- 质心初始化、簇分配、质心刷新，然后重复最后两个步骤直到收敛。\n\
  - 算法本身：\n- 用于将数据点分配到每个簇的距离度量：\n- 我们在这里选择了欧几里得距离。\n- 用于重新计算簇质心的链接方法：\n- 为了演示的目的，我们将选择平均链接。\n\
  \n有了这些定义，我们就可以逐步走过我们的真实示例。与我们的回归模型一样，一些支持材料也供您参考。\n\n### 逐步计算 K-means\n\n在这个示例中，我们将在一个非常小的数据集上模拟\
  \ K-means，只有两列（x 和 y）和六个数据点（A、B、C、D、E、F），如以下表格中定义：\n\n**迭代输入**\n| Point | x | y\
  \ |\n|---|---|---|\n| A | 1 | 1 |\n| B | 2 | 2 |\n| C | 5 | 5 |\n| D | 5 | 6 |\n\
  | E | 1 | 5 |\n| F | 2 | 6 |\n| Cluster 1 | 1 | 1 |\n| Cluster 2 | 2 | 2 |\n| Cluster\
  \ 3 | 5 | 5 |\n\nFigure 7.18 – Input data for K-means\n\n在前面的表格中，我们创建了三个簇，其质心如下：（1,1）、（2,2）、（5,5）。簇的数量（3）在先验中定义，每个簇的质心是随机定义的。以下图表显示了我们现在所在的算法阶段：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_249_0.png)\n\nFigure 7.19 – Plotting\
  \ the K-means results before completing the first iteration\n\n在这里，你看不到点 A、B 和 C，因为它们与簇质心重叠，但不用担心——它们很快就会出现。我们现在要做的是计算每个数据点到每个簇质心的距离。然后，我们需要选择最接近每个点的簇：\n\
  \n| Iteration processing |\n| xc1 | yc1 | xc2 | yc2 | xc3 | yc3 | distance-c1 |\
  \ distance-c2 | distance-c3 | Cluster |\n| 1 | 1 | 2 | 2 | 5 | 5 | 0.0 | 1.4 | 5.7\
  \ | Cluster 1 |\n| 1 | 1 | 2 | 2 | 5 | 5 | 1.4 | 0.0 | 4.2 | Cluster 2 |\n| 1 |\
  \ 1 | 2 | 2 | 5 | 5 | 5.7 | 4.2 | 0.0 | Cluster 3 |\n| 1 | 1 | 2 | 2 | 5 | 5 | 6.4\
  \ | 5.0 | 1.0 | Cluster 3 |\n| 1 | 1 | 2 | 2 | 5 | 5 | 4.0 | 3.2 | 4.0 | Cluster\
  \ 2 |\n| 1 | 1 | 2 | 2 | 5 | 5 | 5.1 | 4.0 | 3.2 | Cluster 3 |\nLegend\nxc1 = x\
  \ value of cluster 1\nyc1 = y value of cluster 1\n\nFigure 7.20 – Processing iteration\
  \ 1\n\n在前面的表格中，我们有以下元素：\n\n- 每行代表一个数据点。\n- 前六列代表每个簇的质心轴（x 和 y）。\n- 接下来的三列代表每个数据点到每个簇质心的距离。\n\
  - 最后一列代表最接近每个数据点的簇。\n\n查看数据点 A（第一行），我们可以看到它被分配到簇 1，因为数据点 A 到簇 1 的距离为 0（还记得我告诉你它们重叠了吗？）。对所有其他数据点也进行相同的计算，以为每个数据点定义一个簇。\n\
  \n在继续之前，你可能想看看我们是如何计算簇与数据点之间的这些距离的。如前所述，我们使用了欧几里得距离，所以让我们看看它的实际应用。为了演示目的，让我们看看我们是如何得出数据点\
  \ A 与簇 3 之间距离的（图 7.20 中的第一行，列 distance-c3，值为 5.7）。\n\n首先，我们应用了以下公式中的相同方程：\n\n```\n\
  Dist = √((x₁ − x₂)² + (y₁ − y₂)²)\n```\n\n这里，我们有以下内容：\n\n- X1 = 数据点 A 的 X = 1\n\
  - Y1 = 数据点 A 的 Y = 1\n- X2 = 簇 3 的 X = 5\n- Y2 = 簇 3 的 Y = 5\n\n逐步应用公式，我们将得到以下结果：\n\
  \n```\nDist = √((1 − 5)² + (1 − 5)²)\n      √ (4)² + (4)²\n      √ 16 + 16\n   \
  \   √ 32\n      5.656 or ~5.7\n```\n\nFigure 7.21 – Computing the Euclidian distance\
  \ step by step\n\n这太棒了，不是吗？我们几乎完成了 K-means 的第一次迭代。在迭代 1 的最后一步，我们必须刷新簇质心。记住：最初，我们随机定义了这些质心，但现在，我们已经将一些数据点分配到每个簇，这意味着我们应该能够确定簇的中心点在哪里。\n\
  \n在这个示例中，我们定义了将使用**平均链接**方法来刷新簇质心。这是一个非常简单的步骤，结果如下表所示：\n\n**迭代输出**\n| Point | x\
  \ | y |\n|---|---|---|\n| A | 1 | 1 |\n| B | 2 | 2 |\n| C | 5 | 5 |\n| D | 5 | 6\
  \ |\n| E | 1 | 5 |\n| F | 2 | 6 |\n| Cluster 1 | 1 | 1 |\n| Cluster 2 | 1.5 | 3.5\
  \ |\n| Cluster 3 | 4 | 5.7 |\n\nFigure 7.22 – K-means results after iteration 1\n\
  \n前面的表格显示了我们正在处理相同的那些数据点（顺便说一下，它们永远不会改变），以及簇 1、2 和 3 的质心。这些质心与图 7.18 中最初的质心大不相同。这是因为它们使用平均链接刷新了！该方法获取了每个簇的数据点的所有\
  \ x 和 y 值的平均值。例如，让我们看看我们是如何得出簇 2 的质心为 (1.5, 3.5) 的。\n\n如果你查看图 7.20，你会看到簇 2 只有两个数据点分配给它：B\
  \ 和 E。它们是该图像中的第二行和第五行。如果我们取每个点的 x 轴的平均值，那么我们将得到 (2 + 1) / 2 = 1.5 和 (2 + 5) / 2\
  \ = 3.5。\n\n有了这个，我们完成了 K-means 的迭代 1，我们可以查看结果：\n\n![](img/209e007237d34506e7ba16180f2e905c_251_0.png)\n\
  \nFigure 7.23 – Plotting the K-means results after the first iteration\n\n现在，我们可以看到几乎所有的数据点，除了数据点\
  \ A 因为它仍然与簇 1 的质心重叠。继续下去，我们必须重复以下步骤：\n\n- 重新计算每个数据点与每个簇质心之间的距离并重新分配簇（如有需要）\n- 重新计算簇质心\n\
  \n我们多次执行这两个任务，直到簇质心收敛并且不再发生变化，或者达到允许的最大迭代次数，该次数可以设置为 K-means 的超参数。为了演示目的，经过四次迭代后，我们的簇将如下所示：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_252_0.png)\n\nFigure 7.24 – Plotting\
  \ the K-means results after the fourth iteration\n\n在第四次迭代中，我们的簇质心看起来相当一致，我们可以清楚地看到我们可以根据它们的接近程度对六个数据点进行分组。\n\
  \n> **重要说明**\n> 在这个示例中，我们只为每个数据点设置了两个维度（维度 x 和 y）。在实际使用案例中，我们可以看到更多维度，这就是为什么聚类算法在以更自动化的方式识别数据中的组方面发挥着非常重要的作用。\n\
  \n我希望你喜欢从头开始计算 K-means 的过程！我相信这项知识将对你的考试和你作为数据科学家的职业生涯有益。顺便说一下，我已经多次告诉你数据科学家必须持怀疑态度和好奇心，所以你可能会想知道为什么我们在这个示例中定义了三个簇而不是两个或四个。你也可能想知道我们如何衡量簇的质量。\n\
  \n你没想过我不会解释这个，对吧？在下一节中，我们将一起澄清这些问题。\n\n### 定义簇的数量和衡量簇质量\n\n尽管 K-means 是寻找数据中模式的优秀算法，但它不会提供每个簇的含义，也不会提供你需要创建的簇的数量以最大化簇质量。\n\
  \n在聚类中，簇质量意味着我们希望创建同一簇内元素具有高度同质性，而不同簇间元素具有高度异质性的组。换句话说，同一簇的元素应该接近/相似，而不同簇的元素应该很好地分离。\n\
  \n计算簇同质性的一种方法是使用一种称为平方误差和，简称 SSE 的度量。该度量将计算每个数据点与其簇质心之间差异的平方和。例如，当所有数据点都位于簇质心所在的同一点时，SSE\
  \ 将为 0。换句话说，我们希望最小化 SSE。以下方程正式定义了 SSE：\n\nSSE = Σᵢ₌₁ⁿ (xᵢ - x̄)²\n\n现在我们知道了如何检查簇质量，更容易理解如何为给定的数据集定义适当的簇数量。我们要做的就是找到使\
  \ SSE 最小的若干个簇。一个围绕该逻辑工作的非常流行的方法被称为肘部方法。\n\n肘部方法建议多次执行聚类算法。在每次执行中，我们将测试不同的簇数量 k。每次执行后，我们计算与该\
  \ k 个簇相关的 SSE。最后，我们可以绘制这些结果并选择 SSE 停止急剧下降的 k 数量。\n\n> Important note\n> 添加更多簇自然会降低\
  \ SSE。在肘部方法中，我们想要找到该变化变得更平缓的点。\n\n\n\n\n\n在之前的示例中，我们决定创建三个聚类。下面的图表展示了支持这一决定的肘部分析：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_254_0.png)\n\n图 7.25 – 肘部方法\n\n我们可以得出结论，添加超过三个或四个聚类会给聚类过程带来不必要的复杂性。\n\
  \n当然，在定义聚类数量时，你始终应考虑业务背景。例如，如果你正在创建客户细分模型，而你的公司已准备好商业团队和业务流程来支持四个客户细分，考虑到前面的图表，将聚类数设为四个而不是三个也无妨。\n\
  \n最后，你应该知道 AWS 已将 K-means 作为其内置算法列表的一部分实现。换句话说，你不必使用外部库或自带算法就能在 AWS 上使用 K-means。\n\
  \n### 结论\n\n这真是一个很棒的成就：你刚刚掌握了聚类算法的基础知识，现在应该能够开展自己的项目并研究这个主题！对于考试，请记住聚类属于机器学习的无监督领域，因此不需要有标签数据。\n\
  \n另外，请确保你了解该领域最流行的算法的工作原理；即 K-means。虽然聚类算法并不能提供每个组的含义，但它们对于在数据中寻找模式非常强大，无论是为了建模特定问题还是只是探索数据。\n\
  \n接下来，我们将继续研究无监督算法，并看看 AWS 如何构建了用于异常检测的最强大算法之一，即 **Random Cut Forest (RCF)**。\n\n\
  ### 异常检测\n\n在数据建模和数据探索性分析中查找异常非常常见。有时，你可能只想在拟合回归模型之前先找到数据中的异常并将其移除，而在其他时候，你可能希望创建一个以识别异常为最终目标的模型，例如在欺诈检测系统中。\n\
  \n同样，我们可以使用许多不同的方法在数据中查找异常。有了足够的创造力，可能性是无穷的。然而，有一种特定的算法围绕这个问题展开，你在考试中绝对应该了解它：**Random\
  \ Cut Forest (RCF)**。\n\nRCF 是一种基于无监督决策树的算法，它使用训练数据的随机子样本创建多个决策树（森林）。从技术上讲，它对数据进行随机化，然后根据树的数量创建样本。最后，这些样本被分配到每棵树中。\n\
  \n这些树集用于为数据点分配异常分数。该异常分数定义为将该点添加到树中后树复杂度的预期变化。\n\nRCF 最重要的超参数是 num_trees 和 num_samples_per_tree，分别表示森林中的树数和每棵树的样本数。\n\
  \n### 降维\n\nAWS 在其内置算法列表中实现的另一种无监督算法被称为 **Principal Component Analysis**，或简称为 **PCA**。PCA\
  \ 是一种用于减少给定数据集中变量/维度数量的技术。\n\nPCA 背后的主要思想是将数据点绘制到另一组坐标上，称为 **principal components\
  \ (PC)**，其目的是解释数据中的最大方差。根据定义，第一主成分将捕获比第二主成分更多的方差，然后第二主成分将捕获比第三主成分更多的方差，以此类推。\n\n\
  只要不超过数据集中变量的数量，你就可以设置所需的任意多个主成分。下面的图表显示了这些主成分是如何绘制的：\n\n![](img/209e007237d34506e7ba16180f2e905c_256_0.png)\n\
  \n图 7.26 – 在 PCA 中寻找主成分\n\n正如我们之前提到的，第一主成分将被绘制成能够捕获数据中大部分方差的方式。这就是为什么它在前面的图表中会接近大多数数据点。\n\
  \n然后，第二主成分将与第一主成分垂直，因此它将是解释数据方差的第二主成分。如果你想创建更多主成分（从而捕获更多方差），你只需遵循添加垂直分量的相同规则。特征向量和特征值是与\
  \ PCA 相关的线性代数概念，用于计算主成分。\n\n那么，这里降维的故事是什么？如果还不清楚，这些主成分可以用来替代你的原始变量。例如，假设你的数据集中有\
  \ 10 个变量，你想将此数据集减少到三个最能代表其他变量的变量。对此的一种潜在解决方案是应用 PCA 并提取前三个主成分！\n\n这三个分量能解释你数据集的\
  \ 100% 吗？可能不是，但理想情况下，它们将解释大部分方差。添加更多主成分将解释更多方差，但代价是你增加了额外的维度。\n\n### 使用 AWS 的内置算法进行\
  \ PCA\n\n在 AWS 中，PCA 以两种不同的模式工作：\n- **Regular：** 用于具有中等数量观测值和特征的数据集\n- **Randomized：**\
  \ 用于具有大量观测值和特征的数据集\n\n区别在于，在随机模式下，使用的是近似算法。\n\n当然，PCA 的主要超参数是你想要提取的分量数，称为 `num_components`。\n\
  \n### IP Insights\n\nIP Insights 是一种用于模式识别的无监督算法。本质上，它学习 IPv4 地址的使用模式。\n\n该算法的操作方式非常直观：它在实体和\
  \ IPv4 地址的事件对之上进行训练，以便它能够理解其所训练的每个实体的模式。\n\n> **重要说明**\n> 例如，我们可以将“实体”理解为用户 ID 或账号号码。\n\
  \n然后，为了进行预测，它接收具有相同数据结构（实体、IPv4 地址）的事件对，并为该特定 IP 地址相对于输入实体返回一个异常分数。\n\n> **重要说明**\n\
  > IP Insight 返回的该异常分数推断出该事件的模式有多异常。\n\n我们可能会遇到许多使用 IP Insights 的应用。例如，你可以创建一个在你的应用程序登录事件之上训练的\
  \ IP Insights 模型（这是你的实体）。你应该能够通过 API 端点公开此模型以实时进行预测。\n\n然后，在你的应用程序的身份验证过程中，你可以调用你的端点并传递正在尝试登录的\
  \ IP 地址。如果得到高分（意味着这种登录模式看起来异常），你可以在授权访问之前请求额外信息（即使密码正确）。\n\n这只是你可以考虑的 IP Insights\
  \ 的众多应用之一。接下来，我们将讨论文本分析。\n\n### 文本分析\n\n现代应用程序使用 **Natural Language Processing (NLP)**\
  \ 用于多个目的，例如 **text translation, document classifications, web search, named entity\
  \ recognition** (**NER**)，等等。\n\nAWS 为大多数 NLP 用例提供了一套算法。在接下来的几个小节中，我们将查看这些用于文本分析的内置算法。\n\
  \n### Blazing Text 算法\n\nBlazing Text 执行两种不同的任务：文本分类，这是一种扩展了 **fastText** 文本分类器的监督学习方法，以及\
  \ **word2vec**，这是一种无监督学习算法。\n\nBlazing Text 对这两种算法的实现都针对大规模数据集进行了优化。例如，你可以在几分钟内在数十亿个词之上训练模型。\n\
  \nBlazing Text 具有这种可扩展性方面的原因如下：\n- 其能够使用多核 CPU 和单个 GPU 来加速文本分类\n- 其能够使用多核 CPU 或\
  \ GPU，并使用自定义 CUDA 内核进行 GPU 加速，在使用 word2vec 算法时\n\nword2vec 选项支持 **batch_skipgram**\
  \ 模式，这允许 Blazing Text 在多个 CPU 之间进行分布式训练。\n\n> **重要说明**\n> Blazing Text 执行的分布式训练使用小批量方法将\
  \ **level-1 BLAS** 操作转换为 **level-3 BLAS** 操作。如果你在考试中看到这些术语，你应该知道它们与 Blazing Text\
  \ 在 word2vec 方面的相关性。\n\n仍在 word2vec 模式下，Blazing Text 同时支持 **skip-gram** 和 **continuous\
  \ bag of words (CBOW)** 架构。\n\n\n\n\n\n最后但同样重要的是，请注意 Blazing Text 的以下配置，因为它们很可能出现在你的考试中：\n\
  \n- 在 word2vec 模式下，只有 train 通道可用。\n- Blazing Text 预期一个包含空格分隔词元的单个文本文件。文件的每一行必须包含一个句子。这意味着在使用\
  \ Blazing Text 之前，你通常需要预处理你的语料库数据。\n\n### 序列到序列算法\n\n这是一种有监督算法，可将输入序列转换为输出序列。此序列可以是文本句子，甚至是音频录音。\n\
  \n序列到序列最常见的用例是机器翻译、文本摘要和语音转文本。任何你认为属于序列到序列问题的问题，都可以通过此算法来解决。\n\n从技术上讲，AWS SageMaker\
  \ 的 Seq2Seq 使用两种类型的神经网络来创建模型：循环神经网络（RNN）和带注意力机制的卷积神经网络（CNN）。\n\n**潜在狄利克雷分配**，简称\
  \ **LDA**，用于主题建模。主题建模是一种文本分析技术，你可以从文本语料库中提取一组主题。LDA 根据文本语料库中词语的概率分布学习这些主题。\n\n由于这是一种无监督算法，因此无需设置目标变量。此外，主题数量必须提前指定，并且你需要分析每个主题以找到其领域含义。\n\
  \n### 神经主题模型（NTM）算法\n\n与 LDA 算法一样，神经主题模型（NTM）也旨在从语料库数据中提取主题。然而，LDA 与 NTM 之间的区别在于它们的学习逻辑。虽然\
  \ LDA 从文档中词语的概率分布中学习，但 NTM 建立在神经网络之上。\n\nNTM 网络架构有一个瓶颈层，可创建文档的嵌入表示。此瓶颈层包含预测文档构成所需的所有必要信息，其系数可被视为主题。\n\
  \n至此，我们已完成了关于文本分析的本节内容。在下一节中，我们将学习图像处理算法。\n\n### 图像处理\n\n图像处理是机器学习中非常热门的话题。想法很简单：创建可以分析图像并在其基础上进行推断的模型。通过推断，你可以理解为在图像中检测对象、对图像进行分类等等。\n\
  \nAWS 提供了一套内置算法，可用于训练图像处理模型。在接下来的几节中，我们将查看这些算法。\n\n### 图像分类算法\n\n顾名思义，图像分类算法用于使用有监督学习对图像进行分类。换句话说，它需要在每张图像中包含标签。它支持多标签分类。\n\
  \n其运行方式很简单：在训练期间，它接收图像及其关联标签。在推理期间，它接收图像并返回所有预测标签。图像分类算法使用 CNN（**ResNet**）进行训练。它可以从头开始训练模型，也可以利用迁移学习预加载神经网络的前几层。\n\
  \n根据 AWS 的文档，支持 .jpg 和 .png 文件格式，但推荐的格式是 **MXNet RecordIO**。\n\n### 语义分割算法\n\n语义分割算法为创建计算机视觉应用提供了像素级功能。它为图像的每个像素标记一个类别，这对于自动驾驶和医学图像诊断等复杂应用而言是一个重要特性。\n\
  \n就其实现而言，语义分割算法使用 **MXNet Gluonn 框架**和 **Gluon CV 工具包**。你可以从以下算法中选择任何一种来训练模型：\n\n\
  - **全卷积网络**（FCN）\n- **金字塔场景解析**（PSP）\n- DeepLabV3\n\n所有这些选项都作为 **编码器-解码器** 神经网络架构工作。网络的输出被称为\
  \ **分割掩码**。\n\n### 对象检测算法\n\n与图像分类算法一样，对象检测算法的主要目标也很明显：它检测并对图像中的对象进行分类。它使用有监督方法训练深度神经网络。\n\
  \n在推理过程中，该算法返回已识别的对象以及关于预测的置信度分数。对象检测算法使用单次多框检测器（SSD），并支持两种类型的网络架构：VGG 和 ResNet。\n\
  \n### 总结\n\n这真是一段旅程！让我们花点时间回顾一下我们刚刚学到的内容。我们将本章分为四个主要部分：有监督学习、无监督学习、文本分析和图像处理。我们学到的所有内容都属于机器学习的这些子领域。\n\
  \n我们研究过的有监督学习算法列表如下：\n\n- Linear learner algorithm\n- Factorization machines algorithm\n\
  - XGBoost algorithm\n- K-Nearest Neighbors algorithm\n- Object2Vec algorithm\n-\
  \ DeepAR forecasting algorithm\n\n请记住，你可以使用 linear learner、factorization machines、XGBoost\
  \ 和 KNN 来实现多种目的，包括解决回归和分类问题。其中，linear learner 可能是这四种算法中最简单的；factorization machines\
  \ 在 linear learner 的基础上扩展，适用于稀疏数据集，XGBoost 使用基于决策树的集成方法，而 KNN 是一种基于索引的算法。\n\n另外两种算法\
  \ Object2Vec 和 DeepAR 用于特定目的。Object2Vec 用于创建数据的向量表示，而 DeepAR 用于创建预测模型。\n\n我们研究过的无监督学习算法列表如下：\n\
  \n- K-means algorithm\n- **主成分分析（PCA）**\n- IP Insights\n- **随机切割森林（RCF）**算法\n\n\
  K-means 是一种非常流行的用于聚类的算法。PCA 用于降维，IP Insights 用于模式识别，而 RCF 用于异常检测。\n\n然后，我们更详细地研究了回归模型和\
