  \n### 使用 Amazon Textract 从文档中提取文本\n\n手动从文档中提取信息速度慢、成本高且容易出错。传统的光学字符识别软件需要大量定制，并且仍然会产生错误的输出。为了避免此类手动流程和错误，您应该使用\
  \ Amazon Textract。通常，我们将文档转换为图像，以便在图像中检测文本周围的边界框。然后，我们应用字符识别技术来读取其中的文本。Textract\
  \ 会为您完成所有这些工作，并且只需最少的努力即可为您提取文本、表格、表单和其他数据。如果您从 Amazon Textract 获得低置信度结果，则 Amazon\
  \ A2I 是最佳解决方案。\n\nTextract 减少了从数百万页扫描文档中提取文本的手动工作量。一旦信息被捕获，就可以对文本采取行动，例如将其存储在不同的数据存储中、分析情感或搜索关键字。以下图表显示了\
  \ Amazon Textract 的工作原理：\n\n![](img/209e007237d34506e7ba16180f2e905c_75_0.png)\n\
  \n图 2.21 – Amazon Textract 的框图表示及其如何存储输出\n\nAmazon Textract 的一些常见用途包括以下内容：\n\n-\
  \ 记录处理工作流以提取表格或表单。\n- 使用 Amazon Elasticsearch 从文档创建搜索索引。\n- 在工作流中删除个人身份信息；Textract\
  \ 会自动识别数据类型和表单标签。\n\n接下来，我们将探讨 Amazon Textract 的优势。\n\n### 探索 Amazon Textract 的优势\n\
  \n使用 Textract 有以下几个原因：\n\n- 零基础设施成本。\n- 完全托管服务（减少开发和管理开销）。\n- 帮助您提取结构化和非结构化数据。\n\
  - 可以分析手写评论。\n- Amazon Textract 的性能优于使用平面词袋的 OCR 应用。\n- 接下来，我们将动手使用 Amazon Textract。\n\
  \n### 动手使用 Amazon Textract\n\n在本节中，我们将使用 Amazon Textract API 从 S3 存储桶读取图像文件并在 Cloudwatch\
  \ 上打印“FORM”详细信息。同样，可以以您期望的格式存储在 S3 中以供进一步使用，也可以作为键值对存储在 DynamoDB 中。让我们开始吧：\n\n-\
