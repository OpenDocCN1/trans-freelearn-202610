  \ notebook 实例、训练实例、推理端点和端点配置来清理数据、训练模型并从中生成预测结果。在下一节中，我们将学习模型调优。\n\n### Model tuning\n\
  \n在 *Chapter 8, Evaluating and Optimizing Models* 中，你学习了关于模型调优的许多重要概念。现在让我们从实践角度探索这个主题。\n\
  \n为了在 SageMaker 上调优模型，我们必须调用 `create_hyper_parameter_tuning_job` 并传递以下主要参数：\n\n\
  - `HyperParameterTuningJobName`：这是调优作业的名称。它有助于追踪代表你的调优作业而启动的训练作业。\n- `HyperParameterTuningJobConfig`：在这里，你可以配置你的调优选项。例如，你想要调优的参数、它们的值范围、优化类型（如随机搜索或贝叶斯搜索）、你想要启动的最大训练作业数等。\n\
  - `TrainingJobDefinition`：在这里，你可以配置你的训练作业。例如，数据通道、输出位置、资源配置、评估指标和停止条件。\n\n在 SageMaker\
  \ 中，我们主要用来评估模型以选择最佳模型的一个指标被称为 **objective metric**。\n\n在下面的示例中，我们正在为基于决策树的算法配置 `HyperParameterTuningJobConfig`。我们想要检查\
  \ **max_depth** 超参数的最佳配置，该超参数负责控制树的深度。\n\n在 `IntegerParameterRanges` 中，我们必须指定以下内容：\n\
  \n- 超参数名称\n- 我们想要测试的最小值\n- 我们想要测试的最大值\n\n**Important note**\n每种类型的超参数必须适合于参数范围区段之一，例如分类、连续或整数参数。\n\
  \n在 `ResourceLimits` 中，我们指定了训练作业的数量以及我们想要并行运行的作业数量。请记住，调优过程的目标是以不同的超参数设置执行许多训练作业。这样做是为了选择最佳的一个作为最终模型。因此，我们必须指定这些训练作业执行规则。\n\
  \n我们然后在 `Strategy` 中设置搜索策略，最后在 `HyperParameterTuningJobObjective` 中设置目标函数：\n\n```\n\
  tuning_job_config = {\n    \"ParameterRanges\": {\n        \"CategoricalParameterRanges\"\
  : [],\n        \"ContinuousParameterRanges\": [],\n        \"IntegerParameterRanges\"\
  : [\n            {\n                \"MaxValue\": \"10\",\n                \"MinValue\"\
  : \"1\",\n                \"Name\": \"max_depth\"\n            }\n        ]\n  \
  \  }\n}\n```\n\n```\n]\n},\n\"ResourceLimits\": {\n    \"MaxNumberOfTrainingJobs\"\
  : 10,\n    \"MaxParallelTrainingJobs\": 2\n},\n\"Strategy\": \"Bayesian\",\n\"HyperparameterTuningJobObjective\"\
  : {\n    \"MetricName\": \"validation:auc\",\n    \"Type\": \"Maximize\"\n}\n}\n\
  ```\n\n我们需要设置的第二个重要配置是 TrainingJobDefinition。在这里，我们必须指定将要执行的训练作业的所有细节。其中最重要的设置之一是\
  \ TrainingImage 设置，它指的是将启动以执行训练过程的容器。该容器如预期必须实现了你的训练算法。\n\n在这里，我们展示了一个内置算法 eXtreme\
  \ Gradient Boosting 的示例，以便你可以将训练镜像设置为如下：\n\n```\ntraining_image = sagemaker.image_uris.retrieve('xgboost',\n\
  region, '1.0-1')\n```\n\n然后，你可以继续设置你的训练定义：\n\n```\ntraining_job_definition = {\n\
  \    \"AlgorithmSpecification\": {\n        \"TrainingImage\": training_image,\n\
  \        \"TrainingInputMode\": \"File\"\n    },\n```\n\n接下来，我们必须指定数据输入配置，也称为数据通道。在以下代码段中，我们设置了两个数据通道\
  \ – train 和 validation：\n\n```\n\"InputDataConfig\": [\n    {\n        \"ChannelName\"\
  : \"train\",\n```\n\n```\n\"CompressionType\": \"None\",\n\"ContentType\": \"csv\"\
  ,\n\"DataSource\": {\n\"S3DataSource\": {\n\"S3DataDistributionType\": \"FullyReplicated\"\
  ,\n\"S3DataType\": \"S3Prefix\",\n\"S3Uri\": s3_input_train\n}\n}\n},\n{\n\"ChannelName\"\
  : \"validation\",\n\"CompressionType\": \"None\",\n\"ContentType\": \"csv\",\n\"\
  DataSource\": {\n\"S3DataSource\": {\n\"S3DataDistributionType\": \"FullyReplicated\"\
  ,\n\"S3DataType\": \"S3Prefix\",\n\"S3Uri\": s3_input_validation\n}\n}\n}\n],\n\
  ```\n\n我们还需要指定结果将存储的位置：\n\n```\n\"OutputDataConfig\": {\n\"S3OutputPath\": \"s3://{}/{}/output\"\
  .format(bucket,prefix)\n},\n```\n\n最后，我们设置资源配置、角色、静态参数和停止条件。在以下代码段中，我们想要使用两台类型为\
  \ ml.c4.2xlarge 的实例，每台 10 GB 存储：\n\n```\n\"ResourceConfig\": {\n\"InstanceCount\"\
  : 2,\n```\n\n```\n\"InstanceType\": \"ml.c4.2xlarge\",\n\"VolumeSizeInGB\": 10\n\
  },\n\"RoleArn\": <<your_role_name>>,\n\"StaticHyperParameters\": {\n\"eval_metric\"\
  : \"auc\",\n\"num_round\": \"100\",\n\"objective\": \"binary:logistic\",\n\"rate_drop\"\
  : \"0.3\",\n\"tweedie_variance_power\": \"1.4\"\n},\n\"StoppingCondition\": {\n\"\
  MaxRuntimeInSeconds\": 43200\n}\n}\n```\n\n> **Important note**\n> 请注意，我们在此配置文件中使用了其他变量\
  \ bucket 和 prefix，它们应分别替换为你的存储桶名称和前缀键（如需要）。我们还引用了 s3_input_train 和 s3_input_validation，这两个变量指向\
  \ S3 中的训练和验证数据集。\n\n一旦你设置了配置，你就可以启动调优过程：\n\n```\nsmclient.create_hyper_parameter_tuning_job(\n\
  \    HyperparameterTuningJobName = \"my-tuning-example\",\n    HyperparameterTuningJobConfig\
  \ = tuning_job_config,\n    TrainingJobDefinition = training_job_definition\n)\n\
  ```\n\n接下来，让我们了解一下如何追踪此过程的执行。\n\n### Tracking your training jobs and selecting the\
  \ best model\n\n一旦你启动了调优过程，你可能还想检查另外两个步骤：追踪调优过程以及选择获胜模型（即具有最佳超参数集的模型）。\n\n为了找到你的训练作业，你应该进入\
  \ SageMaker 控制台并导航到 Hyperparameter training jobs。你将找到已执行的调优作业列表，包括你的作业：\n\n![](img/209e007237d34506e7ba16180f2e905c_303_0.png)\n\
  \nFigure 9.11 – Finding your tuning job\n\n如果你通过点击其名称访问你的调优作业，你将找到一个摘要页面，其中包含有关调优过程的最相关信息。在\
  \ Training jobs 选项卡下，你将看到已执行的所有训练作业：\n\n![](img/209e007237d34506e7ba16180f2e905c_303_1.png)\n\
  \nFigure 9.12 – Summary of the training jobs in the tuning process\n\n\n\n\n\n最后，如果你点击\
  \ **Best training job** 选项卡，你将找到模型最佳的超参数集，其中包含一个便捷的按钮，可基于刚刚找到的最佳超参数创建新模型：\n\n![](img/209e007237d34506e7ba16180f2e905c_304_0.png)\n\
  \n图 9.13 – 查找最佳超参数集\n\n正如你所见，SageMaker 非常直观，一旦你了解模型优化背后的主要概念，使用 SageMaker 就会变得更容易。到目前为止，我们已经了解了如何为特定需求使用\
  \ SageMaker。在下一节中，我们将探讨如何为各种用例选择实例类型以及笔记本的安全性。\n\n### 在 Amazon SageMaker 中选择实例类型\n\
  \nSageMaker 采用按使用量付费的模式。它没有最低费用。\n\n当我们思考 SageMaker 上的实例时，一切都始于一个 EC2 实例。该实例负责所有处理。它是一个托管的\
  \ EC2 实例。这些实例不会出现在 EC2 控制台中，也无法通过 SSH 访问。实例类型以 m1 开头。\n\nSageMaker 提供以下实例族：\n\n\
  - **t** 族：这是一个可突发 CPU 族。在此族中，你获得正常的 CPU 和内存比例。这意味着，如果你有一个长时间运行的训练作业，随着 CPU 积分的消耗，性能会随时间下降。如果你的作业非常小，则具有成本效益。例如，如果你希望笔记本实例启动训练作业，则此族是最相关且最具成本效益的。\n\
  \n- **m** 族：在前一个族中，我们看到由于其可突发特性，CPU 积分消耗更快。如果你的长时间运行的机器学习作业需要恒定的吞吐量，那么这就是合适的族。它具有与\
  \ **t** 族相似的 CPU 和内存比例。\n\n- **r** 族：这是一个内存优化族。*我们什么时候需要这个？* 想象一下这样的用例：你需要将数据加载到内存中并对数据进行数据工程。在这种情况下，你需要更多内存，并且作业将是内存优化的。\n\
  - **c** 族：**c** 族实例是计算优化的。这是需要更高计算能力和更少内存来存储数据的作业的要求。如果你参考下表，C5.2x large 具有 8 vCPU\
  \ 和 16 GiB 内存，这使其成为计算优化且内存较少的实例。例如，用例需要在较少记录上进行测试并且计算敏感，那么此实例族就是获取大量数据框中的一些样本记录并测试算法的最佳选择。\n\
  - **p** 族：这是一个 GPU 族，支持加速计算作业，例如训练和推理。值得注意的是，**p** 族实例非常适合处理大型分布式训练作业，这会减少训练所需的时间。因此，这变得具有成本效益。P3/P3dn\
  \ GPU 计算实例可达每秒 1 petaFLOP 的计算能力，GPU 内存高达 256 GB，网络带宽为 100 Gbps，配备 8x NVIDIA v100\
  \ GPU。它们高度优化用于训练，并且不完全用于推理。\n- **g** 族：对于具有成本效益的小规模训练作业，**g** 族 GPU 实例是理想选择。G4 具有\
  \ GPU 实例最低的每推理成本。它使用 T4 NVIDIA GPU。G4 GPU 计算实例可达 520 TeraFLOPs 的计算时间，配备 8x NVIDIA\
  \ T4 GPU。此实例族最适合简单的网络。\n\n在下表中，从每个族中取了 2x large 实例类型，以便在 CPU 和内存比例之间进行视觉比较：\n\n\
  | t3.2x large | m5.2x large | r5.2x large | c5.2x large | p3.2x large | g4dn.2x\
  \ large |\n|---|---|---|---|\n| 8 vCPU, 32 GiB | 8 vCPU, 32 GiB | 8 vCPU, 64 GiB\
  \ | 8 vCPU, 16 GiB | 8 vCPU, 61 GiB | 8 vCPU, 32 GiB |\n\n表 9.1 – 显示不同实例类型 CPU 和内存比例的表格\n\
  \n> **重要提示**\n> 为了更容易记住，你可以认为 T 代表 Tiny，M 代表 Medium，C 代表 Compute，P 和 G 代表 GPU。CPU\
  \ 族实例类型为 T、M、R 和 C。GPU 族实例类型为 P 和 G。\n\n### 为训练作业选择合适的实例类型\n\n没有经验法则来决定你需要的实例类型。它会根据数据的大小、网络的复杂性、机器学习算法以及时间和成本等其他因素而变化。提出正确的问题将节省资金并使其具有成本效益。\n\
  \n如果决定因素是 *Instance Size*，那么对 CPU 或 GPU 进行问题分类是正确的步骤。完成之后，再考虑是否可以是多 GPU 或多 CPU。这将解决你关于分布式训练的问题。这也解决了你的\
  \ *Instance Count* 因素。如果是计算密集型，那么检查内存要求也是明智的。\n\n下一个决定因素是 *Instance Family*。这里的正确问题是，*它是否针对时间和成本进行了优化*？在上一步中，我们已经确定问题是在\
  \ CPU 或 GPU 上解决，这缩小了选择过程。现在，让我们学习有关推理作业的信息。\n\n### 为推理作业选择合适的实例类型\n\n生产中机器学习的大部分成本和复杂性在于推理。通常，推理在实时运行单个输入。它们通常计算/内存密集度较低。它们必须高度可用，因为它们全天候运行并为终端用户请求提供服务或作为应用程序的一部分集成。\n\
  \n你可以根据工作负载选择我们最近了解的任何实例类型。除此之外，AWS 还有用于推理的 **Inf1** 和 **Elastic Inference** 类型实例。弹性推理允许你将\
  \ GPU 实例的一部分附加到任何 CPU 实例。\n\n让我们看一个应用程序集成了推理作业的示例，那么应用程序的 CPU 和内存需求与推理作业不同。对于这些用例，你需要选择合适的实例类型和大小。在这种情况下，最好将应用程序舰队与推理舰队分开。这可能需要一些管理。如果这种管理对你的需求来说是个问题，那么选择弹性推理，在其中应用程序和推理作业可以共址。这意味着你可以在同一舰队上托管多个模型，并且可以将所有这些不同模型加载到不同的加速器内存中，并可以同时处理并发请求。\n\
  \n始终建议你在生产环境中确定实例类型和族之前，先在较低环境中运行一些示例。在下一节中，我们将深入探讨并了解保护 Amazon SageMaker 笔记本的不同方法。\n\
  \n### 保护 SageMaker 笔记本\n\n如果你正在阅读本章的这一节，那么你已经了解了如何使用笔记本实例，应该选择哪种类型的训练实例，以及如何配置和使用端点。现在，让我们学习如何保护这些实例。以下方面有助于保护实例：\n\
  \n- **Encryption：** 当我们谈论或思考通过加密进行保护时，这一切都与数据有关。但这意味着什么？这意味着使用加密保护静态数据，使用加密保护传输中数据，并使用\
  \ KMS 实现更好的角色分离和通过 TLS 1.2 加密的互联网流量隐私。SageMaker 实例可以使用 AWS 管理的 KMS 密钥启动加密卷。这有助于默认情况下保护\
  \ Jupyter Notebook 服务器。\n- **Root access：** 当用户从 Jupyter Web UI 打开 shell 终端时，他们将以\
  \ ec2-user 登录，这是 Amazon Linux 中的默认用户名。现在用户可以 sudo 到 root 用户。有了 root 访问权限，用户可以访问和编辑文件。在许多用例中，管理员可能不希望数据科学家管理、控制或修改笔记本服务器的系统。这需要对\
  \ root 访问进行限制。这可以通过在调用 CreateNotebookInstance 或 UpdateNotebookInstance 时将 RootAccess\
  \ 字段设置为 Disabled 来完成。数据科学家将可以访问其用户空间并安装 Python 包。然而，他们无法 sudo 到 root 用户并对操作系统进行更改。\n\
  - **IAM role：** 在启动笔记本实例期间，有必要为执行创建 IAM 角色或使用现有角色进行执行。这用于使用与该角色关联的实例配置文件启动服务管理的\
  \ EC2 实例。此角色将根据附加到此角色的策略限制 API 调用。\n- **VPC connection：** 当你启动 SageMaker 笔记本实例时，默认情况下它会在\
  \ SageMaker 服务账户中创建，该账户具有服务管理的 VPC，并且默认情况下将通过互联网网关访问互联网，而该网关由服务管理。如果你只处理与 AWS 相关的服务，则建议你在私有子网中在你的\
  \ VPC 内启动 SageMaker 笔记本实例，并使用自定义的安全组。AWS 服务可以通过附加到该 VPC 的 VPC 端点从此笔记本实例调用或使用。最佳实践是通过端点策略控制它们以实现更好的\
  \ API 控制。这确保了对 VPC 外部的数据出站的限制和安全环境。为了捕获所有网络流量，你可以打开 VPC 流日志，这些日志可以通过 CloudWatch\
  \ 进行监控和跟踪。\n\n\n\n\n\n+   - **Internet access**: 你可以在没有直接互联网访问的情况下启动 Jupyter Notebook\
  \ 服务器。它可以在私有子网中启动，并通过 NAT 或通过虚拟私有网关访问互联网。对于训练和部署推理容器，你可以在调用 `CreateTrainingJob`、`CreateHyperParameterTuningJob`\
  \ 或 `CreateModel` 时将 `EnableNetworkIsolation` 参数设置为 `True`。网络隔离可以与 VPC 结合使用，确保容器无法进行任何出站网络调用。\n\
  \n+   - **Connecting a private network to your VPC**: 你可以在 VPC 的私有子网中启动 SageMaker\
  \ 笔记本实例。它可以通过与私有网络通信来访问私有网络的数据，这可以通过使用 Amazon VPN 或 AWS Direct Connect 将私有网络连接到你的\
  \ VPC 来实现。\n\n在本节中，我们学习了几种保护 SageMaker 笔记本的方法。在下一节中，我们将学习如何使用 Lambda 函数创建 SageMaker\
  \ 管道。\n\n### Creating alternative pipelines with Lambda Functions\n\n确实，SageMaker\
  \ 是一个很棒的平台，你可以用它来创建训练和推理管道。然而，我们总可以与其他服务配合，构建类似的解决方案。我们接下来要学习的一个服务就是 **Lambda Functions**。\n\
  \nAWS Lambda 是一种无服务器计算服务，你可以在其中将函数作为服务运行。换句话说，你只需专注于编写函数。然后，你只需告诉 AWS 如何运行它（即环境和资源配置），这样所有必要的资源将被配置以运行你的代码，并在完成后停止。\n\
  \n在 *Chapter 6, AWS Services for Data Processing* 整个章节中，你探索了 Lambda 函数如何与许多不同的服务集成，例如\
  \ Kinesis 和 AWS Batch。确实，AWS 在将 Lambda 与 140 个服务集成方面做得非常出色（并且该列表还在不断增加）。这意味着当你使用特定的\
  \ AWS 服务时，你会记得它很可能与 Lambda 集成。\n\n这一点很重要，因为 Lambda 函数确实可以扩展你创建可扩展和集成架构的可能性。例如，当文件上传到\
  \ S3 时，你可以触发一个 Lambda 函数，以便在将数据加载到 Redshift 之前预处理数据。或者，你可以创建一个 API，在每个端点执行时触发 Lambda\
  \ 函数。再次说明，使用这种强大的服务，可能性是无穷无尽的。\n\n另外，有用的是，你可以用不同的编程语言编写函数，例如 Node.js、Python、Go、Java\
  \ 等。你的函数不一定需要由另一个 AWS 服务触发，也就是说，你可以手动触发它，例如用于你的 Web 或移动应用程序。\n\n在部署方面，你可以将函数作为 ZIP\
  \ 文件或容器镜像上传。虽然这不适合自动化部署流程，但直接在 AWS Lambda 控制台中编码也是可能的。\n\n与其他服务一样，这个服务也有一些缺点，你应该注意：\n\
  \n+   - Memory allocation for your function: 这是 128 MB 到 10,240 MB（AWS 最近将此限制从 3\
  \ GB 增加到 10 GB，如前所述）。\n+   - Function timeout: 这是最多 900 秒（15 分钟）。\n+   - Function\
  \ layer: 这是最多 5 层。\n+   - Burst concurrency: 这取决于区域，从 500 到 3,000 不等。\n+   - Deployment\
  \ package size: 这是 250 MB 未压缩，包含层。\n+   - Container image code package size: 这是\
  \ 10 GB。\n+   - Available space in the /tmp directory: 这是 512 MB。\n\n在选择 Lambda\
  \ 函数之前，请确保这些限制适合你的用例。将 Lambda 函数更接近 SageMaker 替代管道的范围，Lambda 的一个潜在用途是为我们的模型创建推理管道。\n\
  \n正如你所知，SageMaker 有一个非常方便的 `.deploy()` 方法，它将为模型推理创建端点。这样你就可以调用它来传递输入数据以接收预测结果。在这里，我们可以使用\
  \ API 网关和 Lambda 函数创建此推理端点。\n\n如果不需要推理端点，而只是想进行预测并以批处理方式将结果存储在某处，那么我们只需要一个 Lambda\
  \ 函数即可，它能够获取输入数据、实例化模型对象、进行预测并将结果存储在适当的位置。当然，它会考虑我们之前讨论过的所有限制。\n\n好了，现在我们对 Lambda\
  \ 有了良好的背景知识以及一些用例，让我们来看看考试中我们应该注意的最重要的配置。\n\n### Creating and configuring a Lambda\
  \ Function\n\n首先，你应该知道，你可以通过多种方式创建 Lambda 函数，例如通过 AWS CLI（Lambda API reference）、AWS\
  \ Lambda 控制台，甚至部署框架（例如 serverless framework）。\n\n无服务器框架通常与提供商和编程语言无关。换句话说，它们通常允许你从各种云提供商和编程语言的列表中选择部署无服务器基础设施的位置。\n\
  \n> **Important note**\n> 无服务器架构的概念并非 AWS 特有。事实上，许多云提供商都提供与 AWS Lambda 函数类似的其他服务。这就是为什么构建了这些无服务器框架：帮助开发人员和工程师部署他们的服务，无论他们想要在哪里部署，包括\
  \ AWS。这不太可能出现在你的考试中，但这绝对是你应该知道的事情，以便你了解作为数据科学家或数据工程师解决挑战的不同方式。\n\n由于我们希望通过 AWS Machine\
  \ Learning Specialty 考试，这里我们采用了通过 AWS Lambda 控制台逐步操作的方法。这样你将更熟悉他们的界面和最重要的配置选项。\n\
  \n当你导航到 Lambda 控制台并请求新的 Lambda 函数时，AWS 会为你提供一些起始选项：\n\n+   - Author from scratch:\
  \ 如果你想从头创建函数。\n+   - Use a blueprint: 如果你想从示例代码和常见用例的配置预设创建函数。\n+   - Container\
  \ image: 如果你想选择容器镜像来部署你的函数。\n+   - Browse serverless app repository: 如果你想从 AWS Serverless\
  \ Application Repository 部署示例 Lambda 应用程序。\n\n从头开始，下一步是设置你的 Lambda 配置。AWS 将这些配置分为基本和高级设置。在基本配置中，你将设置函数名称、运行时环境和权限。图\
  \ 9.14 显示了这些配置：\n\n![](img/209e007237d34506e7ba16180f2e905c_311_0.png)\n\nFigure\
  \ 9.14 – Creating a new Lambda Function from the AWS Lambda console\n\n这里有一个你在考试中应该记住的非常重要配置：**execution\
  \ role**。你的 Lambda 函数可能需要权限来访问其他 AWS 资源，例如 S3、Redshift 等。执行角色授予你的 Lambda 函数权限，以便按需访问资源。\n\
  \n你必须记住，你的 VPC 和安全组配置也会影响 Lambda 函数的运行方式。例如，如果你想创建一个需要互联网访问来下载某些内容的函数，那么你必须在具有互联网访问的\
  \ VPC 中部署此函数。同样适用于其他资源，例如访问关系数据库、Kinesis、Redshift 等。\n\n此外，为了正确配置 Lambda 函数，我们至少需要编写其代码、设置执行角色，并确保\
  \ VPC 和安全组配置符合我们的需求。接下来，让我们看看其他配置。\n\n### Completing your configurations and deploying\
  \ a Lambda Function\n\n一旦你在 AWS 控制台中创建了 Lambda，你就可以在部署函数之前设置其他配置。其中一个配置是事件触发器。正如我们之前提到的，你的\
  \ Lambda 函数可以由各种服务触发，甚至可以手动触发。\n\n> **Important note**\n> 触发器的一个非常常见的例子是 **Event\
  \ Bridge**。这是一个 AWS 服务，你可以在其中安排函数的执行。\n\n\n\n\n\n根据你选择的事件触发器，你的函数将可以访问不同的事件元数据。例如，如果你的函数由\
  \ S3 上的 **PUT** 事件触发（例如，有人向某个特定的 S3 存储桶上传文件），那么你的函数将接收与此事件关联的元数据，例如存储桶名称和对象键。其他类型的触发器会给你不同类型的事件元数据！\n\
  \n你可以通过属于你函数入口点签名的 event 参数访问这些元数据。还不够清楚？好的，让我们看看你的函数代码应该如何声明，如下所示：\n\n```\ndef\
  \ lambda_handler(event, context):\nTODO\n```\n\n这里，`lambda_handler` 是代表你函数入口点的方法。当它被触发时，此方法将被调用，并且它将接收与事件触发器关联的事件元数据（通过\
  \ `event` 参数）。这就是你能够访问触发你的函数的底层事件相关信息的方式！`event` 参数是一个类似 JSON 的对象。\n\n如果你想测试你的函数，但又不想直接从底层事件触发它，这也没问题；你可以使用\
  \ **test events**。它们通过准备一个将传递给你的函数的 JSON 对象来模拟底层事件。\n\n*Figure 9.15* 显示了一个非常直观的例子。假设你创建了一个函数，当用户向\
  \ S3 上传文件时触发，现在你想测试你的函数。你可以上传文件到 S3（从而强制触发）或创建一个测试事件。\n\n通过创建测试事件，你可以准备一个模拟 S3-put\
  \ 事件的 JSON 对象，然后将此对象传递给你的函数：\n\n### Configure test event\n\n一个函数最多可以有 10 个测试事件。事件会被持久化，因此你可以切换到另一台计算机或\
  \ Web 浏览器并使用相同的事件测试你的函数。\n\n- Create new test event\n- Edit saved test events\n\n\
  Event template\n\ns3-put\n\nEvent name\n\nMyEventName\n\n```\n{\n  \"Records\":\
  \ [\n    {\n      \"eventVersion\": \"2.0\",\n      \"eventSource\": \"aws:s3\"\
  ,\n      \"awsRegion\": \"us-east-1\",\n      \"eventTime\": \"1970-01-01T00:00:00.000Z\"\
  ,\n      \"eventName\": \"ObjectCreated:Put\",\n      \"userIdentity\": {\n    \
  \    \"principalId\": \"EXAMPLE\"\n      },\n      \"requestParameters\": {\n  \
  \      \"sourceIPAddress\": \"127.0.0.1\"\n      },\n      \"responseElements\"\
  : {\n        \"x-amz-request-id\": \"EXAMPLE123456789\",\n        \"x-amz-id-2\"\
  : \"EXAMPLE123/5678abcdefghijklambdaisawesome/mnopqrstuvwxyzABCDEFGH\"\n      },\n\
  \      \"s3\": {\n        \"s3SchemaVersion\": \"1.0\",\n        \"configurationId\"\
  : \"testConfigRule\",\n        \"bucket\": {\n          \"name\": \"example-bucket\"\
  ,\n          \"ownerIdentity\": {\n            \"principalId\": \"EXAMPLE\"\n  \
  \        },\n          \"arn\": \"arn:aws:s3:::example-bucket\"\n        },\n  \
  \      \"object\": {\n          \"key\": \"test/key\",\n          \"size\": 1024,\n\
  \          \"eTag\": \"0123456789abcdef0123456789abcdef\",\n          \"sequencer\"\
  : \"0A1B2C3D4E5F678901\"\n        }\n      }\n    }\n  ]\n}\n```\n\nCancel   Format\
  \ JSON   Create\n\nFigure 9.15 – Creating a test event from the Lambda console\n\
  \n你还可以设置另一种类型的配置，即 **environment variable**，它将在你的函数上可用。*Figure 9.16* 显示了如何在 Lambda\
  \ Function 中添加环境变量：\n\n![](img/209e007237d34506e7ba16180f2e905c_315_0.png)\n\nFigure\
  \ 9.16 – Adding environment variables to a Lambda Function\n\n你始终可以返回这些基本配置以根据需要进行调整。*Figure\
  \ 9.17* 显示了你在基本配置部分会找到的内容：\n\n![](img/209e007237d34506e7ba16180f2e905c_315_1.png)\n\
  \nFigure 9.17 – Changing the basic configurations of a Lambda Function\n\n就监控而言，默认情况下，Lambda\
  \ Functions 会生成一个 **CloudWatch** 日志流和标准指标。你可以通过导航到你的 Lambda Function 监控部分并点击 *View\
  \ logs in CloudWatch* 来访问日志信息。\n\n在 CloudWatch 中，每个 Lambda Function 都会有一个 **Log\
  \ group**，并且在该 Log group 内有许多 **Log streams**。Log streams 存储关联函数的执行日志。换句话说，log stream\
  \ 是共享相同来源的日志序列，在本例中是你的 Lambda Function。log group 是共享相同保留、监控和访问控制设置的 log streams\
  \ 的组。\n\n我们即将结束本节，但不是 Lambda Functions 这个主题的结束。正如我们之前提到的，这项 AWS 服务有很多用例并且与许多其他服务集成。在下一节中，我们将查看另一项\
  \ AWS 服务，它将帮助我们编排 Lambda Functions 的执行。这些被称为 **AWS Step Functions**。\n\n### Working\
  \ with Step Functions\n\nStep Functions 是一项 AWS 服务，允许你创建工作流以编排 Lambda Functions\
  \ 的执行。这样你就可以将它们连接成一种事件序列，称为 **steps**。这些步骤被分组在一个 **state machine** 中。\n\nStep Functions\
  \ 包含重试功能，因此你可以配置你的管道仅在特定步骤成功后才继续。你设置这些重试配置的方式是通过创建 **retry policy**。\n\n> **Important\
  \ note**\n> 就像大多数 AWS 服务一样，AWS Step Functions 也与其他服务集成，而不仅仅是 AWS Lambda。\n\n创建状态机相对简单。你只需导航到\
  \ AWS Step Functions 控制台，然后创建一个新的状态机。在 *Create state machine* 页面上，你可以指定是否要从头创建状态机、从模板创建，或者只是运行一个示例项目。\n\
  \nAWS 会帮助你创建此状态机，因此即使你选择从头创建，你也会找到各种任务的代码片段，例如 AWS Lambda 调用、SNS 主题发布、运行 Athena\
  \ 查询等。\n\n为了演示，我们将创建一个非常简单但仍然有用的示例，说明如何使用 Step Functions 执行 Lambda Function 并激活重试选项：\n\
  \n```\n{\n  \"Comment\": \"A very handy example of how to call a lambda function\
  \ with retry option\",\n  \"StartAt\": \"Invoke Lambda function\",\n  \"States\"\
  : {\n    \"Invoke Lambda function\": {\n      \"Type\": \"Task\",\n      \"Resource\"\
  : \"arn:aws:states:::lambda:invoke\",\n      \"Parameters\": {\n        \"FunctionName\"\
  : \"arn:aws:lambda:your-function-identification\",\n        \"Payload\": {\n   \
  \       \"Input\": {\n            \"env\": \"STAGE\"\n          }\n        }\n \
  \     },\n      \"Retry\": [\n        {\n          \"ErrorEquals\": [\"States.ALL\"\
  ],\n          \"IntervalSeconds\": 60,\n          \"MaxAttempts\": 5,\n        \
  \  \"BackoffRate\": 2.0\n        }\n      ],\n      \"Next\": \"Example\"\n    },\n\
  \    \"Example\": {\n      \"Type\": \"Pass\",\n      \"Result\": \"Just to show\
  \ you how to configure other steps\",\n      \"End\": true\n    }\n  }\n}\n```\n\
  \n在前面的示例中，我们创建了一个包含两个步骤的状态机：\n\n- Invoke Lambda function：这将启动你的底层 Lambda 的执行。\n\
  - Example：这是一个简单的 pass 任务，只是为了向你展示如何在管道中连接第二个步骤。\n\n在第一个步骤中，我们还设置了重试策略，如果出现任何失败，它将尝试重新执行此任务。我们设置了重试间隔（以秒为单位）以及尝试次数。Figure\
  \ 9.18 显示了状态机：\n\n![](img/209e007237d34506e7ba16180f2e905c_318_0.png)\n\nFigure\
  \ 9.18 – The state machine\n\n我们现在已经到达本节的末尾，也是本章的末尾。接下来，让我们总结一下我们学到的内容。\n\n### Summary\n\
  \n在本章中，我们学习了使用 SageMaker 创建 notebook 实例和训练实例的用法。在学习过程中，我们学习了如何使用 SageMaker 进行超参数调优作业。由于我们在\
  \ AWS 中保护资产的安全是至关重要的一部分，我们学习了保护 SageMaker 实例的各种方法。通过实践，我们创建了 Step Functions 并使用\
  \ AWS Lambda 编排了我们的管道。\n\nAWS 产品每天都在发展，以帮助我们解决 IT 问题。记住所有产品名称并不容易。学习的唯一方法是通过实践。当你解决问题或构建产品时，然后专注于产品的不同技术领域。这些领域可以是\
  \ AWS 服务，例如，调度作业、日志记录、跟踪、监控指标、自动扩展等。\n\n\n\n\n\n计算时间、存储和网络是基础。建议你为每项服务练习一些示例。参考\
  \ AWS 文档以澄清任何疑问也是最佳选择。设计解决方案时始终要以成本效益为重，因此探索以成本效益的方式使用这些服务与构建解决方案同等重要。祝你好运！\n\n\
