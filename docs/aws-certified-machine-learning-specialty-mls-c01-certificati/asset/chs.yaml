  \ Lambda function\n\n10. 在 lambda_function.py 中输入以下代码：\n\n```\nfrom __future__ import\
  \ print_function\nimport boto3\ndef lambda_handler(event, context):\n    print(\"\
  ======lambda_handler started======\")\n    # read the bucket name (key) from the\
