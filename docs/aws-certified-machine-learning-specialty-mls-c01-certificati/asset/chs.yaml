  \ are acceptable per AWS algorithm\n\n正如我们所见，许多算法都接受 text/.csv 格式。请记住，如果你想使用该格式，应遵循以下规则：\n\
  \n- 你的 CSV 文件不能有标题行。\n- 对于监督学习，目标变量必须在第一列。\n- 在配置训练管道时，将输入数据通道设置为 content_type 等于\
