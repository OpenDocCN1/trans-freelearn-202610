  \ Query editor 的屏幕截图\n\n我们现在了解了如何使用 AWS Glue 创建 ETL 作业，将数据从 S3 存储桶复制到 Amazon Redshift。我们还使用\
  \ UI 控制台中的查询编辑器在 Amazon Redshift 中查询了数据。如果您已成功完成步骤，建议删除 Redshift 集群和 AWS Glue 作业。AWS\
  \ 在您的账户中创建两个存储桶来存储 AWS Glue 脚本和 AWS Glue 临时结果。因此，请一并删除以节省成本。我们将在下一节中使用在 S3 数据上创建的数据目录。\n\
  \n在下一节中，我们将学习如何使用 Athena 查询 S3 数据。\n\n### 使用 Athena 查询 S3 数据\n\nAthena 是一种无服务器服务，专为查询存储在\
  \ S3 中的数据而设计。它是无服务器的，因为客户端不需要管理用于计算的服务器：\n\n- Athena 使用架构来根据存储在 S3 中的数据呈现查询结果。您定义数据的显示方式的架构，Athena\
  \ 从 S3 读取原始数据并根据定义的架构显示结果。\n\n\n\n\n\n- 输出可被其他服务用于可视化、存储或各种分析目的。S3 中的源数据可以是以下结构化、半结构化和非结构化数据格式中的任意一种，包括\
  \ XML、JSON、CSV/TSV、AVRO、Parquet、ORC 等。CloudTrail、ELB 日志和 VPC 流日志也可以存储在 S3 中并由 Athena\
  \ 分析。\n- 这遵循 schema-on-read 技术。与传统技术不同，表是在数据目录中预先定义的，并在读取时进行投影。可以在不转换源数据的情况下对数据执行类似\
  \ SQL 的查询。\n\n现在，让我们通过一个示例来理解这一点，我们将在 S3 数据上使用在 AWS Glue 上创建的 AWSDataCatalog 并使用\
  \ Athena 查询它们：\n\n- 1. 导航到 AWS Athena 控制台。从数据源中选择 AWSDataCatalog（如果你是第一次操作，则会创建一个名为\
  \ sampledB 的数据库，其中在 AWS Glue 数据目录中包含一个表 elb_logs）。\n- 2. 选择 s3-data 作为数据库。\n- 3.\
  \ 点击右上角的设置并填写如 Figure 6.8 所示的详细信息（我使用了与前一个示例相同的存储桶和不同的文件夹）：\n\n![](img/209e007237d34506e7ba16180f2e905c_205_0.png)\n\
  \nFigure 6.8 – A screenshot of Amazon Athena's settings\n\n- 4. 下一步是在查询编辑器中编写查询并执行它。执行完成后，请删除你的\
  \ S3 存储桶和 AWS Glue 数据目录。这将为你节省费用。\n\n在本节中，我们学习了通过 AWS 数据目录使用 Amazon Athena 查询 S3\
  \ 数据。你也可以创建自己的架构并从 S3 查询数据。在下一节中，我们将学习 Amazon Kinesis Data Streams。\n\n### Processing\
  \ real-time data using Kinesis data streams\n\nKinesis 是 Amazon 的流服务，可以根据需求进行扩展。它在区域内高度可用。它具有持久性，默认保留数据\
  \ 24 小时，或可选最长保留 365 天。Kinesis 数据流用于大规模数据摄取、分析和监控：\n\n- Kinesis 可以由多个生产者摄取，多个消费者也可以从流中读取数据。让我们通过实时示例来理解这一点。假设你有一个生产者向\
  \ Kinesis 流摄取数据，默认保留期为 24 小时，这意味着今天 05:00:00 A.M. 摄取的数据将在明天 04:59:59 A.M. 之前在流中可用。此后数据将不可用，理想情况下应在过期前消费，或如果关键则存储在其他地方。保留期可延长至最长\
  \ 365 天，需额外付费。\n- Kinesis 可用于实时分析或仪表板可视化。生产者可以想象为将数据推送到 Kinesis 流的一段代码，它可以是运行代码的\
  \ EC2 实例、Lambda 函数、物联网设备、本地服务器、移动应用程序或设备等。\n- 同样，消费者也可以是一段运行在 EC2 实例、Lambda 函数或本地服务器上的代码，它知道如何连接到\
  \ kinesis 流、读取数据并对数据执行某些操作。AWS 提供触发器，以便在数据到达 kinesis 流时立即调用 lambda 消费者。\n- Kinesis\
  \ 由于其分片架构而具有可扩展性，分片是 kinesis 流的基本吞吐量单元。什么是分片？分片是一个逻辑结构，根据分区键对数据进行分区。分片支持 1 MB/秒的写入容量和\
  \ 2 MB/秒的读取容量。单个分片支持每秒 1,000 条 PUT 记录。如果你创建了一个包含 3 个分片的流，则可以实现 3 MB/秒的写入吞吐量和 6 MB/秒的读取吞吐量，这允许\
  \ 3,000 条 PUT 记录。因此，分片越多，你需要支付额外费用以获得更高性能。\n\n- 分片中的数据通过 Kinesis 数据记录存储，最大可达 1 MB。Kinesis\
  \ 数据记录根据分区键存储在分片中。它还具有序列号。序列号是在执行 `putRecord` 或 `putRecords` API 操作时由 kinesis 分配的，以便唯一标识一条记录。分区键由生产者在向\
  \ Kinesis 数据流添加数据时指定，分区键负责将记录隔离并路由到流中的不同分片以平衡负载。\n- 有两种加密 kinesis 流中数据的方式：服务器端加密和客户端加密。客户端加密很难实现和管理密钥，因为客户端必须在将数据放入流之前加密数据，并在从流读取后解密数据。通过启用\
  \ **AWS/KMS** 的服务器端加密，数据在你将数据放入流和从流获取数据时会自动加密和解密。\n\n> **Note**\n> Amazon Kinesis\
  \ 不应与 Amazon SQS 混淆。Amazon SQS 支持一个生产组和一个消费组。如果你的用例需要多个用户发送和接收数据，则 Kinesis 是解决方案。\n\
  > \n> 对于解耦和异步通信，SQS 是解决方案，因为发送方和接收方不需要相互了解。\n> \n> 在 SQS 中，没有持久性概念。一旦消息被读取，下一步就是删除。Amazon\
  \ SQS 没有保留时间窗口的概念。如果你的用例需要大规模摄取，则应使用 Kinesis。\n\n在下一节中，我们将学习如何存储流数据以供进一步分析。\n\n\
  ### Storing and transforming real-time data using Kinesis Data Firehose\n\n有很多用例要求数据被流式传输并存储以供将来分析。为了解决此类问题，你可以编写一个\
  \ kinesis 消费者来读取 Kinesis 流并将数据存储在 S3 中。此解决方案需要一个实例或机器来运行代码，并具有从流读取和写入 S3 的所需访问权限。另一个可能的选择是运行一个\
  \ Lambda 函数，该函数在对流执行的 `putRecord` 或 `putRecords` API 被调用时触发，并从流中读取数据以存储在 S3 存储桶中：\n\
  \n- 为了让这变得更容易，Amazon 提供了一个名为 Kinesis Data Firehose 的单独服务。它可以轻松地插入到 Kinesis 数据流中，并且需要基本的\
  \ IAM 角色来将数据写入 S3。这是一项完全托管的服务，可减少管理服务器和代码的负担。它还支持将流式数据加载到 Amazon Redshift、Amazon\
  \ Elasticsearch Service 和 Splunk。Kinesis Data Firehose 会自动扩展以匹配数据的吞吐量。\n- 数据可以通过\
  \ AWS Lambda 函数在存储或交付到目的地之前进行转换。如果你想构建一个包含未转换数据的原始数据湖，则通过启用源记录备份，你可以在转换之前将其存储在另一个\
  \ S3 存储桶中。\n- 在交付到 S3 存储桶后，可以借助 AWS/KMS 对数据进行加密。它需要在创建交付流时启用。数据也可以压缩为受支持的格式，如 GZIP、ZIP\
  \ 和 SNAPPY 压缩格式。\n\n在下一节中，我们将学习用于从本地服务器向 AWS 摄取数据的不同 AWS 服务。\n\n### Different ways\
  \ of ingesting data from on-premises into AWS\n\n随着数据驱动用例需求的增加，目前在本地服务器上管理数据相当困难。当处理大量数据时，备份并不容易。这些数据湖中的数据被用于构建深度神经网络、创建数据仓库以从中提取有意义的信息、运行分析和生成报告。\n\
  \n现在，如果我们看看将数据迁移到 AWS 的可用选项，那么它也伴随着各种挑战。例如，如果你想将数据发送到 S3，则必须编写几行代码将数据发送到 AWS。你必须管理运行代码的代码和服务器。必须确保数据通过\
  \ HTTPS 网络传输。你需要验证数据传输是否成功。这增加了复杂性以及时间和精力的挑战。为避免此类情况，AWS 提供服务来匹配或解决你的用例，通过设计混合基础设施，允许本地数据中心与\
  \ AWS 之间共享数据。让我们在以下部分学习这些。\n\n### AWS Storage Gateway\n\nStorage Gateway 是一种混合存储虚拟设备。它可以在三种不同模式下运行\
  \ – **File Gateway**、**Tape Gateway** 和 **Volume Gateway**。它可用于扩展、迁移和备份本地数据中心到 AWS：\n\
  \n- 在 Tape Gateway 模式下，存储网关在 S3 上存储虚拟磁带，并在弹出并归档时，磁带从 S3 移动到 Glacier。活动磁带存储在 S3 中以便存储和检索。归档或导出的磁带存储在\
  \ Glacier 中的 **Virtual Tape Shelf (VTS)**。可以创建虚拟磁带，大小范围从 100 GiB 到 5 TiB。可以本地配置总共\
  \ 1 PB 的存储，并且可以无限数量的磁带归档到 Glacier。这对于现有的磁带备份系统以及需要将备份数据迁移到 AWS 的情况是理想的。你可以稍后停用物理磁带硬件。\n\
  - 在 File Gateway 模式下，存储网关将文件映射到 S3 对象，这些对象可以使用其中一种可用的存储类进行存储。这有助于将数据中心扩展到 AWS。你可以向\
  \ File Gateway 加载更多文件，这些文件将作为 S3 对象存储。它可以在你的本地虚拟服务器上运行，该服务器使用 **Server Message Block\
  \ (SMB)** 或 **Network File System (NFS)** 连接到各种设备。File Gateway 使用 HTTPS 公共端点连接到\
  \ AWS 以将数据存储在 S3 对象上。可以对这些 S3 对象应用生命周期策略。你可以轻松地将 **Active Directory (AD)** 与 File\
  \ Gateway 集成以控制对文件共享上文件的访问。\n\n\n\n\n\n- 在 Volume Gateway 模式下，存储网关提供块存储。 使用此模式有两种方式，一种是\
  \ **Gateway Cached**，另一种是 **Gateway Stored**：\n- **Gateway Stored** 是一种在本地运行的卷存储网关，具有本地存储和上传缓冲区。\
  \ 最多可以创建 32 个卷，每个卷大小可达 16 TB，总容量为 512 TB。 主要数据存储在本地，备份数据会异步复制到 AWS 后台。 卷通过 **Internet\
  \ Small Computer Systems Interface (iSCSI)** 提供给基于网络的服务器访问。 它通过 HTTPS 公共端点连接到 **Storage\
  \ Gateway Endpoint**，并从备份数据创建 EBS 快照。 这些快照可用于创建标准 EBS 卷。 此选项非常适合迁移到 AWS 或灾难恢复或业务连续性。\
  \ 本地系统仍会使用本地卷，但 EBS 快照位于 AWS 中，可用作备份替代。 由于需要大量本地存储，因此这不是数据中心扩展的最佳选择。\n- **Gateway\
  \ Cached** 是一种在本地运行的卷存储网关，具有缓存存储和上传缓冲区。 不同之处在于，添加到存储网关的数据不是本地的，而是上传到 AWS。 主要数据存储在\
  \ AWS。 频繁访问的数据会缓存在本地。 这是将本地数据中心扩展到 AWS 的理想选择。 它通过 HTTPS 公共端点连接到 **Storage Gateway\
  \ Endpoint**，并创建 **S3 Backed Volume (AWS-managed bucket)** 快照，这些快照以标准 EBS 快照形式存储。\n\
  \n### Snowball, Snowball Edge, and Snowmobile\n\n它们属于用于在业务运营地点和 AWS 之间物理传输数据的同一产品系列。\
  \ 对于将大量数据移入和移出 AWS，您可以使用其中任何一种：\n\n- **Snowball**：可通过在 AWS 上提交作业来订购。 AWS 将设备交付给您加载数据并寄回。\
  \ Snowball 中的数据使用 KMS 加密。 它提供两种容量范围，一种为 50 TB，另一种为 80 TB。 对于 10 TB 至 10 PB 之间的数据，订购一个或多个\
  \ Snowball 设备具有经济性。 设备可以发送到不同场所。 它没有任何计算能力； 仅提供存储能力。\n- **Snowball Edge**：与 Snowball\
  \ 类似，但它同时具有存储和计算能力。 它的容量大于 Snowball。 它提供快速网络连接，例如通过 RJ45 的 10 Gbps、通过 SFP28 的 10/25\
  \ Gb，以及通过 QSFP+ 铜缆的 40/100 Gb+。 这非常适合将 TB 到 PB 级数据安全快速传输到 AWS。\n- **Snowmobile:**\
  \ 这是一个装在卡车上的集装箱式便携数据中心。 这使您可以将 EB 级数据从本地迁移到 AWS。 如果您的数据大小超过 10 PB，则首选 Snowmobile。\
  \ 本质上，在请求 Snowmobile 后，一辆卡车会开到您的地点，您将数据中心连接到卡车并传输数据。 如果您有多个站点，选择 Snowmobile 进行数据传输并不是理想的选择。\n\
  \n### AWS DataSync\n\nAWS DataSync 旨在将数据从本地存储移动到 AWS，或反之亦然：\n\n- 它是 AWS 用于数据处理传输、归档或经济高效存储、灾难恢复、业务连续性以及数据迁移的理想产品。\n\
  - 它具有特殊的数据验证功能，可在数据到达 AWS 后立即验证原始数据与 AWS 中的数据。 换句话说，它检查数据的完整性。\n- 让我们通过一个本地数据中心具有\
  \ SAN/NAS 存储的示例来深入了解此产品。 当我们在 VMWare 平台上运行 AWS DataSync 代理时，此代理能够通过 NFS/SMB 协议与\
  \ NAS/SAN 存储通信。 启动后，它会与 AWS DataSync 端点通信，从那里可以连接到多种类型的存储位置，包括各种 S3 存储类别或基于 VPC\
  \ 的资源，例如 **Elastic File System (EFS)** 和 FSx for Windows Server。\n- 它允许您在特定时段安排数据传输。\
  \ 通过配置内置带宽限制，您可以限制 DataSync 使用的网络带宽量。\n\n### Processing stored data on AWS\n\n有多个服务可用于处理存储在\
  \ AWS 中的数据。 本节我们将介绍 AWS Batch 和 AWS EMR（Elastic MapReduce）。 EMR 是 AWS 提供的一种主要以托管方式运行\
  \ MapReduce 作业和 Spark 应用的产品。 AWS Batch 用于长时间运行、计算密集型工作负载。\n\n### AWS EMR\n\nEMR\
  \ 是 AWS 作为服务提供的 Apache Hadoop 的托管实现。 它包括 Hadoop 生态系统的其他组件，例如 Spark、HBase、Flink、Presto、Hive、Pig\
  \ 等。 我们不会在认证考试中详细讨论这些内容：\n\n- EMR 集群可以从 AWS 控制台或通过 AWS CLI 启动，具有特定数量的节点。 集群可以是长期集群或临时集群。\
  \ 如果您有一个长期运行的传统集群，则必须自行配置机器并管理它们。 如果您需要更快地执行作业，则需要手动添加集群。 在 EMR 的情况下，这些管理开销都不复存在。\
  \ 您可以向 EMR 请求任意数量的节点，它会为您管理和启动节点。 如果在集群上启用了自动扩缩容，则随着需求增加，EMR 会在集群中启动新节点，并在负载降低后停用节点。\n\
  - EMR 在后台使用 EC2 实例，并在 VPC 中的一个可用区运行。 这使得节点之间的网络速度更快。 AWS Glue 在后台使用 EMR 集群，用户无需担心\
  \ AWS EMR 的运维理解。\n- 从用例角度来看，EMR 可用于处理或转换存储在 S3 中的数据，并将输出数据存储回 S3。 EMR 使用节点（EC2 实例）作为数据处理的计算单元。\
  \ EMR 节点有不同的变体，包括主节点、核心节点和任务节点。\n- EMR 主节点充当 Hadoop namenode 并管理集群及其健康状况。 它负责在其他核心节点和任务节点之间分配作业负载。\
  \ 如果启用了 SSH，则可以连接到主节点实例并访问集群。\n- EMR 集群可以有一个或多个核心节点。 如果您熟悉 Hadoop 生态系统，则核心节点类似于\
  \ Hadoop 用于 HDFS 的数据节点，并负责在其中运行任务。\n- 任务节点是可选的，它们没有 HDFS 存储。 它们负责运行任务。 如果任务节点因某种原因失败，则不会影响\
  \ HDFS 存储，但核心节点故障会导致 HDFS 存储中断。\n- EMR 具有名为 EMRFS 的文件系统。 它由 S3 支持，此功能使其具有区域弹性。 如果核心节点失败，数据仍安全存储在\
  \ S3 中。 HDFS 在 I/O 方面更高效，比 EMRFS 更快。\n\n在以下部分，我们将学习 AWS Batch，这是一种托管批处理计算服务，可用于长时间运行的服务。\n\
  \n### AWS Batch\n\n这是一种托管批处理产品。 如果您使用 AWS Batch，则作业可以在无需最终用户交互的情况下运行，也可以安排运行：\n\n\
  - 想象一个事件驱动的应用程序，它启动一个 Lambda 函数来处理存储在 S3 中的数据。 如果处理时间超过 15 分钟，则 Lambda 有执行时间限制。\
  \ 对于此类场景，AWS Batch 是更好的解决方案，可以按计划或通过 API 事件驱动计算密集型工作负载。\n- AWS Batch 非常适合需要更长处理时间或更多计算资源的使用案例。\n\
  - AWS Batch 运行的作业可以是脚本或可执行文件。 一个作业可以依赖另一个作业。 作业需要定义，例如谁可以运行作业（IAM 权限）、作业可以在哪里运行（使用的资源）、挂载点和其他元数据。\n\
  - 作业提交到队列中，在那里等待计算环境容量。 这些队列与一个或多个计算环境相关联。\n- 计算环境负责实际执行作业。 这些可以是 ECS 或 EC2 实例，或任何计算资源。\
  \ 您也可以定义其大小和容量。\n- 环境根据优先级从队列接收作业并执行作业。 它们可以是托管或非托管计算环境。\n- AWS Batch 可以将元数据存储在\
  \ DynamoDB 中以供进一步使用，也可以将输出存储到 S3 存储桶中。\n\n> **Note**\n> 如果您在考试中遇到需要灵活计算、更高磁盘空间、无时间限制（超过\
  \ 15 分钟）或有效资源限制的事件式工作负载问题，则应选择 AWS Batch。\n\n\n\n\n\n### 摘要\n\n在本章中，我们学习了在 AWS 中处理数据的不同方式。我们还学习了将数据中心扩展到\
  \ AWS 的能力、将数据迁移到 AWS 以及摄取过程。我们还学习了使用数据进行处理的各种方式，使其以我们的方式准备好进行分析。我们理解了拥有数据目录的魔力，它帮助我们通过\
  \ AWS Glue 和 Athena 查询数据。\n\n在下一章中，我们将学习各种机器学习算法及其用途。\n\n### 问题\n\n- 1. 如果你有大量 IoT\
  \ 设备向 AWS 发送数据供大量移动设备消费，你应该选择以下哪一项？\n  A. SQS 标准队列\n  B. SQS FIFO 队列\n  C. Kinesis\
  \ 流\n\n- 2. 如果你有解耦高容量应用的需求，你应该选择以下哪一项？\n  A. SQS 标准队列\n  B. SQS FIFO 队列\n  C. Kinesis\
  \ 流\n\n- 3. 为了提高 Kinesis 流的性能，以下哪一项需要更改？\n  A. 流的读取容量单元\n  B. 流的写入容量单元\n  C. 流的分片\n\
  \  D. 流的区域\n\n- 4. 以下哪一项确保数据完整性？\n  A. AWS Kinesis\n  B. AWS DataSync\n  C. AWS\
  \ EMR\n  D. Snowmobile\n\n- 5. 哪种存储网关模式可以用 S3 存储替换磁带驱动器？\n  A. Volume Gateway Stored\n\
  \  B. Volume Gateway Cached\n  C. File\n  D. VTL\n\n- 6. 哪种存储网关模式可用于通过 SMB 向客户端提供存储？\n\
  \  A. Volume Gateway Stored\n  B. Volume Gateway Cached\n  C. File\n  D. VTL\n\n\
  - 7. 哪种存储网关模式最适合将数据中心扩展到 AWS？\n  A. Volume Gateway Stored\n  B. Volume Gateway Cached\n\
  \  C. File\n  D. VTL\n\n- 8. AWS 中哪种存储产品可用于 Windows 环境的共享存储？\n  A. S3\n  B. FSx\n\
  \  C. EBS\n  D. EFS\n\n- 9. EMR 集群中哪个节点处理操作？\n  A. 主节点\n  B. 核心节点\n  C. 任务节点\n \
  \ D. 主节点\n\n- 10. EMR 集群中哪些节点适合使用 Spot 实例？\n  A. 主节点\n  B. 核心节点\n  C. 任务节点\n  D.\
  \ 主节点\n\n- 11. 如果你有大量流数据并将其添加到 Redshift，你会使用哪些服务？（选择三项）\n  A. Kinesis Data Streams\n\
  \  B. Kinesis Data Firehose\n  C. S3\n  D. SQS\n  E. Kinesis Analytics\n\n- 12.\
  \ Kinesis Firehose 支持使用 Lambda 进行数据转换。\n  A. 真\n  B. 假\n\n- 13. 以下哪些是 Kinesis Data\
  \ Firehose 的有效目标？（选择五项）\n  A. HTTP\n  B. Splunk\n  C. Redshift\n  D. S3\n  E. Elastic\
  \ Search\n  F. EC2\n  G. SQS\n\n### 答案\n\n- 1. C\n- 2. A\n- 3. C\n- 4. B\n- 5. D\n\
  - 6. C\n- 7. B\n- 8. B\n- 9. A\n- 10. C\n- 11. A, B, C\n- 12. A\n- 13. A, B, C,\
  \ D, E\n"
