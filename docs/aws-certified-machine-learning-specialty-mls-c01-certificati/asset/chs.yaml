  \ AWS 服务、数据工程、数据探索、数据架构等方面的知识。这次，我们将更深入地探讨我们迄今为止讨论过的算法以及其他许多算法。\n\n对不同类型的算法和机器学习方法有良好的认识，将使你在项目中做出决策时处于非常有利的位置。当然，这类知识对于\
  \ AWS 机器学习专业考试也至关重要。\n\n请记住，外面有成千上万种算法，而且顺便说一下，你甚至可以为特定问题提出自己的算法。此外，我们将涵盖最相关的算法，希望这些也是你在考试中可能遇到的算法。\n\
  \n本章的主要主题如下：\n\n- 存储训练数据\n- 关于集成模型的说明\n- 回归模型\n- 分类模型\n- 预测模型\n- Object2Vec\n- 聚类\n\
  - 异常检测\n- 降维\n- IP Insights\n- 自然语言处理\n- 强化学习\n\n好了，开始吧！\n\n### 介绍本章\n\n在本章中，我们将讨论多种算法、建模概念和学习策略。我们认为所有这些主题在考试期间以及你的数据科学家职业生涯中都将对你有益。\n\
  \n我们以一种方式构建了本章，使其不仅涵盖考试的必要主题，还能让你很好地了解目前最重要的学习策略。例如，考试会检查你对 K-means 基本概念的了解；然而，我们将对其进行更深入的介绍，因为这是你作为数据科学家职业生涯中的一个重要主题。\n\
  \n我们将遵循这种方法，对我们认为每个数据科学家都应该掌握的一些模型类型更深入地研究算法的逻辑。因此，请记住这一点：有时，我们可能会比考试预期更深入，但这对你来说将极其重要。\n\
  \n在本章中，我们多次会使用术语 **内置算法**。当我们想指代 AWS 在其 SageMaker SDK 上实现的算法列表时，我们会使用此术语。\n\n让我给你一个具体的例子：你可以使用\
