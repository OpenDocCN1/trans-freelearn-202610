  \ events`\n+   - **Prefix:** `input-text/`\n+   - **Suffix:** `.txt`\n+   - **Send\
  \ to:** `Lambda Function`\n+   - **Lambda:** `polly-lambda`\n\n7. 接下来，我们将上传一个文件以触发事件并在\
