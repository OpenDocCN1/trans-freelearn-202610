  \nFigure 2.10 – The logs in the CloudWatch console\n\n10. 它将以 MP3 格式创建输出，如以下屏幕截图所示。下载并收听它：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_60_1.png)\n\nFigure 2.11 – The output\
  \ file that was created in the S3 bucket\n\n**Important note**\n对于您的移动应用或 Web 应用而言，最具可扩展性和成本效益的方式是为\
  \ S3 桶生成 AWS 预签名 URL 并将其提供给用户。这些 S3 Put 事件会异步调用下游 AI 工作流以生成结果并向终端用户发送响应。通过这种方法可以同时为许多用户提供服务，并且可能提高性能和吞吐量。\n\
  \n在本节中，我们学习了如何实现文本转语音。在下一节中，我们将学习 Amazon Transcribe，这是一种语音转文本 AI 服务。\n\n### Speech\
  \ to text with Amazon Transcribe\n\n在上一节中，我们学习了文本转语音。在本节中，我们将学习语音转文本以及提供此功能的服务：Amazon\
  \ Transcribe。它是一种自动语音识别服务，使用预训练的深度学习模型，这意味着我们不必在 PB 级数据上训练以生成模型；Amazon 已为我们完成了此操作。我们只需使用可用的\
  \ API 来转录音频文件或视频文件；它支持多种不同的语言和自定义词汇。准确性是关键，通过自定义词汇，您可以根据所需的领域或行业来增强它：\n\n![](img/209e007237d34506e7ba16180f2e905c_61_0.png)\n\
  \nFigure 2.12 – Block diagram of Amazon Transcribe's input and output\n\nAmazon\
  \ Transcribe 的一些常见用途包括以下内容：\n\n+   - 实时音频流式传输和转录。\n+   - 转录预先录制的音频文件。\n+   - 通过结合\
  \ AWS Elasticsearch 和 Amazon Transcribe 从媒体文件中实现文本搜索。\n+   - 对录制的音频文件执行情感分析，用于语音帮助台（联系中心分析）。\n\
  +   - 通道识别分离。\n\n接下来，我们将探讨 Amazon Transcribe 的优势。\n\n### Exploring the benefits\
  \ of Amazon Transcribe\n\n让我们看一下使用 Amazon Transcribe 的一些优势：\n\n+   - *Content Redaction*:\
  \ 可以通过指示 Amazon Transcribe 识别并从语言转录中删除 **个人身份信息 (PII)** 来确保客户隐私。您可以通过提供不想要的词列表以及\
  \ `StartTranscriptionJob` 操作提供的 `VocabularyFilterName` 和 `VocabularyFilterMethod`\
  \ 来从转录中过滤掉不想要的词。例如，在金融组织中，这可用于删除呼叫者详细信息。\n+   - *Language Identification*: 它可以自动识别音频文件中使用的最常用语言并生成转录。如果您有多个音频文件，则此服务可以帮助您按语言对其进行分类。\n\
  +   - *Streaming Transcription*: 您可以将录制的音频文件或实时音频流发送到 Amazon Transcribe，并实时输出文本流。\n\
  +   - *Custom Vocabulary or Customized Transcription*: 您可以根据自定义需求使用自定义词汇表列表来生成准确的转录。\n\
  +   - *TimeStamp Generation*: 如果您想为视频构建或添加字幕，则 Amazon Transcribe 可以返回音频中每个单词或短语的时间戳。\n\
  +   - *Cost Effectiveness*: 作为托管服务，没有基础设施成本。\n\n现在，让我们动手使用 Amazon Transcribe。\n\n\
  ### Getting hands-on with Amazon Transcribe\n\n在本节中，我们将构建一个管道，其中可以将 AWS Lambda 与\
  \ Amazon Transcribe 集成，以读取存储在 S3 桶中文件夹中的音频文件，然后将输出 JSON 文件存储在另一个 S3 桶中。我们还将在 CloudWatch\
  \ 日志中监控任务的进度。我们将使用 `start_transcription_job` 异步函数来启动我们的作业，并将通过 `get_transcription_job`\
  \ 不断监控作业，直到其状态变为 COMPLETED。让我们开始吧：\n\n+   1. 首先，为 Lambda 函数执行创建一个名为 `transcribe-demo-role`\
  \ 的 IAM 角色。确保它可以从/向 S3 读取和写入，使用 Amazon Transcribe，并在 CloudWatch 日志中打印输出。将以下策略添加到\
  \ IAM 角色：\n+      - `AmazonS3FullAccess`\n+      - `CloudWatchFullAccess`\n+   \
  \   - `AmazonTranscribeFullAccess`\n\n2. 现在，我们将使用现有的 IAM 角色 `transcribe-demo-role`\
  \ 创建一个名为 `transcribe-lambda` 的 Lambda 函数并保存它。\n\n请确保在 lambda 函数的 **Basic settings**\
  \ 部分将默认超时更改为更高的值。我将其设置为 10 分钟 20 秒以避免超时错误。我们将使用一个名为 `start_transcription_job` 的异步\
  \ API 调用启动任务，并使用 `get_transcription_job` API 监控同一任务。\n\n3. 粘贴 https://github.com/PacktPublishing/AWS-Certified-Machine-Learning-Specialty-MLS-C01-Certification-Guide/blob/master/Chapter-2/Amazon%20Transcribe%20Demo/lambda_function/lambda_function.py\
  \ 中的代码并单击 **Deploy**。\n\n这应给我们以下输出：\n\n![](img/209e007237d34506e7ba16180f2e905c_63_0.png)\n\
  \nFigure 2.13 – The Basic settings section of our created lambda function\n\n4.\
  \ 接下来，我们将创建名为 `transcribe-demo-101` 的 S3 桶和名为 input 的文件夹。通过进入 **Properties** 选项卡的\
  \ **Create event notification** 部分创建事件。输入以下详细信息：\n\n+   - **Name:** `audio-event`\n\
  +   - **Events:** `All object create events`\n+   - **Prefix:** `input/`\n+   -\
  \ **Destination:** `Lambda Function`\n+   - **Lambda:** `transcribe-lambda`\n\n\n\
  \n\n\n+   5. 将 .mp4 格式的音频文件上传到输入文件夹。这将触发 Lambda 函数。根据代码，输出将以 JSON 格式存储在 S3 存储桶中，然后你可以使用它来读取文件的内容。\n\
  \n+   6. 导航到 CloudWatch > CloudWatch Logs > Log groups > aws/lambda/transcribe-lambda。从列表中选择最新的流。它看起来如下所示：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_64_0.png)\n\n图 2.14 – CloudWatch 控制台中指定日志组的日志流中的日志\n\
  \n+   7. 输出以 JSON 格式保存到 S3 存储桶中，具体取决于代码中提到的 jobname（你可以使用 S3 getObject API 下载并读取它）：\n\
  \n![](img/209e007237d34506e7ba16180f2e905c_64_1.png)\n\n图 2.15 – S3 存储桶中的输出 JSON\
  \ 文件\n\n**重要说明**\n最好不要过度配置函数的超时设置。始终了解你的代码性能并据此设置函数超时。过度配置函数超时会导致 Lambda 函数运行时间更长，并造成意外的成本。如果你在使用\
  \ Lambda 函数中的异步 API 调用，那么最好将它们写入 SNS 主题以实现成功，并从中触发另一个 Lambda 函数。如果需要人工干预，则建议使用 AWS\
  \ Step Functions。\n\n在本节中，我们学习并应用了 Amazon Transcribe 将语音转换为文本。在下一节中，我们将学习一种最强大的\
  \ AWS AI 服务，我们可以用它从文本数据中获得最大量的洞察。\n\n### 使用 Amazon Comprehend 实现自然语言处理\n\n此服务可帮助你从非结构化文本中提取洞察。非结构化文本信息呈指数级增长。以下是一些数据源示例：\n\
  \n- *客户参与度：* 呼叫中心、问题分诊、客户调查和产品评论\n- *业务流程：* 客户/供应商电子邮件、产品支持消息和运营支持反馈\n- *记录和研究：*\
  \ 白皮书和医疗记录\n- *新闻和社交媒体：* 社交媒体分析、品牌趋势和相关事件\n\n现在，问题是，我们可以用这些数据做什么？我们如何分析它并从中提取价值？答案是\
  \ Amazon Comprehend，它用于从非结构化数据中获取洞察。\n\nAmazon Comprehend 的一些常见用途包括以下内容：\n\n- 信息管理系统\n\
  - 对组织主题的更准确的搜索系统\n- 用户情感分析\n- 支持工单分类\n- 从文档中检测语言，然后使用 Amazon Translate 将其翻译成英语\n\
  - 创建一个系统来标记非结构化临床数据以协助研究和分析目的\n- 从公司会议或电视新闻的保存音频文件中提取主题\n\n接下来，我们将探索 Amazon Comprehend\
  \ 的优势。\n\n### 探索 Amazon Comprehend 的优势\n\n使用 Comprehend 的一些优势可以在以下图像中看到：\n\n![](img/209e007237d34506e7ba16180f2e905c_66_0.png)\n\
  \n图 2.16 – 显示 Amazon Comprehend 功能的框图\n\n让我们更详细地看一下这些内容：\n\n- 它检测文本的语言并提取关键短语。Amazon\
  \ Comprehend 也可用于情感分析和主题建模。\n- Amazon Comprehend Medical 可用于提取医疗信息。\n- 由于这是一项完全托管的服务，你按使用付费；你无需为基础设施付费。你无需训练、开发和部署自己的模型。\n\
  - 主题建模服务通过提取最多 100 个主题来工作。主题是一个关键词桶，这样你就可以看到实际文档语料库中的内容。\n- 它准确、持续训练且易于使用。\n\n接下来，我们将亲手操作\
  \ Amazon Comprehend。\n\n### 亲手操作 Amazon Comprehend\n\n在本节中，我们将构建一个管道，在其中可以将 AWS\
