  \ Jupyter Notebook 应用程序。用户无需使用 SageMaker 管理这些内容。\n\n- **Lifecycle configurations**：当存在需要不同库的用例，而该库在笔记本实例中不可用时，这很有用。为了安装库，用户将执行\
  \ `pip install` 或 `conda install`。然而，一旦笔记本实例终止，定制就会丢失。为了避免这种情况，你可以通过 **Lifecycle\
  \ configurations** 提供的脚本来自定义你的笔记本实例。你可以选择 `/home/ec2-user/anaconda3/envs/` 中存在的任何环境，并根据需要自定义特定环境。\n\
  - **Git repositories**：AWS CodeCommit、GitHub 或任何其他 Git 服务器可以与笔记本实例关联以实现笔记本的持久化。如果获得访问权限，则同一笔记本可以被其他开发人员使用以协作并以源代码控制的方式保存。Git\
  \ 仓库可以通过此选项单独添加，也可以在创建时与笔记本实例关联。\n\n正如你在 *图 9.2* 中看到的，**Training** 提供了 **Algorithms**、**Training\
  \ jobs** 和 **Hyperparameter tuning jobs**。让我们了解它们的使用方法：\n\n- **Algorithms**：这是决定要在清理后的数据上运行的算法的第一步。你可以选择自定义算法或根据用例创建自定义算法。否则，你可以在清理后的数据上运行\
  \ SageMaker 算法。\n- **Training jobs**：你可以通过 API 调用从笔记本实例创建训练作业。你可以设置实例数量，输入数据源详细信息，执行检查点配置和输出数据配置。Amazon\
  \ SageMaker 管理训练实例，并将模型工件作为输出存储在指定位置。增量训练（即不时训练模型以获得更好的结果）和托管 Spot 训练（即降低成本）也可以实现。\n\
  - **Hyperparameter tuning jobs**：通常，超参数在训练过程之前为算法设置。在训练过程中，我们让算法找出这些参数的最佳值。通过超参数调优，我们获得具有超参数最佳值的最佳模型。这可以通过控制台或通过\
  \ API 调用完成。也可以从笔记本实例编排。\n\n**Inference** 提供了许多功能，并且每天都在发展：\n\n- **Compilation jobs**：如果你的模型使用\
  \ Keras、MXNet、ONNX、PyTorch、TFLite、TensorFlow 或 XGBoost 等机器学习框架训练，并且你的模型工件可在 S3 存储桶上获得，那么你可以选择\
  \ **Target device** 或 **Target platform**。目标设备用于部署你的模型，例如 AWS SageMaker 机器学习实例或\
  \ AWS IoT Greengrass 设备。目标平台用于决定你希望模型运行的操作系统、架构和加速器。你还可以将编译后的模块存储在你的 S3 存储桶中以供将来使用。这本质上帮助你在跨平台模型部署。\n\
  - **Model packages**：这些用于创建可部署的 SageMaker 模型。你可以创建自己的算法，使用模型包 API 对其进行打包，并将其发布到\
  \ AWS Marketplace。\n- **Models**：模型是使用模型工件创建的。它们类似于带有变量的数学方程；也就是说，你输入变量的值并得到输出。这些模型存储在\
  \ S3 中，并将由端点用于推理。\n- **Endpoint configurations**：Amazon SageMaker 允许你将多个加权模型部署到单个端点。这意味着你可以将特定数量的请求路由到一个端点。*这意味着什么？*\
  \ 嗯，假设你有一个正在使用的模型。你想用更新的模型替换它。然而，你不能简单地移除已经在使用的第一个模型。在这种情况下，你可以使用 `VariantWeight`\
  \ API 使端点以 80% 的请求使用旧模型，以 20% 的请求使用新模型。这是数据快速变化且模型需要定期训练和调优的最常见生产场景。另一个可能的使用场景是使用实时数据测试模型结果，然后可以将一定比例的请求路由到新模型，并监控结果以证明模型在实时未见数据上的准确性。\n\
  - **Endpoints**：这些用于创建模型公开的 URL，可以请求它以响应提供模型结果。\n- **Batch transform jobs**：如果用例要求你在数百万条记录上进行推理，那么而不是单独的推理作业，你可以在未见数据上运行批量转换作业。请注意，当你解析数千条未见数据作为一批后从模型接收数千个结果时可能会产生一些混淆。为了克服这种混淆，可以使用\
  \ `InputFilter`、`JoinSource`、`OutputFilter` API 将输入记录与输出结果关联。\n\n\n\n\n\n现在，我们已经对\
  \ Amazon SageMaker 有了总体的了解。让我们在下一节中将知识付诸实践。\n\n> **重要提示**\n> Amazon SageMaker 控制台一直在变化。当你阅读本书时，控制台的外观可能与本书中显示的不同。\n\
