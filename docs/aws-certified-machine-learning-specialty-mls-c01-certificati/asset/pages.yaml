    # Investment options


    ![](img/209e007237d34506e7ba16180f2e905c_141_0.png)


    Figure 4.2 – Plotting relationships with a bubble chart


    Looking at the preceding chart, we can see two types of relationships: the longer
    the investment period, the higher your annual rate, and the higher the amount
    invested, the higher your annual rate. As we can see, this is a very effective
    way to present this type of analysis. Next, we''ll learn how to compare our data.'
