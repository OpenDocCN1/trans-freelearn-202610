- pgno: 233
  md: 'A good approach to regression models is performing what is called **residual
    analysis**. This is where we plot the errors of the model in a scatter plot and
    check if they are randomly distributed (as expected) or not. If the errors are
    *not* randomly distributed, this means that your model was unable to generalize
    the data. The following graph shows a residual analysis of our example:


    ![](img/209e007237d34506e7ba16180f2e905c_233_0.png)


    The takeaway here is that the errors are randomly distributed. Such evidence,
    along with a high R squared rating, can be used as arguments to support the use
    of this model.


    **Important note**

    In *Chapter 8, Evaluating and Optimizing Models*, we will learn about evaluation
    metrics. For instance, we will learn that each type of model may have its own
    set of evaluation metrics. Regression models are commonly evaluated with **Mean
    Square Error (MSE)** and **Root Mean Square Error (RMSE)**. In other words, apart
    from R, R squared, and residual analysis, ideally, you will execute your model
    on test sets to extract other performance metrics. You can even use a cross-validation
    system to check model performance, as we learned in *Chapter 1, Machine Learning
    Fundamentals*.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Very often, when the model residuals do present a pattern and are not randomly
    distributed, it''s because the existing relationship in the data is not linear,
    but non-linear, so another modeling technique must be applied. Now, let''s take
    a look at how we can interpret a model''s results.


    # Interpreting regression models


    It is also good to know how to interpret a linear regression model. Sometimes,
    we use linear regression not necessarily to create a predictive model but to do
    a regression analysis, where we can understand the relationship between the independent
    and dependent variables.


    Looking back at our regression equation (Y = 1021,212 * X + 53,3), we can see
    our two terms: alpha or slope (1021.2) and beta or y-intercept (53.3). We can
    interpret this model as follows: for each additional year of working experience,
    you will increase your salary by $1,021.3 dollars. Also, note that when "years
    of experience" is equal to zero, the expected salary is going to be $53.3 dollars
    (this is the point where our straight line crosses the y-axis).


    From a generic perspective, your regression analysis should answer the following
    question: for each extra unit that''s added to the independent variable (slope),
    what is the average change in the dependent variable? Please take notes and make
    sure you know how to interpret simple linear regression models – this is a very
    important thing to do as one of your daily activities as a data scientist! Let''s
    move on and take a look at some final considerations about linear regression.


    # Checking R squared adjusted


    At this point, I hope you have a much better idea of regression models! There
    is just another very important topic that you should be aware of, regardless of
    whether it will come up in the exam or not, which is the parsimony aspect of your
    model.


    We have talked about parsimony already, in Chapter 1, Machine Learning Fundamentals.
    This is your ability to prioritize simple models over complex models. Looking
    into regression models, you might have to use more than one feature to predict
    your outcome. This is also known as a multiple regression model.


    When that''s the case, the R and R squared coefficients tend to reward more complex
    models that have more features. In other words, if you keep adding new features
    to a multiple regression model, you will come up with higher R and R squared coefficients.
    That''s why you can''t anchor your decisions only based on those two metrics.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Another additional metric that you could use (apart from R, R squared, MSE,
    and RMSE) is known as **R squared adjusted**. This metric is penalized when we
    add extra features to the model that do not bring any real gain. In the following
    table, we have illustrated a hypothetical example just to show you when you are
    starting to lose parsimony:


    | Number of Features | R Squared | R Squared Adjusted |

    |---|---|---|

    | 1 | 81 | 79 |

    | 2 | 83 | 82 |

    | 3 | 88 | 87 |

    | 4 | 90 | 86 |

    | 5 | 92 | 85 |


    Figure 7.10 – Comparing R squared and R squared adjusted


    Here, we can conclude that maintaining three variables in the model is better
    than maintaining four or five variables. Adding four or five variables to that
    model will increase R squared (as expected), but decrease R squared adjusted.


    Alright; at this point, you should have a very good understanding of regression
    models. Now, let''s check what AWS offers in terms of built-in algorithms for
    this class of models. That is going to be important for your exam, so let''s take
    a look.


    # Regression modeling on AWS


    AWS has a built-in algorithm known as **linear learner**, where we can implement
    linear regression models. The built-in linear learner uses **Stochastic Gradient
    Descent (SGD)** to train the model.


    > **Important note**

    > We will learn more about SGD when we talk about neural networks. For now, we
    can look at SGD as an alternative to the popular least square error method that
    we just dissected.


    The linear learn built-in algorithm provides a hyperparameter that can apply normalization
    to the data, prior to the training process. The name of this hyperparameter is
    `normalize_data`. This is very helpful since linear models are sensitive to the
    scale of the data and usually take advantage of data normalization.


    > **Important note**

    > We talked about data normalization in *Chapter 3, Data Preparation and Transformation*.
    Please review that chapter if you need to.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Some other important hyperparameters of the linear learner algorithm are **L1**
    and **wd**, which play the roles of **L1 regularization** and **L2 regularization**,
    respectively.


    L1 and L2 regularization help the linear learner (or any other regression algorithm
    implementation) avoid overfitting. Conventionally, we call regression models that
    implement L1 regularization **Lasso Regression** models, while for regression
    models with L2 regularization, we call them **Ridge Regression** models.


    Although it might sound complex, it is not! Actually, the regression model equation
    is still the same; that is, **y = ax + b + e**. The change is in the loss function,
    which is used to find the coefficients that best minimize the error. If you look
    back at Figure 7.3, you will see that we have defined the error function as **e
    = (ŷ - y)2**, where **ŷ** is the regression function value and **y** is the real
    value.


    L1 and L2 regularization add a penalty term to the loss function, as shown in
    the following formulas (note that we are replacing ŷ with ax + b):


    L₁ = ( a x + b − y )² + λ | a |


    L₂ = ( a x + b − y )² + λ a²


    The λ (lambda) parameter must be greater than 0 and manually tuned. A very high
    lambda value may result in an underfitting issue, while a very low lambda may
    not result in expressive changes in the final results (if your model is overfitted,
    it will stay overfitted).


    In practical terms, the main difference between L1 and L2 regularization is that
    L1 will shrink the less important coefficients to zero, which will force the feature
    to be dropped (acting as a feature selector). In other words, if your model is
    overfitting due to it having a high number of features, L1 regularization should
    help you solve this problem.


    > **Important note**

    > During your exam, remember the basis of L1 and L2 regularization, especially
    the key difference between them, where L1 works well as a feature selector.


    Last but not least, many built-in algorithms can serve multiple modeling purposes.
    The linear learner algorithm can be used for regression, binary classification,
    and multi-classification. Make sure you remember this during your exam (it is
    *not only* about regression models).'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Still going in that direction, AWS has other built-in algorithms that work
    for regression and classification problems; that is, **Factorization Machines,
    K-Nearest Neighbor (KNN)** and the **XGBoost** algorithm. Since these algorithms
    can also be used for classification purposes, we''ll cover them in the section
    about classification algorithms.


    > **Important note**

    > You just got a very important tip to remember during the exam: linear learner,
    Factorization Machines, K-Nearest Neighbor, and XGBoost are suitable for both
    regression and classification problems. These algorithms are often known as algorithms
    for general purposes.


    With that, we have reached the end of this section on regression models. I hope
    you have enjoyed it; remember to check out our support material before you take
    your exam. By the way, you can use that reference material when you''re working
    on your daily activities! Now, let''s move on to another classical example of
    a machine learning problem: classification models.


    # Working with classification models


    You have been learning what classification models are throughout this book. However,
    now, we are going to discuss some algorithms that are suitable for classification
    problems. Keep in mind that there are hundreds of classification algorithms out
    there, but since we are preparing for the AWS machine learning specialty exam,
    we will cover the ones that have been pre-built by AWS.


    We already know what the linear learner does (and we know that it is suitable
    for both regression and classification tasks), so let''s take a look at the other
    built-in algorithms for general purposes (which includes classification tasks).


    We will start with **Factorization Machines**. Factorization machines are considered
    an extension of the linear learner, optimized to find the relationship between
    features within high-dimensional sparse datasets.


    > **Important note**

    > A very traditional use case for Factorization machines is *recommendation systems*,
    where we usually have a high level of sparsity in the data. During the exam, if
    you are faced with a general-purpose problem (either a regression or binary classification
    task) where the underlying datasets are sparse, then Factorization Machines are
    probably the best answer from an algorithm perspective.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'When we use Factorization Machines in a regression model, the **Root Mean Square
    Error (RMSE)** will be used to evaluate the model. On the other hand, in binary
    classification mode, the algorithm will use Log Loss, Accuracy, and F1 score to
    evaluate results. We will have a deeper discussion about evaluation metrics in
    *Chapter 8, Evaluating and Optimizing Models.*


    You should be aware that Factorization Machines only accept input data in **recordIO-protobuf**
    format. This is because of the data sparsity issue, in which recordIO-protobuf
    is supposed to do a better job on data processing than text/.csv format.


    The next built-in algorithm suitable for classification problems is known as K-Nearest
    Neighbors, or KNN for short. As the name suggests, this algorithm will try to
    find the K closest points to the input data and return either of the following
    predictions:


    +   - The most repeated class of the k closest points, if it''s a classification
    task

    +   - The average value of the label of the k closest points, if it''s a regression
    task


    We say that KNN is an **index-based algorithm** because it computes distances
    between points, assigns indexes for these points, and then stores the sorted distances
    and their indexes. With that type of data structure, KNN can easily select the
    top K closest points to make the final prediction.


    Note that K is a hyperparameter of KNN and should be optimized during the modeling
    process.


    The other AWS built-in algorithm available for general purposes, including classification,
    is known as **eXtreme Gradient Boosting**, or **XGBoost** for short. This is an
    ensemble, decision tree-based model.


    XGBoost uses a set of **weaker** models (decision trees) to predict the target
    variable, which can be a regression task, binary class, or multi-class. This is
    a very popular algorithm and has been used in machine learning competitions by
    the top performers.


    XGBoost uses a boosting learning strategy when one model tries to correct the
    error of the prior model. It carries the name "gradient" because it uses the gradient
    descent algorithm to minimize the loss when adding new trees.


    > **Important note**

    > The term weaker is used in this context to describe very simple decision trees.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Although XGBoost is much more robust than a single decision tree, it is important
    to go into the exam with a clear understanding of what decision trees are and
    their main configurations. By the way, they are the base model of many ensemble
    algorithms, such as AdaBoost, Random Forest, Gradient Boost, and XGBoost.


    Decision trees are rule-based algorithms that organize decisions in the form of
    a tree, as shown in the following diagram:


    ![](img/209e007237d34506e7ba16180f2e905c_239_0.png)


    Figure 7.11 – Example of what a decision tree model looks like


    They are formed by a root node (at the very top of the tree), intermediary or
    decision nodes (in the middle of the tree), and leaf nodes (bottom nodes with
    no splits). The depth of the tree is given by the difference between the root
    node and the very last leaf node. For example, in the preceding diagram, the depth
    of the tree is 3.


    The depth of the tree is one of the most important hyperparameters of this type
    of model and it is often known as the max depth. In other words, max depth controls
    the maximum depth that a decision tree can reach.


    Another very important hyperparameter of decision tree models is known as the
    minimum number of samples/observations in the leaf nodes. It is also used to control
    the growth of the tree.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Decision trees have many other types of hyperparameters, but these two are
    especially important for controlling how the model overfits. Decision trees with
    a high depth or very small number of observations in the leaf nodes are likely
    to face issues during extrapolation/prediction.


    The reason for this is simple: decision trees use data from the leaf nodes to
    make predictions, based on the proportion (for classification tasks) or average
    value (for regression tasks) of each observation/target variable that belongs
    to that node. Thus, the node should have enough data to make good predictions
    outside the training set.


    In case you face the term **CART** during the exam, you should know that it stands
    for **Classification and Regression Trees**, since decision trees can be used
    for classification and regression tasks.


    To select the best variables to split the data in the tree, the model will choose
    the ones that maximize the separation of the target variables across the nodes.
    This task can be performed by different methods, such as **Gini** and **Information
    Gain**.


    # Forecasting models


    **Time series**, or **TS** for short, refers to data points that are collected
    on a regular basis with an ordered dependency. Time series have a measure, a fact,
    and a time unit, as shown in the following image:


    ![](img/209e007237d34506e7ba16180f2e905c_240_0.png)


    Figure 7.12 – Time series statement'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Additionally, time series can be classified as **univariate** or **multivariate**.
    Univariate time series have just one variable connected across a period of time,
    while a multivariate time series have two or more variables connected across a
    period of time. The following graph shows the univariate time series we showed
    in the preceding image:


    # Number of approved proposals per day


    ![](img/209e007237d34506e7ba16180f2e905c_241_0.png)


    Figure 7.13 – Time series example


    Time series can be decomposed as follows:


    +   - **Observed** or **level**: The average values of the series

    +   - **Trend**: Increasing, decreasing pattern (sometimes, there is no trend)

    +   - **Seasonality**: Regular peaks at specific periods of time (sometimes, there
    is no seasonality)

    +   - **Noise**: Something we cannot explain'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Sometimes, we can also find isolated peaks in the series that cannot be captured
    in a forecasting model. In such cases, we might want to consider those peaks as
    outliers. The following is a decomposition of the time series shown in the preceding
    graph:


    ![](img/209e007237d34506e7ba16180f2e905c_242_0.png)


    Figure 7.14 – Time series decomposition


    It’s also worth highlighting that we can use **additive** or **multiplicative**
    approaches to decompose time series. Additive models suggest that your time series
    *adds* each component to explain the target variable; that is, **y(t) = level
    + trend + seasonality + noise.**


    Multiplicative models, on the other hand, suggest that your time series *multiplies*
    each component to explain the target variable; that is, **y(t) = level * trend
    * seasonality * noise.**


    In the next section, we will have a closer look at time series components.


    # Checking the stationarity of time series


    Decomposing time series and understanding how their components interact with additive
    and multiplicative models is a great achievement! However, the more we learn,
    the more we question ourselves. Maybe you have realized that time series without
    trend and seasonality are easier to predict than the ones with all those components!


    That is naturally right. If you don’t have to understand trend and seasonality,
    and if you don’t have control over the noise, all you have to do is explore the
    observed values and find their regression relationship.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'We refer to time series with constant mean and variance across a period of
    time as **stationary**. In general, time series *with* trend and seasonality are
    *not* stationary. It is possible to apply data transformations to the series to
    transform it into a stationary time series so that the modeling task tends to
    be easier. This type of transformation is known as **differentiation.**


    While you are exploring a time series, you can check stationarity by applying
    hypothesis tests, such as **Dickey-Fuller**, **KPSS**, and **Philips-Perron**,
    just to mention a few. If you find it non-stationary, then you can apply differentiation
    to make it a stationary time series. Some algorithms already have that capability
    embedded.


    # Exploring, exploring, and exploring


    At this point, I am sure I don''t have to remind you that exploration tasks happen
    all the time in data science. Nothing is different here. While you are building
    time series models, you might want to have a look at the data and check if it
    is suitable for this type of modeling.


    **Autocorrelation plots** are one of the tools that you can use for time series
    analysis. Autocorrelation plots allow you to check the correlations between lags
    in the time series. The following graph shows an example of this type of visualization:


    ![](img/209e007237d34506e7ba16180f2e905c_243_0.png)


    Figure 7.15 – Autocorrelation plot


    Remember, if you''re playing with univariate time series, your time series just
    has one variable, so finding autocorrelation across the lags of your unique variable
    is crucial to understanding whether you can build a good model or not.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'And yes, it turns out that, sometimes, it might happen that you don’t have
    a time series in front of you. Furthermore, no matter your efforts, you will not
    be able to model this data as a time series. This type of data is often known
    as **white noise.**


    Another type of series that we cannot predict is known as **random walk.** Random
    walks are random by nature, but they have a dependency on the previous time step.
    For example, the next point of a random walk could be a random number between
    0 and 1, and also the last point of the series.


    > **Important note**

    > Be careful if you come across those terms in the exam and remember to relate
    them to randomness in time series.


    With that, we have covered the main theory about time series modeling. You should
    also be aware that the most popular algorithms out there for working with time
    series are known as **Auto-Regressive Integrated Moving Average (ARIMA)** and
    **Exponential Smoothing (ETS).** We will not look at the details of these two
    models. Instead, we will see what AWS can offer us in terms of time series modeling.


    # Understanding DeepAR


    The **DeepAR** forecasting algorithm is a built-in SageMaker algorithm that’s
    used to forecast a one-dimensional time series using a **Recurrent Neural Network
    (RNN).**


    Traditional time series algorithms, such as ARIMA and ETS, are designed to fit
    one model per time series. For example, if you want to forecast sales per region,
    you might have to create one model per region, since each region might have its
    own sales behaviors. DeepAR, on the other hand, allows you to operate more than
    one time series in a single model, which seems to be a huge advantage for more
    complex use cases.


    The input data for DeepAR, as expected, is one or more time series. Each of these
    time series can be associated with the following:


    +   - A vector of static (time-independent) categorical features, controlled by
    the `cat` field

    +   - a vector of dynamic (time-dependent) time series, controlled by `dynamic_feat`


    > **Important note**

    > Note that the ability to train and make predictions on top of multiple time
    series is strictly related to the vector of static categorical features. While
    defining the time series that DeepAR will train on, you can set categorical variables
    to specify which group each time series belongs to.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Two of the main hyperparameters of DeepAR are context_length, which is used
    to control how far in the past the model can see during the training process,
    and prediction_length, which is used to control how far in the future the model
    will output predictions.


    DeepAR can also handle missing values, which, in this case, refers to existing
    gaps in the time series. A very interesting functionality of DeepAR is its ability
    to create derived features from time series. These derived features, which are
    created from basic time frequencies, help the algorithm learn time-dependent patterns.
    The following table shows all the derived features created by DeepAR, according
    to each type of time series that it is trained on:


    | Frequency of the Time Series | Derived Features |

    |---|---|

    | Minute | Minute-of-hour, hour-of-day, day-of-week, day-of-month, day-of-year
    |

    | Hour | Hour-of-day, day-of-week, day-of-month, day-of-year |

    | Day | Day-of-week, day-of-month, day-of-year |

    | Week | Day-of-month, week-of-year |

    | Month | Month-of-year |


    Figure 7.16 – DeepAR derived features per frequency of time series


    We have now completed this section about forecasting models. Next, we will have
    a look at the last algorithm regarding supervised learning; that is, the Object2Vec
    algorithm.


    # Object2Vec


    Object2Vec is a built-in SageMaker algorithm that generalizes the well-known word2vec
    algorithm. Object2Vec is used to create embedding spaces for high multidimensional
    objects. These embedding spaces are, per the definition, compressed representatiosn
    of the original object and can be used for multiple purposes, such as feature
    engineering or object comparison:


    ![](img/209e007237d34506e7ba16180f2e905c_245_0.png)


    Figure 7.17 – A visual example of an embedding space'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'The preceding diagram illustrates what we mean by an embedding space. The first
    and the last layers of the neural network model just map the input data with itself
    (represented by the same vector size).


    As we move on to the internal layers of the model, the data is compressed more
    and more until it hits the layer in the middle of this architecture, known as
    the embedding layer. On that particular layer, we have a smaller vector, which
    aims to be an accurate and compressed representation of the high-dimensional original
    vector from the first layer.


    With this, we just completed our first section about machine learning algorithms
    in AWS. Coming up next, we will have a look at some unsupervised algorithms.


    # Unsupervised learning


    AWS provides several unsupervised learning algorithms for the following tasks:


    +   - Clustering:

    +     - K-means algorithm

    +   - Dimension reduction:

    +     - **Principal Component Analysis (PCA)**

    +   - Pattern recognition:

    +     - IP Insights

    +   - Anomaly detection:

    +     - **Random Cut Forest Algorithm (RCF)**


    Let''s start by talking about clustering and how the most popular clustering algorithm
    works: K-means.


    # Clustering


    Clustering algorithms are very popular in data science. Basically, they aim to
    identify groups in a given dataset. Technically, we call these findings or groups
    **clusters**. Clustering algorithms belong to the field of non-supervised learning,
    which means that they don''t need a label or response variable to be trained.


    This is just fantastic because labeled data used to be scarce. However, it comes
    with some limitations. The main one is that clustering algorithms provide clusters
    for you, but not the meaning of each cluster. Thus, someone, as a subject matter
    expert, has to analyze the properties of each cluster to define their meanings.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'There are many types of clustering approaches, such as hierarchical clustering
    and partitional clustering. Inside each approach, we will find several algorithms.
    However, **K-Means** is probably the most popular clustering algorithm and you
    are likely to come across it in your exam, so let''s take a closer look at it.


    When we are playing with K-means, somehow, we have to specify the number of clusters
    that we want to create. Then, we have to allocate the data points across each
    cluster so that each data point will belong to a single cluster. This is exactly
    what we expect as a result at the end of the clustering process!


    You, as a user, have to specify the number of clusters you want to create and
    pass this number to K-means. Then, the algorithm will randomly initiate the central
    point of each cluster, which is also known as **centroid** initialization.


    Once we have the centroids of each cluster, all we need to do is assign a cluster
    to each data point. To do that, we have to use a proximity or distance metric!
    Let''s adopt the term distance metric.


    The **distance metric** is responsible for calculating the distance between data
    points and centroids. The data point will belong to the closer cluster centroid,
    according to the distance metric!


    The most well-known and used distance metric is called **Euclidean distance**
    and the math behind it is really simple: imagine that the points of your dataset
    are composed of two dimensions, X and Y. So, we could consider points a and b
    as follows:


    +   - a (X=1, Y=1)

    +   - b (X=2, Y=5)


    The Euclidean distance between points a and b is given by the following formula,
    where X1 and Y1 refer to the values of point a and X2 and Y2 refer to the values
    of point b:


    Dist = √((x₁ − x₂)² + (y₁ − y₂)²)


    The same function can be generalized by the following equation: √[∑ᵢ₌₁ⁿ (xᵢ −
    yᵢ)²]


    Once we have completed this process and assigned a cluster with each data point,
    we have to recalculate the cluster centroids. This process can be done by different
    methods, such as **single link**, **average link**, and **complete link**.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Due to this centroid refreshment, we will have to keep checking the closest
    cluster for each data point and keep refreshing the centroids. We have to reexecute
    steps 1 and 2 **iteratively**, until the cluster centroids converge or the maximum
    number of allowed iterations is reached.


    Alright; let''s recap the components that compose the K-means method:


    +   - Centroid initialization, cluster assignment, centroid refreshment, and then
    redo the last two steps until it converges.

    +   - The algorithm itself:

    +   - A distance metric to assign data points to each cluster:

    +   - We have selected Euclidian distance here.

    +   - And a linkage method to recalculate the cluster centroids:

    +   - For the sake of our demonstration, we''ll select the average linkage.


    With these definitions, we are ready to walk through our real example, step by
    step. As with our regression models, some support material is also available for
    your reference.


