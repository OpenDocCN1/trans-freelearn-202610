- pgno: 269
  md: '# 8


    # Evaluating and Optimizing Models


    It is now time to learn how to evaluate and optimize machine learning models.
    During the process of modeling, or even after model completion, you might want
    to understand how your model is performing. Each type of model has its own set
    of metrics that can be used to evaluate performance, and that is what we are going
    to study in this chapter.


    Apart from model evaluation, as a data scientist, you might also need to improve
    your model''s performance by tuning the hyperparameters of your algorithm. We
    will take a look at some nuances of this modeling task.


    In this chapter, we will cover the following topics:


    +   - Introducing model evaluation

    +   - Evaluating classification models

    +   - Evaluating regression models

    +   - Model optimization


    Alright, let''s do it!'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Introducing model evaluation


    There are several different scenarios in which we might want to evaluate model
    performance, some of them are as follows.


    +   - You are creating a model and testing different approaches and/or algorithms.
    Therefore, you need to compare these models to select the best one.

    +   - You have just completed your model and you need to document your work, which
    includes specifying the model''s performance metrics that you have reached out
    to during the modeling phase.

    +   - Your model is running in a production environment and you need to track
    its performance. If you encounter model drift, then you might want to retrain
    the model.


    > **Important note**

    > The term **model drift** is used to refer to the problem of model deterioration.
    When you are building a machine learning model, you must use data to train the
    algorithm. This set of data is known as training data, and it reflects the business
    rules at a particular point in time. If these business rules change over time,
    your model will probably fail to adapt to that change. This is because it was
    trained on top of another dataset, which was reflecting another business scenario.
    To solve this problem, you must retrain the model so that it can consider the
    rules of the new business scenario. Reinforcement learning systems might not suffer
    from this issue since they can adapt to the new data by themselves.


    We perform model evaluations by designing a testing approach. We have learned
    about holdout validation and cross-validation before. However, both testing approaches
    share the same requirement: they need a metric in order to evaluate performance.


    This metric is specific to the problem domain, for example, there are specific
    metrics for regression models, classification models, clustering, natural language
    processing, and more. Therefore, during the design of your testing approach, you
    have to consider what type of model you are building in order to define the evaluation
    metrics.


    In the following sections, we will take a look at the most important metrics and
    concepts that you should know to evaluate your models.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Evaluating classification models


    Classification models are one of the most traditional classes of problems that
    you might face, either during the exam or during your journey as a data scientist.
    A very important artifact that you might want to generate during the classification
    model evaluation is known as a **confusion matrix.**


    A confusion matrix compares your model predictions against the real values of
    each class under evaluation. *Figure 8.1* shows what a confusion matrix looks
    like in a binary classification problem:


    ![](img/209e007237d34506e7ba16180f2e905c_271_0.png)


    Figure 8.1 – A confusion matrix


    We find the following components in a confusion matrix:


    +   - **TP**: This is the number of **True Positive** cases. Here, we have to
    count the number of cases that have been predicted as true and are, indeed, true.
    For example, in a fraud detection system, this would be the number of fraudulent
    transactions that were correctly predicted as fraud.

    +   - **TN**: This is the number of **True Negative** cases. Here, we have to
    count the number of cases that have been predicted as false and are, indeed, false.
    For example, in a fraud detection system, this would be the number of non-fraudulent
    transactions that were correctly predicted as not fraud.

    +   - **FN**: This is the number of **False Negative** cases. Here, we have to
    count the number of cases that have been predicted as false but are, instead,
    true. For example, in a fraud detection system, this would be the number of fraudulent
    transactions that were wrongly predicted as not fraud.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - **FP**: This is the number of **False Positive** cases. Here, we have
    to count the number of cases that have been predicted as true but are, instead,
    false. For example, in a fraud detection system, this would be the number of non-fraudulent
    transactions that were wrongly predicted as fraud.


    In a perfect scenario, your confusion matrix will have only true positive and
    true negative cases, which means that your model has an accuracy of 100%. In practical
    terms, if that type of scenario occurs, you should be skeptical instead of happy
    since it is expected that your model will contain errors. If your model does not
    contain errors, you are likely to be suffering from overfitting issues, so be
    careful.


    Once false negatives and false positives are expected, the most that you can do
    is to prioritize one of them. For example, you can reduce the number of false
    negatives by increasing the number of false positives and vice versa. This is
    known as the precision versus recall trade-off. Let''s take a look at these metrics
    next.


    # Extracting metrics from a confusion matrix


    The simplest metric that we can extract from a confusion matrix is known as **accuracy**.
    Accuracy is given by the number of true positives plus true negatives over the
    total number of cases. In Figure 8.2, we have filled out all the components of
    the confusion matrix for the sake of this demonstration:


    ![](img/209e007237d34506e7ba16180f2e905c_272_0.png)


    Figure 8.2 – A confusion matrix filled with some examples'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'According to Figure 8.2, the accuracy would be (100 + 90) / 210, which is equal
    to 0.90.

    There is a common issue that occurs when utilizing an accuracy metric, which is
    related to the balance of each class. Problems with highly imbalanced classes,
    such as 99% of positive cases and 1% of negative cases, will impact the accuracy
    score and make it useless.


    For example, if your training data has 99% of positive cases (the majority class),
    your model is likely to correctly classify most of the positive cases but go badly
    in the classification of negative cases (the minority class). The accuracy will
    be very high (due to the correctness of the classification of the positive cases),
    regardless of the bad results in the minority class classification.


    The point is that on highly imbalanced problems, we usually have more interest
    in correctly classifying the minority class, not the majority class. That''s the
    case on most fraud detection systems, for example, where the minority class corresponds
    to fraudulent cases. For imbalanced problems, you should look for other types
    of metrics, which we will cover next.


    Another important metric that we can extract from a confusion matrix is known
    as **recall**, which is the number of true positives over the number of true positives
    plus false negatives. In other words, recall is given by the number of true positive
    and overall positive cases. Recall is also known as **sensitivity**.


    According to Figure 8.2, recall is given by 100 / 112, which is equal to 0.89.
    **Precision**, on the other hand, is given by the number of true positives over
    the number of true positives plus false positives. In other words, precision is
    given by the number of true positive and overall predicted positive cases. Precision
    is also known as **positive predictive power**.


    According to Figure 8.2, precision is given by 100 / 108, which is equal to 0.93.
    In general, we can increase precision by the cost of decrease recall and vice
    versa. There is another model evaluation artifact in which we can play around
    with this precision versus recall trade-off. It is known as a **precision-recall
    curve**.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Precision-recall curves summarize the precision versus recall trade-off by
    using different probability thresholds. For example, the default threshold is
    0.5, where any prediction above 0.5 will be considered as true; otherwise, it
    is false. You can change the default threshold according to your need so that
    you can prioritize recall or precision. Figure 8.3 shows an example of a precision-recall
    curve:


    ![](img/209e007237d34506e7ba16180f2e905c_274_0.png)


    Figure 8.3 – A precision-recall curve


    As you can see in Figure 8.3, increasing the precision will reduce the amount
    of recall and vice versa. Figure 8.3 shows the precision/recall for each threshold
    for a gradient boosting model (as shown by the orange line) compared to a no-skill
    model (as shown by the blue dashed line). A perfect model will approximate the
    curve to the point (1,1), forming a squared corner in the top right-hand side
    of the chart.


    Another visual analysis we can do on top of confusion matrixes is known as a Receiver
    Operating Characteristic (ROC) curve. ROC curves summarize the trade-off between
    the true positive rate and the false positive rate according to different thresholds,
    as in the precision-recall curve.


    You already know about the true positive rate, or sensitivity, which is the same
    as what we have just learned in the precision-recall curve. The other dimension
    of an ROC curve is the false positive rate, which is the number of false positives
    over the number of false positives plus true negatives.


    In literature, you might find the false positive rate referred to as inverted
    specificity, represented by 1 – specificity. Specificity is given as the number
    of true negatives over the number of true negatives plus false positives. Furthermore,
    false-positive rates or inverted specificity are the same. Figure 8.4 shows what
    an ROC curve looks like:'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/209e007237d34506e7ba16180f2e905c_275_0.png)


    Figure 8.4 – An ROC curve


    A perfect model will approximate the curve to the point (0,1), forming a squared
    corner in the top left-hand side of the chart. The orange line represents the
    trade-off between the true positive rate and the false positive rate of a gradient
    boosting classifier. The dashed blue line represents a no-skill model, which cannot
    predict the classes properly.


    To summarize, you can use ROC curves for fairly balanced datasets and precision-recall
    curves for moderate to imbalanced datasets.


    # Summarizing precision and recall


    Sometimes, we might want to use a metric that summarizes precision and recall,
    instead of prioritizing one over the other. Two very popular metrics can be used
    to summarize precision and recall: F1 score and Area Under Curve (AUC).


    The F1 score, also known as F-measure, computes the harmonic mean of precision
    and recall. AUC summarizes the approximation of the area under the precision-recall
    curve.


    That brings us to the end of this section on classification metrics. Let''s now
    take a look at the evaluation metrics for regression models.


    # Evaluating regression models


    Regression models are quite different from classification models since the outcome
    of the model is a continuous number. Therefore, the metrics around regression
    models aim to monitor the difference between real and predicted values.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'The simplest way to check the difference between a predicted value (*yhat*)
    and its actual value (*y*) is by performing a simple subtraction operation, where
    the error will be equal to the absolute value of *yhat – y*. This metric is known
    as the **Mean Absolute Error (MAE)**.


    Since we usually have to evaluate the error of each prediction, *i*, we have to
    take the mean value of the errors. The following formula shows how this error
    can be formally defined:


    ```

    MAE = (1/N) Σ_{i=1}^{N} |y_i - ŷ_i|

    ```


    Sometimes, you might want to penalize bigger errors over smaller errors. To achieve
    this, you can use another metric, which is known as the **Mean Squared Error (MSE)**.
    MSE will square each error and return the mean value.


    By squaring errors, MSE will penalize the bigger ones. The following formula shows
    how MSE can be formally defined:


    ```

    MSE = (1/n) Σ_{i=1}^{n} (y_i - ŷ_i)^2

    test set

    predicted value actual value

    ```


    There is a potential interpretation problem with MSE. Since it has to compute
    the squared error, it might be difficult to interpret the final results from a
    business perspective. The **Root Mean Squared Error (RMSE)** works around this
    interpretation issue, by taking the square root of MSE. Here is the RMSE equation:


    ```

    RMSE = √[ Σ_{i=1}^{n} (ŷ_i - y_i)^2 / n ]

    ```


    RMSE is probably the most used metric for regression models since it can either
    penalize bigger errors, yet still be easily interpreted.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Exploring other regression metrics


    There are many more metrics that are suitable for regression problems aside from
    the ones that we have just learned. We will not be able to cover most of them
    here, but there are a few more metrics that might be important for you to know.


    One of these metrics is known as the Mean Absolute Percentage Error (MAPE). As
    the name suggests, MAPE will compute the absolute percentage error of each prediction
    and then take the average value. The following formula shows how this metric is
    computed:


    ![](img/209e007237d34506e7ba16180f2e905c_277_0.png)


    MAPE is broadly used on forecasting models since it is very simple to interpret,
    and it provides a very good sense of how far (or close) the predictions are from
    the actual values (in terms of a percentage).


    We have now completed this section on regression metrics. Next, we will talk about
    model optimizations.


    # Model optimization


    As you know, understanding evaluation metrics is very important in order to measure
    your model''s performance and document your work. In the same way, when we want
    to optimize our current models, evaluating metrics also plays a very important
    role in defining the baseline performance that we want to challenge.


    The process of model optimization consists of finding the best configuration (also
    known as hyperparameters) of the machine learning algorithm for a particular data
    distribution. We don''t want to find hyperparameters that overfit the training
    data in the same way that we don''t want to find hyperparameters that underfit
    the training data.


    You learned about overfitting and underfitting in Chapter 1, Machine Learning
    Fundamentals. In the same chapter, you also learned how to avoid these two types
    of modeling issues.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'In this section, we will learn about some techniques that you can use to find
    the best configuration for a particular algorithm and dataset. You can combine
    these techniques of model optimization with other methods, such as cross-validation,
    to find the best set of hyperparameters for your model and avoid fitting issues.


    > **Important note**

    > Always remember that you don''t want to optimize your algorithm to the underlying
    training data but to the data distribution behind the training data. This is so
    that your model will work in the training data as well as in the production data
    (that is, the data that has never been exposed to your model during the training
    process). A machine learning model that works only in the training data is useless.
    That''s why combining model-tuning techniques (such as the ones we will learn
    about next) with sampling techniques (such as cross-validation) makes all the
    difference when it comes to creating a good model.


    # Grid search


    **Grid search** is probably the most popular method for model optimization. It
    consists of testing different combinations of the algorithm and selecting the
    best one. Here, we have two important points that we need to pay attention to:


    +   - How to define the best one?

    +   - How many combinations should we test?


    The best model is defined based on an evaluation metric. In other words, you have
    to first define which metric you are going to use to evaluate the model''s performance.
    Secondly, you have to define how you are going to evaluate the model. Usually,
    we use cross-validation to evaluate the model on multiple datasets that have never
    been used for training.


    In terms of the number of combinations, this is the most challenging part when
    playing with grid search. Each hyperparameter of an algorithm may have multiple
    or, sometimes, infinite possibilities of values. If you consider that an algorithm
    will usually have multiple hyperparameters, this becomes a function with quadratic
    cost, where the number of unique combinations to test (also known as a model for
    testing) is given as *the number of values of hyperparameter a * the number of
    values of hyperparameter b * the number of values of hyperparameter i.* Figure
    8.5 shows how you could potentially set a grid search configuration for a decision
    tree model:'
  merge: -1
  img_proc: true
- pgno: 279
  md: '| Criterion | Max depth | Min samples leaf |

    |---|---|---|

    | Gini, Entropy | 2, 5, 10 | 10, 20, 30 |


    Figure 8.5 – Grid search configuration


    In Figure 8.5, there are three hyperparameters: **Criterion**, **Max depth**,
    and **Min samples leaf**. Each of these hyperparameters has a list of values for
    testing: 2, 3, and 3 values, respectively. That means, by the end of the grid
    search process, we will have tested 18 models (2 * 3 * 3), where only the best
    one will be selected.


    As you might have noticed, all the different combinations of those three hyperparameters
    will be tested, for example, consider the following:


    +   - Criterion = Gini, Max depth = 2, Min samples leaf = 10

    +   - Criterion = Gini, Max depth = 5, Min samples leaf = 10

    +   - Criterion = Gini, Max depth = 10, Min samples leaf = 10


    Other questions that you might be wondering could include the following:


    +   - Considering that a particular algorithm might have several hyperparameters,
    which ones should I tune?

    +   - Considering that a particular hyperparameter might accept infinite values,
    which values should I test?


    These are good questions and grid search will not give you a straight answer for
    them. Instead, this is closer to an empirical process, where you have to test
    as much as you need to achieve your target performance.


    **Important note**

    Of course, grid search cannot guarantee that you will come up with your target
    performance. That depends on the algorithm and the training data.


    A common practice, though, is to define the values for testing by using a **linear
    space** or **log space**, where you can manually set the limits of the hyperparameter
    you want to test and the number of values for testing. Then, the intermediate
    values will be drawn by a linear or log function.


    As you might imagine, grid search can take a long time to run. A number of alternative
    methods have been proposed to work around this time issue. **Random search** is
    one of them, where the list of values for testing is randomly selected from the
    search space.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Another method that has gained rapid adoption across the industry is known
    as **Bayesian optimization**. Algorithm optimizations, such as **gradient descent**,
    try to find what is called the **global minima**, by calculating derivatives of
    the cost function. Global minima are the points where you find the algorithm configuration
    with the least associated cost.


    Bayesian optimization is useful when calculating derivatives is not an option.
    So, we can use the **Bayes theorem**, a probabilistic approach, to find the global
    minima using the smallest number of steps.


    In practical terms, Bayesian optimization will start testing the entire search
    space to find the most promising set of optimal hyperparameters. Then, it will
    perform more tests specifically in the place where the global minima are likely
    to be.


    # Summary


    In this chapter, you learned about the main metrics for model evaluation. We first
    started with the metrics for classification problems and then we moved on to the
    metrics for regression problems.


    In terms of classification metrics, you have been introduced to the well-known
    confusion matrix, which is probably the most important artifact to perform a model
    evaluation on classification models.


    Aside from knowing what true positive, true negative, false positive, and false
    negative are, we have learned how to combine these components to extract other
    metrics, such as accuracy, precision, recall, the F1 score, and AUC.


    We went even deeper and learned about ROC curves, as well as precision-recall
    curves. We learned that we can use ROC curves to evaluate fairly balanced datasets
    and precision-recall curves for moderate to imbalanced datasets.


    By the way, when you are dealing with imbalanced datasets, remember that using
    accuracy might not be a good idea.


    In terms of regression metrics, we learned that the most popular ones, and the
    most likely to be present in the *AWS Machine Learning Specialty* exam, are MAE,
    MSE, RMSE, and MAPE. Make sure you know the basics of each of them before taking
    the exam.


    Finally, you learned about methods for hyperparameter optimization, where grid
    search and Bayesian optimization are the primary ones. In the next chapter, we
    will take a look at SageMaker and learn how it can be used for modeling. But first,
    let''s take a moment to practice these questions on model evaluation and model
    optimization.'
  merge: -1
