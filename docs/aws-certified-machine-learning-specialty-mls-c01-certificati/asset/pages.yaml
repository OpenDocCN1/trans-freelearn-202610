- pgno: 70
  md: '# Translating documents with Amazon Translate


    Most of the time, people prefer to communicate in their own language, even on
    digital platforms. Amazon Translate is a text translation service. We can provide
    documents or strings of text in various languages and get it back in a different
    language. It uses pre-trained deep learning techniques, so we shouldn''t be worried
    about the models, nor how they are managed. We can make API requests and get the
    results back.


    Some common uses of Amazon Translate include the following:


    +   - If there''s an organization-wide requirement to prepare documents in different
    languages, then Translate is the solution for converting one language into many.

    +   - Online chat applications can be translated in real time to provide a better
    customer experience.

    +   - To localize website content faster and more affordably into more languages.

    +   - Sentiment analysis can be applied to different languages once they have
    been translated.

    +   - To provide non-English language support for a news publishing website.


    Next, we''ll explore the benefits of Amazon Translate.


    # Exploring the benefits of Amazon Translate


    Some of the benefits of using Amazon Translate include the following:


    +   - It uses neural machine translation, which mimics the way the human brain
    works.

    +   - No need to maintain your resources.

    +   - Produces high-quality results and maintains their consistency.

    +   - You can customize your brand names and model names, and any other unique
    terms get translated using the Custom Terminology Feature.

    +   - Can be easily integrated with applications through APIs.

    +   - Amazon Translate scales itself when you need it to do more.


    Next, we will get hands-on with Amazon Translate.'
  merge: -1
  img_proc: true
