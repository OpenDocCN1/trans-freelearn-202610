    fit this project?


    +   a) Unsupervised learning.

    +   b) Reinforcement learning.

    +   c) Supervised learning.

    +   d) ML is not required.


    **Answer**

    d, ML is everywhere, but not everything needs ML. In this case, there is no need
    to use ML since the company should be able to collect their costs from each stage
    of the production chain and sum it up.


    5. Which one of the following learning approaches gives us state-of-the-art algorithms
    to implement chatbots?


    +   a) Unsupervised learning

    +   b) Reinforcement learning

    +   c) Supervised learning

    +   d) DL


    **Answer**

    d, DL has provided state-of-the-art algorithms in the field of natural language
    processing.'
