- pgno: 306
  md: '# Choosing the right instance type for a training job


    There is no rule of thumb to decide the instance type that you require. It changes
    based on the size of the data, the complexity of the network, the machine learning
    algorithm, and several other factors such as time and cost. Asking the right question
    will save money and make it cost-effective.


    If the deciding factor is *Instance Size*, then classifying the problem for CPU
    or GPU is the right step. Once that is done, then it is good to consider whether
    it can be multi-GPU or multi-CPU. That would solve your question about distributed
    training. This also solves your *Instance Count* factor. If it''s compute-intensive,
    then it would be wise to check the memory requirements too.


    The next deciding factor is *Instance Family*. The right questions here would
    be, *Is it optimized for time and cost*? In the previous step, we have already
    figured out the problem to be solved in either the CPU or GPU, and this narrows
    down the selection process. Now, let''s learn about inference jobs.


    # Choosing the right instance type for an inference job


    The majority of the cost and complexity of machine learning in production is inference.
    Usually, inference runs on a single input in real time. They are usually less
    compute/memory-intensive. They have to be highly available as they run all the
    time and serve the end user requests or are integrated as part of an application.


    You can choose any of the instance types that we learned about recently based
    on the workload. Other than that, AWS has **Inf1** and **Elastic Inference** type
    instances for inference. Elastic inference allows you to attach a fraction of
    a GPU instance to any CPU instance.


    Let''s look at an example where an application is integrated with inference jobs,
    then the requirement of CPU and memory for the application is different from the
    inference jobs. For those use cases, you need to choose the right instance type
    and size. In such scenarios, it is good to have a separation between your application
    fleets and inference fleets. This might require some management. If such management
    is a problem for your requirement, then choose elastic inference, where both the
    application and inference jobs can be colocated. This means that you can host
    multiple models on the same fleet, and you can load all of these different models
    on different accelerators in memory and concurrent requests can be served.


    It''s always recommended that you run some examples in a lower environment before
    deciding on your instance types and family in the production environment. In the
    next section, we will dive into and understand the different ways of securing
    our Amazon SageMaker notebooks.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Securing SageMaker notebooks


    If you are reading this section of the chapter, then you have already learned
    how to use notebook instances, which type of training instances should be chosen,
    and how to configure and use endpoints. Now, let''s learn about securing those
    instances. The following aspects will help to secure the instances:


    +   - **Encryption:** When we say or think about securing via encryption, then
    it is all about the data. But what does this mean? It means protecting data at
    rest using encryption, protecting data in transit with encryption, and using KMS
    for better role separation and internet traffic privacy through TLS 1.2 encryption.
    SageMaker instances can be launched with encrypted volumes by using an AWS-managed
    KMS key. This helps you to secure the Jupyter Notebook server by default.

    +   - **Root access:** When a user opens a shell terminal from the Jupyter Web
    UI, they will be logged in as ec2-user, which is the default username in Amazon
    Linux. Now the user can run sudo to the root user. With root access, users can
    access and edit files. In many use cases, an administrator might not want data
    scientists to manage, control, or modify the system of the notebook server. This
    requires restrictions to be placed on the root access. This can be done by setting
    the RootAccess field to Disabled when you call CreateNotebookInstance or UpdateNotebookInstance.
    The data scientist will have access to their user space and can install Python
    packages. However, they cannot sudo into the root user and make changes to the
    operating system.

    +   - **IAM role:** During the launch of a notebook instance, it is necessary
    to create an IAM role for execution or to use an existing role for execution.
    This is used to launch the service-managed EC2 instance with an instance profile
    associated with the role. This role will restrict the API calls based on the policies
    attached to this role.

    +   - **VPC connection:** When you launch a SageMaker notebook instance, by default,
    it gets created within the SageMaker Service Account, which has a service-managed
    VPC, and it will, by default, have access to the internet via an internet gateway,
    and that gateway is managed by the service. If you are only dealing with AWS-related
    services, then it is recommended that you launch a SageMaker notebook instance
    in your VPC within a private subnet and with a well-customized security group.
    The AWS services can be invoked or used from this notebook instance via VPC endpoints
    attached to that VPC. The best practice is to control them via endpoint policies
    for better API controls. This ensures the restriction on data egress outside your
    VPC and secured environment. In order to capture all the network traffic, you
    can turn on the VPC flow logs, which can be monitored and tracked via CloudWatch.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   - **Internet access**: You can launch a Jupyter Notebook server without
    direct internet access. It can be launched in a private subnet with a NAT or to
    access the internet through a virtual private gateway. For training and deploying
    inference containers, you can set the `EnableNetworkIsolation` parameter to `True`
    when you are calling `CreateTrainingJob`, `CreateHyperParameterTuningJob`, or
    `CreateModel`. Network isolation can be used along with the VPC, which ensures
    that containers cannot make any outbound network calls.


    +   - **Connecting a private network to your VPC**: You can launch your SageMaker
    notebook instance inside the private subnet of your VPC. This can access data
    from your private network by communicating to the private network, which can be
    done by connecting your private network to your VPC by using Amazon VPN or AWS
    Direct Connect.


    In this section, we learned about several ways in which we can secure our SageMaker
    notebooks. In the next section, we will learn about creating SageMaker pipelines
    with Lambda Functions.


    # Creating alternative pipelines with Lambda Functions


    Indeed, SageMaker is an awesome platform that you can use to create training and
    inference pipelines. However, we can always work with different services to come
    up with similar solutions. One of these services that we will learn about next
    is known as **Lambda Functions.**


    AWS Lambda is a serverless compute service where you can literally run a function
    as a service. In other words, you can concentrate your efforts on just writing
    your function. Then, you just need to tell AWS how to run it (that is, the environment
    and resource configurations), so all the necessary resources will be provisioned
    to run your code and then discontinued once it is completed.


    Throughout *Chapter 6, AWS Services for Data Processing*, you explored how Lambda
    Functions integrate with many different services, such as Kinesis and AWS Batch.
    Indeed, AWS did a very good job of integrating Lambda with 140 services (and the
    list is constantly increasing). That means that when you are working with a specific
    AWS service, you will remember that it is likely to integrate with Lambda.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'It is important to bear this in mind because Lambda Functions can really expand
    your possibilities to create scalable and integrated architectures. For example,
    you can trigger a Lambda Function when a file is uploaded to S3 in order to preprocess
    your data before loading it to Redshift. Alternatively, you can create an API
    that triggers a Lambda Function at each endpoint execution. Again, the possibilities
    are endless with this powerful service.


    It is also useful to know that you can write your function in different programming
    languages, such as Node.js, Python, Go, Java, and more. Your function does not
    necessarily have to be triggered by another AWS service, that is, you can trigger
    it manually for your web or mobile application, for example.


    When it comes to deployment, you can upload your function as a ZIP file or as
    a container image. Although this is not ideal for an automated deployment process,
    coding directly into the AWS Lambda console is also possible.


    As with any other service, this one also has some downsides that you should be
    aware of:


    +   - Memory allocation for your function: This is from 128 MB to 10,240 MB (AWS
    has recently increased this limit from 3 GB to 10 GB, as stated previously).

    +   - Function timeout: This is a maximum of 900 seconds (15 minutes).

    +   - Function layer: This is a maximum of 5 layers.

    +   - Burst concurrency: This is from 500 to 3,000, depending on the region.

    +   - Deployment package size: This is 250 MB unzipped, including layers.

    +   - Container image code package size: This is 10 GB.

    +   - Available space in the /tmp directory: This is 512 MB.


    Before going for Lambda Functions, make sure these restrictions fit your use case.
    Bringing Lambda Functions closer to your scope of alternative pipelines for SageMaker,
    one potential use of Lambda is to create inference pipelines for our models.


    As you know, SageMaker has a very handy `.deploy()` method that will create endpoints
    for model inference. This is so that you can call to pass the input data in order
    to receive predictions back. Here, we can create this inference endpoint by using
    the API gateway and Lambda Functions.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'In case you don’t need an inference endpoint and you just want to make predictions
    and store results somewhere (in a batch fashion), then all we need is a Lambda
    Function, which is able to fetch the input data, instantiate the model object,
    make predictions, and store the results in the appropriated location. Of course,
    it does this by considering all the limitations that we have discussed earlier.


    Alright, now that we have a good background about Lambda and some use cases, let’s
    take a look at the most important configurations that we should be aware of for
    the exam.


    # Creating and configuring a Lambda Function


    First of all, you should know that you can create a Lambda Function in different
    ways, such as via the AWS CLI (Lambda API reference), the AWS Lambda console,
    or even deployment frameworks (for example, the serverless framework).


    Serverless frameworks are usually provider and programming language-independent.
    In other words, they usually allow you to choose where you want to deploy a serverless
    infrastructure from a variate list of cloud providers and programming languages.


    > **Important note**

    > The concept of serverless architecture is not specific to AWS. In fact, many
    cloud providers offer other services that are similar to AWS Lambda Functions.
    That’s why these serverless frameworks have been built: to help developers and
    engineers to deploy their services, wherever they want, including AWS. This is
    unlikely to come up in your exam, but it is definitely something that you should
    know so that you are aware of different ways in which to solve your challenges
    as a data scientist or data engineer.


    Since we want to pass the AWS Machine Learning Specialty exam, here, we have taken
    the approach to walk through the AWS Lambda console. This is so that you will
    become more familiar with their interface and the most important configuration
    options.


    When you navigate to the Lambda console and request a new Lambda Function, AWS
    will provide you with some starting options:


    +   - Author from scratch: This is if you want to create your function from scratch.

    +   - Use a blueprint: This is if you want to create your function from a sample
    code and configuration preset for common use cases.

    +   - Container image: This is if you want to select a container image to deploy
    your function.

    +   - Browse serverless app repository: This is if you want to deploy a sample
    Lambda application from the AWS Serverless Application Repository.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Starting from scratch, the next step is to set up your Lambda configurations.
    AWS splits these configurations between basic and advanced settings. In the basic
    configuration, you will set your function name, runtime environment, and permissions.
    Figure 9.14 shows these configurations:


    ![](img/209e007237d34506e7ba16180f2e905c_311_0.png)


    Figure 9.14 – Creating a new Lambda Function from the AWS Lambda console'
