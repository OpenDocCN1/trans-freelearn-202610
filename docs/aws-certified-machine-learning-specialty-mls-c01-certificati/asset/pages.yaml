    ![](img/209e007237d34506e7ba16180f2e905c_125_2.png)


    Figure 3.25 – Plotting words


    In case you are wondering how we came up with the dimensions shown in Figure 3.24,
    let''s dive into it. Again, there are different methods to do this, but let''s
    look at one of the most popular, which uses a co-occurrence matrix with a fixed
    context window.


    First, we have to come up with some logic to represent each word, keeping in mind
    that we also have to take their context into consideration. To solve the context
    requirement, we will define a fixed context window, which is going to be responsible
    for specifying how many words will be grouped together for context learning. For
    instance, let''s set this fixed context window to 2.'
  merge: -1
