    # Implementing natural language processing with Amazon Comprehend


    This service helps you extract insights from unstructured text. Unstructured text
    information is growing exponentially. A few data source examples are as follows:


    +   - *Customer engagement:* Call center, issue triage, customer surveys, and
    product reviews

    +   - *Business processes:* Customer/vendor emails, product support messages,
    and operation support feedback

    +   - *Records and research:* Whitepapers and medical records

    +   - *News and social media:* Social media analytics, brand trends, and correlated
    events


    Now, the question is, what can we do with this data? How can we analyze it and
    extract any value out of it? The answer is Amazon Comprehend, which is used to
    get insights from your unstructured data.


    Some common uses of Amazon Comprehend include the following:


    +   - Information management system

    +   - More accurate search system on organized topics

    +   - Sentiment analysis of users

    +   - Support ticket classification

    +   - Language detection from a document and then translating it into English
    using Amazon Translate'
