  md: 'You didn’t think I wouldn’t explain this to you, did you? In the next section,
    we will clarify those points together.


    # Defining the number of clusters and measuring cluster quality


    Although K-means is a great algorithm for finding patterns in your data, it will
    not provide the meaning of each cluster, nor the number of clusters you have to
    create to maximize cluster quality.


    In clustering, cluster quality means that we want to create groups with a high
    homogeneity among the elements of the same cluster, and a high heterogeneity among
    the elements of different clusters. In other words, the elements of the same clusters
    should be close/similar, whereas the elements of different clusters should be
    well separated.


    One way to compute the cluster’s homogeneity is by using a metric known as Sum
    of Square Errors, or SSE for short. This metric will compute the sum of squared
    differences between each data point and its cluster centroid. For example, when
    all the data points are located at the same point where the cluster centroid is,
    then SSE will be 0. In other words, we want to minimize SSE. The following equation
    formally defines SSE:


    SSE = Σᵢ₌₁ⁿ (xᵢ - x̄)²


    Now that we know how to check cluster quality, it is easier to understand how
    to define the number of appropriated clusters for a given dataset. All we have
    to do is find several clusters that minimize SSE. A very popular method that works
    around that logic is known as the Elbow method.


    The Elbow method proposes executing the clustering algorithm many times. In each
    execution, we will test a different number of clusters, k. After each execution,
    we compute the SSE related to that k number of cluster clusters. Finally, we can
    plot these results and select the number of k where the SSE stops to drastically
    decrease.


    > Important note

    > Adding more clusters will naturally decrease the SSE. In the Elbow method, we
    want to find the point where that change becomes smoother.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'In the previous example, we decided to create three clusters. The following
    graph shows the Elbow analysis that supports this decision:


    ![](img/209e007237d34506e7ba16180f2e905c_254_0.png)


    Figure 7.25 – The Elbow method


    We can conclude that adding more than three or four clusters will add unnecessary
    complexity to the clustering process.


    Of course, you should always consider the business background while defining the
    number of clusters. For example, if you are creating a customer segmentation model
    and your company has prepared the commercial team and business processes to support
    four segments of customers, considering the preceding graph, there is no harm
    in setting four clusters instead of three.


    Finally, you should know that AWS has implemented K-means as part of their list
    of built-in algorithms. In other words, you don''t have to use external libraries
    or bring your own algorithm to play with K-means on AWS.


    # Conclusion


    That was a really good accomplishment: you just mastered the basics of clustering
    algorithms and you should now be able to drive your own projects and research
    about this topic! For the exam, remember that clustering belongs to the unsupervised
    field of machine learning, so there is no need to have labeled data.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Also, make sure that you know how the most popular algorithm of this field
    works; that is, K-means. Although clustering algorithms do not provide the meaning
    of each group, they are very powerful for finding patterns in the data, either
    to model a particular problem or just to explore the data.


    Coming up next, we''ll keep studying unsupervised algorithms and see how AWS has
    built one of the most powerful algorithms out there for anomaly detection, known
    as **Random Cut Forest (RCF)**.


    # Anomaly detection


    Finding anomalies in data is very common in modeling and data exploratory analysis.
    Sometimes, you might want to find anomalies in the data just to remove them before
    fitting a regression model, while other times, you might want to create a model
    that identifies anomalies as an end goal, for example, in fraud detection systems.


    Again, we can use many different methods to find anomalies in the data. With some
    creativity, the possibilities are endless. However, there is a particular algorithm
    that works around this problem that you should definitely be aware of for your
    exam: **Random Cut Forest (RCF)**.


    RCF is an unsupervised decision tree-based algorithm that creates multiple decision
    trees (forests) using random subsamples of the training data. Technically, it
    randomizes the data and then creates samples according to the number of trees.
    Finally, these samples are distributed across each tree.


    These sets of trees are used to assign an anomaly score tp the data points. This
    anomaly score is defined as the expected change in the complexity of the tree
    as a result of adding that point to the tree.


    The most important hyperparameters of RCF are num_trees and num_samples_per_tree,
    which are the number of trees in the forest and the number of samples per tree,
    respectively.


    # Dimensionality reduction


    Another unsupervised algorithm that''s implemented by AWS in their list of built-in
    algorithms is known as **Principal Component Analysis**, or **PCA** for short.
    PCA is a technique that''s used to reduce the number of variables/dimensions in
    a given dataset.


    The main idea behind PCA is plotting the data points to another set of coordinates,
    known as **principal components (PC)**, which aims to explain the most variance
    in the data. By definition, the first component will capture more variance than
    the second component, then the second component will capture more variance than
    the third one, and so on.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'You can set up as many principal components as you need as long as it does
    not surpass the number of variables in your dataset. The following graph shows
    how these principal components are drawn:


    ![](img/209e007237d34506e7ba16180f2e905c_256_0.png)


    Figure 7.26 – Finding principal components in PCA


    As we mentioned previously, the first principal component will be drawn in such
    a way that it will capture most of the variance in the data. That''s why it passes
    close to the majority of the data points in the preceding graph.


    Then, the second principal component will be perpendicular to the first one, so
    that it will be the second component that explains the variance in the data. If
    you want to create more components (consequentially, capturing more variance),
    you just have to follow the same rule of adding perpendicular components. Eigenvectors
    and eigenvalues are the linear algebra concepts associated with PCA that compute
    the principal components.


    So, what''s the story with dimension reduction here? In case it is not clear yet,
    these principal components can be used to replace your original variables. For
    example, let''s say you have 10 variables in your dataset and you want to reduce
    this dataset to three variables that best represent the others. A potential solution
    for that would be applying PCA and extracting the first three principal components!


    Do these three components explain 100% of your dataset? Probably not, but ideally,
    they will explain most of the variance. Adding more principal components will
    explain more variance, but at the cost of you adding extra dimensions.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Using AWS''s built-in algorithm for PCA


    In AWS, PCA works in two different modes:


    +   - **Regular:** For datasets with a moderate number of observations and features

    +   - **Randomized:** For datasets with a large number of observations and features


    The difference is that, in randomized mode, it is used an approximation algorithm.


    Of course, the main hyperparameter of PCA is the number of components that you
    want to extract, known as `num_components`.


    # IP Insights


    IP Insights is an unsupervised algorithm that''s used for pattern recognition.
    Essentially, it learns the usage pattern of IPv4 addresses.


    The modus operandi of this algorithm is very intuitive: it is trained on top of
    pairs of events in the format of entity and IPv4 address so that it can understand
    the pattern of each entity that it was trained on.


    > **Important note**

    > For instance, we can understand "entity" as user IDs or account numbers.


    Then, to make predictions, it receives a pair of events with the same data structure
    (entity, IPv4 address) and returns an anomaly score for that particular IP address
    regarding the input entity.


    > **Important note**

    > This anomaly score that''s returned by IP Insight infers how anomalous the pattern
    of the event is.


    We might come across many applications with IP Insights. For example, you can
    create an IP Insights model that was trained on top of your application login
    events (this is your entity). You should be able to expose this model through
    an API endpoint to make predictions in real time.


    Then, during the authentication process of your application, you could call your
    endpoint and pass the IP address that is trying to log in. If you got a high score
    (meaning this pattern of logging in looks anomalous), you can request extra information
    before authorizing access (even if the password was right).'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'This is just one of the many applications of IP Insights you could think about.
    Next, we will discuss textual analysis.


    # Textual analysis


    Modern applications use **Natural Language Processing (NLP)** for several purposes,
    such as **text translation, document classifications, web search, named entity
    recognition** (**NER**), and many others.


    AWS offers a suite of algorithms for most NLP use cases. In the next few subsections,
    we will have a look at these built-in algorithms for textual analysis.


    # Blazing Text algorithm


    Blazing Text does two different types of tasks: text classification, which is
    a supervised learning approach that extends the **fastText** text classifier,
    and **word2vec**, which is an unsupervised learning algorithm.


    The Blazing Text''s implementations of these two algorithms are optimized to run
    on large datasets. For example, you can train a model on top of billions of words
    in a few minutes.


    This scalability aspect of Blazing Text is possible due to the following:


    +   - Its ability to use multi-core CPUs and a single GPU to accelerate text classification

    +   - Its ability to use multi-core CPUs or GPUs, with custom CUDA kernels for
    GPU acceleration, when playing with the word2vec algorithm


    The word2vec option supports a **batch_skipgram** mode, which allows Blazing Text
    to do distributed training across multiple CPUs.


    > **Important note**

    > The distributed training that''s performed by Blazing Text uses a mini-batching
    approach to convert **level-1 BLAS** operations into **level-3 BLAS** operations.
    If you see these terms during your exam, you should know that they are related
    to Blazing Text in terms of word2vec.


    Still in word2vec mode, Blazing Text supports both the **skip-gram** and **continuous
    bag of words (CBOW)** architectures.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Last but not least, note the following configurations of Blazing Text, since
    they are likely to be present in your exam:


    +   - In word2vec mode, only the train channel is available.

    +   - Blazing Text expects a single text file with space-separated tokens. Each
    line of the file must contain a single sentence. This means you usually have to
    pre-process your corpus of data before using Blazing Text.


    # Sequence-to-sequence algorithm


    This is a supervised algorithm that transforms an input sequence into an output
    sequence. This sequence can be a text sentence or even an audio recording.


    The most common use cases for sequence-to-sequence are machine translation, text
    summarization, and speech-to-text. Anything that you think is a sequence-to-sequence
    problem can be approached by this algorithm.


    Technically, AWS SageMaker''s Seq2Seq uses two types of neural networks to create
    models: a Recurrent Neural Network (RNN) and a Convolutional Neural Network (CNN)
    with an attention mechanism.


    **Latent Dirichlet Allocation**, or **LDA** for short, is used for topic modeling.
    Topic modeling is a textual analysis technique where you can extract a set of
    topics from a corpus of text data. LDA learns these topics based on the probability
    distribution of the words in the corpus of text.


    Since this is an unsupervised algorithm, there is no need to set a target variable.
    Also, the number of topics must be specified up-front and you will have to analyze
    each topic to find their domain meaning.


    # Neural Topic Model (NTM) algorithm


    Just like the LDA algorithm, the Neural Topic Model (NTM) also aims to extract
    topics from a corpus of data. However, the difference between LDA and NTM is their
    learning logic. While LDA learns from probability distributions of the words in
    the documents, NTM is built on top of neural networks.


    The NTM network architecture has a bottleneck layer, which creates an embedding
    representation of the documents. This bottleneck layer contains all the necessary
    information to predict document composition, and its coefficients can be considered
    topics.


    With that, we have completed this section on textual analysis. In the next section,
    we will learn about image processing algorithms.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Image processing


    Image processing is a very popular topic in machine learning. The idea is pretty
    self-explanatory: creating models that can analyze images and make inferences
    on top of them. By inference, you can understand this as detecting objects in
    an image, classifying images, and so on.


    AWS offers a set of built-in algorithms we can use to train image processing models.
    In the next few sections, we will have a look at those algorithms.


    # Image classification algorithm


    As the name suggests, the image classification algorithm is used to classify images
    using supervised learning. In other words, it needs a label within each image.
    It supports multi-label classification.


    The way it operates is simple: during training, it receives an image and its associated
    labels. During inference, it receives an image and returns all the predicted labels.
    The image classification algorithm uses a CNN (**ResNet**) for training. It can
    either train the model from scratch or take advantage of transfer learning to
    pre-load the first few layers of the neural network.


    According to AWS''s documentation, the .jpg and .png file formats are supported,
    but the recommended format is **MXNet RecordIO**.


    # Semantic segmentation algorithm


    The semantic segmentation algorithm provides a pixel-level capability for creating
    computer vision applications. It tags each pixel of the image with a class, which
    is an important feature for complex applications such as self-driving and medical
    image diagnostics.


    In terms of its implementation, the semantic segmentation algorithm uses the **MXNet
    Gluonn framework** and the **Gluon CV toolkit**. You can choose any of the following
    algorithms to train a model:


    +   - **Fully convolutional network** (FCN)

    +   - **Pyramid scene parsing** (PSP)

    +   - DeepLabV3


    All these options work as an **encoder-decoder** neural network architecture.
    The output of the network is known as a **segmentation mask**.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Object detection algorithm


    Just like the image classification algorithm, the main goal of the object detection
    algorithm is also self-explanatory: it detects and classifies objects in images.
    It uses a supervised approach to train a deep neural network.


    During the inference process, this algorithm returns the identified objects and
    a score of confidence regarding the prediction. The object detection algorithm
    uses a Single Shot MultiBox Detector (SSD) and supports two types of network architecture:
    VGG and ResNet.


    # Summary


    That was such a journey! Let''s take a moment to highlight what we have just learned.
    We broke this chapter into four main sections: supervised learning, unsupervised
    learning, textual analysis, and image processing. Everything that we have learned
    fits those subfields of machine learning.


    The list of supervised learning algorithms that we have studied includes the following:


    +   - Linear learner algorithm

    +   - Factorization machines algorithm

    +   - XGBoost algorithm

    +   - K-Nearest Neighbors algorithm

    +   - Object2Vec algorithm

    +   - DeepAR forecasting algorithm


    Remember that you can use linear learner, factorization machines, XGBoost, and
    KNN for multiple purposes, including to solve regression and classification problems.
    Linear learner is probably the simplest algorithm out of these four; factorization
    machines extend linear learner and are good for sparse datasets, XGBoost uses
    an ensemble method based on decision trees, and KNN is an index-based algorithm.


    The other two algorithms, Object2Vec and DeepAR, are used for specific purposes.
    Object2Vec is used to create vector representations of the data, while DeepAR
    is used to create forecast models.'
