- pgno: 316
  md: 'In terms of monitoring, by default, Lambda Functions produce a **CloudWatch**
    Logs stream and standard metrics. You can access log information by navigating
    through your Lambda Function monitoring section and clicking on *View logs in
    CloudWatch.*


    In CloudWatch, each Lambda Function will have a **Log group** and, inside that
    Log group, many **Log streams**. Log streams store the execution logs of the associated
    function. In other words, a log stream is a sequence of logs that share the same
    source, which, in this case, is your Lambda Function. A log group is a group of
    log streams that share the same retention, monitoring, and access control settings.


    We are reaching the end of this section, but not the end of this topic on Lambda
    Functions. As we mentioned earlier, this AWS service has a lot of use cases and
    integrates with many other services. In the next section, we will take a look
    at another AWS service that will help us to orchestrate executions of Lambda Functions.
    These are known as **AWS Step Functions**.


    # Working with Step Functions


    Step Functions is an AWS service that allows you to create workflows in order
    to orchestrate the execution of Lambda Functions. This is so that you can connect
    them in a sort of event sequence, known as **steps**. These steps are grouped
    in a **state machine**.


    Step Functions incorporates retry functionality so that you can configure your
    pipeline to proceed only after a particular step has succeeded. The way you set
    these retry configurations is by creating a **retry policy**.


    > **Important note**

    > Just like the majority of AWS services, AWS Step Functions also integrates with
    other services, not only AWS Lambda.


    Creating a state machine is relatively simple. All you have to do is navigate
    to the AWS Step Functions console, then create a new state machine. On the *Create
    state machine* page, you can specify whether you want to create your state machine
    from scratch, from a template, or whether you just want to run a sample project.


    AWS will help you with this state machine creation, so even if you choose to create
    it from scratch, you will find code snippets for a variate list of tasks, such
    as AWS Lambda invocation, SNS topic publication, running Athena queries, and more.'
  merge: -1
  img_proc: true
- pgno: 317
  md: "For the sake of demonstration, we will create a very simple, but still helpful,\
    \ example of how to use Step Functions to execute a Lambda Function with the retry\
    \ option activated:\n\n```\n{\n  \"Comment\": \"A very handy example of how to\
    \ call a lamnbda function with retry option\",\n  \"StartAt\": \"Invoke Lambda\
    \ function\",\n  \"States\": {\n    \"Invoke Lambda function\": {\n      \"Type\"\
    : \"Task\",\n      \"Resource\": \"arn:aws:states:::lambda:invoke\",\n      \"\
    Parameters\": {\n        \"FunctionName\": \"arn:aws:lambda:your-function-identification\"\
    ,\n        \"Payload\": {\n          \"Input\": {\n            \"env\": \"STAGE\"\
    \n          }\n        }\n      },\n      \"Retry\": [\n        {\n          \"\
    ErrorEquals\": [\"States.ALL\"],\n          \"IntervalSeconds\": 60,\n       \
    \   \"MaxAttempts\": 5,\n          \"BackoffRate\": 2.0\n        }\n      ],\n\
    \      \"Next\": \"Example\"\n    },\n    \"Example\": {\n      \"Type\": \"Pass\"\
    ,\n      \"Result\": \"Just to show you how to configure other steps\",\n    \
    \  \"End\": true\n    }\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 318
  md: 'In the preceding example, we created a state machine with two steps:


    +   - Invoke Lambda function: This will start the execution of your underlying
