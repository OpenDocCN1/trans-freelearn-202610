    can see in the same image. However, the science (not magic) happens on the right-hand
    side of the image! By squaring those numbers and plotting them in another hyper
    plan, we can perfectly separate each group of points:


    ![](img/209e007237d34506e7ba16180f2e905c_108_0.png)


    Figure 3.16 – Exponential transformation in action


    I know you might be thinking about the infinite ways you can deal with your data.
    Although this is true, you should always take the business scenario you are working
    on into account and plan your work accordingly. Remember that model improvements
    or exploration is always possible, but you have to define your goals (remember
    the CRISP-DM methodology) and move on.'
  merge: -1
