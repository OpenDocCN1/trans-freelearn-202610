- pgno: 131
  md: '4. You are working as a data scientist for a financial company. The company
    wants to create a model that aims to classify improper payments. You have decided
    to use "type of transaction" as one of your features (local, international, pre-approved,
    and so on). After applying one-hot encoding to this variable, you realize that
    your dataset has many more variables, and your model is taking a lot of time to
    train. How could you potentially solve this problem?


    +   a) By applying ordinal encoding instead of one-hot encoding. In this case,
