    | C | 5 | 5 |

    | D | 5 | 6 |

    | E | 1 | 5 |

    | F | 2 | 6 |

    | Cluster 1 | 1 | 1 |

    | Cluster 2 | 2 | 2 |

    | Cluster 3 | 5 | 5 |


    Figure 7.18 – Input data for K-means'
