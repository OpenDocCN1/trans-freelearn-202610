    \ language can then be detected by using Amazon Comprehend. Then, we used the\
    \ same input and translated it into English with the help of Amazon Translate.\
    \ The translated output was then printed on CloudWatch logs for verification.\
    \ In the next section, we will learn about Amazon Textract, which we can use to\
    \ extract text from a document.\n\n# Extracting text from documents with Amazon\
    \ Textract\n\nManually extracting information from documents is slow, expensive,\
    \ and prone to errors. Traditional optical character recognition software needs\
    \ a lot of customization, and it will still give erroneous output. To avoid such\
    \ manual processes and errors, you should use Amazon Textract. Generally, we convert\
    \ the documents into images in order to detect bounding boxes around the texts\
    \ in images. We then apply character recognition technique to read the text from\
    \ it. Textract does all this for you, and also extracts text, tables, forms, and\
    \ other data for you with minimal effort. If you get low-confidence results from\
    \ Amazon Textract, then Amazon A2I is the best solution.\n\nTextract reduces the\
    \ manual effort of extracting text from millions of scanned document pages. Once\
    \ the information has been captured, actions can be taken on the text, such as\
    \ storing it in different data stores, analyzing sentiments, or searching for\
    \ keywords. The following diagram shows how Amazon Textract works:"
