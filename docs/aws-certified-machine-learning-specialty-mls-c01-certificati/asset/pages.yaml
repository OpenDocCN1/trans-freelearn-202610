  md: "# Protecting data on Amazon S3\n\nIn this section, we will learn how to record\
    \ every version of an object. Along with durability, Amazon provides several techniques\
    \ to secure the data in S3. Some of those techniques involve enabling versioning\
    \ and encrypting the objects.\n\nVersioning helps you to roll back to a previous\
    \ version if there is any problem with the current object during update, delete,\
    \ or put operations.\n\nThrough encryption, you can control the access of an object.\
    \ You need the appropriate key to read and write an object. We will also learn\
    \ **Multi Factor Authentication (MFA)** for delete operations. Amazon also allows\
    \ **Cross-Region Replication (CRR)** to maintain a copy of an object in another\
    \ region, which can be used for data backup during any disaster, for further redundancy,\
    \ or for the enhancement of data access speed in different regions.\n\n# Applying\
    \ bucket versioning\n\nLet's now understand how we can enable bucket versioning\
    \ with the help of some hands-on examples. Bucket versioning can be applied while\
    \ creating a bucket from the AWS S3 console:\n\n+   1. To enable versioning on\
    \ a bucket from the command line, a bucket must be created first and then versioning\
    \ can be enabled, as shown in the following example. In this example, I have created\
    \ a bucket, `version-demo-mlpractice`, and enabled versioning through the `put-bucket-versioning`\
    \ command:\n+   2. We have not created this bucket with any kind of encryption.\
    \ So, if you run `aws s3api get-bucket-encryption --bucket version-demo-mlpractice`,\
    \ then it will output an error that says the following:\n\n```\n$ aws s3 mb s3://version-demo-mlpractice/\n\
    $ aws s3api put-bucket-versioning --bucket version-demo-mlpractice --versioning-configuration\
    \ Status=Enabled\n$ aws s3api get-bucket-versioning --bucket version-demo-mlpractice\n\
    {\n    \"Status\": \"Enabled\"\n}\n```\n\n```\nThe server side encryption configuration\
    \ was not found\n```"
