- pgno: 288
  md: '# Technical requirements


    You can download the data used in this chapter''s examples from GitHub at https://github.com/PacktPublishing/AWS-Certified-Machine-Learning-Specialty-MLS-C01-Certification-Guide/tree/master/Chapter-9.


    # Creating notebooks in Amazon SageMaker


    If you''re working with machine learning, then you need to perform actions such
    as storing data, processing data, preparing data for model training, model training,
    and deploying the model for inference. They are not easy, and each of these stages
    requires a machine to perform the task. With Amazon SageMaker, life becomes much
    easier when carrying out these steps.


    # What is Amazon SageMaker?


    SageMaker provides training instances to train a model using the data and provides
    endpoint instances to infer by using the model. It also provides notebook instances,
    running Jupyter Notebooks, to clean and understand the data. If you''re happy
    with your cleaning process, then you should store them in S3 as part of the staging
    for training. You can launch training instances to consume this training data
    and produce a machine learning model. The machine learning model can be stored
    in S3, and endpoint instances can consume the model to produce results for end
    users.


    If you draw this in a block diagram, then it will look similar to Figure 9.1:


    ![](img/209e007237d34506e7ba16180f2e905c_288_0.png)


    Figure 9.1 – A pictorial representation of the different layers of the Amazon
    SageMaker instances'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Now, let''s take a look at the Amazon SageMaker console and get a better feel
    for it. Once you log in to your AWS account and go to Amazon SageMaker, you will
    see something similar to Figure 9.2:


    ![](img/209e007237d34506e7ba16180f2e905c_289_0.png)


    Figure 9.2 – A quick look at the SageMaker console


    There are three different sections, including Notebook, Training, and Inference,
    which have been expanded in Figure 9.2 so that we can dive in and understand them
    better.


    Notebook has three different options that you can use:


    +   - **Notebook instances**: This helps us to create, open, start, and stop notebook
    instances. These instances are responsible for running Jupyter Notebooks. They
    allow us to choose the instance type based on the workload of the use case. The
    best practice is to use a notebook instance to orchestrate the data pipeline for
    processing a large dataset. For example, making a call from a notebook instance
