  img_proc: true
- pgno: 118
  md: 'Another well-known problem with ML models, specifically with binary classification
    problems, is unbalanced classes. In a binary classification model, we say that
    a dataset is unbalanced when most of its observations belong to the same class
    (target variable).


    This is very common in fraud identification systems, for example, where most of
    the events belong to a regular operation, while a very small number of events
    belong to a fraudulent operation. In this case, we can also say that fraud is
    a rare event.


    There is no strong rule for defining whether a dataset is unbalanced or not, in
    the sense of it being necessary to worry about it. Most challenge problems will
    present more than 99% of the observations in the majority class.


    The problem with unbalanced datasets is very simple: ML algorithms will try to
    find the best fit in the training data to maximize their accuracy. In a dataset
    where 99% of the cases belong to one single class, without any tuning, the algorithm
    is likely to prioritize the assertiveness of the majority class. In the worst-case
    scenario, it will classify all the observations as the majority class and ignore
    the minority one, which is usually our interest when modeling.


    To deal with unbalanced datasets, we have two major directions we can follow:
    tuning the algorithm to handle the issue or resampling the data to make it more
    balanced.


    By tuning the algorithm, you have to specify the weight of each class under classification.
    This class weight configuration belongs to the algorithm, not to the training
    data, so it is a hyperparameter setting. It is important to keep in mind that
    not all algorithms will have that type of configuration, and that not all ML frameworks
    will expose it, either. As a quick reference, we can mention the DecisionTreeClassifier
    class, from the scikit-learn ML library, as a good example that does implement
    the class weight hyperparameter.


    Another way to work around unbalanced problems is changing the training dataset
    by applying undersampling or oversampling. If you decide to apply undersampling,
    all you have to do is remove some observations from the majority class until you
    get a more balanced dataset. Of course, the downside of this approach is that
    you may lose important information about the majority class that you are removing
    observations from.


    The most common approach for undersampling is known as random undersampling, which
    is a naïve resampling approach where we randomly remove some observations from
    the training set.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'On the other hand, you can decide to go for oversampling, where you will create
    new observations/samples of the minority class. The simplest approach is the naïve
    one, where you randomly select observations from the training set (with replacement)
    for duplication. The downside of this method is the potential issue of overfitting,
    since you will be duplicating/highlighting the observed pattern of the minority
    class.


    To either underfit or overfit of your model, you should always test the fitted
    model on your testing set.


    > **Important note**

    > The testing set cannot be under/over sampled: only the training set should pass
    through these resampling techniques.


    You can also oversample the training set by applying synthetic sampling techniques.
    Random oversample does not add any new information to the training set: it just
    duplicates the existing ones. By creating synthetic samples, you are deriving
    those new observations from the existing ones (instead of simply copying them).
    This is a type of data augmentation technique known as the **Synthetic Minority
    Oversampling Technique (SMOTE)**.


    Technically, what SMOTE does is plot a line in the feature space of the minority
    class and extract points that are close to that line.


    > **Important note**

    > You may find questions in your exam where the term SMOTE has been used. If that
    happens, keep the context where this term is applied in mind: oversampling.


    Now, let''s move on to the next topic regarding data preparation, where we will
    learn how to prepare text data for machine learning models.


    # Dealing with text data


    We have already learned how to transform categorical features into numerical representations,
    either using label encoders, ordinal encoders, or one-hot encoding. However, what
    if we have fields containing long piece of text in our dataset? How are we supposed
    to provide a mathematical representation for them in order to properly feed ML
    algorithms? This is a common issue in **natural language processing (NLP)**, a
    subfield of AI.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'NLP models aim to extract knowledge from texts; for example, translating text
    between languages, identifying entities in a corpus of text (also known as **Name
    Entity Recognition (NER)**), classifying sentiments from a user review, and many
    other applications.


    **Important note**

    In *Chapter 2, AWS Application Services for AI/ML*, you learned about some AWS
    application services that apply NLP to their solutions, such as Amazon Translate
    and Amazon Comprehend. During the exam, you might be asked to think about the
    fastest or easiest way (with the least development effort) to build certain types
    of NLP applications. The fastest or easiest way is usually to use those out of
    the box AWS services, since they offer pre-trained models for some use cases (especially
    machine translation, sentiment analysis, topic modeling, document classification,
    and entity recognition).


    In a few chapters’ time, you will also learn about some built-in AWS algorithms
    for NLP applications, such as BlazingText, **Latent Dirichlet Allocation (LDA)**,
    **Neural Topic Modeling**, and the Sequence-to-Sequence algorithm. Those algorithms
    also let you create the same NLP solutions that are created by those out of box
    services; however, you have to use them on SageMaker and write your own solution.
    In other words, they offer more flexibility, but demand more development effort.


    Keep that in mind for your exam!


    Although AWS offers many out of the box services and built-in algorithms that
    allow us to create NLP applications, we will not look at those AWS product features
    now (as we did in *Chapter 2, AWS Application Services for AI/ML*, and will do
    so again in *Chapter 7, Applying Machine Learning Algorithms*). We will finish
    this chapter by looking at some data preparation techniques that are extremely
    important for preparing your data for NLP.


    # Bag of words


    The first one we will cover is known as **bag of words (BoW)**. This is a very
    common and simple technique, applied to text data, that creates matrix representations
    to describe the number of words within the text. BoW consists of two main steps:
    creating a vocabulary and creating a representation of the presence of those known
    words from the vocabulary in the text. These steps can be seen in the following
    diagram:'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'This movie is really good, although really old production


    +   Data cleansing

    +   Lower case

    +   Tokenization

    +   Remove punctuation

    +   Remove non-alphabetical tokens

    +   Remove stop words


    [this, movie, really, good, although, really, old, production]


    Vocabulary

    {

    (this, 1),

    (movie, 1),

    (really, 2),

    (good, 1),

    (although, 1),

    (old, 1),

    (production, 1),

    }


    | this | movie | really | good | although | old | production |

    | Binary | 1 | 1 | 1 | 1 | 1 | 1 | 1 |

    | Frequency | 0.14 | 0.14 | 0.28 | 0.14 | 0.14 | 0.14 | 0.14 |

    | Count | 1 | 1 | 2 | 1 | 1 | 1 | 1 |


    Figure 3.23 – BoW in action


    First things first, we usually can''t use raw texts to prepare a bag of words
    representation. There is a data cleansing step where we will lowercase the text;
    split each work into tokens; remove punctuation, non-alphabetical, and stop words;
    and, whenever necessary, apply any other custom cleansing technique you may want.


    Once you have cleansed your raw text, you can add each word to a global vocabulary.
    Technically, this is usually a dictionary of tuples, in the form of (word, number
    of occurrences); for example, {(apple, 10), (watermelon, 20)}. As I mentioned
    previously, this is a global dictionary, and you should consider all the texts
    you are analyzing.


    Now, with the cleansed text and updated vocabulary, we can build our text representation
    in the form of a matrix, where each column represents one word from the global
    vocabulary and each row represents a text you have analyzed. The way you represent
    those texts on each row may vary according to different strategies, such as binary,
    frequency, and count. Let''s dive into these strategies a little more.


    In the preceding diagram, we are processing a single text but trying the three
    different strategies for bag of words. That''s why you can see three rows on that
    table, instead of just one (in a real scenario, you have to choose one of them
    for implementation).


    In the first row, we have used a binary strategy, which will assign 1 if the word
    exists in the global vocabulary and 0 if not. Because our vocabulary was built
    on a single text, all the words from that text belong to the vocabulary (the reason
    you can only see 1s in the binary strategy).'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'In the second row, we have used a frequency strategy, which will check the
    number of occurrences of each word within the text and divide it by the total
    number of words within the text. For example, the word "this" appears just once
    (1) and there are seven other words in the text (7), so 1/7 is equal to 0.14.


    Finally, in the third row, we have used a count strategy, which is a simple count
    of occurrences of each word within the text.


    **Important note**

    This note is really important – you are likely to find it in your exam. You may
    have noticed that our BoW matrix contains **unique words** in the *columns* and
    **each text** representation is in the *rows*. If you have 100 long texts with
    only 50 unique words across them, your BoW matrix will have 50 columns and 100
    rows. During your exam, you are likely to receive a list of texts and be asked
    to prepare the BoW matrix.


    There is one more extremely important concept you should know about BoW, which
    is the **n-gram** configuration. The term n-gram is used to describe the way you
    would like to look at your vocabulary, either via single words (uni-gram), groups
    of two words (bi-gram), groups of three words (tri-gram), or even groups of n
    words (n-gram). So far, we have seen BoW representations using a uni-gram approach,
    but more sophisticated representations of BoW may use bi-grams, tri-grams, or
    n-grams.


    The main logic itself does not change, but you need to know how to represent n-grams
    in BoW. Still using our example from the preceding diagram, a bi-gram approach
    would combine those words in the following way: [this movie, movie really, really
    good, good although, although old, old production]. Make sure you understand this
    before taking the exam.


    **Important note**

    The power and simplicity of BoW comes from the fact that you can easily come up
    with a training set to test your algorithms, or even create a baseline model.
    If you look at *Figure 3.23*, can you see that having more data and just adding
    a classification column to that table, such as good or bad review, would allow
    us to train a binary classification model to predict sentiments?'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Alright – you might have noticed that many of the awesome techniques that I
    have introduced for you come with some downsides. The problem with BoW is the
    challenge of maintaining its vocabulary. We can easily see that, in a huge corpus
    of texts, the vocabulary size tends to become bigger and bigger and the matrices''
    representations tend to be sparse (I know – the sparsity issue again).


    One possible way to solve the vocabulary size issue is by using word hashing (also
    known in ML as the **hashing trick**). Hash functions map data of arbitrary sizes
    to data of a fixed size. This means you can use the hash trick to represent each
    text with a fixed number of features (regardless of the vocabulary''s size). Technically,
    this hashing space allows collisions (different texts represented by the same
    features), so this is something to take into account when you''re implementing
    feature hashing.


    # TF-IDF


    Another problem that comes with BoW, especially when we use the frequency strategy
    to build the feature space, is that more frequent words will strongly boost their
    scores due to the high number of occurrences within the document. It turns out
    that, often, those words with high occurrences are not the key words of the document,
    but just other words that *also* appear many times in several other documents.


    **Term Frequency – Inverse Term Frequency (TF-IDF)** helps penalize these types
    of words, by checking how frequent they are in other documents and using that
    information to rescale the frequency of the words within the document.


    At the end of the process, TF-IDF tends to give more importance to words that
    are unique to the document (document-specific words). Let''s look at a concrete
    example so that you can understand it in depth.


    Consider that we have a text corpus containing 100 words and the word "Amazon"
    appears three times. The **Term Frequency (TF)** of this word would be 3/100,
    which is equal to 0.03. Now, suppose we have other 1,000 documents and that the
    word "Amazon" appears in 50 of these. In this case, the **Inverse Term Frequency
    (IDF)** would be given by the log as 1,000/50, which is equal to 1.30. The TF-IDF
    score of the word "Amazon", in that specific document under analysis, will be
    the product of TF * IDF, which is 0.03 * 1.30 (0.039).


    Let''s suppose that instead of 50 documents, the word "Amazon" had also appeared
    on another 750 documents – in other words, much more frequently than in the prior
    scenario. In this case, we will not change the TF part of this equation – it is
    still 0.03. However, the IDF piece will change a little since this time, it will
    be log 1,000/750, which is equal to *0.0036*. As you can see, this time, the word
    "Amazon" has much less importance than in the previous example.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Word embedding


    Unlike traditional approaches, such as BoW and TD-IDF, modern methods of text
    representation will take care of the context of the information, as well as the
    presence or the frequency of words. One very popular and powerful approach that
    follows this concept is known as **word embedding**. Word embeddings create a
    dense vector of a fixed length that can store information about the context and
    meaning of the document.


    Each word is represented by a data point in a multidimensional hyper plan, which
    we call an embedding space. This embedding space will have "n" dimensions, where
    each of these dimensions refers to a particular position of this dense vector.


    Although it may sound confusing, the concept it is actually pretty simple. Let''s
    suppose we have a list of four words, and we want to plot them in an embedding
    space of five dimensions. The words are king, queen, live, and castle. The following
    table shows how to do this:


    |  | Dim 1 | Dim 2 | Dim 3 | Dim 4 | Dim 5 |

    |---|---|---|---|---|---|

    | **King** | 0.22 | 0.76 | 0.77 | 0.44 | 0.33 |

    | **Queen** | 0.98 | 0.09 | 0.67 | 0.89 | 0.56 |

    | **Live** | 0.13 | 0.99 | 0.88 | 0.01 | 0.55 |

    | **Castle** | 0.01 | 0.89 | 0.34 | 0.02 | 0.90 |


    Figure 3.24 – An embedding space representation


    Forget the hypothetical numbers in the preceding table and focus on the data structure;
    you will see that each word is now represented by "n" dimensions in the embedding
    space. This process of transforming words into vectors can be performed by many
    different methods, but the most popular ones are **word2vec** and **GloVe**.


    Once you have each word represented as a vector of a fixed length, you can apply
    many other techniques to do whatever you need. One very common task is plotting
    those "words" (actually, their dimensions) in a hyper plan and, visually, checking
    how close they are to each other!


    Technically, we don''t use this to plot them as-is, since human brains cannot
    interpret more than three dimensions. Then, we usually apply a dimensionality
    reduction technique (such as principal component analysis, which you will learn
    about later) to reduce the number of dimensions to two, and finally plot the words
    in a cartesian plan. That''s why you might have seen pictures like the one at
    the bottom of the following diagram. Have you ever asked yourself how is it possible
    to plot words on a graph?'
  merge: -1
  img_proc: true
