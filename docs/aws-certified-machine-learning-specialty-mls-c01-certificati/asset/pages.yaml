    # Model tuning


    In *Chapter 8, Evaluating and Optimizing Models*, you learned many important concepts
    about model tuning. Let''s now explore this topic from a practical perspective.


    In order to tune a model on SageMaker, we have to call `create_hyper_parameter_tuning_job`
    and pass the following main parameters:


    +   - `HyperParameterTuningJobName`: This is the name of the tuning job. It is
    useful to track the training jobs that have been started on behalf of your tuning
    job.

    +   - `HyperParameterTuningJobConfig`: Here, you can configure your tuning options.
    For example, which parameters you want to tune, the range of values for them,
    the type of optimization (such as random search or Bayesian search), the maximum
    number of training jobs you want to spin up, and more.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "+   - `TrainingJobDefinition`: Here, you can configure your training job. For\
    \ example, the data channels, the output location, the resource configurations,\
    \ the evaluation metrics, and the stop conditions.\n\nIn SageMaker, the main metric\
    \ that we want to use to evaluate the models to select the best one is known as\
    \ an **objective metric**.\n\nIn the following example, we are configuring `HyperParameterTuningJobConfig`\
    \ for a decision tree-based algorithm. We want to check the best configuration\
    \ for a **max_depth** hyperparameter, which is responsible for controlling the\
    \ depth of the tree.\n\nIn `IntegerParameterRanges`, we have to specify the following:\n\
    \n+   - The hyperparameter name\n+   - The minimum value that we want to test\n\
    +   - The maximum value that we want to test\n\n**Important note**\nEach type\
    \ of hyperparameter must fit in one of the parameter ranges sections, such as\
    \ categorical, continuous, or integer parameters.\n\nIn `ResourceLimits`, we are\
    \ specifying the number of training jobs along with the number of parallel jobs\
    \ that we want to run. Remember that the goal of the tuning process is to execute\
    \ many training jobs with different hyperparameter settings. This is so that the\
    \ best one will be selected for the final model. That's why we have to specify\
    \ these training job execution rules.\n\nWe then set up our search strategy in\
    \ `Strategy` and, finally, set up the objective function in `HyperParameterTuningJobObjective`:\n\
    \n```\ntuning_job_config = {\n    \"ParameterRanges\": {\n        \"CategoricalParameterRanges\"\
    : [],\n        \"ContinuousParameterRanges\": [],\n        \"IntegerParameterRanges\"\
    : [\n            {\n                \"MaxValue\": \"10\",\n                \"\
    MinValue\": \"1\",\n                \"Name\": \"max_depth\"\n            }\n \
    \       ]\n    }\n}\n```"
  merge: -1
