    Alright, that''s all I have to talk about regarding data visualization techniques
    for the AWS machine learning specialty exam. Now, let''s take a look at Quick
    Sight, an AWS service where you can implement all these visualization techniques
    you have just learned.


    # Introducing Quick Sight


    Amazon Quick Sight is a cloud-based analytics service that allows you to build
    data visualizations and ad hoc analysis. Quick Sight supports a variety of data
    sources, such as Redshift, Aurora, Athena, RDS, and your on-premises database
    solution.


    Other sources of data include S3, where you can retrieve data from Excel, CSV,
    or log files, and **Software as a Service (SaaS)** solutions, where you can retrieve
    data from Salesforce entities.


    Amazon Quick Sight has two versions:


    +   - Standard Edition

    +   - Enterprise Edition


    The most important difference between these two versions is the possibility of
    integration with Microsoft **Active Directory (AD)** and encryption at rest. Both
    features are only provided in the enterprise edition.


    > **Important note**

    > Keep in mind that AWS services are constantly evolving, so more differences
    between the standard and enterprise versions may crop up in the future.

    > You should always consult the latest documentation of AWS services to check
    what''s new.


    In terms of access management, Quick Sight offers a very simple interface you
    can use to control user access. In the standard edition, you have pretty much
    two options for inviting a user to your Quick Sight account:


    +   - You can invite an IAM user.

    +   - You can send an invitation to an email address.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'If you invite an IAM user, then they can automatically log into your account
    and see or edit your visualization, depending on the type of permission you have
    provided during Quick Sight user creation. If you have invited an email address,
    then the email owner has to access his/her mailbox to complete this operation.


    Removing a user is also pretty straightforward. The only extra information you
    have to provide while removing a user is whether you want to transfer the orphaned
    resources to another user into your account, or whether you want to delete all
    the user''s resources.


    If you are playing with the enterprise edition, this process of authorizing users
    can be a little different since you have AD working for you. In this case, you
    can grant access to AD groups, and all the users from that group would be granted
    access to your account on Quick Sight.


    Also, remember that in both versions, all data transfer is encrypted; however,
    you will only find encryption at rest in the enterprise edition.


    When you are bringing data into Quick Sight, you are technically creating what
    we call **datasets**. Datasets, in turn, are imported in an optimized structure
    into Quick Sight, known as the **Super-fast, Parallel, In-memory, Calculation
    Engine (SPICE)**. That''s why Quick Sight can perform data visualization on big
    data.


    We know that Quick Sight offers high availability and durability since the data
    that''s imported into it is replicated.


    Something else you should be aware of is that Quick Sight does not only allow
    you to plot your data but also perform some small data preparation tasks, such
    as renaming fields, computing new fields, changing data types, preparing queries
    to retrieve data from the source, and joining tables from the same source.


    Let''s summarize the main steps for working with Quick Sight:


    +   1. User creation and authorization.

    +   2. Connecting to a **data source**.

    +   3. Bringing data into a **dataset**.

    +   4. Your dataset will be imported into **SPICE**.

    +   5. From a dataset, you can create an **analysis**.

    +   6. Finally, inside your analysis, you can add **visuals**.

    +   7. In case you want to go further, you can create a snapshot of your analysis
    and place it in a **dashboard**. Alternatively, you can group your analysis into
    **stories**.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'That brings us to the end of this chapter about data visualizations! Now, let''s
