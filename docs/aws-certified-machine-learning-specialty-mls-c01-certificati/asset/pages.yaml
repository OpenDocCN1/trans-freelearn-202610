    # Speech to text with Amazon Transcribe


    In the previous section, we learned about text to speech. In this section, we
    will learn about speech to text and the service that provides this: Amazon Transcribe.
    It is an automatic speech recognition service that uses pre-trained deep learning
    models, which means that we don’t have to train on petabytes of data to produce
    a model; Amazon does this for us. We just have to use the APIs that are available
    to transcribe audio files or video files; it supports a number of different languages
    and custom vocabulary too. Accuracy is the key and through custom vocabulary,
    you can enhance it based on the desired domain or industry:


    ![](img/209e007237d34506e7ba16180f2e905c_61_0.png)


    Figure 2.12 – Block diagram of Amazon Transcribe''s input and output


    Some common uses of Amazon Transcribe include the following:


    +   - Real-time audio streaming and transcription.

    +   - Transcribing pre-recorded audio files.

    +   - Enable text searching from a media file by combining AWS Elasticsearch and
    Amazon Transcribe.

    +   - Performing sentiment analysis on recorded audio files for voice helpdesk
    (contact center analytics).

    +   - Channel identification separation.


    Next, we’ll explore the benefits of Amazon Transcribe.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Exploring the benefits of Amazon Transcribe


    Let''s look at some of the benefits of using Amazon Transcribe:


    +   - *Content Redaction*: Customer privacy can be ensured by instructing Amazon
    Transcribe to identify and redact **personally identifiable information (PII)**
    from the language transcripts. You can filter unwanted words from your transcript
    by supplying a list of unwanted words with `VocabularyFilterName` and `VocabularyFilterMethod`,
    which are provided by the `StartTranscriptionJob` operation. For example, in financial
    organizations, this can be used to redact a caller''s details.

    +   - *Language Identification*: It can automatically identify the most used language
    in an audio file and generate transcriptions. If you have several audio files,
    then this service would help you classify them by language.

    +   - *Streaming Transcription*: You can send recorded audio files or live audio
    streams to Amazon Transcribe and output a stream of text in real time.

    +   - *Custom Vocabulary or Customized Transcription*: You can use your custom
    vocabulary list as per your custom needs to generate accurate transcriptions.

    +   - *TimeStamp Generation*: If you want to build or add subtitles for your videos,
    then Amazon Transcribe can return the timestamp for each word or phrase from the
    audio.

    +   - *Cost Effectiveness*: Being a managed service, there is no infrastructure
    cost.


    Now, let''s get hands-on with Amazon Transcribe.


