    # Applying other types of numerical transformations


    Normalization and standardization rely on your training data to fit their parameters:
    minimum and maximum values in the case of normalization, and mean and standard
    deviation in the case of standard scaling. This also means you must fit those
    parameters using only your training data and never the testing data.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'However, there are other types of numerical transformations that do not require
    parameters from training data to be applied. These types of transformations rely
    purely on mathematical computations. For example, one of these transformations
    is known as **logarithmic transformation**. This is a very common type of transformation
    in machine learning models and is especially beneficial for **skewed** features.
    In case you don''t know what a skewed distribution is, take a look at the following
    diagram:


    ![](img/209e007237d34506e7ba16180f2e905c_106_0.png)


    Figure 3.13 – Skewed distributions


    In the middle, we have a normal distribution (or Gaussian distribution). On the
    left- and right-hand sides, we have skewed distributions. In terms of skewed features,
    there will be some values far away from the mean in one single direction (either
    left or right). Such behavior will push both the median and mean values of this
    distribution in the same direction of the long tail we can see in the preceding
    diagram.


    One very clear example of data that used to be skewed is the annual salaries of
    a particular group of professionals in a given region, such as senior data scientists
    working in Florida, US. This type of variable usually has most of its values close
    to the others (because people used to earn an average salary) and just has a few
    very high values (because a small group of people makes much more money than others).


    Hopefully, you can now easily understand why the mean and median values will move
    to the tail direction, right? The big salaries will push them in that direction.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Alright, but why will a logarithmic transformation be beneficial for this type
    of feature? The answer to this question can be explained by the math behind it:


    ```

    log(x^n) = n log(x)

    ```


    Figure 3.14 – Logarithmic properties


    Computing the log of a number is the inverse of the exponential function. Log
    transformation will then reduce the scale of your number according to a given
    base (such as base 2, base 10, or base e, in the case of a natural logarithm).
    Looking at our salary''s distribution from the previous example, we would bring
    all those numbers down so that the higher the number, the higher the reduction;
    however, we would do this in a log scale and not in a linear fashion. Such behavior
    will remove the outliers of this distribution (making it closer to a normal distribution),
    which is beneficial for many ML algorithms, such as linear regression. The following
    table shows you some of the differences when transforming a number in a linear
    scale versus a log scale:


    | Original value | Linear scale (normalization) | Log scale (base 10) |

    | 10 | 0.0001 | 1 |

    | 1,000 | 0.01 | 3 |

    | 10,000 | 0.1 | 4 |

    | 100,000 | 1 | 5 |


    Figure 3.15 – Differences between linear transformation and log transformation


    I hope you can see that the linear transformation kept the original magnitude
    of the data (we can still see outliers, but in another scale), while the log transformation
    removed those differences of magnitude and still kept the order of the values.


    Would you be able to think about another type of mathematical transformation that
    follows the same behavior of log (making the distribution closer to Gaussian)?
    OK, I can give you another: square root. Take the square root of those numbers
    shown in the preceding table and see yourself!


    Now, pay attention to this: both log and square root belong to a set of transformations
    known as power transformations, and there is very popular method, which is likely
    to be mentioned on your AWS exam, that can perform a range of power transformations
    like those we have seen. This method was proposed by George Box and David Cox
    and its name is Box-Cox.'
  merge: -1
  img_proc: true
- pgno: 108
