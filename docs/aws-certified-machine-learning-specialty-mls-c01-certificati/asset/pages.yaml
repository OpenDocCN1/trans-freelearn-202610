    a different folder):


    ![](img/209e007237d34506e7ba16180f2e905c_205_0.png)


    Figure 6.8 – A screenshot of Amazon Athena''s settings


    +   4. The next step is to write your query in the query editor and execute it.
    Once your execution is complete, please delete your S3 buckets and AWS Glue data
    catalogs. This will save you money.'
