    # Visualizing compositions in your data


    Sometimes, you want to analyze the various elements that compose your feature;
    for example, the percentage of sales per region or percentage of queries per channel.
    In both examples, we are not considering any time dimension; instead, we are just
    looking at the data as a whole. For these types of compositions, where you don''t
    have the time dimension, you could show your data using pie charts, stacked 100%
    bar charts, and treemaps.


    The following is a pie chart showing the number of queries per customer channel,
