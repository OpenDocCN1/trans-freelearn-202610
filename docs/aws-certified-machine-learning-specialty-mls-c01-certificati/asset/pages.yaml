  md: '![](img/209e007237d34506e7ba16180f2e905c_117_0.png)


    Figure 3.22 – Box plot definition


    Q1 is also known as the lower quartile or 25th quartile, and this means that 25%
    of the data is below that point in the distribution. Q3 is also known as the upper
    quartile or 75th quartile, and this means that 75% of the data is below that point
    in the distribution.


    Computing the difference between Q1 and Q3 will give you the interquartile range
    (IQR) value, which you can then use to compute the limits of the box plot, shown
    by the "minimum" and "maximum" labels in the preceding diagram.


    After all, we can finally infer that anything below the "minimum" value or above
    the "maximum" value of the box plot will be flagged as an outlier.


    You have now learned about two different ways you can flag outliers on your data:
    zscore and box plot. You can decide whether you are going to remove these points
    from your dataset or create another variable to specify that they are, indeed,
    outliers (as we did in Figure 3.21).


    Let’s continue our journey of data preparation and look at other types of problems
    we will find in real life. Next, you will learn that several use cases have something
    known as rare events, which makes ML algorithms focus on the wrong side of the
    problem and propose bad solutions. Luckily, we will learn how to either tune them
    or prepare the data to make them smarter.


    # Dealing with unbalanced datasets


    At this point, I hope you have realized why data preparation is probably the longest
    part of our work. We have learned about data transformation, missing data values,
    and outliers, but the list of problems goes on. Don’t worry – bear with me and
    let’s master this topic together!'
