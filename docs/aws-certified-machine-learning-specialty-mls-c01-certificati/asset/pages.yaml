- pgno: 206
  md: 'In this section, we learned about querying S3 data using Amazon Athena through
    the AWS data catalog. You can also create your schema and query the data from
    S3. In the next section, we will learn about Amazon Kinesis Data Streams.


    # Processing real-time data using Kinesis data streams


    Kinesis is Amazon''s streaming service and can be scaled based on requirements.
    It is highly available in a region. It has a level of persistence that retains
    data for 24 hours by default or optionally up to 365 days. Kinesis data streams
    are used for large-scale data ingestion, analytics, and monitoring:


    +   - Kinesis can be ingested by multiple producers and multiple consumers can
    also read data from the stream. Let''s understand this by means of an example
    in real time. Suppose you have a producer ingesting data to a Kinesis stream and
    the default retention period is 24 hours, which means the data ingested at 05:00:00
    A.M. today will be available in the stream until 04:59:59 A.M. tomorrow. This
    data won''t be available beyond that point and ideally, this should be consumed
    before it expires or can be stored somewhere if it''s critical. The retention
    period can be extended to a maximum of 365 days at an extra cost.

    +   - Kinesis can be used for real-time analytics or dashboard visualization.
    Producers can be imagined as a piece of code pushing data into the Kinesis stream,
    and it can be an EC2 instance running the code, a Lambda function, an IoT device,
    on-premises servers, mobile applications or devices, and so on.

    +   - Similarly, the consumer can also be a piece of code running on an EC2 instance,
    Lambda function, or on-premises servers that know how to connect to a kinesis
    stream, read the data, and apply some action to the data. AWS provides triggers
    to invoke a lambda consumer as soon as data arrives at the kinesis stream.

    +   - Kinesis is scalable due to its shard architecture, which is the fundamental
    throughput unit of a kinesis stream. What is a shard? A shard is a logical structure
    that partitions the data based on a partition key. A shard supports a writing
    capacity of 1 MB/sec and a reading capacity of 2 MB/sec. 1,000 PUT records per
    second are supported by a single shard. If you have created a stream with 3 shards,
    then 3 MB/sec write throughput and 6 MB/sec read throughput can be achieved and
    this allows 3,000 PUT records. So, with more shards, you have to pay an extra
    amount to get higher performance.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "+   - The data in a shard is stored via a Kinesis data record and can be a\
    \ maximum of 1 MB. Kinesis data records are stored across the shard based on the\
    \ partition key. It also has a sequence number. A sequence number is assigned\
    \ by kinesis as soon as a `putRecord` or `putRecords` API operation is performed\
    \ so as to uniquely identify a record. The partition key is specified by the producer\
    \ while adding the data to the Kinesis data stream, and the partition key is responsible\
    \ for segregating and routing the record to different shards in the stream to\
    \ balance the load.\n+   - There are two ways to encrypt the data in a kinesis\
    \ stream: server-side encryption and client-side encryption. Client-side encryption\
    \ is hard to implement and manage the keys because the client has to encrypt the\
    \ data before putting it into the stream and decrypt the data after reading from\
    \ the stream. With server-side encryption enabled via **AWS/KMS**, the data is\
    \ automatically encrypted and decrypted as you put the data and get it from a\
    \ stream.\n\n> **Note**\n> Amazon Kinesis shouldn't be confused with Amazon SQS.\
    \ Amazon SQS supports one production group and one consumption group. If your\
    \ use case demands multiple users sending data and receiving data, then Kinesis\
    \ is the solution.\n> \n> For decoupling and asynchronous communications, SQS\
    \ is the solution, because the sender and receiver do not need to be aware of\
    \ one another.\n> \n> In SQS, there is no concept of persistence. Once the message\
    \ is read, the next step is deletion. There's no concept of the retention time\
    \ window for Amazon SQS. If your use case demands large-scale ingestion, then\
    \ Kinesis should be used.\n\nIn the next section, we will learn about storing\
    \ the streamed data for further analysis."
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Storing and transforming real-time data using Kinesis Data Firehose


    There are a lot of use cases demanding the data to be streamed and stored for
    future analytics purposes. To overcome such problems, you can write a kinesis
    consumer to read the Kinesis stream and store the data in S3. This solution needs
    an instance or a machine to run the code with the required access to read from
    the stream and write to S3. The other possible option would be to run a Lambda
    function that gets triggered on the `putRecord` or `putRecords` API made to the
    stream and reads the data from the stream to store in the S3 bucket:


    +   - To make this easy, Amazon provides a separate service called Kinesis Data
    Firehose. This can easily be plugged into a Kinesis data stream and it will require
    essential IAM roles to write data into S3. This is a fully managed service to
    reduce the load of managing servers and code. It also supports loading the streamed
    data into Amazon Redshift, Amazon Elasticsearch Service, and Splunk. Kinesis Data
    Firehose scales automatically to match the throughput of the data.

    +   - Data can be transformed via an AWS Lambda function before storing or delivering
    it to the destination. If you want to build a raw data lake with the untransformed
    data, then by enabling source record backup, you can store it in another S3 bucket
    prior to the transformation.

    +   - With the help of AWS/KMS, data can be encrypted following delivery to the
    S3 bucket. It has to be enabled while creating the delivery stream. Data can also
    be compressed in supported formats such as GZIP, ZIP, and SNAPPY compression formats.


    In the next section, we will learn about different AWS services used for ingesting
    data from on-premises servers to AWS.


    # Different ways of ingesting data from on-premises into AWS


    With the increasing demand for data-driven use cases, managing data on on-premises
    servers is pretty tough at the moment. Taking backups is not easy when you deal
    with a huge amount of data. This data in data lakes is being used to build deep
    neural networks, to create a data warehouse to extract meaningful information
    from it, to run analytics, and to generate reports.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Now, if we look at the available options to migrate data into AWS, then it
    comes with various challenges, too. For example, if you want to send data to S3,
    then you have to write a few lines of code to send your data to AWS. You will
    have to manage the code and servers to run the code. It has to be ensured that
    the data is commuting via the HTTPS network. You need to verify whether the data
    transfer was successful. This adds complexity as well as time and effort challenges
    to the process. To avoid such scenarios, AWS provides services to match or solve
    your use cases by designing hybrid infrastructure that allows data sharing between
    the on-premises data centers and AWS. Let''s learn about these in the following
    sections.


    # AWS Storage Gateway


    Storage Gateway is a hybrid storage virtual appliance. It can run in three different
    modes – **File Gateway**, **Tape Gateway**, and **Volume Gateway**. It can be
    used for extension, migration, and backups of the on-premises data center to AWS:


    +   - In Tape Gateway mode, the storage gateway stores virtual tapes on S3, and
    when ejected and archived, the tapes are moved from S3 to Glacier. Active tapes
    are stored in S3 for storage and retrieval. Archived or exported tapes are stored
    in **Virtual Tape Shelf (VTS)** in Glacier. Virtual tapes can be created and can
    range in size from 100 GiB to 5 TiB. A total of 1 petabyte of storage can be configured
    locally and an unlimited number of tapes can be archived to Glacier. This is ideal
    for an existing backup system on tape and where there is a need to migrate backup
    data into AWS. You can decommission the physical tape hardware later.

    +   - In File Gateway mode, the storage gateway maps files onto S3 objects, which
    can be stored using one of the available storage classes. This helps you to extend
    the data center into AWS. You can load more files to your File Gateway and these
    are stored as S3 objects. It can run on your on-premises virtual server, which
    connects to various devices using **Server Message Block (SMB)** or **Network
    File System (NFS)**. The File Gateway connects to AWS using an HTTPS public endpoint
    to store the data on S3 objects. Life cycle policies can be applied to those S3
    objects. You can easily integrate your **Active Directory (AD)** with File Gateway
    to control access to the files on the file share.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - In Volume Gateway mode, the storage gateway presents block storage. There
    are two ways of using this, one is **Gateway Cached**, and the other is **Gateway
    Stored**:

    +   - **Gateway Stored** is a volume storage gateway running locally on-premises
    and it has local storage and an upload buffer. A total of 32 volumes can be created
    and each volume can be up to 16 TB in size for a total capacity of 512 TB. Primary
    data is stored on-premises and backup data is asynchronously replicated to AWS
    in the background. Volumes are made available via **Internet Small Computer Systems
    Interface (iSCSI)** for network-based servers to access. It connects to **Storage
    Gateway Endpoint** via an HTTPS public endpoint and creates EBS snapshots from
    backup data. These snapshots can be used to create standard EBS volumes. This
    option is ideal for migration to AWS or disaster recovery or business continuity.
    The local system will still use the local volume, but the EBS snapshots are in
    AWS, which can be used instead of backups. It''s not the best option for data
    center extension because you require a huge amount of local storage.

    +   - **Gateway Cached** is a volume storage gateway running locally on-premises
    and it has cache storage and an upload buffer. The difference is that the data
    that is added to the storage gateway is not local but uploaded to AWS. Primary
    data is stored in AWS. Frequently accessed data is cached locally. This is an
    ideal option for extending the on-premises data center to AWS. It connects to
    **Storage Gateway Endpoint** via an HTTPS public endpoint and creates **S3 Backed
    Volume (AWS-managed bucket)** snapshots that are stored as standard EBS snapshots.


    # Snowball, Snowball Edge, and Snowmobile


    They belong to the same product clan for the physical transfer of data between
    business operating locations and AWS. For moving a large amount of data into and
    out of AWS, you can use any of the three:


    +   - **Snowball**: This can be ordered from AWS by logging a job. AWS delivers
    the device to load your data and send it back. Data in Snowball is encrypted using
    KMS. It comes with two capacity ranges, one 50 TB and the other 80 TB. It is economical
    to order one or more Snowball devices for data between 10 TB and 10 PB. The device
    can be sent to different premises. It does not have any compute capability; it
    only comes with storage capability.

    +   - **Snowball Edge**: This is like Snowball, but it comes with both storage
    and computes capability. It has a larger capacity than Snowball. It offers fastened
    networking, such as 10 Gbps over RJ45, 10/25 Gb over SFP28, and 40/100 Gb+ over
    QSFP+ copper. This is ideal for the secure and quick transfer of terabytes to
    petabytes of data into AWS.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '+   - **Snowmobile:** This is a portable data center within a shipping container
    on a truck. This allows you to move exabytes of data from on-premises to AWS.
    If your data size exceeds 10 PB, then Snowmobile is preferred. Essentially, upon
    requesting Snowmobile, a truck is driven to your location, you plug your data
    center into the truck, and transfer the data. If you have multiple sites, choosing
    Snowmobile for data transfer is not an ideal option.


    # AWS DataSync


    AWS DataSync is designed to move data from on-premises storage to AWS, or vice
    versa:


    +   - It is an ideal product from AWS for data processing transfers, archival
    or cost-effective storage, disaster recovery, business continuity, and data migrations.


    +   - It has a special data validation feature that verifies the original data
    with the data in AWS, as soon as the data arrives in AWS. In other words, it checks
    the integrity of the data.


    +   - Let’s understand this product in depth by considering an example of an on-premises
    data center that has SAN/NAS storage. When we run the AWS DataSync agent on a
    VMWare platform, this agent is capable of communicating with the NAS/SAN storage
    via an NFS/SMB protocol. Once it is on, it communicates with the AWS DataSync
    endpoint and, from there, it can connect with several different types of location,
    including various S3 storage classes or VPC-based resources, such as the **Elastic
    File System (EFS)** and FSx for Windows Server.


    +   - It allows you to schedule data transfers during specific periods. By configuring
    the built-in bandwidth throttle, you can limit the amount of network bandwidth
    that DataSync uses.


    # Processing stored data on AWS


    There are several services for processing the data stored in AWS. We will go through
    AWS Batch and AWS EMR (Elastic MapReduce) in this section. EMR is a product from
    AWS that primarily runs MapReduce jobs and Spark applications in a managed way.
    AWS Batch is used for long-running, compute-heavy workloads.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# AWS EMR


    EMR is a managed implementation of Apache Hadoop provided as a service by AWS.
    It includes other components of the Hadoop ecosystem, such as Spark, HBase, Flink,
    Presto, Hive, Pig, and many more. We will not cover these in detail for the certification
    exam:


    +   - EMR clusters can be launched from the AWS console or via the AWS CLI with
    a specific number of nodes. The cluster can be a long-term cluster or an ad hoc
    cluster. If you have a long-running traditional cluster, then you have to configure
    the machines and manage them yourself. If you have jobs to be executed faster,
    then you need to manually add a cluster. In the case of EMR, these admin overheads
    are gone. You can request any number of nodes to EMR and it manages and launches
    the nodes for you. If you have autoscaling enabled on the cluster, then with the
    increased requirement, EMR launches new nodes in the cluster and decommissions
    the nodes once the load is reduced.

    +   - EMR uses EC2 instances in the background and runs in one availability zone
    in a VPC. This enables faster network speeds between the nodes. AWS Glue uses
    EMR clusters in the background, where users do not need to worry about the operational
    understanding of AWS EMR.

    +   - From a use case standpoint, EMR can be used for processing or transforming
    the data stored in S3 and outputs data to be stored in S3. EMR uses nodes (EC2
    instances) as the computing units for data processing. EMR nodes come in different
    variants, including Master node, Core node, and Task node.

    +   - The EMR master node acts as a Hadoop namenode and manages the cluster and
    its health. It is responsible for distributing the job workload among the other
    core nodes and task nodes. If you have SSH enabled, then you can connect to the
    master node instance and access the cluster.

    +   - The EMR cluster can have one or more core nodes. If you relate to the Hadoop
    ecosystem, then core nodes are similar to Hadoop data nodes for HDFS and they
    are responsible for running tasks therein.

    +   - Task nodes are optional and they don''t have HDFS storage. They are responsible
    for running tasks. If a task node fails for some reason, then this does not impact
    HDFS storage, but a core node failure causes HDFS storage interruptions.

    +   - EMR has its filesystem called EMRFS. It is backed by S3 and this feature
    makes it regionally resilient. If a core node fails, the data is still safe in
    S3. HDFS is efficient in terms of I/O and faster than EMRFS.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'In the following section, we will learn about AWS Batch, which is a managed
    batch processing compute service that can be used for long-running services.


    # AWS Batch


    This is a managed batch processing product. If you are using AWS Batch, then jobs
    can be run without end user interaction or can be scheduled to run:


    +   - Imagine an event-driven application that launches a Lambda function to process
    the data stored in S3. If the processing time goes beyond 15 minutes, then Lambda
    has the execution time limit. For such scenarios, AWS Batch is a better solution,
    where computation-heavy workloads can be scheduled or driven through API events.

    +   - AWS Batch is a good fit for use cases where a longer processing time is
    required or more computation resources are needed.

    +   - AWS Batch runs a job that can be a script or an executable. One job can
    depend on another job. A job needs a definition, such as who can run a job (with
    IAM permissions), where the job can be run (resources to be used), mount points,
    and other metadata.

    +   - Jobs are submitted to queues where they wait for compute environment capacity.
    These queues are associated with one or more compute environments.

    +   - Compute environments do the actual work of executing the jobs. These can
    be ECS or EC2 instances, or any computing resources. You can define their sizes
    and capacities too.

    +   - Environments receive jobs from the queues based on their priority and execute
    the jobs. They can be managed or unmanaged compute environments.

    +   - AWS Batch can store the metadata in DynamoDB for further use and can also
    store the output to the S3 bucket.


    > **Note**

    > If you get a question in exams on an event-style workload that requires flexible
    compute, a higher disk space, no time limit (more than 15 minutes), or an effective
    resource limit, then choose AWS Batch.'
  merge: -1
  img_proc: true
