    In the following section, we will learn about querying the S3 data using Athena.


    # Querying S3 data using Athena


    Athena is a serverless service designed for querying data stored in S3. It is
    serverless because the client doesn''t manage the servers that are used for computation:


    +   - Athena uses a schema to present the results against the query on the data
    stored in S3. You define how you want your data to appear in the form of a schema
    and Athena reads the raw data from S3 to show the results as per the defined schema.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   - The output can be used by other services for visualization, storing,
    or various analytics purposes. The source data in S3 can be in any of the following
    structured, semi-structured, and unstructured data formats, including XML, JSON,
    CSV/TSV, AVRO, Parquet, ORC, and more. CloudTrail, ELB Logs, and VPC flow logs
    can also be stored in S3 and analyzed by Athena.

    +   - This follows the schema-on-read technique. Unlike traditional techniques,
    tables are defined in advance in a data catalog, and data is projected when it
    reads. SQL-like queries are allowed on data without transforming the source data.


    Now, let''s understand this with the help of an example, where we will use AWSDataCatlog
    created in AWS Glue on the S3 data and query them using Athena:


    +   1. Navigate to the AWS Athena console. Select AWSDataCatalog from Data source
    (if you''re doing this for the first time, then a sampledB database will be created
    with a table, elb_logs, in the AWS Glue data catalog).

    +   2. Select s3-data as the database.

    +   3. Click on Settings from the top-right corner and fill in the details as
