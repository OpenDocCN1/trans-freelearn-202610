- pgno: 230
  md: 'As we can see, there is an almost perfect linear relationship between X and
    Y. As the amount of work experience increases, so does the salary. In addition
    to X and Y, we need to compute the following statistics: the number of records,
    the mean of X, the mean of Y, the covariance of X and Y, the variance of X, and
    the variance of Y. The following formulas provide a mathematical representation
    of variance and covariance (respectively), where x bar, y bar, and n represent
    the mean of X, the mean of Y, and the number of records, respectively:


    ```

    s² = Σ(xᵢ - x̄) / n


    Cov(X, Y) = Σᵢ=1ⁿ (xᵢ - x̄)(yᵢ - ȳ) / n

    ```


    If you want to check the calculation details of the formulas for each of those
    auxiliary statistics in Table 7.2, please refer to the support material provided
    along with this book. There, you will find those formulas already implemented
    for you.


    These statistics are important because they will be used to compute our alpha
    and beta coefficients. The following image explains how we are going to compute
    both coefficients, along with the correlation coefficients R and R squared. These
    last two metrics will give us an idea about the quality of the model, where the
    closer the model is to 1, the better the model is:


    ![](img/209e007237d34506e7ba16180f2e905c_230_0.png)


    Figure 7.5 – Equations to calculate coefficients for simple linear regression'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'After applying these formulas, we will come up with the results shown here:


    | Coefficient | Description | Value |

    |---|---|---|

    | Alpha | Line inclination | 1,021,212,121 |

    | Beta | Interceptor | 53 |

    | R | Correlation | 0,979,364,354 |

    | R^2 | Determination | 0,959,154,538 |


    Figure 7.6 – Finding regression coefficients


    The preceding table already contains all the information that we need to make
