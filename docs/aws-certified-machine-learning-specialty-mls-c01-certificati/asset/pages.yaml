    +   - The **c** family: **c** family instances are compute-optimized. This is
    a requirement for jobs that need higher compute power and less memory to store
    the data. If you refer to the following table, C5.2x large has 8 vCPU and 16 GiB
    memory, which makes it compute-optimized with less memory. For example, a use
    case needs to be tested on a fewer number of records and it is compute savvy,
