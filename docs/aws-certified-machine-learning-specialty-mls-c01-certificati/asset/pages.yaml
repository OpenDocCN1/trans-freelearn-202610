- pgno: 109
  md: 'By the way, data transformation is important, but just one piece of your work
    as a data scientist. Your modeling journey still has to move to other important
    topics, such as missing values and outliers handling, which we will look at next.
    However, before that, you may have noticed that you were introduced to Gaussian
    distributions during this section, so let''s take a moment to discuss them in
    a bit more detail.


    # Understanding data distributions


    Although the Gaussian distribution is probably the most common distribution for
    statistical and machine learning models, you should be aware that it is not the
    only one. There are other types of data distributions, such as the **Bernoulli**,
    **Binomial**, and **Poisson** distributions.


    The Bernoulli distribution is a very simple one, as there are only two types of
    possible events: success or failure. The success event has a probability "p" of
    happening, while the failure one has a probability of "1-p".


    Some examples that follow a Bernoulli distribution are rolling a six-sided die
    or flipping a coin. In both cases, you must define the event of success and the
    event of failure. For example, suppose our events for success and failure in the
    die example are as follows:


    +   - Success: Getting a number 6

    +   - Failure: Getting any other number


    We can then say that we have a p probability of success (1/6 = 0.16 = 16%) and
    a 1-p probability of failure (1 - 0.16 = 0.84 = 84%).


    The Binomial distribution generalizes the Bernoulli distribution. The Bernoulli
    distribution has only one repetition of an event, while the Binomial distribution
    allows the event to be repeated many times, and we must count the number of successes.
    Let''s continue with our prior example; that is, counting the number of times
    we got a 6 out of our 10 dice rolls. Due to the nature of this example, Binomial
    distribution has two parameters, n and p, where n is the number of repetitions
    and p is the probability of success in every repetition.


    Finally, a Poisson distribution allows us to find a number of events in a time
    period, given the number of times an event occurs in an interval. It has three
    parameters: lambda, e, and k, where lambda is the average number of events per
    interval, e is the Euler number, and k is the number of times an event occurs
    in an interval.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'With all those distributions, including the Gaussian one, it is possible to
    compute the expected mean value and variance based on their parameters. This information
    is usually used in hypothesis tests to check whether some sample data follows
    a given distribution, by comparing the mean and variance of the sample against
    the expected mean and variance of the distribution.


    I hope you are now more familiar with data distributions generally, not only Gaussian
    distributions. We will keep talking about data distributions throughout this book.
    For now, let''s move on to missing values and outlier detection.


    # Handling missing values


    As the name suggests, missing values refer to the absence of data. Such absences
    are usually represented by tokens, which may or may not be implemented in a standard
    way.


    Although using tokens is standard, the way those tokens are displayed may vary
    across different platforms. For example, relational databases represent missing
    data with NULL, core Python code will use None, and some Python libraries will
    represent missing numbers as (Not a Number (NaN)).


    > **Important note**

    > For numerical fields, don''t replace those standard missing tokens with zeros.
    By default, zero is not a missing value, but another number. I said "by default"
    because, in data science, we may face some data quality issues, which we will
    cover next.


    However, in real business scenarios, you may or may not find those standard tokens.
    For example, a software engineering team might have designed the system to automatically
    fill missing data with specific tokens, such as "unknown" for strings or "-1"
    for numbers. In that case, you would have to search by those two tokens to find
    missing data. People can set anything.


    In the previous example, the software engineering team was still kind enough to
    give us standard tokens. However, there are many cases where legacy systems do
    not add any data quality layer in front of the user, and you may find an address
    field filled with "I don''t want to share" or a phone number field filled with
    "Don''t call me". This is clearly missing data, but not as standard as the previous
    example.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'There are many more nuances that you will learn regarding missing data, all
    of which we will cover in this section, but be advised: before you start making
    decisions about missing values, you should prepare a good data exploration and
    make sure you find those values. You can either compute data frequencies or use
    missing plots, but please do something. Never assume that your missing data is
    represented only by those handy standard tokens.


    Why should we care about this type of data? Well, first, because most algorithms
    (apart from decision trees implemented on very specific ML libraries) will raise
    errors when they find a missing value. Second (and maybe most importantly), by
    grouping all the missing data in the same bucket, you are assuming that they are
    all the same, but in reality, you don''t know that.


    Such a decision will not only add bias to your model – it will reduce its interpretability,
    as you will be unable to explain the missing data. Once we know why we want to
    treat the missing values, we can take a look at our options.


    Theoretically, we can classify missing values into two main groups: **MCAR** or
    **MNAR**. MCAR stands for **Missing Completely at Random** and states that there
    is no pattern associated with the missing data. On the other hand, MNAR stands
    for **Missing Not at Random** and means that the underlying process used to generate
    the data is strictly connected to the missing values.


    Let me give you an example of MNAR missing values. Suppose you are collecting
    user feedback about a particular product in an online survey. Your process of
    asking questions is dynamic and depends on user answers. When a user specifies
    an age lower than 18 years old, you never ask his/her marital status. In this
    case, missing values of marital status are connected to the age of the user (MNAR).


    Knowing the class of missing values that you are dealing with will help you understand
    if you have any control over the underlying process that generates the data. Sometimes,
    you can come back to the source process and, somehow, complete your missing data.


    > **Important note**

    > Although, in real scenarios, we usually have to treat missing data via exclusion
    or imputation, never forget that you can always try to look at the source process
    and check if you can retrieve (or, at least, better understand) the missing data.
    You may face this option in the exam.


    If you don''t have an opportunity to recover your missing data from somewhere,
    then you should move on to other approaches, such as **listwise deletion** and
    **imputation**.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Listwise deletion refers to the process of discarding some data, which is the
    downside of this choice. This may happen at the row level or at the column level.
    For example, suppose you have a DataFrame containing four columns and one of them
    has 90% of its data missing. In such cases, what usually makes more sense is dropping
    the entire feature (column), since you don''t have that information for the majority
    of your observations (rows).


    From a row perspective, you may have a DataFrame with a small number of observations
    (rows) containing missing data in one of its features (columns). In such scenarios,
    instead of removing the entire feature, what makes more sense is removing only
    those few observations.


    The benefit of using this method is the simplicity of dropping a row or a column.
    Again, the downside is losing information. If you don''t want to lose information
    while handling your missing data, then you should go for an imputation strategy.


    Imputation is also known as replacement, where you will replace missing values
    by substituting a value. The most common approach of imputation is replacing the
    missing value with the mean of the feature. Please take a note of this approach
    because it is likely to appear in your exam:


    | Age |

    | --- |

    | 35 |

    | 30 |

    |  |

    | 25 |

    | 80 |

    | 75 |


    Figure 3.17 – Replacing missing values with the mean or median


    The preceding table shows a very simple dataset with one single feature and five
    observations, where the third observation has a missing value. If we decide to
    replace that missing data with the mean value of the feature, we will come up
    with 49. Sometimes, when we have outliers in the data, the median might be more
    appropriate (in this case, the median would be 35):'
  merge: -1
  img_proc: true
- pgno: 113
  md: '| Age | Job status |

    | --- | ---------- |

    | 35 | Employee |

    | 30 | Employee |

    |  | Retired |

    | 25 | Employee |

    | 80 | Retired |

    | 75 | Retired |


    Figure 3.18 – Replacing missing values with the mean or median of the group


    If you want to go deeper, you could find the mean or median value according to
    a given group of features. For example, in the preceding table, we expanded our
    previous dataset by adding the Job status column. Now, we have clues that help
    us suspect that our initial approach of changing the missing value by using the
    overall median (35 years old) is likely to be wrong (since that person is retired).


    What you can do now is replace the missing value with the mean or median of the
    other observations that belong to the same job status. Using this new approach,
    we can change the missing information to 77.5. Taking into account that the person
    is retired, 77.5 makes more sense than 35 years old.


    Important note

    In the case of categorical variables, you can replace the missing data with the
    value that has the highest occurrence in your dataset. The same logic of grouping
    the dataset according to specific features is still applicable.


    You can also use more sophisticated methods of imputation, including constructing
    a ML model to predict the value of your missing data. The downside of these imputation
    approaches (either by averaging or predicting the value) is that you are making
    inferences on the data, which are not necessarily right and will add bias to the
    dataset.


    To sum this up, the trade-off while dealing with missing data is having a balance
    between losing data or adding bias to the dataset. Unfortunately, there is no
    scientific manual that you can follow, whatever your problem. To decide on what
    you are going to do, you must look to your success criteria, explore your data,
    run experiments, and then make your decisions.


    We will now move to another headache for many ML algorithms, also known as outliers.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Dealing with outliers


    We are not on this studying journey just to pass the AWS Machine Learning Specialty
    exam, but also to become better data scientists. There are many different ways
    to look at the outlier problem purely from a mathematical perspective; however,
    the datasets we use are derived from the underlying business process, so we must
    include a business perspective during an outlier analysis.


    An **outlier** is an atypical data point in a set of data. For example, the following
    chart shows some data points that have been plotted in a two-dimension plan; that
    is, x and y. The red point is an outlier, since it is an atypical value on this
    series of data:


    ![](img/209e007237d34506e7ba16180f2e905c_114_0.png)


    Figure 3.19 – Identifying an outlier


    We want to treat outlier values because some statistical methods are impacted
    by them. Still, in the preceding chart, we can see this behavior in action. On
    the left-hand side, we drew a line that best fits those data points, ignoring
    the red point. On the right-hand side, we also drew the best line to fit the data
    but included the red point.


    We can visually conclude that, by ignoring the outlier point, we will come up
    with a better solution on the plan of the left-hand side of the preceding chart
    since it was able to pass closer to most of the values. We can also prove this
    by computing an associated error for each line (which we will discuss later in
    this book).


    It is worth reminding you that you have also seen the outlier issue in action
    in another situation in this book: specifically, in Figure 3.17, when we had to
    deal with missing values. In that example, we used the median (instead of the
    mean) to work around the problem. Feel free to go back and read it again, but
    what should be very clear at this point is that median values are less impacted
    by outliers than average values.


    You now know what outliers are and why you should treat them. You should always
    consider your business perspective while dealing with outliers, but there are
    mathematical methods to find them. Now, let’s look at these methods of outlier
    detection.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'You have already learned about the most common method: zscore. In Figure 3.11,
    we saw a table containing a set of ages. Refer to it again to refresh your memory.
    In the last column of that table, we are computing the zscore of each age, according
    to the equation shown in Figure 3.10.


    There is no well-defined range for those zscore values; however, in a normal distribution
    without outliers, they will range between -3 and 3. Remember: zscore will give
    you the number of standard deviations from the mean of the distribution. The following
    diagram shows some of the properties of a normal distribution:


    ![](img/209e007237d34506e7ba16180f2e905c_115_0.png)


    Figure 3.20 – Normal distribution properties. Image adapted from https://pt.wikipedia.org/wiki/Ficheiro:The_Normal_Distribution.svg


    According to the normal distribution properties, 95% of values will belong to
    the range of -2 and 2 standard deviations from the mean, while 99% of the values
    will belong to the range of -3 and 3. Coming back to the outlier detection context,
    we can set thresholds on top of those zscore values to specify whether a data
    point is an outlier or not!'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'There is no standard threshold that you can use to classify outliers. Ideally,
    you should look at your data and see what makes more sense for you… usually (this
    is not a rule), you will use some number between 2 and 3 standard deviations from
    the mean to set outliers, since more than 95% of your data will be out of that
    range. You may remember that there are outliers below and above the mean value
    of the distribution, as shown in the following table, where we have flagged outliers
    with an absolute zscore greater than 3 (the value column is hidden for the sake
    of this demonstration):


    | Value | Zscore | Is outlier? |

    | --- | --- | --- |

    | ... | 1.3 | NO |

    | ... | 0.8 | NO |

    | ... | 3.1 | YES |

    | ... | -2.9 | NO |

    | ... | -3.5 | YES |

    | ... | 1.0 | NO |

    | ... | 1.1 | NO |


    Figure 3.21 – Flagging outliers according to the zscore value


    We found two outliers in the preceding table: row number three and row number
    five. Another way to find outliers in the data is by applying the box plot logic.
    You will learn about box plots in more detail in the next chapter of this book.
    For now, let''s focus on using this method to find outliers.


    When we look at a numerical variable, it is possible to extract many descriptive
    statistics from it, not only the mean, median, minimum, and maximum values, as
    we have seen previously. Another property that''s present in data distributions
    is known as quantiles.


    Quantiles are cut-off points that are established at regular intervals from the
    cumulative distribution function of a random variable. Those regular intervals,
    also known as q-quantiles, will be nearly the same size and will receive special
    names in some situations; for example:


    +   - The 4-quantiles are called quartiles.

    +   - The 10-quantiles are called deciles.

    +   - The 100-quantiles are called percentiles.


    For example, the 20th percentile (of a 100-quantile regular interval) specifies
    that 20% of the data is below that point. In a box plot, we use regular intervals
    of 4-quantiles (also known as quartiles) to expose the distribution of the data
    (Q1 and Q3), as shown in the following diagram:'
  merge: -1
