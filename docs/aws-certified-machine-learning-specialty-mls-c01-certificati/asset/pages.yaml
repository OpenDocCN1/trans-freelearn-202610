- pgno: 19
  md: '# 1

    Machine Learning Fundamentals


    For many decades, researchers have been trying to simulate human brain activity
    through the field known as **artificial intelligence, AI** for short. In 1956,
    a group of people met at the Dartmouth Summer Research Project on Artificial Intelligence,
    an event that is widely accepted as the first group discussion about AI as we
    know it today. Researchers were trying to prove that many aspects of the learning
    process could be precisely described and, therefore, automated and replicated
    by a machine. Today, we know they were right!


    Many other terms appeared in this field, such as **machine learning (ML)** and
    **deep learning (DL)**. These sub-areas of AI have also been evolving for many
    decades (granted, nothing here is new to the science). However, with the natural
    advance of the information society and, more recently, the advent of **big data**
    platforms, AI applications have been reborn with much more power and applicability.
    Power, because now we have more computational resources to simulate and implement
    them; applicability, because now information is everywhere.


    Even more recently, cloud services providers have put AI in the cloud. This is
    helping all sizes of companies to either reduce their operational costs or even
    letting them sample AI applications (considering that it could be too costly for
    a small company to maintain its own data center).'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'That brings us to the goal of this chapter: being able to describe what the
    terms AI, ML, and DL mean, as well as understanding all the nuances of an ML pipeline.
    Avoiding confusion on these terms and knowing what exactly an ML pipeline is will
    allow you to properly select your services, develop your applications, and master
    the AWS Machine Learning Specialty exam.


    The main topics of this chapter are as follows:


    +   - Comparing AI, ML, and DL

    +   - Classifying supervised, unsupervised, and reinforcement learning

    +   - The CRISP-DM modeling life cycle

    +   - Data splitting

    +   - Modeling expectations

    +   - Introducing ML frameworks

    +   - ML in the cloud


    # Comparing AI, ML, and DL


    AI is a broad field that studies different ways to create systems and machines
    that will solve problems by simulating human intelligence. There are different
    levels of sophistication to create these programs and machines, which go from
    simple, rule-based engines to complex, self-learning systems. AI covers, but is
    not limited to, the following sub-areas:


    +   - Robotics

    +   - Natural language processing

    +   - Rule-based systems

    +   - ML


    The area we are particularly interested in now is ML.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Examining ML


    ML is a sub-area of AI that aims to create systems and machines that are able
    to learn from experience, without being explicitly programmed. As the name suggests,
    the system is able to observe its running environment, learn, and adapt itself
    without human intervention. Algorithms behind ML systems usually extract and improve
    knowledge from the data that is available to them, as well as conditions (such
    as **hyperparameters**), and feed back after trying different approaches to solve
    a particular problem:


    ![](img/209e007237d34506e7ba16180f2e905c_21_0.png)


    Figure 1.1 – Heirarchy of AI, ML, DL


    There are different types of ML algorithms; for instance, we can list decision
    tree-based, probabilistic-based, and neural networks. Each of these classes might
    have dozens of specific algorithms. Most of them will be covered in later sections
    of this book.


    As you might have noticed in Figure 1.1, we can be even more specific and break
    the ML field down into another very important topic for the Machine Learning Specialty
    exam: DL.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Examining DL


    DL is a subset of ML that aims to propose algorithms that connect multiple layers
    to solve a particular problem. The knowledge is then passed through layer by layer
    until the optimal solution is found. The most common type of DL algorithm is deep
    neural networks.


    At the time of writing this book, DL is a very hot topic in the field of ML. Most
    of the current state-of-the-art algorithms for machine translation, image captioning,
    and computer vision were proposed in the past few years and are a part of DL.


    Now that we have an overview of types of AI, let’s look at some of the ways we
    can classify ML.


    # Classifying supervised, unsupervised, and reinforcement learning


    ML is a very extensive field of study; that’s why it is very important to have
    a clear definition of its sub-divisions. From a very broad perspective, we can
    split ML algorithms into two main classes: supervised learning and unsupervised
    learning.


    # Introducing supervised learning


    Supervised algorithms use a class or label (from the input data) as support to
    find and validate the optimal solution. In Figure 1.2, there is a dataset that
    aims to classify fraudulent transactions from a bank:


    | Day of the week | EST Hour | Transaction amount | Merchant Type | Is Fraud?
    |

    |---|---|---|---|---|

    | Mon | 09:00 | $1000 | Retail | No |

    | Tue | 23:00 | $5500 | e-commerce | Yes |

    | Fri | 14:00 | $500 | Travel | No |

    | Mon | 10:00 | $100 | Retail | No |

    | Tue | 22:00 | $100 | e-commerce | No |

    | Tue | 22:00 | $6000 | e-commerce | Yes |


    Figure 1.2 - Sample dataset for supervised learning'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The first four columns are known as **features**, or **independent variables**,
    and they can be used by a supervised algorithm to find fraudulent patterns. For
    example, by combining those four features (day of the week, EST hour, transaction
    amount, and merchant type) and six observations (each row is technically one observation),
    you can infer that e-commerce transactions with a value greater than $5,000 and
    processed at night are potentially fraudulent cases.


    > **Important note**

    > In a real scenario, we should have more observations in order to have statistical
    support to make this type of inference.


    The key point is that we were able to infer a potential fraudulent pattern just
    because we knew, *a priori*, what is fraud and what is not fraud. This information
    is present in the last column of Figure 1.2 and is commonly referred to as a target
    variable, label, response variable, or dependent variable. If the input dataset
    has a target variable, you should be able to apply supervised learning.


    In supervised learning, the target variable might store different types of data.
    For instance, it could be a binary column (yes or no), a multi-class column (class
    A, B, or C), or even a numerical column (any real number, such as a transaction
    amount). According to the data type of the target variable, you will find which
    type of supervised learning your problem refers to. Figure 1.3 shows how to classify
    supervised learning into two main groups: **classification** and **regression**
    algorithms:


    | Data type of the target variable | Sub data type of the target variable | Type
    of supervised learning applicable |

    |---|---|---|

    | Categorical | Binary | Binary classification |

    | Categorical | Multi class | Multi classification |

    | Numerical | N/A | Regression |


    Figure 1.3 – Choosing the right type of supervised learning given the target variable


    While classification algorithms predict a class (either binary or multiple classes),
    regression algorithms predict a real number (either continuous or discrete).'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Understanding data types is important to make the right decisions on ML projects.
    We can split data types into two main categories: numerical and categorical data.
    Numerical data can then be split into continuous or discrete subclasses, while
    categorical data might refer to ordinal or nominal data:


    +   - *Numerical/discrete data* refers to individual and countable items (for
    example, the number of students in a classroom or the number of items in an online
    shopping cart).

    +   - *Numerical/continuous data* refers to an infinite number of possible measurements
    and they often carry decimal points (for example, temperature).

    +   - *Categorical/nominal data* refers to labeled variables with no quantitative
    value (for example, name or gender).

    +   - *Categorical/ordinal data* adds the sense of order to a labeled variable
    (for example, education level or employee title level).


    In other words, when choosing an algorithm for your project, you should ask yourself:
    do I have a target variable? Does it store categorical or numerical data? Answering
    these questions will put you in a better position to choose a potential algorithm
    that will solve your problem.


    However, what if you don''t have a target variable? In that case, we are facing
    unsupervised learning. Unsupervised problems do not provide labeled data; instead,
    they provide all the independent variables (or features) that will allow unsupervised
    algorithms to find patterns in the data. The most common type of unsupervised
    learning is **clustering**, which aims to group the observations of the dataset
    into different clusters, purely based on their features. Observations from the
    same cluster are expected to be similar to each other, but very different from
    observations from other clusters. Clustering will be covered in more detail in
    future chapters of this book.


    **Semi-supervised learning** is also present in the ML literature. This type of
    algorithm is able to learn from partially labeled data (some observations contain
    a label and others do not).


    Finally, another learning approach that has been taken by another class of ML
    algorithms is **reinforcement learning**. This approach rewards the system based
    on the good decisions that it has made autonomously; in other words, the system
    learns by experience.


    We have been discussing learning approaches and classes of algorithms at a very
    broad level. However, it is time to get specific and introduce the term **model**.'
