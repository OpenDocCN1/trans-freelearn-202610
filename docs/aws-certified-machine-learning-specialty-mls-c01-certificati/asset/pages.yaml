  md: '# 4

    Understanding and Visualizing Data


    Data visualization is an art! No matter how much effort you and your team put
    into data preparation and preliminary analysis for modeling, if you don''t know
    how to show your findings effectively, your audience may not understand the point
    you are trying to make.


    Often, such situations may be even worse when you are dealing with decision-makers.
    For example, if you choose the wrong set of charts to tell a particular story,
    people can misinterpret your analysis and make bad decisions.


    Understanding the different types of data visualizations and knowing how they
    fit with each type of analysis will put you in a very good position, in terms
    of engaging your audience and transmitting the information you want to.


    In this chapter, you will learn about some data visualization techniques. We will
    be covering the following topics:


    +   - Visualizing relationships in your data

    +   - Visualizing comparisons in your data

    +   - Visualizing compositions in your data

    +   - Visualizing distributions in your data'
  merge: -1
  img_proc: true
- pgno: 140
  md: '+   - Building key performance indicators

    +   - Introducing Quick Sight


    We already know why we need to master these topics, so let''s get started.


    # Visualizing relationships in your data


    When we need to show relationships in our data, we are usually talking about plotting
    two or more variables in a chart to visualize their level of dependency. A **scatter
    plot** is probably the most common type of chart to show the relationship between
    **two** variables. The following is a scatter plot for two variables, **x** and
    **y**:


    ![](img/209e007237d34506e7ba16180f2e905c_140_0.png)


    Figure 4.1 – Plotting relationships with a scatter plot


    The preceding plot shows a clear relationship between **x** and **y**. As **x**
    increases, **y** also increases. In this particular case, we can say that there
    is a linear relationship between both variables. Keep in mind that scatter plots
    may also catch other types of relationships, not only linear ones. For example,
    it would also be possible to find an exponential relationship between the two
    variables.'
  merge: -1
  img_proc: true
- pgno: 141
