    # Summary


    We have reached the end of this chapter about data visualization. Let''s take
    this opportunity to provide a quick recap of what we have learned. We started
    this chapter by showing you how to visualize relationships in your data. Scatter
    plots and bubble charts are the most important charts in this category, either
    to show relationships between two or three variables, respectively.


    Then, we moved on to another category of data visualization, which aimed to make
    comparisons in your data. The most common charts that you can use to show comparisons
    are bar charts, column charts, and line charts. Tables are also useful to show
    comparisons.


    The next use case that we covered was visualizing data distributions. The most
    common types of charts that are used to show distributions are histograms and
    box plots.


    Then, we moved on to compositions. We use this set of charts when we want to show
    the different elements that make up the data. While showing compositions, you
    must be aware of whether you want to present static data or data that changes
    over time. For static data, you should use a pie chart, a stacked 100% bar chart,
    or a treemap. For data that changes over time, you should use a stacked area chart,
    a stacked 100% area chat, a stacked column chart, or a stacked 100% column chart.


    The last section of this chapter was reserved for Quick Sight, which is an AWS
    service that you can use to visualize your data. You learned about the different
    versions and features of the service, and you were then introduced to SPICE.


    Well done! In the next chapter, you will learn about AWS''s data storing services,
