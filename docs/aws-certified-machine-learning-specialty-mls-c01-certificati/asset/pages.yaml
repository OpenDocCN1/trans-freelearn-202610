- pgno: 194
  md: '+   - Ingesting data from on-premises locations to AWS

    +   - Migrating data to AWS and extending on-premises data centers to AWS

    +   - Processing data on AWS


    # Technical requirements


    You can download the data used in the examples from GitHub, available here: https://github.com/PacktPublishing/AWS-Certified-Machine-Learning-Specialty-MLS-C01-Certification-Guide/tree/master/Chapter-6.


    # Creating ETL jobs on AWS Glue


    In a modern data pipeline, there are multiple stages, such as Generate Data, Collect
    Data, Store Data, Perform ETL, Analyze, and Visualize. In this section, we will
    cover each of these at a high level and understand the ETL (extract, transform,
    load) part in-depth:


    +   - Data can be generated from several devices, including mobile devices or
    IoT, weblogs, social media, transactional data, online games, and many more besides.

    +   - This huge amount of generated data can be collected by using polling services
    or through API gateways integrated with AWS Lambda to collect the data, or via
    streams such as AWS Kinesis or AWS-managed Kafka or Kinesis Firehose. If you have
    an on-premises database and you want to collect that data to AWS, then you choose
    AWS DMS for that. You can sync your on-premises data to Amazon S3, Amazon EFS,
    or Amazon FSx via AWS DataSync. AWS Snowball is used to collect/transfer data
    into and out of AWS.

    +   - The next step involves storing data, and we have learned some of the services
    in the previous chapter, such as AWS S3, EBS, EFS, Amazon RDS, Amazon Redshift,
    and DynamoDB.

    +   - Once we know our data storage, an ETL job can be designed to extract-transform-load
    or extract-load-transform our structured or unstructured data into our desired
    format for further analysis. For example, we can think of AWS Lambda to transform
    the data on the fly and store the transformed data into S3, or we can run a Spark
    application on an EMR cluster to transform the data and store it in S3 or Redshift
    or RDS.

    +   - There are many services available in AWS for performing an analysis on transformed
    data; for example, Amazon EMR, Amazon Athena, Amazon Redshift, Amazon Redshift
    Spectrum, and Kinesis Analytics.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   - Once the data is analyzed, you can visualize the data using AWS Quicksight
    to understand the pattern or trend. Data scientists or machine learning professionals
    would love to apply statistical analysis to understand data distribution in a
    better way. Business users use it to prepare reports. We have already learned
    various ways to present and visualize data in *Chapter 4, Understanding and Visualizing
    Data.*


    What we understood from the traditional data pipeline is that ETL is all about
    coding and maintaining code on the servers to run smoothly. If the data format
    changes in any way, then the code needs to be changed, and that results in a change
    to the target schema. If the data source changes, then the code must be able to
    handle that too and it''s an overhead. *Should we write code to recognize these
    changes in data sources? Should we need a system to adapt to the change and discover
    the data for us?* The answer is **AWS Glue**. Now, let''s understand why AWS Glue
    is so famous.


    # Features of AWS Glue


    AWS Glue is a completely managed serverless ETL service on AWS. It has the following
    features:


    +   - It automatically discovers and categorizes your data by connecting to the
    data sources and generates a data catalog.

    +   - Services such as Amazon Athena, Amazon Redshift, and Amazon EMR can use
    the data catalog to query the data.

    +   - AWS Glue generates the ETL code, which is an extension to Spark in Python
    or Scala, which can be modified, too.

    +   - It scales out automatically to match your Spark application requirements
    for running the ETL job and loading the data into the destination.


    AWS Glue has **Data Catalog**, and that''s the secret of its success. It helps
    to discover the data from data sources and lets us understand a bit about it:


    +   - Data Catalog automatically discovers new data and extracts schema definitions.
    It detects schema changes and version tables. It detects Apache Hive-style partitions
    on Amazon S3.

    +   - Data Catalog comes with built-in classifiers for popular data types. Custom
    classifiers can be written using **Grok expressions**. The classifiers help to
    detect the schema.'
  merge: -1
  img_proc: true
