- pgno: 224
  md: '# Storing the training data


    First of all, you can use multiple AWS services to prepare data for machine learning,
    such as EMR, Redshift, Glue, and so on. After preprocessing the training data,
    you should store it in S3, in a format expected by the algorithm you are using.
    The following table shows the list of acceptable data formats per algorithm:


    | Data format | Algorithm |

    | application/x-image | Object Detection Algorithm, Semantic Segmentation |

    | application/x-recordio | Object Detection Algorithm |

    | application/x-recordio-protobuf | Factorization Machines, K-means, KNN, Latent
    Dirichlet Allocation, Linear Learner, NTM, PCA, RCF, Sequence-to-Sequence |

    | application/jsonlines | BlazingText, DeepAR |

    | image/.jpeg | Object Detection Algorithm, Semantic Segmentation |

    | image/.png | Object Detection Algorithm, Semantic Segmentation |

    | text/.csv | IP Insights, K-means, KNN, Latent Dirichlet Allocation, Linear Learner,
    NTM, PCA, RCF, XGBoost |

    | text/.libsvm | XGBoost |


    Figure 7.1 – Data formats that are acceptable per AWS algorithm


    As we can see, many algorithms accept text/.csv format. Keep in mind that you
    should follow these rules if you want to use that format:


    +   - Your CSV file can''t have a header record.

    +   - For supervised learning, the target variable must be in the first column.

    +   - While configuring the training pipeline, set the input data channel as content_type
    equal to text/csv.

    +   - For unsupervised learning, set the label_size within the content_type to
    ''content_type=text/csv;label_size=0''.


    Although text/.csv format is fine for many use cases, most of the time, AWS''s
    built-in algorithms work better with recordIO-protobuf. This is an optimized data
    format that''s used to train AWS''s built-in algorithms, where SageMaker converts
    each observation in the dataset into a binary representation that''s a set of
    4-byte floats.


    RecordIO-protobuf accepts two types of input mode: pipe mode and file mode. In
    pipe mode, the data will be streamed directly from S3, which helps optimize storage.
    In file mode, the data is copied from S3 to the training instance''s store volume.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'We are almost ready! Now, let''s have a quick look at some modeling definitions
    that will help you understand some more advanced algorithms.


    # A word about ensemble models


    Before we start diving into the algorithms, there is an important modeling concept
    that you should be aware of, known as **ensemble**. The term ensemble is used
    to describe methods that use multiple algorithms to create a model.


    For example, instead of creating just one model to predict fraudulent transactions,
    you could create multiple models that do the same thing and, using a vote sort
    of system, select the predicted outcome. The following table illustrates this
    simple example:


    | Transaction | Model A | Model B | Model C | Prediction |

    |---|---|---|---|---|

    | 1 | Fraud | Fraud | Not Fraud | Fraud |

    | 2 | Not Fraud | Not Fraud | Not Fraud | Not Fraud |

    | 3 | Fraud | Fraud | Fraud | Fraud |

    | 4 | Not Fraud | Not Fraud | Fraud | Not Fraud |


    Figure 7.2 – An example of a voting system on ensemble methods


    The same approach works for regression problems, where, instead of voting, we
    could average the results of each model and use that as the final outcome.


    Voting and averaging are just two examples of ensemble approaches. Other powerful
    techniques include **blending** and **stacking**, where you can create multiple
    models and use the outcome of each model as features for a main model. Looking
    back at the preceding table, columns "Model A," "Model B," and "Model C" would
    be used as features to predict the final outcome.


    It turns out that many machine learning algorithms use ensemble methods while
    training, in an embedded way. These algorithms can be classified into two main
    categories:


    +   - **Bootstrapping Aggregation or Bagging**: With this approach, several models
    are trained on top of different samples of the data. Then, predictions are made
    through the voting or averaging system. The main algorithm from this category
    is known as **Random Forest**.

    +   - **Boosting**: With this approach, several models are trained on top of different
    samples of the data. Then, one model tries to correct the error of the next model
    by penalizing incorrect predictions. The main algorithms from this category are
    known as **Stochastic Gradient Boosting** and **AdaBoost**.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Now that you know what ensemble models are, let''s move on and study some machine
    learning algorithms that are likely to be present in your exam. Not all of them
    use ensemble approaches, but I trust it is going to be easier for you to recognize
    that.


    We will split the next few sections up based on AWS algorithm categories:


    +   - Supervised learning

    +   - Unsupervised learning

    +   - Textual analysis

    +   - Image processing


    Finally, we will provide an overview of reinforcement learning in AWS.


    # Supervised learning


    AWS provides supervised learning algorithms for general purposes (regression and
    classification tasks) and for more specific purposes (forecasting and vectorization).
    The list of built-in algorithms that can be found in these sub-categories is as
    follows:


    +   - Linear learner algorithm

    +   - Factorization machines algorithm

    +   - XGBoost algorithm

    +   - K-Nearest Neighbor algorithm

    +   - Object2Vec algorithm

    +   - DeepAR Forecasting algorithm


    Let''s start with regression models and the linear learner algorithm.


    # Working with regression models


    Okay; I know that real problems usually aren''t linear nor simple. However, looking
    into **linear regression** models is a nice way to figure out what''s going on
    inside **regression models** in general (yes, regression models can be linear
    and non-linear). This is mandatory knowledge for every data scientist and can
    help you solve real challenges as well. We''ll take a closer look at this in the
    following subsections.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Introducing regression algorithms


    Linear regression models aim to predict a numeric value (Y) according to one or
    more variables (X). Mathematically, we can define such a relationship as Y = f(X),
    where Y is known as the dependent variable and X is known as the independent variable.


    With regression models, the component that we want to predict (Y) is always a
    continuous number; for example, the price of houses or the number of transactions.
    We saw that in Chapter 1, Machine Learning Fundamentals, Table 2, when we were
    choosing the right type of supervised learning algorithm, given the target variable.
    Please, feel free to go back and review it.


    When we use just one variable to predict Y, we refer to this problem as simple
    linear regression. On the other hand, when we use more than one variable to predict
    Y, we say that we have a multiple linear regression problem.


    There is also another class of regression models, known as non-linear regression.
    However, let''s put that aside for a moment and understand what simple linear
    regression means.


    Regression models belong to the supervised side of machine learning (the other
    side is non-supervised) because algorithms try to predict values according to
    existing correlations between independent and dependent variables.


    But what does "f" mean in Y=f(X)? "f" is the regression function responsible for
    predicting Y based on X. In other words, this is the function that we want to
    figure out! When we start talking about simple linear regression, pay attention
    to the next three questions and answers:


    +   1. What is the shape of "f" in linear regression?

    +      Linear, sure!

    +   2. How can we represent a linear relationship?

    +      Using a straight line (you will understand why in a few minutes).

    +   3. So, what''s the function that defines a line?

    +      ax + b (just check any mathematics book).


    That''s it! Linear regression models are given by y = ax + b. Once we are trying
    to predict Y given X, we just need to find out the values of "a" and "b". We can
    adopt the same logic to figure out what''s going on inside other kinds of regression.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'And believe me, finding out the values of "a" and "b" isn''t the only thing
    we''re going to do. It''s nice to know that "a" is also known as the **alpha coefficient**,
    or **slope**, and represents the line''s inclination, while "b" is also known
    as the **beta coefficient**, or **y-intercept**, and represents the place where
    the line crosses the y-axis (into a two-dimensional plan consisting of x and y).
    You will see these two terms in the next subsection.


    It''s also nice to know that there is an error associated with every predictor
    that we don''t have control. Let''s name it "e" and formally define simple linear
    regression as **y = a x + b + e**. Mathematically, this error is expressed by
    the difference between the prediction and the real value.


    Alright, let''s find alpha and beta and give this section a happy ending!


    # Least square method


    There are different ways to find the slope and y-intercept of a line, but the
    most used method is known as the **least square method**. The principle behind
    this method is simple: we have to find the *best line that reduces the sum of
    squared error.*


    In the following graph, we can see a Cartesian plane with multiple points and
    lines in it. "Line a" represents the best fit for this data – in other words,
    that would be the best linear regression function for those points. But how do
    I know that? It''s simple: if we compute the error associated with each point
    (like the one we''ve zoomed in on in the following graph), we will realize that
    "line a" contains the least sum of square errors:


    ![](img/209e007237d34506e7ba16180f2e905c_228_0.png)


    Figure 7.3 – Visualizing the principle of the least square method'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'It is worth understanding linear regression from scratch, not only for the
    certification exam but mainly for your career as a data scientist. To provide
    you with a complete example, we have developed a spreadsheet containing all the
    calculations that we are going to see, step by step! We encourage you to jump
    on this support material and perform some simulations. Let''s see this in action.


    # Creating a linear regression model from scratch


    We are going to use a very simple dataset, with only two variables:


    +   - X: Represents the person''s number of years of work experience

    +   - Y: Represents the person''s average salary


    We want to understand the relationship between X and Y and, if possible, predict
    the salary (Y) based on years of experience (X). As I mentioned previously, often,
    real problems have far more independent variables and are not necessarily linear.
    However, I am sure this example will give you the baseline knowledge to master
    more complex algorithms.


    To find out what the alpha and beta coefficients are (or slope and y-intercept,
    if you prefer), we need to find some statistics related to the dataset, so let''s
    take a look at the data and the auxiliary statistics shown here:


    | X (INDEPENDENT) | Y (DEPENDENT) | X MEAN | Y MEAN | COVARIANCE (X,Y) | X VARIANCE
    | Y VARIANCE |

    |---|---|---|---|---|---|---|

    | 1 | 1,000 |  |  | 21,015 | 20 | 21,808,900 |

    | 2 | 1,500 |  |  | 14,595 | 12 | 17,388,900 |

    | 3 | 3,700 |  |  | 4,925 | 6 | 3,880,900 |

    | 4 | 5,000 |  |  | 1,005 | 2 | 448,900 |

    | 5 | 4,000 |  |  | 895 | 0 | 2,788,900 |

    | 6 | 6,500 |  |  | 145 | 0 | 688,900 |

    | 7 | 7,000 |  |  | 1,995 | 2 | 1,768,900 |

    | 8 | 9,000 |  |  | 8,325 | 6 | 11,088,900 |

    | 9 | 9,000 |  |  | 11,655 | 12 | 11,088,900 |

    | 10 | 10,000 |  |  | 19,485 | 20 | 18,748,900 |

    | COUNT | 10 | 550 | 567,000 | 842,500 | 825 | 897,010,000 |


    Figure 7.4 – Dataset to predict average salary based on amount of work experience'
  merge: -1
