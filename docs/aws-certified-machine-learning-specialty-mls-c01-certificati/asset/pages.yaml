- pgno: 178
  md: '# Securing S3 objects at rest and in transit


    In the previous section, we learned about bucket default encryption, which is
    completely different from object-level encryption. Buckets are not encrypted,
    whereas objects are. A question may arise here: *what is bucket default encryption?*
    We will learn these concepts in this section. Data during transmission can be
    protected by using **Secure Socket Layer (SSL)** or **Transport Layer Security
    (TLS)** for the transfer of the HTTPS requests. The next step is to protect the
    data, where the authorized person can encode and decode the data.


    It is possible to have different encryption settings on different objects in the
    same bucket. S3 supports **Client-Side Encryption (CSE)** and **Server-Side Encryption
    (SSE)** for objects at rest:


    +   - **Client-Side Encryption:** A client uploads the object to S3 via the S3
    endpoint. In CSE, the data is encrypted by the client before uploading to S3.
    Although the transit between the user and the S3 endpoint happens in an encrypted
    channel, the data in the channel is already encrypted by the client and can’t
    be seen. In transit, encryption takes place by default through HTTPS. So, AWS
    S3 stores the encrypted object and cannot read the data in any format at any point
    in time. In CSE, the client takes care of encrypting the object content. So, control
    stays with the client in terms of key management and the encryption-decryption
    process. This leads to a huge amount of CPU usage. S3 is only used for storage.


    +   - **Server-Side Encryption:** A client uploads the object to S3 via the S3
    endpoint. Even though the data in transit is through an encrypted channel that
    uses HTTPS, the objects themselves are not encrypted inside the channel. Once
    the data hits S3, then it is encrypted by the S3 service. In SSE, you trust S3
    to perform encryption-decryption, object storage, and key management. There are
    three types of SSE techniques available for S3 objects:


    +   a) SSE-C

    +   b) SSE-S3

    +   c) SSE-KMS'
  merge: -1
  img_proc: true
- pgno: 179
  md: '+   - **Server-Side Encryption with Customer-Provided Keys (SSE-C)**: With
    SSE-C, the user is responsible for the key that is used for encryption and decryption.
    S3 manages the encryption and decryption process. In CSE, the client handles the
    encryption-decryption process, but in SSE-C, S3 handles the cryptographic operations.
    This potentially decreases the CPU requirements for these processes. The only
    overhead here is to manage the keys. Ideally, when a user is doing a PUT operation,
    the user has to provide a key and an object to S3. S3 encrypts the object using
    the key provided and attaches the hash (a cipher text) to the object. As soon
    as the object is stored, S3 discards the encryption key. This generated hash is
    one-way and cannot be used to generate a new key. When the user provides a GET
    operation request along with the decryption key, the hash identifies whether the
    specific key was used for encryption. Then, S3 decrypts and discards the key.

    +   - **Server-Side Encryption with Amazon S3-Managed Keys (SSE-S3)**: With SSE-S3,
    AWS handles both the management of the key and the process of encryption and decryption.
    When the user uploads an object using a PUT operation, the user just provides
    the unencrypted object. S3 creates a master key to be used for the encryption
    process. No one can change anything on this master key as this is created, rotated
    internally, and managed by S3 end to end. This is a unique key for the object.
    It uses the AES-256 algorithm by default.

    +   - **Server-Side Encryption with Customer Master Keys stored in AWS Key Management
    Service (SSE-KMS)**: AWS Key Management Service (KMS) manages the Customer Master
    Key (CMK). AWS S3 collaborates with AWS KMS and generates an AWS-managed CMK.
    This is the default master key used for SSE-KMS. Every time an object is uploaded,
    S3 uses a dedicated key to encrypt that object and that key is a Data Encryption
    Key (DEK). The DEK is generated by KMS using the CMK. S3 is provided with both
    a plain-text version and an encrypted version of the DEK. The plain-text version
    of DEK is used to encrypt the object and then discarded. The encrypted version
    of DEK is stored along with the encrypted object. When you''re using SSE-KMS,
    it is not necessary to use the default CMK that is created by S3. You can create
    and use a customer managed CMK, which means you can control the permission on
    it as well as the rotation of the key material. So, if you have a regulatory board
    in your organization that is concerned with rotation of the key or the separation
    of roles between encryption users and decryption users, then SSE-KMS is the solution.
    Logging and auditing is also possible on SSE-KMS to track the API calls made against
    keys.

    +   - **Bucket Default Encryption:** If we set AES-256 while creating a bucket,
    or we enable it after creating a bucket, then SSE-S3 would be used when you don''t
    set something at object level while performing a PUT operation.


    In the next section, we will learn about some of the data stores used with EC2
    instances.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Using other types of data stores


    **Elastic Block Store (EBS)** is used to create volumes in an availability zone.
    The volume can only be attached to an EC2 instance in the same availability zone.
    Amazon EBS provides both **SSD (Solid State Drive)** and **HDD (Hard Disk Drive)**
    types of volumes. For SSD-based volumes, the dominant performance attribute is
    **IOPS (Input Output Per Second)**, and for HDD it is throughput, which is generally
    measured as MiB/s. The following table shown in *Figure 5.3* provides an overview
    of the different volumes and types:


    | Volume Types | Use cases |

    |---|---|

    | General Purpose SSD (gp2) | Useful for maintaining balance between price and
    performance. Good for most workloads, system boot volumes, dev, and test environments.
    |

    | Provisioned IOPS SSD (io2, io1) | Useful for mission-critical, high-throughput
    or low-latency workloads. For example, I/O intensive database workloads like MongoDB,
    Cassandra, Oracle |

    | Throughput Optimized HDD (st1) | Useful for frequently accessed, throughput-intensive
    workloads. For example, big data processing, data warehouses, log processing |

    | Cold HDD (sc1) | Useful for less frequently accessed workloads. |


    Figure 5.3 – Different volumes and their use cases


    **EBS** is resilient to an availability zone (AZ). If, for some reason, an AZ
    fails, then the volume cannot be accessed. To avoid such scenarios, **snapshots**
    can be created from the EBS volumes and snapshots are stored in S3. Once the snapshot
    arrives at S3, the data in the snapshot becomes region-resilient. The first snapshot
    is a full copy of data on the volume and, from then onward, snapshots are incremental.
    Snapshots can be used to clone a volume. As the snapshot is stored in S3, a volume
    can be cloned in any AZ in that region. Snapshots can be shared between regions
    and volumes can be cloned from them during disaster recovery.


    AWS KMS manages the CMK. AWS KMS uses an AWS-managed CMK for EBS, or AWS KMS can
    use a customer-managed CMK. CMK is used by EBS when an encrypted volume is created.
    CMK is used to create an encrypted DEK, which is stored with the volume on the
    physical disk. This DEK can only be decrypted using KMS, assuming the entity has
    access to decrypt. When a snapshot is created from the encrypted volume, the snapshot
    is encrypted with the same DEK. Any volume created from this snapshot also uses
    that DEK.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '**Instance Store** volumes are the block storage devices physically connected
    to the EC2 instance. They provide the highest performance, as the **ephemeral
    storage** attached to the instance is from the same host where the instance is
    launched. EBS can be attached to the instance at any time, but the instance store
    must be attached to the instance at the time of its launch; it cannot be attached
    later, once the instance is launched. If there is an issue on the underlying host
    of an EC2 instance, then the same instance will be launched on another host with
    a new instance store volume and the earlier instance store (ephemeral storage)
    and older data is lost. The size and capabilities of the attached volumes depend
    on the instance types and can be found in more detail here: https://aws.amazon.com/ec2/instance-types/.


    **Elastic File System (EFS)** provides a network-based filesystem that can be
    mounted within Linux EC2 instances and can be used by multiple instances at once.
    It is an implementation of **NFSv4**. It can be used in general-purpose mode,
    max I/O performance mode (for scientific analysis or parallel computing), bursting
    mode, and provisioned throughput mode.


    As we know, in the case of instance stores, the data is volatile. As soon as the
    instance is lost, the data is lost from the instance store. That is not the case
    for EFS. EFS is separate from the EC2 instance storage. EFS is a file store and
    is accessed by multiple EC2 instances via mount targets inside a VPC. On-premises
    systems can access EFS storage via hybrid networking to the VPC, such as **VPN**
    or **Direct Connect**. EFS also supports two types of storage classes: Standard
    and Infrequent Access. Standard is used for frequently accessed data. Infrequent
    Access is the cost-effective storage class for long-lived, less frequently accessed
    data. Life cycle policies can be used for the transition of data between storage
    classes.


    **Important note**

    An instance store is preferred for max I/O requirements and if the data is replaceable
    and temporary.


    # Relational Database Services (RDSes)


    This is one of the most commonly featuring exam topics in AWS exams. You should
    have sufficient knowledge prior to the exam. In this section, we will learn about
    Amazon''s RDS.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'AWS provides several relational databases as a service to its users. Users
    can run their desired database on EC2 instances, too. The biggest drawback is
    that the instance is only available in one availability zone in a region. The
    EC2 instance has to be administered and monitored to avoid any kind of failure.
    Custom scripts will be required to maintain a data backup over time. Any database
    major or minor version update would result in downtime. Database instances running
    on an EC2 instance cannot be easily scaled if the load increases on the database
    as replication is not an easy task.


    RDS provides managed database instances that can themselves hold one or more databases.
    Imagine a database server running on an EC2 instance that you do not have to manage
    or maintain. You need only access the server and create databases in it. AWS will
    manage everything else, such as the security of the instance, the operating system
    running on the instance, the database versions, and high availability of the database
    server. RDS supports multiple engines such as MySQL, Microsoft SQL Server, MariaDB,
    Amazon Aurora, Oracle, and PostgreSQL. You can choose any of these based on your
    requirements.


    The foundation of Amazon RDS is a database instance, which can support multiple
    engines and can have multiple databases created by the user. One database instance
    can be accessed only by using the database CNAME (CNAME is an alias for a canonical
    name in a domain name system database) of the primary instance. RDS uses standard
    database engines. So, accessing the database using some sort of tool in a self-managed
    database server is the same as accessing Amazon RDS.


    As we have now understood the requirements of Amazon RDS, let''s understand the
    failover process in Amazon RDS. We will cover what services Amazon offers if something
    goes wrong with the RDS instance.


    # Managing failover in Amazon RDS


    RDS instances can be single-AZ or multi-AZ. In multi-AZ, multiple instances work
    together, similar to an active-passive failover design.


    For a single-AZ RDS instance, storage can be allocated for that instance to use.
    In a nutshell, a single-AZ RDS instance has one attached block store (EBS storage)
    available in the same availability zone. This makes the databases and the storage
    of the RDS instance vulnerable to availability zone failure. The storage allocated
    to the block storage can be SSD (gp2 or io1) or magnetic. To secure the RDS instance,
    it is advised to use a security group and provide access based on requirements.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Multi-AZ is always the best way to design the architecture to avoid any failure
    and keep the applications highly available. With multi-AZ features, a standby
    replica is kept in sync **synchronously** with the primary instance. The standby
    instance has its own storage in the assigned availability zone. A standby replica
    cannot be accessed directly, because all RDS access is via a single database CNAME.
    You can''t access the standby unless a failover happens. The standby provides
    no performance benefit, but it does constitute an improvement in terms of availability
    of the RDS instance. It can only happen in the same region, another AZ''s subnet
    in the same region inside the VPC. When a multi-AZ RDS instance is online, you
    can take a backup from the standby replica without affecting the performance.
    In a single-AZ instance, availability and performance issues can be significant
    during backup operation.


    To understand the workings of multi-AZ, let''s take an example of a single-AZ
    instance and expand it to multi-AZ.


    Imagine you have an RDS instance running in availability zone AZ-A of the us-east-1
    region inside a VPC named db-vpc. This becomes a primary instance in a single-AZ
    design of an RDS instance. In this case, there will be storage allocated to the
    instance in the AZ-A availability zone. Once you opt for multi-AZ deployment in
    another availability zone called AZ-B, AWS creates a standby instance in availability
    zone AZ-B of the us-east-1 region inside the db-vpc VPC and allocates storage
    for the standby instance in AZ-B of the us-east-1 region. Along with that, RDS
    will enable **synchronous replication** from the primary instance to the standby
    replica. As we have learned earlier, the only way to access our RDS instance is
    via the database CNAME, hence, the access request goes to the RDS primary instance.
    As soon as a write request comes to the endpoint, it writes to the primary instance.
    Then it writes the data to the hardware, which is the block storage attached to
    the primary instance. At the same time, the primary instance replicates the same
    data to the standby instance. Finally, the standby instance commits the data to
    its block storage.


    The primary instance writes the data into the hardware and replicates the data
    to the standby instance in parallel, so there is a minimal time lag (almost nothing)
    between the data commit operations in their respective hardware. If an error occurs
    with the primary instance, then RDS detects this and changes the database endpoint
    to the standby instance. The clients accessing the database may experience a very
    short interruption with this. This failover occurs within 60-120 seconds. It does
    not provide a fault-tolerant system because there will be some impact during the
    failover operation.


    You should now understand failover management on Amazon RDS. Let''s now learn
    about taking automatic RDS backup, using snapshots to restore in the event of
    any failure, and read replicas in the next section.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Taking automatic backup, RDS snapshots, and restore and read replicas


    In this section, we will see how RDS Automatic Backup and Manual Snapshots work.
    These features come with Amazon RDS.


    Let''s consider a database that is scheduled to take a backup at 5 A.M. every
    day. If the application fails at 11 A.M., then it is possible to restart the application
    from the backup taken at 11 A.M. with the loss of 6 hours'' worth of data. This
    is called 6 hours RPO (Recovery Point Objective). So, RPO is defined as the time
    between the most recent backup and the incident and this defines the amount of
    data loss. If you want to reduce this, then you have to schedule more incremental
    backups, which increases the cost and backup frequency. If your business demands
    a lower RPO value, then the business must spend more on meeting the technical
    solutions.


    Now, according to our example, an engineer was assigned this task to bring the
    system online as soon as the disaster occurred. The engineer managed to bring
    the database online at 2 P.M. on the same day by adding a few extra hardware components
    to the current system and installed some updated versions of the software. This
    is called 3 hours RTO (Recovery Time Objective). So, RTO is determined as the
    time between the disaster recovery and full recovery. RTO values can be reduced
    by having spare hardware and documenting the restoration process. If the business
    demands a lower RTO value, then your business must spend more money on spare hardware
    and effective system setup to perform the restoration process.


    In RDS, RPO and RTO play an important role in the selection of Automatic Backups
    and Manual Snapshots. Both of these backup services use AWS-managed S3 buckets,
    which means it cannot be visible in the user''s AWS S3 console. It is region-resilient
    because the backup is replicated into multiple availability zones in the AWS region.
    In case of a single-AZ RDS instance, the backup happens from the single available
    data store, and for a multi-AZ enabled RDS instance, the backup happens from the
    standby data store (the primary store remains untouched as regards the backup).'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'The snapshots are manual against RDS instances and these are stored in the
    AWS-managed S3 bucket. The first snapshot of an RDS instance is a full copy of
    the data and the onward snapshots are incremental, reflecting the change in the
    data. In terms of the time taken for the snapshot process, it is higher for the
    first one and, from then on, the incremental backup is quicker. When any snapshot
    occurs, it can impact the performance of the single-AZ RDS instance, but not the
    performance of a multi-AZ RDS instance as this happens on the standby data storage.
    Manual snapshots do not expire, have to be cleared automatically, and they live
    past the termination of an RDS instance. When you delete an RDS instance, it suggests
    making one final snapshot on your behalf and it will contain all the databases
    inside your RDS instance (there is not just a single database in an RDS instance).
    When you restore from a manual snapshot, you restore to a single point in time
    and that affects the RPO.


    To automate this entire process, you can choose a time window when these snapshots
    can be taken. This is called automatic backups. These time windows can be managed
    wisely to essentially lower the RPO value of the business. Automatic backups have
    a retention period of 0 to 35 days, with 0 being disabled and the maximum is 35
    days. To quote AWS documentation, retained automated backups contain system snapshots
    and transaction logs from a database instance. They also include database instance
    properties such as allocated storage and a database instance class, which are
    required to restore it to an active instance. Databases generate transaction logs,
    which contain the actual change in data in a particular database. These transaction
    logs are also written to S3 every 5 minutes by RDS. Transaction logs can also
    be replayed on top of the snapshots to restore to a point in time of 5 minutes''
    granularity. Theoretically, the RPO can be a 5-minute point in time.


    When you perform a restore, RDS creates a new RDS instance, which means a new
    database endpoint to access the instance. The applications using the instances
    have to point to the new address, which significantly affects the RTO. This means
    that the restoration process is not very fast, which affects the RTO. To minimize
    the RTO during a failure, you may consider replicating the data. With replicas,
    there is a high chance of replicating the corrupted data. The only way to overcome
    this is to have snapshots and an RDS instance can be restored to a particular
    point in time prior to the corruption. Amazon RDS Read Replicas are unlike the
    multi-AZ replicas. In multi-AZ RDS instances, the standby replicas cannot be used
    directly for anything unless a primary instance fails, whereas Read Replicas can
    be used directly, but only for read operations. Read replicas have their own database
    endpoints and read-heavy applications can directly point to this address. They
    are kept in sync asynchronously with the primary instance. Read replicas can be
    created in the same region as the primary instance or in a different region. Read
    replicas in other regions are called Cross-Region Read Replicas and this improves
    the global performance of the application.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'As per AWS documentation, five direct read replicas are allowed per database
    instance and this helps to scale out the read performances. Read replicas have
    a very low RPO value due to asynchronous replication. They can be promoted to
    a read-write database instance in the case of a primary instance failure. This
    can be done quickly and it offers a fairly low RTO value.


    In the next section, we will learn about Amazon''s own database engine, Amazon
    Aurora.


    # Writing to Amazon Aurora with multi-master capabilities


    Amazon Aurora is the most reliable relational database engine developed by Amazon
    to deliver speed in a simple and cost-effective manner. Aurora uses a cluster
    of single primary instances and zero or more replicas. Aurora''s replicas can
    give you the advantage of both read replicas and multi-AZ instances in RDS. Aurora
    uses a shared cluster volume for storage and is available to all compute instances
    of the cluster (a maximum of 64 TiB). This allows the Aurora cluster to provision
    faster and improves availability and performance. Aurora uses SSD-based storage,
    which provides high IOPS and low latency. Aurora does not ask you to allocate
    storage, unlike other RDS instances; it is based on the storage that you use.


    Aurora clusters have multiple endpoints, including **Cluster Endpoint** and **Reader
    Endpoint**. If there are zero replicas, then the cluster endpoint is the same
    as the reader endpoint. If there are replicas available, then the reader endpoint
    is load balanced across the reader endpoints. Cluster endpoints are used for reading/writing,
    while reader endpoints are intended for reading from the cluster. If you add more
    replicas, then AWS manages load balancing under the hood for the new replicas.


    When failover occurs, the replicas are promoted to read/write mode and this takes
    some time. This can be avoided in a **Multi-Master** mode of an Aurora cluster.
    This allows multiple instances to perform reads and writes at the same time.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Storing columnar data on Amazon Redshift


    Amazon Redshift is not used for real-time transaction use, but it is used for
    data warehouse purposes. It is designed to support huge volumes of data at a petabyte
    scale. It is a column-based database used for analytics purpose, long-term processing,
    tending, and aggregation. **Redshift Spectrum** can be used to query data on S3
    without loading data to the Redshift cluster (a Redshift cluster is required though).
    It''s not an OLTP, but an OLAP. **AWS QuickSight** can be integrated with Redshift
    for visualization, with a SQL-like interface that allows you to connect using
    JDBC/ODBC connections for querying the data.


    Redshift uses a clustered architecture in one AZ in a VPC with faster network
    connectivity between the nodes. It is not high availability by design as it is
    tightly coupled to the AZ. A Redshift cluster has a **Leader Node**, and this
    node is responsible for all the communication between the client and the computing
    nodes of the cluster, query planning, and aggregation. **Compute Nodes** are responsible
    for running the queries submitted by the leader lode and for storing the data.
    By default, Redshift uses a public network for communicating with external services
    or any AWS services. With **Enhanced VPC Routing**, it can be controlled via customized
    networking settings.


    # Amazon DynamoDB for NoSQL database as a service


    Amazon DynamoDB is a NoSQL database-as-a-service product within AWS. It''s a fully
    managed key/value and document database. Accessing DynamoDB is easy via its endpoint.
    The input and output throughputs can be managed or scaled manually or in automatic
    fashion. It also supports data backup, point-in-time recovery, and data encryption.
    We will not cover the DynamoDB table structure or key structure in this chapter
    as this is not required for the certification exam. However, it is good to have
    a basic knowledge of them. For more details, please refer to the AWS docs available
    here: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SQLtoNoSQL.html.'
  merge: -1
  img_proc: true
