- pgno: 53
  md: 'These examples show that in version 5.0, the bus configuration is created as
    an object and configuration values are added to the instance of the object. The
    bus configuration can be passed to functions as a configuration to be utilized
    over and over for reuse of the bus configuration.


    Other features that have been extended in NServiceBus in the newer versions also
    include the addition of NSB packages. One such package is `NServiceBus.NLog`,
    which is specific to using NLog in NSB version 5.0 and above. This is used to
    extend the logging capabilities of NSB to log further information as it applies
    to endpoints, messages, and services. Working with the `NServiceBus.NLog` package
    has been detailed in `http://docs.particular.net/nservicebus/logging-in-nservicebus`.
    We will demonstrate the code''s use further in this chapter.


    # The saga workflow


    The purpose of the saga is to provide workflow. It provides the persistence of
    the saga data so that a message can return to the saga and have a point of reference
    to the original messages.


    The source code in this section is in the *CreditCardApproval – v5* section. It
    was compiled in Visual Studio 2012 using NSB Version 5.0. The projects will appear
    as the following:


    ![](img/8188651cea6a881a16242b395a81399a_53_0.png)


    Here we have the following projects:


    +   - `AppCommon`: This contains the ViewModel and Context for the Windows forms.

    +   - `AppForAccountingDept`: This receives a purchase order number related to
    the approval of the credit card.

    +   - `CreditCardApproval`: This approves the credit card.

    +   - `CreditCardSubmit`: This submits the credit card for approval.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# NServiceBus Saga Architecture


    +   - `CreditCardMessages`: This contains the common messages for the projects.

    +   - `CreditCardSaga`: This is the credit card saga that directs the workflow
    and message routing by using message handling and saga data.


    The flow of the messages, which does all the work (thus, workflow), will start
    with the `CreditCardSubmit` project. This form will submit a credit card to the
    saga, which will save its state and forward it to the `CreditCardApproval` project.
    The `CreditCardApproval` form will either approve or deny the card and send the
    response back to the saga. The saga will retrieve the previous message and pass
    it back to the `CreditCardSubmit` form, and if approved, will send it to the `AppForAccountingDept`
    project. The message flow will appear as follows:


    ![](img/8188651cea6a881a16242b395a81399a_54_0.png)


    This is a very simplistic workflow as it keeps track of whether a credit card
    is approved or not. By making the saga data persistent, it allows the persistence
    of the saga data state to route the messages and manage the message information
    at a single point. The saga data will contain the required ID, originator, and
    `OriginalMessageId`, to ensure a response to the original client. These fields
    ensure that the return is always available. We see these fields in the following
    diagram:'
  merge: -1
  img_proc: true
- pgno: 55
  md: "![](img/8188651cea6a881a16242b395a81399a_55_0.png)\n\nThe saga data is stored\
    \ by using the IContainSagaData interface. Even if the three fields are not explicitly\
    \ defined, the IContainSagaData interface will define them in storage. Do not\
    \ modify these fields as NServiceBus uses them. The primary key is another field\
    \ that is used in all sagas to look up the saga data from the message. In this\
    \ case, we use the RequestId that will always contain a unique value from the\
    \ [Unique] annotation. We can see this in the following code:\n\n```\npublic class\
    \ CreditCardRequestData : IContainSagaData\n{\n    /***\n    * Gets/sets the Id\
    \ of the process. Do NOT generate this value in your code.\n    The value of the\
    \ Id will be generated automatically to provide the\n    best performance for\
    \ saving in a database.\n    * ***/\n    public Guid Id { get; set; } // Required\n\
    \    /***\n    * Contains the return address of the endpoint that caused the process\
    \ to run.\n    * ***/\n    public string Originator { get; set; } //Required\n\
    \    /***\n    * Contains the Id of the message which caused the saga to start.\n\
    \    This is needed so that when we reply to the Originator, any\n    registered\
    \ callbacks will be fired correctly.\n    * ***/\n    public string OriginalMessageId\
    \ { get; set; } //Required\n\n    [Unique]\n    public Guid RequestId { get; set;\
    \ } // Unique ID to lookup Request message\n    public string Card { get; set;\
    \ }\n    public decimal Cost { get; set; }\n    public bool RequiresApproval {\
    \ get; set; }\n    public bool Approved { get; set; }\n}\n```"
  merge: -1
