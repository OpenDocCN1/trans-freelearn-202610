- pgno: 111
  md: 'Using NSB with WCF integration is similar but different from using straight
    WCF. In WCF, there are four basic steps that can be extended. Visit http://www.c-sharpcorner.com/UploadFile/dhananjaycoder/four-steps-to-create-first-wcf-service-for-beginners/
    for more information.


    These steps to create a WCF server are as follows:


    +   1. Create a service contract. This defines the available functions between
    the WCF client and the WCF server through interfaces.

    +   2. Expose endpoints with metadata — through either App.config or Web.config.
    We expose the endpoints through the configuration to include how the exchange
    of data will occur.

    +   3. Implement the service. That is, we add functionality and data objects to
    the interfaces.

    +   4. Consume the service. Or, in other words, expose the service to be imported
    into a WCF client.


    In using NSB with NHibernate, NSB takes care of the mapping of NHibernate with
    the messages, endpoints, and services. In WCF integration, NSB also takes care
    of many of the service contracts with the use of the message handler and the message
    format.


    We can observe these features pieces in the following screenshot and we will discuss
    them further:


    ![](img/8188651cea6a881a16242b395a81399a_111_0.png)


    We will add the messages next.'
  merge: -1
  img_proc: true
