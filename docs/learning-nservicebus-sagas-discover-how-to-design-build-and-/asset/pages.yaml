    \ following code:\n\n```\n<UnicastBusConfig ForwardReceivedMessagesTo=\"MyAudits\"\
    >\n  <MessageEndpointMappings>\n    <add Endpoint=\"CreditCardSaga\" Messages=\"\
    CreditCardMessages.SubmitRequestCommand, CreditCardMessages\" />\n    <add Endpoint=\"\
    CreditCardSaga\" Messages=\"CreditCardMessages.IRequestExpiredEvent, CreditCardMessages\"\
    \ />\n  </MessageEndpointMappings>\n</UnicastBusConfig>\n```\n\nWe can view the\
