- pgno: 119
  md: "There are service tracing utilities within WCF to view graphs, messages, network\
    \ calls, exceptions, and activities of WCF web services and web clients. Please\
    \ refer to http://msdn.microsoft.com/en-us/library/ms732023(v=vs.110).aspx for\
    \ more information on Microsoft Service Trace Viewer.\n\nWe can capture the messages\
    \ between a client and a server by setting the diagnostic sections (given as <diagnostics/>)\
    \ in the App.config file to capture these messages, and also by setting the listeners\
    \ and sources, which will be associated with the libraries, to log events in the\
    \ App.config file, as shown here:\n\n```\n<AuditConfig QueueName=\"audit\" />\n\
    <system.serviceModel>\n    <diagnostics>\n        <messagelogging logEntireMessage=\"\
    true\" logMalformedMessages=\"false\" logMessagesAtServiceLevel=\"true\" logMessagesAtTransportLevel=\"\
    true\" maxMessagesToLog=\"30000\" maxSizeOfMessageToLog=\"30000\" />\n       \
    \ <endToEndTracing activityTracing=\"true\" messageFlowTracing=\"true\" />\n \
    \   </diagnostics>\n    <behaviors>\n        <serviceBehaviors>\n            <behavior\
    \ name=\"Default\">\n                <serviceMetadata httpGetEnabled=\"true\"\
    \ />\n                <serviceDebug includeExceptionDetailInFaults=\"true\" />\n\
    \            </behavior>\n        </serviceBehaviors>\n    </behaviors>\n    <services>\n\
    \        <service name=\"WCFServer.WebServices.PayService\" behaviorConfiguration=\"\
    Default\">\n            <endpoint address=\"mex\" binding=\"mexHttpBinding\" contract=\"\
    IMetadataExchange\" />\n            <host>\n                <baseAddresses>\n\
    \                    <add baseAddress=\"http://localhost:9009/services/paymessage\"\
    \ />\n                </baseAddresses>\n            </host>\n        </service>\n\
    \    </services>\n</system.serviceModel>\n</configuration>\n```"
