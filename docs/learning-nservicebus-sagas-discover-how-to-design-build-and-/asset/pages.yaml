- pgno: 14
  md: '+   - Workflow retries: Messages, or endpoints, can be told to retry a number
    of times until they completely fail and send an error. The error is automated
    to return to an error queue. For instance, a web service message can be sent to
    a bank, and it can be set to retry the web service every 5 minutes for 20 minutes
    before giving up completely. This is useful during any network or server issues.

    +   - Monitoring: NSB ServicePulse can keep a finger on the pulse of its services.
    Other monitoring can easily be done on the NSB queues to report on the number
    of messages.

    +   - Encryption: Messages between services and endpoints can be easily encrypted.

    +   - High availability: Multiple services or subscribers could be processing
    the same or similar messages from various services that are living on different
    servers. When one server, or service, goes down, others could be made available
    to take over those that are already running. Sagas are at the heart of the NServiceBus
    (NSB) workflow. Sagas save the message state in the form of saga data. They can
    retrieve the data as it is related to a message to update the message or data.
    This allows the NSB workflow to control the flow of data and messaging from end
    to end and correlate saved data to messages in the saga.


    Messages are the means to transfer interaction and data between services in a
    service-oriented architecture (SOA). Sagas correlate, save, route, and manage
    processes that are started by these messages between services. Sagas even provide
    timeouts to ensure that messages do not live forever in a system.


    Sagas provide decoupling between frontend websites and backend processes. It allows
    workflow to transfer so that a website can continue to do its work without having
    to wait for processes to return, such as the dreaded message "Please do not refresh
    this website as we bill your credit card".


    NSB doesn''t stop at development on Windows servers and desktops, but plays a
    big part in cloud development, for example with Microsoft Azure and the Microsoft
    cloud. NSB uses Service Bus as well as storage queues, SQL Server, and other storage
    containers. As the cloud is used more and more, NSB plays a key part in Software
    as a Service, as it is the premier framework for ESB in the C# clouds.


    Even if your cloud solution doesn''t end up being a C# compatible cloud, as many
    might hide the software running behind the cloud as being preparatory, NSB is
    a component for those that will do hybrid solutions, such as keeping data resident
    on-site. The connection to the cloud then will likely be via web services, and
    NSB sagas might likely provide the workflow to those web services.'
  merge: -1
  img_proc: true
