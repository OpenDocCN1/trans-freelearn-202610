  md: '+   - Creating a WCF client

    +     - Adding the service reference

    +     - Calling the reference

    +   - Revisiting the design

    +   - Adding the service reference

    +     - Calling the reference

    +   - Adding NServiceBus to MVC

    +     - Message handler unit testing

    +     - Saga handler unit testing

    +   - RabbitMQ for NSB

    +   - ActiveMQ for NSB


    # A brief overview of ASP.NET MVC


    **Model-View-Controller (MVC)** is the most common design pattern for implementing
    user interfaces. ASP.NET MVC is the Microsoft framework to implement the MVC software
    design pattern in ASP.NET. Developing by reusing known design patterns and frameworks
    that have been justified and tested by others brings a lot of reusability of known
    quantities into any application.


    By breaking up the logic into controllers, which have the `session`, `request`,
    and `response` helper functions, while passing the models, which are the View
    Models which have the information which we want to present into the view, it moves
    most of the logic and exposure away from the browser where APIs can be exposed.
    We will also use Microsoft Entity Framework (EF) for many of the model objects.


    Microsoft recommends using **Language Integrated Query (LINQ)** and EF to prevent
    traditional SQL injection attacks. The web page at https://msdn.microsoft.com/en-in/library/bb308959.aspx
    also discusses other security measures that can be done in EF. EF does not mitigate
    all injection attacks (such as EF injections) but, using a combination of EF and
    LINQ correctly, it will mitigate many common SQL injection attacks. The reasoning
    here is that the injection can now only occur through LINQ and the EF objects
    rather than any open SQL commands, thus narrowing the attack surface from a wide
    range of commands to an object, and through a collection that may only be accessed
    through a controller in MVC. There are many scripting tools running on the Internet,
    such as SQLNinja. Visit http://sqlninja.sourceforge.net/ to find any insecure
    SQL command.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'However, most tools are not built to signal EF attack vectors. Please visit
    http://www.slideshare.net/rhelton_1/sql-injection-amp-entity-frameworks for more
    information on this.


    There are many more reasons to use an object-relationship mapper (ORM), such as
    EF, as we can see in http://karwin.blogspot.com/2009/01/why-should-you-use-orm.html.
    Some of these reasons include the following:


    +   - **Generating boilerplate code**: EF generates objects from the SQL Server
    databases and tables, thus creating boilerplate code that can be used to create,
    update, read, and delete the fields in the tables.

    +   - **Supporting OO**: EF objects support common object-oriented programming
    design and methodology that is easy as PIE (polymorphism-encapsulation-inheritance),
    and to include reusability.

    +   - **Speeding development**: Generating code from a database and using it in
    an application can be significantly faster than creating custom code from scratch.
    We can see the interaction of the MVC components in the following diagram:


    ![](img/8188651cea6a881a16242b395a81399a_107_0.png)


    So, why is this discussion on MVC-EF in an NSB book? That''s because most of the
    official NSB examples are using MVC. We will be looking at some examples that
    we have extended in MVC to include Microsoft''s best practices of EF and WCF.


    In order to view tables and queues related to tables, we use the Kendo grids.
    Packt publishing offers many books on Kendo, such as Kendo UI Grid (http://www.packtpub.com/kendo-ui-grid/book).
    Some of the Kendo examples are also extended from files available at http://www.codeproject.com/Articles/606682/Kendo-Grid-In-Action.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Sagas and web services


    One of the many endpoints that NSB provide integration into is the **Windows Communication
    Foundation (WCF)** endpoint. Visit http://en.wikipedia.org/wiki/Windows_Communication_Foundation
    for more information.


    WCF is part of the .NET Framework ecosystem which provides a runtime and a set
    of APIs for building connected, service-oriented applications. In the **Simple
    Object Access Protocol (SOAP)** binding, it makes use of **Web Services Description
    Languages (WSDL)**, which defines the interface between a web service and a web
    service client. Based on a WSDL, the XML is created on the WSDL specification
    so that the client and server can exchange information irrespective of their programming
    languages and platforms. It is sent between the server and the client as the protocol
    is normally HTTP or HTTPS. There are multiple binding types; we will discuss mostly
    SOAP binding in this book, but for more binding types, you can visit http://msdn.microsoft.com/en-us/library/ms731092%28v=vs.110%29.aspx.
    For example, if using a WCF client and service that are both built-in C#, we may
    consider using a NetTcpBinding class as it provides high performance between .NET
    WCF applications. Visit http://msdn.microsoft.com/en-us/library/ms731092%28v=vs.110%29.aspx
    for more information.


    For simplicity''s sake, we are only going to work with a SOAP web service in WCF
    in this chapter.


    WCF is a highly extensible framework and allows easy integration into NServiceBus.
    More information on NSB WCF sample integration can be found at https://github.com/Particular/NServiceBus/tree/develop/IntegrationTests/WcfIntegration
    and http://docs.particular.net/NServiceBus/how-do-i-expose-an-nservicebus-endpoint-as-a-web-wcf-service.


    While Microsoft''s WCF is considered a framework for implementing pieces of **service-oriented
    architecture (SOA)** guidelines, it is not an ESB. This WCF does not contain all
    the features and design patterns (like sagas), persistence, or other out-of-the-box
    features to implement an end-to-end solution for SOA guidelines. On the other
    hand, using NServiceBus as an ESB with the web services of WCF brings a lot to
    the table that WCF and other web service frameworks do not offer.


    # The source code


    The directory for the code is under the `Payment_WCFService` directory. The `WCFService`
    is used to test the client by being the WCF service.'
  merge: -1
  img_proc: true
