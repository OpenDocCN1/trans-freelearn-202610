- pgno: 185
  md: '# 6

    Using NServiceBus in

    the Cloud


    In this chapter, we will be focusing on snippets in NServiceBus in the cloud after
    a very brief introduction to the cloud and some of its services. While NServiceBus
    has support as a service bus for the Microsoft Azure cloud, it is also a beneficial
    tool to integrate into other cloud technologies, as all clouds have support for
    third-party integration to pass data through web services.


    In this chapter, we will cover:


    +   - Introducing the cloud and NSB

    +   - Introducing PaaS, IaaS, and SaaS

    +   - Using Microsoft Azure

    +     - Introducing Azure Storage services

    +     - Azure Service Bus and Storage Queues

    +     - Azure Storage Queues and NSB

    +     - Azure Service Bus in NSB


    # Introducing the cloud and NSB


    As this book is being written, NSB Version 5.0 for Azure is in the beta stage,
    and many updates have been made to NSB for cloud computing.


    Instead of using a local SQL Server, RavenDB, or MSMQ queuing system, all the
    subscription data, saga persistence, timeout persistence, and queuing messages
    can be used in Azure Storage, as well as a message be put in the Azure Service
    Bus. In many cases, there is one-to-one mapping to storage tables and the data
    information as keys are used to retrieve data instead of SQL schemas.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'NSB tools are adapting as well. ServiceInsight is growing to handle more details
    with sequence diagrams for debugging outside of Visual Studio and MSMQ environments.
    The tools are moving from being integrated locally into a physical server to being
    integrated into a remote server where many of the details of the server itself
    may be less important as servers are virtualized offsite. For instance, the future
    of ServiceInsight will add Saga Sequence diagrams to add more detail than the
    current flow diagrams. Here''s what is coming soon for ServiceInsight as a sequence
    diagram:


    ![](img/8188651cea6a881a16242b395a81399a_186_0.png)


    However, distributed transactions are not supported in many cloud technology queues.
    Other queuing platforms, such as RabbitMQ, also do not support distributed transactions.
    NSB Version 5.0 has the added functionality to compensate for not having distributed
    transactions by establishing tables that keep track of the status of transactions
    as they occur. This functionality allows transactional integrity where it may
    not exist natively.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Introducing PaaS, IaaS, and SaaS


    Cloud computing services are provided using three fundamental models:


    +   - **SaaS**: This stands for **Software as a Service**. This facilitates pay-per-use
    managed software services for consumption. Our responsibility is the configuration
    of these services that are managed by the cloud vendor. An example would be Google
    mail. This offers abstraction of the business software.

    +   - **PaaS**: This stands for **Platform as a Service**. This refers to pay-as-you-go
    generic services for consumption. These are services such as queuing, web servers,
    and other services that still require business software to be built. Our responsibility
    includes building the business software. This offers abstraction of the services
    that can run business software.

    +   - **IaaS**: This stands for **Infrastructure as a Service**. Providers of
    IaaS offer generic storage, networks, and servers for consumption. These are services
    such as storage that still require services and business software that has to
    be built. Our responsibility includes building the business software and creating
    services for the business software. This offers abstraction of the infrastructure
    that is running the platform services.


    PaaS is a cloud computing service that provides a computing platform and a solution
    stack as a service. In PaaS, the cloud computing provider provides the operating
    systems, databases, web servers, development tools, and other services that are
    required to host the consumer''s application.


    IaaS is a level below PaaS, as it provides the virtual (as well as physical) machines,
    servers, storage options, load balancers, networks, and more basic components.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'SaaS is a level higher than PaaS, as it is the software distribution model
    in which the applications themselves are hosted by a vendor or service provider
    and are made available to customers over a network, typically the Internet. Here
    is a look at how Windows Azure supports IaaS and PaaS:


    ![](img/8188651cea6a881a16242b395a81399a_188_0.png)


    Depending on the cloud vendor, some of these terminologies may be termed slightly
    differently. While all cloud vendors support these components, they differ on
    the level of abstraction of these components. For example, Windows Azure will
    allow you to configure a virtual machine (VM) in the cloud, while others only
    offer SaaS models. The cloud vendor as well as licensing that are selected will
    dictate the limitations of your resources. In Windows Azure, you could create
    a free website which will require no running cost; however, your application may
    be shared with other websites running on that box. But if you are willing to pay
    more, you could have a dedicated VM with your own web server running your website.
    It all depends on what services you choose. In the cloud world, consumption of
    resources and transactions is based on licensing. There are many resources available
    by all cloud vendors for development in their cloud; there is also a lot of help
    available as their goal is to get you to utilize their cloud as much as possible,
    as that is their revenue stream.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# # 第8章 常微分方程


    # ## 8.1 基本概念


    常微分方程：含有未知函數、未知函數的導數（或微分）與自變數的方程式，稱之為常微分方程。若未知函數為多變數函數，且方程式含有偏導數，則稱為偏微分方程。


    定義：n 階常微分方程之形式為


    ```

    $$F(x, y, y'', \ldots, y^{(n)}) = 0$$

    ```'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   - Availability of an assortment of common on-premise tools and services
    that work both on-site and in the cloud; for instance, using queuing and a SQL
    server that works locally and in the cloud.

    +   - Development of websites quickly in the cloud through multiple tools, such
    as WebMatrix.

    +   - Availability of on-demand services in using only what you need, and Microsoft
    tools to help report your resources and utilization for billing verification.

    +   - Ability to move to other cloud services as your software model progresses
    and your needs change. Many business software applications that are developed
    in Azure can be used in other cloud services.

    +   - Availability of simple data storage models in reporting and configuration
    of large data resources.


    All of these features sum up that Microsoft allows you to develop systems on-premise
    or in the cloud using Microsoft tools. It does not force you to stay in the cloud
    or develop locally, but allows you to develop the pieces in the cloud that you
    see fit, and remove them from the cloud when you see fit. Many other cloud vendors
    may force you to use specialized tools to create solutions, which when you take
    them out of the cloud, will have to be completely rewritten to put into a different
    cloud service.


    # Introducing Azure Storage Services


    For data management, we can create a SQL Azure database in the cloud or a SQL
    server on-premise, or a hybrid thereof. An easier method to keep SQL servers out
    of the equation is simply to call Storage Services directly, which provides rows
    that directly map to data. Azure Storage Services can be used both on-site through
    the use of the Azure SDK, and in the Azure cloud.


    Azure Storage can be used to store saga data in the tables, timeout persistence
    in the tables, subscription information in the tables, and to transport messages
    in the queues.


    Other than providing SQL Azure for storing data in the cloud, Azure also provides
    the following other types of storage, of which there are three basic types:


    +   - **Tables**: This is based on a key-value NoSQL table format.

    +   - **Binary Large Object (BLOB)**: This is used for binary storage, such as
    video files.

    +   - **Queues**: This is used for storing messages.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - A table is a NoSQL solution instead of the relational SQL database. It
    can store data across multiple machines. Each table can contain partitions across
    multiple machines. These tables have entities with partitions and row keys to
    access the entity. It is a key-value store to store the data. These tables do
    not enforce a schema. By not using a schema, speed is enhanced and the tables
    are loosely coupled with the objects as they are managed by keys. The limitation
    is not being able to execute SQL queries, but in most cases, it can take less
    storage, thus less cost for the data. For tables, there is a partition key, row
    key, and timestamp.

    +   - A partition key: This is a unique key associated with partition as a collection
    of all associated rows. This is used to define which partition to access; for
    example, the name of the table.

    +   - A row key: This is a unique key to identify the row in the partition, usually
    a unique ID.

    +   - Timestamp: This is the time at which the row is updated by Azure.


    A BLOB is a group to the containers, which is just unstructured data, such as
    a video or audio file stored as binary storage in a data store.


    The Queue storage is very similar to storing messages in MSMQ, except that the
    management tools are in the Azure cloud. Just as many of the Azure cloud items
    can be managed through the Azure SDK and Visual Studio, storage queues can also
    be managed through Visual Studio. We see timeout states, saga data, and subscription
    data in Visual Studio as shown in the following screenshot:


    ![](img/8188651cea6a881a16242b395a81399a_191_0.png)


    Besides using Visual Studio, there are many open source tools such as the Azure
    Storage Explorer found at the following:


    ```

    http://azurestorageexplorer.codeplex.com/

    ```'
  merge: -1
  img_proc: true
- pgno: 192
