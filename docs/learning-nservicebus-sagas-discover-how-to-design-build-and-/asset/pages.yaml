- pgno: 30
  md: '# The gateway pattern


    There are cases when services may be partly stored on one part of an organization''s
    LAN, and other services are stored on another LAN, and the only transport to each
    other is an HTTP or HTTPS tunnel to pass messages to NSB.


    The main purpose of the gateway is to allow you to do the same durable fire-and-forget
    messaging that you are accustomed to with NServiceBus across physically separated
    sites, where sites are locations in which you run IT infrastructure and not websites.


    The gateway only comes into play where you can''t use normal LAN-to-LAN VPN tunnels
    or use internal LAN servers to communicate MSMQ to MSMQ. The purpose of the gateway
    is to create messages that communicate through HTTP, but it would be preferable
    to use HTTPS to ensure that messages are secured. The following architecture diagram
    represents a gateway built using the NSB:


    ![](img/8188651cea6a881a16242b395a81399a_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# The source code\n\nIn this section, we will be using the following gateway\
    \ solutions:\n\n+   - Headquarters.Messages: This refers to the common messages\
    \ for Headquarters, SiteA, and SiteB.\n+   - Headquarters: This will receive messages\
    \ from http://localhost:25899/Headquarter/ and http://localhost:25899/Headquarter2/,\
    \ and send messages to http://localhost:25899/SiteA/ and http://localhost:25899/SiteB/.\n\
    +   - SiteA: This is a project that will receive updated price information from\
    \ Headquarters across http://localhost:25899/SiteA/ and respond that it was successful\
    \ to Headquarters across http://localhost:25899/Headquarter2/.\n+   - SiteB: This\
    \ is a project that will receive updated price information from Headquarters across\
    \ http://localhost:25899/SiteB/.\n+   - WebClient: This will have an Index.htm\
    \ page to send a JSON script to http://localhost:25899/Headquarter/.\n\nThe preceding\
    \ code solution is built using Visual Studio 2012 in Windows Server 2012, with\
    \ MSMQ, DTC, NServiceBus references, and SQL Server 2012 Express LocalDB installed.\n\
    \nIn a gateway, there are incoming channels and defined site keys to send outgoing\
    \ messages to their sites. We can see in the application configuration file of\
    \ the headquarters that the receiving channels for the headquarters are http://localhost:25899/Headquarter/\
    \ and http://localhost:25899/Headquarter2/.\n\nThere will be a set of site keys\
    \ for sending sites that make up SiteA and SiteB.\n\n```\n<GatewayConfig>\n  <Sites>\n\
    \    <Site Key=\"SiteA\" Address=\"http://localhost:25899/SiteA/\" ChannelType=\"\
    Http\" />\n    <Site Key=\"SiteB\" Address=\"http://localhost:25899/SiteB/\" ChannelType=\"\
    Http\" LegacyMode=\"false\" />\n  </Sites>\n  <Channels>\n    <Channel Address=\"\
    http://localhost:25899/Headquarter/\" ChannelType=\"Http\" />\n    <Channel Address=\"\
    http://localhost:25899/Headquarter2/\" ChannelType=\"Http\" Default=\"true\" />\n\
    \  </Channels>\n</GatewayConfig>\n```"
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The Bus.SendToSites (new[] { "SiteA", "SiteB"}) allows you to send messages
    to multiple sites as you can see in the preceding configurations. For instance,
    the parameter of SiteA will send the message to http://localhost:25899/SiteA/.


    Going across alternate channels such as HTTP means that you lose the MSMQ safety
    guarantee of exactly one message. This means that communication errors resulting
    in retry can lead to receiving the same message more than once. To avoid burdening
    you with de-duplication, the NServiceBus gateway supports this out of the box.
    You just need to store the message IDs of all received messages so it can detect
    potential duplicates. De-duplication tables can be stored on the SQL Server using
    the NHibernate persistence configuration. This will be configured on the IBus
    using the .UseNHibernateGatewayDeduplication() method. Of course, settings always
    need to be applied in the App.config file to define the database connection. Here,
    we are connecting to the local SQLE xpress instance.


    ```

    <connectionStrings><add name="NServiceBus/Transport" connectionString="cacheSendConnection=true"/>

    <add name="NServiceBus/Persistence" connectionString="Data Source=.\SQLEXPRESS;Initial
    Catalog=nservicebus;Integrated Security=True"/>

    </connectionStrings>

    <!-- specify the other needed NHibernate settings like below in appSettings:-->

    <appSettings>

    <!-- dialect is defaulted to MsSql2008Dialect, if needed change accordingly -->

    <add key="NServiceBus/Persistence/NHibernate/dialect" value="NHibernate.Dialect.MsSql2008Dialect"/>

    <!-- other optional settings examples -->

    <add key="NServiceBus/Persistence/NHibernate/connection.provider" value="NHibernate.Connection.DriverConnectionProvider"/>

    <add key="NServiceBus/Persistence/NHibernate/connection.driver_class" value="NHibernate.Driver.Sql2008ClientDriver"/>

    </appSettings>

    ```


    This gateway pattern allows us to pass messages through HTTP/HTTPS to allow queuing
    across outside systems from the local LAN. Normally web services run through HTTP/HTTPS,
    but with NSB, the queuing process can also run through HTTP/HTTPS to outside servers,
    where all ports are blocked and only HTTP/HTTPS can be used.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "# The DataBus pattern\n\nThe DataBus is used to send large chunks of data or\
    \ files across as an attachment because MSMQ is limited to 4 MB. For this reason,\
    \ a reference can be passed on a local file to transfer data using the `databus`\
    \ method. The message will provide a reference to a larger data file to be accessed\
    \ that exceeds the message queue size due to size constraints.\n\n![](img/8188651cea6a881a16242b395a81399a_33_0.png)\n\
    \nIn this section, we will use the gateway solution.\n\nThe path of the data bus\
    \ has to be set in the configuration of the endpoint. We will be using a relative\
    \ path to where the gateway project is running. Both `SiteA` and `SiteB` will\
    \ also have relative paths. There will be a relative path to the binary file with\
    \ a data bus subdirectory containing the files that will have a lot of data. The\
