    # Understanding ServiceInsight and its function


    ServiceInsight provides detailed insights into a specific message. It provides
    detail flow, timing, and error handling and the ability to retry the message,
    sort the message, look at its header, look at its sagas, copy the header, copy
    the message, and more.


    We will explore this more with the ServiceMatrix examples that we will be building,
    but we need to familiarize ourselves with the functions of ServiceInsight. You
    may opt to not use some of these tools in your development, but the purpose of
    this chapter is to discuss these tools.'
