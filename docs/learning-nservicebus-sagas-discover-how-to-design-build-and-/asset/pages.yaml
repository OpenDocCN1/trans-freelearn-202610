- pgno: 115
  md: '# Adding the configuration


    The task of configuring the App.config file for the web service still remains.
    This step is similar to exposing the endpoint with metadata that we mentioned
    earlier.


    The App.config file will define several characteristics of the web service, such
    as the listening port and URL, the security of the service, and the binding type
    for the service. The binding type defines the communication mechanism of the endpoint,
    be it basic HTTP, MSMQ, or any other. A list, as well as more information on WCF
    binding, can be found at http://msdn.microsoft.com/en-us/library/ms730879(v=vs.110).aspx.


    We could configure the App.config file by manually editing it, or by using the
    WCF Service Configuration Editor that comes as part of Visual Studio.


    More information on the Configuration Editor can be found here:


    http://msdn.microsoft.com/en-us/library/ms732009(v=vs.110).aspx


    We will now open the App.config file through the Configuration Editor to do the
    following:


    +   - Establish a server URL, including port number, to be available for the client
    WCF as the WCF endpoint

    +   - Establish the binding parameters that will expose the WCF service endpoints
    in a variety of different ways

    +   - Set up tracing and logging to review the transmissions and services as they
    happen'
  merge: -1
  img_proc: true
