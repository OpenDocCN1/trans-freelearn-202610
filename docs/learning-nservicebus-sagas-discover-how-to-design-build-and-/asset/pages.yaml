- pgno: 141
  md: "As we can see, the NServiceBus testing API makes use of a Fluent API specification\
    \ style testing pattern as opposed to the more traditional assertion style that\
    \ most people would normally use that are part of nunit or other xunit type frameworks.\n\
    \nWe will now start testing the saga code from the UnitTestHandlers project and\
    \ the UnitTestSaga2.cs file.\n\nOne thing to note is that if a saga entity object\
    \ is deleted in different function calls, with the MarkAsComplete() method, these\
    \ should be tested separately. This is because once we delete the object, we cannot\
    \ delete it again. For example, in our tests, we will use the following:\n\n```\n\
    [TestMethod]\npublic void Run()\n{\n    Test.Initialize();\n\n    /**\n     *\
    \ State sent to Saga\n     * ***\n    */\n    SendCommand command = new SendCommand();\n\
    \    command.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\");\n\
    \    command.state = MyMessages.MessageParts.StateCodes.SentMyWCFClient;\n\n \
    \   /**\n     * Response from WCF and to MVCApp\n     * ***\n    */\n    ResponseCommand\
    \ resp = new ResponseCommand();\n    resp.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\"\
    );\n    resp.state = MyMessages.MessageParts.StateCodes.CompleteMyWCFClient;\n\
    \n    Test.Saga<MyTestSaga>()\n        .ExpectReplyToOriginator<ResponseCommand>()\n\
    \        .ExpectSend<SendCommand>()\n        .When(s => s.Handle(command))\n \
    \       .ExpectReplyToOriginator<ResponseCommand>()\n        .When(s => s.Handle(resp))\n\
    \        .AssertSagaCompletionIs(true);\n\n    Test.Saga<MyTestSaga>()\n     \
    \   .ExpectReplyToOriginator<ResponseCommand>()\n        .ExpectSend<SendCommand>()\n\
    \        .ExpectTimeoutToBeSetIn<SendCommand>((state, span) => span == TimeSpan.FromHours(3))\n\
    \        .When(s => s.Handle(command))\n        .ExpectReplyToOriginator<ResponseCommand>()\n\
    \        .WhenSagaTimesOut()\n        .AssertSagaCompletionIs(true);\n}\n```"
