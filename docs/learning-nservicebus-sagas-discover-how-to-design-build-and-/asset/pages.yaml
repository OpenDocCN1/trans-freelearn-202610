- pgno: 37
  md: "When we add a value between 1 and 100 seconds, the message will be sent to\
    \ the queue of TimerSaga with the number of seconds and a RequestId to keep track\
    \ of the message ID, as shown in the following screenshot:\n\n![](img/8188651cea6a881a16242b395a81399a_37_0.png)\n\
    \nThe message's RequestId is used to map the message to the saga data. The saga\
    \ is started by SubmitRequestCommand with the number of seconds in it. It will\
    \ save the saga data in the TimerRequestData object, which will allow the original\
    \ client data to respond to it. The number of seconds will be set in the timeout,\
    \ and when the timeout expires, it will execute a TimeoutMessage instance that\
    \ will be handled by the saga. The saga's object class definition that defines\
    \ this mapping appears as follows:\n\n```\npublic class TimerRequestSaga : Saga<TimerRequestData>,\n\
    \    IAmStartedByMessages<SubmitRequestCommand>,\n    IHandleTimeouts<TimerRequestSaga.TimeoutMessage>\n\
    {\n```"
