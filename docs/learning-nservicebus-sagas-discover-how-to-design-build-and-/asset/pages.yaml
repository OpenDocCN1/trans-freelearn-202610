  md: '![](img/8188651cea6a881a16242b395a81399a_89_0.png)


    There are four ServiceControl plugins that can be installed, which we have mentioned
    so far:


    +   - **ServiceControl plugin for CustomChecks**: The CustomChecks plugin allows
    the developer of an NSB endpoint to define a set of conditions that are checked
    on endpoint startup, or periodically.

    +   - **ServiceControl plugin for DebugSessions**: DebugSessions is a dedicated
    plugin that enables integration between ServiceMatrix and ServiceInsight.

    +   - **ServiceControl plugin for heartbeats**: The Heartbeat plugin sends heartbeat
    messages from the endpoint to the ServiceControl queue. These messages are sent
    every 10 seconds by default.

    +   - **ServiceControl plugin for SagaAudits**: The Saga Audit plugin collects
    saga runtime activity information. This information enables the display of detailed
    saga data, behavior, and current status in the ServiceInsight saga view.


    By installing the Heartbeat plugin into the ECommerce and PaymentProcessing projects,
    ServicePulse will now give heartbeat information on the uptime of these services,
    as shown here:


