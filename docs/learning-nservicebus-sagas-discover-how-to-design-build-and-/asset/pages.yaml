- pgno: 38
  md: "The starting message SubmitRequestCommand will be handled by the saga's message\
    \ handler in the following code:\n\n```\npublic void Handle(SubmitRequestCommand\
    \ message)\n{\n    logger.Info(\"--------TimerSaga SubmitRequestCommand-------\"\
    \ + message);\n    \n    var command = new TimeoutMessage\n    {\n        RequestId\
    \ = message.RequestId\n    };\n    \n    // We put the number of seconds 1-100\
    \ in the timer\n    RequestTimeout<TimeoutMessage>(TimeSpan.FromSeconds(message.Seconds),command);\n\
    \    \n    Data.RequestId = message.RequestId;\n    Data.Seconds = message.Seconds;\n\
    }\n```\n\nThis code will set the timer that will send a TimeoutMessage instance\
    \ with the message's RequestId. All the messages that are part of the same starting\
    \ message will have the same RequestId. This will keep track of which message\
    \ started the next message, as well as map the saga data to save and retrieve\
    \ it from the saga. The RequestId is handled like a primary key to the saga data\
    \ that NSB will use to map the data to the messages. NSB handles the mapping,\
    \ but we must define the unique identifiers and keep processing them in the messages.\
    \ If this seems complicated, keep reading, as it is broken down in subsequent\
    \ chapters.\n\nWhen the timeout that we passed to the RequestTimeout<>() code\
    \ is reached, an instance of a timeout message is passed back to the saga. If\
    \ it was set for 10 seconds, after 10 seconds have passed, the following message\
    \ handler in the saga is called to process the timeout message that we set in\
    \ the timer. The Timeout message handler appears as follows:"
