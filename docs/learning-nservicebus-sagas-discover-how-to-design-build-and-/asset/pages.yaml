- pgno: 151
  md: '# ActiveMQ in NSB


    Apache Active Message Queue (ActiveMQ) is a JAVA open source framework from the
    Apache foundation based on the Java Message Service (JMS). Visit http://en.wikipedia.org/wiki/Apache_ActiveMQ
    and https://activemq.apache.org for more information. It will run on a machine,
    be it Windows or Linux, in a Java Runtime Environment (JRE). JAVA has to be operational
    on the machine and have the environment path for JAVA_HOME configured to point
    at the root folder of the JRE. The installation instructions for ActiveMQ can
    be found at https://activemq.apache.org/getting-started#GettingStarted20-Download.


    # The source code


    In this section, we will be using the ActiveMQ solution. This solution is similar
    to RabbitMQ, except ActiveMQ is used instead of RabbitMQ.


    There will be three basic steps:


    +   1. Add the NServiceBuActiveMQ reference.

    +   2. Change the NServiceBus transport mechanism from <MSMQ> to <ActiveMQ>.

    +   3. Set the ActiveMQ transport configuration in the App.config file.


    Once downloaded on the Windows OS, we unzipped the Window''s binary files into
    the c:\activemq\ directory. Running the activemq.bat batch file from the command
    prompt, in c:\activemq\bin\, will display a series of commands to show that the
    ActiveMQ is running. This is shown in the following screenshot:


    ![](img/8188651cea6a881a16242b395a81399a_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'An alternative is to install ActiveMQ as a Windows service in which installation
    scripts exist for both Win32 and Win64 machines. For a 64-bit Windows Server,
    we can use InstallService.bat in c:\activemq\bin\win64\.


    Ensure that RabbitMQ is not running as a Windows Service in the background, as
    they utilize the same network ports. Also, Microsoft ServiceBus for Windows Servers
    will share the same JMX ports as well, which will be port 5672. ActiveMQ''s default
    port is 61616. Checking the ports can be done with Microsoft''s TcpView, which
    can be found at http://technet.microsoft.com/en-us/sysinternals/bb897437.


    To ensure that ActiveMQ is running, you may access the admin console in the browser
    by using http://localhost:8161/admin. The default user ID and password are admin
    and admin respectively. Please visit http://activemq.apache.org/getting-started.html
    to have a look at the documentation. When accessing the admin console, you should
    get something that looks like the screenshot here:


    ![](img/8188651cea6a881a16242b395a81399a_152_0.png)'
  merge: -1
  img_proc: true
- pgno: 153
  md: "To use ActiveMQ for NServiceBus in Visual Studio projects, the NuGet version\
    \ of NServiceBus.ActiveMQ has to be installed. Go to https://www.nuget.org/packages/NServiceBus.ActiveMQ/1.0.5\
    \ to look at installing PM> Install-Package NServiceBus.ActiveMQ into the projects.\
    \ Ensure that the configuration for the IBus is set for ActiveMQ, as shown here:\n\
    \n```\nprotected void Application_Start()\n{\n    Configure.ScaleOut(s => s.UseSingleBrokerQueue());\n\
    \    _startableBus = Configure.With()\n        .DefaultBuilder()\n        .RijndaelEncryptionService()\n\
    \        .UseTransport<ActiveMQ>()\n        .UnicastBus()\n        .CreateBus();\n\
    \    Configure.Instance.ForInstallationOn<Windows>().Install();\n\n    _bus =\
    \ _startableBus.Start();\n    AreaRegistration.RegisterAllAreas();\n\n    RegisterGlobalFilters(GlobalFilters.Filters);\n\
    \    RegisterRoutes(RouteTable.Routes);\n}\n```\n\nEnsure that the App.Config\
    \ or Web.Config file have the appropriate connection string for the NServiceBus/Transport\
    \ string to point at the correct instance of the ActiveMQ queues:\n\n```\n<connectionStrings>\n\
    <add name=\"NServiceBus/Transport\" connectionString=\"ServerUrl=activemq:tcp://localhost:61616\"\
    />\n</connectionStrings>\n```"
  merge: -1
