- pgno: 66
  md: "The saga will read and handle the message from the accounting department of\
    \ the type, RecordEncumbranceReplyMessage. The saga will respond to the original\
    \ client, CreditCardSubmit so that it can be updated with the Purchase Order number\
    \ and status. We can see this in the saga message handler code in the following\
    \ screenshot:\n\n```\npublic void Handle(RecordEncumbranceReplyMessage message)\n\
    {\n    logger.Info(\"--------CreditCardSaga Handle------\" + message);\n    var\
    \ reply = new SubmitRequestReplyMessage\n    {\n        RequestId = Data.RequestId,\n\
    \        Approved = true,\n        PurchaseOrderNumber = message.PurchaseOrderNumber\n\
    \    };\n\n    ReplyToOriginator(reply);\n    MarkAsComplete();\n}\n```\n\nThe\
    \ originating client will receive the Purchase Order, via the saga from the accounting\
    \ department application, as shown here:\n\n![](img/8188651cea6a881a16242b395a81399a_66_0.png)\n\
    \nAfter the original requester receives the Purchase Order, the message is complete.\
    \ For denial and errors, the message flow will be similar.\n\nOne may ask why\
    \ there is so much work in a message flow. NSB is doing almost all the work for\
    \ the message flow and mapping. Many organizations save data for the purpose of\
    \ handling errors. The saga has a lot of basic error handling mechanisms for handling\
    \ errors throughout messages, endpoints, and services. We have already put in\
    \ code for timeouts so that the messages occur within a specific period of time."
