- pgno: 46
  md: "+   - `IHandleMessages<IMessage>`: The saga doesn't do much unless it is handling\
    \ messages. It can retrieve the saved data of a message that is mapped by the\
    \ configuration. NSB handles the mapping of the data to the message by the unique\
    \ ID, in this case, `RequestId`, that is defined in `ConfigureHowToFindSaga()`.\n\
    +   - `ConfigureHowToFindSaga()`: This function of the saga pattern is used to\
    \ map the data to the messages. Usually, the mapping can be performance from a\
    \ GUID or ID, but it must be a unique data type that can be stored as a primary\
    \ key in a database. The messages that are mapped contain the same key, and when\
    \ it passes in the saga, the data is found that matches the key. This function\
    \ is called when the saga object is instanced.\n\n```\npublic override void ConfigureHowToFindSaga()\n\
    {\n    ConfigureMapping<ResponseCommand>(x => x.RequestId).ToSaga(x => x.RequestId);\n\
    }\n```\n\n# Sagas – what are they good for?\n\nSagas play a critical role in workflow\
    \ management. Without the ability to map data to persistent data, workflow among\
    \ messages cannot be achieved. Saga's purpose is to persist saga data objects,\
    \ which are files with data from selected content, directed from messages in the\
    \ message handler. The following are some of the things that sagas are good for:\n\
    \n+   - **Saving message state/session information**: When a message is started,\
    \ the message handler will create the saga data instance that will be saved at\
    \ the end of the message handler. It is up to the message handler data to set\
    \ data into an instance of the object. NSB handles the mapping. The following\
    \ screenshot displays the code for handling messages:\n\n```\npublic void Handle(SendCommand\
    \ message)\n{\n    ResponseCommand resp = new ResponseCommand();\n    resp.RequestId\
    \ = message.RequestId;\n    resp.state = PaymentMessages.MessageParts.StateCodes.SentMyWCFClient;\n\
    \    ReplyToOriginator(resp);\n    Bus.Send(message);\n    RequestTimeout(TimeSpan.FromHours(3),\
    \ message); // 3 hours\n    Data.RequestId = message.RequestId;\n}\n```"
  merge: -1
  img_proc: true
