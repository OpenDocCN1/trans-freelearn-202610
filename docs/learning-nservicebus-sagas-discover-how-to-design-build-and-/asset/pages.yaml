- pgno: 57
  md: "The timeout could also be used to schedule daily tasks for the saga to complete\
    \ in its cleanup and maintenance pieces. For instance, we can send a daily e-mail\
    \ to operations reporting how many messages the saga processed for the day and\
    \ if it had any messages reported in the error queue. Here, we give the credit\
    \ card approver 60 seconds to approve. The following screenshot displays the code\
    \ for this:\n\n```\npublic void Handle(SubmitRequestCommand message)\n{\n    logger.Info(\"\
    --------CreditCardSaga Handle-------\" + message);\n    \n    // We give the Approver\
    \ 60 seconds to respond\n    RequestTimeout<TimeoutMessage>(TimeSpan.FromSeconds(60));\n\
    }\n```\n\nThe saga's purpose is to manage the workflow of the messages by the\
    \ state of the saga data. The saga will be started by a message, or many messages,\
    \ defined in IAmStartedByMessages<>. Subsequent messages are defined in IHandleMessages<\
    \ >. The timeout has a special message handler called IHandleTimeouts<>. We can\
    \ observe this in the following class diagram:\n\n![](img/8188651cea6a881a16242b395a81399a_57_0.png)"
  merge: -1
  img_proc: true
- pgno: 58
  md: "In order to save the saga data, the data needs to be mapped to a message. NSB\
    \ will do most of the mapping, but it requires the definition of the message ID\
    \ that will be used to map the data to the message. In our saga data, we are using\
    \ the RequestId instance as the message's data primary key. In version 4.0, we\
    \ mapped this functionality to use the RequestId instance to map the messages\
    \ ApproveRequestCommand and DenyRequestCommand, as shown in the following code,\
    \ using ConfigureHowToFindSaga():\n\n```\npublic override void ConfigureHowToFindSaga()\n\
    {\n    ConfigureMapping<ApproveRequestCommand>(x => x.RequestId).ToSaga(x => x.RequestId);\n\
    \    ConfigureMapping<DenyRequestCommand>(x => x.RequestId).ToSaga(x => x.RequestId);\n\
    }\n```\n\nIn version 5.0, we mapped this functionality to use the RequestId instance\
    \ to map the messages ApproveRequestCommand and DenyRequestCommand, as shown in\
    \ the following code, using ConfigureHowToFindSaga(SagaPropertyMapper< > mapper):\n\
    \n```\nprotected override void ConfigureHowToFindSaga(SagaPropertyMapper<CreditCardRequestData>\
    \ mapper)\n{\n    mapper.ConfigureMapping<ApproveRequestCommand>(x => x.RequestId).ToSaga(x\
    \ => x.RequestId);\n    mapper.ConfigureMapping<DenyRequestCommand>(x => x.RequestId).ToSaga(x\
    \ => x.RequestId);\n}\n```\n\nThese messages are handled by message handlers,\
    \ such as the Handle(DenyRequestCommand message). The saga data will pull the\
    \ record matching the message's RequestId from NSB. NSB just needs the mapping\
    \ definition, and it handles the record that is maintaining persistence and the\
    \ mapping, as shown in the following code:\n\n```\npublic void Handle(DenyRequestCommand\
    \ message)\n{\n    logger.Info(\"----------CreditCardSaga Handle----------\" +\
    \ message);\n    var reply = new SubmitRequestReplyMessage\n    {\n        RequestId\
    \ = Data.RequestId,\n        Approved = false\n    };\n\n    ReplyToOriginator(reply);\n\
    \    MarkAsComplete();\n}\n```"
  merge: -1
