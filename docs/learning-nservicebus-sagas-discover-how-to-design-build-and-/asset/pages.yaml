- pgno: 16
  md: 'NServiceBus is the C# platform of choice for those that require workflows.
    In sagas, high availability, high performance, monitoring, encryption, rapid deployment,
    and many more features can only be found in this framework when building C# solutions.


    # What this book covers


    Chapter 1, Introduction to Sagas, discusses NServiceBus and a basic design pattern
    that it uses, known as sagas, which is used to save states of messages. We will
    discuss the benefits of sagas and what it brings to the table with regard to software
    design.


    Chapter 2, NServiceBus Saga Architecture, expands on the uses of sagas for persistence,
    timeouts, message durability, and message handling. We will discuss various message
    exchange patterns through examples to include gateway and cluster managing. These
    are important concepts as they drive the high availability and high performance
    that NSB brings to the table.


    Chapter 3, The Particular Service Platform, is an overview of the Particular website-associated
    tools for NServiceBus. We will discuss building sagas through the ServiceMatrix
    tool, which is a Visual Studio extension tool for visually designing NSB endpoints,
    messages, and services. The other tools that we will discuss at length as they
    apply to sagas are the ServicePulse to monitor the endpoint availability during
    production, and ServiceInsight to take a deep dive into the functionality and
    properties of endpoints, services, and messages as they execute.


    Chapter 4, Saga Development, focuses on various useful constructions of sagas
    and message handlers. The purpose of sagas will be discussed as the discussion
    goes into the need for extending and coordinating transactional integrity using
    sagas. The chapter then morphs into a discussion of NServiceBus, using integrated
    pre-built WCF bridges. While some might consider it unusual to discuss WCF in
    a saga chapter, sagas become an intermediate for coordinating WCF and NServiceBus
    work. We can decouple the workflow from the frontend for interaction with backend
    processes through message handling. Sagas provide the means to persist the state
    information of the messages. This discussion will also handle other queuing sources
    as well to include RabbitMQ and ActiveMQ.'
  merge: -1
  img_proc: true
