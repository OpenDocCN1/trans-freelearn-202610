- pgno: 48
  md: "In this scenario, we give the message three hours to perform its operations\
    \ before timing it out. The following screenshot displays the code for providing\
    \ timeouts:\n\n```\npublic class PaymentRequestSaga : NServiceBus.Saga.Saga<PaymentRequestData>,\n\
    \    IAmStartedByMessages<SendCommand>,\n    IHandleMessages<ResponseCommand>,\n\
    \    IHandleTimeouts<SendCommand>\n{\n    public override void ConfigureHowToFindSaga()...\n\
    \n    public void Handle(SendCommand message)\n    {\n        // ...\n       \
    \ RequestTimeout(TimeSpan.FromHours(3), message); // 3 hours\n        // ...\n\
    \    }\n\n    public void Handle(ResponseCommand message)...\n\n    public void\
    \ Timeout(SendCommand state)\n    {\n        ResponseCommand resp = new ResponseCommand();\n\
    \        resp.RequestId = state.RequestId;\n        resp.state = PaymentMessages.MessageParts.StateCodes.Timeout;\n\
    \        ReplyToOriginator(resp);\n        MarkAsComplete();\n    }\n}\n```\n\n\
    Because the saga pattern has the ability to persist the message's state data,\
    \ the messages become connectionless pieces of separate messages and provide a\
    \ means to connect multiple messages to each other to perform end-to-end flow.\
    \ Thus, the saga becomes the focal point of the interaction. The messages now\
    \ have a behavioral pattern as they have more meaning than a single instance.\
    \ They now have a long time to live, as when the individual message is no longer\
    \ available, the saga data representing data for the message will still live on,\
    \ until it is marked to be destroyed."
