- "# 1 引言\nSaga 简介\n\n在本章中，我们将讨论 Saga 的简介。Saga 只是 **NServiceBus（NSB）** 支持的众多设计模式之一。NSB\
  \ 是一种 **企业服务总线（ESB）**，为端到端企业带来了许多设计特性和好处。我们将简要了解这些特性，并简单讨论 NSB 支持的一些设计模式。在此基础上，我们将介绍\
  \ Saga 设计模式，并简要介绍其用途。本书其余部分将深入探讨 Saga 模式及其使用，并讨论 NSB 的更多特性。\n\n在本章中，我们将学习以下内容：\n\
  \n- ESB 简要介绍\n- 其他模式\n  - 发布-订阅模式\n  - 请求-响应模式\n  - 数据总线模式\n  - 超时模式\n  - 消息突变模式\n\
  \  - 消息加密模式\n  - 扩展模式\n  - Saga 设计模式\n- Saga——它们有什么用？\n\n![](img/8188651cea6a881a16242b395a81399a_23_0.png)\n\
  \n上图展示的是非常高级的接口，因此我们可以深入探讨服务本身的协议。\n\n![](img/8188651cea6a881a16242b395a81399a_23_1.png)\n\
  \n- **极其可配置：** NSB 使用 `Configure.With()` 函数进行配置，可以轻松地将持久化从 RavenDB 更改为 NHibernate\
  \ ORM 框架，或将队列从 MSMQ 更改为 RabbitMQ、ActiveMQ 或 SQL 队列。除了某些配置外，几乎所有代码（如果不是全部）无论采用何种持久化和队列模型都能同样工作，因为\
  \ NSB 负责端点的配置和映射。\n- **服务托管：** NSB 使用 `NServiceBus.Host.exe` 文件负责服务的管理和托管。\n- **集中式生产监控：**\
  \ Particular 的 ServicePulse 可以监控生产端点、消息报告和服务报告。\n- **ServiceInsight：** Particular\
  \ 的 ServiceInsight 可以通过可视化画布、端点视图、消息视图提供深入洞察，并让你更深入地理解 Saga 的消息、端点和消息服务。\n- **快速开发：**\
  \ Particular 的 ServiceMatrix 是 Visual Studio 的开发工作室扩展，通过生成 C# 代码的图形画布提供快速开发。\n\n\
  让我们看看 ESB 设计的几个实际需求。\n\n- **支付引擎到银行：** C# 程序员可以使用 Microsoft Windows Communication\
  \ Foundation（WCF）或 Microsoft Web API 为外部银行执行 Web 服务以扣款信用卡。WCF 有许多无法支持横切关注点的部分，例如重试和失败处理。NSB\
  \ 可以托管服务，并在 MSMQ 中提供持久消息传递，以便在 WCF 接口上执行消息重试。如果 Web 服务对第三方服务（如银行）出现中断，NSB 将持久化消息。这包括跟踪消息报告，甚至消息加密。因此，虽然\
  \ WCF 可以实现 Web 服务部分，但在 WCF 领域之外还有许多部分，只有像 NSB 这样的产品才能提供横切功能。\n- **在线订购系统：** 订购产品时，你可能会看到一个旋转的页面，并显示\
  \ **请勿刷新，正在处理订单**。这显然是一种网站与订购站点（包括信用卡处理）紧密耦合的设计。许多自动化过程可能会干扰 Web 浏览器，或者服务器端可能出现断连，导致流程重新开始。ESB\
  \ 将始终确保，如果你不得不再次下订单或遇到中断，你的消息是事务性和持久性的，从而在订单收费时确保完整性。\n\n> 对于与 NSB 设计松散耦合的网站，网站只需向服务队列发送消息，而不会中断\
  \ Web 流程。不允许在订单处理时刷新的网站依赖于后端流程完成，而 Web 流程可能会被中断。NSB 设计仍然可以在不中断网站的情况下向用户反馈订单状态。\n\
  \n## 事件驱动型任务\n\n对于在 Windows 上调度任务，Windows 任务计划程序可以完成这项工作（参见 http://en.wikipedia.org/wiki/Windows_Task_Scheduler）。然而，取决于任务的复杂性，Windows\
  \ 任务计划程序可能不足以处理它。例如，如果需要在启动任务之前检查节假日安排，并且该任务依赖于其他事件和服务在其运行前发生，你可能会遇到任务计划程序的局限性。Windows\
  \ 任务计划程序是一个很棒的工具，但它不像 ESB 那样是事件驱动的。对于 ESB 来说，时间本身就是一种事件。\n\n即使某项任务可以轻松由任务管理器完成，除非你使用像\
  \ NSB 这样的框架，否则你无法获得服务的全局管理、事件、命令和消息的消息传递，以及从管理视角对处理过程的反馈。\n\nNSB 扩展了设计，以支持事件驱动设计的许多方面，在这些设计中，构建一个简单的网站、调度每日任务或发送付款可以轻松扩展到更大的规模，以便拥有、监控、管理、扩展、保护并维持良好的软件质量。当这些简单设计变得复杂时，常常需要进行重写，这并不少见。这仅仅是因为软件质量和设计扩展没有提前考虑。\n\
  \nESB 是一种用于设计 SOA 架构的架构软件设计模式和框架。然而，ESB 还可以带来许多其他软件设计模式。这些是 NSB 支持的软件设计模式，但并非所有\
  \ ESB 都支持这些模式。\n\n\n\n\n\n## 其他 SOA 模式\n\nNSB 支持许多其他软件设计和消息传递模式。许多此类模式可以在 http://www.enterpriseintegrationpatterns.com\
  \ 找到。设计模式的目的是提供经过行业复用验证的可重用框架，以快速部署之前设计好的方案。NSB 拥有多种在健壮可靠的 ESB 解决方案中广受欢迎的设计模式。\n\
  \n### 发布-订阅模式\n\n使用 ESB 技术的一大好处是发布-订阅消息模式的可用性（更多细节，请参见 http://en.wikipedia.org/wiki/Publish-subscribe_pattern）。发布-订阅模式已经存在很长时间了，其简单性是许多系统的基础。\n\
  \n该模式利用消息队列，NSB 通过队列存储消息，无论是 MSMQ、SQL 队列、RabbitMQ、Azure 队列还是 ActiveMQ。其基本前提是消息发布到队列；在\
  \ NSB 中，它使用 `Bus.Publish(message)` 函数将事件消息放入队列，而无需发送到特定的接收者。可以有多个称为订阅者的输出通道监听发布者。这样做的好处是，服务之间除了消息之外不依赖任何彼此关系，并且可以相互独立地运行。这是一种解耦的服务，意味着依赖关系彼此分离。\n\
  \n当然，NSB 的正常功能仍然适用。例如，消息将保留在队列中，直到订阅者从队列中取出消息进行处理。对于 NSB，这意味着即使机器重启，消息仍会保留在队列中，直到订阅者处理完消息，从而确保消息永不丢失。\n\
  \n订阅者将处理消息，可以有一个或多个订阅者。例如，发布者可能在其队列中放入 10 种不同类型的消息，而每种类型的消息都可能有一个订阅者。\n\nNSB 框架拥有\
  \ Windows 性能监视器的插件。在端点的服务级别协议（SLA）代码中，我们可以指定：如果服务未达到性能标准，将创建新服务或发送警报。因此，如果某个订阅者表现不佳，它将迫使其他订阅者接管，因为它们在多台机器上表现更好。因此，NSB\
  \ 是一个高可用、持久消息、高性能的 ESB 引擎，可以通过多种方式进行开发。发布-订阅模式的设计如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_28_0.png)\n\
  \n在 NSB 中，有一些专门用于发布-订阅的特殊类型消息，称为事件。这迫使代码在发布-订阅场景中处理消息，而不是在请求-响应场景中。\n\n发布者-订阅者映射通过应用程序配置文件完成。这将定义订阅者将从发布者队列订阅的消息类型，以处理这些消息。当这些程序执行时，订阅映射将进一步保存到本地数据库中。默认情况下，它们保存在\
  \ RavenDB 中。\n\n### 网关模式\n\n在某些情况下，部分服务可能存储在一个组织的某个局域网中，而其他服务存储在另一个局域网中，彼此之间唯一的传输方式是通过\
  \ HTTP 或 HTTPS 隧道将消息传递给 NSB。\n\n网关的主要目的是允许您在物理上分离的站点之间执行与 NServiceBus 中惯用的相同持久即发即忘消息传递，这里的站点是指运行\
  \ IT 基础设施的位置，而不是网站。\n\n网关只有在无法使用正常的 LAN 到 LAN VPN 隧道或使用内部 LAN 服务器进行 MSMQ 到 MSMQ\
  \ 通信时才发挥作用。网关的目的是创建通过 HTTP 通信的消息，但最好使用 HTTPS 以确保消息安全。以下架构图展示了使用 NSB 构建的网关：\n\n![](img/8188651cea6a881a16242b395a81399a_30_0.png)\n\
  \n### 源代码\n\n在本节中，我们将使用以下网关解决方案：\n\n- Headquarters.Messages：指 Headquarters、SiteA\
  \ 和 SiteB 的公共消息。\n- Headquarters：将从 http://localhost:25899/Headquarter/ 和 http://localhost:25899/Headquarter2/\
  \ 接收消息，并向 http://localhost:25899/SiteA/ 和 http://localhost:25899/SiteB/ 发送消息。\n\
  - SiteA：这是一个项目，将从 Headquarters 通过 http://localhost:25899/SiteA/ 接收更新的价格信息，并通过 http://localhost:25899/Headquarter2/\
  \ 向 Headquarters 响应成功。\n- SiteB：这是一个项目，将从 Headquarters 通过 http://localhost:25899/SiteB/\
  \ 接收更新的价格信息。\n- WebClient：这将有一个 Index.htm 页面，用于向 http://localhost:25899/Headquarter/\
  \ 发送 JSON 脚本。\n\n上述代码解决方案是在 Windows Server 2012 上使用 Visual Studio 2012 构建的，并安装了\
  \ MSMQ、DTC、NServiceBus 引用和 SQL Server 2012 Express LocalDB。\n\n在网关中，有传入通道和定义的站点键，用于将传出消息发送到其站点。我们可以在总部的应用程序配置文件中看到，总部的接收通道是\
  \ http://localhost:25899/Headquarter/ 和 http://localhost:25899/Headquarter2/。\n\n\
  将有一组用于发送站点的站点键，这些站点构成 SiteA 和 SiteB。\n\n```\n<GatewayConfig>\n  <Sites>\n    <Site\
  \ Key=\"SiteA\" Address=\"http://localhost:25899/SiteA/\" ChannelType=\"Http\" />\n\
  \    <Site Key=\"SiteB\" Address=\"http://localhost:25899/SiteB/\" ChannelType=\"\
  Http\" LegacyMode=\"false\" />\n  </Sites>\n  <Channels>\n    <Channel Address=\"\
  http://localhost:25899/Headquarter/\" ChannelType=\"Http\" />\n    <Channel Address=\"\
  http://localhost:25899/Headquarter2/\" ChannelType=\"Http\" Default=\"true\" />\n\
  \  </Channels>\n</GatewayConfig>\n```\n\n`Bus.SendToSites (new[] { \"SiteA\", \"\
  SiteB\"})` 允许您向多个站点发送消息，正如您在前面的配置中所看到的。例如，SiteA 参数会将消息发送到 http://localhost:25899/SiteA/。\n\
  \n通过 HTTP 等替代通道传输意味着您失去了 MSMQ 对每一条消息恰好一次传递的安全保证。这意味着通信错误导致的重试可能会使同一条消息被多次接收。为了避免让您处理去重问题，NServiceBus\
  \ 网关开箱即用地支持此功能。您只需存储所有已接收消息的消息 ID，以便检测潜在的重复。可以使用 NHibernate 持久化配置将去重表存储在 SQL Server\
  \ 上。这将通过 `.UseNHibernateGatewayDeduplication()` 方法在 IBus 上进行配置。当然，始终需要在 App.config\
  \ 文件中应用设置来定义数据库连接。这里，我们连接到本地 SQL Express 实例。\n\n```\n<connectionStrings><add name=\"\
  NServiceBus/Transport\" connectionString=\"cacheSendConnection=true\"/>\n<add name=\"\
  NServiceBus/Persistence\" connectionString=\"Data Source=.\\SQLEXPRESS;Initial Catalog=nservicebus;Integrated\
  \ Security=True\"/>\n</connectionStrings>\n<!-- specify the other needed NHibernate\
  \ settings like below in appSettings:-->\n<appSettings>\n<!-- dialect is defaulted\
  \ to MsSql2008Dialect, if needed change accordingly -->\n<add key=\"NServiceBus/Persistence/NHibernate/dialect\"\
  \ value=\"NHibernate.Dialect.MsSql2008Dialect\"/>\n<!-- other optional settings\
  \ examples -->\n<add key=\"NServiceBus/Persistence/NHibernate/connection.provider\"\
  \ value=\"NHibernate.Connection.DriverConnectionProvider\"/>\n<add key=\"NServiceBus/Persistence/NHibernate/connection.driver_class\"\
  \ value=\"NHibernate.Driver.Sql2008ClientDriver\"/>\n</appSettings>\n```\n\n这种网关模式允许我们通过\
  \ HTTP/HTTPS 传递消息，从而允许从本地局域网到外部系统进行排队。通常 Web 服务通过 HTTP/HTTPS 运行，但使用 NSB，排队过程也可以通过\
  \ HTTP/HTTPS 运行到外部服务器，在这些服务器中所有端口都被阻止，只能使用 HTTP/HTTPS。\n\n\n\n\n\n## DataBus 模式\n\
  \nDataBus 用于以附件形式发送大块数据或文件，因为 MSMQ 的限制是 4 MB。因此，可以通过引用本地文件来传递数据，使用 `databus` 方法。消息将提供对较大数据文件的引用，该文件因大小限制而超出消息队列的大小。\n\
  \n![](img/8188651cea6a881a16242b395a81399a_33_0.png)\n\n在本节中，我们将使用网关解决方案。\n\n数据总线的路径必须在端点的配置中设置。我们将使用相对于网关项目运行位置的相对路径。`SiteA`\
  \ 和 `SiteB` 也将使用相对路径。将有一个指向二进制文件的相对路径，其中包含一个数据总线子目录，该子目录包含大量数据的文件。代码如下：\n\n```\n\
  public void Init()\n{\n    Configure.With()\n        .DefaultBuilder()\n       \
  \ .FileShareDataBus(\".\\\\databus\");\n}\n```\n\n![](img/8188651cea6a881a16242b395a81399a_35_0.png)\n\
  \n在 NSB 中，我们可以使用事件驱动的定时器消息。这是 saga 根据其定时器启动函数、运行命令或执行许多其他任务的能力。在事件驱动的定时器函数中，我们可以为一天中的任何时间设置超时，从进程启动后的几秒到几分钟、几小时、几天，甚至可以为进程使用假日表。通过托管服务，定时器的使用可以更加复杂，例如添加假日表、周末不执行定时器，以及任务调度器无法处理的更多业务功能。NSB\
  \ 还包括服务本身的安装和管理。仅节省部署服务的时间和让 NSB 为管理员设置 DTC 所节省的时间，可能就足以支付 NSB 的许可证费用。\n\n本节中的源代码将位于\
  \ NSB 5.0 版本的 `TimerSaga - v5` 目录中。这里有以下几个项目：\n\n- AppCommon：包含 Windows 窗体的 ViewModel\
  \ 和上下文。\n- TimerSubmit：这是一个向 saga 提交 1 到 100 秒之间定时器消息的项目。\n- TimerMessages：包含项目之间共享的消息。\n\
  \n当我们添加一个 1 到 100 秒之间的值时，消息将被发送到 TimerSaga 的队列中，其中包含秒数和一个用于跟踪消息 ID 的 RequestId，如下面的截图所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_37_0.png)\n\n消息的 RequestId 用于将消息映射到 saga\
  \ 数据。saga 由 SubmitRequestCommand 启动，其中包含秒数。它将 saga 数据保存在 TimerRequestData 对象中，该对象允许原始客户端数据对其进行响应。秒数将设置在超时中，当超时到期时，它将执行一个\
  \ TimeoutMessage 实例，该实例将由 saga 处理。定义此映射的 saga 对象类定义如下：\n\n```\npublic class TimerRequestSaga\
  \ : Saga<TimerRequestData>,\n    IAmStartedByMessages<SubmitRequestCommand>,\n \
  \   IHandleTimeouts<TimerRequestSaga.TimeoutMessage>\n{\n```\n\n启动消息 SubmitRequestCommand\
  \ 将由 saga 的消息处理器处理，代码如下：\n\n```\npublic void Handle(SubmitRequestCommand message)\n\
  {\n    logger.Info(\"--------TimerSaga SubmitRequestCommand-------\" + message);\n\
  \    \n    var command = new TimeoutMessage\n    {\n        RequestId = message.RequestId\n\
  \    };\n    \n    // We put the number of seconds 1-100 in the timer\n    RequestTimeout<TimeoutMessage>(TimeSpan.FromSeconds(message.Seconds),command);\n\
  \    \n    Data.RequestId = message.RequestId;\n    Data.Seconds = message.Seconds;\n\
  }\n```\n\n这段代码将设置定时器，定时器会发送一个带有消息 RequestId 的 TimeoutMessage 实例。同一启动消息的所有消息将具有相同的\
  \ RequestId。这将跟踪哪个消息启动了下一个消息，并将 saga 数据映射到保存和检索它的 saga 中。RequestId 被视为 saga 数据的主键，NSB\
  \ 将使用它来将数据映射到消息。NSB 处理映射，但我们必须定义唯一标识符并在消息中持续处理它们。如果这看起来复杂，请继续阅读，因为后续章节会对其进行分解。\n\
  \n当我们传递给 `RequestTimeout<>()` 代码的超时时间到达时，一个超时消息实例会被传回给 saga。如果设置为 10 秒，则在 10 秒过后，将调用\
  \ saga 中的以下消息处理器来处理我们在定时器中设置的超时消息。超时消息处理器如下所示：\n\n当 TimerSubmit 进程收到回复消息时，它将弹出一个“Timer\
  \ in Seconds”窗口，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_40_0.png)\n\n\
  这段代码包含了简单 saga 的所有部分。该代码也可以使用其他框架的组合来创建，例如使用 Quartz 处理定时器，使用 TopShelf 创建服务，但 NSB\
  \ 是一个完整的框架，提供端到端的架构片段以及包含所有部分的多种模式。\n\n在 Windows 窗体中显示 Timed 状态的最终消息可以很容易地是作业的执行、另一个程序、系统状态的电子邮件、系统状态的报告，以及更多定时任务。之前使用的秒数只是一个演示。`RequestTimeout()`\
  \ 函数可以接受秒、分钟、小时、天，或者可以在一天中的特定时间执行。我们可以使用周末和假日日历执行该函数，并进一步扩展功能。我们可以创建一个集中的 saga 定时器，像\
  \ Microsoft 任务计划程序一样调度所有任务，但创建一个可监控、可管理、可生成报告并在更详细的解决方案中改进功能的托管服务。\n\n## 消息变异模式\n\
  \n消息变异器允许你通过将自定义逻辑插入到几个简单的接口中来更改消息。例如，你可以加密消息的一部分或全部。加密消息变异器是 NServiceBus 库的一部分，可以随时使用。你可以拦截传入消息，然后在将其作为传出消息发送之前对其进行变异。这就是消息在离开客户端并进入服务器时被更改的过程。\n\
  \n## 源代码\n\n在本节中，我们将使用 MessageMutators 解决方案，其中包含以下项目：\n\n- Client：客户端将向服务器发送消息。\n\
  - Server：服务器将接收变异后的消息。\n- Messages：这是在客户端和服务器之间传递的消息格式。\n- MessageMutators：此项目将包含在\
  \ TransportMessageCompressionMutator.cs 中压缩和解压缩消息的变异代码，以及在 ValidateMessageMutator.cs\
  \ 中验证消息注解的代码。\n\n客户端和服务器需要运行。客户端将提示发送一条好消息或坏消息。好消息会被压缩，以便通过 4 MB 的 MSMQ 缓冲区大小限制，如下面的截图所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_41_0.png)\n\n队列中的数据将在 MSMQ 处理之前由客户端进行验证和压缩。如下图所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_41_1.png)\n\n然后，服务器将从 MSMQ 接收消息，但在处理之前，它会解压缩并验证消息。它将恢复客户端变异前的消息。如下图所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_41_2.png)\n\n这只是一个简单的压缩和数据注解验证，以确保 MSMQ\
  \ 能够处理该消息。变异消息的原因之一可能是对支付消息中的信用卡进行加密。\n\n\n\n\n```\npublic class PaymentRequestSaga\
  \ : NServiceBus.Saga.Saga<PaymentRequestData>,\n    IAmStartedByMessages<SendCommand>,\n\
  \    IHandleMessages<ResponseCommand>,\n    IHandleTimeouts<SendCommand>\n{\n  \
  \  public void Handle(SendCommand message)\n    {\n        ResponseCommand resp\
  \ = new ResponseCommand();\n        resp.RequestId = message.RequestId;\n      \
  \  resp.state = PaymentMessages.MessageParts.StateCodes.SentMyWCFClient;\n     \
  \   ReplyToOriginator(resp);\n        Bus.Send(message);\n        RequestTimeout(TimeSpan.FromHours(3),\
  \ message); // 3 hours\n        Data.RequestId = message.RequestId;\n    }\n}\n\
  ```\n\n- `Saga<IContainSagaData>`：saga 数据是被持久化的数据。这些数据包含 NSB 为 ID、发起方和 OriginalMessageId\
  \ 实例设置的默认值。此外，应使用唯一 ID 在消息和数据之间进行映射，反之亦然。如下图所示：\n\n```\npublic class PaymentRequestData\
  \ : IContainSagaData\n{\n    /***\n     * Gets/sets the Id of the process. Do NOT\
  \ generate this value in your code.\n     The value of the Id will be generated\
  \ automatically to provide the\n     best performance for saving in a database.\n\
  \     ***/\n    public virtual Guid Id { get; set; } // Required\n    /***\n   \
  \  * Contains the return address of the endpoint that caused the process to run.\n\
  \     ***/\n    public virtual string Originator { get; set; } //Required\n    /***\n\
  \     * Contains the Id of the message which caused the saga to start.\n     This\
  \ is needed so that when we reply to the Originator, any\n     registered callbacks\
  \ will be fired correctly.\n     ***/\n    public virtual string OriginalMessageId\
  \ { get; set; } //Required\n\n    [Unique]\n    public virtual Guid RequestId {\
  \ get; set; } // Unique ID to lookup Request message\n}\n```\n\n- `IHandleMessages<IMessage>`：除非正在处理消息，否则\
  \ saga 不会做太多事情。它可以检索通过配置映射的消息的已保存数据。NSB 通过唯一 ID（此处为 `RequestId`，定义在 `ConfigureHowToFindSaga()`\
  \ 中）来处理数据到消息的映射。\n- `ConfigureHowToFindSaga()`：saga 模式的这个函数用于将数据映射到消息。通常，映射可以通过\
  \ GUID 或 ID 执行，但它必须是唯一的数据类型，可以作为数据库中的主键存储。被映射的消息包含相同的键，当它传入 saga 时，会找到与该键匹配的数据。当\
  \ saga 对象被实例化时，会调用此函数。\n\n```\npublic override void ConfigureHowToFindSaga()\n{\n\
  \    ConfigureMapping<ResponseCommand>(x => x.RequestId).ToSaga(x => x.RequestId);\n\
  }\n```\n\n## Saga 有什么用处？\n\nSaga 在工作流管理中扮演着关键角色。如果无法将数据映射到持久化数据，消息之间的工作流就无法实现。Saga\
  \ 的目的是持久化 saga 数据对象，这些对象由消息处理程序中的消息指示，从所选内容中填充数据。以下是 saga 的一些用途：\n\n- **保存消息状态/会话信息**：当消息启动时，消息处理程序将创建\
  \ saga 数据实例，该实例将在消息处理程序结束时保存。由消息处理程序数据负责将数据设置到对象的实例中。NSB 处理映射。以下截图显示了处理消息的代码：\n\n\
  ```\npublic void Handle(SendCommand message)\n{\n    ResponseCommand resp = new\
  \ ResponseCommand();\n    resp.RequestId = message.RequestId;\n    resp.state =\
  \ PaymentMessages.MessageParts.StateCodes.SentMyWCFClient;\n    ReplyToOriginator(resp);\n\
  \    Bus.Send(message);\n    RequestTimeout(TimeSpan.FromHours(3), message); //\
  \ 3 hours\n    Data.RequestId = message.RequestId;\n}\n```\n\n在此场景中，我们给消息三个小时的时间来执行其操作，然后使其超时。以下截图显示了提供超时的代码：\n\
  \n```\npublic class PaymentRequestSaga : NServiceBus.Saga.Saga<PaymentRequestData>,\n\
  \    IAmStartedByMessages<SendCommand>,\n    IHandleMessages<ResponseCommand>,\n\
  \    IHandleTimeouts<SendCommand>\n{\n    public override void ConfigureHowToFindSaga()...\n\
  \n    public void Handle(SendCommand message)\n    {\n        // ...\n        RequestTimeout(TimeSpan.FromHours(3),\
  \ message); // 3 hours\n        // ...\n    }\n\n    public void Handle(ResponseCommand\
  \ message)...\n\n    public void Timeout(SendCommand state)\n    {\n        ResponseCommand\
  \ resp = new ResponseCommand();\n        resp.RequestId = state.RequestId;\n   \
  \     resp.state = PaymentMessages.MessageParts.StateCodes.Timeout;\n        ReplyToOriginator(resp);\n\
  \        MarkAsComplete();\n    }\n}\n```\n\n由于 saga 模式能够持久化消息的状态数据，消息变成了各自独立、无连接的片段，并提供了一种将多个消息相互连接以执行端到端流程的方法。因此，saga\
  \ 成为交互的焦点。消息现在具有行为模式，因为它们比单一实例更有意义。它们现在具有很长的生存时间，因为即使单个消息不再可用，代表该消息数据的 saga 数据仍然会继续存在，直到被标记为销毁。\n\
  \n这些示例表明，在 5.0 版本中，总线配置是作为一个对象创建的，配置值被添加到该对象的实例中。总线配置可以作为配置传递给函数，以便反复利用，实现总线配置的重用。\n\
  \n较新版本中 NServiceBus 扩展的其他功能还包括新增的 NSB 包。其中一个包是 `NServiceBus.NLog`，它专门用于在 NSB 5.0\
  \ 及以上版本中使用 NLog。它用于扩展 NSB 的日志记录能力，以记录适用于端点、消息和服务的更多信息。有关 `NServiceBus.NLog` 包的详细使用，请参见\
  \ `http://docs.particular.net/nservicebus/logging-in-nservicebus`。我们将在本章后面演示该代码的用法。\n\
  \n## Saga 工作流\n\nSaga 的目的是提供工作流。它提供 saga 数据的持久化，以便消息可以返回 saga，并有一个指向原始消息的参考点。\n\n\
  本节中的源代码位于 *CreditCardApproval – v5* 部分。它使用 NSB 5.0 版本在 Visual Studio 2012 中编译。项目将如下所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_53_0.png)\n\n这里我们有以下项目：\n\n- `AppCommon`：这包含\
  \ Windows 窗体的 ViewModel 和上下文。\n- `AppForAccountingDept`：这接收与信用卡审批相关的采购订单号。\n- `CreditCardApproval`：这审批信用卡。\n\
  - `CreditCardSubmit`：这提交信用卡以供审批。\n\n## NServiceBus Saga 架构\n\n- `CreditCardMessages`：这包含项目的公共消息。\n\
  - `CreditCardSaga`：这是信用卡 saga，通过使用消息处理和 saga 数据来指导工作流和消息路由。\n\n消息流（它完成了所有工作，即工作流）将从\
  \ `CreditCardSubmit` 项目开始。此窗体将向 saga 提交信用卡，saga 将保存其状态并将其转发给 `CreditCardApproval`\
  \ 项目。`CreditCardApproval` 窗体将批准或拒绝该卡，并将响应发送回 saga。saga 将检索先前的消息并将其传递回 `CreditCardSubmit`\
  \ 窗体，如果获得批准，则会将其发送到 `AppForAccountingDept` 项目。消息流如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_54_0.png)\n\
  \n这是一个非常简单的工作流，因为它跟踪信用卡是否获批。通过使 saga 数据持久化，它允许持久化的 saga 数据状态在单一点路由消息并管理消息信息。saga\
  \ 数据将包含必需的 ID、发起方和 `OriginalMessageId`，以确保能够响应原始客户端。这些字段确保返回始终可用。我们在下图中看到这些字段：\n\
  \n\n![](img/8188651cea6a881a16242b395a81399a_55_0.png)\n\nSaga 数据是通过使用 IContainSagaData\
  \ 接口来存储的。即使这三个字段没有显式定义，IContainSagaData 接口也会在存储中定义它们。不要修改这些字段，因为 NServiceBus 使用它们。主键是另一个在所有\
  \ saga 中用于从消息查找 saga 数据的字段。在此情况下，我们使用 RequestId，它将始终包含来自 [Unique] 注解的唯一值。我们可以在以下代码中看到这一点：\n\
  \n```\npublic class CreditCardRequestData : IContainSagaData\n{\n    /***\n    *\
  \ Gets/sets the Id of the process. Do NOT generate this value in your code.\n  \
  \  The value of the Id will be generated automatically to provide the\n    best\
  \ performance for saving in a database.\n    * ***/\n    public Guid Id { get; set;\
  \ } // Required\n    /***\n    * Contains the return address of the endpoint that\
  \ caused the process to run.\n    * ***/\n    public string Originator { get; set;\
  \ } //Required\n    /***\n    * Contains the Id of the message which caused the\
  \ saga to start.\n    This is needed so that when we reply to the Originator, any\n\
  \    registered callbacks will be fired correctly.\n    * ***/\n    public string\
  \ OriginalMessageId { get; set; } //Required\n\n    [Unique]\n    public Guid RequestId\
  \ { get; set; } // Unique ID to lookup Request message\n    public string Card {\
  \ get; set; }\n    public decimal Cost { get; set; }\n    public bool RequiresApproval\
  \ { get; set; }\n    public bool Approved { get; set; }\n}\n```\n\n超时也可以用于为 saga\
  \ 安排每日任务以完成其清理和维护工作。例如，我们可以每天向运营发送电子邮件，报告 saga 当天处理的邮件数量以及错误队列中是否有报告的邮件。在这里，我们给信用卡审批人\
  \ 60 秒的时间进行审批。以下屏幕截图显示了此代码：\n\n```\npublic void Handle(SubmitRequestCommand message)\n\
  {\n    logger.Info(\"--------CreditCardSaga Handle-------\" + message);\n    \n\
  \    // We give the Approver 60 seconds to respond\n    RequestTimeout<TimeoutMessage>(TimeSpan.FromSeconds(60));\n\
  }\n```\n\nSaga 的目的是通过 saga 数据的状态来管理消息的工作流。Saga 将由 `IAmStartedByMessages<>` 中定义的消息或多个消息启动。后续消息在\
  \ `IHandleMessages<>` 中定义。超时有一个特殊的消息处理器，称为 `IHandleTimeouts<>`。我们可以在以下类图中观察到这一点：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_57_0.png)\n\n为了保存 saga 数据，数据需要映射到消息。NSB\
  \ 会完成大部分映射工作，但它需要定义将用于将数据映射到消息的消息 ID。在我们的 saga 数据中，我们使用 RequestId 实例作为消息的数据主键。在\
  \ 4.0 版本中，我们将此功能映射为使用 RequestId 实例来映射消息 ApproveRequestCommand 和 DenyRequestCommand，如以下代码所示，使用\
  \ ConfigureHowToFindSaga()：\n\n```\npublic override void ConfigureHowToFindSaga()\n\
  {\n    ConfigureMapping<ApproveRequestCommand>(x => x.RequestId).ToSaga(x => x.RequestId);\n\
  \    ConfigureMapping<DenyRequestCommand>(x => x.RequestId).ToSaga(x => x.RequestId);\n\
  }\n```\n\n在 5.0 版本中，我们将此功能映射为使用 RequestId 实例来映射消息 ApproveRequestCommand 和 DenyRequestCommand，如以下代码所示，使用\
  \ `ConfigureHowToFindSaga(SagaPropertyMapper<> mapper)`：\n\n```\nprotected override\
  \ void ConfigureHowToFindSaga(SagaPropertyMapper<CreditCardRequestData> mapper)\n\
  {\n    mapper.ConfigureMapping<ApproveRequestCommand>(x => x.RequestId).ToSaga(x\
  \ => x.RequestId);\n    mapper.ConfigureMapping<DenyRequestCommand>(x => x.RequestId).ToSaga(x\
  \ => x.RequestId);\n}\n```\n\n这些消息由消息处理器处理，例如 `Handle(DenyRequestCommand message)`。Saga\
  \ 数据将从 NSB 中提取与消息的 RequestId 匹配的记录。NSB 只需要映射定义，它就会处理维护持久性和映射的记录，如以下代码所示：\n\n```\n\
  public void Handle(DenyRequestCommand message)\n{\n    logger.Info(\"----------CreditCardSaga\
  \ Handle----------\" + message);\n    var reply = new SubmitRequestReplyMessage\n\
  \    {\n        RequestId = Data.RequestId,\n        Approved = false\n    };\n\n\
  \    ReplyToOriginator(reply);\n    MarkAsComplete();\n}\n```\n\n## 消息流\n\n启动流程的源客户端将是\
  \ CreditCardSubmit。此客户端可以很容易地是一个网站或启动消息流程的另一种方式。SubmitRequestCommand 消息是 saga 的起始消息，该消息从\
  \ CreditCardSubmit 项目发送。它在 CreditCardSubmit 项目的 App.config 文件中定义为发送到 saga，如以下代码所示：\n\
  \n```\n<UnicastBusConfig ForwardReceivedMessagesTo=\"MyAudits\">\n  <MessageEndpointMappings>\n\
  \    <add Endpoint=\"CreditCardSaga\" Messages=\"CreditCardMessages.SubmitRequestCommand,\
  \ CreditCardMessages\" />\n    <add Endpoint=\"CreditCardSaga\" Messages=\"CreditCardMessages.IRequestExpiredEvent,\
  \ CreditCardMessages\" />\n  </MessageEndpointMappings>\n</UnicastBusConfig>\n```\n\
  \n我们可以在 MSMQ 中查看正在发送的消息，但如果 saga 正在运行，消息会处理得太快而无法观察。我们可以在不运行所有服务的情况下，通过在某个时间点拍摄快照来查看\
  \ saga 中的消息，如以下屏幕截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_60_0.png)\n\n\
  一旦 saga 启动，它就会处理 SubmitRequestCommand 消息。Saga 将使用默认值和消息信息填充数据。请注意，RequestId 在 saga\
  \ 数据中设置为与消息的 RequestId 实例匹配。这是为了将 saga 数据映射到 saga 处理的其他消息，但为了使此 RequestId 实例匹配，saga\
  \ 需要映射的每个消息中都必须设置此键。此代码如下所示：\n\n```\npublic class SolicitApprovalFromLevel1CommandHandler\
  \ : IHandleMessages<SolicitApprovalFromLevel1Command>\n{\n    public Context<ItemViewModel>\
  \ Context { get; set; }\n\n    public void Handle(SolicitApprovalFromLevel1Command\
  \ message)\n    {\n        Context.MarshalToUiThread(() => HandleOnUiThread(message));\n\
  \    }\n\n    private void HandleOnUiThread(SolicitApprovalFromLevel1Command message)\n\
  \    {\n        var item = new ItemViewModel\n        {\n            RequestId =\
  \ message.RequestId,\n            Card = message.Card,\n            Cost = message.Cost\n\
  \        };\n\n        Context.Items.Add(item);\n    }\n}\n```\n\n另请注意，在生产系统中，信用卡会被加密。如我们在上一章中所讨论的，NSB\
  \ 很容易处理数据的加密和消息的加密。这将按如下方式加载审批或拒绝的选择：\n\n![](img/8188651cea6a881a16242b395a81399a_63_0.png)\n\
  \nSaga 将读取并处理来自会计部门的类型为 RecordEncumbranceReplyMessage 的消息。Saga 将响应原始客户端 CreditCardSubmit，以便其可以使用采购订单号和状态进行更新。我们可以在\
  \ saga 消息处理器代码的以下屏幕截图中看到这一点：\n\n```\npublic void Handle(RecordEncumbranceReplyMessage\
  \ message)\n{\n    logger.Info(\"--------CreditCardSaga Handle------\" + message);\n\
  \    var reply = new SubmitRequestReplyMessage\n    {\n        RequestId = Data.RequestId,\n\
  \        Approved = true,\n        PurchaseOrderNumber = message.PurchaseOrderNumber\n\
  \    };\n\n    ReplyToOriginator(reply);\n    MarkAsComplete();\n}\n```\n\n源客户端将通过\
  \ saga 从会计部门应用程序接收采购订单，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_66_0.png)\n\
  \n在原始请求者收到采购订单后，消息即完成。对于拒绝和错误，消息流将类似。\n\n有人可能会问为什么消息流中有这么多工作。NSB 几乎完成了消息流和映射的所有工作。许多组织保存数据是为了处理错误。Saga\
  \ 具有处理消息、端点和服务中错误的大量基本错误处理机制。我们已经编写了超时代码，以便消息在特定时间内发生。\n\n\n\n\n\n![](img/8188651cea6a881a16242b395a81399a_69_0.png)\n\
  \n在向项目添加服务控制后，我们将其命名为 CreditCardApprove - v5 - ServiceInsight，我们可以通过 ServiceInsight\
  \ 获取有关 saga 及其消息的详细信息，其显示效果与以下屏幕截图类似：\n\n![](img/8188651cea6a881a16242b395a81399a_69_1.png)\n\
  \n## 特定服务平台\n\n在本章中，我们将重点关注 Particular Service Platform，其中包括 ServicePulse、ServiceControl、ServiceInsight\
  \ 和 ServiceMatrix。我们可以使用 ServicePulse 来获取 NServiceBus（NSB）端点、消息、saga 和服务的脉搏。这更像是一个生产监控产品，供运维人员检查正在运行的\
  \ NSB 组件。\n\nServiceInsight 是用于深入了解 NSB 端点、消息、saga 和服务的产品，以便深入排查问题并详细验证操作的正确性。ServiceMatrix\
  \ 是图形化开发者界面，可扩展到 Visual Studio 画布，用于生成 NSB 端点、服务和消息的代码。\n\n在本章中，我们将介绍：\n\n- ServicePulse\n\
  - ServiceControl\n- ServiceInsight\n- ServiceMatrix\n- 通过 ServiceMatrix 进行发布-订阅\n\
  - 通过 ServiceMatrix 进行 Sagas\n- 为 ServicePulse 引入自定义检查\n\n## 介绍 NSB 组件\n\n可以从 http://particular.net/\
  \ 许可许多工具，以帮助开发和监控 NSB 组件。NSB 组件包括端点、消息和服务。组件包括 IBus 上配置的任何项目。\n\nServiceMatrix 是可安装到\
  \ Visual Studio 2012 的扩展插件。该插件创建 NSB 画布，通过向导创建各种 NSB 组件，并生成用于 ESB 的 C# 代码。ServiceMatrix\
  \ 通过生成与 NSB Canvas 中设计的图表相匹配的代码来简化和标准化开发生命周期，并帮助开发人员通过 NSB Visual Studio 向导创建 NSB\
  \ 标准化代码。NSB 向导有助于学习不同部分如何构成从头到尾的 NSB 应用程序。ServiceMatrix 还创建骨架组件并关联生成的 C# 代码，以便开发人员以更少的精力运行端到端的\
  \ NSB 解决方案。\n\nServiceControl 是 NSB 的管理扩展控制器。其代码可从 https://github.com/Particular/ServiceControl\
  \ 下载。ServiceControl 是一个 Windows 服务，收集端点、消息和服务信息，并将其存储在本地 RavenDB 中。这样其他产品如 ServicePulse\
  \ 和 ServiceInsight 就可以访问信息以报告服务的运行状况并提供有关消息的详细信息。ServicePulse 通过心跳插件检查 NSB 应用程序的心跳，并提供自定义检查。它有一个仪表板，显示哪些\
  \ NSB 应用程序在生产环境中处于运行状态。ServiceInsight 提供消息、端点和服务的详细信息。它显示消息的详细图形流程和属性，包括端点和服务信息、超时、有效负载等。ServiceInsight\
  \ 允许深入挖掘消息传递。这些工具可从下载页面 http://particular.net/downloads 找到。虽然可以在没有这些工具的情况下监控、维护和构建\
  \ NSB 应用程序，但这些工具投入了大量工作来帮助开发人员理解、构建和维护 NSB 应用程序，以便更快地将构建更好的产品推向市场。\n\n我们将逐步介绍设置\
  \ ServicePulse，然后是 ServiceInsight，然后使用 ServiceMatrix 构建一些应用程序，供 ServicePulse 和 ServiceInsight\
  \ 检查。ServiceControl 是 ServicePulse 和 ServiceInsight 都需要使用的安装，以便收集其信息。我们将从 ServicePulse\
  \ 开始向我们展示仪表板，因为它是这些工具中最基础的。要运行本章中的任何应用程序，必须安装 ServiceControl、ServicePulse、ServiceMatrix\
  \ 和 ServiceInsight。您可以通过访问 http://particular.net/downloads 并点击 Download Now 按钮来下载这些产品，选择通过\
  \ Platform Installer 安装所有产品，该安装程序适用于 Windows 8.1 及其他桌面机器。对于某些服务器，如 Windows Server\
  \ 2008，此按钮可能无法使用，可能需要从此页面单独安装各个下载项。本章假设所有这些产品都已安装。\n\nServicePulse 将通过其在安装 ServicePulse\
  \ 时的设置来知道如何调用 JSON API 的此起点。请参阅以下屏幕截图，了解我们设置 ServiceControl API 实例的位置：\n\n![](img/8188651cea6a881a16242b395a81399a_76_0.png)\n\
  \n让我们看一个简单示例。我们可以从 https://github.com/Particular/NServiceBus.Msmq.Samples/tree/master/PubSub\
  \ 的发布-订阅 MSMQ 示例开始。\n\n我们需要通过 NuGet 添加 ServiceControl 插件以生成用于监控目的的 ServiceControl\
  \ 端点，否则将没有任何内容供 ServiceControl 监控。目前可用的插件如下：\n\n- ServiceControl.Plugin.DebugSession：可在\
  \ https://www.nuget.org/packages/ServiceControl.Plugin.Nsb4.DebugSession/ 找到 4.x\
  \ 版本，以及 https://www.nuget.org/packages/ServiceControl.Plugin.Nsb5.DebugSession/\
  \ 找到 5.x 版本。部署后，调试会话插件会将指定的调试会话标识符添加到端点发送的每条消息的标头中。这允许在 ServiceInsight 中关联、过滤并突出显示在\
  \ Visual Studio 中调试或测试运行期间发送的消息。\n\n2. 然后，我们可以在 ServicePulse 中检查心跳，以验证应用程序是否发出指示可用性的心跳。我们通过\
