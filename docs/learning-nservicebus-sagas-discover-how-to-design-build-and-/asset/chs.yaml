  \n## 理解 ServiceInsight 及其功能\n\nServiceInsight 提供对特定消息的详细洞察。它提供详细流程、时序和错误处理，以及重试消息、排序消息、查看其标头、查看其\
  \ saga、复制标头、复制消息等功能。\n\n我们将在构建的 ServiceMatrix 示例中进一步探索这一点，但我们需要熟悉 ServiceInsight\
