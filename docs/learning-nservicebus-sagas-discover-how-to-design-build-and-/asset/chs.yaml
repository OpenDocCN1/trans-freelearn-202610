  \         if (DateTime.Now.Second % 2 == 0)\n            {\n```\n\n## ASP.NET MVC\
  \ 简介\n\n**模型-视图-控制器（MVC）**是实现用户界面最常见的软件设计模式。ASP.NET MVC 是微软在 ASP.NET 中实现 MVC 软件设计模式的框架。通过复用已被他人验证和测试的已知设计模式与框架进行开发，可以为任何应用程序带来大量已知组件的可复用性。\n\
  \n通过将逻辑拆分为控制器（控制器具有 `session`、`request` 和 `response` 辅助函数），同时传递模型（即视图模型，其中包含我们希望呈现到视图中的信息），可以将大部分逻辑和暴露面从浏览器中移开，从而暴露\
  \ API。我们还将对许多模型对象使用 Microsoft Entity Framework（EF）。\n\n微软推荐使用 **语言集成查询（LINQ）** 和\
  \ EF 来防止传统的 SQL 注入攻击。网页 https://msdn.microsoft.com/en-in/library/bb308959.aspx 还讨论了可以在\
  \ EF 中实施的其他安全措施。EF 并不能缓解所有注入攻击（例如 EF 注入），但正确组合使用 EF 和 LINQ，可以缓解许多常见的 SQL 注入攻击。其原因是，现在注入只能通过\
  \ LINQ 和 EF 对象发生，而不是通过任何开放的 SQL 命令，从而将攻击面从一系列广泛的命令缩小到一个对象，以及一个可能只能在 MVC 控制器中访问的集合。互联网上运行着许多脚本工具，例如\
  \ SQLNinja。请访问 http://sqlninja.sourceforge.net/ 来找出任何不安全的 SQL 命令。\n\n然而，大多数工具并非为标记\
  \ EF 攻击向量而构建。请访问 http://www.slideshare.net/rhelton_1/sql-injection-amp-entity-frameworks\
  \ 了解更多信息。\n\n使用对象关系映射器（ORM）（如 EF）的理由还有很多，参见 http://karwin.blogspot.com/2009/01/why-should-you-use-orm.html。其中一些原因包括：\n\
  \n- **生成样板代码**：EF 从 SQL Server 数据库和表生成对象，从而创建可用于创建、更新、读取和删除表中字段的样板代码。\n- **支持面向对象**：EF\
  \ 对象支持常见的面向对象编程设计和方法论，与 PIE（多态-封装-继承）一样简单，并且支持可重用性。\n- **加速开发**：从数据库生成代码并在应用程序中使用，可能比从头创建自定义代码快得多。我们可以在下面的图表中看到\
  \ MVC 组件的交互：\n\n![](img/8188651cea6a881a16242b395a81399a_107_0.png)\n\n那么，为什么在 NSB\
  \ 书中要讨论 MVC-EF 呢？这是因为大多数官方 NSB 示例都使用 MVC。我们将查看一些在 MVC 中扩展的示例，这些示例包含了微软在 EF 和 WCF\
  \ 方面的最佳实践。\n\n为了查看表以及与表相关的队列，我们使用 Kendo 网格。Packt 出版社出版了许多关于 Kendo 的书籍，例如《Kendo UI\
  \ Grid》(http://www.packtpub.com/kendo-ui-grid/book)。一些 Kendo 示例也扩展自 http://www.codeproject.com/Articles/606682/Kendo-Grid-In-Action\
  \ 上提供的文件。\n\n## Saga 与 Web 服务\n\nNSB 提供集成的众多端点之一是 **Windows Communication Foundation（WCF）**\
  \ 端点。请访问 http://en.wikipedia.org/wiki/Windows_Communication_Foundation 了解更多信息。\n\
  \nWCF 是 .NET Framework 生态系统的一部分，它提供了用于构建互联的、面向服务的应用程序的运行时和一组 API。在 **简单对象访问协议（SOAP）**\
  \ 绑定中，它使用 **Web 服务描述语言（WSDL）**，该语言定义了 Web 服务与 Web 服务客户端之间的接口。基于 WSDL，XML 根据 WSDL\
  \ 规范创建，这样客户端和服务器就可以交换信息，无论它们的编程语言和平台是什么。它通过协议（通常是 HTTP 或 HTTPS）在服务器和客户端之间发送。绑定类型有多种；本书将主要讨论\
  \ SOAP 绑定，但如需了解更多的绑定类型，可以访问 http://msdn.microsoft.com/en-us/library/ms731092%28v=vs.110%29.aspx。例如，如果\
  \ WCF 客户端和服务都是使用 C# 构建的，我们可以考虑使用 NetTcpBinding 类，因为它在 .NET WCF 应用程序之间提供了高性能。更多信息请访问\
  \ http://msdn.microsoft.com/en-us/library/ms731092%28v=vs.110%29.aspx。\n\n为简单起见，本章我们将只处理\
  \ WCF 中的 SOAP Web 服务。\n\nWCF 是一个高度可扩展的框架，可以轻松集成到 NServiceBus 中。有关 NSB WCF 示例集成的更多信息，请访问\
  \ https://github.com/Particular/NServiceBus/tree/develop/IntegrationTests/WcfIntegration\
  \ 和 http://docs.particular.net/NServiceBus/how-do-i-expose-an-nservicebus-endpoint-as-a-web-wcf-service。\n\
  \n虽然微软的 WCF 被认为是实现 **面向服务的架构（SOA）** 指南组成部分的框架，但它并不是 ESB。WCF 并不包含实现 SOA 指南端到端解决方案所需的全部功能和设计模式（如\
  \ Saga）、持久化或其他开箱即用的功能。另一方面，将 NServiceBus 作为 ESB 与 WCF 的 Web 服务结合使用，会带来许多 WCF 和其他\
  \ Web 服务框架所无法提供的能力。\n\n## 源代码\n\n代码目录位于 `Payment_WCFService` 目录下。`WCFService` 作为\
  \ WCF 服务，用于测试客户端。\n\n然后，该解决方案在 Windows Server 2012 上的 Visual Studio 2012 中运行，并安装了\
  \ MSMQ、DTC、RavenDB、NServiceBus 4.0 引用和 SQL Server 2012 Express LocalDB。\n\n必须先运行\
  \ `WCFService`，客户端 `Payment_WCFService` 才能向其发送消息。\n\n## 创建 WCF 服务器\n\n我们首先在 Visual\
  \ Studio 中创建一个 `WCFServer` 项目，因为服务器需要先运行才能与客户端通信。通过从 NuGet 或 Package Manager Console\
  \ 添加 `NServiceBus.Host` 引用，项目中会生成若干 NSB 默认设置（位于 `App.config` 文件中），并创建包含 `AsA_Server`\
  \ 的 `EndpointConfig.cs` 文件，同时该项目将被设置为使用 `NServiceBus.Host.exe` 可执行文件运行。我们可以通过下面的截图看到这些文件的创建：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_109_0.png)\n\n当我们通过 NuGet 或 Package Manager\
  \ 向项目添加 NServiceBus.Host 引用时，项目还会被添加许多其他条目。这些其他条目如下：\n\n- 项目中会创建一个 EndpointConfig.cs\
  \ 文件，其中包含用于添加端点的默认设置。\n- 项目将被设置为以 DLL 形式运行，在从调试器运行时由 NServiceBus.Host.exe 可执行文件执行。\n\
  - 若干用于创建通用 AsA_Server 端点的默认设置将被添加到 App.config 文件中。\n\n从下面的截图可以看出，当我们添加 NServiceBus.Host\
  \ 引用时，它会将项目设置为使用 NServiceBus.Host.exe 可执行文件作为 DLL 运行：\n\n![](img/8188651cea6a881a16242b395a81399a_110_0.png)\n\
  \n我们将使用 NSB WCF 集成来节省我们这边的大量工作。为了使用此集成，我们需要一些与 NSB 和 WCF 相关的组件。具体如下：\n\n- Web 服务：这与\
  \ NServiceBus.WcfService<TRequest, TResponse> 类一起使用，我们在这个 Web 服务上定义请求和响应。我们将在此展示，名为\
  \ PayService 的服务将接收 PaymentMessage 消息作为请求，并以 ErrorCodes 作为响应。如下面的一行代码所示：\n  public\
  \ class PayService : WcfService<PaymentMessage, ErrorCodes>\n- 消息处理程序：这是处理来自 Web\
  \ 服务的消息并在集成中处理该消息所必需的。我们将此处理程序称为 PayHandler。\n- 请求和响应消息结构：这是 PaymentMessages 项目所必需的。\n\
  - NSB 与 WCF 的配置：这在 App.config 文件中是必需的。\n\n\n\n将 NSB 与 WCF 集成使用，与直接使用 WCF 类似，但又不尽相同。在\
  \ WCF 中，有四个基本步骤可以扩展。更多信息请访问 http://www.c-sharpcorner.com/UploadFile/dhananjaycoder/four-steps-to-create-first-wcf-service-for-beginners/。\n\
  \n创建 WCF 服务器的步骤如下：\n\n- 1. 创建服务协定。这通过接口定义了 WCF 客户端与 WCF 服务器之间可用的功能。\n- 2. 通过 App.config\
  \ 或 Web.config 公开带有元数据的终结点。我们通过配置公开终结点，以包含数据交换的方式。\n- 3. 实现服务。也就是说，我们向接口添加功能和数据对象。\n\
  - 4. 使用服务。或者换句话说，公开服务以供 WCF 客户端导入。\n\n在使用 NSB 与 NHibernate 时，NSB 负责处理 NHibernate\
  \ 与消息、终结点和服务之间的映射。在 WCF 集成中，NSB 也借助消息处理器和消息格式处理许多服务协定。\n\n我们可以在以下截图中观察到这些功能点，接下来将进一步讨论它们：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_111_0.png)\n\n接下来我们将添加消息。\n\n## 添加消息\n\
  \n现在，我们将按照以下截图所示，在解决方案中创建一个 `PaymentMessages` 项目：\n\n![](img/8188651cea6a881a16242b395a81399a_112_0.png)\n\
  \n我们将使用 `PaymentMessage` 请求消息，该请求需要是 NServiceBus IMessage 接口，包含两个类：一个用于为每条消息生成唯一\
  \ ID 的 Guid 方法，以及一个 `PaymentReq` 类：\n\n```\npublic class PaymentMessage : IMessage\n\
  {\n    public Guid EventId { get; set; }\n    public PaymentReq paymentReq { get;\
  \ set; }\n}\n```\n\n## 添加配置\n\n为 Web 服务配置 App.config 文件的任务仍然存在。此步骤类似于前面提到的使用元数据公开终结点。\n\
  \nApp.config 文件将定义 Web 服务的多个特征，例如侦听端口和 URL、服务的安全性以及服务的绑定类型。绑定类型定义终结点的通信机制，无论是基本\
  \ HTTP、MSMQ 还是其他机制。可在 http://msdn.microsoft.com/en-us/library/ms730879(v=vs.110).aspx\
  \ 找到相关列表以及有关 WCF 绑定的更多信息。\n\n我们可以手动编辑 App.config 文件，或使用随 Visual Studio 提供的 WCF 服务配置编辑器来配置该文件。\n\
  \n有关配置编辑器的更多信息，请访问：\n\nhttp://msdn.microsoft.com/en-us/library/ms732009(v=vs.110).aspx\n\
  \n现在，我们将通过配置编辑器打开 App.config 文件，以完成以下操作：\n\n- 建立服务器 URL（包括端口号），以作为 WCF 终结点供 WCF\
  \ 客户端使用\n- 建立绑定参数，以通过各种不同方式公开 WCF 服务终结点\n- 设置跟踪和日志记录，以便在传输和服务发生时进行查看\n\n我们首先打开项目的\
  \ App.config 文件，并设置 Web 服务将侦听的 URL 和端口，以开始配置终结点，如下面的截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_116_0.png)\n\
  \n请访问 http://msdn.microsoft.com/en-us/library/ms731734(v=vs.110).aspx 查看 WCF 配置架构。我们可以通过服务终结点编辑绑定，如下所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_118_0.png)\n\n## 添加跟踪\n\n关于本节是否必需可能存在一些争议，因为本节是\
  \ WCF 特有的，与 saga 或 NSB 无关。但是，如果 WCF 客户端和 WCF 服务器之间的 WCF 通信无法正常工作，问题可能与消息结构、网络、WSDL\
  \ 或任何其他因素有关。为了跟踪 WCF 中的问题，需要启用并设置跟踪功能。这也可以让我们看到通信的响应。但是，如果您的 WCF 功能正常且无需进行故障排除，则可以跳过本节。\n\
  \nWCF 中提供了服务跟踪实用工具，可用于查看 WCF Web 服务和 Web 客户端的图形、消息、网络调用、异常和活动。有关 Microsoft 服务跟踪查看器的更多信息，请参阅\
  \ http://msdn.microsoft.com/en-us/library/ms732023(v=vs.110).aspx。\n\n我们可以通过在 App.config\
  \ 文件中设置诊断节（以 <diagnostics/> 形式给出）来捕获客户端与服务器之间的消息，并通过设置将与库关联的侦听器和源来记录 App.config\
  \ 文件中的事件，如下所示：\n\n```\n<AuditConfig QueueName=\"audit\" />\n<system.serviceModel>\n\
  \    <diagnostics>\n        <messagelogging logEntireMessage=\"true\" logMalformedMessages=\"\
  false\" logMessagesAtServiceLevel=\"true\" logMessagesAtTransportLevel=\"true\"\
  \ maxMessagesToLog=\"30000\" maxSizeOfMessageToLog=\"30000\" />\n        <endToEndTracing\
  \ activityTracing=\"true\" messageFlowTracing=\"true\" />\n    </diagnostics>\n\
  \    <behaviors>\n        <serviceBehaviors>\n            <behavior name=\"Default\"\
  >\n                <serviceMetadata httpGetEnabled=\"true\" />\n               \
  \ <serviceDebug includeExceptionDetailInFaults=\"true\" />\n            </behavior>\n\
  \        </serviceBehaviors>\n    </behaviors>\n    <services>\n        <service\
  \ name=\"WCFServer.WebServices.PayService\" behaviorConfiguration=\"Default\">\n\
  \            <endpoint address=\"mex\" binding=\"mexHttpBinding\" contract=\"IMetadataExchange\"\
  \ />\n            <host>\n                <baseAddresses>\n                    <add\
  \ baseAddress=\"http://localhost:9009/services/paymessage\" />\n               \
  \ </baseAddresses>\n            </host>\n        </service>\n    </services>\n</system.serviceModel>\n\
  </configuration>\n```\n\n以下截图展示了我们如何配置消息日志记录，以及我们将使用哪种跟踪侦听器来写入日志：\n\n![](img/8188651cea6a881a16242b395a81399a_120_0.png)\n\
  \n我们可以通过在服务跟踪查看器中打开 svc 日志文件来查看客户端与服务器之间发送的消息。如下面的截图所示，我们可以看到 SOAP 消息，包括标头和正文，这正是\
  \ WCF 服务器所接收的内容。\n\n## 查看 Web 服务\n\n在 Visual Studio 2012 中运行 Web 服务时，我们可以通过浏览器访问\
  \ http://localhost:9009/services/paymessage 来查看该服务。它将为 WCF 客户端提供一些简单的说明，如下面的截图所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_122_0.png)\n\n我们还可以通过访问 http://localhost:9009/services/paymessage?singleWsdl\
  \ 页面来查看 WSDL：\n\n## 部署时的注意事项\n\n请注意，对于大多数生产系统，在使用 Web 服务时，始终建议安装数字证书，以加密管道并验证客户端和服务器的身份。\n\
  \n对于真实的生产系统，WCF 客户端与 WCF 服务器之间的所有通信都必须使用 SSL 确保安全，并且您应该使用基于 WS-Security 的应用程序来检查您的\
  \ Web 服务。\n\n```\npublic ActionResult SendWCF(int id)\n{\n    var user = new XMLLoads().GetPayments().Where(p\
  \ => p.Id == id).FirstOrDefault();\n    var message = new XMLLoads().GetMessages().Where(p\
  \ => p.EventId == user.EventId).FirstOrDefault();\n    ServiceReference1.WcfServiceOf_PayMessage_ErrorCodesClient\
  \ client1 =\n        new ServiceReference1.WcfServiceOf_PayMessage_ErrorCodesClient();\n\
  \    ErrorCodes returnCode = client1.Process(message);\n    user.errorCode = returnCode;\n\
  \    return View(user);\n}\n```\n\n这将是浏览器中的 Kendo 网格，它提供一个选择项，用于将数据发送到 WCF 服务。浏览页面时，网格将填充以下数据，并提供一个将消息发送到\
  \ WCF 服务的选项，如下表所示：\n\n| Event Id | Action |\n|---|---|\n| 8b265223-dc9e-4789-a6df-69d19f644ad7\
  \ | Call_Payment_Service |\n| 3721ba5d-4733-4d98-a5e2-8e8afa3e61f4 | Call_Payment_Service\
  \ |\n| 1ac188ec-4b2e-436c-b989-db88c65db1fa | Call_Payment_Service |\n| 9bf180fa-f8f4-4b2b-8fac-cca73a4e2cab\
  \ | Call_Payment_Service |\n| ee2c56f7-6d42-4314-bce5-4825ed294437 | Call_Payment_Service\
  \ |\n\nSendWCFPay.cshtml 文件中的 Kendo 网格脚本如下所示：\n\n```\n<h2>Send Payment Message to\
  \ WCF</h2>\n<script type=\"text/javascript\">\n    $(document).ready(function ()\
  \ {\n        var modelData = @Html.Raw(Json.Encode(Model))\n        $(\"#grid\"\
  ).kendoGrid({\n            pageable: true\n          , sortable: true\n        \
  \  , silectable: true\n```\n\n\n\n为简单起见，MVC 控制器只是读取 XML 文件（这些文件创建在 C:\\temp\\ 的一个文件夹中），以便在前端显示，并可选择发送到\
  \ Payment WCF 服务。在生产环境中不建议使用这种 XML 文件的方式，因为通常这些文件会由面向客户的前端支付界面填写客户信息。我们选择这种方法是为了固化这些接口并对其进行测试。而设计客户界面来填充消息并不属于本次工作的范围。在这种类型的测试中使用\
  \ XML 文件是有优势的，因为我们可以扩展这个示例来发送数百条消息，既可以检查性能，也可以通过客户界面填充单独的消息，而无需依赖前端。\n\n我们的基本架构是一个非常常见的设计，即\
  \ MVC 前端调用 WCF 客户端与 WCF 服务器进行交互。这种设计在一些订购网站上也很常见。例如，假设在一个披萨网站上，会弹出一个提示，上面写着**订单正在发送，请勿刷新**。由于这个示例同样没有与后端工作流解耦，如果这要成为一个没有通过\
  \ NSB 解耦的解决方案，我们很可能还得加上“支付正在发送，请勿刷新”的提示。在需要刷新页面的情况下，很多事情都可能出错。仅仅因为客户可能没有刷新他们的页面，并不意味着没有其他东西在刷新页面。\n\
  \n我们当前的架构如下：\n\n![](img/8188651cea6a881a16242b395a81399a_129_0.png)\n\n## Saga 开发\n\
  \n让我们在上述解决方案中构建一些 saga 处理，以将 MVC 前端与 WCF 客户端解耦。NSB 将充当这两个组件之间交互的中介。\n\n为什么使用 saga？因为它可以路由消息、执行超时处理并持久化状态。\n\
  \n上面的截图展示了使用 NServiceBus saga 的新工作流。它看起来可能有点复杂，但 NServiceBus 会在后台处理所有复杂性。对于控制器来说，它只是发出消息，然后就不再管了。如果它需要知道消息的状态，只需在数据库上执行一次\
  \ EF 查询。但它仍然会把消息发送出去，让 NSB 来处理它。\n\n## 源代码\n\n代码的目录位于 SagaPaymentClient 目录下。\n\n\
  MVCApp - WCF 项目用作客户端，通过 saga 发送 WCF 消息。\n\n该解决方案是在 Windows Server 2012 上使用 Visual\
  \ Studio 2012 构建的，并且还在 Windows 8.1 上运行的 VS 2012 中进行了测试，安装了 MSMQ、DTC、RavenDB、NServiceBus\
  \ 4.0 版引用和 SQL Server 2012 Express LocalDB。\n\n以下是加入 saga 后新项目的样子：\n\n![](img/8188651cea6a881a16242b395a81399a_130_0.png)\n\
  \n现在不同的是，MVC 应用程序将与 saga（即 MySaga）交互，而 saga 将与 WCF 客户端和 MVC 应用程序通信。这将使前端与 WCF 客户端解耦，并让\
  \ MVC 直接从 saga 消息中接收状态反馈。\n\n## 将 NServiceBus 添加到 MVC\n\n接下来，我们将添加总线，并把 `BasicPaymentClient`\
  \ 文件夹和项目扩展为 `SagaPaymentClient` 文件夹和项目。区别如下：\n\n- 我们将把 WCF 客户端从 MVC 控制器中重构出来，并将其移入一个新的消息处理器中。\n\
  - 我们将创建一个数据库来跟踪消息的状态。saga 数据将保存在 `nservicebus` 表中。请确保在运行 saga 代码时创建该表。\n- 我们将创建一个新的消息处理器，并将\
  \ WCF 客户端代码放入其中。这段从 WCF 客户端到 WCF 服务器的代码将尽可能与前端代码分离，以保持 `PayMessage` 类与前端完全分离。\n\
  - 我们将在 MVC 中创建一个新的消息处理器，当它从端点接收到新状态时，会用消息状态更新数据库。在下一节中，我们将在测试时查看消息处理器和 saga 处理器的代码。\n\
  - `NServiceBus.Testing` 通过消息处理器和 saga 发送消息来提供测试功能。这包括消息处理器和 saga 可以执行的任何操作，包括消息头处理和依赖注入。有关一些基本示例，请参阅\
  \ http://docs.particular.net/NServiceBus/unit-testing 。`NServiceBus.Testing` 的源代码请访问\
  \ https://github.com/Particular/NServiceBus/tree/develop/src/ 。\n\n开始单元测试最基本的方法是在\
  \ Visual Studio 中创建一个单元测试项目，即向现有解决方案添加一个新的单元测试项目。请访问 http://msdn.microsoft.com/en-us/library/hh598957.aspx\
  \ 并将其添加为超链接。**新建项目**窗口如下所示：\n\n## 消息处理器单元测试\n\n消息处理器的代码将位于单元测试本身中。在我们的 UnitTestHandlers\
  \ 项目中包含各种单元测试，我们将逐步分析 EventMessageHandler。EventMessageHandler 通过 saga 从 MVCApp 接收\
