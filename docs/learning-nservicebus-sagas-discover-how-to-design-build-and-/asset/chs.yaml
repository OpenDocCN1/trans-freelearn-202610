  \  - Veena Mukundan\n\n## About the Reviewers\n\n**Neil Bourgeois** is a software\
  \ engineer at Pentair Technical Solutions, where he leads the Engineering Software\
  \ team. Solutions he has architected and implemented include a high-volume metering\
  \ and billing system for the utilities industry and an industry-leading 3D engineering\
  \ tool for the industrial heat-tracing field. He applies the discipline of Agile\
  \ software development to his work and believes that great software comes from great\
  \ team cultures. He strives to lead his teams to great cultures.\n\n**Prashant Brall**\
  \ is a principal consultant and senior software architect/developer who uses Microsoft\
  \ technologies. He works for Veritec Pty Ltd (www.veritec.com.au) in Canberra, Australia,\
  \ and has been developing software for the past 18 years. He enjoys writing about\
  \ his experiences on his blog at https://prashantbrall.wordpress.com.\n\nPrashant\
  \ has also reviewed the book *Instant AutoMapper*, Packt Publishing.\n\nIn his leisure\
  \ time, he enjoys watching movies with his wife and playing musical instruments.\n\
  \n> I would like to thank my fantastic wife, Jhumur, for being my best friend and\
  \ for all the love and support she has given me. I would also like to thank my parents\
  \ Mr. Hem Brall and Mrs. Prabha Brall for all the guidance, love, and care they\
  \ have given me.\n\n- Workflow retries: Messages, or endpoints, can be told to retry\
  \ a number of times until they completely fail and send an error. The error is automatically\
  \ returned to an error queue. For instance, a web service message can be sent to\
  \ a bank, and it can be set to retry the web service every 5 minutes for 20 minutes\
  \ before giving up completely. This is useful during any network or server issues.\n\
  - Monitoring: NSB ServicePulse can keep a finger on the pulse of its services. Other\
  \ monitoring can easily be done on the NSB queues to report on the number of messages.\n\
  - Encryption: Messages between services and endpoints can be easily encrypted.\n\
  - High availability: Multiple services or subscribers could be processing the same\
  \ or similar messages from various services that are living on different servers.\
  \ When one server, or service, goes down, others could be made available to take\
  \ over those that are already running.\n\nSagas are at the heart of the NServiceBus\
  \ (NSB) workflow. Sagas save the message state in the form of saga data. They can\
  \ retrieve the data as it is related to a message to update the message or data.\
  \ This allows the NSB workflow to control the flow of data and messaging from end\
  \ to end and correlate saved data to messages in the saga.\n\nMessages are the means\
  \ to transfer interaction and data between services in a service-oriented architecture\
  \ (SOA). Sagas correlate, save, route, and manage processes that are started by\
  \ these messages between services. Sagas even provide timeouts to ensure that messages\
  \ do not live forever in a system.\n\nSagas provide decoupling between frontend\
  \ websites and backend processes. It allows workflow to transfer so that a website\
  \ can continue to do its work without having to wait for processes to return, such\
  \ as the dreaded message \"Please do not refresh this website as we bill your credit\
  \ card\".\n\nNSB doesn't stop at development on Windows servers and desktops, but\
  \ plays a big part in cloud development, for example with Microsoft Azure and the\
  \ Microsoft cloud. NSB uses Service Bus as well as storage queues, SQL Server, and\
  \ other storage containers. As the cloud is used more and more, NSB plays a key\
  \ part in Software as a Service, as it is the premier framework for ESB in the C#\
  \ clouds.\n\nEven if your cloud solution doesn't end up being a C#-compatible cloud,\
  \ as many might hide the software running behind the cloud as being proprietary,\
  \ NSB is a component for those that will do hybrid solutions, such as keeping data\
  \ resident on-site. The connection to the cloud then will likely be via web services,\
  \ and NSB sagas might likely provide the workflow to those web services.\n\nNServiceBus\
  \ is the C# platform of choice for those that require workflows, sagas, high availability,\
  \ high performance, monitoring, encryption, rapid deployment, and many more features\
  \ that can only be found in this framework when building C# solutions.\n\n## What\
  \ this book covers\n\nChapter 1, Introduction to Sagas, discusses NServiceBus and\
  \ a basic design pattern that it uses, known as sagas, which is used to save states\
  \ of messages. We will discuss the benefits of sagas and what it brings to the table\
  \ with regard to software design.\n\nChapter 2, NServiceBus Saga Architecture, expands\
  \ on the uses of sagas for persistence, timeouts, message durability, and message\
  \ handling. We will discuss various message exchange patterns through examples to\
  \ include gateway and cluster managing. These are important concepts as they drive\
  \ the high availability and high performance that NSB brings to the table.\n\nChapter\
  \ 3, The Particular Service Platform, is an overview of the Particular website-associated\
  \ tools for NServiceBus. We will discuss building sagas through the ServiceMatrix\
  \ tool, which is a Visual Studio extension tool for visually designing NSB endpoints,\
  \ messages, and services. The other tools that we will discuss at length as they\
  \ apply to sagas are the ServicePulse to monitor the endpoint availability during\
  \ production, and ServiceInsight to take a deep dive into the functionality and\
  \ properties of endpoints, services, and messages as they execute.\n\nChapter 4,\
  \ Saga Development, focuses on various useful constructions of sagas and message\
  \ handlers. The purpose of sagas will be discussed as the discussion goes into the\
  \ need for extending and coordinating transactional integrity using sagas. The chapter\
  \ then morphs into a discussion of NServiceBus, using integrated pre-built WCF bridges.\
  \ While some might consider it unusual to discuss WCF in a saga chapter, sagas become\
  \ an intermediate for coordinating WCF and NServiceBus work. We can decouple the\
  \ workflow from the frontend for interaction with backend processes through message\
  \ handling. Sagas provide the means to persist the state information of the messages.\
  \ This discussion will also handle other queuing sources as well to include RabbitMQ\
  \ and ActiveMQ.\n\n\n\n\n\n## 本书读者对象\n\n本书面向希望学习如何使用 NServiceBus 开发，并探索 NSB  Saga（即\
  \ NSB 的工作流核心）的初级或中级 C# 开发者。本书将讨论许多入门知识，并深入探讨 Saga，同时使用多种 Microsoft 框架，这也会为你提供使用\
  \ WPF、WCF、ASP.NET MVC 和 Entity Framework 的一些基础知识。\n\n## 约定\n\n在本书中，你会发现多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义说明。\n\
