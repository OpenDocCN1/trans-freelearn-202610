  \ - Sagas 目录中。\n在 Windows 8.1 中，您可能需要以管理员身份运行 Visual Studio 2012。在 Windows Server\
  \ 2008 和 Windows Server 2012 上运行 Visual Studio 2012 时，您可能不需要以管理员身份运行 Visual Studio\
  \ 2012。\n\n## 创建 ServiceMatrix 解决方案\n\n我们将通过导航到 Tools | Extensions and Updates 在\
