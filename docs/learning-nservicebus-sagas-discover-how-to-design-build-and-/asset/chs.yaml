  我们将继续创建 UnitTestHandler2.cs 文件，然后添加头部信息和 [TestMethod]。这个文件将位于 UnitTestHandlers 项目的\
  \ SagaPaymentClient 下。\n\n创建完文件的基本结构后，我们将创建一个普通消息 SendCommand，其中包含一个 GUID 和消息在到达消息处理器之前应处于的状态，命名为\
  \ command。代码如下：\n\n```\nnamespace UnitTestHandlers\n{\n    [TestClass]\n    public\
  \ class UnitTestHandler2\n    {\n        /***\n         *\n         * Test the message\
  \ handler for MYWCFClient\n         * This will call the WCF Service for a completion\n\
  \         *\n         *****/\n        [TestMethod]\n        public void Run()\n\
  \        {\n            Test.Initialize();\n            /*****\n             *\n\
  \             * Create a Command message\n             * used to look up an XML\
  \ Message file\n             * on Disk, send to WCF Server\n             *\n   \
  \          *****/\n            SendCommand command = new SendCommand();\n      \
  \      command.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\");\n\
  \            command.state = MyMessages.MessageParts.StateCodes.SentMyWCFClient;\n\
  \n            // The Test code\n            Test.Handler<EventMessageHandler>()\n\
  \                .ExpectReply<ResponseCommand>(m => m.state == MyMessages.MessageParts.StateCodes.CompleteMyWCFClient)\n\
  \                .OnMessage<SendCommand>(command);\n        }\n    }\n}\n```\n\n\
  我们看到命令消息被传入 `.OnMessage<SendMessage>(command)` 方法，并且 Reply 方法中传入了 ResponseMessage\
  \ 对象，其状态被设置为 CompleteMyWCFClient。在 Debug 模式下调用单元测试时，我们甚至可以在处理器中传入这条消息，观察它的行为，如下所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_137_0.png)\n\n这使我们能够通过 TDD 在单元测试代码中设计和调试处理器功能。在测试处理器或\
  \ saga 时，可以使用许多规则。例如，ExpectNotReply 用于期望处理器不会以特定消息进行回复。\n\n要了解 NServiceBus.Testing\
  \ 中可用的功能，我们可以执行以下步骤：\n\n- 1. 尝试输入一些内容，然后将鼠标悬停在 IntelliSense 上。\n\n![](img/8188651cea6a881a16242b395a81399a_137_1.png)\n\
  \n```\nif (returnCode == ErrorCodes.None)\n{\n    command.state =\n        StateCodes.CompleteMyWCFClient;\n\
  }\nelse\n{\n    command.state =\n        StateCodes.MyWCFClientFail;\n}\n\nBus.Reply(command);\n\
  Console.WriteLine(\"Success\");\n}\n```\n\n如果 XML 文件不存在会发生什么？下面是当时使用的代码：\n\n```\n\
  // if no XML, just fail\nif (payMessage == null)\n{\n    command.state = StateCodes.MyWCFClientFailXML;\n\
  \    Bus.Reply(command);\n    Console.WriteLine(\"No XML Found\");\n}\nelse\n{\n\
  \    ... normal path }\n```\n\n测试完这段代码后，我们可以将经过测试的代码（不含单元测试部分）用于在新项目中创建类，并将其用作消息处理器。通过在单元测试中开发代码，再将测试通过的产品放入应用程序项目中，这样可以节省时间。单元测试项目还可以作为备份，让我们了解代码在测试通过时的样子。\n\
  \n## Saga 处理器单元测试\n\n让我们开始在消息处理器中测试上一节的 saga 代码：\n\n```\n// The Test code\nTest.Handler<EventMessageHandler>()\n\
  \    .ExpectReply<ResponseCommand>(m => m.state ==\nPaymentMessages.MessageParts.StateCodes.\n\
  CompleteMyWCFClient)\n    .OnMessage<SendCommand>(command);\n```\n\n\n正如我们所见，NServiceBus\
  \ 测试 API 使用的是 Fluent API 规范风格的测试模式，而非大多数人通常会使用的、属于 nunit 或其他 xunit 类型框架的传统断言风格。\n\
  \n我们现在将开始测试来自 UnitTestHandlers 项目和 UnitTestSaga2.cs 文件的 saga 代码。\n\n需要注意的一点是，如果\
  \ saga 实体对象在不同的函数调用中通过 MarkAsComplete() 方法被删除，这些应该分别进行测试。这是因为一旦我们删除了对象，就无法再次删除它。例如，在我们的测试中，我们将使用以下内容：\n\
  \n```\n[TestMethod]\npublic void Run()\n{\n    Test.Initialize();\n\n    /**\n \
  \    * State sent to Saga\n     * ***\n    */\n    SendCommand command = new SendCommand();\n\
  \    command.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\");\n \
  \   command.state = MyMessages.MessageParts.StateCodes.SentMyWCFClient;\n\n    /**\n\
  \     * Response from WCF and to MVCApp\n     * ***\n    */\n    ResponseCommand\
  \ resp = new ResponseCommand();\n    resp.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\"\
  );\n    resp.state = MyMessages.MessageParts.StateCodes.CompleteMyWCFClient;\n\n\
  \    Test.Saga<MyTestSaga>()\n        .ExpectReplyToOriginator<ResponseCommand>()\n\
  \        .ExpectSend<SendCommand>()\n        .When(s => s.Handle(command))\n   \
  \     .ExpectReplyToOriginator<ResponseCommand>()\n        .When(s => s.Handle(resp))\n\
  \        .AssertSagaCompletionIs(true);\n\n    Test.Saga<MyTestSaga>()\n       \
  \ .ExpectReplyToOriginator<ResponseCommand>()\n        .ExpectSend<SendCommand>()\n\
  \        .ExpectTimeoutToBeSetIn<SendCommand>((state, span) => span == TimeSpan.FromHours(3))\n\
  \        .When(s => s.Handle(command))\n        .ExpectReplyToOriginator<ResponseCommand>()\n\
  \        .WhenSagaTimesOut()\n        .AssertSagaCompletionIs(true);\n}\n```\n\n\
  现在数据库部分已经创建，我们需要在 MSMQ 中创建 mysaga 端点。这只需按如下方式执行 MySaga 解决方案即可：\n\n![](img/8188651cea6a881a16242b395a81399a_143_0.png)\n\
  \n![](img/8188651cea6a881a16242b395a81399a_143_1.png)\n\n我们可以在 MSMQ Commander 窗口中看到端点已创建，如下所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_144_0.png)\n\n如果测试运行成功，则 mysaga 端点存在并且正在工作。我们可以看到测试程序的工作情况如下：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_144_1.png)\n\n数据库表，&lt;PayMessage&gt;，具有以下属性，如下所示：\n\
  \n|  | Column Name | Data Type | Allow Nulls |\n|---|---|---|---|\n| \U0001F511\
  \ | id | int | ☐ |\n|  | EventId | uniqueidentifier | ☐ |\n|  | error | varchar(50)\
  \ | ☑ |\n|  | state | varchar(50) | ☑ |\n\n## RabbitMQ for NSB\n\nRabbitMQ 是一个跨平台的消息框架，像\
  \ MSMQ 一样，可以在 Linux 和 Windows 操作系统上运行。\n\nRabbitMQ 比 MSMQ 具有更多功能，例如路由、虚拟主机和强大的管理工具集。它可以在\
  \ Linux 上运行并且扩展性非常好。对于大型企业系统（尤其是在异构网络环境中），你应该认真考虑 RabbitMQ。RabbitMQ 可以在 NSB 配置中轻松替换\
  \ MSMQ 队列系统。\n\n对于 RabbitMQ 的管理，可以轻松安装 Web 管理界面。然而，如果需要命令行界面，则需要安装 Python 语言。\n\n\
  为了重温前面章节中的一些参考资料，请查看以下内容：\n\n- **Local host management site**: 这可以在 http://localhost:15672/#/.\
  \ 找到。\n- **Documentation**: 这可以在 http://www.rabbitmq.com/documentation.html. 找到。\n\
  - **Windows installation**: 这可以在 https://www.rabbitmq.com/install-windows.html.\
  \ 找到。\n- **NServiceBus samples**: 这些可以在 https://github.com/Particular/NServiceBus.RabbitMQ.Samples.\
  \ 找到。\n- **Development tools site for RabbitMQ**: 这可以在 http://www.rabbitmq.com/devtools.html.\
  \ 找到。\n- **NServiceBus.RabbitMQ source code**: 这可以在 https://github.com/Particular/NServiceBus.RabbitMQ.\
  \ 找到。\n- **NServiceBus RabbitMQ hands-on lab**: 这可以在 http://particular.net/HandsOnLabs.\
  \ 找到。\n\n## Saga Development\n\n安装 RabbitMQ 后，我们可以使用 rabbitmq plugins 设置管理插件以启用\
  \ rabbitmq_management。这是为了使用 Web 管理 http://localhost:15672/#/queues 查看队列，如以下屏幕截图所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_148_0.png)\n\n我们可以通过在 RabbitMQ 命令提示符中输入\
  \ rabbitmqctl list_queues 来获取队列列表，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_148_1.png)\n\
  \n## ActiveMQ in NSB\n\nApache Active Message Queue（ActiveMQ）是 Apache 基金会基于 Java\
  \ 消息服务（JMS）的 JAVA 开源框架。访问 http://en.wikipedia.org/wiki/Apache_ActiveMQ 和 https://activemq.apache.org\
  \ 获取更多信息。它可以在机器上运行，无论是 Windows 还是 Linux，都在 Java 运行时环境（JRE）中。机器上必须运行 JAVA，并且 JAVA_HOME\
  \ 环境路径必须配置为指向 JRE 的根文件夹。ActiveMQ 的安装说明可以在 https://activemq.apache.org/getting-started#GettingStarted20-Download.\
  \ 找到。\n\n### The source code\n\n在本节中，我们将使用 ActiveMQ 解决方案。此解决方案与 RabbitMQ 类似，只是使用\
  \ ActiveMQ 而不是 RabbitMQ。\n\n将有三个基本步骤：\n\n- 1. 添加 NServiceBus.ActiveMQ 引用。\n- 2.\
  \ 将 NServiceBus 传输机制从 `<MSMQ>` 改为 `<ActiveMQ>`。\n- 3. 在 App.config 文件中设置 ActiveMQ\
  \ 传输配置。\n\n在 Windows 操作系统上下载后，我们将 Windows 二进制文件解压到 c:\\activemq\\ 目录。从命令提示符在 c:\\\
  activemq\\bin\\ 下运行 activemq.bat 批处理文件，将显示一系列命令以表明 ActiveMQ 正在运行。这在以下屏幕截图中显示：\n\n\
  ![](img/8188651cea6a881a16242b395a81399a_151_0.png)\n\n另一种选择是将 ActiveMQ 安装为 Windows\
  \ 服务，其中存在适用于 Win32 和 Win64 机器的安装脚本。对于 64 位 Windows Server，我们可以使用 c:\\activemq\\\
  bin\\win64\\ 中的 InstallService.bat。\n\n确保 RabbitMQ 未在后台作为 Windows 服务运行，因为它们使用相同的网络端口。此外，Microsoft\
  \ ServiceBus for Windows Servers 也会共享相同的 AMQP 端口，即端口 5672。ActiveMQ 的默认端口是 61616。可以使用\
  \ Microsoft 的 TcpView 检查端口，可以在 http://technet.microsoft.com/en-us/sysinternals/bb897437.\
  \ 找到。\n\n为了确保 ActiveMQ 正在运行，你可以通过浏览器使用 http://localhost:8161/admin 访问管理控制台。默认用户\
  \ ID 和密码均为 admin。请访问 http://activemq.apache.org/getting-started.html 查看文档。访问管理控制台时，你应该会看到如下屏幕截图：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_152_0.png)\n\n要在 Visual Studio 项目中使用\
  \ ActiveMQ for NServiceBus，必须安装 NServiceBus.ActiveMQ 的 NuGet 版本。前往 https://www.nuget.org/packages/NServiceBus.ActiveMQ/1.0.5\
  \ 查看如何将 PM> Install-Package NServiceBus.ActiveMQ 安装到项目中。确保 IBus 的配置设置为 ActiveMQ，如下所示：\n\
  \n```\nprotected void Application_Start()\n{\n    Configure.ScaleOut(s => s.UseSingleBrokerQueue());\n\
  \    _startableBus = Configure.With()\n        .DefaultBuilder()\n        .RijndaelEncryptionService()\n\
  \        .UseTransport<ActiveMQ>()\n        .UnicastBus()\n        .CreateBus();\n\
  \    Configure.Instance.ForInstallationOn<Windows>().Install();\n\n    _bus = _startableBus.Start();\n\
  \    AreaRegistration.RegisterAllAreas();\n\n    RegisterGlobalFilters(GlobalFilters.Filters);\n\
  \    RegisterRoutes(RouteTable.Routes);\n}\n```\n\n确保 App.Config 或 Web.Config 文件具有适当的连接字符串，以便\
  \ NServiceBus/Transport 字符串指向正确的 ActiveMQ 队列实例：\n\n```\n<connectionStrings>\n<add\
  \ name=\"NServiceBus/Transport\" connectionString=\"ServerUrl=activemq:tcp://localhost:61616\"\
  />\n</connectionStrings>\n```\n\n\n\n\n\n然后，我们用这个示例，通过少量修改将传输机制从 MSMQ 改成了 RabbitMQ。在测试部分，我们讨论了如何让\
  \ saga 和消息处理器变得相似，也讨论了如何对它们进行足够的改动以增强其用途。我们还简要讨论了众多 NServiceBus 测试规则，以便在单元测试环境中构建处理器，而暂不需要考虑端点问题。\n\
  \n在接下来的章节中，我们将会继续展示更多的代码片段和场景。我们还会更详细地讨论如何使用处理器来满足事务处理和错误处理的需求。在后面的讨论中，我们也会进一步介绍相关工具的使用。\n"
- "# 5 Saga 代码片段\n\n在本章中，我们将重点讨论 saga 中的代码片段。我们将介绍一个电子邮件和**安全文件传输协议（SFTP）**的示例，该示例将由\
  \ saga 代码中的每日定时器设置为超时。saga 代码将充当前端**Windows Presentation Foundation（WPF）**与执行电子邮件或\
  \ SFTP 的后端客户端之间的中介。使用 saga 作为前端和后端代码之间的中介，与外部服务器交互，将带来许多额外的好处和功能。外部服务器接口，例如电子邮件服务器或\
  \ SFTP 服务器，通常不受我们的控制，而是由外部运营方或组织（如银行）控制。因此，我们能处理的只有这些服务器的接口；随着业务、软件和运营需求的增长，我们需要一个足够健壮的框架来满足这些需求。于是，我们有了\
  \ NSB 和 saga。\n\n我们还将逐步讲解如何修改此应用程序以支持 ActiveMQ。我们将简要讨论 ActiveMQ，以及如何对其进行设置以执行这些操作。\n\
  \n在本章中，我们将涵盖：\n\n- 示例电子邮件 saga 通知\n- 示例 SFTP saga\n- Saga 部署\n- ActiveMQ\n\n![](img/8188651cea6a881a16242b395a81399a_159_0.png)\n\
  \n此应用程序的需求是：我们通过 GUI 设置一个定时器。这个 GUI 还可以设置一些电子邮件变量，例如电子邮件服务器、收件人和发件人地址。定时器将在 saga\
  \ 中设置一个时间，用于发送每日电子邮件。每日电子邮件将是一封简单的邮件，将可用的 MSMQ 队列发送给运营人员。我们不希望硬编码定时器或任何电子邮件变量。我们也不希望使用\
  \ Windows 任务计划程序，因为那需要更多的运维支持。这个练习在 NSB 中可以轻松处理。\n\n通过一个充当持久化和消息中介的 saga，将前端 GUI\
  \ 与后端电子邮件客户端分离，带来了几个好处：\n\n- 职责分离：如果前端出现问题，只要消息传递正确，saga 不一定会将这些问题传播给电子邮件客户端。\n\
  - 消息持久性：根据配置，消息、端点和 saga 数据会被持久化，即使服务器崩溃，数据仍然可以恢复。\n\n![](img/8188651cea6a881a16242b395a81399a_161_0.png)\n\
  \nMicrosoft Blend 提供了广泛的工具，可以在所见即所得（WYSIWYG）的可视化编辑器中构建用户界面，下面的截图给出了一个示例：\n\n![](img/8188651cea6a881a16242b395a81399a_161_1.png)\n\
  \n虽然这些是使用 XAML 和 WPF 的一些好处，但出于我们的简单目的，在 TimerPickerTest 项目中，我们将使用 Visual Studio\
  \ 2012 自带的工具箱来完成图形界面，如下图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_162_0.png)\n\
  \n这个 GUI 用于设置几个变量：电子邮件服务器（默认设置为 localhost），以及收件人和发件人地址（两者默认都设置为 test@google.com）。\n\
  \n### saga 项目\n\n此解决方案中的 saga 项目将命名为 TimerSaga。它将依赖于 TimerMessages 项目中的消息，该项目包含可用的\
  \ NSB 消息。\n\n这个项目看起来会像我们迄今为止构建的典型 saga 项目，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_163_0.png)\n\
  \n我们看到，我们引用了 NServiceBus.Host 引用，这反过来创建了 EndpointConfig.cs 文件，其中包含总线配置的代码。我们也知道，它必须设置\
  \ NServiceBus.Host.exe 文件，以便通过 NSB 将此项目作为 DLL 进行调试。同时，还创建了一个 App.config 文件，包含 NSB\
  \ 主机引用，其中包括 EndpointConfig.cs 文件的单播和其他设置。\n\nApp.config 文件将包含以下设置：将 SendTime（带时间信息的消息）和\
  \ EmailMessage（带电子邮件信息的消息）发送到 EmailClient 端点，该端点将有一个消息处理器来发送运营电子邮件。该设置如下：\n\n```\n\
  <UnicastBusConfig>\n  <MessageEndpointMappings>\n    <add Endpoint=\"EmailClient\"\
  \ Messages=\"TimerMessages.EmailMessage, TimerMessages\" />\n    <add Endpoint=\"\
  EmailClient\" Messages=\"TimerMessages.SendTime, TimerMessages\" />\n  </MessageEndpointMappings>\n\
  </UnicastBusConfig>\n```\n\n```\ns_Time.SecTxt = \"00\";\n    s_Time.AmPmTxt = \"\
  PM\";\n\n    _bus.Send(s_Time);\n}\n}\n```\n\n为了测试电子邮件，这里有一个简单邮件传输协议（SMTP）侦听器，它将在本地第\
  \ 25 号端口拦截电子邮件以供查看，从而测试你的电子邮件发送场景。可以在 http://smtp4dev.codeplex.com/ 找到它。当电子邮件发送到\
  \ localhost 时，它将被记录在 smtp4dev 软件中供审查。\n\n![](img/8188651cea6a881a16242b395a81399a_168_0.png)\n\
  \n如果一切正常，并且我们收到了来自电子邮件客户端的消息，我们应该会收到一封类似于以下截图的电子邮件：\n\n![](img/8188651cea6a881a16242b395a81399a_169_0.png)\n\
  \n我们刚刚演示了一个简单解决方案，使用 GUI 配置电子邮件客户端，向我们发送关于 MSMQ 的每日运营电子邮件。这个示例可以轻松扩展，以提供 SQL Server\
  \ 表的每日报告、审计或错误队列中的消息数量，以及许多其他用于检查系统运行状态的项目。\n\n另一个日常示例，尤其是对于需要向银行发送文件或进行第三方传输的支付引擎相关人员，是使用\
  \ SFTP 发送文件。通过结合上一章中的 SFTP、电子邮件和 WCF，可以解决许多企业级场景。\n\n此应用程序的需求是：我们通过 GUI 设置一个定时器。这个\
  \ GUI 还可以设置一些 SFTP 变量，例如 SFTP 服务器、用户名、密码和本地文本文件位置。\n\n定时器将在 saga 中设置一个每日时间，用于上传每日文本文件，该文件将根据日期和时间获得唯一的名称，并上传到\
  \ SFTP 服务器。这样可以避免覆盖相同的文件名。\n\n每日上传将是一个简单的示例，演示如何使用 saga 交互将文件上传到远程 SFTP 服务器（例如银行）以进行批量支付。我们不希望硬编码定时器或某些\
  \ SFTP 变量。我们也不希望使用 Windows 任务计划程序，因为那需要更多的运维支持。这个练习在 NSB 中可以轻松处理。\n\n通过一个充当持久化和消息中介的\
  \ saga，将前端 GUI 与后端 SFTP 客户端分离，带来了几个好处：\n\n- **职责分离**：如果前端出现问题，只要消息传递正确，不一定会将这些问题传播给\
  \ SFTP 客户端。SFTP 偶尔可能因密码重置、网络甚至服务器问题而无法登录。通过不让前端直接与 SFTP 客户端绑定，我们可以避免前端因 SFTP 问题而崩溃。\n\
  - **消息持久性**：根据配置，消息、端点和 saga 数据会被持久化，即使服务器崩溃，数据仍然可以恢复。\n- **重试**：如果消息失败，根据配置，它会重试多次。这可能允许我们在\
  \ SFTP 连接出错的多次尝试 SFTP 客户端到服务器的连接。\n- **监控**：有许多工具，并且根据持久化和队列配置的不同，有多种方法可以检查端点、消息和服务。这可能允许我们监控\
  \ SFTP 客户端以及传入其中的信息，以验证其是否适用于 SFTP 连接。\n- **高可用性**：NSB 是一个高可用性框架，这意味着在配置中可以有多个连接、端点、服务器和消息传递场景，以确保服务始终在后台运行，并在高性能环境中接收信息。\n\
  \n其中许多主题已经讨论过，但随着针对此示例应用程序的不同需求被讨论，只需使用 NSB 即可添加这些功能。\n\n\n\n\n\n## 使用 XAML\n\n\
  我们将使用 XAML 作为我们在之前的电子邮件示例中开发的基于 XML 的声明性语言。不同之处在于，我们加入了一些 SFTP 字段而不是电子邮件字段，以提供 SFTP\
  \ 服务器、用户名、密码和本地文本文件名作为变量，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_172_0.png)\n\
  \n## 更改消息传递过程\n\n在电子邮件示例中，我们使用 EmailMessage 中的值将信息从 saga 传递给电子邮件客户端。如下图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_172_1.png)\n\
  \n对于 SFTP，我们将改用 `SFTPMessage`，其中包含用于上传文件的 SFTP 变量，如下图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_173_0.png)\n\
  \n请注意，该变量与前端 GUI 的 SFTP 部分的输入变量几乎完全匹配。在创建服务时可以重用代码。在此示例中，我们还使用名为 `RequestId` 的消息\
  \ ID 作为主键来查找 saga 数据。\n\nsaga 代码的工作方式类似于电子邮件定时器 saga 和电子邮件消息处理器执行电子邮件客户端的方式。然而，现在我们将把\
  \ SFTP 信息从前端传递给 saga 和消息处理器。我们将不再访问电子邮件客户端，而是执行 SFTP 客户端。尽管这些消息发生了变化，并且使用 SFTP 代替了电子邮件，但大部分代码将保持不变。\n\
  \n## 设置 SFTP 测试环境\n\n为了进行测试，我们需要一个 SFTP 服务器和客户端。我们已经在 saga 代码中开发了一个 SFTP 客户端，但我们需要一个\
  \ SFTP 服务器来建立连接并上传文件。\n\n我们将从 http://www.freeshd.com 开始设置一个测试 SFTP 服务器。只需运行安装程序，然后设置一个用户和默认目录，用户可以在该目录中上传和下载文件。\n\
  \n![](img/8188651cea6a881a16242b395a81399a_174_0.png)\n\n在测试我们使用 saga 创建的整个解决方案之前，让我们先执行一个简单测试，以确保\
  \ SFTP 服务器的连接设置正确。我们将编写一个简单的控制台程序来测试此连接，并查看将文件放到 SFTP 服务器上的代码。此示例代码可以在 ConsoleTestSFTP\
  \ 目录中找到，如下所示：\n\n```\nnamespace ConsoleTestSFTP\n{\n    class Program\n    {\n \
  \       static void Main(string[] args)\n```\n\n## Saga 片段\n\n运行示例 SFTP 客户端程序时，我们不应该收到任何异常消息。但是，我们还应该检查文件是否已正确上传到\
  \ SFTP 服务器。为此，我们需要检查 freeSSHd 中的几个项目。首先查看上传目录的设置位置，并检查本地服务器目录中是否存在该文件。我们将在 freeSSHd\
  \ GUI 中查看本地目录，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_176_0.png)\n\n我们可以在\
  \ C: 下关联的 \\SFTPDlr 目录中查看，并看到文件在我们测试时已上传：\n\n| 名称 | 修改日期 | 类型 | 大小 |\n|---|---|---|---|\n\
  | text-2014-08-31_02-53-27-AM | 8/31/2014 2:53 AM | 文本文档 | 1 KB |\n\n除了通过查看文件本身来检查文件是否已通过\
  \ freeSSHd 上传之外，另一种方法是检查 freeSSHD 日志。我们可以检查 freeSSHd GUI 的日志记录部分，查看日志所在位置，甚至可以直接从\
  \ freeSSHd 单击 Open 按钮进行查看，如下面的屏幕截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_176_1.png)\n\
  \n要了解有关可通过 NServiceBus.Host.exe 编写脚本的可用命令的更多信息，请参阅 http://docs.particular.net/NServiceBus/the-nservicebus-host/，或运行\
  \ NserviceBus.Host.exe。\n\n目前，我们可以选择让 Windows 服务始终运行，并根据发送到 saga 的消息中定义的设定时间来执行\
  \ NServiceBus.exe。\n\n另一种方法是使用 Windows 任务计划程序来运行控制台应用程序，可以每 10 分钟、每小时、每天、每月等运行一次。然而，例如，可以基于发送消息以验证\
  \ SFTP 文件已被验证为前提条件，在上午 10 点到下午 4 点之间将 SFTP 文件发送到服务器。业务需求可以基于各种条件，通过直接使用 NSB，我们已经考虑了许多可能的需求，以便轻松添加增强功能，例如在不重写原始功能的情况下进行加密。\n\
  \n另一个建议是探索 Quartz 框架，该框架同时存在于 C# 和 Java 中，用于在代码中调度 cron 作业。感谢 Mark Huber，他是 TopShelf\
  \ 的作者。Quartz 将 Quartz 集成到 TopShelf DSL 中。\n\nC# 版本可以在 http://www.quartz-scheduler.net/\
  \ 找到。\n\n![](img/8188651cea6a881a16242b395a81399a_179_0.png)\n\n![](img/8188651cea6a881a16242b395a81399a_179_1.png)\n\
  \n在下面的代码片段中，一个服务持续运行，但它会在每天早上 9 点运行一个计划作业：\n\n```\npublic void Start()\n{\n    _log.Info(\"\
  Service is Started\");\n    Console.WriteLine(\"Service is Started\");\n    try\n\
  \    {\n        if (_log.IsDebugEnabled) _log.Debug(\"\\nLog successfully initialized.\"\
  );\n        IJobDetail jobDetail = JobBuilder.Create<CronJob>().WithIdentity(\"\
  SampleJob\", \"SampleJobGroup\").Build();\n        _log.Debug(\"cronTrigger started.\"\
  );\n        ICronTrigger cronTrigger = (ICronTrigger)TriggerBuilder.Create()\n \
  \           .WithIdentity(\"SampleTrigger\", \"SampleTriggerGroup\")\n         \
  \   .WithCronSchedule(\"0 0 9 1/1 * ? *\")\n            .Build();\n        var schedulerFactory\
  \ = new StdSchedulerFactory();\n        var scheduler = schedulerFactory.GetScheduler();\n\
  \        scheduler.ScheduleJob(jobDetail, cronTrigger);\n        scheduler.Start();\n\
  \    }\n```\n\ncron 作业使用 9 AM 的表示法 0 0 9 1/1 * ? * 进行调度。要了解 cron 调度表示法的快捷方式，有许多网站可以提供帮助，例如\
  \ http://www.cronmaker.com/。但是，这里我们必须小心，因为 Quartz 添加了秒单位，使其与标准 cron 略有不同。\n\n##\
  \ ActiveMQ\n\nApache Active Message Queue（ActiveMQ）是 Apache 基金会的一个 Java 开源框架，基于\
  \ Java 消息服务（JMS）。有关更多信息，请参阅 http://en.wikipedia.org/wiki/Apache_ActiveMQ 和 https://activemq.apache.org。它将在\
  \ Windows 或 Linux 机器上的 Java 运行时环境（JRE）中运行。机器上必须安装 Java，并将 JAVA_HOME 的环境路径配置为指向 JRE\
  \ 的根文件夹。ActiveMQ 的安装说明可以在 https://activemq.apache.org/getting-started#GettingStarted%20-Download\
  \ 找到。\n\n## 源代码\n\n在本节中，我们将使用 ActiveMQ 解决方案；该解决方案类似于 RabbitMQ，不同之处在于使用 ActiveMQ\
  \ 代替 RabbitMQ。\n\n在 Windows 操作系统上下载后，将 Windows 二进制文件解压到 c:\\activemq\\ 目录中。在命令提示符下（路径为\
  \ c:\\activemq\\bin\\）运行 activemq.bat 批处理文件，将显示一系列命令，表明 ActiveMQ 正在运行。\n\n确保 RabbitMQ\
  \ 没有作为 Windows 服务在后台运行，因为它使用与 ActiveMQ 相同的网络端口。要确保 ActiveMQ 正在运行，您可以在浏览器中通过 http://localhost:8161/admin\
  \ 访问管理控制台。默认用户 ID 和密码分别为 admin 和 admin。请访问 http://activemq.apache.org/getting-started.html\
  \ 了解更多信息。它将如下面的屏幕截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_181_0.png)\n\n\
  要在 Visual Studio 项目中将 ActiveMQ 用于 NServiceBus，必须安装 NuGet 版本的 NServiceBus.ActiveMQ。访问\
  \ https://www.nuget.org/packages/NServiceBus.ActiveMQ/1.0.5，在项目中安装 PM> Install-Package\
  \ NServiceBus.ActiveMQ。确保 IBus 的配置设置为 ActiveMQ。\n\n```\nprotected void Application_Start()\n\
  {\n    Configure.ScaleOut(s => s.UseSingleBrokerQueue());\n    _startableBus = Configure.With()\n\
  \        .DefaultBuilder()\n        .RijndaelEncryptionService()\n        .UseTransport<ActiveMQ>()\n\
  \        .UnicastBus()\n        .CreateBus();\n    Configure.Instance.ForInstallationOn<Windows>().Install();\n\
  \n    _bus = _startableBus.Start();\n    AreaRegistration.RegisterAllAreas();\n\n\
  \    RegisterGlobalFilters(GlobalFilters.Filters);\n    RegisterRoutes(RouteTable.Routes);\n\
  }\n```\n\n确保 App.Config 或 Web.Config 文件具有适当的 NServiceBus/Transport 连接字符串，以指向正确的\
  \ ActiveMQ 队列实例。\n\n```\n<connectionStrings>\n<add name=\"NServiceBus/Transport\"\
  \ connectionString=\"ServerUrl=activemq:tcp://localhost:61616\"/>\n</connectionStrings>\n\
  ```\n\n某些 EndpointConfig.cs 文件可能不会显式调用 IBus.Configure() 方法，因此请确保在 EndpointConfig\
  \ 类中显式调用使用传输的 ActiveMQ 调用。\n\n\n\n\n"
- "# 6 使用 NServiceBus 在云中\n\n在本章中，我们将在对云及其部分服务进行非常简要的介绍后，重点关注 NServiceBus 在云中的代码片段。虽然\
  \ NServiceBus 作为 Microsoft Azure 云的服务总线得到了支持，但它也是集成到其他云技术中的有益工具，因为所有云都支持第三方集成以通过\
  \ Web 服务传递数据。\n\n在本章中，我们将涵盖：\n\n- 介绍云和 NSB\n- 介绍 PaaS、IaaS 和 SaaS\n- 使用 Microsoft\
  \ Azure\n  - 介绍 Azure 存储服务\n  - Azure Service Bus 和存储队列\n  - Azure 存储队列和 NSB\n \
  \ - Azure Service Bus 在 NSB 中\n\n### 介绍云和 NSB\n\n本书撰写时，NSB 版本 5.0 for Azure 处于测试阶段，并且对\
  \ NSB 的云计算进行了许多更新。\n\n无需使用本地 SQL Server、RavenDB 或 MSMQ 排队系统，所有订阅数据、Saga 持久化、超时持久化和排队消息都可以在\
  \ Azure Storage 中使用，并且消息也可以放入 Azure Service Bus。在许多情况下，存储表与数据信息之间存在一对一的映射，使用键来检索数据而不是\
  \ SQL 模式。\n\nNSB 工具也在适应。ServiceInsight 正在增长，以处理在 Visual Studio 和 MSMQ 环境之外用于调试的序列图等更多细节。工具正从集成到物理服务器本地转变为集成到远程服务器，其中服务器本身的许多细节可能变得不那么重要，因为服务器已在异地虚拟化。例如，ServiceInsight\
  \ 的未来将添加 Saga 序列图，以提供比当前流程图更多的细节。以下是 ServiceInsight 即将推出的序列图：\n\n![](img/8188651cea6a881a16242b395a81399a_186_0.png)\n\
  \n然而，许多云技术队列不支持分布式事务。其他排队平台，例如 RabbitMQ，也不支持分布式事务。NSB 版本 5.0 增加了补偿功能，以建立跟踪事务发生时状态的表。这种功能允许在原生不存在的情况下实现事务完整性。\n\
  \n### 介绍 PaaS、IaaS 和 SaaS\n\n云计算服务使用三种基本模型提供：\n\n- **SaaS**：这代表 **Software as a\
  \ Service**。这促进了按需使用的托管软件服务供消费。我们的责任是配置由云厂商管理的这些服务。一个例子是 Google 邮件。这提供了业务软件的抽象。\n\
  - **PaaS**：这代表 **Platform as a Service**。这是指按需使用的通用服务供消费。这些服务例如排队、Web 服务器和其他仍需要构建业务软件的服务。我们的责任包括构建业务软件。这提供了可运行业务软件的服务的抽象。\n\
  - **IaaS**：这代表 **Infrastructure as a Service**。IaaS 提供商提供通用的存储、网络和服务器供消费。这些服务例如存储，仍需要构建服务和业务软件。我们的责任包括构建业务软件并为业务软件创建服务。这提供了运行平台服务的基础设施的抽象。\n\
  \nPaaS 是一种云计算服务，提供计算平台和解决方案堆栈作为服务。在 PaaS 中，云计算提供商提供操作系统、数据库、Web 服务器、开发工具以及托管消费者应用程序所需的其他服务。\n\
  \nIaaS 位于 PaaS 之下，因为它提供虚拟（以及物理）机器、服务器、存储选项、负载均衡器、网络等更基础的组件。\n\nSaaS 位于 PaaS 之上，因为它是软件分发模型，其中应用程序本身由供应商或服务提供商托管，并通过网络，通常是互联网，使客户可以使用。以下是\
  \ Windows Azure 如何支持 IaaS 和 PaaS 的示例：\n\n![](img/8188651cea6a881a16242b395a81399a_188_0.png)\n\
  \n根据云厂商的不同，这些术语可能略有不同。虽然所有云厂商都支持这些组件，但它们在这些组件的抽象级别上有所不同。例如，Windows Azure 允许您在云中配置虚拟机（VM），而其他厂商仅提供\
  \ SaaS 模型。所选的云厂商以及许可将决定您资源的限制。在 Windows Azure 中，您可以创建一个免费网站，这将不需要运行成本；然而，您的应用程序可能与其他在该服务器上运行的网站共享。但如果您愿意支付更多费用，您可以拥有一个专用\
  \ VM，并在其上运行您自己的 Web 服务器运行您的网站。一切都取决于您选择的服务。在云世界中，资源和交易的消费基于许可。所有云厂商都提供了大量用于在其云中开发的资源；也有很多帮助可用，因为他们的目标是让您尽可能多地利用他们的云，因为那是他们的收入来源。\n"
- "# 第7章 云服务与部署\n\n### 8.1 基本概念\n\n常微分方程：含有未知函數、未知函數的導數（或微分）與自變數的方程式，稱之為常微分方程。若未知函數為多變數函數，且方程式含有偏導數，則稱為偏微分方程。\n\
  \n定義：n 階常微分方程之形式為\n\n$$\nF(x, y, y', \\ldots, y^{(n)}) = 0\n$$\n\n- 可使用多种常见的本地工具和服务，这些工具和服务既可在现场使用，也可在云中使用；例如，使用可在本地和云中工作的排队和\
  \ SQL 服务器。\n- 通过 WebMatrix 等多种工具快速在云中开发网站。\n- 按需服务可用性，仅使用您需要的服务，以及 Microsoft 工具来帮助报告您的资源和利用率以供计费验证。\n\
  - 随着软件模型的发展和需求的变化，能够迁移到其他云服务。许多在 Azure 中开发的业务软件应用程序可以在其他云服务中使用。\n- 大数据资源报告和配置中简单的数据存储模型可用性。\n\
  \n所有这些功能总结起来就是 Microsoft 允许您使用 Microsoft 工具在本地或云中开发系统。它不会强迫您留在云中或在本地开发，而是允许您在认为合适的部分在云中开发，并在认为合适时将其从云中移除。许多其他云厂商可能会强迫您使用专用工具创建解决方案，当您将其移出云时，必须完全重写以放入不同的云服务。\n\
  \n### 介绍 Azure 存储服务\n\n对于数据管理，我们可以在云中创建 SQL Azure 数据库，或在本地创建 SQL 服务器，或两者混合。一种更简单的方法是直接调用存储服务，从而提供直接映射到数据的行。Azure\
  \ 存储服务既可通过使用 Azure SDK 在本地使用，也可在 Azure 云中使用。\n\nAzure 存储可用于在表中存储 Saga 数据、在表中存储超时持久化、在表中存储订阅信息，以及在队列中传输消息。\n\
  \n除了为在云中存储数据提供 SQL Azure 外，Azure 还提供以下其他类型的存储，其中有三种基本类型：\n\n- **Tables**：这基于键值 NoSQL\
  \ 表格式。\n- **Binary Large Object (BLOB)**：这用于二进制存储，例如视频文件。\n- **Queues**：这用于存储消息。\n\
  \n表是 NoSQL 解决方案，而不是关系型 SQL 数据库。它可以在多台机器上存储数据。每个表可以在多台机器上包含分区。这些表具有实体、分区和行键来访问实体。它是用于存储数据的键值存储。这些表不强制执行模式。通过不使用模式，速度得到增强，并且表与对象松散耦合，因为它们由键管理。限制是无法执行\
  \ SQL 查询，但在大多数情况下，它可以占用更少的存储，从而降低数据成本。对于表，有分区键、行键和时间戳。\n\n- 分区键：这是与分区相关联的唯一键，作为所有相关行的集合。这用于定义要访问哪个分区；例如，表的名称。\n\
  - 行键：这是用于在分区中标识行的唯一键，通常是唯一 ID。\n- 时间戳：这是 Azure 更新该行的时间。\n\nBLOB 是一个容器组，只是作为二进制存储在数据存储中存储的非结构化数据，例如视频或音频文件。\n\
  \n队列存储与在 MSMQ 中存储消息非常相似，只是管理工具位于 Azure 云中。就像许多 Azure 云项目可以通过 Azure SDK 和 Visual\
  \ Studio 管理一样，存储队列也可以通过 Visual Studio 管理。我们在 Visual Studio 中看到超时状态、Saga 数据和订阅数据，如以下屏幕截图所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_191_0.png)\n\n除了使用 Visual Studio 外，还有许多开源工具，例如可在以下位置找到的\
  \ Azure Storage Explorer：\n\n```\nhttp://azurestorageexplorer.codeplex.com/\n```\n\
  \n\n\n\n\nAzure 存储资源管理器显示在以下屏幕截图中：\n\n![](img/8188651cea6a881a16242b395a81399a_192_0.png)\n\
  \n## Azure 服务总线和存储队列\n\nNSB 同时支持在 Azure 存储队列和 Azure 服务总线队列中进行排队。\n\n请注意，使用 Azure\
  \ 存储队列与使用 Azure 服务总线队列之间存在许多差异。\n\n> 请注意此示例中的不同名称。服务总线队列提供更多管理功能，例如保证 FIFO，而 Azure\
  \ 队列的内置可管理性较低。访问 http://msdn.microsoft.com/en-us/library/hh767287.aspx 以获取更多信息。\n\
  \n当我们运行客户端时，我们将让 MVCApp 网站通过 saga 向 WCF 服务器上的 WCF 客户端发送一条消息。如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_196_0.png)\n\
  \n我们还将让 MySaga 和 WCF 客户端同时运行，以便在 Azure 模拟器中创建队列和持久化。在 Visual Studio 2012 中，通过转到“视图\
  \ | 服务器资源管理器 | Azure | 存储”，我们可以查看正在运行的队列和消息，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_196_1.png)\n\
  \n可以在 Azure 门户中创建 Azure 服务总线，方法是首先创建服务总线命名空间，如下面的屏幕截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_198_0.png)\n\
  \n我们可以在 Azure 门户中创建服务总线队列、主题和中继，并且在 Azure 门户中初始创建后，还可以通过 Visual Studio 管理服务总线。访问服务总线需要使用主密钥和连接字符串，这与\
  \ SQL 数据库的连接字符串并无太大不同。\n\n![](img/8188651cea6a881a16242b395a81399a_198_1.png)\n\n\
  在创建 Azure 服务总线队列时，我们可以在此创建过程中看到一些附加配置设置，这些设置在存储队列中并未提供，如下面的屏幕截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_199_0.png)\n\
  \n例如，我们还可以使用来自以下位置的 Azure 云服务总线队列的 NServiceBus 示例：\n\nhttps://github.com/Particular/NServiceBus.Azure.Samples/tree/master/VideoStore.AzureServiceBus.Cloud\n\
  \n我们将按以下方式设置 NSB 以运行 Azure 存储队列：\n\n- 1. 使用 PM> Install-Package NServiceBus.Azure.Transports.WindowsAzureServiceBus\
  \ 从 NuGet 或项目的包管理器中为 NServiceBus 安装引用。\n\n> 您可能需要将 NServiceBus 核心版本的兼容版本与相应的 NServiceBus\
  \ Azure 版本进行匹配。一种想法是卸载当前的 NServiceBus 引用，让 NServiceBus Azure 引用安装所需的 NServiceBus\
  \ 核心引用。\n\n- 2. 在 IBus 配置上设置配置。在 MySaga 项目和 EndpointConfig.cs 文件中，我们按如下方式使用 AzureServiceBus\
  \ 作为队列：\n\n```\nConfigure.With()\n.DefaultBuilder()  // Autofac Default Container\n\
  .UseTransport<NServiceBus.AzureServiceBus>()  // Azure Storage Queues\n.AzureSubscriptionStorage()\n\
  .AzureSagaPersister()\n.UseAzureTimeoutPersister()\n.UnicastBus(); // Create the\
  \ default unicast Bus\n```\n\n> 我们还设置了 AzureSagaPersisterConfig、AzureTimeoutPersisterConfig、AzureSubscriptionStorageConfig\
  \ 配置，以仍然使用 Azure 存储进行数据库设置。我们还为所有项目添加了 AzureSubscriptionStorageConfig 配置。\n\n我们需要根据需要调整项目设置，以将传输设置为\
  \ AzureServiceBus。\n\n现在，我们已经将配置更改迁移到使用 AzureServiceBus。当我们运行应用程序时，可以从 Azure 管理门户查看所有队列，如下所示：\n\
  \n![](img/8188651cea6a881a16242b395a81399a_203_0.png)\n\n我们在 Visual Studio 服务器资源管理器中查看连接：\n\
  \n其中有主题、发布-订阅消息传递，以及用于一对一消息的队列。\n\n我们现在在 NSB 中运行着一个 Azure 服务总线。\n\n## 总结\n\n在本章中，我们深入探讨了**软件即服务（SaaS）**以及\
