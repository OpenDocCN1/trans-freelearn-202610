  mdcn: "\n\n## 本书读者对象\n\n本书面向希望学习如何使用 NServiceBus 开发，并探索 NSB  Saga（即 NSB 的工作流核心）的初级或中级\
    \ C# 开发者。本书将讨论许多入门知识，并深入探讨 Saga，同时使用多种 Microsoft 框架，这也会为你提供使用 WPF、WCF、ASP.NET\
    \ MVC 和 Entity Framework 的一些基础知识。\n\n## 约定\n\n在本书中，你会发现多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义说明。\n\
    \n文本中的代码字、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和 Twitter 用户名显示如下：“`RequestTimeout()`\
    \ 函数可能需要几秒、几分钟、几小时、几天，也可以在一天中的特定时间执行。”\n\n代码块如下所示：\n\n```\nusing System;\nusing\
    \ System.IO;\nusing ServiceControl.Plugin.CustomChecks;\nusing ServiceControl.Plugin.CustomChecks.Messages;\n\
    using ServiceControl.Plugin.CustomChecks.Internal;\nnamespace PaymentEngine.ECommerce\n\
    {\npublic class MyCustomCheck : CustomCheck\n{\npublic MyCustomCheck()\n: base(\"\
    ECommerce SubmitPayment check\", \"ECommerce\")\n{\nReportPass();\n}\n}}\n```\n\
    \n任何命令行输入或输出均如下书写：\n\n```\nPM> Get-NserviceBusLocalMachineSettings\n```\n\n##\
    \ 勘误\n\n尽管我们已竭尽全力确保内容的准确性，但错误仍在所难免。如果你在我们的某本书中发现了错误——无论是文字错误还是代码错误——我们将不胜感激，请你向我们报告。这样做可以帮助其他读者免受困扰，并帮助我们改进本书的后续版本。如果你发现任何勘误，请访问\
    \ http://www.packtpub.com/submit-errata，选择你的图书，点击“Errata Submission Form”链接，并输入勘误详情。一旦你的勘误得到验证，你的提交将被接受，勘误信息将上传到我们的网站，或添加到该图书勘误部分下的现有勘误列表中。\n\
    \n要查看之前提交的勘误，请访问 https://www.packtpub.com/books/content/support，并在搜索字段中输入书名。所需信息将显示在勘误部分下。\n\
    \n## 盗版\n\n互联网上对受版权保护材料的盗版是所有媒体持续存在的问题。在 Packt，我们非常重视对我们版权和许可的保护。如果你在互联网上以任何形式发现我们作品的任何非法副本，请立即向我们提供位置地址或网站名称，以便我们采取补救措施。\n\
    \n请通过 copyright@packtpub.com 联系我们，并附上涉嫌盗版材料的链接。\n\n我们感谢你帮助保护我们的作者和我们为您提供有价值内容的能力。\n\
    \n## 问题\n\n如果你对本书的任何方面有问题，可以通过 questions@packtpub.com 联系我们，我们将尽最大努力解决问题。\n\n##\
    \ 1\nSaga 简介\n\n在本章中，我们将讨论 Saga 的简介。Saga 只是 **NServiceBus（NSB）** 支持的众多设计模式之一。NSB\
    \ 是一种 **企业服务总线（ESB）**，为端到端企业带来了许多设计特性和好处。我们将简要了解这些特性，并简单讨论 NSB 支持的一些设计模式。在此基础上，我们将介绍\
    \ Saga 设计模式，并简要介绍其用途。本书其余部分将深入探讨 Saga 模式及其使用，并讨论 NSB 的更多特性。\n\n在本章中，我们将学习以下内容：\n\
    \n- ESB 简要介绍\n- 其他模式\n  - 发布-订阅模式\n  - 请求-响应模式\n  - 数据总线模式\n  - 超时模式\n  - 消息突变模式\n\
    \  - 消息加密模式\n  - 扩展模式\n  - Saga 设计模式\n- Saga——它们有什么用？\n\n![](img/8188651cea6a881a16242b395a81399a_23_0.png)\n\
    \n上图展示的是非常高级的接口，因此我们可以深入探讨服务本身的协议。\n\n![](img/8188651cea6a881a16242b395a81399a_23_1.png)\n\
    \n- **极其可配置：** NSB 使用 `Configure.With()` 函数进行配置，可以轻松地将持久化从 RavenDB 更改为 NHibernate\
    \ ORM 框架，或将队列从 MSMQ 更改为 RabbitMQ、ActiveMQ 或 SQL 队列。除了某些配置外，几乎所有代码（如果不是全部）无论采用何种持久化和队列模型都能同样工作，因为\
    \ NSB 负责端点的配置和映射。\n- **服务托管：** NSB 使用 `NServiceBus.Host.exe` 文件负责服务的管理和托管。\n-\
    \ **集中式生产监控：** Particular 的 ServicePulse 可以监控生产端点、消息报告和服务报告。\n- **ServiceInsight：**\
    \ Particular 的 ServiceInsight 可以通过可视化画布、端点视图、消息视图提供深入洞察，并让你更深入地理解 Saga 的消息、端点和消息服务。\n\
    - **快速开发：** Particular 的 ServiceMatrix 是 Visual Studio 的开发工作室扩展，通过生成 C# 代码的图形画布提供快速开发。\n\
    \n让我们看看 ESB 设计的几个实际需求。\n\n- **支付引擎到银行：** C# 程序员可以使用 Microsoft Windows Communication\
    \ Foundation（WCF）或 Microsoft Web API 为外部银行执行 Web 服务以扣款信用卡。WCF 有许多无法支持横切关注点的部分，例如重试和失败处理。NSB\
    \ 可以托管服务，并在 MSMQ 中提供持久消息传递，以便在 WCF 接口上执行消息重试。如果 Web 服务对第三方服务（如银行）出现中断，NSB 将持久化消息。这包括跟踪消息报告，甚至消息加密。因此，虽然\
    \ WCF 可以实现 Web 服务部分，但在 WCF 领域之外还有许多部分，只有像 NSB 这样的产品才能提供横切功能。\n- **在线订购系统：** 订购产品时，你可能会看到一个旋转的页面，并显示\
    \ **请勿刷新，正在处理订单**。这显然是一种网站与订购站点（包括信用卡处理）紧密耦合的设计。许多自动化过程可能会干扰 Web 浏览器，或者服务器端可能出现断连，导致流程重新开始。ESB\
    \ 将始终确保，如果你不得不再次下订单或遇到中断，你的消息是事务性和持久性的，从而在订单收费时确保完整性。\n\n> 对于与 NSB 设计松散耦合的网站，网站只需向服务队列发送消息，而不会中断\
    \ Web 流程。不允许在订单处理时刷新的网站依赖于后端流程完成，而 Web 流程可能会被中断。NSB 设计仍然可以在不中断网站的情况下向用户反馈订单状态。\n\
    \n## 事件驱动型任务\n\n对于在 Windows 上调度任务，Windows 任务计划程序可以完成这项工作（参见 http://en.wikipedia.org/wiki/Windows_Task_Scheduler）。然而，取决于任务的复杂性，Windows\
    \ 任务计划程序可能不足以处理它。例如，如果需要在启动任务之前检查节假日安排，并且该任务依赖于其他事件和服务在其运行前发生，你可能会遇到任务计划程序的局限性。Windows\
    \ 任务计划程序是一个很棒的工具，但它不像 ESB 那样是事件驱动的。对于 ESB 来说，时间本身就是一种事件。\n\n即使某项任务可以轻松由任务管理器完成，除非你使用像\
    \ NSB 这样的框架，否则你无法获得服务的全局管理、事件、命令和消息的消息传递，以及从管理视角对处理过程的反馈。\n\nNSB 扩展了设计，以支持事件驱动设计的许多方面，在这些设计中，构建一个简单的网站、调度每日任务或发送付款可以轻松扩展到更大的规模，以便拥有、监控、管理、扩展、保护并维持良好的软件质量。当这些简单设计变得复杂时，常常需要进行重写，这并不少见。这仅仅是因为软件质量和设计扩展没有提前考虑。\n\
    \nESB 是一种用于设计 SOA 架构的架构软件设计模式和框架。然而，ESB 还可以带来许多其他软件设计模式。这些是 NSB 支持的软件设计模式，但并非所有\
    \ ESB 都支持这些模式。\n\n"
