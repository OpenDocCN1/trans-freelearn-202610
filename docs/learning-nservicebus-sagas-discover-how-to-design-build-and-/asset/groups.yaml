    # RabbitMQ for NSB


    RabbitMQ is a cross-platform messaging framework, like MSMQ, that can run on both
    Linux and Windows operating systems.


    RabbitMQ has many more features than MSMQ, such as routing, virtual hosts, and
    a powerful admin toolset. It can run on Linux and scales out very well. For large
    enterprise systems (especially in heterogeneous network environments), you should
    really consider RabbitMQ. RabbitMQ can easily be changed for the MSMQ queuing
    system in the NSB configuration.


    For administrating RabbitMQ, a web admin interface can easily be installed. However,
    if the command-line interface is required, then the Python language will need
    to be installed.


    To revisit some of the references in the earlier chapters, take a look at the
    following:


    +   - **Local host management site**: This can be found at http://localhost15672/#/.

    +   - **Documentation**: This can be found at http://www.rabbitmq.com/documentation.html.

    +   - **Windows installation**: This can be found at https://www.rabbitmq.com/install-windows.html.

    +   - **NServiceBus samples**: These can be found at https://github.com/Particular/NServiceBus.RabbitMQ.Samples.

    +   - **Development tools site for RabbitMQ**: This can be found at http://www.rabbitmq.com/devtools.html.

    +   - **NS eviceBus.RabbitMQ source code**: This can be found at https://github.com/Particular/NServiceBus.RabbitMQ.

    +   - **NServiceBus RabbitMQ hands-on lab**: This can be found at http://particular.net/HandsOnLabs.'
