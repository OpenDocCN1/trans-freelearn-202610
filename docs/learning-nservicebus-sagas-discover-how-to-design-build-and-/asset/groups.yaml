  mdcn: "\n将 NSB 与 WCF 集成使用，与直接使用 WCF 类似，但又不尽相同。在 WCF 中，有四个基本步骤可以扩展。更多信息请访问 http://www.c-sharpcorner.com/UploadFile/dhananjaycoder/four-steps-to-create-first-wcf-service-for-beginners/。\n\
    \n创建 WCF 服务器的步骤如下：\n\n- 1. 创建服务协定。这通过接口定义了 WCF 客户端与 WCF 服务器之间可用的功能。\n- 2. 通过 App.config\
    \ 或 Web.config 公开带有元数据的终结点。我们通过配置公开终结点，以包含数据交换的方式。\n- 3. 实现服务。也就是说，我们向接口添加功能和数据对象。\n\
    - 4. 使用服务。或者换句话说，公开服务以供 WCF 客户端导入。\n\n在使用 NSB 与 NHibernate 时，NSB 负责处理 NHibernate\
    \ 与消息、终结点和服务之间的映射。在 WCF 集成中，NSB 也借助消息处理器和消息格式处理许多服务协定。\n\n我们可以在以下截图中观察到这些功能点，接下来将进一步讨论它们：\n\
    \n![](img/8188651cea6a881a16242b395a81399a_111_0.png)\n\n接下来我们将添加消息。\n\n## 添加消息\n\
    \n现在，我们将按照以下截图所示，在解决方案中创建一个 `PaymentMessages` 项目：\n\n![](img/8188651cea6a881a16242b395a81399a_112_0.png)\n\
    \n我们将使用 `PaymentMessage` 请求消息，该请求需要是 NServiceBus IMessage 接口，包含两个类：一个用于为每条消息生成唯一\
    \ ID 的 Guid 方法，以及一个 `PaymentReq` 类：\n\n```\npublic class PaymentMessage : IMessage\n\
    {\n    public Guid EventId { get; set; }\n    public PaymentReq paymentReq { get;\
    \ set; }\n}\n```\n\n## 添加配置\n\n为 Web 服务配置 App.config 文件的任务仍然存在。此步骤类似于前面提到的使用元数据公开终结点。\n\
    \nApp.config 文件将定义 Web 服务的多个特征，例如侦听端口和 URL、服务的安全性以及服务的绑定类型。绑定类型定义终结点的通信机制，无论是基本\
    \ HTTP、MSMQ 还是其他机制。可在 http://msdn.microsoft.com/en-us/library/ms730879(v=vs.110).aspx\
    \ 找到相关列表以及有关 WCF 绑定的更多信息。\n\n我们可以手动编辑 App.config 文件，或使用随 Visual Studio 提供的 WCF\
    \ 服务配置编辑器来配置该文件。\n\n有关配置编辑器的更多信息，请访问：\n\nhttp://msdn.microsoft.com/en-us/library/ms732009(v=vs.110).aspx\n\
    \n现在，我们将通过配置编辑器打开 App.config 文件，以完成以下操作：\n\n- 建立服务器 URL（包括端口号），以作为 WCF 终结点供 WCF\
    \ 客户端使用\n- 建立绑定参数，以通过各种不同方式公开 WCF 服务终结点\n- 设置跟踪和日志记录，以便在传输和服务发生时进行查看\n\n我们首先打开项目的\
    \ App.config 文件，并设置 Web 服务将侦听的 URL 和端口，以开始配置终结点，如下面的截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_116_0.png)\n\
    \n请访问 http://msdn.microsoft.com/en-us/library/ms731734(v=vs.110).aspx 查看 WCF 配置架构。我们可以通过服务终结点编辑绑定，如下所示：\n\
    \n![](img/8188651cea6a881a16242b395a81399a_118_0.png)\n\n## 添加跟踪\n\n关于本节是否必需可能存在一些争议，因为本节是\
    \ WCF 特有的，与 saga 或 NSB 无关。但是，如果 WCF 客户端和 WCF 服务器之间的 WCF 通信无法正常工作，问题可能与消息结构、网络、WSDL\
    \ 或任何其他因素有关。为了跟踪 WCF 中的问题，需要启用并设置跟踪功能。这也可以让我们看到通信的响应。但是，如果您的 WCF 功能正常且无需进行故障排除，则可以跳过本节。\n\
    \nWCF 中提供了服务跟踪实用工具，可用于查看 WCF Web 服务和 Web 客户端的图形、消息、网络调用、异常和活动。有关 Microsoft 服务跟踪查看器的更多信息，请参阅\
    \ http://msdn.microsoft.com/en-us/library/ms732023(v=vs.110).aspx。\n\n我们可以通过在\
    \ App.config 文件中设置诊断节（以 <diagnostics/> 形式给出）来捕获客户端与服务器之间的消息，并通过设置将与库关联的侦听器和源来记录\
    \ App.config 文件中的事件，如下所示：\n\n```\n<AuditConfig QueueName=\"audit\" />\n<system.serviceModel>\n\
    \    <diagnostics>\n        <messagelogging logEntireMessage=\"true\" logMalformedMessages=\"\
    false\" logMessagesAtServiceLevel=\"true\" logMessagesAtTransportLevel=\"true\"\
    \ maxMessagesToLog=\"30000\" maxSizeOfMessageToLog=\"30000\" />\n        <endToEndTracing\
    \ activityTracing=\"true\" messageFlowTracing=\"true\" />\n    </diagnostics>\n\
    \    <behaviors>\n        <serviceBehaviors>\n            <behavior name=\"Default\"\
    >\n                <serviceMetadata httpGetEnabled=\"true\" />\n             \
    \   <serviceDebug includeExceptionDetailInFaults=\"true\" />\n            </behavior>\n\
    \        </serviceBehaviors>\n    </behaviors>\n    <services>\n        <service\
    \ name=\"WCFServer.WebServices.PayService\" behaviorConfiguration=\"Default\"\
    >\n            <endpoint address=\"mex\" binding=\"mexHttpBinding\" contract=\"\
    IMetadataExchange\" />\n            <host>\n                <baseAddresses>\n\
    \                    <add baseAddress=\"http://localhost:9009/services/paymessage\"\
    \ />\n                </baseAddresses>\n            </host>\n        </service>\n\
    \    </services>\n</system.serviceModel>\n</configuration>\n```\n\n以下截图展示了我们如何配置消息日志记录，以及我们将使用哪种跟踪侦听器来写入日志：\n\
    \n![](img/8188651cea6a881a16242b395a81399a_120_0.png)\n\n我们可以通过在服务跟踪查看器中打开 svc\
    \ 日志文件来查看客户端与服务器之间发送的消息。如下面的截图所示，我们可以看到 SOAP 消息，包括标头和正文，这正是 WCF 服务器所接收的内容。\n\n\
    ## 查看 Web 服务\n\n在 Visual Studio 2012 中运行 Web 服务时，我们可以通过浏览器访问 http://localhost:9009/services/paymessage\
    \ 来查看该服务。它将为 WCF 客户端提供一些简单的说明，如下面的截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_122_0.png)\n\
    \n我们还可以通过访问 http://localhost:9009/services/paymessage?singleWsdl 页面来查看 WSDL：\n\
    \n## 部署时的注意事项\n\n请注意，对于大多数生产系统，在使用 Web 服务时，始终建议安装数字证书，以加密管道并验证客户端和服务器的身份。\n\n\
    对于真实的生产系统，WCF 客户端与 WCF 服务器之间的所有通信都必须使用 SSL 确保安全，并且您应该使用基于 WS-Security 的应用程序来检查您的\
    \ Web 服务。\n\n```\npublic ActionResult SendWCF(int id)\n{\n    var user = new XMLLoads().GetPayments().Where(p\
    \ => p.Id == id).FirstOrDefault();\n    var message = new XMLLoads().GetMessages().Where(p\
    \ => p.EventId == user.EventId).FirstOrDefault();\n    ServiceReference1.WcfServiceOf_PayMessage_ErrorCodesClient\
    \ client1 =\n        new ServiceReference1.WcfServiceOf_PayMessage_ErrorCodesClient();\n\
    \    ErrorCodes returnCode = client1.Process(message);\n    user.errorCode = returnCode;\n\
    \    return View(user);\n}\n```\n\n这将是浏览器中的 Kendo 网格，它提供一个选择项，用于将数据发送到 WCF 服务。浏览页面时，网格将填充以下数据，并提供一个将消息发送到\
    \ WCF 服务的选项，如下表所示：\n\n| Event Id | Action |\n|---|---|\n| 8b265223-dc9e-4789-a6df-69d19f644ad7\
    \ | Call_Payment_Service |\n| 3721ba5d-4733-4d98-a5e2-8e8afa3e61f4 | Call_Payment_Service\
    \ |\n| 1ac188ec-4b2e-436c-b989-db88c65db1fa | Call_Payment_Service |\n| 9bf180fa-f8f4-4b2b-8fac-cca73a4e2cab\
    \ | Call_Payment_Service |\n| ee2c56f7-6d42-4314-bce5-4825ed294437 | Call_Payment_Service\
    \ |\n\nSendWCFPay.cshtml 文件中的 Kendo 网格脚本如下所示：\n\n```\n<h2>Send Payment Message\
    \ to WCF</h2>\n<script type=\"text/javascript\">\n    $(document).ready(function\
    \ () {\n        var modelData = @Html.Raw(Json.Encode(Model))\n        $(\"#grid\"\
    ).kendoGrid({\n            pageable: true\n          , sortable: true\n      \
    \    , silectable: true\n```\n"
