    We can create the Service Bus Queues, Topics, and Relays in the Azure portal,
    and we can also manage the Service Bus through Visual Studio after it is initially
    created in the Azure portal. The Service Bus will use a primary key and connection
    string to be accessed, not too dissimilar to a connection string to SQL database.


