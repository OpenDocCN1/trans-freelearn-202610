    We currently have the choice to have Windows services always running and to execute
    NServiceBus.exe based on a set time defined in the message to the saga.


    An alternative is to use the Windows Task Scheduler to run a console application
    every 10 minutes, hourly, daily, monthly, and more. However, SFTP files could
    be sent to the server between 10 AM until 4 PM, for instance, based on a precondition
    that a message is sent to verify that the SFTP file has been validated. Business
    requirements can be based upon a variety of conditions, and by using NSB directly,
    we have taken many possible requirements into account to easily add enhancements,
    such as encryption without rewriting the original functionality.


