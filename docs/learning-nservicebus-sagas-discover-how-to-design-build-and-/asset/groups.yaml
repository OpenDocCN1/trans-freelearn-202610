    In NSB, we have the ability to use event-driven timer messages. This is the ability
    of a saga to start a function, run a command, or perform many other tasks, based
    on its timer. In the event-driven timer function, we can set a timeout for any
    time in the day, from seconds after the process starts, to minutes, hours, days,
    and even use a holiday table for the process. By having a managed service, the
    usage of timers can be more complex, for instance, adding holiday tables, not
    executing timers on weekends, and more business functions that task schedulers
    cannot handle. Also included in NSB, is the installation and management of the
    service itself. Time saved just in deploying services and having NSB set up DTC
    for the administrator may already pay for the NSB licenses.


    The source code in this section will be in NSB Version 5.0 in the TimerSaga -
    v5 directory. Here we have the following projects:


    +   - AppCommon: This contains the ViewModel and context for the Windows forms.

    +   - TimerSubmit: This is a project that submits a timer message to the saga
    between 1-100 seconds.

    +   - TimerMessages: This contains common messages for the projects.'
