    \ to be NServiceBus IMessage Interface having two classes, a Guid method for a\
    \ unique ID per message, and a `PaymentReq` class:\n\n```\npublic class PaymentMessage\
    \ : IMessage\n{\n    public Guid EventId { get; set; }\n    public PaymentReq\
    \ paymentReq { get; set; }\n}\n```"
