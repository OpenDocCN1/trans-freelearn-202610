    ## The Particular Service Platform


    In this chapter, we will be focusing on the Particular Service Platform, which
    includes ServicePulse, ServiceControl, ServiceInsight, and ServiceMatrix. We can
    use ServicePulse to get a pulse of NServiceBus (NSB) endpoints, messages, sagas,
