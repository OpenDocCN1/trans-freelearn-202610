    \ WCF 服务。在生产环境中不建议使用这种 XML 文件的方式，因为通常这些文件会由面向客户的前端支付界面填写客户信息。我们选择这种方法是为了固化这些接口并对其进行测试。而设计客户界面来填充消息并不属于本次工作的范围。在这种类型的测试中使用\
    \ XML 文件是有优势的，因为我们可以扩展这个示例来发送数百条消息，既可以检查性能，也可以通过客户界面填充单独的消息，而无需依赖前端。\n\n我们的基本架构是一个非常常见的设计，即\
    \ MVC 前端调用 WCF 客户端与 WCF 服务器进行交互。这种设计在一些订购网站上也很常见。例如，假设在一个披萨网站上，会弹出一个提示，上面写着**订单正在发送，请勿刷新**。由于这个示例同样没有与后端工作流解耦，如果这要成为一个没有通过\
    \ NSB 解耦的解决方案，我们很可能还得加上“支付正在发送，请勿刷新”的提示。在需要刷新页面的情况下，很多事情都可能出错。仅仅因为客户可能没有刷新他们的页面，并不意味着没有其他东西在刷新页面。\n\
    \n我们当前的架构如下：\n\n![](img/8188651cea6a881a16242b395a81399a_129_0.png)\n\n## Saga\
    \ 开发\n\n让我们在上述解决方案中构建一些 saga 处理，以将 MVC 前端与 WCF 客户端解耦。NSB 将充当这两个组件之间交互的中介。\n\n\
    为什么使用 saga？因为它可以路由消息、执行超时处理并持久化状态。\n\n上面的截图展示了使用 NServiceBus saga 的新工作流。它看起来可能有点复杂，但\
    \ NServiceBus 会在后台处理所有复杂性。对于控制器来说，它只是发出消息，然后就不再管了。如果它需要知道消息的状态，只需在数据库上执行一次 EF\
    \ 查询。但它仍然会把消息发送出去，让 NSB 来处理它。\n\n## 源代码\n\n代码的目录位于 SagaPaymentClient 目录下。\n\n\
    MVCApp - WCF 项目用作客户端，通过 saga 发送 WCF 消息。\n\n该解决方案是在 Windows Server 2012 上使用 Visual\
    \ Studio 2012 构建的，并且还在 Windows 8.1 上运行的 VS 2012 中进行了测试，安装了 MSMQ、DTC、RavenDB、NServiceBus\
    \ 4.0 版引用和 SQL Server 2012 Express LocalDB。\n\n以下是加入 saga 后新项目的样子：\n\n![](img/8188651cea6a881a16242b395a81399a_130_0.png)\n\
    \n现在不同的是，MVC 应用程序将与 saga（即 MySaga）交互，而 saga 将与 WCF 客户端和 MVC 应用程序通信。这将使前端与 WCF\
    \ 客户端解耦，并让 MVC 直接从 saga 消息中接收状态反馈。\n\n## 将 NServiceBus 添加到 MVC\n\n接下来，我们将添加总线，并把\
    \ `BasicPaymentClient` 文件夹和项目扩展为 `SagaPaymentClient` 文件夹和项目。区别如下：\n\n- 我们将把 WCF\
    \ 客户端从 MVC 控制器中重构出来，并将其移入一个新的消息处理器中。\n- 我们将创建一个数据库来跟踪消息的状态。saga 数据将保存在 `nservicebus`\
    \ 表中。请确保在运行 saga 代码时创建该表。\n- 我们将创建一个新的消息处理器，并将 WCF 客户端代码放入其中。这段从 WCF 客户端到 WCF\
    \ 服务器的代码将尽可能与前端代码分离，以保持 `PayMessage` 类与前端完全分离。\n- 我们将在 MVC 中创建一个新的消息处理器，当它从端点接收到新状态时，会用消息状态更新数据库。在下一节中，我们将在测试时查看消息处理器和\
    \ saga 处理器的代码。\n- `NServiceBus.Testing` 通过消息处理器和 saga 发送消息来提供测试功能。这包括消息处理器和 saga\
    \ 可以执行的任何操作，包括消息头处理和依赖注入。有关一些基本示例，请参阅 http://docs.particular.net/NServiceBus/unit-testing\
    \ 。`NServiceBus.Testing` 的源代码请访问 https://github.com/Particular/NServiceBus/tree/develop/src/\
    \ 。\n\n开始单元测试最基本的方法是在 Visual Studio 中创建一个单元测试项目，即向现有解决方案添加一个新的单元测试项目。请访问 http://msdn.microsoft.com/en-us/library/hh598957.aspx\
    \ 并将其添加为超链接。**新建项目**窗口如下所示：\n\n## 消息处理器单元测试\n\n消息处理器的代码将位于单元测试本身中。在我们的 UnitTestHandlers\
    \ 项目中包含各种单元测试，我们将逐步分析 EventMessageHandler。EventMessageHandler 通过 saga 从 MVCApp\
    \ 接收 SendCommand 对象，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_135_0.png)\n\
    \n我们将继续创建 UnitTestHandler2.cs 文件，然后添加头部信息和 [TestMethod]。这个文件将位于 UnitTestHandlers\
    \ 项目的 SagaPaymentClient 下。\n\n创建完文件的基本结构后，我们将创建一个普通消息 SendCommand，其中包含一个 GUID\
    \ 和消息在到达消息处理器之前应处于的状态，命名为 command。代码如下：\n\n```\nnamespace UnitTestHandlers\n{\n\
    \    [TestClass]\n    public class UnitTestHandler2\n    {\n        /***\n   \
    \      *\n         * Test the message handler for MYWCFClient\n         * This\
    \ will call the WCF Service for a completion\n         *\n         *****/\n  \
    \      [TestMethod]\n        public void Run()\n        {\n            Test.Initialize();\n\
    \            /*****\n             *\n             * Create a Command message\n\
    \             * used to look up an XML Message file\n             * on Disk, send\
    \ to WCF Server\n             *\n             *****/\n            SendCommand\
    \ command = new SendCommand();\n            command.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\"\
    );\n            command.state = MyMessages.MessageParts.StateCodes.SentMyWCFClient;\n\
    \n            // The Test code\n            Test.Handler<EventMessageHandler>()\n\
    \                .ExpectReply<ResponseCommand>(m => m.state == MyMessages.MessageParts.StateCodes.CompleteMyWCFClient)\n\
    \                .OnMessage<SendCommand>(command);\n        }\n    }\n}\n```\n\
    \n我们看到命令消息被传入 `.OnMessage<SendMessage>(command)` 方法，并且 Reply 方法中传入了 ResponseMessage\
    \ 对象，其状态被设置为 CompleteMyWCFClient。在 Debug 模式下调用单元测试时，我们甚至可以在处理器中传入这条消息，观察它的行为，如下所示：\n\
    \n![](img/8188651cea6a881a16242b395a81399a_137_0.png)\n\n这使我们能够通过 TDD 在单元测试代码中设计和调试处理器功能。在测试处理器或\
    \ saga 时，可以使用许多规则。例如，ExpectNotReply 用于期望处理器不会以特定消息进行回复。\n\n要了解 NServiceBus.Testing\
    \ 中可用的功能，我们可以执行以下步骤：\n\n- 1. 尝试输入一些内容，然后将鼠标悬停在 IntelliSense 上。\n\n![](img/8188651cea6a881a16242b395a81399a_137_1.png)\n\
    \n```\nif (returnCode == ErrorCodes.None)\n{\n    command.state =\n        StateCodes.CompleteMyWCFClient;\n\
    }\nelse\n{\n    command.state =\n        StateCodes.MyWCFClientFail;\n}\n\nBus.Reply(command);\n\
    Console.WriteLine(\"Success\");\n}\n```\n\n如果 XML 文件不存在会发生什么？下面是当时使用的代码：\n\n```\n\
    // if no XML, just fail\nif (payMessage == null)\n{\n    command.state = StateCodes.MyWCFClientFailXML;\n\
    \    Bus.Reply(command);\n    Console.WriteLine(\"No XML Found\");\n}\nelse\n\
    {\n    ... normal path }\n```\n\n测试完这段代码后，我们可以将经过测试的代码（不含单元测试部分）用于在新项目中创建类，并将其用作消息处理器。通过在单元测试中开发代码，再将测试通过的产品放入应用程序项目中，这样可以节省时间。单元测试项目还可以作为备份，让我们了解代码在测试通过时的样子。\n\
    \n## Saga 处理器单元测试\n\n让我们开始在消息处理器中测试上一节的 saga 代码：\n\n```\n// The Test code\nTest.Handler<EventMessageHandler>()\n\
    \    .ExpectReply<ResponseCommand>(m => m.state ==\nPaymentMessages.MessageParts.StateCodes.\n\
    CompleteMyWCFClient)\n    .OnMessage<SendCommand>(command);\n```\n"
