  - '[PAGE 25]


    +   - **Extremely configurable:** NSB is configured using the `Configure.With()`
    function that can easily change the persistence from RavenDB to the NHibernate
    ORM framework, or queuing from MSMQ, RabbitMQ, ActiveMQ, or SQL Queuing. Most
    of the code, if not all, except some configurations, will work the same regardless
    of the persistence and queuing models, as NSB takes care of the endpoint provisioning
    and mapping.

    +   - **Service hosting:** NSB takes care of the management and hosting of services
    using the `NServiceBus.Host.exe` file.

    +   - **Central production monitoring:** Particular''s ServicePulse can monitor
    the production endpoint, message reporting, and service reporting.

    +   - **ServiceInsight:** Particular''s ServiceInsight can provide a deep insight
    through visual canvases, endpoint views, message views, and a deeper understanding
    of saga''s messages, endpoints, and services.

    +   - **Rapid development:** Particular''s ServiceMatrix is a development studio
    extension for Visual Studio to provide rapid development through graphical canvases
    that generate C# code.


    Let''s look at a couple of practical needs for ESB designs.


    +   - **Payment engine to a bank:** A C# programmer could use the Microsoft Windows
    Communication Foundation (WCF) or Microsoft Web APIs to perform web services for
    an external bank to debit a credit card. There are many pieces that WCF will not
    perform to support cross-cutting concerns, such as retries and failures. NSB can
    host the service and provide durable messaging in MSMQ that performs message retries
    on the WCF interface. NSB will persist with messages if there is an interruption
    of web services to third-party services, such as a bank. This includes keeping
    track of message reporting and even the encryption of messages. So, while WCF
    can implement the web service piece, there are many pieces outside of the realm
    of WCF that only a product like NSB can provide cross-cutting functionality for.

    +   - **An online ordering system:** When ordering a product, you may be greeted
    with a page that spins and states **Do not refresh, processing order**. This is
    clearly a design where the website is tightly coupled to the ordering site, including
    the processing of the credit card. There are many automated processes that may
    disturb a web browser, or there may be some disconnect on the server side that
    may start the process over again. An ESB will always ensure that if you have to
    place your order again or had an interruption, your messaging is transactional
    and durable, ensuring integrity when charging for your order.'
  - '[PAGE 26]


    > For a website that is loosely coupled with an NSB design, the website could
    just send a message to the service queue without interrupting the web flow. A
    site that doesn''t allow refreshing when processing an order depends on backend
    processes to finish, where the web flow may be interrupted. An NSB design can
    still give the user feedback on the status of their order without any interruption
    to the website.


    # Event-driven jobs


    For scheduling jobs on Windows, the Windows Task Scheduler can do the job (see
    http://en.wikipedia.org/wiki/Windows_Task_Scheduler). However, depending on the
    complexity of the job, the Windows Task Scheduler may not be enough to deal with
    it. For instance, if a holiday schedule needs to be checked before starting the
    job and if the job has dependencies on other events and services happening before
    it runs, you may run into limitations with the task scheduler. The Windows Task
    Scheduler is a great tool, but it is not event driven, as is an ESB. With ESBs,
    time is an event.


    Even though a job may be easily done by Task Manager, you will not get the global
    management of services, the messaging of events, commands, and messages, and the
    feedback of the processing from a managed perspective, unless you use a framework
    such as NSB.


    NSB extends the design to allow many facets of event-driven designing where building
    a simple website, scheduling a daily job, or sending payments can easily grow
    into something much larger in order to have, monitor, manage, extend, secure,
    and maintain great software quality. It is not uncommon that when these simple
    designs become complex, a rewrite is warranted. That is simply because software
    quality and extending the design were not taken into consideration ahead of time.


    The ESB is an architectural software design pattern and framework for designing
    SOA architectures. However, there are many additional software design patterns
    that an ESB can bring to the table as well. These will be software design patterns
    that NSB supports, but not all ESBs support these patterns.'
