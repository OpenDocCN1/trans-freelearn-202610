  - "[PAGE 182]\n\nTo use ActiveMQ for NServiceBus in Visual Studio projects, the\
    \ NuGet version of NServiceBus.ActiveMQ has to be installed. Visit https://www.nuget.org/packages/NServiceBus.ActiveMQ/1.0.5\
    \ on installing PM> Install-Package NServiceBus.ActiveMQ into the projects. Ensure\
    \ that the configuration for the IBus is set to ActiveMQ.\n\n```\nprotected void\
    \ Application_Start()\n{\n    Configure.ScaleOut(s => s.UseSingleBrokerQueue());\n\
    \    _startableBus = Configure.With()\n        .DefaultBuilder()\n        .RijndaelEncryptionService()\n\
    \        .UseTransport<ActiveMQ>()\n        .UnicastBus()\n        .CreateBus();\n\
    \    Configure.Instance.ForInstallationOn<Windows>().Install();\n\n    _bus =\
    \ _startableBus.Start();\n    AreaRegistration.RegisterAllAreas();\n\n    RegisterGlobalFilters(GlobalFilters.Filters);\n\
    \    RegisterRoutes(RouteTable.Routes);\n}\n```\n\nEnsure that the App.Config\
    \ or Web.Config file have the appropriate connection string for NServiceBus/Transport\
    \ to point at the correct instance of the ActiveMQ queues.\n\n```\n<connectionStrings>\n\
    <add name=\"NServiceBus/Transport\" connectionString=\"ServerUrl=activemq:tcp://localhost:61616\"\
    />\n</connectionStrings>\n```\n\nSome of the EndpointConfig.cs files may not explicitly\
    \ call the IBus.Configure() method, so make sure that the ActiveMQ using the transport\
    \ call is explicitly called in the EndpointConfig class."
  md: "\n## Using XAML\n\nWe will be using XAML as a declarative XML-based language\
    \ that we had developed in the previous e-mail example. The difference is that\
    \ we incorporated some SFTP fields instead of e-mail fields to provide the SFTP\
    \ server, username, password, and local text filename as variables, depicted as\
    \ follows:\n\n![](img/8188651cea6a881a16242b395a81399a_172_0.png)\n\n## Changing\
    \ the process of messaging\n\nIn the e-mail example, we used the values in EmailMessage\
    \ to pass the information from the saga to the email client. It looked like the\
    \ following diagram:\n\n![](img/8188651cea6a881a16242b395a81399a_172_1.png)\n\n\
    For the SFTP, we will be using `SFTPMessage` instead with SFTP variables for uploading\
    \ a file as shown in the following diagram:\n\n![](img/8188651cea6a881a16242b395a81399a_173_0.png)\n\
    \nNotice that the variable matches almost exactly with the input variables for\
    \ the SFTP portion of the frontend GUI. Code can be reused when creating services.\
    \ In this sample, we also use the message ID, called `RequestId`, as a primary\
    \ key to look up for the saga data.\n\nThe saga code will function in a similar\
    \ manner to the email timer saga and email message handler to execute the email\
    \ client. However, now we will be passing SFTP information from the frontend to\
    \ the saga and the message handler. Instead of accessing the email client, we\
    \ will be executing an SFTP client. Despite these message changes and using SFTP\
    \ instead of e-mail, much of the code will remain the same.\n\n## Setting up an\
    \ SFTP test environment\n\nFor testing, we will need an SFTP server and client.\
    \ We have developed an SFTP client in the saga code, but we need an SFTP server\
    \ to establish the connection and upload the file.\n\nWe will start by setting\
    \ up a test SFTP server from http://www.freeshd.com. After simply running the\
    \ installation, we will set up a user and the default directory into which the\
    \ user can upload and download the files.\n\n![](img/8188651cea6a881a16242b395a81399a_174_0.png)\n\
    \nBefore testing the entire solution that we have created using a saga, let's\
    \ perform a simple test to ensure that the connectivity for the SFTP server is\
    \ set correctly. We will write a simple console program to test out this connectivity\
    \ and to see the code to put a file on the SFTP server. This sample code can be\
    \ found in the ConsoleTestSFTP directory and will look like the following:\n\n\
    ```\nnamespace ConsoleTestSFTP\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n```\n\n## Saga Snippets\n\nWhen running the sample SFTP\
    \ client program, we should get no exception message. However, we should also\
    \ check that the file has been uploaded correctly on the SFTP server. In order\
    \ to do that, we need to look into a couple of items in freeSSHd. The first is\
    \ to see where the upload directory has been set, and check the local server directory\
    \ for the presence of the file. We will look in the freeSSHd GUI for the local\
    \ directory as follows:\n\n![](img/8188651cea6a881a16242b395a81399a_176_0.png)\n\
    \nWe can look in the associated \\SFTPDlr directory under C: and see that the\
    \ file was uploaded at the time we had tested:\n\n| Name | Date modified | Type\
    \ | Size |\n|---|---|---|---|\n| text-2014-08-31_02-53-27-AM | 8/31/2014 2:53\
    \ AM | Text Document | 1 KB |\n\nAn alternative to checking if the file is uploaded\
    \ via freeSSHd by looking at the file itself is to check the freeSSHD logs. We\
    \ can check the Logging section of the freeSSHd GUI to see where the log resides\
    \ or even click on the Open button to review it from the freeSSHd itself, as depicted\
    \ in the following screenshot:\n\n![](img/8188651cea6a881a16242b395a81399a_176_1.png)\n\
    \nTo find out more on the available commands that can be scripted from NServiceBus.Host.exe,\
    \ please see http://docs.particular.net/NServiceBus/the-nservicebus-host/, or\
    \ run NserviceBus.Host.exe.\n\nWe currently have the choice to have Windows services\
    \ always running and to execute NServiceBus.exe based on a set time defined in\
    \ the message to the saga.\n\nAn alternative is to use the Windows Task Scheduler\
    \ to run a console application every 10 minutes, hourly, daily, monthly, and more.\
    \ However, SFTP files could be sent to the server between 10 AM until 4 PM, for\
    \ instance, based on a precondition that a message is sent to verify that the\
    \ SFTP file has been validated. Business requirements can be based upon a variety\
    \ of conditions, and by using NSB directly, we have taken many possible requirements\
    \ into account to easily add enhancements, such as encryption without rewriting\
    \ the original functionality.\n\nAnother piece of advice is to explore the Quartz\
    \ framework which exists in both C# and Java, which is used to schedule cron jobs\
    \ in code. Credit goes to Mark Huber, who is the author of TopShelf. Quartz integrates\
    \ Quartz into the TopShelf DSL.\n\nThe C# version can be found at http://www.quartz-scheduler.net/.\n\
    \n![](img/8188651cea6a881a16242b395a81399a_179_0.png)\n\n![](img/8188651cea6a881a16242b395a81399a_179_1.png)\n\
    \nIn the following snippet, a service is constantly running but it runs a scheduled\
    \ job at 9 AM every morning:\n\n```\npublic void Start()\n{\n    _log.Info(\"\
    Service is Started\");\n    Console.WriteLine(\"Service is Started\");\n    try\n\
    \    {\n        if (_log.IsDebugEnabled) _log.Debug(\"\\nLog successfully initialized.\"\
    );\n        IJobDetail jobDetail = JobBuilder.Create<CronJob>().WithIdentity(\"\
    SampleJob\", \"SampleJobGroup\").Build();\n        _log.Debug(\"cronTrigger started.\"\
    );\n        ICronTrigger cronTrigger = (ICronTrigger)TriggerBuilder.Create()\n\
    \            .WithIdentity(\"SampleTrigger\", \"SampleTriggerGroup\")\n      \
    \      .WithCronSchedule(\"0 0 9 1/1 * ? *\")\n            .Build();\n       \
    \ var schedulerFactory = new StdSchedulerFactory();\n        var scheduler = schedulerFactory.GetScheduler();\n\
    \        scheduler.ScheduleJob(jobDetail, cronTrigger);\n        scheduler.Start();\n\
    \    }\n```\n\nThe cron job is scheduled using a notation for 9 AM as 0 0 9 1/1\
    \ * ? *. To understand the shortcut of cron scheduled notation, there are many\
    \ websites that can help, such as http://www.cronmaker.com/. However, we must\
    \ be careful here, as Quartz adds the unit of seconds making it slightly different\
    \ from standard cron.\n\n## ActiveMQ\n\nApache Active Message Queue (ActiveMQ)\
    \ is a Java open source framework from the Apache foundation based on the Java\
    \ Message Service (JMS). See http://en.wikipedia.org/wiki/Apache_ActiveMQ and\
    \ https://activemq.apache.org for more information. It will run on a machine,\
    \ be it Windows or Linux, in a Java Runtime Environment (JRE). Java has to be\
    \ operational on the machine and have the environment path for the JAVA_HOME configured\
    \ to point at the root folder of the JRE. The installation instructions for ActiveMQ\
    \ can be found at https://activemq.apache.org/getting-started#GettingStarted%20-Download.\n\
    \n## The source code\n\nIn this section, we will be using the ActiveMQ solution;\
    \ this solution is similar to RabbitMQ, except ActiveMQ is used instead of RabbitMQ.\n\
    \nOnce downloaded on the Windows OS, unzip the Window's binary files into the\
    \ c:\\activemq\\ directory. Running the activemq.bat batch file from the command\
    \ prompt, having the path as c:\\activemq\\bin\\, will display a series of commands\
    \ to show that the ActiveMQ is running.\n\nEnsure that RabbitMQ is not running\
    \ as a Windows service in the background as it utilizes the same network ports\
    \ as ActiveMQ. To ensure that ActiveMQ is running, you may access the admin console\
    \ in the browser by using http://localhost:8161/admin. The default user ID and\
    \ password is admin and admin respectively. Please visit http://activemq.apache.org/getting-started.html\
    \ for more information. It will appear as in the following screenshot:\n\n![](img/8188651cea6a881a16242b395a81399a_181_0.png)\n\
    \nTo use ActiveMQ for NServiceBus in Visual Studio projects, the NuGet version\
    \ of NServiceBus.ActiveMQ has to be installed. Visit https://www.nuget.org/packages/NServiceBus.ActiveMQ/1.0.5\
    \ on installing PM> Install-Package NServiceBus.ActiveMQ into the projects. Ensure\
    \ that the configuration for the IBus is set to ActiveMQ.\n\n```\nprotected void\
    \ Application_Start()\n{\n    Configure.ScaleOut(s => s.UseSingleBrokerQueue());\n\
    \    _startableBus = Configure.With()\n        .DefaultBuilder()\n        .RijndaelEncryptionService()\n\
    \        .UseTransport<ActiveMQ>()\n        .UnicastBus()\n        .CreateBus();\n\
    \    Configure.Instance.ForInstallationOn<Windows>().Install();\n\n    _bus =\
    \ _startableBus.Start();\n    AreaRegistration.RegisterAllAreas();\n\n    RegisterGlobalFilters(GlobalFilters.Filters);\n\
    \    RegisterRoutes(RouteTable.Routes);\n}\n```\n\nEnsure that the App.Config\
    \ or Web.Config file have the appropriate connection string for NServiceBus/Transport\
    \ to point at the correct instance of the ActiveMQ queues.\n\n```\n<connectionStrings>\n\
    <add name=\"NServiceBus/Transport\" connectionString=\"ServerUrl=activemq:tcp://localhost:61616\"\
    />\n</connectionStrings>\n```\n\nSome of the EndpointConfig.cs files may not explicitly\
    \ call the IBus.Configure() method, so make sure that the ActiveMQ using the transport\
    \ call is explicitly called in the EndpointConfig class.\n"
  mdcn: "\n\n## 使用 XAML\n\n我们将使用 XAML 作为我们在之前的电子邮件示例中开发的基于 XML 的声明性语言。不同之处在于，我们加入了一些\
    \ SFTP 字段而不是电子邮件字段，以提供 SFTP 服务器、用户名、密码和本地文本文件名作为变量，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_172_0.png)\n\
    \n## 更改消息传递过程\n\n在电子邮件示例中，我们使用 EmailMessage 中的值将信息从 saga 传递给电子邮件客户端。如下图所示：\n\n\
    ![](img/8188651cea6a881a16242b395a81399a_172_1.png)\n\n对于 SFTP，我们将改用 `SFTPMessage`，其中包含用于上传文件的\
    \ SFTP 变量，如下图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_173_0.png)\n\n请注意，该变量与前端\
    \ GUI 的 SFTP 部分的输入变量几乎完全匹配。在创建服务时可以重用代码。在此示例中，我们还使用名为 `RequestId` 的消息 ID 作为主键来查找\
    \ saga 数据。\n\nsaga 代码的工作方式类似于电子邮件定时器 saga 和电子邮件消息处理器执行电子邮件客户端的方式。然而，现在我们将把 SFTP\
    \ 信息从前端传递给 saga 和消息处理器。我们将不再访问电子邮件客户端，而是执行 SFTP 客户端。尽管这些消息发生了变化，并且使用 SFTP 代替了电子邮件，但大部分代码将保持不变。\n\
    \n## 设置 SFTP 测试环境\n\n为了进行测试，我们需要一个 SFTP 服务器和客户端。我们已经在 saga 代码中开发了一个 SFTP 客户端，但我们需要一个\
    \ SFTP 服务器来建立连接并上传文件。\n\n我们将从 http://www.freeshd.com 开始设置一个测试 SFTP 服务器。只需运行安装程序，然后设置一个用户和默认目录，用户可以在该目录中上传和下载文件。\n\
    \n![](img/8188651cea6a881a16242b395a81399a_174_0.png)\n\n在测试我们使用 saga 创建的整个解决方案之前，让我们先执行一个简单测试，以确保\
    \ SFTP 服务器的连接设置正确。我们将编写一个简单的控制台程序来测试此连接，并查看将文件放到 SFTP 服务器上的代码。此示例代码可以在 ConsoleTestSFTP\
    \ 目录中找到，如下所示：\n\n```\nnamespace ConsoleTestSFTP\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n```\n\n## Saga 片段\n\n运行示例 SFTP 客户端程序时，我们不应该收到任何异常消息。但是，我们还应该检查文件是否已正确上传到\
    \ SFTP 服务器。为此，我们需要检查 freeSSHd 中的几个项目。首先查看上传目录的设置位置，并检查本地服务器目录中是否存在该文件。我们将在 freeSSHd\
    \ GUI 中查看本地目录，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_176_0.png)\n\n\
    我们可以在 C: 下关联的 \\SFTPDlr 目录中查看，并看到文件在我们测试时已上传：\n\n| 名称 | 修改日期 | 类型 | 大小 |\n|---|---|---|---|\n\
    | text-2014-08-31_02-53-27-AM | 8/31/2014 2:53 AM | 文本文档 | 1 KB |\n\n除了通过查看文件本身来检查文件是否已通过\
    \ freeSSHd 上传之外，另一种方法是检查 freeSSHD 日志。我们可以检查 freeSSHd GUI 的日志记录部分，查看日志所在位置，甚至可以直接从\
    \ freeSSHd 单击 Open 按钮进行查看，如下面的屏幕截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_176_1.png)\n\
    \n要了解有关可通过 NServiceBus.Host.exe 编写脚本的可用命令的更多信息，请参阅 http://docs.particular.net/NServiceBus/the-nservicebus-host/，或运行\
    \ NserviceBus.Host.exe。\n\n目前，我们可以选择让 Windows 服务始终运行，并根据发送到 saga 的消息中定义的设定时间来执行\
    \ NServiceBus.exe。\n\n另一种方法是使用 Windows 任务计划程序来运行控制台应用程序，可以每 10 分钟、每小时、每天、每月等运行一次。然而，例如，可以基于发送消息以验证\
    \ SFTP 文件已被验证为前提条件，在上午 10 点到下午 4 点之间将 SFTP 文件发送到服务器。业务需求可以基于各种条件，通过直接使用 NSB，我们已经考虑了许多可能的需求，以便轻松添加增强功能，例如在不重写原始功能的情况下进行加密。\n\
    \n另一个建议是探索 Quartz 框架，该框架同时存在于 C# 和 Java 中，用于在代码中调度 cron 作业。感谢 Mark Huber，他是 TopShelf\
    \ 的作者。Quartz 将 Quartz 集成到 TopShelf DSL 中。\n\nC# 版本可以在 http://www.quartz-scheduler.net/\
    \ 找到。\n\n![](img/8188651cea6a881a16242b395a81399a_179_0.png)\n\n![](img/8188651cea6a881a16242b395a81399a_179_1.png)\n\
    \n在下面的代码片段中，一个服务持续运行，但它会在每天早上 9 点运行一个计划作业：\n\n```\npublic void Start()\n{\n  \
    \  _log.Info(\"Service is Started\");\n    Console.WriteLine(\"Service is Started\"\
    );\n    try\n    {\n        if (_log.IsDebugEnabled) _log.Debug(\"\\nLog successfully\
    \ initialized.\");\n        IJobDetail jobDetail = JobBuilder.Create<CronJob>().WithIdentity(\"\
    SampleJob\", \"SampleJobGroup\").Build();\n        _log.Debug(\"cronTrigger started.\"\
    );\n        ICronTrigger cronTrigger = (ICronTrigger)TriggerBuilder.Create()\n\
    \            .WithIdentity(\"SampleTrigger\", \"SampleTriggerGroup\")\n      \
    \      .WithCronSchedule(\"0 0 9 1/1 * ? *\")\n            .Build();\n       \
    \ var schedulerFactory = new StdSchedulerFactory();\n        var scheduler = schedulerFactory.GetScheduler();\n\
    \        scheduler.ScheduleJob(jobDetail, cronTrigger);\n        scheduler.Start();\n\
    \    }\n```\n\ncron 作业使用 9 AM 的表示法 0 0 9 1/1 * ? * 进行调度。要了解 cron 调度表示法的快捷方式，有许多网站可以提供帮助，例如\
    \ http://www.cronmaker.com/。但是，这里我们必须小心，因为 Quartz 添加了秒单位，使其与标准 cron 略有不同。\n\n\
    ## ActiveMQ\n\nApache Active Message Queue（ActiveMQ）是 Apache 基金会的一个 Java 开源框架，基于\
    \ Java 消息服务（JMS）。有关更多信息，请参阅 http://en.wikipedia.org/wiki/Apache_ActiveMQ 和 https://activemq.apache.org。它将在\
    \ Windows 或 Linux 机器上的 Java 运行时环境（JRE）中运行。机器上必须安装 Java，并将 JAVA_HOME 的环境路径配置为指向\
    \ JRE 的根文件夹。ActiveMQ 的安装说明可以在 https://activemq.apache.org/getting-started#GettingStarted%20-Download\
    \ 找到。\n\n## 源代码\n\n在本节中，我们将使用 ActiveMQ 解决方案；该解决方案类似于 RabbitMQ，不同之处在于使用 ActiveMQ\
    \ 代替 RabbitMQ。\n\n在 Windows 操作系统上下载后，将 Windows 二进制文件解压到 c:\\activemq\\ 目录中。在命令提示符下（路径为\
    \ c:\\activemq\\bin\\）运行 activemq.bat 批处理文件，将显示一系列命令，表明 ActiveMQ 正在运行。\n\n确保 RabbitMQ\
    \ 没有作为 Windows 服务在后台运行，因为它使用与 ActiveMQ 相同的网络端口。要确保 ActiveMQ 正在运行，您可以在浏览器中通过 http://localhost:8161/admin\
    \ 访问管理控制台。默认用户 ID 和密码分别为 admin 和 admin。请访问 http://activemq.apache.org/getting-started.html\
    \ 了解更多信息。它将如下面的屏幕截图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_181_0.png)\n\
    \n要在 Visual Studio 项目中将 ActiveMQ 用于 NServiceBus，必须安装 NuGet 版本的 NServiceBus.ActiveMQ。访问\
    \ https://www.nuget.org/packages/NServiceBus.ActiveMQ/1.0.5，在项目中安装 PM> Install-Package\
    \ NServiceBus.ActiveMQ。确保 IBus 的配置设置为 ActiveMQ。\n\n```\nprotected void Application_Start()\n\
    {\n    Configure.ScaleOut(s => s.UseSingleBrokerQueue());\n    _startableBus =\
    \ Configure.With()\n        .DefaultBuilder()\n        .RijndaelEncryptionService()\n\
    \        .UseTransport<ActiveMQ>()\n        .UnicastBus()\n        .CreateBus();\n\
    \    Configure.Instance.ForInstallationOn<Windows>().Install();\n\n    _bus =\
    \ _startableBus.Start();\n    AreaRegistration.RegisterAllAreas();\n\n    RegisterGlobalFilters(GlobalFilters.Filters);\n\
    \    RegisterRoutes(RouteTable.Routes);\n}\n```\n\n确保 App.Config 或 Web.Config\
    \ 文件具有适当的 NServiceBus/Transport 连接字符串，以指向正确的 ActiveMQ 队列实例。\n\n```\n<connectionStrings>\n\
    <add name=\"NServiceBus/Transport\" connectionString=\"ServerUrl=activemq:tcp://localhost:61616\"\
    />\n</connectionStrings>\n```\n\n某些 EndpointConfig.cs 文件可能不会显式调用 IBus.Configure()\
    \ 方法，因此请确保在 EndpointConfig 类中显式调用使用传输的 ActiveMQ 调用。\n\n"
