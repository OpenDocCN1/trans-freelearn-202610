    # Creating a WCF server


    We will start by creating a `WCFServer` project in Visual Studio, as the server
    needs to be running before it can communicate with the client. By adding the reference
    `NServiceBus.Host` from NuGet or Package Manager Console, several NSB default
    settings will be created in the `App.config` file for the project, an `EndpointConfig.cs`
    file with `AsA_Server` will be created, and the project will be set to run with
    an `NServiceBus.Host.exe` executable. We can see the creation of the files by
    the reference in the following screenshot:


    ![](img/8188651cea6a881a16242b395a81399a_109_0.png)'
  - '[PAGE 110]


    When we add an NServiceBus.Host reference, through either NuGet or Package Manager,
    into the project, many other items will be added into the project as well. These
    other items are as follows:


    +   - An EndpointConfig.cs file will be created in the project with the default
    settings to add endpoints.

    +   - The project will be set to run as a DLL, being executed by an NServiceBus.Host.exe
    executable when run from the debugger.

    +   - Several default settings for creating a generic AsA_Server endpoint will
    be added to the App.config file.


    We can see from the following screenshot that when we add the NServiceBus.Host
    reference, this sets the project to run as a DLL using the NServiceBus.Host.exe
    executable:


    ![](img/8188651cea6a881a16242b395a81399a_110_0.png)


    We will use NSB WCF Integration to save a lot of work on our part. In order to
    use this integration, we will need a few pieces related to both NSB and WCF. These
    are as follows:


    +   - A web service: This is used with the NServiceBus.WcfService<TRequest, TResponse>
    class where we define a request and response on the web service. We will show
    here that the service called PayService will receive the PaymentMessage message
    as the request and respond with ErrorCodes. This is shown in the following line
    of code:

    +     public class PayService : WcfService<PaymentMessage, ErrorCodes>

    +   - A message handler: This is required to handle the message from the web service
    and to process it in the integration. We will call this handler PayHandler.

    +   - The request and response message structures: This is required for the PaymentMessages
    project.

    +   - The configuration for NSB with WCF: This is required in the App.config file.'
