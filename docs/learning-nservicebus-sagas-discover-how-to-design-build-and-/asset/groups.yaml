  mdcn: "\n- 创建 WCF 客户端\n  - 添加服务引用\n  - 调用引用\n- 重新审视设计\n- 添加服务引用\n  - 调用引用\n- 将 NServiceBus\
    \ 添加到 MVC\n  - 消息处理程序单元测试\n  - Saga 处理程序单元测试\n- 用于 NSB 的 RabbitMQ\n- 用于 NSB 的\
    \ ActiveMQ\n\n## ASP.NET MVC 简介\n\n**模型-视图-控制器（MVC）**是实现用户界面最常见的软件设计模式。ASP.NET\
    \ MVC 是微软在 ASP.NET 中实现 MVC 软件设计模式的框架。通过复用已被他人验证和测试的已知设计模式与框架进行开发，可以为任何应用程序带来大量已知组件的可复用性。\n\
    \n通过将逻辑拆分为控制器（控制器具有 `session`、`request` 和 `response` 辅助函数），同时传递模型（即视图模型，其中包含我们希望呈现到视图中的信息），可以将大部分逻辑和暴露面从浏览器中移开，从而暴露\
    \ API。我们还将对许多模型对象使用 Microsoft Entity Framework（EF）。\n\n微软推荐使用 **语言集成查询（LINQ）**\
    \ 和 EF 来防止传统的 SQL 注入攻击。网页 https://msdn.microsoft.com/en-in/library/bb308959.aspx\
    \ 还讨论了可以在 EF 中实施的其他安全措施。EF 并不能缓解所有注入攻击（例如 EF 注入），但正确组合使用 EF 和 LINQ，可以缓解许多常见的 SQL\
    \ 注入攻击。其原因是，现在注入只能通过 LINQ 和 EF 对象发生，而不是通过任何开放的 SQL 命令，从而将攻击面从一系列广泛的命令缩小到一个对象，以及一个可能只能在\
    \ MVC 控制器中访问的集合。互联网上运行着许多脚本工具，例如 SQLNinja。请访问 http://sqlninja.sourceforge.net/\
    \ 来找出任何不安全的 SQL 命令。\n\n然而，大多数工具并非为标记 EF 攻击向量而构建。请访问 http://www.slideshare.net/rhelton_1/sql-injection-amp-entity-frameworks\
    \ 了解更多信息。\n\n使用对象关系映射器（ORM）（如 EF）的理由还有很多，参见 http://karwin.blogspot.com/2009/01/why-should-you-use-orm.html。其中一些原因包括：\n\
    \n- **生成样板代码**：EF 从 SQL Server 数据库和表生成对象，从而创建可用于创建、更新、读取和删除表中字段的样板代码。\n- **支持面向对象**：EF\
    \ 对象支持常见的面向对象编程设计和方法论，与 PIE（多态-封装-继承）一样简单，并且支持可重用性。\n- **加速开发**：从数据库生成代码并在应用程序中使用，可能比从头创建自定义代码快得多。我们可以在下面的图表中看到\
    \ MVC 组件的交互：\n\n![](img/8188651cea6a881a16242b395a81399a_107_0.png)\n\n那么，为什么在\
    \ NSB 书中要讨论 MVC-EF 呢？这是因为大多数官方 NSB 示例都使用 MVC。我们将查看一些在 MVC 中扩展的示例，这些示例包含了微软在 EF\
    \ 和 WCF 方面的最佳实践。\n\n为了查看表以及与表相关的队列，我们使用 Kendo 网格。Packt 出版社出版了许多关于 Kendo 的书籍，例如《Kendo\
    \ UI Grid》(http://www.packtpub.com/kendo-ui-grid/book)。一些 Kendo 示例也扩展自 http://www.codeproject.com/Articles/606682/Kendo-Grid-In-Action\
    \ 上提供的文件。\n\n## Saga 与 Web 服务\n\nNSB 提供集成的众多端点之一是 **Windows Communication Foundation（WCF）**\
    \ 端点。请访问 http://en.wikipedia.org/wiki/Windows_Communication_Foundation 了解更多信息。\n\
    \nWCF 是 .NET Framework 生态系统的一部分，它提供了用于构建互联的、面向服务的应用程序的运行时和一组 API。在 **简单对象访问协议（SOAP）**\
    \ 绑定中，它使用 **Web 服务描述语言（WSDL）**，该语言定义了 Web 服务与 Web 服务客户端之间的接口。基于 WSDL，XML 根据 WSDL\
    \ 规范创建，这样客户端和服务器就可以交换信息，无论它们的编程语言和平台是什么。它通过协议（通常是 HTTP 或 HTTPS）在服务器和客户端之间发送。绑定类型有多种；本书将主要讨论\
    \ SOAP 绑定，但如需了解更多的绑定类型，可以访问 http://msdn.microsoft.com/en-us/library/ms731092%28v=vs.110%29.aspx。例如，如果\
    \ WCF 客户端和服务都是使用 C# 构建的，我们可以考虑使用 NetTcpBinding 类，因为它在 .NET WCF 应用程序之间提供了高性能。更多信息请访问\
    \ http://msdn.microsoft.com/en-us/library/ms731092%28v=vs.110%29.aspx。\n\n为简单起见，本章我们将只处理\
    \ WCF 中的 SOAP Web 服务。\n\nWCF 是一个高度可扩展的框架，可以轻松集成到 NServiceBus 中。有关 NSB WCF 示例集成的更多信息，请访问\
    \ https://github.com/Particular/NServiceBus/tree/develop/IntegrationTests/WcfIntegration\
    \ 和 http://docs.particular.net/NServiceBus/how-do-i-expose-an-nservicebus-endpoint-as-a-web-wcf-service。\n\
    \n虽然微软的 WCF 被认为是实现 **面向服务的架构（SOA）** 指南组成部分的框架，但它并不是 ESB。WCF 并不包含实现 SOA 指南端到端解决方案所需的全部功能和设计模式（如\
    \ Saga）、持久化或其他开箱即用的功能。另一方面，将 NServiceBus 作为 ESB 与 WCF 的 Web 服务结合使用，会带来许多 WCF 和其他\
    \ Web 服务框架所无法提供的能力。\n\n## 源代码\n\n代码目录位于 `Payment_WCFService` 目录下。`WCFService`\
    \ 作为 WCF 服务，用于测试客户端。\n\n然后，该解决方案在 Windows Server 2012 上的 Visual Studio 2012 中运行，并安装了\
    \ MSMQ、DTC、RavenDB、NServiceBus 4.0 引用和 SQL Server 2012 Express LocalDB。\n\n必须先运行\
    \ `WCFService`，客户端 `Payment_WCFService` 才能向其发送消息。\n\n## 创建 WCF 服务器\n\n我们首先在 Visual\
    \ Studio 中创建一个 `WCFServer` 项目，因为服务器需要先运行才能与客户端通信。通过从 NuGet 或 Package Manager Console\
    \ 添加 `NServiceBus.Host` 引用，项目中会生成若干 NSB 默认设置（位于 `App.config` 文件中），并创建包含 `AsA_Server`\
    \ 的 `EndpointConfig.cs` 文件，同时该项目将被设置为使用 `NServiceBus.Host.exe` 可执行文件运行。我们可以通过下面的截图看到这些文件的创建：\n\
    \n![](img/8188651cea6a881a16242b395a81399a_109_0.png)\n\n当我们通过 NuGet 或 Package\
    \ Manager 向项目添加 NServiceBus.Host 引用时，项目还会被添加许多其他条目。这些其他条目如下：\n\n- 项目中会创建一个 EndpointConfig.cs\
    \ 文件，其中包含用于添加端点的默认设置。\n- 项目将被设置为以 DLL 形式运行，在从调试器运行时由 NServiceBus.Host.exe 可执行文件执行。\n\
    - 若干用于创建通用 AsA_Server 端点的默认设置将被添加到 App.config 文件中。\n\n从下面的截图可以看出，当我们添加 NServiceBus.Host\
    \ 引用时，它会将项目设置为使用 NServiceBus.Host.exe 可执行文件作为 DLL 运行：\n\n![](img/8188651cea6a881a16242b395a81399a_110_0.png)\n\
    \n我们将使用 NSB WCF 集成来节省我们这边的大量工作。为了使用此集成，我们需要一些与 NSB 和 WCF 相关的组件。具体如下：\n\n- Web\
    \ 服务：这与 NServiceBus.WcfService<TRequest, TResponse> 类一起使用，我们在这个 Web 服务上定义请求和响应。我们将在此展示，名为\
    \ PayService 的服务将接收 PaymentMessage 消息作为请求，并以 ErrorCodes 作为响应。如下面的一行代码所示：\n  public\
    \ class PayService : WcfService<PaymentMessage, ErrorCodes>\n- 消息处理程序：这是处理来自 Web\
    \ 服务的消息并在集成中处理该消息所必需的。我们将此处理程序称为 PayHandler。\n- 请求和响应消息结构：这是 PaymentMessages 项目所必需的。\n\
    - NSB 与 WCF 的配置：这在 App.config 文件中是必需的。\n"
