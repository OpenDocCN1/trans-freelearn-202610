    \ hardened through reuse in the industry, to rapidly deploy what's been designed\
    \ before. NSB has several design patterns that are popular in any robust and solid\
    \ ESB solution.\n\n### The publish-subscribe pattern\n\nOne of the biggest benefits\
    \ of using ESB technology is the availability of the publish-subscribe message\
    \ pattern (for more details, see http://en.wikipedia.org/wiki/Publish-subscribe_pattern).\
    \ The publish-subscribe pattern has been around for a very long time, and its\
    \ simplicity is the cornerstone of many, many systems.\n\nThe pattern makes use\
    \ of message queues, and NSB stores its messages through the use of queues, be\
