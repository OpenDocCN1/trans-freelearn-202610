- raw:
  - '[PAGE 27]


    # Additional SOA patterns


    There are many additional software design and messaging patterns that NSB supports.
    Many such patterns can be found at http://www.enterpriseintegrationpatterns.com.
    The purpose of design patterns is to provide reusable frameworks that have been
    hardened through reuse in the industry, to rapidly deploy what''s been designed
    before. NSB has several design patterns that are popular in any robust and solid
    ESB solution.


    # The publish-subscribe pattern


    One of the biggest benefits of using ESB technology is the availability of the
    publish-subscribe message pattern (for more details, see http://en.wikipedia.org/wiki/Publish-subscribe_pattern).
    The publish-subscribe pattern has been around for a very long time, and its simplicity
    is the cornerstone of many, many systems.


    The pattern makes use of message queues, and NSB stores its messages through the
    use of queues, be it MSMQ, SQL queues, RabbitMQ, Azure queues, or ActiveMQ. The
    basic premise is that a message is published to a queue; in NSB, it uses the Bus.Publish(message)
    function that places an event message in a queue that does not need to be sent
    to specific receivers. There can be multiple output channels called subscribers
    listening in on the publisher. The benefit is that the services do not depend
    on any relationship with each other except the message, and can act independently
    of each other. This is a service which is decoupled. This means that dependencies
    are separated from each other.


    Of course, normal NSB features still apply. For instance, the message will stay
    in the queue until the subscribers pull the message off the queue to handle it.
    For NSB, this means that the machine can be rebooted and the message will still
    be available in the queue until the subscribers process the message, which ensures
    that a message is never lost.


    The subscribers will process the message, and there could be one or many subscribers.
    For instance, the publisher may put 10 different types of messages in its queue,
    and there could be a subscriber for each type of message.'
  - '[PAGE 28]


    The NSB framework has plugins for Windows Performance Monitor. In Service Level
    Agreement (SLA) code of the endpoint, we can specify that new services will be
    created or alerts will be sent if the service does not meet performance criteria.
    So if one of the subscribers is not performing well, it will force the other subscribers
    to take over, as they are performing better across multiple machines. Because
    of this, NSB is a highly available, durable-messaging, high-performance ESB engine
    that can be developed in a multitude of ways. A design of the publish-subscribe
    pattern appears as follows:


    ![](img/8188651cea6a881a16242b395a81399a_28_0.png)


    In NSB, there are special types of messages used specifically for publish-subscribe,
    called events. This forces the code to handle the message in a publish-subscribe
    scenario, and not in a request-reply scenario.


    The publisher-subscriber mappings are done through the application configuration
    file. This will define the type of messages from the publisher queue that it will
    subscribe to, to handle the messages. When these programs execute, the subscription
    mappings will be further saved into a local database. By default, they are saved
    in RavenDB.'
