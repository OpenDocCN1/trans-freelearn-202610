    \ of the JRE. The installation instructions for ActiveMQ can be found at https://activemq.apache.org/getting-started#GettingStarted20-Download.\n\
    \n### The source code\n\nIn this section, we will be using the ActiveMQ solution.\
    \ This solution is similar to RabbitMQ, except ActiveMQ is used instead of RabbitMQ.\n\
    \nThere will be three basic steps:\n\n- 1. Add the NServiceBus.ActiveMQ reference.\n\
    - 2. Change the NServiceBus transport mechanism from `<MSMQ>` to `<ActiveMQ>`.\n\
    - 3. Set the ActiveMQ transport configuration in the App.config file.\n\nOnce\
    \ downloaded on the Windows OS, we unzipped the Windows binary files into the\
    \ c:\\activemq\\ directory. Running the activemq.bat batch file from the command\
    \ prompt, in c:\\activemq\\bin\\, will display a series of commands to show that\
    \ the ActiveMQ is running. This is shown in the following screenshot:\n\n![](img/8188651cea6a881a16242b395a81399a_151_0.png)\n\
    \nAn alternative is to install ActiveMQ as a Windows service in which installation\
    \ scripts exist for both Win32 and Win64 machines. For a 64-bit Windows Server,\
    \ we can use InstallService.bat in c:\\activemq\\bin\\win64\\.\n\nEnsure that\
    \ RabbitMQ is not running as a Windows Service in the background, as they utilize\
    \ the same network ports. Also, Microsoft ServiceBus for Windows Servers will\
    \ share the same AMQP ports as well, which will be port 5672. ActiveMQ's default\
    \ port is 61616. Checking the ports can be done with Microsoft's TcpView, which\
    \ can be found at http://technet.microsoft.com/en-us/sysinternals/bb897437.\n\n\
    To ensure that ActiveMQ is running, you may access the admin console in the browser\
    \ by using http://localhost:8161/admin. The default user ID and password are admin\
    \ and admin respectively. Please visit http://activemq.apache.org/getting-started.html\
    \ to have a look at the documentation. When accessing the admin console, you should\
    \ get something that looks like the screenshot here:\n\n![](img/8188651cea6a881a16242b395a81399a_152_0.png)\n\
    \nTo use ActiveMQ for NServiceBus in Visual Studio projects, the NuGet version\
    \ of NServiceBus.ActiveMQ has to be installed. Go to https://www.nuget.org/packages/NServiceBus.ActiveMQ/1.0.5\
    \ to look at installing PM> Install-Package NServiceBus.ActiveMQ into the projects.\
    \ Ensure that the configuration for the IBus is set for ActiveMQ, as shown here:\n\
    \n```\nprotected void Application_Start()\n{\n    Configure.ScaleOut(s => s.UseSingleBrokerQueue());\n\
    \    _startableBus = Configure.With()\n        .DefaultBuilder()\n        .RijndaelEncryptionService()\n\
    \        .UseTransport<ActiveMQ>()\n        .UnicastBus()\n        .CreateBus();\n\
    \    Configure.Instance.ForInstallationOn<Windows>().Install();\n\n    _bus =\
    \ _startableBus.Start();\n    AreaRegistration.RegisterAllAreas();\n\n    RegisterGlobalFilters(GlobalFilters.Filters);\n\
    \    RegisterRoutes(RouteTable.Routes);\n}\n```\n\nEnsure that the App.Config\
    \ or Web.Config file have the appropriate connection string for the NServiceBus/Transport\
    \ string to point at the correct instance of the ActiveMQ queues:\n\n```\n<connectionStrings>\n\
    <add name=\"NServiceBus/Transport\" connectionString=\"ServerUrl=activemq:tcp://localhost:61616\"\
    />\n</connectionStrings>\n```\n"
  mdcn: "\n\n正如我们所见，NServiceBus 测试 API 使用的是 Fluent API 规范风格的测试模式，而非大多数人通常会使用的、属于 nunit\
    \ 或其他 xunit 类型框架的传统断言风格。\n\n我们现在将开始测试来自 UnitTestHandlers 项目和 UnitTestSaga2.cs\
    \ 文件的 saga 代码。\n\n需要注意的一点是，如果 saga 实体对象在不同的函数调用中通过 MarkAsComplete() 方法被删除，这些应该分别进行测试。这是因为一旦我们删除了对象，就无法再次删除它。例如，在我们的测试中，我们将使用以下内容：\n\
    \n```\n[TestMethod]\npublic void Run()\n{\n    Test.Initialize();\n\n    /**\n\
    \     * State sent to Saga\n     * ***\n    */\n    SendCommand command = new\
    \ SendCommand();\n    command.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\"\
    );\n    command.state = MyMessages.MessageParts.StateCodes.SentMyWCFClient;\n\n\
    \    /**\n     * Response from WCF and to MVCApp\n     * ***\n    */\n    ResponseCommand\
    \ resp = new ResponseCommand();\n    resp.RequestId = new Guid(\"8b265223-dc9e-4789-a6df-69d19f644ad7\"\
    );\n    resp.state = MyMessages.MessageParts.StateCodes.CompleteMyWCFClient;\n\
    \n    Test.Saga<MyTestSaga>()\n        .ExpectReplyToOriginator<ResponseCommand>()\n\
    \        .ExpectSend<SendCommand>()\n        .When(s => s.Handle(command))\n \
    \       .ExpectReplyToOriginator<ResponseCommand>()\n        .When(s => s.Handle(resp))\n\
    \        .AssertSagaCompletionIs(true);\n\n    Test.Saga<MyTestSaga>()\n     \
    \   .ExpectReplyToOriginator<ResponseCommand>()\n        .ExpectSend<SendCommand>()\n\
    \        .ExpectTimeoutToBeSetIn<SendCommand>((state, span) => span == TimeSpan.FromHours(3))\n\
    \        .When(s => s.Handle(command))\n        .ExpectReplyToOriginator<ResponseCommand>()\n\
    \        .WhenSagaTimesOut()\n        .AssertSagaCompletionIs(true);\n}\n```\n\
    \n现在数据库部分已经创建，我们需要在 MSMQ 中创建 mysaga 端点。这只需按如下方式执行 MySaga 解决方案即可：\n\n![](img/8188651cea6a881a16242b395a81399a_143_0.png)\n\
    \n![](img/8188651cea6a881a16242b395a81399a_143_1.png)\n\n我们可以在 MSMQ Commander\
    \ 窗口中看到端点已创建，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_144_0.png)\n\n\
    如果测试运行成功，则 mysaga 端点存在并且正在工作。我们可以看到测试程序的工作情况如下：\n\n![](img/8188651cea6a881a16242b395a81399a_144_1.png)\n\
    \n数据库表，&lt;PayMessage&gt;，具有以下属性，如下所示：\n\n|  | Column Name | Data Type | Allow\
    \ Nulls |\n|---|---|---|---|\n| \U0001F511 | id | int | ☐ |\n|  | EventId | uniqueidentifier\
    \ | ☐ |\n|  | error | varchar(50) | ☑ |\n|  | state | varchar(50) | ☑ |\n\n##\
    \ RabbitMQ for NSB\n\nRabbitMQ 是一个跨平台的消息框架，像 MSMQ 一样，可以在 Linux 和 Windows 操作系统上运行。\n\
    \nRabbitMQ 比 MSMQ 具有更多功能，例如路由、虚拟主机和强大的管理工具集。它可以在 Linux 上运行并且扩展性非常好。对于大型企业系统（尤其是在异构网络环境中），你应该认真考虑\
    \ RabbitMQ。RabbitMQ 可以在 NSB 配置中轻松替换 MSMQ 队列系统。\n\n对于 RabbitMQ 的管理，可以轻松安装 Web 管理界面。然而，如果需要命令行界面，则需要安装\
    \ Python 语言。\n\n为了重温前面章节中的一些参考资料，请查看以下内容：\n\n- **Local host management site**:\
    \ 这可以在 http://localhost:15672/#/. 找到。\n- **Documentation**: 这可以在 http://www.rabbitmq.com/documentation.html.\
