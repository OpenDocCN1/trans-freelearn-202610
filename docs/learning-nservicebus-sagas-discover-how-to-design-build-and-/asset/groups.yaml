    # Azure Service Bus and Storage Queues


    NSB supports queuing in both Azure Storage Queues and the Azure Service Bus Queues.


    Please note that there are many differences between using Azure Storage Queues
    and Azure Service Bus Queues.


    > Note the different names in this example. Service Bus Queues have more features
    for management such as guaranteed FIFO, while Azure Queues have less manageability
    built in. Visit http://msdn.microsoft.com/en-us/library/hh767287.aspx for more
    information.'
