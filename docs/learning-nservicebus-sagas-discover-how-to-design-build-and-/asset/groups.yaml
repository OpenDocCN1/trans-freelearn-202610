    multiple machines. These tables have entities with partitions and row keys to
    access the entity. It is a key-value store to store the data. These tables do
    not enforce a schema. By not using a schema, speed is enhanced and the tables
    are loosely coupled with the objects as they are managed by keys. The limitation
    is not being able to execute SQL queries, but in most cases, it can take less
