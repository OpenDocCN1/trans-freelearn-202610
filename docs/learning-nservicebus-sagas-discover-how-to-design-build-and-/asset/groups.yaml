    \n![](img/8188651cea6a881a16242b395a81399a_30_0.png)\n\n### The source code\n\n\
    In this section, we will be using the following gateway solutions:\n\n- Headquarters.Messages:\
    \ This refers to the common messages for Headquarters, SiteA, and SiteB.\n- Headquarters:\
    \ This will receive messages from http://localhost:25899/Headquarter/ and http://localhost:25899/Headquarter2/,\
    \ and send messages to http://localhost:25899/SiteA/ and http://localhost:25899/SiteB/.\n\
