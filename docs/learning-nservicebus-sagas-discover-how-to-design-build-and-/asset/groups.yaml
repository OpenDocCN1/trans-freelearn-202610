    ## 特定服务平台


    在本章中，我们将重点关注 Particular Service Platform，其中包括 ServicePulse、ServiceControl、ServiceInsight
    和 ServiceMatrix。我们可以使用 ServicePulse 来获取 NServiceBus（NSB）端点、消息、saga 和服务的脉搏。这更像是一个生产监控产品，供运维人员检查正在运行的
    NSB 组件。


    ServiceInsight 是用于深入了解 NSB 端点、消息、saga 和服务的产品，以便深入排查问题并详细验证操作的正确性。ServiceMatrix
    是图形化开发者界面，可扩展到 Visual Studio 画布，用于生成 NSB 端点、服务和消息的代码。


    在本章中，我们将介绍：


    - ServicePulse

    - ServiceControl

    - ServiceInsight

    - ServiceMatrix

    - 通过 ServiceMatrix 进行发布-订阅

    - 通过 ServiceMatrix 进行 Sagas

    - 为 ServicePulse 引入自定义检查


    ## 介绍 NSB 组件


    可以从 http://particular.net/ 许可许多工具，以帮助开发和监控 NSB 组件。NSB 组件包括端点、消息和服务。组件包括 IBus 上配置的任何项目。


    ServiceMatrix 是可安装到 Visual Studio 2012 的扩展插件。该插件创建 NSB 画布，通过向导创建各种 NSB 组件，并生成用于
    ESB 的 C# 代码。ServiceMatrix 通过生成与 NSB Canvas 中设计的图表相匹配的代码来简化和标准化开发生命周期，并帮助开发人员通过
    NSB Visual Studio 向导创建 NSB 标准化代码。NSB 向导有助于学习不同部分如何构成从头到尾的 NSB 应用程序。ServiceMatrix
    还创建骨架组件并关联生成的 C# 代码，以便开发人员以更少的精力运行端到端的 NSB 解决方案。


    ServiceControl 是 NSB 的管理扩展控制器。其代码可从 https://github.com/Particular/ServiceControl
    下载。ServiceControl 是一个 Windows 服务，收集端点、消息和服务信息，并将其存储在本地 RavenDB 中。这样其他产品如 ServicePulse
    和 ServiceInsight 就可以访问信息以报告服务的运行状况并提供有关消息的详细信息。ServicePulse 通过心跳插件检查 NSB 应用程序的心跳，并提供自定义检查。它有一个仪表板，显示哪些
    NSB 应用程序在生产环境中处于运行状态。ServiceInsight 提供消息、端点和服务的详细信息。它显示消息的详细图形流程和属性，包括端点和服务信息、超时、有效负载等。ServiceInsight
    允许深入挖掘消息传递。这些工具可从下载页面 http://particular.net/downloads 找到。虽然可以在没有这些工具的情况下监控、维护和构建
    NSB 应用程序，但这些工具投入了大量工作来帮助开发人员理解、构建和维护 NSB 应用程序，以便更快地将构建更好的产品推向市场。


    我们将逐步介绍设置 ServicePulse，然后是 ServiceInsight，然后使用 ServiceMatrix 构建一些应用程序，供 ServicePulse
    和 ServiceInsight 检查。ServiceControl 是 ServicePulse 和 ServiceInsight 都需要使用的安装，以便收集其信息。我们将从
    ServicePulse 开始向我们展示仪表板，因为它是这些工具中最基础的。要运行本章中的任何应用程序，必须安装 ServiceControl、ServicePulse、ServiceMatrix
    和 ServiceInsight。您可以通过访问 http://particular.net/downloads 并点击 Download Now 按钮来下载这些产品，选择通过
    Platform Installer 安装所有产品，该安装程序适用于 Windows 8.1 及其他桌面机器。对于某些服务器，如 Windows Server
    2008，此按钮可能无法使用，可能需要从此页面单独安装各个下载项。本章假设所有这些产品都已安装。


    ServicePulse 将通过其在安装 ServicePulse 时的设置来知道如何调用 JSON API 的此起点。请参阅以下屏幕截图，了解我们设置 ServiceControl
    API 实例的位置：


    ![](img/8188651cea6a881a16242b395a81399a_76_0.png)


    让我们看一个简单示例。我们可以从 https://github.com/Particular/NServiceBus.Msmq.Samples/tree/master/PubSub
    的发布-订阅 MSMQ 示例开始。


    我们需要通过 NuGet 添加 ServiceControl 插件以生成用于监控目的的 ServiceControl 端点，否则将没有任何内容供 ServiceControl
    监控。目前可用的插件如下：


    - ServiceControl.Plugin.DebugSession：可在 https://www.nuget.org/packages/ServiceControl.Plugin.Nsb4.DebugSession/
    找到 4.x 版本，以及 https://www.nuget.org/packages/ServiceControl.Plugin.Nsb5.DebugSession/
    找到 5.x 版本。部署后，调试会话插件会将指定的调试会话标识符添加到端点发送的每条消息的标头中。这允许在 ServiceInsight 中关联、过滤并突出显示在
    Visual Studio 中调试或测试运行期间发送的消息。


    2. 然后，我们可以在 ServicePulse 中检查心跳，以验证应用程序是否发出指示可用性的心跳。我们通过 URL http://localhost:9090
    监控 ServicePulse。这在以下 ServicePulse 屏幕截图中可见


    ![](img/8188651cea6a881a16242b395a81399a_78_0.png)


    3. 如果服务出现问题，请始终检查 ServiceControl 和 ServicePulse 是否正在运行。以下屏幕截图显示了它们正在运行：


    ![](img/8188651cea6a881a16242b395a81399a_78_1.png)


    ## 理解 ServiceInsight 及其功能


    ServiceInsight 提供对特定消息的详细洞察。它提供详细流程、时序和错误处理，以及重试消息、排序消息、查看其标头、查看其 saga、复制标头、复制消息等功能。


    我们将在构建的 ServiceMatrix 示例中进一步探索这一点，但我们需要熟悉 ServiceInsight 的功能。您可能选择在开发中不使用其中一些工具，但本章的目的是讨论这些工具。


    在本章后续关于 ServiceMatrix 的部分中，我们将采用 PaymentEngine - Start 目录中的此请求-响应解决方案并扩展为发布-订阅消息流，并添加
    saga。最终结果是发布-订阅和 saga 将位于 PaymentEngine - Sagas 目录中。

    在 Windows 8.1 中，您可能需要以管理员身份运行 Visual Studio 2012。在 Windows Server 2008 和 Windows
    Server 2012 上运行 Visual Studio 2012 时，您可能不需要以管理员身份运行 Visual Studio 2012。


    ## 创建 ServiceMatrix 解决方案


    我们将通过导航到 Tools | Extensions and Updates 在 Visual Studio 中安装 ServiceMatrix。您将看到以下屏幕：


    ![](img/8188651cea6a881a16242b395a81399a_81_0.png)


