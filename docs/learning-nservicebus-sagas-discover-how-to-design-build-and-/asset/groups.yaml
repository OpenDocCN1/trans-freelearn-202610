    ## Introducing NSB components


    There are many tools that can be licensed from http://particular.net/ which aid
    in developing and monitoring NSB components. NSB components include endpoints,
    messages, and services. Components include any of the configured items on the
    IBus.


    ServiceMatrix is an extension plugin that can be installed into Visual Studio
    2012. This plugin creates an NSB canvas that creates various NSB components through
    wizards, which will generate C# code to be used for the ESB. ServiceMatrix simplifies
    and standardizes the development lifecycle by generating code to match diagrams
    designed in the NSB Canvas, and helps developers create NSB-standardized code
    from the NSB Visual Studio wizard. NSB wizards assist in learning how different
    pieces make up an NSB application from end to end. ServiceMatrix also creates
    skeleton pieces and associate generated C# code to run an end-to-end NSB solution
    with less effort from the developer.


    ServiceControl is a controller that is a management extension to NSB. Its code
    can be downloaded from https://github.com/Particular/ServiceControl. ServiceControl
    is a Windows service that collects endpoints, messages, and service information,
    and stores it in a local RavenDB. This is done so that other products such as
    ServicePulse and ServiceInsight can access the information to report on the heartbeats
    of services and give detailed information regarding messages. ServicePulse checks
    for heartbeats on NSB applications with the heartbeat plugin, and provides custom
    checks as well. It has a dashboard that shows which NSB applications are up and
    running for production. ServiceInsight provides details of messages, endpoints,
    and services. It shows a detailed graphical flow of messages and properties of
    messages that includes endpoints and service information, timeouts, payloads,
    and more. ServiceInsight allows a deep-dive into messaging. These tools can be
    found from the download page, http://particular.net/downloads. While it is possible
    to monitor, maintain, and build NSB applications without these tools, there is
    a lot of work and effort that has gone into these tools to help the developer
    understand, build, and maintain NSB applications, to get a product that is better
    built and is made available to the market faster.


    We will walk through setting up ServicePulse, then ServiceInsight, and then build
    some applications with ServiceMatrix to be examined by both, ServicePulse and
    ServiceInsight. ServiceControl is an install that both ServicePulse and ServiceInsight
    will need to use to gather its information. We will start with ServicePulse to
    show us a dashboard as it is the most basic of these tools. To run any of the
    applications in this chapter, ServiceControl, ServicePulse, ServiceMatrix, and
    ServiceInsight must be installed. You can download these by going to http://particular.net/downloads
    and clicking on the Download Now button to select all the products through a Platform
    Installer, which will work on Windows 8.1 and other desktop machines. For some
    servers such as Windows Server 2008, this button may not work, and individual
    downloads from this page may have to be installed separately. This chapter assumes
    that all these products are installed.


    ServicePulse will know how to call this starting point of the JSON API by its
    setting when ServicePulse is installed. Please see the following screenshot to
    see where we set the ServiceControl API instance:


    ![](img/8188651cea6a881a16242b395a81399a_76_0.png)


    Let''s look at a simple example. We can start with the publish-subscribe MSMQ
    example from https://github.com/Particular/NServiceBus.Msmq.Samples/tree/master/PubSub.


    We will need to add ServiceControl plugins through NuGet to generate ServiceControl
    endpoints for monitoring purposes, otherwise there will be nothing to monitor
    ServiceControl. The following plugins are currently available:


    - ServiceControl.Plugin.DebugSession: This is found at https://www.nuget.org/packages/ServiceControl.Plugin.Nsb4.DebugSession/
    for version 4.x and https://www.nuget.org/packages/ServiceControl.Plugin.Nsb5.DebugSession/
    for version 5.x. When deployed, the debug session plugin adds a specified debug
    session identifier to the header of each message sent by the endpoint. This allows
    messages sent by debugging or a test run within Visual Studio to be correlated,
    filtered, and highlighted within ServiceInsight.


    2. Then, we can check heartbeats in ServicePulse to validate that the applications
    are giving heartbeats that indicate availability. We monitor ServicePulse through
    the URL, http://localhost:9090. This can be seen in the following screenshot for
    ServicePulse


    ![](img/8188651cea6a881a16242b395a81399a_78_0.png)


    3. If there are issues with the services, always check that ServiceControl and
    ServicePulse are running. The following screenshot shows these running:


    ![](img/8188651cea6a881a16242b395a81399a_78_1.png)


    ## Understanding ServiceInsight and its function


    ServiceInsight provides detailed insights into a specific message. It provides
