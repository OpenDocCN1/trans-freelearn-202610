    />\n<add name=\"NServiceBus/Persistence\" connectionString=\"Data Source=.\\SQLEXPRESS;Initial\
    \ Catalog=nservicebus;Integrated Security=True\"/>\n</connectionStrings>\n<!--\
    \ specify the other needed NHibernate settings like below in appSettings:-->\n\
    <appSettings>\n<!-- dialect is defaulted to MsSql2008Dialect, if needed change\
