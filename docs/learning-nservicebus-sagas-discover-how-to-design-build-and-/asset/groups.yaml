    NHibernate.Connection.DriverConnectionProvider\"/>\n<add key=\"NServiceBus/Persistence/NHibernate/connection.driver_class\"\
    \ value=\"NHibernate.Driver.Sql2008ClientDriver\"/>\n</appSettings>\n```\n\nThis\
    \ gateway pattern allows us to pass messages through HTTP/HTTPS to allow queuing\
    \ across outside systems from the local LAN. Normally web services run through\
