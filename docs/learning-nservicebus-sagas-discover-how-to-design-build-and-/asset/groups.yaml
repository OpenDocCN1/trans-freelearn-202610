    # About the Reviewers


    **Neil Bourgeois** is a software engineer at Pentair Technical Solutions, where
    he leads the Engineering Software team. Solutions he has architected and implemented
    include a high-volume metering and billing system for the utilities industry and
    an industry-leading 3D engineering tool for the industrial heat-tracing field.
    He applies the discipline of Agile software development to his work and believes
    that great software comes from great team cultures. He strives to lead his teams
    to great cultures.


    **Prashant Brall** is a principal consultant and senior software architect/developer
    who uses Microsoft technologies. He works for Veritec Pty Ltd (www.veritec.com.au)
    in Canberra, Australia, and has been developing software for the past 18 years.
    He enjoys writing about his experiences on his blog at https://prashantbrall.wordpress.com.


    Prashant has also reviewed the book *Instant AutoMapper, Packt Publishing.*


    In his leisure time, he enjoys watching movies with his wife and playing musical
    instruments.


    > I would like to thank my fantastic wife, Jhumur, for being my best friend and
    for all the love and support she has given me. I would also like to thank my parents
    Mr. Hem Brall and Mrs. Prabha Brall for all the guidance, love, and care they
    have given me.'
