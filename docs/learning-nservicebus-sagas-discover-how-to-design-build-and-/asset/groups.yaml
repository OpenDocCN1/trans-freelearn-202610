    \nWhile these are some of the benefits of using XAML and WPF, for our simple purposes,\
    \ in the TimerPickerTest project, we will be using the toolbox that is enclosed\
    \ with Visual Studio 2012 to do our graphics to match the following:\n\n![](img/8188651cea6a881a16242b395a81399a_162_0.png)\n\
    \nThis GUI is to set several variables: the Email Server, which by default is\
    \ set as the localhost, and the To and From addresses, which are both set by default\
    \ as test@google.com.\n\n### The saga project\n\nThe saga project in this solution\
    \ will be called TimerSaga. It will be dependent on the messages found in the\
    \ TimerMessages project that will contain the available NSB messages.\n\nThis\
    \ project will look like the typical saga projects that we have built thus far,\
    \ as follows:\n\n![](img/8188651cea6a881a16242b395a81399a_163_0.png)\n\nWe see\
    \ that we are referencing the NServiceBus.Host reference, which in turn created\
    \ the EndpointConfig.cs file to contain the code for the bus configuration. We\
    \ also know that it must have set the NServiceBus.Host.exe file to debug this\
    \ project as a DLL through NSB. An App.config file was also created with the NSB\
    \ host reference to include the unicast and other settings for the EndpointConfig.cs\
    \ file.\n\nThe App.config file will contain the setting to send SendTime, the\
    \ message with timing information, and EmailMessage, the message with the e-mail\
    \ information, to the EmailClient endpoint, which will have a message handler\
    \ to send the operational e-mail. This setting will be as follows:\n\n```\n<UnicastBusConfig>\n\
    \  <MessageEndpointMappings>\n    <add Endpoint=\"EmailClient\" Messages=\"TimerMessages.EmailMessage,\
    \ TimerMessages\" />\n    <add Endpoint=\"EmailClient\" Messages=\"TimerMessages.SendTime,\
    \ TimerMessages\" />\n  </MessageEndpointMappings>\n</UnicastBusConfig>\n```\n\
    \n```\ns_Time.SecTxt = \"00\";\n    s_Time.AmPmTxt = \"PM\";\n\n    _bus.Send(s_Time);\n\
    }\n}\n```\n\nTo test the e-mail, here is a Simple Mail Transfer Protocol (SMTP)\
    \ listener that will intercept the e-mails locally on port 25 for viewing, to\
    \ test your e-mail sending scenarios. It can be found at http://smtp4dev.codeplex.com/.\
    \ When the e-mail is sent to the localhost, it will be recorded for review in\
    \ the smtp4dev software.\n\n![](img/8188651cea6a881a16242b395a81399a_168_0.png)\n\
    \nIf all works well and we receive our message from the e-mail client, we should\
    \ be getting an e-mail that looks similar to the following screenshot:\n\n![](img/8188651cea6a881a16242b395a81399a_169_0.png)\n\
    \nWe just walked through a simple solution using a GUI to configure an e-mail\
    \ client to send us a daily operational e-mail about MSMQ. This example could\
    \ be easily extended to provide a daily report of SQL Server tables, the number\
    \ of messages in an audit or error queue, and many other items to check the operational\
    \ status of a system.\n\nAnother daily example, especially for anyone dealing\
    \ with payment engines sending files to banks or for third-party transmissions,\
    \ is the use of SFTP to send files. With the usage of SFTP, e-mail, and WCF in\
    \ the previous chapter, many enterprise scenarios can be solved.\n\nThe requirement\
    \ of this application is that we set a timer through a GUI. This GUI will also\
    \ allow some SFTP variables to be set, such as the SFTP server, username, password,\
    \ and local text file location.\n\nThe timer will set a daily time in the saga\
    \ to upload a daily text file, which will be given a unique name based on date\
    \ and time into the SFTP server. This avoids overwriting the same filename.\n\n\
    The daily upload will be a simple example of uploading a file using saga interaction\
    \ to a remote SFTP server, such as a bank, for batch payments. We do not wish\
    \ to hardcode the timer or some of the SFTP variables. We also do not wish to\
    \ use the Windows Task Scheduler as that will require more operational support.\
    \ This exercise will be handled easily in NSB.\n\nSeparating the frontend GUI\
    \ from the backend SFTP client through a saga that is acting as a persistence\
    \ and message mediator offers several benefits:\n\n- **Separation of duties**:\
    \ If the frontend has issues, it does not necessarily propagate those issues to\
    \ the SFTP client, as long as the messaging is correct. SFTP may have issues logging\
    \ in on occasion due to password resets, or network or even server issues. By\
    \ not having the frontend directly tied to the SFTP client, we can avoid the frontend\
    \ crashing on SFTP issues.\n- **Message durability**: Depending on the configuration,\
    \ the messages, endpoints, and saga data are persisted to the point that the server\
    \ can crash, but the data is still recoverable.\n- **Retries**: If a message fails,\
    \ it will retry several times based on the configuration. This may allow us to\
    \ try the SFTP client-to-server connections multiple times if there are errors\
    \ within the SFTP connection.\n- **Monitoring**: There are many tools, and depending\
    \ on the persistence and queuing configurations, many ways to check the endpoints,\
    \ messages, and services. This may allow us to monitor the SFTP client as well\
    \ as the information being passed into it to validate if it is correct for an\
    \ SFTP connection.\n- **High availability**: NSB is a high-availability framework,\
    \ meaning that there are multiple connections, endpoints, and server and messaging\
    \ scenarios for configuration to ensure that services are always running in the\
    \ background and receiving information in a high-performance environment.\n\n\
    Many of these topics have been covered, but as different requirements are discussed\
    \ for this sample application, these features will be added by just using NSB.\n"
  mdcn: "\n\n然后，我们用这个示例，通过少量修改将传输机制从 MSMQ 改成了 RabbitMQ。在测试部分，我们讨论了如何让 saga 和消息处理器变得相似，也讨论了如何对它们进行足够的改动以增强其用途。我们还简要讨论了众多\
    \ NServiceBus 测试规则，以便在单元测试环境中构建处理器，而暂不需要考虑端点问题。\n\n在接下来的章节中，我们将会继续展示更多的代码片段和场景。我们还会更详细地讨论如何使用处理器来满足事务处理和错误处理的需求。在后面的讨论中，我们也会进一步介绍相关工具的使用。\n\
    \n## 5 Saga 代码片段\n\n在本章中，我们将重点讨论 saga 中的代码片段。我们将介绍一个电子邮件和**安全文件传输协议（SFTP）**的示例，该示例将由\
    \ saga 代码中的每日定时器设置为超时。saga 代码将充当前端**Windows Presentation Foundation（WPF）**与执行电子邮件或\
    \ SFTP 的后端客户端之间的中介。使用 saga 作为前端和后端代码之间的中介，与外部服务器交互，将带来许多额外的好处和功能。外部服务器接口，例如电子邮件服务器或\
    \ SFTP 服务器，通常不受我们的控制，而是由外部运营方或组织（如银行）控制。因此，我们能处理的只有这些服务器的接口；随着业务、软件和运营需求的增长，我们需要一个足够健壮的框架来满足这些需求。于是，我们有了\
    \ NSB 和 saga。\n\n我们还将逐步讲解如何修改此应用程序以支持 ActiveMQ。我们将简要讨论 ActiveMQ，以及如何对其进行设置以执行这些操作。\n\
    \n在本章中，我们将涵盖：\n\n- 示例电子邮件 saga 通知\n- 示例 SFTP saga\n- Saga 部署\n- ActiveMQ\n\n![](img/8188651cea6a881a16242b395a81399a_159_0.png)\n\
    \n此应用程序的需求是：我们通过 GUI 设置一个定时器。这个 GUI 还可以设置一些电子邮件变量，例如电子邮件服务器、收件人和发件人地址。定时器将在 saga\
    \ 中设置一个时间，用于发送每日电子邮件。每日电子邮件将是一封简单的邮件，将可用的 MSMQ 队列发送给运营人员。我们不希望硬编码定时器或任何电子邮件变量。我们也不希望使用\
    \ Windows 任务计划程序，因为那需要更多的运维支持。这个练习在 NSB 中可以轻松处理。\n\n通过一个充当持久化和消息中介的 saga，将前端 GUI\
    \ 与后端电子邮件客户端分离，带来了几个好处：\n\n- 职责分离：如果前端出现问题，只要消息传递正确，saga 不一定会将这些问题传播给电子邮件客户端。\n\
    - 消息持久性：根据配置，消息、端点和 saga 数据会被持久化，即使服务器崩溃，数据仍然可以恢复。\n\n![](img/8188651cea6a881a16242b395a81399a_161_0.png)\n\
    \nMicrosoft Blend 提供了广泛的工具，可以在所见即所得（WYSIWYG）的可视化编辑器中构建用户界面，下面的截图给出了一个示例：\n\n![](img/8188651cea6a881a16242b395a81399a_161_1.png)\n\
    \n虽然这些是使用 XAML 和 WPF 的一些好处，但出于我们的简单目的，在 TimerPickerTest 项目中，我们将使用 Visual Studio\
    \ 2012 自带的工具箱来完成图形界面，如下图所示：\n\n![](img/8188651cea6a881a16242b395a81399a_162_0.png)\n\
    \n这个 GUI 用于设置几个变量：电子邮件服务器（默认设置为 localhost），以及收件人和发件人地址（两者默认都设置为 test@google.com）。\n\
    \n### saga 项目\n\n此解决方案中的 saga 项目将命名为 TimerSaga。它将依赖于 TimerMessages 项目中的消息，该项目包含可用的\
    \ NSB 消息。\n\n这个项目看起来会像我们迄今为止构建的典型 saga 项目，如下所示：\n\n![](img/8188651cea6a881a16242b395a81399a_163_0.png)\n\
    \n我们看到，我们引用了 NServiceBus.Host 引用，这反过来创建了 EndpointConfig.cs 文件，其中包含总线配置的代码。我们也知道，它必须设置\
    \ NServiceBus.Host.exe 文件，以便通过 NSB 将此项目作为 DLL 进行调试。同时，还创建了一个 App.config 文件，包含\
    \ NSB 主机引用，其中包括 EndpointConfig.cs 文件的单播和其他设置。\n\nApp.config 文件将包含以下设置：将 SendTime（带时间信息的消息）和\
    \ EmailMessage（带电子邮件信息的消息）发送到 EmailClient 端点，该端点将有一个消息处理器来发送运营电子邮件。该设置如下：\n\n\
    ```\n<UnicastBusConfig>\n  <MessageEndpointMappings>\n    <add Endpoint=\"EmailClient\"\
    \ Messages=\"TimerMessages.EmailMessage, TimerMessages\" />\n    <add Endpoint=\"\
    EmailClient\" Messages=\"TimerMessages.SendTime, TimerMessages\" />\n  </MessageEndpointMappings>\n\
    </UnicastBusConfig>\n```\n\n```\ns_Time.SecTxt = \"00\";\n    s_Time.AmPmTxt =\
    \ \"PM\";\n\n    _bus.Send(s_Time);\n}\n}\n```\n\n为了测试电子邮件，这里有一个简单邮件传输协议（SMTP）侦听器，它将在本地第\
    \ 25 号端口拦截电子邮件以供查看，从而测试你的电子邮件发送场景。可以在 http://smtp4dev.codeplex.com/ 找到它。当电子邮件发送到\
    \ localhost 时，它将被记录在 smtp4dev 软件中供审查。\n\n![](img/8188651cea6a881a16242b395a81399a_168_0.png)\n\
    \n如果一切正常，并且我们收到了来自电子邮件客户端的消息，我们应该会收到一封类似于以下截图的电子邮件：\n\n![](img/8188651cea6a881a16242b395a81399a_169_0.png)\n\
    \n我们刚刚演示了一个简单解决方案，使用 GUI 配置电子邮件客户端，向我们发送关于 MSMQ 的每日运营电子邮件。这个示例可以轻松扩展，以提供 SQL Server\
    \ 表的每日报告、审计或错误队列中的消息数量，以及许多其他用于检查系统运行状态的项目。\n\n另一个日常示例，尤其是对于需要向银行发送文件或进行第三方传输的支付引擎相关人员，是使用\
    \ SFTP 发送文件。通过结合上一章中的 SFTP、电子邮件和 WCF，可以解决许多企业级场景。\n\n此应用程序的需求是：我们通过 GUI 设置一个定时器。这个\
    \ GUI 还可以设置一些 SFTP 变量，例如 SFTP 服务器、用户名、密码和本地文本文件位置。\n\n定时器将在 saga 中设置一个每日时间，用于上传每日文本文件，该文件将根据日期和时间获得唯一的名称，并上传到\
    \ SFTP 服务器。这样可以避免覆盖相同的文件名。\n\n每日上传将是一个简单的示例，演示如何使用 saga 交互将文件上传到远程 SFTP 服务器（例如银行）以进行批量支付。我们不希望硬编码定时器或某些\
    \ SFTP 变量。我们也不希望使用 Windows 任务计划程序，因为那需要更多的运维支持。这个练习在 NSB 中可以轻松处理。\n\n通过一个充当持久化和消息中介的\
    \ saga，将前端 GUI 与后端 SFTP 客户端分离，带来了几个好处：\n\n- **职责分离**：如果前端出现问题，只要消息传递正确，不一定会将这些问题传播给\
    \ SFTP 客户端。SFTP 偶尔可能因密码重置、网络甚至服务器问题而无法登录。通过不让前端直接与 SFTP 客户端绑定，我们可以避免前端因 SFTP 问题而崩溃。\n\
    - **消息持久性**：根据配置，消息、端点和 saga 数据会被持久化，即使服务器崩溃，数据仍然可以恢复。\n- **重试**：如果消息失败，根据配置，它会重试多次。这可能允许我们在\
    \ SFTP 连接出错的多次尝试 SFTP 客户端到服务器的连接。\n- **监控**：有许多工具，并且根据持久化和队列配置的不同，有多种方法可以检查端点、消息和服务。这可能允许我们监控\
    \ SFTP 客户端以及传入其中的信息，以验证其是否适用于 SFTP 连接。\n- **高可用性**：NSB 是一个高可用性框架，这意味着在配置中可以有多个连接、端点、服务器和消息传递场景，以确保服务始终在后台运行，并在高性能环境中接收信息。\n\
    \n其中许多主题已经讨论过，但随着针对此示例应用程序的不同需求被讨论，只需使用 NSB 即可添加这些功能。\n\n"
