  - '[PAGE 185]


    # 6

    Using NServiceBus in

    the Cloud


    In this chapter, we will be focusing on snippets in NServiceBus in the cloud after
    a very brief introduction to the cloud and some of its services. While NServiceBus
    has support as a service bus for the Microsoft Azure cloud, it is also a beneficial
    tool to integrate into other cloud technologies, as all clouds have support for
    third-party integration to pass data through web services.


    In this chapter, we will cover:


    +   - Introducing the cloud and NSB

    +   - Introducing PaaS, IaaS, and SaaS

    +   - Using Microsoft Azure

    +     - Introducing Azure Storage services

    +     - Azure Service Bus and Storage Queues

    +     - Azure Storage Queues and NSB

    +     - Azure Service Bus in NSB


    # Introducing the cloud and NSB


    As this book is being written, NSB Version 5.0 for Azure is in the beta stage,
    and many updates have been made to NSB for cloud computing.


    Instead of using a local SQL Server, RavenDB, or MSMQ queuing system, all the
    subscription data, saga persistence, timeout persistence, and queuing messages
    can be used in Azure Storage, as well as a message be put in the Azure Service
    Bus. In many cases, there is one-to-one mapping to storage tables and the data
    information as keys are used to retrieve data instead of SQL schemas.'
  - '[PAGE 186]


    NSB tools are adapting as well. ServiceInsight is growing to handle more details
    with sequence diagrams for debugging outside of Visual Studio and MSMQ environments.
    The tools are moving from being integrated locally into a physical server to being
    integrated into a remote server where many of the details of the server itself
    may be less important as servers are virtualized offsite. For instance, the future
    of ServiceInsight will add Saga Sequence diagrams to add more detail than the
    current flow diagrams. Here''s what is coming soon for ServiceInsight as a sequence
    diagram:


    ![](img/8188651cea6a881a16242b395a81399a_186_0.png)


    However, distributed transactions are not supported in many cloud technology queues.
    Other queuing platforms, such as RabbitMQ, also do not support distributed transactions.
    NSB Version 5.0 has the added functionality to compensate for not having distributed
    transactions by establishing tables that keep track of the status of transactions
    as they occur. This functionality allows transactional integrity where it may
    not exist natively.'
  - '[PAGE 187]


    # Introducing PaaS, IaaS, and SaaS


    Cloud computing services are provided using three fundamental models:


    +   - **SaaS**: This stands for **Software as a Service**. This facilitates pay-per-use
    managed software services for consumption. Our responsibility is the configuration
    of these services that are managed by the cloud vendor. An example would be Google
    mail. This offers abstraction of the business software.

    +   - **PaaS**: This stands for **Platform as a Service**. This refers to pay-as-you-go
    generic services for consumption. These are services such as queuing, web servers,
    and other services that still require business software to be built. Our responsibility
    includes building the business software. This offers abstraction of the services
    that can run business software.

    +   - **IaaS**: This stands for **Infrastructure as a Service**. Providers of
    IaaS offer generic storage, networks, and servers for consumption. These are services
    such as storage that still require services and business software that has to
    be built. Our responsibility includes building the business software and creating
    services for the business software. This offers abstraction of the infrastructure
    that is running the platform services.


    PaaS is a cloud computing service that provides a computing platform and a solution
    stack as a service. In PaaS, the cloud computing provider provides the operating
    systems, databases, web servers, development tools, and other services that are
    required to host the consumer''s application.


    IaaS is a level below PaaS, as it provides the virtual (as well as physical) machines,
    servers, storage options, load balancers, networks, and more basic components.'
  - '[PAGE 188]


    SaaS is a level higher than PaaS, as it is the software distribution model in
    which the applications themselves are hosted by a vendor or service provider and
    are made available to customers over a network, typically the Internet. Here is
    a look at how Windows Azure supports IaaS and PaaS:


