    ![](img/8188651cea6a881a16242b395a81399a_40_0.png)


    This code has all the pieces of a simple saga. The code could be created with
    a combination of other frameworks as well, such as Quartz for the timer and TopShelf
    to create services, but NSB is a complete framework that provides end-to-end pieces
    of architecture and many patterns that have all the pieces.


    The end message that showed the Timed status in the Windows form could easily
    be the execution of a job, another program, an e-mail of system status, a report
    of the system status, and many more timed tasks. The number of seconds used earlier
    was just a demonstration. The RequestTimeout() function could take seconds, minutes,
    hours, days, or could be executed at a specific time of day. We could execute
    the function with a weekend and holiday calendar and extend the functionality
    further. We could create a centralized saga timer to literally schedule all the
    tasks like Microsoft Task Scheduler, but create a managed service that can be
    monitored, managed, perform reporting, and improve functionality in a much further
    detailed solution.


    # Message mutation patterns


    Message mutators allow you to change messages by plugging custom logic into a
    couple of simple interfaces. For instance, you can encrypt a part or all of a
    message. The encryption message mutator is part of the NServiceBus library, and
    can be used at any time. You can intercept the incoming message and then mutate
    it before sending it as an outgoing message. This is the process of changing messages
    as they leave a client and enter a server.'
  - '[PAGE 41]


    # The source code


    In this section, we will be using the MessageMutators solution with the following
    projects:


    +   - Client: The client will send messages to the server.

    +   - Server: This will receive the mutated message.

    +   - Messages: This is the message format being passed between client and server.

    +   - MessageMutators: This project will contain the mutation code to compress
    and decompress the messages in TransportMessageCompressionMutator.cs and validate
    the message annotation in ValidateMessageMutator.cs.


    The client and server needs to be running. The client will prompt to send a good
    or bad message. The good message is compressed so that it will pass the 4 MB MSMQ
    buffer size, as shown in the following screenshot:


    ![](img/8188651cea6a881a16242b395a81399a_41_0.png)


    The queue''s data will be validated and compressed from the client before processing
    it in the MSMQ. This is shown in the following diagram:


    ![](img/8188651cea6a881a16242b395a81399a_41_1.png)


    Then, the server will receive the message from MSMQ, but before processing it,
    this will decompress and validate the message. It will restore the message that
    the client mutated. This is shown in the following diagram:


    ![](img/8188651cea6a881a16242b395a81399a_41_2.png)


    This is just a simple compression and data annotation validation to ensure that
    MSMQ will process the message. One of the reasons for mutating the message may
    be the encryption of a credit card within a payment message.'
