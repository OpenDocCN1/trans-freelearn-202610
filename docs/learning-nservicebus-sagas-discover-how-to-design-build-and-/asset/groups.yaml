  - '[PAGE 129]


    For simplicity, the MVC controller is just reading XML files (that were created
    in a folder in C:\temp\ ) to be displayed in the frontend and selected to be sent
    to the Payment WCF service. Using XML files in this method is not recommended
    for production, as normally these files would be filled in by a frontend payment
    interface to the customer for the customer information. We chose this method to
    solidify the interfaces and test them. And designing customer interfaces to populate
    the messages was not part of this effort. Using XML files in this type of testing
    can be advantageous, as we could extend this example to send hundreds of messages,
    both in order to check performance as well as to populate individual messages
    through a customer interface without relying on the frontend.


    What we basically have is a very common design, where we have an MVC frontend
    calling a WCF client to interact with a WCF server. This design is also common
    to see at some ordering sites. For instance, at, let''s say a pizza site, is a
    pop-up saying **order being sent, do not refresh**. Because there is no decoupling
    to the backend workflow in this example as well, if this were to become a solution
    without decoupling through NSB, we may likely have to add payment being sent,
    do not refresh. Many things can go wrong in the event of during the need for a
    page refresh, just because a customer may not be refreshing their page, it does
    not mean that something else isn''t doing a page refresh.


    Our current architecture is as follows:


    ![](img/8188651cea6a881a16242b395a81399a_129_0.png)'
  - '[PAGE 130]


    # Saga Development


    Let''s build some saga processing into the preceding solution to decouple the
    MVC frontend from the WCF client. NSB will act as a mediator for the interaction
    between these two components pieces.


    Why a saga? It routes messages, performs timeouts, and persists a state.


    The preceding screenshot represents the new workflow using the NServiceBus saga.
    It seems a bit overwhelming, but NServiceBus handles all the complexity behind
    the scenes. For the controller, it just fires and forgets. If it needs to know
    the state of the message, it just executes an EF query on the DB. But it still
    sends the message off, and allows NSB to handle it.


    # The source code


    The directory for the code is under the SagaPaymentClient directory.


    The MVCApp - WCF is used to send WCF messages as a client using a saga.


    The solution was built using Visual Studio 2012 in Windows Server 2012, and also
    tested with VS 2012 running in Windows 8.1, with MSMQ, DTC, RavenDB, NServiceBus
    Version 4.0 references, and SQL Server 2012 Express LocalDB installed.


    Here''s what the new project will look like with the saga:


    ![](img/8188651cea6a881a16242b395a81399a_130_0.png)


    The difference now is that the MVC application will interface with the saga, which
    is MySaga, and the saga will communicate with the WCF client and the MVC application.
    This will decouple the frontend from the WCF client, as well as have the MVC receive
    feedback of the status directly from the saga message.'
