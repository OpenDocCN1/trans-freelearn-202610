    ## Setting up an LCD display for the Raspberry Pi using the Yocto Project


    There exist a number of different LCD displays for the Raspberry Pi. Among the
    most popular are the official Raspberry Pi 7 touchscreen and the PiTFT displays
    (often called PiTFT Hats, since they are suitable to mount on top of the Raspberry
    Pi). For now, we will focus on the Raspberry Pi 7 touchscreen and the PiTFT models.


    In this section, we will go through how to boot a standard Yocto Project image,
    containing a window system and a working touchscreen.


    ### The Raspberry Pi 7 touchscreen


    Getting started with the Raspberry Pi 7 touchscreen using an image based on the
    Yocto Project requires quite a few configurations. First, we need to ensure we
    are using a 4.1+ kernel. Starting from the **jethro** release of meta-raspberrypi,
    4.1 is the default version. Currently, meta-raspberrypi lacks full support for
    the Raspberry Pi 7 touchscreen, so we need to perform some small modifications
    before booting our image.


    ### Note


    Build instructions for the Raspberry Pi 7 touchscreen can be found at https://www.adafruit.com/images/product-files/2718/2718build.jpg
    . The display will work with Raspberry Pi A/B boards; however, the mounting holes
    on the back of the display will only line up with A+, B+, and Raspberry Pi 2/3.


    If using the default meta-raspberrypi settings, we will have a supported kernel
    with all the required configuration options enabled by default. To be extra safe,
    you can go through the previous part of this chapter to ensure that the kernel
    is correctly configured for your display. With this in mind, we can start by creating
    a new project:


    ```

    $ source /path/to/poky/oe-init-build-env my_project

    ```


    Next, we can continue with the normal procedure and add external layers required
    for building Raspberry Pi images with Yocto:


    ```

    $ cat local/bblayers.conf

    # LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf

    # changes incompatibly

    LCONF_VERSION = "6"

    BBPATH = "${TOPDIR}"

    BBFILES ?= ""

    BBLAYERS ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    /path/to/poky/meta-yocto-bsp \

    /path/to/meta-raspberrypi \

    /path/to/meta-openembedded/meta-oe \

    /path/to/meta-openembedded/meta-multimedia \

    "

    BBLAYERS_NON_REMOVABLE ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    "

    ```


    ### Note


    If you haven''t cloned the openembedded layers for the earlier examples in the
    book, it can be done with this command: $ git clone git://git.openembedded.org/meta-openembedded


    We also need to make some modifications to local.conf:


    ```

    $ echo "MACHINE = \"raspberrypi\"" >> conf/local.conf (Or MACHINE=raspberrypi2)

    $ echo "LICENSE_FLAGS_WHITELIST = \"commercial\"" >> conf/local.conf

    ```


    After this, we are ready to start a new build. By default, meta-raspberrypi will
    ensure that, for example, input devices for the touchscreen, together with appropriate
    udev rules, are set up for the touchscreen. These settings will be applied seamlessly
    during the build:


    ```

    $ bitbake core-image-sato

    ```


    Once the SD card has been prepared with the new image, we also need to ensure
    that all required drivers are loaded for the touchscreen. This can be done by
    adding this line to the end of config.txt, which is located in the boot partition
    of the SD card:


    ```

    $ echo "dtoverlay=rpi-ft5406" >> /path/to/sdcard/boot/config.txt

    ```


    Now, you''re ready to rock and will be able to boot a window system with touch
    support using your Raspberry Pi 7 touchscreen.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_196_0.png)


    *A Raspberry Pi 7 touchscreen running core-image-sato*


    ### The PiTFT 2.8 resistive touchscreen


    Native support for PiTFT displays in meta-raspberrypi is fairly new. Check whether
    your PiTFT model is supported by looking at the readme file for meta-raspberrypi,
    under the Enable PiTFT support section.


    PiTFT support is configurable for any existing (or customized) Raspberry Pi image
    using the Yocto Project. The support has been added as `MACHINE_FEATURES` in meta-raspberrypi.
    The `MACHINE_FEATURES` variable is a standard Yocto Project feature, which can
    be used to add hardware features for the target you are building for. There exists
    a set of predefined `MACHINE_FEATURES` features in the Yocto Project, which includes
    Wi-Fi, keyboard, Alsa, and Bluetooth, among others. In the Raspberry Pi BSP layer,
    a couple of these are enabled by default:


    ```

    $ grep "MACHINE_FEATURES " conf/machine/include/rpi-base.inc

    MACHINE_FEATURES += "kernel26 apm usbhost keyboard vfat ext2 screen touchscreen

    alsa bluetooth wifi sdio"

    ```


    PiTFT support will require two new `MACHINE_FEATURES` features: a generic one
    called `pitft` and a model-specific version. In this example, we will be using
    `pitft28r`, which corresponds to the PiTFT 2.8 resistive touchscreen. The simplest
    way to add the new `MACHINE_FEATURES` features is by adding them to the local
    configuration file within your project:


    ```

    $ cd /path/to/my/rpi/project

    $ echo "MACHINE_FEATURES += "pitft pitft28r"" >> conf/local.conf

    ```


    This will add support for either running a console-based image or a window-system
    image. The pitft feature will, under the hood, ensure that SPI and i2c are enabled.
    It will also configure the framebuffer for handling the PiTFT display (change
    from /dev/fb0 to /dev/fb1). The model-specific machine feature (pitft28r in this
    example) will add the model-specific device tree overlay to config.txt, set up
    proper configurations for the screen (such as orientation and speed), and ensure
    that the stmpe module needed for the touch functionality is loaded. It will also
    add some default calibration data for the touchscreen. When the `MACHINE_FEATURES`
    features are set up, we can build our image, load it on the SD card, and boot:


    ```

    $ bitbake core-image-sato

    ```


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_197_0.png)


    *The PiTFT 2.8 resistive touchscreen running core-image-sato*


    When you boot your Raspberry Pi, the LCD will turn white at first. After a short
    while, it should turn black again-this means that the kernel has recognized the
    screen. Shortly after, you should be up and running with a window system. The
    "2.8" screen is quite small, but it''s possible to use the virtual keyboard in
    order to write, for example, simple commands in the terminal. The touchscreen
    has been calibrated for you using default values, suitable for your screen and
    rotation. If you find the default calibration insufficient, for example, if you
    wish to change the display orientation (90 degrees by default), you can recalibrate
    it using, for example, ts_calibrate.


    ### Note


    ```

    ts_calibrate is part of the tslib recipe in Poky. It''s included by default when
    building core-image-sato, and it can easily be added to a custom image by specifying
    MACHINE_FEATURES += "touchscreen"

    ```


    ### Developing applications and using them on an LCD display


    At this point, we have an image based on the Yocto Project with PiTFT display
    support up and running on our Raspberry Pi. In this section, we will develop a
    graphical application that we can use with our fancy touchscreen. When developing
    graphical applications, a couple of different frameworks exist. Qt is one of the
    most famous graphical frameworks for embedded devices and exists in a free software
    version. In this section, we will go through how to set up and develop a graphical
    application for embedded Linux environments using Qt and EGLFS. Qt is a cross-platform
    application framework, so besides being able to run on various types of hardware,
    it can also be used in many different software platforms (such as X11, OS X, Windows,
    and EGLFS). EGLFS, which we will be using in our example, is basically a platform
    plugin used for running Qt applications on top of EGL and OpenGL ES. In fact,
    it will not even require a window system (such as X11) to work, which makes it
    highly suitable for embedded Linux.


    ### Developing a custom application using Qt


    When developing an application based on Qt using the Yocto Project, we need to
    set up Qt in our layer. Two standard methods exist for developing a graphical
    application: either build your application against an exported SDK, or create
    a new recipe for your application. In this example, we will develop our application
    against an exported SDK. To succeed with getting our new application to build
    and run on the target, we need to perform these steps.


    - Add the external layers required for Qt

    - Export the SDK containing Qt support

    - Create the Qt application and build it against the exported SDK

    - Set up an image with Qt support for the target

    - Run Qt applications on the official Raspberry Pi 7" touchscreen


    There exist a number of different Qt versions, where Qt5 is the latest. We will
    use the meta-qt5 external layer when developing our new application. First, we
    need to download meta-qt5 and enable the usage of it in our project:


    ```

    $ git clone https://github.com/meta-qt5/meta-qt5.git

    ```


    Add meta-qt5 to local/bblayers.conf:


    ```

    $ cat local/bblayers.conf

    # LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf

    # changes incompatibly

    LCONF_VERSION = "6"


    BBPATH = "${TOPDIR}"

    BBFILES ?= ""


    BBLAYERS ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    /path/to/poky/meta-yocto-bsp \

    /path/to/meta-raspberrypi \

    /path/to/meta-openembedded/meta-multimedia \

    /path/to/meta-qt5 \

    "

    BBLAYERS_NON_REMOVABLE ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    "

    ```


    Next, we need to export the SDK and unpack it to a preferred location:


    ```

    $ bitbake meta-toolchain-qt5

    $ .tmp/deploy/sdk/poky-glibc-x86_64-meta-toolchain-qt5-cortexa7hf-vfp-vfpv4-neon-toolchain-2.0.1.sh

    ```


    The path might be different, depending on which model of the Raspberry Pi and
    which release of the Yocto Project you are using.


    ### Note

