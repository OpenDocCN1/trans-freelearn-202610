    \ the defconfig file. In order to change kernel configuration options for meta-raspberrypi,\
    \ a couple of possibilities exist. The first option is to create an integration\
    \ patch for the kernel that modifies the the chosen defconfig file within the\
    \ kernel tree and is then applied through the kernel recipe, like this:\n\n```\n\
    ```\ndiff --git a/recipes-kernel/linux/linux-raspberrypi_4.1.bb b/recipes-kernel/linux/linux-raspberrypi_4.1.bb\n\
