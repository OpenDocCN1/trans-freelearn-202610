    webserver-packt \\

    "

    ```


    Finally, we need to ensure that our new package list is used; for this example,
    it will be done by replacing the content in IMAGE_INSTALL with the package group
    recipe, like this:


    ```

    # Base this image on rpi-basic-image

    include recipes-core/images/rpi-basic-image.bb

    SPLASH = "psplash-raspberrypi"

    IMAGE_FEATURES += "ssh-server-dropbear splash"

    IMAGE_INSTALL_append = " packagegroup-packt-iot"

    ```


    ### Note


    The Yocto Project documentation contains the following information about IMAGE_INSTALL:
    "Using IMAGE_INSTALL with the += operator from the /conf/local.conf file or from
    within an image recipe is not recommended as it can cause ordering issues. Since
    core-image.bbclass sets IMAGE_INSTALL to a default value using the ?= operator,
    using a += operation against IMAGE_INSTALL will result in unexpected behavior
    when used in conf/local.conf. Furthermore, the same operation from within an image
    recipe may or may not succeed depending on the specific situation. In both these
    cases, the behavior is contrary to how most users expect the += operator to work."
    For more details, visit http://www.yoctoproject.org/docs/current/ref-manual/ref-manual.html#var-IMAGE_INSTALL.


    ## Putting it all together


    At this point, we have a basic idea about how to build our project, and we also
    have all the software required for our project. In this section, we will go through
    a number of iterations until we reach the final goal of using a remote device
    to control the lamp.


    We will do this in three steps:


    - 1. Control the relay using the Raspberry Pi.

    - 2. Control the lamp using the Raspberry Pi.

    - 3. Turn on/off the lamp from a smartphone.


    During development, it''s inefficient to always boot the Raspberry Pi using, for
    example, an HDMI connection to a TV that also requires a separate mouse and keyboard
    to control the Pi. Using HDMI, we will not be able to track the early boot procedure
    either. For this project, we also want to be able to troubleshoot the Raspberry
    Pi without the need to place it close to a TV. For our project, we will either
    use SSH or a serial connection to reduce turnaround time during development.


    ## Serial and SSH connections to the Raspberry Pi


    The first method is to use a serial connection to the Raspberry Pi. The easiest
    way to achieve this is to use a USB-to-serial cable. Connect the USB to your host
    machine. Then, connect the four wire cables to the correct GPIO pins on the Raspberry
    Pi, as shown in the following figure:


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_242_0.png)


    A USB-to-serial cable connected to the Raspberry Pi GPIO header


    The following table will give a more detailed explanation of how the GPIO wires
    should be connected. Also check the GPIO header diagram in Chapter 8, Diving into
    the Raspberry Pis Peripherals and Yocto Recipes, to review the purpose of all
    the pins in the GPIO header.


    | Wire | GPIO/Pin |

    |---|---|

    | Red | 5V |

    | Black | GND |

    | White | GPIO 14 (TXD) |

    | Green | GPIO 15 (RXD) |


    Once the physical connection has been set up, we can continue with preparing our
    host environment. In this example, we will use the screen package to set up our
    console connection.


    To set up screen on Ubuntu, use this command:


    ```

    $ sudo apt-get install screen

    ```


    Use this one to set it up on Fedora:


    ```

    $ sudo yum install screen

    ```


    Next, we must ensure that we have plugged in the USB cable to our Raspberry Pi
    (remember that no additional power supply is needed). After that, we can open
    a terminal window and type the following command, which will connect us to the
    Raspberry Pi console:


    ```

    $ sudo screen /dev/ttyUSB0 115200


    <snip>

    [   2.017380] [vc_sm_connected_init]: end - returning 0

    [   2.023899] uart-pl011 3f201000.uart: no DMA platform data

    [   2.034527] EXT4-fs (mmcblk0p2): INFO: recovery required on readonly filesystem

    [   2.041844] EXT4-fs (mmcblk0p2): write access will be enabled during recovery

    [   2.093584] EXT4-fs (mmcblk0p2): recovery complete

    [   2.103945] EXT4-fs (mmcblk0p2): mounted filesystem with ordered data mode.

    Opts: (null)

    [   2.112154] VFS: Mounted root (ext4 filesystem) readonly on device 179:2.

    [   2.122995] devtmpfs: mounted

    .

    .

    .

    Starting syslogd/klogd: done

    Poky (Yocto Project Reference Distro) 2.0+snapshot-20160229 raspberrypi2

    /dev/ttyAMA0

    raspberrypi2 login: [   17.906610] random: nonblocking pool is initialized

    Poky (Yocto Project Reference Distro) 2.0+snapshot-20160229 raspberrypi2

    /dev/ttyAMA0

