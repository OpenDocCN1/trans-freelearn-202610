  - '[PAGE 117]


    # Introducing layers


    A layer is just a collection of recipes and/or configuration that can be used
    on top of Yocto/OE-Core.


    The advantage of using an environment such as Yocto/OE (the Poky reference system)
    comes from the fact that this project handles a lot of metadata (definition files
    (.conf) of the machine (Raspberry Pi), classes, and recipes (.bb)) that covers
    everything from simple applications (gpio-packt) to graphics applications such
    as OpenGLES, EFL, or Qt.


    The main motivation of using layers is to organize the long list of providers
    better and still make sure users may be able to pick only the required or desired
    provider. It is also a way of providing customizable source code that can be used
    for any architecture or modified in the way the user needs.


    The other advantage is that we can choose all the layers required for each project
    (from the most basic to the most complex). We can modify them to be consistent
    with our architecture (ARM for the Raspberry Pi), but a layer can be reused on
    another architecture (PowerPC), and is it a big advantage in the industrial world
    (minimal effort is required when changing the architecture).


    In addition, instead of redeveloping layers, always check whether the work has
    been done by others. It takes less time to download a layer providing a package
    we need and to add an append file (.bbappend); if some modifications are required,
    then you have to make them from scratch. To summarize, layers are added when needed.


    You can find the different available layers at the following link:


    http://layers.openembedded.org/layerindex/branch/master/layers/'
  - '[PAGE 118]


    # The basic concepts of layers


    Let''s dive into the basic concepts of layers:'
  - '[PAGE 119]


    # # Theory


    A layer, in the technical sense of the term, has some properties. They are as
    follows:


    +   - **Name**: This usually starts with the string meta- (mandatory for better
    comprehension).

    +   - **Priority**: This is the value used by BitBake to decide which recipe to
    use and the order in which the .bbappend files should be joined. It means that
    if two layers include the same recipe ( .bb) file, the one with the higher priority
    is used.


    # ## Note


    For example, a layer with a priority value set to 6 has a higher chance of its
    recipe being used than one with a priority value set to 5.


    Furthermore, each layer is listed according to its functionality on this page:


    http://layers.openembedded.org/layerindex/branch/master/layers/


    | meta-parallelia | Support for the Parallelia board from Adapteva | Machine (BSP)
    | https://github.com/nathanrossi/meta-parallelia.git |

    | --- | --- | --- | --- |

    | meta-picosam9 | Picosam9 board support | Machine (BSP) | https://gitgoriuos.org/picopc-tools/meta-picosam9.git
    |

    | meta-qemu-bsps | layer for other qemu machines | Machine (BSP) | https://github.com/akuster/meta-qemu-bsps
    |

    | meta-raspberrypi | Raspberry Pi board support | Machine (BSP) | git://git.yoctoproject.org/meta-raspberrypi
    |

    | meta-renesas-rza1 | Official BSP layer for Renesas RZ/A1 platforms | Machine
    (BSP) | git://github.com/renesas-rz/meta-renesas-rza1 |

    | meta-rockchip | Rockchip ARM hardware support | Machine (BSP) | git://github.com/linux-rockchip/meta-rockchip
    |

    | meta-romley | Intel Romley platform BSP | Machine (BSP) | git://git.yoctoproject.org/meta-intel
    |

    | meta-samsung | Samsung smartphone support | Machine (BSP) | git://github.com/shr-distribution/meta-smartphone.git
    |

    | meta-sugarbay | Intel Sugar Bay platform BSP | Machine (BSP) | git://git.yoctoproject.org/meta-intel
    |


    +   - **The software layer**: This layer provides software families that can be
    used on any architecture (x86_64, ARM, PPC, MIPS, and so on). For example, we
    have meta-java (for Java support), meta-efl (for the Enlightenment environment),
    meta-qt5 (Qt support), meta-webserver (provides support for building web servers),
    meta-browser, and so on.

    +   - **Miscellaneous**: If your layer doesn''t fall into any other category,
    you can choose this type; however, there shouldn''t be too many miscellaneous
    layers-it may be an indication that the purpose isn''t well defined or that you
    should consider splitting the layer.

    +   - **Machine (BSP)**: These are layers specific to a machine (such as meta-raspberrypi,
    meta-fsl-arm, and meta-ti). They contain machine configuration files and recipes
    to configure packages for the machines.

    +   - **Distribution**: These are layers adding a distribution to the environment
    (such as meta-ivito add in-vehicle infotainment (IVI) support, meta-angstrom,
    and so on).


    At this stage, we know how the layers are distributed within the Yocto Project.
    Now, we will see how'
  - '[PAGE 120]


    these layers are composed.'
  - '[PAGE 121]


    # The software layer


    For this example, we will take as an example the meta-qt5 layer. This layer has
    a directory tree, as follows:


    ```

    pjtexier@amplitude:~ $ ls -l meta-qt5/

    total 28

    drwxrwxr-x 2 pjtexier pjtexier 4096 avril 22 19:20 classes

    drwxrwxr-x 3 pjtexier pjtexier 4096 avril 22 19:20 conf

    -rw-rw-r-- 1 pjtexier pjtexier 1035 avril 22 19:20 COPYING.MIT

    drwxrwxr-x 2 pjtexier pjtexier 4096 avril 22 19:20 licenses

    -rw-rw-r-- 1 pjtexier pjtexier 1189 avril 22 19:20 README

    -rwxrwxr-x 4 pjtexier pjtexier 4096 avril 22 19:20 recipes-devtools

    drwxrwxr-x 10 pjtexier pjtexier 4096 avril 22 19:20 recipes-qt

    ```


    # README and COPYING


    Inside this directory, there are two important files; they are as follows:


    +   - **README**: This file specifies mostly the outer layers that depend on the
    target layer, any configuration instructions, the address to send patches to,
    and contact details of the maintainers.

    +     o This layer depends on the following:


    ```

    URI: git://github.com/openembedded/oe-core.git

    branch: master

    revision: HEAD

    ```


    ```

    URI: git://github.com/openembedded/meta-oe.git

    layers: meta-ruby

    branch: master

    revision: HEAD

    ```


    When building stuff like qtdeclarative, qtquick, qtwebkit, make sure thatyou have
    required PACKAGECONFIG options enabled in qtbase build, see qtbase.inc for detail.Send
    pull requests to openembedded-devel@lists.openembedded.org with ''[meta-qt5]''
    in the subject''


    When sending single patches, please using something like:

    ''git send-email -M -1 --to openembedded- devel@lists.openembedded.org --subject-prefix=meta-qt5][PATCH''You
    are encouraged to fork the mirror on github[1] to share your patches. This is
    preferred for patch sets consisting of more than one patch. Other services like
    gitorious, repo.or.cz or self hosted setups are of course accepted as well, ''git
    fetch <remote>'' works the same on all of them. We recommend github because it
    is free, easy to use, has been proven to be reliable and has a really good web
    GUI.1. https://github.com/meta-qt5/meta-qt5/


    Main layer maintainers:

    Martin ''JaMa'' Jansa <martin.jansa@gmail.com>

    Otavio Salvador <otavio@ossystems.com.br>


    +   - **COPYING**: This file contains licensing information (MIT license in this
    case).


    # The classes folder


    The classes folder holds .bbclass files. Here is a sample classes folder:'
