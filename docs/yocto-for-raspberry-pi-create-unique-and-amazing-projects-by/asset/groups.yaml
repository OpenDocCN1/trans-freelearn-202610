    ## Summary


    In this chapter, we learned the steps required to set up Poky and get our first
    image built. We ran that image on the Raspberry Pi, which gave us a good overview
    of the available capabilities.


    In the next chapter, you will be introduced to Hob, which provides a human-friendly
    interface for BitBake. We will use it to build an image and customize it further.
    After that, you will be introduced to another tool, Toaster, which is a web interface
    for BitBake.


    ## Chapter 3. Mastering Baking with Hob and Toaster


    In this chapter, we will explore two powerful tools included in the Yocto Project.
    In the first part of the chapter, we will speak about Hob, which is a graphical
    interface for BitBake. In the second part, we will work with Toaster, a web interface
    that enables you to follow the advanced parts of the build with a simple browser
    (such as Firefox).


    ### Hob


    In order to explore Hob, we will, through this section, sweep through the different
    essential steps for its proper functioning.


    ### Preparing the environment for Hob


    As in Chapter 2, Building our First Poky Image for the Raspberry Pi, the first
    step is to initialize the environment. Recall this command:


    ```

    $ source oe-init-build-env rpi-build

    ```


    Once the command is launched, the terminal will be redirected to the rpi-build
    directory.


    ### Running Hob


    Now that we have initialized all the variables required to build, we can start
    the Hob interface with this command:


    ```

    $ hob

    ```


    Once you run this command, Hob will try to parse the configuration files (local.conf
    and bblayers.conf) in order to find the metadata available to create the image.
    After this step, you will see the interface launch screen, as shown here:


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_62_0.png)


    Now, we can choose the desired machine from the list offered by Hob. Select the
    **raspberrypi** machine.


    > **Note**

    > The machine option you choose corresponds to the `MACHINE` variable in the `local.conf`
    file.


    You will see the following progress screen:


    ### Select a machine


    Your selection is the profile of the target machine for which you are building
    the image.


    raspberrypi


    Layers Add support for machines, software, etc.


    Populating recipes Stop


    Adding a layer is very simple. We just have to click on the Layers button, as
    shown in this screenshot:


    ### Image configuration


    #### Select a machine


    Your selection is the profile of the target machine for which you are building
    the image.


    raspberrypi


    Layers Add support for machines, software, etc.


    #### Select an image recipe


