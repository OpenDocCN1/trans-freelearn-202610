    ```


    Add the meta-raspberrypi and meta-oe external layers, together with our new meta-pact-iot
    layer, to bblayers.conf:


    ```

    BBLAYERS ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-poky \

    /path/to/poky/meta-yocto-bsp \

    /path/to/meta-raspberrypi \

    /path/to/meta-openembedded/meta-oe \

    /path/to/meta-pact-iot \

    "

    ```


    Decide which machine to use and add it to local.conf. In this example, we will
    use raspberrypi2:


    ```

    $ echo "MACHINE = "raspberrypi2"" >> conf/local.conf

    ```


    We will next enable a local package revision (PR) server in our project. The PR
    server will automatically bump the PR of a package if a change is detected. This
    will be done without a need for the end user, to manually update the PR number
    in the recipe file. This feature is very handy during, for example, the development
    of new recipes:


    ```

    $ echo "PRSERV_HOST = "localhost:0"" >> conf/local.conf

    ```


    A project in BitBake can consume a lot of disk space. There exist a number of
    methods that can be used to reduce both the amount of disk space used by a project
    and its overall build time.


    The first method is to use rm_work. This feature will make sure that BitBake performs
    a full cleanup of packages that have been built. By default, all built packages
    will have source and artifacts saved in package-specific locations, under ./tmp/work
    in the project. These will be wiped when the following class is inherited for
    the project:


    ```

    $ echo "INHERIT += "rm_work"" >> conf/local.conf

    ```


    However, it might be good to exclude packages that are frequently used during
    development, especially if it takes a long time unpack them. To achieve this,
    RM_WORK_EXCLUDE can be used.


    The build time for a project is often quite long, especially the first time, since
    BitBake needs to fetch all source and build packages from scratch. But after the
    first build is done, you can use a number of methods to speed up subsequent builds.
    These methods can also be used in other Yocto projects with a similar'
  - '[PAGE 231]


    setup to decrease the build time and amount of disk space needed. The first method
    is to use a shared state (sstate). By default, the sstate cache is located within
    the project. But by using the SSTATE_DIR variable in local.conf, the shared state
    can be located outside of a project and be used by other projects as well. The
    same goes for the next method, which is specifying the download location for all
    packages fetched by BitBake during the build. It can also be configured from local.conf
    using the DL_DIR variable. In this example, we will not use a shared state or
    a download directory outside of our project. The reason for this is that it isn''t
    recommended when using a local PR server.


    At this point, your local.conf file should look something like this:


    ```

    $ tail conf/local.conf

    PACKAGECONFIG_append_pn-nativesdk-qemu = " sdl"

    #ASSUME_PROVIDED += "libsdl-native"

    # CONF_VERSION is increased each time build/conf/ changes incompatibly and is
    used to

    # track the version of this file when it was generated. This can safely be ignored
    if

    # this doesn''t mean anything to you.

    CONF_VERSION = "1"

    MACHINE = "raspberrypi2"

    PRSERV_HOST = "localhost:0"

    INHERIT += "rm_work"

    ```


