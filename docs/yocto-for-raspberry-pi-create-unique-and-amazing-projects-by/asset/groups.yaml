    ## 关于作者


    **皮埃尔-让·泰西埃** 自 2014 年起一直是 Amplitude Systèmes（一家销售镱飞秒激光器的先驱公司）的嵌入式 Linux 工程师，在那里他使用
    Yocto Project（meta-fsl-arm）维护一个名为 i.MX6 的定制 SoC，该 SoC 由法国公司 EUKREA 制造。


    他毕业于波尔多的 ESTEI 学校，在那里学习了 3 年，成为一名嵌入式 Linux 工程师。


    他是自由软件世界和嵌入式世界的大力支持者。他的知识包括 C/C++、Yocto、Linux、Bash 和内核开发，但他也乐于尝试新事物并测试新技术。


    *首先，我想感谢我耐心的妻子在我的写作期间给予的支持。我也要感谢我的父母和我的兄弟；没有他们，这本书可能就不会问世。我也要感谢多年来我所有的导师——例如 西里尔·萨戈内罗、西尔万·勒埃纳夫、皮埃尔·博尔德莱、文森特·普埃约、法布里斯·博内、让-克洛德·佩雷西诺托
    和 皮埃尔·奥布里。如果不向这些老师学习，我绝无可能做今天的工作。最后，我想感谢 Amplitude Systèmes 的首席执行官 埃里克·莫泰；Amplitude
    Systèmes 的电子团队负责人 卢卡·泰斯塔，感谢他的信任；以及 希特沙姆·乌德胡、亚历山大·加莫内、凯文·平托 和 纪尧姆·马希内，感谢他们在咖啡休息期间关于
    Raspberry Pi 的所有讨论。*


    **佩特尔·马贝克** 是一名专注于嵌入式 Linux 系统的高级软件开发人员。过去 8 年来，他一直专业从事嵌入式 Linux 工作。目前，佩特尔在 爱立信
    AB 担任 Scrum Master 和高级软件开发人员。此外，他的知识包括 C/C++、shell 脚本、Yocto Project（包括 BitBake
    和 OpenEmbedded）、Scrum 和 Git。


    2013 年，佩特尔创办了小型企业 Technux，他将其作为爱立信工作之外的副项目运营。该企业的一些关注领域是开源嵌入式 Linux 项目，例如 Yocto
    Project，以及涉及 Raspberry Pi 的不同项目。作为 Technux 工作的一部分，佩特尔担任 Yocto Project 的贡献者（包括
    Raspberry Pi BSP 层，即 meta-raspberrypi）。


    *我要特别感谢我亲爱的家人，让我能在其他所有职责之外，花出所需时间来完成这本书。*


    ## 关于评审者


    **伯特·扬兹** 自 1975 年在美国海军组装第一台微型计算机以来，一直与计算机系统打交道。从 20 世纪 80 年代初在 *nix 系统上开发设备驱动程序和低级接口开始，扬兹先生已编写复杂软件产品超过
    30 年。他的专业知识涵盖从低级操作系统内部机制和设备驱动程序的设计与实现，到嵌入式和手持设备以及政府和企业级系统的复杂应用。


    他于 1988 年以优异成绩获得 弗兰克林皮尔斯学院 的 BSCS 学位，在 丹尼尔韦伯斯特学院 担任兼职教授 11 年，负责其基于晚间的继续教育项目，白天开发嵌入式和企业级软件。他的教学课程包括从计算机基础介绍到编程语言（C/C++/Java）、网络理论与网络编程、数据库理论与架构设计、人工智能系统等课程。在此期间，扬兹先生还撰写了杂志文章和其他技术评论，并参与了最早的几种
    Linux 发行版之一（Yggdrasil，1994 年）。


    扬兹先生曾作为首席架构师设计完整的嵌入式和企业级软件系统架构，并带领团队从新产品的需求和设计阶段一直到完成和交付给客户。他有 x86、68xxx、PPC、ARM
    和 SPARC 处理器的经验，并继续编写内核线程和 kmods、开放固件设备树、针对新硬件和专有硬件的驱动程序、FPGA I/P 核心接口、应用程序、库和引导管理器代码。您可以直接通过电子邮件
    bhjanz@ccsneinc.com 或 burt.janz@gmail.com，或通过 LinkedIn 联系他。


    **戴夫（Jing）田** 是佛罗里达大学计算机与信息科学与工程（CISE）系的博士生和安全研究员。他是 SENSEI 中心和佛罗里达网络安全研究所的创始成员。他的研究涉及系统安全、嵌入式系统、可信计算和编译器。他对
    Linux 内核黑客、编译器黑客和机器学习感兴趣。他还在人工智能和机器学习方向花了一年时间，并在俄勒冈大学讲授 Python 和操作系统课程。在此之前，他在
    阿尔卡特-朗讯（原朗讯科技）研发部门的 Linux 控制平台（LCP）小组担任软件开发人员约 4 年。他拥有 中国的电子工程学士和硕士学位。您可以通过他的博客（http://davejingtian.org）和电子邮件（root@davejingtian.org）联系他。


    感谢作者们出色的工作，以及编辑们使本书臻美并给予我审阅这本优秀书籍的机会。


    **埃尔米·罗姆丹尼** 是一名嵌入式 HW/SW 工程师。他毕业于 突尼斯苏斯国家工程学校。他的主要工作是在 Tunisian Embedded Systems，该公司专门从事嵌入式系统的研究、开发、原型设计和安装。他专注于嵌入式电信领域，特别是开发住宅网关的嵌入式软件。他经常使用嵌入式平台（Raspberry
    Pi 和 Arduino）、Linux、shell、Yocto、Python、C#（.Net）、Android、数据库（MySQL）、Web 服务和 Proteus
    Isis（PCB 设计）。


    欢迎通过 helmiromdhany@gmail.com 与他联系。


    我想感谢我的家人给予的支持、鼓励和爱，尤其是我的母亲 Salha 和父亲 Mokhtar。


    **皮埃尔·菲略** 目前是 Open Wide Ingénierie 的首席技术官，这是一家专注于开源技术的软件服务公司。


    皮埃尔也是 EPITA（著名的法国计算机学校）GISTRE（实时和嵌入式系统计算机工程）专业的教师和经理。


    他还是四版《Linux Embarqué》的作者，这是由 Eyrolles 出版的关于构建嵌入式 Linux 系统的法国参考书。


