    A shared repository is normally stored on a server and the repository must be
    created as a bare Git repository. This is done by using the `--bare` flag when
    initializing the Git repository or while cloning. Since we worked with a non-shared
    repository in our earlier examples, we will convert it to a shared repository
    using `git clone --bare`, and we can then remove our old repository and continue
    working with clones of the bare repository instead.


    ```

    $ cd /path/to/my/workkdir

    $ git clone --bare /path/to/my_packt_project my_packt_project.git

    $ rm -rf /path/to/my_packt_project

    ```


    # Tip


    A bare repository is basically a repository that doesn''t contain a working directory.
    This will prevent developers from making changes to the repository. According
    to naming conventions, a bare Git repository should be named `name_of_my_repo.git`.


    We now have a bare repository that can be used by a collaboration of developers.
    Next, we continue with cloning a local copy of the bare repository, which we can
    use when developing our new features. By default, you will be in a branch called
    `master` when cloning a repository. It''s possible to do all our work in the master
    branch; since this is only a local clone, we will not destroy anything for other
    developers. But it''s strongly recommended to create a **working branch** and
    make all your changes in that branch instead. This way, the master branch is always
    in a stable and known state. When you are an advanced Git user, you might work
    on several features in parallel and also might want to integrate new features
    that other developers have worked on through the master branch. In other words,
    it''s a good habit to create separate branches for all your features.


    ```

    $ git clone /path/to/my_packt_project.git

    Cloning into ''my_packt_project''

    $ cd my_packt_project

    ```


    Next, we will create a new branch called `my_new_feature`, move it, and develop
    a tiny new feature for the project. It''s possible to use `git branch` to list
    all available local branches; if you add the `-a` flag when listing branches,
    all remote branches will be listed as well.


    # Tip


    A remote branch is a branch that exists in a shared repository that has been cloned
    from. The asterisk (*) helps the user locate the current branch.


    ```

    $ git branch

    * master

    $ git branch my_new_feature

    $ git checkout my_new_feature

    Switched to branch ''my_new_feature''

    ```'
