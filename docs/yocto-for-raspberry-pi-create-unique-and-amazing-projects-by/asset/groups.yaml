  - '[PAGE 128]


    # # Creating the meta-packt_rpi layer with the yocto-layer script


    To create our custom layer, we can use two different methods:


    +   - Manually: create the directory (meta-*) and create the layer configuration
    file (conf/layer.conf)

    +   - * Use the yocto-layer script provided by the Poky environment


    To gain flexibility and avoid mishandling, we’ll use the second option. To use
    it, we must initially source all variables to gain access through our shell in
    the yocto-layer script, as shown in the following command:


    ```

    $ source oe-init-build-env rpi-build

    ```


    Now that our environment is set up, we have access to the yocto-layer script,
    and so, we can begin the process of creating the layer.


    Note that this script (yocto-layer) creates the layer in the current directory
    by default. That is why we must place it at the root of our environment:


    ```

    $ cd /where/you/want/to/stored/your/layer

    ```


    We can now launch the script using the following command:


    ```

    $ yocto-layer create <layer_name> -o <dest_dir>

    ```


    # ## Note


    The **meta-string** is automatically prepended to the layer name.


    For our example, we will call our layer **meta-packt_rpi**. Here is the command:


    ```

    $ yocto-layer create packt_rpi

    Please enter the layer priority you''d like to use for the layer: [default: 6]

    Would you like to have an example recipe created? (y/n) [default: n] y

    Please enter the name you''d like to use for your example recipe: [default: example]

    example-packt

    Would you like to have an example bbappend file created? (y/n) [default: n] y

    Please enter the name you''d like to use for your bbappend file: [default: example]

    example-packt

    Please enter the version number you''d like to use for your bbappend file (this
    should match the recipe you''re appending to): [default: 0.1]

    New layer created in meta-packt_rpi.

    Don''t forget to add it to your BBLAYERS (for details see meta- packt_rpi\README).

    ```


    We have, through this script, generated our own layer, meta-packt_rpi, and inside
    this layer is a sample recipe, an example of bbappend file, and so on. An example
    of our generated layer is shown in the following command:


    ```

    $ tree meta-packt_rpi/

    ```'
