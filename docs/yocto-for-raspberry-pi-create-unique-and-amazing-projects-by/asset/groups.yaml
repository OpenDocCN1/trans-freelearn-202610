    \ {\n\tinstall -m 0755 -d ${D}${bindir}\n\tinstall -m 0755 ${S}/gpio_example ${D}${bindir}\n\
    }\n```\n\n### The recipe explained\n\nLet's look at the various parts of the preceding\
    \ recipe.\n\nDESCRIPTION contains the description of the application. This information\
    \ is used when the packet is generated so that the user can have this information\
    \ through the package manager.\n\nLICENSE contains the program license (GPLv2\
    \ in this example).\n\nThe LIC_FILES_CHKSUM variable contains checksums of the\
    \ license text in the recipe source code. Poky uses this to track changes in the\
    \ license text of the source code files.\n\nPR contains the revision of the recipe\
    \ used to build the package.\n\nSRC_URI determines what files and source code\
    \ are needed and where that source code should be obtained from (in this case,\
    \ from the gpio-packet folder).\n\nThe do_compile() method will generate our binary\
    \ that will be deployed on the Raspberry Pi.\n\nThe do_install() method will install\
    \ our binary in the tree in the same way as installed on Raspberry Pi (in this\
    \ case, the binary will be placed in /usr/bin).\n\nThe following table lists some\
    \ paths used by Bitbake:\n\n| base_bindir | /bin |\n| base_sbindir | /sbin |\n\
    | base_libdir | /lib |\n| datadir | /usr/share |\n| sysconfdir | /etc |\n| servicedir\
    \ | /srv |\n| bindir | /usr/bin |\n| sbindir | /usr/sbin |\n| libdir | /usr/lib\
    \ |\n| includedir | /usr/include |\n\nNow that we have our recipe, we can include\
    \ it in the image. To do this, we must put all files in the main tree. We will\
    \ create a folder within meta-raspberrypi/recipes-devtools, as shown here:\n"
  mdcn: "\n\n## 在目标设备上安装和更新软件包\n\n现在我们已经介绍了软件包格式，将了解如何将它们与树莓派集成。\n\n### RPM 软件包\n\n\
    使用 RPM 软件包，可以在将其复制到目标设备后，使用 RPM 或 SMART 实用工具在树莓派上安装软件包。\n\n### 手动安装\n\n要手动安装 RPM\
    \ 软件包，请使用以下命令之一：\n\n```\n$ rpm -ivh package_name.rpm\n$ smart install package_name.rpm\n\
    ```\n\n### 自动安装\n\n在开发和调试阶段，开发者无需处理许多 Linux 命令即可更新目标设备（树莓派）上的软件包（二进制文件），这可能很有价值。\n\
    \n第一步是在我们的仓库中创建软件包索引（以便使用软件包馈送）：\n\n```\n$ source oe-init-build-env rpi-build\n\
    $ bitbake package-index\n```\n\n之后，我们可以安装一个 Web 服务器（例如 lighttpd）：\n\n```\n$ sudo\
    \ apt-get install lighttpd\n```\n\n默认情况下，/etc/lighttpd/lighttpd.conf 配置文件中指定的文档根目录是\
    \ /var/www/：\n\n```\n$ tree /var/www/\n/var/www/\nhtml\namod.png\nformulaire.html\n\
    index.html\nlogo.png\nplay_48.png\nindex.lighttpd.html\n1 directory, 6 files\n\
    ```\n\n因此，我们只需要一个指向我们的软件包馈送的符号链接：\n\n```\n$ mkdir /var/www/rpi-deploy\n$ ln -s\
    \ rpi-build/tmp/deploy/rpm /var/www/rpi-deploy/rpm\n```\n\n此时，您需要重新启动 lighttpd\
    \ 服务器：\n\n```\n$ sudo /etc/init.d/lighttpd restart\n```\n\n在树莓派上，我们需要告知 smart\
    \ 我们想要使用的每个软件包数据库。例如，对于 rpi-deploy/rpm 中的 all 目录，我们需要执行此命令：\n\n```\n$ smart channel\
    \ --add all type=rpm-md baseurl=http://<server-ip>/rpi-deploy/rpm/all\n```\n\n\
    现在我们的环境已准备就绪，可以使用以下命令从树莓派的根文件系统中查询和更新软件包：\n\n```\n$ smart update\n$ smart query\
    \ <package_name>\n$ smart install <package_name>\n$ smart query -installed\n```\n\
    \n以下是从树莓派中删除软件包的示例（Monkey Web 服务器）：\n\n```\n$ smart remove monkey\nUpdating cache..\n\
    ########################################### [100%]\nComputing transaction...\n\
    Removing packages (1):\nmonkey-1.5.4-r0@armv6-vfp\n479.4kB will be freed. Confirm\
    \ changes? (Y/n): Y\nCommitting transaction...\nPreparing...\n###########################################\
    \ [ 0%]\nStopping Monkey HTTP Server: stopped /usr/bin/monkey (pid 1448)\nmonkey\n\
    Output from monkey:( 0%)\nwarning: /etc/monkey/sites/default saved as /etc/monkey/sites/default.rpmsave\n\
    warning: /etc/monkey/plugins/logger/logger.conf saved as\n/etc/monkey/plugins/logger/logger.conf.rpmsave\n\
    warning: /etc/monkey/plugins.load saved as /etc/monkey/plugins.load.rpmsave\n\
    1:Removing monkey\n########################################### [100%]\nRemoving\
    \ any system startup links for monkey ...\n/etc/rc0.d/K70monkey /etc/rc1.d/K70monkey\
    \ /etc/rc2.d/S70monkey /etc/rc3.d/S70monkey\n/etc/rc4.d/S70monkey /etc/rc5.d/S70monkey\
    \ /etc/rc6.d/K70monkey Saving cache...\n```\n\n### 注意\n\n有关 smart 实用工具的更多信息和用户手册，请访问\
    \ https://labix.org/smart/。\n\n### IPK 软件包\n\n使用 IPK 软件包，可以在将软件包复制到目标设备后，使用 OPKG\
    \ 实用工具在树莓派上安装软件包。\n\n### 手动安装\n\n要手动安装 IPK 软件包，请使用此命令：\n\n```\n$ opkg install\
    \ package_name.ipk\n```\n\n### 自动安装\n\n对于 IPK 软件包的管理，在我们的开发工作站上创建软件包仓库很容易。\n\n\
    第一步是将以下变量添加到 conf/local.conf：\n\n```\nFEED_DEPLOYDIR_BASE_URI = http://<server-ip>:9999/\
    \ http://<server-ip>:9999/\n```\n\n因此，我们的镜像将包含指向基于 busybox（httpd）且监听端口 9999 的\
    \ Web 服务器上我们软件包仓库的所有引用。\n\n第二步是在我们的仓库上创建软件包索引：\n\n```\n$ source oe-init-build-env\
    \ rpi-build\n$ bitbake package-index\n```\n\n除此之外，只需创建一个监听端口 9999 的 Web 服务器。基目录将是构建\
    \ IPK 软件包的目录。为了更方便地使用实用工具连接 busybox，请使用 [HTTP 守护进程](http://wiki.openwrt.org/doc/howto/http.httpd)。也可以使用\
    \ Apache、Nginx 或 lighttpd。我们可以使用以下命令启动 httpd 服务器：\n\n```\n$ cd rpi-build/tmp/deploy/ipk\n\
    $ busybox httpd -p 9999\n```\n\n要验证我们的软件包仓库服务器是否正常运行，只需在树莓派上输入 opkg update：\n\n\
    ```\n$ opkg update\nDownloading http://192.168.132.1:9999/....\n```\n\n### 注意\n\
    \n如需更多信息，请随时访问 [http://www.yoctoproject.org/docs/current/dev-manual/dev-manual.html#using-runtime-package-management](http://www.yoctoproject.org/docs/current/dev-manual/dev-manual.html#using-runtime-package-management)。\n\
    \n## 我们的应用程序 - 简介\n\n现在我们已经了解了如何为平台生成 SDK 以及如何将软件包集成到 Yocto 镜像中，将通过一个示例，使用树莓派的通用输入输出（GPIO）引脚开发一个应用程序，然后创建一个配方以将我们的应用程序集成到最终镜像中。\n\
    \n其思想是开发一个应用程序，通过 GPIO 引脚点亮一个 LED 并监控一个按钮。\n\n以下是使用 Fritzing (http://fritzing.org/home/)\
    \ 制作的原理图：\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_110_0.png)\n\n因此，我们可以从 Linux\
    \ 用户空间，通过树莓派的 GPIO 4（主连接器的引脚 7）点亮 LED 或监控按钮。\n\n我们可以测试以下 C 应用程序：\n\n```\nstatic\
    \ int parse_opts(int argc, char *argv[])\nint long_index = 0;\nint opt;\nstatic\
    \ struct option option[]\n{\"led\", required_argument, NULL, 'l'\n{\"help\", no_argument,\
    \ NULL, 'h'\n{\"button\", no_argument, NULL, 'b'\n{\"version\", no_argument, NULL,\
    \ 'v'\n{0, 0, 0, 0}\nwhile ((opt = getopt_long(argc, argv, \"lzbhv\", option,\
    \ &long_index)) >= 0)\nswitch(opt)\ncase 'h':\ndisplay_help(argv[0]);\nexit(EXIT_SUCCESS);\n\
    case 'v':\nfprintf(stderr, \"\\n%s - %s\\n\\n\", project, VERSION);\nexit(EXIT_SUCCESS);\n\
    case 'l':\nprintf(\"Led Mode\\n\");\nprintf(\"Set gpio%d to %d\\n\",GPIO_PIN,atoi(optarg));\n\
    // Set gpio4 to out mode\nset_out(GPIO_PIN,atoi(optarg));\nbreak;\ncase 'b':\n\
    printf(\"Button Mode\\n\");\n// Set gpio4 to in mode\nset_in(GPIO_PIN);\nwait_bp_state();\n\
    break;\ndefault:\nfprintf(stderr,\"[ERROR] %s: Bad option. -h for help\\n\", argv[0]);\n\
    exit(EXIT_FAILURE);\nreturn 0;\n```\n\n您可以从此书的代码包中下载它。\n\n我们可以尝试使用 SDK 编译我们的应用程序，并使用以下命令将其发送到树莓派：\n\
    \n```\n$ source /opt/poky/1.7.1/environment-setup-armv6-vfp poky-linux-gnueabi\n\
    $ ${CC} gpio_example.c -o gpio_example\n```\n\n### 我们的应用程序 - 创建配方\n\n既然我们的应用程序功能正常，我们可以创建配方。\n\
    \n第一步是创建文件；例如，我们可以选择 gpio-packet_0.1.bb。\n\n- gpio-packet 表示软件包的名称（PN 变量）。\n-\
    \ 0.1 表示配方的版本号（PV 变量）。\n- .bb 表示文件扩展名（Bitbake）。\n\n第二步是将源代码放置在本地仓库中，如下所示：\n\n\
    ```\n$ mkdir gpio-packet\n$ cp /home/packet/gpio-example.c files/\n$ ls gpio-packet\n\
    gpio-example.c\n```\n\n配方必须放在 gpio-packet 目录旁边，如下所示：\n\n```\n$ ls\ngpio-packet/\
    \ gpio-packet.bb\n```\n\n之后，我们可以按如下内容填写配方：\n\n```\nDESCRIPTION = \"gpio example\"\
    \nLICENSE=\"GPLv2\"\nLIC_FILES_CHKSUM = \"file://${COMMON_LICENSE_DIR}/GPL-2.0;md5=801f80980d171dd6425610833a22dbe6\"\
    \n\nPR = \"r0\"\n\nSRC_URI = \"file://gpio_example.c\"\n\ndo_compile() {\n\t${CC}\
    \ ${CFLAGS} ${LDFLAGS} ${WORKDIR}/gpio_example.c -o\n\tgpio_example\n}\n\ndo_install()\
    \ {\n\tinstall -m 0755 -d ${D}${bindir}\n\tinstall -m 0755 ${S}/gpio_example ${D}${bindir}\n\
    }\n```\n\n### 配方说明\n\n让我们来看看前面配方的各个部分。\n\nDESCRIPTION 包含应用程序的描述。生成软件包时会使用此信息，以便用户可以通过包管理器获取此信息。\n\
    \nLICENSE 包含程序许可证（本示例中为 GPLv2）。\n\nLIC_FILES_CHKSUM 变量包含配方源代码中许可证文本的校验和。Poky 使用它来跟踪源代码文件中许可证文本的更改。\n\
    \nPR 包含用于构建软件包的配方修订版。\n\nSRC_URI 确定所需的文件和源代码以及应从哪里获取这些源代码（在此例中，从 gpio-packet 文件夹获取）。\n\
    \ndo_compile() 方法将生成我们将部署到树莓派的二进制文件。\n\ndo_install() 方法将以与在树莓派上安装相同的方式在树中安装我们的二进制文件（在此例中，二进制文件将放置在\
    \ /usr/bin）。\n\n以下表格列出了 Bitbake 使用的一些路径：\n\n| base_bindir | /bin |\n| base_sbindir\
    \ | /sbin |\n| base_libdir | /lib |\n| datadir | /usr/share |\n| sysconfdir |\
    \ /etc |\n| servicedir | /srv |\n| bindir | /usr/bin |\n| sbindir | /usr/sbin\
    \ |\n| libdir | /usr/lib |\n| includedir | /usr/include |\n\n现在我们已有配方，可以将其包含在镜像中。为此，我们必须将所有文件放入主树。我们将在\
    \ meta-raspberrypi/recipes-devtools 中创建一个文件夹，如下所示：\n"
