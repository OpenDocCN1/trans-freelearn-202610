    \ If we look into this following file (meta-raspberrypi/conf/machine/include/rpi-default-providers.inc),\
    \ we can see some variables:\n\n```\n# RaspberryPi BSP default providers\nPREFERRED_PROVIDER_virtual/kernel\
    \ = \"linux-raspberrypi\"\nPREFERRED_PROVIDER_u-boot = \"u-boot-rpi\"\n```\n\n\
    In this case, we have selected the required U-Boot version and kernel for our\
    \ Raspberry Pi.\n\n## Dependencies\n\nIn order to satisfy dependencies, the recipes\
    \ must declare what they need to have available during the build process.\n\n\
    BitBake uses a special mechanism that allows us to list the build-time dependencies\
    \ and then checks whether all of the rules are satisfied before the build step.\
    \ For example, if you work with canutils (http://pengutronix.de/software/socket-can/download/canutils/),\
    \ you have to set this following variable:\n\n```\nDEPENDS = \"libsocketcan\"\n\
    ```\n\nIn this example, **CANUTILS** needs libsocketcan; therefore, BitBake will\
    \ start by building the libsocketcan package (and installing the headers into\
    \ rootfs) before building canutils and linking.\n\nWhen an application depends\
    \ on something to run, it is called a runtime dependency (these are packages necessary\
    \ on the target in order to guarantee proper functioning). In this case, we don't\
    \ need to set the DEPENDS variable but the RDEPENDS variable in a recipe in order\
    \ to inform BitBake.\n\n## Fetching\n\nThe mechanism used by BitBake to fetch\
    \ source code is internally called the **fetcher backend**. There are several\
    \ fetcher backends supported, which can be configured to align user requirements\
    \ and optimize source code fetching.\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_87_0.png)\n\
    \nBitBake supports several protocols for remote file downloads. The most commonly\
    \ used are http://, https://, and git://. When BitBake executes the do_fetch task\
    \ in a recipe, it checks the contents of SRC_URI. We will discover, through the\
    \ various fetchers, how to proceed based on our need.\n\n### The local file fetcher\n\
    \nThe local file fetcher submodule handles URLs that begin with `file://`. The\
    \ filename you specify within the URL can either be an absolute or relative path\
    \ to a file. For example, with a file called `my_source_file.c`, we must write\
    \ the `SRC_URI` attribute's content like this:\n\n```\nSRC_URI = \"file://my_source_file.c\"\
    \n```\n\n### The HTTP fetcher\n\nThe HTTP fetcher obtains files from web servers.\
    \ Internally, the fetcher uses the wget utility.\n\nIn this example, we will use\
    \ the bcm2835 library. With this submodule, we will retrieve the tar.gz file of\
    \ this library:\n\n```\nSRC_URI = \"http://www.open.com.au/mikem/bcm2835/bcm2835-${PV}.tar.gz\"\
    \n```\n\n### The Git fetcher\n\nOne of the most commonly used source control management\
    \ systems in use is Git. BitBake has solid support for it, and the Git backend\
    \ is used when the do_fetch task is run and finds a git:// URL at the SRC_URI\
    \ variable. Here is an example featuring a utility developed by Christophe Blaess.\
    \ It is a simple command-line tool to help with the use of Linux spidev devices.\n\
    \n```\nSRCREV = \"cc6a41fdcec60610703ba6db488c621c64952898\"\n```\n\nThis variable\
    \ contains the reference to the commit that the version control system will use\
    \ as a basis. In the case of Git, it is the commit hash.\n\n```\nSRC_URI = \"\
    git://github.com/cpb-/spi-tools.git;protocol=git\"\n```\n\n### Note\n\nWhen the\
    \ SRCREV variable points to a hash not available in the master branch, we need\
    \ to use the branch=<branch name> parameter, as follows: SRC_URI = \"git://myserver/myrepo.git;branch=mybranch\"\
    . In the cases when the hash used points to a tag that is not available in a branch,\
    \ we need to use the nobranch=1 option, as follows: SRC_URI = \"git://myserver/myrepo.git;nobranch=1\"\
    .\n\nFor further information about the SRC_URI parameter's values, go to http://www.yoctoproject.org/docs/1.6/bitbake-user-manual/bitbake-user-manual.html#var-SRC_URI\
    \ for some examples.\n\n## Understanding BitBake's tasks\n\nThe bitbake command\
    \ is the primary interface to the BitBake tool. This chapter presents the bitbake\
    \ command syntax and provides several execution examples.\n\nFor example, if you\
    \ want to build a specific recipe, run the following command:\n\n```\n$ bitbake\
    \ <recipe>\n```\n\nBitBake runs a set of scheduled tasks. When we wish to run\
    \ a specific task, we can use the following command:\n\n```\n$ bitbake <recipe>\
    \ -c <task>\n```\n\nIf you want to clean a specific package (spi-tools, for example),\
    \ you just have to run this:\n\n```\n$ bitbake spi-tools -c clean\n```\n\nTo list\
    \ the tasks defined for a recipe, we can use the following command:\n\n```\n$\
    \ bitbake <recipe> -c listtasks\n```\n\nHere is a description of BitBake tasks:\n\
    \n- **do_fetch**: The first step when building a recipe is fetching the required\
    \ source. This is done using the fetching backend feature we discussed previously.\
    \ It is important to point out that fetching source or a file does not mean it\
    \ is a remote source. In fact, every file required during the recipe build must\
    \ be fetched so that it is made available in the WORKDIR directory.\n\n    All\
    \ downloaded content is stored in the download folder (the DL_DIR variable), so\
    \ all external source code is cached to avoid redownloading it every time we need\
    \ the same source.\n\n- **do_unpack**: The natural subsequent task after the do_fetch\
    \ task is do_unpack. It is responsible for unpacking source code or checking the\
    \ requested revision or branch in case the referenced source uses an SCM system.\n\
    \n- **do_patch**: Once the source code has been properly unpacked, BitBake initiates\
    \ the process of adapting it. This is done by the do_patch task. Every file fetched\
    \ by do_fetch that has the .patch extension is assumed to be a patch to be applied.\
    \ This task applies the list of required patches.\n\n    The process of applying\
    \ a patch uses the S variable, which points to the source code. The default value\
    \ used for S is ${WORKDIR}/${PN}-${PV}, and it is used for the do_patch, do_configure,\
    \ do_compile, and do_install tasks.\n\n- **do_configure, do_compile, and do_install**:\
    \ The do_configure, do_compile, and do_install tasks are performed in this order.\
    \ Some recipes may omit one task or another. It is important to note that the\
    \ environment variables defined in the tasks are different from one task to another.\n\
    \nTasks vary a lot from one recipe to another. Poky provides a rich collection\
    \ of predefined tasks in the classes, which ought to be used when possible. For\
    \ example, when the Autotools class is inherited by a recipe, it provides a known\
    \ implementation for the do_configure, do_compile, and do_install tasks.\n\n-\
    \ do_package: The do_package task splits the files installed by the recipe into\
    \ logical components, such as debugging symbols, documentation, and libraries.\
    \ The do_package task ensures that files are split up and packaged correctly.\n\
    \nOne of the most common uses of Poky is the generation of the root filesystem.\
    \ The rootfs image should be seen as a ready-to-use root filesystem for a target.\
    \ The rootfs is basically a directory with the desired packages installed. The\
    \ list of packages to be installed into rootfs is defined by a union of packages\
    \ listed by IMAGE_INSTALL and the packages included by IMAGE_FEATURES.\n\n###\
    \ Note\n\nAfter do_rootfs has finished, the generated image file is placed in\
    \ <build-dir>/tmp/deploy/image/raspberrypi/.\n\nWe will learn more about the process\
    \ and its contents in Chapter 5, Creating, Developing, and Deploying on the Raspberry\
    \ Pi.\n"
