    # # Preface


    This book will cover everything from creating your customized image for the Raspberry
    Pi to implementing a small home automation project using the Yocto Project and
    the Raspberry Pi as the base.


    The book will start by introducing you to the Yocto Project and presenting the
    Raspberry Pi platform. With this information in place, you will learn how to integrate
    the Yocto Project with the Raspberry Pi. Throughout the book, you will learn everything
    from how to develop a custom application to using a Wii nunchuck and configuring
    an LCD touchscreen for the Raspberry Pi using the Yocto Project. The book will
    end with a practical chapter, which will summarize all that you learned throughout
    the book by creating a home automation project.'
