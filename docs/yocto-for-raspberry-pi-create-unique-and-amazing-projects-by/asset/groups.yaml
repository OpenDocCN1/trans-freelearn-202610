    \ meta-raspberrypi Git 仓库设置姓名和电子邮件：\n\n```\n$ cd meta-raspberrypi\n$ git config\
    \ user.email \"your_email@packtpub.com\"\n$ git config user.name \"Forename Surname\"\
    \n```\n\n接下来，您应设置 git send-email 以便通过 SMTP 服务器使用 Git 发送补丁。维护者通常要求这样做，以确保补丁格式正确且易于集成。您需要手动配置服务器参数\
    \ - 请参阅电子邮件提供商的文档或联系支持以找到正确参数。\n\n除了 Git，您还需要安装 send-email，这是 Git 在后台用于 git send-email\
