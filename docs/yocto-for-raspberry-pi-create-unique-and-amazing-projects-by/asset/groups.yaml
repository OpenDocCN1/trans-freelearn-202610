  - '[PAGE 113]


    # # The recipe explained


    Let''s look at the various parts of the preceding recipe.


    DESCRIPTION contains the description of the application. This information is used
    when the packet is generated so that the user can have this information through
    the package manager.


    LICENSE contains the program license (GPLv2 in this example).


    The LIC_FILES_CHKSUM variable contains checksums of the license text in the recipe
    source code. Poky uses this to track changes in the license text of the source
    code files.


    PR contains the revision of the recipe used to build the package.


    SRC_URI determines what files and source code are needed and where that source
    code should be obtained from (in this case, from the gpio-pckt folder).


    The do_compile() method will generate our binary that will be deployed on the
    Raspberry Pi.


    The do_install() method will install our binary in the tree in the same way as
    installed on Raspberry Pi (in this case, the binary will be placed in /usr/bin).


    The following table lists some paths used by Bitbake:


    | base_bindir | /bin |

    | base_sbindir | /sbin |

    | base_libdir | /lib |

    | datadir | /usr/share |

    | sysconfdir | /etc |

    | servicedir | /srv |

    | bindir | /usr/bin |

    | sbindir | /usr/sbin |

    | libdir | /usr/lib |

    | includedir | /usr/include |


    Now that we have our recipe, we can include it in the image. To do this, we must
    put all files in the main tree. We will create a folder within meta-raspberrypi/recipes-devtools,
    as shown here:'
