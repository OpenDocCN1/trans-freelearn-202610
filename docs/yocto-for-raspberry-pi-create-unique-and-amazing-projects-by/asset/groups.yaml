    # Testing on the Raspberry Pi


    With our image in hand, we can now run the utilities offered by spi-tools.


    # spi-config


    To access SPI interfaces from user space, the kernel provides us entry points
    as special files in /dev. This requires the loading of the following module:


    ```

    $ modprobe spidev

    ```


    After integrating this module, we can try to launch the spi-config utility:


    ```

    $ spi-config

    spi-config: no device specified (use option -h for help)

    $ spi-config -h

    usage: ./spi-config options...

    options:

    -d --device= use the given spi-dev character device.

    -q --query print the current configuration.

    -m --mode=[0-3] use the selected spi mode.

    0: low iddle level, sample on leading edge

    1: low iddle level, sample on trailing edge

    2: high iddle level, sample on leading edge

    3: high iddle level, sample on trailing edge

    -l --lsb={0,1} LSB first (1) or MSB first (0)

    -b --bits=[7...] bits per word

    -s --speed= set the speed in Hz

    -h --help this screen

    -v --version display the version number

    ```


    For example, if we wanted to query the /dev/spidev0.0 interface, we would run
    this:


    ```

    $ spi-config -d /dev/spidev0.0 -q

    /dev/spidev0.0: mode=0, lsb=0, bits=8, speed=500000

    ```


    # Note


    If you want more details about spi-config, you can visit https://github.com/cpb-/spi-tools/blob/master/src/spi-config.c.


    # spi-pipe


    The spi-pipe program can send the data it receives from its standard input to
    the SPI MOSI line, while simultaneously displaying data received from the MISO
    SPI line on its standard output.


    The general principle of operation is as follows:


    ```

    $ <command-1> | spi-pipe [options] | <command-2>

    ```


    For example, if we want to send some data to another SPI peripheral, we can use
    the following command:


    ```

    $ printf "HELLO from R-pi" | spi-pipe -d /dev/spidev0.0 | hexdump -C

    ```'
