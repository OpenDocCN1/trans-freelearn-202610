    \n## 将外部层添加到树莓派\n\n现在我们知道层的工作原理，可以将现有的外部层添加到我们的环境中。为此，我们将使用 meta-webserver (http://layers.openembedded.org/layerindex/branch/master/layer/meta-webserver/)\
