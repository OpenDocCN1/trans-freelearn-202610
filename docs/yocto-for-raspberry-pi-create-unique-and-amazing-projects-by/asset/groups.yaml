  - '[PAGE 185]


    # # The Linux kernel


    The Linux kernel is a Unix-like operating system kernel created by Linus Torvalds
    1991. It was originally developed for 32-bit x86-based PCs, but today, Linux also
    supports a large set of architectures such as ARM, PowerPC, MIPS, and SPARC. The
    Linux kernel is a fundamental part of a Linux distribution (such as Ubuntu, Debian,
    and Fedora).


    When deciding which kernel is most suited to your project, it''s good to have
    in mind how kernel releases work. Depending on your needs, you can choose between
    **mainline**, **developing**, or **stable** kernels. If you don''t work with kernel
    development, it''s recommended to avoid using the mainline kernel since it''s
    still under development and is considered unstable. A kernel is always considered
    stable directly after it has been released from the mainline tree. After that,
    the kernel will be maintained until the next mainline kernel becomes available
    (usually in 2-3 months). However, a kernel can be picked as a longterm kernel,
    which means that it will be maintained for an extended period (several years).
    Longterm kernels are often used in commercial projects, since these projects require
    a stable and supported base that can have important bug and security fixes backported
    for a long time.


    # ## Note


    Visit [https://www.kernel.org/releases.html](https://www.kernel.org/releases.html)
    for more details about kernel releases.'
  - '[PAGE 186]


    # The Linux kernels versus the Raspberry Pi Linux kernel


    The currently recommended kernel for the Raspberry Pi is the official Raspberry
    Pi Linux kernel ( https://github.com/raspberrypi/linux.git ). The reason we need
    a specific kernel for the Raspberry Pi (instead of using the mainline Linux kernel)
    is mainly the proprietary firmware/GPU binary blob needed by the Raspberry Pi.
    However, in 2014, the full documentation for the VideoCore IV graphics core, together
    with the complete source for the graphics stack, was released by Broadcom, under
    a three-clause BSD license. This lead to the gap between the mainline support
    for bcm2835 (the SoC used in the Raspberry Pi) and the support for the Rasbberry
    Pi Linux kernel decreasing significantly. With that said, there is still some
    hard work left to do in the mainline kernel, for example, video decoding and camera
    support. Also, some important drivers such as the rpi-ft5406 (used for the official
    Raspberry Pi touchscreen) still don''t exist within the mainline Linux kernel.


    # Note


    Read more about the current status of the Raspberry Pi kernel upstreaming to the
    mainline kernel at http://elinux.org/RPi_Upstreaming .'
  - "[PAGE 187]\n\n# # Getting started with the Linux kernel\n\nIn this part of the\
    \ chapter, we will go through how to download, configure, and compile a custom\
    \ Linux kernel.\n\nDifferent mainline versions of the kernel can be downloaded\
    \ from kernel.org, either as an archived file or through GitHub. In the examples,\
    \ we will use version 4.1 of the kernel, since its currently the default in meta-raspberrypi.\
    \ You can easily find the default version for meta-raspberrypi by searching for\
    \ PREFERRED_VERSION_linux-raspberrypi, like this:\n\n```\n$ cd meta-raspberrypi\n\
    $ git grep PREFERRED_VERSION_linux-raspberrypi\nconf/machine/include/rpi-default-\
    \ versions.inc:PREFERRED_VERSION_linux-raspberrypi\n?= \"4.1.1%\"\n```\n\nStart\
    \ by downloading the kernel and then go to the 4.1 branch:\n\n```\n$ cd /path/to/workdir\n\
    $ git clone\nhttps://git.kernel.org/cgit/linux/kernel/git/stable/linux-stable.git/\n\
    $ git checkout -b linux-4.1.y -t remotes/origin/linux-4.1.y\n```\n\nRemember that\
    \ when building for the Raspberry Pi, https://github.com/raspberrypi/linux.git\
    \ is the supported kernel repository. Use it like this:\n\n# ## Note\n\n```\n\
    $ git clone https://github.com/raspberrypi/linux.git $ git checkout -b rpi-4.1.y\
    \ -t remotes/origin/rpi-4.1.y\n```\n\nNext, we can start working with our kernel.\
    \ First, we need to decide what configuration to use; all existing configurations\
    \ exist under arch/*/configs/ in the kernel tree. Later, we will look at how to\
    \ make our own customizations to the kernel, but for now, we will start by using\
    \ a predefined configuration for the ARM platform. When building from your host\
    \ machine, you need to set up a cross compiler for the ARM architecture, which\
