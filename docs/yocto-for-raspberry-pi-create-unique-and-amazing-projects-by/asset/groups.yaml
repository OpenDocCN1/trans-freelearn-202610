    # Configuring the touchscreen from the kernel perspective


    In this subsection, we will go through the basic kernel configuration needed for
    the PiTFT 2.8 touchscreen and the Raspberry Pi 7 touchscreen.


    First, we need to choose what configuration we should use for our base. When using
    meta-raspberrypi, this will be handled automatically by the build system after
    we have specified either raspberrypi or raspberrypi2 as our MACHINE variable in
    local.conf. When using a custom kernel, we need to know which existing configuration
    is suitable for our Raspberry Pi model. Currently, there are three choices: bcmrpi_defconfig
    (first-generation Raspberry Pi), bcm2709_defconfig (second-generation Raspberry
    Pi), or bcm2835_defconfig (only fully supported in later kernel versions). In
    our example, we will be using a Raspberry Pi 2. When the configuration has been
    decided, we can start by doing a basic configuration of the kernel, as shown here:


    ```

    $ cd /path/to/rpi_kernel_repo

    $ mkdir -p /path/to/output_dir

    $ O=/path/to/output_dir CROSS_COMPILE=/path/to/arm-linux-gnueabi- ARCH=bcm2709_defconfig

    ```


    Using BitBake and meta-raspberrypi, you need to do the following:


    ```

    $ bitbake linux-raspberrypi -c configure

    ```


    # Note


    For a custom kernel, the config will be stored at /path/to/kernel_output/.config.
    When using Yocto and meta-raspberrypi, it will be stored at . /tmp/work/raspberrypi*-poky-linux-gnueabi/linux-raspberrypi/<kernel_version_and_revision>/linux-raspberrypi*-standard-build/.config.


    Once we have our basic configuration in place, we can check whether it contains
    the most basic configurations required for bringing up our display. Note that
    the following configurations are currently enabled by default in the Raspberry
    Pi configurations.


    For PiTFT 2.8, these options must be enabled:


    ```

    CONFIG_INPUT_TOUCHSCREEN=y

    CONFIG_OF_TOUCHSCREEN=y

    ```'
