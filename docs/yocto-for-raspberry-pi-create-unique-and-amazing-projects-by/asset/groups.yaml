    ## 盗版


    互联网上的受版权保护材料盗版是所有媒体领域持续存在的问题。在 Packt，我们非常重视对我们的版权和许可的保护。如果您在互联网上以任何形式发现我们作品的非法副本，请立即向我们提供位置地址或网站名称，以便我们可以采取补救措施。


    请通过 copyright@packtpub.com 联系我们，并提供涉嫌盗版材料的链接。


    感谢您帮助保护我们的作者，以及我们为您提供有价值内容的能力。


    ## 问题


    如果您对本书的任何方面有问题，可以通过 questions@packtpub.com 联系我们，我们将竭尽力解决问题。


    ## 第 1 章. 认识 Yocto 项目


    在本章中，我们将了解 Yocto 项目及其主要原则。本书中使用的所有概念都将在这里介绍。我们将讨论 Yocto 项目的历史、构建系统、Poky、OpenEmbedded-Core、BitBake、元数据以及
    Yocto 项目工作流程。


    ### Yocto 项目


    Yocto 项目是一个涵盖相当广泛的嵌入式 Linux 技术的伞形项目。它不是一个 Linux 发行版，如 Yocto 项目网站所述：


    > "Yocto 项目是一个开源协作项目，提供模板、工具和方法，帮助您为嵌入式产品创建基于 Linux 的定制系统，无论硬件架构如何。"


    由 Linux 基金会赞助，Yocto 项目不仅仅是一个构建系统。它提供工具、流程、模板和方法，以便开发人员可以快速为嵌入式设备（树莓派、Beagleboard、Nitrogen6x、SAMA5D3、Olinuxino
    等）或 QEMU 创建和部署产品。构成 Yocto 项目的两个主要组件是：


    - Poky：这是构建系统（参考发行版）。

    - BitBake：这是调度程序。它是一个基于 Gentoo 发行版的工具。


    在 2010 年 11 月左右，Linux 基金会宣布这项工作将继续作为由 Linux 基金会赞助的项目，隶属于 Yocto 项目（由 Linux 基金会
    Fellow Richard Purdie 担任架构师）。随后确立，Yocto 项目和 OpenEmbedded 将针对名为 OE-Core 的核心元数据包集进行协调，结合
    Poky 和 OpenEmbedded 的优点，并增加对其他组件的分层使用。


    ### 了解构建系统


    如前所述，我们正处于 Yocto 项目的构建系统世界中。构建系统使您能够：


    - 编译或交叉编译应用程序

    - 打包应用程序

    - 测试输出二进制文件和生态系统兼容性

    - 部署生成的镜像


    要执行这些步骤，存在多种工具。其中一些如下：


    - Buildroot (http://buildroot.uclibc.org/)

    - LTIB (http://ltib.org/)

    - OpenWRT (https://openwrt.org/)

    - Yocto/OpenEmbedded (https://www.yoctoproject.org/)


    例如，Buildroot 是一组用于嵌入式系统自动生成的 makefile。它支持编译引导加载程序（例如 U-Boot）、内核（zImage 或 bzImage），以及通过
    BusyBox 和第三方应用程序进行的基本控制。Buildroot 可在各种架构上运行，例如 ARM、x86 和 MIPS。欲了解更多信息，请参阅 https://buildroot.org/docs.html
    上的英文完整文档。


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_30_0.png)


    > "Buildroot 是由一家名为 Free Electrons 的法国公司部分维护的工具，该公司专注于嵌入式 Linux 开发。"


    与本书中将探索的 Yocto 项目相比，Buildroot 是一种更为简单的方法。Buildroot 更多致力于固件生成，而 Yocto/OpenEmbedded
    则面向发行版。Buildroot 提供 700 个配方，而 Yocto 项目则提供超过 8000 个。


    ### 核心组件


    Yocto 项目的核心组件（其他可用工具为可选）如下：


    - BitBake

    - OpenEmbedded-Core

    - Poky

    - BSP 层（meta-raspberry、meta-fsl-arm、meta-ti、meta-intel、meta-sunxi 等）


    下图显示了本书中将发现的所有层。我们将通过各种示例学习所有工具，以便更好地理解。


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_32_0.png)


    ### 什么是 Poky？


    Poky 是 *参考* Yocto 项目发行版。它包含 OpenEmbedded 的一些基本组件（称为构建系统）以及一组用于为多个目标创建嵌入式发行版的元数据。它与平台无关，并使用
    BitBake 工具（任务调度器）、OpenEmbedded-Core 和一组默认元数据进行交叉编译，如下图所示。它提供构建和组合成千上万个分布式开源项目的机制。


    Poky 构建系统有望在工业界成为参考，正如 Wind River、Intel、Montavista 和 Mentor Graphics 等行业领导者所证明的那样。


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_33_0.png)


    ### 注意


    Angstrom (http://www.angstrom-distribution.org/) 是另一种基于 OpenEmbedded-Core 的发行版。您可以将
    Angstrom 和 Poky 视为近亲，因为 Poky 也是基于 OpenEmbedded-Core。


    ### 头号人物 - BitBake


    BitBake，构建引擎，是一个任务调度器（类似于 GNU Make），用于解析多个脚本（例如 shell 和 Python）。


    一旦环境构建完成，BitBake 将执行请求的任务。如果未提供任务，BitBake 将运行名为 build 的默认任务。


    要运行任务，BitBake 首先会查找名为 do_<task_name> 的环境变量，该变量将包含要执行的任务代码（Python 或 shell）。因此，要编译
    Yocto 配方，请使用 do_compile 变量中包含的代码。


    简而言之，根据配方（或元数据）中包含的信息，它会从互联网、本地目录或版本控制系统（例如 Git）下载项目源代码，然后按动态生成的依赖图确定的顺序进行构建。最后，它安装二进制文件，生成相应的软件包，并构建最终镜像，该镜像可以安装在目标设备上（对我们来说是树莓派）。


    下图显示了 BitBake 的工作原理：


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_34_0.png)


    ### OpenEmbedded-Core


    OpenEmbedded-Core 元数据集合（下图中的 meta）提供了 Poky 构建工具的引擎。它旨在提供核心功能（多个配方）。它支持六种不同的处理器架构（ARM、x86、x86-64、PowerPC、MIPS
    和 MIPS64），仅支持 QEMU 模拟的机器。


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_35_0.png)


    OpenEmbedded-Core 的组织结构如下：


    - classes

    - conf

    - files

    - lib

    - recipes-bsp

    - recipes-connectivity

    - recipes-core

    - recipes-devtools

    - recipes-extended

    - recipes-gnome

    - recipes-graphics

    - recipes-kernel

    - recipes-lsb4

    - recipes-multimedia

    - recipes-qt

    - recipes-rt

    - recipes-sato

    - recipes-support

    - site

    - COPYING.GPLv2

    - COPYING.MIT

    - recipes.txt


    该层包含不同的配方，描述如何获取、配置、编译和打包应用程序及镜像。


    ### 注意


    在本书的其余部分，我们将把此层与树莓派的 BSP 层 **meta-raspberrypi** 混合使用。


    ### 探索元数据


    **元数据**由 Python 和 shell 脚本文本文件（.conf、.bb、.bbclass 和 .inc）混合组成，提供了一个极其灵活的系统。元数据既指构建指令本身，也指用于控制构建哪些内容以及影响如何构建的数据。元数据还包括用于指示使用哪些软件版本及其获取来源的命令和数据。Poky
    使用它来扩展 OpenEmbedded-Core，并包含两个不同的层，它们是另一个元数据子集。详情如下：


    - **meta-yocto**：此层提供默认和受支持的发行版、可视化品牌以及元数据跟踪信息（维护者、上游状态等）

    - **meta-yocto-bsp**：此层在此基础上提供硬件参考板支持（BSP），用于 Poky


    我们将在第 4 章 _了解 BitBake 工具。_ 中深入探讨元数据。


    '
