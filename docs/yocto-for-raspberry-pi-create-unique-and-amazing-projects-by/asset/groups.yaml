    the drivers required for your display didn''t exist when the old kernel was developed,
    and new drivers are seldom backported to older kernel versions. This leaves you
    with two choices. The first is doing the hard work of trying to backport the requested
    drivers by yourself. This is very difficult and often hard to achieve even for
    an experienced kernel developer, depending on how old kernel is that the backport
    is needed for. The other, more suitable, solution is to use a newer kernel version
    with the drivers for your display included.


    Even if your kernel contains all the parts needed to get your display up and running,
    you have to ensure that all drivers are enabled. Starting from kernel version
    3.18, Raspberry Pi has official support for something called a device tree, which
    can be used to simplify the configuration of the kernel.


    In this subsection, we will go through these topics:


    +   - The device tree: What is it and how to use it on the Raspberry Pi

    +   - The configuration of a touchscreen from the kernel perspective: How to configure
    the kernel on the Raspberry Pi to handle different touchscreens


    # ## The Raspberry Pi device tree


    A **device tree (DT)** is a tree data structure that contains a description of
    the device''s hardware. A DT can manage resource allocation and handle module
    loading, which eases problems with drivers competing for system resources. For
    the ARM architecture, **device tree source (DTS)** files are stored within the
    kernel tree under `/arch/arm/boot/dts`. When the kernel is build, the DTS files
    are compiled into **device tree blobs (DTBs)**. To be able to use DTs, both the
    firmware and kernel must support it, since the bootloader will be responsible
    for loading the DTB along with the kernel (the third-stage bootloader, `start.elf`,
    will pass the device tree blob to the Raspberry Pi).


    # ## Note


    The Raspberry Pi uses its GPU (VideoCore IV) to boot the system. It starts by
    loading its first-stage bootloader. This will make it possible to access and run
    the second-stage bootloader, `bootcode.bin` (located on the SD card). The second-stage
    bootloader is executed on the GPU and will load the third-stage bootloader, called
    `start.elf`. The main responsibilities of the third-stage bootloader are to read
    and parse configurations and pass them to the GPU and kernel, together with loading
    the kernel image. The `bootcode.bin` and `start.elf` bootloaders, together with
    the configuration (such as `cmdline.txt` and `config.txt`), are located on the
    SD card.


    Passing a DTB to a kernel that ''doesn''t support device trees will prevent the
    image from booting. In order to handle this in a generic way, a trailer added
    by the `mkknlimg` tool is used by the bootloader to check whether the kernel supports
    DT.


    The management of device tree is done using the `config.txt` file for the Raspberry
    Pi. The base device'
