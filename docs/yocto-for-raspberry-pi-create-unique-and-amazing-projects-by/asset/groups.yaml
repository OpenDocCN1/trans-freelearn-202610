    \ support Petter Mabäckner\n- [yocto] [meta-raspberrypi] PATCH 0/5] Various upgrade/fixes\
    \ from Technux Petter Mabäckner\n\nThe mailing lists can be easily tracked by\
    \ subscribing to a specific mailing list or by reading the archives.\n\n### Note\n\
    \nAll Yocto Project mailing lists can be found at https://www.yoctoproject.org/tools-resources/community/mailing-lists\n\
    \n### Contributing to meta-raspberrypi\n\nIf you have prepared a fix or feature\
    \ for meta-raspberrypi that you want to share with the community, there are a\
    \ number of things you need to be aware of.\n\nThe current maintainer of meta-raspberrypi\
    \ is Andrei Gherzan. He has the final word about a patch and will integrate the\
    \ patch into the meta-raspberrypi main layer. Since the maintainers are quite\
    \ busy, it's important that you test your patch carefully before sending it upstream.\
    \ The most important thing for a contributor, regardless of the project, is to\
    \ build up its reputation by sending well-tested patches that follow the requested\
    \ guidelines. This will significantly increase the chances of getting your patch\
    \ integrated into the project.\n\nSome overall \"rules\" exist for contributing\
    \ to meta-raspberrypi:\n\n- Patches related to meta-raspberrypi should always\
    \ be sent to yocto@yoctoproject.org.\n- Prefix your emails with \"[meta-raspberrypi]\"\
    \n- Follow the OpenEmbedded patch guidelines\n- Follow the meta-raspberrypi readme\
    \ instructions\n\nAn extended explanation of this set of rules, together with\
    \ examples, will be described later in this chapter.\n\n### Setting up your Git\
    \ repository\n\nBefore you can send anything upstream, you need set up some basic\
    \ things. First, you should set up your name and e-mail for your meta-raspberrypi\
    \ Git repository, as described in earlier parts of this chapter:\n\n```\n$ cd\
    \ meta-raspberrypi\n$ git config user.email \"your_email@packtpub.com\"\n$ git\
    \ config user.name \"Forename Surname\"\n```\n\nNext, you should set up git send-email\
    \ in order to use Git to send your patches through your SMTP server. This is often\
    \ required by the maintainers in order to ensure that the format of the patch\
    \ is correct and it can be easily integrated. You need to manually configure the\
    \ server parameters-refer to your e-mail provider's documentation or contact support\
    \ in order to find the right parameters.\n\nIn addition to Git, you also need\
    \ to install send-email, which is the software Git uses under the hood for git\
    \ send-email. The send-email package is available on most distributions, but the\
    \ name might differ. Here is how to set it up on Ubuntu and Fedora:\n\n- Ubuntu:\
    \ $ sudo apt-get install sendemail\n- Fedora: $ sudo yum install sendmail\n\n\
    Here is an example of how to configure sendemail:\n\n```\n$ cd meta-raspberrypi\n\
    $ git config sendemail.smtpencryption tls\n$ git config sendemail.smtpserver smtp.packtpub.com\n\
    $ git config sendemail.smtpuser your_email@packtpub.com\n$ git config sendemail.smtpserverport\
    \ 587\n```\n\n### Creating your commit\n\nNow, you are ready to make your modifications.\
    \ In this subsection, we will go through each step from implementing your changes\
    \ to creating a commit that follows the patch guidelines for meta-raspberrypi.\n\
    \nIt is common sense to create your changes in a working branch (not the master\
    \ branch). In our example, we will set up a branch that tracks the master branch:\n\
    \n```\n$ cd meta-raspberrypi\n$ git checkout -b my_work_branch -t origin/master\n\
    ```\n\nNow, using your favorite editor, edit the files you want to change. When\
    \ you are done with your modifications, you need to add the changed files to the\
    \ Git index; otherwise, Git will not add your changes to the upcoming commit:\n\
    \n```\n$ git add <files changed>\n```\n\nNow it's time to create a commit message\
    \ by following the guidelines in the meta-raspberrypi's readme and the openembedded\
    \ guidelines. Here are the most important parts of the guidelines:\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_217_0.png)\n\
    \n### Note\n\nThe complete OpenEmbedded guidelines can be found at http://www.openembedded.org/wiki/Commit_Patch_Message_Guidelines.\n\
    \nWhen creating the commit, remember to sign off on it (using -s). The signoff\
    \ is a one-liner that is added by default to the end of the commit message. The\
    \ original purpose of the signoff is as follows, according to the Linux kernel\
    \ documentation:\n\n> \"To improve tracking of who did what, especially with patches\
    \ that can percolate to their final resting place in the kernel through several\
    \ layers of maintainers, we've introduced a \"sign-off\" procedure on patches\
    \ that are being emailed around. The sign-off is a simple line at the end of the\
    \ explanation for the patch, which certifies that you wrote it or otherwise have\
    \ the right to pass it on as an open-source patch.\"\n\nHere is how you use it:\n\
    \n```\n$ git commit -s\nWrite your commit message\n```\n\n### Sending changes\
    \ to the community\n\nThe maintainers of a project want to focus on the design\
    \ of your patches and often assume that patches sent to the list are functional.\
    \ Therefore, it's important to ensure that you have verified that the patch has\
    \ been built and tested for relevant images supported by meta-raspberrypi.\n\n\
    When your patch meets your expectations and has passed all tests, it's time to\
    \ send it to the community. First, we need to generate the patch. When generating\
    \ a patch, we should follow the recommendations from the readme in meta-raspberrypi.\
    \ If you have more than one commit, one patch for each commit will be generated.\
    \ A cover letter will also be generated, and it will always be named 0000-cover-letter.patch.\
    \ The cover letter is optional but strongly recommended when creating more than\
    \ one patch in the same series.\n\n```\n$ git format-patch --cover-letter --subject-prefix='meta-raspberrypi][PATCH'\
    \ origin\n```\n\n### Note\n\nRemove \"--cover-letter\" if you only have one patch\
    \ or don't feel the need for it.\n\nIf you decide to generate a cover letter,\
    \ you can open it with your preferred editor. Search for the lines *** SUBJECT\
    \ HERE *** and *** BLURB HERE *** and replace them with appropriate information\
    \ about your patches.\n\nTime for the final step: sending the patches up to the\
    \ mailing list!\n\n```\n$ git send-email --to yocto@yoctoproject.org <generated\
    \ patches>\n```\n"
