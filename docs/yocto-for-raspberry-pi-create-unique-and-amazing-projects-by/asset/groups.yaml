    ?= \"4.1.1%\"\n```\n\nStart by downloading the kernel and then go to the 4.1 branch:\n\
    \n```\n$ cd /path/to/workdir\n$ git clone https://git.kernel.org/cgit/linux/kernel/git/stable/linux-stable.git/\n\
    $ git checkout -b linux-4.1.y -t remotes/origin/linux-4.1.y\n```\n\nRemember that\
    \ when building for the Raspberry Pi, https://github.com/raspberrypi/linux.git\
    \ is the supported kernel repository. Use it like this:\n\n### Note\n\n```\n$\
    \ git clone https://github.com/raspberrypi/linux.git\n$ git checkout -b rpi-4.1.y\
    \ -t remotes/origin/rpi-4.1.y\n```\n\nNext, we can start working with our kernel.\
    \ First, we need to decide what configuration to use; all existing configurations\
