  md: "\n## The Linux kernel\n\nThe Linux kernel is a Unix-like operating system kernel\
    \ created by Linus Torvalds in 1991. It was originally developed for 32-bit x86-based\
    \ PCs, but today, Linux also supports a large set of architectures such as ARM,\
    \ PowerPC, MIPS, and SPARC. The Linux kernel is a fundamental part of a Linux\
    \ distribution (such as Ubuntu, Debian, and Fedora).\n\nWhen deciding which kernel\
    \ is most suited to your project, it's good to have in mind how kernel releases\
    \ work. Depending on your needs, you can choose between **mainline**, **developing**,\
    \ or **stable** kernels. If you don't work with kernel development, it's recommended\
    \ to avoid using the mainline kernel since it's still under development and is\
    \ considered unstable. A kernel is always considered stable directly after it\
    \ has been released from the mainline tree. After that, the kernel will be maintained\
    \ until the next mainline kernel becomes available (usually in 2-3 months). However,\
    \ a kernel can be picked as a longterm kernel, which means that it will be maintained\
    \ for an extended period (several years). Longterm kernels are often used in commercial\
    \ projects, since these projects require a stable and supported base that can\
    \ have important bug and security fixes backported for a long time.\n\n### Note\n\
    \nVisit [https://www.kernel.org/releases.html](https://www.kernel.org/releases.html)\
    \ for more details about kernel releases.\n\n## The Linux kernels versus the Raspberry\
    \ Pi Linux kernel\n\nThe currently recommended kernel for the Raspberry Pi is\
    \ the official Raspberry Pi Linux kernel (https://github.com/raspberrypi/linux.git).\
    \ The reason we need a specific kernel for the Raspberry Pi (instead of using\
    \ the mainline Linux kernel) is mainly the proprietary firmware/GPU binary blob\
    \ needed by the Raspberry Pi. However, in 2014, the full documentation for the\
    \ VideoCore IV graphics core, together with the complete source for the graphics\
    \ stack, was released by Broadcom, under a three-clause BSD license. This lead\
    \ to the gap between the mainline support for bcm2835 (the SoC used in the Raspberry\
    \ Pi) and the support for the Raspberry Pi Linux kernel decreasing significantly.\
    \ With that said, there is still some hard work left to do in the mainline kernel,\
    \ for example, video decoding and camera support. Also, some important drivers\
    \ such as the rpi-ft5406 (used for the official Raspberry Pi touchscreen) still\
    \ don't exist within the mainline Linux kernel.\n\n### Note\n\nRead more about\
    \ the current status of the Raspberry Pi kernel upstreaming to the mainline kernel\
    \ at http://elinux.org/RPi_Upstreaming.\n\n## Getting started with the Linux kernel\n\
