    \ layer directory, you can visit http://www.yoctoproject.org/docs/1.4.2/dev-manual/dev-manual.html#managing-layers\
    \ .\n\n### Summary\n\nIn this chapter, we learned how to generate a custom layer\
    \ using the yocto-layer script. We also learned how to integrate a recipe into\
    \ this, and finally, we created a custom image and it on our Raspberry Pi.\n\n\
    In the next chapter, we will explore all of the Raspberry Pi's peripherals.\n\n\
    ## Chapter 8. Diving into the Raspberry Pi's Peripherals and Yocto Recipes\n\n\
    In this chapter, we will learn how to handle the SPI and i2c buses of the Raspberry\
    \ Pi through the Yocto Project. We'll see how to write our own recipe for custom\
    \ applications.\n\n### The SPI bus\n\nThe **Serial Peripheral Interface (SPI)**\
    \ protocol implements a synchronous serial link between a master and a slave.\
    \ When a single slave is used, only three signals (and ground) are needed.\n\n\
    The master generates an **SCLK** (serial clock) clock signal, which is sent to\
    \ the slave. On some transitions of this clock, the slave will read data using\
    \ the appointed signal, **MOSI** (short for master out, slave in), or write it\
    \ using the signal named **MISO** (master in, slave out). There are several names,\
    \ depending on hardware manufacturers, used to describe these signals. It is recommended\
    \ to use the MISO/MOSI notation (the most common one), because it removes any\
    \ ambiguity: the MOSI pin of a master must always be connected to the MOSI pin\
    \ of a slave, and the same is true for the MISO pin.\n\nIf several slaves are\
    \ to be connected to the same host, they may be connected in parallel (all MISO\
    \ pins connected together as well as all MOSI pins), but an additional signal\
    \ (**CS**, or Chip Select) is required for each of them, to choose which pin communication\
    \ is established with at a given time. An example is presented in the following\
    \ figure:\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_142_0.png)\n\nHave fun with\
    \ the SPI protocol on your Raspberry Pi; we will explore it further through a\
    \ utility developed for our platform.\n\n### Note\n\nFor further information about\
    \ the SPI protocol, you can visit the following website: https://en.wikipedia.org/wiki/Serial_Peripheral_Interface_Bus\n\
    \n### The spi-tools project\n\nTo quickly establish a connection with an SPI device\
    \ from a shell script, for example, we suggest you use a small package that a\
    \ French engineer (Christophe Blaess) has recently developed, which simplifies\
    \ configuration and bidirectional communication. It is a free project called **spi-tools**.\n\
    \nThis project is divided into two tools:\n\n- **spi-config**: This allows you\
    \ to view or edit the communications settings on an SPI port. Here is the command:\n\
    \n```\n$ spi-config\n```\n\n- **spi-pipe**: This allows full-duplex talk with\
    \ a device by redirecting standard input and standard output to the specified\
    \ SPI port. The command is as follows:\n\n```\n$ spi-pipe\n```\n\n### Note\n\n\
    If you want more information, consult the readme file in the GitHub repository:\
    \ [https://github.com/cpb-/spi-tools](https://github.com/cpb-/spi-tools)\n\n###\
    \ Inclusion in the meta-oe layer\n\nThe advantage of spi-tools is that it has\
    \ been completely integrated into the Yocto/OE environment since April 2015. Indeed,\
    \ it is part of the meta-oe layer.\n\n### Note\n\nYou can look at the initial\
    \ commit here: [https://github.com/openembedded/meta-oe/commit/90b13eded76f7f7fa1a6715e67c32504e7788e96](https://github.com/openembedded/meta-oe/commit/90b13eded76f7f7fa1a6715e67c32504e7788e96)\n\
    \nIt is easy to introduce this layer to our environment in order to use these\
    \ utilities. Here we see another advantage of the Yocto Project: flexibility.\n\
    \nIf you want to visit the metadata index of this recipe, you can visit [http://layers.openembedded.org/layerindex/recipe/33576/](http://layers.openembedded.org/layerindex/recipe/33576/).\n\
    \nAs you may have guessed, the first step in integrating the spi-tools recipe\
    \ is modifying our conf/bblayers.conf file in order to add the path of the layer:\n\
    \n```\n# changes incompatibly\nLCONF_VERSION = \"6\"\nBBPATH = \"${TOPDIR}\"\n\
    BBFILES ?= \"\"\nBBLAYERS ?= \" \\\\\n/home/packt/RASPBERRYPI/poky/meta \\\\\n\
    /home/packt/RASPBERRYPI/poky/meta-yocto \\\\\n/home/packt/RASPBERRYPI/poky/meta-yocto-bsp\
    \ \\\\\n/home/packt/RASPBERRYPI/poky/meta-raspberrypi \\\\\n/home/packt/RASPBERRYPI/poky/meta-pack_rpi\
    \ \\\\\n/home/packt/RASPBERRYPI/poky/meta-openembedded/meta-oe \\ \" \nBBLAYERS_NON_REMOVABLE\
    \ ?= \" \\\\\n/home/packt/RASPBERRYPI/poky/meta \\\\\n/home/packt/RASPBERRYPI/poky/meta-yocto\
    \ \\\n```\n\n### Note\n\nYou can download the meta-oe layer by using this following\
    \ command:\n\n```\n$ git clone https://github.com/openembedded/meta-openembedded.git\n\
    ```\n\nNow that the path of our layer has been set, it is visible to BitBake and\
    \ spi-tools can be integrated with our root filesystem. To do this, we need to\
    \ run the command to create the binaries.\n\n### Baking spi-tools\n\nIn order\
    \ to generate the package (ipk, rpm, or dpkg), we can run the following command:\n\
    \n```\n$ bitbake spitools\nLoading cache: 100%\n|###############################################################################|\n\
    #################################################################################|\n\
    ###| ETA:  00:00:00\nLoaded 2006 entries from dependency cache.\nNOTE: Resolving\
    \ any missing task queue dependencies\nBuild Configuration:\nBB_VERSION      \
    \  = \"1.27.1\"\nBUILD_SYS         = \"x86_64-linux\"\nNATIVELSBSTRING   = \"\
    Ubuntu-14.04\"\nTARGET_SYS        = \"arm-poky-linux-gnueabi\"\nMACHINE      \
    \     = \"raspberrypi\"\nDISTRO            = \"poky\"\nDISTRO_VERSION    = \"\
    1.8+snapshot-20150729\"\nTUNE_FEATURES     = \"arm armv6 vfp arm1176jzfs callconvention-hard\"\
    \nTARGET_FPU        = \"vfp\"\nmeta\nmeta-yocto\nmeta-yocto-bsp    = \"master:19f77cf586fbee9e67d3698263402b717303c5ec\"\
    \nmeta-raspberrypi  = \"master:7457bf182c8fd550ec877ecd786a3edd16e65495\"\nmeta-pack_rpi\
    \   = \"master:19f77cf586fbee9e67d3698263402b717303c5ec\"\nmeta-oe           =\
    \ \"master:f637fadb106a09a6f3dfba4181d06dc9b5e82ff5\"\nNOTE: Executing SetScene\
    \ Tasks\nNOTE: Executing RunQueue Tasks\nCurrently 1 running tasks (373 of 381):\n\
    0: spitools-git-r0 do_configure (pid 3535)\n```\n\nAlternatively, if we want to\
    \ integrate spi-tools into our image, we just have to add the following line to\
    \ our image and run BitBake raspberry-pack-image:\n\n```\n# Base this image on\
    \ core-image-minimal\ninclude recipes-core/images/core-image-minimal.bb\nDESCRIPTION\
    \ = \"Image for raspberry-pi\"\nIMAGE_FEATURES += \"ssh-server-dropbear splash\"\
    \n# Include modules in rootfs\nIMAGE_INSTALL += \" \\\n    kernel-modules \\\n\
    \    gpio-pact \\\n    spitools \\\n    \"\n```\n\n### Testing on the Raspberry\
    \ Pi\n\nWith our image in hand, we can now run the utilities offered by spi-tools.\n\
    \n### spi-config\n\nTo access SPI interfaces from user space, the kernel provides\
    \ us entry points as special files in /dev. This requires the loading of the following\
    \ module:\n\n```\n$ modprobe spidev\n```\n\nAfter integrating this module, we\
    \ can try to launch the spi-config utility:\n\n```\n$ spi-config\nspi-config:\
    \ no device specified (use option -h for help)\n$ spi-config -h\nusage: ./spi-config\
    \ options...\noptions:\n-d --device= use the given spi-dev character device.\n\
    -q --query print the current configuration.\n-m --mode=[0-3] use the selected\
    \ spi mode.\n0: low idle level, sample on leading edge\n1: low idle level, sample\
    \ on trailing edge\n2: high idle level, sample on leading edge\n3: high idle level,\
    \ sample on trailing edge\n-l --lsb={0,1} LSB first (1) or MSB first (0)\n-b --bits=[7...]\
    \ bits per word\n-s --speed= set the speed in Hz\n-h --help this screen\n-v --version\
    \ display the version number\n```\n\nFor example, if we wanted to query the /dev/spidev0.0\
    \ interface, we would run this:\n\n```\n$ spi-config -d /dev/spidev0.0 -q\n/dev/spidev0.0:\
    \ mode=0, lsb=0, bits=8, speed=500000\n```\n\n### Note\n\nIf you want more details\
    \ about spi-config, you can visit https://github.com/cpb-/spi-tools/blob/master/src/spi-config.c.\n\
    \n### spi-pipe\n\nThe spi-pipe program can send the data it receives from its\
    \ standard input to the SPI MOSI line, while simultaneously displaying data received\
    \ from the MISO SPI line on its standard output.\n\nThe general principle of operation\
    \ is as follows:\n\n```\n$ <command-1> | spi-pipe [options] | <command-2>\n```\n\
    \nFor example, if we want to send some data to another SPI peripheral, we can\
    \ use the following command:\n\n```\n$ printf \"HELLO from R-pi\" | spi-pipe -d\
    \ /dev/spidev0.0 | hexdump -C\n```\n\n"
