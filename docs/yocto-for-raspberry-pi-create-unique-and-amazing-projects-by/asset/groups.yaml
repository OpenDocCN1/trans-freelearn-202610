  md: "\n## Material required for the project\n\nYou will need the following material\
    \ for the project:\n\n- A Raspberry Pi (any model will do)\n\n  The Raspberry\
    \ Pi Zero requires that you either solder in a GPIO header or solder the wires\
    \ directly to the GPIO pads\n\n- Jumper cables (three are required)\n- A one-channel\
    \ 5V relay module\n- A lamp (preferably a lamp you don't mind splitting and cutting\
    \ the cable of)\n- An external power supply (preferably 12V)\n\n### Note\n\nWARNING:\
    \ This project requires basic knowledge of electrical circuits. We strongly discourage\
    \ using high-voltage power if you don't have the knowledge or experience.\n\n\
    ## Setting up the base for the project\n\nFirst, we should set up the base for\
    \ our Yocto Project implementation. Most of the techniques used in this section\
    \ have been covered throughout the book, so they will not be explained in detail.\
    \ In this part of the chapter, we perform the basic setup for our Yocto Project\
    \ implementation, which will be used for the home automation project.\n\n## Creating\
    \ a new layer\n\nWe will begin by creating a new layer. The new layer will act\
    \ as the base of our home automation project. For now, it will only contain our\
    \ image recipe, but we will add more content to the layer throughout the chapter\
    \ until we have all the parts needed for our server. Just as described in Chapter\
    \ 7, Deploying a Custom Layer on the Raspberry Pi, we will use yocto-layer to\
    \ help us set up the structure of the layer. We need to set a high priority to\
    \ ensure that content from this layer is prioritized over, for example, content\
    \ in meta-raspberrypi, like so:\n\n```\n$ /path/to/poky/scripts/yocto-layer create\
    \ pkt-iot\nPlease enter the layer priority you'd like to use for the layer: [default:\
    \ 6] 10\nWould you like to have an example recipe created? (y/n) [default: n]\n\
    Would you like to have an example bbappend file created? (y/n) [default: n]\n\
    New layer created in meta-pkt-iot.\nDon't forget to add it to your BBLAYERS (for\
    \ details see meta-pkt-iot/README).\n```\n\n## Customizing the image recipe\n\n\
    In this subsection, we will improve upon the usage of a customized image recipe,\
    \ which we learned in Chapter 7, Deploying a Custom Layer on the Raspberry Pi.\n\
    \nStart by creating your image recipe file:\n\n```\n$ cd meta-pkt-iot\n$ mkdir\
    \ -p recipes-core/images/\n$ touch recipes-core/images/pkt-iot-image.bb\n```\n\
    \nNext, we will set up the basic content of the image; take a look at the following\
    \ code snippet. This image recipe will be growing during the entire chapter until\
    \ we finally have a complete image that fits our purpose. The image will be based\
    \ on rpi-basic-image.\n\n```\n$ cat recipes-core/images/pkt-iot-image.bb\n# Base\
    \ this image on rpi-basic-image\ninclude recipes-core/images/rpi-basic-image.bb\n\
    SPLASH = \"psplash-raspberrypi\"\nIMAGE_FEATURES += \"ssh-server-dropbear splash\"\
    \nIMAGE_INSTALL_append = \" rpi-gpio\"\n```\n\nWhen working with image recipes,\
    \ two commands called ROOTFS_PREPROCESS_COMMAND and ROOTFS_POSTPROCESS_COMMAND\
    \ exist. They can be used as the last resort to, for example, add, remove, or\
    \ modify content in the root filesystem. The two methods can be used either just\
    \ before the root filesystem is created using the PREPROCESS variant or after\
    \ the root filesystem has been created using the POSTPROCESS method. They are\
    \ used by specifying a list of functions to the variable. The functions can use\
    \ ${IMAGE_ROOTFS} to, in a generic way, find out the path to the filesystem. For\
    \ this project, we will use this method to add a function to ROOTFS_POSTPROCESS_COMMAND\
    \ that will create a release file for our image. Add the following content last\
    \ in pkt-iot-image.bb:\n\n```\nROOTFS_POSTPROCESS_COMMAND += \" create_release_file\
    \ ; \"\ncreate_release_file() {\nIMAGE_REL_FILE=\"${IMAGE_ROOTFS}${sysconfdir}/pkt-iot-release\"\
    \n    echo \"pkt-iot release version 1.0\" > ${IMAGE_REL_FILE}\n    echo \"Image:\
    \ ${IMAGE_NAME}\" >> ${IMAGE_REL_FILE}\n    echo \"Build date: ${DATETIME}\" >>\
    \ ${IMAGE_REL_FILE}\n    chmod 0444 ${IMAGE_REL_FILE}\n}\n```\n\nTake careful\
    \ notice of the whitespace in the create_release_file; part of the ROOTFS_POSTPROCESS_COMMAND\
    \ declaration.\n\n## Building and booting the image\n\nWe now have a new external\
    \ layer containing a basic image recipe. Until now, we haven't done any testing\
    \ of the layer. It is always a good idea to perform regular tests of your changes\
    \ during development. We will perform an early test of our layer. In order to\
    \ do this, we will create a new project, set up some mandatory and good-to-have\
    \ configurations in local.conf, and add external layers to bblayers.conf. This\
    \ project will then be used throughout the chapter.\n\n```\n$ source /path/to/poky/oe-init-build-env\
    \ pkt_project_chapter12\n```\n\nAdd the meta-raspberrypi and meta-oe external\
    \ layers, together with our new meta-pkt-iot layer, to bblayers.conf:\n\n```\n\
    BBLAYERS ?= \" \\\n/path/to/poky/meta \\\n/path/to/poky/meta-poky \\\n/path/to/poky/meta-yocto-bsp\
    \ \\\n/path/to/meta-raspberrypi \\\n/path/to/meta-openembedded/meta-oe \\\n/path/to/meta-pkt-iot\
    \ \\\n\"\n```\n\nDecide which machine to use and add it to local.conf. In this\
    \ example, we will use raspberrypi2:\n\n```\n$ echo \"MACHINE = \\\"raspberrypi2\\\
    \"\" >> conf/local.conf\n```\n\nWe will next enable a local package revision (PR)\
    \ server in our project. The PR server will automatically bump the PR of a package\
    \ if a change is detected. This will be done without a need for the end user,\
    \ to manually update the PR number in the recipe file. This feature is very handy\
    \ during, for example, the development of new recipes:\n\n```\n$ echo \"PRSERV_HOST\
    \ = \\\"localhost:0\\\"\" >> conf/local.conf\n```\n\nA project in BitBake can\
    \ consume a lot of disk space. There exist a number of methods that can be used\
    \ to reduce both the amount of disk space used by a project and its overall build\
    \ time.\n\nThe first method is to use rm_work. This feature will make sure that\
    \ BitBake performs a full cleanup of packages that have been built. By default,\
    \ all built packages will have source and artifacts saved in package-specific\
    \ locations, under ./tmp/work in the project. These will be wiped when the following\
    \ class is inherited for the project:\n\n```\n$ echo \"INHERIT += \\\"rm_work\\\
    \"\" >> conf/local.conf\n```\n\nHowever, it might be good to exclude packages\
    \ that are frequently used during development, especially if it takes a long time\
    \ unpack them. To achieve this, RM_WORK_EXCLUDE can be used.\n\nThe build time\
    \ for a project is often quite long, especially the first time, since BitBake\
    \ needs to fetch all source and build packages from scratch. But after the first\
    \ build is done, you can use a number of methods to speed up subsequent builds.\
    \ These methods can also be used in other Yocto projects with a similar setup\
    \ to decrease the build time and amount of disk space needed.\n\nThe first method\
    \ is to use a shared state (sstate). By default, the sstate cache is located within\
    \ the project. But by using the SSTATE_DIR variable in local.conf, the shared\
    \ state can be located outside of a project and be used by other projects as well.\
    \ The same goes for the next method, which is specifying the download location\
    \ for all packages fetched by BitBake during the build. It can also be configured\
    \ from local.conf using the DL_DIR variable. In this example, we will not use\
    \ a shared state or a download directory outside of our project. The reason for\
    \ this is that it isn't recommended when using a local PR server.\n\nAt this point,\
    \ your local.conf file should look something like this:\n\n```\n$ tail conf/local.conf\n\
    PACKAGECONFIG_append_pn-nativesdk-qemu = \" sdl\"\n#ASSUME_PROVIDED += \"libsdl-native\"\
    \n# CONF_VERSION is increased each time build/conf/ changes incompatibly and is\
    \ used to\n# track the version of this file when it was generated. This can safely\
    \ be ignored if\n# this doesn't mean anything to you.\nCONF_VERSION = \"1\"\n\
    MACHINE = \"raspberrypi2\"\nPRSERV_HOST = \"localhost:0\"\nINHERIT += \"rm_work\"\
    \n```\n\nWhen the project has its initial configuration in place, we can build\
    \ the image created earlier in this chapter:\n\n```\n$ bitbake pkt-iot-image\n\
    Parsing recipes: 100%\n###############################################################################\n\
    ###############################################################################|\
    \ Time: 00:00:31\nParsing of 895 .bb files complete (0 cached, 895 parsed). 1325\
    \ targets, 68 skipped,\n0 masked, 0 errors.\nNOTE: Resolving any missing task\
    \ queue dependencies\n```\n\nLet's try our new image on the target. In this state,\
    \ the image should behave similarly to a normal rpi-basic-image image. It's always\
    \ good to not only build our changes but also test them on the target in order\
    \ to ensure that nothing gets broken along the road. Use the method described\
    \ in Chapter 2, Building our First Poky Image for the Raspberry Pi to copy the\
    \ image to an SD card (remember to change /dev/sdX to the proper device name):\n\
    \n```\n$ sudo dd if=/path/to/pkt_project_chapter12/tmp/deploy/images/raspberrypi2/pkt-iot-image-raspberrypi2.rpi-sdimg\
    \ of=/dev/sdX bs=1M\n```\n\nNext, insert the SD card into the Raspberry Pi and\
    \ power it on. The image doesn't contain any big changes from rpi-basic-image;\
    \ still, we can easily see that we are running the correct image. As you might\
    \ remember, we added a post function in the image recipe, which added a release\
    \ file. Let's check whether it exists and check the content (log in using root\
    \ and an empty password):\n\n```\nPoky (Yocto Project Reference Distro) 2.0+snapshot-20160229\
    \ raspberrypi2\n/dev/ttyAMA0\nraspberrypi2 login: root\nroot@raspberrypi2:~# ls\
    \ /etc/*release*\n```\n"
  mdcn: "\n\n## 项目所需材料\n\n项目需要以下材料：\n\n- 一块 Raspberry Pi（任意型号均可）\n\n  Raspberry Pi\
    \ Zero 要求您焊接 GPIO 引脚排，或将导线直接焊接到 GPIO 焊盘上\n\n- 跳线（需要三根）\n- 一个单通道 5V 继电器模块\n- 一盏灯（最好是您不介意剪开并切断其电缆的灯）\n\
    - 一个外部电源（最好是 12V）\n\n### 注意\n\n警告：本项目需要具备基本的电路知识。如果您没有相关知识或经验，我们强烈建议不要使用高压电源。\n\
    \n## 为项目搭建基础\n\n首先，我们应该为 Yocto Project 实现搭建基础。本节中使用的大部分技术在本书前面已有介绍，因此不再详细说明。在本章的这一部分中，我们将执行\
    \ Yocto Project 实现的基本设置，该设置将用于家庭自动化项目。\n\n## 创建新图层\n\n我们将先创建一个新图层。新图层将作为我们家庭自动化项目的基础。目前，它只包含我们的镜像配方，但我们将在整个章节中向图层添加更多内容，直到拥有服务器所需的所有部分。如第\
    \ 7 章《在 Raspberry Pi 上部署自定义图层》中所述，我们将使用 yocto-layer 来帮助设置图层结构。我们需要设置高优先级，以确保该图层中的内容优先于（例如）meta-raspberrypi\
    \ 中的内容，如下所示：\n\n```\n$ /path/to/poky/scripts/yocto-layer create pkt-iot\nPlease\
    \ enter the layer priority you'd like to use for the layer: [default: 6] 10\n\
    Would you like to have an example recipe created? (y/n) [default: n]\nWould you\
    \ like to have an example bbappend file created? (y/n) [default: n]\nNew layer\
    \ created in meta-pkt-iot.\nDon't forget to add it to your BBLAYERS (for details\
    \ see meta-pkt-iot/README).\n```\n\n## 自定义镜像配方\n\n在本小节中，我们将改进自定义镜像配方的用法，这是我们在第\
    \ 7 章《在 Raspberry Pi 上部署自定义图层》中学到的内容。\n\n首先创建您的镜像配方文件：\n\n```\n$ cd meta-pkt-iot\n\
    $ mkdir -p recipes-core/images/\n$ touch recipes-core/images/pkt-iot-image.bb\n\
    ```\n\n接下来，我们将设置镜像的基本内容；请查看以下代码片段。在整个章节中，此镜像配方将不断扩展，直到我们最终获得符合我们目的的完整镜像。该镜像将基于\
    \ rpi-basic-image。\n\n```\n$ cat recipes-core/images/pkt-iot-image.bb\n# Base\
    \ this image on rpi-basic-image\ninclude recipes-core/images/rpi-basic-image.bb\n\
    SPLASH = \"psplash-raspberrypi\"\nIMAGE_FEATURES += \"ssh-server-dropbear splash\"\
    \nIMAGE_INSTALL_append = \" rpi-gpio\"\n```\n\n使用镜像配方时，存在名为 ROOTFS_PREPROCESS_COMMAND\
    \ 和 ROOTFS_POSTPROCESS_COMMAND 的两个命令。它们可以作为最后手段，例如用于添加、删除或修改根文件系统中的内容。这两种方法可以在创建根文件系统之前（使用\
    \ PREPROCESS 变体）或在根文件系统创建之后（使用 POSTPROCESS 方法）使用。使用方法是向变量指定一个函数列表。这些函数可以使用 ${IMAGE_ROOTFS}\
    \ 以通用方式找到文件系统的路径。对于本项目，我们将使用此方法向 ROOTFS_POSTPROCESS_COMMAND 添加一个函数，以便为我们的镜像创建一个发布文件。将以下内容添加到\
    \ pkt-iot-image.bb 的末尾：\n\n```\nROOTFS_POSTPROCESS_COMMAND += \" create_release_file\
    \ ; \"\ncreate_release_file() {\nIMAGE_REL_FILE=\"${IMAGE_ROOTFS}${sysconfdir}/pkt-iot-release\"\
    \n    echo \"pkt-iot release version 1.0\" > ${IMAGE_REL_FILE}\n    echo \"Image:\
    \ ${IMAGE_NAME}\" >> ${IMAGE_REL_FILE}\n    echo \"Build date: ${DATETIME}\" >>\
    \ ${IMAGE_REL_FILE}\n    chmod 0444 ${IMAGE_REL_FILE}\n}\n```\n\n请仔细注意 create_release_file\
    \ 部分中 ROOTFS_POSTPROCESS_COMMAND 声明里的空白字符。\n\n## 构建和启动镜像\n\n我们现在有了一个包含基本镜像配方的新外部图层。到目前为止，我们尚未对图层进行任何测试。在开发过程中，定期测试您的更改始终是个好主意。我们将对我们的图层进行早期测试。为此，我们将创建一个新项目，在\
    \ local.conf 中设置一些强制性和推荐的配置，并将外部图层添加到 bblayers.conf。这个项目将在整个章节中使用。\n\n```\n$ source\
    \ /path/to/poky/oe-init-build-env pkt_project_chapter12\n```\n\n将 meta-raspberrypi\
    \ 和 meta-oe 外部图层，连同我们新的 meta-pkt-iot 图层，添加到 bblayers.conf：\n\n```\nBBLAYERS ?=\
    \ \" \\\n/path/to/poky/meta \\\n/path/to/poky/meta-poky \\\n/path/to/poky/meta-yocto-bsp\
    \ \\\n/path/to/meta-raspberrypi \\\n/path/to/meta-openembedded/meta-oe \\\n/path/to/meta-pkt-iot\
    \ \\\n\"\n```\n\n决定使用哪台机器并将其添加到 local.conf。在本示例中，我们将使用 raspberrypi2：\n\n```\n\
    $ echo \"MACHINE = \\\"raspberrypi2\\\"\" >> conf/local.conf\n```\n\n接下来，我们将在项目中启用本地包修订（PR）服务器。如果检测到更改，PR\
    \ 服务器会自动增加包的 PR 版本号。这将无需最终用户手动更新配方文件中的 PR 编号。在开发新配方时，此功能非常实用：\n\n```\n$ echo \"\
    PRSERV_HOST = \\\"localhost:0\\\"\" >> conf/local.conf\n```\n\nBitBake 项目可能会占用大量磁盘空间。存在多种方法，可用于减少项目占用的磁盘空间总量及其总体构建时间。\n\
    \n第一种方法是使用 rm_work。此功能将确保 BitBake 对已构建的包进行完全清理。默认情况下，所有已构建的包都会将源代码和工件保存在项目 ./tmp/work\
    \ 下的包特定位置中。当为项目继承以下类时，这些内容将被擦除：\n\n```\n$ echo \"INHERIT += \\\"rm_work\\\"\"\
    \ >> conf/local.conf\n```\n\n但是，排除开发期间频繁使用的包可能是个好主意，特别是如果解包它们需要很长时间。要实现此目的，可以使用\
    \ RM_WORK_EXCLUDE。\n\n项目的构建时间通常相当长，尤其是第一次，因为 BitBake 需要从头开始获取所有源代码并构建包。但在第一次构建完成后，您可以使用多种方法加速后续构建。这些方法也可用于设置类似的其他\
    \ Yocto 项目，以减少构建时间和所需磁盘空间。\n\n第一种方法是使用共享状态（sstate）。默认情况下，sstate 缓存位于项目内。但是，通过在\
    \ local.conf 中使用 SSTATE_DIR 变量，共享状态可以位于项目外部，并被其他项目使用。下一种方法也如此，即指定 BitBake 在构建期间获取的所有包的下载位置。同样可以通过\
    \ local.conf 中的 DL_DIR 变量进行配置。在本示例中，我们不会在项目外部使用共享状态或下载目录。原因是，在使用本地 PR 服务器时不推荐这样做。\n\
    \n此时，您的 local.conf 文件应该类似于这样：\n\n```\n$ tail conf/local.conf\nPACKAGECONFIG_append_pn-nativesdk-qemu\
    \ = \" sdl\"\n#ASSUME_PROVIDED += \"libsdl-native\"\n# CONF_VERSION is increased\
    \ each time build/conf/ changes incompatibly and is used to\n# track the version\
    \ of this file when it was generated. This can safely be ignored if\n# this doesn't\
    \ mean anything to you.\nCONF_VERSION = \"1\"\nMACHINE = \"raspberrypi2\"\nPRSERV_HOST\
    \ = \"localhost:0\"\nINHERIT += \"rm_work\"\n```\n\n当项目的初始配置就绪后，我们可以构建本章早先创建的镜像：\n\
    \n```\n$ bitbake pkt-iot-image\nParsing recipes: 100%\n###############################################################################\n\
    ###############################################################################|\
    \ Time: 00:00:31\nParsing of 895 .bb files complete (0 cached, 895 parsed). 1325\
    \ targets, 68 skipped,\n0 masked, 0 errors.\nNOTE: Resolving any missing task\
    \ queue dependencies\n```\n\n让我们在目标设备上试用我们的新镜像。此时，镜像的行为应与普通 rpi-basic-image 镜像类似。不仅要构建我们的更改，还要在目标设备上测试它们，以确保万无一失。使用第\
    \ 2 章《为 Raspberry Pi 构建我们的第一个 Poky 镜像》中描述的方法将镜像复制到 SD 卡（请记住将 /dev/sdX 改为正确的设备名称）：\n\
    \n```\n$ sudo dd if=/path/to/pkt_project_chapter12/tmp/deploy/images/raspberrypi2/pkt-iot-image-raspberrypi2.rpi-sdimg\
    \ of=/dev/sdX bs=1M\n```\n\n接下来，将 SD 卡插入 Raspberry Pi 并通电。该镜像与 rpi-basic-image\
    \ 没有重大变化；不过，我们仍然可以轻松看到我们运行的是正确的镜像。如您所记得，我们在镜像配方中添加了一个后处理函数，用于添加一个发布文件。让我们检查它是否存在并查看其内容（使用\
    \ root 登录，密码为空）：\n\n```\nPoky (Yocto Project Reference Distro) 2.0+snapshot-20160229\
    \ raspberrypi2\n/dev/ttyAMA0\nraspberrypi2 login: root\nroot@raspberrypi2:~# ls\
    \ /etc/*release*\n```\n\n"
