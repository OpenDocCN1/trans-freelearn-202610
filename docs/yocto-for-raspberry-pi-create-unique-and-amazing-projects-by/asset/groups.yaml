    and GPIO, which are used by PiTFT displays, and will ensure that the display is
    registered and noticed by the kernel. Besides these options, basic setup of SPI
    and i2c is required to get everything up and running.


    In this book, we will assume the usage of a kernel version with device tree support
    for Raspberry Pi (kernel 3.18+). This means that we need to modify config.txt
    to make sure that required parts are automatically loaded using device trees,
    like this:


    ```

    dtparam=spi=on

    dtparam=i2c1=on

    dtparam=i2c_arm=on

