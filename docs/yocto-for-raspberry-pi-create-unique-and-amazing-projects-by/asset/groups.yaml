    +++ b/recipes-kernel/linux/linux-raspberrypi_4.1.bb\n@@ -1,6 +1,8 @@\nLINUX_VERSION\
    \ ?= \"4.1.10\"\n\nSRCREV = \"b74df9228c27f55361c065bc5dbfba88861cc771\"\n-SRC_URI\
    \ = \"git://github.com/raspberrypi/linux.git;protocol=git;branch=rpi-4.1.y\"\n\
    +SRC_URI = \"git://github.com/raspberrypi/linux.git;protocol=git;branch=rpi-4.1.y\
    \ \\\n+    file://0001-bcmrpi_defconfig-add-debug.patch \\\n+    \"\n```\n```\n\
    \nAnother option is to use the kernel_configure_variable function from linux.inc\
    \ in meta-raspberrypi and then prepend the configuration of the kernel recipe\
    \ using this function:\n\n```\n```\ndiff --git a/recipes-kernel/linux/linux.inc\
    \ b/recipes-kernel/linux/linux.inc\nindex fae78b7..12eec7e 100644\n--- a/recipes-kernel/linux/linux.inc\n\
    +++ b/recipes-kernel/linux/linux.inc\n@@ -107,6 +107,8 @@ do_configure_prepend()\
    \ {\n        # Activate CONFIG_LEGACY_PTYS\n        kernel_configure_variable\
    \ LEGACY_PTYS y\n\n+       kernel_configure_variable TOUCHSCREEN_STMPE y\n+\n\
    \        # Keep this the last line\n        # Remove all modified configs and\
