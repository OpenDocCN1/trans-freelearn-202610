    \ = \"arm-poky-linux-gnueabi\"\nMACHINE = \"raspberrypi\"\nDISTRO = \"poky\"\n\
    DISTRO_VERSION = \"1.8+snapshot-20150804\"\nTUNE_FEATURES = \"arm armv6 vfp arm1176jzfs\
    \ callconvention-hard\"\nTARGET_FPU = \"vfp\"\nmeta\nmeta-yocto\nmeta-yocto-bsp\
    \ = \"master:19f77cf586fbee9e67d3698263402b717303c5ec\"\nmeta-raspberrypi = \"\
    master:7457bf182c8fd550ec877ecd786a3edd16e65495\"\nmeta-packt_rpi = \"master:19f77cf586fbee9e67d3698263402b717303c5ec\"\
    \nmeta-oe\nmeta-multimedia = \"master:f637fadb106a09a6f3dfba4181d06dc9b5e82ff5\"\
    \nNOTE: Preparing RunQueue\nNOTE: Executing SetScene Tasks\nNOTE: Executing RunQueue\
    \ Tasks\nCurrently 1 running tasks (558 of 566):\n0: v4l-utils-1.6.2-r0 do_configure\
    \ (pid 20717)\n```\n\n进程完成后，即可使用 v4l-utils。\n\n### 注意\n\n如果你想了解 v4l-utils 的更多信息，可以访问\
    \ http://www.linux-projects.org/modules/sections/index.php?op=viewarticle&artid=16\
    \ 。\n\n## 总结\n\n在本章中，我们学习了如何集成一个包来测试树莓派的 SPI 接口。我们还学习了如何创建 Wii Nunchuck 应用程序，并将其部署到\
    \ Yocto Project 中。\n\n在下一章中，我们将了解如何将媒体中心与树莓派集成。\n\n## 第 9 章 在树莓派上构建媒体中心\n\n在本章中，我们将学习如何部署自定义应用程序，以构建嵌入式媒体中心（面板控制温度、ADC、串行等）。\n\
    \n我们将使用 rpm 包、init 脚本、配方和 Web 开发等方面的内容。\n\n### 项目描述 – CPU 温度监控\n\n此项目的想法是创建一个\
    \ Web 界面，允许例如监控 CPU 温度。\n\n为此，我们将使用 **HTML5** 和 **nodejs** 等技术。我们还将拥有树莓派上可用的实用工具，例如\
    \ **vcgencmd**。\n\n在此项目中，我们将使用诸如以下的技术方面：\n\n- Websocket\n- Justgage\n- Nodejs\n\
    \n这里的想法不是解释这些技术，而是了解它们可以在 Yocto Project 中使用。\n\n### 概述\n\n以下图表表示项目的结构：\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_167_0.png)\n\
    \n### 硬件/软件要求\n\n此项目需要以下硬件和软件：\n\n- 一台树莓派\n- 一台宿主 PC\n- 一张 SD 卡\n- SSH/SCP\n\n\
    ### 创建主应用程序\n\n主项目包含多个文件。为了更好地展示，我们将只专注于两个文件：\n\n- server.js：这是将创建我们的 Web 服务器并将数据发送到\
    \ HTML 网页的文件\n- index.html：这是将在 Web 浏览器中打开以显示接收到的数据的页面\n\n### server.js\n\nserver.js\
    \ 文件在监听端口 3344 上创建一个服务器，并将负责创建一个包含树莓派 CPU 温度的套接字（rpi_temperature）。套接字函数使用（包括）vcgencmd\
    \ 命令（[https://github.com/raspberrypi/firmware/blob/master/opt/vc/bin/vcgencmd](https://github.com/raspberrypi/firmware/blob/master/opt/vc/bin/vcgencmd)），允许我们监控\
    \ CPU 温度，如下所示：\n\n```\nsetInterval(function()\n{\n    child = exec(\"vcgencmd\
    \ measure_temp | awk -F:\", function\n    (error, stdout,\n    stderr)\n    {\n\
    \    if (error != null)\n    {\n    console.log('exec error: ' + error);\n   \
    \ }\n    else\n    {\n    var date = new Date().getTime();\n    var temp = parseFloat(stdout);\n\
    \    socket.emit('rpi_temperature', date, temp);\n    }\n    }\n    }); 1000);\n\
    ```\n\n### 注意\n\n有关 vcgencmd 的更多信息，可以访问以下页面：[http://elinux.org/RPI_vcgencmd_usage](http://elinux.org/RPI_vcgencmd_usage)\n\
    \n### index.html\n\n以下是接收包含我们树莓派 CPU 温度的套接字（rpi_temperature）的函数示例：\n\n```\n$(document).ready(function(){\n\
    \    socket.on('rpi_temperature', function (time, data) {\n        gg1.refresh($.trim(data));\n\
    \        return false;\n    });\n});\n```\n\n### 创建 Yocto/OE 环境\n\n现在我们已经开发了主应用程序，剩下的就是将其与我们的\
    \ Yocto RPI 环境集成。\n\n### 修改镜像\n\n第一步是将 nodejs 包（位于 meta-openembedded/meta-oe/recipes-devtools/nodejs）与树莓派环境集成。为此，我们必须将以下行添加到\
    \ raspberry-packt-image：\n\n```\n# Base this image on core-image-minimal\ninclude\
    \ recipes-core/images/core-image-minimal.bb\nDESCRIPTION = \"Image for raspberry-pi\"\
    \nIMAGE_FEATURES += \"ssh-server-dropbear splash\"\n# Include modules in rootfs\n\
    IMAGE_INSTALL += \" \\\\\n kernel-modules \\\\\n gpio-packt \\\\\n i2c-tools \\\
    \\\n spitools \\\\\n nunchuck \\\\\n v4l-utils \\\\\n nodejs \\\\\n\"\n\n```\n\
    \n我们现在已将 nodejs 与我们的 Poky 发行版集成。\n\n### 创建配方文件\n\n第二步是创建配方文件；让我们将此配方命名为 webserver-packt_01.bb。\n\
    \n其想法是在 recipes-custom 文件夹内具有以下架构：\n\n```\n$ tree webserver-packt/\nwebserver-packt/\n\
    ├── webserver-packt\n│   └── server.tar.gz\n└── webserver-packt_01.bb\n```\n\n\
    ### 注意\n\nserver.tar.gz 压缩包包含主应用程序（nodejs + HTML5）。\n\n要创建此配方，我们将使用 recipetool\
    \ 命令，如下所示：\n\n```\n$ source oe-init-build-env rpi-build\n$ recipetool create -d\
    \ -o webserver-packt_0.1.bb ../meta-packt_rpi/recipes-custom/webserver-packt/webserver-packt/\n\
    $ cp webserver-packt_0.1.bb ../meta-packt_rpi/recipes-custom/webserver-packt/\n\
    ```\n\n### 注意\n\nrecipetool 命令的完整文档在线位于 http://www.yoctoproject.org/docs/1.8/mega-manual/mega-manual.html#new-recipe-creating-the-base-recipe-using-recipetool\
    \ 。\n\n现在我们只需将包含源代码的完整存档（server.tar.gz）复制到 ${datadir}（/usr/share/）；此步骤在 do_install()\
    \ 块中执行，如下所示：\n\n```\nDESCRIPTION = \"Panel to monitor rpi temperature\"\nLICENSE\
    \ = \"GPLv2\"\nLIC_FILES_CHKSUM =\n\"file://${COREBASE}/meta/COPYING.GPLv2;md5=751419260aa954499f7abaabaa882bbe\"\
    \n\n# Package Release\nPR = \"r0\"\n\n# Use local tarball\nSRC_URI = \" \\\\\n\
    file://server.tar.gz \\\\\n\"\n\nRDEPENDS_${PN} += \"bash\"\n\n# Make sure our\
    \ source directory (for the build) matches the directory structure in\nthe tarball\n\
    S = \"${WORKDIR}\"\n\ndo_install() {\ninstall -d ${D}${datadir}/server-packt\n\
    ```\n"
