  md: "\ncp -a ${S}/server ${D}${datadir}/server-packet\n}\n\n# Package files\nFILES_${PN}\
    \ += \"${datadir}/server-packet\"\n\n## Explanation\n\nLet's take a look at what\
    \ the variables do:\n\n- The RDEPENDS_{PN} variable lists a package's runtime\
    \ dependencies that must be installed in order for the built package to run correctly.\
    \ In our case, bash is necessary for nodejs.\n- The FILES_{PN} variable contains\
    \ the list of directories or files that are placed in the packages. In our case,\
    \ server-packet is necessary.\n\nWe now have an environment ready to be used.\
    \ If we want to deploy the application on our Raspberry Pi, we can do so with\
    \ the following commands.\n\nThe host commands are as follows:\n\n```\n$ bitbake\
    \ webserver-packet\n$ scp tmp/deploy/rpm/arm1176jzfshf_vfp/webserver-packet-0.1-r0.arm1176jzfshf_vfp.rpm\
    \ root@ip_address_of_rpi:/home/\n```\n\nThese are the Raspberry Pi commands:\n\
    \n```\n$ rpm -ivh webserver-packet-0.1-r0.arm1176jzfshf_vfp.rpm\n$ rm webserver-packet-0.1-r0.arm1176jzfshf_vfp.rpm\n\
    $ node /usr/share/server-packet/server/server.js\n```\n\n## Autostarting - the\
    \ init file\n\nIf we want to have a standalone application, it would be interesting\
    \ if our application can start during the boot sequence of our Raspberry Pi. For\
    \ this, we will use an init script, inheriting directly from System V.\n\nThe\
    \ first step is to create a .init file within our structure. We will call this\
    \ file server.init. The tree will look like this:\n\n```\n$ tree webserver-packt/\n\
    webserver-packt/\n├── webserver-packt\n│   ├── server.init\n│   └── server.tar.gz\n\
    └── webserver-packt_0.1.bb\n```\n\nSo, the script will start the application automatically\
    \ after the installation and every time the Raspberry Pi starts up. Here is the\
    \ init script from System V:\n\n```bash\n#!/bin/bash\n### BEGIN INIT INFO\n# Provides:\
    \          server.init\n# Required-Start:    $remote_fs $syslog\n# Required-Stop:\
    \     $remote_fs $syslog\n# Default-Start:     2 3 4 5\n# Default-Stop:      0\
    \ 1 6\n# Short-Description: Start daemon at boot time\n# Description:       Enable\
    \ service provided by daemon.\n### END INIT INFO\nDAEMON=node\nNAME=server.init\n\
    DESC=\"Nodejs app\"\nARGS=\"/usr/share/server-packt/server/server.js\"\nset -e\n\
    usage()\n{\n    echo \"---------------------------------------\"\n    echo \"\
    Usage: $0 (stop|start|restart)\"\n    echo \"---------------------------------------\"\
    \n}\nservice_start()\n{\n    echo -n \"starting $DESC: $NAME... \"\n    start-stop-daemon\
    \ -S -x $DAEMON -- $ARGS &\n    echo \"done.\"\n}\necho \"\"\n\nservice_stop()\n\
    {\n    echo -n \"stopping $DESC: $NAME... \"\n    start-stop-daemon -K -x $DAEMON\n\
    \    echo \"done.\"\n}\n\ncase $1 in\n    stop)\n        service_stop\n      \
    \  echo \"\"\n        ;;\n    start)\n        service_start\n        echo \"\"\
    \n        ;;\n    restart)\n        service_stop\n        service_start\n    \
    \    echo \"\"\n        ;;\n    *)\n        usage\n        ;;\nesac\nexit 0\n\
    ```\n\n## Explanation\n\nLet's look at how the code works:\n\n- The DAEMON variable\
    \ specifies the binary to launch (/usr/bin/node)\n- The NAME variable specifies\
    \ the script name\n- The DESC variable contains some information about DAEMON\
    \ (node)\n- The ARGS variable contains the arguments to pass to DAEMON (node)\n\
    \nIf you want to test this script on the Raspberry Pi, use these commands:\n\n\
    ```\n$ scp server.init root@ip_address_of_rpi:/etc/init.d\n$ cd /etc/init.d\n\
    $ update-rc.d server.init defaults\n```\n\nThis command stops the application:\n\
    \n```\n/etc/init.d/server.init stop\n```\n\nThis one restarts it:\n\n```\n/etc/init.d/server.init\
    \ restart\n```\n\n## Autostarting - the recipe file\n\nThe inclusion of our init\
    \ file in our webserver-packt.bb recipe consists of:\n\n- Adding the server.init\
    \ file to SRC_URI.\n- Adding do_install() to the step for our init script.\n-\
    \ Including update-rc.d. Adding this to Yocto is done by adding inherit update-rc.d\
    \ to our recipe.\n\nHere is webserver-packt.bb after being updated:\n\n```\nDESCRIPTION\
    \ = \"Panel to monitor rpi temperature\"\nLICENSE = \"GPLv2\"\nLIC_FILES_CHKSUM\
    \ =\n\"file://${COREBASE}/meta/COPYING.GPLv2;md5=751419260aa954499f7abaabaa882bbe\"\
    \n\n# Package Release\nPR = \"r0\"\n\n# Use local tarball\nSRC_URI = \" \\\\\n\
    \ file://server.tar.gz \\\\\n file://server.init \\\\\n \"\n\nRDEPENDS_${PN} +=\
    \ \"bash\"\n\n# Make sure our source directory (for the build) matches the directory\
    \ structure in\nthe tarball\nS = \"${WORKDIR}\"\n\ndo_install() {\n   install\
    \ -d ${D}${datadir}/server-packt\n   cp -a ${S}/server ${D}${datadir}/server-packt\n\
    \n   install -d ${D}${sysconfdir}/init.d/\n   install -m 0755 ${WORKDIR}/server.init\
    \ ${D}${sysconfdir}/init.d/server-packt-init\n}\n\n# Package files\nFILES_${PN}\
    \ += \"${datadir}/server-packt\"\n\ninherit update-rc.d\n\nINITSCRIPT_NAME = \"\
    server-packt-init\"\nINITSCRIPT_PARAMS = \"start 99 5 2 . stop 19 0 1 6 .\"\n\
    ```\n\n## Explanation\n\nHere is an explanation of our updated webserver-packet.bb\
    \ file:\n\n- The `INITSCRIPT_NAME` variable represents the filename of the initialization\
    \ script, as installed to `/etc/init.d`.\n- The `INITSCRIPT_PARAMS` variable specifies\
    \ the options to pass to `update-rc.d`. In our case, the script has a runlevel\
    \ of 99, is started at init levels 2 and 5, and is stopped at levels 0, 1, and\
    \ 6.\n\n## Note\n\nIf you want more information about update-rc.d, you can visit\
    \ the official documentation of the Yocto Project: http://www.yoctoproject.org/docs/1.8/mega-manual/mega-manual.html#ref-classes-update-rc.d\n\
    \n## Deploying raspberry-pckt-image\n\nNow that we have a functional application\
    \ (webserver-pckt), we can add it to our custom image, raspberry-pack-image:\n\
    \n```\n# Base this image on core-image-minimal\ninclude recipes-core/images/core-image-minimal.bb\n\
    DESCRIPTION = \"Image for raspberry-pi\"\nIMAGE_FEATURES += \"ssh-server-dropbear\
    \ splash\"\n# Include modules in rootfs\nIMAGE_INSTALL += \" \\\\\n kernel-modules\
    \ \\\\\n gpio-pckt \\\\\n i2c-tools \\\\\n spitools \\\\\n nunchuck \\\\\n v4l-utils\
    \ \\\\\n nodejs \\\\\n webserver-pckt \\\\\n\"\n```\n\nAfter doing this, we can\
    \ start creating our image and then mount it on an SD card:\n\n```\n$ bitbake\
    \ raspberry-pckt-image\n```\n\n## Testing the application\n\nIn order to test\
    \ the application on the Raspberry Pi, you have just to go to the following address\
    \ from your favorite browser:\n\nhttp://raspberry-pi-ip-address:3344\n\nIf the\
    \ whole environment has been properly configured, you should see the following\
    \ page:\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_181_0.png)\n\n## The future\
    \ of this project\n\nWe looked at the basic idea of a server, and you should be\
    \ able to improve it in order to make it as industrial as possible. One can easily\
    \ imagine the following applications:\n\n- Monitoring the ADCs, present on a motherboard\n\
    - Sending serial commands to a device via an HTML page (node-serial)\n- Monitor\
    \ a CAN-bus devices ( https://github.com/sebi2k1/node-can )\n\nThe final project\
    \ might look something like this:\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_182_0.png)\n\
    \n## Summary\n\nIn this chapter, we learned how to create a web interface, how\
    \ to integrate it within an existing environment, and how to deploy it on the\
    \ Raspberry Pi.\n\nIn the next chapter we will learn some basics about the Linux\
    \ kernel and how to configure the kernel to support various LCD touchscreens.\
    \ Further on the chapter explains how to setup a Yocto project to run graphical\
    \ applications or a window system, on a Raspberry Pi using a LCD touchscreen.\n\
    \n## Chapter 10. Playing with an LCD Touchscreen and the Linux Kernel\n\nWhen\
    \ setting up an LCD touchscreen using an embedded Linux system, it’s recommended\
    \ to have basic knowledge of the Linux kernel and how to configure it. In this\
    \ chapter, we will learn some basics about the Linux kernel and how to download,\
    \ configure, and compile it using a cross compiler. The current recommendation\
    \ when running a Linux-based system on the Raspberry Pi is to use the Raspberry\
    \ Pi Linux kernel instead of the mainline Linux kernel; we will learn why in this\
    \ chapter.\n\nLater in the chapter, we will go through how to boot an image based\
    \ on the Yocto Project with a windowing system using a Raspberry Pi 7 touchscreen\
    \ and a PiTFT 2.8 touchscreen. The chapter will end with a walkthrough of how\
    \ to use the Qt application framework to develop graphical applications for the\
    \ Raspberry Pi that are possible to play using a touchscreen.\n"
  mdcn: "\n\ncp -a ${S}/server ${D}${datadir}/server-packet\n}\n\n# 包文件\nFILES_${PN}\
    \ += \"${datadir}/server-packet\"\n\n## 说明\n\n让我们来看看这些变量的作用：\n\n- RDEPENDS_{PN}\
    \ 变量列出了构建包正常运行所需的运行时依赖项，这些依赖项必须安装。在我们的例子中，bash 对 nodejs 是必需的。\n- FILES_{PN} 变量包含放置到包中的目录或文件列表。在我们的例子中，server-packet\
    \ 是必需的。\n\n我们现在已准备好可用的环境。如果我们要将应用程序部署到 Raspberry Pi 上，可以使用以下命令。\n\n主机命令如下：\n\n\
    ```\n$ bitbake webserver-packet\n$ scp tmp/deploy/rpm/arm1176jzfshf_vfp/webserver-packet-0.1-r0.arm1176jzfshf_vfp.rpm\
    \ root@ip_address_of_rpi:/home/\n```\n\n以下是 Raspberry Pi 命令：\n\n```\n$ rpm -ivh\
    \ webserver-packet-0.1-r0.arm1176jzfshf_vfp.rpm\n$ rm webserver-packet-0.1-r0.arm1176jzfshf_vfp.rpm\n\
    $ node /usr/share/server-packet/server/server.js\n```\n\n## 自动启动 - init 文件\n\n\
    如果我们想要一个独立的应用程序，那么在 Raspberry Pi 启动序列期间自动启动我们的应用程序将很有趣。为此，我们将使用直接继承自 System V\
    \ 的 init 脚本。\n\n第一步是在我们的结构中创建一个 .init 文件。我们将此文件命名为 server.init。目录结构如下：\n\n```\n\
    $ tree webserver-packt/\nwebserver-packt/\n├── webserver-packt\n│   ├── server.init\n\
    │   └── server.tar.gz\n└── webserver-packt_0.1.bb\n```\n\n因此，该脚本将在安装后以及每次 Raspberry\
    \ Pi 启动时自动启动应用程序。以下是来自 System V 的 init 脚本：\n\n```bash\n#!/bin/bash\n### BEGIN\
    \ INIT INFO\n# Provides:          server.init\n# Required-Start:    $remote_fs\
    \ $syslog\n# Required-Stop:     $remote_fs $syslog\n# Default-Start:     2 3 4\
    \ 5\n# Default-Stop:      0 1 6\n# Short-Description: Start daemon at boot time\n\
    # Description:       Enable service provided by daemon.\n### END INIT INFO\nDAEMON=node\n\
    NAME=server.init\nDESC=\"Nodejs app\"\nARGS=\"/usr/share/server-packt/server/server.js\"\
    \nset -e\nusage()\n{\n    echo \"---------------------------------------\"\n \
    \   echo \"Usage: $0 (stop|start|restart)\"\n    echo \"---------------------------------------\"\
    \n}\nservice_start()\n{\n    echo -n \"starting $DESC: $NAME... \"\n    start-stop-daemon\
    \ -S -x $DAEMON -- $ARGS &\n    echo \"done.\"\n}\necho \"\"\n\nservice_stop()\n\
    {\n    echo -n \"stopping $DESC: $NAME... \"\n    start-stop-daemon -K -x $DAEMON\n\
    \    echo \"done.\"\n}\n\ncase $1 in\n    stop)\n        service_stop\n      \
    \  echo \"\"\n        ;;\n    start)\n        service_start\n        echo \"\"\
    \n        ;;\n    restart)\n        service_stop\n        service_start\n    \
    \    echo \"\"\n        ;;\n    *)\n        usage\n        ;;\nesac\nexit 0\n\
    ```\n\n## 说明\n\n让我们来看看代码的工作原理：\n\n- DAEMON 变量指定要启动的二进制文件 (/usr/bin/node)\n- NAME\
    \ 变量指定脚本名称\n- DESC 变量包含关于 DAEMON (node) 的一些信息\n- ARGS 变量包含要传递给 DAEMON (node) 的参数\n\
    \n如果要在 Raspberry Pi 上测试此脚本，请使用以下命令：\n\n```\n$ scp server.init root@ip_address_of_rpi:/etc/init.d\n\
    $ cd /etc/init.d\n$ update-rc.d server.init defaults\n```\n\n此命令停止应用程序：\n\n```\n\
    /etc/init.d/server.init stop\n```\n\n此命令重启应用程序：\n\n```\n/etc/init.d/server.init\
    \ restart\n```\n\n## 自动启动 - 配方文件\n\n将我们的 init 文件添加到 webserver-packt.bb 配方中包括：\n\
    \n- 将 server.init 文件添加到 SRC_URI。\n- 为我们的 init 脚本添加 do_install() 步骤。\n- 包含 update-rc.d。在\
    \ Yocto 中添加此功能，需要在配方中添加 inherit update-rc.d。\n\n以下是更新后的 webserver-packt.bb：\n\n\
    ```\nDESCRIPTION = \"Panel to monitor rpi temperature\"\nLICENSE = \"GPLv2\"\n\
    LIC_FILES_CHKSUM =\n\"file://${COREBASE}/meta/COPYING.GPLv2;md5=751419260aa954499f7abaabaa882bbe\"\
    \n\n# Package Release\nPR = \"r0\"\n\n# Use local tarball\nSRC_URI = \" \\\\\n\
    \ file://server.tar.gz \\\\\n file://server.init \\\\\n \"\n\nRDEPENDS_${PN} +=\
    \ \"bash\"\n\n# Make sure our source directory (for the build) matches the directory\
    \ structure in\nthe tarball\nS = \"${WORKDIR}\"\n\ndo_install() {\n   install\
    \ -d ${D}${datadir}/server-packt\n   cp -a ${S}/server ${D}${datadir}/server-packt\n\
    \n   install -d ${D}${sysconfdir}/init.d/\n   install -m 0755 ${WORKDIR}/server.init\
    \ ${D}${sysconfdir}/init.d/server-packt-init\n}\n\n# Package files\nFILES_${PN}\
    \ += \"${datadir}/server-packt\"\n\ninherit update-rc.d\n\nINITSCRIPT_NAME = \"\
    server-packt-init\"\nINITSCRIPT_PARAMS = \"start 99 5 2 . stop 19 0 1 6 .\"\n\
    ```\n\n## 说明\n\n以下是对更新后的 webserver-packet.bb 文件的说明：\n\n- `INITSCRIPT_NAME` 变量表示初始化脚本的文件名，安装后位于\
    \ `/etc/init.d`。\n- `INITSCRIPT_PARAMS` 变量指定传递给 `update-rc.d` 的选项。在我们的例子中，脚本的运行级别为\
    \ 99，在 init 级别 2 和 5 启动，在级别 0、1 和 6 停止。\n\n## 注意\n\n如果要了解 update-rc.d 的更多信息，可以访问\
    \ Yocto Project 的官方文档：http://www.yoctoproject.org/docs/1.8/mega-manual/mega-manual.html#ref-classes-update-rc.d\n\
    \n## 部署 raspberry-pckt-image\n\n现在我们有了一个功能应用程序 (webserver-pckt)，可以将其添加到自定义镜像 raspberry-pack-image\
    \ 中：\n\n```\n# Base this image on core-image-minimal\ninclude recipes-core/images/core-image-minimal.bb\n\
    DESCRIPTION = \"Image for raspberry-pi\"\nIMAGE_FEATURES += \"ssh-server-dropbear\
    \ splash\"\n# Include modules in rootfs\nIMAGE_INSTALL += \" \\\\\n kernel-modules\
    \ \\\\\n gpio-pckt \\\\\n i2c-tools \\\\\n spitools \\\\\n nunchuck \\\\\n v4l-utils\
    \ \\\\\n nodejs \\\\\n webserver-pckt \\\\\n \"\n```\n\n做完之后，我们可以开始创建镜像，然后将其挂载到\
    \ SD 卡上：\n\n```\n$ bitbake raspberry-pckt-image\n```\n\n## 测试应用程序\n\n要在 Raspberry\
    \ Pi 上测试应用程序，只需在您喜欢的浏览器中访问以下地址：\n\nhttp://raspberry-pi-ip-address:3344\n\n如果整个环境已正确配置，您应该看到以下页面：\n\
    \n![](img/76681dcfb8cd2bd107d0c06ab088f916_181_0.png)\n\n## 本项目的未来\n\n我们探讨了服务器的基本思路，您应该能够对其进行改进，使其尽可能具备工业级水平。可以轻松想象以下应用：\n\
    \n- 监控主板上存在的 ADC\n- 通过 HTML 页面向设备发送串行命令 (node-serial)\n- 监控 CAN-bus 设备 ( https://github.com/sebi2k1/node-can\
    \ )\n\n最终项目可能类似于这样：\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_182_0.png)\n\n\
    ## 摘要\n\n在本章中，我们学习了如何创建 Web 界面、如何将其集成到现有环境中，以及如何将其部署到 Raspberry Pi 上。\n\n在下一章中，我们将学习\
    \ Linux 内核的一些基础知识，以及如何配置内核以支持各种 LCD 触摸屏。本章还将介绍如何设置 Yocto 项目，以在使用 LCD 触摸屏的 Raspberry\
    \ Pi 上运行图形应用程序或窗口系统。\n\n## 第 10 章。使用 LCD 触摸屏和 Linux 内核\n\n在使用嵌入式 Linux 系统设置 LCD\
    \ 触摸屏时，建议具备 Linux 内核及其配置的基础知识。在本章中，我们将学习 Linux 内核的一些基础知识，以及如何使用交叉编译器下载、配置和编译它。在\
    \ Raspberry Pi 上运行基于 Linux 的系统时，目前的建议是使用 Raspberry Pi Linux 内核而非主线 Linux 内核；我们将在本章中了解原因。\n\
    \n在本章后面，我们将了解如何使用 Raspberry Pi 7 触摸屏和 PiTFT 2.8 触摸屏，启动基于 Yocto Project 并带有窗口系统的镜像。本章将以使用\
    \ Qt 应用程序框架为 Raspberry Pi 开发可通过触摸屏操作的图形应用程序的演示结束。\n\n"
