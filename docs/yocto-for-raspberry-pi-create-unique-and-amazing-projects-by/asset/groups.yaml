    # The conf folder


    The conf folder should provide configuration (.conf) files. The layer.conf file
    inside this folder contains some important variables, for example, the variable
    concerning the priority

    (BBFILE_PRIORITY):


    ```

    # Define the priority for recipes (.bb files) from this layer,

    # choosing carefully how this layer interacts with all of the

    # other layers.

    BBFILE_PRIORITY_qt5-layer = "7"

    ```


    To verify the priority value, we can use the following command:


    ```

    $: bitbake-layers show-layers

    ```


