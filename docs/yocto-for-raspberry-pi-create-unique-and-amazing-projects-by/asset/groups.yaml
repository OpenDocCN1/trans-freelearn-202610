    \ and web server layers.\n\nAfter that, we will integrate an external layer to\
    \ our build and test it on the Raspberry Pi.\n\n### Introducing layers\n\nA layer\
    \ is just a collection of recipes and/or configuration that can be used on top\
    \ of Yocto/OE-Core.\n\nThe advantage of using an environment such as Yocto/OE\
    \ (the Poky reference system) comes from the fact that this project handles a\
    \ lot of metadata (definition files (.conf) of the machine (Raspberry Pi), classes,\
    \ and recipes (.bb)) that covers everything from simple applications (gpio-packt)\
    \ to graphics applications such as OpenGLES, EFL, or Qt.\n\nThe main motivation\
    \ of using layers is to organize the long list of providers better and still make\
    \ sure users may be able to pick only the required or desired provider. It is\
    \ also a way of providing customizable source code that can be used for any architecture\
    \ or modified in the way the user needs.\n\nThe other advantage is that we can\
    \ choose all the layers required for each project (from the most basic to the\
    \ most complex). We can modify them to be consistent with our architecture (ARM\
    \ for the Raspberry Pi), but a layer can be reused on another architecture (PowerPC),\
    \ and it is a big advantage in the industrial world (minimal effort is required\
    \ when changing the architecture).\n\nIn addition, instead of redeveloping layers,\
    \ always check whether the work has been done by others. It takes less time to\
    \ download a layer providing a package we need and to add an append file (.bbappend);\
    \ if some modifications are required, then you have to make them from scratch.\
    \ To summarize, layers are added when needed.\n\nYou can find the different available\
    \ layers at the following link:\n\nhttp://layers.openembedded.org/layerindex/branch/master/layers/\n\
    \n### The basic concepts of layers\n\nLet's dive into the basic concepts of layers:\n\
    \n### Theory\n\nA layer, in the technical sense of the term, has some properties.\
    \ They are as follows:\n\n- **Name**: This usually starts with the string meta-\
    \ (mandatory for better comprehension).\n- **Priority**: This is the value used\
    \ by BitBake to decide which recipe to use and the order in which the .bbappend\
    \ files should be joined. It means that if two layers include the same recipe\
    \ (.bb) file, the one with the higher priority is used.\n\n### Note\n\nFor example,\
    \ a layer with a priority value set to 6 has a higher chance of its recipe being\
    \ used than one with a priority value set to 5.\n\nFurthermore, each layer is\
    \ listed according to its functionality on this page:\n\nhttp://layers.openembedded.org/layerindex/branch/master/layers/\n\
    \n| meta-parallelia | Support for the Parallelia board from Adapteva | Machine\
    \ (BSP) | https://github.com/nathanrossi/meta-parallelia.git |\n| --- | --- |\
    \ --- | --- |\n| meta-picosam9 | Picosam9 board support | Machine (BSP) | https://gitorious.org/picopc-tools/meta-picosam9.git\
    \ |\n| meta-qemu-bsps | layer for other qemu machines | Machine (BSP) | https://github.com/akuster/meta-qemu-bsps\
    \ |\n| meta-raspberrypi | Raspberry Pi board support | Machine (BSP) | git://git.yoctoproject.org/meta-raspberrypi\
    \ |\n| meta-renesas-rza1 | Official BSP layer for Renesas RZ/A1 platforms | Machine\
    \ (BSP) | git://github.com/renesas-rz/meta-renesas-rza1 |\n| meta-rockchip | Rockchip\
    \ ARM hardware support | Machine (BSP) | git://github.com/linux-rockchip/meta-rockchip\
    \ |\n| meta-romley | Intel Romley platform BSP | Machine (BSP) | git://git.yoctoproject.org/meta-intel\
    \ |\n| meta-samsung | Samsung smartphone support | Machine (BSP) | https://github.com/shr-distribution/meta-smartphone.git\
    \ |\n| meta-sugarbay | Intel Sugar Bay platform BSP | Machine (BSP) | git://git.yoctoproject.org/meta-intel\
    \ |\n\n- **The software layer**: This layer provides software families that can\
    \ be used on any architecture (x86_64, ARM, PPC, MIPS, and so on). For example,\
    \ we have meta-java (for Java support), meta-efl (for the Enlightenment environment),\
    \ meta-qt5 (Qt support), meta-webserver (provides support for building web servers),\
    \ meta-browser, and so on.\n- **Miscellaneous**: If your layer doesn't fall into\
    \ any other category, you can choose this type; however, there shouldn't be too\
    \ many miscellaneous layers - it may be an indication that the purpose isn't well\
    \ defined or that you should consider splitting the layer.\n- **Machine (BSP)**:\
    \ These are layers specific to a machine (such as meta-raspberrypi, meta-fsl-arm,\
    \ and meta-ti). They contain machine configuration files and recipes to configure\
    \ packages for the machines.\n- **Distribution**: These are layers adding a distribution\
    \ to the environment (such as meta-ivi to add in-vehicle infotainment (IVI) support,\
    \ meta-angstrom, and so on).\n\nAt this stage, we know how the layers are distributed\
    \ within the Yocto Project. Now, we will see how these layers are composed.\n\n\
    ### The software layer\n\nFor this example, we will take as an example the meta-qt5\
    \ layer. This layer has a directory tree, as follows:\n\n```\npjtexier@amplitude:~\
    \ $ ls -l meta-qt5/\ntotal 28\ndrwxrwxr-x 2 pjtexier pjtexier 4096 avril 22 19:20\
    \ classes\ndrwxrwxr-x 3 pjtexier pjtexier 4096 avril 22 19:20 conf\n-rw-rw-r--\
    \ 1 pjtexier pjtexier 1035 avril 22 19:20 COPYING.MIT\ndrwxrwxr-x 2 pjtexier pjtexier\
    \ 4096 avril 22 19:20 licenses\n-rw-rw-r-- 1 pjtexier pjtexier 1189 avril 22 19:20\
    \ README\n-rwxrwxr-x 4 pjtexier pjtexier 4096 avril 22 19:20 recipes-devtools\n\
    drwxrwxr-x 10 pjtexier pjtexier 4096 avril 22 19:20 recipes-qt\n```\n\n### README\
    \ and COPYING\n\nInside this directory, there are two important files; they are\
    \ as follows:\n\n- **README**: This file specifies mostly the outer layers that\
    \ depend on the target layer, any configuration instructions, the address to send\
    \ patches to, and contact details of the maintainers.\n  - This layer depends\
    \ on the following:\n\n```\nURI: git://github.com/openembedded/oe-core.git\nbranch:\
    \ master\nrevision: HEAD\n```\n\n```\nURI: git://github.com/openembedded/meta-oe.git\n\
    layers: meta-ruby\nbranch: master\nrevision: HEAD\n```\n\nWhen building stuff\
    \ like qtdeclarative, qtquick, qtwebkit, make sure that you have required PACKAGECONFIG\
    \ options enabled in qtbase build, see qtbase.inc for detail. Send pull requests\
    \ to openembedded-devel@lists.openembedded.org with '[meta-qt5]' in the subject'\n\
    \nWhen sending single patches, please using something like: 'git send-email -M\
    \ -1 --to openembedded-devel@lists.openembedded.org --subject-prefix=meta-qt5][PATCH'\
    \ You are encouraged to fork the mirror on github to share your patches. This\
    \ is preferred for patch sets consisting of more than one patch. Other services\
    \ like gitorious, repo.or.cz or self hosted setups are of course accepted as well,\
    \ 'git fetch <remote>' works the same on all of them. We recommend github because\
    \ it is free, easy to use, has been proven to be reliable and has a really good\
    \ web GUI. https://github.com/meta-qt5/meta-qt5/\n\nMain layer maintainers:\n\
    Martin 'JaMa' Jansa <martin.jansa@gmail.com>\nOtavio Salvador <otavio@ossystems.com.br>\n\
    \n- **COPYING**: This file contains licensing information (MIT license in this\
    \ case).\n\n### The classes folder\n\nThe classes folder holds .bbclass files.\
    \ Here is a sample classes folder:\n"
