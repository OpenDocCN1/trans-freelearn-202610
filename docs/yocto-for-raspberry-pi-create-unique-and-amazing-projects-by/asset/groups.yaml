    ## Questions


    If you have a problem with any aspect of this book, you can contact us at questions@packtpub.com,
    and we will do our best to address the problem.


    ## Chapter 1. Meeting the Yocto Project


    In this chapter, we will discover the Yocto Project and its main principles. All
    the concepts used throughout the book will be introduced here. We will discuss
    the history of the Yocto Project, the build system, Poky, OpenEmbedded-Core, BitBake,
    metadata, and the Yocto Project workflow.


    ### The Yocto Project


    The Yocto Project is an umbrella project covering a fairly wide gamut of embedded
    Linux technologies. It is not a Linux distribution, as explained on the Yocto
    Project website:


    > "The Yocto Project is an open source collaboration project that provides templates,
    tools and methods to help you create custom Linux-based systems for embedded products
    regardless of the hardware architecture."


    Sponsored by the Linux Foundation, the Yocto Project is more than a build system.
    It provides tools, processes, templates and methods so that developers can rapidly
    create and deploy products for embedded devices (the Raspberry Pi, Beagleboard,
    Nitrogen6x, SAMA5D3, Olinuxino, and so on) or QEMU. The two main components that
    make up the Yocto Project are:


    - Poky: This is the build system (the reference distribution).

    - BitBake: This is the scheduler. It is a tool based on the Gentoo distribution.


    Around November 2010, the Linux Foundation announced that this entire work would
    continue under the banner of the Yocto Project as a project sponsored by the Linux
    Foundation (with Richard Purdie, Fellow of the Linux Foundation, as Architect).
    It was then established that the Yocto Project and OpenEmbedded would coordinate
    on a core set of package metadata called OE-Core, combining the best of both Poky
    and OpenEmbedded with an increased use of layering for additional components.


    ### Understanding the build system


    As mentioned before, we are in the world of build systems with the Yocto Project.
    A build system enables you to:


    - Compile or cross-compile applications

    - Package applications

    - Test output binaries and ecosystem compatibility

    - Deploy generated images


    To perform these steps, several tools exist. These are some of them:


    - Buildroot (http://buildroot.uclibc.org/)

    - LTIB (http://ltib.org/)

    - OpenWRT (https://openwrt.org/)

    - Yocto/OpenEmbedded (https://www.yoctoproject.org/)


    For example, Buildroot is a set of makefiles for automated generation in embedded
    systems. It supports compiling the bootloader (U-Boot, for example), kernel (zImage
    or bzImage), and basic controls through BusyBox and third-party applications.
    Buildroot works on various architectures, such as ARM, x86, and MIPS. For further
    information, refer to the full documentation in English at https://buildroot.org/docs.html.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_30_0.png)


    > "Buildroot is a tool maintained in part by a French company that specializes
    in embedded Linux development called Free Electrons"


    Buildroot is a much more simplistic approach than the one we will discover through
    this book on the Yocto Project. Buildroot is rather dedicated to firmware generation,
    while Yocto/OpenEmbedded is oriented towards distribution. Buildroot offers 700
    recipes compared to the Yocto Project, which offers over 8000.


    ### The core components


    The core components (other available tools are optional) of the Yocto Project
    are:


    - BitBake

    - OpenEmbedded-Core

    - Poky

    - The BSP layer (meta-raspberry, meta-fsl-arm, meta-ti, meta-intel, meta-sunxi,
    and so on)


    The following diagram shows all the layers that we will discover through this
    book. We will study all the tools through various examples, allowing better comprehension.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_32_0.png)


    ### What is Poky?


    Poky is the *reference* Yocto Project distribution. It contains some of basic
    components (called the build system) of OpenEmbedded and a set of metadata for
    creating embedded distributions for a number of targets. It is platform independent
    and performs cross-compiling using the BitBake tool (a task scheduler), OpenEmbedded-Core,
    and a default set of metadata, as shown in the following figure. It provides the
    mechanism to build and combine thousands of distributed open source projects.


    The Poky build system is poised to become the reference in the industrial world
    as evidenced by industry leaders such as Wind River, Intel, Montavista, and Mentor
    Graphics.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_33_0.png)


    ### Note


    Angstrom (http://www.angstrom-distribution.org/) is another distribution based
    on OpenEmbedded-Core. You might consider Angstrom and Poky to be close cousins,
    because Poky is also based on OpenEmbedded-Core.


    ### The Chief - BitBake


    BitBake, the build engine, is a task scheduler (like GNU Make) which parses several
    scripts (shell and Python, for example).


    Once the environment is built, BitBake will execute the task that has been requested.
    If no task is provided, BitBake will run the default task, called build.


    To run a task, BitBake will first look for an environment variable called do_<task_name>,
    which will contain the task code to execute (in Python or a shell). So, to compile
    a Yocto recipe, use the code contained in the do_compile variable.


    In short, from the information contained in the recipes (or metadata), it downloads
    the sources of projects from the Internet, a local directory, or a version-control
    system (such as Git), and then builds in the order determined by the dependency
    graph generated dynamically. Finally, it installs binaries, generates the corresponding
    package, and builds the final image, which can be installed on the target (Raspberry
    Pi for us).


    The following picture shows how BitBake works:


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_34_0.png)


    ### OpenEmbedded-Core


    The OpenEmbedded-Core metadata collection (meta in the following diagram) provides
    the engine of the Poky build tool. It is designed to provide the core features
    (several recipes). It provides support for six different processor architectures
    (ARM, x86, x86-64, PowerPC, MIPS, and MIPS64), supporting only QEMU-emulated machines.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_35_0.png)


    The organization of OpenEmbedded-Core is depicted here:


    - classes

    - conf

    - files

    - lib

    - recipes-bsp

    - recipes-connectivity

    - recipes-core

    - recipes-devtools

    - recipes-extended

    - recipes-gnome

    - recipes-graphics

    - recipes-kernel

    - recipes-lsb4

    - recipes-multimedia

    - recipes-qt

    - recipes-rt

    - recipes-sato

    - recipes-support

    - site

    - COPYING.GPLv2

    - COPYING.MIT

    - recipes.txt


    This layer includes different recipes, which describe how to fetch, configure,
    compile and package applications and images.


    ### Note


    For the rest of the book, we will mix this layer with the BSP layer of the Raspberry
    Pi, **meta-raspberrypi**.


    ### Exploring metadata


    **Metadata**, which is composed of a mix of Python and shell script text files
    (.conf, .bb, .bbclass, and .inc), provides a tremendously flexible system. Metadata
    refers to the build instructions themselves as well as the data used to control
    what things get built and to affect how they are built. The metadata also includes
    commands and data used to indicate which versions of software are used and where
    they are obtained from. Poky uses this to extend OpenEmbedded-Core and includes
    two different layers, which are another metadata subset. Here are their details:


    - **meta-yocto**: This layer provides the default and supported distributions,
    visual branding, and metadata tracking information (maintainers, upstream status,
    and so on)

    - **meta-yocto-bsp**: This layer, on top of it, provides the hardware reference
    board support (BSP) for use in Poky


    We will discover metadata in depth through Chapter 4, _Understanding the BitBake
    tool._

    '
