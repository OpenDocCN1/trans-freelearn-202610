    ![](img/76681dcfb8cd2bd107d0c06ab088f916_38_0.png)


    Let''s look at what the components in the diagram stand for:


    - User Configuration: This is metadata you can use to control the build process.

    - Metadata layers: These are various layers that provide software, machine, and
    distribution metadata.

    - Source files: These contain upstream releases, local projects, and source control
    management (Git, SVN, and so on).

    - Build system: These are processes under the control of BitBake. This block expands
    on how BitBake fetches source files, applies patches, completes compilation, analyzes
    output for package generation, creates and tests packages, generates images, and
    generates cross-development tools.

    - Package feeds: These are directories containing output packages (RPM, DEB, or
    IPK), which are subsequently used in the construction of an image or SDK produced
    by the build system. These feeds can also be copied and shared using a web server
    or other means to facilitate extending or updating existing images on devices
    at runtime if runtime package management is enabled.

    - Images: These are images produced by the development process (the pieces that
    compose the operating system, such as the kernel image, bootloader, and rootfs).

    - Application development SDK: These are cross-development tools that are produced
    along with an image or separately with BitBake.


    ## Summary


    This first chapter provided an overview on how the Yocto Project works, the core
    components that form it, such as Poky, OpenEmbedded-Core, and BitBake, and how
    they work within the Yocto Project.


    In the next chapter, we will practice the workflow of the Yocto Project with different
    steps to download, configure, and prepare the Poky build environment in order
    to generate our first Poky image for the Raspberry Pi.


    ## Chapter 2. Building our First Poky Image for the Raspberry Pi


    In this chapter, we will try to understand the basic concepts of the Poky workflow.
    Using the Linux command line, we will proceed with the different steps required
    to download, configure, and prepare the Poky Raspberry Pi environment and generate
    an image that can be used by the target.


    ### Installing the required packages for the host system


    The steps necessary for the configuration of the host system depend on the Linux
    distribution used. Indeed, it is advisable to use one of the Linux distributions
    maintained and supported by Poky. This is to avoid wasting time and energy in
    setting up the host system. Currently, the Yocto Project is supported on the following
    distributions:


    - Ubuntu 12.04 (LTS)

    - Ubuntu 13.10

    - Ubuntu 14.04 (LTS)

    - Fedora release 19 (Schrödinger''s Cat)

    - Fedora release 21

    - CentOS release 6.4

    - CentOS release 7.0

    - Debian GNU/Linux 7.0 (Wheezy)

    - Debian GNU/Linux 7.1 (Wheezy)

    - Debian GNU/Linux 7.2 (Wheezy)

    - Debian GNU/Linux 7.3 (Wheezy)

    - Debian GNU/Linux 7.4 (Wheezy)

    - Debian GNU/Linux 7.5 (Wheezy)

    - Debian GNU/Linux 7.6 (Wheezy)

    - openSUSE 12.2

    - openSUSE 12.3

    - openSUSE 13.1


    ### Note


    Even if your distribution is not listed here, it does not mean that Poky will
    not work, but the outcome is not guaranteed. Throughout this book, you will be
    presented with instructions for using Poky with the Ubuntu distribution. If you
    want more information about the supported Linux distributions, you can visit this
    link: http://www.yoctoproject.org/docs/current/ref-manual/ref-manual.html.


    ### Poky on Ubuntu


    The following list shows you the packages required for Poky by function, given
    a supported Ubuntu or Debian Linux distribution:


    - Download tools: wget and git-core

    - Decompression tools: unzip and tar

    - Compilation tools: gcc-multilib, build-essential, and chrpath

    - String-manipulation tools: sed and gawk

    - Document-management tools: texinfo, xsltproc, docbook-utils, fop, dblatex, and
    xmlto

    - Patch-management tools: patch and diffstat


    To summarize, here is the command to type on a headless system:


    ```

    $ sudo apt-get install gawk wget git-core diffstat unzip

    texinfo gcc-multilib build-essential chrpath

    ```


    ### Poky on Fedora


    If you want to use Poky on Fedora, you just have to type this command line:


    ```

    $ sudo yum install gawk make wget tar bzip2 gzip python unzip

    perl patch diffutils diffstat git cpp gcc gcc-c++ glibc-devel

    texinfo chrpath ccache perl-Data-Dumper perl-Text-ParseWords

    perl-Thread-Queue socat

    ```


    ### Downloading the Poky metadata


    After having installed all the necessary packages, it is time to download the
    source from Poky. This is done through the Git tool:


    ```

    $ git clone git://git.yoctoproject.org/poky (branch master)

    ```


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_44_0.png)


    ### Note


    Another method involves directly downloading a tar.bz2 file from this repository:
    https://www.yoctoproject.org/downloads


    To avoid all hazardous and problematic manipulations, it is strongly recommended
    to create and switch to a specific local branch:


    ```

    $ cd poky

    $ git checkout daisy -b work_branch

    ```


    ### Downloading the Raspberry Pi BSP metadata


    At this stage, we only have the base of the reference system (Poky) and we have
    no support for the Broadcom BCM SoC. Basically, the BSP proposed by Poky only
    offers the following targets:


    ```

    $ ls meta/conf/machine/*.conf

    beaglebone.conf

    edgerouter.conf

    genericipx86-64.conf

    genericipx86.conf

    mpc8315e-rdb.conf

    ```


    In addition, there are those provided by OE-Core:


    ```

    $ ls meta/conf/machine/*.conf

    qemuarm64.conf

    qemuarm.conf

    qemumips64.conf

    qemumips.conf

    qemuppc.conf

    qemux86-64.conf

    qemux86.conf

    ```


    ### Tip


    Detailed steps to download the code bundle are mentioned in the Preface of this
    book. Please have a look. The code bundle for the book is also hosted on GitHub
    at https://github.com/PacktPublishing/Yocto-for-Raspberry-Pi. We also have other
    code bundles from our rich catalog of books and videos available at https://github.com/PacktPublishing/.
    Check them out!


    In order to generate a compatible system for our target, we will spend more time
    in this stage and download the specific layer (BSP Layer) to the Raspberry PI:


    ```

    $ git clone git://git.yoctoproject.org/meta-raspberrypi

    ```


    ### Tip


    If you want to learn more about git scm, you can visit the official website: http://git-scm.com/


    - bitbake

    - documentation

    - meta

    - meta-oe

    - meta-raspberrypi

    - meta-selftest

    - meta-skeleton

    - meta-yocto

    - meta-yocto-bsp

    - rpi-build

    - scripts

    - LICENSE

    - oe-init-build-env

    - oe-init-build-env-memres

    - README

    - README.hardware


    Now, we can verify that we have the configuration **metadata** for our platform
    (the raspberrypi.conf file):


    ```

    $ ls meta-raspberrypi/conf/machine/*.conf

    raspberrypi.conf

    ```


    The following screenshot shows the meta-raspberrypi folder:


    - classes

    - conf

    - files

    - recipes-bcm

    - recipes-bsp

    - recipes-core

    - recipes-devtools

    - recipes-graphics

    - recipes-kernel

    - recipes-multimedia

    - COPYING.MIT

    - README

    - rpi.patch


    The examples and code presented in this and the following chapters use Yocto Project
    version 1.7 and Poky version 12.0. For reference, the code name is Dizzy.


    Now that we have our environment freshly downloaded, we can proceed with the initialization
    of our environment and the configuration of our image through various configuration
    files.


    ### The oe-init-build-env script


    As can be seen in the screenshot before last, the Poky directory contains a script
    named oe-init-build-env. This is a script for the configuration/initialization
    of the build environment. It is not intended to be executed but must be the sourced.
    Its job, among others, is to initialize a certain number of environment variables
    and place itself in the build directory specified in the argument. The script
    must be run as follows:


    ```

    $ source oe-init-build-env [build-directory]

    ```


    Here, build-directory is an optional parameter for the name of the directory where
    the environment is set (for example, we can use several build directories in a
    single Poky source tree). In case it is not specified, it defaults to build. The
    build-directory folder is the place where we perform builds. But, in order to
    standardize the steps, we will use the following command throughout the book to
    initialize our environment:


    ```

    $ source oe-init-build-env rpi-build

