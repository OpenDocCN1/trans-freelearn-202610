    We now have our web interface available at http://0.0.0.0:8000/.


    ## Running BitBake


    At the moment, Toaster doesn''t support configuration through the interface (Future
    releases of Toaster will add build-running and build-customization capabilities).
    Toaster collects and presents information about your builds, which you can navigate
    and query using a web browser. So, we have to manually start BitBake to monitor
    the progress of build. As in [Chapter 2, Building our First Poky Image for the
    Raspberry Pi], we can launch the build process using the following command:


    ```

    $ bitbake rpi-basic-image

    ```


    The build process will progress as follows:


