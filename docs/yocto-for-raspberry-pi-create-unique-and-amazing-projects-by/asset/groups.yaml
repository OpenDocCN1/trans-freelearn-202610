    # # About the Authors


    **Pierre-Jean TEXIER** is an embedded Linux engineer at Amplitude Systèmes (a
    pioneer in the marketing of Ytterbium femtosecond lasers) since 2014, where he
    maintains a custom SoC called i.MX6 with the Yocto Project (meta-fsl-arm), which
    is made by a French company, EUKREA.


    He is a graduate of ESTEI school at Bordeaux, where he studied for 3 years to
    become an embedded Linux engineer.


    He is a big supporter of the world of free software and the embedded world. His
    knowledge includes C/C++, Yocto, Linux, Bash, and kernel development, but he is
    also open to trying new things and testing new technologies.


    *Firstly, I want to thank my patient wife for her support during my writing sessions.
    I also give thanks my parents and my brother; without them, this book possibly
    would not have happened.I would also like to thank all of the mentors that I''ve
    had over the years—mentors such as Cyril SAGONERO, Sylvain LE HENAFF, Pierre BORDELAIS,
    Vincent POULAILLEAU, Fabrice BONNET, Jean-Claude PERESSINOTTO, and Pierre AUBRY.
    Without learning from these teachers, there is not a chance I could be doing what
    I do today.To finish, I would like to thank Eric MOTTAY, the CEO of Amplitude
    Systèmes; Luca TESTA, the head of the electronics team at Amplitude Systèmes for
    his trust; and Hitesham WOODHOO, Alexandre GAMONET, Kevin PINTO, and Guillaume
    MACHINET for all the discussions about the Raspberry Pi during coffee breaks.*


    **Petter Mabäcker** is a senior software developer specializing in embedded Linux
    systems. For the past 8 years, he has been working with embedded Linux professionally.
    Currently, Petter works as a Scrum Master and senior software developer at Ericsson
    AB. Additionally, his knowledge includes C/C++, shell scripting, Yocto Project
    (including BitBake and OpenEmbedded), Scrum, and Git.


    In 2013, Petter started the small business Technux, which he runs as a side project
    in parallel with his duties at Ericsson. Some of the focus areas of the business
    are open source embedded Linux projects, such as the Yocto Project, together with
    different projects that involve the Raspberry Pi. As part of the work with Technux,
    Petter works as a contributor to the Yocto Project (including the Raspberry Pi
    BSP layer, known as meta-raspberrypi ).


    *I would like to give special thanks to my beloved family for letting me spend
    the time needed to finalize this book besides all my other duties.*'
