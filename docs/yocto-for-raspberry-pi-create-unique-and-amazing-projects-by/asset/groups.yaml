    # The machine (BSP) layer


    For this presentation, we will take the example of the BSP layer specific to our
    hardware: the meta-raspberrypi BSP layer. This directory (folder) should contain
    a file list similar to the following:


    ```

    pjtexier@amplitude:~ $ ls -l meta-raspberrypi/ classes

    conf

    custom-licenses

    recipes-bsp

    recipes-core

    recipes-devtools

    recipes-graphics

    recipes-kernel

    recipes-multimedia

    COPYING.MIT

    README

    ```


    When we use a BSP layer, there are some differences. The first is in the conf
    folder. Now, we have a new folder inside this directory, which is machine.


    This folder contains some configuration files to handle our specific hardware
    (Raspberry Pi and Raspberry Pi 2 among others). For example, there is an important
    file (rpi-base.inc) located at:


    +   - machine


    +   - * raspberry.conf (configuration file for Raspberry Pi)

    +   - * raspberry2.conf (configuration file for Raspberry Pi2)


    +   - Include


    +   - * rpi-base.inc


    The rpi-base.inc file looks like this:


    ```

    include conf/machine/include/rpi-default-settings.inc

    include conf/machine/include/rpi-default-versions.inc

    include conf/machine/include/rpi-default-providers.inc


    SOC_FAMILY = "rpi"

    include conf/machine/include/soc-family.inc


    IMAGE_FSTYPES ?= "tar.bz2 ext3 rpi-sdimg"


    SERIAL_CONSOLE = "115200 ttyAMA0"


    XSERVER = " \\

    xserver-xorg \\

    xf86-input-evdev \\

    xf86-input-mouse \\

    xf86-input-keyboard \\

    xf86-video-fbdev \\

    "

    ```'
