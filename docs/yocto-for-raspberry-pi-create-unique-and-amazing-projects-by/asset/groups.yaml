    trees are located in the /boot partition alongside start.elf and are named bcm*-rpi-b[-plus].dtb
    (the A and A+ models are compatible and are supposed to use B and B+ device tree''s).
    An example from config.txt of enabling the i2c interface, adding HiFiBerry support,
    and ensuring that the base DT for the Raspberry Pi B+ is loaded can be seen here:


