    # # What is Git?


    Git is a distributed version control system that has been around since 2005 and
    is designed to handle projects with speed and efficiency, regardless of size.
    It was originally created to handle the source code of the Linux kernel. Git is
    free and open source and can be used by anyone without any need to pay licensing
    fees. The design of Git is highly suited to the manner of working used within
    open source projects. Besides the possibility of using distributed development,
    it has an easy logging mechanism to record who did what, cryptographic authentication
    of history, and an easy way to create branches, among other things.


    One of the fundamental differences between many other distributed version control
    systems (VCS, subversion, Bazaar, and so on) is how Git stores information. In
    Git, the data can be seen as a snapshot of a miniature filesystem. When saving
    the state of your project, a snapshot is taken of that state and a reference is
    saved.


    # ## Tip


    The basic Git workflow goes something like this:


    +   - You modify files in your working directory

    +   - You stage the files, adding snapshots of them to your staging area

    +   - You perform a commit, which takes the files as they are in the staging area
    and stores that snapshot permanently to your Git directory"


    For more information, visit https://git-scm.com/book/en/v2/Getting-Started-Git-Basics.'
