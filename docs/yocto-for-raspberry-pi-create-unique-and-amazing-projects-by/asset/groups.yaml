  - '[PAGE 101]


    # # Raspberry Pi and a package manager


    The basic building block of the Yocto Project is the generation of packages; therefore,
    it is possible to include a package manager to our Yocto distribution (similar
    to a Linux distribution, for example). Indeed, after the generation of the image
    (refer Chapter 2), it contains no package manager, so this means that our image
    is not updateable (similar to a firmware, for example).


    The inclusion of a package manager in our distribution is done through this variable,
    if adding it to conf/local.conf:


    ```

    EXTRA_IMAGE_FEATURES += "package-management"

    ```


    If adding to a recipe file (such as rpi-basic-image.bb), use this instead:


    ```

    IMAGE_FEATURES += "package-management"

    ```


    With this addition, we have now an image with a package manager that is more flexible,
    updateable, and more industrial. Here''s how to install a package with the opkg
    package manager:


    ```

    $ opkg install package_name.ipk

    ```'
  - '[PAGE 102]


    # Package format availabililty


    Bitbake (the task scheduler) supports the following package formats:


    RPM: Originally used by Red Hat due to its name, Red Hat Package Manager, it is
    now used by other distributions (openSUSE, for example).


    DEB: The Debian package format is used by Debian and derivate distributions such
    as Ubuntu.


    IPK: This stands for Itsy Package Management System (originally of the handhelds.org
    project). It is a lightweight package management system designed for embedded
    systems (such as the Gumstix platform: http://gumstix.org/add-software-packages.html
    ). OpenEmbedded-Core, and as a consequence Poky, uses the opkg package manager
    to support the IPK format.


    # Note


    If you are an Android enthusiast, you can make an analogy with the APK package
    format.'
  - '[PAGE 103]


    # Choosing a package format


    Support for the formats is provided using a set of classes (package_rpm, package_deb,
    and package_ipk). The choice of the package formats depends very much on project
    needs. Factors to consider include the following:


    +   - Memory footprint

    +   - Resource usage,

    +   - Speed of installation


    # Note


    By default, Poky uses the RPM (Red Hat Package Manager) package format.


    The selection of package format is done through the PACKAGE_CLASSES variable in
    the conf/local.conf file.


    Type this to include the RPM package format:


    ```

    PACKAGE_CLASSES ?= "package_rpm"

    ```


    Type this to include the DEB package format:


    ```

    PACKAGE_CLASSES ?= "package_deb"

    ```


    Type this to include the IPK package format:


    ```

    PACKAGE_CLASSES ?= "package_ipk"

    ```


    # Note


    It is possible to specify several package formats but, to build images, Bitbake
    searches based on the first package format in the PACKAGE_CLASSES variable: PACKAGE_CLASSES
    ?= "package_rpm package_deb package_ipk"'
