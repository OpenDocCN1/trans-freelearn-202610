  mdcn: "\n\n接下来，我们可以看到 /sys/class/gpio 下出现了一个包含一些文件的 gpio17 目录：\n\n```\n$ ls /sys/class/gpio17/\n\
    ```\n\n之后，我们需要为 GPIO 引脚设置方向（输入/输出）；在我们的示例中，我们希望 GPIO 作为输出引脚工作：\n\n```\n$ echo\
    \ \"out\" > /sys/class/gpio/gpio17/direction\n```\n\n最后，我们可以通过向 value 文件写入 1 来启用\
    \ GPIO 引脚，这将使 LED 亮起：\n\n```\n$ echo 1 > /sys/class/gpio/gpio17/value\n```\n\n\
    要关闭灯光，我们可以向 value 文件写入 0：\n\n```\n$ echo 0 > /sys/class/gpio/gpio17/value\n```\n\
    \n完成后，您需要取出口 GPIO 引脚：\n\n```\n$ echo 17 > /sys/class/gpio/unexport\n```\n\n现在，sysfs\
    \ 中的 gpio17 目录已不存在。在我们的项目中，我们不会手动操作 sysfs 结构。相反，我们将使用本章前面添加到镜像中的 gpio-packet 配方，但在底层，它以类似刚才描述的方式使用\
    \ sysfs 结构。gpio-packet 配方生成一个名为 gpio_example 的二进制文件；它可以使用以下语法控制 GPIO17：\n\n```\n\
    $ gpio_example --led=1\n$ gpio_example --led=0\n```\n\n控制 GPIO 引脚的另一种方法是使用 RPi.GPIO，这是一个\
    \ Python 模块，它在后台使用直接寄存器访问来访问 GPIO。使用 RPi.GPIO 控制 GPIO17 要求您将以下内容添加到例如名为 ledon.py\
    \ 的文件中：\n\n```\nimport RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(17,\
    \ GPIO.OUT)\nGPIO.output(17, 1)\n```\n\n然后，我们可以运行脚本。关闭引脚可以通过在 GPIO.output() 函数中将\
    \ 1 替换为 0 来轻松完成：\n\n```\n$ python ledon.py\n```\n\nRPi.GPIO 还可以使用物理 GPIO 标头引脚编号。在这种情况下，GPIO17\
    \ 将位于引脚 11 上。要使用此模式，脚本必须按以下方式修改：\n\n```\nimport RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BOARD)\n\
    GPIO.setup(12, GPIO.OUT)\nGPIO.output(11, 1)\n```\n\n### 注意\n\n第 8 章《深入探索树莓派外设与\
    \ Yocto 配方》中的 GPIO 标头图可用作理解和摆弄 GPIO 引脚的参考。\n\n## 使用树莓派控制台灯\n\n此时，我们可以从板子上本地控制继电器。接下来，是时候将台灯连接到我们的继电器模块了。\n\
    \n### 注意\n\n警告：本项目需要基本的电气知识。如果您没有相关知识或经验，我们强烈建议不要使用高压电源。建议使用低压 12 伏电源。\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_249_0.png)\n\
    \n一个单通道继电器模块\n\n在连接台灯之前，我们需要了解使用继电器模块的一些基础知识。仔细观察以下继电器；它在与插入 GPIO 跳线电缆相对的一侧包含\
    \ C、NC 和 NO 开口。这些插槽将用于将台灯连接到继电器。\n\n继电器上的 C 代表公共连接，我们将把外部电源的电源连接到这个端口。接下来，我们有\
    \ NC 和 NO，分别代表**常闭**和**常开**。在我们的项目中，我们将使用 NO。这样做的原因是它将像开关一样工作。默认情况下，C 和 NO 之间没有接触，但当我们使用\
    \ GPIO 引脚的信号触发继电器时，我们将关闭继电器，这将打开电路。使用 NC 而不是 NO 将会给你相反的行为。\n\n台灯和外部电源（出于安全考虑，强烈建议使用\
    \ 12V）将按下图所示连接。请注意，如果台灯没有使用适配器，您可能需要打开电缆外壳以获取正负电线。黑色负电线可以直接从外部电源连接到台灯。正极必须从电源插入继电器上的\
    \ C 插槽。最后，我们需要将台灯上的红色正极电缆连接到继电器上的 NO 插槽，以获得前面描述所需的行为。\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_250_0.png)\n\
    \n当所有物理连接就绪后，我们可以再次使用 gpio_example 二进制文件来检查一切是否正常。此时，我们的树莓派可能难以移动，因此我们将使用 SSH\
    \ 访问板子并打开和关闭灯光。\n\n```\n$ ssh root@192.168.x.x\nroot@raspberrypi2:~#\nroot@raspberrypi2:~#\
    \ gpio_example --led=1\nroot@raspberrypi2:~# gpio_example --led=0\n```\n\n如果一切都按正确方式设置，您应该看到灯光亮起和熄灭。在下一小节中，我们将继续介绍如何使用智能手机远程控制灯光。\n\
    \n## 从智能手机打开/关闭台灯\n\n我们的家居自动化项目已接近完成，但还有一件重要的事情：我们需要确保可以使用远程设备（例如智能手机）控制灯光。首先，我们需要检查板子上是否存在\
    \ Web 服务器：\n\n```\n$ ps | grep server\n295 root 2732 server.init\n```\n\n如果服务器由于某种原因没有自动启动，我们可以尝试使用此命令手动启动它：\n\
    \n```\n$ /etc/init.d/server-packt-init start\nstarting Nodejs app: server.init...\
    \ done.\nroot@raspberrypi2:~#  info - socket.io started\nlistening on *:3344\n\
    ```\n\n如果我们直接在树莓派上对 Web 服务器进行了一些手动更改，可以使用此命令重启 Web 服务器：\n\n```\n$ /etc/init.d/packt-server\
    \ restart\nstopping Nodejs app: server.init... stopped node (pid 295)\ndone.\n\
    starting Nodejs app: server.init... done.\n```\n\n现在，我们可以在智能手机上启动 Web 浏览器并访问 http://my_rpi_ipaddress:3344。您将看到本章前面打开\
    \ index.html 时看到的同一页面。格式在智能手机上可能看起来略有不同，但红色和绿色按钮会在那里！尝试点击它们，您将看到灯光亮起和熄灭。\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_251_0.png)\n\
    \n家居自动化项目最终结果的真实示例。\n\n此时，您的家居自动化项目已运行起来，您已经更接近无线连接的家庭了一步。希望本项目能为您提供许多使用树莓派设置其他有趣和富有创意的家居自动化项目的想法。\n\
    \n## 额外 - 将带有 LCD 的树莓派用作客户端\n\n我们可以轻松使用另一个树莓派作为客户端，它将负责打开和关闭台灯。在本示例中，我们将使用小巧的\
    \ PiTFT 2.8 触摸屏来控制灯光。请注意，其他触摸屏当然也同样有效；重要的是镜像中包含 Web 浏览器：\n\n```\n$ source /path/to/poky/oe-init-build-env\
    \ pitft28r_client_proj\n```\n\n像这样更新 bblayers.conf：\n\n```\n$ cat local/bblayers.conf\n\
    # LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf\n# changes\
    \ incompatibly\nLCONF_VERSION = \"6\"\nBBPATH = \"${TOPDIR}\"\nBBFILES ?= \"\"\
    \nBBLAYERS ?= \" \\\n  /path/to/poky/meta \\\n  /path/to/poky/meta-yocto \\\n\
    \  /path/to/poky/meta-yocto-bsp \\\n  /path/to/meta-raspberrypi \\\n  /path/to/meta-openembedded/meta-oe\
    \ \\\n  /path/to/meta-openembedded/meta-multimedia \\\n  \"\nBBLAYERS_NON_REMOVABLE\
    \ ?= \" \\\n  /path/to/poky/meta \\\n  /path/to/poky/meta-yocto \\\"\n```\n\n\
    然后，更新 local.conf：\n\n```\n$ echo \"MACHINE = \\\"raspberrypi2\\\"\" >> conf/local.conf\n\
    $ echo \"MACHINE_FEATURES += \\\"pitft pitft28r\\\"\" >> conf/local.conf\n$ echo\
    \ \"LICENSE_FLAGS_WHITELIST = \\\"commercial\\\"\" >> conf/local.conf\n```\n\n\
    ### 注意\n\n注意：本示例使用 raspberrypi2 镜像；如果您使用不同型号，请记住将其更改为正确的机器名称。\n\n使用以下命令构建镜像，启动它，然后访问\
    \ http://my_rpi_ipaddress:3344：\n\n```\n$ bitbake core-image-sato\n```\n\n## 总结\n\
    \n在这本书的最后一章中，我们重复了贯穿全书学到的技术。这是通过创建一个家居自动化项目来完成的，该项目可以借助树莓派和 Web 浏览器无线打开和关闭家中的台灯，例如，使用智能手机作为遥控器。\n\
    \n对于我们的家居自动化项目，我们改进了本书前面使用的一些示例，例如 GPIO 控制二进制文件和 Node.js 示例。通过对它们进行演进，我们复习了如何通过追加新文件或修补旧文件来修改现有配方。该项目还要求您复习如何创建和集成外部层。此外，本章更深入地探讨了一些技术，并向您介绍了如何在项目中使用特定软件包列表，以及如何使用串行连接和\
    \ SSH 轻松访问和调试树莓派。为了完成该项目，您需要更深入地了解树莓派型号的 GPIO 标头和引脚是如何设置的。\n\n希望本章学到的技能能激励您为树莓派平台开发新的、酷炫而疯狂的家居自动化项目。\n\
