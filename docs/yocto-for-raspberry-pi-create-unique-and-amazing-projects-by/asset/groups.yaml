    \ 应用程序、带有 mpeg-streamer 的应用程序等等）。\n\n## 总结\n\n在本章中，我们了解了 Poky 发行版中层的主要原理。我们学习了层的工作原理，如何将外部层集成到我们的树莓派项目中，以及如何生成自定义镜像。\n\
