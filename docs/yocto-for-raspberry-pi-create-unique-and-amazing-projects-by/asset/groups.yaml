    \ < '${WORKDIR}/defconfig' > '${B}/.config'\n```\n\n## 使用 LCD 支持配置内核\n\n在将 LCD\
    \ 显示器与树莓派一起使用时，您的内核必须满足某些要求，以确保显示器功能齐全。首先，您需要知道要使用的内核是否支持您的显示器。将旧内核版本与全新显示器配合使用通常会出现问题，因为为您的显示器所需的驱动程序在开发旧内核时尚不存在，而新驱动程序很少会被回移植到旧内核版本。这为您提供了两种选择。第一个是亲自尝试回移植所需驱动程序的艰苦工作。即使是经验丰富的内核开发人员，这也非常困难且往往难以实现，具体取决于需要回移植的内核有多旧。另一种更合适的解决方案是使用包含您的显示器驱动程序的较新内核版本。\n\
    \n即使您的内核包含了运行显示器所需的所有组件，您也必须确保所有驱动程序都已启用。从内核版本 3.18 开始，树莓派官方支持一种称为设备树的机制，可用于简化内核的配置。\n\
    \n在本小节中，我们将讨论以下主题：\n\n- 设备树：它是什么以及如何在树莓派上使用\n- 从内核角度配置触摸屏：如何在树莓派上配置内核以处理不同的触摸屏\n\
    \n### 树莓派设备树\n\n一个 **设备树 (DT)** 是包含设备硬件描述的树形数据结构。DT 可以管理资源分配和处理模块加载，从而缓解驱动程序争夺系统资源的问题。对于\
    \ ARM 架构，**设备树源 (DTS)** 文件存储在内核树的 `/arch/arm/boot/dts` 下。当内核构建时，DTS 文件会被编译成 **设备树二进制文件\
    \ (DTBs)**。要使用 DT，固件和内核都必须支持它，因为引导加载程序将负责与内核一起加载 DTB（第三阶段引导加载程序 `start.elf` 将把设备树二进制文件传递给树莓派）。\n\
    \n### 注意\n\n树莓派使用其 GPU (VideoCore IV) 来启动系统。它首先加载其一级引导加载程序。这样可以访问并运行二级引导加载程序 `bootcode.bin`（位于\
    \ SD 卡上）。二级引导加载程序在 GPU 上执行，并将加载名为 `start.elf` 的三级引导加载程序。三级引导加载程序的主要职责是读取和解析配置，并将其传递给\
    \ GPU 和内核，同时加载内核映像。`bootcode.bin` 和 `start.elf` 引导加载程序以及配置（例如 `cmdline.txt` 和\
    \ `config.txt`）位于 SD 卡上。\n\n将 DTB 传递给不支持设备树的内核将阻止映像启动。为了以通用方式处理此问题，引导加载程序使用 `mkknlimg`\
    \ 工具添加的尾块来检查内核是否支持 DT。\n\n树莓派的设备树管理使用 `config.txt` 文件来完成。基础设备树位于 /boot 分区中，与 start.elf\
    \ 并存，命名为 bcm*-rpi-b[-plus].dtb（A 和 A+ 型号兼容，应该使用 B 和 B+ 设备树）。以下示例展示了如何在 config.txt\
    \ 中启用 i2c 接口、添加 HiFiBerry 支持，并确保加载树莓派 B+ 的基础 DT：\n\n```\ndtparam=i2c=on\ndtoverlay=bcm2708-rpi-b-plus\n\
    dtoverlay=hifiberry-dacplus\n```\n\n使用最新固件时，加载程序会根据您的硬件尝试默认加载其中一个基础设备树，无需您在 config.txt\
    \ 中指定。\n\n## 从内核角度配置触摸屏\n\n在本小节中，我们将介绍 PiTFT 2.8 触摸屏和树莓派 7 触摸屏所需的基本内核配置。\n\n首先，我们需要为基础配置选择应使用的配置。使用\
    \ meta-raspberrypi 时，在 local.conf 中将 MACHINE 变量指定为 raspberrypi 或 raspberrypi2\
    \ 后，构建系统将自动处理此事。使用自定义内核时，我们需要知道哪个现有配置适合我们的树莓派型号。目前有三种选择：bcmrpi_defconfig（第一代树莓派）、bcm2709_defconfig（第二代树莓派）或\
    \ bcm2835_defconfig（仅在较新内核版本中完全支持）。在我们的示例中，我们将使用树莓派 2。配置决定后，我们可以开始执行内核的基本配置，如下所示：\n\
    \n```\n$ cd /path/to/rpi_kernel_repo\n$ mkdir -p /path/to/output_dir\n$ O=/path/to/output_dir\
    \ CROSS_COMPILE=/path/to/arm-linux-gnueabi- ARCH=bcm2709_defconfig\n```\n\n使用\
    \ BitBake 和 meta-raspberrypi，您需要执行以下操作：\n\n```\n$ bitbake linux-raspberrypi -c\
    \ configure\n```\n\n### 注意\n\n对于自定义内核，config 将存储在 /path/to/kernel_output/.config。使用\
    \ Yocto 和 meta-raspberrypi 时，它将存储在 . /tmp/work/raspberrypi*-poky-linux-gnueabi/linux-raspberrypi/<kernel_version_and_revision>/linux-raspberrypi*-standard-build/.config。\n\
    \n一旦基本配置就绪，我们可以检查它是否包含启动显示器所需的最基本配置。请注意，以下配置目前在树莓派配置中默认启用。\n\n对于 PiTFT 2.8，必须启用这些选项：\n\
    \n```\nCONFIG_INPUT_TOUCHSCREEN=y\nCONFIG_OF_TOUCHSCREEN=y\nCONFIG_TOUCHSCREEN_STMPE=m\n\
    CONFIG_FB_TFT_FBTFT_DEVICE=m\n```\n\n除了通用触摸屏支持配置外，我们还需要确保构建 stmpe 和 fbtft 设备。stmpe_ts\
    \ 设备用于为 PiTFT 提供可用的触摸功能。fbtft 设备是一种用于小型 TFT LCD 显示器（例如 PiTFT）的帧缓冲区驱动程序。该设备支持 SPI\
    \ 和 GPIO 的使用（PiTFT 显示器使用它们），并确保显示器已注册并被内核识别。除了这些选项外，还需要进行 SPI 和 i2c 的基本设置才能让一切运行起来。\n\
    \n在本书中，我们将假设使用具有树莓派设备树支持的内核版本（内核 3.18+）。这意味着我们需要修改 config.txt 以确保所需部分通过设备树自动加载，如下所示：\n\
    \n```\ndtparam=spi=on\ndtparam=i2c1=on\ndtparam=i2c_arm=on\ndtoverlay=pitft28r,\
    \ rotate=90, speed=32000000, fps=20\n```\n\n对于官方树莓派 7，只需启用以下内容：\n\n```\nCONFIG_INPUT_TOUCHSCREEN=y\n\
    CONFIG_OF_TOUCHSCREEN=y\nCONFIG_TOUCHSCREEN_RPI_FT5406=m\n```\n\n然后，在 config.txt\
    \ 中启用 ft5406 overlay：\n\n```\ndtoverlay=rpi-ft5406\n```\n\n我们已了解内核与树莓派上某些常见触摸屏型号正常工作所需的基本配置。在下一节中，我们将学习如何使用\
    \ Yocto Project 设置这些部分以及所需的用户空间设置。\n\n"
