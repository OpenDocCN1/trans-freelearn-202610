    ## Running the web interface


    Now that we have launched BitBake, we can monitor the progress of the process
    (the build process), as shown in the following screenshot. Note that the best
    way to open the Toaster interface is to navigate to it (using hyperlinks).


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_76_0.png)


    Toaster is still in the development phase; it is likely to become a worthy replacement
    of Hob. Indeed, the development team wants to make BitBake fully configurable
    via the web interface.


    ## Summary


    In this chapter, we discovered how to use user-friendly interfaces such as Hob
    and Toaster. We learned the different capabilities of these tools (configuration
    and functionality). It is worth noting that these tools allow better flexibility
    for development teams.


    In the next chapter, we will learn the main role played by BitBake within the
    Yocto Project. We will discover the different tasks that enable us to generate
    packages for our image.


    ## Chapter 4. Understanding BitBake


    In this chapter, we will initially explore the metadata (the basic concept) and
    recipes that are used by Poky (the dependencies among them). We will then look
    at the different ways in which BitBake downloads source code. We will end this
    chapter by presenting the tasks used by BitBake to get to the creation of the
    root filesystem image.


    ## BitBake


    As presented in Chapter 1, *Meeting the Yocto Project*, **BitBake** is a task
    scheduler (like GNU Make) that parses shell and Python scripts. The code parsed
    generates and runs tasks (configure, compile, and so on), which are basically
    sets of steps ordered according to the code''s dependencies.


    Here are some points taken directly from the BitBake user manual:


    - BitBake executes tasks according to the provided metadata, which builds up the
    tasks. Metadata is stored in recipe (.bb), configuration (.conf), and class (.bbclass)
    files and provides BitBake with instructions on what tasks to run and the dependencies
    between those tasks.

    - BitBake includes a fetcher library for obtaining source code from various places,
    such as source control systems or websites.

    - The instructions for each unit to be built (such as a piece of software) are
    known as recipe files and contain all the information about the unit (dependencies,
    source file locations, checksums, description, and so on).

    - BitBake includes a client/server abstraction, can be used from a command line
    or as a service over XMLRPC, and has several different user interfaces.


    ### Metadata


    The metadata used by BitBake can be in several distinct forms; they are as follows:


    - Configuration (.conf) files

    - Recipes (.bb and .bbappend files)

    - Classes (.bbclass files)

    - Include (.inc) files


    ### Configuration


    Configuration files, which are denoted by the .conf extension, define various
    configuration variables that govern the project''s build process. These files
    fall into several areas that define machine configuration options, distribution
    configuration options, compiler tuning options, general common configuration options,
    and user configuration options.


    ### Classes


    Class files, which are denoted by the .bbclass extension, contain information
    that is useful to share between metadata files. The BitBake source tree currently
    comes with one class metadata file called base.bbclass. You can find this file
    in the classes directory. The base.bbclass file is special since it is always
    included automatically for all recipes and classes. This class contains definitions
    for standard basic tasks such as fetching, unpacking, configuring (empty by default),
    compiling (runs any makefile present), installing (empty by default), and packaging
    (empty by default). These tasks are often overridden or extended by other classes
    added during the project development process.


    ### Recipes


    BitBake recipes, which are denoted by the .bb file extension (for example, bcm2835_1.38.bb),
    are the most basic metadata files. These recipe files provide BitBake with the
    following information:


    - Descriptive information about the package

    - The version of the recipe

    - Existing dependencies

    - Where the source code resides

    - Whether the source code requires any patches

    - How to compile the source code

    - Where on the target machine to install the package being compiled


    ## Parsing metadata


    The first thing BitBake does is parse base configuration metadata (.conf files).
    Base configuration metadata consists of the `bblayers.conf` file to determine
    what layers BitBake needs to recognize, all necessary `layer.conf` files (one
    from each layer), and `bitbake.conf`. The data itself is of various types:


    - Recipes: These contain details about particular pieces of software.

    - Class data: This provides an abstraction of common build information (for example,
    how to build a Linux kernel).

    - Configuration data: This provides machine-specific settings, policy decisions,
    and so forth. Configuration data acts as the glue that binds everything together.


    The `layer.conf` files are used to construct key variables such as BBPATH and
    BBFILES. BBPATH is used to search for configuration and class files under the
    `conf/` and `class/` directories, respectively. BBFILES is used to find recipe
    files (.bb and .bbappend). If there is no `bblayers.conf` file, it is assumed
    that the user has set the BBPATH and BBFILES variables directly in the environment.


    Next, the `bitbake.conf` file is searched using the BBPATH variable that was just
    constructed. The `bitbake.conf` file may also include other configuration files
    using the `include` or `require` directives.

