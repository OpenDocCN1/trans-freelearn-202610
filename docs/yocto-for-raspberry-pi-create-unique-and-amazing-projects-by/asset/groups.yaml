    \ Mabäckner\n\n可以通过订阅特定的邮件列表或阅读存档来轻松跟踪邮件列表。\n\n### 注意\n\n所有 Yocto 项目邮件列表均可在 https://www.yoctoproject.org/tools-resources/community/mailing-lists\
    \ 上找到。\n\n### 为 meta-raspberrypi 做出贡献\n\n如果您已为 meta-raspberrypi 准备了想要与社区分享的修复程序或功能，则需要了解多个事项。\n\
    \nmeta-raspberrypi 的当前维护者是 Andrei Gherzan。他对补丁有最终决定权，并会将补丁集成到 meta-raspberrypi\
    \ 主层中。由于维护者非常忙碌，在将补丁发送到上游之前仔细测试补丁非常重要。对于贡献者来说，无论项目如何，最重要的是通过发送遵循请求指南的经过充分测试的补丁来建立声誉。这将显著增加补丁被项目集成的机会。\n\
    \n为 meta-raspberrypi 做出贡献存在一些总体“规则”：\n\n- 与 meta-raspberrypi 相关的补丁应始终发送至 yocto@yoctoproject.org。\n\
    - 使用 \"[meta-raspberrypi]\" 作为电子邮件的前缀\n- 遵循 OpenEmbedded 补丁指南\n- 遵循 meta-raspberrypi\
