    \ repository. According to naming conventions, a bare Git repository should be\
    \ named `name_of_my_repo.git`.\n\nWe now have a bare repository that can be used\
    \ by a collaboration of developers. Next, we continue with cloning a local copy\
    \ of the bare repository, which we can use when developing our new features. By\
    \ default, you will be in a branch called `master` when cloning a repository.\
    \ It's possible to do all our work in the master branch; since this is only a\
    \ local clone, we will not destroy anything for other developers. But it's strongly\
    \ recommended to create a **working branch** and make all your changes in that\
    \ branch instead. This way, the master branch is always in a stable and known\
    \ state. When you are an advanced Git user, you might work on several features\
    \ in parallel and also might want to integrate new features that other developers\
    \ have worked on through the master branch. In other words, it's a good habit\
    \ to create separate branches for all your features.\n\n```\n$ git clone /path/to/my_packt_project.git\n\
    Cloning into 'my_packt_project'\n$ cd my_packt_project\n```\n\nNext, we will create\
    \ a new branch called `my_new_feature`, move it, and develop a tiny new feature\
    \ for the project. It's possible to use `git branch` to list all available local\
    \ branches; if you add the `-a` flag when listing branches, all remote branches\
    \ will be listed as well.\n\n### Tip\n\nA remote branch is a branch that exists\
    \ in a shared repository that has been cloned from. The asterisk (*) helps the\
    \ user locate the current branch.\n\n```\n$ git branch\n* master\n$ git branch\
    \ my_new_feature\n$ git checkout my_new_feature\nSwitched to branch 'my_new_feature'\n\
    ```\n\n```\n$ git branch\nmaster\n* my_new_feature\n$ git branch -a\nmaster\n\
    * my_new_feature\nremotes/origin/HEAD -> origin/master\nremotes/origin/master\n\
    ```\n\nWe are now in our new branch and it's time to make some modifications.\
    \ In this example, we will add a new target, clean, to our makefile. Remember\
    \ to use git add in order to add your changes to the index before committing them.\
    \ Use git diff before adding the file if you want to list your changes.\n\n###\
    \ Note\n\nIf you have already added a file using git add, you can check your changes\
    \ before committing them by using git diff --cached.\n\n```\n$ vim Makefile\n\
    $ git diff\ndiff --git a/Makefile b/Makefile\nindex c6466e0..d986116 100644\n\
    --- a/Makefile\n+++ b/Makefile\n@@ -1,2 +1,5 @@\nall:\n$(CC) my_packt_project.c\
    \ -o my_packt_project\n+\n+clean:\n+rm -f my_packt_project\n$ git add Makefile\n\
    $ git commit -m \"Makefile: Add a new target\"\n[my_new_feature 7c3d896] Makefile:\
    \ Add a new target\n1 file changed, 3 insertions(+)\n```\n\nThe last step for\
    \ us is to send our new change to the shared repository, update our local master\
    \ with the new changes, and then remove our feature branch, since it will no longer\
    \ be required. When pushing a change to our shared repository, we can use the\
    \ predefined remote origin; by default, the origin is set to point to the repository\
    \ we cloned from. When pushing a change, we need to specify which revision we\
    \ will send and to which branch. In most situations, we will want to send the\
    \ entire branch; if so, we can use HEAD to obtain all changes from the current\
    \ branch, like this:\n\n```\n$ git push origin HEAD:master\nCounting objects:\
    \ 5, done.\nDelta compression using up to 4 threads.\nCompressing objects: 100%\
    \ (3/3), done.\nWriting objects: 100% (3/3), 383 bytes | 0 bytes/s, done.\nTotal\
    \ 3 (delta 0), reused 0 (delta 0)\nTo /path/to/my_packt_project.git\nf01bdf2..7c3d896\
    \  HEAD -> master\n$ git checkout master\nSwitched to branch 'master'\nYour branch\
    \ is behind 'origin/master' by 1 commit, and can be fast-forwarded.\n(use \"git\
    \ pull\" to update your local branch)\n"
  mdcn: "\n## 使用 Git\n\nGit 中的项目称为仓库。大部分工作可以通过将主仓库克隆到你首选的工作目录中在本地完成。这就是 Git 通常被认为非常快速的原因之一，尤其是与许多操作都需要网络访问的其他版本控制系统相比。\n\
    \n让我们来了解一些基本示例，这些示例将教你如何：\n\n- 将现有项目导入 Git 仓库\n- 创建你的第一个提交\n- 转换为共享仓库\n- 克隆共享仓库的本地版本\n\
    - 创建工作分支\n- 将提交推送到你的共享仓库\n- 使用最新更改更新克隆的仓库\n\n当将现有项目导入新的 Git 仓库时，我们必须首先初始化一个空的\
    \ Git 仓库。这可以在我们项目的现有源代码树中轻松完成：\n\n```\n$ tar -zxf my_packt_project_ch_11_01.tar.gz\n\
    $ cd my_packt_project\n$ git init\nInitialized empty Git repository in  /path/to/repo/my_packt_project/.git/\n\
    ```\n\n初始化新 Git 仓库时，会创建一个名为 .git 的新目录。该目录包含有关新仓库的所有 Git 相关信息。其中，它包含主 Git 配置文件\
    \ config，该文件包含项目的 Git 设置。该目录中另一个常用文件是 HEAD，它包含对当前分支的引用。\n\n创建空 Git 仓库后，我们可以继续将项目的所有内容添加到新仓库中。获取分支和仓库当前状态的有用命令是\
    \ git status。当 Git 不了解某个文件时，它会显示在“未跟踪的文件”下，如下所示：\n\n```\n$ git status\nOn branch\
    \ master\nInitial commit\nUntracked files:\n  (use \"git add <file>...\" to include\
    \ in what will be committed)\nMakefile\nREADME\nmy_packt_project.c\nnothing added\
    \ to commit but untracked files present (use \"git add\" to track)\n```\n\n我们可以使用单个命令添加所有文件和/或更改，但请注意，它也会添加构建输出。因此，使用\
    \ git add --all 时，请确保先删除不需要的文件。然后，我们可以再次使用 git status 来检查是否列出了所有预期的文件：\n\n```\n\
    $ git add --all\n$ git status\n```\n\n```\nOn branch master\nInitial commit\n\
    Changes to be committed:\n(use \"git rm --cached <file>...\" to unstage)\nnew\
    \ file:   Makefile\nnew file:   README\nnew file:   my_packt_project.c\n```\n\n\
    在提交更改并创建第一个提交之前，我们需要设置一些基本的 Git 配置。最起码，Git 要求你设置姓名和电子邮件：\n\n```\n$ git config\
    \ user.email \"your_email@packtpub.com\"\n$ git config user.name \"Forename Surname\"\
    \n```\n\n如果要为所有 Git 仓库设置全局电子邮件和姓名，可以指定 --global 选项，如下所示：\n\n```\n$ git config\
    \ --global user.email \"your_email@packtpub.com\"\n$ git config --global user.name\
    \ \"Forename Surname\"\n```\n\n要验证设置，请键入：\n\n```\n$ git config user.email\nyour_email@packtpub.com\n\
    $ git config user.name\nForename Surname\n```\n\n### 提示\n\n全局 Git 配置存储在 /home/$USER/.gitconfig\
    \ 中，本地配置存储在 /path/to/git/repository/.git/config 中。默认情况下，本地仓库 Git 配置的更改将覆盖全局 Git\
    \ 配置的更改。\n\n在 Git 中提交更改时，使用 git commit 命令。它记录对仓库的更改，从而可以使用为提交生成的唯一 SHA-1 哈希来跟踪该提交。输入\
    \ git log [branch] 可以查看分支的历史概览。\n\n```\n$ git commit -m \"My initial commit\"\n\
    [master (root-commit) f01bdf2] My initial commit\n3 files changed, 11 insertions(+)\n\
    create mode 100644 Makefile\ncreate mode 100644 README\ncreate mode 100644 my_packt_project.c\n\
    $ git log\ncommit f01bdf29a2c9df1c2417542c5531f90e04c973a\nAuthor: Forename Surname\
    \ <your_email@packtpub.com>\nDate:   Sun Jan 1 00:00:00 2016 +0100\nMy initial\
    \ commit\n```\n\n当多个开发人员在同一个项目上工作时，每个用户使用自己的仓库本地克隆。默认情况下，Git 会拒绝推送到非裸仓库的更改。我们将逐步了解一个简单的示例，该示例将：\n\
    \n- 将我们的仓库转换为共享仓库\n- 克隆共享仓库\n\n共享仓库通常存储在服务器上，并且仓库必须创建为裸 Git 仓库。这可以通过在初始化 Git 仓库或克隆时使用\
    \ `--bare` 标志来完成。由于我们在之前的示例中使用了非共享仓库，我们将使用 `git clone --bare` 将其转换为共享仓库，然后可以删除旧仓库，改为使用裸仓库的克隆继续工作。\n\
    \n```\n$ cd /path/to/my/workdir\n$ git clone --bare /path/to/my_packt_project\
    \ my_packt_project.git\n$ rm -rf /path/to/my_packt_project\n```\n\n### 提示\n\n\
    裸仓库基本上是不包含工作目录的仓库。这将防止开发人员对仓库进行更改。根据命名约定，裸 Git 仓库应命名为 `name_of_my_repo.git`。\n\
    \n我们现在有了一个可供开发人员协作使用的裸仓库。接下来，我们继续克隆裸仓库的本地副本，可在开发新功能时使用。默认情况下，克隆仓库时你会处于名为 `master`\
    \ 的分支上。可以在 master 分支上完成所有工作；由于这只是本地克隆，不会破坏其他开发人员的任何内容。但强烈建议创建一个 **工作分支** 并在该分支中进行所有更改。这样，master\
    \ 分支始终处于稳定且已知的状态。当你是高级 Git 用户时，可能会并行处理多个功能，并且可能希望通过 master 分支集成其他开发人员处理的新功能。换句话说，为所有功能创建单独的分支是一个好习惯。\n\
    \n```\n$ git clone /path/to/my_packt_project.git\nCloning into 'my_packt_project'\n\
    $ cd my_packt_project\n```\n\n接下来，我们将创建一个名为 `my_new_feature` 的新分支，切换到它，并为项目开发一个微小的新功能。可以使用\
    \ `git branch` 列出所有可用的本地分支；如果在列出分支时添加 `-a` 标志，还会列出所有远程分支。\n\n### 提示\n\n远程分支是存在于已从中克隆的共享仓库中的分支。星号\
    \ (*) 帮助用户定位当前分支。\n\n```\n$ git branch\n* master\n$ git branch my_new_feature\n\
    $ git checkout my_new_feature\nSwitched to branch 'my_new_feature'\n```\n\n```\n\
    $ git branch\nmaster\n* my_new_feature\n$ git branch -a\nmaster\n* my_new_feature\n\
    remotes/origin/HEAD -> origin/master\nremotes/origin/master\n```\n\n我们现在处于新分支，是时候进行一些修改了。在此示例中，我们将向\
    \ makefile 添加一个名为 clean 的新目标。请记住在提交更改之前使用 git add 将更改添加到索引中。如果要列出更改，请在添加文件之前使用\
    \ git diff。\n\n### 注意\n\n如果已经使用 git add 添加了文件，可以在提交更改之前使用 git diff --cached 检查更改。\n\
    \n```\n$ vim Makefile\n$ git diff\ndiff --git a/Makefile b/Makefile\nindex c6466e0..d986116\
    \ 100644\n--- a/Makefile\n+++ b/Makefile\n@@ -1,2 +1,5 @@\nall:\n$(CC) my_packt_project.c\
    \ -o my_packt_project\n+\n+clean:\n+rm -f my_packt_project\n$ git add Makefile\n\
    $ git commit -m \"Makefile: Add a new target\"\n[my_new_feature 7c3d896] Makefile:\
    \ Add a new target\n1 file changed, 3 insertions(+)\n```\n\n我们的最后一步是将新更改发送到共享仓库，使用新更改更新本地\
    \ master，然后删除功能分支，因为它不再需要。当向共享仓库推送更改时，可以使用预定义的远程 origin；默认情况下，origin 指向我们克隆的仓库。推送更改时，需要指定要发送的修订版本以及目标分支。在大多数情况下，我们希望发送整个分支；如果是这样，可以使用\
    \ HEAD 获取当前分支的所有更改，如下所示：\n\n```\n$ git push origin HEAD:master\nCounting objects:\
    \ 5, done.\nDelta compression using up to 4 threads.\nCompressing objects: 100%\
