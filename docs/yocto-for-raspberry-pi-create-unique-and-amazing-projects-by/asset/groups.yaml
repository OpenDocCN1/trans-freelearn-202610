    # Installing automatically


    For the management of IPK packages, it is easy to create a package repository
    on our development workstation.


    The first step is to add to conf/local.conf the following variable:


    ```

    FEED_DEPLOYDIR_BASE_URI = http://<server-ip>:9999/ http://<server-ip>:9999/

    ```


    Thus, our image will include all references to our package repository on our web
    server based on busybox (httpd), which is listening on port 9999.


    The second step is to create the package index on our repository:


    ```

    $ source oe-init-build-env rpi-build

    $ bitbake package-index

    ```


    Apart from this, just create a web server listening on port 9999. The base directory
    will be the one where IPK packages are built. To make it easier to use the utility
    to connect busybox, use [httpd](http://wiki.openwrt.org/doc/howto/http.httpd).
    It is also possible to use Apache, Nginx, or lighttpd. We can launch the httpd
    server with the following command:


    ```

    $ cd rpi-build/tmp/deploy/ipk

    $ busybox httpd -p 9999

    ```


    To verify the proper operation of our package repository server, simply type opkg
    update from the Raspberry Pi:


    ```

    $ opkg update

    $ Downloading http://192.168.132.1:9999/....

    ```


    # Note


    For further information, do not hesitate to visit [http://www.yoctoproject.org/docs/current/dev-manual/dev-manual.html#using-runtime-package-management](http://www.yoctoproject.org/docs/current/dev-manual/dev-manual.html#using-runtime-package-management).'
