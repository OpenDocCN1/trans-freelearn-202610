    # ## Configuration of the SDK environment


    The first thing to do is source the environment variable for our toolchain. Use
    either of these commands:


    ```

    $ source /opt/poky/1.7.1/environment-setup-armv6-vfp poky-linux-gnueabi

    $ . ./opt/poky/1.7.1/environment-setup-armv6-vfp poky-linux-gnueabi

    ```


    # ## List of tools


    After this, our toolchain is in our system PATH variable, and we can take a look
    at all of the tools in the toolchain:


    ```

    $ arm-poky-linux-gnueabi-arm-poky-linux-gnueabi-addr2line arm-poky-linux-gnueabi-elfedit
    arm-poky-linux-gnueabi-gcc-ranlib arm-poky-linux-gnueabi-ld.bfd arm-poky-linux-gnueabi-readelf

    arm-poky-linux-gnueabi-ar arm-poky-linux-gnueabi-g++ arm-poky-linux-gnueabi-gcov

    arm-poky-linux-gnueabi-nm arm-poky-linux-gnueabi-size

    arm-poky-linux-gnueabi-as arm-poky-linux-gnueabi-gcc arm-poky-linux-gnueabi-gdb

    arm-poky-linux-gnueabi-objcopy arm-poky-linux-gnueabi-strings

    arm-poky-linux-gnueabi-c++filt arm-poky-linux-gnueabi-gcc-ar arm-poky-linux-gnueabi-gprof
    arm-poky-linux-gnueabi-objdump arm-poky-linux-gnueabi-strip

    arm-poky-linux-gnueabi-cpp arm-poky-linux-gnueabi-gcc-nm arm-poky-linux-gnueabi-ld
    arm-poky-linux-gnueabi-ranlib

    ```


    We can find our compiler (arm-poky-linux-gnueabi-gcc or arm-poky-linux-gnueabi-g++
    for C++ applications), our debugger (arm-poky-linux-gnueabi-gdb), some binary
    tools (GNU Binary Utilities), and so on.


    # ## Compilation


    Now, we can compile our first application with the external toolchain:


    ```

    $ ${CC} -o hello_world_pckt hello_world_pckt.c

    $ file hello_world_pcthello_world_pckt: ELF 32-bit LSB executable, ARM, EABI5

