  - '[PAGE 153]


    # # The Nunchuck''s protocol


    The Wii Nunchuck contains a controller that communicates through the i2c bus.
    In order to know where to store bytes written to it, the first byte must be an
    8-bit register address. In other words, each write() operation to the Nunchuck
    requires one register address byte, followed by data bytes.


    For a write operation, the first byte sent to the Nunchuck tells it where to start
    (the START condition).


    # ## Encryption


    The Nunchuck is designed to provide a specific encrypted link. However, this can
    be disabled through the following process:


    +   - Write 0x55 to the Nunchuck''s 0xF0 register

    +   - Pause

    +   - Write 0x00 to the Nunchuck''s 0xFB register


    | Write | Pause | Write | | |

    |---|---|---|---|---|

    | 0xF0 | 0x55 | - | 0xFB | 0x00 |


    Note that if you own a white Nunchuck, the process will be different:


    +   - Write 0x00 to the Nunchuck''s 0x40 register


    | Write | |

    |---|---|

    | 0x40 | 0x00 |


    # ## Note


    Once this has been successfully performed, all data is returned unencrypted.


    # ## Requesting sensor data


    The whole point of us using the Nunchuck is to read its sensor data. When requested,
    it should return six bytes of data, formatted as follows:'
  - '[PAGE 154]


    | Data byte receive | Address |

    |---|---|

    | Joystick X | 0x00 |

    | Joystick Y | 0x01 |

    | Accelerometer X (bit 9 to bit 2 for 10-bit resolution) | 0x02 |

    | Accelerometer Y (bit 9 to bit 2 for 10-bit resolution) | 0x03 |

    | Accelerometer Z (bit 9 to bit 2 for 10-bit resolution) | 0x04 |

    | Accel. Z bit 1 | Accel. Z bit 0 | Accel. Y bit 1 | Accel. Y bit 0 | Accel. X
    bit 1 | Accel. X bit 0 | C-button | Z-button | 0x05 |


    The following table illustrates the message sequence:


    | Write | Pause | Read | | | | | |

    |---|---|---|---|---|---|---|---|

    | 0x00 | - | 1 | 2 | 3 | 4 | 5 | 6 |'
