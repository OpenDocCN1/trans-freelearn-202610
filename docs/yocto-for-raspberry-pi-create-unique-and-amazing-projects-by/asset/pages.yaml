- pgno: 158
  md: "# Creating the Nunchuck recipe\n\nNow that our application is functional, we\
    \ can create our recipe so that BitBake can find it.\n\nHere is the recipe that\
    \ enables us to integrate the Nunchuck application into the Raspberry Pi:\n\n\
    ```\nDESCRIPTION = \"nunchuck i2c example\"\nLICENSE=\"GPLv2\"\nLIC_FILES_CHKSUM\
    \ = \"file://${COMMON_LICENSE_DIR}/GPL\n2.0;md5=801f808980d171dd6425610833a22dbe6\"\
    \nPR = \"r0\"\nSRC_URI = \"file://nunchuck.c\"\nS = \"${WORKDIR}\"\ndo_compile()\
    \ {\n\t${CC} ${CFLAGS} ${LDFLAGS} ${WORKDIR}/nunchuck.c -o    nunchuck_packt\n\
    }\ndo_install() {\n\tinstall -m 0755 -d ${D}${bindir}\n\tinstall -m 0755 ${S}/nunchuck_packt\
    \ ${D}${bindir}\n}\n```\n\nTo integrate the package into the Raspberry Pi environment,\
    \ we have to add the following line to raspberry-pack-image:\n\n```\n# Base this\
    \ image on core-image-minimal\ninclude recipes-core/images/core-image-minimal.bb\n\
    DESCRIPTION = \"Image for raspberry-pi\"\nIMAGE_FEATURES += \"ssh-server-dropbear\
    \ splash\"\n# Include modules in rootfs\nIMAGE_INSTALL += \" \\\\\n    kernel-modules\
    \ \\\\\n    gpio-packt \\\\\n    i2c-tools \\\\\n    spitools \\\\\n    nunchuck\
    \ \\\\\n    \"\n```"
