- pgno: 253
  md: '# # Summary


    In this final chapter of the book, we repeated the techniques we learned throughout
    the book. This was done by creating a home automation project, which can wirelessly
    turn on and off lamps in your home with help from a Raspberry Pi and a web browser,
    using your smartphone as the remote, for example.


    For our home automation project, we improved some of the examples used earlier
    in the book, such as the GPIO control binary and the Node.js examples. By evolving
    them, we revised how to modify existing recipes by appending them with new files
    or patching the old ones. The project also required you to revise how to create
    and integrate external layers. Further on, the chapter looked closer at some techniques
    and introduced you the usage of a specific package list in your project and how
    to use a serial connection and SSH to easily access and debug your Raspberry Pi.
    In order to complete the project, you were required to learn more deeply how the
    GPIO header and pins for the Raspberry Pi models are set up.


    Using the skills learned in this chapter will hopefully inspire you when developing
    new cool and crazy home automation projects for the Raspberry Pi platform.'
