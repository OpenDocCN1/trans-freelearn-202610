  md: "# Deploying raspberry-pckt-image\n\nNow that we have a functional application\
    \ (webserver-pckt), we can add it to our custom image, raspberry-pack-image:\n\
    \n```\n# Base this image on core-image-minimal\ninclude recipes-core/images/core-image-minimal.bb\n\
    DESCRIPTION = \"Image for raspberry-pi\"\nIMAGE_FEATURES += \"ssh-server-dropbear\
    \ splash\"\n# Include modules in rootfs\nIMAGE_INSTALL += \" \\\\\n kernel-modules\
    \ \\\\\n gpio-pckt \\\\\n i2c-tools \\\\\n spitools \\\\\n nunchuck \\\\\n v4l-utils\
    \ \\\\\n nodejs \\\\\n webserver-pckt \\\\\n\"\n```\n\nAfter doing this, we can\
    \ start creating our image and then mount it on an SD card:\n\n```\n$ bitbake\
    \ raspberry-pckt-image\n```"
