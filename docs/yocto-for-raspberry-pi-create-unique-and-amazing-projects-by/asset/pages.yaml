- pgno: 214
  md: '# Contributing to the Yocto Project


    Many open source projects, including the Yocto Project, use mailing lists. These
    lists are mainly used for discussions about the project and public review of patches
    sent up by the people contributing to the project.


    Since the Yocto Project is an umbrella project for a large set of projects, one
    mailing list isn’t enough. For example, there are separate lists for BitBake,
    OpenEmbedded-Core, and Yocto, where the Yocto includes different external layers,
    such as meta-raspberrypi and meta-qt5. When sending e-mail to a list used by more
    then one project, a prefix is required if the mail is intended for a specific
    subproject (the syntax for the prefix is `[layername] subject`). The following
    screenshot illustrates an example of sending a series of patches to meta-raspberrypi:


    +   - [yocto] [meta-raspberrypi]PATCH 0/5) Various upgrade/fixes from Technux
    Petter Mabäckner

    +     - [yocto] [meta-raspberrypi]|PATCH 1/5] gitignore: Ignore .swp files Petter
    Mabäckner

    +     - [yocto] [meta-raspberrypi]|PATCH 2/5] linux-raspberrypi: Update 4.1 recipe
    to 4.1.15 Petter Mabäckner

    +     - [yocto] [meta-raspberrypi]|PATCH 3/5] rpi-config: I2C support Petter Mabäckner

    +     - [yocto] [meta-raspberrypi]|PATCH 4/5] pitft: Add basic support for PiTFT
    Petter Mabäckner

    +       - [yocto] [meta-raspberrypi]|PATCH 4/5] pitft: Add basic support for PiTFT
    Khem Raj

    +         - [yocto] [meta-raspberrypi]|PATCH 4/5] pitft: Add basic support for
    PiTFT Andrei Gherzan

