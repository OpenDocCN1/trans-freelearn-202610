- pgno: 199
  md: '# Developing applications and using them on an LCD display


    At this point, we have an image based on the Yocto Project with PiTFT display
    support up and running on our Raspberry Pi. In this section, we will develop a
    graphical application that we can use with our fancy touchscreen. When developing
    graphical applications, a couple of different frameworks exist. Qt is one of the
    most famous graphical frameworks for embedded devices and exists in a free software
    version. In this section, we will go through how to set up and develop a graphical
    application for embedded Linux environments using Qt and EGLFS. Qt is a cross-platform
    application framework, so besides being able to run on various types of hardware,
    it can also be used in many different software platforms (such as X11, OS X, Windows,
    and EGLFS). EGLFS, which we will be using in our example, is basically a platform
    plugin used for running Qt applications on top of EGL and OpenGL ES. In fact,
    it will not even require a window system (such as X11) to work, which makes it
    highly suitable for embedded Linux.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Developing a custom application using Qt


    When developing an application based on Qt using the Yocto Project, we need to
    set up Qt in our layer. Two standard methods exist for developing a graphical
    application: either build your application against an exported SDK, or create
    a new recipe for your application. In this example, we will develop our application
    against an exported SDK. To succeed with getting our new application to build
    and run on the target, we need to perform these steps.


    +   - Add the external layers required for Qt

    +   - Export the SDK containing Qt support

    +   - Create the Qt application and build it against the exported SDK

    +   - Set up an image with Qt support for the target

    +   - Run Qt applications on the official Raspberry Pi 7"" touchscreen


    There exist a number of different Qt versions, where Qt5 is the latest. We will
    use the meta-qt5 external layer when developing our new application. First, we
    need to download meta-qt5 and enable the usage of it in our project:


    ```

    $ git clone https://github.com/meta-qt5/meta-qt5.git

    ```


    Add meta-qt5 to local/bblayers.conf:


    ```

    $ cat local/bblayers.conf

    # LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf

    # changes incompatibly

    LCONF_VERSION = "6"


    BBPATH = "${TOPDIR}"

    BBFILES ?= ""


    BBLAYERS ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    /path/to/poky/meta-yocto-bsp \

    /path/to/meta-raspberrypi \

    /path/to/meta-openembedded/meta-multimedia \

    /path/to/meta-qt5 \

    "

    BBLAYERS_NON_REMOVABLE ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    "

    ```


    Next, we need to export the SDK and unpack it to a preferred location:


    ```

    $ bitbake meta-toolchain-qt5

    $ .tmp/deploy/sdk/poky-glibc-x86_64-meta-toolchain-qt5-cortexa7hf-vfp-vfpv4-neon-toolchain-2.0.1.sh

    ```


    The path might be different, depending on which model of the Raspberry Pi and
    which release of the Yocto Project you are using.


    # Note'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'If you are unsuccessful with building meta-toolchain-qt5, you can try to build
    it without the X11 and Wayland packages. Using X11 and Wayland together with qt5
    has been been problematic at times when using meta-raspberrypi. Use this command:
    $ echo "DISTRO_FEATURES_remove = \"x11 wayland\"" >> conf/local.conf.


    If you still have problems building, include the meta-packt-qt5 layer and try
    again. The layer contains some workarounds for qt5 on Raspberry Pi. Refer to the
    readme file within the layer for additional information.


    Set up the environment for using the cross compiler:


    ```

    $ cd /path/to/extracted_sdk

    $ source environment-setup-cortexa7hf-vfp-vfvp4-neon-poky-linux-gnueabi

    $ which qmake

    /path/to/extracted_sdk/sysroots/x86_64-pokysdk-linux/usr/bin/qt5/qmake

    ```


    Once the SDK is in place and we have set up the cross compiler, we are ready to
    build our first Qt application for the Raspberry Pi. The first example is a simple
    Qt application based on C++ that contains some clickable widgets. When building
    a Qt application from the command line, qmake can be used to create a project
    and generate the makefile, like so:


    ```

    $ tar -zxf qt_packtpub_app.tar.gz

    $ cd qt_packtpub_app

    $ ls

    qt_packtpub_app.cpp window.cpp window.h

    $ qmake -project "QT += widgets"

    $ qmake

    $ make

    ```


    ```

    $ file qt_packtpub_app

    qt_packtpub_app: ELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), dynamically
    linked, interpreter /lib/ld-linux-armhf.so.3, for GNU/Linux 2.6.32, BuildID[sha1]=4fa5ba7143d8e7fd240da45a9143e9d285371d80,
    not stripped

    ```


    Once we have our application ready, we need to generate an image with Qt support
    for the target that we can use when testing our new application. We will use rpi-basic-image
    as a base, with some additions on top of it. In order to run our Qt application
    on the target, we need to add a set of packages. For this purpose, a predefined
    group of packages called packagegroup-qt5-toolchain-target can be used. Of course,
    it''s possible to manually point out required Qt5 packages in order to reduce
    footprint, for example. But in this example, we will keep it simple and ensure
    that everything we need is included. As stated earlier in the chapter, EGLFS works
    without any need for a window system, so we can remove X11 and Wayland support
    to reduce the footprint of the image. All these operations can be specified in
    local.conf:


    ```

    $ echo "IMAGE_INSTALL_append_pn-rpi-basic-image = " packagegroup-qt5-toolchain-target
    qt5-opengles2-test"" >> conf/local.conf

    $ echo "DISTRO_FEATURES_remove = \"x11 wayland\"" >> conf/local.conf

    ```


    When the project is configured, we can build the basic image:


    ```

    $ bitbake rpi-basic-image

    ```'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Remember to add the device tree needed for the Raspberry Pi 7 touchscreen,
    as described earlier in the chapter:


    ```

    $ echo "dtoverlay=rpi-ft5406" >> /path/to/sdcard/boot/config.txt

    ```


    Transfer the newly built application to the target and run it:


    ```

    $ /path/to/qt_packpub_app -platform eglfs

    ```


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_202_0.png)


    > *The qt_packpub_app application running on the Raspberry Pi 7 touchscreen*


    If you were observant during the earlier steps, you would also have seen that
    we added a package named qt5-opengles2-test to our image. This package will produce
    an OpenGL-based Qt application, which we can use to demonstrate multi-touch actions
    on our touchscreen:


    ```

    $ qt5-opengles2-test -platform eglfs

    ```'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Summary


    In this chapter we gained some basic knowledge about the Linux kernel and its
    release strategy and the differences between the mainline kernel and the official
    Raspberry Pi Linux kernel. We also learned how to configure and compile the Linux
    kernel using a cross compiler. When changing the defconfig file within meta-raspberrypi,
    the kernel recipe requires some special treatment as compared to the normal Yocto
    Project procedure. This chapter demonstrated two examples of how this can be done.
    Later, we also went through some basic kernel configuration required for setting
    up two different touchscreens; this also included some basic understanding about
    device trees and how to configure the Raspberry Pi using ''them.''


    The chapter also covered some examples of how to run a Yocto-based image with
    a windowing system on the Raspberry Pi, using two different touchscreens: the
    Raspberry Pi 7 touchscreen and PiTFT 2.8 resistive touchscreen. In the last section
    of the chapter, we learned about how to run Qt applications built against an SDK
    generated using the Yocto Project, using a Raspberry Pi and the Raspberry Pi 7
    touchscreen.


    In the next chapter, we will learn how to contribute to the meta-raspberrypi project.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# # Chapter 11. Contributing to the Raspberry Pi BSP Layer


    In this chapter, we will learn how to contribute a custom tool to the meta-raspberrypi
    layer. Common terms associated with the area, such as "open source", "community",
    and "upstream", will be explained. We will also learn the basics of Git, together
    with some more advanced Git commands, that can be used together with the sendmail
    tool.'
