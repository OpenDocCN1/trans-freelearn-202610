- pgno: 233
  md: '# # Creating the server side


    We now have the base ready and can continue with implementing the project-specific
    parts. The Raspberry Pi that is connected with the circuit and the lamp will act
    as a server. It will run a tiny web server that can be reached through a client
    of your choice using a web browser.


    For the server side, we will adapt and evolve the server example used in [Chapter
    9, Making a Media Hub on the Raspberry Pi](http://placeholder), and combine it
    with an updated version of the gpio-packet recipe from [Chapter 5, Creating, Developing,
    and Deploying on the Raspberry Pi](http://placeholder) . To start with, we need
    to add the meta-packet_rpi layer used in earlier chapters of the book. We have
    already ensured that our newly created layer has a higher priority then meta-packet_rpi,
    but let''s also add it in a dependency order in bblayers.conf. Here is the complete
    bblayers.conf file that will be used in this project:


    ```

    # LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf

    # changes incompatibly

    POKY_BBLAYERS_CONF_VERSION = "1"

    BBPATH = "${TOPDIR}"

    BBFILES ?= ""

    BBLAYERS ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-poky \

    /path/to/poky/meta-yocto-bsp \

    /path/to/meta-raspberrypi \

    /path/to/meta-openembedded/meta-oe \

    /path/to/meta-packet_rpi \

    /path/to/meta-packet-iot \

    "

    BBLAYERS_NON_REMOVABLE ?= " \

    /home/path/to/git/poky/meta \

    /home/path/to/git/poky/meta-yocto \

    "

    ```


    Next, we should make some minor changes to gpio-packet in order to make it more
    suitable for our project. These changes will be made as a integration patch. The
    original code uses GPIO4, which is one of the pins that are set high by default.
    We will instead use GPIO17, which is one of the pins that defaults to low.


    To change the gpio_example code to use GPIO17 instead, we can create a new integration
    patch that changes the behavior only when we apply the meta-packet-iot layer.
    The minor changes required are as follows:


    ```

    --- gpio_example.c.orig 2016-03-10 16:55:04.334832221 +0100

    +++ gpio_example.c 2016-03-10 16:54:13.400537071 +0100

    @@ -39,7 +39,7 @@

    /*****************************************************************************/

    #define LENGTH 128

    #define SYSFS_GPIO_DIR "/sys/class/gpio/"

    -#define GPIO_PIN 4

    +#define GPIO_PIN 17

    #define BUFFER_SIZE 255

    #define DEBUG 1

    ```'
  merge: -1
  img_proc: true
