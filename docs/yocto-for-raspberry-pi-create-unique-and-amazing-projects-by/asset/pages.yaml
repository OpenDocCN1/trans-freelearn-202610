    \ is increased each time  build/conf/bblayers.conf\n# changes incompatibly\nLCONF_VERSION\
    \ = \"6\"\n\nBBPATH = \"${TOPDIR}\"\nBBFILES ?= \"\"\n\nBBLAYERS ?= \" \\\n/home/packet/RASPBERYPI/poky/meta\
