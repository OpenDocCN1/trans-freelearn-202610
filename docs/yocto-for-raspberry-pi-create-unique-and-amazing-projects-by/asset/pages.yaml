- pgno: 112
  md: "# # Our application - creating the recipe\n\nNow that our application is functional,\
    \ we can create our recipe.\n\nThe first step is to create the file; for example,\
    \ we can choose gpio-packet_0.1.bb.\n\n+   * gpio-packet represents the name of\
    \ the package (the PN variable).\n+   * 0.1 represents the version number of the\
    \ recipe (the PV variable).\n+   * .bb represents the file extension (Bitbake).\n\
    \nThe second step consists of placing the source code in a local repository, like\
    \ this:\n\n```\n$ mkdir gpio-packet\n$ cp /home/packet/gpio-example.c files/\n\
    $ ls gpio-packet\ngpio-example.c\n```\n\nThe recipe must be placed next to the\
    \ gpio-packet directory, as shown here:\n\n```\n$ ls\ngpio-packet/ gpio-packet.bb\n\
    ```\n\nAfter that, we can fill out our recipe like this:\n\n```\nDESCRIPTION =\
    \ \"gpio example\"\nLICENSE=\"GPLv2\"\nLIC_FILES_CHKSUM = \"file://${COMMON_LICENSE_DIR}/GPL-\n\
    2.0;md5=801f80980d171dd6425610833a22dbe6\"\n\nPR = \"r0\"\n\nSRC_URI = \"file://gpio_example.c\"\
    \n\ndo_compile() {\n\t${CC} ${CFLAGS} ${LDFLAGS} ${WORKDIR}/gpio_example.c -o\n\
    \tgpio_example\n}\n\ndo_install() {\n\tinstall -m 0755 -d ${D}${bindir}\n\tinstall\
    \ -m 0755 ${S}/gpio_example ${D}${bindir}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 113
  md: '# # The recipe explained


    Let''s look at the various parts of the preceding recipe.


    DESCRIPTION contains the description of the application. This information is used
    when the packet is generated so that the user can have this information through
    the package manager.


    LICENSE contains the program license (GPLv2 in this example).


    The LIC_FILES_CHKSUM variable contains checksums of the license text in the recipe
    source code. Poky uses this to track changes in the license text of the source
    code files.


    PR contains the revision of the recipe used to build the package.


    SRC_URI determines what files and source code are needed and where that source
    code should be obtained from (in this case, from the gpio-pckt folder).


    The do_compile() method will generate our binary that will be deployed on the
    Raspberry Pi.


    The do_install() method will install our binary in the tree in the same way as
    installed on Raspberry Pi (in this case, the binary will be placed in /usr/bin).


    The following table lists some paths used by Bitbake:


    | base_bindir | /bin |

    | base_sbindir | /sbin |

    | base_libdir | /lib |

    | datadir | /usr/share |

    | sysconfdir | /etc |

    | servicedir | /srv |

    | bindir | /usr/bin |

    | sbindir | /usr/sbin |

    | libdir | /usr/lib |

    | includedir | /usr/include |


    Now that we have our recipe, we can include it in the image. To do this, we must
    put all files in the main tree. We will create a folder within meta-raspberrypi/recipes-devtools,
    as shown here:'
  merge: -1
  img_proc: true
- pgno: 114
  md: '```

    $ cd meta-raspberrypi/recipes-devtools

    $ mkdir gpio-pakt-book

    ```


    In order that Bitbake find our recipe, we can put the different files in this
    folder, like this:


    ```

    $ cd gpio-pakt-book

    $ mv /home/packet/gpio-pakt.bb

    $ mv /home/packet/gpio-pakt

    ```


    The last step consists of integrating our recipe with the image. To do this, we
    can add the following variable to the conf/local.conf file:


    ```

    IMAGE_INSTALL_append += " gpio-pakt"

    ```


    Now, we can launch Bitbake, and then test our program on the Raspberry Pi:


    ```

    $ bitbake rpi-basic-image

