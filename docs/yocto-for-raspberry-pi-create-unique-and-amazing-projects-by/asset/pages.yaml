- pgno: 10
  md: '# # About the Authors


    **Pierre-Jean TEXIER** is an embedded Linux engineer at Amplitude Systèmes (a
    pioneer in the marketing of Ytterbium femtosecond lasers) since 2014, where he
    maintains a custom SoC called i.MX6 with the Yocto Project (meta-fsl-arm), which
    is made by a French company, EUKREA.


    He is a graduate of ESTEI school at Bordeaux, where he studied for 3 years to
    become an embedded Linux engineer.


    He is a big supporter of the world of free software and the embedded world. His
    knowledge includes C/C++, Yocto, Linux, Bash, and kernel development, but he is
    also open to trying new things and testing new technologies.


    *Firstly, I want to thank my patient wife for her support during my writing sessions.
    I also give thanks my parents and my brother; without them, this book possibly
    would not have happened.I would also like to thank all of the mentors that I''ve
    had over the years—mentors such as Cyril SAGONERO, Sylvain LE HENAFF, Pierre BORDELAIS,
    Vincent POULAILLEAU, Fabrice BONNET, Jean-Claude PERESSINOTTO, and Pierre AUBRY.
    Without learning from these teachers, there is not a chance I could be doing what
    I do today.To finish, I would like to thank Eric MOTTAY, the CEO of Amplitude
    Systèmes; Luca TESTA, the head of the electronics team at Amplitude Systèmes for
    his trust; and Hitesham WOODHOO, Alexandre GAMONET, Kevin PINTO, and Guillaume
    MACHINET for all the discussions about the Raspberry Pi during coffee breaks.*


    **Petter Mabäcker** is a senior software developer specializing in embedded Linux
    systems. For the past 8 years, he has been working with embedded Linux professionally.
    Currently, Petter works as a Scrum Master and senior software developer at Ericsson
    AB. Additionally, his knowledge includes C/C++, shell scripting, Yocto Project
    (including BitBake and OpenEmbedded), Scrum, and Git.


    In 2013, Petter started the small business Technux, which he runs as a side project
    in parallel with his duties at Ericsson. Some of the focus areas of the business
    are open source embedded Linux projects, such as the Yocto Project, together with
    different projects that involve the Raspberry Pi. As part of the work with Technux,
    Petter works as a contributor to the Yocto Project (including the Raspberry Pi
    BSP layer, known as meta-raspberrypi ).


    *I would like to give special thanks to my beloved family for letting me spend
    the time needed to finalize this book besides all my other duties.*'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # About the Reviewers


    **Burt Janz** has been involved with computing systems since he assembled his
    first microcomputer in the US Navy in 1975. Starting with the development of device
    drivers and low-level interfaces on *nix systems in the early 1980s, Mr. Janz
    has been writing complex software products for over 30 years. His expertise stretches
    from the design and implementation of low-level operating system internals and
    device drivers to complex applications for embedded and handheld devices and government
    and enterprise-level systems.


    A 1988 graduate with high honors in BSCS from Franklin Pierce College, he was
    an adjunct professor at Daniel Webster College for 11 years in their evening-based
    Continuing Education program, developing embedded and enterprise-level software
    during the day. His curricula of instruction included courses from a basic introduction
    to computers to programming languages (C/C++/Java) to networking theory and network
    programming, database theory and schema design, artificial intelligence systems.
    Along the way, Mr. Janz has written magazine articles and other technical commentaries
    as well as having been involved with one of the first over-the-counter Linux distributions
    (Yggdrasil, in 1994).


    Mr. Janz has designed complete embedded and enterprise-level software system architectures
    as a lead architect and has led teams from the requirements and design phases
    of new products through to completion and delivery to customers. He has experience
    with x86, 68xxx, PPC, ARM, and SPARC processors and continues to write kernel
    threads and kmods, open firmware device trees, drivers for new and proprietary
    hardware, FPGA I/P core interfaces, applications, libraries, and boot manager
    code. He may be contacted directly by email at bhjanz@ccsneinc.com or burt.janz@gmail.com
    or via LinkedIn.


    **Dave (Jing) Tian** is a PhD student and a security researcher at the Computer
    & Information Science & Engineering (CISE) department of the University of Florida.
    He is a founding member of the SENSEI center and the Florida Institute for Cybersecurity.
    His research involves system security, embedded systems, trusted computing, and
    compilers. He has an interest in Linux kernel hacking, compiler hacking, and machine
    learning. He also spent a year on AI and machine learning direction and taught
    Python and operating system classes at the University of Oregon. Before that,
    he worked as a software developer at the Linux Control Platform (LCP) group at
    Alcatel-Lucent (former Lucent Technologies) R&D department for around 4 years.
    He holds BS and ME degrees in EE from China. He can be reached via his blog (http://davejingtian.org)
    and e-mail (root@davejingtian.org).


    Thanks to the authors, who have done a good job, and the editors, who made this
    book perfect and offered me the opportunity to review such a nice book.


    **Helmi ROMDHANI** is an embedded HW/SW engineer. He graduated from the national
    engineering school of Sousse, Tunisia. His primary job is at Tunisian Embedded
    Systems, which specializes in the research, development, prototyping, and installation
    of embedded systems. He specializes in embedded telecommunication field, especially
    in developing embedded software for residential gateways. He frequently works
    with embedded platforms (Raspberry Pi and Arduino), Linux, shell, Yocto, Python,
    C# (.Net), Android, databases (MySQL), web services, and Proteus Isis (PCB design).


    Any contact is welcome at helmiromdhany@gmail.com.'
  merge: -1
  img_proc: true
