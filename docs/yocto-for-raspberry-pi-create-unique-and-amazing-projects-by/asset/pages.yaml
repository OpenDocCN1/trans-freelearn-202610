    $ echo "dtoverlay=rpi-ft5406" >> /path/to/sdcard/boot/config.txt

    ```


    Now, you''re ready to rock and will be able to boot a window system with touch
    support using your Raspberry Pi 7 touchscreen.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_196_0.png)


    *A Raspberry Pi 7 touchscreen running core-image-sato*'
  merge: -1
