- pgno: 249
  md: '# Controlling the lamp using the Raspberry Pi


    At this point, we can control the relay locally from our board. Next, it''s time
    to connect the lamp to our relay module.


    # Note


    WARNING: This project require basic knowledge of electricals. We strongly discourage
    using high-voltage power if you don''t have the knowledge or experience. The recommendation
    is to use a low-voltage 12-V power supply.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_249_0.png)


    A one-channel relay module


    Before we connect the lamp, we need to go through some basics about how the relay
    module will be used. Look closely at the following relay; it contains C, NC, and
    NO openings on the opposite side to where we inserted the GPIO jumper cables.
    These slots will be used to connect the lamp to the relay.


    The C on the relay stands for common connection, and we will connect the power
    from our external power supply to this port. Next, we have NC and NO, which stand
    for **normally closed** and **normally open**. In our project, we will be using
    NO. The reason for this is that it will work like a switch. By default, there
    will be no contact between C and NO, but when we trigger the relay using the signaling
    from our GPIO pin, we will turn off the relay and that will open the circuit.
    Using NC instead of NO will give you the opposite behavior.


    The lamp and the external power supply (12V strongly preferred for safety reasons)
    will be connected as shown in the following figure. Note that if no adapter is
    used for the lamp, you might need to open the outer shell of the cable to get
    the positive and negative wires. The black negative cable can be connected right
    from the external power supply to the lamp. The positive must be inserted from
    the power supply to the C slot on the relay. Finally, we need to connect the red
    positive cable from the lamp to the NO slot in the relay to get the required behavior
    as described earlier.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/76681dcfb8cd2bd107d0c06ab088f916_250_0.png)


    When all the physical connections are in place, we can check whether everything
    works by using the gpio_example binary again. At this point, our Raspberry Pi
    is probably hard to move, so we will use SSH to gain access to the board and turn
    the light on and off.


    ```

    $ ssh root@192.168.x.x

    root@raspberrypi2:~#

    root@raspberrypi2:~# gpio_example --led=1

    root@raspberrypi2:~# gpio_example --led=0

    ```


    If everything has been set up in the correct way, you should see the light go
    on and off. In the next subsection, we will continue with controlling the light
    remotely by using a smartphone.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# # Turning on/off the lamp from a smartphone


    Our home automation project is nearly finished, but one important thing remains:
    we need to ensure that it’s possible to control the light using a remote device,
    such as a smartphone. First of all, we need to check on the board whether the
    web server is present:


    ```

    $ ps | grep server

    295 root 2732 server.init

    ```


    If the server for some reason hasn''t auto-started, we can try to manually start
    it using this command:


    ```

    $ /etc/init.d/server-packt-init start

    starting Nodejs app: server.init... done.

    root@raspberrypi2:~#  info - socket.io started

    listening on *:3344

    ```


    If we manually perform some changes to the web server directly on the Raspberry
    Pi, we can restart the web server by using this command:


    ```

    $ /etc/init.d/packt-server restart

    stopping Nodejs app: server.init... stopped node (pid 295)

    done.

    starting Nodejs app: server.init... done.

    ```


    Now, we can start the web browser on our smartphone and go to http://my_rpi_ipaddress:3344.
    You will see the same page that we saw when we opened index.html earlier in the
    chapter. The format might look a little bit different on a smartphone, but the
    red and green buttons will be there! Try tapping them and you will see the light
    go on and off.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_251_0.png)


    A real-world example of the final result of the home automation project.


    At this point, your home automation project is up and running, and you have managed
    to get one step closer to a wirelessly connected home. Hopefully, this project
    will give you plenty of ideas of how to set up other fun and creative home automation
    projects using a Raspberry Pi.'
