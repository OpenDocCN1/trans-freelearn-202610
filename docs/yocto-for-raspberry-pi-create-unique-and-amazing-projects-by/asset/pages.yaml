- pgno: 131
  md: '# # Adding gpio-packt to meta-packt_rpi


    To test this layer, we will integrate the application developed in [Chapter 5,
    Creating, Developing, and Deploying on the Raspberry Pi](https://www.packtpub.com/)
    ( gpio-packt). This will allow us to implement our layer step by step so that
    it is completely reusable for various projects. The hierarchy of your layer should
    look like this with the inclusion of this recipe:


    ```

    ```

    $ tree meta-packt_rpi/

    meta-packt_rpi/

    ├── conf

    │   └── layer.conf

    ├── COPYING.MIT

    ├── README

    ├── recipes-custom

    │   └── gpio-packt

    │       ├── gpio-packt

    │       │   ├── gpio-example.c

    │       │   └── gpio-packt.bb

    ├── recipes-example

    │   └── example

    │       ├── example-packt-0.1

    │       │   ├── example.patch

    │       │   └── helloworld.c

    │       └── example-packt_0.1.bb

    ├── recipes-example-bbappend

    │   ├── example-bbappend

    │   ├── example-packt-0.1

    │   │   └── example.patch

    │   └── example-packt_0.1.bbappend

    ```

    ```


    As with any other extra package for our image, the build system needs to be aware
    that you want to include gpio-packt. For this purpose, edit your /conf/local.conf
    configuration file and add the following line to the bottom:


    ```

    IMAGE_INSTALL_append = " gpio-packt"

    ```


    This line tells the build system to include the gpio-packt package when creating
    the final image. If for some reason the variable already exists, just append the
    gpio-packt package name at the end, like this:


    ```

    IMAGE_INSTALL_append = " app1 app2 gpio-packt"

    ```


    Now, if we want to test it, we can launch BitBake with the following command and
    then test our program on the Raspberry Pi:


    ```

    $ bitbake rpi-basic-image

    ```'
