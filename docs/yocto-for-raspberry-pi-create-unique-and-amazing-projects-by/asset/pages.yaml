- pgno: 170
  md: "# # server.js\n\nThe server.js file creates a server on the listening port\
    \ 3344 and will be responsible for creating a socket (rpi_temperature) that contains\
    \ the CPU temperature of Raspberry Pi. The socket function uses, among others,\
    \ the vcgencmd command ([https://github.com/raspberrypi/firmware/blob/master/opt/vc/bin/vcgencmd](https://github.com/raspberrypi/firmware/blob/master/opt/vc/bin/vcgencmd)),\
    \ permitting us to monitor the CPU temperature, as shown here:\n\n```\nsetInterval(function()\n\
    {\n    child = exec(\"vcgencmd measure_temp | awk -F:\", function\n    (error,\
    \ stdout,\n    stderr)\n    {\n    if (error != null)\n    {\n    console.log('exec\
    \ error: ' + error);\n    }\n    else\n    {\n    var date = new Date().getTime();\n\
    \    var temp = parseFloat(stdout);\n    socket.emit('rpi_temperature', date,\
    \ temp);\n    }\n    }\n    }); 1000);\n```\n\n# ## Note\n\nFor further information\
    \ about vcgencmd, you can visit the following page: [http://elinux.org/RPI_vcgencmd_usage](http://elinux.org/RPI_vcgencmd_usage)"
  merge: -1
  img_proc: true
