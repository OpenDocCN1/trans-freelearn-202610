- pgno: 160
  md: '# # V4L presentation


    V4L is a video API for Linux. It is integrated into the Linux kernel. It is an
    abstract layer between video software and video devices. It allows the capture
    of video streams and pictures from digital camcorders, video capture cards, TV
    and radio tuners, webcams, and so on.


    For example, it is possible to work with OpenCV (to retrieve the video stream
    through /dev/video) and Qt to display content (using a framebuffer or X11).'
  merge: -1
