- pgno: 205
  md: '# Open source


    **Open source** can be described as source code available to the general public.
    Open source software can be read, modified, and redistributed by anyone. This
    means that developers can use the original code in their own projects without
    paying any license fee to the owner of the code. Successful open source projects
    are often built as a community of developers that collaborates and ensures that
    the open source projects are moving in the intended direction.


    # Tip


    The Linux kernel and OpenStack are two of the most famous open source projects.
    The Yocto Project and it''s subprojects are other examples of large open source
    projects, especially within the embedded world.


    Open source communities usually consist of at least one **maintainer**. A maintainer
    is a person responsible for integrating patches into the project and building
    the source code. In the integration part, the maintainer often has an important
    role of either reviewing the patches sent up by developers in the community or
    making sure it''s done by someone else with the right knowledge. In large open
    source projects such as the Linux kernel, a large number of maintainers exists
    for different subparts of the kernel. They also appoint a maintainer for each
    release of the software, who is responsible to maintain the release by, for example,
    ensuring that important bug fixes are backported.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Contributing to open source projects


    Open source projects are heavily dependent on what people give back to the project,
    for example, submitting error reports if they find faults in the software or helping
    the project with solving bugs or developing new features. The community behind
    an open source project is often limited and doesn''t have the resources to do
    everything by itself. Large projects such as the Linux kernel, OpenStack, and
    the Yocto Project have large companies behind them, allocating resources for helping
    out with those projects. The reason for this is obvious: the companies are using
    the project in commercial products and it''s in their interest to make sure that
    the product has good progress. Many companies also use their own version of the
    project and want to contribute features and bug fixes in order to decrease the
    integration cost.


    # Tip


    When working with open source, the term upstream is used from time to time. Upstream
    could basically be summarized as the original source. The phrase "merge upstream"
    means that the patch in question should be integrated in the original source code
    of the project.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# # Exploring Git


    Git is the version control system used within the Yocto Project, including the
    Raspberry Pi BSP layer (meta-raspberrypi). Therefore, Git is a central part that
    you need to master before considering contributing to the Yocto Project and its
    subprojects.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # What is Git?


    Git is a distributed version control system that has been around since 2005 and
    is designed to handle projects with speed and efficiency, regardless of size.
    It was originally created to handle the source code of the Linux kernel. Git is
    free and open source and can be used by anyone without any need to pay licensing
    fees. The design of Git is highly suited to the manner of working used within
    open source projects. Besides the possibility of using distributed development,
    it has an easy logging mechanism to record who did what, cryptographic authentication
    of history, and an easy way to create branches, among other things.


    One of the fundamental differences between many other distributed version control
    systems (VCS, subversion, Bazaar, and so on) is how Git stores information. In
    Git, the data can be seen as a snapshot of a miniature filesystem. When saving
    the state of your project, a snapshot is taken of that state and a reference is
    saved.


    # ## Tip


    The basic Git workflow goes something like this:


    +   - You modify files in your working directory

    +   - You stage the files, adding snapshots of them to your staging area

    +   - You perform a commit, which takes the files as they are in the staging area
    and stores that snapshot permanently to your Git directory"


    For more information, visit https://git-scm.com/book/en/v2/Getting-Started-Git-Basics.'
  merge: -1
  img_proc: true
- pgno: 209
  md: "# Working with Git\n\nA project in Git is called a repository. Most of the\
    \ work can be done locally by cloning the main repository to your preferred working\
    \ directory. This is one of the reasons why Git is often considered very fast,\
    \ when compared with other version control systems that need network access for\
    \ many operations.\n\nLet's go through some basic examples, which will teach you\
    \ how to:\n\n+   - Import an existing project to a Git repository\n+   - Create\
    \ your first commit\n+   - Convert to a shared repository\n+   - Clone a local\
    \ version of the shared repository\n+   - Create a work branch\n+   - Push a commit\
    \ to your shared repository\n+   - Update the cloned repository with the latest\
    \ changes\n\nWhen importing an existing project into a new Git repository, we\
    \ must first initialize an empty Git repository. This can easily be done within\
    \ the existing source tree of our project:\n\n```\n$ tar -zxf my_packt_project_ch_11_01.tar.gz\n\
    $ cd my_packt_project\n$ git init\nInitialized empty Git repository in  /path/to/repo/my_packt_project/.git/\n\
    ```\n\nWhen initializing a new Git repository, a new directory, .git, is created.\
    \ This directory contains all Git-related information about your new repository.\
    \ Among others things, it contains the main Git configuration file, config, which\
    \ contains the Git settings for your project. Another frequently used file within\
    \ this directory is HEAD, which contains a reference to your current branch.\n\
    \nAfter the empty Git repository has been created, we can continue with adding\
    \ all the content of our project to the new repository. A useful command to obtain\
    \ the current status of your branch and repository is git status. When Git isn't\
    \ aware of a file, it will show up under Untracked files, as shown here:\n\n```\n\
    $ git status\nOn branch master\nInitial commit\nUntracked files:\n  (use \"git\
    \ add <file>...\" to include in what will be committed)\nMakefile\nREADME\nmy_packt_project.c\n\
    nothing added to commit but untracked files present (use \"git add\" to track)\n\
    ```\n\nWe can add all files and/or changes with a single command, but be aware\
    \ that it will add build output as well. So, when using git add --all, make sure\
    \ that you have removed unwanted files first. Then, we can use git status again\
    \ to check whether all the expected files are listed:\n\n```\n$ git add --all\n\
    $ git status\n```"
  merge: -1
  img_proc: true
- pgno: 210
  md: '```

    On branch master

    Initial commit

    Changes to be committed:

    (use "git rm --cached <file>..." to unstage)

    new file:   Makefile

    new file:   README

    new file:   my_pakt_project.c

    ```


    Before we can submit our changes and create our first commit, we need to set up
    some basic Git configurations. At the minimum, Git requires you to set up your
    name and e-mail:


    ```

    $ git config user.email "your_email@packtpub.com"

    $ git config user.name "Forename Surname"

    ```


    If you want to set up a global e-mail and name for all your Git repositories,
    you can specify the --global option, like this:


    ```

    $ git config --global user.email "your_email@packtpub.com"

    $ git config --global user.name "Forename Surname"

    ```


    To verify the settings, type this:


    ```

    $ git config user.email

    your_email@packtpub.com

    $ git config user.name

    Forename Surname

    ```


    # Tip


    Global Git configurations are stored in /home/$USER/.gitconfig and local ones
    are stored in /path/to/git/repository/.git/config. By default, changes in the
    local repositories'' Git configuration will override changes in your global Git
    configuration.


    When committing a change in Git, the git commit command is used. It records changes
    to the repository and thereby makes it possible to track the commit using the
    unique SHA-1 hash generated for the commit. An historical overview of a branch
    can be seen by typing git log [branch].


    ```

    $ git commit -m "My initial commit"

    [master (root-commit) f01bdf2] My initial commit

    3 files changed, 11 insertions(+)

    create mode 100644 Makefile

    create mode 100644 README

    create mode 100644 my_pakt_project.c

    $ git log

    commit f01bdf29a2c9df1c2417542c5531f90e04c973a

    Author: Forename Surname <you_email@packtpub.com>

    Date:   Sun Jan 1 00:00:00 2016 +0100

    My initial commit

    ```


    When multiple developers work on the same project, each user uses their own local
    clone of the'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'repository. Git will by default reject changes pushed to a repository that
    isn''t a bare repository. We will now go through a simple example that will:


    +   - Convert our repository to a shared repository

    +   - Clone the shared repository


    A shared repository is normally stored on a server and the repository must be
    created as a bare Git repository. This is done by using the `--bare` flag when
    initializing the Git repository or while cloning. Since we worked with a non-shared
    repository in our earlier examples, we will convert it to a shared repository
    using `git clone --bare`, and we can then remove our old repository and continue
    working with clones of the bare repository instead.


    ```

    $ cd /path/to/my/workkdir

    $ git clone --bare /path/to/my_packt_project my_packt_project.git

    $ rm -rf /path/to/my_packt_project

    ```


    # Tip


    A bare repository is basically a repository that doesn''t contain a working directory.
    This will prevent developers from making changes to the repository. According
    to naming conventions, a bare Git repository should be named `name_of_my_repo.git`.


    We now have a bare repository that can be used by a collaboration of developers.
    Next, we continue with cloning a local copy of the bare repository, which we can
    use when developing our new features. By default, you will be in a branch called
    `master` when cloning a repository. It''s possible to do all our work in the master
    branch; since this is only a local clone, we will not destroy anything for other
    developers. But it''s strongly recommended to create a **working branch** and
    make all your changes in that branch instead. This way, the master branch is always
    in a stable and known state. When you are an advanced Git user, you might work
    on several features in parallel and also might want to integrate new features
    that other developers have worked on through the master branch. In other words,
    it''s a good habit to create separate branches for all your features.


    ```

    $ git clone /path/to/my_packt_project.git

    Cloning into ''my_packt_project''

    $ cd my_packt_project

    ```


    Next, we will create a new branch called `my_new_feature`, move it, and develop
    a tiny new feature for the project. It''s possible to use `git branch` to list
    all available local branches; if you add the `-a` flag when listing branches,
    all remote branches will be listed as well.


    # Tip


    A remote branch is a branch that exists in a shared repository that has been cloned
    from. The asterisk (*) helps the user locate the current branch.


    ```

    $ git branch

    * master

    $ git branch my_new_feature

    $ git checkout my_new_feature

    Switched to branch ''my_new_feature''

    ```'
  merge: -1
  img_proc: true
- pgno: 212
  md: '```

    $ git branch

    master

    * my_new_feature

    $ git branch -a

    master

    * my_new_feature

    remotes/origin/HEAD -> origin/master

    remotes/origin/master

    ```


    We are now in our new branch and it''s time to make some modifications. In this
    example, we will add a new target, clean, to our makefile. Remember to use git
    add in order to add your changes to the index before committing them. Use git
    diff before adding the file if you want to list your changes.


    # Note


    If you have already added a file using git add, you can check your changes before
    committing them by using git diff --cached.


    ```

    $ vim Makefile

    $ git diff

    diff --git a/Makefile b/Makefile

    index c6466e0..d986116 100644

    --- a/Makefile

