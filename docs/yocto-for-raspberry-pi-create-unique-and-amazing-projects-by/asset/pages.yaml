    \ \" \\\n/home/packet/RASPBERYPI/poky/meta \\\n/home/packet/RASPBERYPI/poky/meta-yocto\
    \ \\\n```\n\nAfter this, our layer is fully integrated with the Yocto Project,\
    \ and so, it can be parsed by BitBake (the meta scheduler)."
