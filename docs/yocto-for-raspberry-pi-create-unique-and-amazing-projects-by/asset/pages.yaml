    [my_new_feature 7c3d896] Makefile: Add a new target

    1 file changed, 3 insertions(+)

    ```


    The last step for us is to send our new change to the shared repository, update
    our localmaster with the new changes, and then remove our feature branch, since
    it will no longer be required. When pushing a change to our shared repository,
    we can use the predefined remote origin; by default, the origin is set to point
    to the repository we cloned from. When pushing a change, we need to specify which
    revision we will send and to which branch. In most situations, we will want to
    send the entire branch; if so, we can use HEAD to obtain all changes from the
    current branch, like this:


    ```

    $ git push origin HEAD:master

    Counting objects: 5, done.

    Delta compression using up to 4 threads.

    Compressing objects: 100% (3/3), done.

    Writing objects: 100% (3/3), 383 bytes | 0 bytes/s, done.

    Total 3 (delta 0), reused 0 (delta 0)

    To /path/to/my_pckt_project.git

    f01bdf2..7c3d896  HEAD -> master

    $ git checkout master

    Switched to branch ''master''

    Your branch is behind ''origin/master'' by 1 commit, and can be fast-forwarded.

    (use "git pull" to update your local branch)

    ```'
