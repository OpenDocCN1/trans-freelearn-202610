- pgno: 37
  md: '# # Exploring metadata


    **Metadata**, which is composed of a mix of Python and shell script text files
    (.conf, .bb, .bbclass, and .inc), provides a tremendously flexible system. Metadata
    refers to the build instructions themselves as well as the data used to control
    what things get built and to affect how they are built. The metadata also includes
    commands and data used to indicate which versions of software are used and where
    they are obtained from. Poky uses this to extend OpenEmbedded-Core and includes
    two different layers, which are another metadata subset. Here are their details:


    +   * * **meta-yocto**: This layer provides the default and supported distributions,
    visual branding, and metadata tracking information (maintainers, upstream status,
    and so on)


    +   * * **meta-yocto-bsp**: This layer, on top of it, provides the hardware reference
    board support (BSP) for use in Poky


    We will discover metadata in depth through Chapter 4, _Understanding the BitBake
    tool._'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# # Yocto Project - workflow


    The following diagram represents the Yocto Project development environment at
    a high level in order to present the cross-compilation framework:


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_38_0.png)


    Let''s look at what the components in the diagram stand for:


    +   * * User Configuration: This is metadata you can use to control the build
    process.

    +   * * Metadata layers: These are various layers that provide software, machine,
    and distribution metadata.

    +   * * Source files: These contain upstream releases, local projects, and source
    control management (Git, SVN, and so on).

    +   * * Build system: These are processes under the control of BitBake. This block
    expands on how BitBake fetches source files, applies patches, completes compilation,
    analyzes output for package generation, creates and tests packages, generates
    images, and generates cross-development tools.

    +   * * Package feeds: These are directories containing output packages (RPM,
    DEB, or IPK), which are subsequently used in the construction of an image or SDK
    produced by the build system. These feeds can also be copied and shared using
    a web server or other means to facilitate extending or updating existing images
    on devices at runtime if runtime package management is enabled.

    +   * * Images: These are images produced by the development process (the pieces
    that compose the operating system, such as the kernel image, bootloader, and rootfs).

    +   * * Application development SDK: These are cross-development tools that are
    produced along with an image or separately with BitBake.'
  merge: -1
  img_proc: true
