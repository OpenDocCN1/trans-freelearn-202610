    \ initial commit here: [https://github.com/openembedded/meta-oe/commit/90b13eded76f7f7fa1a6715e67c32504e7788e96](https://github.com/openembedded/meta-oe/commit/90b13eded76f7f7fa1a6715e67c32504e7788e96)\n\
    \nIt is easy to introduce this layer to our environment in order to use these\
