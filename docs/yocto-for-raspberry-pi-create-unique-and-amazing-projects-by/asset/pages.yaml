  md: '# The Qt5 SDK - meta-toolchain-qt5


    This toolchain is just an extension of meta-toolchain-qt, including support for
    compiling Qt5 applications. We can generate it with the following command:


    ```

    $ bitbake meta-toolchain-qt5

    ```


    Once it has been built, we can install it with these commands:


    ```

    $ cd tmp/deploy/sdk

    $ ./poky-eglibc-x86_64-meta-toolchain-qt5-armv6-vfp-toolchain- 1.7.1.sh

    ```


    The SDK can be designed for use on a 32-bit or 64-bit Linux distribution, and
    that depends on the host architecture in which the SDK is generated. The selection
    is made by setting the SDKMACHINE variable (in conf/local.conf), which can take
