- pgno: 42
  md: '# # Poky on Ubuntu


    The following list shows you the packages required for Poky by function, given
    a supported Ubuntu or Debian Linux distribution:


    +   - Download tools: wget and git-core

    +   - Decompression tools: unzip and tar

    +   - Compilation tools: gcc-multilib, build-essential, and chrpath

    +   - String-manipulation tools: sed and gawk

    +   - Document-management tools: texinfo, xsltproc, docbook-utils, fop, dblatex,
    and xmlto

    +   - Patch-management tools: patch and diffstat


    To summarize, here is the command to type on a headless system:


    ```

    $ sudo apt-get install gawk wget git-core diffstat unzip

    texinfo gcc-multilib build-essential chrpath

    ```'
