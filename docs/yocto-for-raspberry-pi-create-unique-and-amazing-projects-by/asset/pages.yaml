- pgno: 32
  md: '# # The core components


    The core components (other available tools are optional) of the Yocto Project
    are:


    +   - BitBake

    +   - OpenEmbedded-Core

    +   - Poky

    +   - The BSP layer (meta-raspberry, meta-fsl-arm, meta-ti, meta-intel, meta-sunxi,
    and so on)


    The following diagram shows all the layers that we will discover through this
    book. We will study all the tools through various examples, allowing better comprehension.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # What is Poky?


    Poky is the *reference* Yocto Project distribution. It contains some of basic
    components (called the build system) of OpenEmbedded and a set of metadata for
    creating embedded distributions for a number of targets. It is platform independent
    and performs cross-compiling using the BitBake tool (a task scheduler), OpenEmbedded-Core,
    and a default set of metadata, as shown in the following figure. It provides the
    mechanism to build and combine thousands of distributed open source projects.


    The Poky build system is poised to become the reference in the industrial world
    as evinces by industry leaders such as Wind River, Intel, Montavista, and Mentor
    Graphics.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_33_0.png)


    # Note


    Angstrom (http://www.angstrom-distribution.org/ ) is another distribution based
    on OpenEmbedded-Core. You might consider Angstrom and Poky to be close cousins,
    because Poky is also based on OpenEmbedded-Core.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # The Chief - BitBake


    BitBake, the build engine, is a task scheduler (like GNU Make) which parses several
    scripts (shell and Python, for example).


    Once the environment is built, BitBake will execute the task that has been requested.
    If no task is provided, BitBake will run the default task, called build.


    To run a task, BitBake will first look for an environment variable called do_
    <task_name>, which will contain the task code to execute (in Python or a shell).
    So, to compile a Yocto recipe, use the code contained in the do_compile variable.


    In short, from the information contained in the recipes (or metadata), it downloads
    the sources of projects from the Internet, a local directory, or a version-control
    system (such as Git), and then builds in the order determined by the dependency
    graph generated dynamically. Finally, it installs binaries, generates the corresponding
    package, and builds the final image, which can be installed on the target (Raspberry
    Pi for us).


    The following picture shows how BitBake works:


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_34_0.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# OpenEmbedded-Core


    The OpenEmbedded-Core metadata collection (meta in the following diagram) provides
    the engine of the Poky build tool. It is designed to provide the core features
    (several recipes). It provides support for six different processor architectures
    (ARM, x86, x86-64, PowerPC, MIPS, and MIPS64), supporting only QEMU-emulated machines.


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_35_0.png)


    The organization of OpenEmbedded-Core is depicted here:'
  merge: -1
  img_proc: true
