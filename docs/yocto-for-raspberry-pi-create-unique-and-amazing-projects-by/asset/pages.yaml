- pgno: 252
  md: "# # Extra - using a Raspberry Pi with an LCD as the client\n\nWe can easily\
    \ use an additional Raspberry Pi for the client side, which will be responsible\
    \ for turn the lamp on and off. For this example, we will use the tiny PiTFT 2.8\
    \ touchscreen to control the light. Note that other touchscreens, of course, will\
    \ work just as well; the important thing is that the image contains a web browser:\n\
    \n```\n$ source /path/to/poky/oe-init-build-env pitft28r_client_proj\n```\n\n\
    Update bblayers.conf like this:\n\n```\n$ cat local/bblayers.conf\n# LAYER_CONF_VERSION\
    \ is increased each time build/conf/bblayers.conf\n# changes incompatibly\nLCONF_VERSION\
    \ = \"6\"\nBBPATH = \"${TOPDIR}\"\nBBFILES ?= \"\"\nBBLAYERS ?= \" \\\n  /path/to/poky/meta\
    \ \\\n  /path/to/poky/meta-yocto \\\n  /path/to/poky/meta-yocto-bsp \\\n  /path/to/meta-raspberrypi\
    \ \\\n  /path/to/meta-openembedded/meta-oe \\\n  /path/to/meta-openembedded/meta-multimedia\
    \ \\\n  \"\nBBLAYERS_NON_REMOVABLE ?= \" \\\n  /path/to/poky/meta \\\n  /path/to/poky/meta-yocto\
    \ \\\"\n```\n\nThen, update local.conf:\n\n```\n$ echo \"MACHINE = \\\"raspberrypi2\\\
    \"\" >> conf/local.conf\n$ echo \"MACHINE_FEATURES += \\\"pitft pitft28r\\\"\"\
    \ >> conf/local.conf\n$ echo \"LICENSE_FLAGS_WHITELIST = \\\"commercial\\\"\"\
    \ >> conf/local.conf\n```\n\n# ## Note\n\nNOTE: This example uses the raspberrypi2\
    \ image; if you have a different model, remember to change it to the correct machine\
    \ name.\n\nBuild the image with the following command, boot it, and go tohttp://my_rpi_ipaddress:3344:\n\
    \n```\n$ bitbake core-image-sato\n```"
