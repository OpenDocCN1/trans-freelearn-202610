- pgno: 95
  md: '# # Software development kits (SDKs)


    An SDK is a set of tools we can use outside **Yocto/OE**. These tools generally
    include a compiler, linker, debugger, libraries, and external headers. This set
    of compilation tools is called a **toolchain**. With the Raspberry Pi (or other
    embedded platforms), the toolchain is often composed of crossstools, which are
    tools executed on one architecture that produce a binary for use in another architecture.


    The following figure depicts the process of cross-compilation:


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_95_0.png)


    The **Yocto/OE** build system can be used to generate a cross-compilation toolchain
    and matching sysroot folder for a target system.


    # ## Note


    The **sysroot** folder contains the shared libraries, headers, and utilities that
    are used in the process of building recipes,


    With this build system, there are several ways of generating an SDK that conforms
    to our Raspberry Pi platform.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# # A generic SDK - meta-toolchain


    The meta-toolchain recipe will build a toolchain that matches the Raspberry Pi
    platform and a basic sysroot (generic SDK) that does not match our target root
    filesystem. However, this toolchain can be used to build software such as the
    U-Boot bootloader, the Linux kernel, or simple applications that do not need a
    sysroot folder. We can generate this toolchain with the following command:


    ```

    $ source oe-init-build-env rpi-build

    $ bitbake meta-toolchain

    ```


    Once it has been built, we can install it like this:


    ```

    $ cd poky/rpi-build/tmp/deploy/sdk

    $ ./poky-eglibc-x86_64-meta-toolchain-qt5-armv6-vfp-toolchain- 1.7.1.sh

    ```'
  merge: -1
  img_proc: true
