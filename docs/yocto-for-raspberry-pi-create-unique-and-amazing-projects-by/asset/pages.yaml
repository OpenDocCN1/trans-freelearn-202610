- pgno: 48
  md: '# The oe-init-build-env script


    As can be seen in the screenshot before last, the Poky directory contains a script
    named oe-init-build-env. This is a script for the configuration/initialization
    of the build environment. It is not intended to be executed but must be the sourced.
    Its job, among others, is to initialize a certain number of environment variables
    and place itself in the build directory specified in the argument. The script
    must be run as follows:


    ```

    $ source oe-init-build-env [build-directory]

    ```


    Here, build-directory is an optional parameter for the name of the directory where
    the environment is set (for example, we can use several build directories in a
    single Poky source tree). In case it is not specified, it defaults to build. The
    build-directory folder is the place where we perform builds. But, in order to
    standardize the steps, we will use the following command throughout the book to
    initialize our environment:


    ```

    $ source oe-init-build-env rpi-build

    ### Shell environment set up for builds. ###

    You can now run ''bitbake <target>''

    Common targets are:

    core-image-minimal

    core-image-sato

    meta-toolchain

    adt-installer

    meta-ide-support

    You can also run generated qemu images with a command like

    ''runqemu qemux86''

    ```


    When we initialize a build environment, it creates a directory (the conf directory)
    inside rpi-build. This folder contains two important files:


    +   - local.conf: This contains parameters to configure Bitbake''s behavior.

    +   - bblayers.conf: This lists the different layers that Bitbake takes into account
    in its implementation.

    +   The list is assigned to the BBLayers variable.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# # Editing the local.conf file


    The rpi-build/conf/local.conf file is a file that can configure every aspect of
    the build process. It is through this file that we can choose the target machine
    (the MACHINE variable), the distribution (the DISTRO variable), the type of package
    (the PACKAGE_CLASSES variable), and the host configuration (PARALLEL_MAKE, for
    example). The minimal set of variables we have to change from the default is the
    following:


    ```

    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"

    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

    MACHINE ?= raspberrypi MACHINE ?= "raspberrypi"

    ```


    The BB_NUMBER_THREADS variable determines the number of tasks that BitBake will
    perform in parallel (these are tasks under Yocto; we''re not necessarily talking
    compilation). By default, in build/conf/local.conf, this variable is initialized
    with ${@oe.utils.cpu_count()}, corresponding to the number of cores detected on
    the host system (/proc/cpuinfo).


    The PARALLEL_MAKE variable corresponds to the -j to make option to specify the
    number of processes that GNU Make can run in parallel on a compilation task. Again,
    it is the number of available cores that defines the default value used.


    The MACHINE variable is where we determine the target machine we wish to build
    for the Raspberry Pi (defined in the .conf file; in our case, it''s raspberrypi.conf).'
  merge: -1
  img_proc: true
