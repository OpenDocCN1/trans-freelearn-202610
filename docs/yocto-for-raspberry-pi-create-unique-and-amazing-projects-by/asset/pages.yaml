- pgno: 176
  md: "# # Autostarting - the init file\n\nIf we want to have a standalone application,\
    \ it would be interesting if our application can start during the boot sequence\
    \ of our Raspberry Pi. For this, we will use an init script, inheriting directly\
    \ from System V.\n\nThe first step is to create a .init file within our structure.\
    \ We will call this file server.init. The tree will look like this:\n\n```\n```\n\
    $ tree webserver-packt/\nwebserver-packt/\nâââââââ€ webserver-packt\nâ\",   ââââââ€\
    \ server.init\nâ\",   ââââââ€ server.tar.gz\nâââââââ€ webserver-packt_0.1.bb\n\
    ```\n```\n\nSo, the script will start the application automatically after the\
    \ installation and every time the Raspberry Pi starts up. Here is the init script\
    \ from System V:\n\n```\n```\n#!/bin/bash\n### BEGIN INIT INFO\n# Provides:  \
    \        server.init\n# Required-Start:    $remote_fs $syslog\n# Required-Stop:Å...\
    \  $remote_fs $syslog\n# Default-Start:     2 3 4 5\n# Default-Stop:      0 1\
    \ 6\n# Short-Description: Start daemon at boot time\n# Description:       Enable\
    \ service provided by daemon.\n### END INIT INFO\nDAEMON=node\nNAME=server.init\n\
    DESC=\"Nodejs app\"\nARGS=\"/usr/share/server-packt/server/server.js\"\nset -e\n\
    usage()\n{\n    echo \"---------------------------------------\"\n    echo \"\
    Usage: $0 (stop|start|restart)\"\n    echo \"---------------------------------------\"\
    \n}\nservice_start()\n{\n    echo -n \"starting $DESC: $NAME... \"\n    start-stop-daemon\
    \ -S -x $DAEMON -- $ARGS &\n    echo \"done.\"\n}\necho \"\"\n```\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\n```\nservice_stop()\n{\n    echo -n \"stopping $DESC: $NAME... \"\n  \
    \  start-stop-daemon -K -x $DAEMON\n    echo \"done.\"\n}\n\ncase $1 in\n    stop)\n\
    \        service_stop\n        echo \"\"\n        ;;\n    start)\n        service_start\n\
    \        echo \"\"\n        ;;\n    restart)\n        service_stop\n        service_start\n\
    \        echo \"\"\n        ;;\n    *)\n        usage\n        ;;\nesac\nexit\
    \ 0\n```\n```\n\n# Explanation\n\nLet's look at how the code works:\n\n+   - The\
    \ DAEMON variable specifies the binary to launch (/usr/bin/node)\n+   - The NAME\
    \ variable specifies the script name\n+   - The DESC variable contains some information\
    \ about DAEMON (node)\n+   - The ARGS variable contains the arguments to pass\
    \ to DAEMON (node)\n\nIf you want to test this script on the Raspberry Pi, use\
    \ these commands:\n\n```\n```\n$ scp server.init root@ip_address_of_rpi:/etc/init.d\n\
    $ cd /etc/init.d\n$ update-rc.d server.init defaults\n```\n```\n\nThis command\
    \ stops the application:\n\n```\n```\n/etc/init.d/server.init stop\n```\n```\n\
    \nThis one restarts it:\n\n```\n```\n/etc/init.d/server.init restart\n```\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "# # Autostarting - the recipe file\n\nThe inclusion of our init file in our\
    \ webserver-packt.bb recipe consists of:\n\n+   * Adding the server.init file\
    \ to SRC_URI.\n+   * Adding do_install() to the step for our init script.\n+ \
    \  * Including update-rc.d. Adding this to Yocto is done by adding inherit update-rc.d\
    \ to our recipe.\n\nHere is webserver-packt.bb after being updated:\n\n```\nDESCRIPTION\
    \ = \"Panel to monitor rpi temperature\"\nLICENSE = \"GPLv2\"\nLIC_FILES_CHKSUM\
    \ =\n\"file://${COREBASE}/meta/COPYING.GPLv2;md5=751419260aa954499f7abaabaa882bbe\"\
    \n\n# Package Release\nPR = \"r0\"\n\n# Use local tarball\nSRC_URI = \" \\\\\n\
    \ file://server.tar.gz \\\\\n file://server.init \\\\\n \"\n\nRDEPENDS_${PN} +=\
    \ \"bash\"\n\n# Make sure our source directory (for the build) matches the directory\
    \ structure in\nthe tarball\nS = \"${WORKDIR}\"\n\ndo_install() {\n   install\
    \ -d ${D}${datadir}/server-packt\n   cp -a ${S}/server ${D}${datadir}/server-packt\n\
    \n      install -d ${D}${sysconfdir}/init.d/\n   install -m 0755 ${WORKDIR}/server.init\
    \ ${D}${sysconfdir}/init.d/server-packt-\ninit\n}\n\n# Package files\nFILES_${PN}\
    \ += \"${datadir}/server-packt\"\n\ninherit update-rc.d\n\nINITSCRIPT_NAME = \"\
    server-packt-init\"\nINITSCRIPT_PARAMS = \"start 99 5 2 . stop 19 0 1 6 .\"\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 179
  md: '# # Explanation


    Here is an explanation of our updated webserver-packet.bb file:


    +   - The `INITSCRIPT_NAME` variable represents the filename of the initialization
    script, as installed to `/etc/init.d`.

    +   - * The `INITSCRIPT_PARAMS` variable specifies the options to pass to `update-rc.d`.
    In our case, the script has a runlevel of 99, is started at init levels 2 and
    5, and is stopped at levels 0, 1, and 6.


    # ## Note


    If you want more information about update-rc.d, you can visit the official documentation
    of the Yocto Project: http://www.yoctoproject.org/docs/1.8/mega-manual/mega-manual.html#ref-classes-update-rc.d'
  merge: -1
