  md: "# # Modifying the recipe file\n\nTo better manage our image, there's nothing\
    \ better than to learn from the basic images contained in the meta-raspberrypi\
    \ layer.\n\n# ## Note\n\nYou can visit the main GitHub repository at https://github.com/agherzan/meta-raspberrypi/blob/master/recipes-core/images/rpi-hwup-image.bb\
    \ .\n\nHere is a basic example—our own image -compliant Raspberry Pi, including\
    \ our own recipe:\n\n```\n# Base this image on core-image-minimal\ninclude recipes-core/images/core-image-minimal.bb\n\
    DESCRIPTION = \"Image for raspberry-pi\"\nIMAGE_FEATURES += \"ssh-server-dropbear\
    \ splash\"\n# Include modules in rootfs\nIMAGE_INSTALL += \" \\\\\n kernel-modules\
    \ \\\\\n gpio-packt\n\"\n```\n\nThe IMAGE_INSTALL variable groups the related\
    \ packages that generate our root filesystem. For further information, you can\
    \ refer to the official documentation ( http://www.yoctoproject.org/docs/1.8/ref-manual/ref-manual.html#var-IMAGE_INSTALL).\n\
    \n+   • Another variable that can be interesting, IMAGE_FEATURES, allows you to\
    \ handle predefined packages (dev, debug, and so on). You can find more information\
    \ by reading the official documentation:\n\n+   • `allow-empty-password`: Allows\
    \ Dropbear and OpenSSH to accept root logins and logins from accounts having an\
    \ empty password string.\n+   \n+   • `dbg-pkgs`: Installs debug symbol packages\
    \ for all packages installed in a given image.\n+   \n+   • `debug-tweaks`: Makes\
    \ an image suitable for development (e.g. allows root logins without passwords\
    \ and enables post-installation logging). See the 'allow-empty-password', 'empty-root-password',\
    \ and 'post-install-logging' features in this list for additional information.\n\
    +   \n+   • `dev-pkgs`: Installs development packages (headers and extra library\
    \ links) for all packages installed in a given image.\n+   \n+   • `doc-pkgs`:\
    \ Installs documentation packages for all packages installed in a given image.\n\
    +   \n+   • `empty-root-password`: Sets the root password to an empty string,\
    \ which allows logins with a blank password.\n+   \n+   • `package-management`:\
    \ Installs package management tools and preserves the package manager database.\n\
    +   \n+   • `post-install-logging`: Enables logging postinstall script runs to\
    \ the `/var/log/postinstall.log` file on first boot of the image on the target\
    \ system.\n+   \n+   • `ptest-pkgs`: Installs ptest packages for all ptest-enabled\
    \ recipes.\n+   \n+   • `read-only-rootfs`: Creates an image whose root filesystem\
    \ is read-only. See the \"Creating a Read-Only Root Filesystem\" section in the\
    \ Yocto Project Development Manual for more information.\n+   \n+   • `splash`:\
    \ Enables showing a splash screen during boot. By default, this screen is provided\
    \ by `psplash`, which does allow customization. If you prefer to use an alternative\
    \ splash screen package, you can do so by setting the `SPLASH` variable to a different\
    \ package name (or names) within the image recipe or at the distro configuration\
    \ level.\n+   \n+   • `staticdev-pkgs`: Installs static development packages,\
    \ which are static libraries (i.e. `*.a` files), for all packages installed in\
    \ a given image."
  merge: -1
  img_proc: true
