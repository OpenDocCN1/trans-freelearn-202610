    |---|---|

    | Green | GPIO 15 (RXD) |


    Once the physical connection has been set up, we can continue with preparing our
    host environment. In this example, we will use the screen package to set up our
    console connection.


    To set up screen on Ubuntu, use this command:


    ```

    $ sudo apt-get install screen

    ```


    Use this one to set it up on Fedora:


    ```

    $ sudo yum install screen

    ```


