- pgno: 90
  md: '# # The Git fetcher


    One of the most commonly used source control management systems in use is Git.
    BitBake has solid support for it, and the Git backend is used when the do_fetch
    task is run and finds a git:// URL at the SRC_URI variable. Here is an example
    featuring a utility developed by Christophe Blaess. It is a simple command-line
    tool to help with the use of Linux spidev devices.


    ```

    SRCREV = "cc6a41fdcec60610703ba6db488c621c64952898"

    ```


    This variable contains the reference to the commit that the version control system
    will use as a basis. In the case of Git, it is the the commit hash.


    ```

    SRC_URI = "git://github.com/cpb-/spi-tools.git;protocol=git"

    ```


    # ## Note


    When the SRCREV variable points to a hash not available in the master branch,
    we need to use the branch=<branch name> parameter, as follows: SRC_URI = git://myserver/myrepo.git;branch=mybranch.
    In the cases when the hash used points to a tag that is not available in a branch,
    we need to use the nobranch=1 option, as follows: SRC_URI = "git://myserver/myrepo.git;nobranch=1".


    For further information about the SRC_URI parameter''s values, go to http://www.yoctoproject.org/docs/1.6/bitbake-user-manual/bitbake-user-manual.html#var-SRC_URI
    for some examples.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # Understanding BitBake''s tasks


    The bitbake command is the primary interface to the BitBake tool. This chapter
    presents the bitbake command syntax and provides several execution examples.


    For example, if you want to build a specific recipe, run the following command:


    ```

    $ bitbake <recipe>

    ```


    BitBake runs a set of scheduled tasks. When we wish to run a specific task, we
    can use the following command:


    ```

    $ bitbake <recipe> -c <task>

    ```


    If you want to clean a specific package (spitools , for example), you just have
    to run this:


    ```

    $ bitbake spitools -c clean

    ```


    To list the tasks defined for a recipe, we can use the following command:


    ```

    $ bitbake <recipe> -c listtasks

    ```


    Here is a description of BitBake tasks:


    +   • **do_fetch**: The first step when building a recipe is fetching the required
    source. This is done using the fetching backend feature we discussed previously.
    It is important to point out that fetching source or a file does not mean it is
    a remote source. In fact, every file required during the recipe build must be
    fetched so that it is made available in the WORKDIR directory.


    All downloaded content is stored in the download folder (the DL_DIR variable),
    so all external source code is cached to avoid redownloading it every time we
    need the same source.


    +   • **do_unpack**: The natural subsequent task after the do_fetch task is do_unpack.
    It is responsible for unpacking source code or checking the requested revision
    or branch in case the referenced source uses an SCM system.


    +   • **do_patch**: Once the source code has been properly unpacked, BitBake initiates
    the process of adapting it. This is done by the do_patch task. Every file fetched
    by do_fetch that has the .patch extension is assumed to be a patch to be applied.
    This task applies the list of required patches.


    The process of applying a patch uses the S variable, which points to the source
    code. The default value used for S is ${WORKDIR}/${PN}-${PV}, and it is used for
    the do_patch, do_configure, do_compile, and do_install tasks.


    +   • **do_configure, do_compile, and do_install**: The do_configure, do_compile,
    and do_install tasks are performed in this order. Some recipes may omit one task
    or another. It is important to note that the environment variables defined in
    the tasks are different from one task to another.


    Tasks vary a lot from one recipe to another. Poky provides a rich collection of
    predefined tasks in the classes, which ought to be used when possible. For example,
    when the Autotools class is'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'inherited by a recipe, it provides a known implementation for the do_configure,
    do_compile, and do_install tasks.


    +   • do_package: The do_package task splits the files installed by the recipe
    into logical components, such as debugging symbols, documentation, and libraries.
    The do_package task ensures that files are split up and packaged correctly.


    One of the most common uses of Poky is the generation of the root filesystem.
    The rootfs image should be seen as a ready-to-use root filesystem for a target.
    The rootfs is basically a directory with the desired packages installed. The list
    of packages to be installed into rootfs is defined by a union of packages listed
    by IMAGE_INSTALL and the packages included by IMAGE_FEATURES.


    # Note


    After do_rootfs has finished, the generated image file is placed in <build-dir>/tmp/deploy/image/raspberrypi/.


    We will learn more about the process and its contents in Chapter 5 , Creating,
    Developing, and Deploying on the Raspberry Pi.'
  merge: -1
  img_proc: true
