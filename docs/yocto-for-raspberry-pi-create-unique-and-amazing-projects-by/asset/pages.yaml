- pgno: 195
  md: '# The Raspberry Pi 7 touchscreen


    Getting started with the Raspberry Pi 7 touchscreen using an image based on the
    Yocto Project requires quite a few configurations. First, we need to ensure we
    are using a 4.1+ kernel. Starting from the **jethro** release of meta-raspberrypi,
    4.1 is the default version. Currently, meta-raspberrypi lacks full support for
    the Raspberry Pi 7 touchscreen, so we need to perform some small modifications
    before booting our image.


    # Note


    Build instructions for the Raspberry Pi 7 touchscreen can be found at https://www.adafruit.com/images/product-files/2718/2718build.jpg
    . The display will work with Raspberry Pi A/B boards; however, the mounting holes
    on the back of the display will only line up with A+, B+, and Raspberry Pi 2/3.


    If using the default meta-raspberrypi settings, we will have a supported kernel
    with all the required configuration options enabled by default. To be extra safe,
    you can go through the previous part of this chapter to ensure that the kernel
    is correctly configured for your display. With this in mind, we can start by creating
    a new project:


    ```

    $ source /path/to/poky/oe-init-build-env my_project

    ```


    Next, we can continue with the normal procedure and add external layers required
    for building Raspberry Pi images with Yocto:


    ```

    $ cat local/bblayers.conf

    # LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf

    # changes incompatibly

    LCONF_VERSION = "6"

    BBPATH = "${TOPDIR}"

    BBFILES ?= ""

    BBLAYERS ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    /path/to/poky/meta-yocto-bsp \

    /path/to/meta-raspberrypi \

    /path/to/meta-openembedded/meta-oe \

    /path/to/meta-openembedded/meta-multimedia \

    "

    BBLAYERS_NON_REMOVABLE ?= " \

    /path/to/poky/meta \

    /path/to/poky/meta-yocto \

    ```


    # Note


    If you haven''t cloned the openembedded layers for the earlier examples in the
    book, it can be done with this command: $ git clone git://git.openembedded.org/meta-openembedded


    We also need to make some modifications to local.conf:


    ```

    $ echo "MACHINE = \"raspberrypi\"" >> conf/local.conf (Or MACHINE=raspberrypi2)

    ```'
  merge: -1
  img_proc: true
- pgno: 196
  md: '```

    $ echo "LICENSE_FLAGS_WHITELIST = \"commercial\"" >> conf/local.conf

    ```


    After this, we are ready to start a new build. By default, meta-raspberrypi will
    ensure that, for example, input devices for the touchscreen, together with appropriate
    udev rules, are set up for the touchscreen. These settings will be applied seamlessly
    during the build:


    ```

    $ bitbake core-image-sato

