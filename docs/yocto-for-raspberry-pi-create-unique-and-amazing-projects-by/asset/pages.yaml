- pgno: 215
  md: '# # Contributing to meta-raspberrypi


    If you have prepared a fix or feature for meta-raspberrypithat you want to share
    with the community, there are a number of things you need to be aware of.


    The current maintainer of meta-raspberrypi is Andrei Gherzan. He has the final
    word about a patch and will integrate the patch into the meta-raspberrypi main
    layer. Since the maintainers are quite busy, it''s important that you test your
    patch carefully before sending it upstream. The most important thing for a contributor,
    regardless of the project, is to build up its reputation by sending well-tested
    patches that follow the requested guidelines. This will significantly increase
    the chances of getting your patch integrated into the project.


    Some overall "rules" exist for contributing to meta-raspberrypi:


    +   - Patches related to meta-raspberrypi should always be sent to yocto@yoctoproject.org.

    +   - Prefix your emails with "[meta-raspberrypi]"

    +   - Follow the OpenEmbedded patch guidelines

    +   - Follow the meta-raspberrypi readme instructions


    An extended explanation of this set of rules, together with examples, will be
    described later in this chapter.


    # ## Setting up your Git repository


    Before you can send anything upstream, you need set up some basic things. First,
    you should set up your name and e-mail for your meta-raspberrypi Git repository,
    as described in earlier parts of this chapter:


    ```

    $ cd meta-raspberrypi

    $ git config user.email "your_email@packtpub.com"

    $ git config user.name "Forename Surname"

    ```


    Next, you should set up git send-email in order to use Git to send your patches
    through your SMTP server. This is often required by the maintainers in order to
    ensure that the format of the patch is correct and it can be easily integrated.
    You need to manually configure the server parameters-refer to your e-mail provider''s
    documentation or contact support in order to find the right parameters.


    In addition to Git, you also need to install send-email, which is the software
    Git uses under the hood for git send-email. The send-email package is available
    on most distributions, but the name might differ. Here is how to set it up on
    Ubuntu and Fedora:


    +   - Ubuntu: $ sudo apt-get install sendemail

    +   - Fedora: $ sudo yum install sendmail


    Here is an example of how to configure sendemail:


    ```

    $ cd meta-raspberrypi

    $ git config sendemail.smtpencryption tls

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: '```

    $ git config sendemail.smtpserver smtp.packetpub.com

    $ git config sendemail.smtpuser your_email@packetpub.com

    $ git config sendemail.smtpserverport 587

    ```'
