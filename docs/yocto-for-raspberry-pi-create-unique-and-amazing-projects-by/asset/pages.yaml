- pgno: 52
  md: '# # Choice of image


    Poky provides several pre-designed image recipes that we can use to build our
    own binary image. We can check the list of available images by running the following
    command from the poky directory:


    ```

    $ ls meta*/recipes*/images/*.bb

    ```


    All the recipes provide images that are, in essence, sets of unpacked and configured
    packages, generating a filesystem that we can use on actual hardware (for further
    information about different images, you can visit ( http://www.yoctoproject.org/docs/latest/mega-manual/mega-manual.html#ref-images
    ) ).


    Next, here''s a brief representation of available images:


    ![](img/76681dcfb8cd2bd107d0c06ab088f916_52_0.png)


    We can add the layers proposed by meta-raspberry to all of these layers:


    ```

    $ ls meta-raspberrypi/recipes-core/images/*.bb

    rpi-basic-image.bb

    rpi-hwup-image.bb

    rpi-test-image.bb

    ```


    +   - rpi-hwup-image.bb: This is an image based on core-image-minimal.

    +   - rpi-basic-image.bb: This is an image based on rpi-hwup-image.bb with some
    added features (a splash screen).

    +   - rpi-test-image.bb: This is an image based on rpi-basic-image.bb and includes
    some packages present in meta-raspberrypi.


    We will choose one of these three recipes for the rest of this chapter. Note that
    these files ( .bb) describe'
  merge: -1
