  \ **构建镜像**）。Hob 会跟踪构建进度，如本屏幕截图所示：\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_70_0.png)\n\
  \n构建完成后，您将看到此屏幕：\n\n### 镜像详细信息\n\n您的镜像已就绪\n\n+   名称: rpi-basic-image-edited-20150221-135730-raspberrypi-20150221125730\n\
