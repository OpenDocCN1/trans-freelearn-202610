  \ Linux 发行版之一（Yggdrasil，1994 年）。\n\n扬兹先生曾作为首席架构师设计完整的嵌入式和企业级软件系统架构，并带领团队从新产品的需求和设计阶段一直到完成和交付给客户。他有\
