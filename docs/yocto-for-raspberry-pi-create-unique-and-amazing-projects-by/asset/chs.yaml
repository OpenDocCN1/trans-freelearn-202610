  \ do_ <task name> 的环境变量，该变量将包含要执行的任务代码（使用 Python 或 shell）。”\n\n代码块设置如下：\n\n```\n\
  # LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf\n# changes\
  \ incompatibly\nLCONF_VERSION = \"6\" BBPATH = \"${TOPDIR}\" BBFILES ?= \"\" BBLayers\
  \ ?= \" \\\n/home/packet/RASPBERRYPI/poky/meta \\\n/home/packet/RASPBERRYPI/poky/meta-yocto\
  \ \\\n/home/packet/RASPBERRYPI/poky/meta-yocto-bsp \\\n/BBLAYERS_NON_REMOVABLE ?=\
  \ \" \\\n/home/packet/RASPBERRYPI/poky/meta \\\n/home/packet/RASPBERRYPI/poky/meta-yocto\
  \ \\\n\"\n```\n\n任何命令行输入或输出都写为：\n\n```\n$ modprobe spidev\n```\n\n**新术语**和**重要单词**以粗体显示。你看到屏幕上的单词，例如，在菜单或对话框中，会出现在文本中，如：“添加一个层非常简单。我们只需单击\
