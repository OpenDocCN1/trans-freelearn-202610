  \n之后，我们可以使用 Hob 镜像为 Raspberry Pi 创建可启动的 SD 卡：\n\n```\n$ sudo dd if=rpi-basic-image-edited-20150221-135730-raspberrypi.rpi-sdimg\
  \ of=/dev/sdX bs=1M\n```\n\n此时，我们只需将 SD 卡插入 Raspberry Pi，开启开发板，然后开始使用它。\n\n\n\n\n\
  \n## 探索 Toaster\n\nToaster 是 BitBake 的 Web 界面。Yocto 项目网站对此的描述如下：\n\n> \"Toaster\
  \ 是 OpenEmbedded 构建系统的应用程序编程接口 (API) 和基于 Web 的界面，该系统使用 BitBake。目前，Toaster 收集并展示有关您构建的信息，您可以使用\
  \ Web 浏览器进行导航和查询\"\n\n## 在主机系统上安装所需的软件包\n\n为了在首选的 Linux 发行版上正确使用 Toaster，您需要安装 Django\
  \ 和 South：\n\n```\n$ sudo pip install django==1.6\n$ sudo pip install South==0.8.4\n\
  ```\n\n### 注意\n\npip 命令使安装 Python 模块变得容易，就像在 Linux 发行版中安装软件包一样。\n\n## 运行 Toaster\n\
  \n既然我们的系统已准备好使用 Toaster，我们只需使用以下命令来启动服务：\n\n```\n$ source toaster start\n```\n\n\
  这将产生以下输出：\n\n```\nThe system will start. Syncing... Creating tables ... Installing\
  \ custom SQL ... Installing indexes ... Installed 0 object(s) from 0 fixture(s)\
  \ Synced: > django.contrib.staticfiles > django.contrib.humanize > south Not synced\
  \ (use migrations): - orm - bldcontrol (use ./manage.py migrate to migrate these)\
