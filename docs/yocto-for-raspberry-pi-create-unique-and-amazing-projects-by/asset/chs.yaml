  \n## 问题\n\n如果您对本书的任何方面有问题，可以通过 questions@packtpub.com 联系我们，我们将竭尽力解决问题。\n\n# 第 1\
  \ 章 认识 Yocto 项目\n\n在本章中，我们将了解 Yocto 项目及其主要原则。本书中使用的所有概念都将在这里介绍。我们将讨论 Yocto 项目的历史、构建系统、Poky、OpenEmbedded-Core、BitBake、元数据以及\
  \ Yocto 项目工作流程。\n\n## Yocto 项目\n\nYocto 项目是一个涵盖相当广泛的嵌入式 Linux 技术的伞形项目。它不是一个 Linux\
  \ 发行版，如 Yocto 项目网站所述：\n\n> \"Yocto 项目是一个开源协作项目，提供模板、工具和方法，帮助您为嵌入式产品创建基于 Linux 的定制系统，无论硬件架构如何。\"\
  \n\n由 Linux 基金会赞助，Yocto 项目不仅仅是一个构建系统。它提供工具、流程、模板和方法，以便开发人员可以快速为嵌入式设备（树莓派、Beagleboard、Nitrogen6x、SAMA5D3、Olinuxino\
  \ 等）或 QEMU 创建和部署产品。构成 Yocto 项目的两个主要组件是：\n\n- Poky：这是构建系统（参考发行版）。\n- BitBake：这是调度程序。它是一个基于\
  \ Gentoo 发行版的工具。\n\n在 2010 年 11 月左右，Linux 基金会宣布这项工作将继续作为由 Linux 基金会赞助的项目，隶属于 Yocto\
  \ 项目（由 Linux 基金会 Fellow Richard Purdie 担任架构师）。随后确立，Yocto 项目和 OpenEmbedded 将针对名为\
  \ OE-Core 的核心元数据包集进行协调，结合 Poky 和 OpenEmbedded 的优点，并增加对其他组件的分层使用。\n\n## 了解构建系统\n\n\
  如前所述，我们正处于 Yocto 项目的构建系统世界中。构建系统使您能够：\n\n- 编译或交叉编译应用程序\n- 打包应用程序\n- 测试输出二进制文件和生态系统兼容性\n\
  - 部署生成的镜像\n\n要执行这些步骤，存在多种工具。其中一些如下：\n\n- Buildroot (http://buildroot.uclibc.org/)\n\
  - LTIB (http://ltib.org/)\n- OpenWRT (https://openwrt.org/)\n- Yocto/OpenEmbedded\
  \ (https://www.yoctoproject.org/)\n\n例如，Buildroot 是一组用于嵌入式系统自动生成的 makefile。它支持编译引导加载程序（例如\
  \ U-Boot）、内核（zImage 或 bzImage），以及通过 BusyBox 和第三方应用程序进行的基本控制。Buildroot 可在各种架构上运行，例如\
  \ ARM、x86 和 MIPS。欲了解更多信息，请参阅 https://buildroot.org/docs.html 上的英文完整文档。\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_30_0.png)\n\
  \n> \"Buildroot 是由一家名为 Free Electrons 的法国公司部分维护的工具，该公司专注于嵌入式 Linux 开发。\"\n\n与本书中将探索的\
  \ Yocto 项目相比，Buildroot 是一种更为简单的方法。Buildroot 更多致力于固件生成，而 Yocto/OpenEmbedded 则面向发行版。Buildroot\
  \ 提供 700 个配方，而 Yocto 项目则提供超过 8000 个。\n\n## 核心组件\n\nYocto 项目的核心组件（其他可用工具为可选）如下：\n\
  \n- BitBake\n- OpenEmbedded-Core\n- Poky\n- BSP 层（meta-raspberry、meta-fsl-arm、meta-ti、meta-intel、meta-sunxi\
  \ 等）\n\n下图显示了本书中将发现的所有层。我们将通过各种示例学习所有工具，以便更好地理解。\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_32_0.png)\n\
  \n## 什么是 Poky？\n\nPoky 是 *参考* Yocto 项目发行版。它包含 OpenEmbedded 的一些基本组件（称为构建系统）以及一组用于为多个目标创建嵌入式发行版的元数据。它与平台无关，并使用\
  \ BitBake 工具（任务调度器）、OpenEmbedded-Core 和一组默认元数据进行交叉编译，如下图所示。它提供构建和组合成千上万个分布式开源项目的机制。\n\
  \nPoky 构建系统有望在工业界成为参考，正如 Wind River、Intel、Montavista 和 Mentor Graphics 等行业领导者所证明的那样。\n\
  \n![](img/76681dcfb8cd2bd107d0c06ab088f916_33_0.png)\n\n### 注意\n\nAngstrom (http://www.angstrom-distribution.org/)\
  \ 是另一种基于 OpenEmbedded-Core 的发行版。您可以将 Angstrom 和 Poky 视为近亲，因为 Poky 也是基于 OpenEmbedded-Core。\n\
  \n## 头号人物 - BitBake\n\nBitBake，构建引擎，是一个任务调度器（类似于 GNU Make），用于解析多个脚本（例如 shell 和 Python）。\n\
  \n一旦环境构建完成，BitBake 将执行请求的任务。如果未提供任务，BitBake 将运行名为 build 的默认任务。\n\n要运行任务，BitBake\
  \ 首先会查找名为 do_<task_name> 的环境变量，该变量将包含要执行的任务代码（Python 或 shell）。因此，要编译 Yocto 配方，请使用\
  \ do_compile 变量中包含的代码。\n\n简而言之，根据配方（或元数据）中包含的信息，它会从互联网、本地目录或版本控制系统（例如 Git）下载项目源代码，然后按动态生成的依赖图确定的顺序进行构建。最后，它安装二进制文件，生成相应的软件包，并构建最终镜像，该镜像可以安装在目标设备上（对我们来说是树莓派）。\n\
  \n下图显示了 BitBake 的工作原理：\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_34_0.png)\n\n\
  ## OpenEmbedded-Core\n\nOpenEmbedded-Core 元数据集合（下图中的 meta）提供了 Poky 构建工具的引擎。它旨在提供核心功能（多个配方）。它支持六种不同的处理器架构（ARM、x86、x86-64、PowerPC、MIPS\
  \ 和 MIPS64），仅支持 QEMU 模拟的机器。\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_35_0.png)\n\
  \nOpenEmbedded-Core 的组织结构如下：\n\n- classes\n- conf\n- files\n- lib\n- recipes-bsp\n\
  - recipes-connectivity\n- recipes-core\n- recipes-devtools\n- recipes-extended\n\
  - recipes-gnome\n- recipes-graphics\n- recipes-kernel\n- recipes-lsb4\n- recipes-multimedia\n\
  - recipes-qt\n- recipes-rt\n- recipes-sato\n- recipes-support\n- site\n- COPYING.GPLv2\n\
  - COPYING.MIT\n- recipes.txt\n\n该层包含不同的配方，描述如何获取、配置、编译和打包应用程序及镜像。\n\n### 注意\n\n\
  在本书的其余部分，我们将把此层与树莓派的 BSP 层 **meta-raspberrypi** 混合使用。\n\n## 探索元数据\n\n**元数据**由 Python\
  \ 和 shell 脚本文本文件（.conf、.bb、.bbclass 和 .inc）混合组成，提供了一个极其灵活的系统。元数据既指构建指令本身，也指用于控制构建哪些内容以及影响如何构建的数据。元数据还包括用于指示使用哪些软件版本及其获取来源的命令和数据。Poky\
  \ 使用它来扩展 OpenEmbedded-Core，并包含两个不同的层，它们是另一个元数据子集。详情如下：\n\n- **meta-yocto**：此层提供默认和受支持的发行版、可视化品牌以及元数据跟踪信息（维护者、上游状态等）\n\
  - **meta-yocto-bsp**：此层在此基础上提供硬件参考板支持（BSP），用于 Poky\n\n我们将在第 4 章 _了解 BitBake 工具。_\
  \ 中深入探讨元数据。\n\n\n\n\n\n## Yocto Project - 工作流\n\n以下图表从高层次展示了 Yocto Project 开发环境，以呈现交叉编译框架：\n\
  \n![](img/76681dcfb8cd2bd107d0c06ab088f916_38_0.png)\n\n让我们来看看图中各组件代表的含义：\n\n- 用户配置：这是你可以用来控制构建过程的元数据。\n\
  - 元数据层：这些是提供软件、机器和发行版元数据的各种层。\n- 源文件：这些包含上游版本、本地项目以及源代码管理（Git、SVN 等）。\n- 构建系统：这些是在\
  \ BitBake 控制下的进程。此模块详细说明了 BitBake 如何获取源文件、应用补丁、完成编译、分析输出以生成软件包、创建和测试软件包、生成镜像以及生成交叉开发工具。\n\
  - 软件包馈送：这些是包含输出软件包（RPM、DEB 或 IPK）的目录，随后用于构建系统生成的镜像或 SDK。这些馈送还可以使用 Web 服务器或其他方式复制和共享，以便在运行时扩展或更新设备上的现有镜像（前提是启用了运行时软件包管理）。\n\
  - 镜像：这些是开发过程生成的镜像（构成操作系统的各个部分，例如内核镜像、引导加载程序和根文件系统）。\n- 应用程序开发 SDK：这些是与镜像一起生成或单独由\
  \ BitBake 生成的交叉开发工具。\n\n## 摘要\n\n本章介绍了 Yocto Project 的工作原理、构成其核心的组件（如 Poky、OpenEmbedded-Core\
  \ 和 BitBake）以及它们在 Yocto Project 中的协作方式。\n\n在下一章中，我们将通过不同的步骤来练习 Yocto Project 的工作流程，以下载、配置和准备\
  \ Poky 构建环境，以便为树莓派生成我们的第一个 Poky 镜像。\n\n# 第 2 章 为树莓派构建我们的第一个 Poky 镜像\n\n在本章中，我们将尝试理解\
  \ Poky 工作流程的基本概念。使用 Linux 命令行，我们将执行下载、配置和准备 Poky 树莓派环境以及生成可由目标设备使用的镜像所需的不同步骤。\n\n\
  ## 为主机系统安装所需软件包\n\n主机系统配置所需的步骤取决于所使用的 Linux 发行版。事实上，建议使用由 Poky 维护和支持的 Linux 发行版之一。这样可以避免在设置主机系统时浪费时间和精力。目前，Yocto\
  \ Project 支持以下发行版：\n\n- Ubuntu 12.04 (LTS)\n- Ubuntu 13.10\n- Ubuntu 14.04 (LTS)\n\
  - Fedora release 19 (Schrödinger's Cat)\n- Fedora release 21\n- CentOS release 6.4\n\
  - CentOS release 7.0\n- Debian GNU/Linux 7.0 (Wheezy)\n- Debian GNU/Linux 7.1 (Wheezy)\n\
  - Debian GNU/Linux 7.2 (Wheezy)\n- Debian GNU/Linux 7.3 (Wheezy)\n- Debian GNU/Linux\
  \ 7.4 (Wheezy)\n- Debian GNU/Linux 7.5 (Wheezy)\n- Debian GNU/Linux 7.6 (Wheezy)\n\
  - openSUSE 12.2\n- openSUSE 12.3\n- openSUSE 13.1\n\n### 注意\n\n即使你的发行版未在此列出，也不意味着\
  \ Poky 无法工作，但结果不作保证。在本书中，你将看到关于在 Ubuntu 发行版上使用 Poky 的说明。如果你想了解支持的 Linux 发行版的更多信息，可以访问此链接：http://www.yoctoproject.org/docs/current/ref-manual/ref-manual.html。\n\
  \n## Poky on Ubuntu\n\n以下列表按功能显示了在受支持的 Ubuntu 或 Debian Linux 发行版上 Poky 所需的软件包：\n\
  \n- 下载工具：wget 和 git-core\n- 解压缩工具：unzip 和 tar\n- 编译工具：gcc-multilib、build-essential\
  \ 和 chrpath\n- 字符串操作工具：sed 和 gawk\n- 文档管理工具：texinfo、xsltproc、docbook-utils、fop、dblatex\
  \ 和 xmlto\n- 补丁管理工具：patch 和 diffstat\n\n总结一下，以下是在无头系统上输入的命令：\n\n```\n$ sudo apt-get\
  \ install gawk wget git-core diffstat unzip\ntexinfo gcc-multilib build-essential\
  \ chrpath\n```\n\n## Poky on Fedora\n\n如果你想在 Fedora 上使用 Poky，只需键入以下命令行：\n\n```\n\
  $ sudo yum install gawk make wget tar bzip2 gzip python unzip\nperl patch diffutils\
  \ diffstat git cpp gcc gcc-c++ glibc-devel\ntexinfo chrpath ccache perl-Data-Dumper\
  \ perl-Text-ParseWords\nperl-Thread-Queue socat\n```\n\n## 下载 Poky 元数据\n\n安装完所有必要软件包后，现在可以下载\
  \ Poky 的源代码了。这是通过 Git 工具完成的：\n\n```\n$ git clone git://git.yoctoproject.org/poky\
  \ (branch master)\n```\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_44_0.png)\n\n\
  ### 注意\n\n另一种方法是直接从此仓库下载 tar.bz2 文件：https://www.yoctoproject.org/downloads\n\n为避免所有危险和有问题的操作，强烈建议创建并切换到特定的本地分支：\n\
  \n```\n$ cd poky\n$ git checkout daisy -b work_branch\n```\n\n## 下载树莓派 BSP 元数据\n\
  \n此时，我们只有参考系统（Poky）的基础，而没有对 Broadcom BCM SoC 的支持。基本上，Poky 提出的 BSP 仅提供以下目标：\n\n```\n\
  $ ls meta/conf/machine/*.conf\nbeaglebone.conf\nedgerouter.conf\ngenericipx86-64.conf\n\
  genericipx86.conf\nmpc8315e-rdb.conf\n```\n\n此外，还有 OE-Core 提供的：\n\n```\n$ ls meta/conf/machine/*.conf\n\
  qemuarm64.conf\nqemuarm.conf\nqemumips64.conf\nqemumips.conf\nqemuppc.conf\nqemux86-64.conf\n\
  qemux86.conf\n```\n\n### 提示\n\n下载代码包的详细步骤在本书的前言中有说明。请查看。本书的代码包也托管在 GitHub 上：https://github.com/PacktPublishing/Yocto-for-Raspberry-Pi。我们还从丰富的图书和视频目录中提供其他代码包，可在\
  \ https://github.com/PacktPublishing/ 上查看。去看看吧！\n\n为了为我们的目标生成兼容系统，我们将在这个阶段花费更多时间，并下载特定的层（BSP\
  \ Layer）到树莓派：\n\n```\n$ git clone git://git.yoctoproject.org/meta-raspberrypi\n\
  ```\n\n### 提示\n\n如果你想了解更多关于 git scm 的信息，可以访问官方网站：http://git-scm.com/\n\n- bitbake\n\
  - documentation\n- meta\n- meta-oe\n- meta-raspberrypi\n- meta-selftest\n- meta-skeleton\n\
  - meta-yocto\n- meta-yocto-bsp\n- rpi-build\n- scripts\n- LICENSE\n- oe-init-build-env\n\
  - oe-init-build-env-memres\n- README\n- README.hardware\n\n现在，我们可以验证我们是否拥有平台的配置\
  \ **元数据**（raspberrypi.conf 文件）：\n\n```\n$ ls meta-raspberrypi/conf/machine/*.conf\n\
  raspberrypi.conf\n```\n\n以下截图显示了 meta-raspberrypi 文件夹：\n\n- classes\n- conf\n- files\n\
  - recipes-bcm\n- recipes-bsp\n- recipes-core\n- recipes-devtools\n- recipes-graphics\n\
  - recipes-kernel\n- recipes-multimedia\n- COPYING.MIT\n- README\n- rpi.patch\n\n\
  本章和以下章节中展示的示例和代码使用的是 Yocto Project 版本 1.7 和 Poky 版本 12.0。作为参考，代号是 Dizzy。\n\n既然我们已经全新下载了环境，现在可以继续初始化环境，并通过各种配置文件配置我们的镜像。\n\
  \n## oe-init-build-env 脚本\n\n如倒数第二张截图所示，Poky 目录包含一个名为 oe-init-build-env 的脚本。这是一个用于构建环境配置/初始化的脚本。它不是为了直接执行，而必须通过\
  \ source 加载。它的工作（其中之一）是初始化若干环境变量，并将自身置于参数中指定的构建目录中。脚本必须按以下方式运行：\n\n```\n$ source\
  \ oe-init-build-env [build-directory]\n```\n\n在这里，build-directory 是设置环境的目录名称的可选参数（例如，我们可以在单个\
  \ Poky 源代码树中使用多个构建目录）。如果未指定，则默认为 build。build-directory 文件夹是我们执行构建的地方。但是，为了标准化步骤，我们将在整本书中使用以下命令来初始化环境：\n\
  \n```\n$ source oe-init-build-env rpi-build\n### Shell environment set up for builds.\
  \ ###\nYou can now run 'bitbake <target>'\nCommon targets are:\ncore-image-minimal\n\
  core-image-sato\nmeta-toolchain\nadt-installer\nmeta-ide-support\nYou can also run\
  \ generated qemu images with a command like\n'runqemu qemux86'\n```\n\n当我们初始化构建环境时，它会在\
  \ rpi-build 内创建一个目录（conf 目录）。该文件夹包含两个重要文件：\n\n- local.conf：这包含用于配置 Bitbake 行为的参数。\n\
  - bblayers.conf：这列出了 Bitbake 在其实现中考虑的不同层。\n- 列表分配给 BBLayers 变量。\n\n\n\n\n\n## 编辑\
  \ local.conf 文件\n\nrpi-build/conf/local.conf 文件是一个可以配置构建过程各个方面的文件。正是通过此文件，我们可以选择目标机器（MACHINE\
  \ 变量）、发行版（DISTRO 变量）、包类型（PACKAGE_CLASSES 变量）以及主机配置（例如 PARALLEL_MAKE）。我们需要从默认值中更改的最小变量集如下：\n\
  \n```\nBB_NUMBER_THREADS ?= \"${@oe.utils.cpu_count()}\"\nPARALLEL_MAKE ?= \"-j\
  \ ${@oe.utils.cpu_count()}\"\nMACHINE ?= \"raspberrypi\"\n```\n\nBB_NUMBER_THREADS\
  \ 变量决定 BitBake 将并行执行的任务数量（这些是在 Yocto 下的任务；我们不一定在谈论编译）。默认情况下，在 build/conf/local.conf\
  \ 中，该变量初始化为 ${@oe.utils.cpu_count()}，对应于主机系统上检测到的核心数量（/proc/cpuinfo）。\n\nPARALLEL_MAKE\
  \ 变量对应于 make 的 -j 选项，用于指定 GNU Make 在编译任务中可以并行运行的进程数量。同样，可用核心数量定义了所使用的默认值。\n\nMACHINE\
  \ 变量是我们确定要为 Raspberry Pi 构建的目标机器的地方（在 .conf 文件中定义；在我们的案例中，它是 raspberrypi.conf）。\n\
  \n## 编辑 bblayers.conf 文件\n\n现在我们仍然需要将特定层添加到我们的目标中。这将使来自该层的配方可用于我们的构建。因此，我们应该编辑 build/conf/bblayers.conf\
  \ 文件：\n\n```\n# LAYER_CONF_VERSION is increased each time build/conf\n#bblayers.conf\n\
  # changes incompatibly\nLCONF_VERSION = \"6\" BBPATH = \"${TOPDIR}\" BBFILES ?=\
  \ \"\"\nBBLAYERS ?= \" \\\n/home/packt/RASPBERRYPI/poky/meta \\\n/home/packt/RASPBERRYPI/poky/meta-yocto\
  \ \\\n/home/packt/RASPBERRYPI/poky/meta-yocto-bsp \\\n\"BBLAYERS_NON_REMOVABLE ?=\
  \ \" \\\n/home/packt/RASPBERRYPI/poky/meta \\\n/home/packt/RASPBERRYPI/poky/meta-yocto\
  \ \\\n\"\n```\n\n添加以下行：\n\n```\n# LAYER_CONF_VERSION is increased each time build/conf\n\
  #bblayers.conf\n# changes incompatibly\nLCONF_VERSION = \"6\" BBPATH = \"${TOPDIR}\"\
  \ BBFILES ?= \"\"\nBBLAYERS ?= \" \\\n/home/packt/RASPBERRYPI/poky/meta \\\n/home/packt/RASPBERRYPI/poky/meta-yocto\
  \ \\\n/home/packt/RASPBERRYPI/poky/meta-yocto-bsp \\\n/home/packt/RASPBERRYPI/poky/meta-raspberrypi\
  \ \\\n\"BBLAYERS_NON_REMOVABLE ?= \" \\\n/home/packt/RASPBERRYPI/poky/meta \\\n\
  /home/packt/RASPBERRYPI/poky/meta-yocto \\\n\"\n```\n\n当然，您需要根据自己的安装情况调整绝对路径（此处为\
  \ /home/packt/RASPBERRYPI）。\n\n## 构建 Poky 镜像\n\n在开发的这个阶段，让我们来看看可用且经过认证适用于我们平台的镜像（.bb\
  \ 文件）。\n\n## 镜像选择\n\nPoky 提供了几种预先设计的镜像配方，我们可以使用它们来构建自己的二进制镜像。我们可以通过从 poky 目录运行以下命令来查看可用镜像的列表：\n\
  \n```\n$ ls meta*/recipes*/images/*.bb\n```\n\n所有配方提供的镜像本质上是已解包和配置的包集合，生成可用于实际硬件的文件系统（有关不同镜像的更多信息，您可以访问\
  \ ( http://www.yoctoproject.org/docs/latest/mega-manual/mega-manual.html#ref-images\
  \ ) ）。\n\n接下来，这是可用镜像的简要表示：\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_52_0.png)\n\
  \n我们可以将 meta-raspberrypi 提议的层添加到所有这些层中：\n\n```\n$ ls meta-raspberrypi/recipes-core/images/*.bb\n\
  rpi-basic-image.bb\nrpi-hwup-image.bb\nrpi-test-image.bb\n```\n\n- rpi-hwup-image.bb：这是一个基于\
  \ core-image-minimal 的镜像。\n- rpi-basic-image.bb：这是一个基于 rpi-hwup-image.bb 并添加了一些功能（启动画面）的镜像。\n\
  - rpi-test-image.bb：这是一个基于 rpi-basic-image.bb 并包含 meta-raspberrypi 中的一些包的镜像。\n\n\
  在本章的其余部分，我们将从这三个配方中选择一个。请注意，这些文件（.bb）像所有其他文件一样描述配方。它们逻辑地组织，在这里，我们拥有用于为 Raspberry\
  \ Pi 创建镜像的配方。\n\n## 运行 BitBake\n\n此时，我们需要启动 **BitBake**，即构建引擎，它将解析包含您作为参数传递的镜像的所有配方（在我们的第一个示例中，我们可以使用\
  \ `rpi-basic-image`）：\n\n```\n$ bitbake rpi-basic-image\n```\n\n```\nLoading cache:\
  \ 100%\n|###############################################################################|\n\
  #################################################################################\n\
  ###| ETA:  00:00:00\n########################################\nLoaded 1352 entries\
  \ from dependency cache.\nNOTE: Resolving any missing task queue dependencies\n\
  Build Configuration:\nBB_VERSION = \"1.25.0\"\nBUILD_SYS = \"x86_64-linux\"\nNATIVELSBSTRING\
  \ = \"Ubuntu-14.04\"\nTARGET_SYS = \"arm-poky-linux-gnueabi\"\nMACHINE = \"raspberrypi\"\
  \nDISTRO = \"poky\"\nDISTRO_VERSION = \"1.7\"\nTUNE_FEATURES = \"arm armv6 vfp\"\
  \nTARGET_FPU = \"vfp\"\nmeta\nmeta-yocto\nmeta-yocto-bsp =\n\"master:08d3f44d784e06f461b7d83ae9262566f1cf09e4\"\
  \nmeta-raspberrypi =\n\"master:6c6f44136f7e1c97bc45be118a48bd9b1fef1072\"\nNOTE:\
  \ Preparing RunQueue\nNOTE: Executing SetScene Tasks\nNOTE: Executing RunQueue Tasks\n\
  ```\n\n启动后，Bitbake 首先浏览环境提供的所有文件（`.bb`, `.bbclass`）并将信息存储在缓存中。\n\n虽然 Bitbake 的解析器是并行化的，但第一次执行总是会更长一些（只多几秒钟），因为它需要构建缓存。然而，后续执行将几乎是瞬间完成的，因为\
  \ Bitbake 加载缓存。从前面的命令可以看到，在执行任务列表之前，Bitbake 显示了详细的版本跟踪（目标、版本、操作系统等等）。最后，Bitbake\
  \ 开始执行任务并显示进度。\n\n根据您的设置，您可以去喝杯咖啡，甚至吃些披萨。通常，在此之后，如果一切顺利，您会很高兴地发现 `tmp/` 子目录的目录结构（`rpi-build`）通常已被填充。构建目录（`rpi-build`）在镜像创建后包含大约\
  \ 20 GB 的数据。\n\n经过几个小时的构建后，我们可以为结果和我们目标的系统镜像的创建而欢欣鼓舞：\n\n```\n$ ls rpi-build/tmp/deploy/images/raspberrypi/*sdimg\n\
  rpi-basic-image-raspberrypi.rpi-sdimg\n```\n\n正是这个文件将用于创建我们的可启动 SD 卡。\n\n## 创建 SD\
  \ 卡\n\n现在您的环境已准备就绪，您可以使用以下命令创建 SD 卡（请记住将 /dev/sdX 改为正确的设备名称，并小心不要选择错误的设备名称而损坏硬盘）：\n\
  \n```\n$ sudo dd if=rpi-basic-image-raspberrypi.rpi-sdimg of=/dev/sdX\nbs=1M\n```\n\
  \n复制完成后，您可以使用以下命令检查操作是否成功（参见 mmcblk0）：\n\n```\n$ lsblk\nNAME        MAJ:MIN RM \
  \  SIZE RO TYPE MOUNTPOINT\nmmcblk0     179:0    0   3,7G  0 disk\n├─mmcblk0p1 179:1\
  \    0    20M  0 part\n/media/packt/raspberrypi\n└─mmcblk0p2 179:2    0   108M \
  \ 0 part /media/packt/f075d6df-d8b8-4e85-a2e4-36f3d40035c3c\n```\n\n您还可以查看界面左侧：\n\
  \n![](img/76681dcfb8cd2bd107d0c06ab088f916_56_0.png)\n\n## 在 Raspberry Pi 上启动镜像\n\
  \n我们现在来到了本章无疑最令人期待的时刻：使用全新的 Poky 镜像启动我们的 Raspberry Pi 的时刻。\n\n您只需将 SD 卡插入插槽，将 HDMI\
  \ 电缆连接到显示器，并连接电源（还建议使用鼠标和键盘来关闭设备，除非您计划直接拔掉电源并可能损坏引导分区）。\n\n连接电源后，您应该会看到 Raspberry\
  \ Pi 启动画面：\n\n![](img/76681dcfb8cd2bd107d0c06ab088f916_57_0.png)\n\n### 注意\n\nYocto/Poky\
  \ 发行版的登录用户是 root。\n\n\n\n\n\n## 摘要\n\n在本章中，我们学习了设置 Poky 并构建第一个镜像所需的步骤。我们在 Raspberry\
  \ Pi 上运行了该镜像，从而很好地了解了可用功能。\n\n在下一章中，您将了解 Hob，它为 BitBake 提供了人性化的界面。我们将使用它来构建镜像并进一步自定义。之后，您将了解另一种工具\
  \ Toaster，它是 BitBake 的 Web 界面。\n\n# 第 3 章 掌握使用 Hob 和 Toaster 的构建\n\n在本章中，我们将探讨 Yocto\
  \ Project 中包含的两个强大工具。在本章的第一部分，我们将讨论 Hob，它是 BitBake 的图形界面。在第二部分，我们将使用 Toaster，这是一个\
  \ Web 界面，使您可以使用简单的浏览器（例如 Firefox）跟进构建的高级部分。\n\n## Hob\n\n为了探索 Hob，我们将在本节中梳理其正常运行所需的不同基本步骤。\n\
  \n## 为 Hob 准备环境\n\n与第 2 章《为 Raspberry Pi 构建我们的第一个 Poky 镜像》一样，第一步是初始化环境。回忆此命令：\n\n\
  ```\n$ source oe-init-build-env rpi-build\n```\n\n启动命令后，终端将重定向到 rpi-build 目录。\n\n\
  ## 运行 Hob\n\n现在我们已初始化构建所需的所有变量，可以使用以下命令启动 Hob 界面：\n\n```\n$ hob\n```\n\n运行此命令后，Hob\
  \ 将尝试解析配置文件（local.conf 和 bblayers.conf），以查找可用于创建镜像的元数据。完成此步骤后，您将看到界面启动屏幕，如下所示：\n\
  \n![](img/76681dcfb8cd2bd107d0c06ab088f916_62_0.png)\n\n现在，我们可以从 Hob 提供的列表中选择所需的机器。选择\
  \ **raspberrypi** 机器。\n\n> **注意**\n> 您选择的机器选项对应于 `local.conf` 文件中的 `MACHINE` 变量。\n\
  \n您将看到以下进度屏幕：\n\n### 选择机器\n\n您的选择是您正在为其构建镜像的目标机器的配置文件。\n\nraspberrypi\n\n图层 为机器、软件等添加支持。\n\
