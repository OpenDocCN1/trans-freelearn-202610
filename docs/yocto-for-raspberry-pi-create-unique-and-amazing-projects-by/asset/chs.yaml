  \ Installed 0 object(s) from 0 fixture(s) Starting webserver Webserver address:\
  \ http://0.0.0.0:8000/ Bitbake server address: 0.0.0.0, server port: 54693 Successful\
  \ start.\n```\n\n我们现在可以通过 http://0.0.0.0:8000/ 访问我们的 Web 界面。\n\n## 运行 BitBake\n\n\
  目前，Toaster 不支持通过界面进行配置（未来版本的 Toaster 将添加构建运行和构建自定义功能）。Toaster 收集并展示有关您构建的信息，您可以使用\
  \ Web 浏览器进行导航和查询。因此，我们必须手动启动 BitBake 来监控构建进度。如 [第 2 章，为树莓派构建我们的第一个 Poky 镜像] 中所示，我们可以使用以下命令启动构建过程：\n\
  \n```\n$ bitbake rpi-basic-image\n```\n\n构建过程将按以下方式进行：\n\n```\nLoading cache: 100%\n\
