  \n您是否需要 IT 问题的即时解决方案？PacktLib 是 Packt 的在线数字图书馆。在这里，您可以搜索、访问和阅读 Packt 的整个图书库。\n\n\
  ## 为何订阅？\n\n- 可在 Packt 出版的每本书中全文搜索\n- 复制粘贴、打印和收藏内容\n- 按需访问，可通过 Web 浏览器使用\n\n## 前言\n\
  \n本书将从为 Raspberry Pi 创建定制镜像，到使用 Yocto Project 和 Raspberry Pi 作为基础实施小型家庭自动化项目，涵盖方方面面。\n\
  \n本书将首先向您介绍 Yocto Project 并展示 Raspberry Pi 平台。掌握这些信息后，您将学习如何将 Yocto Project 与 Raspberry\
  \ Pi 集成。在整本书中，您将学习从开发自定义应用程序到使用 Wii nunchuck 以及使用 Yocto Project 为 Raspberry Pi 配置\
  \ LCD 触摸屏的所有内容。本书将以一章实践内容结束，该章将通过创建家庭自动化项目来总结您在整本书中学到的所有内容。\n\n\n\n\n\n## 本书内容概要\n\
  \n第 1 章，认识 Yocto Project，介绍了 Yocto Project 的基本概念。将讨论 Yocto Project、OpenEmbedded\
  \ Core、Poky 和 BitBake 的历史。\n\n第 2 章，为 Raspberry Pi 构建第一个 Poky 镜像，教你如何使用 Yocto Project\
  \ 为 Raspberry Pi 创建第一个镜像以及如何运行它。\n\n第 3 章，使用 Hob 和 Toaster 进行构建，教你如何使用用户友好的界面 Hob\
  \ 和 Toaster。\n\n第 4 章，理解 BitBake，为你提供对 BitBake 的更深入理解。\n\n第 5 章，在 Raspberry Pi 上创建、开发和部署，教你如何将自定义应用程序与\
  \ Raspberry Pi 集成。这将包括学习如何生成用于交叉编译应用程序的 SDK。\n\n第 6 章，使用外部层，带你了解层的工作原理以及如何将外部层与\
  \ Raspberry Pi 项目集成。\n\n第 7 章，在 Raspberry Pi 上部署自定义层，探讨如何使用 Yocto Project 提供的不同工具生成自定义层。\n\
  \n第 8 章，深入探讨 Raspberry Pi 的外设和 Yocto 配方，教你如何通过 Yocto Project 处理 Raspberry Pi 的 SPI\
  \ 和 I2C 总线。你还将学习如何为自定义应用程序创建自己的配方。\n\n第 9 章，在 Raspberry Pi 上制作媒体中心，介绍如何部署自定义应用程序以构建嵌入式媒体中心，例如可用于监控\
  \ CPU 温度。该解决方案将需要 HTML5 和 Node.js 来设置远程监控温度所需的 Web 界面。\n\n第 10 章，玩转 LCD 触摸屏和 Linux\
  \ 内核，介绍了 Linux 内核的一些基础知识以及如何配置它以支持各种 LCD 触摸屏。随后，本章解释了如何设置 Yocto Project，在 Raspberry\
  \ Pi 上使用 LCD 触摸屏运行图形应用程序或窗口系统。\n\n第 11 章，为 Raspberry Pi BSP 层做出贡献，教你如何为 meta-raspberrypi\
  \ 层做出贡献。\n\n第 12 章，家庭自动化项目 – 启动自定义镜像，是本书的最后一章，我们将在其中总结本书中所学的所有内容。这是通过创建一个家庭自动化项目来完成的。\n\
  \n## 本书所需内容\n\n- 一台配备受支持主机系统的 Linux 工作站（请参阅 http://www.yoctoproject.org/docs/current/ref-manual/ref-manual.html#detailed-supported-distros）\n\
  - 主机系统所需的软件包（请参阅 http://www.yoctoproject.org/docs/current/ref-manual/ref-manual.html#required-packages-for-the-host-development-system）\n\
  - Git、tar 和 Python 的必需版本（请参阅 http://www.yoctoproject.org/docs/current/ref-manual/ref-manual.html#required-git-tar-and-python-versions）\n\
  \n## 本书适用人群\n\n本书面向希望了解 Yocto Project 的嵌入式软件学生、嵌入式 Linux 工程师以及精通 Raspberry Pi（或其他\
  \ ARM 平台）的嵌入式系统爱好者。\n\n本书是熟练掌握并拓宽知识以便将其应用于嵌入式开发的理想方式。\n\n如果你在寻找一本能帮助你在 Raspberry\
  \ Pi 和 Yocto Project 上进行开发的书籍，那么这本书就是你需要的那一本。\n\n## 约定\n\n在本书中，你会发现多种文本样式，用于区分不同种类的信息。以下是这些样式的一些示例及其含义解释。\n\
