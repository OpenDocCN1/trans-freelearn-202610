  \ Ctrl 加 0 到 9 之间的任意数字保存，然后再试试 Shift 加 0 到 9 之间的任意数字。\n\n最后，如果需要，调整焦距，然后就可以导出图像了。如上面截图所示，我们有四种尺寸可选。可用格式有\
  \ JPG、BMP、DDS、PNG 和 TGA。\n\n## 电影模式\n\n然而，Lumion 的潜力并不仅限于照片模式。事实上，Lumion 最大的潜力在于它能快速创建令人惊艳的视频。所以，让我们进入电影模式。当你切换到这个菜单时，主界面显示如下：\n\
