  \ - 导入图像，4 - 录制\n\n还记得我说过 Lumion 界面直观友好吗？这一部分就是一个例证。你可以用最简单、最轻松的方式创建影片。\n\n在上面截图的底部，我们可以看到九个剪辑。每个剪辑可以存储一段小动画，或者如果你愿意，也可以存储整个影片。Lumion\
  \ 还允许你导入图像或视频。所以，也许我们想在视频开头显示自己的标志；我们不需要在另一个应用程序中完成这件事。只需导入所需内容并添加到影片中即可。为此，点击第二个按钮导入图像，或点击第三个按钮导入影片。现在，让我们开始创建动画。点击第一个带有相机图标的按钮，如下面的截图所示：\n\
  \n![](img/192b6e55337adc00931f510ecaaf8e05_40_0.png)\n\n录制菜单：1 - 播放影片，2 - 剪辑速度，3\
  \ - 拍照，4 - 返回电影模式\n\n正如我告诉你的，它的工作原理非常简单。你看到带相机的按钮了吗？点击开始你的第一个镜头。然后稍微移动相机到另一个角度，再次点击，重复操作直到你满意为止。之后，点击播放按钮，看看你的动画效果如何：\n\
  \n> 还记得我告诉过你，使用 Ctrl 键加数字键 0 到 9 可以保存相机视角吗？使用 Shift 键加数字键 0 到 9 可以加载已保存的视角。你也可以在此模式下使用该快捷键。\n\
  \nLumion 的另一个实用功能是，你可以加快或减慢剪辑速度。在左侧有一个滑块，可以增加或降低速度。当对动画满意后，点击**确定**按钮就可以了。恭喜，你已经创建了自己的第一个动画。现在，电影界面会变成如下截图所示！\n\
  \n![](img/192b6e55337adc00931f510ecaaf8e05_41_0.png)\n\n带有我们刚创建的剪辑的电影菜单界面：1 - 编辑剪辑，2\
  \ - 新效果，3 - 复制，4 - 带效果构建，5 - 播放，6 - 保存影片\n\n现在，如果需要，我们可以再次编辑剪辑。点击剪辑，里面有两个按钮：一个允许我们返回并编辑剪辑，另一个用于删除它。这并不是唯一的方法。如果查看左上角，我们会有四个新按钮：\n\
  \n- **编辑剪辑：** 它会带你回到可以编辑剪辑的菜单。\n- **新效果：** 它会给剪辑添加效果，而不会影响整个影片。\n- **复制：** 我们需要在剪辑上应用一个效果，以便复制该效果并粘贴到另一个剪辑中。\n\
  - **粘贴：** 是的，我知道我说了四个按钮，但这个按钮只有在复制效果后才会出现。它允许我们将效果粘贴到另一个剪辑或整个影片中。\n- **带效果构建：**\
  \ 启用此选项，可在构建模式下查看已应用的效果。\n\n\n\n\n## 什么是 Lumion？\n\n在此模式下，Lumion 允许我们为每个片段和整部影片添加效果。例如，当我们想为某个特定片段添加淡入/淡出或更改景深时，此选项非常有用。我添加了一些暗角效果，并在背景中加入了一点雾气。在这种情况下，我们没有需要动画的内容，但我们可以通过使用高级功能（例如动画对象或隐藏图层）来在这里添加这些效果。\n\
  \n现在，要导出影片，请点击右侧的 **保存影片** 按钮。就是带有影片片段图标的那个按钮。导出影片或图像时，可以使用以下选项：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_42_0.png)\n\
  \n保存菜单\n\n我们可以通过多种选项导出 MP4 格式，例如质量、每秒帧数和分辨率。另一个选项是将影片导出为一组图像，这是一个非常有用的选项。第三个选项是像照片菜单中那样保存单张图片，但拥有更多选项。这些选项包括保存多个渲染通道的可能性。\n\
  \n## 保存场景\n\n为了完成本章，我们还需要知道如何保存场景。再看一下图片，我们可以看见保存按钮（软盘图标的那一个）。点击 **保存** 按钮，Lumion\
  \ 会打开 **保存场景** 选项卡。在这里，我们可以为场景命名，也可以添加描述。请注意，当你点击红色的 **确定** 按钮时，Lumion 会在左侧提示我们现在正在处理版本号\
  \ 1。每次我们保存时，这个数字都会增加。你可以在下面的截图中看到这个按钮：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_43_0.png)\n\
  \n在进入下一章之前，还有两件事要说。带有齿轮的按钮允许我们返回 **设置**，并在需要时更改 **质量设置**；最后一个是剧院模式。因此，如果你的笔记本电脑上装有\
  \ Lumion，你可以进行实时漫游，而无需导出影片或图像。\n\n## 总结\n\n本章旨在帮助你开始使用 Lumion，并让你体验如何轻松、快速地获得出色的图像和视频。具体来说，你学习了保存和加载场景、导入模型、添加材质、更改地形和天气以及创建照片和视频的基本步骤。\n\
  \n这是在 Lumion 中取得出色成果的基本工作流程。现在，你可以在自己的项目中立即应用所学内容。本书的其余章节将帮助你提升技能和技巧。\n"
- '# 2 准备场景


  我相信在读完第一章后，你现在已经迫不及待地想开始使用 Lumion 了。我们已经了解了基础知识，这肯定有助于你继续前进，但现在是时候完善我们的技能，并看看可以在哪里以及如何改进我们的工作流程了。本章与建模和准备场景有关，但我们不仅仅要做这些。我们将找出初学者常犯的一些错误，学习如何避免它们以防止之后在
  Lumion 中出现问题，同时还会了解在哪里可以为场景找到模型，以及一些提升图像或视频真实感的技巧。


  在本章中，我们将学习以下内容：


  - 为可视化而建模

  - 处理 CAD 图纸

  - 细节的重要性

  - 如何使用我们自己的模型

  - 避免常见错误


  正如我们在第 1 章“什么是 Lumion？”中所看到的，Lumion 是一款出色的工具，旨在让任何人都有机会创建惊艳的静态图像和视频。但在我们开始使用 Lumion
  创建这些内容之前，我们需要一个可以随时在 Lumion 中使用的 3D 模型。因此，我们需要创建一个模型，同时考虑几个要点，不仅是为了帮助我们提升真实感，也是为了在将模型导入
  Lumion 时避免问题。


  ### 需要建模帮助？


  本书的范围不是教你如何使用 3ds Max、ArchiCAD 或 Revit 等 3D 应用程序进行建模。也许这是你第一次尝试创建自己的建筑可视化作品，而且你没有任何建模经验。


  别担心，SketchUp 是适合你的完美解决方案，而且最重要的是，它是免费的！在 SketchUp 中建模非常容易，原因是 SketchUp 的开发目的是满足那些没有使用复杂
  3D 应用经验的人的需求。所以，即使你没有任何经验，SketchUp 也能帮助你开始制作自己的可视化作品。


  想试试 SketchUp 吗？请从 http://www.sketchup.com/download 下载。


  ### 为可视化而建模


  为可视化而建模并不难；你只需要遵循一些基本规则即可开始。第一条基本规则是问自己：我会看到这个吗？这是我们在开始建模时必须问自己的一个重要问题。如果你看不到某些东西，或者不打算在最终图像或影片中展示它，就不要浪费时间建模。此外，建模你看不到的东西，会使文件变大，影响工作站性能和渲染时间。


  这个问题显示了规划的重要性。你可能想知道规划与建模有什么关系。嗯，当我们想要创建建筑可视化时，我们需要从头开始创建一切。这种自由可能会适得其反，因为有太多的机会和可能性，我们可能会失去焦点，开始建模不必要的东西和细节。


  因此，规划是成功的关键，良好的规划可以为我们节省大量时间。我们需要思考想要展示什么。你是要做一些特写镜头还是整栋建筑的视图？你能从鸟瞰图中看到门上的铰链吗？我想不能，但如果你打算在人的视线高度创建静态图像，你可能需要包含这个细节。你明白我所说的规划是什么意思吗？静态图像中所需的细节与影片不同，我们需要在开始建模之前提前思考。


  有了明确的目标，那就去吧，拿起铅笔，为每个静态图像画一些草图。如果你想要一部影片，请为每个运动序列创建一个故事板。这将帮助你了解你需要建模什么，在哪里需要添加更多细节，以及在哪里需要制作一些基本形状。


  ### 准备 CAD 图纸


  在画了一些草图后，我们需要 CAD 图纸。几乎每个项目都始于一个包含技术图纸和规格的 CAD 文件。这些文件构成了创建 3D 模型的基础，从一开始就正确准备它们对我们来说非常重要，以防止后续出现问题。这些原则适用于每个
  3D 建模应用，而不仅仅是 SketchUp。


  不管我们是从客户那里收到 CAD 图纸，还是由我们自己绘制图纸，我们总是需要先“清理”这些图纸。这是什么意思呢？嗯，在房屋或建筑模型中总会有一定量的不必要信息。通常，我会将图纸的副本保存为类似
  Drawing_Clean.DWG 的文件。在图纸内部，我有包含墙壁、门、窗和立面的平面图。在清理图纸时，不要忘记检查外部引用并绑定它们，否则在导入图纸时它们将不会出现。检查是否有任何隐藏图层包含信息，并使用缩放范围选项来检查是否有比屏幕上所见更多的信息。有时，图纸可能相互离得很远。


  因此，删除所有你不需要的内容，包括图层、线型和其他 CAD 元素。如果我们移除其中一些对象，CAD 图纸的文件大小和复杂性将降低，并且在我们 3D 应用内部管理内容也会更容易。下图展示了一个干净且准备就绪的
  CAD 图纸：


  ![](img/192b6e55337adc00931f510ecaaf8e05_47_0.png)


  一个仅包含我们所需信息的 CAD 图纸示例






  ## 准备场景


  如果我需要更多信息，我通常会保持 CAD 绘图打开以便快速查看。一件很重要的事情是，我们的绘图需要有比例。否则，当我们将其导入 SketchUp 或其他 3D
  应用时，可能会出现两个基本问题：我们将无法看到我们的平面图，要么是因为它太小需要放大，要么是因为它太大需要缩小。而且即使你放大或缩小以查看平面图和建模，当我们将模型导入
  Lumion 时问题仍然会存在。我们的模型要么巨大要么微小，我们需要回去重新缩放它。


  完成所有这些步骤后，运行 `Purge` 和 `Audit` 功能，以确保所有不必要的信息都被删除并且错误得到修复。你最后需要确认的一件事是，你的绘图是否设置在原点位置
  `(0,0,0)`。这非常重要，因为绘图可能不在原点，而是在远离原点的位置，当我们导入时，事情可能不会顺利。这不是世界末日，但你应该养成让绘图靠近原点位置的习惯。要将绘图移动到原点位置，使用命令
  `Move (M)`，输入 0,0,0，然后按 *Enter*。


  现在我们已经规划了镜头，拥有了干净的绘图，并且知道我们需要建模的内容，让我们开始建模吧。


  ## 使用 SketchUp、3ds Max 和 Maya 进行建模


  建模过程本身相对直接。我在对房屋进行一些研究后建立了模型。我收集了网上和书籍中能找到的所有平面图和图像。由于这种经典设计有很好的记录，所以找到我需要的信息并不困难。建模部分相当简单，因为建筑物没有任何复杂的形状，因此这就是从盒子开始的多边形建模。因此，在这种情况下，我没有使用任何复杂的
  CAD 绘图；只是一些用于核对尺寸的参考。


  这个主题与建模有关，但再次说明，教你们如何建模超出了本书的范围。相反，我们将学习一些小技巧，我们可以用它们来在 Lumion 中准备场景并准备我们自己的模型，以及如何纠正建模过程中可能出现的一些错误。我将重点介绍我使用最多并且有经验的三个
  3D 应用，但这里学到的所有内容都可以应用于任何 3D 应用。它们可能命令不同，但最终结果是相同的。


  ### 细节的重要性


  细节的重要性有时会被低估。我们倾向于认为我们需要很棒的材料和出色的灯光来创建美丽的图像。那也很重要，但我们拥有所有这些东西，我们的渲染仍然会显得平淡或不怎么样。为什么？因为我们需要细节，细节，再细节。所以，我的意思是，你需要停下来，开始环顾自己，注意所有的小细节。我们将在本书后面讨论这个问题，但只是给你一个概念，如果我们在场景中成排直线添加花朵，你觉得会是什么样？假的，因为即使你有一个完美主义的花匠种植花朵，你仍然会有轻微的变化。现在，既然我们谈论的是建模房屋，我们如何为模型添加细节呢？好吧，让我们看看下一个主题并找出答案。


  ### 使用倒角边缘添加细节


  通过添加以下截图中可以看到的此类细节，建筑可视化中可以实现很高的真实感。尖锐边缘的问题是，你会得到一种平坦而毫无生气的感觉，更难实现良好的真实感。


  现实生活中几乎没有尖锐的边缘，甚至大多数人造物体都有轻微的圆润。倒角有助于突出细节，并通过让边缘正确捕捉来自灯光解决方案的高光来真正体现模型的真实感：


  ![](img/192b6e55337adc00931f510ecaaf8e05_49_0.png)


  以下截图将帮助你更好地理解使用尖锐边缘和使用倒角边缘之间的区别。左侧显示没有倒角的边缘，右侧可以看到带倒角的边缘：


  ![](img/192b6e55337adc00931f510ecaaf8e05_50_0.png)


  你觉得哪一个看起来更好？现在看看你的模型，看看你可以在哪里添加这种细节，但也要记住，如果你没有打算展示这些细节，就不要费心建模它们。相信我，倒角边缘会带来巨大的差异。


  我们如何在 SketchUp 中做到这一点？SketchUp 没有任何特定工具来执行此操作，因此你需要下载一个插件。我使用了来自 Fredo6 网站的 RoundCorners
  插件。在我们看到它如何工作之前，一句忠告：在进行这类操作时，最好先保存再建模。原因在于，这些是插件，因此不是应用程序的一部分，有时当我们执行此操作时，应用程序可能会崩溃，我们可能会丢失所有工作。使用此插件的工作方式相当简单，如以下步骤所述：


  1. 选择你想要的圆角类型。你可以从圆角、尖角和倒角边缘中选择，如以下截图所示：


  ![](img/192b6e55337adc00931f510ecaaf8e05_50_1.png)


  2. 然后，选择你想要倒角的边缘。我发现如果你选择整个几何体，插件将仅对边缘添加效果，如以下截图所示：


  ![](img/192b6e55337adc00931f510ecaaf8e05_51_0.png)


  RoundCorners 菜单


  3. 在截图顶部，我们可以看到菜单栏。你只需在 Offset 选项中插入一个值；如果你对结果满意，点击空白处或点击用绿色勾号符号表示的 OK 按钮。


  > 你可以从 http://www.sketchup.com/training/videos.html 提供的培训视频中获得一些有用的提示。


  如果使用 Maya，请执行以下步骤：


  1. 选择你想要倒角的边缘。

  2. 按 F3 选择 Polygons 菜单。

  3. 选择 Edit Mesh 菜单，然后点击 Bevel 选项。这将打开一个名为 Bevel Options 的窗口。

  4. 我们可以保留默认设置，只更改 Width 值和 Segments 数量。然后点击 Apply 而不是 Bevel，因为如果你想回去更改设置，只需按 Ctrl
  + Z 即可：


  ![](img/192b6e55337adc00931f510ecaaf8e05_52_0.png)


  Bevel Options 菜单


  在 3ds Max 中，我们可以通过以下步骤使用 Chamfer 选项：


