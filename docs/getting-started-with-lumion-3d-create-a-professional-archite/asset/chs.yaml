  \nLumion 的另一个很酷的功能是，它可以让我们的构建模式应用这些效果。比方说，我想让场景显示一些雨，添加该效果，然后点击**带效果构建**按钮。\n\n\
  你能在屏幕顶部看到10个带有相机图标的缩略图吗？在上面的截图中，其中一个缩略图已经填充了图像。这是另一个很棒的功能。假设我们正在处理场景，调整好相机，而且非常喜欢——完美的角度和构图。现在，如果能保存这个相机视角就好了。事实上，我们可以按\
