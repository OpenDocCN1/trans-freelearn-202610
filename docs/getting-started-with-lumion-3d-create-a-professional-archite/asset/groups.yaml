    - Max file - *.max\n- 3ds file - *.3ds\n- Obj file - .obj\n\n使用 COLLADA 的原因在于，与我们之前提到的文件格式相比，它是一个更好的选择。正如我所说，没有什么能阻止你使用这些文件格式，但它们可靠性较低，并且不总是包含我们想要的所有数据。为了获得最佳结果并降低出错的可能性，COLLADA\
    \ 是正确的选择。COLLADA 并非在所有应用程序中都可用，在某些情况下，例如当我们使用旧版本的 3ds Max 或 Maya 时，我们需要安装一个名为\
    \ OpenCOLLADA 的 COLLADA 插件。\n\n在 https://code.google.com/p/opencollada/downloads/list\
