    \ SketchUp 中，选择 File 菜单，将鼠标悬停在 Export 选项上，然后选择 3D model。\n\n现在，你需要设置一些选项以正确导出\
    \ 3D 模型。点击 Options 按钮并选择以下选项：\n\n- Triangulate All Faces\n- Preserve Component\
    \ Hierarchies\n- Export Texture Maps\n\n![](img/192b6e55337adc00931f510ecaaf8e05_75_0.png)\n\
    \n导出模型为 COLLADA 文件的正确设置\n\n### 使用 Lumion\n\n你需要选择 **Triangulate All Faces** 选项才能在\
    \ Lumion 中看到你的 3D 模型，并且 **Export Texture Maps** 选项将在你导出 3D 模型的文件夹中创建一个包含所有纹理贴图的文件夹。不要忘记为模型的每个部分分配不同的材质，因为你随\
    \ 3D 模型导出的材质数量等于你在 Lumion 中可以更改的材质数量。继续前进，让我们看看如何使用 3ds Max 执行相同的操作。\n\n## 从 3ds\
    \ Max 导出\n\n要使用 3ds Max，我们需要在导出 3D 模型之前考虑几个方面。不要忘记在 3ds Max 中建模时使用真实尺寸；否则，你的 3D\
    \ 模型在导入 Lumion 后会非常小或非常大。还有几件事你需要更加注意。\n\n在导出材质之前，将它们转换为标准材质，因为如果你在导入到 Lumion\
    \ 时使用任何其他类型的材质，例如 V-ray 材质，模型将被导入但没有纹理。此外，在使用标准材质时，你可以使用两种纹理：一种放在 **Diffuse**\
    \ 槽中，另一种放在 **Self-illumination** 槽中以使用光照贴图或提供额外细节。除此之外，材质中可能有的任何内容，例如高光贴图或凹凸贴图，都不会被导出。\n\
    \n现在是导出模型的时候了。选择 **OpenCollada**，或者如果你使用的是更新版本的 3ds Max，你可以选择 **Autodesk COLLADA**。如果你使用此选项，请在\
    \ Geometry 选项卡中选择 **Convert Deforming Dummies to Bones**，并在 Collada 选项卡中选择 **Triangulate**\
    \ 和 **Single Matrix**。\n\n"
