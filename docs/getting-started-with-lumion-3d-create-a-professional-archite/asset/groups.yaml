    2. Then, select the edges you want to bevel. I found that if you select the entire
    geometry, the plugin will add the effect just to the edges, as shown in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_51_0.png)


    The RoundCorners menu


    3. At the top of the screenshot, we can see the menu bar. You just need to insert
    a value in the Offset option; if you are happy with the result, click on an empty
    space or on the button symbolized with a green tick mark meaning OK.


    > You can pick up some useful tips from the training videos available at http://www.sketchup.com/training/videos.html.'
