    website for Fredo6. Before we see how it works, a word of advice: in these kinds
    of operations, it is always a good idea to save first and model later. The reason
    being, these are plugins, hence they are not a part of the application, and sometimes
    when we perform this operation, the application can crash and we may end up losing
    all the work. Working with this plugin is pretty simple, as explained in the following
    steps:


    1. Select the kind of round corners you want. You can choose from round corners,
    sharp corners, and bevel-edged corners, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_50_1.png)


    2. Then, select the edges you want to bevel. I found that if you select the entire
    geometry, the plugin will add the effect just to the edges, as shown in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_51_0.png)


    The RoundCorners menu


    3. At the top of the screenshot, we can see the menu bar. You just need to insert
    a value in the Offset option; if you are happy with the result, click on an empty
    space or on the button symbolized with a green tick mark meaning OK.


    > You can pick up some useful tips from the training videos available at http://www.sketchup.com/training/videos.html.


    In case you are using Maya, carry out the following steps:


    1. Select the edges that you want to bevel.

    2. Press F3 to select the Polygons menu.

    3. Select the Edit Mesh menu and then click on the Bevel option. This will open
    a window called Bevel Options.

    4. We can leave the default settings and change only the Width value and the number
    of Segments. Then click on Apply and not on Bevel, because if you want to go back
    and change the settings, you just need to press Ctrl + Z:


    ![](img/192b6e55337adc00931f510ecaaf8e05_52_0.png)


    The Bevel Options menu


    In 3ds Max, we can use the Chamfer option by following the ensuing steps:


    1. First, you need to apply the Edit Poly modifier to the object.

    2. Select the edges you want to chamfer.

    3. In the Edit Edges menu, click on the Chamfer settings.

    4. Here, you just have to be concerned with the Amount and Segments values. Don''t
    forget to click on the green colored tick mark if you are happy with the result
    as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_53_0.png)


    > If you are looking for help in modeling using 3ds Max or Maya, have a look at
    the videos available at http://www.evermotion.org/tutorials/show/7979/tip-of-the-week-3d-building-modeling-part-1.


    There are also a few scripts that can help while modeling for architectural visualization.
    The following is a list of useful plugins for SketchUp:


    - **JointPushPull**: This helps to perform a push or pull operation on a curved
    surface.

    - **RoundCorners**: This is used to bevel edges.

    - **SubdivideAndSmooth**: This helps in the subdivision of the surface for modeling.

    - **SketchyFFD**: This is a freeform deformation matrix for your model that makes
    it malleable.

    - **FreeScale**: This is an improvement of SketchUp''s native `Scale` function.

    - **Boolen**: This helps to create Booleans.

    - **Shapes**: This is a useful tool for creating complex geometrical shapes.

    - **Weld**: This helps find gaps in a line that are not visible and automatically
    welds the broken points.

