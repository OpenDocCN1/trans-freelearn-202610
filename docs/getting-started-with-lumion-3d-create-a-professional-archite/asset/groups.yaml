    There are also a few scripts that can help while modeling for architectural visualization.
    The following is a list of useful plugins for SketchUp:


    +   - **JointPushPull**: This helps to perform a push or pull operation on a curved
    surface

    +   - **RoundCorners**: This is used to bevel edges

    +   - **SubdivideAndSmooth**: This helps in the subdivision of the surface for
    modeling

    +   - **SketchyFFD**: This is a freeform deformation matrix for your model that
    makes it malleable

    +   - **FreeScale**: This is an improvement of SketchUp''s native `Scale` function

    +   - **OSCoolean**: This helps to create Booleans

    +   - **Shapes**: This is a useful tool for creating complex geometrical shapes

    +   - **Weld**: This helps find gaps in a line that are not visible and automatically
    welds the broken points'
