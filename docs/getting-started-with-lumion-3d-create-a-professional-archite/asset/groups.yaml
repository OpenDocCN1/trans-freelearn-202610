    \n## 制作人员\n\n**作者**\nCiro Cardoso\n\n**审校者**\nMirivano Carrig\n\n**组稿编辑**\nNeha\
    \ Nagwekar\n\n**策划编辑**\nAmit Ghodake\n\n**技术编辑**\nAparna Chand\nAparna Kumari\n\
    \n**文字编辑**\nRoshni Banerjee\nSarang Chari\nKaruna Narayanan\nShambhavi Pai\nAlfida\
    \ Paiva\n\n**项目协调员**\nSherin Padayatty\n\n**校对**\nAmeesha Green\nSimran Bhogal\n\
    \n**索引编制者**\nTejal Soni\n\n**制作协调员**\nSaiprasad Kadam\n\n**封面制作**\nSaiprasad Kadam\n\
    \n## 关于作者\n\n**Ciro Cardoso** 是一位葡萄牙 3D 艺术家，曾成功将 Lumion 应用于价值数百万美元的项目。他在 2000\
    \ 年迷上了 AutoCAD，自 2005 年以来一直为专业组织和公司制作 3D 图形。他的个人客户遍及英国、葡萄牙、荷兰及非洲等地，项目涵盖平面设计到 3D\
    \ 可视化等众多领域。\n\n除了 3D 艺术家的工作外，他还志愿向年轻人教授 SketchUp 和 CAD。可以通过他的网站 `http://www.cirocardoso.net`\
    \ 与他联系。\n\n> > 我想感谢我亲爱的妻子 Miriam，感谢她在本书写作期间始终如一的支持。我尤其要感谢 Neha Nagwekar 在整个项目中给予的鼎力支持。\n\
    \n## 关于审校者\n\n**Mirivano Carrig** 在爱尔兰的 AIT 学习了五年土木工程。除了对土木工程有浓厚兴趣外，他对建筑和艺术也怀有极大热情。多年来，他因土木工程相关的工作获得了众多奖项。2012\
    \ 年，他创建了一个名为 Vano Engineering 的博客/网站，网址为 `http://vanoengineering.wordpress.com`，第一年就获得了超过\
    \ 15,000 次浏览量，此后一直在持续增长。\n\n他最为人所知的是在建筑和工程设计中采用的 *跳出框架* 的思维方式；他将绘画和艺术的经验与自己的天赋和对结构的理解相结合。\n\
    \n> 我想感谢我的父亲，感谢他所有的支持、鼓励、亲切的话语和智慧箴言，但最重要的是，他一直都在我身边！谢谢。\n\n## 支持文件、电子书、折扣优惠及更多\n\
    \n你可能会想访问 www.PacktPub.com 获取与本书相关的支持文件和下载资源。\n\n你知道吗，Packt 为每一本出版的书都提供电子书版本，包含\
    \ PDF 和 ePub 文件？你可以在 www.PacktPub.com 升级到电子书版本，而且作为纸质书客户，你有权享受电子书折扣。如需了解更多详情，请通过\
    \ service@packtpub.com 与我们联系。\n\n在 www.PacktPub.com，你还可以阅读一系列免费技术文章、订阅多种免费通讯，并获得\
    \ Packt 图书和电子书的独家折扣和优惠。\n\n![](img/192b6e55337adc00931f510ecaaf8e05_6_0.png)\n\
    \nhttp://PacktLib.PacktPub.com\n\n你需要 IT 问题的即时解决方案吗？PacktLib 是 Packt 的在线数字图书库。在这里，你可以访问、阅读和搜索\
    \ Packt 的全部图书。\n\n### 为什么要订阅？\n\n- 可全文检索 Packt 出版的所有图书\n- 可复制粘贴、打印和收藏内容\n- 按需使用，通过网络浏览器即可访问\n\
