    I am sure that after going through the first chapter, you are now eager to start
    working with Lumion. We ran through the basics that will certainly help to keep
    you going, but now is the time to refine our skills and also see where and how
    we can improve our workflow. This chapter is related to modeling and preparing
    our scene, but we will be doing more than that. We will identify some common mistakes
    made by beginners and learn how to avoid them to prevent having problems later
    with Lumion, and also where you can find models for your scenes, along with a
    few tips to improve the realism of your image or video.


    In this chapter we will learn the following:


    - Modeling for visualization

    - Working with CAD drawings

    - Importance of detailing

    - How to use our own models

    - Avoiding common mistakes


    As we saw in Chapter 1, What is Lumion?, Lumion is a great tool designed to give
    anyone the opportunity to create amazing still images and videos. But before we
    start using Lumion to create such things, we need a 3D model that is ready to
    be used in Lumion. So, we need to create a model and at the same time take into
    account a few points not only to help us improve the realism, but also to avoid
    problems while importing our model to Lumion.


    ### Need help with modeling?


    The scope of this book is not to teach you how to model using a 3D application
    such as 3ds Max, ArchiCAD, or Revit. Maybe this is the first time that you are
    trying to create your own architectural visualizations and you don''t have any
    experience with modeling.


    Don''t despair, because SketchUp is the perfect solution for you, and best of
    all, it is free! Modeling in SketchUp is really easy and the reason behind it
    is that SketchUp has been developed to cater to people who don''t have any experience
    in using complex 3D applications. So, even if you don''t have any experience,
    SketchUp can help you start making your own visualizations.


    Do you want to try SketchUp? Download it at http://www.sketchup.com/download.


    ### Modeling for visualization


    Modeling for visualization is not hard; you just need to follow some basic rules
    to help you start. The first basic rule is to ask: Will I see this? This is an
    important question we have to ask ourselves when we start modeling. If you don''t
    see something or you are not thinking of showing it in the final image or movie,
    don''t waste time modeling it. Besides, by modeling things you don''t see, you
    are making the file size bigger, affecting both your workstation performance and
    the rendering time.


    This question shows the importance of planning. You may wonder what planning has
    to do with modeling. Well, when we want to create an architectural visualization,
    we need to create everything from scratch. This freedom may be counterproductive
    because with so many opportunities and possibilities, we may lose focus and start
    modeling unnecessary things and details.


    So, planning is the key to success, and good planning can save us a lot of time.
    We need to think about what we want to show. Are you going to do some close-ups
    or a view of the whole building? Can you see the hinges on a door from an aerial
    view? I think not, but if you are planning to create a still image at a person''s
    eye level, you may need to include this detailing. Do you see what I mean by planning?
    The detailing we need in a still image is not the same as that of a movie, and
    we need to think ahead before starting with modeling.


    With a specific end in mind, go ahead, take a pencil, and do some sketches for
    each still image. If you want a movie, create a storyboard with each moving sequence.
    This will help you know what you need to model, where you need to add more detailing,
    and where you need to make some basic shapes.


    ### Preparing CAD drawings


    After doing some sketches, we need a CAD drawing. Almost every project starts
    with a CAD file which has the technical drawings and specifications. These files
    form the baseline for a 3D model to be created, and it is very important for us
    to prepare them right from the beginning in order to prevent problems later. These
    principles apply to every 3D modeling application and not to SketchUp alone.


    It doesn''t matter if we receive a CAD drawing from a client or have a plan drawn
    by us, we always need to "clean" these drawings first. What does that mean? Well,
    there is always a certain amount of unnecessary information in a house or building
    model. Usually, I save a copy of the drawing as something like Drawing_Clean.DWG.
    Inside the drawing, I have the plan with walls, doors, windows, and elevations.
    While cleaning the drawing, don''t forget to check for external references and
    bind them or they will not appear when you import the drawing. Check if you have
    any hidden layers with information, and use the Zoom Extents option to check if
    there is more information than that you can see on screen. Sometimes, drawings
    might be far away from each other.


    So, delete everything that you won''t need, including layers, line types, and
    other CAD stuff. If we remove some of these objects, the file size and complexity
    of the CAD drawing will decrease and it will be easier to manage things inside
    our 3D application. The following figure shows a clean and ready-to-go CAD drawing:


    ![](img/192b6e55337adc00931f510ecaaf8e05_47_0.png)


    A CAD drawing example with just the information we need

