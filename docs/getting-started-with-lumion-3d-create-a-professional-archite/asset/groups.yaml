    \ how to control the look of the surface. But how can we change things such as\
    \ the position and angle of the texture in the material? In the **Placing** menu,\
    \ we can find some settings that can help us configure those things, as you can\
    \ see in the following screenshot:\n\n![](img/192b6e55337adc00931f510ecaaf8e05_65_0.png)\n\
    \n- **Depth Offset**: This slider helps you to correct surfaces that flicker or\
    \ disappear when moving the camera; adjust this setting with small increments\
    \ until the flickering stops.\n- **X, Y, and Z**: Use these sliders to adjust\
    \ the position of the texture.\n- **Heading**: It is the option to rotate the\
    \ texture using values ranging from 0 to 360.\n\n### The Textures and Advanced\
    \ options menus\n\n**Textures** is a simple menu where you can change the Diffuse\
    \ and Bump textures. The Bump texture is the texture used to add the detail that\
    \ we saw previously. Clicking on these thumbnails will open a window to upload\
    \ or replace this texture with another one. In the **Advanced options** menu,\
    \ we can find settings that help us have a tight control over the brightness of\
    \ the material.\n\nAs you can see, Lumion allows a good level of control over\
    \ the pre-built materials, but we also have the freedom to pick these materials\
    \ up and use our own textures. Let's say we want to use the material that we used\
    \ for the floor, but with another texture. There is nothing simpler. Apply the\
    \ material and in the **Textures** sub-menu, upload the Diffuse and the Bump textures\
    \ that you created.\n\n## The Custom menu\n\nThis menu has particular materials\
    \ that are really useful for our scenes, and here we can find what cannot be fitted\
    \ in other categories. Inside this menu, we can find, for example, the Glass and\
    \ Color materials and others, as you can see in the following screenshot. We can\
    \ find some cool features too:\n\n![](img/192b6e55337adc00931f510ecaaf8e05_66_0.png)\n\
    \nThe Custom menu where you can find some specific materials\n\n## The Invisible\
    \ material\n\nUse this material to make something invisible in your scene. I found\
    \ this material useful to hide something inside Lumion. In that way, I don't need\
    \ to spend time going back, for example, to SketchUp, delete the object, and export\
    \ and import in Lumion. If I want to hide something, for example, a wall, a window,\
    \ or an entire model, I can do it by applying this material. It's a time saver.\n\
    \n## The Landscape material\n\nThe best way to explain this material is by showing\
    \ you an example. So, let's say that along with the model, you also created a\
    \ terrain like the one you can see in the following screenshot:\n\n![](img/192b6e55337adc00931f510ecaaf8e05_67_0.png)\n\
    \nThe house along with a terrain model\n\nImport the terrain if needed, and add\
    \ a new material to this terrain. Go to the Custom menu and click on the Landscape\
    \ material. The Landscape material allows you to seamlessly blend or merge parts\
    \ of the model with the landscape. Make sure that the terrain intersects with\
    \ the ground so that it can be perfectly blended. The following screenshot shows\
    \ this Landscape material applied to my 3D terrain:\n\n![](img/192b6e55337adc00931f510ecaaf8e05_67_1.png)\n\
    \nThe terrain model merged with the landscape\n\nAdding this material not only\
    \ allows you to use this cool feature, but as you can see in the picture, we can\
    \ also start painting soil types of the landscape in the imported terrain.\n\n\
    The other two materials that I want to introduce you to are the **Standard** and\
    \ **Water** materials. The **Standard** material is a simple material without\
    \ any textures or settings, and we can use this material to start something from\
    \ scratch. The **Water** material can have several applications, but perhaps,\
    \ the most common one is, for example, pools. Now, let's have a look at how we\
    \ can create materials.\n\n## Creating materials in Lumion\n\nKnowing that Lumion\
    \ has so many ready-to-use materials is a big advantage for our project. But the\
    \ time may come when we cannot find what we need inside Lumion, and that is when\
    \ we need to create our own materials. While creating a material to use inside\
    \ Lumion, the most important aspect is the texture or map because all the tweaks\
    \ with the reflection and bump, for example, are done inside Lumion. We just need\
    \ to be concerned with creating a diffuse map with alpha channel and a normal\
    \ map.\n\nBut before all these things, we need to find a good image to use as\
    \ a texture. Where can we find good and free images? The best option is that you\
    \ create your own library of textures using your camera. Other places where you\
    \ can find images are as follows:\n\n- Flickr\n- Stock.xchng\n- IStockphoto\n\
    - deviantART\n- And the best one for me, CGTextures\n\nNow that we have a nice\
    \ image to use as texture, we need to use image-editing software, such as Adobe\
    \ Photoshop or Gimp, to tweak and adjust the image. You don't need to use Adobe\
    \ Photoshop to create some textures, especially when we can find free software,\
    \ such as Gimp, that can help in doing the same thing.\n\nWhy do we need this\
    \ software? We need it, for example, to transform the image into a seamless texture.\
    \ What is a seamless texture? A seamless texture is an image that can be placed\
    \ side-by-side with itself without creating a noticeable boundary between the\
    \ two copies. Creating this can take some time, and this is one of the reasons\
    \ why I use CGTextures so often, because usually we can download tiled textures,\
    \ which are the same as seamless textures.\n"
  mdcn: "\n\n## Lumion 材质\n\nLumion 通过提供多种材质来帮助我们完成这一步骤：518 种可直接使用的材质。你可能需要做一些调整，但主要的工作已经为你完成。我们可以分配给模型材质如下：\n\
    \n- **Wood**: 45 种材质\n- **Wood floor**: 67 种材质\n- **Brick**: 32 种材质\n- **Tiles**:\
    \ 99 种材质\n- **Ground**: 39 种材质\n- **Concrete**: 43 种材质\n- **Carpet**: 20 种材质\n\
    - **Misc**: 109 种材质\n- **Asphalt**: 12 种材质\n- **Metal**: 47 种材质\n\n这也是为什么使用 Lumion\
    \ 创建静止图像和视频如此简单的原因之一。一切都已为你设置好，包括参数、细节和纹理。然而，我们可能需要做一些小的调整，为此，了解或至少对每个设置的作用有一个基本概念非常重要。那么，让我们快速了解一下如何在\
    \ Lumion 中配置材质。\n\n## 属性菜单\n\n你还记得如何向模型添加材质吗？在 **Import** 菜单上，点击 **Edit Materials**\
    \ 按钮，选择对象，然后点击加号图标选择表面。\n\n我们将查看属性菜单中最重要的方面，以帮助你理解如何调整材质。让我们看一下下面的截图：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_63_0.png)\n\
    \n属性如下：\n\n- **Scale**：在配置材质时这是一个非常重要的方面，因为我们可以改变纹理的比例，一切都可以具有正确的比例。如果我们使用具有特定纹理映射的自己的纹理，我们需要将此值设置为\
    \ 0。\n- **Reflection Colorize**：使用材质颜色为反射着色。为了理解此设置，请看下面的截图。从左到右，增量为 50%，从 0%\
    \ 开始。你能在截图中发现差异吗？\n\n  ![](img/192b6e55337adc00931f510ecaaf8e05_63_1.png)\n\n\
    - **Reflection Falloff**：也称为菲涅尔效应，它是根据观察角度在表面上看到的反射量。\n- **Brightness**：更改此设置以创建更暗或更亮的材质。\n\
    - **Glossiness**：它可以帮助你获得清晰或模糊的反射。\n- **Bump**：它可以帮助你使用法线贴图添加一些细节，如以下截图所示：\n\n\
    \  ![](img/192b6e55337adc00931f510ecaaf8e05_64_0.png)\n\n  从左侧开始 Bump 为 0，中间为\
    \ 0.2 Bump，右侧为 1 Bump\n\n- **Reflectivity**：它控制表面上的反射量。\n- **Saturation**：它是材质中所有颜色强度的一致增加。这可能导致某些颜色过度饱和，导致这些区域的细节丢失，看起来过于橙色且不自然。如果你降低饱和度，你可以得到灰度纹理。\n\
    - **Emissiveness**：使用此参数为灯泡和霓虹灯等物体创建发光效果。\n\n> \U0001F4A1 如果你需要以小增量调整滑块，请按住 *Shift*\
    \ 键并调整值。\n\n### 放置纹理\n\n现在你知道如何控制表面的外观了。但我们如何更改材质中纹理的位置和角度等内容呢？在 **Placing** 菜单中，我们可以找到一些可以帮助我们配置这些内容的设置，如以下截图所示：\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_65_0.png)\n\n- **Depth Offset**：此滑块可帮助你修正移动摄像机时闪烁或消失的表面；以小增量调整此设置，直到闪烁停止。\n\
    - **X, Y, and Z**：使用这些滑块调整纹理的位置。\n- **Heading**：它是使用 0 到 360 的值旋转纹理的选项。\n\n###\
    \ 纹理和高级选项菜单\n\n**Textures** 是一个简单的菜单，你可以在其中更改漫反射和 Bump 纹理。Bump 纹理是用于添加我们之前看到的细节的纹理。点击这些缩略图将打开一个窗口以上传或用另一个纹理替换此纹理。在\
    \ **Advanced options** 菜单中，我们可以找到帮助我们对材质亮度进行紧密控制的设置。\n\n正如你所见，Lumion 允许对预建材质进行良好的控制，但我们也有自由选择这些材质并使用自己的纹理。假设我们想使用用于地板的材质，但使用另一种纹理。没有什么比这更简单了。应用材质并在\
    \ **Textures** 子菜单中上传你创建的漫反射和 Bump 纹理。\n\n## 自定义菜单\n\n此菜单具有对场景非常有用的特定材质，并且在这里我们可以找到无法放入其他类别的内容。在此菜单中，我们可以找到例如玻璃和颜色材质等，如以下截图所示。我们还可以找到一些很酷的功能：\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_66_0.png)\n\n自定义菜单，你可以在其中找到一些特定材质\n\
    \n## 不可见材质\n\n使用此材质使场景中的某物不可见。我发现此材质很有用，可以在 Lumion 中隐藏某物。这样，我就不需要花费时间返回，例如 SketchUp，删除对象，并在\
    \ Lumion 中导出和导入。如果我想隐藏某物，例如墙壁、窗户或整个模型，我可以通过应用此材质来完成。这节省了时间。\n\n## 景观材质\n\n解释此材质的最佳方式是通过向你展示一个示例。所以，假设除了模型之外，你还创建了一个像以下截图中可以看到的地形：\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_67_0.png)\n\n房屋以及地形模型\n\n如果需要导入地形，并为此地形添加新材质。转到自定义菜单并点击景观材质。景观材质允许你无缝地混合或合并模型的部分与景观。确保地形与地面相交，以便完美融合。以下截图显示了此景观材质应用于我的\
    \ 3D 地形：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_67_1.png)\n\n地形模型与景观合并\n\n\
    添加此材质不仅允许你使用此很酷的功能，而且正如图片所示，我们还可以开始在导入的地形中绘制景观的土壤类型。\n\n我想要向你介绍的另外两种材质是 **Standard**\
    \ 和 **Water** 材质。**Standard** 材质是一种没有纹理或设置的简单材质，我们可以使用此材质从头开始。**Water** 材质可以有多种应用，但也许最常见的是，例如，游泳池。现在，让我们看看如何在\
    \ Lumion 中创建材质。\n\n## 在 Lumion 中创建材质\n\n知道 Lumion 有这么多可直接使用的材质是我们项目的巨大优势。但时间可能会到来，我们在\
    \ Lumion 中找不到所需的东西，那就是我们需要创建自己的材质的时候。在创建要在 Lumion 中使用的材质时，最重要的方面是纹理或贴图，因为所有反射和凹凸等调整都是在\
    \ Lumion 内部完成的。我们只需要关心创建具有 alpha 通道的漫反射贴图和法线贴图。\n\n但在所有这些之前，我们需要找到一张用作纹理的好图像。我们在哪里可以找到好且免费的图像？最好的选择是你使用相机创建自己的纹理库。你可以找到图像的其他地方如下：\n\
    \n- Flickr\n- Stock.xchng\n- IStockphoto\n- deviantART\n- 以及我最喜欢的，CGTextures\n\
    \n现在我们有了用作纹理的漂亮图像，我们需要使用图像编辑软件，例如 Adobe Photoshop 或 Gimp 来调整和修改图像。你不需要使用 Adobe\
    \ Photoshop 来创建一些纹理，尤其是在我们可以找到免费软件，例如 Gimp，可以帮助完成同样的事情时。\n\n为什么我们需要此软件？我们需要它，例如将图像转换为无缝纹理。什么是无缝纹理？无缝纹理是一张图像，可以与其自身并排放置而不会在两个副本之间产生明显的边界。创建它可能需要一些时间，这也是我经常使用\
    \ CGTextures 的原因之一，因为通常我们可以下载平铺纹理，这与无缝纹理相同。\n\n"
