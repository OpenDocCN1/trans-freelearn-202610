    \nUsing the Video mode, we can export some useful render passes\n\nClick on the\
    \ OK button, choose a folder, and save your image. Once you click on Save, Lumion\
    \ will start working and you can see the progress. Lumion will start with the\
    \ color image and then will export the render passes. If you export all the render\
    \ passes, you will get seven images; each one is different, shown as follows:\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_111_1.png)\n\nA composition showing\
    \ the different seven images you get\n\nFrom left to right, we have the **color\
    \ image**, **depthmap**, **material ID**, **normalmap**, **specular reflection\
    \ map**, **lighting map**, and **sky alpha map**. You don't need to export all\
    \ the render passes, for example, I don't use the normal map and the material\
    \ ID except on rare occasions. Now, let's use Photoshop to open these images.\n\
    \nPhotoshop works with layers, and it is a good idea if we start by adding names\
    \ to the different layers and then create groups. So, with that in mind, I will\
    \ create a folder in the **Layer** menu and change the name to `Base`. Drag the\
    \ colormap to this folder or use the combination of `Ctrl + G` to create a group\
    \ with the image inside. Save the file in the `.PSD` format so that you can edit\
    \ the layers later.\n\nNow, right-click on the **Base** group, select **Duplicate\
    \ Group...**, and rename it to `Render Passes`. Once you do that, we can start\
    \ importing the render passes, and when you open the images in Photoshop, every\
    \ image will open as a new tab. So, we need to drag every image to our original\
    \ PSD file. Go to depthmap and use the combination `Ctrl + A` to select the entire\
    \ image and `Ctrl + C` to copy that image. Then, go back to the original PSD file,\
    \ create a new layer, and use the combination of `Ctrl + V` to paste the image.\
    \ Don't forget to rename the layer every time you create a new one. You should\
    \ have something like the following:\n\n![](img/192b6e55337adc00931f510ecaaf8e05_112_0.png)\n\
    \n- 1 - Create a new group\n- 2 - Create a new layer\n\n## Accurate selection\
    \ with material ID\n\nLet's use the **material ID** map to remove the specular\
    \ map effect on the glass along with a layer mask. Let me first explain how layer\
    \ masks work and how to use them, and for this, you just need to know the difference\
    \ between black and white.\n\nA layer mask allows you to control a layer's level\
    \ of transparency. But we can use the **Opacity** option (yes, you can!); the\
    \ difference is that the **Opacity** option changes the transparency level for\
    \ the entire layer at once. In this case, I just want to decrease the effect that\
    \ the specular map has on the glass and not on the entire image. So, what we need\
    \ is a way to control the transparency of different areas of the layer separately,\
    \ and that is when we use a layer mask.\n\nSelect the specular layer and go to\
    \ the **Layer** menu, select the **Layer Mask** option, and choose **Reveal All**.\
    \ This is one thing you need to memorize; white reveals and black hides. What\
    \ this means is that we use a white layer mask to reveal everything, and we select\
    \ the black color with the brush tool to paint and hide.\n\n![](img/192b6e55337adc00931f510ecaaf8e05_115_0.png)\n\
    \n> If you start painting the image, it means that you have not selected the layer\
    \ mask. Click on the layer mask and use the brush tool; you should see the result\
    \ on the layer mask thumbnail.\n\nWe can start painting around the windows, but\
    \ it can be a hard task because, accidentally, we can hide the effect in other\
    \ areas where we don't want it. We can use the Lasso tool, but we are going to\
    \ use the material ID layer to select specific areas accurately. Let me show you\
    \ how easily we can select only the windows with the glass.\n\n## The sky alpha\
    \ map\n\nWhat we did with the material ID, we can do with the sky alpha map. If\
    \ you want to change the sky, you can get one from CGTextures, drag the image\
    \ to the PSD file, and using the color range, select the white area and create\
    \ a mask as we did before.\n\n> To get some skies, use the link `http://cgtextures.com/`\
    \ to go to the CGTextures website and then select **Skies Partial**.\n\n## The\
    \ importance of adjustment layers\n\nAfter using the blend modes, we can duplicate\
    \ the group and merge everything in one layer and call it Passes. Then, we create\
    \ another group called CC or Color Correction. In this group, we start using adjustment\
    \ layers. To add them, go to the Layer menu, select **New Adjustment Layer** to\
    \ start adding some adjustments such as **Curves…**, **Hue/Saturation…**, and\
    \ **Color Balance…**.\n\nThere are two big reasons to use adjustment layers. Firstly,\
    \ the way adjustment layers work is that you make the changes on a transparent\
    \ layer without actually touching anything; so, they are non-destructive. Secondly,\
    \ we can even go back and edit these adjustment layers; we can also stack these\
    \ layers and they accumulate and finally we can use layer masks to isolate the\
    \ adjustment in a particular area.\n\nColor correction is a complex subject and\
    \ we can hardly explain how to do it in-depth, mostly because every image is different,\
    \ and what we use in one image doesn't necessarily suit another. I recommend that\
    \ you read some *Making of* articles, where you can see how other artists color\
    \ corrected their images.\n\n> You can find some really good articles by visiting\
    \ the following links:\n> \n> - `http://www.ronenbekerman.com/category/tutorials/making-of/`\n\
    > - `http://www.cgarchitect.com/features/category/making-of`\n\n## Working with\
    \ Curves\n\nIn general, we want to find the brightest and darkest parts of the\
    \ image, and we will click on those parts with some special Eyedropper tools.\
    \ We can use the Threshold adjustment layer to check this information, then delete\
    \ this layer and create a Curves adjustment layer. Right-click on the Curves adjustment\
    \ layer and select **Create Clipping Mask**. We do this so that the adjustment\
    \ layer only affects the following layer and not the other layers:\n\n![](img/192b6e55337adc00931f510ecaaf8e05_118_0.png)\n\
    \nUse eyedroppers to select the black and white point\n\nPay attention to the\
    \ three eyedroppers on the left-hand side of the preceding screenshot. With the\
    \ first one, we are going to click on the darkest area on the image, and with\
    \ the third one, we click on the brightest point on the image. When we click with\
    \ the dark eyedropper, it is going to measure the amount of red, green, and blue\
    \ in that area and adjust it to make it balanced. Then, it is going to darken\
    \ the area to its maximum extent. With the white eyedropper, avoid a pure white\
    \ area; otherwise, your image will look a little weird. Sometimes, you may need\
    \ to use only the black and the gray eyedropper. Finally, we click on the middle\
    \ eyedropper and look for a shade of gray. You may need to click on several points,\
    \ until you find the most pleasing color, and it really depends on the image.\
    \ Try to use the Saturation adjustment layer to reduce the saturation from your\
    \ image and use the Color Balance adjustment layer to create a warm or cold look.\n"
  mdcn: "\n\n我们可以在 **MP4** 格式下导出，它有几个选项，例如 **Quality**、**Frames per second** 和 **Resolution**。但我建议使用第二个选项，**Images**，如下图所示：\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_107_0.png)\n\n导出一组图像而不是整部电影\n\n如你所见，你有相同的选项，外加一些额外的选项，允许你导出可以在\
    \ Photoshop 或 Gimp 中稍后使用的渲染通道。我建议使用此选项，因为你可以在使用视频编辑器时获得更多控制权。缺点是你需要空间来存储这么多图像。\n\
    \n最后一个选项是导出单张图像和一个渲染通道。如果你只想导出一张图像，最好使用 **Images** 菜单下的 **Frame range** 选项。\n\n\
    ## Summary\n\n在本章中，你学习了什么是构图以及它如何帮助我们创建平衡且有吸引力的图像或视频。你还学习了如何使用三分法则及其构图概念。然后，你更深入地了解了\
    \ **Photo** 模式以及如何添加不同的效果并调整它们。最后一个主题是电影模式，在本节中你学习了如何创建电影、添加效果，最后如何使用不同的输出保存它们。\n\
    \n在下一章中，我们将选择导出的电影或图像，并学习如何提高质量、进行微小更改以及使用导出的渲染通道。\n\n![](img/192b6e55337adc00931f510ecaaf8e05_111_0.png)\n\
    \n使用 Video 模式，我们可以导出一些有用的渲染通道\n\n点击 OK 按钮，选择一个文件夹并保存你的图像。一旦你点击 Save，Lumion 将开始工作，你可以看到进度。Lumion\
    \ 将首先处理彩色图像，然后导出渲染通道。如果你导出所有渲染通道，你将得到七张图像；每一张都不同，如下所示：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_111_1.png)\n\
    \n一个展示你得到的七张不同图像的构图\n\n从左到右，我们有 **color image**、**depthmap**、**material ID**、**normalmap**、**specular\
    \ reflection map**、**lighting map** 和 **sky alpha map**。你不需要导出所有渲染通道，例如，我除了极少数情况外不用\
    \ normal map 和 material ID。现在，让我们使用 Photoshop 打开这些图像。\n\nPhotoshop 使用图层，如果我们开始时为不同的图层添加名称然后创建组，这是一个好主意。因此，考虑到这一点，我将在\
    \ **Layer** 菜单中创建一个文件夹并将名称更改为 `Base`。将 colormap 拖到此文件夹中或使用 `Ctrl + G` 的组合为图像创建组。以\
    \ `.PSD` 格式保存文件，以便你以后可以编辑图层。\n\n现在，右键单击 **Base** 组，选择 **Duplicate Group...**，并将其重命名为\
    \ `Render Passes`。完成后，我们可以开始导入渲染通道，当你在 Photoshop 中打开图像时，每张图像都会作为新标签打开。因此，我们需要将每张图像拖到原始\
    \ PSD 文件中。转到 depthmap 并使用组合键 `Ctrl + A` 选择整个图像并使用 `Ctrl + C` 复制该图像。然后，返回原始 PSD\
    \ 文件，创建一个新图层，并使用组合键 `Ctrl + V` 粘贴图像。不要忘记每次创建新图层时重命名图层。你应该得到类似以下内容：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_112_0.png)\n\
    \n- 1 - 创建一个新组\n- 2 - 创建一个新图层\n\n## Accurate selection with material ID\n\n让我们使用\
    \ **material ID** 贴图来移除玻璃上的高光贴图效果并配合图层蒙版。让我先解释图层蒙版的工作原理以及如何使用它们，为此你只需要知道黑白之间的区别。\n\
    \n图层蒙版允许你控制图层的透明度级别。但我们可以使用 **Opacity** 选项（是的，你可以！）；区别在于 **Opacity** 选项会一次性改变整个图层的透明度级别。在这种情况下，我只想降低高光贴图对玻璃的影响，而不是对整个图像的影响。因此，我们需要一种方法来单独控制图层不同区域的透明度，这时我们使用图层蒙版。\n\
    \n选择高光图层并转到 **Layer** 菜单，选择 **Layer Mask** 选项并选择 **Reveal All**。这是你需要记住的一件事；白色显示，黑色隐藏。这意味着我们使用白色图层蒙版来显示所有内容，并使用画笔工具选择黑色颜色进行绘画和隐藏。\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_115_0.png)\n\n> 如果你开始绘制图像，这意味着你没有选择图层蒙版。点击图层蒙版并使用画笔工具；你应该在图层蒙版缩略图上看到结果。\n\
    \n我们可以开始在窗户周围绘画，但这可能是一项艰巨的任务，因为不小心我们可能会在不希望的地方隐藏效果。我们可以使用套索工具，但我们将使用 material\
    \ ID 图层来准确选择特定区域。让我展示如何轻松地仅选择带玻璃的窗户。\n\n## The sky alpha map\n\n我们对 material ID\
    \ 所做的操作，也可以对 sky alpha map 进行。如果你想更改天空，你可以从 CGTextures 获取一张，然后将图像拖到 PSD 文件中，并使用颜色范围选择白色区域并创建蒙版，就像我们之前做的那样。\n\
    \n> 要获取一些天空，使用链接 `http://cgtextures.com/` 进入 CGTextures 网站，然后选择 **Skies Partial**。\n\
    \n## The importance of adjustment layers\n\n在使用混合模式后，我们可以复制组并将所有内容合并为一个图层并命名为\
    \ Passes。然后，我们创建一个名为 CC 或 Color Correction 的组。在此组中，我们开始使用调整图层。要添加它们，请转到 Layer\
    \ 菜单，选择 **New Adjustment Layer** 开始添加一些调整，例如 **Curves…**、**Hue/Saturation…** 和\
    \ **Color Balance…**。\n\n使用调整图层有两个重要原因。首先，调整图层的工作方式是你在透明图层上进行更改而不实际触及任何内容；因此，它们是非破坏性的。其次，我们甚至可以返回并编辑这些调整图层；我们还可以堆叠这些图层，它们会累积，最后我们可以使用图层蒙版将调整隔离到特定区域。\n\
    \n色彩校正是复杂的主体，我们很难深入解释如何操作，主要是因为每张图像都不同，我们在一张图像中使用的内容不一定适合另一张。我建议你阅读一些 *Making\
    \ of* 文章，在那里你可以了解其他艺术家如何对他们的图像进行色彩校正。\n\n> 你可以通过访问以下链接找到一些非常好的文章：\n> \n> - `http://www.ronenbekerman.com/category/tutorials/making-of/`\n\
    > - `http://www.cgarchitect.com/features/category/making-of`\n\n## Working with\
    \ Curves\n\n通常，我们想要找到图像中最亮和最暗的部分，并使用一些特殊的吸管工具点击这些部分。我们可以使用 Threshold 调整图层来检查此信息，然后删除此图层并创建\
    \ Curves 调整图层。右键单击 Curves 调整图层并选择 **Create Clipping Mask**。我们这样做是为了让调整图层仅影响以下图层而不是其他图层：\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_118_0.png)\n\n使用吸管选择黑白点\n\n请注意前一屏幕截图左侧的三个吸管。使用第一个，我们将点击图像上最暗的区域，使用第三个，我们点击图像上最亮的点。当我们用暗色吸管点击时，它会测量该区域的红色、绿色和蓝色量并调整使其平衡。然后，它会将该区域变暗到最大程度。使用白色吸管时，避免纯白色区域；否则，你的图像会看起来有点奇怪。有时，你可能只需要使用黑色和灰色吸管。最后，我们点击中间的吸管并寻找灰色色调。你可能需要点击多个点，直到找到最\
    \ pleasing 的颜色，这真的取决于图像。尝试使用 Saturation 调整图层来降低图像的饱和度，并使用 Color Balance 调整图层来创建温暖或冷色调的外观。\n\
    \n"
