    ## 摘要


    本章旨在帮助你开始在场景中放置模型，并学习如何操作它们。你看到了填充场景以增添生机以及改变景观是多么容易和快速。你还学习了改变地形、创建高度图以及使用特效对象的[content]


    ## Summary


    本章旨在帮助你开始在场景中放置模型，并学习如何操作它们。你看到了填充场景以增添生机以及改变景观是多么容易和快速。你还学习了改变地形、创建高度图以及使用特效对象的基本步骤。


    在下一章中，你将学习如何创建和添加效果，以及导出精美的静止图像和视频。


    ## 构图的要点


    什么是构图，为什么它如此重要？构图是在画面内对元素的安排，以吸引观众的视线。与其使用*规则*的术语，不如让我们用一组可以增减以创作出优质视频或图像的要素来审视构图。


    关键是要记住，你不会在准备的每道菜中使用所有食材。同样，在制作图像或视频时，你也不需要使用所有这些构图要素。


    让我们来看一下构图的某些要点：


    - **图案：** 生命中充满了图案，在捕捉重复性时，你可以强调这些图案，也可以打破它们

    - **对称：** 你可以创建两种类型的图像；一种具有对称性，另一种具有不对称性

    - **景深：** 这可以将主体与其背景和前景隔离开来

    - **线条：** 你可以使用对角线、水平线、垂直线和汇聚线；它们都会以不同的方式影响图像

    - **形状和定位：** 这两者都是不同元素非常重要的因素

    - **对比度比例：** 这给出了明暗之间的划分


    这些只是创建良好构图的几个方面。这个主题过于复杂，无法在本书记载，然而，这些要点可以帮助你迈出正确的第一步。


    > > 学习摄影，你就能完成一半的工作来创建出色的建筑可视化。


    ## 构图的 framing 重要性


    构图中的一个重要事项是使用 framing 的概念。什么是 framing？Framing 是指我们在场景中使用某些元素来引导观众的注意力聚焦于场景的某些方面。看一下下面的截图，例如，我们如何使用两侧的树木来将观众的注意力引向房屋：


    ![](img/192b6e55337adc00931f510ecaaf8e05_101_0.png)


    我们几乎可以用场景中的任何东西来框定镜头，包括树木、岩石和其他建筑物，仅举几例。


    ## 使用 Photo 模式导出图像


    让我们进入 Photo 模式，应用一些效果，然后导出图像。在 Lumion 屏幕的右侧，点击 Photo 模式图标，即带有相机图标的那个，如以下截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_103_0.png)


    启用 Photo 模式并显示我们的第一张静止图像


    如前面的截图所示，我们有多个可调整的设置，因此，我们将从效果开始。点击页面左上角的 New effects 图标，以星号和加号为特征，开始添加效果。可用效果如下：


    - World: Sun, Shadow, Contrails, Underwater, Global Illumination, and Reflection

    - Weather: Cloud, Fog, Rain, Snow, VolumeClouds, Folliage wind, and Horizon Cloud

    - Camera: Vignette, Depth of Field, Lens flare, Near Clip Plane, Fish eye, Handheld
    Camera, and Exposure

    - Style: Bloom, Overlay image, Noise, Sharpness, Selective saturation, Color correction,
    and Bleach

    - Artistic: God rays, Painting, Watercolor, Sketch, Manga, and Chromatic Aberrations


    ## 准备渲染


    Lumion 通过显示应用效果后的缩略图来帮助你了解效果的外观。了解每个效果作用的最好方法是逐一尝试。不仅能让你了解可以得到什么，还能轻松识别场景的需求以及如何通过使用效果解决特定问题。


    我在场景中最常用的效果如下：


    - **Global Illumination**

    - **Foliage wind**

    - **Depth of Field**

    - **Chromatic Aberrations**


    还有一些事情我希望在后期制作阶段添加，例如 **Vignette**、**Color correction** 和 **Bloom**。原因是我在 Lumion
    中应用这些效果后，如果之后想返回并移除效果，就需要再次导出图像。如果我们使用非破坏性工作流程，例如在 Photoshop 或 Gimp 中使用图层，就能轻松添加或移除这些效果。还有复制效果并粘贴到另一段剪辑的选项，如果我们想导出多张具有相同效果的图像，这非常有帮助。如果
    **Photo** 模式中较小的窗口不足以检查我们应用的效果，**Build with effects** 是一个很酷的功能，允许你在保持效果应用的情况下返回到
    **Build** 模式。


    最后，你可以更改焦距，它的工作方式类似于缩放工具。如果需要将相机向左或向右移动更多，或更改其他设置，你无需返回 **Build** 模式，调整相机并保存新的视口。你只需将鼠标放在窗口上并使用所有键盘快捷键来更改相机位置即可。


    现在你已准备好导出最终图像。Lumion 允许你使用以下格式导出四种图像分辨率：


    - Windows Bitmap: *.bmp

    - Joint Photographic Experts Group: *.jpg

    - Truevision: *.tga

    - DirectDraw Surface: *.dds

    - Portable Network Graphics: *.png


    在导出图像之前，务必检查一切是否就绪，以及是否需要使用 F8 键来切换聚光灯阴影，以及 U 键来更新反射或云。


    ## 使用 Movie 模式创建视频


    让我们创建一个电影。在 Lumion 中创建电影非常简单直观。点击 Movie 图标开始创建电影；界面如下图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_105_0.png)


    Movie 模式


    你可以通过使用此功能来创建电影的各个片段。没有什么比 Lumion 开始渲染视频时在最后一刻崩溃或遇到问题，导致你丢失视频文件更糟糕了。如果你创建整个电影，你需要从头开始，但通过使用单独的片段，你只需从最后一个片段开始即可。有三个选项可用于通过导入图像或视频来创建视频，但我们只关注第一个选项，并通过点击
    Record 图标开始为其创建动画，如下图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_105_1.png)


    创建单独的片段


    ## 准备渲染


    点击带有相机图标的按钮开始你的第一个镜头，然后移动相机并再次点击，重复直到满意为止。之后，点击 **Play** 图标查看动画效果。你可以按下 *Shift*
    以及 1 到 9 之间的任意数字来加载已保存的视口，并使用这些视口来创建电影。


    Lumion 另一个有用的功能是可以加快或减慢剪辑的速度。在你的左侧有一个滑块，允许你增加或减少速度。当你最终对动画满意时，点击 **Ok** 按钮。


    现在，如果需要，我们可以再次编辑剪辑。选择剪辑，在其上方我们有两个按钮，如下图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_106_0.png)


    选择剪辑以删除或编辑它


    在 **Movie** 模式下，Lumion 允许我们为每个剪辑和整个电影添加效果。此选项在我们想要为特定剪辑添加例如 **Fade In** 或 **Fade
    Out** 选项，或更改另一个剪辑的 **Depth of Field** 值时很有用。我在背景中添加了一些 **Vignette** 和 **Fog**
    效果。


    通过点击 **Entire Movie** 图标，即左下角带有胶片条特征的那个，为整个视频而不是单个剪辑添加效果。如果我们点击此图标，我们将进入另一个菜单，在那里我们可以编辑整个电影并为整个电影添加效果，而不是为单个剪辑添加。这在你想为所有剪辑添加相同效果时特别有用。现在，要导出电影，点击右侧的
    **Save Movie** 图标；即带有电影拍摄符号的那个。


    '
