    \ 使用材质ID进行精确选择 — 105\n    - 使用光照贴图增加对比度 — 106\n    - 天空Alpha贴图 — 107\n    - 调整图层的重要性\
    \ — 107\n      - 使用曲线 — 108\n    - 应用镜头效果 — 109\n      - 使用Photoshop实现色差 — 109\n\
    \      - 一点锐化 — 110\n      - 景深 — 110\n      - 用噪点和暗角进行最后修饰 — 111\n  - **总结**\
    \ — 113\n- **索引** — 115\n\n## 前言\n\n《Lumion 3D入门指南》以友好直观的方式向您展示如何开始使用Lumion工具创建专业的建筑可视化作品。本书引导您完成所有初始步骤，并包含一个快速入门教程，让您能够立即开始使用Lumion并渲染场景。本书的其余部分在此知识基础上，通过逐步讲解向您介绍更多工具，不仅帮助您开始使用Lumion，还帮助您迈出建筑可视化的第一步。您将学习如何使用Lumion的材质和模型、如何构图场景，以及如何导出图像或视频。\n\
    \n## 本书涵盖的内容\n\n*第1章，什么是Lumion？*，将总体概述Lumion，让您了解为什么要使用Lumion，以及通过这个应用程序我们能获得怎样的最终质量。然后，您将在快速入门教程的帮助下开始使用Lumion，学习创建精美建筑可视化的基础知识。\n\
    \n*第2章，准备场景*，将帮助您识别和纠正一些常见错误，从而避免Lumion中的问题。您将学习如何清理和使用CAD图纸开始建模，如何提高真实感，以及在哪里可以找到适合场景使用的精美模型。\n\
    \n*第3章，创建材质*，将帮助您学习如何使用和调整Lumion提供的500多种即用型材质。最后，您将了解在哪里可以找到纹理，以及如何准备这些纹理以便与Lumion材质一起使用。\n\
    \n*第4章，使用Lumion*，将解答您的许多疑问；这也是乐趣开始的时候。您的3D模型应该已经准备好导出了。您该怎么做？需要特殊插件吗？如何在Lumion中导入模型？所有这些问题以及更多内容都将在本章中得到解答。导入模型后，您将开始使用图层和其他菜单在Lumion中组织场景。\n\
    \n*第5章，构建环境*，将帮助您开始为场景添加细节。您将学习如何雕刻地形和更改天气，然后开始使用Lumion附带的大量模型填充场景。您还将学习如何使用特殊效果和声音为场景增添独特魅力。\n\
    \n*第6章，准备渲染*，将教您什么是构图、如何让场景更具吸引力，以及如何使用照片和视频模式导出2D元素。\n\n*第7章，后期制作*，将帮助您学习如何为Lumion输出的结果增添特殊效果。通过使用Photoshop或Gimp，您将学习图像色彩校正的一些关键技巧。您将学习如何使用图层蒙版、混合模式和调整图层。\n\
    \n## 本书所需环境\n\n基础知识包括：Lumion免费版、Photoshop或Gimp。Lumion团队建议使用以下最低配置：\n\n- Windows\
    \ XP、Vista、7、8（32位和64位）以及DirectX 9.0c或更高版本\n- 系统内存：3 GB\n- 显卡：NVIDIA GeForce GTS\
    \ 450或ATI/AMD Radeon HD 4890（至少1500 PassMark分数），至少1 GB专用显存（非共享系统内存）\n\n## 本书适合的读者\n\
    \n本书适合所有级别的Lumion用户，尤其适合那些没有建筑可视化经验、希望在该领域迈出第一步的读者。本书还可以帮助中级用户通过不同技巧改进工作流程。无论您是业余爱好者、专业建筑师还是设计师，本书都将帮助您开始使用Lumion创建3D可视化作品。\n\
    \n## 体例约定\n\n在本书中，您会看到多种文本样式，以区分不同类型的信息。以下是这些样式的一些示例及其含义说明。\n\n**新术语和重要词语**以粗体显示。您在屏幕上（例如菜单或对话框）看到的词语会以如下形式出现在文本中：“单击**下一步**按钮将转到下一屏”。\n\
    \n![](img/192b6e55337adc00931f510ecaaf8e05_13_0.png)\n\n> 警告或重要注释会以这样的框显示。\n\n\
    ![](img/192b6e55337adc00931f510ecaaf8e05_13_1.png)\n\n> 提示和技巧以这样的形式出现。\n\n## 读者反馈\n\
    \n我们始终欢迎读者的反馈。请告诉我们您对本书的看法——您喜欢哪些内容，或可能不喜欢哪些内容。读者反馈对我们开发您真正受益的图书至关重要。\n\n如需发送一般性反馈，只需发送电子邮件至`feedback@packtpub.com`，并在邮件主题中提及书名。\n\
    \n如果您在某方面有专长，并且对撰写或参与编写图书感兴趣，请参阅我们在`www.packtpub.com/authors`上的作者指南。\n\n## 客户支持\n\
    \n既然您已成为Packt图书的骄傲拥有者，我们有许多服务可帮助您充分利用所购图书。\n\n### 下载本书图片\n\n我们还为您提供一个PDF文件，其中包含本书使用的截图/示意图图片。这些图片将帮助您更好地理解输出结果的变化。您可以从`https://www.packtpub.com/sites/default/files/downloads/94950T_Graphics_Bundle.pdf`下载此文件。\n\
    \n### 勘误\n\n尽管我们已尽一切努力确保内容准确无误，但错误仍在所难免。如果您在我们的某本书中发现了错误——可能是文字或代码方面的错误——我们将非常感谢您向我们报告。这样做可以帮助其他读者免受困扰，并帮助我们改进本书的后续版本。如果您发现任何勘误，请访问`http://www.packtpub.com/submit-errata`，选择您的图书，单击勘误提交表单链接，然后输入勘误详情。一旦您的勘误通过验证，您的提交将被接受，并上传到我们的网站，或添加到该标题勘误部分的现有勘误列表中。您可以从`http://www.packtpub.com/support`选择您的书名查看任何现有勘误。\n\
    \n### 盗版\n\n互联网上对版权材料的盗版是所有媒体持续面临的问题。在Packt Publishing，我们非常重视保护我们的版权和许可。如果您在互联网上以任何形式发现我们作品的非法副本，请立即向我们提供地址或网站名称，以便我们采取补救措施。\n\
    \n请联系我们`copyright@packtpub.com`，并附上疑似盗版材料的链接。\n\n我们感谢您帮助保护我们的作者，以及我们为您提供宝贵内容的能力。\n\
