    heightmap that created those mountains. We can see that we have 100 percent of
    black and white and different shades of grey in the middle. 100 percent black
    is equal to a terrain height of 0 m, and 100 percent white is equal to a terrain
    height of 200 m. Then, we have 254 scales of grey that can be used to achieve
    different heights.


    We can use the following file formats to create this texture:


    - Windows Bitmap: *.bmp

    - Joint Photographic Experts Group: *.jpg

    - DirectDraw Surface: *.dds

    - Portable Network Graphics: *.png


    In order to open and edit the texture that Lumion exports, we need to use the
    .dds file format. To be able to open and edit this file format, we need to install
    a plugin if we are using Adobe Photoshop or Gimp.


    > Download NVIDIA texture tools for Adobe Photoshop at https://developer.nvidia.com/nvidia-texture-tools-adobe-photoshop.

    > Download the GIMP DDS plugin at https://code.google.com/p/gimp-dds/.


    Let''s try to create a simple map using Adobe Photoshop or Gimp. Here is a trick
    to help you see where your model is in the texture map. Using the Raise or Lower
    tool (it doesn''t really matter), change the ground around your model and then
    export the heightmap terrain. When you open the texture file, you can see the
    changes as small white dots. I cannot show you how to do that step-by-step, but
    here are some guidelines to help you start. Always start with a black texture
    and then use really small increments of grey. To help give some variety to your
    terrain, try using different brush types and play with the opacity too. When I
    create a heightmap, I always use the same level of grey, but what I change is
    the opacity. Don''t forget to always save the texture as a 32-bit DDS heightmap
    in the 32f format.


    ### Changing the landscape''s material


    I mentioned before that we have the option to change some elements of the landscape.
    Perhaps we may want a different type of grass, or instead of rocks, we may want
    to use dead leaves. To access these options, we need to use the **Color** menu
    as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_88_0.png)


    The Color menu where you can play with the textures that you see in the terrain


    There are two ways to use this menu. The first way is by changing individual elements.
    The four thumbnails represent the four elements that are present in your landscape.
    Initially you may not see them, but once you start sculpting the terrain and raising
    and lowering it, these elements start to appear. To change these elements, click
    on the arrow above the thumbnail to select another texture. You have a list of
    42 different textures as shown in the following screenshot, but you can also use
    your own maps:


    ![](img/192b6e55337adc00931f510ecaaf8e05_88_1.png)


    The 42 different textures that you can use


    Next to the textures, we can find two big buttons: **Custom Diffuse** and **Custom
    Normal**. The diffuse texture, let''s say, is the texture that gives us the color,
    and the normal texture is where Lumion gets the information to add irregularities
    to your terrain. The file formats that we can use are the following:


    - Windows Bitmap: *.bmp

    - Joint Photographic Experts Group: *.jpg

    - Truevision: *.tga

    - DirectDraw Surface: *.dds

    - Portable Network Graphics: *.png

    - Photoshop: *.psd


    The second way to work with these elements is by painting them directly on the
    terrain. To do this, click on the thumbnail with the texture and adjust the sliders
    for **Brush Speed** and **Size**. There is a third slider to adjust the tile size,
    or in other words, the size of the texture.


    ### Adding a water plane


    In the example I am using for this book, the nearest body of water we have is
    the Fox river, which is not too far from the house. If you need to create a swimming
    pool, remember that it is much easier if you use the **Water** material. In this
    section, Lumion allows you to easily create six types of water as shown in the
    following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_89_0.png)


    Once you click on the preset you want, click on the scene to place a plane and
    use the icons on the four vertices to adjust the height and the size. Unfortunately,
    once you add the water material, you cannot change any setting. The only body
    of water you can change the look of is that of an ocean.


    ### Creating an ocean


    Select the Ocean menu and click on the button with the On/Off power switch sign
    to turn the ocean on or off. Once you turn on this option, we have access to various
    settings to control the look of the ocean as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_90_0.png)


    The Ocean menu and its different settings


    Like everything else in Lumion, this menu is really intuitive and simple to use.
    We can change the wave pattern as well as the manner in which the direction of
    the wind influences the waves. If you want to do accurate slider adjustments,
    don''t forget to use the Shift key while adjusting the slider. Why don''t you
    try to see what you can get with the color preset?


    ## Setting up the weather


    Once we are happy with the landscape and water, we can start paying attention
    to details. We can start by using the **Weather** menu. Again, this menu is pretty
    self-explanatory. We can change the direction of the sun and its height, change
    the type of clouds from the nine given types, and adjust the slider to create
    a clear sky or an overcast day, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_91_0.png)


    The Weather menu where we can control the sun and the sky


    There isn''t much we can do in this section, and if we want to add some special
    weather conditions such as rain and snow, we can do that later in the photo or
    video mode.


    ## Populating your scene


    We have achieved a stage where we have the landscape defined, the weather set
    up, and the 3D model already having nice and realistic materials. So now, we need
    to start adding models and small details to our scene in order to create something
    more interesting and full of life, and Lumion is amazing in this area. Although
    I am going to use some of my own models, we can find almost everything we need
    inside the Lumion library. In the next section, we will learn how we can add models,
    as well as change, manipulate, and organize them.

    '
  mdcn: '

    ## 修改地形


    **地形**菜单是另一个包含一些实用工具的菜单。单击此菜单可打开如下截图所示的窗口：


    ![](img/192b6e55337adc00931f510ecaaf8e05_85_0.png)


    我们可以找到三个修改地形的选项。使用最左侧的选项可以将整个地形夷平，使用中间的选项可以创建山脉，使用最后一个选项可以创建一座大山。没错，就是一座大山。单击带有山脉图标的按钮，创建类似下面截图所示的效果：


    ![](img/192b6e55337adc00931f510ecaaf8e05_85_1.png)


    通过这个按钮，Lumion 会为你生成一个非常漂亮的地形。使用**高度**和**地形**菜单，你可以为建筑创建理想的地形，并且你可能会发现导出和导入地形图的选项也非常有用。因此，你可以创建多个地形，导出它们，然后看看哪一个最适合你；或者不必为另一个项目重新雕刻相似地形，而是直接导入之前制作的地形。但在
    Lumion 中还有一种创建地形的方法。你何不去看看最后一个按钮有什么作用呢？


    ### 创建高度图


    在*第 1 章，什么是 Lumion？*中，我们提到可以使用高度图纹理来替我们完成繁重的工作。Lumion 能够读取这种包含我们希望地形如何呈现的信息的高度图，并将这些
    2D 信息转换为 3D 地形。然而，Lumion 有一些限制，因为在 Lumion 中可编辑的地形区域是一个 2048 x 2048 米的正方形。当我们创建高度图时，需要记住纹理会被拉伸到正方形的最边缘。下面的截图展示了高度图的样子，但问题是我们如何创建一个高度图呢？


    ![](img/192b6e55337adc00931f510ecaaf8e05_86_0.png)


    这是当你导出地形图时 Lumion 创建的高度图


    还记得我们之前创建的山脉吗？其实，上图就是生成这些山脉的高度图。我们可以看到其中有 100% 的黑色、100% 的白色以及介于两者之间的不同深浅灰色。100%
    黑色对应地形高度 0 米，100% 白色对应地形高度 200 米。此外，还有 254 级灰色可用于实现不同的高度。


    我们可以使用以下文件格式来创建这种纹理：


    - Windows 位图：*.bmp

    - 联合图像专家组：*.jpg

    - DirectDraw 表面：*.dds

    - 便携式网络图形：*.png


    为了打开和编辑 Lumion 导出的纹理，我们需要使用 `.dds` 文件格式。如果你使用的是 Adobe Photoshop 或 Gimp，则需要安装一个插件才能打开和编辑该文件格式。


    > 从 https://developer.nvidia.com/nvidia-texture-tools-adobe-photoshop 下载适用于 Adobe
    Photoshop 的 NVIDIA 纹理工具。

    > 从 https://code.google.com/p/gimp-dds/ 下载 GIMP DDS 插件。


    让我们尝试使用 Adobe Photoshop 或 Gimp 创建一个简单的地图。这里有一个小技巧，可以帮助你查看模型在纹理图中的位置。使用“抬高”或“降低”工具（用哪个其实无关紧要），改变模型周围的地面，然后导出高度图地形。当你打开纹理文件时，可以看到这些变化表现为微小的白色圆点。我不能一步步向你展示如何操作，但以下是一些帮助你入门的指导方针。始终从黑色纹理开始，然后使用非常小的灰色增量。为了让地形更有变化，可以尝试使用不同的画笔类型，并调整不透明度。当我创建高度图时，我总是使用相同的灰色级别，但我改变的是不透明度。别忘了始终将纹理保存为
    32f 格式的 32 位 DDS 高度图。


    ### 改变地形材质


    我之前提到过，我们可以选择更改地形的一些元素。也许我们想要不同类型的草，或者想要使用枯叶来代替岩石。要访问这些选项，我们需要使用**颜色**菜单，如下面的截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_88_0.png)


    颜色菜单，你可以在其中调整地形上看到的纹理


    使用此菜单有两种方式。第一种方式是更改各个元素。四个缩略图代表地形中存在的四种元素。起初你可能看不到它们，但一旦你开始雕刻地形并对其进行抬高和降低，这些元素就会开始出现。要更改这些元素，请单击缩略图上方的箭头以选择另一种纹理。如下面的截图所示，你有一个包含
    42 种不同纹理的列表，但你也可以使用自己的贴图：


    ![](img/192b6e55337adc00931f510ecaaf8e05_88_1.png)


    你可以使用的 42 种不同纹理


    在纹理旁边，我们可以找到两个大按钮：**自定义漫反射**和**自定义法线**。可以说，漫反射纹理是赋予我们颜色的纹理，而法线纹理是 Lumion 获取信息以在你的地形上添加不规则细节的纹理。我们可以使用的文件格式如下：


    - Windows 位图：*.bmp

    - 联合图像专家组：*.jpg

    - Truevision：*.tga

    - DirectDraw 表面：*.dds

    - 便携式网络图形：*.png

    - Photoshop：*.psd


    使用这些元素的第二种方式是直接在地形上绘制它们。为此，请单击带有纹理的缩略图，并调整**画笔速度**和**大小**滑块。还有第三个滑块用于调整平铺大小，换句话说，就是纹理的大小。


    ### 添加水面


    在我为本书使用的示例中，最近的水体是福克斯河，离房子不远。如果你需要创建游泳池，请记住使用**水**材质会容易得多。在本节中，Lumion 允许你轻松创建六种类型的水，如下面的截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_89_0.png)


    一旦你点击所需的预设，然后点击场景放置一个平面，并使用四个顶点上的图标调整高度和大小。遗憾的是，一旦添加了水材质，你就无法更改任何设置。唯一可以改变外观的水体是海洋。


    ### 创建海洋


    选择海洋菜单，并单击带有开/关电源开关符号的按钮来开启或关闭海洋。一旦你开启此选项，我们就可以访问各种设置来控制海洋的外观，如下面的截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_90_0.png)


    海洋菜单及其不同设置


    与 Lumion 中的其他所有功能一样，这个菜单非常直观且易于使用。我们可以改变波浪图案，以及风向影响波浪的方式。如果你想对滑块进行精确调整，别忘了在调整滑块时使用
    Shift 键。你为什么不试试使用颜色预设能得到什么效果呢？


    ## 设置天气


    当我们对地形和水体感到满意后，就可以开始关注细节了。我们可以从使用**天气**菜单开始。同样，这个菜单相当不言自明。我们可以改变太阳的方向和高度，从九种给定类型中更改云的类型，并调整滑块以创建晴朗的天空或阴天，如下面的截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_91_0.png)


    天气菜单，我们可以在这里控制太阳和天空


    这部分我们能做的并不多，如果我们想要添加一些特殊的天气条件，如雨和雪，可以在之后的照片或视频模式中进行。


    ## 为场景添加内容


    我们已经达到了一个阶段：地形已定义，天气已设置，3D 模型也已拥有漂亮且逼真的材质。所以现在，我们需要开始向场景中添加模型和小细节，以创造出更有趣、更生动的内容，而
    Lumion 在这方面非常出色。虽然我将使用一些自己的模型，但我们几乎可以在 Lumion 库中找到所需的一切。在下一节中，我们将学习如何添加模型，以及如何更改、操作和组织它们。

    '
