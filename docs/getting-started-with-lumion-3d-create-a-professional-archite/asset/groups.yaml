    \ model\n- Working with layers\n- Placing the model\n\n正如介绍中所看到的，本章更偏向技术，但同时也很重要，因为你将在这里学习导出\
    \ 3D 模型的正确方法。为了获得顺畅的工作流程，你需要密切关注本节。要回答这个问题：使用什么格式最好？COLLADA 是完美的答案。\n\n## 什么是\
    \ COLLADA？\n\nCOLLADA 是一个 XML 命名空间和数据库模式，用于在不同的 3D 工具之间创建桥梁，使得 3D 几何体、着色器和效果的轻松共享成为可能。用通俗的话说，它允许你在\
    \ SketchUp、3ds Max、Maya、Revit 和 Lumion 之间移动 3D 文件。然而，没有什么能阻止你使用其他文件格式，例如以下格式：\n\
