    The correct settings to export a FBX file from AutoCAD


    ## Working with Lumion


    Now we are going to start working with Lumion. We learned about everything we
    need: modeling, materials, and textures, exporting our model, and correcting certain
    things so that when we import our model inside Lumion, everything is perfect.
    Remember that we also need to do some planning before we start the process so
    that we already have a goal in mind when we start working with Lumion. This is
    a key aspect of creating great architectural visualizations.


    Let''s start working with Lumion and create a scene. I usually start with a sunny
    day scene because it gives me a good start with a flat terrain and good light.


    You already know how to import your model as discussed in Chapter 1, What is Lumion?
    but just to remind you, on the left-hand side of your screen, you will find four
    menus. The third menu is the Import menu. Click on it to activate the options
    at the bottom. Click on the Add a new model button and a window will appear where
    you can select the model you want to import. Double-click on the file or just
    click on the Open button. Another window will appear where you need to add a unique
    name to the model, and if you have any animations in the FBX file, tick the box
    next to Import animations.


    Now that you have imported the model, click the left mouse button anywhere that
    you want your model. If, by any chance, you are not using a flat terrain, you
    may find it difficult to place the model in a way that it doesn''t intersect the
    terrain. You may lose some time trying to get the right position, and that is
    why it is my advice to model your terrain at the base of your building so that
    you can easily merge with the terrain using the landscape material. Lumion offers
    several options to move and adjust the model we just imported, but before doing
    that, it is good practice to organize your scene using layers. You will thank
    yourself later, when you have 50 trees, 20 people, and 5 cars in your scene, and
    you need to select or edit your model without any distraction but don''t have
    any way to select and hide these models. So, don''t forget to use the Layers menu
    that you can find in the top-left corner.


    As I said, when you import your model inside Lumion, you gain access to really
    useful options to move and adjust the 3D model. Back in the Import menu, turn
    your attention to the last three icons. They have been highlighted in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_79_0.png)


    The context, edit, and delete buttons


    The first is the **Context** menu. When we select this option and click on the
    model, two menus will appear. The first is **Selection**, which we are not going
    to analyze now. We want the second option, **Transformation**. Click on this and
    a menu will appear as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_80_0.png)


    The Transformation submenu


    Most of them work when you have several objects selected. But why don''t you have
    a try, for example, with the **Place on ground** option? With this option, you
    can make sure that the model is in contact with the ground. When you finish, you
    can secure the position by using the **Lock position...** option. Going back to
    the **Import** menu, next to the **Context** menu, we have the **Edit Properties**
    menu. As you can see from the following screenshot, this menu allows you to accurately
    adjust the position not only of your model, but also of every single object inside
    Lumion. This also lets you know where the objects are positioned.


    ![](img/192b6e55337adc00931f510ecaaf8e05_80_1.png)


    Adjusting the 3D model position using the **Edit Properties** menu


    Once again, remember to always start working on your scene by creating layers.
    They are a key aspect to having a smooth workflow. They will not only help you
    organize your scene, but also help you to focus your attention on a specific model,
    hiding unnecessary things, and allowing fluid camera movement. You can even use
    them to get better performance while editing. Finally, once you decide that a
    model is in the right position, never forget to lock that object. With that in
    mind, you can turn your attention to the environment.


    ### Summary


    This was a more technical chapter where we learned about important topics that
    helped give us a good start with Lumion. We learned about COLLADA, its usefulness,
    and also the key aspects to consider when exporting our model. Finally, with the
    bridge between our 3D software and Lumion created, we learned not only how to
    import and use layers to organize our scene, but also to use the **Context** and
    **Edit Properties** menus to move and place our 3D model.


    With our model locked in place and materials assigned, we are ready to move on
    to the next chapter, where we will learn how to modify the terrain and start populating
    our scene with Lumion models.


    ## Sculpting the landscape


    With the first option, which is modeling a terrain using a 3D application, it
    is up to you to do whatever you want and what techniques to use. I always model
    a small base that I can later use in Lumion, assigning the **Landscape** material
    to blend or merge it nicely with the landscape. If you don''t want something special,
    this may be the best solution for you.


    The second option is the one we saw right at the beginning of this book. We can
    change the landscape by creating valleys and hills using the terrain brush tool
    that Lumion provides. Let''s have a deeper look at this option, which has been
    shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_84_0.png)


    The different brushes that you can use to modify the terrain


    If you have a graphic tablet, now is the right time to use it, but if not, we
    can still achieve almost the same results with a mouse. The icons on the buttons
    are pretty self-explanatory for what you can do with each one. The most useful
    tools are probably the **Raise** and **Lower** options in conjunction with the
    **Flatten** and **Smooth** options. **Jitter** can be useful to add small variations
    to the landscape, but we need to use a small brush with a low speed for it.


    Next to these options, we have key settings to sculpt the landscape. The first
    option is called **Brush Speed**, and it works in such a way that the lower the
    value, the longer you have to press the left mouse button to modify the terrain
    and vice-versa. The second option is even easier to use. Use a big brush to make
    changes in a big area and a smaller brush to add small details.


    Most of the time, I use a terrain that I have already modeled in SketchUp or some
    other application, but if I have some freedom, I start by raising and lowering
    the terrain, flattening it a little bit to place the 3D model, and finally applying
    some smoothness to eliminate the hard edges. In this way, I can create a nice
    terrain. Lumion offers you the opportunity to go back when you are sculpting,
    but the **Undo** button is very limited in scope because you can only undo your
    last action. But, let''s say you want to start all over again, how can you do
    that? The terrain menu can help you with this.

    '
  mdcn: '

    你可以使用这个选项，但我推荐使用 OpenCOLLADA，尤其是因为它会创建一个文件夹，里面包含你使用的所有纹理，这样你就不必担心在过程中丢失任何东西。要使用
    OpenCOLLADA 导出，请按照相同的步骤操作，但在选择文件格式时，选择 OpenCOLLADA 并使用以下截图所示的设置进行导出：


    ![](img/192b6e55337adc00931f510ecaaf8e05_77_0.png)


    OpenCOLLADA 导出设置


    ### 导出动画


    请记住，你可以在 Lumion 中导入来自 3ds Max 的动画。这该怎么做呢？首先，你需要将帧速率设置为 PAL。还要记住，Lumion 只能读取在移动、旋转和缩放值上带有关键帧的对象。考虑到这一点，你需要使用
    FBX 文件格式导出动画，并且不要忘记选择 Autodesk Media & Entertainment 的预设。


    ### 从其他 3D 软件导出


    从其他软件（如 Autodesk Maya、AutoCAD 和 Revit）导出时，我们基本应用相同的原则。对于 Maya，你需要安装 OpenCOLLADA
    插件。对于 Revit，你需要从 Lumion 网站下载 COLLADA 插件。使用 AutoCAD 时，你需要使用 FBX 文件格式导出，并使用如下截图所示的设置：


    ![](img/192b6e55337adc00931f510ecaaf8e05_78_0.png)


    从 AutoCAD 导出 FBX 文件的正确设置


    ## 使用 Lumion 工作


    现在我们将开始使用 Lumion 进行工作。我们已经了解了所需的一切：建模、材质和纹理、导出模型，以及修正某些问题，以便当我们把模型导入 Lumion 时一切完美。请记住，在开始这个过程之前，我们还需要做一些规划，这样当我们开始使用
    Lumion 时，心中已经有了目标。这是创建出色建筑可视化的关键方面。


    让我们开始使用 Lumion 并创建一个场景。我通常从阳光明媚的场景开始，因为它能给我一个良好的起点，带有平坦的地形和良好的光线。


    你已经知道如何导入模型，如第 1 章“什么是 Lumion？”中所述，但为了提醒你，在屏幕左侧你会找到四个菜单。第三个菜单是“导入”菜单。单击它以激活底部的选项。单击“添加新模型”按钮，会出现一个窗口，你可以选择要导入的模型。双击文件或直接单击“打开”按钮。会出现另一个窗口，你需要为模型添加一个唯一的名称，如果
    FBX 文件中有任何动画，请勾选“导入动画”旁边的复选框。


    现在你已经导入了模型，在你想要放置模型的位置单击鼠标左键。如果碰巧你没有使用平坦地形，你可能会发现很难将模型放置在不与地形相交的位置。你可能会花费一些时间试图找到正确的位置，这就是为什么我建议你在地基处建模地形，这样你就可以轻松地使用景观材质与地形融合。Lumion
    提供了多种选项来移动和调整我们刚导入的模型，但在这样做之前，最好使用图层来组织你的场景。以后当你的场景中有 50 棵树、20 个人和 5 辆车，你需要不受干扰地选择或编辑模型，却没有任何方法来选择和隐藏这些模型时，你会感谢自己。所以，别忘了使用左上角的“图层”菜单。


    正如我所说，当你在 Lumion 中导入模型时，你可以使用一些非常有用的选项来移动和调整 3D 模型。回到“导入”菜单，注意最后三个图标。它们在以下截图中已被突出显示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_79_0.png)


    “上下文”、“编辑”和“删除”按钮


    第一个是**上下文**菜单。当我们选择此选项并单击模型时，会出现两个菜单。第一个是**选择**，我们现在不打算分析它。我们需要第二个选项，**变换**。单击此项后，会弹出如下截图所示的菜单：


    ![](img/192b6e55337adc00931f510ecaaf8e05_80_0.png)


    “变换”子菜单


    其中大多数选项在你选中多个对象时都能使用。但为什么不试一试，比如**放到地面上**选项呢？使用此选项，你可以确保模型与地面接触。完成后，你可以使用**锁定位置...**选项来固定位置。回到**导入**菜单，在**上下文**菜单旁边，我们有**编辑属性**菜单。如下截图所示，此菜单允许你精确调整位置，不仅是你的模型，还有
    Lumion 中每一个对象。这还能让你知道对象的位置所在。


    ![](img/192b6e55337adc00931f510ecaaf8e05_80_1.png)


    使用**编辑属性**菜单调整 3D 模型位置


    再次提醒，务必始终通过创建图层来开始处理你的场景。它们是实现流畅工作流程的关键方面。它们不仅有助于组织你的场景，还有助于将注意力集中在特定模型上，隐藏不必要的内容，并允许流畅的相机移动。你甚至可以在编辑时利用它们获得更好的性能。最后，一旦你确定模型处于正确位置，永远不要忘记锁定该对象。考虑到这一点，你可以将注意力转向环境了。


    ### 总结


    这是一个更偏技术的章节，我们学习了重要的主题，这帮助我们为使用 Lumion 打下了良好基础。我们了解了 COLLADA、它的用途，以及在导出模型时需要考虑的关键方面。最后，通过在我们使用的
    3D 软件和 Lumion 之间建立桥梁，我们不仅学会了如何导入和使用图层来组织场景，还学会了使用**上下文**菜单和**编辑属性**菜单来移动和放置我们的
    3D 模型。


    模型已锁定到位并指定了材质，我们准备进入下一章，我们将学习如何修改地形，并开始使用 Lumion 模型填充场景。


    ## 雕刻地形


    第一个选项是使用 3D 应用程序建模地形，如何操作以及使用什么技术完全由你决定。我总是建模一个小的底座，之后可以在 Lumion 中使用，通过指定**景观**材质来使其与地形完美融合或合并。如果你不需要特别的东西，这可能是最适合你的解决方案。


    第二个选项就是我们在这本书开头看到的那个。我们可以使用 Lumion 提供的地形笔刷工具，通过创建山谷和丘陵来改变景观。让我们更深入地了解这个选项，如下截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_84_0.png)


    可用于修改地形的不同笔刷


    如果你有数位板，现在正是使用它的好时机；如果没有，我们仍然可以用鼠标达到几乎相同的结果。按钮上的图标相当形象地说明了每个工具的功能。最有用的工具可能是**抬高**和**降低**选项，以及**平整**和**平滑**选项。**抖动**可以用来为景观添加一些微小的变化，但我们需要使用小笔刷和较低的速度。


    在这些选项旁边，还有雕刻地形的关键设置。第一个选项叫做**笔刷速度**，它的工作方式是值越低，你需要按住鼠标左键的时间就越长才能修改地形，反之亦然。第二个选项使用起来更简单。使用大笔刷在较大的区域进行修改，使用较小的笔刷来添加细节。


    大多数时候，我使用在 SketchUp 或其他应用程序中已经建模好的地形，但如果我有一定的自由度，我会先抬高和降低地形，稍微平整一下以放置 3D 模型，最后应用一些平滑来消除生硬的边缘。这样，我就能创建出不错的地形。Lumion
    允许你在雕刻时返回，但**撤销**按钮的范围非常有限，因为你只能撤销上一个操作。但是，假设你想重新开始，那该怎么办？地形菜单可以帮助你做到这一点。


    '
