    # Building the Environment


    # # Adding trees, people, and other models


    Let''s start with the first option we have in the **Objects** menu — nature, as
    you can see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_92_0.png)


    This menu gives you access to more than 2000 models


    Once we click on this submenu, a small thumbnail appears on the right side showing
    the current model. After a few searches, I came across the various types of trees
    that we can find near the Farnsworth house. They are **Honey locust, Linden, Ash,
    Oak, Maple, Willow, Hackberry, Redbud, Alder,** and **River birch**, and most
    of them can be found in Lumion.


    Again, remember to use layers when you add these details and models. You can add
    up to 20 layers, so no excuse to not use layers. I also use a layer for the house,
    and if your building is too heavy, use a low poly version on another layer so
    that you can easily set up the environment. Let''s start by adding some trees.
    Create a layer for the trees and click on the thumbnail with the figure of a tree.
    This will give you access to the library. Here, we can find different elements
    of the nature, and for the trees, we have six tabs where we can find **leaves,
    pine,** and **palms**.


    Once we select the tree we want, Lumion returns to build mode, and we can easily
    see a yellow boundary box. This box represents the tree and can help us to see
    if we are not placing the tree in a location where it is intersected with something,
    for example the house. When we are placing the object, Lumion is smart enough
    to not only recognize the ground but also the faces above the ground, as you can
    see in the following screenshot:'
  - '[PAGE 93]


    ![](img/192b6e55337adc00931f510ecaaf8e05_93_0.png)


    Lumion is telling us that if we place the tree here, it will be 1.06 m above the
    ground


    So, as you can see from the preceding screenshot, a red line with a number will
    appear as if it''s warning you that if you place the tree in that location, it
    will be 1.06 meters from the ground. If you press G and click with the left mouse
    button to place the object, the object will be placed on the ground even if this
    means to intersect a face or another object.


    One thing that I recommend is pressing Ctrl along with any number between 1 and
    9 to save a top view as a camera viewport. This will help when we are placing
    trees and other objects. To place any model after selecting it, we need to click
    with the left mouse button, but if we are placing objects such as trees, flowers,
    or grass, it can be really tedious and time consuming to place 20 trees of the
    same type, one by one. So while placing the model, we can use the following two
    shortcuts to help us with this work:


    +   - Z: This key will change the size every time you place an object

    +   - Ctrl: This key places 10 copies of the object selected'
  - '[PAGE 94]


    # Building the Environment


    The good news is that we can use the combination of Ctrl + Z along with the left
    mouse button to place 10 copies of the object with different sizes. Placing so
    many objects can have a side effect; your viewport starts to get slow, but with
    trees and other plants, we don''t need to see the full quality of a tree in our
    viewport. Remember to use F9 to toggle on or off the full quality, as you can
    see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_94_0.png)


    On the left side, we pressed the F9 key to toggle off the quality, and on the
    right side, we have full quality


    The possibility of placing several copies is a great feature, but bear in mind
    that the more objects you have inside Lumion, the slower the workstation will
    work because you are consuming more memory and other resources. Several issues
    can also arise where we need to make some adjustments. Let''s say that we create
    another group of a specific type of trees on the right side and want to move all
    the trees more to the left. Thanks to the Lumion team, we don''t need to move
    each tree one by one. In this situation, we can take more advantage of the Context
    menu. Once we click on this menu, white dots will appear on each tree, and clicking
    on the white dot will open two submenus, Selection and Transformation, which we
    saw previously when we imported our model.'
  - '[PAGE 95]


    In this case, we select **Selection**, and new options will be available. Let''s
    explore several situations and how we can use this menu to help us. In the first
    example, I want to move the trees that are on the right a little more to the left
    side. Which option do we use? Let''s try to click on the **Select All Similar
    Category** option. This selects every model you have that falls under the category
    of trees. So, if you have more trees in your scene, like in this example, you
    will select every single tree, but this is something we don''t want to do; we
    just want to select those specific types of trees. Click on the **Deselect All**
    option to clear the selection. Let''s try the **Select All Similar** option and
    using this, we just select the trees that fall under a specific type of tree.


    Use the keyboard shortcuts to change the position, scale, and orientation of the
    objects selected. But there are other shortcuts that you can use to not only select
    objects but also copy and paste and change the height:


    +   - Pressing *Ctrl* and dragging the left mouse button will do a rectangular
    selection for multiple objects, and on top of the rectangle, Lumion informs you
    how many objects you have selected so far.

    +   - Pressing *Ctrl* + *Shift* and dragging the left mouse button will make another
    rectangular selection. Add this selection to another one done previously.

    +   - Pressing *M* + *Alt* will copy and paste the selected object(s).

    +   - Pressing *M* + *F* for the orientation of all objects, except for trees
    and plants, will adjust the surface angles of other objects accordingly.

    +   - Pressing *M* + *Shift* will move the selected objects horizontally and keep
    the same height.

    +   - Pressing *R* + *Shift* will turn off the rotation snapping.


    There are two other useful features in the **Selection** menu. The first feature
    is the ability to replace your selection with another element from the library
    and see which model you are using in the library. The way it works is simple;
    let''s say we want to change the trees we have for another type of tree. The first
    thing we need to do is go to **Library** and select the model we want. Once we
    do that, use the **Context** menu to select the trees to be replaced and then
    select the **Library** option. In this menu, we can find two other options: **Select
    in Library** and **Replace with library selection**. Click on the second one to
    replace all the trees or other models you have selected by the current model.
    The other option, **Select in Library**, is good when we don''t know what type
    of tree or model we are using. So, if we select the model, and using the **Context**
    menu, select **Library** and then **Select in Library**, we can see that the current
    selected models in the library have changed.'
  - '[PAGE 96]


    # Building the Environment


    Now, let''s turn our attention to the other menu called **Transformation**. This
    menu helps us to edit the position and other aspects of the models. For example,
    the **Randomize** menu helps us to add variation to our scene by randomizing the
    **Position**, **Rotation**, and **Scale** values. Another useful option is **Space**
    because this allows you to align with a distance in between.


    The **Align** option lets you position the objects that you had already selected
    in such a manner that their pivot points are at the same position, but this will
    overlap the objects. So if you need to move the objects, place the mouse cursor
    over the small overlapping object selection icons and use the mouse wheel or the
    up and down keys to toggle between the objects.


    After placing some models in your scene, you realized that you didn''t use the
    correct layer, or worse, didn''t use any layer at all. Does that mean you need
    to redo it all over again? No, because there is a simple way of adding a model
    to the correct layer. Press *Ctrl* and drag with the left mouse button to select
    the objects you want to add to the layer, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_96_0.png)


    When you go to the **Layers** menu and select another layer, we can see an up
    arrow next to the layer''s name. Click on this arrow to move the selection to
    the layer.


    Now that you know how to add models and control them and how they look, feel free
    to explore the other models that we can find in the library, such as **Transport**,
    **Indoor**, **People**, and **Outdoor**.'
