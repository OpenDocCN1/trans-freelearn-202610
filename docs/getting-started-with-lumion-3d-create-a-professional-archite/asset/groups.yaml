  mdcn: "\n\n## 什么是 Lumion？\n\nLumion 是一款功能强大、易于使用、有趣且高效的建筑可视化工具，任何人都可以借助它构建 3D 环境，然后创建精美的图像、令人印象深刻的视频演示和实时漫游。它是将\
    \ 3D 模型快速拾取并在数分钟内创建场景的最快方式。本章将帮助你更好地了解 Lumion，并通过快速入门，你将立即开始使用 Lumion。\n\n在本章中我们将涵盖以下主题：\n\
    \n- 为什么使用 Lumion？\n- 我们能从 Lumion 获得什么？\n- 版本之间的差异\n- 导入格式\n- 工作站规格\n- Lumion 的界面\n\
    - Lumion 内部导航\n- 使用 Lumion 工作\n\n本章是对 Lumion 的非常概括性的概述。我会尽量避免用太多背景信息让你感到厌烦，但你将了解到该软件旨在让你做什么、它与其他\
    \ 3D 替代方案相比如何，以及所有内容在哪里。\n\n### Lumion 背景\n\n首先，让我们讨论一下 Lumion 的简要历史。Act-3D 是\
    \ Lumion 的开发公司，你可能从 Quest3D 以及他们参与的其他一些项目中认识他们。然而，Act-3D 意识到众多客户都在使用 Quest3D 来制作建筑可视化。这是一项困难的任务，因为\
    \ Quest3D 并不是创建此类内容的最佳工具。事实上，使用 Quest3D 并非易事；你几乎需要成为一名大师才能创作出东西。最终，Act-3D 决定以这些客户为目标开发全新的软件。于是，Lumion\
    \ 诞生了，它拥有实时可视化工具的强大功能，同时又对每个人都易于访问。\n\n### 为什么使用 Lumion？\n\n简短的回答是 Lumion 易于使用，最终产品质量良好。详细的回答是每个建筑项目都需要技术图纸和文档。虽然这些技术信息对施工团队来说没问题，但通常客户并不知道\
    \ CAD 平面图是什么意思。他们可能知道厨房或客厅会在哪里，但将这些 2D 信息转化为 3D 在客户脑海中并不总是容易。如果我们需要做演示或试图销售尚未建成的东西，这可能会成为问题。说实话，一张图片比文字更有说服力。这就是\
    \ Lumion 登场的地方。Lumion 是渲染高质量静止图片和视频的最快方式，并且它使从任何 3D 建模软件（如 SketchUp、AutoCAD、Revit、ArchiCAD\
    \ 和 3ds Max）导入我们的 3D 模型并在数分钟内创建场景变得如此简单。因此，Lumion 3D 不仅因为渲染速度更快而成为独特的建筑可视化软件，也因为它非常用户友好且直观。\n\
    \n我们可以使用 Lumion 创建建筑可视化的另一个原因是，我们可以在一天中的任何时间或任何季节，以几分钟的时间就能很好地了解我们的项目在自然环境中会是什么样子。现在如果你是一名建筑师，毫无疑问你希望以最好的方式提升项目的特点。Lumion\
    \ 可以帮助你在数小时内实现这一点，而不是不可避免的数天数周的渲染时间。\n\n尽管如此，我们可以从这个应用程序中获得如此之多，以至于你会忘记照片级逼真的渲染。Lumion\
    \ 是一个功能强大且先进的 3D 引擎，允许我们处理更重的模型，并且我们可以通过点击拖拽技术让场景栩栩如生。\n\n为此，Lumion 配备了一个庞大的库，我们可以在其中找到：\n\
    \n- 2409 棵树、交通工具、室外和室内模型以及人物的模型\n- 103 种环境、人物和机器音效\n- 518 种材料和纹理类型\n- 28 种景观类型\n\
    \n除了这份庞大的收藏外，还有更多可添加的功能；我们可以在场景中加入逼真的水体（海洋、河流、游泳池、瀑布和喷泉），我们可以塑造地形以适应我们的需求，并且我们可以添加雨、雪、雾、风、动画对象，以及添加摄像机特效。\n\
    \n你只需要一个空白的 3D 模型；导入并开始工作，因为正如你所见，Lumion 几乎配备了我们创建建筑可视化所需的一切。\n\n### Lumion 各版本之间的差异\n\
    \nLumion 有不同的版本。让我们从最基础的开始，即 **Lumion Free**。此版本只是为了分析 Lumion 是否是我们真正需要的。Lumion\
    \ Free 不用于商业用途，最终输出会带有 Lumion 标志的水印。我们可以访问一些模型和功能，但不是整个收藏。\n\n![](img/192b6e55337adc00931f510ecaaf8e05_18_0.png)\n\
    \n> 要下载最新版本的 Lumion Free，请使用此链接：\n> \n> http://lumion3d.com/free/.\n> \n> 如果你是学校、学院或教育机构，请使用\
    \ **Lumion Educational** 或购买 **Lumion Pro**。同样，每个版本可获得的内容存在一些限制。要了解有关 Lumion Educational\
    \ 许可证的更多信息，请访问以下链接：\n> \n> http://lumion3d.com/educational/.\n\n然后，我们有付费版本。有两个选项：**Lumion**\
    \ 和 **Lumion Pro**。Lumion 是标准版本，拥有大部分功能和内容。Lumion PRO 是专业工作室最理想的版本，因为你可以访问所有功能和内容。使用\
    \ Lumion PRO，我们可以获得超过 2000 个模型、3D 音效和动画角色。如果我们已有旧版本，例如 Lumion 3D 版本 2，升级成本与其他应用程序相比更低——这是\
    \ Lumion 相对于其他应用程序的一个优势。\n\n### 导入我们的 3D 模型\n\n使用 Lumion 时的导入工作流程非常出色。我们可以连同纹理一起导入\
    \ 3D 模型，并且如果我们想渲染，模型就已准备就绪。另一个有用的功能是更新模型的能力。我们做出所需的更改，导出并使用相同名称保存，即覆盖模型。然后，Lumion\
    \ 通过一个重新加载按钮处理这种情况。因此，Lumion 将重新导入模型并重新应用相同的材质。\n\nLumion 支持许多格式，例如以下：\n\n- 3D\
    \ 格式：\n  - **Autodesk RealDWG:** *.dxf\n  - **Autodesk RealDWG:** *.dwg\n  - **COLLADA\
    \ file:** *.dae\n  - **FBX file:** *.fbx\n  - **Max file:** *.max\n  - **3ds file:**\
    \ *.3ds\n  - **Obj file:** *.obj\n  - **SketchUp file:** *.skp\n- 2D 格式：\n  -\
    \ **Windows Bitmap:** *.bmp\n  - **Joint Photographic Experts Group:** *.jpg\n\
    \  - **Truevision:** *.tga\n  - **DirectDraw Surface:** *.dds\n  - **Portable\
    \ Network Graphics:** *.png\n  - **Photoshop:** *.psd\n  - **Tagged Image File\
    \ Format:** *.tiff\n  - **High Dynamic Range:** *.hdr\n- 视频格式：\n  - **MPEG-4 Part\
    \ 14:** `*.mp4`\n\nLumion 还允许我们导入、移动、旋转和缩放动画。帧率需要设置为 25 FPS，并且 Lumion 对 FBX 文件的工作效果更好。\n\
    \n在 Lumion 中无法导入顶点动画、变形动画或基于骨骼的动画。我们可以使用 FBX 文件导入动画，只要这些动画仅在移动、旋转和缩放值上即可。如果你使用\
    \ Revit，Act-3D 已为 Revit 开发了一个 COLLADA 导出插件，你可以免费下载。\n\n### 工作站规格\n\n我们需要一台良好的工作站来使用\
    \ Lumion。有一些基本要求，但不必太担心。为什么？让我举个例子：推荐的系统内存为 6 GB，但我只用 4 GB 就完成了几个项目。下载 Lumion\
    \ Free，看看你的工作站能否胜任。Lumion 附带了一些示例，可以帮助你评估这一点。\n\nLumion 建议以下最低要求：\n\n- **OS:**\
    \ Windows XP、Vista、7、8（32 位和 64 位）以及 DirectX 9.0c 或更高版本\n- **System memory:**\
    \ 3 GB\n- **Graphics card:** NVIDIA GeForce GTS 450 或 ATI/AMD Radeon HD 4890，至少\
    \ 1 GB 专用内存（非共享系统内存）\n\n但要获得最大性能，需要以下配置：\n\n- **OS:** Windows 7、8（64 位）\n- **System\
    \ memory:** 6 GB\n- **Graphics card:** NVIDIA GTX 680 或 AMD Radeon HD 7970 或更快，至少\
    \ 2 GB 专用内存（非共享系统内存）\n\n"
