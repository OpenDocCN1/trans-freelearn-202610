    \    - 取景的重要性 — 91\n  - **三分法** — 92\n  - **使用照片模式导出图像** — 93\n  - **使用影片模式创建视频**\
    \ — 95\n  - **总结** — 97\n- **第7章：后期制作** — 99\n  - **后期制作** — 100\n    - 处理图像 —\
