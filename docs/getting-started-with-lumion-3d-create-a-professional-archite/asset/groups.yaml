  - '[PAGE 27]


    +   - **The middle mouse button + movement of the mouse**: Pan around the viewport

    +   - **Scrolling up/down using the mouse wheel**: This helps you to move in and
    out

    +   - *Ctrl + H*: This resets the camera pitch to the horizontal viewpoint

    +   - *O + the right mouse button*: This orbits the camera


    So, you can see how important it is to have a three-button mouse to help you navigate
    the camera in the editor. It is really important to learn and memorize these shortcuts
    to improve your workflow; not only when you are placing content, but also when
    you need to control the camera in the Photo and Movie modes.


    # Importing the model


    Now that we know how to navigate inside Lumion, let''s import a model. How can
    we do that? On the left-hand side, there is a square with a Sun; move your mouse
    there and three more squares will appear. The first one is for us to change the
    weather, the second one is for landscape, the third one is to import our models,
    and the last one is to add objects using the Lumion library.


    If we click on the **Import** button, the menu at the bottom will change as you
    can see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_27_0.png)


    The Import menu'
  - '[PAGE 28]


    # What is Lumion?


    My interface may be different from yours. You may notice that I already have the
    model selected to import. This happens because Lumion always selects the last
    model you imported. To erase these files from the Import library, click twice
    on the thumbnail with the model. This will open a new window where we have all
    the models that are already imported. To delete the model, move your mouse cursor
    on top of the thumbnail and click twice on the trash bin icon.


    Go back to the Build mode by clicking on the small cross at the top-right corner.
    Click on the first button to import your model. When starting a Lumion project,
    it''s a good idea to set up your file structure first. Start with a main folder
    for the project and include subfolders inside. When you transport your project
    to another workstation, you can grab the whole folder to keep the hierarchy intact.


    The model I exported from SketchUp was saved in the Import folder and the SketchUp
    model was saved in the Assets folder. Select the file that you exported, but first
    you may need to choose the correct extension so that your model can be made visible.
    Once you click on **Open**, a small window will appear where we can change the
    name of our imported model and choose to import animations (if we have some).
    Click on **OK** to add the 3D model to the library.


    When we do this, a yellow bounding box will appear to help us insert our model
    in the correct place. If you can''t see the yellow bounding box, you may need
    to scroll using the mouse wheel to zoom out a little bit.


    > Don''t forget to use the O key and the right mouse button to orbit the camera.


    To place the model, click the left mouse button wherever you want to place it.
    Congratulations! You just imported your model.


    +   If you can''t see your model after importing and placing it in the scene,
    try this:

    +   - Place your model at 0,0,0 before exporting it.

    +   - Check the scale of your model.'
  - '[PAGE 29]


    # Working with Layers


    Maybe you are thinking, "Oh, it would be really nice if I could organize my scene
    with Layers." Well, you can. At the top-left corner, can you see a number with
    a tiny eye? If we move our mouse there, the Layers menu will appear. Here is how
    it works:


    +   - To start a new layer, click on the plus icon

    +   - To set the current layer, click on the number that identifies each layer

    +   - To hide a layer, click on the eye

    +   - For labeling, change the layer name by typing it in the textbox


    ![](img/192b6e55337adc00931f510ecaaf8e05_29_0.png)


    It’s a really good idea if from the beginning you start to organize your scene
    using layers. And I speak from experience because sometimes, it can be hard to
    select something in Lumion when you have your scene full with objects. Things
    that you can organize inside layers include Trees, Grass, People. It will make
    a big difference, trust me.


    # Applying materials


    I am not going too deep into the editing materials. When we import a model, if
    we click on icon that has a bucket with ink, we can add materials to our model.
    Near our model, there is a white dot that we need to click on in order to select
    the model. You will know that you selected the model because it will turn green
    with a bounding box.'
