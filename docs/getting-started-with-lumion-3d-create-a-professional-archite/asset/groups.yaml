    \ tab** 如其名所示，是创建新场景时很好的起点。我们可以基于几个预设创建新场景，也可以创建空场景。我们可以从 **Night, Sunset, Sunny\
    \ Day, Flatlands, Island, Lake, Desert, Cold Climate** 以及 **Empty scene** 中选择。\n\
    \n我发现这些预设是快速帮助，可以节省一些时间，因为最终这些预设提供的一切，我们几分钟内就能自己创建。所以，它们并没有什么特别之处。当你启动 Lumion\
    \ 时，这将是你看到的第一件事：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_21_0.png)\n\nNew\
    \ 标签页上可以找到的九个预设\n\n### 探索 Home 标签页\n\n在我们左侧，有 **Home** 标签页。它是带有斜体 **i** 的那个。在这里，我们可以访问\
    \ **Settings** 以及在线内容，例如 **Tutorials**、**Profile** 和 **User Forum**。点击 **Settings**\
    \ 以访问一些质量设置，帮助我们更好地使用 Lumion 3D。你的 **Settings** 窗口看起来会像下面这样：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_22_0.png)\n\
    \n要了解每个按钮的作用，将鼠标悬停在按钮上，就会显示一个标签告诉你它们的功能。例如，点击第一个按钮可以 **Enable extra information\
    \ in build mode**。例如，如果你使用图形平板，点击按钮即可启用它。这是一个非常实用的工具，尤其是在我们想要修改地形时。\n\n本节中的几乎所有内容都与质量相关。即使我们的工作站不是最好的——也就是说你不符合所有规格——我们仍然可以通过降低质量设置来使用\
    \ Lumion。别担心，因为最终的渲染或视频质量会保持相同。唯一的区别是我们能在 Build 模式下看到的质量。所以，继续尝试，看看哪种设置最适合你。\n\
    \n此外，在 Build 模式工作时也有快捷方式可以访问这些选项。以下是帮助我们调整质量设置的快捷键列表：\n\n- *F1*: 按下后，**Editor\
    \ Quality** 变为 **Low**\n- *F2*: 按下后，**Editor Quality** 变为 **Medium**\n- *F3*:\
    \ 按下后，**Editor Quality** 变为 **High**\n- *F4*: 按下后，**Editor Quality** 变为 **Very\
    \ High**\n- *F7*: 按下以在最高细节级别查看 Lumion 地形\n- *F9*: 如果按下，所有视口中的树木和植物都将以最佳细节级别渲染\n\
    \n如果你觉得场景开始变慢，而你正在使用最高质量，按 *F3* 来降低质量等级。让我们继续看其他标签页。\n\n### Examples 标签页\n\n点击\
    \ **OK** 按钮返回 **Home** 标签页。第三个标签页，带有三栋房子的那个，叫做 **Examples**。可以说这是一个有用的标签页，主要是因为你可以通过查看其他艺术家如何使用材质、设置相机以及使用众多视频和图像效果，来看到用\
    \ Lumion 能取得什么成果。材质场景很有用，因为在这里你可以查看一些材质示例并测试不同的 518 种材质或你自己的材质。\n\n我相信你已经迫不及待想试试了，并打开了这个场景。现在你一定在想如何返回。返回主菜单，点击右下角的\
    \ **Files** 按钮（软盘图标）。返回主菜单后，你可能会注意到界面有一些变化。对，就是现在你又多出了两个标签页：**Save scene** 和 **Export\
    \ full scene**。\n\n### Load scene 和 Save scene 标签页\n\n在 **Examples** 标签页旁边，我们有\
    \ **Load scene** 标签页，这里存储着我们所有已保存的场景。不仅是已保存的场景，自动保存的场景也存储在这里。这些文件是 Lumion 为你自动保存的，以防出现问题，不过我建议你保存自己作品的多个版本。如果你想删除自动保存文件或其他场景，将鼠标悬停在缩略图上。然后，需要在右上角的小垃圾桶图标上双击以删除文件。\n\
    \n现在，正如我所说，当你创建新场景或打开之前保存的场景时，Lumion 会触发另外两个标签页。其中一个是让我们保存当前场景。操作方法很简单；给你的场景命名，如果想的话添加一些描述，然后点击\
    \ **OK** 按钮将其保存为 **Version 0**。每次保存场景时，Lumion 都会将其保存为不同版本。我总是将初始场景命名为 `Base Scene`。如果出现问题或我需要重新开始，我会使用这个场景。然后我再将其另存为\
    \ `Scene_v01`。我在这个场景上工作。如果我要做大的改动，我再将其另存为 `Scene_v02`。这样，如果我的场景出现问题，我总能回到某个特定点重新开始。\n\
    \n那么，让我们直接开始吧。我们需要的第一件事是一个 3D 模型，我将使用建筑师 Ludwig Mies Van der Rohe 设计的著名 Farnsworth\
    \ House 的 3D 模型。这只是一个例子，所以请随意使用你想尝试的任何模型。我在 SketchUp 8 中建模了这栋房子，这是进行建筑建模的最佳解决方案之一。但正如你已经知道的，只要你能导出\
    \ Lumion 支持的格式，你就可以使用任何 3D 应用。以下是我要使用的 3D 模型：\n\n![](img/192b6e55337adc00931f510ecaaf8e05_25_0.png)\n\
    \n所以我们需要做的第一件事是导出模型。使用 SketchUp 请按以下步骤操作：\n\n- 1. 进入菜单并导航到 **File | Export | 3D\
    \ Model....**\n- 2. 在导出模型窗口中，选择 **COLLADA File (*.dae)** 作为导出格式。然后，点击 **Options...**\
    \ 按钮并选择以下选项：\n  - **Triangulate All Faces** 选项\n  - **Preserve Component Hierarchies**\
    \ 选项\n  - **Export Texture Maps** 选项\n- 3. 如果你使用其他 3D 软件，请参阅 *Chapter 4, Working\
    \ with Lumion,* 以获得帮助。\n- 4. 导出后，启动 Lumion 并在 New 标签页上选择 Sunny Day 预设。Lumion 将打开一个带有此预设的场景。我们现在处于\
    \ Build 模式，看起来像下面这样：\n\n  ![](img/192b6e55337adc00931f510ecaaf8e05_26_0.png)\n\
    \n  Build 模式界面\n- 5. 你在前一截图中间看到的括号是相机移动的目标。要在 Lumion 中导航，我们需要使用以下键：\n  - **Up\
    \ arrow key / W**: 这会使相机向前移动\n  - **Down arrow key / S**: 这会使相机向后移动\n  - **Left\
    \ arrow key / A**: 这会使相机向左移动\n  - **Right arrow key / D**: 这会使相机向右移动\n  - **Q**:\
    \ 这会使相机向上移动\n  - **E**: 这会使相机向下移动\n  - **Shift + W/S/A/D/Q/E**: 这会使相机速度加倍\n  -\
    \ **Space bar + W/S/A/D/Q/E**: 这会减慢相机\n  - **Shift + Space bar + W/S/A/D/Q/E**:\
    \ 这会使相机速度非常快\n  - **右鼠标按钮 + 移动鼠标**: 这有助于你环顾四周\n\n"
