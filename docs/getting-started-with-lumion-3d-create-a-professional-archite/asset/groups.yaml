- raw:
  - '[PAGE 21]


    # # Lumion''s 3D interface


    Now that we know what we can do with Lumion and the content available, we will
    take some time to explore Lumion and get our hands dirty. In my opinion and experience,
    it is much easier to learn something if at the same time we apply what we are
    learning. So, in the next section we are going to explore the Lumion interface
    with the menus and different settings. But to do that we will use a small tutorial
    as a quick start. By doing this, we will explore Lumion and at the same time see
    how easy it is to produce great results. After this chapter, we''ll be able to
    go on and refine our skills and techniques in the subsequent chapters. We will
    see that Lumion is easier to learn and more accessible than other software.


    So go ahead and fire up Lumion and let''s have a quick tour before we start working
    with it. I am going to explain to you what each tab does, to help you see how
    you can do simple tasks, such as saving and loading a scene, changing the settings,
    and creating a new scene. Let''s start with the first tab that Lumion shows us.


    # ## A look into the New tab


    On startup, Lumion goes straight to the **New tab**. The **New tab**, as the name
    indicates, is a good place to start when you want to create a new scene. We can
    create a new scene based on a few presets or just create an empty scene. We can
    choose from **Night, Sunset, Sunny Day, Flatlands, Island, Lake, Desert, Cold
    Climate**, and an **Empty scene**.


    I found these presets as a quick help to cut some time, because in the end everything
    we get from these presets, we can create in a few minutes. So, there is nothing
    special about them. When you start Lumion, this will be the first thing you will
    see:


    ![](img/192b6e55337adc00931f510ecaaf8e05_21_0.png)


    The nine presets you can find on the New tab'
  - '[PAGE 22]


    # Exploring the Home tab


    On our left, we have the **Home** tab. It is the one with an italic **i**. Here,
    we have access to the **Settings** and online content such as **Tutorials**, **Profile**,
    and **User Forum**. Click on **Settings** to access some quality settings that
    help us work better with Lumion 3D. Your **Settings** window will look something
    like the following:


    ![](img/192b6e55337adc00931f510ecaaf8e05_22_0.png)


    To understand what every button does, place your mouse over a button and a label
    will appear telling you what they do. For example, by clicking on the first button
    you can **Enable extra information in build mode**. If, for example, you have
    one graphic tablet, click on the button to enable it. This is a really handy tool
    especially if we want to modify the landscape.


    Almost everything in this section is related to quality. Even when our workstation
    is not the best – meaning you don''t meet all the specifications – we can still
    work with Lumion by lowering the quality settings. Don''t worry, because in the
    end the final render or video will have the same quality. The only difference
    is the quality that we can see in the Build mode. So, go ahead and see what suits
    you best.


    Also, there are shortcuts to access these options while working in the Built mode.
    The following is a list of shortcuts to help us with the quality settings:


    +   - *F1*: On pressing this, the **Editor Quality** becomes **Low**

    +   - *F2*: On pressing this, the **Editor Quality** becomes **Medium**

    +   - *F3*: On pressing this, the **Editor Quality** becomes **High**'
  - '[PAGE 23]


    +   - *F4*: On pressing this, the **Editor Quality** becomes **Very High**

    +   - *F7*: Press this to view the Lumion terrain at the maximum level of detail

    +   - *F9*: If you press this, all trees and plants in the viewport will be rendered
    at their best level of detail


    If you feel that your scene is starting to get slow and you are working with the
    best quality, press *F3* to lower the level of quality. Let''s move to the other
    tabs.


    # The Examples tab


    Click on the **OK** button to go back to the **Home** tab. The third tab, the
    one with three houses, is called **Examples**. You can say that it is a useful
    tab, mainly because you see what you can accomplish with Lumion by looking at
    how other artists used the materials, set the camera, and used the numerous video
    and image effects. The material scene is useful because here you can see some
    examples of materials and test the different 518 materials or your own.


    I am sure you wanted to have a go, and opened this scene. Now you must be wondering
    how to go back. To go back to the main menu, click on the **Files** button (floppy
    disk icon) in the bottom-right corner. After going back to the main menu, you
    may notice some changes in the interface. That''s right, now you have another
    two tabs: **Save scene** and **Export full scene**.


    # The Load scene and Save scene tabs


    Next to the **Examples** tab, we have the **Load scene** tab where all of our
    saved scenes are stored. Not only the saved scenes, but the autosaved scenes are
    stored too. These files are automatic saves that Lumion does for you just in case
    something goes wrong, although I recommend that you save several versions of your
    work. If you want to remove the autosaved files or other scenes, place your mouse
    over the thumbnail. Then, you have to click twice on the small trash bin icon
    in the upper-right corner to delete the file.


    Now, as I told you, when you create a new scene or open a previously saved scene,
    Lumion triggers two more tabs. One of them is for us to save our current scene.
    The way it works is simple; give a name to your scene, add some description if
    you want, and click on the **OK** button to save it as **Version 0**. Every time
    you save a scene, Lumion will save it as a different version. I always save the
    initial scene with the name `Base Scene`. If something goes wrong or if I need
    a fresh start, I will use this scene. Then I save it again as `Scene_v01`. I start
    working on this scene. If I am going to do a big change, I save it again as `Scene_v02`.
    In this way, if something happens to my scene, I can always go back and start
    from a specific point.'
  - '[PAGE 24]


    <!-- no content -->'
  - '[PAGE 25]


    So, let''s get started straightaway. The first thing we need is a 3D model, and
    I am going to use a 3D model of the famous Farnsworth House design by the architect
    Ludwig Mies Van der Rohe. This is just an example, so feel free to use any model
    you want to try. I modeled this house in SketchUp 8, which is one of the best
    solutions to do architectural modeling. But as you know already, you can use any
    3D application as long as you can export to the format that Lumion supports. The
    following is the 3D model I am going to use:


    ![](img/192b6e55337adc00931f510ecaaf8e05_25_0.png)


    So the first thing we need to do is export our model. Using SketchUp follow these
    steps:


    +   1. Go to the menu and navigate to **File | Export | 3D Model....**

    +   2. In the window to export the model, choose **COLLADA File (*.dae)** as the
    export format. Then, click on the **Options...** button and select the following:

    +      - The **Triangulate All Faces** option

    +      - The **Preserve Component Hierarchies** option

    +      - The **Export Texture Maps** option

    +   3. If you are using other 3D software, go to *Chapter 4, Working with Lumion,*
    to get some help.'
  - '[PAGE 26]


    4. After exporting, start Lumion and select the preset Sunny Day on the New tab.
    Lumion will open a scene with this preset. We are now in the Build mode that looks
    something like the following :


    ![](img/192b6e55337adc00931f510ecaaf8e05_26_0.png)


    Build mode interface


    5. The brackets you see in the middle of the preceding screenshot are the target
    that the camera moves towards. To navigate inside Lumion, we need to use the following
    keys:


    +   - The Up arrow key / W: This moves the camera forward

    +   - The Down arrow key / S: This moves the camera backward

    +   - The Left arrow key / A: This moves the camera left

    +   - The Right arrow key / D: This moves the camera right

    +   - Q: This moves the camera up

    +   - E: This moves the camera down

    +   - Shift + W/S/A/D/Q/E: This doubles the camera speed

    +   - Space bar + W/S/A/D/Q/E: This slows down the camera

    +   - Shift + Space bar + W/S/A/D/Q/E: This makes the speed of the camera very
    high

    +   - The right mouse button + movement of the mouse: This helps you look around'
