  - '[PAGE 32]


    # What is Lumion?


    For example, we imported our model, but we notice that something is wrong, such
    as the normal face is in the wrong direction. We can change that with our 3D application,
    and then export our model. But instead of importing and consequently adding the
    materials again, we just need to click on the Reload button. Lumion reimports
    the model and applies all the changes we made, including the materials. Now, let''s
    have a look at the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_32_0.png)


    The mouse is over the Glass material and you can see that Lumion tells you where
    this material is applied


    Another useful feature is that when we put the mouse over the thumbnail with the
    material we already applied, Lumion automatically shows where this material is
    applied. In this case, I selected the Glass material and it is showing me where
    this material is applied.'
  - '[PAGE 33]


    # # Controlling the weather


    After applying the materials, we are now going to change some settings on the
    **Weather** menu. Click on the **Weather** button and explore how you can change
    the Sun''s direction and height. Try to achieve some different moods, such as
    a sunny day, a sunset, or a beautiful night. The other two settings allow us to
    change the quantity of clouds in the sky and the Sun''s intensity. Finally, the
    button with a cloud lets us change the type of clouds. The following screenshot
    shows us these options:


    ![](img/192b6e55337adc00931f510ecaaf8e05_33_0.png)


    The Weather menu with the different settings: 1 – Sun direction, 2 – Sun Height,
    3 – Amount of clouds, 4 – Sun brightness, 5 – Type of clouds


    I am going to set the environment for a nice sunny day and add some clouds. We
    can choose from nine types of beautiful skies.


    # ## Changing the landscape


    Looking at this example, we see that the terrain needs some work. It is too flat
    and it wouldn''t hurt if you changed the terrain and added some hills. To change
    that, we select the **Landscape Editor**. We have a set of tools at our disposal
    that help us to sculpt our terrain easily, as we can see in the following screenshot.
    We can raise, lower, flatten, jitter, or smoothen our terrain. As you can see
    in the following screenshot, I have the **Lower** tool selected:


    ![](img/192b6e55337adc00931f510ecaaf8e05_33_1.png)


    You can find the following options in the Landscape Editor: 1 – Height menu, 2
    – Water menu, 3 – Ocean menu, 4 – Color menu, 5 – Terrain menu, 6 – Raise brush,
    7 – Lower brush, 8 – Flatten brush, 9 – Jitter brush, 10 – Smooth brush, 11 –
    Brush speed, 12 – Brush size, 13 – Choose Landscape'
