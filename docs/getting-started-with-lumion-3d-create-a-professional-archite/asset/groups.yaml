  mdcn: '

    使用 3ds Max 时，以下插件和脚本非常有用：


    - **Floor Generator（地板生成器）：** 提供脚本，帮助你创建地板。

    - **Bookmanager 1.0（图书管理器）：** 有助于将书籍直接放置在真实的书架多边形上。

    - **MultiTexture 和 UniqueMaterialID：** MultiTexture 是一个插件，可加载多个纹理并按对象或材质 ID 随机分配它们。UniqueMaterialID
    是一个脚本，用于为对象内的每个元素分配唯一的材质 ID。

    - **Rock Generator（岩石生成器）：** 这是一个用于制作和实时环境的程序化岩石生成脚本。


    对于 Maya，你可以看看以下这些：


    - **1 Click Procedural Rock Generator：** 这是一个程序化岩石生成器。

    - **Ninja Dojo（黑带）5.5.0：** 包含多种建模工具。

    - **StairsCreator v3.0 3.0.0：** 用于创建楼梯。

    - **ArchiTool 0.8：** 提供一系列不同的工具。


    ## 添加细节


    如果你想让图像具有高度的真实感，其中很大一部分与细节处理有关。下面的截图展示了一个注重细节的示例：


    ![](img/192b6e55337adc00931f510ecaaf8e05_54_0.png)


    一些细节的特写，例如倒角边缘和高度不同的独立瓷砖


    正如你所看到的，我花了时间为这个地板创建独立的瓷砖，这可能很难察觉，但每块瓷砖的高度都各不相同；每块瓷砖之间都有缝隙，而且它们并非完全对齐。你能看出使用法线贴图与直接建模瓷砖之间的区别吗？使用法线贴图可以获得非常不错的效果，但花时间添加这样的细节会带来天壤之别。如果你想知道什么是法线贴图，我们将在*第3章，创建材质*中学习。


    ## 使用附加模型


    添加细节的另一个例子是使用对象填充场景。同样，一个优秀场景的秘诀在于它所包含的细节和对象的数量。Lumion 在这方面做得非常好，所以如果你没有庞大的模型库，也不必过于担心，因为我们可以利用
    Lumion 的模型库。提醒一下，在 Lumion 中，你可以使用电子产品、食品、室内灯具、管道设备、椅子、沙发、橱柜、桌子以及许多此类物品。


    但同样，只有使用 Lumion Pro 时，你才能访问所有模型。所以，如果你没有 Lumion Pro 和丰富的模型库，你仍然可以免费获得一些。以下是一些可以找到免费和付费模型的网站列表：


    - **Creative Crash：** 可在 `http://www.creativecrash.com/marketplace/3d-models`
    获取

    - **3D Cafe：** 可在 `http://www.3dcafe.com` 找到（但你需要先分享一些模型才能下载）

    - **Archive 3D：** 可在 `www.archive3d.net` 下载

    - **Mr. Cad：** 可在 `www.mr-cad.com` 获取

    - **3Delicious：** 可在 `www.3delicious.net` 获取

    - **TurboSquid：** 可在 `www.turbosquid.com` 找到

    - **Resources Blogscopia：** 可在 `www.resources.blogscopia.com` 获取

    - **SketchUp Warehouse：** 可在 `http://sketchup.google.com/3dwarehouse/?hl=en` 下载


    下面的截图包含了一些我将在场景中使用的模型：


    ![](img/192b6e55337adc00931f510ecaaf8e05_56_0.png)


    其中一些模型包括巴塞罗那椅和巴塞罗那沙发床


    ## 材质的重要性


    现在，你可能想知道材质与建模有什么关系？我在这里介绍这个话题的原因是，Lumion 是使用模型中现有的材质来工作的。让我来解释一下。你刚刚完成了建模，添加了令人惊叹的细节，一切都准备就绪。于是你导出
    3D 模型并将其导入 Lumion，而且由于你已经学会了如何在 Lumion 中添加材质，你开始尝试，但出了问题，如下面的截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_56_1.png)


    这是 Lumion 只允许我们为整个模型添加一种材质的示例


    当你尝试添加材质时，你会意识到 Lumion 会将材质应用于整个模型。为什么？这是因为当我们在 SketchUp 或任何其他 3D 应用中建模时，每次我们创建对象都会使用默认材质。在
    SketchUp 中，默认材质是**默认（Default）**，在 Maya 中是**朗伯（Lambert）**，在 3ds Max 中是**布林（Blinn）**。


    这就是为什么在建模时，将我们知道会共享相同材质的对象分组非常重要，然后在最后阶段，为每个组添加不同的材质。这不需要很花哨；只需使用相同的材质并重命名即可。


    ## 常见问题


    建模时可能会遇到一些问题。在这里，我们将看到最常见的问题及其解决方法。


    首先可能发生的问题是面丢失。请看下面的图：


    ![](img/192b6e55337adc00931f510ecaaf8e05_57_0.png)


    你能看出 SketchUp 模型和 Lumion 模型之间的区别吗？我相信你很容易发现有一个面丢失了。发生这种情况的原因是这个面朝向内部而不是朝向外部，如果你看一下
    SketchUp 模型，你会注意到这个面的颜色不同。这是 SketchUp 在告诉我们：看，这个面指向了错误的方向。我们如何解决这个问题？


    ## 准备场景


    使用 SketchUp 时，请执行以下步骤：


    - 1. 右键单击该面。

    - 2. 选择**反转面（Reverse Faces）**。


    使用 Maya 时，请执行以下步骤：


    - 1. 按*F3*选择**多边形（Polygons）**菜单。

    - 2. 点击**法线（Normals）**菜单，然后点击**反转（Reverse）**（你可能需要先选择一个特定的面）。


    使用 3ds Max 时，请执行以下步骤：


    - 1. 选择一个或多个面。

    - 2. 从修改器列表中选择**法线（Normal）**，以规范化你选择的面。


    导入模型后可能发生的第二个问题是，你可能看不到模型。要解决此问题，你可能需要首先检查模型是否位于原点轴上，如果这不起作用，请检查模型的缩放比例。


    另一个问题是，你无法将 Lumion 材质分配给单个表面。还记得前面的主题吗？Lumion 会合并使用相同材质的表面，如果你想在某个或某些特定表面上使用 Lumion
    材质，你需要在导出模型之前为该表面分配一个唯一的材质。


    最后，如果你在使用 COLLADA 文件时遇到问题，请检查你是否拥有最新版本的 COLLADA。你在使用 Revit 的 COLLADA 插件时可能会遇到一些问题，但通常一旦升级到最新版本，这些问题就会解决。


    ## 总结


    在本章中，你学习了如何准备 CAD 图形，使其可以轻松导入到任何应用中作为建模的基础。你发现了为模型添加细节的重要性，以及这如何有助于提高真实感。你发现了一些可以找到免费和付费模型的地方，最后，还学习了一些常见的建模陷阱以及如何避免它们。花时间确保对象具有良好的几何结构和细节非常重要。当然，每个项目都是不同的。在大型项目中，我们需要对几何体进行良好的管理，以免冒着创建过重场景的风险。在下一章中，你将学习如何在
    Lumion 中创建材质，以及如何使用 Photoshop 或 Gimp 创建自己的纹理。


    ## 3

    ### 创建材质


    现在你已经在 Lumion 中准备好了你的 3D 模型，是时候使用材质和纹理为它注入一些生命力了。本章旨在帮助你在 Lumion 中开始使用材质，并通过理解不同的设置来学习如何配置它们。不仅如此，在这里你还可以找到一些帮助和技巧，以便你可以使用纹理创建材质，进行必要的调整，并在
    Lumion 中使用它们。


    在本章中，我们将学习以下内容：


    - 如何使用 Lumion 材质？

    - 调整 Lumion 材质

    - 什么是纹理贴图？

    - 在哪里可以找到用于纹理的图像？

    - 什么是无缝纹理、Alpha 通道和法线贴图？


    是时候采取另一个重要步骤了：为我们的 3D 模型创建和添加材质。材质是创建令人惊艳的图像或出色视频的重要助手和关键方面。当我们创建材质时，我们是在*告诉*
    Lumion 我们希望那个或那些表面如何与光发生作用。因此，创建材质是调整参数以定义表面如何对光作出反应，以及添加纹理和其他细节的过程。

    '
