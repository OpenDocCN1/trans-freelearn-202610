  - '[PAGE 4]


    # About the Author


    **Ciro Cardoso** is a Portuguese 3D artist who has successfully used Lumion for
    multimillion-dollar projects. He was bit by the AutoCAD bug in 2000 and has been
    producing 3D graphics for professional organizations and companies since 2005.
    His list of personal clients covers countries such as the United Kingdom, Portugal,
    the Netherlands, and Africa with numerous projects ranging from graphic design
    work to 3D visualizations.


    Besides his work as a 3D artist, he also does voluntary work teaching SketchUp
    and CAD to youngsters. He can be reached through his website at `http://www.cirocardoso.net`.


    > > I would like to thank my dear wife, Miriam, for her unfailing support during
    the writing of this book. I would particularly like to acknowledge Neha Nagwekar
    for being very supportive throughout this project.'
  - '[PAGE 5]


    # About the Reviewer


    **Mirivano Carrig** spent five years studying civil engineering at AIT in Ireland.
    Along with having a keen interest in it, he also shares a great passion for architecture
    and art. Over the years, he has received numerous awards for his work related
    to civil engineering. In 2012, he set up a blog/ website called Vano Engineering,
    which can be viewed at `http://vanoengineering.wordpress.com`, and in its first
    year, it gained over 15,000 views and has been growing ever since.


    He is most noted for his *thinking outside the box* approach when it comes to
    designs, both architectural and engineering; combining his experience in drawing
    and art with his flair and understanding of structures.


    > I would like to thank my father for all his support, motivation, kind words,
    and words of wisdom, but most of all for always being there! Thank you.'
