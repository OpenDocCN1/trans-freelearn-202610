- raw:
  - '[PAGE 34]


    Let''s use the **Raise** and **Lower** options to add some variety to our scene.
    On the right-hand side, we can change the brush opacity and size. Actually, Lumion
    calls the first option speed, but in reality we are changing the opacity. It is
    the same principle that we find in Photoshop. If you have a graphics tablet, it
    is easier to sculpt the terrain because you have a better control; but don''t
    worry, most of the times I use the mouse to work.


    By the way, did I tell you that you can use a height map to do all this work for
    you? We are going to learn how to do that later in this book; but yes we can use
    a height map and Lumion will convert that information to a landscape. Let''s turn
    our attention to the terrain. Using our left mouse button, click where we want
    to raise or lower the terrain. Lumion also introduces the opportunity to undo
    our changes. So, just to have some variety, we changed the landscape with a few
    pushes and pulls.


    A useful setting that we have with this menu is the opportunity to change not
    the entire terrain, but individual elements. So, let''s say we are happy with
    our scene, but we feel that the grass should be greener or there should be a different
    kind of grass. If you notice, we have a **Color** menu below the **Height** menu.
    Click on this menu to access the four thumbnails representing each element of
    our scene, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_34_0.png)


    The Color menu


    Clicking on each arrow will give you access to 42 different textures. If not,
    you can also import one of your own textures. Or if you want, change the entire
    landscape by clicking on the thumbnail with the mountains and select a preset
    from the 20 available ones.


    Now, let''s add some water. Next to the **Height** button, we have two more buttons.
    Click on the **Water** button (the one with a single wave). On the right-hand
    side, we have a thumbnail that will allow us to choose between six types of water:
    **Ocean**, **Tropical**, **Pond**, **Mountain**, **Dirt**, and **Ice**.'
  - '[PAGE 35]


    <!-- no content -->'
  - '[PAGE 36]


    Here is where the fun starts. We have at our disposal eight categories of objects
    and more, such as **Nature**, **Transport**, **Sound**, **Effects**, **Indoor**,
    **People and Animals**, **Outdoor**, and **Lights and special objects**. Each
    of these menus has subcategories. If you are working with the Lumion PRO version,
    you can choose from more than 2000 models. Even if you don''t have this version,
    cheer up! You can still import your own models and textures. You need to follow
    the same steps that we did to import the house.


    It is really simple to add a model. First, we need to select the category we want
    to use. So in this case, click on the **Nature** button. Now that we have this
    category selected, click on the thumbnail above the **Place** button and a new
    window with the Nature library will appear.


    We don''t have just trees, we have grass, plants, flowers, rocks, and clusters.
    Now let me show you one trick. Click on the **Grass** tab and select **Rough_Grass1_RT**.
    Now that we are back to the Build mode, press the **Ctrl** key and click on the
    ground. We are randomly adding 10 copies of the object, which in this case is
    really handy. So, after playing a little with Lumion, we can get something like
    the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_36_0.png)'
  - '[PAGE 37]


    Just think, it took me about 30 minutes to create something like this. Now imagine
    what you can do. Let''s save our scene and turn our attention to the right-hand
    side of the Lumion 3D interface, where we can find the menus as shown in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_37_0.png)


    The Build mode button


    Starting from the top of the preceding screenshot we can see the blue rectangle
    with a question mark. If we put our mouse cursor over this rectangle, we can see
    a quick help guideline for our interface.


    The next button informs us that we are in the Build mode and if, for example,
    you are working in the Photo or Video mode, this button lets you go back to the
    scene.'
  - '[PAGE 38]


    # The Photo mode


    So, if you click on the button with a camera (which is called **Photo**), our
    interface will change to the **Photo** mode, which in my case is something like
    the following:


    ![](img/192b6e55337adc00931f510ecaaf8e05_38_0.png)


    The Photo mode interface: 1 - New effect, 2 - Copy effect, 3 - Build mode with
    effects


    Here, we can render and export our still images. But before that, we can add a
    lot of effects. We can add some **Depth of Field** and **Vignette**, or perhaps
    you want to set up a scene with rain or snow. Go ahead and try the different effects.
    To do that, click on the **Effects** button on the top-left corner.


    Another cool feature that Lumion has is the possibility to have our Build mode
    with the effects applied. So, let''s say I want to show my scene with some rain,
    I add that effect and then click on the **Build with effects** button.'
  - '[PAGE 39]


    At the top of your screen can you see the 10 thumbnails with a camera on it? In
    the preceding screenshot, one of these thumbnails is filled with an image. This
    is another great feature. So, let''s say that we are working on our scene, we
    adjust the camera and we love it—perfect angle and composition. Now, it would
    be really good if we could save this camera viewpoint. Well, we can save camera
    viewpoints by pressing Ctrl + 1. We may notice a temporary change in the interface,
    and if your sound is on, you will hear a sound too. This is our camera viewpoint
    being saved. So, later when we go back to the Photo menu, we have this camera
    viewpoint saved. Go ahead and try more camera angles and save them by using Ctrl
    and any number between 0 and 9, and then try Shift and any number between 0 and
    9.


    Finally, adjust the Focal length if you want, and then we can export our image.
    We have four sizes available, as you can see in the preceding screenshot. The
    formats available are JPG, BMP, DDS, PNG, and TGA.


    # The Movie mode


    However, the Lumion potential is not only in the Photo mode. In reality, the best
    potential of Lumion is the speed at which we can create stunning videos. So let''s
    move to the Movie mode. When you change to this menu, this is the main interface
    is shown as follows:


    ![](img/192b6e55337adc00931f510ecaaf8e05_39_0.png)


    The Movie mode interface: 1 - Entire movie, 2 - Import a movie from file, 3 -
    Import an image, 4 - Record


    Remember when I told you that the Lumion interface is intuitive and friendly?
    This section is an example of that. You can create a movie in the simplest and
    easiest way possible.'
  - '[PAGE 40]


    # What is Lumion?


    At the bottom of the preceding screenshot we can see nine clips. Each clip can
    store a small animation, or if you want, the entire movie. Lumion also gives you
    the possibility of importing an image or a video. So, perhaps we want to start
    our video by showing our logo; we don''t need to do this in another application.
    Just import what you need and add it to your movie. To do this, click on the second
    button to import an image or the third to import a movie. Now, let''s start creating
    an animation. Click on the first button that has a camera icon, as you can see
    in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_40_0.png)


    The Record menu: 1 – Play the movie, 2 – Clip speed, 3 – Take a photo, 4 – Go
    back to the Movie mode


    The way it works, as I told you, is really simple. Do you see the button with
    a camera? Click to start your first shot. Then move the camera slightly to another
    angle and click again, and repeat until you are satisfied. After that, click on
    the play button to see how your animation looks:


    > Remember that I told you to save a camera viewpoint using the Ctrl key plus
    a number key from 0 to 9? Using the Shift key plus a number key from 0 to 9 will
    load the saved viewpoints. You can use that shortcut in this mode too.'
  - '[PAGE 41]


    Another useful feature that Lumion allows is speeding up or slowing down your
    clip. On the left-hand side, you have a slider that allows you to increase or
    decrease the speed. When you are happy with your animation, click on the **OK**
    button and that''s it. Congratulations, you have created your first animation.
    Now, the Movie interface changes as shown in the following screenshot!


    ![](img/192b6e55337adc00931f510ecaaf8e05_41_0.png)


    The Movie menu interface with the clip we just created: 1 – Edit clip, 2 – New
    effect, 3 – Copy, 4 – Build with effects, 5 – Play, 6 – Save movie


    Now, we can edit the clip again if needed. Click on the clip and we have two buttons
    inside it: one that allows us to go back and edit the clip, and the other to delete
    it. This is not the only way to do it. If you look at the top-left corner, we
    have four new buttons:


    +   - **Edit Clip:** It leads you back to the menu where we can edit the clip.

    +   - **New effect:** It adds effects to the clip without affecting the entire
    movie.

    +   - **Copy:** We need to have an effect applied to the clip so that we can copy
    this effect and paste it in another clip.

    +   - **Paste:** Yes, I know I said four buttons, but this one only appears if
    we copy an effect. It allows us to paste the effect in another clip or on the
    entire movie.

    +   - **Build with effects:** Enable this option to see the effects applied on
    the build mode.'
