  - '[PAGE 119]


    # # Applying lens effects


    Let''s add a little touch of reality, and one way we can do that is by adding
    a subtle **chromatic aberration** to our image. Chromatic aberration is caused
    by lens dispersion with different colors of light travelling at different speeds
    while passing through a lens. So, when you take a photo, the photo can look blurred
    or colored edges can appear around objects. That''s the trick to achieve a realistic
    look and add imperfections. How can you add chromatic aberration in Photoshop?


    # ## Chromatic aberration with Photoshop


    Again, create a copy of the CC group, right-click on the group, and select **Merge
    the group**. Now, we have an image with color correction applied to it, and we
    can move this layer to a new group called `Lens`. Make a copy of this layer and
    go to the **Filter** menu, click on the **Distort** option, and select **Lens
    Correction**.


    ![](img/192b6e55337adc00931f510ecaaf8e05_119_0.png)


    These are the settings that I am using to add some Chromatic Aberration


    Adjust the **Fix Red / Cyan Fringe** value, but be really subtle. We don''t want
    the viewer to notice this effect. People are unconsciously used to seeing this
    kind of a lens error, and a subtle touch helps remove the CG feel and make something
    appear more realistic. The reason I told you to add this effect on another layer
    is that you can now adjust the **Fill** slider and see what value makes the image
    look good.'
  - '[PAGE 120]


    # A little bit of sharpness


    Next in line, we add some sharpness to our image. It is the same procedure; create
    a copy of the group, merge, and you know the rest. This group will be called Sharpness.
    Again, create a copy of the layer, and go to the Layer menu, click on the Sharpen
    option, and select the Sharpen filter. Now, that''s a big change and we don''t
    want that. So, use the Fill slider again to adjust how sharp you want your image
    to be.


    # Depth of field


    Now, we are going to add some depth of field and for that, we need the depthmap
    exported from Lumion. Create a group with the previously merged group, duplicate
    that layer, and rename it as DOF. The next thing that we need to do is copy the
    sky alpha map using the combination of Ctrl + A to select the entire layer and
    Ctrl + C to copy. Now that we have the sky alpha map in memory, we go back to
    the DOF layer and add a layer mask. When we do this, the mask preview is created
    next to the layer, and we can access this layer by pressing the Alt key and clicking
    on it with the left mouse button. Our screen turns white, and we use the combination
    of Ctrl + V to paste the sky alpha map, and Ctrl + D to deselect it. After that,
    click on the DOF layer and select Lens Blur... on the Filter menu under Blur.


    ![](img/192b6e55337adc00931f510ecaaf8e05_120_0.png)


    These are the settings that I am using to add some depth of field'
  - '[PAGE 121]


    Use the **More Accurate** option and in **Depth Map**, select **Layer Mask**.
    Then, you need to adjust the **Blur Focal Distance** and see which value suits
    you the most. Click on the **OK** button and right-click on the layer mask and
    choose **Delete Layer Mask**. Again, we can use the **Fill** slider to adjust
    the amount of Depth of Field that we want in our image.


    # Final touch with noise and vignette


    After copying and merging the DOF group, we create just one more group called,
    for example, `Final`. On top of this last layer, we create an empty layer called
    `noise`, and to do that, we can use the combination of *Shift + Ctrl + N*. Select
    this new layer, press *Shift + F5*, and choose **50% of Gray**. Then, go to the
    **Filter** menu and select **Add Noise** under the **Noise** option. For the **Amount**
    value, use a really low value such as **2%** or **3%** and click on the **OK**
    button. Now, we need to set the blending mode for this layer to **Overlay** to
    have some noise in our image.


    Finally, create another layer called `Vignette` and fill it with white color.
    Select this layer and go to **Filter** and select **Lens Correction** under the
    **Distort** menu.


    ![](img/192b6e55337adc00931f510ecaaf8e05_121_0.png)'
  - '[PAGE 122]


    Under the **Vignette** field, change the **Amount** value to negative so that
    you can get some dark corners. Click on the **OK** button and set the blending
    mode of this layer to **Multiply**, and see the results, as shown in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_122_0.png)


    Our final image with all the post production


    And finally, our image is ready. After all this hard work, it is easy to spot
    the difference between the final image and the image without any post production,
    which is shown as follows:.


    ![](img/192b6e55337adc00931f510ecaaf8e05_122_1.png)


    Our initial render without any post production'
  - '[PAGE 123]


    # Summary


    This was a really fun chapter and you learned so much. You learned how to do some
    basic post production on your images using the different render passes that Lumion
    exports along with the main image. After using the specular, material ID, lighting,
    and sky alpha maps, you learned how to add some lens effects to your final image.
    However, this is just a really basic how-to chapter, and I really encourage you
    to learn more; learn different techniques and how you can save time using post
    production.'
