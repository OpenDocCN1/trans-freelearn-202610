- raw:
  - '[PAGE 15]


    # # What is Lumion?


    Lumion is a powerful, easy, fun-to-use, effective architectural visualization
    tool that allows anyone to build a 3D environment and then create beautiful images,
    impressive video presentations, and live walkthroughs. It is the fastest way to
    pick up your 3D model and create a scene in a matter of minutes. This chapter
    will help you to know Lumion better and with a quick start you will be using Lumion
    immediately.


    In this chapter we will cover the following topics:


    +   - Why use Lumion?

    +   - What can we get from Lumion?

    +   - Differences between the versions

    +   - Import formats

    +   - Workstation specifications

    +   - Lumion''s interface

    +   - Navigation inside Lumion

    +   - Working with Lumion


    This chapter is a very general overview of Lumion. I promise to try to not bore
    you with too much background information, but you will come to know about what
    the software is supposed to let you do, how it compares to other 3D alternatives,
    and where everything is.'
  - '[PAGE 16]


    # What is Lumion?


    # # Lumion background


    At first, let''s discuss a brief history of Lumion. Act-3D is the company that
    develops Lumion, and it is possible that you may know them from Quest3D and several
    other projects that they were involved with. However, Act-3D realized that numerous
    customers were employing Quest3D to produce architectural visualisations. It was
    a difficult task since Quest3D is not exactly the best tool for creating such
    things. In fact, using Quest3D is not a simple task; you almost need to be a Guru
    to create something. Eventually, Act-3D decided to develop a whole new piece of
    software keeping these customers in mind. And then, Lumion was born with the power
    of a real-time visualization tool, but at the same time it was accessible to everyone.


    # # Why use Lumion?


    The short answer is that Lumion is easy to use and the final product is of a good
    quality. The long answer is that every construction project needs technical drawings
    and documents. Although this technical information is fine for a construction
    crew, usually the client has no idea what a CAD plan means. They can have an idea
    where the kitchen or the living room will be, but translating that 2D information
    to 3D is not always easy in the client''s mind. This can be an issue if we need
    to give a presentation or if we are trying to sell something that is not built
    yet. And truth be told, an image sells more than words. That''s where Lumion comes
    in. Lumion is the fastest way to render high quality still pictures and videos,
    and it makes it so easy to import our 3D models from any 3D modeling software,
    such as SketchUp, AutoCAD, Revit, ArchiCAD, and 3ds Max, and create a scene in
    minutes. So, Lumion 3D is a distinct architectural visualisation software not
    only because it is faster to render, but also because it is very user friendly
    and intuitive.


    Another reason why we can use Lumion to create architectural visualizations is
    because we can have a great idea of how our project will look in natural surroundings
    at any time of the day or season, and this in just a few minutes. Now if you are
    an architect, it is doubtless that you want to enhance your project characteristics
    in the best way possible. Lumion can help you achieve this in hours instead of
    the inevitable days and weeks of rendering time.'
  - '[PAGE 17]


    <!-- no content -->'
  - "[PAGE 18]\n\n# What is Lumion?\n\nNevertheless, we can get so much from this\
    \ application that you will forget photo-realistic renders. Lumion is a powerful\
    \ and advanced 3D engine that allows us to work with heavier models, and we can\
    \ make our scene come alive with the click-and-drag technique.\n\nTo do this,\
    \ Lumion comes with a massive library where we can find:\n\n+   - 2409 models\
    \ of trees, transports, exterior and interior models, and people\n+   - 103 ambient,\
    \ people, and machine sounds\n+   - 518 types of materials and textures\n+   -\
    \ 28 types of landscape\n\nIn addition to this extensive collection, there are\
    \ more features that we can add; we can include realistic water in our scene (oceans,\
    \ rivers, pools, waterfalls, and fountains), we can sculpt the landscape to adapt\
    \ to our needs, and we can add rain, snow, fog, wind, and animate objects, and\
    \ we can add camera effects.\n\nYou just need a blank 3D model; import and start\
    \ working because, as you can see, Lumion is well equipped with almost everything\
    \ we need to create architectural visualisations.\n\n# Differences between the\
    \ several versions of Lumion\n\nLumion is available in different editions. Let's\
    \ start from the most basic, which is **Lumion Free**. This version is just to\
    \ analyze if Lumion is in fact what we need. Lumion Free is not for commercial\
    \ use and the final output will have a watermark with the Lumion logo. We will\
    \ have access to some models and features, but not the entire collection.\n\n\
    ![](img/192b6e55337adc00931f510ecaaf8e05_18_0.png)\n\n> To download the latest\
    \ version of Lumion Free use this link:\n> \n> http://lumion3d.com/free/.\n> \n\
    > If you are a school, college, or educational institution, use **Lumion Educational**\
    \ or buy **Lumion Pro**. Again, there are some restrictions in what you can get\
    \ with each version. To learn more about Lumion Educational licenses, visit the\
    \ following link:\n> \n> http://lumion3d.com/educational/."
  - '[PAGE 19]


    Then, we have the paid versions. There are two options: **Lumion** and **Lumion
    Pro**. Lumion is a standard version with most of the features and content. Lumion
    PRO is the most ideal version for professional studios as you have access to all
    the features and content. With Lumion PRO, we can get more than 2000 models, 3D
    sound effects, and animated characters. If we have a previous version such as
    Lumion 3D Version 2, the cost of upgrade is lower when compared to other applications
    – a good point in favor of Lumion over other applications.


    # Importing our 3D models


    The import workflow while using Lumion is excellent. We can import a 3D model
    along with textures, and our model is ready to render if we want to. Another useful
    feature is the ability to update a model. We make the changes we need to do, export
    and save with the same name, that is, we overwrite the model. Then, Lumion handles
    this situation with a single reload button. So, Lumion will reimport the model
    and reapply the same materials.


    Lumion supports many formats, such as the following:


    +   - 3D formats:

    +     - **Autodesk RealDWG:** *.dxf

    +     - **Autodesk RealDWG:** *.dwg

    +     - **COLLADA file:** *.dae

    +     - **FBX file:** *.fbx

    +     - **Max file:** *.max

    +     - **3ds file:** *.3ds

    +     - **Obj file:** *.obj

    +     - **SketchUp file:** *.skp

    +   - 2D formats:

    +     - **Windows Bitmap:** *.bmp

    +     - **Joint Photographic Experts Group:** *.jpg

    +     - **Truevision:** *.tga

    +     - **DirectDraw Surface:** *.dds

    +     - **Portable Network Graphics:** *.png

    +     - **Photoshop:** *.psd

    +     - **Tagged Image File Format:** *.tiff

    +     - **High Dynamic Range:** *.hdr'
  - '[PAGE 20]


    # What is Lumion?


    +   - Video formats:

    +     - **MPEG-4 Part 14:** `*.mp4`


    Lumion also allows us to import, move, rotate, and scale animations. The frame
    rate needs to be set to 25 FPS, and Lumion will work better with an FBX file.


    It is not possible to import vertex animations, morph animations, or bone-based
    animations in Lumion. We can import animations by using FBX files as long as these
    animations are just on the move, rotate, and scale values. If you use Revit, Act-3D
    has developed a COLLADA exporter plugin for Revit that you can download for free.


    # # Workstation specifications


    We need a good workstation to work with Lumion. There are a few essential requirements
    but don''t be too concerned about this. Why? Let me give you an example: the recommended
    system memory is 6 GB, but I did a few projects just using 4 GB. Download Lumion
    Free and see if your workstation can handle it. Lumion brings a few examples with
    it, which can help you evaluate this.


    Lumion recommends the following minimum requirements:


    +   - **OS:** Windows XP, Vista, 7, 8 (32- and 64-bit) and DirectX 9.0c or later

    +   - **System memory:** 3 GB

    +   - **Graphics card:** NVIDIA GeForce GTS 450 or ATI/AMD Radeon HD 4890, with
    at least 1 GB dedicated memory (not shared system memory)


    But the following are required to get the maximum performance:


    +   - **OS:** Windows 7, 8 (64 bit)

    +   - **System memory:** 6 GB

    +   - **Graphics card:** NVIDIA GTX 680 or AMD Radeon HD 7970 or faster, with
    at least 2 GB dedicated memory (not shared system memory)'
