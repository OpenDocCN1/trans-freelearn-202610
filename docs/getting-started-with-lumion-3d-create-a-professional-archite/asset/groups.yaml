    # What is Lumion?


    After that, we need to click on the plus icon and select something in our model.
    As soon we do that, a menu with all the materials will appear on the left-hand
    side. In my case, I will select the floor; and just to show you how it works,
    I will choose the material **Concrete_025_1024** and see how it looks. The following
    screenshot shows this material applied on the exterior floor:


    ![](img/192b6e55337adc00931f510ecaaf8e05_30_0.png)


    At the bottom, you can see the materials applied to your 3D model. and the Add
    material button is highlighted.


    Although adding a material is really simple, Lumion allows a really good control
    over the materials. You can see this in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_30_1.png)


    These are the settings you can use to tweak the material in a way that suits your
