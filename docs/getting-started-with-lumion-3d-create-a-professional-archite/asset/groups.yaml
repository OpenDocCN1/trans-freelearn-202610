    让我们使用**抬高**和**降低**选项来为场景增添一些变化。在右侧，我们可以更改画笔的不透明度和大小。实际上，Lumion 将第一个选项称为速度，但本质上我们是在改变不透明度。这与我们在
    Photoshop 中看到的原理相同。如果你有数位板，由于控制更精细，塑造地形会更容易；但别担心，大多数时候我用鼠标工作。


    顺便问一句，我有没有告诉过你，你可以使用高度图来帮你完成所有这些工作？我们将在本书后面学习如何做到这一点；不过，是的，我们可以使用高度图，Lumion 会将该信息转换为地形。让我们把注意力转向地形。使用鼠标左键，点击我们要抬高或降低地形的位置。Lumion
    还提供了撤销更改的功能。所以，为了增加一些变化，我们通过几次推拉操作改变了地形。


    这个菜单中有一个有用的设置，可以更改单个元素，而不是整个地形。假设我们对场景很满意，但觉得草应该更绿，或者应该有不同种类的草。你会注意到，在**高度**菜单下方有一个**颜色**菜单。点击此菜单，即可访问代表场景中每个元素的四个缩略图，如下面的截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_34_0.png)


    颜色菜单


    点击每个箭头，你可以访问42种不同的纹理。如果没有，你也可以导入自己的纹理。或者，如果你愿意，可以点击带有山脉的缩略图来更改整个地形，并从20个可用预设中选择一个。


    现在，让我们添加一些水。在**高度**按钮旁边，还有两个按钮。点击**水**按钮（带有单个波浪的那个）。在右侧，有一个缩略图，可以让我们在六种类型的水之间选择：**海洋**、**热带**、**池塘**、**山地**、**泥土**和**冰**。


    这才是乐趣的开始。我们可以使用八类甚至更多的对象，例如**自然**、**交通**、**声音**、**特效**、**室内**、**人物与动物**、**室外**以及**灯光与特殊对象**。这些菜单中的每一个都有子类别。如果你使用的是
    Lumion PRO 版本，可以从2000多个模型中进行选择。即使没有这个版本，也别灰心！你仍然可以导入自己的模型和纹理。只需按照我们导入房屋时的相同步骤操作即可。


    添加模型非常简单。首先，我们需要选择要使用的类别。因此，在这种情况下，点击**自然**按钮。选中此类后，点击**放置**按钮上方的缩略图，将出现一个包含自然库的新窗口。


    我们不只有树木，还有草、植物、花卉、岩石和组合。现在，让我给你展示一个小技巧。点击**草**选项卡，选择**Rough_Grass1_RT**。返回构建模式后，按住**Ctrl**键并点击地面。我们将随机添加10个该对象的副本，在这种情况下非常方便。所以，稍微使用一下
    Lumion，我们就能得到类似下面截图的效果：


    ![](img/192b6e55337adc00931f510ecaaf8e05_36_0.png)


    试想一下，我花了大约30分钟才创建出这样的效果。现在想象一下你能做什么。让我们保存场景，然后把注意力转向 Lumion 3D 界面的右侧，在那里可以看到如下截图所示的菜单：


    ![](img/192b6e55337adc00931f510ecaaf8e05_37_0.png)


    构建模式按钮


    从上面截图的顶部开始，我们可以看到一个带有问号的蓝色矩形。如果将鼠标光标放在这个矩形上，就可以看到关于我们界面的快速帮助指南。


    下一个按钮告知我们当前处于构建模式；例如，如果你正在照片或视频模式下工作，这个按钮可以让你返回场景。


    ## 照片模式


    所以，如果你点击带相机的按钮（称为**照片**），我们的界面将切换到**照片**模式，就我而言，界面会像下面这样：


    ![](img/192b6e55337adc00931f510ecaaf8e05_38_0.png)


    照片模式界面：1 - 新效果，2 - 复制效果，3 - 带效果的构建模式


    在这里，我们可以渲染并导出静态图像。但在此之前，我们可以添加大量效果。我们可以添加一些**景深**和**暗角**，或者你可能想设置一个带有雨或雪的场景。尽管去尝试不同的效果吧。为此，请点击左上角的**效果**按钮。


    Lumion 的另一个很酷的功能是，它可以让我们的构建模式应用这些效果。比方说，我想让场景显示一些雨，添加该效果，然后点击**带效果构建**按钮。


    你能在屏幕顶部看到10个带有相机图标的缩略图吗？在上面的截图中，其中一个缩略图已经填充了图像。这是另一个很棒的功能。假设我们正在处理场景，调整好相机，而且非常喜欢——完美的角度和构图。现在，如果能保存这个相机视角就好了。事实上，我们可以按
    Ctrl + 1 保存相机视角。我们可能会注意到界面出现短暂的变化，如果你的声音开启，还会听到一声提示音。这就是相机视角正在被保存。因此，稍后当我们回到照片菜单时，这个相机视角就已经保存好了。继续尝试更多相机角度，使用
    Ctrl 加 0 到 9 之间的任意数字保存，然后再试试 Shift 加 0 到 9 之间的任意数字。


    最后，如果需要，调整焦距，然后就可以导出图像了。如上面截图所示，我们有四种尺寸可选。可用格式有 JPG、BMP、DDS、PNG 和 TGA。


    ## 电影模式


    然而，Lumion 的潜力并不仅限于照片模式。事实上，Lumion 最大的潜力在于它能快速创建令人惊艳的视频。所以，让我们进入电影模式。当你切换到这个菜单时，主界面显示如下：


    ![](img/192b6e55337adc00931f510ecaaf8e05_39_0.png)


    电影模式界面：1 - 整个影片，2 - 从文件导入影片，3 - 导入图像，4 - 录制


    还记得我说过 Lumion 界面直观友好吗？这一部分就是一个例证。你可以用最简单、最轻松的方式创建影片。


    在上面截图的底部，我们可以看到九个剪辑。每个剪辑可以存储一段小动画，或者如果你愿意，也可以存储整个影片。Lumion 还允许你导入图像或视频。所以，也许我们想在视频开头显示自己的标志；我们不需要在另一个应用程序中完成这件事。只需导入所需内容并添加到影片中即可。为此，点击第二个按钮导入图像，或点击第三个按钮导入影片。现在，让我们开始创建动画。点击第一个带有相机图标的按钮，如下面的截图所示：


    ![](img/192b6e55337adc00931f510ecaaf8e05_40_0.png)


    录制菜单：1 - 播放影片，2 - 剪辑速度，3 - 拍照，4 - 返回电影模式


    正如我告诉你的，它的工作原理非常简单。你看到带相机的按钮了吗？点击开始你的第一个镜头。然后稍微移动相机到另一个角度，再次点击，重复操作直到你满意为止。之后，点击播放按钮，看看你的动画效果如何：


    > 还记得我告诉过你，使用 Ctrl 键加数字键 0 到 9 可以保存相机视角吗？使用 Shift 键加数字键 0 到 9 可以加载已保存的视角。你也可以在此模式下使用该快捷键。


    Lumion 的另一个实用功能是，你可以加快或减慢剪辑速度。在左侧有一个滑块，可以增加或降低速度。当对动画满意后，点击**确定**按钮就可以了。恭喜，你已经创建了自己的第一个动画。现在，电影界面会变成如下截图所示！


    ![](img/192b6e55337adc00931f510ecaaf8e05_41_0.png)


    带有我们刚创建的剪辑的电影菜单界面：1 - 编辑剪辑，2 - 新效果，3 - 复制，4 - 带效果构建，5 - 播放，6 - 保存影片


    现在，如果需要，我们可以再次编辑剪辑。点击剪辑，里面有两个按钮：一个允许我们返回并编辑剪辑，另一个用于删除它。这并不是唯一的方法。如果查看左上角，我们会有四个新按钮：


    - **编辑剪辑：** 它会带你回到可以编辑剪辑的菜单。

    - **新效果：** 它会给剪辑添加效果，而不会影响整个影片。

    - **复制：** 我们需要在剪辑上应用一个效果，以便复制该效果并粘贴到另一个剪辑中。

    - **粘贴：** 是的，我知道我说了四个按钮，但这个按钮只有在复制效果后才会出现。它允许我们将效果粘贴到另一个剪辑或整个影片中。

    - **带效果构建：** 启用此选项，可在构建模式下查看已应用的效果。

    '
