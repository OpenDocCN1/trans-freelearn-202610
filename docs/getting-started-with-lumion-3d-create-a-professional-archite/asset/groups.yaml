    \ 3D 模型之前分析一些重要方面。一旦模型导出到 Lumion，我们将学习如何放置和调整模型。本章的编写目的是帮助你获得所需的一切，以便你无需延迟即可开始在\
    \ Lumion 中工作。\n\n在本章中，你将学习以下主题：\n\n- What is COLLADA?\n- Exporting from SketchUp\n\
