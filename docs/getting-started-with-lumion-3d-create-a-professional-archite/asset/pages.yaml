- pgno: 103
  md: '# Exporting an image with the Photo mode


    Let''s move to the Photo mode, apply some effects, and then export an image. On
    the right-hand side of the Lumion screen, click on the Photo mode icon, which
    is the one with the camera icon, as you can see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_103_0.png)


    Photo mode enabled with our first still image


    As you can see from the preceding screenshot, we have several settings to tweak,
    so, we will start with the effects. Click on the New effects icon at the top left-hand
    corner of the page characterized by stars and a plus sign to start adding effects.
    The effects available are the following:


    +   - World: Sun, Shadow, Contrails, Underwater, Global Illumination, and Reflection

    +   - Weather: Cloud, Fog, Rain, Snow, VolumeClouds, Folliage wind, and Horizon
    Cloud

    +   - Camera: Vignette, Depth of Field, Lens flare, Near Clip Plane, Fish eye,
    Handheld Camera, and Exposure

    +   - Style: Bloom, Overlay image, Noise, Sharpness, Selective saturation, Color
    correction, and Bleach

    +   - Artistic: God rays, Painting, Watercolor, Sketch, Manga, and Chromatic Aberrations'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Preparing the Render


    Lumion helps you get an idea of how the effect will look by showing you a thumbnail
    with the effect applied. The best way to learn what each effect does is by trying
    each one out. Not only will you have an idea of what you can get, but also easily
    recognize what your scene needs and how you can solve a particular problem by
    using an effect.


    The effects I most use in my scenes are as follows:


    +   - **Global Illumination**

    +   - **Foliage wind**

    +   - **Depth of Field**

    +   - **Chromatic Aberrations**


    There are a few things I would like to add, but only in post-production stages
    such as **Vignette**, **Color correction**, and **Bloom**. The reason why I do
    this is because if we apply these effects in Lumion and later if we want to go
    back and remove the effects, we need to export the image again. If we work with
    a nondestructive workflow, such as using layers in Photoshop or Gimp, we can easily
    add or remove these effects. There is also the option of copying the effects and
    pasting them in another clip, which is really helpful if we want to export several
    images with the same effects. If the small window that we have in the **Photo**
    mode is not enough to check the effects that we applied, **Build with effects**
    is a cool feature that allows you to go back to the **Build** mode with the effects
    applied.


    Finally, you can change the focal length that works like a zoom tool. If you need
    to move the camera more to the left or the right or change other settings, you
    don''t need to go back to the **Build** mode, adjust the camera, and save a new
    viewport. You just need to place the mouse over the window and use all the keyboard
    shortcuts to change the camera position.


    Now you are ready to export the final image. Lumion allows you to export four
    image resolutions using the following formats:


    +   - Windows Bitmap: *.bmp

    +   - Joint Photographic Experts Group: *.jpg

    +   - Truevision: *.tga

    +   - DirectDraw Surface: *.dds

    +   - Portable Network Graphics: *.png


    Before exporting the image, always check if everything is ready and whether or
    not you need to use the F8 key, to toggle on the spotlight shadow, and the U key,
    to update the reflection or cloud.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Creating a video with the Movie mode


    Let''s create a movie. Creating a movie in Lumion is really simple and intuitive.
    Click on the Movie icon to start creating a movie; the interface looks as shown
    in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_105_0.png)


    The Movie mode


    You can create individual clips of your movie by making use of this feature. There
    is nothing worse than Lumion starting to render the video and at the last minute,
    crashing or encountering a problem, resulting in you losing the video file. If
    you create an entire movie, you need to start all over again, but by using individual
    clips, you just need to start from the last clip. There are three options you
    can use to create your video by importing an image or video, but we want to focus
    our attention only on the first option and start creating an animation for it
    by clicking on the Record icon, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_105_1.png)


    Creating an individual clip'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Preparing the Render


    Click on the button with the camera icon to start your first shot, then move the
    camera and click again, and repeat until you are satisfied. After that, click
    on the **Play** icon to see how your animation looks. You can press *Shift* along
    with any number between 1 and 9 to load the saved viewports and use those viewports
    to create your movie.


    Another useful feature that Lumion has is the possibility to speed up or slow
    down your clip. On your left, you have a slider that allows you to increase or
    decrease the speed. When you are finally happy with your animation, click on the
    **Ok** button.


    Now, we can edit the clip again if needed. Select the clip, and above it we have
    two buttons, as you can see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_106_0.png)


    Selecting the clip to delete or edit it


    In the **Movie** mode, Lumion allows us to add effects to each clip and to the
    whole movie. This option is useful when we want to add, for example, a **Fade
    In** or **Fade Out** option to a specific clip, or change the **Depth of Field**
    value in another. I added some **Vignette** and **Fog** effects in the background.


    Add an effect to your entire video, instead of a single clip, by clicking on the
    **Entire Movie** icon, the one at the bottom left-hand corner characterized with
    the filmstrip. If we click on this icon, we go to another menu where we can edit
    the entire movie and add effects to the whole movie instead of doing so to individual
    clips. This is useful especially if you want to add the same effect to all the
    clips. Now, to export the movie, click on the **Save Movie** icon on the right-hand
    side; the one characterized with the movie take symbol.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'We can export in the **MP4** format, which has several options, such as **Quality**,
    **Frames per second**, and **Resolution**. But I recommend using the second option,
    **Images**, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_107_0.png)


    Exporting a set of images instead of an entire movie


    As you can see, you have the same options, plus the additional ones that allow
    you to export the render passes that you can use later in Photoshop or Gimp. I
    recommend using this option, because you can have more control later while using
    the video editor. The downside is that you need space to store so many images.


    The last option is to export a single image and one render pass. If you want to
    export just one image, it is best to use the **Frame range** option under the
    **Images** menu.


    # Summary


    In this chapter, you learned what composition is and how it can help us create
    a balanced and attractive image or video. You also learned how to use the rule
    of thirds and the framing concepts for it. Then, you learned more about the **Photo**
    mode and how to add different effects and tweak them. The final topic was about
    the movie mode, and in this section you learned how to create movies, add effects,
    and finally, how to save them using different outputs.


    In the next chapter, we will pick the movie or the image we exported and learn
    how we can improve the quality, make minor changes, and use the render passes
    exported.'
  merge: -1
  img_proc: true
