- pgno: 25
  md: 'So, let''s get started straightaway. The first thing we need is a 3D model,
    and I am going to use a 3D model of the famous Farnsworth House design by the
    architect Ludwig Mies Van der Rohe. This is just an example, so feel free to use
    any model you want to try. I modeled this house in SketchUp 8, which is one of
    the best solutions to do architectural modeling. But as you know already, you
    can use any 3D application as long as you can export to the format that Lumion
    supports. The following is the 3D model I am going to use:


    ![](img/192b6e55337adc00931f510ecaaf8e05_25_0.png)


    So the first thing we need to do is export our model. Using SketchUp follow these
    steps:


    +   1. Go to the menu and navigate to **File | Export | 3D Model....**

    +   2. In the window to export the model, choose **COLLADA File (*.dae)** as the
    export format. Then, click on the **Options...** button and select the following:

    +      - The **Triangulate All Faces** option

    +      - The **Preserve Component Hierarchies** option

    +      - The **Export Texture Maps** option

    +   3. If you are using other 3D software, go to *Chapter 4, Working with Lumion,*
    to get some help.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '4. After exporting, start Lumion and select the preset Sunny Day on the New
    tab. Lumion will open a scene with this preset. We are now in the Build mode that
    looks something like the following :


    ![](img/192b6e55337adc00931f510ecaaf8e05_26_0.png)


    Build mode interface


    5. The brackets you see in the middle of the preceding screenshot are the target
    that the camera moves towards. To navigate inside Lumion, we need to use the following
    keys:


    +   - The Up arrow key / W: This moves the camera forward

    +   - The Down arrow key / S: This moves the camera backward

    +   - The Left arrow key / A: This moves the camera left

    +   - The Right arrow key / D: This moves the camera right

    +   - Q: This moves the camera up

    +   - E: This moves the camera down

    +   - Shift + W/S/A/D/Q/E: This doubles the camera speed

    +   - Space bar + W/S/A/D/Q/E: This slows down the camera

    +   - Shift + Space bar + W/S/A/D/Q/E: This makes the speed of the camera very
    high

    +   - The right mouse button + movement of the mouse: This helps you look around'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   - **The middle mouse button + movement of the mouse**: Pan around the viewport

    +   - **Scrolling up/down using the mouse wheel**: This helps you to move in and
    out

    +   - *Ctrl + H*: This resets the camera pitch to the horizontal viewpoint

    +   - *O + the right mouse button*: This orbits the camera


    So, you can see how important it is to have a three-button mouse to help you navigate
    the camera in the editor. It is really important to learn and memorize these shortcuts
    to improve your workflow; not only when you are placing content, but also when
    you need to control the camera in the Photo and Movie modes.


    # Importing the model


    Now that we know how to navigate inside Lumion, let''s import a model. How can
    we do that? On the left-hand side, there is a square with a Sun; move your mouse
    there and three more squares will appear. The first one is for us to change the
    weather, the second one is for landscape, the third one is to import our models,
    and the last one is to add objects using the Lumion library.


    If we click on the **Import** button, the menu at the bottom will change as you
    can see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_27_0.png)


    The Import menu'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# What is Lumion?


    My interface may be different from yours. You may notice that I already have the
    model selected to import. This happens because Lumion always selects the last
    model you imported. To erase these files from the Import library, click twice
    on the thumbnail with the model. This will open a new window where we have all
    the models that are already imported. To delete the model, move your mouse cursor
    on top of the thumbnail and click twice on the trash bin icon.


    Go back to the Build mode by clicking on the small cross at the top-right corner.
    Click on the first button to import your model. When starting a Lumion project,
    it''s a good idea to set up your file structure first. Start with a main folder
    for the project and include subfolders inside. When you transport your project
    to another workstation, you can grab the whole folder to keep the hierarchy intact.


    The model I exported from SketchUp was saved in the Import folder and the SketchUp
    model was saved in the Assets folder. Select the file that you exported, but first
    you may need to choose the correct extension so that your model can be made visible.
    Once you click on **Open**, a small window will appear where we can change the
    name of our imported model and choose to import animations (if we have some).
    Click on **OK** to add the 3D model to the library.


    When we do this, a yellow bounding box will appear to help us insert our model
    in the correct place. If you can''t see the yellow bounding box, you may need
    to scroll using the mouse wheel to zoom out a little bit.


    > Don''t forget to use the O key and the right mouse button to orbit the camera.


    To place the model, click the left mouse button wherever you want to place it.
    Congratulations! You just imported your model.


    +   If you can''t see your model after importing and placing it in the scene,
    try this:

    +   - Place your model at 0,0,0 before exporting it.

    +   - Check the scale of your model.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Working with Layers


    Maybe you are thinking, "Oh, it would be really nice if I could organize my scene
    with Layers." Well, you can. At the top-left corner, can you see a number with
    a tiny eye? If we move our mouse there, the Layers menu will appear. Here is how
    it works:


    +   - To start a new layer, click on the plus icon

    +   - To set the current layer, click on the number that identifies each layer

    +   - To hide a layer, click on the eye

    +   - For labeling, change the layer name by typing it in the textbox


    ![](img/192b6e55337adc00931f510ecaaf8e05_29_0.png)


    It’s a really good idea if from the beginning you start to organize your scene
    using layers. And I speak from experience because sometimes, it can be hard to
    select something in Lumion when you have your scene full with objects. Things
    that you can organize inside layers include Trees, Grass, People. It will make
    a big difference, trust me.


    # Applying materials


    I am not going too deep into the editing materials. When we import a model, if
    we click on icon that has a bucket with ink, we can add materials to our model.
    Near our model, there is a white dot that we need to click on in order to select
    the model. You will know that you selected the model because it will turn green
    with a bounding box.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# What is Lumion?


    After that, we need to click on the plus icon and select something in our model.
    As soon we do that, a menu with all the materials will appear on the left-hand
    side. In my case, I will select the floor; and just to show you how it works,
    I will choose the material **Concrete_025_1024** and see how it looks. The following
    screenshot shows this material applied on the exterior floor:


    ![](img/192b6e55337adc00931f510ecaaf8e05_30_0.png)


    At the bottom, you can see the materials applied to your 3D model. and the Add
    material button is highlighted.


    Although adding a material is really simple, Lumion allows a really good control
    over the materials. You can see this in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_30_1.png)


    These are the settings you can use to tweak the material in a way that suits your
    scene best'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Click on the first button to change some material properties and the second
    button to modify the placing of the texture. The third button allows us to change
    the textures. If, for example, we want to use a material with a different texture,
    we click on the texture and load a new one. The **Advanced** option allows us
    to darken the texture or lighten it if needed.


    After adding this material, we need to click on the plus icon to add a new material.
    For now, why don''t you try to add some materials? To add a new material, just
    click on the plus icon and repeat the process. Finally, just click on the OK button
    to save all the materials:


    ![](img/192b6e55337adc00931f510ecaaf8e05_31_0.png)


    The OK button (highlighted) and a really important button called Reload model
    and re apply materials


    Before moving to the next menu, let''s have a look at two useful features. The
    first one, as we can see in the preceding screenshot, is the option to reload
    the model, as I mentioned previously.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# What is Lumion?


    For example, we imported our model, but we notice that something is wrong, such
    as the normal face is in the wrong direction. We can change that with our 3D application,
    and then export our model. But instead of importing and consequently adding the
    materials again, we just need to click on the Reload button. Lumion reimports
    the model and applies all the changes we made, including the materials. Now, let''s
    have a look at the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_32_0.png)


    The mouse is over the Glass material and you can see that Lumion tells you where
    this material is applied


    Another useful feature is that when we put the mouse over the thumbnail with the
    material we already applied, Lumion automatically shows where this material is
    applied. In this case, I selected the Glass material and it is showing me where
    this material is applied.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Controlling the weather


    After applying the materials, we are now going to change some settings on the
    **Weather** menu. Click on the **Weather** button and explore how you can change
    the Sun''s direction and height. Try to achieve some different moods, such as
    a sunny day, a sunset, or a beautiful night. The other two settings allow us to
    change the quantity of clouds in the sky and the Sun''s intensity. Finally, the
    button with a cloud lets us change the type of clouds. The following screenshot
    shows us these options:


    ![](img/192b6e55337adc00931f510ecaaf8e05_33_0.png)


    The Weather menu with the different settings: 1 – Sun direction, 2 – Sun Height,
    3 – Amount of clouds, 4 – Sun brightness, 5 – Type of clouds


    I am going to set the environment for a nice sunny day and add some clouds. We
    can choose from nine types of beautiful skies.


    # ## Changing the landscape


    Looking at this example, we see that the terrain needs some work. It is too flat
    and it wouldn''t hurt if you changed the terrain and added some hills. To change
    that, we select the **Landscape Editor**. We have a set of tools at our disposal
    that help us to sculpt our terrain easily, as we can see in the following screenshot.
    We can raise, lower, flatten, jitter, or smoothen our terrain. As you can see
    in the following screenshot, I have the **Lower** tool selected:


    ![](img/192b6e55337adc00931f510ecaaf8e05_33_1.png)


    You can find the following options in the Landscape Editor: 1 – Height menu, 2
    – Water menu, 3 – Ocean menu, 4 – Color menu, 5 – Terrain menu, 6 – Raise brush,
    7 – Lower brush, 8 – Flatten brush, 9 – Jitter brush, 10 – Smooth brush, 11 –
    Brush speed, 12 – Brush size, 13 – Choose Landscape'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Let''s use the **Raise** and **Lower** options to add some variety to our scene.
    On the right-hand side, we can change the brush opacity and size. Actually, Lumion
    calls the first option speed, but in reality we are changing the opacity. It is
    the same principle that we find in Photoshop. If you have a graphics tablet, it
    is easier to sculpt the terrain because you have a better control; but don''t
    worry, most of the times I use the mouse to work.


    By the way, did I tell you that you can use a height map to do all this work for
    you? We are going to learn how to do that later in this book; but yes we can use
    a height map and Lumion will convert that information to a landscape. Let''s turn
    our attention to the terrain. Using our left mouse button, click where we want
    to raise or lower the terrain. Lumion also introduces the opportunity to undo
    our changes. So, just to have some variety, we changed the landscape with a few
    pushes and pulls.


    A useful setting that we have with this menu is the opportunity to change not
    the entire terrain, but individual elements. So, let''s say we are happy with
    our scene, but we feel that the grass should be greener or there should be a different
    kind of grass. If you notice, we have a **Color** menu below the **Height** menu.
    Click on this menu to access the four thumbnails representing each element of
    our scene, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_34_0.png)


    The Color menu


    Clicking on each arrow will give you access to 42 different textures. If not,
    you can also import one of your own textures. Or if you want, change the entire
    landscape by clicking on the thumbnail with the mountains and select a preset
    from the 20 available ones.


    Now, let''s add some water. Next to the **Height** button, we have two more buttons.
    Click on the **Water** button (the one with a single wave). On the right-hand
    side, we have a thumbnail that will allow us to choose between six types of water:
    **Ocean**, **Tropical**, **Pond**, **Mountain**, **Dirt**, and **Ice**.'
  merge: -1
  img_proc: true
- pgno: 35
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Here is where the fun starts. We have at our disposal eight categories of objects
    and more, such as **Nature**, **Transport**, **Sound**, **Effects**, **Indoor**,
    **People and Animals**, **Outdoor**, and **Lights and special objects**. Each
    of these menus has subcategories. If you are working with the Lumion PRO version,
    you can choose from more than 2000 models. Even if you don''t have this version,
    cheer up! You can still import your own models and textures. You need to follow
    the same steps that we did to import the house.


    It is really simple to add a model. First, we need to select the category we want
    to use. So in this case, click on the **Nature** button. Now that we have this
    category selected, click on the thumbnail above the **Place** button and a new
    window with the Nature library will appear.


    We don''t have just trees, we have grass, plants, flowers, rocks, and clusters.
    Now let me show you one trick. Click on the **Grass** tab and select **Rough_Grass1_RT**.
    Now that we are back to the Build mode, press the **Ctrl** key and click on the
    ground. We are randomly adding 10 copies of the object, which in this case is
    really handy. So, after playing a little with Lumion, we can get something like
    the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Just think, it took me about 30 minutes to create something like this. Now
    imagine what you can do. Let''s save our scene and turn our attention to the right-hand
    side of the Lumion 3D interface, where we can find the menus as shown in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_37_0.png)


    The Build mode button


    Starting from the top of the preceding screenshot we can see the blue rectangle
    with a question mark. If we put our mouse cursor over this rectangle, we can see
    a quick help guideline for our interface.


    The next button informs us that we are in the Build mode and if, for example,
    you are working in the Photo or Video mode, this button lets you go back to the
    scene.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# The Photo mode


    So, if you click on the button with a camera (which is called **Photo**), our
    interface will change to the **Photo** mode, which in my case is something like
    the following:


    ![](img/192b6e55337adc00931f510ecaaf8e05_38_0.png)


    The Photo mode interface: 1 - New effect, 2 - Copy effect, 3 - Build mode with
    effects


    Here, we can render and export our still images. But before that, we can add a
    lot of effects. We can add some **Depth of Field** and **Vignette**, or perhaps
    you want to set up a scene with rain or snow. Go ahead and try the different effects.
    To do that, click on the **Effects** button on the top-left corner.


    Another cool feature that Lumion has is the possibility to have our Build mode
    with the effects applied. So, let''s say I want to show my scene with some rain,
    I add that effect and then click on the **Build with effects** button.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'At the top of your screen can you see the 10 thumbnails with a camera on it?
    In the preceding screenshot, one of these thumbnails is filled with an image.
    This is another great feature. So, let''s say that we are working on our scene,
    we adjust the camera and we love it—perfect angle and composition. Now, it would
    be really good if we could save this camera viewpoint. Well, we can save camera
    viewpoints by pressing Ctrl + 1. We may notice a temporary change in the interface,
    and if your sound is on, you will hear a sound too. This is our camera viewpoint
    being saved. So, later when we go back to the Photo menu, we have this camera
    viewpoint saved. Go ahead and try more camera angles and save them by using Ctrl
    and any number between 0 and 9, and then try Shift and any number between 0 and
    9.


    Finally, adjust the Focal length if you want, and then we can export our image.
    We have four sizes available, as you can see in the preceding screenshot. The
    formats available are JPG, BMP, DDS, PNG, and TGA.


    # The Movie mode


    However, the Lumion potential is not only in the Photo mode. In reality, the best
    potential of Lumion is the speed at which we can create stunning videos. So let''s
    move to the Movie mode. When you change to this menu, this is the main interface
    is shown as follows:


    ![](img/192b6e55337adc00931f510ecaaf8e05_39_0.png)


    The Movie mode interface: 1 - Entire movie, 2 - Import a movie from file, 3 -
    Import an image, 4 - Record


    Remember when I told you that the Lumion interface is intuitive and friendly?
    This section is an example of that. You can create a movie in the simplest and
    easiest way possible.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# What is Lumion?


    At the bottom of the preceding screenshot we can see nine clips. Each clip can
    store a small animation, or if you want, the entire movie. Lumion also gives you
    the possibility of importing an image or a video. So, perhaps we want to start
    our video by showing our logo; we don''t need to do this in another application.
    Just import what you need and add it to your movie. To do this, click on the second
    button to import an image or the third to import a movie. Now, let''s start creating
    an animation. Click on the first button that has a camera icon, as you can see
    in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_40_0.png)


    The Record menu: 1 – Play the movie, 2 – Clip speed, 3 – Take a photo, 4 – Go
    back to the Movie mode


    The way it works, as I told you, is really simple. Do you see the button with
    a camera? Click to start your first shot. Then move the camera slightly to another
    angle and click again, and repeat until you are satisfied. After that, click on
    the play button to see how your animation looks:


    > Remember that I told you to save a camera viewpoint using the Ctrl key plus
    a number key from 0 to 9? Using the Shift key plus a number key from 0 to 9 will
    load the saved viewpoints. You can use that shortcut in this mode too.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Another useful feature that Lumion allows is speeding up or slowing down your
    clip. On the left-hand side, you have a slider that allows you to increase or
    decrease the speed. When you are happy with your animation, click on the **OK**
    button and that''s it. Congratulations, you have created your first animation.
    Now, the Movie interface changes as shown in the following screenshot!


    ![](img/192b6e55337adc00931f510ecaaf8e05_41_0.png)


    The Movie menu interface with the clip we just created: 1 – Edit clip, 2 – New
    effect, 3 – Copy, 4 – Build with effects, 5 – Play, 6 – Save movie


    Now, we can edit the clip again if needed. Click on the clip and we have two buttons
    inside it: one that allows us to go back and edit the clip, and the other to delete
    it. This is not the only way to do it. If you look at the top-left corner, we
    have four new buttons:


    +   - **Edit Clip:** It leads you back to the menu where we can edit the clip.

    +   - **New effect:** It adds effects to the clip without affecting the entire
    movie.

    +   - **Copy:** We need to have an effect applied to the clip so that we can copy
    this effect and paste it in another clip.

    +   - **Paste:** Yes, I know I said four buttons, but this one only appears if
    we copy an effect. It allows us to paste the effect in another clip or on the
    entire movie.

    +   - **Build with effects:** Enable this option to see the effects applied on
    the build mode.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# What is Lumion?


    In this mode, Lumion allows us to add effects to each clip and to the whole movie.
    This option is useful when we want to add, for example, a Fade in/out to a specific
    clip, or change the Depth of Field. I added some Vignette and a little Fog in
    the background. In this case, we have nothing to animate, but we can add these
    effects here by using the advanced features such as animated objects or hiding
    layers.


    Now, to export the movie, click on the Save movie button on the right-hand side.
    It is the one with a movie take. The following options are available for exporting
    our movie or images:


    ![](img/192b6e55337adc00931f510ecaaf8e05_42_0.png)


    The Save menu


    We can export the MP4 format with several options, such as Quality, Frames per
    second, and Resolution. Another option is to export our movie as a set of images,
    which is a very useful option. And the third option is to save a single picture
    like in the Photo menu, but with many more options. These options include the
    possibility to save several render passes.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # Saving your scene


    To finish this chapter, we still need to know how we can save our scene. Looking
    at the image again, we can see the save button (the one with the image of a floppy
    disk). Click on the Save button and Lumion opens the **Save Scene** tab. Here,
    we give a name to our scene and a description too if needed. Notice that when
    you click on the red **OK** button, Lumion informs us on the left-hand side that
    now we are working on the version number 1. Every time we save, this number will
    increase. You can see this button in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_43_0.png)


    Just two more things before we move on to the next chapter. The button with a
    gear allows us to go back to **Settings** and change the **Quality settings**,
    if needed, and the last one is the Theater mode. So, if you have Lumion on your
    laptop, you can do a live walkthrough instead of exporting a movie or an image.'
  merge: -1
  img_proc: true
- pgno: 44
