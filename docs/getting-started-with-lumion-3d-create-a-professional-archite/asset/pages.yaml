- pgno: 112
  md: 'From left to right, we have the **color image**, **depthmap**, **material ID**,
    **normalmap**, **specular reflection map**, **lighting map**, and **sky alpha
    map**. You don''t need to export all the render passes, for example, I don''t
    use the normal map and the material ID except on rare occasions. Now, let''s use
    Photoshop to open these images.


    Photoshop works with layers, and it is a good idea if we start by adding names
    to the different layers and then create groups. So, with that in mind, I will
    create a folder in the **Layer** menu and change the name to `Base`. Drag the
    colormap to this folder or use the combination of `Ctrl + G` to create a group
    with the image inside. Save the file in the `.PSD` format so that you can edit
    the layers later.


    Now, right-click on the **Base** group, select **Duplicate Group...**, and rename
    it to `Render Passes`. Once you do that, we can start importing the render passes,
    and when you open the images in Photoshop, every image will open as a new tab.
    So, we need to drag every image to our original PSD file. Go to depthmap and use
    the combination `Ctrl + A` to select the entire image and `Ctrl + C` to copy that
    image. Then, go back to the original PSD file, create a new layer, and use the
    combination of `Ctrl + V` to paste the image. Don''t forget to rename the layer
    every time you create a new one. You should have something like the following:


    ![](img/192b6e55337adc00931f510ecaaf8e05_112_0.png)


    1 - Create a new group, 2 - Create a new layer'
  merge: -1
