    This chapter was designed to help you start with Lumion, and give you a taste
    of how easily and quickly you can get great images and videos. In particular,
    you''ve learned the basic steps to save and load scenes, import models, add materials,
    change the terrain and weather, and create photos and videos.


    This is the basic workflow for achieving great results in Lumion. Now you''re
