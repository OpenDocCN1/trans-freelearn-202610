  md: '# About the Author


    **Ciro Cardoso** is a Portuguese 3D artist who has successfully used Lumion for
    multimillion-dollar projects. He was bit by the AutoCAD bug in 2000 and has been
    producing 3D graphics for professional organizations and companies since 2005.
    His list of personal clients covers countries such as the United Kingdom, Portugal,
    the Netherlands, and Africa with numerous projects ranging from graphic design
    work to 3D visualizations.


    Besides his work as a 3D artist, he also does voluntary work teaching SketchUp
    and CAD to youngsters. He can be reached through his website at `http://www.cirocardoso.net`.


    > > I would like to thank my dear wife, Miriam, for her unfailing support during
    the writing of this book. I would particularly like to acknowledge Neha Nagwekar
    for being very supportive throughout this project.'
