- pgno: 115
  md: '# # Accurate selection with material ID


    Let''s use the **material ID** map to remove the specular map effect on the glass
    along with a layer mask. Let me first explain how layer masks work and how to
    use them, and for this, you just need to know the difference between black and
    white.


    A layer mask allows you to control a layer''s level of transparency. But we can
    use the **Opacity** option (yes, you can!); the difference is that the **Opacity**
    option changes the transparency level for the entire layer at once. In this case,
    I just want to decrease the effect that the specular map has on the glass and
    not on the entire image. So, what we need is a way to control the transparency
    of different areas of the layer separately, and that is when we use a layer mask.


    Select the specular layer and go to the **Layer** menu, select the **Layer Mask**
    option, and choose **Reveal All**. This is one thing you need to memorize; white
    reveals and black hides. What this means is that we use a white layer mask to
    reveal everything, and we select the black color with the brush tool to paint
    and hide.


    ![](img/192b6e55337adc00931f510ecaaf8e05_115_0.png)


    > If you start painting the image, it means that you have not selected the layer
    mask. Click on the layer mask and use the brush tool; you should see the result
    on the layer mask thumbnail.


    We can start painting around the windows, but it can be a hard task because accidentally,
    we can hide the effect in other areas where we don''t want it. We can use the
    Lasso tool, but we are going to use the material ID layer to select specific areas
    accurately. Let me show you how easily we can select only the windows with the
    glass.'
  merge: -1
  img_proc: true
- pgno: 116
