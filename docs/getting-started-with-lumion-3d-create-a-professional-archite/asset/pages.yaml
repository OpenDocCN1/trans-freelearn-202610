- pgno: 45
  md: '# 2


    # Preparing the Scene


    I am sure that after going through the first chapter, you are now eager to start
    working with Lumion. We ran through the basics that will certainly help to keep
    you going, but now is the time to refine our skills and also see where and how
    we can improve our workflow. This chapter is related to modeling and preparing
    our scene, but we will be doing more than that. We will identify some common mistakes
    made by beginners and learn how to avoid them to prevent having problems later
    with Lumion, and also where you can find models for your scenes, along with a
    few tips to improve the realism of your image or video.


    In this chapter we will learn the following:


    +   - Modeling for visualization

    +   - Working with CAD drawings

    +   - Importance of detailing

    +   - How to use our own models

    +   - Avoiding common mistakes


    As we saw in Chapter 1, What is Lumion?, Lumion is a great tool designed to give
    anyone the opportunity to create amazing still images and videos. But before we
    start using Lumion to create such things, we need a 3D model that is ready to
    be used in Lumion. So, we need to create a model and at the same time take into
    account a few points not only to help us improve the realism, but also to avoid
    problems while importing our model to Lumion.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Need help with modeling?


    The scope of this book is not to teach you how to model using a 3D application
    such as 3ds Max, ArchiCAD, or Revit. Maybe this is the first time that you are
    trying to create your own architectural visualizations and you don''t have any
    experience with modeling.


    Don''t despair, because SketchUp is the perfect solution for you, and best of
    all, it is free! Modeling in SketchUp is really easy and the reason behind it
    is that SketchUp has been developed to cater to people who don''t have any experience
    in using complex 3D applications. So, even if you don''t have any experience,
    SketchUp can help you start making your own visualizations.


    Do you want to try SketchUp? Download it at http://www.sketchup.com/download.


    # Modeling for visualization


    Modeling for visualization is not hard; you just need to follow some basic rules
    to help you start. The first basic rule is to ask: Will I see this? This is an
    important question we have to ask ourselves when we start modeling. If you don''t
    see something or you are not thinking of showing it in the final image or movie,
    don''t waste time modeling it. Besides, by modeling things you don''t see, you
    are making the file size bigger, affecting both your workstation performance and
    the rendering time.


    This question shows the importance of planning. You may wonder what planning has
    to do with modeling. Well, when we want to create an architectural visualization,
    we need to create everything from scratch. This freedom may be counterproductive
    because with so many opportunities and possibilities, we may lose focus and start
    modeling unnecessary things and details.


    So, planning is the key to success, and good planning can save us a lot of time.
    We need to think about what we want to show. Are you going to do some close-ups
    or a view of the whole building? Can you see the hinges on a door from an aerial
    view? I think not, but if you are planning to create a still image at a person''s
    eye level, you may need to include this detailing. Do you see what I mean by planning?
    The detailing we need in a still image is not the same as that of a movie, and
    we need to think ahead before starting with modeling.


    With a specific end in mind, go ahead, take a pencil, and do some sketches for
    each still image. If you want a movie, create a storyboard with each moving sequence.
    This will help you know what you need to model, where you need to add more detailing,
    and where you need to make some basic shapes.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Preparing CAD drawings


    After doing some sketches, we need a CAD drawing. Almost every project starts
    with a CAD file which has the technical drawings and specifications. These files
    form the baseline for a 3D model to be created, and it is very important for us
    to prepare them right from the beginning in order to prevent problems later. These
    principles apply to every 3D modeling application and not to SketchUp alone.


    It doesn''t matter if we receive a CAD drawing from a client or have a plan drawn
    by us, we always need to "clean" these drawings first. What does that mean? Well,
    there is always a certain amount of unnecessary information in a house or building
    model. Usually, I save a copy of the drawing as something like Drawing_Clean.DWG.
    Inside the drawing, I have the plan with walls, doors, windows, and elevations.
    While cleaning the drawing, don''t forget to check for external references and
    bind them or they will not appear when you import the drawing. Check if you have
    any hidden layers with information, and use the Zoom Extents option to check if
    there is more information than that you can see on screen. Sometimes, drawings
    might be far away from each other.


    So, delete everything that you won''t need, including layers, line types, and
    other CAD stuff. If we remove some of these objects, the file size and complexity
    of the CAD drawing will decrease and it will be easier to manage things inside
    our 3D application. The following figure shows a clean and ready-to-go CAD drawing:


    ![](img/192b6e55337adc00931f510ecaaf8e05_47_0.png)


    A CAD drawing example with just the information we need'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Preparing the Scene


    If I need more information, I generally keep the CAD drawing open to have a quick
    look. One important thing is that, our drawing needs a scale. Otherwise, when
    we import it to SketchUp or other 3D applications, we may have two basic problems;
    we won''t be able to see our plan, either because it is too tiny and we need to
    zoom in, or because it is so big that we need to zoom out. And even if you zoom
    in or out to see the plan and modeling, the problem will still persist when we
    import our model to Lumion. Our model will either be huge or tiny, and we will
    need to go back and scale it.


    After all these steps, run the `Purge` and `Audit` functions to make sure all
    the unnecessary information is removed and the errors are fixed. The last thing
    you need to be sure of is that your drawing is set at the origin location `(0,0,0)`.
    This is very important because the drawing may not be located at the origin but
    rather far away from it, and when we import, things might not go well. This is
    not the end of the world, but you should make a habit of having your drawings
    close to the origin location. To move your drawing to the origin location, use
    the command `Move (M)`, enter `''0'',''0'',''0''`, and then press *Enter*.


    Now that we have planned our shots, have a clean drawing, and know what we need
    to model, let''s start modeling.


    # Modeling with SketchUp, 3ds Max, and Maya


    The modeling process itself is relatively straightforward. I built the model of
    the house after doing some research on it. I gathered all plans and images that
    I could find online and in books. Since classic designs such as this are well
    documented; it wasn''t difficult to find the information I needed. The modeling
    part was quite simple as the building does not have any complex shapes, and so,
    this is polygonal modeling from boxes. Hence in this case, I didn''t use any complex
    CAD drawings; just some references for checking the measures.


    This topic is related to modeling, but again, teaching you how to model is out
    of the scope of this book. Instead, we are going to learn small tips that we can
    use to prepare our scene in Lumion and prepare our own models, and also how to
    correct some mistakes that may occur during the modeling process. I am going to
    focus on three 3D applications that I use the most and have experience with, but
    everything that you learn here can be applied to any 3D application. They may
    be different commands, but the end result is the same.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The importance of detailing


    The importance of detailing is sometimes underestimated. We tend to think that
    we need awesome materials and great lighting to create a beautiful image. That
    is important too, but we can have all those things and our render will still look
    flat or not so great. Why? This is because we need detailing, detailing, and detailing.
    So, what I mean is, you need to stop a little bit and start looking around yourself
    paying attention to all the small detailing. We will look at this later in this
    book, but just to give you an idea, if we add flowers to our scene in a straight
    row, how do you think will that look? Fake, because even if you have a perfectionist
    gardener planting the flowers, you will still have slight variations. Now, since
    we are talking about modeling a house, how can we add detailing to our model?
    Well, let''s have a look at the next topic and find out.


    # Adding detailing using bevel edges


    A great level of realism is achieved in architectural visualization by adding
    detailing such as those you find in the following screenshot. The problem with
    sharp edges is that you will obtain something flat and lifeless, and it will be
    harder to achieve a good level of realism.


    There are almost no sharp edges in real life, and even most man-made objects have
    a slight roundness. Beveling helps bring out detail, and really sells the realism
    of your model by allowing edges to properly catch highlights from your lighting
    solution:


    ![](img/192b6e55337adc00931f510ecaaf8e05_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The following screenshot will help you better understand the difference between
    using sharp edges and bevel edges. The left-hand side shows the edges without
    beveling, and on the right-hand side, you can see the edges with beveling:


    ![](img/192b6e55337adc00931f510ecaaf8e05_50_0.png)


    Which one do you think looks better? Look at your model now and see where you
    can add this kind of detailing, but also have in mind that if you are not thinking
    about showing those details, don''t bother modeling them. Trust me, beveling edges
    will make a huge difference.


    How can we do this in SketchUp? SketchUp doesn''t have any specific tool to do
    this, so you need to download a plugin. I used the RoundCorners plugin from the
    website for Fredo6. Before we see how it works, a word of advice; in these kinds
    of operations, it is always a good idea to save first and model later. The reason
    being, these are plugins, hence they are not a part of the application, and sometimes
    when we perform this operation, the application can crash and we may end up losing
    all the work. Working with this plugin is pretty simple, as explained in the following
    steps:


    +   1. Select the kind of round corners you want. You can choose from round corners,
    sharp corners, and bevel-edged corners, as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_50_1.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '2. Then, select the edges you want to bevel. I found that if you select the
    entire geometry, the plugin will add the effect just to the edges, as shown in
    the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_51_0.png)


    The RoundCorners menu


    3. At the top of the screenshot, we can see the menu bar. You just need to insert
    a value in the Offset option; if you are happy with the result, click on an empty
    space or on the button symbolized with a green tick mark meaning OK.


    > You can pick up some useful tips from the training videos available at http://www.sketchup.com/training/videos.html.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In case you are using Maya, carry out the following steps:


    +   1. Select the edges that you want to bevel.

    +   2. Press F3 to select the Polygons menu.

    +   3. Select the Edit Mesh menu and then click on the Bevel option. This will
    open a window called Bevel Options.

    +   4. We can leave the default settings and change only the Width value and the
    number of Segments. Then click on Apply and not on Bevel, because if you want
    to go back and change the settings, you just need to press Ctrl + Z:


    ![](img/192b6e55337adc00931f510ecaaf8e05_52_0.png)


    The Bevel Options menu


    In 3ds Max, we can use the Chamfer option by the following the ensuing steps:


    +   1. First, you need to apply the Edit Poly modifier to the object.

    +   2. Select the edges you want to chamfer.

    +   3. In the Edit Edges menu, click on the Chamfer settings.

    +   4. Here, you just have to be concerned with the Amount and Segments values.
    Don''t forget to click on the green colored tick mark if you are happy with the
    result as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/192b6e55337adc00931f510ecaaf8e05_53_0.png)


    > If you are looking for help in modeling using 3ds Max or Maya, have a look at
    the videos available at http://www.evermotion.org/tutorials/show/7979/tip oftheweek-3d-building-modeling-part-1.


    There are also a few scripts that can help while modeling for architectural visualization.
    The following is a list of useful plugins for SketchUp:


    +   - **JointPushPull**: This helps to perform a push or pull operation on a curved
    surface

    +   - **RoundCorners**: This is used to bevel edges

    +   - **SubdivideAndSmooth**: This helps in the subdivision of the surface for
    modeling

    +   - **SketchyFFD**: This is a freeform deformation matrix for your model that
    makes it malleable

    +   - **FreeScale**: This is an improvement of SketchUp''s native `Scale` function

    +   - **OSCoolean**: This helps to create Booleans

    +   - **Shapes**: This is a useful tool for creating complex geometrical shapes

    +   - **Weld**: This helps find gaps in a line that are not visible and automatically
    welds the broken points'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Using 3ds Max, we have the following plugins and scripts that are very useful:


    +   - **Floor Generator:** This provides scripts to help you create floors.

    +   - **Bookmanager 1.0:** This is helpful in placing books directly on actual
    shelf polygons.

    +   - **MultiTexture and UniqueMaterialID:** MultiTexture is a plugin that loads
    multiple textures and assigns them randomly, either by the object or by the material
    ID. UniqueMaterialID is a script to assign unique material IDs to each element
    inside an object.

    +   - **Rock Generator:** This is a script procedural rock generator for production
    and real time environments.


    For Maya, you can have a look at the following:


    +   - **1 Click Procedural Rock Generator:** This is a procedural rock generator

    +   - **Ninja Dojo (Black Belt) 5.5.0:** This consists of different modeling tools

    +   - **StairsCreator v3.0 3.0.0:** This is used to create stairs

    +   - **ArchiTool 0.8:** This gives a collection of different tools


    # Adding detailing


    If you want to give the images a good level of realism, a big part of this is
    related to detailing. An example of attention to detailing has been shown in the
    following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_54_0.png)


    A close-up of some detailing, such as bevel edges and individual tiles with different
    heights'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'As you can see, I took time to create individual tiles for this floor and it
    may be hard to notice, but each tile is different from the other in height; there
    is a gap between each tile and they are not perfectly aligned. Can you see the
    difference between using a normal map and modeling the tiles? We can get a really
    nice result with a normal map, but taking the time to add this kind of detailing
    can make all the difference. If you are wondering what a normal map is, we will
    learn about it in *Chapter 3, Creating Materials*.


    # Using additional models


    Another example of adding detailing is by populating the scene with objects. Again,
    the secret for a good scene is the amount of detailing and objects that it contains.
    Lumion does a really good job with this, so if you don''t have a big library of
    models, don''t worry too much because we can take advantage of the Lumion library.
    May I remind you that inside Lumion, you can access electronic appliances, food,
    interior lamps, plumbing, chairs, sofas, cabinets, tables, and many such things.


    But again, you have access to all the models only while using Lumion Pro. So,
    if you don''t have Lumion Pro and a good library of models, you still can get
    some for free. The following is a list of some places where you can find free
    and paid models:


    +   - **Creative Crash**: This is available at `http://www.creativecrash.com/marketplace/3d-models`

    +   - **3D Cafe**: This can be found at `http://www.3dcafe.com` (but you need
    to share some models first before you can download any)

    +   - **Archive 3D**: This can be downloaded at `www.archive3d.net`

    +   - **Mr. Cad**: This can be obtained at `www.mr-cad.com`

    +   - **3Delicious**: This is available at `www.3delicious.net`

    +   - **TurboSquid**: This can be found at `www.turbosquid.com`

    +   - **Resources Blogscopia**: This can be obtained at `www.resources.blogscopia.com`

    +   - **SketchUp Warehouse**: This can be downloaded at `http://sketchup.google.com/3dwarehouse/?hl=en`'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The following screenshot has some models that I am going to use in my scene:


    ![](img/192b6e55337adc00931f510ecaaf8e05_56_0.png)


    Some of the models include the Barcelona chair and the Barcelona day bed


    # The importance of materials


    Now, you are probably wondering what materials have to do with modeling? Well,
    the reason why I introduced this topic here is because Lumion works using the
    materials present in your model. Let me explain. You just finished modeling, added
    amazing detailing, and everything is ready to go. So you export the 3D model and
    import it in Lumion, and since you have already learned how to add materials in
    Lumion, you try, but something goes wrong, as seen in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_56_1.png)


    An example of Lumion allowing us to add only one material for the entire model'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'When you try to add a material, you realize that Lumion will apply the material
    to the entire model. Why? Well, because when we model in SketchUp or any other
    3D application, every time we create something using a default material. In SketchUp,
    the default material is **Default**, in Maya it is **Lambert**, and in 3ds Max
    it is **Blinn.**


    That''s why, while modeling, it is important to group objects that we know will
    share the same material, and then in the final stage, add a different material
    to each group. It doesn''t have to be something fancy; just use the same material
    and rename it.


    # Common issues


    There are a few things that can go wrong while modeling. Here, we are going to
    see the most common problems and the means to solve them.


    The first thing that may occur is missing faces. Have a look at the following
    figure:


    ![](img/192b6e55337adc00931f510ecaaf8e05_57_0.png)


    Can you see the difference in the SketchUp model and the Lumion model? I am sure
    you can easily spot that there is a face missing. The reason this happens is because
    this face points inside instead of pointing outside, and if you take a look at
    the SketchUp model, you will notice how the face has a different color. This is
    SketchUp''s way of telling us, look, this face is pointing towards the wrong direction.
    How can we solve this issue?'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Preparing the Scene


    While using SketchUp, carry out the following steps:


    +   1. Right-click on the face.

    +   2. Select **Reverse Faces**.


    While using Maya, carry out the following steps:


    +   1. Press *F3* to select the **Polygons** menu.

    +   2. Click on the **Normals** menu and then on **Reverse** (you may need to
    select a specific face first).


    While using 3ds Max, carry out the following steps:


    +   1. Select the face or faces.

    +   2. From the Modifier list, select **Normal** to normalize the face or faces
    you selected.


    The second problem that may occur after importing the model is that you may not
    be able to see it. To solve this problem, you may need to first check if your
    model is at the origin axis, and if this doesn''t work, check the scale of your
    model.


    Another issue is that you can''t assign a Lumion material to individual surfaces.
    Remember the previous topic? Lumion combines surfaces that use the same material,
    and if you want to use a Lumion material on a specific surface or surfaces, you
    need to assign a unique material to that surface before exporting the model.


    Finally, if you have problems with COLLADA files, check if you have the latest
    version of COLLADA. You may face some problems while using the COLLADA plugin
    for Revit, but usually these problems are solved once you upgrade to the latest
    version.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Summary


    In this chapter you learned how to prepare a CAD drawing in a way that it can
    be easily imported to any application as the base for modeling. You found out
    how important it is to add detailing to your model and how this helps to improve
    realism. You discovered some places where you can find free and paid models, and
    finally, learned a few common traps in modeling as well as how to avoid them.
    It is very important to take time to ensure that objects have good geometry and
    detailing. Of course, each project is different. In large projects, we need to
    have good management of the geometry so that we do not run the risk of creating
    a heavy scene. In the next chapter, you will learn how to create materials inside
    Lumion and your own textures using Photoshop or Gimp.'
  merge: -1
  img_proc: true
- pgno: 60
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 3

    Creating Materials


    Now that you have your 3D model ready to use in Lumion, it''s time to give it
    some life using materials and textures. This chapter is designed to help you start
    using materials in Lumion and learn how to configure them by understanding the
    different settings. Not only this, here you can find some help and tips so that
    you can create your materials using textures, make the necessary adjustments,
    and use them inside Lumion.


    In this chapter we will learn the following:


    +   - How to use Lumion materials?

    +   - Tweaking Lumion materials

    +   - What is texturing?

    +   - Where to find images for textures?

    +   - What is a seamless texture, alpha channel, and normal map?


    It''s time to take another important step: creating and adding materials to our
    3D model. Materials are a big help and a key aspect to create a stunning image
    or a great video. When we create a material, we are *telling* Lumion how we want
    that surface or surfaces to behave with light. So, creating materials is the process
    of adjusting parameters for defining how the surface would react to light, and
    adding a texture and other details.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Lumion materials


    Lumion helps us with this important step by offering many types of materials:
    518 materials that are ready to use. You may need to do some adjustments, but
    the major hard work was already done for you. The materials the we can assign
    to our model are as follows:


    +   - **Wood**: 45 materials

    +   - **Wood floor**: 67 materials

    +   - **Brick**: 32 materials

    +   - **Tiles**: 99 materials

    +   - **Ground**: 39 materials

    +   - **Concrete**: 43 materials

    +   - **Carpet**: 20 materials

    +   - **Misc**: 109 materials

    +   - **Asphalt**: 12 materials

    +   - **Metal**: 47 materials


    This is one of the reasons why it is so easy to create still images and videos
    with Lumion. Everything is set up for you, including parameters, details, and
    textures. However, we may need to do some minor adjustments, and for that, it
    is important to understand or at least have a basic notion of what each setting
    does. So, let''s have a quick look at how we can configure materials in Lumion.


    # The Properties menu


    Do you still remember how to add a material to your model? On the **Import** menu,
    click on the **Edit Materials** button, select the object, and click on the plus
    icon to select a surface.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'We are going to look at the most important aspects in the Properties menu to
    help you understand how you can tweak the material. Let''s have a look at the
    following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_63_0.png)


    The properties are as follows:


    +   - **Scale**: It''s a really important aspect when configuring the material
    because we can change the scale of the texture, and everything can have the correct
    proportion. If we are using our own texture with a specific texture mapping, we
    need to set this value to 0.

    +   - **Reflection Colorize**: Use the material color to tint the reflections.
    In order to understand this setting, take a look at the following screenshot.
    From the left to the right, there is an increment of 50% starting from 0%. Can
    you spot the difference in the screenshot?


    ![](img/192b6e55337adc00931f510ecaaf8e05_63_1.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Creating Materials


    +   - **Reflection Falloff:** Also known as the Fresnel effect, it is the amount
    of reflection that you see on a surface depending on the viewing angle.

    +   - **Brightness:** Change this setting to create a darker or brighter material.

    +   - **Glossiness:** It helps you get some sharp or blurry reflections.

    +   - **Bump:** It helps you add some details using a normal map, as you can see
    in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_64_0.png)


    Starting from the left with 0 Bump, in the middle with 0.2 Bump, and right side
    with 1 Bump


    +   - **Reflectivity:** It controls the amount of reflection on the surface.

    +   - **Saturation:** It is a uniform increase in the intensity of all colors
    in the material. This can result in over saturation of certain colors, resulting
    in loss of detail in those areas, leaving them looking too orange and unnatural.
    If you decrease saturation, you can get a grey-scale texture.

    +   - **Emissiveness:** Use this parameter to create glow effect for things like
    light bulbs and neon signs.


    > 💡 If you need to adjust the slider with small increments, press the *Shift*
    key and adjust the value.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Placing the texture


    Now you know how to control the look of the surface. But how can we change things
    such as the position and angle of the texture in the material? In the **Placing**
    menu, we can find some settings that can help us configure those things, as you
    can see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_65_0.png)


    +   - **Depth Offset:** This slider helps you to correct surfaces flicker or disappear
    when moving the camera, adjust this setting with small increments until the flickering
    stops

    +   - **X, Y, and Z:** Use these sliders to adjust the position of the texture

    +   - **Heading:** It is the option to rotate the texture using the values range
    from 0 to 360


    # # The Textures and Advanced options menus


    **Textures** is a simple menu where you can change the Diffuse and Bump textures.
    The Bump texture is the texture used to add the detail that we saw previously.
    Clicking on these thumbnails will open a window to upload or replace this texture
    with another one. In the **Advanced options** menu, we can find settings that
    help us have a tight control over the brightness of the material.


    As you can see, Lumion allows a good level of control over the pre-built materials,
    but we also have the freedom to pick these materials up and use our own textures.
    Let''s say we want to use the material that we used for the floor, but with another
    texture. There is nothing simpler. Apply the material and in the **Textures**
    sub-menu, upload the Diffuse and the Bump textures that you created.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# The Custom menu


    This menu has particular materials that are really useful for our scenes, and
    here we can find what cannot be fitted in other categories. Inside this menu,
    we can find, for example, the Glass and Color materials and others, as you can
    see in the following screenshot. We can find some cool features too:


    ![](img/192b6e55337adc00931f510ecaaf8e05_66_0.png)


    The Custom menu where you can find some specific materials


    # The Invisible material


    Use this material to make something invisible in your scene. I found this material
    useful to hide something inside Lumion. In that way, I don''t need to spend time
    going back, for example, to SketchUp, delete the object, and export and import
    in Lumion. If I want to hide something, for example, a wall, a window, or an entire
    model, I can do it by applying this material. It''s a time saver.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# The Landscape material


    The best way to explain this material is by showing you an example. So, let''s
    say that along with the model, you also created a terrain like the one you can
    see in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_67_0.png)


    The house along with a terrain model


    Import the terrain if needed, and add a new material to this terrain. Go to the
    Custom menu and click on the Landscape material. The Landscape material allows
    you to seamlessly blend or merge parts of the model with the landscape. Make sure
    that the terrain intersects with the ground so that it can be perfectly blended.
    The following screenshot shows this Landscape material applied to my 3D terrain:


    ![](img/192b6e55337adc00931f510ecaaf8e05_67_1.png)


    The terrain model merged with the landscape'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Creating Materials


    Adding this material not only allows you to use this cool feature, but as you
    can see in the picture, we can also start painting soil types of the landscape
    in the imported terrain.


    The other two materials that I want to introduce you to are the **Standard** and
    **Water** materials. The **Standard** material is a simple material without any
    textures or settings, and we can use this material to start something from scratch.
    The **Water** material can have several applications, but perhaps, the most common
    one is, for example, pools. Now, let''s have a look at how we can create materials.


    # Creating materials in Lumion


    Knowing that Lumion has so many ready-to-use materials is a big advantage for
    our project. But the time may come when we cannot find what we need inside Lumion,
    and that is when we need to create our own materials. While creating a material
    to use inside Lumion, the most important aspect is the texture or map because
    all the tweaks with the reflection and bump, for example, are done inside Lumion.
    We just need to be concerned with creating a diffuse map with alpha channel and
    a normal map.


    But before all these things, we need to find a good image to use as a texture.
    Where can we find good and free images? The best option is that you create your
    own library of textures using your camera. Other places where you can find images
    are as follows:


    +   - Flickr

    +   - Stock.xchng

    +   - IStockphoto

    +   - deviantART

    +   - And the best one for me, CGTextures


    Now that we have a nice image to use as texture, we need to use image-editing
    software, such as Adobe Photoshop or Gimp, to tweak and adjust the image. You
    don''t need to use Adobe Photoshop to create some textures, especially when we
    can find free software, such as Gimp, that can help in doing the same thing.


    Why do we need this software? We need it, for example, to transform the image
    into a seamless texture. What is a seamless texture? A seamless texture is an
    image that can be placed side-by-side with itself without creating a noticeable
    boundary between the two copies. Creating this can take some time, and this is
    one of the reasons why I use CGTextures so often, because usually we can download
    tiled textures, which are the same as seamless textures.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Do you want to create your own seamless textures? Have a look at the tutorials
    that you can find on CGTextures.com. A few that I recommend are as follows:


    +   - Photoshop Match Color

    +   - Photoshop tricks and tips

    +   - Tiling complex patterns

    +   - Recoloring wood textures


    After creating a seamless or tiled texture, we can create an alpha channel to
    add more detail. This alpha channel is used as a reflection mask in Lumion, blocking
    areas where we don''t want the light to reflect, as you can see in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_69_0.png)


    Can you see the lines in the texture?'
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Creating Materials\n\nBy the way, in the **Standard** material in the **Properties**\
    \ sub-menu, there is a slider called **Reflection/Clip**. This allows you to use\
    \ the alpha channel to clip your model, as seen in the following example. I use\
    \ a grid where the white lines show the material and the black areas hide the\
    \ material. And this is the way an alpha channel works; white reveals detail and\
    \ black hides it. The following screenshot shows an alpha map in use:\n\n![](img/192b6e55337adc00931f510ecaaf8e05_70_0.png)\n\
    \nI use an alpha texture to create this grid\n\nThe final thing that you need\
    \ to create is a normal map, so you can use the **Bump** slider in Lumion to add\
    \ detail. To create a normal map using Adobe Photoshop or Gimp, we need to install\
    \ a plugin.\n\n> Want to know how to create a normal map? Have a look at the following\
    \ URLs:\n> \n> - **NVIDIA Texture Tools for Adobe Photoshop**: `https://developer.nvidia.com/nvidia-texture-tools-adobe-photoshop`\n\
    > - **Gimp-normalmap**: `https://code.google.com/p/gimp-normalmap/`"
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Summary


    In this chapter you learned how to use and configure the prebuilt materials in
    Lumion. You found out how to use the **Landscape** material to create a terrain
    and some useful materials such as the **Invisible** and **Water** materials. In
    the final section, you discovered some places where you can find free textures
    and learned what you need to create a seamless **Diffuse** texture, alpha channel,
    and normal maps. In the next chapter, you will learn how to export your 3D model
    from a 3D application such as SketchUp and import it without problems in Lumion.'
  merge: -1
