- pgno: 100
  md: '# The key aspects of composition


    What is composition and why is it so important? Composition is the arrangement
    of elements within a frame which will attract the eye of the viewer. Instead of
    using the terminology *rules*, let''s look at composition using a set of ingredients
    that can be added or removed to create a great video or image.


    The key is to remember that you don''t use all the ingredients in every dish you
    prepare. In the same way, you don''t need to use all these ingredients of composition
    in the making of an image or video.


    Let''s have a look at some of the key aspects of composition:


    +   - **Pattern:** Life is filled with patterns, and when it comes to capturing
    repetition, you can either emphasize the patterns or break them

    +   - **Symmetry:** You can create two types of images; one with symmetry and
    the other with asymmetry

    +   - **Depth of field:** This can isolate a subject from its background and foreground

    +   - **Lines:** You can use diagonal, horizontal, vertical, and converging lines;
    all of them will impact the images differently

    +   - **Shape and positioning:** Both of these are very important factors for
    different elements

    +   - **Proportion of contrast:** This gives the partition between the light and
    the dark


    These are just a few aspects to create a good composition. This subject is too
    complex to discuss in this book, however, these key aspects can help you to start
    with the right foot.


    > > Learn photography and you will have half the job done to create a great architectural
    visualization.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# The importance of framing


    One important thing in composition is using the concept of framing. What is framing?
    Framing is when we use certain elements in the scene to focus our viewer''s attention
    to certain aspects of the scene. Have a look at the following screenshot and see,
    for example, how we have used trees on each side to turn the attention of the
    viewer to the house:


    ![](img/192b6e55337adc00931f510ecaaf8e05_101_0.png)


    We can use almost everything in the scene to frame the shot, including the trees,
    rocks, and other buildings just to mention a few.'
  merge: -1
  img_proc: true
