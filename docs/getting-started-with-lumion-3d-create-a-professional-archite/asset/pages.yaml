- pgno: 15
  md: '# # What is Lumion?


    Lumion is a powerful, easy, fun-to-use, effective architectural visualization
    tool that allows anyone to build a 3D environment and then create beautiful images,
    impressive video presentations, and live walkthroughs. It is the fastest way to
    pick up your 3D model and create a scene in a matter of minutes. This chapter
    will help you to know Lumion better and with a quick start you will be using Lumion
    immediately.


    In this chapter we will cover the following topics:


    +   - Why use Lumion?

    +   - What can we get from Lumion?

    +   - Differences between the versions

    +   - Import formats

    +   - Workstation specifications

    +   - Lumion''s interface

    +   - Navigation inside Lumion

    +   - Working with Lumion


    This chapter is a very general overview of Lumion. I promise to try to not bore
    you with too much background information, but you will come to know about what
    the software is supposed to let you do, how it compares to other 3D alternatives,
    and where everything is.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# What is Lumion?


    # # Lumion background


    At first, let''s discuss a brief history of Lumion. Act-3D is the company that
    develops Lumion, and it is possible that you may know them from Quest3D and several
    other projects that they were involved with. However, Act-3D realized that numerous
    customers were employing Quest3D to produce architectural visualisations. It was
    a difficult task since Quest3D is not exactly the best tool for creating such
    things. In fact, using Quest3D is not a simple task; you almost need to be a Guru
    to create something. Eventually, Act-3D decided to develop a whole new piece of
    software keeping these customers in mind. And then, Lumion was born with the power
    of a real-time visualization tool, but at the same time it was accessible to everyone.


    # # Why use Lumion?


    The short answer is that Lumion is easy to use and the final product is of a good
    quality. The long answer is that every construction project needs technical drawings
    and documents. Although this technical information is fine for a construction
    crew, usually the client has no idea what a CAD plan means. They can have an idea
    where the kitchen or the living room will be, but translating that 2D information
    to 3D is not always easy in the client''s mind. This can be an issue if we need
    to give a presentation or if we are trying to sell something that is not built
    yet. And truth be told, an image sells more than words. That''s where Lumion comes
    in. Lumion is the fastest way to render high quality still pictures and videos,
    and it makes it so easy to import our 3D models from any 3D modeling software,
    such as SketchUp, AutoCAD, Revit, ArchiCAD, and 3ds Max, and create a scene in
    minutes. So, Lumion 3D is a distinct architectural visualisation software not
    only because it is faster to render, but also because it is very user friendly
    and intuitive.


    Another reason why we can use Lumion to create architectural visualizations is
    because we can have a great idea of how our project will look in natural surroundings
    at any time of the day or season, and this in just a few minutes. Now if you are
    an architect, it is doubtless that you want to enhance your project characteristics
    in the best way possible. Lumion can help you achieve this in hours instead of
    the inevitable days and weeks of rendering time.'
  merge: -1
  img_proc: true
