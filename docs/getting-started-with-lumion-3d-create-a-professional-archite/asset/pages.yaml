- pgno: 11
  md: '# Preface


    *Getting Started with Lumion 3D* shows you how to start working with Lumion tools
    to create professional architectural visuals in a friendly and intuitive way.
    The book guides you through all the initial steps and contains a Quick start tutorial,
    so you will be able to start using Lumion and render a scene immediately. The
    rest of the book builds on this knowledge by introducing you to additional tools
    and using step-by-step explanations to help you to not only start working with
    Lumion, but also take the first steps in architectural visualization. You will
    learn how to work with Lumion materials and models, how to compose your scene,
    and export an image or a video.


    # What this book covers


    *Chapter 1, What is Lumion?*, will give a general overview of Lumion, where you
    will learn why to use Lumion and what final quality we can get with this application.
    Then, you will start using Lumion with the help of a Quick start tutorial, where
    you will learn the basics to start creating beautiful architectural visualizations.


    *Chapter 2, Preparing the Scene*, will help identify and correct some common mistakes,
    so you can prevent problems with Lumion. You will learn how to clean and use CAD
    drawings to start modeling, how to improve realism, and where you can find neat
    models to use in your scene.


    *Chapter 3, Creating Materials*, will help you to learn how to use and tweak more
    than 500 ready-to-use materials that Lumion has. Finally, you will learn where
    you can find textures and how to prepare them to be used along with Lumion materials.


    *Chapter 4, Working with Lumion*, will answer many of your questions; this is
    when the fun starts. Your 3D model should be ready to export. How can you do that?
    Do you need a special plugin? How do you import a model in Lumion? All these questions
    and more will be answered in this chapter. After importing the model, you start
    by organizing your scene in Lumion using layers and additional menus.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '*Chapter 5, Building the Environment,* will help you to start adding detail
    to your scene. You will learn how to sculpt the landscape and change the weather,
    and then you will start populating your scene with the numerous models that are
    available with Lumion. You also learn how to give that special touch to your scene,
    using special effects and sounds.


    *Chapter 6, Preparing the Render,* will teach you what composition is and how
    you can make your scene more appealing, and how to use the Photo and Video modes
    to export a 2D element.


    *Chapter 7, Post Production,* will help you learn how to give a special touch
    to the output you get from Lumion. Using Photoshop or Gimp, you will learn some
    key aspects to do color correction in your images. You will learn how to use layer
    masks, blending modes, and adjustment layers.


    # What you need for this book


    The basics are: Lumion Free edition, Photoshop, or Gimp. The Lumion team recommends
    the following minimum settings:


    +   - Windows XP, Vista, 7, 8 (32- and 64-bit) and DirectX 9.0c or later

    +   - System memory: 3 GB

    +   - Graphics card: NVIDIA GeForce GTS 450 or ATI/AMD Radeon HD 4890 (minimum
    1,500 PassMark points), with at least 1 GB dedicated memory (not shared system
    memory)


    # Who this book is for


    This book is suitable for all levels of Lumion users. It is meant especially for
    those without any experience in architectural visualization and who want to start
    with the first steps in this area. This book also can help intermediate users
    to improve their workflow with different techniques. If you are an amateur, a
    professional architect, or a designer, this book will help you start creating
    3D visualizations with Lumion.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles and an
    explanation of their meaning.'
  merge: -1
  img_proc: true
