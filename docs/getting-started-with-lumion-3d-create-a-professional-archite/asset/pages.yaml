- pgno: 73
  md: '# 4


    # Working with Lumion


    It’s time to start working with Lumion, and this chapter will help you create
    a bridge between the 3D application of your choice and Lumion. Exporting the 3D
    model and bringing it into Lumion can cause problems at times. To start on the
    right foot, we are going to analyze some important aspects before exporting the
    3D model. Once the model is exported into Lumion, we will learn how to place and
    adjust the model. This chapter has been written with the intention of helping
    you get everything you need so that you can start working in Lumion without any
    delay.


    In this chapter, you will learn the following topics:


    +   - What is COLLADA?

    +   - Exporting from SketchUp

    +   - Exporting from 3ds Max

    +   - Exporting from other 3D software

    +   - Importing the model

    +   - Working with layers

    +   - Placing the model


    As you can see from the introduction, this chapter is more technical, but at the
    same time it is very important as you will learn the right way to export your
    3D model here. To get a smooth workflow, you need to pay close attention to this
    section. To answer the question: what is the best format to use? COLLADA is the
    perfect answer.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# What is COLLADA?


    COLLADA is an XML namespace and database schema used to create a bridge between
    the different 3D tools, making an easy sharing of 3D geometry, shaders, and effects
    possible. In plain English, it allows you to move 3D files between SketchUp, 3ds
    Max, Maya, Revit, and Lumion. However, nothing stops you from using other file
    formats such as the following:


    +   - Autodesk RealDWG - *.dxf

    +   - Autodesk RealDWG - *.dwg

    +   - FBX file - *.fbx

    +   - Max file - *.max

    +   - 3ds file - *.3ds

    +   - Obj file - .obj


    The reason behind using COLLADA is that it is a better option compared to the
    file formats we previously mentioned. As I said, there is nothing that''s going
    to stop you from using those file formats, but they are less reliable and do not
    always include all the data we want. To get the best results with a low possibility
    of error, COLLADA is the right choice. COLLADA is not available in all the applications,
    and in some cases, such as when we are using an older version of 3ds Max or Maya,
    we need to install a COLLADA plugin called OpenCOLLADA.


    Download OpenCOLLADA at https://code.google.com/p/opencollada/downloads/list.


    The Lumion team has done a good job of creating a COLLADA plugin called COLLADA
    exporter for Revit. The downside of this plugin is that it doesn''t work with
    the Revit LT version, and the only versions available are Revit 2012 and 2013.


    Download COLLADA exporter at http://lumion3d.com/lumion-exporter-for-autodesk-revit.


    There are some workarounds when using other applications such as ArchiCAD. According
    to the Lumion team, if you are using this software, the best solution is to export
    your model as a SketchUp file. SketchUp will be used as an intermediary between
    ArchiCAD and Lumion.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '> This ArchiCAD add-on is available for download at http:// www.graphisoft.com/products/archicad/addons/
    google_earth/.


    I recommend that you use SketchUp as the middleman if your 3D software doesn''t
    have the option to export a COLLADA file. Now that we know what COLLADA is and
    why it''s so important to learn its usage, let''s have a look at how we can export
    a 3D model from various 3D software programs.


    # Exporting from SketchUp


    Lumion 4 allows you to directly import a SketchUp file. However, if you have a
    previous Lumion version, this is what you need to do. Exporting your model using
    SketchUp is the simplest thing, and in Chapter 1, What is Lumion?, we had a quick
    look at how to do it, but let''s use some pictures now to help you understand
    all the steps better. In SketchUp, select the File menu, hover your mouse over
    the Export option, and select 3D model.


    Now, you need to set some options to export the 3D model correctly. Click on the
    Options button and select the following options:


    +   - Triangulate All Faces

    +   - Preserve Component Hierarchies

    +   - Export Texture Maps


    ![](img/192b6e55337adc00931f510ecaaf8e05_75_0.png)


    The correct settings to export your model as a COLLADA file'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# *Working with Lumion*


    You need to select the **Triangulate All Faces** option to be able to see your
    3D model inside Lumion, and the **Export Texture Maps** option will create a folder
    with all the texture maps in the same folder where you exported the 3D model.
    Don''t forget to assign different materials to each section of your model because
    the number of materials that you export with your 3D model is equal to the number
    of materials that you can change inside Lumion. Moving forward, let''s see how
    we can perform the same procedure using 3ds Max.


    # # Exporting from 3ds Max


    To work with 3ds Max, we need to take into account a few aspects before exporting
    the 3D model. Don''t forget to use real dimensions when modeling with 3ds Max;
    otherwise, your 3D model will be very tiny or really big once you import it in
    Lumion. There are a few more things you need to pay more attention to.


    Before exporting materials, convert them to standard materials because if you
    use any other type of material when importing to Lumion, such as V-ray materials,
    the model will be imported without any textures. Also, when using a standard material,
    you can use two textures: one in the **Diffuse** slot and the other in the **Self-illumination**
    slot to use lightmaps or give additional details. Besides these two options, anything
    that you may have in the material, for example, a specular map or bump map, will
    not be exported.


    Now it''s time to export your model. Choose **OpenCollada**, or if you are using
    a more recent version of 3ds Max, you can choose **Autodesk COLLADA**. If you
    are using this option, select **Convert Deforming Dummies to Bones in the Geometry**
    tab and **Triangulate** and **Single Matrix** in the Collada tab.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'You can use this option, but I recommend using OpenCOLLADA especially because
    this will create a folder with all the textures you use, so you don''t need to
    be afraid of losing something on the way. To export using OpenCOLLADA, follow
    the same steps, but when it''s time to choose the file format, choose OpenCOLLADA
    and use the settings shown in the following screenshot to export:


    ![](img/192b6e55337adc00931f510ecaaf8e05_77_0.png)


    OpenCOLLADA export settings


    # Exporting animations


    Remember that you can import animations from 3ds Max inside Lumion. How can you
    do this? Well first of all, you need to set your frame rate to PAL. Also remember
    that Lumion can only read objects with keyframes in the move, rotate, and scale
    values. With this in mind, you need to export the animation using the FBX file
    format, and don''t forget to choose the preset of AutoDesk Media & Entertainment.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Exporting from other 3D software


    When exporting from other software, such as Autodesk Maya, AutoCAD, and Revit,
    we basically apply the same principles. For Maya, you will need to install the
    OpenCOLLADA plugin. In the case of Revit, you will need to download the COLLADA
    plugin from the Lumion website. Using AutoCAD, you need to export using the FBX
    file format and use the settings as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_78_0.png)


    The correct settings to export a FBX file from AutoCAD


    # Working with Lumion


    Now we are going to start working with Lumion. We learned about everything we
    need: modeling, materials, and textures, exporting our model, and correcting certain
    things so that when we import our model inside Lumion, everything is perfect.
    Remember that we also need to do some planning before we start the process so
    that we already have a goal in mind when we start working with Lumion. This is
    a key aspect of creating great architectural visualizations.


    Let''s start working with Lumion and create a scene. I usually start with a sunny
    day scene because it gives me a good start with a flat terrain and good light.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'You already know how to import your model as discussed in Chapter 1, What is
    Lumion? but just to remind you, on the left-hand side of your screen, you will
    find four menus. The third menu is the Import menu. Click on it to activate the
    options at the bottom. Click on the Add a new model button and a window will appear
    where you can select the model you want to import. Double-click on the file or
    just click on the Open button. Another window will appear where you need to add
    a unique name to the model, and if you have any animations in the FBX file, tick
    the box next to Import animations.


    Now that you have imported the model, click the left mouse button anywhere that
    you want your model. If, by any chance, you are not using a flat terrain, you
    may find it difficult to place the model in a way that it doesn''t intersect the
    terrain. You may lose some time trying to get the right position, and that is
    why it is my advice to model your terrain at the base of your building so that
    you can easily merge with the terrain using the landscape material. Lumion offers
    several options to move and adjust the model we just imported, but before doing
    that, it is good practice to organize your scene using layers. You will thank
    yourself later, when you have 50 trees, 20 people, and 5 cars in your scene, and
    you need to select or edit your model without any distraction but don''t have
    any way to select and hide these models. So, don''t forget to use the Layers menu
    that you can find in the top-left corner.


    As I said, when you import your model inside Lumion, you gain access to really
    useful options to move and adjust the 3D model. Back in the Import menu, turn
    your attention to the last three icons. They have been highlighted in the following
    screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_79_0.png)


    The context, edit, and the delete button'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Working with Lumion


    The first is the **Context** menu. When we select this option and click on the
    model, two menus will appear. The first is **Selection**, which we are not going
    to analyze now. We want the second option, **Transformation**. Click on this and
    a menu will appear as shown in the following screenshot:


    ![](img/192b6e55337adc00931f510ecaaf8e05_80_0.png)


    The Transformation submenu


    Most of them work when you have several objects selected. But why don''t you have
    a try, for example, with the **Place on ground** option? With this option, you
    can make sure that the model is in contact with the ground. When you finish, you
    can secure the position by using the **Lock position...** option. Going back to
    the **Import** menu, next to the **Context** menu, we have the **Edit Properties**
    menu. As you can see from the following screenshot, this menu allows you to accurately
    adjust the position not only of your model, but also of every single object inside
    Lumion. This also lets you know where the objects are positioned.


    ![](img/192b6e55337adc00931f510ecaaf8e05_80_1.png)


    Adjusting the 3D model position using the **Edit Properties** menu'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Once again, remember to always start working on your scene by creating layers.
    They are a key aspect to having a smooth workflow. They will not only help you
    organize your scene, but also help you to focus your attention on a specific model,
    hiding unnecessary things, and allowing fluid camera movement. You can even use
    them to get better performance while editing. Finally, once you decide that a
    model is in the right position, never forget to lock that object. With that in
    mind, you can turn your attention to the environment.


    # Summary


    This was a more technical chapter where we learned about important topics that
    helped give us a good start with Lumion. We learned about COLLADA, its usefulness,
    and also the key aspects to consider when exporting our model. Finally, with the
    bridge between our 3D software and Lumion created, we learned not only how to
    import and use layers to organize our scene, but also to use the **Context** and
    **Edit Properties** menu to move and place our 3D model.


    With our model locked in place and materials assigned, we are ready to move on
    the next chapter, where we will learn how to modify the terrain and start populating
    our scene with Lumion models.'
  merge: -1
  img_proc: true
