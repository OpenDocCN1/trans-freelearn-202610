  img_proc: true
- pgno: 106
  md: 'Other issues complicating hyperparameter optimization are as follows:


    +   * **Cost**: For each unique set of hyperparameters (of which there can be
    many), an entire training run, often with cross-validation, must be performed.
    This is highly time-consuming and computationally expensive.


    +   * **High-dimensional search spaces**: Each parameter can have a vast range
    of potential values, making testing each value impossible.


    +   * **Parameter interaction**: Optimizing each parameter in isolation is often
    impossible, as some parameters’ values interact with others’ values. A good example
    is the learning rate and the number of estimators in LightGBM: fewer estimators
    necessitate a larger learning rate, and vice versa. This phenomenon is shown in
    Figure 5.1.


    ![](img/31b70e4a77c3afbe11032f68ab874b02_106_0.png)


    Figure 5.1 – A parallel coordinate plot showing a parameter interaction between
    the learning rate and the number of estimators: having more estimators requires
    a lower learning rate, and vice versa


    Figure 5.1 visualizes parameter interactions using a technique called a **parallel
    coordinate plot**. Parallel coordinate plots are a visualization tool designed
    to represent high-dimensional data, making them especially useful for visualizing
    the results of hyperparameter optimization. Each dimension (in this context, a
    hyperparameter) is portrayed as a vertical axis arranged in parallel. The range
    of each axis mirrors the range of values that the hyperparameter can assume. Every
    individual configuration of hyperparameters is depicted as a line crossing all
    these axes, with the intersection point on each'
  merge: -1
  img_proc: true
- pgno: 107
  md: "axis indicating the value of that hyperparameter for the given configuration.\
    \ Lines can also be color-coded based on performance metrics, such as validation\
    \ accuracy, to discern which hyperparameter combinations yield superior outcomes.\n\
    \nThe beauty of parallel coordinate plots lies in their ability to illustrate\
    \ relationships between multiple hyperparameters and their cumulative impact on\
    \ performance, such as the parameter interaction shown in Figure 5.1. Observing\
    \ the lines’ clustering or similarities in their color allows us to glean trends\
    \ and intricate interdependencies between hyperparameters. This ability to visualize\
    \ multidimensional patterns helps data scientists pinpoint which hyperparameter\
    \ values or combinations are most conducive to optimal model performance.\n\n\
    Given the challenges and complications of hyperparameter optimization, a naive\
    \ approach to finding the optimal parameters is manual optimization. With manual\
    \ optimization, a human practitioner selects parameters based on intuitive understanding\
    \ and experience. A model is trained with these parameters, and the process is\
    \ repeated until satisfactory parameters are found. Manual optimization is simple\
    \ to implement but is very time-consuming due to the human-in-the-loop nature\
    \ of the process. Human intuition is also fallible, and good parameter combinations\
    \ can easily be missed.\n\nNote\n\nThe process of finding optimal parameters is\
    \ often called a parameter **study**. Each configuration (combination of parameters)\
    \ tested in the study is referred to as a **trial**.\n\nIn the previous chapters’\
    \ examples, the approach we used thus far was **grid search**. With grid search,\
    \ we set up a parameter grid consisting of each parameter and a range of potential\
    \ values and exhaustively tested each possible combination to find the optimal\
    \ values.\n\nGrid search solves the parameter interaction problem well: since\
    \ each possible combination is tested, each interaction is accounted for.\n\n\
    However, the downside of using grid search is the cost. Since we exhaustively\
    \ test each parameter combination, the number of trials quickly becomes prohibitive,\
    \ especially if more parameters are added. For example, consider the following\
    \ grid:\n\n```\nparams = {\"learning_rate\": [0.001, 0.01, 0.1],\n \"num_leaves\"\
    : [10, 20, 50, 100],\n \"num_estimators\": [100, 200, 500]}\n```\n\nAn optimization\
    \ study for this grid would require 36 trials. Adding just one additional parameter\
    \ with two possible values doubles the cost of the study.\n\nWhat’s needed is\
    \ an algorithm and framework that can intelligently optimize the parameters within\
    \ a limited number of trials that we control. Several frameworks exist for this\
    \ purpose, including SHERPA, a Python library for tuning machine learning models;\
    \ Hyperopt, another Python library for parameter optimization over complex search\
    \ spaces; and Talos, a tool specifically tailored for Keras. However, in"
