    )\ninputs = sagemaker.inputs.CreateModelInput(instance_type=deploy_instance_type_param)\n\
    create_model_step = CreateModelStep(name=\"CensusIncomeModel\", model=model, inputs=inputs)\n\
    ```\n```\n\nThe Model instance encapsulates all the necessary configurations to\
    \ deploy and run the model. We can see that model_data is taken from the top-performing\
    \ model resulting from the tuning step.\n\nThe pipeline steps we've defined so\
    \ far will produce processed data and train a tuned model. The layout for the\
    \ processed data in S3 is shown in Figure 9.3:\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_200_0.png)\n\
    \nFigure 9.3 – S3 directory layout for the results of the processing jobs"
