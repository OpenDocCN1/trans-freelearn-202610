- pgno: 201
  md: "We could proceed to the deployment step if we needed to. However, we will follow\
    \ best practice and add quality gates to our pipeline that check the model's performance\
    \ and bias and produce insights into its function.\n\n# ## Evaluation, bias, and\
    \ explainability\n\nSo far, we've seen the general pattern of adding steps to\
    \ a SageMaker pipeline: set up the configuration using SageMaker's configuration\
    \ classes and then create the relevant pipeline step.\n\n# ## Bias configuration\n\
    \nTo add bias checks to our pipeline, we must create the following configuration:\n\
    \n```\nbias_config = clarify.BiasConfig(\n    label_values_or_threshold=[1], facet_name=\"\
    Sex\", facet_values_or_\n    threshold=[0], group_name=\"Age\"\n)\nmodel_predictions_config\
    \ = sagemaker.clarify.\nModelPredictedLabelConfig(probability_threshold=0.5)\n\
    model_bias_check_config = ModelBiasCheckConfig(\n    data_config=model_bias_data_config,\n\
    \    data_bias_config=bias_config,\n    model_config=model_config,\n    model_predicted_label_config=model_predictions_config,\n\
    \    methods=[\"DPPL\"]\n)\n```\n\nBiasConfig describes which facets (features)\
    \ we want to check for bias. We’ve selected Sex and Age, which are always essential\
    \ facets to check when working with demographic data.\n\nModelBiasCheckConfig\
    \ wraps the data configuration, model configuration, and bias confirmation for\
    \ the bias check step. It also sets the method to use for the bias check. Here,\
    \ we use the **difference in positive proportions in predicted labels (DPPL)**.\n\
    \nThe DPPL is a metric that's used to gauge if a model predicts outcomes differently\
    \ for varying facets of data. The DPPL is calculated as the difference between\
    \ the proportion of positive predictions for facet “a” and facet “d”. It helps\
    \ assess whether there's bias in the model predictions after training by comparing\
    \ them with the initial bias present in the dataset. For instance, if a model\
    \ predicting eligibility for a home loan predicts positive outcomes for 70% of\
    \ male applicants (facet “a”) and 60% for female applicants (facet “d”), the 10%\
    \ difference could indicate bias against facet “d”.\n\nThe DPPL formula is represented\
    \ as follows:\n\n```\nDPPL = q'_a - q'_d\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "Here, \\( q'_a \\) is the predicted proportion of facet “a” receiving a positive\
    \ outcome, and \\( q'_d \\) is the analogous proportion for facet “d”. For binary\
    \ and multicategory facet labels, normalized DPPL values fall between [-1, 1],\
    \ while continuous labels vary over the interval \\( (-\\infty, +\\infty) \\).\
    \ A positive DPPL value suggests a higher proportion of positive predictions for\
    \ facet “a” versus “d”, indicating a positive bias. Conversely, a negative DPPL\
    \ indicates a higher proportion of positive predictions for facet “d” signifying\
    \ a negative bias. A DPPL near zero points to a relatively equal proportion of\
    \ positive predictions for both facets, with a value of zero implying perfect\
    \ demographic parity.\n\nYou can add the bias check to the pipeline using ClarifyCheckStep:\n\
    \n```\nmodel_bias_check_step = ClarifyCheckStep(\n    name=\"ModelBiasCheck\"\
    ,\n    clarify_check_config=model_bias_check_config,\n    check_job_config=check_job_config,\n\
    \    skip_check=skip_check_model_bias_param,\n    register_new_baseline=register_new_baseline_model_bias_param,\n\
    \    supplied_baseline_constraints=supplied_baseline_constraints_model_\n    bias_param\n\
    )\n```\n\n# Explainability configuration\n\nThe configuration for explainability\
    \ is very similar. Instead of creating BiasConfig, we must create SHAPConfig:\n\
    \n```\nshap_config = sagemaker.clarify.SHAPConfig(\n    seed=829,\n    num_samples=100,\n\
    \    agg_method=\"mean_abs\",\n    save_local_shap_values=True\n)\n```\n\nAlongside\
    \ SHAPConfig, we must create ModelExplainabilityCheckConfig to calculate the SHAP\
    \ values and create an explainability report:\n\n```\nmodel_explainability_config\
    \ = ModelExplainabilityCheckConfig(\n    data_config=model_explainability_data_config,\n\
    \    model_config=model_config,\n    explainability_config=shap_config\n)\n```\n\
    \nEverything is then combined using ClarifyCheckStep:\n\n```\nmodel_explainability_step\
    \ = ClarifyCheckStep(\n    name=\"ModelExplainabilityCheck\",\n    clarify_check_config=model_explainability_config,\n\
    ```"
  merge: -1
  img_proc: true
