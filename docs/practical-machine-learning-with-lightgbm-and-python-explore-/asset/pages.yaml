- pgno: 174
  md: "in the dataset. The transformer accepts a list of tuples in the form (name,\
    \ transformer, columns). It applies the sub-transformers to the specified columns\
    \ and concatenates the results such that all resultant features form part of the\
    \ same result set.\n\nFor example, consider the following DataFrame and ColumnTransformer:\n\
    \n```\ndf = pd.DataFrame({\n    \"price\": [29.99, 99.99, 19.99],\n    \"description\"\
    : [\"Luxury goods\", \"Outdoor goods\",\n    \"Sports equipment\"],\n})\n\nct\
    \ = ColumnTransformer(\n    [(\"scaling\", MinMaxScaler(), [\"price\"]),\n   \
    \ (\"vectorize\", TfidfVectorizer(), \"description\")])\n\ntransformed = ct.fit_transform(df)\n\
    ```\n\nHere, we have a DataFrame with two columns: price and description. A column\
    \ transformer is created with two sub-transformers: a scaling transformer and\
    \ a vectorizer. The scaling transformer applies min-max scaling only to the price\
    \ column. The vectorizer applies TF-IDF vectorization only to the description\
    \ column. When fit_transform is called, a single array is returned with a column\
    \ for the scaled price and the columns representing the word vectors.\n\n> **Note**\n\
    > \n> TF-IDF, or term frequency-inverse document frequency, is just one way of\
    \ extracting a feature from text. Analyzing and extracting features from text,\
    \ and natural language processing in general, is a broad field within ML that\
    \ we won't be delving into deeply here. You are encouraged to read further on\
    \ the topic at https://scikit-learn.org/stable/modules/feature_extraction.html#text-feature-extraction.\n\
    \nWe can set up our preprocessing for the Customer Churn dataset as a single ColumnTransformer.\
    \ We first define the two individual transformers, id_transformer and encode_transformer,\
    \ that apply to the ID columns and the categorical features:\n\n```\nid_transformer\
    \ = (\n    \"customer_id\",\n    CustomerIdTransformer(id_columns),\n    id_columns\n\
    )\n\nencode_transformer = (\n    \"encoder\",\n    OneHotEncoder(sparse_output=False),\n\
    \    categorical_features\n)\n```"
  merge: -1
