    , \"0.1\",\n    \"--test-ratio\", \"0.1\"\n],\ncode=f\"s3://{write_bucket}/{write_prefix}/scripts/preprocessing.\n\
    py\"\n)\n```\n\ninputs and outputs are defined using the ProcessingInput and ProcessingOutput\
