    Now, let’s see how we can solve this problem using scikit-learn.


    # Linear regression with scikit-learn


    Instead of manually modeling, we can use scikit-learn to build a linear regression
    model. As this is our first example, we’ll walk through the code line by line
    and explain what’s happening.


    To start with, we must import the Python tools we are going to use:


    ```

    import numpy as np

    import pandas as pd


    from matplotlib import pyplot as plt

    import seaborn as sns


    from sklearn.linear_model import LinearRegression

    from sklearn.metrics import mean_absolute_error

    ```


