- pgno: 215
  md: '# # LightGBM Models with PostgresML


    In this chapter, we’ll look at a unique MLOps platform called **PostgresML**.
    PostgresML is a Postgres database extension that allows you to train and deploy
    ML models using SQL.


    PostgresML and SQL are a significant departure from the scikit-learn style of
    programming we’ve used throughout this book. However, as we’ll see in this chapter,
    performing ML model development and deployment at the database level has significant
    advantages regarding data movement requirements and inferencing latency.


    The main topics in this chapter are as follows:


    +   - An overview of PostgresML

    +   - Getting started with PostgresML

    +   - A customer churn case study with PostgresML and LightGBM


    # ## Technical requirements


    This chapter includes practical examples of working with PostgresML. Docker will
    be used to set up a PostgresML environment and is recommended to run the examples.
    The code for this chapter is available at https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-10.


    # ## Introducing PostgresML


    PostgresML (https://postgresml.org/) is an extension for Postgres that allows
    practitioners to implement the entire ML life cycle on top of a Postgres database
    for text and tabular data.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'PostgresML utilizes SQL as the interface to train models, create deployments,
    and make predictions. The use of SQL means model and data operations can be combined
    seamlessly and fit naturally into Postgres DB data engineering environments.


    There are many advantages to having a shared data and ML platform. As we saw in
    the previous chapter, with SageMaker, significant effort is spent on moving data
    around. This is a common problem in ML environments where data, especially transactional
    data, lives in production databases, and complex data engineering workflows need
    to be created to extract data from production sources, transform the data for
    ML use, and load the data into a store that’s accessible to the ML platform (such
    as S3 for SageMaker).


    By combining the data store with the ML platform, PostgresML does away with moving
    data from one platform to another, saving significant time, effort, storage, and
    potentially egress costs.


    Further, modeling from live transactional data means that training data is always
    up to date (read directly from the system of record) instead of gated behind a
    refresh. This eliminates errors that stem from working with outdated data or data
    being transformed or loaded incorrectly by ETL jobs.


    # Latency and round trips


    A typical pattern for model deployment, which we’ve illustrated in earlier chapters,
    is deploying models behind a web API. In microservice terms, the model deployment
    is just another service that can be composed of other services to realize the
    overall system goal.


    Deployment as a web service has several advantages. First, interoperability with
    other systems is straightforward via network calls when using web standards such
    as REST. Second, it allows you to independently deploy the model code, isolated
    from the rest of the system, affording resilience and independent scaling.


    However, deploying models as separate services also has a significant downside:
    latency and network round trips.


    Let’s consider an e-commerce example. A common ML problem in e-commerce settings
    is fraud detection. Here is a system architecture diagram of a simple e-commerce
    system:'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/31b70e4a77c3afbe11032f68ab874b02_217_0.png)


    Figure 10.1 – Simplified e-commerce system architecture illustrating the interaction
    between functional services (transaction) and an ML-driven service (fraud detection)


    Considering the architecture in Figure 10.1, the flow for a new transaction proceeds
    as follows:


    +   1. The transaction is sent to the transaction service.

    +   2. The transaction service calls the fraud detection service with the details
    of the new transaction.

    +   3. The fraud detection service receives the new transaction, loads the relevant
    model from model storage (if needed), loads historical data from the transaction
    storage, and responds to the transaction service with the prediction.

    +   4. The transaction service receives the fraud prediction and stores the transaction
    with the relevant classification.


    A few variations on this workflow might exist. However, due to the separation
    of the transaction and fraud detection services, many network round trips have
    to be made to process a new transaction. Making the fraud prediction also requires
    fetching historical data from the transaction storage to feed to the model.


    The networking call latency and round trips add significant overhead to the transaction.
    If the goal is to achieve a low-latency or real-time system, significantly more
    complex architectural components are required – for example, caching for the model
    and transactional data and higher throughput web services.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'With PostgresML, the architecture may be simplified as follows:


    ![](img/31b70e4a77c3afbe11032f68ab874b02_218_0.png)


    Figure 10.2 – Combining the ML services with data storage using PostgresML allows
    for a more straightforward system design


    Although this example is an oversimplification, the point is that significant
    overhead is added to the overall process of leveraging ML models in a service-oriented
    architecture with separate model services.


    Through PostgresML, we can eliminate the need for separate model storage and overheads
    of loading models and, importantly, combine data storage calls and predictions
    into a single call on the data storage layer with no network overhead in between.
    PostgresML’s benchmarks found that the simplified architecture improved performance
    by a factor of 40 within a cloud environment [1].


    However, there are also downsides to this architecture. First, the database is
    now a single point of failure. If the database is unavailable, all models and
    predictive capabilities are also unavailable. Second, the architecture mixes the
    concerns of data storage and ML modeling and inference. Depending on the use case,
    training and deploying ML models has different server infrastructure needs compared
    to serving SQL queries and storing data. The mixture of concerns might force you
    to compromise on one or the other responsibilities or significantly increase database
    infrastructure costs to support all use cases.


    In this section, we introduced PostgresML and explained, at a conceptual level,
    the advantages of combining our data store and ML service. Now, we’ll look at
    practically setting up and getting started with PostgresML, alongside some basic
    functionality.


    # Getting started with PostgresML


    PostgresML, of course, relies on PostgreSQL being installed. PostgresML requires
    PostgreSQL 11, with newer versions also supported. PostgresML also requires Python
    3.7+ to be installed on your system. Both ARM and Intel/AMD architectures are
    supported.'
  merge: -1
  img_proc: true
- pgno: 219
  md: "# Note\n\nThis section provides an overview of the steps and dependencies required\
    \ to start working with PostgresML and the features at the time of writing. For\
    \ up-to-date information, check out the official website: https://postgresml.org/.\
    \ The simplest way to run PostgresML is to use Docker. For more information, check\
    \ out the Quick Start with Docker documentation: https://postgresml.org/docs/guides/setup/quick_start_with_docker.\n\
    \nThe extension can be installed with official package tools (such as APT) or\
    \ compiled from sources. Once all the dependencies and the extension have been\
    \ installed, postgresql.conf must be updated to load the PostgresML library, and\
    \ the database server must be restarted:\n\n```\nshared_preload_libraries = 'pgml,pg_stat_statements'\n\
    sudo service postgresql restart\n```\n\nWith PostgresML installed, the extension\
    \ must be created within the database you plan to use. This can be done in the\
    \ regular PostgreSQL way from a SQL console:\n\n```\nCREATE EXTENSION pgml;\n\
    ```\n\nVerify the installation, like so:\n\n```\nSELECT pgml.version();\n```\n\
    \n# Training models\n\nNow, let's look at the features provided by PostgresML.\
    \ As stated in the introduction, PostgresML has a SQL API. The following code\
    \ examples should be run in a SQL console.\n\nThe extension function for training\
    \ a model is as follows:\n\n```\npgml.train(\n    project_name TEXT,\n    task\
    \ TEXT DEFAULT NULL,\n    relation_name TEXT DEFAULT NULL,\n    y_column_name\
    \ TEXT DEFAULT NULL,\n    algorithm TEXT DEFAULT 'linear',\n    hyperparams JSONB\
    \ DEFAULT '{}'::JSONB,\n    search TEXT DEFAULT NULL,\n    search_params JSONB\
    \ DEFAULT '{}'::JSONB,\n    search_args JSONB DEFAULT '{}'::JSONB,\n    preprocess\
    \ JSONB DEFAULT '{}'::JSONB,\n    test_size REAL DEFAULT 0.25,\n    test_sampling\
    \ TEXT DEFAULT 'random'\n)\n```"
  merge: -1
  img_proc: true
- pgno: 220
  md: "We need to supply `project_name` as the first parameter. PostgresML organizes\
    \ models and deployments into projects, and projects are uniquely identified by\
    \ their names.\n\nNext, we specify the model's `task`: either classification or\
    \ regression. `relation_name` and `y_column_name` set up the data for the training\
    \ run. The relation is the table or view where the data is defined, and the Y\
    \ column's name specifies the target column within the relation.\n\nThese are\
    \ the only required parameters for training. Training a linear model (the default)\
    \ can be done as follows:\n\n```\n```sql\nSELECT * FROM pgml.train(\n    project_name\
    \ => 'Regression Project',\n    task => 'regression',\n    relation_name => pgml.diabetes',\n\
    \    y_column_name => 'target'\n);\n```\n```\n\nWhen `pgml.train` is called, PostgresML\
    \ copies the data into the `pgml` schema: this ensures all training runs are reproducible\
    \ and enables training to be rerun using different algorithms or parameters but\
    \ the same data. `relation_name` and `task` are also only required the very first\
    \ time training is done for a project. To train a second model for a project,\
    \ we can simplify the training call like so:\n\n```\n```sql\nSELECT * FROM pgml.train(\n\
    \    'Regression Project ',\n    algorithm => 'lightgbm'\n);\n```\n```\n\nWhen\
    \ calling this code, a LightGBM regression model is trained on the same data.\n\
    \nThe algorithm parameter sets the learning algorithm to use. PostgresML supports\
    \ various algorithms, including LightGBM, XGBoost, scikit-learn's random forests\
    \ and extra trees, **support vector machines (SVMs)**, linear models, and unsupervised\
    \ algorithms such as K-means clustering.\n\nBy default, 25% of the data is used\
    \ as a test set, and the test data is selected at random. This can be controlled\
    \ with the `test_size` and `test_sampling` parameters. Alternative test sampling\
    \ methods select data from the first or last rows.\n\n# ## Hyperparameter optimization\n\
    \nPostgresML supports performing **hyperparameter optimization (HPO)** during\
    \ the training run. The search parameters control the HPO process. Two search\
    \ strategies are supported via `search`: grid search and random search. To set\
    \ the hyperparameter ranges for the HPO, a JSON object is used with the `search_params`\
    \ parameter. HPO parameters are specified using `search_args`. Here's an example:\n\
    \n```\n```sql\nSELECT * FROM pgml.train('Regression Project',\n```\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "```\nalgorithm => 'lightgbm',\nsearch => 'random',\nsearch_args => '{ \"n_iter\"\
    : 100 }',\nsearch_params => '{\n\t\"learning_rate\": [ 0.001, 0.1, 0.5 ],\n\t\"\
    n_estimators\": [ 20, 100, 200 ]\n}',\n);\n```\n\n# Preprocessing\n\nPostgresML\
    \ also supports performing certain types of preprocessing when training a model.\
    \ As with the training data and configuration, the preprocessing is also stored\
    \ with the project, so the same preprocessing can be applied when using a model\
    \ for predictions.\n\nRegarding pre-processing, PostgresML supports encoding categorical\
    \ variables, imputing missing values, and scaling numerical values. Preprocessing\
    \ rules are set using a JSON object via the preprocess parameter, as follows:\n\
    \n```\nSELECT pgml.train(\n...\npreprocess => '{\n\t\"model\": {\"encode\": {\"\
    ordinal\": [\"Ford\", \"Kia\",\n\t\"Volkswagen\"]}},\n\t\"price\": {\"impute\"\
    : \"mean\", scale: \"standard\"}\n\t\"fuel_economy\": {\"scale\": \"standard\"\
    }\n}',\n);\n```\n\nHere, we applied ordinal encoding for the model feature. Alternatively,\
    \ PostgresML also supports one-hot encoding and target encoding. We also imported\
    \ missing values (as indicated by NULL in the column) using the mean of the price\
    \ and applied standard (normal) scaling to the price and the fuel economy features.\n\
    \n# Deploying and prediction\n\nPostgresML automatically calculates appropriate\
    \ metrics on the test set after training, including R², the F1 score, precision,\
    \ recall, ROC_AUC, accuracy and log loss. PostgresML will then automatically deploy\
    \ the model after training if the key metric for the model (R² for regression\
    \ and F1 for classification) improves over the currently deployed model.\n\nHowever,\
    \ deployments can also be managed manually for a project with the pgml.deploy\
    \ function:\n\n```\npgml.deploy(\nproject_name TEXT,\n```"
  merge: -1
  img_proc: true
- pgno: 222
  md: "```\n```\nstrategy TEXT DEFAULT 'best_score',\n algorithm TEXT DEFAULT NULL\n\
    \ )```\n```\n\nThe deployment strategies supported by PostgresML are best_score,\
    \ which immediately deploys the model with the best key metrics; most_recent,\
    \ which deploys the most recently trained model; and rollback, which rolls back\
    \ the current deployment to the previously deployed model.\n\nWith a model deployed,\
    \ predictions can be made with the pgml.predict function:\n\n```\n```\npgml.predict\
    \ (\n project_name TEXT,\n features REAL[]\n )```\n```\n\nThe pgml.predict function\
    \ accepts the project name and the features for prediction. Features may be either\
    \ arrays or composite types.\n\n# ## PostgresML dashboard\n\nPostgresML provides\
    \ a web-based dashboard for a more accessible interface to PostgresML features.\
    \ The dashboard is deployed separately from PostgreSQL and is not required for\
    \ administration or fully utilizing PostgresML features as all functionality is\
    \ also accessible via SQL queries.\n\nThe dashboard provides access to a list\
    \ of projects, models, deployments, and data snapshots. More details can also\
    \ be found on trained models via the dashboard, including hyperparameter settings\
    \ and training metrics:\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_222_0.png)\n\
    \n# **Figure 10.3 – PostgresML dashboard showing a list of trained models**\n\n\
    Besides offering a view of projects, models, and deployments, the dashboard also\
    \ allows the creation of SQL notebooks, similar to Jupyter Notebooks. These SQL\
    \ notebooks provide a simple interface to interact with PostgresML if another\
    \ SQL console is not readily available."
  merge: -1
  img_proc: true
- pgno: 223
  md: "This concludes our section on getting started with PostgresML. Next, we’ll\
    \ look at an end-to-end case study of training and deploying a PostgresML model.\n\
    \n# Case study – customer churn with PostgresML\n\nLet’s revisit the customer\
    \ churn problem for a telecommunications provider. As a reminder, the dataset\
    \ consists of customers and their account and cost information associated with\
    \ the telecommunication provider.\n\n# Data loading and preprocessing\n\nOur data\
    \ will typically already be available within the PostgreSQL database in a real-world\
    \ setting. However, for our example, we will start by loading the data. First,\
    \ we must create the table the data is loaded into:\n\n```\nCREATE TABLE pgml.telco_churn\n\
    (\n    customerid   VARCHAR(100),\n    gender       VARCHAR(100),\n    seniorcitizen\
    \ BOOLEAN,\n    partner      VARCHAR(10),\n    dependents   VARCHAR(10),\n   \
    \ tenure       REAL,\n    ...\n    monthlycharges VARCHAR(50),\n    totalcharges\
    \   VARCHAR(50),\n    churn         VARCHAR(10)\n);\n```\n\nNote that in our table\
    \ structure, for a few of our columns, the types do not match what we may expect:\
    \ for example, monthly and total charges should be real values. We’ll address\
    \ this during our preprocessing.\n\nNext, we can load our CSV data into the table.\
    \ PostgreSQL provides a COPY statement for this purpose:\n\n```\nCOPY pgml.telco_churn\
    \ (customerid,\n                        gender,\n                        seniorcitizen,\n\
    \                        partner,\n                        ...\n             \
    \           streamingtv,\n                        streamingmovies,\n         \
    \               contract,\n                        paperlessbilling,\n       \
    \                 paymentmethod,\n```"
  merge: -1
  img_proc: true
