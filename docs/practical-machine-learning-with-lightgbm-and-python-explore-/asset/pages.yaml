- pgno: 58
  md: '# ## Gradient-boosted decision tree hyperparameters


    In addition to the parameters for standard decision tree training, the following
    new hyperparameters are available in scikit-learn specific to gradient-boosted
    trees:


    +   - n_estimators: Controls the number of trees in the ensemble. Generally, more
    trees are better. However, a point of diminishing returns is often reached, and
    overfitting occurs when there are too many trees.


    +   - learning_rate: Controls the contribution of each tree to the ensemble. Lower
    learning rates lead to longer training times and may require more trees to be
    built (larger values for n_estimators). Setting learning_rate to a very large
    value may cause the optimization to miss optimum points and must be combined with
    fewer trees.


    A complete list of scikit-learn gradient-boosting hyperparameters can be found
    at https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html.


    # ## Gradient boosting in scikit-learn


    The details of gradient boosting are mathematical and complicated; fortunately,
    the algorithm is as accessible as any other via scikit-learn. The following is
    an example of a GradientBoostingClassifier class in scikit-learn, again using
    the Forest CoverType dataset we used earlier in the chapter to train a random
    forest classifier.


    The classifier is also imported from the ensemble package, like so:


    ```

    from sklearn.ensemble import GradientBoostingClassifier

    ```


    We fetch and split the data as before and then fit the model, as follows:


    ```

    dataset = datasets.fetch_covtype()


    X_train, X_test, y_train, y_test = train_test_split(dataset.data,

    dataset.target, random_state=179)

    booster = GradientBoostingClassifier(random_state=179, min_samples_

    leaf=3, min_samples_split=3, learning_rate=0.13, n_estimators=180)

    booster = booster.fit(X_train, y_train)

    print(f1_score(y_test, booster.predict(X_test), average="macro"))

    ```


    Running the preceding code should produce an F1 score of 0.7119, a score that''s
    significantly worse than even a standard decision tree. We can spend time optimizing
    our hyperparameters to improve performance. However, there is a more significant
    issue. The previous code takes very long to execute— in the order of 45 minutes
    on our hardware—compared to ExtraTrees, which takes approximately 3 minutes.'
