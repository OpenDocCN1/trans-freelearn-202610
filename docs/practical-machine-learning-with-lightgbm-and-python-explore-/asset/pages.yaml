  md: "```\nheaders={ \"WWW-Authenticate\": \"Basic\" },\n        )\n    return username\n\
    ```\n\nIf the credentials are invalid, we throw an exception with HTTP status\
    \ code 401, signaling that the consumer is not authorized.\n\nOur API endpoint\
    \ is now fully implemented, secured, and ready for deployment. To deploy our API,\
