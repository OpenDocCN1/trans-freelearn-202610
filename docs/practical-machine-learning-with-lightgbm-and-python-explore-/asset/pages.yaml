  md: '![](img/31b70e4a77c3afbe11032f68ab874b02_52_0.png)


    Figure 2.2 – Illustration of the gradient-boosting process; in each iteration,
    a new regression tree is added to compensate for the error residuals of the previous
    iteration


    One of the critical questions relates to how we can determine the changes that
    reduce the error residuals. Gradient boosting solves the error minimization problem
    by applying a widely used optimization problem: gradient descent.


    # Gradient descent


    Gradient descent is an optimization algorithm that attempts to find the optimal
    parameters to minimize a loss function. The parameters are updated iteratively
    by taking small steps in the direction of the negative gradient of the loss function
    (thereby decreasing the function value). A loss function is similar in concept
    to an error function but has two important properties, as outlined here:


    +   • A loss function produces a numeric value that quantifies the model’s performance
    or precisely how poorly a model is doing. A good loss function produces significantly
    different output for'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'models with different performances. Some error functions can also be used as
    loss functions— for example, **mean squared error (MSE)**.


    +   The second property is that a loss function must be differentiable, specifically
    in the context of gradient descent. An example of an error function that''s not
    differentiable is the F1 score. The F1 score may produce a numeric value of the
    model''s performance, but it is not differentiable and cannot be used as a loss
    function.


    The process for gradient descent can then, be defined as follows. Suppose we have
    a loss function $L$ defined for parameters $x$. For an initial set of parameters,
    the loss is calculated as $L(x_0)$. Gradient descent proceeds iteratively to minimize
    the loss function:


    ```

    $L(x_{n+1}) < L(x_n)$

    ```


    To update the parameters, we take a step in the direction of the negative gradient
    of $L$. We can specify the gradient descent update rule as follows:


    ```

    $x_{n+1} = x_n - \gamma_n \nabla L(x_n)$

    ```


    Here, $\gamma_n$ is the **learning rate**, which defines the step size, and $\nabla
    L(x_n)$ is the gradient of $L$ at $x_n$.


    The graph in Figure 2.3 illustrates the gradient descent process:


    ![](img/31b70e4a77c3afbe11032f68ab874b02_53_0.png)


    Figure 2.3 – Graph showing the gradient descent process to find the minimum of
    a function


    Choosing an appropriate learning rate is critical to gradient descent’s success.
    If the learning rate is too low, the optimization will be very slow, potentially
    not reaching a minimum in the allowed number of iterations. A small learning rate
    could also lead to the process getting stuck in a local minimum:'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'the step size being too small to escape. Conversely, suppose the learning rate
    is too large. In that case, we could step over the minimum and miss it entirely
    or get stuck oscillating around a minimum (constantly jumping back and forth but
    never descending to the optimal value).


    # Gradient boosting


    Now that we understand how gradient descent works, we can see how it is applied
    in gradient boosting. We will work through the entire gradient-boosting algorithm
    in detail at the hand of a small example. In our example, we’ll use a regression
    tree, as it is a bit easier to understand than the case for classification.


    # Gradient-boosting algorithm


    The gradient-boosting algorithm is defined as follows, where _M_ is the number
    of boosted trees [3]:


    +   1. Given training data \(\{(x_p, y_p)\}_{i=1}^n\), containing _n_ training
    samples (defined by features _x<sub>i</sub>_ and target _y<sub>i</sub>_) and a
    differentiable loss function _L_(_y<sub>p</sub>, F_(_x_)), where _F_(_x_) are
    the predictions from model _F_.

    +   2. Initialize the model with a constant prediction value _F_<sub>0</sub>(_X_)
    = \(\text{argmin}_\gamma \sum_{i=1}^n L(y_i, \gamma)\)

    +   3. For _m_ = 1 to _M_:

    +      Compute pseudo residuals \(r_{im} = -[\frac{\partial L(y_i, F(x_i))}{\partial
    F(x_i)}]_{F(x)=F_{m-1}(x)} for i = 1, ..., n\)

    +      Fit a regression tree to the _r<sub>im</sub>_ values and create terminal
    regions _R<sub>jm</sub>_ for _j_ = 1..._J<sub>m</sub>_

    +      For _j_ = 1..._J<sub>m</sub>_ compute \(\gamma_{jm} = \text{argmin}_\gamma
    \sum_{x_i \in R_j} L(y_i, F_{m-1}(x_i) + \gamma)\)

    +      Update _F<sub>m</sub>_(_x_) = _F_<sub>_m_-1</sub>(_x_) + \(\nu \sum_{j=1}^{J_m}
    \gamma_{jm} I(x \in R_{jm})\)

    +   4. Result: _F<sub>M</sub>_(_x_)


    Although the algorithm and especially the mathematics might look intimidating,
    it is practically much more straightforward than it appears. We’ll go through
    the algorithm step by step. Consider the following toy dataset:


    | Gender | Fasting Blood Sugar | Waist Circumference | BMI | LDL Cholesterol |

    |---|---|---|---|---|

    | Male | 105 | 110 | 29.3 | 170 |

    | Female | 85 | 80 | 21 | 90 |

    | Male | 95 | 93 | 26 | 113 |


    Table 2.2 – Example dataset consisting of a patient’s physical measurements and
    measured low-density lipoprotein (LDL) cholesterol


    Given the physical measurements, we aim to predict a patient’s LDL cholesterol.


    The preceding table defines our training data \(\{(x_p, y_p)\}_{i=1}^n\), where
    _x_ is the features (blood sugar, waist circumference, BMI) and _y_ is the target:
    LDL cholesterol.'
