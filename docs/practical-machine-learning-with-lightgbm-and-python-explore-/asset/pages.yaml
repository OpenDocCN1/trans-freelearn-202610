- pgno: 195
  md: "The script we’ll be using is a regular Python script with a main function.\
    \ We’ll use scikit-learn to do our preprocessing. The preprocessing script hasn’t\
    \ been entirely reproduced here but is available in our source code repository.\
    \ Notably, when the pipeline executes the step, the data is retrieved from S3\
    \ and added to a local staging directory on the preprocessing instance. From here,\
    \ we can read the data using standard pandas tooling:\n\n```\nlocal_dir = \"/opt/ml/processing\"\
    \ninput_data_path = os.path.join(\"/opt/ml/processing/census-income\",\n     \
    \                          \"census-income.csv\")\n\nlogger.info(\"Reading claims\
    \ data from {} \".format(input_data_path))\ndf = pd.read_csv(input_data_path)\n\
    ```\n\nSimilarly, after processing is complete, we can write the results to a\
    \ local directory, from which SageMaker retrieves it and uploads it to S3:\n\n\
    ```\ntrain_output_path = os.path.join(f\"{local_dir}/train\", \"train.csv\")\n\
    X_train.to_csv(train_output_path, index=False)\n```\n\nWith a preprocessing script\
    \ defined, we need to upload it to S3 for the pipeline to be able to use it:\n\
    \n```\ns3_client.upload_file(\n    Filename=\"src/preprocessing.py\", Bucket=write_bucket,\n\
    \    Key=f\"{write_prefix}/scripts/preprocessing.py\"\n)\n```\n\nWe can define\
    \ the preprocessing step as follows. First, we must create an SKLearnProcessor\
    \ instance:\n\n```\nsklearn_processor = SKLearnProcessor(\n    framework_version=\"\
    0.23-1\",\n    role=sagemaker_role,\n    instance_count=1,\n    instance_type=process_instance_type,\n\
    \    base_job_name=f\"{base_job_name_prefix}-processing\",\n)\n```\n\nSKLearnProcessor\
    \ handles the processing task for jobs that require scikit-learn. We specify the\
    \ scikit-learn framework version and the instance type and count we defined earlier.\n\
    \nThe processor is then added to ProcessingStep for use in the pipeline:\n\n```\n\
    process_step = ProcessingStep(\n    name=\"DataProcessing\",\n    processor=sklearn_processor,\n\
    \    inputs=[...],\n    outputs=[...],\n)\n```"
