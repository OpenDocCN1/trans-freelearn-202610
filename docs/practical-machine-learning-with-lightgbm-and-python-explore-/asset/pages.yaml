- pgno: 186
  md: '# AWS


    AWS is one of the leading players in the global cloud computing marketplace. AWS
    offers many cloud-based products and services, including databases, machine learning
    (ML), analytics, networking, storage, developer tools, and enterprise applications.
    The idea behind AWS is to offer businesses an affordable and scalable solution
    to their computing needs, regardless of their size or industry.


    A key advantage of AWS is elasticity, meaning servers and services can be stopped
    and started quickly and at will, scaling from zero machines to thousands. The
    elasticity of the services goes hand in hand with its primary pricing model of
    pay-as-you-go, meaning customers only pay for the services and resources they
    use without any upfront costs or long-term contracts. This elasticity and pricing
    allow businesses to scale computing needs as needed, on an ad hoc and granular
    level, and then only pay for what they use. This approach has transformed how
    businesses scale IT resources and applications, enabling them to react quickly
    to changing business needs without incurring the heavy costs traditionally associated
    with hardware and software procurement and maintenance.


    Another advantage is the global reach of AWS. AWS services are available in many
    regions across the globe. Regions are geographically separated, and each region
    is further divided into availability zones. The region-zone setup allows users
    to create globally distributed and redundant infrastructure to maximize resiliency
    and architect for disaster recovery. The regional data centers also allow users
    to create servers and services close to end users, minimizing latency.


    # Core services


    The core AWS services provide computing, networking, and storage capability. AWS''s
    compute services include Amazon Elastic Compute Cloud (EC2), which offers configurable
    virtual machines to customers, and AWS Lambda, a serverless compute platform that
    allows you to run code without the need to provision and manage servers. In ML,
    both EC2 instances and Lambda functions are often used to train and validate or
    serve models via API endpoints. The elastic nature of EC2 servers allows ML engineers
    to scale up training servers to many thousands, which can significantly speed
    up training or parameter-tuning tasks.


    AWS''s storage and database services, such as Amazon Simple Storage Service (S3)
    and Amazon RDS (Relational Database Service), offer reliable, scalable, and secure
    data storage solutions. These services manage storage infrastructure and offer
    high-level features such as backups, patch management, and vertical and horizontal
    scaling. S3 is a widely used service for data engineering and ML. S3 offers low-cost,
    highly redundant secure storage that scales beyond exabytes.


    AWS also offers data warehousing solutions with Amazon Redshift. Large enterprises
    frequently use Redshift as a warehouse or the basis of a data lake, meaning it''s
    often a data source for ML solutions.


    AWS also offers networking services to help businesses meet complex networking
    and isolation needs. AWS Direct Connect allows customers to set up a dedicated
    network connection from a customer''s site to the AWS cloud. Routing and name
    servers can be managed with Amazon Route 53, a flexible and scalable Domain Name
    System (DNS) service.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'However, chief among the network services is **Amazon Virtual Private Cloud
    (VPC)**. VPCs offer customers the ability to configure completely isolated virtual
    networks. Customers can granularly configure subnetworks, routing tables, address
    ranges, gateways, and security groups. VPCs allow users to isolate their environment
    and cloud resources and control inbound and outbound traffic for increased security
    and privacy.


    # Security


    A critical piece of any infrastructure equation is security. In terms of security,
    AWS provides a highly secure, scalable, and flexible cloud computing environment.
    AWS’s security services, including **AWS Identity and Access Management (IAM)**
    and **Amazon Security Hub**, help customers protect their data and applications
    by implementing robust security measures.


    AWS also complies with multiple international and industry-specific compliance
    standards, such as GDPR, HIPAA, and ISO 27001. Further, in terms of data governance,
    AWS makes it easy to comply with data residency and privacy requirements. Due
    to the regional structure of AWS, data can remain resident in specific countries,
    while engineers have access to the full suite of AWS services.


    # Machine learning


    AWS also offers services focused on ML and **artificial intelligence (AI)**. Among
    these are many fully managed services for specific ML tasks. **AWS Comprehend**
    offers many **natural language processing (NLP)** services, such as document processing,
    named entity recognition, and sentiment analysis. **Amazon Lookout** is a service
    for anomaly detection in equipment, metrics, or images. Further, **Amazon Rekognition**
    offers services for machine vision use cases such as image classification and
    facial recognition.


    Of particular interest to us is **Amazon SageMaker**, a complete ML platform that
    allows us to create, train, and deploy ML models in the Amazon cloud. The following
    section discusses SageMaker in detail.


    # SageMaker


    **Amazon SageMaker** is an end-to-end ML platform that allows data scientists
    to work with data and develop, train, deploy, and monitor ML models. SageMaker
    is fully managed, so there is no need to provision or manage servers.


    The primary appeal of Amazon SageMaker lies in its comprehensive nature as a platform.
    It encompasses all aspects of the ML process, including data labeling, model building,
    training, tuning, deployment, management, and monitoring. By taking care of these
    aspects, SageMaker allows developers and data scientists to focus on the core
    ML tasks instead of managing the infrastructure.


    As we have discussed, the ML life cycle starts with data gathering, which often
    requires manual data labeling. For this, SageMaker provides a service called **SageMaker
    Ground Truth**. This service makes it easy to annotate ML datasets efficiently.
    It can significantly reduce the time and costs typically associated with data
    labeling by using automated labeling workflows, and it also offers a workforce
    for'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'manual data labeling tasks. Further, SageMaker also provides the Data Wrangler
    service, which helps with data preparation and exploratory data analysis (EDA).
    Data Wrangler provides functionality to query data from S3, Redshift, and other
    platforms and then cleanse, visualize, and understand the data from a single visual
    interface.


    SageMaker provides a fully managed service for the model training phase that can
    handle large-scale, distributed model training via Training Jobs. The service
    is designed to be flexible and adaptable, allowing users to optimize their ML
    models as needed. Users only need to specify the location of their data, typically
    S3 and the ML algorithm, and SageMaker takes care of the rest of the training
    process. The model training service fully leverages the elastic nature of the
    underlying AWS infrastructure: many servers can be created quickly to perform
    training jobs and discarded after training is complete to save costs.


    This paradigm also extends to hyperparameter tuning. To simplify hyperparameter
    optimization, SageMaker provides an automatic model-tuning feature. Many tuning
    algorithms are provided, such as Optuna or FLAML, and tuning can be run across
    multiple servers.


    SageMaker also has support for a more fully AutoML experience via SageMaker Autopilot.
    Autopilot is a service that enables automatic model creation. A user only needs
    to provide the raw data and set the target; then, Autopilot automatically explores
    different solutions to find the best model. Autopilot provides complete visibility
    into the process so that data scientists can understand how the model is created
    and make any necessary adjustments.


    Once a model has been trained and optimized, it must be deployed. SageMaker simplifies
    this process by providing a one-click deployment process. Users can quickly deploy
    their models to production with auto-scaling capabilities without worrying about
    the underlying infrastructure. This deployment autoscaling capability allows users
    to set metrics-based policies that increase or decrease backing servers. For instance,
    the deployment can be scaled up if the number of invocations within a period exceeds
    a specific threshold. SageMaker ensures the high availability of models and allows
    for A/B testing of models to compare different variants and decide on the best
    one. SageMaker also supports multi-model endpoints, allowing users to deploy multiple
    models on a single endpoint.


    Amazon SageMaker also provides capabilities to monitor the model''s performance
    and conduct analysis once deployed. SageMaker Model Monitor monitors the quality
    of deployed models continuously (for real-time endpoints) or in batches (for asynchronous
    jobs). Alerts can be defined to notify the user if metric thresholds are exceeded.
    Model Monitor can monitor data drift and model drift based on metrics such as
    accuracy.


    Finally, SageMaker is both a platform within AWS and a software SDK. The SDK is
    available in both Python and R. The SageMaker SDK provides a range of built-in
    algorithms and frameworks, including support for the most popular algorithms in
    the ML community, such as XGBoost, TensorFlow, PyTorch, and MXNet. It also supports
    a marketplace where users can choose from a vast collection of algorithm and model
    packages shared by AWS and other SageMaker users.'
