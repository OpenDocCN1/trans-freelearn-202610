    # # Getting started with LightGBM in Python


    LightGBM is implemented in C++ but has official C, R, and Python APIs. This section
    discusses the Python APIs that are available for working with LightGBM. LightGBM
    provides three Python APIs: the standard **LightGBM** API, the **scikit-learn**
    API (which is fully compatible with other scikit-learn functionality), and a **Dask**
    API for working with Dask. Dask is a parallel computing library discussed in Chapter
    11, Distributed and GPU-Based Learning with LightGBM (https://www.dask.org/).


    Throughout the rest of the book, we mainly use the scikit-learn API for LightGBM,
    but let’s first look at the standard Python API.


    # ## LightGBM Python API


    The best way to dive into the Python API is with a hands-on example. The following
    are excerpts from a code listing that illustrates the use of the LightGBM Python
    API. The complete code example is available at https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-3.


    LightGBM needs to be imported. The import is often abbreviated as lgb:


    ```

    import lightgbm as lgb

    ```


    LightGBM provides a Dataset wrapper class to work with data. Dataset supports
    a variety of formats. Commonly, it is used to wrap a numpy array or a pandas DataFrame.
    Dataset also accepts a Path to a CSV, TSV, LIBSVM text file, or LightGBM Dataset
    binary file. When a path is supplied, LightGBM loads the data from the disk.


    Here, we load our Forest Cover dataset from sklearn and wrap the numpy arrays
    in a LightGBM Dataset:


    ```

    dataset = datasets.fetch_covtype()

    X_train, X_test, y_train, y_test = train_test_split(dataset.data,

    dataset.target, random_state=179)

    training_set = lgb.Dataset(X_train, y_train - 1)

    test_set = lgb.Dataset(X_test, y_test - 1)

    ```


    We subtract 1 from the y_train and y_test arrays because the classes supplied
    by sklearn are labeled in the range [1, 7], whereas LightGBM expects zero-indexed
    class labels in the range [0, 7].'
