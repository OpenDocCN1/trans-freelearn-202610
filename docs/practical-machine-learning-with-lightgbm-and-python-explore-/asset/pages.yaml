    # Decision tree hyperparameters


    We used some decision tree hyperparameters in the preceding classification and
    regression examples to control overfitting. This section will look at the most
    critical decision tree hyperparameters provided by scikit-learn:


    +   - max_depth: The maximum depth the tree is allowed to reach. Deeper trees
    allow more splits, resulting in more complex trees and overfitting.

    +   - min_samples_split: The minimum number of samples required to split a node.
    Nodes containing only a few samples overfit the data, whereas having a larger
    minimum improves generalization.

    +   - min_samples_leaf: The minimum number of samples allowed in leaf nodes. Like
    the minimum samples in a split, increasing the value leads to less complex trees,
    reducing overfitting.

    +   - max_leaf_nodes: The maximum number of lead nodes to allow. Fewer leaf nodes
    reduce the tree size and, therefore, the complexity, which may improve generalization.

    +   - max_features: The maximum features to consider when determining a split.
    Discarding some features reduces noise in the data, which improves overfitting.
    Features are chosen at random.

    +   - criterion: The impurity measure to use when determining a split, either
    gini or entropy/ log_loss.'
