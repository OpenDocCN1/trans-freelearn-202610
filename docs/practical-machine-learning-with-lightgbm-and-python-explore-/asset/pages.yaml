    \ search_args => '{\"n_iter\": 500 }',\n    search_params => '{\n        \"num_leaves\"\
    : [2, 4, 8, 16, 32, 64]\n    }'\n);\n```\n\nWe set the view as our relation, with\
    \ the churn column being our target feature. For preprocessing, we use the mean\
    \ to ask PostgresML to impute missing values for the totalcharges feature.\n\n\
    We also set up hyperparameter optimization using 500 iterations of a random search\
    \ with the specified search parameter ranges.\n\nAfter completing training, we\
