- pgno: 108
  md: 'the next section, and for the rest of the chapter, we look at Optuna, a framework
    designed to automate tuning machine learning models.


    # Introducing Optuna


    Optuna is an open source **hyperparameter optimization (HPO)** framework designed
    to automate finding the best hyperparameters for machine learning models (https://optuna.org/).
    It is written in Python and can be easily integrated with various machine learning
    libraries, including LightGBM.


    Optuna provides efficient optimization algorithms to search hyperparameter spaces
    more effectively. In addition to the optimization algorithms, Optuna also provides
    pruning strategies to save computational resources and time by pruning poorly
    performing trials.


    Besides optimization and pruning algorithms, Optuna also provides an easy-to-use
    API for defining parameter types (integer, float, or categorical), creating and
    automating resumable optimization studies, and visualizing the results of optimization
    runs. Later in the chapter, we see how to use the API practically.


    # Optimization algorithms


    Optuna provides several efficient optimization algorithms. In this section, we
    focus on two of the available algorithms: a **Tree-Structured Parzen Estimator
    (TPE)** and a **Covariance Matrix Adaptation Evolution Strategy (CMA-ES)** algorithm.


    # TPE


    To understand TPE, we must first know what a Parzen estimator is.


    A Parzen estimator, or **Kernel Density Estimator (KDE)**, is a technique used
    to estimate the probability distribution of a set of data points. It''s a non-parametric
    method, meaning it doesn’t assume any specific underlying distribution for the
    data. Instead, it tries to “learn” the distribution based on the observed data
    points.


    Imagine you have data points and want to know how the data is distributed. One
    way to do this is by placing small “hills” (kernel functions) over each data point.
    These “hills” can have different shapes, such as Gaussian (bell-shaped) or uniform
    (box-shaped). The height of the “hill” at any point represents the likelihood
    that a new data point would fall at that location. The Parzen estimator works
    by adding up all these “hills” to create a smooth landscape representing the estimated
    probability distribution of the data.


    In the case of TPE, the data points we care about are the parameter combinations,
    and the probability distribution is the likelihood of a set of parameters being
    good or bad [1], [2].'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'TPE starts by sampling a few random combinations of hyperparameters and evaluating
    the model''s performance for each. Based on these initial results, TPE divides
    the hyperparameter combinations into two groups: good (those that lead to better
    performance) and bad (those that lead to worse performance):


    +   - l(x): The probability density function of good configurations


    +   - g(x) : The probability density function of bad configurations


    TPE then estimates the probability distributions of hyperparameter combinations
    for both good and bad groups using the Parzen estimator technique.


    With estimations of the probability distributions available, TPE calculates the
    Expected Improvement (EI) of hyperparameter configurations. EI can be calculated
    as the ratio between the two densities: l(x)/g(x). With each trail, the algorithm
    samples new hyperparameter configurations that maximize the EI.


    The tree structure in TPE comes from the algorithm''s ability to handle parameter
    interaction within the hyperparameter search space, where specific hyperparameters''
    relevance depends on others'' values. To handle this, TPE builds a hierarchical
    structure that captures the relationships between different hyperparameters and
    adapts the sampling process accordingly.


    In summary, TPE estimates the distributions of good and bad parameters and uses
    them to find optimal parameters by maximizing new trials'' expected improvement.
    TPE is cost-effective since it approximates the distributions and can search for
    better parameters optimally (in a non-exhaustive way). TPE also handles parameter
    interactions.


    An alternative algorithm provided by Optuna is the CMA-ES algorithm, which we
    discuss next.


    # CMA-ES


    CMA-ES is another optimization algorithm that can be used to find optimal hyperparameters
    [3]. Compared to TPE, CMA-ES is well suited to cases that involve continuous variables
    and when the search space is non-linear and non-convex.


    CMA-ES is an example of an evolutionary algorithm (EA). An EA is a type of optimization
    algorithm inspired by the process of natural evolution. It aims to find the best
    solution to a problem by mimicking how nature evolves species through selection,
    reproduction, mutation, and inheritance. Evolutionary algorithms start with a
    population of candidate solutions and modify the candidates with each subsequent
    generation to adapt more closely to the best solution. This generational process
    is illustrated in Figure 5.2.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/31b70e4a77c3afbe11032f68ab874b02_110_0.png)


    ![](img/31b70e4a77c3afbe11032f68ab874b02_110_1.png)


    ![](img/31b70e4a77c3afbe11032f68ab874b02_110_2.png)


    ![](img/31b70e4a77c3afbe11032f68ab874b02_110_3.png)


    Figure 5.2 – A two-dimensional illustration of candidate solutions (red x marks)
    evolving with each subsequent generation to approximate the global optimum (located
    at the top and center of each landscape). In the context of CMA-ES, each candidate
    solution represents a combination of hyperparameter values, and the algorithm''s
    performance determines the optimum


    Central to the evolutionary process of CMA-ES is the covariance matrix. A covariance
    matrix is a square, symmetric matrix representing the covariance between pairs
    of variables (in the case of CMA-ES, the hyperparameters), providing insight into
    their relationships. The diagonal elements of the matrix represent the variances
    of individual variables, while the off-diagonal elements represent the covariances
    between pairs of variables. When there''s a positive covariance, it signals that
    the variables usually move in the same direction, either increasing or decreasing.
    Conversely, a negative covariance points to a relationship where, as one variable
    rises, the other tends to fall, and vice versa. A covariance of zero suggests
    no linear relationship between the variables.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'CMA-ES applies the evolutionary principles as follows when optimizing hyperparameters:


    +   1. Within the hyperparameter search space, initialize the mean and the covariance
    matrix.


    +   2. Repeat the evolutionary process:


    +   I. Generate a population of candidates from the search space using the mean
    and the covariance matrix. Each candidate represents a combination of hyperparameter
    values.


    +   II. Evaluate the fitness of the candidates. **Fitness** refers to the quality
    of a candidate or how well it solves the optimization problem. With CMA-ES, this
    means training the model on the dataset using the candidate hyperparameters and
    evaluating the performance on the validation set.


    +   III. Select the best candidates from the population.


    +   IV. Update the mean and the covariance matrix from the best candidates.


    +   V. Repeat for a maximum number of trials or until no improvement is seen in
    the population’s fitness.


    CMA-ES performs well in complex search spaces and intelligently samples the search
    space, guided by the covariance matrix. It is beneficial when the hyperparameter
    search space is complex and non-linear or when the evaluation of the validation
    data is noisy (for instance, when a metric is an inconsistent performance indicator).


    Both TPE and CMA-ES address the issues associated with hyperparameter optimization:
    both algorithms effectively search a high-dimensional search space. Both algorithms
    capture parameter interaction. Both algorithms give us control of the cost: we
    can decide our optimization budget and limit our search to that.


    The main differences between TPE and CMA-ES lie in their overall approach. TPE
    is a probabilistic model with a sequential search strategy, compared to CMA-ES,
    which is population-based and evaluates solutions in parallel. This often means
    TPE is more exploitative in its search, while CMA-ES balances exploration and
    exploitation using population control mechanisms. However, TPE is typically more
    efficient than CMA-ES, especially for a small number of parameters.


    Optuna provides further optimization to the search process in pruning ineffective
    trials. We’ll discuss some pruning strategies next.


    # Pruning strategies


    Pruning strategies refer to methods that avoid spending optimization time on unpromising
    trials by pruning these trials from the study. Pruning occurs synchronously with
    the model training process: the validation error is checked during training, and
    the training is stopped if the algorithm is underperforming. In this way, pruning
    is similar to _early stopping_.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Median pruning


    Optuna provides several pruning strategies, one of the simplest being **median
    pruning**. With median pruning, each trial reports an intermediate result after
    n steps. The median of the intermediate results is then taken, and any trials
    below the median of previous trials at the same step are stopped.


    # Successive halving and Hyperband


    A more sophisticated strategy is called **successive halving** [4]. This takes
    a more global approach and assigns a small, equal budget of training steps to
    all trials. Successive halving then proceeds iteratively: at each iteration, the
    performance of each trial is evaluated, and the top half of the candidates are
    selected for the next round, with the bottom half pruned away. The training budget
    is doubled for the next iteration, and the process is repeated. This way, the
    optimization budget is spent on the most promising candidates. As a result, a
    small optimization budget is spent on eliminating the underperforming candidates,
    and more resources are spent on finding the best parameters.


    **Hyperband** is another pruning technique that extends successive halving by
    incorporating random search and a multi-bracket resource allocation strategy [5].
    While successive halving narrows down a set of candidate configurations by iteratively
    pruning underperforming ones and allocating more resources to the remaining promising
    ones, it relies on a fixed initial set of configurations and a single resource
    allocation scheme.


    Hyperband instead uses a multi-bracket resource allocation strategy, which divides
    the total computational budget into several brackets, each representing a different
    level of resource allocation. Within each bracket, successive halving is applied
    to iteratively eliminate underperforming configurations and allocate more resources
    to the remaining promising ones. At the beginning of each bracket, a new set of
    hyperparameter configurations is sampled using random search, which allows Hyperband
    to explore the hyperparameter space more broadly and reduce the risk of missing
    good configurations. This concurrent process enables Hyperband to adaptively balance
    exploration and exploitation in the search process, ultimately leading to more
    efficient and effective hyperparameter tuning.


    Optuna has performed empirical studies of optimization algorithms and corresponding
    pruning strategies (https://github.com/optuna/optuna/wiki/Benchmarks-with-Kurobako).
    Empirically, they found that Hyperband is the best TPE or CMA-ES optimization
    strategy.


    This section gave an overview of the theory and algorithms powering Optuna, focusing
    on TPE, CMA-ES, and advanced pruning strategies. In the next section, we’ll practically
    apply Optuna to a machine learning problem with LightGBM.


    # Optimizing LightGBM with Optuna


    We’ll walk through applying Optuna using a classification example. The problem
    we’ll be modeling is to predict customer churn (Yes/No) for a telecommunications
    provider. The dataset is available from https://github.com/IBM/telco-customer-churn-on-icp4d/tree/master/data.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "The data describes each customer using data available to the provider – for\
    \ example, gender, whether the customer is paying for internet service, has paperless\
    \ billing, pays for tech support, and their monthly charges. The data consists\
    \ of both numeric and categorical features. The data has already been cleaned\
    \ and is balanced, allowing us to focus on the parameter optimization study.\n\
    \nWe start by defining the objective of our parameter study. The objective function\
    \ is called once for each trial. In this case, we want to train a LightGBM model\
    \ on the data and calculate the F1 score. Optuna passes a trial object to the\
    \ objective function, which we can use to set up the parameters for the specific\
    \ trial. The following is an example code snippet that shows how to define an\
    \ objective function with parameters:\n\n```\n```python\ndef objective(trial):\n\
    \    boosting_type = trial.suggest_categorical(\n        \"boosting_type\", [\"\
    dart\", \"gbdt\"])\n    lambda_l1= trial.suggest_float(\n        'lambda_l1',\
    \ 1e-8, 10.0, log=True),\n    ...\n    min_child_samples= trial.suggest_int(\n\
    \        'min_child_samples', 5, 100),\n    learning_rate = trial.suggest_float(\n\
    \        \"learning_rate\", 0.0001, 0.5, log=True),\n    max_bin = trial.suggest_int(\n\
    \        \"max_bin\", 128, 512, 32)\n    n_estimators = trial.suggest_int(\n \
    \       \"n_estimators\", 40, 400, 20)\n```\n```\n\nHere, we can see how we use\
    \ the methods provided by trial to set up the hyperparameters. For each parameter,\
    \ a value is suggested by the optimization algorithm within the range specified.\
    \ We can suggest categorical variables using trial.suggest_categorical (as can\
    \ be seen for the boosting type), and int and float parameters using suggest_int\
    \ and suggest_float, respectively. When suggesting floats or integers, a range\
    \ and, optionally, a step size are specified:\n\n```\n```python\nn_estimators\
    \ = trial.suggest_int(\n    name=\"n_estimators\", low=40, high=400, step=20)\n\
    ```\n```\n\nSetting a step size means the optimization algorithm does not suggest\
    \ any arbitrary value in the range but limits suggestions to the steps between\
    \ the lower and upper bound (40, 60, 80, 100, ..., 400).\n\nWe also have the option\
    \ to log scale the range of possible values by passing log=True for numeric parameters.\
    \ Log scaling the parameter range has the effect that more values are tested close\
    \ to the range's lower bound and (logarithmically) fewer values towards the upper\
    \ bound. Log scaling is particularly well suited to the learning rate where we\
    \ want to focus on smaller values and exponentially increase tested values until\
    \ the upper bound."
  merge: -1
  img_proc: true
- pgno: 114
  md: "To apply pruning when training LightGBM models, Optuna provides a purpose-built\
    \ callback that integrates with the optimization process:\n\n```\npruning_callback\
    \ = optuna.integration.LightGBMPruningCallback(trial,\n\"binary\")\n```\n\nWe\
    \ must specify an error metric when creating the callback, and, in our case, we\
    \ specify \"binary\" for the binary error.\n\nWith the hyperparameters set up,\
    \ we can fit as we usually do, passing the parameters and the callback as we would\
    \ normally:\n\n```\nmodel = lgb.LGBMClassifier(\n    force_row_wise=True,\n  \
    \  boosting_type=boosting_type,\n    n_estimators=n_estimators,\n    lambda_l1=lambda_l1,\n\
    \    lambda_l2=lambda_l2,\n    num_leaves=num_leaves,\n    feature_fraction=feature_fraction,\n\
    \    bagging_fraction=bagging_fraction,\n    bagging_freq=bagging_freq,\n    min_child_samples=min_child_samples,\n\
    \    learning_rate=learning_rate,\n    max_bin=max_bin,\n    callbacks=[pruning_callback],\n\
    \    verbose=-1)\n\nscores = cross_val_score(model, X, y, scoring=\"f1_macro\"\
    )\nreturn scores.mean()\n```\n\nWe train the model using five-fold cross-validation\
    \ with the F1 macro score for scoring. Finally, the objective function returns\
    \ the mean of the F1 scores as the trial evaluation.\n\nWe are ready to start\
    \ an optimization study with the defined objective function. We create a sampler,\
    \ pruner, and the study itself and then call optimize with our objective function:\n\
    \n```\nsampler = optuna.samplers.TPESampler()\npruner = optuna.pruners.HyperbandPruner(\n\
    \    min_resource=10, max_resource=400, reduction_factor=3)\n\nstudy = optuna.create_study(\n\
    \    direction='maximize', sampler=sampler,\n    pruner=pruner\n)\n\nstudy.optimize(objective(),\
    \ n_trials=100, gc_after_trial=True, n_\njobs=-1)\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: 'We use the TPE optimization algorithm as a sampler alongside Hyperband pruning.
    The minimum and maximum resources specified for the Hyperband pruner control the
    minimum and the maximum number of iterations (or estimators) trained per trial.
    When applying pruning, the reduction factor controls how many trials are promoted
    in each halving round.


    The study is created by specifying the optimization direction (maximize or minimize).
    Here, we are optimizing the F1 score, so we want to maximize the value.


    We then call study.optimize and set our optimization budget: n_trials=100. We
    also perform a memory optimization setting, gc_after_trial=True. Performing garbage
    collection (GC) helps ensure the memory is cleaned up after each trial, avoiding
    out-of-memory or memory leak errors. Optuna studies can run trials in parallel.
    Setting n_jobs=-1 runs as many trials as there are CPU cores in parallel.


    After running the optimization, we can get the best trial and parameters by calling
    the following:


    ```

    print(study.best_trial)

    ```


    The preceding example shows how to apply Optuna to find LightGBM hyperparameters
    effectively. Next, we look at some advanced features of the Optuna framework.


    # Advanced Optuna features


    When optimizing hyperparameters for large machine learning problems, the optimization
    process may run for days or weeks. In these cases, saving an optimization study
    and resuming it later is helpful to guard against data loss or migrating the study
    between different machines.


    # Saving and resuming an optimization study


    Optuna supports saving and resuming an optimization study in two ways: **in memory**
    and using a **remote database (RDB)**.


    When a study is run in memory, the standard Python methods for serializing an
    object can be applied. For example, either joblib or pickle may be used. We use
    joblib to save a study:


    ```

    joblib.dump(study, "lgbm-optuna-study.pkl")

    ```


    To restore and resume the study, we deserialize the study object and continue
    with optimization:


    ```

    study = joblib.load("lgbm-optuna-study.pkl")

    study.optimize(objective(), n_trials=20, gc_after_trial=True, n_jobs=-1)

    ```


    The alternative to running the study in memory is to use an RDB. When using an
    RDB, the study’s intermediate (trial) and final results are persisted in a SQL
    database backend. The RDB can be hosted on a separate machine. Any of the SQL
    databases supported by SQL Alchemy may be used (https://docs.sqlalchemy.org/en/20/core/engines.html#database-urls).'
  merge: -1
  img_proc: true
- pgno: 116
  md: "In our example, we use a SQLite database as an RDB:\n\n```\n```\nstudy_name\
    \ = \"lgbm-tpe-rdb-study\"\nstorage_name = f\"sqlite:///{study_name}.db\"\nstudy\
    \ = optuna.create_study(\n    study_name=study_name,\n    storage=storage_name,\n\
    \    load_if_exists=False,\n    sampler=sampler,\n    pruner=pruner)\n```\n```\n\
    \nOptuna manages the connection to the RDB and the persistence of the results.\
    \ After setting up the connection, optimization can proceed as usual.\n\nRestoring\
    \ the study from an RDB backend is straightforward; we specify the same `storage`\
    \ and set `load_if_exists` to True:\n\n```\n```\nstudy = optuna.create_study(study_name=study_name,\
    \ storage=storage_name, load_if_exists=True)\n```\n```\n\n# **Understanding parameter\
    \ effects**\n\nIn many cases, it's also valuable to better understand the effects\
    \ of hyperparameters when solving a specific problem. For example, the `n_estimators`\
