  md: '# # Introducing machine learning pipelines


    In Chapter 6, Solving Real-World Data Science Problems with LightGBM, we gave
    a detailed overview of the data science life cycle, which includes various steps
    to train an ML model. If we were to focus only on the steps required to train
    a model, given data that has already been collected, those would be as follows:


    +   1. Data cleaning and preparation

    +   2. Feature engineering

    +   3. Model training and tuning

    +   4. Model evaluation

    +   5. Model deployment


    In previous case studies, we applied these steps manually while working through
    a Jupyter notebook. However, what would happen if we shifted the context to a
    long-term ML project? If we had to repeat the process when new data becomes available,
    we''d have to follow the same procedure to build a model successfully.


    Similarly, when we want to use the model to score new data, we must apply the
    steps correctly and with the correct parameters and configuration every time.


    In a sense, these steps form a pipeline for data: data enters the pipeline, and
    a deployable model results from its completion.


    Formally, an ML pipeline is a systematic and automated process that guides the
    workflow of an ML project. It involves several interconnected stages, encapsulating
    the steps listed previously.


    An ML pipeline aims to ensure that these tasks are structured, reproducible, and
    efficient, making it easier to manage complex ML tasks. Pipelines are particularly
    beneficial when working with large datasets or when the steps to transform raw
    data into usable inputs for ML models are complex and must be repeated frequently,
    such as in a production environment.


    There is some fluidity in the steps involved in a pipeline: steps may be added
    or removed depending on how the pipeline is utilized. Some pipelines include a
    data collection step, pulling data from various data sources or databases, and
    staging the data for ML modeling.


    Many ML services and frameworks provide functionality and utilities to implement
    ML pipelines. Scikit-learn provides this functionality through its Pipeline class,
    which we will look at next.


    # ## Scikit-learn pipelines


    Scikit-learn provides the Pipeline class as a tool to implement ML pipelines.
    The Pipeline class provides a unified interface to perform a sequence of data-
    and model-related tasks. Pipelines rely on scikit-learn''s standard fit and transform
    interfaces to enable the chaining of operations. Each'
  merge: -1
  img_proc: true
- pgno: 171
  md: "pipeline consists of any number of intermediate steps, which must be `transforms`.\
    \ A transform must implement both `fit` and `transform`, and the `Pipeline` class\
    \ each transform in turn, first passing the data to `fit` and then to `transform`.\
    \ The final step, which usually entails fitting the model to the data, only needs\
    \ to implement the `fit` method. The transformations are usually preprocessing\
    \ steps that transform or augment the data.\n\nThe primary advantage of using\
    \ scikit-learn pipelines is ensuring that the workflow is implemented clearly\
    \ and in a reproducible manner. It helps avoid common mistakes, such as leaking\
    \ statistics from the test data into the trained model during the preprocessing\
    \ steps. By including the preprocessing steps within the pipeline, we ensure that\
    \ the same preprocessing steps are applied consistently during training and when\
    \ the model is used to predict new data.\n\nFurthermore, scikit-learn pipelines\
    \ can be combined with tools for model selection and hyperparameter tuning, such\
    \ as grid search and cross-validation. We can use grid search to automatically\
    \ select the best parameters across the entire pipeline by defining a grid of\
    \ parameters for the preprocessing steps and the final estimator. This can significantly\
    \ simplify the code and reduce errors in a complex ML workflow. Tools such as\
    \ FLAML also feature integration with scikit-learn pipelines.\n\nFor example,\
    \ a simple pipeline can be created as follows:\n\n```\nfrom sklearn.pipeline import\
    \ Pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model\
    \ import LinearRegression\n\npipeline = Pipeline(\n    [\n        ('scaler', StandardScaler()),\n\
    \        ('linear', LinearRegression()))\n    ]\n)\n```\n\nHere, the pipeline\
    \ consists of two steps: a scaling step that standardizes the data and a final\
    \ step that fits a linear regression model.\n\nThe power of scikit-learn's Pipeline\
    \ is that it can, in turn, be used as we would any other estimator or model:\n\
    \n```\npipeline.fit(X_train, y_train)\npipeline.predict(X_train, y_train)\n```\n\
    \nThis provides us with a unified interface to all the steps encapsulated in the\
    \ pipeline and makes reproducibility trivial. Furthermore, we can export the pipeline\
    \ as we do for other scikit-learn models to enable deployment of the pipeline\
    \ and all the steps it encapsulates:\n\n```\nimport joblib\njoblib.dump(pipeline,\
    \ \"linear_pipeline.pkl\")\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: 'We will show more examples of using scikit-learn pipelines next.


    Although we have spent much time addressing the concerns of working with data
    and building and tuning models, we haven’t yet taken an in-depth look at what
    happens after a model is trained. It’s here that the world of MLOps comes into
    play. The next section provides a detailed overview.


    # ## Understanding MLOps


    **Machine Learning Operations (MLOps)** is a practice that blends the fields of
    ML and system operations. It is designed to standardize and streamline the life
    cycle of ML model development and deployment, thus increasing the efficiency and
    effectiveness of ML solutions within a business setting. In many ways, MLOps can
    be considered a response to the challenges associated with operationalizing ML,
    bringing DevOps principles into the ML world.


    MLOps aims to bring together data scientists, who typically focus on model creation,
    experimentation, and evaluation, and operations professionals, who deal with deployment,
    monitoring, and maintenance. The goal is to facilitate better collaboration between
    these groups, leading to faster, more robust model deployment.


    The importance of MLOps is underscored by the unique challenges presented by ML
    systems. Machine learning systems are more dynamic and less predictable than traditional
    software systems, leading to potential challenges in reliability and robustness,
    especially in a rapidly changing production environment.


    A central goal of MLOps is to accelerate the ML life cycle, facilitating faster
    experimentation and deployment. This is achieved through the automation of ML
    pipelines. **Automation** can cover various stages, including data preprocessing,
    feature engineering, model training, model validation, and deployment. Another
    crucial aspect of MLOps is ensuring reproducibility. Given the dynamic nature
    of ML models, it can be challenging to replicate results exactly, especially when
    models are retrained with new data. MLOps emphasizes the importance of versioning
    code, data, and model configurations, which ensures that every experiment can
    be precisely reproduced, which is crucial for debugging and auditing.


    **Monitoring** is also a vital part of MLOps. Once a model is deployed, *monitoring
    its performance and continuously validating its predictions is critical*. MLOps
    emphasizes the need for robust monitoring tools that can track model performance,
    input data quality, and other vital metrics. Anomalies in these metrics may indicate
    that a model needs to be retrained or debugged.


    MLOps also encourages the use of robust testing practices for ML. ML testing includes
    traditional software testing practices, such as unit tests and integration tests,
    but also more ML-specific tests, such as validating the statistical properties
    of model predictions.


    MLOps also focuses on managing and scaling ML deployments. In the real world,
    ML models may need to serve thousands or even millions of predictions per second.
    DevOps practices such as containerization and serverless computing platforms come
    into play here to facilitate deployment and scaling automation.'
  merge: -1
  img_proc: true
