  md: '# What is deep learning?


    Deep learning is a subfield of the broader machine learning field of artificial
    neural networks. Artificial neural networks are mathematical mimics of the human
    brain and consist of interconnected layers of nodes (or “neurons” in biological
    parlance) that process and transmit information.


    Simple artificial neural networks consist of only a few layers. The term “deep”
    in deep learning refers to using neural networks of many more layers, each with
    potentially thousands of neurons. These layers are organized hierarchically, with
    input layers at the bottom, output at the top, and hidden between. Each layer
    extracts and refines features as data passes through the network, allowing the
    model to learn complex patterns and representations.


    The following diagram depicts a simple neural network called a multilayer perceptron
    with a single hidden layer.


    ![](img/31b70e4a77c3afbe11032f68ab874b02_88_0.png)


    Figure 4.1 – A multilayer perceptron with a single hidden layer and an output
    layer. The layers are fully connected


    Each neuron receives input from other neurons, performs a mathematical operation,
    and then passes the result to the next layer of neurons.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "The mathematical operation involves two main steps – weighted sum and activation\
    \ function:\n\n+   1. **Weighted sum**: The neuron takes the inputs (input data\
    \ or outputs from previous neurons), multiplies each input by its corresponding\
    \ weight, and then adds them together. A bias term is often added to the weighted\
    \ sum for better control over the neuron’s output. Mathematically, this can be\
    \ represented as follows:\n+   \n+   \\( z_j = \\sum_i(w_{ij}x_i) + b_j \\)\n\
    +   \n+   Here, \\( x_i \\) represents all inputs to the neuron, \\( w_{ij} \\\
    ) is the weight associated with the \\( i^{th} \\) input, and \\( b_j \\) is the\
    \ bias for the neuron.\n\n+   2. **Activation function**: The weighted sum is\
    \ then passed through an activation function, determining the neuron’s output.\
    \ The purpose of the activation function is to introduce non-linearity into the\
    \ mathematical operation. The non-linearity allows the neural network to model\
    \ non-linear and, therefore, complex relationships between inputs and outputs.\
    \ There are various activation functions, such as **sigmoid** (logistic function),\
    \ **hyperbolic tangent (tanh)**, and **Rectified Linear Unit (ReLU)**, each with\
    \ its own properties and use cases. This can be represented as:\n+   \n+   \\\
    ( a_j = \\sigma(z_j) \\)\n+   \n+   where \\( a_j \\) is the neuron output and\
    \ \\( \\sigma \\) is the activation function.\n\nCombining these two steps, a\
    \ neuron in a neural network processes the input data, allowing the network to\
    \ learn and model complex patterns.\n\nNeural networks are trained by adjusting\
    \ the weights associated with the neurons. The algorithm can be summarized as\
    \ follows:\n\n+   1. Weights are initialized to small, random values.\n\n+   2.\
    \ A **forward pass** is performed: for each example in a batch, the input features\
    \ are passed through the entire network (calculating the sum and activation at\
    \ each neuron) to produce a prediction at the output layer.\n\n+   3. The loss\
    \ is then calculated by comparing the output against the actual output for each\
    \ example in a batch. Like GBDTs, the loss function has to be differentiable,\
    \ and standard loss functions include the MSE and cross-entropy loss.\n\n+   4.\
    \ **Backpropagation** is performed: the gradient of the loss function with respect\
    \ to the weights is calculated using the calculus chain rule. The process is started\
    \ at the output layer and works backward through the network.\n\n+   5. The weights\
    \ are then updated using gradient descent or one of the modern variants, such\
    \ as Adam, based on the backpropagated gradients.\n\n+   6. The process is repeated\
    \ for a set number of epochs (each epoch running through the entire dataset) to\
    \ minimize the loss function.\n\nA unique property of neural networks is that\
    \ neural networks have been proven to be **universal function approximators**.\
    \ DNNs have the theoretical capability to approximate any continuous function\
    \ to a"
  merge: -1
  img_proc: true
- pgno: 90
  md: 'desired level of accuracy, given a sufficient number of hidden neurons and
    an appropriate activation function. This property is based on the **Universal
    Approximation Theorem**, which has been proven for various types of neural networks.


    This means that a neural network can learn to represent complex relationships
    between input and output data, no matter how intricate or non-linear these relationships
    might be. This capability is one of the reasons why neural networks, especially
    DNNs, have successfully solved a wide range of problems across different domains.
    However, this guarantee is theoretical. In practice, finding the correct network
    architecture, hyperparameters, and training techniques to achieve the desired
    level of approximation can be challenging. The process often requires experimentation,
    expertise, and prohibitive computational resources.


    # Advantages and disadvantages of deep learning


    Given the capabilities of DNNs, we might believe that they should be our first
    port of call for all machine learning problems. The primary advantage of using
    DNNs is their high accuracy in very complex domains: the current state-of-the-art
    performance on a wide range of complex tasks, natural language processing, generative
    AI, image recognition, and speech recognition are all achieved by DNNs due to
    their ability to learn complex and hidden patterns in large datasets.


    Another advantage is automatic feature extraction. With the correct architecture,
    a DNN can extract complex or higher-order features automatically, alleviating
    the need for a data scientist to perform feature engineering.


    Finally, DNNs can also transfer learning: pre-trained deep learning models can
    be fine-tuned on a smaller dataset for a specific task, leveraging the knowledge
    acquired during the initial training. Transfer learning can significantly reduce
    training time and data requirements for new tasks.


    However, deep learning is not a panacea to all machine learning problems. Some
    of the disadvantages of using DNNs include the following:


    +   - **Computational resources**: Deep learning models often require significant
    computing power and memory for training, especially when dealing with large datasets
    and complex architectures.


    +   - **Large datasets**: DNNs usually perform well when trained on large datasets,
    but their performance can degrade when trained on smaller datasets. When a dataset
    is too small, the DNN overfits the training data and cannot generalize to unseen
    data.


    +   - **Interpretability**: DNNs are often considered “black boxes” due to their
    complex architectures and the large number of parameters involved. The complexity
    can make understanding how the model makes decisions difficult, which may be a
    concern for applications requiring transparency or regulatory compliance.


    +   - **Hyperparameter tuning**: DNNs involve numerous hyperparameters, such as
    network architecture, learning rate, and activation functions. Coupled with longer
    training times and resource needs, finding the optimal combination of these hyperparameters
    can be expensive and time-consuming.'
  merge: -1
  img_proc: true
