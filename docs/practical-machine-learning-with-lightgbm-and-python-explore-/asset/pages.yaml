- pgno: 194
  md: "SageMaker uses standard EC2 instances for training but runs specific Docker\
    \ images on the instances to provide ML functionality. Amazon SageMaker provides\
    \ many prebuilt Docker images for various ML frameworks and stacks.\n\nThe SageMaker\
    \ SDK also provides a function to search for images that are compatible with the\
    \ instance type we need within the AWS region we are using. We can search for\
    \ an image using retrieve:\n\n```\ntrain_image_uri = retrieve(\n    region=\"\
    us-east-1\",\n    framework=None,\n    model_id=train_model_id,\n    model_version=train_model_version,\n\
    \    image_scope=train_scope,\n    instance_type=train_instance_type\n)\n```\n\
    \nWe specify None for the framework parameter as we manage the LightGBM installation\
    \ ourselves.\n\nTo parameterize our pipeline, we must define SageMaker workflow\
    \ parameters from the sagemaker.workflow.parameters package. Wrappers are available\
    \ for various parameter types:\n\n```\ntrain_instance_type_param = ParameterString(\n\
    \    name=\"TrainingInstanceType\",\n    default_value=train_instance_type)\n\n\
    train_instance_count_param = ParameterInteger(\n    name=\"TrainingInstanceCount\"\
    ,\n    default_value=train_instance_count)\n\ndeploy_instance_type_param = ParameterString(\n\
    \    name=\"DeployInstanceType\",\n    default_value=predictor_instance_type)\n\
    \ndeploy_instance_count_param = ParameterInteger(\n    name=\"DeployInstanceCount\"\
    ,\n    default_value=predictor_instance_count)\n```\n\nWith our pipeline parameters,\
    \ S3 data paths, and other configuration variables set, we can move on to creating\
    \ our pipeline's preprocessing step.\n\n# Preprocessing step\n\nSetting up our\
    \ preprocessing step has two parts: creating a Python script that performs the\
    \ preprocessing and creating a processor that is added to the pipeline."
