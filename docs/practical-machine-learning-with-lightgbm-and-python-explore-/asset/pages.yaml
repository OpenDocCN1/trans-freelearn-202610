- pgno: 150
  md: 'Generally, the following strategies may be employed to deal with imbalanced
    classes:


    +   * Resampling techniques:


    +   * **Oversampling**: This involves increasing the number of samples in the
    minority class to match the majority class. One common technique is the **Synthetic
    Minority Over-sampling Technique (SMOTE)**, where new samples are created based
    on the existing ones.


    +   * **Undersampling**: This involves reducing the number of samples in the majority
    class to match the minority class. One risk with this approach is the loss of
    potentially valuable data.


    +   * **Cost-sensitive learning**: This method assigns higher costs to the misclassification
    of the minority class during the training process. The idea is to make the model
    pay more attention to the minority class. LightGBM supports this through the `class_weight`
    (for multi-class) and `scale_pos_weight` (for binary classes) parameters. Examples
    of applying these parameters are given in *Chapter 4, Comparing LightGBM, XGBoost,
    and Deep Learning*.


    +   * **Data augmentation**: This involves creating new instances in the dataset
    by adding small perturbations to existing instances. This method is prevalent
    in image classification tasks.


    +   * **Use of appropriate evaluation metrics**: Accuracy is often misleading
    in class imbalance. Instead, metrics such as precision, recall, F1-score, **Area
    under the ROC Curve (AUC-ROC)**, and confusion matrix can provide a more comprehensive
    view of model performance.


    In our case study, we are already employing robust evaluation metrics against
    imbalanced classes. For this problem, we use SMOTE, an oversampling technique,
    to balance our classes while preserving our data.


    # SMOTE


    SMOTE was developed to overcome some of the shortcomings of simple oversampling
    of the minority class, which can lead to overfitting due to the exact duplication
    of instances [1]. Instead of simply duplicating minority samples, SMOTE creates
    synthetic, or “fake,” samples that are similar, but not identical, to existing
    samples in the minority class.


    The SMOTE algorithm proceeds as follows. New sample points, called synthetic samples,
    are synthesized by choosing points between samples close to minority class samples.
    Specifically, for each minority class sample, SMOTE calculates the k-nearest neighbors,
    chooses one of these neighbors, and then multiplies the difference between the
    feature vectors of the sample and its chosen neighbor by a random number between
    0 and 1, adding this to the original sample to create a new, synthetic sample.


    By creating synthetic examples, SMOTE presents a more robust solution to the imbalance
    problem, encouraging the model to draw more generalizable decision boundaries.
    It’s important to note, however, that while SMOTE can improve the performance
    of models on imbalanced datasets, it’s not always the best choice. For instance,
    it can introduce noise if the minority samples are not sufficiently close in the
    feature space, leading to overlapping classes. As with all sampling techniques,
    it’s essential to'
  merge: -1
  img_proc: true
