- pgno: 130
  md: '+   * **Outliers**: Many features have outlier values that skew the distribution
    of values for the feature.

    +   * **Measurement errors**: Some features have values that fall out of the bounds
    of physical impossibilities (lengths smaller than 0 or temperatures in impossible
    ranges).

    +   * **Missing values**: Many of the features have missing values. There are
    also particular values (-99.0 and -999.0) that we consider missing.


    We first address the outliers and measurement errors, as this impacts how we handle
    the missing values.


    # Dealing with outliers


    There are two parts to dealing with outliers in a dataset: accurately identifying
    outliers and choosing appropriate values for replacement. Ways to identify outliers
    are as follows:


    +   * **Visualization**: As shown previously, histograms or other plots that visualize
    the data distribution (such as box plots or scatter plots) can be used

    +   * **Domain knowledge**: Like how we identify measurement errors, domain knowledge
    can be leveraged to decide whether values are outlying

    +   * **Statistical analysis**: Two popular methods for determining whether values
    are outlying using statistics are the interquartile range (IQR) and the standard
    deviation.


    The IQR is the difference between the 25th and 75th quartiles. Values over 1.5
    times the IQR away from the 25th or 75th quartiles are considered outlying.


    Alternatively, we can leverage the standard deviation: we calculate the mean and
    standard deviation of the dataset. Any values over two or three times removed
    from the mean are outlying. Setting bounds to twice or three times the standard
    deviation depends on the underlying data. Using twice the standard deviation could
    lead to many false positives, but it is appropriate if a lot of data is centered
    around the mean. Using three times the standard deviation is more conservative
    and only marks values very far from the mean as outlying.


    When the outlying values are detected, we must do something about them. Generally,
    our options are as follows:


    +   * **Remove**: If an outlier results from an error in data entry, measurement,
    or collection, it may be reasonable to remove it from the dataset. However, this
    should be done cautiously, as removing too many data points can lead to a loss
    of information and biased results. Removing instances with outliers in our dataset
    would result in close to 70% data loss and isn''t an option.

    +   * **Impute**: Similar to missing values, replace the outlier value with a
    more representative value, such as the mean, median, or mode of the variable,
    or use more sophisticated imputation methods such as k-nearest neighbors or regression-based
    imputation.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '+   • Cap or truncate: Set a threshold (either upper or lower) and cap or truncate
    the outlier values at that threshold. This method retains the data''s original
    structure while reducing the influence of extreme values.


    For the Wind Turbine dataset, we detect the outliers using bounds set to three
    times the standard deviation and map the values to np.nan, so we may replace them
    later:


    ```

    column_data = frame[feature]

    column_data = column_data[~np.isnan(column_data)]

    mean, std = np.mean(column_data), np.std(column_data)

    lower_bound = mean - std * 3

    upper_bound = mean + std * 3

    frame.loc[((frame[feature] < lower_bound) | (frame[feature] > upper_bound))] =
    np.nan

    ```


    # Handling measurement errors


    The values detected as types of measurement errors could also be considered outliers,
    although not in the statistical sense of the word. However, we can handle these
    values slightly differently than with the statistical outliers.


    We apply our domain knowledge and some research surrounding the weather to identify
    appropriate ranges for these features. We then cap the erroneous values to these
    ranges:


    ```

    frame.loc[frame["wind_speed (m/s)"] < 0, "wind_speed (m/s)"] = 0

    frame.loc[frame["wind_speed (m/s)"] > 113, "wind_speed (m/s)"] = 113

    frame.loc[frame["blade_length (m)"] < 0, "blade_length (m)"] = 0

    frame.loc[frame["windmill_height (m)"] < 0, "windmill_height (m)"] = 0

    frame.loc[frame["resistance (ohm)"] < 0, "resistance (ohm)"] = 0

    ```


    Here, we set any negative lengths, heights, and electrical resistance to 0. We
    also cap the windspeed to 113 m/s, the maximum gust speed on record.


    Finally, we can deal with the missing values in the dataset.


    # Handling missing values


    We have discussed working with missing values in earlier chapters. To summarize
    here, some of the potential approaches we can take are as follows:


    +   • Remove instances with missing values

    +   • Impute the missing values using descriptive statistics (the mean, median,
    or mode)

    +   • Use other machine learning algorithms, typically unsupervised techniques
    such as clustering,

    +   to calculate more robust statistics'
  merge: -1
  img_proc: true
