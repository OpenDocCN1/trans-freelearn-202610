    \ the parameter to be less important, we can choose smaller values to improve\
    \ our model's runtime performance. Optuna provides several visualizations to dive\
    \ deeper into the results of a study and gain insight into hyperparameters.\n\n\
    A straightforward visualization plots the **importance of each parameter**: how\
    \ much each affected the training outcome. We can create an importance plot as\
    \ follows:\n\n```\n```\nfig = optuna.visualization.plot_param_importances(study)\n\
    fig.show()\n```\n```\n\nThe importance plot for our study is shown here:"
