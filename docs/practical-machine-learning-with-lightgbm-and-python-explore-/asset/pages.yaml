- pgno: 119
  md: "Optuna supports solving this type of problem by using **multi-objective optimization\
    \ (MOO)**. When optimizing multiple objectives, we return two evaluations from\
    \ our `objective` function and specify the optimization directions.\n\nAs an example,\
    \ consider the trade-off between the learning rate and performance. We want to\
    \ train our model as fast as possible, which requires a high learning rate. However,\
    \ we know the best performance is achieved using a small learning rate and many\
    \ iterations.\n\nWe can use Optuna to optimize this trade-off. We define a new\
    \ `objective` function, fixing all other parameters to the optimal values found\
    \ earlier. We return two evaluations: the learning and the cross-validated F1-score.\
    \ We want to maximize both values:\n\n```\ndef moo_objective(trial):\n    learning_rate\
    \ = trial.suggest_float(\"learning_rate\", 0.0001, 0.5,\n    log=True),\n\n  \
    \  model = lgb.LGBMClassifier(\n        force_row_wise=True,\n        boosting_type='gbdt',\n\
    \        n_estimators=200,\n        num_leaves=6,\n        bagging_freq=7,\n \
    \       learning_rate=learning_rate,\n        max_bin=320,\n    )\n\n    scores\
    \ = cross_val_score(model, X, y, scoring=\"f1_macro\")\n    return learning_rate[0],\
    \ scores.mean()\n```\n\nWhen calling optimize, we then set the direction for the\
    \ optimization of both evaluations:\n\n```\nstudy = optuna.create_study(directions=[\"\
    maximize\", \"maximize\"])\nstudy.optimize(moo_objective, n_trials=100)\n```\n\
    \nWhen performing MOO, there isn't always a single best result: a trade-off often\
    \ exists between the objectives. Therefore, we want to visualize the study results\
    \ to explore the trade-off and select parameter values that perform well with\
    \ both objectives. This type of visualization is called a **Pareto front** and\
    \ can be created as follows:"
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Pareto Front Plot


    ![](img/31b70e4a77c3afbe11032f68ab874b02_120_0.png)


    Figure 5.5 – A scatter plot showing the Pareto front for a MOO study


    As shown in Figure 5.5, the F1 score is poor if the learning rate is too low and
    picks up quickly as the learning rate gets to 0.01. The F1 score peaks at 0.12
    and slowly trails off as the learning rate increases. We now have the necessary
    information to decide on our trade-off: we can choose a higher learning rate for
    faster training, sacrificing the minimum amount of classification performance.


    # Summary


    This chapter introduced Optuna as a framework for HPO. We discussed the problems
    of finding optimal hyperparameters and how HPO algorithms may be used to find
    suitable parameters efficiently.


    We discussed two optimization algorithms available in Optuna: TPE and CMA-ES.
    Both algorithms allow a user to set a specific budget for optimization (the number
    of trials to perform) and proceed to find suitable parameters within the constraints.
    Further, we discussed the pruning of unpromising optimization trials to save additional
    resources and time. Median pruning and the more complex but effective pruning
    techniques of successive halving and Hyperband were discussed.


    We then proceeded to show how to perform HPO studies for LightGBM in a practical
    example. We also showed advanced features of Optuna that can be used to save and
    resume studies, understand the effects of parameters, and perform MOO.'
