    Executing the pipeline is done by calling the start method:


    ```

    start_response = pipeline.start(parameters=dict (

    SkipModelBiasCheck=True,

    RegisterNewModelBiasBaseline=True,

    SkipModelExplainabilityCheck=True,

    RegisterNewModelExplainabilityBaseline=True))

    ```


    Note the conditions we defined here. When running the pipeline for the first time,
    we must skip the model bias and explainability checks while registering new bias
    and explainability baselines.


    Both checks require an existing baseline to run (otherwise, there is no data to
    check against). Once baselines have been established, we can disable skipping
    the checks in subsequent runs.


    More information on the model life cycle and creating baselines can be found at
    https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines-quality-clarify-baseline-lifecycle.html.


