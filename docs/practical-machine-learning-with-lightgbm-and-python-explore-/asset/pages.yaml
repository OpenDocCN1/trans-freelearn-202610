- pgno: 62
  md: '# Introducing LightGBM


    LightGBM is an open source, gradient-boosting framework for tree-based ensembles
    (https:// github.com/microsoft/LightGBM). LightGBM focuses on efficiency in speed,
    memory usage, and improved accuracy, especially for problems with high dimensionality
    and large data sizes.


    LightGBM was first introduced in the paper LightGBM: A Highly Efficient Gradient
    Boosting Decision Tree [1].


    The efficiency and accuracy of LightGBM are achieved via several technical and
    theoretical optimizations to the standard ensemble learning methods, particularly
    GBDTs. Additionally, LightGBM supports distributed training of ensembles with
    optimizations in network communication and support for GPU-based training of tree
    ensembles.


    LightGBM supports many **machine learning (ML)** applications: regression, binary
    and multiclass classification, cross-entropy loss functions, and ranking via LambdaRank.


    The LightGBM algorithm is also very customizable via its hyperparameters. It supports
    many metrics and features, including **Dropouts meet Multiple Additive Regression
    Trees (DART)**, bagging (random forests), continuous training, multiple metrics,
    and early stopping.


    This section reviews the theoretical and practical optimizations LightGBM utilizes,
    including a detailed overview of the hyperparameters to control LightGBM features.


    # LightGBM optimizations


    At its core, LightGBM implements the same ensemble algorithms we discussed in
    the previous chapter. However, LightGBM applies theoretical and technical optimizations
    to improve performance and accuracy while significantly reducing memory usage.
    Next, we discuss the most significant optimizations implemented in LightGBM.


    # Computational complexity in GBDTs


    First, we must understand where the inefficiency in building GBDTs stems from
    to understand how LightGBM improves the efficiency of GBDTs. The most computationally
    complex part of the GBDT algorithm is training the regression tree for each iteration.
    More specifically, finding the optimal split is very expensive. Pre-sort-based
    algorithms are among the most popular methods for finding the best splits [2],
    [3]. A naïve approach requires the data to be sorted by feature for every decision
    node with algorithmic complexity _O_(#data × #feature). Pre-sort-based algorithms
    sort the data once before training, which reduces the complexity when building
    a decision node to _O_(#data) [2]. Even with pre-sorting, the complexity is too
    high for large datasets when finding splits for decision nodes.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Histogram-based sampling


    An alternative approach to pre-sorting involves building histograms for continuous
    features [4]. The continuous values are added into discrete bins when building
    these **feature histograms**. Instead of using the data directly when calculating
    the splits for decision nodes, we can now use the histogram bins. Constructing
    the histograms has a complexity of `O(#data)`. However, the complexity for building
    a decision node now reduces to `O(#bins)`, and since the number of bins is much
    smaller than the amount of data, this significantly speeds up the process of building
    regression trees, as illustrated in the following diagram:


    ![](img/31b70e4a77c3afbe11032f68ab874b02_63_0.png)


    Figure 3.1 – Creating feature histograms from continuous features allows calculating
    splits for decision nodes using bin boundary values instead of having to sample
    each data point, significantly reducing the algorithm’s complexity since #bins
    << #data


    A secondary optimization that stems from using histograms is “histogram subtraction”
    for building the histograms for the leaves. Instead of calculating the histogram
    for each leaf, we can subtract the leaf’s neighbor’s histogram from the parent’s
    histogram. Choosing the leaf with the smaller amount of data leads to a smaller
    `O(#data)` complexity for the first leaf and `O(#bin)` complexity for the second
    leaf due to histogram subtraction.


    A third optimization that LightGBM applies using histograms is to reduce the memory
    cost. Feature pre-sorting requires a supporting data structure (a dictionary)
    for each feature. No such data structures are required when building histograms,
    reducing memory costs. Further, since #bins is small, a smaller data type, such
    as `uint8_t`, can store the training data, reducing memory usage.


    Detailed information regarding the algorithms for building feature histograms
    is available in the paper CLOUDS: A decision tree classifier for large datasets
    [4].'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Exclusive Feature Bundling


    Exclusive Feature Bundling (EFB) is another data-based optimization that LightGBM
    applies when working with sparse data (sparse data is pervasive in high-dimensional
    datasets). When the feature data is sparse, it’s common to find that many features
    are *mutually exclusive*, signifying they never present non-zero values simultaneously.
    Combining these features into a single one is generally safe, given this exclusivity.
    EFB is illustrated in the following diagram:


    ![](img/31b70e4a77c3afbe11032f68ab874b02_64_0.png)


    Figure 3.2 – Building a feature bundle from two mutually exclusive features


    Bundling mutually exclusive features allows building the same feature histograms
    as from the individual features [1]. The optimization reduces the complexity of
    building feature histograms from O(#data × #feature) to O(#data × #bundle). For
    datasets where there are many mutually exclusive features, this dramatically improves
    performance since # bundle << #feature. Detailed algorithms for, and proof of
    the correctness of, EFB are available in [1].


    # Gradient-based One-Side Sampling


    A final data-based optimization available in the LightGBM framework is Gradient-based
    One-Side Sampling (GOSS) [1]. GOSS is a method of discarding training data samples
    that no longer contribute significantly to the training process, effectively reducing
    the training data size and speeding up the process.


    We can use the gradient calculation of each sample to determine its importance.
    If the gradient change is small, it implies that the training error was also small,
    and we can infer that the tree is well fitted to the specific data instance [1].
    One option would be to discard all instances with small gradients. However, this
    changes the distribution of the training data, reducing the tree’s ability to
    generalize. GOSS is a method for choosing which instances to keep in the training
    data.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'To maintain the data distribution, GOSS is applied as follows:


    +   1. The data samples are sorted by the absolute value of their gradients.

    +   2. The top a × 100% instances are then selected (instances with large gradients).

    +   3. A random sample of b × 100% instances is then taken from the rest of the
    data.

    +   4. A factor is added to the loss function (for these instances) to amplify
    their influence: 1/b^a, thereby compensating for the underrepresentation of data
    with small gradients.


    Therefore, GOSS samples a large portion of instances with large gradients and
    a random portion of instances with small gradients and amplifies the influence
    of the small gradients when calculating information gain.


    The downsampling enabled by GOSS can significantly reduce the amount of data processed
    during training (and the training time for the GBDTs), especially in the case
    of large datasets.


    # Best-first tree growth


    The most common method for building decision trees is to grow the tree by level
    (that is, one level at a time). LightGBM uses an alternative approach and grows
    the tree leaf-wise or best-first. The leaf-wise approach selects an existing leaf
    with the most significant change in the loss of the tree and builds the tree from
    there. The downside of this approach is that if the dataset is small, the tree
    is likely to overfit the data. A maximum depth has to be set to counteract this.
    However, if the number of leaves to construct is fixed, leaf-wise tree building
    is shown to outperform level-wise algorithms [5].


    # L1 and L2 regularization


    LightGBM supports both L1 and L2 regularization of the objective function when
    training the regression trees in the ensemble. From Chapter 1, Introducing Machine
    Learning, we recall that regularization is a way to control overfitting. In the
    case of decision trees, simpler, shallow trees overfit less.


    To support L1 and L2 regularization, we extend the objective function with a regularization
    term, as follows:


    ```

    obj = L(y, F(x)) + Ω(w)

    ```


    Here, L(y, F(x)) is the loss function discussed in Chapter 2, Ensemble Learning
    – Bagging and Boosting, and Ω(w) is the regularization function defined over w,
    the leaf scores (the leaf score is the output calculated from the leaf as per
    step 2.3 in the GBDT algorithm defined in Chapter 2, Ensemble Learning – Bagging
    and Boosting).


    The regularization term effectively adds a penalty to the objective function,
    where we aim to penalize more complex trees prone to overfitting.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'There are multiple definitions for $\Omega$. A typical implementation for the
    terms in decision trees is this:


    ```

    $$\Omega(w) = \alpha \sum_i^n |w_i| + \lambda \sum_i^n w_i^2$$

    ```


    Here, $\alpha \sum_i^n |w_i|$ is the L1 regularization term, controlled by the
    parameter $\alpha$, $0 \le \alpha \le 1$, and $\lambda \sum_i^n w_i^2$ is the
    L2 regularization term, controlled by the parameter $\lambda$.


    L1 regularization has the effect of driving leaf scores to zero by penalizing
    leaves with large absolute outputs. Smaller leaf outputs have a smaller effect
    on the tree''s prediction, effectively simplifying the tree.


    L2 regularization is similar but has an outsized effect on outliers'' leaves due
    to taking the square of the output.


    Finally, when larger trees are built (trees with more leaves, and therefore a
    large $w$ vector), both sum terms for $\Omega(w)$ increase, increasing the objective
    function output. Therefore, larger trees are penalized, and overfitting is reduced.


    # ## Summary of LightGBM optimizations


    In summary, LightGBM improves upon the standard ensemble algorithms by doing the
    following:


    +   - Implementing histogram-based sampling of features to reduce the computational
    cost of finding optimal splits

    +   - Calculating exclusive feature bundles to reduce the number of features in
    sparse datasets

    +   - Applying GOSS to downsample the training data without losing accuracy

    +   - Building trees leaf-wise to improve accuracy

    +   - Overfitting can be controlled through L1 and L2 regularization and other
    control parameters


    In conjunction, the optimizations improve the computational performance of LightGBM
    by **orders of magnitude (OOM)** over the standard GBDT algorithm. Additionally,
    LightGBM is implemented in C++ with a Python interface, which results in much
    faster code than Python-based GBDTs, such as in scikit-learn.


    Finally, LightGBM also has support for improved data-parallel and feature-parallel
    distributed training. Distributed training and GPU support are discussed in a
    later Chapter 11, Distributed and GPU-Based Learning with LightGBM.


    # ## Hyperparameters


    LightGBM exposes many parameters that can be used to customize the training process,
    goals, and performance. Next, we discuss the most notable parameters and how they
    may be used to control specific phenomena.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '**Note**

    The core LightGBM framework is developed in C++ but includes APIs to work with
    LightGBM in C, Python, and R. The parameters discussed in this section are the
    framework parameters and are exposed differently by each API. The following section
    discusses the parameters available when using Python.


    The following are **core framework parameters** used to control the optimization
    process and goal:


    +   - **objective**: LightGBM supports the following optimization objectives,
    among others— regression (including regression applications with other loss functions
    such as Huber and Fair), binary (classification), multiclass (classification),
    cross-entropy, and lambdarank for ranking problems.


    +   - **boosting**: The boosting parameter controls the boosting type. By default,
    this is set to `gbdt`, the standard GBDT algorithm. The other options are `dart`
    and `rf` for random forests. The random forest mode does not perform boosting
    but instead builds a random forest.


    +   - **num_iterations** (or **n_estimators**): Controls the number of boosting
    iterations and, therefore, the number of trees built.


    +   - **num_leaves**: Controls the maximum number of leaves in a single tree.


    +   - **learning_rate**: Controls the learning, or shrinkage rate, which is the
    contribution of each tree to the overall prediction.


    LightGBM also provides many parameters to control the learning process. We’ll
    discuss these parameters relative to how they may be used to tune specific aspects
    of training.


    The following control parameters can be used to improve **accuracy**:


    +   - **boosting**: Use `dart`, which has been shown to outperform standard GBDTs.


    +   - **learning_rate**: The learning rate must be tuned alongside `num_iterations`
    for better accuracy. A small learning rate with a large value for `num_iterations`
    leads to better accuracy at the expense of optimization speed.


    +   - **num_leaves**: A larger number of leaves improves accuracy but may lead
    to overfitting.


    +   - **max_bin**: The maximum number of bins in which features are bucketed when
    constructing histograms. A larger `max_bin` size slows the training and uses more
    memory but may improve accuracy.


    The following **learning control parameters** can be used to deal with **overfitting**:


    +   - **bagging_fraction** and **bagging_freq**: Setting both parameters enables
    feature bagging. Bagging may be used in addition to boosting and doesn’t force
    the use of a random forest. Enabling bagging reduces overfitting.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   - `early_stopping_round`: Enables early stopping and controls the number
    of iterations used to determine whether training should be stopped. Training is
    stopped if no improvement is made to any metric in the iterations set by `early_stopping_round`.

    +   - `min_data_in_leaf`: The minimum samples allowed in a leaf. Larger values
    reduce overfitting.

    +   - `min_gain_to_split`: The minimum amount of information gain required to
    perform a split. Higher values reduce overfitting.

    +   - `reg_alpha`: Controls L1 regularization. Higher values reduce overfitting.

    +   - `reg_lambda`: Controls L2 regularization. Higher values reduce overfitting.

    +   - `max_depth`: Controls the maximum depth of individual trees. Shallower trees
    reduce overfitting.

    +   - `max_drop`: Controls the maximum number of dropped trees when using the
    DART algorithm (is only used when `boosting` is set to `dart`). A larger value
    reduces overfitting.

    +   - `extra_trees`: Enables the **Extremely Randomized Trees (ExtraTrees)** algorithm.
    LightGBM then chooses a split threshold at random for each feature. Enabling Extra-Trees
    can reduce overfitting. The parameter can be used in conjunction with any boosting
    mode.


    The parameters discussed here include only some of the parameters available in
    LightGBM and focus on improving accuracy and overfitting. A complete list of parameters
    is available at the following link: https://lightgbm.readthedocs.io/en/latest/Parameters.html.


    # Limitations of LightGBM


    LightGBM is designed to be more efficient and effective than traditional methods.
    It is particularly well known for its ability to handle large datasets. However,
    as with any algorithm or framework, it also has its limitations and potential
    disadvantages, including the following:


    +   - **Sensitive to overfitting**: LightGBM can be sensitive to overfitting,
    especially with small or noisy datasets. Care should be taken to monitor and control
    for overfitting when using LightGBM.

    +   - **Optimal performance requires tuning**: As discussed previously, LightGBM
    has many hyperparameters that need to be properly tuned to get the best performance
    from the algorithm.

    +   - **Lack of representation learning**: Unlike deep learning (DL) approaches,
    which excel at learning from raw data, LightGBM requires feature engineering to
    be applied to the data before learning. Feature engineering is a time-consuming
    process that requires domain knowledge.

    +   - **Handling sequential data**: LightGBM is not inherently designed for working
    with sequential data such as time series. For LightGBM to be used with time-series
    data, feature engineering needs to be applied to create lagged features and capture
    temporal dependencies.

    +   - **Complex interactions and non-linearities**: LightGBM is a decision-tree-driven
    approach that might be incapable of capturing complex feature interactions and
    non-linearities. Proper feature engineering needs to be applied to ensure the
    algorithm models these.'
  merge: -1
