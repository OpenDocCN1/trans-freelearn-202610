- "# 第 1 部分：梯度提升和 LightGBM 基础\n\n在本部分中，我们将通过让你掌握机器学习的基本概念（从基本术语到随机森林等复杂算法）来启动对机器学习的探索。我们将深入探讨集成学习，重点介绍决策树结合使用时的威力，然后将重点转移到梯度提升框架\
  \ LightGBM。通过 Python 的实践示例以及与 XGBoost 和深度神经网络等技术的对比分析，你将在机器学习领域（尤其是 LightGBM）获得基础理解和实践能力。\n\
  \n本部分将包含以下章节：\n\n- 第 1 章，机器学习简介\n- 第 2 章，集成学习 – 装袋与提升\n- 第 3 章，Python 中的 LightGBM\
  \ 概览\n- 第 4 章，LightGBM、XGBoost 与深度学习对比\n\n## 机器学习简介\n\n我们的旅程始于对机器学习及贯穿本书所用基本概念的介绍。\n\
  \n我们将从软件工程的角度开始概述机器学习。然后，我们将介绍机器学习和数据科学领域使用的核心概念：模型、数据集、学习范式及其他细节。本介绍将包含一个实践示例，清晰地说明所讨论的机器学习术语。\n\
  \n我们还将介绍决策树，这是一种至关重要的机器学习算法，是理解 LightGBM 的第一步。\n\n完成本章后，你将在机器学习及其技术的实际应用方面建立坚实的基础。\n\
  \n本章将涵盖以下主要主题：\n\n- 什么是机器学习？\n- 模型、数据集和监督学习简介\n- 决策树学习\n\n### 技术要求\n\n本章包含简单机器学习算法的示例，并介绍如何使用\
  \ scikit-learn。你必须安装带有 scikit-learn、NumPy、pandas 和 Jupyter Notebook 的 Python 环境。本章代码可在\
  \ https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-1\
  \ 获取。\n\n\n\n\n\n## 什么是机器学习？\n\n机器学习是更广泛的人工智能领域的一部分，涉及方法和技术，使计算机能够在无需显式编程的情况下“学习”特定任务。\n\
  \n机器学习只是从数据编写程序的另一种方式，尽管是自动的。抽象地说，程序是一组将输入转换为特定输出的指令。程序员的工作是理解计算机程序的所有相关输入，并开发一组指令以生成正确的输出。\n\
  \n但是，如果输入超出了程序员的理解范围呢？\n\n例如，让我们考虑创建一个程序来预测大型零售店的总销售额。程序的输入将是可能影响销售的各种因素。我们可以想象诸如历史销售数据、即将到来的公共假期、库存可用性、商店可能正在进行的任何特别交易，甚至天气预报或与其他商店的距离等因素。\n\
  \n在我们的商店示例中，传统的方法是将输入分解为可管理、可理解（程序员能够理解）的部分，也许咨询商店销售预测专家，然后制定手工制作的规则和指令以尝试预测未来的销售额。\n\
  \n虽然这种方法当然是可能的，但它也很脆弱（在程序可能需要针对输入因素进行广泛更改的意义上），并且完全基于程序员（或领域专家）对问题的理解。有可能有成千上万个因素和数十亿个示例，这个问题就变得不可行了。\n\
  \n机器学习为我们提供了这种方法的替代方案。与其创建规则和指令，不如我们反复向计算机展示我们需要完成的任务的示例，然后让它自行想出如何自动解决它们。\n\n然而，我们以前拥有一组指令，现在我们拥有一个训练有素的模型，而不是一个编程的模型。\n\
  \n这里的关键认识是，特别是如果你来自软件背景，我们的机器学习程序仍然像常规程序一样运作：它接受输入，有处理输入的方式，并产生输出。与所有其他软件程序一样，机器学习软件必须经过正确性测试、集成到其他系统、部署、监控和优化。集体而言，这构成了机器学习工程领域。我们将在后面的章节中介绍所有这些方面及更多内容。\n\
  \n## 机器学习范式\n\n广义上说，机器学习有三种主要范式：监督学习、无监督学习和强化学习。\n\n使用**监督学习**，模型在带标签的数据上进行训练：数据集中的每个实例都有针对输入示例的关联正确输出，或标签。模型被期望学习预测未见输入示例的标签。\n\
  \n使用**无监督学习**，数据集中的示例是未标记的；在这种情况下，模型被期望在数据中发现模式和关系。无监督方法的示例包括聚类算法、异常检测和降维算法。\n\n\
  最后，**强化学习**涉及一个通常被称为代理的模型与特定环境交互，并通过为特定动作接收惩罚或奖励来学习。目标是代理执行能够最大化其奖励的动作。强化学习广泛应用于机器人、控制系统或训练计算机玩游戏。\n\
  \nLightGBM和本书后面讨论的大多数其他算法都是监督学习技术的示例，也是本书的重点。\n\n下一部分将深入探讨我们将在整本书中使用的机器学习术语以及机器学习过程的详细信息。\n\
  \n## 介绍模型、数据集和监督学习\n\n在上一节中，我们介绍了模型作为一种构造，用于替代通常构成执行特定任务的程序的一组指令。本节将更详细地介绍模型和其他核心机器学习概念。\n\
  \n### 模型\n\n更正式地说，模型是执行特定任务的特定过程的数学或算法表示。机器学习模型通过使用**训练算法**在**数据集**上进行训练来学习特定任务。\n\
  \n> **注意**\n> \n> 训练的替代术语是拟合。历史上，拟合源于统计学领域。模型在训练后被称为“拟合数据”。我们将在整本书中交替使用这两个术语。\n\n\
  存在许多不同类型的模型，它们都使用不同的数学、统计或算法技术来对训练数据进行建模。机器学习算法的示例包括线性回归、逻辑回归、决策树、支持向量机和神经网络。\n\n\
  模型类型与该模型的训练实例之间存在区别：大多数机器学习模型可以被训练以执行各种任务。例如，决策树（一种模型类型）可以被训练来预测销售额、识别心脏病和预测足球比赛结果。\n\
  \n然而，这些任务中的每一个都需要在不同数据集上训练过的决策树的不同*实例*。\n\n特定模型所做的事情取决于模型的**参数**。参数有时也被称为**权重**，技术上它们是模型参数的特定类型。\n\
  \n**训练算法**是一种用于为特定任务找到最合适模型参数的算法。\n\n我们使用**目标函数**来确定拟合的质量，或模型的性能如何。这是一个数学函数，用于测量给定输入的预测输出和实际输出之间的差异。目标函数量化了模型的性能。我们可能会根据要解决的问题来最小化或最大化目标函数。目标通常被衡量为我们在训练期间力求最小化的误差。\n\
  \n我们可以概括模型训练过程如下：训练算法使用来自数据集的数据来为特定任务优化模型的参数，通过目标函数进行测量。\n\n### 超参数\n\n虽然模型由参数组成，但训练算法有其自己的参数，称为**超参数**。超参数是影响训练过程或算法的可控值。例如，考虑寻找抛物线函数的最小值：我们可以从猜测一个值开始，然后在使函数输出最小化的方向上采取小步骤。步长必须选好：如果我们的步子太小，找到最小值将花费禁止性的长时间。如果步长太大，我们可能会超过并错过最小值，然后在最小值周围继续振荡（来回跳跃）：\n\
  \n![](img/31b70e4a77c3afbe11032f68ab874b02_26_0.png)\n\n图 1.1 – 步长过大（左）和过小（右）的效果\n\
  \n在这个例子中，步长将是我们最小化算法的超参数。步长的效果在图 1.1 中说明。\n\n### 数据集\n\n如前所述，机器学习模型使用数据集进行训练。数据是机器学习过程的核心，数据准备通常是耗时最长的部分。\n\
  \n在整本书中，我们将使用表格数据集。表格数据集在现实世界中非常常见，由行和列组成。行通常被称为样本、示例或观测值，列通常被称为特征、变量或属性。\n\n重要的是，列中没有数据类型限制。特征可以是字符串、数字、布尔值、地理空间坐标，或音频、图像或视频等编码格式。\n\
  \n数据集也很少被完美定义。数据可能不完整、有噪声、不正确、不一致，并包含各种格式。\n\n因此，数据准备和清洗是机器学习过程的重要组成部分。\n\n数据准备涉及处理数据以使其适合机器学习，通常包含以下步骤：\n\
  \n- 1. **收集和验证**：某些数据集最初太小或对问题的表示不佳（数据不代表其抽样的实际数据总体）。在这些情况下，从业人员必须收集更多数据，并进行验证以确保数据代表问题。\n\
  - 2. **检查系统性错误和偏差**：检查并纠正收集和验证过程中可能导致数据集偏差的任何系统性错误至关重要。在我们的销售示例中，系统性收集错误可能是数据仅从城市商店收集而排除了农村商店。仅在城市商店数据上训练的模型在预测商店销售额时会有偏差，我们可能预期该模型用于预测农村商店销售额时性能较差。\n\
  - 3. **清理数据**：必须解决任何格式或值范围不一致的问题。缺失值也需要以不引入偏差的方式进行处理。\n- 4. **特征工程**：某些特征可能需要转换，以确保机器学习模型能够从中学习，例如对句子进行数值编码。此外，可能需要从现有特征准备新特征，以帮助模型检测模式。\n\
  - 5. **归一化和标准化**：特征的相对范围必须进行归一化和标准化。归一化和标准化确保没有单个特征对整体预测产生过大影响。\n\n\n\n\n\n- **数据集平衡**：在数据集不平衡的情况下——即一个类别或预测的示例数远多于另一个类别时——需要对数据集进行平衡。平衡通常通过过采样少数类示例来实现，以平衡数据集。\n\
  \n在第 6 章“使用 LightGBM 解决现实世界的数据科学问题”中，我们将讲解整个数据准备过程，展示前述步骤在实际中的应用。\n\n> **注意**\n\
  > 值得记住的一句良箴是“垃圾进，垃圾出”。模型会从给定的任何数据中学习，包括数据中包含的任何缺陷或偏差。当我们在垃圾数据上训练模型时，就会得到一个垃圾模型。\n\
  \n关于数据集，最后需要理解的一个概念是训练集、验证集和测试集。在完成数据准备步骤后，我们将数据集分为这三个子集：\n\n- **训练集**是最重要的子集，通常包含\
  \ 60% 到 80% 的数据。这些数据用于训练模型。\n\n- **验证集**与训练数据分开，并在整个训练过程中用于评估模型。拥有独立的验证数据可确保模型在未见过的数据上进行评估，这也称为其泛化能力。超参数调优（在第\
  \ 5 章“使用 Optuna 优化 LightGBM 参数”中详细介绍）也使用验证集。\n\n- 最后，**测试集**是一个可选的留出集，与验证集类似。它在流程结束时用于评估模型在非训练或调优过程数据上的性能。\n\
  \n验证集的另一个用途是监控模型是否对数据过拟合。让我们更详细地讨论过拟合。\n\n## 过拟合与泛化\n\n要理解过拟合，我们首先必须定义模型**泛化**的含义。如前所述，泛化是模型准确预测未见数据的能力。与训练准确率相比，泛化准确率作为模型性能估计更具意义，因为它指示了我们的模型在生产环境中的表现。泛化有两种形式：**内插和外推**：\n\
  \n- 内插是指模型在两个已知数据点之间预测值的能力——换句话说，就是在训练数据范围内进行泛化。例如，假设我们使用 1 月到 7 月的月度数据训练模型。在进行内插时，我们会要求模型对\
  \ 4 月的某一天进行预测，该日期在我们的训练范围内。\n\n- 外推，正如你可能推断的那样，是模型预测超出训练数据定义范围之外的值的能力。外推的一个典型示例是预测——即预测未来。在我们之前的示例中，如果我们要求模型对\
  \ 12 月进行预测，我们期望它从训练数据进行外推。\n\n在两种泛化类型中，外推要具挑战性得多，可能需要特定类型的模型才能实现。然而，在这两种情况下，模型都可能过拟合数据，失去准确内插或外推的能力。\n\
  \n**过拟合**是一种现象，其中模型过于紧密地拟合训练数据，并失去对未见数据进行泛化的能力。模型没有学习数据中的基本模式，而是记住了训练数据。更技术地说，模型拟合了训练数据中包含的噪声。噪声一词源于数据包含信号和噪声的概念。信号是指我们试图预测的数据中捕获的基本模式或信息。相比之下，噪声是指掩盖信号的数据点的随机或无关变化。\n\
  \n例如，考虑一个我们试图预测特定地点降雨量的数据集。数据中的信号将是降雨的一般趋势：冬季或夏季降雨量增加，或其他地点正好相反。噪声将是我们数据集中每个月和每个地点降雨测量的微小变化。\n\
  \n下图说明了过拟合现象：\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_29_0.png)\n\n图 1.2 – 显示过拟合的图表。模型已过拟合并完美预测了训练数据，但失去了对实际信号进行泛化的能力\n\
  \n上图显示了信号和噪声的区别：每个数据点都从实际信号中采样。数据遵循信号的一般模式，带有轻微的随机变化。我们可以看到模型如何过拟合数据：模型完美拟合了训练数据，但代价是牺牲了泛化能力。我们还可以看到，如果我们使用模型通过预测\
  \ 4 的值来进行内插，我们得到的结果远高于实际信号（6.72 对比 6.2）。还显示了模型无法外推：对 12 的预测远低于信号的预测（7.98 对比 8.6）。\n\
  \n在现实中，所有真实世界的数据集都包含噪声。作为数据科学家，我们的目标是准备数据，以尽可能多地去除噪声，使信号更容易被检测到。数据清洗、归一化、特征选择、特征工程和正则化都是从数据中去除噪声的技术。\n\
  \n由于所有真实世界的数据都包含噪声，过拟合无法消除。以下条件可能导致过拟合：\n\n- **过于复杂的模型**：对于我们拥有的数据量来说过于复杂的模型会利用额外的复杂性来记住数据中的噪声，从而导致过拟合\n\
  - **数据不足**：如果我们为所使用的模型没有足够的训练数据，这与过于复杂的模型类似，会导致对数据过拟合\n- **特征过多**：包含过多特征的数据集可能包含不相关（噪声）特征，这些特征会降低模型的泛化能力\n\
  - **过度训练**：训练模型时间过长会使其记住数据集中的噪声\n\n由于验证集是训练数据中模型未见过的一部分，我们使用验证集来监控过拟合。我们可以通过随时间观察训练误差和泛化误差来识别过拟合点。在过拟合点，验证误差增加。相比之下，训练误差仍在改善：模型正在拟合训练数据中的噪声并失去泛化能力。\n\
  \n防止过拟合的技术通常旨在解决我们之前讨论的导致过拟合的条件。以下是一些避免过拟合的策略：\n\n- **早停**：当我们看到验证误差开始增加时，可以停止训练。\n\
  - **简化模型**：参数更少的不太复杂的模型无法学习训练数据中的噪声，从而泛化得更好。\n- **获取更多数据**：收集更多数据或数据增强是一种有效的防止过拟合的方法，它能让模型更好地学习数据中的信号，而不是较小数据集中的噪声。\n\
  - **特征选择和降维**：由于某些特征可能与要解决的问题无关，我们可以丢弃我们认为冗余的特征，或使用主成分分析等技术来降低维度（特征）。\n- 添加正则化：较小的参数值通常能带来更好的泛化能力，具体取决于模型（神经网络就是这种模型的一个例子）。正则化向目标函数添加惩罚项，以阻止较大的参数值。通过将参数驱动到较小（或零）值，它们对预测的贡献减少，从而有效地简化了模型。\n\
  - 集成方法：组合多个较弱模型的预测可以带来更好的泛化能力，同时也能提升性能。\n\n重要的是要注意，过拟合及其防止技术是特定于我们模型的。我们的目标应始终是尽量减少过拟合，以确保对未见数据的泛化。某些策略（例如正则化）可能不适用于特定模型，而其他策略可能更有效。还有一些针对模型的更具针对性的策略，我们将在讨论决策树过拟合时看到一个示例。\n\
  \n### 监督学习\n\n商店销售示例是监督学习的一个实例——我们有一个由特征组成的数据集，并正在训练模型来预测目标。\n\n监督学习问题可以分为两大类问题类别：分类问题和回归问题。\n\
  \n### 分类与回归\n\n在分类问题中，模型需要预测的标签是类别标签或定义一个类。类的示例包括垃圾邮件或非垃圾邮件、猫或狗、糖尿病或非糖尿病。这些是二进制分类的示例：只有两个类。\n\
  \n多类分类也是可能的；例如，电子邮件可能被分类为重要、促销、杂项或垃圾邮件；云的图像可能被分类为卷云、积云、层云或雨云。\n\n在回归问题中，目标是预测连续的数值。示例包括预测收入、销售额、温度、房价和人群规模。\n\
  \n机器学习艺术的很大一部分在于将问题正确定义或转录为分类或回归问题（或者可能是非监督或强化学习）。后续章节将涵盖这两类问题的多个端到端案例研究。\n\n###\
  \ 模型性能指标\n\n让我们简要讨论如何衡量模型的性能。模型性能是指机器学习模型基于给定输入进行准确预测或生成有意义输出的能力。评估指标量化了模型对新的未见数据的泛化程度。\n\
  \n\n\n\n\n模型性能高表明模型有效地学习了数据中的底层模式，并能对未见过的数据做出准确预测。在处理监督学习问题（无论是分类还是回归问题）时，我们可以根据已知目标来衡量模型的性能。\n\
  \n重要的是，衡量分类任务和回归任务上模型性能的方法不同。scikit-learn 内置了许多可直接用于分类或回归问题的指标函数（https://scikit-learn.org/stable/modules/model_evaluation.html）。让我们回顾一下其中最常见的指标。\n\
  \n分类指标可以根据模型做出的正预测和负预测来定义。以下定义可用于计算分类指标：\n\n- **真阳性（TP）**：正实例被正确分类为正\n- **真阴性（TN）**：负实例被正确分类为负\n\
  - **假阳性（FP）**：负实例被错误地分类为正\n- **假阴性（FN）**：正实例被错误地分类为负\n\n基于这些定义，最常见的 *分类* 指标如下：\n\
  \n- **准确率**：准确率是最直观的分类指标。准确率是正确预测的数量除以预测总数。然而，准确率容易受到数据不平衡的影响。例如，假设我们有一个电子邮件数据集，包含\
  \ 8 个垃圾邮件示例和 2 个非垃圾邮件示例，而我们的模型只预测垃圾邮件。在这种情况下，模型的准确率为 80%，即使它从未正确分类非垃圾邮件。从数学上讲，我们可以这样定义准确率：\n\
  \n  \\( Accuracy = \\frac{TP + TN}{TP + FP + TN + FN} \\)\n\n- **精确率**：精确率得分是深入了解分类性能的一种方法。精确率是真阳性预测（正确预测）与所有正预测（真阳性和假阳性）之间的比率。换句话说，精确率得分表明模型预测正类的精确程度。在我们的垃圾邮件示例中，只预测垃圾邮件的模型不太精确（因为它将所有非垃圾邮件都分类为垃圾邮件），并且精确率得分较低。可以使用以下公式计算精确率：\n\
  \n  \\( Precision = \\frac{TP}{TP + FP} \\)\n\n- **召回率**：召回率得分是精确率得分的对应指标。召回率得分衡量模型查找（或召回）所有真阳性案例的效果。召回率计算为真阳性预测与所有正实例（真阳性和假阴性）之间的比率。在我们的垃圾邮件示例中，只预测垃圾邮件的模型具有完美的召回率（它可以找到所有垃圾邮件）。我们可以这样计算召回率：\n\
  \n  \\( Recall = \\frac{TP}{TP + FN} \\)\n\n- **F1 分数**：最后，我们有 F1 分数。F1 分数计算为精确率和召回率的调和平均数。F1\
  \ 分数平衡精确率和召回率，给出一个总结分类器性能的单一值。可以使用以下公式计算 F1 分数：\n\n  \\(F_1 = \\frac{2 \\times Precision\
  \ \\times Recall}{Precision + Recall} = \\frac{2 \\times TP}{2 \\times TP + FP +\
  \ FN}\\)\n\n前述分类指标是最常见的，但还有更多指标。尽管 F1 分数常用于分类问题（因为它汇总了精确率和召回率），但选择最佳指标取决于你正在解决的具体问题。通常，可能需要特定的指标，但其他时候，你必须根据经验和对数据的理解来选择。我们将在本书后面查看不同指标的示例。\n\
  \n以下是常见的回归指标：\n\n- **均方误差**（MSE）：MSE 计算为预测值与实际值之间平方差的平均值。MSE 常用是因为一个关键的数学属性：MSE\
  \ 是 *可微* 的，因此适合用于基于梯度的学习方法。然而，由于差值被平方，MSE 对大错误的惩罚比小错误更严重，这可能适合也可能不适合正在解决的问题。\n\n\
  - **平均绝对误差**（MAE）：MAE 不对差值求平方，而是计算预测值与实际值之间绝对差的平均值。通过避免对错误求平方，MAE 对错误的大小更具鲁棒性，且比\
  \ MSE 对异常值的敏感度更低。然而，MAE 不可微，因此不能用于基于梯度的学习方法。\n\n与分类指标一样，选择最合适的回归指标取决于你正在尝试解决的具体问题。\n\
  \n> **指标 versus 目标**\n> \n> 我们将模型训练定义为寻找最合适的参数以最小化 *目标函数*。需要注意的是，特定问题使用的目标函数和指标可能不同。决策树就是一个很好的示例，构建树时使用不纯度度量（熵）作为目标函数。然而，我们仍然计算之前解释过的指标来确定树在数据上的性能。\n\
  \n在掌握基本指标的理解后，我们可以结束对机器学习概念的介绍。现在，让我们通过一个示例来回顾我们讨论过的术语和概念。\n\n## 建模示例\n\n请参考以下按月份划分的销售数据（单位：千）：\n\
  \n| 一月 | 二月 | 三月 | 四月 | 五月 | 六月 |\n|---|---|---|---|---|---|\n| 4,140 | 4,850 |\
  \ 7,340 | 6,890 | 8,270 | 10,060 |\n| 七月 | 八月 | 九月 | 十月 | 十一月 | 十二月 |\n| 8,110 |\
  \ 11,670 | 10,450 | 11,540 | 13,400 | 14,420 |\n\n表 1.1 – 按月份划分的示例销售数据（单位：千）\n\n\
  这个问题很简单：只有一个特征，即月份，目标是销售数量。因此，这是一个监督回归问题的示例。\n\n> > **注意**\n> > 你可能已经注意到，这是一个时间序列问题的示例：时间是主要变量。时间序列也可以使用更高级的时间序列专用算法（如\
  \ ANOVA）来预测，但本节将使用简单算法进行说明。\n\n我们可以将数据绘制为每月销售图表，以便更好地理解：\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_34_0.png)\n\
  \n图 1.3 – 显示商店按月销售的图表\n\n这里，我们使用直线模型（也称为简单线性回归）来模拟销售数据。直线的定义由以下公式给出：\n\n\\( y =\
  \ mx + c \\)\n\n这里，\\( m \\) 是直线的斜率，\\( c \\) 是 Y 轴截距。在机器学习中，直线是模型，\\( m \\) 和 \\\
  ( c \\) 是模型参数。\n\n为了找到最佳参数，我们必须衡量模型对特定参数集拟合数据的效果——即输出中的误差。我们将使用 MAE 作为指标：\n\n\\\
  ( MAE = \\frac{\\sum_{i=1}^n |\\hat{y} - y|}{n} \\)\n\n这里，\\( \\hat{y} \\) 是预测输出，\\\
  ( y \\) 是实际输出，\\( n \\) 是预测数量。我们通过对每个输入进行预测，然后根据公式计算 MAE 来计算 MAE。\n\n## 拟合模型\n\n\
  现在，让我们将线性模型拟合到数据中。拟合直线的过程是迭代的，我们首先猜测 \\( m \\) 和 \\( c \\) 的值，然后从那里开始迭代。例如，让我们考虑\
  \ \\( m = 0.1 \\)，\\( c = 4 \\)：\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_35_0.png)\n\
  \n图 1.4 – 显示 m = 0.1 和 c = 4 的线性模型预测的图表\n\n使用这些参数，我们得到的误差为 4,610。\n\n我们的猜测远远偏低，但没关系；我们现在可以更新参数以尝试改善误差。实际上，更新模型参数是通过梯度下降等训练算法完成的。我们将在\
  \ _第 2 章，集成学习 – 装袋和提升_ 中讨论梯度下降。\n\n\n\n\n\n在本示例中，我们将利用对直线的理解和直觉，手动更新每次迭代的参数。我们的直线太平缓，截距太低；因此，我们必须增加这两个值。我们可以通过选择一个\
  \ _step size_ 来控制每次迭代所做的更新。我们必须在每次迭代中通过添加 step size 来更新 _m_ 和 _c_ 值。对于 step size\
  \ 为 0.1 的情况，结果如表 1.2 所示。\n\n| 猜测# | m | c | MAE |\n|---|---|---|---|\n| 1 | 0.1\
  \ | 4 | 4.61 |\n| 2 | 0.2 | 4.1 | 3.89 |\n| 3 | 0.3 | 4.2 | 3.17 |\n| 4 | 0.3 |\
  \ 4.3 | 2.5 |\n| 5 | 0.4 | 4.4 | 1.83 |\n\n表 1.2 – 逐步猜测直线斜率（**_m_**）和 y 轴截距（**_c_**）以拟合我们的数据。拟合优度使用\
  \ MAE 进行衡量。\n\n在我们的示例中，_step size_ 是我们训练过程的一个 _hyperparameter_。\n\n我们最终得到的误差为 1.83，这意味着，平均而言，我们的预测误差小于\
  \ 2。\n\n现在，让我们看看如何使用 scikit-learn 来解决这个问题。\n\n## 使用 scikit-learn 进行线性回归\n\n与手动建模不同，我们可以使用\
  \ scikit-learn 构建线性回归模型。由于这是我们的第一个示例，我们将逐行讲解代码并解释正在发生的事情。\n\n首先，我们必须导入将要使用的 Python\
  \ 工具：\n\n```\nimport numpy as np\nimport pandas as pd\n\nfrom matplotlib import\
  \ pyplot as plt\nimport seaborn as sns\n\nfrom sklearn.linear_model import LinearRegression\n\
  from sklearn.metrics import mean_absolute_error\n```\n\n这里有三组导入：我们首先导入 numpy 和 pandas。导入\
