  ML 领域。


  每章的设计都充分考虑了实用性。真实世界的案例研究与理论见解交织在一起，确保您的学习植根于具体应用。我们对 LightGBM 的关注——它有时会被更主流的算法所掩盖——为欣赏和在各种场景中应用梯度提升提供了独特的视角。


  对于那些好奇本书与众不同之处的人，答案在于我们务实的方法。我们以超越单纯解释算法或工具而自豪。相反，我们将优先考虑动手实践、案例研究和现实世界挑战，确保您不仅是在阅读，更是在“实践”ML。


  在浏览各章时，请记住 ML 的世界广阔且不断发展。尽管本书内容全面，但它只是您在该领域终身学习和探索旅程中的一块垫脚石。在探索 LightGBM、数据科学、MLOps
  等世界时，请保持开放的心态，保持好奇心，并准备好动手编码。


  ## 本书适用人群


  _使用 LightGBM 和 Python 进行机器学习：构建生产就绪机器学习系统的实践者指南_ 专为渴望利用 ML 的力量挖掘数据潜力的广泛读者而设计。本书的目标受众包括：


  - **ML 初学者：** 刚踏入 ML 领域的个人将发现本书非常有益。它从基础 ML 原理开始，并向他们介绍使用 LightGBM 进行梯度提升，使其成为新手的绝佳入门读物。

  - **经验丰富的数据科学家和 ML 从业人员：** 对于已经熟悉 ML 领域但希望加深 LightGBM 和/或 MLOps 知识的人，本书提供了高级见解、技巧和实际应用。

  - **渴望了解更多数据科学知识的软件工程师和架构师：** 希望转向数据科学或将 ML 集成到其应用程序中的软件专业人员将发现本书有价值。本书从理论和实践两个角度阐述
  ML，强调动手编码和实际应用。

  - **MLOps 工程师和 DevOps 专业人员：** 从事 MLOps 领域工作或希望了解生产环境中 ML 模型的部署、扩展和监控的人，将受益于专门介绍
  MLOps、管道和部署策略的章节。

  - **学者和学生：** 讲授 ML、数据科学或相关课程的教职人员，以及攻读这些领域的学生，都会发现本书既是一本信息丰富的教科书，也是一本实用指南。


  必须具备 Python 编程知识。熟悉 Jupyter 笔记本和 Python 环境是加分项。无需事先具备 ML 知识。


  简而言之，任何对数据有偏爱、具备 Python 编程背景并渴望使用 LightGBM 探索 ML 多元世界的人，都会发现本书是其知识库中值得添加的宝贵资源。


  ## 本书内容概览


  *第 1 章，机器学习简介，* 开启我们进入 ML 的旅程，从软件工程的视角审视 ML。我们将阐述该领域核心的重要概念，如模型、数据集以及各种学习范式，并通过使用决策树的动手示例确保清晰易懂。


  *第 2 章，集成学习——装袋与提升，* 深入探讨集成学习，重点介绍应用于决策树的装袋和提升技术。我们将探讨随机森林、梯度提升决策树等算法，以及 **脱校正遇加性回归树（DART）**
  等更高级的概念。


  *第 3 章，Python 中的 LightGBM 概述，* 考察 LightGBM，这是一个具有基于树学习器的高级梯度提升框架。重点介绍其独特的创新和对集成学习的改进，我们将引导您了解其
  Python API。使用 LightGBM 的全面建模示例（配备高级验证和优化技术），为深入探索数据科学和生产系统 ML 铺平了道路。


  *第 4 章，LightGBM、XGBoost 与深度学习的对比，* 将 LightGBM 与两种突出的表格数据建模方法——XGBoost 和 **深度神经网络（DNNs）**（具体为
  TabTransformer）——相抗衡。我们将通过对两个数据集的评估来评估每种方法的复杂性、性能和计算成本。本章的精髓在于确定 LightGBM 在更广泛 ML
  格局中的竞争力，而非深入研究 XGBoost 或 DNN。


  第 5 章，使用 Optuna 进行 LightGBM 参数优化，聚焦于超参数优化这一关键任务，介绍 Optuna 框架作为一种强大的解决方案。涵盖各种优化算法和剪枝超参数空间的策略，本章将引导您通过使用
  Optuna 优化 LightGBM 参数的动手示例。


  第 6 章，使用 LightGBM 解决现实世界数据科学问题，系统地分解数据科学流程，并将其应用于两个不同的案例研究——一个回归问题和一个分类问题。本章阐明了数据科学生命周期的每个步骤。您将体验使用
  LightGBM 进行动手建模，并辅以全面的理论。本章也可作为使用 LightGBM 开展数据科学项目的蓝图。


  第 7 章，使用 LightGBM 和 FLAML 进行 AutoML，深入探讨自动化机器学习（AutoML），强调其在简化和加速数据工程及模型开发方面的重要性。我们将介绍
  FLAML，这是一个使用高效超参数算法自动化模型选择和微调的知名库。通过一个实际案例研究，您将目睹 FLAML 与 LightGBM 的协同效应，以及改变游戏规则的零样本
  AutoML 功能，该功能使调优过程变得多余。


  第 8 章，使用 LightGBM 进行机器学习管道和 MLOps，从建模的复杂性转向生产 ML 的世界。它向您介绍 ML 管道，以确保一致的数据处理和模型构建，并涉足
  MLOps（DevOps 和 ML 的融合），这对于部署弹性的 ML 系统至关重要。


  第 9 章，使用 AWS SageMaker 进行 LightGBM MLOps，将我们的旅程引向 Amazon SageMaker，即 Amazon Web
  Services 用于构建和维护 ML 解决方案的综合套件。我们将通过深入研究偏差检测、模型可解释性以及自动化、可扩展部署的细微差别等高级领域，加深对 ML 管道的理解。


  第 10 章，使用 PostgresML 的 LightGBM 模型，介绍 PostgresML，这是一个独特的 MLOps 平台和 PostgreSQL 数据库扩展，可直接通过
  SQL 促进 ML 模型的开发和部署。这种方法虽然与我们所采用的 scikit-learn 编程风格形成对比，但展示了数据库级 ML 的优势，尤其是在数据移动效率和更快推理方面。


  第 11 章，使用 LightGBM 进行分布式和基于 GPU 的学习，深入探讨利用分布式计算集群和 GPU 训练 LightGBM 模型的广阔领域。通过利用分布式计算，您将了解如何大幅加速训练工作负载，并管理超出单台机器内存容量的数据集。






