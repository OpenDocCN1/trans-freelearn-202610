  \ DataFrame 中。\n\n数据准备就绪后，我们进入代码中有趣的部分：使用 scikit-learn 进行建模。代码很简单：\n\n```python\n\
  model = LinearRegression()\nmodel = model.fit(df[[\"month\"]], df[[\"sales\"]])\n\
  ```\n\n首先，我们通过构造 LinearRegression 的实例来创建模型。然后，我们使用 model.fit 并传入 DataFrame 中的月份和销售额数据来拟合模型。这两行代码足以拟合一个模型，正如我们在后续章节中将看到的，即使是复杂的模型也使用相同的方法来实例化和训练模型。\n\
  \n我们现在可以通过为数据创建预测，并将预测值和实际目标传递给指标函数来计算 MAE：\n\n```python\npredicted_sales = model.predict(df[[\"\
