  \ Machado, L. Baptista 和 M. V. Martins，预测学生辍学和学术成功，Zenodo，2021。\n\n## 比较 LightGBM、XGBoost\
  \ 和深度学习\n\n上一章介绍了用于构建梯度提升决策树 (GBDT) 的 LightGBM。在本章中，我们将 LightGBM 与另外两种用于表格数据建模的方法进行比较：XGBoost，另一个用于构建梯度提升树的库；以及深度神经网络\
  \ (DNN)，一种最先进的机器学习技术。\n\n我们在两个数据集上比较 LightGBM、XGBoost 和 DNN，重点关注复杂性、数据集准备、模型性能和训练时间。\n\
  \n本章面向高级读者，需要一定的深度学习基础。然而，本章的主要目的不是详细理解 XGBoost 或 DNN（这两种技术在后续章节中都不会使用）。相反，在本章结束时，你应该了解\
  \ LightGBM 在机器学习领域有多具竞争力。\n\n本章的主要主题如下：\n\n- XGBoost 概述\n- 深度学习与 TabTransformers\n\
  - 比较 LightGBM、XGBoost 和 TabTransformers\n\n## 技术要求\n\n本章包含示例和代码片段，说明如何在 Python 中训练\
  \ LightGBM、XGBoost 和 TabTransformer 模型。本章完整示例和设置合适环境的说明可在以下 GitHub 仓库中找到：https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-4。\n\
  \n\n\n\n\n## XGBoost 概述\n\nXGBoost，即 eXtreme Gradient Boosting 的缩写，是一个广受欢迎的开源梯度提升库，其目标和功能与\
  \ LightGBM 相似。XGBoost 比 LightGBM 更早，由 Tianqi Chen 开发，最初发布于 2014 年 [1]。\n\n从本质上讲，XGBoost\
  \ 实现了 GBDT，并支持高效地构建它们。XGBoost 的一些主要功能如下：\n\n- **正则化**：XGBoost 同时融合了 L1 和 L2 正则化，以避免过拟合\n\
  - **稀疏感知**：XGBoost 能高效处理稀疏数据和缺失值，并在训练期间自动学习最佳填充策略\n- **并行化**：该库采用并行和分布式计算技术同时训练多棵树，显著缩短训练时间\n\
  - **早停**：XGBoost 提供在模型性能没有显著提升时停止训练过程的选项，从而提升性能并防止过拟合\n- **跨平台兼容性**：XGBoost 支持多种编程语言，包括\
  \ Python、R、Java 和 Scala，使其面向多样化的用户群体\n\n多年来，由于 XGBoost 支持多种应用，且该库易于使用且高效，因此在机器学习社区中获得了广泛的欢迎。\n\
  \n## 比较 XGBoost 和 LightGBM\n\nXGBoost 和 LightGBM 在功能上存在相当大的重叠。两个库都实现了 GBDT 和 DART，并支持构建随机森林。两者都具有类似的避免过拟合技术，并能自动处理缺失值和稀疏数据。\n\
  \n不过，XGBoost 和 LightGBM 之间的一些差异如下：\n\n- **树生长策略**：XGBoost 采用逐层树生长方法，即逐层构建树；而 LightGBM\
  \ 使用按叶子生长策略，专注于选择增益最大的叶子来生长树。这种生长策略的差异通常使 LightGBM 更快，尤其是在处理大型数据集时。\n- **速度与可扩展性**：LightGBM\
  \ 在内存使用和计算时间方面设计得更高效，因此更适合大规模数据集或训练时间至关重要的场景。不过，这种速度优势有时会以模型预测的方差更高为代价。\n- **类别特征处理**：LightGBM\
  \ 内置对类别特征的支持，可以直接处理它们，无需独热编码或其他预处理技术。相比之下，XGBoost 要求用户在将数据输入模型之前预处理类别特征。\n- **早停**：如果模型性能没有显著提升，XGBoost\
  \ 提供停止训练过程的选项。LightGBM 没有内置此功能，但可以通过回调手动实现，如前面章节所示。\n\n总结来说，LightGBM 和 XGBoost 提供相似的功能。LightGBM\
  \ 在具有大量特征的大型数据集上表现更好，而 XGBoost 在较小或中等规模的数据集上可能提供更稳定、更准确的结果。\n\n## Python XGBoost\
  \ 示例\n\nXGBoost 提供基于 scikit-learn 的接口来构建模型。以下示例展示了如何在森林覆盖数据集上使用 XGBoost：\n\n```\n\
  from xgboost import XGBClassifier\n...\ndataset = datasets.fetch_covtype()\n\nX_train,\
  \ X_test, y_train, y_test = train_test_split(\n    dataset.data, dataset.target,\
  \ random_state=179\n)\ny_train = y_train - 1\ny_test = y_test - 1\nxgb = XGBClassifier(\n\
  \    n_estimators=150, max_leaves=120, learning_rate=0.09\n)\nxgb = xgb.fit(X_train,\
  \ y_train)\nf1_score(y_test, xgb.predict(X_test), average=\"macro\")\n```\n\n到本阶段，scikit-learn\
  \ 接口应该对你来说已经很熟悉了。前面的代码显示，XGBoost 支持与我们用于训练基于 LightGBM 的模型时相似的超参数。完整的参数列表可在 https://xgboost.readthedocs.io/en/stable/parameter.html\
  \ 查看。\n\nXGBoost 作为另一个梯度提升库，是 LightGBM 的直接替代方案。在下一节中，我们将探讨深度学习——一种完全不同但极其流行的学习技术——以及它在表格学习问题上与梯度提升的对比情况。\n\
  \n## 深度学习与 TabTransformers\n\n我们现在探讨一种使用深度学习解决基于表格的数据问题的方法。近年来，由于深度学习模型的出色表现，深度学习获得了巨大的流行度。基于深度学习的技术，例如\
  \ AlphaZero、Stable Diffusion 以及 GPT 系列语言模型，在游戏、艺术生成和基于语言的推理方面都已达到人类或超人水平。\n\n###\
  \ 什么是深度学习？\n\n深度学习是更广泛的人工神经网络机器学习领域的一个子领域。人工神经网络是对人脑的数学模拟，由相互连接的节点层（或“神经元”在生物学术语中）组成，这些节点用于处理和传输信息。\n\
  \n简单的人工神经网络仅包含几层。深度学习中的“深”指的是使用拥有更多层的神经网络，每层可能包含数千个神经元。这些层以层级方式组织，底部为输入层，顶部为输出层，中间为隐藏层。每层在数据通过网络时提取和精炼特征，使模型能够学习复杂的模式和表示。\n\
  \n下图展示了一个名为多层感知机的简单神经网络，它具有一个隐藏层。\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_88_0.png)\n\
  \n图 4.1 – 具有一个隐藏层和一个输出层的多层感知机。各层完全连接\n\n每个神经元接收来自其他神经元的输入，执行数学运算，然后将结果传递给下一层神经元。\n\
  \n该数学运算涉及两个主要步骤——加权和与激活函数：\n\n1. **加权和**：神经元获取输入（输入数据或来自前一层神经元的输出），将每个输入乘以其对应的权重，然后将它们相加。通常会向加权和中添加一个偏置项，以便更好地控制神经元的输出。从数学上表示如下：\n\
  \n   \\( z_j = \\sum_i(w_{ij}x_i) + b_j \\)\n\n   这里，\\( x_i \\) 表示神经元的所有输入，\\(\
  \ w_{ij} \\) 是与第 \\( i \\) 个输入关联的权重，\\( b_j \\) 是神经元的偏置。\n\n2. **激活函数**：随后将加权和传递到激活函数中，以确定神经元的输出。激活函数的目的是将非线性引入数学运算中。非线性使神经网络能够建模输入与输出之间的非线性，因此是复杂的关系。存在多种激活函数，例如\
  \ **sigmoid**（逻辑函数）、**双曲正切 (tanh）** 和 **修正线性单元 (ReLU)**，每种都有其自身的特性和应用场景。可以表示为：\n\
  \n   \\( a_j = \\sigma(z_j) \\)\n\n   其中，\\( a_j \\) 是神经元输出，\\( \\sigma \\) 是激活函数。\n\
  \n结合这两个步骤，神经网络中的一个神经元处理输入数据，使网络能够学习和建模复杂的模式。\n\n神经网络通过调整与神经元相关的权重进行训练。该算法可以总结如下：\n\
  \n1. 权重初始化为小的随机值。\n2. 执行 **前向传播**：对于批次中的每个样本，将输入特征传递给整个网络（在每个神经元处计算求和和激活），以在输出层产生预测。\n\
  3. 随后通过将输出与批次中每个样本的实际输出进行比较来计算损失。与 GBDT 类似，损失函数必须可微分，标准损失函数包括 MSE 和交叉熵损失。\n4. 执行\
  \ **反向传播**：使用微积分链式法则计算损失函数相对于权重的梯度。该过程从输出层开始，向后通过网络。\n5. 随后根据反向传播的梯度，使用梯度下降或其现代变体（如\
  \ Adam）来更新权重。\n6. 该过程重复设定数量的 epoch（每个 epoch 遍历整个数据集），以最小化损失函数。\n\n神经网络的一个独特属性是，神经网络已被证明是\
  \ **通用函数逼近器**。深度神经网络（DNN）在理论上能够逼近任何连续函数，精度可达\n\n\n所需的精度水平，前提是拥有足够数量的隐藏神经元和适当的激活函数。这一特性基于**通用逼近定理**，该定理已针对各种类型的神经网络得到证明。\n\
  \n这意味着神经网络可以学习表示输入和输出数据之间的复杂关系，无论这些关系多么复杂或非线性。这种能力是神经网络（尤其是 DNNs）能够成功解决不同领域中广泛问题的原因之一。然而，这一保证是理论上的。在实践中，找到合适的网络架构、超参数和训练技术以达到所需的近似水平可能具有挑战性。该过程通常需要实验、专业知识和高昂的计算资源。\n\
  \n## 深度学习的优缺点\n\n鉴于 DNNs 的能力，我们可能会认为它们应该是解决所有机器学习问题的首选。使用 DNNs 的主要优势在于其在非常复杂领域中的高精度：在广泛复杂任务、自然语言处理、生成式\
  \ AI、图像识别和语音识别方面的当前最先进性能均由 DNNs 实现，因为它们能够在大型数据集中学习复杂和隐藏的模式。\n\n另一个优势是自动特征提取。使用正确的架构，DNN\
  \ 可以自动提取复杂或高阶特征，从而减少数据科学家进行特征工程的需求。\n\n最后，DNN 还可以进行迁移学习：预训练的深度学习模型可以在较小的数据集上针对特定任务进行微调，利用初始训练期间获得的知识。迁移学习可以显著减少新任务的训练时间和数据需求。\n\
  \n然而，深度学习并非解决所有机器学习问题的万能药。使用 DNNs 的一些缺点包括：\n\n- **计算资源**：深度学习模型训练通常需要大量的计算能力和内存，尤其是在处理大型数据集和复杂架构时。\n\
  - **大型数据集**：DNNs 在大型数据集上训练时通常表现良好，但在较小数据集上训练时性能可能下降。当数据集太小时，DNN 会过拟合训练数据且无法推广到未见数据。\n\
  - **可解释性**：由于其复杂的架构和大量参数，DNN 通常被视为“黑箱”。这种复杂性会使理解模型如何做出决策变得困难，这可能成为需要透明度或监管合规性的应用的关注点。\n\
  - **超参数调优**：DNN 涉及大量超参数，例如网络架构、学习率和激活函数。结合更长的训练时间和资源需求，找到这些超参数的最佳组合可能既昂贵又耗时。\n\n\
  ## TabTransformers 简介\n\n我们希望将深度学习应用于表格数据，因为大多数实际机器学习问题都涉及表格数据。为此，我们使用一种称为 **TabTransformer**\
  \ 的新深度学习架构：一种专门设计用于处理表格数据的深度神经网络模型。\n\n与 DNN 的 GPT 家族类似，TabTransformer 基于 Vaswani\
  \ 等人最初引入的 Transformer 架构 [2]。TabTransformer 调整 Transformer 架构以有效处理表格数据，为决策树和梯度提升机等其他机器学习模型提供了一种替代方案，用于此类数据\
  \ [3]。\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_91_0.png)\n\n图 4.2 – Keras 中实现的\
  \ TabTransformer 架构 [3]\n\nTabTransformer 的模型架构如图 4.2 所示。使用 TabTransformer 时，表格数据中的每个特征都被视为一个\
  \ token，类似于自然语言处理中将单词视为 token 的方式。模型应用自注意力机制来学习输入数据中特征之间的复杂交互和依赖关系。token 嵌入和注意力机制使模型能够捕捉特征之间的全局和局部关系。\n\
  \nTabTransformer 模型包含几个关键组件：token 嵌入、位置编码、Transformer 层、池化层和输出层。token 嵌入将每个特征值转换为连续向量表示，并通过位置编码结合位置信息。\n\
  \n通过图 4.2 所示的层，我们可以看到分类特征和数值特征被分开处理。\n\n分类特征首先通过嵌入层，由 Keras 中的 `layers.Embedding`\
  \ 实现，然后传递给 Transformer 块。可以实现可变数量的 Transformer 块（通过超参数设置），但每个块都包含一个 `layers.MultiHeadAttention`\
  \ 层和一个带 Dropout 的 `layers.Dense` 层。输出值在通过注意力层和稠密层后相加并进行归一化。\n\n由于其性能，我们的实现中 Transformer\
  \ 前馈层使用高斯误差线性单元（GELU）激活函数。不过，也可以使用其他激活函数 [5]。\n\n数值特征经过归一化层（归一化数值输入范围），然后与 Transformer\
  \ 的输出拼接。\n\n拼接后的结果经过多层感知机（MLP）块，该块包含可变数量的稠密层，每层都带有 Dropout。我们的实现使用缩放指数线性单元（SELU），它会使激活值自归一化\
  \ [6]。\n\n最后，MLP 块的输出被传递给损失函数，其具体实现取决于学习问题（分类或回归）。\n\nTabTransformers 的实现和训练比梯度提升树复杂得多。与其他\
  \ DNN 一样，TabTransformers 比梯度提升树需要更多的数据准备和计算能力。\n\n除了 TabTransformers，本节还介绍了深度学习及其优缺点。在下一节中，我们将使用实际示例来比较不同的方法，包括使用\
  \ TabTransformers 的复杂性。\n\n## 比较 LightGBM、XGBoost 和 TabTransformers\n\n本节将比较 LightGBM、XGBoost\
  \ 和 TabTransformers 在两个不同数据集上的性能。我们还将探讨更多针对类别不平衡、缺失值和分类数据的数据准备技术。\n\n### 预测人口普查收入\n\
  \n我们使用的第一个数据集是 Census Income 数据集，它根据教育、婚姻状况、职业等属性预测个人收入是否超过 50,000 美元 [4]。该数据集有\
  \ 48,842 条实例，正如我们将看到的，存在一些缺失值和类别不平衡。\n\n该数据集可从以下 URL 获取：https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data。数据已分为训练集和测试集。加载后，我们可以对数据进行采样：\n\
  \n```\ntrain_data.sample(5) [[\"age\", \"education\", \"marital_status\", \"hours_per_week\"\
  , \"income_bracket\"]]\n```\n\n所选列的数据样本如表 4.1 所示。\n\n| | 年龄 | 教育 | 婚姻状况 | 每周工作小时\
  \ | 收入区间 |\n|---|---|---|---|---|---|\n| 12390 | 34 | Some-college | Never-married\
  \ | 40 | <=50K |\n| 20169 | 41 | Assoc-acdm | Married-civ-spouse | 45 | >50K |\n\
  | 17134 | 35 | Doctorate | Never-married | 60 | >50K |\n| 23452 | 49 | HS-grad |\
  \ Married-civ-spouse | 40 | >50K |\n| 22372 | 31 | HS-grad | Separated | 45 | <=50K\
  \ |\n\n表 4.1 – Census Income 数据集的示例数据\n\n表 4.1 显示我们拥有混合数据类型：某些特征是数值型，而其他则是文本型。值得注意的是，数据集中的某些列是**分类特征**：具有固定值集合的字符串特征。接下来，我们将了解如何对这些特征进行编码以供机器学习使用。\n\
  \n### 对分类特征进行编码\n\n大多数机器学习算法需要将字符串特征编码为数字；在某些情况下，这可以自动完成。我们在第 6 章《使用 LightGBM 解决现实世界的数据科学问题》中讨论了\
  \ LightGBM 的自动编码。在本示例中，我们对特征进行编码以了解这涉及哪些内容。\n\n我们需要将每个分类值映射到唯一数字；因此，我们首先为每个特征构建所有值的词汇表：\n\
  \n```\nCATEGORICAL_FEATURES_WITH_VOCABULARY = {\n    \"workclass\": sort_none_last(list(train_data[\"\
  workclass\"].unique())),\n    \"education\": sort_none_last(list(train_data[\"education\"\
  ].unique())),\n    \"marital_status\": sort_none_last(list(train_data[\"marital_status\"\
  ].unique())),\n}\n```\n\n\n\n\n\"occupation\": sort_none_last(list(train_data[\"\
  occupation\"].unique())),\n\"relationship\": sort_none_last(list(train_data[\"relationship\"\
  ].unique())),\n\"race\": sort_none_last(list(train_data[\"race\"].unique())),\n\"\
  gender\": sort_none_last(list(train_data[\"gender\"].unique())),\n\"native_country\"\
  : sort_none_last(list(train_data[\"native_country\"].unique())),\n\"income_bracket\"\
  : sort_none_last(list(train_data[\"income_bracket\"].unique())),\n}\n\n前面的代码将每个列的唯一值提取到列表中并对列表进行排序，将空值放在最后。使用\
  \ pandas DataFrame 时，显式将分类列的数据类型设置为 category 也很有用：\n\n```\nfor c in CATEGORICAL_FEATURES_WITH_VOCABULARY.keys():\n\
  \    for dataset in [train_data, test_data]:\n        dataset[c] = dataset[c].astype('category')\n\
  \        dataset[c] = dataset[c].astype('category')\n```\n\n使用我们的词汇表，现在可以将每个列中的值更新为表示其类别的数字（使用词汇表列表中的索引作为数值）：\n\
  \n```\ndef map_to_index(val, vocab):\n    if val is None:\n        return None\n\
  \    return vocab.index(val)\n\nfor dataset in (train_data, test_data):\n    for\
  \ feature, vocab in CATEGORICAL_FEATURES_WITH_VOCABULARY.items():\n        dataset[feature]\
  \ = dataset[feature].map(lambda val: map_to_index(val, vocab))\n```\n\n结果是一个所有特征现在都是数值的\
  \ DataFrame：\n\n| | age | education | marital_status | hours_per_week | income_bracket\
  \ |\n|---|---|---|---|---|---|\n| 18545 | 37 | 11 | 2 | 40 | 0 |\n| 26110 | 51 |\
  \ 14 | 0 | 60 | 1 |\n| 21905 | 36 | 11 | 5 | 32 | 0 |\n| 1496 | 32 | 1 | 0 | 43\
  \ | 1 |\n| 3148 | 47 | 15 | 2 | 40 | 0 |\n\n我们的分类特征现在已编码，可以继续进行进一步的数据清洗。\n\n## 缺失值和重复项\n\
  \n我们需要检查缺失值、重复项和异常值。可以使用以下代码：\n\n```\ntrain_data.isnull().sum()\ntrain_data.drop_duplicates(inplace=True)\n\
  train_data.describe()\n```\n\n我们删除重复数据，查看 `describe` 的输出显示没有显著的异常值。但是，数据集中存在 **缺失值**。LightGBM\
  \ 和 XGBoost 可以自动处理缺失值，这是基于树算法的一个显著优势。但是，对于 TabTransformer，我们需要实现特定逻辑来处理缺失值，正如我们接下来将看到的。\n\
  \n## 不平衡数据\n\n数据集也存在偏斜：每个类的示例数量不平衡。可以使用以下代码计算偏斜：\n\n```\ncounts = np.bincount(train_data[\"\
  income_bracket\"])\nclass_weight = {\n    0: counts[0] / train_data.shape[0],\n\
  \    1: counts[1] / train_data.shape[0]\n}\n```\n\n输出显示大约 75%/25% 向负类（0）偏斜。处理不平衡类（如果是二进制类）的最简单方法之一是给正类比负类更大的权重。因此，在计算损失时，漏掉正类的预测会有更大的影响。\n\
  \nLightGBM 和 XGBoost 都通过 `scale_pos_weight` 参数支持此功能，计算方法如下：\n\n```\nscale_pos_weight\
  \ = class_weight[0]/class_weight[1]\n```\n\n## 训练 LightGBM 和 XGBoost 模型\n\n数据清洗和准备就绪后，现在可以训练我们的模型了。训练\
  \ LightGBM 和 XGBoost 模型很简单。对于 LightGBM，我们有如下代码：\n\n```\nmodel = lgb.LGBMClassifier(force_row_wise=True,\
  \ boosting_type=\"gbdt\",\n                         scale_pos_weight=scale_pos_weight)\n\
  model = model.fit(X_train, y_train)\n```\n\n对于 XGBoost，可以运行以下代码：\n\n```\nmodel =\
  \ xgb.XGBClassifier(scale_pos_weight=scale_pos_weight)\nmodel = model.fit(X_train,\
  \ y_train)\n```\n\n前面的代码突出了使用这两个库的简单性。\n\n## 训练 TabTransformer 模型\n\n现在我们将构建一个 TabTransformer\
  \ 模型。我们将使用 TensorFlow 的 Keras 根据示例代码定义模型：https://keras.io/examples/structured_data/tabtransformer/。\n\
  \n我们的数据集准备基本保持不变，有两个关键区别：我们不编码分类特征，并且必须显式处理缺失值。\n\n我们不编码分类特征，因为 Keras 提供了一个特殊层来执行字符串查找和转换为数值。但是，我们仍然必须提供词汇表。以下代码说明了创建查找层：\n\
  \n```\nlookup = layers.StringLookup(\n    vocabulary=vocabulary,\n    mask_token=None,\n\
  \    num_oov_indices=0,\n    output_mode=\"int\",\n)\n```\n\nnum_oov_indices 参数设置为\
  \ 0，意味着如果遇到不在词汇表中的（OOV）值，则不使用任何索引。由于我们的词汇表是详尽的，因此不需要此设置。mask_token 参数也设置为 None，因为我们没有对任何字符串输入进行掩码。\n\
  \n我们需要为数据集中的每个列提供默认值来处理缺失值。我们的策略是将字符串值替换为默认字符串值 NA。我们使用数值列的统计均值来填充缺失值。以下代码创建默认值列表：\n\
  \n```\ntrain_data_description = train_data.describe()\nCOLUMN_DEFAULTS = [\n   \
  \ train_data_description[feature_name][\"mean\"] if feature_name in\n    NUMERIC_FEATURE_NAMES\
  \ else [\"NA\"]\n    for feature_name in HEADERS\n]\n```\n\n实现 TabTransformer 模型的\
  \ Keras 代码大约有 100 行长，可在我们的 GitHub 仓库中找到：https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/blob/main/chapter-4/tabtransformer-census-income.ipynb。\n\
  \n以下代码设置了可以与 TabTransformer 模型一起使用的梯度优化器和数据：\n\n```\noptimizer = tfa.optimizers.AdamW(\n\
  \    learning_rate=learning_rate,\n    weight_decay=weight_decay\n)\nmodel.compile(\n\
  \    optimizer=optimizer,\n    loss=keras.losses.BinaryCrossentropy(),\n    metrics=[keras.metrics.BinaryAccuracy(name=\"\
  accuracy\"),\n    f1_metric,\n    precision_metric,\n    recall_metric],\n)\ntrain_dataset\
  \ = get_dataset_from_csv(\n    train_data_file, batch_size, shuffle=True\n)\nvalidation_dataset\
  \ = get_dataset_from_csv(\n    test_data_file, batch_size\n)\n```\n\n我们使用带有权重衰减\
  \ [7] 的 AdamW 优化器和二元交叉熵损失函数来拟合二进制分类问题。然后可以使用以下代码训练和评估我们的模型：\n\n```\ncallback = keras.callbacks.EarlyStopping(\n\
  \    monitor='loss', patience=3\n)\nhistory = model.fit(\n    train_dataset,\n \
  \   epochs=num_epochs,\n    validation_data=validation_dataset,\n    class_weight=class_weight,\n\
  \    callbacks=[callback]\n)\nmodel.evaluate(validation_dataset, verbose=0)\n```\n\
  \n我们还通过 Keras 回调添加了早期停止，耐心为 3 个时代。在训练和验证期间，我们跟踪准确率和 F1 分数。\n\n训练所需时间比任一梯度提升框架都长得多，并且需要\
  \ GPU（在 CPU 上训练在技术上是可能的，但需要花费大量时间）。\n\n现在可以查看三个算法在 Census Income 数据集上的结果了。\n\n##\
  \ 结果\n\n使用前一章讨论的网格搜索技术对所有三个算法进行了参数优化。对于两个提升算法，优化了学习率、桶大小和树的数量。对于 TabTransformer，必须优化参数和架构的各个方面。就参数而言，优化了学习率、权重衰减和\
  \ dropout 率；就架构而言，必须选择 Transformer 块的数量和隐藏层（在 MLP 中）的数量。优化后的参数可在源代码中找到。\n\n以下表格显示了算法在验证集上的结果。\n\
  \n| Model | Training Time | Accuracy | F1 score |\n|---|---|---|---|\n| LightGBM\
  \ GBDT | 1.05s | 84.46% | 0.71 |\n| XGBoost GBDT | 5.5s | 84.44% | 0.72 |\n| TabTransformer\
  \ | 113.63s | 77.00% | 0.64 |\n\n表 4.3 – 在普查收入数据集上训练三个模型的结果\n\nXGBoost 和 LightGBM\
  \ 在该数据集上的表现相似，准确率达到 84%，F1 分数为 0.7。TabTransformer 模型表现较差，准确率和 F1 分数都较低。\n\n关于训练时间，LightGBM\
  \ 比其他方法快得多。LightGBM 模型的训练速度比 XGBoost 快 5.23 倍，比 TabTransformer 快 108.22 倍。TabTransformer\
  \ 在 8 核 P4000 GPU 上训练了 15 个时代。\n\n作为另一个比较点，并说明当没有分类特征时如何调整 TabTransformer 架构，我们将使用三个算法解决第二个问题。\n\
  \n## 检测信用卡欺诈\n\n我们的第二项任务是在信用卡交易数据集 [8] 中检测欺诈交易。数据集可在 https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud\
  \ 上获取。该任务是一个二进制分类问题，训练数据中的交易标记为非欺诈（0）和欺诈（1）。数据集仅包含为保密性而匿名化的数值特征。值得注意的是，数据集高度不平衡，欺诈交易仅占数据的\
  \ 0.17%。\n\n## 训练 LightGBM 和 XGBoost 模型\n\n由于所有值都是数值，梯度提升模型需要的数据准备工作很少。为了抵消数据集中的不平衡，我们再次计算\
  \ `scale_pos_weight` 并将其作为参数传递给模型。我们执行带交叉验证的网格搜索以找到良好的\n\n\n\nLightGBM 和 XGBoost\
  \ 模型的超参数。对于 LightGBM，尝试了 DART 和 GBDT 模型，其中 DART 表现更好。与普查收入数据集不同，信用卡数据集未预先划分为训练集和测试集。因此，我们应用五折交叉验证来衡量对未见数据的性能。以下代码训练\
  \ LightGBM 模型，XGBoost 代码非常相似：\n\n```\nmodel = lgb.LGBMClassifier(force_row_wise=True,\
  \ boosting_type=\"dart\",\nlearning_rate=0.0023, max_bin=384, n_estimators=300,\
  \ scale_pos_weight=scale_pos_weight, verbose=-1)\nscores = cross_val_score(model,\
  \ X, y, scoring=\"f1_macro\")\nprint (f\"Mean F1-score: {scores.mean()}\")\n```\n\
  \nLightGBM 和 XGBoost 的结果与 TabTransformer 结果一起显示在表 4.4 中。\n\n## 训练 TabTransformer\
  \ 模型\n\n没有分类特征时，TabTransformer 架构可以大大简化。让我们看看图 4.2 所示的架构。可以看到，嵌入层和注意力层不再需要。事实上，模型简化为常规\
  \ MLP（将模型仍称为变换器是不诚实的，因为根本没有使用注意力层）。\n\n除了移除不需要的层之外，其余架构和流程与普查收入问题保持相同。AdamW 再次用作优化器，我们对超参数和模型中的隐藏层数量进行网格搜索优化。与梯度提升模型一样，执行五折交叉验证来衡量性能。\n\
  \n## 结果\n\n尽管接下来也报告了准确率，但必须注意的是，它在不平衡数据上不是一个良好的性能指标。在该数据集中，99.82% 的样本属于同一类别，而只预测该类别的模型将具有\
  \ 99.82% 的准确率且完全毫无意义。F1 得分不受类别不平衡影响，仍然是不平衡数据集中分类性能的良好指标。以下表格显示了三种算法在五折交叉验证下的结果。\n\
  \n| 模型 | 训练时间 | 准确率 | F1 得分 |\n| --- | --- | --- | --- |\n| LightGBM GBDT | 113s\
  \ | 99.88% | 0.80 |\n| XGBoost GBDT | 351s | 98.41% | 0.82 |\n| TabTransformer |\
  \ 528.59s | 93.37% | 0.05 |\n\n表 4.4 – 在信用卡欺诈数据集上训练三种模型的结果。训练时间包括五折交叉验证\n\nXGBoost\
  \ 和 LightGBM 在该数据集上的表现非常相似，分别获得 0.82 和 0.80 的 F1 得分。DNN 在该问题上困难重重，即使使用类别权重来补偿不平衡数据集，F1\
  \ 得分也仅为 0.05。\n\n调试 DNN 的性能问题众所周知非常棘手。由于构建和训练 DNN 模型的复杂性和不透明性，小的更改可能会产生显著影响。\n\n\
  性能不佳的可能原因包括以下几点：\n\n- **模型架构不足：**这是最可能的原因。该架构不适合该问题。需要对架构、层大小甚至神经网络类型进行进一步实验。\n\
  - **训练不足：**模型可能训练时间不够长。增加训练轮数可以提高性能。然而，在我们的实验中，损失在 10 个轮数后停滞不前（而训练继续了 15 个轮数）。\n\
  - **损失函数不当：**我们应用了带有类别权重的 `BinaryCrossentropy` 损失函数。然而，可以尝试更高级的损失函数，例如焦点损失 [9]。\n\
  \n就训练和验证时间而言，情况与普查收入数据集类似。LightGBM 模型的训练和验证速度比其他方法快得多：比 XGBoost 快 3.1 倍，比 DNN 快\
  \ 4.62 倍。\n\n## 总结\n\n在本章中，我们讨论了可用于解决表格学习问题的两种其他算法：XGBoost，另一种梯度提升框架，以及 TabTransformer，一种深度学习方法。\n\
  \n我们展示了如何在两个数据集上设置和训练 XGBoost 模型和 TabTransformer。我们还展示了如何为基于树的模型和神经网络模型编码分类特征。两个数据集也存在类别不平衡，我们在训练期间需要对此进行补偿。\n\
  \n我们发现 LightGBM 和 XGBoost 产生的模型准确率相似，但 LightGBM 训练模型的速度要快得多且更高效。我们也看到了训练 DNN 的复杂性以及在这些问题上表现平平的情况。深度学习是一种极其强大的技术，但在处理表格数据集时，基于树的方法往往更适用。\n\
  \n在下一章中，我们将重点介绍使用名为 Optuna 的框架对 LightGBM 进行更有效的参数优化。\n\n## 参考文献\n\n- [1] T. Chen\
  \ 和 C. Guestrin，“XGBoost”，载于第 22 届 ACM SIGKDD 知识发现与数据挖掘国际会议论文集，2016 年。\n- [2] A.\
  \ Vaswani, N. Shazeer, N. Parmar, J. Uszkoreit, L. Jones, A. N. Gomez, L. Kaiser,\
  \ 和 I. Polosukhin，“Attention Is All You Need”，2017 年。\n- [3] X. Huang, A. Khetan,\
  \ M. Cvitkovic, 和 Z. Karnin，TabTransformer：使用上下文嵌入进行表格数据建模，2020 年。\n- [4] R. Becker，Adult，UCI\
  \ 机器学习库，1996 年。\n- [5] D. Hendrycks 和 K. Gimpel，高斯误差线性单元（GELUs），2020 年。\n- [6] G.\
  \ Klambauer, T. Unterthiner, A. Mayr 和 S. Hochreiter，自归一化神经网络，2017 年。\n- [7] I.\
  \ Loshchilov 和 F. Hutter，解耦权重衰减正则化，2019 年。\n- [8] A. Dal Pozzolo, O. Caelen, R.\
  \ Johnson 和 G. Bontempi，“用于不平衡分类的欠采样概率校准”，2015 年。\n- [9] T.-Y. Lin, P. Goyal, R.\
