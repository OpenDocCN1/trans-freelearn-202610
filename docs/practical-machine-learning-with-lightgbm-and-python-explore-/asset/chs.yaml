  \ Optuna 为 LightGBM 找到最佳参数。还展示了 Optuna 的高级用例。\n\n本章的主要主题如下：\n\n- Optuna 和优化算法\n\
  - 使用 Optuna 优化 LightGBM\n\n## 技术要求\n\n本章包含示例和代码片段，说明如何使用 Optuna 对 LightGBM 进行参数优化研究。有关设置本章适当环境的完整示例和说明，可在\
  \ https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-5\
  \ 上找到。\n\n## Optuna 和优化算法\n\n前几章的示例表明，为问题选择最佳超参数在解决机器学习问题中至关重要。超参数对算法的性能和泛化能力有显著影响。最佳参数也特定于所使用的模型和正在解决的学习问题。\n\
  \n\n\n\n\n使超参数优化变得复杂的其他问题如下：\n\n- **成本**：对于每组唯一的超参数（可能有很多组），都必须执行完整的训练运行，通常伴随交叉验证。这非常耗时且计算开销大。\n\
  \n- **高维搜索空间**：每个参数都可能有大量潜在取值，使得逐一测试每个值变得不可能。\n\n- **参数交互**：单独优化每个参数往往是不可能的，因为某些参数的值会相互影响。以\
  \ LightGBM 中的学习率和估计器数量为例：估计器数量越少，需要的学习率越大，反之亦然。该现象在图 5.1 中所示。\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_106_0.png)\n\
  \n图 5.1 – 展示学习率与估计器数量之间参数交互的平行坐标图：估计器越多，所需的学习率越低，反之亦然\n\n图 5.1 使用一种称为 **平行坐标图**\
  \ 的技术来可视化参数交互。平行坐标图是一种用于表示高维数据的可视化工具，因此特别适用于可视化超参数优化的结果。每个维度（在此上下文中，即一个超参数）都表现为并排排列的垂直轴。每个轴的范围反映了该超参数可以采用的值域。每个单独的超参数配置都描绘为穿过所有这些轴的一条线，每条轴上的交点表示给定配置下该超参数的值。还可以根据性能指标（如验证准确率）对线条进行颜色编码，以辨别哪些超参数组合能产生更好的结果。\n\
  \n平行坐标图的优势在于其能够说明多个超参数之间的关系及其对性能的累积影响，例如图 5.1 中所示的参数交互。通过观察线条的聚集或颜色相似性，我们可以洞察超参数之间的趋势和复杂的相互依赖。这种可视化多维模式的能力有助于数据科学家确定哪些超参数值或组合最有利于模型的最佳性能。\n\
  \n鉴于超参数优化的挑战和复杂性，寻找最佳参数的一种朴素方法是手动优化。在手动优化中，人类从业者基于直觉理解和经验选择参数。使用这些参数训练模型，并重复该过程，直到找到令人满意的参数。手动优化实现简单，但由于该过程涉及人工干预，因此非常耗时。人类直觉也可能出错，优秀的参数组合很容易被遗漏。\n\
  \n**注意**\n\n寻找最佳参数的过程通常称为参数 **研究**。在研究中测试的每个配置（参数组合）称为一次 **试验**。\n\n在前面章节的示例中，我们迄今所采用的方法是\
  \ **网格搜索**。使用网格搜索时，我们会建立一个参数网格，包含每个参数及其潜在值范围，并穷举测试每个可能的组合，以找到最优值。\n\n网格搜索很好地解决了参数交互问题：由于测试了每个可能的组合，因此每种交互都得到了考虑。\n\
  \n然而，使用网格搜索的缺点是成本。由于我们穷举测试每个参数组合，试验次数会迅速变得难以承受，尤其是在添加更多参数时。例如，请考虑以下网格：\n\n```\n\
  params = {\"learning_rate\": [0.001, 0.01, 0.1],\n \"num_leaves\": [10, 20, 50,\
  \ 100],\n \"num_estimators\": [100, 200, 500]}\n```\n\n对该网格进行优化研究将需要 36 次试验。仅添加一个具有两个可能取值的额外参数，就会使研究成本翻倍。\n\
  \n我们需要一种算法和框架，能够在我们控制的有限试验次数内智能优化参数。为此目的存在多种框架，包括用于调优机器学习模型的 Python 库 SHERPA；用于在复杂搜索空间上进行参数优化的另一个\
  \ Python 库 Hyperopt；以及专为 Keras 定制的工具 Talos。然而，在下一节及本章余下部分中，我们将介绍 Optuna，这是一种旨在自动化机器学习模型调优的框架。\n\
  \n## 介绍 Optuna\n\nOptuna 是一个开源的 **超参数优化（HPO）** 框架，旨在自动化寻找机器学习模型的最佳超参数（https://optuna.org/）。它使用\
  \ Python 编写，可以轻松与各种机器学习库集成，包括 LightGBM。\n\nOptuna 提供高效的优化算法，以更有效地搜索超参数空间。除了优化算法外，Optuna\
  \ 还提供剪枝策略，通过剪枝表现不佳的试验来节省计算资源和时间。\n\n除了优化和剪枝算法，Optuna 还提供易于使用的 API，用于定义参数类型（整数、浮点数或类别）、创建和自动化可恢复的优化研究，以及可视化优化运行的结果。本章稍后将展示如何实际使用该\
  \ API。\n\n## 优化算法\n\nOptuna 提供多种高效的优化算法。在本节中，我们将重点介绍两种可用算法：一种是 **树结构 Parzen 估计器（TPE）**，另一种是\
  \ **协方差矩阵自适应进化策略（CMA-ES）** 算法。\n\n## TPE\n\n要理解 TPE，我们必须先知道什么是 Parzen 估计器。\n\nParzen\
  \ 估计器，或称 **核密度估计器（KDE）**，是一种用于估计一组数据点概率分布的技术。它是一种非参数方法，意味着它不会对数据的任何特定底层分布做出假设。相反，它试图根据观察到的数据点来“学习”分布。\n\
  \n假设你有一组数据点，想要知道数据是如何分布的。一种方法是在每个数据点上放置小的“丘陵”（核函数）。这些“丘陵”可以有不同的形状，例如高斯（钟形）或均匀（箱形）。任何位置“丘陵”的高度都表示新数据点落在该位置的可能性。Parzen\
  \ 估计器通过将所有这些“丘陵”相加来工作，从而创建一个代表数据估计概率分布的平滑地貌。\n\n在 TPE 中，我们关心的数据点是参数组合，而概率分布是一组参数是好是坏的可能性\
  \ [1]，[2]。\n\nTPE 首先对少量随机超参数组合进行采样，并评估每个组合的模型性能。根据这些初步结果，TPE 将超参数组合分为两组：好组（性能更好的组合）和坏组（性能较差的组合）：\n\
  \n- l(x)：好配置的概率密度函数\n\n- g(x)：坏配置的概率密度函数\n\n接下来，TPE 使用 Parzen 估计器技术，对好坏两组的超参数组合概率分布进行估计。\n\
  \n在获得概率分布估计后，TPE 计算超参数配置的预期改进（EI）。EI 可以计算为两个密度之比：l(x)/g(x)。在每次试验中，算法会采样最大化 EI 的新超参数配置。\n\
  \nTPE 中的树状结构源于算法在超参数搜索空间内处理参数交互的能力，其中特定超参数的相关性取决于其他超参数的值。为了处理此问题，TPE 构建了一个层次结构，以捕捉不同超参数之间的关系，并相应地调整采样过程。\n\
  \n总之，TPE 估计好坏参数的分布，并利用它们通过最大化新试验的预期改进来寻找最优参数。TPE 具有成本效益，因为它近似了分布，并可以以最优方式（非穷举方式）搜索更好的参数。TPE\
  \ 还处理参数交互。\n\nOptuna 提供的另一种算法是 CMA-ES 算法，我们将在下一节中讨论。\n\n## CMA-ES\n\nCMA-ES 是另一种可用于寻找最优超参数的优化算法\
  \ [3]。与 TPE 相比，CMA-ES 适合涉及连续变量且搜索空间非线性且非凸的情况。\n\nCMA-ES 是进化算法（EA）的一个示例。EA 是一种受自然演化过程启发的优化算法类型。它旨在通过模仿自然通过选择、繁殖、突变和遗传来演化物种的方式，找到问题的最佳解决方案。进化算法从一组候选解开始，并对每一代后续候选解进行修改，以更紧密地适应最佳解。这种代际过程在图\
  \ 5.2 中进行了说明。\n\n\n\n\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_110_0.png)\n\n\
  ![](img/31b70e4a77c3afbe11032f68ab874b02_110_1.png)\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_110_2.png)\n\
  \n![](img/31b70e4a77c3afbe11032f68ab874b02_110_3.png)\n\n图 5.2 – 候选解（红色 x 标记）随每一代演进以逼近全局最优解（位于每个地貌的顶部和中心）的二维示意图。在\
  \ CMA-ES 的上下文中，每个候选解代表一组超参数值，算法的性能决定最优解。\n\nCMA-ES 演化过程的核心是协方差矩阵。协方差矩阵是一个方阵、对称矩阵，表示变量对之间（在\
  \ CMA-ES 的情况下即超参数）的协方差，从而揭示它们之间的关系。矩阵的对角线元素表示各个变量的方差，而非对角线元素表示变量对之间的协方差。当存在正协方差时，这表明变量通常朝同一方向移动，要么都增加，要么都减少。相反，负协方差指出一种关系：当一个变量上升时，另一个变量往往下降，反之亦然。协方差为零表明变量之间没有线性关系。\n\
  \nCMA-ES 在优化超参数时按以下原则应用进化策略：\n\n- 1. 在超参数搜索空间内，初始化均值和协方差矩阵。\n- 2. 重复执行进化过程：\n  -\
  \ I. 使用均值和协方差矩阵从搜索空间生成候选解种群。每个候选解代表一组超参数值。\n  - II. 评估候选解的适应度。**适应度**指候选解的质量或其解决优化问题的优劣程度。在\
  \ CMA-ES 中，这意味着使用候选超参数在数据集上训练模型，并在验证集上评估其性能。\n  - III. 从种群中选择最佳候选解。\n  - IV. 根据最佳候选解更新均值和协方差矩阵。\n\
  \  - V. 重复上述过程，直到达到最大试验次数，或直到种群的适应度不再改善。\n\nCMA-ES 在复杂搜索空间中表现良好，并在协方差矩阵的指导下智能地采样搜索空间。当超参数搜索空间复杂且非线性，或者验证数据的评估存在噪声时（例如，当某个指标是不一致的性能指标时），它非常有益。\n\
  \nTPE 和 CMA-ES 都解决了超参数优化相关的问题：这两种算法都能有效搜索高维搜索空间。这两种算法都能捕捉参数交互作用。这两种算法都让我们能够控制成本：我们可以确定优化预算，并将搜索限制在该范围内。\n\
  \nTPE 和 CMA-ES 之间的主要区别在于它们的总体方法。TPE 是一种具有序列搜索策略的概率模型，而 CMA-ES 是基于种群的并行评估解决方案。这通常意味着\
  \ TPE 在搜索中更具开发性，而 CMA-ES 则利用种群控制机制在探索和开发之间取得平衡。然而，TPE 通常比 CMA-ES 更高效，尤其是参数数量较少时。\n\
  \nOptuna 通过剪枝无效试验，为搜索过程提供了进一步的优化。我们将在下一节讨论一些剪枝策略。\n\n## 剪枝策略\n\n剪枝策略是指通过从研究中剪除不\
  \ promising 的试验，从而避免在优化上浪费时间的方法。剪枝与模型训练过程同步进行：在训练期间检查验证错误，如果算法表现不佳，则停止训练。因此，剪枝类似于\
  \ _早停_。\n\n### 中位数剪枝\n\nOptuna 提供多种剪枝策略，其中最简单的一种是 **中位数剪枝**。使用中位数剪枝时，每个试验在 n 步后报告一个中间结果。然后取中间结果的中位数，并停止任何在相同步骤上低于先前试验中位数的试验。\n\
  \n### 连续半减法与 Hyperband\n\n一种更高级的策略称为 **连续半减法** [4]。它采用更全面的方法，为所有试验分配一个较小且相等的训练步骤预算。连续半减法随后按迭代方式进行：在每次迭代中，评估每个试验的性能，并为下一轮选出一半排名靠前的候选解，而将一半排名靠后的剪除。下一次迭代的训练预算翻倍，并重复此过程。这样，优化预算就用在了最有前景的候选解上。结果，只需花费较少的优化预算来淘汰表现不佳的候选解，而将更多资源用于寻找最佳参数。\n\
  \n**Hyperband** 是另一种剪枝技术，它通过引入随机搜索和多括号资源分配策略扩展了连续半减法 [5]。虽然连续半减法通过迭代剪除表现不佳的候选配置并将更多资源分配给剩下的有前景配置来缩小候选配置集合，但它依赖于固定的初始配置集合和单一的资源分配方案。\n\
  \n相反，Hyperband 采用多括号资源分配策略，将总的计算预算划分为多个括号，每个括号代表不同的资源分配水平。在每个括号内，应用连续半减法来迭代淘汰表现不佳的配置，并将更多资源分配给剩下的有前景配置。在每个括号开始时，使用随机搜索采样一组新的超参数配置，这使得\
  \ Hyperband 能够更广泛地探索超参数空间，并降低遗漏良好配置的风险。这种并发过程使 Hyperband 能够在搜索过程中自适应地平衡探索与开发，最终实现更高效、更有效的超参数调优。\n\
  \nOptuna 对优化算法及其对应的剪枝策略进行了实证研究（https://github.com/optuna/optuna/wiki/Benchmarks-with-Kurobako）。从实证上看，他们发现\
  \ Hyperband 是 TPE 或 CMA-ES 的最佳优化策略。\n\n本节概述了驱动 Optuna 的理论和算法，重点介绍了 TPE、CMA-ES 和高级剪枝策略。在下一节中，我们将使用\
  \ LightGBM 在机器学习问题中实际应用 Optuna。\n\n## 使用 Optuna 优化 LightGBM\n\n我们将通过一个分类示例来演示如何应用\
  \ Optuna。我们要建模的问题是预测电信运营商的客户流失（是/否）。该数据集可从 https://github.com/IBM/telco-customer-churn-on-icp4d/tree/master/data\
  \ 获取。\n\n数据使用运营商可获得的信息来描述每个客户——例如，性别、客户是否购买互联网服务、是否选择无纸化账单、是否支付技术支持费用以及他们的月费。数据既包含数值特征，也包含类别特征。数据已清洗并平衡，使我们能够专注于参数优化研究。\n\
  \n我们首先定义参数研究的目标。目标函数对每个试验调用一次。在此示例中，我们希望在数据上训练 LightGBM 模型并计算 F1 分数。Optuna 将一个 trial\
  \ 对象传递给目标函数，我们可以使用它来设置特定试验的参数。以下是一个示例代码片段，展示如何定义带有参数的目标函数：\n\n```python\ndef objective(trial):\n\
  \    boosting_type = trial.suggest_categorical(\n        \"boosting_type\", [\"\
  dart\", \"gbdt\"])\n    lambda_l1= trial.suggest_float(\n        'lambda_l1', 1e-8,\
  \ 10.0, log=True),\n    ...\n    min_child_samples= trial.suggest_int(\n       \
  \ 'min_child_samples', 5, 100),\n    learning_rate = trial.suggest_float(\n    \
  \    \"learning_rate\", 0.0001, 0.5, log=True),\n    max_bin = trial.suggest_int(\n\
  \        \"max_bin\", 128, 512, 32)\n    n_estimators = trial.suggest_int(\n   \
  \     \"n_estimators\", 40, 400, 20)\n```\n\n在此，我们可以看到如何使用 trial 提供的方法来设置超参数。对于每个参数，优化算法会在指定范围内建议一个值。我们可以使用\
  \ trial.suggest_categorical 建议类别变量（如 boosting type 所示），并分别使用 suggest_int 和 suggest_float\
  \ 建议 int 和 float 参数。在建议浮点数或整数时，会指定一个范围，并且可选地指定一个步长：\n\n```python\nn_estimators =\
  \ trial.suggest_int(\n    name=\"n_estimators\", low=40, high=400, step=20)\n```\n\
  \n设置步长意味着优化算法不会在范围内建议任意值，而是将建议限制在下限和上限之间的步长上（40、60、80、100、...、400）。\n\n我们还可以通过为数值参数传递\
  \ log=True 来对可能值的范围进行对数缩放。对参数范围进行对数缩放的效果是：在接近范围下限的地方测试更多值，而（对数地）在接近上限的地方测试更少值。对数缩放特别适用于学习率，因为我们希望关注较小的值，并指数级地增加测试值，直到达到上限。\n\
  \n\n\n\n\n要在训练 LightGBM 模型时应用剪枝，Optuna 提供了一个专用回调，与优化过程集成：\n\n```\npruning_callback\
  \ = optuna.integration.LightGBMPruningCallback(trial,\n\"binary\")\n```\n\n创建回调时必须指定错误度量指标，在本例中，我们为二元错误指定了\
  \ \"binary\"。\n\n设置好超参数后，我们可以像往常一样进行拟合，正常传递参数和回调：\n\n```\nmodel = lgb.LGBMClassifier(\n\
  \    force_row_wise=True,\n    boosting_type=boosting_type,\n    n_estimators=n_estimators,\n\
  \    lambda_l1=lambda_l1,\n    lambda_l2=lambda_l2,\n    num_leaves=num_leaves,\n\
  \    feature_fraction=feature_fraction,\n    bagging_fraction=bagging_fraction,\n\
  \    bagging_freq=bagging_freq,\n    min_child_samples=min_child_samples,\n    learning_rate=learning_rate,\n\
  \    max_bin=max_bin,\n    callbacks=[pruning_callback],\n    verbose=-1)\n\nscores\
  \ = cross_val_score(model, X, y, scoring=\"f1_macro\")\nreturn scores.mean()\n```\n\
  \n我们使用五折交叉验证训练模型，以 F1 宏观分作为评分指标。最后，目标函数返回 F1 分数的平均值作为试用评估。\n\n我们已准备好使用定义的目标函数启动优化研究。我们创建采样器、剪枝器和研究本身，然后使用目标函数调用\
  \ optimize：\n\n```\nsampler = optuna.samplers.TPESampler()\npruner = optuna.pruners.HyperbandPruner(\n\
  \    min_resource=10, max_resource=400, reduction_factor=3)\n\nstudy = optuna.create_study(\n\
  \    direction='maximize', sampler=sampler,\n    pruner=pruner\n)\n\nstudy.optimize(objective(),\
  \ n_trials=100, gc_after_trial=True, n_jobs=-1)\n```\n\n我们将 TPE 优化算法作为采样器，配合 Hyperband\
  \ 剪枝使用。Hyperband 剪枝器指定的最小和最大资源控制每个试用训练的最小和最大迭代次数（或估计器数量）。在应用剪枝时，缩减因子控制每次减半轮次中提升的试用数量。\n\
  \n通过指定优化方向（最大化或最小化）来创建研究。在这里，我们优化的是 F1 分数，因此希望最大化该值。\n\n然后我们调用 study.optimize 并设置优化预算：n_trials=100。我们还进行内存优化设置\
  \ gc_after_trial=True。执行垃圾回收（GC）有助于确保每个试用后清理内存，避免内存不足或内存泄漏错误。Optuna 研究可以并行运行试用。设置\
  \ n_jobs=-1 与 CPU 核心数相同地并行运行尽可能多的试用。\n\n运行优化后，我们可以通过调用以下内容获取最佳试用和参数：\n\n```\nprint(study.best_trial)\n\
  ```\n\n前面的示例展示了如何有效地将 Optuna 应用于查找 LightGBM 超参数。接下来，我们将了解 Optuna 框架的一些高级功能。\n\n\
  ## Optuna 高级功能\n\n在为大型机器学习问题优化超参数时，优化过程可能运行数天或数周。在这些情况下，保存优化研究并稍后恢复有助于防止数据丢失或在不同机器之间迁移研究。\n\
  \n## 保存和恢复优化研究\n\nOptuna 支持以两种方式保存和恢复优化研究：**内存中** 和 使用 **远程数据库 (RDB)**。\n\n当研究在内存中运行时，可以应用标准\
  \ Python 对象序列化方法。例如，可以使用 joblib 或 pickle。我们使用 joblib 保存研究：\n\n```\njoblib.dump(study,\
  \ \"lgbm-optuna-study.pkl\")\n```\n\n要恢复和继续研究，我们反序列化研究对象并继续优化：\n\n```\nstudy = joblib.load(\"\
  lgbm-optuna-study.pkl\")\nstudy.optimize(objective(), n_trials=20, gc_after_trial=True,\
  \ n_jobs=-1)\n```\n\n运行内存中研究的替代方案是使用 RDB。使用 RDB 时，研究的中间（试用）和最终结果将持久化到 SQL 数据库后端。RDB\
  \ 可以托管在单独的机器上。可以使用 SQL Alchemy 支持的任何 SQL 数据库（https://docs.sqlalchemy.org/en/20/core/engines.html#database-urls）。\n\
  \n在我们的示例中，我们使用 SQLite 数据库作为 RDB：\n\n```\nstudy_name = \"lgbm-tpe-rdb-study\"\nstorage_name\
  \ = f\"sqlite:///{study_name}.db\"\nstudy = optuna.create_study(\n    study_name=study_name,\n\
  \    storage=storage_name,\n    load_if_exists=False,\n    sampler=sampler,\n  \
  \  pruner=pruner)\n```\n\nOptuna 管理与 RDB 的连接以及结果的持久化。设置连接后，优化可以照常进行。\n\n从 RDB 后端恢复研究很简单；我们指定相同的\
  \ `storage` 并将 `load_if_exists` 设置为 True：\n\n```\nstudy = optuna.create_study(study_name=study_name,\
  \ storage=storage_name, load_if_exists=True)\n```\n\n## 了解参数影响\n\n在很多情况下，在解决特定问题时，更好地了解超参数的影响也很有价值。例如，`n_estimators`\
  \ 参数直接影响模型的计算复杂度。如果知道某个参数不那么重要，可以选择较小的值以提高模型的运行时性能。Optuna 提供了多种可视化，以深入了解研究结果并深入了解超参数。\n\
  \n一种简单的可视化绘制了 **每个参数的重要性**：即每个参数在多大程度上影响了训练结果。我们可以按如下方式创建重要性图：\n\n```\nfig = optuna.visualization.plot_param_importances(study)\n\
  fig.show()\n```\n\n我们研究的重要性图如下所示：\n\n## 超参数重要性\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_117_0.png)\n\
  \n图 5.3 – 参数重要性图，显示每个超参数对目标值（F1 分数）的重要性\n\n在图 5.3 中，我们可以看到学习率远远是影响试用成功的最关键参数。其次是叶子数和估计器数量。利用这些信息，我们可以决定在未来的研究中更加专注于寻找最佳学习率。\n\
  \n我们按如下方式创建平行坐标图，指定它应包含的参数。该图帮助我们可视化超参数之间的交互作用：\n\n```\nfig = optuna.visualization.plot_parallel_coordinate(study,\n\
  \    params=[\"boosting_type\", \"feature_fraction\", \"learning_rate\", \"n_estimators\"\
  ])\nfig.show()\n```\n\n以下是生成的图：\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_118_0.png)\n\
  \n图 5.4 – 我们研究的平行坐标图。每条水平线是单个试用的配置。较深的线条表示更成功的试用（更高的 F1 分数）\n\n平行坐标图显示，最佳试用均使用 DART\
  \ 作为增强类型，学习率略低于 0.1，且估计器数量超过 200。我们也可以直观地看到一些参数交互作用：GBDT 模型与略高的学习率相关。当估计器数量较大时，所需的叶子节点数量要少得多，因为拥有大量估计器和大量叶子节点会导致过拟合。\n\
  \n## 多目标优化\n\n在之前所示的优化研究中，我们专注于单个优化目标：最大化我们的 F1 分数。然而，在某些情况下，我们希望优化两个可能相互竞争的目标。例如，假设我们想要创建尽可能小的\
  \ GBDT（最少的叶子数），同时获得良好的 F1 分数。减少叶子数可能会对性能产生负面影响，因此存在权衡。\n\nOptuna 支持通过使用 **多目标优化\
  \ (MOO)** 来解决这类问题。在优化多个目标时，我们从 `objective` 函数返回两个评估并指定优化方向。\n\n例如，考虑学习率与性能之间的权衡。我们希望尽可能快地训练模型，这需要较高的学习率。然而，我们知道使用较小的学习率和更多迭代可以获得最佳性能。\n\
  \n我们可以使用 Optuna 优化此权衡。我们定义一个新的 `objective` 函数，将所有其他参数固定为先前找到的最佳值。我们返回两个评估：学习率和交叉验证的\
  \ F1 分数。我们希望最大化这两个值：\n\n```\ndef moo_objective(trial):\n    learning_rate = trial.suggest_float(\"\
  learning_rate\", 0.0001, 0.5,\n    log=True),\n\n    model = lgb.LGBMClassifier(\n\
  \        force_row_wise=True,\n        boosting_type='gbdt',\n        n_estimators=200,\n\
  \        num_leaves=6,\n        bagging_freq=7,\n        learning_rate=learning_rate,\n\
  \        max_bin=320,\n    )\n\n    scores = cross_val_score(model, X, y, scoring=\"\
  f1_macro\")\n    return learning_rate[0], scores.mean()\n```\n\n调用 optimize 时，我们然后为两个评估设置优化方向：\n\
  \n```\nstudy = optuna.create_study(directions=[\"maximize\", \"maximize\"])\nstudy.optimize(moo_objective,\
  \ n_trials=100)\n```\n\n在执行 MOO 时，并不总是存在单一的最佳结果：目标之间往往存在权衡。因此，我们希望可视化研究结果以探索权衡并选择在两个目标上都表现良好的参数值。这种可视化称为\
  \ **Pareto 前沿**，可以按如下方式创建：\n\n\n## Pareto 前沿图\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_120_0.png)\n\
  \n图 5.5 – 显示 MOO 研究中 Pareto 前沿的散点图\n\n如图 5.5 所示，如果学习率过低，F1 分数会很差，但当学习率达到 0.01 时会迅速提升。F1\
  \ 分数在 0.12 时达到峰值，随后随学习率增加而缓慢下降。我们现在拥有了做出权衡所需的信息：可以选择更高的学习率以加快训练速度，只牺牲极少量的分类性能。\n\
  \n### Summary\n\n本章介绍了 Optuna 作为超参数优化（HPO）框架。我们讨论了寻找最优超参数的问题，以及如何利用 HPO 算法高效找到合适的参数。\n\
  \n我们讨论了 Optuna 中可用的两种优化算法：TPE 和 CMA-ES。两种算法都允许用户设定优化的具体预算（要执行的试验次数），并在约束条件下找到合适的参数。此外，我们还讨论了剪枝不理想的优化试验以节省额外资源和时间。讨论了中位剪枝，以及更复杂但更有效的剪枝技术，如连续半减法和\
  \ Hyperband。\n\n接着，我们通过一个实际示例展示了如何对 LightGBM 进行 HPO 研究。我们还展示了 Optuna 的高级功能，这些功能可用于保存和恢复研究、了解参数影响以及执行\
  \ MOO。\n\n下一章将重点介绍使用 LightGBM 的两个案例研究，详细讨论和应用数据科学流程。\n\n### References\n\n- [1]\
  \ J. Bergstra, R. Bardenet, Y. Bengio, and B. Kégl, “超参数优化算法,” in Advances in Neural\
  \ Information Processing Systems, 2011.\n- [2] J. Bergstra, D. Yamins, and D. Cox,\
  \ “使模型搜索科学化：面向视觉架构的数百维超参数优化,” in Proceedings of the 30th International Conference\
  \ on Machine Learning, Atlanta, 2013.\n- [3] N. Hansen and A. Ostermeier, “进化策略中任意正态突变分布的自适应：协方差矩阵自适应,”\
  \ in Proceedings of IEEE International Conference on Evolutionary Computation, 1996.\n\
  - [4] K. Jamieson and A. Talwalkar, 非随机最佳臂识别与超参数优化, 2015.\n- [5] L. Li, K. Jamieson,\
  \ G. DeSalvo, A. Rostamizadeh, and A. Talwalkar, Hyperband：一种基于盗贼的新型超参数优化方法, 2018.\n\
  \n## 使用 LightGBM 解决现实世界的数据科学问题\n\n通过前几章，我们逐步构建了一套工具集，用于解决机器学习问题。我们已经看到过检查数据、解决数据问题和创建模型的示例。本章正式定义并将数据科学流程应用于两个案例研究。\n\
  \n本章详细概述了数据科学生命周期及其包含的所有步骤。在回归和分类问题的背景下，讨论了问题定义、数据探索、数据清洗、建模和报告等概念。我们还探讨了如何为建模准备数据，并利用所学技术构建优化的\
  \ LightGBM 模型。最后，我们深入探讨了利用训练好的模型，作为 **机器学习运营（MLOps）** 的入门。\n\n本章的主要主题如下：\n\n- *数据科学生命周期*\n\
  - *使用 LightGBM 预测风力涡轮机发电量*\n- *使用 LightGBM 对个人信用评分进行分类*\n\n### 技术要求\n\n本章包含示例和代码片段，说明如何使用\
  \ Optuna 对 LightGBM 进行参数优化研究。本章示例和设置合适环境的完整说明可在 https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-6\
  \ 获取。\n\n### 数据科学生命周期\n\n数据科学已成为一门关键学科，使组织能够从数据中获取有价值的洞察并推动更好的决策。数据科学生命周期是数据科学的核心，是一种系统性的迭代过程，指导各行各业进行数据驱动的问题解决。该生命周期概述了一系列数据科学家遵循的步骤，以确保他们解决正确的问题并交付能产生现实世界影响的可操作洞察。\n\
  \n数据科学生命周期的第一阶段是定义问题，包括了解业务背景、阐明目标并制定假设。这一关键阶段通过确立明确的方向和范围，奠定了整个项目的基础。生命周期中的后续阶段侧重于数据收集、准备和探索，包括收集相关数据、清洗和预处理数据，以及进行探索性数据分析以揭示模式和趋势。\n\
  \n数据分析完成后，数据科学生命周期进入模型选择、训练、评估和调优阶段。这些阶段对于通过选择最合适的算法、在预处理数据上训练模型并优化其性能来开发准确可靠的预测或描述性模型至关重要。目标是构建一个对未见数据具有良好泛化能力并能有效解决当前问题的稳健模型。\n\
  \n最后，数据科学生命周期强调将最终模型部署到生产环境、监控其性能并对其进行维护以确保其持续相关性和准确性的重要性。同样重要的是向利益相关者传达结果和洞察，这对于推动明智决策和充分释放数据科学潜力至关重要。通过遵循数据科学生命周期，组织可以系统地从数据中提取价值，并释放增长和创新的新机遇。\n\
  \n在前面的示例中，我们遵循了一套用于处理数据和创建模型的宽松步骤配方。在下一节中，我们将正式定义和讨论数据科学生命周期的步骤。\n\n### 定义数据科学生命周期\n\
  \n以下是数据科学生命周期中广泛应用的关键步骤。这些步骤也在图 6.1 中展示，该图说明了生命周期的周期性。\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_125_0.png)\n\
  \n图 6.1 – 描绘数据科学生命周期的图表\n\n以下是关键步骤：\n\n- 1. **定义问题：** 清晰阐述业务问题、目标和宗旨。此阶段包括了解利益相关者需求、制定假设和确定项目范围。定义问题还为数据收集奠定基础，并可决定我们如何利用模型。\n\
  \n- 2. **数据收集：** 从各种来源收集所需数据，例如数据库、API、网络爬虫或第三方数据提供商。确保数据具有代表性、准确性，并与问题相关。记录数据来源及其流动过程非常重要，以建立数据血统。此外，构建记录数据格式、结构、内容和含义的数据字典。重要的是，验证数据收集或抽样中的任何潜在偏差。\n\
  \n- 3. **数据准备：** 清洗和预处理数据，使其适合分析。此阶段包括诸如 **数据清洗**（例如，处理缺失值和删除重复项）、**数据转换**（例如，归一化和对分类变量进行编码）和\
  \ **特征工程**（例如，创建新变量或聚合现有变量）等任务。移动和连接数据以进行分析和建模也可能是必要的。\n\n- 4. **数据探索：** 进行探索性数据分析（EDA）以深入了解数据。此步骤包括可视化数据分布、识别趋势和模式、检测异常值和离群点，以及检查特征之间的关系和相关性。\n\
  \n- 5. **模型选择：** 根据问题类型（例如，回归、分类或聚类）和数据特征选择最合适的数据建模技术。选择多个模型算法以在数据集上验证性能非常重要。\n\n\
  - 6. **模型训练：** 使用准备好的数据训练所选模型。此步骤包括将数据拆分为训练集和验证集、设置模型参数（超参数）以及将模型拟合到数据上。\n\n- 7.\
  \ **模型评估：** 使用适当的评估指标（例如，准确率、精确率、召回率、F1 分数、**ROC 曲线下面积（AUC-ROC）**或**均方根误差（RMSE）**）评估训练好的模型的性能，并对其进行比较以选择表现最佳的模型。执行交叉验证或使用留出测试集以确保无偏评估。\n\
  \n- 8. **模型调优：** 通过优化超参数、特征选择或结合领域知识来精调所选模型。此步骤旨在提高模型对未见数据的性能和泛化能力。针对特定问题调优模型也可能是合适的；例如，在人脸识别中，高精确率比高召回率更合适。\n\
  \n- 9. **模型部署：** 如果模型是更大型软件系统的一部分，则将最终模型部署到生产环境中，以便用于进行预测或辅助决策。部署可能涉及将模型集成到现有系统、创建\
  \ API 或设置监控和维护程序。\n\n- 10. **模型监控和维护：** 持续监控模型性能并根据需要进行更新，以确保其保持准确和相关。应使用检测模型和数据漂移等技术来确保模型性能。模型维护可能涉及使用新数据重新训练模型、更新特征或优化问题定义。\n\
  \n- 11. **传达结果：** 与利益相关者分享洞察和结果，包括基于分析的任何建议或行动。传达结果可能涉及创建可视化、仪表板或报告，以有效传达调查结果。\n\
  \n我们现在将考察两个案例研究，了解数据科学生命周期如何实际应用于现实世界数据。我们将研究一个回归问题，即预测风力涡轮机发电量，以及一个分类问题，即对个人信用评分进行分类。\n\
  \n\n\n\n## 预测风力涡轮机发电量与 LightGBM\n\n我们的第一个案例研究是一个旨在预测风力涡轮机发电量的问题。该问题的数据集可从 https://www.kaggle.com/datasets/mukund23/hackerearth-machine-learning-challenge\
  \ 获得。\n\n我们将使用前一节定义的步骤来解决这个问题，并在每个步骤中阐述涉及的细节，同时附带代码片段。完整的端到端解决方案可在 https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-6/wind-turbine-power-output.ipynb\
  \ 获得。\n\n### 问题定义\n\n该数据集包含在特定日期和时间获取的风力涡轮机发电量（kW/h）测量值。除了每个测量值外，还有风力涡轮机的参数，包括风车的物理测量值（包括风车高度、叶片宽度和长度）、涡轮机的操作测量值（包括欧姆电阻、电机转矩、发电机温度和转子转矩）以及大气条件（包括风速、温度和气压）。\n\
  \n鉴于一组参数，我们必须构建回归模型来预测以 kW/h 为单位的发电量。因此，我们采用回归建模。模型的质量使用 **均方误差（MSE）** 和决定系数（$R^2$）来衡量。我们还必须确定哪些因素对发电量影响最显著。\n\
  \n### 数据收集\n\n该数据集包含 22,800 个样本，收集于 11 个月内，从 2018 年 10 月到 2019 年 9 月。数据以 CSV 文件形式提供，并作为公共领域数据发布。未收集其他数据。\n\
  \n### 数据准备\n\n我们现在可以着手准备数据以进行清洗和探索。正如我们从 pandas DataFrame 中获取信息所见，该数据集包含 18 个数值特征、2\
  \ 个分类特征和日期特征：\n\n| # | 列 | 非空计数 | 数据类型 |\n|---|--------|----------------|-------|\n\
  | 0 | tracking_id | 28200 非空 | object |\n| 1 | datetime | 28200 非空 | object |\n\
  | 2 | wind_speed (m/s) | 27927 非空 | float64 |\n| 3 | atmospheric_temperature (°C)\
