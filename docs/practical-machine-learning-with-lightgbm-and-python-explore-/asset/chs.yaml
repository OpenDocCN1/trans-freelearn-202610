  查看表 6.1 中特征的统计描述，我们可以发现以下不规则之处：\n\n- **许多特征存在异常值**：通常，标准差大于均值可能表明存在异常值。示例包括风速、大气温度和大气压力。同样，最小值或最大值与均值相差甚远也可能表明数据中存在异常值。我们可以通过使用直方图可视化数据分布来进一步验证这一点。\n\
  \n- **物理上的不可能性**：数据显示某些测量值存在物理上的不可能性：长度（米）小于 0（例如，叶片长度）以及温度超出自然范围（身体温度为 -999）。\n\
  \n- **重复值**：-99.0 和 -999.0 这两个值在少数特征中重复出现。这些值在不同特征中自然出现的可能性极低。我们可以推断，这些值表明样本中存在缺失或错误的测量值。\n\
  \n我们可以可视化特征分布以调查异常值。例如，对于大气温度，我们有以下内容：\n\n```\nsns.histplot(train_df[\"atmospheric_temperature(°C)\"\
  ], bins=30)\n```\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_129_0.png)\n\n图 6.2\
  \ – 显示摄氏度大气温度的直方图\n\n图 6.2 说明了数据中发现的两个问题：-99.0 值的高频测量值，表明存在错误。还有一些远离均值的异常值。\n\n\
  最后，我们可以使用以下内容检查重复数据：\n\n```\ntrain_df[train_df.duplicated()]\n```\n\n未返回任何行，表明数据集中没有重复项。\n\
  \n## 数据清洗\n\n我们在数据集中识别出了多个需要在数据清洗步骤中解决的问题：\n\n- **异常值**：许多特征具有会影响特征值分布的异常值。\n- **测量错误**：某些特征的值超出了物理不可能性的范围（长度小于\
  \ 0 或温度处于不可能范围内）。\n- **缺失值**：许多特征都有缺失值。还有某些特定值（-99.0 和 -999.0）被视为缺失值。\n\n我们首先处理异常值和测量错误，因为这会影响我们如何处理缺失值。\n\
  \n### 处理异常值\n\n在数据集中处理异常值包括两部分：准确识别异常值和选择适当的替换值。识别异常值的方法如下：\n\n- **可视化**：如前所示，直方图或其他可视化数据分布的图表（如箱线图或散点图）可用于此目的。\n\
  - **领域知识**：就像我们识别测量错误一样，可以利用领域知识来决定数值是否属于异常值。\n- **统计分析**：使用统计方法确定数值是否属于异常值的两种流行方法是四分位距（IQR）和标准差。\n\
  \nIQR 是第 25 个四分位数和第 75 个四分位数之间的差值。偏离第 25 个或第 75 个四分位数超过 1.5 倍 IQR 的数值被视为异常值。\n\n\
  或者，我们可以利用标准差：计算数据集的均值和标准差。任何偏离均值两倍或三倍的数值都被视为异常值。将边界设为两倍或三倍标准差取决于底层数据。使用两倍标准差可能会导致许多误报，但如果大量数据集中在均值附近，则适用。使用三倍标准差更为保守，仅将偏离均值很远的数值标记为异常值。\n\
  \n检测到异常值后，我们必须采取措施。通常，我们的选择如下：\n\n- **删除**：如果异常值是由数据录入、测量或收集错误造成的，那么将其从数据集中删除可能是合理的。但是，应谨慎进行此操作，因为删除太多数据点可能导致信息丢失和结果偏差。从我们的数据集中删除带有异常值的实例将导致接近\
  \ 70% 的数据丢失，因此不可行。\n- **插补**：类似于缺失值，用更具代表性的值替换异常值，例如变量的均值、中位数或众数，或使用更复杂的插补方法，如 k-近邻或回归插补。\n\
  \n\n\n\n\n- 限制或截断：设置一个阈值（上限或下限），并将异常值限制或截断在该阈值处。该方法在减少极端值影响的同时，保留了数据的原始结构。\n\n```python\n\
  column_data = frame[feature]\ncolumn_data = column_data[~np.isnan(column_data)]\n\
  mean, std = np.mean(column_data), np.std(column_data)\nlower_bound = mean - std\
  \ * 3\nupper_bound = mean + std * 3\nframe.loc[((frame[feature] < lower_bound) |\
  \ (frame[feature] > upper_bound))] = np.nan\n```\n\n## 处理测量错误\n\n被检测为测量错误类型的值也可以被视为异常值，尽管不是统计学意义上的异常值。不过，我们可以以略有不同的方式处理这些值，与处理统计异常值不同。\n\
  \n我们应用领域知识和关于天气的一些研究来识别这些特征的适当范围。然后我们将错误值限制在这些范围内：\n\n```python\nframe.loc[frame[\"\
  wind_speed (m/s)\"] < 0, \"wind_speed (m/s)\"] = 0\nframe.loc[frame[\"wind_speed\
  \ (m/s)\"] > 113, \"wind_speed (m/s)\"] = 113\nframe.loc[frame[\"blade_length (m)\"\
  ] < 0, \"blade_length (m)\"] = 0\nframe.loc[frame[\"windmill_height (m)\"] < 0,\
  \ \"windmill_height (m)\"] = 0\nframe.loc[frame[\"resistance (ohm)\"] < 0, \"resistance\
  \ (ohm)\"] = 0\n```\n\n在这里，我们将任何负的长度、高度和电阻设置为 0。我们还将风速限制在 113 m/s，即有记录的最大阵风速度。\n\
  \n最后，我们可以处理数据集中的缺失值。\n\n## 处理缺失值\n\n我们在前面的章节中讨论过如何处理缺失值。在此总结一下，我们可以采取的一些潜在方法如下：\n\
  \n- 移除包含缺失值的实例\n- 使用描述性统计量（均值、中位数或众数）填补缺失值\n- 使用其他机器学习算法，通常是非监督技术（如聚类），来计算更稳健的统计量\n\
  \n移除缺失值将丢弃我们数据集的很大一部分。这里，我们决定使用描述性统计量替换缺失值，以尽可能保留更多数据。\n\n首先，我们将 -99.0 和 -999.0\
  \ 值标记为缺失值：\n\n```python\ndf.loc[frame[f] == -99.0, f] = np.nan\ndf.loc[frame[f]\
  \ == 99.0, f] = np.nan\ndf.loc[frame[f] == -999.0, f] = np.nan\ndf.loc[frame[f]\
  \ == 999.0, f] = np.nan\n```\n\n然后我们用均值替换缺失的数值，用众数替换缺失的类别值：\n\n```python\nif f in\
  \ numerical_columns:\n    frame[f].fillna(frame[f].mean(), inplace=True)\nelse:\n\
  \    frame[f].fillna(frame[f].mode()[0], inplace=True)\n```\n\n通常，使用均值时需要小心，因为均值受异常值影响。不过，由于我们已经将异常值标记为\
  \ np.nan，计算均值时会排除它们。在测试集中替换缺失值时还有一个额外的注意事项：由于测试集应被视为未见数据，我们必须使用训练数据集的均值来替换测试集中的缺失值。\n\
  \n这就完成了我们数据集所需的数据清洗工作。我们应该通过重新检查缺失值并重新计算描述性统计量和数据直方图来验证我们的工作。\n\n数据集清洁后，我们可以进入下一步数据准备：特征工程。\n\
  \n## 特征工程\n\n**特征工程**是指创建新特征或修改现有特征以提高机器学习模型性能的过程。本质上，特征工程是利用领域知识和数据理解来创建特征，使机器学习算法能更有效地工作。这既是一门艺术，也是一门科学，需要创造力、直觉和对问题的深刻理解。\n\
  \n特征工程过程通常从探索数据开始，以了解其特征、分布以及变量之间的关系。这一探索阶段可以揭示特征创建的潜在机会，例如交互项、聚合特征或时间特征；例如，如果你处理的数据集包含客户交易数据，你可以创建捕捉交易频率、平均交易额或上次交易以来时间的特征。\n\
  \n特征工程中还有几种标准技术。这些技术包括对类别变量进行编码、对数值变量进行归一化、创建多项式特征以及对连续变量进行分箱。例如，类别变量通常会被编码为数值格式（如独热编码或有序编码），以便用于数学模型。同样，数值变量通常会被归一化（如最小-最大缩放或标准化），以确保它们处于可比较的尺度，并防止某些变量仅因其尺度而主导其他变量。\n\
  \n然而，特征工程并非一种适用于所有情况的过程。模型的合适特征很大程度上取决于特定问题、所使用的算法以及数据的性质。因此，特征工程通常需要迭代实验和评估。尽管存在挑战，但有效的特征工程可以显著提升模型性能。\n\
  \n> **注意**\n> 如你所注意到的，特征工程需要理解和探索数据，这取决于已工程化特征的可用性。这突显了数据科学生命周期中的循环过程：我们在数据准备和探索之间迭代。\n\
  \n例如，我们数据中适合进一步工程化的特征是 `datetime` 字段。测量所采集的具体日期和时间对模型的未来预测没有信息价值。\n\n然而，假设我们将年份、月份、日期和小时提取为新特征。那样的话，模型就可以捕捉所产生电力与不同时间周期之间的潜在关系。日期分解允许提出诸如：一年中的时间、季节、特定月份等是否会影响所产生的电力？或者，一天中的时间（早晨、正午或夜晚）是否有任何影响？\n\
  \n我们可以按如下方式将日期分解为新特征：\n\n```python\nframe[\"date_year\"] = train_df[\"datetime\"\
  ].dt.year\nframe[\"date_month\"] = train_df[\"datetime\"].dt.month\nframe[\"date_day\"\
  ] = train_df[\"datetime\"].dt.day\nframe[\"date_hour\"] = train_df[\"datetime\"\
  ].dt.hour\nframe = frame.drop(columns=[\"tracking_id\", \"datetime\"], axis=1)\n\
  ```\n\n如果建模后发现这些特征没有信息价值，我们可以对 `time` 字段进行进一步处理以辅助建模。未来可探索的方向包括基于特定时期的聚合，或通过对测量值进行排序来创建时间序列，以研究随时间变化的电力生成趋势。\n\
  \n我们现在进入案例研究的 EDA 部分，以可视化并更好地理解我们的数据。\n\n## EDA\n\n我们已经对数据集进行了一些 EDA 以查找缺失值和异常值。对数据集执行\
  \ EDA 没有固定的方法论；需要一些经验和创造力来指导过程。\n\n除了获得数据的洞察和理解之外，主要目的是尝试识别数据中的模式和关系。这里，我们从相关性热图开始，以探索特征之间的任何直接相关性：\n\
  \n![](img/31b70e4a77c3afbe11032f68ab874b02_134_0.png)\n\n图 6.3 – 风力涡轮机数据集的相关性热图\n\
  \n图 6.3 的相关性热图显示，风速与大气温度之间存在几个显著相关性，与发动机温度、发电机温度和电机转矩等发动机指标之间也存在相关性，而我们的日期特征与大气条件之间的相关性较弱。\n\
  \n值得注意的是，电机转矩与发电机温度之间存在非常强的相关性。从直觉上讲，这很合理：如果电机产生更多转矩，它就会产生更多热量。由于转矩是因果特征，我们可以考虑在建模时删除发电机温度。\n\
  \n我们还可以看到电力生成与发动机指标之间的相关性，包括电阻和风向。我们可以预期这些特征将对模型性能产生重大影响。\n\n\n\n\n\n我们还可以探索分类特征与生成电力之间的相关性。涡轮状态看似对生成电力几乎没有影响（单独来看）。然而，云量有显著影响。将云量与生成电力进行绘图，我们得到以下结果：\n\
  \n```\ntrain_df.groupby(\"cloud_level\")[\"windmill_generated_power (kW/h)\"].mean().plot.bar()\n\
  ```\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_135_0.png)\n\n图 6.4 – 各种云量下的平均生成电力\n\
  \n如图 6.4 所示，极低云量与发电量降低呈强相关。在进一步探索数据时，控制云量是有帮助的，以确保云量的影响不会主导任何新出现的模式。\n\n查看各种特征影响的另一个有用可视化方法是散点图。绘制每个值可以直观地识别数据中的模式和聚类，从而轻松发现特征。\n\
  \n接下来，我们提供揭示数据内部模式的散点图示例。\n\n为调查叶片角度对发电可能产生的影响，我们可以按以下方式创建散点图：\n\n```\nsns.scatterplot(x='blades_angle\
  \ (°)', y='windmill_generated_power (kW/h)', hue='cloud_level', data=train_df)\n\
  ```\n\n在散点图中，我们还为云量添加了色调区分，以便直观验证任何影响并非仅源于云量本身：\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_136_0.png)\n\
  \n图 6.5 - 生成电力（y 轴）与叶片角度（x 轴）的散点图\n\n叶片角度散点图如图 6.5 所示。散点图表明，特定的叶片角度范围与增加的生成电力相关：[0,\
  \ 10] 度和 [65, 75] 度（在另一个方向上也同样成立）。基于树的算法也会建模此类相关性。\n\n说明特征工程能力的另一个示例是月份与生成电力的散点图。我们同样通过为这些点使用不同的色调来控制云量：\n\
  \n```\nsns.scatterplot(x='date_month', y='windmill_generated_power (kW/h)', hue='cloud_level',\
  \ data=train_df)\n```\n\n## 按月划分的电力生成\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_137_0.png)\n\
  \n图 6.6 – 按月划分的生成电力（y 轴）散点图（x 轴为月份）\n\n图 6.6 表明，四月至九月与生成电力显著下降相关。我们可以得出结论，风力涡轮机在这些月份所处的位置并不特别多风，其他能源将不得不补充发电量的不足。通过分解日期特征，我们使学习算法能够利用这种相关性。\n\
  \n探索性数据分析（EDA）并没有确定的终点。对于大型复杂数据集，分析可以不断深入数据，几乎无限期地迭代探索更多方面和细微差别。然而，有两个有用的健全性检查，可帮助确定数据是否已被充分探索：\n\
  \n- 我们是否充分理解每个特征的含义及其对模型输出的潜在影响？\n- 数据是否已为建模做好充分准备？据我们所知，特征是否具有信息量，数据是否干净且无偏见，并以模型可用于训练的格式编排？\n\
  \n我们现在继续对数据进行建模，利用前几章的技术构建一个优化良好的模型。\n\n## 建模\n\n建模的第一步是模型选择。最佳做法是首先使用简单直接的算法对数据进行建模，以验证我们的数据准备并建立基线。如果使用简单算法建模失败，则更容易调试可能出错的地方或隔离可能导致问题的数据实例。\n\
  \n### 模型选择\n\n对于我们的风力涡轮机数据，我们使用线性回归模型来建立基线并验证数据是否适合建模。\n\n我们还训练一个随机森林回归模型，作为与 LightGBM\
  \ 模型比较的参考点。如果预算允许，训练多个使用不同学习算法的模型也是一种良好的做法，因为特定问题可能更适合特定算法。\n\n最后，我们训练一个 LightGBM\
  \ 回归器作为我们的主要模型。\n\n### 模型训练与评估\n\n从 EDA 中，我们看到发电机温度是冗余的（因为它与电机扭矩相关）。因此，我们从训练数据中排除它：\n\
  \n```\nX = train_df.drop(columns=[\"windmill_generated_power (kW/h)\"], axis=1)\n\
  y = train_df[\"windmill_generated_power (kW/h)\"]\n```\n\n与 LightGBM 不同，线性回归和 scikit-learn\
  \ 的随机森林回归器都无法自动处理分类特征。\n\n因此，我们使用 pandas 的 get_dummies 来对特征进行编码以供训练。get_dummies\
  \ 操作执行一个称为 **独热编码** 的过程。分类值被分解为与唯一值数量相同的二进制（0 或 1）列。每个模式的对应值标记为 1（独热），其他值标记为 0。例如，考虑云量特征：有三个类别（中、低和极低）。我们数据集中云量为中的一行将被编码为\
  \ 100（三个单独的列）。同样，低云量被编码为 010，以此类推。\n\n执行独热编码允许仅支持数值列的算法（如线性回归）以增加额外列的内存使用为代价来对数据进行建模。\n\
  \n如问题定义中所述，我们将使用两个指标来评估模型：决定系数和 MSE。两者都使用五折交叉验证计算。\n\n我们现在可以继续训练线性回归、随机森林和 LightGBM\
  \ 回归器：\n\n```\nX_dummies = pd.get_dummies(X)\nlinear = LinearRegression()\nscores\
  \ = cross_val_score(linear, X_dummies, y)\nscores = cross_val_score(linear, X_dummies,\
  \ y, scoring=\"neg_mean_squared_error\")\nforest = RandomForestRegressor()\nX_dummies\
  \ = pd.get_dummies(X)\nscores = cross_val_score(forest, X_dummies, y)\nscores =\
  \ cross_val_score(forest, X_dummies, y, scoring=\"neg_mean_squared_error\")\nlgbm\
  \ = lgb.LGBMRegressor(force_row_wise=True, verbose=-1)\nscores = cross_val_score(lgbm,\
  \ X, y)\nscores = cross_val_score(lgbm, X_dummies, y, scoring=\"neg_mean_squared_error\"\
  )\n```\n\n下表总结了每个模型的性能：\n\n| 算法 | R² | MSE |\n|---|---|---|\n| 线性回归 | 0.558 | 2.261\
  \ |\n| 随机森林 | 0.956 | 0.222 |\n| LightGBM | 0.956 | 0.222 |\n\n表 6.2 – 风力涡轮机数据集上的五折交叉验证性能指标\n\
  \nLightGBM 和随机森林回归器显示出几乎相同的性能，具有相同的四舍五入后的 R² 和 MSE 分数。两种算法均显著优于线性回归。\n\n我们的模型表现非常好，绝对误差约为\
  \ 471 W/h。但是，如果我们绘制训练模型的特征重要性，就很容易发现一个问题。\n\n图 6.7 显示了我们 LightGBM 模型中每个特征的相对重要性。\n\
  \n![](img/31b70e4a77c3afbe11032f68ab874b02_139_0.png)\n\n图 6.7 – 每个特征对我们 LightGBM\
  \ 模型的相对特征重要性\n\n从特征重要性可以看出，有三个特征脱颖而出：blades_angle、motor_torque 和 resistance。但是，对于其中两个特征，motor_torque\
  \ 和 resistance，我们可以问：这些特征是导致生成电力提高，还是它们是生成电力增加的结果？这些特征是目标泄漏的示例，如下文所述。\n\n## 目标泄漏\n\
  \n目标泄漏，通常称为“泄漏”，是设计和训练机器学习模型中的常见陷阱。它发生在训练过程中，模型无意中获取了目标变量（或目标变量的某个代理）的访问权限。结果，模型在训练期间的表现可能看起来令人印象深刻，但在新的、未见过的数据上表现不佳，因为它在训练期间实际上“作弊”了。\n\
  \n泄漏可能发生的一些常见示例如下：\n\n- **基于时间的泄漏**：假设你正在尝试预测明天的股票价格。如果你将明天的数据包含在训练集中（可能是意外），这将导致泄漏。同样，仅在事后才可用的数据（例如所有股票的汇总数据）也是基于时间的泄漏的另一个示例。\n\
  - **预处理错误**：当你使用包含训练集和测试集的统计数据执行特定操作（例如缩放或归一化）时会发生这种情况。\n- **数据分割不正确**：对于时间序列数据，使用简单的随机分割可能会导致未来数据出现在训练集中。\n\
  - **验证集受污染**：有时，在创建验证集或测试集时，某些数据可能与训练数据重叠或高度相关，导致过于乐观且不具代表性的验证分数。\n\n在我们的示例中，motor_torque\
  \ 和 resistance 是基于时间的泄漏示例：这两个指标只有在生成电力后才能测量，而这正是我们试图预测的内容。这也说明了进行基线训练测试的重要性，因为此类问题可能事先不容易发现。\n\
  \n我们通过从数据集中删除这些特征来修复此错误。然后我们可以继续进行模型调参，以进一步提高模型的性能。\n\n## 模型调参\n\n我们使用 Optuna 执行参数优化研究。我们将利用\
  \ Optuna 的树结构 Parzen 估计器（TPE）采样算法，并结合 Hyperband 剪枝以提高效率。我们定义目标函数，包含所需参数、剪枝回调，并测量\
  \ MSE：\n\n```\ndef objective(trial):\n    boosting_type = trial.suggest_categorical(\"\
  boosting_type\",\n    [\"dart\", \"gbdt\"])\n    lambda_l1 = trial.suggest_float(\n\
  ```\n\n\n\n```\n'lambda_l1', 1e-8, 10.0, log=True),\n...\npruning_callback = optuna.integration.LightGBMPruningCallback(trial,\
  \ \"mean_squared_error\")\n...\nmodel = lgb.LGBMRegressor(\n...\n    callbacks=[pruning_callback],\n\
  \    verbose=-1)\nscores = cross_val_score(model, X, y, scoring=\"neg_mean_squared_error\"\
  )\nreturn scores.mean()\n```\n\n我们使用 TPE 采样器、Hyperband 剪枝和 200 次试验的优化预算创建 Optuna\
  \ 研究：\n\n```\nsampler = optuna.samplers.TPESampler()\npruner = optuna.pruners.HyperbandPruner(\n\
  \    min_resource=20, max_resource=400, reduction_factor=3)\n\nstudy = optuna.create_study(\n\
  \    direction='maximize', sampler=sampler,\n    pruner=pruner\n)\nstudy.optimize(objective,\
  \ n_trials=200, gc_after_trial=True, n_jobs=-1)\n```\n\n通过 Optuna 找到的优化参数，我们进一步将\
  \ LightGBM 模型的性能提升至 R^2 为 0.93、MSE 为 0.21（在我们的运行中）。由于 Optuna 研究的随机性，您的结果可能会略有不同。\n\
  \n在拥有训练好的优化模型后，我们可以进入数据科学流程的下一阶段：部署和报告。\n\n## 模型部署\n\n现在，我们可以使用训练好的模型对未见数据进行预测。接下来的章节将重点介绍作为\
  \ MLOps 流程一部分的各种模型部署和监控方式。\n\n然而，使用我们模型的最简单方法是保存模型，并编写一个简单脚本来加载模型并进行预测。\n\n我们可以使用标准\
  \ Python 序列化或 LightGBM API 保存模型。这里，我们演示使用标准 Python 工具：\n\n```\njoblib.dump(model,\
  \ \"wind_turbine_model.pkl\")\n```\n\n加载模型并进行预测的简单脚本如下：\n\n```\ndef make_predictions(data):\n\
  \    model = joblib.load(\"wind_turbine_model.pkl\")\n    return model.predict(data)\n\
  \nif __name__ == '__main__':\n    make_predictions(prepare_data(pd.read_csv(\"wind-turbine/test.csv\"\
  )))\n```\n\n重要的是，对于任何我们想要预测的数据，都必须重复数据准备过程，以添加经过特征工程的特征并删除未使用的列。\n\n## 传达结果\n\n\
  数据科学流程的最后一步是传达结果。数据科学家通常会编译一份包含重要发现和可视化的报告，以向利益相关方展示结果。\n\n报告将类似于本案例研究的撰写。例如，我们可能会展示特征之间的相关性，比如月份与产生的电量之间的相关性。我们还会突出数据中的问题，例如异常值和缺失值，以改进未来的数据收集工作。\n\
  \n我们还将强调对模型重要的特征，以便风力涡轮机可以得到优化以最大化产生的电量。\n\n注重报告的质量。使用设计良好且详细的可视化以及其他辅助材料，而不仅仅依赖文本。信息图或交互式图表可能比详细的撰写更有帮助。检查写作中的错误，并在发送报告前确保已校对。\n\
  \n报告的内容应解决问题定义中定义的问题。任何经过测试的假设都必须在报告中得到回答。但报告也高度依赖于受众，并应针对受众进行定制。例如，如果您的受众是企业高管，请包含他们能理解的内容，并回答他们可能提出的问题，这些问题将围绕您的发现对业务的影响。\n\
  \n我们现在来看一个分类问题的案例研究。我们将展示，尽管每个数据集都是独特的并且有特定的挑战，但整体数据科学流程保持不变。\n\n## 使用 LightGBM\
  \ 对个人信用评分进行分类\n\n我们的第二个案例研究是关于个人信用评分分类的问题。该数据集可从 https://www.kaggle.com/datasets/parisrohan/credit-score-classification?datasetId=2289007\
  \ 获取。\n\n该数据集比之前的问题大得多，并且具有独特的数据格式问题。为了简洁，我们不会像处理之前的问题那样详细介绍解决方案（因为大部分工作是相同的），但端到端解决方案可在\
  \ https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-6/credit-score-classification.ipynb\
  \ 查看。\n\n## 问题定义\n\n该数据集包含 100,000 行和 27 列，代表个人的人口统计和财务信息，包括信用评分评级。数据包括关于个人收入、贷款数量、付款行为和投资的信息。信用评分可能评为\
  \ good、standard 或 poor。\n\n我们的任务是分析数据并构建一个模型，准确分类未见个人的信用评分。预测质量使用分类准确率和 F1 分数来衡量。\n\
  \n## 数据收集\n\n数据收集自美国金融机构的客户数据库。年龄在 14 到 65 岁之间的个人包含在数据集中。没有记录显示对特定人群（低收入群体、年龄或种族群体）的抽样偏向，但必须进行验证。没有收集额外数据。\n\
  \n## 数据准备\n\n与之前一样，我们从简单的数据探索任务开始，以确定数据的清洁度。我们首先检查数据结构和类型：\n\n| | 列 | 非空计数 | 数据类型\
  \ |\n|---|---|---|---|\n| 0 | ID | 100000 个非空值 | object |\n| 1 | Customer_ID | 100000\
  \ 个非空值 | object |\n| 2 | Month | 100000 个非空值 | object |\n| 3 | Name | 90015 个非空值\
  \ | object |\n| 4 | Age | 100000 个非空值 | object |\n| 5 | SSN | 100000 个非空值 | object\
  \ |\n| .. | .. | .. | .. |\n| 25 | Payment_Behaviour | 100000 个非空值 | object |\n\
  | 26 | Monthly_Balance | 98800 个非空值 | object |\n| 27 | Credit_Score | 100000 个非空值\
  \ | object |\n\n我们注意到某些特征存在缺失值。此外，许多我们预期是数值型的特征（年收入、贷款数量等）被解释为对象而不是整数或浮点数。这些特征必须被转换为数值特征。\n\
  \n我们还检查了特征的描述性统计量和重复行。发现两个特征存在异常值，即年龄和银行账户数量，需要进行清理。\n\n值得注意的是，`Type_of_Loan` 字段包含逗号分隔的列表，其中包括连词，列出了每个人的贷款类型。例如“student_loan\
  \ , mortgage_loan , and personal_loan”。建模算法无法从字符串中提取贷款类型。我们需要构建新字段以实现有效的建模。\n\n\
  ### 数据清理\n\n现在我们可以开始清理数据。总之，需要解决以下问题：\n\n- 在适当的地方将 object 列转换为数值列\n- 处理年龄、银行账户数量和月度余额列中的异常值\n\
  - 为贷款类型构建新特征\n- 处理缺失值和重复行\n\n### 转换为数值列\n\n该数据集的主要问题之一是，本应为数值型的列中存在混合类型，但由于错误值，pandas\
  \ 将其解释为对象。例如，`Annual_Income` 列包含 `100000.0_` 这样的值，随后被解释为字符串。\n\n为了清理并将特征转换为数字，我们首先使用正则表达式删除字符符号：\n\
  \n```\nframe[col] = frame[col].astype(str).str.replace(r'^[\\\\d.]', '', regex=True)\n\
  ```\n\n这样我们就可以使用 pandas 将列转换为数值特征，将任何错误（空值）转换为 `np.nan` 值：\n\n```\nframe[col] =\
  \ pd.to_numeric(frame[col], errors=\"coerce\")\n```\n\n`Credit_History_Age` 特征需要我们做更多工作。年龄是用自然语言指定的，例如“12\
  \ 年 3 个月”。在这里，我们使用 Python 字符串处理将年份和月份转换为浮点数：\n\n```\ndef clean_credit_age(age):\n\
  \    if age == 'nan':\n        return np.nan\n    if not \"Years\" in age:\n   \
  \     return age\n    years, months = age.split(\" Years and \")\n    months = months.replace(\"\
  \ Months\", \"\")\n    return int(years) + int(months) / 12\n```\n\n\n\n\n\n## 分隔符分隔字符串的拆分\n\
  \n如前所述，Type_of_Loan 特征是个人持有的贷款类型的逗号分隔列表。尽管我们可以以多种方式处理这个问题，但最有用的技术是解析字段并构建一个指示个人持有哪些贷款的布尔列数组。\n\
  \n共有八种独特的贷款类型，以及贷款类型未指定时的特定类别。这些包括汽车贷款、信用建设贷款、债务整合贷款、房产净值贷款、抵押贷款、发薪日贷款、个人贷款和学生贷款。\n\
  \n然后，我们的编码策略将按如下方式处理该特征。我们创建九个新列（每种贷款类型和未指定各一个），如果个人持有该贷款类型，则将列设置为 true。例如，这里有三个连贯的贷款描述：\n\
  \n```\n\"Home Equity Loan, and Payday Loan\"\n\"Payday Loan, Personal Loan\"\n\"\
  Student Loan, Auto Loan, and Debt Consolidation Loan\"\n```\n\n表 6.3 显示了这些示例的编码结果，如果个人持有该类型的贷款，则设置\
  \ true 标志。\n\n| Auto | Credit-Builder | Debt Cons. | Home Equity | Mortgage | Payday\
  \ | Personal | Student | Unspecified |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- |\n| F | F | F | T | F | T | F | F | F |\n| F | F | F | F\
  \ | F | T | T | F | F |\n| T | F | T | F | F | F | F | T | F |\n\n表 6.3 – 贷款类型列对客户的贷款类型进行编码\n\
  \n我们可以利用 pandas 的字符串实用工具来完成上述编码，如示例所示：\n\n```\nframe[\"auto_loan\"] = frame[\"Type_of_Loan\"\
  ].str.lower().str.contains(\"auto loan\").astype(bool)\n```\n\n## 异常值和缺失值\n\n我们遵循与之前相同的一般策略：使用描述性统计量填补缺失值，并且在可能的情况下，使用领域知识定义的边界将异常值设置到边界值。\n\
  \n删除重复行。\n\n就异常值而言，年龄、银行账户数量和月度余额特征存在异常值（我们使用均值和标准差以及分布图予以确认）。我们将这些特征的异常值设置为上限：\n\
  \n```\nframe.loc[frame[\"Age\"] > 65, \"Age\"] = 65\nframe.loc[frame[\"Num_Bank_Accounts\"\
  ] > 1000, \"Num_Bank_Accounts\"] = 1000\nframe.loc[frame[\"Monthly_Balance\"] >\
  \ 1e6, \"Monthly_Balance\"] = np.nan\n```\n\n数据清洗完成后，我们可以验证所有特征都具有正确的类型，并且缺失值已得到处理：\n\
  \n```\ntrain_df.info()\ntrain_df.isnull().sum()\ntrain_df[train_df.duplicated()]\n\
  ```\n\n使用清洗后的数据集，我们可以进行更彻底的探索性分析。\n\n## 探索性数据分析 (EDA)\n\n接下来，我们突出在探索性数据分析中发现的一些模式。\n\
  \n如问题描述中所述，我们需要验证数据中是否存在任何潜在偏差。\n\n我们首先可视化客户的年龄：\n\n```\nsns.histplot(train_df[\"\
  Age\"], bins=20)\n```\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_146_0.png)\n\n\
  图 6.8 – 按年龄显示客户数量的直方图\n\n图 6.8 显示所有年龄组都有代表，数据主要围绕中年人群呈正态分布。\n\n我们还检查月收入。低收入档缺乏数据可能表明少数群体被排除在外：\n\
  \n```\nsns.histplot(train_df[\"Monthly_Inhand_Salary\"], bins=30)\n```\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_147_0.png)\n\
  \n图 6.9 – 按月实发工资显示客户数量的直方图\n\n如图 6.9 所示，月收入遵循预期分布，且低收入档有良好代表性。\n\n我们再次对数值特征可视化相关性热图，以突出和指示相关性：\n\
  \n![](img/31b70e4a77c3afbe11032f68ab874b02_148_0.png)\n\n图 6.10 – 信用评分数据集的相关性热图\n\
  \n有两个显著的强相关性：月度余额与月薪，以及未偿债务与到期延迟。对这些相关性的进一步可视化表明，客户的月度余额随薪水增加，而较差的信用评分与较低的余额和薪水相关联。\n\
  \n未偿债务与信用评分之间也存在类似的相关性：债务增加与较差的信用评分相关联，反之亦然。分析确认，我们的模型应该能够捕捉这两种相关性。\n\n最后，也是重要的是，我们还需要检查数据集的类别分布：\n\
  \n```\nsns.histplot(train_df[\"Credit_Score\"], bins=30)\n```\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_149_0.png)\n\
  \n图 6.11 – 信用评分数据集的类别分布直方图\n\n我们数据集的类别分布如图 6.11 所示。如图所示，存在显著的类别不平衡。在继续建模之前，必须解决不平衡问题。\n\
  \n## 建模\n\n与之前一样，我们首先进行模型选择。\n\n### 模型选择\n\n由于数据集的大小和复杂性，线性模型不太可能表现很好。因此，我们使用普通决策树作为基线模型，并加入随机森林以供比较。\n\
  \n### 模型训练与评估\n\n我们几乎准备好训练模型了，但仍有一个问题：必须解决类别不平衡问题。\n\n### 处理类别不平衡\n\n类别不平衡可能会使任何训练好的模型偏向多数类或类别。尽管基于树的算法在处理类别不平衡方面优于大多数其他学习算法，但在建模之前处理类别不平衡仍然是最佳实践。\n\
  \n一般来说，可以采用以下策略来处理类别不平衡：\n\n- 重采样技术：\n  - **过采样**：这涉及增加少数类样本的数量以匹配多数类。一种常见的技术是 **合成少数类过采样技术\
  \ (SMOTE)**，其中新样本基于现有样本创建。\n  - **欠采样**：这涉及减少多数类样本的数量以匹配少数类。这种方法的一个风险是可能丢失有价值的数据。\n\
  \  - **代价敏感学习**：此方法在训练过程中为少数类的误分类分配更高的代价。其理念是让模型更关注少数类。LightGBM 通过 `class_weight`（用于多分类）和\
  \ `scale_pos_weight`（用于二分类）参数支持此功能。应用这些参数的示例在 *第 4 章，比较 LightGBM、XGBoost 和深度学习*\
  \ 中给出。\n  - **数据增强**：这涉及通过向现有实例添加小扰动来在数据集中创建新实例。此方法在图像分类任务中很普遍。\n  - **使用适当的评估指标**：在类别不平衡中，准确率往往具有误导性。相反，精确率、召回率、F1\
  \ 分数、**ROC 曲线下面积 (AUC-ROC)** 和混淆矩阵等指标可以提供更全面的模型性能视图。\n\n在我们的案例研究中，我们已经针对类别不平衡采用了强健的评估指标。对于此问题，我们使用\
  \ SMOTE（一种过采样技术）来平衡类别，同时保留数据。\n\n### SMOTE\n\nSMOTE 的开发旨在克服对少数类进行简单过采样的一些缺陷，后者可能由于实例的精确复制而导致过拟合\
  \ [1]。SMOTE 不仅仅是复制少数类样本，而是创建合成（“假”）样本，这些样本与少数类中现有样本相似但不完全相同。\n\nSMOTE 算法按如下方式进行。新样本点（称为合成样本）通过在接近少数类样本的样本之间选择点来合成。具体来说，对于每个少数类样本，SMOTE\
  \ 计算 k 近邻，选择其中一个邻居，然后将样本与其选定邻居的特征向量之差乘以 0 到 1 之间的随机数，并将此结果加到原始样本上以创建一个新的合成样本。\n\n\
  通过创建合成示例，SMOTE 为不平衡问题提供了一个更强健的解决方案，鼓励模型绘制更具泛化能力的决策边界。然而，需要注意的是，虽然 SMOTE 可以提高模型在不平衡数据集上的性能，但它并不总是最佳选择。例如，如果少数类样本在特征空间中不足够接近，它可能会引入噪声，导致类别重叠。与所有采样技术一样，至关重要的是\n\
  \n\n使用交叉验证或单独的验证集，仔细评估 SMOTE 对模型性能的影响。\n\nSMOTE 过采样在 imblearn Python 库中实现。我们可以按如下方式拟合并重新采样数据：\n\
  \n```\nX = train_df.drop(columns=[\"Credit_Score\"], axis=1)\nX_dummies = pd.get_dummies(X)\n\
  y = train_df[\"Credit_Score\"]\nsmote = SMOTE(sampling_strategy='auto')\nreturn\
  \ smote.fit_resample(X_dummies, y)\n```\n\n图 6.12 显示了使用 SMOTE 重新采样后数据集的类分布。如图所示，类别现在完全平衡。\n\
  \n![](img/31b70e4a77c3afbe11032f68ab874b02_151_0.png)\n\n图 6.12 – 使用 SMOTE 重新采样数据后\
  \ Credit Score 数据集的类分布直方图；类别现在已平衡\n\n## 模型训练与评估\n\n我们现在可以继续建模。下表显示了使用默认参数运行决策树分类器、随机森林和\
  \ LightGBM 模型的结果。\n\n| 算法 | 准确率 | F1 分数 |\n|---|---|---|\n| 决策树 | 59.87% | 0.57\
  \ |\n| 随机森林 | 69.35% | 0.67 |\n| LightGBM | 70.00% | 0.68 |\n\n表 6.4 – Credit Score\
  \ 数据集上五折交叉验证的性能指标\n\n如表 6.4 所示，LightGBM 模型表现最佳，略高于随机森林模型的准确率。两种算法均优于决策树基线。LightGBM\
  \ 模型训练速度也最快，比随机森林模型快七倍多。\n\n我们现在对 LightGBM 模型进行参数优化。\n\n## 模型调优\n\n与之前的案例研究类似，我们使用\
  \ Optuna 进行参数优化。我们再次使用 TPE 采样器，优化预算为 50 次试验。\n\n## 模型部署与结果\n\n我们的模型现已准备就绪，可以部署到我们选择的平台。潜在的部署选项包括围绕我们的模型构建\
  \ Web API、使用 PostgresML 等工具进行部署，或使用 AWS SageMaker 等云平台。这些及其他选项将在接下来的章节中详细讨论。\n\n\
  我们还可以将模型作为数据科学报告的一部分。关于如何撰写优秀报告的详细信息，请参见上一节。请牢记传达数据科学结果的最重要方面，如下：\n\n- 始终以无偏见和公平的方式报告结果\n\
  - 牢记受众，并关注报告中为他们提供最大价值的细节\n\n## 总结\n\n本章介绍了两个关于如何使用 LightGBM 应用数据科学流程的案例研究。详细讨论了数据科学生命周期及其典型组成步骤。\n\
  \n一个涉及风力涡轮机发电的案例研究被介绍为在贯穿生命周期的同时处理数据问题的示例。详细讨论了特征工程以及如何处理异常值。进行了示例性探索性数据分析，并给出了用于可视化的样本。模型训练和调优与用于导出和作为程序使用模型的基本脚本一起展示。\n\
  \n还介绍了第二个涉及多类信用评分分类的案例研究。再次遵循数据科学流程，特别关注数据集中的数据清理和类别不平衡问题。\n\n下一章将讨论 AutoML 框架 FLAML\
  \ 并介绍机器学习管道的概念。\n"
- "## 参考文献\n\n- [1] N. V. Chawla, K. W. Bowyer, L. O. Hall, 和 W. P. Kegelmeyer，“SMOTE：合成少数类过采样技术，”人工智能研究杂志，第\
  \ 16 卷，第 321–357 页，2002 年 6 月。\n\n## 使用 LightGBM 和 FLAML 进行 AutoML\n\n在前一章中，我们讨论了两个案例研究，展示了处理数据科学问题的端到端示例。在典型数据科学生命周期涉及的步骤中，通常最耗时的任务是准备数据、找到正确的模型以及调优模型。\n\
  \n本章将探讨自动机器学习的概念。自动机器学习系统旨在自动化机器学习生命周期的某些或全部部分。我们将探讨 **FLAML**，这是一个使用高效超参数优化算法来自动化流程的模型选择和调优步骤的库。\n\
  \n最后，我们将介绍一个使用 FLAML 和另一个名为 Featuretools 的开源工具的案例研究。将讨论和展示 FLAML 的实际用法。我们还将展示 FLAML\
  \ 的零样本 AutoML 功能，该功能完全跳过调优。\n\n本章的主要主题如下：\n\n- 自动机器学习简介\n- 用于 AutoML 的 FLAML\n-\
  \ 案例研究 – 将 FLAML 与 LightGBM 结合使用\n\n### 技术要求\n\n本章包含示例和代码摘录，展示了将 FLAML 与 LightGBM\
  \ 用于 AutoML 用例。本章的完整示例和设置合适环境的说明可在 https://github.com/PacktPublishing/Practical-Machine-Learning-with-LightGBM-and-Python/tree/main/chapter-7\
  \ 上找到。\n\n### 自动机器学习\n\n**自动机器学习 (AutoML)** 是一个新兴领域，旨在自动化 ML 工作流的复杂方面，从而实现 ML 模型更高效、更易访问的部署。AutoML\
  \ 的出现反映了人工智能和 ML 技术日益复杂以及它们渗透到各个行业和研究领域。它旨在减轻数据科学流程中一些复杂且耗时的方面，从而实现 ML 技术的更广泛使用和更易访问的应用。\n\
  \n对于精通 ML 和数据科学流程的软件工程师而言，ML 模型日益增加的复杂性和不断扩大的算法宇宙可能构成重大挑战。构建强大、高性能的模型需要大量的专业知识、时间和计算资源，以选择合适的算法、调优超参数并进行深入比较。AutoML\
  \ 已作为这些挑战的解决方案出现，旨在自动化这些复杂且往往劳动密集的任务。\n\nAutoML 还致力于民主化 ML 领域。通过抽象掉数据工程、模型构建和调优中的一些复杂性，AutoML\
  \ 使经验较少的个人和组织能够利用这些强大技术。结果是，ML 可以在更广泛的环境中发挥作用，更多个人和组织能够部署 ML 解决方案。\n\nAutoML 系统有不同复杂程度的可用性。尽管所有\
  \ AutoML 系统都旨在简化 ML 工作流，但大多数系统和工具只关注工作流的部分内容。通常，数据预处理、特征工程、模型选择和超参数调优等步骤会被自动化。这种自动化节省了时间，并可以通过系统地探索更全面的选项来提高\
  \ ML 模型的鲁棒性和性能，这些选项可能会因人类偏见或时间限制而被忽视或未被探索。\n\n### 自动化特征工程\n\n如在 *第 6 章，使用 LightGBM\
  \ 解决现实世界数据科学问题* 中讨论的，数据清理和特征工程是 ML 工作流的关键部分。它们涉及处理不可用数据、处理缺失值以及创建可以输入模型的有意义特征。手动特征工程尤其具有挑战性且耗时。AutoML\
  \ 系统旨在有效处理这些任务，实现自动特征提取和转换，从而构建更强大的模型。\n\n数据清理自动化通常通过遵循针对异常值和缺失值等问题的特定知名技术来实现。在前面的章节中，我们手动应用了一些这些技术：异常值可以进行统计检验并限制或截断。缺失值通常使用描述性统计量（如均值或众数）进行插补。AutoML\
  \ 系统要么使用启发式算法和测试来选择最佳数据清理技术，要么采用多种方法和测试，通过针对数据训练模型来找出效果最好的方法。\n\n\n\n自动化特征工程的方法通常相似：将许多可能的变换应用于所有现有特征，并在建模后测试生成特征的有用性。关于变换如何生成特征的示例，可以在以下案例研究中找到。\n\
  \n自动化特征工程的另一种方法是基于特征的数据类型使用规则来提取特征。例如，可以从日期字段中提取日、周、月和年。或者，可以计算单词或句子特征的字符数、词元、词干或词嵌入。\n\
  \n如您所注意，特征工程自动化技术的应用依赖于手头特征的技术信息，通常是数据类型，以及与其他特征的相关性和关系。重要的是，在创建新特征时没有应用领域知识。这突显了\
  \ AutoML 的一个缺陷：它无法处理需要人类专业知识的特定、由领域驱动的决策。例如，考虑一个带有空腹血糖特征的糖尿病数据集。医疗专业人员（领域专家）知道，空腹血糖在\
  \ 100 至 125 mg/dL 之间的个体被认为是糖尿病前期，而更高的则被认为是糖尿病。这个连续特征可以被工程化为特定类别：正常、糖尿病前期和糖尿病，从而简化建模数据。AutoML\
  \ 系统无法实现这样的变换。\n\n## 自动化模型选择与调优\n\nAutoML 特别有用的领域是模型选择和超参数调优。鉴于可用算法众多，为特定数据集和问题选择最佳算法可能令人生畏。AutoML\
  \ 系统使用各种技术，包括贝叶斯优化和元学习，来选择最佳模型。它们还自动调优超参数以最大化模型性能。\n\nAutoML 系统可以提供自动交叉验证，降低过拟合风险，并确保模型对未见数据的泛化能力。一旦选择并训练了最佳模型，许多\
  \ AutoML 工具还可以帮助部署，使模型可用于对新数据进行推断。\n\n在初始模型部署之外，一些 AutoML 解决方案还在持续模型监控和维护方面提供价值。随着现实世界数据的演变，模型可能会发生漂移，其性能可能会下降。AutoML\
  \ 可以帮助监控模型性能并根据需要重新训练模型，确保您的 ML 系统在长期内保持有效。\n\n## 使用 AutoML 系统的风险\n\n如前所述，AutoML\
  \ 系统通常不使用领域知识来辅助特征工程、模型选择或其他自动化。相反，采用的是一种蛮力或试错的尝试方法。\n\n一些 AutoML 系统的“黑盒”特性也使得难以解释系统做出的决策，因此不太适合需要高度可解释性的应用。\n\
  \n因此，让数据科学家或领域专家参与其中，与 AutoML 系统协作，以识别并利用领域知识可以带来更好模型的机会，这仍然至关重要。然而，AutoML 系统有时会在科学家和数据之间创建额外层，从而阻碍而非支持数据科学家。\n\
  \n我们已经看到一个 AutoML 框架的实际应用。Optuna（我们在 *第 5 章，使用 Optuna 优化 LightGBM 参数* 中讨论过）是专注于超参数调优的\
  \ AutoML 框架示例。在下一节中，我们将讨论另一个 AutoML 框架：FLAML。\n\n## 介绍 FLAML\n\n**FLAML**（**快速且轻量级\
  \ AutoML**）是由 Microsoft Research 开发的 Python 库 [1]。它旨在以低计算成本自动生成高质量的 ML 模型。FLAML\
  \ 的主要目标是尽量减少调优超参数和识别最佳 ML 模型所需的资源，使 AutoML 更加易于使用且成本效益更高，特别是对于预算有限的用户。\n\nFLAML\
  \ 提供了几个关键特性，使其与众不同。其中之一是其效率。它为 ML 任务提供了快速且轻量级的解决方案，最大限度地减少所需的时间和计算资源。它在不牺牲所生成模型质量的前提下实现了这一点。FLAML\
  \ 还强调其在各种 ML 算法和各种应用领域中的多功能性。\n\nFLAML 效率的核心在于其新颖且成本效益高的搜索算法。这些算法智能地探索超参数空间，最初专注于“廉价”配置。随着对搜索空间了解的深入，它会逐步探索更“昂贵”的配置。这确保了探索与利用之间的平衡，在用户指定的时间和资源预算内交付优化的模型。\n\
  \nFLAML 在模型选择过程方面也表现出色。它支持各种 ML 算法，包括 XGBoost、LightGBM、CatBoost、RandomForest 和各种线性模型。该库可以自动为给定数据集选择最佳算法并优化其超参数，无需大量手动干预即可为用户提供最佳模型。\n\
  \nFLAML 提供了简单直观的 API，可与现有的基于 Python 的数据科学和 ML 工作流无缝集成。用户指定数据集、时间预算（以秒为单位）和优化任务，FLAML\
  \ 将处理其余事项。这种用户友好性和效率使其成为 ML 初学者和寻求加速工作流程的资深从业者的实用选择。\n\nFLAML 效率背后的新颖之处在于其 **超参数优化**（HPO）算法。FLAML\
  \ 提供两种 HPO 算法：**成本节约优化** 和 **混合搜索**。\n\n### 成本节约优化\n\n**成本节约优化**（CFO）是一种利用随机直接搜索来探索超参数空间的局部搜索方法\
  \ [2]。CFO 算法从低成本超参数配置开始（例如，对于 LightGBM，低成本配置可能包含较少的增强树）。它在超参数空间中朝向更高代价参数区域进行固定次数迭代的随机步进。\n\
  \nCFO 的步长是自适应的，这意味着如果连续几次迭代没有改进，算法会降低步长。这样做可以避免在高代价且不具前景的方向上采取大步长。\n\nCFO 还利用随机重启。作为一种局部搜索算法，CFO\
  \ 可能会陷入局部最优解。如果没有进展且步长已经很小，算法会从随机点重新启动。\n\n总之，CFO 会快速（使用大步长）尝试到达搜索空间中更有前景的区域，同时尽可能少地使用优化预算（通过从低成本区域开始）。只要优化预算允许，CFO\
  \ 就会继续搜索，如果发生停滞，则在随机区域重新启动。FLAML 允许用户以秒为单位设置优化预算。\n\n### BlendSearch\n\nFLAML 在\
  \ BlendSearch 中提供了 CFO 算法的替代方案。BlendSearch 通过使用多线程方法同时运行全局和本地搜索过程，与 CFO 有所不同 [3]。\n\
  \n与 CFO 类似，BlendSearch 从低成本配置开始并进行本地搜索。然而，与 CFO 不同，BlendSearch 不会等待本地搜索停滞后再探索新区域。相反，全局搜索算法（例如贝叶斯优化）会不断建议新的起点。起点根据其与现有点的距离进行筛选，并按成本优先级排序。\n\
  \nBlendSearch 的每次迭代随后根据上次迭代的性能，选择是继续本地搜索还是在新的全局搜索点开始。与 CFO 类似，全局搜索方法提出的配置会经过可行性验证。\n\
  \n由于 BlendSearch 使用全局优化，它不太容易陷入局部最小值。如果超参数搜索空间高度复杂，则推荐使用 BlendSearch 而非 CFO。通常最好先尝试\
  \ CFO，仅在 CFO 遇到困难时才切换到 BlendSearch。\n\n### FLAML 局限性\n\n尽管有其优势，FLAML 也有其局限性。该库的自动化流程可能无法始终胜过专家的手动调优，尤其是针对复杂的特定领域任务。此外，与其他\
  \ AutoML 解决方案一样，生成模型的可解释性可能具有挑战性，尤其是在处理增强树或神经网络等模型时。\n\nFLAML 只执行 ML 过程中的模型选择和调优部分。这些是模型开发中最耗时的部分之一，但\
  \ FLAML 不提供执行特征工程或数据准备的功能。\n\n\n\n\n以下部分介绍了使用 FLAML 与 LightGBM 的案例研究，展示了日常使用场景、不同优化算法以及\
  \ FLAML 的零样本 AutoML。\n\n## 案例研究 – 使用 FLAML 与 LightGBM\n\n我们将使用前一章中的风力涡轮机数据集进行案例研究。数据集的清理方式与之前相同，填充缺失值并将异常值限制在适当范围内。然而，我们采用了不同的特征工程方法。为了进一步探索\
  \ AutoML，我们使用一个名为 Featuretools 的开源框架。\n\n## 特征工程\n\n**Featuretools**（`https://featuretools.alteryx.com/en/stable/#`）是一个用于自动化特征工程的开源框架。具体来说，Featuretools\
  \ 非常适合转换关系数据集和时间序列数据。\n\n如前一节所述，自动化特征工程工具通常使用特征的组合转换来为数据集生成新特征。Featuretools 通过其\
  \ **深度特征合成 (Deep Feature Synthesis, DFS)** 过程支持特征转换。\n\n例如，考虑一个在线客户 Web 会话数据集。此类数据集中可能有用的典型特征包括客户访问网站的总会话次数，或客户注册的月份。使用\
  \ Featuretools 和 DFS，可以通过以下代码实现（由 `https://featuretools.alteryx.com/` 提供）：\n\n```\n\
  feature_matrix, feature_defs = ft.dfs(\n    entityset=es,\n    target_dataframe_name=\"\
  customers\",\n    agg_primitives=[\"count\"],\n    trans_primitives=[\"month\"],\n\
  \    max_depth=1,\n)\nfeature_matrix\n```\n\n此处应用了两种转换：一种用于“月份”的转换，另一种用于“计数”的聚合。使用这些转换，会自动从客户存在的任何日期中提取月份（例如加入日期），并为每个客户计算计数聚合（例如会话或交易次数）。Featuretools\
  \ 提供了丰富的转换和聚合集合。完整列表可在 `https://featuretools.alteryx.com/en/stable/api_reference.html`\
  \ 上找到。\n\n让我们看看如何使用 Featuretools 为风力涡轮机数据集工程化特征。\n\n## 将 Featuretools 与风力涡轮机数据集结合使用\n\
  \n我们必须为我们的数据集执行两项特征工程任务：为日期时间字段工程化特征以及对分类特征进行编码。为了开始，我们为数据创建一个 EntitySet：\n\n```\n\
  es = ft.EntitySet(id=\"wind-turbine\")\nes = es.add_dataframe(\n    dataframe_name=\"\
  wind-turbine\",\n    dataframe=df,\n    index=\"tracking_id\"\n)\n```\n\nEntitySet\
  \ 告诉 Featuretools 框架我们在数据中使用的实体和关系。前面示例中，Customer 是一个实体示例；在此例中，它是风力涡轮机。然后我们传递数据帧和要用作索引的列。\n\
  \n然后我们应用 dfs 和 encode_features 为我们的数据集工程化特征：\n\n```\nfeature_matrix, feature_defs\
  \ = ft.dfs(\n    entityset=es, target_dataframe_name=\"wind-turbine\",\n    trans_primitives=[\"\
  day\", \"year\", \"month\", \"weekday\"],\n    max_depth=1)\nfeature_matrix_enc,\
  \ features_enc = ft.encode_features(\n    feature_matrix, feature_defs)\n```\n\n\
  前面的代码为我们的每个风力涡轮机测量提取了日期、年份、月份和星期。然后特征编码会自动对数据集的分类特征进行独热编码，包括新的日期字段。\n\n以下是数据集列列表的摘录，显示了\
  \ Featuretools 创建的一些列：\n\n```\n...\n'cloud_level = Low',\n'cloud_level = Medium',\n\
  'cloud_level = Extremely Low',\n'cloud_level is unknown',\n'MONTH(datetime) = 1',\n\
  'MONTH(datetime) = 2',\n...\n'MONTH(datetime) = 8',\n'MONTH(datetime) = 9',\n'MONTH(datetime)\
  \ = 11',\n'MONTH(datetime) is unknown',\n...\n'YEAR(datetime) = 2019',\n'YEAR(datetime)\
  \ = 2018',\n'YEAR(datetime) is unknown'\n```\n\n请注意分类特征的独热编码：每个值现在被拆分为单独的列。这包括未知值的列（例如，YEAR(datetime)\
  \ is unknown），这说明了处理分类特征中缺失值的另一种方法。我们不是使用众数之类的方法填充值，而是有一个列向模型（true 或 false）发出值缺失的信号。\n\
  \n自动化特征工程已将我们的列数从 22 列增加到 66 列。这说明了自动化特征工程和 AutoML 的另一个一般性注意事项：自动化可能导致过于复杂的数据集。在第\
  \ 6 章“使用 LightGBM 解决现实世界的数据科学问题”中，我们可以根据对学习算法的理解有选择地对特征进行编码。LightGBM 可以自动处理分类特征；因此，如果\
  \ LightGBM 是唯一使用的学习算法，独热编码就是多余的。\n\n此外，日期字段可以数值化处理。通过应用我们对问题和算法的了解，我们可以减少学习问题的维度，从而简化它。自动化系统的易用性需要与专家特征工程的手动工作量相权衡，这日后可能节省时间。\n\
  \n数据集现在已准备好进行模型开发；我们只用两行代码就完成了数据集的特征工程。\n\n## FLAML AutoML\n\n我们现在将研究模型选择和调优。我们将使用\
  \ FLAML 比较五个不同的模型：LightGBM、RandomForest、XGBoost、ExtraTrees 和 XGBoost 的限制深度版本。我们还希望为最佳模型找到最优参数。使用\
  \ FLAML，整个过程只需两行代码即可完成：\n\n```\nautoml = flaml.AutoML()\nautoml.fit(X, y, task=\"\
  regression\", time_budget=60)\n```\n\n前面的代码在 60 秒的时间预算内拟合一个最优回归模型。FLAML 自动使用保留集计算验证结果，然后继续优化，默认使用\
  \ CFO 作为调优器。\n\nAutoML 类提供“面向任务的 AutoML”。用户设置学习任务，FLAML 处理其余事项。支持的任务包括：分类、回归、时间序列预测和时间序列分类、排名，以及\
  \ NLP 相关任务，如摘要化和单词标记分类。\n\n对 fit 的调用是可自定义的。例如，我们可以按如下方式自定义：\n\n```\nautoml = flaml.AutoML()\n\
  custom_hp = {\n    \"learning_rate\": {\n        \"domain\": flaml.tune.loguniform(0.0001,\
  \ 0.05)\n    }\n}\nautoml.fit(X, y, task=\"regression\", time_budget=120,\n    metric=\"\
  mse\",\n    estimator_list=['lgbm', 'xgboost', 'rf'],\n    custom_hp={\n       \
  \ \"lgbm\": custom_hp\n    },\n    hpo_method=\"bs\")\n```\n\n在此，我们通过显式将学习率声明为范围内的对数缩放均匀变量来自定义超参数搜索空间。设置参数搜索空间的其他选项包括均匀采样、随机整数采样以及针对分类参数的基于选择的采样。\n\
  \n此外，我们将估计器列表设置为仅关注三种建模算法：LightGBM、随机森林和 XGBoost。最后，我们可以自定义 HPO 算法，在此，我们将其设置为 BlendSearch，它使用前面讨论的多线程优化方法。\n\
  \n完整的自定义列表可在 https://microsoft.github.io/FLAML/docs/reference/automl/automl/#automl-objects\
  \ 上找到。\n\n调用 fit 后，我们可以像使用其他模型一样使用 AutoML 训练的模型。FLAML 提供了 scikit-learn 风格的 API，用于预测和基于概率的预测（用于分类问题）。\n\
  \n以下代码从给定数据创建预测并计算指标和特征重要性：\n\n```\ny_pred = automl.predict(X)\nprint (f\"r2: {1\
  \ - sklearn_metric_loss_score('r2',\n    y_pred, y)}\")\nprint (f\"MSE: {sklearn_metric_loss_score('mse',\n\
  \    y_pred, y)}\")\n\nr2: 0.9878605489721696\nMSE: 0.08090827806554425\n```\n\n\
  我们还可以通过调用以下内容获取获胜模型以及每个试用模型的最佳超参数配置：\n\n```\nprint(automl.best_config)\nprint(automl.best_config_per_estimator)\n\
  print(automl.time_to_find_best_model)\n```\n\n\n\nFLAML的一个值得注意的功能是零样本AutoML，它完全绕过了对模型调优的需求。\n\
  \n## 零样本 AutoML\n\n**零样本AutoML** 是 FLAML 的一项功能，其中不执行超参数优化。相反，通过分析算法在各种数据集上的性能，离线确定合适的超参数配置。该过程可描述如下：\n\
  \n- 1. 在构建模型之前：\n  - 使用 AutoML 在多个数据集上训练模型\n  - 将所有数据集的超参数配置、评估结果和元数据存储为零样本解决方案\n\
  \n- 2. 为新问题构建模型时：\n  - 使用 FLAML 将新数据集与零样本解决方案结果进行对比分析，并确定合适的超参数\n  - 使用超参数在新数据集上训练模型\n\
  \n对于给定的模型类型（例如 LightGBM），第一步仅执行一次。此后，可以为任何新问题构建新模型而无需调优。该解决方案被称为“零样本”，因为合适的参数在新数据集的首次拟合时即被使用。\n\
  \nFLAML 的零样本 AutoML 方法具有许多优势：\n\n- 如前所述，不涉及调优，在解决新问题时节省了大量计算工作量和时间\n- 由于不需要调优，也不需要验证数据集，更多数据可用于训练\n\
  - 用户的参与度更低\n- 通常不需要更改代码，如我们将在下一部分看到\n\n当然，为模型类型创建零样本解决方案仍然艰巨，需要各种数据集和大量计算来训练许多模型。幸运的是，FLAML\
  \ 为许多流行模型提供了预训练的零样本解决方案，包括 LightGBM、XGBoost 和 scikit-learn 的随机森林。\n\n要使用零样本解决方案，请将常规的\
  \ LightGBM 导入替换为 FLAML 包装的版本：\n\n```\nfrom flaml.default import LGBMRegressor\n\n\
  zs_model = LGBMRegressor()\nzs_model.fit(X, y)\n```\n\n调用 fit 会分析 X 中的数据，选择合适的参数，并使用这些参数训练模型。训练仅执行一次，不进行调优。\n\
  \n这结束了我们对 FLAML 的案例研究。正如我们所见，FLAML 为复杂的模型选择和调优功能提供直观的 API，这在处理机器学习问题时可以节省大量精力。\n\
  \n## 摘要\n\n总而言之，本章讨论了 AutoML 系统及其用途。讨论了自动化特征工程、模型选择和调优的典型方法。我们还提到了使用这些系统相关的风险和注意事项。\n\
  \n本章还介绍了 FLAML，这是一个用于 AutoML 的库，提供用于自动化模型选择和调优过程的工具。我们还介绍了 FLAML 提供的两种高效超参数优化算法\
  \ CFO 和 BlendSearch。\n\n本章以案例研究的形式展示了应用 FLAML 的实际操作。除了 FLAML，我们还展示了一个名为 Featuretools\
  \ 的开源工具，它提供自动化特征工程的功能。我们展示了如何使用 FLAML 在固定时间预算内开发优化模型。最后，我们提供了使用 FLAML 零样本 AutoML\
  \ 功能的示例，该功能通过针对已知问题的配置分析数据集来确定合适的超参数，从而消除了模型调优的需求。\n\n下一章将讨论围绕 LightGBM 模型构建机器学习管道，重点是将\
  \ LightGBM 模型导出、打包并部署到生产环境。\n\n## 参考文献\n\n- [1] C. Wang, Q. Wu, M. Weimer, and E.\
  \ Zhu, “FLAML: A Fast and Lightweight AutoML Library,” in MLSys, 2021.\n- [2] Q.\
  \ Wu, C. Wang and S. Huang, Frugal Optimization for Cost-related Hyperparameters,\
  \ 2020.\n- [3] C. Wang, Q. Wu, S. Huang, and A. Saied, “Economical Hyperparameter\
  \ Optimization With Blended Search Strategy,” in ICLR, 2021.\n"
