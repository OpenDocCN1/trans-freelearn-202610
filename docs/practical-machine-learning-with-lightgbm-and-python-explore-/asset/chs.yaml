  \ 拟合了一个系数为 0.85、截距为 3.68 的模型。我们的猜测方向是对的，但可能需要花些时间才能找到最优值。\n\n这结束了我们对 scikit-learn\
  \ 以及建模和机器学习基础知识的介绍。在我们的玩具示例中，我们没有将数据拆分为单独的数据集，没有优化模型的超参数，也没有应用任何技术来确保模型不过拟合。在下一节中，我们将探讨分类和回归示例，在那里我们将应用这些以及其他最佳实践。\n\
  \n## 决策树学习\n\n本节介绍决策树学习，这是理解 LightGBM 的关键机器学习算法。我们将逐步演示如何使用 scikit-learn 构建决策树。本节还将提供构建决策树的一些数学定义；理解这些定义并不关键，但将帮助我们理解关于决策树超参数的讨论。\n\
  \n决策树是基于树的学习器，通过就数据提出一连串问题来确定结果。沿着树向下走一条路径，使用一个或多个特征对输入做出决策。路径在叶子节点处终止，该节点表示预测的类或值。决策树可用于分类或回归。\n\
  \n以下是针对 Iris 数据集拟合的决策树示例：\n\n![](img/31b70e4a77c3afbe11032f68ab874b02_38_0.png)\n\
  \n图 1.5 – 对 Iris 数据集建模的决策树\n\nIris 数据集是一个分类数据集，其中使用 Iris 花的萼片和花瓣尺寸来预测 Iris 花的类型。每个非叶子节点使用一个或多个特征来缩小数据集中的样本范围：根节点从全部\
  \ 150 个样本开始，然后根据花瓣宽度（<= 0.8）将它们分割。我们继续沿着树向下，每个节点进一步分割样本，直到到达一个包含预测类（versicolor、virginica\
  \ 或 setosa）的叶子节点。\n\n与其他模型相比，决策树有许多优点：\n\n- **特征可以是数值型或类别型**：可以使用数值特征（通过分割范围）或类别特征来分割样本，而无需对其中任何一种进行编码。\n\
  \n- **减少数据准备需求**：决策分割对数据范围或大小不敏感。许多其他模型（例如神经网络）要求数据归一化到单位范围。\n\n- **可解释性**：如前所示，解释树所做的预测非常简单。在需要向决策者解释预测的场景中，可解释性非常有价值。\n\
  \n这些只是使用基于树模型的一些优点。然而，我们也需要了解与决策树相关的一些缺点：\n\n- **过拟合**：决策树非常容易过拟合。在拟合决策树时，设置正确的超参数至关重要。决策树中的过拟合将在后面详细讨论。\n\
  \n- **外推能力差**：由于决策树的预测不连续且实际上受限于训练数据，因此它们在外推方面表现不佳。\n\n- **不平衡数据**：在不平衡数据上拟合树时，高频类别会主导预测。需要准备数据以消除不平衡。\n\
  \n关于决策树优缺点的更详细讨论可在 https://scikit-learn.org/stable/modules/tree.html 上查阅。\n\n##\
  \ 熵与信息增益\n\n在研究构建（或拟合）决策树的算法之前，我们首先需要对熵和信息增益有基本的理解。\n\n熵可以被视为衡量系统无序度或随机性的一种方法。熵衡量特定输入或事件的结果有多么令人惊讶。考虑一副洗好牌的牌：从顶部抽牌可能会给我们牌组中的任何一张牌（每次都是一个令人惊讶的结果）；因此，我们可以说一副洗好的牌具有\
  \ **高熵**。从有序牌组的顶部抽牌并不令人惊讶；我们知道接下来的牌是什么。因此，一副有序的牌具有 **低熵**。解释熵的另一种方式是数据集的不纯度：低熵数据集（整齐有序）的不纯度低于高熵数据集。\n\
  \n信息增益，则是在修改或观察底层数据时获得的信息量。信息增益涉及从观察前降低熵。在我们的牌组示例中，我们可以拿一副洗好的牌，按花色（黑桃、红心、方块和梅花）将其分成四个较小的牌组。如果从较小的牌组中抽牌，结果就不那么令人惊讶了：我们知道下一张牌是同一花色的。通过按花色分割牌组，我们\n\
  \n\n\n降低了较小牌组的熵。基于特征（花色）分割牌组与决策树中分割的工作方式非常相似；每一次划分都力求最大化信息增益——也就是说，它们最小化划分后的熵。\n\
  \n在决策树中，衡量信息增益或不纯度损失有两种常见方法：\n\n- 吉尼指数\n- 对数损失或熵\n\n每种方法的详细解释可在 https://scikit-learn.org/stable/modules/tree.html#classification-criteria\
  \ 上找到。\n\n## 使用 C4.5 构建决策树\n\nC4.5 是一种从数据集构建决策树的算法 [1]。该算法是递归的，并从以下基本情况开始：\n\n-\
  \ 1. 如果子数据集中的所有样本都属于同一类别，则在树中创建一个选择该类别的叶子节点。\n- 2. 如果使用任何特征进行分割都无法获得信息（数据集无法再进一步划分），则创建一个预测子数据集中出现频率最高类别的叶子节点。\n\
  - 3. 如果子数据集中达到最小样本阈值，则创建一个预测子数据集中出现频率最高类别的叶子节点。\n\n然后，我们可以应用该算法：\n\n- 1. 检查三种基本情况中的任何一种，如果其中任何一种适用于数据集，则停止分割。\n\
  - 2. 对数据集的每个特征或属性，计算基于该特征分割数据集所获得的信息增益。\n- 3. 基于信息增益最高的特征分割数据集，创建一个决策节点。\n- 4. 基于决策节点将数据集分割为两个子数据集，并对每个子数据集递归应用该算法。\n\
  \n构建树后，会应用剪枝。在剪枝过程中，会移除信息增益相对较低的决策节点。移除节点可以避免对训练数据过拟合，并提高树的泛化能力。\n\n## 分类和回归树\n\n\
  你可能已经注意到，在前面的解释中，我们仅使用类别通过决策节点来分割数据集；这并非巧合，因为标准 C4.5 算法仅支持分类树。分类和回归树（CART）扩展了 C4.5，以支持数值目标变量——也就是说，回归问题\
  \ [2]。使用 CART 时，决策节点也可以分割连续数值输入变量以支持回归，通常使用阈值（例如，x <= 0.3）。当到达叶子节点时，通常将剩余数值范围的均值或中位数作为预测值。\n\
  \n构建分类树时，仅使用不纯度来确定分割。然而，对于回归树，不纯度会与其他标准结合以计算最优分割：\n\n- 均方误差（MSE 或 MAE）\n- 泊松偏差的一半\n\
  \n每种方法的详细数学解释可在 https://scikit-learn.org/stable/modules/tree.html#regression-criteria\
  \ 上找到。\n\nscikit-learn 使用 CART 的优化版本来构建决策树。\n\n## 决策树中的过拟合\n\n决策树最显著的缺点之一是它们容易过拟合。如果没有适当的超参数选择，C4.5\
  \ 和其他训练算法会创建过于复杂和深层的树，几乎完全拟合训练数据。管理过拟合是构建决策树的关键部分。以下是一些避免过拟合的策略：\n\n- **剪枝**：如前所述，我们可以移除贡献不大的信息增益的分支；这会减少树的复杂性并提高泛化能力。\n\
  - **最大深度**：限制树的深度也可以避免过于复杂的树并防止过拟合。\n- **最大叶子节点数**：与限制深度类似，限制叶子节点的数量可以避免过于具体的分支并提高泛化能力。\n\
  - **每个叶子节点的最小样本数**：对叶子节点可能包含的样本数设置最小限制（当子数据集达到最小大小时停止分割）也可以避免过于具体的叶子节点。\n- **集成方法**：集成学习是一种结合多个模型以改进单个模型预测的技术。对多个模型的预测求平均也可以减少过拟合。\n\
  \n这些策略可以通过设置适当的超参数来应用。既然我们了解了如何构建决策树以及应对过拟合的策略，让我们来看看如何在 scikit-learn 中构建决策树。\n\n\
  ## 使用 scikit-learn 构建决策树\n\n是时候通过使用 scikit-learn 训练分类树和回归树来探讨如何使用决策树了。\n\n## 对乳腺癌进行分类\n\
  \n我们将使用乳腺癌数据集（https://scikit-learn.org/stable/datasets/toy_dataset.html#breast-cancer-dataset）作为分类示例。该数据集包含从细针穿刺乳腺肿块图像中计算得出的特征，任务是预测肿块是恶性还是良性。\n\
  \n使用 scikit-learn，我们可以用五行代码解决这个分类问题：\n\n```python\ndataset = datasets.load_breast_cancer()\n\
  \nX_train, X_test, y_train, y_test = train_test_split(dataset.data,\n    dataset.target,\
  \ random_state=157)\n\nmodel = DecisionTreeClassifier(random_state=157, max_depth=3,\
  \ min_samples_split=2)\nmodel = model.fit(X_train, y_train)\n\nf1_score(y_test,\
  \ model.predict(X_test))\n```\n\n首先，我们使用 load_breast_cancer 加载数据集。然后，我们使用 train_test_split\
  \ 将数据集分割为训练集和测试集；默认情况下，25% 的数据用于测试集。与之前一样，我们实例化 DecisionTreeClassifier 模型，并使用 model.fit\
  \ 在训练集上对其进行训练。实例化模型时传入的两个超参数值得注意：max_depth 和 min_samples_split。这两个参数都控制过拟合，将在下一节中更详细地讨论。我们还为训练-测试分割和模型指定了\
  \ random_state。通过固定随机状态，我们确保结果可重复（否则，scikit-learn 会在每次执行时创建一个新的随机状态）。\n\n最后，我们使用\
  \ f1_score 衡量性能。我们的模型达到 0.94 的 F1 分数和 93.7% 的准确率。F1 分数的满分是 1.0，因此我们可以得出结论，模型表现非常好。如果我们对预测进行分解，模型在测试集的\
  \ 143 个样本中只漏掉了 9 个样本的预测：7 个假阳性和 2 个假阴性。\n\n## 预测糖尿病进展\n\n为了说明如何使用决策树解决回归问题，我们将使用糖尿病数据集（https://scikit-learn.org/stable/datasets/toy_dataset.html#diabetes-dataset）。该数据集有\
  \ 10 个特征（年龄、性别、体重指数等），模型的任务是预测 1 年后疾病进展的定量指标。\n\n我们可以使用以下代码来构建和评估回归模型：\n\n```python\n\
  dataset = datasets.load_diabetes()\n\nX_train, X_test, y_train, y_test = train_test_split(dataset.data,\n\
  \    dataset.target, random_state=157)\n\nmodel = DecisionTreeRegressor(random_state=157,\
  \ max_depth=3, min_samples_split=2)\nmodel = model.fit(X_train, y_train)\n\nmean_absolute_error(y_test,\
  \ model.predict(X_test))\n```\n\n我们的模型达到 45.28 的 MAE。该代码与我们的分类示例几乎相同：我们没有使用分类器，而是使用\
  \ DecisionTreeRegressor 作为模型，并计算 mean_absolute_error 而不是 F1 分数。scikit-learn 在使用不同类型的模型解决各种问题时\
  \ API 的一致性是经过设计的，这说明了机器学习工作中的一个基本真理：即使数据、模型和指标发生变化，构建机器学习模型的整体过程仍然相同。在即将到来的章节中，我们将展开这一一般方法论，并在构建机器学习流水线时利用该过程的一致性。\n\
  \n## 决策树超参数\n\n我们在前面的分类和回归示例中使用了一些决策树超参数来控制过拟合。本节将介绍 scikit-learn 提供的最关键的决策树超参数：\n\
  \n- max_depth：树允许达到的最大深度。更深的树允许更多的分割，导致更复杂的树和过拟合。\n- min_samples_split：分割节点所需的最小样本数。仅包含少量样本的节点会过拟合数据，而较大的最小值可提高泛化能力。\n\
  - min_samples_leaf：叶子节点中允许的最小样本数。与分割中的最小样本数类似，增加该值会导致树更不复杂，从而减少过拟合。\n- max_leaf_nodes：允许的最大叶子节点数。更少的叶子节点可减小树的大小，从而降低复杂性，可能会提高泛化能力。\n\
  - max_features：确定分割时要考虑的最大特征数。丢弃一些特征可减少数据中的噪声，从而改善过拟合。特征是随机选择的。\n- criterion：确定分割时要使用的不纯度度量，可以是\
  \ gini 或 entropy/log_loss。\n\n\n\n\n\n如您可能已经注意到，大多数决策树超参数都涉及通过控制树的复杂度来控制过拟合。这些参数提供了多种实现方式，而找到参数及其值的最佳组合并非易事。找到最佳超参数被称为**超参数调优**，本书后续章节将对此进行详细介绍。\n\
  \n完整的超参数列表可在以下位置找到：\n\n- https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html#sklearn-tree-decisiontreeclassifier\n\
  - https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeRegressor.html#sklearn.tree.DecisionTreeRegressor\n\
  \n现在，让我们总结本章的关键要点。\n\n## 摘要\n\n本章将机器学习介绍为一种通过从数据集中学习执行任务来创建软件的方法，而不依赖于手动编程指令。我们重点介绍了监督学习的机器学习核心概念，并通过scikit-learn的示例说明了它们的应用。\n\
