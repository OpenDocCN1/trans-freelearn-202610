- pgno: 38
  md: '# How can you excel at data analytics with TCRM?


    As you consider what you have learned so far in this chapter, it is time to reflect
    on the state of data and analytics in your organization. Your data is an extremely
    valuable resource, one that should empower smart decision-making and guide organizational
    strategy. What value does your company data provide?


    Ask yourself these questions and evaluate if your organization has any room for
    improvement:


    +   - Do your leaders have accurate, current information at their fingertips to
    make informed decisions?

    +   - Do you have one reliable source of information that you and your colleagues
    can access and depend upon? Or is information spread across multiple systems and
    platforms, and analyzed using a variety of tools?

    +   - Is your team empowered and enabled by simple, actionable data analytics?

    +   - Do you and your colleagues find yourselves gathering information from various
    places – such as cloud storage, CRM, spreadsheets, email, ERP, and so on – to
    bring it together in a spreadsheet and create the report you need to do your job?

    +   - How do you share valuable insights and then action those insights? Is this
    simple and easy, or complex and difficult?

    +   - What are your current strengths in the areas of data and analytics?

    +   - What are your current weaknesses in the areas of data and analytics?

    +   - What are your current opportunities in the areas of data and analytics?

    +   - What are your current challenges in the areas of data and analytics?

    +   - If platforms, people, and processes were not a barrier, where do you see
    your organization being in 12 months, in the context of using information to create
    actionable business insights? How likely is it that you will reach that ideal
    state?


    I think I could summarize all of this into one simple question:


    *Does your organization excel at data analytics?*


    Honestly, in my experience across many industries and segments, most organizations
    do not excel. Many would not even be given a passing grade! Data analytics is
    a serious pain point for a typical business, whatever the size or vertical, and
    it is never solved by throwing money at it.'
  merge: -1
  img_proc: true
