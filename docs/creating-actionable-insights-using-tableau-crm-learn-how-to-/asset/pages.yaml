  md: 'The options that are available for each field are as follows:


    +   - **Rename**: To rename the field label.

    +   - **Hide**: To hide the field.

    +   - **Edit Values** (dimensions or dates only): A field label can be edited
    here, and a default color can be added for each value.

    +   - **Format Numbers** (measures only): Numbers can be formatted to suit your
    requirements, such as currency rounded or percent.

    +   - **Copy API Name**: Copies the field API name to your clipboard.


