- pgno: 51
  md: '# What is a TCRM analytics app?


    Before we dive into the deployment and customization of a TCRM analytics app,
    we first need to understand what one exactly is. A TCRM application is essentially
    a container for four TCRM assets: **dashboards**, **stories**, **lenses**, and
    **datasets**. Here is a simple visual overview of a TCRM app:


    ![](img/06379e43783b9ddfee45e9da5192efe1_51_0.png)


    Figure 2.9 – Overview of a TCRM app


    Open up the existing app, My DTC Sales, and you will see the previously listed
    assets, as well as a **Details** tab that displays system information.


    As you explore the **My DTC Sales** app, and as we prepare to build our very own
    app, there are some basics you first need to grasp. There are three things to
    note about TCRM analytics apps, outlined as follows:


    +   - **An app is secure.** That is, it can be restricted to the creator or can
    be opened up to other users. App-level security is one form of TCRM security.

    +   - **An app can be shared.** There are three ways to share the contents of
    an app with others for collaboration, listed as follows:

    +     A. Give access via TCRM

    +     B. Post to a Chatter feed

    +     C. Share via the app URL

    +   - **An app can be templated.** This is a powerful tool that enables the **Analytics**
    dashboard, data flow, and so on, to be packaged and deployed elsewhere.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '> **Note**

    > See here for more information about app templates: https://developer.salesforce.com/docs/atlas.en-us.bi_dev_guide_wave_templates.meta/bi_dev_guide_wave_templates/bi_templatesdev_intro_wave_templates.htm.


