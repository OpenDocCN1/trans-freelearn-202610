- pgno: 181
  md: '# Pivot table


    You are most likely familiar with pivot tables; they are a common feature in tools
    such as spreadsheets. A pivot table is an interactive way to summarize data and
    analyze numerical data in detail. A pivot table is useful for doing the following:


    +   - Subtotaling and aggregating numeric data, summarizing data by categories
    and subcategories.

    +   - Expanding and collapsing different levels of data to focus on the results
    and drill down into the details at the summary level.

    +   - Moving rows to columns or columns to rows (known as pivoting) to see varying
    summaries of your data.

    +   - Filtering, sorting, grouping, and conditionally formatting the most useful
    and relevant subsets of data, enabling you to focus on the information you need.


    By opening My First Lens and creating a pivot table with the second grouping of
    industry, we will see something like this after filtering the results:


    ![](img/06379e43783b9ddfee45e9da5192efe1_181_0.png)


    Figure 6.25 – Pivot table example'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Now, it''s time to move on from Table Mode to Query Mode.


    # Query Mode


    Now that you''re confident with the Chart and Table Modes, the only mode left
    to understand is the powerful code-based analysis tool in TRCM lenses known as
    Query Mode. Query Mode utilizes Salesforce Advanced Query Language (SAQL) to query
    your data, as opposed to the declarative and low-code approaches we''ve examined
    so far.


    Query Mode looks like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_182_0.png)


    We are not going to dive into the details of Query Mode here because SAQL will
    be studied in detail in Chapter 9, Advanced Dashboard Design and Build. For a
    detailed reference on writing SAQL, see the TCRM SAQL Developer Guide here:


    https://developer.salesforce.com/docs/atlas.en-us.232.0.bi_dev_guide_saql.meta/bi_dev_guide_saql/bi_saql_intro.htm'
  merge: -1
