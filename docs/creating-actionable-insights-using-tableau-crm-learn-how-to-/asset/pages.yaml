- pgno: 205
  md: '# 8


    # Building Your First TCRM Dashboard


    It''s time to put your new understanding to use and build your first Tableau CRM
    (TCRM) dashboard. By the end of this chapter, you will be able to create a dashboard
    from scratch, navigate through the dashboard editor, add and edit widgets, add
    pages, slice and dice data, and share your findings with others.


    We will cover the following main topics in this chapter:


    +   - Getting to know your dashboard editor

    +   - Creating a dashboard and placing widgets

    +   - The devil is in the details

    +   - Understanding the top-down design with pages

    +   - A user''s guide to a TCRM dashboard'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Technical requirements


    You will need the following to successfully execute the instructions in this chapter:


    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM)

    +   - A working email address


    Be sure to be logged in to your TCRM dev org.


    Time to jump in and build your first TCRM dashboard!


    # Getting to know your dashboard editor


    In this section, you will get hands-on and learn how to use the dashboard editor
    in TCRM.


    From your Analytics Studio home page, click on Create and select Dashboard, then
    click on Create Blank Dashboard. You will come to the dashboard editor canvas,
    which looks like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_206_0.png)


    Figure 8.1 – The initial dashboard editor canvas


    Before proceeding with the next steps, save your dashboard as My First Dashboard
    in My First Analytics App.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Now, configure the dashboard settings by clicking on the **Default** gear icon.
    I typically use these default settings:


    +   - **Name:** `Default`

    +   - **Columns:** 50

    +   - **Row Height:** Fine

    +   - **Cell Spacing:** 8 (horizontal) and 0 (vertical)

    +   - **Maximum Dashboard Width:** 1500

    +   - **Background Color:** Leave as-is for now


    There are 14 tools available on the left-hand side of the canvas, as detailed
    next; these will be explained as you add them to your dashboard:


    +   - Chart

    +   - Table

    +   - Filter

    +   - Container

    +   - Component

    +   - Date

    +   - Link

    +   - Image

    +   - List

    +   - Number

    +   - Range

    +   - Text

    +   - Toggle

    +   - Navigation


    When you click on the drop-down arrow at the top right of the editor, you have
    these options:


    +   - **Clone in New Tab:** Creates a clone of the current dashboard in a new
    tab.

    +   - **Dashboard Properties:** General options and widget default properties.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   - **Pick Initial Values**: Set the default filter and facet values for
    the dashboard; these will apply every time the dashboard is opened.

    +   - **Conversations**: Lets you query your data using conversational, everyday
    language. This needs to be enabled and the correct permissions assigned for the
    user to see and use this functionality.

    +   - **Connect Data Sources**: Join data sources using a common field.

    +   - **Delete**: Permanently delete the dashboard.


    It''s now time to flesh out your dashboard.


    # Creating a dashboard and placing widgets


    The best way to show you how to build a dashboard and help you become familiar
    with the dashboard editor is to walk you through a simple dashboard build.


    # Creating a sales dashboard


    We will create a sales dashboard based upon the **Opportunities** dataset in **My
    First Analytics App**. Follow these steps:


    +   1. Create a fresh query by clicking on the **Create Query** button on the
    right-hand side of the canvas.

    +   2. Select the **Opportunities** dataset in **My First Analytics App**. This
    brings you to a view that is familiar to you as being almost identical to a lens.

    +   3. At the top left, where you see a pencil icon, rename the query **Pipeline
    by Close Date**.

    +   4. Change the measure (**Bar Length**) to **Sum of Amount**.

    +   5. Add a grouping (**Bar**) for **Close Date (Year-Month)**.

    +   6. On the far right, click on the Charts icon and change the chart type to
    **Time Bar** in the **DATES & TIMES** category.

    +   7. Add a filter for **Closed** equal to the value of **False** (as in, open
    opportunities).

    +   8. Click **Done**, which will close the window.


    The query now appears in the query list on the right, under the **Opportunities**
    dataset.


    +   9. Drag the query onto the canvas. This creates a chart widget.

    +   10. Enlarge the widget by dragging the handles.

    +   11. Click **Save** to save your dashboard.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Please note that the result you achieved from the preceding steps can also
    be achieved by dragging the chart widget onto the canvas from the left-hand side
    menu.


    The dashboard should now look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_209_0.png)


    Figure 8.2 – Dashboard editor canvas with a pipeline chart added


    # Placing widgets on the sales dashboard


    When you select the widget, you now have several widget options available at the
    bottom right-hand side of the canvas, as follows:


    +   - **Edit Query and Widget:** Opens the widget for editing.

    +   - **Advanced Editor:** Opens **Advanced Interaction Editor**. This will be
    covered in *Chapter 9, Advanced Dashboard Design and Build.*

    +   - **Copy widget to clipboard:** Copies the widget so that it can be pasted
    into this dashboard or any open dashboard.

    +   - **Delete Widget:** Deletes a widget from the dashboard without deleting
    the query.

    +   - **Duplicate Widget:** Copies the widget with a query and adds it to the
    dashboard.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - **View Query Properties**: Opens the query property window on the right-hand
    side.

    +   - **Clone Query**: Clones the query and opens it for editing.

    +   - **Remove Query**: Removes the query from the widget and retains its format
    without removing the widget from the dashboard.


    You are now going to edit the pipeline widget by following these steps:


    +   1. On the far right, click on the **Formatting** (paintbrush) icon.

    +   2. In the **Title** field, add a title for the widget: `Pipeline by Close
    Date`.

    +   3. Change the **Title Font Size** setting to 18.

    +   4. In the **Subtitle** field, add a subtitle: `All open deals`.

    +   5. Change the **Subtitle Font Size** setting to 14.

    +   6. Change **Title Alignment** to left.

    +   7. Change the **Theme** field to `Light`.

    +   8. Under **Time Bar Chart**, uncheck the option for **Show values in chart
    bars**.

    +   9. Under the x axis, add a custom title: **Close Date Month**.

    +   10. Under the y axis (left), add a custom title: **Deal Size**.

    +   11. Add a reference line under the y axis with a **Value** setting of 3000000
    and a **Label** value of **Target**.

    +   12. Under **Conditional Formatting**, click on **Apply Conditional Formatting
    To** and select **Sum of Amount**. Leave the default gradient setting.

    +   13. Under **Widget Style**, add a border as you see fit.

    +   14. Add a text widget to give the dashboard a title, **Sales Insights**, and
    change the font and color as you see fit. Go into **Preview** mode.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'The result of the preceding steps should look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_211_0.png)


    Figure 8.3 – My First Dashboard with the completed pipeline widget


    Before you go any further, make some subtle changes to improve the dashboard aesthetics,
    as follows:


    +   1. Click on **Edit** to edit the dashboard.

    +   2. Click on the **Default** gear icon to open the dashboard settings.

    +   3. Under **Background Color**, change **Grid** to White.

    +   4. Select **Dashboard Properties** from the drop-down list at the top right
    of the dashboard editor.

    +   5. Change the default widget background color to transparent by clicking on
    **Background Color**, selecting **Custom**, and dragging the transparency bar
    all the way to the left.

    +   6. Add a default widget border with a transparent color, and a width and radius
    of 8.

    +   7. Click **Save** to save the dashboard.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'You are now going to add a second widget to the dashboard by beginning with
    the existing pipeline widget. The pipeline widget is the main chart, often referred
    to as a *hero chart*, and it needs supporting charts and metrics. Follow these
    steps to add a second widget to the dashboard:


    +   1. Select the pipeline widget and click on **Copy Widget**.

    +   2. Paste the duplicate widget onto the dashboard canvas.

    +   3. Select the new widget and go to the **Widget** panel on the right-hand
    side.

    +   4. Remove the widget border by deselecting the border icon.

    +   5. Remove the target reference line by clicking on the x next to the reference
    line in the format panel.

    +   6. Change the chart type to **Bar** by clicking on the **Chart Type** button
    and choosing a bar chart.

    +   7. Click on **Edit Query and Widget** for the new widget.

    +   8. Change the bar grouping to **Stage**.

    +   9. Sort the **Sum of Amount** field in **Descending** order.

    +   10. Remove the legend by deselecting the **Show legend** checkbox.

    +   11. Remove the title on the y axis.

    +   12. Remove the axis and title on the x axis (top).

    +   13. Check **Show values in chart bars**.

    +   14. Change the widget title to `Pipeline by Stage` and reduce the font size
    to 16.

    +   15. Remove the subtitle.

    +   16. Rename the query `Pipeline by Stage`.

    +   17. Click on **Update**.

    +   18. Move and resize (shrink) the widget, as it supports the first pipeline
    chart.

    +   19. Remove the default border from the dashboard title text widget by deselecting
    the border icon.

    +   20. Click on **Save**.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'The dashboard should now look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_213_0.png)


    Figure 8.4 – My First Dashboard with Pipeline by Stage added


    # Adding a highlights panel to the sales dashboard


    Now, it''s time to add a highlights panel to your dashboard. This is useful to
    draw attention to key metrics and the dashboard filters. To do so, you can follow
    these steps:


    +   1. Select the two chart widgets together by holding *Cmd* or *Ctrl* while
    clicking on each of them, then drag down a few rows to make room for the highlights
    panel.

    +   2. Drag a **Container** widget onto the canvas.

    +   3. Resize/enlarge the container, move the title text widget into the container,
    then make sure the container fills the space above the hero chart.'
  merge: -1
  img_proc: true
