  md: 'Here is another example where a union is used to combine information for Last
    Year Generated and This Year Converted into one table:


    ```

    q = load "OppOwnerAcnt";

    q_A = filter q by (''AccountId.Type'' == "Partner" or ''Type'' == "New Business")
    && date(''CloseDate_Year'', ''CloseDate_Month'', ''CloseDate_Day'') in ["1 year
    ago".."1 year ago"] ;

    q_B = filter q by (''AccountId.Type'' == "Partner" or ''Type'' == "New Business")
    && date(''CloseDate_Year'', ''CloseDate_Month'', ''CloseDate_Day'') in ["current
    year".."current year"] ;

    result = group q_A by all full, q_B by all;

    result = foreach result generate sum(q_A.''Amount'') as ''A'', sum(q_B.''Amount'')
    as ''B'';

    final1 = foreach result generate "Last Year Generated" as ''Description'', sum(''A'')
    as ''Sum'';

    final2 = foreach result generate "This Year Converted" as ''Description'', sum(''B'')
    as ''Sum'';

    final = union final1,final2;

    ```


    # Groupings, summaries, subtotals, averages, and more


    Adding custom, complex groupings, summaries, subtotals, averages, and more often
    requires the use of SAQL.


    Here is one example where the user wants to identify the top 5% of accounts:


    ```

    q = load "Wave_Sample_Opportunities";

    q = group q by ''Account_Name'';

    q = foreach q generate ''Account_Name'', sum(''Amount'') as ''sum_Revenue'', rank()
    over ([..] partition by all order by sum(''Amount'')) as ''Position'', sum(1)
    over ([..] partition by all) as ''count'';

    q = foreach q generate ''Account_Name'', ''sum_Revenue'', ( case when ''Position''
    >= (floor(((95*''count'') + 1)/100)) then "Top 5 %" else "Rest" end ) as ''Bracket'';

    q = filter q by ''Bracket'' != "Rest";

    q = group q by (''Account_Name'', ''Bracket'');

    ```'
