- pgno: 61
  md: '![](img/06379e43783b9ddfee45e9da5192efe1_61_0.png)


    Figure 2.20 – Locating user license information in Setup


    Salesforce auto-assigns an **Einstein Analytics Growth** permission set license
    to the user to whom you assign any TCRM permissions in your org. A PSL can also
    be manually assigned to users. The process of creating and assigning a permission
    set is detailed in the following steps:


    +   1. In the **Setup** menu, under **Administration**, click **Users**, then
    **Permission Sets**, and then click **New**.

    +   2. Associate the new permission set with a PSL. You must have purchased a
    TCRM license before you can select any PSL for TCRM.

    +   3. Add permissions to the permission set from those available in the PSL.

    +   4. Assign that permission set to users.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Which permissions do I need to access, build, and edit analytics apps?


    There are two prebuilt permission sets included in the **Einstein Analytics Growth
    license**, detailed as follows:


    +   - **Einstein Analytics Platform Admin**: Here, all permissions that are required
    to administer the TCRM platform are enabled. This includes permissions to enable
    the user to create TCRM templated and custom apps.

    +   - **Einstein Analytics Platform User**: Here, all permissions that are required
    to use the TCRM platform and TCRM templated apps are enabled.


    The basic setup involves choosing and assigning the prebuilt permission sets,
    via **Setup**. There are two prebuilt permission sets included in the **Einstein
    Analytics Plus license**, detailed as follows:


    +   - **Einstein Analytics Platform Admin**: This set implements all the permissions
    that are required to administer the TCRM platform. This includes permissions to
    enable the user to create TCRM templated and custom apps.

    +   - **Einstein Analytics Platform User**: This set implements all the permissions
    that are required to use the TCRM platform and TCRM templated apps.


    Choosing and assigning the prebuilt permission sets via **Setup** is part of the
    basic setup, as shown in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_62_0.png)


    Figure 2.21 – Various TCRM permission sets, accessed via Setup/Users/Permission
    Sets'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Under the appropriate permission set, add or remove assignments as required.


    To create your own custom TCRM permission sets, employ an advanced setup by using
