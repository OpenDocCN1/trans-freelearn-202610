- pgno: 108
  md: '# Predict missing values


    Tableau CRM intelligently replaces any missing values in the selected column with
    predictions based on values in other strongly correlated columns in your data.


    # Discovery prediction


    This populates your datasets with predictive and prescriptive intelligence, as
    Einstein calculates and saves predicted outcomes on a row-by-row basis. Additionally,
    you can store descriptions of top predictors and improvements. The discovery prediction
    node enables you to evaluate predictions across your data, assess multiple models
    before deploying to production, and visualize aggregated prediction information
    in a dashboard.


    As this book does not cover the machine learning models and predictions of Einstein
    Discovery, the discovery prediction transformation is not covered here in detail.


    # Joining data in recipes


    Use the **Join** node to add columns of data from related objects to existing
    data in a recipe. You might use one of the following join methods, depending on
    how you want to combine your data: *lookup*, *left join*, *right join*, *inner
    join*, or *full outer join*.


    The following screenshot shows an example of how to create an outer join:


    ![](img/06379e43783b9ddfee45e9da5192efe1_108_0.png)


    Figure 4.12 – An example of an outer join in a data recipe'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Perform the following steps to join data in a recipe:


    +   1. Select the **Add Node** button (+) between two nodes or at the end of a
    recipe with at least one input node.

    +   2. Select **Join**.

    +   3. Choose which data to join and select which columns to include.

    +   4. Click on **Next**.

    +   5. Select the desired **Join Type**.

    +   6. Change the **Join Keys** setting as required. Note that the recipe will
    add suggested keys from both sets of input data. You can use multiple keys (a
    maximum of five) to match records if required.

    +   7. Enter a prefix (**API Name Prefix for Right Columns**) for the columns
    coming from the right data source. This will prevent API name conflicts between
    columns in the left and right data sources.

    +   8. Select the columns in the **Columns** tab in the right-hand side panel
    to include in the recipe.

    +   9. Click on **Preview** to preview all of the included columns and their data.

    +   10. If you need to hide columns from the preview, click on the **Hide** button
    (E).

    +   11. Click on **Apply** to add the node to the recipe.

    +   12. **Save** the recipe.


    > **Types of data joins**

    > I have assumed that you have an understanding of the various types of data joins.
    Note that this subject is explained, in detail, in *Chapter 5, Advanced ETL Using
    TCRM Data Prep.*


