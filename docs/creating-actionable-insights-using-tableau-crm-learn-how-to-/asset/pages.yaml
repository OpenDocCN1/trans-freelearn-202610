    This dashboard is conspicuous by what is not present, as are many effective designs.
    As Antoine de Saint-Exupéry said, "You know you’ve achieved perfection, not when
    you have nothing more to add, but when you have nothing to take away."


    A great dashboard will be designed with the intended audience in mind, as you
    will now see.


    # A good dashboard considers the audience


    A good designer will get into their audience''s headspace. A deep and complete
    understanding of your business users and how they will digest and action your
    dashboards is a critical step in the design process. Consider the following:


    +   - How will the dashboard be utilized for next-step actions?

    +   - What information does the reader require to be successful in their day-to-day
    work?'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   - What level of detail does the consumer really need?

    +   - What actions will the business user take, and how will those actions be
    made?

    +   - How will you highlight exceptions or insights that require follow-up?

    +   - What user assumptions and preferences could affect your design choices?

    +   - In the context of the business, what do colors mean and how are they likely
    to be interpreted visually?

    +   - What icons, logos, and so on are familiar in the business environment?

    +   - Remember to use color-blind-friendly color schemes.


