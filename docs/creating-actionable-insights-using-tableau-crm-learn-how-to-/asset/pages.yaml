- pgno: 252
  md: 'We are now going to learn how to create dashboard bindings using both JSON
    and the **user interface (UI)**.


    # Tying things together with bindings


    What are bindings in TCRM? Bindings are used to pass values between steps and
    widgets—that is, parameterizing values for dynamic values and selections. Example
    use cases include the following:


    +   - Dynamic reference lines

    +   - Dynamic groupings

    +   - Dynamic measures

    +   - Dynamic sort

    +   - Dynamic chart types


    There are two types of bindings to consider. First, selection binding is used
    to update a query based on the selection in another query, such as choosing a
    date range via a toggle widget. Second, results binding is used to update a query
    based on the results of another query, such as using a calculated value from a
    case statement to bucket your data.


    TCRM is slowly moving away from requiring code to create bindings, but many use
    cases still require development work in the JSON, as you will see in the following
    section.


    # Bindings in JSON


    We’re now going to talk about JSON. You may be familiar with JSON, but perhaps
    not in the context of TCRM. The following diagram shows how JSON and the TCRM
    dashboard fit together:'
