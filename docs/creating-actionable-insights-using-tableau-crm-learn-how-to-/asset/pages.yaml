    # How do I turn on TCRM in my org?


    If TCRM has not been enabled, you can enable it by going to Setup | Analytics
    | Getting Started, and then switching it on.


    # Do AI and ML come with TCRM?


    Einstein artificial intelligence (AI) in the form of supervised ML is known as
    Einstein Discovery. This comes with Einstein Analytics Plus licenses. However,
    Einstein Discovery is a complex tool that is often misunderstood and easily misused,
    and it is not covered in this book. Stay tuned!


    # Troubleshooting


    In this section, we will quickly go over some problems that you might face when
    getting started with TCRM. These problems might sound simple, but they are a common
    occurrence for people who are getting familiar with the tool.


    # I can''t find my TCRM app or assets


    If you do not see your app on the TCRM Analytics Studio home page, click on the
    All Items option on the far left, under Browse, and you should see your app.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# I can''t get to the TCRM home page from the Salesforce home page


    If you do not see **Analytics Studio** in the **App Launcher** in Salesforce,
    do the following:


    +   1. Click on **View All**.

    +   2. Search for **Analytics**.

    +   3. Click on **Analytics Studio**.


    You will then reach the TCRM home page.


    # Where is the link to reconfigure my TCRM app?


    This link can easily be missed, as the font is very small. Look in the top left-hand
    corner of the browser page, underneath the TCRM logo, and you will see the app
    title. Below the title you will see **Template used: Sales Analytics 5.0**—a **Reconfigure
    app** link is to the right of this phrase, in blue.


    You can also refer to Figure 2.17 to understand exactly where the **Reconfigure
    app** link is located. The new app data flow fails during app creation.


    If the data flow fails, the app creation process will not complete successfully.
    This failure may result in dashboard errors or other unexpected behavior. Do not
    edit the data-flow definition before it has run successfully at least once, or
    the app creation will be abandoned.


    There are three possible causes for a failed data flow in this context, as outlined
    here:


    +   1. **Field availability** or **org configuration**—Resolve this using the
    following steps:

    +      A. Fix the org configuration.

    +      B. Manually start the data flow via **Data Manager**.

    +      C. Click **Reset** in the app after the data flow completes.

    +      D. Complete the reset process without changing any of the options in the
    wizard.


    +   2. **Data Sync**: If **Data Sync** is enabled, the creation of new templated
    apps may fail during data-flow execution because fields or objects used in the
    apps have not yet been replicated. This might also happen because a new version
    of the TCRM app includes additional default fields. Resolve this using the following
    steps:

    +      A. Open **Data Manager**.

    +      B. Go to the **Connect** tab.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   C. Click **Run Now** under the **Sync scheduler**.

    +   D. Click **Reset** in the app after the data flow completes.

    +   E. Complete the reset process without changing any of the options in the wizard.


    3. **App configuration**: If the app configuration is incorrect, the data flow
    can fail—for example, there may be incorrect field references or wrong options
    selected. Resolve this using one of the following steps:


    +   A. Delete the app and create an entirely new version of the app.

    +   B. Reset the app and choose different answers, as appropriate.


    # Summary


    Now that we have completed the journey of creating and personalizing an OOTB TCRM
    analytics app, you should have a good grasp of what an analytics app is and how
    it works. You should have learned that TCRM app templates provide prebuilt data
    flows and dashboards that can be configured to suit the use case as required,
    and you should now be comfortable building and personalizing an app. Also, you
    should have gained a hands-on feel for the TCRM UI, assets, and tools, and should
    be confident in navigating the **Analytics Studio** home page. Finally, you have
    the *Troubleshooting* section as a handy reference tool, should you get stuck.


    Some key takeaways that you should have gained are: first, a TCRM app is a container
    of TCRM assets, in the form of datasets, lenses, stories, and dashboards. Next,
    a TRCM app can be secured. Thirdly, a TCRM app can be shared with others in a
    variety of ways. Then, a TCRM app can be templated and reproduced in another environment.
    Lastly, you can deploy an OOTB TCRM app with standard settings or configure it
    to meet your personalized requirements.


    In the next chapter, you will learn how to extract, connect, combine, transform,
    and register business data in order to create a useful dataset within TCRM.


    # Questions


    Now try answering the following questions to test your knowledge:


    +   - What is a TCRM asset? Give one example.

    +   - How can a TCRM app be shared?

    +   - What is a TCRM lens?

    +   - True or false: A TCRM app is restricted to standard, OOTB settings.'
