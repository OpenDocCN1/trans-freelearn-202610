    Figure 6.3 – Lens admin tools


    The lens admin tools are as follows:


    +   - **Save**: Save the lens to a TCRM app for future use.

    +   - **Create Story**: Create an Einstein Discovery story from the lens.

    +   - **Undo/Redo**: Undoes or redos the latest action.

    +   - **Clip to Designer**: If a dashboard is open in the dashboard editor, the
    lens is clipped, or exported, to the dashboard as a widget.'
