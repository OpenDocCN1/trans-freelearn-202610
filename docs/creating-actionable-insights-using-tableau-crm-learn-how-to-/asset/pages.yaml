  md: '+   - Employ wise layout choices. If a dashboard is well organized from a visual
    perspective, business users will be able to easily find the information they require.
    Therefore, I recommend that you begin with the big picture – key insights and
    call-outs must be quickly visible at a glance.

    +   - Always provide context for your insights. Give your users comparison values.

    +   - Keep things simple.

    +   - Balance functionality with creativity – *effective* does not imply *boring*.

    +   - Supply the user with the level of detail required, and no more. Otherwise,
    an overabundance of detailed information will prove to be a distraction.

    +   - Understand how and where the dashboard will be used. For example, will the
    analytics be consumed on a phone, a tablet, or a PC? Consideration of such factors
