- pgno: 195
  md: 'Now, let''s examine Salesforce sharing inheritance.


    # Deploying Salesforce sharing inheritance


    If you want the sharing setup for your datasets to replicate the ones that are
    applied for your objects by Salesforce, then you can do this by deploying sharing
    inheritance.


    Sharing inheritance reduces or eliminates the need for complex security predicates
    in many cases. On the flip side, applying sharing inheritance results in an increase
    in the time required to process data and create/update datasets – completing data
    syncs, recipe jobs, and more. Keep in mind that the more complicated the sharing
    settings are, the more impact there is on data processing time. Keep in mind that
    the time taken for data processing will have a higher impact if the sharing settings
    are more complicated.


    The Salesforce admin most likely uses a combination of sharing settings to provide
    users with access to Salesforce data about their roles, including sharing based
    on the following:


    +   - Manual sharing rules

    +   - Role hierarchy

    +   - Role

    +   - Group

    +   - Apex-managed sharing

    +   - Team-based sharing


    You may enable sharing inheritance to use the Salesforce sharing settings in Tableau
    CRM, but only for a limited selection of supported objects. When creating or editing
    datasets, be sure to specify the objects to inherit sharing from. The supported
    objects are as follows:


    +   - Account

    +   - Case

    +   - Contact

    +   - Lead

    +   - Opportunity


    To enable sharing inheritance, you need to switch on sharing inheritance. Next,
    select the objects that are to be used as sharing sources. Note that sharing inheritance
    is turned on by default in new Salesforce environments.'
  merge: -1
  img_proc: true
- pgno: 196
  md: "After you turn on sharing inheritance, it is best practice to run the Sharing\
    \ Inheritance Coverage Assessment report on an object, then the users for that\
    \ object, to investigate how well sharing inheritance will work for you. Under\
    \ **Analytics**, from the **Salesforce Setup** menu, select **Sharing Inheritance\
    \ Coverage Assessment**.\n\n> **Note**\n> \n> It is a best practice to test sharing\
    \ inheritance in a sandbox environment before deploying it to production. This\
    \ lets you test use cases against your environment's security model and data to\
    \ be confident that sharing inheritance will work as desired.\n\nTo turn on sharing\
    \ inheritance, follow these steps:\n\n+   1. In the **Setup Quick Find** box,\
    \ enter **Analytics** and click **Settings**.\n+   2. Choose **Inherit sharing\
    \ from under Salesforce** and click **Save**.\n\nIf **Data Sync** is enabled,\
    \ you must turn on sharing inheritance for every object that you will use as a\
    \ sharing source. Follow these steps to do so:\n\n+   1. In Tableau CRM Studio,\
    \ click on **Data Manager**.\n+   2. In **Data Manager**, click on **Connect**.\n\
    +   3. Click on the **dropdown list** on the right end of the row to find the\
    \ object you want to enable.\n+   4. Click on **Row Level Sharing**.\n+   5. Turn\
    \ **Sharing inheritance on**.\n+   6. Click on the **Save** button.\n\nSharing\
    \ inheritance does have some limitations. For example, one challenge is the amount\
    \ of space that is consumed by the sharing rules in a TCRM instance.\n\nOther\
    \ limitations and considerations for Salesforce sharing inheritance are as follows:\n\
    \n+   - It can only be applied if all supported object records have less than\
    \ 400 sharing descriptors each.\n+   - It can impede the performance of queries,\
    \ dataflows, and data prep recipes.\n\nFor detailed, up-to-date technical information\
    \ and specifications, go to `https://help.salesforce.com/s/articleView?id=sf.bi_security_datasets_sharing_about.htm&type=5`."
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Now, let''s examine the most powerful and flexible tool at your disposal: security
    predicates.


    # Understanding the concept and usage of security predicates


    Data visibility in TCRM can be controlled using security predicates. As we mentioned
    earlier, row-level security for a dataset that is defined by a filter condition
    is called a predicate. Predicates can control data visibility based on these scenarios:


    +   - **Role Hierarchy**: In the Salesforce org, predicates can filter the data
    based on the user''s role, but only if they are logged in. A user can only view
    the records that are owned by them or by the people below them in the role hierarchy
    in Salesforce.

    +   - **Manager Hierarchy**: In the User object, predicates can filter the data
    based on the Manager field in the User object. Therefore, the logged-in user may
    view the records that are owned by them, and by any user that reports under them
    in the manager hierarchy.

    +   - **Logged-in User''s Country**: The data can also be filtered based on the
    logged-in user''s country, by the predicates. A user from one country can access
    the records that are owned by the users from the same country.

    +   - **Opportunity Team and Accounts Team**: If data visibility needs to be governed
    depending on the logged-in users being part of the Opportunity Team and Accounts
    Team of the record owner, then predicates can be used for this as well.

    +   - **User Territory**: Predicates can implement row-level security based upon
    User Territory.

    +   - **A Combination of Various Requirements**: Defines a predicate based on
    a combination of these scenarios.


    When defining a security predicate expression, you must use a valid syntax:


    ```

    <dataset column> <operator> <value>

    ```


    Here is an example:


    ```

    ''UserId'' == "$User.Id"

    ```'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Let''s look at each of the components in the preceding example:


    +   - `UserId`: This is the name of the API of the dataset column.

    +   - `==`: This is the operator.

    +   - `$User.Id`: This is the Salesforce User ID for the logged-in user.


    Make sure to note the following points regarding predicate expressions:


    +   - They are case-sensitive.

    +   - They cannot contain more than 5,000 characters.

    +   - Before and after the logical operators, between the operator and the value,
    and between the column and the operator, at least be one space must be present.

    +   - Single quotes must be used to enclose dataset column, such as `OwnerId`.

    +   - The values for the expression can be field values from the User object in
    Salesforce.

    +   - String, number, and multi-value picklist fields are supported by the User
    object.

    +   - Values can be strings or numbers.

    +   - You must possess read access to the relevant User object fields to define
    a predicate for a dataset.


    For example, the following is not a valid expression:


    ```

    `''Revenue''>100`

    ```


    It must contain spaces, as shown here:


    ```

    `''Revenue'' > 100`

    ```


    Here are four examples of security predicates for datasets:


    +   - `Static Filter: ''Product.Family'' == "Phones"`

    +   - `Record Ownership: ''Opportunity.OwnerId'' == "$User.Id"`

    +   - `Role Hierarchy: ''Opportunity.OwnerId'' == "$User.Id" || ''Opportunity.User_Role_Id_Path''
    == "$User.UserRoleId"`

    +   - `Custom: ''Opportunity.OwnerId'' == "$User.Id" || ''Opportunity.User_Role_Id_Path''
    == "$User.UserRoleId" || ''Opportunity.View_All_Settings'' == "$User.View_All__c"`'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Consider these requirements for each value type:


    | Value Type | Requirements | Predicate Expression Examples |

    |---|---|---|

    | string literal | Enclose in double quotes and escape the double quotes. | •
    `''Owner'' == "Amber"`<br>• `''Stage Name'' == "Closed Won"` |

    | number literal | Can be a float or long datatype. Do not enclose in quotes.
    | • `''Expected Revenue'' >= 2000.00`<br>• `''NetLoss'' < -10000` |

    | field value | When referencing a field from the User object, use the `$User[field]`
    syntax. Use the API name for the field.<br><br>You can specify standard or custom
    fields of type string, number, or multivalue picklist.<br><br>When you define
    a predicate for a dataset, you must have read access on all User object fields
    used to create the predicate expression. | • `''Owner.Role'' == "$User.UserRoleId"`<br>•
    `''GroupID'' == "$User.UserGroupId__c"`<br><br>Note: Supported User object field
    value types are string, number, and multivalue picklist. |


    Figure 7.6 – Values in a predicate expression


    If a user tries to query the dataset that a non-valid predicate is applied to,
    an error will appear for the user.


    Now, go into Analytics Studio in your TCRM development organization and follow
    these steps:


    +   1. Open **My First Analytics App** and view your list of datasets.

    +   2. Edit the **Opportunities** dataset by clicking on the drop-down arrow on
    the right-hand side of the list.

    +   3. Delete the existing security predicate (as seen in the code snippet following
    this bulleted list) by clicking on the pencil icon (as shown in the preceding
    table) and deleting the predicate code.

    +   4. **Security predicate** should now be **None**.

    +   5. Edit the predicate and add **New opportunity dataset predicate**.

    +   6. Create a lens for the **Opportunities** dataset and check that the new
    predicate works as you expect. You may need to log out and then log back in for
    the predicates to take effect.

    +   7. Undo your work by editing the dataset and replacing the new predicate with
    the previous one.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The pencil icon that you need to click to edit the predicate is highlighted
    with a bold arrow in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_200_0.png)


    Figure 7.7 – Opportunities dataset showing the existing security predicate


    Here is the existing opportunity dataset predicate:


    ```

    `''Owner.Role.Roles'' == "$User.UserRoleId" || ''OwnerId'' == "$User.Id" || ''Account.OwnerId''
    == "$User.Id"`

    ```


    This predicate ensures that opportunity data is only available for viewing where
    it is permitted based upon the role hierarchy, opportunity ownership, and account
    ownership.


    Here is the new opportunity dataset predicate:


    ```

    `''OwnerId'' == "$User.Id" || ''Account.OwnerId'' == "$User.Id"`

    ```'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'This predicate has removed access based upon the role hierarchy.


    Now, go back and replace the new predicate with the original one.


    For a highly detailed reference on predicates, see the *Tableau CRM Security Implementation
