- pgno: 106
  md: '# Flatten


    This option will flatten ranked data for a hierarchy into two columns. The hierarchy
    nodes column lists all of the ancestors for each node. The hierarchy path column
    contains a string that details the hierarchy path. Please refer to Figure 4.11
    for an example.


    In order to configure the flatten transformation, you must specify the field that
    contains the corresponding parent based on the hierarchy and the field that contains
    every node in the hierarchy. This will then generate one record for each hierarchy
    node, referred to as the child node. Every record contains two generated columns
    that store the hierarchy for each child node. One column contains the ancestors
    for each node in the hierarchy, and the other column contains the hierarchy path.


    The steps required to flatten data are as follows:


    +   1. Select the dimension column that contains all of the child nodes in the
    hierarchy.

    +   2. Click on the **Flatten** button.

    +   3. Enter the **Parent Column** property details.

    +   4. Choose whether or not to **Include child node** in the generated hierarchy
    nodes and path columns.

    +   5. Enter the **Hierarchy Nodes Column Label** property – this is the name
    of the multi-value output column that contains a list of all ancestors in the
    hierarchy, in order from the lowest level to the highest level.

    +   6. Enter the **Hierarchy Path Column Label** property – this is the hierarchical
    path of all ancestors in the hierarchy, in order from the lowest level to the
    highest level, where nodes are separated by forward slashes.

    +   7. Preview the results to ensure that the flattened hierarchy is correct.

    +   8. Click on **Apply** to add the flatten transformation to the recipe.


    Here is an example of a flattened dataset showing how ancestors are stored:'
  merge: -1
  img_proc: true
