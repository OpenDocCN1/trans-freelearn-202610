- pgno: 282
  md: "# XMD – advanced formatting options\n\nXMD is not required anywhere near as\
    \ often as it once was, now that the TCRM GUI gives us much more control over\
    \ formatting and customizations. The Edit Dataset page allows you to customize\
    \ record actions, and Dataset Fields enables you to customize things such as field\
    \ labels and dimension value colors.\n\nHowever, there are still times where advanced\
    \ formatting options require the use of XMD. You can customize the following using\
    \ XMD:\n\n+   - Modify display labels for fields and values.\n+   - Hide fields.\n\
    +   - Format measures.\n+   - Multiply measures by a set amount.\n+   - Customize\
    \ row count measure labels.\n+   - Modify dimension value colors in charts.\n\
    +   - Add actions to dimensions.\n+   - Change the default fields in a values\
    \ table.\n+   - Format query results where multiple datasets are used.\n+   -\
    \ Custom format measures.\n+   - Add suffixes and prefixes to measures.\n+   -\
    \ Define the first day of the week for the calendar year.\n\nThe following code\
    \ shows how to format the Amount field to be in the currency format of $9,999.99:\n\
    \n```\n{\n  \"dataset\": {},\n  \"dates\": [],\n  \"derivedDimensions\": [],\n\
    \  \"derivedMeasures\": [],\n  \"dimensions\": [\n    {\n      \"conditionalFormatting\"\
    : {},\n      \"customActions\": [],\n      \"field\": \"Region\",\n      \"label\"\
    : \"Sales Region\",\n\n```"
