  md: 'This is your starting point with the SAQL content:


    ```

    q = load "opportunity1";

    q_A = filter q by ''Type'' == "New Business" && ''Account.Type'' == "Customer"
    && (!(''Account.Industry'' in ["Agriculture", "Apparel"]) || ''Account.Industry''
    is null);

    q_B = filter q by ''Type'' == "Existing Business" && ''Account.Type'' == "Customer"
    && (!(''Account.Industry'' in ["Agriculture", "Apparel"]) || ''Account.Industry''
    is null);

    result = group q_A by all full, q_B by all;

    result = foreach result generate sum(q_A.''Amount'') as ''A'', sum(q_B.''Amount'')
    as ''B'';

    result = limit result 2000;

    ```


    Notice that you have three data streams in your query: q_A, q_B, and result.


    +   8. Update your code to remove the query limit and union your two columns,
    as follows:


    ```

    q = load "opportunity1";

    q_A = filter q by ''Type'' == "New Business" && ''Account.Type'' == "Customer"
    && (!(''Account.Industry'' in ["Agriculture", "Apparel"]) || ''Account.Industry''
    is null);

    q_B = filter q by ''Type'' == "Existing Business" && ''Account.Type'' == "Customer"
    && (!(''Account.Industry'' in ["Agriculture", "Apparel"]) || ''Account.Industry''
    is null);

    result = group q_A by all full, q_B by all;

    result = foreach result generate sum(q_A.''Amount'') as ''A'', sum(q_B.''Amount'')
    as ''B'';

    final1 = foreach result generate "New Business" as ''Description'', sum(''A'')
    as ''Sum'';

    final2 = foreach result generate "Existing Business" as ''Description'', sum(''B'')
    as ''Sum'';

    final = union final1,final2;

    ```


    The union function combines multiple result sets into one result set. You need
    the same structure and field names in result sets. You do have a choice to either
    use a different dataset or the same dataset when it comes to creating result datasets.'
