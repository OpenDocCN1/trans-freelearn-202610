- pgno: 183
  md: 'Now that you are confident in using TCRM lenses, you need to understand how
    you can clip lenses to a dashboard.


    # Using lenses to create a TCRM analytics dashboard


    Lenses can be used to create a dashboard, or added to an existing dashboard, using
    the **Clip** function. While we are going to look at dashboard building in detail
    later in *Chapter 8, Building Your First TCRM Dashboard*, we will quickly look
    at how to create a simple dashboard and add the two lenses we created earlier.
    Follow these steps:


    +   1. Open the **My First Lens**, **My First Table View**, and **Service Data
    Analysis** lenses.

    +   2. From the TCRM Analytics Studio home page, click on **Create** and select
    **Dashboard**.

    +   3. Select **Blank Dashboard**.

    +   4. For each lens, go to the lens, click on the **Clip to Designer** button
    that has a scissors icon, ensure the lens will be exported as a widget, and click
    on **Clip to Designer**.

    +      Go to the blank dashboard, which is called **New dashboard** by default.
    Save the dashboard as **Lens Clip**.

    +   5. Drag the three clipped lenses – which are now on the right-hand side of
    your dashboard designer as queries – to the design canvas.

    +   6. Play with the lenses by resizing them until you’re happy with the result.

    +   7. **Save** the lens.

    +   8. Click on **Preview** to view your dashboard or choose the **Present** view.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The result might look something like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_184_0.png)


    Figure 6.27 – Lenses clipped to a dashboard


    As we mentioned previously, we will look at designing and building dashboards
    in more detail in Chapter 8, Building Your First TCRM Dashboard.


    Before we close this chapter, I want to share a few tips and hints.


    # Tips and hints


    Let me share a few tips and hints when it comes to working with lenses.


    First, here are a few keyboard shortcuts:


    +   - S: Save (no need to use the dialog box).

    +   - P: Present (full screen) Mode.

    +   - Esc: Exit Present Mode.

    +   - L: Clip to dashboard designer.

    +   - Ctrl + E (Windows)/Cmd + E (macOS): Open JSON Editor.


    Second, you can do some cool stuff with subtotals, totals, and so on in tables
    and pivot tables using some clever SAQL.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Third, it is important to remember that when you modify field labels and colors
    in the **Fields** panel, the changes will be propagated through all the dashboards
    and lenses. Modify them carefully!


    Fourth, the default number of rows in a values table can be changed using the
    **Query Limit** setting, or by using the SAQL limit statement.


    Last, watch the query limit as it can have a serious impact on query results and
    make your numbers look incorrect since the default value is 2,000. This limit
    can also be edited or removed in SAQL.


    # Summary


    As you have seen, lenses are the investigative journalists of TCRM. In this chapter,
    you learned what a lens is, how it is a flexible tool to investigate data, and
    how lenses are the building blocks of analytics dashboards in TCRM.


    Now, you can create, edit, and clone lenses using the familiar lens UI. Finally,
    you understand how to build dashboards using lenses as building blocks.


    The next chapter will teach you how to control who sees what in your lenses and
    dashboards by utilizing TCRM security tools.


    # Questions


    Here are some questions for you to test your knowledge of this chapter''s content:


    +   - What does a lens enable you to do?

    +   - What is the purpose of the Clip command for lenses?

    +   - Name one use of a pivot table.

    +   - How might you use a scatter plot chart? A combo chart? A flat gauge?

    +   - How can you share a lens?

    +   - What is the purpose of Query Mode?

    +   - What are the three uses of a compare table?'
