    The output node writes recipe results to a TCRM dataset or an external system.
    The inputs required are as follows:


    +   - **Write To**: Either to a dataset or a CSV file.

    +   - **Dataset Display Label**.

    +   - **Dataset API Name**.

    +   - **App Location**.'
