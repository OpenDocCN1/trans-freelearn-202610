- pgno: 187
  md: '# 7

    Security in

    Tableau CRM


    How do you decide who sees what in Tableau CRM? This is one of the least understood
    aspects of TCRM development, so in this chapter, you will learn how to secure
    your TCRM data. We will begin by providing an overview of TCRM security. We will
    then walk through each of the tools that TCRM makes available to determine who
    sees what data.


    By the end of this chapter, you will understand the basics of TCRM security. Moving
    on, you will be able to deploy and manage TCRM access permissions. You will understand
    TCRM app-level security and be able to deploy and edit this as required. Furthermore,
    you will be competent in assessing and deploying Salesforce sharing inheritance.
    Finally, you will be confident in building and deploying security predicates.


    In this chapter, we''re going to cover the following main topics:


    +   - What is TCRM security and how does it work?

    +   - Managing TCRM access permissions

    +   - Configuring TCRM app-level security

    +   - Deploying Salesforce sharing inheritance

    +   - Understanding the concept and usage of security predicates'
  merge: -1
  img_proc: true
- pgno: 188
  md: "# # Technical requirements\n\nYou will need the following to successfully execute\
    \ the instructions in this chapter:\n\n+   - The latest version of the Google\
    \ Chrome browser (Chrome is the preferred browser when working with TCRM)\n+ \
    \  - A working email address\n\nEnsure that you're logged into your TCRM development\
    \ organization.\n\nLet's jump right in and gain a high-level understanding of\
    \ TCRM security.\n\n# ## What is TCRM security and how does it work?\n\nControlling\
    \ access to information that is surfaced in Tableau CRM is critical in the broader\
    \ context of data governance and security.\n\n> **Important Note**\n> \n> Once\
    \ a field is visible in TCRM, there is no way that you can prevent someone from\
    \ seeing its data. Anyone who has access to the dataset has access to all fields,\
    \ as opposed to Salesforce, where you have field-level security.\n\nThe TCRM administrator\
    \ has four security tools at his or her disposal:\n\n+   - **Salesforce Data Access:**\
    \ The administrator can configure permissions on Salesforce fields and objects\
    \ to implement field-level and object-level security, which means that access\
    \ to Salesforce data can be controlled. For example, access to sensitive, personal\
    \ information can be restricted at the ingestion level to prevent this data from\
    \ being loaded into TCRM.\n+   - **TCRM App-Level Security:** When you assign\
    \ manager access to users, app owners, and administrators, they will be able to\
    \ govern access to the assets within the app – lenses, datasets, and dashboards.\n\
    +   - **Salesforce Sharing Inheritance:** Sharing inheritance synchronizes with\
    \ the sharing rules that are configured in Salesforce, subject to certain limitations.\
    \ If used, it is prudent to also set a security predicate for situations when\
    \ sharing settings cannot be honored.\n+   - **Security Predicates:** Security\
    \ predicates enable you to apply different types of access controls on datasets\
    \ via a flexible and customizable row-level security capability."
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Here is a visual to help you understand how this all works together:


    ![](img/06379e43783b9ddfee45e9da5192efe1_189_0.png)


    Figure 7.1 – TCRM security overview


    The first TCRM security feature to be discussed is controlling permissions for
    Salesforce data.


    # Managing TCRM access permissions


    To ingest data and use it as a part of row-level security, you must have access
    to Salesforce data. Based on the permissions of the two systems of TCRM/Salesforce
    users, Tableau CRM gains access to Salesforce data. These two systems of TCRM/Salesforce
    users are as follows:


    +   - Integration User

    +   - Security User'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Here is **Integration User**, as viewed in **Setup** in Salesforce:


    ![](img/06379e43783b9ddfee45e9da5192efe1_190_0.png)


    Figure 7.2 – Integration User. Note the user profile; that is, Analytics Cloud
    Integration User


    TCRM uses the permissions of **Integration User** when a data preparation job
    runs so that it can ingest data from Salesforce objects and fields. Access to
    any fields and objects that contain sensitive data should be restricted because
    the **View All Data** access is with **Integration User**.


    The job will fail if the dataflow tries to read data from a field or an object
    where view permission is not given to **Integration User**.


    Based on the User object, if a dataset that has row-level security is queried,
    TCRM will utilize the permissions of **Security User** to read the User object
    and its fields. A few read permissions are required by **Security User** for each
    User object field that is included in a predicate.


    You might be wondering, what is a predicate? When row-level security for a dataset
    is defined by a filter condition, this is known as a predicate. See the *What
    are security predicates and how do you use them?* section for more information.
    By default, **Security User** has read permissions on all the standard fields
    of the User object. If a custom field is utilized by a predicate, you need to
    ensure that **Security User** has read access for the field. An error will be
    triggered if you attempt to query a dataset using a predicate where **Security
    User** does not have read access to all relevant User object fields.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'When setting up permissions for **Security User** or **Integration User**,
    do not modify the original profiles; changes should be always made to a cloned
    version of the user profile by you. To control access to Salesforce data, the
    permissions of **Integration User** on Salesforce fields and objects should be
    configured by you. To facilitate row-level security based on the custom fields
    of User object, the permissions of **Security User** need to be configured as
    well.


    > **Important Note**

    > Never delete **Integration User** or **Security User** because Tableau CRM requires
    these users to access Salesforce data.


    In summary, when the data is ingested and used as row-level security, Tableau
    CRM must have read access to Salesforce data.


    Therefore, you must be sure that the following has happened:


    +   - Permissions of **Integration User** to govern the dataflow''s access to
    Salesforce data have been set up.

    +   - Permissions of **Security User** to facilitate row-level security based
    on the custom fields of the User object have been set up.


    As a practical example, follow these steps in your TCRM development organization:


    +   1. In Salesforce, not TCRM, go into **Setup**.

    +   2. In **Quick Find**, search for **Permission Sets** and click on it.

    +   3. Click **New** to create a new permission set.

    +   4. Choose **Analytics Cloud Integration User** under **License**.

    +   5. Set the name for the permission set to **Test** and click **Save**.

    +   6. Assign app- and object-level permissions to the permission set by selecting
    **Object Settings** and **App Permissions**. Choose a variety of options for this
    exercise.

    +   7. Configure **Apex Class Access**, **Visualforce Page Access**, and **Flow
    Access** permissions for the permission set. Choose a variety of options for this
    exercise.

    +   8. This new permission set is now ready to be assigned to the TCRM **Integration
    User**.

    +   9. Under **Salesforce Setup**, find and select **Profiles**.

    +   10. Select the **Analytics Integration User** profile.

    +   11. Click the **Clone** button to create a cloned copy of the profile.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '+   12. Remove **View All Data** access by deselecting the checkbox.

    +   13. Save the profile as **Test**.

    +   14. Under **Salesforce Setup**, select **Users**.

    +   15. Select **Integration User** from the list (User, Integration).

    +   16. Edit the user and change the profile of the user to the cloned profile,
    **Test**, that we created in *Step 11*.

    +   17. Navigate to the **Permission Set Assignments** section for **Integration
    User**.

    +   18. Assign the newly created permission set in *Step 6*, **Test**, to **Integration
    User**. This enables the TCRM integration user to have access to Salesforce objects
    and other components.


    The next tool to be examined is app-level security.


    # Configuring TCRM app-level security


    As you might remember from what we learned in *Chapter 2, Developing Your First
    OOTB Analytics App in TCRM*, a Tableau CRM app is similar to a folder, enabling
    users to organize their data projects and control the access of datasets, lenses,
    and dashboards, as well as how they’re shared. This functionality of TCRM apps
    makes them a useful security tool to restrict or grant access to assets as required.


    By default, all TCRM users begin with Viewer access to **Shared App**. An administrator
    may modify this setting to open or restrict access. An out-of-the-box app, **My
    Private App**, can be accessed by every user, which is suitable for personal works
    in progress. The contents of a user''s **My Private App** are not visible to administrators,
    but lenses and dashboards can be shared with users.


    Also, by default, all new apps are set to private. Manager access is with the
    administrators and app owner; therefore, they can extend **VIEWER**, **EDITOR**,
    or **MANAGER** access to other roles, groups, or users. The following table shows
    a quick summary of what actions the users can perform with various levels of access:'
  merge: -1
  img_proc: true
- pgno: 193
  md: '|  | A | B | C | D |

    |---|---|---|---|---|

    | 1 | **ACTION** | **VIEWER** | **EDITOR** | **MANAGER** |

    | 2 | View dashboards, lenses, and datasets in the app | × | × | × |

