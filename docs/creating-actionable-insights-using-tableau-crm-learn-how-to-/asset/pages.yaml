    ```

    https://resources.docs.salesforce.com/232/latest/en-us/sfdc/pdf/bi_admin_guide_security.pdf

    ```


    # Summary


    The following diagram provides a useful summary of how security works in Tableau
    CRM:


    ![](img/06379e43783b9ddfee45e9da5192efe1_201_0.png)


    Figure 7.8 – TCRM security review


    As you have seen, you have a variety of options for implementing security in Tableau
    CRM. In this chapter, you learned about these security tools and how to deploy
    them.


    What have you learned? First, you grasped the basics of security in TCRM. Next,
    you learned how to govern TCRM access permissions. Third, you learned how to use
    app-level security to control access to TCRM analytics app assets. Next, you became
    competent in configuring and enabling Salesforce sharing inheritance. Lastly,
    you learned how to build and deploy security predicates for more complex, detailed
    data governance use cases.


    In the next chapter, you will learn to build your very first TCRM dashboard.'
  merge: -1
  img_proc: true
