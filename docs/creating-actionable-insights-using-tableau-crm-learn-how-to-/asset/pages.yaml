- pgno: 117
  md: "# # Diving into data joins\n\nWe looked briefly at joining and augmenting your\
    \ data in *Chapter 4, Building Data Recipes.*\nIn this section, we will dive much\
    \ deeper into this important area of data transformation.\nFirst, let's begin\
    \ by understanding the various types of data joins.\n\n# ## Understanding the\
    \ various types of joins\n\nThere are four common ways to join your data, as seen\
    \ in the following diagram:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_117_0.png)\n\
    \nFigure 5.1 – The four types of Structured Query Language (SQL) data joins\n\n\
    The four types of joins can be understood as follows:\n\n+   - **Left join:**\
    \ A left join includes all rows from the left (recipe) data stream and only adds\
    \ matching rows from the right data stream.\n+   - **Right join:** A right join\
    \ includes all rows from the right data stream and only adds matching rows from\
    \ the left (recipe) data stream.\n+   - **Inner join:** An inner join only includes\
    \ matching rows from the left (recipe) data stream and right data stream.\n+ \
    \  - **Full (outer) join:** A full outer join includes all rows from the left\
    \ (recipe) data stream and right data stream, regardless of whether or not they\
    \ have matches.\n\n> **Note**\n> \n> These joins include all matched rows in the\
    \ target table when multiple rows match."
  merge: -1
  img_proc: true
- pgno: 118
  md: 'When it comes to the Join node in TCRM, there are five types of joins, as seen
    in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_118_0.png)


    Figure 5.2 - The five types of joins in the Join node


    The fifth join type added in TCRM is Lookup. A Lookup join returns all rows from
    the left data stream (recipe data) and only includes matching rows from the right
    data stream (lookup source). If multiple matches are found in the lookup source,
    the lookup join will return either a single row or all matching rows, depending
    upon how you have configured it. The lookup join outputs only one row for each
    row in the left data stream in order to ensure that the grain of the results does
    not change.


    > Considerations when using joins

    > Unlike a lookup, a join creates a separate record for each match in the target
    dataset when multiple rows match. Before using a join, ensure that you understand
    the implications of duplicate rows.


    The type of join used will depend upon the use case involved. Let''s consider
    a practical example for each type of join, as follows.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Lookup join


    A lookup join is perhaps the most common of all TCRM joins. It is used, for example,
    when a dataset contains the **identifier (ID)** of opportunity owners and the
    dataset needs to include relevant details about those individuals, as contained
    in the Salesforce **User** object. The lookup source on the right is the **User**
    object, and the left data stream is the recipe dataset. Any user record that matches
    the user ID in the recipe dataset will return information around the user and
    augment it to the recipe dataset without adding any rows.


    # Left join


    An example of a left join would be when multiple opportunities are associated
    with an account in Salesforce, and the goal is to add a row for each opportunity,
    changing the granularity of the dataset from one row per account to one row per
    opportunity. The left data stream in this case would be the Salesforce **Account**
    object, and the target stream would be the **Opportunity** object.


    # Right join


    A right join can be used, for example, to create a dataset that begins with the
    Salesforce product object and creates a dataset that includes all product family
    records and excludes products that have no parent product family. The left stream
    is the product object, and the target (right) data stream is the product family
    object. This is a "parents without children" use case whereby "orphan" records
    are excluded.


    # Inner join


    An inner join is used to create an intersection or overlap of two data sources,
    where only rows that match both data streams are included. For example, looking
    at the preceding "parents without children" example, an inner join would create
    a dataset that only includes product records with a parent product family and
    product family records with child products. Both parents without children and
    children without parents are excluded. The left stream is the product object,
    and the target (right) data stream is the product family object.


    # Full outer join


    One example of a way in which a full outer join can be used is when you want to
    combine products and product families and include a record for every possible
    combination. You would have a record for each of the following:


    +   - Product records with no parent product family

    +   - Product family records with no child product'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   - Product records with a parent product family

    +   - Product family records with child products


    As you may have guessed, the left stream is the product object, and the target
    (right) data stream is the product family object.


    Now, we will look in more detail at joining Salesforce objects.


    # Joining Salesforce objects – deep dive and practical example


    Please build a fresh new recipe in your demo TCRM environment, as follows:


    +   a. First, we will join the account data to the opportunity data, like this:


    +   1. Create a recipe from the **Opportunity** object using `SFDC_LOCAL` with
    all columns selected.

    +   2. Create a **Join** node.

    +   3. Under **Select Input Data to Join**, select the **Account** object using
    `SFDC_LOCAL` with all columns selected.

    +   4. Under **Join Type**, choose **Lookup**.

    +   5. Under **Join Keys**, select the **Account ID** value for both keys.

    +   6. Under **API Name Prefix for Right Columns**, leave **Account** as the default.

    +   7. For the target lookup fields (with the prefix of **Account**), select only
    these five fields:

    +      - **Account ID**

    +      - **Account Name**

    +      - **Industry**

    +      - **Owner ID**

    +      - **Segment**

    +   8. Click on **Apply**.

    +   9. Save the recipe as **Joining Exercise**.'
  merge: -1
  img_proc: true
