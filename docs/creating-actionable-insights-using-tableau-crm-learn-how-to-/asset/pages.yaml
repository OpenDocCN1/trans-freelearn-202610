- pgno: 69
  md: '# 3


    Connecting Your

    Data Sources


    Now that you are familiar with the **Tableau CRM (TRCM)** user interface and have
    built your very first TRCM analytics app, you are ready to dive deeper into this
    highly capable business intelligence platform. In this chapter, you will learn
    how to ingest data into TRCM from various data sources. The diverse capabilities
    and limitations of TRCM in bringing in data from Salesforce, flat files, data
    warehouses, and other sources will be examined and explained, along with the frameworks
    and tools that enable this process. You will learn how to connect **Salesforce**
    data objects with TCRM and create datasets. You will also be instructed on how
    to bring a flat file into TCRM.


    So, what will you be able to do by the end of this chapter? Well, first, you will
    clearly understand how to bring data into TCRM. Second, you will recognize the
    limitations of TCRM regarding data connections. Third, you will understand how
    to bring Salesforce data into TCRM. And, finally, you will be able to import flat
    file data into TCRM and use it to augment your Salesforce data.


    In this chapter, we are going to cover the following topics:


    +   - The capabilities of TCRM for data connections

    +   - The limitations of TCRM for data connections

    +   - Bringing Salesforce data into TCRM'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - Augmenting your Salesforce data with flat files (CSVs)

    +   - Common questions and challenges


    # Technical requirements


    The following is required to successfully execute the instructions in this chapter:


    +   - A laptop or desktop with internet access (a tablet or a phone is not sufficient).

    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM).

    +   - A working email address.

    +   - Make sure you are logged in to your TCRM dev org, as demonstrated in *Chapter
    2, Developing Your First OOTB Analytics App in TCRM.*


    # The capabilities of TCRM for data connections


    TCRM offers you a great many options regarding the data that you can **extract**,
    **load**, **transform**, and **analyze**. This section will introduce you to the
    framework and tools that Tableau CRM provides for data ingestion and transformation.
    The resulting datasets will drive the lenses and dashboards that give your users
    the business insights they require.


    In Tableau CRM, data connection and integration involve ingesting and preparing
    the Salesforce data and external data you want to visualize and investigate. External
    data is information that lives outside of the Salesforce org that is connected
    to your TCRM environment. This includes data from another Salesforce org, external
    applications, flat files, and other databases. After ingesting, connecting, and
    transforming the data, analytics users can analyze and explore it using TCRM lenses
    and dashboards.


    Data preparation is the process of transforming your data into a form that is
    useful and helpful to the people consuming it. In order for you to understand
    how TCRM performs these operations, first, you must understand what datasets are,
    how they are designed, and how they are built. This will be explained in the following
    section.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Dataset definition, design, and build


    First, what is a dataset? The following diagram provides a succinct definition:


    # What is a Dataset?


    A data repository (storage) similar to file system storage but with a proprietary
    format and Algorithms flattening the data with inverted indexes (for volume and
    speed).


    ![](img/06379e43783b9ddfee45e9da5192efe1_71_0.png)


    Figure 3.1 – What is a dataset?


    A dataset is the building block for your analytics lenses and dashboards; it is
    the fountain of insights. As the old saying goes, garbage in, garbage out, and
    nowhere is this more accurate than in data analytics. As such, a great deal of
    your thought and effort when designing and building TCRM dashboards will be invested
    in the datasets that drive the metrics and visualizations.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'So, how and where does TCRM extract, store, transform, and load data into datasets?
    The following diagram provides an overview of the TCRM data landscape and the
    diverse ways in which to ingest data inside the platform:


    ![](img/06379e43783b9ddfee45e9da5192efe1_72_0.png)


    Figure 3.2 – The Tableau CRM data landscape


    So, what can you learn from *Figure 3.2*? Let''s consider the following points:


    +   - Several data sources are replicated/synced (please refer to the *Data sync*
    section) and brought into TCRM via dataflows and recipes. These include data from
    the primary connected Salesforce org, other Salesforce orgs, marketing cloud,
    and other TCRM connectors.

    +   - Salesforce''s trend report data can be brought directly into TCRM.

    +   - **Flat files** can be augmented to datasets by loading CSV files manually
    into TCRM and combining and transforming them with other data in a dataflow or
    recipe.

    +   - **External Data, ETL tools, and APIs** (such as data lakes, SQL, and Oracle)
    augment datasets in TCRM via their own manual schedule.

    +   - TCRM dataflows take a variety of data sources and combine and transform
    this data with other sources and TCRM datasets. This will be explained in much
    greater detail in *Chapter 4, Building Data Recipes,* and *Chapter 5, Advanced
    ETL Using TCRM Data Prep.*'
  merge: -1
  img_proc: true
- pgno: 73
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - By default, Tableau CRM performs incremental syncs. You can specify whether
    the sync extracts incremental changes or all records from each Salesforce object.
    As discussed earlier, incremental syncs run faster.

    +   - If your TCRM administrator turned on TCRM before the Winter ''20 release,
    you must enable the data sync and connections option to optimize your dataflows
    and connect to external data. Note that data sync is enabled by default if you
    turned on TCRM after Winter ''20.

