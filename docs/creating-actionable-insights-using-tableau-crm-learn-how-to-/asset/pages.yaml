    # # Best practice in TCRM dashboard design


    In the context of building dashboards in TCRM, what constitutes best practice?
    First, let''s consider how best to use TCRM pages.


    # ## Leverage the smart use of pages


    TCRM pages give you an extraordinary amount of design flexibility. Rather than
    creating multiple dashboards and linking between them, thereby hindering performance
    and losing filters, it is often best to leverage the smart use of pages.


    The best way to explain this is by way of an example. In the **Command Center**
    dashboard, multiple pages have been used to allow the user to drill down from
    a high-level, aggregated page to detail pages. The next screenshot shows the top-level
    page, or home page, which is the starting point for the business user:'
