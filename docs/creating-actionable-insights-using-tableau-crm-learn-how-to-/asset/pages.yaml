- pgno: 287
  md: '# # Best Practices in

    # Dashboard Design

    # Using TCRM


    Now that you can build a powerful dashboard in TCRM, how do you know *what* you
    ought to build? What are some common mistakes in dashboard design? What are the
    established principles of effective dashboard design? What are the best practices
    when designing, building, and deploying TCRM dashboards? This chapter explains
    this in detail to guide and inform great dashboard design.


    We''ll cover the following:


    +   - Common mistakes in dashboard design

    +   - Design philosophy for effective dashboard building

    +   - Best practice in TCRM dashboard design'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Technical requirements


    You will need the following to successfully execute the instructions in this chapter:


    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM)

    +   - A working email address


    Be sure to be logged in to your TCRM dev org.


    Let''s begin with understanding common mistakes in dashboard design.


    # Common mistakes in dashboard design


    Here is a list of the most common mistakes that I see when it comes to dashboard
    design:


    +   - Prioritizing form over function – making a dashboard *beautiful* but not
    useful, practical, and actionable.

    +   - An absence of comparisons – not including targets, averages, benchmarks,
    and comparisons to provide business context to metrics.

    +   - Overuse of color – adding a variety and abundance of color for the sake
    of it, and not with a clear purpose in mind.

    +   - Too much of a good thing – adding too many charts and metrics to a page
    so that the user gets lost and confused.

    +   - A lack of storytelling – the viewer is provided with metrics, charts, comparisons,
    and insights in abundance, but there is no clear storyline.

    +   - Clutter – an absence of white space hinders the viewer''s ability to decipher
    and interpret the visualizations presented to them.

    +   - Ignorance of the desired business outcomes – building dashboards for the
    sake of building dashboards without clear business priorities and deliverables
    in mind.

    +   - Use of inappropriate and incorrect visualizations – who wants to try and
    interpret a donut chart with 17 segments?

    +   - Confusing and unintuitive design – the dashboard does not follow any kind
    of intuitive flow.

    +   - Incomplete data – only providing information that tells half the story leaves
    users frustrated and uninformed.

    +   - Use of inappropriate colors – some colors have meaning, like red and green,
    and they can influence how you read the charts.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '+   - Use of inappropriate number formats – showing the same KPIs in numbers
    and percentages can sometimes lead to misunderstandings.

    +   - Each chart/widget should answer a unique and simple question – do not try
    to put all the information in one single chart.

    +   - Forgetting the security aspect – aggregations in dashboards does not mean
    that users can access raw data in the datasets.

    +   - No action framework – every dashboard should tell a story where, at the
    end, the user can take an action.


    How many of these mistakes can you find in the following dashboard?


    ![](img/06379e43783b9ddfee45e9da5192efe1_289_0.png)


    Figure 11.1 – An example of poor dashboard design'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Now that we have identified what *not* to do, let''s learn about a good design
    approach.


    # Design philosophy for effective dashboard building


    I see an awful lot of dashboards in my line of work – most of them are poorly
    designed. Why do I say that? How do I know that to be true? What makes a good
    dashboard design?


    Here are some principles of effective dashboard design.


    # A good dashboard provides actionable insights


    It''s all about taking the user from *data* to *insight* to *action*. A dashboard
    that leaves off the last step is incomplete and ineffective. Let me share three
    examples.


    The first example is the risks insights page from our **Professional Services
    Automation (PSA)** dashboard built on top of FinancialForce. You can see from
    the following screenshot that the risk impact and likelihood matrix (heat map)
    allows you to quickly drill into the project data, and then those insights can
    be actioned from the record view:


    ![](img/06379e43783b9ddfee45e9da5192efe1_290_0.png)


    Figure 11.2 – An actionable risks insights page for professional services automation'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'The second example comes from our donor segmentation analytics built for non-profit
    institutions. The following dashboard allows you to drill into the donor segment
    and choose the appropriate cohort for an appeal:


    ![](img/06379e43783b9ddfee45e9da5192efe1_291_0.png)


    Figure 11.3 – The donor segmentation dashboard


    Once the correct cohort has been selected, you can action the insights by adding
    donor records directly to a Salesforce campaign, as seen here:


    ![](img/06379e43783b9ddfee45e9da5192efe1_291_1.png)


