  md: '# Real-life examples of how to use TCRM


    The best way to communicate how TCRM can be used in a business is by way of four
    real-world case studies. The four case studies that we will go through are as
    follows:


    +   - Out-of-the-box sales analytics

    +   - Student success insights for higher education

    +   - Property development insights

    +   - Marketing attribution analytics


    # Out-of-the-box sales analytics


    A very common and highly effective use case for TCRM is the suite of sales analytics
    standards that are available as a standard template. With some simple configuration,
    you can have powerful insights into your Sales Cloud data within minutes. These
    insights include the following dashboards:


    +   - **Sales Analytics Home**: Provides an overview of high-level **key performance
    indicators (KPIs)**.

    +   - **Leaderboard**: Gives leaders a summary of the team''s and individuals''
    performance, including quota attainment, pipe coverage, bookings, pipe generation,
    closed-won business, average sales cycle time, and sales activities.

    +   - **Trending**: Analyze pipeline changes over time, including the beginning
    and end values of the pipe, as well as what''s moved in and out.

    +   - **Sales Stage Analysis**: Visualizes how deals have moved through stages
    of the sales process, revealing bottlenecks and at-risk opportunities.

    +   - **Whitespace Analysis**: Identifies resell and upsell opportunities.

    +   - **Executive Overview**: Sales executives can review the pipeline''s status,
    the projected closing, and top deals by lead source, plus high-level views of
    sales and service performance.


    You will learn more about this app in *Chapter 3, Connecting Your Data Sources.*'
  merge: -1
  img_proc: true
