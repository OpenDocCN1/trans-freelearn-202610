    \ 0, \\\"visualizationType\\\")).asString()}}\n```\n```\n\nIn the dashboard JSON,\
    \ it might look like this:\n\n```\n```json\n},\n    \"axisMode\": \"multi\",\n\
    \    \"tooltip\": {\n        \"showBinLabel\": true,\n        \"measures\": \"\
    \",\n        \"showPercentage\": true,\n        \"showDimensions\": true,\n  \
    \      \"showMeasures\": true,\n        \"customizeTooltip\": false,\n       \
