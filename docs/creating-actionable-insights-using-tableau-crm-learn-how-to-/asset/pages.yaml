    # Additional functions


    Two additional functions are available—the case function and the coalesce function.


    # The case function


    The case function handles if/then/else logic for formulas. This function can be
    used with TEXT, NUMBER, DATE_ONLY, and DATETIME data. The syntax for the case
    function is shown here:


    ```

    case primary_expr(optional)

    when condition

    then result_expr

    ...

    ```'
