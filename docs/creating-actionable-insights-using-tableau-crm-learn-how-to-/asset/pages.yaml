    In order for you to get hands-on with the TCRM platform, you first need a sandbox
    environment that is yours to edit as you see fit—one that is already enabled for
    TCRM and is populated with sample data. This playground environment is known as
    an Einstein Analytics-enabled Developer Edition org. So, let''s set this up.'
  merge: -1
