- pgno: 344
  md: 'I trust that this book has been a help to you, wherever you may be on your
    TCRM journey. I encourage you to dive into the platform and use it in real-world
    use cases, because the best way to learn is to solve problems, build assets, and
    deliver solutions. Make sure that you get involved in the vibrant TCRM online
    community, and avail yourself of the many great online resources available for
    TCRM.


    Please feel free to reach out to me via LinkedIn with any feedback or questions
    about my book or TCRM in general. I would love to hear from you!


    # Questions


    Answer the following questions to test your learning from this chapter:


    +   - How do embedded dashboards aid user adoption of TCRM?

    +   - Give three examples of configured record actions supported in TCRM.

    +   - What is the purpose of the dashboard filter when embedding a TCRM dashboard
    via the Lightning App Builder?

    +   - Give one example of how you can drive an automation in Salesforce from TCRM.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Questions and Answers


    # Chapter 1


    +   - Define data analytics and what value it offers.

    +   - Name five features listed for TCRM.

    +   - How does TCRM differ from Tableau?

    +   - What are five practical use cases for TCRM?


    Data analytics is gathering, understanding, sharing, and actioning data. It enables
    an organization to gain value from their data and obtain actionable business insights.

    Our goal is to go from data to insight to **action**.


    +   - Native, two-way integration with the Salesforce CRM platform

    +   - On-platform data extraction, combination, and transformation in the data
    manager

    +   - External connectivity to a variety of other platforms and cloud storage
    providers

    +   - Data visualization, analysis, and exploration

    +   - A data action framework to enable decision making based upon insights


    Tableau is used to analyze and visualize data from anywhere; TCRM provides a native
    Salesforce experience and optimizes Salesforce data.


    +   - Sales performance, such as actuals and forecast versus target

    +   - Lead conversion by lead source, region, and team member

    +   - ROI on marketing campaigns

    +   - Case management and service team performance

    +   - Global sales breakdown by region, territory, and country'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Chapter 2


    +   - How does TCRM provide value to your organization or clients?

    +     This is an organization-specific answer.

    +   - Does your organization excel at data analytics? If not, what is preventing
    it from doing so?

    +     This is an organization-specific answer.


    +   - What is a TCRM asset? Give one example.

    +     A TCRM asset is any one of four key items: dashboard, story, lens, or dataset.


    +   - How can a TCRM app be shared?

    +     One of three ways:

    +     - Give access via TCRM.

    +     - Post to a Chatter feed.

    +     - Share via the app URL.


    +   - What is a TCRM lens?

    +     A lens is a self-contained exploration of data; one query with a visualization
    or table.


    +   - True or False – a TCRM app is restricted to standard, OOTB settings.

    +     False.


    +   - What is the purpose of the "Favorites" link on the side menu of the TCRM
    home page?

    +     You can choose to favorite any TCRM asset, such as a dataset or lens, and
    add it to this list for ease of access.


    +   - What do you do if the OOTB TCRM apps don’t meet your requirements, even
    after you have customized them?

    +     TCRM is incredibly flexible and enables the custom development of assets.


    +   - How do you turn on TCRM in a Salesforce environment?

    +     You can enable TCRM by going to Setup | Analytics | Getting Started and
    switching it on.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Chapter 3


    +   - What is meant by data sync?

    +     Data sync refers to the process whereby data is staged for dataflows and
    recipes.

    +   - Name five remote data connections available for TCRM.

    +     - External Salesforce org

    +     - NetSuite

    +     - Marketo

    +     - Google Analytics

    +     - Amazon Redshift

    +   - What is the dataset builder used for – to create a dataset from Salesforce
    data, from external data, or both?

    +     To create a dataset from Salesforce data

    +   - When working in the dataset builder, why is it important to make sure that
    you select any ID fields that will be required for adding object relationships?

    +     It is important to make sure that you select any ID fields that will be
    required to add object relationships to the dataset, otherwise the related objects
    will have no key to link to.

    +   - What common error was given when editing dataset field attributes?

    +     Incorrectly classifying dimensions as measures


    # Chapter 4


    +   - What is a data recipe, and when should you use it?

    +     A TCRM data recipe is used to join multiple datasets into one and to prepare,
    clean, and transform data with smart suggestions, column profiles, and powerful
    transformations. Recipes are perfect for Salesforce administrators or analysts
    with little to no data integration experience who want guidance on how to clean
    data, with the added benefit of previewing transformation results. Recipes are
    also a powerful tool for experienced data ninjas who want to create datasets using
    a no-code, visual interface.

    +   - When would you need to append data in a recipe?

    +     Appending data is used when you need to add rows from one dataset, or multiple
    datasets, to another.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   - What types of dataset joins are available in the recipe editor?

    +     Lookup, left join, right join, inner join, or full outer join

    +   - Where can you find common calculations?

    +     Common calculations have their own function buttons in the Transform toolbar
    – these fill in the formula with the correct column and syntax for you.

    +   - What is one real-world use case for the bucket transformation?

    +     Buckets are a useful tool when you want to create a heat map from two measures.

    +   - Explain the Detect Sentiment transformation.

    +     It is used to determine the sentiment of text, whether positive, negative,
    or neutral, and adds those values to the specified column.

    +   - Fill in the blanks:

    +     You must indicate the field that contains every **field** in the data hierarchy
    and also the field that contains the analogous **node** based on the hierarchy
    in order to compose the Flatten transformation. This will create one record for
    every hierarchy node, which is referred to as the **child** node.

    +     The Split transformation always creates **two** new columns.


    # Chapter 5


    +   - What is the difference between a lookup join, an inner join, and a full
    join?

    +     The following list highlights the key differences between these joins:

    +   - The lookup source on the right is the User object, and the left data stream
    is the recipe dataset. Any user record that matches the user ID in the recipe
    dataset will return information relating to the user and augment it to the recipe
    dataset without adding any rows.

    +   - The inner join is used to create the intersection, or overlap, of two data
    sources, where only rows that match both data streams are included.

    +   - A full join is used when you want to include a record for every combination.

    +   - Give one real-world example of how to use a full join.

    +     You want to combine products and product families and cater to every viable
    combination.

    +   - Why would you need to connect data from external sources with Salesforce
    objects? Give one practical example.'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'You want to connect order data from an external ERP and join it with sales
    data in Salesforce so that you can compare pipelines, done deals, and actuals.


    +   - Explain how to combine aggregation and grouping using two data streams in
    one recipe.


    You can create a number of data streams in the Data Prep flow, perform aggregation
    and roll up in each stream as required, and then rejoin these streams and augment
    the granular data using a join node.


    +   - The option for Multiple Row Formula must be selected to perform window functions
    – what are window functions? When might you use them?


    Window functions are employed in a Data Prep recipe to perform calculations across
    rows, as opposed to across columns. One example use case is to calculate the change
    in opportunity amount over time using the lag function based upon a snapshot date.


    +   - What is the flatten transformation, and what is a use case for this?


    The flatten transformation flattens ranked data for a hierarchy into two columns.
    You can flatten data in preparation for use in security predicates.


    # Chapter 6


    +   - What does a lens enable you to do?


    The following list highlights the various things that can be done with a lens:


    +   - Explore the various characteristics of your dataset, including dimensions,
    measures, field labels, and names.

    +   - Slice and dice data using various measures, dimensions, filters, and formulas.

    +   - Create visualizations and tables that can be clipped to a dashboard.

    +   - Create visualizations and tables that can be shared with other users.


    +   - What is the purpose of the Clip command for lenses?


    If a dashboard is open in the dashboard editor, the lens is clipped, or exported,
    to the dashboard as a widget.


    +   - Name one use of a pivot table.


    Subtotaling and aggregating numeric data, and summarizing data by categories and
    subcategories.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '+   - How might you use a scatter plot chart?


    Demonstration of the relationship between two variables. A combo chart? To visualize
    two measures on one timeline. A flat gauge? Showing progress to a target value.


    +   - How can you share a lens?


    One of five ways:


    +   - Give access.

    +   - Post to a feed.

    +   - Export to Anywhere doc.

    +   - Get a URL.

    +   - Download.


    +   - What is the purpose of Query mode?


    Query mode utilizes SAQL to query your data.


    +   - What are three uses for a compare table?


    The three uses for a compare table are as follows:


    +   - Add calculations and filters to your table.

    +   - Perform arithmetic across the columns and rows.

    +   - Create labels by manipulating string values.


    # Chapter 7


    +   - What is the purpose of app-level security in TCRM?


    It is used to govern access to the assets within the app – lenses, datasets, and
    dashboards.


    +   - How can you control TCRM security from Salesforce object and field access?


    The administrator can configure permissions on Salesforce objects and fields to
    implement object-level and field-level security and therefore control access to
    Salesforce data. TCRM gains access to Salesforce data based upon the permissions
    of two system TCRM/Salesforce users: the Integration user and the Security user.
    Restricting access for these users via security profiles in Salesforce is how
    you can control TCRM security from Salesforce object and field access.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '+   - When a dataflow job runs, TCRM uses the permissions of the **Integration**
    user to extract data from Salesforce objects and fields.

    +   - What are three limitations of Salesforce sharing inheritance?

    +     The following list highlights the limitations:

    +     - It can be applied only if all supported object records have fewer than
    400 sharing descriptors each.

    +     - It can impede the performance of queries, dataflows, and Data Prep recipes.

    +     - In order for an object to appear in the security-sharing source list,
    the primary key of the custom object must be a field in the dataset.

    +   - What are three use case scenarios for security predicates?

    +     You can control data visibility via:

    +     - Role hierarchy

    +     - Manager hierarchy

    +     - User territory

    +   - A security predicate expression must not exceed how many characters?

    +     5,000

    +   - Is this a valid predicate expression? Why, or why not? "Revenue">100

    +     No; there must be at least one space between the dataset column and the
    operator, between the operator and the value, and before and after logical operators.

    +   - A security predicate expression is case-sensitive – True or False?

    +     True


    # Chapter 8


    +   - If you want a colleague to access a particular view of a dashboard and drill
    into the data, how would you share it with them?

    +     Use a sharing URL.

    +   - What is the purpose of the "Copy widget to clipboard" command?

    +     It copies a widget, or several widgets, to the clipboard for pasting anywhere
    on a dashboard.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Chapter 9


    +   - What is the recommended number of default columns for a dashboard?

    +     50

    +   - When you move from one dashboard page to another, do any filters applied
    to the first page remain in place?

    +     Yes

    +   - How could you use the container widget in a dashboard?

    +     The container widget can be used to create a highlights panel that can be
    moved and resized as one item containing a group of widgets.

    +   - What is meant by a top-down dashboard design, and how is it facilitated
    by TCRM pages?

    +     A versatile, top-down design for a dashboard using TCRM pages overcomes
    several obstacles and provides a simple, flexible interface for slicing and dicing
    data.

    +   - The Clone Query command clones the query and opens it for **editing**.

    +   - Give three examples of use cases for using TCRM pages.

    +     Pages can be used to zoom in and out of charts for further analysis, reveal
    greater detail on a hero chart, or facilitate data segmentation.

    +   - When you move from page to page within a dashboard, do the applied filters
    remain, or are they cleared?

    +     They remain.

    +   - When might you need SAQL?

    +     You may use SAQL when you need to do custom calculations, advanced data
    manipulations on the fly, co-grouping (joining) data from different datasets,
    top/bottom lists, in conjunction with binding for dynamic values on charts, and
    so on.

    +   - Keywords and functions are written in uppercase, and they are not case-sensitive.
    True or False?

    +     False

    +   - Where do you edit SAQL?

    +     Every step of a lens is SAQL-based, so it can be edited and/or custom SAQL
    added. These can be viewed in JSON editor mode or copied to a JSON editor of your
    choice.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '+   - What keyboard shortcut do you use to access the dashboard JSON?

    +     *Command or Ctrl + E.*

    +   - Give three examples of use cases for bindings to make a dashboard more interactive
    and dynamic.

    +     - Dynamic reference lines

    +     - Dynamic groupings

    +     - Dynamic measures


