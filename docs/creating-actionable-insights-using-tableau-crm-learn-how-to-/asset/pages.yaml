- pgno: 20
  md: 'Once you have completed this chapter, regardless of your current understanding
    of TCRM, you should have a good initial grasp of the platform. Whether you are
    a business analyst, a Salesforce administrator, or an advanced business user,
    this chapter will help you succinctly communicate the essentials of TCRM to your
    colleagues.


    In this chapter, we are going to cover the following topics:


    +   - The importance of data analytics

    +   - What is TCRM?

    +   - What is TCRM used for?

    +   - How can you excel at data analytics with TCRM?


    # The importance of data analytics


    The timing of this book could not be more appropriate – consider what Gartner
    recently had to say about the impact of COVID-19 upon the world around us:


    > "From crisis to opportunity, the role of data and analytics is expanding and
    becoming more strategic and mission-critical…Massive disruption, crisis, and the
    ensuing economic downturn are forcing companies to respond to previously unimaginable
    demands to resource optimize, reinvent processes and rethink products, business
    models, and even their very purpose. Only resilient, nimble, and creative organizations
    will survive and thrive."


    (https://www.gartner.com/en/doc/718161-top-10-trends-in-data-and-analytics-2020)


    Read that again:


    > "…the role of data and analytics is expanding and becoming more strategic and
    mission-critical…"


    Businesses and organizations must become excellent at data analytics. They must
    excel at gathering, understanding, sharing, and actioning data. The current global
    pandemic has caused widespread uncertainty and unrest and has left many organizations
    in a precarious state. Misgivings about the global economy and fear of ongoing
    illness, as well as the closure of international and domestic borders, have all
    contributed to fragile mindsets and anxious cultures. The economic downturn, digital
    disruption, and growing competition have created an environment where businesses
    and organizations cannot ignore or minimize the value of data and insights. Data
    analytics has become imperative.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'However, in my experience, very few organizations excel at gathering, understanding,
    sharing, and actioning data. Even in those organizations that create and maintain
    functional data analytics, it is estimated that as many as 75% of users do not
    use them regularly. Leaders and team members, as one of our clients once put it,
    are "flying blind." We certainly are not lacking information today. I think that
    most people will agree, though, that we are suffering from *information overload*
    – we are *drowning* in data! Data can be both a blessing and a curse – a help
    and a hindrance. After years of working in the data analytics industry and speaking
    with many businesses and organizations, it has become apparent to me that the
    subject of data insights is a frustrating one for many. What should be a great
    boon for the organization is, in fact, a burden.


    TCRM has the power to change all this – if it’s well understood, correctly implemented,
    and rightly used.


    One such example is that of our client. 18 months ago, they were drowning in data
    but starving for insights. UA had terabytes of information spread across multiple
    systems and clouds, and actionable insights were very difficult to obtain. For
    a data-driven organization such as UNICEF, this was a source of great frustration.
    However, with the expertise of their internal team, the power of TCRM, and the
    help of our analytics experts and Visioneer360, the situation was drastically
    turned around. It can be done!


    The key to going from data to insight to action is data analytics.


    Data, in its raw, unprocessed form, contains the ingredients of a story – ingredients
    that are not of much use if they’re not combined into a data "recipe" to create
    a story.


    What do I mean by a **data story**? A data story is when information is processed
    and presented in such a way that it recites a narrative about a situation and
    draws meaningful conclusions for the reader. There are a plethora of diverse mediums
    and tools by which data stories can be presented, but the result of a story is
    actionable insight. I often express this in my three-word mantra:


    ![](img/06379e43783b9ddfee45e9da5192efe1_21_0.png)


    Figure 1.1 – The three-word mantra


    Organizations do not lack data – they lack insights into that data, and they are
    largely unable to obtain the true value for their data.


    Every organization has data. Some organizations have insights into their data.
    Very few organizations action data insights.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'The challenge, then, is data analytics. This is where TCRM comes in – it has
    the potential to *transform data, visualize insights,* and *enable action.*


    Perhaps my story will provide some context and insight here. As a self-taught
    Salesforce business analyst, responsible for implementing and customizing Financial
    Services Cloud at a financial planning business, I was fortunate to work with
    a data-driven team and leadership. One of the primary drivers for implementing
    Salesforce was the vision for actionable business insights. This journey involved
    data remediation, cultural change, and analytics builds, among other things. Once
    the Salesforce Reports and Dashboards were up and running and were being used
    by the team members and leadership, the power of data insights began to be realized.
    However, the CEO wanted to take this to the next level and run their weekly management
    meetings only from Salesforce reports – no more slides and spreadsheets!


    This ambitious goal required extending my skills into more advanced reporting
    tools, so we settled on purchasing TCRM licenses. It took some time to learn the
    tool and build useful dashboards, but the result was impressive. The TCRM dashboards
    were shared during the weekly management meetings, and the attendees were able
    to drill into the data and make business decisions based on live information.
    It was a game-changer, and I was personally hooked on the power, versatility,
    and actionability of TCRM.


    What, then, do you need to gain value from your data, to obtain actionable business
    insights? Broadly speaking, there are five requirements:


    +   - The right data, of a sufficient quality

    +   - Clearly defined business goals

    +   - A capable data analytics tool

    +   - Skilled individuals to create the data stories

    +   - Organizational commitment to consume, action, and improve the insights


    As a brief aside, no one has perfect data, of course, and one advantage of data
    analytics is its ability to evaluate data quality and plan remediation. However,
    there is a point where poor data quality and completeness will hinder the usefulness
    of analytics dashboards to the point where time is better spent on remediation
    rather than analysis.


    Now that we have an understanding of the importance of data analytics, we are
    going to dive into the subject of this book – TCRM. Why, then, was TCRM formerly
    known as Einstein Analytics?'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# What is TCRM and what is it used for?


    By the end of this section, you should have a good grasp of what we are referring
    to when we speak of TCRM, and how it is used in the real world.


    The questions *what is TCRM?* and *what is it is used for?* will be answered in
    the following sub-sections.


    # What is TCRM?


    TCRM is not a Salesforce app – TCRM is a data analysis and business insights platform
    with integrated machine learning insights from Einstein Discovery.


    To expand upon the high-level summary shown in Figure 7.1, TCRM is a platform
    that combines the following features:


    +   - Native, two-way integration with the Salesforce CRM platform.

    +   - On-platform data extraction, combination, and transformation in the data
    manager.

    +   - External connectivity to a variety of other platforms and cloud storage
    providers.

    +   - Data visualization, analysis, and exploration.

    +   - A data action framework to enable decision-making based on insights.

    +   - Embedded intelligence from the Salesforce Einstein platform, such as Einstein
    Sentiment analysis.

    +   - Insights can be shared in various ways, such as Salesforce Chatter, URL
    generation, and downloads.

    +   - On-dashboard notifications to alert users when certain criteria are met.

    +   - A mobile TRCM Analytics App.

    +   - TCRM/Einstein Analytics APIs and SDKs.

    +   - Various data security tools to mask incoming data and restrict/filter outgoing
    insights as required.


    At a technical level, as far as architecture goes, here are some details:


    +   - In TCRM, data is searched for using an inverted index that enables fast
    query results – datasets containing up to a billion rows can be queried in seconds.

    +   - TCRM data is loaded into a non-relational store via a dynamic, horizontally
    scalable key-value pair approach.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# What Is Tableau CRM and Where Can You Use It?


    +   - The TCRM workflow engine is a software application that is designed to help
    users enforce a series of recurring tasks that make up a "business process" or
    "workflow." It applies limited transformations upon data ingestion but largely
    stores information in its original form.

    +   - Data is consumed and stored in a non-relational inverted index as key-value
    pairs. These key-value pairs only store non-null data values, which improves efficiency
    and speed.

    +   - TCRM''s query engine employs techniques such as vector encoding, differential
    encoding, and incremental encoding to compress data and perform efficient and
    faster queries on compressed data.

    +   - Quantitative data is queried in a columnar store in RAM across Salesforce''s
    cloud.

    +   - TCRM provides Einstein Analytics Actions, which allow you to seamlessly
    go from question to answer to action without logging into a separate solution
    – such as creating a task, updating a record, creating a case, posting to Chatter,
    and more!

    +   - Heavy compression, optimization algorithms, and parallel processing fast
    and efficient queries on very large datasets.

    +   - Mobile-first design – TCRM enables data creation, analysis, and action directly
    from mobile devices.

    +   - Einstein Analytics is an open, scalable, and extensible platform. Being
    built on the secure infrastructure of Salesforce, the world''s top CRM, TCRM provides
    easy-to-use APIs that enable deep relationships with other tools and platforms.

    +   - Salesforce has worked with Informatica, MuleSoft, Snowflake, and other vendors
    to build interfaces with BI and data solutions out of the box.

    +   - TCRM delivers fast-rendering graphics that connect the relationships between
    views of data by drawing SVG graphics within the browser and using an animation
    engine faceting and filtering. This demands fewer resources from the user''s device
    or the server.

    +   - The TCRM platform is built upon Salesforce''s trusted, multilayered approach
    to data availability, privacy, and security.'
  merge: -1
  img_proc: true
