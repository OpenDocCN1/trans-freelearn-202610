- pgno: 41
  md: '# Developing Your First OOTB Analytics App in TCRM


    What is a **Tableau Customer Relationship Management (TCRM)** analytics app? TCRM
    provides a variety of **out-of-the-box (OOTB)** analytics applications that get
    you started with data analytics for a variety of generic and industry-specific
    use cases, such as sales analytics or wealth management analytics. These apps
    provide prebuilt data flows and dashboards that can be configured to suit the
    use case and available data. OOTB apps are a great place to begin using and customizing
    TCRM analytics, and to get a feel for the TCRM **user interface (UI)**, assets,
    and tools.


    You have to walk before you can run. We are going to begin right at the start—setting
    up a trial TCRM **organization (org)**, getting to know the TCRM environment,
    and learning basic asset definitions. We will then dive in and get our feet wet
    by creating and customizing our very first TCRM analytics app.


    By the end of this chapter, you should have a detailed understanding of what an
    OOTB analytics app is in TCRM and be able to create and customize one in a **development
    (dev)** org. You should also be able to navigate the TCRM UI and use basic TCRM
    tools. In addition, the goal is to understand and appreciate the various TCRM
    assets, such as **lenses and stories**. We will also address some common questions
    and challenges in this process.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'In this chapter, we will cover the following topics:


    +   - Getting hands-on with your own TCRM environment

    +   - What is a TCRM analytics app?

    +   - Installing and configuring a TCRM analytics app

    +   - Customizing a TCRM analytics app

    +   - Common questions answered

    +   - Troubleshooting


    # Technical requirements


    You will need the following to successfully execute the instructions in this chapter:


    +   - A laptop or desktop with internet access (a tablet or a phone is not sufficient)

    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM)

    +   - A working email address

    +   - Link to TCRM dev org:


    ```

    https://developer.salesforce.com/promotions/orgs/analytics-de

    ```


