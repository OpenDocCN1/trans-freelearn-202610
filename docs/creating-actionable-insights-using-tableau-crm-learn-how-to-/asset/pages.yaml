- pgno: 261
  md: 'Let''s look at one simple example of a JSON binding—a dynamic grouping. This
    example comes from the publicly available *Learning Adventure* app, which I refer
    to at the end of this section. Follow these steps:


    +   1. Create a new blank dashboard.

    +   2. Create a toggle widget (`pillbox_1`) with a step (`Grouping_Toggle_1`)
    that specifies different groupings.

    +   3. Create a bar chart (`chart_1`) with a step (`Dynamic_Query`) in a compact
    form that groups the total amount by the selected grouping in the toggle widget.

    +   4. In the Spring 2018 release, a new `columnMap` chart property was introduced
    to build more powerful visualizations; however, `columnMap` is not necessary for
    this dynamic visualization. Replace this `columnMap {}` parameter with `columnMap:
    null`.

    +   5. To dynamically set the grouping in the chart based on the selection in
    the toggle widget, open the dashboard JSON and bind the groups property in the
    Dynamic_Query step—see the code snippet following this list of steps.

    +   6. Click **Done** and you''re ready to go.


    Here is the JSON used to bind the groups property in the Dynamic_Query step:


    ```

    ```json

    "groups": "{{ cell(Grouping_Toggle_1.selection, 0, \"groups\").asObject() }}"

    ```

    ```


    What does this code mean? Let''s break it down, as follows:


    +   - `cell(Grouping_Toggle_1.selection, 0, \"groups\")` returns the selected
    grouping from the Grouping_Toggle_1 step and gets the value from `cell` (first
    row, "groups" column) in the step selection. Index 0 is the first row, index 1
    is the second row, and so on.

    +   - `asObject()` formats the results as an array of strings, which is the expected
    format in dashboard JSON.'
  merge: -1
  img_proc: true
