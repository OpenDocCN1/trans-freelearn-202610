- pgno: 219
  md: 'Now that you have built your first complete dashboard page, you are going to
    learn more about the detailed options available to you.


    # The devil is in the details


    In this section, you will learn about the detailed options available for editing
    your dashboard.


    While in your new dashboard, check out the query panel and the options available
    there. You can see an overview of this in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_219_0.png)


    You have five actions available for each query from the panel, outlined as follows:


    +   - **Edit**: Opens the query for editing and formatting.

    +   - **Clone**: Creates a copy of the query and opens it in **Edit** mode.

    +   - **Properties**: Gives access to query configuration options such as faceting,
    selection type, and initial selections. More detail will follow in this section.

    +   - **Delete**: Deletes the query from the dashboard.

    +   - **Preview**: Opens a preview window in a values table format.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Regarding the query properties, here is some more detail:


    +   - **Display label**: The user-facing query label can be edited here.

    +   - **Apply global filters**: Uncheck if you do not want the dashboard global
    filters to apply to this query and the widgets that it drives.

    +   - **Faceting**: You have four options here—**All**, **Include**, **Exclude**,
    and **None**. The default value of **All** means that selecting values on other
    widgets will apply those faceting values to this query and the widgets that it
    drives, as in standard dashboard behavior. This default behavior can be modified
    by selecting **Include** (choose which specific queries to include as faceting
    values for this query), **Exclude** (choose which specific queries to exclude
    as faceting values for this query), or **None** (no faceting will apply to this
    query).

    +   - **Selection Type**: Choose which type of selection will apply when a user
    clicks on a widget selection: **None**, **Single Selection**, **Multiple Selection**,
    **Single Selection (required)**, and **Multiple Selection (required)**.

    +   - **Broadcast selections as facets**: You can turn off the default faceting
    behavior by unchecking this, meaning that making selections on this query will
    not facet other queries.

    +   - **Initial selections**: Shows the initial selections that have been configured
    for this dashboard.


    These query actions and properties give you great flexibility in dashboard design.
    Now, let''s look at the powerful functionality of dashboard pages.


    # Understanding the top-down design with pages


    From a business user perspective, it is inconvenient to have to constantly move
    from dashboard to dashboard when investigating and analyzing data. Also, filters
    applied to one TCRM dashboard are not carried over to another dashboard. A versatile,
    top-down design for dashboards using TCRM pages overcomes these obstacles and
    provides a simple, flexible interface for slicing and dicing data.


    The best way to understand the pages functionality is to apply it to a dashboard,
    so edit your **My First Dashboard** dashboard, and follow these steps:


    +   1. Open the **user interface (UI)** for TCRM pages by clicking on the drop-down
    arrow next to **Untitled**, to the right of **Default**.

    +   2. Click on **Rename** and rename the existing page **Sales**.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   3. You could click on + to add a new blank page, but we want to carry across
    the highlights panel, so select the drop-down arrow and then select Clone. A new
    page appears, named Clone of Sales.

    +   4. Rename the new page Marketing.


    Here is the UI for TCRM pages:


    ![](img/06379e43783b9ddfee45e9da5192efe1_221_0.png)


    Figure 8.9 – The TCRM pages UI


    Now, go ahead and build out the new page, as follows:


    +   1. Delete every widget except for the highlights panel; you can select multiple
    widgets by holding down Cmd (Mac) or Ctrl (Windows) while selecting each with
    a mouse click. Don’t worry—they won’t be removed from the Sales page!

    +   2. Remove widgets on the highlights panel except for the logo and title. You
    will be asked: Delete widget and global filter?. Click on Delete Widget Only,
    as you do not want to delete the global filters.

    +   3. Click on the title text widget. Notice on the Widget panel on the right
    that there is a message: This widget exists on multiple pages. Changes here apply
    to instances on other pages, unless you unlink it.. This is important—if you modify
    this widget, it will modify all other copies of this widget.

    +   4. Click on Unlink.

    +   5. Change the title to Marketing Insights.

    +   6. Resize the title text widget so that the text appears correctly.

    +   7. Save your dashboard and close it.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Before we can flesh out the **Marketing** page, we first need to create a dataset
    called **Leads**, based upon the Salesforce **Lead** object. Using your knowledge
    from previous chapters, go ahead and do so. We want to keep things simple for
    now, so just use **Lead object data** and choose the following fields:


    +   - **Annual Revenue**

    +   - **City**

    +   - **Company**

    +   - **Converted**

    +   - **Converted Date**

    +   - **Country**

    +   - **Created Date**

    +   - **Email**

    +   - **Employees**

    +   - **Full Name**

    +   - **Industry**

    +   - **Lead Source**

    +   - **Phone**

    +   - **State/Province**

    +   - **Status**


    Go ahead and click **Create Dataset**. Review the monitor in **Data Manager**
    and proceed once the new **Leads** dataset has been created. First, you need to
    add a page navigator widget so that you can move easily between pages when in
    **Preview** mode. To do so, follow these steps:


