- pgno: 86
  md: '> **Note**

    > One common error when editing dataset field attributes is incorrectly classifying
    dimensions as measures. For example, a zip/postal code will often be set as a
    measure by default, but this field is used for grouping, not mathematical calculations,
    so it needs to be changed to a dimension.


    The process of combining CSV datasets with Salesforce and external data is performed
    in one of the places, all of which will be covered later in this book:


    +   - In a data recipe – please refer to *Chapter 4, Building Data Recipes (the
    Cooking up data recipes in TCRM section)* and *Chapter 5, Advanced ETL Using TCRM
    Data Prep*.

    +   - Within a lens – please refer to *Chapter 6, TCRM Lenses – Diving Into Your
    Data One Click At A Time (the Creating, editing, and cloning lenses section)*.

    +   - Within a query in the dashboard editor – please refer to *Chapter 9, Advanced
    Dashboard Design and Build (SAQL)*.


    # Common questions and challenges


    Here are some common questions and challenges that you might encounter when creating
    a dataset from Salesforce or CSV data:


    +   - *If I make a mistake in the dataset builder, can I reopen it and make corrections?*
    No, you cannot reopen the dataset builder once you have chosen to create the dataset.
    Changes will then need to be made in the data prep tool.

    +   - *I made an error in editing the field attributes when uploading a CSV file,
    and now I want to make changes – how do I do that?* You must make such changes
    in the TCRM data prep tool; you cannot return to the field attribute editing dialog
    box.

    +   - *When augmenting a Salesforce object in the dataset builder, what if I need
    to make an inner or outer join, as opposed to a simple lookup or left join?* This
    cannot be performed in the dataset builder; it must be done in a data recipe or
    in the dataflow builder.

    +   - *I have augmented CSV data to a dataset, but I need to update that CSV data.
    What can I do?* For example, the CSV file contains sales targets, and these have
    changed. The solution here is to edit the dataset, click on **Replace Data**,
    and upload the updated CSV. Be careful to keep the same field mappings and settings.

    +   - *I created a dataset from Salesforce data using the dataset builder, but
    now the data model and structure in Salesforce have changed. What should I do?*
    In this case, you have two options: either recreate the dataset from scratch using
    the dataset builder or edit the existing dataset in the TCRM data prep tool.'
  merge: -1
  img_proc: true
