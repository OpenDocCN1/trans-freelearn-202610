    +   - Opportunity records owned by **Sales Rep 1** and **Sales Rep 2** are accessible
    by **Regional Manager 1** and the roles shown in the preceding diagram.

    +   - Opportunity records owned by **Sales Rep 3** are accessible to **Regional
