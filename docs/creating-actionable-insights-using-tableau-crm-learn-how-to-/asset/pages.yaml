    # Edit attributes


    Use this transformation to change the column names and value formats. For example,
    you can edit the following:


    +   - **Label**

    +   - **API Name**

    +   - **Length**

    +   - **Precision**

    +   - **Scale**


    # Drop columns


    Drop unwanted input columns from the recipe. This will leave you with a subset
    of columns to use in transformations and include in the final dataset. For example,
    you can drop input columns used for a calculated column.


    # Detect sentiment


    This transformation is used to determine the sentiment of text, whether positive,
    negative, or neutral, and adds those values to the specified column.


    If Einstein cannot determine the sentiment of a field, the sentiment is set to
    null.'
