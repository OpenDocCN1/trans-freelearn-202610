- pgno: 89
  md: '# 4

    Building Data Recipes


    Now that you are confident an how to create an **Out-of-the-box analytics app**
    template, it is time to learn how to build **custom analytics apps**, beginning
    with **data transformation**. In this chapter, the process of creating a data
    recipe in **TCRM** will be defined and explained. Beginning with the dataset created
    in *Chapter 3, Connecting Your Data Sources*, you will learn how to apply **filters**,
    **joins**, **calculations**, **transformations**, and more to that data.


    So, what will you be able to do by the end of this chapter? Well, first, you will
    clearly understand how to create a data recipe in TCRM. Second, you will be familiar
    and comfortable with the data recipe UI. Third, you will be able to transform
    data inside recipes using functionalities such as **buckets**, **aggregation**,
    and **calculations**. Fourth, you will have learned how to join and append datasets,
    including how to use the various join types, such as **lookup** and **inner join**.
    And, finally, you will be confident in outputting data from recipes as a *CSV*
    or *TCRM* dataset.


    In this chapter, we will cover the following topics:


    +   - Cooking up data recipes in TCRM

    +   - Transforming data in recipes'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - Joining data in recipes

    +   - A hands-on exercise in data transformation


    # Technical requirements


    The following is required to successfully execute the instructions in this chapter:


    +   - A laptop or desktop with internet access (a tablet or a phone is not sufficient).

    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM).

    +   - A working email address.

    +   - Make sure you are logged in to your TCRM dev org.


    # Cooking up data recipes in TCRM


    In this section, we will explain what a data recipe is, when and why you should
    use one, and how to create your first simple recipe.


    # What is a data recipe?


    A TCRM data recipe is used to join multiple datasets into one and to prepare,
    clean, and transform data with *smart suggestions*, *column profiles*, and *powerful
    transformations*.


    Recipes are perfect for Salesforce administrators and analysts with little to
    no data integration experience who want guidance on how to clean data, with the
    added benefit of previewing the transformation results. Additionally, recipes
    are a powerful tool for experienced data ninjas who want to create datasets using
    a no-code, visual interface.


    A data recipe enables you to do the following:


    +   - Preview data and see how it changes as you apply transformations.

    +   - Remove columns or change column labels easily and quickly.

    +   - Use column profiles to analyze the quality and makeup of your data.

    +   - Improve and transform your data with intelligent suggestions.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   - Bucket values without having to write code (**SAQL**, or **Salesforce
    Analytics Query Language**).

    +   - Transform data quickly using calculated columns with the visual formula
    builder.

    +   - Quickly and easily transform values to ensure data consistency with a point-and-click
    interface. For example, you can replace, split, and trim values without a formula.

    +   - View the history of all the changes, and back up or move forward to replay
    it.

    +   - Easily apply various joins, such as inner and outer joins, using the intuitive
    visual interface.


    This chapter introduces you to the data recipe builder. *Chapter 5, Advanced ETL
    Using TCRM Data Prep*, will guide you on how to use the TCRM platform for more
    advanced data preparation.


    > **Important Note**

    > The relatively new visual data preparation tool in TCRM, known colloquially
    as **Data Prep 3.0**, is identical to the data recipe builder. The detailed explanations
    and instructions provided in this chapter also cover this new tool, referred to
    simply as data prep.


    # How do you create a data recipe?


    Now, I am going to show you how to create a simple recipe. Let''s begin with the
    dataset you created earlier, **MyFirstDataset**. Execute the following steps to
    get started:


    +   1. Navigate to **Data Manager** from the Analytics Studio and select **Dataflows
    & Recipes** from the left-hand side menu.

    +   2. Click on the **Recipes** tab.

    +   3. Click on **Create Recipe**. A new browser tab will open.

    +   4. Click on the **Select Data** button. This will open up a dialog box, called
    **Select Input Data**.'
  merge: -1
  img_proc: true
