    | 7 | Rename the app |  |  | × |

    | 8 | Update asset visibility in an app |  | × | × |

    | 9 | Delete the app |  |  | × |


    Figure 7.3 – What can users do with VIEWER, EDITOR, and MANAGER access?


    To grant access to a TCRM user, you simply need to click on the **Share** button
    at the top right-hand corner of the page when viewing the app. This brings up
    the following dialog box, where you can grant access as required and then **Save**:


    ![](img/06379e43783b9ddfee45e9da5192efe1_193_0.png)


    Figure 7.4 – Granting access to an analytics app using the Share button'
  merge: -1
