    \nNow, we will look at some use cases where it is necessary to code in SAQL.\n\
    \n# SAQL expressions\n\nSAQL is used where queries require additional complexity\
    \ or customizability beyond what can be delivered in the GUI.\n\n# Union\n\nCombining\
    \ various data streams and manipulating in one query requires the use of SAQL.\n\
    \nHere is an example of calculating spending as a percentage of a target (in JSON\
    \ format):\n\n```\n\"steps\": {\n    \"Spending_as__of_Tar_1\": {\n        \"\
    broadcastFacet\": true,\n        \"groups\": [],\n        \"label\": \"Spending\
    \ as % of Target\",\n        \"numbers\": [],\n        \"query\": \"spend = load\
    \ \\\"bankingData\\\";\\nspend = group spend by ('Date_Year', 'Date_Month');\\\
    nspend = filter spend by date('Date_Year', 'Date_Month', 'Date_Day') in [\\\"\
    30 days ago\\\"..\\\"current day\\\"];\\nspend = foreach spend generate 'Date_Year'\
    \ + \\\"~~~\\\" + 'Date_Month' as 'Date_Year~~~Date_Month', sum('Amount') as 'sum_Amount',\
    \ 0 as 'sum_Target';\\n\\ntarget = load \\\"Industry_Targets\\\";\\ntarget = group\
    \ target by ('Date_Year', 'Date_Month');\\ntarget = filter target by date('Date_Year',\
    \ 'Date_Month', 'Date_Day') in [\\\"30 days ago\\\"..\\\"current day\\\"];\\ntarget\
    \ = foreach target generate 'Date_Year' + \\\"~~~\\\" + 'Date_Month' as 'Date_Year~~~Date_Month',\
    \ sum('Target') as 'sum_Target', 0 as 'sum_Amount';\\n\\nboth = union spend, target;\\\
    nboth = group both by all;\\nboth = foreach both generate sum('sum_Target') as\
    \ 'Target', sum('sum_Amount') as 'Spend';\\nboth = foreach both generate sum('Target')\
    \ as 'Target', sum('Spend') as 'Spend', 100*(trunc(('Spend'/'Target'),3)) as '%\
