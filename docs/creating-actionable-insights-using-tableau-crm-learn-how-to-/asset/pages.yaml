- pgno: 156
  md: 'In this chapter, we will cover the following topics:


    +   - Lenses – the investigative journalists of TCRM

    +   - Creating, editing, and cloning lenses

    +   - Using lenses to create a TCRM analytics dashboard

    +   - Tips and hints


    # Technical requirements


    You will need the following to successfully execute the instructions in this chapter:


    +   - A laptop or desktop with internet access (a tablet or phone is not sufficient)

    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM)

    +   - A working email address


    Ensure that you''re logged into your TCRM dev org.


    # Lenses – the investigative journalists of TCRM


    What exactly is a lens? Think of a lens as your data exploration tool in Tableau
    CRM, combining a data query with a visualization in a simple, powerful, and dynamic
    interface.


    A lens enables you to perform the following tasks:


    +   - Explore the various characteristics of your dataset, including dimensions,
    measures, field labels, and names.

    +   - Slice and dice data using various measures, dimensions, filters, and formulas.

    +   - Create visualizations and tables that can be clipped to a dashboard.

    +   - Create visualizations and tables that can be shared with other users.


    In the next section, you are going to get your hands dirty in TCRM and work with
    lenses.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# # Creating, editing, and cloning lenses


    Now that you understand what a lens is and what it is used for, you are going
    to build and edit a lens in TCRM. Before you get started, here is what the lens
    UI looks like, with a few key components labeled for reference:


    ![](img/06379e43783b9ddfee45e9da5192efe1_157_0.png)


    Figure 6.1 – The TCRM lens UI


    You will now learn how to work with lenses in Chart Mode.


    # ## Working with Chart Mode


    Open Analytics Studio and follow these steps:


    +   1. Select **MyFirstDataset** from the **All Items** list. This will bring
    you to the lens UI, which will open in the default Chart Mode.

    +   2. On the left-hand side of your screen, use the drop-down list to choose
    **Sum of Amount** for **Bar Length**.

    +   3. Choose **OwnerId.Name** for **Bars**.

    +   4. Click on the drop-down arrow next to **Sum of Amount** and select **Sort
    Descending**.

    +   5. On the far right-hand side of your screen, click on the **Formatting**
    icon, which looks like a paintbrush.

    +   6. Add a title in the **Title** box called **My First Lens**.

    +   7. Save your lens by clicking on the **Save** button, name it **My First Lens**,
    and save it as **My First Analytics App**.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Congratulations! You have created your first lens in TCRM. The result should
