    # Why, when, and how to use complex formula transformations


    In preparing your datasets for analysis, visualization, or modeling, you will
    need to incorporate logic and calculations that reflect business rules and requirements,
    and this often becomes complex. In that case, buckets and other simple functions
    are no longer up to the task, and you need to employ complex formula transformations.


    You will now be given a walkthrough of explanations and use cases for these complex
    transformations.'
