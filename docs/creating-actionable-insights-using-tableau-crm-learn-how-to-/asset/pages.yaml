    Figure 5.9 – Basic arithmetic operations in the Aggregate node


    Here are some examples of use cases for basic arithmetic operations in the **Aggregate**
    node:


    +   - Use **Average** to calculate the average age of closed/won opportunities
    to determine how long it takes to close deals, and group by industry to compare
    and benchmark.

    +   - Use **Maximum** to determine the longest time that it takes to resolve service
    cases, compare it to the business **service-level agreement (SLA)** metrics, and
    group by type of case to understand the "worst-case" scenarios for the business.

    +   - Use **Minimum** to understand and identify the lower ceiling of values for
    a grouping, such as minimum deal size or shortest time to close service cases.

    +   - Use **Stddevp** to calculate the spread of data distribution, such as a
    financial analyst using the Stddevp function to calculate deviations in revenue.'
