- pgno: 94
  md: 'This was a very simple example, purely designed to show you how to create a
    recipe. Following the detailed explanations to come, you will work through a comprehensive,
    hands-on exercise to hone your skills.


    Now, let''s take a look at how recipes can be used to transform data in your datasets.


    # Transforming data in recipes


    A data recipe is a fast, intuitive, and powerful tool for data combination, aggregation,
    and transformation. The following sections will walk you through the various tools
    at your disposal in these recipes:


    +   - Adding data

    +   - Appending data

    +   - Filtering data

    +   - Aggregating data

    +   - Transforming data


    At the end of these explanatory sections, you will work through a hands-on exercise
    to hone your data recipe skills.


    # Adding data


    Even though you will likely choose input data when you create a recipe, you can
    add more data to an existing recipe as required. The recipe builder canvas will
    show a separate input node for each set of data that you add.


    In order to add more data to an existing recipe, simply click on **Select Data**
    in the upper-left corner of the recipe builder canvas, which is represented by
    the standard dataset icon with a + button next to it. Follow similar steps to
    those that you used to add the source dataset when creating your recipe. All of
    the columns are included by default.'
  merge: -1
