    | Becker755 Inc | 1 | $3,526,355 |

    | Brewer763 Inc | 1 | $1,422,600 |

    | Bryant456 Inc | 1 | $1,269,390 |

    | Burton810 Inc | 1 | $136,800 |

    | Carlson744 Inc | 1 | $788,800 |


    Figure 9.11 – A sample opportunity lens with SAQL revealed in query mode'
  merge: -1
