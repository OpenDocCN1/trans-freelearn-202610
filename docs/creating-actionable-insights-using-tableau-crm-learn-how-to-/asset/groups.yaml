    ### Bringing Salesforce data into TCRM


    This section will teach you, in detail, how to ingest Salesforce data and create
    a dataset that is useful for analysis and exploration. Before you build your first
    dataset, you need to consider dataset design.


    #### Designing a dataset


    TCRM data is stored in inverted index structures. Ideally, you should start with
    the lowest, most granular level (that is, the child) and follow a path up to the
    parent table hierarchy, which constitutes a dataset answering the business case
    in question. You can have multiple datasets and augment to one large dataset,
    or you can calculate and aggregate on the fly using SAQL in the dashboard editor.


    It is critical that you understand and work with the dataset as they pertain to
    questions of a business case nature. That is, when designing your dataset, consider
    the following:


    - Avoid the notion of building a data warehouse in one dataset.

    - At the same time, a dataset is not meant to be the substitute of one table;
    it is the fields from the objects (such as data tables) that pertain to the analytics
    use case with relevant business questions.

    - Always consider multiple datasets augmenting to get the desired results or leverage
    different interacting charts from different datasets on the dashboard (each chart
    answers the business question at each lowest granule level). Datasets can be connected
    to the dashboard to enable faceting as required.

    - **SAQL (Salesforce Analytics Query Language)** is another good option to solve
    certain use cases.


    For example, let''s imagine that your business wants to analyze the impact of
    products upon the win rate of opportunities. The relevant objects for analysis
    could be as follows:


    - Account

    - Contact

    - Opportunity

    - User

    - Product

    - Product family

