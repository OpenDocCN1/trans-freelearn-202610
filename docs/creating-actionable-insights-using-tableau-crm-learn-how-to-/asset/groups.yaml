    +   - Join multiple Salesforce objects (such as **Account, Opportunity, and Product**),
    split the resulting dataset into several data streams, then use the **Aggregate**
    node to create roll-up summary datasets as required.


    You can see an example in the following screenshot of what it looks like when
    you create multiple data streams using aggregation nodes; this example uses only
    one Salesforce object, but the permutations and options are endless:


    ![](img/06379e43783b9ddfee45e9da5192efe1_127_0.png)


    Figure 5.8 – A simple example of multiple data streams using aggregation nodes


    # Using unique and basic arithmetic functions


    As seen in *Chapter 4, Building Data Recipes*, a number of options are available
    when aggregating data. Let''s look at these in more detail.


    # Using the Unique aggregation


    The **Unique** aggregation is useful when you do not want to generate a total
    count of rows, but you do want to count the number of unique occurrences of a
    certain value.


    For example, if you have a dataset that has a granularity of product-line items,
    you could count the number of occurrences of unique values of opportunities by
    record ID, and create a dataset that shows how many opportunities are associated
    with a certain product.'
  - '[PAGE 128]


    # Using basic arithmetic functions


    Basic arithmetic functions provide great flexibility to group and aggregate your
    data. The **Select Aggregate** dialog box for the **Aggregate** node is seen in
    the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_128_0.png)


    Figure 5.9 – Basic arithmetic operations in the Aggregate node


    Here are some examples of use cases for basic arithmetic operations in the **Aggregate**
    node:


    +   - Use **Average** to calculate the average age of closed/won opportunities
    to determine how long it takes to close deals, and group by industry to compare
    and benchmark.

    +   - Use **Maximum** to determine the longest time that it takes to resolve service
    cases, compare it to the business **service-level agreement (SLA)** metrics, and
    group by type of case to understand the "worst-case" scenarios for the business.

    +   - Use **Minimum** to understand and identify the lower ceiling of values for
    a grouping, such as minimum deal size or shortest time to close service cases.

    +   - Use **Stddevp** to calculate the spread of data distribution, such as a
    financial analyst using the Stddevp function to calculate deviations in revenue.'
