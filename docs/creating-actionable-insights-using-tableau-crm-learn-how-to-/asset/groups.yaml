    \ or leave the columns unmapped.\n+   2. To map two columns, simply enter the\
    \ column name from the appended rows next to the corresponding recipe column.\n\
    +   3. If you wish to add a column from the appended rows that do not exist in\
    \ the recipe, click on the + button below the mapped columns – Add Mapping – and\
    \ select the column. Then, leave the recipe column blank.\n+   4. Click on Apply\
    \ to add the appended node to the recipe.\n+   5. Save the recipe.\n\n> **Important\
    \ Note**\n> If a column is mapped for one source and not the other, the Append\
    \ node will insert null values for all source rows to which the column does not\
    \ apply.\n> \n> If a recipe column contains unique IDs that identify each row,\
    \ you must ensure that the appended data does not duplicate the row IDs. The Append\
    \ node does not identify and remove duplicate records, nor does it validate the\
    \ uniqueness of the columns."
  md: "\n## Summary\n\nIn this section, you learned how to extract data from various\
    \ sources and bring it into TCRM. You should now have a good understanding of\
    \ the capabilities and limitations of TCRM when it comes to bringing in data from\
    \ Salesforce, flat files, and other data sources, as well as the framework and\
    \ tools that enable this. You have been taught how to create datasets from Salesforce\
    \ data and CSV files, and you have performed hands-on exercises to do this for\
    \ yourself. These lessons have formed the basis for your expertise in transforming\
    \ data and building dashboards in TCRM.\n\nIn the following chapter, the process\
    \ of creating a data recipe in TCRM will be defined and explained. Then, beginning\
    \ with the dataset created in this chapter, you will be able to apply filters,\
    \ calculations, and transformations to that data in order to create a new dataset\
    \ that meets the requirements of a business use case.\n\n## Questions\n\nHere\
    \ are some questions to test your knowledge of this chapter:\n\n- What is meant\
    \ by data sync?\n- Name five remote data connections available for TCRM.\n- What\
    \ is the dataset builder used for – to create a dataset from Salesforce data,\
    \ from external data, or both?\n- When working in the dataset builder, why is\
    \ it important to ensure that you select any ID fields that will be required to\
    \ add object relationships?\n- What common error is given when editing dataset\
    \ field attributes?\n\n## 4\nBuilding Data Recipes\n\nNow that you are confident\
    \ on how to create an **Out-of-the-box analytics app** template, it is time to\
    \ learn how to build **custom analytics apps**, beginning with **data transformation**.\
    \ In this chapter, the process of creating a data recipe in **TCRM** will be defined\
    \ and explained. Beginning with the dataset created in *Chapter 3, Connecting\
    \ Your Data Sources*, you will learn how to apply **filters**, **joins**, **calculations**,\
    \ **transformations**, and more to that data.\n\nSo, what will you be able to\
    \ do by the end of this chapter? Well, first, you will clearly understand how\
    \ to create a data recipe in TCRM. Second, you will be familiar and comfortable\
    \ with the data recipe UI. Third, you will be able to transform data inside recipes\
    \ using functionalities such as **buckets**, **aggregation**, and **calculations**.\
    \ Fourth, you will have learned how to join and append datasets, including how\
    \ to use the various join types, such as **lookup** and **inner join**. And, finally,\
    \ you will be confident in outputting data from recipes as a *CSV* or *TCRM* dataset.\n\
    \nIn this chapter, we will cover the following topics:\n\n- Cooking up data recipes\
    \ in TCRM\n- Transforming data in recipes\n- Joining data in recipes\n- A hands-on\
    \ exercise in data transformation\n\n## Technical requirements\n\nThe following\
    \ is required to successfully execute the instructions in this chapter:\n\n- A\
    \ laptop or desktop with internet access (a tablet or a phone is not sufficient).\n\
    - The latest version of the Google Chrome browser (Chrome is the preferred browser\
    \ when working with TCRM).\n- A working email address.\n- Make sure you are logged\
    \ in to your TCRM dev org.\n\n## Cooking up data recipes in TCRM\n\nIn this section,\
    \ we will explain what a data recipe is, when and why you should use one, and\
    \ how to create your first simple recipe.\n\n### What is a data recipe?\n\nA TCRM\
    \ data recipe is used to join multiple datasets into one and to prepare, clean,\
    \ and transform data with *smart suggestions*, *column profiles*, and *powerful\
    \ transformations*.\n\nRecipes are perfect for Salesforce administrators and analysts\
    \ with little to no data integration experience who want guidance on how to clean\
    \ data, with the added benefit of previewing the transformation results. Additionally,\
    \ recipes are a powerful tool for experienced data ninjas who want to create datasets\
    \ using a no-code, visual interface.\n\nA data recipe enables you to do the following:\n\
    \n- Preview data and see how it changes as you apply transformations.\n- Remove\
    \ columns or change column labels easily and quickly.\n- Use column profiles to\
    \ analyze the quality and makeup of your data.\n- Improve and transform your data\
    \ with intelligent suggestions.\n- Bucket values without having to write code\
    \ (**SAQL**, or **Salesforce Analytics Query Language**).\n- Transform data quickly\
    \ using calculated columns with the visual formula builder.\n- Quickly and easily\
    \ transform values to ensure data consistency with a point-and-click interface.\
    \ For example, you can replace, split, and trim values without a formula.\n- View\
    \ the history of all the changes, and back up or move forward to replay it.\n\
    - Easily apply various joins, such as inner and outer joins, using the intuitive\
    \ visual interface.\n\nThis chapter introduces you to the data recipe builder.\
    \ *Chapter 5, Advanced ETL Using TCRM Data Prep*, will guide you on how to use\
    \ the TCRM platform for more advanced data preparation.\n\n> **Important Note**\n\
    > The relatively new visual data preparation tool in TCRM, known colloquially\
    \ as **Data Prep 3.0**, is identical to the data recipe builder. The detailed\
    \ explanations and instructions provided in this chapter also cover this new tool,\
    \ referred to simply as data prep.\n\n### How do you create a data recipe?\n\n\
    Now, I am going to show you how to create a simple recipe. Let's begin with the\
    \ dataset you created earlier, **MyFirstDataset**. Execute the following steps\
    \ to get started:\n\n1. Navigate to **Data Manager** from the Analytics Studio\
    \ and select **Dataflows & Recipes** from the left-hand side menu.\n2. Click on\
    \ the **Recipes** tab.\n3. Click on **Create Recipe**. A new browser tab will\
    \ open.\n4. Click on the **Select Data** button. This will open up a dialog box,\
    \ called **Select Input Data**.\n\nThis was a very simple example, purely designed\
    \ to show you how to create a recipe. Following the detailed explanations to come,\
    \ you will work through a comprehensive, hands-on exercise to hone your skills.\n\
    \nNow, let's take a look at how recipes can be used to transform data in your\
    \ datasets.\n\n## Transforming data in recipes\n\nA data recipe is a fast, intuitive,\
    \ and powerful tool for data combination, aggregation, and transformation. The\
    \ following sections will walk you through the various tools at your disposal\
    \ in these recipes:\n\n- Adding data\n- Appending data\n- Filtering data\n- Aggregating\
    \ data\n- Transforming data\n\nAt the end of these explanatory sections, you will\
    \ work through a hands-on exercise to hone your data recipe skills.\n\n### Adding\
    \ data\n\nEven though you will likely choose input data when you create a recipe,\
    \ you can add more data to an existing recipe as required. The recipe builder\
    \ canvas will show a separate input node for each set of data that you add.\n\n\
    In order to add more data to an existing recipe, simply click on **Select Data**\
    \ in the upper-left corner of the recipe builder canvas, which is represented\
    \ by the standard dataset icon with a + button next to it. Follow similar steps\
    \ to those that you used to add the source dataset when creating your recipe.\
    \ All of the columns are included by default.\n\nOnce you have added the Append\
    \ node, you should see something similar to the following screenshot. Here, you\
    \ will be able to review the default column (field) mapping assigned by the recipe\
    \ builder based on the column names:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_96_0.png)\n\
    \nFigure 4.5 – Matching fields in preparation to append data\n\nThe following\
    \ steps must be performed in order to append data:\n\n1. Adjust the mappings,\
    \ map any unmapped columns manually, or leave the columns unmapped.\n2. To map\
    \ two columns, simply enter the column name from the appended rows next to the\
    \ corresponding recipe column.\n3. If you wish to add a column from the appended\
    \ rows that do not exist in the recipe, click on the + button below the mapped\
    \ columns – Add Mapping – and select the column. Then, leave the recipe column\
    \ blank.\n4. Click on Apply to add the appended node to the recipe.\n5. Save the\
    \ recipe.\n\n> **Important Note**\n> If a column is mapped for one source and\
    \ not the other, the Append node will insert null values for all source rows to\
    \ which the column does not apply.\n> \n> If a recipe column contains unique IDs\
    \ that identify each row, you must ensure that the appended data does not duplicate\
    \ the row IDs. The Append node does not identify and remove duplicate records,\
    \ nor does it validate the uniqueness of the columns.\n"
  mdcn: "\n\n## 摘要\n\n在本节中，你学习了如何从各种来源提取数据并将其导入 TCRM。现在，你应该已经很好地了解了 TCRM 从 Salesforce、平面文件和其他数据源导入数据时的功能与限制，以及实现这些功能的框架和工具。你已经学会了如何根据\
    \ Salesforce 数据和 CSV 文件创建数据集，并通过实践练习亲自完成了这些操作。这些课程为你在 TCRM 中转换数据和构建仪表板方面的专业能力奠定了基础。\n\
    \n在下一章中，将定义并讲解如何在 TCRM 中创建数据配方。然后，以本章中创建的数据集为基础，你将能够对数据应用筛选器、计算和转换，从而创建符合业务用例要求的新数据集。\n\
    \n## 问题\n\n以下问题可用于检验你对本章内容的掌握程度：\n\n- 什么是数据同步？\n- 列出 TCRM 提供的五种远程数据连接。\n- 数据集生成器的用途是什么——根据\
    \ Salesforce 数据、外部数据，还是两者创建数据集？\n- 使用数据集生成器时，为什么必须确保选择添加对象关系所需的 ID 字段？\n- 编辑数据集字段属性时通常会出现什么错误？\n\
    \n## 4\n构建数据配方\n\n现在，你已经确信自己能够创建**开箱即用的分析应用**模板，是时候开始学习如何构建**自定义分析应用**了，首先从**数据转换**开始。本章将定义并讲解如何在\
    \ **TCRM** 中创建数据配方。以*第 3 章，连接数据源*中创建的数据集为基础，你将学习如何对数据应用**筛选器**、**连接**、**计算**、**转换**等操作。\n\
    \n那么，到本章结束时，你将能够做些什么？首先，你将清楚地了解如何在 TCRM 中创建数据配方。其次，你将熟悉数据配方用户界面，并能够熟练使用它。第三，你将学会使用**分箱**、**聚合**和**计算**等功能在配方中转换数据。第四，你将学会连接和追加数据集，包括如何使用各种连接类型，例如**查找连接**和**内连接**。最后，你将能够自信地从配方中输出\
    \ *CSV* 或 *TCRM* 数据集。\n\n本章将介绍以下主题：\n\n- 在 TCRM 中构建数据配方\n- 在配方中转换数据\n- 在配方中连接数据\n\
    - 数据转换实践练习\n\n## 技术要求\n\n要成功执行本章中的说明，需要满足以下要求：\n\n- 一台可访问互联网的笔记本电脑或台式机（平板电脑或手机不满足要求）。\n\
    - 最新版本的 Google Chrome 浏览器（使用 TCRM 时，Chrome 是首选浏览器）。\n- 一个可正常使用的电子邮箱地址。\n- 确保已登录\
    \ TCRM 开发组织。\n\n## 在 TCRM 中构建数据配方\n\n本节将解释什么是数据配方、何时以及为什么应使用数据配方，以及如何创建第一个简单的配方。\n\
    \n### 什么是数据配方？\n\nTCRM 数据配方用于将多个数据集合并为一个数据集，并借助*智能建议*、*列配置文件*和*强大的转换功能*准备、清理和转换数据。\n\
    \n对于几乎没有数据集成经验、希望获得数据清理指导的 Salesforce 管理员和分析师而言，配方非常合适，同时还能够预览转换结果。此外，对于希望通过无代码可视化界面创建数据集的资深数据专家来说，配方也是一种强大的工具。\n\
    \n数据配方可以帮助你完成以下操作：\n\n- 预览数据，并查看应用转换后数据如何变化。\n- 轻松快速地删除列或更改列标签。\n- 使用列配置文件分析数据的质量和组成。\n\
    - 通过智能建议改进和转换数据。\n- 无需编写代码即可对值进行分箱（**SAQL**，即 **Salesforce Analytics Query Language**）。\n\
    - 使用可视化公式生成器，通过计算列快速转换数据。\n- 使用点击式界面快速、轻松地转换值，确保数据一致性。例如，你可以在不使用公式的情况下替换、拆分和修剪值。\n\
    - 查看所有更改的历史记录，并通过后退或前进来重新执行这些更改。\n- 使用直观的可视化界面轻松应用各种连接，例如内连接和外连接。\n\n本章将介绍数据配方生成器。*第\
    \ 5 章，使用 TCRM Data Prep 进行高级 ETL*将指导你如何使用 TCRM 平台执行更高级的数据准备操作。\n\n> **重要说明**\n\
    > TCRM 中相对较新的可视化数据准备工具，俗称 **Data Prep 3.0**，与数据配方生成器完全相同。本章提供的详细解释和说明同样适用于这一新工具，该工具简称为数据准备。\n\
    \n### 如何创建数据配方？\n\n现在，我将向你展示如何创建一个简单的配方。让我们从之前创建的数据集 **MyFirstDataset** 开始。执行以下步骤即可开始：\n\
    \n1. 在 Analytics Studio 中导航到 **Data Manager**，然后从左侧菜单中选择 **Dataflows & Recipes**。\n\
    2. 点击 **Recipes** 选项卡。\n3. 点击 **Create Recipe**。此时将打开一个新的浏览器选项卡。\n4. 点击 **Select\
    \ Data** 按钮。此时将打开一个名为 **Select Input Data** 的对话框。\n\n这是一个非常简单的示例，目的只是展示如何创建配方。在接下来的详细说明中，你将完成一个全面的实践练习，以提升相关技能。\n\
    \n现在，让我们来看看如何使用配方转换数据集中的数据。\n\n## 在配方中转换数据\n\n数据配方是一种快速、直观且功能强大的数据组合、聚合和转换工具。以下各节将带你了解这些配方中可用的各种工具：\n\
    \n- 添加数据\n- 追加数据\n- 筛选数据\n- 聚合数据\n- 转换数据\n\n完成这些说明性章节后，你将进行实践练习，以提升使用数据配方的技能。\n\
    \n### 添加数据\n\n虽然你通常会在创建配方时选择输入数据，但也可以根据需要向现有配方中添加更多数据。配方生成器画布会为你添加的每组数据显示一个单独的输入节点。\n\
    \n要向现有配方中添加更多数据，只需点击配方生成器画布左上角的 **Select Data**，该按钮由标准数据集图标和旁边的 + 按钮组成。按照创建配方时添加源数据集所使用的类似步骤进行操作。默认情况下会包含所有列。\n\
    \n添加 Append 节点后，你应该会看到类似以下屏幕截图的内容。在此处，你可以查看配方生成器根据列名分配的默认列（字段）映射：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_96_0.png)\n\
    \n图 4.5 – 追加数据前匹配字段\n\n要追加数据，必须执行以下步骤：\n\n1. 调整映射关系，手动映射所有未映射的列，或者让这些列保持未映射状态。\n\
    2. 要映射两列，只需在对应配方列旁输入追加行中的列名。\n3. 如果希望添加追加行中存在、但配方中不存在的列，请点击已映射列下方的 + 按钮——Add Mapping——然后选择相应列。之后，将配方列留空。\n\
    4. 点击 Apply，将追加节点添加到配方中。\n5. 保存配方。\n\n> **重要说明**\n> 如果某列在一个源中进行了映射、而在另一个源中没有映射，Append\
    \ 节点会针对不适用该列的所有源行插入 null 值。\n> \n> 如果配方列包含用于标识每一行的唯一 ID，则必须确保追加的数据不会重复这些行 ID。Append\
    \ 节点不会识别和删除重复记录，也不会验证列值的唯一性。\n\n"
