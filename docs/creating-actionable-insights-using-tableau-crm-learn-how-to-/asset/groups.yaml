    # What is TCRM and what is it used for?


    By the end of this section, you should have a good grasp of what we are referring
    to when we speak of TCRM, and how it is used in the real world.


    The questions *what is TCRM?* and *what is it is used for?* will be answered in
    the following sub-sections.


    # What is TCRM?


    TCRM is not a Salesforce app – TCRM is a data analysis and business insights platform
    with integrated machine learning insights from Einstein Discovery.


    To expand upon the high-level summary shown in Figure 7.1, TCRM is a platform
    that combines the following features:


    +   - Native, two-way integration with the Salesforce CRM platform.

    +   - On-platform data extraction, combination, and transformation in the data
    manager.

    +   - External connectivity to a variety of other platforms and cloud storage
    providers.

    +   - Data visualization, analysis, and exploration.

    +   - A data action framework to enable decision-making based on insights.

    +   - Embedded intelligence from the Salesforce Einstein platform, such as Einstein
    Sentiment analysis.

    +   - Insights can be shared in various ways, such as Salesforce Chatter, URL
    generation, and downloads.

    +   - On-dashboard notifications to alert users when certain criteria are met.

    +   - A mobile TRCM Analytics App.

    +   - TCRM/Einstein Analytics APIs and SDKs.

    +   - Various data security tools to mask incoming data and restrict/filter outgoing
    insights as required.


    At a technical level, as far as architecture goes, here are some details:


    +   - In TCRM, data is searched for using an inverted index that enables fast
    query results – datasets containing up to a billion rows can be queried in seconds.

    +   - TCRM data is loaded into a non-relational store via a dynamic, horizontally
    scalable key-value pair approach.'
  - '[PAGE 24]


    # What Is Tableau CRM and Where Can You Use It?


    +   - The TCRM workflow engine is a software application that is designed to help
    users enforce a series of recurring tasks that make up a "business process" or
    "workflow." It applies limited transformations upon data ingestion but largely
    stores information in its original form.

    +   - Data is consumed and stored in a non-relational inverted index as key-value
    pairs. These key-value pairs only store non-null data values, which improves efficiency
    and speed.

    +   - TCRM''s query engine employs techniques such as vector encoding, differential
    encoding, and incremental encoding to compress data and perform efficient and
    faster queries on compressed data.

    +   - Quantitative data is queried in a columnar store in RAM across Salesforce''s
    cloud.

    +   - TCRM provides Einstein Analytics Actions, which allow you to seamlessly
    go from question to answer to action without logging into a separate solution
    – such as creating a task, updating a record, creating a case, posting to Chatter,
    and more!

    +   - Heavy compression, optimization algorithms, and parallel processing fast
    and efficient queries on very large datasets.

    +   - Mobile-first design – TCRM enables data creation, analysis, and action directly
    from mobile devices.

    +   - Einstein Analytics is an open, scalable, and extensible platform. Being
    built on the secure infrastructure of Salesforce, the world''s top CRM, TCRM provides
    easy-to-use APIs that enable deep relationships with other tools and platforms.

    +   - Salesforce has worked with Informatica, MuleSoft, Snowflake, and other vendors
    to build interfaces with BI and data solutions out of the box.

    +   - TCRM delivers fast-rendering graphics that connect the relationships between
    views of data by drawing SVG graphics within the browser and using an animation
    engine faceting and filtering. This demands fewer resources from the user''s device
    or the server.

    +   - The TCRM platform is built upon Salesforce''s trusted, multilayered approach
    to data availability, privacy, and security.'
