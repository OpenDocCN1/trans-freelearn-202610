    # Summary


    In this chapter, you learned how to use the more advanced ETL tools available
    in Data Prep and TCRM recipes. You should now be able to join, aggregate, flatten,
    and transform your data with confidence using the TCRM data preparation GUI. This
    includes the use of complex and custom transformations using formulas.


    In the following chapter, you will learn how to use the data exploration tool
    known as a TCRM lens, and you will understand how lenses are the building blocks
    of TCRM dashboards.


    # Questions


    Here is a list of questions to test your knowledge:


    +   - What is the difference between a lookup join, an inner join, and a full
    join?

    +   - Give one real-world example of how to use a full join.

    +   - Why would you need to connect data from external sources with Salesforce
    objects? Give one practical example.

    +   - Explain how to combine aggregation and grouping using two data streams in
    one recipe.

    +   - The Multiple Row Formula option must be selected to perform window functions.
    What are window functions, and when might you use them?

    +   - What is a flatten transformation, and what is a use case for this?'
