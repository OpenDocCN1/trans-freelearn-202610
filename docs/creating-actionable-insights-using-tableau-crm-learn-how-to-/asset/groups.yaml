    \ 示例\n\n让我们看一个 JSON 绑定的简单示例——动态分组。此示例来自公开可用的 *Learning Adventure* 应用，我在本文末尾提到它。请按以下步骤操作：\n\
    \n- 1. 创建一个新的空白仪表板。\n- 2. 创建一个切换部件 (`pillbox_1`)，其步骤 (`Grouping_Toggle_1`) 指定不同的分组。\n\
