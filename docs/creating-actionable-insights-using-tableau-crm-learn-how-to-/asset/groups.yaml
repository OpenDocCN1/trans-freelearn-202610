    You will need the following to successfully execute the instructions in this chapter:


    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM)

    +   - A working email address


    Be sure to be logged in to your TCRM dev org.


    Time to jump in and build your first TCRM dashboard!


    # Getting to know your dashboard editor


    In this section, you will get hands-on and learn how to use the dashboard editor
    in TCRM.


    From your Analytics Studio home page, click on Create and select Dashboard, then
    click on Create Blank Dashboard. You will come to the dashboard editor canvas,
    which looks like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_206_0.png)


    Figure 8.1 – The initial dashboard editor canvas


    Before proceeding with the next steps, save your dashboard as My First Dashboard
    in My First Analytics App.'
