    ## Customizing a TCRM analytics app


    By the end of this section, you should be able to edit the configuration of an
    app and thus customize it to a limited extent. These two steps are required for
    you to customize an app:


    - 1. Change the app settings to custom settings.

    - 2. Customize the detailed app settings.


    Let''s explore these steps in the following sections.


    ### Changing the app settings to custom settings


    Let''s go into the app we created and edit the settings, as follows:


    - 1. Click on **Reconfigure app** in the app, as per the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_58_0.png)


    Figure 2.17 – Beginning the app reconfiguration process


    - 2. Next, confirm that it''s okay to overwrite existing settings and customizations
    by clicking the checkbox and hitting **Continue**. You will then see the **Sales
    Analytics - Personalize** screen again, so continue, and this time select custom
    settings when asked **Choose how you would like to create Sales Analytics**.


    You can add additional objects if desired, as illustrated in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_58_1.png)


    Figure 2.18 – Choosing additional objects for the analytics app


    For example, if your organization uses product schedules in Salesforce, you can
    include that object in your analytics app by adding it here.


    ### Customizing detailed app settings


    We can now go in and start to customize the detailed settings that impact what
    users will see in their analytics. Let''s walk through these dialog boxes and
    make some changes together.


    The first box pertains to segmenting your customers; go ahead and edit these fields
    to change the app configuration, as follows:


    ![](img/06379e43783b9ddfee45e9da5192efe1_59_0.png)


    Figure 2.19 – Making changes to the customer segmentation settings


    A series of dialog boxes will follow and you can make changes as you see fit,
    such as these:


    - Customizing fields to segment geographies

    - Customizing fields to segment products

    - Controlling data visibility

    - Adding additional fields to datasets and dashboards


    Note that every OOTB analytics app has its own set of configuration options. When
    you get to the point where you are able to create your own app from scratch and
    build a custom template, you will create a new configuration wizard to suit.


    Once this process of personalization is complete, you will be asked **Are you
    sure you want to reconfigure your app?** Absolutely! Click **OK**, then wait while
    your app is reconfigured.


    Once the app has been rebuilt to your custom specifications, you can dive in and
    look around, and you will see your revised settings reflected in the assets.


    Well done—you have created and customized your very first TCRM app!


    However, what if the standard OOTB apps don’t meet your requirements? What if
    you need far more bespoke analytics assets, such as a totally custom dashboard
    or a dashboard that brings in data from a **data warehouse**? Don’t worry—TCRM
    is incredibly flexible, and your questions will be answered in the following chapters.


    ## Common questions answered


    As you follow along in this chapter and build your own app, you may encounter
    some challenges or have questions; four of the most common ones that are faced
    or asked are outlined next.


    ### Which licenses do I need to build and use TCRM?


    TCRM requires either **Einstein Analytics Growth** (without Discovery) or **Einstein
    Analytics Plus** (with Discovery) licenses. Information regarding your user licenses
    and **permission set licenses (PSLs)** can be found in **Setup**, as depicted
    in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_61_0.png)


    Figure 2.20 – Locating user license information in Setup


    Salesforce auto-assigns an **Einstein Analytics Growth** permission set license
    to the user to whom you assign any TCRM permissions in your org. A PSL can also
    be manually assigned to users. The process of creating and assigning a permission
    set is detailed in the following steps:


    - 1. In the **Setup** menu, under **Administration**, click **Users**, then **Permission
    Sets**, and then click **New**.

    - 2. Associate the new permission set with a PSL. You must have purchased a TCRM
    license before you can select any PSL for TCRM.

    - 3. Add permissions to the permission set from those available in the PSL.

    - 4. Assign that permission set to users.


    ### Which permissions do I need to access, build, and edit analytics apps?


    There are two prebuilt permission sets included in the **Einstein Analytics Growth
    license**, detailed as follows:


    - **Einstein Analytics Platform Admin**: Here, all permissions that are required
    to administer the TCRM platform are enabled. This includes permissions to enable
    the user to create TCRM templated and custom apps.

    - **Einstein Analytics Platform User**: Here, all permissions that are required
