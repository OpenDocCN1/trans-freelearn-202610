    \ TCRM\n\nNow that you can build a powerful dashboard in TCRM, how do you know\
    \ *what* you ought to build? What are some common mistakes in dashboard design?\
    \ What are the established principles of effective dashboard design? What are\
    \ the best practices when designing, building, and deploying TCRM dashboards?\
    \ This chapter explains this in detail to guide and inform great dashboard design.\n\
    \nWe'll cover the following:\n\n- Common mistakes in dashboard design\n- Design\
    \ philosophy for effective dashboard building\n- Best practice in TCRM dashboard\
