    图 11.19 – 由受众理解驱动的业务记分卡


    在这种情况下，每个磁贴包含以下针对所考虑业务领域的内容：


    - 一个关键指标

    - 一个用颜色编码以传达含义的比较度量

    - 一个用于支撑关键指标的柱状图

    - 一个由条形和目标构成的进度图


    尽管设计看起来简单，但要有效创建这种极简设计所需的业务理解水平实际上相当高。


    在以下仪表板示例中，用户是时间紧张的高管，他们只希望看到需要快速审阅的高层关键信息，并在需要时进行下钻和采取行动：


