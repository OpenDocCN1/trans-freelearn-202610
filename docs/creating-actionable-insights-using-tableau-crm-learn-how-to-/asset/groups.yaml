    Now that you are familiar with the **Tableau CRM (TRCM)** user interface and have
    built your very first TRCM analytics app, you are ready to dive deeper into this
    highly capable business intelligence platform. In this chapter, you will learn
    how to ingest data into TRCM from various data sources. The diverse capabilities
    and limitations of TRCM in bringing in data from Salesforce, flat files, data
    warehouses, and other sources will be examined and explained, along with the frameworks
    and tools that enable this process. You will learn how to connect **Salesforce**
    data objects with TCRM and create datasets. You will also be instructed on how
    to bring a flat file into TCRM.


    So, what will you be able to do by the end of this chapter? Well, first, you will
    clearly understand how to bring data into TCRM. Second, you will recognize the
    limitations of TCRM regarding data connections. Third, you will understand how
    to bring Salesforce data into TCRM. And, finally, you will be able to import flat
    file data into TCRM and use it to augment your Salesforce data.


    In this chapter, we are going to cover the following topics:


    +   - The capabilities of TCRM for data connections

    +   - The limitations of TCRM for data connections

