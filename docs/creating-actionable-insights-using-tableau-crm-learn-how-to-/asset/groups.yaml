    Now, we need to look at the importance of visual communication.


    ## A good dashboard clearly communicates information visually


    Effective analytics will employ visual understanding and tools to aid in data
    visualization and communication. This includes the prudent use of the following:


    - Colors

    - Shapes

    - Borders

    - Contrast

    - Proximity

    - Context


    I recommend that you study and leverage the Gestalt principles to understand how
    people see and understand data, including the following:


    - The law of closure

    - The law of common region

    - The law of proximity

    - The law of similarity

    - The law of symmetry


    For more information on the Gestalt principles, consult this resource:


    ```

    https://www.interaction-design.org/literature/topics/gestalt-principles

    ```


    In the following example of visual communication, I designed a very simple high-contrast
    dashboard to provide insight into general trending and facilitate drilling down
    to a record level for action:


    ![](img/06379e43783b9ddfee45e9da5192efe1_306_0.png)


    Figure 11.18 – Bold colors on a dark background – standing out on purpose


    This dashboard is conspicuous by what is not present, as are many effective designs.
    As Antoine de Saint-Exupéry said, "You know you’ve achieved perfection, not when
    you have nothing more to add, but when you have nothing to take away."


    A great dashboard will be designed with the intended audience in mind, as you
    will now see.


    ## A good dashboard considers the audience


    A good designer will get into their audience''s headspace. A deep and complete
    understanding of your business users and how they will digest and action your
    dashboards is a critical step in the design process. Consider the following:


    - How will the dashboard be utilized for next-step actions?

    - What information does the reader require to be successful in their day-to-day
    work?

    - What level of detail does the consumer really need?

    - What actions will the business user take, and how will those actions be made?

    - How will you highlight exceptions or insights that require follow-up?

    - What user assumptions and preferences could affect your design choices?

    - In the context of the business, what do colors mean and how are they likely
    to be interpreted visually?

    - What icons, logos, and so on are familiar in the business environment?

    - Remember to use color-blind-friendly color schemes.


    The following dashboard is a good example of an effective design that utilizes
    a deep understanding of the intended audience, where the executive leader requires
    a high-level summary page that then links to detailed drill-down dashboard pages:


    ![](img/06379e43783b9ddfee45e9da5192efe1_307_0.png)


    Figure 11.19 – A business score card, driven by audience understanding


    In this case, each tile contains the following for the area of business considered:


    - One key metric

    - A comparison measurement that is color-coded to convey meaning

    - One column chart to give content to the key metric

    - One progress chart created with a bar and a target


    Although the design appears simple, the level of business understanding required
    to create such a minimalist design effectively is considerable.


    In the following dashboard example, the users are time-poor executives who want
    only high-level, critical information to be presented to them for a quick review,
    and then drill-down and action if required:


    ![](img/06379e43783b9ddfee45e9da5192efe1_308_0.png)


    Figure 11.20 – Simple works for summary dashboards, with drill-down available
    as required


    You will now see the importance of facilitating user engagement in your dashboard
    designs.


    ## A good dashboard fosters user engagement


    A dashboard that isn''t used is wasted pixels on a screen – it is utterly worthless,
    no matter how beautiful or functional it may be. Therefore, your designs must
    foster user engagement and increase business adoption. Let me explain by way of
    examples.


    The following example of marketing analytics showcases a design where the viewer
    is drawn into the dashboard and engaged in a data discussion, achieved through
    the use of simplicity, flow, and contrast:


    ![](img/06379e43783b9ddfee45e9da5192efe1_309_0.png)


    Figure 11.21 – Marketing analytics where the data analytics flow


    When it comes to enabling user engagement, bold, contrasting colors are helpful.
    As seen in the following example, such a design makes information stand out and
    causes the user to take notice:


    ![](img/06379e43783b9ddfee45e9da5192efe1_310_0.png)


    Figure 11.22 – Bold colors, a hero chart, and supporting metrics


    Notice that your eyes are naturally drawn to the hero chart, the timeline on the
    bottom right, and then the accompanying numbers and visuals provide support and
    context.


    In the next example, minimalism supports user engagement:


    ![](img/06379e43783b9ddfee45e9da5192efe1_311_0.png)


    Figure 11.23 – Less is more with a Pareto chart for sales


    Note a few things about this highly minimalist design:


    - You have nothing to distract the user from the hero chart (the Pareto).

    - The user''s attention is naturally drawn to the Pareto chart, which itself is
    quick and easy to read.

    - Drilling down into the hero chart is facilitated by the bar chart, Sales by
    Product, which has been sorted in descending order of amount on purpose.

    - Once the user has identified the cohort of interest, they simply need to scroll
    down to see the individual records that can then be actioned in a variety of ways.


    The next example of a dashboard that fosters engagement is one that utilizes a
    clear highlights panel at the top, supported by a row of global filters, and focuses
    on the one key hero chart, the **Last Touch and First Touch Matrix**:


    ![](img/06379e43783b9ddfee45e9da5192efe1_312_0.png)


    Figure 11.24 – Simple and actionable marketing attribution analytics


    Predictive analytics can be challenging to present in a way that is easy to understand
    and intuitive to action. Here is an example that does this well by using informative
    colors and two timeline charts to support the action table on the right:


    ![](img/06379e43783b9ddfee45e9da5192efe1_313_0.png)


    Figure 11.25 – Simple insights for predictive capacity planning


    - Employ wise layout choices. If a dashboard is well organized from a visual perspective,
    business users will be able to easily find the information they require. Therefore,
    I recommend that you begin with the big picture – key insights and call-outs must
    be quickly visible at a glance.

    - Always provide context for your insights. Give your users comparison values.

    - Keep things simple.

    - Balance functionality with creativity – *effective* does not imply *boring*.

    - Supply the user with the level of detail required, and no more. Otherwise, an
    overabundance of detailed information will prove to be a distraction.

    - Understand how and where the dashboard will be used. For example, will the analytics
    be consumed on a phone, a tablet, or a PC? Consideration of such factors is important
    in good design.


    One of my favorite examples of a simple, intuitive, and actionable dashboard is
    this sales forecasting tool, where users can quickly visualize the sales forecast
    and drill in by quarter, account, or stage, and then view action individual opportunities
    in the record table:


    ![](img/06379e43783b9ddfee45e9da5192efe1_315_0.png)


    Figure 11.27 – A sales forecast story


