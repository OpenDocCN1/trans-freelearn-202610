    The matrix of polar gauges should look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_163_0.png)


    Figure 6.7 – Matrix of polar gauges


    Now, let’s learn how to drill down into the lens data. Open **My First Lens**
    and follow these steps:


    +   1. Select the bar for **Johnny Green** by clicking on it.

    +   2. When you do so, a new button will appear next to the **Chart Mode** button.
