    Now, configure the dashboard settings by clicking on the **Default** gear icon.
    I typically use these default settings:


    +   - **Name:** `Default`

    +   - **Columns:** 50

    +   - **Row Height:** Fine

    +   - **Cell Spacing:** 8 (horizontal) and 0 (vertical)

    +   - **Maximum Dashboard Width:** 1500

    +   - **Background Color:** Leave as-is for now


    There are 14 tools available on the left-hand side of the canvas, as detailed
    next; these will be explained as you add them to your dashboard:


    +   - Chart

    +   - Table

    +   - Filter

    +   - Container

    +   - Component

    +   - Date

    +   - Link

    +   - Image

    +   - List

    +   - Number

    +   - Range

    +   - Text

    +   - Toggle

    +   - Navigation


    When you click on the drop-down arrow at the top right of the editor, you have
    these options:


    +   - **Clone in New Tab:** Creates a clone of the current dashboard in a new
