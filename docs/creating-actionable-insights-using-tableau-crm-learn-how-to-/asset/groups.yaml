    - (d) **Name**\n- (e) **Opportunity ID**\n- (f) **Stage**\n- (g) **Won**\n\n>\
    \ **Note**\n> 重要的是要确保你选择了将用于向数据集添加对象关系所需的任何 ID 字段；否则，相关对象将没有用于链接的键。当我向基础对象添加新对象时，我总是添加对象\
    \ ID，以防以后构建关系时需要。\n\n8. 接下来，点击 **RELATIONSHIPS** 选项卡并连接以下对象：\n\n- (a) **Account\
