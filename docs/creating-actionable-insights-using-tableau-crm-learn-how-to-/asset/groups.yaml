    ### TCRM 数据连接的局限性


    你已经了解了 TCRM 在数据集成方面能够实现的功能。现在，我们来看看数据集成的一些局限性，如下所示：


    - Salesforce 公式字段中存储的结果，只有在对相关对象执行完整复制后，才会在 TCRM 数据集中更新。

