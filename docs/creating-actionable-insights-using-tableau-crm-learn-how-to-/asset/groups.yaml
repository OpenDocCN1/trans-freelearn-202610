    indicators (KPIs)**.

    +   - **Leaderboard**: Gives leaders a summary of the team''s and individuals''
    performance, including quota attainment, pipe coverage, bookings, pipe generation,
    closed-won business, average sales cycle time, and sales activities.

    +   - **Trending**: Analyze pipeline changes over time, including the beginning
    and end values of the pipe, as well as what''s moved in and out.

    +   - **Sales Stage Analysis**: Visualizes how deals have moved through stages
    of the sales process, revealing bottlenecks and at-risk opportunities.

    +   - **Whitespace Analysis**: Identifies resell and upsell opportunities.

    +   - **Executive Overview**: Sales executives can review the pipeline''s status,
    the projected closing, and top deals by lead source, plus high-level views of
    sales and service performance.


