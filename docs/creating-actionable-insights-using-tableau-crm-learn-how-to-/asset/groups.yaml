    +   - **Shared With Me**—All items that others have shared with you are accessed
    here.

    +   - **Created By Me**—All items that you create are accessed here.

    +   - **Learning Center**—Links to various learning resources for TCRM users are
    listed here for ease of use.

    +   - **Data Manager**—Data sources, datasets, and data tools are accessed here.

    +   - **Template Gallery**—You can launch a new analytics app from a template
    here. This is explained in much more detail in this chapter.

