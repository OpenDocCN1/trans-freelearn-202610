    # Beginning with code – an introduction to SAQL


    This section will introduce you to coding in TCRM using SAQL.


    # Definitions


    We''ll now look at detailed definitions regarding what SAQL is and when it can
    be used.


    # What is SAQL?


    **SAQL** is a runtime query language that enables ad hoc analysis of datasets.
    A SAQL script consists of a sequence of statements that are made up of keywords
    (such as filter, group, and order), **identifiers (IDs)**, literals, or special
    characters. It is **JavaScript Object Notation (JSON)**-based and **Apache Pig
    Latin (PIGQL)**-familiar. A SAQL query loads an input dataset, operates on it,
    and outputs the results.


    Here is a SAQL example:


    ```

    q = load "My_Dataset";

    q = group q by ''Division_Name'';

    q = foreach q generate ''Division_Name'' as ''Division_Name'', sum(''Amount'')/sum(''Quantity'')
    as ''sum_Amt/Qty''; q = order q by ''sum_Amt/Qty'' desc;

    ```'
  - '[PAGE 244]


    What you see in the preceding snippet are basic SAQL elements, as follows:


    +   - Load statement to load data

    +   - Stream ID—in this case, "q"

    +   - Statements using various SAQL functions and keywords


    # When do you use SAQL?


    You may use SAQL when you need to do custom calculations, advanced data manipulations
    on the fly, co-grouping (joining) data from different datasets, and top/bottom
    lists, in conjunction with binding for dynamic values on charts, and so on.


    # Which syntax is used for SAQL?


    Here is some basic SAQL syntax:


    +   - Keywords and functions are written in lowercase and they are case-sensitive.

    +   - **Application programming interface (API)** names being called from the
    dataset should be enclosed in single quotes, like this: ''Division_Name''.

    +   - API names are case-sensitive.

    +   - Strings must be enclosed in double quotes, such as "Open".


    # Where do you edit SAQL?


    Every step of a lens is SAQL-based so that it can be edited and/or custom SAQL
    can be added. These can be viewed in JSON editor mode or copied to a JSON editor
    of your choice.


    Follow these steps to see how to view and edit SAQL:


    +   1. Create a new lens from the **Opportunities** dataset.

    +   2. Add filters to the lens as you wish.

    +   3. Add groupings to the lens as you wish.

    +   4. Select two measures.

    +   5. Change to query mode by clicking on the **Query Mode** button at the top
    right of the chart in your lens.'
