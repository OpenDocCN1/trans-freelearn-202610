    ## Summary


    As you have seen in this chapter, TCRM is a versatile and user-friendly platform
    for building dashboards, analyzing data, and sharing findings.


    What exactly have you learned? First, you are now able to identify and use the
    tools available in the TCRM dashboard editor. Also, you can create widgets and
    add them to a dashboard. Third, you can edit and format widgets to meet your requirements.
    Plus, you are confident in adding and managing TCRM pages. Lastly, you should
    be competent in using a dashboard and sharing findings with others.


    The next chapter will teach you how to build advanced features into your TCRM
    dashboard.


    ## Questions


    Here is a list of questions to test your knowledge:


    - If you want a colleague to access a particular view of a dashboard and drill
    into the data, how would you share it with them?

    - What is the purpose of the Copy widget to clipboard command?

    - What is the recommended number of default columns for a dashboard?

    - When you move from one dashboard to another, do any filters applied to the first
    page remain in place?

    - How could you use the Container widget in a dashboard?

