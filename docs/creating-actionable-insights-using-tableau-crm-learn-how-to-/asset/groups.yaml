    Now, it''s time to test out the connection.


    While on the **Marketing** page, click on the **List** widget for **Lead Source**
    and select **Web**. The page will now filter by the selected value. Now, move
    to the **Sales** page, and you will see that the sales data has also been filtered
    by the web source of leads and deals.


    Now that you''ve successfully created your first TCRM dashboard from scratch,
    including the versatility of pages, it''s time to learn how to use and share a
    dashboard.


    # A user''s guide to a TCRM dashboard


    You will now open your new dashboard in **Preview** mode and approach it as a
    business user, learning how to slice and dice your data in TCRM. Before we explore
    the data, remove the static target on the hero chart, **Pipeline by Close Date**,
    as this will hinder our exploration. We will look at dynamic reference lines in
    *Chapter 9, Advanced Dashboard Design and Build*. Also, make sure all chart widgets
    have **Selection Type** set to **Multiple Selection**.


    The following steps will help you to explore and share your dashboard:


    +   1. Open the **My First Dashboard** dashboard and enter **Present** mode.

    +   2. Filter by **Segment** by choosing **MM** and **GB** in the **List** widget.

    +   3. Drill in by deal size by selecting **50,000 – 500,000** under **Sum of
    Amount**.

    +   4. We''re interested in new deals only for this analysis, so exclude **Existing
    Business** under the **Type** global filter (using **Does Not Equal**).

    +   5. Facet the dashboard by going to the **Pipeline by Stage** chart and selecting
    these two bars: **Negotiation/Review** and **Perception Analysis**.

    +   6. Save this dashboard view. Next to the dashboard title, click on the down
    arrow next to **Modified**, and select **Save View**. Name it **Sales drill down**
    and click on **Create**.

    +   7. Click on **Save** to save the dashboard.


    Your dashboard should now look like the one shown in the following screenshot;
    note that the results for **# of Deals Won** in the highlights panel show **No
    Results Found** because of the stages that you selected:'
  - '[PAGE 227]


    ![](img/06379e43783b9ddfee45e9da5192efe1_227_0.png)


    Figure 8.13 – Your dashboard in Sales drill-down view after drilling into the
    data


    You are now going to share this dashboard view with the help of the following
    steps:


    +   1. Click on the Share button at the top right of your screen.

    +   2. There are several ways for sharing this dashboard view, but for now, you
    want to share the link with a colleague who has access to this app and include
    a screenshot for reference. First, you will click on GET URL, then copy the Uniform
    Resource Locator (URL) and add it to an email.

    +   3. Next, click on DOWNLOAD and download the dashboard view as an image. Add
    the image to your email.

    +   4. Your colleague can now quickly review the dashboard as an image and then
    click on the URL to view the data live in the TCRM dashboard. Note that their
    view will retain the filtering and faceting that you applied when slicing and
    dicing your data to arrive at the view.'
