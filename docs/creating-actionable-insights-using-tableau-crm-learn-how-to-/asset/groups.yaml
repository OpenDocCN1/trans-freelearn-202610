    \ use case\n\nFollow these steps to create and edit a Union SAQL query:\n\n- 1.\
    \ Create a lens from the **Opportunities** dataset with no grouping, using **Sum\
    \ of Amount** as the measure.\n- 2. Switch to **Compare Table** mode.\n- 3. Filter\
    \ **Sum of Amount** as follows:\n  - **Opportunity Type = New Business**\n  -\
    \ **Account Type = Customer**\n  - **Industry ≠ Agriculture, Apparel**\n- 4. Clone\
    \ the column and filter by selecting **Existing Business** under **Opportunity\
    \ Type**.\n- 5. Edit the column names as follows:\n  - New Business\n  - Existing\
    \ Business\n- 6. **Save** the lens as **Union Use Case**.\n\nYour progress so\
    \ far will look like this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_247_0.png)\n\
    \nFigure 9.12 – Table view of the Union Use Case lens\n\n- 7. Change the lens\
    \ to a Funnel chart and notice that it cannot be used correctly; it shows one\
    \ value at a time only. Switch to **Query Mode** to view and edit the SAQL content.\n\
    \nThis is your starting point with the SAQL content:\n\n```\nq = load \"opportunity1\"\
    ;\nq_A = filter q by 'Type' == \"New Business\" && 'Account.Type' == \"Customer\"\
    \ && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry'\
    \ is null);\nq_B = filter q by 'Type' == \"Existing Business\" && 'Account.Type'\
    \ == \"Customer\" && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"])\
    \ || 'Account.Industry' is null);\nresult = group q_A by all full, q_B by all;\n\
    result = foreach result generate sum(q_A.'Amount') as 'A', sum(q_B.'Amount') as\
    \ 'B';\nresult = limit result 2000;\n```\n\nNotice that you have three data streams\
    \ in your query: q_A, q_B, and result.\n\n- 8. Update your code to remove the\
    \ query limit and union your two columns, as follows:\n\n```\nq = load \"opportunity1\"\
    ;\nq_A = filter q by 'Type' == \"New Business\" && 'Account.Type' == \"Customer\"\
    \ && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry'\
    \ is null);\nq_B = filter q by 'Type' == \"Existing Business\" && 'Account.Type'\
    \ == \"Customer\" && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"])\
    \ || 'Account.Industry' is null);\nresult = group q_A by all full, q_B by all;\n\
    result = foreach result generate sum(q_A.'Amount') as 'A', sum(q_B.'Amount') as\
    \ 'B';\nfinal1 = foreach result generate \"New Business\" as 'Description', sum('A')\
    \ as 'Sum';\nfinal2 = foreach result generate \"Existing Business\" as 'Description',\
    \ sum('B') as 'Sum';\nfinal = union final1,final2;\n```\n\nThe union function\
    \ combines multiple result sets into one result set. You need the same structure\
    \ and field names in result sets. You do have a choice to either use a different\
    \ dataset or the same dataset when it comes to creating result datasets.\n\nWhen\
    \ you click Run Query, you will see a table, as follows:\n\nLearn how to write\
    \ and edit SAQL queries\n\n```\nQuery\n1 q = load \"opportunity1\";\n2 q_A = filter\
    \ q by 'Type' == \"New Business\" && 'Account.Type' == \"Customer\" && (!('Account.Industry'\
    \ in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry' is null);\n3 q_B =\
    \ filter q by 'Type' == \"Existing Business\" && 'Account.Type' == \"Customer\"\
    \ && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry'\
    \ is null);\n4 result = group q_A by all full, q_B by all;\n5 result = foreach\
    \ result generate sum(q_A.'Amount') as 'A', sum(q_B.'Amount') as 'B';\n6 result\
    \ = limit result 2000;\n7\n8 final1 = foreach result generate \"New Business\"\
    \ as 'Description', sum('A') as 'Sum';\n9 final2 = foreach result generate \"\
    Existing Business\" as 'Description', sum('B') as 'Sum';\n10 final = union final1,final2;\n\
    ```\n\n| # | Description | Sum |\n|---|---|---|\n| 1 | New Business | 257,039,003\
    \ |\n| 2 | Existing Business | 109,018,414 |\n\nFigure 9.13 – Table results from\
    \ the Union function\n\nYou can now use a funnel or other chart type to visualize\
    \ the sum broken up into two components: new and existing business.\n\nAnother\
    \ use case for the Union function is to analyze the same metric showing a rolling\
    \ 3 months, as follows:\n\n```\nq3 = load \"opportunity\";\n```\n\n```\nq3 = filter\
    \ q3 by date('CloseDate_Year', 'CloseDate_Month', 'CloseDate_Day') in [\"3 months\
    \ ago\"..\"3 months ago\"]; q3 = group q3 by ('CloseDate_Year', 'CloseDate_Month');\n\
    ```\n\n```\nq3 = foreach q3 generate 'CloseDate_Year' as 'CloseDate_Year', 'CloseDate_Month'\
    \ as 'CloseDate_Month', sum('Amount') as 'sum_Amount';\n```\n\n```\nq2 = load\
    \ \"opportunity\";\n```\n\n```\nq2 = filter q2 by date('CloseDate_Year', 'CloseDate_Month',\
    \ 'CloseDate_Day') in [\"2 months ago\"..\"2 months ago\"]; q2 = group q2 by ('CloseDate_Year',\
    \ 'CloseDate_Month');\n```\n\n```\nq2 = foreach q2 generate 'CloseDate_Year' as\
    \ 'CloseDate_Year', 'CloseDate_Month' as 'CloseDate_Month', sum('Amount') as 'sum_Amount';\n\
    q1 = load \"opportunity\";\nq1 = filter q1 by date('CloseDate_Year', 'CloseDate_Month',\
    \ 'CloseDate_Day') in [\"1 months ago\"..\"1 months ago\"]; q1 = group q1 by ('CloseDate_Year',\
    \ 'CloseDate_Month');\nq1 = foreach q1 generate 'CloseDate_Year' as 'CloseDate_Year',\
    \ 'CloseDate_Month' as 'CloseDate_Month', sum('Amount') as 'sum_Amount';\nfinal\
    \ = union q3, q2, q1;\n```\n\n## Creating buckets using the case statement\n\n\
    Follow these steps to try this use case for yourself:\n\n- 1. Create a new lens\
    \ from the **Opportunities** dataset.\n- 2. Group by **Opportunity Name** and\
    \ measure **Sum of Amount**.\n- 3. Filter by **Won deals**.\n- 4. Change to **Query\
    \ Mode**.\n- 5. Remove the `limit` statement.\n- 6. Click **Save** to save your\
    \ lens.\n\nNow that you have your basic SAQL prepared, add the following case\
    \ statement:\n\n```\nresult = foreach q generate 'Name' as 'Name', 'sum_Amount'\
    \ as 'Amount', (case when 'sum_Amount' > 2000000 then \"Big\" when 'sum_Amount'\
    \ > 500000 then \"Medium\" else \"Small\" end) as 'Size';\n```\n\nThe finished\
    \ SAQL code should look like this:\n\n```\nq = load \"opportunity1\";\nq = filter\
    \ q by 'IsWon' == \"true\";\nq = group q by 'Name';\nq = foreach q generate 'Name'\
    \ as 'Name', sum('Amount') as 'sum_Amount';\nq = order q by 'Name' asc;\n```\n\
    \n```\nresult = foreach q generate 'Name' as 'Name', 'sum_Amount' as 'Amount',\
    \ (case when 'sum_Amount' > 2000000 then \"Big\" when 'sum_Amount' > 500000 then\
    \ \"Medium\" else \"Small\" end) as 'Size';\n```\n\nWhen you click **Run Query**,\
    \ you should see this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_251_0.png)\n\
    \n| Opportunity Name | Amount | Size |\n|---|---:|---|\n| Opportunity for Abbott1184\
    \ | $2,016,250 | Big |\n| Opportunity for Abbott414 | $206,587 | Small |\n| Opportunity\
    \ for Abbott636 | $121,490 | Small |\n| Opportunity for Adkins111 | $1,402,500\
    \ | Medium |\n| Opportunity for Aguilar1908 | $3,314,900 | Big |\n| Opportunity\
    \ for Aguilar210 | $202,174 | Small |\n| Opportunity for Alexander278 | $18,960\
    \ | Small |\n\nFigure 9.14 – Bucketed results created using the Case function\n\
    \n> **Tip**\n>\n> If you're looking to dive deep into SAQL, I can recommend these\
