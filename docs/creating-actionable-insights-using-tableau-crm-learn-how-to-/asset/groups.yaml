    \ 0,\\\"Avg Amount\\\").asObject()}}\"\n}\n],\n```\n\n## 使用图片作为图标\n\n可以使用图片作为图标，以增强美观性并让用户更直观地深入查看数据，如下图所示：\n\
    \n![](img/06379e43783b9ddfee45e9da5192efe1_277_0.png)\n\n图 10.1 – 使用图片作为图标\n\n\
