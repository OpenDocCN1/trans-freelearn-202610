  - "[PAGE 117]\n\n# # Diving into data joins\n\nWe looked briefly at joining and\
    \ augmenting your data in *Chapter 4, Building Data Recipes.*\nIn this section,\
    \ we will dive much deeper into this important area of data transformation.\n\
    First, let's begin by understanding the various types of data joins.\n\n# ## Understanding\
    \ the various types of joins\n\nThere are four common ways to join your data,\
    \ as seen in the following diagram:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_117_0.png)\n\
    \nFigure 5.1 – The four types of Structured Query Language (SQL) data joins\n\n\
    The four types of joins can be understood as follows:\n\n+   - **Left join:**\
    \ A left join includes all rows from the left (recipe) data stream and only adds\
    \ matching rows from the right data stream.\n+   - **Right join:** A right join\
    \ includes all rows from the right data stream and only adds matching rows from\
    \ the left (recipe) data stream.\n+   - **Inner join:** An inner join only includes\
    \ matching rows from the left (recipe) data stream and right data stream.\n+ \
    \  - **Full (outer) join:** A full outer join includes all rows from the left\
    \ (recipe) data stream and right data stream, regardless of whether or not they\
    \ have matches.\n\n> **Note**\n> \n> These joins include all matched rows in the\
    \ target table when multiple rows match."
  - '[PAGE 118]


    When it comes to the Join node in TCRM, there are five types of joins, as seen
    in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_118_0.png)


    Figure 5.2 - The five types of joins in the Join node


    The fifth join type added in TCRM is Lookup. A Lookup join returns all rows from
    the left data stream (recipe data) and only includes matching rows from the right
    data stream (lookup source). If multiple matches are found in the lookup source,
    the lookup join will return either a single row or all matching rows, depending
    upon how you have configured it. The lookup join outputs only one row for each
    row in the left data stream in order to ensure that the grain of the results does
    not change.


    > Considerations when using joins

    > Unlike a lookup, a join creates a separate record for each match in the target
    dataset when multiple rows match. Before using a join, ensure that you understand
    the implications of duplicate rows.


    The type of join used will depend upon the use case involved. Let''s consider
    a practical example for each type of join, as follows.'
  - '[PAGE 119]


    # Lookup join


    A lookup join is perhaps the most common of all TCRM joins. It is used, for example,
    when a dataset contains the **identifier (ID)** of opportunity owners and the
    dataset needs to include relevant details about those individuals, as contained
    in the Salesforce **User** object. The lookup source on the right is the **User**
    object, and the left data stream is the recipe dataset. Any user record that matches
    the user ID in the recipe dataset will return information around the user and
    augment it to the recipe dataset without adding any rows.


    # Left join


    An example of a left join would be when multiple opportunities are associated
    with an account in Salesforce, and the goal is to add a row for each opportunity,
    changing the granularity of the dataset from one row per account to one row per
    opportunity. The left data stream in this case would be the Salesforce **Account**
    object, and the target stream would be the **Opportunity** object.


    # Right join


    A right join can be used, for example, to create a dataset that begins with the
    Salesforce product object and creates a dataset that includes all product family
    records and excludes products that have no parent product family. The left stream
    is the product object, and the target (right) data stream is the product family
    object. This is a "parents without children" use case whereby "orphan" records
    are excluded.


    # Inner join


    An inner join is used to create an intersection or overlap of two data sources,
    where only rows that match both data streams are included. For example, looking
    at the preceding "parents without children" example, an inner join would create
    a dataset that only includes product records with a parent product family and
    product family records with child products. Both parents without children and
    children without parents are excluded. The left stream is the product object,
    and the target (right) data stream is the product family object.


    # Full outer join


    One example of a way in which a full outer join can be used is when you want to
    combine products and product families and include a record for every possible
    combination. You would have a record for each of the following:


    +   - Product records with no parent product family

    +   - Product family records with no child product'
  - '[PAGE 120]


    +   - Product records with a parent product family

    +   - Product family records with child products


    As you may have guessed, the left stream is the product object, and the target
    (right) data stream is the product family object.


    Now, we will look in more detail at joining Salesforce objects.


    # Joining Salesforce objects – deep dive and practical example


    Please build a fresh new recipe in your demo TCRM environment, as follows:


    +   a. First, we will join the account data to the opportunity data, like this:


    +   1. Create a recipe from the **Opportunity** object using `SFDC_LOCAL` with
    all columns selected.

    +   2. Create a **Join** node.

    +   3. Under **Select Input Data to Join**, select the **Account** object using
    `SFDC_LOCAL` with all columns selected.

    +   4. Under **Join Type**, choose **Lookup**.

    +   5. Under **Join Keys**, select the **Account ID** value for both keys.

    +   6. Under **API Name Prefix for Right Columns**, leave **Account** as the default.

    +   7. For the target lookup fields (with the prefix of **Account**), select only
    these five fields:

    +      - **Account ID**

    +      - **Account Name**

    +      - **Industry**

    +      - **Owner ID**

    +      - **Segment**

    +   8. Click on **Apply**.

    +   9. Save the recipe as **Joining Exercise**.'
  md: "\nYour finished recipe should look like this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_112_0.png)\n\
    \nFigure 4.13 – The result of the recipe from the exercise\n\nExplore your resulting\
    \ dataset to test your work and determine whether the results look correct. You\
    \ should end up with something that looks like the following:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_113_0.png)\n\
    \nFigure 4.14 – The resulting dataset from the exercise\n\nNow that you have completed\
    \ the hands-on data transformation exercise, it’s time to review what you have\
    \ learned in this chapter.\n\n## Summary\n\nIn this chapter, you learned how to\
    \ create and modify a data recipe in TCRM, becoming intimately familiar and comfortable\
    \ with the data recipe visual UI. Now, you should be able to transform the data\
    \ in recipes using a variety of functions such as buckets, aggregation, and calculations.\
    \ Additionally, you learned how to join and append datasets using various types\
    \ of joins such as lookup and outer join. Finally, you should now be confident\
    \ in outputting data from recipes as a CSV or TCRM dataset.\n\nIn the following\
    \ chapter, you will be introduced to the full capability of the Tableau CRM dataflow\
    \ editor. This is where, traditionally, the more powerful ETL (extract, transfer,\
    \ and load) work is performed. You will be instructed on how to combine many sources\
    \ of data, perform complex transformations and calculations, and create multiple\
    \ datasets.\n\n## Questions\n\nHere are some questions to test your knowledge\
    \ of this chapter:\n\n- What is a data recipe, and when should you use it?\n-\
    \ When would you need to append data in a recipe?\n- What types of dataset joins\
    \ are available in the recipe editor?\n- Where can you find common calculations?\n\
    - What is one real-world use case for the bucket transformation?\n- Explain the\
    \ **Detect Sentiment** transformation.\n- Fill in the blanks:\n  You must indicate\
    \ the field that contains every ______ in the data hierarchy and also the field\
    \ that contains the analogous __________ based on the hierarchy in order to compose\
    \ the flatten transformation. This will create one record for every hierarchy\
    \ node, which is referred to as the ______ node.\n- The **Split** transformation\
    \ always creates ______ new columns.\n\n## Diving into data joins\n\nWe looked\
    \ briefly at joining and augmenting your data in *Chapter 4, Building Data Recipes.*\
    \ In this section, we will dive much deeper into this important area of data transformation.\
    \ First, let's begin by understanding the various types of data joins.\n\n###\
    \ Understanding the various types of joins\n\nThere are four common ways to join\
    \ your data, as seen in the following diagram:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_117_0.png)\n\
    \nFigure 5.1 – The four types of Structured Query Language (SQL) data joins\n\n\
    The four types of joins can be understood as follows:\n\n- **Left join:** A left\
    \ join includes all rows from the left (recipe) data stream and only adds matching\
    \ rows from the right data stream.\n- **Right join:** A right join includes all\
    \ rows from the right data stream and only adds matching rows from the left (recipe)\
    \ data stream.\n- **Inner join:** An inner join only includes matching rows from\
    \ the left (recipe) data stream and right data stream.\n- **Full (outer) join:**\
    \ A full outer join includes all rows from the left (recipe) data stream and right\
    \ data stream, regardless of whether or not they have matches.\n\n> **Note**\n\
    > \n> These joins include all matched rows in the target table when multiple rows\
    \ match.\n\nWhen it comes to the Join node in TCRM, there are five types of joins,\
    \ as seen in the following screenshot:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_118_0.png)\n\
    \nFigure 5.2 - The five types of joins in the Join node\n\nThe fifth join type\
    \ added in TCRM is Lookup. A Lookup join returns all rows from the left data stream\
    \ (recipe data) and only includes matching rows from the right data stream (lookup\
    \ source). If multiple matches are found in the lookup source, the lookup join\
    \ will return either a single row or all matching rows, depending upon how you\
    \ have configured it. The lookup join outputs only one row for each row in the\
    \ left data stream in order to ensure that the grain of the results does not change.\n\
    \n> Considerations when using joins\n> Unlike a lookup, a join creates a separate\
    \ record for each match in the target dataset when multiple rows match. Before\
    \ using a join, ensure that you understand the implications of duplicate rows.\n\
    \nThe type of join used will depend upon the use case involved. Let's consider\
    \ a practical example for each type of join, as follows.\n\n## Lookup join\n\n\
    A lookup join is perhaps the most common of all TCRM joins. It is used, for example,\
    \ when a dataset contains the **identifier (ID)** of opportunity owners and the\
    \ dataset needs to include relevant details about those individuals, as contained\
    \ in the Salesforce **User** object. The lookup source on the right is the **User**\
    \ object, and the left data stream is the recipe dataset. Any user record that\
    \ matches the user ID in the recipe dataset will return information around the\
    \ user and augment it to the recipe dataset without adding any rows.\n\n## Left\
    \ join\n\nAn example of a left join would be when multiple opportunities are associated\
    \ with an account in Salesforce, and the goal is to add a row for each opportunity,\
    \ changing the granularity of the dataset from one row per account to one row\
    \ per opportunity. The left data stream in this case would be the Salesforce **Account**\
    \ object, and the target stream would be the **Opportunity** object.\n\n## Right\
    \ join\n\nA right join can be used, for example, to create a dataset that begins\
    \ with the Salesforce product object and creates a dataset that includes all product\
    \ family records and excludes products that have no parent product family. The\
    \ left stream is the product object, and the target (right) data stream is the\
    \ product family object. This is a \"parents without children\" use case whereby\
    \ \"orphan\" records are excluded.\n\n## Inner join\n\nAn inner join is used to\
    \ create an intersection or overlap of two data sources, where only rows that\
    \ match both data streams are included. For example, looking at the preceding\
    \ \"parents without children\" example, an inner join would create a dataset that\
    \ only includes product records with a parent product family and product family\
    \ records with child products. Both parents without children and children without\
    \ parents are excluded. The left stream is the product object, and the target\
    \ (right) data stream is the product family object.\n\n## Full outer join\n\n\
    One example of a way in which a full outer join can be used is when you want to\
    \ combine products and product families and include a record for every possible\
    \ combination. You would have a record for each of the following:\n\n- Product\
    \ records with no parent product family\n- Product family records with no child\
    \ product\n- Product records with a parent product family\n- Product family records\
    \ with child products\n\nAs you may have guessed, the left stream is the product\
    \ object, and the target (right) data stream is the product family object.\n\n\
    Now, we will look in more detail at joining Salesforce objects.\n\n## Joining\
    \ Salesforce objects – deep dive and practical example\n\nPlease build a fresh\
    \ new recipe in your demo TCRM environment, as follows:\n\n- a. First, we will\
    \ join the account data to the opportunity data, like this:\n  1. Create a recipe\
    \ from the **Opportunity** object using `SFDC_LOCAL` with all columns selected.\n\
    \  2. Create a **Join** node.\n  3. Under **Select Input Data to Join**, select\
    \ the **Account** object using `SFDC_LOCAL` with all columns selected.\n  4. Under\
    \ **Join Type**, choose **Lookup**.\n  5. Under **Join Keys**, select the **Account\
    \ ID** value for both keys.\n  6. Under **API Name Prefix for Right Columns**,\
    \ leave **Account** as the default.\n  7. For the target lookup fields (with the\
    \ prefix of **Account**), select only these five fields:\n     - **Account ID**\n\
    \     - **Account Name**\n     - **Industry**\n     - **Owner ID**\n     - **Segment**\n\
    \  8. Click on **Apply**.\n  9. Save the recipe as **Joining Exercise**.\n"
  mdcn: "\n\n你的成品配方应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_112_0.png)\n\
    \n图 4.13 – 练习中配方的结果\n\n探索生成的数据集以测试你的工作，并判断结果是否正确。最终你应该得到类似下图的内容：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_113_0.png)\n\
    \n图 4.14 – 练习中生成的数据集\n\n现在，你已经完成了动手实践的数据转换练习，是时候回顾本章所学的内容了。\n\n## 总结\n\n在本章中，你学习了如何在\
    \ TCRM 中创建和修改数据配方，从而深入了解并熟练掌握数据配方的可视化界面。现在，你应该能够使用桶、聚合和计算等多种函数来转换配方中的数据。此外，你学习了如何使用查找连接和外连接等各种连接类型来连接和追加数据集。最后，你现在应该有信心将配方中的数据输出为\
    \ CSV 或 TCRM 数据集。\n\n在下一章中，你将了解 Tableau CRM 数据流编辑器的全部功能。传统上，功能更强大的 ETL（提取、传输和加载）工作就在此完成。你将学习如何组合多个数据源、执行复杂的转换和计算，以及创建多个数据集。\n\
    \n## 问题\n\n以下是一些测试你对本章掌握程度的问题：\n\n- 什么是数据配方，何时应该使用它？\n- 在配方中，何时需要追加数据？\n- 配方编辑器中有哪些类型的数据集连接？\n\
    - 在哪里可以找到常用计算？\n- 桶转换的一个真实用例是什么？\n- 解释**情感检测**转换。\n- 填空：\n  要构建扁平化转换，你必须指明数据层次结构中包含每个______的字段，以及根据该层次结构包含类似__________的字段。这将为每个层次结构节点创建一条记录，该记录被称为______节点。\n\
    - **拆分**转换总是创建______个新列。\n\n## 深入了解数据连接\n\n在*第4章，构建数据配方。*中，我们简要了解了如何连接和扩充数据。在本节中，我们将更深入地探讨数据转换的这一重要领域。首先，让我们从理解各种类型的数据连接开始。\n\
    \n### 理解各种类型的连接\n\n有四种常见的数据连接方式，如下图所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_117_0.png)\n\
    \n图 5.1 – 四种结构化查询语言（SQL）数据连接类型\n\n这四种连接类型可以理解如下：\n\n- **左连接：** 左连接包含左侧（配方）数据流中的所有行，并且只添加右侧数据流中匹配的行。\n\
    - **右连接：** 右连接包含右侧数据流中的所有行，并且只添加左侧（配方）数据流中匹配的行。\n- **内连接：** 内连接只包含左侧（配方）数据流和右侧数据流中匹配的行。\n\
    - **全（外）连接：** 全外连接包含左侧（配方）数据流和右侧数据流中的所有行，无论它们是否匹配。\n\n> **注意**\n> \n> 当目标表中有多行匹配时，这些连接会包含所有匹配的行。\n\
    \n在 TCRM 中，Join 节点有五种连接类型，如以下截图所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_118_0.png)\n\
    \n图 5.2 – Join 节点中的五种连接类型\n\nTCRM 中新增的第五种连接类型是查找连接。查找连接返回左侧数据流（配方数据）中的所有行，并且只包含右侧数据流（查找源）中匹配的行。如果在查找源中找到多个匹配项，查找连接将根据你的配置返回单行或所有匹配的行。查找连接只为左侧数据流中的每一行输出一行，以确保结果的粒度不变。\n\
    \n> 使用连接时的注意事项\n> 与查找不同，当多行匹配时，连接会为目标数据集中的每个匹配创建一条单独记录。在使用连接之前，请确保你理解重复行的影响。\n\
    \n所使用的连接类型将取决于具体的用例。下面我们为每种连接类型考虑一个实际示例。\n\n### 查找连接\n\n查找连接可能是 TCRM 所有连接中最常用的一种。例如，当数据集包含机会所有者的**标识符（ID）**，并且该数据集需要包含这些人员的相关详细信息（如\
    \ Salesforce **User** 对象中所包含的）时，就会使用它。右侧的查找源是 **User** 对象，左侧数据流是配方数据集。任何与配方数据集中的用户\
    \ ID 匹配的用户记录都将返回有关该用户的信息，并将其扩充到配方数据集中，而不会添加任何行。\n\n### 左连接\n\n左连接的一个示例是：在 Salesforce\
    \ 中，一个账户关联了多个机会，目标是按每个机会添加一行，将数据集的粒度从每个账户一行改为每个机会一行。在这种情况下，左侧数据流是 Salesforce **Account**\
    \ 对象，目标数据流是 **Opportunity** 对象。\n\n### 右连接\n\n例如，右连接可用于创建一个从 Salesforce 产品对象开始的数据集，该数据集包含所有产品系列记录，并排除没有父产品系列的产品。左数据流是产品对象，目标（右）数据流是产品系列对象。这是一个“没有子女的父母”用例，其中“孤儿”记录被排除在外。\n\
    \n### 内连接\n\n内连接用于创建两个数据源的交集或重叠部分，其中只包含两个数据流都匹配的行。例如，在前面的“没有子女的父母”示例中，内连接将创建一个只包含具有父产品系列的产品记录和具有子产品的产品系列记录的数据集。没有子女的父母和没有父母的子女都被排除在外。左数据流是产品对象，目标（右）数据流是产品系列对象。\n\
    \n### 全外连接\n\n全外连接的一个使用示例是：当你想要组合产品和产品系列，并为每种可能的组合都包含一条记录时。你将拥有以下各项的记录：\n\n- 没有父产品系列的产品记录\n\
    - 没有子产品的产品系列记录\n- 有父产品系列的产品记录\n- 有子产品的产品系列记录\n\n你可能已经猜到，左数据流是产品对象，目标（右）数据流是产品系列对象。\n\
    \n现在，我们将更详细地了解如何连接 Salesforce 对象。\n\n### 连接 Salesforce 对象 – 深入探讨与实际示例\n\n请在演示\
    \ TCRM 环境中构建一个全新的配方，操作如下：\n\n- a. 首先，我们将账户数据连接到机会数据，如下所示：\n  1. 使用 `SFDC_LOCAL`\
    \ 从 **Opportunity** 对象创建一个配方，并选择所有列。\n  2. 创建一个 **Join** 节点。\n  3. 在 **Select\
    \ Input Data to Join** 下，使用 `SFDC_LOCAL` 选择 **Account** 对象，并选择所有列。\n  4. 在 **Join\
    \ Type** 下，选择 **Lookup**。\n  5. 在 **Join Keys** 下，为两个键选择 **Account ID** 值。\n \
    \ 6. 在 **API Name Prefix for Right Columns** 下，保留默认的 **Account**。\n  7. 对于目标查找字段（带有\
    \ **Account** 前缀），只选择以下五个字段：\n     - **Account ID**\n     - **Account Name**\n\
    \     - **Industry**\n     - **Owner ID**\n     - **Segment**\n  8. 点击 **Apply**。\n\
    \  9. 将配方保存为 **Joining Exercise**。\n\n"
