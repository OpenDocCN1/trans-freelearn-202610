    \ management and service team performance\n- Global sales breakdown by region,\
    \ territory, and country\n\n### Chapter 2\n\n- How does TCRM provide value to\
    \ your organization or clients?\n  This is an organization-specific answer.\n\
    - Does your organization excel at data analytics? If not, what is preventing it\
    \ from doing so?\n  This is an organization-specific answer.\n\n- What is a TCRM\
    \ asset? Give one example.\n  A TCRM asset is any one of four key items: dashboard,\
    \ story, lens, or dataset.\n\n- How can a TCRM app be shared?\n  One of three\
    \ ways:\n  - Give access via TCRM.\n  - Post to a Chatter feed.\n  - Share via\
    \ the app URL.\n\n- What is a TCRM lens?\n  A lens is a self-contained exploration\
    \ of data; one query with a visualization or table.\n\n- True or False – a TCRM\
    \ app is restricted to standard, OOTB settings.\n  False.\n\n- What is the purpose\
    \ of the \"Favorites\" link on the side menu of the TCRM home page?\n  You can\
    \ choose to favorite any TCRM asset, such as a dataset or lens, and add it to\
    \ this list for ease of access.\n\n- What do you do if the OOTB TCRM apps don’t\
    \ meet your requirements, even after you have customized them?\n  TCRM is incredibly\
    \ flexible and enables the custom development of assets.\n\n- How do you turn\
    \ on TCRM in a Salesforce environment?\n  You can enable TCRM by going to Setup\
    \ | Analytics | Getting Started and switching it on.\n\n### Chapter 3\n\n- What\
    \ is meant by data sync?\n  Data sync refers to the process whereby data is staged\
    \ for dataflows and recipes.\n- Name five remote data connections available for\
    \ TCRM.\n  - External Salesforce org\n  - NetSuite\n  - Marketo\n  - Google Analytics\n\
    \  - Amazon Redshift\n- What is the dataset builder used for – to create a dataset\
    \ from Salesforce data, from external data, or both?\n  To create a dataset from\
    \ Salesforce data\n- When working in the dataset builder, why is it important\
    \ to make sure that you select any ID fields that will be required for adding\
    \ object relationships?\n  It is important to make sure that you select any ID\
    \ fields that will be required to add object relationships to the dataset, otherwise\
    \ the related objects will have no key to link to.\n- What common error was given\
    \ when editing dataset field attributes?\n  Incorrectly classifying dimensions\
    \ as measures\n\n### Chapter 4\n\n- What is a data recipe, and when should you\
    \ use it?\n  A TCRM data recipe is used to join multiple datasets into one and\
    \ to prepare, clean, and transform data with smart suggestions, column profiles,\
    \ and powerful transformations. Recipes are perfect for Salesforce administrators\
    \ or analysts with little to no data integration experience who want guidance\
    \ on how to clean data, with the added benefit of previewing transformation results.\
    \ Recipes are also a powerful tool for experienced data ninjas who want to create\
    \ datasets using a no-code, visual interface.\n- When would you need to append\
    \ data in a recipe?\n  Appending data is used when you need to add rows from one\
    \ dataset, or multiple datasets, to another.\n\n- What types of dataset joins\
    \ are available in the recipe editor?\n  Lookup, left join, right join, inner\
    \ join, or full outer join\n- Where can you find common calculations?\n  Common\
    \ calculations have their own function buttons in the Transform toolbar – these\
    \ fill in the formula with the correct column and syntax for you.\n- What is one\
    \ real-world use case for the bucket transformation?\n  Buckets are a useful tool\
    \ when you want to create a heat map from two measures.\n- Explain the Detect\
    \ Sentiment transformation.\n  It is used to determine the sentiment of text,\
    \ whether positive, negative, or neutral, and adds those values to the specified\
    \ column.\n- Fill in the blanks:\n\n  You must indicate the field that contains\
    \ every **field** in the data hierarchy and also the field that contains the analogous\
    \ **node** based on the hierarchy in order to compose the Flatten transformation.\
    \ This will create one record for every hierarchy node, which is referred to as\
    \ the **child** node.\n\n  The Split transformation always creates **two** new\
    \ columns.\n\n### Chapter 5\n\n- What is the difference between a lookup join,\
    \ an inner join, and a full join?\n  The following list highlights the key differences\
    \ between these joins:\n  - The lookup source on the right is the User object,\
    \ and the left data stream is the recipe dataset. Any user record that matches\
    \ the user ID in the recipe dataset will return information relating to the user\
    \ and augment it to the recipe dataset without adding any rows.\n  - The inner\
    \ join is used to create the intersection, or overlap, of two data sources, where\
    \ only rows that match both data streams are included.\n  - A full join is used\
    \ when you want to include a record for every combination.\n- Give one real-world\
    \ example of how to use a full join.\n  You want to combine products and product\
    \ families and cater to every viable combination.\n- Why would you need to connect\
    \ data from external sources with Salesforce objects? Give one practical example.\n\
    \  You want to connect order data from an external ERP and join it with sales\
    \ data in Salesforce so that you can compare pipelines, done deals, and actuals.\n\
    - Explain how to combine aggregation and grouping using two data streams in one\
    \ recipe.\n  You can create a number of data streams in the Data Prep flow, perform\
    \ aggregation and roll up in each stream as required, and then rejoin these streams\
    \ and augment the granular data using a join node.\n- The option for Multiple\
    \ Row Formula must be selected to perform window functions – what are window functions?\
    \ When might you use them?\n  Window functions are employed in a Data Prep recipe\
    \ to perform calculations across rows, as opposed to across columns. One example\
    \ use case is to calculate the change in opportunity amount over time using the\
    \ lag function based upon a snapshot date.\n- What is the flatten transformation,\
    \ and what is a use case for this?\n  The flatten transformation flattens ranked\
    \ data for a hierarchy into two columns. You can flatten data in preparation for\
    \ use in security predicates.\n\n### Chapter 6\n\n- What does a lens enable you\
    \ to do?\n  The following list highlights the various things that can be done\
    \ with a lens:\n  - Explore the various characteristics of your dataset, including\
    \ dimensions, measures, field labels, and names.\n  - Slice and dice data using\
    \ various measures, dimensions, filters, and formulas.\n  - Create visualizations\
    \ and tables that can be clipped to a dashboard.\n  - Create visualizations and\
    \ tables that can be shared with other users.\n- What is the purpose of the Clip\
    \ command for lenses?\n  If a dashboard is open in the dashboard editor, the lens\
    \ is clipped, or exported, to the dashboard as a widget.\n- Name one use of a\
    \ pivot table.\n  Subtotaling and aggregating numeric data, and summarizing data\
    \ by categories and subcategories.\n"
  mdcn: "\n\n## 问题与答案\n\n### 第一章\n\n- 定义数据分析及其提供的价值。\n- 列出 TCRM 的五个特性。\n- TCRM 与 Tableau\
    \ 有何不同？\n- TCRM 的五个实际用例是什么？\n\n数据分析是对数据进行收集、理解、共享和行动。它使组织能够从数据中获得价值并获得可操作的业务洞察。我们的目标是从数据到洞察再到**行动**。\n\
    \n- 与 Salesforce CRM 平台的原生双向集成\n- 在数据管理器中进行平台内的数据提取、组合和转换\n- 与各种其他平台和云存储提供商的外部连接\n\
    - 数据可视化、分析和探索\n- 一个数据行动框架，用于基于洞察进行决策\n\nTableau 用于从任何地方分析和可视化数据；TCRM 提供原生的 Salesforce\
    \ 体验并优化 Salesforce 数据。\n\n- 销售业绩，例如实际值与目标的预测对比\n- 按线索来源、区域和团队成员的线索转化率\n- 营销活动的投资回报率\n\
    - 案例管理和服务团队绩效\n- 按区域、销售区域和国家划分的全球销售分解\n\n### 第二章\n\n- TCRM 如何为您的组织或客户提供价值？\n \
    \ 这是组织特定的答案。\n- 您的组织在数据分析方面表现出色吗？如果不是，什么阻碍了它做到这一点？\n  这是组织特定的答案。\n\n- 什么是 TCRM\
    \ 资产？举一个例子。\n  TCRM 资产是四项关键内容中的任何一项：仪表板、故事、透镜或数据集。\n\n- TCRM 应用可以通过什么方式共享？\n \
    \ 三种方式之一：\n  - 通过 TCRM 授予访问权限。\n  - 发布到 Chatter 动态。\n  - 通过应用 URL 共享。\n\n- 什么是\
    \ TCRM 透镜？\n  透镜是对数据的自包含探索；一个查询配有可视化或表格。\n\n- 真假 – TCRM 应用是否仅限于标准、开箱即用设置。\n  假。\n\
    \n- TCRM 主页侧边菜单上的“收藏”链接的用途是什么？\n  您可以将任何 TCRM 资产，例如数据集或透镜，设为收藏并将其添加到此列表以便更轻松地访问。\n\
    \n- 如果开箱即用的 TCRM 应用即使在您对其进行自定义后仍不符合您的要求，该怎么办？\n  TCRM 具有极强的灵活性，并支持资产的自定义开发。\n\n\
    - 如何在 Salesforce 环境中启用 TCRM？\n  您可以通过转到设置 | 分析 | 入门并将其打开来启用 TCRM。\n\n### 第三章\n\
    \n- 什么是数据同步？\n  数据同步是指将数据分阶段处理以供数据流和配方使用。\n- TCRM 可用的五个远程数据连接有哪些？\n  - 外部 Salesforce\
    \ 组织\n  - NetSuite\n  - Marketo\n  - Google Analytics\n  - Amazon Redshift\n-\
    \ 数据集构建器的用途是什么 – 用于从 Salesforce 数据创建数据集、从外部数据创建数据集，还是两者兼有？\n  用于从 Salesforce 数据创建数据集\n\
    - 在数据集构建器中工作时，为什么要确保选择将用于添加对象关系所需的任何 ID 字段很重要？\n  确保选择将用于向数据集添加对象关系所需的任何 ID 字段很重要，否则相关对象将没有键可供链接。\n\
    - 编辑数据集字段属性时给出的常见错误是什么？\n  将维度错误地分类为度量\n\n### 第四章\n\n- 什么是数据配方，以及何时应使用它？\n  TCRM\
    \ 数据配方用于将多个数据集连接成一个，并通过智能建议、列配置文件和强大的转换来准备、清理和转换数据。配方非常适合几乎没有或没有数据集成经验的 Salesforce\
    \ 管理员或分析师，他们希望获得有关如何清理数据的指导，并且还能预览转换结果。配方也是经验丰富的数据忍者创建数据集的强大工具，他们希望使用无代码、可视化界面。\n\
    - 在配方中何时需要追加数据？\n  当您需要将一个数据集或多个数据集的行添加到另一个数据集时，就会使用追加数据。\n\n- 配方编辑器中可用的数据集连接类型有哪些？\n\
    \  查找、左连接、右连接、内连接或全外连接\n- 常见计算在哪里可以找到？\n  常见计算在转换工具栏中拥有自己的功能按钮 – 这些按钮会为您填入正确的列和语法公式。\n\
    - 桶转换的一个实际用例是什么？\n  当您想要从两个度量创建热力图时，桶是一个有用的工具。\n- 解释检测情感转换。\n  它用于确定文本的情感是积极、消极还是中性，并将这些值添加到指定的列中。\n\
    - 填空：\n\n  您必须指定包含数据层次结构中每个**字段**的字段，以及包含基于层次结构中类似的**节点**的字段，以便组合展平转换。这将为每个层次结构节点创建一个记录，该节点被称为**子**节点。\n\
    \n  分割转换始终创建**两个**新列。\n\n### 第五章\n\n- 查找连接、内连接和全连接之间的区别是什么？\n  以下列表强调了这些连接之间的主要区别：\n\
    \  - 右侧的查找源是用户对象，左侧的数据流是配方数据集。任何与配方数据集中的用户 ID 匹配的用户记录都将返回有关该用户的信息并将其增强到配方数据集中，而不会添加任何行。\n\
    \  - 内连接用于创建两个数据源的交集或重叠，其中仅包含两个数据流都匹配的行。\n  - 全连接用于在您想要为每种组合包含一条记录时使用。\n- 给出使用全连接的一个实际例子。\n\
    \  您想要组合产品和产品系列并满足每种可行的组合。\n- 为什么需要将来自外部来源的数据与 Salesforce 对象连接起来？举一个实际例子。\n  您想要将来自外部\
    \ ERP 的订单数据与 Salesforce 中的销售数据连接起来，以便您可以比较管道、已完成交易和实际值。\n- 如何使用一个配方中的两个数据流组合聚合和分组？\n\
    \  您可以在数据准备流程中创建多个数据流，根据需要对每个流进行聚合和汇总，然后重新连接这些流并使用连接节点增强详细数据。\n- 必须选择多行公式选项才能执行窗口函数\
    \ – 什么是窗口函数？您可能会在何时使用它们？\n  窗口函数用于在数据准备配方中对行进行计算，而不是对列进行计算。一个示例用例是使用基于快照日期的 lag\
    \ 函数计算机会金额随时间的变化。\n- 什么是展平转换，以及它的用例是什么？\n  展平转换将层次结构的排序数据展平为两列。您可以在为安全谓词使用之前展平数据。\n\
    \n### 第六章\n\n- 透镜使您能够做什么？\n  以下列表强调了使用透镜可以完成的各种操作：\n  - 探索数据集的各种特征，包括维度、度量、字段标签和名称。\n\
    \  - 使用各种度量、维度、筛选器和公式对数据进行切片和切分。\n  - 创建可剪切到仪表板的视觉效果和表格。\n  - 创建可与其它用户共享的视觉效果和表格。\n\
    - 透镜的剪切命令的用途是什么？\n  如果仪表板在仪表板编辑器中打开，则透镜将被剪切或导出到仪表板作为小部件。\n- 透镜透视表的用途之一是什么？\n \
    \ 对数值数据进行小计和汇总，并按类别和子类别汇总数据。\n\n"
