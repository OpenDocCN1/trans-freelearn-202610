    ![](img/06379e43783b9ddfee45e9da5192efe1_323_1.png)


    Figure 11.37 – The team member page design showing the link back to the home page


    Now, you will learn about the importance of maximizing your use of the GUI in
    dashboard design.


    ## When possible, build with the GUI


    One mistake I see quite regularly is where people with developer backgrounds –
    those who are confident building using code – build almost everything in TCRM
    using JSON and SAQL. The result is a clumsy, bulky build that is difficult for
    others to come in and edit. It is not robust or scalable.


    As a general rule, it is best to work within the limits of the GUI, using clicks
    not code, until you hit a ceiling where you then supplement your build with SAQL
    and JSON as required.


    ## Be judicious in your use of SAQL


    This point follows on naturally from the previous one – limit your use of SAQL
    to where it is absolutely required. I will typically build a query in the dashboard
    editor (previously called a "step") with the UI, and then switch over to SAQL
    mode and finish my query. This also saves time and helps prevent syntax errors.
    Keep in mind several thoughts on this subject:


    - Excessive SAQL queries in a dashboard will hinder performance.


    - Lengthy, complex, and convoluted SAQL queries can be very difficult to troubleshoot,
    edit, or expand.


    - Keep up to date with the latest TCRM release, as new releases generally add
    to the UI functionality and reduce your dependence upon code.


    - To minimize your use of SAQL, it can be helpful in some cases to go back to
    the dataset and do your legwork there instead of in dashboard SAQL.


    Following on the last bullet point, let''s look at going back to your dataset/s.


    ## Know when to go back to the dataset


    As seen in the previous point, it can be helpful to go back to the dataset level
    to minimize the use of code; that is, aggregation and transformation can often
    best be performed in the dataset, as opposed to building code into the dashboard
    design itself. Examples of this approach include the following:


    - Aggregating data


    - Bucketing data


    Dashboard components are a very powerful and versatile tool; they can even have
    multiple pages added so that a dashboard can have pages within pages!


    Let''s see what we have learned in this chapter before we move on to the next.


    ## Summary


    What did you learn in this chapter? First, you were instructed on common mistakes
    made in dashboard design. Next, you learned the principles of good dashboard design,
    along with many practical examples. Lastly, you were instructed in TCRM best practices,
    including the use of pages, the minimization of code, and the use of dashboard
    components.


    In the next chapter, we will learn how to go from data to insight to action by
    embedding actioning TCRM dashboards.


    ## Questions


    Fill in the blanks:


    - Choose your ______________ types carefully.

    - Never seek to put all the available ________________ on the same page.

    - Utilize a small number of ________________ and ________________.

    - Make the dashboard as easy to ________________ as possible.

    - Employ wise ________________ choices.

    - Always provide ________________ for your insights.

    - Keep things ________________.

    - Balance functionality with ________________ - *effective does not imply boring*.

    - Supply the user with the level of ________________ required, and no more.

    - Understand ________________ and ________________ the dashboard will be used.


    ## Technical requirements


    You will need the following to successfully execute the instructions in this chapter:


    - The latest version of the Google Chrome browser (Chrome is the preferred browser
    when working with TCRM)

    - A working email address


    Be sure to be logged into your TCRM dev org.


    Let''s begin with record actions.


    ## Creating and configuring record actions in TCRM


    Simply put, a record action enables you to *action a record*. This means that
    you do not need to jump from TCRM into Salesforce, export a report to Excel, or
    perform any other clumsy workaround to *action* your insights – you can action
    them directly from a TCRM dashboard.


    Let’s look at actioning Salesforce records using configured record actions.


    ### Configured record actions


    The best way to understand this is to walk through a hands-on exercise. We are
    going to configure a record action in the dashboard that you created earlier,
    **My First Dashboard**. Follow these steps:


    1. Open **My First Dashboard** and go into **Edit** mode.

    2. Create a values table from the **Opportunities** dataset. Be sure to include
    the **Opportunity Name** field.

    3. Add the table to the bottom of your dashboard.

    4. Click on **Save**.


    Your dashboard will now look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_333_0.png)


    Figure 12.1 – My First Dashboard with the record table added


    Now that you have added the table, it is time to configure the record actions
    that will enable the user to go easily from data to insight to action. Follow
    these steps:


    1. In Analytics Studio, edit the **Opportunities** dataset.

    2. At the top-right corner, click on the **Configure Actions** gear icon. Note
    that if actions have already been configured for a field on the object, you will
    see a checkmark beside it in the list.

    3. Select the **Opportunity Name** field. You will see action configuration options
    on the right.

    4. Configure the action to have a **Record ID Field** value of Opportunity ID.

    5. Under **Display Fields**, select **Account Owner**. If multiple Salesforce
    records apply to the selected opportunity, this field provides information for
    choosing the correct record.

