    # A good dashboard tells a story with data


    Well-designed analytics tell a story with data. They will narrate a story simply,
    clearly, and concisely, resulting in a clear and actionable business strategy.
    If a user reviews your dashboard and is unable to understand and action a data
    story being told, then it is high time to redesign your dashboard!


    One example of data storytelling is seen in the following dashboard, where a summary
    of business performance is communicated clearly with great conciseness and simplicity:


    ![](img/06379e43783b9ddfee45e9da5192efe1_296_0.png)


    Figure 11.9 – Telling a business performance story simply with tiles'
