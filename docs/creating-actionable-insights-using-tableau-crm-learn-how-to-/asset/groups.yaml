    让我们现在看一下 SAQL 的介绍——你在 TCRM 中进行代码的首次尝试！


    ## 开始使用代码 – SAQL 简介


    本节将介绍你在 TCRM 中使用 SAQL 进行编码。


    ## 定义


    我们现在将查看有关 SAQL 是什么以及何时可以使用它的详细定义。


    ## 什么是 SAQL？


    **SAQL** 是一种运行时查询语言，可实现对数据集的即席分析。SAQL 脚本由一系列语句组成，这些语句由关键字（如 filter、group 和 order）、**标识符（IDs）**、文字或特殊字符组成。它基于
    **JavaScript Object Notation (JSON)** 并与 **Apache Pig Latin (PIGQL)** 相似。SAQL
    查询加载输入数据集，对其进行操作并输出结果。


    这里有一个 SAQL 示例：


    ```

    q = load "My_Dataset";

    q = group q by ''Division_Name'';

    q = foreach q generate ''Division_Name'' as ''Division_Name'', sum(''Amount'')/sum(''Quantity'')
    as ''sum_Amt/Qty''; q = order q by ''sum_Amt/Qty'' desc;

    ```


    你在前面的片段中看到的是基本 SAQL 元素，如下所示：


    - Load 语句用于加载数据

    - 流 ID——在此例中为 "q"

    - 使用各种 SAQL 函数和关键字的语句


    ## 何时使用 SAQL？


    当你需要进行自定义计算、即时高级数据操作、来自不同数据集的数据协同分组（连接）、顶部/底部列表，结合绑定以在图表上使用动态值等时，可以使用 SAQL。


    ## SAQL 使用哪种语法？


    以下是一些基本的 SAQL 语法：


    - 关键字和函数以小写书写且区分大小写。

    - 从数据集中调用的 **Application programming interface (API)** 名称应用单引号括起来，如下所示：''Division_Name''。

    - API 名称区分大小写。

    - 字符串必须用双引号括起来，例如 "Open"。


    ## 在哪里编辑 SAQL？


    每个透镜的每一步都是基于 SAQL 的，因此可以编辑和/或添加自定义 SAQL。这些可以在 JSON 编辑器模式下查看或复制到你选择的 JSON 编辑器中。


    按以下步骤查看如何查看和编辑 SAQL：


    1. 从 **Opportunities** 数据集创建一个新透镜。

    2. 随意向透镜添加筛选器。

    3. 随意向透镜添加分组。

    4. 选择两个度量。

    5. 通过点击透镜中图表右上角的 **Query Mode** 按钮更改为查询模式。


