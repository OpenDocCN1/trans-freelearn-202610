    ## Filtering data


    The filter node in data recipes enables you to quickly filter your data to suit
    the use case. That is, you can remove rows of data that you want to exclude from
    your output dataset(s).


    To filter your data, follow these steps:


    1. Add a new node (as shown in *Figure 4.3*) to your recipe and select **Filter**.

    2. Add filter conditions, as shown in *Figure 4.6*. If you choose to define a
    filter condition on a dimension column, you can select a filter value from the
    list.

    3. Click on **Apply**.

    4. Save the recipe.


    The following screenshot shows what the user interface (UI) looks like when adding
    filter conditions:


    ![](img/06379e43783b9ddfee45e9da5192efe1_97_0.png)


    Figure 4.6 – Adding filter conditions


    4. You can pivot dimensions as columns by adding up to two-dimension columns in
    the **Group Columns** field, selecting the values for each column, and clicking
    on **Apply**.

    5. Once your aggregations have been configured, click on **Apply**.

    6. Save the recipe.


    This is what the UI looks like when you add an aggregate node:


    ![](img/06379e43783b9ddfee45e9da5192efe1_99_0.png)


    Figure 4.7 – Applying an aggregate node to a recipe


    > **Note Regarding Aggregation And Data Granularity**

    > When you use the aggregate node, lower (source) data granularity is lost in
    that stream of the data recipe. However, the recent release enables you to bring
    back the granularity with joins after aggregation.


    Next, you will learn how to use the powerful transformation tools that are at
    your disposal in TCRM.


    ## Transforming data


    The transformation node provides a great deal of flexibility and functionality
    – the UI looks like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_100_0.png)


    Figure 4.8 – Adding a transformation node


    In this section, the following transformations will be covered:


    - Apply formulae

    - Trim

    - Substring

    - Split

    - Uppercase and lowercase

    - Replace

    - Dimension to measure

    - Dimension to date

    - Format dates

    - Bucket

    - Flatten

    - Edit attributes

    - Drop columns

    - **Detect sentiment**

    - **Predict missing values**

    - **Discovery predict**


    So, let''s get started with the first one!


    ### Apply formulae


    This creates a column in the recipe that displays values based on a formula calculation.
    This calculation will pull in data from other fields in the same row or across
    rows. You need to enter formulas in **EA-SQL format** – a collection of standard
    and custom functions for *numeric*, *string*, and *date* data.


    The formula dialog box looks like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_101_0.png)


    Figure 4.9 – Custom formula dialog box without (left-hand side) and with (right-hand
    side) the multiple row formula option enabled


    In order to add a formula to your recipe, follow these steps:


    1. Select a column in the **Preview** tab.

    2. To add the formula for the calculated column, select the **Formula** button
    in the **Transform** toolbar and select **Custom Formula**. The formula editor
    will then appear.

    3. In the formula editor, type in the formula and add the necessary parameters
    using the correct syntax.

    4. For formulas with window functions, select the **Multiple row formula** option.
    Choose the column used to partition the rows in **Partition By**, the column used
    to sort the data in **Order By**, and the sort direction in **Sort Direction**.

    5. Identify each column in the formula by its API name by either typing in the
    API name or selecting the column from the **Columns** tab.

    6. In **Output Type**, choose between text, numeric, date, or datetime.

    7. Depending on the output type, you can assign these attributes: **Precision**
    (the maximum number of digits in a numeric column), **Scale** (the number of digits
    to the right of the decimal point in a numeric column), **Length** (the maximum
    number of characters in a text column), and **Date Format**.

    8. In **Default Value**, set a value to show whether the expression returns no
    results.

    9. You can change the label of the calculated column as required.

    10. To add the formula as a step in the **Transform node**, click on **Apply**.
    The calculated column will then appear in the recipe preview.

    11. **Save** the recipe.


    > **Tip**

    > Common calculations have their own function buttons in the **Transform** toolbar
    – these fill in the formula with the correct column and syntax for you. The toolbar
    displays appropriate functions based on the number and type of columns selected.
    To use a function, just click on the **Function** button in the **Transform**
    toolbar.


    There are the five types of functions available:


    - **Date and time functions**: These are used to adjust or calculate values from
    dates in your recipe.

    - **Numeric operators and functions**: These are used to calculate values from
    measures in your recipe.

    - **String functions**: These are used to create values based on other strings.

    - **Window functions**: These are used to perform calculations across rows. The
    **Multiple Row Formula** option must be selected to use window functions.

    - **Additional functions**: These are used with the `text`, `number`, `date_only`,
    and `datetime` data types to add logic to formulae.


    ### Trim


    This transformation removes leading and trailing spaces from a string. You can
    choose to show the results in one of three places:


    - The original column (overwrite).

    - A new column – keep the original (the new column needs to be given a label).

    - A new column – drop the original (the new column needs to be given a label).


    ### Substring


    This starts at the character position in a value and extracts the number of characters
    in length into a new field. The formula editor will appear, and the following
    text will be prefilled:


    ```

    substr([target column], position, length)

    ```


    The inputs required for the substring function can be found in the dialog box,
    as follows:


    - **Output Type**

    - **Length**

    - **Default Value**

    - **Show Results In**

    - **Column Label**


    ### Split


    This transformation divides a column value into two new values at the specified
    delimiter. The inputs required are as follows:


    - **Delimiter**

    - **Show Results In**

    - **Column 1 Label**

    - **Column 2 Label**


    > **Note**

    > Split transformation always creates two new columns.


    ### Uppercase and lowercase


    This option converts values in the selected field into uppercase or lowercase.


    ### Replace


    This transformation finds a specific value in a field and replaces it with a new
    value. Note that a new field is created, which contains both the replaced values
    and the unchanged values. You can also use the replace transformation to replace
    nulls with a value.


    The inputs required are as follows:


    - **Find** or **Search** for null (in the search window)

    - **Replace** (in the search window)

    - **Show Results In**

    - **Column Label**


    ### Dimension to measure


    This transformation converts the `Dimension` column type into `Measure`, which
    allows mathematical calculations on its values. You can choose whether to show
    the results in the original column, in a new column and keep the original, or
    in a new column and drop the original.


    ### Dimension to date


    This transformation converts the `Dimension` column type into `Date`, which allows
    you to group and filter by date components, such as the year and the month. You
    can choose whether to show the results in the original column, in a new column
    and keep the original, or in a new column and drop the original.


    ### Format dates


    This transformation converts dates in the selected `Dimension` column into the
    specified format. Optionally, you can convert the column type into `Date`. A consistent
    format allows you to correctly filter and group records by date, including filtering
    by the date component, such as Day. A consistent date format also ensures that
    you can convert the column type from a dimension into a date.

