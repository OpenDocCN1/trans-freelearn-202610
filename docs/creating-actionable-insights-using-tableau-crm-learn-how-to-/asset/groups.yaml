    ### The limitations of TCRM for data connections


    You have learned what can be done in TCRM as far as data integration goes. Now
    you will learn some limitations of data integration, as demonstrated in the following
    list:


    - The results stored in Salesforce formula fields only update in TCRM datasets
    when full replication is performed for the relevant object.

    - The current limit for data sync (according to the Spring ''21 release) is 100
    objects.

    - Data sync only performs one sync per object. This is important if you need to
    perform multiple data syncs from one object.


