    this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_123_0.png)


    Figure 5.4 – The Joining Exercise dataset


    ## Bringing connected data together by joining


    When it comes to external data, TCRM provides a great deal of flexibility with
    a variety of data connectors, and these can be used to join external data with
    Salesforce data. Real-world examples of this include the following:


    - Connect order data from external **enterprise resource planning (ERP)** and
    join it with sales data in Salesforce so that you can compare pipelines, won deals,
    and actuals.

    - Connect target data from a **comma-separated values (CSV)** file stored in an
    **Amazon Web Services (AWS) Simple Storage Service (S3)** bucket so that up-to-date
    sales targets can be used to create a target line in sales charts for comparison.

    - Connect data from other Salesforce orgs so that the data from all Salesforce
    environments (databases) can be combined and viewed on a page in TCRM.

    - Connect service data from a business legacy platform via a MuleSoft connector
    and combine this with Salesforce case data for a comprehensive view of customer
    service.

    - Connect near-live inventory data, exported from an ERP platform and stored in
    Snowflake, via the Snowflake Direct Connector.

    - Connect sales opportunity data from an external spreadsheet via AWS S3 and append
    this data to Salesforce pipeline data for a complete list of opportunities.


    The following walkthrough shows you how to perform the last example, where we
    will append external sales data to Salesforce pipeline data for a complete list
    of opportunities, using AWS S3 and the TCRM connector. If you wish, you can create
    your own AWS S3 bucket using a free AWS account, add a CSV file with opportunity
    data, and follow along in your TCRM dev org. The following steps must be carried
    out in order:


    - 1. Go to **Data Manager** and select the **Connect** menu item on the left.

    - 2. Click on **Connect to Data**.

    - 3. Select **Input Connections** from a choice of three types of connections
    (input connections, MuleSoft connections, and live connections).

    - 4. Select **Amazon S3 Connector**.

    - 5. Under the **Set up your connection** dialog box, enter data as required,
    based upon your AWS S3 bucket details, noting that names must have no gaps.

    - 6. Click on **Save and Test**.

    - 7. When instructed **Select an object**, choose the **Opportunity** object,
    and hit **Continue**.

    - 8. When instructed **Select fields**, select **All**, and click on **Continue**.

    - 9. Review the **Preview Source Data** dialog box and press **Save**.

    - 10. You will then see the new connector in your list of active connections.

    - 11. Click on the dropdown to the right of your AWS S3 connector and click on
    **Run Data Sync**. This will bring in data from the S3 bucket and also enable
    data preview in the data prep window.

    - 12. Create a new dataset using Data Prep and begin with the **Opportunities**
    dataset.

    - 13. Click on the **Add Input Data** button (top left-hand side of the screen)
    and add the S3 opportunity data.

    - 14. Drag the + icon next to the S3 data node across to the **Salesforce Opportunity
    data** node, creating a **Join** node, and select **Append**.

    - 15. Under the **Append** node, in the **Data to Append** dialog box, map columns
    (fields) as required in order to join the new rows of data from your S3 bucket.

    - 16. Add an **Output** node to set up your new hybrid dataset that includes both
    Salesforce and external opportunity data.

    - 17. Click **Save and Run** to create the dataset.


    The following screenshot shows what your connector should look like after successful
    setup and prior to data sync:


    ![](img/06379e43783b9ddfee45e9da5192efe1_125_0.png)


    Figure 5.5 – The AWS S3 connector successfully set up in Data Manager, prior to
    sync


    In the following screenshot, you can see how things should look when the S3 dataset
    has been added to the data prep flow:


    ![](img/06379e43783b9ddfee45e9da5192efe1_125_1.png)


    Figure 5.6 – The S3 dataset added to the data prep flow


    The following screenshot shows what you see when opportunity data is appended
    to Salesforce data using the Join node:


    ![](img/06379e43783b9ddfee45e9da5192efe1_126_0.png)


    Figure 5.7 – S3 opportunity data appended to Salesforce data using the Join node


    There are many other examples of how to bring connected data together by joining;
    perhaps the only limit is your imagination and the ever-growing list of TCRM connectors!


    ## Advanced use of the aggregation node


    You already learned about the basic use of the aggregation node, but there are
    a number of ways in which this node can be used to a whole other level. Here are
    three examples:


    - You can create a number of data streams in the data prep flow, perform aggregation
    and rollup in each stream as required, then rejoin these streams and augment the
    granular data using a Join node.

    - Create two datasets, based upon the same data, that have different levels of
    base granularity for two different use cases: data visualization and analysis,
    and machine learning (ML) model building.

    - Join multiple Salesforce objects (such as **Account, Opportunity, and Product**),
    split the resulting dataset into several data streams, then use the **Aggregate**
    node to create roll-up summary datasets as required.


    You can see an example in the following screenshot of what it looks like when
    you create multiple data streams using aggregation nodes; this example uses only
    one Salesforce object, but the permutations and options are endless:


    ![](img/06379e43783b9ddfee45e9da5192efe1_127_0.png)


    Figure 5.8 – A simple example of multiple data streams using aggregation nodes


    ## Using unique and basic arithmetic functions


    As seen in *Chapter 4, Building Data Recipes*, a number of options are available
    when aggregating data. Let''s look at these in more detail.


    ### Using the Unique aggregation


    The **Unique** aggregation is useful when you do not want to generate a total
    count of rows, but you do want to count the number of unique occurrences of a
    certain value.


    For example, if you have a dataset that has a granularity of product-line items,
    you could count the number of occurrences of unique values of opportunities by
    record ID, and create a dataset that shows how many opportunities are associated
    with a certain product.


    ### Using basic arithmetic functions


    Basic arithmetic functions provide great flexibility to group and aggregate your
    data. The **Select Aggregate** dialog box for the **Aggregate** node is seen in
    the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_128_0.png)


    Figure 5.9 – Basic arithmetic operations in the Aggregate node


    Here are some examples of use cases for basic arithmetic operations in the **Aggregate**
    node:


    - Use **Average** to calculate the average age of closed/won opportunities to
    determine how long it takes to close deals, and group by industry to compare and
    benchmark.

    - Use **Maximum** to determine the longest time that it takes to resolve service
    cases, compare it to the business **service-level agreement (SLA)** metrics, and
    group by type of case to understand the "worst-case" scenarios for the business.

    - Use **Minimum** to understand and identify the lower ceiling of values for a
    grouping, such as minimum deal size or shortest time to close service cases.

    - Use **Stddevp** to calculate the spread of data distribution, such as a financial
    analyst using the Stddevp function to calculate deviations in revenue.

