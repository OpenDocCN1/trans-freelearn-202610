    these steps:


    - 1. Copy the link widget.

    - 2. Navigate to the Sales page.

    - 3. Paste the link widget; it should appear at the bottom of the page.

    - 4. You now need to make room for the link widget. First, remove the title from
    the Pipeline by Close Date hero chart, and save the text to your clipboard.

    - 5. Add a container widget at the bottom of the page and resize it to make room
    for the hero chart to be moved inside.

    - 6. Add a border to match the hero chart.

    - 7. Remove the border from the hero chart.

    - 8. Drag the hero chart into the container, then resize it to make room for a
    title.

    - 9. Drag a new text widget into the container.

    - 10. Move the link widget into the container at the far right.

    - 11. Change the text for the link widget to No Filters and make it link to the
    page in layout, Sales Clean.

    - 12. Move the container to the top of the page under the page navigator.

    - 13. Go into Preview mode and test the navigation.

    - 14. Click Save to save your dashboard.


    The Sales page with navigation added to the revised hero chart should look like
    this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_235_0.png)


    Figure 9.3 – Sales page with navigation added to the revised hero chart


    Let''s create a fresh dashboard to learn more about working pages and animation.
    Name this dashboard Clever Pages and change the settings as follows:


    - Columns: 50

    - Row Height: Fine

    - **Cell Spacing:** 0

    - **Maximum Dashboard Width:** 1200

    - **Background Color:** Choose white for the gutter and pick a dark color for
    the grid.

    - Under **Widget Default Properties**, make the background color transparent and
    add a transparent border.

    - Click **Save** to save the dashboard.


    To get started with your new dashboard, copy the highlights panel from **My Advanced
