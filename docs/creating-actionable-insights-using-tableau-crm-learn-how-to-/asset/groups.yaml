    # Advanced use of the aggregation node


    You already learned about the basic use of the aggregation node, but there are
    a number of ways in which this node can be used to a whole other level. Here are
    three examples:


    +   - You can create a number of data streams in the data prep flow, perform aggregation
    and rollup in each stream as required, then rejoin these streams and augment the
    granular data using a Join node.

    +   - Create two datasets, based upon the same data, that have different levels
    of base granularity for two different use cases: data visualization and analysis,
    and machine learning (ML) model building.'
