    # I can''t get to the TCRM home page from the Salesforce home page


    If you do not see **Analytics Studio** in the **App Launcher** in Salesforce,
    do the following:


    +   1. Click on **View All**.

    +   2. Search for **Analytics**.

    +   3. Click on **Analytics Studio**.


    You will then reach the TCRM home page.


    # Where is the link to reconfigure my TCRM app?


    This link can easily be missed, as the font is very small. Look in the top left-hand
    corner of the browser page, underneath the TCRM logo, and you will see the app
    title. Below the title you will see **Template used: Sales Analytics 5.0**—a **Reconfigure
    app** link is to the right of this phrase, in blue.


    You can also refer to Figure 2.17 to understand exactly where the **Reconfigure
    app** link is located. The new app data flow fails during app creation.


    If the data flow fails, the app creation process will not complete successfully.
    This failure may result in dashboard errors or other unexpected behavior. Do not
    edit the data-flow definition before it has run successfully at least once, or
    the app creation will be abandoned.


    There are three possible causes for a failed data flow in this context, as outlined
    here:


    +   1. **Field availability** or **org configuration**—Resolve this using the
    following steps:

    +      A. Fix the org configuration.

    +      B. Manually start the data flow via **Data Manager**.

    +      C. Click **Reset** in the app after the data flow completes.

    +      D. Complete the reset process without changing any of the options in the
    wizard.


    +   2. **Data Sync**: If **Data Sync** is enabled, the creation of new templated
    apps may fail during data-flow execution because fields or objects used in the
    apps have not yet been replicated. This might also happen because a new version
    of the TCRM app includes additional default fields. Resolve this using the following
    steps:

    +      A. Open **Data Manager**.

    +      B. Go to the **Connect** tab.'
