    - 10. Edit the task by changing the priority and adding comments.

    - 11. Click on **Save**.


    You did it! You created a task from a TCRM dashboard and edited that task in Salesforce
    with just a few clicks and no copying and pasting information!


    Here is the task on the opportunity record:


    ![](img/06379e43783b9ddfee45e9da5192efe1_336_0.png)


    Here is the end result:


    ![](img/06379e43783b9ddfee45e9da5192efe1_337_0.png)


    *Figure 12.6 – The final task that was created and edited via TCRM*


    Keep in mind that record actions in TCRM support these objects and global actions:


    - Create and update object records.

    - Log a call.

    - Custom actions to trigger Lightning components, flows, and Visualforce pages.

    - Lightning components that use Lightning events are supported in embedded dashboards
    but are not supported in Analytics Studio.

    - Standard Chatter actions, excluding *File*.


    Global quick actions and canvas apps are not supported in TCRM configured record
    actions. TCRM does not support actions assigned to a page layout for the user
    object.


    As you saw briefly in *Chapter 10, To Code, or Not to Code*, TCRM also offers
    the advanced functionality of bulk actions, where a group of records can be actioned
    in Salesforce with just a few clicks. However, as this is an advanced developer
    feature, it will not be covered in this book.


    Let''s now understand how to trigger an automation in Salesforce from TCRM.


    ## Why would you embed your dashboards?


    One of the great struggles in the world of data analytics and business intelligence
    is *user adoption*. It is often the case that organizations spend hundreds of
    hours and many thousands of dollars on capturing, analyzing, and visualizing,
    only for the project to fail miserably because business users simply don’t use
    and apply the insights.


    One way to address poor user adoption is to embed the insights in front of the
    user in the CRM workflow, where they will inevitably view the dashboards as they
    work in their **Business As Usual (BAU)** environment. This is very different,
    and much more effective, than asking users to remember to review dashboards during
    their busy workdays, even if they are only a tab away in Salesforce. It really
    is a game changer for analytics adoption.


    Here is an example that we created for one of our clients in the **Not-For-Profit
    (NFP)** space. In this use case, the NFP organization wanted insights about their
    donors added to the Salesforce home page and account record page. Once this was
    achieved, the usage of TCRM insights increased drastically, and users were able
    to action insights as a part of their daily BAU activity in Salesforce.


    Here is the NFP home page with an embedded TCRM dashboard showcasing donor segmentation
    insights:


    ![](img/06379e43783b9ddfee45e9da5192efe1_339_0.png)


    Figure 12.8 – The NFP home page with an embedded TCRM dashboard on the right


    Here is the account record with rich insights added from TCRM:


    ![](img/06379e43783b9ddfee45e9da5192efe1_340_0.png)


    Figure 12.9 – The NFP account record page with an embedded TCRM dashboard


    Is it difficult to embed TCRM dashboards in Salesforce? Do you need to be a developer?
    The answer to both questions is no. Let me show you how to embed your dashboards.


    ## How do you embed your dashboards?


    The best way to learn how to embed dashboards is to do it, so follow these steps
    to embed a simple dashboard on the account record page in Salesforce:


    - 1. Create a new blank dashboard and save it as `Mini Sales Insights` in My First
    Analytics App.

    - 2. Create and add a chart for sales by close date month.

    - 3. Create and add a chart for the pipeline by close date month.

    - 4. Save your dashboard.


    The end result should look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_341_0.png)


    Figure 12.10 – The Mini Sales Insights dashboard


    Now, let''s go ahead and embed this dashboard on the account record page in Salesforce.
    Follow these steps:


    - 1. Open any account record in Salesforce.

    - 2. Click on the Setup gear icon at the top right of the page.

    - 3. Click on Edit Page. You are now in the Lightning App Builder.

    - 4. From the list of components on the left, select the Tableau CRM Dashboard
    component and drag it onto the canvas below the highlights panel.

    - 5. Go into the component format panel on the right and make sure that Dashboard
    shows as Mini Sales Insights.

    - 6. Adjust the Height value for the component so that the TCRM dashboard fits
    nicely on the page layout. For my example, this was a height of 400.

    - 7. Leave the other options as they are.

    - 8. The dashboard is ready, except that it will show information for all accounts,
    and we want it to show only information for the account record being displayed.
    To add a filter that will accomplish this, click on Add Dashboard Filter.

    - 9. Select Opportunities under Dataset.

    - 10. Select Account ID under Dataset Field.

    - 11. Select Equals as Operator.

    - 12. Select Account > Id under Object Field.

    - 13. Click on OK.

    - 14. Click on Save.

    - 15. Activate the account record page and click on Assign as Org Default.

    - 16. Go back to the account page in Salesforce (the left arrow in the top-left
    corner in the Lightning App Builder).


    ![](img/06379e43783b9ddfee45e9da5192efe1_342_0.png)


    The format panel for the TCRM dashboard Lightning component should look like this:


    Figure 12.11 – Completed format panel for the TCRM dashboard Lightning component


    It is also worth noting that the visibility of the TCRM component can be controlled
    from this format panel, where filters can be added that control whether or not
    the embedded dashboard is visible to the logged-in user. These filters are based
    upon record fields or the device being used.


    I trust that this book has been a help to you, wherever you may be on your TCRM
    journey. I encourage you to dive into the platform and use it in real-world use
    cases, because the best way to learn is to solve problems, build assets, and deliver
