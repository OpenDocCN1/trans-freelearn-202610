    : {\n    \"type\": \"saql\",\n    \"query\": \"q = load \\\"bankingData\\\";\\\
    nq = filter q by date('Date_Year', 'Date_Month', 'Date_Day') in [\\\"current {{cell(static_1.selection,0,\\\
    \"value\\\").asString()}}\\\"..\\\"current day\\\"];\\nq = group q by all;\\nq\
    \ = foreach q generate unique('comb.CustomerID') as 'unique_comb.CustomerID';\\\
    nq = limit q 2000;\",\n    \"selectMode\": \"single\",\n    \"broadcastFacet\"\
