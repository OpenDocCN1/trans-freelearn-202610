    \n(https://www.gartner.com/en/doc/718161-top-10-trends-in-data-and-analytics-2020)\n\
    \n再读一遍：\n\n> “……数据与分析的作用正在不断扩大，并变得更加具有战略意义，也更加关乎任务成败……”\n\n企业和组织必须在数据分析方面做到卓越。他们必须擅长收集、理解、共享数据，并据此采取行动。当前的全球疫情造成了广泛的不确定性与动荡，使许多组织陷入岌岌可危的状态。人们对全球经济的疑虑、对持续性疾病的恐惧，以及国际和国内边境的关闭，共同促成了脆弱的心态和焦虑的组织文化。经济衰退、数字化颠覆和日益激烈的竞争，创造了这样一种环境：企业和组织不能忽视或低估数据与洞察的价值。数据分析已经成为当务之急。\n\
    \n然而，根据我的经验，真正擅长收集、理解、共享数据并据此采取行动的组织寥寥无几。即使在那些能够创建并维护有效数据分析体系的组织中，据估计，也有多达 75%\
    \ 的用户并不经常使用这些体系。正如我们的一位客户曾经说过的那样，领导者和团队成员都在“盲目飞行”。当然，我们今天并不缺少信息。不过我想大多数人都会同意，我们正遭受着*信息过载*——我们正*淹没在数据中*！数据既可以是福音，也可以是诅咒；既可以提供帮助，也可能造成阻碍。多年来，我一直在数据分析行业工作，并与许多企业和组织交流。对我而言，数据洞察显然是许多人感到挫败的主题。对于组织来说，本应是一项巨大助益的事物，事实上却成了负担。\n\
    \nTCRM 有能力改变这一切——前提是人们充分理解它、正确实施它，并恰当地使用它。\n\n我们的一个客户就是这样的例子。18 个月前，他们被数据淹没，却极度缺乏洞察。联合国儿童基金会（UNICEF）拥有分散在多个系统和云平台中的数\
    \ TB 信息，而获取可执行的洞察非常困难。对于像 UNICEF 这样以数据为驱动的组织而言，这令人十分沮丧。然而，在其内部团队的专业能力、TCRM 的强大功能，以及我们的分析专家和\
    \ Visioneer360 的帮助下，情况发生了彻底转变。这是可以做到的！\n\n从数据到洞察，再到行动的关键，就是数据分析。\n\n数据以原始、未经处理的形式存在时，包含着一个故事的各种要素——如果不将这些要素组合成一个数据“配方”来构成故事，它们的用处并不大。\n\
    \n我所说的**数据故事**是什么意思？数据故事是指对信息进行处理和呈现，使其能够讲述某种情境，并为读者得出有意义的结论。呈现数据故事的媒介和工具多种多样，但故事最终产生的结果是可执行的洞察。我经常用三个词的座右铭来表达这一点：\n\
    \n![](img/06379e43783b9ddfee45e9da5192efe1_21_0.png)\n\n图 1.1——三个词的座右铭\n\n组织并不缺少数据——它们缺少对这些数据的洞察，而且在很大程度上无法获得数据的真正价值。\n\
    \n每个组织都有数据。有些组织能够洞察其数据。能够将数据洞察付诸行动的组织却非常少。\n\n因此，挑战在于数据分析。这正是 TCRM 发挥作用的地方——它有潜力*转化数据、可视化洞察*并*促成行动*。\n\
    \n也许我的经历能够为此提供一些背景和启发。作为一名自学成才的 Salesforce 业务分析师，我负责在一家财务规划企业中实施和定制 Financial\
    \ Services Cloud。幸运的是，我能够与一支以数据为驱动的团队及其领导层合作。实施 Salesforce 的主要驱动因素之一，就是实现可执行业务洞察的愿景。这一过程涉及数据修复、文化变革以及分析构建等工作。当\
    \ Salesforce Reports 和 Dashboards 正常运行，并被团队成员和领导层使用后，人们开始认识到数据洞察的力量。然而，CEO 希望将其提升到新的层次：每周的管理会议完全通过\
    \ Salesforce 报告进行——不再使用幻灯片和电子表格！\n\n这一雄心勃勃的目标要求我将技能拓展到更高级的报告工具，因此我们决定购买 TCRM 许可证。学习该工具并构建有用的仪表板花费了一些时间，但最终成果令人印象深刻。每周管理会议期间都会分享\
    \ TCRM 仪表板，与会者能够深入查看数据，并根据实时信息作出业务决策。这彻底改变了游戏规则，我个人也深深着迷于 TCRM 的强大功能、灵活性和可执行性。\n\
    \n那么，要从数据中获得价值、获取可执行的业务洞察，需要什么？概括来说，需要满足五项要求：\n\n- 质量足够高的正确数据\n- 明确定义的业务目标\n-\
    \ 功能强大的数据分析工具\n- 能够创建数据故事的专业人员\n- 组织对使用、执行并改进洞察的承诺\n\n顺便说明，当然没有人拥有完美的数据，而数据分析的优势之一，就是能够评估数据质量并规划修复工作。不过，当数据质量和完整性过差，以至于分析仪表板的实用性受到严重影响时，与其进行分析，不如将时间投入数据修复。\n\
    \n现在，我们已经了解了数据分析的重要性，接下来将深入探讨本书的主题——TCRM。那么，TCRM 过去为什么被称为 Einstein Analytics？\n\
    \n"
