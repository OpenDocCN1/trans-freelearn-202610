  md: "\nWe are now going to learn how to create dashboard bindings using both JSON\
    \ and the **user interface (UI)**.\n\n## Tying things together with bindings\n\
    \nWhat are bindings in TCRM? Bindings are used to pass values between steps and\
    \ widgets—that is, parameterizing values for dynamic values and selections. Example\
    \ use cases include the following:\n\n- Dynamic reference lines\n- Dynamic groupings\n\
    - Dynamic measures\n- Dynamic sort\n- Dynamic chart types\n\nThere are two types\
    \ of bindings to consider. First, selection binding is used to update a query\
    \ based on the selection in another query, such as choosing a date range via a\
    \ toggle widget. Second, results binding is used to update a query based on the\
    \ results of another query, such as using a calculated value from a case statement\
    \ to bucket your data.\n\nTCRM is slowly moving away from requiring code to create\
    \ bindings, but many use cases still require development work in the JSON, as\
    \ you will see in the following section.\n\n## Bindings in JSON\n\nWe’re now going\
    \ to talk about JSON. You may be familiar with JSON, but perhaps not in the context\
    \ of TCRM. The following diagram shows how JSON and the TCRM dashboard fit together:\n\
    \n![](img/06379e43783b9ddfee45e9da5192efe1_253_0.png)\n\nFigure 9.15 – JSON and\
    \ the TCRM dashboard\n\nWhen in the dashboard editor, press Cmd + E (or Ctrl +\
    \ E) to show the JSON behind the dashboard. JSON is just the language in which\
    \ the instructions are written. The JSON contains all the widgets/charts descriptions\
    \ and the queries to run against the datasets. Each chart is actually several\
    \ lines of JSON describing the types and properties and the query to run. A special\
    \ case is when one of these queries is custom-written directly, using SAQL.\n\n\
    What is JSON? Put simply, it is descriptive instructions in a file made of a bunch\
    \ of keys and values enclosed in brackets { }. The values can be text, numeric,\
    \ Boolean, or arrays of text/numeric; you can have multiple brackets of such information.\
    \ Here is a simple breakdown of JSON:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_254_0.png)\n\
