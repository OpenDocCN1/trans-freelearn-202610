    ## 优秀的仪表板通过视觉清晰传达信息


    有效的分析将运用视觉理解和工具来辅助数据可视化与沟通。这包括审慎地使用以下元素：


    - 颜色

    - 形状

    - 边框

    - 对比度

    - 邻近性

    - 上下文


    我建议你学习和运用格式塔原则，以理解人们如何看待和理解数据，包括以下原则：


    - 闭合律

    - 共同区域律

    - 邻近律

    - 相似律

    - 对称律


