    Automation (PSA)** dashboard built on top of FinancialForce. You can see from
    the following screenshot that the risk impact and likelihood matrix (heat map)
    allows you to quickly drill into the project data, and then those insights can
    be actioned from the record view:


    ![](img/06379e43783b9ddfee45e9da5192efe1_290_0.png)


    Figure 11.2 – An actionable risks insights page for professional services automation


    The second example comes from our donor segmentation analytics built for non-profit
    institutions. The following dashboard allows you to drill into the donor segment
    and choose the appropriate cohort for an appeal:


    ![](img/06379e43783b9ddfee45e9da5192efe1_291_0.png)


    Figure 11.3 – The donor segmentation dashboard


    Once the correct cohort has been selected, you can action the insights by adding
    donor records directly to a Salesforce campaign, as seen here:


    ![](img/06379e43783b9ddfee45e9da5192efe1_291_1.png)


    Figure 11.4 – The donor segmentation record action


    The final example of going from data to insight to action is the student success
    insights dashboard. In this case, once the desired group of at-risk students is
    selected from the dashboard visualizations, intervention cases can be created
    in Salesforce and assigned to the appropriate student advisors directly from the
    dashboard record table, as seen in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_292_0.png)


    Figure 11.5 – The students at risk action list


    Now, we will consider the importance of business understanding in dashboard design.


    ## A good dashboard reflects and portrays business understanding


    A well-designed dashboard must reflect clear business understanding, not just
    data literacy and technical skill. Business users will not use or benefit from
    a dashboard that betrays a poor understanding of the business context. You must
    start with the business in mind and stay focused on the business throughout the
    design and build process.


    *Data analytics + Business understanding = Business insights*


    Let me give you three examples of this.


    The first example is a claims insights dashboard built for an insurance broker
    who needed highly bespoke analytics that reflected very particular business needs.
    This dashboard transformed the way the claims team worked and served their customers,
    as it was well aligned with the business context and desired deliverables, as
    shown in the following screenshot:


    ![](img/06379e43783b9ddfee45e9da5192efe1_293_0.png)


    Figure 11.6 – Claims insights driven by deep business understanding


    ![](img/06379e43783b9ddfee45e9da5192efe1_295_0.png)


    Figure 11.8 – Summary tiles provide an overview driven by business requirements


    The next point to consider in great dashboard design is the criticality of telling
    a story.


    ## A good dashboard tells a story with data


    Well-designed analytics tell a story with data. They will narrate a story simply,
    clearly, and concisely, resulting in a clear and actionable business strategy.
    If a user reviews your dashboard and is unable to understand and action a data
    story being told, then it is high time to redesign your dashboard!


    One example of data storytelling is seen in the following dashboard, where a summary
    of business performance is communicated clearly with great conciseness and simplicity:


    ![](img/06379e43783b9ddfee45e9da5192efe1_296_0.png)


    Figure 11.9 – Telling a business performance story simply with tiles


    Another example of storytelling with data is this manufacturing analytics dashboard,
    where the user is given a clear insight into the materials inventory, lead time,
    and their impact upon production:


    ![](img/06379e43783b9ddfee45e9da5192efe1_297_0.png)


    Figure 11.10 – Telling a manufacturing story with data


    One last example of how to make your dashboard tell a story is this fundraising
    performance analytics dashboard, where the key metrics for donors, giving, and
    performance are presented at the top, complemented by supporting insights:


    ![](img/06379e43783b9ddfee45e9da5192efe1_298_0.png)


    Figure 11.11 – Fundraising performance analytics – clear data flow and storytelling


    Now that you understand the importance of storytelling with data, you need to
    appreciate the power of a simple dashboard.


    ## A good dashboard is simple


    A good analytics dashboard design will tell a story with data, without the user
    becoming overwhelmed and confused with too much information. Therefore, in your
    designs, eliminate or minimize the following:


    - Clutter

    - Noise

    - Superfluous information

    - Unnecessary use of color

    - Distracting graphics

    - Anything that does not have a clear purpose for being on the page!


    Ideally, dashboard content should fit on just one screen.


    Here is an example of the beauty and power of simplicity in dashboard design –
    an uncluttered and insightful PSA dashboard that tells a story without adding
    anything that isn''t helpful or necessary:


    ![](img/06379e43783b9ddfee45e9da5192efe1_299_0.png)


    Figure 11.12 – A simple and intuitive PSA analytics home page


    Notice that this design shuns the use of any *fancy* visuals, relying simply upon
    the humble bar chart. A dashboard does not need to *impress* – but it does need
    to *inform!*


    The next example of simplicity in design is an equity insights dashboard built
    for a property development business. Note in the following screenshot that this
    design keeps things very simple and makes good use of white space to prevent clutter
    and complexity:


    ![](img/06379e43783b9ddfee45e9da5192efe1_300_0.png)


    Figure 11.13 – Simple equity analytics – making use of white space!


    Finally, consider this example of simplicity enhancing dashboard useability. The
    user home page contains an embedded TCRM dashboard with just three charts, providing
    the user with quick insights at the time of login. If they want to know more,
    note the OPEN link in the top-right corner:


    ## Figure 11.14 – Clear visualization of summary analytics on a home page


    When the OPEN link is clicked, the user is taken to a simple summary home page
    that provides headline metrics and links to detail pages:


    ## Figure 11.15 – Simple visuals telling a story for executives


    Note several things about this minimalist design:


    - The user has **Quick Links** to take them to common places of interest.

    - We made judicious use of white space to deliver a very simple layout.

    - The three charts were chosen because each one represents the key metric for
    each area of the business.

    - The heading for each tile is a TCRM link that takes the user to a detail page.

    - There is nothing superfluous that might distract the user from the data story.

    - A user can inspect this dashboard in under 30 seconds and decide whether they
    want to dive deeper or move on.


    Now, you will see the importance of ease of use in dashboard design.


    ## A good dashboard is intuitive and easy to use


    Great analytics design requires little or no instruction or training for use.
    It is truly intuitive – easy to understand or operate without explicit instruction.
    When a user sees an intuitive dashboard for the first time, they will know exactly
    what to do.

