    \ end)\nas 'Target Attainment';\nq = order q by 'Target Attainment' desc;\nq =\
    \ limit q 10;\n```\n\n## 按六个以上产品分组\n\n在 GUI 中，你最多只能按六个组进行分组。请参见以下截图：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_278_0.png)\n\
