    +   - **Converted**

    +   - **Converted Date**

    +   - **Country**

    +   - **Created Date**

    +   - **Email**

    +   - **Employees**

    +   - **Full Name**

    +   - **Industry**

    +   - **Lead Source**

    +   - **Phone**

    +   - **State/Province**

    +   - **Status**


    Go ahead and click **Create Dataset**. Review the monitor in **Data Manager**
    and proceed once the new **Leads** dataset has been created. First, you need to
    add a page navigator widget so that you can move easily between pages when in
    **Preview** mode. To do so, follow these steps:


    +   1. Drag the **Navigation** widget onto your **Marketing** page.

    +   2. Remove the border on the **Navigation** widget.

    +   3. Resize this widget by making it one cell higher.

    +   4. Move the **Navigation** widget up so that it butts against the highlights
    panel container.

    +   5. Format the **Navigation** widget so that it will stand out on the page
    but not conflict with other widgets. See *Figure 8.10* for an example.'
  - '[PAGE 223]


    +   6. Go to the **Sales** page and move all widgets (not including the highlights
    panel) down as required (use the arrow button on your keyboard while multiple
    widgets are selected to do so). This will make room for the **Navigation** widget.

    +   7. Under the **Move/Add** action at the bottom of the canvas, while the **Navigation**
    widget is selected, click on **Add to Page** and choose **Sales**.

    +   8. The **Navigation** widget should now show on the **Sales** page. If need
    be, move it into place, moving other widgets as required.


    The dashboard with the **Navigation** widget in place should look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_223_0.png)


    Figure 8.10 – Your dashboard with the Navigation widget in place


    Now, it''s time to build out the new page with marketing data. Follow these steps:


    +   1. Edit the dashboard and select the **Marketing** page.

    +   2. Create a new query based upon the **Leads** dataset.

    +   3. Group the count of rows by **Lead Source**.

    +   4. Rename the query **Leads by Source** and add this as a title.

    +   5. Choose a **Donut** chart for the query.

    +   6. Click on **Done**.

    +   7. You will now notice that the **Query** panel now lists queries under **Leads**
    as well as **Opportunities**.

    +   8. Drag this new **Leads** query onto the canvas.

    +   9. Resize and format the **Chart** widget to suit your preference. In my example,
    seen in the following screenshot, I chose to create a pie chart with a **Center
    Size** value of 0% and show the pie chart value as **Percentage**.

    +   10. Create and add a widget for **Leads by Status**—use an Origami chart and
    put the legend at the top center.'
  - '[PAGE 224]


    +   11. Create and add a widget for **Leads Count by State and Status**—use a
    stacked column chart.

    +   12. Create and add a widget for **Heat Map of Source and Status**.

    +   13. Format and edit to suit your preference.

    +   14. Click **Save** to save the dashboard.

    +   15. Add a **List** widget for **Lead Source** to the highlights panel. Change
    **Selection Type** to **Multiple Selection**.

    +   16. Add a **List** widget for **Industry** to the highlights panel.

    +   17. Add a **Number** widget for **Total Leads** to the highlights panel.

    +   18. Add a **Number** widget for **Open Leads** to the highlights panel (filter
