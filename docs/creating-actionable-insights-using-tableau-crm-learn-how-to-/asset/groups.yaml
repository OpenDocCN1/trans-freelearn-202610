    \n现在，我们将探讨一些需要在 SAQL 中编写代码的用例。\n\n## SAQL 表达式\n\n当查询需要比 GUI 所能提供的更复杂的逻辑或更高的自定义程度时，需要使用\
    \ SAQL。\n\n## 联合（Union）\n\n若要在一次查询中组合不同的数据流并进行处理，则需要使用 SAQL。\n\n以下是一个计算支出占目标百分比（以\
    \ JSON 格式表示）的示例：\n\n```\n\"steps\": {\n    \"Spending_as__of_Tar_1\": {\n    \
    \    \"broadcastFacet\": true,\n        \"groups\": [],\n        \"label\": \"\
    Spending as % of Target\",\n        \"numbers\": [],\n        \"query\": \"spend\
    \ = load \\\"bankingData\\\";\\nspend = group spend by ('Date_Year', 'Date_Month');\\\
    nspend = filter spend by date('Date_Year', 'Date_Month', 'Date_Day') in [\\\"\
    30 days ago\\\"..\\\"current day\\\"];\\nspend = foreach spend generate 'Date_Year'\
    \ + \\\"~~~\\\" + 'Date_Month' as 'Date_Year~~~Date_Month', sum('Amount') as 'sum_Amount',\
    \ 0 as 'sum_Target';\\n\\ntarget = load \\\"Industry_Targets\\\";\\ntarget = group\
    \ target by ('Date_Year', 'Date_Month');\\ntarget = filter target by date('Date_Year',\
    \ 'Date_Month', 'Date_Day') in [\\\"30 days ago\\\"..\\\"current day\\\"];\\ntarget\
    \ = foreach target generate 'Date_Year' + \\\"~~~\\\" + 'Date_Month' as 'Date_Year~~~Date_Month',\
    \ sum('Target') as 'sum_Target', 0 as 'sum_Amount';\\n\\nboth = union spend, target;\\\
    nboth = group both by all;\\nboth = foreach both generate sum('sum_Target') as\
    \ 'Target', sum('sum_Amount') as 'Spend';\\nboth = foreach both generate sum('Target')\
    \ as 'Target', sum('Spend') as 'Spend', 100*(trunc(('Spend'/'Target'),3)) as '%\
    \ of Target';\\n\",\n}\n```\n\n另一个示例使用 union 将“去年生成”和“今年转化”的信息合并到一个表中：\n\n```\n\
    q = load \"OppOwnerAcnt\";\nq_A = filter q by ('AccountId.Type' == \"Partner\"\
    \ or 'Type' == \"New Business\") && date('CloseDate_Year', 'CloseDate_Month',\
    \ 'CloseDate_Day') in [\"1 year ago\"..\"1 year ago\"] ;\nq_B = filter q by ('AccountId.Type'\
    \ == \"Partner\" or 'Type' == \"New Business\") && date('CloseDate_Year', 'CloseDate_Month',\
    \ 'CloseDate_Day') in [\"current year\"..\"current year\"] ;\nresult = group q_A\
    \ by all full, q_B by all;\nresult = foreach result generate sum(q_A.'Amount')\
    \ as 'A', sum(q_B.'Amount') as 'B';\nfinal1 = foreach result generate \"Last Year\
    \ Generated\" as 'Description', sum('A') as 'Sum';\nfinal2 = foreach result generate\
    \ \"This Year Converted\" as 'Description', sum('B') as 'Sum';\nfinal = union\
    \ final1,final2;\n```\n\n## 分组、汇总、小计、平均值等\n\n添加自定义的复杂分组、汇总、小计、平均值等通常需要使用 SAQL。\n\
    \n下面是一个用户想要识别前 5% 客户的示例：\n\n```\nq = load \"Wave_Sample_Opportunities\";\nq =\
    \ group q by 'Account_Name';\nq = foreach q generate 'Account_Name', sum('Amount')\
    \ as 'sum_Revenue', rank() over ([..] partition by all order by sum('Amount'))\
    \ as 'Position', sum(1) over ([..] partition by all) as 'count';\nq = foreach\
    \ q generate 'Account_Name', 'sum_Revenue', ( case when 'Position' >= (floor(((95*'count')\
    \ + 1)/100)) then \"Top 5 %\" else \"Rest\" end ) as 'Bracket';\nq = filter q\
    \ by 'Bracket' != \"Rest\";\nq = group q by ('Account_Name', 'Bracket');\nq =\
    \ foreach q generate 'Bracket' as 'Bracket', 'Account_Name' as 'Account Name',\
