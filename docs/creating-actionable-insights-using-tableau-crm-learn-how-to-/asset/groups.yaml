    +   5. Remove the `limit` statement.

    +   6. Click **Save** to save your lens.


    Now that you have your basic SAQL prepared, add the following case statement:


    ```

    result = foreach q generate ''Name'' as ''Name'', ''sum_Amount'' as ''Amount'',
    (case when ''sum_Amount'' > 2000000 then "Big" when ''sum_Amount'' > 500000 then
    "Medium" else "Small" end) as ''Size'';

    ```


