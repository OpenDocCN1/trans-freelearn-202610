    \ trunc(avg('Average'),-2) as 'Avg Amount';\",\n\"referenceLines\": [\n{\n\"color\"\
    : \"#9271E8\",\n\"label\": \"Target = {{cell(gaugeRef6_1.result,0,\\\"target\\\
