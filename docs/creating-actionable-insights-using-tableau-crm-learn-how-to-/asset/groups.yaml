  - "[PAGE 148]\n\n# Predict Missing Values – how and when to use\n\nWhen can you\
    \ use the **Predict Missing Values** transform to fill in missing values in a\
    \ dimension column? First, in order to make an accurate prediction, each column\
    \ must have fewer than 200 unique values. Also, you must verify that these predictive\
    \ columns contain clean, high-quality data, or the predicted values will be misleading.\n\
    \nHow can you use the **Predict Missing Values** transform? Note the following:\n\
    \n+   - When you click **Apply** to add a transformation to the **Transform**\
    \ node, the preview pane will show the original column with the missing values\
    \ and the new column with **Predict** at the end of the header.\n+   - You will\
    \ see **Prediction TBD** for predicted values in the new column.\n+   - The predicted\
    \ values will not appear until after you run the recipe.\n+   - Run the recipe\
    \ to generate the predictions—you can then view the dataset as a values table\
    \ to see the predictions.\n+   - Add the **Drop Columns** transformation after\
    \ the **Predict Missing Values** transformation to drop the original column from\
    \ the dataset, as required.\n\n> **Limitations to Keep in Mind**\n> \n> Firstly,\
    \ if there are not enough rows to make accurate predictions, TCRM will not insert\
    \ any predicted values. Secondly, you cannot apply any transformations on predicted\
    \ columns. Finally, recipes that predict values can sometimes take longer to run.\n\
    \n# Sentiment detection explained\n\nUsing **natural language processing (NLP)**\
    \ and ML, sentiment detection can extract valuable information from text fields,\
    \ such as reviews, case comments, and social media posts. Use the **Detect Sentiment**\
    \ transformation in a Data Prep recipe to categorize that information into one\
    \ of the following three sentiments:\n\n+   - **Positive**\n+   - **Negative**\n\
    +   - **Neutral**\n\nIn other words, you don't need a new ML project, an ML system,\
    \ new infrastructure, or a separate data pipeline to detect sentiments from your\
    \ unstructured data. The **Detect Sentiment** transformation in TCRM Data Prep\
    \ does it all!"
  - '[PAGE 149]


    Some potential use cases for the **Detect Sentiment** transformation include the
    following:


    +   - Customer service/**customer satisfaction (CSAT)** based upon survey responses

    +   - Sales coaching and trend identification

    +   - Social media brand management


    The **Detect Sentiment** transformation supports English text only and works on
    a single-dimension column. It processes non-English text as English and ignores
    all images. The transformation returns `null` when the input value is `null` and
    returns `neutral` when the input value is an empty string (`''''`).


    # Advanced hands-on exercise


    The purpose of this exercise is to create a single dataset that contains a summary
    of every account that meets all of the following conditions: has open opportunities,
    at least one activity, and an open case attached to the account.


    The resulting dataset should allow the user to determine the following via direct
    exploration of the lens based on the dataset:


    +   - Account name

    +   - Age of account

    +   - Owner name

    +   - No. of open opportunities

    +   - No. of open cases

    +   - Average case duration

    +   - No. of activities

    +   - Total amount

    +   - Total expected amount

    +   - Total amount (opportunity with line items)

    +   - Total amount (opportunity without line items)'
