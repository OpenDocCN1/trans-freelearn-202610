    Note several things about this minimalist design:


    +   - The user has **Quick Links** to take them to common places of interest.

    +   - We made judicious use of white space to deliver a very simple layout.

    +   - The three charts were chosen because each one represents the key metric
    for each area of the business.

    +   - The heading for each tile is a TCRM link that takes the user to a detail
    page.

    +   - There is nothing superfluous that might distract the user from the data
    story.

