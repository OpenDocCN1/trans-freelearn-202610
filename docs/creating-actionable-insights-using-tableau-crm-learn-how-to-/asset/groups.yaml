    ![](img/06379e43783b9ddfee45e9da5192efe1_34_0.png)


    图 1.12 – TCRM 中房地产开发解决方案的示例仪表板视图


    ## 营销归因分析


    一家医疗保健领域的营销企业要求我们围绕营销归因构建高级分析，最终目标是提供闭环归因分析解决方案。这是一个相当大的挑战！


    - 1. 我们的客户无法展示其客户的营销投资实际回报和预测回报。策略非常碰运气。

    - 2. 客户的客户拥有大量数据，但无法利用这些数据就营销渠道做出明智决策。

    - 3. 客户代表客户手动提取的分析数据有限。这些分析并未推动智能业务决策。

    - 4. 分析是诊断性和描述性的，但不是预测性和规范性的。


    使用 TCRM 和 Einstein，我们构建了一个创新的 Analytics App，提供以下功能：


    - 集成 AI 洞察和预测的前沿数据分析

    - 来自 Einstein Discovery AI 的智能推荐


    结果使客户能够推动渠道效率和营销优化。收益包括营销投资的投资回报率提升以及患者忠诚度提升和患者体验增强。让我们查看一下此解决方案的一些截图。


    以下是首页视图：


    ![](img/06379e43783b9ddfee45e9da5192efe1_35_0.png)


    图 1.13 – 归因分析解决方案的首页


    以下是投资回报率洞察页面视图：


    ![](img/06379e43783b9ddfee45e9da5192efe1_36_0.png)


    图 1.14 – 归因分析解决方案中的投资回报率分析


    以下是客户终身价值 (LCV) 页面视图：


    ![](img/06379e43783b9ddfee45e9da5192efe1_36_1.png)


    图 1.15 – 归因分析解决方案中的 LCV 分析


    TCRM 的其他用例还包括对以下方面的洞察：


    - 销售绩效，例如实际值和预测值与目标的对比。

    - 按线索来源、地区和团队成员划分的线索转化率。

    - 营销活动的投资回报率。

    - 案例管理和服务团队绩效。

    - 按地区、销售区域和国家划分的全球销售分解。

    - 按地区和团队预测销售。

    - 客户流失。

    - 客户获取。

    - 客户满意度。

    - 供应链绩效，识别瓶颈和机会。

    - 金融服务合规性，利用前瞻性分析识别可能违规的客户。

    - 高等教育绩效和学生成功。

    - 教育机构的交叉销售和追加销售机会。

    - 销售组织的空白空间分析。

    - **非营利组织 (NFP)** 的筹款绩效。

    - NFP 募捐的捐赠者细分。

    - 项目管理风险和问题。

    - 专业服务企业的资源分配和优化。

    - 地理空间数据。

    - 收入、支出、利润等！


    希望本节能帮助您了解我们如何使用 TCRM 解决问题并把握机会。记住，一切都关乎 **数据 -> 洞察 -> 行动**，如 *图 1.1* 所示。


    在下一节中，我们将审视您的组织并评估您如何利用数据和分析。


    '
