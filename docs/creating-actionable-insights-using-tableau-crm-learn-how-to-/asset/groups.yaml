    Now, let''s examine Salesforce sharing inheritance.


    ## Deploying Salesforce sharing inheritance


    If you want the sharing setup for your datasets to replicate the ones that are
    applied for your objects by Salesforce, then you can do this by deploying sharing
    inheritance.


    Sharing inheritance reduces or eliminates the need for complex security predicates
    in many cases. On the flip side, applying sharing inheritance results in an increase
    in the time required to process data and create/update datasets – completing data
    syncs, recipe jobs, and more. Keep in mind that the more complicated the sharing
    settings are, the more impact there is on data processing time. Keep in mind that
    the time taken for data processing will have a higher impact if the sharing settings
    are more complicated.


    The Salesforce admin most likely uses a combination of sharing settings to provide
    users with access to Salesforce data about their roles, including sharing based
    on the following:


    - Manual sharing rules

    - Role hierarchy

    - Role

    - Group

    - Apex-managed sharing

    - Team-based sharing


    You may enable sharing inheritance to use the Salesforce sharing settings in Tableau
    CRM, but only for a limited selection of supported objects. When creating or editing
    datasets, be sure to specify the objects to inherit sharing from. The supported
    objects are as follows:


    - Account

    - Case

    - Contact

    - Lead

    - Opportunity


    To enable sharing inheritance, you need to switch on sharing inheritance. Next,
    select the objects that are to be used as sharing sources. Note that sharing inheritance
    is turned on by default in new Salesforce environments.


    After you turn on sharing inheritance, it is best practice to run the Sharing
    Inheritance Coverage Assessment report on an object, then the users for that object,
    to investigate how well sharing inheritance will work for you. Under **Analytics**,
    from the **Salesforce Setup** menu, select **Sharing Inheritance Coverage Assessment**.


    > **Note**

    >

    > It is a best practice to test sharing inheritance in a sandbox environment before
    deploying it to production. This lets you test use cases against your environment''s
    security model and data to be confident that sharing inheritance will work as
    desired.


    To turn on sharing inheritance, follow these steps:


    - 1. In the **Setup Quick Find** box, enter **Analytics** and click **Settings**.

    - 2. Choose **Inherit sharing from under Salesforce** and click **Save**.


    If **Data Sync** is enabled, you must turn on sharing inheritance for every object
    that you will use as a sharing source. Follow these steps to do so:


    - 1. In Tableau CRM Studio, click on **Data Manager**.

    - 2. In **Data Manager**, click on **Connect**.

    - 3. Click on the **dropdown list** on the right end of the row to find the object
    you want to enable.

    - 4. Click on **Row Level Sharing**.

    - 5. Turn **Sharing inheritance on**.

    - 6. Click on the **Save** button.


    Sharing inheritance does have some limitations. For example, one challenge is
    the amount of space that is consumed by the sharing rules in a TCRM instance.


    Other limitations and considerations for Salesforce sharing inheritance are as
    follows:


    - It can only be applied if all supported object records have less than 400 sharing
    descriptors each.

    - It can impede the performance of queries, dataflows, and data prep recipes.


    For detailed, up-to-date technical information and specifications, go to `https://help.salesforce.com/s/articleView?id=sf.bi_security_datasets_sharing_about.htm&type=5`.


    Now, let''s examine the most powerful and flexible tool at your disposal: security
    predicates.


    ## Understanding the concept and usage of security predicates


    Data visibility in TCRM can be controlled using security predicates. As we mentioned
    earlier, row-level security for a dataset that is defined by a filter condition
    is called a predicate. Predicates can control data visibility based on these scenarios:


    - **Role Hierarchy**: In the Salesforce org, predicates can filter the data based
    on the user''s role, but only if they are logged in. A user can only view the
    records that are owned by them or by the people below them in the role hierarchy
    in Salesforce.

    - **Manager Hierarchy**: In the User object, predicates can filter the data based
    on the Manager field in the User object. Therefore, the logged-in user may view
    the records that are owned by them, and by any user that reports under them in
    the manager hierarchy.

    - **Logged-in User''s Country**: The data can also be filtered based on the logged-in
    user''s country, by the predicates. A user from one country can access the records
    that are owned by the users from the same country.

    - **Opportunity Team and Accounts Team**: If data visibility needs to be governed
    depending on the logged-in users being part of the Opportunity Team and Accounts
    Team of the record owner, then predicates can be used for this as well.

    - **User Territory**: Predicates can implement row-level security based upon User
    Territory.

    - **A Combination of Various Requirements**: Defines a predicate based on a combination
    of these scenarios.


    When defining a security predicate expression, you must use a valid syntax:


    ```

    <dataset column> <operator> <value>

    ```


    Here is an example:


    ```

    ''UserId'' == "$User.Id"

    ```


    Let''s look at each of the components in the preceding example:


    - `UserId`: This is the name of the API of the dataset column.

    - `==`: This is the operator.

    - `$User.Id`: This is the Salesforce User ID for the logged-in user.


    Make sure to note the following points regarding predicate expressions:


    - They are case-sensitive.

    - They cannot contain more than 5,000 characters.

    - Before and after the logical operators, between the operator and the value,
    and between the column and the operator, at least one space must be present.

    - Single quotes must be used to enclose dataset column, such as `OwnerId`.

    - The values for the expression can be field values from the User object in Salesforce.

    - String, number, and multi-value picklist fields are supported by the User object.

    - Values can be strings or numbers.

    - You must possess read access to the relevant User object fields to define a
    predicate for a dataset.


    For example, the following is not a valid expression:


    ```

    `''Revenue''>100`

    ```


    It must contain spaces, as shown here:


    ```

    `''Revenue'' > 100`

    ```


    Here are four examples of security predicates for datasets:


    - `Static Filter: ''Product.Family'' == "Phones"`

    - `Record Ownership: ''Opportunity.OwnerId'' == "$User.Id"`

    - `Role Hierarchy: ''Opportunity.OwnerId'' == "$User.Id" || ''Opportunity.User_Role_Id_Path''
    == "$User.UserRoleId"`

    - `Custom: ''Opportunity.OwnerId'' == "$User.Id" || ''Opportunity.User_Role_Id_Path''
    == "$User.UserRoleId" || ''Opportunity.View_All_Settings'' == "$User.View_All__c"`

