  - '[PAGE 208]


    +   - **Pick Initial Values**: Set the default filter and facet values for the
    dashboard; these will apply every time the dashboard is opened.

    +   - **Conversations**: Lets you query your data using conversational, everyday
    language. This needs to be enabled and the correct permissions assigned for the
    user to see and use this functionality.

    +   - **Connect Data Sources**: Join data sources using a common field.

    +   - **Delete**: Permanently delete the dashboard.


    It''s now time to flesh out your dashboard.


    # Creating a dashboard and placing widgets


    The best way to show you how to build a dashboard and help you become familiar
    with the dashboard editor is to walk you through a simple dashboard build.


    # Creating a sales dashboard


    We will create a sales dashboard based upon the **Opportunities** dataset in **My
    First Analytics App**. Follow these steps:


    +   1. Create a fresh query by clicking on the **Create Query** button on the
    right-hand side of the canvas.

    +   2. Select the **Opportunities** dataset in **My First Analytics App**. This
    brings you to a view that is familiar to you as being almost identical to a lens.

    +   3. At the top left, where you see a pencil icon, rename the query **Pipeline
    by Close Date**.

    +   4. Change the measure (**Bar Length**) to **Sum of Amount**.

    +   5. Add a grouping (**Bar**) for **Close Date (Year-Month)**.

    +   6. On the far right, click on the Charts icon and change the chart type to
    **Time Bar** in the **DATES & TIMES** category.

    +   7. Add a filter for **Closed** equal to the value of **False** (as in, open
    opportunities).

    +   8. Click **Done**, which will close the window.


    The query now appears in the query list on the right, under the **Opportunities**
    dataset.


    +   9. Drag the query onto the canvas. This creates a chart widget.

    +   10. Enlarge the widget by dragging the handles.

    +   11. Click **Save** to save your dashboard.'
