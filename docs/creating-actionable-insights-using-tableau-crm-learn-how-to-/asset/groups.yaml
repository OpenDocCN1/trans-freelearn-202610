    \n## 总结\n\n现在你已经初步涉足了更高级的TCRM设计和构建。我鼓励你运用所学知识并善加利用——在你的开发组织中练习使用这些高级工具，并熟练掌握它们。\n\
    \n你学到了什么？首先，你创建和编辑了TCRM页面，以帮助你构建更高级的仪表盘功能。接下来，你通过使用SAQL了解了TCRM代码。第三，你学习了使用绑定构建动态仪表盘的基础知识。最后，你利用高级编辑器通过点击而非代码来构建交互。\n\
    \n下一章将教你何时需要编码，何时不需要编码。\n\n## 问题\n\n以下是一些测试你知识的问题：\n\n- 给出三个使用TCRM页面的用例示例。\n-\
    \ 当你在仪表盘内从一个页面移动到另一个页面时，已应用的筛选器是保留还是被清除？\n- 你何时可能需要SAQL？\n- 关键字和函数以大写书写且不区分大小写。对还是错？\n\
    - 你在哪里编辑SAQL？\n- 你使用哪个键盘快捷键来访问仪表盘JSON？\n- 给出三个使用绑定使仪表盘更具交互性和动态性的用例示例。\n\n## 10\
    \ 编码还是不编码？\n\nTableau CRM（TCRM）管理员和开发人员面临的最大挑战之一就是知道何时编码，何时不编码。这会造成相当大的困惑。本章的目的是通过大量实际示例指导你如何确定何时需要代码。\n\
    \n在需要代码的地方，会给出源代码示例。但请注意，本书并非旨在成为Tableau CRM开发人员的详细手册。此外，所给出的代码片段由于必要，通常只是完整源代码的一小部分。\n\
    \n在本章中，我们将涵盖以下主题：\n\n- 你何时需要代码？\n- 如果……你可能不需要编码……\n- 歧义的情况\n\n## 技术要求\n\n你需要满足以下要求才能成功执行本章中的操作：\n\
    \n- 最新版本的Google Chrome浏览器（Chrome是使用TCRM时的首选浏览器）\n- 一个可用的电子邮件地址\n\n确保你已登录到你的TCRM开发组织。\n\
    \n让我们首先了解在TCRM应用程序中可能需要在哪些地方使用代码。\n\n## 你何时需要代码？\n\n自Salesforce于2014年推出Wave以来，TCRM的GUI确实已经取得了长足的进步。该平台的早期用户被迫在JSON、SAQL和XMD中构建一切，因为基本上没有声明式选项。现在情况不同了，每次TCRM的新版本都提供更多的点击式功能。\n\
    \n然而，当你在进行更高级的数据转换和仪表盘构建时，TCRM的某些应用确实需要代码。\n\n以下是TCRM中需要部署代码的六个常见应用：\n\n- 安全谓词\n\
    - JSON中的绑定\n- SAQL表达式\n- 批量操作（使用Visualforce和TCRM REST API）\n- `timeseries`（已修改）\n\
    - XMD – 高级格式选项\n\n让我们从安全谓词开始。\n\n## 安全谓词\n\n正如你在*第7章：Tableau CRM中的安全*中所看到的，谓词是一种为数据集定义行级安全的筛选条件。安全谓词根据需求从极其简单到高度复杂不等。所有谓词至少需要一点点代码。\n\
    \n例如，请看下面的代码：\n\n```text\n'FFACompanyId' == \"Unknown\" || 'UserCompany.c2g__User__c'\
    \ == \"$User.Id\"\n```\n\n另一个例子如下：\n\n```text\n'Owner.Role.Roles' == \"$User.UserRoleId\"\
    \ || 'OwnerId' == \"$User.Id\" || 'Account.OwnerId' == \"$User.Id\"\n```\n\n有关安全谓词的详细信息和说明，请参阅以下参考指南：\n\
    \nhttps://resources.docs.salesforce.com/latest/latest/en-us/sfdc/pdf/bi_admin_guide_security.pdf\n\
    \n接下来，你将学习如何使用代码在仪表盘JSON中创建绑定。\n\n## JSON中的绑定\n\n我们现在将研究在仪表盘绑定中使用JSON的几种方式。\n\n\
    ### 动态图表\n\n用户可以通过在仪表盘上进行切换选择来动态选择可视化类型。以下是此选择绑定可能看起来的示例：\n\n```text\n{{coalesce(cell(static_1.selection,\
    \ 0, \\\"visualizationType\\\"), cell(static_1.result, 0, \\\"visualizationType\\\
    \")).asString()}}\n```\n\n在仪表盘JSON中，它可能看起来像这样：\n\n```json\n},\n    \"axisMode\"\
    : \"multi\",\n    \"tooltip\": {\n        \"showBinLabel\": true,\n        \"\
    measures\": \"\",\n        \"showPercentage\": true,\n        \"showDimensions\"\
    : true,\n        \"showMeasures\": true,\n        \"customizeTooltip\": false,\n\
