    \ are going to build a simple dataset to analyze the impact of the opportunity\
    \ owner and lead source upon the win rate of opportunities. The relevant objects\
    \ that you will use for this analysis are as follows:\n\n- (a) **Account**\n-\
    \ (b) **Contact**\n- (c) **Opportunity**\n- (d) **User**\n\n- 5. Because your\
    \ lowest granularity, or finest detail, is the opportunity object, you will begin\
    \ there. So, type `Opportunity` into the search window to choose the first object,\
    \ which will then bring you to this dialog box:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_80_0.png)\n\
    \nFigure 3.7 – Beginning with the dataset builder\n\n- 6. Next, hover over the\
    \ object and click on the + button – this will give you the option to add fields\
    \ or related objects to the **Opportunity** object, as shown in the following\
    \ screenshot:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_80_1.png)\n\nFigure\
    \ 3.8 – Adding fields and relationships to the root object\n\n7. Go ahead and\
    \ pick the following fields:\n\n- (a) **Amount**\n- (b) **Close Date**\n- (c)\
    \ **Lead Source**\n- (d) **Name**\n- (e) **Opportunity ID**\n- (f) **Stage**\n\
    - (g) **Won**\n\n> **Note**\n> It is important to make sure that you select any\
    \ ID fields that will be required to add object relationships to the dataset;\
    \ otherwise, the related objects will have no key to link to. When I add a new\
    \ object related to the base object, I always add the object ID in case it is\
    \ required later for relationship building.\n\n8. Next, click on the **RELATIONSHIPS**\
    \ tab and join the following objects:\n\n- (a) **Account (Account ID)**\n- (b)\
    \ **Contact (Contact ID)**\n- (c) **User (Owner ID)**\n\nYou should now have an\
    \ object relationship map that looks like this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_81_0.png)\n\
    \nFigure 3.9 – The object relationship map\n\n9. Follow a similar process for\
    \ the **Account**, **Contact**, and **User** objects, and add the fields as mentioned.\
    \ For **Account**, add the following fields:\n\n- (a) **Account ID**\n- (b) **Account\
    \ Name**\n- (c) **Industry**\n- (d) **Billing Country**\n- (e) **Billing City**\n\
    - (f) **Billing State/Province**\n\n10. For **Contact**, add the following fields:\n\
    \n- (a) **Contact ID**\n- (b) **Full Name**\n- (c) **Mailing Country**\n- (d)\
    \ **Mailing City**\n- (e) **Mailing State/Province**\n\n11. For **User**, add\
    \ the following fields:\n\n- (a) **User ID**\n- (b) **Full Name**\n\n12. Now,\
    \ what if you wanted to add information about the account owner? How would you\
    \ do that? Let's consider the following options:\n\n- (a) Finish creating the\
    \ dataset in the dataset builder and then make the required changes to the data\
    \ prep tool.\n- (b) Add a relationship to the account object in the dataset builder.\n\
    - (c) Finish creating the dataset in the dataset builder and then use a dataset\
    \ recipe to add information about the account owner.\n\nIf you answered (b) –\
    \ *Add a relationship to the account object in the dataset builder* – then you\
    \ were correct. More complex changes might require you to use a recipe or the\
    \ TCRM data prep tool, but adding information about the account owner can be performed\
    \ easily in the dataset builder.\n\n13. Follow a similar process to what you did\
    \ so far, and add the account owner information (the **User** object).\n\n17.\
    \ Click on the refresh button – highlighted in **Figure 3.12** by the red arrow\
    \ – until the **My First Analytics App eltDataflow** dataflow has finished running.\
    \ Ignore any error messages about the **augment_Contact** node, as this relates\
    \ to missing data in the dev org regarding quota owners and is irrelevant. Your\
    \ new dataset is now ready to examine, so return to the Analytics Studio.\n\n\
    > **Note**\n> \n> Often, you will need to navigate between browser tabs to switch\
    \ from the Analytics Studio to the data manager.\n\n18. Navigate to **My First\
    \ Analytics App** and open your new dataset, **MyFirstDataset**. This will bring\
    \ up an untitled lens where you can explore the new dataset. The initial lens\
    \ view looks like this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_84_0.png)\n\
    \nNow that you have created your first dataset from scratch, what if you want\
    \ to add more context to this dataset by augmenting a flat file (CSV file)? In\
    \ the next section, we will explain how to do this, and you will be able to follow\
    \ along in your TCRM dev org.\n\n> **Note**\n> One common error when editing dataset\
    \ field attributes is incorrectly classifying dimensions as measures. For example,\
    \ a zip/postal code will often be set as a measure by default, but this field\
    \ is used for grouping, not mathematical calculations, so it needs to be changed\
    \ to a dimension.\n\nThe process of combining CSV datasets with Salesforce and\
    \ external data is performed in one of the places, all of which will be covered\
    \ later in this book:\n\n- In a data recipe – please refer to *Chapter 4, Building\
    \ Data Recipes (the Cooking up data recipes in TCRM section)* and *Chapter 5,\
    \ Advanced ETL Using TCRM Data Prep*.\n- Within a lens – please refer to *Chapter\
    \ 6, TCRM Lenses – Diving Into Your Data One Click At A Time (the Creating, editing,\
    \ and cloning lenses section)*.\n- Within a query in the dashboard editor – please\
    \ refer to *Chapter 9, Advanced Dashboard Design and Build (SAQL)*.\n\n## Common\
    \ questions and challenges\n\nHere are some common questions and challenges that\
    \ you might encounter when creating a dataset from Salesforce or CSV data:\n\n\
    - *If I make a mistake in the dataset builder, can I reopen it and make corrections?*\
    \ No, you cannot reopen the dataset builder once you have chosen to create the\
    \ dataset. Changes will then need to be made in the data prep tool.\n- *I made\
    \ an error in editing the field attributes when uploading a CSV file, and now\
    \ I want to make changes – how do I do that?* You must make such changes in the\
    \ TCRM data prep tool; you cannot return to the field attribute editing dialog\
    \ box.\n- *When augmenting a Salesforce object in the dataset builder, what if\
    \ I need to make an inner or outer join, as opposed to a simple lookup or left\
    \ join?* This cannot be performed in the dataset builder; it must be done in a\
    \ data recipe or in the dataflow builder.\n- *I have augmented CSV data to a dataset,\
    \ but I need to update that CSV data. What can I do?* For example, the CSV file\
    \ contains sales targets, and these have changed. The solution here is to edit\
    \ the dataset, click on **Replace Data**, and upload the updated CSV. Be careful\
    \ to keep the same field mappings and settings.\n- *I created a dataset from Salesforce\
    \ data using the dataset builder, but now the data model and structure in Salesforce\
    \ have changed. What should I do?* In this case, you have two options: either\
    \ recreate the dataset from scratch using the dataset builder or edit the existing\
    \ dataset in the TCRM data prep tool.\n"
  mdcn: "\n\n现在，哪个对象能为你的数据流左侧提供所需的粒度？例如，是机会对象还是产品对象？在本例中，因为你想要检查产品对机会的影响，而单个机会是感兴趣的关键记录，你会选择机会对象作为基础粒度，然后从那里构建数据流，以创建一个包含分析所需相关信息的数据集。你在稍后本章完成动手练习后会更好地理解这一点。\n\
    \n一个有争议的话题是数据应该在数据层还是设计师层（查询运行时）进行转换。下面的表格比较了这两种方法：\n\n| 数据层 | 仪表板查询运行时 |\n|---|---|\n\
