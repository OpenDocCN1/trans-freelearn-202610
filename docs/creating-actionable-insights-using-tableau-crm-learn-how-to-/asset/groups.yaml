    \ to save time.\n\n## Working with dates in the Data Prep tool\n\nOne of the more\
    \ challenging areas of data preparation and transformation in TCRM has historically\
    \ been working with dates. As the engineering team at Salesforce has continued\
    \ to develop the new Data Prep ETL tool of TCRM, this is now easier than ever\
    \ before.\n\nDate fields are the key to understanding trends over time. Dates\
    \ are critical for keeping teams aware of upcoming milestones and deadlines. You\
    \ can now use **Date and Time** transformations in TCRM Data Prep to perform calculations\
    \ based on dates, all in the GUI with *no code*.\n\nTwo common ways in which you\
    \ may need to work with dates in TCRM is to add or subtract days or months and\
    \ calculate a date difference.\n\n## A deeper understanding of how and why to\
    \ flatten your data\n\nOne of the most common use cases for flattening your data\
    \ is to prepare data for use in security predicates—that is, data concerning role\
    \ hierarchy is used to decide who sees what in a dataset or dashboard, based upon\
    \ hierarchy data pertaining to the logged-in user.\n\nSee *Chapter 7, Security\
    \ in Tableau CRM*, for more information about security predicates.\n\nYou will\
    \ now learn about the hierarchy data type and how it can be used with a flatten\
    \ transformation to prepare data for TCRM security purposes.\n\n### Role hierarchy\
    \ data type in Salesforce\n\nThe role hierarchy data type is associated with the\
    \ standard Salesforce **User** object. It relates users to each other in a different\
    \ hierarchy as an alternative to the standard manager user field.\n\nThe characteristics\
    \ of the role hierarchy data type are outlined here:\n\n- It is only allowed on\
    \ the **User** object.\n- It is a specialized version of the lookup relationship,\
    \ in that it automatically self-references back to the **User** object, and it\
    \ is similar to the standard lookup in that you can only create up to 40.\n- In\
    \ the user **interface (UI)**, a hierarchical field includes a dropdown of user\
    \ types (for example, **User**, **Partner User**, **Customer Portal User**) that\
    \ limits the lookup field to those users.\n- Hierarchical fields support filters.\n\
    - Users selected in the hierarchy cannot be any users below that user in the hierarchy\
    \ or the same user on the current record.\n- It is supported in approval processes.\
    \ Salesforce allows us to select from the standard user manager field or any hierarchical\
    \ fields when configuring an approval process and determining the next approver.\
    \ Also, you can create a new hierarchical field on the fly while configuring the\
    \ approval process, without having to build it in advance.\n\nA role hierarchy\
    \ is created and configured via Salesforce Setup, as you can see in the following\
    \ example:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_143_0.png)\n\nFigure 5.22\
    \ – Creating a role hierarchy in Setup\n\n### Flatten transformation\n\nDetailed\
    \ instructions on how to use a flatten transformation were given in Chapter 4,\
    \ Building Data Recipes. In this section, we will look at how to flatten data\
    \ in preparation for use in security predicates. This will enable you to add row-level\
    \ security to a dashboard and dataset with the help of role hierarchy data.\n\n\
    Salesforce has provided a very powerful feature in Flatten Transformation to configure\
    \ the data security in a customer relationship management (CRM) system to be incorporated\
    \ in native TCRM.\n\nConsider the use-case scenario of access to opportunity records\
    \ for a sales organization configured using their role hierarchy in their Salesforce\
    \ CRM. Let's walk through this example. The role hierarchy of the org is depicted\
    \ here:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_144_0.png)\n\nFigure 5.23\
    \ – Role hierarchy of the org in this example\n\nIn the preceding diagram, we\
    \ have three sales reps, where **Sales Rep 1** and **Sales Rep 2** report to the\
    \ **Regional Manager 1** role, and **Sales Rep 3** reports to the **Regional Manager\
    \ 2** role. Access in this scenario works as follows:\n\n- Opportunity records\
    \ owned by **Sales Rep 1** and **Sales Rep 2** are accessible by **Regional Manager\
    \ 1** and the roles shown in the preceding diagram.\n- Opportunity records owned\
    \ by **Sales Rep 3** are accessible to **Regional Manager 2** and the roles shown\
    \ in the preceding diagram.\n- **Regional Manager 2** should not be able to access\
    \ the opportunities of **Sales Rep 1** and **Sales Rep 2** unless shared manually\
    \ or by a sharing rule.\n- **Regional Manager 1** should not be able to access\
    \ the opportunities of **Sales Rep 3** unless shared manually or by a sharing\
    \ rule.\n\nThe flatten transformation builds the table seen in the following screenshot\
    \ to enable configuration of these access levels in TCRM:\n\n| ROLE ID (SELF ID)\
    \ | ROLE NAME | PARENT ROLE ID | ROLES | ROLEPATH |\n|---|---|---|---|---|\n|\
    \ 1 | Salesperson 1 | 10 | 10, 20, 30 | \\\\10\\20\\30 |\n| 2 | Salesperson 2\
    \ | 10 | 10, 20, 30 | \\\\10\\20\\30 |\n| 3 | Salesperson 3 | 11 | 11, 20, 30\
    \ | \\\\11\\20\\30 |\n| 10 | Regional Manager 1 | 20 | 20, 30 | \\\\20\\30 |\n\
    | 11 | Regional Manager 2 | 20 | 20, 30 | \\\\20\\30 |\n| 20 | Vice President\
    \ 1 | 30 | 30 | \\\\30 |\n| 21 | Vice President 2 | 30 | 30 | \\\\30 |\n| 30 |\
    \ CEO | Not applicable | Not applicable | Not applicable |\n\nFigure 5.24 – Flatten\
    \ transformation table\n\nHow is this facilitated by the **Flatten Transformation**\
    \ node? The `UserRole` object in Salesforce holds all the information on role\
