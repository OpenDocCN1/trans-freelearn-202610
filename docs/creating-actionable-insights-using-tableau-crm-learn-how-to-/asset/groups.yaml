    # Filtering data


    The filter node in data recipes enables you to quickly filter your data to suit
    the use case. That is, you can remove rows of data that you want to exclude from
    your output dataset(s).


    To filter your data, follow these steps:


    +   1. Add a new node (as shown in *Figure 4.3*) to your recipe and select **Filter**.

    +   2. Add filter conditions, as shown in *Figure 4.6*. If you choose to define
    a filter condition on a dimension column, you can select a filter value from the
    list.

    +   3. Click on **Apply**.

    +   4. Save the recipe.


    The following screenshot shows what the user interface (UI) looks like when adding
    filter conditions:


    ![](img/06379e43783b9ddfee45e9da5192efe1_97_0.png)


    Figure 4.6 – Adding filter conditions'
  - '[PAGE 98]


    <!-- no content -->'
  - '[PAGE 99]


    +   4. You can pivot dimensions as columns by adding up to two-dimension columns
    in the **Group Columns** field, selecting the values for each column, and clicking
    on **Apply**.

    +   5. Once your aggregations have been configured, click on **Apply**.

    +   6. Save the recipe.


    This is what the UI looks like when you add an aggregate node:


    ![](img/06379e43783b9ddfee45e9da5192efe1_99_0.png)


    Figure 4.7 – Applying an aggregate node to a recipe


    > **Note Regarding Aggregation And Data Granularity**

    > When you use the aggregate node, lower (source) data granularity is lost in
    that stream of the data recipe. However, the recent release enables you to bring
    back the granularity with joins after aggregation.


    Next, you will learn how to use the powerful transformation tools that are at
    your disposal in TCRM.


    # Transforming data


    A data recipe can contain transformations that enable you to *prepare*, *clean*,
    and *transform* your data. These transformations are contained in a **Transform
    node**, and you can join multiple transformations together to shape data sequentially.'
