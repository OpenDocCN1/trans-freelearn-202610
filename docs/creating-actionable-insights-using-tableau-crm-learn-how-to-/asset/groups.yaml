    ## 7 Tableau CRM 中的安全


    你如何决定谁在 Tableau CRM 中可以看到什么？这是 TCRM 开发中最不为人所理解的方面之一，因此在本章中，你将学习如何保护你的 TCRM 数据。我们将首先概述
    TCRM 安全。然后我们将逐步介绍 TCRM 提供的每个工具，以确定谁可以看到什么数据。


