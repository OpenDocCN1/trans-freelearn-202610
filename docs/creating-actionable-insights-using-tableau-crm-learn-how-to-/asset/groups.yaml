    ## 9 Advanced Dashboard Design and Build


    Now that you have built your first dashboard, it’s time to move beyond the basics.
    In this chapter, you will learn about advanced dashboard design and build. When
    you’ve completed this chapter, you will know how to enhance designs with Tableau
    CRM (TCRM) pages, use Salesforce Analytics Query Language (SAQL) to create more
    complex queries, and build interactions and bindings using code or clicks.


    What will you learn to do in this chapter? We’ll be looking at the following topics:


    - Creative use of page animations

    - Beginning with code – an introduction to SAQL

    - Tying things together with bindings

    - Working with the Advanced Editor


    ## Technical requirements


    You will need the following to successfully execute the instructions in this chapter:


    - The latest version of the Google Chrome browser (Chrome is the preferred browser
    when working with TCRM)

    - A working email address


    Be sure to be logged in to your TCRM dev org.


    Let''s begin with when and how to use page animations in TCRM.


    ## Creative use of page animations


    The TCRM pages functionality gives you the capability to create clever dashboards
    that use animation to enhance dashboard functionality and usability.


    From your Analytics Studio home page, open the **My First Dashboard** dashboard
    you created in *Chapter 8, Building Your First TCRM Dashboard*. Follow these steps
    to create a dashboard where you will work with multiple pages:


    - 1. Clone it to create a new dashboard, **My Advanced Dashboard**.

    - 2. Open this new dashboard in **Edit** mode.

    - 3. Clone the **Sales** page and rename this new page **Sales Clean**.

    - 4. Under the **Page Options** drop-down menu, select **Hide from Navigation**.
    Notice that this removes the page from the navigation widget.

    - 5. Remove and rearrange widgets so that the page matches what you see in *Figure
    9.1*. When prompted about removing the global filter widget, select **Delete Widget
    Only**.

    - 6. Click **Save** to save the dashboard.


