    +   A. Delete the app and create an entirely new version of the app.

    +   B. Reset the app and choose different answers, as appropriate.


    # Summary


    Now that we have completed the journey of creating and personalizing an OOTB TCRM
    analytics app, you should have a good grasp of what an analytics app is and how
    it works. You should have learned that TCRM app templates provide prebuilt data
    flows and dashboards that can be configured to suit the use case as required,
    and you should now be comfortable building and personalizing an app. Also, you
    should have gained a hands-on feel for the TCRM UI, assets, and tools, and should
    be confident in navigating the **Analytics Studio** home page. Finally, you have
    the *Troubleshooting* section as a handy reference tool, should you get stuck.


    Some key takeaways that you should have gained are: first, a TCRM app is a container
    of TCRM assets, in the form of datasets, lenses, stories, and dashboards. Next,
    a TRCM app can be secured. Thirdly, a TCRM app can be shared with others in a
    variety of ways. Then, a TCRM app can be templated and reproduced in another environment.
    Lastly, you can deploy an OOTB TCRM app with standard settings or configure it
    to meet your personalized requirements.


    In the next chapter, you will learn how to extract, connect, combine, transform,
    and register business data in order to create a useful dataset within TCRM.


    # Questions


    Now try answering the following questions to test your knowledge:


    +   - What is a TCRM asset? Give one example.

    +   - How can a TCRM app be shared?

    +   - What is a TCRM lens?

    +   - True or false: A TCRM app is restricted to standard, OOTB settings.'
