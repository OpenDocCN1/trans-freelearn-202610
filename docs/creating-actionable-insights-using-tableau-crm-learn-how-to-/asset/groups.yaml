    (**Opportunities** or **Leads**). Follow these steps to connect the data sources:


    +   1. Using the drop-down list at the top right of the dashboard editor, click
    on **Connect Data Sources**. A dialog box will appear.

    +   2. Click on **New Connection**.

    +   3. Name the connection **Leads and Opportunities by Source**.

    +   4. Click on **Choose Data Source 1**.

    +   5. Under **Select Data Source**, choose **Opportunities**.

    +   6. Under **Select a field**, choose **Lead Source**.

    +   7. Click on **Choose Data Source 2**.

    +   8. Under **Select Data Source**, choose **Leads**.

    +   9. Under **Select a field**, choose **Lead Source**.

