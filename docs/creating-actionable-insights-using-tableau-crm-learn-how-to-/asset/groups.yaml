    # 如何借助 TCRM 在数据分析方面表现出色？


    当你思考本章目前所学的内容时，是时候反思一下你的组织中数据和分析的现状了。你的数据是一种极其宝贵的资源，它应当赋能明智的决策并引导组织战略。你的公司数据能提供什么价值？


    问问自己这些问题，并评估你的组织是否有改进空间：


    -   你的领导者是否能够随时掌握准确、最新的信息，以便做出明智的决策？

    -   你是否拥有一个你和同事都能访问和依赖的可靠信息来源？还是说信息分散在多个系统和平台中，并使用各种工具进行分析？

    -   你的团队是否被简单、可操作的数据分析赋能和武装？

    -   你和同事是否经常需要从不同地方收集信息——例如云存储、CRM、电子表格、电子邮件、ERP 等——然后将它们汇总到一个电子表格中，才能创建完成工作所需的报告？

    -   你如何分享有价值的见解，然后如何将这些见解付诸行动？这个过程是简单容易的，还是复杂困难的？

    -   你们目前在数据和数据分析领域有哪些优势？

    -   你们目前在数据和数据分析领域有哪些劣势？

    -   你们目前在数据和数据分析领域有哪些机遇？

    -   你们目前在数据和数据分析领域面临哪些挑战？

    -   如果平台、人员和流程都不是障碍，那么在利用信息创造可操作商业洞察方面，你认为你的组织在 12 个月后会处于什么位置？你实现这一理想状态的可能性有多大？


    我想我可以用一个简单的问题来概括以上所有内容：


    *你的组织在数据分析方面表现出色吗？*


    说实话，根据我在多个行业和细分领域的经验，大多数组织并没有表现出色。许多组织甚至都不及格！数据分析是典型企业的严重痛点，无论其规模或行业如何，而且这个问题从来都不是靠砸钱就能解决的。


    好消息是，TCRM 是一个强大而全面的工具，可以帮助你的组织从信息中获取巨大价值。具体如何实现？以下是 TCRM 能够做到的一些示例；请仔细思考这些功能，看看哪些最符合你的目标和需求：


    -   将 Salesforce 和外部数据结合起来，创建唯一可信的数据源。

    -   将洞察嵌入 Salesforce 的业务流程中，让用户能够更快、更好地做出决策。

    -   用统一且动态的仪表盘取代多个互不关联的 Salesforce 报表。

    -   最大限度减少或完全消除将 Salesforce 中的报表导出到 Excel 等工具中进行汇总、转换和可视化的需求。

    -   极大地简化跨对象报表的创建。

    -   通过 Einstein 平台将为分析注入真正的智能。

    -   通过适用于 iOS 和 Android 的 TCRM 移动应用提供出色的移动端分析。

    -   在处理大型数据集时，性能超越 Salesforce 报表和仪表盘。

    -   让用户在 TCRM 仪表盘上仅需几次点击即可从洞察转向行动，全程无需离开平台。

    -   对复杂流程进行建模，组合多个数据集，并融入复杂逻辑，创建出一个驱动真实洞察的综合数据源。


    现在，我们将进入本书的主要内容。请与我一起学习 TCRM 如何借助可操作商业洞察的力量，帮助你的组织实现转型！


    ## 总结


    至此，你应该已经清楚地理解了在受疫情影响的当今社会中，数据分析和商业洞察的重要性。你已经了解了 TCRM 这个强大的数据分析平台如何与 Salesforce
    集成，从而在任何组织中都促进可操作的洞察。你也有机会评估了自己组织中的数据分析现状，并看到 TCRM 能够在哪些方面带来改变。


    在下一章中，我们将亲手实践 TCRM，并构建我们的第一个 TCRM Analytics 应用。


    ## 问题


    以下是一些测试你对本章内容掌握程度的问题：


    -   定义数据分析及其提供的价值。

    -   我们的目标是从数据到洞察，再到 ______________。

    -   列举 TCRM 的五个特性。

    -   TCRM 与 Tableau 有何不同？

    -   列举 TCRM 的五个实际使用场景。

    -   TCRM 如何为你的组织或客户提供价值？

    -   你的组织在数据分析方面表现出色吗？如果没有，是什么阻碍了它？


    ## 在 TCRM 中开发你的第一个 OOTB Analytics 应用


    什么是 **Tableau 客户关系管理（TCRM）** Analytics 应用？TCRM 提供了多种**开箱即用（OOTB）** 的分析应用程序，可帮助你快速开始针对各种通用和行业特定用例（如销售分析或财富管理分析）进行数据分析。这些应用提供了预构建的数据流和仪表盘，可以配置以适合特定用例和可用数据。OOTB
    应用是开始使用和自定义 TCRM 分析并熟悉 TCRM **用户界面（UI）**、资产和工具的绝佳起点。


    你必须先学会走，然后才能跑。我们将从最初始的步骤开始——设置一个试用版 TCRM **组织（org）**，了解 TCRM 环境，并学习基本的资产定义。然后，我们将深入实践，创建并定制我们的第一个
    TCRM Analytics 应用，以初步积累经验。


    在本章结束时，你应该详细了解 TCRM 中 OOTB Analytics 应用是什么，并且能够在**开发（dev）** 组织中创建和定制一个此类应用。你还应该能够浏览
    TCRM UI 并使用基本的 TCRM 工具。此外，目标是理解并欣赏各种 TCRM 资产，例如**透镜（lens）和故事（story）**。我们还将在此过程中解答一些常见问题和挑战。


    在本章中，我们将涵盖以下主题：


    -   亲身体验你自己的 TCRM 环境

    -   什么是 TCRM Analytics 应用？

    -   安装和配置 TCRM Analytics 应用

    -   定制 TCRM Analytics 应用

    -   常见问题解答

    -   故障排除


    ## 技术要求


    你需要满足以下条件才能成功执行本章中的操作：


    -   一台可以访问互联网的笔记本电脑或台式电脑（平板电脑或手机不够用）

    -   最新版本的 Google Chrome 浏览器（Chrome 是使用 TCRM 时的首选浏览器）

    -   一个可用的电子邮件地址

    -   TCRM 开发组织链接：


    ```

    https://developer.salesforce.com/promotions/orgs/analytics-de

    ```


    ## 亲身体验你自己的 TCRM 环境


    让我们首先逐步完成 TCRM 开发试验环境的初始设置流程，这样你就可以在安装 TCRM 的过程中与我一起操作。


    为了让你能够亲身体验 TCRM 平台，你首先需要一个可以自由编辑的沙盒环境——一个已经启用了 TCRM 并填充了示例数据的环境。这个试验环境被称为启用 Einstein
    Analytics 的 Developer Edition 组织。那么，让我们开始设置它吧。


    ## 设置你的开发组织


    要注册并设置你的开发组织，请按照以下步骤操作：


    1.  在此处注册你自己的启用 Einstein Analytics 的 Developer Edition 组织：https://developer.salesforce.com/promotions/orgs/analytics-de。注册界面应该如下所示：

    2.  继续填写表单，然后选择 **Sign me up**。请注意，你的用户名将采用电子邮件地址的形式，但你将创建一个唯一的用户名，该用户名不应是你的电子邮件地址。编一个你容易记住的用户名即可。


    ![](img/06379e43783b9ddfee45e9da5192efe1_43_0.png)


    图 2.1 – 开发组织注册界面


    前往你的电子邮件应用，你应该会看到一封主题为 **Welcome to Salesforce: Verify your account** 的电子邮件。


