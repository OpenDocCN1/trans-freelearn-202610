    of an opportunity close date:


    ![](img/06379e43783b9ddfee45e9da5192efe1_134_0.png)


    Figure 5.15 – Use of a date function to calculate the week of the year of an opportunity
    close date


    ## Numeric operators and functions


    Numeric functions calculate values from measures in your recipe. Be sure to use
    the application programming interface (API) name of the column in the expression,
    not the label, when entering a formula.


    The following math operators can be used:


    - `+` for the sum of two values

    - `-` for the difference between two values

    - `*` for the product of two values

    - `/` for dividing the first value by the second

    - `()` for evaluating expressions within parentheses first


    The following numeric functions are available for use in an expression:


    - `abs`—Calculates the absolute value of a number

    - `ceil`—Rounds a number up to the nearest integer

    - `exp`—Returns a value for e raised to the power of a specified number

    - `floor`—Returns a number rounded down to the nearest integer

    - `format_number`—Formats a number by rounding to a specified number of decimal
    places or by applying a certain format

    - `log`—Returns the logarithm of the number in a specified base

    - `power`—Raises a number to the power of another number

    - `round`—Returns the nearest number to a number you specify, limiting (rounding)
    the new number by a specified number of digits

    - `sqrt`—Returns the square root of a given number

    - `truncNumber`—Truncates a specified number of decimal values from the number,
    or converts to an integer


    The following example shows how numeric functions and operators are combined to
    create a custom formula:


    ![](img/06379e43783b9ddfee45e9da5192efe1_135_0.png)


    Figure 5.16 – Example formula using numeric functions and operators


    ## String functions


    String functions are used to create values based on other strings, as in text
    strings or dimension fields.


    You can use the following string functions in a formula expression:


    - `char_length`—Returns the number of characters in a specified string

    - `concat`—Returns a string by merging the values of specified columns and input
    strings

    - `endsWith`—Returns true if a specified string is found at the end of the column
    value

    - `instr`—Returns the first location of the `searchString` value in a specified
    field column

    - `lower`—Returns a string with all characters in lowercase

    - `ltrim`—Removes a specified substring from the beginning of a string

    - `replace`—Replaces a substring with another string

    - `rtrim`—Removes a specified substring from the end of a string

    - `startsWith`—Returns true if a specified string is found at the beginning of
    the column value

    - `string`—Converts a date or number value to a string data type

    - `substr`—Returns characters from a string, starting at a specified position
    and of a specified length

    - `title`—Returns a string with the initial character of every word in uppercase
    and the remaining characters in lowercase

    - `trim`—Removes a specified substring from the beginning and end of a string

    - `upper`—Returns a string with all characters in uppercase


