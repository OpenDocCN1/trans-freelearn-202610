    - 9. 调整 **Chart** 小部件的大小和格式以满足你的偏好。在我的示例中，如以下屏幕截图所示，我选择创建一个饼图，将 **Center Size**
    值设为 0% 并将饼图值显示为 **Percentage**。

    - 10. 创建并添加一个 **Leads by Status** 的小部件——使用 Origami 图表并将图例放在顶部中央。


    - 11. 创建并添加一个 **Leads Count by State and Status** 的小部件——使用堆叠柱状图。

    - 12. 创建并添加一个 **Heat Map of Source and Status** 的小部件。

    - 13. 格式化并编辑以满足你的偏好。

    - 14. 点击 **Save** 保存仪表板。

    - 15. 在 highlights 面板中为 **Lead Source** 添加一个 **List** 小部件。将 **Selection Type**
    更改为 **Multiple Selection**。

    - 16. 在 highlights 面板中为 **Industry** 添加一个 **List** 小部件。

    - 17. 在 highlights 面板中为 **Total Leads** 添加一个 **Number** 小部件。

    - 18. 在 highlights 面板中为 **Open Leads** 添加一个 **Number** 小部件（按 **Status** 过滤为不等于
    **Closed**）。

    - 19. 点击 **Save** 保存仪表板。


    你的营销页面应如下所示：


    ![](img/06379e43783b9ddfee45e9da5192efe1_224_0.png)


    Figure 8.11 - The completed marketing analytics page


    现在，我们希望连接我们的数据源，以便按 **Lead Source** 过滤时可在两个页面上应用。未连接数据源时，过滤器仅在每个单独页面上生效，因为每个页面都是使用来自一个数据集的查询创建的（**Opportunities**
    或 **Leads**）。请按照以下步骤连接数据源：


    - 1. 使用仪表板编辑器右上角的下拉列表，点击 **Connect Data Sources**。将出现一个对话框。

    - 2. 点击 **New Connection**。

    - 3. 为连接命名 **Leads and Opportunities by Source**。

    - 4. 点击 **Choose Data Source 1**。

    - 5. 在 **Select Data Source** 下，选择 **Opportunities**。

    - 6. 在 **Select a field** 下，选择 **Lead Source**。

    - 7. 点击 **Choose Data Source 2**。

    - 8. 在 **Select Data Source** 下，选择 **Leads**。

    - 9. 在 **Select a field** 下，选择 **Lead Source**。

    - 10. 点击 **Save**。


    保存连接之前的对话框应如下所示：


    ![](img/06379e43783b9ddfee45e9da5192efe1_225_0.png)


    Figure 8.12 – Completed data connection dialog box


    现在，是时候测试连接了。


    在 **Marketing** 页面上，点击 **Lead Source** 的 **List** 小部件并选择 **Web**。页面现在将按所选值进行过滤。现在，移动到
    **Sales** 页面，你会看到销售数据也已按 leads 和 deals 的 web 来源进行了过滤。


    现在你已成功从头开始创建了第一个 TCRM 仪表板，包括页面的多功能性，是时候学习如何使用和共享仪表板了。


    # A user''s guide to a TCRM dashboard


    你现在将在 **Preview** 模式下打开你的新仪表板，并作为业务用户来使用它，学习如何在 TCRM 中切片和切块你的数据。在探索数据之前，请移除 hero
    图表 **Pipeline by Close Date** 上的静态目标，因为这会妨碍我们的探索。我们将在 *Chapter 9, Advanced Dashboard
    Design and Build* 中查看动态参考线。此外，确保所有图表小部件的 **Selection Type** 都设置为 **Multiple Selection**。


    以下步骤将帮助你探索和共享你的仪表板：


    - 1. 打开 **My First Dashboard** 仪表板并进入 **Present** 模式。

    - 2. 通过在 **List** 小部件中选择 **MM** 和 **GB** 来按 **Segment** 过滤。

    - 3. 通过在 **Sum of Amount** 下选择 **50,000 – 500,000** 来按交易规模下钻。

    - 4. 我们只对新交易感兴趣，因此在 **Type** 全局过滤器下排除 **Existing Business**（使用 **Does Not Equal**）。

    - 5. 通过进入 **Pipeline by Stage** 图表并选择这两个条：**Negotiation/Review** 和 **Perception
    Analysis** 来对仪表板进行分面。

    - 6. 保存此仪表板视图。在仪表板标题旁边，点击 **Modified** 旁边的向下箭头，并选择 **Save View**。将其命名为 **Sales
    drill down** 并点击 **Create**。

    - 7. 点击 **Save** 保存仪表板。


    你的仪表板现在应如下所示的屏幕截图；请注意，由于你选择的阶段，highlights 面板中 **# of Deals Won** 的结果显示 **No Results
    Found**：


    ![](img/06379e43783b9ddfee45e9da5192efe1_227_0.png)


    Figure 8.13 – Your dashboard in Sales drill-down view after drilling into the
    data


    你现在将通过以下步骤共享此仪表板视图：


    - 1. 点击屏幕右上角的 Share 按钮。

    - 2. 有几种共享此仪表板视图的方式，但现在，你希望与有权访问此应用的同事共享链接，并附上参考截图。首先，你将点击 GET URL，然后复制统一资源定位符（URL）并将其添加到电子邮件中。

    - 3. 接下来，点击 DOWNLOAD 并将仪表板视图下载为图像。将图像添加到你的电子邮件中。

    - 4. 你的同事现在可以快速以图像形式查看仪表板，然后点击 URL 在 TCRM 仪表板中实时查看数据。请注意，他们的视图将保留你在切片和切块数据时应用的过滤和分面。


