    What about times where it is not clear whether you need to code?


    # Occasions of ambiguity


    The more familiar you become with building lenses and dashboards using the TCRM
    GUI, the more you will understand where code is required. A best practice is to
    use the GUI whenever possible, and only resort to code where it cannot be avoided.
    Also, be sure to stay up to date with the new TCRM releases since the GUI becomes
    more capable with every release.'
