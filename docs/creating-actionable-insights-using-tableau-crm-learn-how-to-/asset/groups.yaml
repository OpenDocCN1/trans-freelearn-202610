    \n### Basic Widget/Step JSON\n\n![](img/06379e43783b9ddfee45e9da5192efe1_260_0.png)\n\
    \nFigure 9.17 – Basic widget/step JSON example\n\nHere, we have a simplified example\
    \ of dashboard JSON:\n\n### Dashboard JSON\n\n#### Example:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_260_1.png)\n\
    \nFigure 9.18 – Dashboard JSON example\n\nLet's look at one simple example of\
    \ a JSON binding—a dynamic grouping. This example comes from the publicly available\
    \ *Learning Adventure* app, which I refer to at the end of this section. Follow\
    \ these steps:\n\n- 1. Create a new blank dashboard.\n- 2. Create a toggle widget\
    \ (`pillbox_1`) with a step (`Grouping_Toggle_1`) that specifies different groupings.\n\
    - 3. Create a bar chart (`chart_1`) with a step (`Dynamic_Query`) in a compact\
    \ form that groups the total amount by the selected grouping in the toggle widget.\n\
    - 4. In the Spring 2018 release, a new `columnMap` chart property was introduced\
    \ to build more powerful visualizations; however, `columnMap` is not necessary\
    \ for this dynamic visualization. Replace this `columnMap {}` parameter with `columnMap:\
    \ null`.\n- 5. To dynamically set the grouping in the chart based on the selection\
    \ in the toggle widget, open the dashboard JSON and bind the groups property in\
    \ the Dynamic_Query step—see the code snippet following this list of steps.\n\
    - 6. Click **Done** and you're ready to go.\n\nHere is the JSON used to bind the\
    \ groups property in the Dynamic_Query step:\n\n```\n```json\n\"groups\": \"{{\
    \ cell(Grouping_Toggle_1.selection, 0, \\\"groups\\\").asObject() }}\"\n```\n\
    ```\n\nWhat does this code mean? Let's break it down, as follows:\n\n- `cell(Grouping_Toggle_1.selection,\
