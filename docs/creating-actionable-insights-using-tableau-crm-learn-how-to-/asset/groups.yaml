    接下来你会看到，出色的仪表板在设计时都会考虑到目标受众。


    ## 优秀的仪表板会考虑受众


    优秀的设计师会进入受众的思维空间。深入且全面地了解你的业务用户，以及他们将如何理解和执行你的仪表板，是设计过程中的关键一步。请考虑以下几点：


    - 仪表板将如何用于后续行动？

    - 读者在日常工作中需要哪些信息才能取得成功？

    - 用户真正需要什么详细程度？

    - 业务用户将采取哪些行动？这些行动将如何执行？

    - 你将如何突出需要跟进的异常或洞察？

    - 哪些用户假设和偏好可能影响你的设计选择？

    - 在业务环境中，颜色意味着什么？它们可能如何被视觉解读？

    - 在业务环境中，哪些图标、徽标等是用户熟悉的？

    - 记得使用对色盲友好的配色方案。


