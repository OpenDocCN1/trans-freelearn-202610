  md: "\nThe inputs required are as follows:\n\n- **Original Formats** (such as `yyyy-MM-dd'T'HH:mm:ss.SSS'Z'`)\n\
    - **Change To** (select the destination format)\n- **Convert column type to Date**\
    \ (checkbox)\n- **Show Results In**\n- **Column Label**\n\n> **Warning**\n> \n\
    > Values with unrecognizable formats will be replaced with null values.\n\n##\
    \ Bucket\n\nThe bucket transformation is a quick and easy way in which to group\
    \ and organize data by bucketing your measure, dimension, and date fields. Buckets\
    \ are added by clicking on the + button within the bucket window and defining\
    \ ranges. Here is an example of what this can look like:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_105_0.png)\n\
    \nFigure 4.10 – An example bucket transformation of countries into regions\n\n\
    Buckets are a useful tool when you want to create a heat map from two measures,\
    \ for example, or create a derived dimension for deeper analysis and machine learning.\n\
    \n## Flatten\n\nThis option will flatten ranked data for a hierarchy into two\
    \ columns. The hierarchy nodes column lists all of the ancestors for each node.\
    \ The hierarchy path column contains a string that details the hierarchy path.\
    \ Please refer to Figure 4.11 for an example.\n\nIn order to configure the flatten\
    \ transformation, you must specify the field that contains the corresponding parent\
    \ based on the hierarchy and the field that contains every node in the hierarchy.\
    \ This will then generate one record for each hierarchy node, referred to as the\
    \ child node. Every record contains two generated columns that store the hierarchy\
    \ for each child node. One column contains the ancestors for each node in the\
    \ hierarchy, and the other column contains the hierarchy path.\n\nThe steps required\
    \ to flatten data are as follows:\n\n1. Select the dimension column that contains\
    \ all of the child nodes in the hierarchy.\n2. Click on the **Flatten** button.\n\
    3. Enter the **Parent Column** property details.\n4. Choose whether or not to\
    \ **Include child node** in the generated hierarchy nodes and path columns.\n\
    5. Enter the **Hierarchy Nodes Column Label** property – this is the name of the\
    \ multi-value output column that contains a list of all ancestors in the hierarchy,\
    \ in order from the lowest level to the highest level.\n6. Enter the **Hierarchy\
    \ Path Column Label** property – this is the hierarchical path of all ancestors\
    \ in the hierarchy, in order from the lowest level to the highest level, where\
    \ nodes are separated by forward slashes.\n7. Preview the results to ensure that\
    \ the flattened hierarchy is correct.\n8. Click on **Apply** to add the flatten\
    \ transformation to the recipe.\n\nHere is an example of a flattened dataset showing\
    \ how ancestors are stored:\n\n| ROLE ID (CHILD NODE) | ROLE NAME | PARENT ROLE\
    \ ID | ROLES | ROLE PATH |\n|---|---|---|---|---|\n| 1 | Salesperson 1 | 10 |\
    \ 10, 20, 30 | / 10/20/30 |\n| 2 | Salesperson 2 | 10 | 10, 20, 30 | / 10/20/30\
    \ |\n| 3 | Salesperson 3 | 11 | 11, 20, 30 | / 11/20/30 |\n| 10 | Regional Manager\
    \ 1 | 20 | 20, 30 | / 20/30 |\n| 11 | Regional Manager 2 | 20 | 20, 30 | / 20/30\
    \ |\n| 20 | Vice President 1 | 30 | 30 | / 30 |\n| 21 | Vice President 2 | 30\
    \ | 30 | / 30 |\n| 30 | CEO | Not applicable | Not applicable | Not applicable\
    \ |\n\nFigure 4.11 – An example of a flattened dataset showing how ancestors are\
    \ stored\n\nMore details on how the flatten transformation is used will follow\
    \ in Chapter 5, Advanced ETL Using TCRM Data Prep.\n\n## Edit attributes\n\nUse\
    \ this transformation to change the column names and value formats. For example,\
    \ you can edit the following:\n\n- **Label**\n- **API Name**\n- **Length**\n-\
    \ **Precision**\n- **Scale**\n\n## Drop columns\n\nDrop unwanted input columns\
    \ from the recipe. This will leave you with a subset of columns to use in transformations\
    \ and include in the final dataset. For example, you can drop input columns used\
    \ for a calculated column.\n\n## Detect sentiment\n\nThis transformation is used\
    \ to determine the sentiment of text, whether positive, negative, or neutral,\
    \ and adds those values to the specified column.\n\nIf Einstein cannot determine\
    \ the sentiment of a field, the sentiment is set to null.\n\n## Predict missing\
    \ values\n\nTableau CRM intelligently replaces any missing values in the selected\
    \ column with predictions based on values in other strongly correlated columns\
    \ in your data.\n\n## Discovery prediction\n\nThis populates your datasets with\
    \ predictive and prescriptive intelligence, as Einstein calculates and saves predicted\
    \ outcomes on a row-by-row basis. Additionally, you can store descriptions of\
    \ top predictors and improvements. The discovery prediction node enables you to\
    \ evaluate predictions across your data, assess multiple models before deploying\
    \ to production, and visualize aggregated prediction information in a dashboard.\n\
    \nAs this book does not cover the machine learning models and predictions of Einstein\
    \ Discovery, the discovery prediction transformation is not covered here in detail.\n\
    \n## Joining data in recipes\n\nUse the **Join** node to add columns of data from\
    \ related objects to existing data in a recipe. You might use one of the following\
    \ join methods, depending on how you want to combine your data: *lookup*, *left\
    \ join*, *right join*, *inner join*, or *full outer join*.\n\nThe following screenshot\
    \ shows an example of how to create an outer join:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_108_0.png)\n\
    \nFigure 4.12 – An example of an outer join in a data recipe\n\nPerform the following\
    \ steps to join data in a recipe:\n\n1. Select the **Add Node** button (+) between\
    \ two nodes or at the end of a recipe with at least one input node.\n2. Select\
    \ **Join**.\n3. Choose which data to join and select which columns to include.\n\
    4. Click on **Next**.\n5. Select the desired **Join Type**.\n6. Change the **Join\
    \ Keys** setting as required. Note that the recipe will add suggested keys from\
    \ both sets of input data. You can use multiple keys (a maximum of five) to match\
    \ records if required.\n7. Enter a prefix (**API Name Prefix for Right Columns**)\
    \ for the columns coming from the right data source. This will prevent API name\
    \ conflicts between columns in the left and right data sources.\n8. Select the\
    \ columns in the **Columns** tab in the right-hand side panel to include in the\
    \ recipe.\n9. Click on **Preview** to preview all of the included columns and\
    \ their data.\n10. If you need to hide columns from the preview, click on the\
    \ **Hide** button (E).\n11. Click on **Apply** to add the node to the recipe.\n\
    12. **Save** the recipe.\n\n> **Types of data joins**\n> I have assumed that you\
    \ have an understanding of the various types of data joins. Note that this subject\
    \ is explained, in detail, in *Chapter 5, Advanced ETL Using TCRM Data Prep.*\n\
    \n## Outputting data from recipes\n\nThe output node writes recipe results to\
    \ a TCRM dataset or an external system. The inputs required are as follows:\n\n\
    - **Write To**: Either to a dataset or a CSV file.\n- **Dataset Display Label**.\n\
    - **Dataset API Name**.\n- **App Location**.\n- **Sharing Source:** This option\
    \ is required if sharing inheritance is turned on.\n- **Security Predicate:**\
    \ This option adds row-level security with a predicate filter.\n\n> **Warning**\n\
    > \n> Setting the **Dataset API Name** option to be the same as an existing TCRM\
    \ dataset will overwrite that dataset.\n\nSoon, you will have more output options\
    \ to choose from, as the following are currently in development:\n\n- Amazon S3\
    \ output connection\n- Salesforce output connection\n- Snowflake output connection\n\
    - Tableau Online output connection\n\n## A hands-on exercise in data transformation\n\
    \nIn this hands-on exercise, we want to create a new dataset to analyze the service\
    \ cases that belong to accounts with open opportunities.\n\nPerform the following\
    \ steps to modify your existing `MyFirstRecipe` recipe using various transformations;\
    \ it is critical that these steps are executed carefully in order:\n\n1. Open\
    \ the `MyFirstRecipe` recipe from **Data Manager**.\n2. Create a second branch\
    \ inside the dataflow directly after the input node.\n3. Add a **Filter** node\
    \ to this new branch in order to include all opportunity stages, except for **Closed\
    \ Lost** and **Closed Won**.\n4. To the right-hand side of the **Filter** node,\
    \ add a **Join** node to augment the opportunity data with case information. Select\
    \ only these **Case** fields: **Account ID, Case Number, Status, Subject,** and\
    \ **Case Type**. Use a **Left join** node, match it by **Account ID**, and add\
    \ the API name prefix of **Case**.\n"
  mdcn: "\n\n所需输入如下：\n\n- **Original Formats**（例如 `yyyy-MM-dd'T'HH:mm:ss.SSS'Z'`）\n\
    - **Change To**（选择目标格式）\n- **Convert column type to Date**（复选框）\n- **Show Results\
    \ In**\n- **Column Label**\n\n> **Warning**\n> \n> 格式无法识别的值将被替换为 null 值。\n\n##\
    \ Bucket\n\nBucket 转换是一种快速简便的方式，可通过对度量、维度以及日期字段进行分桶来对数据进行分组和组织。Buckets 是通过在 bucket\
    \ 窗口中点击 + 按钮并定义范围来添加的。以下是其可能外观的示例：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_105_0.png)\n\
    \n图 4.10 – 将国家分桶为区域的 bucket 转换示例\n\n当你想从两个度量创建热力图时，或者为更深入的分析和机器学习创建派生维度时，Buckets\
    \ 是一个有用的工具。\n\n## Flatten\n\n此选项会将层级结构的排名数据展平成两列。Hierarchy nodes 列列出了每个节点的全部祖先。Hierarchy\
    \ path 列包含详细说明层级路径的字符串。请参阅图 4.11 以了解示例。\n\n为了配置 flatten 转换，你必须指定包含基于层级对应的父级的字段，以及包含层级中每个节点的字段。这将为每个层级节点生成一条记录，称为子节点。每条记录都包含两列生成的列，用于存储每个子节点的层级。一列包含层级中每个节点的祖先，另一列包含层级路径。\n\
    \n展平数据的所需步骤如下：\n\n1. 选择包含层级中所有子节点的维度列。\n2. 点击 **Flatten** 按钮。\n3. 输入 **Parent\
    \ Column** 属性详情。\n4. 选择是否在生成的 hierarchy nodes 和 path 列中 **Include child node**。\n\
    5. 输入 **Hierarchy Nodes Column Label** 属性 – 这是多值输出列的名称，其中包含层级中所有祖先的列表，按从最低级别到最高级别的顺序排列。\n\
    6. 输入 **Hierarchy Path Column Label** 属性 – 这是层级中所有祖先的层级路径，按从最低级别到最高级别的顺序排列，其中节点由正斜杠分隔。\n\
    7. 预览结果以确保展平的层级正确。\n8. 点击 **Apply** 将 flatten 转换添加到配方中。\n\n以下是展平数据集的示例，展示了祖先是如何存储的：\n\
    \n| ROLE ID (CHILD NODE) | ROLE NAME | PARENT ROLE ID | ROLES | ROLE PATH |\n\
    |---|---|---|---|---|\n| 1 | Salesperson 1 | 10 | 10, 20, 30 | / 10/20/30 |\n\
    | 2 | Salesperson 2 | 10 | 10, 20, 30 | / 10/20/30 |\n| 3 | Salesperson 3 | 11\
    \ | 11, 20, 30 | / 11/20/30 |\n| 10 | Regional Manager 1 | 20 | 20, 30 | / 20/30\
    \ |\n| 11 | Regional Manager 2 | 20 | 20, 30 | / 20/30 |\n| 20 | Vice President\
    \ 1 | 30 | 30 | / 30 |\n| 21 | Vice President 2 | 30 | 30 | / 30 |\n| 30 | CEO\
    \ | Not applicable | Not applicable | Not applicable |\n\n图 4.11 – 展示祖先如何存储的展平数据集示例\n\
    \n关于 flatten 转换如何使用的更多细节将在第 5 章《使用 TCRM Data Prep 进行高级 ETL》中介绍。\n\n## Edit attributes\n\
    \n使用此转换更改列名和值格式。例如，你可以编辑以下内容：\n\n- **Label**\n- **API Name**\n- **Length**\n-\
    \ **Precision**\n- **Scale**\n\n## Drop columns\n\n从配方中删除不需要的输入列。这将使你拥有用于转换和包含在最终数据集中的列子集。例如，你可以删除用于计算列的输入列。\n\
    \n## Detect sentiment\n\n此转换用于确定文本的情感是积极、消极还是中性，并将这些值添加到指定的列中。\n\n如果 Einstein\
    \ 无法确定某个字段的情感，则情感将被设为 null。\n\n## Predict missing values\n\nTableau CRM 会智能地用基于数据中其他强相关列的值的预测值替换所选列中的任何缺失值。\n\
    \n## Discovery prediction\n\n此操作会使用预测和规范性智能填充你的数据集，因为 Einstein 会逐行计算并保存预测结果。此外，你还可以存储主要预测因子和改进措施的描述。Discovery\
    \ prediction 节点使你能够在数据中评估预测，在部署到生产环境之前评估多个模型，并在仪表板中可视化聚合的预测信息。\n\n由于本书不涉及 Einstein\
    \ Discovery 的机器学习模型和预测，因此此处未详细介绍 discovery prediction 转换。\n\n## Joining data in\
    \ recipes\n\n使用 **Join** 节点将来自相关对象的列数据添加到配方中现有数据中。你可能会根据想要如何组合数据的方式使用以下其中一种连接方法：*lookup*、*left\
    \ join*、*right join*、*inner join* 或 *full outer join*。\n\n以下屏幕截图显示了如何创建外部连接的示例：\n\
    \n![](img/06379e43783b9ddfee45e9da5192efe1_108_0.png)\n\n图 4.12 – 数据配方中外部连接的示例\n\
    \n执行以下步骤以在配方中连接数据：\n\n1. 在两个节点之间或在至少有一个输入节点的配方末尾点击 **Add Node** 按钮（+）。\n2. 选择\
    \ **Join**。\n3. 选择要连接的数据并选择要包含的列。\n4. 点击 **Next**。\n5. 选择所需的 **Join Type**。\n\
    6. 根据需要更改 **Join Keys** 设置。请注意，配方会从两组输入数据中添加建议的键。你可以使用多个键（最多五个）来匹配记录（如果需要）。\n\
    7. 为来自右侧数据源的列输入前缀（**API Name Prefix for Right Columns**）。这将防止左右数据源之间列的 API 名称冲突。\n\
    8. 在右侧面板的 **Columns** 选项卡中选择要包含在配方中的列。\n9. 点击 **Preview** 预览所有包含的列及其数据。\n10. 如果需要从预览中隐藏列，请点击\
    \ **Hide** 按钮（E）。\n11. 点击 **Apply** 将节点添加到配方中。\n12. **Save** 配方。\n\n> **Types\
    \ of data joins**\n> 我假设你已经了解各种数据类型连接。注意，该主题已在 *第 5 章《使用 TCRM Data Prep 进行高级 ETL》*\
    \ 中详细解释。\n\n## Outputting data from recipes\n\n输出节点将配方结果写入 TCRM 数据集或外部系统。所需输入如下：\n\
    \n- **Write To**：写入数据集或 CSV 文件。\n- **Dataset Display Label**。\n- **Dataset API\
    \ Name**。\n- **App Location**。\n- **Sharing Source:** 如果打开了共享继承，则需要此选项。\n- **Security\
    \ Predicate:** 此选项使用谓词过滤器添加行级安全性。\n\n> **Warning**\n> \n> 将 **Dataset API Name**\
    \ 选项设置为与现有 TCRM 数据集相同将覆盖该数据集。\n\n不久后，你将有更多输出选项可供选择，因为以下选项目前正在开发中：\n\n- Amazon\
    \ S3 output connection\n- Salesforce output connection\n- Snowflake output connection\n\
    - Tableau Online output connection\n\n## A hands-on exercise in data transformation\n\
    \n在本动手练习中，我们希望创建一个新的数据集来分析属于具有开放商机的账户的服务案例。\n\n执行以下步骤，使用各种转换修改现有的 `MyFirstRecipe`\
    \ 配方；必须仔细按顺序执行这些步骤：\n\n1. 从 **Data Manager** 打开 `MyFirstRecipe` 配方。\n2. 在数据流中直接在输入节点之后创建第二个分支。\n\
    3. 在此新分支中添加 **Filter** 节点，以便包含所有商机阶段，除了 **Closed Lost** 和 **Closed Won**。\n4.\
    \ 在 **Filter** 节点的右侧添加 **Join** 节点，以用案例信息增强商机数据。仅选择这些 **Case** 字段：**Account ID,\
    \ Case Number, Status, Subject,** 和 **Case Type**。使用 **Left join** 节点，按 **Account\
    \ ID** 匹配，并添加 API 名称前缀 **Case**。\n\n"
