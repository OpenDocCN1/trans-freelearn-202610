    At this stage, the lens should look like this:


    ![](img/06379e43783b9ddfee45e9da5192efe1_161_0.png)


    Figure 6.5 – Lens''s progress once the filter has been applied


    Continue to edit your lens as follows:


    +   1. On the far right-hand side, click on the **Charts** button, which looks
    like a column chart, then select the **Combo** chart under **LINES**.

    +   2. Click on **Formatting** (the paintbrush icon), then click the drop-down
    arrow next to **Combo Chart**. Click on the **Axis Mode** dropdown and select
    **Dual Axis**.

    +   3. Scroll down the right-hand menu until you see the **Legend** dropdown.
    Click on it and deselect the **Show legend header** check box.

    +   4. Under the **Position** dropdown, select **top-center**.

    +   5. Scroll down the right-hand menu until you see the **Conditional Formatting**
    drop-down arrow. Click the arrow, click on the drop-down list for **Apply Conditional
    Formatting To**, and select **Measure**.

    +   6. Pick a new color for both **Sum of Amount** and **Count of Rows**.

    +   7. Scroll up (close the expanded sections if you want to) and expand **X-Axis**
    by clicking on the arrow.'
