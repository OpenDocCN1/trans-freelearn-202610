    \ 'StageName' asc, 'Account.Owner.Name' asc, 'Pushed' asc, 'ForecastCategoryName'\
    \ asc);\n```\n\n## Buckets (complex)\n\nSimple buckets can be created in the recipe\
    \ builder; more complex use cases require code. The following example was used\
    \ to create custom-formatted reference lines:\n\n```\n\"steps\": {\n    \"Clone_of_myKPI_1\"\
    : {\n        \"broadcastFacet\": true,\n        \"groups\": [],\n        \"label\"\
    : \"Clone of myKPI\",\n        \"numbers\": [],\n        \"query\": \"q = load\
    \ \\\"opportunity\\\";\\nq = group q by 'Account.Industry';\\nq = foreach q generate\
    \ 'Account.Industry' as 'Account.Industry', sum('Amount') as 'sum_Amount';\\nq\
    \ = group q by all;\\nq = foreach q generate \\\"Median by Industry  \\\" + case\
    \ when median(sum_Amount) >= 1000000 then number_to_string(trunc(median(sum_Amount),\
    \ -6)/1000000, \\\"$#,###\\\") + \\\"M\\\" when median(sum_Amount) >= 1000 then\
    \ number_to_string(trunc(median(sum_Amount), -3)/1000, \\\"$###\\\") + \\\"K\\\
    \" else number_to_string(trunc(median(sum_Amount)), \\\"$###\\\") end as 'Median';\\\
    n\\n\",\n    }\n\"measureAxis1\": {\n    \"sqrtScale\": false,\n    \"showTitle\"\
    : true,\n    \"showAxis\": true,\n    \"referenceLines\": [\n        {\n     \
    \       \"color\": \"#FF6419\",\n            \"label\": \"{{cell(myKPI_2.result,0,\\\
    \"Average\\\").asString()}}\",\n            \"value\": \"{{cell(myKPI_1.result,0,\\\
    \"avg_Amount\\\").asObject()}}\"\n        },\n    ]\n```\n"
