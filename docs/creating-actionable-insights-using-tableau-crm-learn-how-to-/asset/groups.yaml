    \n仔细查看此示例，你会看到它包含构建仪表板的指令。以下示例显示了基本的部件/步骤 JSON：\n\n### 基本部件/步骤 JSON\n\n![](img/06379e43783b9ddfee45e9da5192efe1_260_0.png)\n\
