    \ 重度自定义数据流 | 注重性能调优 |\n| 准备数据并弄清正确的粒度及预转换 | 规划较少/快速启动 |\n|  | 在仪表板 Json 中直接自定义\
    \ Saql |\n|  | 可以利用步骤编辑来创建/测试查询 |\n\n图 3.5 – 数据层与设计师层\n\n你必须选择哪种方法最适合你的使用案例和数据。\n\
