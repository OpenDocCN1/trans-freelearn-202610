    +   - Tips and hints


    # Technical requirements


    You will need the following to successfully execute the instructions in this chapter:


    +   - A laptop or desktop with internet access (a tablet or phone is not sufficient)

    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM)

    +   - A working email address


    Ensure that you''re logged into your TCRM dev org.


    # Lenses – the investigative journalists of TCRM


    What exactly is a lens? Think of a lens as your data exploration tool in Tableau
    CRM, combining a data query with a visualization in a simple, powerful, and dynamic
    interface.


    A lens enables you to perform the following tasks:


    +   - Explore the various characteristics of your dataset, including dimensions,
    measures, field labels, and names.

    +   - Slice and dice data using various measures, dimensions, filters, and formulas.

    +   - Create visualizations and tables that can be clipped to a dashboard.

    +   - Create visualizations and tables that can be shared with other users.


    In the next section, you are going to get your hands dirty in TCRM and work with
    lenses.'
  md: "\nThese fields can also be renamed in the **Transform** node, as illustrated\
    \ in the following screenshot:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_147_0.png)\n\
    \nFigure 5.28 – Renaming fields in the Transform node\n\nRegarding the two highlighted\
    \ columns, the following applies:\n\n- **Role ID Path**: This column has all the\
    \ role IDs that are above the role ID in the row listed, separated by a backslash.\
    \ If **Include child node** is enabled, it lists the role ID of the row as well\
    \ in the path (self).\n- **Role ID Nodes**: This column has all the role IDs in\
    \ the hierarchy of the role ID in the row listed as a multi-value.\n\nThe **Transform**\
    \ node can then be used in the join to map the owner ID of the opportunity record\
    \ and the user ID from the user role to determine the accessibility of each record,\
    \ as seen here:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_147_1.png)\n\nFigure\
    \ 5.29 – Use of the Transform node in the join to map the owner ID of the opportunity\
    \ record and the user ID from the user role\n\nThis **Role ID Path** field or\
    \ **Role ID Nodes** field is then used in the security predicate to determine\
    \ the accessibility of a row in the dataset. See *Chapter 7, Security in Tableau\
    \ CRM*, for more information about security predicates.\n\n## Predict Missing\
    \ Values – how and when to use\n\nWhen can you use the **Predict Missing Values**\
    \ transform to fill in missing values in a dimension column? First, in order to\
    \ make an accurate prediction, each column must have fewer than 200 unique values.\
    \ Also, you must verify that these predictive columns contain clean, high-quality\
    \ data, or the predicted values will be misleading.\n\nHow can you use the **Predict\
    \ Missing Values** transform? Note the following:\n\n- When you click **Apply**\
    \ to add a transformation to the **Transform** node, the preview pane will show\
    \ the original column with the missing values and the new column with **Predict**\
    \ at the end of the header.\n- You will see **Prediction TBD** for predicted values\
    \ in the new column.\n- The predicted values will not appear until after you run\
    \ the recipe.\n- Run the recipe to generate the predictions—you can then view\
    \ the dataset as a values table to see the predictions.\n- Add the **Drop Columns**\
    \ transformation after the **Predict Missing Values** transformation to drop the\
    \ original column from the dataset, as required.\n\n> **Limitations to Keep in\
    \ Mind**\n> \n> Firstly, if there are not enough rows to make accurate predictions,\
    \ TCRM will not insert any predicted values. Secondly, you cannot apply any transformations\
    \ on predicted columns. Finally, recipes that predict values can sometimes take\
    \ longer to run.\n\n## Sentiment detection explained\n\nUsing **natural language\
    \ processing (NLP)** and ML, sentiment detection can extract valuable information\
    \ from text fields, such as reviews, case comments, and social media posts. Use\
    \ the **Detect Sentiment** transformation in a Data Prep recipe to categorize\
    \ that information into one of the following three sentiments:\n\n- **Positive**\n\
    - **Negative**\n- **Neutral**\n\nIn other words, you don't need a new ML project,\
    \ an ML system, new infrastructure, or a separate data pipeline to detect sentiments\
    \ from your unstructured data. The **Detect Sentiment** transformation in TCRM\
    \ Data Prep does it all!\n\nSome potential use cases for the **Detect Sentiment**\
    \ transformation include the following:\n\n- Customer service/**customer satisfaction\
    \ (CSAT)** based upon survey responses\n- Sales coaching and trend identification\n\
    - Social media brand management\n\nThe **Detect Sentiment** transformation supports\
    \ English text only and works on a single-dimension column. It processes non-English\
    \ text as English and ignores all images. The transformation returns `null` when\
    \ the input value is `null` and returns `neutral` when the input value is an empty\
    \ string (`''`).\n\n## Advanced hands-on exercise\n\nThe purpose of this exercise\
    \ is to create a single dataset that contains a summary of every account that\
    \ meets all of the following conditions: has open opportunities, at least one\
    \ activity, and an open case attached to the account.\n\nThe resulting dataset\
    \ should allow the user to determine the following via direct exploration of the\
    \ lens based on the dataset:\n\n- Account name\n- Age of account\n- Owner name\n\
    - No. of open opportunities\n- No. of open cases\n- Average case duration\n- No.\
    \ of activities\n- Total amount\n- Total expected amount\n- Total amount (opportunity\
    \ with line items)\n- Total amount (opportunity without line items)\n\n### Resources\
    \ required\n\nData sources that are available in your TCRM environment will be\
    \ used for the purpose of this exercise. Please use the datasets found under the\
    \ My First Analytics App app so that the results will be consistent with the following\
    \ steps:\n\n- Opportunities\n- Cases\n- Activities\n- Accounts\n- Users\n\n###\
    \ Steps to follow\n\nBuild a new recipe in your demo TCRM environment and follow\
    \ these steps:\n\n1. Select Opportunities, Accounts, Activities, Cases, and Users\
    \ for your recipe input data. The panel on the right allows the selection of columns,\
    \ and although you can proceed by selecting all columns, ideally you would only\
    \ want to work with the columns required.\n2. Add filters that are required as\
    \ per the exercise objectives.\n3. Add some aggregation nodes as you know that\
    \ Opportunities, Cases, and Activities have a lower granularity than Accounts.\
    \ As such, you will need to aggregate all of them to the same granularity (Accounts)\
    \ so that you are able to perform joins in the later steps to meet the objectives.\n\
    4. Your aggregation on the Opportunities data input will split the opportunity\
    \ and expected amounts into two columns—with line items and without, as that was\
    \ a requirement. However, this also means that you do not have a field that has\
    \ the total amount and total expected amount. Create a Transform node that helps\
    \ you bring the totals back into the dataset build.\n5. Make the necessary joins\
    \ so that you can work toward your final dataset.\n\nWhen you open the completed\
    \ dataset as a lens, it will look like this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_152_0.png)\n\
    \nFigure 5.31 – Completed dataset for the hands-on exercise: bar view\n\nLooking\
    \ at the dataset as a values table, it will look like this:\n\n## Summary\n\n\
    In this chapter, you learned how to use the more advanced ETL tools available\
    \ in Data Prep and TCRM recipes. You should now be able to join, aggregate, flatten,\
    \ and transform your data with confidence using the TCRM data preparation GUI.\
    \ This includes the use of complex and custom transformations using formulas.\n\
    \nIn the following chapter, you will learn how to use the data exploration tool\
    \ known as a TCRM lens, and you will understand how lenses are the building blocks\
    \ of TCRM dashboards.\n\n## Questions\n\nHere is a list of questions to test your\
    \ knowledge:\n\n- What is the difference between a lookup join, an inner join,\
    \ and a full join?\n- Give one real-world example of how to use a full join.\n\
    - Why would you need to connect data from external sources with Salesforce objects?\
    \ Give one practical example.\n- Explain how to combine aggregation and grouping\
    \ using two data streams in one recipe.\n- The Multiple Row Formula option must\
    \ be selected to perform window functions. What are window functions, and when\
    \ might you use them?\n- What is a flatten transformation, and what is a use case\
    \ for this?\n\nIn this chapter, we will cover the following topics:\n\n- Lenses\
    \ – the investigative journalists of TCRM\n- Creating, editing, and cloning lenses\n\
    - Using lenses to create a TCRM analytics dashboard\n- Tips and hints\n\n## Technical\
    \ requirements\n\nYou will need the following to successfully execute the instructions\
    \ in this chapter:\n\n- A laptop or desktop with internet access (a tablet or\
    \ phone is not sufficient)\n- The latest version of the Google Chrome browser\
    \ (Chrome is the preferred browser when working with TCRM)\n- A working email\
    \ address\n\nEnsure that you're logged into your TCRM dev org.\n\n## Lenses –\
    \ the investigative journalists of TCRM\n\nWhat exactly is a lens? Think of a\
    \ lens as your data exploration tool in Tableau CRM, combining a data query with\
    \ a visualization in a simple, powerful, and dynamic interface.\n\nA lens enables\
    \ you to perform the following tasks:\n\n- Explore the various characteristics\
    \ of your dataset, including dimensions, measures, field labels, and names.\n\
    - Slice and dice data using various measures, dimensions, filters, and formulas.\n\
    - Create visualizations and tables that can be clipped to a dashboard.\n- Create\
    \ visualizations and tables that can be shared with other users.\n\nIn the next\
    \ section, you are going to get your hands dirty in TCRM and work with lenses.\n"
  mdcn: "\n\n这些字段也可以在 **Transform** 节点中重命名，如以下屏幕截图所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_147_0.png)\n\
    \n图 5.28 – 在 Transform 节点中重命名字段\n\n关于两个高亮列，适用以下说明：\n\n- **Role ID Path**：该列列出了在该行之上所有角色\
    \ ID，以反斜杠分隔。如果启用了 **Include child node**，它也会在路径中列出该行的角色 ID（self）。\n- **Role ID\
    \ Nodes**：该列将该行角色 ID 的层级中的所有角色 ID 列为多值。\n\n然后 **Transform** 节点可以在连接中使用，以映射机会记录的所有者\
    \ ID 和来自用户角色的用户 ID，从而确定每条记录的可访问性，如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_147_1.png)\n\
    \n图 5.29 – 在连接中使用 Transform 节点映射机会记录的所有者 ID 和来自用户角色的用户 ID\n\n然后该 **Role ID Path**\
    \ 字段或 **Role ID Nodes** 字段在安全谓词中使用，以确定数据集中某一行的可访问性。有关安全谓词的更多信息，请参阅 *第 7 章，Tableau\
    \ CRM 中的安全*。\n\n## 预测缺失值 – 如何以及何时使用\n\n何时可以使用 **Predict Missing Values** 转换来填充维度列中的缺失值？首先，为了做出准确的预测，每个列必须少于\
    \ 200 个唯一值。此外，您必须验证这些预测列包含干净、高质量的数据，否则预测值会具有误导性。\n\n如何使用 **Predict Missing Values**\
    \ 转换？请注意以下事项：\n\n- 当您单击 **Apply** 将转换添加到 **Transform** 节点时，预览窗格将显示原始列，其中包含缺失值，以及新列，其标题末尾带有\
    \ **Predict**。\n- 您将在新列中看到预测值的 **Prediction TBD**。\n- 预测值在运行配方后才会出现。\n- 运行配方以生成预测——然后您可以将数据集作为值表查看以查看预测结果。\n\
    - 在 **Predict Missing Values** 转换之后添加 **Drop Columns** 转换，以根据需要从数据集中删除原始列。\n\n\
    > **需要牢记的限制**\n> \n> 首先，如果没有足够的行来做出准确的预测，TCRM 不会插入任何预测值。其次，您不能对预测列应用任何转换。最后，预测值的配方有时运行时间会更长。\n\
    \n## 情感检测说明\n\n使用 **自然语言处理 (NLP)** 和 ML，情感检测可以从文本字段中提取有价值的信息，例如评论、案例评论和社交媒体帖子。在\
    \ Data Prep 配方中使用 **Detect Sentiment** 转换，将该信息分类为以下三种情感之一：\n\n- **Positive**\n\
    - **Negative**\n- **Neutral**\n\n换句话说，您不需要新的 ML 项目、ML 系统、新基础设施或单独的数据管道来检测非结构化数据的情感。TCRM\
    \ Data Prep 中的 **Detect Sentiment** 转换即可完成所有操作！\n\n**Detect Sentiment** 转换的一些潜在用例包括以下内容：\n\
    \n- 基于调查响应的客户服务/**客户满意度 (CSAT)**\n- 销售辅导和趋势识别\n- 社交媒体品牌管理\n\n**Detect Sentiment**\
    \ 转换仅支持英文文本，并且在单个维度列上工作。它将非英文文本作为英文处理并忽略所有图像。当输入值为 `null` 时，转换返回 `null`，当输入值为空字符串\
    \ (`''`) 时返回 `neutral`。\n\n## 高级动手练习\n\n本练习的目的是创建一个单一数据集，其中包含满足以下所有条件的每个账户的汇总：有开放的机会、至少一项活动，以及附加到账户的开放案例。\n\
    \n resulting 数据集应允许用户通过基于该数据集的透镜的直接探索来确定以下内容：\n\n- 账户名称\n- 账户年龄\n- 所有者姓名\n- 开放机会数量\n\
    - 开放案例数量\n- 平均案例持续时间\n- 活动数量\n- 总金额\n- 总预期金额\n- 总金额（带行项目的机会）\n- 总金额（不带行项目的机会）\n\
    \n### 所需资源\n\n将在您的 TCRM 环境中可用的数据源用于本练习。请使用 My First Analytics App 应用下找到的数据集，以便结果与以下步骤保持一致：\n\
    \n- Opportunities\n- Cases\n- Activities\n- Accounts\n- Users\n\n### 需遵循的步骤\n\n\
    在您的演示 TCRM 环境中构建一个新的配方并遵循以下步骤：\n\n1. 选择 Opportunities、Accounts、Activities、Cases\
    \ 和 Users 作为您的配方输入数据。右侧面板允许选择列，虽然您可以选择所有列后继续，但理想情况下您只想使用所需的列。\n2. 添加根据练习目标所需的过滤器。\n\
    3. 添加一些聚合节点，因为您知道 Opportunities、Cases 和 Activities 的粒度低于 Accounts。因此，您需要将它们全部聚合到相同的粒度（Accounts），以便在后面的步骤中能够执行连接以满足目标。\n\
    4. 您对 Opportunities 数据输入的聚合会将机会和预期金额拆分为两列——带行项目和不带行项目，因为这是要求。然而，这也意味着您没有包含总金额和总预期金额的字段。创建一个\
    \ Transform 节点，帮助您将总计带回数据集构建中。\n5. 进行必要的连接，以便您能够朝着最终数据集努力。\n\n当您以透镜形式打开完成的数据集时，它看起来像这样：\n\
    \n![](img/06379e43783b9ddfee45e9da5192efe1_152_0.png)\n\n图 5.31 – 动手练习的完成数据集：条形图视图\n\
    \n以值表形式查看数据集时，它看起来像这样：\n\n## 总结\n\n在本章中，您学习了如何在 Data Prep 和 TCRM 配方中使用更高级的 ETL\
    \ 工具。现在您应该能够使用 TCRM 数据准备 GUI 自信地连接、聚合、展平和转换您的数据。这包括使用公式进行复杂和自定义转换。\n\n在下一章中，您将学习如何使用名为\
    \ TCRM lens 的数据探索工具，并了解透镜是如何 TCRM 仪表板的构建块。\n\n## 问题\n\n以下是测试您知识的问题列表：\n\n- 查找连接、内部连接和完全连接之间有什么区别？\n\
    - 给出一个使用完全连接的现实世界示例。\n- 为什么需要将来自外部源的数据与 Salesforce 对象连接？给出一个实际示例。\n- 解释如何使用一个配方中的两个数据流组合聚合和分组。\n\
    - 必须选择 Multiple Row Formula 选项才能执行窗口函数。什么是窗口函数，以及您可能在何时使用它们？\n- 什么是展平转换，以及此转换的用例是什么？\n\
    \n在本章中，我们将涵盖以下主题：\n\n- Lenses – TCRM 的调查记者\n- 创建、编辑和克隆透镜\n- 使用透镜创建 TCRM 分析仪表板\n\
    - 提示和技巧\n\n## 技术要求\n\n要成功执行本章中的说明，您需要以下内容：\n\n- 一台具有互联网访问权限的笔记本电脑或台式机（平板电脑或手机不够用）\n\
    - Google Chrome 浏览器的最新版本（在处理 TCRM 时，Chrome 是首选浏览器）\n- 一个有效的电子邮件地址\n\n确保您已登录到您的\
    \ TCRM 开发组织。\n\n## Lenses – TCRM 的调查记者\n\n什么是透镜？将透镜视为 Tableau CRM 中的数据探索工具，将数据查询与可视化结合在一个简单、强大且动态的界面中。\n\
    \n透镜使您能够执行以下任务：\n\n- 探索数据集的各种特征，包括维度、度量、字段标签和名称。\n- 使用各种度量、维度、过滤器和公式对数据进行切片和切分。\n\
    - 创建可剪切到仪表板的视觉效果和表格。\n- 创建可与其它用户共享的视觉效果和表格。\n\n在下一节中，您将亲自动手在 TCRM 中操作并使用透镜。\n\n"
