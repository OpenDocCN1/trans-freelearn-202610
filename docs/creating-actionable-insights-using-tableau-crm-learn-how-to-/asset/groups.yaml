    # Contributors


    # About the author


    **Mark Tossell** is passionate about solving problems and improving processes
    using data. Tableau CRM (Einstein Analytics) and Tableau, powered by AI, are the
    tools of his trade. He is a proud wearer of the Salesforce Gold Hoodie and a recipient
    of the inaugural APAC Awesome Admin award. He is also a Trailhead learning addict,
    having earned over 420 badges. In addition, he is honored to be a Tableau CRM
    Ambassador and a Salesforce Partner solution engineer.


    Mark lives in Sydney, Australia, with his wife, Christina, and son, Adam.'
  - '[PAGE 4]


    # About the reviewers


    Gayathri Shivakumar has over 23 years of experience in the IT Industry, with around
    10 years'' experience in Salesforce technology. She holds a double master''s in
    computer science and is working on a doctorate in data science. A data nerd and
    a proud mom of two beautiful daughters, she is passionate about mentoring young
    minds.


    > I am pleased to have donned this hat for the first time as a book reviewer for
    this book on a subject that is very close to my heart. Thank you, Mark Tossell,
    for giving me this wonderful opportunity. Also, a note of thanks to my family
    and friends who have supported me in this endeavor.


    Mustapha El Hassak is a Salesforce Certified Technical Architect (CTA) and 15x
    Salesforce Certified. He has 11+ years of experience working in IT and is currently
    working as a Salesforce Senior Technical Architect. He has also been a technical
    reviewer for the book Talend Open Studio Cookbook.


    > I thank Almighty Allah, who showers his blessings and showed me the right path,
    which paved the way to the successful completion of this work.

    > I express my special thanks to my parents, Khadija and Hassan, my brother, Said,
    and my sister, Asmae, for their continued support. I also express my infinite
    gratitude to my wife Halima for her patience and encouragement. Finally, a big
    thanks to my little daughter, Sirine, and my little boy, Yahya.'
