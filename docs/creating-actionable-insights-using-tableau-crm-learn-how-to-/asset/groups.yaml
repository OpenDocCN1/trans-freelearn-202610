    \ case scenarios for security predicates?\n\n    You can control data visibility\
    \ via:\n\n    - Role hierarchy\n    - Manager hierarchy\n    - User territory\n\
    \n- A security predicate expression must not exceed how many characters?\n\n \
    \   5,000\n\n- Is this a valid predicate expression? Why, or why not? \"Revenue\"\
    >100\n\n    No; there must be at least one space between the dataset column and\
    \ the operator, between the operator and the value, and before and after logical\
    \ operators.\n\n- A security predicate expression is case-sensitive – True or\
    \ False?\n\n    True\n\n## Chapter 8\n\n- If you want a colleague to access a\
    \ particular view of a dashboard and drill into the data, how would you share\
    \ it with them?\n\n    Use a sharing URL.\n\n- What is the purpose of the \"Copy\
    \ widget to clipboard\" command?\n\n    It copies a widget, or several widgets,\
    \ to the clipboard for pasting anywhere on a dashboard.\n\n## Chapter 9\n\n- What\
    \ is the recommended number of default columns for a dashboard?\n\n    50\n\n\
    - When you move from one dashboard page to another, do any filters applied to\
    \ the first page remain in place?\n\n    Yes\n\n- How could you use the container\
    \ widget in a dashboard?\n\n    The container widget can be used to create a highlights\
    \ panel that can be moved and resized as one item containing a group of widgets.\n\
    \n- What is meant by a top-down dashboard design, and how is it facilitated by\
    \ TCRM pages?\n\n    A versatile, top-down design for a dashboard using TCRM pages\
    \ overcomes several obstacles and provides a simple, flexible interface for slicing\
    \ and dicing data.\n\n- The Clone Query command clones the query and opens it\
    \ for **editing**.\n\n- Give three examples of use cases for using TCRM pages.\n\
    \n    Pages can be used to zoom in and out of charts for further analysis, reveal\
    \ greater detail on a hero chart, or facilitate data segmentation.\n\n- When you\
    \ move from page to page within a dashboard, do the applied filters remain, or\
    \ are they cleared?\n\n    They remain.\n\n- When might you need SAQL?\n\n   \
    \ You may use SAQL when you need to do custom calculations, advanced data manipulations\
    \ on the fly, co-grouping (joining) data from different datasets, top/bottom lists,\
    \ in conjunction with binding for dynamic values on charts, and so on.\n\n- Keywords\
    \ and functions are written in uppercase, and they are not case-sensitive. True\
    \ or False?\n\n    False\n\n- Where do you edit SAQL?\n\n    Every step of a lens\
    \ is SAQL-based, so it can be edited and/or custom SAQL added. These can be viewed\
    \ in JSON editor mode or copied to a JSON editor of your choice.\n\n- What keyboard\
    \ shortcut do you use to access the dashboard JSON?\n\n    *Command or Ctrl +\
    \ E.*\n\n- Give three examples of use cases for bindings to make a dashboard more\
    \ interactive and dynamic.\n\n    - Dynamic reference lines\n    - Dynamic groupings\n\
    \    - Dynamic measures\n\n## Chapter 10\n\nFill in the blanks:\n\n- Security\
    \ **predicates**\n- Bindings in the **JSON**\n- SAQL **expressions**\n- Bulk actions\
    \ (using **Visualforce** and the TCRM REST API)\n- **Timeseries** (modified)\n\
    - XMD – advanced **formatting** options\n\n## Chapter 11\n\nFill in the blanks:\n\
    \n- Choose your **chart** types carefully.\n- Never seek to put all the available\
    \ **information** on the same page.\n- Utilize a small number of **colors** and\
    \ **shades**.\n- Make the dashboard as easy to **use** as possible.\n- Employ\
    \ wise **layout** choices.\n- Always provide **context** for your insights.\n\
    - Keep things **simple**.\n- Balance functionality with **creativity** – effective\
    \ does not imply boring.\n- Supply the user with the level of **detail** required\
    \ and no more.\n- Understand **how** and **where** the dashboard will be used.\n\
    \n## Chapter 12\n\n- How do embedded dashboards aid user adoption of TCRM?\n\n\
    \    You embed the insights in front of the user in the CRM workflow, where they\
    \ will inevitably view the dashboards as they work in their **business as usual\
    \ (BAU)** environment.\n\n- Give three examples of configured record actions supported\
    \ in TCRM.\n\n    - Create and update object records.\n    - Log a call.\n   \
    \ - Custom actions to trigger Lightning components, flows, and Visualforce Pages.\n\
    \n- What is the purpose of the dashboard filter when embedding a TCRM dashboard\
    \ via Lightning App Builder?\n\n    When an embedded dashboard is ready in the\
    \ layout, it will show information for all accounts, and you want it to show only\
    \ information for the account record being displayed. Adding a dashboard filter\
    \ will accomplish this.\n\n- Give one example of how you can drive automation\
    \ in Salesforce from TCRM.\n\n    Kick off a Lightning flow by creating a task\
    \ that is configured in such a way as to trigger the flow.\n\n![](img/06379e43783b9ddfee45e9da5192efe1_355_0.png)\n\
    \nPackt.com\n\nSubscribe to our online digital library for full access to over\
    \ 7,000 books and videos, as well as industry leading tools to help you plan your\
