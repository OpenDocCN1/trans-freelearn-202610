    # Technical requirements


    The following is required to successfully execute the instructions in this chapter:


    +   - A laptop or desktop with internet access (a tablet or a phone is not sufficient).

    +   - The latest version of the Google Chrome browser (Chrome is the preferred
    browser when working with TCRM).

    +   - A working email address.

    +   - Make sure you are logged in to your TCRM dev org, as demonstrated in *Chapter
    2, Developing Your First OOTB Analytics App in TCRM.*


    # The capabilities of TCRM for data connections


    TCRM offers you a great many options regarding the data that you can **extract**,
    **load**, **transform**, and **analyze**. This section will introduce you to the
    framework and tools that Tableau CRM provides for data ingestion and transformation.
    The resulting datasets will drive the lenses and dashboards that give your users
    the business insights they require.


    In Tableau CRM, data connection and integration involve ingesting and preparing
    the Salesforce data and external data you want to visualize and investigate. External
    data is information that lives outside of the Salesforce org that is connected
    to your TCRM environment. This includes data from another Salesforce org, external
    applications, flat files, and other databases. After ingesting, connecting, and
    transforming the data, analytics users can analyze and explore it using TCRM lenses
    and dashboards.


    Data preparation is the process of transforming your data into a form that is
    useful and helpful to the people consuming it. In order for you to understand
    how TCRM performs these operations, first, you must understand what datasets are,
    how they are designed, and how they are built. This will be explained in the following
    section.'
