    \        \"align\": \"center\",\n        \"subtitleLabel\": \"\"\n```\n\n### 自定义选择绑定\n\
    \n简单选择绑定可以在GUI中通过基本的代码理解来创建和编辑，但更复杂的用例需要使用JSON。\n\n以下是一个日期期间切换筛选器的示例：\n\n```json\n\
    \"static_1\": {\n    \"broadcastFacet\": true,\n    \"groups\": [],\n    \"numbers\"\
    : [],\n    \"selectMode\": \"singlerequired\",\n    \"strings\": [],\n    \"type\"\
