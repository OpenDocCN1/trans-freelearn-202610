  现在，你已经完成了动手实践的数据转换练习，是时候回顾本章所学的内容了。\n\n### 总结\n\n在本章中，你学习了如何在 TCRM 中创建和修改数据配方，从而深入了解并熟练掌握数据配方的可视化界面。现在，你应该能够使用桶、聚合和计算等多种函数来转换配方中的数据。此外，你学习了如何使用查找连接和外连接等各种连接类型来连接和追加数据集。最后，你现在应该有信心将配方中的数据输出为\
  \ CSV 或 TCRM 数据集。\n\n在下一章中，你将了解 Tableau CRM 数据流编辑器的全部功能。传统上，功能更强大的 ETL（提取、传输和加载）工作就在此完成。你将学习如何组合多个数据源、执行复杂的转换和计算，以及创建多个数据集。\n\
