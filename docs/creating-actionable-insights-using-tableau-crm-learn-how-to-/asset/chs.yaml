  ## 在 TCRM 中创建和配置记录操作


  简而言之，记录操作使您能够*对记录执行操作*。这意味着您无需从 TCRM 跳转到 Salesforce、将报表导出到 Excel，或执行任何其他笨拙的变通方法来*对洞察执行操作*——您可以直接从
  TCRM 仪表盘对它们执行操作。


  让我们看看如何使用已配置的记录操作对 Salesforce 记录执行操作。


  ### 已配置的记录操作


