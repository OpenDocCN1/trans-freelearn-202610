  \ Aurora |  |  |  |\n|  |  | Amazon RDS SQL Aurora PostgreSQL |  |  |  |\n\n图 3.4\
  \ – 截至 2021 年 4 月 TCRM 可用的远程数据连接\n\nTableau CRM 平台持续扩展和发展。最新的连接器列表，请参阅 Salesforce\
  \ 支持文档：\n\n`https://help.salesforce.com/articleView?id=sf.bi_integrate_connectors_remote.htm&type=5`\n\
  \nTCRM 数据连接框架和工具并非没有局限性，下一节将对此进行讨论。\n\n### TCRM 数据连接的局限性\n\n你已经了解了 TCRM 在数据集成方面能够实现的功能。现在，我们来看看数据集成的一些局限性，如下所示：\n\
  \n- Salesforce 公式字段中存储的结果，只有在对相关对象执行完整复制后，才会在 TCRM 数据集中更新。\n- 根据 Spring '21 版本，数据同步的当前上限为\
  \ 100 个对象。\n- 每个对象只能执行一次数据同步。如果你需要从同一个对象执行多次数据同步，这一点就很重要。\n\n> 重要提示\n> 在 TCRM 不具备所需\
  \ ETL 功能的情况下，可以使用 Tableau Prep Builder。更多信息请参阅 https://www.tableau.com/products/prep。\n\
  \n现在是时候使用 Salesforce 数据创建你的第一个自定义数据集了。\n\n### 将 Salesforce 数据导入 TCRM\n\n本节将详细介绍如何摄取\
  \ Salesforce 数据，并创建适用于分析和探索的数据集。在构建第一个数据集之前，你需要先考虑数据集的设计。\n\n#### 设计数据集\n\nTCRM\
  \ 数据以倒排索引结构存储。理想情况下，你应从最低、最细粒度的层级（即子表）开始，沿着层级路径向上连接到父表，构建一个能够回答相关业务问题的数据集。你可以使用多个数据集并将其补充为一个大型数据集，也可以在仪表板编辑器中使用\
  \ SAQL 即时计算和汇总数据。\n\n你必须理解数据集，并根据业务问题的需要来使用它。也就是说，设计数据集时，请考虑以下事项：\n\n- 避免试图在一个数据集中构建数据仓库。\n\
  - 同时，数据集也不是单个表的替代品；它应包含与分析用例和相关业务问题有关的对象字段（例如数据表中的字段）。\n- 始终考虑通过多个数据集互相补充来获得所需结果，或在仪表板中利用不同数据集之间相互作用的图表（每个图表都在最低粒度级别回答相应的业务问题）。可以根据需要将数据集连接到仪表板，以启用切面筛选。\n\
  - **SAQL（Salesforce Analytics Query Language）**也是解决某些用例的不错选择。\n\n例如，假设企业想要分析产品对商机赢单率的影响。可用于分析的相关对象包括：\n\
  \n- Account\n- Contact\n- Opportunity\n- User\n- Product\n- Product family\n\n\n\
  \n\n\n现在，哪个对象能为你的数据流左侧提供所需的粒度？例如，是机会对象还是产品对象？在本例中，因为你想要检查产品对机会的影响，而单个机会是感兴趣的关键记录，你会选择机会对象作为基础粒度，然后从那里构建数据流，以创建一个包含分析所需相关信息的数据集。你在稍后本章完成动手练习后会更好地理解这一点。\n\
  \n一个有争议的话题是数据应该在数据层还是设计师层（查询运行时）进行转换。下面的表格比较了这两种方法：\n\n| 数据层 | 仪表板查询运行时 |\n|---|---|\n\
  | 一次性 | 仪表板特定/重复 |\n| 实现开始时花费更多时间 | 多次 |\n| 思考/规划更多但对仪表板设计师层更友好 | 独立于数据层 |\n| 重度自定义数据流\
  \ | 注重性能调优 |\n| 准备数据并弄清正确的粒度及预转换 | 规划较少/快速启动 |\n|  | 在仪表板 Json 中直接自定义 Saql |\n|\
  \  | 可以利用步骤编辑来创建/测试查询 |\n\n图 3.5 – 数据层与设计师层\n\n你必须选择哪种方法最适合你的使用案例和数据。\n\n使用 Salesforce\
  \ 数据构建数据集的最简单方法是使用 TCRM 数据集构建器，如以下部分所示。\n\n### 数据集构建器\n\n登录你的 TCRM 开发组织并打开 Tableau\
  \ CRM Analytics Studio。按以下步骤顺序创建来自 Salesforce 数据的数据集：\n\n- 1. 导航到页面的右上角并点击 **Create**。然后，点击\
  \ **Dataset**。\n- 2. 选择 **Salesforce data** 选项。\n- 3. 当你到达以下对话框时，按以下截图所示填写它，**Dataset\
  \ Name** 输入为 `MyFirstDataset`：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_79_0.png)\n\
  \n图 3.6 – 为本次练习填写好的新建数据集对话框\n\n- 4. 点击 **Next**。一个新的浏览器标签页将自动打开，显示 TCRM 数据集构建器。\n\
  \n现在你要构建一个简单的数据集来分析机会所有者和线索来源对机会获胜率的影响。你将用于此分析的相关对象如下：\n\n- (a) **Account**\n- (b)\
  \ **Contact**\n- (c) **Opportunity**\n- (d) **User**\n\n- 5. 因为你的最低粒度或最精细细节是机会对象，你将从那里开始。所以，在搜索窗口中输入\
  \ `Opportunity` 来选择第一个对象，这将带你到此对话框：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_80_0.png)\n\
  \n图 3.7 – 从数据集构建器开始\n\n- 6. 接下来，将鼠标悬停在对象上并点击 + 按钮 – 这将为你提供向 **Opportunity** 对象添加字段或相关对象的选项，如以下截图所示：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_80_1.png)\n\n图 3.8 – 向根对象添加字段和关系\n\n\
  7. 继续选择以下字段：\n\n- (a) **Amount**\n- (b) **Close Date**\n- (c) **Lead Source**\n\
  - (d) **Name**\n- (e) **Opportunity ID**\n- (f) **Stage**\n- (g) **Won**\n\n> **Note**\n\
  > 重要的是要确保你选择了将用于向数据集添加对象关系所需的任何 ID 字段；否则，相关对象将没有用于链接的键。当我向基础对象添加新对象时，我总是添加对象 ID，以防以后构建关系时需要。\n\
  \n8. 接下来，点击 **RELATIONSHIPS** 选项卡并连接以下对象：\n\n- (a) **Account (Account ID)**\n- (b)\
  \ **Contact (Contact ID)**\n- (c) **User (Owner ID)**\n\n你现在应该有一个看起来像这样的对象关系图：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_81_0.png)\n\n图 3.9 – 对象关系图\n\n9. 对 **Account**、**Contact**\
  \ 和 **User** 对象执行类似的过程，并添加提及的字段。对于 **Account**，添加以下字段：\n\n- (a) **Account ID**\n\
  - (b) **Account Name**\n- (c) **Industry**\n- (d) **Billing Country**\n- (e) **Billing\
  \ City**\n- (f) **Billing State/Province**\n\n10. 对于 **Contact**，添加以下字段：\n\n- (a)\
  \ **Contact ID**\n- (b) **Full Name**\n- (c) **Mailing Country**\n- (d) **Mailing\
  \ City**\n- (e) **Mailing State/Province**\n\n11. 对于 **User**，添加以下字段：\n\n- (a) **User\
  \ ID**\n- (b) **Full Name**\n\n12. 现在，如果你想添加有关账户所有者的信息，该怎么做？让我们考虑以下选项：\n\n- (a)\
  \ 在数据集构建器中完成数据集的创建，然后在数据准备工具中进行所需的更改。\n- (b) 在数据集构建器中向账户对象添加关系。\n- (c) 在数据集构建器中完成数据集的创建，然后使用数据集配方添加有关账户所有者的信息。\n\
  \n如果你选择了 (b) – *在数据集构建器中向账户对象添加关系* – 那么你是正确的。更复杂的更改可能需要你使用配方或 TCRM 数据准备工具，但添加有关账户所有者的信息可以在数据集构建器中轻松完成。\n\
  \n13. 按照迄今为止所做的方式进行类似的过程，并添加账户所有者信息（**User** 对象）。\n\n17. 点击刷新按钮 – 在 **Figure 3.12**\
  \ 中由红色箭头突出显示 – 直到 **My First Analytics App eltDataflow** 数据流完成运行。忽略关于 **augment_Contact**\
  \ 节点的任何错误消息，因为这与开发组织中配额所有者相关的缺失数据有关且无关紧要。你的新数据集现在已准备好检查，因此返回 Analytics Studio。\n\
  \n> **Note**\n> \n> 通常，你需要在浏览器标签页之间导航以在 Analytics Studio 和数据管理器之间切换。\n\n18. 导航到\
  \ **My First Analytics App** 并打开你的新数据集 **MyFirstDataset**。这将打开一个未命名的镜头，你可以在其中探索新数据集。初始镜头视图如下所示：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_84_0.png)\n\n现在你已经从头创建了第一个数据集，如果你想通过增强平面文件（CSV\
  \ 文件）为此数据集添加更多上下文怎么办？在下一节中，我们将解释如何做到这一点，你可以在 TCRM 开发组织中跟随操作。\n\n> **Note**\n> 编辑数据集字段属性时常见的错误是将维度错误分类为度量。例如，邮政编码/邮编通常默认设置为度量，但该字段用于分组，而不是数学计算，因此需要更改为维度。\n\
  \n将 CSV 数据集与 Salesforce 和外部数据结合的过程在以下其中一个位置执行，所有这些都将在本书后面介绍：\n\n- 在数据配方中 – 请参阅 *Chapter\
  \ 4, Building Data Recipes (the Cooking up data recipes in TCRM section)* 和 *Chapter\
  \ 5, Advanced ETL Using TCRM Data Prep*。\n- 在镜头内 – 请参阅 *Chapter 6, TCRM Lenses –\
  \ Diving Into Your Data One Click At A Time (the Creating, editing, and cloning\
  \ lenses section)*。\n- 在仪表板编辑器中的查询内 – 请参阅 *Chapter 9, Advanced Dashboard Design\
  \ and Build (SAQL)*。\n\n### 常见问题和挑战\n\n以下是你在从 Salesforce 或 CSV 数据创建数据集时可能遇到的一些常见问题和挑战：\n\
  \n- *如果我在数据集构建器中犯了错误，我可以重新打开它并进行更正吗？* 不可以，一旦你选择创建数据集，就无法重新打开数据集构建器。更改然后需要在数据准备工具中进行。\n\
  - *我在上传 CSV 文件时编辑字段属性时出错，现在我想进行更改 – 该怎么做？* 你必须在 TCRM 数据准备工具中进行此类更改；你无法返回字段属性编辑对话框。\n\
  - *在数据集构建器中增强 Salesforce 对象时，如果我需要进行内部或外部连接，而不是简单的查找或左连接怎么办？* 这无法在数据集构建器中执行；必须在数据配方或数据流构建器中完成。\n\
  - *我已将 CSV 数据增强到数据集，但现在需要更新该 CSV 数据。我可以做什么？* 例如，CSV 文件包含销售目标，而这些已发生变化。此处的解决方案是编辑数据集，点击\
  \ **Replace Data**，并上传更新后的 CSV。注意保持相同的字段映射和设置。\n- *我使用数据集构建器从 Salesforce 数据创建了数据集，但现在\
  \ Salesforce 中的数据模型和结构已发生变化。我该怎么办？* 在这种情况下，你有两个选择：要么使用数据集构建器从头重新创建数据集，要么在 TCRM 数据准备工具中编辑现有数据集。\n\
  \n\n\n\n\n### 摘要\n\n在本节中，你学习了如何从各种来源提取数据并将其导入 TCRM。现在，你应该已经很好地了解了 TCRM 从 Salesforce、平面文件和其他数据源导入数据时的功能与限制，以及实现这些功能的框架和工具。你已经学会了如何根据\
  \ Salesforce 数据和 CSV 文件创建数据集，并通过实践练习亲自完成了这些操作。这些课程为你在 TCRM 中转换数据和构建仪表板方面的专业能力奠定了基础。\n\
  \n在下一章中，将定义并讲解如何在 TCRM 中创建数据配方。然后，以本章中创建的数据集为基础，你将能够对数据应用筛选器、计算和转换，从而创建符合业务用例要求的新数据集。\n\
  \n### 问题\n\n以下问题可用于检验你对本章内容的掌握程度：\n\n- 什么是数据同步？\n- 列出 TCRM 提供的五种远程数据连接。\n- 数据集生成器的用途是什么——根据\
  \ Salesforce 数据、外部数据，还是两者创建数据集？\n- 使用数据集生成器时，为什么必须确保选择添加对象关系所需的 ID 字段？\n- 编辑数据集字段属性时通常会出现什么错误？\n"
- "## 4 在 TCRM 中构建数据配方\n构建数据配方\n\n现在，你已经确信自己能够创建**开箱即用的分析应用**模板，是时候开始学习如何构建**自定义分析应用**了，首先从**数据转换**开始。本章将定义并讲解如何在\
  \ **TCRM** 中创建数据配方。以*第 3 章，连接数据源*中创建的数据集为基础，你将学习如何对数据应用**筛选器**、**连接**、**计算**、**转换**等操作。\n\
  \n那么，到本章结束时，你将能够做些什么？首先，你将清楚地了解如何在 TCRM 中创建数据配方。其次，你将熟悉数据配方用户界面，并能够熟练使用它。第三，你将学会使用**分箱**、**聚合**和**计算**等功能在配方中转换数据。第四，你将学会连接和追加数据集，包括如何使用各种连接类型，例如**查找连接**和**内连接**。最后，你将能够自信地从配方中输出\
  \ *CSV* 或 *TCRM* 数据集。\n\n本章将介绍以下主题：\n\n- 在 TCRM 中构建数据配方\n- 在配方中转换数据\n- 在配方中连接数据\n\
  - 数据转换实践练习\n\n### 技术要求\n\n要成功执行本章中的说明，需要满足以下要求：\n\n- 一台可访问互联网的笔记本电脑或台式机（平板电脑或手机不满足要求）。\n\
  - 最新版本的 Google Chrome 浏览器（使用 TCRM 时，Chrome 是首选浏览器）。\n- 一个可正常使用的电子邮箱地址。\n- 确保已登录\
  \ TCRM 开发组织。\n\n## 在 TCRM 中构建数据配方\n\n本节将解释什么是数据配方、何时以及为什么应使用数据配方，以及如何创建第一个简单的配方。\n\
  \n### 什么是数据配方？\n\nTCRM 数据配方用于将多个数据集合并为一个数据集，并借助*智能建议*、*列配置文件*和*强大的转换功能*准备、清理和转换数据。\n\
  \n对于几乎没有数据集成经验、希望获得数据清理指导的 Salesforce 管理员和分析师而言，配方非常合适，同时还能够预览转换结果。此外，对于希望通过无代码可视化界面创建数据集的资深数据专家来说，配方也是一种强大的工具。\n\
  \n数据配方可以帮助你完成以下操作：\n\n- 预览数据，并查看应用转换后数据如何变化。\n- 轻松快速地删除列或更改列标签。\n- 使用列配置文件分析数据的质量和组成。\n\
  - 通过智能建议改进和转换数据。\n- 无需编写代码即可对值进行分箱（**SAQL**，即 **Salesforce Analytics Query Language**）。\n\
  - 使用可视化公式生成器，通过计算列快速转换数据。\n- 使用点击式界面快速、轻松地转换值，确保数据一致性。例如，你可以在不使用公式的情况下替换、拆分和修剪值。\n\
  - 查看所有更改的历史记录，并通过后退或前进来重新执行这些更改。\n- 使用直观的可视化界面轻松应用各种连接，例如内连接和外连接。\n\n本章将介绍数据配方生成器。*第\
  \ 5 章，使用 TCRM Data Prep 进行高级 ETL*将指导你如何使用 TCRM 平台执行更高级的数据准备操作。\n\n> **重要说明**\n>\
  \ TCRM 中相对较新的可视化数据准备工具，俗称 **Data Prep 3.0**，与数据配方生成器完全相同。本章提供的详细解释和说明同样适用于这一新工具，该工具简称为数据准备。\n\
  \n### 如何创建数据配方？\n\n现在，我将向你展示如何创建一个简单的配方。让我们从之前创建的数据集 **MyFirstDataset** 开始。执行以下步骤即可开始：\n\
  \n1. 在 Analytics Studio 中导航到 **Data Manager**，然后从左侧菜单中选择 **Dataflows & Recipes**。\n\
  2. 点击 **Recipes** 选项卡。\n3. 点击 **Create Recipe**。此时将打开一个新的浏览器选项卡。\n4. 点击 **Select\
  \ Data** 按钮。此时将打开一个名为 **Select Input Data** 的对话框。\n\n这是一个非常简单的示例，目的只是展示如何创建配方。在接下来的详细说明中，你将完成一个全面的实践练习，以提升相关技能。\n\
  \n现在，让我们来看看如何使用配方转换数据集中的数据。\n\n### 在配方中转换数据\n\n数据配方是一种快速、直观且功能强大的数据组合、聚合和转换工具。以下各节将带你了解这些配方中可用的各种工具：\n\
  \n- 添加数据\n- 追加数据\n- 筛选数据\n- 聚合数据\n- 转换数据\n\n完成这些说明性章节后，你将进行实践练习，以提升使用数据配方的技能。\n\n\
  ### 添加数据\n\n虽然你通常会在创建配方时选择输入数据，但也可以根据需要向现有配方中添加更多数据。配方生成器画布会为你添加的每组数据显示一个单独的输入节点。\n\
  \n要向现有配方中添加更多数据，只需点击配方生成器画布左上角的 **Select Data**，该按钮由标准数据集图标和旁边的 + 按钮组成。按照创建配方时添加源数据集所使用的类似步骤进行操作。默认情况下会包含所有列。\n\
  \n添加 Append 节点后，你应该会看到类似以下屏幕截图的内容。在此处，你可以查看配方生成器根据列名分配的默认列（字段）映射：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_96_0.png)\n\
  \n图 4.5 – 追加数据前匹配字段\n\n要追加数据，必须执行以下步骤：\n\n1. 调整映射关系，手动映射所有未映射的列，或者让这些列保持未映射状态。\n\
  2. 要映射两列，只需在对应配方列旁输入追加行中的列名。\n3. 如果希望添加追加行中存在、但配方中不存在的列，请点击已映射列下方的 + 按钮——Add Mapping——然后选择相应列。之后，将配方列留空。\n\
  4. 点击 Apply，将追加节点添加到配方中。\n5. 保存配方。\n\n> **重要说明**\n> 如果某列在一个源中进行了映射、而在另一个源中没有映射，Append\
  \ 节点会针对不适用该列的所有源行插入 null 值。\n> \n> 如果配方列包含用于标识每一行的唯一 ID，则必须确保追加的数据不会重复这些行 ID。Append\
  \ 节点不会识别和删除重复记录，也不会验证列值的唯一性。\n\n\n\n\n\n## 过滤数据\n\n数据配方中的过滤节点使您能够快速过滤数据以适应使用场景。也就是说，您可以删除希望从输出数据集(s)中排除的数据行。\n\
  \n要过滤您的数据，请按照以下步骤操作：\n\n1. 添加一个新节点（如 *Figure 4.3* 所示）到您的配方中并选择 **Filter**。\n2. 添加过滤条件，如\
  \ *Figure 4.6* 所示。如果您选择在维度列上定义过滤条件，您可以从列表中选择过滤值。\n3. 点击 **Apply**。\n4. 保存配方。\n\n\
  以下屏幕截图显示了添加过滤条件时用户界面（UI）的外观：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_97_0.png)\n\
  \nFigure 4.6 – Adding filter conditions\n\n4. 您可以通过在 **Group Columns** 字段中添加最多两个维度列、为每个列选择值并点击\
  \ **Apply** 来将维度透视为列。\n5. 配置完聚合后，点击 **Apply**。\n6. 保存配方。\n\n这是添加聚合节点时 UI 的外观：\n\n\
  ![](img/06379e43783b9ddfee45e9da5192efe1_99_0.png)\n\nFigure 4.7 – Applying an aggregate\
  \ node to a recipe\n\n> **Note Regarding Aggregation And Data Granularity**\n> 当您使用聚合节点时，较低（源）数据的粒度会在该数据配方的流中丢失。然而，最新的版本使您能够在聚合后通过连接将粒度带回来。\n\
  \n接下来，您将学习如何在 TCRM 中使用强大的转换工具。\n\n## 转换数据\n\n转换节点提供了大量的灵活性和功能 – UI 看起来像这样：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_100_0.png)\n\
  \nFigure 4.8 – Adding a transformation node\n\n在本节中，将涵盖以下转换：\n\n- Apply formulae\n\
  - Trim\n- Substring\n- Split\n- Uppercase and lowercase\n- Replace\n- Dimension\
  \ to measure\n- Dimension to date\n- Format dates\n- Bucket\n- Flatten\n- Edit attributes\n\
  - Drop columns\n- **Detect sentiment**\n- **Predict missing values**\n- **Discovery\
  \ predict**\n\n那么，让我们从第一个开始！\n\n### Apply formulae\n\n这会在配方中创建一个列，该列根据公式计算显示值。此计算将从同一行中的其他字段或跨行提取数据。您需要在\
  \ **EA-SQL format** 中输入公式 – 用于 *numeric*、*string* 和 *date* 数据的标准和自定义函数集合。\n\n公式对话框看起来像这样：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_101_0.png)\n\nFigure 4.9 – Custom formula\
  \ dialog box without (left-hand side) and with (right-hand side) the multiple row\
  \ formula option enabled\n\n要向您的配方添加公式，请按照以下步骤操作：\n\n1. 在 **Preview** 选项卡中选择一列。\n\
  2. 要为计算列添加公式，请在 **Transform** 工具栏中选择 **Formula** 按钮并选择 **Custom Formula**。然后公式编辑器会出现。\n\
  3. 在公式编辑器中，输入公式并使用正确的语法添加必要的参数。\n4. 对于具有窗口函数的公式，请选择 **Multiple row formula** 选项。选择用于划分行的列\
  \ **Partition By**，用于对数据进行排序的列 **Order By**，以及 **Sort Direction** 中的排序方向。\n5. 通过输入\
  \ API 名称或从 **Columns** 选项卡中选择列，按其 API 名称标识公式中的每个列。\n6. 在 **Output Type** 中，在文本、数字、日期或日期时间之间进行选择。\n\
  7. 根据输出类型，您可以分配这些属性：**Precision**（数字列中的最大位数）、**Scale**（数字列中小数点右侧的位数）、**Length**（文本列中的最大字符数）以及\
  \ **Date Format**。\n8. 在 **Default Value** 中，设置在表达式未返回结果时显示的值。\n9. 您可以根据需要更改计算列的标签。\n\
  10. 要将公式作为 **Transform node** 中的步骤添加，请点击 **Apply**。计算列随后将出现在配方预览中。\n11. **Save**\
  \ 配方。\n\n> **Tip**\n> 常见计算在 **Transform** 工具栏中拥有自己的函数按钮 – 这些按钮会为您用正确的列和语法填充公式。工具栏会根据所选列的数量和类型显示适当的函数。要使用函数，只需点击\
  \ **Transform** 工具栏中的 **Function** 按钮即可。\n\n有五种类型的函数可用：\n\n- **Date and time functions**：这些用于调整或从配方中的日期计算值。\n\
  - **Numeric operators and functions**：这些用于从配方中的度量计算值。\n- **String functions**：这些用于基于其他字符串创建值。\n\
  - **Window functions**：这些用于跨行执行计算。必须选择 **Multiple Row Formula** 选项才能使用窗口函数。\n- **Additional\
  \ functions**：这些与 `text`、`number`、`date_only` 和 `datetime` 数据类型一起使用，以向公式添加逻辑。\n\n\
  ### Trim\n\n此转换会从字符串中删除前导和尾随空格。您可以选择在以下三个位置之一显示结果：\n\n- 原始列（覆盖）。\n- 新列 – 保留原始列（新列需要给定标签）。\n\
  - 新列 – 删除原始列（新列需要给定标签）。\n\n### Substring\n\n这从值中的字符位置开始并提取指定长度的字符数到新字段。公式编辑器会出现，并且以下文本会被预填充：\n\
  \n```\nsubstr([target column], position, length)\n```\n\nsubstring 函数所需的输入可以在对话框中找到，如下所示：\n\
  \n- **Output Type**\n- **Length**\n- **Default Value**\n- **Show Results In**\n\
  - **Column Label**\n\n### Split\n\n此转换在指定的分隔符处将列值分为两个新值。所需的输入如下：\n\n- **Delimiter**\n\
  - **Show Results In**\n- **Column 1 Label**\n- **Column 2 Label**\n\n> **Note**\n\
  > Split transformation always creates two new columns.\n\n### Uppercase and lowercase\n\
  \n此选项将所选字段中的值转换为大写或小写。\n\n### Replace\n\n此转换在字段中查找特定值并将其替换为新值。请注意，会创建一个新字段，其中包含已替换的值和未更改的值。您也可以使用\
  \ replace 转换将空值替换为值。\n\n所需的输入如下：\n\n- **Find** 或 **Search** for null（在搜索窗口中）\n-\
  \ **Replace**（在搜索窗口中）\n- **Show Results In**\n- **Column Label**\n\n### Dimension\
  \ to measure\n\n此转换将 `Dimension` 列类型转换为 `Measure`，这允许对其值进行数学计算。您可以选择将结果显示在原始列中、在新列中并保留原始列，或在新列中并删除原始列。\n\
  \n### Dimension to date\n\n此转换将 `Dimension` 列类型转换为 `Date`，这允许您按日期组件（如年份和月份）进行分组和过滤。您可以选择将结果显示在原始列中、在新列中并保留原始列，或在新列中并删除原始列。\n\
  \n### Format dates\n\n此转换将所选 `Dimension` 列中的日期转换为指定格式。可选地，您可以将列类型转换为 `Date`。一致的格式允许您正确地按日期过滤和分组记录，包括按日期组件（如日）过滤。一致的日期格式还确保您可以将列类型从维度转换为日期。\n\
  \n\n\n\n\n所需输入如下：\n\n- **Original Formats**（例如 `yyyy-MM-dd'T'HH:mm:ss.SSS'Z'`）\n\
  - **Change To**（选择目标格式）\n- **Convert column type to Date**（复选框）\n- **Show Results\
  \ In**\n- **Column Label**\n\n> **Warning**\n> \n> 格式无法识别的值将被替换为 null 值。\n\n## Bucket\n\
  \nBucket 转换是一种快速简便的方式，可通过对度量、维度以及日期字段进行分桶来对数据进行分组和组织。Buckets 是通过在 bucket 窗口中点击 +\
  \ 按钮并定义范围来添加的。以下是其可能外观的示例：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_105_0.png)\n\
  \n图 4.10 – 将国家分桶为区域的 bucket 转换示例\n\n当你想从两个度量创建热力图时，或者为更深入的分析和机器学习创建派生维度时，Buckets\
  \ 是一个有用的工具。\n\n## Flatten\n\n此选项会将层级结构的排名数据展平成两列。Hierarchy nodes 列列出了每个节点的全部祖先。Hierarchy\
  \ path 列包含详细说明层级路径的字符串。请参阅图 4.11 以了解示例。\n\n为了配置 flatten 转换，你必须指定包含基于层级对应的父级的字段，以及包含层级中每个节点的字段。这将为每个层级节点生成一条记录，称为子节点。每条记录都包含两列生成的列，用于存储每个子节点的层级。一列包含层级中每个节点的祖先，另一列包含层级路径。\n\
  \n展平数据的所需步骤如下：\n\n1. 选择包含层级中所有子节点的维度列。\n2. 点击 **Flatten** 按钮。\n3. 输入 **Parent Column**\
  \ 属性详情。\n4. 选择是否在生成的 hierarchy nodes 和 path 列中 **Include child node**。\n5. 输入 **Hierarchy\
  \ Nodes Column Label** 属性 – 这是多值输出列的名称，其中包含层级中所有祖先的列表，按从最低级别到最高级别的顺序排列。\n6. 输入 **Hierarchy\
  \ Path Column Label** 属性 – 这是层级中所有祖先的层级路径，按从最低级别到最高级别的顺序排列，其中节点由正斜杠分隔。\n7. 预览结果以确保展平的层级正确。\n\
  8. 点击 **Apply** 将 flatten 转换添加到配方中。\n\n以下是展平数据集的示例，展示了祖先是如何存储的：\n\n| ROLE ID (CHILD\
  \ NODE) | ROLE NAME | PARENT ROLE ID | ROLES | ROLE PATH |\n|---|---|---|---|---|\n\
  | 1 | Salesperson 1 | 10 | 10, 20, 30 | / 10/20/30 |\n| 2 | Salesperson 2 | 10 |\
  \ 10, 20, 30 | / 10/20/30 |\n| 3 | Salesperson 3 | 11 | 11, 20, 30 | / 11/20/30\
  \ |\n| 10 | Regional Manager 1 | 20 | 20, 30 | / 20/30 |\n| 11 | Regional Manager\
  \ 2 | 20 | 20, 30 | / 20/30 |\n| 20 | Vice President 1 | 30 | 30 | / 30 |\n| 21\
  \ | Vice President 2 | 30 | 30 | / 30 |\n| 30 | CEO | Not applicable | Not applicable\
  \ | Not applicable |\n\n图 4.11 – 展示祖先如何存储的展平数据集示例\n\n关于 flatten 转换如何使用的更多细节将在第 5\
  \ 章《使用 TCRM Data Prep 进行高级 ETL》中介绍。\n\n## Edit attributes\n\n使用此转换更改列名和值格式。例如，你可以编辑以下内容：\n\
  \n- **Label**\n- **API Name**\n- **Length**\n- **Precision**\n- **Scale**\n\n##\
  \ Drop columns\n\n从配方中删除不需要的输入列。这将使你拥有用于转换和包含在最终数据集中的列子集。例如，你可以删除用于计算列的输入列。\n\n\
  ## Detect sentiment\n\n此转换用于确定文本的情感是积极、消极还是中性，并将这些值添加到指定的列中。\n\n如果 Einstein 无法确定某个字段的情感，则情感将被设为\
  \ null。\n\n## Predict missing values\n\nTableau CRM 会智能地用基于数据中其他强相关列的值的预测值替换所选列中的任何缺失值。\n\
  \n## Discovery prediction\n\n此操作会使用预测和规范性智能填充你的数据集，因为 Einstein 会逐行计算并保存预测结果。此外，你还可以存储主要预测因子和改进措施的描述。Discovery\
  \ prediction 节点使你能够在数据中评估预测，在部署到生产环境之前评估多个模型，并在仪表板中可视化聚合的预测信息。\n\n由于本书不涉及 Einstein\
  \ Discovery 的机器学习模型和预测，因此此处未详细介绍 discovery prediction 转换。\n\n## Joining data in\
  \ recipes\n\n使用 **Join** 节点将来自相关对象的列数据添加到配方中现有数据中。你可能会根据想要如何组合数据的方式使用以下其中一种连接方法：*lookup*、*left\
  \ join*、*right join*、*inner join* 或 *full outer join*。\n\n以下屏幕截图显示了如何创建外部连接的示例：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_108_0.png)\n\n图 4.12 – 数据配方中外部连接的示例\n\
  \n执行以下步骤以在配方中连接数据：\n\n1. 在两个节点之间或在至少有一个输入节点的配方末尾点击 **Add Node** 按钮（+）。\n2. 选择 **Join**。\n\
  3. 选择要连接的数据并选择要包含的列。\n4. 点击 **Next**。\n5. 选择所需的 **Join Type**。\n6. 根据需要更改 **Join\
  \ Keys** 设置。请注意，配方会从两组输入数据中添加建议的键。你可以使用多个键（最多五个）来匹配记录（如果需要）。\n7. 为来自右侧数据源的列输入前缀（**API\
  \ Name Prefix for Right Columns**）。这将防止左右数据源之间列的 API 名称冲突。\n8. 在右侧面板的 **Columns**\
  \ 选项卡中选择要包含在配方中的列。\n9. 点击 **Preview** 预览所有包含的列及其数据。\n10. 如果需要从预览中隐藏列，请点击 **Hide**\
  \ 按钮（E）。\n11. 点击 **Apply** 将节点添加到配方中。\n12. **Save** 配方。\n\n> **Types of data joins**\n\
  > 我假设你已经了解各种数据类型连接。注意，该主题已在 *第 5 章《使用 TCRM Data Prep 进行高级 ETL》* 中详细解释。\n\n## Outputting\
  \ data from recipes\n\n输出节点将配方结果写入 TCRM 数据集或外部系统。所需输入如下：\n\n- **Write To**：写入数据集或\
  \ CSV 文件。\n- **Dataset Display Label**。\n- **Dataset API Name**。\n- **App Location**。\n\
  - **Sharing Source:** 如果打开了共享继承，则需要此选项。\n- **Security Predicate:** 此选项使用谓词过滤器添加行级安全性。\n\
  \n> **Warning**\n> \n> 将 **Dataset API Name** 选项设置为与现有 TCRM 数据集相同将覆盖该数据集。\n\n不久后，你将有更多输出选项可供选择，因为以下选项目前正在开发中：\n\
  \n- Amazon S3 output connection\n- Salesforce output connection\n- Snowflake output\
  \ connection\n- Tableau Online output connection\n\n## A hands-on exercise in data\
