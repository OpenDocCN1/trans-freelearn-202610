  从数据到洞察再到行动的最后一个例子是学生成功洞察仪表板。在这种情况下，一旦从仪表板可视化中选定了所需的高风险学生群体，就可以在Salesforce中创建干预案例，并直接从仪表板记录表中分配给相应的学生顾问，如下面的截图所示：


