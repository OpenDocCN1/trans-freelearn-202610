  \  - 使用 trellis 功能并思考它最适合使用的场景。\n\n通过 lens 深入挖掘您的数据，您学到了什么？以下是一些示例问题：\n\n+   - 在仅使用点击而非代码工作时，您遇到了哪些限制？\n\
  +   - 有没有您不确定如何使用或认为在现实世界中用处不大的图表类型？\n+   - 您能否创建外观和感觉完全正确的图表，还是 lens 中的自定义功能有限？\n\
  \n现在您已对 Chart Mode 有信心，是时候使用 TRCM lens 中的一种灵活、无代码分析工具——Table Mode 了。\n\n### Analyzing\
  \ your data using Table Mode\n\n在本节中，您将学习如何使用 TCRM 中更灵活、更强大的工具之一——表格。\n\n首先，让我们看看值表。\n\
  \n### Values table\n\n值表用于查看记录值。打开 My First Lens 并更改为 Table Mode – Values Table。lens\
  \ 将更改为表格视图，如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_170_0.png)\n\nFigure\
  \ 6.13 – Initial values table view\n\n按以下步骤创建新的表格视图：\n\n+   - 选择 **Clone in New\
  \ Tab** 并保存为 **My First Table View**。\n+   - 按 **Stage = Closed Won** 过滤数据。\n+ \
  \  - 按 **Close Date = 1/1/2025 – 30/6/2025** 过滤数据。\n+   - 将 **Query Limit** 更改为\
  \ **1,000**。\n+   - 根据需要编辑您的列——请参阅以下截图。\n+   - 选择 **Formatting** 选项卡并选择新的表格 **theme**。\n\
  +   - 更改表格的 **spacing**。在 **Column Width** 下选择 **Fit To Widget**。\n+   - 修改 **Header**\
  \ 详情。\n+   - 添加表格背景颜色。\n+   - 删除行索引列。\n+   - 点击 **Column** 选项卡并为度量列添加 **Conditional\
  \ Formatting**——请参阅 **Figures 6.15 and 6.16**。\n+   - 尝试 **Column** 选项卡下的其他设置。\n\
  +   - **Save** 您的 lens。\n\n您编辑后的表格列应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_171_0.png)\n\
  \nFigure 6.14 – Editing table columns\n\n您修改后的表格可能如下所示：\n\n| AccountId.Name | OwnerId.Name\
  \ | Name | AccountId.Industry | Amount ↓ | Close Date |\n|---|---|---|---|---|---|\n\
  | Carr889 Inc | Johnny Green | Opportunity for Norman1354 | Communications | 5,294,610\
  \ | 2025-01-11 |\n| Stevenson954 Inc | Eric Gutierrez | Opportunity for Daniel875\
  \ | Insurance | 5,023,650 | 2025-05-08 |\n| Nichols662 Inc | Catherine Brown | Opportunity\
  \ for Alvarado1597 | Manufacturing | 4,824,325 | 2025-04-28 |\n| Flores188 Inc |\
  \ Kelly Frazier | Opportunity for Cunningham175 | Retail | 4,357,300 | 2025-02-16\
  \ |\n| Torres548 Inc | Evelyn Williamson | Opportunity for Watson580 | Biotechnology\
  \ | 4,090,680 | 2025-05-23 |\n| Watts685 Inc | John Williams | Opportunity for Rogers1242\
  \ | Biotechnology | 3,907,275 | 2025-04-01 |\n| Rios830 Inc | Johnny Green | Opportunity\
  \ for McDonald1503 | Apparel | 3,851,250 | 2025-02-03 |\n| Doyle498 Inc | Chris\
  \ Riley | Opportunity for Martin1417 | Transportation | 3,712,300 | 2025-03-31 |\n\
  | Fleming816 Inc | Laura Palmer | Opportunity for Smith309 | Insurance | 3,709,600\
  \ | 2025-02-09 |\n| Wood74 Inc | Johnny Green | Opportunity for Jackson1400 | Engineering\
  \ | 3,555,960 | 2025-01-13 |\n| Rodriguez608 Inc | Bruce Kennedy | Opportunity for\
  \ Houston1041 | Media | 3,513,380 | 2025-05-13 |\n| Joseph988 Inc | Dennis Howard\
  \ | Opportunity for Weber619 | Energy | 3,474,950 | 2025-06-19 |\n| Dawson161 Inc\
