  - 19. 点击**保存**以保存仪表板。\n\n进入**预览**模式，查看选择不同筛选器和使用开关时会发生什么。使用这些功能，以及通过点击图表中的维度进行分面，可以非常轻松地深入钻取仪表板数据。您的仪表板现在应如下所示：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_217_0.png)\n\n图8.6 – 添加了筛选器和开关的销售仪表板\n\
  \n### 向销售仪表板添加图像、日期、列表和范围小部件\n\n您将按照以下步骤添加图像、日期、列表和范围小部件：\n\n- 1. 通过将图像小部件拖到画布上并点击图像，为仪表板添加徽标。\n\
