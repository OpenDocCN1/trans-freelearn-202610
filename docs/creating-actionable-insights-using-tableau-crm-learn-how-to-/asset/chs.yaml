  ## 自定义 TCRM 分析应用\n\n在本节结束时，你应该能够编辑应用的配置，从而在一定程度上对其进行自定义。要自定义应用，需要执行以下两个步骤：\n\n-\
  \ 1. 将应用设置更改为自定义设置。\n- 2. 自定义详细的应用设置。\n\n让我们在以下各节中探索这些步骤。\n\n### 将应用设置更改为自定义设置\n\
  \n让我们进入我们创建的应用并编辑设置，如下所示：\n\n- 1. 在应用中点击 **Reconfigure app**，如下截图所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_58_0.png)\n\
  \n图 2.17 – 开始应用重新配置过程\n\n- 2. 接下来，通过勾选复选框并点击 **Continue** 确认覆盖现有设置和自定义是可以的。然后你将再次看到\
  \ **Sales Analytics - Personalize** 屏幕，继续操作，这次在被问及 **Choose how you would like to\
  \ create Sales Analytics** 时选择自定义设置。\n\n如以下截图所示，你可以根据需要添加其他对象：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_58_1.png)\n\
  \n图 2.18 – 为分析应用选择其他对象\n\n例如，如果你的组织在 Salesforce 中使用产品计划，你可以通过在此处添加该对象将其包含在你的分析应用中。\n\
  \n### 自定义详细应用设置\n\n现在我们可以开始自定义影响用户在分析中看到的内容的详细设置。让我们一起浏览这些对话框并进行一些更改。\n\n第一个框涉及客户细分；请继续编辑这些字段以更改应用配置，如下所示：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_59_0.png)\n\n图 2.19 – 对客户细分设置进行更改\n\n\
  接下来会有一系列对话框，你可以根据需要进行更改，例如：\n\n- 自定义用于细分地理区域的字段\n- 自定义用于细分产品的字段\n- 控制数据可见性\n- 向数据集和仪表板添加其他字段\n\
  \n请注意，每个 OOTB 分析应用都有其自己的配置选项集。当你能够从头创建自己的应用并构建自定义模板时，你将创建一个新的配置向导以满足需求。\n\n一旦个性化过程完成，你将被问到\
  \ **Are you sure you want to reconfigure your app?** 当然！点击 **OK**，然后等待你的应用重新配置。\n\
  \n一旦应用根据你的自定义规范重建，你就可以深入查看，你将看到资产中反映了你的修订设置。\n\n做得好——你已经创建并自定义了你的第一个 TCRM 应用！\n\n\
  但是，如果标准 OOTB 应用无法满足你的需求怎么办？如果需要更量身定制的分析资产，例如完全自定义的仪表板或从 **data warehouse** 引入数据的仪表板怎么办？不用担心——TCRM\
  \ 具有极强的灵活性，你的问题将在以下章节中得到解答。\n\n## 常见问题解答\n\n在你跟随本章并构建自己的应用时，你可能会遇到一些挑战或有疑问；接下来概述了四个最常见的问题。\n\
  \n### 我需要哪些许可证来构建和使用 TCRM？\n\nTCRM 需要 **Einstein Analytics Growth**（不含 Discovery）或\
  \ **Einstein Analytics Plus**（含 Discovery）许可证。有关用户许可证和 **permission set licenses\
  \ (PSLs)** 的信息可在 **Setup** 中找到，如以下截图所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_61_0.png)\n\
  \n图 2.20 – 在 Setup 中查找用户许可证信息\n\nSalesforce 会自动为你在组织中分配任何 TCRM 权限的用户分配 **Einstein\
  \ Analytics Growth** 权限集许可证。PSL 也可以手动分配给用户。创建和分配权限集的过程详细说明如下：\n\n- 1. 在 **Setup**\
  \ 菜单中，在 **Administration** 下，点击 **Users**，然后点击 **Permission Sets**，然后点击 **New**。\n\
  - 2. 将新权限集与 PSL 关联。在你购买 TCRM 许可证之前，你无法为 TCRM 选择任何 PSL。\n- 3. 从 PSL 中可用的权限中向权限集添加权限。\n\
  - 4. 将该权限集分配给用户。\n\n### 我需要哪些权限来访问、构建和编辑分析应用？\n\n**Einstein Analytics Growth license**\
  \ 中包含两个预建权限集，详情如下：\n\n- **Einstein Analytics Platform Admin**：在此处启用了管理 TCRM 平台所需的所有权限。这包括允许用户创建\
  \ TCRM 模板化和自定义应用的权限。\n- **Einstein Analytics Platform User**：在此处启用了使用 TCRM 平台和 TCRM\
  \ 模板化应用所需的所有权限。\n\n基本设置涉及通过 **Setup** 选择和分配预建权限集。**Einstein Analytics Plus license**\
  \ 中包含两个预建权限集，详情如下：\n\n- **Einstein Analytics Platform Admin**：此集合实现了管理 TCRM 平台所需的所有权限。这包括允许用户创建\
  \ TCRM 模板化和自定义应用的权限。\n- **Einstein Analytics Platform User**：此集合实现了使用 TCRM 平台和 TCRM\
  \ 模板化应用所需的所有权限。\n\n通过 **Setup** 选择和分配预建权限集是基本设置的一部分，如以下截图所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_62_0.png)\n\
  \n图 2.21 – 通过 Setup/Users/Permission Sets 访问的各种 TCRM 权限集\n\n\n\n\n\n在适当的权限集中，根据需要添加或删除分配。\n\
  \n要创建自己的自定义 TCRM 权限集，请使用以下链接采用高级设置：\n\n```\nhttps://help.salesforce.com/articleView?id=sf.bi_help_setup_advanced.htm&type=5\n\
  ```\n\n可以在此处找到高度详细的设置和配置信息：\n\n```\nhttps://help.salesforce.com/articleView?id=sf.bi_help_setup.htm&type=5\n\
  ```\n\n## 如何在我的组织中启用 TCRM？\n\n如果尚未启用 TCRM，您可以通过转到 设置 | 分析 | 入门，然后将其打开来启用它。\n\n##\
  \ AI 和 ML 是否随 TCRM 提供？\n\n以监督式 ML 形式存在的 Einstein 人工智能（AI）被称为 Einstein Discovery。这随\
  \ Einstein Analytics Plus 许可证提供。然而，Einstein Discovery 是一款复杂的工具，经常被误解且容易被误用，本书不涵盖它。敬请期待！\n\
  \n## 故障排除\n\n在本节中，我们将快速介绍在使用 TCRM 时开始使用时可能遇到的一些问题。这些问题听起来可能很简单，但对于刚熟悉该工具的人来说很常见。\n\
  \n### 我找不到我的 TCRM 应用或资产\n\n如果您在 TCRM Analytics Studio 主页上看不到您的应用，请点击左侧浏览下的全部项目选项，您应该会看到您的应用。\n\
  \n### 我无法从 Salesforce 主页到达 TCRM 主页\n\n如果您在 Salesforce 中的 **应用启动器** 中看不到 **Analytics\
  \ Studio**，请执行以下操作：\n\n- 1. 点击 **查看全部**。\n- 2. 搜索 **Analytics**。\n- 3. 点击 **Analytics\
  \ Studio**。\n\n然后您将到达 TCRM 主页。\n\n### 重新配置我的 TCRM 应用的链接在哪里？\n\n由于字体非常小，该链接很容易被遗漏。在浏览器页面的左上角，TCRM\
  \ 标志下方，您会看到应用标题。标题下方您会看到 **模板使用：Sales Analytics 5.0**——在此短语右侧，蓝色的是 **重新配置应用** 链接。\n\
  \n您也可以参考图 2.17 来了解 **重新配置应用** 链接的确切位置。\n\n### 应用创建期间新的应用数据流失败\n\n如果数据流失败，应用创建过程将无法成功完成。此失败可能会导致仪表板错误或其他意外行为。在数据流至少成功运行一次之前，请勿编辑数据流定义，否则应用创建将被放弃。\n\
  \n在此上下文中，数据流失败有三种可能原因，如下所述：\n\n- 1. **字段可用性** 或 **组织配置**——使用以下步骤解决：\n    - A. 修复组织配置。\n\
  \    - B. 通过 **数据管理器** 手动启动数据流。\n    - C. 数据流完成后在应用中点击 **重置**。\n    - D. 在向导中不更改任何选项的情况下完成重置过程。\n\
  \n- 2. **数据同步**：如果启用了 **数据同步**，在数据流执行期间创建新的模板化应用可能会失败，因为应用中使用的字段或对象尚未复制。这也可能发生在\
  \ TCRM 应用的新版本包含额外的默认字段时。使用以下步骤解决：\n    - A. 打开 **数据管理器**。\n    - B. 转到 **连接** 选项卡。\n\
  \    - C. 在 **同步调度程序** 下点击 **立即运行**。\n    - D. 数据流完成后在应用中点击 **重置**。\n    - E. 在向导中不更改任何选项的情况下完成重置过程。\n\
  \n- 3. **应用配置**：如果应用配置不正确，数据流可能会失败——例如，可能存在错误的字段引用或选择了错误的选项。使用以下步骤之一解决：\n    - A.\
  \ 删除应用并创建全新版本的应用。\n    - B. 重置应用并根据需要选择不同的答案。\n\n### 总结\n\n现在我们已经完成了创建和个性化 OOTB\
  \ TCRM 分析应用的旅程，您应该对分析应用是什么以及它如何工作有了很好的把握。您应该已经了解到 TCRM 应用模板提供了可根据使用情况配置的预建数据流和仪表板，并且您现在应该能够构建和个性化应用。此外，您应该对\
  \ TCRM UI、资产和工具有了实践感受，并且应该能够自信地浏览 **Analytics Studio** 主页。最后，您可以将 *故障排除* 部分作为便捷的参考工具，以防您遇到困难。\n\
  \n您应该获得的一些关键要点是：首先，TCRM 应用是 TCRM 资产的容器，以数据集、透镜、故事和仪表板的形式存在。其次，TCRM 应用可以被保护。第三，TCRM\
  \ 应用可以通过多种方式与他人共享。然后，TCRM 应用可以被模板化并在另一个环境中重现。最后，您可以使用标准设置部署 OOTB TCRM 应用，或将其配置以满足您的个性化需求。\n\
  \n在下一章中，您将学习如何提取、连接、组合、转换和注册业务数据，以便在 TCRM 中创建有用的数据集。\n\n### 问题\n\n现在尝试回答以下问题来测试您的知识：\n\
  \n- 什么是 TCRM 资产？举一个例子。\n- 如何共享 TCRM 应用？\n- 什么是 TCRM 透镜？\n- 真或假：TCRM 应用仅限于标准、OOTB\
  \ 设置。\n- TCRM 主页侧边菜单上的 **收藏夹** 链接的用途是什么？\n- 如果 OOTB TCRM 应用即使在您对其进行自定义后仍不符合您的要求，您该怎么办？\n\
  - 如何在 Salesforce 环境中启用 TCRM？\n"
