  \ 字段或 **Role ID Nodes** 字段在安全谓词中使用，以确定数据集中某一行的可访问性。有关安全谓词的更多信息，请参阅 *第 7 章，Tableau\
  \ CRM 中的安全*。\n\n### 预测缺失值 – 如何以及何时使用\n\n何时可以使用 **Predict Missing Values** 转换来填充维度列中的缺失值？首先，为了做出准确的预测，每个列必须少于\
  \ 200 个唯一值。此外，您必须验证这些预测列包含干净、高质量的数据，否则预测值会具有误导性。\n\n如何使用 **Predict Missing Values**\
  \ 转换？请注意以下事项：\n\n- 当您单击 **Apply** 将转换添加到 **Transform** 节点时，预览窗格将显示原始列，其中包含缺失值，以及新列，其标题末尾带有\
  \ **Predict**。\n- 您将在新列中看到预测值的 **Prediction TBD**。\n- 预测值在运行配方后才会出现。\n- 运行配方以生成预测——然后您可以将数据集作为值表查看以查看预测结果。\n\
  - 在 **Predict Missing Values** 转换之后添加 **Drop Columns** 转换，以根据需要从数据集中删除原始列。\n\n>\
  \ **需要牢记的限制**\n> \n> 首先，如果没有足够的行来做出准确的预测，TCRM 不会插入任何预测值。其次，您不能对预测列应用任何转换。最后，预测值的配方有时运行时间会更长。\n\
  \n### 情感检测说明\n\n使用 **自然语言处理 (NLP)** 和 ML，情感检测可以从文本字段中提取有价值的信息，例如评论、案例评论和社交媒体帖子。在\
  \ Data Prep 配方中使用 **Detect Sentiment** 转换，将该信息分类为以下三种情感之一：\n\n- **Positive**\n-\
  \ **Negative**\n- **Neutral**\n\n换句话说，您不需要新的 ML 项目、ML 系统、新基础设施或单独的数据管道来检测非结构化数据的情感。TCRM\
  \ Data Prep 中的 **Detect Sentiment** 转换即可完成所有操作！\n\n**Detect Sentiment** 转换的一些潜在用例包括以下内容：\n\
  \n- 基于调查响应的客户服务/**客户满意度 (CSAT)**\n- 销售辅导和趋势识别\n- 社交媒体品牌管理\n\n**Detect Sentiment**\
  \ 转换仅支持英文文本，并且在单个维度列上工作。它将非英文文本作为英文处理并忽略所有图像。当输入值为 `null` 时，转换返回 `null`，当输入值为空字符串\
  \ (`''`) 时返回 `neutral`。\n\n### 高级动手练习\n\n本练习的目的是创建一个单一数据集，其中包含满足以下所有条件的每个账户的汇总：有开放的机会、至少一项活动，以及附加到账户的开放案例。\n\
  \n resulting 数据集应允许用户通过基于该数据集的透镜的直接探索来确定以下内容：\n\n- 账户名称\n- 账户年龄\n- 所有者姓名\n- 开放机会数量\n\
  - 开放案例数量\n- 平均案例持续时间\n- 活动数量\n- 总金额\n- 总预期金额\n- 总金额（带行项目的机会）\n- 总金额（不带行项目的机会）\n\n\
  ### 所需资源\n\n将在您的 TCRM 环境中可用的数据源用于本练习。请使用 My First Analytics App 应用下找到的数据集，以便结果与以下步骤保持一致：\n\
  \n- Opportunities\n- Cases\n- Activities\n- Accounts\n- Users\n\n### 需遵循的步骤\n\n\
  在您的演示 TCRM 环境中构建一个新的配方并遵循以下步骤：\n\n1. 选择 Opportunities、Accounts、Activities、Cases\
  \ 和 Users 作为您的配方输入数据。右侧面板允许选择列，虽然您可以选择所有列后继续，但理想情况下您只想使用所需的列。\n2. 添加根据练习目标所需的过滤器。\n\
  3. 添加一些聚合节点，因为您知道 Opportunities、Cases 和 Activities 的粒度低于 Accounts。因此，您需要将它们全部聚合到相同的粒度（Accounts），以便在后面的步骤中能够执行连接以满足目标。\n\
  4. 您对 Opportunities 数据输入的聚合会将机会和预期金额拆分为两列——带行项目和不带行项目，因为这是要求。然而，这也意味着您没有包含总金额和总预期金额的字段。创建一个\
  \ Transform 节点，帮助您将总计带回数据集构建中。\n5. 进行必要的连接，以便您能够朝着最终数据集努力。\n\n当您以透镜形式打开完成的数据集时，它看起来像这样：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_152_0.png)\n\n图 5.31 – 动手练习的完成数据集：条形图视图\n\
  \n以值表形式查看数据集时，它看起来像这样：\n\n### 总结\n\n在本章中，您学习了如何在 Data Prep 和 TCRM 配方中使用更高级的 ETL\
  \ 工具。现在您应该能够使用 TCRM 数据准备 GUI 自信地连接、聚合、展平和转换您的数据。这包括使用公式进行复杂和自定义转换。\n\n在下一章中，您将学习如何使用名为\
  \ TCRM lens 的数据探索工具，并了解透镜是如何 TCRM 仪表板的构建块。\n\n### 问题\n\n以下是测试您知识的问题列表：\n\n- 查找连接、内部连接和完全连接之间有什么区别？\n\
  - 给出一个使用完全连接的现实世界示例。\n- 为什么需要将来自外部源的数据与 Salesforce 对象连接？给出一个实际示例。\n- 解释如何使用一个配方中的两个数据流组合聚合和分组。\n\
  - 必须选择 Multiple Row Formula 选项才能执行窗口函数。什么是窗口函数，以及您可能在何时使用它们？\n- 什么是展平转换，以及此转换的用例是什么？\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Lenses – TCRM 的调查记者\n- 创建、编辑和克隆透镜\n- 使用透镜创建 TCRM 分析仪表板\n\
  - 提示和技巧\n\n### 技术要求\n\n要成功执行本章中的说明，您需要以下内容：\n\n- 一台具有互联网访问权限的笔记本电脑或台式机（平板电脑或手机不够用）\n\
  - Google Chrome 浏览器的最新版本（在处理 TCRM 时，Chrome 是首选浏览器）\n- 一个有效的电子邮件地址\n\n确保您已登录到您的 TCRM\
  \ 开发组织。\n\n## Lenses – TCRM 的调查记者\n\n什么是透镜？将透镜视为 Tableau CRM 中的数据探索工具，将数据查询与可视化结合在一个简单、强大且动态的界面中。\n\
  \n透镜使您能够执行以下任务：\n\n- 探索数据集的各种特征，包括维度、度量、字段标签和名称。\n- 使用各种度量、维度、过滤器和公式对数据进行切片和切分。\n\
  - 创建可剪切到仪表板的视觉效果和表格。\n- 创建可与其它用户共享的视觉效果和表格。\n\n在下一节中，您将亲自动手在 TCRM 中操作并使用透镜。\n\n\n\
  \n\n\n### 创建、编辑和克隆镜头\n\n现在你已经了解镜头是什么以及其用途，接下来将在 TCRM 中构建和编辑一个镜头。在开始之前，这里是镜头 UI 的外观，其中标注了一些关键组件供参考：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_157_0.png)\n\n图 6.1 – TCRM 镜头 UI\n\n\
  你现在将学习如何在图表模式下使用镜头。\n\n### 使用图表模式\n\n打开 Analytics Studio 并按照以下步骤操作：\n\n- 1. 从 **All\
  \ Items** 列表中选择 **MyFirstDataset**。这将带你进入镜头 UI，镜头将在默认的图表模式下打开。\n- 2. 在屏幕左侧，使用下拉列表为\
  \ **Bar Length** 选择 **Sum of Amount**。\n- 3. 为 **Bars** 选择 **OwnerId.Name**。\n-\
  \ 4. 点击 **Sum of Amount** 旁边的下拉箭头并选择 **Sort Descending**。\n- 5. 在屏幕最右侧，点击 **Formatting**\
  \ 图标，它看起来像一把画笔。\n- 6. 在 **Title** 框中添加标题，命名为 **My First Lens**。\n- 7. 通过点击 **Save**\
  \ 按钮保存你的镜头，将其命名为 **My First Lens**，并保存为 **My First Analytics App**。\n\n恭喜！你已在 TCRM\
  \ 中创建了第一个镜头。结果应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_158_0.png)\n\n\
  图 6.2 – 以镜头形式查看的 MyFirstDataset\n\n在开始使用此镜头并探索 TCRM 镜头的功能之前，你需要了解管理工具，如以下屏幕截图所示：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_158_1.png)\n\n图 6.3 – 镜头管理工具\n\n镜头管理工具如下：\n\
  \n- **Save**：将镜头保存到 TCRM 应用以供将来使用。\n- **Create Story**：从镜头创建 Einstein Discovery\
  \ 故事。\n- **Undo/Redo**：撤消或重做最新操作。\n- **Clip to Designer**：如果仪表板在仪表板编辑器中打开，则镜头会被剪切或导出到仪表板作为小部件。\n\
  \n此时，镜头应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_161_0.png)\n\n图 6.5 –\
  \ 应用过滤器后镜头的进度\n\n继续按如下方式编辑你的镜头：\n\n- 1. 在最右侧，点击 **Charts** 按钮，它看起来像一列图表，然后在 **LINES**\
  \ 下选择 **Combo** 图表。\n- 2. 点击 **Formatting**（画笔图标），然后点击 **Combo Chart** 旁边的下拉箭头。点击\
  \ **Axis Mode** 下拉菜单并选择 **Dual Axis**。\n- 3. 向下滚动右侧菜单，直到看到 **Legend** 下拉菜单。点击它并取消选中\
  \ **Show legend header** 复选框。\n- 4. 在 **Position** 下拉菜单下，选择 **top-center**。\n- 5.\
  \ 向下滚动右侧菜单，直到看到 **Conditional Formatting** 下拉箭头。点击箭头，点击 **Apply Conditional Formatting\
  \ To** 的下拉列表，并选择 **Measure**。\n- 6. 为 **Sum of Amount** 和 **Count of Rows** 选择新的颜色。\n\
  - 7. 向上滚动（如果需要关闭已展开的区域）并通过点击箭头展开 **X-Axis**。\n- 8. 为 **X-Axis** 添加自定义标题 **Sales\
  \ Rep**。\n- 9. 向上滚动并为 **Ranked in descending order by value of deals won** 镜头添加\
  \ **subtitle**。\n- 10. 将 **Subtitle Font Size** 改为 **14**。\n- 11. **Save** 你的镜头。\n\
  - 12. 点击 **Present** 按钮进入全屏演示模式。\n\n到目前为止，你的镜头应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_162_0.png)\n\
  \n图 6.6 – 镜头进度显示为添加了条件格式和副标题的组合图\n\n接下来，你必须创建一个可视化，它还将显示每个销售代表相对于其目标的表现：\n\n- 1.\
  \ 点击屏幕右上角的 **Exit Full Screen** 按钮，它看起来像一个 **x**。\n- 2. 将图表类型更改为 **Polar Gauge**。注意这样做时，**Count\
  \ of Rows** 指标会移动到 **Unused Fields**。\n- 3. 点击 **Formatting** 选项卡并通过点击箭头展开 **Range\
  \ Values**。\n- 4. 将 **Max** 的值更改为 **4000000**。\n- 5. 展开 **Trellis** 部分，将 **Type**\
  \ 更改为 **Matrix**，将 **Size Ratio** 更改为 **Square**。注意镜头现在读起来容易得多。\n- 6. 对 **Sum of\
  \ Amount** 应用条件格式，将顶部箱的值更改为 **30000000**，并为顶部箱选择红色，为底部箱选择绿色。\n- 7. 展开 **Polar Gauge**\
  \ 部分并将 **Center Size** 更改为 **70%**。\n- 8. 将副标题更改为 **Performance to Target ($30M)**。\n\
  - 9. **Save** 镜头。\n\n极坐标仪表矩阵应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_163_0.png)\n\
  \n图 6.7 – 极坐标仪表矩阵\n\n现在，让我们学习如何深入镜头数据。打开 **My First Lens** 并按照以下步骤操作：\n\n- 1. 通过点击它选择\
  \ **Johnny Green** 的条形图。\n- 2. 这样做时，**Chart Mode** 按钮旁边会出现一个新按钮。将鼠标悬停在此新按钮上以查看其\
  \ **Drill down to group selections by the chosen dimension** 功能。点击 **Drill down**\
  \ 按钮。\n- 3. 你可以为 Johnny Green 的记录选择一个行业或查看数据表。选择 **AccountId.Industry**。\n- 4. 你现在看到的内容已按\
  \ **OwnerId.Name = Johnny Green** 过滤。如果你愿意，可以进一步向下钻取，查看单个记录的值表，等等。\n- 5. 关闭镜头而不保存它。\n\
  \n镜头中的向下钻取功能如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_164_0.png)\n\n图 6.8\
  \ – 镜头中的向下钻取功能\n\n现在，让我们创建一个新的镜头来比较指标并使用散点图了解相关性和比较。按照以下步骤操作：\n\n- 1. 在 **My First\
  \ Analytics App** 中打开 **Opportunities** 数据集。\n- 2. 为 **Closed** 添加过滤器，设置为 **Open**。\n\
  - 3. 创建一个散点图图表，其中 **X-Axis** 为 **Sum of Amount**，**Y-Axis** 为 **Count of Rows**，**Bubble\
  \ Size** 为 **Avg of Amount**，**Bubbles** 为 **Industry**。\n- 4. 将其保存为 **My First\
  \ Analytics App** 中的 **Oppty Scatter Plot**。\n\n镜头应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_165_0.png)\n\
  \n图 6.9 – 指标比较，如 Oppty Scatter Plot 镜头所示\n\n这种可视化有什么用？散点图可用于以下目的：\n\n- 展示两个变量之间的关系\
  \ -- 正相关或负相关、非线性或线性、以及/或强或弱\n- 识别相关关系\n- 识别数据模式，例如聚类\n\n镜头的一个强大功能是能够向你的可视化添加或连接第二个数据集。让我们通过执行以下步骤来尝试此操作：\n\
  \n- 1. 在 My First Analytics App 中打开 Opportunities 数据集。\n- 2. 在左上角，点击 Add Dataset。\n\
  - 3. 数据集默认作为 left blend 连接，但可以更改。将其保留为 Left Blend。\n- 4. 对于 Bar Length，选择 Opportunities\
  \ 数据集的 Sum of Amount。\n- 5. 按降序对该指标进行排序。\n- 6. 对于第二个 Bar Length，选择 Cases 数据集的 Count\
  \ of Rows。\n- 7. 对于条形图，为 **Opportunities** 和 **Cases** 数据集均选择 **Account Name**。\n\
  - 8. 选择 **Pyramid** 图表类型并按需要格式化。\n- 9. 将 **Query Limit** 更改为 **10,000**。\n- 10.\
  \ 将镜头保存为 **My First Analytics App** 中的 **Blended Datasets**。\n\n此镜头包含两个数据集，显示了所有有机会的账户中按账户名称划分的交易总和和案例总数。它应如下所示，具体取决于你的自定义设置：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_166_0.png)\n\n图 6.10 – Blended Datasets\
  \ 镜头\n\n能够向镜头添加第二个数据集的功能非常强大，因为它节省了使用配方创建新数据集或在 SAQL 中协同分组数据流以将两个数据集的数据合并到一个可视化中的需求。例如，这使得将机会数据和目标数据合并到一个图表中变得快速而简单。此功能还有许多其他用例。\n\
  \n### 使用 Show Fields 面板\n\n在镜头 UI 的左侧，数据集名称旁边有一个下拉箭头。点击它以显示 **Show Fields** 面板。点击它以显示\
  \ **Fields** 面板，其外观如下：\n\n\n\n\n\n### MyFirstDataset\n\n706 行\n\n学习使用字段面板\n\n搜索字段...\n\
  \n显示隐藏字段（0）\n\n显示字段 API 名称\n\n### 维度\n\n+   - Account ID\n+   - AccountId.BillingCity\n\
  +   - AccountId.BillingCountry\n+   - AccountId.BillingState\n+   - AccountId.Id\n\
  +   - AccountId.Industry\n+   - AccountId.Name\n+   - AccountId.OwnerId\n+   - AccountId.OwnerId.Id\n\
  +   - AccountId.OwnerId.Name\n+   - Contact ID\n+   - ContactId.Id\n+   - ContactId.MailingCity\n\
  +   - ContactId.MailingCountry\n+   - ContactId.MailingState\n+   - ContactId.Name\n\
  +   - Lead Source\n+   - Name\n+   - Opportunity ID\n+   - Owner ID\n\n### My First\
  \ Lens\n\n数据集\n\n添加数据集\n\nMyFirstDataset\n\nDATA\n\nFILTERS\n\nBar Length\n\nSum\
  \ of Amount\n\nBars\n\nOwnerId.Name\n\nTrellis\n\nUnused Fields\n\nQuery Limit\n\
  \nDefault\n\nEdit\n\nClose\n\nSave\n\nFigure 6.11 – The Fields panel\n\n每个字段可用的选项如下：\n\
  \n+   - **Rename**: 重命名字段标签。\n+   - **Hide**: 隐藏该字段。\n+   - **Edit Values**（仅限维度或日期）：可在此处编辑字段标签，并为每个值添加默认颜色。\n\
  +   - **Format Numbers**（仅限度量）：可将数字格式化以满足您的需求，例如货币舍入或百分比。\n+   - **Copy API Name**:\
  \ 将字段 API 名称复制到剪贴板。\n\n> **Note Regarding Changes Made in the Fields Panel**\n>\
  \ 需要注意的是，此处所做的任何更改都将应用于该数据集在任何地方的使用——这些是全局更改。\n\n在掌握了迄今为止的知识后，是时候通过一个实践练习来动手实践了。\n\
  \n### Hands-on exercise\n\n在您的 TCRM Analytics Studio 中按以下步骤操作：\n\n+   1. 在 TCRM\
