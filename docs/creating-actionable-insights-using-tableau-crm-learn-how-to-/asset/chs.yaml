  \ 在 **Time Bar Chart** 下，取消选中 **Show values in chart bars** 选项。\n9. 在 x 轴下，添加自定义标题：**Close\
  \ Date Month**。\n10. 在 y 轴（左侧）下，添加自定义标题：**Deal Size**。\n11. 在 y 轴下添加一条参考线，**Value**\
  \ 设置为 3000000，**Label** 值为 **Target**。\n12. 在 **Conditional Formatting** 下，单击 **Apply\
  \ Conditional Formatting To** 并选择 **Sum of Amount**。保留默认的渐变设置。\n13. 在 **Widget Style**\
  \ 下，按需添加边框。\n14. 添加一个文本部件为仪表板添加标题，**Sales Insights**，并按需更改字体和颜色。进入 **Preview** 模式。\n\
