  现在，你将看到易用性在仪表板设计中的重要性。


  ### 好的仪表板直观且易于使用


  出色的分析设计几乎无需或完全无需指导或培训即可使用。它真正直观——无需明确说明即可轻松理解或操作。当用户第一次看到直观的仪表板时，他们会确切地知道该做什么。






  在以下直观的销售分析示例中，用户只需点击侧边图表的条形即可深入查看数据，并看到地图反映其选择：


