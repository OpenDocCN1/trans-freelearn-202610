  - 14. 点击 **Save** 保存仪表板。\n- 15. 在 highlights 面板中为 **Lead Source** 添加一个 **List**\
  \ 小部件。将 **Selection Type** 更改为 **Multiple Selection**。\n- 16. 在 highlights 面板中为\
  \ **Industry** 添加一个 **List** 小部件。\n- 17. 在 highlights 面板中为 **Total Leads** 添加一个\
  \ **Number** 小部件。\n- 18. 在 highlights 面板中为 **Open Leads** 添加一个 **Number** 小部件（按\
  \ **Status** 过滤为不等于 **Closed**）。\n- 19. 点击 **Save** 保存仪表板。\n\n你的营销页面应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_224_0.png)\n\
  \nFigure 8.11 - The completed marketing analytics page\n\n现在，我们希望连接我们的数据源，以便按 **Lead\
  \ Source** 过滤时可在两个页面上应用。未连接数据源时，过滤器仅在每个单独页面上生效，因为每个页面都是使用来自一个数据集的查询创建的（**Opportunities**\
  \ 或 **Leads**）。请按照以下步骤连接数据源：\n\n- 1. 使用仪表板编辑器右上角的下拉列表，点击 **Connect Data Sources**。将出现一个对话框。\n\
  - 2. 点击 **New Connection**。\n- 3. 为连接命名 **Leads and Opportunities by Source**。\n\
  - 4. 点击 **Choose Data Source 1**。\n- 5. 在 **Select Data Source** 下，选择 **Opportunities**。\n\
  - 6. 在 **Select a field** 下，选择 **Lead Source**。\n- 7. 点击 **Choose Data Source 2**。\n\
  - 8. 在 **Select Data Source** 下，选择 **Leads**。\n- 9. 在 **Select a field** 下，选择 **Lead\
  \ Source**。\n- 10. 点击 **Save**。\n\n保存连接之前的对话框应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_225_0.png)\n\
  \nFigure 8.12 – Completed data connection dialog box\n\n现在，是时候测试连接了。\n\n在 **Marketing**\
  \ 页面上，点击 **Lead Source** 的 **List** 小部件并选择 **Web**。页面现在将按所选值进行过滤。现在，移动到 **Sales**\
  \ 页面，你会看到销售数据也已按 leads 和 deals 的 web 来源进行了过滤。\n\n现在你已成功从头开始创建了第一个 TCRM 仪表板，包括页面的多功能性，是时候学习如何使用和共享仪表板了。\n\
  \n### A user's guide to a TCRM dashboard\n\n你现在将在 **Preview** 模式下打开你的新仪表板，并作为业务用户来使用它，学习如何在\
  \ TCRM 中切片和切块你的数据。在探索数据之前，请移除 hero 图表 **Pipeline by Close Date** 上的静态目标，因为这会妨碍我们的探索。我们将在\
  \ *Chapter 9, Advanced Dashboard Design and Build* 中查看动态参考线。此外，确保所有图表小部件的 **Selection\
  \ Type** 都设置为 **Multiple Selection**。\n\n以下步骤将帮助你探索和共享你的仪表板：\n\n- 1. 打开 **My First\
  \ Dashboard** 仪表板并进入 **Present** 模式。\n- 2. 通过在 **List** 小部件中选择 **MM** 和 **GB** 来按\
  \ **Segment** 过滤。\n- 3. 通过在 **Sum of Amount** 下选择 **50,000 – 500,000** 来按交易规模下钻。\n\
  - 4. 我们只对新交易感兴趣，因此在 **Type** 全局过滤器下排除 **Existing Business**（使用 **Does Not Equal**）。\n\
  - 5. 通过进入 **Pipeline by Stage** 图表并选择这两个条：**Negotiation/Review** 和 **Perception\
  \ Analysis** 来对仪表板进行分面。\n- 6. 保存此仪表板视图。在仪表板标题旁边，点击 **Modified** 旁边的向下箭头，并选择 **Save\
  \ View**。将其命名为 **Sales drill down** 并点击 **Create**。\n- 7. 点击 **Save** 保存仪表板。\n\n\
  你的仪表板现在应如下所示的屏幕截图；请注意，由于你选择的阶段，highlights 面板中 **# of Deals Won** 的结果显示 **No Results\
  \ Found**：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_227_0.png)\n\nFigure 8.13\
  \ – Your dashboard in Sales drill-down view after drilling into the data\n\n你现在将通过以下步骤共享此仪表板视图：\n\
  \n- 1. 点击屏幕右上角的 Share 按钮。\n- 2. 有几种共享此仪表板视图的方式，但现在，你希望与有权访问此应用的同事共享链接，并附上参考截图。首先，你将点击\
  \ GET URL，然后复制统一资源定位符（URL）并将其添加到电子邮件中。\n- 3. 接下来，点击 DOWNLOAD 并将仪表板视图下载为图像。将图像添加到你的电子邮件中。\n\
  - 4. 你的同事现在可以快速以图像形式查看仪表板，然后点击 URL 在 TCRM 仪表板中实时查看数据。请注意，他们的视图将保留你在切片和切块数据时应用的过滤和分面。\n\
  \n\n\n\n\n以下是你想要分享“我的第一个仪表盘”的 URL 时看到的内容：\n\n我的第一个仪表盘\n\n授予访问权限 发布到信息流 导出到任意位置 获取链接\
  \ 下载\n\n只有有权访问此仪表盘的人才能查看此链接。\n\nhttps://v3602-dev-ed.my.salesforce.com/analytics/wave/dashboard?assetId=0FK5g000000Ns8jGAC&orgId=00D\n\
  \n在以下位置打开链接\n\nAnalytics 标签页\n在 Lightning Experience 中使用 Analytics 进行探索、个性化设置、协作和操作。\n\
  \nAnalytics Studio\n整合并可视化数据，构建和生成 Analytics 应用。\n\n图 8.14 – 分享“我的第一个仪表盘”的 URL\n\
  \n这是你想要将“我的第一个仪表盘”下载为图片时看到的内容：\n\n我的第一个仪表盘\n\n授予访问权限 发布到信息流 导出到任意位置 获取链接 下载\n\n\
  选择下载此资源的方式：\n\n下载为图片\n\n图 8.15 – 将“我的第一个仪表盘”下载为图片\n\n接下来，让我们按照以下步骤，从仪表盘创建一个透镜，深入查看数据，并与同事分享：\n\
  \n- 1. 转到 **Top Ten Account Owners**（十大客户所有者）图表组件，点击组件右上角的下拉箭头。\n- 2. 点击 **Explore**（探索）。\n\
  - 3. 点击 **FILTERS**（筛选器）标签页。请注意，探索透镜保留了在仪表盘级别应用于 **Opportunity Type**（商机类型）、**Amount**（金额）、**Segment**（细分）和\
  \ **Stage**（阶段）的四个筛选器。\n- 4. 点击数值最高的条形，即 **Kelly Frazier**。\n- 5. 点击带有放大镜图标的钻取按钮。\n\
  - 6. 在 **Drill Into This By**（按此钻取）下，搜索 **Opportunity Name**（商机名称）并选择它。\n- 7. 现在你应该能看到\
  \ Kelly Frazier 的两个进行中的交易。这就是你想要的信息，因此现在点击 **Save**（保存）。\n- 8. 将此透镜保存为 **Kelly's\
  \ deals for discussion**（Kelly 待讨论的交易），保存在 **My Private App**（我的私有应用）下。\n- 9. 现在，通过复制\
  \ **GET URL**（获取链接）下的 URL，并通过 Slack 或 Teams 分享，将此透镜与 Kelly 共享。\n\n透镜应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_229_0.png)\n\
  \n现在你已经知道如何对 TCRM 仪表盘进行切分和钻取，并与同事分享结果，让我们回顾一下本章所学的内容。\n\n### 总结\n\n正如你在本章中所看到的，TCRM\
  \ 是一个多功能且用户友好的平台，用于构建仪表盘、分析数据和分享发现。\n\n你到底学到了什么？首先，你现在能够识别并使用 TCRM 仪表盘编辑器中可用的工具。此外，你可以创建组件并将其添加到仪表盘。第三，你可以编辑和格式化组件以满足你的需求。另外，你对于添加和管理\
  \ TCRM 页面充满信心。最后，你应该能够熟练使用仪表盘并与他人分享发现。\n\n下一章将教你如何在 TCRM 仪表盘中构建高级功能。\n\n### 问答题\n\
  \n以下是一份测试你知识的问题列表：\n\n- 如果你希望同事访问仪表盘的特定视图并深入查看数据，你会如何与他们分享？\n- “将组件复制到剪贴板”命令的目的是什么？\n\
  - 仪表盘推荐的默认列数是多少？\n- 当你从一个仪表盘切换到另一个仪表盘时，应用于第一个页面的筛选器是否仍然保留？\n- 你如何在仪表盘中使用容器组件？\n\
  - 什么是自上而下的仪表盘设计？TCRM 页面如何促进这种设计？\n- “Clone Query”（克隆查询）命令会克隆查询并打开它进行________________。\n"
- "## 9 高级仪表盘设计与构建\n\n既然你已经构建了第一个仪表盘，现在是时候超越基础知识了。在本章中，你将学习高级仪表盘设计和构建。完成本章后，你将知道如何使用\
  \ Tableau CRM（TCRM）页面增强设计，使用 Salesforce Analytics 查询语言（SAQL）创建更复杂的查询，以及通过代码或点击构建交互和绑定。\n\
  \n你将在本章学到什么？我们将探讨以下主题：\n\n- 页面动画的创造性使用\n- 从代码开始——SAQL 简介\n- 使用绑定将各部分串联起来\n- 使用高级编辑器\n\
  \n### 技术要求\n\n要成功执行本章中的说明，你需要以下内容：\n\n- 最新版本的 Google Chrome 浏览器（Chrome 是使用 TCRM\
  \ 时的首选浏览器）\n- 一个可用的电子邮件地址\n\n请确保你已登录到你的 TCRM 开发组织。\n\n让我们从 TCRM 中页面动画的使用时机和方法开始。\n\
  \n### 页面动画的创造性使用\n\nTCRM 页面功能使你能够创建富有创意的仪表盘，利用动画来增强仪表盘的功能和可用性。\n\n从你的 Analytics\
  \ Studio 主页，打开你在*第 8 章“构建你的第一个 TCRM 仪表盘”*中创建的 **My First Dashboard**（我的第一个仪表盘）。按照以下步骤创建一个你将使用多个页面工作的仪表盘：\n\
  \n- 1. 克隆它以创建一个新仪表盘，**My Advanced Dashboard**（我的高级仪表盘）。\n- 2. 在 **Edit**（编辑）模式下打开这个新仪表盘。\n\
  - 3. 克隆 **Sales**（销售）页面，并将这个新页面重命名为 **Sales Clean**（简洁销售）。\n- 4. 在 **Page Options**（页面选项）下拉菜单下，选择\
  \ **Hide from Navigation**（从导航中隐藏）。请注意，这会将该页面从导航组件中移除。\n- 5. 移除并重新排列组件，使页面与*图 9.1*\
  \ 中看到的内容一致。当系统提示移除全局筛选器组件时，选择 **Delete Widget Only**（仅删除组件）。\n- 6. 点击 **Save**（保存）以保存仪表盘。\n\
  \n这是完成的链接组件格式：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_234_0.png)\n\n现在你的极简页面有了一个返回原始\
  \ Sales 页面的链接，你需要为用户提供一种从 Sales 页面进入极简页面的方式。按照以下步骤操作：\n\n- 1. 复制链接组件。\n- 2. 导航到\
  \ Sales 页面。\n- 3. 粘贴链接组件；它应出现在页面底部。\n- 4. 现在你需要为链接组件腾出空间。首先，从“Pipeline by Close\
  \ Date”（按结束日期的管道）英雄图表中移除标题，并将文本保存到剪贴板。\n- 5. 在页面底部添加一个容器组件，并调整其大小，以便容纳要移入的英雄图表。\n\
  - 6. 添加边框以匹配英雄图表。\n- 7. 移除英雄图表的边框。\n- 8. 将英雄图表拖入容器中，然后调整其大小以容纳标题。\n- 9. 将新的文本组件拖入容器中。\n\
  - 10. 将链接组件移动到容器的最右侧。\n- 11. 将链接组件的文本更改为“No Filters”（无筛选器），并使其链接到布局中的 `Sales Clean`\
  \ 页面。\n- 12. 将容器移动到页面顶部、页面导航器下方。\n- 13. 进入 **Preview**（预览）模式并测试导航。\n- 14. 点击 **Save**（保存）以保存仪表盘。\n\
  \n添加了导航的修订版英雄图表所在的 Sales 页面应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_235_0.png)\n\
  \n图 9.3 – 添加了导航的修订版英雄图表所在的 Sales 页面\n\n让我们创建一个全新的仪表盘，以了解更多关于工作页面和动画的信息。将此仪表盘命名为\
  \ **Clever Pages**（巧妙页面），并按如下方式更改设置：\n\n- 列数：50\n- 行高：细\n- **单元格间距：** 0\n- **最大仪表盘宽度：**\
  \ 1200\n- **背景颜色：** 为装订线选择白色，为网格选择深色。\n- 在 **Widget Default Properties**（组件默认属性）下，将背景颜色设置为透明，并添加透明边框。\n\
  - 点击 **Save**（保存）以保存仪表盘。\n\n要开始使用你的新仪表盘，请从 **My Advanced Dashboard** 复制突出显示面板，并将其粘贴到\
  \ **Clever Pages** 仪表盘中。编辑颜色，直到得到类似这样的效果：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_236_0.png)\n\
  \n图 9.4 – Clever Pages 仪表盘上的突出显示面板\n\n你现在要做的是创建一个简单的仪表盘，并学习如何使用页面进行缩放、展开和收缩。按照以下步骤创建一个主页（提前查看图\
  \ 9.5 以确保你方向正确）。为组件选择深色主题：\n\n- 1. 添加一个堆叠柱状图，标题为 **Open Pipeline by Close Date and\
  \ Stage**（按结束日期和阶段显示进行中的管道）。\n- 2. 将此图表的标题替换为一个链接组件，稍后将用于导航到 **Expansion**（展开）页面。\n\
  - 3. 添加一个环形图，标题为 **Open Deals by Stage %**（按阶段百分比显示进行中的交易）；将中心大小设为 0% 以创建饼图。\n-\
  \ 4. 添加一个热力图，标题为 **Deals Won by Industry and Lead Source**（按行业和潜在客户来源显示赢得的交易）。\n\
  - 5. 添加一个组合图，标题为 **Deals Won by Opportunity Owner**（按商机负责人显示赢得的交易），显示计数和值。\n- 6.\
  \ 点击 **Save**（保存）以保存仪表盘。\n\n\n\n\n\n这就是你的新仪表板应该看起来像的样子：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_237_0.png)\n\
  \n图 9.5 – Clever Pages 的成品主页\n\n下一步是克隆此页面并使用它来创建英雄图表的扩展页面，按以下步骤操作：\n\n1. 将现有页面重命名为\
  \ Home。\n2. 克隆此页面并将新页面重命名为 Expansion。\n3. 取消链接显示为标题 Open Pipeline by Close Date\
  \ and Stage 的链接小部件。\n4. 编辑 Home 页面上的此链接，使其指向 Expansion 页面。\n5. 进入 Expansion 页面并编辑布局，使\
  \ Open Pipeline by Close Date and Stage 英雄图表非常突出。你可以移除饼图。\n6. 调整用作标题的链接小部件大小，为右侧的第二个链接小部件腾出空间。\n\
  7. 将标题链接小部件指向 **Home** 页面。\n8. 在右侧、英雄图表上方添加第二个链接小部件，指向 **Home** 页面。链接文本应为 Home。\n\
  9. 点击 **Save** 保存你的仪表板。\n\n成品结果应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_238_0.png)\n\
  \n图 9.6 – Clever Pages 仪表板上的 Expansion 页面\n\n测试导航——从 **Home** 页面，点击英雄图表的标题将展开该图表并允许详细分析；点击\
  \ **Home** 链接会带你返回，点击英雄图表标题也会返回。很棒！这种功能在仪表板设计中非常有用。例如，它可用于在图表上进行缩放以进一步分析，揭示英雄图表的更多细节，或促进数据分段。\n\
  \n让我们添加另一种类型的页面动画，其中钻取只需一次点击即可启用。打开 **Clever Pages** 仪表板并按以下步骤操作：\n\n1. 克隆 **Home**\
  \ 页面并将此新页面重命名为 **Industry and Lead Source**。\n2. 移除文本为 **Open Pipeline by Close\
  \ Date and Stage** 的链接小部件。\n3. 移除除 **Deals Won by Industry and Lead Source** 之外的所有图表。\n\
  4. 将热力图图表移动到页面左上角。\n5. 克隆热力图并将副本编辑为 **Pipeline by Industry and Lead Source**；更改筛选器以满足需求。\n\
  6. 添加一个标题为 **Breakdown of Deals Won and Lost by Industry** 的堆叠条形图。\n7. 添加一个标题为 **Open\
  \ Pipeline by Lead Source** 的条形图。\n8. 移除全局筛选器（仅小部件）。\n9. 在高亮面板中添加 **Lead Source\
  \ and Industry** 的列表小部件。\n10. 移除高亮面板中的切换小部件。\n11. 在高亮面板中添加一个链接，文本为 **Go Back**，指向\
  \ **Home** 页面。\n12. 进入 **Home** 页面并取消链接 **Deals Won by Industry and Lead Source**\
  \ 图表。\n13. 用一个链接替换此图表的标题，文本相同并指向 **Industry and Lead Source** 页面。\n14. 取消链接高亮面板中的页面标题并将文本更改为\
  \ **Sales Breakdown**。\n15. 测试导航。点击 **Deals Won by Industry and Lead Source** 的标题现在会带你到一个按行业和线索来源切片和切分销售数据的页面。很酷！\n\
  16. 点击 **Save** 保存你的仪表板。\n\n结果将如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_240_0.png)\n\
  \n图 9.7 – 按行业和线索来源划分的销售明细\n\n使用页面动画增强用户体验（UX）的另一种方式是使用页面来显示或隐藏详细信息面板。打开你的 Clever\
  \ Pages 仪表板并按以下步骤操作：\n\n1. 进入 Expansion 页面并克隆它。\n2. 将页面重命名为 Expansion Detail。\n\
  3. 移除热力图图表。\n4. 将组合图表移动到左侧并使其适合英雄图表的宽度。\n5. 添加一个从上到下运行的容器小部件；参见图 9.8。\n6. 将容器小部件背景颜色更改为与高亮面板匹配。\n\
  7. 取消链接说 Home 的链接小部件并将其颜色更改为白色。将此项移动到容器的右上角。\n8. 在 **Home** 链接小部件左侧添加另一个链接小部件。**Text**\
  \ 应为 **Back**；**Link To** 为 **Page in layout** 且 **Page** 为 **Expansion**。\n9. 进入\
  \ **Expansion** 页面并取消链接 **Open Pipeline by Close Date and Stage** 链接小部件。\n10. 编辑此小部件，使其现在链接到\
  \ **Expansion Detail** 页面。\n11. 返回 **Expansion Detail** 页面并添加一个标题为 **Trend of Deals\
  \ Won** 的时间线图表。\n12. 添加一个标题为 **Pipeline by Stage** 的条形图。\n13. 添加一个标题为 **Pipeline\
  \ by Product Family** 的甜甜圈图。\n14. 点击 **Save** 保存你的仪表板。\n\n**Expansion Detail** 页面应如下所示：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_241_0.png)\n\n图 9.8 – Expansion Detail\
  \ 页面\n\n如果你通过点击英雄图表标题测试页面导航，你会看到页面启用了钻取，如下所示：\n\n- Home page\n- Focus on Open Pipeline\
  \ by Close Date and Stage\n- Details for Open Pipeline by Close Date and Stage\n\
  - Back to Focus on Open Pipeline by Close Date and Stage\n- Back to Home page\n\n\
  作为我们使用 TCRM 页面进行智能设计的最后一个示例，让我们看看如何在图像上嵌入导航链接。按以下步骤操作：\n\n1. 编辑 Clever Pages 仪表板。\n\
  2. 进入 Expansion Detail 页面。\n3. 减小文本小部件的宽度，该小部件显示 Open Pipeline by Close Date and\
  \ Stage，同时保持其居中在图表小部件上方。\n4. 在页面上添加一个容器小部件，缩小其大小并将其移动到你刚刚调整大小的文本小部件左侧。\n5. 从互联网下载一张透明图像。\n\
  6. 将此图像作为背景图像添加到新容器中。\n7. 点击 Save 保存你的仪表板。\n\n到目前为止，你的进度应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_242_0.png)\n\
  \n图 9.9 – 使用背景图像格式化容器\n\n现在是时候为你的容器添加链接了！按以下步骤操作：\n\n1. 为你的页面添加一个链接并缩小它，使其可放入新容器内。\n\
  2. 将链接移动到带有 **Home** 图标的容器上。\n3. 从链接中移除所有文本。\n4. 确保链接小部件具有透明背景。\n5. 设置链接以导航到 **Home**\
  \ 页面。\n6. 点击 **Save** 保存你的仪表板。\n\n测试你的仪表板——主页图标现在将带你返回 **Home** 页面。\n\n让我们现在看一下\
  \ SAQL 的介绍——你在 TCRM 中进行代码的首次尝试！\n\n### 开始使用代码 – SAQL 简介\n\n本节将介绍你在 TCRM 中使用 SAQL\
  \ 进行编码。\n\n### 定义\n\n我们现在将查看有关 SAQL 是什么以及何时可以使用它的详细定义。\n\n### 什么是 SAQL？\n\n**SAQL**\
  \ 是一种运行时查询语言，可实现对数据集的即席分析。SAQL 脚本由一系列语句组成，这些语句由关键字（如 filter、group 和 order）、**标识符（IDs）**、文字或特殊字符组成。它基于\
  \ **JavaScript Object Notation (JSON)** 并与 **Apache Pig Latin (PIGQL)** 相似。SAQL\
  \ 查询加载输入数据集，对其进行操作并输出结果。\n\n这里有一个 SAQL 示例：\n\n```\nq = load \"My_Dataset\";\nq =\
  \ group q by 'Division_Name';\nq = foreach q generate 'Division_Name' as 'Division_Name',\
  \ sum('Amount')/sum('Quantity') as 'sum_Amt/Qty'; q = order q by 'sum_Amt/Qty' desc;\n\
  ```\n\n你在前面的片段中看到的是基本 SAQL 元素，如下所示：\n\n- Load 语句用于加载数据\n- 流 ID——在此例中为 \"q\"\n- 使用各种\
  \ SAQL 函数和关键字的语句\n\n### 何时使用 SAQL？\n\n当你需要进行自定义计算、即时高级数据操作、来自不同数据集的数据协同分组（连接）、顶部/底部列表，结合绑定以在图表上使用动态值等时，可以使用\
  \ SAQL。\n\n### SAQL 使用哪种语法？\n\n以下是一些基本的 SAQL 语法：\n\n- 关键字和函数以小写书写且区分大小写。\n- 从数据集中调用的\
  \ **Application programming interface (API)** 名称应用单引号括起来，如下所示：'Division_Name'。\n\
  - API 名称区分大小写。\n- 字符串必须用双引号括起来，例如 \"Open\"。\n\n### 在哪里编辑 SAQL？\n\n每个透镜的每一步都是基于 SAQL\
  \ 的，因此可以编辑和/或添加自定义 SAQL。这些可以在 JSON 编辑器模式下查看或复制到你选择的 JSON 编辑器中。\n\n按以下步骤查看如何查看和编辑\
  \ SAQL：\n\n1. 从 **Opportunities** 数据集创建一个新透镜。\n2. 随意向透镜添加筛选器。\n3. 随意向透镜添加分组。\n4.\
  \ 选择两个度量。\n5. 通过点击透镜中图表右上角的 **Query Mode** 按钮更改为查询模式。\n\n\n\n\n\nThis is what my\
  \ example lens looks like in chart mode:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_245_0.png)\n\
  \nFigure 9.10 – A sample opportunity lens in chart mode\n\nMy example SAQL looks\
  \ like this in query mode:\n\nLearn how to write and edit SAQL queries ▶\n\n```\n\
  q = load \"opportunity1\";\nq = filter q by (!('StageName' in [\"Closed Lost\",\
  \ \"Closed Won\"]) || 'StageName' is null);\nq = filter q by 'Account.Industry'\
  \ in [\"Banking\", \"Biotechnology\", \"Communications\", \"Education\", \"Electronics\"\
  ];\nq = group q by 'Account.Name';\nq = foreach q generate 'Account.Name' as 'Account.Name',\
  \ count() as 'count', sum('Amount') as 'sum_Amount';\nq = order q by 'Account.Name'\
  \ asc;\nq = limit q 2000;\n```\n\n| Account Name ↑ | Count of Rows | Sum of Amount\
  \ |\n|---|---|---|\n| Becker755 Inc | 1 | $3,526,355 |\n| Brewer763 Inc | 1 | $1,422,600\
  \ |\n| Bryant456 Inc | 1 | $1,269,390 |\n| Burton810 Inc | 1 | $136,800 |\n| Carlson744\
  \ Inc | 1 | $788,800 |\n\nFigure 9.11 – A sample opportunity lens with SAQL revealed\
  \ in query mode\n\nThis is what the code looks like:\n\n```\nq = load \"opportunity1\"\
  ;\nq = filter q by (!('StageName' in [\"Closed Lost\", \"Closed Won\"]) || 'StageName'\
  \ is null);\nq = filter q by 'Account.Industry' in [\"Banking\", \"Biotechnology\"\
  , \"Communications\", \"Education\", \"Electronics\"];\nq = group q by 'Account.Name';\n\
  q = foreach q generate 'Account.Name' as 'Account.Name', count() as 'count', sum('Amount')\
  \ as 'sum_Amount';\nq = order q by 'Account.Name' asc;\nq = limit q 2000;\n```\n\
  \nThe best way to learn how SAQL works is to get your hands dirty, so let's dive\
  \ into some example use cases.\n\n### Example use cases\n\nHere are some example\
  \ use cases where SAQL is helpful.\n\n### Union use case\n\nFollow these steps to\
  \ create and edit a Union SAQL query:\n\n- 1. Create a lens from the **Opportunities**\
  \ dataset with no grouping, using **Sum of Amount** as the measure.\n- 2. Switch\
  \ to **Compare Table** mode.\n- 3. Filter **Sum of Amount** as follows:\n  - **Opportunity\
  \ Type = New Business**\n  - **Account Type = Customer**\n  - **Industry ≠ Agriculture,\
  \ Apparel**\n- 4. Clone the column and filter by selecting **Existing Business**\
  \ under **Opportunity Type**.\n- 5. Edit the column names as follows:\n  - New Business\n\
  \  - Existing Business\n- 6. **Save** the lens as **Union Use Case**.\n\nYour progress\
  \ so far will look like this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_247_0.png)\n\
  \nFigure 9.12 – Table view of the Union Use Case lens\n\n- 7. Change the lens to\
  \ a Funnel chart and notice that it cannot be used correctly; it shows one value\
  \ at a time only. Switch to **Query Mode** to view and edit the SAQL content.\n\n\
  This is your starting point with the SAQL content:\n\n```\nq = load \"opportunity1\"\
  ;\nq_A = filter q by 'Type' == \"New Business\" && 'Account.Type' == \"Customer\"\
  \ && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry'\
  \ is null);\nq_B = filter q by 'Type' == \"Existing Business\" && 'Account.Type'\
  \ == \"Customer\" && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"]) ||\
  \ 'Account.Industry' is null);\nresult = group q_A by all full, q_B by all;\nresult\
  \ = foreach result generate sum(q_A.'Amount') as 'A', sum(q_B.'Amount') as 'B';\n\
  result = limit result 2000;\n```\n\nNotice that you have three data streams in your\
  \ query: q_A, q_B, and result.\n\n- 8. Update your code to remove the query limit\
  \ and union your two columns, as follows:\n\n```\nq = load \"opportunity1\";\nq_A\
  \ = filter q by 'Type' == \"New Business\" && 'Account.Type' == \"Customer\" &&\
  \ (!('Account.Industry' in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry'\
  \ is null);\nq_B = filter q by 'Type' == \"Existing Business\" && 'Account.Type'\
  \ == \"Customer\" && (!('Account.Industry' in [\"Agriculture\", \"Apparel\"]) ||\
  \ 'Account.Industry' is null);\nresult = group q_A by all full, q_B by all;\nresult\
  \ = foreach result generate sum(q_A.'Amount') as 'A', sum(q_B.'Amount') as 'B';\n\
  final1 = foreach result generate \"New Business\" as 'Description', sum('A') as\
  \ 'Sum';\nfinal2 = foreach result generate \"Existing Business\" as 'Description',\
  \ sum('B') as 'Sum';\nfinal = union final1,final2;\n```\n\nThe union function combines\
  \ multiple result sets into one result set. You need the same structure and field\
  \ names in result sets. You do have a choice to either use a different dataset or\
  \ the same dataset when it comes to creating result datasets.\n\nWhen you click\
  \ Run Query, you will see a table, as follows:\n\nLearn how to write and edit SAQL\
  \ queries\n\n```\nQuery\n1 q = load \"opportunity1\";\n2 q_A = filter q by 'Type'\
  \ == \"New Business\" && 'Account.Type' == \"Customer\" && (!('Account.Industry'\
  \ in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry' is null);\n3 q_B = filter\
  \ q by 'Type' == \"Existing Business\" && 'Account.Type' == \"Customer\" && (!('Account.Industry'\
  \ in [\"Agriculture\", \"Apparel\"]) || 'Account.Industry' is null);\n4 result =\
  \ group q_A by all full, q_B by all;\n5 result = foreach result generate sum(q_A.'Amount')\
  \ as 'A', sum(q_B.'Amount') as 'B';\n6 result = limit result 2000;\n7\n8 final1\
  \ = foreach result generate \"New Business\" as 'Description', sum('A') as 'Sum';\n\
  9 final2 = foreach result generate \"Existing Business\" as 'Description', sum('B')\
  \ as 'Sum';\n10 final = union final1,final2;\n```\n\n| # | Description | Sum |\n\
  |---|---|---|\n| 1 | New Business | 257,039,003 |\n| 2 | Existing Business | 109,018,414\
  \ |\n\nFigure 9.13 – Table results from the Union function\n\nYou can now use a\
  \ funnel or other chart type to visualize the sum broken up into two components:\
  \ new and existing business.\n\nAnother use case for the Union function is to analyze\
  \ the same metric showing a rolling 3 months, as follows:\n\n```\nq3 = load \"opportunity\"\
  ;\n```\n\n```\nq3 = filter q3 by date('CloseDate_Year', 'CloseDate_Month', 'CloseDate_Day')\
  \ in [\"3 months ago\"..\"3 months ago\"]; q3 = group q3 by ('CloseDate_Year', 'CloseDate_Month');\n\
  ```\n\n```\nq3 = foreach q3 generate 'CloseDate_Year' as 'CloseDate_Year', 'CloseDate_Month'\
  \ as 'CloseDate_Month', sum('Amount') as 'sum_Amount';\n```\n\n```\nq2 = load \"\
  opportunity\";\n```\n\n```\nq2 = filter q2 by date('CloseDate_Year', 'CloseDate_Month',\
  \ 'CloseDate_Day') in [\"2 months ago\"..\"2 months ago\"]; q2 = group q2 by ('CloseDate_Year',\
  \ 'CloseDate_Month');\n```\n\n```\nq2 = foreach q2 generate 'CloseDate_Year' as\
  \ 'CloseDate_Year', 'CloseDate_Month' as 'CloseDate_Month', sum('Amount') as 'sum_Amount';\n\
  q1 = load \"opportunity\";\nq1 = filter q1 by date('CloseDate_Year', 'CloseDate_Month',\
  \ 'CloseDate_Day') in [\"1 months ago\"..\"1 months ago\"]; q1 = group q1 by ('CloseDate_Year',\
  \ 'CloseDate_Month');\nq1 = foreach q1 generate 'CloseDate_Year' as 'CloseDate_Year',\
  \ 'CloseDate_Month' as 'CloseDate_Month', sum('Amount') as 'sum_Amount';\nfinal\
  \ = union q3, q2, q1;\n```\n\n### Creating buckets using the case statement\n\n\
  Follow these steps to try this use case for yourself:\n\n- 1. Create a new lens\
  \ from the **Opportunities** dataset.\n- 2. Group by **Opportunity Name** and measure\
  \ **Sum of Amount**.\n- 3. Filter by **Won deals**.\n- 4. Change to **Query Mode**.\n\
  - 5. Remove the `limit` statement.\n- 6. Click **Save** to save your lens.\n\nNow\
  \ that you have your basic SAQL prepared, add the following case statement:\n\n\
  ```\nresult = foreach q generate 'Name' as 'Name', 'sum_Amount' as 'Amount', (case\
  \ when 'sum_Amount' > 2000000 then \"Big\" when 'sum_Amount' > 500000 then \"Medium\"\
  \ else \"Small\" end) as 'Size';\n```\n\nThe finished SAQL code should look like\
  \ this:\n\n```\nq = load \"opportunity1\";\nq = filter q by 'IsWon' == \"true\"\
  ;\nq = group q by 'Name';\nq = foreach q generate 'Name' as 'Name', sum('Amount')\
  \ as 'sum_Amount';\nq = order q by 'Name' asc;\n```\n\n```\nresult = foreach q generate\
  \ 'Name' as 'Name', 'sum_Amount' as 'Amount', (case when 'sum_Amount' > 2000000\
  \ then \"Big\" when 'sum_Amount' > 500000 then \"Medium\" else \"Small\" end) as\
  \ 'Size';\n```\n\nWhen you click **Run Query**, you should see this:\n\n![](img/06379e43783b9ddfee45e9da5192efe1_251_0.png)\n\
  \n| Opportunity Name | Amount | Size |\n|---|---:|---|\n| Opportunity for Abbott1184\
  \ | $2,016,250 | Big |\n| Opportunity for Abbott414 | $206,587 | Small |\n| Opportunity\
  \ for Abbott636 | $121,490 | Small |\n| Opportunity for Adkins111 | $1,402,500 |\
  \ Medium |\n| Opportunity for Aguilar1908 | $3,314,900 | Big |\n| Opportunity for\
  \ Aguilar210 | $202,174 | Small |\n| Opportunity for Alexander278 | $18,960 | Small\
  \ |\n\nFigure 9.14 – Bucketed results created using the Case function\n\n> **Tip**\n\
  >\n> If you're looking to dive deep into SAQL, I can recommend these resources:\n\
  >\n> https://developer.salesforce.com/docs/atlas.en-us.bi_dev_guide_saql.meta/bi_dev_guide_saql/bi_saql_reference.htm\n\
  >\n> https://www.salesforceblogger.com/all-about-saql/\n\n\n\n\n\n我们现在将学习如何使用 JSON\
  \ 和 **用户界面 (UI)** 创建仪表板绑定。\n\n### 使用绑定将事物联系起来\n\nTCRM 中的绑定是什么？绑定用于在步骤和部件之间传递值——即为动态值和选择参数化值。示例用例包括以下内容：\n\
  \n- 动态参考线\n- 动态分组\n- 动态度量\n- 动态排序\n- 动态图表类型\n\n需要考虑两种类型的绑定。首先，选择绑定用于根据另一查询中的选择更新查询，例如通过切换部件选择日期范围。其次，结果绑定用于根据另一查询的结果更新查询，例如使用来自\
  \ case 语句的计算值来对数据进行分桶。\n\nTCRM 正在慢慢远离要求使用代码创建绑定的做法，但许多用例仍需要在 JSON 中进行开发工作，如下一节所述。\n\
  \n### JSON 中的绑定\n\n我们现在要谈谈 JSON。你可能熟悉 JSON，但在 TCRM 的上下文中可能不熟悉。下面的图表显示了 JSON 和 TCRM\
  \ 仪表板是如何配合的：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_253_0.png)\n\n图 9.15 –\
  \ JSON 和 TCRM 仪表板\n\n在仪表板编辑器中，按 Cmd + E（或 Ctrl + E）显示仪表板背后的 JSON。JSON 只是指令的书写语言。JSON\
  \ 包含所有部件/图表描述以及针对数据集运行的查询。每个图表实际上是几行 JSON，描述类型和属性以及要运行的查询。一种特殊情况是当其中一个查询直接使用 SAQL\
  \ 自定义编写时。\n\n什么是 JSON？简单来说，它是文件中用一堆用大括号 { } 括起来的键和值组成的描述性指令。值可以是文本、数值、布尔值或文本/数值的数组；你可以有多个这样的信息块。以下是\
  \ JSON 的简单分解：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_254_0.png)\n\n图 9.16 –\
