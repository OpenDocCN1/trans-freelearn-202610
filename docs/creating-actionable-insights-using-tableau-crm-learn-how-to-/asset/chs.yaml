- "## 3 连接您的数据源\n\n现在您已经熟悉 Tableau CRM（TCRM）用户界面，并且已经构建了您的第一个 TCRM 分析应用，您已准备好深入探索这一功能强大的商业智能平台。在本章中，您将学习如何从各种数据源将数据摄取到\
  \ TCRM。TCRM 从 Salesforce、平面文件、数据仓库和其他来源引入数据的多样化功能和限制将被检查和解释，以及使这一过程成为可能的框架和工具。您将学习如何将\
  \ **Salesforce** 数据对象与 TCRM 连接并创建数据集。您还将学习如何将平面文件带入 TCRM。\n\n那么，到本章结束时您将能够做什么呢？首先，您将清楚地了解如何将数据带入\
  \ TCRM。其次，您将认识到 TCRM 在数据连接方面的限制。第三，您将了解如何将 Salesforce 数据带入 TCRM。最后，您将能够将平面文件数据导入\
  \ TCRM 并用其增强您的 Salesforce 数据。\n\n在本章中，我们将涵盖以下主题：\n\n- TCRM 的数据连接功能\n- TCRM 的数据连接限制\n\
  - 将 Salesforce 数据带入 TCRM\n- 使用平面文件（CSV）增强您的 Salesforce 数据\n- 常见问题和挑战\n\n### 技术要求\n\
  \n成功执行本章中的说明需要以下条件：\n\n- 具有互联网访问权限的笔记本电脑或台式机（平板电脑或手机是不够的）。\n- Google Chrome 浏览器的最新版本（在使用\
  \ TCRM 时，Chrome 是首选浏览器）。\n- 一个有效的电子邮件地址。\n- 确保您已登录到您的 TCRM 开发组织，如 *第 2 章，在 TCRM\
  \ 中开发您的第一个 OOTB 分析应用* 中所示。\n\n### TCRM 的数据连接功能\n\nTCRM 为您可以 **提取**、**加载**、**转换**\
  \ 和 **分析** 的数据提供了许多选择。本节将介绍 Tableau CRM 为数据摄取和转换提供的基础框架和工具。 resulting 数据集将驱动为用户提供所需业务洞察的透镜和仪表板。\n\
  \n在 Tableau CRM 中，数据连接和集成涉及摄取和准备您想要可视化和调查的 Salesforce 数据和外部数据。外部数据是指存在于连接到您的 TCRM\
  \ 环境的 Salesforce 组织之外的数据。这包括来自另一个 Salesforce 组织、外部应用程序、平面文件和其他数据库的数据。在摄取、连接和转换数据后，分析用户可以使用\
  \ TCRM 透镜和仪表板对其进行分析和探索。\n\n数据准备是将您的数据转换为对使用者有用且有帮助的形式的过程。为了让您了解 TCRM 如何执行这些操作，首先，您必须了解数据集是什么、它们是如何设计的以及它们是如何构建的。这将在下一节中进行解释。\n\
  \n\n\n\n\n### 数据集的定义、设计和构建\n\n首先，什么是数据集？下图给出了一个简明的定义：\n\n### 什么是数据集？\n\n一种数据存储库（存储），类似于文件系统存储，但采用专有格式，并通过算法使用倒排索引来展平数据（以提高容量和速度）。\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_71_0.png)\n\n图 3.1 – 什么是数据集？\n\n数据集是分析透镜和仪表板的构建基块，也是洞察的源泉。俗话说，垃圾进，垃圾出；在数据分析领域，这句话再贴切不过。因此，在设计和构建\
  \ TCRM 仪表板时，你需要投入大量思考和精力来打造驱动指标和可视化效果的数据集。\n\n那么，TCRM 如何以及从哪里提取、存储、转换数据，并将其加载到数据集中？下图概述了\
  \ TCRM 的数据版图，以及在平台中摄取数据的各种方式：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_72_0.png)\n\
  \n图 3.2 – Tableau CRM 数据版图\n\n那么，你能从*图 3.2*中了解到什么？请看以下几点：\n\n- 多种数据源会被复制/同步（请参阅*数据同步*部分），并通过数据流和配方导入\
  \ TCRM。这些数据包括来自主要连接的 Salesforce 组织、其他 Salesforce 组织、Marketing Cloud 以及其他 TCRM 连接器的数据。\n\
  - Salesforce 趋势报告数据可以直接导入 TCRM。\n- **平面文件**可以通过手动将 CSV 文件加载到 TCRM，并在数据流或配方中与其他数据合并和转换，从而补充到数据集中。\n\
  - **外部数据、ETL 工具和 API**（例如数据湖、SQL 和 Oracle）会按照各自的手动计划，为 TCRM 中的数据集补充数据。\n- TCRM 数据流可以接收各种数据源，并将这些数据与其他来源及\
  \ TCRM 数据集中的数据合并和转换。相关内容将在*第 4 章，构建数据配方*和*第 5 章，使用 TCRM Data Prep 进行高级 ETL*中详细介绍。\n\
  - 默认情况下，Tableau CRM 执行增量同步。你可以指定同步是提取每个 Salesforce 对象的增量变更，还是提取所有记录。如前所述，增量同步运行速度更快。\n\
  - 如果你的 TCRM 管理员在 Winter '20 版本发布之前启用了 TCRM，则必须启用数据同步和连接选项，以优化数据流并连接到外部数据。请注意，如果你在\
  \ Winter '20 版本发布之后启用 TCRM，则默认会启用数据同步。\n- 你可以通过 Tableau CRM 的 Snowflake 输出连接器，将原始的本地\
  \ Salesforce 数据导出到 Snowflake。\n\n在下一节中，你将学习如何在 TCRM 中提取和使用外部数据。\n\n### 将外部数据与 Salesforce\
  \ 数据摄取并合并\n\n部署和构建 Tableau CRM 仪表板的一个主要原因，是将 Salesforce 数据与外部数据合并到统一可信的数据源中。那么，具体该怎么做？下面通过一个示例来说明。\n\
  \n登录你的 TCRM 开发组织，导航至 **Analytics Studio**，然后执行以下步骤：\n\n1. 点击 **Create** 按钮并选择 **Dataset**。\n\
  2. 选择 **External Data** 选项，随后将进入 **Data Manager**。\n3. 点击左侧的 **Connect** 链接。\n4.\
  \ 点击 **Connect to Data** 按钮。\n5. 在 **Input Connections** 选项卡下，点击 **Add Connection**\
  \ 按钮，随后会出现以下窗口：\n\n**为新的远程连接选择连接类型**\n\n![](img/06379e43783b9ddfee45e9da5192efe1_75_0.png)\n\
  \n图 3.3 – 远程连接示例\n\n6. 浏览可用选项，你会看到这里提供了多种数据源。选择 Redshift Connector 选项，随后会出现一个对话框，需要填写连接器相关信息，例如：\n\
  \n- (a) **连接名称**\n- (b) **开发者名称**\n- (c) **描述**\n- (d) **AWS Secret Access Key**\n\
  - (e) **用户名**\n- (f) **AWS Access Key ID**\n\n需要填写的详细信息因连接器而异。填写完必要信息后，需要保存并测试连接器。正确配置并成功测试后，即可在\
  \ TCRM 中使用这些数据进行合并和转换。可以在 **Data Manager** 的 **Connect** 部分对连接器进行计划安排、编辑或删除。\n\n\
  ### TCRM 可用的远程数据连接\n\n截至 2021 年 4 月，TCRM 提供以下远程数据连接器：\n\n| Salesforce | 应用程序 | 数据库\
  \ | Analytics Mulesoft | 对象存储和 No SQL | 实时连接 |\n|---|---|---|---|---|---|\n| 外部\
  \ Salesforce 组织 | Google Analytics | Amazon RDS (Amazon 关系数据库服务) | Microsoft SQL\
  \ Server | Amazon S3 | Snowflake Direct |\n| Marketing Cloud Contacts OAuth 2.0\
  \ | Microsoft Dynamics | Amazon Redshift | MySQL |  |  |\n| Marketing Cloud Contacts\
  \ | NetSuite | Google BigQuery - Legacy SQL and Standard SQL | Oracle |  |  |\n\
  | Customer 360 Global Profile Data | Oracle Eloqua | Google Cloud Spanner |  | \
  \ |  |\n|  | Marketo | Heroku Postgres |  |  |  |\n|  |  | Microsoft Azure SQL Data\
  \ Warehouse |  |  |  |\n|  |  | Microsoft Azure SQL Database |  |  |  |\n|  |  |\
  \ SAP HANA |  |  |  |\n|  |  | Snowflake |  |  |  |\n|  |  | Amazon RDS PostgreSQL\
  \ |  |  |  |\n|  |  | Amazon RDS SQL Server |  |  |  |\n|  |  | Amazon RDS SQL MySQL\
