  \ JSON：\n\n### 基本部件/步骤 JSON\n\n![](img/06379e43783b9ddfee45e9da5192efe1_260_0.png)\n\
  \n图 9.17 – 基本部件/步骤 JSON 示例\n\n这里，我们有一个仪表板 JSON 的简化示例：\n\n### 仪表板 JSON\n\n#### 示例：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_260_1.png)\n\n图 9.18 – 仪表板 JSON 示例\n\n\
  让我们看一个 JSON 绑定的简单示例——动态分组。此示例来自公开可用的 *Learning Adventure* 应用，我在本文末尾提到它。请按以下步骤操作：\n\
  \n- 1. 创建一个新的空白仪表板。\n- 2. 创建一个切换部件 (`pillbox_1`)，其步骤 (`Grouping_Toggle_1`) 指定不同的分组。\n\
  - 3. 创建一个条形图 (`chart_1`)，其步骤 (`Dynamic_Query`) 以紧凑形式按切换部件中选择的分组对总金额进行分组。\n- 4. 在\
  \ Spring 2018 版本中，引入了新的 `columnMap` 图表属性来构建更强大的可视化；但是，`columnMap` 对于此动态可视化不是必需的。将此\
  \ `columnMap {}` 参数替换为 `columnMap: null`。\n- 5. 为了根据切换部件中的选择动态设置图表中的分组，请打开仪表板 JSON\
  \ 并绑定 Dynamic_Query 步骤中的 groups 属性——请参阅此步骤列表之后的 code snippet。\n- 6. 单击 **完成**，即可开始使用。\n\
  \n以下是用于绑定 Dynamic_Query 步骤中 groups 属性的 JSON：\n\n```\n```json\n\"groups\": \"{{ cell(Grouping_Toggle_1.selection,\
  \ 0, \\\"groups\\\").asObject() }}\"\n```\n```\n\n这段代码是什么意思？让我们逐步分解如下：\n\n- `cell(Grouping_Toggle_1.selection,\
  \ 0, \\\"groups\\\")` 返回来自 Grouping_Toggle_1 步骤的所选分组，并从步骤选择中获取 `cell`（第一行，“groups”列）的值。索引\
  \ 0 是第一行，索引 1 是第二行，以此类推。\n- `asObject()` 将结果格式化为字符串数组，这是仪表板 JSON 中预期的格式。\n\n这就是\
  \ *Learning Adventure* 应用中示例的外观：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_262_0.png)\n\
  \n图 9.19 – 动态分组示例\n\n有很多参考资料深入探讨 JSON、绑定等方面的细节。如前所述，我建议你从 TCRM 开发组织创建 *Learning\
  \ Adventure* 应用——在 Analytics Studio 中选择创建模板化应用后，它看起来像这样：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_263_0.png)\n\
  \n图 9.20 – Learning Adventure 应用\n\n你也可以在此处参考 *Tableau CRM Dashboard JSON Developer\
  \ Guide*：\n\n```\nhttps://developer.salesforce.com/docs/atlas.en-us.bi_dev_guide_json.meta/bi_dev_guide_json/bi_dbjson_intro.htm\n\
  ```\n\n现在，我们将看到如何从 UI 创建一些绑定，而无需代码。\n\n### UI 中的绑定\n\n有几种方法可以在不进入仪表板 JSON 的情况下创建绑定。\n\
  我们将在此处看一个示例，创建动态参考线，然后看第二个示例，我们将了解 **高级编辑器**。\n\n\n\n\n\n按照以下步骤创建动态参考线：\n\n- 1.\
  \ 打开**我的第一个仪表盘**。\n- 2. 创建一个新图表，显示按行业划分的平均交易规模（已赢单）。\n- 3. 将此图表添加到**销售**页面的底部。\n\
  - 4. 创建一个新查询，计算整体的平均交易规模（已赢单）。\n- 5. 在新图表的`Format`窗格中，在**Y轴**（左侧）下，选择**值**下的箭头图标，然后选择你的已赢单平均交易规模查询作为动态参考线。\n\
  - 6. 类似地，将平均交易规模添加到标签中，并加上前缀`Average =`。\n- 7. 点击**保存**以保存仪表盘。\n\n将源查询添加到线值中的效果如下：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_264_0.png)\n\n图 9.21 – 将源查询添加到线值中\n\n\
  完成后的动态参考线格式面板应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_265_0.png)\n\n图\
  \ 9.22 – 完成后的动态参考线格式面板\n\n最终结果应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_265_1.png)\n\
  \n图 9.23 – 添加了动态参考线的按行业平均已赢单交易图表\n\n- 3. 在**数据选择**下，选择**行**、**列**或**单元格**。\n- 4.\
  \ 在**行索引**和**列**下选择所需选项。\n- 5. 使用**预览**按钮查看查询详细信息，而无需离开**交互编辑器**。\n- 6. 单击左箭头。\n\
  - 7. 对于**交互类型**，选择**结果**或**选择**。\n- 8. 单击**更多选项**以设置默认值或更改数据序列化函数。\n- 9. 如果你愿意，在构建交互后，你可以手动编辑它。\n\
  - 10. 复制你的交互。\n- 11. 将交互粘贴到JSON或SAQL中。\n- 12. 单击**保存**。\n\n现在你已经学习了如何构建更高级的仪表盘功能，让我们回顾一下本章所学的内容。\n\
  \n### 总结\n\n现在你已经初步涉足了更高级的TCRM设计和构建。我鼓励你运用所学知识并善加利用——在你的开发组织中练习使用这些高级工具，并熟练掌握它们。\n\
  \n你学到了什么？首先，你创建和编辑了TCRM页面，以帮助你构建更高级的仪表盘功能。接下来，你通过使用SAQL了解了TCRM代码。第三，你学习了使用绑定构建动态仪表盘的基础知识。最后，你利用高级编辑器通过点击而非代码来构建交互。\n\
  \n下一章将教你何时需要编码，何时不需要编码。\n\n### 问题\n\n以下是一些测试你知识的问题：\n\n- 给出三个使用TCRM页面的用例示例。\n- 当你在仪表盘内从一个页面移动到另一个页面时，已应用的筛选器是保留还是被清除？\n\
  - 你何时可能需要SAQL？\n- 关键字和函数以大写书写且不区分大小写。对还是错？\n- 你在哪里编辑SAQL？\n- 你使用哪个键盘快捷键来访问仪表盘JSON？\n\
  - 给出三个使用绑定使仪表盘更具交互性和动态性的用例示例。\n"
- "## 10 编码还是不编码？\n\nTableau CRM（TCRM）管理员和开发人员面临的最大挑战之一就是知道何时编码，何时不编码。这会造成相当大的困惑。本章的目的是通过大量实际示例指导你如何确定何时需要代码。\n\
  \n在需要代码的地方，会给出源代码示例。但请注意，本书并非旨在成为Tableau CRM开发人员的详细手册。此外，所给出的代码片段由于必要，通常只是完整源代码的一小部分。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 你何时需要代码？\n- 如果……你可能不需要编码……\n- 歧义的情况\n\n### 技术要求\n\n你需要满足以下要求才能成功执行本章中的操作：\n\
  \n- 最新版本的Google Chrome浏览器（Chrome是使用TCRM时的首选浏览器）\n- 一个可用的电子邮件地址\n\n确保你已登录到你的TCRM开发组织。\n\
  \n让我们首先了解在TCRM应用程序中可能需要在哪些地方使用代码。\n\n### 你何时需要代码？\n\n自Salesforce于2014年推出Wave以来，TCRM的GUI确实已经取得了长足的进步。该平台的早期用户被迫在JSON、SAQL和XMD中构建一切，因为基本上没有声明式选项。现在情况不同了，每次TCRM的新版本都提供更多的点击式功能。\n\
  \n然而，当你在进行更高级的数据转换和仪表盘构建时，TCRM的某些应用确实需要代码。\n\n以下是TCRM中需要部署代码的六个常见应用：\n\n- 安全谓词\n\
  - JSON中的绑定\n- SAQL表达式\n- 批量操作（使用Visualforce和TCRM REST API）\n- `timeseries`（已修改）\n\
  - XMD – 高级格式选项\n\n让我们从安全谓词开始。\n\n### 安全谓词\n\n正如你在*第7章：Tableau CRM中的安全*中所看到的，谓词是一种为数据集定义行级安全的筛选条件。安全谓词根据需求从极其简单到高度复杂不等。所有谓词至少需要一点点代码。\n\
  \n例如，请看下面的代码：\n\n```text\n'FFACompanyId' == \"Unknown\" || 'UserCompany.c2g__User__c'\
  \ == \"$User.Id\"\n```\n\n另一个例子如下：\n\n```text\n'Owner.Role.Roles' == \"$User.UserRoleId\"\
  \ || 'OwnerId' == \"$User.Id\" || 'Account.OwnerId' == \"$User.Id\"\n```\n\n有关安全谓词的详细信息和说明，请参阅以下参考指南：\n\
  \nhttps://resources.docs.salesforce.com/latest/latest/en-us/sfdc/pdf/bi_admin_guide_security.pdf\n\
  \n接下来，你将学习如何使用代码在仪表盘JSON中创建绑定。\n\n### JSON中的绑定\n\n我们现在将研究在仪表盘绑定中使用JSON的几种方式。\n\n\
  ### 动态图表\n\n用户可以通过在仪表盘上进行切换选择来动态选择可视化类型。以下是此选择绑定可能看起来的示例：\n\n```text\n{{coalesce(cell(static_1.selection,\
  \ 0, \\\"visualizationType\\\"), cell(static_1.result, 0, \\\"visualizationType\\\
  \")).asString()}}\n```\n\n在仪表盘JSON中，它可能看起来像这样：\n\n```json\n},\n    \"axisMode\"\
  : \"multi\",\n    \"tooltip\": {\n        \"showBinLabel\": true,\n        \"measures\"\
  : \"\",\n        \"showPercentage\": true,\n        \"showDimensions\": true,\n\
  \        \"showMeasures\": true,\n        \"customizeTooltip\": false,\n       \
  \ \"dimensions\": \"\"\n    },\n    \"visualizationType\": \"{{coalesce(cell(static_1.selection,\
  \ 0, \\\"visualizationType\\\"), cell(static_1.result, 0, \\\"visualizationType\\\
  \")).asString()}}\",\n    \"binValues\": false,\n    \"title\": {\n        \"fontSize\"\
  : 14,\n        \"subtitleFontSize\": 11,\n        \"label\": \"\",\n        \"align\"\
  : \"center\",\n        \"subtitleLabel\": \"\"\n```\n\n### 自定义选择绑定\n\n简单选择绑定可以在GUI中通过基本的代码理解来创建和编辑，但更复杂的用例需要使用JSON。\n\
  \n以下是一个日期期间切换筛选器的示例：\n\n```json\n\"static_1\": {\n    \"broadcastFacet\": true,\n\
  \    \"groups\": [],\n    \"numbers\": [],\n    \"selectMode\": \"singlerequired\"\
  ,\n    \"strings\": [],\n    \"type\": \"staticflex\",\n    \"values\": [\n    \
  \    {\n            \"display\": \"MTD\",\n            \"value\": \"month\"\n  \
  \      },\n        {\n            \"display\": \"QTD\",\n            \"value\":\
  \ \"quarter\"\n        },\n        {\n            \"display\": \"YTD\",\n      \
  \      \"value\": \"year\"\n        }\n    ]\n},\n\"start\": {\n    \"display\"\
  : [\n        \"MTD\"\n    ]\n},\n\"Customers_spending_l_1\": {\n    \"type\": \"\
  saql\",\n    \"query\": \"q = load \\\"bankingData\\\";\\nq = filter q by date('Date_Year',\
  \ 'Date_Month', 'Date_Day') in [\\\"current {{cell(static_1.selection,0,\\\"value\\\
  \").asString()}}\\\"..\\\"current day\\\"];\\nq = group q by all;\\nq = foreach\
  \ q generate unique('comb.CustomerID') as 'unique_comb.CustomerID';\\nq = limit\
  \ q 2000;\",\n    \"selectMode\": \"single\",\n    \"broadcastFacet\": true,\n \
  \   \"receiveFacet\": true,\n    \"useGlobal\": true,\n    \"numbers\": [],\n  \
  \  \"groups\": [],\n    \"strings\": [],\n    \"visualizationParameters\":\n```\n\
  \n### 嵌套绑定\n\n以下是一个示例，我们希望基于嵌套选择绑定计算指标，其中选择绑定引用另一个选择绑定：\n\n```json\n\"query\": {\n\
  \    \"measures\": [\n        \"{{cell(step_1.selection,0,cell(step_2.selection,0,\\\
  \"value\\\")).asObject()}}\"\n    ],\n    \"groups\": [\n        \"Account.Industry\"\
  \n    ]\n},\n```\n\n\n\n有关绑定的详细信息和说明，请参阅以下开发者指南：\n\nhttps://resources.docs.salesforce.com/latest/latest/en-us/sfdc/pdf/bi_dev_guide_bindings.pdf\n\
  \n现在，我们将探讨一些需要在 SAQL 中编写代码的用例。\n\n### SAQL 表达式\n\n当查询需要比 GUI 所能提供的更复杂的逻辑或更高的自定义程度时，需要使用\
  \ SAQL。\n\n### 联合（Union）\n\n若要在一次查询中组合不同的数据流并进行处理，则需要使用 SAQL。\n\n以下是一个计算支出占目标百分比（以\
  \ JSON 格式表示）的示例：\n\n```\n\"steps\": {\n    \"Spending_as__of_Tar_1\": {\n      \
  \  \"broadcastFacet\": true,\n        \"groups\": [],\n        \"label\": \"Spending\
  \ as % of Target\",\n        \"numbers\": [],\n        \"query\": \"spend = load\
  \ \\\"bankingData\\\";\\nspend = group spend by ('Date_Year', 'Date_Month');\\nspend\
  \ = filter spend by date('Date_Year', 'Date_Month', 'Date_Day') in [\\\"30 days\
  \ ago\\\"..\\\"current day\\\"];\\nspend = foreach spend generate 'Date_Year' +\
  \ \\\"~~~\\\" + 'Date_Month' as 'Date_Year~~~Date_Month', sum('Amount') as 'sum_Amount',\
  \ 0 as 'sum_Target';\\n\\ntarget = load \\\"Industry_Targets\\\";\\ntarget = group\
  \ target by ('Date_Year', 'Date_Month');\\ntarget = filter target by date('Date_Year',\
  \ 'Date_Month', 'Date_Day') in [\\\"30 days ago\\\"..\\\"current day\\\"];\\ntarget\
  \ = foreach target generate 'Date_Year' + \\\"~~~\\\" + 'Date_Month' as 'Date_Year~~~Date_Month',\
  \ sum('Target') as 'sum_Target', 0 as 'sum_Amount';\\n\\nboth = union spend, target;\\\
  nboth = group both by all;\\nboth = foreach both generate sum('sum_Target') as 'Target',\
  \ sum('sum_Amount') as 'Spend';\\nboth = foreach both generate sum('Target') as\
  \ 'Target', sum('Spend') as 'Spend', 100*(trunc(('Spend'/'Target'),3)) as '% of\
  \ Target';\\n\",\n}\n```\n\n另一个示例使用 union 将“去年生成”和“今年转化”的信息合并到一个表中：\n\n```\nq =\
  \ load \"OppOwnerAcnt\";\nq_A = filter q by ('AccountId.Type' == \"Partner\" or\
  \ 'Type' == \"New Business\") && date('CloseDate_Year', 'CloseDate_Month', 'CloseDate_Day')\
  \ in [\"1 year ago\"..\"1 year ago\"] ;\nq_B = filter q by ('AccountId.Type' ==\
  \ \"Partner\" or 'Type' == \"New Business\") && date('CloseDate_Year', 'CloseDate_Month',\
  \ 'CloseDate_Day') in [\"current year\"..\"current year\"] ;\nresult = group q_A\
  \ by all full, q_B by all;\nresult = foreach result generate sum(q_A.'Amount') as\
  \ 'A', sum(q_B.'Amount') as 'B';\nfinal1 = foreach result generate \"Last Year Generated\"\
  \ as 'Description', sum('A') as 'Sum';\nfinal2 = foreach result generate \"This\
  \ Year Converted\" as 'Description', sum('B') as 'Sum';\nfinal = union final1,final2;\n\
  ```\n\n### 分组、汇总、小计、平均值等\n\n添加自定义的复杂分组、汇总、小计、平均值等通常需要使用 SAQL。\n\n下面是一个用户想要识别前 5%\
  \ 客户的示例：\n\n```\nq = load \"Wave_Sample_Opportunities\";\nq = group q by 'Account_Name';\n\
  q = foreach q generate 'Account_Name', sum('Amount') as 'sum_Revenue', rank() over\
  \ ([..] partition by all order by sum('Amount')) as 'Position', sum(1) over ([..]\
  \ partition by all) as 'count';\nq = foreach q generate 'Account_Name', 'sum_Revenue',\
  \ ( case when 'Position' >= (floor(((95*'count') + 1)/100)) then \"Top 5 %\" else\
  \ \"Rest\" end ) as 'Bracket';\nq = filter q by 'Bracket' != \"Rest\";\nq = group\
  \ q by ('Account_Name', 'Bracket');\nq = foreach q generate 'Bracket' as 'Bracket',\
  \ 'Account_Name' as 'Account Name', max('sum_Revenue') as 'sum_Revenue';\nq = order\
  \ q by 'sum_Revenue' desc;\n```\n\n另一个示例是计算平均交易规模，并使用它来创建动态参考线：\n\n```\n\"query\"\
  : \"q = load \\\"Opportunity_MT\\\";\\nq = filter q by 'Type' == \\\"New WM Client\\\
  \";\\nq = filter q by 'StageName' == \\\"Revenue Received\\\";\\nq = group q by\
  \ ('CloseDate_Year', 'CloseDate_Quarter', 'AccountId.Name');\\nq = foreach q generate\
  \ 'CloseDate_Year' + \\\"~~~\\\" + 'CloseDate_Quarter' as 'CloseDate_Year~~~CloseDate_Quarter',\
  \ 'AccountId.Name' as 'Household', sum('Amount') as 'Amount';\\nq = group q by ('CloseDate_Year~~~CloseDate_Quarter');\\\
  nq = foreach q generate 'CloseDate_Year~~~CloseDate_Quarter' as 'CloseDate_Year~~~CloseDate_Quarter',\
  \ trunc(avg('Amount'),0) as 'Average';\\nq = group q by all;\\nq = foreach q generate\
  \ trunc(avg('Average'),-2) as 'Avg Amount';\",\n\"referenceLines\": [\n{\n\"color\"\
  : \"#9271E8\",\n\"label\": \"Target = {{cell(gaugeRef6_1.result,0,\\\"target\\\"\
  ).asString()}}\",\n\"value\": \"{{cell(gaugeRef6_1.result,0,\\\"target\\\").asString()}}\"\
  \n},\n{\n\"color\": \"rgb(0, 161, 224)\",\n\"label\": \"Avg = {{cell(Avg_of_Avg_Deals_Siz_1.result,\
  \ 0,\\\"Avg Amount\\\").asObject()}}\",\n\"value\": \"{{cell(Avg_of_Avg_Deals_Siz_1.result,\
  \ 0,\\\"Avg Amount\\\").asObject()}}\"\n}\n],\n```\n\n### 使用图片作为图标\n\n可以使用图片作为图标，以增强美观性并让用户更直观地深入查看数据，如下图所示：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_277_0.png)\n\n图 10.1 – 使用图片作为图标\n\n以下是添加了图片作为图标的\
  \ SAQL 示例：\n\n```\nq = load \"Utilization\";\nq = filter q by date('UtilizationEndDate_Year',\
  \ 'UtilizationEndDate_Month', 'UtilizationEndDate_Day') in [\"180 days ago\"..\"\
  current day\"];\nq = group q by 'ResourceName';\nq = foreach q generate 'ResourceName'\
  \ as 'ResourceName', first('ResourceSalesforceUserPhotoUrl') as 'ResourceSalesforceUserPhotoUrl',\
  \ sum('ValueBillableHours') as 'sum_ValueBillableHours', sum('ValueCreditedHours')\
  \ as 'sum_ValueCreditedHours', sum('ValueCalendarHours') as 'sum_ValueCalendarHours',\
  \ sum('ValueExcludedHours') as 'sum_ValueExcludedHours', sum('ValueUtilizationTargetHours')\
  \ as 'sum_ValueUtilizationTargetHours';\nq = foreach q generate 'ResourceName',\
  \ 'ResourceSalesforceUserPhotoUrl', (case when ('sum_ValueCalendarHours' - 'sum_ValueExcludedHours')\
  \ == 0 then (case when ('sum_ValueBillableHours' + 'sum_ValueCreditedHours') > 0\
  \ then 100 else 0 end) else (('sum_ValueBillableHours' + 'sum_ValueCreditedHours')\
  \ * 100 / ('sum_ValueCalendarHours' - 'sum_ValueExcludedHours')) end) as 'TotalUtilizationRate',\
  \ 'sum_ValueCalendarHours', 'sum_ValueUtilizationTargetHours';\nq = foreach q generate\
  \ 'ResourceName',\n'ResourceSalesforceUserPhotoUrl', coalesce('sum_ValueUtilizationTargetHours'\
  \ * 100 / 'sum_ValueCalendarHours', 0) as 'UtilizationTargetRate', 'TotalUtilizationRate';\n\
  q = foreach q generate 'ResourceName',\n'ResourceSalesforceUserPhotoUrl', (case\
  \ when\n'UtilizationTargetRate' == 0 then (case when\n'TotalUtilizationRate' > 0\
  \ then 100 else 0 end) else\n('TotalUtilizationRate' * 100 / 'UtilizationTargetRate')\
  \ end)\nas 'Target Attainment';\nq = order q by 'Target Attainment' desc;\nq = limit\
  \ q 10;\n```\n\n### 按六个以上产品分组\n\n在 GUI 中，你最多只能按六个组进行分组。请参见以下截图：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_278_0.png)\n\
  \n图 10.2 – 最多六组分组的机会管道\n\n若要添加第七个分组，你需要修改 SAQL，如下所示：\n\n```\nq = load \"opportunity1\"\
  ;\nq = filter q by 'OpenClosedWonLost' == \"Open\";\nq = group q by ('Account.Industry',\
  \ 'Account.Name', 'StageName', 'Account.Owner.Name', 'Pushed', 'ForecastCategoryName',\
  \ 'Account.Segment__c');\nq = foreach q generate 'Account.Industry' as 'Account.Industry',\
  \ 'Account.Name' as 'Account.Name', 'StageName' as 'StageName', 'Account.Owner.Name'\
  \ as 'Account.Owner.Name', 'Pushed' as 'Pushed', 'ForecastCategoryName' as 'ForecastCategoryName',\
  \ sum('Amount') as 'sum_Amount';\nq = order q by ('Account.Industry' asc, 'Account.Name'\
  \ asc, 'StageName' asc, 'Account.Owner.Name' asc, 'Pushed' asc, 'ForecastCategoryName'\
  \ asc);\n```\n\n### 存储桶（复杂）\n\n简单的存储桶可以在配方构建器中创建；更复杂的用例则需要编写代码。以下示例用于创建自定义格式的参考线：\n\
  \n```\n\"steps\": {\n    \"Clone_of_myKPI_1\": {\n        \"broadcastFacet\": true,\n\
  \        \"groups\": [],\n        \"label\": \"Clone of myKPI\",\n        \"numbers\"\
  : [],\n        \"query\": \"q = load \\\"opportunity\\\";\\nq = group q by 'Account.Industry';\\\
  nq = foreach q generate 'Account.Industry' as 'Account.Industry', sum('Amount')\
  \ as 'sum_Amount';\\nq = group q by all;\\nq = foreach q generate \\\"Median by\
