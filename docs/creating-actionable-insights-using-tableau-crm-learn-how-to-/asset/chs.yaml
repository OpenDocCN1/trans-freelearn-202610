  9. 将新查询（**# of Deals Won**）拖到部件上。你现在应该看到一个带有标题 **Count of Rows** 的数字。\n10. 选择 **Number**\
  \ 部件并将标题更改为 **# of Deals Won**。\n11. 在 **Text Style** 下，编辑数字和标题的颜色和大小，使数字突出。\n12.\
  \ 通过使用 **Duplicate Widget** 按钮克隆此 **Number** 部件。\n13. 将新部件拖入亮点面板。\n14. 编辑第二个 **Number**\
  \ 部件并将度量（**Bar Length**）更改为 **Sum of Amount**。这现在捕获了赢得交易的价值。\n15. 将部件查询重命名为 **Value\
