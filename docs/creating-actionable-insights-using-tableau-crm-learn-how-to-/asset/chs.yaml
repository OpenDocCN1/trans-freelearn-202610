  - 6. 将一个日期小部件拖到画布上，位于开关下方，然后点击日期，选择关闭日期。\n- 7. 将标题字段更改为关闭日期。\n- 8. 将**日期**小部件调整为所在空间宽度的一半，使其更高，并将其移动到画布的右边缘。\n\
  - 9. 将一个**列表**小部件拖到画布上，点击**列表**，然后选择**细分**。\n- 10. 将**列表**小部件的大小调整为与**日期**小部件匹配。\n\
  - 11. 将**标题**字段更改为**细分**。\n- 12. 点击右侧的**查询**选项卡，并将**选择类型**更改为**多选**。\n- 13. 将一个**范围**小部件拖到画布上，位于刚添加的两个小部件下方。\n\
  - 14. 拉伸**范围**小部件以填充可用空间。\n- 15. 点击**范围**并选择**金额**。\n- 16. 点击**保存**以保存仪表板。\n\n在仪表板中再添加两个图表，分别用于按行业细分**销售管道**和显示**十大账户所有者**（为此使用**查询限制**）。按您觉得合适的方式设置格式。保存仪表板；它看起来应类似于这样：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_218_0.png)\n\n图8.7 – 已完成第一页的销售仪表板\n\n\
  ### 魔鬼在细节中\n\n在本节中，您将了解可用于编辑仪表板的详细选项。\n\n在您的新仪表板中，查看查询面板及其可用选项。您可以在以下屏幕截图中看到概览：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_219_0.png)\n\n在面板中，每个查询都有五个可用操作，如下所述：\n\
  \n- **编辑**：打开查询进行编辑和格式化。\n- **克隆**：创建查询的副本，并在**编辑**模式下打开。\n- **属性**：可访问查询配置选项，例如分面、选择类型和初始选择。本节后面将提供更多详细信息。\n\
  - **删除**：从仪表板中删除查询。\n- **预览**：以值表格式打开预览窗口。\n\n关于查询属性，以下是更多详细信息：\n\n- **显示标签**：可在此处编辑面向用户的查询标签。\n\
  - **应用全局筛选器**：如果您不希望仪表板全局筛选器应用于此查询及其驱动的小部件，请取消勾选。\n- **分面**：这里有四个选项——**全部**、**包括**、**排除**和**无**。默认值**全部**意味着在其他小部件上选择值会将那些分面值应用于此查询及其驱动的小部件，这与标准仪表板行为一致。可以通过选择**包括**（选择哪些特定查询作为此查询的分面值）、**排除**（选择哪些特定查询不作为此查询的分面值）或**无**（此查询不应用分面）来修改此默认行为。\n\
  - **选择类型**：当用户点击小部件选择时，选择将应用哪种类型：**无**、**单选**、**多选**、**单选(必填)**和**多选(必填)**。\n- **将选择作为分面广播**：取消勾选可关闭默认的分面行为，这意味着在此查询上做出的选择不会对其他查询进行分面。\n\
  - **初始选择**：显示为此仪表板配置的初始选择。\n\n这些查询操作和属性使您在仪表板设计中拥有极大的灵活性。现在，让我们来看看仪表板页面的强大功能。\n\n\
  ### 理解基于页面的自上而下设计\n\n从业务用户的角度来看，在调查和分析数据时，不得不频繁地在仪表板之间切换是很不方便的。此外，应用于一个TCRM仪表板的筛选器不会转移到另一个仪表板。利用TCRM页面对仪表板进行灵活的自上而下设计，可以克服这些障碍，并为数据的切片和切块提供简单灵活的界面。\n\
  \n理解页面功能的最佳方式是将其应用到仪表板，因此请编辑您的**我的第一个仪表板**仪表板，并按照以下步骤操作：\n\n- 1. 点击**默认**右侧、**未命名**旁边的下拉箭头，打开TCRM页面的**用户界面（UI）**。\n\
  - 2. 点击**重命名**，将现有页面重命名为**销售**。\n- 3. 您可以点击+添加新的空白页，但我们希望沿用高亮面板，因此选择下拉箭头并选择克隆。此时会出现一个新页面，名为“销售的克隆”。\n\
  - 4. 将新页面重命名为营销。\n\n以下是TCRM页面的UI：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_221_0.png)\n\
  \n图8.9 – TCRM页面UI\n\n现在，继续构建新页面，如下所示：\n\n- 1. 删除除高亮面板之外的所有小部件；您可以在按住Cmd（Mac）或Ctrl（Windows）的同时单击每个小部件来选择多个小部件。别担心——它们不会从销售页面中移除！\n\
  - 2. 删除高亮面板上除徽标和标题之外的小部件。系统会询问：删除小部件和全局筛选器？点击**仅删除小部件**，因为您不想删除全局筛选器。\n- 3. 点击标题文本小部件。在右侧的小部件面板上，注意有一条消息：此小部件存在于多个页面上。除非您取消链接，否则此处的更改将应用于其他页面上的实例。这很重要——如果您修改此小部件，它将修改此小部件的所有其他副本。\n\
  - 4. 点击**取消链接**。\n- 5. 将标题更改为营销洞察。\n- 6. 调整标题文本小部件的大小，使文本正确显示。\n- 7. 保存仪表板并关闭。\n\
  \n\n\n\n\n在我们完善 **Marketing** 页面之前，我们首先需要创建一个名为 **Leads** 的数据集，其基于 Salesforce **Lead**\
  \ 对象。根据之前章节的知识，请继续操作。我们现在希望保持简单，因此只需使用 **Lead object data** 并选择以下字段：\n\n- **Annual\
  \ Revenue**\n- **City**\n- **Company**\n- **Converted**\n- **Converted Date**\n\
  - **Country**\n- **Created Date**\n- **Email**\n- **Employees**\n- **Full Name**\n\
  - **Industry**\n- **Lead Source**\n- **Phone**\n- **State/Province**\n- **Status**\n\
  \n继续点击 **Create Dataset**。查看 **Data Manager** 中的监视器，并在新的 **Leads** 数据集创建完成后继续。首先，你需要添加一个页面导航器小部件，以便在\
  \ **Preview** 模式下在页面之间轻松移动。为此，请按照以下步骤操作：\n\n- 1. 将 **Navigation** 小部件拖到你的 **Marketing**\
  \ 页面上。\n- 2. 移除 **Navigation** 小部件的边框。\n- 3. 调整此小部件的大小，使其高出一个单元格。\n- 4. 将 **Navigation**\
  \ 小部件向上移动，使其紧贴 highlights 面板容器。\n- 5. 格式化 **Navigation** 小部件，使其在页面上突出但不与其它小部件冲突。参见\
  \ *Figure 8.10* 中的示例。\n\n- 6. 进入 **Sales** 页面并将所有小部件（不包括 highlights 面板）向下移动（如有需要），在键盘上使用箭头按钮同时选中多个小部件来操作。这将为\
  \ **Navigation** 小部件腾出空间。\n- 7. 在画布底部的 **Move/Add** 操作下，在选中 **Navigation** 小部件时，点击\
  \ **Add to Page** 并选择 **Sales**。\n- 8. **Navigation** 小部件现在应显示在 **Sales** 页面上。如有必要，将其移动到合适位置，并按需移动其它小部件。\n\
  \n带有 **Navigation** 小部件的仪表板应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_223_0.png)\n\
  \nFigure 8.10 – Your dashboard with the Navigation widget in place\n\n现在，是时候使用营销数据构建新页面了。请按照以下步骤操作：\n\
  \n- 1. 编辑仪表板并选择 **Marketing** 页面。\n- 2. 基于 **Leads** 数据集创建一个新的查询。\n- 3. 按 **Lead\
  \ Source** 对行数计数进行分组。\n- 4. 将查询重命名为 **Leads by Source** 并添加此标题。\n- 5. 为查询选择 **Donut**\
  \ 图表。\n- 6. 点击 **Done**。\n- 7. 你现在会注意到 **Query** 面板现在在 **Leads** 以及 **Opportunities**\
  \ 下列出了查询。\n- 8. 将此新的 **Leads** 查询拖到画布上。\n- 9. 调整 **Chart** 小部件的大小和格式以满足你的偏好。在我的示例中，如以下屏幕截图所示，我选择创建一个饼图，将\
  \ **Center Size** 值设为 0% 并将饼图值显示为 **Percentage**。\n- 10. 创建并添加一个 **Leads by Status**\
