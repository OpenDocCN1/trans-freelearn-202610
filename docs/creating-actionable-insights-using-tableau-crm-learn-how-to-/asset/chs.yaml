  \ | Banking | 3,390,620 | 2025-02-06 |\n\nFigure 6.17 – Sample of a customized values\
  \ table\n\n值表对于为仪表板准备表格或逐行深入您的数据进行详细分析非常有用。您还可以使用带有 Σ 符号的汇总按钮添加小计和总计。\n\n现在，是时候查看用于深入挖掘数据的比较表工具了。\n\
  \n### Compare table\n\n比较表是用于分析数据的最强大的声明式工具之一。列编辑器可用于执行以下任务：\n\n+   - 向表格添加计算和过滤器。\n\
  +   - 在列和行之间执行算术运算。\n+   - 通过操作字符串值创建标签。\n+   - 并排查看度量。\n+   - 串联维度值。\n+   - 创建简单的桶。\n\
  +   - 添加图像 URL。\n\n在以下练习中，我们将使用比较表执行以下步骤：\n\n+   1. 计算已赢交易数量的累计总和。\n+   2. 按已赢交易总和对销售代表进行排名。\n\
  +   3. 计算每个代表占总体的份额。\n+   4. 计算所有代表的成交赢率，按交易数量计算（现在按金额计算）。\n\n让我们开始创建第一个比较表：\n\n\
  +   1. 打开 **My First Lens**。\n+   2. 在新标签页中克隆 **My First Lens** 并将其保存为 **My First\
  \ Compare Table**。\n+   3. 更改为 **Compare Table** 模式。\n+   4. 添加 **Count of Rows**\
  \ 作为第二个列/度量。\n\n现在，通过点击 **Edit this Column** 进入列编辑模式，如以下截图所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_174_0.png)\n\
  \nFigure 6.18 – Column editing mode\n\n\n\n\n\n你的进度应与以下截图中显示的内容相匹配：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_177_0.png)\n\
  \n图 6.21 – 添加总占比后表格的进度对比\n\n最后，你必须为每位代表计算交易获胜率，按交易次数计算（而非金额）：\n\n- 1. 添加一列基于行数计数，命名为\
  \ Won。\n- 2. 为此列添加一个筛选器，其中 Won = True。\n- 3. 添加最后一列并将其重命名为 Win Rate。\n- 4. 添加一个用于计算获胜率的简单公式，截断为两位小数，如以下代码片段所示。\n\
  - 5. 将格式设置为百分比。\n- 6. 点击 Apply 然后点击 Close。\n- 7. 按降序对 Win Rate 进行排序。\n- 8. 点击 Save。\n\
  \n你的完成表格应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_179_0.png)\n\n图 6.23\
  \ – 已完成的 My First Compare Table\n\n现在，创建一个组合图表来显示交易总和和获胜率。在新标签页中克隆它并保存为 Win Rate\
  \ and Sum of Deals by Sales Rep。完成的图表应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_180_0.png)\n\
  \n图 6.24 – 按销售代表的获胜率和交易总和\n\n使用比较表还可以做更多的事情——深入你的开发组织自行探索吧！\n\n### 透视表\n\n你很可能熟悉透视表；它们是电子表格等工具中的常见功能。透视表是汇总数据和详细分析数值数据的一种交互方式。透视表可用于执行以下操作：\n\
  \n- 对数值数据进行小计和汇总，按类别和子类别汇总数据。\n- 展开和折叠不同层级的数据，以便关注结果并在汇总级别深入细节。\n- 将行移动到列或列移动到行（称为透视），以查看数据的不同汇总。\n\
  - 筛选、排序、分组和条件格式设置最有用和相关的子集数据，使你能够专注于所需的信息。\n\n通过打开 My First Lens 并使用行业作为第二个分组创建透视表，我们在筛选结果后会看到类似以下内容：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_181_0.png)\n\n图 6.25 – 透视表示例\n\n现在，是时候从\
  \ Table Mode 切换到 Query Mode 了。\n\n### 查询模式\n\n现在你对图表和表格模式已足够熟悉，唯一剩下的模式就是 TCRM lenses\
  \ 中强大的基于代码的分析工具，即查询模式。查询模式利用 Salesforce Analytics Query Language（SAQL）查询你的数据，而非我们迄今为止检查的声明式和低代码方法。\n\
  \n查询模式如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_182_0.png)\n\n我们不会在这里深入探讨查询模式的细节，因为\
  \ SAQL 将在第 9 章《高级仪表板设计与构建》中详细研究。有关编写 SAQL 的详细参考，请参阅此处的 TCRM SAQL 开发人员指南：\n\nhttps://developer.salesforce.com/docs/atlas.en-us.232.0.bi_dev_guide_saql.meta/bi_dev_guide_saql/bi_saql_intro.htm\n\
  \n现在你对使用 TCRM lenses 已有信心，你需要了解如何将 lenses 剪辑到仪表板中。\n\n### 使用 lenses 创建 TCRM 分析仪表板\n\
  \nLenses 可以使用 **Clip** 功能创建仪表板，或添加到现有仪表板中。虽然我们将在 *第 8 章《构建你的第一个 TCRM 仪表板》* 中详细讨论仪表板构建，但我们将快速查看如何创建简单的仪表板并添加我们之前创建的两个\
  \ lenses。请按照以下步骤操作：\n\n- 1. 打开 **My First Lens**、**My First Table View** 和 **Service\
  \ Data Analysis** lenses。\n- 2. 从 TCRM Analytics Studio 主页，点击 **Create** 并选择 **Dashboard**。\n\
  - 3. 选择 **Blank Dashboard**。\n- 4. 对于每个 lens，进入该 lens，点击带有剪刀图标的 **Clip to Designer**\
  \ 按钮，确保该 lens 将作为小部件导出，然后点击 **Clip to Designer**。进入空白仪表板，默认名称为 **New dashboard**。将仪表板保存为\
  \ **Lens Clip**。\n- 5. 将三个已剪辑的 lenses——现在作为查询位于仪表板设计器的右侧——拖到设计画布上。\n- 6. 通过调整 lenses\
  \ 的大小来尝试，直到你满意为止。\n- 7. **Save** 该 lens。\n- 8. 点击 **Preview** 查看你的仪表板或选择 **Present**\
  \ 视图。\n\n结果可能如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_184_0.png)\n\n图 6.27\
  \ – 剪辑到仪表板的 Lenses\n\n正如我们之前提到的，我们将在第 8 章《构建你的第一个 TCRM 仪表板》中更详细地讨论仪表板的设计和构建。\n\n\
  在结束本章之前，我想分享一些提示和建议。\n\n### 提示和建议\n\n让我分享一些在使用 lenses 时的提示和建议。\n\n首先，这里有一些键盘快捷键：\n\
  \n- S：保存（无需使用对话框）。\n- P：演示（全屏）模式。\n- Esc：退出演示模式。\n- L：剪辑到仪表板设计器。\n- Ctrl + E（Windows）/Cmd\
  \ + E（macOS）：打开 JSON 编辑器。\n\n其次，你可以使用一些巧妙的 SAQL 在表格和透视表中对小计、总计等进行一些很酷的操作。\n\n第三，重要的是要记住，当你在\
  \ **Fields** 面板中修改字段标签和颜色时，更改将传播到所有仪表板和 lenses。请谨慎修改！\n\n第四，值表格中的默认行数可以使用 **Query\
  \ Limit** 设置更改，或使用 SAQL limit 语句更改。\n\n最后，请注意查询限制，因为它会对查询结果产生严重影响，并且由于默认值是 2,000，可能导致数字看起来不正确。此限制也可以在\
  \ SAQL 中编辑或删除。\n\n### 总结\n\n正如你所见，lenses 是 TCRM 的调查记者。在本章中，你了解了 lens 是什么，它是如何成为调查数据的灵活工具，以及\
  \ lenses 如何成为 TCRM 分析仪表板的构建块。\n\n现在，你可以使用熟悉的 lens UI 创建、编辑和克隆 lenses。最后，你了解了如何使用\
  \ lenses 作为构建块构建仪表板。\n\n下一章将教你如何通过利用 TCRM 安全工具来控制谁可以看到你的 lenses 和仪表板中的内容。\n\n###\
  \ 问题\n\n以下是一些问题，供你测试对本章内容的掌握：\n\n- Lens 使你能够做什么？\n- Lens 的 Clip 命令的目的是什么？\n- 命名一个透视表的使用。\n\
  - 你如何使用散点图？组合图？平滑仪表？\n- 你如何共享一个 lens？\n- 查询模式的目的是什么？\n- 比较表有哪三种用途？\n"
- "## 7 Tableau CRM 中的安全\n\n你如何决定谁在 Tableau CRM 中可以看到什么？这是 TCRM 开发中最不为人所理解的方面之一，因此在本章中，你将学习如何保护你的\
  \ TCRM 数据。我们将首先概述 TCRM 安全。然后我们将逐步介绍 TCRM 提供的每个工具，以确定谁可以看到什么数据。\n\n到本章结束时，你将了解 TCRM\
  \ 安全的基础知识。接下来，你将能够部署和管理 TCRM 访问权限。你将了解 TCRM 应用级安全，并能够按需部署和编辑它。此外，你将能够评估和部署 Salesforce\
  \ 共享继承。最后，你将能够构建和部署安全谓词。\n\n在本章中，我们将涵盖以下主要主题：\n\n- 什么是 TCRM 安全以及它如何工作？\n- 管理 TCRM\
  \ 访问权限\n- 配置 TCRM 应用级安全\n- 部署 Salesforce 共享继承\n- 了解安全谓词的概念和用法\n\n\n\n\n\n### 技术要求\n\
  \n要成功执行本章中的说明，您需要以下内容：\n\n- 最新版本的 Google Chrome 浏览器（在处理 TCRM 时，Chrome 是首选浏览器）\n\
  - 一个可用的电子邮件地址\n\n确保您已登录到您的 TCRM 开发组织。\n\n让我们直接开始，对 TCRM 安全有一个高层次的了解。\n\n### 什么是\
  \ TCRM 安全以及它是如何工作的？\n\n在数据治理和安全的大背景下，控制在 Tableau CRM 中呈现的信息的访问至关重要。\n\n> **重要说明**\n\
  > \n> 一旦某个字段在 TCRM 中可见，就没有办法阻止某人查看其数据。任何有权访问数据集的人都可以访问所有字段，而与 Salesforce 不同，在 Salesforce\
  \ 中您可以进行字段级安全控制。\n\nTCRM 管理员有四种安全工具可以使用：\n\n- **Salesforce 数据访问：** 管理员可以配置 Salesforce\
  \ 字段和对象的权限以实施字段级和对象级安全，这意味着可以控制对 Salesforce 数据的访问。例如，可以在摄取级别限制对敏感个人信息的访问，以防止此数据被加载到\
  \ TCRM 中。\n- **TCRM 应用级安全：** 当您向用户、应用所有者和管理员分配管理权限时，他们将能够管理对应用内资产的访问——透镜、数据集和仪表板。\n\
  - **Salesforce 共享继承：** 共享继承会与在 Salesforce 中配置的共享规则同步，但受某些限制。如果使用，建议同时设置安全谓词，以防共享设置无法得到\
  \ honoring。\n- **安全谓词：** 安全谓词使您能够通过灵活且可定制的行级安全功能，对数据集应用不同类型的访问控制。\n\n以下是帮助您理解所有这些如何协同工作的示意图：\n\
  \n![](img/06379e43783b9ddfee45e9da5192efe1_189_0.png)\n\n图 7.1 – TCRM 安全概述\n\n要讨论的第一个\
  \ TCRM 安全功能是控制 Salesforce 数据的权限。\n\n### 管理 TCRM 访问权限\n\n要摄取数据并将其用作行级安全的一部分，您必须有权访问\
  \ Salesforce 数据。根据 TCRM/Salesforce 用户的两种系统的权限，Tableau CRM 会获得对 Salesforce 数据的访问权限。这两种\
  \ TCRM/Salesforce 用户系统如下：\n\n- Integration User\n- Security User\n\n以下是 **Integration\
  \ User** 在 Salesforce 中 **Setup** 中的视图：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_190_0.png)\n\
  \n图 7.2 – Integration User。请注意用户配置文件，即 Analytics Cloud Integration User\n\nTCRM\
  \ 在数据准备作业运行时使用 **Integration User** 的权限，以便从 Salesforce 对象和字段摄取数据。由于 **Integration\
  \ User** 具有 **View All Data** 访问权限，因此应限制对包含敏感数据的任何字段和对象的访问。\n\n如果数据流尝试从 **Integration\
  \ User** 未被授予查看权限的字段或对象读取数据，作业将失败。\n\n基于 User 对象，如果查询具有行级安全的数据集，TCRM 将利用 **Security\
  \ User** 的权限来读取 User 对象及其字段。**Security User** 对包含在谓词中的每个 User 对象字段都需要一些读取权限。\n\n\
  您可能想知道，什么是谓词？当数据集的行级安全由过滤条件定义时，这就被称为谓词。请参阅 *什么是安全谓词以及如何使用它们？* 部分了解更多信息。默认情况下，**Security\
  \ User** 对 User 对象的标准字段具有读取权限。如果谓词使用了自定义字段，您需要确保 **Security User** 对该字段具有读取访问权限。如果您尝试使用谓词查询数据集，而\
  \ **Security User** 没有对所有相关 User 对象字段的读取访问权限，则会触发错误。\n\n在为 **Security User** 或 **Integration\
  \ User** 设置权限时，请勿修改原始配置文件；您应始终对其克隆版本进行更改。要控制对 Salesforce 数据的访问，您应配置 **Integration\
  \ User** 在 Salesforce 字段和对象上的权限。为了基于 User 对象的自定义字段实现行级安全，还需要配置 **Security User**\
  \ 的权限。\n\n> **重要说明**\n> 切勿删除 **Integration User** 或 **Security User**，因为 Tableau\
  \ CRM 需要这些用户来访问 Salesforce 数据。\n\n总之，当数据被摄取并用作行级安全时，Tableau CRM 必须有权读取 Salesforce\
  \ 数据。\n\n因此，您必须确保以下事项已完成：\n\n- 已设置 **Integration User** 的权限以管理数据流对 Salesforce 数据的访问。\n\
  - 已设置 **Security User** 的权限以基于 User 对象的自定义字段实现行级安全。\n\n作为一个实际示例，请在您的 TCRM 开发组织中执行以下步骤：\n\
  \n1. 在 Salesforce 中，而不是 TCRM 中，进入 **Setup**。\n2. 在 **Quick Find** 中，搜索 **Permission\
  \ Sets** 并单击它。\n3. 单击 **New** 创建新的权限集。\n4. 在 **License** 下选择 **Analytics Cloud Integration\
  \ User**。\n5. 将权限集的名称设置为 **Test** 并单击 **Save**。\n6. 通过选择 **Object Settings** 和 **App\
  \ Permissions** 为权限集分配应用和对象级权限。为此练习选择多种选项。\n7. 为权限集配置 **Apex Class Access**、**Visualforce\
  \ Page Access** 和 **Flow Access** 权限。为此练习选择多种选项。\n8. 此新权限集现在可以分配给 TCRM **Integration\
  \ User**。\n9. 在 **Salesforce Setup** 下，找到并选择 **Profiles**。\n10. 选择 **Analytics Integration\
  \ User** 配置文件。\n11. 单击 **Clone** 按钮创建配置文件的克隆副本。\n12. 通过取消选中复选框移除 **View All Data**\
  \ 访问权限。\n13. 将配置文件保存为 **Test**。\n14. 在 **Salesforce Setup** 下，选择 **Users**。\n15.\
  \ 从列表中选择 **Integration User**（User, Integration）。\n16. 编辑用户并将用户的配置文件更改为我们在 *步骤 11*\
  \ 中创建的克隆配置文件 **Test**。\n17. 导航到 **Integration User** 的 **Permission Set Assignments**\
  \ 部分。\n18. 将在 *步骤 6* 中新建的权限集 **Test** 分配给 **Integration User**。这使 TCRM 集成用户能够访问\
  \ Salesforce 对象和其他组件。\n\n接下来要检查的工具是应用级安全。\n\n### 配置 TCRM 应用级安全\n\n正如您可能还记得我们在 *第\
  \ 2 章《在 TCRM 中开发您的第一个 OOTB 分析应用》* 中学到的那样，Tableau CRM 应用类似于文件夹，使用户能够组织其数据项目并控制数据集、透镜和仪表板的访问权限以及它们如何共享。TCRM\
  \ 应用的此功能使其成为限制或授予对资产访问权限的有用安全工具。\n\n默认情况下，所有 TCRM 用户都从 **Shared App** 开始获得 Viewer\
  \ 访问权限。管理员可以修改此设置以开放或限制访问。开箱即用的应用 **My Private App** 可供每个用户访问，适合个人进行中的工作。用户 **My\
  \ Private App** 的内容对管理员不可见，但透镜和仪表板可以与用户共享。\n\n此外，默认情况下，所有新应用都设置为私有。管理权限归管理员和应用所有者所有；因此，他们可以将\
  \ **VIEWER**、**EDITOR** 或 **MANAGER** 访问权限扩展到其他角色、组或用户。下面的表格快速总结了用户在不同访问级别下可以执行的操作：\n\
  \n\n|  | A | B | C | D |\n|---|---|---|---|---|\n| 1 | **操作** | **查看者** | **编辑者**\
  \ | **管理员** |\n| 2 | 查看应用中的仪表板、透镜和数据集 | × | × | × |\n| 3 | 查看谁有权访问应用 | × | × | ×\
  \ |\n| 4 | 将应用内容保存到用户具有编辑者或管理员访问权限的其他应用 | × | × | × |\n| 5 | 保存对应用中现有仪表板、透镜和数据集的更改（保存仪表板需要适当的权限集许可和权限）\
  \ |  | × | × |\n| 6 | 更改应用的共享设置 |  |  | × |\n| 7 | 重命名应用 |  |  | × |\n| 8 | 更新应用中的资产可见性\
  \ |  | × | × |\n| 9 | 删除应用 |  |  | × |\n\n图7.3 – 拥有查看者、编辑者和管理员访问权限的用户可以做什么？\n\n\
  要向TCRM用户授予访问权限，只需在查看应用时点击页面右上角的**共享**按钮。此时会显示以下对话框，您可以按需要授予访问权限，然后点击**保存**：\n\n\
  ![](img/06379e43783b9ddfee45e9da5192efe1_193_0.png)\n\n图7.4 – 使用“共享”按钮授予对分析应用的访问权限\n\
  \n### 提示\n\n首先，如果数据集与仪表板或透镜位于不同的应用中，TCRM用户必须能够访问这两个应用才能查看透镜或仪表板。\n\n其次，已停用的用户将失去对其管理的所有应用的共享和删除访问权限。因此，为确保不发生这种情况，请在停用用户之前，将管理员访问权限分配给至少一名活跃用户。\n\
  \n作为实际示例，请按照以下步骤将新的私有仪表板共享给单个用户：\n\n- 1. 首先，创建一个名为**私有应用**的新应用。\n- 2. 现在，创建一个新的空白仪表板，并将其保存到**我的私有应用**，名称为**私有仪表板**。\n\
  - 3. 要向活跃用户Julie Chavez授予访问权限，请打开**共享**对话框，并在**邀请其他人**下添加Julie为具有**查看者**权限的用户。\n\
  - 4. 点击**添加**。\n- 5. 点击**保存**。\n\n完成的共享对话框应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_194_0.png)\n\
  \n图7.5 – 完成的共享对话框，其中添加了Julie并赋予了查看者权限\n\n现在，让我们探讨Salesforce共享继承。\n\n### 部署Salesforce共享继承\n\
  \n如果您希望数据集共享设置复制Salesforce为对象应用的设置，则可以通过部署共享继承来实现。\n\n在许多情况下，共享继承会减少或消除对复杂安全谓词的需求。另一方面，应用共享继承会增加处理数据和创建/更新数据集所需的时间——完成数据同步、配方作业等。请记住，共享设置越复杂，对数据处理时间的影响就越大。请注意，如果共享设置更复杂，数据处理所花费的时间将受到更大的影响。\n\
  \nSalesforce管理员很可能组合使用共享设置，为用户提供与其角色相关的Salesforce数据访问权限，包括基于以下内容的共享：\n\n- 手动共享规则\n\
  - 角色层次结构\n- 角色\n- 组\n- Apex管理的共享\n- 基于团队的共享\n\n您可以启用共享继承以在Tableau CRM中使用Salesforce共享设置，但仅限于有限的一组受支持对象。创建或编辑数据集时，请务必指定要从中继承共享的对象。受支持的对象如下：\n\
  \n- Account\n- Case\n- Contact\n- Lead\n- Opportunity\n\n要启用共享继承，您需要打开共享继承开关。接下来，选择要用作共享源的对象。请注意，在新版Salesforce环境中，共享继承默认是开启的。\n\
  \n打开共享继承后，最佳做法是对对象运行“共享继承覆盖率评估”报告，然后针对该对象的用户运行，以调查共享继承对您的适用程度。在**分析**下，从**Salesforce设置**菜单中，选择**共享继承覆盖率评估**。\n\
  \n> **注意**\n>\n> 最佳做法是在将共享继承部署到生产环境之前，先在沙盒环境中进行测试。这使您能够针对环境的安全模型和数据测试用例，从而确信共享继承将按预期工作。\n\
  \n要打开共享继承，请按照以下步骤操作：\n\n- 1. 在**设置快速查找**框中，输入**分析**，然后点击**设置**。\n- 2. 选择**从Salesforce继承共享**，然后点击**保存**。\n\
  \n如果启用了**数据同步**，您必须为将用作共享源的每个对象打开共享继承。请按照以下步骤操作：\n\n- 1. 在Tableau CRM Studio中，点击**数据管理器**。\n\
  - 2. 在**数据管理器**中，点击**连接**。\n- 3. 点击该行右侧的**下拉列表**，找到要启用的对象。\n- 4. 点击**行级共享**。\n-\
  \ 5. 打开**共享继承**。\n- 6. 点击**保存**按钮。\n\n共享继承确实有一些限制。例如，一个挑战是TCRM实例中共享规则消耗的空间量。\n\n\
  Salesforce共享继承的其他限制和注意事项如下：\n\n- 仅当所有支持的对象记录各自少于400个共享描述符时，才能应用。\n- 可能会影响查询、数据流和数据准备配方的性能。\n\
  \n有关详细的最新技术信息和规范，请访问 `https://help.salesforce.com/s/articleView?id=sf.bi_security_datasets_sharing_about.htm&type=5`。\n\
  \n现在，让我们探讨您可以使用的最强大且最灵活的工具：安全谓词。\n\n### 理解安全谓词的概念和用法\n\nTCRM中的数据可见性可以使用安全谓词来控制。正如我们之前提到的，由过滤条件定义的数据集行级安全性称为谓词。谓词可以基于以下场景控制数据可见性：\n\
  \n- **角色层次结构**：在Salesforce组织中，谓词可以基于用户角色过滤数据，但前提是用户已登录。用户只能查看由他们自己或Salesforce中角色层次结构下级别人员拥有的记录。\n\
  - **管理层次结构**：在User对象中，谓词可以基于User对象中的Manager字段过滤数据。因此，登录用户可以查看他们自己拥有的记录，以及管理层次结构中向其汇报的任何用户所拥有的记录。\n\
  - **登录用户的国家/地区**：谓词还可以根据登录用户的国家/地区过滤数据。来自某个国家的用户可以访问由来自同一国家的用户拥有的记录。\n- **机会团队和客户团队**：如果需要根据登录用户是否是记录所有者的机会团队和客户团队的成员来管理数据可见性，则也可以使用谓词。\n\
  - **用户区域**：谓词可以基于用户区域实现行级安全性。\n- **各种需求的组合**：基于这些场景的组合定义谓词。\n\n定义安全谓词表达式时，必须使用有效的语法：\n\
  \n```\n<数据集列> <运算符> <值>\n```\n\n这是一个例子：\n\n```\n'UserId' == \"$User.Id\"\n```\n\n\
  让我们看看前述示例中的每个部分：\n\n- `UserId`：这是数据集列的API名称。\n- `==`：这是运算符。\n- `$User.Id`：这是登录用户的Salesforce用户ID。\n\
  \n请务必注意有关谓词表达式的以下几点：\n\n- 它们区分大小写。\n- 它们不能包含超过5,000个字符。\n- 在逻辑运算符前后、运算符和值之间以及列和运算符之间，至少必须有一个空格。\n\
  - 必须使用单引号括住数据集列，例如`OwnerId`。\n- 表达式的值可以是Salesforce中User对象的字段值。\n- User对象支持字符串、数字和多值选择列表字段。\n\
  - 值可以是字符串或数字。\n- 您必须拥有相关User对象字段的读取权限才能为数据集定义谓词。\n\n例如，以下表达式无效：\n\n```\n`'Revenue'>100`\n\
  ```\n\n它必须包含空格，如下所示：\n\n```\n`'Revenue' > 100`\n```\n\n以下是数据集安全谓词的四个示例：\n\n- `Static\
  \ Filter: 'Product.Family' == \"Phones\"`\n- `Record Ownership: 'Opportunity.OwnerId'\
  \ == \"$User.Id\"`\n- `Role Hierarchy: 'Opportunity.OwnerId' == \"$User.Id\" ||\
  \ 'Opportunity.User_Role_Id_Path' == \"$User.UserRoleId\"`\n- `Custom: 'Opportunity.OwnerId'\
  \ == \"$User.Id\" || 'Opportunity.User_Role_Id_Path' == \"$User.UserRoleId\" ||\
  \ 'Opportunity.View_All_Settings' == \"$User.View_All__c\"`\n\n\n\n\n请考虑每种值类型的要求：\n\
  \n| 值类型 | 要求 | 谓词表达式示例 |\n|---|---|---|\n| 字符串字面量 | 用双引号括起来，并对双引号进行转义。 | - `'Owner'\
  \ == \"Amber\"`<br>- `'Stage Name' == \"Closed Won\"` |\n| 数字字面量 | 可以是浮点或长整型数据类型。不要用引号括起来。\
  \ | - `'Expected Revenue' >= 2000.00`<br>- `'NetLoss' < -10000` |\n| 字段值 | 引用User对象中的字段时，使用`$User[field]`语法。对字段使用API名称。<br><br>你可以指定类型为字符串、数字或多值选择列表的标准或自定义字段。<br><br>当为数据集定义谓词时，你必须对所有用于创建谓词表达式的User对象字段具有读取访问权限。\
  \ | - `'Owner.Role' == \"$User.UserRoleId\"`<br>- `'GroupID' == \"$User.UserGroupId__c\"\
  `<br><br>注意：支持的User对象字段值类型为字符串、数字和多值选择列表。 |\n\n图 7.6 – 谓词表达式中的值\n\n如果用户尝试查询应用了无效谓词的数据集，用户将看到错误。\n\
  \n现在，进入你的TCRM开发组织中的Analytics Studio，并按照以下步骤操作：\n\n1. 打开**My First Analytics App**，查看数据集列表。\n\
  2. 通过点击列表右侧的下拉箭头来编辑**Opportunities**数据集。\n3. 通过点击铅笔图标（如前述表格所示）并删除谓词代码，来删除现有的安全谓词（如下方项目符号列表后的代码片段所示）。\n\
  4. **Security predicate**现在应为**None**。\n5. 编辑谓词并添加**New opportunity dataset predicate**。\n\
  6. 为**Opportunities**数据集创建一个lens，并检查新谓词是否按预期工作。你可能需要注销后重新登录，谓词才能生效。\n7. 通过编辑数据集并用之前的谓词替换新谓词来撤销你的操作。\n\
  \n你需要点击以编辑谓词的铅笔图标已在以下截图中用粗箭头标出：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_200_0.png)\n\
  \n图 7.7 – 显示现有安全谓词的Opportunities数据集\n\n以下是现有的机会数据集谓词：\n\n```\n'Owner.Role.Roles'\
  \ == \"$User.UserRoleId\" || 'OwnerId' == \"$User.Id\" || 'Account.OwnerId' == \"\
  $User.Id\"\n```\n\n该谓词确保机会数据仅在基于角色层次结构、机会所有者和客户所有者允许的情况下可供查看。\n\n以下是新的机会数据集谓词：\n\
  \n```\n'OwnerId' == \"$User.Id\" || 'Account.OwnerId' == \"$User.Id\"\n```\n\n该谓词已移除基于角色层次结构的访问权限。\n\
  \n现在，返回并将新谓词替换为原始谓词。\n\n有关谓词的详细参考，请参阅此处的 *Tableau CRM 安全实施指南*：\n\n```\nhttps://resources.docs.salesforce.com/232/latest/en-us/sfdc/pdf/bi_admin_guide_security.pdf\n\
  ```\n\n### 总结\n\n下图提供了Tableau CRM中安全机制的有效总结：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_201_0.png)\n\
  \n图 7.8 – TCRM 安全概览\n\n如你所见，在Tableau CRM中实现安全有多种选择。在本章中，你了解了这些安全工具以及如何部署它们。\n\n\
  你学到了什么？首先，你掌握了TCRM中安全的基础知识。接下来，你学会了如何管理TCRM访问权限。第三，你学会了如何使用应用级安全来控制对TCRM分析应用资产的访问。其次，你熟练掌握了配置和启用Salesforce共享继承。最后，你学会了如何构建和部署安全谓词，以用于更复杂、更细粒度的数据治理用例。\n\
  \n在下一章中，你将学习构建你的第一个TCRM仪表板。\n\n### 问题\n\n以下是一些测试你本章知识的问题：\n\n- TCRM中应用级安全的目的是什么？\n\
  - 如何通过Salesforce对象和字段访问来控制TCRM安全？\n- 当数据流作业运行时，TCRM使用____________用户的权限从Salesforce对象和字段中提取数据。\n\
  - Salesforce共享继承的三个限制是什么？\n- 安全谓词的三个使用场景是什么？\n- 安全谓词表达式的字符数不得超过多少？\n- 这是一个有效的谓词表达式吗？为什么有效或无效？\n\
  \  - `\"Revenue\">100`\n- 安全谓词表达式区分大小写——对还是错？\n"
- '# 第3部分：如何在TCRM中构建出色的分析仪表板


  在本部分中，你将学习如何在TCRM中设计、构建、测试和部署强大且实用的动态分析仪表板。


  本部分包含以下章节：


  - *第8章，构建你的第一个TCRM仪表板*

  - *第9章，高级仪表板设计与构建*

  - *第10章，编码还是不编码？*

  - *第11章，使用TCRM进行仪表板设计的最佳实践*

  '
- "## 8 构建你的第一个TCRM仪表板\n\n是时候将你的新理解付诸实践，构建你的第一个Tableau CRM（TCRM）仪表板了。学完本章，你将能够从零开始创建仪表板，浏览仪表板编辑器，添加和编辑小部件，添加页面，对数据进行切片和切块，并与他人分享你的发现。\n\
  \n本章将涵盖以下主要主题：\n\n- 了解你的仪表板编辑器\n- 创建仪表板并放置小部件\n- 细节决定成败\n- 理解使用页面进行自上而下的设计\n- TCRM仪表板用户指南\n\
  \n### 技术要求\n\n要成功执行本章中的操作说明，你需要以下内容：\n\n- 最新版本的Google Chrome浏览器（使用TCRM时，Chrome是首选浏览器）\n\
  - 一个可用的电子邮件地址\n\n确保你已登录到你的TCRM开发组织。\n\n是时候开始构建你的第一个TCRM仪表板了！\n\n### 了解你的仪表板编辑器\n\
  \n在本节中，你将亲自动手学习如何使用TCRM中的仪表板编辑器。\n\n在Analytics Studio主页上，点击Create并选择Dashboard，然后点击Create\
  \ Blank Dashboard。你将进入仪表板编辑器画布，如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_206_0.png)\n\
  \n图 8.1 – 初始仪表板编辑器画布\n\n在继续下一步之前，将你的仪表板保存为My First Analytics App中的My First Dashboard。\n\
  \n现在，通过点击**Default**齿轮图标来配置仪表板设置。我通常使用以下默认设置：\n\n- **名称：** `Default`\n- **列数：**\
  \ 50\n- **行高：** 精细\n- **单元格间距：** 8（水平）和0（垂直）\n- **最大仪表板宽度：** 1500\n- **背景颜色：** 暂时保持原样\n\
  \n画布左侧有14个可用工具，如下所述；当你将它们添加到仪表板时，将对这些工具进行说明：\n\n- 图表\n- 表格\n- 筛选器\n- 容器\n- 组件\n\
  - 日期\n- 链接\n- 图像\n- 列表\n- 数字\n- 范围\n- 文本\n- 切换\n- 导航\n\n当你点击编辑器右上角的下拉箭头时，你有以下选项：\n\
  \n- **在新标签页中克隆：** 在新标签页中创建当前仪表板的克隆。\n- **仪表板属性：** 常规选项和小部件默认属性。\n- **选择初始值**：设置仪表板的默认筛选器和分面值；这些值将在每次打开仪表板时应用。\n\
  - **对话**：允许你使用日常对话语言查询数据。需要启用此功能并为用户分配正确的权限，用户才能查看和使用此功能。\n- **连接数据源**：使用公共字段联接数据源。\n\
  - **删除**：永久删除仪表板。\n\n现在是时候充实你的仪表板了。\n\n### 创建仪表板并放置小部件\n\n向您展示如何构建仪表板并帮助您熟悉仪表板编辑器的最佳方式是引导您完成一个简单的仪表板构建。\n\
  \n### 创建销售仪表板\n\n我们将基于**My First Analytics App**中的**Opportunities**数据集创建一个销售仪表板。请按照以下步骤操作：\n\
  \n1. 点击画布右侧的**Create Query**按钮创建一个新查询。\n2. 在**My First Analytics App**中选择**Opportunities**数据集。这将把你带到一个熟悉的视图，该视图几乎与lens相同。\n\
  3. 在左上角看到铅笔图标的位置，将查询重命名为**Pipeline by Close Date**。\n4. 将度量（**条形长度**）更改为**Sum of\
  \ Amount**。\n5. 为**Close Date (Year-Month)**添加分组（**条形**）。\n6. 在最右侧，点击图表图标，并将图表类型更改为**DATES\
  \ & TIMES**类别中的**Time Bar**。\n7. 为**Closed**添加一个筛选器，使其等于**False**的值（即开放机会）。\n8.\
  \ 点击**完成**，关闭窗口。\n\n   该查询现在出现在右侧查询列表中的**Opportunities**数据集下。\n\n9. 将查询拖到画布上。这将创建一个图表小部件。\n\
  10. 通过拖动控制柄放大小部件。\n11. 点击**保存**保存你的仪表板。\n\n\n\n\n请注意，前述步骤所获得的结果也可以通过从左侧菜单将图表部件拖放到画布上来获得。\n\
  \n仪表板现在应如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_209_0.png)\n\n图 8.2 –\
  \ 添加了管道图表的仪表板编辑器画布\n\n### 在销售仪表板上放置部件\n\n当你选择部件时，现在画布右下角有以下几个部件选项可用：\n\n- **Edit\
  \ Query and Widget:** 打开部件进行编辑。\n- **Advanced Editor:** 打开 **Advanced Interaction\
  \ Editor**。这将在 *第 9 章，高级仪表板设计与构建* 中介绍。\n- **Copy widget to clipboard:** 复制部件，以便将其粘贴到此仪表板或任何打开的仪表板中。\n\
  - **Delete Widget:** 删除仪表板上的部件，但不删除查询。\n- **Duplicate Widget:** 复制带有查询的部件并将其添加到仪表板。\n\
  - **View Query Properties**: 在右侧打开查询属性窗口。\n- **Clone Query**: 克隆查询并打开以进行编辑。\n- **Remove\
  \ Query**: 从部件中移除查询并保留其格式，而不将部件从仪表板中移除。\n\n你现在将通过以下步骤编辑管道部件：\n\n1. 在最右侧，单击 **Formatting**（画笔）图标。\n\
