  \ ID 的层级中的所有角色 ID 列为多值。\n\n然后 **Transform** 节点可以在连接中使用，以映射机会记录的所有者 ID 和来自用户角色的用户\
  \ ID，从而确定每条记录的可访问性，如下所示：\n\n![](img/06379e43783b9ddfee45e9da5192efe1_147_1.png)\n\
